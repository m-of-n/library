schema: "library-topic/v1"
id: delegation-models
question: "All four models can bind an email address to a key and can scope a delegate to a name subtree — so what is actually delegated, authority over a name space or authority to make a statement, and who decides where the chain starts?"
owner: davidhsiaotw
status: answered
bears_on:
  - R-M-01
  - R-M-03
  - R-M-04
  - R-M-08
  - R-M-10
  - R-I-01
  - R-I-04
  - R-I-05
  - R-O-02
records:
  - rfc-2692
  - rfc-2693
  - rfc-5280
  - rfc-8551
  - rfc-9580
  - rfc-9804
answer: >
  WHAT IS DELEGATED IS NOT THE SAME THING IN ANY TWO OF THEM, and the question
  as posed by #14 — "can delegation be scoped?" — turns out to be the wrong
  axis. All four families can scope. X.509 has permitted and excluded name
  subtrees (RFC 5280 §4.2.1.10), and for mail they are precise: a constraint
  "MAY specify a particular mailbox, all addresses at a particular host, or all
  mailboxes in a domain", so *@foo.com is expressible as an rfc822Name subtree.
  OpenPGP has a Regular Expression subpacket (RFC 9580 §5.2.3.22) that limits a
  trust signature so that "only signatures by the target key on User IDs that
  match the Regular Expression ... have trust extended". SPKI has four
  star-forms including (* prefix) and (* range) over an ordering of alpha,
  numeric, time, binary or date (RFC 2693 §6.3.1). S/MIME has nothing, because
  it is not a trust model at all. So scoping is not the discriminator, and a
  report built on "ours can scope and theirs cannot" would be wrong.

  THE DISCRIMINATOR IS WHAT THE SCOPE IS OVER. X.509 and OpenPGP both scope
  NAMING authority: Bob is restricted in WHICH NAMES he may certify, and within
  that subtree he is unrestricted — every key usage, every purpose. SPKI and
  ARCH-0001 scope SPEAKING authority: Bob is restricted in WHAT HE MAY SAY, and
  the name space never enters it. That is why RFC 5280 §6.1.4(g) and RFC 2693
  §6.3.1 look like the same algorithm and are not. Both narrow monotonically
  along a chain — X.509 intersects permitted subtrees and unions excluded ones,
  SPKI intersects tags — but one intersection ranges over name subtrees and the
  other over authorizations. Neither X.509 nor OpenPGP can express "Bob may
  speak for *@foo.com ABOUT CODE SIGNING"; X.509 needs extendedKeyUsage and the
  policy tree to get near it, and OpenPGP cannot get near it at all because it
  has no authorization field. This is the sharpest support in the literature
  for R-M-04, and it is a POSITIVE finding about the incumbents rather than a
  dismissal of them: name-subtree delegation is real, deployed and
  under-credited.

  WHERE TRUST STARTS IS THE SAME ANSWER THREE TIMES, AND THE STANDARDS ALL
  DECLINE TO GIVE IT. RFC 5280 §6 says "the selection of a trust anchor is a
  matter of policy" and makes it an input to the algorithm, with §6.2 adding
  that "the selection of one or more trusted CAs is a local decision". RFC 9580
  §5.10 makes the Trust packet local, unexported, and "defined by a given
  implementation". RFC 2693 §1.1 makes the ACL the source of empowerment and
  states that it "has no Issuer (and is not signed)". ARCH-0001's unsigned local
  trust root is therefore NOT a departure — it is the one thing all three agree
  on, and the only honest novelty is that we propose to WRITE IT DOWN as a
  first-class object instead of leaving it to the implementation. #14 should
  retire the "ours is different because the root is unsigned" framing; the
  difference is that ours is specified.

  DELEGATION DEPTH IS A LIVE DISAGREEMENT, NOT A SETTLED QUESTION, and it is
  recorded as a contradicts edge from rfc-9580 to rfc-2693. SPKI considered
  integer depth control, rejected it, and said why: it "was defeated by the
  inability to predict the proper depth of delegation", and since "there is no
  control on the width of the delegation tree, so control on its depth is not a
  tight control on proliferation" (§4.1.3, §4.1.4). OpenPGP shipped integer
  control anyway — a level octet where level n may issue level n-1, with level 2
  being a "meta introducer" — and X.509 shipped it too as pathLenConstraint.
  TWO OF THE FOUR HAVE THE FINER MECHANISM AND SPKI DECLINED IT, so R-M-10's
  boolean is a choice this project has inherited rather than derived, and
  ARCH-0001 should say so. OpenPGP also carries a third axis neither other
  family has: a trust AMOUNT octet, partial below 120 and complete at or above,
  with no composition rule given anywhere in the RFC.

  DELEGATION AS A DISTINCT OBJECT: only OpenPGP and SPKI, and only SPKI
  cleanly. In X.509 the delegation is three flags on the same certificate that
  carries the name binding — cA, keyCertSign, pathLenConstraint — so there is no
  separate object to revoke, scope or audit. In OpenPGP it is a distinct
  SUBPACKET on a signature over a User ID, which is better but still rides on a
  name binding, and this is exactly why R-I-04's "never as AuthzCert unless an
  explicit profile says so" needs that escape hatch written: a level-1 trust
  signature is an authorization-shaped claim on a NameCert-shaped object. SPKI
  separates them structurally into the 5-tuple and the 4-tuple because an
  authorization certificate and a name certificate are "qualitatively
  different" (§6.1, §6.2). ARCH-0001 follows SPKI here.

  REVOCATION, AND THE ONE DESIGN WORTH STEALING. RFC 2692 is the only document
  in the set that states the correctness problem: a minimal CRL "leads to
  non-deterministic program behavior", so it requires that the certificate name
  where its CRL lives, that CRLs carry explicit validity dates, and that those
  dates NOT OVERLAP. RFC 5280 supplies neither the non-overlap rule nor a
  requirement that a certificate point at its own CRL. RFC 9580 goes further
  than either by DEPRECATING delegated revocation — "Applications MUST NOT
  generate such a subpacket" — and replacing it with §13.9's escrowed Revocation
  Signature: Alice pre-signs her own revocation and gives it to a holder. It
  needs no infrastructure, no online check and no policy object, it lets the
  keyholder "constrain what types of revocation the preferred revoker can issue,
  by only escrowing those specific signatures", and the RFC's stated reason for
  the change is a deployment verdict — support for the old mechanism was "uneven
  and unreliable". That is the single most directly reusable mechanism this lane
  found, it bears on R-O-02, and #14 should put it in the table.

  S/MIME IS NOT A FIFTH MODEL AND THE ROW SHOULD SAY SO. RFC 8551 §4 is the
  whole of its position: "This specification does not cover how S/MIME agents
  handle certificates -- only what they do after a certificate has been
  validated or rejected." No delegation, no trust model, no anchor policy; its
  identity model is PKIX's, unchanged. The one S/MIME-specific contribution to
  delegation is §3.8's certs-only message, an envelope with no signature and no
  content whose only job is moving credentials. Writing the row as a restatement
  of the X.509 row in different words would be the main way #14 could go wrong.

  WHAT THIS LANE GIVES #14. Six records that let the report be written without
  ingesting anything further: rfc-2692 and rfc-2693 at summarized with the
  SPKI column and the design-rationale history, rfc-5280 at summarized with
  §4.2.1.10 read in full plus the §6.1.4(g) intersection rule, rfc-8551 at
  summarized with its negative result recorded, rfc-9580 at summarized with
  trust signatures, meta-introducers, regular-expression scoping and escrowed
  revocation, and rfc-9804 already at distilled with the full FX-1 artifact
  set. Alice/Bob/Carol is expressible in three of the four families and the
  report can show the actual syntax for each.

  FOUR THINGS WRITTEN DOWN RATHER THAN QUIETLY FIXED. (1) SDSI was NOT ingested.
  Reading SPKI did not require it — RFC 2693 §2.6 states the local-name and
  name-chaining construct completely enough for the table — but the [SDSI] paper
  and Abadi's "On SDSI's Linked Local Name Spaces" [Ab97] are cited by §2.6/§2.8
  and are not held, so a report arguing about linked-local-name SEMANTICS rather
  than syntax will need them. They stay with #19, as scoped. (2) rfc-8550,
  S/MIME 4.0 Certificate Handling, is held as a STUB and is where S/MIME trust
  actually lives; RFC 8551 §4 even points at the superseded RFC 5750 instead of
  it. It is the next thing to ingest if #14 wants more than "S/MIME inherits
  PKIX". (3) The claim that nobody uses X.509 name constraints is supported only
  by SECONDARY sources — the EFF SSL Observatory thread of April 2011 finding
  two such certificates, Mozilla's CA:NameConstraints policy page, and an
  openssl-dev nameConstraints bypass report (openssl.org #3502, May 2016) — and
  by no dated survey this library holds. The same is true of OpenPGP, where
  dev.gnupg.org T6238 records that the domain restriction fails for a key with
  only an email address. If #14 wants "and nobody runs it" to be load-bearing it
  needs a measured study, and that is a real ingestion gap. (4) rfc-2693 sits in
  authorization-reduction and rfc-9804 in canonical-encoding, and BOTH topic
  fields were left alone. The field is single-valued, and a silent reassignment
  is worse than an overlap that is written down: this topic lists them in its
  records, their own records do not point here, and that is deliberate.
