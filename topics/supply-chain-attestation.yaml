answer: >
  PARTIAL, from the 2026-11-01 #45 batch. Eight other records in this topic are
  not covered here. The question's premise holds for the deployed stack and
  overstates the research. Every incident held here passed its evidence checks.
  SUNBURST carried a valid SolarWinds signature (fireeye-sunburst), and SUNSPOT
  swapped source beneath a clean repository (crowdstrike-sunspot). The xz
  tarballs were signed by the account releasing them (tukaani-xz-backdoor), and
  Mini Shai-Hulud attestations were valid and named the right workflow
  (slsa-2026-mini-shai-hulud). In event-stream and xz the attacker was given
  authority, and nothing recorded that grant (event-stream-issue-116,
  cox-2024-xz-timeline). The projects say so themselves. sigstore-threat-model
  calls its guarantees minimal and leaves whom to trust to user policy, and the
  SLSA post separates evidence from policy. WHAT THE PREMISE MISSES: entitlement
  statements do exist. An in-toto layout grants named keys named steps
  (in-toto-2019), TUF delegations scope keys to paths (tuf-spec), and gittuf
  policy says who may write what (gittuf-2025). They are scoped to one project
  or repository, and the piece the ecosystem adopted from in-toto is the
  attestation half. So the gap is a portable, consumer-verifiable entitlement,
  not the idea of one. PyPI's trusted publishing is an entitlement decision no
  consumer can see (pypi-trusted-publishers). The closest thing to delegation
  in SLSA, a VSA, is expressed only as consumer configuration (slsa-vsa-1-2).
  A caveat for our own design: none of this stops a patient attacker who is
  legitimately granted authority. Explicit delegation makes that grant visible,
  and thresholds make it harder, but neither makes it wrong.
