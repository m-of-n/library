schema: "library-topic/v1"
id: deterministic-cbor-profiles
question: "Do the emerging deterministic CBOR profiles converge, and which one should a key-centric profile cite rather than invent?"
owner: unassigned
status: open
bears_on:
  - DEC-002
  - R-O-03
records:
  - draft-ietf-cbor-cde
  - draft-ietf-cbor-serialization
  - draft-mcnally-deterministic-cbor
  - ipld-dag-cbor
answer: >
  ipld-dag-cbor joined on 2026-10-08. Its record.yaml had pointed at
  canonical-encoding since ingestion while this topic's own answer already named
  DAG-CBOR as one of the four incompatible profiles, so the pointer was simply
  stale; it is a deterministic CBOR profile in production use and belongs to the
  convergence question, not the conditions question.

  Split out of canonical-encoding on 2026-10-03. That topic asks what must hold
  for an encoding to be safe to sign and to name, which is a question about
  CONDITIONS. These three drafts ask which existing profile to adopt, which is a
  question about CONVERGENCE, and the answer to the first does not depend on the
  answer to the second. Keeping them together made canonical-encoding
  uncloseable, because close-topic requires every owned record distilled and
  each of these is a draft under FX-1.

  Why it matters. RFC 8949 §4.2 is an encoder-side rule that leaves fourteen
  decisions to the application, enumerated with negative fixtures in the FX-1
  extraction of rfc-8949. Four mutually incompatible profiles grew in that gap,
  namely §4.2.1 core, CTAP2 canonical, DAG-CBOR and dCBOR, and the CBOR WG is
  now writing CDE to close it. R-O-03 says a canonicalisation algorithm SHALL be
  cited rather than silently invented, so if DEC-002 lands on CBOR, this topic
  decides WHAT we cite. The live risk is inventing a fourth-and-a-half profile
  by accident, which is what the rcbor spike currently is.

  Open. No record here is past `fetched`.
