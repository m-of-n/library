answer: >
  PARTIAL, as of 2026-11-01, and open: this is what the batch's summary-bar
  reading supports, not an extraction. WHAT IT ADDS: a key alone proves possession.
  A hardware root binds that key to something a verifier cares about: that it
  cannot leave a device (tcg-tpm2-keys-device-identity 3.3), or that it could only
  exist if a measured chain booted (tcg-dice-hw-requirements,
  tcg-dice-implicit-identity, tcg-dice-layering). It also fixes a signer for
  measurements a target cannot forge about itself (rfc-9334 12.1.1). WHAT THAT
  RESTS ON: a third party. tcg-tpm-2-0-library-184 Part 0 4.4.4.4 says an EK not
  certified by a trusted entity is no different from a software key. So the
  addition is a vendor's statement, reached through a vendor's chain: Intel
  (intel-tdx-whitepaper), AMD (aws-snp-attestation, sev-snp-primer-2026), Apple
  (apple-app-attest, with its server in the protocol). A root that fails fails
  silently: tcg-dice-implicit-identity 5 says DICE's misbehaviour cannot be
  detected, and sev-snp-primer-2026 6.3.1 reports forged reports after a Milan
  seed extraction, a claim taken from that primer and not checked against its
  citation. WHAT IT STILL DOES NOT PROVE: that the code is correct, or uncompromised
  after launch (sev-snp-primer-2026 6.7, which calls a measurement an identity and
  not a behaviour); that claims are believable from the format alone (rfc-9711 9.1);
  that a log is honest (tcg-integrity-event-log, only the quote is signed); or that
  an OS was unmodified (apple-app-attest, which offers a risk metric). COST: identity
  from state changes on update, so firmware update re-keys (tcg-dice-implicit-identity
  8.3.1). Privacy needs a separate answer (brickell-2004-daa, tcg-tpm2-keys-device-identity
  11). No certificate path is agreed: X.509 throughout TCG, while google-open-dice
  permits CBOR. Encoding is unsettled too: draft-ffm-rats-cca-token 4.11.1 refuses
  preferred serialization where rfc-9711 6.4 requires it. NOT COVERED: ARCH-0001 has
  no requirement for hardware evidence, so bears_on links are to general rules.
  iso-iec-11889-2015 stays a stub because the standard is paywalled. Several long
  specifications were read by section; each record's Limits says which.
