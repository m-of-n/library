answer: >
  PARTIAL, as of 2026-11-01, and open: this is what the batch of records read so
  far supports, not a market survey. WHO GOVERNS: the extension points split
  across bodies. ietf-cbor-wg holds the CBOR line and reviews tag work case by
  case, and its charter says narrow proposals may go elsewhere. ietf-cose-wg holds
  COSE under a charter that excludes key management and identity binding.
  Protocol work on top sits in other groups: LAKE (rfc-9528, rfc-9529) and CoRE
  (rfc-9254, rfc-9668, rfc-9997). Neither charter sets allocation policy, which
  needs iana-cbor-tags. WHO SHIPS: constrained IoT is the stated home of EDHOC and
  YANG-CBOR, and rfc-8812 shows WebAuthn, CTAP and TPM attestation forcing COSE
  registrations after deployment. WHOSE CODE: open source EDHOC exists in Rust, C
  and Python (rfc-9528), and CORECONF in Python, C and Rust (rfc-9254). No
  deployment figures were gathered. NOT COVERED: market share, commercial stacks,
  iana-cbor-tags and iana-cbor-simple-values.
