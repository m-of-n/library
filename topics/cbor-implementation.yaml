answer: >
  PARTIAL, as of 2026-11-01, and open: this is what the 14 records written in the
  #45 batch support, on top of the extracted core (rfc-8949, rfc-9052, rfc-9053),
  not a survey of implementations. MAP ORDER: rfc-7049 section 3.9 is length-first
  and rfc-8949 section 4.2.1 is bytewise, so "canonical CBOR" in a library or
  profile has to be checked, not assumed. TAGS: determinism does not come from the
  generic rules alone. rfc-8746 hands the choice to the protocol, rfc-9581 defines
  no deterministic form, rfc-9090 needs tag knowledge to pick 112 over 111, and
  rfc-9164 needs its own decoder checks. ADR-0004 avoids all of this by forbidding
  tags natively. DECODERS: rfc-9090, rfc-9164 and draft-ietf-cbor-packed each show
  a malformed or crafted input a decoder has to refuse. COSE EXPORT: rfc-9864
  deprecates ES256, ES384, ES512 and EdDSA in favour of fully specified values,
  rfc-9995 gives a COSE_Sign1 over a digest, and rfc-9459 shows why an algorithm
  allow-list is needed. NOT COVERED: conformance of any named library was not
  tested, and the records' Implementations sections are search hits, not reviews.
