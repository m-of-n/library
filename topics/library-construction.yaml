answer: >
  Partly answered; all six records are read to the summary bar (2026-11-01,
  library#45), and the topic stays open because T-023 and docs/construction.md
  are not settled by them.

  Method: kitchenham-charters-2007 is conduct, prisma-2020 is reporting and
  explicitly not conduct, and wohlin-2014-snowballing is the search. They were
  written for reviews of empirical studies, so their quality and synthesis
  stages transfer poorly to a library of standards. index/frontier.md
  mechanises only the backward half of snowballing. A PRISMA "record" is a
  title or abstract; our record is what PRISMA calls a report.

  Interchange: bin/export validated 442 of 442 items against the pinned
  csl-data.json, but the schema's README says it is not yet fully normative,
  and bin/export writes no authors. The schema's `custom` object could carry
  typed relations; no round trip was tested.

  yaml-1-2-2 and strictyaml-why moved here from canonical-encoding on
  2026-10-08. YAML was not a DEC-002 candidate — the four options were
  canonical S-expressions, CBOR, JSON with JCS, and a dual canonical form.
  YAML 1.2.2 is the spec our authored record sources are written in, and the
  StrictYAML critique states the type-inference hazards that any reader of
  those sources has to avoid — including this repository's own mini-YAML
  reader in bin/_yaml.py, whose comment handling was repaired in
  library#43/#48.

  Correction, 2026-11-01. The 2026-10-08 note said these two bear on DEC-002
  only by analogy. That no longer holds: mofn SPEC-0002 §11 makes YAML the
  human-review form of a statement under the DEC-002 decision (ADR-0004),
  converted one-to-one with the signed bytes. The bearing is on that form, not
  on the choice of encoding. Reading them also changed the Norway claim: it is
  PyYAML's behaviour, not YAML 1.2's, so strictyaml-why and yaml-1-2-2 now
  carry `contradicts`.
