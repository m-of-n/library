schema: "library-topic/v1"
id: library-construction
question: "How should this library itself be built?"
owner: S2
status: open
bears_on:
  - T-023
records:
  - yaml-1-2-2
  - strictyaml-why
answer: >
  Not yet answered; this topic holds records rather than a finding so far.

  yaml-1-2-2 and strictyaml-why moved here from canonical-encoding on
  2026-10-08. Both carry bears_on DEC-002, which is why they were filed under
  canonical-encoding at ingestion, but YAML is not a DEC-002 candidate — the
  four options are canonical S-expressions, CBOR, JSON with JCS, and a dual
  canonical form. Their live relevance is to how this library is built: YAML
  1.2.2 is the spec our authored record sources are written in, and the
  StrictYAML critique states the type-inference hazards (the Norway problem)
  that any reader of those sources has to avoid — including this repository's
  own mini-YAML reader in bin/_yaml.py, whose comment handling was repaired in
  library#43/#48. They bear on DEC-002 only by analogy, and an analogy is not
  evidence for an encoding decision.
