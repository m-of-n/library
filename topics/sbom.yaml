schema: "library-topic/v1"
id: sbom
question: "What does an SBOM prove about an artifact, and which of its claims survive being signed by a principal named by its key?"
owner: Ndewedo-Newbury
status: answered
bears_on:
  - R-M-07
  - R-M-11
records:
  - cisa-framing-software-component-transparency
  - cyclonedx-1-7
  - iso-iec-5962-2021
  - ntia-sbom-minimum-elements
  - spdx-3-0-1
  - sp-800-161r1
answer: >
  Almost nothing, and much less than the signature suggests. An SBOM is a
  DESCRIPTION OF COMPOSITION AUTHORED BY WHOEVER RAN THE TOOL, and both
  regulator records say so outright. NTIA's "Author of SBOM Data" is "just the
  source of the descriptive data", which may be the supplier, an upstream
  supplier, or a third-party binary analyser. The author is not the supplier and
  is nowhere claimed to be.

  At the minimum tier the description does not bind to bytes. NTIA's seven
  minimum fields identify a component by supplier string, component string,
  version string and optional CPE/PURL/SWID, all of them NAMES and none derived
  from content, while the cryptographic hash sits in "Beyond Minimum Elements"
  under an argument against its own placement, that "a hash is a key foundation
  for using SBOM to have trust in the software supply chain." CISA's 2024 third
  edition moves it to MINIMUM EXPECTED (§2.2.2.5) and is the strongest agreement
  with R-M-07 anywhere in this literature. The residual gap is measurable rather
  than rhetorical. That hash is conditional on availability ("indicate as
  unknown"), admits MD5 and SHA1 until 2030, and is scoped by whatever the
  author chose to bound as a Component, since "Suppliers and Authors choose how
  to define Components, which in turn defines the scope of the hash." Two
  conformant SBOMs of one artifact can share no hash at all.

  Signing is where the answer turns. Both regulators require the capability and
  neither specifies a mechanism. NTIA §V encourages exploration, CISA §2.4 asks
  that authors sign and consumers verify, and neither names an envelope, an
  algorithm, or a key-binding. The formats then diverge, CycloneDX carrying an
  inline signature object (ECMA-424 §6.18) where SPDX 3.0.1 leaves signing to an
  external envelope. So what a signature by a principal named by its key
  establishes is NARROWER THAN THE DOCUMENT IT COVERS. It survives as the claim
  that this key emitted this byte string at this timestamp, and, where a
  component carries a digest, that this key vouched for that digest. It does not
  survive into the claim that a named component is the component actually
  present, because there is no digest at the NTIA floor and a best-effort one at
  CISA's; nor that the supplier agrees, because the author need not be the
  supplier; nor that the list is complete. That last one is designed rather than
  overlooked. CISA §2.2.2.6.4 defaults relationship completeness to Unknown and
  names the reason, that "this default value implies the open-world ontological
  assumption", so a signature over an SBOM can never prove a negative, and
  "prove the negative that a given component is not on an organization's
  network", the use case NTIA §III itself names, is unreachable by signing
  alone. NTIA compounds it by asking that consumers be "explicitly tolerant of
  the occasional incidental error."

  The form is the one artifact-statements already found missing in vCon. An SBOM
  is a B-has-C payload with no A, where the JWS or JSF proves a key handled the
  bytes rather than that any principal asserts the composition. in-toto and DSSE
  supply exactly the missing A, a typed statement with a named asserter over a
  digest-identified subject, and neither regulator record references them. For
  R-M-11 this settles the third ArtifactId mode. A structured description of
  composition identifies an artifact only as well as the digests inside it, so
  R-M-07's at-least-one-digest is not a restatement of existing practice but the
  thing that makes the mode work at all. Reading SLSA provenance against this is
  stage 3 of #19, and the comparison to make there is that provenance claims HOW
  an artifact was built, which is falsifiable against a builder, where an SBOM
  claims WHAT IS IN IT, which is falsifiable against nothing the SBOM carries.
