answer: >
  PARTIAL, 2026-11-01. The records answer the first half and only frame the
  second. WHO ALLOCATES TODAY: in the Web PKI, whichever of about 50 CA owners
  a certificate happens to chain to, for any name, unless a constraint says
  otherwise, and on the re-run of 2026-11-01 only 31 of 1,758 disclosed
  intermediates carry one, 2 of them critical
  (survey-2026-nameconstraints-measurement). The actual gatekeepers are root
  programs acting by removal and by date (google-2016-wosign,
  google-2017-symantec, mozilla-2013-turktrust, mozilla-2013-anssi), which sit
  outside the certificate. RFC 1422 tried structural allocation by DN
  subordination, at the cost of one global root, and X.509 1988 section 6.3
  states global naming as a trust assumption. DIDs move allocation rather
  than remove it: w3c-did-extensions-methods lists 274 method names in one
  registry. THE COST OF KEY-RELATIVE ALLOCATION is not measured by anything
  here. did-key-method shows one bill, no rotation and no deactivation, and
  zooko-2001-names shows another, names that humans cannot memorise unless a
  local agent translates them. Name-constraint semantics are hard to implement
  correctly whoever allocates (go-nameconstraint-cves,
  openssl-2022-email-overflow, rfc-9618), so tag intersection under R-M-08
  needs a cost bound as well as a definition. Revocation is the other half of
  governance, and rfc-9608, cabforum-sc063 and cabforum-tls-br all move
  toward short validity, as R-O-02 prefers, though langley-2014-revchecking
  makes that case for interactive TLS and not for signed artifacts checked
  later.
  OPEN: a usability or operational cost for key-relative names, which no
  record in this topic measures.
  CORRECTIONS FOR mofn R-001, found while reading sources. Section 4.5
  overstates mozilla-bug-856060, and needs a new source or dropped wording
  for eff-2010-ssliverse's "least trustworthy" quotation (4.8), Symantec
  caught by CT (4.8), and TURKTRUST caught by pinning (4.8). Details are in
  each record's Limits.
