schema: "library-topic/v1"
id: canonical-encoding
question: "What must hold for a canonical encoding to be safe to sign, and to derive a stable identifier from?"
owner: S1
status: active
bears_on:
  - DEC-002
  - DEC-003
  - R-M-02
  - R-M-11
  - R-O-05
records:
  - draft-ietf-cbor-cde
  - draft-ietf-cbor-serialization
  - draft-mcnally-deterministic-cbor
  - rfc-8949
  - rfc-9804
  - secure-systems-lab-dsse
answer: >
  Six conditions, in two groups, and the rule proposed to cover them reaches
  only the first group. The question was widened on 2026-10-03 because the
  evidence pointed at a stronger claim than the original wording admitted, per
  close-topic. The original asked only what must hold to SIGN. Signing turns
  out to be the easy half.

  TO BE SAFE TO SIGN, four conditions. (1) The encoding is INJECTIVE over the
  values it encodes, not merely deterministic. (2) The decoder REJECTS
  non-canonical input rather than normalising it. (3) Canonicalisation runs
  once, at authoring, on trusted input, and never as part of verification. (4)
  The encoding profile is named by an authenticated type indicator carried
  inside the signed bytes. R-O-05, proposed in ARCH-0001-PROPOSAL-v0.2.0 §3.4,
  delivers (3) and (4) and assumes (1) and (2).

  TO BE SAFE TO DERIVE AN IDENTIFIER FROM, two further conditions that RFC 8949
  does not supply and that no document of ours currently states. (5) Set-valued
  fields carried in arrays have a defined canonical order. (6) Text that is
  load-bearing for identity has a declared Unicode normalisation rule, or an
  explicit refusal to normalise with rejection on encountering an unnormalised
  form. Conditions (5) and (6) are where this topic earns its place, and
  neither is reachable by R-O-05, because at an identifier there are no
  received bytes to verify verbatim. The digest IS produced by canonicalising.

  DETERMINISM IS NOT UNIQUENESS, and RFC 8949 §4.2 offers only the former. It is
  an ENCODER-side rule. A conforming encoder emits the same bytes for the same
  item, which says nothing about whether some other byte string also decodes to
  that item, and a conforming DECODER accepts non-deterministic input happily.
  The full FX-1 extraction of RFC 8949 settles the scale of the gap with a
  fourteen-row table of what §4.2 leaves to the application, each row carrying a
  negative fixture — the choice between §4.2.1 bytewise and §4.2.3 length-first
  ordering over eight keys the RFC itself orders both ways, tag presence, float
  presence and shortening, integer-versus-float for integral values, NaN,
  negative zero and subnormals, integer range, duplicate keys, key equivalence,
  map key types, invalid UTF-8, and per-kind invalid-item handling. Four
  mutually incompatible profiles grew in that gap, which is why the CBOR WG is
  now writing CDE and dCBOR at all. "Use deterministic CBOR" does not specify an
  encoding.

  R-O-05 answers the DSSE critique rather than dodging it. That critique is
  sound and documented. Canonicalising at verification time forces the verifier
  to parse untrusted input BEFORE authenticating it, canonicalisation schemes
  have been broken before, and a canonical form with no authenticated type lets
  a signer produce in one encoding what a verifier reads as another. The DSSE
  answer was Pre-Authentication Encoding, which signs the exact bytes with the
  payload type length-prefixed alongside, and which abandons canonical form
  entirely. R-O-05 takes the ordering and keeps the form. The spike under
  prototype/statements already implements it, in that sign() calls encode() once
  and verify() re-MACs the payload as received and never calls encode() at all.
  So the DSSE critique costs us nothing to honour, and honouring it buys back
  the two capabilities DSSE gave up, namely R-M-11 description-mode identifiers
  and P4 domain hashes, both of which need a canonical form to exist.

  CONDITION (2) BELONGS TO ARCH-0002 P5 RATHER THAN TO A NEW REQUIREMENT. P5
  already reads as validity checked and unknown rejected, with encoder and
  verifier both obliged to reject, and the RFC 8949 extraction already routes
  three of its fourteen rows through P5 — decoder rejection of indefinite
  lengths, duplicate keys forcing the §5.3 error-and-stop choice, and mandatory
  UTF-8 verification. The only stretch is that P5 as drafted speaks to unknown
  CONTENT while condition (2) speaks to a non-canonical SERIALISATION of known
  content, an indefinite-length map with correctly sorted keys having no unknown
  field while still being non-canonical. Extending P5's scope by a clause is
  cheaper and truer than minting an R-O-07, and it keeps one principle rather
  than two half-principles. Recorded here as the recommendation; the amendment
  itself is a propose-arch change in the m-of-n repository and is not made from
  the library.

  THE GAP IS IDENTITY, NOT PAYLOADS, and the extraction supplies two concrete
  failures where this topic previously had only an argument. First, array
  element ordering. §4.2.1 canonicalises map KEY order and nothing else, and
  RFC 8949 deliberately supplies no canonical order for array elements, because
  major type 4 arrays are ordered by definition and their order is semantic. But
  several of our constructs are logical SETS carried in arrays — Threshold
  members under ARCH-0001 §4.1, a tag's value set under DEC-004, and above all
  P4's set of schemas serialised in a form that can be repeatably hashed. Two
  parties that build the same set in different insertion orders get different
  hashes and, under P4, conclude they hold different vocabularies. The rcbor
  spike does NOT close this, since it sorts map keys and preserves author order
  for arrays, which is correct for sequences and wrong for sets. Second,
  Unicode normalisation. Under P1 a type is a pair of defining key and label,
  §5.6.1 compares text strings byte by byte, and §3.1 requires UTF-8 while
  saying nothing about normalisation form, so two labels a human reads as
  identical are silently two different types. RFC 8949 cannot be faulted for
  either; P1 and P4 create both hazards by making a text string and a set hash
  load-bearing for identity.

  So R-M-02 makes uniqueness a NAMING requirement and not only a
  signature-integrity one, and a collision on the identity path is not a
  verification failure but two distinct principals sharing one name, or two
  distinct vocabularies sharing one identifier. That is the finding, it is
  stronger than the question originally asked, and it is why the question was
  widened rather than answered narrowly.

  Costs per candidate. RFC 8785 (JCS) fails condition (1) at numbers. It
  canonicalises only values representable as IEEE-754 doubles, serialising them
  by the ECMAScript shortest-round-trip rule for Number toString, and directs
  anything outside that, such as integers past 2^53 and high-precision decimals,
  to be carried as strings instead. A threshold k or a validity instant that does
  not survive a double round-trip is outside the scheme. JCS also has no
  byte-string type, so every digest becomes hex or base64 text, and no native
  authenticated type indicator, which is why DEC-002 option 3 must pair it with
  DSSE. It does sort object members, so it addresses (1) for maps while leaving
  (5) and (6) untouched. CBOR under §4.2 satisfies (1) only after a profile pins
  the fourteen open rows. Library availability is the best of the candidates but
  conformance claims are unreliable, in that QCBOR 1.x does not sort map keys,
  kotlinx serialization-cbor defaults to indefinite lengths, and serde_cbor is
  deprecated and unpatched under RUSTSEC-2021-0127. COSE supplies (4) natively
  but through centrally allocated header parameters, which R-M-12, accepted as
  ARCH-0002 P1 via ADR-0001, excludes from the native model, and hence proposed
  option 5. RFC 9804 canonical S-expressions satisfy (1) BY CONSTRUCTION, being
  length-prefixed, with no optional whitespace, no alternative integer widths,
  and no map type at all, so no key-ordering question arises. Its §3 split of
  canonical-for-signing from advanced-for-display is the architectural ancestor
  of R-O-05. The cost is ecosystem, ARCH-0001 §3.1 already records it as not
  selected and the proposal records it as historical, and it lacks (4), since a
  leading token is convention rather than an authenticated field. No candidate
  supplies (5) or (6); every one of them leaves both to the profile.

  The cheapest route to condition (1) found in this reading is EXCLUSION rather
  than harder canonicalisation. The rcbor spike reaches it by removing the hard
  cases, with no floats, so the JCS number problem cannot arise, no tags, per
  R-M-12, definite lengths only, smallest-form integer heads, map keys sorted
  bytewise on their ENCODED form per §4.2.1, and duplicate encoded keys rejected
  rather than resolved, which closes the duplicate-key hole JCS leaves open. The
  cost is expressiveness, in that a decimal must be carried as an integer or a
  string. Exclusion does not reach (5) or (6), which are additions rather than
  removals, and that asymmetry is worth naming — a reduced profile buys signing
  safety by deleting cases and cannot buy naming safety the same way.

  Three defects in the spike are evidence for the identity-path gap rather than
  incidental bugs. keyid() hashes the key bytes it is handed with NO canonical
  encoding step, so the DEC-003 requirement to specify canonical key bytes
  before hashing is unsatisfied in the only code that exists, and the demo hides
  this because its keys are literal byte strings. Every identifier is truncated
  to 128 bits, a roughly 2^64 birthday bound for something that functions as a
  name under R-M-02, where ARCH-0001 §4.1 parameterises the digest algorithm and
  the spike chose sha-256 truncated to 128 bits silently. And the envelope type
  indicator is a global string naming the rcbor statement profile, which is
  R-M-12-non-conformant, and is the one place the spike does not practise what
  it preaches.

  What would overturn this. If checking canonicality on decode cannot be done
  without re-encoding, then condition (2) drags the canonicaliser of the
  producer back into the verifier, the R-O-05 separation is cosmetic, and DSSE is
  simply right, meaning abandon canonical form, sign received bytes, and
  identify subjects by content digest only. The experiment that settles it is to
  write the decode path in rcbor as single-pass rejection and see whether
  bytewise key order and smallest-form heads are checkable inline. They appear
  to be, and it is untested. Conditions (5) and (6) fall if ARCH-0002 P4 is not
  accepted and Threshold members are treated as an ordered sequence rather than
  a set, since the identity path then loses both its hardest case and its
  text-identity case. DECISIONS-0001 T1-B currently recommends HOLDING P4, so
  this is live, and a decision to drop P4 would shrink this answer back to its
  original four conditions.

  PROVISIONAL. RFC 8949 is fully extracted under FX-1, and the fourteen-row
  table and both identity gaps above are drawn from it. The rest is not. RFC
  8785 has no record at all despite being named in DEC-002 option 3, RFC 9804 is
  queued, the three CBOR profile drafts are fetched, and DSSE is queued and is
  type repo so it needs a summary rather than an extraction. Per close-topic
  step 2 this topic is therefore NOT yet answered, and the claims resting on the
  proposal and on the spike still need their records behind them before the
  status flips.
