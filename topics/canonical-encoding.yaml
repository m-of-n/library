schema: "library-topic/v1"
id: canonical-encoding
question: "What must hold for a canonical encoding to be safe to sign, and to derive a stable identifier from?"
owner: S1
status: answered
bears_on:
  - DEC-002
  - DEC-003
  - DEC-005
  - R-M-02
  - R-M-06
  - R-M-11
  - R-M-12
  - R-O-03
  - R-O-05
records:
  - rfc-8785
  - rfc-8949
  - rfc-9804
  - secure-systems-lab-dsse
answer: >
  Six conditions, in two groups, and the rule proposed to cover them reaches
  only the first group. The question was widened on 2026-10-03 because the
  evidence pointed at a stronger claim than the original wording admitted, per
  close-topic. The original asked only what must hold to SIGN. Signing turns out
  to be the easy half.

  TO BE SAFE TO SIGN, four conditions. (1) The encoding is INJECTIVE over the
  values it encodes, not merely deterministic. (2) The decoder REJECTS
  non-canonical input rather than normalising it. (3) Canonicalisation runs
  once, at authoring, on trusted input, and never as part of verification. (4)
  The encoding profile is named by an authenticated type indicator carried
  inside the signed bytes. R-O-05, proposed in ARCH-0001-PROPOSAL-v0.2.0 §3.4,
  delivers (3) and (4) and assumes (1) and (2).

  TO BE SAFE TO DERIVE AN IDENTIFIER FROM, two further conditions that no
  candidate encoding supplies and no document of ours currently states. (5)
  Set-valued fields carried in arrays have a defined canonical order. (6) Text
  that is load-bearing for identity has a declared Unicode normalisation rule,
  or an explicit refusal to normalise together with rejection of unnormalised
  input. Neither is reachable by R-O-05, because at an identifier there are no
  received bytes to verify verbatim. The digest IS produced by canonicalising.

  DETERMINISM IS NOT UNIQUENESS. RFC 8949 §4.2 is an ENCODER-side rule, and a
  conforming DECODER accepts non-deterministic input happily. Its FX-1
  extraction enumerates fourteen decisions §4.2 leaves to the application, each
  with a negative fixture. Condition (2) is the one nobody writes down. It is
  absent from §4.2, absent from ARCH-0001 §5.3, and absent from the rcbor spike,
  which has an encoder and NO DECODER.

  R-O-05 answers the DSSE critique rather than dodging it, and DSSE's own text
  is friendlier to us than expected. Its objections are that canonicalisation
  forces a verifier to parse untrusted input before authenticating it, that
  canonicalisation schemes have been broken before, and that TWO SEMANTICALLY
  DIFFERENT PAYLOADS COULD HAVE THE SAME CANONICAL ENCODING, which is condition
  (1) stated as an attack. But in DSSE's own design-requirements list these are
  SHOULD, not MUST. DSSE recommends against canonicalisation; it does not forbid
  it. R-O-05, which keeps a canonical form while honouring the ordering, is
  therefore consistent with DSSE's requirements as written. Two DSSE rules are
  worth importing. Its MUST that the same bytes verified are the bytes handed to
  the application, with no re-parsing of the envelope afterwards, closes a gap
  R-O-05 leaves between verifying and acting. A second claim made here earlier, that its
  (t, n) multi-signature envelope gave R-I-03's export target threshold
  semantics and so made R-M-06 cheaper than assumed, is WITHDRAWN as of
  2026-10-08 — see below.

  CONDITION (2) BELONGS TO ARCH-0002 P5 RATHER THAN TO A NEW REQUIREMENT. P5
  already reads as validity checked and unknown rejected, with encoder and
  verifier both obliged to reject, and the RFC 8949 extraction already routes
  three of its fourteen open rows through P5. The only stretch is that P5 as
  drafted speaks to unknown CONTENT while condition (2) speaks to a
  non-canonical SERIALISATION of known content. Extending P5 by a clause is
  cheaper and truer than minting an R-O-07. The amendment is a propose-arch
  change in the m-of-n repository and is not made from the library.

  THE GAP IS IDENTITY, NOT PAYLOADS. For condition (5), RFC 8949 §4.2.1
  canonicalises map KEY order and nothing else, deliberately, because major type
  4 arrays are ordered by definition. RFC 8785 §3.2.3 goes further and says
  array element order MUST NOT be changed. That difference decides more than it
  appears to. Several of our constructs are logical SETS carried in arrays,
  namely Threshold members under ARCH-0001 §4.1, a tag's value set under
  DEC-004, and P4's set of schemas serialised so it can be repeatably hashed.
  Two parties building the same set in different insertion orders get different
  hashes and, under P4, conclude they hold different vocabularies. The rcbor
  spike does NOT close this, since it sorts map keys and preserves author order
  for arrays, correct for sequences and wrong for sets. For condition (6), under
  P1 a type is a pair of defining key and label, RFC 8949 §5.6.1 compares text
  byte by byte, and §3.1 requires UTF-8 while saying nothing about normalisation
  form. RFC 8785 §3.1 is better here than RFC 8949 in one respect, since it
  closes the ambiguity explicitly by requiring that all components preserve
  Unicode string data as is. It is worse in another, because that MUST binds
  parties we do not control and is unenforceable, and because it forecloses
  normalising at canonicalisation time, leaving only normalise-at-authoring plus
  reject-at-decode as a citation-compatible route. The hazard is not theoretical.
  Transcribing this record's own test vectors corrupted U+FB33 HEBREW LETTER
  DALET WITH DAGESH, which has a canonical decomposition that an ordinary
  normalising layer applies silently. Any JCS pipeline containing such a layer
  breaks signatures on exactly that input.

  So R-M-02 makes uniqueness a NAMING requirement and not only a
  signature-integrity one, and a collision on the identity path is not a
  verification failure but two distinct principals sharing one name, or two
  distinct vocabularies sharing one identifier. One asymmetry is worth naming.
  A sort or normalisation divergence fails LOUDLY when signing, as a signature
  mismatch, and SILENTLY when deriving an identifier, where it yields a
  confidently wrong name.

  RFC 8785 IS NOW FULLY EXTRACTED AND THE FINDING IS THAT DEC-002 OPTION 3
  SHOULD BE WITHDRAWN RATHER THAN OUT-SCORED. Four grounds, in descending force.
  First, condition (5). RFC 8949 is SILENT on array order, so a profile may add
  a bytewise rule without contradicting it, whereas RFC 8785 PROHIBITS
  reordering. The canonicalisation we need is therefore a modification of JCS
  rather than a subset of it, and under R-O-03, which requires that an algorithm
  be cited rather than silently invented, a modification is a partly invented
  algorithm. Scoping the citation cannot repair that. Prohibited versus absent
  is the decisive distinction. Second, §5 mandates the ordering R-O-05 forbids.
  Applications MUST parse and check I-JSON, then verify correctness and locate
  the signature property, and only then verify the signature. Appendix F spells
  the same scheme out as parse, save the signature value, REMOVE the signature
  property, re-serialise the remainder, re-canonicalise it, and only then
  compare. Precision matters here. Appendix F carries no BCP 14 keyword
  anywhere, so the contradiction rests on §5 alone, with Appendix F as the only
  worked description of what §5 means. JCS can be used producer-side only, and
  Appendix C licenses exactly that, but Appendix C also concedes it is the
  minority path, and once R-O-05 forces the signature out of the payload JCS
  does no work at verification time at all. Its remaining job is identity
  derivation, which is the job it is worst at. Third, the number algorithm is
  not in the cited document. §3.2.2.3 says the algorithm itself is not included,
  pointing instead at V8 and Ryu, both implementations. Citing RFC 8785 means
  citing three artifacts, one of them an edition of an annually revised
  standard. Citing RFC 8949 §4.2.1 means citing STD 94, complete in itself. That
  is the R-O-03 argument, and it is better than the one from standing. RFC 8785
  being an Independent Submission whose BCP 14 force rests on a single lowercase
  sentence in §2 is true and is weaker evidence. Fourth, option 3's named
  envelope was recorded here as reintroducing a global type identifier, since
  DSSE's payloadType is a media type or URI, which R-M-12 excludes from the
  native model. That fourth ground is now WEAKENED and is the weakest of the
  four; see the DSSE paragraphs below. The first three stand.

  THE NUMBER PROBLEM IS A CONSTRAINT, NOT THE DISQUALIFIER, and an earlier draft
  of this answer had that wrong. Field by field, Threshold k and n, digests,
  counters and Validity at second, millisecond or microsecond resolution all fit
  inside IEEE 754 double precision. The ceiling falls between microsecond and
  nanosecond time and nowhere else in our model. The real hazards are sharper
  and sit elsewhere. Appendix B serialises `4430000000000000`, which is exactly
  2^68, as `295147905179352830000`, a DIFFERENT integer, silently, with a
  signature that verifies perfectly, since the ±9007199254740991 integer range
  is only a SHOULD in Note (1). And Appendix D's remedy of carrying such values
  as JSON strings is itself NOT canonicalised, so Appendix E's own worked
  example shows `"055"` becoming `"55"` and a timestamp gaining `.000` under a
  different parser style, which is condition (1) failing inside the remedy. The
  field the RFC uses to demonstrate it is named `time`, which is our Validity.
  Appendix B also serialises both `0000000000000000` and `8000000000000000` as
  `0`, so positive and negative zero collapse, which is a small but literal
  instance of the hazard DSSE names, sitting in the specification's own sample
  table.

  WHAT IS RECORDED IN OPTION 3'S FAVOUR. It wins namespace governance outright,
  the criterion the v0.2.0 proposal §3.3 says was never scored. JSON has no tag
  space and no header space, and §4 of RFC 8785 reads that the document has no
  IANA actions. Where option 5 must CONSTRUCT registry-freedom by subtraction,
  with a positive rule excluding major type 6, decoder rejection, and a named
  untagged export profile, option 3 is registry-free by construction, and P1's
  displacement of type identity is a no-op in JSON because there is no encoding
  layer to move it out of. It also removes five of RFC 8949's fourteen
  determinism rows. That belongs in the D5 package whichever way the decision
  goes. An earlier version of this answer also claimed JCS leaves a duplicate-key
  hole. It does not. §3.1 requires I-JSON, under which JSON objects MUST NOT
  exhibit duplicate property names, so JCS closes it by constraining input. The
  residual problem is that §5 mandates a duplicate check which Appendix A's
  reference canonicaliser is structurally incapable of performing, because by
  the time it runs the parser has already collapsed duplicates and destroyed the
  evidence.

  The cheapest route to condition (1) remains EXCLUSION rather than harder
  canonicalisation. The rcbor spike reaches it by removing the hard cases, with
  no floats, no tags, definite lengths only, smallest-form integer heads, map
  keys sorted bytewise on their ENCODED form per §4.2.1, and duplicate encoded
  keys rejected rather than resolved. The cost is expressiveness, in that a
  decimal must be carried as an integer or a string. Exclusion does not reach
  (5) or (6), which are additions rather than removals, and that asymmetry is
  worth naming, since a reduced profile buys signing safety by deleting cases
  and cannot buy naming safety the same way.

  Three defects in the spike are evidence for the identity-path gap rather than
  incidental bugs. keyid() hashes the key bytes it is handed with NO canonical
  encoding step, so the DEC-003 requirement to specify canonical key bytes
  before hashing is unsatisfied in the only code that exists, and the demo hides
  this because its keys are literal byte strings. Every identifier is truncated
  to 128 bits, a roughly 2^64 birthday bound for something that functions as a
  name under R-M-02. And the envelope type indicator is a global string naming
  the rcbor statement profile, which is R-M-12-non-conformant.

  What would overturn this. If checking canonicality on decode cannot be done
  without re-encoding, then condition (2) drags the canonicaliser of the
  producer back into the verifier, the R-O-05 separation is cosmetic, and DSSE
  is simply right, meaning abandon canonical form, sign received bytes, and
  identify subjects by content digest only. The experiment that settles it is to
  write the decode path in rcbor as single-pass rejection and see whether
  bytewise key order and smallest-form heads are checkable inline. They appear
  to be, and it is untested. Conditions (5) and (6), and with them the first and
  strongest ground for withdrawing option 3, are CONDITIONAL ON ARCH-0002 P4 and
  on Threshold members being a set rather than a sequence. DECISIONS-0001 T1-B
  currently recommends HOLDING P4, so this is live, and a decision to drop P4
  would shrink this answer back to its original four conditions and would
  restore option 3 to contention.

  OPTION 1 IS NOW SCORED, AND IT IS ON THE RIGHT SIDE OF ALL FOUR GROUNDS THAT
  WITHDRAW OPTION 3. RFC 9804 reached full FX-1 extraction on 2026-10-04, which
  removes the blocker this answer previously named. Condition by condition, with
  the detail in rfc-9804/distilled/design-notes.md §1: (1) injectivity holds at
  the encoding layer, by GRAMMAR rather than by algorithm — the canonical form is
  two ABNF productions in §7.2, with no sort step, no normalisation step and no
  number algorithm, which is the smallest attack surface of any candidate by a
  wide margin — with one crack on the identity path, since §4.6 neither writes
  out nor strips a default display-hint while §4.7 makes the hint part of
  equality, so one value can have two canonical forms unless a profile forbids
  writing a hint equal to the default. (2) The MECHANISM is there and is better
  than any other candidate's, because the canonical form has its own grammar, so
  a decoder that implements c-sexp and not sexp rejects non-canonical input by
  construction, single-pass, with no re-encoding; the OBLIGATION is absent, since
  nothing requires rejection and §6 in fact obliges an implementation to accept
  the brace-wrapped base-64 form too. (3) Compatible: §10 is the whole security
  considerations section and imposes no verification ordering, and on an ordering
  question silence is permission. This is where option 1 differs most sharply
  from option 3, which MANDATES the ordering R-O-05 forbids. (4) Not supplied —
  no IANA actions, no version field, no media type, no envelope — and the obvious
  substitute is explicitly disqualified, because §4.6 says a display-hint "has no
  other function" than display. The indicator must be built as a convention, a
  distinguished first element of the outer list, which is registry-free and
  key-relative per R-M-12. (5) Not supplied but SILENT rather than prohibiting,
  which under R-O-03 is the decisive distinction. (6) No rule, but no place for a
  normaliser to hide: RFC 9804 has NO TEXT TYPE, so there is no string-processing
  stage for the kind of silent normalising layer that corrupted U+FB33 in this
  topic's own documented incident.

  TWO FINDINGS FROM OPTION 1 CHANGE CLAIMS MADE ABOVE. First, condition (5) IS
  NOT A DISCRIMINATOR between DEC-002 options. Every candidate is silent on
  canonical order for set-valued fields except option 3, which prohibits it. The
  gap is real and it is ours to close under any option; what distinguishes option
  3 is not that it lacks the rule but that it forbids it. Second, the single
  criterion recorded above as option 3's outright win — namespace governance,
  registry-free by construction — OPTION 1 ALSO WINS, by the same argument and
  without paying option 3's §5 cost. Two things stop option 1 from being a
  conclusion: its data model is far poorer, with octet-strings and lists only and
  no integers, maps, booleans or null, so every ARCH-0001 §4 logical type needs
  an application-level mapping where injectivity must be re-established by hand,
  field by field, with no help from the format; and library availability, which
  DEC-002 names as a driver, is its weakest axis.

  WHAT EACH CANDIDATE COSTS, on the three axes the question asks for. This is
  scoring input for DEC-002 and for mofn#8, which names the same axes. No axis is
  decisive alone and nothing here decides anything.

  OPTION 1, canonical S-expressions. LIBRARY AVAILABILITY is its weakest point
  and the worst of the four: Appendix A names a short list that exists to serve
  GnuPG and RNP — GNU Libgcrypt, Ribose RNP sexpp, SexpCode, SFEXP, a Ruby SEXPP
  and an Inferno implementation, two of them with no locator given in the source
  — against ubiquitous CBOR and JSON tooling. There is no general-purpose
  ecosystem. NATIVE AUTHENTICATED TYPE INDICATOR: none, and the display-hint is
  foreclosed for the purpose, so it must be built; but building it is cheap and
  registry-free, because a list element is just an octet-string and there is no
  tag space to negotiate with. IDEMPOTENCE: yes, for the strongest available
  reason — canonicalisation is grammar restriction, not a procedure, so there is
  nothing to run twice. The default-display-hint crack is the one exception and a
  profile rule closes it, with §8 already sanctioning "no display-hints" as a
  restriction applications may adopt.

  OPTIONS 2 AND 5, CBOR with deterministic encoding. LIBRARY AVAILABILITY is the
  strongest of the four and is the only axis our library has actually MEASURED
  rather than cited: rfc-8949's record carries a twelve-entry implementations
  block with versions, licences, languages, audit history and fixed CVEs, in
  which fxamacker/cbor ships Core Deterministic and CTAP2-canonical presets and
  ciborium is the RustSec-recommended replacement for serde_cbor. NATIVE
  AUTHENTICATED TYPE INDICATOR: present in the format and NOT USABLE natively,
  which is the awkward answer. Tags are major type 6 and IANA-allocated, so
  R-M-12 excludes them and private-use ranges give escape rather than
  namespacing; the indicator therefore has to be CONSTRUCTED BY SUBTRACTION — a
  positive rule excluding major type 6, rejection on decode, and a named untagged
  export profile. That is strictly more machinery than option 1 needs, because
  option 1 has nothing to exclude. IDEMPOTENCE: yes for a reduced profile, with
  the caveat that §4.2 is an ENCODER-side rule, so what is idempotent is encode
  after decode, and only where the profile removes the hard cases — no floats, no
  tags, definite lengths only, smallest-form integer heads, map keys sorted
  bytewise on their encoded form, duplicate encoded keys rejected. Fourteen
  decisions are left to the application and are enumerated with negative fixtures
  in the rfc-8949 extraction. Condition (2) remains UNPROVEN IN CODE here, since
  the rcbor spike has an encoder and no decoder.

  OPTION 3, JSON with JCS. LIBRARY AVAILABILITY is narrower than "JSON is
  everywhere" suggests, and the shape of it matters more than the count:
  Appendix G verifies five implementations, in JavaScript, Java, Go, .NET and
  Python, and FOUR OF THE FIVE live in one author's repository. Our library
  records no independently assessed implementations block for rfc-8785, unlike
  rfc-8949, so on this axis we are citing the source rather than measuring. The
  sharper finding from the extraction is that every Appendix G implementation is
  built for the Appendix F flow, so a deployment that reaches for a JCS signature
  library rather than a JCS canonicalizer imports §5's ordering INVISIBLY, with
  no warning at any API boundary. NATIVE AUTHENTICATED TYPE INDICATOR: none in
  JSON, which is the same fact as its namespace-governance win — no tag space and
  no header space means nothing to make key-relative and nothing to supply an
  indicator either. It comes from the envelope instead, and DSSE's payloadType is
  authenticated inside the signed bytes by PAE. IDEMPOTENCE: yes — and the
  question misleads on this candidate, so answer it precisely. JCS IS
  IDEMPOTENT: run it on its own output and nothing changes. What fails is
  INJECTIVITY, on the first pass. Appendix B serialises the double at hex
  4430000000000000, exactly 2^68, as 295147905179352830000, a different integer,
  silently, with a signature that verifies perfectly; the same table collapses
  positive and negative zero to 0. Appendix D's remedy of carrying such values as
  JSON strings is itself not canonicalised, and Appendix E's own worked example
  shows "055" becoming "55" and a timestamp gaining .000 under a different parser
  style. Stable on re-application, lossy on application. For condition (1) that
  is WORSE than non-idempotence would be, because non-idempotence is loud and
  lossiness is silent.

  OPTION 4, dual canonical with a documented bijection. LIBRARY AVAILABILITY is
  nominally the union and therefore the best, but it requires both toolchains
  plus the bijection, which no ecosystem supplies and which would be written and
  maintained here. NATIVE AUTHENTICATED TYPE INDICATOR: the worst position of the
  four, because with two live profiles the indicator must be injective over the
  (profile, bytes) PAIR rather than over bytes, and this is exactly the failure
  the DSSE attack notebook demonstrates. IDEMPOTENCE: per-side as above, plus an
  obligation no other option carries — round-trip stability across the two
  canonical forms, idempotent in both directions. And a bijection between a spec
  that PROHIBITS array reordering, RFC 8785 §3.2.3, and one that is SILENT on it,
  RFC 8949 §4.2.1, has to pick a side on condition (5) and therefore cannot be
  faithful to both.

  THE RANKING THE THREE AXES PRODUCE IS NOT THE RANKING THE SIX CONDITIONS
  PRODUCE, and that is the useful result. Option 1 wins idempotence and the type
  indicator cheaply, and loses library availability badly. Options 2 and 5 win
  library availability outright and must construct a type indicator by
  subtraction. Option 3 is ecosystem-rich and registry-free and is the only
  candidate that PROHIBITS what condition (5) needs. Option 4 is dominated on
  every axis. DEC-002's own driver list includes library availability, so the
  axis option 1 loses is a named driver and not a detail.

  DSSE IS NOW READ IN FULL, AND TWO CLAIMS ABOVE ARE WITHDRAWN OR WEAKENED.
  envelope.md and the worked attack notebook — the gap this answer previously
  named — were read on 2026-10-08 at the pinned commit, with the archive digest
  re-verified. WITHDRAWN: the (t, n) envelope does NOT carry threshold
  semantics. The sentence this answer quoted continues "where t is
  application-specific", so t is a verifier-side parameter supplied out of band
  and not a field, the envelope schema carries only payload, payloadType and
  signatures, and envelope.md adds that multiple signatures are "equivalent to
  separate envelopes with individual signatures". A DSSE envelope carries n and
  cannot carry k. R-M-06's interchange story is therefore exactly as expensive as
  it looked before DSSE was read: k and the member set must travel INSIDE the
  signed payload under every DEC-002 option. Worse, because the envelope is
  declared equivalent to separate envelopes, an intermediary may legitimately
  split or merge them, so any threshold meaning inferred from how many signatures
  are present is not merely absent but unsafe to infer. WEAKENED: option 3's
  fourth ground. payloadType is only RECOMMENDED to be a media type or URI — a
  SHOULD — and envelope.md explicitly licenses coding it "as a shorter string or
  enum", which PAE authenticates just as well. So DSSE does not FORCE a centrally
  allocated identifier; its default recommends one, and the cost of declining is
  ecosystem divergence rather than non-conformance. The ground survives as the
  weakest of the four rather than falling.

  TWO NEW DSSE FINDINGS, NEITHER OF WHICH THIS TOPIC CAN SETTLE. First,
  envelope.md requires that consumers "MUST ignore unrecognized fields", which is
  the OPPOSITE default to ARCH-0002 P5's reject-unknown, at the envelope layer
  only — unsupported payload TYPES are rejected, so the collision is confined to
  unknown sibling fields of payload, payloadType and signatures and does not
  touch the payload interior. A conforming DSSE export boundary therefore cannot
  enforce P5 on the envelope exterior, and no document of ours states which
  reading holds. That belongs with the P5 amendment this answer already routes to
  ARCH-0002. Second, DSSE's KEYID is unauthenticated and "MUST NOT be used for
  security decisions", which is the exact opposite of our KeyId, which under
  R-M-02 IS the principal's name. The terms collide and the failure is quiet: a
  mapping table written under R-I-01 that lines up the two because they share a
  name would put the principal's name in the one envelope field DSSE forbids
  relying on. The rule for any export profile is that the principal travels in
  the payload, never in signatures[].keyid.

  THE ATTACK NOTEBOOK SHARPENS CONDITION (1) IN A WAY THIS ANSWER DID NOT SAY.
  Lodato's September 2020 proof-of-concept is a POLYGLOT payload: injective
  within CBOR and injective within protobuf, yet ambiguous across the pair, with
  payloadType flipped after signing because it sat outside the signature. So
  condition (1) has to hold over the (profile, bytes) PAIR, not over bytes under
  one profile — which makes the authenticated type indicator load-bearing rather
  than belt-and-braces, and makes option 4 the candidate most exposed to it. The
  notebook is the citation behind R-O-05's type-indicator clause and is the
  ancestor of the requirement in a literal sense. DSSE's other contribution is
  the same shape: PAE achieves injectivity of the signed tuple by LENGTH-PREFIXED
  FRAMING rather than by canonicalisation, with no escaping, no ordering rule and
  no normalisation — which is a second route to condition (1) that this topic had
  not named, and the one RFC 9804's verbatim form takes too.

  ANSWERED, with one record deliberately unread and one experiment outstanding.
  Per close-topic step 2, every record this topic OWNS is now distilled: rfc-8949,
  rfc-8785 and rfc-9804 at FX-1 profile full, and secure-systems-lab-dsse read in
  full at its pinned commit, where FX-1 does not apply because it is type repo.
  w3c-rdf-canon-1-0 still carries topic: canonical-encoding and is NOT owned by
  this topic and NOT read, which is a deliberate call and not an oversight: RDFC
  1.0 canonicalises RDF DATASETS, which are unordered sets of triples, so it is
  not a DEC-002 candidate for our tree-shaped statements and cannot become one.
  But it is the one document in the library that plausibly holds PRIOR ART FOR
  CONDITION (5) — a ratified algorithm for canonically ordering a set, including
  the hard blank-node case — so the claim above that no candidate supplies
  condition (5) is scoped to the DEC-002 candidates and should not be read as a
  claim about the state of the art. Reading it is the obvious next step for
  whoever writes the condition (5) ordering rule, and library#56 owns it. The three CBOR profile drafts
  moved to deterministic-cbor-profiles on 2026-10-03, and ipld-dag-cbor joined
  them on 2026-10-08; yaml-1-2-2 and strictyaml-why moved to library-construction
  on 2026-10-08, since YAML is not a DEC-002 candidate and their relevance is to
  how this library is built.

  WHAT THIS UNBLOCKS AND WHO ACTS. The six conditions, the four grounds against
  option 3 and the three-axis costing above are scoring input for mofn#8, which
  narrows DEC-002 and whose acceptance test names library availability, the
  native authenticated type indicator and canonicalisation idempotence among its
  criteria. The condition (2) clause belongs to ARCH-0002 P5 and is a
  propose-arch change in the m-of-n repository, not a library one. The experiment
  that would settle condition (2) for CBOR is to write the rcbor decode path as
  single-pass rejection; RFC 9804 now shows the equivalent is demonstrably
  reachable for option 1, which is the cheapest place to turn the argument into
  evidence. The falsifier recorded above stands unchanged: if checking
  canonicality on decode cannot be done without re-encoding, the R-O-05
  separation is cosmetic and DSSE is simply right.
