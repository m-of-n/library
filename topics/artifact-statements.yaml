answer: >
  Partly, and the gap is narrower and sharper than this topic first recorded.
  vCon maps cleanly onto subject, digest and signature, and its
  extensions/critical mechanism is must-understand implemented - though
  producer opt-in, where ARCH-0002 P5 inverts the default so forgetting is
  safe.

  CORRECTED 2026-10-14 by the FX-1 extraction (library#9). This answer
  previously said vCon never distinguishes the party that assembled a
  container from the party asserting its contents. That is wrong. SS4.4.3
  makes the Attachment Object's party index a MUST, calls it "provenance" in
  that word, and separates the two roles explicitly - "This party is not
  necessarily the document's author, but rather the party that distributed
  the document" - then names the assembler: "an organization that processes
  or constructs the vCon may add attachments ... The organization or entity
  that adds the attachment SHOULD be represented as a Party Object." The slot
  exists, is mandatory, and anticipates the assembler. (The draft does not use
  the words "assembled" or "asserted" anywhere; that framing is ours.)

  WHAT SURVIVES IS STRONGER. The asserter slot is absent exactly where a claim
  about the conversation is made. analysis[] has no party parameter at all -
  only vendor, product and schema, which name SOFTWARE, not anyone who vouches
  for its output. And SS4.1.8 states P2's whole form in prose while providing
  no field for the A: "The assurance of the accuracy of the redaction is made
  by the entity that creates the redaction which SHOULD sign the redacted
  version of the vCon." So vCon has the concept, uses it where it thought
  about provenance, and omits it where someone is asserting something.

  THE SIGNATURE BINDS LESS THAN THE MISSING FIELD IMPLIES. SS5.2 puts x5c/x5u
  in the UNPROTECTED JWS header with a MUST, so the signer's name and trust
  path are not covered by the signature while critical is; SS6.5 registers a
  uuid header whose stated purpose is to be read WITHOUT verifying, reconciled
  only by a SHOULD; and every BCP 14 obligation on content_hash is about
  CARRIAGE - the one instruction to verify (SS5.1) is lowercase and names a
  signature parameter that SS7.3 folded into content_hash three syntax
  versions earlier. The layering counter-reading, that SS5 is thin because it
  defers to RFC 7515/7516, was tested and rejected: each placement is an
  active choice carrying a keyword and a stated rationale.

  That remains an "A says B has C" shaped hole in a live specification, and
  the strongest evidence so far that the form earns its place - but the
  evidence is that vCon reached for the distinction and stopped short, not
  that it never had it. Full argument and locators in
  records/ietf/draft-ietf-vcon-vcon-core-04/distilled/design-notes.md.

  ADDED 2026-11-01 from the summary-bar batch (library#45). RFC 7515 and 7516
  were read against vCon's section 5, the only outside check it has. Member
  names and locators hold. The placement of x5c and x5u in the unprotected
  header conforms to RFC 7515 section 6 only for a verifier that takes nothing
  but the key from the chain, and the section 5.3 member list leaves enc, cty
  and uuid outside the JWE authentication tag. The charter asks for disclosure
  of parts of a vCon to different parties; one JWE over the whole signed vCon
  gives every recipient the same plaintext. Details in those three summaries.
