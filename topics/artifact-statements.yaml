schema: "library-topic/v1"
id: artifact-statements
question: "How do in-toto, SLSA and PICS structure claims about objects?"
owner: S2
status: answered
bears_on:
  - R-M-11
  - DEC-005
records:
  - draft-ietf-vcon-vcon-core-04
  - in-toto-attestation-v1
  - rfc-9943
answer: >
  Partly. vCon maps cleanly onto subject, digest and signature, and its
  extensions/critical mechanism is must-understand implemented - though
  producer opt-in, where ARCH-0002 P5 inverts the default so forgetting is
  safe. The gap is that A VCON HAS NO SPEAKER: it is signed by whoever
  assembled it, and that signer appears nowhere in the data model. Under P2
  that is a statement with the A missing - the JWS proves a key handled the
  bytes, not that anyone asserts the parties said these things. vCon never
  distinguishes ASSEMBLED from ASSERTED. The analysis[] object is where this
  bites: it records vendor, product and schema, everything except who vouches
  for the analysis. That is an "A says B has C" shaped hole in a live
  specification, and the strongest evidence so far that the form earns its
  place.
