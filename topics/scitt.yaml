schema: "library-topic/v1"
id: scitt
question: "What does SCITT's transparency service and receipt model settle that a signed statement on its own does not, and what does it cost?"
owner: davidhsiaotw
status: answered
bears_on:
  - DEC-002
  - DEC-005
  - DEC-007
  - R-M-12
records:
  - rfc-9943
  - rfc-9942
  - draft-mih-scitt-agent-action-capsule
  - draft-ietf-scitt-scrapi
answer: "NON-EQUIVOCATION is the property it exists to settle, and the one a signature alone cannot. That is the headline, not the whole: registration also yields evidence that a statement was logged at all, checkable offline without contacting the log, and makes a past admission decision replayable by an auditor. Those follow from the log that carries non-equivocation rather than standing beside it. A signature proves who issued a statement; it does not stop that issuer telling different relying parties different things about the same artifact and later destroying the evidence. Registration into an append-only VDS returns a receipt - a signed inclusion proof (rfc-9942) verifiable offline, with consistency proofs (label -2) to check the log grew rather than forked - and because registration policies and trust anchors are themselves registered as statements (rfc-9943 5.1.1.1), a past admission decision is replayable by an auditor. What it explicitly does NOT settle is truth: registration is notarization, and 9943 9.2 says a registered statement only proves an issuer produced it. For DEC-007 the shape is worth copying - iss and sub are mandatory, the assertion is an opaque tagged payload - which is the exact inverse of the vCon gap in artifact-statements, where the content is modelled and the asserter is missing. THE COST IS THAT THE GUARANTEE IS NARROWER THAN IT LOOKS, in four ways the documents state themselves. The trust anchor moves rather than disappears - a TS identity is a public key relying parties must already know (9943 3), and its key, algorithm and claims MAY change on every issuance (9943 4). Completeness is unprovable - an issuer can decline to register (9943 9.3) and the only mitigation offered is an instruction to reject statements whose receipts you cannot discover, while discovery is out of scope. The proof layer is not interoperable - 9942 4.2 disclaims interoperability across VDSs outright, one VDS is defined, and a new hash algorithm needs its own IANA registration (9942 4.4.1), which is R-M-12 in its purest form. And the property that makes a receipt safe to check is a SHOULD, not a MUST (9942 4.4). The finding we should carry forward is the fifth, which neither document owns. 9942 7.2 and 7.3 put validity periods and revocation out of scope, so nothing says how a relying party learns a receipt it holds is stale - and 9943 9.4.2 then permits a TS whose key is compromised to ROLL ITS STATEMENT SEQUENCE BACK and issue fresh receipts, with no mechanism by which anyone learns this happened and no status for receipts over the discarded prefix. A sanctioned rollback is a fork. So the append-only property that the whole architecture is built to provide has an explicit exception and no notification channel, which means transparency here buys detectability of a dishonest ISSUER but not of a dishonest or compromised LOG. Our design will face the same question and cannot answer it the same way. Three caveats on this answer. The exchange is missing from both documents: 9942 defines no protocol at all (the word does not occur once in its 1033 lines) and 9943 puts client authentication, discovery and revocation out of scope, so neither says how a statement reaches a service or how a receipt is fetched. draft-ietf-scitt-scrapi is where that lives and the library now holds it, but only as an unfilled stub - no digest, no date, bytes never fetched - so this answer rests on no reading of it. draft-ietf-cose-merkle-tree-proofs is not held at all. Both belong to issue #19 stage 3. RFC 9162 is not held, and it is where the only defined VDS and its entire security analysis live, so every claim above about what a proof actually guarantees is inherited, not checked. And draft-mih-scitt-agent-action-capsule is listed in this topic but contributed nothing to the answer - it is a profile consuming the model, not evidence about it, and it is deliberately held at status stub rather than extracted (209 BCP 14 keywords, no CDDL, no test vectors, and JSON plus JCS where DEC-002 and D-3 are CBOR). What it does contribute is the opposite pole of R-M-12: its binding invariant says verifiers MUST treat unregistered values as informational and MUST NOT reject a Capsule for carrying one, against 9942 4.3 where a verifier MUST confirm that the structure and proof identifiers match registry entries. The two poles are not equally well held - the capsule side reaches us through a stub summary, the 9942 side through a verified extraction."
