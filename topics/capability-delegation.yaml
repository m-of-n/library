answer: >
  PARTIAL, as of 2026-11-01, and open: this is what the batch of records read so
  far supports. THE QUESTION'S PREMISE IS ONLY HALF RIGHT. The field did not
  move from intersection to containment as one step. It split in two.
  CONTAINMENT AT EACH HOP: zcap-ld, draft-asor-wimse-agent-delegation-chain,
  draft-hamr-oauth-agent-delegation and draft-niyikiza-oauth-attenuating-agent-
  tokens check that a child is no broader than its parent. Intersection is not
  gone from these: draft-asor section 4.3 defines attenuation as a meet of
  parent and request, so it survives at derivation and the verifier only checks
  the result. CONJUNCTION AT THE REQUEST: macaroons-2014, biscuit-spec-3-3 and
  ucan-1-0 never compare authorities. They evaluate every restriction against
  the concrete request, and veski-2026-capmas still calls that intersection.
  WHY: only draft-niyikiza section 1.3 states the comparison with SPKI directly,
  and its reason is that the leaf token then states the authority exercised.
  rfc-9396 section 6.1 and draft-niyikiza section 4.1 give the underlying
  difficulty: comparing structured or infinite authority is API-specific or only
  structurally decidable, so these designs close the vocabulary (draft-asor
  section 4.3, draft-niyikiza section 4.5) or drop structure entirely (draft-
  hamr section 6). NOT ESTABLISHED: no source read says SPKI's intersection
  semantics failed. macaroons-2014 sections II and VIII blame cost,
  infrastructure and public identities for public-key credentials not being
  adopted, and concede that SPKI/SDSI is as expressive. So the causal form of
  the question is ours and remains unproven; topic uptake-failure bears on it.
  Both chain-comparison and conjunction designs inherit the parent-stays-valid
  problem where tokens are not re-keyed (draft-asor section 9.1, draft-niyikiza
  section 9.4). NOT YET COVERED: RFC 8693, which every OAuth draft here argues
  with, is not held, and rfc-2693 was not re-read for this answer.
