answer: >
  PARTIAL, as of 2026-11-01, and open: this is what the records read so far
  support, and DEC-007 itself is still only proposed. THREE ANSWERS EXIST. PICS
  puts meaning in a separate machine-readable document that a client resolves
  (pics-1-1-services), but nothing binds a label to the description it was read
  against. POWDER pushes meaning out to RDF terms and carries a display string
  on the description (powder-description-resources), and is proposed for
  obsolescence. C2PA puts vocabulary in specification prose and the words in an
  informative UX document (c2pa-2-4, c2pa-ux-2-2), so each implementer writes its
  own, and an unknown assertion is labelled by hand or hidden. CAWG repeats that
  shape with prose role values (cawg-identity-1-2). PROV offers terms and a
  per-instance label but no signing (w3c-prov-dm). EVIDENCE ON READERS: people
  read provenance credibility as content credibility (cscw-2023-provenance-trust),
  and want context, semantic change and intent rather than a human-or-AI flag
  (moruzzi-2025-content-authenticities). So rendering a state correctly does not
  convey its meaning, and one rendering per value may not be enough. Four national
  agencies say credentials must not imply truth, nor their absence doubt
  (nsa-2025-content-credentials). NOT ANSWERED: no system here signs the rendering
  and binds it to the claim by digest, which is DEC-007 option 2, and SHACL was
  not assessed. ide-2025-signals-of-provenance was withdrawn by its authors and
  supports nothing above. w3c-prov-o and w3c-shacl are duplicate pointers to
  prov-o and shacl.
