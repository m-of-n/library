answer: "Partial, from the 18 records above. Under the strongest standard definition (gmr-1988-adaptive §2), a valid signature shows that someone able to use the signing key signed these exact bytes, or that the scheme was broken: no attacker who can ask for signatures on messages of its choice should produce one on a new message. It proves nothing else unaided. Who holds the key is left out from the start: fips-186 §3 puts certification beyond its scope, and fips-186-3 §3 says that without identity assurance a verifier has integrity but not source authentication. When the signature was made is left out: merkle-1980-protocols §10 needs time-stamps and validity-checks for that. What a dispute means is left out: merkle-1980-protocols §7 makes dispute resolution a separate part of the protocol, and non-repudiation moves from flat claim in rsa-1978 and fips-186 to cannot easily in fips-186-3. Uniqueness of the signature is left out of the GMR forgery definition: rfc-8032 §8.4 deals with malleability separately. Open: how far these gaps close for a principal named by its key (R-M-02), which fips-186-3 §3 does not address. Still to read for this answer: fips-186-4 and fips-186-5, held elsewhere."
