answer: >
  PARTIAL, as of 2026-11-01, and open: this is what the batch of records read so
  far supports, not a survey of attestation systems. STATED PATH: TUF has one
  (tuf-tap-21, accepted, ML-DSA with an application-level pre-hash and an
  implementation in go-tuf). TPM attestation has one in the specification
  (tcg-tpm-2-0-library-185, version 185), though availability in shipped devices
  is not established. GAP: the in-toto envelope (in-toto-envelope-v1) states no
  path and names no algorithm, though its multi-signature MUST and DSSE's
  algorithm-free protocol leave room for one. DEADLINES: nistir-8547 deprecates
  quantum-vulnerable public-key cryptography after 2030 and disallows it after
  2035, and cnsa-2-0 sets earlier dates for National Security Systems. UNSETTLED:
  hybrids. draft-ietf-lamps-pq-composite-sigs provides them, nistir-8547 accommodates
  them, and cnsa-2-0 argues against them and for parallel PKI. NOT YET COVERED:
  C2PA, SCITT, Sigstore and COSE-level paths are not assessed here, and shor-1994
  stays a stub because its text could not be obtained.
