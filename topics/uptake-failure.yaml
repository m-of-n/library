answer: >
  Partial, and from these 17 records only. PICS has measured supply-side
  failure: in the GVU 9th survey, April-May 1998, 636 of 784 webmasters
  (81.1%) rated nothing and 70.5% planned to rate nothing
  (gvu-1998-webmaster-survey). Its politics are recorded on both sides, and
  they disagree (aclu-fahrenheit-451-2 contradicts pics-censorship-faq). Its
  successor did no better: a participant reports POWDER's software was never
  used in production (w3c-tag-obsolete-powder). For SPKI, the record is thinner:
  the charter asked for a format and the Datatracker lists two Experimental
  RFCs (ietf-spki-wg), Wang et al. assert key management was the primary
  obstacle without measuring it (wang-2006-reducing-spki), and Gutmann praises
  the design without addressing deployment (gutmann-2002-pki-not-dead). The
  contrast cases are ACME removing human issuance (rfc-8555) and statutes
  supplying a forcing function (ca-sb-942, eu-ai-act-art-50,
  eu-code-of-practice-marking). The web of trust is a neighbouring failure
  (ulrich-2011-openpgp-wot, cve-2019-13050, keys-openpgp-org-faq). No record
  here measures why SPKI was not adopted. zoom-keybase-2020 and psscrm-v1 add
  nothing to the question. mofn R-0004 is the fuller argument, and several of
  its readings of these sources need correction: see each record's Limits.
