schema: "library-tags/v1"
version: "0.2.0"
updated: "2026-10-01"
description: >
  Controlled tag sets. Free tags are allowed, but prefer a controlled term when
  one fits — free tags that recur three times should be promoted here by PR.

# WHAT THE DOCUMENT IS ABOUT
subject:
  - attestation
  - provenance
  - authorization
  - naming
  - delegation
  - threshold
  - canonicalization
  - encoding
  - transparency-log
  - signatures
  - key-management
  - supply-chain
  - sbom
  - content-provenance
  - agent-identity
  - trust-management
  - bibliography-method
  - regulation

# WHO PUBLISHED IT — deliberately NOT here.
#
# `body` was listed here as if it were a tag set. It is not one: it is
# a required structural field whose value is the record's storage directory,
# with its own enum in schema/record.schema.yaml:fields.body — the single
# declaration, which bin/validate and bin/ingest parse. The copy here drifted
# from it (it never gained `regulator` or `other`) and the divergence is
# library#27. Removed rather than resynced, because two lists will drift again.
#
# Who published a document is `publisher` (free text), not a tag.

# WHY WE KEPT IT
role:
  - normative        # we must conform to or map to this
  - prior-art        # studied, not adopted
  - evidence         # supports or refutes a claim we make
  - method           # how to do the work, not what to build
  - background       # context only
