schema: "library-record-schema/v5"
version: "0.6.0"
updated: "2026-10-01"
description: Normative shape of library/records/<id>/record.yaml
basis: >
  Envelope aligns with Google Cloud Open Knowledge Format (OKF) v0.1 — a
  directory of Markdown files with YAML front matter, readable by humans and
  agents. OKF requires only `type`; we extend it (see okf_extensions below).
  `maturity` follows RFC 2026 maturity levels. Interchange is CSL-JSON.

okf_extensions:
  - typed cross-references (OKF has flat tags only)
  - content digest and retrieval date — provenance of the source document
  - bears_on — linkage to an open decision
  - bibliographic fields — authors, identifiers, DOI/RFC/ISBN
  - maturity — standing of the document, not just its kind
  - implementations — open source and commercial, for build-on-it decisions
  - status/confidence review workflow

storage:
  path: "records/<body>/<id>/"
  note: >
    `body` IS A SHELVING KEY, NOT AN AUTHORITY CLAIM. It picks the directory a
    record is filed under and the section it appears under in index/. It is
    single-valued, so it cannot represent a document with two affiliations —
    and it is not asked to. Publisher identity lives in `publisher`, standing
    lives in `maturity`. Ids stay globally unique, so the body directory is
    organisation and not a namespace; a record can be reshelved with a git mv
    plus a reindex and no citation retargets. Rule and rejected alternatives
    in docs/scope.md §4 (library#27).
  values: >
    The enum under fields.body below is the SINGLE declaration of the legal
    values. bin/validate and bin/ingest parse it from this file. Do not
    restate it in schema/tags.yaml and do not hard-code it in a tool — those
    copies are what drifted and produced library#27.
  versions: >
    ONE record per document LINE, tracking the CURRENT version. Superseded
    versions go in `versions/<version>/` inside the same record — not as
    sibling records. Per-version records explode the library and we are
    largely interested in the latest. An RFC that OBSOLETES another is a
    different line and gets its own record, linked by `supersedes`.

required: [schema, id, body, type, title, content, tags, status]

fields:
  id:          {type: string, pattern: "^[a-z0-9][a-z0-9-]*$", note: "stable; never reused"}

  body:
    type: enum
    # A BLOCK sequence on purpose, not a flow list: this is the one declaration
    # of the legal values and bin/_yaml.py (dependency-free, no flow
    # collections) has to be able to read all of it. A flow list parses as a
    # truncated string and the tools silently disagree with the schema.
    values:
      - ietf
      - nist
      - w3c
      - iso
      - oasis
      - c2pa
      - openssf
      - google
      - academic
      - vendor
      - community
      - regulator
      - other
    note: >
      The storage directory and a coarse grouping. NOT the publisher-identity
      field — see storage.note above. One record gets one value. Where a
      document has two affiliations, shelve it where a reader would look for
      it and name both in `publisher`. A value earns a directory by making
      records easier to find, not by being a distinct legal entity; `other`
      and `community` are legitimate shelves, not failures to classify.

  version:
    type: string
    required: false
    note: "the version this record currently tracks, e.g. '2.4', '-18', '1.1'"

  # WHAT IT IS
  type:        {type: enum, values: [rfc, draft, spec, paper, book, article, repo,
                                     dataset, consortium, hierarchy, spreadsheet, web, note]}
  # ITS STANDING — RFC 2026 maturity levels, extended for non-IETF sources
  maturity:
    type: enum
    required: false
    values: [standard, best-practice, informational, experimental, historic,
             draft, recommendation, white-paper, implementation, unofficial]
    note: >
      standard = ratified (RFC Standards Track, ISO, W3C REC).
      best-practice = IETF BCP, NIST SP, CIS-style guidance.
      recommendation = W3C REC-track or vendor guidance.
      Do not guess: leave unset rather than assert standing you did not check.

  title:       {type: string}
  short_title: {type: string, required: false}
  authors:     {type: list, of: string, required: false}
  date:        {type: string, note: "YYYY | YYYY-MM | YYYY-MM-DD"}
  publisher:
    type: string
    required: false
    note: >
      THE PUBLISHER-IDENTITY FIELD — free text, and the one place a reader
      learns who issued the document. Name the issuing organisation as the
      document names itself. MAY name two where authorship and ratification
      differ, author first, e.g. "OWASP Foundation / Ecma International".
      Rendered in index/bibliography.md and exported to CSL-JSON. Required in
      practice from status read onward; bin/validate warns without it.

  identifiers:
    type: map
    note: >
      Open map of scheme to identifier — rfc, bcp, draft, doi, isbn, urn,
      arxiv, w3c, iso, nist, ecma, eo, git, url. Every key is rendered in
      index/bibliography.md, so a ratifying body's number (ECMA-424,
      ISO/IEC 5962) is visible without needing its own `body` value.

  content:
    type: map
    required_keys: [url, retrieved]
    keys:
      url: {type: string}
      sha256: {type: string, required: false, note: "digest of retrieved bytes"}
      retrieved: {type: string}
      local: {type: bool, default: false, note: "MUST stay false"}
      media_type: {type: string, required: false}
      pages: {type: int, required: false}

  cites:
    type: list
    required: false
    note: >
      WHAT THIS DOCUMENT ITSELF REFERENCES — extracted from its own reference
      section, not asserted by us. Entries are record ids where we hold the
      target, or {title, locator} where we do not (a gap worth ingesting).
      This is FACT about the document. Keep it strictly separate from
      `relations`, which is OUR judgement. Conflating the two makes the
      crosswalk unreadable: "A cites B" and "we think A supersedes B" are
      different claims with different warrants.

  relations:
    type: map
    note: >
      OUR CURATORIAL JUDGEMENT about how documents relate. Not extracted —
      asserted, and revisable. See docs/references.md for the semantics and
      inverse pairs of each relation.
    keys: {supersedes: {}, superseded_by: {}, updates: {}, updated_by: {},
           cited_by: {}, see_also: {}, implements_concept: {}, contradicts: {},
           part_of: {note: "parent consortium or hierarchy record"}}

  bears_on:
    type: list
    required: false
    note: >
      ARCH-0001 DEC-*/R-* ids this record informs. MAY be empty for a stub —
      a reference kept because it may matter later. Empty bears_on plus
      status: stub is a legitimate, cheap record. Do not invent relevance.

  applicability:
    type: map
    required: false
    note: "why this matters, scored per axis; feeds review triage"
    keys:
      security: {type: enum, values: [core, adjacent, none]}
      cryptography: {type: enum, values: [core, adjacent, none]}
      this_project: {type: enum, values: [core, adjacent, none, unknown]}

  implementations:
    type: map
    required: false
    note: "what exists that we could build on — surfaced to humans in summary.md"
    keys:
      open_source: {type: list, note: "name + url + license"}
      commercial: {type: list, note: "name + url"}
      searched: {type: string, note: "YYYY-MM-DD the search was run; blank = not searched"}

  usefulness:
    type: map
    required: false
    note: >
      An explicit verdict, including a NEGATIVE one. A reference judged not
      useful is recorded as such, never silently dropped — otherwise the same
      document is re-evaluated every few weeks and the judgement is lost.
    keys:
      verdict: {type: enum, values: [useful, marginal, not-useful, unassessed]}
      reason: {type: string, note: "one line; required when verdict is not-useful or marginal"}
      assessed: {type: string, note: "YYYY-MM-DD"}

  tags:       {type: list, of: string, note: "free tags; see schema/tags.yaml for the controlled set"}
  topic:      {type: string, required: false}
  duplicate_of:
    type: string
    required: false
    note: >
      This record is the same document as another record, held twice by
      mistake. Ids are stable forever, so the duplicate is kept as a stub
      pointer rather than deleted; bin/validate requires the target to exist
      and the duplicate to stay a stub. Cite the target, never the duplicate
      (library#35).
  status:     {type: enum, values: [stub, queued, fetched, reading, read, summarized, distilled]}

  distillation:
    type: map
    required: false
    note: >
      DISTILLATION IS PROGRESSIVE, not a boolean. A record accumulates
      distilled artifacts over time, each with its own coverage and review
      state. `status: distilled` means "has at least one artifact"; this block
      says which, how far, and whether a human has checked it.
    keys:
      artifacts:
        type: list
        note: "one entry per artifact in distilled/"
        item_keys:
          kind: {type: enum, values: [normative, fields, requirements, state-machine,
                                      schema, messages, protocol, code, examples,
                                      design-notes, glossary, diagram]}
          path: {type: string}
          coverage: {type: string, note: "what it covers AND what it does not"}
          generated_from: {type: string, required: false, note: "another artifact, for derived ones"}
          reviewed_by: {type: string, note: "empty means readable but not buildable-on"}
      profile:
        type: enum
        values: [full]
        required: false
        note: >
          FX-1 (docs/extraction.md). Declares the complete artifact set; bin/validate
          then enforces it. Required on every rfc/draft/spec/ietf record a PR moves
          past stub (bin/check-pr-extraction).
      not_applicable:
        type: list
        required: false
        note: "{kind, reason}. Never for normative, requirements or design-notes."
      passes:
        type: list
        required: false
        note: "{pass: extract|verify|cross-check, by, effort: max, date}. All three required under profile: full."
  confidence: {type: enum, values: [low, medium, high], required: false}
  owner:      {type: string, required: false}

companions:
  summary.md:
    required_at_status: [read, summarized, distilled]
    note: >
      PRIMARY human- and AI-facing document. Bibliographic header, overview,
      applicability, artifact inventory, implementations. This is what a human
      reviews. Always written first.
  distilled/:
    required: false
    note: >
      OPTIONAL, SECONDARY, and a SET rather than a file. Distillation is
      progressive: a record accumulates artifacts as understanding deepens.
      Never a substitute for summary.md.

      Artifact kinds, all optional and independently reviewable:
        normative.md       compacted normative prose, locators preserved
        fields.yaml        field/parameter definitions
        requirements.yaml  qualified requirements, EXTERNALLY REFERENCEABLE
        state-machines.md  state and transition descriptions
        schema/            CDDL, JSON Schema, generated from fields
        code/              reference types in any language - CODE IS AN ARTIFACT
        examples/          test vectors and examples lifted from the source

      distilled/README.md indexes them with per-artifact coverage.
      Derived artifacts name what they were generated_from, so a defect in a
      field table can be traced into the code generated from it.
  versions/:
    required: false
    note: "versions/<version>/ — superseded versions of this same document line"
  requirements/:
    required: false
    note: "YAML, one file per extracted requirement set. Derived from distilled.md."
  quotes.md:  {required: false, note: "verbatim excerpts WITH locators"}
  artifacts/: {required: false, note: "derived: grammars, generated code, diagrams, vectors"}

markdown_rule: >
  Every .md file in a record directory carries YAML front matter (OKF
  alignment, library#1 item 11): schema, id, record, type, updated.
