name: ci
# index/ and exports/ are generated and NOT tracked. Every merge conflict this
# library ever had was in those files, and none was a real disagreement - see
# docs/generated-views.md. CI generates them first, then gates against the
# fresh output, so "stale derived view" is no longer a thing that can happen.
on:
  pull_request:
  push: {branches: [main]}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: YAML reader regression tests
        run: bin/test_yaml.py

      - name: records and topics validate
        run: bin/validate

      - name: generate derived views
        run: |
          bin/export && bin/reindex
          if [ -n "$(git status --porcelain -- index/ exports/)" ]; then
            echo "::error::generated views are tracked again - they must stay ignored"
            git status --porcelain -- index/ exports/
            exit 1
          fi

      - name: every record appears in the bibliography
        run: |
          recs=$(ls -d records/*/*/ 2>/dev/null | wc -l | tr -d ' ')
          bib=$(grep -c '^- \*\*' index/bibliography.md || echo 0)
          echo "records=$recs bibliography-entries=$bib"
          if [ "$recs" != "$bib" ]; then
            echo "::error::$recs records but $bib bibliography entries - the bibliography is incomplete"
            exit 1
          fi

      - name: FX-1 full extraction on records this PR touches
        if: github.event_name == 'pull_request'
        run: bin/check-pr-extraction ${{ github.event.pull_request.base.sha }}

      - name: no dangling relations
        run: bin/reindex        # exits non-zero on a dangling relation

      - name: no third-party documents committed
        run: |
          if find records -type f \( -name '*.pdf' -o -name '*.xlsx' -o -name '*.epub' -o -name '*.docx' \) | grep -q .; then
            echo "::error::third-party document committed - record the digest and URL, never the bytes"
            find records -type f \( -name '*.pdf' -o -name '*.xlsx' -o -name '*.epub' -o -name '*.docx' \)
            exit 1
          fi
      - name: publish the views for reviewers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-views
          path: |
            index/
            exports/
          if-no-files-found: error

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: every commit signed off
        run: |
          fail=0
          while read -r sha; do
            git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>' \
              || { echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"; fail=1; }
          done < <(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          exit $fail
