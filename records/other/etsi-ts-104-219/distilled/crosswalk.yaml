annex_a_cra_rows:
  - cra: "I.I(1)"
    provision: "designing, developing and producing products with digital elements in such a way that they ensure an appropriate level of cybersecurity based on the risks"
    ssdif_essentials: "All"
    ssdif_action_ids: ""
    ssdif_tasks: []
  - cra: "I.I(2)(a)"
    provision: "making products with digital elements available on the market without known exploitable vulnerabilities"
    ssdif_essentials: "All"
    ssdif_action_ids: ""
    ssdif_tasks: []
  - cra: "I.I(2)(b)"
    provision: "making products with digital elements available on the market with a secure by default configuration"
    ssdif_essentials: "Secure Default Configuration"
    ssdif_action_ids: "*PW.9.1, *PW.9.2"
    ssdif_tasks:
      - "PW.9.1"
      - "PW.9.2"
  - cra: "I.I(2)(c)"
    provision: "ensuring that vulnerabilities in products with digital elements can be addressed through security updates"
    ssdif_essentials: "Vulnerability Disclosure and Remediation"
    ssdif_action_ids: "*RV.2.1, *RV.2.2"
    ssdif_tasks:
      - "RV.2.1"
      - "RV.2.2"
  - cra: "I.I(2)(d)"
    provision: "ensuring protection of products with digital elements from unauthorised access and reporting on possible unauthorised access"
    ssdif_essentials: "Secure Software Design"
    ssdif_action_ids: "*PO.1.2, *PW.1.1, *PW.1.2, *PW.1.3, *PW.2.1"
    ssdif_tasks:
      - "PO.1.2"
      - "PW.1.1"
      - "PW.1.2"
      - "PW.1.3"
      - "PW.2.1"
  - cra: "I.I(2)(e)"
    provision: "protecting the confidentiality of data stored, transmitted or otherwise processed by a product with digital elements"
    ssdif_essentials: "Secure Software Design"
    ssdif_action_ids: "*PO.1.2, *PW.1.1, *PW.1.2, *PW.1.3, *PW.2.1"
    ssdif_tasks:
      - "PO.1.2"
      - "PW.1.1"
      - "PW.1.2"
      - "PW.1.3"
      - "PW.2.1"
  - cra: "I.I(2)(f)"
    provision: "protecting the integrity of data, commands, programs by a product with digital elements, and its configuration against any manipulation or modification not authorised by the user, as well as reporting on corruptions"
    ssdif_essentials: "Secure Software Design"
    ssdif_action_ids: "*PO.1.2, *PW.1.1, *PW.1.2, *PW.1.3, *PW.2.1"
    ssdif_tasks:
      - "PO.1.2"
      - "PW.1.1"
      - "PW.1.2"
      - "PW.1.3"
      - "PW.2.1"
  - cra: "I.I(2)(g)"
    provision: "processing only personal or other data that are adequate, relevant and limited to what is necessary in relation to the intended purpose of the product with digital elements ('minimisation of data')"
    ssdif_essentials: "Secure Software Design"
    ssdif_action_ids: "*PO.1.2, *PW.1.1"
    ssdif_tasks:
      - "PO.1.2"
      - "PW.1.1"
  - cra: "I.I(2)(h)"
    provision: "protecting the availability of essential and basic functions of the product with digital elements"
    ssdif_essentials: "Secure Software Design"
    ssdif_action_ids: "*PO.1.2, *PW.1.1, *PW.1.2, *PW.1.3, *PW.2.1"
    ssdif_tasks:
      - "PO.1.2"
      - "PW.1.1"
      - "PW.1.2"
      - "PW.1.3"
      - "PW.2.1"
  - cra: "I.I(2)(i)"
    provision: "minimising the negative impact of a product with digital elements or its connected devices on the availability of services provided by other devices or networks"
    ssdif_essentials: "Secure Software Design"
    ssdif_action_ids: "*PO.1.2, *PW.1.1, *PW.1.2, *PW.1.3, *PW.2.1"
    ssdif_tasks:
      - "PO.1.2"
      - "PW.1.1"
      - "PW.1.2"
      - "PW.1.3"
      - "PW.2.1"
  - cra: "I.I(2)(j)"
    provision: "designing, developing and producing products with digital elements with limited attack surfaces"
    ssdif_essentials: "Secure Default Configuration"
    ssdif_action_ids: "*PW.9.1, *PW.9.2"
    ssdif_tasks:
      - "PW.9.1"
      - "PW.9.2"
  - cra: "I.I(2)(k)"
    provision: "designing, developing and producing products with digital elements that reduce the impact of an incident using appropriate exploitation mitigation mechanisms and techniques"
    ssdif_essentials: "Secure Software Design; Secure Development"
    ssdif_action_ids: "*PW.1.1, *PW.6.2"
    ssdif_tasks:
      - "PW.1.1"
      - "PW.6.2"
  - cra: "I.I(2)(l)"
    provision: "providing security related information by recording and/or monitoring relevant internal activity of products with digital elements with an opt-out mechanism for the user"
    ssdif_essentials: "Secure Software Design"
    ssdif_action_ids: "*PW.1.1"
    ssdif_tasks:
      - "PW.1.1"
  - cra: "I.I(2)(m)"
    provision: "securely and easily removing or transferring all data and settings of a product with digital elements."
    ssdif_essentials: "Not covered in SSDIF"
    ssdif_action_ids: ""
    ssdif_tasks: []
  - cra: "I.II(1)"
    provision: "identify and document vulnerabilities and components contained in the product, including by drawing up a software bill of materials in a commonly used and machine-readable format covering at the very least the top-level dependencies of the product;"
    ssdif_essentials: "Supply Chain Security"
    ssdif_action_ids: "*PW.4.1, *PW.4.4,"
    ssdif_tasks:
      - "PW.4.1"
      - "PW.4.4"
  - cra: "I.II(2)"
    provision: "in relation to the risks posed to the products with digital elements, address and remediate vulnerabilities without delay, including by providing security updates; where technically feasible, new security updates \"shall\" [i.12] be provided separately from functionality updates;"
    ssdif_essentials: "Vulnerability Disclosure and Remediation"
    ssdif_action_ids: "*RV.1 (all tasks), *RV.2 (all tasks)"
    ssdif_tasks:
      - "RV.1.1"
      - "RV.1.2"
      - "RV.1.3"
      - "RV.2.1"
      - "RV.2.2"
  - cra: "I.II(3)"
    provision: "apply effective and regular tests and reviews of the security of the product with digital elements;"
    ssdif_essentials: "Secure Development"
    ssdif_action_ids: "*PW.8.1, * PW.8.2"
    ssdif_tasks:
      - "PW.8.1"
      - "PW.8.2"
  - cra: "I.II(4)"
    provision: "once a security update has been made available, share and publicly disclose information about fixed vulnerabilities, including a description of the vulnerabilities, information allowing users to identify the product with digital elements affected, the impacts of the vulnerabilities, their severity and clear and accessible information helping users to remediate the vulnerabilities; in duly justified cases, where manufacturers consider the security risks of publication to outweigh the security benefits, they may delay making public information regarding a fixed vulnerability until after users have been given the possibility to apply the relevant patch;"
    ssdif_essentials: "Vulnerability Disclosure and Remediation"
    ssdif_action_ids: "*RV.2.2"
    ssdif_tasks:
      - "RV.2.2"
  - cra: "I.II(5)"
    provision: "put in place and enforce a policy on coordinated vulnerability disclosure;"
    ssdif_essentials: "Vulnerability Disclosure and Remediation"
    ssdif_action_ids: "*RV.1.1, *RV.1.3"
    ssdif_tasks:
      - "RV.1.1"
      - "RV.1.3"
  - cra: "I.II(6)"
    provision: "take measures to facilitate the sharing of information about potential vulnerabilities in their product with digital elements as well as in third party components contained in that product, including by providing a contact address for the reporting of the vulnerabilities discovered in the product with digital elements;"
    ssdif_essentials: "Vulnerability Disclosure and Remediation"
    ssdif_action_ids: "*RV.1.1"
    ssdif_tasks:
      - "RV.1.1"
  - cra: "I.II(7)"
    provision: "provide for mechanisms to securely distribute updates for products with digital elements to ensure that vulnerabilities are fixed or mitigated in a timely manner, and, where applicable for security updates, in an automatic manner;"
    ssdif_essentials: "Vulnerability Disclosure and Remediation"
    ssdif_action_ids: "*RV.2.2"
    ssdif_tasks:
      - "RV.2.2"
  - cra: "I.II(8)"
    provision: "ensure that, where security updates are available to address identified security issues, they are disseminated without delay and, unless otherwise agreed between manufacturer and business user in relation to a tailor-made product with digital elements, free of charge, accompanied by advisory messages providing users with the relevant information, including on potential"
    ssdif_essentials: "Vulnerability Disclosure and Remediation"
    ssdif_action_ids: "*RV.1.1, *RV.1.3, *RV.2.1, *RV.2.2"
    ssdif_tasks:
      - "RV.1.1"
      - "RV.1.3"
      - "RV.2.1"
      - "RV.2.2"
