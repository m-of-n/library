annex_b1_crt_apc:
  - principle: "1.1 Follow an established secure development framework."
    claim: "1.1.1"
    claim_text: "The development framework used is documented."
    ssdif_essentials: "Secure Development"
    ssdif_action_ids: "*PO.1.2"
    ssdif_tasks:
      - "PO.1.2"
  - principle: "1.1"
    claim: "1.1.2"
    claim_text: "Developers are trained in the use of the framework and tools."
    ssdif_essentials: "Secure Development"
    ssdif_action_ids: "*PO.2.2"
    ssdif_tasks:
      - "PO.2.2"
  - principle: "1.1"
    claim: "1.1.3"
    claim_text: "Tools are maintained and updated."
    ssdif_essentials: "Secure Development"
    ssdif_action_ids: "*PO.3.1, *PO.3.2"
    ssdif_tasks:
      - "PO.3.1"
      - "PO.3.2"
  - principle: "1.1"
    claim: "1.1.4"
    claim_text: "Items requiring configuration control are identified and version control is used."
    ssdif_essentials: "Secure Development"
    ssdif_action_ids: "*PO.3.2, *PO.3.3, *PW.1.2 (many tasks are documented by artifacts in the configuration management system)"
    ssdif_tasks:
      - "PO.3.2"
      - "PO.3.3"
      - "PW.1.2"
  - principle: "1.1"
    claim: "1.1.5"
    claim_text: "Requirements are captured and recorded."
    ssdif_essentials: "Secure Software Design; Secure Development"
    ssdif_action_ids: "*PO.4.1, *PO.4.2, *PW.1.2"
    ssdif_tasks:
      - "PO.4.1"
      - "PO.4.2"
      - "PW.1.2"
  - principle: "1.1"
    claim: "1.1.6"
    claim_text: "Software is designed for user need."
    ssdif_essentials: "Secure Software Design"
    ssdif_action_ids: "*PW.1.1, *PW.1.2, *PW.1.3"
    ssdif_tasks:
      - "PW.1.1"
      - "PW.1.2"
      - "PW.1.3"
  - principle: "1.2 Understand the composition of the software and assess risks linked to the ingestion and maintenance of third-party components throughout the development lifecycle."
    claim: "1.2.1"
    claim_text: "All third-party components are identified and documented."
    ssdif_essentials: "Supply Chain Security"
    ssdif_action_ids: "*PW.4.1"
    ssdif_tasks:
      - "PW.4.1"
  - principle: "1.2"
    claim: "1.2.2"
    claim_text: "Integrity of third-party components and updates is verified."
    ssdif_essentials: "Supply Chain Security"
    ssdif_action_ids: "*PW.4.1"
    ssdif_tasks:
      - "PW.4.1"
  - principle: "1.2"
    claim: "1.2.3"
    claim_text: "Each third-party component is tested before being first deployed."
    ssdif_essentials: "Supply Chain Security"
    ssdif_action_ids: "*PO.1.3, *PW.4.1"
    ssdif_tasks:
      - "PO.1.3"
      - "PW.4.1"
  - principle: "1.2"
    claim: "1.2.4"
    claim_text: "Third-party component updates are tested."
    ssdif_essentials: "Supply Chain Security"
    ssdif_action_ids: "*PO.1.3, *PW.4.1"
    ssdif_tasks:
      - "PO.1.3"
      - "PW.4.1"
  - principle: "1.2"
    claim: "1.2.5"
    claim_text: "Processes are in place to manage and deploy updates to third-party components."
    ssdif_essentials: "Supply Chain Security, Vulnerability Disclosure and Remediation"
    ssdif_action_ids: "*PO.1.3, *PW.4.1, *RV [all tasks]"
    ssdif_tasks:
      - "PO.1.3"
      - "PW.4.1"
      - "RV.1.1"
