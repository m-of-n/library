      - "RV.2.2"
      - "RV.3.1"
      - "RV.3.2"
      - "RV.3.3"
      - "RV.3.4"
  - principle: "1.3 Have a clear process for testing software and software updates before distribution."
    claim: "1.3.1"
    claim_text: "A test plan exists that covers all requirements and third-party components."
    ssdif_essentials: "Secure Development"
    ssdif_action_ids: "*PW.8.1, *PW.8.2"
    ssdif_tasks:
      - "PW.8.1"
      - "PW.8.2"
  - principle: "1.3"
    claim: "1.3.2"
    claim_text: "Execution of the test plan is automated and repeatable wherever possible."
    ssdif_essentials: "Secure Development"
    ssdif_action_ids: "*PW.8.2"
    ssdif_tasks:
