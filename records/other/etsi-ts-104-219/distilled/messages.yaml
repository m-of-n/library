schema: "library-messages/v1"
record: etsi-ts-104-219
note: >
  The TS defines no wire messages or encodings. These are the work products (DG Artifacts and action outputs) whose CONTENT
  the TS prescribes, with each field tied to the action ids (requirements.yaml) that require it. Encoding is never specified
  ('in hard copy, on an internal website, or in another organization-selected form', PO.1.2 #1). Fields marked
  source: example come only from informative Implementation Examples.
messages:
  - id: SecureDevelopmentProcessDocument
    locator: "PO.1.2 DG1/2/3 1-2; DG Artifacts"
    fields:
      - {name: secure_application_design_standards, required: true, constrained_by: ["SSDIF-PO.1.2-DG123-1"]}
      - {name: secure_coding_practices, required: true, constrained_by: ["SSDIF-PO.1.2-DG123-1"]}
      - {name: developer_training, required: true, constrained_by: ["SSDIF-PO.1.2-DG123-1"]}
      - {name: vulnerability_management, required: true, constrained_by: ["SSDIF-PO.1.2-DG123-1"]}
      - {name: security_of_third_party_code, required: true, constrained_by: ["SSDIF-PO.1.2-DG123-1"]}
      - {name: application_security_testing_procedures, required: true, constrained_by: ["SSDIF-PO.1.2-DG123-1"]}
      - {name: last_review_date, type: date, required: true, rule: "annually or on significant enterprise change", constrained_by: ["SSDIF-PO.1.2-DG123-2"]}
  - id: ThreatModel
    locator: "PW.1.1 DG3 1-8; DG Artifacts"
    applies_to: "DG3"
    fields:
      - {name: methodology, type: "string (STRIDE, CIA, or similar)", required: false, constrained_by: ["SSDIF-PW.1.1-DG3-1"]}
      - {name: tools, type: list, required: false, constrained_by: ["SSDIF-PW.1.1-DG3-2"]}
      - {name: threats, type: "list of Threat", required: true, constrained_by: ["SSDIF-PW.1.1-DG3-3"]}
      - {name: system_description, type: "DFD / description", required: false, rule: "if created, shall accurately depict the system", constrained_by: ["SSDIF-PW.1.1-DG3-7", "SSDIF-PW.1.1-DG3-8"]}
  - id: Threat
    locator: "PW.1.1 DG3 3-6"
    fields:
      - {name: description, required: true, constrained_by: ["SSDIF-PW.1.1-DG3-3"]}
      - {name: scenarios, type: "how the threat presents itself in possible scenarios", required: true, constrained_by: ["SSDIF-PW.1.1-DG3-3"]}
      - {name: mitigation, required: true, constrained_by: ["SSDIF-PW.1.1-DG3-3", "SSDIF-PW.1.1-DG3-4"]}
      - {name: severity, type: "enum (at least high, medium)", required: true, constrained_by: ["SSDIF-PW.1.1-DG3-4"]}
      - {name: bug_ref, type: "workflow item id", required: "true if severity=high; recommended if medium", constrained_by: ["SSDIF-PW.1.1-DG3-5", "SSDIF-PW.1.1-DG3-6"]}
  - id: SecurityBug
    locator: "PO.4.1 DG1/2/3 1-3; §5.0.4"
    fields:
      - {name: category, type: "STRIDE / CIA / similar", required: true, constrained_by: ["SSDIF-PO.4.1-DG123-2"]}
      - {name: severity, type: "bug-bar level", required: true, constrained_by: ["SSDIF-PO.4.1-DG123-4"]}
      - {name: source, type: "enum (tool output, threat model, design review, code review, test, vulnerability report)", required: false, constrained_by: ["R-0011"]}
      - {name: status, type: "enum (open, fixed)", required: true, constrained_by: ["R-0011"]}
      - {name: fix_class, type: "enum (shall fix, should fix)", required: true, constrained_by: ["SSDIF-PO.4.1-DG123-4", "SSDIF-PW.8.2-DG3-4"]}
  - id: BugBar
    locator: "PO.4.1 DG1/2/3 4-6; §3.1"
    fields:
      - {name: severity_levels, type: list, required: true, constrained_by: ["SSDIF-PO.4.1-DG123-4"]}
      - {name: covers, type: "internally discovered errors + externally reported vulnerabilities", required: true, constrained_by: ["SSDIF-PO.4.1-DG123-4"]}
      - {name: criteria, type: "ease of discovery, ease of exploitation, impact on function, impact on data security", required: true, constrained_by: ["SSDIF-PO.4.1-DG123-4"]}
      - {name: release_delay_rule, required: true, constrained_by: ["SSDIF-PO.4.1-DG123-5"]}
      - {name: minimum_ship_level, required: true, constrained_by: ["SSDIF-PO.4.1-DG123-6"]}
  - id: ShallFixList
    locator: "PW.8.2 DG3 4-9"
    applies_to: "DG3"
    fields:
      - {name: static_analysis_errors, type: list, required: true, constrained_by: ["SSDIF-PW.8.2-DG3-4"]}
      - {name: promotion_evidence, type: "count of externally reported vulnerabilities triggering the error (typically >=3)", required: false, constrained_by: ["SSDIF-PW.8.2-DG3-7", "SSDIF-PW.8.2-DG3-8"]}
      - {name: valid_rate_sample, type: "percentage (e.g. 80 %)", required: false, constrained_by: ["SSDIF-PW.8.2-DG3-6"]}
  - id: ProductSpecification
    locator: "PW.1.2 DG1/2/3 1-2"
    fields:
      - {name: content, required: true, constrained_by: ["SSDIF-PW.1.2-DG123-1"]}
      - {name: repository_location, required: true, constrained_by: ["SSDIF-PW.1.2-DG123-1"]}
      - {name: change_log_in_workflow_system, required: true, constrained_by: ["SSDIF-PW.1.2-DG123-2"]}
  - id: DesignReviewRecord
    locator: "PW.2.1 task statement; DG Artifacts; examples"
    fields:
      - {name: reviewer, rule: "qualified person not involved with the design and/or automated toolchain process", required: true, constrained_by: ["SSDIF-PW.2.1-DG123-1"]}
      - {name: minutes, required: true, constrained_by: ["SSDIF-PW.2.1-DG123-1"]}
      - {name: design_bugs, type: list, required: false, constrained_by: ["SSDIF-PW.2.1-DG123-1"]}
  - id: ToolConfigurationRecord
    locator: "PO.3.1; PO.3.3; PO.4.2; PW.6.1"
    fields:
      - {name: tools_or_tool_types, type: list, required: true, constrained_by: ["SSDIF-PO.3.1-DG123-1"]}
      - {name: configuration_standards_in_workflow_system, required: true, constrained_by: ["SSDIF-PO.3.3-DG123-1"]}
      - {name: tool_option_decisions, required: true, constrained_by: ["SSDIF-PW.6.1-DG123-1"]}
      - {name: verification_method, type: "build-script / CI inspection or binary scanner (e.g. BinScope, BinSkim)", required: true, constrained_by: ["SSDIF-PW.6.1-DG123-2"]}
  - id: TPCRiskAssessment
    locator: "PW.4.1 DG1/2/3 1-8"
    fields:
      - {name: component, required: true, constrained_by: ["SSDIF-PW.4.1-DG123-1"]}
      - {name: known_vulnerabilities, type: list, required: true, constrained_by: ["SSDIF-PW.4.1-DG123-2", "SSDIF-PW.4.1-DG123-5"]}
      - {name: provider_maturity, type: "maintenance cadence, stability over time, development practices, EOL within product lifetime", required: true, constrained_by: ["SSDIF-PW.4.1-DG123-3"]}
      - {name: risk_score, type: "binary (acceptable/unacceptable) or high/medium/low", required: true, constrained_by: ["SSDIF-PW.4.1-DG123-4"]}
      - {name: update_site_comparison, required: "if vulnerability reports exist", constrained_by: ["SSDIF-PW.4.1-DG123-6"]}
      - {name: decision, type: "enum (use, mitigate, accept, reject)", required: true, constrained_by: ["SSDIF-PW.4.1-DG123-7", "SSDIF-PW.4.1-DG123-8"]}
  - id: ComponentInventory
    locator: "PS.3.2 DG1/2/3 1-2; DG2/3 1"
    fields:
      - {name: approved_components, type: list, required: true, constrained_by: ["SSDIF-PS.3.2-DG123-1"]}
      - {name: components_per_product_with_where_used, type: "SBOM plus internal where used", required: true, constrained_by: ["SSDIF-PS.3.2-DG123-2"]}
      - {name: sca_tool_output, required: "DG2/3", constrained_by: ["SSDIF-PS.3.2-DG23-1"]}
  - id: VulnerabilityReportingPolicy
    locator: "RV.1.1 DG1/2/3 1-6"
    fields:
      - {name: how_to_report, required: true, constrained_by: ["SSDIF-RV.1.1-DG123-1", "SSDIF-RV.1.1-DG123-6"]}
      - {name: expected_response, required: true, constrained_by: ["SSDIF-RV.1.1-DG123-1"]}
      - {name: reporting_location, type: "visible, discoverable (website + dedicated email)", required: true, constrained_by: ["SSDIF-RV.1.1-DG123-3", "SSDIF-RV.1.1-DG123-4"]}
      - {name: confidential_channel, type: "TLS upload / encrypted email / encrypted messaging", required: "if possible", constrained_by: ["SSDIF-RV.1.1-DG123-5"]}
      - {name: to_whom, required: true, constrained_by: ["SSDIF-RV.1.1-DG123-6"]}
  - id: VulnerabilityHandlingPolicy
    locator: "RV.1.3 DG1/2/3 1-2"
    fields:
      - {name: responsibility_per_stage, required: true, constrained_by: ["SSDIF-RV.1.3-DG123-1"]}
      - {name: information_handling, type: "potential and confirmed vulnerabilities", required: true, constrained_by: ["SSDIF-RV.1.3-DG123-1"]}
      - {name: norms_compliance, type: "relevant vulnerability reporting norms", required: true, constrained_by: ["SSDIF-RV.1.3-DG123-2"]}
  - id: VulnerabilityRemediationRecord
    locator: "RV.1.2; RV.2.1; RV.2.2; RV.3.1"
    fields:
      - {name: triage_result, type: "valid?, severity priority", required: true, constrained_by: ["SSDIF-RV.1.2-DG123-1"]}
      - {name: triage_completed_at, type: datetime, rule: "timely; commonly one week", required: true, constrained_by: ["SSDIF-RV.1.2-DG123-2"]}
      - {name: bug_analysis, required: true, constrained_by: ["SSDIF-RV.2.1-DG123-1"]}
      - {name: fix_and_test, required: true, constrained_by: ["SSDIF-RV.2.2-DG123-1"]}
      - {name: common_identifier, type: "CVE / required Vulnerability Database id", required: "where possible", constrained_by: ["SSDIF-RV.2.2-DG123-2"]}
      - {name: criticality, required: true, constrained_by: ["SSDIF-RV.2.2-DG123-3"]}
      - {name: recurring, type: boolean, required: true, constrained_by: ["SSDIF-RV.3.1-DG123-1"]}
  - id: ConfigurationSettingDoc
    locator: "PW.9.2 example 2 (informative); DG Artifacts"
    source: example
    fields:
      - {name: purpose, required: false, constrained_by: []}
      - {name: options, required: false, constrained_by: []}
      - {name: default_value, required: false, constrained_by: []}
      - {name: security_relevance, required: false, constrained_by: []}
      - {name: operational_impact, required: false, constrained_by: []}
      - {name: relationships, required: false, constrained_by: []}
events:
  # Added by the cross-check pass (2026-10-02): every message named in protocol.yaml flows that is not a
  # content-prescribed structure above. These are process events / work items; the source names the act
  # but prescribes no fields, so no schema is derived for them.
  - id: "VulnerabilityReport"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 1
    constrained_by:
      - "SSDIF-RV.1.1-DG123-3"
      - "SSDIF-RV.1.1-DG123-4"
      - "SSDIF-RV.1.1-DG123-5"
      - "SSDIF-RV.1.1-DG123-6"
  - id: "TriageRequest"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 2
    constrained_by:
      - "SSDIF-RV.1.2-DG123-1"
  - id: "TriageResult"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 3
    constrained_by:
      - "SSDIF-RV.1.2-DG123-2"
  - id: "BugAnalysisRecord"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 4
    constrained_by:
      - "SSDIF-RV.2.1-DG123-1"
  - id: "Fix"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 5
      - flow: "F2"
        step: 5
    constrained_by:
      - "R-0011"
      - "SSDIF-RV.2.2-DG123-1"
      - "SSDIF-RV.2.2-DG123-3"
  - id: "VulnerabilityIdentifier"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 6
    constrained_by:
      - "SSDIF-RV.2.2-DG123-2"
  - id: "SecurityUpdate"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 7
    constrained_by:
      - "SSDIF-PS.2.1-DG123-1"
  - id: "SecurityAdvisory"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 8
    constrained_by:
      - "R-0031"
  - id: "VariantReview"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 9
    constrained_by:
      - "SSDIF-RV.3.3-DG123-1"
  - id: "RootCauseRecord"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 10
    constrained_by:
      - "SSDIF-RV.3.1-DG123-1"
      - "SSDIF-RV.3.1-DG123-3"
      - "SSDIF-RV.3.2-DG123-1"
  - id: "ProcessChange"
    content_prescribed: false
    used_in:
      - flow: "F1"
        step: 11
    constrained_by:
      - "R-0033"
      - "SSDIF-RV.3.1-DG123-2"
      - "SSDIF-RV.3.4-DG3-1"
      - "SSDIF-RV.3.4-DG3-2"
  - id: "DataFlowDiagram"
    content_prescribed: false
    used_in:
      - flow: "F2"
        step: 1
    constrained_by:
      - "SSDIF-PW.1.1-DG3-7"
      - "SSDIF-PW.1.1-DG3-8"
  - id: "ReleaseDecision"
    content_prescribed: false
    used_in:
      - flow: "F3"
        step: 2
    constrained_by:
      - "SSDIF-PO.4.1-DG123-5"
      - "SSDIF-PO.4.1-DG123-6"
  - id: "StaticAnalysisRun"
    content_prescribed: false
    used_in:
      - flow: "F3"
        step: 3
    constrained_by:
      - "SSDIF-PW.8.2-DG3-4"
  - id: "SignedRelease"
    content_prescribed: false
    used_in:
      - flow: "F3"
        step: 4
    constrained_by:
      - "SSDIF-PS.2.1-DG123-1"
      - "SSDIF-PS.3.1-DG123-2"
  - id: "SupplierContract"
    content_prescribed: false
    used_in:
      - flow: "F4"
        step: 1
    constrained_by:
      - "SSDIF-PO.1.3-DG123-1"
  - id: "ApprovedComponentList"
    content_prescribed: false
    used_in:
      - flow: "F4"
        step: 3
    constrained_by:
      - "SSDIF-PS.3.2-DG123-1"
      - "SSDIF-PS.3.2-DG123-2"
      - "SSDIF-PW.4.1-DG123-7"
      - "SSDIF-PW.4.1-DG123-8"
  - id: "TPCMonitoringResult"
    content_prescribed: false
    used_in:
      - flow: "F4"
        step: 4
    constrained_by:
      - "SSDIF-PS.3.2-DG23-1"
      - "SSDIF-PW.4.4-DG123-1"
      - "SSDIF-PW.4.4-DG123-2"
      - "SSDIF-PW.4.4-DG23-1"
