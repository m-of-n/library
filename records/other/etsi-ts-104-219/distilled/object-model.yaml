schema: "library-object-model/v1"
record: etsi-ts-104-219
source_version: "V1.1.1 (2026-03)"
question: "What objects (entity types) and relationship edges does ETSI TS 104 219 (SSDIF) assume or define?"
note: >
  Separate pass over .cache/etsi-ts-104-219.txt with one question. kind: stated = the TS names the thing and gives it a role,
  definition or table row; inferred = the TS presupposes it without naming it as an entity. tmodel_mapping targets ARCH-0001
  v0.2.0 (§1 layers, §2b Party, §3b LifecyclePhase, §4 Assertion/Review, §5 MitigationInstance/Review) and the DL-0009
  proposals (SDL/SecurityProgram, Gate, Requirement, WorkProduct, Evidence, governed view, R-040..R-044).

objects:
  # --- framework structure ---
  - {name: Essential, definition: "one of six SSDIF Essential Practices that restructure the SSDF practices into engineer-oriented groups: Secure Software Design, Secure Development, Secure Default Configuration, Supply Chain Security, Code Integrity, Vulnerability Disclosure and Remediation", attributes: [number, name, summary_description, ssdf_tasks], locator: "§5.0.1 Table 5.0-1; Figure 5.0-1", kind: stated, tmodel_mapping: "new — a grouping over Requirement (MAP-0001 canonical phase is the closest axis, but Essentials cut across phases)", notes: "Executive summary calls them '6 Essential Practices'. Conformance is defined against them (§5.0.4)."}
  - {name: SSDFTask, definition: "a NIST SSDF 1.1 task (PO/PS/PW/RV.x.y) reused verbatim as the SSDIF task statement", attributes: [ssdf_id, statement, former_id], locator: "§5.1.1-§5.6.1 'Task ID'; Annex C", kind: stated, tmodel_mapping: "Requirement (external, sp-800-218) — the crosswalk pivot of R-044", notes: "42 tasks; PO.1.3 '[Formerly PW.3.1]', PW.1.3 '[Formerly PW.4.3]' (Annex C)."}
  - {name: SSDIFAction, definition: "the action required to implement an SSDF task, identified 'SSDIF <SSDF id>', made of numbered DG Specific Actions with normative verbs (shall/should)", attributes: [id, task, dg_scope, number, verb, text], locator: "§5.0.1 ('the action required to implement SSDF Task PO.1.2 is SSDIF PO.1.2'); task tables row 'SSDIF x DG Specific Actions'", kind: stated, tmodel_mapping: "Requirement (DL-0009) with normativity + applicability scope", notes: "183 numbered actions (111 shall, 72 should); three tasks inherit another task's actions."}
  - {name: DevelopmentGroup, definition: "one of three tiers (DG1, DG2, DG3) loosely tied to the complexity of a software development organization's development environment that drives prioritization of tasks and activities", attributes: ["id ∈ {DG1, DG2, DG3}", description], locator: "§5.0.2 Table 5.0-2", kind: stated, tmodel_mapping: "new — an applicability profile on SecurityProgram (R-041) that filters which Requirements apply", notes: "Not a maturity level: chosen by what the organization builds (OTS-reliant / some custom / major custom or SaaS). SaaS and software vendors should treat DG3 as minimum."}
  - {name: DGScope, definition: "the DG applicability label heading a group of actions or artifacts (DG 1/2/3, DG 2/3, DG 3, DG 1/2, DG 1)", attributes: [groups], locator: "every task table", kind: stated, tmodel_mapping: "attribute of Requirement (applies_to profile)", notes: "Cumulative tiers: DG3 gets every DG 1/2/3 + DG 2/3 + DG 3 action."}
  - {name: Role, definition: "a role type that supports the Secure by Design lifecycle and is responsible for identified practices and actions (14: CISO Team, SDL Team, Product Management, Procurement, Engineering Group Leadership, Corporate Leadership, Engineering Group Build Team, Release Engineer or SRE, Program Manager, Architect, Software Engineer, Test Engineer, Writer, Security Response Engineer)", attributes: [role_type, description], locator: "§5.0.3 Table 5.0-3; row 'Responsible Roles' per task", kind: stated, tmodel_mapping: "Party role (§2b relational role); DL-0009 owner/approver are Party roles", notes: "Responsible Roles is assigned per task, not per action."}
  - {name: Organisation, definition: "organized body of people with a cybersecurity or information infrastructure resilience purpose; the subject of every DG action ('The organisation:')", attributes: [development_group], locator: "§3.1 'organisation'; every DG Specific Actions cell", kind: stated, tmodel_mapping: "Party (§2b) — the producer/vendor", notes: "Also 'software development organization' throughout."}
  - {name: Audience, definition: "three parties served: end users/customers (what to ask for), software development organizations (what to do), government and industry bodies (what to look for to verify)", attributes: [kind], locator: "Introduction; §1 Scope", kind: stated, tmodel_mapping: "Party roles: acquirer, producer, assessor/regulator", notes: ""}
  - {name: Artifact, definition: "digital evidence generated as a part of the development process and not for the sole purpose of proving compliance to the process", attributes: [dg_scope, description, version_bound], locator: "§3.1 'artifact'; row 'DG Artifacts'; §5.0.4", kind: stated, tmodel_mapping: "Evidence / WorkProduct (DL-0009 R-042)", notes: "Central claim: evidence is a by-product locked to a code version; evidence created solely for an assessor should be avoided (§5.0.4). This is the strongest 'evidence = byproduct' statement in the SDL set."}
  - {name: ImplementationExample, definition: "informative example of how to implement a task, mostly identical to SSDF examples ('must' quoted)", attributes: [n, text], locator: "row 'Implementation Examples'; §5.0.1", kind: stated, tmodel_mapping: "none (guidance attached to Requirement)", notes: ""}
  - {name: CSCSafeguard, definition: "a CIS Critical Security Control safeguard (ETSI TS 103 305-1) referenced per task and inside actions ('implement CSC Safeguard 6.3')", attributes: [number, title, implementation_group], locator: "row 'CSC Safeguard'; §5.5.1 actions", kind: stated, tmodel_mapping: "external Requirement (crosswalk target) and generic Mitigation of kind process/technical", notes: "§5.5.0 and PO.5.1 speak of IG2/IG3 (CIS Implementation Groups) next to DG — two tier systems in one table."}
  - {name: SAFECodePractice, definition: "a SAFECode fundamental practice named per task", attributes: [name], locator: "row 'SAFECode practices'", kind: stated, tmodel_mapping: "external Requirement (crosswalk target)", notes: ""}
  - {name: FrameworkMapping, definition: "an informative mapping from an SSDF task or SSDIF action to a provision of another framework (CRA Annex I, NCSC CRT APC claims, 29 frameworks in B.2)", attributes: [source_task, target_framework, target_ref, informative], locator: "Annex A, B.1, B.2; Introduction ('informative and do not imply authoritative compliance')", kind: stated, tmodel_mapping: "R-044 maps_to edge — needs strength='informative'", notes: ""}

  # --- products, properties, threats ---
  - {name: SoftwareProduct, definition: "product or online service (incl. SaaS, boxed product, distributed cloud application) produced by the organisation", attributes: [delivery_model, release_cadence], locator: "§4.2; §5.0.4", kind: stated, tmodel_mapping: "Product / ProductInstance (§1.1)", notes: ""}
  - {name: SecurityProperty, definition: "fundamental system property: Confidentiality, Integrity, Availability, Accountability", attributes: [name, definition], locator: "§5.1.0 Table 5.1-1", kind: stated, tmodel_mapping: "security objective / CIA attribute on Asset (§3)", notes: "Adds Accountability (non-repudiation) to CIA."}
  - {name: SecurityFeature, definition: "Authentication, Authorization, Auditing — features that achieve the properties", attributes: [name, intent], locator: "§5.1.0 Table 5.1-2", kind: stated, tmodel_mapping: "MitigationInstance kind=technical (R-040)", notes: ""}
  - {name: AttackClass, definition: "STRIDE classes (Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege) with attack intent", attributes: [name, intent], locator: "§5.1.0 Table 5.1-3; PO.4.1 action 2", kind: stated, tmodel_mapping: "threat category on ThreatInstance (§1.3)", notes: "Also used to categorize security bugs (PO.4.1 #2) — a single taxonomy for threats and bugs."}
  - {name: ThreatModel, definition: "documented threat model identifying possible threats relevant to the system, how they present in scenarios and what can mitigate them; 'threat' refers to vulnerabilities and weaknesses in design rather than threat actors", attributes: [methodology, threats, severity_ratings, tools], locator: "PW.1.1 actions DG3 1-8; DG Artifacts", kind: stated, tmodel_mapping: "tmodel threat-model instance (governed view R-043 over Product + DFD + ThreatInstance)", notes: "Explicitly design-weakness-centric, not actor-centric (PW.1.1 #2; §5.1.0)."}
  - {name: Threat, definition: "a possible threat relevant to the system, with severity rating (high/medium/...) and mitigation", attributes: [description, scenario, severity, mitigation], locator: "PW.1.1 DG3 3-6", kind: stated, tmodel_mapping: "ThreatInstance (§1.3) + RiskScore", notes: "High and medium threats shall be mitigated (#4); high -> bugs shall be created (#5), medium -> should (#6)."}
  - {name: DataFlowDiagram, definition: "initial description of structure, use cases, misuse/abuse cases and resources, often a DFD mapping potential attack points from outside the system, with annotations", attributes: [elements, attack_points, annotations], locator: "PW.1.1 DG3 7-8; DG Artifacts 'DFD describing system and potential attacks'", kind: stated, tmodel_mapping: "DFD layer (§1.2)", notes: "If created, shall accurately depict the system (#8)."}
  - {name: AttackSurface, definition: "set of exposed interfaces and functions in a software product: enabled network ports and protocols, usable features, privileges, options, accessible files", attributes: [elements, default_enabled], locator: "§3.1; §5.3.0; PW.2.1, PW.4.2 DG2/3 1", kind: stated, tmodel_mapping: "AttackSurface (§1.1)", notes: "80 % rule: not needed by 80 % of users -> disabled by default (§5.3.0)."}
  - {name: SecurityRequirement, definition: "security requirements for organization-developed software and for development infrastructure, documented and maintained over time; criteria for which security features must be supported", attributes: [source, scope], locator: "PO.1.1, PO.1.2, PO.1.3, PW.1.2 examples", kind: stated, tmodel_mapping: "Requirement on Product (DL-0009)", notes: ""}
  - {name: ProductSpecification, definition: "product specification created, maintained in a repository, with changes documented in the product workflow system until product is finalized", attributes: [version, change_history], locator: "PW.1.2 DG1/2/3 1-2; DG Artifacts", kind: stated, tmodel_mapping: "WorkProduct; governed view (R-043)", notes: ""}
  - {name: DesignReview, definition: "review of the software design by a qualified person not involved with the design and/or automated toolchain processes, confirming it meets all security requirements and addresses identified risk; findings recorded", attributes: [reviewer, independence, minutes, findings], locator: "PW.2.1 task statement; DG Artifacts 'design security review minutes'", kind: stated, tmodel_mapping: "Review (§4/§5) with independence constraint", notes: ""}
  - {name: Exception, definition: "approved exception to security requirements, with rationale, periodically re-evaluated", attributes: [requirement, rationale, approver, review_date], locator: "PO.1.2 example 7; PW.1.2 examples 1-3; PO.1.3 example 5", kind: stated, tmodel_mapping: "accepted-risk state of MitigationInstance (DEC-009) + Review", notes: "Only in informative examples, never in a DG action."}

  # --- process machinery ---
  - {name: SecureDevelopmentProcess, definition: "documented secure development process addressing design standards, coding practices, training, vulnerability management, third-party code and testing; reviewed annually; itself tracked in a repository with a bug tracker ('for the security team the product is the process')", attributes: [scope_topics, review_cycle, version], locator: "PO.1.2 DG1/2/3 1-2; §5.0.4; §5.2.0", kind: stated, tmodel_mapping: "SDL/SecurityProgram (R-041) — as a versioned, governed artefact (R-043)", notes: "The TS models the SDL as a product with its own work items: root-cause bugs 'fix' the process (§5.0.4)."}
  - {name: WorkflowSystem, definition: "bug tracking / work item system; two kinds: the product workflow system (security bugs, design issues, spec changes) and the secure development process workflow system (tool configuration standards, process changes)", attributes: [kind, items], locator: "§5.0.4; PO.3.3, PO.4.1, PO.4.2, PW.1.2, PW.6.1, PW.7.1 actions; DG Artifacts", kind: stated, tmodel_mapping: "new — evidence source; KG-as-SoT integration point (R-043)", notes: "The TS's primary evidence store; 'Configuration of tools, work items ..., and bug history' is the most repeated DG artifact."}
  - {name: SecurityBug, definition: "security problem treated as a software bug, categorized by STRIDE/CIA, tracked in the normal bug tracking system, marked 'fixed' when corrected", attributes: [category, severity, status, source], locator: "PO.4.1 DG1/2/3 1-3; §5.0.4", kind: stated, tmodel_mapping: "Finding (§1.3)", notes: "Sources: tool output, threat model, vulnerability report, design review, code review."}
  - {name: BugBar, definition: "set of criteria that identifies 'shall fix' coding errors whose presence would block software from being released; severity levels incl. ease of discovery/exploitation and impact; minimum level of security acceptability for shipping", attributes: [severity_levels, criteria, ship_threshold], locator: "§3.1 'bug bar'; PO.4.1 DG1/2/3 4-6; §5.2.0", kind: stated, tmodel_mapping: "Gate exit criteria (R-041) / conformance check (R-042)", notes: "The TS's release gate."}
  - {name: FixClass, definition: "'shall fix' (blocks release) vs 'should fix' (may be fixed later, does not prevent release)", attributes: ["value ∈ {shall fix, should fix}"], locator: "§3.1; §5.0.4; PW.8.2 DG3 4,7,9", kind: stated, tmodel_mapping: "attribute of Finding / Gate rule", notes: ""}
  - {name: ShallFixList, definition: "list of 'shall fix' static analysis errors run before code release; grown from errors linked to three or more external vulnerability reports", attributes: [rules, false_positive_rate], locator: "PW.8.2 DG3 4-9", kind: stated, tmodel_mapping: "Gate criterion + generic Mitigation (process)", notes: "Quantified: ~80 % valid-report sampling, typically ≥3 CVE/GCVE instances."}
  - {name: Tool, definition: "development/security tool or tool type selected per platform: compiler, static analysis, configuration security, dynamic analysis/fuzzing, threat modelling, SCA, code-signing; configured to generate artifacts", attributes: [class, version, configuration, outputs], locator: "§5.2.0 Table 5.2-1; PO.3.1-PO.3.3; PW.6.1-6.2; PS.3.2 DG2/3", kind: stated, tmodel_mapping: "Component of the development Environment (§1.1)", notes: "Evidence includes the tool itself at the required version, so an evaluator can re-run it (§5.0.4)."}
  - {name: Toolchain, definition: "categories of toolchains with mandatory tools and how components integrate", attributes: [category, tools], locator: "PO.3.1 task + examples; PO.3.2", kind: stated, tmodel_mapping: "composed_of over Components", notes: ""}
  - {name: Training, definition: "role-based, just-in-time (tool-output) and defensive-programming training; list of mandatory developer training", attributes: [role, kind, list], locator: "PO.2.2; PW.4.2 DG3 6; RV.3.4", kind: stated, tmodel_mapping: "WorkProduct/Evidence of a training-phase Requirement", notes: ""}
  - {name: ManagementCommitment, definition: "management/executive support for the secure development programme (and DG2/3 security champion programme), evidenced by communications", attributes: [evidence], locator: "PO.2.3", kind: stated, tmodel_mapping: "Evidence (governance)", notes: ""}
  - {name: SecurityChampion, definition: "member of a security champion (SC) programme named in artifacts", attributes: [name, team], locator: "PO.2.3 DG2/3; PW.1.1 example 1", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: DevelopmentEnvironment, definition: "each environment involved in software development (development, build, test, distribution), separated and protected; production vs non-production", attributes: [kind, segmentation, access_controls], locator: "PO.5.1; Annex C PO.5", kind: stated, tmodel_mapping: "Deployment->Environment (§1.1) — dev environment as attack surface", notes: ""}
  - {name: DevelopmentEndpoint, definition: "endpoints for designers, developers, testers, builders, hardened via CSC Safeguards 4.1-4.12", attributes: [configuration], locator: "PO.5.2", kind: stated, tmodel_mapping: "Component of Environment", notes: ""}
  - {name: CodeRepository, definition: "repository storing all forms of code (source, executable, configuration-as-code) under least privilege, with version control, commit signing, code-owner review", attributes: [access_policy, owner], locator: "PS.1.1 + examples", kind: stated, tmodel_mapping: "Component of Environment", notes: ""}
  - {name: CodeOwner, definition: "group of individuals or team designated as the code owner for each project; reviews and approves changes", attributes: [project], locator: "PO.2.1 example 7; PS.1.1 example 4", kind: stated, tmodel_mapping: "Party role", notes: "Informative only."}
  - {name: Release, definition: "software release: signed code delivered to customers, archived files and supporting data, provenance per component", attributes: [version, signature, archive, provenance], locator: "PS.2.1, PS.3.1, PS.3.2", kind: stated, tmodel_mapping: "ProductInstance version (§3b) + release Gate (R-041)", notes: ""}
  - {name: CodeSignature, definition: "signature over all code delivered to customers; certificate from an established CA", attributes: [certificate, algorithm], locator: "PS.2.1 DG1/2/3 1 + examples", kind: stated, tmodel_mapping: "Assertion signature (§4) / supply-chain provenance (deferred)", notes: ""}
  - {name: ThirdPartyComponent, definition: "TPC: software the organization did not itself create (OSS, commercial, remotely invoked services) integrated in the product", attributes: [provider, version, maintenance_status, end_of_life, risk_score], locator: "§5.4.0; PW.4.1; PW.4.4; PS.3.2", kind: stated, tmodel_mapping: "Component (§1.1) supplied_by Party", notes: ""}
  - {name: TPCRiskAssessment, definition: "assessment of the risk each TPC poses: known vulnerabilities, provider maturity (maintenance cadence, stability, practices, EOL) -> risk assessment score (binary or H/M/L)", attributes: [score, factors], locator: "PW.4.1 DG1/2/3 1-8", kind: stated, tmodel_mapping: "RiskScore on Component", notes: ""}
  - {name: ApprovedComponentList, definition: "list of approved third-party components and per-product list of TPCs used and where (SBOM plus internal where-used)", attributes: [components], locator: "PS.3.2 DG1/2/3 1-2", kind: stated, tmodel_mapping: "SBOM / composed_of edges", notes: ""}
  - {name: SBOM, definition: "Software Bill of Materials: specific version and origin of each component", attributes: [components], locator: "§5.4.0; PS.3.2; DG Artifacts 'SBOM for each product'", kind: stated, tmodel_mapping: "external SBOM record; composed_of", notes: ""}
  - {name: Supplier, definition: "third party providing commercial software components, bound by contract/RFP security requirements, possibly audited", attributes: [contract, attestation], locator: "PO.1.3; §5.4.0", kind: stated, tmodel_mapping: "Party (supplier role)", notes: ""}
  - {name: SecureConfigurationBaseline, definition: "documented secure configuration / default settings that do not weaken platform security, documented for administrators", attributes: [settings], locator: "PW.9.1, PW.9.2", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation + technical (R-040)", notes: ""}
  - {name: ConfigurationSetting, definition: "a setting with purpose, options, default value, security relevance, operational impact, relationships", attributes: [purpose, options, default_value, security_relevance, operational_impact, relationships], locator: "PW.9.2 example 2", kind: stated, tmodel_mapping: "attribute set of a documentation MitigationInstance", notes: "Informative."}

  # --- vulnerability handling ---
  - {name: VulnerabilityReport, definition: "report of a potential vulnerability from acquirers, users, public sources, researchers", attributes: [reporter, channel, confidentiality], locator: "RV.1.1", kind: stated, tmodel_mapping: "Finding (§1.3) intake", notes: ""}
  - {name: ReportingChannel, definition: "visible, discoverable location (website + dedicated email) and confidential channel (TLS upload, encrypted email/messaging)", attributes: [url, email, confidential_option], locator: "RV.1.1 DG1/2/3 3-6", kind: stated, tmodel_mapping: "new (Party contact endpoint)", notes: ""}
  - {name: VulnerabilityHandlingPolicy, definition: "externally-facing reporting policy and internal handling policy defining who is responsible in each stage and how information is handled; complies with reporting norms", attributes: [stages, responsibilities], locator: "RV.1.1 DG1/2/3 1-2; RV.1.3", kind: stated, tmodel_mapping: "WorkProduct; governed view", notes: ""}
  - {name: Vulnerability, definition: "confirmed vulnerability with severity, triage, fix, common identifier (CVE/GCVE), criticality", attributes: [id, severity, criticality, owner_team, status], locator: "RV.1.2-RV.2.2", kind: stated, tmodel_mapping: "Vulnerability (§1.3)", notes: ""}
  - {name: SecurityAdvisory, definition: "advisory to acquirers describing the vulnerability, how to find vulnerable instances, how to address it; ideally CSAF with severity and exploitability context", attributes: [description, affected, remediation, format], locator: "§5.6.0; RV.2.2 example 3", kind: stated, tmodel_mapping: "governed view / external message (CSAF)", notes: ""}
  - {name: Remediation, definition: "fix implemented and tested, delivered via automated trusted mechanism; or temporary mitigation; or risk acceptance/transference", attributes: [kind, release], locator: "RV.2.2 + examples", kind: stated, tmodel_mapping: "MitigationInstance (§5) — remedy choice ≈ DEC-009 lifecycle", notes: ""}
  - {name: RootCauseAnalysis, definition: "analysis of the defect's nature, recurrence, trends over time; drives tool, training, process updates and class eradication", attributes: [root_cause, recurring, trend], locator: "RV.3.1-RV.3.4; §5.0.4", kind: stated, tmodel_mapping: "new — feedback edge from Finding to SecurityProgram (R-041)", notes: "Root-cause outputs are themselves work items that 'fix' the process."}
  - {name: PSIRT, definition: "Product Security Incident Response Team with processes and communications plans", attributes: [], locator: "RV.1.3 example 2", kind: stated, tmodel_mapping: "Party role", notes: "Informative example."}
  - {name: Assessment, definition: "evaluation of SbD adoption by an end user/organization, government or industry body, or third party, relying on artifacts and especially workflow items; evaluator may re-run tools to reproduce artifacts", attributes: [assessor, scope, evidence], locator: "§4.2; §5.0.4", kind: stated, tmodel_mapping: "Review (§4) / deferred audit model (#19)", notes: "No pass/fail scheme or rating is defined; 'sufficiently addressed the six Essentials'."}
  - {name: ResidualRisk, definition: "level of residual vulnerability acceptable to the end user given threats and consequences", attributes: [level], locator: "§4.2; §5.0.4", kind: stated, tmodel_mapping: "RiskScore after treatment (§3)", notes: "Decided by the end user, not by the TS."}
  - {name: AIUseDomain, definition: "four domains where AI/ML meets secure development: AI components in the product, AI-assisted code creation, AI tools for assurance, adversarial AI", attributes: [domain], locator: "§5.0.5", kind: stated, tmodel_mapping: "none (context; could tag Requirements)", notes: "AI-generated code is subject to the same practices."}

edges:
  - {name: groups, from: Essential, to: SSDFTask, cardinality: "1:N", definition: "each Essential groups a fixed list of SSDF tasks", locator: "§5.0.1 Table 5.0-1", kind: stated, tmodel_mapping: "Requirement grouping (new)"}
  - {name: implements, from: SSDIFAction, to: SSDFTask, cardinality: "1:1", definition: "SSDIF X is the action required to implement SSDF task X", locator: "§5.0.1", kind: stated, tmodel_mapping: "Requirement refines Requirement (R-044 maps_to strength=refines)"}
  - {name: same_as, from: SSDIFAction, to: SSDIFAction, cardinality: "N:1", definition: "a task's actions are 'Same as' another's (PW.6.2->PW.6.1, PW.9.2->PW.9.1; PW.5.1->PW.4.2 by NOTE)", locator: "PW.5.1, PW.6.2, PW.9.2 tables", kind: stated, tmodel_mapping: "Requirement equivalence"}
  - {name: furthers, from: SSDIFAction, to: SSDIFAction, cardinality: "N:1", definition: "PW.8.2 actions further the implementation of PW.4.2 actions", locator: "PW.4.2 NOTE", kind: stated, tmodel_mapping: "Requirement supports Requirement"}
  - {name: applies_to, from: SSDIFAction, to: DevelopmentGroup, cardinality: "N:M", definition: "each numbered action applies to the DGs in its DG scope", locator: "every task table", kind: stated, tmodel_mapping: "Requirement applicability filter on SecurityProgram"}
  - {name: classified_as, from: Organisation, to: DevelopmentGroup, cardinality: "N:1", definition: "an organisation belongs to one DG by its development profile", locator: "§5.0.2", kind: stated, tmodel_mapping: "attribute of SecurityProgram/Party"}
  - {name: responsible_for, from: Role, to: SSDFTask, cardinality: "N:M", definition: "Responsible Roles row per task", locator: "row 'Responsible Roles'", kind: stated, tmodel_mapping: "Party role -> Requirement ownership"}
  - {name: evidenced_by, from: SSDFTask, to: Artifact, cardinality: "1:N", definition: "DG Artifacts that demonstrate the task was implemented effectively", locator: "row 'DG Artifacts'; §4.2", kind: stated, tmodel_mapping: "Requirement satisfied_by Evidence (R-042)"}
  - {name: locked_to, from: Artifact, to: Release, cardinality: "N:1", definition: "artifacts are locked or attached to a specific version of code under development", locator: "§5.0.4", kind: stated, tmodel_mapping: "Evidence about ProductInstance version (§3b)"}
  - {name: maps_to, from: SSDFTask, to: FrameworkMapping, cardinality: "1:N", definition: "informative mappings to CSC, SAFECode, CRA, CRT APC and 29 frameworks", locator: "task tables; Annex A, B.1, B.2", kind: stated, tmodel_mapping: "R-044 maps_to"}
  - {name: references_safeguard, from: SSDIFAction, to: CSCSafeguard, cardinality: "N:M", definition: "actions of the form 'shall/should implement CSC Safeguard x.y'", locator: "§5.5.1, PW.4.2, PO.2.2", kind: stated, tmodel_mapping: "Requirement delegates_to external Requirement"}
  - {name: identifies, from: ThreatModel, to: Threat, cardinality: "1:N", definition: "threat model identifies threats, scenarios and mitigations", locator: "PW.1.1 DG3 3", kind: stated, tmodel_mapping: "threat-model view contains ThreatInstance"}
  - {name: rated, from: Threat, to: FixClass, cardinality: "N:1", definition: "threat severity rated; high and medium shall be mitigated", locator: "PW.1.1 DG3 4", kind: stated, tmodel_mapping: "RiskScore"}
  - {name: becomes_bug, from: Threat, to: SecurityBug, cardinality: "1:N", definition: "bugs created in the workflow system for high (shall) and medium (should) threats, then fixed", locator: "PW.1.1 DG3 5-6; §5.0.4", kind: stated, tmodel_mapping: "ThreatInstance -> MitigationInstance work item (DEC-009)"}
  - {name: depicts, from: DataFlowDiagram, to: SoftwareProduct, cardinality: "N:1", definition: "description shall accurately depict the system being modelled", locator: "PW.1.1 DG3 8", kind: stated, tmodel_mapping: "DFD of Product (§1.2)"}
  - {name: categorized_by, from: SecurityBug, to: AttackClass, cardinality: "N:1", definition: "security bugs categorized with STRIDE, CIA or similar", locator: "PO.4.1 DG1/2/3 2", kind: stated, tmodel_mapping: "Finding category"}
  - {name: gates, from: BugBar, to: Release, cardinality: "1:N", definition: "bug bar decides whether impact/exploitability is high enough to delay release; minimum security acceptability for shipping", locator: "PO.4.1 DG1/2/3 4-6", kind: stated, tmodel_mapping: "Gate.exit_criteria (R-041)"}
  - {name: blocks, from: ShallFixList, to: Release, cardinality: "1:N", definition: "static analysis tool run before release to ensure 'shall fix' errors are fixed", locator: "PW.8.2 DG3 4", kind: stated, tmodel_mapping: "Gate criterion (automatable, R-042)"}
