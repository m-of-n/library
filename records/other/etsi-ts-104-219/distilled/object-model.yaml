gaps:
  - "Applicability profile: DevelopmentGroup filters which Requirements apply to a SecurityProgram (DG1/2/3 cumulative). tmodel's R-041 SecurityProgram has no applicability-tier attribute and R-042 conformance has no notion of 'requirement not applicable at this tier'."
  - "Two workflow systems as evidence stores (product vs secure-development-process). tmodel has Evidence but no typed link to the external work-item system an Assertion came from; R-043 governed views need it."
  - "Process-as-product feedback: RootCauseAnalysis -> SecureDevelopmentProcess update (RV.3.4, §5.0.4). tmodel has no edge from a Finding/Vulnerability to a change of the SDL/SecurityProgram itself."
  - "BugBar / FixClass ('shall fix' vs 'should fix') as a release-gate rule on Findings; R-041 Gate exit criteria need a typed severity threshold, not free text."
  - "Threat = design weakness (not actor) is stated explicitly; tmodel ThreatInstance should say which sense it uses (critic M1 actor identity)."
  - "Mapping strength: all Annex mappings are informative; R-044 maps_to needs a strength/authority attribute (published-informative vs normative vs our-judgement)."
  - "Role-to-task responsibility (14 roles × 42 tasks) is a RACI-like matrix; tmodel Party roles have no 'responsible_for Requirement' edge."
