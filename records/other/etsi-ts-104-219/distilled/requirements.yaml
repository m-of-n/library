        text: "Design specifications or other design documents; design security review minutes; bugs for design issues in the workflow system."
    implementation_examples:
      - n: "1"
        text: "Review the software design to confirm that it addresses applicable security requirements."
      - n: "2"
        text: "Review the risk models created during software design to determine if they appear to adequately identify the risks."
      - n: "3"
        text: "Review the software design to confirm that it satisfactorily addresses the risks identified by the risk models."
      - n: "4"
        text: "Have the software designer correct failures to meet the requirements."
      - n: "5"
        text: "Change the design and/or the risk response strategy if the security requirements cannot be met."
      - n: "6"
        text: "Record the findings of design reviews to serve as artifacts (e.g. in the software specification, in the issue tracking system, in the threat model)."
