  - id: "etsi-ts-104-219#SSDIF-PW.2.1"
    ssdf_task: "PW.2.1"
    essential: "Essential 1: Secure Software Design"
    locator: "clause 5.1.1, Task ID PW.2.1 (source line 1630 of .cache/etsi-ts-104-219.txt)"
    title: "Have 1) a qualified person (or people) who were not involved with the design and/or 2) automated processes instantiated in the toolchain review the software design to confirm and enforce that it meets all of the security requirements and satisfactorily addresses the identified risk information."
    csc_safeguard: "16.10"
    safecode_practices: "Apply secure design principles in application architectures [i.3]."
    responsible_roles: "Program Manager"
    phase: "design"
    dg_artifacts:
