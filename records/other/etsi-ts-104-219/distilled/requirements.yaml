  - id: "etsi-ts-104-219#SSDIF-PO.1.3"
    ssdf_task: "PO.1.3"
    essential: "Essential 4: Supply Chain Security"
    locator: "clause 5.4.1, Task ID PO.1.3 (source line 2486 of .cache/etsi-ts-104-219.txt)"
    title: "Communicate requirements to all third parties who will provide commercial software components to the organization for reuse by the organization's own software. [Formerly PW.3.1]"
    csc_safeguard: "16.4"
    safecode_practices: "Manage security risk inherent in use of third party components"
    responsible_roles: "SDL Team; Procurement"
    phase: "supply-chain"
    dg_artifacts:
      - dg: "DG 1/2/3"
        text: "Contracts, RFPs etc. with security requirements."
    implementation_examples:
      - n: "1"
        text: "Define a core set of security requirements for software components, and include it in acquisition documents, software contracts, and other agreements with third parties."
      - n: "2"
        text: "Define security-related criteria for selecting software; the criteria can include the third party's vulnerability disclosure program and product security incident response capabilities or the third party's adherence to organization-defined practices."
      - n: "3"
        text: "Require third parties to attest that their software complies with the organization's security requirements."
      - n: "4"
        text: "Require third parties to provide provenance data and integrity verification mechanisms for all components of their software."
      - n: "5"
        text: "Establish and follow processes to address risk when there are security requirements that third-party software components to be acquired do not meet; this should include periodic reviews of all approved exceptions to requirements."
