tasks:
  - id: "etsi-ts-104-219#SSDIF-PO.1.2"
    ssdf_task: "PO.1.2"
    essential: "Essential 1: Secure Software Design"
    locator: "clause 5.1.1, Task ID PO.1.2 (source line 1462 of .cache/etsi-ts-104-219.txt)"
    title: "Identify and document all security requirements for organization-developed software to meet and maintain the requirements over time."
    csc_safeguard: "16.1, 16.2"
    safecode_practices: "N/A"
    responsible_roles: "SDL Team; Product Management"
    phase: "governance"
    dg_artifacts:
      - dg: "DG 1/2/3"
        text: "Documented a secure development process that is updated yearly or when significant changes occur."
      - dg: "DG 1/2/3"
        text: "Work item tracking system showing the organization is following the documented process and updates it at least annually."
    implementation_examples:
      - n: "1"
        text: "Define policies that specify risk-based software architecture and design requirements, such as making code modular to facilitate code reuse and updates; isolating security components from other components during execution; avoiding undocumented commands and settings; and providing features that will aid software acquirers with the secure deployment, operation, and maintenance of the software."
      - n: "2"
        text: "Define policies that specify the security requirements for the organization's software and verify compliance at key points in the SDLC (e.g. classes of software flaws verified by gates, responses to vulnerabilities discovered in released software)."
      - n: "3"
        text: "Analyse the risk of applicable technology stacks (e.g. languages, environments, deployment models) and recommend or require the use of stacks that will reduce risk compared to others."
      - n: "4"
        text: "Define policies that specify what needs to be archived for each software release (e.g. code, package files, third-party libraries, documentation, data inventory) and how long it needs to be retained based on the SDLC model, software end-of-life, and other factors."
      - n: "5"
        text: "Ensure that policies cover the entire software life cycle, including notifying users of the impending end of software support and the date of software end-of-life."
      - n: "6"
        text: "Review all security requirements at least annually, or sooner if there are new requirements from internal or external sources, a major vulnerability is discovered in released software, or a major security incident targeting organization-developed software has occurred."
      - n: "7"
        text: "Establish and follow processes for handling requirement exception requests, including periodic reviews of all approved exceptions."
    action_count: 2
    dg_with_no_actions: []
    notes: []
