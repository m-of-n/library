  - id: "etsi-ts-104-219#SSDIF-PO.5.2"
    ssdf_task: "PO.5.2"
    essential: "Essential 5: Code Integrity"
    locator: "clause 5.5.1, Task ID PO.5.2 (source line 2836 of .cache/etsi-ts-104-219.txt)"
    title: "Secure and harden development endpoints (i.e. endpoints for software designers, developers, testers, builders, etc.) to perform development-related tasks using a risk-based approach."
    csc_safeguard: "4.1 thru 4.12"
    safecode_practices: "N/A"
    responsible_roles: "CISO Team"
    phase: "supply-chain"
    dg_artifacts:
      - dg: "DG 1/2/3"
        text: "Documentation describing the organization's secure configuration process."
      - dg: "DG 1/2/3"
        text: "Configurations to show implementation of the secure configuration process and Safeguards 4.1 thru 4.12."
    implementation_examples:
      - n: "1"
        text: "Configure each development endpoint based on approved hardening guides, checklists, etc.; for example, enable FIPS-compliant encryption of all sensitive data at rest and in transit."
      - n: "2"
        text: "Configure each development endpoint and the development resources to provide the least functionality needed by users and services and to enforce the principle of least privilege."
      - n: "3"
        text: "Continuously monitor the security posture of all development endpoints, including monitoring and auditing all use of privileged access."
      - n: "4"
        text: "Configure security controls and other tools involved in securing and hardening development endpoints to generate artifacts for their activities."
      - n: "5"
        text: "Require multi-factor authentication for all access to development endpoints and development resources."
      - n: "6"
        text: "Provide dedicated development endpoints on non-production networks for performing all development-related tasks. Provide separate endpoints on production networks for all other tasks."
      - n: "7"
        text: "Configure each development endpoint following a zero trust architecture."
    action_count: 12
