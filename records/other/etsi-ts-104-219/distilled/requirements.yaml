note: "Native ids: SSDIF actions are identified by the NIST SSDF task id prefixed by SSDIF (clause 5.0.1: 'the action required to implement SSDF Task PO.1.2 is SSDIF PO.1.2'). Each task table carries numbered actions grouped by Development Group scope (DG 1/2/3, DG 2/3, DG 3, DG 1/2, DG 1); numbering restarts per DG scope, so entry ids are <record>#SSDIF-<task>-DG<scope>-<n>. 'requirements' holds one entry per numbered DG action (verbatim cell text, line breaks joined), 3 inheritance entries, and the prescriptive prose 'should' sentences (R-NNNN). 'tasks' holds the 42 task-level rows (task statement, CSC Safeguard, SAFECode practice, DG Artifacts, Responsible Roles, Implementation Examples) and maps_to: every mapping the TS itself publishes - task-table CSC Safeguard and SAFECode rows, Annex A (CRA Annex I/III/IV/V-VIII -> SSDIF action ids), Annex B.1 (UK NCSC CRT APC claims -> SSDIF action ids) and Annex B.2 (SSDF task -> 29 frameworks: BSAFSS, BSIMM, CNCF SSCP, EO 14028, IDA SOAR, IEC 62443-4-1, NISTIR 8397, ISO/IEC 27034-1, ISO/IEC 29147, ISO/IEC 30111, MS SDL, NIST CSF 1.1, NIST labeling, NTIA SBOM, OWASP ASVS/MASVS/SAMM/SCVS, PCI Secure SLC, five SAFECode guides, SP 800-53/160/161/181/216). The Annexes are informative and 'do not imply authoritative compliance' (Introduction). DERIVED fields (actor, nature, phase, expects_deliverables, verification, testable) need human review; text is verbatim. The DG Artifacts are the TS's evidence model: expects_deliverables copies the artifacts whose DG scope overlaps the action's."
