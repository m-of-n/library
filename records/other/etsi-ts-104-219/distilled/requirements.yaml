reconciliation: "BCP 14 count is 0: ETSI deliverables use the ETSI Drafting Rules verbal forms in lower case ('shall', 'should', 'may', ...) and forbid 'must' except in citation ('Modal verbs terminology'). The document's own normative baseline is the numbered 'DG Specific Actions' of the 42 task tables (clauses 5.1.1-5.6.1): 183 numbered actions = 111 'shall' + 72 'should', plus 2 explicit 'None' cells (PW.1.1 DG 1/2, RV.3.4 DG 1/2) and 3 tasks whose actions are 'Same as' another (PW.5.1->PW.4.2 via NOTE, PW.6.2->PW.6.1, PW.9.2->PW.9.1); all 183 are extracted, one entry each. Lower-case word counts over the whole source are shall 130 / should 148; the difference is (a) definitions and the quoted terms \"shall fix\"/\"should fix\" (clause 3.1, 5.0.4, 5.2.0, PW.8.2), (b) the modal-verb clause and ETSI boilerplate, (c) the Annex A quotation of CRA I.II(2) (\"shall\" [i.12]), (d) 'should' inside Implementation Examples copied from SSDF (informative), and (e) 34 prescriptive prose 'should' sentences in clauses Introduction-5.6.0, which ARE extracted as R-0001..R-0034. Descriptive or predictive uses of 'should' (e.g. 5.0.1 'All normative requirements identified by \"shall\"...', 4.2 'should enable end users', 5.4.0 'should have been developed') are not requirements and are not extracted."
