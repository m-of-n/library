  - id: "etsi-ts-104-219#SSDIF-RV.2.2"
    ssdf_task: "RV.2.2"
    essential: "Essential 6: Vulnerability Disclosure and Remediation"
    locator: "clause 5.6.1, Task ID RV.2.2 (source line 3212 of .cache/etsi-ts-104-219.txt)"
    title: "Plan and implement risk responses for vulnerabilities."
    csc_safeguard: "16.2"
    safecode_practices: "Create and Manage a Vulnerability Response Process"
    responsible_roles: "Security Response Engineer; Software Engineer; Program Manager"
    phase: "operations/response"
    dg_artifacts:
      - dg: "DG 1/2/3"
        text: "Entry in the workflow system and the fixed code."
      - dg: "DG 1/2/3"
        text: "Entries in the required Vulnerability Database, when appropriate."
    implementation_examples:
      - n: "1"
        text: "Make a risk-based decision as to whether each vulnerability will be remediated or if the risk will be addressed through other means (e.g. risk acceptance, risk transference) and prioritize any actions to be taken."
      - n: "2"
        text: "If a permanent mitigation for a vulnerability is not yet available, determine how the vulnerability can be temporarily mitigated until the permanent solution is available, and add that temporary remediation to the plan."
      - n: "3"
        text: "Develop and release security advisories that provide the necessary information to software acquirers, including descriptions of what the vulnerabilities are, how to find instances of the vulnerable software, and how to address them (e.g. where to get patches and what the patches change in the software; what configuration settings may need to be changed; how temporary workarounds could be implemented)."
      - n: "4"
        text: "Deliver remediations to acquirers via an automated and trusted delivery mechanism. A single remediation could address multiple vulnerabilities."
      - n: "5"
        text: "Update records of design decisions, risk responses, and approved exceptions as needed. See PW.1.2."
    action_count: 3
    dg_with_no_actions: []
    notes: []
