      - dg: "DG 1/2/3"
        text: "Configurations to show implementation of the access management process and Safeguards 6.1 thru 6.8."
    implementation_examples:
      - n: "1"
        text: "Store all source code and configuration-as-code in a code repository and restrict access to it based on the nature of the code. For example, open-source code intended for public access may need its integrity and availability protected; other code may also need its confidentiality protected."
      - n: "2"
        text: "Use version control features of the repository to track all changes made to the code with accountability to the individual account."
      - n: "3"
        text: "Use commit signing for code repositories."
      - n: "4"
        text: "Have the code owner review and approve all changes made to the code by others."
      - n: "5"
        text: "Use code signing to help protect the integrity of executables."
      - n: "6"
        text: "Use cryptography (e.g. cryptographic hashes) to help protect file integrity."
