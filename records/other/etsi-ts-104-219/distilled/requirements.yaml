  - id: "etsi-ts-104-219#SSDIF-PW.4.1"
    ssdf_task: "PW.4.1"
    essential: "Essential 4: Supply Chain Security"
    locator: "clause 5.4.1, Task ID PW.4.1 (source line 2517 of .cache/etsi-ts-104-219.txt)"
    title: "Acquire and maintain well-secured software components (e.g. software libraries, modules, middleware, frameworks) from commercial, open-source, and other third-party developers for use by the organization's software."
    csc_safeguard: "16.5"
    safecode_practices: "Manage security risk inherent in use of third party components"
    responsible_roles: "Program Manager; Procurement"
    phase: "supply-chain"
    dg_artifacts:
      - dg: "DG 1/2/3"
        text: "Documented criteria for accepting third party components; notes, checklists, or minutes of reviews for component acceptability."
    implementation_examples:
      - n: "1"
        text: "Review and evaluate third-party software components in the context of their expected use. If a component is to be used in a substantially different way in the future, perform the review and evaluation again with that new context in mind."
      - n: "2"
        text: "Determine secure configurations for software components, and make these available (e.g. as configuration-as-code) so developers can readily use the configurations."
      - n: "3"
        text: "Obtain provenance information (e.g. SBOM, source composition analysis, binary software composition analysis) for each software component and analyse that information to better assess the risk that the component may introduce."
      - n: "4"
        text: "Establish one or more software repositories to host sanctioned and vetted open-source components."
      - n: "5"
        text: "Maintain a list of organization-approved commercial software components and component versions along with their provenance data."
      - n: "6"
        text: "Designate which components \"must\" [i.1] be included in software to be developed."
      - n: "7"
        text: "Implement processes to update deployed software components to newer versions and retain older versions of software components until all transitions from those versions have been completed successfully."
      - n: "8"
        text: "If the integrity or provenance of acquired binaries cannot be confirmed, build binaries from source code after verifying the source code's integrity and provenance."
    action_count: 8
    dg_with_no_actions: []
    notes: []
    maps_to:
