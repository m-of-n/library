  - id: "etsi-ts-104-219#SSDIF-PO.5.1"
    ssdf_task: "PO.5.1"
    essential: "Essential 5: Code Integrity"
    locator: "clause 5.5.1, Task ID PO.5.1 (source line 2756 of .cache/etsi-ts-104-219.txt)"
    title: "Separate and protect each environment involved in software development."
    csc_safeguard: "6.3, 6.4, 6.5, 12.2, 16.8"
    safecode_practices: "N/A"
    responsible_roles: "CISO Team"
    phase: "supply-chain"
    dg_artifacts:
      - dg: "DG 1"
        text: "Documents to show implementation of Critical Security Controls to include:"
      - dg: "DG 1"
        text: "Policies/Process for: enterprise asset inventory, software asset inventory, data management, secure configuration of enterprise assets and software, account management, access control management, vulnerability management, audit log management, data recovery, security awareness and skills training, incident response management."
      - dg: "DG 1"
        text: "Configurations to show implementation of policies/processes and safeguards."
      - dg: "DG 2/3"
        text: "Documents to show implementation of IG2/3 safeguards to include:"
      - dg: "DG 2/3"
        text: "Policies Process for: Network Infrastructure Management, Service Provider Management, Application Software Security, Penetration Testing."
      - dg: "DG 2/3"
        text: "Configurations to show implementation of policies/processes and Safeguards."
    implementation_examples:
      - n: "1"
        text: "Use multi-factor, risk-based authentication and conditional access for each environment."
      - n: "2"
        text: "Use network segmentation and access controls to separate the environments from each other and from production environments, and to separate components from each other within each non-production environment, in order to reduce attack surfaces and attackers' lateral movement and privilege/access escalation."
      - n: "3"
        text: "Enforce authentication and tightly restrict connections entering and exiting each software development environment, including minimizing access to the internet to only what is necessary."
      - n: "4"
        text: "Minimize direct human access to toolchain systems, such as build services. Continuously monitor and audit all access attempts and all use of privileged access."
      - n: "5"
        text: "Minimize the use of production-environment software and services from non-production environments."
      - n: "6"
        text: "Regularly log, monitor, and audit trust relationships for authorization and access between the environments and between the components within each environment."
      - n: "7"
        text: "Continuously log and monitor operations and alerts across all components of the development environment to detect, respond, and recover from attempted and actual cyber incidents."
      - n: "8"
        text: "Configure security controls and other tools involved in separating and protecting the environments to generate artifacts for their activities."
      - n: "9"
        text: "Continuously monitor all software deployed in each environment for new vulnerabilities and respond to vulnerabilities appropriately following a risk-based approach."
      - n: "10"
        text: "Configure and implement measures to secure the environments hosting infrastructures following a zero trust architecture."
    action_count: 10
    dg_with_no_actions: []
