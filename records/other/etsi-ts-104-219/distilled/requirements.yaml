        text: "Product specification, work items in the in the product workflow system."
    implementation_examples:
      - n: "1"
        text: "Maintain one or more software repositories of modules for supporting standardized security features and services."
      - n: "2"
        text: "Determine secure configurations for modules for supporting standardized security features and services, and make these configurations available (e.g. as configuration-as-code) so developers can readily use them."
      - n: "3"
        text: "Define criteria for which security features and services \"must\" [i.1] be\" supported by software to be developed."
