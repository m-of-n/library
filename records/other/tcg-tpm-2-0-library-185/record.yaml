  note: "The specification is four PDFs plus an errata document, all openly downloadable from the TCG library-specification page; content.url/sha256 are Part 1 (Architecture), the part that defines the ML-DSA and ML-KEM clauses. Other digests (sha256 of the PDF bytes, fetched 2026-11-03): Part 0 Introduction (41 pp) d8b43afb50e5c17e307c7fd1b69cb16d2e2cfa6adb4df574bbb652db3c30e9f1; Part 2 Structures (224 pp) 67a6786816d6ef36952e910750652c0fb4668926369be81954dcf0f63c012b77; Part 3 Commands (391 pp) e7f6e1ec3d801f42e2da9d1a416922cab5695a21940bd80b5f7090a6cddf7551; Errata v1 for v185 (10 pp, 2026-03-12, marked non-normative) 3ca362bc3a99c31f8e13a3773f643d78e9f4aec811582dfef4b2a0a8fc7529f4. The record's original URL was the TCG press release (2026-03-22), fetched too (HTML, sha256 6e157c2b119de59035a3fbe7f5ccf1b4d18ad575c706e33b4067a6e9cd55b401) but it is not the specification. Every part's cover says 'TCG Published', dated March 12, 2026. Maturity is recorded as standard on that basis: TCG Published is TCG's ratified state. This is not an ISO/IEC 11889 edition. Read scope is partial and stated in summary.md: Part 0 and the errata in full, Parts 1-3 only in the PQC-relevant clauses."
