  - id: 'etsi-en-304-223#R-0128'
    locator: '§4'
    text: 'An entity that holds more than one Table 4-1 role is bound by the provisions addressed to each role it holds; an organization that builds an AI model and also embeds or deploys it answers for the Developer provisions and the System Operator provisions alike.'
    verb: 'none'
    kind: inferred
    actor: 'any entity holding several Table 4-1 roles'
    object: 'the provision set that applies to the entity'
    field: 'role assignment per entity'
    testable: 'partial'
    testable_reason: 'role assignment is a fact to establish per entity; once it is, each role''s provisions are tested as usual.'
    derived_from: 'R-0001 (§4); Table 4-1 Developers row L453-458'
    reason: 'the possibility statement says only that one entity holds several roles, and the Developers row classes the create-and-deploy case as both roles; that each role brings its provisions with it is never said outright.'
  - id: 'etsi-en-304-223#R-0129'
    locator: '§4'
    text: 'A provision binds the actors its own text names, whether or not its principle''s applicability line lists them: Data Custodians under 5.1.2-5 and End-users under 5.2.1-4 are bound although Principles 2 and 5 do not list them, and Principle 10, which has no applicability line, binds the actors its provisions name.'
    verb: 'none'
    kind: inferred
    actor: 'all Table 4-1 stakeholders'
    object: 'applicability lines of the principles'
    field: 'actor of each provision'
    testable: 'no'
    testable_reason: 'a reading rule for conformance assessment, not a behaviour.'
    derived_from: 'R-0097 (§4); R-0018 (5.1.2-5); R-0041 (5.2.1-4); R-0106 (§5.1.2); R-0114 (§5.2.1)'
    reason: 'the EN gives the lines as an indication of primary responsibility (L433-434) and never says what a line means for a named actor missing from it.'
  - id: 'etsi-en-304-223#R-0130'
    locator: '§5.1.1'
    text: 'Where a provision''s actor is an Organization (5.1.1-1 to 5.1.1-2.2, 5.1.2-5.1), the bound party is each organization that holds a role in that principle''s applicability line: System Operators, Developers and Data Custodians for Principle 1, System Operators and Developers for 5.1.2-5.1.'
    verb: 'none'
    kind: inferred
    actor: 'Organization (System Operator; Developer; Data Custodian)'
    object: 'Principle 1 provisions and 5.1.2-5.1'
    field: 'actor of those provisions'
    testable: 'no'
    testable_reason: 'a reading of an undefined actor, not a behaviour.'
    derived_from: 'R-0104 (5.1.1-1); R-0008 (5.1.1-2); R-0011 (5.1.1-2.2); R-0019 (5.1.2-5.1); R-0103 (§5.1.1); R-0106 (§5.1.2)'
    reason: 'Organization is neither a Table 4-1 role nor a §3.1 term; the applicability line is the only link the EN gives between these provisions and the stakeholder roles.'
  - id: 'etsi-en-304-223#R-0131'
    locator: '§5.1.3'
    text: 'The Developer that is unable to resolve an identified AI security threat is the party that communicates it to System Operators under 5.1.3-2; the System Operator''s own threat modelling of the threat, and its communication to End-users, follow that receipt.'
    verb: 'none'
    kind: inferred
    actor: 'Developer'
    object: 'AI security threats Developers are unable to resolve'
    field: 'communication to System Operators'
    testable: 'partial'
    testable_reason: 'communication records are checkable once threats are recorded as unresolved; the Developer''s own determination decides which those are.'
    derived_from: 'R-0111 (5.1.3-2); R-0110 (5.1.3-2); R-0028 (5.1.3-2); R-0022 (5.1.3-1)'
    reason: 'the sentence is passive and names no one who communicates; its condition makes the Developer the party placed to know that a threat is unresolved.'
  - id: 'etsi-en-304-223#R-0132'
    locator: '§5.1.3'
    text: 'Under 5.1.3-1.1, the threat modelling and risk management for a new or updated setting or configuration option is done no later than the change takes effect, because the risks it addresses are those the change brings.'
    verb: 'none'
    kind: inferred
    actor: 'Developer; System Operator'
    object: 'changes to settings and configuration options'
    field: 'threat-model and risk record dated no later than the change'
    testable: 'yes'
    derived_from: 'R-0024 (5.1.3-1.1)'
    reason: 'the provision gives the trigger, not the timing; addressing the risks a change brings implies the assessment is in place by the time it takes effect.'
  - id: 'etsi-en-304-223#R-0133'
    locator: '§5.2.1'
    text: 'The asset inventory of 5.2.1-1 is in place before the asset processes of 5.2.1-2 and the disposal and deletion of 5.5.1-1 and 5.5.1-2 are applied, since each acts on the inventoried assets.'
    verb: 'none'
    kind: inferred
    actor: 'Developer; Data Custodian; System Operator'
    object: 'asset inventory'
    field: 'inventory in place before the asset processes act on it'
    testable: 'partial'
    testable_reason: 'that the processes act on inventoried assets is checkable by sampling; asset is undefined in §3.1.'
    derived_from: 'R-0037 (5.2.1-1); R-0038 (5.2.1-2); R-0090 (5.5.1-1); R-0092 (5.5.1-2)'
    reason: 'no provision orders them; 5.2.1-2 secures their assets and 5.5.1 disposes of them without saying that the inventory comes first.'
  - id: 'etsi-en-304-223#R-0134'
    locator: '§5.2.5'
    text: 'Testing under 5.2.5-1 is complete before a model, application or system is released; the evaluations 5.2.3-3 re-runs on a released model are complete before that model is put to use; and a major update treated as a new version under 5.4.1-2 passes through 5.2.5-1 and 5.2.5-2 again before its release and deployment.'
    verb: 'none'
    kind: inferred
    actor: 'Developer; System Operator'
    object: 'releases, adopted models and major updates'
    field: 'test and evaluation records dated before release, use or deployment'
    testable: 'yes'
    derived_from: 'R-0067 (5.2.5-1); R-0068 (5.2.5-2); R-0057 (5.2.3-3); R-0084 (5.4.1-2)'
    reason: '5.2.3-3 names models they intend on using without saying the re-run comes first, and 5.4.1-2 asks for a new testing and evaluation process without naming 5.2.5.'
  - id: 'etsi-en-304-223#R-0135'
    locator: '§5.4.1'
    text: 'Security updates pass from Developer to System Operator to End-user: the System Operator''s delivery under 5.4.1-1 follows the Developer''s update and notification, and where an update changes a model, the System Operator''s advance notice under 5.2.3-4 comes before the update is applied.'
    verb: 'none'
    kind: inferred
    actor: 'Developer; System Operator'
    object: 'security updates and patches'
    field: 'notification, notice and delivery timestamps'
    testable: 'yes'
    derived_from: 'R-0081 (5.4.1-1); R-0082 (5.4.1-1); R-0058 (5.2.3-4); R-0078 (5.3.1-2.2)'
    reason: 'each sentence binds one link; the order between them, and how the 5.2.3-4 notice meets the 5.4.1-1 delivery for a model update, are not stated.'
    note: 'An urgent security patch that changes a model meets both 5.4.1-1 and 5.2.3-4; the EN gives no exception to the advance notice.'
  - id: 'etsi-en-304-223#R-0136'
    locator: '§5.2.4'
    text: 'The training-data documentation of 5.2.4-2 and 5.2.4-2.1 is recorded when the data is obtained, since it carries the date and time of acquisition and the source as it then was (a scraped page changes or disappears), which a later reconstruction does not reliably recover.'
    verb: 'none'
    kind: inferred
    actor: 'Developer'
    object: 'training-data documentation'
    field: 'record created at acquisition time'
    testable: 'yes'
    derived_from: 'R-0063 (5.2.4-2); R-0064 (5.2.4-2.1)'
    reason: 'the EN lists what the record holds, not when it is made; its stated purpose, telling whether a later-reported poisoning attack reached the data (L753-754), depends on the record being contemporaneous.'
  - id: 'etsi-en-304-223#R-0137'
    locator: '§5.2.4'
    text: 'For the hashes of 5.2.4-1.2 to let other stakeholders verify authenticity, each hash value reaches them through a source they authenticate separately from the component''s own download; a hash taken from the same unauthenticated place as the component shows only that the two match.'
    verb: 'none'
    kind: inferred
    actor: 'Developer'
    object: 'published component hashes'
    field: 'hash publication channel'
    testable: 'partial'
    testable_reason: 'the publication channel is checkable; whether it is independent of the download is a judgement on the distribution set-up.'
    derived_from: 'R-0062 (5.2.4-1.2)'
    reason: 'the provision states the purpose (verifying authenticity) but no algorithm, format or channel; the channel condition follows from the purpose.'
  - id: 'etsi-en-304-223#R-0138'
    locator: '§5.1.4'
    text: 'Developers and System Operators hold a defined statement of the AI system''s prohibited use cases; 5.1.4-5 presupposes one, and no provision has it drawn up.'
    verb: 'none'
    kind: inferred
    actor: 'Developer; System Operator'
    object: 'prohibited use cases'
    field: 'documented list of prohibited uses'
    testable: 'yes'
    derived_from: 'R-0036 (5.1.4-5); R-0077 (5.3.1-2.1)'
    reason: 'telling End-users which uses are prohibited presupposes that the prohibited uses are defined.'
  - id: 'etsi-en-304-223#R-0139'
    locator: '§5.1.4'
    text: 'A Developer verifying under 5.1.4-4 first obtains the security controls the Data Custodian specified; no provision has a Data Custodian specify them, so the verification rests on that specification existing.'
