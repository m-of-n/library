    testable: 'partial'
    testable_reason: 'adversarial and robustness tests can show an attack or input the system does not withstand; with no acceptance threshold, passing is never shown.'
  - id: 'etsi-en-304-223#5.1.2-3'
    designator: '5.1.2-3'
    locator: '§5.1.2'
    source_lines: '555-557'
    text: 'Provision 5.1.2-3 To support the process of preparing data, security auditing and incident response for an AI system, Developers shall document and create an audit trail in relation to the AI system. This shall include the operation, and lifecycle management of models, datasets and prompts incorporated into the system.'
