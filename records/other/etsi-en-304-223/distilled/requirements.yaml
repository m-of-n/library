    derived_from: 'R-0100 (§4); R-0043 (5.2.1-4.1); L668-669'
    reason: 'the EN signals a relaxation without stating one; the reading that nothing is relaxed is ours.'
  - id: 'etsi-en-304-223#5.1.1-1'
