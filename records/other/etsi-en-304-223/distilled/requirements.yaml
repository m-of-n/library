    designator: '5.1.2-4'
    locator: '§5.1.2'
    source_lines: '559-561'
    text: 'Provision 5.1.2-4 If a Developer or System Operator uses an external component, they shall conduct an AI security risk assessment and due diligence process in line with their existing software development processes, that assesses AI specific risks.'
