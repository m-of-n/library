    locator: '§5.1.2'
    source_lines: '570-571'
    text: 'Provision 5.1.2-5 Data Custodians shall ensure that the intended usage of the system is appropriate to the sensitivity of the data it was trained on as well as the controls intended to ensure the security of the data.'
