    reason: '5.1.4-4 refers to controls specified by the Data Custodian, while 5.1.2-5 has the Data Custodian match usage to controls, not specify them.'
  - id: 'etsi-en-304-223#R-0140'
    locator: '§4'
    text: 'No Developer provision is identified as relaxed for AI systems involving open-source models: L443-444 names none, and the pointer at L668-669 to clause 5.2.2 finds no open-source provision there, so every Developer provision is read as applying to them.'
    verb: 'none'
    kind: inferred
    actor: 'Developer'
    object: 'Developer provisions for open-source models'
    field: 'applicability to open-source models'
    testable: 'no'
