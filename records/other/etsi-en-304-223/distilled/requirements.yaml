  - id: 'etsi-en-304-223#5.1.2-1.1'
    designator: '5.1.2-1.1'
    locator: '§5.1.2'
    source_lines: '549-550'
    text: 'Provision 5.1.2-1.1 Where the Data Custodian is part of a Developer''s organization, they shall be included in internal discussions when determining the requirements and data needs of an AI system.'
    verb: 'shall'
    kind: stated
    split_into: 'etsi-en-304-223#R-0013'
    provision: '5.1.2-1.1'
    normativity: 'requirement'
    actor: 'Developer (implied)'
    object: 'internal discussions on the AI system''s requirements and data needs'
    field: 'participation of the in-house Data Custodian'
    testable: 'partial'
    testable_reason: 'participation is checkable in meeting records once it is established that the Data Custodian sits inside the Developer''s organization.'
  - id: 'etsi-en-304-223#5.1.2-2'
    designator: '5.1.2-2'
    locator: '§5.1.2'
    source_lines: '552-553'
    text: 'Provision 5.1.2-2 Developers and System Operators shall ensure that AI systems are designed and implemented to withstand adversarial AI attacks, unexpected inputs and AI system failure.'
    verb: 'shall'
    kind: stated
    split_into: 'etsi-en-304-223#R-0014'
    provision: '5.1.2-2'
    normativity: 'requirement'
    actor: 'Developer; System Operator'
    object: 'AI system design and implementation'
