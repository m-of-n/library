  - id: 'etsi-en-304-223#5.1.2-1'
    designator: '5.1.2-1'
    locator: '§5.1.2'
    source_lines: '545-547'
    text: 'Provision 5.1.2-1 As part of deciding whether to create an AI system, a System Operator and/or Developer shall conduct a thorough assessment that includes determining and documenting the business requirements and/or problem they are seeking to address, along with associated AI security risks and mitigation strategies.'
