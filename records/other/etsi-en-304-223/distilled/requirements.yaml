  - id: 'etsi-en-304-223#5.1.1-2.2'
    designator: '5.1.1-2.2'
    locator: '§5.1.1'
    source_lines: '534-536'
    text: 'Provision 5.1.1-2.2 Organizations shall provide developers with training in secure coding and system design techniques specific to AI development, with a focus on preventing and mitigating security vulnerabilities in AI algorithms, models, and associated software.'
