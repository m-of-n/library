  - id: "F11"
    name: "data-poisoning-report"
    title: "Training-data provenance and a reported poisoning attack"
    locator: "§5.2.4-2; §5.2.4-2.1"
    phase: "secure development; report at any later time"
    participants:
      - "developer"
      - "reporter"
      - "system_operator"
    trigger: >-
      Training data is sourced from publicly available sources; later, a data poisoning attack
      is reported.
    trigger_kind: "stated"
    summary: >-
      Because poisoning is likely discovered after training if at all, the Developer records how
      public training data was obtained, where from and when. That record lets the Developer
      identify whether a reported attack was in its data sets. Who reports, and what follows an
      affected finding, are not stated.
    order_note: >-
      Stated: step 1 before step 2 (discovery is expected after training); step 3 uses the
      record of step 1. Step 4 is inferred.
    steps:
      - n: "1"
        from:
          - "developer"
        to:
          - "developer"
        message: "TrainingDataProvenance"
        action: >-
          Where training data comes from public sources, document how it was obtained, where it
          came from and how it is used in the model; at minimum the source (such as the scraped
          page's URL) and the date and time it was obtained.
        provisions:
          - "5.2.4-2"
          - "5.2.4-2.1"
        kind: "stated"
        quotes:
          - source_lines: "748-749"
            quote: |-
              Where training data has been sourced from publicly available sources, there is a risk that this data might have been poisoned.
          - source_lines: "749-750"
            quote: |-
              As discovery of poisoned data is likely to occur after training (if at all), Developers shall document how they obtained the public training data, where it came from and how that data is used in the model.
          - source_lines: "752-753"
            quote: |-
              The documentation of training data should include at a minimum the source of the data, such as the URL of the scraped page, and the date/time the data was obtained.
        constrained_by:
          - "etsi-en-304-223#R-0063"
          - "etsi-en-304-223#R-0064"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "reporter"
        to:
          - "developer"
        message: "DataPoisoningReport"
        action: "Report a data poisoning attack to the Developer."
        provisions:
          - "5.2.4-2.1"
        kind: "stated"
        basis: "presupposed"
        actor_note: >-
          The reporter is not named. A System Operator's log analysis can also surface poisoning
          (5.4.2-2, flow F09); that link is inferred.
        quotes:
          - source_lines: "753-754"
            quote: |-
              a reported data poisoning attack
        order: "stated"
        order_reason: "Discovery is expected after training, so after step 1."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "developer"
        to:
          - "developer"
        message: "PoisoningAssessment"
        inputs:
          - "TrainingDataProvenance"
          - "DataPoisoningReport"
        action: >-
          Use the provenance record to identify whether the reported attack was in the
          Developer's data sets.
        provisions:
          - "5.2.4-2.1"
        kind: "stated"
        basis: "purpose"
        note: >-
          The sentence carries no verbal form of the drafting rules; it states what the record
          enables.
        quotes:
          - source_lines: "753-754"
            quote: |-
              This will allow Developers to identify whether a reported data poisoning attack was in their data sets.
        related:
          - "etsi-en-304-223#R-0064"
        order: "stated"
        order_reason: "It uses the record of step 1 on the report of step 2."
        on_error: "see F11-E1"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "developer"
        to:
          - "developer"
        message: "ModelRevision"
        condition: "The data sets are affected."
        action: >-
          Remove the poisoned data, revise or retrain the model, re-check the data, and ship the
          result as an update (flows F06, F08).
        kind: "inferred"
        inferred_reason: >-
          The EN states only that the record allows the identification. 5.2.1-4.1 re-checks only
          revisions driven by user feedback or continuous learning, and 5.4.1-2 re-tests only
          major updates (OI-16).
        order: "inferred"
        goto: "F08"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F11-E1"
        at: "3"
        condition: "The provenance record cannot settle whether the data sets are affected."
        outcome: "Unspecified by source."
        kind: "unspecified"
      - id: "F11-E2"
        at: "3"
        condition: "The data sets are not affected."
        outcome: "No further action (inferred)."
        kind: "inferred"
  - id: "F12"
    name: "vulnerability-and-risk-reporting"
