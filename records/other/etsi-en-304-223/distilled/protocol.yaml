  - id: "F16"
    name: "external-api"
    title: "Offering an API to external parties"
    locator: "§5.2.2-1; §5.2.2-2"
    phase: "secure development; enforced in operation"
    participants:
      - "developer"
      - "system_operator"
      - "api_consumer"
      - "attacker"
    trigger: "A Developer offers an API to external customers or collaborators."
    trigger_kind: "stated"
    summary: >-
      The only externally facing interaction the EN implies. Access-control frameworks are
      evaluated and API controls applied; the EN's example is a limit on model access rate
      against reverse engineering, overwhelming defences and rapid poisoning. No request,
      response or error is defined.
    order_note: "Step 1 is first (inferred); step 2 precedes the calls of step 3 (inferred)."
    steps:
      - n: "1"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "AccessControlEvaluation"
        action: >-
          Evaluate the organization's access control frameworks and pick measures that secure
          APIs, models, data and the training and processing pipelines.
        provisions:
          - "5.2.2-1"
        kind: "stated"
        quotes:
          - source_lines: "680-681"
            quote: |-
              Developers and System Operators shall evaluate their organization's access control frameworks and identify appropriate measures to secure APIs, models, data, and training and processing pipelines.
        constrained_by:
          - "etsi-en-304-223#R-0045"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "developer"
        to:
          - "developer"
        message: "ApiControls"
        condition: "The Developer exposes an API to outside customers or collaborators."
        action: >-
          Put controls on the API against attacks on the AI system through it; the EN's example
          is a limit on model access rate.
        provisions:
          - "5.2.2-2"
        kind: "stated"
        quotes:
          - source_lines: "683-684"
            quote: |-
              If a Developer offers an API to external customers or collaborators, they shall apply controls that mitigate attacks on the AI system via the API.
          - source_lines: "684-685"
            quote: |-
              For example, placing limits on model access rate to limit an attacker's ability to reverse engineer or overwhelm defences to rapidly poison a model.
        constrained_by:
          - "etsi-en-304-223#R-0046"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "api_consumer"
        to:
          - "developer"
        message: "ApiRequest"
        action: "Call the API."
        kind: "inferred"
        inferred_reason: "The EN defines no request, response or error for the API."
        order: "inferred"
        on_error: "see F16-E1"
        on_error_basis: "stated"
    error_paths:
      - id: "F16-E1"
        at: "3"
        condition: >-
          Calls exceed the access-rate limit, for example an attacker trying to reverse engineer
          the model, overwhelm defences or rapidly poison it.
        outcome: >-
          Access is limited, by the EN's example. The response to the caller is unspecified by
          source.
        kind: "stated"
        quotes:
          - source_lines: "684-685"
            quote: |-
              For example, placing limits on model access rate to limit an attacker's ability to reverse engineer or overwhelm defences to rapidly poison a model.
        related:
          - "etsi-en-304-223#R-0046"
provisions_not_in_flows:
