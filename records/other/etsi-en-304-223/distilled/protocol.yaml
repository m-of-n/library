extracted_by: >-
  FX-1 pass 1 (extract), protocol and state-machine lane, effort max, from the source only
  (blind: no summary, no other lane's prose; requirements.yaml read for ids and texts only, by
  script).
source:
  file: ".cache/etsi-en-304-223.txt"
  rendering: "pdftotext 26.11.0 -layout -enc UTF-8 of the verified PDF"
  text_sha256: "b1bdc6d293fcf5583d84a7251d9b73dd45cb2350642fae35a96060b930f480e3"
  lines: "891"
  version: "ETSI EN 304 223 V2.1.1 (2025-12)"
applicability: >-
  The EN defines no wire protocol: no transport, encoding or message syntax, and it sets no
  timer, deadline or retry anywhere (retention time and review frequency appear only as items a
  Developer documents, 5.2.4-1.1). It defines provisions for five lifecycle phases and assigns
  them to stakeholder roles (Table 4-1). What it implies between roles is a set of process flows
  whose messages are work products (documents, notices, plans, updates). Each is modelled here
  as a flow of steps; a step that is a role acting alone has from equal to to. Steps, orderings
  and error outcomes the source does not state are marked inferred or unspecified.
conventions:
  quoting: >-
    Every quotation is a quotes item of source_lines and quote. The words were cut by script
    from .cache/etsi-en-304-223.txt as bin/_source_text reads a PDF rendering (running headers
    and footers removed, whitespace collapsed), between two anchors, never typed, and the range
    is the tightest that holds them. bin/check-quotes verifies every one. Text in action,
    condition, note, summary, outcome and issue is this file's wording.
  step_kind: >-
    kind stated: the source names the act. kind inferred: this model's step, with
    inferred_reason. basis qualifies a stated step that no provision requires: purpose (the
    source names the act as what a provision enables), presupposed (the source assumes it has
    happened), permission (a can statement).
  order: >-
    order first, stated or inferred. stated: the source fixes the step's position by tense, an
    anaphora (this information, these updates), a purpose clause or a time word (prior to,
    during, following); order_reason says which. inferred: the source does not place it.
  on_error_basis: >-
    stated: the source says what follows a failure. unspecified: the source names the act and
    says nothing about its failure. inferred: this file's reading.
  constrained_by: >-
    Ids of requirements.yaml that bind the step: it performs them, or what it produces must
    satisfy them. A stated step only; an inferred step never carries constrained_by.
  related: >-
    Ids whose provision names the step without binding it: its condition, a purpose clause, a
    presupposition, or the basis this model's inferred step is built on.
  id_emission: >-
    Every id under constrained_by and related was emitted by script from a provision key
    (Provision 5.x.y-n) and, where the provision holds several sentences, a phrase of the
    requirement text; the selector refuses zero or several matches. Only skeleton ids R-0001 to
    R-0092 are cited: the selector skips split children and inferred entries, and entries the
    requirements lane added during pass 1 were not considered for citation. Every resolved pair
    was printed and read.
  messages: >-
    message is the work product a step outputs, or hands to its to roles; inputs names the work
    products it consumes. Both name entries of work_products, which is this file's vocabulary,
    each with the steps that use it. Pass 3 joined the vocabulary to messages.yaml: each work
    product carries structure (the messages.yaml names that hold it, 58 of 80; the same name
    in 5 cases) or structure none with structure_reason (22 of 80, each a role acting without
    a defined record, or a provision messages.yaml lists under considered_not_structures).
    Every messages.yaml structure is held by at least one work product.
  roles: >-
    from and to name roles of the roles list. Several roles in from means the provision binds
    each of them (and, and/or, or). Table 4-1 roles carry table_4_1 yes.
roles:
  - id: "developer"
    name: "Developers"
    table_4_1: "yes"
    locator: "§4 Table 4-1"
    definition: >-
      Any business, organization or individual that creates or adapts AI models or systems,
      proprietary or open-source. One that also embeds or deploys its own model holds both this
      role and System Operator.
    kind: "stated"
    quotes:
      - source_lines: "449-452"
        quote: |-
          This encompasses any type of business or organization across any sector as well as individuals that are responsible for creating or adapting an AI model and/or system.
      - source_lines: "453-458"
        quote: |-
          For context, a business or organization that creates an AI model and who is also responsible for embedding/deploying that model/system in their organization are defined in the present document to be both a Developer and a System Operator.
    related:
      - "etsi-en-304-223#R-0004"
  - id: "system_operator"
    name: "System Operators"
    table_4_1: "yes"
    locator: "§4 Table 4-1"
    definition: >-
      Any business or organization responsible for embedding or deploying an AI model and system
      in its infrastructure and/or for its ongoing maintenance, including contracted embedding
      or deployment services.
    kind: "stated"
    quotes:
      - source_lines: "462-465"
        quote: |-
          This includes any type of business or organization across any sector that has responsibility for embedding/deploying an AI model and system within their infrastructure and/or its ongoing maintenance.
      - source_lines: "467-470"
        quote: |-
          This term also includes those businesses that provide a contractual service to organizations to embed/deploy an AI model and system for business purposes.
    related:
      - "etsi-en-304-223#R-0101"
      - "etsi-en-304-223#R-0102"
  - id: "data_custodian"
    name: "Data Custodians"
    table_4_1: "yes"
    locator: "§4 Table 4-1"
    definition: >-
      Whoever governs permissions on, and integrity of, the data a model or system relies on,
      including whoever sets data-use policy. A system can have several.
    kind: "stated"
    quotes:
      - source_lines: "474-477"
        quote: |-
          This includes any type of business, organization or individual that controls data permissions and the integrity of data that is used for any AI model or system to function.
      - source_lines: "477-479"
        quote: |-
          This stakeholder group also includes those entities that set the policies for how data is used and managed for an AI model and/or system.
      - source_lines: "479-485"
        quote: |-
          In the context of an AI system, there could be multiple data custodians involved because some data used to create a model could come from the organization that is deploying/embedding the system in their infrastructure and other data could be from public databases and other sources.
  - id: "end_user"
    name: "End-users"
    table_4_1: "yes"
    locator: "§4 Table 4-1"
    definition: "People using an AI model or system: employees of an organization, and consumers."
    kind: "stated"
    quotes:
      - source_lines: "486-489"
        quote: |-
          This encompasses any employee within an organization or business and consumers who use an AI model and system for any purpose, including to support their work and day-to-day activities.
      - source_lines: "491-494"
        quote: |-
          This stakeholder group has been created because the voluntary Code has placed expectations on Developers, System Operators and Data custodians to help inform and protect end-users.
  - id: "affected_entity"
    name: "Affected entities"
    table_4_1: "yes"
    locator: "§4 Table 4-1"
    definition: >-
      Individuals and technologies (apps, autonomous systems) affected by AI systems or their
      outputs who need not interact with the system. The printed definition says not directly
      affected; see OI-01.
    kind: "stated"
    quotes:
      - source_lines: "504-507"
        quote: |-
          Encompasses all individuals and technologies, such as apps and autonomous systems, that are not directly affected by AI systems or decisions based on the output of AI systems.
      - source_lines: "507-508"
        quote: |-
          These individuals do not necessarily interact with the deployed system or application.
  - id: "organization"
    name: "Organizations"
    table_4_1: "no"
    locator: "§4; §5.1.1; §5.1.2-5.1"
    definition: >-
