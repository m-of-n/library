      - "etsi-en-304-223#R-0048"
      - "etsi-en-304-223#R-0049"
open_issues:
  - id: "OI-01"
    locator: "§4 Table 4-1"
    bears_on: "roles; F10 step 6"
    issue: >-
      The definition calls Affected entities those not directly affected by AI systems or their
      outputs, and adds that they need not interact with the system. Read literally it excludes
      the very parties 5.3.1-3 supports; indirectly affected appears to be meant.
    quotes:
      - source_lines: "504-507"
        quote: |-
          Encompasses all individuals and technologies, such as apps and autonomous systems, that are not directly affected by AI systems or decisions based on the output of AI systems.
  - id: "OI-02"
    locator: "§5.3.1-3"
    bears_on: "F10 steps 3 and 6"
    issue: >-
      Support is owed to End-users and Affected Entities, but the process is written down and
      contracted with End-users only. Affected Entities, who need not interact with the system,
      have no stated channel.
    quotes:
      - source_lines: "811-813"
        quote: |-
          Developers and System Operators should support End-users and Affected Entities during and following a cyber security incident to contain and mitigate the impacts of an incident. The process for undertaking this should be documented and agreed in contracts with End-users.
  - id: "OI-03"
    locator: "§5.5.1-1"
    bears_on: "F14; state-machine SM08"
    issue: >-
      On a decision to transfer or share ownership, Data Custodians are to be involved and these
      assets securely disposed of. Disposing of assets whose ownership is being shared
      contradicts sharing; for a transfer, which copies are disposed of, and whether before or
      after the handover, is not stated.
    quotes:
      - source_lines: "865-866"
        quote: |-
          If a Developer or System Operator decides to transfer or share ownership of training data and/or a model to another entity they shall involve Data Custodians and securely dispose of these assets.
  - id: "OI-04"
    locator: "§5.3.1"
    bears_on: "F07; F10"
    issue: >-
      Principle 10 is the only principle with no Primarily applies to line; its responsible
      stakeholders are known only from the provision texts. It also has no References line, as
      Principle 13 has none.
    quotes:
      - source_lines: "792-795"
        quote: |-
          5.3.1 Principle 10: Communication and processes associated with End-users and Affected Entities NOTE: As part of an organization's wider deployment practices, pre-deployment testing of AI systems is to be considered alongside the requirements below.
  - id: "OI-05"
    locator: "§5.1.1; §5.1.2-5.1"
    bears_on: "F12; F13; roles"
    issue: >-
      Organizations, staff, employees and developers in lower case carry obligations but are not
      Table 4-1 roles, while Principle 1's applicability line names System Operators, Developers
      and Data Custodians. Whether developers in 5.1.1-2.2 means staff or the Developer
      stakeholder is not stated.
    quotes:
      - source_lines: "517"
        quote: |-
          Primarily applies to: System Operators, Developers, and Data Custodians
      - source_lines: "534"
        quote: |-
          Organizations shall provide developers with training
  - id: "OI-06"
    locator: "§5.1.2-1"
    bears_on: "F01"
    issue: >-
      The creation assessment falls to a System Operator and/or Developer; when the two are
      different organizations, which conducts it, or whether both must, is not stated.
    quotes:
      - source_lines: "545-546"
        quote: |-
          a System Operator and/or Developer shall conduct a thorough assessment
  - id: "OI-07"
    locator: "§5.1.2-5"
    bears_on: "F01 step 3"
    issue: >-
      A secure-design provision asks Data Custodians to check intended usage against the data
      the system was trained on: a past tense that presumes training has already happened.
    quotes:
      - source_lines: "570-571"
        quote: |-
          Data Custodians shall ensure that the intended usage of the system is appropriate to the sensitivity of the data it was trained on as well as the controls intended to ensure the security of the data.
  - id: "OI-08"
    locator: "§5.1.3-2"
    bears_on: "F03 steps 1 and 2"
    issue: >-
      The first sentence is passive: the party that identifies the threat and the party that
      communicates it to System Operators are not named.
    quotes:
      - source_lines: "604-605"
        quote: |-
          Where AI security threats are identified that cannot be resolved by Developers, this shall be communicated to System Operators
  - id: "OI-09"
    locator: "§5.2.5-1; §5.2.5-2"
    bears_on: "F06; state-machine SM02"
    issue: >-
      Release and deployment are conditioned on testing having happened, not on a result: no
      pass criterion and no consequence of a failed test are stated.
    quotes:
      - source_lines: "766-767"
        quote: |-
          Developers shall ensure that all models, applications and systems that are released to System Operators and/or End-users have been tested as part of a security assessment process.
  - id: "OI-10"
    locator: "§5.1.1-2.1"
    bears_on: "F13 step 4"
    issue: >-
      These updates has no clear antecedent: 5.1.1-2 speaks of awareness, and the updates of the
      training content are in 5.1.1-1.
    quotes:
      - source_lines: "530"
        quote: |-
          These updates should be communicated
  - id: "OI-11"
    locator: "§5.1.3-1.1"
    bears_on: "F02 step 7; F08 step 4; state-machine SM04"
    issue: >-
      The risk process runs when a setting or configuration option is introduced or changed.
      Whether it gates the change (before) or reviews it (after) is not stated, and the sentence
      is passive.
    quotes:
      - source_lines: "594-595"
        quote: |-
          The threat modelling and risk management process shall be conducted to address any security risks that arise when a new setting or configuration option is implemented or updated at any stage of the AI lifecycle.
  - id: "OI-12"
    locator: "§5.2.2-6"
    bears_on: "F05 step 4"
    issue: >-
      Cloud contracts are to support compliance with the above requirements, which the provision
      does not delimit (Principle 6, clause 5 so far, or the whole EN).
    quotes:
      - source_lines: "699"
        quote: |-
          support compliance with the above requirements.
  - id: "OI-13"
    locator: "§5.2.3-3"
    bears_on: "F05 step 7; F08 step 7"
    issue: >-
      Re-run evaluations on released models does not say which evaluations (the Developer's, a
      benchmark, the party's own), nor whether an updated model counts as a released model.
    quotes:
      - source_lines: "725-726"
        quote: |-
          Developers and System Operators shall re-run evaluations on released models that they intend on using.
  - id: "OI-14"
    locator: "§5.2.3-2; §5.2.3-2.1"
    bears_on: "F05-E1"
    issue: >-
      The choice to use a not well-documented or secured component is a System Operator's
      (5.2.3-2), but In this case binds Developers and System Operators (5.2.3-2.1). Whether a
      Developer making the same choice must justify it is not stated.
    quotes:
      - source_lines: "716"
        quote: |-
          System Operators that choose to use or adapt any models, or components, which are not
      - source_lines: "720-721"
        quote: |-
          In this case, Developers and System Operators shall have mitigating controls and undertake a risk assessment linked to such models or components.
  - id: "OI-15"
    locator: "§5.4.1-2"
    bears_on: "F08 step 2; state-machine SM02, SM05"
    issue: >-
      Major AI system updates are retested as a new version, but major is undefined, so which
      updates re-enter security testing is not determinable from the EN.
    quotes:
      - source_lines: "829-830"
        quote: |-
          Developers should treat major AI system updates as though a new version of a model has been developed and therefore undertake a new security testing and evaluation process to help protect users.
  - id: "OI-16"
    locator: "§5.2.1-4.1"
    bears_on: "F08 step 3; F11 step 4; state-machine SM03"
    issue: >-
      Checks and sanitisation are repeated only for revisions driven by user feedback or
      continuous learning; a revision for a security fix, or after a poisoning report, is not
      named.
    quotes:
      - source_lines: "668"
        quote: |-
          This shall be repeated when model revisions are made in response to user feedback or continuous learning.
  - id: "OI-17"
    locator: "§5.4.1-1; §5.4.1-1.1"
    bears_on: "F08-E1; state-machine SM05"
    issue: >-
      Updates are provided where possible, with contingency plans where they cannot be; no
      criterion for impossibility and no notice to System Operators or End-users when no update
      comes are stated.
    quotes:
      - source_lines: "826-827"
        quote: |-
          Developers shall have mechanisms and contingency plans to mitigate security risks, particularly in instances where updates cannot be provided for AI systems.
  - id: "OI-18"
    locator: "§5.2.1-4; §5.2.1-4.1"
    bears_on: "state-machine SM03"
    issue: >-
      Two cross-references point at clauses without the content: 5.2.1-4 sends the reader to
      clause 5.2.3 for securing data, but 5.2.3 is the supply chain; 5.2.1-4.1 sends the reader
      to clause 5.2.2 for open source, which 5.2.2 never mentions.
    quotes:
      - source_lines: "664"
        quote: |-
          (see clause 5.2.3 for details on securing data).
      - source_lines: "668-669"
        quote: |-
          See clause 5.2.2 for relevant provisions for open source.
  - id: "OI-19"
    locator: "§4 Table 4-1"
    bears_on: "roles"
    issue: >-
      The End-users row justifies the group by the voluntary Code, which the EN never identifies
      or references.
    quotes:
      - source_lines: "491-494"
        quote: |-
          This stakeholder group has been created because the voluntary Code has placed expectations on Developers, System Operators and Data custodians to help inform and protect end-users.
