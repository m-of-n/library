      A design property (withstand adversarial attacks, unexpected inputs, failure); no exchange
      or trigger.
    requirements:
      - "etsi-en-304-223#R-0014"
  - provision: "5.1.4-2"
    reason: "A design property (outputs easy for humans to assess); no exchange or trigger."
    requirements:
      - "etsi-en-304-223#R-0033"
  - provision: "5.2.1-2"
    reason: >-
      A capability (processes and tools to track, authenticate, version and secure assets);
      invariants LC-INV3, MV-INV1 and TD-INV1 of state-machine.yaml.
    requirements:
      - "etsi-en-304-223#R-0038"
  - provision: "5.2.1-4"
    reason: "A standing protection duty on four roles; a guard of TD-T04 in state-machine.yaml."
    requirements:
