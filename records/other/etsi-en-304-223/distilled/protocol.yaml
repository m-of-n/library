role_rules:
  - id: "RR-1"
    rule: >-
      One entity can hold several stakeholder roles at once, alongside roles from other
      regulatory regimes. Every flow below is between roles, not organizations: a step from a
      role to itself may be internal to one organization.
    kind: "stated"
    quotes:
      - source_lines: "434-436"
        quote: |-
          A single entity can hold multiple stakeholder roles, as defined in the present document, in addition to any responsibilities arising from different regulatory regimes.
    related:
      - "etsi-en-304-223#R-0001"
  - id: "RR-2"
    rule: >-
      Each principle names the stakeholders it primarily applies to; 5.3.1 names none (OI-04),
      and several provisions bind a role its principle does not list (5.1.2-5 Data Custodians,
      5.2.1-4 End-users).
    kind: "stated"
    quotes:
      - source_lines: "433-434"
        quote: |-
          An indication is given for each principle on which stakeholders are primarily responsible for its implementation.
  - id: "RR-3"
    rule: >-
      Some Developer provisions are said to be less applicable to systems built on open-source
      models; the EN does not say which.
    kind: "stated"
    quotes:
      - source_lines: "443-444"
        quote: |-
          Some provisions for Developers in the present document are less applicable to AI systems involving open-source models.
