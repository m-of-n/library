      - "F08.8"
  - name: "SecurityUpdateExplanation"
    meaning: >-
      Proactive, clear, accessible information to End-users about security-relevant updates
      (5.3.1-2.2).
    structure:
      - "EndUserSecurityUpdateNotice"
    used_in:
      - "F08.10"
  - name: "ContingencyMitigation"
    meaning: "Mechanisms and contingency plans applied where an update cannot be provided (5.4.1-1.1)."
    structure:
      - "SecurityUpdateRecord"
    used_in:
      - "F08-E1"
  - name: "ActivityLog"
    meaning: "Logs of system and user actions (5.4.2-1)."
    structure:
      - "SystemAndUserActionLog"
    used_in:
      - "F09.1"
      - "F09.2"
      - "F10.7"
  - name: "DetectionFinding"
    meaning: >-
      An anomaly, breach, unexpected behaviour or behaviour change found by monitoring (5.4.2-2,
      5.4.2-4).
    structure:
      - "LogAnalysisRecord"
      - "ModelPerformanceMonitoringRecord"
    used_in:
      - "F09.2"
      - "F09.5"
  - name: "InternalStateTelemetry"
    meaning: "Monitoring of the AI system's internal states (5.4.2-3)."
    structure:
      - "ModelPerformanceMonitoringRecord"
    used_in:
      - "F09.3"
  - name: "PerformanceTrend"
    meaning: "Model and system performance monitored over time (5.4.2-4)."
    structure:
      - "ModelPerformanceMonitoringRecord"
    used_in:
      - "F09.4"
  - name: "InfrastructureReview"
    meaning: >-
      Continuous monitoring and review of system infrastructure against risk appetite (5.1.3-4).
    structure:
      - "ThreatModelAndRiskRegister"
    used_in:
      - "F02.7"
  - name: "IncidentManagementPlan"
    meaning: >-
      AI system incident management plan and AI system recovery plan, created, tested and
      maintained (5.2.2-5).
    structure:
      - "AISystemIncidentManagementPlan"
      - "AISystemRecoveryPlan"
    used_in:
      - "F10.1"
  - name: "DisasterRecoveryPlan"
    meaning: >-
      Disaster recovery plans tailored to AI-specific attacks, with a restorable known good
      state (5.2.1-3, 5.2.1-3.1).
    structure:
      - "DisasterRecoveryPlan"
    used_in:
      - "F10.2"
  - name: "IncidentSupportAgreement"
    meaning: "The documented incident-support process agreed in contracts with End-users (5.3.1-3)."
    structure:
      - "IncidentSupportProcess"
    used_in:
      - "F10.3"
  - name: "AuditTrail"
    meaning: >-
      The AI system's audit trail, including how its models, datasets and prompts are operated
      and managed over their lifecycle (5.1.2-3).
    structure:
      - "AuditTrail"
    used_in:
      - "F10.4"
  - name: "IncidentDeclaration"
    meaning: "Recognition that a cyber security incident is under way (not defined by the EN)."
    structure: "none"
    structure_reason: "an event the EN does not define; no record content"
    used_in:
      - "F10.5"
  - name: "IncidentSupport"
    meaning: >-
      Support to End-users and Affected Entities to contain and mitigate an incident's impacts
      (5.3.1-3).
    structure:
      - "IncidentSupportProcess"
    used_in:
      - "F10.6"
  - name: "IncidentInvestigation"
    meaning: "Investigation of an incident using the logs (purpose of 5.4.2-1)."
    structure: "none"
    structure_reason: "an activity that reads the logs (SystemAndUserActionLog); the EN defines no record of it"
    used_in:
      - "F10.7"
  - name: "RecoveryAction"
    meaning: "Restoration of a known good state under the recovery plans (not stated as an action)."
    structure: "none"
    structure_reason: "an action restoring a known good state; the EN requires the capability (DisasterRecoveryPlan.known_good_state_restoration), not a record of its use"
    used_in:
      - "F10.8"
  - name: "TrainingDataProvenance"
    meaning: >-
      How public training data was obtained, its source (e.g. URL) and date/time, and how it is
      used (5.2.4-2, 5.2.4-2.1).
    structure:
      - "PublicTrainingDataProvenance"
    used_in:
      - "F11.1"
      - "F11.3"
  - name: "DataPoisoningReport"
    meaning: "A report of a data poisoning attack (presupposed by 5.2.4-2.1)."
    structure: "none"
    structure_reason: "an event presupposed by 5.2.4-2.1; the EN defines no content"
    used_in:
      - "F11.2"
      - "F11.3"
  - name: "PoisoningAssessment"
    meaning: >-
      The Developer's determination whether a reported poisoning attack was in its data sets
      (purpose of 5.2.4-2.1).
    structure: "none"
    structure_reason: "a determination the provenance record enables (PublicTrainingDataProvenance); the EN defines no record of it"
    used_in:
      - "F11.3"
  - name: "ModelRevision"
    meaning: "A revised or retrained model after poisoned data is found (not stated)."
    structure: "none"
    structure_reason: "a revised or retrained model, an asset rather than a record; not stated by the EN"
    used_in:
      - "F11.4"
  - name: "VulnerabilityDisclosurePolicy"
    meaning: "A clear and accessible published vulnerability disclosure policy (5.2.2-4)."
    structure:
      - "VulnerabilityDisclosurePolicy"
    used_in:
      - "F12.1"
  - name: "VulnerabilityReport"
    meaning: "A vulnerability report under the policy (not named by the EN)."
    structure: "none"
    structure_reason: "a report the policy invites; the EN names it nowhere and defines no content"
    used_in:
      - "F12.2"
  - name: "ReportingEncouragement"
    meaning: >-
      Encouragement and safeguards for employees to report potential security risks (5.1.2-5.1).
    structure: "none"
    structure_reason: "organizational encouragement of reporting; no record content defined (messages.yaml considered_not_structures, provision 5.1.2-5.1)"
    used_in:
      - "F12.3"
  - name: "RiskReport"
    meaning: "An employee's report of a potential security risk (what 5.1.2-5.1 encourages)."
    structure: "none"
    structure_reason: "an employee's report; the EN defines no content"
    used_in:
      - "F12.4"
  - name: "RemediationPlan"
    meaning: "Triage and remediation of a reported vulnerability or risk (not stated)."
    structure: "none"
    structure_reason: "triage and remediation not stated by the EN; no record content"
    used_in:
      - "F12.5"
  - name: "TrainingProgramme"
    meaning: >-
      The cyber security training programme with AI security content, role-tailored and
      regularly reviewed (5.1.1-1, 5.1.1-1.1).
    structure:
      - "AISecurityTrainingProgramme"
    used_in:
      - "F13.1"
      - "F13.2"
  - name: "ThreatAwarenessUpdate"
    meaning: >-
      Information keeping staff aware of the latest AI-related threats, vulnerabilities and
      mitigations (5.1.1-2, 5.1.1-2.1).
    structure:
      - "AISecurityTrainingProgramme"
    used_in:
      - "F13.3"
      - "F13.4"
  - name: "SecureCodingTraining"
    meaning: "Training for developers in secure coding and system design for AI (5.1.1-2.2)."
    structure:
      - "AISecurityTrainingProgramme"
    used_in:
      - "F13.5"
  - name: "TransferDecision"
    meaning: >-
      A decision to hand over ownership of training data or a model, or both, or to share it
      (5.5.1-1).
    structure:
      - "AssetTransferDisposalRecord"
    used_in:
      - "F14.1"
  - name: "DataCustodianInvolvement"
    meaning: "Involvement of the Data Custodians in an end-of-life action (5.5.1-1, 5.5.1-2)."
    structure:
      - "AssetTransferDisposalRecord"
      - "DecommissioningRecord"
    used_in:
      - "F14.2"
      - "F15.2"
  - name: "DisposalRecord"
    meaning: "Secure disposal of the assets concerned in a transfer (5.5.1-1)."
    structure:
      - "AssetTransferDisposalRecord"
    used_in:
      - "F14.3"
  - name: "TransferredAssets"
    meaning: "Training data and/or a model handed to another entity (5.5.1-1)."
    structure:
      - "AssetTransferDisposalRecord"
    used_in:
      - "F14.4"
  - name: "DecommissionDecision"
    meaning: "A decision to decommission a model and/or system (5.5.1-2)."
    structure:
      - "DecommissioningRecord"
    used_in:
      - "F15.1"
  - name: "DeletionRecord"
    meaning: "Secure deletion of applicable data and configuration details (5.5.1-2)."
    structure:
      - "DecommissioningRecord"
    used_in:
      - "F15.3"
  - name: "AssetInventory"
    meaning: "The comprehensive inventory of assets and their interdependencies (5.2.1-1)."
    structure:
      - "AssetInventory"
    used_in:
      - "F15.4"
  - name: "AccessControlEvaluation"
    meaning: >-
      Evaluation of access control frameworks, and the measures chosen for APIs, models, data
      and pipelines (5.2.2-1).
    structure:
      - "AccessControlEvaluation"
    used_in:
      - "F16.1"
  - name: "ApiControls"
    meaning: >-
      Controls mitigating attacks via an externally offered API, e.g. access-rate limits
      (5.2.2-2).
    structure: "none"
    structure_reason: "API controls such as rate limiting; a control (messages.yaml considered_not_structures, provision 5.2.2-2)"
    used_in:
      - "F16.2"
  - name: "ApiRequest"
    meaning: "A call to the API (not defined by the EN)."
    structure: "none"
    structure_reason: "a call to the API; not defined by the EN"
    used_in:
      - "F16.3"
flows:
  - id: "F01"
    name: "creation-decision"
    title: "Deciding whether to create an AI system"
    locator: "§5.1.2"
    phase: "secure design"
    participants:
      - "system_operator"
      - "developer"
      - "data_custodian"
    trigger: "An organization considers creating an AI system."
    trigger_kind: "stated"
    summary: >-
      The assessment of 5.1.2-1 is part of the decision itself, so it precedes the outcome. The
      Data Custodian joins requirements work when it sits in the Developer's organization and
      checks intended usage against the data. Permissions on other systems are limited and
      risk-assessed. The EN gives no criterion for deciding not to create.
    order_note: >-
      Stated: step 1 before step 5 (the assessment is part of deciding); step 2 during step 1
      (when determining the requirements). Steps 3 and 4 are not placed.
    steps:
      - n: "1"
        from:
          - "system_operator"
          - "developer"
        to:
          - "system_operator"
          - "developer"
        message: "CreationAssessment"
        action: >-
          Assess thoroughly and document: the business requirements or problem the system is to
          address, its AI security risks, and how they will be mitigated.
        provisions:
          - "5.1.2-1"
        kind: "stated"
        actor_note: >-
          The provision says System Operator and/or Developer and does not say which conducts it
          when they are different organizations (OI-06).
        quotes:
          - source_lines: "545-547"
            quote: |-
              As part of deciding whether to create an AI system, a System Operator and/or Developer shall conduct a thorough assessment that includes determining and documenting the business requirements and/or problem they are seeking to address, along with associated AI security risks and mitigation strategies.
        constrained_by:
          - "etsi-en-304-223#R-0012"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "developer"
        to:
          - "data_custodian"
        message: "RequirementsAndDataNeeds"
        condition: "The Data Custodian is part of the Developer's organization."
        action: >-
          Include the Data Custodian in the internal discussions that determine the requirements
          and data needs of the AI system.
        provisions:
          - "5.1.2-1.1"
        kind: "stated"
        actor_note: >-
          Passive in the source: who includes the Data Custodian is not named; the Developer's
          organization is this model's reading.
        quotes:
          - source_lines: "549-550"
            quote: |-
              Where the Data Custodian is part of a Developer's organization, they shall be included in internal discussions when determining the requirements and data needs of an AI system.
        constrained_by:
          - "etsi-en-304-223#R-0013"
        order: "stated"
        order_reason: >-
          It happens when the requirements and data needs are determined, which is part of step
          1.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "data_custodian"
        to:
          - "data_custodian"
        message: "UsageAppropriatenessCheck"
        action: >-
          Check that what the system is meant to be used for suits how sensitive its training
          data is, and the controls protecting that data.
        provisions:
          - "5.1.2-5"
        kind: "stated"
        quotes:
          - source_lines: "570-571"
            quote: |-
              Data Custodians shall ensure that the intended usage of the system is appropriate to the sensitivity of the data it was trained on as well as the controls intended to ensure the security of the data.
        constrained_by:
          - "etsi-en-304-223#R-0018"
        order: "inferred"
        order_reason: >-
          Placed in the design principle but not ordered against the decision; its past tense
          presumes the system has already been trained (OI-07).
        on_error: "see F01-E1"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "PermissionGrant"
        action: >-
          Where the system will interact with other systems or data sources, internal or
          external, grant it permissions there only as its functionality requires, and
          risk-assess them.
        provisions:
          - "5.1.2-6"
        kind: "stated"
        quotes:
          - source_lines: "576-578"
            quote: |-
              Where the AI system will be interacting with other systems or data sources, (be they internal or external), Developers and System Operators shall ensure that the permissions granted to the AI system on other systems are only provided as required for functionality and are risk assessed.
        constrained_by:
          - "etsi-en-304-223#R-0020"
        order: "inferred"
        order_reason: >-
          Its future tense puts it before operation; its position relative to the decision is
          not stated.
        on_error: "see F01-E3"
        on_error_basis: "stated"
      - n: "5"
        from:
          - "system_operator"
          - "developer"
        to:
          - "system_operator"
          - "developer"
        message: "CreationDecision"
        action: >-
          Decide whether to create the AI system; the assessment of step 1 is part of this
          decision.
        provisions:
          - "5.1.2-1"
        kind: "stated"
        quotes:
          - source_lines: "545"
            quote: |-
              As part of deciding whether to create an AI system
        constrained_by:
          - "etsi-en-304-223#R-0012"
        order: "stated"
        order_reason: "The assessment is part of deciding, so the outcome follows it."
        on_error: "see F01-E2"
        on_error_basis: "inferred"
    error_paths:
      - id: "F01-E1"
        at: "3"
        condition: >-
          The Data Custodian finds the intended usage inappropriate to the data's sensitivity or
          to its controls.
        outcome: >-
          Unspecified by source: the EN does not say whether the usage, the data or the controls
          change, or whether creation stops.
        kind: "unspecified"
      - id: "F01-E2"
        at: "5"
        condition: "The assessment does not support creating the system."
        outcome: >-
          No AI system is created. The word whether admits a negative decision, but the EN gives
          no criterion for one.
        kind: "inferred"
      - id: "F01-E3"
        at: "4"
        condition: "A permission on another system is not required for the system's functionality."
        outcome: "It is not granted."
        kind: "stated"
        quotes:
          - source_lines: "577-578"
            quote: |-
              the permissions granted to the AI system on other systems are only provided as required for functionality
        constrained_by:
          - "etsi-en-304-223#R-0020"
  - id: "F02"
    name: "threat-modelling"
    title: "Threat modelling and risk treatment"
    locator: "§5.1.3; §5.1.4-1; §5.1.4-3"
    phase: "secure design, re-entered at any stage"
    participants:
      - "developer"
      - "system_operator"
      - "external_risk_owner"
    trigger: "Design of the AI system; then any re-entry event of step 7."
    trigger_kind: "stated"
    summary: >-
      Developers and System Operators analyse threats and manage risks; System Operators apply
      controls to what the analysis finds, against cost and risk tolerance. The process is
      re-run on regular review, on any new or updated setting or configuration option at any
      lifecycle stage, and as continuous monitoring finds change. Threats a Developer cannot
      resolve go to flow F03. Residual risk is expected.
    order_note: >-
      Stated: step 3 after step 1 (risks identified through the analysis); step 7 loops to step
      1. Steps 2, 4, 5 and 6 are not placed.
    steps:
      - n: "1"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "ThreatModel"
        action: >-
          Analyse threats and manage the system's security risks; the threat model covers
          AI-specific attacks, for example poisoning, inversion and membership inference.
        provisions:
          - "5.1.3-1"
        kind: "stated"
        quotes:
          - source_lines: "590"
            quote: |-
              Developers and System Operators shall analyse threats and manage security risks to their systems.
          - source_lines: "591-592"
            quote: |-
              Threat modelling should include regular reviews and updates and address AI-specific attacks, such as data poisoning, model inversion, and membership inference.
        constrained_by:
          - "etsi-en-304-223#R-0022"
          - "etsi-en-304-223#R-0023"
        order: "first"
        on_error: "see F02-E3"
        on_error_basis: "stated"
      - n: "2"
        from:
          - "developer"
        to:
          - "developer"
        message: "ThreatModel"
        action: >-
          Manage the security risks of model functionality the system does not need, where more
          functionality means more risk; the EN's example is a multi-modal model used for one
          modality.
        provisions:
          - "5.1.3-1.2"
        kind: "stated"
        quotes:
          - source_lines: "597-598"
            quote: |-
              Developers shall manage the security risks associated with AI models that provide superfluous functionalities, where increased functionality leads to increased risk.
          - source_lines: "598-599"
            quote: |-
              For example, where a multi-modal model is being used but only single modality is used for system function.
        constrained_by:
          - "etsi-en-304-223#R-0025"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "system_operator"
        to:
          - "system_operator"
        message: "RiskTreatment"
        inputs:
          - "ThreatModel"
        action: >-
          Apply controls to the risks the analysis identified, weighing considerations that
          include the cost of implementation against the corporate risk tolerance.
        provisions:
          - "5.1.3-1.3"
        kind: "stated"
        quotes:
          - source_lines: "601-602"
            quote: |-
              System Operators shall apply controls to risks identified through the analysis based on a range of considerations, including the cost of implementation in line with their corporate risk tolerance.
        constrained_by:
          - "etsi-en-304-223#R-0026"
        order: "stated"
        order_reason: "Its controls address the risks that step 1 found."
        on_error: "see F02-E1"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "OversightMeasures"
        action: >-
          Build in and keep human-oversight capabilities at design time; where oversight is
          itself a risk control, design, build, verify and keep the technical measures that make
          it reduce the risk.
        provisions:
          - "5.1.4-1"
          - "5.1.4-3"
        kind: "stated"
        quotes:
          - source_lines: "622-623"
            quote: |-
              When designing an AI system, Developers and/or System Operators should incorporate and maintain capabilities to enable human oversight.
          - source_lines: "628-629"
            quote: |-
              Where human oversight is a risk control, Developers and/or System Operators shall design, develop, verify and maintain technical measures to reduce the risk through such oversight.
        constrained_by:
          - "etsi-en-304-223#R-0032"
          - "etsi-en-304-223#R-0034"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "system_operator"
        to:
          - "external_risk_owner"
        message: "RiskAssurance"
        condition: >-
          An external entity is responsible for AI security risks identified within the
          organization's infrastructure.
        action: >-
          Attain assurance that the external party can address the AI security risks it is
          responsible for.
        provisions:
          - "5.1.3-3"
        kind: "stated"
        quotes:
          - source_lines: "609-610"
            quote: |-
              Where an external entity has responsibility for AI security risks identified within an organizations infrastructure, System Operators should attain assurance that these parties are able to address such risks.
        constrained_by:
          - "etsi-en-304-223#R-0030"
        order: "inferred"
        on_error: "see F02-E2"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "developer"
        to:
          - "system_operator"
        message: "UnresolvedThreatNotice"
        condition: "A threat is identified that Developers cannot resolve."
        action: "Hand a threat that Developers cannot resolve to System Operators: flow F03."
        provisions:
          - "5.1.3-2"
        kind: "stated"
        quotes:
          - source_lines: "604"
            quote: |-
              Where AI security threats are identified that cannot be resolved by Developers
          - source_lines: "604-605"
            quote: |-
              this shall be communicated to System Operators
        constrained_by:
          - "etsi-en-304-223#R-0111"
        related:
          - "etsi-en-304-223#R-0110"
        order: "inferred"
        goto: "F03"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "7"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "InfrastructureReview"
        action: >-
          Re-run steps 1 to 3: on regular review; whenever a setting or configuration option is
          added or changed, in any lifecycle phase; and when continuous review of the
          infrastructure against risk appetite shows change. Residual risk is expected to stay.
        provisions:
          - "5.1.3-1"
          - "5.1.3-1.1"
          - "5.1.3-4"
        kind: "stated"
        note: >-
          5.1.3-1.1 is passive and names no actor; it sits in a principle that applies to
          Developers and System Operators. Whether it runs before or after the change is not
          stated (OI-11).
        quotes:
          - source_lines: "591"
            quote: |-
              Threat modelling should include regular reviews and updates
          - source_lines: "594-595"
            quote: |-
              The threat modelling and risk management process shall be conducted to address any security risks that arise when a new setting or configuration option is implemented or updated at any stage of the AI lifecycle.
          - source_lines: "612-613"
            quote: |-
              Developers and System Operators should continuously monitor and review their system infrastructure according to risk appetite.
          - source_lines: "613-614"
            quote: |-
              It is important to recognize that a higher level of risk will remain in AI systems despite the application of controls to mitigate against them.
        constrained_by:
          - "etsi-en-304-223#R-0024"
          - "etsi-en-304-223#R-0023"
          - "etsi-en-304-223#R-0031"
        order: "stated"
        order_reason: >-
          Regular reviews and updates, and the rule for any stage of the lifecycle, make this a
          loop over steps 1 to 3.
        loop_to: "1"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F02-E1"
        at: "3"
        condition: "A risk stays above tolerance because no control is affordable or available."
        outcome: >-
          Unspecified by source. The EN only acknowledges that more risk remains in AI systems
          even after controls.
        kind: "unspecified"
        quotes:
          - source_lines: "613-614"
            quote: |-
              a higher level of risk will remain in AI systems despite the application of controls to mitigate against them.
      - id: "F02-E2"
        at: "5"
        condition: "The external party cannot give assurance."
        outcome: "Unspecified by source."
        kind: "unspecified"
      - id: "F02-E3"
        at: "1"
        condition: "The analysis finds a threat Developers cannot resolve."
        outcome: "Flow F03."
        kind: "stated"
        goto: "F03"
        constrained_by:
          - "etsi-en-304-223#R-0111"
  - id: "F03"
    name: "unresolved-threat-relay"
    title: "Communicating threats Developers cannot resolve"
    locator: "§5.1.3-2"
    phase: "secure design (no phase limit stated)"
    participants:
      - "developer"
      - "system_operator"
      - "end_user"
    trigger: "An AI security threat is identified that Developers cannot resolve."
    trigger_kind: "stated"
    summary: >-
      A two-hop relay. The threat goes to System Operators, so that they can threat-model their
      own systems, and they pass the same information on to End-users, ideally with risks,
      impacts and recommended actions.
    order_note: >-
      Stated: step 4 after step 2, because the System Operator passes on this information, which
      is what step 2 delivered. Steps 3 and 4 are not ordered against each other.
    steps:
      - n: "1"
        from:
          - "developer"
        to:
          - "developer"
        message: "ThreatModel"
        action: "Identify an AI security threat that Developers cannot resolve."
        provisions:
          - "5.1.3-2"
        kind: "stated"
        actor_note: "Passive in the source: who identifies the threat is not named."
        quotes:
          - source_lines: "604"
            quote: |-
              Where AI security threats are identified that cannot be resolved by Developers
        related:
          - "etsi-en-304-223#R-0110"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "developer"
        to:
          - "system_operator"
        message: "UnresolvedThreatNotice"
        action: "Communicate the threat to System Operators."
        provisions:
          - "5.1.3-2"
        kind: "stated"
        actor_note: >-
          Passive in the source: the sender is not named; Developers is this model's reading
          (OI-08).
        quotes:
          - source_lines: "604-605"
            quote: |-
              this shall be communicated to System Operators so they can threat model their systems.
        constrained_by:
          - "etsi-en-304-223#R-0111"
        order: "stated"
        order_reason: "It communicates the threat step 1 identified."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "system_operator"
        to:
          - "system_operator"
        message: "ThreatModel"
        action: "Threat model the System Operator's own systems with the notice (flow F02)."
        provisions:
          - "5.1.3-2"
          - "5.1.3-1"
        kind: "stated"
        basis: "purpose"
        note: >-
          5.1.3-2 names this act as its purpose; the duty itself is 5.1.3-1, which binds System
          Operators to analyse threats to their systems.
        quotes:
          - source_lines: "605"
            quote: |-
              so they can threat model their systems.
        constrained_by:
          - "etsi-en-304-223#R-0022"
        related:
          - "etsi-en-304-223#R-0112"
        order: "stated"
        order_reason: "The purpose clause of step 2."
        goto: "F02"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "system_operator"
        to:
          - "end_user"
        message: "ThreatAdvisory"
        action: >-
          Communicate the information to End-users so they are aware of the threats; the
          communication should describe the risks, the potential impacts and the recommended
          actions to address or monitor them.
        provisions:
          - "5.1.3-2"
        kind: "stated"
        quotes:
          - source_lines: "605-606"
            quote: |-
              System Operators shall communicate this information to End-users, so they are made aware of these threats.
          - source_lines: "606-607"
            quote: |-
              This communication should include detailed descriptions of the risks, potential impacts, and recommended actions to address or monitor these threats.
        constrained_by:
          - "etsi-en-304-223#R-0028"
          - "etsi-en-304-223#R-0029"
        order: "stated"
        order_reason: "This information is what step 2 delivered."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths_note: "The source states no failure path for this relay."
  - id: "F04"
    name: "data-custodian-controls"
    title: "Data Custodian controls: specified, built in, verified"
    locator: "§5.1.4-4"
    phase: "secure design"
    participants:
      - "data_custodian"
      - "developer"
    trigger: "The Data Custodian has specified security controls for the system."
    trigger_kind: "stated"
    summary: >-
      5.1.4-4 asks Developers to check that the Data Custodian's specified controls are present
      in the built system. Specifying and building are presupposed; no provision requires them.
    order_note: "Stated by the perfect tense of 5.1.4-4: steps 1 and 2 precede step 3."
    steps:
      - n: "1"
        from:
          - "data_custodian"
        to:
          - "developer"
        message: "DataSecurityControls"
        action: "Specify the security controls the system is to have."
        provisions:
          - "5.1.4-4"
        kind: "stated"
        basis: "presupposed"
        note: >-
          No provision requires the Data Custodian to specify controls; 5.1.2-5 refers to
          controls meant to keep the data secure.
        quotes:
          - source_lines: "631"
            quote: |-
              the security controls specified by the Data Custodian
        related:
          - "etsi-en-304-223#R-0035"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "developer"
        to:
          - "developer"
        message: "AISystem"
        action: "Build the specified controls into the system."
        provisions:
          - "5.1.4-4"
        kind: "stated"
        basis: "presupposed"
        quotes:
          - source_lines: "631-632"
            quote: |-
              have been built into the system.
        related:
          - "etsi-en-304-223#R-0035"
        order: "stated"
        order_reason: "The controls are built before they can be verified as built."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "developer"
        to:
          - "developer"
        message: "ControlVerification"
        action: "Verify that the Data Custodian's controls have been built into the system."
        provisions:
          - "5.1.4-4"
        kind: "stated"
        quotes:
          - source_lines: "631-632"
            quote: |-
              Developers should verify that the security controls specified by the Data Custodian have been built into the system.
        constrained_by:
          - "etsi-en-304-223#R-0035"
        order: "stated"
        order_reason: "Verification of something that has been built follows the building."
        on_error: "see F04-E1"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F04-E1"
        at: "3"
        condition: "A specified control has not been built in."
        outcome: "Unspecified by source."
        kind: "unspecified"
  - id: "F05"
    name: "external-component-due-diligence"
    title: "External components, models and providers"
    locator: "§5.1.2-4; §5.1.2-7; §5.2.2-6; §5.2.3; §5.2.4-1.2"
    phase: "secure design and secure development"
    participants:
      - "developer"
      - "system_operator"
      - "external_provider"
      - "cloud_service_operator"
      - "end_user"
    trigger: >-
      A Developer or System Operator uses an external component or model, or chooses to work
      with an external provider.
    trigger_kind: "stated"
    summary: >-
      Due diligence and an AI security risk assessment precede use, inside secure supply chain
      processes; provider adherence to the EN and cloud contracts are covered; hashes let
      recipients check component authenticity; released models are re-evaluated before use. The
      EN never states a rejection outcome: it allows a not well-documented or secured component
      to be used on three stated conditions (F05-E1).
    order_note: >-
      Stated: step 6 after step 5 (verification is the purpose of the released hashes).
      Everything else is unordered; step 7 precedes use (intend on using) but its place among
      steps 2 to 6 is not stated.
    steps:
      - n: "1"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "SupplyChainProcess"
        action: >-
          Run AI model and system development under secure software supply chain processes;
          every step below sits inside them.
        provisions:
          - "5.2.3-1"
        kind: "stated"
        quotes:
          - source_lines: "713-714"
            quote: |-
              Developers and System Operators shall follow secure software supply chain processes for their AI model and system development.
        constrained_by:
          - "etsi-en-304-223#R-0053"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "ComponentDueDiligence"
        condition: "An external component is used."
        action: >-
          Run due diligence and a risk assessment of the component, covering AI-specific risks,
          within the existing software development processes.
        provisions:
          - "5.1.2-4"
        kind: "stated"
        quotes:
          - source_lines: "559-561"
            quote: |-
              If a Developer or System Operator uses an external component, they shall conduct an AI security risk assessment and due diligence process in line with their existing software development processes, that assesses AI specific risks.
        constrained_by:
          - "etsi-en-304-223#R-0017"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "developer"
          - "system_operator"
        to:
          - "external_provider"
        message: "ProviderDueDiligence"
        condition: "An external provider is engaged."
        action: >-
          Undertake a due diligence assessment of the provider and seek to ensure it adheres to
          the EN.
        provisions:
          - "5.1.2-7"
        kind: "stated"
        quotes:
          - source_lines: "580-581"
            quote: |-
              If a Developer or System Operator chooses to work with an external provider, they shall undertake a due diligence assessment and should ensure that the provider is adhering to the present document.
        constrained_by:
          - "etsi-en-304-223#R-0107"
          - "etsi-en-304-223#R-0108"
        order: "inferred"
        on_error: "see F05-E4"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "developer"
          - "system_operator"
        to:
          - "cloud_service_operator"
        message: "ServiceContract"
        condition: "Cloud service operators help deliver the capability."
        action: >-
          Ensure the contractual agreements support compliance with the requirements before them
          in the EN; which requirements is not stated (OI-12).
        provisions:
          - "5.2.2-6"
        kind: "stated"
        quotes:
          - source_lines: "698-699"
            quote: |-
              Developers and System Operators should ensure that, where they are using cloud service operators to help to deliver the capability, their contractual agreements support compliance with the above requirements.
        constrained_by:
          - "etsi-en-304-223#R-0052"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "developer"
        to:
          - "system_operator"
          - "developer"
        message: "ComponentHashes"
        action: >-
          Release cryptographic hashes for the model components made available to other
          stakeholders.
        provisions:
          - "5.2.4-1.2"
        kind: "stated"
        actor_note: >-
          The releasing Developer is the upstream one; the recipients are the other stakeholders
          of the provision, here a System Operator or a downstream Developer.
        quotes:
          - source_lines: "745-746"
            quote: |-
              Developers shall release cryptographic hashes for model components that are made available to other stakeholders to allow them to verify the authenticity of the components.
        constrained_by:
          - "etsi-en-304-223#R-0062"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "system_operator"
          - "developer"
        to:
          - "system_operator"
          - "developer"
        message: "HashVerification"
        inputs:
          - "ComponentHashes"
        action: "Verify the authenticity of the received components against the released hashes."
        provisions:
          - "5.2.4-1.2"
        kind: "stated"
        basis: "purpose"
        note: "No provision requires the recipient to verify, and none names the hash algorithm."
        quotes:
          - source_lines: "746"
            quote: |-
              to allow them to verify the authenticity of the components.
        related:
          - "etsi-en-304-223#R-0062"
        order: "stated"
        order_reason: "Verification is the purpose of the hashes step 5 releases."
        on_error: "see F05-E3"
        on_error_basis: "unspecified"
      - n: "7"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "EvaluationResult"
        action: "Re-run evaluations on released models they intend to use."
        provisions:
          - "5.2.3-3"
        kind: "stated"
        note: "Which evaluations are re-run is not stated (OI-13)."
        quotes:
          - source_lines: "725-726"
            quote: |-
              Developers and System Operators shall re-run evaluations on released models that they intend on using.
        constrained_by:
          - "etsi-en-304-223#R-0057"
        order: "inferred"
        order_reason: >-
          The models are ones a party intends on using, so this precedes use; its place among
          steps 2 to 6 is not stated.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from:
          - "system_operator"
        to:
          - "system_operator"
        message: "UseDecision"
        action: "Choose whether to use or adapt the model or component."
        provisions:
          - "5.2.3-2"
        kind: "stated"
        actor_note: >-
          5.2.3-2 names System Operators only; 5.2.3-2.1 then binds Developers and System
          Operators in this case (OI-14).
        quotes:
          - source_lines: "716"
            quote: |-
              choose to use or adapt any models, or components,
        constrained_by:
          - "etsi-en-304-223#R-0054"
        order: "inferred"
        on_error: "see F05-E1, F05-E2"
        on_error_basis: "stated"
    error_paths:
      - id: "F05-E1"
        at: "8"
        condition: >-
          The model or component is not well-documented or secured and the System Operator still
          chooses to use or adapt it.
        outcome: >-
          Allowed on three conditions: documentation justifies the decision (for example, there
          was no other supplier); Developers and System Operators hold mitigating controls and a
          risk assessment tied to the component; the System Operator shares the documentation
          accessibly with End-users.
        kind: "stated"
        to:
          - "end_user"
        quotes:
          - source_lines: "716-718"
            quote: |-
              System Operators that choose to use or adapt any models, or components, which are not well-documented or secured shall be able to justify their decision to use such models or components through documentation (for example if there was no other supplier for said component).
          - source_lines: "720-721"
            quote: |-
              In this case, Developers and System Operators shall have mitigating controls and undertake a risk assessment linked to such models or components.
          - source_lines: "723"
            quote: |-
              System Operators shall share this documentation with End-users in an accessible way.
        constrained_by:
          - "etsi-en-304-223#R-0054"
          - "etsi-en-304-223#R-0055"
          - "etsi-en-304-223#R-0056"
      - id: "F05-E2"
        at: "8"
        condition: "Due diligence or evaluation finds the component unacceptable."
        outcome: >-
          Not used. Inferred: the EN states no rejection outcome anywhere, and 5.2.3-2
          contemplates use despite a deficiency.
        kind: "inferred"
      - id: "F05-E3"
        at: "6"
        condition: "A component does not match its released hash."
        outcome: "Unspecified by source."
        kind: "unspecified"
      - id: "F05-E4"
        at: "3"
        condition: "The provider does not adhere to the EN."
        outcome: "Unspecified by source."
        kind: "unspecified"
  - id: "F06"
    name: "security-testing-release"
    title: "Security testing, release and pre-deployment testing"
    locator: "§5.2.5; §5.3.1 NOTE"
    phase: "secure development to secure deployment"
    participants:
      - "developer"
      - "system_operator"
      - "independent_security_tester"
      - "end_user"
    trigger: "A model, application or system is to be released."
    trigger_kind: "stated"
    summary: >-
      Everything released to System Operators or End-users has gone through security testing
      within an assessment process; the Developer shares its findings; the System Operator tests
      again, with the Developer's support, before deploying. The EN requires that testing
      happen, not that it pass.
    order_note: >-
      Stated: step 1 before step 4 (released items have been tested); step 5 before step 6
      (findings inform the System Operator's testing); step 6 before step 7 (prior to
      deployment). Steps 2 and 3 are not placed. Where the release goes to End-users directly,
      steps 5 to 7 have no System Operator and no End-user-side testing is stated.
    steps:
      - n: "1"
        from:
          - "developer"
        to:
          - "developer"
        message: "SecurityAssessment"
        action: >-
          Security-test every model, application and system before release, within a security
          assessment process.
        provisions:
          - "5.2.5-1"
        kind: "stated"
        quotes:
          - source_lines: "766-767"
            quote: |-
              Developers shall ensure that all models, applications and systems that are released to System Operators and/or End-users have been tested as part of a security assessment process.
        constrained_by:
          - "etsi-en-304-223#R-0067"
        order: "first"
        on_error: "see F06-E1"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "developer"
          - "system_operator"
        to:
          - "independent_security_tester"
        message: "SecurityTestEngagement"
        action: "Have security testing done by independent testers whose skills fit the AI system."
        provisions:
          - "5.2.5-2.1"
        kind: "stated"
        quotes:
          - source_lines: "778-779"
            quote: |-
              For security testing, System Operators and Developers should use independent security testers with technical skills relevant to their AI systems.
        constrained_by:
          - "etsi-en-304-223#R-0069"
        order: "inferred"
        order_reason: "Applies to the security testing of steps 1 and 6; not placed."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "developer"
        to:
          - "developer"
        message: "OutputEvaluation"
        action: >-
          Evaluate model outputs (a should) to check that they do not let System Operators or
          End-users reconstruct non-public parts of the model or its training data, nor steer the
          system in unintended ways.
        provisions:
          - "5.2.5-4"
          - "5.2.5-4.1"
        kind: "stated"
        quotes:
          - source_lines: "784-785"
            quote: |-
              Developers should evaluate model outputs to ensure they do not allow System Operators or End-users to reverse engineer non-public aspects of the model or the training data.
          - source_lines: "787-788"
            quote: |-
              Additionally, Developers should evaluate model outputs to ensure they do not provide System Operators or End-users with unintended influence over the system.
        constrained_by:
          - "etsi-en-304-223#R-0071"
          - "etsi-en-304-223#R-0072"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "developer"
        to:
          - "system_operator"
          - "end_user"
        message: "Release"
        action: >-
          Release the tested models, applications and systems to System Operators and/or
          End-users.
        provisions:
          - "5.2.5-1"
        kind: "stated"
        quotes:
          - source_lines: "766-767"
            quote: |-
              released to System Operators and/or End-users have been tested
        constrained_by:
          - "etsi-en-304-223#R-0067"
        order: "stated"
        order_reason: "The perfect tense of 5.2.5-1 puts testing (step 1) before release."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "developer"
        to:
          - "system_operator"
        message: "TestFindings"
        action: >-
          Give System Operators the testing and evaluation findings, as input to their own
          testing.
        provisions:
          - "5.2.5-3"
        kind: "stated"
        quotes:
          - source_lines: "781-782"
            quote: |-
              Developers should ensure that the findings from the testing and evaluation are shared with System Operators, to inform their own testing and evaluation.
        constrained_by:
          - "etsi-en-304-223#R-0070"
        order: "stated"
        order_reason: "Its purpose clause places it before the System Operator's testing in step 6."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "system_operator"
          - "developer"
        to:
          - "system_operator"
        message: "PreDeploymentTest"
        action: "Conduct testing before the system is deployed, with support from Developers."
        provisions:
          - "5.2.5-2"
        kind: "stated"
        quotes:
          - source_lines: "769-770"
            quote: |-
              System Operators shall conduct testing prior to the system being deployed with support from Developers.
          - source_lines: "794-795"
            quote: |-
              As part of an organization's wider deployment practices, pre-deployment testing of AI systems is to be considered alongside the requirements below.
            informative: "yes"
        constrained_by:
          - "etsi-en-304-223#R-0068"
        order: "stated"
        order_reason: "Prior to deployment (step 7)."
        on_error: "see F06-E2"
        on_error_basis: "unspecified"
      - n: "7"
        from:
          - "system_operator"
        to:
          - "system_operator"
        message: "Deployment"
        action: "Deploy the system."
        provisions:
          - "5.2.5-2"
        kind: "stated"
        quotes:
          - source_lines: "769"
            quote: |-
              prior to the system being deployed
        constrained_by:
          - "etsi-en-304-223#R-0068"
        order: "stated"
        order_reason: "After the testing of step 6."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F06-E1"
        at: "1"
        condition: "Security testing finds a vulnerability or failure."
        outcome: >-
          Unspecified by source. The EN requires that released items have been tested, not that
          they passed; it states no pass criterion and does not withhold release (OI-09).
        kind: "unspecified"
      - id: "F06-E2"
        at: "6"
        condition: "The System Operator's pre-deployment testing finds a problem."
        outcome: "Unspecified by source."
        kind: "unspecified"
  - id: "F07"
    name: "deployment-information"
    title: "Information to System Operators and End-users"
    locator: "§5.2.4-1; §5.2.4-1.1; §5.2.4-3; §5.3.1-1; §5.3.1-2; §5.3.1-2.1; §5.1.4-5"
    phase: "secure development and secure deployment"
    participants:
      - "developer"
      - "system_operator"
      - "data_custodian"
      - "end_user"
    trigger: "A system is prepared for deployment and use."
    trigger_kind: "inferred"
    trigger_reason: >-
      5.3.1 sits under Secure Deployment and 5.2.4 under Secure Development, but neither times
      its communications.
    summary: >-
      The Developer documents the design and post-deployment maintenance plans and makes them
      available downstream. When the Developer is an external entity it gives System Operators
      the data-use information and everything else they need, and System Operators pass
      accessible notices and guidance to End-users. Prohibited uses are made known; prompt and
      configuration change logs may be shared.
    order_note: >-
      Stated: step 2 after step 1 (the documentation); step 3 before step 4 and step 5 before
      step 6 when the Developer is external (this information; to help System Operators).
      Nothing is timed against deployment.
    steps:
      - n: "1"
        from:
          - "developer"
        to:
          - "developer"
        message: "SystemDocumentation"
        action: >-
          Keep a clear, maintained audit trail of the system design and of the plans for
          maintenance after deployment, with security-relevant content: where training data came
          from, scope and limits, guardrails, retention time, how often to review, and failure
          modes.
        provisions:
          - "5.2.4-1"
          - "5.2.4-1.1"
        kind: "stated"
        quotes:
          - source_lines: "737-738"
            quote: |-
              Developers shall document and maintain a clear audit trail of their system design and post-deployment maintenance plans.
          - source_lines: "741-743"
            quote: |-
              Developers should ensure that the document includes security-relevant information, such as the sources of training data (including fine-tuning data and human or other operational feedback), intended scope and limitations, guardrails, retention time, suggested review frequency and potential failure modes.
        constrained_by:
          - "etsi-en-304-223#R-0059"
          - "etsi-en-304-223#R-0061"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "developer"
        to:
          - "system_operator"
          - "data_custodian"
        message: "SystemDocumentation"
        action: "Make the documentation available downstream, to System Operators and Data Custodians."
        provisions:
          - "5.2.4-1"
        kind: "stated"
        quotes:
          - source_lines: "738-739"
            quote: |-
              Developers should make the documentation available to the downstream System Operators and Data Custodians.
        constrained_by:
          - "etsi-en-304-223#R-0060"
        order: "stated"
        order_reason: "It is the documentation of step 1."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "developer"
        to:
          - "system_operator"
        message: "DataUseInformation"
        condition: "The Developer is an external entity."
        action: "Tell System Operators how and where End-users' data is used, accessed and stored."
        provisions:
          - "5.3.1-1"
        kind: "stated"
        quotes:
          - source_lines: "798-799"
            quote: |-
              If the Developer is an external entity, they shall provide this information to System Operators.
        constrained_by:
          - "etsi-en-304-223#R-0074"
        order: "stated"
        order_reason: >-
          Step 4 conveys the same information, so when the Developer is external its input comes
          first.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "system_operator"
        to:
          - "end_user"
        message: "DataUseNotice"
        action: >-
          Tell End-users accessibly how and where their data is used, accessed and stored, for
          example in retraining, or reviewed by employees or partners.
        provisions:
          - "5.3.1-1"
        kind: "stated"
        quotes:
          - source_lines: "797-798"
            quote: |-
              System Operators shall convey to End-users in an accessible way where and how their data will be used, accessed and stored (for example, if it is used for model retraining, or reviewed by employees or partners).
        constrained_by:
          - "etsi-en-304-223#R-0073"
        order: "stated"
        order_reason: "After step 3 where the Developer is external."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "developer"
        to:
          - "system_operator"
        message: "OperatorInformation"
        condition: "The Developer is an external entity."
        action: "Give System Operators all the information needed to help them guide End-users."
        provisions:
          - "5.3.1-2"
        kind: "stated"
        quotes:
          - source_lines: "802-803"
            quote: |-
              If the Developer is an external entity, they shall provide all necessary information to help System Operators.
        constrained_by:
          - "etsi-en-304-223#R-0076"
        order: "stated"
        order_reason: "Its purpose is to help System Operators with step 6."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "system_operator"
        to:
          - "end_user"
        message: "UserGuidance"
        action: >-
          Give End-users accessible guidance on use, management, integration and configuration
          of the system, including appropriate use, limitations and potential failure modes.
        provisions:
          - "5.3.1-2"
          - "5.3.1-2.1"
        kind: "stated"
        quotes:
          - source_lines: "801-802"
            quote: |-
              System Operators shall provide End-users with accessible guidance to support their use, management, integration, and configuration of AI systems.
          - source_lines: "805-806"
            quote: |-
              System Operators shall include guidance on the appropriate use of the model or system, which includes highlighting limitations and potential failure modes.
        constrained_by:
          - "etsi-en-304-223#R-0075"
          - "etsi-en-304-223#R-0077"
        order: "stated"
        order_reason: "After step 5 where the Developer is external."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "7"
        from:
          - "developer"
          - "system_operator"
        to:
          - "end_user"
        message: "ProhibitedUseNotice"
        action: "Tell End-users which uses of the system are prohibited."
        provisions:
          - "5.1.4-5"
        kind: "stated"
        quotes:
          - source_lines: "641-642"
            quote: |-
              Developers and System Operators should make End-users aware of prohibited use cases of the AI system.
        constrained_by:
          - "etsi-en-304-223#R-0036"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from:
          - "developer"
        to:
          - "system_operator"
          - "end_user"
        message: "PromptChangeAuditLog"
        action: >-
          Log changes to system prompts and other model configuration that affect how the system
          works; the log can be made available to System Operators and End-users who have model
          access (a can statement, possibility under ETSI DR 3.2; SD-12 of normative.md).
        provisions:
          - "5.2.4-3"
        kind: "stated"
        basis: "permission"
        quotes:
          - source_lines: "756-757"
            quote: |-
              Developers should ensure that they have an audit log of changes to system prompts or other model configuration (including prompts) that affect the underlying working of the systems.
          - source_lines: "757-758"
            quote: |-
              Developers can make this available to any System Operators and End-Users that have access to the model.
        constrained_by:
          - "etsi-en-304-223#R-0065"
        related:
          - "etsi-en-304-223#R-0066"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths_note: "The source states no failure path for these communications."
  - id: "F08"
    name: "security-update"
    title: "Security updates, patches and model changes"
    locator: "§5.4.1; §5.3.1-2.2; §5.2.3-3; §5.2.3-4; §5.2.1-4.1; §5.2.4-3; §5.1.3-1.1"
    phase: "secure maintenance"
    participants:
      - "developer"
      - "system_operator"
      - "data_custodian"
      - "end_user"
    trigger: "A security update or patch, or another model change, is needed."
    trigger_kind: "inferred"
    trigger_reason: "The EN does not say what makes an update necessary."
    summary: >-
      Developers provide updates where possible and notify System Operators, who deliver them to
      End-users. A major update is treated as a new model version and retested. Model updates
      are announced to End-users before they happen, and security-relevant updates are explained
      to them. Where no update can be provided, the Developer's contingency plans apply
      (F08-E1).
    order_note: >-
      Stated: step 5 concerns the updates of step 1; step 9 delivers the updates of step 5
      (these updates); step 8 precedes step 9 for a model update (prior to models being
      updated). Steps 2, 3, 4, 6, 7 and 10 are not placed.
    steps:
      - n: "1"
        from:
          - "developer"
        to:
          - "developer"
        message: "SecurityUpdate"
        action: "Produce security updates and patches, when that is possible."
        provisions:
          - "5.4.1-1"
        kind: "stated"
        quotes:
          - source_lines: "823"
            quote: |-
              Developers shall provide security updates and patches, where possible
        constrained_by:
          - "etsi-en-304-223#R-0081"
        order: "first"
        on_error: "see F08-E1"
        on_error_basis: "stated"
      - n: "2"
        from:
          - "developer"
        to:
          - "developer"
        message: "SecurityAssessment"
        condition: "The update is a major AI system update (major is undefined, OI-15)."
        action: >-
          Treat a major update as a new model version and run security testing and evaluation
          again (flow F06).
        provisions:
          - "5.4.1-2"
        kind: "stated"
        quotes:
          - source_lines: "829-830"
            quote: |-
              Developers should treat major AI system updates as though a new version of a model has been developed and therefore undertake a new security testing and evaluation process to help protect users.
        constrained_by:
          - "etsi-en-304-223#R-0084"
        order: "inferred"
        goto: "F06"
        on_error: "see F08-E2"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "developer"
          - "data_custodian"
          - "system_operator"
        to:
          - "developer"
          - "data_custodian"
          - "system_operator"
        message: "DataCheck"
        condition: "The model is revised because of user feedback or continuous learning."
        action: "Repeat the checks and sanitisation of data and inputs."
        provisions:
          - "5.2.1-4.1"
        kind: "stated"
        note: "The repeat covers only revisions driven by user feedback or continuous learning (OI-16)."
        quotes:
          - source_lines: "666-668"
            quote: |-
              Developers, Data Custodians and System Operators shall apply checks and sanitisation to data and inputs when designing the model based on their access to said data and inputs and where those data and inputs are stored.
          - source_lines: "668"
            quote: |-
              This shall be repeated when model revisions are made in response to user feedback or continuous learning.
        constrained_by:
          - "etsi-en-304-223#R-0042"
          - "etsi-en-304-223#R-0043"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "ConfigurationChangeRecord"
        condition: "The update changes a system prompt, a setting or a configuration option."
        action: >-
          Log a change to a system prompt or other model configuration, and run threat modelling
          and risk management for a new or changed setting (flow F02).
        provisions:
          - "5.2.4-3"
          - "5.1.3-1.1"
        kind: "stated"
        quotes:
          - source_lines: "756-757"
            quote: |-
              Developers should ensure that they have an audit log of changes to system prompts or other model configuration (including prompts) that affect the underlying working of the systems.
          - source_lines: "594-595"
            quote: |-
              The threat modelling and risk management process shall be conducted to address any security risks that arise when a new setting or configuration option is implemented or updated at any stage of the AI lifecycle.
        constrained_by:
          - "etsi-en-304-223#R-0065"
          - "etsi-en-304-223#R-0024"
        order: "inferred"
        goto: "F02"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "developer"
        to:
          - "system_operator"
        message: "SecurityUpdateNotice"
        action: "Tell System Operators about the security updates."
        provisions:
          - "5.4.1-1"
        kind: "stated"
        quotes:
          - source_lines: "823-824"
            quote: |-
              notify System Operators of the security updates.
        constrained_by:
          - "etsi-en-304-223#R-0081"
        order: "stated"
        order_reason: "The notice concerns the updates step 1 provides."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "developer"
        to:
          - "system_operator"
        message: "PreviewAccess"
        action: >-
          Help System Operators evaluate and react to model changes, e.g. with early access
          through beta-testing or versioned APIs.
        provisions:
          - "5.4.1-3"
        kind: "stated"
        quotes:
          - source_lines: "832-833"
            quote: |-
              Developers should support System Operators to evaluate and respond to model changes, (for example by providing preview access via beta-testing and versioned APIs).
        constrained_by:
          - "etsi-en-304-223#R-0085"
        order: "inferred"
        on_error: "see F08-E3"
        on_error_basis: "unspecified"
      - n: "7"
        from:
          - "system_operator"
        to:
          - "system_operator"
        message: "EvaluationResult"
        action: "Re-run evaluations on the updated model before using it."
        provisions:
          - "5.2.3-3"
        kind: "inferred"
        inferred_reason: >-
          5.2.3-3 requires re-running evaluations on released models a party intends to use;
          that an update is such a release is this model's reading.
        quotes:
          - source_lines: "725-726"
            quote: |-
              Developers and System Operators shall re-run evaluations on released models that they intend on using.
        related:
          - "etsi-en-304-223#R-0057"
        order: "inferred"
        on_error: "see F08-E3"
        on_error_basis: "unspecified"
      - n: "8"
        from:
          - "system_operator"
        to:
          - "end_user"
        message: "ModelUpdateNotice"
        condition: "The update changes a model."
        action: >-
          Tell End-users, in an accessible way, of the intention to update models before they
          are updated.
        provisions:
          - "5.2.3-4"
        kind: "stated"
        quotes:
          - source_lines: "728-729"
            quote: |-
              System Operators shall communicate their intention to update models to End-users in an accessible way prior to models being updated.
        constrained_by:
          - "etsi-en-304-223#R-0058"
        order: "stated"
        order_reason: "Prior to the model being updated, so before step 9."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "9"
        from:
          - "system_operator"
        to:
          - "end_user"
        message: "SecurityUpdate"
        action: "Deliver the updates and patches to End-users."
        provisions:
          - "5.4.1-1"
        kind: "stated"
        quotes:
          - source_lines: "824"
            quote: |-
              System Operators shall deliver these updates and patches to End-users.
        constrained_by:
          - "etsi-en-304-223#R-0082"
        order: "stated"
        order_reason: "These updates are the ones notified in step 5."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "10"
        from:
          - "system_operator"
        to:
          - "end_user"
        message: "SecurityUpdateExplanation"
        action: >-
          Proactively inform End-users of any security-relevant update, with clear explanations
          in an accessible way.
        provisions:
          - "5.3.1-2.2"
        kind: "stated"
        quotes:
          - source_lines: "808-809"
            quote: |-
              System Operators shall proactively inform End-users of any security relevant updates and provide clear explanations in an accessible way.
        constrained_by:
          - "etsi-en-304-223#R-0078"
        order: "inferred"
        order_reason: "Proactively does not place it before or after delivery in step 9."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F08-E1"
        at: "1"
        condition: "An update cannot be provided."
        outcome: >-
          The Developer's mechanisms and contingency plans mitigate the security risk. The EN
          requires them to exist; it names no notice to System Operators or End-users in this
          case (OI-17).
        kind: "stated"
        quotes:
          - source_lines: "826-827"
            quote: |-
              Developers shall have mechanisms and contingency plans to mitigate security risks, particularly in instances where updates cannot be provided for AI systems.
        constrained_by:
          - "etsi-en-304-223#R-0122"
        related:
          - "etsi-en-304-223#R-0123"
      - id: "F08-E2"
        at: "2"
        condition: "The new security testing finds a problem."
        outcome: "Unspecified by source, as F06-E1."
        kind: "unspecified"
      - id: "F08-E3"
        at: "6"
        condition: "The System Operator's evaluation of the change is unfavourable."
        outcome: "Unspecified by source: 5.4.1-3 says respond, not how."
        kind: "unspecified"
  - id: "F09"
    name: "monitoring"
    title: "Logging, monitoring and detection"
    locator: "§5.4.2"
    phase: "secure maintenance"
    participants:
      - "system_operator"
      - "developer"
    trigger: "The system is in operation."
    trigger_kind: "inferred"
    trigger_reason: "5.4.2 is under Secure Maintenance and starts no clock."
    summary: >-
      System Operators log system and user actions and analyse the logs for anomalies, breaches
      and unexpected behaviour; both roles monitor internal states and performance over time.
      The EN names what monitoring should detect but no response to a detection; steps that act
      on a finding are inferred.
    order_note: >-
      Stated: step 2 analyses the logs of step 1. Steps 3 and 4 run alongside; step 5 is
      inferred.
    steps:
      - n: "1"
        from:
          - "system_operator"
        to:
          - "system_operator"
        message: "ActivityLog"
        action: >-
          Log system and user actions, for security compliance, investigating incidents and
          remediating vulnerabilities.
        provisions:
          - "5.4.2-1"
        kind: "stated"
        quotes:
          - source_lines: "847-848"
            quote: |-
              System Operators shall log system and user actions to support security compliance, incident investigations, and vulnerability remediation.
        constrained_by:
          - "etsi-en-304-223#R-0086"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "system_operator"
        to:
          - "system_operator"
        message: "DetectionFinding"
        inputs:
          - "ActivityLog"
        action: >-
          Analyse the logs: are the models still giving the desired outputs, and are there
          anomalies, breaches or unexpected behaviour developing over time (data drift or
          poisoning, for example)?
        provisions:
          - "5.4.2-2"
        kind: "stated"
        quotes:
          - source_lines: "850-852"
            quote: |-
              System Operators should analyse their logs to ensure that AI models continue to produce desired outputs and to detect anomalies, security breaches, or unexpected behaviour over time (such as due to data drift or data poisoning).
        constrained_by:
          - "etsi-en-304-223#R-0087"
        order: "stated"
        order_reason: "It analyses the logs of step 1."
        on_error: "see F09-E1, F09-E2"
        on_error_basis: "inferred"
      - n: "3"
        from:
          - "system_operator"
          - "developer"
        to:
          - "system_operator"
          - "developer"
        message: "InternalStateTelemetry"
        action: >-
          Monitor the AI system's internal states where that helps counter threats or feeds
          later security analytics.
        provisions:
          - "5.4.2-3"
        kind: "stated"
        quotes:
          - source_lines: "854-855"
            quote: |-
              System Operators and Developers should monitor internal states of their AI systems where this could better enable them to address security threats, or to enable future security analytics.
        constrained_by:
          - "etsi-en-304-223#R-0088"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "system_operator"
          - "developer"
        to:
          - "system_operator"
          - "developer"
        message: "PerformanceTrend"
        action: >-
          Track model and system performance over time, to catch behaviour changes, sudden or
          gradual, with a security effect.
        provisions:
          - "5.4.2-4"
        kind: "stated"
        quotes:
          - source_lines: "857-858"
            quote: |-
              System Operators and Developers should monitor the performance of their models and system over time so that they can detect sudden or gradual changes in behaviour that could affect security.
        constrained_by:
          - "etsi-en-304-223#R-0125"
        related:
          - "etsi-en-304-223#R-0126"
        order: "inferred"
        on_error: "see F09-E3"
        on_error_basis: "inferred"
      - n: "5"
        from:
          - "system_operator"
          - "developer"
        to:
          - "system_operator"
          - "developer"
        message: "DetectionFinding"
        action: >-
          Act on a finding: incident response (F10), a training-data check (F11) or a
          threat-model revision (F02).
        kind: "inferred"
        inferred_reason: >-
          5.4.2 names what monitoring should detect but no response to a detection, and no
          provision links detection to the incident management plan of 5.2.2-5.
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F09-E1"
        at: "2"
        condition: "An anomaly, security breach or unexpected behaviour is detected."
        outcome: "Incident response, flow F10 (inferred link)."
        kind: "inferred"
        goto: "F10"
      - id: "F09-E2"
        at: "2"
        condition: "Data drift or data poisoning is suspected."
        outcome: "Training-data check, flow F11 (inferred link)."
        kind: "inferred"
        goto: "F11"
      - id: "F09-E3"
        at: "4"
        condition: "A behaviour change that could affect security is found."
        outcome: "Threat-model revision, flow F02 (inferred link)."
        kind: "inferred"
        goto: "F02"
  - id: "F10"
    name: "incident-response"
    title: "Incident preparation, support and recovery"
    locator: "§5.1.2-3; §5.2.1-3; §5.2.1-3.1; §5.2.2-5; §5.3.1-3; §5.4.2-1"
    phase: "preparation in secure design and development; response in operation"
    participants:
      - "developer"
      - "system_operator"
      - "end_user"
      - "affected_entity"
    trigger: "A cyber security incident affects the AI system."
    trigger_kind: "stated"
    summary: >-
      Preparation is stated: incident management and recovery plans created, tested and
      maintained; disaster recovery plans tailored to AI attacks; a known good state restorable;
      an audit trail; a support process agreed with End-users. The response is stated only as
      support to End-users and Affected Entities during and after the incident, and as the
      purposes the logs serve. Declaring an incident, executing the plans and recovering are
      inferred.
    order_note: >-
      Steps 1 to 4 are preparation and precede an incident (inferred, except that contracts and
      plans exist before use). Step 6 is stated to run during and after the incident. Steps 5, 8
      and 9 are inferred.
    steps:
      - n: "1"
        from:
          - "developer"
          - "system_operator"
        to:
          - "developer"
          - "system_operator"
        message: "IncidentManagementPlan"
        action: >-
          Create, test and keep current both an incident management plan and a recovery plan for
          the AI system.
        provisions:
          - "5.2.2-5"
        kind: "stated"
        quotes:
          - source_lines: "695-696"
            quote: |-
              Developers and System Operators shall create, test and maintain an AI system incident management plan and an AI system recovery plan.
        constrained_by:
          - "etsi-en-304-223#R-0051"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "system_operator"
        to:
          - "system_operator"
        message: "DisasterRecoveryPlan"
        action: >-
          Tailor disaster recovery plans to attacks on AI systems, and make sure a known good
          state is restorable.
        provisions:
          - "5.2.1-3"
          - "5.2.1-3.1"
        kind: "stated"
        quotes:
          - source_lines: "658-659"
            quote: |-
              System Operators shall develop and tailor their disaster recovery plans to account for specific attacks aimed at AI systems.
          - source_lines: "661"
            quote: |-
              System Operators should ensure that a known good state can be restored.
        constrained_by:
          - "etsi-en-304-223#R-0039"
          - "etsi-en-304-223#R-0115"
        related:
          - "etsi-en-304-223#R-0116"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
