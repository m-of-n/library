  - provision: "5.2.1-4.2"
    reason: "A standing protection duty; invariant MV-INV2 and a guard of TD-T04 in state-machine.yaml."
    requirements:
      - "etsi-en-304-223#R-0044"
  - provision: "5.2.2-3"
