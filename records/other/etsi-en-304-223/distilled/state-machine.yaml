  - id: "SM06"
    name: "cyber-security-incident"
    object: "A cyber security incident affecting the AI system"
    locator: "§5.1.2-3; §5.2.1-3; §5.2.1-3.1; §5.2.2-5; §5.3.1-3; §5.4.2-1; §5.4.2-2"
    summary: >-
      Preparation is stated as preconditions. Of the incident itself the EN states only that
      support runs during and following it, and the purposes logs serve; every transition is
      inferred.
    preconditions:
      - provision: "5.2.2-5"
        meaning: "Incident management and recovery plans created, tested and maintained."
        ids:
          - "etsi-en-304-223#R-0051"
        kind: "stated"
      - provision: "5.2.1-3"
        meaning: "Disaster recovery plans tailored to AI-specific attacks."
        ids:
          - "etsi-en-304-223#R-0039"
        kind: "stated"
      - provision: "5.2.1-3.1"
        meaning: "A known good state can be restored."
        ids:
          - "etsi-en-304-223#R-0115"
        kind: "stated"
      - provision: "5.3.1-3"
        meaning: "The support process documented and agreed in contracts with End-users."
        ids:
          - "etsi-en-304-223#R-0080"
        kind: "stated"
      - provision: "5.4.2-1"
        meaning: "System and user actions logged."
        ids:
          - "etsi-en-304-223#R-0086"
        kind: "stated"
      - provision: "5.1.2-3"
        meaning: "An audit trail kept, supporting incident response."
        ids:
          - "etsi-en-304-223#R-0015"
          - "etsi-en-304-223#R-0016"
        kind: "stated"
    states:
      - id: "detected"
        meaning: "An anomaly, breach or unexpected behaviour has been found."
        kind: "stated"
        initial: "yes"
        note: "The EN does not say that a detection opens an incident."
        quotes:
          - source_lines: "851"
            quote: |-
              to detect anomalies, security breaches, or unexpected behaviour
      - id: "active"
        meaning: "The incident is under way."
        kind: "stated"
        quotes:
          - source_lines: "811-812"
            quote: |-
              during and following a cyber security incident
        activities:
          - provision: "5.3.1-3"
            meaning: "Support End-users and Affected Entities to contain and mitigate impacts."
            ids:
              - "etsi-en-304-223#R-0079"
            kind: "stated"
          - provision: "5.4.2-1"
            meaning: "Investigate with the logs."
            ids:
              - "etsi-en-304-223#R-0086"
            kind: "stated"
            basis: "purpose"
          - provision: "5.2.2-5"
            meaning: "Execute the incident management plan."
            ids:
              - "etsi-en-304-223#R-0051"
            kind: "inferred"
          - provision: "5.2.1-3.1"
            meaning: "Restore a known good state."
            ids:
              - "etsi-en-304-223#R-0115"
            kind: "inferred"
      - id: "post_incident"
        meaning: "After the incident."
        kind: "stated"
        quotes:
          - source_lines: "811-812"
            quote: |-
              during and following a cyber security incident
        activities:
          - provision: "5.3.1-3"
            meaning: "Support continues after the incident."
            ids:
              - "etsi-en-304-223#R-0079"
            kind: "stated"
          - provision: "5.4.2-1"
            meaning: "Vulnerability remediation, supported by the logs (SM05)."
            ids:
              - "etsi-en-304-223#R-0086"
            kind: "stated"
            basis: "purpose"
      - id: "closed"
        meaning: "No further action."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: "The EN names no end to an incident."
    transitions:
      - id: "IN-T01"
        from: "detected"
        to: "active"
        trigger: "incident-declared"
        kind: "inferred"
        inferred_reason: "No detection, declaration or classification of an incident is defined."
        guards: "none stated"
      - id: "IN-T02"
        from: "active"
        to: "post_incident"
        trigger: "incident-contained"
        kind: "inferred"
        inferred_reason: "The EN distinguishes during from following but names no event between them."
        guards: "none stated"
      - id: "IN-T03"
        from: "post_incident"
        to: "closed"
        trigger: "support-ended"
        kind: "inferred"
        inferred_reason: "As closed."
        guards: "none stated"
    error_states: "none stated (no failed recovery or escalation state is named)"
  - id: "SM07"
    name: "external-component"
    object: "An external component, model or provider considered for use"
    locator: "§5.1.2-4; §5.1.2-7; §5.2.2-6; §5.2.3; §5.2.4-1.2"
    summary: >-
      Due diligence precedes use. A not well-documented or secured component may still be used
      on three stated conditions; rejection is never stated. Released models are re-evaluated
      before use. No re-assessment after adoption is stated.
    states:
      - id: "candidate"
        meaning: "Considered for use."
        kind: "inferred"
        initial: "yes"
        inferred_reason: "The EN starts from use, not consideration."
      - id: "under_due_diligence"
        meaning: "Risk assessment and due diligence under way."
        kind: "stated"
        quotes:
          - source_lines: "559-561"
            quote: |-
              they shall conduct an AI security risk assessment and due diligence process in line with their existing software development processes, that assesses AI specific risks.
          - source_lines: "580-581"
            quote: |-
              they shall undertake a due diligence assessment and should ensure that the provider is adhering to the present document.
      - id: "acceptable"
        meaning: "Due diligence found nothing against use."
        kind: "inferred"
        inferred_reason: "No positive outcome of due diligence is named."
      - id: "deficient"
        meaning: "Not well-documented or not secured."
        kind: "stated"
        error: "yes"
        quotes:
          - source_lines: "716-717"
            quote: |-
              which are not well-documented or secured
      - id: "justified_use"
        meaning: "Used despite the deficiency, with documented justification and mitigations."
        kind: "stated"
        quotes:
          - source_lines: "717-718"
            quote: |-
              shall be able to justify their decision to use such models or components through documentation (for example if there was no other supplier for said component).
      - id: "rejected"
        meaning: "Not used."
        kind: "inferred"
        terminal: "yes"
        error: "yes"
        inferred_reason: "No rejection is stated anywhere (F05-E2)."
      - id: "evaluated"
        meaning: "Evaluations re-run on the released model."
        kind: "stated"
        quotes:
          - source_lines: "725-726"
            quote: |-
              re-run evaluations on released models that they intend on using.
      - id: "in_use"
        meaning: "Adopted."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: "The EN names no adoption state."
    transitions:
      - id: "XC-T01"
        from: "candidate"
        to: "under_due_diligence"
        trigger: "external-component-used or provider-chosen"
        kind: "stated"
        quotes:
          - source_lines: "559-561"
            quote: |-
              If a Developer or System Operator uses an external component, they shall conduct an AI security risk assessment and due diligence process in line with their existing software development processes, that assesses AI specific risks.
        guards: "none stated"
        effects:
          - provision: "5.1.2-4"
            meaning: "AI security risk assessment and due diligence."
            ids:
              - "etsi-en-304-223#R-0017"
            kind: "stated"
          - provision: "5.1.2-7"
            meaning: "Provider due diligence; adherence to the EN sought."
            ids:
              - "etsi-en-304-223#R-0107"
              - "etsi-en-304-223#R-0108"
            kind: "stated"
          - provision: "5.2.3-1"
            meaning: "Inside secure software supply chain processes."
            ids:
              - "etsi-en-304-223#R-0053"
            kind: "stated"
          - provision: "5.2.2-6"
            meaning: "Cloud contracts support compliance."
            ids:
              - "etsi-en-304-223#R-0052"
            kind: "stated"
      - id: "XC-T02"
        from: "under_due_diligence"
        to: "acceptable"
        trigger: "due-diligence-satisfied"
        kind: "inferred"
        inferred_reason: "As acceptable."
        guards: "none stated"
      - id: "XC-T03"
        from: "under_due_diligence"
        to: "deficient"
        trigger: "found-deficient"
        kind: "inferred"
        inferred_reason: "The EN does not tie the condition of 5.2.3-2 to the due diligence of 5.1.2-4."
        guards: "none stated"
      - id: "XC-T04"
        from: "deficient"
        to: "justified_use"
        trigger: "chosen-despite-deficiency"
        kind: "stated"
        note: "5.2.3-2 binds System Operators; 5.2.3-2.1 binds Developers and System Operators (OI-14)."
        quotes:
          - source_lines: "716-718"
            quote: |-
              System Operators that choose to use or adapt any models, or components, which are not well-documented or secured shall be able to justify their decision to use such models or components through documentation (for example if there was no other supplier for said component).
        guards:
          - provision: "5.2.3-2"
            meaning: "The decision is justified through documentation."
            ids:
              - "etsi-en-304-223#R-0054"
            kind: "stated"
          - provision: "5.2.3-2.1"
            meaning: "Mitigating controls and a risk assessment tied to the component."
            ids:
              - "etsi-en-304-223#R-0055"
            kind: "stated"
        effects:
          - provision: "5.2.3-2.2"
            meaning: "The documentation is shared with End-users accessibly."
            ids:
              - "etsi-en-304-223#R-0056"
            kind: "stated"
      - id: "XC-T05"
        from: "deficient"
        to: "rejected"
        trigger: "not-chosen"
        kind: "inferred"
        inferred_reason: "As rejected."
        guards: "none stated"
      - id: "XC-T06"
        from: "acceptable"
        to: "evaluated"
        trigger: "evaluations-re-run"
        kind: "stated"
        condition: "The component is a released model."
        note: "The hash check is the purpose of 5.2.4-1.2, not a duty of the recipient."
        quotes:
          - source_lines: "725-726"
            quote: |-
              Developers and System Operators shall re-run evaluations on released models that they intend on using.
        guards:
          - provision: "5.2.4-1.2"
            meaning: "Component authenticity checked against the released hashes."
            ids:
              - "etsi-en-304-223#R-0062"
            kind: "inferred"
        effects:
          - provision: "5.2.3-3"
            meaning: "Evaluations re-run."
            ids:
              - "etsi-en-304-223#R-0057"
            kind: "stated"
      - id: "XC-T07"
        from: "justified_use"
        to: "evaluated"
        trigger: "evaluations-re-run"
        kind: "stated"
        condition: "The component is a released model."
        guards: "none stated"
        effects:
          - provision: "5.2.3-3"
            meaning: "Evaluations re-run."
            ids:
              - "etsi-en-304-223#R-0057"
            kind: "stated"
      - id: "XC-T08"
        from: "evaluated"
        to: "in_use"
        trigger: "adopted"
        kind: "inferred"
        inferred_reason: "As in_use."
        guards: "none stated"
    error_states:
      - "deficient"
      - "rejected"
  - id: "SM08"
    name: "end-of-life"
    object: >-
      Training data and/or a model whose ownership is transferred or shared; a model and/or
      system decommissioned
    locator: "§5.5.1"
    summary: >-
      Two decisions, each followed by obligations joined by and in one sentence: for a transfer
      or sharing, bring in the Data Custodians and dispose of these assets securely; for
      decommissioning, bring in the Data Custodians and securely erase the applicable data and
      configuration. The EN orders none of them and names no state after them.
    states:
      - id: "in_service"
        meaning: "Held and in use."
        kind: "inferred"
        initial: "yes"
        inferred_reason: "The EN starts from the decisions."
      - id: "transfer_decided"
        meaning: "Transfer or sharing of ownership decided."
        kind: "stated"
        quotes:
          - source_lines: "865"
            quote: |-
              decides to transfer or share ownership
      - id: "transfer_complete"
        meaning: "Handed over or shared; Data Custodians involved; these assets disposed of."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: "The EN names the obligations, not a state after them."
      - id: "decommission_decided"
        meaning: "Decommissioning decided."
        kind: "stated"
        quotes:
          - source_lines: "869"
            quote: |-
              decides to decommission a model and/or system
      - id: "decommissioned"
        meaning: "Data Custodians involved; applicable data and configuration details deleted."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: "As transfer_complete."
    transitions:
      - id: "EL-T01"
        from: "in_service"
        to: "transfer_decided"
        trigger: "transfer-decided"
        kind: "stated"
        quotes:
          - source_lines: "865-866"
            quote: |-
              If a Developer or System Operator decides to transfer or share ownership of training data and/or a model to another entity
        guards: "none stated"
        related:
          - "etsi-en-304-223#R-0090"
      - id: "EL-T02"
        from: "transfer_decided"
        to: "transfer_complete"
        trigger: "transfer-executed"
        kind: "stated"
        note: >-
          The three effects are unordered; disposal of assets whose ownership is shared
          contradicts the sharing (OI-03).
        quotes:
          - source_lines: "866"
            quote: |-
              they shall involve Data Custodians and securely dispose of these assets.
          - source_lines: "866-867"
            quote: |-
              This will protect AI against security issues that can transfer from one AI system instantiation to another.
        guards: "none stated"
        effects:
          - provision: "5.5.1-1"
            meaning: "Data Custodians involved."
            ids:
              - "etsi-en-304-223#R-0090"
            kind: "stated"
          - provision: "5.5.1-1"
            meaning: "These assets securely disposed of."
            ids:
              - "etsi-en-304-223#R-0090"
            kind: "stated"
          - provision: "5.5.1-1"
            meaning: "Ownership transferred to, or shared with, the other entity."
            ids:
              - "etsi-en-304-223#R-0090"
            kind: "stated"
        related:
          - "etsi-en-304-223#R-0091"
      - id: "EL-T03"
        from: "in_service"
        to: "decommission_decided"
        trigger: "decommission-decided"
        kind: "stated"
        quotes:
          - source_lines: "869"
            quote: |-
              If a Developer or System Operators decides to decommission a model and/or system
        guards: "none stated"
        related:
          - "etsi-en-304-223#R-0092"
      - id: "EL-T04"
        from: "decommission_decided"
        to: "decommissioned"
        trigger: "decommission-executed"
        kind: "stated"
        note: "Which data are applicable is not stated."
        quotes:
          - source_lines: "869-870"
            quote: |-
              they shall involve Data Custodians and securely delete applicable data and configuration details.
        guards: "none stated"
        effects:
          - provision: "5.5.1-2"
            meaning: "Data Custodians involved."
            ids:
              - "etsi-en-304-223#R-0092"
            kind: "stated"
          - provision: "5.5.1-2"
            meaning: "Applicable data and configuration details securely deleted."
            ids:
              - "etsi-en-304-223#R-0092"
            kind: "stated"
    error_states: "none stated (no failed or unverifiable disposal is named)"
  - id: "SM09"
    name: "threat-model"
    object: "The threat model and risk analysis of an AI system"
    locator: "§5.1.3; §5.4.2-4"
    summary: >-
      Established, treated with controls, then reviewed: regularly, on any new or changed
      setting, and, for a System Operator, on a Developer's notice of a threat it cannot
      resolve. Residual risk is expected.
    states:
      - id: "established"
        meaning: "Threats analysed and risks managed."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "590"
            quote: |-
              Developers and System Operators shall analyse threats and manage security risks to their systems.
      - id: "treated"
        meaning: "Controls applied to the identified risks."
        kind: "stated"
        quotes:
          - source_lines: "601-602"
            quote: |-
              System Operators shall apply controls to risks identified through the analysis based on a range of considerations, including the cost of implementation in line with their corporate risk tolerance.
      - id: "under_review"
        meaning: "Being reviewed and updated."
        kind: "stated"
        quotes:
          - source_lines: "591"
            quote: |-
              Threat modelling should include regular reviews and updates
    transitions:
      - id: "TM-T01"
        from: "established"
        to: "treated"
        trigger: "risks-identified"
        kind: "stated"
        quotes:
          - source_lines: "601"
            quote: |-
              risks identified through the analysis
        guards: "none stated"
        effects:
          - provision: "5.1.3-1.3"
            meaning: "Controls applied against cost and risk tolerance."
            ids:
              - "etsi-en-304-223#R-0026"
            kind: "stated"
      - id: "TM-T02"
        from: "treated"
        to: "under_review"
        trigger: "regular-review"
        kind: "stated"
        guards: "none stated"
        effects:
          - provision: "5.1.3-1"
            meaning: "Regular reviews and updates."
            ids:
              - "etsi-en-304-223#R-0023"
            kind: "stated"
      - id: "TM-T03"
        from: "treated"
        to: "under_review"
        trigger: "configuration-change"
        kind: "stated"
        quotes:
          - source_lines: "595"
            quote: |-
              when a new setting or configuration option is implemented or updated
        guards: "none stated"
        effects:
          - provision: "5.1.3-1.1"
            meaning: "The process addresses the risks the change raises."
            ids:
              - "etsi-en-304-223#R-0024"
            kind: "stated"
      - id: "TM-T04"
        from: "treated"
        to: "under_review"
        trigger: "unresolved-threat-notice"
        kind: "stated"
        condition: >-
          A System Operator receives a Developer's notice of a threat Developers cannot resolve
          (F03).
        quotes:
          - source_lines: "605"
            quote: |-
              so they can threat model their systems.
        guards: "none stated"
        effects:
          - provision: "5.1.3-1"
            meaning: "The System Operator analyses threats to its systems."
            ids:
              - "etsi-en-304-223#R-0022"
            kind: "stated"
        related:
          - "etsi-en-304-223#R-0112"
      - id: "TM-T05"
        from: "treated"
        to: "under_review"
        trigger: "monitoring-finding"
        kind: "inferred"
        inferred_reason: "Monitoring (5.1.3-4, 5.4.2-4) is not linked to the threat model by the EN."
        guards: "none stated"
        related:
          - "etsi-en-304-223#R-0031"
          - "etsi-en-304-223#R-0126"
      - id: "TM-T06"
        from: "under_review"
        to: "treated"
        trigger: "review-complete"
        kind: "inferred"
        inferred_reason: >-
          The source names reviews and updates, not their completion; applying controls again
          follows from 5.1.3-1.3.
        guards: "none stated"
        effects:
          - provision: "5.1.3-1.3"
            meaning: "Controls applied to the risks the updated analysis identifies."
            ids:
              - "etsi-en-304-223#R-0026"
            kind: "stated"
    invariants:
      - id: "TM-INV1"
        rule: "A higher level of risk is expected to remain despite controls."
        kind: "stated"
        quotes:
          - source_lines: "613-614"
            quote: |-
              It is important to recognize that a higher level of risk will remain in AI systems despite the application of controls to mitigate against them.
        related:
          - "etsi-en-304-223#R-0031"
        note: >-
          A keyword-less sentence of 5.1.3-4; the id is that provision's requirement, which it
          follows.
    error_states: "none stated"
  - id: "SM10"
    name: "training-content"
    object: "The AI security content of an organization's cyber security training programme"
    locator: "§5.1.1"
    summary: "Reviewed and updated regularly, and when substantial new AI-related threats emerge."
    states:
      - id: "current"
        meaning: "In use in the programme."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "521"
            quote: |-
              shall include AI security content
      - id: "under_review"
        meaning: "Being reviewed and updated."
        kind: "stated"
        quotes:
