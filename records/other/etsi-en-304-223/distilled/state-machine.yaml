  FX-1 pass 1 (extract), protocol and state-machine lane, effort max, from the source only
  (blind; requirements.yaml read for ids and texts only, by script).
source:
  file: ".cache/etsi-en-304-223.txt"
  rendering: "pdftotext 26.11.0 -layout -enc UTF-8 of the verified PDF"
  text_sha256: "b1bdc6d293fcf5583d84a7251d9b73dd45cb2350642fae35a96060b930f480e3"
note: >-
  Lifecycles the EN implies. A state or transition is stated when the source names it, or names
  the event and places it (prior to, post-, during, following, as part of, re-run, decides to);
  otherwise inferred, with inferred_reason. guards must hold before a transition; effects must
  be carried out as part of it; activities run while in a state; each lists provision keys and
  requirement ids with their own kind (stated where the source ties that provision to this
  transition) and, where no provision requires the act, basis purpose. related lists ids whose
  provision names a transition or rule without binding it. A trigger is an event of the events
  list; flow_step names the protocol.yaml step that produces it. Quotations are cut by script
  from .cache/etsi-en-304-223.txt and checked by bin/check-quotes. Every id was emitted by
  script from a provision key and, where needed, a phrase of the requirement text, refusing zero
  or several matches, and every resolved pair was read. Open issues OI-nn are in protocol.yaml.
  The EN sets no timer, deadline or duration value anywhere; retention time and suggested review
  frequency (5.2.4-1.1) are items the Developer documents.
