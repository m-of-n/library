machines:
  - id: "SM01"
    name: "ai-system-lifecycle"
    object: "An AI system, moving through the EN's five phases"
    locator: "Introduction; §5.1 to §5.5"
    summary: >-
      The five phases are stated, in order. The EN never says that a phase must finish before
      the next starts, and several 5.1 provisions are worded as continuous. Five events are tied
      to provisions: deciding to create (gated by 5.1.2-1), deploying (gated by 5.2.5-1 and
      5.2.5-2), a security update within maintenance (5.4.1-1), a major update (back to testing,
      5.4.1-2) and the end-of-life decisions (5.5.1). Entry into maintenance is not gated.
    applies_to:
      note: "Systems that are going to be deployed; research-only systems are out of scope."
      kind: "stated"
      quotes:
        - source_lines: "230-231"
          quote: |-
            The present document is not designed for academics who are creating and testing AI systems only for research purposes (AI systems which are not going to be deployed).
    quotes:
      - source_lines: "195-196"
        quote: |-
          The present document separates principles and requirements into five phases. These are secure design, secure development, secure deployment, secure maintenance and secure end of life.
      - source_lines: "191"
        quote: |-
          principles and provisions at each stage of the AI lifecycle.
    states:
      - id: "secure_design"
        meaning: "Clause 5.1: awareness, design for security, threat evaluation, human responsibility."
        kind: "stated"
        initial: "yes"
        iso_iec_22989_stage:
          stage: "Design and development"
          kind: "stated"
          informative: "yes"
          quotes:
            - source_lines: "203-204"
              quote: |-
                the secure design and development principles can be applied during the Design and development life cycle stage;
        quotes:
          - source_lines: "515"
            quote: |-
              5.1 Secure Design
      - id: "secure_development"
        meaning: "Clause 5.2: assets, infrastructure, supply chain, documentation, testing."
        kind: "stated"
        iso_iec_22989_stage:
          stage: "Design and development"
          kind: "stated"
          informative: "yes"
          quotes:
            - source_lines: "203-204"
              quote: |-
                the secure design and development principles can be applied during the Design and development life cycle stage;
        quotes:
          - source_lines: "645"
            quote: |-
              5.2 Secure Development
      - id: "secure_deployment"
        meaning: "Clause 5.3: communication with End-users and Affected Entities."
        kind: "stated"
        iso_iec_22989_stage:
          stage: "Deployment"
          kind: "stated"
          informative: "yes"
          quotes:
            - source_lines: "206"
              quote: |-
                the secure deployment principles can be applied during the Deployment stage;
        quotes:
          - source_lines: "791"
            quote: |-
              5.3 Secure Deployment
      - id: "secure_maintenance"
        meaning: "Clause 5.4: security updates, monitoring."
        kind: "stated"
        iso_iec_22989_stage:
          stage: "Operations and monitoring"
          kind: "stated"
          informative: "yes"
          quotes:
            - source_lines: "208"
              quote: |-
                secure maintenance to the Operations and monitoring stage;
        quotes:
          - source_lines: "816"
            quote: |-
              5.4 Secure Maintenance
      - id: "secure_end_of_life"
        meaning: "Clause 5.5: transfer of ownership, decommissioning."
        kind: "stated"
        iso_iec_22989_stage:
          stage: "Retirement"
          kind: "stated"
          informative: "yes"
          quotes:
            - source_lines: "210"
              quote: |-
                secure end of life during the Retirement stage.
        quotes:
          - source_lines: "861"
            quote: |-
              5.5 Secure End of Life
      - id: "not_created"
        meaning: "The decision of 5.1.2-1 went against creating the system."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: >-
          Deciding whether to create admits a negative outcome; the EN names no state for it.
      - id: "retired"
        meaning: "After disposal or deletion at end of life."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: >-
          The EN names decommissioning and transfer of ownership, never a state after them.
    transitions:
      - id: "LC-T01"
        from: "secure_design"
        to: "secure_development"
        trigger: "creation-decided"
        kind: "stated"
        note: >-
          The source orders deciding before creating; reading create as entry into secure
          development is this model's mapping.
        quotes:
          - source_lines: "545"
            quote: |-
              As part of deciding whether to create an AI system
        guards:
          - provision: "5.1.2-1"
            meaning: >-
              The creation assessment (requirements or problem, AI security risks, mitigations)
              is done and documented.
            ids:
              - "etsi-en-304-223#R-0012"
            kind: "stated"
      - id: "LC-T02"
        from: "secure_design"
        to: "not_created"
        trigger: "creation-declined"
        kind: "inferred"
        inferred_reason: "No outcome or criterion for a negative decision is stated."
        guards: "none stated"
      - id: "LC-T03"
        from: "secure_development"
        to: "secure_deployment"
        trigger: "system-deployed"
        kind: "stated"
        note: "Both guards require that testing happened, not that it passed (OI-09)."
        quotes:
          - source_lines: "769"
            quote: |-
              prior to the system being deployed
          - source_lines: "794-795"
            quote: |-
              As part of an organization's wider deployment practices, pre-deployment testing of AI systems is to be considered alongside the requirements below.
            informative: "yes"
        guards:
          - provision: "5.2.5-1"
            meaning: >-
              What is released to System Operators or End-users has been tested within a
              security assessment process.
            ids:
              - "etsi-en-304-223#R-0067"
            kind: "stated"
          - provision: "5.2.5-2"
            meaning: "The System Operator has tested the system, with Developer support."
            ids:
              - "etsi-en-304-223#R-0068"
            kind: "stated"
      - id: "LC-T04"
        from: "secure_deployment"
        to: "secure_maintenance"
        trigger: "system-in-operation"
        kind: "inferred"
        inferred_reason: >-
          The source orders maintenance after deployment only through this noun phrase of
          5.2.4-1; it names no event and no provision gates the entry.
        quotes:
          - source_lines: "738"
            quote: |-
              post-deployment maintenance plans
        guards: "none stated"
      - id: "LC-T05"
        from: "secure_maintenance"
        to: "secure_development"
        trigger: "major-update"
        kind: "stated"
        note: "Major is undefined (OI-15)."
        quotes:
          - source_lines: "829-830"
            quote: |-
              Developers should treat major AI system updates as though a new version of a model has been developed and therefore undertake a new security testing and evaluation process to help protect users.
        guards: "none stated"
        effects:
          - provision: "5.4.1-2"
            meaning: "New security testing and evaluation, as for a new model version."
            ids:
              - "etsi-en-304-223#R-0084"
            kind: "stated"
      - id: "LC-T06"
        from: "secure_maintenance"
        to: "secure_maintenance"
        trigger: "security-update"
        kind: "stated"
        note: "Detail in SM05."
        quotes:
          - source_lines: "823-824"
            quote: |-
              Developers shall provide security updates and patches, where possible, and notify System Operators of the security updates. System Operators shall deliver these updates and patches to End-users.
        guards: "none stated"
        effects:
          - provision: "5.4.1-1"
            meaning: "Developer provides and notifies; System Operator delivers to End-users."
            ids:
              - "etsi-en-304-223#R-0081"
              - "etsi-en-304-223#R-0082"
            kind: "stated"
          - provision: "5.2.3-4"
            meaning: "End-users told before a model is updated."
            ids:
              - "etsi-en-304-223#R-0058"
            kind: "stated"
          - provision: "5.3.1-2.2"
            meaning: "End-users proactively informed of security-relevant updates."
            ids:
              - "etsi-en-304-223#R-0078"
            kind: "stated"
      - id: "LC-T07"
        from: "secure_maintenance"
        to: "secure_end_of_life"
        trigger: "transfer-decided or decommission-decided"
        kind: "stated"
        note: "Detail in SM08."
        quotes:
          - source_lines: "865-866"
            quote: |-
              If a Developer or System Operator decides to transfer or share ownership of training data and/or a model to another entity
          - source_lines: "869"
            quote: |-
              If a Developer or System Operators decides to decommission a model and/or system
        guards: "none stated"
        effects:
          - provision: "5.5.1-1"
            meaning: "Data Custodians involved; these assets securely disposed of."
            ids:
              - "etsi-en-304-223#R-0090"
            kind: "stated"
          - provision: "5.5.1-2"
            meaning: >-
              Data Custodians involved; applicable data and configuration details securely
              deleted.
            ids:
              - "etsi-en-304-223#R-0092"
            kind: "stated"
      - id: "LC-T08"
        from: "secure_development"
        to: "secure_end_of_life"
        trigger: "transfer-decided or decommission-decided"
        kind: "inferred"
        inferred_reason: >-
          5.5.1 does not limit either decision to a system in maintenance; a model can be handed
          over or decommissioned before it is deployed.
        guards: "none stated"
        effects:
          - provision: "5.5.1-1"
            meaning: "As LC-T07."
            ids:
              - "etsi-en-304-223#R-0090"
            kind: "stated"
          - provision: "5.5.1-2"
            meaning: "As LC-T07."
            ids:
              - "etsi-en-304-223#R-0092"
            kind: "stated"
      - id: "LC-T09"
        from: "secure_deployment"
        to: "secure_end_of_life"
        trigger: "transfer-decided or decommission-decided"
        kind: "inferred"
        inferred_reason: "As LC-T08."
        guards: "none stated"
        effects:
          - provision: "5.5.1-1"
            meaning: "As LC-T07."
            ids:
              - "etsi-en-304-223#R-0090"
            kind: "stated"
          - provision: "5.5.1-2"
            meaning: "As LC-T07."
            ids:
              - "etsi-en-304-223#R-0092"
            kind: "stated"
      - id: "LC-T10"
        from: "secure_end_of_life"
        to: "retired"
        trigger: "assets-disposed"
        kind: "inferred"
        inferred_reason: "The EN names no state after disposal or deletion."
        guards: "none stated"
    invariants:
      - id: "LC-INV1"
        rule: >-
          Threat modelling and risk management run again for any new or changed setting or
          configuration option, in every phase.
        kind: "stated"
        quotes:
          - source_lines: "594-595"
            quote: |-
              The threat modelling and risk management process shall be conducted to address any security risks that arise when a new setting or configuration option is implemented or updated at any stage of the AI lifecycle.
        ids:
          - "etsi-en-304-223#R-0024"
      - id: "LC-INV2"
        rule: "System infrastructure is monitored and reviewed continuously against risk appetite."
        kind: "stated"
        quotes:
          - source_lines: "612-613"
            quote: |-
              Developers and System Operators should continuously monitor and review their system infrastructure according to risk appetite.
        ids:
          - "etsi-en-304-223#R-0031"
      - id: "LC-INV3"
        rule: "Assets are inventoried, tracked, authenticated, version-controlled and secured."
        kind: "inferred"
        inferred_reason: "Placed in 5.2 but worded with no phase limit."
        ids:
          - "etsi-en-304-223#R-0037"
          - "etsi-en-304-223#R-0038"
      - id: "LC-INV4"
        rule: "AI security training and staff awareness are kept up."
        kind: "inferred"
        inferred_reason: "Placed in 5.1 but worded as a standing organizational duty."
        ids:
          - "etsi-en-304-223#R-0104"
          - "etsi-en-304-223#R-0105"
          - "etsi-en-304-223#R-0008"
    gating: >-
      Gated by a stated provision: LC-T01 (5.1.2-1) and LC-T03 (5.2.5-1, 5.2.5-2). Effects
      stated on LC-T05, LC-T06 and LC-T07. Not gated, and inferred: LC-T04, whose order alone
      the source gives. The EN never states that the phases are exclusive or strictly
      sequential.
    error_states: "none stated"
  - id: "SM02"
    name: "model-version"
    object: >-
      One version of a model, with the applications and systems released with it; a major update
      starts a new version
    locator: "§5.2.2-3; §5.2.5; §5.2.3-3; §5.2.3-4; §5.2.1-4.1; §5.4.1-2; §5.5.1"
    summary: >-
      Development in dedicated environments, security testing, release with component hashes,
      System Operator testing, deployment; revisions re-check data; model updates are announced
      first; a major update re-enters testing as a new version. Test failure has no stated
      consequence.
    states:
      - id: "in_development"
        meaning: "Developed or tuned in dedicated environments with separation and least privilege."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "687"
            quote: |-
              Developers shall also create dedicated environments for development and model tuning activities.
          - source_lines: "688"
            quote: |-
              The dedicated environments shall be backed by technical controls to ensure separation and principle of least privilege.
        activities:
          - provision: "5.2.2-3"
            meaning: "Dedicated, separated, least-privilege development environments."
            ids:
              - "etsi-en-304-223#R-0047"
              - "etsi-en-304-223#R-0048"
            kind: "stated"
      - id: "security_tested"
        meaning: "Tested within a security assessment process."
        kind: "stated"
        quotes:
          - source_lines: "767"
            quote: |-
              have been tested as part of a security assessment process.
      - id: "released"
        meaning: "Released to System Operators and/or End-users."
        kind: "stated"
        quotes:
          - source_lines: "766-767"
            quote: |-
              released to System Operators and/or End-users
      - id: "operator_tested"
        meaning: "Tested again by the System Operator, with Developer support."
        kind: "stated"
        quotes:
          - source_lines: "769-770"
            quote: |-
              System Operators shall conduct testing prior to the system being deployed with support from Developers.
      - id: "deployed"
        meaning: "Deployed and in use."
        kind: "stated"
        quotes:
          - source_lines: "769"
            quote: |-
              prior to the system being deployed
      - id: "revised"
        meaning: "Revised because of user feedback or continuous learning."
        kind: "stated"
        quotes:
          - source_lines: "668"
            quote: |-
              model revisions are made in response to user feedback or continuous learning.
      - id: "update_announced"
        meaning: "End-users have been told the model will be updated."
        kind: "stated"
        quotes:
          - source_lines: "728-729"
            quote: |-
              communicate their intention to update models to End-users in an accessible way prior to models being updated.
      - id: "test_failed"
        meaning: "A security test found a problem."
        kind: "inferred"
        error: "yes"
        inferred_reason: >-
          The EN requires testing, not a pass, and states no consequence of a failed test
          (OI-09).
        exit: "unspecified by source"
      - id: "end_of_life"
        meaning: "Ownership transferred or shared, or decommissioned; detail in SM08."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "869"
            quote: |-
              decides to decommission a model
    transitions:
      - id: "MV-T01"
        from: "in_development"
        to: "security_tested"
        trigger: "security-assessment-run"
        kind: "stated"
        note: >-
          The output evaluation of 5.2.5-4 is not timed; placing it before release is this
          model's reading.
        quotes:
          - source_lines: "766-767"
            quote: |-
              Developers shall ensure that all models, applications and systems that are released to System Operators and/or End-users have been tested as part of a security assessment process.
        guards: "none stated"
        effects:
          - provision: "5.2.5-1"
            meaning: "Testing within a security assessment process."
            ids:
              - "etsi-en-304-223#R-0067"
            kind: "stated"
          - provision: "5.2.5-2.1"
            meaning: "Independent security testers."
            ids:
              - "etsi-en-304-223#R-0069"
            kind: "stated"
          - provision: "5.2.5-4, 5.2.5-4.1"
            meaning: "Outputs evaluated against reverse engineering and unintended influence."
            ids:
              - "etsi-en-304-223#R-0071"
              - "etsi-en-304-223#R-0072"
            kind: "inferred"
      - id: "MV-T02"
        from: "security_tested"
        to: "released"
        trigger: "release"
        kind: "stated"
        quotes:
          - source_lines: "766-767"
            quote: |-
              released to System Operators and/or End-users have been tested
        guards:
          - provision: "5.2.5-1"
            meaning: "Tested before release."
            ids:
              - "etsi-en-304-223#R-0067"
            kind: "stated"
        effects:
          - provision: "5.2.4-1.2"
            meaning: "Hashes released for the model components made available."
            ids:
              - "etsi-en-304-223#R-0062"
            kind: "stated"
          - provision: "5.2.5-3"
            meaning: "Test findings shared with System Operators."
            ids:
              - "etsi-en-304-223#R-0070"
            kind: "stated"
      - id: "MV-T03"
        from: "released"
        to: "operator_tested"
        trigger: "pre-deployment-test"
        kind: "stated"
        quotes:
          - source_lines: "769-770"
            quote: |-
              System Operators shall conduct testing prior to the system being deployed with support from Developers.
        guards: "none stated"
        effects:
          - provision: "5.2.5-2"
            meaning: "System Operator testing with Developer support."
            ids:
              - "etsi-en-304-223#R-0068"
            kind: "stated"
          - provision: "5.2.3-3"
            meaning: "Evaluations re-run on the released model before use."
            ids:
              - "etsi-en-304-223#R-0057"
            kind: "stated"
      - id: "MV-T04"
        from: "operator_tested"
        to: "deployed"
        trigger: "deploy"
        kind: "stated"
        quotes:
          - source_lines: "769"
            quote: |-
              prior to the system being deployed
        guards:
          - provision: "5.2.5-2"
            meaning: "System Operator testing done."
            ids:
              - "etsi-en-304-223#R-0068"
            kind: "stated"
      - id: "MV-T05"
        from: "released"
        to: "deployed"
        trigger: "release-to-end-users"
        kind: "inferred"
        inferred_reason: >-
          5.2.5-1 names release directly to End-users; on that path there is no System Operator
          to test.
        guards: "none stated"
      - id: "MV-T06"
        from: "in_development"
        to: "test_failed"
        trigger: "test-finding"
        kind: "inferred"
        inferred_reason: "No failure outcome is stated for the testing of 5.2.5-1."
        guards: "none stated"
      - id: "MV-T07"
        from: "released"
        to: "test_failed"
        trigger: "operator-test-finding"
        kind: "inferred"
        inferred_reason: "No failure outcome is stated for the testing of 5.2.5-2."
        guards: "none stated"
      - id: "MV-T08"
        from: "deployed"
        to: "revised"
        trigger: "model-revision"
        kind: "stated"
        condition: "The revision is driven by user feedback or continuous learning (OI-16)."
        quotes:
          - source_lines: "668"
            quote: |-
              This shall be repeated when model revisions are made in response to user feedback or continuous learning.
        guards: "none stated"
        effects:
          - provision: "5.2.1-4.1"
            meaning: "Checks and sanitisation of data and inputs repeated."
            ids:
              - "etsi-en-304-223#R-0042"
              - "etsi-en-304-223#R-0043"
            kind: "stated"
      - id: "MV-T09"
        from: "revised"
        to: "deployed"
        trigger: "revision-complete"
        kind: "inferred"
        inferred_reason: "The EN names the revision, not its completion."
        guards: "none stated"
      - id: "MV-T10"
        from: "deployed"
        to: "update_announced"
        trigger: "update-intended"
        kind: "stated"
        quotes:
          - source_lines: "728-729"
            quote: |-
              System Operators shall communicate their intention to update models to End-users in an accessible way prior to models being updated.
        guards: "none stated"
        effects:
          - provision: "5.2.3-4"
            meaning: "Accessible notice to End-users."
            ids:
              - "etsi-en-304-223#R-0058"
            kind: "stated"
      - id: "MV-T11"
        from: "update_announced"
        to: "deployed"
        trigger: "model-updated"
        kind: "stated"
        note: "A security update follows SM05 as well."
        quotes:
          - source_lines: "729"
            quote: |-
              prior to models being updated.
        guards:
          - provision: "5.2.3-4"
            meaning: "End-users told before the update."
            ids:
              - "etsi-en-304-223#R-0058"
            kind: "stated"
      - id: "MV-T12"
        from: "deployed"
        to: "in_development"
        trigger: "major-update"
        kind: "stated"
        note: "The new version is a new instance of this machine; major is undefined (OI-15)."
        quotes:
          - source_lines: "829-830"
            quote: |-
              Developers should treat major AI system updates as though a new version of a model has been developed and therefore undertake a new security testing and evaluation process to help protect users.
        guards: "none stated"
        effects:
          - provision: "5.4.1-2"
            meaning: "New security testing and evaluation, as for a new version."
            ids:
              - "etsi-en-304-223#R-0084"
            kind: "stated"
      - id: "MV-T13"
        from: "deployed"
        to: "end_of_life"
        trigger: "transfer-decided or decommission-decided"
        kind: "stated"
        quotes:
          - source_lines: "869"
            quote: |-
              decides to decommission a model
        guards: "none stated"
        effects:
          - provision: "5.5.1-1"
            meaning: "Data Custodians involved; these assets securely disposed of."
            ids:
              - "etsi-en-304-223#R-0090"
            kind: "stated"
          - provision: "5.5.1-2"
            meaning: >-
              Data Custodians involved; applicable data and configuration details securely
              deleted.
            ids:
              - "etsi-en-304-223#R-0092"
            kind: "stated"
    invariants:
      - id: "MV-INV1"
        rule: >-
          The model is in the asset inventory and tracked, authenticated, version-controlled and
          secured.
        kind: "inferred"
        inferred_reason: "Assets is undefined; a model is read as an AI-specific asset."
        ids:
          - "etsi-en-304-223#R-0037"
          - "etsi-en-304-223#R-0038"
      - id: "MV-INV2"
        rule: "Model weights that could be confidential carry proportionate protection."
        kind: "stated"
        quotes:
          - source_lines: "671-672"
            quote: |-
              Where training data or model weights could be confidential, Developers shall put proportionate protections in place.
        ids:
          - "etsi-en-304-223#R-0044"
      - id: "MV-INV3"
        rule: "The audit trail covers the model's operation and lifecycle management."
        kind: "stated"
        quotes:
          - source_lines: "556-557"
            quote: |-
              This shall include the operation, and lifecycle management of models, datasets and prompts incorporated into the system.
        ids:
          - "etsi-en-304-223#R-0016"
    error_states:
      - "test_failed"
  - id: "SM03"
    name: "training-data"
    object: >-
      Training data, including fine-tuning data, and the data and inputs used to design the
      model
    locator: "§5.2.1-4 to §5.2.1-4.2; §5.2.2-3; §5.2.4-2; §5.2.4-2.1; §5.5.1"
    summary: >-
      Public training data gets a provenance record because poisoning is likely found after
      training; data and inputs are checked and sanitised at design and again on revision;
      non-public training data stays in training and development environments. A reported
      poisoning attack is checked against the record; neither outcome is named.
    states:
      - id: "sourced"
        meaning: "Obtained, from public or other sources."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "748"
            quote: |-
              Where training data has been sourced from publicly available sources
      - id: "documented"
        meaning: "Provenance recorded: how obtained, source, date and time, use in the model."
        kind: "stated"
        quotes:
          - source_lines: "749-750"
            quote: |-
              Developers shall document how they obtained the public training data, where it came from and how that data is used in the model.
      - id: "checked"
        meaning: "Checked and sanitised."
        kind: "stated"
        quotes:
          - source_lines: "666-668"
            quote: |-
              Developers, Data Custodians and System Operators shall apply checks and sanitisation to data and inputs when designing the model based on their access to said data and inputs and where those data and inputs are stored.
      - id: "in_training"
        meaning: >-
          Used to train or tune; non-public data held only in training and development
          environments.
        kind: "stated"
        quotes:
          - source_lines: "689-690"
            quote: |-
              training data shall only be present in the training and development environments where this training data is not based on publicly available data.
      - id: "reported_poisoned"
        meaning: "A data poisoning attack has been reported."
        kind: "stated"
        error: "yes"
        quotes:
          - source_lines: "753-754"
            quote: |-
              a reported data poisoning attack
      - id: "affected"
        meaning: "The reported attack was in the Developer's data sets."
        kind: "inferred"
        error: "yes"
        inferred_reason: >-
          The EN names the check (5.2.4-2.1) but neither of its outcomes, and no remediation.
        exit: "unspecified by source (flow F11 step 4 is inferred)"
      - id: "cleared"
        meaning: "The reported attack was not in the Developer's data sets."
        kind: "inferred"
        inferred_reason: "As affected."
      - id: "end_of_life"
        meaning: "Ownership transferred or shared, or deleted at decommissioning; detail in SM08."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "865"
            quote: |-
              transfer or share ownership of training data
    transitions:
      - id: "TD-T01"
        from: "sourced"
        to: "documented"
        trigger: "public-data-obtained"
        kind: "stated"
        condition: "The data comes from publicly available sources."
        quotes:
          - source_lines: "749-750"
            quote: |-
              As discovery of poisoned data is likely to occur after training (if at all), Developers shall document how they obtained the public training data, where it came from and how that data is used in the model.
        guards: "none stated"
        effects:
          - provision: "5.2.4-2"
            meaning: "How obtained, where from and how used, documented."
            ids:
              - "etsi-en-304-223#R-0063"
            kind: "stated"
          - provision: "5.2.4-2.1"
            meaning: "At minimum the source (for example a URL) and the date and time obtained."
            ids:
              - "etsi-en-304-223#R-0064"
            kind: "stated"
      - id: "TD-T02"
        from: "sourced"
        to: "checked"
        trigger: "non-public-data-obtained"
        kind: "inferred"
        inferred_reason: >-
          For data not from public sources the EN asks for no provenance record of its own;
          5.2.4-1.1 lists training-data sources among documentation contents.
        guards: "none stated"
        related:
          - "etsi-en-304-223#R-0061"
      - id: "TD-T03"
        from: "documented"
        to: "checked"
        trigger: "model-design"
        kind: "inferred"
        inferred_reason: >-
          Checks happen when designing the model; their order against the provenance record is
          not stated.
        guards: "none stated"
        effects:
          - provision: "5.2.1-4.1"
            meaning: "Checks and sanitisation when designing the model."
            ids:
              - "etsi-en-304-223#R-0042"
            kind: "stated"
      - id: "TD-T04"
        from: "checked"
        to: "in_training"
        trigger: "training-run"
        kind: "inferred"
        inferred_reason: "Training after design checks is this model's order."
        guards:
          - provision: "5.2.2-3"
            meaning: "Non-public training data present only in training and development environments."
            ids:
              - "etsi-en-304-223#R-0049"
            kind: "stated"
          - provision: "5.2.1-4"
            meaning: "Sensitive data such as training data protected against unauthorized access."
            ids:
              - "etsi-en-304-223#R-0041"
            kind: "stated"
          - provision: "5.2.1-4.2"
            meaning: "Proportionate protection where training data could be confidential."
            ids:
              - "etsi-en-304-223#R-0044"
            kind: "stated"
      - id: "TD-T05"
        from: "in_training"
        to: "checked"
        trigger: "model-revision"
        kind: "stated"
        condition: "The revision is driven by user feedback or continuous learning (OI-16)."
        quotes:
          - source_lines: "668"
            quote: |-
              This shall be repeated when model revisions are made in response to user feedback or continuous learning.
        guards: "none stated"
        effects:
          - provision: "5.2.1-4.1"
            meaning: "Checks and sanitisation repeated."
            ids:
              - "etsi-en-304-223#R-0043"
            kind: "stated"
      - id: "TD-T06"
        from: "in_training"
        to: "reported_poisoned"
        trigger: "poisoning-reported"
        kind: "stated"
        note: >-
          The report is presupposed and its sender unnamed. A System Operator's log analysis can
          also surface poisoning (5.4.2-2); that link is inferred.
        quotes:
          - source_lines: "753-754"
            quote: |-
              a reported data poisoning attack
        guards: "none stated"
      - id: "TD-T07"
        from: "reported_poisoned"
        to: "affected"
        trigger: "provenance-check"
        kind: "inferred"
        inferred_reason: "The check is stated as what the record enables; the outcome is not named."
        quotes:
          - source_lines: "753-754"
            quote: |-
              This will allow Developers to identify whether a reported data poisoning attack was in their data sets.
        guards: "none stated"
        related:
          - "etsi-en-304-223#R-0064"
      - id: "TD-T08"
        from: "reported_poisoned"
        to: "cleared"
        trigger: "provenance-check"
        kind: "inferred"
        inferred_reason: "As TD-T07."
        guards: "none stated"
        related:
          - "etsi-en-304-223#R-0064"
      - id: "TD-T09"
        from: "cleared"
        to: "in_training"
        trigger: "check-closed"
        kind: "inferred"
        inferred_reason: "No action follows a clear result."
        guards: "none stated"
      - id: "TD-T10"
        from: "in_training"
        to: "end_of_life"
        trigger: "transfer-decided or decommission-decided"
        kind: "stated"
        quotes:
          - source_lines: "865"
            quote: |-
              transfer or share ownership of training data
        guards: "none stated"
        effects:
          - provision: "5.5.1-1"
            meaning: "Data Custodians involved; these assets securely disposed of."
            ids:
              - "etsi-en-304-223#R-0090"
            kind: "stated"
          - provision: "5.5.1-2"
            meaning: "Data Custodians involved; applicable data securely deleted."
            ids:
              - "etsi-en-304-223#R-0092"
            kind: "stated"
    invariants:
      - id: "TD-INV1"
        rule: >-
          Data assets are in the inventory and tracked, authenticated, version-controlled and
          secured.
        kind: "inferred"
        inferred_reason: "Assets is undefined; training data is read as an AI-specific asset."
        ids:
          - "etsi-en-304-223#R-0037"
          - "etsi-en-304-223#R-0038"
    error_states:
      - "reported_poisoned"
      - "affected"
  - id: "SM04"
    name: "prompt-and-configuration"
    object: "System prompts and other model configuration, including settings and configuration options"
    locator: "§5.1.2-3; §5.1.3-1.1; §5.2.4-3"
    summary: >-
      A small change-control loop. A change is logged and the risk process is run for it; the EN
      does not say whether that process gates the change or reviews it afterwards (OI-11).
    states:
      - id: "current"
        meaning: "The configuration in force."
        kind: "inferred"
        initial: "yes"
        inferred_reason: "The EN names only changes."
      - id: "changed"
        meaning: >-
          A system prompt, model configuration, setting or configuration option has been
          introduced or changed.
        kind: "stated"
        quotes:
          - source_lines: "756-757"
            quote: |-
              changes to system prompts or other model configuration (including prompts) that affect the underlying working of the systems.
    transitions:
      - id: "PC-T01"
        from: "current"
        to: "changed"
        trigger: "configuration-change"
        kind: "stated"
        note: >-
          The change log may be shared with System Operators and End-users who have model access
          (5.2.4-3, a can statement).
        quotes:
          - source_lines: "595"
            quote: |-
              when a new setting or configuration option is implemented or updated
        guards: "none stated"
        effects:
          - provision: "5.2.4-3"
            meaning: "The change is recorded in the audit log."
            ids:
              - "etsi-en-304-223#R-0065"
            kind: "stated"
          - provision: "5.1.3-1.1"
            meaning: "Threat modelling and risk management address the risks the change raises."
            ids:
              - "etsi-en-304-223#R-0024"
            kind: "stated"
          - provision: "5.1.2-3"
            meaning: "The audit trail covers lifecycle management of prompts."
            ids:
              - "etsi-en-304-223#R-0016"
            kind: "stated"
      - id: "PC-T02"
        from: "changed"
        to: "current"
        trigger: "change-settled"
        kind: "inferred"
        inferred_reason: "The EN names no completion of a change."
        guards: "none stated"
    error_states: "none stated"
  - id: "SM05"
    name: "security-update"
    object: "A security update or patch"
    locator: "§5.4.1; §5.3.1-2.2; §5.2.3-3; §5.2.3-4"
    summary: >-
      Provided where possible, notified to System Operators, delivered by them to End-users and
      explained to End-users. Model updates are announced first and can be evaluated through
      preview access; a major update is retested. Where no update can be provided, contingency
      mitigation applies.
    states:
      - id: "required"
        meaning: "A security risk needs an update."
        kind: "inferred"
        initial: "yes"
        inferred_reason: "The EN does not say what makes an update necessary."
      - id: "provided"
        meaning: "The Developer has produced the update or patch."
        kind: "stated"
        quotes:
          - source_lines: "823"
            quote: |-
              Developers shall provide security updates and patches, where possible
      - id: "not_providable"
        meaning: "No update can be provided."
        kind: "stated"
        error: "yes"
        quotes:
          - source_lines: "827"
            quote: |-
              instances where updates cannot be provided for AI systems.
      - id: "contingency_applied"
        meaning: "The risk is mitigated by the Developer's mechanisms and contingency plans."
        kind: "stated"
        quotes:
          - source_lines: "826"
            quote: |-
              Developers shall have mechanisms and contingency plans to mitigate security risks
      - id: "retested"
        meaning: "A major update has been through new security testing and evaluation."
        kind: "stated"
        quotes:
          - source_lines: "830"
            quote: |-
              undertake a new security testing and evaluation process
      - id: "operator_notified"
        meaning: "System Operators have been told of the update."
        kind: "stated"
        quotes:
          - source_lines: "823-824"
            quote: |-
              notify System Operators of the security updates.
      - id: "operator_evaluating"
        meaning: "The System Operator evaluates the model change, with Developer support."
        kind: "stated"
        quotes:
          - source_lines: "832"
            quote: |-
              support System Operators to evaluate and respond to model changes
      - id: "end_users_notified"
        meaning: "End-users have been told the model will be updated."
        kind: "stated"
        quotes:
          - source_lines: "728-729"
            quote: |-
              communicate their intention to update models to End-users in an accessible way prior to models being updated.
      - id: "delivered"
        meaning: "The System Operator has delivered the update to End-users."
        kind: "stated"
        quotes:
          - source_lines: "824"
            quote: |-
              System Operators shall deliver these updates and patches to End-users.
      - id: "end_users_informed"
        meaning: "End-users have had clear, accessible information about the update."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "808-809"
            quote: |-
              proactively inform End-users of any security relevant updates and provide clear explanations in an accessible way.
    transitions:
      - id: "SU-T01"
        from: "required"
        to: "provided"
        trigger: "update-produced"
        kind: "stated"
        guards: "none stated"
        effects:
          - provision: "5.4.1-1"
            meaning: "The Developer provides the update."
            ids:
              - "etsi-en-304-223#R-0081"
            kind: "stated"
      - id: "SU-T02"
        from: "required"
        to: "not_providable"
        trigger: "update-impossible"
        kind: "stated"
        note: "No criterion for impossibility is stated (OI-17)."
        quotes:
          - source_lines: "827"
            quote: |-
              instances where updates cannot be provided for AI systems.
        guards: "none stated"
        related:
          - "etsi-en-304-223#R-0123"
      - id: "SU-T03"
        from: "not_providable"
        to: "contingency_applied"
        trigger: "contingency-invoked"
        kind: "stated"
        note: >-
          The EN requires the mechanisms to exist for this case; who invokes them, and whether
          anyone is told, is not stated (OI-17).
        guards: "none stated"
        effects:
          - provision: "5.4.1-1.1"
            meaning: "Mechanisms and contingency plans mitigate the risk."
            ids:
              - "etsi-en-304-223#R-0122"
            kind: "stated"
      - id: "SU-T04"
        from: "contingency_applied"
        to: "provided"
        trigger: "update-becomes-possible"
        kind: "inferred"
        inferred_reason: "The EN does not say how a contingency ends."
        guards: "none stated"
      - id: "SU-T05"
        from: "provided"
        to: "retested"
        trigger: "major-update"
        kind: "stated"
        condition: "The update is a major AI system update (OI-15)."
        guards: "none stated"
        effects:
          - provision: "5.4.1-2"
            meaning: "New security testing and evaluation."
            ids:
              - "etsi-en-304-223#R-0084"
            kind: "stated"
      - id: "SU-T06"
        from: "provided"
        to: "operator_notified"
        trigger: "operators-notified"
        kind: "stated"
