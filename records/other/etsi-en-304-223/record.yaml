    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "212 entries: the 72 provisions under their original ids (etsi-en-304-223#5.x.y-n, kept stable for tmodel's 64 citations), split_into 87 sentence entries (R-0006..R-0092); 17 split children of multi-form sentences (13 in clause 5, 4 in §4); §1/§4 statements, 12 applicability lines, 13 inferred. Directives vocabulary: 127 verbal forms = 101 in requirements + 26 in informative text (candidates, all with verdicts)."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "31 work-product structures the provisions prescribe, 127 top-level fields (173 with nested items), every field constrained_by the leaf sentence entries holding its verbal form (rebuilt by schema/build-messages.derived.py in the verify pass); 15 control-only provisions listed as not structures, each citing its provision entry. The EN defines no encoding."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "31 derived JSON Schemas (draft 2020-12) generated from messages.yaml by schema/generate.derived.py; 62 accept and 266 reject cases pass (schema/selftest.derived.py, which also checks const true on shall booleans, dependentRequired, anyOf, and that each obligation occurs in a cited text). The EN defines no schema."
      generated_from: distilled/messages.yaml
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "15 roles, 16 process flows, 91 steps (81 stated, 10 inferred), 25 error paths, 19 open issues; one Mermaid sequence diagram per flow in protocol.md. No wire protocol exists."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "10 machines (AI system lifecycle, model, training data, prompt/config, security update, incident, external component, end of life, threat model, training content): 58 states, 71 transitions, stated vs inferred per element; unsupported machines listed in not_modelled with reasons."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/README.md
      coverage: "Finding: no worked example or test vector; the one EXAMPLE block (clause 4) and five inline 'for example' asides quoted by marker. The *.cases.derived.json files are our schema test cases, not the source's."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "Adopt / adapt / reject against tmodel DEC-001a/b, R-018, R-020, ADR-0006/0007/0010/0012/0013, DEC-009 and mofn R-M-07/R-M-11; clause 5.1.3 threat-model content table; actor model and applicability filter; testability split of the 72 provisions; open questions and source defects."
      reviewed_by: ""
