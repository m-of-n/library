schema: "library-object-model/v1"
record: pci-secure-slc-2
source_version: "PCI Secure SLC Standard v2.0 (2026-09-28) — PUBLIC MATERIAL ONLY"
question: "What objects and edges does the PCI Secure SLC programme assume, as far as public PCI SSC pages state?"
note: >
  The standard itself sits behind the PCI SSC Document Library licence agreement and was NOT downloaded or read. Every
  object below is taken from public pages: the PCI SSC blog announcing v2.0 (2026-09-28), the RFC announcement (2026-05-15)
  and the Secure SLC standard page. Requirement-level structure (control objectives, test requirements) is unknown for v2.0;
  ETSI TS 104 219 Annex B.2 publishes SSDF -> PCI SSLC mappings to v1.x numbering (1.1-10.1), which is NOT evidence for v2.0.
objects:
  - {name: SecureSLCStandard, definition: "provides security requirements and assessment procedures for software vendors to integrate into their software development lifecycles and to validate that secure lifecycle management practices are in place", attributes: [version], locator: "PCI SSC blog 2026-09-28", kind: stated, tmodel_mapping: "external Requirement source (R-044)", notes: "v2.0 'refocused solely on a software vendor's Secure SLC'; requirements 'objective to allow the necessary flexibility for each vendor'."}
  - {name: SoftwareSecurityFramework, definition: "PCI SSF: the family of two standards (Secure SLC Standard, Secure Software Standard)", attributes: [], locator: "blog 2026-09-28", kind: stated, tmodel_mapping: "consortium/hierarchy record (not held)", notes: ""}
  - {name: SecureSoftwareStandard, definition: "the companion product-level standard (v2.0 published earlier in 2026) with a focus on sensitive assets", attributes: [version], locator: "blog 2026-09-28", kind: stated, tmodel_mapping: "external record (not held)", notes: "'neither standard requires an assessment to the other'."}
  - {name: SoftwareVendor, definition: "software vendor that develops software commonly deployed in a payment environment; the assessed entity", attributes: [], locator: "standard page 'Intended Audience'", kind: stated, tmodel_mapping: "Party (producer)", notes: ""}
  - {name: VendorSecureSLC, definition: "a software vendor's secure software lifecycle (process) — the object of assessment", attributes: [maturity], locator: "blog 2026-09-28", kind: stated, tmodel_mapping: "SDL / SecurityProgram (R-041)", notes: "Requirements accommodate 'varying levels of maturity'."}
  - {name: SensitiveAsset, definition: "focus concept aligned with Secure Software Standard v2.0", attributes: [], locator: "blog 2026-09-28; RFC 2026-05-15", kind: stated, tmodel_mapping: "Asset (§3)", notes: "Definition not public."}
  - {name: SAID, definition: "Sensitive Asset Identification Document — new document introduced with Secure Software Standard v2.0", attributes: [], locator: "blog 2026-09-28", kind: stated, tmodel_mapping: "WorkProduct (asset inventory) / governed view", notes: "Content not public."}
  - {name: DigitalTool, definition: "'digital tools', which include accounting for artificial intelligence (AI) within a vendor's Secure SLC processes", attributes: [], locator: "blog 2026-09-28", kind: stated, tmodel_mapping: "Component of development Environment (tooling)", notes: "New in v2.0."}
  - {name: SecureSLCAssessor, definition: "PCI Secure SLC Assessor qualified and trained by PCI SSC to perform independent assessments against the standard and per the Program Guide", attributes: [qualification], locator: "standard page; blog (training, AQR 2026)", kind: stated, tmodel_mapping: "Party role (assessor) — Review (§4)", notes: ""}
  - {name: ReportOnValidation, definition: "ROV template v2.0", attributes: [], locator: "blog 2026-09-28 document list", kind: stated, tmodel_mapping: "governed view (assessment report)", notes: ""}
  - {name: AttestationOfValidation, definition: "AOV template (for use with v2.x)", attributes: [], locator: "blog 2026-09-28 document list", kind: stated, tmodel_mapping: "Assertion (signed attestation)", notes: ""}
  - {name: ProgramGuide, definition: "PCI Secure Software Lifecycle Program Guide (for use with v2.x)", attributes: [], locator: "blog 2026-09-28", kind: stated, tmodel_mapping: "none (programme rules)", notes: ""}
  - {name: Listing, definition: "PCI SSC listing of Secure SLC-Qualified Software Vendors (listed and validated Secure SLC)", attributes: [], locator: "standard page; blog", kind: stated, tmodel_mapping: "new — public conformance registry", notes: ""}
  - {name: SecureSoftwareProduct, definition: "listed and validated Secure Software Product developed with a validated Secure SLC, afforded programme benefits", attributes: [], locator: "blog 2026-09-28", kind: stated, tmodel_mapping: "Product", notes: ""}
  - {name: TransitionPeriod, definition: "12-month transition from v1.1 to v2.0 beginning once training is available (CBT Q4 2026; ILT Q4 2026)", attributes: [start, months], locator: "blog 2026-09-28", kind: stated, tmodel_mapping: "version validity window on a Requirement source", notes: ""}
  - {name: PaymentBrand, definition: "manages compliance programmes; decides which entities must validate", attributes: [], locator: "standard page footer", kind: stated, tmodel_mapping: "Party (authority)", notes: ""}
edges:
  - {name: part_of, from: SecureSLCStandard, to: SoftwareSecurityFramework, cardinality: "N:1", definition: "one of two standards of the SSF", locator: "blog", kind: stated, tmodel_mapping: "part_of"}
  - {name: aligns_with, from: SecureSLCStandard, to: SecureSoftwareStandard, cardinality: "1:1", definition: "v2.0 aligns with Secure Software Standard v2.0", locator: "blog", kind: stated, tmodel_mapping: "see_also"}
  - {name: assessed_against, from: VendorSecureSLC, to: SecureSLCStandard, cardinality: "N:1", definition: "validation of secure lifecycle management practices", locator: "blog", kind: stated, tmodel_mapping: "conformance (R-042)"}
  - {name: performs, from: SecureSLCAssessor, to: ReportOnValidation, cardinality: "1:N", definition: "independent assessment documented in ROV", locator: "standard page; blog", kind: inferred, tmodel_mapping: "Review produces governed view"}
  - {name: attests, from: SoftwareVendor, to: AttestationOfValidation, cardinality: "1:N", definition: "AOV accompanies validation", locator: "blog document list", kind: inferred, tmodel_mapping: "Assertion"}
  - {name: listed_in, from: SoftwareVendor, to: Listing, cardinality: "N:1", definition: "listed and validated Secure SLC", locator: "standard page; blog", kind: stated, tmodel_mapping: "registry"}
  - {name: developed_under, from: SecureSoftwareProduct, to: VendorSecureSLC, cardinality: "N:1", definition: "vendors leverage their validated Secure SLC to develop products and receive programme benefits", locator: "blog", kind: stated, tmodel_mapping: "Product governed_by SecurityProgram (R-041)"}
  - {name: identifies, from: SAID, to: SensitiveAsset, cardinality: "1:N", definition: "SAID identifies sensitive assets", locator: "blog (by name)", kind: inferred, tmodel_mapping: "asset inventory"}
  - {name: governs_use_of, from: VendorSecureSLC, to: DigitalTool, cardinality: "1:N", definition: "accounting for digital tools incl. AI within Secure SLC processes", locator: "blog", kind: stated, tmodel_mapping: "tooling Requirement"}
gaps:
  - "Public conformance registry (listing of validated vendors) — tmodel has no node for an external validation status of a Party's SDL."
  - "Programme benefit edge: a validated process confers benefits on products assessed under the product standard (process -> product assurance inheritance) — not modelled in R-041/R-042."
  - "Requirement-level structure unknown for v2.0 (licence-walled): no control objective ids can be mapped until a licensed copy is reviewed."
