  note: "NOT READ. Summary written 2026-11-03 from the SAE catalogue abstract only; the normative text was not read. A later Internet Archive capture of the same catalogue page (20220121221217) supersedes the 2021-10-28 picture below: it lists J3061_202112 (2021-12-15, Latest, Stabilized) and J3061_201601 (2016-01-14, Historical), 129 pages, with the rationale that the recommended practice is being stabilized and that SAE J3061 is being superseded by ISO/SAE 21434. This record tracks J3061_201601. The document is sold by SAE and was not obtained. The live sae.org page returned only an empty application shell to our client on 2026-11-01. An Internet Archive capture dated 2021-10-28 of the J3061 catalogue page shows the abstract, calling it a recommended practice from the Vehicle Cybersecurity Systems Engineering Committee, and says the document is being cancelled and superseded by ISO/SAE 21434, with J3061A shown as WIP. The 2016-01 date comes from the identifier J3061_201601 in the live URL. The 2022-01-21 capture above is the latest status seen. Do not summarise the normative content from memory or from the catalogue page; summary.md reports only what the catalogue states, labelled as such: iso-sae-21434-2021 is the readable successor in this library. Earlier bears_on value DEC-005 removed: it came from Threat-Radar's numbering and does not mean the same on mofn."
