  note: "NOT READ. Summary written 2026-11-03 from SAE catalogue abstracts only; the normative text was not read. The document is sold by SAE (USD 87 digital in the 2022 capture) and was not obtained. The live sae.org page returned only an empty application shell to our client on 2026-11-01, so only Internet Archive captures were seen. Capture 20211028030945 of https://www.sae.org/standards/content/j3061/ shows the abstract, calls it a recommended practice from the Vehicle Cybersecurity Systems Engineering Committee, says the document is being cancelled and superseded by ISO/SAE 21434, and shows J3061A as WIP. Capture 20220121221217 of the same URL redirects to the J3061_202112 catalogue page (captured 20220121221219), the latest status seen: it lists J3061_202112 (2021-12-15, Latest, Stabilized) and J3061_201601 (2016-01-14, Historical, Issued), 129 pages, with the rationale that the recommended practice is being stabilized and that SAE J3061 is being superseded by ISO/SAE 21434. This record tracks J3061_201601. Do not summarise the normative content from memory or from the catalogue page; summary.md reports only what the catalogue states, labelled as such: iso-sae-21434-2021 is the readable successor in this library. Earlier bears_on value DEC-005 removed: it came from Threat-Radar's numbering and does not mean the same on mofn."
