  note: "SEC refuses requests it classes as undeclared automated tools (403 with an explanatory page) and asks for a user agent with company-specific information. Source check 2026-11-04: three fetches from this session with descriptive agents all got that 403, so the bytes checked are a copy fetched earlier on 2026-11-04 by a sibling session (sha256 2bc6cea3..., recorded here). That copy is the Workiva inline-XBRL filing, but the response ends with a <script> tag with an opaque path, injected before </body> by SEC's edge and not part of the filing, the likely reason the digest has differed between fetches. Neither earlier value reproduced: 9827bee5... (2026-11-01) and 481f89dc... (2026-11-03, claimed stable across fetches) were not of these bytes, and the claim that the file is served static is withdrawn. With the injected tag removed the copy hashes to 3a7da0c99ca1536625da03e7b014243109b2d8f44af8f938ef0ccdd41c5dee2b, a stable reference for the filing text. maturity left unset: an SEC filing has no standing level to verify."
