source: ".cache/in-toto-attestation-v1.txt: the 12-file rendering built by distilled/render-source.py from in-toto/attestation @ df02077bf97218a8860a5c534eff1f1381f56984. Line numbers are that rendering's. Proto field facts come from protos/in_toto_attestation/v1/*.proto in the same archive, not from the rendering."
extracted: "2026-11-09"
extracted_by: "FX-1 pass 1 (extract), messages agent, model claude-sonnet-5-5, from the source only"

# ---------------------------------------------------------------------------
note: 'Conventions. (1) A quotation is a map with source_lines and quote, cut from the rendering by script and checked by bin/check-quotes. Everything else is this file''s own wording. (2) constrained_by lists in-toto-attestation-v1#R-NNNN ids emitted from requirements.yaml by a (source_lines, text-fragment) selector that raises on zero or several matches; every pair was then read. A message-level constrained_by binds the structure as a whole. Pass 1 cited R-0001 to R-0087 only (the other ids did not exist yet); pass 2 (verify) re-emitted the lists against all 218 entries (pass 1's 216 and R-0217, R-0218, which pass 2 added) by the same kind of selector: each split parent replaced by its split_of children (only the children that apply, where the context names one statement), and the keyword-less stated and inferred entries that bind each structure added, every resolved pair read. (3) required is true, false or conditional for what THIS source says of the field; the specification is stated for JSON, and the ''level'' key gives the BCP 14 keyword as the source states it. (4) inferred: true marks anything not literally stated, with inferred_reason. (5) hex_length is inferred from the algorithm, never from the source. (6) name_kind: synthetic marks a key that labels a part and is not a member name. (7) proto: names the field in the reference protobuf, a second source; it is not part of the Markdown spec. The protobuf file says: Validation of all fields is left to the users of this proto.'

source_defects:
  # Local numbering. normative_sd gives the entry in normative.md's canonical list (SD-1 to SD-27); see its Crosswalk.
  - id: 'SD-01'
    normative_sd: 'SD-4'
    where: 'rendering L450 vs L464'
    defect: 'dirHash is the defined key; the worked example uses dirHash1'
  - id: 'SD-02'
    normative_sd: 'SD-2'
    where: 'rendering L1146'
    defect: 'OR where AND is meant: the validation pseudocode as written rejects every payloadType'
  - id: 'SD-03'
    normative_sd: 'SD-3'
    where: 'rendering L1149'
    defect: 'statement.type; the member is _type'
  - id: 'SD-04'
    normative_sd: 'SD-1'
    where: 'rendering L779-780 vs L785-786'
    defect: 'R-0057 (MUST take the form application/vnd.in-toto+<encoding>) and R-0058 (also application/vnd.in-toto.<predicate>+json) disagree; CHANGELOG v1.2 L1035-1036 widened the set and the general bullet was not updated'
  - id: 'SD-05'
    normative_sd: 'SD-5'
    where: 'rendering L931 and L963 vs L984 and L986'
    defect: 'the bundle examples change the first line''s payloadType from application/vnd.in-toto.provenance+json (9.4.1) to application/vnd.in-toto+json (9.4.5), and the spdx line from application/vnd.in-toto.spdx+json to application/vnd.in-toto+json, with the same payload letters'
  - id: 'SD-06'
    normative_sd: 'none (examples/README.md)'
    where: 'rendering L357, L366, L376, L931-932, L947-949, L960-963, L984-986, L998-1018'
    defect: 'example digests, payloads and signature arrays are placeholders (7f4714fd..., a..., [w...]) that are not valid hex, base64 or JSON; the fixtures record this per example'
  - id: 'SD-07'
    normative_sd: 'SD-25'
    where: 'rendering L444 (the list) and L446-448 (the phrase)'
    defect: '''the NIST names'' is said of a list that includes blake2b, blake2s, ripemd160, sm3, gost and md5, which are not NIST hash names; the list gives no output length for any entry'
  - id: 'SD-08'
    normative_sd: 'SD-24'
    where: 'rendering L51 and L978'
    defect: 'typos ''comptabile'' (L51) and ''evey'' (L978); quoted as evidence in normative.md SD-24, never copied into this file''s own wording'

