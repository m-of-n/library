    text: 'NOT VERBATIM. In JSON a producer writes content as a base64 string of the resource''s bytes, the only encoding the source shows for the bytes type. It names no alphabet (standard or URL-safe) and no padding rule (SD-17).'
    verb: 'none'
    kind: inferred
    actor: 'producer'
    object: 'ResourceDescriptor'
    field: 'content (JSON form)'
    testable: 'partial'
    testable_reason: 'base64 is checkable; which alphabet and whether padded is not settled by the source'
    grounds:
      - source_lines: '245'
        text: '"content": "<BASE64 VALUE>", // converted from bytes for JSON'
      - source_lines: '287'
        text: '`content` _bytes, optional_'
  - id: 'in-toto-attestation-v1#R-0204'
    locator: '§5.2'
    text: 'NOT VERBATIM. For the named standard algorithms a consumer compares a digest value as the bytes its hexadecimal text encodes, as the validation model does with hexDecode, so letter case does not decide a match; a producer still writes lowercase. A value that does not decode as hexadecimal matches nothing.'
    verb: 'none'
    kind: inferred
    actor: 'consumer'
    object: 'DigestSet'
    field: 'values of the named standard algorithms (comparison)'
    testable: 'yes'
    grounds:
      - source_lines: '431-432'
        text: 'The named standard algorithms below use lowercase hex encoding.'
      - source_lines: '1154'
        text: '- `hash(alg, artifactToVerify)` == `hexDecode(value)`'
  - id: 'in-toto-attestation-v1#R-0205'
    locator: '§5.2.1.1'
    text: 'NOT VERBATIM. A producer uses each standard algorithm key exactly as the §5.2.1.1 heading spells it (sha256, sha512_224, sha3_256 and the rest), not whatever the stated derivation from NIST names would give: lowercasing SHA-256 and replacing its hyphen gives sha_256, which no list carries. The heading''s spellings are the keys a consumer recognizes.'
    verb: 'none'
    kind: inferred
    actor: 'producer; consumer'
    object: 'DigestSet'
    field: 'keys of the standard algorithms'
    testable: 'yes'
    note: 'SD-25.'
    grounds:
      - source_lines: '444'
        text: '`sha256`, `sha224`, `sha384`, `sha512`, `sha512_224`, `sha512_256`, `sha3_224`, `sha3_256`, `sha3_384`, `sha3_512`, `shake128`, `shake256`, `blake2b`, `blake2s`, `ripemd160`, `sm3`, `gost`, `sha1`, `md5`'
      - source_lines: '446-448'
        text: 'Standard cryptographic hash algorithms using [the NIST names][] (converting to lowercase and replacing `-` with `_`) as keys and lowercase hex-encoded values, for cases when the method of serialization is obvious or well known.'
  - id: 'in-toto-attestation-v1#R-0206'
    locator: '§5.2.2'
    text: 'NOT VERBATIM. Two DigestSets match only through an algorithm name present in both, by comparing the two values held under that one name; equal values under different names never match. The second example of §5.3 is that case: the same value under sha256 on one side and sha512 on the other does not match.'
    verb: 'none'
    kind: inferred
    candidate: 'C-0058'
    actor: 'consumer'
    object: 'DigestSet (two compared)'
    field: '(entries under a shared algorithm name)'
    testable: 'yes'
    note: 'With several acceptable names shared, ANY one agreeing value matches on the literal reading, whatever the others say (SD-13).'
    grounds:
      - source_lines: '557-558'
        text: 'Two DigestSets SHOULD be considered matching if ANY acceptable field matches.'
      - source_lines: '602'
        text: '- `{"sha256": "abcd"}` does not match `{"sha256": "fedb", "sha512": "abcd"}`'
  - id: 'in-toto-attestation-v1#R-0207'
    locator: '§5.2.2'
    text: 'NOT VERBATIM. The algorithm names a DigestSet may use are an open set: the §5.2.1 list is not exhaustive, a new algorithm is admitted by documenting its value encoding (R-0035), and §5.3 shows a name that is not predefined. A schema or parser does not restrict DigestSet keys to the listed names, and a consumer ignores the names it does not recognize.'
    verb: 'none'
    kind: inferred
    candidate: 'C-0059'
    actor: 'producer; consumer'
    object: 'DigestSet'
    field: 'keys (open set)'
    testable: 'yes'
    note: 'Ignoring is R-0106.'
    grounds:
      - source_lines: '560-561'
        text: '**New algorithms MUST document how the value is encoded, e.g. URL-safe base64, lowercase hex, etc.**'
      - source_lines: '603'
        text: '- `{"somecoolhash": "abcd"}` uses a non-predefined algorithm'
  - id: 'in-toto-attestation-v1#R-0208'
    locator: '§6.3'
    text: 'NOT VERBATIM. A producer writes a Timestamp''s UTC designator as an uppercase Z, the form the definition names in parentheses and its example uses, not as a numeric offset of +00:00 or a lowercase z. Whether a consumer accepts those other spellings of a UTC instant is not said (SD-15).'
    verb: 'none'
    kind: inferred
    actor: 'producer'
    object: 'Timestamp'
    field: '(UTC designator)'
    testable: 'yes'
    grounds:
      - source_lines: '684-685'
        text: 'A timestamp is represented as a _string_ and MUST be in [RFC 3339][] format in the UTC timezone ("Z").'
      - source_lines: '689'
        text: '`"1985-04-12T23:20:50.52Z"`.'
  - id: 'in-toto-attestation-v1#R-0209'
    locator: '§8.1'
    text: 'NOT VERBATIM. A consumer verifies a signature over the payload bytes exactly as the envelope carries them (after base64 decoding), never over a re-serialization of the parsed Statement, and a party that re-serializes a Statement cannot keep its signatures. The envelope does not rely on canonicalization (R-0048) and carries the Statement as base64-encoded JSON (R-0063), so the bytes, not their parse, are what was signed.'
    verb: 'none'
    kind: inferred
    actor: 'consumer; any party forwarding an attestation'
    object: 'Envelope'
    field: 'payload (signed bytes)'
    testable: 'yes'
    note: 'Re-serializing can change member order, whitespace, escapes and number formatting; the source fixes none of them (SD-14), which is why only the carried bytes verify.'
    grounds:
      - source_lines: '754'
        text: '- SHOULD avoid depending on canonicalization for security'
      - source_lines: '798'
        text: '- `payload` MUST be a base64-encoded JSON [Statement].'
  - id: 'in-toto-attestation-v1#R-0210'
    locator: '§8.1'
    text: 'NOT VERBATIM. keyid only helps choose which recognized key to try; a consumer never treats it as identifying the signer. An attester is recognized only by a signature that verifies under that attester''s public key, and skipping keys by keyid is optional.'
    verb: 'none'
    kind: inferred
    actor: 'consumer (verifier)'
    object: 'Envelope'
    field: 'keyid'
    testable: 'yes'
    note: 'A test: an envelope whose keyid names a recognized key but whose signature was made with an unrecognized key yields no attester. Whether the optional skip is taken changes the result when the signature verifies under a recognized key other than the one keyid names (SD-26).'
    grounds:
      - source_lines: '755'
        text: '- SHOULD support a hint indicating what signing key was used, i.e., a KEYID'
      - source_lines: '1138-1140'
        text: '- Optional: skip if `signature.keyid` does not match `publicKey` - If `signature.sig` matches `publicKey`:'
  - id: 'in-toto-attestation-v1#R-0211'
    locator: '§8.2'
    text: 'NOT VERBATIM. The validation model''s check that a signature matches a public key verifies the signature over payloadType and payload together, since payloadType is signed along with payload (R-0056): a consumer that verifies over the payload alone does not meet R-0056''s purpose, and any change to payloadType makes every existing signature fail.'
    verb: 'none'
    kind: inferred
    actor: 'consumer (verifier)'
    object: 'Envelope'
    field: 'payloadType, payload (signature input)'
    testable: 'yes'
    note: 'The §9.4.5 example changes payloadType under unchanged signatures (SD-5). For DSSE the signing input over both is DSSE''s own; not quoted here.'
    grounds:
      - source_lines: '778'
        text: '- `payloadType` (or equivalent) MUST be signed along with the `payload`.'
      - source_lines: '1140'
        text: '- If `signature.sig` matches `publicKey`:'
  - id: 'in-toto-attestation-v1#R-0212'
    locator: '§8.2'
    text: 'NOT VERBATIM. A consumer of a DSSE envelope accepts a payloadType that is application/vnd.in-toto+json or has the form application/vnd.in-toto.<predicate>+json, and rejects any other before decoding the payload as a Statement. That is the evident intent of the validation model''s payloadType step, whose condition as printed joins its two tests with OR and so rejects every value (SD-2).'
    verb: 'none'
    kind: inferred
    actor: 'consumer (verifier)'
    object: 'DSSE envelope'
    field: 'payloadType (acceptance)'
    testable: 'yes'
    note: 'A rejected payloadType is not a Statement; inside a Bundle it is ignored (R-0075, R-0076).'
    grounds:
      - source_lines: '785-786'
        text: '`payloadType` MUST be set to `application/vnd.in-toto.<predicate>+json` or to `application/vnd.in-toto+json`.'
      - source_lines: '1146'
        text: '- Reject if (`envelope.payloadType` != `application/vnd.in-toto+json` OR `envelope.payloadType` does not match `application/vnd.in-toto.<predicate>+json`)'
  - id: 'in-toto-attestation-v1#R-0213'
    locator: '§8.2'
    text: 'NOT VERBATIM. A producer that uses the predicate-specific payloadType takes <predicate> from the filename of the predicate specification that defines the Statement''s predicateType, so that the media type names the predicate the Statement does. A predicateType with no specification file in the in-toto predicates directory has no predicate-specific form and takes application/vnd.in-toto+json, as the Fooly builder''s own type does in §9.4.1.'
    verb: 'none'
    kind: inferred
    actor: 'producer'
    object: 'DSSE envelope'
    field: 'payloadType (<predicate> part)'
    testable: 'partial'
    testable_reason: 'needs the predicates directory listing, outside this source'
    note: 'Consumers still rely only on predicateType (R-0060, R-0061).'
    grounds:
      - source_lines: '789-790'
        text: '- `<predicate>` MUST match the [predicate specification filename] without the file extension.'
      - source_lines: '924-926'
        text: 'The Fooly builder also produces a more detailed attestation that contains all the logs of the build as an in-toto [Statement] with `predicateType=https://fooly.app/Builder/v1`.'
      - source_lines: '932'
        text: '{ "payloadType": "application/vnd.in-toto+json", "payload": "b...", "signatures": [w...] }'
  - id: 'in-toto-attestation-v1#R-0214'
    locator: '§8.2'
    text: 'NOT VERBATIM. A consumer verifies the envelope''s signatures before it decodes the payload as a Statement or acts on any field of it, and uses nothing from a Statement that no recognized attester''s signature verifies. The validation model orders its steps so, R-0062 and R-0072 make parsing and verification the way to authenticated predicate information, and an alternative envelope format should not need the payload parsed before verification (R-0050). §8.2 prints R-0062 under the predicate-specific media type only (SD-7); this holds for every in-toto envelope.'
    verb: 'none'
    kind: inferred
    actor: 'consumer (verifier)'
    object: 'Envelope; Statement'
    field: '(verification before parsing and use)'
    testable: 'yes'
    grounds:
      - source_lines: '794-795'
        text: '- To obtain predicate information that is authenticated, consumers MUST parse the Envelope''s `payload`, and verify it against its `signatures`.'
      - source_lines: '1142'
        text: '- Reject if `attesterNames` is empty'
      - source_lines: '1147-1148'
        text: '- `statement` := decode `envelope.payload` as a JSON-encoded [Statement]; reject if decoding fails'
  - id: 'in-toto-attestation-v1#R-0215'
    locator: '§9.1'
    text: 'NOT VERBATIM. A producer writes each envelope in a Bundle as one line of JSON with no line break inside it: a Bundle is JSON Lines and each line is one envelope, which is why §9.5 needs a tool to make long one-line attestations readable.'
    verb: 'none'
    kind: inferred
    actor: 'producer'
    object: 'Bundle'
    field: '(one envelope per line)'
    testable: 'yes'
    grounds:
      - source_lines: '876'
        text: 'Attestation Bundles use [JSON Lines] to store multiple attestations.'
      - source_lines: '880'
        text: '- Each line within a Bundle SHOULD be an [Envelope].'
      - source_lines: '991-992'
        text: 'Large attestations might wind up being difficult for a person to read if they''re serialized to a single line each.'
  - id: 'in-toto-attestation-v1#R-0216'
    locator: '§9.1'
    text: 'NOT VERBATIM. An attestation whose predicateType the consumer does not recognize contributes nothing to its policy decision and is not an error: R-0076 says so inside a Bundle, the policy engine of §9.4.4 ignores an SPDX attestation it does not understand, and the monotonic principle is what makes ignoring safe.'
    verb: 'none'
    kind: inferred
    candidate: 'C-0081'
    actor: 'consumer'
    object: 'Statement'
    field: 'predicateType (unrecognized)'
    testable: 'yes'
    grounds:
      - source_lines: '882-883'
        text: '- Consumers MUST ignore attestations with unrecognized keys, types, subjects, or predicates.'
      - source_lines: '970-971'
        text: 'The policy engine used doesn''t understand `predicateType=https://spdx.dev/Document`, so it is ignored.'
