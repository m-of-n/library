note: >-
  Ids are stable and never reused. Cite as in-toto-attestation-v1#R-NNNN. R-0001 to R-0087 are the
  skeleton's (bin/fx1-skeleton), in source order. Pass 1 issued R-0088 to R-0216 and appended them
  after R-0087: split_of children R-0088 to R-0123, in parent order; keyword-less stated entries
  R-0124 to R-0196, in source order (promoted candidates and hunted text); inferred entries R-0197
  to R-0216. Pass 2 (verify) appended R-0217 and R-0218, two hunted keyword-less stated entries
  it found dropped, after R-0216 and out of source order. 218 entries: 87 skeleton (of which 18
  are split parents), 36 split_of children, 37 promoted from 60 candidates, 38 hunted (36 by
  pass 1, 2 by pass 2), 20 inferred.

  SOURCE TEXT. Every stated text is a contiguous span of .cache/in-toto-attestation-v1.txt (1162
  lines), the rendering distilled/render-source.py makes of twelve Markdown files from the source
  archive (content.url, at commit df02077; the archive's sha256 matches content.sha256, and the
  rendering re-made from it this pass is byte-identical to the cached one). Line numbers and §
  locators are the rendering's: file i is §i, its Markdown level-2 headings §i.j, and so on. A
  blockquote continuation keeps its > marker inside a text, as the rendering does. Out of scope:
  spec/predicates/* (each predicate is its own specification) and spec/v0.1.0; the predicates
  directory was listed only to check the filenames R-0059 and R-0069 refer to (SD-19).

  SPLITS. A skeleton entry whose text holds more than one statement, or runs from a definition or an
  example into its rule or across a blockquote paragraph, keeps its id, text and count and gains
  split_into; each child (split_of) is a sub-span cut by script from the lines named, with tight
  source_lines, and carries one statement. A clause-level child ends where its clause does. The
  parent's verb is the first keyword of its text; its actor, object and field cover its children's;
  it is tested only through them. What children leave out of a parent (a definition sentence, an
  example, a disclaimer) is named in the parent's note or testable_reason. Sentences with one
  keyword twice are split where the two bind different things (R-0032, R-0037, R-0040). Not split:
  R-0058 (one MUST over two alternatives) and the ITE-5 criteria (one keyword each).

  VERBS. verb is the keyword as printed, or none for a keyword-less statement: a promoted candidate,
  a hunted text, an inferred entry, or a keyword-less split child. The document uses MUST, MUST NOT,
  SHOULD, SHOULD NOT, MAY, REQUIRED and RECOMMENDED; outside the §1.2 recital (which lists ten of
  RFC 2119's eleven terms, all but NOT RECOMMENDED), never SHALL, SHALL NOT, NOT RECOMMENDED or OPTIONAL in capitals.

  ACTORS. producer is whoever creates a Statement, an envelope or a Bundle; consumer whoever
  evaluates one (the validation model's verifier). Where a sentence is passive or names only its
  object, the actor is attributed and says (the sentence names no actor). The ITE-5 criteria R-0046
  to R-0051 bind an alternative envelope format, which R-0045's lead-in names. A definition binds no
  actor by itself.

  LOCATORS. The section the text lies in, as the rendering's heading prints it, set by script for
  every new entry; bin/check-locators reads it. Inferred entries carry the section of their first
  ground and are reported by check-locators as not contiguous spans, by design.

  TESTABLE. yes when a test can observe the behaviour in a message or file or in a consumer's
  decision; partial or no carries a testable_reason. A MAY is yes where taking it up is observable.
  note records a source tension or defect that bears on the entry; SD-n refers to normative.md's
  list.

  IDENTICAL TEXTS. 6 groups of stated entries carry identical text, the source stating one rule in
  both §8.2 and §8.4, one clause for both ResourceURI and TypeURI, or one scope sentence in both
  §3.2 and §7.2: R-0060, R-0070; R-0061, R-0071; R-0062, R-0072; R-0108, R-0112; R-0110, R-0114;
  R-0217, R-0218. bin/check-id-joins --surface lists 4 of them: it skips texts under 40
  characters, and the fifth and sixth are shorter but no less identical. Tell
  them apart by locator, object and field, and emit any citation of them from this table by script.

  CANDIDATES. Every one of the 120 in inferred-candidates.yaml has a verdict: 60 stated, 3 inferred,
  57 reject. The stated ones make 37 entries: five carry a run of list items each, cut from its
  first line to its last (the git object hash input, and the validation model's inputs, attester
  loop, subject matching and output: R-0162, R-0187, R-0189, R-0194, R-0196); the rest copy the
  candidate's own text. A rejection says why: overview, example, narrative, rationale, index, or a
  permission a keyword sentence restates.

  HUNTED. 38 keyword-less statements no candidate carried, found by reading: the eleven field
  headings of §3.2 and §4.2 (type, required or optional), definitions rules rest on (DigestSet as
  one or more entries, the hex and NIST-name conventions, the dirHash and git values, ResourceURI
  and TypeURI as RFC 3986 URIs), scope lead-ins (§2.2, §4.3, the general and DSSE parts of §8.2,
  §11, the validation model, and, added by pass 2, the parsing-rules sentence of §3.2 and §7.2,
  R-0217 and R-0218), the release rules of §1.1, and single rules (unset predicate, the
  underscore name, JSON Lines, opaque TypeURIs, the Bundle's per-attestation authentication).

  INFERRED. Entries of kind inferred are this extraction's words, prefixed NOT VERBATIM, each with
  grounds cut from the source; none carries a keyword: R-0197, R-0198, R-0199, R-0200, R-0201,
  R-0202, R-0203, R-0204, R-0205, R-0206, R-0207, R-0208, R-0209, R-0210, R-0211, R-0212, R-0213,
  R-0214, R-0215, R-0216. They answer what the source leaves an implementer to work out: unknown
  members in nested objects, duplicate member names, exact _type matching, subject order and
  emptiness, the underscore name, the JSON form of content, digest comparison (as bytes, under a
  shared algorithm name, with an open key set and the heading's key spellings), the Z designator,
  signed bytes and signature input, keyid as a hint, payloadType acceptance, the predicate part of
  the media type, verification before parsing, one envelope per Bundle line, unrecognized predicate
  types.

  VALIDATION MODEL. docs/validation.md has no keyword and lies outside spec/: §1.2 declares keywords
  for the documents under the specification (L63-65), and spec/README.md offers the model as
  pseudocode showing how the layers fit together (L28-29), beside documentation of background and
  examples. Decision: its reject steps, inputs and output are carried as stated keyword-less
  entries, the reference consumer procedure (R-0186 to R-0196), because they are the only place the
  source orders the consumer's checks, and they state two rules found nowhere else: reject when no
  recognized attester's signature verifies (R-0190) and when no subject matches (R-0195). Its
  headings and intermediate state are rejected. Where it disagrees with spec/v1 (SD-2, SD-3, SD-8),
  spec/v1 governs, and R-0212 and R-0199 give the evident intent.

  KEYWORDS. §1.2 declares RFC 2119 for all documents under this specification (L63-65), so the
  keywords of envelope.md, bundle.md and versioning.md bind as those of statement.md do. It does not
  invoke RFC 8174; see the reconciliation and SD-11.
