# in-toto-attestation-v1 state machines, FX-1 pass 1 (protocol and state-machine agent). Written
# by script with protocol.yaml; quotes and ids follow its conventions.
record: "in-toto-attestation-v1"
reviewed_by: ""
kind: "state-machine"
extracted: "2026-11-09"
extracted_by: >-
  FX-1 pass 1 (extract), protocol and state-machine agent, claude-opus-5-5, effort max, from the
  source only (blind to summary.md and the other lanes)
source:
  file: ".cache/in-toto-attestation-v1.bin"
  sha256: "c66cbb44b115cd0745e0f22dfedb069729a081a7f56372e3fca8ead667795d91"
  commit: "df02077bf97218a8860a5c534eff1f1381f56984"
  rendering: ".cache/in-toto-attestation-v1.txt"
  rendering_sha256: "87260bf00f01cbbe4e9c85795f29043ffc8801416958a8bde232139cb1ed13d0"
applicability: >-
  Applicable. Six machines: M01 is §12's validation model exactly as written (the one procedure
  with states and reject outcomes in the source); M02 is the per-line processing of a Bundle the
  §9 rules imply, around M01; M03 is the life of a Bundle file as the §9.4 example shows it; M04
  and M05 are §2.2 and §11's version lifecycle from the author's and the consumer's side; M06 is
  §1.1's release lifecycle. The source defines no producer-side lifecycle beyond M03, no key or
  attestation lifecycle (issuance, expiry, revocation) and no session.
conventions:
  fields: >-
    kind is stated or inferred on every state and transition; inferred ones carry
    inferred_reason. error: true and terminal: true mark states, repeated per machine in
    error_states and terminal_states. reachable_as_written: false marks what M01 cannot reach as
    the source writes it. A guard is the source's condition in this file's words;
    guard_evaluates says what it comes to when that is not obvious; intended_guard is this
    model's repair, always inferred. quotes, constrained_by and the locator rules are
    protocol.yaml's. protocol_steps names the protocol.yaml steps a transition renders.
  triggers: >-
    A trigger is a spec structure (kind message, resolves_to the structure's name) or a named
    event with a definition, listed once under triggers_used.
triggers_used:
  - name: "validation-requested"
    kind: "event"
    definition: >-
      The consumer starts §12 with its four inputs; the attestation is a JSON-encoded Envelope.
    carries: "Envelope"
    quotes:
      - at: "§12"
        source_lines: "1122-1125"
        quote: |-
          Inputs: - `artifactToVerify`: blob of data - `attestation`: JSON-encoded [Envelope]
        status: "docs-pseudocode"
  - name: "completion"
    kind: "event"
    definition: >-
      The source state's activity has finished; the guards choose the transition (the UML
      completion event).
    quotes: []
  - name: "next-pair"
    kind: "event"
    definition: "The signature loop takes its next (signature, (name, publicKey)) pair."
    carries: "Envelope"
    quotes:
      - at: "§12"
        source_lines: "1136"
        quote: |-
          For each `signature` in `envelope.signatures`:
        status: "docs-pseudocode"
      - at: "§12"
        source_lines: "1137"
        quote: |-
          For each (`name`, `publicKey`) in `recognizedAttesters`:
        status: "docs-pseudocode"
  - name: "pairs-exhausted"
    kind: "event"
    definition: "Every (signature, recognized attester) pair has been examined."
    quotes:
      - at: "§12"
        source_lines: "1142"
        quote: |-
          Reject if `attesterNames` is empty
        status: "docs-pseudocode"
  - name: "bundle-line"
    kind: "message"
    resolves_to: "Bundle"
    definition: "One line of a Bundle, downloaded and parsed on its own."
    quotes:
      - at: "§9.3"
        source_lines: "912-913"
        quote: |-
          To obtain predicate information that is authenticated, consumers MUST download and parse each line in a Bundle separately.
        status: "spec"
  - name: "validation-finished"
    kind: "event"
    definition: "The M01 instance run for a line has reached a terminal state."
    quotes: []
  - name: "attestations-produced"
    kind: "event"
    definition: "A producer has signed Envelopes to store in a new Bundle."
    carries: "Envelope"
    quotes:
      - at: "§9.4.1"
        source_lines: "926-928"
        quote: |-
          The builder places _both_ of these signed attestations in a new file named `fooly.apk.intoto.jsonl`.
        status: "example"
  - name: "attestation-appended"
    kind: "event"
    definition: "A later producer's Envelope is appended to the Bundle."
    carries: "Envelope"
    quotes:
      - at: "§9.4.2"
        source_lines: "944"
        quote: |-
          The TestResult is then appended to the contents of `fooly.apk.intoto.jsonl`
        status: "example"
  - name: "policy-check"
    kind: "event"
    definition: "A policy engine is given the Bundle to check an artifact."
    carries: "Bundle"
    quotes:
      - at: "§9.4.4"
        source_lines: "968-970"
        quote: |-
          Just prior to deployment the CI/CD system checks `fooly.apk` with a policy engine (providing `fooly.apk.intoto.jsonl` as it does so) to ensure the app is safe to publish.
        status: "example"
  - name: "publish"
    kind: "event"
    definition: "The holder of the Bundle publishes a filtered copy."
    carries: "Bundle"
    quotes:
      - at: "§9.4.5"
        source_lines: "979-981"
        quote: |-
          The CI/CD system then iterates through all the attestations, removing the attestation with `predicateType=https://fooly.app/Builder/v1` and publishes to their website:
        status: "example"
  - name: "attack"
    kind: "event"
    definition: "Someone with write access deletes, replays or injects lines."
    quotes:
      - at: "§9"
        source_lines: "864-868"
        quote: |-
          The Bundle is not authenticated as a whole. Instead each individual attestation is authenticated using signature formats like [DSSE]. As such, an attacker might be able to delete valid attestations, replay obsolete attestations, and/or inject invalid or irrelevant attestations in a Bundle without being detected.
        status: "spec"
  - name: "change-proposed"
    kind: "event"
    definition: >-
      A predicate author (or, for the Statement, the maintainers) proposes a change to a type.
    quotes:
      - at: "§11.1"
        source_lines: "1065"
        quote: |-
          This document explains how version changes and extension fields are handled.
        status: "spec"
  - name: "type-received"
    kind: "message"
    resolves_to: "Statement"
    definition: >-
      A Statement, or a predicate inside one, arrives for parsing; Predicate for predicateType.
    quotes:
      - at: "§11.2"
        source_lines: "1076-1077"
        quote: |-
          Any message MUST be semantically correct when parsed as any other version with the same major number.
        status: "spec"
  - name: "release-tagged"
    kind: "event"
    definition: "The maintainers tag a framework release."
    quotes:
      - at: "§1.1"
        source_lines: "33-34"
        quote: |-
          The latest [tagged release] version matches the [SemVer](https://semver.org) MAJOR.MINOR version of the Attestation Framework spec.
        status: "spec"
machines:
  - id: "M01"
    name: "validation-model"
    title: "docs/validation.md as written: one artifact, one attestation"
    run_by: "consumer"
    locator: "§12"
    status: "docs-pseudocode"
    summary: >-
      The pseudocode of §12 as a machine, every guard and action in the source's order and
      nothing repaired. Two guards are defective as written (SD-01 at T09/T10, SD-02 at
      T13/T14); each carries the source's guard in guard and this model's reading in
      intended_guard (inferred). The signature loop is one state with self-transitions per
      (signature, recognized attester) pair, in the nesting SD-04 says the source meant. Every
      error state is a reject: validation ends, nothing is output, nothing is sent to anyone.
    initial: "S01"
    states:
      - id: "S01"
        name: "inputs-received"
        kind: "stated"
        initial: true
        description: >-
          artifactToVerify, attestation, recognizedAttesters and acceptableDigestAlgorithms are
          bound.
      - id: "S02"
        name: "envelope-decoded"
        kind: "stated"
        description: "envelope is the decoded Envelope; attesterNames is the empty set."
      - id: "S03"
        name: "checking-signatures"
        kind: "stated"
        description: >-
          Iterating every (signature in envelope.signatures, (name, publicKey) in
          recognizedAttesters) pair, adding name to attesterNames for each match.
      - id: "S04"
        name: "envelope-layer-passed"
        kind: "stated"
        description: >-
          The source's Intermediate state: envelope.payloadType, envelope.payload and a
          non-empty attesterNames.
      - id: "S05"
        name: "payload-type-accepted"
        kind: "stated"
        reachable_as_written: false
        description: >-
          payloadType passed the Statement layer's first check. Unreachable as written (SD-01).
      - id: "S06"
        name: "statement-decoded"
        kind: "stated"
        reachable_as_written: false
        description: "statement is the decoded Statement."
      - id: "S07"
        name: "statement-type-accepted"
        kind: "stated"
        reachable_as_written: false
        description: "The Statement's type is Statement/v1; matchedSubjects is computed on entry."
      - id: "S08"
        name: "output"
        kind: "stated"
        terminal: true
        reachable_as_written: false
        description: >-
          Success: statement.predicateType, statement.predicate, matchedSubjects and
          attesterNames are output to the policy engine.
      - id: "E01"
        name: "rejected-envelope-not-decoded"
        kind: "stated"
        error: true
        terminal: true
        description: "attestation did not decode as a JSON-encoded Envelope."
      - id: "E02"
        name: "rejected-no-recognized-attester"
        kind: "stated"
        error: true
        terminal: true
        description: "No signature matched any recognized attester's publicKey."
      - id: "E03"
        name: "rejected-payload-type"
        kind: "stated"
        error: true
        terminal: true
        description: >-
          payloadType failed the Statement layer's check; as written, every payloadType does.
      - id: "E04"
        name: "rejected-statement-not-decoded"
        kind: "stated"
        error: true
        terminal: true
        reachable_as_written: false
        description: "envelope.payload did not decode as a JSON-encoded Statement."
      - id: "E05"
        name: "rejected-statement-type"
        kind: "stated"
        error: true
        terminal: true
        reachable_as_written: false
        description: "The Statement's type is not https://in-toto.io/Statement/v1."
      - id: "E06"
        name: "rejected-no-matched-subject"
        kind: "stated"
        error: true
        terminal: true
        reachable_as_written: false
        description: "No subject has an acceptable digest equal to the artifact's."
    transitions:
      - id: "T01"
        from: "S01"
        to: "S02"
        trigger: "validation-requested"
        guard: "attestation decodes as a JSON-encoded Envelope"
        actions:
