  - id: "M02"
    name: "bundle-line-processing"
    title: "Consumer processes one line of a Bundle"
    run_by: "consumer"
    locator: "§9.1, §9.3, §12"
    status: "spec"
    summary: >-
      One instance per line of a Bundle, all independent. The Bundle rules give only two
      outcomes for a line, processed or ignored; there is no error state, because nothing in §9
      fails a Bundle. Running M01 per Envelope line, and mapping its rejects onto the four kinds
      of unrecognized attestation that §9.1 says to ignore, are this model's (marked inferred):
      §12 covers a single attestation and leaves multiple ones unexplained.
    initial: "L01"
    states:
      - id: "L01"
        name: "line-read"
        kind: "stated"
        initial: true
        description: "One line of the Bundle, downloaded and parsed on its own."
      - id: "L02"
        name: "envelope-recognized"
        kind: "stated"
        description: "The line is a recognized Envelope."
      - id: "L03"
        name: "validating"
        kind: "inferred"
        inferred: true
        inferred_reason: "§9 never refers to §12; validating each line with M01 is this model's."
        description: "M01 runs with this Envelope as attestation and the consumer's other inputs."
      - id: "L04"
        name: "validated"
        kind: "stated"
        description: "M01 reached S08: predicateType, predicate, matchedSubjects, attesterNames."
      - id: "L05"
        name: "accepted"
        kind: "stated"
        terminal: true
        description: "The output joins the set handed to the policy engine."
      - id: "X01"
        name: "line-ignored"
        kind: "stated"
        terminal: true
        description: "An unrecognized line, ignored (MUST). Not an error: the Bundle is unaffected."
      - id: "X02"
        name: "attestation-ignored"
        kind: "stated"
        terminal: true
        description: >-
          An attestation with unrecognized keys, types, subjects or predicates, ignored (MUST).
          Not an error.
