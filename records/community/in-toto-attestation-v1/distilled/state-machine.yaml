              The Bundle is not authenticated as a whole. Instead each individual attestation is authenticated using signature formats like [DSSE]. As such, an attacker might be able to delete valid attestations, replay obsolete attestations, and/or inject invalid or irrelevant attestations in a Bundle without being detected.
            status: "spec"
          - at: "§9"
            source_lines: "870-872"
            quote: |-
              Our Bundle specification aims to reduce the risks of such attacks. In addition, predicates that follow the [monotonic principle] should not have any issues with deletion attacks.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0176"
        note: >-
          Stands for the same self-transition on B02 and B03. Predicates that follow the
          monotonic principle are said to have no issue with deletion; for replay and injection
          the source names no mechanism, saying only that the Bundle specification aims to
          reduce the risks (L870).
    error_states_note: "None: the source defines no failure for a Bundle file."
    error_states: []
    terminal_states:
      - "B03"
  - id: "M04"
    name: "type-version-lifecycle"
    title: "A type (the Statement or a predicate) moving through SemVer versions"
    run_by: "predicate-author"
    locator: "§2.2, §11.2, §11.3"
    status: "spec"
    summary: >-
      §11 applies to Statement and predicate versioning alike. The state is the type's current
      version under its TypeURI; a version bump is a transition whose guard is the kind of
      change. 0.X versions count as major versions.
    initial: "V01"
    states:
      - id: "V01"
        name: "version-M.m.p"
        kind: "stated"
        initial: true
        description: "The type at version M.m.p under the TypeURI of major version M."
      - id: "V02"
        name: "version-M.(m+1).0"
        kind: "stated"
        description: "A new minor version under the same TypeURI."
      - id: "V03"
        name: "version-(M+1).0.0"
        kind: "stated"
        description: "A new major version under a new TypeURI."
    transitions:
      - id: "T01"
        from: "V01"
        to: "V01"
        trigger: "change-proposed"
        guard: "a PATCH-level change (the source says PATCH is kept only for SemVer compliance)"
        actions:
          - "increment p; TypeURI unchanged"
        locator: "§11.2"
        kind: "stated"
        quotes:
          - at: "§11.2"
            source_lines: "1071-1072"
            quote: |-
              (PATCH isn't really needed, but we do it just so we're SemVer compliant.)
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0180"
      - id: "T02"
        from: "V01"
        to: "V02"
        trigger: "change-proposed"
        guard: >-
          the change follows the monotonic principle: new fields whose absence has no meaning
          and whose presence does not change any other field
        actions:
          - "increment m; TypeURI unchanged"
        locator: "§2.2, §11.2, §11.3"
        kind: "stated"
        quotes:
          - at: "§2.2"
            source_lines: "118"
            quote: |-
              Minor version changes always follow the monotonic principle.
            status: "spec"
          - at: "§11.2"
            source_lines: "1080-1082"
            quote: |-
              (All fields present in both versions have the same meaning, and the absence of any new fields has no semantic meaning.)
            status: "spec"
          - at: "§11.3"
            source_lines: "1098-1101"
            quote: |-
              Provenance 1.1.0 (minor version) adds a new `buildFinished` timestamp. This is OK because the absence of the `buildFinished` has no semantic meaning and the presence or absence of `buildFinished` does not affect the rest of the message. The type ID is still `https://slsa.dev/provenance/v1`.
            status: "example"
        constrained_by:
          - "in-toto-attestation-v1#R-0085"
          - "in-toto-attestation-v1#R-0086"
          - "in-toto-attestation-v1#R-0087"
          - "in-toto-attestation-v1#R-0130"
          - "in-toto-attestation-v1#R-0128"
          - "in-toto-attestation-v1#R-0182"
          - "in-toto-attestation-v1#R-0183"
      - id: "T03"
        from: "V01"
        to: "V03"
        trigger: "change-proposed"
        guard: >-
          a new field changes the meaning of an existing one, or an existing field's meaning
          changes
        actions:
          - "increment M; new TypeURI"
        locator: "§11.2, §11.3"
        kind: "stated"
        quotes:
          - at: "§11.2"
            source_lines: "1076-1077"
            quote: |-
              Any message MUST be semantically correct when parsed as any other version with the same major number.
            status: "spec"
          - at: "§11.3"
            source_lines: "1103-1105"
            quote: |-
              Provenance 2.0.0 (major version) adds a new `recipe.extraArgs` field. This is required because the meaning of `recipe` changes if `extraArgs` is present. Parsing it as 1.x.y will result in an incorrect interpretation.
            status: "example"
          - at: "§11.3"
            source_lines: "1107-1108"
            quote: |-
              Provenance 3.0.0 (major version) modifies the meaning of `builder.id`. This is required because an existing field was modified.
            status: "example"
        constrained_by:
          - "in-toto-attestation-v1#R-0085"
          - "in-toto-attestation-v1#R-0128"
          - "in-toto-attestation-v1#R-0184"
        note: >-
          The rule is R-0085: a change that would make some message parse wrongly under another
          minor version cannot be a minor version; §11.3's examples show the two kinds.
      - id: "T04"
        from: "V01"
        to: "V03"
        trigger: "change-proposed"
        guard: >-
          the type is at a 0.X version: a change to X is a new major version, so a new TypeURI
        actions:
          - "new TypeURI for each 0.X"
        locator: "§11.2, §2.2"
        kind: "stated"
        quotes:
          - at: "§11.2"
            source_lines: "1073-1074"
            quote: |-
              NOTE: 0.X.Y versions are considered major versions for the purposes of this doc, consistent with semantic versioning.
            status: "spec"
          - at: "§2.2"
            source_lines: "119"
            quote: |-
              NOTE: 0.X versions are considered major versions.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0131"
          - "in-toto-attestation-v1#R-0181"
    error_states: []
    terminal_states: []
  - id: "M05"
    name: "consumer-version-handling"
    title: "Consumer handling of a received type by its TypeURI"
    run_by: "consumer"
    locator: "§2.2, §11.2, §12"
    status: "spec"
    summary: >-
      The consumer's side of M04: a TypeURI it implements is parsed across minor versions; any
      other TypeURI, including another major version of a known type, is not recognized. The
      outcome for an unrecognized type is stated for a Statement (§12 rejects) and inside a
      Bundle (ignore), and not stated elsewhere.
    initial: "C01"
    states:
      - id: "C01"
        name: "type-received"
        kind: "stated"
        initial: true
        description: "A Statement or predicate with TypeURI U."
      - id: "C02"
        name: "parsed"
        kind: "stated"
        terminal: true
        description: "Parsed as the implemented version: semantically correct, unknown fields ignored."
      - id: "C03"
        name: "unrecognized"
        kind: "stated"
        terminal: true
        description: "U is not a TypeURI the consumer implements."
    transitions:
      - id: "T01"
        from: "C01"
        to: "C02"
        trigger: "type-received"
        guard: >-
          U equals, as an opaque string, a TypeURI the consumer implements (same major version)
        actions:
          - "parse as the implemented minor version"
          - "ignore unrecognized fields"
        locator: "§11.2"
        kind: "stated"
        quotes:
          - at: "§11.2"
            source_lines: "1088-1091"
            quote: |-
              The type ID only includes the major version. This allows implementations to support any major version without having to parse the URI to pull out the version. (Parsing is impossible since we don't mandate the format of the URI.) Implementations just use the URI as an opaque string.
            status: "spec"
          - at: "§11.2"
            source_lines: "1076-1077"
            quote: |-
              Any message MUST be semantically correct when parsed as any other version with the same major number.
            status: "spec"
          - at: "§11.2"
            source_lines: "1079-1080"
            quote: |-
              Parsing an older message as a newer minor/patch version MUST be semantically equivalent to parsing it as the original version.
            status: "spec"
          - at: "§11.2"
            source_lines: "1083-1084"
            quote: |-
              Parsing a newer message as an older minor/patch version MUST be semantically equivalent to parsing it as the newer version with all new fields removed.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0085"
          - "in-toto-attestation-v1#R-0086"
          - "in-toto-attestation-v1#R-0087"
          - "in-toto-attestation-v1#R-0001"
          - "in-toto-attestation-v1#R-0185"
          - "in-toto-attestation-v1#R-0129"
          - "in-toto-attestation-v1#R-0197"
        protocol_steps:
          - "F09.1"
          - "F09.2"
          - "F09.3"
      - id: "T02"
        from: "C01"
        to: "C03"
        trigger: "type-received"
        guard: "U matches no implemented TypeURI"
        actions:
          - "reject (Statement, §12) or ignore (Bundle, §9.1)"
        locator: "§1.1.1, §9.1"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source makes a major version a new TypeURI and says what happens to an
          unrecognized type in a Bundle (ignore) and to a Statement in §12 (reject); it states
          no general rule.
        quotes:
          - at: "§1.1.1"
            source_lines: "57-59"
            quote: |-
              Tagged release v2.0.0 (MAJOR version) changes the meaning of the `predicateType` field. A new `v2` directory is added to `/spec` and the `_type` of a `Statement` becomes `https://in-toto.io/Statement/v2`.
            status: "example"
          - at: "§9.1"
            source_lines: "882-883"
            quote: |-
              Consumers MUST ignore attestations with unrecognized keys, types, subjects, or predicates.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0076"
          - "in-toto-attestation-v1#R-0199"
          - "in-toto-attestation-v1#R-0131"
        protocol_steps:
          - "F09.4"
    error_states: []
    terminal_states:
      - "C02"
      - "C03"
  - id: "M06"
    name: "framework-release-lifecycle"
    title: "Tagged releases of the Attestation Framework"
    run_by: "maintainers"
    locator: "§1.1, §1.1.1, §10"
    status: "spec"
    summary: >-
      Distinct from M04: the version of the framework's tagged releases, whose MAJOR.MINOR
      matches the spec's. The CHANGELOG records the history v1, v1.1, v1.2, all under
      Statement/v1.
    initial: "R01"
    states:
      - id: "R01"
        name: "release-vM.m.p"
        kind: "stated"
        initial: true
        description: "A tagged release vM.m.p; the spec is vM.m."
      - id: "R02"
        name: "release-vM.m.(p+1)"
        kind: "stated"
        description: "A PATCH release."
      - id: "R03"
        name: "release-vM.(m+1).0"
        kind: "stated"
        description: "A MINOR release with a new CHANGELOG entry."
      - id: "R04"
        name: "release-v(M+1).0.0"
        kind: "stated"
        description: "A MAJOR release: a new spec directory and Statement _type."
    transitions:
      - id: "T01"
        from: "R01"
        to: "R02"
        trigger: "release-tagged"
        guard: >-
          predicate specifications changed, or language bindings changed compatibly; the core
          spec's semantics unchanged
        actions:
          - "Statement _type unchanged"
        locator: "§1.1, §1.1.1"
        kind: "stated"
        quotes:
          - at: "§1.1"
            source_lines: "38-39"
            quote: |-
              We use new tagged PATCH version releases to indicate updates to predicate specifications and/or backwards-compatible changes to the language bindings.
            status: "spec"
          - at: "§1.1.1"
            source_lines: "43-47"
            quote: |-
              Attestation Framework tagged release v1.0.2 (PATCH version) incorporates refinements to the predicate specification process, a new predicate type, and a small patch to the Golang language bindings. None of these changes affects the semantics of the core spec. The `_type` of a `Statement` is still `https://in-toto.io/Statement/v1`.
            status: "example"
        constrained_by:
          - "in-toto-attestation-v1#R-0126"
      - id: "T02"
        from: "R01"
        to: "R03"
        trigger: "release-tagged"
        guard: "a backwards-compatible semantic update to the spec, predicates excepted"
        actions:
          - "add a CHANGELOG entry"
          - "Statement _type unchanged"
        locator: "§1.1, §1.1.1"
        kind: "stated"
        quotes:
          - at: "§1.1"
            source_lines: "36-37"
            quote: |-
              Backwards-compatible semantic updates to the spec (except predicates) are indicated through new tagged MINOR version releases.
            status: "spec"
          - at: "§1.1.1"
            source_lines: "49-55"
            quote: |-
              Tagged release v1.1.0 (MINOR version) generalizes the semantics of the `DigestSet` field type to support any type of immutable identifier. This change is backwards comptabile because cryptographic digests are strongly recommended to achieve immutability, so any implementations that only support cryptographic `DigestSet` still meet the modified semantics. The `_type` of a `Statement` is still `https://in-toto.io/Statement/v1` but a new entry in the `v1` CHANGELOG is added.
            status: "example"
        constrained_by:
          - "in-toto-attestation-v1#R-0125"
          - "in-toto-attestation-v1#R-0124"
        note: "SD-15: v1.2 (L1035-1036) widened payloadType in a MINOR release."
        source_defects:
          - "SD-15"
      - id: "T03"
        from: "R01"
        to: "R04"
        trigger: "release-tagged"
        guard: "a change to the meaning of the spec, e.g. of predicateType"
        actions:
          - "add spec/v2"
          - "Statement _type becomes https://in-toto.io/Statement/v2"
        locator: "§1.1.1"
        kind: "stated"
        quotes:
          - at: "§1.1.1"
            source_lines: "57-59"
            quote: |-
              Tagged release v2.0.0 (MAJOR version) changes the meaning of the `predicateType` field. A new `v2` directory is added to `/spec` and the `_type` of a `Statement` becomes `https://in-toto.io/Statement/v2`.
            status: "example"
        constrained_by:
          - "in-toto-attestation-v1#R-0124"
    history:
      - version: "v1"
        text: "Initial release."
        quotes:
          - at: "§10.3"
            source_lines: "1046"
            quote: |-
              Initial release.
            status: "spec"
      - version: "v1.1"
        text: "Subjects assumed immutable; non-cryptographic digests acceptable."
        quotes:
          - at: "§10.2"
            source_lines: "1040-1042"
            quote: |-
              Clarified that subjects are assumed to be immutable and that it is acceptable to use a non-cryptographic digest (though cryptographic digests are still strongly recommended).
            status: "spec"
      - version: "v1.2"
        text: "payloadType may be application/vnd.in-toto.<predicate>+json."
        quotes:
          - at: "§10.1"
            source_lines: "1035-1036"
            quote: |-
              Expanded the allowed values for the envelope's `payloadType` field to `application/vnd.in-toto.<predicate>+json`. See [Envelope Fields].
            status: "spec"
    error_states: []
    terminal_states: []
