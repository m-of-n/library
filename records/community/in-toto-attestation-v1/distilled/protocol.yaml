error_paths:
  - id: "EP-01"
    failure: "attestation is not a JSON-encoded Envelope"
    met_by: "consumer"
    steps:
      - "F03.E1"
    machine: "M01.T02"
    outcome: "reject"
    basis: "stated"
  - id: "EP-02"
    failure: "no signature matches a recognized attester"
    met_by: "consumer"
    steps:
      - "F03.E4"
    machine: "M01.T08"
    outcome: "reject"
    basis: "stated"
  - id: "EP-03"
    failure: "payloadType fails the Statement layer's check (as written: every payloadType)"
    met_by: "consumer"
    steps:
      - "F03.S1"
    machine: "M01.T09"
    outcome: "reject"
    basis: "stated"
  - id: "EP-04"
    failure: "payload is not base64 or not a JSON-encoded Statement"
    met_by: "consumer"
    steps:
      - "F03.S2a"
      - "F03.S2"
    machine: "M01.T12"
    outcome: "reject (base64 part inferred)"
    basis: "stated"
  - id: "EP-05"
    failure: "Statement type is not https://in-toto.io/Statement/v1"
    met_by: "consumer"
    steps:
      - "F03.S3"
    machine: "M01.T13"
    outcome: "reject"
    basis: "stated"
  - id: "EP-06"
    failure: "no subject has an acceptable digest equal to the artifact's"
    met_by: "consumer"
    steps:
      - "F03.S5"
    machine: "M01.T15"
    outcome: "reject"
    basis: "stated"
  - id: "EP-07"
    failure: "a Bundle line is not recognized"
    met_by: "consumer"
    steps:
      - "F06.3"
    machine: "M02.T02"
    outcome: "ignore the line"
    basis: "stated"
  - id: "EP-08"
    failure: "an attestation in a Bundle has unrecognized keys, types, subjects or predicates"
    met_by: "consumer"
    steps:
      - "F06.5"
      - "F08.5"
    machine: "M02.T04, M02.T07"
    outcome: "ignore the attestation"
    basis: "stated"
  - id: "EP-09"
    failure: "a field is unrecognized"
    met_by: "consumer, policy-engine"
    steps:
      - "F03.S2"
      - "F04.3"
      - "F09.3"
    machine: "M05.T01"
    outcome: "ignore the field, unless the predicate specification says otherwise"
    basis: "stated"
  - id: "EP-10"
    failure: "a DigestSet entry uses an unrecognized or unaccepted algorithm"
    met_by: "consumer"
    steps:
      - "F03.S4"
    machine: "M01.T14"
    outcome: "ignore the entry"
    basis: "stated"
  - id: "EP-11"
    failure: >-
      a Bundle line is deleted, an obsolete attestation replayed, or an invalid or irrelevant
      one injected
    met_by: "nobody"
    steps:
      - "F05.5"
      - "F06.6"
    machine: "M03.T06, M02.I-03"
    outcome: "undetected; only monotonic predicates are said to be safe from deletion"
    basis: "stated"
  - id: "EP-12"
    failure: "a TypeURI of another major version"
    met_by: "consumer"
    steps:
      - "F09.4"
    machine: "M05.T02"
    outcome: "reject (Statement, §12) or ignore (Bundle); elsewhere unstated"
    basis: "inferred"
  - id: "EP-13"
    failure: "anything wrong in what a producer builds, names or labels"
    met_by: "producer"
    steps:
      - "F01.1"
      - "F02.2"
      - "F05.1"
      - "F07.3"
    outcome: >-
      unspecified by source: no producer-side check exists; only §12's checks can catch it
    basis: "unspecified"
  - id: "EP-14"
    failure: "the media type of an attestation misstates its predicate type"
    met_by: "consumer"
    steps:
      - "F04.2"
      - "F07.4"
    outcome: "harmless if the consumer relies only on predicateType, as it SHOULD"
    basis: "stated"
  - id: "EP-15"
    failure: "a descriptor's uri or downloadLocation does not resolve"
    met_by: "consumer"
    steps:
      - "F11.3"
    outcome: "unspecified by source: a ResourceURI MAY be unresolvable"
    basis: "unspecified"
  - id: "EP-16"
    failure: "a fetched resource does not match the descriptor's digest"
    met_by: "consumer"
    steps:
      - "F11.4"
    outcome: "unspecified by source; read here as not the described resource"
    basis: "inferred"
source_defects_and_tensions:
  # Local numbering. normative_sd is the entry in normative.md's canonical list (SD-1 to SD-27); see its Crosswalk.
  - id: "SD-01"
    normative_sd: "SD-2"
    kind: "defect"
    where: "§12 L1146"
    text: >-
      The Statement layer's first check rejects when payloadType !=
      'application/vnd.in-toto+json' or not matches(payloadType,
      'application/vnd.in-toto.<predicate>+json'). No value both equals the first and matches
      the second, so one clause is always true and every attestation is rejected. §8.2 allows
      both values, so the evident intent is AND. Modelled as written in F03.S1 and M01.T09/T10,
      with the intended guard beside it. Plausibly introduced when v1.2 added the
      predicate-specific value (L1035-1036); not checked against an earlier tag.
    quotes:
      - at: "§12"
        source_lines: "1146"
        quote: |-
          Reject if (`envelope.payloadType` != `application/vnd.in-toto+json` OR `envelope.payloadType` does not match `application/vnd.in-toto.<predicate>+json`)
        status: "docs-pseudocode"
      - at: "§8.2"
        source_lines: "785-786"
        quote: |-
          `payloadType` MUST be set to `application/vnd.in-toto.<predicate>+json` or to `application/vnd.in-toto+json`.
        status: "spec"
    affects:
      - "F02.2"
      - "F03.S1"
      - "M01.T09"
      - "M01.T10"
  - id: "SD-02"
    normative_sd: "SD-3"
    kind: "defect"
    where: "§12 L1149"
    text: >-
      The pseudocode tests statement.type; the Statement's field is _type (§3.1, §3.2). Read
      against the JSON the pseudocode says it decodes, a Statement carrying only §3's fields has
      no field type and is rejected. The repository's protobuf binding names the field type with
      JSON name _type (protos/in_toto_attestation/v1/statement.proto line 17 at df02077, outside
      the 12 rendered files, read only to characterize this), the likely origin. Modelled as
      written with the _type reading as intended_guard.
    quotes:
      - at: "§12"
        source_lines: "1149"
        quote: |-
          Reject if `statement.type` != `https://in-toto.io/Statement/v1`
        status: "docs-pseudocode"
      - at: "§3.1"
        source_lines: "165"
        quote: |-
          "_type": "https://in-toto.io/Statement/v1",
        status: "spec"
      - at: "§3.2"
        source_lines: "183"
        quote: |-
          `_type` _string ([TypeURI]), required_
        status: "spec"
    affects:
      - "F03.S3"
      - "M01.T13"
      - "M01.T14"
  - id: "SD-03"
    normative_sd: "SD-21"
    kind: "defect"
    where: "§12 L1133"
    text: >-
      The Envelope layer's first step is a list item at column 0, a sibling of Envelope layer
      rather than its child, so the following steps at column 4 nest under it and Envelope layer
      has no children. Its continuation line at column 8 and the column-4 siblings suggest
      column 4 was meant. The order of operations is unaffected.
    indent_by_line:
      - line: "1132"
        column: "0"
      - line: "1133"
        column: "0"
      - line: "1134"
        column: "8"
      - line: "1135"
        column: "4"
      - line: "1136"
        column: "4"
      - line: "1137"
        column: "8"
      - line: "1138"
        column: "8"
      - line: "1139"
        column: "12"
      - line: "1140"
        column: "12"
      - line: "1141"
        column: "16"
      - line: "1142"
        column: "4"
