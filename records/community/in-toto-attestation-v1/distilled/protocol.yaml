  - id: "F03"
    name: "attestation-validation"
    title: >-
      Consumer validates one attestation about one artifact (docs/validation.md, as written)
    kind: "receive-processing"
    participants:
      - "storage"
      - "consumer"
      - "policy-engine"
    summary: >-
      The only procedure in the source, §12, modelled step for step and not repaired. Step
      numbers follow the pseudocode's own nesting: E for the Envelope layer, I for the
      intermediate state, S for the Statement layer, O for the output; 0 is the inputs, and S2a
      is the one step this model adds (inferred). Every failure is a reject that ends validation
      with no output; nothing is sent back to the producer. As written, step S1 rejects every
      attestation (SD-01) and step S3 tests a field named type that a conforming Statement
      spells _type (SD-02); state-machine.yaml M01 records both readings. The pseudocode is in
      docs/, outside spec/, and carries no BCP 14 keyword, so constrained_by names the §5 and §8
      requirements each step enforces.
    steps:
      - n: "0"
        from: "storage"
        to: "consumer"
        message: "Envelope"
        data:
          - "artifactToVerify"
          - "recognizedAttesters"
          - "acceptableDigestAlgorithms"
        action: >-
          Take the four inputs: the artifact to verify (a blob of data), the attestation (a
          JSON-encoded Envelope), the recognized attesters as (name, publicKey) pairs, and the
          acceptable digest algorithms, usually just sha256. How the consumer obtains any of
          them is not stated.
        short: >-
          inputs: artifactToVerify, attestation, recognizedAttesters, acceptableDigestAlgorithms
        locator: "§12 L1122-1128"
        kind: "stated"
        quotes:
          - at: "§12"
            source_lines: "1124"
            quote: |-
              - `artifactToVerify`: blob of data
            status: "docs-pseudocode"
          - at: "§12"
            source_lines: "1125"
            quote: |-
              - `attestation`: JSON-encoded [Envelope]
            status: "docs-pseudocode"
          - at: "§12"
            source_lines: "1126"
            quote: |-
              - `recognizedAttesters`: collection of (`name`, `publicKey`) pairs
            status: "docs-pseudocode"
          - at: "§12"
            source_lines: "1127-1128"
            quote: |-
              - `acceptableDigestAlgorithms`: collection of acceptable cryptographic hash algorithms (usually just `sha256`)
            status: "docs-pseudocode"
        constrained_by:
          - "in-toto-attestation-v1#R-0105"
          - "in-toto-attestation-v1#R-0106"
          - "in-toto-attestation-v1#R-0033"
          - "in-toto-attestation-v1#R-0031"
          - "in-toto-attestation-v1#R-0186"
          - "in-toto-attestation-v1#R-0187"
        on_error: "unspecified by source (§12 L1122-1128)"
        on_error_basis: "unspecified"
        note: >-
          acceptableDigestAlgorithms is where the consumer's duty to accept only algorithms it
          considers secure (R-0032) is discharged; the pseudocode calls them cryptographic hash
          algorithms, so non-cryptographic DigestSet entries (§5.2.3) never match here.
        source_defects:
          - "SD-12"
      - n: "E1"
        from: "consumer"
        to: "consumer"
        message: "Envelope"
        action: >-
          envelope := decode attestation as a JSON-encoded Envelope; reject if decoding fails.
        short: "decode attestation as JSON Envelope"
        locator: "§12 L1133-1134"
        kind: "stated"
        quotes:
          - at: "§12"
            source_lines: "1133-1134"
            quote: |-
              `envelope` := decode `attestation` as a JSON-encoded [Envelope]; reject if decoding fails
            status: "docs-pseudocode"
        constrained_by:
          - "in-toto-attestation-v1#R-0188"
        on_error: "reject: validation ends with no output"
        on_error_basis: "stated"
        note: >-
          SD-03: this bullet is indented as a sibling of Envelope layer, not as its first child.
        source_defects:
          - "SD-03"
      - n: "E2"
        from: "consumer"
        to: "consumer"
        message: "Envelope"
        data:
          - "attesterNames"
        action: "attesterNames := empty set of names."
