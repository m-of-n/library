          - "in-toto-attestation-v1#R-0114"
          - "in-toto-attestation-v1#R-0115"
          - "in-toto-attestation-v1#R-0140"
          - "in-toto-attestation-v1#R-0166"
          - "in-toto-attestation-v1#R-0165"
          - "in-toto-attestation-v1#R-0128"
        on_error: "unspecified by source (§7.2, §6.2)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "producer"
        to: "producer"
        message: "Predicate"
        also_messages:
          - "Statement"
