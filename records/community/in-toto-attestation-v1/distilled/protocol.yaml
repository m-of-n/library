  - id: "SD-14"
    normative_sd: "SD-26"
    kind: "tension"
    where: "§12 L1138-1139; §8.3 L813"
    text: >-
      The optional skip compares signature.keyid with a publicKey; how a KEYID is derived from a
      key is defined only by reference to the in-toto specification (L844), and a missing keyid
      (keyid is a SHOULD) is not addressed.
    quotes:
      - at: "§12"
        source_lines: "1138-1139"
        quote: |-
          Optional: skip if `signature.keyid` does not match `publicKey`
        status: "docs-pseudocode"
      - at: "§8.2"
        source_lines: "774"
        quote: |-
          A `keyid` (or equivalent) SHOULD be included for each signing key used.
        status: "spec"
    affects:
      - "F03.E3.1.1"
      - "M01.T04"
  - id: "SD-15"
    normative_sd: "SD-27"
    kind: "tension"
    where: "§1.1 L36-37; §10.1 L1035-1036"
    text: >-
      MINOR releases are backwards-compatible semantic updates, yet v1.2 widened the allowed
      payloadType values under the same Statement/v1. A v1.2 envelope with a predicate-specific
      payloadType is new to any consumer built to the earlier single value, which the CHANGELOG
      implies was the only one before v1.2.
    quotes:
      - at: "§1.1"
        source_lines: "36-37"
        quote: |-
          Backwards-compatible semantic updates to the spec (except predicates) are indicated through new tagged MINOR version releases.
        status: "spec"
      - at: "§10.1"
        source_lines: "1035-1036"
        quote: |-
          Expanded the allowed values for the envelope's `payloadType` field to `application/vnd.in-toto.<predicate>+json`. See [Envelope Fields].
        status: "spec"
    affects:
      - "M06.T02"
      - "F03.S1"
  - id: "SD-16"
    normative_sd: "none (example; see normative.md Crosswalk)"
    kind: "tension"
    where: "§9.4.2 L938-940, §9.4.4 L968-971"
    text: >-
      The scanner's Envelope carries a custom non-in-toto payloadType, which §12 rejects and
      §9.1 says to ignore if unrecognized, yet the example's policy check is meant to establish
      that the app may be published, with no word on how it reads the scan. The example's
      consumer goes beyond the validation model.
    quotes:
      - at: "§9.4.2"
        source_lines: "938-940"
        quote: |-
          The vulnerability scanner doesn't use in-toto Statements but instead uses their own custom `payloadType=application/vnd.novulz+cbor`, which they put in a [DSSE] envelope.
        status: "example"
      - at: "§9.4.4"
        source_lines: "968-971"
        quote: |-
          Just prior to deployment the CI/CD system checks `fooly.apk` with a policy engine (providing `fooly.apk.intoto.jsonl` as it does so) to ensure the app is safe to publish. The policy engine used doesn't understand `predicateType=https://spdx.dev/Document`, so it is ignored.
        status: "example"
    affects:
      - "F08.3"
      - "F08.5"
