      - "M01.T04"
      - "M01.T05"
      - "M01.T06"
  - id: "SD-05"
    normative_sd: "SD-8"
    kind: "tension"
    where: "§12 L1154; §5.2.1.2, §5.2.1.3, §5.2.2"
    text: >-
      Subject matching compares hash(alg, artifactToVerify) with hexDecode(value). That fits the
      named standard hash algorithms. For gitBlob and its siblings the hash is over a typed
      header and the content, for dirHash over a file tree, and a new algorithm may encode its
      value other than in hex; the pseudocode does not say hash(alg, ·) is algorithm-specific.
      Its input list scopes acceptableDigestAlgorithms to cryptographic hash algorithms, which
      excludes the non-cryptographic identifiers of §5.2.3 but not the git ones. A typical
      hexDecode also accepts uppercase hex, which the lowercase encoding rule never produces.
    quotes:
      - at: "§12"
        source_lines: "1154"
        quote: |-
          `hash(alg, artifactToVerify)` == `hexDecode(value)`
        status: "docs-pseudocode"
      - at: "§5.2.1.3"
        source_lines: "521"
        quote: |-
          This hash is computed over `<type> SP <size> NUL <content>`, where:
        status: "spec"
      - at: "§5.2.1.2"
        source_lines: "455-456"
        quote: |-
          Equivalent to extracting the archive to an empty directory and running the following command in that directory:
        status: "spec"
      - at: "§5.2.2"
        source_lines: "560-561"
        quote: |-
          New algorithms MUST document how the value is encoded, e.g. URL-safe base64, lowercase hex, etc.
        status: "spec"
      - at: "§12"
        source_lines: "1127-1128"
        quote: |-
          - `acceptableDigestAlgorithms`: collection of acceptable cryptographic hash algorithms (usually just `sha256`)
        status: "docs-pseudocode"
    affects:
      - "F03.S4"
      - "M01.T14"
  - id: "SD-06"
    normative_sd: "SD-1"
    kind: "defect"
    where: "§8.2 L779-780 vs L785-786"
    text: >-
      The general Envelope requirement says payloadType MUST take the form
      application/vnd.in-toto+<encoding>; the first DSSE-specific requirement says it MUST be
      application/vnd.in-toto.<predicate>+json or application/vnd.in-toto+json. The
      predicate-specific value does not take the general form. The v1.2 change widened only the
      DSSE list.
    quotes:
      - at: "§8.2"
        source_lines: "779-780"
        quote: |-
          It MUST take the form `application/vnd.in-toto+<encoding>` to indicate an in-toto [Statement] payload and its serialized `<encoding>` format.
        status: "spec"
      - at: "§8.2"
        source_lines: "785-786"
        quote: |-
          `payloadType` MUST be set to `application/vnd.in-toto.<predicate>+json` or to `application/vnd.in-toto+json`.
        status: "spec"
      - at: "§10.1"
        source_lines: "1035-1036"
        quote: |-
          Expanded the allowed values for the envelope's `payloadType` field to `application/vnd.in-toto.<predicate>+json`. See [Envelope Fields].
        status: "spec"
    affects:
      - "F02.2"
      - "F03.S1"
  - id: "SD-07"
    normative_sd: "SD-5"
    kind: "defect"
    where: "§9.4.5 L984, L986 vs §9.4.3 L960, L963"
    text: >-
      Publishing is described as removing one attestation, yet the provenance line a... changes
      payloadType from application/vnd.in-toto.provenance+json to application/vnd.in-toto+json
      and the SBOM line d... from application/vnd.in-toto.spdx+json to
      application/vnd.in-toto+json, with the same signature placeholders. payloadType MUST be
      signed with the payload, so changed lines would verify only if re-signed, which the text never says. Plausibly the lines were
      written before v1.2 and only partly updated.
    quotes:
      - at: "§9.4.3"
        source_lines: "960"
        quote: |-
          { "payloadType": "application/vnd.in-toto.provenance+json", "payload": "a...", "signatures": [w...] }
        status: "example"
      - at: "§9.4.3"
        source_lines: "963"
        quote: |-
          { "payloadType": "application/vnd.in-toto.spdx+json", "payload": "d...", "signatures": [y...] }
        status: "example"
      - at: "§9.4.5"
        source_lines: "984"
        quote: |-
          { "payloadType": "application/vnd.in-toto+json", "payload": "a...", "signatures": [w...] }
        status: "example"
      - at: "§9.4.5"
        source_lines: "986"
        quote: |-
          { "payloadType": "application/vnd.in-toto+json", "payload": "d...", "signatures": [y...] }
        status: "example"
      - at: "§8.2"
        source_lines: "778"
        quote: |-
          `payloadType` (or equivalent) MUST be signed along with the `payload`.
        status: "spec"
    affects:
