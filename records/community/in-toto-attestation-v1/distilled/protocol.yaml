applicability: >-
  Applicable, as a production-and-consumption model with no exchange. The framework defines four
  data layers (Predicate, Statement, Envelope, Bundle) and no protocol: no request, response,
  session, transport binding, acknowledgement or error message passes between producer and
  consumer, and nothing travels back. It does define (a) what a producer puts in a Statement and
  how it wraps and signs it in an Envelope (§3 to §8); (b) one consumer procedure with reject
  outcomes, the validation model of docs/validation.md (§12), which spec/README.md links as its
  validation model; (c) how attestations are grouped into a Bundle and how a consumer must
  process one (§9.1, §9.3); (d) file naming and storage media types (§8.3, §8.4, §9.2, §9.3);
  (e) a worked CI/CD example in which several producers add to one Bundle and a policy engine
  consumes it (§9.4); and (f) version-compatibility rules a consumer applies when parsing (§2.2,
  §11). Every flow below is one party building or holding an object, a storage or delivery step
  the source does not define, and the receiving party processing it alone; every on_error is
  local to the role that meets the failure. The validation model is pseudocode outside spec/,
  carries no BCP 14 keyword, covers one artifact and one attestation (L1120), and as written
  rejects every attestation (SD-01); its links to Bundles and to the policy engine are inferred
  here and marked so.
conventions:
  quoting: >-
    Every quotes item is at, source_lines, quote and status. quote is cut by script from the
    whitespace-collapsed source_lines of the rendering, read as bin/_source_text reads it, with
    the range tight (dropping either end line loses the quote), and bin/check-quotes verifies
    every one. at is the section holding those lines, computed from the rendering's headings. No
    quote is typed. A greater-than sign or a hyphen inside a quote is the source's own Markdown
    blockquote or list mark, kept as the rendering has it.
  status: >-
    status on a quote: spec (a file under spec/, outside an Examples heading), example (an
    Examples heading or the §9.4 use case, non-normative), docs-pseudocode (§12,
    docs/validation.md).
  locators: >-
    §i is file i of the rendering (source.files); §i.j its j-th level-2 heading.
    docs/validation.md has no subheadings, so a §12 locator adds the lines (§12 L1146).
  basis: >-
    kind is stated or inferred on every step; inferred: true appears only on inferred steps,
    with inferred_reason. on_error_basis is stated (the source says what follows), unspecified
    (the source names the operation and nothing about its failure: on_error reads unspecified by
    source) or inferred. action, short, note and on_error are this file's wording; the quotes
    carry the source's.
  constrained_by: >-
    in-toto-attestation-v1#R-NNNN ids of distilled/requirements.yaml (R-0001 to R-0087 at
    extraction), each selected by script from its locator and a fragment of its text, refusing
    zero or several matches; every resolved pair was printed and read. §12 carries no BCP 14
    keyword, so its steps cite the §2, §5 and §8 requirements they enforce, and a step with no
    binding requirement has an empty list. Pass 2 (verify) re-emitted every list against all
    218 entries (pass 1's 216 and the two it added, R-0217 and R-0218) by the same kind of selector: each split parent replaced by its split_of
    children (only those the step's action states, where it states one), and the keyword-less
    stated entries (R-0124 to R-0196, the validation model's own steps R-0186 to R-0196 among
    them) and inferred entries (R-0197 to R-0216) that bind a step added; every resolved pair
    was read. 11 steps still have an empty list: F03.I (a hand-off, candidate C-0107
    rejected), F05.3, F05.5, F10.1 and F11.5 (no rule names them), and six §9.4 example steps.
  messages: >-
    message is one of the spec's own structure names: Envelope, Statement, ResourceDescriptor,
    DigestSet, Predicate, Bundle (one line of a Bundle is an Envelope); also_messages lists
    others the step touches and fields names fields in the spec's spelling. none means the step
    moves nothing the spec defines, with message_note saying why. data names values that are not
    messages: the artifact (artifactToVerify), the consumer's configuration
    (recognizedAttesters, acceptableDigestAlgorithms) and §12's derived values (attesterNames,
    matchedSubjects), in §12's own identifiers.
  step_numbers: >-
    In F03, n follows §12's nesting: 0 the inputs, E the Envelope layer (E3.1.2 is the second
    item inside the first item inside E3), I the intermediate state, S the Statement layer, O
    the output; S2a is the one step this model adds. Elsewhere n is this file's order.
  roles: >-
    from and to name roles of the roles list. kind is party, component, store or example; an
    example role says which generic role it plays. also_called lists the spellings found in the
    source by script.
framing:
  - id: "FR-01"
    text: >-
      Four layers, independent but designed to work together; the Envelope is the only one that
      authenticates.
    quotes:
      - at: "§1"
        source_lines: "13"
        quote: |-
          It has four layers that are independent but designed to work together:
        status: "spec"
      - at: "§1"
        source_lines: "15-16"
        quote: |-
          [Predicate]: Contains arbitrary metadata about a subject artifact, with a type-specific schema.
        status: "spec"
      - at: "§1"
        source_lines: "17-18"
        quote: |-
          [Statement]: Binds the attestation to a particular subject and unambiguously identifies the types of the predicate.
        status: "spec"
      - at: "§1"
        source_lines: "19"
        quote: |-
          [Envelope]: Handles authentication and serialization.
        status: "spec"
      - at: "§1"
        source_lines: "20"
        quote: |-
          [Bundle]: Defines a method of grouping multiple attestations together.
        status: "spec"
  - id: "FR-02"
    text: "The consumers the source has in mind are automated policy engines."
    quotes:
      - at: "§1"
        source_lines: "10-11"
        quote: |-
          The intended consumers are automated policy engines, such as [in-toto-verify] and [Binary Authorization].
        status: "spec"
  - id: "FR-03"
    text: >-
      The one procedure is pseudocode in docs/, for one artifact and one attestation, and it
      ends by feeding a policy engine.
    quotes:
      - at: "§1"
        source_lines: "28-29"
        quote: |-
          The [validation model] provides pseudocode showing how these layers fit together.
        status: "spec"
      - at: "§12"
        source_lines: "1116-1118"
        quote: |-
          The following pseudocode shows how to verify and extract metadata about a single artifact from a single attestation. The expectation is that consumers will feed the resulting metadata into a policy engine.
        status: "docs-pseudocode"
      - at: "§12"
        source_lines: "1120"
        quote: |-
          Explain how to process multiple artifacts and/or multiple attestations.
        status: "docs-pseudocode"
  - id: "FR-04"
    text: "Authentication is per attestation, never per Bundle."
    quotes:
      - at: "§9"
        source_lines: "864-868"
        quote: |-
          The Bundle is not authenticated as a whole. Instead each individual attestation is authenticated using signature formats like [DSSE]. As such, an attacker might be able to delete valid attestations, replay obsolete attestations, and/or inject invalid or irrelevant attestations in a Bundle without being detected.
        status: "spec"
  - id: "FR-05"
    text: "Subjects are matched by digest alone."
    quotes:
      - at: "§3.2"
        source_lines: "208-209"
        quote: |-
          IMPORTANT: Subject artifacts are matched purely by digest, regardless of > content type.
        status: "spec"
  - id: "FR-06"
    text: >-
      The envelope format and its signing protocol are delegated to DSSE v1.0, or to any ITE-5
      format.
    quotes:
      - at: "§8.1"
        source_lines: "748"
        quote: |-
          The RECOMMENDED format and protocol for Envelopes are defined per [DSSE v1.0].
        status: "spec"
      - at: "§8.1"
        source_lines: "749-750"
        quote: |-
          Producers MAY use other signature methods and formats that meet the [ITE-5] specification:
        status: "spec"
