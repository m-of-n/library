flows:
  - id: "F01"
    name: "statement-production"
    title: "Producer builds a Statement about one or more subject artifacts"
    kind: "creation"
    participants:
      - "producer"
    summary: >-
      Local to the producer. The source fixes what a Statement contains (§3), what each subject
      ResourceDescriptor and DigestSet must carry (§4, §5) and how a predicate is identified and
      extended (§2.2, §6.2, §7); it defines no producer-side check or failure. A defect in what
      is produced surfaces only when a consumer validates it (F03), and most such defects do not
      surface even there, because §12 checks only the signatures, payloadType, _type and the
      subject digests.
    steps:
      - n: "1"
        from: "producer"
        to: "producer"
        message: "ResourceDescriptor"
        also_messages:
          - "Statement"
        fields:
          - "subject"
          - "digest"
          - "name"
          - "uri"
        action: >-
          For each software artifact the attestation applies to, add a ResourceDescriptor to
          subject with digest set (MUST). name may distinguish artifacts within subject; when it
          is not meaningful the source says to leave it unset or use an underscore. name and
          uri, when set, SHOULD each be unique within subject. Subjects are assumed immutable
          (SHOULD NOT change). In every context a ResourceDescriptor carries at least one of
          uri, digest or content (MUST); for a subject it is digest.
        short: "one ResourceDescriptor per subject artifact, digest set (MUST)"
        locator: "§3.2, §4.2, §4.3"
        kind: "stated"
        quotes:
          - at: "§3.2"
            source_lines: "190-191"
            quote: |-
              Set of software artifacts that the attestation applies to. Each element > represents a single software artifact. Each element MUST have `digest` set.
            status: "spec"
          - at: "§3.2"
            source_lines: "193-194"
            quote: |-
              Subjects are assumed to be _immutable_, i.e. the artifacts identified by the > subject SHOULD NOT change.
            status: "spec"
          - at: "§3.2"
            source_lines: "199-200"
            quote: |-
              If the name is not > meaningful, leave the field unset or use "\_".
            status: "spec"
          - at: "§3.2"
            source_lines: "206"
            quote: |-
              If set, `name` and `uri` SHOULD be unique within subject.
            status: "spec"
          - at: "§4.2"
            source_lines: "258-259"
            quote: |-
              a ResourceDescriptor MUST specify one of `uri`, `digest` or `content` at a minimum.
            status: "spec"
          - at: "§4.3"
            source_lines: "338-340"
            quote: |-
              The `digest` SHOULD match the resource or artifact specified in one of the `name`, `uri`, `content` or `downloadLocation` fields.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0090"
          - "in-toto-attestation-v1#R-0091"
          - "in-toto-attestation-v1#R-0092"
          - "in-toto-attestation-v1#R-0013"
          - "in-toto-attestation-v1#R-0014"
          - "in-toto-attestation-v1#R-0025"
          - "in-toto-attestation-v1#R-0137"
          - "in-toto-attestation-v1#R-0138"
          - "in-toto-attestation-v1#R-0139"
          - "in-toto-attestation-v1#R-0201"
          - "in-toto-attestation-v1#R-0144"
        on_error: >-
          unspecified by source (§3.2, §4.2): no producer-side check; a subject whose digest
          does not match the artifact surfaces at the consumer as an empty matchedSubjects (F03
          step S5)
        on_error_basis: "unspecified"
      - n: "2"
        from: "producer"
        to: "producer"
        message: "DigestSet"
        fields:
          - "digest"
        action: >-
          Give each subject a DigestSet: a JSON object from algorithm name to the digest's
          string encoding, lowercase hex for the named standard algorithms. Usually one entry;
          several MAY be given for algorithm agility. Every entry MUST be an immutable reference
          to the artifact. A commonly accepted, cryptographically secure algorithm is STRONGLY
          RECOMMENDED and at least sha256 is RECOMMENDED (gitCommit is the conventional
          exception for git). A non-cryptographic identifier MAY be used when the risk of
          mutation is acceptable. A new algorithm MUST document how its value is encoded.
        short: "DigestSet per subject, at least sha256 (RECOMMENDED)"
        locator: "§5.2, §5.2.2, §5.2.3"
        kind: "stated"
        quotes:
          - at: "§5.2"
            source_lines: "430-432"
            quote: |-
              A DigestSet is represented as a _JSON object_ mapping algorithm name to a string encoding of the digest using that algorithm. The named standard algorithms below use lowercase hex encoding.
            status: "spec"
          - at: "§5.2"
            source_lines: "432-434"
            quote: |-
              Usually there is just a single key/value pair, but multiple entries MAY be used for algorithm agility.
            status: "spec"
          - at: "§5.2"
            source_lines: "436"
            quote: |-
              Each entry in a DigestSet MUST be an immutable reference to an artifact.
            status: "spec"
          - at: "§5.2"
            source_lines: "436-438"
            quote: |-
              It is STRONGLY RECOMMENDED to use a commonly accepted, cryptographically secure digest algorithm to achieve this immutability.
            status: "spec"
          - at: "§5.2.2"
            source_lines: "549-551"
            quote: |-
              It is RECOMMENDED to use at least `sha256` for compatibility between producers and consumers, unless a different hash algorithm is more conventional (e.g. `gitCommit` for git).
            status: "spec"
          - at: "§5.2.3"
            source_lines: "571-573"
            quote: |-
              users MAY use a non-cryptographic identifier in a DigestSet so long as the risk of the object being mutated is acceptable for the application.
            status: "spec"
          - at: "§5.2.2"
            source_lines: "560-561"
            quote: |-
              New algorithms MUST document how the value is encoded, e.g. URL-safe base64, lowercase hex, etc.
            status: "spec"
        constrained_by:
