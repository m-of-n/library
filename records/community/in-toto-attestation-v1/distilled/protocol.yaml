  - id: "F04"
    name: "policy-evaluation"
    title: "Policy engine decides on the validated metadata"
    kind: "receive-processing"
    participants:
      - "producer"
      - "consumer"
      - "policy-engine"
    summary: >-
      The source's intended consumers are automated policy engines, and §12 ends by feeding its
      output to one. The policy language, the decision format and how a decision is returned are
      not defined. What is defined is what a policy may rely on (predicateType, not the media
      type), what it must ignore (unrecognized fields), what it may use (extension fields,
      subject names, annotations) and how it should be shaped (monotonic).
