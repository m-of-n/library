  - id: "SD-04"
    normative_sd: "SD-21"
    kind: "defect"
    where: "§12 L1137-1141"
    text: >-
      The optional keyid skip (L1138) is at the same column as the inner loop over
      recognizedAttesters (L1137), so the signature check (L1140) nests under the skip and the
      inner loop has an empty body, leaving name and publicKey unbound where they are used. The
      only coherent reading puts L1138-1141 in the inner loop's body, which needs L1138-1139
      indented one level deeper and L1140-1141 left where they are; F03 and M01 model that
      reading.
    indent_by_line:
      - line: "1132"
        column: "0"
      - line: "1133"
        column: "0"
      - line: "1134"
        column: "8"
      - line: "1135"
        column: "4"
      - line: "1136"
        column: "4"
      - line: "1137"
        column: "8"
      - line: "1138"
        column: "8"
      - line: "1139"
        column: "12"
      - line: "1140"
        column: "12"
