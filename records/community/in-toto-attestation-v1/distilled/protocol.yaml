          Decide ALLOW or DENY with a policy designed to be monotonic (SHOULD): ignoring an
          attestation, or a field within one, never turns a DENY into an ALLOW.
        short: "decide ALLOW or DENY, monotonic policy (SHOULD)"
        locator: "§2.2"
