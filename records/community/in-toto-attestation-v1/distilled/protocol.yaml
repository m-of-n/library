  - id: "F05"
    name: "bundle-assembly"
    title: "Producers group attestations into a Bundle and store it"
    kind: "creation-and-delivery"
    participants:
      - "producer"
      - "storage"
    summary: >-
      A Bundle is a JSON Lines file, one Envelope per line, named for the file the attestations
      are relevant to. The source names no assembling role: in §9.4 the builder creates the file
      and the CI/CD system appends to it and filters it, so the steps name producer. The Bundle
      is not authenticated as a whole, so every change to it after the fact (including the
      filtering of step 5) is invisible to a consumer, and so are deletion, replay and injection
      by an attacker (EP-11).
    steps:
      - n: "1"
        from: "producer"
        to: "producer"
        message: "Bundle"
        action: >-
          Name the Bundle for the file the attestations are relevant to: <filename>.intoto.jsonl
          (SHOULD; the suffix .intoto.jsonl SHOULD be used).
        short: "name it {filename}.intoto.jsonl (SHOULD)"
        locator: "§9.2"
        kind: "stated"
        quotes:
          - at: "§9.2"
            source_lines: "888"
            quote: |-
              Bundles SHOULD use the suffix `.intoto.jsonl`.
            status: "spec"
          - at: "§9.2"
            source_lines: "890-891"
            quote: |-
              A Bundle of attestations relevant for `<filename>` SHOULD be named `<filename>.intoto.jsonl`.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0078"
          - "in-toto-attestation-v1#R-0079"
        on_error: "unspecified by source (§9.2)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "producer"
        to: "producer"
        message: "Bundle"
        also_messages:
          - "Envelope"
        action: >-
          Write each attestation as one line: an Envelope (SHOULD), in JSON Lines (MUST). Lines
          MAY differ in signing keys, _type, subject and predicateType; every attestation SHOULD
          be relevant to the named file or its dependencies.
        short: "one Envelope per line, JSON Lines (MUST)"
        locator: "§9.1, §9.2"
        kind: "stated"
        quotes:
          - at: "§9.1"
            source_lines: "876"
            quote: |-
              Attestation Bundles use [JSON Lines] to store multiple attestations.
            status: "spec"
          - at: "§9.1"
            source_lines: "880"
            quote: |-
              Each line within a Bundle SHOULD be an [Envelope].
            status: "spec"
          - at: "§9.1"
            source_lines: "878-879"
            quote: |-
              Each attestation within a Bundle MAY have different signing keys, `_type`, `subject`, and/or `predicateType`.
            status: "spec"
          - at: "§9.2"
            source_lines: "892-893"
            quote: |-
              Attestations in the Bundle MAY have different subjects, but they SHOULD all be relevant to that file or its dependencies.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0073"
          - "in-toto-attestation-v1#R-0074"
          - "in-toto-attestation-v1#R-0119"
          - "in-toto-attestation-v1#R-0120"
          - "in-toto-attestation-v1#R-0122"
          - "in-toto-attestation-v1#R-0177"
          - "in-toto-attestation-v1#R-0215"
        on_error: "unspecified by source (§9.1, §9.2)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "producer"
        to: "producer"
        message: "Bundle"
        also_messages:
          - "Envelope"
        action: "Append further attestations to the same file as later producers add them."
        short: "append further Envelope lines (example)"
        locator: "§9.4.2, §9.4.3"
        kind: "stated"
        quotes:
          - at: "§9.4.2"
            source_lines: "944"
            quote: |-
              The TestResult is then appended to the contents of `fooly.apk.intoto.jsonl`
            status: "example"
          - at: "§9.4.3"
            source_lines: "957"
            quote: |-
              and appending that to the contents of `fooly.apk.intoto.jsonl`.
            status: "example"
        constrained_by: []
        on_error: "unspecified by source (§9.4.2, §9.4.3)"
        on_error_basis: "unspecified"
        note: >-
          Only the §9.4 example appends; no sentence of §9.1 to §9.3 describes adding to an
          existing Bundle. L944 calls the appended vulnerability scan a TestResult (SD-09).
        source_defects:
          - "SD-09"
      - n: "4"
        from: "producer"
        to: "storage"
        message: "Bundle"
        action: >-
          Store it under the media type application/vnd.in-toto.bundle (SHOULD). The media type
          names no encoding, because a Bundle MUST be JSON lines and each attestation's encoding
          SHOULD be indicated at the Envelope layer, and SHOULD NOT name a predicate type,
          because the lines may differ.
        short: "store as application/vnd.in-toto.bundle (SHOULD)"
        locator: "§9.3"
        kind: "stated"
        quotes:
          - at: "§9.3"
            source_lines: "903-904"
            quote: |-
              The media type `application/vnd.in-toto.bundle` SHOULD be used to denote a Bundle in arbitrary storage systems.
            status: "spec"
          - at: "§9.3"
            source_lines: "906-908"
            quote: |-
              The media type for a Bundle does not indicate an encoding since Bundles MUST be encoded as JSON lines, and the encoding of each attestation within the Bundle SHOULD be indicated at the [Envelope] layer.
            status: "spec"
          - at: "§9.3"
            source_lines: "909-911"
            quote: |-
              The predicate type of individual attestations within the stored Bundle SHOULD NOT be indicated in the media type for the Bundle, as a bundle may contain attestations with different predicate types.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0081"
          - "in-toto-attestation-v1#R-0121"
          - "in-toto-attestation-v1#R-0122"
          - "in-toto-attestation-v1#R-0123"
          - "in-toto-attestation-v1#R-0083"
        on_error: "unspecified by source (§9.3)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "producer"
        to: "storage"
        message: "Bundle"
        action: >-
          Before publishing, remove the attestations that are not to be published and publish
          the rest.
        short: "filter lines, publish the rest (example)"
        locator: "§9.4.5"
        kind: "stated"
        quotes:
          - at: "§9.4.5"
            source_lines: "979-981"
            quote: |-
              The CI/CD system then iterates through all the attestations, removing the attestation with `predicateType=https://fooly.app/Builder/v1` and publishes to their website:
            status: "example"
        constrained_by: []
        on_error: "unspecified by source (§9.4.5)"
        on_error_basis: "unspecified"
        note: >-
          Example only (§9.4.5). The published lines in L984-986 do not reproduce the retained
          lines of L960-963 byte for byte (SD-07). A consumer cannot tell this deliberate
          deletion from a deletion attack (EP-11).
        source_defects:
          - "SD-07"
    diagram: "protocol.md#f05-bundle-assembly"
  - id: "F06"
    name: "bundle-consumption"
    title: "Consumer processes a Bundle line by line"
    kind: "receive-processing"
    participants:
      - "storage"
      - "consumer"
      - "policy-engine"
    summary: >-
      Every Bundle rule binds the consumer: parse each line separately, ignore what is not
      recognized, never depend on line order. Ignoring is the only outcome the source gives; a
      Bundle as a whole is never rejected. The validation model covers one attestation and says
      multiple attestations are not yet explained (L1120), so running it per line and handing
      the surviving outputs to the policy engine is this model's (steps 4 and 7, inferred).
      §9.5's grep and jq example is a person reading a Bundle, not a consumer procedure.
    steps:
      - n: "1"
        from: "storage"
        to: "consumer"
        message: "Bundle"
        action: "Retrieve the Bundle, stored under application/vnd.in-toto.bundle."
        short: "retrieve the Bundle [inferred]"
        locator: "§9.3"
        kind: "inferred"
        inferred: true
        inferred_reason: "§9.3 names the media type a Bundle is stored under; no retrieval is defined."
        quotes:
          - at: "§9.3"
            source_lines: "903-904"
            quote: |-
              The media type `application/vnd.in-toto.bundle` SHOULD be used to denote a Bundle in arbitrary storage systems.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0081"
        on_error: "unspecified by source (§9.3)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "consumer"
        to: "consumer"
        message: "Bundle"
        action: >-
          Download and parse each line separately (MUST) to obtain authenticated predicate
          information.
        short: "parse each line separately (MUST)"
        locator: "§9.3"
        kind: "stated"
        quotes:
          - at: "§9.3"
            source_lines: "912-913"
            quote: |-
              To obtain predicate information that is authenticated, consumers MUST download and parse each line in a Bundle separately.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0084"
          - "in-toto-attestation-v1#R-0176"
        on_error: "unspecified by source (§9.3)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "consumer"
        to: "consumer"
        message: "Bundle"
        action: "Ignore unrecognized lines (MUST); a line SHOULD be an Envelope."
        short: "ignore unrecognized lines (MUST)"
        locator: "§9.1"
        kind: "stated"
        quotes:
          - at: "§9.1"
            source_lines: "880-881"
            quote: |-
              Consumers MUST ignore unrecognized lines.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0075"
          - "in-toto-attestation-v1#R-0074"
        on_error: "ignore the line; the Bundle is not rejected"
        on_error_basis: "stated"
      - n: "4"
        from: "consumer"
        to: "consumer"
        message: "Envelope"
        action: "Validate each Envelope line as one attestation about the artifact (F03, M01)."
        short: "validate each Envelope line (F03) [inferred]"
        locator: "§12 L1116-1117, §12 L1120"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          §12 describes one artifact and one attestation and leaves multiple attestations
          unexplained (L1120); §9 never refers to §12.
        quotes:
          - at: "§12"
            source_lines: "1116-1117"
            quote: |-
              The following pseudocode shows how to verify and extract metadata about a single artifact from a single attestation.
            status: "docs-pseudocode"
          - at: "§12"
            source_lines: "1120"
            quote: |-
              Explain how to process multiple artifacts and/or multiple attestations.
            status: "docs-pseudocode"
        constrained_by:
          - "in-toto-attestation-v1#R-0084"
          - "in-toto-attestation-v1#R-0186"
        on_error: >-
          a line F03 rejects is ignored, not a Bundle failure (inferred from step 5's rule)
        on_error_basis: "inferred"
        source_defects:
          - "SD-10"
      - n: "5"
        from: "consumer"
        to: "consumer"
        message: "Envelope"
        also_messages:
          - "Statement"
          - "Predicate"
        action: >-
          Ignore attestations with unrecognized keys, types, subjects or predicates (MUST).
        short: "ignore unrecognized keys, types, subjects, predicates (MUST)"
        locator: "§9.1"
        kind: "stated"
        quotes:
          - at: "§9.1"
            source_lines: "882-883"
            quote: |-
              Consumers MUST ignore attestations with unrecognized keys, types, subjects, or predicates.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0076"
        on_error: "ignore the attestation"
        on_error_basis: "stated"
      - n: "6"
        from: "consumer"
        to: "consumer"
        message: "Bundle"
        action: >-
          Process the lines so that the result does not depend on their order (MUST NOT depend).
        short: "result independent of line order (MUST NOT depend)"
        locator: "§9.1"
        kind: "stated"
        quotes:
          - at: "§9.1"
            source_lines: "884"
            quote: |-
              - Processing of a Bundle MUST NOT depend on the order of the attestations.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0077"
        on_error: "unspecified by source (§9.1)"
        on_error_basis: "unspecified"
      - n: "7"
        from: "consumer"
        to: "policy-engine"
        message: "Predicate"
        data:
          - "matchedSubjects"
          - "attesterNames"
        action: >-
          Hand every surviving output to the policy engine; predicate types the engine does not
          understand are ignored.
        short: "feed surviving outputs to the policy engine [inferred]"
        locator: "§9.4.4"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          §9.4.4 shows a policy engine given a whole Bundle and ignoring one predicate type; how
          outputs of several attestations are combined is not stated anywhere.
        quotes:
          - at: "§9.4.4"
            source_lines: "968-970"
            quote: |-
              Just prior to deployment the CI/CD system checks `fooly.apk` with a policy engine (providing `fooly.apk.intoto.jsonl` as it does so) to ensure the app is safe to publish.
            status: "example"
          - at: "§9.4.4"
            source_lines: "970-971"
            quote: |-
              The policy engine used doesn't understand `predicateType=https://spdx.dev/Document`, so it is ignored.
            status: "example"
        constrained_by:
          - "in-toto-attestation-v1#R-0076"
          - "in-toto-attestation-v1#R-0216"
        on_error: "unspecified by source (§9.4.4)"
        on_error_basis: "unspecified"
        source_defects:
          - "SD-10"
    diagram: "protocol.md#f06-bundle-consumption"
  - id: "F07"
    name: "envelope-storage"
    title: "A single Envelope stored as a file or in a storage system, and read back"
    kind: "creation-and-delivery"
    participants:
      - "producer"
      - "storage"
      - "consumer"
    summary: >-
      Naming and labelling conventions for an Envelope stored on its own. The file name follows
      the supply chain step, or an agreed name, plus the truncated KEYID when several
      functionaries sign separately; in a storage system the media type names the predicate.
      Neither is authenticated: the consumer SHOULD NOT rely on the media type and MUST verify
      the payload (step 4).
    steps:
      - n: "1"
        from: "producer"
        to: "producer"
        message: "Envelope"
        action: >-
          An Envelope stored in a dedicated file by itself, not in a Bundle, uses the suffix
          .json (SHOULD).
        short: "dedicated file uses suffix .json (SHOULD)"
        locator: "§8.3"
        kind: "stated"
        quotes:
          - at: "§8.3"
            source_lines: "802-803"
            quote: |-
              If stored in a dedicated file by itself, and not as part of a [Bundle], an Envelope SHOULD use the suffix `.json`.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0064"
        on_error: "unspecified by source (§8.3)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "producer"
        to: "producer"
        message: "Envelope"
        fields:
          - "keyid"
        action: >-
          Name it <step-name>.json when it is for in-toto-verify (SHOULD); otherwise producer
          and consumer MAY agree on <env-name>.json; when several functionaries identified by
          public key produce Envelopes for one step, add the signer's truncated KEYID:
          <step/env-name>.<keyid[0:8]>.json (SHOULD).
        short: "name {step-name}.json, {env-name}.json, or with .{keyid[0:8]} (SHOULD)"
        locator: "§8.3"
        kind: "stated"
        quotes:
          - at: "§8.3"
            source_lines: "805-807"
            quote: |-
              For attestations intended for consumption by [in-toto-verify], an Envelope containing an attestation about a particular software supply chain step `<step-name>` SHOULD be named `<step-name>.json`.
            status: "spec"
          - at: "§8.3"
            source_lines: "809-810"
            quote: |-
              the attestation producer and consumer MAY agree on an arbitrary filename: `<env-name>.json`.
            status: "spec"
          - at: "§8.3"
            source_lines: "811-814"
            quote: |-
              If multiple Envelopes are produced for the same step by different [functionaries] uniquely identified by a public key, an Envelope name SHOULD include the truncated [KEYID] of the public key `<keyid[0:8]>` of the signing functionary: `<step/env-name>.<keyid[0:8]>.json`.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0065"
          - "in-toto-attestation-v1#R-0066"
          - "in-toto-attestation-v1#R-0067"
        on_error: "unspecified by source (§8.3)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "producer"
        to: "storage"
        message: "Envelope"
        action: >-
          In an arbitrary storage system, denote it with the media type
          application/vnd.in-toto.<predicate>+dsse (SHOULD), <predicate> being the predicate
          specification's filename without its extension (MUST).
        short: "label application/vnd.in-toto.{predicate}+dsse (SHOULD)"
        locator: "§8.4, §8.4.1"
        kind: "stated"
        quotes:
          - at: "§8.4"
            source_lines: "818-819"
            quote: |-
              The media type `application/vnd.in-toto.<predicate>+dsse` SHOULD be used to denote an individual attestation in arbitrary storage systems.
            status: "spec"
          - at: "§8.4"
            source_lines: "821-822"
            quote: |-
              The `<predicate>` MUST match the [predicate specification filename] without the file extension.
            status: "spec"
          - at: "§8.4.1"
            source_lines: "834-836"
            quote: |-
              - SLSA Provenance: `application/vnd.in-toto.provenance+dsse` - SPDX: `application/vnd.in-toto.spdx+dsse` - VSA: `application/vnd.in-toto.vsa+dsse`
            status: "example"
        constrained_by:
          - "in-toto-attestation-v1#R-0068"
          - "in-toto-attestation-v1#R-0069"
          - "in-toto-attestation-v1#R-0175"
        on_error: "unspecified by source (§8.4, §8.4.1)"
        on_error_basis: "unspecified"
        note: "The SPDX example at L835 names no existing predicate specification file (SD-08)."
        source_defects:
          - "SD-08"
      - n: "4"
        from: "storage"
        to: "consumer"
        message: "Envelope"
        action: >-
          Read it back without trusting the media type as the predicate type (SHOULD NOT rely;
          rely only on predicateType, SHOULD), and parse the payload and verify it against its
          signatures (MUST), i.e. run F03.
        short: "do not trust the label, verify the payload (MUST) then F03"
        locator: "§8.4"
        kind: "stated"
        quotes:
          - at: "§8.4"
            source_lines: "824-826"
            quote: |-
              Consumers SHOULD NOT rely upon the media type for individual attestations as faithful indicators of predicate type. Consumer SHOULD only rely on the `predicateType` field in the [Statement] layer.
            status: "spec"
          - at: "§8.4"
            source_lines: "827-828"
            quote: |-
              To obtain predicate information that is authenticated, consumers MUST parse the Envelope's `payload`, and verify it against its `signatures`.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0070"
          - "in-toto-attestation-v1#R-0071"
          - "in-toto-attestation-v1#R-0072"
        on_error: "unspecified by source (§8.4)"
        on_error_basis: "unspecified"
        note: "How the consumer finds or retrieves the file is not stated."
    diagram: "protocol.md#f07-envelope-storage"
  - id: "F08"
    name: "fooly-pipeline"
    title: "The §9.4 example: build, scan, SBOM, policy check, deploy, publish"
    kind: "example"
    participants:
      - "fooly-builder"
      - "ci-cd-system"
      - "vulnerability-scanner"
      - "policy-engine"
      - "app-store"
      - "website"
    summary: >-
      The source's one end-to-end scenario, non-normative. Three producers add Envelopes to one
      Bundle; a policy engine checks the artifact against the whole Bundle before deployment and
      ignores a predicate type it does not understand; a filtered copy is published. It is the
      only scenario in the source with several parties acting in turn, and the only place it
      shows a Bundle changing over time (state-machine.yaml M03). The scanner's Envelope is not
      an in-toto Statement, which §12 would reject (SD-16).
    steps:
      - n: "1"
        from: "fooly-builder"
        to: "fooly-builder"
        message: "Bundle"
        also_messages:
          - "Statement"
          - "Envelope"
        action: >-
          Build fooly.apk, produce an SLSA Provenance and a more detailed Statement with
          predicateType https://fooly.app/Builder/v1, and place both signed attestations in a
          new file fooly.apk.intoto.jsonl (two lines).
        short: "build, two signed attestations into a new fooly.apk.intoto.jsonl"
        locator: "§9.4.1"
        kind: "stated"
        quotes:
          - at: "§9.4.1"
            source_lines: "923-928"
            quote: |-
              The Fooly builder builds the app (`fooly.apk` with hash `aaa...`) and produces a generic [SLSA Provenance]. The Fooly builder also produces a more detailed attestation that contains all the logs of the build as an in-toto [Statement] with `predicateType=https://fooly.app/Builder/v1`. The builder places _both_ of these signed attestations in a new file named `fooly.apk.intoto.jsonl`.
            status: "example"
          - at: "§9.4.1"
            source_lines: "931-932"
            quote: |-
              { "payloadType": "application/vnd.in-toto.provenance+json", "payload": "a...", "signatures": [w...] } { "payloadType": "application/vnd.in-toto+json", "payload": "b...", "signatures": [w...] }
            status: "example"
        constrained_by: []
        on_error: "unspecified by source (§9.4.1)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "ci-cd-system"
        to: "vulnerability-scanner"
        message: "none"
        message_note: "no message: the request is not defined"
        action: "Request a third-party vulnerability scan of fooly.apk."
        short: "request a third-party scan"
        locator: "§9.4.2"
        kind: "stated"
        quotes:
          - at: "§9.4.2"
            source_lines: "937-938"
            quote: |-
              The CI/CD system then requests a third-party vulnerability scan on `fooly.apk`.
