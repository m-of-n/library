      - "F06.7"
      - "M02.T03"
      - "M02.T04"
      - "M02.T05"
      - "M02.T08"
  - id: "SD-11"
    normative_sd: "SD-8"
    kind: "gap"
    where: "§12; §3.2 L191, L212"
    text: >-
      §12 never checks that predicateType is present or that every subject has a digest, both
      required by §3.2, so its output may carry an absent predicateType.
    quotes:
      - at: "§3.2"
        source_lines: "212"
        quote: |-
          `predicateType` _string ([TypeURI]), required_
        status: "spec"
      - at: "§3.2"
        source_lines: "190-191"
        quote: |-
          Set of software artifacts that the attestation applies to. Each element > represents a single software artifact. Each element MUST have `digest` set.
        status: "spec"
      - at: "§12"
        source_lines: "1159"
        quote: |-
          - `statement.predicateType`
        status: "docs-pseudocode"
    affects:
      - "F03.S4"
      - "F03.O"
      - "M01.T16"
  - id: "SD-12"
    normative_sd: "SD-8"
    kind: "tension"
    where: "§12 L1125, L1138-1140 vs §8.1.1 L763-764"
    text: >-
      §8 admits non-DSSE envelopes such as COSE_Sign; §12 takes a JSON-encoded Envelope and
      reads signature.sig and signature.keyid, the field names of DSSE's JSON envelope (record
      secure-systems-lab-dsse), so it does not cover them.
    quotes:
      - at: "§12"
        source_lines: "1125"
        quote: |-
          - `attestation`: JSON-encoded [Envelope]
        status: "docs-pseudocode"
      - at: "§8.1.1"
        source_lines: "763-764"
        quote: |-
          The [COSE_Sign] structure is [ITE-5] compliant, whereas the `COSE_Sign1` format that supports only one signer is NOT compliant.
        status: "spec"
    affects:
      - "F03.0"
      - "M01"
  - id: "SD-13"
    normative_sd: "SD-22"
    kind: "tension"
    where: "§8.2 L776-777 vs L798; §12 L1147"
    text: >-
      In the general requirements payload is a SHOULD, which admits an Envelope without one; the
      DSSE requirement makes it a MUST and §12 decodes it unconditionally. Processing of an
      Envelope without payload is undefined.
    quotes:
      - at: "§8.2"
        source_lines: "776-777"
        quote: |-
          `payload` (or equivalent) SHOULD be included and contain the in-toto [Statement] that was signed.
        status: "spec"
      - at: "§8.2"
