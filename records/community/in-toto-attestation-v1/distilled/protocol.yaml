  - id: "F02"
    name: "envelope-signing"
    title: "Producer wraps the Statement in an Envelope and signs it"
    kind: "creation-and-delivery"
    participants:
      - "producer"
      - "storage"
    summary: >-
      The Envelope layer handles serialization and authentication. DSSE v1.0 is the RECOMMENDED
      format; any other format meeting ITE-5 MAY be used. §8.2 fixes the general fields
      (signatures, keyid, payload, payloadType) and the DSSE-specific values (payloadType, a
      base64 payload). What bytes are signed is DSSE's, not this source's (step 4a, inferred).
      Delivery to a consumer is not defined (step 6, inferred).
    steps:
      - n: "1"
        from: "producer"
        to: "producer"
        message: "Envelope"
        action: >-
          Choose the envelope format: DSSE v1.0 (RECOMMENDED) or another signature method and
          format meeting ITE-5 (MAY), which MUST support several signatures in one envelope,
          SHOULD authenticate the payload type, SHOULD avoid depending on canonicalization,
          SHOULD support a KEYID hint, SHOULD NOT make the verifier parse the payload before
          verification and SHOULD NOT require key algorithms in the signature. COSE_Sign meets
          ITE-5; COSE_Sign1 and the Sigstore Bundle (one signature only) do not.
        short: "choose DSSE v1.0 (RECOMMENDED) or an ITE-5 format (MAY)"
        locator: "§8.1, §8.1.1"
        kind: "stated"
        quotes:
          - at: "§8.1"
            source_lines: "748"
            quote: |-
              The RECOMMENDED format and protocol for Envelopes are defined per [DSSE v1.0].
            status: "spec"
          - at: "§8.1"
            source_lines: "749-750"
            quote: |-
              Producers MAY use other signature methods and formats that meet the [ITE-5] specification:
            status: "spec"
          - at: "§8.1"
            source_lines: "752"
            quote: |-
              MUST support the inclusion of multiple signatures in a single envelope
            status: "spec"
          - at: "§8.1.1"
            source_lines: "761-762"
            quote: |-
              The [Sigstore Bundle], while [supporting DSSE], is not currently [ITE-5] compliant because it requires a _single signature_ in the envelope.
            status: "spec"
          - at: "§8.1.1"
            source_lines: "763-764"
            quote: |-
              The [COSE_Sign] structure is [ITE-5] compliant, whereas the `COSE_Sign1` format that supports only one signer is NOT compliant.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0044"
          - "in-toto-attestation-v1#R-0045"
          - "in-toto-attestation-v1#R-0046"
          - "in-toto-attestation-v1#R-0047"
          - "in-toto-attestation-v1#R-0048"
          - "in-toto-attestation-v1#R-0049"
          - "in-toto-attestation-v1#R-0050"
          - "in-toto-attestation-v1#R-0051"
          - "in-toto-attestation-v1#R-0167"
          - "in-toto-attestation-v1#R-0168"
        on_error: "unspecified by source (§8.1, §8.1.1)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "producer"
        to: "producer"
        message: "Envelope"
        fields:
          - "payloadType"
        action: >-
          Set payloadType to application/vnd.in-toto+json, or to the predicate-specific
          application/vnd.in-toto.<predicate>+json, where <predicate> MUST be the predicate
          specification's filename without its extension. The predicate version is not in the
          media type. The general requirement of §8.2 (the form
          application/vnd.in-toto+<encoding>, MUST) does not admit the predicate-specific value
          (SD-06).
        short: "payloadType = vnd.in-toto+json or vnd.in-toto.{predicate}+json (MUST)"
        locator: "§8.2"
        kind: "stated"
        quotes:
          - at: "§8.2"
            source_lines: "785-786"
            quote: |-
              `payloadType` MUST be set to `application/vnd.in-toto.<predicate>+json` or to `application/vnd.in-toto+json`.
            status: "spec"
          - at: "§8.2"
            source_lines: "786-787"
            quote: |-
              This indicates that the Envelope contains a JSON object with a `_type` field specifying its schema.
            status: "spec"
          - at: "§8.2"
            source_lines: "789-790"
            quote: |-
              `<predicate>` MUST match the [predicate specification filename] without the file extension.
            status: "spec"
          - at: "§8.2"
            source_lines: "796-797"
            quote: |-
              The predicate version is not specified in the media type; it is handled in the [Statement] layer.
            status: "spec"
          - at: "§8.2"
            source_lines: "779-780"
            quote: |-
              It MUST take the form `application/vnd.in-toto+<encoding>` to indicate an in-toto [Statement] payload and its serialized `<encoding>` format.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0057"
          - "in-toto-attestation-v1#R-0058"
          - "in-toto-attestation-v1#R-0059"
          - "in-toto-attestation-v1#R-0169"
          - "in-toto-attestation-v1#R-0171"
          - "in-toto-attestation-v1#R-0172"
          - "in-toto-attestation-v1#R-0173"
          - "in-toto-attestation-v1#R-0174"
          - "in-toto-attestation-v1#R-0213"
        on_error: >-
          unspecified by source (§8.2); a consumer running §12 rejects at F03 step S1, which as
          written rejects every value (SD-01)
        on_error_basis: "unspecified"
        source_defects:
          - "SD-01"
          - "SD-06"
      - n: "3"
        from: "producer"
        to: "producer"
        message: "Envelope"
        fields:
          - "payload"
        action: >-
          Set payload to the JSON Statement, base64-encoded (MUST for DSSE); in the general
          requirements payload SHOULD be included and contain the Statement that was signed.
        short: "payload = base64(JSON Statement) (MUST)"
        locator: "§8.2"
        kind: "stated"
        quotes:
          - at: "§8.2"
            source_lines: "798"
            quote: |-
              `payload` MUST be a base64-encoded JSON [Statement].
            status: "spec"
          - at: "§8.2"
            source_lines: "776-777"
            quote: |-
              `payload` (or equivalent) SHOULD be included and contain the in-toto [Statement] that was signed.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0055"
          - "in-toto-attestation-v1#R-0063"
        on_error: "unspecified by source (§8.2)"
        on_error_basis: "unspecified"
        source_defects:
          - "SD-13"
      - n: "4"
        from: "producer"
        to: "producer"
        message: "Envelope"
        fields:
          - "signatures"
          - "keyid"
        action: >-
          Sign with each signing key, payloadType together with payload (MUST), and place the
          signatures in an array (signatures REQUIRED, MUST be an array; the encoding of the
          signature bytes is the envelope schema's). Include a keyid for each signing key
          (SHOULD), which the schema MAY nest in the signature array.
        short: "sign payloadType with payload (MUST), signatures[] with keyid (SHOULD)"
        locator: "§8.2"
        kind: "stated"
        quotes:
          - at: "§8.2"
            source_lines: "778"
            quote: |-
              `payloadType` (or equivalent) MUST be signed along with the `payload`.
            status: "spec"
          - at: "§8.2"
            source_lines: "771-773"
            quote: |-
              `signatures` (or equivalent) is REQUIRED and MUST be defined as an array of digital signatures. The encoding of the signature bytes is determined by the envelope schema.
            status: "spec"
          - at: "§8.2"
            source_lines: "774-775"
            quote: |-
              A `keyid` (or equivalent) SHOULD be included for each signing key used. The envelope schema MAY nest this field within the signature array.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0117"
          - "in-toto-attestation-v1#R-0118"
          - "in-toto-attestation-v1#R-0053"
          - "in-toto-attestation-v1#R-0054"
          - "in-toto-attestation-v1#R-0056"
          - "in-toto-attestation-v1#R-0170"
        on_error: "unspecified by source (§8.2)"
        on_error_basis: "unspecified"
      - n: "4a"
        from: "producer"
        to: "producer"
        message: "Envelope"
        fields:
          - "payloadType"
          - "payload"
          - "signatures"
        action: >-
          Compute the signing input DSSE defines (its pre-authentication encoding of payloadType
          and payload) and sign that, once per key.
        short: "sign the DSSE signing input [inferred]"
        locator: "§8.1, §8.2"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          §8.1 delegates the format and protocol to DSSE v1.0 (L748) and §8.2 requires only that
          payloadType is signed along with the payload (L778). Which bytes are signed is DSSE's
          definition (record secure-systems-lab-dsse), not stated in this source.
        quotes:
          - at: "§8.1"
            source_lines: "748"
            quote: |-
              The RECOMMENDED format and protocol for Envelopes are defined per [DSSE v1.0].
            status: "spec"
          - at: "§8.2"
            source_lines: "778"
            quote: |-
              `payloadType` (or equivalent) MUST be signed along with the `payload`.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0044"
          - "in-toto-attestation-v1#R-0056"
          - "in-toto-attestation-v1#R-0209"
          - "in-toto-attestation-v1#R-0211"
        on_error: "unspecified by source (§8.1, §8.2)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "producer"
        to: "producer"
        message: "Envelope"
        fields:
          - "signatures"
        action: >-
          When several functionaries attest the same step: the envelope format MUST be able to
          carry several signatures; where functionaries identified by public key each produce
          their own Envelope for one step, each Envelope's name SHOULD include the truncated
          KEYID of the signing key (F07 step 2).
        short: "several signers: one Envelope, many signatures, or one Envelope per KEYID"
        locator: "§8.1, §8.3"
        kind: "stated"
        quotes:
          - at: "§8.1"
            source_lines: "752"
            quote: |-
              MUST support the inclusion of multiple signatures in a single envelope
            status: "spec"
          - at: "§8.3"
            source_lines: "811-814"
            quote: |-
              If multiple Envelopes are produced for the same step by different [functionaries] uniquely identified by a public key, an Envelope name SHOULD include the truncated [KEYID] of the public key `<keyid[0:8]>` of the signing functionary: `<step/env-name>.<keyid[0:8]>.json`.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0046"
          - "in-toto-attestation-v1#R-0067"
        on_error: "unspecified by source (§8.1, §8.3)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "producer"
        to: "storage"
        message: "Envelope"
        action: >-
          Hand the Envelope on: as a dedicated file (F07), as one line of a Bundle (F05), or
          into a storage system under a media type (F07). No transport, request or
          acknowledgement is defined.
        short: "store or deliver the Envelope (file, Bundle line, storage) [inferred]"
        locator: "§8.3, §8.4, §9.1"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
