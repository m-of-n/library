      - "F08.4"
  - id: "SD-09"
    normative_sd: "SD-24"
    kind: "defect"
    where: "§9.4.2 L944"
    text: >-
      The attestation appended after the vulnerability scan is called the TestResult; the
      section describes a vulnerability scan result in a custom payload, not a test result.
    quotes:
