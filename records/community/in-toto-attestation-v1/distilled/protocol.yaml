            source_lines: "664-666"
            quote: |-
              A TypeURI is represented as a case sensitive _string_ and MUST be case normalized as per section 6.2.2.1 of RFC 3986, meaning that the scheme and authority MUST be in lowercase.
            status: "spec"
          - at: "§6.2"
            source_lines: "668-669"
            quote: |-
              SHOULD resolve to a human-readable description, but MAY be unresolvable. > SHOULD include a version number to allow for revisions.
            status: "spec"
