  - id: "F09"
    name: "version-tolerant-parsing"
    title: "Consumer parses a type of another minor version"
    kind: "receive-processing"
    participants:
      - "consumer"
    summary: >-
      The versioning rules of §2.2 and §11 as a consumer applies them. The TypeURI carries only
      the major version and is compared as an opaque string; within a major version every
      message parses correctly as every other minor version; a different major version is a
      different TypeURI. The rules apply to the Statement and to predicates that opt in.
      state-machine.yaml M04 and M05 hold the same rules as lifecycles.
    steps:
      - n: "1"
        from: "consumer"
        to: "consumer"
        message: "Statement"
        also_messages:
          - "Predicate"
        fields:
          - "_type"
          - "predicateType"
        action: >-
          Recognize a type by its TypeURI, used as an opaque string; it reflects only the major
          version.
        short: "match the TypeURI as an opaque string"
        locator: "§2.2, §11.2"
        kind: "stated"
        quotes:
          - at: "§2.2"
            source_lines: "114-115"
            quote: |-
              Each type has a [SemVer2](https://semver.org) version number and the [TypeURI] reflects the major version number.
            status: "spec"
          - at: "§11.2"
            source_lines: "1088-1091"
            quote: |-
              The type ID only includes the major version. This allows implementations to support any major version without having to parse the URI to pull out the version. (Parsing is impossible since we don't mandate the format of the URI.) Implementations just use the URI as an opaque string.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0128"
          - "in-toto-attestation-v1#R-0184"
          - "in-toto-attestation-v1#R-0185"
        on_error: "unspecified by source (§2.2, §11.2)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "consumer"
        to: "consumer"
        message: "Statement"
        also_messages:
          - "Predicate"
        action: >-
          Parse a message of any minor or patch version of a recognized major as the version
          implemented: an older message means what it meant in its own version, a newer one what
          it means with its new fields removed (MUST).
        short: "parse across minor versions (MUST be semantically correct)"
        locator: "§11.2"
        kind: "stated"
        quotes:
          - at: "§11.2"
            source_lines: "1076-1077"
            quote: |-
              Any message MUST be semantically correct when parsed as any other version with the same major number.
            status: "spec"
          - at: "§11.2"
            source_lines: "1079-1080"
            quote: |-
              Parsing an older message as a newer minor/patch version MUST be semantically equivalent to parsing it as the original version.
            status: "spec"
          - at: "§11.2"
            source_lines: "1083-1084"
            quote: |-
              Parsing a newer message as an older minor/patch version MUST be semantically equivalent to parsing it as the newer version with all new fields removed.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0085"
          - "in-toto-attestation-v1#R-0086"
          - "in-toto-attestation-v1#R-0087"
          - "in-toto-attestation-v1#R-0129"
          - "in-toto-attestation-v1#R-0182"
          - "in-toto-attestation-v1#R-0183"
          - "in-toto-attestation-v1#R-0179"
        on_error: "unspecified by source (§11.2)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "consumer"
        to: "consumer"
        message: "Statement"
        also_messages:
          - "Predicate"
        action: >-
          Ignore unrecognized fields (MUST, unless the predicate specification says otherwise):
          this is what makes newer minor versions and extension fields safe to parse.
        short: "ignore unrecognized fields (MUST)"
        locator: "§2.2"
        kind: "stated"
        quotes:
          - at: "§2.2"
            source_lines: "109-112"
            quote: |-
              Consumers MUST ignore unrecognized fields unless otherwise noted in the predicate specification. This is to allow minor version upgrades and extension fields. Ignoring fields is safe due to the monotonic principle.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0001"
          - "in-toto-attestation-v1#R-0197"
        on_error: "unspecified by source (§2.2)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "consumer"
        to: "consumer"
        message: "Statement"
        also_messages:
          - "Predicate"
        fields:
          - "_type"
          - "predicateType"
        action: >-
          Treat a TypeURI of another major version as unrecognized: §12 rejects a Statement
          whose _type is not Statement/v1, and in a Bundle an attestation with an unrecognized
          type or predicate is ignored.
        short: "other major version = unrecognized type [inferred]"
        locator: "§1.1.1, §12 L1149, §9.1"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source says a major version changes the TypeURI (L114-115, L1088) and that §12
          rejects any other Statement _type (L1149); what a consumer does with an unknown major
          version of a predicate outside a Bundle is not stated.
        quotes:
          - at: "§1.1.1"
            source_lines: "57-59"
            quote: |-
              Tagged release v2.0.0 (MAJOR version) changes the meaning of the `predicateType` field. A new `v2` directory is added to `/spec` and the `_type` of a `Statement` becomes `https://in-toto.io/Statement/v2`.
            status: "example"
          - at: "§12"
            source_lines: "1149"
            quote: |-
              Reject if `statement.type` != `https://in-toto.io/Statement/v1`
            status: "docs-pseudocode"
          - at: "§9.1"
            source_lines: "882-883"
            quote: |-
              Consumers MUST ignore attestations with unrecognized keys, types, subjects, or predicates.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0076"
          - "in-toto-attestation-v1#R-0131"
          - "in-toto-attestation-v1#R-0199"
        on_error: "reject (Statement, §12) or ignore (Bundle, §9.1)"
        on_error_basis: "inferred"
    diagram: "protocol.md#f09-version-tolerant-parsing"
  - id: "F10"
    name: "type-governance"
    title: "Predicate types and extension fields: choosing, vetting, documenting, versioning"
    kind: "exchange"
    participants:
      - "predicate-author"
      - "maintainers"
      - "producer"
    summary: >-
      The only steps in which a party addresses the in-toto attestation maintainers. Both are
      MAY: vetting a new predicate type and documenting extension fields. TypeURIs are not
      registered; URI namespacing prevents collisions. Versioning a type is a decision the
      predicate author takes under §11's rules (state-machine.yaml M04).
    steps:
      - n: "1"
        from: "predicate-author"
        to: "predicate-author"
        message: "Predicate"
        fields:
          - "predicateType"
        action: "Choose an existing predicate type that fits, or develop a new one if none does."
        short: "choose an existing predicate type or develop one"
        locator: "§7.2"
        kind: "stated"
        quotes:
          - at: "§7.2"
            source_lines: "725-726"
            quote: |-
              Users are expected to choose an [existing predicate type] that fits their needs, or develop a new one if no existing one satisfies.
            status: "spec"
        constrained_by: []
        on_error: "unspecified by source (§7.2)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "predicate-author"
        to: "maintainers"
        message: "Predicate"
        message_note: "the vetting process and its outcome are not defined"
        fields:
          - "predicateType"
        action: >-
          Optionally have a new predicate type vetted by the in-toto attestation maintainers
          (MAY). No registration exists: URI namespacing is what prevents collisions.
        short: "new predicate type MAY be vetted"
        locator: "§7.2, §6.2"
        kind: "stated"
        quotes:
          - at: "§7.2"
            source_lines: "727"
            quote: |-
              New predicate types MAY be vetted by the in-toto attestation maintainers.
            status: "spec"
          - at: "§6.2"
            source_lines: "671-672"
            quote: |-
              TypeURIs are not registered. The natural namespacing of URIs is sufficient > to prevent collisions.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0043"
          - "in-toto-attestation-v1#R-0116"
          - "in-toto-attestation-v1#R-0165"
        on_error: "unspecified by source (§7.2, §6.2)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "producer"
        to: "maintainers"
        message: "none"
        message_note: "no message: a repository issue or pull request"
        action: >-
          Optionally file an issue or pull request documenting the extension fields in use
          (MAY).
        short: "document extension fields by issue or PR (MAY)"
        locator: "§2.2"
        kind: "stated"
        quotes:
          - at: "§2.2"
            source_lines: "123-124"
            quote: |-
              Producers MAY file an issue/PR to document extension fields they're using.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0004"
        on_error: "unspecified by source (§2.2)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "predicate-author"
        to: "predicate-author"
        message: "Predicate"
        fields:
          - "predicateType"
        action: >-
          Version the type by SemVer: a change that follows the monotonic principle is a minor
          version under the same TypeURI; a change to an existing field's meaning, or a new
          field that changes another field's meaning, is a new major version and TypeURI (M04).
        short: "minor if monotonic, major (new TypeURI) if meaning changes"
        locator: "§2.2, §11.3"
        kind: "stated"
        quotes:
          - at: "§2.2"
            source_lines: "118"
            quote: |-
              Minor version changes always follow the monotonic principle.
            status: "spec"
          - at: "§11.3"
            source_lines: "1103-1105"
            quote: |-
              Provenance 2.0.0 (major version) adds a new `recipe.extraArgs` field. This is required because the meaning of `recipe` changes if `extraArgs` is present. Parsing it as 1.x.y will result in an incorrect interpretation.
            status: "example"
          - at: "§11.3"
            source_lines: "1107-1108"
            quote: |-
              Provenance 3.0.0 (major version) modifies the meaning of `builder.id`. This is required because an existing field was modified.
            status: "example"
        constrained_by:
          - "in-toto-attestation-v1#R-0180"
          - "in-toto-attestation-v1#R-0128"
          - "in-toto-attestation-v1#R-0130"
          - "in-toto-attestation-v1#R-0131"
          - "in-toto-attestation-v1#R-0181"
          - "in-toto-attestation-v1#R-0085"
          - "in-toto-attestation-v1#R-0086"
          - "in-toto-attestation-v1#R-0087"
          - "in-toto-attestation-v1#R-0178"
        on_error: "unspecified by source (§2.2, §11.3)"
        on_error_basis: "unspecified"
    diagram: "protocol.md#f10-type-governance"
  - id: "F11"
    name: "descriptor-resolution"
    title: >-
      Producer points at or inlines a resource; consumer resolves it and checks its digest
    kind: "creation-and-delivery"
    participants:
      - "producer"
      - "consumer"
      - "storage"
    summary: >-
      A ResourceDescriptor either points at a resource (uri, downloadLocation) or carries it
      (content). The source makes downloadLocation resolvable so that consumers can download
      automatically, and calls uri and mediaType hints for parsing content, so a consumer that
      follows a descriptor is implied; the download itself and the digest check after it are not
      described (steps 3 and 4, inferred). The §4.4 example points at another attestation, which
      a consumer would validate in turn (step 5, inferred).
    steps:
      - n: "1"
        from: "producer"
        to: "producer"
        message: "ResourceDescriptor"
        fields:
          - "uri"
          - "downloadLocation"
          - "digest"
        action: >-
          Describe the resource by pointer: uri, a ResourceURI (case normalized, MUST; it SHOULD
          resolve and MAY be unresolvable; purl or SPDX download locations RECOMMENDED),
          REQUIRED unless digest or content is set, and downloadLocation when the resource is
          elsewhere, which SHOULD be resolvable. A descriptor without content is a pointer.
        short: "pointer: uri (RFC 3986, case normalized), downloadLocation (SHOULD resolve)"
        locator: "§4.2, §4.3, §6.1"
        kind: "stated"
        quotes:
          - at: "§4.2"
            source_lines: "275-276"
            quote: |-
              A URI used to identify the resource or artifact globally. > This field is REQUIRED unless either `digest` or `content` is set.
            status: "spec"
          - at: "§4.2"
            source_lines: "303-304"
            quote: |-
              The location of the described resource or artifact, if different from the > `uri`.
            status: "spec"
          - at: "§4.2"
            source_lines: "306-307"
            quote: |-
              To enable automated downloads by consumers, the specified location SHOULD > be resolvable.
            status: "spec"
          - at: "§4.3"
            source_lines: "343-344"
            quote: |-
              A descriptor without a `content` field, is assumed to serve as a pointer to the resource/artifact.
            status: "spec"
          - at: "§6.1"
            source_lines: "645-647"
            quote: |-
              A ResourceURI is represented as a case sensitive _string_ and MUST be case normalized as per section 6.2.2.1 of RFC 3986, meaning that the scheme and authority MUST be in lowercase.
            status: "spec"
          - at: "§6.1"
            source_lines: "649"
            quote: |-
              SHOULD resolve to the artifact, but MAY be unresolvable.
            status: "spec"
          - at: "§6.1"
            source_lines: "649-651"
            quote: |-
              It is RECOMMENDED > to use [Package URL][] (`pkg:`) or [SPDX Download Location][] (e.g. > `git+https:`).
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0094"
          - "in-toto-attestation-v1#R-0100"
          - "in-toto-attestation-v1#R-0107"
          - "in-toto-attestation-v1#R-0108"
          - "in-toto-attestation-v1#R-0109"
          - "in-toto-attestation-v1#R-0110"
          - "in-toto-attestation-v1#R-0039"
          - "in-toto-attestation-v1#R-0146"
          - "in-toto-attestation-v1#R-0149"
          - "in-toto-attestation-v1#R-0164"
          - "in-toto-attestation-v1#R-0154"
          - "in-toto-attestation-v1#R-0095"
        on_error: "unspecified by source (§4.2, §4.3, §6.1)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "producer"
        to: "producer"
        message: "ResourceDescriptor"
        fields:
          - "content"
          - "mediaType"
          - "uri"
        action: >-
          Or carry it inline: content MAY be used where including the bytes is more efficient
          for consumers than a pointer, SHOULD be under 1KB, and is REQUIRED unless uri or
          digest is set; uri or mediaType MAY serve as hints for parsing it. A non-standard
          mediaType SHOULD use RFC 6838's x., prs. or vnd. prefixes.
        short: "inline: content under 1KB (SHOULD), uri or mediaType as parsing hints (MAY)"
        locator: "§4.2"
        kind: "stated"
        quotes:
          - at: "§4.2"
            source_lines: "289-290"
            quote: |-
              The contents of the resource or artifact. > This field is REQUIRED unless either `uri` or `digest` is set.
            status: "spec"
          - at: "§4.2"
            source_lines: "292-294"
            quote: |-
              The producer MAY use this field in scenarios where including the contents > of the resource/artifact directly in the attestation is deemed more > efficient for consumers than providing a pointer to another location.
            status: "spec"
          - at: "§4.2"
            source_lines: "294-295"
            quote: |-
              To > maintain size efficiency, the size of `content` SHOULD be less than 1KB.
            status: "spec"
          - at: "§4.2"
            source_lines: "297-299"
            quote: |-
              The `uri` or > `mediaType` MAY be used by the producer as hints for how consumers should > parse `content`.
            status: "spec"
          - at: "§4.2"
            source_lines: "313-316"
            quote: |-
              For resources or artifacts that do not have a standardized MIME type, > producers SHOULD follow [RFC 6838][] (Sections 3.2-3.4) conventions of > prefixing types with `x.`, `prs.`, or `vnd.` to avoid collisions with other > producers.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0097"
          - "in-toto-attestation-v1#R-0098"
          - "in-toto-attestation-v1#R-0099"
          - "in-toto-attestation-v1#R-0020"
          - "in-toto-attestation-v1#R-0101"
          - "in-toto-attestation-v1#R-0148"
          - "in-toto-attestation-v1#R-0203"
          - "in-toto-attestation-v1#R-0150"
        on_error: "unspecified by source (§4.2)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "consumer"
        to: "storage"
        message: "ResourceDescriptor"
        fields:
          - "downloadLocation"
          - "uri"
        action: >-
          Follow a pointer: fetch the resource from downloadLocation, or from uri when no
          separate location is given. Either may be unresolvable; nothing says what then.
        short: "fetch from downloadLocation or uri [inferred]"
        locator: "§4.2, §6.1"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source makes downloadLocation resolvable so that consumers can download
          automatically (L306-307); it defines no download and no outcome for an unresolvable
          location.
        quotes:
          - at: "§4.2"
            source_lines: "306-307"
            quote: |-
              To enable automated downloads by consumers, the specified location SHOULD > be resolvable.
            status: "spec"
          - at: "§6.1"
            source_lines: "649"
            quote: |-
              SHOULD resolve to the artifact, but MAY be unresolvable.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0100"
          - "in-toto-attestation-v1#R-0109"
          - "in-toto-attestation-v1#R-0110"
        on_error: "unspecified by source (§4.2, §6.1)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "consumer"
        to: "consumer"
        message: "DigestSet"
        also_messages:
          - "ResourceDescriptor"
        fields:
          - "digest"
        action: >-
          Check what was fetched (or the inline content) against the descriptor's DigestSet with
          §5.2.2's rules: only acceptable algorithms count, and any one acceptable entry that
          matches suffices.
        short: "match the bytes against digest, any acceptable entry [inferred]"
        locator: "§4.3, §5.2.2"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          §4.3 says the digest SHOULD match the resource the descriptor names and §5.2.2 how two
          DigestSets match; no sentence tells a consumer to digest what it fetched and compare.
        quotes:
          - at: "§4.3"
            source_lines: "337-340"
            quote: |-
              A descriptor that specifies a `digest` is assumed to refer to an immutable resource or artifact. The `digest` SHOULD match the resource or artifact specified in one of the `name`, `uri`, `content` or `downloadLocation` fields.
            status: "spec"
          - at: "§5.2.2"
            source_lines: "553-554"
            quote: |-
              Consumers MUST only accept algorithms that they consider secure and MUST ignore unrecognized or unaccepted algorithms.
            status: "spec"
          - at: "§5.2.2"
            source_lines: "557-558"
            quote: |-
              Two DigestSets SHOULD be considered matching if ANY acceptable field matches.
            status: "spec"
        constrained_by:
          - "in-toto-attestation-v1#R-0025"
          - "in-toto-attestation-v1#R-0105"
          - "in-toto-attestation-v1#R-0106"
          - "in-toto-attestation-v1#R-0034"
          - "in-toto-attestation-v1#R-0153"
          - "in-toto-attestation-v1#R-0204"
          - "in-toto-attestation-v1#R-0206"
          - "in-toto-attestation-v1#R-0147"
          - "in-toto-attestation-v1#R-0152"
        on_error: >-
          unspecified by source; by this model's reading a mismatch means the bytes are not the
          described resource (inferred)
        on_error_basis: "inferred"
      - n: "5"
        from: "consumer"
        to: "consumer"
        message: "Envelope"
        also_messages:
          - "ResourceDescriptor"
        fields:
          - "downloadLocation"
          - "mediaType"
        action: >-
          When the descriptor points at another attestation, as in the §4.4 example (mediaType
          application/x.dsse+json), validate the fetched Envelope as one (F03).
        short: "pointed-at attestation: validate it (F03) [inferred]"
        locator: "§4.4"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          §4.4 shows a descriptor pointing at another in-toto attestation; what a consumer does
          with it is not stated.
        quotes:
          - at: "§4.4"
            source_lines: "371"
            quote: |-
              Pointer to another in-toto attestation:
            status: "example"
          - at: "§4.4"
            source_lines: "377-378"
            quote: |-
              "downloadLocation": "http://example.com/rebuilderd-instance/gcc_9.3.0-1ubuntu2_amd64.intoto.json", "mediaType": "application/x.dsse+json"
            status: "example"
        constrained_by: []
        on_error: "unspecified by source (§4.4)"
        on_error_basis: "unspecified"
