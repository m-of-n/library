reconciliation: >
  ASVS is not a BCP 14 document. Its 345 requirements are the normative unit, each a "Verify that ..."
  sentence in lowercase prose (the standard says requirements are "must" by definition: What is the ASVS? ›
  Requirement). bin/bcp14-count finds exactly 11 upper-case keywords in the whole document, all in nine
  sentences of Appendix C (Cryptography Standards); those nine sentences are extracted as AppC-08..10, 12, 13,
  19..22 and carry all 11. The keyword counts therefore agree (11 = 11); the document's own baseline is the
  requirement count below, which was reconciled three ways.
note: >
  DOCUMENT BASELINE: 345 requirements (L1 70, L2 183, L3 92; cumulative L1=70, L2=253, L3=345) in
  17 chapters / 80 sections, identical in the JSON export, the CSV export and the markdown tables (id, chapter,
  section, description and level all equal, compared programmatically). Per chapter: V1 30, V2 13, V3 31, V4 16, V5 13, V6 47, V7 19, V8 13, V9 7, V10 36, V11 24, V12 12, V13 21, V14 13, V15 21, V16 17, V17 12.
  Ids: <record>#v5.0.0-<chapter>.<section>.<requirement>, the citation form the standard itself prescribes.
  Every requirement text is verbatim from the export (byte-equal to the markdown table cell). `level` is the
  lowest level at which the requirement applies; ASVS levels are cumulative so `levels` lists all.
  Also extracted, outside the 345: 27 framing statements (F-*) from "What is the ASVS?" and
  "Assessment and Certification"; 25 normative statements from Appendix C (AppC-*; AppC-24 and
  AppC-25 added by the verify pass of 2026-10-02); 48 prescriptive chapter-prose statements (P-*,
  added by the verify pass: lowercase must/shall/should sentences in the chapters' Control Objective
  and section introductions, e.g. "L2 applications must force the use of multi-factor authentication
  (MFA)." — not ASVS requirement rows, recorded so no normative sentence is dropped); 16
  non-mandatory Appendix D items (AppD-*), which include the SDL process items (secure SDLC, threat
  modeling) that ASVS 5.0 REMOVED from the requirement set.
  DERIVED (our classification, not the source's): actor, nature, phase, verification, expects_deliverables.
  nature=deliverable iff the requirement sits in a "... Documentation" section (the standard: documentation
  requirements are always in the first section of a chapter). phase: documentation -> design; V13 -> release;
  V15 requirements naming third-party components/SBOM -> supply-chain; others -> implementation.
  related_documentation_section is inferred from the requirement text referencing documentation.
  maps_to: v4.0.3 links are SOURCE-PUBLISHED (5.0/mappings/mapping_v5.0.0_to_v4.0.3.yml, kind stated; the raw
  value is kept verbatim in v4_0_3_mapping). CWE links are kind inferred: composed from the "just-in-case"
  v5.0.be CWE export through the be->5.0.0 id mapping; OWASP discontinued CWE mapping in 5.0 (For Users of 4.0 ›
  Moving Away from CWE) — use with care. No NIST SP 800-63 mapping exists for 5.0.0 ids (nist.md is keyed by
  v5.0.be ids and is not composed here).
