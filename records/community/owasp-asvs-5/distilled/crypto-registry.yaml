title: "ASVS 5.0.0 Appendix C — cryptographic mechanism approval tables"
source: "0x92-Appendix-C_Cryptography.md at tag v5.0.0_release (link syntax rendered to link text)"
status_legend:
  A: "Approved (A) mechanisms can be used in applications."
  L: "Legacy mechanisms (L) should not be used in applications but might still be used for compatibility with existing legacy applications or code onyly."
  D: "Disallowed mechanisms (D) must not be used because they are currently considered broken or do not provide sufficient security."
note: "Cells verbatim. One table per source table, in source order. <br> kept as in source. Supports V11 (Cryptography) requirements; AppC-* statements in requirements.yaml."
reviewed_by: ""
tables:
  - locator: "Appendix C › Equivalent Strengths of Cryptographic Parameters"
    columns:
      - "Security Strength"
      - "Symmetric Key Algorithms"
      - "Finite Field"
      - "Integer Factorisation"
      - "Elliptic Curve"
    rows:
      - Security Strength: "<= 80"
        Symmetric Key Algorithms: "2TDEA"
        Finite Field: "L = 1024 <br> N = 160"
        Integer Factorisation: "k = 1024"
        Elliptic Curve: "f = 160-223"
      - Security Strength: "112"
        Symmetric Key Algorithms: "3TDEA"
        Finite Field: "L = 2048 <br> N = 224"
        Integer Factorisation: "k = 2048"
        Elliptic Curve: "f = 224-255"
      - Security Strength: "128"
        Symmetric Key Algorithms: "AES-128"
        Finite Field: "L = 3072 <br> N = 256"
        Integer Factorisation: "k = 3072"
        Elliptic Curve: "f = 256-383"
      - Security Strength: "192"
        Symmetric Key Algorithms: "AES-192"
        Finite Field: "L = 7680 <br> N = 384"
        Integer Factorisation: "k = 7680"
        Elliptic Curve: "f = 384-511"
      - Security Strength: "256"
        Symmetric Key Algorithms: "AES-256"
        Finite Field: "L = 15360 <br> N = 512"
        Integer Factorisation: "k = 15360"
        Elliptic Curve: "f = 512+"
  - locator: "Appendix C › Random Values"
    columns:
      - "Name"
      - "Version/Reference"
      - "Notes"
      - "Status"
    rows:
      - Name: "`/dev/random`"
        Version/Reference: "Linux 4.8+ (Oct 2016), also found in iOS, Android, and other Linux-based POSIX operating systems. Based on RFC7539"
        Notes: "Utilizing ChaCha20 stream. Found in iOS `SecRandomCopyBytes`?language=objc) and Android `Secure Random` with the correct settings provided to each."
        Status: "A"
      - Name: "`/dev/urandom`"
        Version/Reference: "Linux kernel's special file for providing random data"
        Notes: "Provides high-quality, entropy sources from hardware randomness"
        Status: "A"
      - Name: "`AES-CTR-DRBG`"
        Version/Reference: "NIST SP800-90A"
        Notes: "As used in common implementations, such as Windows CNG API `BCryptGenRandom` set by `BCRYPT_RNG_ALGORITHM`."
        Status: "A"
      - Name: "`HMAC-DRBG`"
        Version/Reference: "NIST SP800-90A"
        Notes: ""
        Status: "A"
      - Name: "`Hash-DRBG`"
        Version/Reference: "NIST SP800-90A"
        Notes: ""
        Status: "A"
      - Name: "`getentropy()`"
        Version/Reference: "OpenBSD, available in Linux glibc 2.25+ and macOS 10.12+"
        Notes: "Provides secure random bytes directly from the kernel's entropy source with a straightforward and minimal API. It’s more modern and avoids pitfalls associated with older APIs."
        Status: "A"
