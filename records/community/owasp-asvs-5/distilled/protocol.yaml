schema: "library-protocol/v1"
record: owasp-asvs-5
reviewed_by: ""
note: >
  ASVS is "deliberately not presciptive about exactly how to verify compliance at the level of a testing guide"
  (Assessment and Certification › How to Verify ASVS Compliance). It nevertheless states the parties, the scope
  declaration, the per-requirement pass/fail decision, the evidence and the report contents of a verification
  engagement, and a procurement use of the result. That is modelled here. Every step cites its source
  sentence; ordering between steps is ours (kind: inferred) unless the text orders it. No wire messages exist —
  the 'messages' are documents (messages.yaml: verification-report).
roles:
  - {name: developing-organization, definition: "the organization developing the application; takes and documents the security decisions (What is the ASVS? › Documented security decisions)"}
  - {name: verifier, definition: "the party performing ASVS verification (Assessment and Certification › Scope of Verification); 'Certifying organizations' when offering assurance services"}
  - {name: report-consumer, definition: "'the consumer of a verification report' (Scope of Verification); in procurement, the buyer (Use cases › procurement)"}
  - {name: seller, definition: "supplier of procured software or development services (Use cases › As a Framework for Guiding the Procurement of Secure Software)"}
  - {name: owasp, definition: "publisher; 'does not certify any vendors, verifiers, or software' (OWASP's Stance on ASVS Certifications and Trust Marks)"}
flows:
  - name: verification-engagement
    locator: "Assessment and Certification › How to Verify ASVS Compliance"
    steps:
      - {n: 1, from: developing-organization, to: developing-organization, action: "choose target level from own risk analysis", source: "What is the ASVS? › Which level to achieve (F-09)", kind: stated}
      - {n: 2, from: developing-organization, to: developing-organization, action: "tailor scope / fork: omit irrelevant chapters and sections, keep traceability", source: "How to use the ASVS › Flexibility, Forking (F-13, F-17, F-18)", kind: stated}
      - {n: 3, from: developing-organization, to: verifier, action: "provide access to documentation, source code, configuration and the people involved", source: "Verification Mechanisms: 'verifying ASVS requirements may require access to documentation, source code, configuration, and the people involved in the development process'", kind: stated}
      - {n: 4, from: verifier, to: verifier, action: "declare scope: target level and requirements included (from the perspective of what was included)", source: "Scope of Verification (F-22, F-23)", kind: stated}
      - {n: 5, from: verifier, to: verifier, action: "verify each in-scope requirement to a pass/fail decision; documentation and implementation requirements as separate activities", source: "Scope › Verification (F-03); Documented security decisions (F-06)", kind: stated}
      - {n: 6, from: verifier, to: verifier, action: "collect evidence: work papers, screenshots, scripts, testing logs; not merely an automated tool run", source: "Verification Mechanisms (F-26)", kind: stated}
      - {n: 7, from: verifier, to: report-consumer, action: "issue verification-report (scope, summary of all requirements checked, exceptions, N/A noted, remediation guidance, methods disclosed, opinion on exclusions)", message: verification-report, source: "Verification reporting; Scope of Verification (F-20, F-21, F-24, F-25)", kind: stated}
      - {n: 8, from: report-consumer, to: report-consumer, action: "decide the level of trust to place in the application", source: "Scope of Verification: 'make an informed decision about the level of trust they can place in the application'", kind: stated}
    error_paths:
      - {condition: "requirement fails", result: "listed under exceptions with guidance on resolving issues; level not attained (state-machine.yaml)", source: "Verification reporting", kind: stated}
      - {condition: "requirement not applicable", result: "must be noted in the report", source: "F-21", kind: stated}
      - {condition: "assurance provider claims official OWASP certification", result: "not permitted; claims of ASVS certification are not endorsed by OWASP", source: "OWASP's Stance on ASVS Certifications and Trust Marks (F-19)", kind: stated}
      - {condition: "verification by automated tool only", result: "insufficient for certification", source: "F-26", kind: stated}
  - name: procurement
    locator: "What is the ASVS? › Use cases for the ASVS › As a Framework for Guiding the Procurement of Secure Software"
    steps:
      - {n: 1, from: report-consumer, to: seller, action: "set a requirement that the software must be developed at ASVS level X", kind: stated}
      - {n: 2, from: seller, to: report-consumer, action: "prove that the software satisfies ASVS level X (by a verification-engagement)", message: verification-report, kind: stated}
    error_paths:
      - {condition: "proof not provided or level not attained", result: "procurement requirement unmet", kind: inferred}
