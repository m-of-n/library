schema: "library-object-model/v1"
record: owasp-asvs-5
reviewed_by: ""
pass: "object-model pass — re-read of the 5.0.0 markdown with one question: what entity types and edges does ASVS assume or define? (claude, lane E, 2026-10-02)"
note: >
  Locators name the ASVS 5.0.0 markdown chapter/section (What is the ASVS? = 0x03, Assessment and
  Certification = 0x04, Changes Compared to v4.x = 0x05, Appendix A Glossary = 0x90, Appendix C = 0x92,
  Appendix D = 0x93) or a requirement id. kind: stated = the source names the thing; inferred = the source
  presupposes it without naming it as such. tmodel_mapping targets ARCH-0001 v0.2.0 (proposal, iteration 6)
  and DL-0009 (R-040..R-044); 'new' = no class yet.
objects:
  - name: Standard
    definition: "the ASVS itself: 'a collection of security requirements to be implemented to comply with the standard'"
    attributes: [name, short_name, version (Major.Minor.Patch), description, license (CC BY-SA 4.0)]
    locator: "What is the ASVS? › Scope › Standard; Release strategy; Frontispiece"
    kind: stated
    tmodel_mapping: "library record (the spec node a Requirement is published_by/part_of); Party (OWASP Foundation) as publisher per ARCH-0001 §2b"
    notes: "Versioning semantics (major/minor/patch) carry compliance consequences — see state-machine.yaml."
  - name: Chapter
    definition: "one of 17 top-level groupings (V1..V17), each with a Control Objective"
    attributes: [shortcode (V<n>), ordinal, short_name, name, control_objective (prose)]
    locator: "How to use the ASVS › The structure of the ASVS; each chapter's '## Control Objective'"
    kind: stated
    tmodel_mapping: "new (Requirement grouping / taxonomy node); candidate facet for crosswalk rows (R-044)"
    notes: "Chapters can be ignored wholesale when the technology is absent (e.g. OAuth, WebRTC) — scoping is at chapter/section granularity."
  - name: Section
    definition: "subdivision of a chapter (80 in 5.0.0); the first section of a chapter may be a Documentation section"
    attributes: [shortcode (V<n>.<m>), ordinal, name, intro_text, is_documentation_section]
    locator: "How to use the ASVS › The structure of the ASVS; Documented security decisions"
    kind: stated
    tmodel_mapping: "new (grouping)"
  - name: Requirement
    definition: "'describes what must be achieved to satisfy it'; must have demonstrable security impact and be verifiable to pass/fail"
    attributes: [identifier (<ch>.<sec>.<req>), versioned_id (v<version>-...), text ('Verify that ...'), level (1|2|3, lowest applicable), requirement_type (documentation|implementation)]
    locator: "What is the ASVS? › Scope › Requirement, Security, Verification; How to Reference ASVS Requirements"
    kind: stated
    tmodel_mapping: "Requirement (DL-0009 R-042/R-044) — direct fit; 345 instances"
    notes: "ASVS Requirements are PROPERTIES OF THE APPLICATION (outcome statements), not process steps: 'ASVS does not prescribe development lifecycle activities' (Scope › Application)."
  - name: DocumentationRequirement
    definition: "requirement mandating that 'the application developer's approach and configuration to these sorts of controls must be documented'; always in a chapter's first section"
    attributes: [documented_topic]
    locator: "What is the ASVS? › Documented security decisions; sections V2.1, V3.1, V5.1, V6.1, V7.1, V8.1, V11.1, V13.1, V14.1, V15.1, V16.1"
    kind: stated
    tmodel_mapping: "Requirement with nature=deliverable; satisfied by a documentation-kind MitigationInstance (R-040) / WorkProduct"
    notes: "31 of 345 requirements sit in Documentation sections."
  - name: ImplementationRequirement
    definition: "the 'related implementation requirement where the decisions that are documented should actually be put into place'"
    attributes: []
    locator: "What is the ASVS? › Documented security decisions"
    kind: stated
    tmodel_mapping: "Requirement with nature=process/technical; satisfied by a technical MitigationInstance (R-040)"
  - name: Level
    definition: "one of three cumulative security verification levels (L1, L2, L3) set by priority-based evaluation of risk reduction vs effort"
    attributes: [identifier (L1|L2|L3), approx_share (20% / 50% / 30%), description]
    locator: "What is the ASVS? › Application Security Verification Levels; Level evaluation; Level 1/2/3"
    kind: stated
    tmodel_mapping: "new — a conformance target / profile; analogous to a Gate exit-criterion bundle (R-041) or a MaturityLevel"
  - name: Application
    definition: "'the software product being developed, into which security controls must be integrated'; may include WAFs, load balancers, proxies for specific purposes"
    attributes: [target_level, sensitivity, technology_profile (APIs, OAuth, WebRTC, GraphQL...)]
    locator: "What is the ASVS? › Scope › Application"
    kind: stated
    tmodel_mapping: "Product / ProductInstance (ARCH-0001 §1); HTTP-intermediary components map to Component"
  - name: DevelopingOrganization
    definition: "'the organization developing the application' that takes and communicates the documented security decisions"
    attributes: []
    locator: "What is the ASVS? › Documented security decisions; Assessment › Scope of Verification"
    kind: stated
    tmodel_mapping: "Party (ARCH-0001 §2b) in a developer/manufacturer role edge"
  - name: Developer
    definition: "individual developer who follows the organization's documented decisions"
    attributes: []
    locator: "What is the ASVS? › Documented security decisions ('communicated to developers who then make sure to follow them')"
    kind: stated
    tmodel_mapping: "Party (person)"
  - name: Verifier
    definition: "'The person or team that is reviewing an application against the OWASP ASVS requirements.'"
    attributes: [testing_methods]
    locator: "Appendix A Glossary › Verifier; Assessment › Scope of Verification"
    kind: stated
    tmodel_mapping: "Party with a reviewer role; the PROV Agent of a Review (ARCH-0001 §4)"
  - name: CertifyingOrganization
    definition: "organization offering assurance services; may not claim official OWASP certification"
    attributes: [testing_methods_disclosed]
    locator: "Assessment and Certification › OWASP's Stance; Scope of Verification"
    kind: stated
    tmodel_mapping: "Party"
  - name: ReportConsumer
    definition: "'the consumer of a verification report' who decides how far to trust the application; in procurement, the buyer"
    attributes: []
    locator: "Assessment › Scope of Verification; Use cases › procurement"
    kind: stated
    tmodel_mapping: "Party (consumer role edge)"
  - name: Verification
    definition: "'The technical assessment of an application against the OWASP ASVS.'"
    attributes: [scope, target_level, methods, date (inferred)]
    locator: "Appendix A Glossary › Application Security Verification; Assessment and Certification"
    kind: stated
    tmodel_mapping: "Review / PROV Activity (ARCH-0001 §4/§5) producing Assertions of conformance (R-042)"
  - name: VerificationScope
    definition: "the declared target level and the requirements included; plus an opinion on exclusions"
    attributes: [target_level, included_requirements, exclusion_rationale]
    locator: "Assessment › Scope of Verification"
    kind: stated
    tmodel_mapping: "new — the applicability set of a conformance check (R-042)"
  - name: VerificationResult
    definition: "the pass/fail (or noted not-applicable) decision for one requirement"
    attributes: [outcome (pass|fail|not-applicable), evidence]
    locator: "What is the ASVS? › Scope › Verification; Assessment › Verification reporting"
    kind: stated
    tmodel_mapping: "Assertion (reified, ARCH-0001 §4) 'application satisfies requirement' + Review verdict"
  - name: VerificationReport
    definition: "'A report that documents the overall results and supporting analysis produced by the verifier for a particular application.'"
    attributes: [scope, summary_of_requirements_checked, exceptions, not_applicable, remediation_guidance, methods]
    locator: "Appendix A Glossary › Application Security Verification Report; Assessment › Verification reporting"
    kind: stated
    tmodel_mapping: "governed document-view (R-043): a versioned, signed-off projection of the conformance Assertions"
  - name: Evidence
    definition: "'robust evidence of findings with detailed documentation, which may include work papers, screenshots, scripts, and testing logs'"
    attributes: [type, content]
    locator: "Assessment › Verification Mechanisms"
    kind: stated
    tmodel_mapping: "Evidence (DL-0009 R-042) / PROV Entity"
  - name: VerificationMechanism
    definition: "technique used to verify a requirement: penetration testing (hybrid, documentation/source-led), source code review, documentation/architecture review, automated DAST/SAST, unit/integration tests"
    attributes: [kind, automated (bool)]
    locator: "Assessment › Verification Mechanisms; The Role of Automated Security Testing Tools; The Role of Penetration Testing; Use cases › Automated Unit and Integration Tests"
    kind: stated
    tmodel_mapping: "attribute of Review/Activity (method); new enum"
  - name: DocumentedSecurityDecision
    definition: "decision taken by the organization 'regarding how to implement certain security requirements', recorded in a document or embodied in a mandated common code library"
    attributes: [topic, decision, form (document|common library)]
    locator: "What is the ASVS? › Documented security decisions"
    kind: stated
    tmodel_mapping: "documentation-kind MitigationInstance (R-040) / WorkProduct; governed view (R-043) when it is a document"
    notes: "The source explicitly allows the 'document' to be a mandated shared library — a documentation mitigation whose artifact is code."
  - name: ApplicationDocumentation
    definition: "the body of application security documentation the Documentation requirements populate"
    attributes: [sections]
    locator: "requirements V2.1.1, V3.1.1, V5.1.1, V6.1.1, V8.1.1, V13.1.x, V15.1.x ('application documentation defines ...')"
    kind: stated
    tmodel_mapping: "WorkProduct / governed document-view (R-043)"
  - name: SecurityControl
    definition: "'A function or component that performs a security check (e.g., an authorization check) or when called results in a security effect (e.g., generating an audit record).'"
    attributes: []
    locator: "Appendix A Glossary › Security Control"
    kind: stated
    tmodel_mapping: "Mitigation (generic, D3FEND-like) / MitigationInstance kind=technical (R-040)"
  - name: Component
    definition: "'A self-contained unit of code, with associated disk and network interfaces that communicates with other components.'"
    attributes: [version, source_repository]
    locator: "Appendix A Glossary › Component; V15.2.1, V15.2.4"
    kind: stated
    tmodel_mapping: "Component (ARCH-0001 §1) — direct fit"
  - name: ThirdPartyComponent
    definition: "third-party library / component and its transitive dependencies, taken from an expected repository"
    attributes: [version, repository, risky (flag), vulnerable (flag)]
    locator: "V15.1.1, V15.1.2, V15.1.4, V15.2.1, V15.2.4"
    kind: stated
    tmodel_mapping: "Component supplied_by a Party (ARCH-0001 §2b)"
  - name: SBOM
    definition: "'an inventory catalog, such as software bill of materials (SBOM)' of all third-party libraries in use"
    attributes: [entries]
    locator: "V15.1.2"
    kind: stated
    tmodel_mapping: "WorkProduct; ingestable as Component graph (CycloneDX)"
  - name: RemediationTimeFrame
    definition: "'risk based remediation time frames for 3rd party component versions with vulnerabilities and for updating libraries in general'"
    attributes: [risk_band, max_age]
    locator: "V15.1.1, V15.2.1"
    kind: stated
    tmodel_mapping: "new — SLA policy attached to Vulnerability/Finding on a Component; checkable (V15.2.1 'not breached')"
  - name: RepositorySource
    definition: "the 'pre-defined, trusted, and continually maintained repositories' / 'expected repository' components come from"
    attributes: [url, internal (bool)]
    locator: "V15.1.2, V15.2.4"
    kind: stated
    tmodel_mapping: "new (supply-chain source; overlaps SLSA source/build-platform concepts)"
  - name: DangerousFunctionality
    definition: "parts of the application documented as using 'dangerous functionality'; with risky components they receive additional isolation"
    attributes: [location]
    locator: "V15.1.5, V15.2.5"
    kind: stated
    tmodel_mapping: "AttackSurface / TrustBoundary candidate (ARCH-0001 §1)"
  - name: SensitiveData
    definition: "data 'identified and classified into protection levels'"
    attributes: [protection_level]
    locator: "V14.1.1"
    kind: stated
    tmodel_mapping: "Asset / DataStore / DataFlow with classification (R-029)"
  - name: ProtectionLevel
    definition: "classification level of sensitive data with 'a documented set of protection requirements'"
    attributes: [protection_requirements]
    locator: "V14.1.1, V14.1.2, V14.2.4"
    kind: stated
    tmodel_mapping: "classification enum (R-029) + derived Requirements"
  - name: CryptographicInventory
    definition: "inventory of 'all cryptographic keys, algorithms, and certificates used by the application', incl. where keys can be used and a PQC migration plan"
    attributes: [keys, algorithms, certificates, usage_constraints, migration_plan]
    locator: "V11.1.2, V11.1.4; Appendix C › Cryptographic Inventory and Documentation"
    kind: stated
    tmodel_mapping: "new (CBOM — CycloneDX cryptographic BOM); WorkProduct"
  - name: KeyManagementPolicy
    definition: "'documented policy for management of cryptographic keys and a cryptographic key lifecycle that follows a key management standard such as NIST SP 800-57'"
    attributes: [lifecycle]
    locator: "V11.1.1; V17.2.1"
    kind: stated
    tmodel_mapping: "WorkProduct (documentation mitigation)"
  - name: CryptographicMechanism
    definition: "algorithm/mode/scheme/parameter with an approval status A (approved) / L (legacy) / D (disallowed)"
    attributes: [name, reference, status (A|L|D), restrictions, parameters]
    locator: "Appendix C (all tables) — crypto-registry.yaml"
    kind: stated
    tmodel_mapping: "new — a catalog like CWE/CAPEC; Weakness when status=D in use"
  - name: Secret
    definition: "backend secrets (passwords, key material, API keys...) managed by a secrets management solution, with a rotation schedule"
    attributes: [criticality, rotation_schedule, expiry]
    locator: "V13.1.4, V13.3.1, V13.3.4"
    kind: stated
    tmodel_mapping: "Asset"
  - name: ExternalService
    definition: "external services/systems the application relies on, with documented communication needs, connection limits and resource-management strategies"
    attributes: [max_connections, timeouts, failure_strategy]
    locator: "V13.1.1, V13.1.2, V13.1.3, V13.2.6"
    kind: stated
    tmodel_mapping: "ExternalEntity / Component + DataFlow (ARCH-0001 §1)"
  - name: LogInventory
    definition: "'an inventory ... documenting the logging performed at each layer of the application's technology stack'"
    attributes: [events, formats, storage, use, access_control, retention]
    locator: "V16.1.1, V16.2.3, V16.3.3"
    kind: stated
    tmodel_mapping: "WorkProduct; DataStore for logs"
  - name: Fork
    definition: "an organization- or domain-specific tailored ASVS that 'adjusts requirements based on the specific characteristics and risk levels of their applications', keeping traceability"
    attributes: [base_version, omitted_sections, added_guidance]
    locator: "What is the ASVS? › Flexibility with the ASVS; Forking the ASVS"
    kind: stated
    tmodel_mapping: "new — a tailored Requirement profile (cf. ISO 21434 tailoring); crosswalk must keep the base id (R-044)"
  - name: Mapping
    definition: "published correspondence between ASVS versions (v4.0.3 <-> v5.0.0) and, formerly, to CWE / NIST SP 800-63; direct mappings removed from 5.0, CRE mapping planned"
    attributes: [from_id, to_id, relation (ADDED|MOVED|MODIFIED|SPLIT|MERGED|COVERS|DEPRECATES|GRAMMAR)]
    locator: "Changes Compared to v4.x › Introduction; Removal of Direct Mappings; 5.0/mappings/"
    kind: stated
    tmodel_mapping: "maps_to edge of Requirement (R-044)"
  - name: Weakness
    definition: "CWE weakness — formerly mapped per requirement, mapping discontinued in 5.0"
    attributes: [cwe_id]
    locator: "Changes Compared to v4.x › Moving Away from CWE; Appendix A › Common Weakness Enumeration"
    kind: stated
    tmodel_mapping: "Weakness (CWE) — ARCH-0001 §1 layer 3; link from Requirement now only via legacy/derived mapping"
  - name: Threat / ThreatModel
    definition: "threat modeling — 'A technique consisting of developing increasingly refined security architectures to identify threat agents, security zones, security controls, and important technical and business assets'; referenced by V13.1.4 ('the organization's threat model') but as a practice REMOVED from requirements to Appendix D"
    attributes: []
    locator: "Appendix A › Threat Modeling; V13.1.4; Appendix D › Software Security processes"
    kind: stated
    tmodel_mapping: "the tmodel itself (ThreatInstance, AttackPath, ...); ASVS consumes it only as an input to risk-based decisions"
  - name: RiskAnalysis
    definition: "the organization's risk analysis that sets the target level and session/time-frame decisions"
    attributes: []
    locator: "Which level to achieve; V7.3.1, V7.3.2 ('according to risk analysis and documented security decisions'); V7 › V7.1 prose (requirements.yaml P-18: 'A risk analysis with documented security decisions related to session handling must be conducted as a prerequisite to implementation and testing.'); Applying ASVS in Practice"
    kind: stated
    notes: "verify pass 2026-10-02: kind changed from inferred to stated — the source names the risk analysis explicitly (V7.3.1, V7 section prose)"
    tmodel_mapping: "RiskScore / risk treatment (ARCH-0001 §3, DEC-003)"
  - name: Recommendation
    definition: "non-mandatory item (in-scope mechanism, principle, or removed SDL process) captured in Appendix D"
    attributes: [category]
    locator: "Appendix D: Recommendations"
    kind: stated
    tmodel_mapping: "Requirement with normativity=recommendation (outside conformance)"
  - name: ApprovalStatus
    definition: "Appendix C approval category of a cryptographic mechanism: Approved (A), Legacy (L), Disallowed (D)"
    attributes: [code]
    locator: "Appendix C (intro) legend; crypto-registry.yaml status_legend"
    kind: stated
    tmodel_mapping: "new catalog attribute (enum)"
    notes: "added by verify pass 2026-10-02 as the endpoint of has_status (previously the free-text 'ApprovalStatus (A|L|D)')"
edges:
  - {name: has_chapter, from: Standard, to: Chapter, cardinality: "1:N", definition: "17 chapters in 5.0.0", locator: "The structure of the ASVS", kind: stated, tmodel_mapping: "part_of"}
  - {name: has_section, from: Chapter, to: Section, cardinality: "1:N", definition: "chapter divided into sections", locator: "The structure of the ASVS", kind: stated, tmodel_mapping: "part_of"}
  - {name: contains, from: Section, to: Requirement, cardinality: "1:N", definition: "requirement identifier = <chapter>.<section>.<requirement>", locator: "How to Reference ASVS Requirements", kind: stated, tmodel_mapping: "part_of"}
  - {name: assigned_level, from: Requirement, to: Level, cardinality: "N:1", definition: "lowest level at which the requirement applies; membership in all higher levels follows", locator: "Application Security Verification Levels; export field L", kind: stated, tmodel_mapping: "new (conformance profile membership)"}
  - {name: includes_level, from: Level, to: Level, cardinality: "1:1", definition: "L2 includes all L1; L3 includes all L2 ('all of the L1 and L2 requirements')", locator: "Level 2", kind: stated, tmodel_mapping: "new (profile inheritance)"}
  - {name: has_more_stringent_condition_at, from: Requirement, to: Level, cardinality: "N:M", definition: "'some requirements apply to a particular level but have more stringent conditions for higher levels' (e.g. V13.3.1 'For an L3 application, this must involve a hardware-backed solution')", locator: "Application Security Verification Levels; V13.3.1", kind: stated, tmodel_mapping: "new — level-conditional clause inside one Requirement; tmodel needs a parameterised requirement or split ids"}
  - {name: realizes_decision_of, from: ImplementationRequirement, to: DocumentationRequirement, cardinality: "N:1", definition: "documentation requirements 'always have a related implementation requirement where the decisions that are documented should actually be put into place'", locator: "Documented security decisions", kind: stated, tmodel_mapping: "new edge Requirement→Requirement (depends_on); pairs are NOT enumerated by the source"}
  - {name: documents, from: DocumentationRequirement, to: DocumentedSecurityDecision, cardinality: "1:N", definition: "documentation requirement is satisfied by a documented decision", locator: "Documented security decisions", kind: stated, tmodel_mapping: "satisfied_by (R-042) → documentation-kind mitigation (R-040)"}
  - {name: takes_decision, from: DevelopingOrganization, to: DocumentedSecurityDecision, cardinality: "1:N", definition: "'the organization as a whole will be taking those decisions'", locator: "Documented security decisions", kind: stated, tmodel_mapping: "PROV wasAttributedTo / Party role"}
  - {name: follows, from: Developer, to: DocumentedSecurityDecision, cardinality: "N:M", definition: "'communicated to developers who then make sure to follow them'", locator: "Documented security decisions", kind: stated, tmodel_mapping: "none"}
  - {name: targets_level, from: Application, to: Level, cardinality: "N:1", definition: "organization decides what level the application should be at from its risk analysis", locator: "Which level to achieve", kind: stated, tmodel_mapping: "new (Product conformance target)"}
  - {name: applicable_to, from: Requirement, to: Application, cardinality: "N:M", definition: "chapters/sections are chosen or filtered by relevance; some requirements are non-applicable", locator: "The structure of the ASVS; Verification reporting", kind: stated, tmodel_mapping: "applicability set of R-042"}
  - {name: verifies, from: Verifier, to: Application, cardinality: "N:M", definition: "verifier reviews an application against ASVS requirements", locator: "Glossary › Verifier", kind: stated, tmodel_mapping: "Review.by Party"}
  - {name: declares_scope, from: Verification, to: VerificationScope, cardinality: "1:1", definition: "verifier makes scope clear: target level + included requirements", locator: "Scope of Verification", kind: stated, tmodel_mapping: "new"}
  - {name: decides, from: Verification, to: VerificationResult, cardinality: "1:N", definition: "each in-scope requirement yields pass/fail (or noted N/A)", locator: "Scope › Verification; Verification reporting", kind: stated, tmodel_mapping: "Activity generates Assertion (ARCH-0001 §4)"}
  - {name: about, from: VerificationResult, to: Requirement, cardinality: "N:1", definition: "result is per requirement", locator: "Verification reporting", kind: stated, tmodel_mapping: "Assertion subject"}
  - {name: supported_by, from: VerificationResult, to: Evidence, cardinality: "1:N", definition: "robust evidence of findings", locator: "Verification Mechanisms", kind: stated, tmodel_mapping: "Assertion wasDerivedFrom Evidence"}
  - {name: uses_mechanism, from: Verification, to: VerificationMechanism, cardinality: "N:M", definition: "methods chosen by certifying organization and disclosed", locator: "Scope of Verification; Verification Mechanisms", kind: stated, tmodel_mapping: "Activity attribute"}
  - {name: reported_in, from: VerificationResult, to: VerificationReport, cardinality: "N:1", definition: "report includes summary of all requirements checked and exceptions", locator: "Verification reporting", kind: stated, tmodel_mapping: "governed view projection (R-043)"}
  - {name: relies_on_report, from: ReportConsumer, to: VerificationReport, cardinality: "N:M", definition: "consumer decides level of trust", locator: "Scope of Verification", kind: stated, tmodel_mapping: "none"}
  - {name: procurement_requires_level, from: ReportConsumer, to: Level, cardinality: "N:1", definition: "buyer sets 'must be developed at ASVS level X'; seller proves it", locator: "Use cases › procurement", kind: stated, tmodel_mapping: "Gate exit criterion (R-041) in a supplier relation"}
  - {name: implemented_by, from: Requirement, to: SecurityControl, cardinality: "N:M", definition: "requirements state security goals that controls implement; ASVS avoids prescribing the mechanism", locator: "Changes › Emphasis on Security Goals Over Mechanisms; Glossary › Security Control", kind: inferred, tmodel_mapping: "satisfied_by MitigationInstance (R-040/R-042)"}
  - {name: composed_of, from: Application, to: Component, cardinality: "1:N", definition: "application contains components incl. third-party libraries and transitive dependencies", locator: "V15.2.1, V15.2.4; Glossary › Component", kind: stated, tmodel_mapping: "composed_of (ARCH-0001 §1)"}
  - {name: inventoried_in, from: ThirdPartyComponent, to: SBOM, cardinality: "N:1", definition: "inventory catalog of all third-party libraries in use", locator: "V15.1.2", kind: stated, tmodel_mapping: "Component ← SBOM ingestion"}
  - {name: sourced_from, from: ThirdPartyComponent, to: RepositorySource, cardinality: "N:1", definition: "components come from pre-defined, trusted, maintained / expected repositories", locator: "V15.1.2, V15.2.4", kind: stated, tmodel_mapping: "new (supplied_by Party / source)"}
  - {name: bounded_by, from: ThirdPartyComponent, to: RemediationTimeFrame, cardinality: "N:1", definition: "components must not breach the documented update and remediation time frames", locator: "V15.1.1, V15.2.1", kind: stated, tmodel_mapping: "new SLA edge to Vulnerability/Finding"}
  - {name: isolates, from: SecurityControl, to: DangerousFunctionality, cardinality: "N:M", definition: "additional protections (sandboxing, encapsulation, containerization, network isolation) around dangerous functionality and risky components", locator: "V15.2.5", kind: stated, tmodel_mapping: "TrustBoundary / in_trust_zone"}
  - {name: classified_as, from: SensitiveData, to: ProtectionLevel, cardinality: "N:1", definition: "sensitive data identified and classified into protection levels", locator: "V14.1.1", kind: stated, tmodel_mapping: "classification (R-029)"}
  - {name: requires, from: ProtectionLevel, to: Requirement, cardinality: "1:N", definition: "each protection level has a documented set of protection requirements, implemented per V14.2.4", locator: "V14.1.2, V14.2.4", kind: stated, tmodel_mapping: "derived Requirement nodes (organization-local)"}
  - {name: lists, from: CryptographicInventory, to: CryptographicMechanism, cardinality: "1:N", definition: "inventory includes all keys, algorithms and certificates", locator: "V11.1.2", kind: stated, tmodel_mapping: "new (CBOM)"}
  - {name: has_status, from: CryptographicMechanism, to: ApprovalStatus, cardinality: "N:1", definition: "approval level per Appendix C tables", locator: "Appendix C intro", kind: stated, tmodel_mapping: "new catalog attribute"}
  - {name: rotated_per, from: Secret, to: ApplicationDocumentation, cardinality: "N:1", definition: "secrets expire and rotate based on the application's documentation", locator: "V13.1.4, V13.3.4", kind: stated, tmodel_mapping: "documentation mitigation → technical check"}
