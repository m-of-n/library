gaps:
  - "Level as a conformance PROFILE: tmodel has no object for a cumulative requirement bundle with inheritance (L1 ⊂ L2 ⊂ L3); R-041 Gate exit-criteria could reference one, but the profile itself is missing."
  - "Level-conditional clauses inside a single requirement (V13.3.1 'For an L3 application, this must involve a hardware-backed solution'): tmodel Requirement needs per-level parameters or sub-requirements."
  - "Requirement→Requirement 'realizes_decision_of' (documentation ↔ implementation pairing): R-042 models satisfied_by but not inter-requirement dependency; ASVS asserts the pairing exists but does not enumerate it."
  - "VerificationScope / applicability set and the not-applicable outcome: R-042 conformance ('every in-scope ThreatInstance has an approved MitigationInstance') needs an explicit N/A verdict with mandatory justification."
  - "Tailored profile / Fork with traceability to the base id — needed for R-044 crosswalk stability."
  - "RemediationTimeFrame (SLA) on third-party component vulnerabilities — a checkable policy object absent from ARCH-0001 §5."
  - "CryptographicInventory / CBOM and a cryptographic-mechanism catalog with A/L/D status — no tmodel class."
  - "VerificationMechanism enum (hybrid pentest, code review, doc review, DAST/SAST, unit test) on Review — Review has no method attribute yet."
  - "ASVS has no Weakness/Threat link any more (CWE dropped): a tmodel ThreatInstance→Requirement link must come from our own mapping or OWASP CRE, not from ASVS."
