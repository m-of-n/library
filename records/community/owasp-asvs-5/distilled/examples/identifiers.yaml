schema: "library-examples/v1"
record: owasp-asvs-5
reviewed_by: ""
note: >
  Fixtures for parsing / validating ASVS requirement identifiers. Vectors marked source are the examples the
  standard itself gives (What is the ASVS? › How to Reference ASVS Requirements); vectors marked derived apply
  the stated rules to new inputs and say which rule they exercise. expected.text is verbatim from the 5.0.0
  export where an id resolves.
vectors:
  - input: "v5.0.0-1.2.5"
    origin: source
    expected:
      valid: true
      version: "5.0.0"
      chapter: 1
      section: 2
      requirement: 5
      chapter_name: "Encoding and Sanitization"
      section_name: "Injection Prevention"
      text: "Verify that the application protects against OS command injection and that operating system calls use parameterized OS queries or use contextual command line output encoding."
      level: 1
  - input: "1.11.3"
    origin: source
    expected:
      valid: true
      version: "(latest — F-16)"
      chapter: 1
      section: 11
      requirement: 3
      resolves_in_5_0_0: false
      note: "the source's own format illustration; V1 has only five sections in 5.0.0, so 1.11.3 does not resolve against 5.0.0 (it is a 4.x-era example)"
  - input: "1.2.5"
    origin: source
    expected:
      valid: true
      version: "(latest — F-16)"
      resolves_to: "v5.0.0-1.2.5 while 5.0.0 is the latest release"
  - input: "V5.0.0-1.2.5"
    origin: derived
    rule: "F-15 — the v preceding the version number should always be lowercase"
    expected:
      valid: false
  - input: "V1.2.5"
    origin: derived
    rule: "export-file form (Shortcode / req_id); unversioned, so refers to the export's own Version"
    expected:
      valid: true
      context: "only inside a 5.0.0 export file"
  - input: "v5.0.0-1.2.11"
    origin: derived
    rule: "well-formed but unresolvable: section V1.2 ends at 1.2.10 in 5.0.0"
    expected:
      valid: true
      resolves_in_5_0_0: false
  - input: "v4.0.3-2.2.1"
    origin: derived
    rule: "other-version id; resolve through 5.0/mappings/mapping_v4.0.3_to_v5.0.0.yml"
    expected:
      valid: true
      maps_to_5_0_0: ["v5.0.0-6.1.1", "v5.0.0-6.3.1"]
