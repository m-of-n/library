schema: "library-object-model/v1"
record: owasp-dsomm
source_version: "DSOMM data v5.1.0 (git tag; generated/model.yaml meta.version 5.0.2, released 2026-09-17)"
extracted: "2026-10-02"
reviewed_by: ""
method: "Object-model pass over generated/model.yaml, src/assets/YAML/meta.yaml, teams.yaml and the published JSON Schemas (src/assets/YAML/schemas/*.json). The data is typed YAML, so most objects are stated."
objects:
  - {name: Dimension, definition: "Top-level grouping (Agentic AI, Build and Deployment, Culture and Organization, Implementation, Information Gathering, Test and Verification).", attributes: [name], locator: "generated/model.yaml top-level keys", kind: stated, tmodel_mapping: "Requirement group (R-044)", notes: "6 dimensions; 'Agentic AI' added in v5.0.0 (2026-08-18, breaking change)."}
  - {name: SubDimension, definition: "Second-level grouping (e.g. Static depth for applications, Patch Management).", attributes: [name], locator: "generated/model.yaml second-level keys", kind: stated, tmodel_mapping: "Requirement group", notes: "24 sub-dimensions."}
  - {name: Activity, definition: "A practice at a level with description, risk, measure, assessment, difficulty, usefulness, dependencies, implementations and references.", attributes: [uuid, name, description, risk, measure, assessment, difficultyOfImplementation, usefulness, level, tags, comments, credits], locator: "generated/model.yaml; schemas/dsomm-schema-*.json", kind: stated, tmodel_mapping: "Requirement (practice) / technical-or-process Mitigation (R-040)", notes: "251 activities; levels 1-5: 29/75/80/43/24. 'risk' + 'measure' pairs make each activity a threat→mitigation statement."}
  - {name: MaturityLevel, definition: "Level 1 Basic understanding … Level 5 Advanced deployment of security practices at scale.", attributes: [number, label], locator: "src/assets/YAML/meta.yaml strings.en.maturity_levels", kind: stated, tmodel_mapping: "MaturityLevel", notes: ""}
  - {name: Difficulty, definition: "difficultyOfImplementation {knowledge, time, resources}, each 1-5 with labels (KnowledgeLabels: one/two/three or more disciplines).", attributes: [knowledge, time, resources], locator: "Activity.difficultyOfImplementation; meta.yaml labels", kind: stated, tmodel_mapping: "cost attribute on MitigationInstance", notes: ""}
  - {name: Implementation, definition: "A tool or method that implements an activity (uuid, name, tags, url, description).", attributes: [uuid, name, url, tags], locator: "Activity.implementation; schemas/dsomm-implementations-schema.json", kind: stated, tmodel_mapping: "Component (tool) realizing a Mitigation", notes: ""}
  - {name: Reference, definition: "Cross-references per activity: samm2, iso27001-2017, iso27001-2022, openCRE, d3f (D3FEND).", attributes: [framework, ids], locator: "Activity.references", kind: stated, tmodel_mapping: "Requirement.maps_to (R-044); D3FEND links to Mitigation catalogue (ARCH §1.3)", notes: "samm2 on all 251; d3f on 12."}
  - {name: Team, definition: "A team whose implementation of activities is tracked; teams form groups.", attributes: [name, groups], locator: "teams.yaml; meta.yaml teams/teamGroups", kind: stated, tmodel_mapping: "Party (org unit) — the SDL subject at team granularity", notes: ""}
  - {name: TeamImplementation, definition: "teamsImplemented — which teams implemented the activity.", attributes: [team, status], locator: "schemas/dsomm-schema-implementation.json properties.teamsImplemented", kind: stated, tmodel_mapping: "ConformanceResult per Party (R-042)", notes: "Item shape is an untyped object in the schema."}
  - {name: TeamEvidence, definition: "teamsEvidence — evidence per team for an activity.", attributes: [team, evidence], locator: "schemas/dsomm-schema-implementation.json properties.teamsEvidence", kind: stated, tmodel_mapping: "Evidence (R-042)", notes: "The only maturity model in this lane with an evidence slot in its data schema."}
  - {name: Assessment, definition: "'assessment' text: what to show an assessor (e.g. 'Show the definition of which data classes may be used with which AI tools').", attributes: [text], locator: "Activity.assessment (78 activities)", kind: stated, tmodel_mapping: "ConformanceCheck (R-042)", notes: ""}
edges:
  - {name: contains, from: Dimension, to: SubDimension, cardinality: "1:N", definition: "", locator: "model.yaml nesting", kind: stated, tmodel_mapping: "grouping"}
  - {name: contains, from: SubDimension, to: Activity, cardinality: "1:N", definition: "", locator: "model.yaml nesting", kind: stated, tmodel_mapping: "grouping"}
  - {name: at_level, from: Activity, to: MaturityLevel, cardinality: "N:1", definition: "", locator: "Activity.level", kind: stated, tmodel_mapping: "attribute"}
  - {name: depends_on, from: Activity, to: Activity, cardinality: "N:M", definition: "dependsOn by uuid (206 edges across 151 activities)", locator: "Activity.dependsOn", kind: stated, tmodel_mapping: "depends_on between Requirements (precedence for Gates)"}
  - {name: implemented_by, from: Activity, to: Implementation, cardinality: "N:M", definition: "", locator: "Activity.implementation", kind: stated, tmodel_mapping: "realized_by Component"}
  - {name: maps_to, from: Activity, to: Reference, cardinality: "N:M", definition: "SAMM / ISO 27001 / OpenCRE / D3FEND ids", locator: "Activity.references", kind: stated, tmodel_mapping: "R-044"}
  - {name: implemented_in, from: Activity, to: Team, cardinality: "N:M", definition: "teamsImplemented", locator: "implementation schema", kind: stated, tmodel_mapping: "conformance per Party"}
  - {name: evidenced_by, from: TeamImplementation, to: TeamEvidence, cardinality: "1:N", definition: "teamsEvidence", locator: "implementation schema", kind: stated, tmodel_mapping: "Evidence -> ConformanceResult"}
gaps:
  - "No gate or dates: progress is per team per activity without phase gates (R-041 must add)."
  - "teamsImplemented / teamsEvidence items are untyped objects in the published schema; status vocabulary lives in the application, not the data."
  - "Levels 1-5 are attached to activities (difficulty/adoption), not to an organization state machine."
