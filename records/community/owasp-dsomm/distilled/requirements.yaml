  - id: 'owasp-dsomm#106622af-8969-4d9b-81ad-86d8e2bfd631'
    locator: 'Agentic AI / Data Protection / Protection of agent memory against poisoning / measure'
    source_lines: '630-644'
    text: 'Treat writes to agent memory and rule files like code changes: keep them under version control and human review, restrict write access to shared rule files and knowledge/vector stores, validate the provenance of ingested knowledge and periodically review or reset persistent memory. Apply retention limits (time-to-live) so that unverified memory, especially content derived from external inputs or tool outputs, expires instead of persisting indefinitely. Version memory stores so that detected poisoning can be answered by rolling back to a known-good state instead of purging everything. Segment memory by user and session and keep credentials and other secrets out of it: cached secrets in shared memory let a later session act with the permissions of an earlier one (OWASP Top 10 for Agentic Applications, ASI03). Do not re-ingest the agent''s own outputs into trusted memory automatically, as this self-reinforces errors and planted instructions ("bootstrap poisoning", ASI06).'
    verb: 'can'
    kind: 'stated'
    activity: 'Protection of agent memory against poisoning'
    dimension: 'Agentic AI'
    subdimension: 'Data Protection'
    level: 5
