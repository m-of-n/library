  - id: 'owasp-dsomm#c1acc8af-312e-4503-a817-a26220c993a0'
    locator: 'Test and Verification / Consolidation / Simple false positive treatment / measure'
    source_lines: '11053-11063'
    text: 'Findings from security tests must be triaged and outcomes persisted/documented to: - Prevent re-analysis of known issues in subsequent test runs - Track accepted risks vs false positives - Enable consistent decision-making across teams At this maturity level, a simple tracking system suffices - tools need only distinguish between "triaged" and "untriaged" findings, without complex categorization. Some tools refer to this as "suppression" of findings. Samples for false positive handling: - [OWASP Dependency Check](https://jeremylong.github.io/DependencyCheck/general/suppression.html) - [Kubescape with VEX](https://kubescape.io/blog/2023/12/07/kubescape-support-for-vex-generation/) - [OWASP DefectDojo Risk Acceptance](https://docs.defectdojo.com/en/working_with_findings/findings_workflows/risk_acceptances/) and [False Positive Handling](https://docs.defectdojo.com/en/working_with_findings/intro_to_findings/#triage-vulnerabilities-using-finding-status)'
    verb: 'must'
    kind: 'stated'
    activity: 'Simple false positive treatment'
    dimension: 'Test and Verification'
    subdimension: 'Consolidation'
    level: 1
    difficulty:
      knowledge: 1
      time: 1
      resources: 1
    usefulness: 4
    tags:
      - 'false-positive'
      - 'defect-management'
      - 'scanning'
      - 'sca'
      - 'sats'
      - 'dast'
    assessment: '11065'
    normativity: 'recommendation'
    normativity_reason: 'the activity''s measure: the practice DSOMM recommends at this level (the model states no requirement level; an organisation adopts activities level by level)'
    actor: 'security and development teams'
    object: 'triage of security test findings with persisted outcomes (simple triaged/untriaged tracking)'
    field: 'measure'
    testable: 'yes'
  - id: 'owasp-dsomm#44f2c8a9-4aaa-4c72-942d-63f78b89f385'
