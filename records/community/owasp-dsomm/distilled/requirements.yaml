  - id: 'owasp-dsomm#3bbd6dd9-0821-426c-8a19-41737ed61459'
    locator: 'Agentic AI / Guidance / Automated containment of anomalous AI agents / measure'
    source_lines: '2380-2394'
    text: 'Define an automated containment action per detection class and wire it to the anomaly detection: pause the agent, terminate its sessions, revoke its credentials or reduce its privileges. Keep the actions reversible and graduated by confidence and severity, log every automated action and notify a human immediately. Let an AI assistant draft the triage context (timeline, affected systems, collected evidence) so the notified human decides instead of collecting, and test the containment path regularly like a fire drill. Alert on cascade symptoms such as rapid fan-out (one decision triggers many downstream agents or tasks) and oscillating retry loops between agents, and place circuit breakers between planning and execution so that a runaway plan stops instead of propagating. Return a contained agent to production only after its instructions, memory and dependencies have been verified against a known-good state and a human has approved the reintegration.'
