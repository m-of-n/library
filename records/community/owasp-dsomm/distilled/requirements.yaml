    locator: 'Agentic AI / Isolation / Human approval for irreversible AI agent actions / measure'
    source_lines: '3409-3419'
    text: 'Classify agent action types by reversibility and assign approval tiers: pre-approval for irreversible actions, monitoring with an intervention window for reversible actions with business impact (e.g. buffer outbound messages for a defined period so an intervention stops delivery), autonomy only for low-risk reversible actions. If the reversibility of an action class cannot be demonstrated, default to pre-approval. Require a second, independent approver for high-risk actions, record the approver identity, the decision context and the reason in the audit log, and design the approval step so the approver actually sees the action and its context instead of clicking through.'
