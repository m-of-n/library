    source_lines: '1588-1599'
    text: 'Evaluate and approve AI tool, server, skill and model integrations before use: verify publisher and supply chain, review requested permissions and data flows, verify that declared capabilities match the actual code and instructions (behavioral integrity, e.g. via a behavioral classification registry), use safe model formats (e.g. safetensors instead of pickle), pin versions and maintain an inventory of allowed integrations and models. For model artifacts, record provenance, training data lineage and fine-tuning parameters in an AI Bill of Materials (AI-BOM), e.g. based on OWASP''s extension of the CycloneDX machine learning bill of materials (ML-BOM), so model components carry the same supply chain evidence as code dependencies (see _SBOM of components_ in Build and Deployment).'
