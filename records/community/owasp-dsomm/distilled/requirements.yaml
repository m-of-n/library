note: 'Ids are stable and never reused. Three layers. (1) The activity layer: one entry per DSOMM activity (251), id owasp-dsomm#<the activity''s own uuid from the source>, text the activity''s measure verbatim (cut by script through bin/_source_text clean_yaml + span; a quoted scalar keeps its quote marks and literal backslash escapes exactly as the source bytes have them), locator the measure''s key path; activity, dimension, subdimension, level, dependsOn (resolved to activity ids), difficulty (the source''s difficultyOfImplementation), usefulness, tags and assessment (source lines of the assessment field) are copied by script; dependsOn is absent where the source has none (108 activities, 8 of them with an empty list) and assessment where the activity has no assessment field (173). 2 source ids are not UUIDs (WAF medium L9552, WAF Advanced L9599: a UUID with a suffix) and are used as they are. One activity''s measure holds a placeholder, not a measure (Correlate known vulnerabilities in infrastructure with new image versions, L13690): that entry is kind inferred with a reason and no text. (2) R-0001 to R-0244 are the bin/fx1-skeleton sentences in source order; a skeleton sentence inside a measure is split_of its activity entry, so the measure''s verbal forms are counted once, in the activity entry. (3) R-0245 to R-0705 were appended by pass 1: first the stated entries in source order (split_of children of multi-form sentences; keyword-less candidates promoted with candidate: C-NNNN; hunted keyword-less binding text no candidate caught, cut from the source by script), then the kind inferred entries in our words, each with derived_from. (4) R-0706 to R-0746 were appended by the verify pass (2026-11-16), in source order: 41 hunted texts of activity descriptions (recommendations, scope statements naming another activity or dimension, one permission) that neither the skeleton, the candidates nor pass 1''s hunt had caught, cut from the source by script. A stated candidate whose text is a whole measure is promoted onto the activity entry itself (candidate on that entry). normativity is one of: recommendation (a practice the model recommends; every measure, and description or implementation text that recommends an action to the adopter); assessment (an assessment line: evidence the assessor asks to be shown); scope (what the activity covers, excludes or presupposes); permission (latitude: an allowed alternative or a lowered bar); descriptive (fact, possibility, threat, rationale or tool description, binding no one). DSOMM states no requirement level: nothing in it is mandatory, an organisation adopts activities level by level, so even a must binds only as part of the recommended practice of the activity it sits in; normativity_reason says why for each entry. verb none marks a stated text with no directives form; an activity entry''s verb is the strongest form in its measure. testable_reason explains every partial and no. field is the DSOMM key the text sits in, below the activity. Source defects: normative.md, Source defects.'
