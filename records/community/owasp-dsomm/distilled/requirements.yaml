  - id: 'owasp-dsomm#abe74dfd-d554-4ec5-8b94-f75d352afaaa'
    locator: 'Agentic AI / Isolation / Trust boundaries between AI agents / measure'
    source_lines: '3525-3538'
    text: 'Give every agent its own identity and its own credentials, never shared between agents. Scope each delegated task to the minimum permissions it needs instead of passing on the delegating agent''s access context. Check at every step of a multi-agent workflow that the delegating agent is who it claims to be and is authorized to request the action. Secure the communication channel itself with mutual authentication and signed messages (e.g. mutual TLS), replay protection (e.g. nonces and expiry times) and rejection of protocol downgrades. Accept agents into a workflow only from a registry or discovery mechanism that verifies agent identity and descriptors. Record the communication between agents so that delegations deviating from the usual patterns surface for review (see _Audit logging of AI agent actions_ and _Anomaly detection for AI agent behavior_).'
