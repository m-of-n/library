  - id: "SM15"
    name: "agent-action"
    object: "One business action of a running agent"
    locator: "Agentic AI / Isolation / Human approval for irreversible AI agent actions"
    activities:
      - activity: "Human approval for irreversible AI agent actions"
        uuid: "cd1cb2bd-4bd6-4b9f-beaa-921fe9ea9576"
        level: "4"
    summary: >-
      By tier: autonomous, buffered with an intervention window, or pending approval; executed or
      stopped.
    quotes:
      - source_lines: "3409-3415"
        quote: |-
          Classify agent action types by reversibility and assign approval tiers: pre-approval for irreversible actions, monitoring with an intervention window for reversible actions with business impact (e.g. buffer outbound messages for a defined period so an intervention stops delivery), autonomy only for low-risk reversible actions. If the reversibility of an action class cannot be demonstrated, default to pre-approval.
    flows: ["F01"]
    states:
      - id: "proposed"
        meaning: "Proposed by the agent; its class's tier applies."
        kind: "inferred"
        initial: "yes"
        inferred_reason: "The source classifies action types; the proposing state is this model's."
      - id: "pending_approval"
        meaning: "Blocked until approved (one or two approvers)."
        kind: "stated"
        quotes:
