  - id: "SM11"
    name: "agent-memory-entry"
    object: "Content in an agent's persistent memory or rule files"
    locator: "Agentic AI / Data Protection / Protection of agent memory against poisoning"
    activities:
      - activity: "Protection of agent memory against poisoning"
        uuid: "106622af-8969-4d9b-81ad-86d8e2bfd631"
        level: "5"
    summary: >-
      Writes are reviewed like code; unverified content expires; poisoning is answered by rollback
      to a known-good version.
    quotes:
      - source_lines: "630-638"
        quote: |-
          Treat writes to agent memory and rule files like code changes: keep them under version control and human review, restrict write access to shared rule files and knowledge/vector stores, validate the provenance of ingested knowledge and periodically review or reset persistent memory. Apply retention limits (time-to-live) so that unverified memory, especially content derived from external inputs or tool outputs, expires instead of persisting indefinitely. Version memory stores so that detected poisoning can be answered by rolling back to a known-good state instead of purging everything.
    flows: "none"
    flows_reason: >-
      the lifecycle of agent memory content is stated by an activity that no flow of protocol.yaml uses
    states:
      - id: "unverified"
        meaning: "Written, not reviewed (e.g. derived from external input or tool output)."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "634-636"
            quote: |-
              so that unverified memory, especially content derived from external inputs or tool outputs, expires instead of persisting indefinitely.
      - id: "trusted"
        meaning: "Reviewed and kept under version control."
        kind: "stated"
        quotes:
          - source_lines: "630-631"
            quote: |-
              keep them under version control and human review,
      - id: "expired"
        meaning: "Removed at its retention limit."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "634-636"
            quote: |-
              Apply retention limits (time-to-live) so that unverified memory, especially content derived from external inputs or tool outputs, expires instead of persisting indefinitely.
      - id: "poisoned"
        meaning: "Holding planted instructions."
        kind: "stated"
        error: "yes"
        quotes:
          - source_lines: "637-638"
            quote: |-
              detected poisoning can be answered by rolling back to a known-good state instead of purging everything.
    transitions:
      - id: "ME-T01"
        from: "unverified"
        to: "trusted"
        trigger: "memory-reviewed"
        kind: "stated"
        note: "Agent's own outputs are not re-ingested into trusted memory automatically."
        quotes:
          - source_lines: "630-631"
            quote: |-
              Treat writes to agent memory and rule files like code changes: keep them under version control and human review,
        guards: "none stated"
      - id: "ME-T02"
        from: "unverified"
        to: "expired"
        trigger: "ttl-expires"
        kind: "stated"
        quotes:
          - source_lines: "634-636"
            quote: |-
              Apply retention limits (time-to-live) so that unverified memory, especially content derived from external inputs or tool outputs, expires instead of persisting indefinitely.
        guards: "none stated"
      - id: "ME-T03"
        from: "trusted"
        to: "poisoned"
        trigger: "poisoning-detected"
        kind: "stated"
        quotes:
          - source_lines: "619-622"
            quote: |-
              Content an attacker smuggles into this persistent state (via issues, code comments, documents or web content the agent processes) corrupts every future session and can spread to all developers through version control.
        guards: "none stated"
      - id: "ME-T04"
        from: "poisoned"
        to: "trusted"
        trigger: "rolled-back"
        kind: "stated"
        effects:
          - meaning: "Rolled back to a known-good version instead of purging everything."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0012"
