        level: "5"
    summary: >-
      In sync, drifted, then back in sync by revert or by re-approval; documented exceptions do
      not alert.
    quotes:
      - source_lines: "5169-5172"
        quote: |-
          Continuously compare the deployed state of infrastructure and configuration against the versioned desired state (e.g. via GitOps controllers that reconcile and report drift, or scheduled infrastructure-as-code plan runs).
    flows: ["F13"]
    states:
      - id: "in_sync"
