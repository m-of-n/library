  - id: "SM02"
    name: "ai-agent"
    object: "An AI agent, from registration to retirement"
    locator: "Agentic AI / Guidance"
    activities:
      - activity: "Decommissioning of AI agents"
        uuid: "44a195ec-da9e-4fd4-be6d-a5a688852cf7"
        level: "3"
      - activity: "Inventory of AI agents"
        uuid: "c1f02ad7-e97e-4c87-b827-7542793ddb0a"
        level: "2"
      - activity: "Automated containment of anomalous AI agents"
        uuid: "3bbd6dd9-0821-426c-8a19-41737ed61459"
        level: "5"
    summary: >-
      Registered in the inventory, operating, contained on a detection and returned only after
      verification and approval, and finally decommissioned until no access is left. Shadow agents
      are a stated state: running, unregistered, unaccountable.
    quotes:
      - source_lines: "1478"
        quote: |-
          The lifecycle of an AI agent does not end with switching it off.
    flows: ["F04", "F14"]
    states:
      - id: "shadow"
        meaning: "Running without being in the inventory; nobody accountable."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "1017-1018"
            quote: |-
              agents started by individual developers or teams keep credentials and access long after
      - id: "operating"
        meaning: "In the inventory with identity, owner, purpose and permissions, and running."
        kind: "stated"
        quotes:
          - source_lines: "1023-1025"
            quote: |-
              Maintain an inventory of all AI agents and assistants: identity/service account, human owner, purpose, granted permissions and connected systems.
      - id: "contained"
        meaning: "Paused, sessions ended, credentials revoked or privileges reduced."
        kind: "stated"
        quotes:
          - source_lines: "2392"
            quote: |-
              Return a contained agent to production
      - id: "retired"
        meaning: "Decommissioned: no residual access, audit logs archived."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "1482-1483"
            quote: |-
              this activity ensures that what is retired actually loses all access.
    transitions:
      - id: "AG-T01"
        from: "shadow"
        to: "operating"
        trigger: "agent-registered"
        kind: "inferred"
        inferred_reason: >-
          Unregistered agents are to be detected; what follows detection (register or
          decommission) is not stated.
        guards: "none stated"
      - id: "AG-T02"
        from: "shadow"
        to: "retired"
        trigger: "shadow-agent-detected"
        kind: "inferred"
        inferred_reason: >-
          As AG-T01: a detected shadow agent may be decommissioned instead of registered.
        guards: "none stated"
      - id: "AG-T03"
        from: "operating"
        to: "contained"
        trigger: "anomaly-or-tripwire"
        kind: "stated"
        effects:
          - meaning: >-
              The automated containment action of the detection class; logged; a human notified.
            kind: "stated"
            candidates:
              - "C-0111"
              - "C-0114"
      - id: "AG-T04"
        from: "contained"
        to: "operating"
        trigger: "reintegration-approved"
        kind: "stated"
        guards:
          - meaning: >-
              Instructions, memory and dependencies verified against a known-good state; a human
              approved.
            kind: "stated"
            candidates:
              - "C-0112"
      - id: "AG-T05"
        from: "operating"
        to: "retired"
        trigger: "decommissioned"
        kind: "stated"
        guards:
          - meaning: >-
              The checklist covers every access path and verification shows zero residual access.
            kind: "stated"
            candidates:
              - "C-0067"
              - "C-0069"
      - id: "AG-T06"
        from: "contained"
        to: "retired"
        trigger: "decommissioned"
        kind: "inferred"
        inferred_reason: >-
          A contained agent may be retired instead of returned; the source does not say so.
        guards: "none stated"
      - id: "AG-T07"
        from: "operating"
        to: "operating"
        trigger: "periodic-review"
        kind: "stated"
        quotes:
          - source_lines: "1025-1026"
            quote: |-
              Review it periodically, decommission stale agents and detect unregistered ones (e.g. via identity provider and audit log analysis).
        effects:
          - meaning: "Stale agents are decommissioned (AG-T05); unregistered ones detected."
            kind: "stated"
            candidates:
              - "C-0048"
              - "C-0049"
  - id: "SM03"
    name: "ai-assisted-change"
    object: "One AI-assisted change, specify to merge"
    locator: "Agentic AI / Guidance; Agentic AI / Verification"
    activities:
      - activity: "Dynamic load of security rules"
        uuid: "862d08a4-7299-4b2c-9d38-8fcaade66d3e"
        level: "4"
      - activity: "Human review of AI generated plans"
        uuid: "1bd1308d-ae3b-499a-ae81-818993571f52"
        level: "2"
      - activity: "Self-verification of AI generated changes"
        uuid: "63e82b31-4167-480d-a22b-baf8ef79af61"
        level: "2"
      - activity: "Human review of AI generated code"
        uuid: "d6bc0b7f-fd98-49fe-b66c-7c5fa70452c6"
        level: "3"
      - activity: "Human review of AI generated specifications"
        uuid: "09307f26-bf34-49c2-828e-649130876978"
        level: "2"
    summary: "The phases of spec-driven development, each left only through its review gate."
    quotes:
      - source_lines: "2202-2203"
        quote: |-
          In spec-driven development, AI-assisted work is split into explicit steps (e.g. specify, plan, implement, review).
    flows: ["F05"]
    states:
      - id: "specify"
        meaning: "Requirements and acceptance criteria are written."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "2202-2203"
            quote: |-
              In spec-driven development, AI-assisted work is split into explicit steps (e.g. specify, plan, implement, review).
      - id: "plan"
        meaning: "The plan is derived and reviewed."
        kind: "stated"
        quotes:
          - source_lines: "3640"
            quote: |-
              Between specification and code sits the plan:
      - id: "implement"
        meaning: "Implementation with self-verification."
        kind: "stated"
        quotes:
          - source_lines: "3844-3845"
            quote: |-
              Require AI agents to verify their changes against the project's own checks before presenting them,
      - id: "review"
        meaning: "Human code review before merge."
        kind: "stated"
        quotes:
          - source_lines: "4122"
            quote: |-
              Require human review for all AI-generated changes before merge.
      - id: "merged"
        meaning: "Merged after review and the independent re-run."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: "Merge is the stated boundary of review; the state after it is not named."
      - id: "abandoned"
        meaning: "The attempt ended without passing checks."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: "A budget ends the attempt; what becomes of the change is not stated."
    transitions:
      - id: "CH-T01"
        from: "specify"
        to: "plan"
        trigger: "specification-approved"
        kind: "stated"
        guards:
          - meaning: "Human review of the specification passed: the gate of the specify phase."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0061"
            candidates:
              - "C-0181"
      - id: "CH-T02"
        from: "plan"
        to: "implement"
        trigger: "plan-approved"
        kind: "stated"
        guards:
          - meaning: "Human review of the plan passed: the gate of the plan phase."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0060"
            candidates:
              - "C-0176"
      - id: "CH-T03"
        from: "implement"
        to: "review"
        trigger: "checks-pass"
        kind: "stated"
        guards:
          - meaning: "The project's own checks pass in the agent's environment."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0063"
        effects:
          - meaning: "Edits to test code are flagged for human review."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0063"
      - id: "CH-T04"
        from: "implement"
        to: "abandoned"
        trigger: "budget-ends"
        kind: "stated"
        quotes:
          - source_lines: "3831-3832"
            quote: |-
              keeps refining the change until the checks succeed or a defined budget ends the attempt.
        guards: "none stated"
