machines:
  - id: "SM01"
    name: "activity-adoption"
    object: "A team's adoption of DSOMM activities, and its level per sub-dimension"
    locator: "every activity: level, dependsOn"
    summary: >-
      Inferred throughout. The source gives every activity a level from 1 to 5 and lists
      prerequisites in dependsOn, and four sentences in three activities speak of a maturity
      level; it defines no adoption states, no meaning of level and no rule for reaching one. This
      machine is this model's reading: an activity is adopted only after its prerequisites, and a
      sub-dimension is at level n when its activities of levels 1 to n are adopted. The derived
      data and the one dependency the level reading cannot satisfy are below.
    quotes:
      - source_lines: "5919"
        quote: |-
          At maturity level 1, you perform threat modeling ad-hoc for high-risk applications and use simple threat checklists, such as STRIDE.
      - source_lines: "11058"
        quote: |-
          At this maturity level, a simple tracking system suffices - tools need only distinguish between "triaged" and "untriaged" findings, without complex categorization.
    flows: "none"
    flows_reason: >-
      the model's own level and dependsOn structure read as a lifecycle; it shares an object with no exchange of protocol.yaml
    states:
      - id: "not_adopted"
        meaning: "The team has not implemented the activity."
        kind: "inferred"
        initial: "yes"
        inferred_reason: "The model holds no implementation status of any kind."
      - id: "adopted"
        meaning: "The team has implemented the activity."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: "As not_adopted."
      - id: "level_0"
        meaning: "No level of the sub-dimension completed."
        kind: "inferred"
        inferred_reason: >-
          Levels are integers on activities; a team's level is not defined by the source.
      - id: "level_n"
        meaning: "Every activity of levels 1 to n of the sub-dimension adopted (n from 1 to 5)."
        kind: "inferred"
        inferred_reason: "Reading level as a maturity stage, as three activities do in passing."
    transitions:
      - id: "AD-T01"
        from: "not_adopted"
        to: "adopted"
        trigger: "activity-implemented"
        kind: "inferred"
        inferred_reason: >-
          dependsOn is read as a prerequisite relation: the key name is the only statement of its
          meaning.
        guards:
          - meaning: >-
              Every activity in the activity's dependsOn list is adopted (guard_table, derived by
              script).
            kind: "inferred"
      - id: "AD-T02"
        from: "level_0"
        to: "level_n"
        trigger: "level-completed"
        kind: "inferred"
        inferred_reason: "The source states no rule for a team's level."
        note: >-
          Contradicted once by the data: edges_to_a_higher_level lists a level-2 activity whose
          prerequisite is a level-3 activity in another dimension. Vacuous where a sub-dimension
          has no activity at a level (levels_absent_below_max).
        guards:
          - meaning: >-
              Every activity of the sub-dimension at the next level is adopted; with AD-T01, so
              are their prerequisites, in any sub-dimension.
            kind: "inferred"
      - id: "AD-T03"
        from: "level_n"
        to: "level_n"
        trigger: "level-completed"
        kind: "inferred"
        inferred_reason: "Each further level, as AD-T02, from n to n plus 1 up to 5."
        guards:
          - meaning: "As AD-T02, for the next level."
            kind: "inferred"
