note: >-
  Two kinds of machine. SM01 is the model's own structure read as a lifecycle: the level and
  dependsOn fields of all 251 activities, derived by script from the parsed source (no quotation:
  those fields are not prose), with every state and transition inferred, because the model defines
  neither levels nor adoption states. SM02 to SM15 are lifecycles that individual activities state
  in their own text, each with the activities it comes from. A state or transition is stated when
  the source names it, otherwise inferred with inferred_reason. guards must hold before a
  transition; effects are part of it; each lists quotations and ids with its own kind. A trigger
  is an event of the events list; flow_step names the protocol.yaml step that produces it.
  Quotations are cut by script and checked by bin/check-quotes; ids are emitted by script from a
  selector and every resolved pair was read; pass 2 (verify, 2026-11-16) re-pointed FI-T01's guard
  from R-0219 to R-0660, the hunted entry holding the sentence the guard paraphrases. The durations these lifecycles use are stated as
  examples or minimums, never as timers: a grace period like one week (SM09), a maximum image
  lifetime e.g. 30 days and base images built at least nightly (SM13), drift checks at every
  deployment and at least daily (SM06), reviews e.g. quarterly for privileged access (SM08).
  Pass 3 (cross-check) added flows to every machine: the flows of protocol.yaml that share its
  object, found from the events' flow_step and checked against the activities each side names;
  none, with a reason, where no flow does (SM01, SM11, SM12, SM14).
