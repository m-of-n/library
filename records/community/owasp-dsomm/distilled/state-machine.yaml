  - id: "SM04"
    name: "pull-request"
    object: "A pull request to a protected branch"
    locator: "Implementation / Development and Source Control"
    activities:
      - activity: "Dismiss stale PR approvals"
        uuid: "ea6f69f7-54a5-4922-ac15-a77ff0c16162"
        level: "3"
      - activity: "Approval by reviewing any new version"
        uuid: "3f63bdbc-c75f-4780-a941-e6ad42e894e1"
        level: "3"
      - activity: "Require status checks to pass"
        uuid: "ac8730a2-ccc0-465c-9550-d91edae9d5ee"
        level: "3"
      - activity: "Segregation of duties for critical actions"
        uuid: "879e1f8f-61db-4af5-bb9b-07f21ac417b8"
        level: "4"
    summary: >-
      Approval goes stale on any later commit; merge needs a current approval and passing checks.
    quotes:
      - source_lines: "7927-7929"
        quote: |-
          Implement a policy where any commits made after a pull request has been approved automatically revoke that approval, necessitating a fresh review and re-approval process.
    flows: ["F06"]
    states:
      - id: "open"
        meaning: "Opened, awaiting review."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "7166-7167"
            quote: |-
              On each new version (e.g. Pull Request) of source code or infrastructure components a security peer review of the changes is performed
      - id: "approved"
        meaning: "Approved by a reviewer other than the author."
        kind: "stated"
        quotes:
          - source_lines: "7167-7168"
            quote: |-
              a security peer review of the changes is performed (two eyes principle) and approval given by the reviewer.
      - id: "stale"
        meaning: "An approval revoked by a later commit; fresh review needed."
        kind: "stated"
        quotes:
          - source_lines: "7927-7929"
            quote: |-
              Implement a policy where any commits made after a pull request has been approved automatically revoke that approval, necessitating a fresh review and re-approval process.
      - id: "merged"
        meaning: "Merged."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: "Merge is not described."
    transitions:
      - id: "PR-T01"
        from: "open"
        to: "approved"
        trigger: "reviewer-approves"
        kind: "stated"
        guards:
          - meaning: "The approver is not the author."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0177"
              - "owasp-dsomm#R-0179"
      - id: "PR-T02"
        from: "approved"
        to: "stale"
        trigger: "commit-after-approval"
        kind: "stated"
        quotes:
          - source_lines: "7927-7929"
            quote: |-
              Implement a policy where any commits made after a pull request has been approved automatically revoke that approval, necessitating a fresh review and re-approval process.
        guards: "none stated"
      - id: "PR-T03"
        from: "stale"
        to: "approved"
        trigger: "reviewer-approves"
        kind: "stated"
        quotes:
          - source_lines: "7928-7929"
            quote: |-
              necessitating a fresh review and re-approval process.
        guards: "none stated"
      - id: "PR-T04"
        from: "approved"
        to: "merged"
        trigger: "checks-passed"
        kind: "stated"
        note: >-
          That passing checks lead to a merge is this model's; the source says only before
          proceeding.
        quotes:
          - source_lines: "7976-7977"
            quote: |-
              Mandate passing of security related specified status checks, like successful builds or static application security tests, before proceeding.
        guards:
          - meaning: "The security status checks passed."
            kind: "stated"
            quotes:
              - source_lines: "7976-7977"
                quote: |-
                  Mandate passing of security related specified status checks, like successful builds or static application security tests, before proceeding.
  - id: "SM05"
    name: "finding"
    object: "A security finding"
    locator: "Test and Verification / Consolidation"
    activities:
      - activity: "Simple false positive treatment"
        uuid: "c1acc8af-312e-4503-a817-a26220c993a0"
        level: "1"
      - activity: "Artifact-based false positive treatment"
        uuid: "8f2b4d5a-3c1e-4b7a-9d8f-2e6c4a1b5d7f"
        level: "2"
      - activity: "Integration of vulnerability issues into the development process"
        uuid: "ce970c9b-da94-41cf-bd78-8c15357b7e8e"
        level: "3"
      - activity: "Treatment of defects with high or critical severity"
        uuid: "44f2c8a9-4aaa-4c72-942d-63f78b89f385"
        level: "1"
      - activity: "Integration in development process"
        uuid: "aaffa73f-59f6-4267-b0ab-732f3d13e90d"
        level: "3"
    summary: >-
      Untriaged, then triaged as a false positive, an accepted risk or a real vulnerability;
      suppressions scoped to an artifact come back for later releases; real findings are tracked
      to a fix and gate the release by severity.
    quotes:
      - source_lines: "11058"
        quote: |-
          At this maturity level, a simple tracking system suffices - tools need only distinguish between "triaged" and "untriaged" findings, without complex categorization.
    flows: ["F10"]
    states:
      - id: "untriaged"
        meaning: "Reported, not yet triaged."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "11058"
            quote: |-
              tools need only distinguish between "triaged" and "untriaged" findings,
      - id: "false_positive"
        meaning: "Triaged as a false positive; suppressed and documented."
        kind: "stated"
        quotes:
          - source_lines: "11055"
            quote: |-
              - Track accepted risks vs false positives
      - id: "accepted_risk"
        meaning: "Triaged as a real risk the organization accepts, possibly temporarily."
        kind: "stated"
        quotes:
          - source_lines: "11055"
            quote: |-
              - Track accepted risks vs false positives
          - source_lines: "11163"
            quote: |-
              Implement false positive marking and temporary acceptance of findings
      - id: "tracked"
        meaning: "A real vulnerability in the team's issue system."
        kind: "stated"
        quotes:
          - source_lines: "11481"
            quote: |-
              Vulnerabilities are tracked in the teams issue system (e.g. jira).
      - id: "fixed"
        meaning: "Resolved."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "11122"
            quote: |-
              - Track these issues and make sure they are resolved quickly.
    transitions:
      - id: "FI-T01"
        from: "untriaged"
        to: "false_positive"
        trigger: "triaged-false-positive"
        kind: "stated"
        guards:
          - meaning: "A human decided; an AI verdict is input only."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0660"
        effects:
          - meaning: "Outcome persisted so later runs do not re-analyse it."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0221"
            candidates:
              - "C-0569"
      - id: "FI-T02"
        from: "untriaged"
        to: "accepted_risk"
        trigger: "triaged-accepted"
        kind: "stated"
        effects:
          - meaning: "Documented as an accepted risk."
            kind: "stated"
            candidates:
              - "C-0570"
      - id: "FI-T03"
        from: "untriaged"
        to: "tracked"
        trigger: "triaged-true-positive"
        kind: "stated"
        effects:
          - meaning: "Added to the product team's backlog with the reproduction procedure."
            kind: "stated"
            quotes:
              - source_lines: "11395-11396"
                quote: |-
                  Integration of findings into the development process. E.g. adding findings to the backlog of products teams.
      - id: "FI-T04"
        from: "false_positive"
        to: "untriaged"
        trigger: "new-release-of-artifact"
        kind: "stated"
        note: >-
          Scoped to an artifact, a suppression keeps the finding visible for future releases; a
          global decision applies to all applications instead.
        quotes:
          - source_lines: "11168-11170"
            quote: |-
              Artifact-based false positive treatment enables more granular control over finding suppression by linking decisions to specific code artifacts, container images, or application versions.
        guards: "none stated"
      - id: "FI-T05"
        from: "accepted_risk"
        to: "untriaged"
        trigger: "new-release-of-artifact"
        kind: "stated"
        note: "Temporary acceptance per artifact; how long it lasts is not stated."
        quotes:
          - source_lines: "11163"
            quote: |-
              Implement false positive marking and temporary acceptance of findings
        guards: "none stated"
      - id: "FI-T06"
        from: "tracked"
        to: "fixed"
        trigger: "fixed"
        kind: "stated"
        guards:
          - meaning: "High and critical findings are fixed before release approval."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0224"
              - "owasp-dsomm#R-0666"
  - id: "SM06"
    name: "deployed-state-drift"
    object: >-
      Deployed infrastructure, configuration, agent instructions and guardrails against their
