        kind: "stated"
        error: "yes"
        quotes:
          - source_lines: "4432-4435"
            quote: |-
              Deployed instructions and guardrails can be changed past the review process: through a quick hotfix, direct console access, a compromised pipeline or an agent writing to its own configuration.
