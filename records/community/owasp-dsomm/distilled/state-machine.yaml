        guards: "none stated"
  - id: "SM07"
    name: "canary-release"
    object: "A new artifact version released by canary"
    locator: "Build and Deployment / Deployment / Canary deployment"
    activities:
      - activity: "Canary deployment"
        uuid: "c4204a32-2545-4424-b524-d1cc52b46abd"
        level: "4"
    summary: >-
      Canary, promoted step by step on passing gates, rolled back automatically on a failing one.
    quotes:
      - source_lines: "5394-5400"
        quote: |-
          Adopt a canary deployment strategy in which a small percentage of production traffic (commonly 1-10%) is routed to the new artifact version for a defined observation window. Promotion to higher traffic percentages is gated on automated SLI checks (error rate, latency, saturation) and security checks (DAST, runtime anomaly detection). Rollback must be automated and triggered by gate failure without human intervention.
    flows: ["F12"]
    states:
      - id: "canary"
        meaning: "A small share of traffic (commonly 1-10%) for an observation window."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "5394-5396"
            quote: |-
              Adopt a canary deployment strategy in which a small percentage of production traffic (commonly 1-10%) is routed to the new artifact version for a defined observation window.
      - id: "promoted"
        meaning: "At a higher traffic percentage."
        kind: "stated"
        quotes:
          - source_lines: "5396-5397"
            quote: |-
              Promotion to higher traffic percentages
      - id: "full"
        meaning: "Serving the broader production population."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: >-
          The source names the broader population the rollback protects, not a final stage.
      - id: "rolled_back"
        meaning: "Traffic rolled back to the previous version."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "5399-5400"
            quote: |-
              Rollback must be automated and triggered by gate failure without human intervention.
    transitions:
      - id: "CA-T01"
        from: "canary"
        to: "promoted"
        trigger: "gates-pass"
        kind: "stated"
        guards:
          - meaning: "Automated SLI and security checks pass."
            kind: "stated"
            candidates:
              - "C-0248"
      - id: "CA-T02"
        from: "promoted"
        to: "promoted"
        trigger: "gates-pass"
        kind: "stated"
        guards:
          - meaning: "As CA-T01, for each higher percentage."
            kind: "stated"
            candidates:
              - "C-0248"
      - id: "CA-T03"
        from: "promoted"
        to: "full"
        trigger: "gates-pass"
        kind: "inferred"
        inferred_reason: "The last promotion; not named."
        guards: "none stated"
      - id: "CA-T04"
        from: "canary"
        to: "rolled_back"
        trigger: "gate-fails"
        kind: "stated"
        effects:
          - meaning: "Automatic, without human intervention; the decision is kept in the audit log."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0103"
            candidates:
              - "C-0251"
      - id: "CA-T05"
        from: "promoted"
        to: "rolled_back"
        trigger: "gate-fails"
        kind: "stated"
        effects:
          - meaning: "As CA-T04."
            kind: "stated"
            ids:
              - "owasp-dsomm#R-0103"
