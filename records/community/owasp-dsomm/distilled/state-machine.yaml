            kind: "stated"
            candidates:
              - "C-0243"
      - id: "DR-T03"
        from: "drifted"
        to: "in_sync"
        trigger: "re-approved"
        kind: "stated"
        note: "The approved state becomes the re-approved one."
        guards:
          - meaning: "The change passed the regular review process."
            kind: "stated"
            candidates:
              - "C-0243"
              - "C-0215"
      - id: "DR-T04"
        from: "drifted"
        to: "in_sync"
        trigger: "exception-documented"
        kind: "stated"
        quotes:
          - source_lines: "5174-5175"
            quote: |-
