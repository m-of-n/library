        action: >-
          Leave the agent environment only through the enforced egress point, to allow-listed
          endpoints; deny all other egress.
        activity: "Network isolation for AI agents"
        activity_uuid: "951e6090-057b-4dc4-8b4f-18c6adcfc1ab"
        activity_level: "3"
        kind: "stated"
        basis: "measure"
        quotes:
          - source_lines: "3249-3251"
            quote: |-
              Limit network access of AI agent environments to an allow-list of required endpoints (e.g. model API, package registries, source code management system). Deny all other egress traffic by default.
        candidates:
          - "C-0152"
        order: "inferred"
        on_error: "see F09-E2"
        on_error_basis: "stated"
      - n: "6"
        from:
          - "egress_proxy"
        to:
          - "external_system"
        message: "CredentialInjection"
        condition: "The external system supports it."
        action: >-
          Inject the agent's short-lived, minimally scoped credentials at the network boundary, so
          the agent never holds them.
        activity: "Least privilege on external systems for AI agents"
        activity_uuid: "45f722b2-25b4-472a-a743-f7207a77b5c9"
        activity_level: "3"
        kind: "stated"
        basis: "measure"
        quotes:
