provisions_not_in_flows:
  - what: >-
      The 194 activities not listed under any flow's activities: mostly practices of one party
      (hardening, tests, metrics, training, logging configuration, inventories).
    why: >-
      None states a hand-over between parties with steps or an outcome; the near misses are the
      entries below. They are requirements (requirements.yaml), not flows.
  - what: "Security consulting on request, office hours, security champions."
    why: "A team may ask and an expert answers; no step, content or outcome of the exchange is stated."
    quotes:
      - source_lines: "6490"
        quote: |-
          Make security consulting available to teams on request, ensuring that expert advice is accessible when needed to address security concerns during development.
  - what: "Instructed load of security rules (instruction-file mapping)."
    why: "The probabilistic twin of F05 step 6; the source says following it is up to the model."
    quotes:
      - source_lines: "935-937"
        quote: |-
          The approach is probabilistic: following the instruction is up to the model and can fail in long sessions, after context compaction or when many instructions compete.
    related:
      - "owasp-dsomm#R-0014"
  - what: "Patching mean time to resolution via PR (time from opening an automated PR to merging it)."
    why: >-
      Its measure (lines 10657 to 10663) is a double-quoted scalar whose lines hold literal
      escapes, so it is not quoted; F08 step 7 carries its sibling measure via production.
open_issues:
  - id: "OI-01"
    issue: >-
      The model never defines its levels: level is an integer from 1 to 5 on every activity, and
      only four sentences, in three activities, use the phrase maturity level of DSOMM's own
      levels (its other occurrences describe SAMM's or OWASP AIMA's levels), none defining it.
      state-machine.yaml SM01 therefore reads the levels as stages only by inference, and several
      sub-dimensions have no activity at some level below their highest (SM01
      levels_absent_below_max).
    quotes:
      - source_lines: "5919"
        quote: |-
          At maturity level 1, you perform threat modeling ad-hoc for high-risk applications and use simple threat checklists, such as STRIDE.
  - id: "OI-02"
    issue: >-
      dependsOn is never explained in the model; one dependency runs from a level-2 activity to a
      level-3 one (state-machine.yaml SM01), which no level-gated reading can satisfy within level
      2.
    quotes:
      - source_lines: "13785-13786"
        quote: |-
          this activity depends on 'Usage of a maximum life for images'.
