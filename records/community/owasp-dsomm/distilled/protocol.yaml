          Technical controls (e.g. AI gateways/proxies, secret scanners on prompts, DLP filters) automatically detect and block sensitive data such as secrets, access tokens and personal data before it is sent to external AI services.
    summary: >-
      Prompts and attachments pass a gateway that looks for secrets and personal data and stops or
      strips them, enforces rate and input limits and keeps an audit trail; agent traffic leaves
      through one enforced egress point with an allow-list, which can also inject short-lived
      credentials so the agent never holds them; budgets and iteration caps stop runaway agents.
    order_note: >-
      Stated: step 2 before the prompt is sent; step 3's limits before the request reaches the
      model. Steps 5 to 7 are not placed.
