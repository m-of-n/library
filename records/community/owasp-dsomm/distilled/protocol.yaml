    trigger: "An agent in a multi-agent workflow delegates a task to another agent."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "3492-3493"
        quote: |-
          In multi-agent systems, agents delegate tasks to other agents, and the trust relationships between them are dynamic and often implicit.
    summary: >-
      Every delegation is treated like an external request: agents join a workflow only through a
      registry that verifies identity and descriptors; each has its own identity and credentials;
      the delegated task carries only the permissions it needs; the channel is mutually
      authenticated and signed, with replay protection and downgrade rejection; the receiving
      agent verifies the delegator at every step; the communication is recorded.
    order_note: >-
      Stated: step 3 at every step of the workflow. Steps 1 and 2 precede 3 by their nature; step
      5 is not placed.
    steps:
      - n: "1"
        from:
          - "agent_registry"
        to:
          - "peer_agent"
        message: "AgentAdmission"
        action: >-
          Let an agent join the workflow only through a registry that checks its identity and
          descriptor.
        activity: "Trust boundaries between AI agents"
        activity_uuid: "abe74dfd-d554-4ec5-8b94-f75d352afaaa"
        activity_level: "4"
        kind: "stated"
        basis: "measure"
        quotes:
          - source_lines: "3533-3535"
            quote: |-
              Accept agents into a workflow only from a registry or discovery mechanism that verifies agent identity and descriptors.
        candidates:
          - "C-0169"
        order: "first"
        on_error: "see F02-E2"
        on_error_basis: "stated"
      - n: "2"
        from:
          - "ai_agent"
        to:
          - "peer_agent"
        message: "DelegationRequest"
        action: >-
          Delegate the task under the agent's own identity, scoped to the minimum permissions it
          needs, over a mutually authenticated channel with signed messages, replay protection
          (nonces, expiry times) and rejection of protocol downgrades.
        activity: "Trust boundaries between AI agents"
        activity_uuid: "abe74dfd-d554-4ec5-8b94-f75d352afaaa"
        activity_level: "4"
        kind: "stated"
        basis: "measure"
        quotes:
          - source_lines: "3526-3528"
            quote: |-
              Scope each delegated task to the minimum permissions it needs instead of passing on the delegating agent's access context.
          - source_lines: "3530-3533"
            quote: |-
              Secure the communication channel itself with mutual authentication and signed messages (e.g. mutual TLS), replay protection (e.g. nonces and expiry times) and rejection of protocol downgrades.
