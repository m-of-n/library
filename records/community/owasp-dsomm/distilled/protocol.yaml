flows:
  - id: "F01"
    name: "agent-action-approval"
    title: "Approving an AI agent's action"
    locator: "Agentic AI / Isolation"
    activities:
      - activity: "Human approval for irreversible AI agent actions"
        uuid: "cd1cb2bd-4bd6-4b9f-beaa-921fe9ea9576"
        level: "4"
      - activity: "Secure output handling in AI applications"
        uuid: "24990a5e-b0e6-4e2c-b06b-4e9f0d6f7b21"
        level: "4"
      - activity: "Permission management for AI agents"
        uuid: "4a618049-19da-4e20-b933-81f203ecd4d2"
        level: "2"
    participants:
      - "organization"
      - "ai_agent"
      - "approval_gate"
      - "human_reviewer"
      - "second_approver"
      - "audit_log"
    trigger: "A running agent is about to perform a business action through its tools."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "3390-3391"
        quote: |-
          this activity governs the business actions an agent performs through those tools.
    summary: >-
      Action classes carry an approval tier by reversibility: irreversible actions wait for
      explicit human approval before execution (two independent approvers when high-risk),
      reversible actions with business impact run buffered with an intervention window, low-risk
      reversible actions run autonomously. Where reversibility cannot be shown, pre-approval is
      the default. Approvals are recorded with approver, context and reason, and the approver must
      see the action and its context.
    order_note: >-
      Stated: step 3 before execution; step 7 after approval; step 8 delays delivery for the
      window. Step 1 precedes everything (classification).
    steps:
      - n: "1"
        from:
          - "organization"
        to:
          - "organization"
        message: "ActionClassification"
        action: >-
          Sort agent action types by how reversible they are and give each a tier: approval first
          for irreversible ones, a monitored window for reversible ones that matter to the
          business, autonomy for harmless reversible ones; unproven reversibility means approval
          first.
        activity: "Human approval for irreversible AI agent actions"
        activity_uuid: "cd1cb2bd-4bd6-4b9f-beaa-921fe9ea9576"
        activity_level: "4"
        kind: "stated"
        basis: "measure"
        quotes:
