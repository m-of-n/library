      - id: "F14-E1"
        at: "5"
        condition: >-
          Service accounts, OAuth clients, tokens, permissions or registrations survive the
          shutdown.
        outcome: >-
          An attacker can take over the orphaned identity unnoticed; the checklist is not complete
          until verification shows zero residual access.
        kind: "stated"
        quotes:
          - source_lines: "1485-1491"
            quote: |-
              Shut-down agents leave residual access behind: service accounts and OAuth clients stay active, issued tokens remain valid, agent-specific permissions and policies persist, and registrations in dependent systems (message brokers, queues, caches, third-party software as a service integrations) keep working. An attacker takes over such an orphaned identity, and nobody notices because the agent is no longer monitored.
