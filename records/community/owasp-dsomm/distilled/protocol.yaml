        from:
          - "security_team"
        to:
          - "vuln_management"
        message: "ScopedSuppression"
        condition: "The decision is to be scoped to an artifact, or to apply organization-wide."
        action: >-
          Mark the false positive or temporary acceptance per artifact (application, component,
          repository, version), visible again for future releases, or globally, applying to all
          applications in the environment.
        activity: "Artifact-based false positive treatment"
        activity_uuid: "8f2b4d5a-3c1e-4b7a-9d8f-2e6c4a1b5d7f"
        activity_level: "2"
        kind: "stated"
        basis: "measure"
        quotes:
