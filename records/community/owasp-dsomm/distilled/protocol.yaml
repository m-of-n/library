role_rules:
  - id: "RR-1"
    rule: >-
      An agent's actions must stay attributable to a human principal, across multi-agent chains;
      agent identities are distinct from human ones.
    kind: "stated"
    quotes:
      - source_lines: "1355-1357"
        quote: |-
          This keeps every agent action attributable to a human principal, even across multi-agent chains.
  - id: "RR-2"
    rule: >-
      Every agent has its own identity and credentials; shared credentials undo the
      compartmentalization of splitting agents.
    kind: "stated"
    quotes:
      - source_lines: "3525-3526"
        quote: |-
          Give every agent its own identity and its own credentials, never shared between agents.
    related_candidates:
      - "C-0168"
  - id: "RR-3"
    rule: "No single identity both introduces and approves a sensitive change (segregation of duties)."
    kind: "stated"
    quotes:
      - source_lines: "8658-8659"
        quote: |-
          Conflicting responsibilities are split across different identities so that no single person can both introduce and approve a sensitive change.
    related:
      - "owasp-dsomm#R-0177"
