    title: "AI traffic through the gateway and the egress point"
    locator: "Agentic AI / Data Protection; Agentic AI / Isolation"
    activities:
      - activity: "Automated data leak detection for AI interactions"
        uuid: "8d5ce64e-ebf0-45ab-93cb-d592287e3023"
