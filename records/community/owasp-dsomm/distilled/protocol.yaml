        message: "PromptTraffic"
        action: "Send prompts and attachments for external AI services through the gateway."
        activity: "Automated data leak detection for AI interactions"
        activity_uuid: "8d5ce64e-ebf0-45ab-93cb-d592287e3023"
        activity_level: "4"
        kind: "stated"
        basis: "measure"
        quotes:
