        uuid: "9cac3341-fe83-4079-bef2-bfc4279eb594"
        level: "3"
      - activity: "Treatment of all defects"
        uuid: "b2f77606-3e6c-41e9-b72d-7c0b1d3d581d"
        level: "5"
      - activity: "Exploit likelihood estimation"
        uuid: "f2f0f274-c1a0-4501-92fe-7fc4452bc8ad"
        level: "2"
    participants:
      - "security_tests"
      - "vuln_management"
      - "triage_assistant"
      - "security_team"
      - "development_team"
      - "ci_pipeline"
    trigger: "A security test produces a finding."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "11053"
        quote: |-
          Findings from security tests must be triaged and outcomes persisted/documented to:
    summary: >-
      Findings are aggregated in one tool, triaged and the outcome persisted (false positive,
      accepted risk, true positive), at first only as triaged versus untriaged; AI may propose a
      verdict but a human decides. Suppressions can be scoped per artifact or global. Real
      findings enter the product team's backlog with a reproduction procedure, either validated by
      security engineers first or pushed directly; high and critical findings block release, and
      the quality gate widens to medium and then all severities.
    order_note: >-
      Stated: step 3 before the outcome is persisted and reused; step 6 before release. Two routes
      for step 5 are stated as alternatives with pros and cons.
    steps:
      - n: "1"
        from:
          - "security_tests"
        to:
          - "vuln_management"
        message: "Finding"
        action: "Aggregate findings in one tool."
        activity: "Usage of a vulnerability management system"
        activity_uuid: "85ba5623-84be-4219-8892-808837be582d"
        activity_level: "3"
        kind: "stated"
        basis: "measure"
        quotes:
          - source_lines: "11627-11628"
            quote: |-
              Aggregation of vulnerabilities in one tool reduce the workload to handle them, e.g. mark as false positives.
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "triage_assistant"
        to:
          - "security_team"
        message: "TriageProposal"
        condition: "AI supports triage."
        action: >-
          With the finding and the surrounding code, assess reachability and exploitability,
          propose a verdict with reasoning and draft the documentation.
        activity: "Simple false positive treatment"
        activity_uuid: "c1acc8af-312e-4503-a817-a26220c993a0"
        activity_level: "1"
        kind: "stated"
        basis: "permission"
        quotes:
          - source_lines: "11044-11047"
            quote: |-
              a language model with access to the finding and the surrounding code can assess reachability and exploitability in context, propose a triage verdict with reasoning and draft the documentation of the decision.
        constrained_by:
          - "owasp-dsomm#R-0658"
        order: "inferred"
        on_error: "see F10-E4"
        on_error_basis: "stated"
      - n: "3"
        from:
          - "security_team"
        to:
          - "vuln_management"
        message: "TriageDecision"
        action: >-
          Triage the finding and persist the outcome, to prevent re-analysis, track accepted risks
          against false positives and keep decisions consistent across teams; at first a simple
          triaged versus untriaged distinction suffices.
        activity: "Simple false positive treatment"
        activity_uuid: "c1acc8af-312e-4503-a817-a26220c993a0"
        activity_level: "1"
        kind: "stated"
        basis: "measure"
        quotes:
          - source_lines: "11053-11056"
            quote: |-
              Findings from security tests must be triaged and outcomes persisted/documented to: - Prevent re-analysis of known issues in subsequent test runs - Track accepted risks vs false positives - Enable consistent decision-making across teams
          - source_lines: "11058"
            quote: |-
              At this maturity level, a simple tracking system suffices - tools need only distinguish between "triaged" and "untriaged" findings, without complex categorization.
        constrained_by:
          - "owasp-dsomm#R-0221"
        candidates:
          - "C-0569"
          - "C-0570"
          - "C-0572"
        order: "stated"
        order_reason: "Triaged, then the outcome persisted for later runs."
        on_error: "see F10-E1"
        on_error_basis: "stated"
