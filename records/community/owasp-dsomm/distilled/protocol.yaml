        activity: "Integration in development process"
        activity_uuid: "aaffa73f-59f6-4267-b0ab-732f3d13e90d"
        activity_level: "3"
        kind: "stated"
        basis: "measure"
        quotes:
          - source_lines: "11395-11396"
            quote: |-
              Integration of findings into the development process. E.g. adding findings to the backlog of products teams.
          - source_lines: "11481"
            quote: |-
              Vulnerabilities are tracked in the teams issue system (e.g. jira).
          - source_lines: "11751-11753"
            quote: |-
              Vulnerabilities include the test procedure to give the staff from operations and development the ability to reproduce vulnerabilities. This enhances the understanding of vulnerabilities and therefore the fix have a higher quality.
        also_quotes:
          - activity: "Integration of vulnerability issues into the development process"
            uuid: "ce970c9b-da94-41cf-bd78-8c15357b7e8e"
            level: "3"
          - activity: "Reproducible defect tickets"
            uuid: "27337442-e4b1-4e87-8dc9-ce86fbb79a39"
            level: "4"
        related_candidates:
