            quote: |-
              Implement false positive marking and temporary acceptance of findings
          - source_lines: "11168-11170"
            quote: |-
              Artifact-based false positive treatment enables more granular control over finding suppression by linking decisions to specific code artifacts, container images, or application versions.
          - source_lines: "11354"
            quote: |-
              Implement global false positive and acceptance management that applies
        also_quotes:
          - activity: "Global false positive treatment"
            uuid: "9e3a7c2f-1b4d-4e8a-a5c6-7f2b9d1e3a8c"
            level: "3"
        related:
