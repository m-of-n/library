extracted_by: "FX-1 pass 1 (extract), protocol and state-machine lane, effort max, from the source only (blind: no summary, no record.yaml distillation block, no other lane's files; requirements.yaml and inferred-candidates.yaml read for ids and texts only, by script)."
source:
  file: ".cache/owasp-dsomm.txt"
  what: "generated/model.yaml of DevSecOps-MaturityModel-data at tag v5.1.0, the source of record"
  sha256: "319f86d788484f03ac70e39ad1dfb31c09b54a90c38c73abeb6dc945beb68e55"
  lines: "13977"
  reading: "bin/_source_text YAML profile: block-scalar and multi-word inline values are prose, keys blanked"
applicability: >-
  DSOMM defines no wire protocol and no exchange between the parties of the model itself: it is a
  catalogue of 251 activities (dimension, sub-dimension, description, risk, measure, assessment,
  level, dependsOn, implementation, references). Activity texts, however, state fourteen exchanges
  between distinct parties: human approval of agent actions, agent-to-agent delegation, the gates
  an agent's push and an AI-assisted change pass through, containment of an anomalous agent,
  review and merge of a pull request, privileged access, automated dependency updates, AI traffic
  through a gateway, finding triage, component adoption, canary releases, drift response and agent
  decommissioning. Each is a flow here, assembled from the activities whose texts state or bind
  its steps (57 activities in all, listed per flow under activities and computed from the lines
  each quotation and cited id comes from). Most steps of a flow come from one activity each; a
  step whose quotations come from several names them under also_quotes. The other 194 activities
  state no exchange this model treats as a flow (provisions_not_in_flows names the near misses)
  and are carried by requirements.yaml. Steps, orderings and outcomes the source does not state
  are marked inferred or unspecified.
conventions:
  quoting: >-
    Every quotation is a quotes item of source_lines and quote, cut by script from
    .cache/owasp-dsomm.txt as bin/_source_text reads a YAML data model (block-scalar and
    multi-word inline values only, keys blanked, whitespace collapsed) between two anchors, never
    typed; the range is the tightest that holds the words, and no quotation spans two fields.
    Lines of double-quoted scalars carry literal backslash escapes in the source; no quotation
    here includes one (the cutting script refuses them), and none includes the placeholder text
    the source holds at lines 6616, 8882, 13689 and 13690. bin/check-quotes verifies every
    quotation.
  activity: >-
    activity names the DSOMM activity that states the step; activity_uuid and activity_level are
    that activity's uuid and level fields, emitted from the parsed model by script. The
    requirements lane adds one requirement per activity with id owasp-dsomm#<activity uuid>; pass
    3 wires each step to it through activity_uuid.
  step_kind: >-
    kind stated: the source names the act. kind inferred: this model's step, with inferred_reason.
    basis says where the act is named: measure (the activity's measure, an imperative or a
    description of the practice), description, risk (named as the danger the activity removes),
    assessment (an assessment item: what is shown or demonstrated), permission (a can or may),
    presupposed (the source assumes it).
  order: >-
    order first, stated or inferred. stated: the source fixes the position (before, after, only
    after, until, first, then, at every step); order_reason says which. inferred: the source does
    not place it.
  on_error_basis: >-
    stated: the source says what follows a failure. unspecified: the source names the act and says
    nothing about its failure. inferred: this file's reading.
  constrained_by: >-
    Ids of requirements.yaml (R-NNNN, every sentence of the model holding a directive verbal form)
    whose text binds the step; candidates lists inferred-candidates.yaml ids (C-NNNN) that do the
    same. related and related_candidates name entries giving the step's purpose or context. An
    inferred step never carries constrained_by. Most DSOMM measures hold no verbal form, so a
    stated step with no id is common; its binding is the activity-level requirement named by
    activity_uuid.
  id_emission: >-
    Every id was emitted by script from a selector (line range plus a phrase of the entry's text)
    over the skeleton entries R-0001 to R-0244 and candidates C-0001 to C-0622; the selector
    refuses zero or several matches, split children, inferred entries and activity-level entries
    are not considered, and every resolved pair was printed and read. Pass 2 (verify, 2026-11-16)
    re-read every pair against the requirements lane's final entries and changed eleven: F10-E4
    cites R-0660, the hunted entry holding the sentence it quotes, where R-0219 holds the
    sentences before it; F08.1's C-0260 is the other sentence of the line its quotation comes
    from, and moved to related_candidates; entries that requirements.yaml classes descriptive
    (F05.1, F05-E3, F06.3, F11-E2, F13-E1) moved from constrained_by to related, and candidates
    it rejected (F02-E3, F05-E4, F12-E1) from candidates to related_candidates, because neither
    binds the step.
    Pass 3 (cross-check) re-pointed four citations of a split parent to the child that holds the
    form: F10.2 from R-0219 to R-0658 (the permission, can), and F10.6, F10-E3 and FI-T06 of
    state-machine.yaml from R-0222 to R-0666 (the must); ids by script.
  messages: >-
    message is the work product a step hands over or produces; it names an entry of work_products,
    this file's vocabulary. None of them is a structure of the DSOMM data model itself, which
    messages.yaml carries. Pass 3 joined the two: each work product has structure none and a
    structure_reason, none of the 92 being carried by a structure of the model file.
