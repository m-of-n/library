schema: "library-messages/v1"
record: owasp-dsomm
reviewed_by: ""
note: "DSOMM defines no wire protocol: the source IS a YAML data model (generated/model.yaml), so its messages are the structures that file is built from. No published schema binds it (the publisher's own JSON Schemas (draft-07, src/assets/YAML/schemas/ at the same tag) describe its per-dimension source files, where implementation items are $ref links, and reject generated/model.yaml, which inlines them), and the file states no field types or required-ness. Every type and required flag below is DERIVED by script (distilled/schema/build.derived.py) from what the file contains: required means present in all instances (251 activities, 551 implementation items, 1 meta mapping); present_in gives the measured count. No stated requirement constrains a structural field; the activity-level requirement entries are about what an activity says, not about the shape of the file. How a field of every activity is read is stated by 8 kind: inferred entries of requirements.yaml (locator model: every activity), so 7 activity fields are constrained_by them (10 links, wired by script from requirements.yaml by the verify pass); every other field has constrained_by empty and an inferred_reason. Derived JSON Schemas are in schema/."
