distillation:
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "the whole v2.2.0 model verbatim — 3 maturity levels, 24 answer sets, 5 functions, 15 practices, 45 practice-level objectives, 30 streams, 90 activities (all fields), 90 questions, 295 quality criteria — each with its file locator and requirement id"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "415 entries: 30 streams + 90 activities + 295 quality criteria, library-requirements/v2, verbatim texts (all checked as substrings of the source rendering), 506 maps_to links taken only from OWASP's published mappings; BCP 14 count 0 = 0 with the model-unit baseline reconciled in the header"
      reviewed_by: ""
    - kind: requirements
      path: distilled/crosswalk.yaml
      coverage: "every row of the OWASP SAMM mappings spreadsheet (SSDF 1.1 77, BSIMM14 125, IEC 62443-4-1 60, NIST CSF 2.0 83, Microsoft SDL 47, Threat Modeling Capabilities 36) and the NIST-OLIR SSDF workbook (77 stream rows, 81 activity rows) with the relationship vocabulary; IEC 62443-4-1 requirement descriptions intentionally omitted"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "derived JSON Schema for the 8 document types (Function, Practice, Stream, MaturityLevel, PracticeLevel, Activity, Question, AnswerSet) with template comments as descriptions and GUID reference targets; validates all 302 files under a YAML 1.2 loader (PyYAML/YAML 1.1 reads the unquoted answer text `No` as boolean false in all 24 answer sets — source defect noted in the schema); SAMM ships no schema of its own"
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "3 stated maturity levels plus implied level 0; the toolbox scoring function (answer value, level, practice, function, overall) with the spreadsheet cell formulas; transitions are inferred and carry no guards because the toolbox does not gate levels"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: "3 constructed scoring fixtures with expected practice scores and a checker (all pass), plus all 24 answer sets verbatim; SAMM publishes no worked examples"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "adopt / adapt / reject against R-040..R-044, DEC-009, ARCH-0001-PROPOSAL §2b/§3b/§4/§5 and MAP-0001; 6 open questions including source defects (3 non-existent TMC ids, relatedActivities semantics, edition-drifted BSIMM14 and MS SDL 10.1 targets) and a licence inconsistency"
      reviewed_by: ""
    - kind: diagram
      path: distilled/object-model.yaml
      coverage: "object-model pass: 19 objects and 22 edges each with locator (16 stated from the typed YAML or toolbox, Evidence edge inferred-absent), Mermaid class diagram in object-model.md, 6 gaps against tmodel"
      reviewed_by: ""
  not_applicable:
    - kind: messages
      reason: "SAMM defines no messages, envelopes or wire structures; its only structured data are the model files themselves, which are covered by distilled/schema."
    - kind: protocol
      reason: "No exchange between parties is defined. The assessment is an interview procedure (toolbox Getting Started steps 1-6) with no messages, roles exchanging data or error paths; its procedural content is recorded in object-model.yaml (Assessment, Answer, Roadmap) and state-machine.yaml (scoring)."
