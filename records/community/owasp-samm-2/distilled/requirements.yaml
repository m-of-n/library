    business_function: "Design"
    security_practice: "D-TA Threat Assessment"
    stream: "D-TA-A Application Risk Profile"
    maturity_level: 2
    practice_level_objective: "Standardization and enterprise-wide analysis of software-related threats within the organization."
    locator: "model/activities/D-TA-2-A.yml (longDescription; level via model/practice_levels/D-TA-2.yml)"
    short_title: "Inventory risk profiles"
    benefit: "Solid understanding of the risk level of your application portfolio"
    short_description: "Understand the risk for all applications in the organization by centralizing the risk profile inventory for stakeholders."
    text: "The goal of this activity is to thoroughly understand the risk level of all applications within the organization, to focus the effort of your software assurance activities where it really matters.\n\nFrom a risk evaluation perspective, the basic set of questions is not enough to thoroughly evaluate the risk of all applications. Create an extensive and standardized way to evaluate the risk of the application, including through their impact on information security (confidentiality, integrity, and availability of data). In addition to security, you also want to evaluate the privacy risk of the application. Understand the data that the application processes and what potential privacy violations are relevant. Finally, study the impact that this application has on other applications within the organization (e.g., the application might be modifying data that was considered read-only in another context). Evaluate all applications within the organization, including all existing and legacy ones.\n\nLeverage business impact analysis to quantify and classify application risk. A simple qualitative scheme (such as high/medium/low) is not enough to effectively manage and compare applications on an enterprise-wide level.\n\nBased on this input, Security Officers leverage the classification to define the risk profile to build a centralized inventory of risk profiles and manage accountability. This inventory gives Product Owners, Managers, and other organizational stakeholders an aligned view of the risk level of an application in order to assign appropriate priority to security-related activities."
    expects_deliverables: []
    verification: "assessment question model/questions/D-TA-2-A.yml: Do you use centralized and quantified application risk profiles to evaluate business risk? (answer set A); scored by the 4 quality criteria D-TA-2-A-Q1-C1..C4"
