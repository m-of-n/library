    practice_level_objective: "Direct the software design process toward known secure services and secure-by-default designs."
    locator: "model/activities/D-SA-2-A.yml (longDescription; level via model/practice_levels/D-SA-2.yml)"
    short_title: "Provide preferred security solutions"
    benefit: "Reusable security services available for product teams"
    short_description: "Establish common design patterns and security solutions for adoption."
    text: "Identify shared infrastructure or services with security functionality. These typically include single-sign-on services, access control or entitlements services, logging and monitoring services or application-level firewalling. Collect and evaluate reusable systems to assemble a list of such resources and categorize them by the security mechanism they fulfill. Consider each resource in terms of why a product team would want to integrate with it, i.e., the benefits of using the shared resource.\n\nIf multiple resources exist in each category, select and standardize on one or more shared services per category. Because future software development will rely on these services, review each thoroughly to ensure understanding of the baseline security posture. For each selected service, create design guidance for product teams to understand how to integrate with the system. Make the guidance available through training, mentorship, guidelines, and standards.\n\nEstablish a set of best practices representing sound methods of implementing security functionality. You can research them or purchase them, and it is often more effective if you customize them so they are more specific to your organization. Example patterns include a single-sign-on subsystem, a cross-tier delegation model, a separation-of-duties authorization model, a centralized logging pattern, etc.\n\nThese patterns can originate from specific projects or applications, but make sure you share them among different teams across the organization for efficient and consistent application of appropriate security solutions.\n\nTo increase adoption of these patterns, link them to the shared security services, or implement them into actual component solutions that can be easily integrated into an application during development. Support the key technologies within the organization, for instance in the case of different development stacks. Treat these solutions as actual applications with proper support in case of questions or issues."
    expects_deliverables: []
    verification: "assessment question model/questions/D-SA-2-A.yml: Do you use shared security services during design? (answer set A); scored by the 3 quality criteria D-SA-2-A-Q1-C1..C3"
