    locator: "model/activities/G-EG-1-B.yml (longDescription; level via model/practice_levels/G-EG-1.yml)"
    short_title: "Identify security champions"
    benefit: "Basic embedding of security in the development organization"
    short_description: "Identify a \"Security Champion\" within each development team."
    text: "Implement a program where each software development team has a member considered a \"Security Champion\" who is the liaison between Information Security and developers. Depending on the size and structure of the team the \"Security Champion\" may be a software developer, tester, or a product manager. The \"Security Champion\" has a set number of hours per week for Information Security related activities. They participate in periodic briefings to increase awareness and expertise in different security disciplines. \"Security Champions\" have additional training to help develop these roles as Software Security subject-matter experts. You may need to customize the way you create and support \"Security Champions\" for cultural reasons.\n\nThe goals of the position are to increase effectiveness and efficiency of application security and compliance and to strengthen the relationship between various teams and Information Security. To achieve these objectives, \"Security Champions\" assist with researching, verifying, and prioritizing security and compliance related software defects. They are involved in all Risk Assessments, Threat Assessments, and Architectural Reviews to help identify opportunities to remediate security defects by making the architecture of the application more resilient and reducing the attack threat surface.\n\nIn addition to assisting Information Security, \"Security Champions\" provide periodic reviews of all security-related issues for the project team so everyone is aware of the problems and any current and future remediation efforts. These reviews are leveraged to help brainstorm solutions to more complex problems by engaging the entire development team."
    expects_deliverables: []
    verification: "assessment question model/questions/G-EG-1-B.yml: Have you identified a Security Champion for each development team? (answer set X); scored by the 3 quality criteria G-EG-1-B-Q1-C1..C3"
