    business_function: "Design"
    security_practice: "D-SR Security Requirements"
    stream: "D-SR-A Software Requirements"
    maturity_level: 1
    practice_level_objective: "Consider security explicitly during the software requirements process."
    locator: "model/activities/D-SR-1-A.yml (longDescription; level via model/practice_levels/D-SR-1.yml)"
    short_title: "Identify security requirements"
    benefit: "Understanding of key security requirements during development"
    short_description: "High-level application security objectives are mapped to functional requirements."
    text: "Perform a review of the functional requirements of the software project. Identify relevant security requirements (i.e. expectations) for this functionality by reasoning on the desired confidentiality, integrity or availability of the service or data offered by the software project. Requirements state the objective (e.g., \"personal data for the registration process should be transferred and stored securely\"), but not the actual measure to achieve the objective (e.g., \"use TLSv1.2 for secure transfer\").\n\nAt the same time, review the functionality from an attacker perspective to understand how it could be misused. This way you can identify extra protective requirements for the software project at hand.\n\nSecurity objectives can relate to specific security functionality you need to add to the application (e.g., \"Identify the user of the application at all times\") or to the overall application quality and behavior (e.g., \"Ensure personal data is properly protected in transit\"), which does not necessarily lead to new functionality. Follow good practices for writing security requirements. Make them specific, measurable, actionable, relevant and time-bound (SMART). Beware of adding requirements too general-purpose to specifically relate to the application at hand (e.g., The application should protect against the OWASP Top 10). While they can be true, they don't add value to the discussion."
    expects_deliverables: []
    verification: "assessment question model/questions/D-SR-1-A.yml: Do project teams specify security requirements during development? (answer set A); scored by the 3 quality criteria D-SR-1-A-Q1-C1..C3"
    related_activities: []
    kind: "stated"
    testable: "partial"
    testable_reason: "assessed by interview against quality criteria on a 4-point coverage scale; no objective pass/fail test is defined"
