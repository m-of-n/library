    maturity_level: 3
    practice_level_objective: "Maintain the application security level after bug fixes, changes or during maintenance."
    locator: "model/activities/V-RT-3-A.yml (longDescription; level via model/practice_levels/V-RT-3.yml)"
    short_title: "Automate security requirements testing"
    benefit: "Timely and reliable detection of violations to security requirements"
    short_description: "Perform regression testing (with security unit tests)."
    text: "Write and automate regression tests for all identified (and fixed) bugs to ensure that these become a test harness preventing similar issues from being introduced during later releases. Security unit tests should verify dynamically (i.e., at run time) that the components function as expected and should validate that code changes are properly implemented.\n\nA good practice for developers is to build security test cases as a generic security test suite that is part of the existing unit testing framework. A generic security test suite might include security test cases to validate both positive and negative requirements for security controls such as Identity, Authentication and Access Control, Input Validation and Encoding, User and Session Management, Error and Exception Handling, Encryption, and Auditing and Logging. Verify the correct execution of the security tests as early as possible. If feasible for example, consider the passing of security tests as part of merge requirements before allowing new code to enter the main code base. Alternatively, consider their passing a requirement for validating a build.\n\nFor security functional tests, use unit level tests for the functionality of security controls at the software component level, such as functions, methods, or classes. For example, a test case could check input and output validation (e.g., variable sanitation) and boundary checks for variables by asserting the expected functionality of the component."
    expects_deliverables: []
    verification: "assessment question model/questions/V-RT-3-A.yml: Do you automatically test applications for security regressions? (answer set A); scored by the 2 quality criteria V-RT-3-A-Q1-C1..C2"
    related_activities: []
    kind: "stated"
    testable: "partial"
    testable_reason: "assessed by interview against quality criteria on a 4-point coverage scale; no objective pass/fail test is defined"
