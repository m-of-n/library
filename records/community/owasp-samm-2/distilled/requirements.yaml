    locator: "model/activities/G-SM-3-A.yml (longDescription; level via model/practice_levels/G-SM-3.yml)"
    short_title: "Align security and business strategies"
    benefit: "Continuous AppSec program alignment with the organization's business goals"
    short_description: "Align the application security program to support the organization's growth."
    text: "You review the application security plan periodically for ongoing applicability and support of the organization's evolving needs and future growth. To do this, you repeat the steps from the first two maturity levels of this Security Practice at least annually. The goal is for the plan to always support the current and future needs of the organization, which ensures the program is aligned with the business.\n\nIn addition to reviewing the business drivers, the organization closely monitors the success of the implementation of each of the roadmap milestones. You evaluate the success of the milestones based on a wide range of criteria, including completeness and efficiency of the implementation, budget considerations, and any cultural impacts or changes resulting from the initiative. You review missed or unsatisfactory milestones and evaluate possible changes to the overall program.\n\nThe organization develops dashboards and measurements for management and teams responsible for software development to monitor the implementation of the roadmap. These dashboards are detailed enough to identify individual projects and initiatives and provide a clear understanding of whether the program is successful and aligned with the organization's needs."
    expects_deliverables: []
    verification: "assessment question model/questions/G-SM-3-A.yml: Do you regularly review and update the Strategic Plan for Application Security? (answer set P); scored by the 4 quality criteria G-SM-3-A-Q1-C1..C4"
