    security_practice: "V-ST Security Testing"
    stream: "V-ST-A Scalable Baseline"
    maturity_level: 1
    practice_level_objective: "Perform security testing (both manual and tool based) to discover security defects."
    locator: "model/activities/V-ST-1-A.yml (longDescription; level via model/practice_levels/V-ST-1.yml)"
    short_title: "Perform automated security testing"
    benefit: "Detection of common easy-to-find vulnerabilities"
    short_description: "Utilize automated security testing tools."
    text: "Use automated static and dynamic security test tools for software, resulting in more efficient security testing and higher quality results. Progressively increase the frequency of security tests and extend code coverage.\n\nApplication security testing can be performed statically, by inspecting an application's source code without running it, or dynamically by simply observing the application's behavior in response to various input conditions. The former approach is often referred to as Static Application Security Testing (SAST), the latter as Dynamic Application Security Testing (DAST). A hybrid approach, known as Interactive Application Security Testing (IAST), combines the strengths of both approaches (at the cost of additional overhead) by dynamically testing automatically instrumented applications, allowing accurate monitoring of the application's internal state in response to external input.\n\nMany security vulnerabilities are very hard to detect without carefully inspecting the source code. While this is ideally performed by expert or peer review, it is a slow and expensive task. Although \"noisier\" and frequently less accurate than expert-led reviews, automated SAST tools are cheaper, much faster, and more consistent than humans. A number of commercial and free tools are able to efficiently detect sufficiently important bugs and vulnerabilities in large code bases.\n\nDynamic testing does not require application source code, making it ideal for cases where source code is not available. It also identifies concrete instances of vulnerabilities. Due to its \"black-box\" approach, without instrumentation, it is more likely to uncover shallow bugs. Dynamic testing tools need a large source of test data whose manual test generation is prohibitive. Many tools exist which generate suitable test data automatically, leading to more efficient security testing and higher quality results.\n\nSelect appropriate tools based on several factors, including depth and accuracy of inspection, robustness and accuracy of security test cases, available integrations with other tools, usage and cost model, etc. When selecting tools, use input from security-savvy technical staff as well as developers and development managers and review results with stakeholders."
    expects_deliverables: []
    verification: "assessment question model/questions/V-ST-1-A.yml: Do you scan applications with automated security testing tools? (answer set B); scored by the 2 quality criteria V-ST-1-A-Q1-C1..C2"
