    security_practice: "V-ST Security Testing"
    stream: "V-ST-B Deep Understanding"
    maturity_level: 1
    practice_level_objective: "Perform security testing (both manual and tool based) to discover security defects."
    locator: "model/activities/V-ST-1-B.yml (longDescription; level via model/practice_levels/V-ST-1.yml)"
    short_title: "Test high risk application components manually"
    benefit: "Detection of manually identifiable vulnerabilities in critical components"
    short_description: "Perform manual security testing of high-risk components."
    text: "Perform selective manual security testing, possibly using a combination of static and dynamic analysis tools to guide or focus the review, in order to more thoroughly analyze parts of the application, as an attacker. Automated tools are effective at finding various types of vulnerabilities but can never replace expert manual review.\n\nCode-level vulnerabilities in security-critical parts of software can have dramatically increased impact so project teams review high-risk modules for common vulnerabilities. Common examples of high-risk functionality include authentication modules, access control enforcement points, session management schemes, external interfaces, and input validators and data parsers. Teams can combine code-level metrics and focused automated scans to determine where best to focus their efforts. In practice, the activity can take many forms including pair programming and peer review, time-boxed security \"pushes\" involving the entire development team, or spontaneous independent reviews by members of a specialised security group.\n\nDuring development cycles where high-risk code is changed and reviewed, development managers triage the findings and prioritize remediation appropriately with input from other project stakeholders."
    expects_deliverables: []
    verification: "assessment question model/questions/V-ST-1-B.yml: Do you manually review the security quality of selected high-risk components? (answer set G); scored by the 3 quality criteria V-ST-1-B-Q1-C1..C3"
    related_activities:
      - "I-DM-1-A"
    kind: "stated"
    testable: "partial"
    testable_reason: "assessed by interview against quality criteria on a 4-point coverage scale; no objective pass/fail test is defined"
