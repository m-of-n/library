    short_title: "Align security methodology with suppliers"
    benefit: "Alignment of software development practices with suppliers to limit security risks"
    short_description: "Ensure proper security coverage for external suppliers by providing clear objectives."
    text: "The best way to minimize the risk of issues in software is to align maximally and integrate closely between the different parties. From a process perspective, this means using similar development paradigms and introducing regular milestones to ensure proper alignment and qualitative progress. From a tools perspective, this might mean using similar build, verification and deployment environments, and sharing other supporting tools (e.g. requirements, architecture tools, or code repositories).\n\nIn case suppliers cannot meet the objectives that you have set, implement compensating controls so that, overall, you meet your objectives. Execute extra activities (e.g., threat modeling before starting the actual implementation cycle) or implement extra tooling (e.g., third-party library analysis at solution intake). The more suppliers deviate from your requirements, the more work will be required to compensate."
