    locator: "model/activities/I-DM-3-A.yml (longDescription; level via model/practice_levels/I-DM-3.yml)"
    short_title: "Enforce an SLA for defect management"
    benefit: "Assurance that security defects are handled within predefined SLAs"
    short_description: "Enforce the predefined SLAs and integrate your defect management system with other relevant tooling."
    text: "Implement an automated alerting on security defects if the fix time breaches the defined SLAs. Ensure that these defects are automatically transferred into the risk management process and rated by a consistent quantitative methodology. Evaluate how particular defects influence or amplify each other not only on the level of separate teams, but on the level of the whole organization. Use the knowledge of the full kill chain to prioritize, introduce and track compensating controls mitigating the respective business risks.\n\nIntegrate your defect management system with the automated tooling introduced by other practices, e.g.:\n\n* Build and Deployment: Fail the build / deployment process if security defects above certain severity affect the final artifact, unless someone explicitly signs off the exception.\n* Monitoring: If possible, ensure that abuse of the security defect in production environment is recognized and alerted."
    expects_deliverables: []
    verification: "assessment question model/questions/I-DM-3-A.yml: Do you enforce SLAs for fixing security defects? (answer set A); scored by the 2 quality criteria I-DM-3-A-Q1-C1..C2"
    related_activities: []
    kind: "stated"
    testable: "partial"
    testable_reason: "assessed by interview against quality criteria on a 4-point coverage scale; no objective pass/fail test is defined"
