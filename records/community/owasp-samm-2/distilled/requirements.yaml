  - id: "owasp-samm-2#G-EG-2-A"
    designator: "G-EG-2-A"
    entry_type: "activity"
    normativity: "descriptive-practice"
    verb: "imperative"
    actor: "organization (assessed unit: organization, team or application, per assessment scope)"
    actor_source: "inferred (no personnel field)"
    nature: "process"
    phase: "training"
    business_function: "Governance"
    security_practice: "G-EG Education and Guidance"
    stream: "G-EG-A Training and Awareness"
    maturity_level: 2
    practice_level_objective: "Educate all personnel in the software lifecycle with technology and role-specific guidance on secure development."
    locator: "model/activities/G-EG-2-A.yml (longDescription; level via model/practice_levels/G-EG-2.yml)"
    short_title: "Customize security training"
    benefit: "Relevant employee roles trained according to their specific role"
    short_description: "Offer technology and role-specific guidance, including security nuances of each language and platform."
    text: "Conduct instructor-led or CBT security training specific to the organization's roles and technologies, starting with the core development team. The organization customizes training for product managers, software developers, testers, and security auditors, based on each group's technical needs.\n\n- Product managers train on topics related to SAMM business functions and security practices, with emphasis on security requirements, threat modeling, and defect tracking.\n- Developers train on coding standards and best practices for the technologies they work with to ensure the training directly benefits application security. They have a solid technical understanding of the OWASP Top 10 vulnerabilities, or similar weaknesses relevant to the technologies and frameworks used (e.g. mobile), and the most common remediation strategies for each issue.\n- Testers train on the different testing tools and best practices for technologies used in the organization, and in tools that identify security defects.\n- Security auditors train on the software development lifecycle, application security mechanisms used in the organization, and the process for submitting security defects for remediation.\n- Security Champions train on security topics from various phases of the SDLC. They receive the same training as developers and testers, but also understand threat modeling and secure design, as well as security tools and technologies that can be integrated into the build environment.\n\nInclude all training content from the Maturity Level 1 activities of this stream and additional role-specific and technology-specific content. Eliminate unnecessary aspects of the training.\n\nIdeally, identify a subject-matter expert in each technology to assist with procuring or developing the training content and updating it regularly. The training consists of demonstrations of vulnerability exploitation using intentionally weakened applications, such as WebGoat or Juice Shop. Include results of the previous penetration test as examples of vulnerabilities and implemented remediation strategies. Ask a penetration tester to assist with developing examples of vulnerability exploitation demonstrations.\n\nTraining is mandatory for all employees and contractors involved with software development, and includes an auditable sign-off to demonstrate compliance. Whenever possible, training should also include a test to ensure understanding, not just compliance.  Update and deliver training annually to include changes in the organization, technology, and trends. Poll training participants to evaluate the quality and relevance of the training. Gather suggestions of other information relevant to their work or environments."
    expects_deliverables: []
    verification: "assessment question model/questions/G-EG-2-A.yml: Is training customized for individual roles such as developers, testers, or security champions? (answer set D); scored by the 5 quality criteria G-EG-2-A-Q1-C1..C5"
    related_activities: []
    kind: "stated"
