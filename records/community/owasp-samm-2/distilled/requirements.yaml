    benefit: "Hardened basic configuration settings of your components"
    short_description: "Perform best-effort hardening of configurations, based on readily available information."
    text: "Understanding the importance of securing the technology stacks you're using, apply secure configuration to stack elements, based on readily available guidance (e.g., open source projects, vendor documentation, blog articles). When your teams develop configuration guidance for their applications, based on trial-and-error and information gathered by team members, encourage them to share their learnings across the organization.\n\nIdentify key elements of common technology stacks, and establish configuration standards for those, based on teams' experiences of what works.\n\nAt this level of maturity, you don't yet have a formal process for managing configuration baselines. Configurations may not be applied consistently across applications and deployments, and monitoring of conformance is likely absent."
    expects_deliverables: []
    verification: "assessment question model/questions/O-EM-1-A.yml: Do you harden configurations for key components of your technology stacks? (answer set G); scored by the 2 quality criteria O-EM-1-A-Q1-C1..C2"
