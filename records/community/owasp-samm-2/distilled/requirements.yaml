    locator: "model/activities/I-SD-1-B.yml (longDescription; level via model/practice_levels/I-SD-1.yml)"
    short_title: "Protect application secrets in configuration and code"
    benefit: "Defined and limited access to your production secrets"
    short_description: "Introduce basic protection measures to limit access to your production secrets."
    text: "Developers should not have access to secrets or credentials for production environments. Have a mechanism in place to adequately protect production secrets, for instance by (i) having specific persons adding them to relevant configuration files upon deployment (the separation of duty principle) or (ii) by encrypting the production secrets contained in the configuration files upfront.\n\nDo not use production secrets in configuration files for development or testing environments, as such environments may have a significantly lower security posture. Similarly, do not keep secrets unprotected in configuration files stored in code repositories.\n\nStore sensitive credentials and secrets for production systems with encryption-at-rest at all times. Consider using a purpose-built tool for this. Handle key management carefully so only personnel with responsibility for production deployments are able to access this data."
