    maturity_level: 2
    practice_level_objective: "Establish a unified strategic roadmap for software security within the organization."
    locator: "model/activities/G-SM-2-B.yml (longDescription; level via model/practice_levels/G-SM-2.yml)"
    short_title: "Set strategic KPIs"
    benefit: "Transparency on your AppSec program's performance"
    short_description: "Set targets and KPI's for measuring the program effectiveness."
    text: "Once the organization has defined its application security metrics, collect enough information to establish realistic goals. Test identified metrics to ensure you can gather data consistently and efficiently over a short period. After the initial testing period, the organization should have enough information to commit to goals and objectives expressed through Key Performance Indicators (KPIs).\n\nWhile several measurements are useful for monitoring the information security program and its effectiveness, KPIs consist of the most meaningful and effective metrics. Aim to remove volatility common in application development environments from KPIs to reduce the chances of unfavorable numbers resulting from temporary or misleading individual measurements. Base KPIs on metrics considered valuable not only to Information Security professionals but also to individuals responsible for the overall success of the application, and the organization's leadership. View KPIs as definitive indicators of the success of the whole program and consider them actionable.\n\nFully document KPIs and distribute them to the teams contributing to the success of the program as well as the organization's leadership. Ideally, include a brief explanation of the information sources for each KPI and the meaning when the numbers are high or low. Include short and long-term goals, and ranges for unacceptable measurements requiring immediate intervention. Share action plans with application security and application development teams to ensure full transparency in understanding of the organization's objectives and goals."
    expects_deliverables: []
    verification: "assessment question model/questions/G-SM-2-B.yml: Have you defined Key Performance Indicators (KPIs) from available application security metrics? (answer set U); scored by the 4 quality criteria G-SM-2-B-Q1-C1..C4"
