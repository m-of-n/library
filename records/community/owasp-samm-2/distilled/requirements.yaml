    short_title: "Practice best-effort patching"
    benefit: "Mitigation of well-known issues in third-party components"
    short_description: "Perform best-effort patching of system and application components."
    text: "Identify applications and third-party components which need to be updated or patched, including underlying operating systems, application servers, and third-party code libraries.\n\nAt this level of maturity, your identification and patching activities are best-effort and _ad hoc_, without a managed process for tracking component versions, available updates, and patch status. However, high-level requirements for patching activities (e.g., testing patches before pushing to production) may exist, and product teams are achieving best-effort compliance with those requirements.\n\nExcept for critical security updates (e.g., an exploit for a third-party component has been publicly released), teams leverage maintenance windows established for other purposes to apply component patches. For software developed by the organization, component patches are delivered to customers and organization-managed solutions only as part of feature releases.\n\nTeams share their awareness of available updates, and their experiences with patching, on an _ad hoc_ basis. Ensure teams can determine the versions of all components in use, to evaluate whether their products are affected by a security vulnerability when notified. However, the process for generating and maintaining component lists may require significant analyst effort."
    expects_deliverables: []
    verification: "assessment question model/questions/O-EM-1-B.yml: Do you identify and patch vulnerable components? (answer set G); scored by the 2 quality criteria O-EM-1-B-Q1-C1..C2"
    related_activities: []
