    locator: "model/activities/D-SR-2-A.yml (longDescription; level via model/practice_levels/D-SR-2.yml)"
    short_title: "Standardize and integrate security requirements"
    benefit: "Alignment of security requirements with other types of requirements"
    short_description: "Structured security requirements are available and utilized by developer teams."
    text: "Security requirements can originate from other sources including policies and legislation, known problems within the application, and intelligence from metrics and feedback. At this level, a more systematic elicitation of security requirements must be achieved by analyzing different sources of such requirements. Ensure that appropriate input is received from these sources to help the elicitation of requirements. For example, organize interviews or brainstorm sessions (e.g., in the case of policy and legislation), analyze historical logs or vulnerability systems.\n\nUse a structured notation of security requirements across applications and an appropriate formalism that integrates well with how you specify other (functional) requirements for the project. This could mean, for example, extending analysis documents, writing user stories, etc.\n\nWhen requirements are specified, it is important to ensure that these requirements are taken into account during product development. Set up a mechanism to stimulate or force project teams to meet these requirements in the product. For example, annotate requirements with priorities, or influence the handling of requirements to enforce sufficient security appetite (while balancing against other non-functional requirements)."
