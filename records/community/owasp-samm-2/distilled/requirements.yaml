    practice_level_objective: "Consider security explicitly during the software requirements process."
    locator: "model/activities/D-SR-1-B.yml (longDescription; level via model/practice_levels/D-SR-1.yml)"
    short_title: "Perform vendor assessments"
    benefit: "Transparency of security practices of your software suppliers"
    short_description: "Evaluate the supplier based on organizational security requirements."
    text: "The security competences and habits of the external suppliers involved in the development of your software can have a significant impact on the security posture of the final product. Consequently, it is important to know and evaluate your suppliers on this front.\n\nCarry out a vendor assessment to understand the strengths and weaknesses of your suppliers. Use a basic checklist or conduct interviews to review their typical practices and deliveries. This gives you an idea of how they organize themselves and elements to evaluate whether you need to take additional measures to mitigate potential risks. Ideally, speak to different roles in the organization, or even set up a small maturity evaluation to this end. Strong suppliers will run their own software assurance program and will be able to answer most of your questions. If suppliers have weak competences in software security, discuss with them how and to what extent they plan to work on this and evaluate whether this is enough for your organization. A software supplier might be working on a low-risk project, but this could change.\n\nIt is important that your suppliers understand and align to the risk appetite and are able to meet your requirements in that area. Make what you expect from them explicit and discuss this clearly."
    expects_deliverables: []
    verification: "assessment question model/questions/D-SR-1-B.yml: Do stakeholders review vendor collaborations for security requirements and methodology? (answer set E); scored by the 2 quality criteria D-SR-1-B-Q1-C1..C2"
    related_activities: []
    kind: "stated"
    testable: "partial"
