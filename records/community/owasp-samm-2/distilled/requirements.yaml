    practice_level_objective: "Develop in-house training programs facilitated by developers across different teams."
    locator: "model/activities/G-EG-3-A.yml (longDescription; level via model/practice_levels/G-EG-3.yml)"
    short_title: "Standardize security guidance"
    benefit: "Adequate security knowledge of all employees ensured prior to working on critical tasks"
    short_description: "Standardized in-house guidance around the organization's secure software development standards."
    text: "Implement a formal training program requiring anyone involved with the software development lifecycle to complete appropriate role and technology-specific training as part of the onboarding process. Based on the criticality of the application and user's role, consider restricting access until the onboarding training has been completed. While the organization may source some modules externally, the program is facilitated and managed in-house and includes content specific to the organization going beyond general security best practices. The program has a defined curriculum, checks participation, and tests understanding and competence. The training consists of a combination of industry best practices and organization's internal standards, including training on specific systems used by the organization.\n\nIn addition to issues directly related to security, the organization includes other standards in the program, such as code complexity, code documentation, naming convention, and other process-related disciplines. This training minimizes issues resulting from employees following practices incorporated outside the organization and ensures continuity in the style and competency of the code.\n\nTo facilitate progress monitoring and successful completion of each training module the organization has a learning management platform or another centralized portal with similar functionality. Employees can monitor their progress and have access to all training resources even after they complete initial training.\n\nReview issues resulting from employees not following established standards, policies, procedures, or security best practices at least annually to gauge the effectiveness of the training and ensure it covers all issues relevant to the organization. Update the training periodically and train employees on any changes and most prevalent security deficiencies."
    expects_deliverables: []
    verification: "assessment question model/questions/G-EG-3-A.yml: Have you implemented a Learning Management System or equivalent to track employee training and certification processes? (answer set D); scored by the 3 quality criteria G-EG-3-A-Q1-C1..C3"
