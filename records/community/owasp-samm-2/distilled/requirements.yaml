    locator: "model/activities/I-DM-2-A.yml (longDescription; level via model/practice_levels/I-DM-2.yml)"
    short_title: "Rate and track security defects"
    benefit: "Consistent classification of security defects with clear expectations of their handling"
    short_description: "Rate all security defects over the whole organization consistently and define SLAs for particular severity classes."
    text: "Introduce and apply a well defined rating methodology for your security defects consistently across the whole organization, based on the probability and expected impact of the defect being exploited. This will allow you to identify applications which need higher attention and investments. In case you don't store the information about security defects centrally, ensure that you're still able to easily pull the information from all sources and get an overview about \"hot spots\" needing your attention.\n\nIntroduce SLAs for timely fixing of security defects according to their criticality rating and centrally monitor and regularly report on SLA breaches. Define a process for cases where it's not feasible or economical to fix a defect within the time defined by the SLAs. This should at least ensure that all relevant stakeholders have a solid understanding of the imposed risk. If suitable, employ compensating controls for these cases.\n\nEven if you don't have any formal SLAs for fixing low severity defects, ensure that responsible teams still get a regular overview about issues affecting their applications and understand how particular issues affect or amplify each other."
    expects_deliverables: []
    verification: "assessment question model/questions/I-DM-2-A.yml: Do you keep an overview of the state of security defects across the organization? (answer set A); scored by the 3 quality criteria I-DM-2-A-Q1-C1..C3"
