    locator: "model/activities/G-PC-1-B.yml (longDescription; level via model/practice_levels/G-PC-1.yml)"
    short_title: "Identify compliance requirements"
    benefit: "Security policies and standards aligned with external compliance drivers"
    short_description: "Identify 3rd-party compliance drivers and requirements and map to existing policies and standards."
    text: "Create a comprehensive list of all compliance requirements, including any triggers that could help determine which applications are in scope. Compliance requirements may be considered in scope based on factors such as geographic location, types of data, or contractual obligations with clients or business partners. Review each identified compliance requirement with the appropriate experts and legal counsel, to ensure the obligation is understood. Since many compliance obligations vary in applicability based on how the data is processed, stored, or transmitted across the computing environment, compliance drivers should always indicate opportunities for lowering the overall compliance burden by changing how the data is handled.\n\nEvaluate publishing a compliance matrix to help identify which factors could put an application in scope for a specific regulatory requirement. Have the matrix indicate which compliance requirements are applicable at the organization level and do not depend on individual applications. The matrix provides at least a basic understanding of useful compliance requirements to review obligations around different applications.\n\nSince many compliance standards are focused around security best-practices, many compliance requirements may already be a part of the Policy and Standards library published by the organization. Therefore, once you review compliance requirements, map them to any applicable existing policies and standards. Whenever there are discrepancies, update the policies and standards to include organization-wide compliance requirements. Then, begin creating compliance-specific standards only applicable to individual compliance requirements. The goal is to have a compliance matrix that indicates which policies and standards have more detailed information about compliance requirements, as well as ensure individual policies and standards reference applicable compliance requirements."
    expects_deliverables: []
    verification: "assessment question model/questions/G-PC-1-B.yml: Do you have a complete picture of your external compliance obligations? (answer set A); scored by the 2 quality criteria G-PC-1-B-Q1-C1..C2"
