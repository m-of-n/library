source: "github.com/owaspsamm/core release v2.2.0 asset samm.tar.gz (model/*.yml), rendered to .cache/owasp-samm-2.txt; maps_to from the OWASP SAMM mappings spreadsheet and the SAMM-SSDF OLIR workbook (see crosswalk.yaml)"
source_keyword_count: 0
extracted_keyword_count: 0
reconciliation: "SAMM is not a BCP 14 document: bin/bcp14-count finds 0 uppercase keywords in the full model rendering, and the extraction texts contain 0, so the BCP 14 counts agree at 0 (bin/validate nonetheless rejects a source count of 0 as 'not set' — a tool limit, recorded honestly rather than faked). The model's own normative units are the baseline, and they reconcile exactly: 5 business functions, 15 security practices, 30 streams, 3 maturity levels, 45 practice-level objectives, 90 activities (15 practices x 2 streams x 3 levels; one YAML file each) and 90 assessment questions (exactly one per activity) carrying 295 quality criteria (36 questions x 3, 27 x 4, 19 x 2, 7 x 5, 1 x 6). Entries: 30 stream + 90 activity + 295 quality-criterion = 415. Lowercase modal forms in the rendering, for reference only (none is a BCP 14 keyword): must 5, should 24, shall 0, may 32, ensure 60, required 13."
