    short_title: "Verify the integrity of deployment artifacts"
    benefit: "Assured integrity of artifacts being deployed to production"
    short_description: "Automatically verify the integrity of all deployed software, regardless of whether it's internally or externally developed."
    text: "Take advantage of binaries being signed at the build time and include automatic verification of the integrity of software being deployed by checking their signatures against trusted certificates. This may include binaries developed and built in-house, as well as third-party artifacts. Do not deploy artifacts if their signatures cannot be verified, including those with invalid or expired certificates.\n\nIf the list of trusted certificates includes third-party developers, check them periodically, and keep them in line with the organization's wider governance surrounding trusted third-party suppliers.\n\nManually approve the deployment at least once during an automated deployment. Whenever a human check is significantly more accurate than an automated one during the deployment process, go for this option."
    expects_deliverables: []
    verification: "assessment question model/questions/I-SD-3-A.yml: Do you consistently validate the integrity of deployed artifacts? (answer set A); scored by the 3 quality criteria I-SD-3-A-Q1-C1..C3"
