    practice_level_objective: "Deployment processes are fully documented."
    locator: "model/activities/I-SD-1-A.yml (longDescription; level via model/practice_levels/I-SD-1.yml)"
    short_title: "Use a repeatable deployment process"
    benefit: "Limited risk of human error during the deployment process, minimizing security issues"
    short_description: "Formalize the deployment process and secure the used tooling and processes."
    text: "Define the deployment process over all stages, breaking it down into a set of clear instructions to either be followed by a person or an automated tooling. The deployment process definition should describe the whole process end-to-end so that it can be consistently followed each time to produce the same result. The definition is stored centrally and accessible to all relevant personnel. Do not store or distribute multiple copies, some of which may become outdated.\n\nDeploy applications to production either using an automated process, or manually by personnel other than the developers. Ensure that developers do not need direct access to the production environment for application deployment.\n\nReview any deployment tools, ensuring that they are actively maintained by vendors and up to date with security patches. Harden each tool's configuration so that it is aligned with vendor guidelines and industry best practices. Given that most of these tools require access to the production environment, their security is extremely critical. Ensure the integrity of the tools themselves and the workflows they follow, and configure access rules to these tools according to the least privilege principle.\n\nHave personnel with access to the production environment go through at least a minimum level of training or certification to ensure their competency in this matter."
    expects_deliverables: []
    verification: "assessment question model/questions/I-SD-1-A.yml: Do you use repeatable deployment processes? (answer set A); scored by the 5 quality criteria I-SD-1-A-Q1-C1..C5"
    related_activities: []
