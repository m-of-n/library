    locator: "model/activities/D-TA-1-B.yml (longDescription; level via model/practice_levels/D-TA-1.yml)"
    short_title: "Perform basic threat modeling"
    benefit: "Identification of architectural design flaws in your applications"
    short_description: "Perform best-effort, risk-based threat modeling using brainstorming and existing diagrams with simple threat checklists."
    text: "Threat modeling is a structured activity for identifying, evaluating, and managing system threats, architectural design flaws, and recommended security mitigations. It is typically done as part of the design phase or as part of a security assessment.\n\nThreat modeling is a team exercise, including product owners, architects, security champions, and security testers. At this maturity level, expose teams and stakeholders to threat modeling to increase security awareness and to create a shared vision on the security of the system.\n\nAt maturity level 1, you perform threat modeling ad-hoc for high-risk applications and use simple threat checklists, such as STRIDE. Avoid lengthy workshops and overly detailed lists of low-relevance threats. Perform threat modeling iteratively to align to more iterative development paradigms. If you add new functionality to an existing application, look only into the newly added functions instead of trying to cover the entire scope. A good starting point is the existing diagrams that you annotate during discussion workshops. Always persist the outcome of a threat modeling discussion for later use.\n\nYour most important tool to start threat modeling is a whiteboard, smartboard, or a piece of paper. Aim for security awareness, a simple process, and actionable outcomes that you agree upon with your team."
    expects_deliverables: []
    verification: "assessment question model/questions/D-TA-1-B.yml: Do you identify and manage architectural design flaws with threat modeling? (answer set B); scored by the 3 quality criteria D-TA-1-B-Q1-C1..C3"
    related_activities: []
