    short_title: "Respond to data breaches"
    benefit: "Technically enforced compliance with your data protection policy"
    short_description: "Automate detection of policy non-compliance, and audit compliance periodically. Regularly review and update to data catalog and data protection policy."
    text: "Activities at this maturity level are focused on automating data protection, reducing your reliance on human effort to assess and manage compliance with policies. There is a focus on feedback mechanisms and proactive reviews, to identify and act on opportunities for process improvement.\n\nImplement technical controls to enforce compliance with your Data Protection Policy, and put monitoring in place to detect attempted or actual violations. You may use a variety of available tools for data loss prevention, access control and tracking, or anomalous behavior detection.\n\nRegularly audit compliance with established administrative controls, and closely monitor performance and operation of automated mechanisms, including backups and record deletions. Monitoring tools quickly detect and report failures in automation, permitting you to take timely corrective action.\n\nReview and update the data catalog regularly, to maintain its accurate reflection of your data landscape. Regular reviews and updates of processes and procedures maintain their alignment with your policies and priorities."
    expects_deliverables: []
    verification: "assessment question model/questions/O-OM-3-A.yml: Do you regularly review and update the data catalog and your data protection policies and procedures? (answer set K); scored by the 3 quality criteria O-OM-3-A-Q1-C1..C3"
