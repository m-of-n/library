    short_title: "Assess application architecture"
    benefit: "Understanding of high-level architecture and sensible security measures"
    short_description: "Identify application and infrastructure architecture components and review for basic security provisioning."
    text: "Create a view of the overall architecture and examine it for the correct provision of general security mechanisms such as authentication, authorization, user and rights management, secure communication, data protection, key management and log management. Also consider the support for privacy. Do this based on project artifacts such as architecture or design documents, or interviews with business owners and technical staff. Also consider the infrastructure components - these are all the systems, components and libraries (including SDKs) that are not specific to the application, but provide direct support to use or manage the application(s) in the organization.\n\nNote any security-related functionality in the architecture and review its correct provision. Do this in an ad hoc manner, from the point of view of anonymous users, authorized users, and specific application roles."
