    locator: "model/activities/I-SD-3-B.yml (longDescription; level via model/practice_levels/I-SD-3.yml)"
    short_title: "Enforce lifecycle management of application secrets"
    benefit: "Minimized possibility and timely detection of production secret abuse"
    short_description: "Improve the lifecycle of application secrets by regularly generating them and by ensuring proper use."
    text: "Implement lifecycle management for production secrets, and ensure the generation of new secrets as much as possible, and for every application instance. The use of secrets per application instance ensures that unexpected application behavior can be traced back and properly analyzed. Tools can help in automatically and seamlessly updating the secrets in all relevant places upon change.\n\nEnsure that all access to secrets (both reading and writing) is logged in a central infrastructure. Review these logs regularly to identify unexpected behavior and perform proper analysis to understand why this happened. Feed issues and root causes into the defect management practice to make sure that the organization will resolve any unacceptable situations."
