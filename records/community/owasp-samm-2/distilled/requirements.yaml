    locator: "model/activities/I-SB-2-A.yml (longDescription; level via model/practice_levels/I-SB-2.yml)"
    short_title: "Automate the build process"
    benefit: "Efficient build process with integrated security tools"
    short_description: "Automate your build pipeline and secure the used tooling. Add security checks in the build pipeline."
    text: "Automate the build process so that builds can be executed consistently anytime. The build process shouldn't typically require any intervention, further reducing the likelihood of human error.\n\nThe use of an automated system increases reliance on security of the build tooling and makes hardening and maintaining the toolset even more critical. Pay particular attention to the interfaces of those tools, such as web-based portals and how they can be locked-down. The exposure of a build tool to the network could allow a malicious actor to tamper with the integrity of the process. This might, for example, allow malicious code to be built into software.\n\nThe automated process may require access to credentials and secrets required to build the software, such as the code signing certificate or access to repositories. Handle these with care. Sign generated artifacts using a certificate that identifies the organization or business unit that built it, so you can verify its integrity.\n\nFinally, add appropriate automated security checks (e.g. using SAST tools) in the pipeline to leverage the automation for security benefit."
    expects_deliverables: []
    verification: "assessment question model/questions/I-SB-2-A.yml: Is the build process fully automated? (answer set A); scored by the 3 quality criteria I-SB-2-A-Q1-C1..C3"
