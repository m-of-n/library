    short_title: "Structurally verify the architecture for identified threats"
    benefit: "All identified threats to the application are adequately handled."
    short_description: "Analyze the architecture for known threats."
    text: "Systematically review each threat identified during the Threat Assessment activities and examine how the architecture mitigates them. Use a standardized process for analyzing system architectures and the flow of data within them. This is typically linked to the threat model used (e.g. STRIDE) in order to identify the relevant security objectives which address each type of threat. For each threat, identify the design-level features of the architecture which counter it and assess their effectiveness in doing so.\n\nWhere available, review architectural decision records to understand the architectural constraints and tradeoffs made during design. Take their impact into consideration along with any security assumptions on which the safe operation of the system relies and re-evaluate them.\n\nEnrich your previously created threat model such that each threat and its estimated impact are linked to the corresponding counter measure. Produce a mapping document, or dashboard in a specialized tool, to make the information available and visible to the relevant stakeholders."
    expects_deliverables: []
    verification: "assessment question model/questions/V-AA-2-B.yml: Do you regularly evaluate the threats to your architecture? (answer set A); scored by the 4 quality criteria V-AA-2-B-Q1-C1..C4"
