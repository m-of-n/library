    locator: "model/activities/I-SB-1-A.yml (longDescription; level via model/practice_levels/I-SB-1.yml)"
    short_title: "Define a consistent build process"
    benefit: "Limited risk of human error during the build process, minimizing security issues"
    short_description: "Create a formal definition of the build process so that it becomes consistent and repeatable."
    text: "Define the build process, breaking it down into a set of clear instructions to either be followed by a person or an automated tool. The build process definition describes the whole process end-to-end so that the person or tool can follow it consistently each time and produce the same result. The definition is stored centrally and accessible to any tools or people. Avoid storing multiple copies as they may become unaligned and outdated.\n\nThe process definition does not include any secrets (specifically considering those needed during the build process).\n\nReview any build tools, ensuring that they are actively maintained by vendors and up-to-date with security patches. Harden each tool's configuration so that it is aligned with vendor guidelines and industry best practices.\n\nDetermine a value for each generated artifact that can be later used to verify its integrity, such as a signature or a hash. Protect this value and, if the artifact is signed, the private signing certificate.\n\nEnsure that build tools are routinely patched and properly hardened."
    expects_deliverables: []
    verification: "assessment question model/questions/I-SB-1-A.yml: Is your full build process formally described? (answer set A); scored by the 5 quality criteria I-SB-1-A-Q1-C1..C5"
