    maturity_level: 2
    practice_level_objective: "Make security testing during development more complete and efficient through automation complemented with regular manual security penetration tests."
    locator: "model/activities/V-ST-2-A.yml (longDescription; level via model/practice_levels/V-ST-2.yml)"
    short_title: "Develop application-specific security test cases"
    benefit: "Detection of organization-specific easy-to-find vulnerabilities"
    short_description: "Employ application-specific security testing automation."
    text: "Increase the effectiveness of automated security testing tools by tuning and customizing them for your particular technology stacks and applications. Automated security testing tools have two important characteristics: Their false positive rate, i.e. the non-existent bugs and vulnerabilities they incorrectly report; their false negative rate, i.e. actual bugs and vulnerabilities which they fail to detect. As you mature in your use of automated testing tools, you strive to minimize their false positive and false negative rates. This maximizes the time development teams spend reviewing and addressing real security issues in their applications, and reduces the friction typically associated with using untuned automated security analysis tools.\n\nStart by disabling tool support for technologies and frameworks you do not use and target specific versions where possible. This will increase execution speed and reduce the number of spurious results reported. Rely on security tool champions or shared security teams to pilot the tools in coordination with a select group of motivated development teams. This will identify likely false positive findings to ignore or remove from the tools' output. Identify specific security issues and anti-patterns and favor the best tool for detecting them.\n\nLeverage available tool features to take application-specific and organizational coding styles, as well as technical standards into account. Many automated static analysis tools allow users to write their own rules or customize default analysis rules to the specific software interfaces in the project under test for improved accuracy and depth of coverage. For example, potentially dangerous input (aka tainted) can be marked as safe after it flows through a designated custom sanitization method.\n\nStrategically, it is better to reliably detect a limited subset of security issues via automated tooling, and incrementally extend coverage than attempting to detect all known issues immediately. Once the tools have been sufficiently tuned, they can be made available to a more development teams. It is important to continuously monitor their perceived efficacy among development teams. In more advanced forms, machine learning techniques can be adopted to identify and automatically filter out likely false positives at scale."
    expects_deliverables: []
    verification: "assessment question model/questions/V-ST-2-A.yml: Do you customize the automated security tools to your applications and technology stacks? (answer set B); scored by the 3 quality criteria V-ST-2-A-Q1-C1..C3"
