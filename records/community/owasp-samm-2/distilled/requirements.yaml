  - id: "owasp-samm-2#V-ST-3-B"
    designator: "V-ST-3-B"
    entry_type: "activity"
    normativity: "descriptive-practice"
    verb: "imperative"
    actor: "organization (assessed unit: organization, team or application, per assessment scope)"
    actor_source: "inferred (no personnel field)"
    nature: "process"
    phase: "verification"
    business_function: "Verification"
    security_practice: "V-ST Security Testing"
    stream: "V-ST-B Deep Understanding"
    maturity_level: 3
    practice_level_objective: "Embed security testing as part of the development and deployment processes."
    locator: "model/activities/V-ST-3-B.yml (longDescription; level via model/practice_levels/V-ST-3.yml)"
    short_title: "Establish continuous, scalable security verification"
    benefit: "Identification of manually identifiable security issues in earliest possible stages"
    short_description: "Integrate security testing into development process."
    text: "Integrate security testing in parallel with all other development activities, including requirement analysis, software design and construction.\n\nWith the multiplicity of security tools running at every phase of development, remediating security issues at a designated stage (such as pre-release testing) is no longer appropriate or desirable. Security issues must be quickly triaged and fixes planned in a tradeoff between risk and cost of remediation. Continuously striving to detect issues earlier in the development lifecycle, via specific, low-friction automated tests integrated into development tools and build processes, lowers the cost of remediation thereby increasing the likelihood of issues being quickly resolved.\n\nProactively improve the security testing effort integrated into the development process by adequately propagating the results of other security test activities. For example, if a security penetration test identifies issues with session management, any changes to session management should trigger explicit security tests before pushing the changes to production.\n\nSecurity champions and the central secure software group continuously review results from automated and manual security tests during development, including these results as part of the security awareness trainings for the development teams. Integrate lessons learned in overall playbooks to improve security testing as part of organizational development. If there are unaddressed findings that remain as accepted risks for the release, stakeholders and development managers should work together to establish a concrete timeframe for addressing them."
    expects_deliverables: []
    verification: "assessment question model/questions/V-ST-3-B.yml: Do you use the results of security testing to improve the development lifecycle? (answer set Z); scored by the 3 quality criteria V-ST-3-B-Q1-C1..C3"
