    locator: "model/activities/V-RT-1-B.yml (longDescription; level via model/practice_levels/V-RT-1.yml)"
    short_title: "Perform fuzz testing"
    benefit: "Insight into the behavior of your applications when dealing with unexpected input"
    short_description: "Perform security fuzz testing."
    text: "Perform fuzzing, sending random or malformed data to the test subject in an attempt to make it crash. Fuzz testing or Fuzzing is a Black Box software testing technique, which consists of finding implementation bugs using automated malformed or semi-malformed data injection. Cover at least a minimum fuzzing for vulnerabilities against the main input parameters of the application.\n\nThe advantage of fuzz testing is the simplicity of the test design, and its lack of preconceptions about system behavior. The stochastic approach results in bugs that human eyes or structured testing would often miss. It is also one of the few means of assessing the quality of a closed system (such as a SIP phone). The simplicity of fuzzing a target is offset by the difficulty in accurately detecting and triaging crashes. Favor existing fuzzing tools and frameworks to leverage their supporting tooling."
    expects_deliverables: []
    verification: "assessment question model/questions/V-RT-1-B.yml: Do you test applications using randomization or fuzzing techniques? (answer set A); scored by the 2 quality criteria V-RT-1-B-Q1-C1..C2"
    related_activities: []
