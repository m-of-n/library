    stream: "I-SD-B Secret Management"
    maturity_level: 2
    practice_level_objective: "Deployment processes include security verification milestones."
    locator: "model/activities/I-SD-2-B.yml (longDescription; level via model/practice_levels/I-SD-2.yml)"
    short_title: "Include application secrets during deployment"
    benefit: "Detection of potential leakage of production secrets"
    short_description: "Inject secrets dynamically during the deployment process from hardened storage and audit all human access to them."
    text: "Have an automated process to add credentials and secrets to configuration files during the deployment process to respective stages. This way, developers and deployers do not see or handle those sensitive values.\n\nImplement checks that detect the presence of secrets in code repositories and files, and run them periodically. Configure tools to look for known strings and unknown high entropy strings. In systems such as code repositories, where there is a history, include the versions in the checks. Mark potential secrets you discover as sensitive values, and remove them where appropriate. If you cannot remove them from a historic file in a code repository, for example, you may need to refresh the value on the system that consumes the secret. This way, if an attacker discovers the secret, it will not be useful to them.\n\nMake the system used to store and process the secrets and credentials robust from a security perspective. Encrypt all secrets at rest and in transit. Users who configure this system and the secrets it contains are subject to the principle of least privilege. For example, a developer might need to manage the secrets for a development environment, but not a user acceptance test or production environment."
    expects_deliverables: []
    verification: "assessment question model/questions/I-SD-2-B.yml: Do you inject production secrets into configuration files during deployment? (answer set A); scored by the 3 quality criteria I-SD-2-B-Q1-C1..C3"
    related_activities: []
    kind: "stated"
    testable: "partial"
    testable_reason: "assessed by interview against quality criteria on a 4-point coverage scale; no objective pass/fail test is defined"
