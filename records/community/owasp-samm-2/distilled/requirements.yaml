    business_function: "Governance"
    security_practice: "G-SM Strategy and Metrics"
    stream: "G-SM-B Measure and Improve"
    maturity_level: 1
    practice_level_objective: "Identify objectives and means of measuring effectiveness of the security program."
    locator: "model/activities/G-SM-1-B.yml (longDescription; level via model/practice_levels/G-SM-1.yml)"
    short_title: "Define basic security metrics"
    benefit: "Basic insights into your AppSec program's effectiveness and efficiency"
    short_description: "Define metrics with insight into the effectiveness and efficiency of the Application Security Program."
    text: "Define and document metrics to evaluate the effectiveness and efficiency of the application security program. This way, improvements are measurable and you can use them to secure future support and funding for the program. Considering the dynamic nature of most development environments, metrics should consist of measurements in the following categories\n\n* `Effort` metrics measure the effort spent on security. For example training hours, time spent performing code reviews, and number of applications scanned for vulnerabilities.\n* `Result` metrics measure the results of security efforts. Examples include number of outstanding patches with security defects and number of security incidents involving application vulnerabilities.\n* `Environment` metrics measure the environment where security efforts take place. Examples include number of applications or lines of code as a measure of difficulty or complexity.\n\nEach metric by itself is useful for a specific purpose, but a combination of two or three metrics together helps explain spikes in metrics trends. For example, a spike in a total number of vulnerabilities may be caused by the organization on-boarding several new applications that have not been previously exposed to the implemented application security mechanisms. Alternatively, an increase in the environment metrics without a corresponding increase in the effort or result could be an indicator of a mature and efficient security program.\n\nWhile identifying metrics, it's always recommended to stick to the metrics that meet several criteria\n\n* Consistently Measured\n* Inexpensive to gather\n* Expressed as a cardinal number or a percentage\n* Expressed as a unit of measure\n\nDocument metrics and include descriptions of best and most efficient methods for gathering data, as well as recommended methods for combining individual measures into meaningful metrics. For example, a number of applications and a total number of defects across all applications may not be useful by themselves but, when combined as a number of outstanding high-severity defects per application, they provide a more actionable metric."
    expects_deliverables: []
    verification: "assessment question model/questions/G-SM-1-B.yml: Do you use a set of metrics to measure the effectiveness and efficiency of the application security program across applications? (answer set Q); scored by the 4 quality criteria G-SM-1-B-Q1-C1..C4"
    related_activities: []
    kind: "stated"
    testable: "partial"
    testable_reason: "assessed by interview against quality criteria on a 4-point coverage scale; no objective pass/fail test is defined"
