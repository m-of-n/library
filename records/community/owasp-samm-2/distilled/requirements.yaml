    short_title: "Standardize and scale threat modeling"
    benefit: "Clear expectations of the quality of threat modeling activities"
    short_description: "Standardize threat modeling training, processes, and tools to scale across the organization."
    text: "Use a standardized threat modeling methodology for your organization and align this on your application risk levels. Think about ways to support the scaling of threat modeling throughout the organization.\n\nTrain your architects, security champions, and other stakeholders on how to do practical threat modeling. Threat modeling requires understanding, clear playbooks and templates, organization-specific examples, and experience, which is hard to automate.\n\nYour threat modeling methodology includes at least diagramming, threat identification, design flaw mitigations, and how to validate your threat model artifacts. Your threat model diagram allows a detailed understanding of the environment and the mechanics of the application. You discover threats to your application with checklists, such as STRIDE or more organization-specific threats. For identified design flaws (ranked according to risk for your organization), you add mitigating controls to support stakeholders in dealing with particular threats. Define what triggers updating a threat model, for example, a technology change or deployment of an application in a new environment.\n\nFeed the output of threat modeling to the defect management process for adequate follow-up. Capture the threat modeling artifacts with tools used by your application teams."
    expects_deliverables: []
    verification: "assessment question model/questions/D-TA-2-B.yml: Do you use a standard methodology, aligned with your application risk levels? (answer set A); scored by the 4 quality criteria D-TA-2-B-Q1-C1..C4"
