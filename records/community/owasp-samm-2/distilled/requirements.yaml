    locator: "model/activities/G-SM-2-A.yml (longDescription; level via model/practice_levels/G-SM-2.yml)"
    short_title: "Define the security strategy"
    benefit: "Available and agreed upon roadmap of your AppSec program"
    short_description: "Publish a unified strategy for application security."
    text: "Based on the magnitude of assets, threats, and risk tolerance, develop a security strategic plan and budget to address business priorities around application security. The plan covers 1 to 3 years and includes milestones consistent with the organization's business drivers and risks. It provides tactical and strategic initiatives and follows a roadmap that makes its alignment with business priorities and needs visible.\n\nIn the roadmap, reach a balance between changes requiring financial expenditures, changes of processes and procedures, and changes impacting the organization's culture. This balance helps accomplish multiple milestones concurrently and without overloading or exhausting available resources or development teams. The milestones are frequent enough to help monitor program success and trigger timely roadmap adjustments.\n\nFor the program to be successful, the application security team obtains buy-in from the organization's stakeholders and application development teams. A published plan is available to anyone who is required to support or participate in its implementation."
