    security_practice: "V-ST Security Testing"
    stream: "V-ST-B Deep Understanding"
    maturity_level: 2
    practice_level_objective: "Make security testing during development more complete and efficient through automation complemented with regular manual security penetration tests."
    locator: "model/activities/V-ST-2-B.yml (longDescription; level via model/practice_levels/V-ST-2.yml)"
    short_title: "Establish a penetration testing process"
    benefit: "Understanding of application resilience from black-box perspective"
    short_description: "Conduct manual penetration testing."
    text: "Using the set of security test cases identified for each project, conduct manual penetration testing to evaluate the system's performance against each case. Generally, this happens during the testing phase prior to release and includes both static and dynamic manual penetration testing. In cases where software cannot be realistically tested outside of production, use of techniques such as blue-green deployments or A/B testing can allow ring-fenced security testing in production.\n\nPenetration testing cases include both application-specific tests to check soundness of business logic, and common vulnerability tests to check the design and implementation. Once specified, security-savvy quality assurance or development staff can execute security test cases. The central software security group monitors first-time execution of security test cases for a project team to assist and coach the team security champions.\n\nMany organizations offer \"Bug Bounty\" programs which invite security researchers to find vulnerabilities in applications and report them responsibly in exchange for rewards. The approach allows organizations to access a bigger pool of talent, especially those lacking sufficient internal capacity or requiring the additional assurance.\n\nPrior to release or mass deployment, stakeholders review results of security tests and accept the risks indicated by failing security tests at release time. Establish a concrete timeline to address the gaps over time. Spread the knowledge of manual security testing and the results across the development team to improve security knowledge and awareness inside the organization."
    expects_deliverables: []
    verification: "assessment question model/questions/V-ST-2-B.yml: Do you perform penetration testing for your applications at regular intervals? (answer set A); scored by the 4 quality criteria V-ST-2-B-Q1-C1..C4"
    related_activities: []
    kind: "stated"
    testable: "partial"
    testable_reason: "assessed by interview against quality criteria on a 4-point coverage scale; no objective pass/fail test is defined"
