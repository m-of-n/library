    locator: "model/activities/I-DM-1-A.yml (longDescription; level via model/practice_levels/I-DM-1.yml)"
    short_title: "Track security defects centrally"
    benefit: "Transparency of known security defects impacting particular applications"
    short_description: "Introduce a structured tracking of security defects and make knowledgeable decisions based on this information."
    text: "Introduce a common definition / understanding of a security defect and define the most common ways of identifying these. These typically include, but are not limited to:\n\n* Threat assessments\n* Penetration tests\n* Output from static and dynamic analysis scanning tools\n* Responsible disclosure processes or bug bounties\n\nFoster a culture of transparency and avoid blaming any teams for introducing or identifying security defects. Record and track all security defects in a defined location. This location doesn't necessarily have to be centralized for the whole organization, however ensure that you're able to get an overview of all defects affecting a particular application at any single point in time. Define and apply access rules for the tracked security defects to mitigate the risk of leakage and abuse of this information.\n\nIntroduce at least rudimentary qualitative classification of security defects so that you are able to prioritize fixing efforts accordingly. Strive for limiting duplication of information and presence of false positives to increase the trustworthiness of the process."
    expects_deliverables: []
    verification: "assessment question model/questions/I-DM-1-A.yml: Do you track all known security defects in accessible locations? (answer set A); scored by the 4 quality criteria I-DM-1-A-Q1-C1..C4"
    related_activities: []
    kind: "stated"
    testable: "partial"
    testable_reason: "assessed by interview against quality criteria on a 4-point coverage scale; no objective pass/fail test is defined"
