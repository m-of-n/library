    locator: "model/activities/I-SB-3-A.yml (longDescription; level via model/practice_levels/I-SB-3.yml)"
    short_title: "Enforce a security baseline during build"
    benefit: "Assurance that you build software complying with a security baseline"
    short_description: "Define mandatory security checks in the build process and ensure that building non-compliant artifacts fails."
    text: "Define security checks suitable to be carried out during the build process, as well as minimum criteria for passing the build - these might differ according to the risk profiles of various applications. Include the respective security checks in the build and enforce breaking the build process in case the predefined criteria are not met. Trigger warnings for issues below the threshold and log these to a centralized system to track them and take actions. If sensible, implement an exception mechanism to bypass this behavior if the risk of a particular vulnerability has been accepted or mitigated. However, ensure these cases are explicitly approved first and log their occurrence together with a rationale.\n\nIf technical limitations prevent the organization from breaking the build automatically, ensure the same effect via other measures, such as a clear policy and regular audit.\n\nHandle code signing on a separate centralized server which does not expose the certificate to the system executing the build. Where possible, use a deterministic method that outputs byte-for-byte reproducible artifacts."
