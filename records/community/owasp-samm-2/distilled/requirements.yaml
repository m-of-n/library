    locator: "model/activities/I-SB-3-B.yml (longDescription; level via model/practice_levels/I-SB-3.yml)"
    short_title: "Test application dependencies"
    benefit: "Handling of security issues in dependencies comparable to those in your own code"
    short_description: "Analyze used dependencies for security issues in a comparable way to your own code."
    text: "Maintain a whitelist of approved dependencies and versions, and ensure that the build process fails upon the presence of a dependency not on the list. Include a sign-off process for handling exceptions to this rule if sensible.\n\nPerform security verification activities against dependencies on the whitelist in a comparable way to the target applications themselves (esp. using SAST and analyzing transitive dependencies). Ensure that these checks also aim to identify possible backdoors or easter eggs in the dependencies. Establish vulnerability disclosure processes with the dependency authors including SLAs for fixing issues. In case enforcing SLAs is not realistic (e.g. with open source vulnerabilities), ensure that the most probable cases are expected and you are able to implement compensating measures in a timely manner. Implement regression tests for the fixes to identified issues.\n\nTrack all identified issues and their state using your defect tracking system. Integrate your build pipeline with this system to enable failing the build whenever the included dependencies contain issues above a defined criticality level."
    expects_deliverables: []
    verification: "assessment question model/questions/I-SB-3-B.yml: Do you prevent the build of software if it is affected by vulnerabilities in dependencies? (answer set A); scored by the 4 quality criteria I-SB-3-B-Q1-C1..C4"
    related_activities:
      - "V-ST-1-A"
      - "I-DM-1-A"
