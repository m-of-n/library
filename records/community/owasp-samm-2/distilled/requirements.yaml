    locator: "model/activities/V-RT-2-A.yml (longDescription; level via model/practice_levels/V-RT-2.yml)"
    short_title: "Define and run security test cases from requirements"
    benefit: "Integration of security requirements into test scenarios"
    short_description: "Derive test cases from known security requirements."
    text: "From the security requirements, identify and implement a set of security test cases to check the software for correct functionality. To have a successful testing program, you must know the testing objectives, specified by the security requirements.\n\nDerive security test cases for the applications in scope from the security requirements created as part of the \"Security Requirements\" SAMM security practice. To validate security requirements with security tests, security requirements are function-driven and highlight the expected functionality (the what) and, implicitly, the implementation (the how). These requirements are also referred to as \"positive requirements\", since they state the expected functionality that can be validated through security tests. Examples of positive requirements include \"the application will lockout the user after six failed login attempts\" or \"passwords need to be a minimum of six alphanumeric characters\". The validation of positive requirements consists of asserting the expected functionality. You can do it re-creating the testing conditions and running the test according to predefined inputs. Show the results as a fail or pass condition.\n\nOften, it is most effective to use the project team's time to build application-specific test cases, and publicly available resources or purchased knowledge bases to select applicable general test cases for security. Relevant development, security, and quality assurance staff review candidate test cases for applicability, efficacy, and feasibility. Derive the test cases during the requirements and/or design phase of the functionality. Testing the security requirements is part of the functional testing of the software."
    expects_deliverables: []
    verification: "assessment question model/questions/V-RT-2-A.yml: Do you consistently write and execute test scripts to verify the functionality of security requirements? (answer set B); scored by the 3 quality criteria V-RT-2-A-Q1-C1..C3"
