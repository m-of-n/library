    locator: "model/activities/D-SA-3-A.yml (longDescription; level via model/practice_levels/D-SA-3.yml)"
    short_title: "Build reference architectures"
    benefit: "Full transparency of quality and usability of centrally provided security solutions"
    short_description: "Reference architectures are utilized and continuously evaluated for adoption and appropriateness."
    text: "Build a set of reference architectures that select and combine a verified set of security components to ensure a proper design of security. Reference platforms have advantages in terms of shortening audit and security-related reviews, increasing efficiency in development, and lowering maintenance overhead. Continuously maintain and improve the reference architecture based on new insights in the organization and within the community. Have architects, senior developers and other technical stakeholders participate in design and creation of reference platforms. After creation, teams maintain ongoing support and updates.\n\nReference architectures may materialize into a set of software libraries and tools upon which project teams build their software. They serve as a starting point that standardizes the configuration-driven, security-by-default security approach. You can bootstrap the framework by selecting a particular project early in the lifecycle and having security-savvy staff work with them to build the security functionality in a generic way so that it can be extracted from the project and used elsewhere in the organization.\n\nMonitor weaknesses or gaps in the set of security solutions available in your organization continuously in the context of discussions on architecture, development, or operations. This serves as an input to improve the appropriateness and effectiveness of the reference architectures that you have in place."
    expects_deliverables: []
    verification: "assessment question model/questions/D-SA-3-A.yml: Do you base your design on available reference architectures? (answer set A); scored by the 3 quality criteria D-SA-3-A-Q1-C1..C3"
