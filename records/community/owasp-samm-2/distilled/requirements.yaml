    short_title: "Train all stakeholders for awareness"
    benefit: "Basic security awareness for all relevant employees"
    short_description: "Provide security awareness training for all personnel involved in software development."
    text: "Conduct security awareness training for all roles currently involved in the management, development, testing, or auditing of the software. The goal is to increase the awareness of application security threats and risks, security best practices, and secure software design principles. Develop training internally or procure it externally. Ideally, deliver training in person so participants can have discussions as a team, but Computer-Based Training (CBT) is also an option.\n\nCourse content should include a range of topics relevant to application security and privacy, while remaining accessible to a non-technical audience. Suitable concepts are secure design principles including Least Privilege, Defense-in-Depth, Fail Secure (Safe), Complete Mediation, Session Management, Open Design, and Psychological Acceptability. Additionally, the training should include references to any organization-wide standards, policies, and procedures defined to improve application security. The OWASP Top 10 vulnerabilities should be covered at a high level.\n\nTraining is mandatory for all employees and contractors involved with software development and includes an auditable sign-off to demonstrate compliance. Consider incorporating innovative ways of delivery (such as gamification) to maximize its effectiveness and combat desensitization."
    expects_deliverables: []
    verification: "assessment question model/questions/G-EG-1-A.yml: Do you require employees involved with application development to take SDLC training? (answer set B); scored by the 6 quality criteria G-EG-1-A-Q1-C1..C6"
