    short_title: "Test the effectiveness of security controls"
    benefit: "Verified effectiveness of your standard security controls"
    short_description: "Test for software security controls."
    text: "Conduct security tests to verify that the standard software security controls operate as expected. At a high level, this means testing the correct functioning of the confidentiality, integrity, and availability controls of the data as well as the service. Security tests at least include testing for authentication, access control, input validation, encoding, and escaping data and encryption controls. The test objective is to validate that the security controls are correctly implemented.\n\nThe security testing validates the relevant software security controls. Perform control-verification security tests manually or with tools, each time the application changes its use of the controls. Techniques such as feature toggles and A/B testing can be used to progressively expose features to broader audiences as they are sufficiently validated. Software control verification is mandatory for all software that is part of the SAMM program."
    expects_deliverables: []
    verification: "assessment question model/questions/V-RT-1-A.yml: Do you test applications for the correct functioning of standard security controls? (answer set B); scored by the 2 quality criteria V-RT-1-A-Q1-C1..C2"
