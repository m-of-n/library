    locator: "model/activities/I-SB-1-B.yml (longDescription; level via model/practice_levels/I-SB-1.yml)"
    short_title: "Identify application dependencies"
    benefit: "Available information on known security issues in dependencies"
    short_description: "Create records with Bill of Materials of your applications and opportunistically analyze these."
    text: "Keep a record of all dependencies used throughout the target production environment. This is sometimes referred to as a Bill of Materials (BOM). Consider that different components of the application may consume entirely different dependencies. For example, if the software package is a web application, cover both the server-side application code and client-side scripts. In building these records, consider the various locations where dependencies might be specified such as configuration files, the project's directory on disk, a package management tool or the actual code (e.g. via an IDE that supports listing dependencies).\n\nGather the following information about each dependency&#58;\n\n* Where it is used or referenced\n* Version used\n* License\n* Source information (link to repository, author's name, etc.)\n* Support and maintenance status of the dependency\n\nCheck the records to discover any dependencies with known vulnerabilities and update or replace them accordingly."
    expects_deliverables: []
    verification: "assessment question model/questions/I-SB-1-B.yml: Do you have solid knowledge of the dependencies you rely on? (answer set A); scored by the 3 quality criteria I-SB-1-B-Q1-C1..C3"
    related_activities: []
