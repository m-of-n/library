note: "Ids: owasp-samm-2#<stream> (e.g. G-SM-A), owasp-samm-2#<activity file stem> (e.g. G-SM-1-A = function G, practice SM, level 1, stream A — the stem of model/activities/<id>.yml), and owasp-samm-2#<activity>-Q1-C<n> for the n-th quality criterion of the activity's single question (Q1 = question order 1). Vocabulary: normativity=descriptive-practice for streams and activities (SAMM describes what an organization at that level does; it does not mandate) and assessment-criterion for quality criteria (a condition the assessor checks before crediting an answer). phase is OUR best-fit canonical phase per practice (stream overrides: D-SR-B Supplier Security and I-SB-B Software Dependencies -> supply-chain), not SAMM's. actor comes from the activity personnel field where present (18 Implementation activities); elsewhere it is inferred and flagged in actor_source. expects_deliverables is empty throughout: the model's results/metrics fields are placeholders ('result1','result2') for 18 activities and empty for the rest, so SAMM v2.2.0 names no work products in machine-readable form. maps_to is ONLY what OWASP SAMM itself publishes (mappings spreadsheet: SSDF 1.1, BSIMM14, IEC 62443-4-1, NIST CSF 2.0, Microsoft SDL, Threat Modeling Capabilities; and the NIST-OLIR SSDF workbook at activity level), verbatim ids and relationship labels; stream-level mappings sit on the stream entries. Text is verbatim (YAML block scalars; line breaks kept as \\n)."
