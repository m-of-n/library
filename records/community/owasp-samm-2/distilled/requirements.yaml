    locator: "model/activities/D-TA-1-A.yml (longDescription; level via model/practice_levels/D-TA-1.yml)"
    short_title: "Perform application risk assessments"
    benefit: "Ability to classify applications according to risk"
    short_description: "A basic assessment of the application risk is performed to understand likelihood and impact of an attack."
    text: "Use a simple method to evaluate the application risk per application, estimating the potential business impact that it poses for the organization in case of an attack. To achieve this, evaluate the impact of a breach in the confidentiality, integrity and availability of the data or service. Consider using a set of 5-10 questions to understand important application characteristics, such as whether the application processes financial data, whether it is internet facing, or whether privacy-related data is involved. The application risk profile tells you whether these factors are applicable and if they could significantly impact the organization.\n\nNext, use a scheme to classify applications according to this risk. A simple, qualitative scheme (e.g. high/medium/low) that translates these characteristics into a value is often effective. It is important to use these values to represent and compare the risk of different applications against each other. Mature highly risk-driven organizations might make use of more quantitative risk schemes. Don't invent a new risk scheme if your organization already has one that works well."
    expects_deliverables: []
    verification: "assessment question model/questions/D-TA-1-A.yml: Do you classify applications according to business risk based on a simple and predefined set of questions? (answer set B); scored by the 4 quality criteria D-TA-1-A-Q1-C1..C4"
    related_activities: []
