    stream: "G-SM-A Create and Promote"
    maturity_level: 1
    practice_level_objective: "Identify objectives and means of measuring effectiveness of the security program."
    locator: "model/activities/G-SM-1-A.yml (longDescription; level via model/practice_levels/G-SM-1.yml)"
    short_title: "Identify the organization's risk appetite"
    benefit: "Common understanding of your organization's security posture"
    short_description: "Identify organization drivers as they relate to the organization's risk tolerance."
    text: "Understand, based on application risk exposure, what threats exist or may exist, as well as how tolerant executive leadership is of these risks. This understanding is a key component of determining software security assurance priorities. To ascertain these threats, interview business owners and stakeholders and document drivers specific to industries where the organization operates as well as drivers specific to the organization. Gathered information includes worst-case scenarios that could impact the organization, as well as opportunities where an optimized software development lifecycle and more secure applications could provide a market-differentiator or create additional opportunities.\n\nGathered information provides a baseline for the organization to develop and promote its application security program. Items in the program are prioritized to address threats and opportunities most important to the organization. The baseline is split into several risk factors and drivers linked directly to the organization's priorities and used to help build a risk profile of each custom-developed application by documenting how they can impact the organization if they are compromised.\n\nThe baseline and individual risk factors should be published and made available to application development teams to ensure a more transparent process of creating application risk profiles and incorporating the organization's priorities into the program. Additionally, these goals should provide a set of objectives which should be used to ensure all application security program enhancements provide direct support of the organization's current and future needs."
    expects_deliverables: []
    verification: "assessment question model/questions/G-SM-1-A.yml: Do you understand the enterprise-wide risk appetite for your applications? (answer set N); scored by the 4 quality criteria G-SM-1-A-Q1-C1..C4"
    related_activities: []
    kind: "stated"
    testable: "partial"
    testable_reason: "assessed by interview against quality criteria on a 4-point coverage scale; no objective pass/fail test is defined"
