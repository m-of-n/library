    locator: "model/activities/V-ST-3-A.yml (longDescription; level via model/practice_levels/V-ST-3.yml)"
    short_title: "Integrate security testing tools in the delivery pipeline"
    benefit: "Identification of automatically identifiable vulnerabilities in earliest possible stages"
    short_description: "Integrate automated security testing into the build and deploy process."
    text: "Projects within the organization routinely run automated security tests and review results during development. Configure security testing tools to automatically run as part of the build and deploy process to make this scalable with low overhead. Inspect findings as they occur.\n\nConducting security tests as early as the requirements or design phases can be beneficial. While traditionally used for functional test cases, this type of test-driven development approach involves identifying and running relevant security test cases early in the development cycle. With the automatic execution of security test cases, projects enter the implementation phase with a number of failing tests for the non-existent functionality. Implementation is complete when all the tests pass. This provides a clear, upfront goal for developers early in the development cycle, lowering risk of release delays due to security concerns or forced acceptance of risk to meet project deadlines.\n\nMake the results of automated and manual security tests visible via dashboards, and routinely present them to management and business stakeholders (e.g. before each release) for review. If there are unaddressed findings that remain as accepted risks for the release, stakeholders and development managers work together to establish a concrete timeframe for addressing them. Continuously review and improve the quality of the security tests.\n\nConsider and implement security test correlation tools to automate the matching and merging of test results from dynamic, static, and interactive application scanners into one central dashboard, providing direct input towards Defect Management. Spread the knowledge of the created security tests and the results across the development team to improve security knowledge and awareness inside the organization."
    expects_deliverables: []
    verification: "assessment question model/questions/V-ST-3-A.yml: Do you integrate automated security testing into the build and deploy process? (answer set Y); scored by the 2 quality criteria V-ST-3-A-Q1-C1..C2"
