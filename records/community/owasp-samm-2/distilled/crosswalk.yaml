source:
  title: "OWASP SAMM mappings spreadsheet (linked from https://owaspsamm.org/docs/reference/mappings/)"
  url: "https://docs.google.com/spreadsheets/d/1WiQcn7wFzSM8xg78SqkIM1QF2C48jBCYi_N_6kOq174"
  retrieved: "2026-10-02"
  sha256_of_xlsx_export: "7ff751a479697c6d33e6994fe88d7428025fbbb63ca5bfd47ba28409ec0f4976"
publisher_caveat: "This document presents mappings between OWASP SAMM and a selection of frameworks, standards, and models. These mappings serve as straightforward cross-references, highlighting relationships between entities without delving into the specific nature of those connections. The mappings reflect our interpretation and understanding of the selected frameworks and their components. While we strive for accuracy, these mappings are provided as-is, and we cannot be held liable for any inconsistencies, errors, or misinterpretations. ... Note, some of the mappings are currently in DRAFT version. The draft status is indicated clearly on the tab. This typically means that the mapping has been created by a core team member, but never peer reviewed."
note: "Verbatim ids as published (SAMM stream ids such as G-SM-A, or activity ids such as G-PC-1-A in the TMC tab). One row per (SAMM id, target id) pair; multi-valued cells were split on newlines. No tab name in the 2026-10-02 export carries a DRAFT marker. The spreadsheet SSDF ids are SP 800-218 v1.1 task ids; the BSIMM ids are BSIMM14. IEC 62443-4-1 requirement descriptions in the sheet are NOT reproduced here (paywalled standard text); only ids. The Microsoft SDL ids are the current web practice-set sub-practice ids (record microsoft-sdl). A separate NIST-OLIR SSDF<>SAMM workbook (https://docs.google.com/spreadsheets/d/1AsIbEHK_csuYkUx8tSZvHBFlywYZ5wBejfJHi8AvnZM, xlsx sha256 44f7f1d34650e9b3f7e4a3bd137d7ba9936c919c3fb3b07f2594566847bedfc9) carries activity-level SSDF mappings with OLIR relationship types; its machine-readable tab is captured under ssdf_olir below."
relationship_vocabulary:
  - "Synonyms: X (SAMM Activity) and Y (SSDF) are identical. X and Y (SSDF) use exactly the same wording."
  - "Supports: X (SAMM Activity) supports Y (SSDF) when X (SAMM Activity) can be applied alone or in combination with one or more other capabilities to achieve Y (SSDF) in whole or in part."
  - "Equivalences: Y (SSDF) and X (SAMM Activity) are equivalent. This X (SAMM Activity) and Y (SSDF) have the same meaning but different wording."
  - "Is Supported By: X (SAMM Activity) is supported by Y (SSDF) when Y (SSDF) can be applied alone or in combination with one or more other capabilities to achieve X (SAMM Activity) in whole or in part."
  - "Generic-specific: X (SAMM Activity) is one way (an example) of doing or achieving Y (SSDF).  In other words, you can accomplish Y (SSDF) without this X (SAMM Activity)."
  - "No Relationship: X (SAMM Activity) has no relationship to Y (SSDF) when X (SAMM Activity) and Y (SSDF) are not directly related. This relationship is implied for any X (SAMM Activity)-Y (SSDF) combination where another relationship type is not declared."
  - "Whole-part: X (SAMM Activity) is one part (a component) of Y (SSDF). In other words, you cannot accomplish Y (SSDF) without X (SAMM Activity)."
  - "Prerequisite-dependency: X (SAMM Activity) is required first in order to perform Y (SSDF)."
  - "No Relationship: X (SAMM Activity) has no relationship to Y (SSDF) when X (SAMM Activity) and Y (SSDF) are not directly related."
  - "Example of: The supporting concept A is an example of how the supported concept B can be achieved in whole or in part. However, B could also be achieved without applying A."
  - "Integral to: The supporting concept A is integral to the supported concept B. A must be applied as part of achieving B."
  - "Precedes: The supporting concept A precedes the supported concept B when A must be achieved before applying B."
  - "Essential"
  - "Weak"
  - "None"
