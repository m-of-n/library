source_defect_candidates:
  - id: 'SDC-1'
    canonical: 'SD-1'
    what: 'the parsing rule lists `signature` and `signature.sig` where the template and the proto name `signatures` and `sig` inside each element of `signatures`'
    source:
      source_lines: '248-249'
      quote: '* The following fields are REQUIRED and MUST be set, even if empty: `payload`, `payloadType`, `signature`, `signature.sig`.'
  - id: 'SDC-2'
    canonical: 'SD-2'
    what: 'signatures is ''REQUIRED and MUST be set, even if empty'' in envelope.md and ''REQUIRED (length >= 1)'' in envelope.proto: an empty array satisfies one and violates the other'
    source:
      source_lines: '248-249'
      quote: '* The following fields are REQUIRED and MUST be set, even if empty: `payload`, `payloadType`, `signature`, `signature.sig`.'
    also:
      source_lines: '305'
      quote: '// REQUIRED (length >= 1).'
  - id: 'SDC-3'
    canonical: 'SD-3'
    what: 'the cross-reference ''section 6.2.2.1'' in the PAYLOAD_TYPE URI rule names no document (RFC 3986, linked at rendering line 46, four lines above, is presumably meant)'
    source:
      source_lines: '50'
      quote: '* SHOULD be case-normalized (section 6.2.2.1)'
  - id: 'SDC-4'
    canonical: 'SD-4'
    what: 'the §1.1 parameter table lists SERIALIZED_BODY, PAYLOAD_TYPE and KEYID but not SIGNATURE, which §1.2 and §1.3 treat as the fourth transmitted parameter'
    source:
      source_lines: '24-28'
      quote: 'Name | Type | Required | Authenticated --------------- | ------ | -------- | ------------- SERIALIZED_BODY | bytes | Yes | Yes PAYLOAD_TYPE | string | Yes | Yes KEYID | string | No | No'
  - id: 'SDC-5'
    canonical: 'SD-5'
    what: 'terminology: protocol.md calls the signed bytes SERIALIZED_BODY and the PAE parameter `body`; envelope.proto and the JSON member call them `payload`; envelope.proto''s comment on payload says ''Message to be signed'' although the signed bytes are PAE(type, payload)'
    source:
      source_lines: '289'
      quote: '// Message to be signed. (In JSON, this is encoded as base64.)'
  - id: 'SDC-6'
    canonical: 'SD-6'
    what: 'package io.intoto in a message that envelope.md presents as the generic DSSE schema'
    source:
