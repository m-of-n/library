      quote: 'package io.intoto;'
source_silences:
  - 'base64 padding: required, forbidden or optional is never said; the test vector uses padded standard base64'
  - 'mixing the standard and URL-safe alphabets inside one string'
  - 'non-canonical base64 (non-zero trailing bits), whitespace or line breaks inside base64'
  - 'JSON null for any envelope member; duplicate JSON member names; member order'
  - 'the minimum number of signatures in the JSON envelope (SDC-2); bounds on t and n; what a verifier does with an empty ACCEPTED_KEYS when t = 0'
  - 'how LEN writes zero (the shortest numeral 0 is the library''s reading); maximum length of type or body'
  - 'UTF8() of a string that is not a sequence of Unicode scalar values (lone surrogates)'
  - 'whether an empty SERIALIZED_BODY or an empty PAYLOAD_TYPE is acceptable beyond ''even if empty'''
  - 'the byte width of r and s in the §1.4 signature (''raw concatenation of r and s (Cryptodome binary encoding)'' is the only statement); the library reads 32 bytes each, verified against the printed value'
  - 'low-s normalisation and any other signature malleability rule; Sign() is out of band'
  - 'KEYID format and how a verifier maps it to a key; duplicate keyids'
  - 'protobuf wire encoding of an envelope: no byte example is given'
  - 'negative test vectors (a bad signature, a changed payloadType): the source gives one positive vector only'
