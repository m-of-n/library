applicability: "APPLICABLE"
applicability_reason: >-
  Verification of one envelope is a lifecycle in FX-1's sense (docs/extraction.md names
  verification), and the source states it as one. §1.2 and §1.3 give ordered checks each with a
  reject exit (reject occurs 8 times, all in §1.2 and §1.3; fails 6 times, the same), and §1.3
  adds a loop over SIGNATURES with an accumulator, ACCEPTED_KEYS, a per-signature skip (Skip,
  once) and an early exit guarded by the accumulator's size (Break, once outside the notebook's
  Python). The bytes-identity rule names a boundary in that lifecycle and forbids an action
  after it: after verification (L111, L275). Two machines follow: M1 for one signature (§1.2,
  protocol.yaml F04) and M2 for a (t, n)-ENVELOPE (§1.3, F05). Nothing else has states: signing
  is a fixed computation, the out-of-band agreement is named and never described, format
  detection is one decision, and none of the 29 lifecycle-over-time words of census.zero occurs
  in any of the five files. The source's one outcome word is Reject; the error states are split
  by check so that each reject exit is its own test (the split is this model's).
