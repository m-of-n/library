coverage: >-
  2 machines. M1: 12 states (4 error), 11 transitions (11 stated, 0 inferred), 7 events, 1
  forbidden action, 4 invariants, 4 unspecified situations. M2: 15 states (4 error), 19
  transitions (14 stated, 5 inferred), 10 events, 1 forbidden action, 5 invariants, 3
  parameterisations of t, 4 unspecified situations. Transition constrained_by: 60 links to 34
  distinct ids. 8 candidates assessed (2 modelled). Checked by script: every state reachable
  from the initial state, no dead end outside final and error states, every trigger a listed
  event, every protocol_step a step of protocol.yaml, every message a messages.yaml name. A lane
  script (simulate.py, scratch, not shipped) ran M1 over all 16 combinations of its four check
  outcomes and M2 over 4080 envelopes (0 to 3 signatures drawn from three keys and a bad
  signature, t from -1 to 4, every outcome of decode, type and parse): at every step exactly one
  transition fired, and every end state equals the reading of §1.2 and §1.3 (accept exactly when
  decoding succeeds, at least t unique keys verify, the type is supported and the body parses;
  list order and Break change nothing). 8 of the M2 runs deliver with no verified signature,
  every one with t of 0 or less (SD-10). Counted by script over this file's data.
