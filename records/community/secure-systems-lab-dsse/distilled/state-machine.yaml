  - id: "M2"
    name: "threshold-verification"
    title: "Verifying a (t, n)-ENVELOPE"
    locator: "§1.1, §1.2, §1.3, §2.3"
    protocol_flow: "F05"
    summary: >-
      One envelope through §1.3: decode, then a loop over SIGNATURES that verifies each, skips a
      failure, accumulates verifying keys in ACCEPTED_KEYS and breaks at t unique keys; then the
      threshold check, the type check and the parse, each with a reject exit, and the hand-off.
      threshold_met is L121-123's valid; delivered is accepted (SD-16).
