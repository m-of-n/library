        message: "Protocol parameters"
        field: "SERIALIZED_BODY"
        what: "set once by T02; every signature is verified against it (V1)"
      - name: "PAYLOAD_TYPE"
        message: "Protocol parameters"
        field: "PAYLOAD_TYPE"
        what: "set once by T02"
      - name: "SIGNATURES"
        message: "(t, n)-ENVELOPE"
        field: "SIGNATURES"
        what: "the list of (SIGNATURE, KEYID), set by T02"
      - name: "current (SIGNATURE, KEYID)"
        message: "Protocol parameters"
        field: "SIGNATURE"
        what: "the element under the loop's cursor, set by T04, T08 and T11 (cursor inferred)"
      - name: "ACCEPTED_KEYS"
        message: "(t, n)-ENVELOPE"
        field: "ACCEPTED_KEYS"
        what: "a set; empty from T02 (inferred), grown only by T07"
      - name: "candidate keys"
        what: "set by T06 for the current signature (no message)"
    initial: "awaiting"
    final:
