conventions:
  triggers: >-
    A trigger names an event of the machine's events list; an event that is a message arrival
    names its messages.yaml message. Each event quotes the step it stands for.
  guards: >-
    Guards are this file's wording of the condition the quoted step tests; stated means the
    source states the branch (Reject, Skip over, Break), inferred that the model adds it (a
    for-each continuing or ending), with inferred_reason.
  ids: >-
    secure-systems-lab-dsse#R-NNNN ids of requirements.yaml. Pass 1 cited the fixed skeleton ids
    R-0001 to R-0033, and a C-id of inferred-candidates.yaml where a keyword-less sentence binds
    the step and had no R-id yet. Pass 2 added the ids that lane gave binding sentences no
    candidate caught (hunted: R-0034, R-0035, R-0045, R-0068, R-0084, R-0087 to R-0090, R-0097,
    R-0101, R-0103), where a step rests on one, and two of its inferred readings where an
    inferred step or error path states the same reading (R-0108, R-0110). Pass 3 rewired every
    C-id to the R-id the requirements lane promoted it as (the candidate's reason names it; the
    two texts are identical, or the R-id is the merge of a split pair), so no C-id is cited as a
    constraint. A rejected candidate is never cited as one, and a rejected sentence a step still
    quotes is named as context in constrained_by_note. Each id was selected by script from its table by source_lines and a
    phrase of its text, refusing zero or several matches, and every resolved pair was printed
    and read. The §4.3 design requirements (R-0023 to R-0033) are cited where a step is the
    mechanism by which the protocol meets one. R-0009 and R-0017 share their text
    (bin/check-id-joins --surface), as do the §1.2 and §1.3 copies of five verification
    sentences; each is cited for its own section.
  quoting: >-
    Every quotation is a quotes item {source_lines, quote}, cut from the rendering by script
    through bin/_source_text (whitespace collapsed, nothing else changed), never typed, with the
    tightest range that holds it; bin/check-quotes verifies every one. Markdown syntax
    (backticks, asterisks, link brackets) is part of the quoted text. action, guard, note and
    on_error are this file's wording; where they repeat source terms, the step's quotes and
    constrained_by carry the source.
machines:
  - id: "M1"
    name: "single-signature-verification"
    title: "Verifying an envelope with one signature"
    locator: "§1.1, §1.2, §2.3, §4.4"
    protocol_flow: "F04"
    summary: >-
      One envelope through §1.2's five steps: decode, select keys, verify, type check, parse;
      each but key selection has a reject exit, then the verified SERIALIZED_BODY goes to the
      application layer. Once the signature has verified, the bytes are fixed and the envelope
      must not be re-parsed to pull the payload out (M1.X1).
    context:
      - name: "acceptable public keys"
        from: "F01.2"
        quotes:
          - source_lines: "99"
            quote: |-
              - Optionally, filter acceptable public keys by KEYID.
      - name: "supported PAYLOAD_TYPEs"
        from: "F01.1"
        quotes:
          - source_lines: "102"
            quote: |-
              - Reject if PAYLOAD_TYPE is not a supported type.
      - name: "Sign() and its verification"
        from: "F01.2"
        quotes:
          - source_lines: "71-72"
            quote: |-
              Details are agreed upon out-of-band by the signer and verifier.
    variables:
      - name: "SERIALIZED_BODY"
        message: "Protocol parameters"
        field: "SERIALIZED_BODY"
        what: "set by T02; fixed from signature_verified on (V1)"
      - name: "PAYLOAD_TYPE"
        message: "Protocol parameters"
        field: "PAYLOAD_TYPE"
        what: "set by T02"
      - name: "SIGNATURE"
        message: "Protocol parameters"
        field: "SIGNATURE"
        what: "set by T02"
      - name: "KEYID"
        message: "Protocol parameters"
        field: "KEYID"
        what: "set by T02; empty when keyid is unset (R-0013)"
      - name: "candidate keys"
        what: "set by T04: the acceptable public keys, narrowed by KEYID or not (no message)"
    initial: "awaiting"
    final:
      - "delivered"
    states:
      - name: "awaiting"
        kind: "initial"
        what: "No envelope yet."
      - name: "received"
        kind: "normal"
        what: "An encoded envelope has arrived, by default a JSON envelope; nothing is decoded."
      - name: "decoded"
        kind: "normal"
        what: "SERIALIZED_BODY, PAYLOAD_TYPE, SIGNATURE and KEYID are decoded."
      - name: "keys_selected"
        kind: "normal"
        what: "The candidate keys are fixed: the acceptable public keys, narrowed by KEYID or not."
      - name: "signature_verified"
        kind: "normal"
        what: >-
          SIGNATURE verifies over PAE(UTF8(PAYLOAD_TYPE), SERIALIZED_BODY) under a candidate
          key. From here SERIALIZED_BODY is the value the application layer must receive.
      - name: "payload_type_supported"
        kind: "normal"
        what: "PAYLOAD_TYPE is a supported type."
      - name: "parsed"
        kind: "normal"
        what: "SERIALIZED_BODY is parsed according to PAYLOAD_TYPE."
      - name: "delivered"
        kind: "final"
        what: "The verified SERIALIZED_BODY is with the application layer: accepted."
      - name: "rejected_decoding"
        kind: "error"
        what: "Rejected: decoding failed."
      - name: "rejected_signature"
        kind: "error"
        what: "Rejected: the signature did not verify."
      - name: "rejected_payload_type"
        kind: "error"
        what: "Rejected: PAYLOAD_TYPE is not supported."
      - name: "rejected_parse"
        kind: "error"
        what: "Rejected: SERIALIZED_BODY did not parse."
    events:
      - name: "envelope_received"
        message: "JSON Envelope"
        what: "an encoded envelope arrives"
        quotes:
          - source_lines: "96-97"
            quote: |-
              - Receive and decode SERIALIZED_BODY, PAYLOAD_TYPE, SIGNATURE, and KEYID, such as from the recommended [JSON envelope](envelope.md).
      - name: "decode"
        what: "the decode step and its outcome"
        quotes:
          - source_lines: "96-98"
            quote: |-
              - Receive and decode SERIALIZED_BODY, PAYLOAD_TYPE, SIGNATURE, and KEYID, such as from the recommended [JSON envelope](envelope.md). Reject if decoding fails.
      - name: "select_keys"
        what: "the optional KEYID filter"
        quotes:
          - source_lines: "99"
            quote: |-
              - Optionally, filter acceptable public keys by KEYID.
      - name: "verify_signature"
        what: "the signature check and its outcome"
        quotes:
          - source_lines: "100-101"
            quote: |-
              - Verify SIGNATURE against PAE(UTF8(PAYLOAD_TYPE), SERIALIZED_BODY). Reject if the verification fails.
      - name: "check_payload_type"
        what: "the supported-type check"
        quotes:
          - source_lines: "102"
            quote: |-
              - Reject if PAYLOAD_TYPE is not a supported type.
      - name: "parse"
        what: "the parse and its outcome"
        quotes:
          - source_lines: "103-104"
            quote: |-
              - Parse SERIALIZED_BODY according to PAYLOAD_TYPE. Reject if the parsing fails.
      - name: "deliver"
        what: "the hand-off to the application layer"
        quotes:
          - source_lines: "109-110"
            quote: |-
              **Important:** Implementations MUST ensure that the same SERIALIZED_BODY that is verified is the same sent to the application layer.
    transitions:
