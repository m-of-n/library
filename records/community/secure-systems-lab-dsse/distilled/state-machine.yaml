      - name: "trusted public keys (n unique)"
        from: "F01.2, F01.4"
        quotes:
          - source_lines: "122"
            quote: |-
              unique trusted public keys
      - name: "t"
        from: "F01.4"
        quotes:
          - source_lines: "122-123"
            quote: |-
              where `t` is application-specific.
      - name: "supported PAYLOAD_TYPEs"
        from: "F01.1"
        quotes:
          - source_lines: "137"
            quote: |-
              - Reject if PAYLOAD_TYPE is not a supported type.
    variables:
