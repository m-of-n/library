source_defects:
  - id: "SDP-1"
    class: "gap"
    canonical: "SD-9"
    title: "The single-signature procedure takes one SIGNATURE; the envelope carries a list"
    locators:
      - "§1.2 (L96-97)"
      - "§2.1.1 (L229-230)"
    quotes:
      - source_lines: "96"
        quote: |-
          - Receive and decode SERIALIZED_BODY, PAYLOAD_TYPE, SIGNATURE, and KEYID,
      - source_lines: "229-230"
        quote: |-
          An envelope MAY have more than one signature, which is equivalent to separate envelopes with individual signatures.
    description: >-
      §1.2 decodes one SIGNATURE and one KEYID. The envelope's signatures member is a list and
      may hold several, and the only guidance on reading several with the §1.2 procedure is that
      they are equivalent to separate envelopes.
    consequence: >-
      A single-signature verifier that checks only the first signature, or rejects more than one
      at decoding, behaves differently from one that treats each as a separate envelope, and the
      source does not say which it should do.
    modelled_as: "F06; EP-16; state-machine.yaml M1 U2."
  - id: "SDP-2"
    class: "gap"
    canonical: "SD-10"
    title: "t has no lower bound; t of 0 accepts an envelope with no verified signature"
    locators:
      - "§1.3 (L121-123, L136)"
    quotes:
      - source_lines: "121-123"
        quote: |-
          A `(t, n)`-ENVELOPE is valid if the enclosed signatures pass the verification against at least `t` of `n` unique trusted public keys where `t` is application-specific.
      - source_lines: "136"
        quote: |-
          - Reject if the unique keys in ACCEPTED_KEYS is less than `t`.
    description: >-
      t is application-specific and nothing bounds it. The only rejecting check on the
      signatures is fewer than t unique keys, so with t = 0 (or less) it never fires, and the
      procedure goes on to the type check and the parse whatever the signatures are, including
      none.
    consequence: >-
      As written, a (t, n) verifier configured with t = 0 accepts unsigned envelopes. The source
      does not require t >= 1.
    modelled_as: "F05.8 on_error; EP-11, EP-18; state-machine.yaml M2 parameterisations."
  - id: "SDP-3"
    class: "gap"
    canonical: "SD-14"
    title: "Unique keys are counted, but key equality is never defined"
    locators:
      - "§1.3 (L121-122, L133-136)"
      - "§1.1 (L54-56)"
    quotes:
      - source_lines: "122"
        quote: |-
          unique trusted public keys
      - source_lines: "133"
        quote: |-
          - Add the accepted public key to the set ACCEPTED_KEYS.
      - source_lines: "134-135"
        quote: |-
          - Break if the number of unique keys in ACCEPTED_KEYS is greater or equal to `t`.
      - source_lines: "54-56"
        quote: |-
          It **MUST NOT** be used for security decisions; it may only be used to narrow the selection of possible keys to try.
    description: >-
      ACCEPTED_KEYS is called a set, and the steps then count the unique keys in it; the
      definition counts against n unique trusted public keys. Nothing says when two keys are the
      same: the same key material, the same trusted-key entry, or the same KEYID, which R-0006
      rules out for a security decision.
    consequence: >-
      If uniqueness is by entry, a trusted set that lists one key twice, say under two KEYIDs,
      lets one signer count twice towards t. Uniqueness by key material is the reading that
      keeps the threshold meaningful (inferred), though not by itself: one signature that
      verifies under two distinct trusted keys counts twice under it too (EP-15, SD-15).
    modelled_as: "F05.6 note; EP-12, EP-13, EP-15; state-machine.yaml M2 U2."
  - id: "SDP-4"
    class: "gap"
    canonical: "SD-15"
    title: "The KEYID filter's empty and plural results have no stated outcome"
    locators:
      - "§1.1 (L55-56)"
      - "§1.2 (L99)"
      - "§1.3 (L130, L133)"
    quotes:
      - source_lines: "99"
        quote: |-
          - Optionally, filter acceptable public keys by KEYID.
      - source_lines: "133"
        quote: |-
          - Add the accepted public key to the set ACCEPTED_KEYS.
      - source_lines: "55-56"
        quote: |-
          it may only be used to narrow the selection of possible keys to try.
    description: >-
      Filtering acceptable keys by KEYID can leave no key, or several. The procedures go
      straight to verifying, and §1.3 then adds 'the accepted public key', as if exactly one key
      verified.
    consequence: >-
      Verifiers may differ on a KEYID that matches no key (reject or skip, or retry with every
      key) and on which key to add when several verify, or whether to add each. Neither
      difference can accept a bad signature, since the hint decides nothing (inferred); adding
      every key that verifies can count one signature twice when a trusted key was admitted
      without proof that its holder signs with it (EP-15).
    modelled_as: "F04.2, F05.4, F05.6 on_error; EP-14, EP-15; state-machine.yaml M1 U1, M2 U1 and U3."
  - id: "SDP-5"
    class: "gap"
    canonical: "SD-11"
    title: "The old/new format test is not exclusive"
    locators:
      - "§4.6 (L484-487)"
      - "§2.1.2 (L253)"
    quotes:
      - source_lines: "484-487"
        quote: |-
          Verifiers can differentiate between the [old](https://github.com/in-toto/specification/blob/d416c1f334ac6b581f75c0fa65125fb434d7a610/in-toto-spec.md#42-file-formats-general-principles) and new envelope format by detecting the presence of the `payload` field (new format) vs `signed` field (old format).
      - source_lines: "253"
        quote: |-
          Consumers MUST ignore unrecognized fields.
    description: >-
      §4.6 tells the formats apart by payload (new) versus signed (old). An object with both, or
      neither, is not addressed, and under R-0015 a DSSE consumer ignores signed as an
      unrecognized member while an old-format reader would act on it.
    consequence: >-
      One object can be accepted as a DSSE envelope by one verifier and read as an old-format
      document by another: two interpretations of one signed object, the ambiguity DSSE exists
      to remove.
    modelled_as: "F07.4; EP-19."
  - id: "SDP-6"
    class: "ambiguity"
    canonical: "SD-8"
    title: "The scope of 'An unset field MUST be treated the same as set-but-empty'"
    locators:
      - "§2.1.2 (L248-251)"
    quotes:
      - source_lines: "248-249"
        quote: |-
          * The following fields are REQUIRED and MUST be set, even if empty: `payload`, `payloadType`, `signature`, `signature.sig`.
      - source_lines: "250"
        quote: |-
          * The following fields are OPTIONAL and MAY be unset: `signature.keyid`.
      - source_lines: "251"
        quote: |-
          An unset field MUST be treated the same as set-but-empty.
    description: >-
      The sentence closes the OPTIONAL bullet for signature.keyid but says 'An unset field' and
      does not limit itself to optional fields. Read over every field it makes an absent
      payload, payloadType or sig equal to an empty one, which the REQUIRED bullet's 'MUST be
      set' otherwise rules out.
    consequence: >-
      Two consumers can disagree on an envelope with payload missing: one rejects it as
      malformed, the other verifies it as an empty SERIALIZED_BODY.
    modelled_as: "EP-17; state-machine.yaml M1 U3, M2 U4."
  - id: "SDP-7"
    class: "scope"
    canonical: >-
      declined by normative.md: R-0016 and R-0017 bind every implementation for every envelope
      format (R-0097), so they reach a (t, n) verifier as written
    title: "The bytes-identity rule is not stated for the (t, n) procedure"
    locators:
      - "§1.2 (L109-113)"
      - "§1.3 (L125)"
      - "§2.3 (L270-276)"
    quotes:
      - source_lines: "109-110"
        quote: |-
          **Important:** Implementations MUST ensure that the same SERIALIZED_BODY that is verified is the same sent to the application layer.
      - source_lines: "125"
        quote: |-
          To verify a `(t, n)`-ENVELOPE:
      - source_lines: "270-271"
        quote: |-
          The following advisories are relevant to all envelope formats, not just the standard JSON envelope.
    description: >-
      The rule that the bytes verified are the bytes the application receives sits in §1.2,
      after the single-signature steps, and §2.3 extends it to all envelope formats. §1.3's
      procedure does not repeat it, and neither copy names verification procedures.
    consequence: >-
      Read narrowly, a (t, n) verifier is not bound by it. The model applies it to F05
      (inferred); it is plainly meant generally.
    modelled_as: "F05.11 (kind inferred); state-machine.yaml M2 forbidden and invariants."
  - id: "SDP-8"
    class: "terminology"
    canonical: "SD-16"
    title: "A valid (t, n)-ENVELOPE can still be rejected"
    locators:
      - "§1.3 (L121-123, L137-139)"
    quotes:
      - source_lines: "121-123"
        quote: |-
          A `(t, n)`-ENVELOPE is valid if the enclosed signatures pass the verification against at least `t` of `n` unique trusted public keys where `t` is application-specific.
      - source_lines: "137"
        quote: |-
          - Reject if PAYLOAD_TYPE is not a supported type.
      - source_lines: "138-139"
        quote: |-
          - Parse SERIALIZED_BODY according to PAYLOAD_TYPE. Reject if the parsing fails.
    description: >-
      Validity is defined by the signatures alone: they pass against at least t of n unique
      trusted keys. The procedure that follows also rejects an unsupported PAYLOAD_TYPE and a
      body that does not parse.
    consequence: >-
      'valid' and 'accepted' are different predicates. A check or API built from the definition
      alone omits two rejections.
    modelled_as: "state-machine.yaml M2 threshold_met versus delivered; F05 order_note."
  - id: "SDP-9"
    class: "gap"
    canonical: "SD-17"
    title: "'supported type' is undefined and not tied to the verifying key"
    locators:
      - "§1.2 (L82-83, L99, L102)"
      - "§4.2 (L336-337)"
    quotes:
      - source_lines: "82-83"
        quote: |-
          - Agree on a PAYLOAD_TYPE and cryptographic details, optionally including KEYID.
      - source_lines: "102"
        quote: |-
          - Reject if PAYLOAD_TYPE is not a supported type.
      - source_lines: "99"
        quote: |-
          - Optionally, filter acceptable public keys by KEYID.
      - source_lines: "336-337"
        quote: |-
          Every public key must be used for exactly one purpose over exactly one message type,
    description: >-
      Signer and verifier agree a PAYLOAD_TYPE out of band, but the procedures check only that
      PAYLOAD_TYPE is a supported type and narrow keys by KEYID alone; no step asks whether the
      key that verified is trusted for that type. §4.2 names one key per message type as the
      burden raw signatures impose.
    consequence: >-
      A verifier supporting several types accepts an envelope of type B signed by a key agreed
      only for type A. DSSE prevents confusing the types of one signed message; which signer may
      sign which type is left to policy the source does not describe.
    modelled_as: "F04.4, F05.9 notes; EP-22; OI-03."
  - id: "SDP-10"
    class: "typo"
    canonical: "SD-12"
    title: "The notebook's build interface takes 'three' parameters and lists two"
    locators:
      - "§5.3 (L558-561)"
    quotes:
      - source_lines: "558"
        quote: |-
          In our scenario, the build interface takes three user-defined parameters:
      - source_lines: "560"
        quote: |-
          * `command`: The shell command to run.
      - source_lines: "561"
        quote: |-
          * `encoding`: The `payloadType` to return.
    description: "Two parameters follow the sentence: command and encoding."
    consequence: "None for DSSE; a reader reproducing the attack looks for a third."
    modelled_as: "F08.2 note."
  - id: "SDP-11"
    class: "typo"
    canonical: "SD-12"
    title: "The notebook's prose names the characters z} where its code uses z~"
    locators:
      - "§5.7.2 (L1097, L1102)"
    quotes:
      - source_lines: "1097"
        quote: |-
          The characters `z}` will do precisely that: `z` is field number 15 of type length-delimited, and `~` is length 126,
      - source_lines: "1102"
        quote: |-
          target_payload + b"z~'
    description: >-
      The prose explains the two characters as z (field 15, length-delimited) and ~ (length 126)
      but writes them as z}; the code appends z~. ~ is 0x7E, 126, so the code is right and the
      prose's } (0x7D, 125) is wrong.
    consequence: "None for DSSE; z} as written would declare one byte too few."
    modelled_as: "not modelled (attack-construction detail)."
open_issues:
  - id: "OI-01"
    locator: "§1.3, §2.1.1"
    text: >-
      How the signatures of several signers reach one envelope: who serializes SERIALIZED_BODY,
      how further signers obtain it with PAYLOAD_TYPE, and who assembles the signatures list
      (F02.5, F03.4).
  - id: "OI-02"
    locator: "§1.1, §1.2, §1.3"
    text: >-
      Where the verifier's acceptable or trusted public keys come from, how KEYID is formed and
      mapped to them, and whether keys ever change. All of it is out of band and none is
      described (F01.2, F01.3).
  - id: "OI-03"
    locator: "§1.2"
    text: "Whether acceptable keys are bound to the PAYLOAD_TYPEs they may sign (SD-17)."
  - id: "OI-04"
    locator: "§1.2, §2.3"
    text: >-
      What the application layer receives besides the verified bytes: PAYLOAD_TYPE, the parsed
      message, the key or keys that verified (ACCEPTED_KEYS). Policy above the verifier may need
      them. For PAYLOAD_TYPE, that it must be the type verified is not said either (SD-19).
  - id: "OI-05"
    locator: "§1.2, §1.3, §4.3, §4.4"
    text: >-
      Whether the order of the verification steps is itself binding. Outcomes do not depend on
      it; the attack surface of parsing does (F04 order_note).
  - id: "OI-06"
    locator: "§1.2, §2.1.1"
    text: "How a single-signature verifier should treat several signatures (SD-9)."
  - id: "OI-07"
    locator: "§1.3"
    text: "The bounds of t, who sets it, and whether it may vary with PAYLOAD_TYPE (SD-10)."
  - id: "OI-08"
    locator: "§2.2"
    text: >-
      With a default or coded payloadType (§2.2), how the verifier rebuilds the exact
      PAYLOAD_TYPE string the signature covers (F01.5).
out_of_scope:
  - text: >-
      Sign(): algorithms, signature formats and key generation. Agreed out of band; the
      specification places no restriction on them.
    locator: "§1.1 (L71-73)"
  - text: "Key distribution, trust in a key, and how KEYID is computed and resolved."
    locator: "§1.1, §1.2 (L52-56, L82-83)"
  - text: >-
      Serializing and parsing a message according to its PAYLOAD_TYPE: each payload type's own
      format.
    locator: "§1.2 (L87, L103)"
  - text: "Encodings other than the JSON envelope, which the source does not standardize."
    locator: "§2.2 (L265)"
  - text: "The old in-toto/TUF envelope format and backwards compatibility with it (ITE-5, TAP-14)."
    locator: "§4.6 (L477-487)"
  - text: >-
      The reference implementation the test vectors point to (implementation/signing_spec.py),
      which record.yaml says is not specification text and was not read.
    locator: "§1.4 (L143)"
  - text: "The notebook's mock cryptography, CI/CD service and protobuf parser beyond what F08 uses."
    locator: "§5.5, §5.7"
