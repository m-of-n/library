  - id: "F04"
    name: "verify-single-signature"
    title: "Verifying one signature"
    locator: "§1.1, §1.2, §2.1.2, §2.3, §4.3, §4.4"
    kind_of_flow: "local procedure with reject exits"
    participants:
      - "verifier"
      - "application layer"
    summary: >-
      Decode, optionally narrow the keys by KEYID, verify SIGNATURE over the PAE, reject an
      unsupported PAYLOAD_TYPE, parse SERIALIZED_BODY, and give the application layer the very
      bytes that were verified. Every check rejects on failure. The machine is
      state-machine.yaml M1.
    order_note: >-
      The source's list order (L96-104): decode, filter, verify, type check, parse. The
      signature is verified BEFORE PAYLOAD_TYPE is checked as supported, and SERIALIZED_BODY is
      parsed LAST, after both. No sentence makes the order itself binding (inferred); it is the
      order §4.4 calls the preferred solution, verify before parsing, and the one §4.3 keeps
      open by asking the protocol not to require parsing before verifying (R-0028). Moving the
      type check ahead of step 3 changes only which rejection is reported, since acceptance
      needs steps 1, 3, 4 and 5 all to pass in any order (inferred); the parse needs a supported
      type to choose its parser, so it follows step 4 by necessity. Parsing ahead of step 3
      changes no outcome either, but puts the parser on unauthenticated bytes, which §4.4 calls
      error-prone and an increased attack surface. Step 6 is the bytes-identity rule of the
      paragraph after the list, which §2.3 restates for every envelope format.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        action: >-
          Receive the envelope and decode SERIALIZED_BODY, PAYLOAD_TYPE, SIGNATURE and KEYID:
          from the JSON envelope, base64-decode payload and sig in either alphabet, ignore
          members it does not recognize, and treat an unset keyid as an empty one. Reject if
          decoding fails.
        locator: "§1.2, §2.1.2"
        kind: "stated"
        inputs:
          - message: "JSON Envelope"
        outputs:
          - message: "Protocol parameters"
            field: "SERIALIZED_BODY"
          - message: "Protocol parameters"
            field: "PAYLOAD_TYPE"
          - message: "Protocol parameters"
            field: "SIGNATURE"
          - message: "Protocol parameters"
            field: "KEYID"
        quotes:
