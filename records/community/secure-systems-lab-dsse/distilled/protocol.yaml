  - id: "F05"
    name: "verify-threshold"
    title: "Verifying a (t, n)-ENVELOPE"
    locator: "§1.1, §1.2, §1.3, §2.1.2, §2.3, §4.3"
    kind_of_flow: "local procedure with a loop and reject exits"
    participants:
