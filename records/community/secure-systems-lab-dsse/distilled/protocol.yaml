applicability: >-
  APPLICABLE. protocol.md is the protocol for creating and verifying DSSE signatures independent
  of how they are transmitted or stored (L10-11). It defines an out-of-band agreement between
  signer and verifier, signing, a one-way hand-off of an encoded envelope, two verification
  procedures with reject exits (§1.2 single signature, §1.3 threshold) and the hand-off of the
  verified bytes to the application layer (§1.2, §2.3). Nothing goes back from verifier to
  signer: exchange, response, party and role occur 0 times; client occurs once, in §4.3 (L363, a
  client that misinterprets the payload), and server 2 times and request 4 times, all in the
  notebook and all about its CI/CD build service (census). Eight flows: F01 agreement, F02 sign,
  F03 encode and transmit, F04 verify one signature, F05 verify a (t, n)-ENVELOPE, F06 a
  multi-signature envelope at a single-signature verifier, F07 old or new format, F08 the
  notebook's payloadType attack and the PAE's answer to it. Unlike in-toto-envelope-v1's model,
  which left DSSE's signing and verification opaque, here they are the subject.
