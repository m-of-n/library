      - "application layer"
    summary: >-
      Decode SERIALIZED_BODY, PAYLOAD_TYPE and SIGNATURES. For each (SIGNATURE, KEYID):
      optionally narrow the keys by KEYID, verify SIGNATURE over the one PAE, skip it if that
      fails, otherwise add the key that verified it to ACCEPTED_KEYS, and stop once
      ACCEPTED_KEYS holds t unique keys. Reject if it holds fewer than t; then, as in F04,
      reject an unsupported PAYLOAD_TYPE and parse SERIALIZED_BODY last. A failing signature is
      skipped, not fatal. t is the application's and is not in the envelope. The machine is
      state-machine.yaml M2.
    order_note: >-
      The source's order: decode, the loop, the threshold check, the type check, the parse. As
      in F04 the signatures are verified before PAYLOAD_TYPE is checked, and parsing is last.
      Break (step 7) is an early exit: acceptance needs t unique keys whether the loop stops
      early or not, so it saves work and changes no accept or reject outcome; it does decide
      which keys end up in ACCEPTED_KEYS, which matters only if they are reported on (inferred,
      OI-04). The loop takes SIGNATURES in list order (inferred); the outcome does not depend on
      the order. ACCEPTED_KEYS is never said to start empty (step 2, inferred). The
      bytes-identity rule (step 11) is not restated in §1.3; it reaches it from §2.3, which
      binds implementations for all envelope formats (R-0097). This lane's SDP-7 called that a
      scope gap; normative.md declined it as a defect. Passing step 8 is what L121-123 calls a
      valid (t, n)-ENVELOPE; steps 9 and 10 can still reject it (SD-16).
