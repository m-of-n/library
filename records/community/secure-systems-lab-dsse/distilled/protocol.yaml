conventions:
  quoting: >-
    Every quotation is a quotes item {source_lines, quote}, cut from the rendering by script
    through bin/_source_text (whitespace collapsed, nothing else changed), never typed, with the
    tightest range that holds it; bin/check-quotes verifies every one. Markdown syntax
    (backticks, asterisks, link brackets) is part of the quoted text. action, guard, note and
    on_error are this file's wording; where they repeat source terms, the step's quotes and
    constrained_by carry the source.
  step_kind: >-
    stated: the source says the step happens, or binds it. inferred: this model's step, with
    inferred_reason saying what the source does and does not say.
  on_error_basis: >-
    stated: the source says what follows. inferred: this file's reading, and on_error says so.
    unspecified: the source names the step and says nothing of its failure. none: the step has
    no failure of its own.
  constrained_by: >-
    secure-systems-lab-dsse#R-NNNN ids of requirements.yaml. Pass 1 cited the fixed skeleton ids
    R-0001 to R-0033, and a C-id of inferred-candidates.yaml where a keyword-less sentence binds
    the step and had no R-id yet. Pass 2 added the ids that lane gave binding sentences no
    candidate caught (hunted: R-0034, R-0035, R-0045, R-0068, R-0084, R-0087 to R-0090, R-0097,
    R-0101, R-0103), where a step rests on one, and two of its inferred readings where an
    inferred step or error path states the same reading (R-0108, R-0110). Pass 3 rewired every
    C-id to the R-id the requirements lane promoted it as (the candidate's reason names it; the
    two texts are identical, or the R-id is the merge of a split pair), so no C-id is cited as a
    constraint. A rejected candidate is never cited as one, and a rejected sentence a step still
    quotes is named as context in constrained_by_note. Each id was selected by script from its table by source_lines and a
    phrase of its text, refusing zero or several matches, and every resolved pair was printed
    and read. The §4.3 design requirements (R-0023 to R-0033) are cited where a step is the
    mechanism by which the protocol meets one. R-0009 and R-0017 share their text
    (bin/check-id-joins --surface), as do the §1.2 and §1.3 copies of five verification
    sentences; each is cited for its own section.
  messages: >-
    inputs and outputs name messages and fields exactly as messages.yaml names them, checked by
    script: every message is a messages.yaml name and every field a field of it. context lists
    what a step uses that is not a message: keys, the supported types, the application's message
    before serialization. messages.yaml entries no step reads or writes: Envelope (protobuf
    schema), Signature (protobuf schema) (the protobuf schema defines the structure only,
    L204-205; JSON is the one recommended encoding).
  roles: >-
    from and to name roles of the roles list; from equal to to marks a local step; via names the
    channel of an agreement.
  steps: "A step is referred to as flow id and n, F04.3 for instance."
  error_paths: >-
    EP-n lists every failure the model knows in encoding, transit, decoding, verification and
    hand-off, stated or not, with the steps it can occur in, and a step's error_paths points
    back (checked both ways by script, pass 2). Failures of the agreement and of the signer's
    own computations (F01, F02, F03.1), which the source does not address, stay in those steps'
    on_error.
  source_defects: >-
    SDP-n are this lane's source-defect candidates, SDC-n messages.yaml's. The canonical list is
    normative.md's Source defects, SD-1 to SD-20, whose crosswalk maps both: each SDP entry
    below names its canonical id, SDC-1 to SDC-6 are SD-1 to SD-6, and SDP-7 was declined.
    Everywhere else this file cites the canonical SD-n.
roles:
  - name: "signer"
    locator: "§1.1, §1.2, §1.3, §2.1.2"
    kind: "stated"
    definition: >-
      Holds a signing key whose details it agreed out of band with the verifier. Serializes the
      message as SERIALIZED_BODY according to PAYLOAD_TYPE, signs the PAE of PAYLOAD_TYPE and
      SERIALIZED_BODY, optionally computes a KEYID, then encodes and transmits the four values,
      preferably as the JSON envelope, in either base64 alphabet. Several signers may sign the
      same payload (§1.3). The producers of §2.1.2, who may add members to the envelope, are
      this role's encoding side (inferred identification: §1.2 gives encoding to the signer).
    aliases:
      - "producer (§2.1.2)"
    quotes:
      - source_lines: "53-54"
        quote: |-
          As with Sign(), details are agreed upon out-of-band by the signer and verifier.
      - source_lines: "117-118"
        quote: |-
          Multi-signature enhances the security by allowing multiple signers to sign the same payload.
      - source_lines: "106-107"
        quote: |-
          Signers may use either, and verifiers **MUST** accept either.
      - source_lines: "252"
        quote: |-
          * Producers, or future versions of the spec, MAY add additional fields.
  - name: "verifier"
    locator: "§1.1, §1.2, §1.3, §2.1.2, §4.6"
    kind: "stated"
    definition: >-
      Holds acceptable public keys (trusted public keys in §1.3) and a set of supported
      PAYLOAD_TYPEs, both from the out-of-band agreement (inferred). Receives and decodes the
      envelope accepting either base64 alphabet, may narrow its keys by KEYID, verifies the
      signature or signatures over the PAE, rejects an unsupported PAYLOAD_TYPE, parses
      SERIALIZED_BODY last, and hands the verified bytes to the application layer. Can tell the
      old in-toto/TUF format from the new one. The consumers of §2.1.2, who must ignore
      unrecognized members, are this role's decoding side, and the implementations bound by the
      bytes-identity rule of §1.2 and §2.3 are its implementations (both identifications
      inferred: only a verifier decodes and sends a payload on after verification).
    aliases:
      - "consumer (§2.1.2)"
      - "implementations (§1.2, §2.3)"
      - "victim (§5)"
    quotes:
      - source_lines: "106-107"
        quote: |-
          Signers may use either, and verifiers **MUST** accept either.
      - source_lines: "99"
        quote: |-
          - Optionally, filter acceptable public keys by KEYID.
      - source_lines: "253"
        quote: |-
          Consumers MUST ignore unrecognized fields.
      - source_lines: "109-110"
        quote: |-
          Implementations MUST ensure that the same SERIALIZED_BODY that is verified is the same sent to the application layer.
      - source_lines: "484-487"
        quote: |-
          Verifiers can differentiate between the [old](https://github.com/in-toto/specification/blob/d416c1f334ac6b581f75c0fa65125fb434d7a610/in-toto-spec.md#42-file-formats-general-principles) and new envelope format by detecting the presence of the `payload` field (new format) vs `signed` field (old format).
  - name: "application layer"
    locator: "§1.2, §1.3, §2.2, §2.3, §4.6"
    kind: "stated"
    definition: >-
      Receives the verified SERIALIZED_BODY from the verifier and acts on it; what it receives
      must be the bytes that were verified. The source also leaves to the application the
      threshold t of a (t, n)-ENVELOPE, any encoding other than the JSON envelope, and backwards
      compatibility with the old in-toto/TUF format. Whether the application that sets t is the
      one that receives the payload is not said (inferred: one application above the verifier).
    quotes:
      - source_lines: "109-110"
        quote: |-
          Implementations MUST ensure that the same SERIALIZED_BODY that is verified is the same sent to the application layer.
      - source_lines: "122-123"
        quote: |-
          where `t` is application-specific.
      - source_lines: "258-259"
        quote: |-
          Optionally, applications may encode the signed message in other methods without invalidating the signature:
      - source_lines: "477-478"
        quote: |-
          Backwards compatibility with the old [in-toto]/[TUF] format will be handled by the application
  - name: "out-of-band channel"
    locator: "§1.1, §1.2"
    kind: "inferred"
    inferred_reason: >-
      The source names an agreement made out of band and says nothing of the means; the channel
      is modelled as a participant only so that the agreement can be drawn. It has no
      obligations.
    definition: >-
      Whatever carries the agreement between signer and verifier on PAYLOAD_TYPE, on Sign() and
      its cryptographic details including keys, and optionally on KEYID. Not the envelope.
    quotes:
      - source_lines: "80"
        quote: |-
          Out of band:
      - source_lines: "71-72"
        quote: |-
          Details are agreed upon out-of-band by the signer and verifier.
  - name: "attacker"
    locator: "§4.4, §5.2, §5.3, §5.4"
    kind: "stated"
    definition: >-
      The adversary of the attack notebook (§5) and of §4.4's example: has a trusted signer (a
      CI/CD service that signs what callers ask it to build) sign a message, then changes the
      unauthenticated payloadType so that the victim, a verifier, interprets the same signed
      bytes as another type. Not a party to DSSE; modelled for flow F08, the attack DSSE's PAE
      is built to stop. §4.4's own example names this party the signer, the one who gets a CI/CD
      system to produce a CBOR message (L409-411); the notebook calls it an attacker and the
      CI/CD service the signer. This model follows the notebook (inferred identification;
      SD-20).
    quotes:
      - source_lines: "535"
        quote: |-
          then an attacker can take a legitimate signed message of type X and get the victim to verify and interpret it as type Y.
      - source_lines: "563"
        quote: |-
          **Problem:** An attacker can trick the CI/CD system to sign arbitrary messages.
      - source_lines: "558"
        quote: |-
          (2) There exists a trusted CI/CD service that allows callers to perform arbitrary build requests and returns a signed in-toto link file.
      - source_lines: "409-411"
        quote: |-
          the signer could get a CI/CD system to produce a CBOR message saying X and then a verifier to interpret it as a protobuf message saying Y.
flows:
  - id: "F01"
    name: "out-of-band-agreement"
    title: "Agreeing PAYLOAD_TYPE, cryptographic details, KEYID and the threshold outside the envelope"
    locator: "§1.1, §1.2, §1.3, §2.2"
    kind_of_flow: "agreement (out of band)"
    participants:
      - "signer"
      - "out-of-band channel"
      - "verifier"
      - "application layer"
    summary: >-
      Before any envelope exists, signer and verifier agree outside it on a PAYLOAD_TYPE and on
      the cryptographic details, optionally including KEYID. Sign() is unrestricted, so the
      algorithm, the signature format and the keys are all part of this agreement; the
      verifier's acceptable public keys and its supported types come out of it (inferred). For
      several signatures the application fixes t, which is not carried in the envelope. An
      encoding other than the JSON envelope, not being standardized, needs agreeing too
      (inferred).
    order_note: >-
      The source orders nothing inside the agreement. It precedes signing (F02) and verification
      (F04, F05) because both use what is agreed (inferred). When it is made, how often, how a
      verifier obtains keys, and whether it ever changes are not described (OI-02); there is no
      key rollover, revocation or expiry anywhere in the source (state-machine.yaml census).
    steps:
      - n: "1"
        from: "signer"
        to: "verifier"
        via: "out-of-band channel"
        action: >-
          Agree the PAYLOAD_TYPE: an opaque, case-sensitive string that says how to interpret
          the payload, encoding and schema both. To avoid collisions it should be an
          application-specific media type, in lower case, or a URI that resolves to a
          description where it can and is case-normalized.
        locator: "§1.1, §1.2"
        kind: "stated"
        outputs:
          - message: "Protocol parameters"
            field: "PAYLOAD_TYPE"
        quotes:
          - source_lines: "82-83"
            quote: |-
              - Agree on a PAYLOAD_TYPE and cryptographic details, optionally including KEYID.
          - source_lines: "32-33"
            quote: |-
              * PAYLOAD_TYPE: Opaque, case-sensitive string that uniquely and unambiguously identifies how to interpret `payload`.
          - source_lines: "34-35"
            quote: |-
              To prevent collisions, the value SHOULD be either:
        constrained_by:
          - "secure-systems-lab-dsse#R-0055"
          - "secure-systems-lab-dsse#R-0038"
          - "secure-systems-lab-dsse#R-0039"
          - "secure-systems-lab-dsse#R-0001"
          - "secure-systems-lab-dsse#R-0002"
          - "secure-systems-lab-dsse#R-0003"
          - "secure-systems-lab-dsse#R-0004"
          - "secure-systems-lab-dsse#R-0005"
          - "secure-systems-lab-dsse#R-0023"
          - "secure-systems-lab-dsse#R-0024"
        on_error: >-
          unspecified by source: a PAYLOAD_TYPE of neither recommended form has no stated
          consequence. A type the verifier never agreed is later rejected as not supported
          (F04.4, F05.9), on the reading that supported means agreed (inferred).
        on_error_basis: "unspecified"
        note: >-
          R-0004 also says a URI MAY be unresolvable; R-0005's 'section 6.2.2.1' names no
          document (SD-3).
      - n: "2"
        from: "signer"
        to: "verifier"
        via: "out-of-band channel"
        action: >-
          Agree the cryptographic details: the signature algorithm and format behind Sign(), on
          which the specification places no restriction, and the keys. The verifier comes away
          with its acceptable public keys; how it obtains them is not described (inferred).
        locator: "§1.1, §1.2, §1.3"
        kind: "stated"
        context:
          - "signer: private key and Sign()"
          - "verifier: acceptable public keys, the n trusted keys of §1.3"
        quotes:
          - source_lines: "82-83"
            quote: |-
              - Agree on a PAYLOAD_TYPE and cryptographic details, optionally including KEYID.
          - source_lines: "71-72"
            quote: |-
              Details are agreed upon out-of-band by the signer and verifier.
          - source_lines: "72-73"
            quote: |-
              This specification places no restriction on the signature algorithm or format.
          - source_lines: "122"
            quote: |-
              unique trusted public keys
        constrained_by:
          - "secure-systems-lab-dsse#R-0055"
          - "secure-systems-lab-dsse#R-0051"
          - "secure-systems-lab-dsse#R-0052"
          - "secure-systems-lab-dsse#R-0053"
          - "secure-systems-lab-dsse#R-0025"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        note: >-
          'acceptable public keys' (L99, L130) and 'trusted public keys' (L122) name what the
          verifier holds; neither is defined further (OI-02).
      - n: "3"
        from: "signer"
        to: "verifier"
        via: "out-of-band channel"
        action: >-
          Optionally agree KEYID: how a key hint is formed and what it points to. KEYID is
          unauthenticated; it may narrow which keys a verifier tries and must decide nothing.
        guard: "optional"
        locator: "§1.1, §1.2"
        kind: "stated"
        outputs:
          - message: "Protocol parameters"
            field: "KEYID"
        quotes:
          - source_lines: "52-53"
            quote: |-
              * KEYID: Optional, unauthenticated hint indicating what key and algorithm was used to sign the message.
          - source_lines: "53-54"
            quote: |-
              As with Sign(), details are agreed upon out-of-band by the signer and verifier.
          - source_lines: "54-56"
            quote: |-
              It **MUST NOT** be used for security decisions; it may only be used to narrow the selection of possible keys to try.
        constrained_by:
          - "secure-systems-lab-dsse#R-0055"
          - "secure-systems-lab-dsse#R-0042"
          - "secure-systems-lab-dsse#R-0043"
          - "secure-systems-lab-dsse#R-0006"
          - "secure-systems-lab-dsse#R-0033"
        on_error: >-
          unspecified by source: no KEYID scheme is defined; without one the verifier does not
          filter (F04.2 and F05.4 are optional)
        on_error_basis: "unspecified"
      - n: "4"
        from: "application layer"
        to: "verifier"
        action: >-
          For multi-signature verification fix the threshold t, which is application-specific,
          and the set of n unique trusted public keys it is counted against. Neither is carried
          in the envelope, whose members are payload, payloadType and signatures (§2.1).
