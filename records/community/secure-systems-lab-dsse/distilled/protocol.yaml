  - id: "F02"
    name: "sign"
    title: "Signing: SERIALIZED_BODY, PAE, SIGNATURE, KEYID"
    locator: "§1.1, §1.2, §1.3, §4.3"
    kind_of_flow: "local procedure"
    participants:
      - "signer"
    summary: >-
      The signer serializes the message as SERIALIZED_BODY according to PAYLOAD_TYPE, builds
      PAE(UTF8(PAYLOAD_TYPE), SERIALIZED_BODY), signs those bytes to get SIGNATURE, and
      optionally computes a KEYID. What is signed is raw bytes, never base64 text, and
      PAYLOAD_TYPE is inside it. With several signers each signs the same PAE.
    order_note: >-
      Stated order: serialize, sign, then optionally KEYID (L87-90). Steps 2 and 3 are one
      source step, split here because the PAE is the byte string an implementation has to get
      exactly right. KEYID depends on the key, not on the signature, so step 4 may come anywhere
      (inferred). How further signers obtain SERIALIZED_BODY and PAYLOAD_TYPE is not described
      (OI-01).
    steps:
      - n: "1"
        from: "signer"
        to: "signer"
        action: >-
          Serialize the message according to PAYLOAD_TYPE; the result, an arbitrary byte
          sequence, is SERIALIZED_BODY. For a detached signature the message carries a
          cryptographic hash of the external data.
        locator: "§1.1, §1.2, §4.3"
        kind: "stated"
        inputs:
          - message: "Protocol parameters"
            field: "PAYLOAD_TYPE"
        context:
          - "the application's message to be signed"
        outputs:
          - message: "Protocol parameters"
            field: "SERIALIZED_BODY"
        quotes:
          - source_lines: "87-88"
            quote: |-
              - Serialize the message according to PAYLOAD_TYPE. Call the result SERIALIZED_BODY.
          - source_lines: "30"
            quote: |-
              * SERIALIZED_BODY: Arbitrary byte sequence to be signed.
          - source_lines: "375-376"
            quote: |-
              * NOTE: Detached signatures are supported by having the included message contain a cryptographic hash of the external data.
        constrained_by:
          - "secure-systems-lab-dsse#R-0056"
          - "secure-systems-lab-dsse#R-0037"
          - "secure-systems-lab-dsse#R-0100"
          - "secure-systems-lab-dsse#R-0024"
        on_error: "unspecified by source (a serialization failure is not addressed)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "signer"
        to: "signer"
        action: >-
          Build PAE(UTF8(PAYLOAD_TYPE), SERIALIZED_BODY): the ASCII string DSSEv1, a space, the
          decimal byte length of the UTF-8 type with no leading zeros, a space, the type bytes,
          a space, the decimal byte length of the body, a space, the body bytes. Nothing is
          canonicalized and nothing is base64-encoded.
        locator: "§1.1, §1.2"
        kind: "stated"
        inputs:
          - message: "Protocol parameters"
            field: "PAYLOAD_TYPE"
          - message: "Protocol parameters"
            field: "SERIALIZED_BODY"
        outputs:
          - message: "PAE (Pre-Authentication Encoding)"
        quotes:
          - source_lines: "89"
            quote: |-
              - Sign PAE(UTF8(PAYLOAD_TYPE), SERIALIZED_BODY).
          - source_lines: "64"
            quote: |-
              PAE(type, body) = "DSSEv1" + SP + LEN(type) + SP + type + SP + LEN(body) + SP + body
          - source_lines: "68"
            quote: |-
              LEN(s) = ASCII decimal encoding of the byte length of s, with no leading zeros
          - source_lines: "75-76"
            quote: |-
              * UTF8() is [UTF-8 encoding](https://tools.ietf.org/html/rfc3629), transforming a unicode string to a byte sequence.
        constrained_by:
          - "secure-systems-lab-dsse#R-0057"
          - "secure-systems-lab-dsse#R-0044"
          - "secure-systems-lab-dsse#R-0045"
          - "secure-systems-lab-dsse#R-0054"
          - "secure-systems-lab-dsse#R-0020"
          - "secure-systems-lab-dsse#R-0023"
          - "secure-systems-lab-dsse#R-0026"
          - "secure-systems-lab-dsse#R-0027"
        on_error: >-
          unspecified by source: a PAYLOAD_TYPE with no UTF-8 encoding (a lone surrogate) is not
          addressed (messages.yaml source_silences)
        on_error_basis: "unspecified"
        note: >-
          The byte layout and the §1.4 vector are messages.yaml's PAE entry and
          examples/pae.verbatim.txt.
      - n: "3"
        from: "signer"
        to: "signer"
        action: "Sign the PAE bytes with the agreed Sign(); the output is SIGNATURE."
        locator: "§1.1, §1.2"
        kind: "stated"
        inputs:
          - message: "PAE (Pre-Authentication Encoding)"
        context:
          - "signer: private key and Sign() (F01.2)"
        outputs:
          - message: "Protocol parameters"
            field: "SIGNATURE"
        quotes:
          - source_lines: "89"
            quote: |-
              Call the result SIGNATURE.
          - source_lines: "19"
            quote: |-
              SIGNATURE = Sign(PAE(UTF8(PAYLOAD_TYPE), SERIALIZED_BODY))
          - source_lines: "71"
            quote: |-
              * Sign() is an arbitrary digital signature format.
        constrained_by:
          - "secure-systems-lab-dsse#R-0057"
          - "secure-systems-lab-dsse#R-0035"
          - "secure-systems-lab-dsse#R-0051"
          - "secure-systems-lab-dsse#R-0052"
          - "secure-systems-lab-dsse#R-0053"
          - "secure-systems-lab-dsse#R-0025"
        on_error: "unspecified by source (a signing failure belongs to Sign(), which is out of band)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "signer"
        to: "signer"
        action: >-
          Optionally compute a KEYID, the hint to which key and algorithm signed, by the scheme
          agreed in F01.3.
        guard: "optional"
        locator: "§1.1, §1.2"
        kind: "stated"
        outputs:
          - message: "Protocol parameters"
            field: "KEYID"
        quotes:
          - source_lines: "90"
            quote: |-
              - Optionally, compute a KEYID.
          - source_lines: "52-53"
            quote: |-
              * KEYID: Optional, unauthenticated hint indicating what key and algorithm was used to sign the message.
        constrained_by:
          - "secure-systems-lab-dsse#R-0058"
          - "secure-systems-lab-dsse#R-0042"
          - "secure-systems-lab-dsse#R-0043"
          - "secure-systems-lab-dsse#R-0006"
          - "secure-systems-lab-dsse#R-0033"
        on_error: "none: an omitted KEYID is allowed"
        on_error_basis: "none"
      - n: "5"
        from: "signer"
        to: "signer"
        action: >-
          Each further signer repeats steps 2 to 4 over the same SERIALIZED_BODY and
          PAYLOAD_TYPE, so that every signature is over the same PAE.
        guard: "several signers (§1.3)"
        locator: "§1.3"
        kind: "stated"
        quotes:
          - source_lines: "117-118"
            quote: |-
              Multi-signature enhances the security by allowing multiple signers to sign the same payload.
          - source_lines: "131"
            quote: |-
              - Verify SIGNATURE against PAE(UTF8(PAYLOAD_TYPE), SERIALIZED_BODY).
        constrained_by:
          - "secure-systems-lab-dsse#R-0075"
          - "secure-systems-lab-dsse#R-0010"
          - "secure-systems-lab-dsse#R-0030"
        on_error: >-
          inferred: how further signers receive the bytes is not described (OI-01). A signature
          over other bytes does not verify against the envelope's one PAE and is skipped
          (F05.5).
        on_error_basis: "inferred"
        note: >-
          That every signature covers the same PAE is inferred: an envelope carries one payload
          and one payloadType, and §1.3 verifies every signature against the one PAE (L131).
  - id: "F03"
    name: "encode-and-transmit"
