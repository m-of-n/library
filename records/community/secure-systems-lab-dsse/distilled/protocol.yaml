  - id: "F06"
    name: "multi-signature-envelope-at-single-signature-verifier"
    title: "A multi-signature envelope verified by a single-signature verifier"
    locator: "§1.2, §1.3, §2.1.1, §5.5.4"
    kind_of_flow: "local procedure (inferred)"
    participants:
      - "verifier"
      - "application layer"
    summary: >-
      §2.1.1 makes an envelope with several signatures equivalent to separate envelopes with one
      signature each. A verifier that runs only the single-signature procedure (F04) can
      therefore take each element of signatures as an envelope of its own, with the same payload
      and payloadType, and accept if one of them passes F04. That is F05 with t = 1 (inferred).
    order_note: >-
      All inferred from the equivalence sentence, except F04 itself. The source does not say
      which signature a single-signature verifier checks. Checking only the first would make
      acceptance depend on the order of signatures, which the equivalence rules out (inferred).
      The type check and the parse concern the shared payload and payloadType, so they run once,
      after a signature passes (inferred, as F04's order).
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        action: "Receive a JSON envelope whose signatures list has more than one element."
        locator: "§2.1.1"
        kind: "stated"
        inputs:
          - message: "JSON Envelope"
            field: "signatures"
        quotes:
          - source_lines: "229-230"
            quote: |-
              An envelope MAY have more than one signature, which is equivalent to separate envelopes with individual signatures.
        constrained_by:
          - "secure-systems-lab-dsse#R-0010"
        on_error: >-
          unspecified by source: a verifier that refuses more than one signature at its decode
          step (F04.1) treats a conforming envelope as a decoding failure (EP-16)
        on_error_basis: "unspecified"
        error_paths:
          - "EP-16"
      - n: "2"
        from: "verifier"
        to: "verifier"
        action: >-
          Treat each element of signatures as a separate envelope carrying the same payload and
          payloadType.
        locator: "§2.1.1"
        kind: "inferred"
        inferred_reason: "Read from the equivalence clause of R-0010; the source describes no split."
        inputs:
          - message: "JSON Envelope"
            field: "signatures"
          - message: "Signature (element of signatures)"
            field: "sig"
          - message: "Signature (element of signatures)"
            field: "keyid"
        quotes:
          - source_lines: "229-230"
            quote: |-
              which is equivalent to separate envelopes with individual signatures.
        constrained_by:
          - "secure-systems-lab-dsse#R-0010"
        on_error: "none"
        on_error_basis: "none"
      - n: "3"
        from: "verifier"
        to: "application layer"
        action: >-
          Run F04 steps 2 and 3 on the separate envelopes until one signature verifies; then F04
          steps 4 to 6 once. Reject if none verifies.
        locator: "§1.2, §1.3, §2.1.1, §5.5.4"
        kind: "inferred"
        inferred_reason: >-
          F04 applied to each separate envelope; the result equals F05 with t = 1. The quoted
          notebook line is the pre-DSSE demo wrapper's verifier, which reads signatures[0] only:
          the first-only shape the equivalence rules out.
        inputs:
          - message: "Protocol parameters"
            field: "SIGNATURE"
          - message: "Protocol parameters"
            field: "KEYID"
        outputs:
          - message: "Protocol parameters"
            field: "SERIALIZED_BODY"
        quotes:
          - source_lines: "100-101"
            quote: |-
              - Verify SIGNATURE against PAE(UTF8(PAYLOAD_TYPE), SERIALIZED_BODY). Reject if the verification fails.
          - source_lines: "121-123"
            quote: |-
              A `(t, n)`-ENVELOPE is valid if the enclosed signatures pass the verification against at least `t` of `n` unique trusted public keys where `t` is application-specific.
          - source_lines: "717"
            quote: |-
              signature = base64.b64decode(wrapper['signatures'][0]['sig'])
        constrained_by:
          - "secure-systems-lab-dsse#R-0063"
          - "secure-systems-lab-dsse#R-0064"
          - "secure-systems-lab-dsse#R-0070"
          - "secure-systems-lab-dsse#R-0010"
        on_error: "inferred: reject when no separate envelope verifies (EP-16)"
        on_error_basis: "inferred"
        error_paths:
          - "EP-16"
  - id: "F07"
    name: "old-or-new-format-detection"
    title: "Telling the old in-toto/TUF format from the DSSE envelope"
    locator: "§2.1.2, §4.4, §4.6"
    kind_of_flow: "dispatch"
    participants:
      - "verifier"
      - "application layer"
    summary: >-
      A verifier can tell the old in-toto/TUF format from DSSE by which member is present:
      payload for the new format, signed for the old. A DSSE envelope goes on to F04 or F05; the
      old format is the application's to handle (ITE-5 for in-toto, TAP-14 for TUF). An object
      with both members, or neither, is not addressed.
    order_note: >-
      Before decoding (inferred): the test reads which members exist and nothing else. It is a
      capability (can), not an obligation.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        action: "Look for the payload member and the signed member in the received object."
        locator: "§4.6"
        kind: "stated"
        inputs:
          - message: "Old in-toto/TUF format (referenced only)"
            field: "payload"
          - message: "Old in-toto/TUF format (referenced only)"
            field: "signed"
        quotes:
          - source_lines: "484-487"
            quote: |-
              Verifiers can differentiate between the [old](https://github.com/in-toto/specification/blob/d416c1f334ac6b581f75c0fa65125fb434d7a610/in-toto-spec.md#42-file-formats-general-principles) and new envelope format by detecting the presence of the `payload` field (new format) vs `signed` field (old format).
        constrained_by:
          - "secure-systems-lab-dsse#R-0103"
        constrained_by_note: >-
          L484-487 is R-0103, which the requirements lane hunted after this file was first
          written (wired by pass 2).
        on_error: "see steps 2 to 4"
        on_error_basis: "none"
      - n: "2"
        from: "verifier"
        to: "verifier"
        action: "New format: verify it as a DSSE envelope (F04, or F05 for a threshold)."
        guard: "payload present, signed absent"
        locator: "§4.6"
        kind: "stated"
        inputs:
          - message: "JSON Envelope"
        quotes:
          - source_lines: "486-487"
            quote: |-
              the presence of the `payload` field (new format)
        constrained_by:
          - "secure-systems-lab-dsse#R-0103"
        on_error: "as F04 and F05"
        on_error_basis: "stated"
      - n: "3"
        from: "verifier"
        to: "application layer"
        action: >-
          Old format: leave it to the application's compatibility handling, which ITE-5
          (in-toto) and TAP-14 (TUF) describe outside this source.
        guard: "signed present, payload absent"
        locator: "§4.6"
        kind: "stated"
        inputs:
          - message: "Old in-toto/TUF format (referenced only)"
            field: "signed"
        quotes:
          - source_lines: "487"
            quote: |-
              `signed` field (old format).
          - source_lines: "477-482"
            quote: |-
              Backwards compatibility with the old [in-toto]/[TUF] format will be handled by the application and explained in the corresponding application-specific change proposal, namely [ITE-5](https://github.com/in-toto/ITE/pull/13) for in-toto and via the principles laid out in [TAP-14](https://github.com/theupdateframework/taps/blob/master/tap14.md) for TUF.
        constrained_by:
          - "secure-systems-lab-dsse#R-0103"
          - "secure-systems-lab-dsse#R-0102"
        on_error: "out of scope (ITE-5, TAP-14)"
        on_error_basis: "stated"
        error_paths:
          - "EP-20"
      - n: "4"
        from: "verifier"
        to: "verifier"
        action: >-
          Both members, or neither: not addressed. A DSSE consumer must ignore unrecognized
          members, so to it signed is noise and payload makes the object a DSSE envelope, while
          an old-format reader may act on signed. One object can then be read two ways, akin to
          the misinterpretation §4.4 holds against the old scheme and §4.3 asks the protocol to
          reduce (R-0023).
        guard: "both payload and signed present, or neither"
        locator: "§2.1.2, §4.4, §4.6"
        kind: "inferred"
        inferred_reason: >-
          §4.6 gives the two clean cases only; the reading of the mixed case combines it with
          R-0015.
        quotes:
          - source_lines: "253"
            quote: |-
              Consumers MUST ignore unrecognized fields.
          - source_lines: "407-408"
            quote: |-
              Second, the scheme does not include an authenticated "context" indicator to ensure that the signer and verifier interpret the payload in the same exact way.
        constrained_by:
          - "secure-systems-lab-dsse#R-0015"
          - "secure-systems-lab-dsse#R-0103"
          - "secure-systems-lab-dsse#R-0023"
        constrained_by_note: >-
          L407-408 is context, not a constraint: C-0077, rejected by the requirements lane as
          motivation; R-0023 is the design requirement it motivates.
        on_error: "unspecified by source (EP-19, SD-11)"
        on_error_basis: "unspecified"
        error_paths:
          - "EP-09"
          - "EP-19"
  - id: "F08"
    name: "type-confusion-attack"
    title: "The notebook's payloadType attack, and why the PAE stops it"
    locator: "§1.1, §5.2, §5.3, §5.4, §5.5.3, §5.5.4"
    kind_of_flow: "adversarial (pre-DSSE wrapper)"
    participants:
      - "attacker"
      - "signer"
      - "verifier"
    summary: >-
      The notebook's proof of concept against a wrapper that signs payload but not payloadType,
      a pre-DSSE wrapper and not DSSE: the attacker has a trusted CI/CD signer sign a CBOR link
      whose bytes also parse as a protobuf of the attacker's choosing, relabels payloadType from
      CBOR to Protobuf, and the victim's verifier accepts the signature and decodes the bytes as
      that protobuf. Under DSSE payloadType is inside the PAE, so the relabelled envelope fails
      F04.3 (step 5, inferred from §1.1).
    order_note: >-
      Steps 1 to 4 are §5.4's outline, in its order; step 5 is this model's, the DSSE outcome
      (inferred). examples/ reproduces the §1.4 vector's rejection under a changed type.
    steps:
      - n: "1"
        from: "attacker"
        to: "attacker"
        action: "Build the target payload T in protobuf format."
        locator: "§5.4"
        kind: "stated"
        quotes:
          - source_lines: "592"
            quote: |-
              1. Construct a target payload T in protobuf format that we want the victim to consume.
        constrained_by: []
        constrained_by_note: "Narrative of an attack; no requirement binds the attacker."
        on_error: "none"
        on_error_basis: "none"
      - n: "2"
        from: "attacker"
        to: "signer"
        action: >-
          Send the CI/CD service a crafted build request; it returns a link file signed over the
          payload alone, typed CBOR, whose bytes read as P when typed CBOR and as T when typed
          Protobuf.
        locator: "§5.3, §5.4, §5.5.3"
        kind: "stated"
        inputs:
          - message: "JSON Envelope"
        outputs:
          - message: "JSON Envelope"
        quotes:
          - source_lines: "593"
            quote: |-
              2. Send a carefully crafted build request that results CI/CD returning a signed CBOR-type link file, such that the payload is interpreted as P when type is CBOR but T when type is protobuf.
          - source_lines: "678"
            quote: |-
              signature = _PubkeySign(payload)
          - source_lines: "554"
            quote: |-
              * `signatures`: Cryptographic signatures over `payload` but **not** `payloadType`. **This is the problem.**
        constrained_by: []
        constrained_by_note: >-
          Narrative of an attack; the wrapper is the notebook's, with the JSON envelope's three
          members (L679-683) and a signature over payload only.
        on_error: "none"
        on_error_basis: "none"
        note: >-
          The notebook says the build interface takes three user-defined parameters and lists
          two (SD-12).
      - n: "3"
        from: "attacker"
        to: "attacker"
        action: >-
          Change payloadType from CBOR to Protobuf. In the notebook's wrapper the signature
          still verifies, payloadType being unauthenticated.
        locator: "§5.4"
        kind: "stated"
        inputs:
          - message: "JSON Envelope"
            field: "payloadType"
        outputs:
          - message: "JSON Envelope"
            field: "payloadType"
        quotes:
          - source_lines: "594"
            quote: |-
              3. Modify the `payloadType` field to say `Protobuf` instead of `CBOR`. This does not invalidate the signature because the `payloadType` is unauthenticated.
        constrained_by: []
        constrained_by_note: "Narrative of an attack."
        on_error: "none (in the notebook's wrapper)"
        on_error_basis: "none"
        error_paths:
          - "EP-23"
      - n: "4"
        from: "attacker"
        to: "verifier"
        action: >-
          Send the modified link file to the victim, which checks the signature over payload
          alone and decodes payload with the decoder payloadType names.
        locator: "§5.4, §5.5.4"
        kind: "stated"
        inputs:
          - message: "JSON Envelope"
        quotes:
          - source_lines: "595"
            quote: |-
              4. Send the modified link file to the victim. They will interpret the payload as T, even though the CI/CD system intended it to be interpreted as P.
          - source_lines: "718"
            quote: |-
              if not _PubkeyVerify(payload_bytes, signature):
          - source_lines: "722"
            quote: |-
              link = DECODERS[wrapper['payloadType']](payload_bytes)
        constrained_by: []
        constrained_by_note: "Narrative of an attack."
        on_error: "none: the victim accepts T (the attack succeeds against the notebook's wrapper)"
        on_error_basis: "stated"
      - n: "5"
        from: "verifier"
        to: "verifier"
        action: >-
          Under DSSE the victim's F04.3 rebuilds the PAE from the received PAYLOAD_TYPE.
          Protobuf in place of CBOR changes the PAE, the signature fails, and the envelope is
          rejected.
        locator: "§1.1, §5.2"
        kind: "inferred"
        inferred_reason: >-
          The notebook demonstrates the attack on a wrapper without an authenticated type and
          does not run it against DSSE; the outcome follows from PAYLOAD_TYPE being signed (§1.1
          table, Authenticated: Yes).
        inputs:
          - message: "JSON Envelope"
          - message: "Protocol parameters"
            field: "PAYLOAD_TYPE"
        quotes:
          - source_lines: "19"
            quote: |-
              SIGNATURE = Sign(PAE(UTF8(PAYLOAD_TYPE), SERIALIZED_BODY))
          - source_lines: "27"
            quote: |-
              PAYLOAD_TYPE | string | Yes | Yes
          - source_lines: "533"
            quote: |-
              Instead, the signature wrapper **must** include some authenticated "context" indicator that describes how to interpret the payload.
        constrained_by:
          - "secure-systems-lab-dsse#R-0035"
          - "secure-systems-lab-dsse#R-0036"
          - "secure-systems-lab-dsse#R-0057"
          - "secure-systems-lab-dsse#R-0063"
          - "secure-systems-lab-dsse#R-0064"
          - "secure-systems-lab-dsse#R-0023"
        constrained_by_note: >-
          L533, the notebook's thesis, is context, not a constraint: C-0115, rejected by the
          requirements lane (a worked attack, not specification).
        on_error: "inferred: reject (EP-02, EP-23)"
        on_error_basis: "inferred"
        error_paths:
          - "EP-02"
          - "EP-23"
ordering:
  single_signature: >-
    F04: decode (1), optional KEYID filter (2), signature (3), PAYLOAD_TYPE supported (4), parse
    (5), hand-off (6). The signature is verified before the type is checked and the body is
    parsed last.
  threshold: >-
    F05: decode (1), the loop (3 to 7) with skip on a failed signature and Break at t unique
    keys, threshold (8), PAYLOAD_TYPE supported (9), parse (10), hand-off (11). The same two
    facts hold: signatures before type, parse last.
  binding: >-
    The order is the source's list order; no sentence makes it binding. Acceptance needs every
    check to pass, so reordering the checks changes only which rejection is reported, except
    that the parse needs a supported type and so follows the type check by necessity; parsing
    before verifying changes the attack surface, which §4.3 (R-0028) and §4.4 (L403-404) argue
    against (OI-05).
  unique_keys: >-
    ACCEPTED_KEYS is a set of the keys that verified some signature; t is compared with the
    number of unique keys in it, so one key signing twice counts once. Key equality is not
    defined (SD-14); key material is the reading that keeps the threshold meaningful, though not
    alone: a signature that verifies under two distinct trusted keys counts twice under it too
    (EP-15, SD-15).
  t: >-
    t is application-specific (L122-123) and is not a member of the envelope; n is the number of
    unique trusted public keys and appears in no step. Neither is bounded (SD-10).
error_paths:
  - id: "EP-01"
    condition: "Decoding fails."
    steps:
      - "F04.1"
      - "F05.1"
    basis: "stated"
    outcome: "Reject."
    constrained_by:
      - "secure-systems-lab-dsse#R-0061"
      - "secure-systems-lab-dsse#R-0072"
  - id: "EP-02"
    condition: "The signature does not verify over the PAE (single-signature verification)."
    steps:
      - "F04.3"
      - "F08.5"
    basis: "stated"
    outcome: "Reject."
    constrained_by:
      - "secure-systems-lab-dsse#R-0064"
  - id: "EP-03"
    condition: "One signature of a (t, n)-ENVELOPE does not verify."
    steps:
      - "F05.5"
    basis: "stated"
    outcome: "Skip over it and go on with the next; not fatal to the envelope by itself."
    constrained_by:
      - "secure-systems-lab-dsse#R-0076"
  - id: "EP-04"
    condition: "After the loop ACCEPTED_KEYS holds fewer than t unique keys."
    steps:
      - "F05.8"
    basis: "stated"
    outcome: "Reject."
    constrained_by:
      - "secure-systems-lab-dsse#R-0079"
  - id: "EP-05"
    condition: "PAYLOAD_TYPE is not a supported type."
    steps:
      - "F04.4"
      - "F05.9"
    basis: "stated"
    outcome: "Reject, after the signature check in both procedures."
    constrained_by:
      - "secure-systems-lab-dsse#R-0065"
      - "secure-systems-lab-dsse#R-0080"
  - id: "EP-06"
    condition: "Parsing SERIALIZED_BODY according to PAYLOAD_TYPE fails."
    steps:
      - "F04.5"
      - "F05.10"
    basis: "stated"
    outcome: "Reject; this is the last check."
    constrained_by:
      - "secure-systems-lab-dsse#R-0067"
      - "secure-systems-lab-dsse#R-0082"
  - id: "EP-07"
    condition: >-
      The application layer is sent other bytes than those verified, for instance by re-parsing
      the envelope after verification to pull out the payload.
    steps:
      - "F04.6"
      - "F05.11"
    basis: "stated"
    outcome: >-
      Forbidden (MUST NOT); the stated consequence is that it can lead to security
      vulnerabilities. An implementation defect, not an input with an outcome.
    constrained_by:
      - "secure-systems-lab-dsse#R-0008"
      - "secure-systems-lab-dsse#R-0009"
      - "secure-systems-lab-dsse#R-0016"
      - "secure-systems-lab-dsse#R-0017"
  - id: "EP-08"
    condition: "payload or sig is in the other base64 alphabet."
    steps:
      - "F04.1"
      - "F05.1"
    basis: "stated"
    outcome: >-
      Accept: verifiers must take either alphabet, so rejecting one is non-conformant. Padding,
      mixed alphabets and whitespace are not addressed (messages.yaml source_silences).
    constrained_by:
      - "secure-systems-lab-dsse#R-0007"
  - id: "EP-09"
    condition: "The envelope has members the consumer does not recognize."
    steps:
      - "F04.1"
      - "F05.1"
      - "F07.4"
    basis: "stated"
    outcome: "Ignore them. They are outside the PAE and so unauthenticated (inferred)."
    constrained_by:
      - "secure-systems-lab-dsse#R-0015"
  - id: "EP-10"
    condition: "keyid is unset."
    steps:
      - "F04.1"
      - "F04.2"
      - "F05.1"
      - "F05.4"
    basis: "stated"
    outcome: "Treat it as set but empty; an empty KEYID narrows nothing (inferred)."
    constrained_by:
      - "secure-systems-lab-dsse#R-0013"
  - id: "EP-11"
    condition: "signatures is empty."
    steps:
      - "F03.4"
      - "F04.1"
      - "F05.3"
      - "F05.8"
    basis: "inferred"
    outcome: >-
      Single signature: there is no SIGNATURE to decode or verify, so F04.1 or F04.3 rejects
      (inferred). (t, n): the loop does not run and F05.8 rejects exactly when t >= 1; with t of
      0 or less an unsigned envelope is accepted (SD-10). Producer side: set-but-empty is
      allowed by §2.1.2 and breaks the proto's length >= 1 (SD-2).
    constrained_by:
      - "secure-systems-lab-dsse#R-0011"
      - "secure-systems-lab-dsse#R-0020"
      - "secure-systems-lab-dsse#R-0079"
    see:
      - "SD-10"
      - "SD-2"
  - id: "EP-12"
    condition: "Two signatures carry the same keyid."
    steps:
      - "F05.4"
    basis: "unspecified"
    outcome: >-
      Not addressed. keyid is only a hint, so a duplicate can neither count as a second signer
      nor be an error by itself (inferred); keys, not keyids, are counted.
    constrained_by:
      - "secure-systems-lab-dsse#R-0006"
    see:
      - "SD-14"
  - id: "EP-13"
    condition: "One key signs twice: two signatures verify under the same key."
    steps:
      - "F05.6"
      - "F05.7"
      - "F05.8"
    basis: "stated"
    outcome: >-
      The key counts once: ACCEPTED_KEYS is a set and the threshold counts unique keys. What
      makes two keys the same is not defined.
    constrained_by:
      - "secure-systems-lab-dsse#R-0077"
      - "secure-systems-lab-dsse#R-0078"
      - "secure-systems-lab-dsse#R-0079"
    see:
      - "SD-14"
  - id: "EP-14"
    condition: "KEYID matches no acceptable public key."
    steps:
      - "F04.2"
      - "F05.4"
    basis: "unspecified"
    outcome: >-
      Not addressed. With nothing left to try, F04.3 rejects and F05.5 skips (inferred); falling
      back to every acceptable key is also consistent with R-0006. Either way the hint can cause
      a false rejection and never a false acceptance (inferred).
    constrained_by:
      - "secure-systems-lab-dsse#R-0062"
      - "secure-systems-lab-dsse#R-0074"
      - "secure-systems-lab-dsse#R-0006"
    see:
      - "SD-15"
  - id: "EP-15"
    condition: "One signature verifies under more than one candidate key."
    steps:
      - "F05.6"
    basis: "unspecified"
    outcome: >-
      Not addressed: 'the accepted public key' presumes one. With honestly generated keys a
      sound signature scheme makes a second verifying key negligible, so in practice this is one
      key listed twice among the trusted keys, which uniqueness by key material collapses and
      uniqueness by entry double-counts. Unforgeability does not rule out a second key, though:
      a key admitted to the trusted set without proof that its holder signs with it can be made
      to verify another signer's signature, and one signature then counts for two distinct keys
      (inferred).
    constrained_by:
      - "secure-systems-lab-dsse#R-0077"
    see:
      - "SD-14"
      - "SD-15"
  - id: "EP-16"
    condition: "A multi-signature envelope reaches a verifier that runs only the single-signature procedure."
    steps:
      - "F06.1"
      - "F06.3"
      - "F04.1"
    basis: "inferred"
    outcome: >-
      Equivalent to separate envelopes: accept if one passes F04, which equals F05 with t = 1.
      Rejecting it at decoding, or checking only the first signature, is not what the
      equivalence describes.
    constrained_by:
      - "secure-systems-lab-dsse#R-0010"
    see:
      - "SD-9"
  - id: "EP-17"
    condition: "A required member (payload, payloadType, signatures or sig) is absent."
    steps:
      - "F03.2"
      - "F03.3"
      - "F03.4"
      - "F04.1"
      - "F05.1"
    basis: "unspecified"
    outcome: >-
      The consumer's handling is not stated. Read as a decoding failure it is rejected (EP-01,
      inferred); read with L251 over every field it equals an empty value (SD-8). The rule's own
      names are off (SD-1).
    constrained_by:
      - "secure-systems-lab-dsse#R-0011"
      - "secure-systems-lab-dsse#R-0013"
    see:
      - "SD-8"
      - "SD-1"
  - id: "EP-18"
    condition: "t is 0 or less, or greater than n."
    steps:
      - "F01.4"
      - "F05.8"
    basis: "unspecified"
    outcome: >-
