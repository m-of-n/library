  - id: 'secure-systems-lab-dsse#R-0104'
    locator: '§1.1'
    text: 'LEN of an empty byte sequence is the single ASCII digit 0 (byte 0x30), so the PAE of an empty PAYLOAD_TYPE and an empty body is the 12 bytes 44 53 53 45 76 31 20 30 20 20 30 20. The definition asks for decimal without leading zeros, which fixes every other length, and does not spell out zero; R-0011 makes an empty payload or payloadType something an envelope can carry.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0050 L68; R-0046 L64; R-0011 L248-249'
    actor: 'signer and verifier'
    object: 'PAE (Pre-Authentication Encoding)'
    field: 'LEN(s) of a zero-length s'
    testable: 'yes'
    note: 'messages.yaml takes the same reading (its LEN(type) field). An implementation that writes zero as an empty numeral computes a different PAE, so its signatures fail under one that writes 0.'
  - id: 'secure-systems-lab-dsse#R-0105'
    locator: '§1.1'
    text: 'Nothing in an envelope is authenticated but PAYLOAD_TYPE and SERIALIZED_BODY, the two inputs of PAE: KEYID, added members, and the number, order and presence of the other signatures can all be changed without invalidating a signature. A consumer treats them as unauthenticated, and a verified signature says nothing about what else the envelope held when it was signed.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0035 L19; R-0045 L64-68; R-0036 L24-28; R-0006 L54-56; R-0014 L252; R-0022 L314-317'
    actor: 'consumer (verifier and application)'
    object: 'JSON Envelope; any envelope format (§2.3)'
    field: 'authenticated: payloadType and payload, nothing else'
    testable: 'yes'
    note: 'The table states it for KEYID (R-0036); for added members and for the signatures array it follows from PAE alone. Vectors: change keyid, add a member, drop or reorder signatures; each remaining signature still verifies. So anyone can cut a (t, n)-ENVELOPE down to fewer signatures, and a verifier learns which trusted keys signed, not how many signers there were.'
  - id: 'secure-systems-lab-dsse#R-0106'
    locator: '§1.2'
    text: 'A verifier holds a set of trusted public keys from the out-of-band agreement and checks each SIGNATURE against them, narrowed by KEYID if it filters. The key a signature verifies under is the accepted key; a signature that verifies under no trusted key counts for nothing, whatever its KEYID. §1.2 says to verify against PAE without naming a key, and introduces acceptable public keys only in its optional filtering step.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0055 L82-83; R-0062 L99; R-0063 L100; R-0070 L121-123; R-0077 L133; R-0006 L54-56'
    actor: 'verifier'
    object: 'verification procedure (§1.2, §1.3)'
    field: 'trusted public keys; the accepted key'
    testable: 'yes'
    note: 'Vectors: a signature by an untrusted key whose keyid names a trusted key is rejected; a signature by a trusted key with a wrong or absent keyid is accepted by a verifier that does not filter, and may be rejected by one that does. This is the reading SD-15 needs: with several candidate keys each is tried, and with none the signature counts for nothing.'
  - id: 'secure-systems-lab-dsse#R-0107'
    locator: '§1.2'
    text: 'A verifier checks the signature over PAE before it parses SERIALIZED_BODY, and passes nothing on from an envelope that fails a step. The steps of §1.2 and §1.3 are listed in this order but never said to be ordered; background.md states the order (R-0101) and asks the design for it (R-0028).'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0063 L100; R-0066 L103; R-0075 L131; R-0081 L138; R-0028 L370; R-0101 L403-404'
    actor: 'verifier'
    object: 'verification procedure (§1.2, §1.3)'
    field: 'step order: verify, then parse'
    testable: 'yes'
    note: 'Vectors: a validly signed envelope whose payload does not parse is rejected at the parse step, after verifying; an envelope whose signature fails is rejected with its payload never parsed, observable through a parser that records its calls. Where the supported-type check falls is not fixed by this reading: before or after verification, it parses nothing.'
  - id: 'secure-systems-lab-dsse#R-0108'
    locator: '§1.2'
    text: 'The PAYLOAD_TYPE by which the application interprets SERIALIZED_BODY is the one the signature was verified with, taken from the verification step like the body. R-0008 and R-0016 say this of the body only; a payloadType read again from the envelope after verification can differ from the one verified and reopen the confusion that authenticating PAYLOAD_TYPE exists to prevent.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0008 L109-110; R-0009 L110-112; R-0016 L273-274; R-0066 L103; R-0036 L24-28'
    actor: 'implementation that verifies and hands the payload on'
    object: 'Protocol parameters: PAYLOAD_TYPE'
    field: 'PAYLOAD_TYPE handed to the application: the one verified'
    testable: 'partial'
    testable_reason: 'as R-0008: observable through the API with an envelope a second parse reads differently, such as one with two payloadType members.'
    note: 'The reading of SD-19 (normative.md; design-notes.md DN-SD-2, taken in by pass 2): the bytes-identity rule names the body only.'
  - id: 'secure-systems-lab-dsse#R-0109'
    locator: '§1.3'
    text: 'An envelope that carries more than one signature is verified by the procedure of §1.3, in which a failing signature is skipped and the envelope passes once signatures verify under t distinct trusted keys. §1.2, which rejects when its one SIGNATURE fails, is the case of one signature and t = 1, where the two procedures agree. Read so, one failing signature does not reject an envelope that has t good ones, as the equivalence of R-0092 also implies.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0060 L96-97; R-0064 L100-101; R-0076 L131-132; R-0079 L136; R-0092 L229-230'
    actor: 'verifier'
    object: '(t, n)-ENVELOPE; JSON Envelope'
    field: 'signatures with more than one element: verified by §1.3'
    testable: 'yes'
    note: 'The source says neither which procedure applies to a JSON envelope whose signatures array has several elements, nor which t a verifier that never chose one uses: SD-9. Vector: signatures [invalid, valid] with t = 1 is accepted under this reading, and rejected by a verifier that applies §1.2 to the first element.'
  - id: 'secure-systems-lab-dsse#R-0110'
    locator: '§2.2'
    text: 'Where another data structure omits payloadType or codes it as a default, a shorter string or an enum (R-0096), the signer signs and the verifier verifies over the full PAYLOAD_TYPE string, restored from the code before PAE is computed: the signature is over UTF8(PAYLOAD_TYPE), and the other encodings are allowed only without invalidating the signature (R-0094).'
