requirements:
  - id: 'secure-systems-lab-dsse#R-0001'
    locator: '§1.1'
    source_lines: '34-35'
    text: 'To prevent collisions, the value SHOULD be either:'
    verb: 'SHOULD'
    kind: stated
    actor: 'signer and verifier, who agree on PAYLOAD_TYPE out of band (R-0055); attributed, the sentence names only the value'
    object: 'Protocol parameters: PAYLOAD_TYPE'
    field: 'PAYLOAD_TYPE value: a media type or a URI'
    testable: 'yes'
    note: 'Lead-in to a nested list. Its two alternatives are R-0040 (a media type) and R-0041 (a URI), and each alternative carries SHOULDs of its own: R-0002 and R-0003 for a media type, R-0004 and R-0005 for a URI. Testable by grammar: the value is a media type (type/subtype, RFC 6838, outside this source) or a URI (RFC 3986, linked at L46). Whether a media type must be registered is not said; the item links the IANA registry. To prevent collisions is the purpose, the uniqueness R-0038 asks for. A verifier does not check this rule: it compares PAYLOAD_TYPE as an opaque string (R-0038, R-0065).'
  - id: 'secure-systems-lab-dsse#R-0002'
    locator: '§1.1'
    source_lines: '40-42'
    text: '* IMPORTANT: This SHOULD be an application-specific type describing both encoding and schema, NOT a generic type like `application/json`.'
    verb: 'SHOULD'
    kind: stated
    actor: 'signer and verifier choosing a media-type PAYLOAD_TYPE (attributed: This is the media type of R-0040)'
    object: 'Protocol parameters: PAYLOAD_TYPE'
    field: 'PAYLOAD_TYPE as a media type: application-specific, naming both encoding and schema; not a generic type'
    testable: 'partial'
    testable_reason: 'the negative half is checkable against a list of generic types, of which the source names one, application/json; whether a type is application-specific and describes both encoding and schema is a judgement the source gives no test for.'
    note: 'The capitalised NOT is emphasis, not a BCP 14 keyword (bin/bcp14-count counts NOT only inside MUST NOT, SHALL NOT, SHOULD NOT and NOT RECOMMENDED). Its rationale, C-0010 (rejected as rationale), is the confusion R-0039 and R-0023 address: two applications sharing an encoding and reading the payload differently. The example at L39 (C-0009, rejected as an example) is a vendor type with a +json suffix.'
  - id: 'secure-systems-lab-dsse#R-0003'
    locator: '§1.1'
    source_lines: '45'
    text: '* SHOULD be lowercase.'
    verb: 'SHOULD'
    kind: stated
    actor: 'signer and verifier choosing a media-type PAYLOAD_TYPE (attributed: the item has no subject; it qualifies the media type of R-0040)'
    object: 'Protocol parameters: PAYLOAD_TYPE'
    field: 'PAYLOAD_TYPE as a media type: lowercase'
    testable: 'yes'
    note: 'Test: the value equals its own lowercase. Media types are case-insensitive (RFC 6838, outside this source) while PAYLOAD_TYPE is a case-sensitive opaque string (R-0038), so a verifier comparing exactly treats two spellings of one media type as two types; this SHOULD keeps to one spelling.'
  - id: 'secure-systems-lab-dsse#R-0004'
    locator: '§1.1'
    source_lines: '48-49'
    text: '* SHOULD resolve to a human-readable description but MAY be unresolvable.'
    verb: 'SHOULD'
    kind: stated
    actor: 'whoever defines a URI PAYLOAD_TYPE (attributed: the item has no subject; it qualifies the URI of R-0041)'
    object: 'Protocol parameters: PAYLOAD_TYPE'
    field: 'PAYLOAD_TYPE as a URI: resolves to a human-readable description; an unresolvable URI is permitted'
    testable: 'partial'
    testable_reason: 'resolution can be attempted, but its result changes over time and whether what it returns is a human-readable description is a judgement; the MAY makes an unresolvable URI conforming, so no value fails outright.'
    note: 'Two keywords, SHOULD and MAY, not split: both concern one property of one value, resolvability, and the MAY only removes the failing case of the SHOULD; verb takes the first. Nothing asks a verifier to resolve PAYLOAD_TYPE: it compares the string (R-0038), so verification never needs the network for it.'
  - id: 'secure-systems-lab-dsse#R-0005'
    locator: '§1.1'
    source_lines: '50'
    text: '* SHOULD be case-normalized (section 6.2.2.1)'
    verb: 'SHOULD'
    kind: stated
    actor: 'whoever defines a URI PAYLOAD_TYPE (attributed: the item has no subject; it qualifies the URI of R-0041)'
    object: 'Protocol parameters: PAYLOAD_TYPE'
    field: 'PAYLOAD_TYPE as a URI: case-normalized'
    testable: 'partial'
    testable_reason: 'mechanical once the reference is fixed: section 6.2.2.1 is read as RFC 3986 section 6.2.2.1, Case Normalization (scheme and host in lowercase, the hexadecimal digits of a percent-encoding in uppercase), RFC 3986 being the document the URI item links at L46; the source names no document (SD-3).'
    note: 'Only case normalization is asked for. URIs that RFC 3986 holds equivalent under its other normalizations (percent-encoding, path segments) stay different PAYLOAD_TYPEs to a verifier comparing exactly (R-0038).'
  - id: 'secure-systems-lab-dsse#R-0006'
    locator: '§1.1'
    source_lines: '54-56'
    text: 'It **MUST NOT** be used for security decisions; it may only be used to narrow the selection of possible keys to try.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'verifier, and any consumer holding a KEYID (attributed; passive)'
    object: 'Protocol parameters: KEYID'
    field: 'KEYID: never an input to a security decision; at most it narrows the keys to try'
    testable: 'partial'
    testable_reason: 'security decisions are not defined, so the rule cannot be tested exhaustively; its core can: a signature whose KEYID names a trusted key but which verifies only under an untrusted key is not accepted, and two signatures by one key with different KEYIDs count once toward t (R-0077, R-0079).'
    note: 'KEYID is outside PAE, so anyone can change it without invalidating a signature (R-0036: Authenticated No; envelope.proto calls it unauthenticated, R-0022). The lowercase may only of the second clause limits KEYID to one use, the filtering of R-0062 and R-0074; it is not a BCP 14 MAY, and its force comes from the MUST NOT. Filtering only removes keys, so a wrong KEYID can cause a rejection, never an acceptance. Not split: both clauses state one restriction. KEYID is said to hint at the algorithm as well (R-0042): SD-13.'
  - id: 'secure-systems-lab-dsse#R-0007'
    locator: '§1.2'
    source_lines: '106-107'
    text: 'Signers may use either, and verifiers **MUST** accept either.'
    verb: 'MUST'
    kind: stated
    actor: 'verifier (the MUST); signers have a permission (lowercase may)'
    object: 'Base64 encodings'
    field: 'payload and sig: both the standard (RFC 4648 section 4) and the URL-safe (section 5) alphabet accepted'
    testable: 'yes'
    note: 'Either is the two encodings of R-0068; envelope.md repeats the permission (R-0090) and defines Base64() as RFC 4648 (R-0089). Not split: the signers clause is a permission with no failing case. Test: the L177-179 result with its sig re-encoded in the URL-safe alphabet still verifies (that sig contains + characters, so the two alphabets differ; its payload is the same in both). Not stated: padding (the vector is padded; RFC 4648 section 3.2 requires padding unless a referring specification says otherwise), and whether an envelope may mix the alphabets across payload and sig or within one string; messages.yaml lists these as silences.'
  - id: 'secure-systems-lab-dsse#R-0008'
    locator: '§1.2'
    source_lines: '109-110'
    text: '**Important:** Implementations MUST ensure that the same SERIALIZED_BODY that is verified is the same sent to the application layer.'
    verb: 'MUST'
    kind: stated
    actor: 'implementation that verifies and hands the payload on (verifier side)'
    object: 'Protocol parameters: SERIALIZED_BODY'
    field: 'SERIALIZED_BODY: the bytes handed to the application are the bytes verified'
    testable: 'partial'
    testable_reason: 'a property of the implementation''s structure; observable through its API with an envelope a second decoding would read differently, such as a JSON envelope with two payload members: what the application receives is the bytes the signature was checked over.'
    note: 'Its envelope.md counterpart is R-0016, worded with payload bytes for SERIALIZED_BODY and scoped by R-0097 to every envelope format: the same obligation in another file. R-0009 names the way to break it. The PAYLOAD_TYPE by which the application reads the body is not mentioned: R-0108, SD-19. The sentence after it (L112-113) is rationale, quoted as context in normative.md.'
  - id: 'secure-systems-lab-dsse#R-0009'
    locator: '§1.2'
    source_lines: '110-112'
    text: 'In particular, implementations MUST NOT re-parse the envelope after verification to pull out the payload.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'implementation that verifies and hands the payload on (verifier side)'
    object: 'JSON Envelope (and any envelope)'
    field: 'payload: taken from the verification step, never from a second parse of the envelope'
    testable: 'partial'
    testable_reason: 'as R-0008: a structural rule, observable only where a second parse would yield different bytes (duplicate members, a parser differential).'
    note: 'The text is identical to R-0017 (envelope.md, §2.3): tell them apart by locator and source_lines. A particular case of R-0008.'
  - id: 'secure-systems-lab-dsse#R-0010'
    locator: '§2.1.1'
    source_lines: '229-230'
    text: 'An envelope MAY have more than one signature, which is equivalent to separate envelopes with individual signatures.'
    verb: 'MAY'
    kind: stated
    actor: 'producer (the signer that builds the envelope); attributed, the sentence names the envelope'
    object: 'JSON Envelope'
    field: 'signatures: more than one element, each equivalent to a separate envelope'
    testable: 'yes'
    split_into:
      - 'secure-systems-lab-dsse#R-0091'
      - 'secure-systems-lab-dsse#R-0092'
    note: 'A permission and a statement of meaning in one sentence, each with its own test; split into R-0091 (the permission) and R-0092 (the equivalence). The design requirement it meets is R-0030.'
  - id: 'secure-systems-lab-dsse#R-0011'
    locator: '§2.1.2'
    source_lines: '248-249'
    text: '* The following fields are REQUIRED and MUST be set, even if empty: `payload`, `payloadType`, `signature`, `signature.sig`.'
    verb: 'REQUIRED'
    kind: stated
    actor: 'producer (attributed; the sentence names only the fields)'
    object: 'JSON Envelope; Signature (element of signatures)'
    field: 'payload, payloadType, signatures, and sig in each element: present, even when the value is empty'
    testable: 'yes'
    note: 'Two keywords, REQUIRED and MUST, not split: both ask for presence, and even if empty only adds that an empty value is still written; verb takes the first. The names signature and signature.sig do not match the structure, which has signatures, an array, with sig in each element (L214-216, envelope.proto L306 and L312): read as those, SD-1. Even if empty admits an empty signatures array, which envelope.proto''s REQUIRED (length >= 1) forbids (R-0020): SD-2. proto3 writes no empty field, so the formal schema cannot carry this rule: SD-7. What a consumer does with an envelope missing one of these fields is not said; R-0061 is the nearest rule: SD-8. An empty payloadType is present but identifies nothing (R-0038), and a verifier rejects it as unsupported (R-0065).'
  - id: 'secure-systems-lab-dsse#R-0012'
    locator: '§2.1.2'
    source_lines: '250'
    text: '* The following fields are OPTIONAL and MAY be unset: `signature.keyid`.'
    verb: 'OPTIONAL'
    kind: stated
    actor: 'producer (may omit keyid); consumer (accepts the omission)'
    object: 'Signature (element of signatures)'
    field: 'keyid: may be absent'
    testable: 'yes'
    note: 'Two keywords, OPTIONAL and MAY, not split: they grant one permission twice; verb takes the first. signature.keyid is read as the keyid of each element of signatures: SD-1. Tested with R-0013: a signature without keyid is accepted and processed as one whose keyid is empty. The parameter table makes KEYID optional too (R-0036, R-0042).'
  - id: 'secure-systems-lab-dsse#R-0013'
    locator: '§2.1.2'
    source_lines: '251'
    text: 'An unset field MUST be treated the same as set-but-empty.'
    verb: 'MUST'
    kind: stated
    actor: 'consumer (attributed; passive)'
    object: 'Signature (element of signatures)'
    field: 'keyid (the OPTIONAL field): unset is processed as the empty string'
    testable: 'yes'
    note: 'Read as scoped to the OPTIONAL fields of its own list item, that is keyid. The sentence itself says only an unset field; read literally it would also give a consumer a rule for a missing REQUIRED field, which R-0011 has the producer always set: SD-8. Test: one envelope with keyid absent and with keyid set to the empty string gives the same result, including the same KEYID filtering (R-0062). It matches proto3, where an unset string field reads as empty.'
  - id: 'secure-systems-lab-dsse#R-0014'
    locator: '§2.1.2'
    source_lines: '252'
    text: '* Producers, or future versions of the spec, MAY add additional fields.'
    verb: 'MAY'
    kind: stated
    actor: 'producer; future versions of the specification'
    object: 'JSON Envelope; Signature (element of signatures)'
    field: 'additional members, at either level the parsing rules name (the envelope, or a signature)'
    testable: 'partial'
    testable_reason: 'a permission: an envelope with an added member conforms; the testable side is the consumer''s, R-0015.'
    note: 'An added member is outside PAE and so unauthenticated: anyone, not only a producer, can add one without invalidating a signature (R-0105). A DSSE envelope that adds a member named signed confuses the format detection of R-0103: SD-11.'
  - id: 'secure-systems-lab-dsse#R-0015'
    locator: '§2.1.2'
    source_lines: '253'
    text: 'Consumers MUST ignore unrecognized fields.'
    verb: 'MUST'
    kind: stated
    actor: 'consumer'
    object: 'JSON Envelope; Signature (element of signatures)'
    field: 'unrecognized members: ignored, not rejected'
    testable: 'yes'
    note: 'Test: the L177-179 result with an extra top-level member and an extra member in its signature still verifies. A JSON Schema closed with additionalProperties false breaks this rule. Ignoring is safe because nothing outside PAE is authenticated anyway (R-0105).'
  - id: 'secure-systems-lab-dsse#R-0016'
    locator: '§2.3'
    source_lines: '273-274'
    text: '**Important:** Implementations MUST ensure that the same payload bytes that are verified are the ones sent to the application layer.'
    verb: 'MUST'
    kind: stated
    actor: 'implementation that verifies and hands the payload on, in any envelope format (R-0097)'
    object: 'any envelope format (§2.3)'
    field: 'payload bytes: those handed to the application are those verified'
    testable: 'partial'
    testable_reason: 'as R-0008.'
    note: 'The envelope.md counterpart of R-0008: the same obligation, worded with payload bytes for SERIALIZED_BODY and made format-independent by R-0097. The texts differ, so this pair is not a duplicate-text group; R-0009 and R-0017 are.'
  - id: 'secure-systems-lab-dsse#R-0017'
    locator: '§2.3'
    source_lines: '274-276'
    text: 'In particular, implementations MUST NOT re-parse the envelope after verification to pull out the payload.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'implementation that verifies and hands the payload on, in any envelope format (R-0097)'
    object: 'any envelope format (§2.3)'
    field: 'payload: never re-parsed out of the envelope after verification'
    testable: 'partial'
    testable_reason: 'as R-0009.'
    note: 'The text is identical to R-0009 (protocol.md, §1.2): tell them apart by locator and source_lines. Scoped to every envelope format by R-0097.'
  - id: 'secure-systems-lab-dsse#R-0018'
    locator: '§3'
    source_lines: '289-291'
    text: '(In JSON, this is encoded as base64.) // REQUIRED. bytes payload = 1;'
    verb: 'REQUIRED'
    kind: stated
    actor: 'producer (attributed: a field comment)'
    object: 'Envelope (protobuf schema)'
    field: 'payload (bytes, field 1): required; base64 in JSON'
    testable: 'yes'
    note: 'REQUIRED is a comment, which proto3 does not enforce, and proto3 does not write an empty bytes field, so required and empty cannot be told apart on the wire: SD-7. The skeleton text begins after the comment''s first sentence (L289), which calls the payload the message to be signed although what is signed is PAE(type, payload): SD-5. The parenthesis restates the template''s Base64(SERIALIZED_BODY) (R-0088).'
  - id: 'secure-systems-lab-dsse#R-0019'
    locator: '§3'
    source_lines: '293-295'
    text: '// String unambiguously identifying how to interpret payload. // REQUIRED. string payloadType = 2;'
    verb: 'REQUIRED'
    kind: stated
    actor: 'producer (attributed: a field comment)'
    object: 'Envelope (protobuf schema)'
    field: 'payloadType (string, field 2): required'
    testable: 'yes'
    note: 'The comment restates R-0038 in brief. As for R-0018, REQUIRED is a comment proto3 does not enforce: SD-7.'
  - id: 'secure-systems-lab-dsse#R-0020'
    locator: '§3'
    source_lines: '297-307'
    text: '// Signature over: // PAE(type, payload) // Where PAE is defined as: // PAE(type, payload) = "DSSEv1" + SP + LEN(type) + SP + type + SP + LEN(payload) + SP + payload // + = concatenation // SP = ASCII space [0x20] // "DSSEv1" = ASCII [0x44, 0x53, 0x53, 0x45, 0x76, 0x31] // LEN(s) = ASCII decimal encoding of the byte length of s, with no leading zeros // REQUIRED (length >= 1). repeated Signature signatures = 3; }'
    verb: 'REQUIRED'
    kind: stated
    actor: 'producer (attributed: a field comment)'
    object: 'Envelope (protobuf schema)'
    field: 'signatures (repeated Signature, field 3): at least one element; each a signature over PAE(type, payload)'
    testable: 'yes'
    note: 'Carries a second statement of PAE, in comment form, with payload for body; its bytes are those of R-0045. The length >= 1 contradicts the even if empty of R-0011: SD-2. Not split: the PAE restatement adds nothing to R-0045, so the cardinality is the only obligation of its own. The skeleton text runs to the closing brace of message Envelope (L307).'
  - id: 'secure-systems-lab-dsse#R-0021'
    locator: '§3'
