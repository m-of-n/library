implementations:
  open_source:
    - name: "@ipld/dag-cbor"
      url: https://github.com/ipld/js-dag-cbor
      license: Apache-2.0
      language: javascript
      note: "Named by the spec as the recommended JS codec. Per the spec's own caveat, enforces shortest ints/lengths and 0xd82a on decode but not map key order or float width."
    - name: go-ipld-prime (dagcbor codec)
      url: https://github.com/ipld/go-ipld-prime
      license: MIT
      language: go
      note: "Named by the spec as the recommended Go codec. Per the spec: no decode strictness (permitted by §Decode strictness), and NaN/Infinity accepted on encode and decode, which §Strictness item 5 forbids."
    - name: cbor-gen
      url: https://github.com/whyrusleeping/cbor-gen
      license: MIT
      language: go
      note: "Code-generated CBOR used by Filecoin. Per the spec, sorts map keys with sort.Strings(), not the length-first order DAG-CBOR requires."
    - name: serde_ipld_dagcbor
      url: https://github.com/ipld/serde_ipld_dagcbor
      license: "not asserted by GitHub API (NOASSERTION)"
      language: rust
      note: "Not listed by the spec; strictness behaviour not checked."
    - name: Java IPLD (Peergos)
      url: https://github.com/Peergos/Peergos
      license: AGPL-3.0
      language: java
      note: "Per the spec: no decode strictness, floats disabled."
