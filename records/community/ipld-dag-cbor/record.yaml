usefulness:
  verdict: useful
  reason: "Evidence for the convergence question, mostly negative: a deterministic CBOR profile in production that claims RFC 8949 §4.2 but departs from §4.2.1 on floats, allows decoders to drop strictness by default, and whose own recommended Go codec violates its float rules. Not a profile a key-centric format should cite."
