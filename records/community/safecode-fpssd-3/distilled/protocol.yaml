schema: "library-protocol/v1"
record: safecode-fpssd-3
title: "Vulnerability report intake, handling and disclosure (SAFECode FPSSD 3rd ed., Vulnerability Response and Disclosure)"
extracted: "2026-10-02"
reviewed_by: ""
note: "SAFECode defers detail to ISO/IEC 29147 (disclosure) and ISO/IEC 30111 (handling); this is the exchange it states itself. Message names are ours; texts are verbatim."
roles:
  - {id: reporter, source: "'vulnerability reporters (or security researchers) and ... customers'"}
  - {id: psirt, source: "'Product Security Incident Response Teams (PSIRT) or incident response teams'"}
  - {id: owning-dev-team, source: "'the team that owns the vulnerable code'"}
  - {id: dependent-teams, source: "'If the team develops software that is reused by other teams, then dependent teams need to be notified'"}
  - {id: customers, source: "'communicated to customers through security advisories, bulletins, or similar notification methods'"}
messages:
  - {id: VulnerabilityReport, from: reporter, to: psirt, channel: "easily discoverable intake, e.g. company website; confidential where possible", text: "Secure communication methods such as encrypted email addresses and public keys should be clearly documented within the internal and external vulnerability response policies."}
  - {id: Acknowledgement, from: psirt, to: reporter, text: "receipt of reports should be acknowledged by the PSIRT in a timely manner. At the time of receipt, an expectation of how the organization will respond should be set and if necessary, a request for additional information (to support triage) from the reporter should be made."}
  - {id: StatusUpdate, from: psirt, to: reporter, text: "While the reported vulnerability is being investigated, a best practice amongst SAFECode members is to keep in contact with the reporter with the latest status so that they know you are taking the report seriously."}
  - {id: TriageRequest, from: psirt, to: owning-dev-team, text: "The reported vulnerability should be immediately triaged by the team that owns the vulnerable code for validation and remediation, if appropriate."}
  - {id: DependentTeamNotice, from: owning-dev-team, to: dependent-teams, text: "If the team develops software that is reused by other teams, then dependent teams need to be notified, and should update their software accordingly."}
  - {id: SecurityAdvisory, from: psirt, to: customers, fields_schema: "schema/safecode-records.derived.schema.json#/$defs/SecurityAdvisory", text: "Security advisories and bulletins should be released only once fixes are in place for all supported versions of the affected product(s)."}
flows:
  - {id: coordinated, steps: [VulnerabilityReport, Acknowledgement, TriageRequest, StatusUpdate, DependentTeamNotice, SecurityAdvisory]}
  - {id: public-or-exploited, steps: [VulnerabilityReport, Acknowledgement, TriageRequest, SecurityAdvisory], note: "'it may be desirable to release a public security advisory before a fix for the vulnerability is ready for release'"}
error_paths:
  - "No status contact → 'they may publicize their findings before the vulnerability is addressed.'"
