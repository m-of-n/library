schema: "library-state-machine/v1"
record: safecode-fpssd-3
title: "SAFECode FPSSD 3rd ed. — security finding disposition, risk acceptance, and vulnerability handling"
extracted: "2026-10-02"
reviewed_by: ""
machines:
  - id: security-finding
    subject: "a security finding from threat modeling, TPC identification, SAST, DAST, penetration testing, etc."
    locator: "Manage Security Findings"
    states:
      - {id: open, kind: inferred, description: "recorded in a tracking (ideally ADLM) system, identified as a security issue, severity assigned"}
      - {id: remediated, kind: stated, text: "For a finding to be remediated, the risk is completely eliminated, and to be mitigated, the risk is reduced but not completely eliminated."}
      - {id: mitigated, kind: stated, text: "For a finding to be remediated, the risk is completely eliminated, and to be mitigated, the risk is reduced but not completely eliminated."}
      - {id: risk-accepted, kind: stated, text: "Once the residual risk is understood, a decision must be made whether the risk is acceptable, whether additional mitigations are required, or whether the issue must be fully remediated."}
    transitions:
      - {from: open, to: remediated, kind: stated, text: "The findings from these artifacts must be tracked and action taken to remediate, mitigate or accept the respective risk."}
      - {from: open, to: mitigated, kind: stated}
      - {from: mitigated, to: risk-accepted, kind: stated, guard: "When the issue cannot be completely remediated, an assessment must be performed to determine whether the residual risk is acceptable."}
      - {from: mitigated, to: open, kind: stated, trigger: "additional mitigations are required"}
      - {from: open, to: risk-accepted, kind: stated, guard: "a risk approval or mitigation request should be approved before the product is released"}
  - id: risk-acceptance
    subject: "a risk approval or mitigation request"
    locator: "Risk Acceptance Process"
    states:
      - {id: drafted, kind: inferred, description: "structured format, e.g. TSRV"}
      - {id: submitted, kind: inferred}
      - {id: reviewed, kind: inferred}
      - {id: approved, kind: inferred}
      - {id: rejected, kind: inferred}
      - {id: expired-or-due-for-re-review, kind: inferred}
    transitions:
      - {from: drafted, to: submitted, kind: stated, text: "There should be clear delineation of who submits, reviews and approves these requests."}
      - {from: submitted, to: reviewed, kind: stated}
      - {from: reviewed, to: approved, kind: stated, guard: "It is equally important to ensure that appropriately empowered individuals are assigned the responsibility to accept or reject risk. This should vary by the residual risk; e.g., Critical Risk to VP of Business Unit, Medium Risk to Engineering Manager."}
      - {from: reviewed, to: rejected, kind: stated}
      - {from: approved, to: expired-or-due-for-re-review, kind: stated, text: "The record of risk acceptance should include a severity rating, a remediation plan or expiration or re-review period for the exception and the area for re-review/validation"}
    invariants:
      - {text: "Acceptance of risk must be tracked and archived.", kind: stated}
  - id: reported-vulnerability
    subject: "an externally reported vulnerability in released software"
    locator: "Vulnerability Response and Disclosure"
    states:
      - {id: reported, kind: inferred}
      - {id: acknowledged, kind: stated, text: "Vulnerabilities will be reported by vulnerability reporters (or security researchers) and by customers, and receipt of reports should be acknowledged by the PSIRT in a timely manner."}
      - {id: triaged, kind: stated, text: "The reported vulnerability should be immediately triaged by the team that owns the vulnerable code for validation and remediation, if appropriate."}
      - {id: fixed-and-tested, kind: stated, text: "Security fixes should be fully tested by the software development team."}
      - {id: disclosed, kind: stated, text: "Security advisories and bulletins should be released only once fixes are in place for all supported versions of the affected product(s)."}
      - {id: publicly-disclosed-or-exploited, kind: stated, text: "The disclosure process will be different when the vulnerability is being publicly disclosed and/or actively exploited: in this case, it may be desirable to release a public security advisory before a fix for the vulnerability is ready for release."}
    transitions:
      - {from: reported, to: acknowledged, kind: stated}
      - {from: acknowledged, to: triaged, kind: stated}
      - {from: triaged, to: fixed-and-tested, kind: stated, also: "The severity of the vulnerability should be determined (see Manage Security Findings) to assist in prioritizing the fixes."}
      - {from: fixed-and-tested, to: disclosed, kind: stated}
      - {from: triaged, to: publicly-disclosed-or-exploited, kind: stated, trigger: "public disclosure or active exploitation"}
      - {from: publicly-disclosed-or-exploited, to: disclosed, kind: inferred, trigger: "fix available"}
