schema: "library-object-model/v1"
record: safecode-fpssd-3
source_version: "Third Edition, March 2018"
extracted: "2026-10-02"
reviewed_by: ""
method: "Object-model pass over the capture: what entity types and edges do the practices assume or define?"
objects:
  - {name: SDLProgram, definition: "A Secure Development Lifecycle program: 'a comprehensive secure software engineering process that spans all parts of development from early planning through end of life'.", attributes: [scope, maturity, metrics], locator: "SAFECode Guidance and Software Assurance Programs; Planning ...", kind: stated, tmodel_mapping: "SDL / SecurityProgram (R-041)", notes: ""}
  - {name: ApplicationSecurityControl, definition: "Security requirement / application security control ('used interchangeably'), tracked through implementation and verification, ideally as structured data in an ADLM system.", attributes: [driver, requirement, implementation_team, status], locator: "Application Security Control Definition", kind: stated, tmodel_mapping: "Requirement (R-044) instantiated per product", notes: "Five-step workflow: identify drivers → identify requirements → communicate → validate → audit."}
  - {name: ComplianceDriver, definition: "Threats, risks and compliance drivers (HIPAA, PCI, GDPR, ...) that inputs to security requirements.", attributes: [kind], locator: "Actively Manage Application Security Controls", kind: stated, tmodel_mapping: "ThreatInstance / external Requirement source", notes: ""}
  - {name: ADLMSystem, definition: "Application Development Lifecycle Management system holding controls, findings and risk-acceptance records as structured data.", attributes: [], locator: "ASC Management; Manage Security Findings; Risk Acceptance Process", kind: stated, tmodel_mapping: "the KG as SoT (R-043)", notes: "'manage the controls as structured data ... rather than in an unstructured document' — direct support for R-043."}
  - {name: DesignPrinciple, definition: "Saltzer-Schroeder principles plus defense in depth, fail securely, design for updating.", attributes: [name, statement], locator: "Secure Design Principles", kind: stated, tmodel_mapping: "Requirement (design)", notes: ""}
  - {name: ThreatModel, definition: "'a security focused design activity'; repeatable and manageable; guides SAST, testing, documentation.", attributes: [], locator: "Threat Modeling", kind: stated, tmodel_mapping: "tmodel threat model", notes: ""}
  - {name: EncryptionStrategy, definition: "Centralized strategy: what to encrypt in transit/at rest, standards, libraries, key and certificate management, crypto agility.", attributes: [standards, key_management, agility], locator: "Develop an Encryption Strategy", kind: stated, tmodel_mapping: "documentation-kind Mitigation + technical Requirements", notes: ""}
  - {name: IdentityAccessStandard, definition: "Standard approach to authentication, service credentials, authorization (complete mediation, default deny, least privilege).", attributes: [], locator: "Standardize Identity and Access Management", kind: stated, tmodel_mapping: "Requirement / technical Mitigation", notes: ""}
  - {name: LogRequirement, definition: "What security information is logged, where stored, retention, protection.", attributes: [content, location, retention, protection], locator: "Establish Log Requirements and Audit Practices", kind: stated, tmodel_mapping: "Requirement", notes: ""}
  - {name: CodingStandard, definition: "Coding standards and conventions; safe functions; secure compiler options.", attributes: [], locator: "Secure Coding Practices", kind: stated, tmodel_mapping: "Requirement", notes: ""}
  - {name: ThirdPartyComponent, definition: "OSS and COTS components whose vulnerabilities development organizations inherit.", attributes: [source, version, known_vulnerabilities], locator: "Manage Security Risk Inherent in the Use of Third-party Components; Monitor and Manage Third-party Component Vulnerabilities", kind: stated, tmodel_mapping: "Component (purl)", notes: ""}
  - {name: Tool, definition: "SAST, DAST, fuzzers, network scanners, configuration verifiers.", attributes: [kind], locator: "Testing and Validation", kind: stated, tmodel_mapping: "Evidence producer", notes: ""}
  - {name: Artifact, definition: "'Practices such as threat modeling, third-party component identification, SAST, DAST, penetration testing, etc. all result in artifacts that contain findings'.", attributes: [source_practice], locator: "Manage Security Findings", kind: stated, tmodel_mapping: "Evidence / WorkProduct (R-042)", notes: ""}
  - {name: SecurityFinding, definition: "A weakness found by a practice; tracked; severity assigned; remediated, mitigated or risk-accepted.", attributes: [severity, status], locator: "Manage Security Findings", kind: stated, tmodel_mapping: "Finding (ARCH §1.3)", notes: ""}
  - {name: SeverityScale, definition: "Organization-defined scale with criteria (e.g. Critical/High/Medium/Low), optionally mapped to CVSS thresholds.", attributes: [levels, criteria], locator: "Define Severity", kind: stated, tmodel_mapping: "RiskScore band / severity policy", notes: ""}
  - {name: RiskAcceptance, definition: "Structured, approved, tracked and archived record (e.g. TSRV) with severity, remediation plan or expiry/re-review, and re-review area.", attributes: [technique, specifics, remaining_risk, verification, severity, expiry, approver], locator: "Risk Acceptance Process", kind: stated, tmodel_mapping: "accept disposition + Review (R-042, DEC-009)", notes: ""}
  - {name: Approver, definition: "'appropriately empowered individuals' varying by residual risk (VP of Business Unit for Critical, Engineering Manager for Medium).", attributes: [level], locator: "Risk Acceptance Process", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: PSIRT, definition: "Product Security Incident Response Team that defines and manages vulnerability response and disclosure.", attributes: [], locator: "Define Roles and Responsibilities", kind: stated, tmodel_mapping: "Party (org unit)", notes: ""}
  - {name: VulnerabilityResponsePolicy, definition: "Internal and external policies for vulnerability response and disclosure.", attributes: [internal, external], locator: "Define Internal and External Policies", kind: stated, tmodel_mapping: "documentation-kind Mitigation", notes: ""}
  - {name: Reporter, definition: "Vulnerability reporter, security researcher or customer.", attributes: [], locator: "Manage Vulnerability Reporters", kind: stated, tmodel_mapping: "Party", notes: ""}
  - {name: Vulnerability, definition: "An externally discovered vulnerability in released software.", attributes: [severity, cve], locator: "Vulnerability Response and Disclosure", kind: stated, tmodel_mapping: "Vulnerability (ARCH §1.3)", notes: ""}
  - {name: Workaround, definition: "Mitigating factors or workarounds (settings, configuration options, best practices).", attributes: [], locator: "Identify Mitigating Factors or Workarounds", kind: stated, tmodel_mapping: "MitigationInstance (technical or documentation)", notes: ""}
  - {name: SecurityAdvisory, definition: "Advisory/bulletin with affected products, severity, CVE, description, fix, credit.", attributes: [affected, severity, cve, description, fix, credit], locator: "Vulnerability Disclosure", kind: stated, tmodel_mapping: "VEX/advisory statement (radar contract)", notes: ""}
  - {name: SecurityConfigurationGuide, definition: "Documentation that may be needed to ensure required mitigating controls outside the application are implemented.", attributes: [], locator: "Risk Acceptance Process", kind: stated, tmodel_mapping: "documentation-kind Mitigation (R-040)", notes: "A direct example of R-040's documentation kind."}
  - {name: SDLMetric, definition: "Compliance measurement and SDL process health metrics.", attributes: [], locator: "Compliance Measurement; SDL Process Health", kind: stated, tmodel_mapping: "governed view value (R-043)", notes: ""}
edges:
  - {name: drives, from: ComplianceDriver, to: ApplicationSecurityControl, cardinality: "N:M", definition: "", locator: "ASC workflow step 1-2", kind: stated, tmodel_mapping: "derived_from"}
  - {name: validated_by, from: ApplicationSecurityControl, to: Artifact, cardinality: "1:N", definition: "'Validating that each security requirement has been implemented'", locator: "ASC workflow step 4", kind: stated, tmodel_mapping: "Evidence -> Requirement (R-042)"}
  - {name: tracked_in, from: "ApplicationSecurityControl|SecurityFinding|RiskAcceptance", to: ADLMSystem, cardinality: "N:1", definition: "", locator: "ASC Management; Manage Security Findings; Risk Acceptance Process", kind: stated, tmodel_mapping: "KG"}
  - {name: produces, from: Tool, to: Artifact, cardinality: "1:N", definition: "", locator: "Manage Security Findings", kind: stated, tmodel_mapping: "provenance"}
  - {name: contains, from: Artifact, to: SecurityFinding, cardinality: "1:N", definition: "", locator: "Manage Security Findings", kind: stated, tmodel_mapping: ""}
  - {name: rated_by, from: SecurityFinding, to: SeverityScale, cardinality: "N:1", definition: "", locator: "Define Severity", kind: stated, tmodel_mapping: "severity"}
  - {name: accepted_via, from: SecurityFinding, to: RiskAcceptance, cardinality: "N:1", definition: "", locator: "Risk Acceptance Process", kind: stated, tmodel_mapping: "accept disposition"}
  - {name: approved_by, from: RiskAcceptance, to: Approver, cardinality: "N:1", definition: "level by residual risk", locator: "Risk Acceptance Process", kind: stated, tmodel_mapping: "Review"}
  - {name: requires_doc, from: RiskAcceptance, to: SecurityConfigurationGuide, cardinality: "N:M", definition: "", locator: "Risk Acceptance Process", kind: stated, tmodel_mapping: "documentation Mitigation"}
  - {name: reports, from: Reporter, to: PSIRT, cardinality: "N:1", definition: "", locator: "Ensure that Vulnerability Reporters Know Whom to Contact", kind: stated, tmodel_mapping: "reported_by"}
  - {name: inherits_vulnerability, from: ThirdPartyComponent, to: Vulnerability, cardinality: "1:N", definition: "'development organizations inherit the security vulnerabilities of the components they incorporate'", locator: "Monitor and Manage TPC Vulnerabilities", kind: stated, tmodel_mapping: "vuln propagation along uses_component (R-027a)"}
  - {name: discloses, from: SecurityAdvisory, to: Vulnerability, cardinality: "1:N", definition: "", locator: "Vulnerability Disclosure", kind: stated, tmodel_mapping: "advisory/VEX"}
  - {name: mitigates, from: Workaround, to: Vulnerability, cardinality: "N:M", definition: "", locator: "Identify Mitigating Factors or Workarounds", kind: stated, tmodel_mapping: "MitigationInstance"}
  - {name: maps_to, from: "practice section", to: CWE, cardinality: "N:M", definition: "CWE References boxes", locator: "Use Safe Functions Only; compiler options; Handle Data Safely; Handle Errors; Third-party Components", kind: stated, tmodel_mapping: "Weakness (CWE) link on Requirement"}
gaps:
  - "No phase gates or release sign-off object (only 'approved before the product is released' for risk acceptance) — R-041 Gate must come from elsewhere."
  - "Severity scale is organization-defined; tmodel needs a policy object to hold the scale and CVSS mapping."
