source: "SAFECode FPSSD 3rd ed. — every worked example in the text, verbatim"
cvss_severity_mapping_example:
  locator: "Manage Security Findings > Define Severity"
  text: "If detailed criteria are not available or known, a possible starting point is mapping severity levels to Common Vulnerability Scoring System (CVSS) thresholds (e.g., 10-8.5 = Critical, 8.4-7.0 = High, etc.)."
  fixture: [{cvss_min: 8.5, cvss_max: 10.0, severity: Critical}, {cvss_min: 7.0, cvss_max: 8.4, severity: High}]
  note: "Only two bands are given ('etc.'); lower bands are not stated."
risk_acceptance_approver_example:
  locator: "Risk Acceptance Process"
  text: "This should vary by the residual risk; e.g., Critical Risk to VP of Business Unit, Medium Risk to Engineering Manager."
  fixture: [{residual_risk: Critical, approver: "VP of Business Unit"}, {residual_risk: Medium, approver: "Engineering Manager"}]
tsrv_structure_example:
  locator: "Risk Acceptance Process"
  text: "An example structure used by a SAFECode member is TSRV: Technique (T) captures the type of mitigation in effect using MITRE’s Monster Mitigations, Specifics (S) documents the specific compensating control in effect, Remaining Risk (R) outlines the risk that the mitigation does not address, and Verification (V) explains how the mitigation’s effectiveness was verified."
asc_workflow:
  locator: "Application Security Control Definition > Actively Manage Application Security Controls"
  steps:
    - "Identifying threats, risks and compliance drivers faced by this application"
    - "Identifying appropriate security requirements to address those threats and risks"
    - "Communicating the security requirements to the appropriate implementation teams"
    - "Validating that each security requirement has been implemented"
    - "Auditing, if required, to demonstrate compliance with any applicable policies or regulations"
secure_design_principles:
  locator: "Design > Secure Design Principles"
  saltzer_schroeder: ["Economy of mechanism", "Fail-safe defaults", "Complete mediation", "Least privilege", "Least common mechanism", "Psychological acceptability", "Compromise recording"]
  additional: ["Defense in depth", "Fail securely", "Design for updating"]
canonicalization_sanitization_example:
  locator: "Secure Coding Practices > Handle Data Safely"
  inputs_same_date: ["Jan 30, 2018,", "30-1-2018,", "2018/01/30"]
  note: "the trailing commas are inside the source's quotation marks"
  canonical_format_example: "MM-DD-YYYY in the US"
  sanitize_out: "<script>alert(1)</script>"
  expected: "canonicalization maps the three inputs to one representation; sanitization strips the script string, which 'doesn’t belong in a date'"
generic_error_messages_example:
  locator: "Secure Coding Practices > Handle Errors"
  acceptable_user_messages: ["We’re sorry, an error occurred, please try resubmitting the form.", "Please contact our support desk and inform them you encountered error 123456."]
  must_not_reveal: ["stack trace", "exception message"]
