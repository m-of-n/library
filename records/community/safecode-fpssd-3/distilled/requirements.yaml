  - id: "safecode-fpssd-3#P-secure-development-lifecycle-feedback"
    designator: "P-secure-development-lifecycle-feedback"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "governance"
    locator: "Vulnerability Response and Disclosure > Secure Development Lifecycle Feedback"
    short_title: "Secure Development Lifecycle Feedback"
    text: "To prevent similar vulnerabilities from occurring in new or updated products, perform a root cause analysis and update the secure development lifecycle using information gained from the root cause analysis and during the remediation process. This feedback loop is a critical step for continuous improvement of the SDL program.\n\nResources\n\n- Common Vulnerability Scoring System (CVSS) (https://www.first.org/cvss/): the industry standard vulnerability severity scoring system.\n\n- Common Vulnerability Enumeration (CVE: http://cve.mitre.org): industry standard for uniquely identifying vulnerabilities to facilitate sharing information across vulnerability management tools such as vulnerability scanners, repositories and services.\n\n- Forum of Incident Response and Security Teams (FIRST) (www.first.org): FIRST is an industry forum dedicated to best practices in incident response. FIRST has a variety of publications regarding best practices and training for incident response.\n\n- CERT (http://cert.org/): A division of the Software Engineering Institute (SEI) that studies and solves problems with widespread cybersecurity implications.\n\n- OWASP (https://www.owasp.org/index.php/SAMM_-_Vulnerability_Management_-_1): OWASP has a lightweight vulnerability response guide."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-planning-the-implementation-and-deployment-of-se"
    designator: "P-planning-the-implementation-and-deployment-of-se"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "governance"
    locator: "Planning the Implementation and Deployment of Secure Development Practices"
    short_title: "Planning the Implementation and Deployment of Secure Development Practices"
    text: "An organization’s collection of secure development practices is commonly referred to as a Secure Development Lifecycle or SDL. While the set of secure development practices described previously in this paper are essential components of an SDL, they are not the only elements of a mature SDL. A healthy SDL includes all the aspects of a healthy business process, including program management, stakeholder management, deployment planning, metrics and indicators, and a plan for continuous improvement. Whether defining a new set of secure development practices or evolving existing secure development practices, there is a variety of factors to consider that may aid or impede the definition, adoption and success of the secure development program overall. Below are some items to consider in planning the implementation and adoption of an SDL:\n\n- Culture of the organization\n\n- Expertise and skill level of the organization\n\n- Product development model and lifecycle\n\n- Scope of the initial deployment\n\n- Stakeholder management and communication\n\n- Efficiency measurement\n\n- SDL process health\n\n- Value proposition for the secure development practices"
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-culture-of-the-organization"
    designator: "P-culture-of-the-organization"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "governance"
    locator: "Planning the Implementation and Deployment of Secure Development Practices > Culture of the Organization"
    short_title: "Culture of the Organization"
    text: "The culture of the organization must be considered when planning the deployment of any new process or set of application security controls. Some organizations respond well to corporate mandates from the CEO or upper management, while others respond better to a groundswell from the engineering team. Think about the culture of the organization that must adopt these practices. Look to the past for examples of process or requirements changes that were successful and those that were not. Learn from past successes and mistakes. If mandates work well, identify the key managers who need to support and communicate a software security initiative. If a groundswell is more effective, think about highly influential engineering teams or leaders to engage in a pilot and be the first adopters."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
