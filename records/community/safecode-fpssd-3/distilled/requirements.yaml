  - id: "safecode-fpssd-3#P-expertise-and-skill-level-of-the-organization"
    designator: "P-expertise-and-skill-level-of-the-organization"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "governance"
    locator: "Planning the Implementation and Deployment of Secure Development Practices > Expertise and Skill Level of the Organization"
    short_title: "Expertise and Skill Level of the Organization"
    text: "If an organization is to be successful in implementing an SDL, some level of training is necessary. The entire organization should be made aware of the importance of security, and more detailed technical training must be provided to development teams that clearly articulates the specific expectations of individuals and teams. If individuals do not understand why these practices are important and the impact of not performing these practices, they are less likely to support them. Additional training will likely be needed, depending on the expertise in the organization. For each of the secure development practices, consider the expertise/skill level needed and the coverage of that expertise in the organization. For example, the Secure Design Principles practice requires threat modeling expertise and possibly cryptography expertise. Does the organization have any resident experts in these areas? Is the number of\n\nexperts sufficient? Can these experts assist with training and establishing the expertise within the organization? SAFECode (https://training.safecode.org/) has a series of free, publicly available training courses to assist with establishing and building this expertise."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
