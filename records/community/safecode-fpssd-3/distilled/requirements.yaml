  - id: "safecode-fpssd-3#P-sdl-process-health"
    designator: "P-sdl-process-health"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "governance"
    locator: "Planning the Implementation and Deployment of Secure Development Practices > SDL Process Health"
    short_title: "SDL Process Health"
    text: "A good set of secure development practices is constantly evolving, just as the threats and technologies involved are constantly evolving. The SDL process must identify key feedback mechanisms for identifying gaps and improvements needed. The vulnerability management process is a good source of feedback about the effectiveness of the secure development practices. If a vulnerability is discovered post-release, root-cause analysis should be performed. The root cause may be:\n\n- A gap in the secure development practices that needs to be filled\n\n- A gap in training/skills\n\n- The need for a new tool or an update to an existing tool\n\nIn addition, development teams will have opinions regarding what is working and what is not. The opinions of development teams should be sought, as they may help identify inefficiencies or gaps that should be addressed. Industry reports regarding trends and shifts in secure development practices should be monitored and considered. A mature SDL has a plan and metrics for monitoring the state of secure development practices across the industry and the health of the organization’s secure development practices."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
