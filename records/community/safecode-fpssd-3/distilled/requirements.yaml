  - id: "safecode-fpssd-3#P-manage-security-risk-inherent-in-the-use-of-thir"
    designator: "P-manage-security-risk-inherent-in-the-use-of-thir"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "supply-chain"
    locator: "Manage Security Risk Inherent in the Use of Third-party Components"
    short_title: "Manage Security Risk Inherent in the Use of Third-party Components"
    text: "To innovate and deliver more value in shorter time periods, developers increasingly use third-party frameworks and libraries. These can be commercial off-the-shelf-products (COTS) or increasingly, these can come from open source software (OSS) projects. In either case, there is inherent security risk in the use of third-party components (TPCs) and these risks must be investigated and evaluated before use.\n\nOften, these components are treated as black boxes and are afforded less scrutiny than comparable components written in-house. This different level of review introduces risks that, depending on security issues in the TPCs, may have an impact on the overall security of the systems in which they are used. Developers must be aware that they inherit security vulnerabilities of the components they incorporate and understand that choosing components for expedience (e.g., to reduce development time) can come at the cost of security when those components are integrated in production.\n\nIn general, you should choose established and proven frameworks and libraries that provide adequate security for your use cases, and which defend against identified threats. Do not waste resources and introduce new risks by re-implementing security features that are native to the framework. Without extensive testing, security failures will result and these security failures will often be nuanced and difficult to detect, leaving you and your users with a false sense of security.\n\nUnderstanding the security posture is not enough to enable the making of informed decisions regarding a TPC’s risks. SAFECode’s white paper “Managing Security Risks Inherent in the Use of Third-party Components” goes into detail on these challenges and offers guidelines for addressing them.\n\nCWE References ● CWE-242: Use of Inherently Dangerous Function ● CWE-657: Violation of Secure Design Principles ● CWE-477: Use of Obsolete Functions"
    footnotes: ["The SAFECode Whitepaper “The Software Supply Chain Integrity Framework” provides a framework for assessing software supply chain integrity."]
    verification_note: "verify 2026-10-03: a page footnote/sidebar had been spliced into the verbatim text (in one case mid-sentence); moved to footnotes"
