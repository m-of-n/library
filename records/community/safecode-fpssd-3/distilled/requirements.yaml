  - id: "safecode-fpssd-3#P-ensure-that-vulnerability-reporters-know-whom-to"
    designator: "P-ensure-that-vulnerability-reporters-know-whom-to"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "operations/response"
    locator: "Vulnerability Response and Disclosure > Ensure that Vulnerability Reporters Know Whom to Contact"
    short_title: "Ensure that Vulnerability Reporters Know Whom to Contact"
    text: "To help facilitate the correct response to a potential security vulnerability, it is important that vulnerability reporters or security researchers, customers or other stakeholders know where, how, or to whom to report the vulnerability. Ideally, this contact or report intake location is easily discoverable; for example, on a company website. If you have a reporting process for researchers that is different from the process for customers, such information should be clearly called out.\n\nSince information about vulnerabilities may be used to attack vulnerable products, sensitive vulnerability information should be communicated confidentially where possible. Secure communication methods such as encrypted email addresses and public keys should be clearly documented within the internal and external vulnerability response policies."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
