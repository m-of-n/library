  - id: "safecode-fpssd-3#P-verify-secure-configurations-and-use-of-platform"
    designator: "P-verify-secure-configurations-and-use-of-platform"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Testing and Validation > Automated Testing > Verify Secure Configurations and Use of Platform Mitigations"
    short_title: "Verify Secure Configurations and Use of Platform Mitigations"
    text: "Most security automation seeks to detect the presence of security vulnerabilities, but as outlined in the secure coding practices section, it is also important that software make full use of available platform mitigations, and that it configure those mitigations correctly. Several tools can ensure that a compiled application has opted into OS platform mitigations such as Address Space Layout Randomization (ASLR), Data Execution Prevention (DEP), Control Flow Guard (CFG), and other mitigations to protect the application. Similarly, there are several security tools and freely available web services that verify that a website is opting into security-relevant HTTP headers such as x-frame-options, content security policy, HSTS, secure and HTTP Only cookie flags, and that a server’s SSL/TLS configuration is free of protocol versions and cipher suites known to be insecure. Regular validation that software and services are correctly using available platform mitigations is usually far simpler to deploy and run than other forms of security automation, and the findings have very low false positive rates."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-perform-automated-functional-testing-of-security"
    designator: "P-perform-automated-functional-testing-of-security"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Testing and Validation > Automated Testing > Perform Automated Functional Testing of Security Features/Mitigations"
    short_title: "Perform Automated Functional Testing of Security Features/Mitigations"
    text: "Organizations that use unit tests and other automated testing to verify the correct implementations of general features and functionality should extend those testing mechanisms to verify security features and mitigations designed into the software. For example, if the design calls for security-relevant events to be logged, unit tests should invoke those events and verify corresponding and correct log entries for them. Testing that security features work as designed is no different from verifying that any other feature works as designed and should be included in the same testing strategy used for other functionality."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
