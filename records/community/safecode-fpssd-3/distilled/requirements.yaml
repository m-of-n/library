  - id: "safecode-fpssd-3#P-manual-testing"
    designator: "P-manual-testing"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Testing and Validation > Manual Testing"
    short_title: "Manual Testing"
    text: "Manual testing is generally more laborious and resource intensive than automated testing, and unlike automated testing it requires the same investment every time that it is performed in order to produce\n\nsimilar coverage. In contrast to automated testing, because human testers can learn, adapt and make leaps of inference, manual testing can evolve based on previous findings and subtle indicators of an issue."
