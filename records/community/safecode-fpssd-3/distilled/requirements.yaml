  - id: "safecode-fpssd-3#P-define-severity"
    designator: "P-define-severity"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Manage Security Findings > Define Severity"
    short_title: "Define Severity"
    text: "Clear definitions of severity are important to ensure that all SDL participants use the same language and have a consistent understanding of the security issue and its potential impact. To support this understanding, it is recommended to define criteria to categorize issues’ severity. First consider implementing a severity scale (e.g., Critical, High, Medium and Low or a finer grained scale, Very High, High, Medium, Low, Very Low, Informational), and next define the criteria that contribute to each severity category. If detailed criteria are not available or known, a possible starting point is mapping severity levels to Common Vulnerability Scoring System (CVSS) thresholds (e.g., 10-8.5 = Critical, 8.4-7.0 = High, etc.). CVSS is primarily used for confirmed vulnerabilities but can also be used to prioritize SDL findings based on their complexity of exploitation and impact on the security properties of a system. Evangelizing the severity scale and definitions across the organization helps to ensure that everyone is speaking the same language when discussing security findings."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
