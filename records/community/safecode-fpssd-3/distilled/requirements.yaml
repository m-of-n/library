  - id: "safecode-fpssd-3#P-secure-coding-practices"
    designator: "P-secure-coding-practices"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "implementation"
    locator: "Secure Coding Practices"
    short_title: "Secure Coding Practices"
    text: "When developers write software, they can make mistakes. Left undetected, these mistakes can lead to unintentional vulnerabilities that potentially compromise that software or the data it processes. A goal of developing secure software is to minimize the number of these unintentional code-level security vulnerabilities. This can be achieved by defining coding standards, selecting the most appropriate (and safe) languages, frameworks and libraries, ensuring their proper use (especially use of their security features), using automated analysis tools and manually reviewing the code."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-establish-coding-standards-and-conventions"
    designator: "P-establish-coding-standards-and-conventions"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "implementation"
    locator: "Secure Coding Practices > Establish Coding Standards and Conventions"
    short_title: "Establish Coding Standards and Conventions"
    text: "When technology choices are made, it is important to understand which classes of security issues are inherited and to decide how they will be addressed. Once these technology decisions are made, appropriate coding standards and conventions that support both writing secure code and the re-use of built-in security features and capabilities should be created, maintained and communicated to the development team.\n\nWhere possible, use built-in security features in the frameworks and tools selected and ensure that these are on by default. This will help all developers address known classes of issues, systemically rather than individually. Where multiple options exist to address issues, choose one as the standard. Look for classes of security issues that a security feature, programming language or framework may mitigate on the developer's behalf and invest in the re-use of such features or frameworks instead of re-inventing them in-house. To the greatest possible extent, any frameworks/library/component use should be loosely coupled so that it can be easily replaced/upgraded when needed.\n\nStandards must be realistic and enforceable. As coding standards and conventions are created, it is a great time to think about testing and validation. For example, what tools will you have at your disposal to help you validate that code follows the established policies? Would you need to rely on manual code review? Will it be possible to automate tests to help you with that validation? Incorporating the considerations above can lead to catching problems more effectively earlier in the SDL when they are less expensive to find and fix.\n\nResources\n\n  - OWASP – Secure Coding Practices, Quick Reference Guide\n\n- Secure Coding Guidelines for Java SE\n\n- Cert Secure Coding Wiki"
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
