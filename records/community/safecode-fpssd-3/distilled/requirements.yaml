  - id: "safecode-fpssd-3#P-product-development-model-and-lifecycle"
    designator: "P-product-development-model-and-lifecycle"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "governance"
    locator: "Planning the Implementation and Deployment of Secure Development Practices > Product Development Model and Lifecycle"
    short_title: "Product Development Model and Lifecycle"
    text: "Along with a specification of the secure development practices, it is essential to consider when the practices are required. When or how often a practice is applied is highly dependent on the development model in use and the automation available. Although security practices executed in sequential and logical order can result in greater security gains (e.g., threat model before code is committed) and cost effectiveness than ad hoc implementation, in agile or continuous development environments, other triggers such as time (e.g., conduct DAST monthly) or response to operating environment changes (e.g., deployment of a new service or dataset) should be considered.\n\nNot everyone is nor needs to be a security engineer, and the SDL framework should provide engineers with clear actionable guidance, supported by efficient processes, carefully selected tools and intelligent automation, tightly aligned with the engineering experience. To facilitate change at scale, security process and tools must be integrated into the engineers’ world and not exist as a separate security world, which is often seen as a compliance function. This not only helps to reduce friction with engineers, it also enables them to move faster by integrating security tools into the world in which they live and operate.\n\nSDL framework for all development models\n\nThe SDL framework should include guidance as to when a secure development practice applies and when it must be complete. This guidance must map to the development model and terminology used by development teams."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
