  - id: "safecode-fpssd-3#P-perform-manual-verification-of-security-features"
    designator: "P-perform-manual-verification-of-security-features"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Testing and Validation > Manual Testing > Perform Manual Verification of Security Features/Mitigations"
    short_title: "Perform Manual Verification of Security Features/Mitigations"
    text: "Just as security features should be included in existing unit tests and other automated functionality verifications, they should be included in any manual functional testing efforts that are performed. Organizations employing manual quality assurance should include verification of security features and mitigations within the test plan, as these can be manually verified in the same way that any non-security feature is verified. Organizations that rely more heavily on automated functional testing should still perform occasional manual spot-checks of security features to ensure that the automated tests were implemented correctly because mistakes in some security features are less likely to be caught and reported by users than mistakes that result in erroneous outputs. For example, a user is likely to report if a text box is not working but is not likely to identify and report that security logging is not working."
