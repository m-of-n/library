  - id: "safecode-fpssd-3#P-use-current-compiler-and-toolchain-versions-and-"
    designator: "P-use-current-compiler-and-toolchain-versions-and-"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "implementation"
    locator: "Secure Coding Practices > Use Safe Functions Only > Use Current Compiler and Toolchain Versions and Secure Compiler Options"
    short_title: "Use Current Compiler and Toolchain Versions and Secure Compiler Options"
    text: "Using the latest versions of compilers, linkers, interpreters and runtime environments is an important security practice. Commonly, as languages evolve over time they incorporate security features, and developers using previous compiler and toolchain versions cannot make use of these security improvements in their software. For example, memory corruption issues, including buffer overruns and underruns, remain a common source of serious vulnerabilities in C and C++ code. To help address these vulnerabilities, it is important to use C and C++ compilers that automatically offer compile-time and run-time defenses against memory corruption bugs. Such defenses can make it harder for exploit code to execute predictably and correctly.\n\nEnable secure compiler options and do not disable secure defaults for the sake of performance or backwards compatibility. These protections are defenses against common classes of vulnerabilities and represent a minimum standard.\n\nOver time, software projects become dependent on a certain compiler version, and changing the version can be cumbersome; therefore, it is essential to consider the compiler version when starting a project.\n\nCWE References ● CWE-691: Insufficient Control Flow Management ● CWE-908: Use of Uninitialized Resource\n\nVerification\n\n- A Microsoft tool named the BinSkim Binary Analyzer can verify whether most of the compiler and linker options (/GS, /DYNAMICBASE, /NXCOMPAT and /SAFESEH) are enabled in a Windows image: https://github.com/Microsoft/binskim.\n\nResources\n\n- This article examines Microsoft and GCC toolchains for the C, C++ and Objective C languages and how they can be configured to provide a wide variety of security benefits: https://www.owasp.org/index.php/C-Based_Toolchain_Hardening."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
