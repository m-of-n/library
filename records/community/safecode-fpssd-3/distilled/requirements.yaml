  - id: "safecode-fpssd-3#P-threat-modeling"
    designator: "P-threat-modeling"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "design"
    locator: "Design > Threat Modeling"
    short_title: "Threat Modeling"
    text: "Threat modeling is a security focused design activity and a fundamental practice in the process of building trusted technology; it has proven to be one of the best “return on investment” activities for identifying and addressing design flaws before their implementation into code.\n\nThe greatest benefit from threat modeling is realized when it is performed early in the development lifecycle before code is committed. Even if that cannot be achieved, threat modeling provides value in mapping out a system to understand and prioritize its weaknesses. Downstream activities such as static analysis, security testing and customer documentation can be greatly guided and focused based on the context provided by threat modeling.\n\nThere are many possible ways of generating a threat model, and the consensus is that there is no one single perfect way. A valid process is one that is repeatable and manageable, and above all one that can identify potential threats.\n\nMore information about the benefits of threat modeling, some of the methodologies in use, simple examples and some of the pitfalls encountered in day-to-day practical threat modeling, as well as more complete references, may be found in the SAFECode paper “Tactical Threat Modeling.\""
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
