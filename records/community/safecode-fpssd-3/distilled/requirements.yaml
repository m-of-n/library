  - id: "safecode-fpssd-3#P-compliance-measurement"
    designator: "P-compliance-measurement"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "governance"
    locator: "Planning the Implementation and Deployment of Secure Development Practices > Compliance Measurement"
    short_title: "Compliance Measurement"
    text: "In implementing a new set of security requirements, the organization must consider what is mandatory and what (if anything) is optional. Most organizations have a governance or risk/controls function that will require indicators of compliance with required practices. In defining the overall SDL program, consider the following:\n\n- Are teams required to complete all of the secure development practices? What is truly mandatory? Is there a target for compliance?\n\n- What evidence of practice execution is required? Ideally, the ADLM system and testing environments can be configured to produce this evidence \"for free” as a side-effect of executing the secure development process.\n\n- How will compliance be measured? What types of reports are needed?\n\n- What happens if the compliance target is not achieved? What is the risk management process that should be followed? What level of management can sign off on a decision to ship with open\n\nexceptions to security requirements? What action plans will be required to mitigate such risks and how will their implementation be tracked?"
    expects_deliverables: []
