    locator: "Testing and Validation > Automated Testing"
    short_title: "Automated Testing"
    text: "As in other areas of development, automated security testing allows for repeatable tests done rapidly and at scale. There are several commercial or free/open source tools that can be run either on developers' workstations as they work, as part of a build process on a build server or run against the developed product to spot certain types of vulnerabilities. While some automated security tools can provide highly accurate and actionable results, automated security tools tend to have a higher rate of false positives and negatives than a skilled human security tester manually looking for vulnerabilities. Although some tools possess a large dictionary of flaws that is updated and expanded over time, currently they do not independently learn and evolve as they test, as a human does. Automated tools are adopted because of the speed and scale at which they run, and because they allow organizations to focus their manual testing on their riskiest components, where they are needed most.\n\nThere are many categories of automated security testing tools. This section outlines six testing categories used by SAFECode members: Static Analysis Security Testing (SAST), Dynamic Analysis Security Testing (DAST), fuzzing, software composition analysis, network vulnerability scanning and tooling that validates configurations and platform mitigations."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-use-static-analysis-security-testing-tools"
    designator: "P-use-static-analysis-security-testing-tools"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Testing and Validation > Automated Testing > Use Static Analysis Security Testing Tools"
    short_title: "Use Static Analysis Security Testing Tools"
    text: "Static analysis is a method of inspecting either source code or the compiled intermediate language or binary component for flaws. It looks for known problematic patterns based simply on the application logic, rather than on the behavior of the application while it runs. SAST logic can be as simple as a regular expression finding a banned API via text search, or as complex as a graph of control or data flow logic that seems to allow for tainted data to attack the application. SAST is most frequently integrated into build automation to spot vulnerabilities each time the software is built or packaged; however, some offerings integrate into the developer environment to spot certain flaws as the developer is actively coding.\n\nSAST tends to give very good coverage efficiently, and with solutions ranging from free or open source security linters to comprehensive commercial offerings, there are several options available for an organization regardless of its budget. However, not every security problem lends itself to discovery via pattern or control flow analysis (e.g., vulnerabilities in business logic, issues introduced across multiple\n\napplication tiers or classes of issues created at runtime), nor are the rulesets used by SAST offerings typically completely comprehensive for all problems that hypothetically can be found via such analysis.\n\nOn-premise static analysis tools can benefit from human experts to tune the tool configuration and triage the results to make the results more actionable for developers and reduce false positive rates. Software as a Service (SaaS) solutions are available that are constantly tuned to reduce false positives and make results more effective. In either case, there is a compromise between false negatives (tuning out critical security issues) and false positives (non-issues being reported)."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-perform-dynamic-analysis-security-testing"
    designator: "P-perform-dynamic-analysis-security-testing"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Testing and Validation > Automated Testing > Perform Dynamic Analysis Security Testing"
    short_title: "Perform Dynamic Analysis Security Testing"
    text: "Dynamic analysis security testing runs against an executing version of a program or service, typically deploying a suite of prebuilt attacks in a limited but automated form of what a human attacker might try. These tests run against the fully compiled or packaged software as it runs, and therefore dynamic analysis is able to test scenarios that are only apparent when all of the components are integrated. Most modern websites integrate interactions with components that reside in separate source repositories – web service calls, JavaScript libraries, etc. – and static analysis of the individual repositories would not always be able to scrutinize those interactions. Additionally, as DAST scrutinizes the behavior of software as it runs, rather than the semantics of the language(s) the software is written in, DAST can validate software written in a language that may not yet have good SAST support.\n\nIf a DAST test is well authored it also provides validation that a flaw is actually exploitable. Most SAST tools identify patterns that are potentially exploitable if an attacker can control the data consumed by those patterns, but do not validate that an attacker can control that data. With DAST, if a test is successful, it has validated that an attacker actually can exploit the vulnerability.\n\nHowever, DAST has limitations. It is much slower than SAST and can only test against functionality it can discover. Because DAST solutions can crawl a website enumerating functionality after some initial setup, web applications functionality discovery is semi-automatic. For other applications (desktop, mobile clients, specialized server applications, etc.) where there is not a standardized markup describing the interface, most DAST solutions require the interactions to be manually programmed. Once set up, the tests can be repeated with little additional cost, but there is an initial setup cost. Additionally, DAST solutions typically have a much smaller dictionary of scenarios they look for relative to SAST. This is because the cost for the tool maker to produce a reliable test is higher. DAST solutions often have difficulty scanning single-page applications (SPA) due to the fact that the page is not reloaded but is dynamically rewritten by the server. For organizations with SPA requirements, care should be taken in selecting a testing solution that meets the application needs. Coupling with SAST will offer fuller scanning coverage for all applications, and even more so for SPA."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
