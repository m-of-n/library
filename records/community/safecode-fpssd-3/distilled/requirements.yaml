  - id: "safecode-fpssd-3#P-define-roles-and-responsibilities"
    designator: "P-define-roles-and-responsibilities"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "operations/response"
    locator: "Vulnerability Response and Disclosure > Define Roles and Responsibilities"
    short_title: "Define Roles and Responsibilities"
    text: "Large organizations often establish dedicated Product Security Incident Response Teams (PSIRT) or incident response teams whose charter is to define and manage the vulnerability response and disclosure process. Smaller organizations will need to scale the size of this effort appropriately based on the size/scale of products and number of incidents. While the PSIRT members should understand all policies, guidelines and activities related to Vulnerability Response and Disclosure and be able to guide the software development team through the process, everyone involved in software development at the\n\norganization and supporting functions such as customer service, legal, and public relations should understand their role and responsibilities as they relate to Vulnerability Response & Disclosure Process.\n\nRoles and responsibilities of each stakeholder should be clearly documented in the internal vulnerability response policy.\n\nThe PSIRT Services Framework from FIRST (The Forum of Incident Response and Security Teams) provides good overview of the services covered by a PSIRT."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
