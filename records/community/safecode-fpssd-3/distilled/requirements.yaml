  - id: "safecode-fpssd-3#P-use-code-analysis-tools-to-find-security-issues-"
    designator: "P-use-code-analysis-tools-to-find-security-issues-"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "implementation"
    locator: "Secure Coding Practices > Use Code Analysis Tools to Find Security Issues Early"
    short_title: "Use Code Analysis Tools to Find Security Issues Early"
    text: "Using tools to search the code to identify deviation from requirements helps verify that developers are following guidance and helps identify problems early in the development cycle. Build the execution of these tools into the \"normal\" compile/build cycle. This relieves developers of having to make special efforts to ensure that coding standards are being consistently followed. Using static analysis tools that plug directly into the IDE allows developers to find security bugs effectively without leaving their native IDE environment and is on par with using the latest versions of compilers and links with appropriate security switches, as discussed in the previous section.\n\nReaders should also be aware that frameworks can only offer protection up to a certain point and developer-introduced bugs could easily lead to security vulnerabilities. Secure code review is a good way to identify vulnerabilities that result due to logic bugs in the source code.\n\nThis practice and its verification are covered in more detail in the Testing and Validation section.\n\nResources\n\n- A Microsoft tool named the DevSkim is a set of IDE plugins that provide inline analysis in the development environment as the developer writes code. The goal here is to give developers notification when they introduce a vulnerability (that can be detected) in order to fix the issue at the time of introduction and help educate the developer -- https://github.com/Microsoft/DevSkim."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
