  - id: "safecode-fpssd-3#P-actively-manage-application-security-controls"
    designator: "P-actively-manage-application-security-controls"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "requirements"
    locator: "Application Security Control Definition > Actively Manage Application Security Controls"
    short_title: "Actively Manage Application Security Controls"
    text: "Regardless of the development methodology being used, defining application security controls begins in (or even before) the Design stage and continues throughout an application’s lifecycle in response to changing business requirements and an ever-evolving threat environment.\n\nThe inputs used to identify the necessary security requirements should include the secure design principles described in the following section and feedback from the established vulnerability management program, and may also require input from other stakeholders, such as a compliance team (e.g., if the application must comply with standards such as HIPAA, PCI, GDPR, etc.) or an operations and deployment team, because where and how the application is deployed may affect its security needs.\n\nAt a high level, the workflow should include:\n\n1. Identifying threats, risks and compliance drivers faced by this application\n\n2. Identifying appropriate security requirements to address those threats and risks\n\n3. Communicating the security requirements to the appropriate implementation teams\n\n4. Validating that each security requirement has been implemented\n\n5. Auditing, if required, to demonstrate compliance with any applicable policies or regulations"
    footnotes: ["Security requirements and application security controls are used interchangeably throughout this document."]
    verification_note: "verify 2026-10-03: a page footnote/sidebar had been spliced into the verbatim text (in one case mid-sentence); moved to footnotes"
