  - id: "safecode-fpssd-3#P-scope-of-initial-deployment"
    designator: "P-scope-of-initial-deployment"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "governance"
    locator: "Planning the Implementation and Deployment of Secure Development Practices > Scope of Initial Deployment"
    short_title: "Scope of Initial Deployment"
    text: "Often, the teams implementing the secure development program are resource constrained and may need to consider different ways to prioritize the rollout across the organization. There are many ways to manage the rollout of the SDL. Having a good understanding of how the project planning process works\n\nand the culture of the organization will help the secure development program manager make wise choices for the implementation and adoption of secure development practices. Below are some options to consider:\n\n- Will the initial rollout include all secure development practices or a subset? Depending on the maturity of the organization, it may be wise to start with a subset of the secure development practices and establish traction and expertise in those areas prior to full-scale implementation of all of the practices.\n\n- Consider the product release roadmap and select an adoption period for each team that allows them time to plan for the adoption of the new process. It may be unwise to try to introduce a new process and set of practices to a team nearing completion of a specific release. The team is probably marching towards a tight timeline and has not included in its schedule the time to learn and adopt a new process or set of security requirements.\n\n- The initial rollout might also choose to target teams with products of higher security risk posture and defer lower risk products for a later start.\n\n- Consider allowing time for transition to full adherence to all SDL requirements. For example, an existing product whose development team is working on a new release may have an architecture whose threat model reveals vulnerabilities that are both very serious and very difficult to mitigate. It may make sense to agree with such a product team that they will “do what is feasible now” and transition to a new architecture over an agreed period of time."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
