  - id: "safecode-fpssd-3#P-manage-security-findings"
    designator: "P-manage-security-findings"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Manage Security Findings"
    short_title: "Manage Security Findings"
    text: "One of the primary goals of an SDL program is to identify software design or implementation weaknesses that when exploited expose the application, environment or company to a level of risk.\n\nPerforming the secure development practices outlined in this document will aid in identifying these weaknesses. However, simply performing these activities is not sufficient. Action should be taken to correct the identified weaknesses to improve the overall security posture of the product.\n\nPractices such as threat modeling, third-party component identification, SAST, DAST, penetration testing, etc. all result in artifacts that contain findings related to the product’s security (or lack thereof). The findings from these artifacts must be tracked and action taken to remediate, mitigate or accept the respective risk. For a finding to be remediated, the risk is completely eliminated, and to be mitigated, the risk is reduced but not completely eliminated. When the issue cannot be completely remediated, an assessment must be performed to determine whether the residual risk is acceptable. Residual risk may be radically different between products, depending on the products' usage and the sensitivity of data being processed or stored, and other factors such as brand damage, and revenue impact should also be considered. Once the residual risk is understood, a decision must be made whether the risk is acceptable, whether additional mitigations are required, or whether the issue must be fully remediated.\n\nTo ensure that action is taken, these findings should be recorded in a tracking (ideally an ADLM) system and made available to multiple teams in the organization. Teams who may need access to this information to make informed decisions regarding risk acceptance and product release include the development or operational teams who will remediate or mitigate the risk and the security team who will review and provide guidance to both development teams and the business owners. To enable easy discovery of these findings, they should also be identified as security issues, and to aid prioritization they should have a severity assigned. The tracking system should have the ability to produce a report of all unresolved (and resolved) security findings."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
