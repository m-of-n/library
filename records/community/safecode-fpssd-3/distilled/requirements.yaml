  - id: "safecode-fpssd-3#P-design"
    designator: "P-design"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "design"
    locator: "Design"
    short_title: "Design"
    text: "The creation of secure software involves activities at a number of levels. If the organizations that will use the software have internal security policies or must comply with external laws or regulations, the software must incorporate security features that meet those requirements. In addition to incorporating security features, the architecture and design of the software must enable it to resist known threats based on intended operational environment.\n\nThe process of threat modeling, when combined with appropriate consideration of security requirements and the secure design principles, will enable the development team to identify security features that are necessary to protect data and enable the system to meet its users’ requirements. These features perform functions such as user identification and authentication, authorization of user access to information and resources, and auditing of users’ activities as required by the specific application.\n\nThe fundamental practices described in this document primarily deal with assurance – with the ability of software to withstand attacks that attempt to exploit design or implementation errors such as buffer overruns (in native code) or cross-site scripting (in website code). In some cases, such as encryption and sensitive data protection, the selection or implementation of security features has proven to be sufficiently subtle or error-prone so that design or implementation choices are likely to result in vulnerabilities. The authors of this document have included recommendations for the security of those features with the goal of enabling organizations to produce systems that are secure from attack from any cause."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
