  - id: "safecode-fpssd-3#P-handle-data-safely"
    designator: "P-handle-data-safely"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "implementation"
    locator: "Secure Coding Practices > Handle Data Safely"
    short_title: "Handle Data Safely"
    text: "This is \"Security 101:\" all user-originated input should be treated as untrusted. The origin of data is often not clearly defined or understood, and applications can consume and process data that originates from the Internet or other network, through a file, from another application via some form of inter-process communication or other data channel. For example, in web applications the same user input data may be handled differently by the various components of the technology stack; the web server, the application platform, other software components and the operating system. If this data is not handled correctly at any point, it can, through a flaw in the application, be transformed into executing code or unintentionally provide access to resources.\n\nIn these situations, input validation is often identified as a defense that is applied at the boundary with the internet. This approach is inadequate, and a better approach is to ensure that each area in the application\n\nstack defends itself against the malicious input it may be vulnerable to. For example, parameterized queries can be used for database access to help prevent SQL injection attacks. A good threat model will help identify the boundaries and the threats."
