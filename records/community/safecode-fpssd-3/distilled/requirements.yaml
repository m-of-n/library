  - id: "safecode-fpssd-3#P-testing-and-validation"
    designator: "P-testing-and-validation"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Testing and Validation"
    short_title: "Testing and Validation"
    text: "An essential component of an SDL program, and typically the first set of activities adopted by an organization, is some form of security testing. For organizations that do not have many security development practices, security testing is a useful tool to identify existing weaknesses in the product or service and serve as a compass to guide initial security investments and efforts, or to help inform a decision on whether or not to use third-party components. For organizations with mature security practices, security testing is a useful tool both to validate the effectiveness of those practices, and to catch flaws that were still introduced.\n\nThere are several forms of security testing and validation, and most mature security programs employ multiple forms. Broadly, testing can be broken down into automated and manual approaches, and then further categorized within each approach. There are tradeoffs with each form of testing, which is why most mature security programs employ multiple approaches."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
