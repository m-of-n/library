  - id: "safecode-fpssd-3#P-manage-vulnerability-reporters"
    designator: "P-manage-vulnerability-reporters"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "operations/response"
    locator: "Vulnerability Response and Disclosure > Manage Vulnerability Reporters"
    short_title: "Manage Vulnerability Reporters"
    text: "Vulnerabilities will be reported by vulnerability reporters (or security researchers) and by customers, and receipt of reports should be acknowledged by the PSIRT in a timely manner. At the time of receipt, an expectation of how the organization will respond should be set and if necessary, a request for additional information (to support triage) from the reporter should be made.\n\nWhile the reported vulnerability is being investigated, a best practice amongst SAFECode members is to keep in contact with the reporter with the latest status so that they know you are taking the report seriously. Otherwise, they may publicize their findings before the vulnerability is addressed. ISO/IEC 29147 – Vulnerability disclosure provides more detailed guidance on this topic."
    expects_deliverables: []
