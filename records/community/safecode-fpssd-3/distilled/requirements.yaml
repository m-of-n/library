  - id: "safecode-fpssd-3#P-fuzz-parsers"
    designator: "P-fuzz-parsers"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Testing and Validation > Automated Testing > Fuzz Parsers"
    short_title: "Fuzz Parsers"
    text: "Fuzzing is a specialized form of DAST (or in some limited instances, SAST). Fuzzing is the act of generating or mutating data and passing it to an application’s data parsers (file parser, network protocol parser, inter-process communication parser, etc.) to see how they react. While any single instance of a fuzzed input is unlikely to discover vulnerable behavior, repeating the process thousands or many millions of times (depending on how thoroughly the software had been fuzzed in the past) often will.\n\nThe benefit of fuzzing is that once the automation is set up it can run countless distinct tests against code with the only cost being compute time. Fuzzing produces far better coverage of parsing code than either traditional DAST or SAST. However, depending on scenario, it can be laborious to set up. Also, debugging the issues that fuzzing finds can often be time consuming. Fuzzing will have the biggest payoff for parsers written in non-memory-safe languages (e.g., C, C++) that can be easy for an attacker to access with malicious data. A threat model is quite helpful for identifying these parsers."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-network-vulnerability-scanning"
    designator: "P-network-vulnerability-scanning"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "verification"
    locator: "Testing and Validation > Automated Testing > Network Vulnerability Scanning"
    short_title: "Network Vulnerability Scanning"
    text: "This testing category is more prevalent in information and network security programs than SDL because vulnerability scanning tools find previously discovered vulnerabilities (CVEs), including those in third-party software, but are less useful for newly written applications. That said, these tools can add value to an SDL program as long as it is understood what vulnerabilities these tools are designed to identify. This category of testing is required for applications delivered as a physical or virtual appliance or deployed in a SaaS environment where security of the operating system environment is important. It is also valuable to scan any application in its installed state to ensure that no additional vulnerabilities are introduced during or after installation. To be most effective in this scenario, a baseline scan should be performed before the application installation, then the application should be scanned again after installation and configuration; comparing these results will give insight as to any vulnerabilities introduced by the application installation."
    expects_deliverables: []
