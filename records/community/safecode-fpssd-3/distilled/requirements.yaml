  - id: "safecode-fpssd-3#P-identify-mitigating-factors-or-workarounds"
    designator: "P-identify-mitigating-factors-or-workarounds"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "operations/response"
    locator: "Vulnerability Response and Disclosure > Fix the Vulnerability > Identify Mitigating Factors or Workarounds"
    short_title: "Identify Mitigating Factors or Workarounds"
    text: "Security fixes should be fully tested by the software development team. Additionally, where possible, mitigating factors or workarounds, such as settings, configuration options, or general best practices, that could reduce the severity of exploitation of a vulnerability should be identified and tested by the development team. These mitigations and workarounds help users of the affected software defend against exploitation of the vulnerability before they are able to deploy any updates."
