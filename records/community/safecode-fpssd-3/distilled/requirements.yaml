    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-perform-architectural-and-design-reviews"
    designator: "P-perform-architectural-and-design-reviews"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "design"
    locator: "Design > Threat Modeling > Perform Architectural and Design Reviews"
    short_title: "Perform Architectural and Design Reviews"
    text: "Architectural and design review should be incorporated into a security program. A poorly designed system that allows a malicious actor to fully compromise a system and its data through a design or logic\n\nflaw can be catastrophic and difficult to remediate. The design review should be conducted with reference to the design principles above. To the extent that an architecture falls short of meeting those principles, it is likely to fall short of its goal of protecting information for its users."
