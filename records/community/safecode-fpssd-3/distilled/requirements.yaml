    locator: "Planning the Implementation and Deployment of Secure Development Practices > Stakeholder Management and Communications"
    short_title: "Stakeholder Management and Communications"
    text: "Deploying a new process or set of practices often requires the commitment and support of many stakeholders. Identify the stakeholders, champions and change agents who will be needed to assist with the communications, influencing and roll-out of the program. Visit these stakeholders with a roadshow that clearly explains the value and commitment to secure development practices and what specifically they are being asked to do."
