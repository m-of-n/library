    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-fix-the-vulnerability"
    designator: "P-fix-the-vulnerability"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "operations/response"
    locator: "Vulnerability Response and Disclosure > Fix the Vulnerability"
    short_title: "Fix the Vulnerability"
    text: "The reported vulnerability should be immediately triaged by the team that owns the vulnerable code for validation and remediation, if appropriate. The severity of the vulnerability should be determined (see Manage Security Findings) to assist in prioritizing the fixes. Other considerations may help to determine the relative urgency of producing the fix, such as potential impact, likelihood of exploitation, and the scope of affected customers. Other factors that may affect response timelines are the component that is affected (for example, some components require longer QA cycles or can only be updated in a major release), and where the product is in the development cycle when the vulnerability is discovered. If a predictable schedule is used for releasing security updates, the details should be documented in the external vulnerability response policy to set expectations.\n\nIn addition to fixing the reported issue, the software development team should consider the nature of the defect. If it is likely that there are additional defects of the same class in the codebase, then it is a better to address the defect in those places as well as the one reported. Being proactive and systematic in mitigation helps avoid repeated submissions of the same vulnerability in other areas of the codebase. If the team develops software that is reused by other teams, then dependent teams need to be notified, and should update their software accordingly."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
