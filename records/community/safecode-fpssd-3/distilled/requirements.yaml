  - id: "safecode-fpssd-3#P-use-safe-functions-only"
    designator: "P-use-safe-functions-only"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "implementation"
    locator: "Secure Coding Practices > Use Safe Functions Only"
    short_title: "Use Safe Functions Only"
    text: "Many programming languages have functions and APIs whose security implications were not appreciated when initially introduced but are now widely regarded as dangerous. Although C and C++ are known to have many unsafe string and buffer manipulation functions, many other languages have at least some functions that are challenging to use safely. For example, dynamic languages such as JavaScript and\n\nPHP have several functions that generate new code at runtime (eval, seTtimeout, etc.) and are a frequent source of code execution vulnerabilities.\n\nDevelopers should be provided guidance on what functions to avoid and their safe equivalents within the coding standards described in the preceding section. Additionally, tooling should be deployed to assist in identifying and reviewing the usage of dangerous functions. Many static analysis and linting tools provide a mechanism to identify usage during build time, and some integrate into IDEs (Integrated Development Environments) to provide authoring time guidance to developers as they write code. Additionally, there are resources such as Microsoft’s freely available banned.h header file that, when included in a project, will cause usage of unsafe functions to generate compiler errors. It is quite feasible to produce code bases free of unsafe function usage.\n\nCWE (Common Weakness Enumeration) References ● CWE-119: Improper Restriction of Operations within the Bounds of a Memory Buffer ● CWE-120: Buffer Copy without Checking Size of Input ('Classic Buffer Overflow') ● CWE-805: Buffer Access with Incorrect Length Value\n\nReferences\n\n- ISO/IEC 9899:201x Programming Languages C - Annex-K Bounds Checking Interfaces\n\n  - Updated Field Experience with Annex K — Bounds Checking Interfaces\n\n- Security Development Lifecycle (SDL) Banned Function Calls"
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
