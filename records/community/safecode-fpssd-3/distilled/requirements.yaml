  - id: "safecode-fpssd-3#P-monitor-and-manage-third-party-component-vulnera"
    designator: "P-monitor-and-manage-third-party-component-vulnera"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "supply-chain"
    locator: "Vulnerability Response and Disclosure > Monitor and Manage Third-party Component Vulnerabilities"
    short_title: "Monitor and Manage Third-party Component Vulnerabilities"
    text: "Almost all organizations will use third-party components (TPCs) in software development. These TPCs include both open-source software (OSS) and commercial off-the-shelf (COTS) components, and development organizations inherit the security vulnerabilities of the components they incorporate. It is critical for organizations to have a process to monitor and manage vulnerabilities that are discovered in such components. See SAFECode's “Managing Security Risks Inherent in the Use of Third-Party Components” for more detailed guidance on this topic."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
