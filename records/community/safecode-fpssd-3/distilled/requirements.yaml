  - id: "safecode-fpssd-3#P-stakeholder-management-and-communications"
    designator: "P-stakeholder-management-and-communications"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
