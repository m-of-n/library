  - id: "safecode-fpssd-3#P-vulnerability-response-and-disclosure"
    designator: "P-vulnerability-response-and-disclosure"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "operations/response"
    locator: "Vulnerability Response and Disclosure"
    short_title: "Vulnerability Response and Disclosure"
    text: "Despite the best efforts of software development teams, vulnerabilities may still exist in released software that may be exploited to compromise the software or the data it processes. Therefore, it is necessary to have a vulnerability response and disclosure process to help drive the resolution of externally discovered vulnerabilities and to keep all stakeholders informed of progress. This is particularly important when a vulnerability is being publicly disclosed and/or actively exploited. The goal of the process is to provide customers with timely information, guidance and, where possible, mitigations or updates to address threats resulting from such vulnerabilities.\n\nThere are two ISO standards that provide detailed guidance on how to implement vulnerability response and disclosure processes within an organization. SAFECode members encourage others to use these industry-proven standards to the extent possible.\n\n  - ISO/IEC 29147 – Vulnerability disclosure (available as a free download). Provides a guideline on receiving information about potential vulnerabilities from external individuals or organizations and distributing vulnerability resolution information to affected customers\n\n  - ISO/IEC 30111 – Vulnerability handling processes (requires a fee to download). Gives guidance on how to internally process and resolve reports of potential vulnerabilities within an organization"
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
  - id: "safecode-fpssd-3#P-define-internal-and-external-policies"
    designator: "P-define-internal-and-external-policies"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "operations/response"
    locator: "Vulnerability Response and Disclosure > Define Internal and External Policies"
    short_title: "Define Internal and External Policies"
    text: "It is important to define and maintain a vulnerability response policy to state your company’s intentions when investigating and remediating externally reported vulnerabilities. Typically, a vulnerability response and disclosure policy should consider guidelines for vulnerability response internal to your company and publicly or external to your company. The disclosure process will likely be different in the case when a vulnerability has been disclosed privately and in the case when the vulnerability has been publicly disclosed and/or actively exploited, and each scenario should be clearly defined and documented in the response policy.\n\nInternal policy defines who is responsible in each stage of the vulnerability handling process and how they should handle information on potential and confirmed vulnerabilities.\n\nExternal or public policy is primarily intended for external stakeholders, including vulnerability reporters or security researchers who report vulnerabilities, customers and potentially press or media contacts. The external policy sets expectations with external stakeholders about what they can expect when a potential vulnerability is found."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
