  - id: "safecode-fpssd-3#P-risk-acceptance-process"
    designator: "P-risk-acceptance-process"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "governance"
    locator: "Manage Security Findings > Risk Acceptance Process"
    short_title: "Risk Acceptance Process"
    text: "When an issue cannot be completely resolved or fully mitigated, or can be only partially mitigated, a risk approval or mitigation request should be approved before the product is released. It is advisable to anticipate these situations ahead of time, create a structured format to communicate them and define process or workflow, including responsibilities of the roles involved. Ideally, the format and process will be instantiated in the ADLM system in use. There should be clear delineation of who submits, reviews and approves these requests. It is equally important to ensure that appropriately empowered individuals are assigned the responsibility to accept or reject risk. This should vary by the residual risk; e.g., Critical Risk to VP of Business Unit, Medium Risk to Engineering Manager.\n\nA goal of the structured format is to drive consistency and help all involved consider critical factors when making a decision that affects residual risk. An example structure used by a SAFECode member is TSRV: Technique (T) captures the type of mitigation in effect using MITRE’s Monster Mitigations, Specifics (S) documents the specific compensating control in effect, Remaining Risk (R) outlines the risk that the mitigation does not address, and Verification (V) explains how the mitigation’s effectiveness was verified.\n\nAcceptance of risk must be tracked and archived. The record of risk acceptance should include a severity rating, a remediation plan or expiration or re-review period for the exception and the area for re-review/validation (e.g., a function in code should be re-reviewed to ensure that it continues to sufficiently reduce the risk). In some cases, to ensure that required mitigating controls outside the application are implemented, it may be necessary to produce documentation, such as a Security Configuration Guide."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
