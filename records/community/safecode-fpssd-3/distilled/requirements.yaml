  - id: "safecode-fpssd-3#P-establish-log-requirements-and-audit-practices"
    designator: "P-establish-log-requirements-and-audit-practices"
    entry_type: "practice"
    normativity: "descriptive-practice"
    verb: "practice"
    actor: "organization / development team"
    nature: "process"
    phase: "design"
    locator: "Design > Establish Log Requirements and Audit Practices"
    short_title: "Establish Log Requirements and Audit Practices"
    text: "In the event of a security-related incident, it is important to be able to piece together relevant details to determine what happened. Well-designed application, system and security log files provide the ability to understand an application’s behavior and how it has been used at any moment in time. They are the fundamental data sources that inform automated Security Information and Event Management (SIEM) systems alerting.\n\nThe creation and maintenance of these logs is a critical set of software design decisions that is informed by the business and system requirements, the threat model, and the availability of log creation and maintenance functions in the deployed environment, with uses that range from security incident identification to system event optimization. The content of the log files should always be determined by the group or groups that will need to consume the log file contents. Because logging affects the available system resources of the local computer, it is important not only to capture the critical information but to restrict information capture to only the needed data. It is equally important to carefully identify what security information is relevant and needs to be logged, where the logs will be stored, for how long the logs will be retained and how the logs will be protected.\n\nIf possible, use the logging features of the operating system or other established tools, rather than creating a new logging infrastructure. The underlying infrastructure for platform logging technologies is likely to be secure and provide features such as tamper protection. It is critically important that any logging system provide controls to prevent tampering and offer basic configuration to ensure secure operation.\n\nEnsure that security logs are configurable during application runtime. This allows the richness of logging information to be adjusted, which can help to provide more effective alerts to use in investigating security events.\n\nEven with carefully considered and configured logging, it is very easy to accumulate vast amounts of log data, and therefore it is important to differentiate among logging needs. Monitoring data is relevant to configuration troubleshooting, usage, performance and ongoing feature development. Security logs are relevant to forensic analysis in the event of an incident. Unless logs are moved to a central location and archived, which is recommended, do not delete local log files too quickly. Deletion could potentially hinder required investigations into past events."
    expects_deliverables: []
    verification: "not specified by the source"
    kind: "stated"
    testable: "partial"
    testable_reason: "practice description"
