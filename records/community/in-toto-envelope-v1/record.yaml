      reviewed_by: ""
    - kind: schema
      path: distilled/schema/
      coverage: "The source ships no schema. Derived only: envelope.derived.schema.json (JSON Schema 2020-12; generic and DSSE envelopes, signatures, payloadType, storage media type and file-name patterns) and a stdlib checker; 93 cases (32 accept, 61 reject, each for a named reason), every asserting keyword mutated (43 removals, each flips a case, 1 equivalent mutant reasoned); jsonschema 4.26 agrees on 83 of 93, the 10 being documented annotation and trailing-newline classes."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "8 messages (generic Envelope, Signature, DSSE-profile Envelope, the decoded Statement as referenced, the payloadType and storage media types, the file-name conventions) with 23 fields, every field with a non-empty constrained_by resolving to the right id; 3 referenced structures (Sigstore Bundle, COSE_Sign, COSE_Sign1); 5 source silences."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "No exchange is defined; one-way store-and-forward only. 4 roles (storage inferred), 3 flows (produce, name and store, consume), 20 steps (2 inferred), 11 error paths (the source names none; 8 unspecified), one Mermaid diagram per flow in protocol.md; 73 constrained_by links to 48 ids; message names joined to messages.yaml. DSSE's own signing and verification are opaque steps."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/
      coverage: "3 verbatim fixtures (the §4.1 media types, L94-96) with derived expected results, re-extracted from .cache/in-toto-envelope-v1.bin by two extractors in reproduce.py (43 checks); 93 derived accept/reject cases. The source prints no envelope, signature or test vector, so there is no external oracle."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "27 rows against m-of-n at 7c3c731 (5 adopt, 4 adapt, 3 reject, 7 constrains, 2 conflicts, 6 silent); MD-3 field by field (DSSE, COSE_Sign, KSA envelope) and where the source cuts against MD-3 and DEC-002; R-O-05 ordering; COSE_Sign as an option DEC-005 does not list; two conflicts with R-O-05 and SPEC-0001 §5.3 on export; post-quantum: the envelope is algorithm-silent; 15 open questions. Decides nothing."
      reviewed_by: ""
  not_applicable:
    - kind: state-machine
      reason: "No lifecycle: an Envelope is produced, stored and read once; nothing in the source updates, re-signs, supersedes, revokes or expires it. Of 26 lifecycle words (state, lifecycle, transition, status, revoke, expire, rotate, renew, update, valid, supersede, rollover and others) none occurs in the 110 lines, counted by script. The one process with an outcome, a consumer obtaining authenticated predicate information (§2 L54-55, §4 L87-88), is two operations in one sentence with no states and no fixed order: protocol.yaml F03, its order recorded as SD-3. Signature verification is DSSE v1.0's (§1 L8), not this source's. Evidence and census in distilled/state-machine.yaml."
