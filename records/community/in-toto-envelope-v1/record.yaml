usefulness:
  verdict: useful
  reason: "The envelope rule set (ITE-5) is the clearest statement of R-O-05's verify-before-parse, no-canonicalization stance in the in-toto world; for the PQ question it shows the envelope is algorithm-silent by design, so in-toto's post-quantum path is entirely the signer's and the verifier's out-of-band key policy."
