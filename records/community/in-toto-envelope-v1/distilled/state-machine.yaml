candidates:
  - id: "SC-1"
    what: "A consumer obtaining authenticated predicate information"
    locator: "§2, §4"
    why_not: >-
      Two operations named in one sentence, stated twice, with no states, no order and no outcome
      for failure. Modelled as protocol.yaml F03 steps 3 to 5, where the missing order is recorded
      (SD-3) and the failure outcome is marked inferred (EP-09).
    quotes:
      - source_lines: "54-55"
        quote: |-
          To obtain predicate information that is authenticated, consumers MUST parse the Envelope's `payload`, and verify it against its `signatures`.
      - source_lines: "87-88"
        quote: |-
          To obtain predicate information that is authenticated, consumers MUST parse the Envelope's `payload`, and verify it against its `signatures`.
  - id: "SC-2"
    what: "Signature verification"
    locator: "§1"
    why_not: >-
      Defined by DSSE v1.0, not here; a machine for it would extract DSSE, not this source. This
      source adds only what is signed (payloadType with payload) and that the consumer must verify.
    quotes:
      - source_lines: "8"
        quote: |-
          The RECOMMENDED format and protocol for Envelopes are defined per [DSSE v1.0].
  - id: "SC-3"
    what: "ITE-5 compliance of a format over time"
    locator: "§1.1, footnote"
    why_not: >-
      The Sigstore Bundle is not currently compliant and a discussion of extending it is footnoted.
      That is the status of another project's format, which this source neither defines nor tracks.
    quotes:
      - source_lines: "21-22"
        quote: |-
          The [Sigstore Bundle], while [supporting DSSE], is not currently [ITE-5] compliant because it requires a _single signature_ in the envelope.[^1]
      - source_lines: "98"
        quote: |-
          There is an [ongoing discussion](https://github.com/sigstore/sig-clients/issues/9) about supporting [DSSE Signature Extensions](https://github.com/secure-systems-lab/dsse/blob/devel/envelope.md#signature-extensions-experimental) to extend the current features of Sigstore Bundles.
  - id: "SC-4"
    what: "Signing keys and KEYID"
    locator: "§1, §3"
    why_not: >-
      KEYID is a hint to which key signed and a component of a file name. No key rollover,
      revocation or expiry appears; key formats are the in-toto v1.0 specification's.
    quotes:
      - source_lines: "15"
        quote: |-
          SHOULD support a hint indicating what signing key was used, i.e., a KEYID
      - source_lines: "104"
        quote: |-
          [KEYID]: https://github.com/in-toto/docs/blob/v1.0/in-toto-spec.md#421-key-formats
  - id: "SC-5"
    what: "Predicate versions"
    locator: "§2, §4"
    why_not: "Excluded from both media types and handed to the Statement layer."
    quotes:
      - source_lines: "56-57"
        quote: |-
          The predicate version is not specified in the media type; it is handled in the [Statement] layer.
      - source_lines: "82-83"
        quote: |-
          Predicate versioning is handled in the [Statement] layer.
  - id: "SC-6"
    what: "The Envelope itself"
    locator: "whole source"
    why_not: >-
      Produced once (F01), named or labelled and stored (F02), read (F03). Nothing in the source
      changes an Envelope after it is produced, and the census above finds no vocabulary for doing
      so.
