not_applicable_reason: >-
  envelope.md defines no lifecycle, and the verdict is measured: over its 110 lines, as whole words,
  case-insensitively, state, states, lifecycle, transition, transitions, status, revoke, revoked,
  revocation, expire, expired, expiry, expiration, rotate, rotation, renew, update, updated, valid,
  validity, time, timestamp, pending, supersede, replace and rollover each occur 0 times. An
  Envelope is produced, stored and read once (protocol.yaml F01 to F03); nothing in the source
  updates, re-signs, supersedes, revokes or expires it. The one process with an outcome, a consumer
  obtaining authenticated predicate information (§2 L54-55, §4 L87-88), is two operations, parse and
  verify, in one sentence, with no states, no fixed order and no failure outcome; it is protocol
  flow F03, its order recorded as source tension SD-3. Signature verification, the obvious
  lifecycle candidate, is DSSE v1.0's: §1 L8 makes DSSE the recommended format and protocol and this
  source defines none of it. KEYID is a key hint (L15) and a file-name component (L73-74) with no
  rotation or revocation; key formats are the in-toto v1.0 specification's (L104). Predicate
  versions are the Statement layer's (L56-57, L82-83).
