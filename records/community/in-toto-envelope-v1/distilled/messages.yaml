reviewed_by: ""
source_digest: "c02c65880ccc117bbdecc6c916d5108541c1a864de67f8f9082efbaf15265d11"
source: ".cache/in-toto-envelope-v1.txt (rendering of spec/v1/envelope.md by distilled/render-source.py; line N is line N of the Markdown; headings numbered 1 Schema, 1.1 Alternative Envelope schemas, 2 Fields, 3 File naming convention, 4 Storage convention, 4.1 Examples). Quotations are checked against it with bin/check-quotes. source_digest above is the sha256 of the original envelope.md (.cache/in-toto-envelope-v1.bin, equal to content.sha256 in record.yaml), not of that rendering, whose sha256 is d4bdf93f92f2d654a430896374bdc94c53a15576ffab44d3603e5ebd61659f42 (requirements.yaml source_digest)."
extracted: "2026-11-16"
extracted_by: "FX-1 pass 1 (extract), schema+messages+examples lane, from the source only"
applicability: "The source defines no wire format of its own. It defines field requirements on an Envelope (generic and DSSE profile), the payloadType and storage media types, and file-name conventions. The DSSE envelope structure, the Statement layer, the Bundle, the predicate specification files and the KEYID format are defined elsewhere and are referenced, not defined."
note: "Conventions. (1) source: mappings are {source_lines, quote} written by script (bin/_source_text span of the cached source) and verified by bin/check-quotes; a quote is the whole of its lines. (2) constrained_by ids were resolved by script from distilled/requirements.yaml: a selector of source_lines plus text must match exactly one requirement, and every resolved pair was printed and read. Pass 1 wired skeleton ids only; pass 2 added the ids the requirements lane appended (R-0030 to R-0050) where they are the right id, each pair read back. Duplicated texts (R-0017/R-0027, R-0018/R-0028, R-0019/R-0029; R-0016/R-0026 differ only by 'The') are told apart by source_lines. (3) Statements that bind but carry no BCP 14 keyword are entries with verb none: L21-22 R-0030, L23-24 R-0031 (split R-0032, R-0033), L28-29 R-0034, L32-33 R-0037, L42-43 R-0038, L46-47 R-0039, L47-48 R-0040, L56-57 R-0041, L82-83 R-0042. (4) level is the source's own keyword; required is true only where the source says REQUIRED or MUST be present, or by the interpretation named in the entry. (5) Derived schema: schema/envelope.derived.schema.json, checked by schema/check-envelope.derived.py against examples/cases.derived.json. (6) source_defects carry the canonical SD-n ids of the Source defects section of normative.md, which holds the crosswalk from this file's pass-1 ids."
messages:
  - name: "Envelope (generic)"
    locator: "§2"
    role: "outermost layer of an attestation: serialization and authentication by digital signatures (lines 3-4)"
    source:
      source_lines: "28-29"
      quote: "The in-toto Attestation Framework has the following general field requirements for an Envelope:"
    encoding: "not fixed: the envelope schema determines it. DSSE v1.0 is RECOMMENDED (R-0001); formats meeting ITE-5 are permitted (R-0002). Field names below are in-toto's; '(or equivalent)' means another envelope format may name them differently."
    constrained_by:
      - "in-toto-envelope-v1#R-0001"
      - "in-toto-envelope-v1#R-0002"
      - "in-toto-envelope-v1#R-0003"
      - "in-toto-envelope-v1#R-0004"
      - "in-toto-envelope-v1#R-0005"
      - "in-toto-envelope-v1#R-0006"
      - "in-toto-envelope-v1#R-0007"
      - "in-toto-envelope-v1#R-0008"
      - "in-toto-envelope-v1#R-0034"
      - "in-toto-envelope-v1#R-0048"
    constrained_by_note: "message-level: R-0034 makes the field rules below general, for any envelope schema; R-0001/R-0002 choose the format, and R-0048 (inferred) is what the source leaves open for a format outside both; R-0003..R-0008 are the ITE-5 properties (multi-signature, authenticated payload type, no canonicalization dependence, key hint, no payload parse before verify, no algorithm in signature). The ITE-5 bullets are properties of the format, not wire members, so no schema keyword binds them."
    fields:
      - name: "signatures"
        type: "array of signature (see Signature)"
        required: true
        level: "REQUIRED"
        encoding: "signature bytes encoding determined by the envelope schema"
        constrained_by:
          - "in-toto-envelope-v1#R-0009"
          - "in-toto-envelope-v1#R-0035"
          - "in-toto-envelope-v1#R-0036"
          - "in-toto-envelope-v1#R-0037"
          - "in-toto-envelope-v1#R-0003"
          - "in-toto-envelope-v1#R-0045"
        source:
          source_lines: "31-33"
          quote: "- `signatures` (or equivalent) is REQUIRED and MUST be defined as an array of digital signatures. The encoding of the signature bytes is determined by the envelope schema."
        constrained_by_note: "R-0009 is split into R-0035 (present) and R-0036 (an array of digital signatures). L32-33 is R-0037 (verb none): the envelope schema decides how signature bytes are encoded. No minimum count is set: an empty array authenticates nothing (R-0045, inferred)."
      - name: "keyid"
        type: "key hint, type not stated by the source"
        required: false
        level: "SHOULD"
        encoding: "not stated; may be nested within each signature element (R-0011)"
        constrained_by:
          - "in-toto-envelope-v1#R-0010"
          - "in-toto-envelope-v1#R-0006"
          - "in-toto-envelope-v1#R-0011"
        source:
          source_lines: "34-35"
          quote: "- A `keyid` (or equivalent) SHOULD be included for each signing key used. The envelope schema MAY nest this field within the signature array."
        constrained_by_note: "'SHOULD be included for each signing key used' (R-0010); the ITE-5 form is 'SHOULD support a hint ... KEYID' (R-0006). Nesting is MAY (R-0011): top level or inside the signatures array."
      - name: "payload"
        type: "the in-toto Statement that was signed, serialization not stated for the generic envelope"
        required: false
        level: "SHOULD"
        encoding: "not stated for the generic envelope (DSSE profile: base64 of JSON)"
        constrained_by:
          - "in-toto-envelope-v1#R-0012"
          - "in-toto-envelope-v1#R-0007"
        source:
          source_lines: "36-37"
          quote: "- `payload` (or equivalent) SHOULD be included and contain the in-toto [Statement] that was signed."
        constrained_by_note: "R-0007 is the ITE-5 criterion that a format let the verifier check the signatures before parsing the payload."
      - name: "payloadType"
        type: "media type string"
        required: false
        level: "no presence rule (contrast R-0035 for signatures); MUST be signed with payload (R-0013); MUST take the form below (R-0014); R-0043 infers it is present"
        encoding: "application/vnd.in-toto+<encoding>"
        constrained_by:
          - "in-toto-envelope-v1#R-0004"
          - "in-toto-envelope-v1#R-0013"
          - "in-toto-envelope-v1#R-0014"
          - "in-toto-envelope-v1#R-0043"
          - "in-toto-envelope-v1#R-0044"
        source:
          source_lines: "38-40"
          quote: "- `payloadType` (or equivalent) MUST be signed along with the `payload`. It MUST take the form `application/vnd.in-toto+<encoding>` to indicate an in-toto [Statement] payload and its serialized `<encoding>` format."
        constrained_by_note: "See source defect SD-1: the DSSE-profile predicate form does not match this generic form. No sentence makes payloadType present, as R-0035 does signatures; R-0013 and R-0014 presuppose one. required: false reads them as applying when it is present, the reading the derived schema implements; R-0043 (inferred) reads them as requiring it. Both readings: SD-2. R-0004 is the ITE-5 criterion that a format carry an authenticated payload type, not a rule on this field; R-0044 (inferred) has the verifier check payloadType."
    layout: "no byte-level layout in the source. Structural: an object (or equivalent) with signatures (array, required), and optionally keyid, payload, payloadType. Schema: schema/envelope.derived.schema.json#/$defs/GenericEnvelope"
  - name: "Signature (element of signatures)"
    locator: "§1, §2"
    role: "one digital signature over the payload"
    source:
      source_lines: "31-33"
      quote: "- `signatures` (or equivalent) is REQUIRED and MUST be defined as an array of digital signatures. The encoding of the signature bytes is determined by the envelope schema."
    encoding: "determined by the envelope schema (lines 32-33); in DSSE v1.0 an object with sig and keyid, defined outside this source"
    constrained_by:
      - "in-toto-envelope-v1#R-0009"
      - "in-toto-envelope-v1#R-0036"
      - "in-toto-envelope-v1#R-0037"
      - "in-toto-envelope-v1#R-0008"
    constrained_by_note: "R-0036: one element of an array of digital signatures; R-0037: its bytes are encoded as the envelope schema says. R-0008 is the ITE-5 criterion that a format not need the signing key's algorithm inside the signature."
    fields:
      - name: "keyid"
        type: "key hint, type not stated"
        required: false
        level: "SHOULD"
        encoding: "may be nested here (R-0011)"
        constrained_by:
          - "in-toto-envelope-v1#R-0010"
          - "in-toto-envelope-v1#R-0011"
        source:
          source_lines: "34-35"
          quote: "- A `keyid` (or equivalent) SHOULD be included for each signing key used. The envelope schema MAY nest this field within the signature array."
      - name: "signature bytes (DSSE: sig)"
        type: "digital signature"
        required: true
        level: "REQUIRED (an element of the required signatures array)"
        encoding: "determined by the envelope schema; the source states no encoding, no algorithm and no field name"
        constrained_by:
          - "in-toto-envelope-v1#R-0036"
          - "in-toto-envelope-v1#R-0037"
        source:
          source_lines: "31-33"
          quote: "- `signatures` (or equivalent) is REQUIRED and MUST be defined as an array of digital signatures. The encoding of the signature bytes is determined by the envelope schema."
        constrained_by_note: "R-0036 and R-0037, the halves of L31-33 that bear on one element. The member name sig is DSSE v1.0, outside this source. The schema types it and does not require it (open: silence)."
    layout: "unspecified by the source (SIL-01). Schema: #/$defs/GenericSignature, #/$defs/DsseSignature"
  - name: "Envelope (DSSE profile)"
