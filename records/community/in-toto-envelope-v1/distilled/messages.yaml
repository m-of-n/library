source_defects_note: "Pass 2 renamed these to the canonical ids of normative.md's Source defects section, which holds the crosswalk: SD-01 is SD-1, SD-02 SD-5, SD-03 SD-6, SD-04 SD-10, SD-05 SD-2, SD-06 SD-8."
source_defects:
  - id: "SD-1"
    locator: "§2"
    summary: "two MUSTs on payloadType whose forms do not intersect for the predicate-specific case"
    detail: "The general rule requires application/vnd.in-toto+<encoding>; the DSSE rule requires application/vnd.in-toto.<predicate>+json or application/vnd.in-toto+json. The first alternative of the DSSE rule does not match the general form. An envelope using the predicate-specific form satisfies the DSSE rule and violates the general one. Pinned by schema cases GEN-R05 and PTG-R01."
    quote_a:
      source_lines: "39-40"
      quote: "It MUST take the form `application/vnd.in-toto+<encoding>` to indicate an in-toto [Statement] payload and its serialized `<encoding>` format."
    quote_b:
      source_lines: "45-46"
      quote: "- `payloadType` MUST be set to `application/vnd.in-toto.<predicate>+json` or to `application/vnd.in-toto+json`. This indicates that the Envelope contains"
  - id: "SD-5"
    locator: "§3 vs §2"
    summary: ".json suffix stated for every Envelope, while the generic payloadType admits any <encoding>"
    detail: "An Envelope whose Statement is serialized as something other than JSON (application/vnd.in-toto+cbor is valid generically) is still recommended the suffix .json (R-0021); the source does not say the suffix applies only to the JSON DSSE envelope. Pass 2: <encoding> names the Statement's serialization, not the Envelope's, so the suffix misfits where the Envelope itself is not JSON, which is SD-5."
    quote_a:
      source_lines: "62-63"
      quote: "If stored in a dedicated file by itself, and not as part of a [Bundle], an Envelope SHOULD use the suffix `.json`."
    quote_b:
      source_lines: "39-40"
      quote: "It MUST take the form `application/vnd.in-toto+<encoding>` to indicate an in-toto [Statement] payload and its serialized `<encoding>` format."
  - id: "SD-6"
    locator: "§2, §4"
    summary: "<predicate> is defined by reference to a directory this source does not contain"
    detail: "R-0016 and R-0026 resolve <predicate> through the link of L109, ../predicates (a relative link). No character set, case rule or registry is given, so no pattern for <predicate> can be derived from the source; schema/envelope.derived.schema.json assumes one and marks it."
    quote_a:
      source_lines: "49-50"
      quote: "- `<predicate>` MUST match the [predicate specification filename] without the file extension."
    quote_b:
      source_lines: "81-82"
      quote: "- The `<predicate>` MUST match the [predicate specification filename] without the file extension. Predicate versioning is handled in the"
  - id: "SD-10"
    locator: "§3"
    summary: "the keyid-suffixed file name cannot be told from a step name that contains a dot"
    detail: "<step/env-name>.<keyid[0:8]>.json also matches <step-name>.json, and a step name build.deadbeef gives the same file name as build with keyid deadbeef. The KEYID representation (and so what <keyid[0:8]> selects) is by link to the in-toto spec only; '<step/env-name>' alternation is not defined."
    quote_a:
      source_lines: "71-74"
      quote: "- If multiple Envelopes are produced for the same step by different [functionaries] uniquely identified by a public key, an Envelope name SHOULD include the truncated [KEYID] of the public key `<keyid[0:8]>` of the signing functionary: `<step/env-name>.<keyid[0:8]>.json`."
  - id: "SD-2"
    locator: "§1, §2"
    summary: "payloadType is SHOULD in one place and an unconditional MUST in another"
    detail: "quote_a (R-0004, an ITE-5 criterion on a format) against quote_b (R-0013 and R-0014, general field rules). Read here as: optional in a generic Envelope, and the MUSTs apply when it is present; the DSSE rule 'MUST be set' is read as required there. R-0043 (inferred) reads the general rules as requiring it; SD-2 records both readings. Pinned by cases DSSE-R04 and GEN-A01 (both derived-assumption)."
    quote_a:
      source_lines: "13"
      quote: "- SHOULD include an authenticated payload type"
    quote_b:
      source_lines: "38-40"
      quote: "- `payloadType` (or equivalent) MUST be signed along with the `payload`. It MUST take the form `application/vnd.in-toto+<encoding>` to indicate an in-toto [Statement] payload and its serialized `<encoding>` format."
  - id: "SD-8"
    locator: "§2, §4"
    summary: "singular Consumer, without an article, after plural Consumers, in a sentence pair printed in both §2 and §4"
    detail: "'Consumers SHOULD NOT rely ... Consumer SHOULD only rely' is printed identically in §2 and §4; the sentences are separate requirements with identical text (R-0017/R-0027, R-0018/R-0028, R-0019/R-0029), a join hazard rather than a contradiction."
    quote_a:
      source_lines: "51-53"
      quote: "- Consumers SHOULD NOT rely upon the media type for individual attestations as faithful indicators of predicate type. Consumer SHOULD only rely on the `predicateType` field in the [Statement] layer."
    quote_b:
      source_lines: "84-86"
      quote: "- Consumers SHOULD NOT rely upon the media type for individual attestations as faithful indicators of predicate type. Consumer SHOULD only rely on the `predicateType` field in the [Statement] layer."
