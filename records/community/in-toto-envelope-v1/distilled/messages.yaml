        source:
          source_lines: "65-67"
          quote: "- For attestations intended for consumption by [in-toto-verify], an Envelope containing an attestation about a particular software supply chain step `<step-name>` SHOULD be named `<step-name>.json`."
      - name: "<env-name>.json"
        type: "file name"
