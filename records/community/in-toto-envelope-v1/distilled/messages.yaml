        source:
          source_lines: "68-70"
          quote: "- For other verifiers, or cases in which a step name cannot be easily determined, the attestation producer and consumer MAY agree on an arbitrary filename: `<env-name>.json`."
      - name: "<step/env-name>.<keyid[0:8]>.json"
        type: "file name"
        required: false
        level: "SHOULD, when several functionaries sign the same step (R-0024)"
        encoding: "keyid[0:8] read as the first 8 characters of the KEYID of the signing functionary's public key (R-0049, inferred); KEYID format by link only (L104); the name cannot be told from a dotted step name (SD-10)"
