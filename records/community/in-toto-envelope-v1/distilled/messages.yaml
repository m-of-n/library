        constrained_by_note: "L46-47 is R-0039 (verb none): what either value announces about the payload; L47-48 is R-0040, the condition the predicate-specific value brings in; L56-57 is R-0041. R-0004 is the ITE-5 criterion on formats other than DSSE, cited for the property; the rule that binds a DSSE payloadType to the signature is R-0013."
