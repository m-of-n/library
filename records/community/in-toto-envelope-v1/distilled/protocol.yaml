conventions:
  quoting: >-
    Every quotation is a quotes item {source_lines, quote}. The words were cut from
    .cache/in-toto-envelope-v1.txt by script through bin/_source_text (whitespace collapsed; this
    Markdown source has no page breaks, aside bars or line-end hyphens), never typed, and each range
    is the tightest that holds them; bin/check-quotes verifies every one. Markdown syntax
    (backticks, link brackets, the underscores of emphasis, the footnote mark) is part of the quoted
    text. Text in action, guard, note and on_error is this file's wording; where it repeats source
    words, the step's quotes or constrained_by carry them.
  step_kind: >-
    kind is stated (the source says the step happens, or binds it) or inferred (this model's step,
    with inferred_reason saying what the source does and does not say). An ordering the source does
    not fix is called out in the flow's order_note.
  on_error_basis: >-
    stated: the source says what follows. inferred: this file's reading, and on_error says so.
    unspecified: the source names the step and says nothing about its failure. none: the step
    restricts what a role relies on and has no failure of its own.
  constrained_by: >-
    in-toto-envelope-v1#R-NNNN ids of requirements.yaml whose text the step obeys or that bind what
    it emits. Each was emitted by script from the id table by its source_lines and a phrase of its
    text, refusing zero or several matches, and every resolved pair was read. Pass 1 cited the
    skeleton ids R-0001 to R-0029 only; pass 2 added the ids the requirements lane appended
    (R-0030 to R-0050) where a step obeys or rests on one, each pair read back. Three pairs share identical text in §2 and §4
    (in-toto-envelope-v1#R-0017 and in-toto-envelope-v1#R-0027; in-toto-envelope-v1#R-0018 and
    in-toto-envelope-v1#R-0028; in-toto-envelope-v1#R-0019 and in-toto-envelope-v1#R-0029), so each
    is cited for the section its step draws on, and both where the step draws on both.
  messages: >-
    message names the structure a step reads, writes or hands on, by the source's own terms:
    Envelope (§2's fields signatures, keyid, payload and payloadType), Statement (the payload's
    content, defined in statement.md), Envelope file name (§3) and storage media type (§4). field
    names the Envelope field a step sets or checks. The names were chosen blind to messages.yaml;
    pass 3 joined them to its entries in message_join below, checked by script: every step message
    is a protocol name there, every messages.yaml name listed exists, and every step field is a
    field of each mapped Envelope entry.
  message_join:
    - protocol: "Envelope"
      messages_yaml:
        - "Envelope (generic)"
        - "Envelope (DSSE profile)"
      note: >-
        The DSSE profile adds to the generic entry (R-0038), so a step on Envelope joins to both;
        the step fields signatures, payloadType and payload are fields of each, and keyid is a
        field of the generic entry and of Signature (element of signatures), where the schema may
        nest it (R-0011).
    - protocol: "Statement"
      messages_yaml:
        - "Statement (decoded payload, referenced)"
      note: >-
        F03.4 names Statement as the message produced and payload as the Envelope field read.
    - protocol: "Envelope file name"
      messages_yaml:
        - "Envelope file name"
      note: "Same name."
    - protocol: "Storage media type"
      messages_yaml:
        - "Storage media type"
      note: >-
        Same name; F02.7 wrote it in lower case before pass 3.
    - protocol: "signature and keyid (the F01.7 hand-off and its diagram label)"
      messages_yaml:
        - "Signature (element of signatures)"
      note: >-
        What a functionary hands the producer; not a step message, and the sig and keyid members
        are DSSE v1.0's (messages.yaml, outside this source).
  roles: >-
    from and to name roles of the roles list; from equal to to marks a local step.
  steps: "A step is referred to as flow id and n, F02.5 for instance."
roles:
  - name: "producer"
    locator: "§1, §3"
    definition: >-
      Builds the Envelope around an in-toto Statement: chooses the envelope format, sets
      payloadType, has payloadType and payload signed, assembles the fields, then names the Envelope
      as a file or labels it in a storage system. May agree a file name with the consumer.
    kind: "stated"
    quotes:
      - source_lines: "9-10"
        quote: |-
          Producers MAY use other signature methods and formats that meet the [ITE-5] specification:
      - source_lines: "69-70"
        quote: |-
          the attestation producer and consumer MAY agree on an arbitrary filename
  - name: "functionary"
    locator: "§3"
    definition: >-
      A signer for one software supply chain step, known by its public key. Each signing functionary
      contributes a signature (and a keyid) over payloadType and payload. §3 has functionaries
      producing Envelopes, so a functionary producing its own Envelope is also its producer; the
      source draws no line between the two.
    kind: "stated"
    quotes:
      - source_lines: "71-72"
        quote: |-
          If multiple Envelopes are produced for the same step by different [functionaries] uniquely identified by a public key
      - source_lines: "73-74"
        quote: |-
          the truncated [KEYID] of the public key `<keyid[0:8]>` of the signing functionary
  - name: "storage"
    locator: "§3, §4"
    definition: >-
      The medium between producer and consumer: a dedicated file, a Bundle (bundle.md), or an
      arbitrary storage system that labels the Envelope with a media type. Holds the Envelope; has
      no obligations.
    kind: "inferred"
    inferred_reason: >-
      The source names the media (L62, L78-79) but gives them no obligations and never calls them a
      party. Modelled as a passive participant so that the hand-off from producer to consumer can be
      drawn.
    quotes:
      - source_lines: "62"
        quote: |-
          If stored in a dedicated file by itself, and not as part of a [Bundle],
      - source_lines: "78-79"
        quote: |-
          The media type `application/vnd.in-toto.<predicate>+dsse` SHOULD be used to denote an individual attestation in arbitrary storage systems.
  - name: "consumer"
    locator: "§1, §2, §3, §4"
    definition: >-
      Finds the Envelope, verifies it and reads the Statement it carries. The source's verifier
      (§1), in-toto-verify and the other verifiers (§3) are consumers in this sense: §3 contrasts
      consumption by in-toto-verify with other verifiers and then names the parties producer and
      consumer.
    kind: "stated"
    quotes:
      - source_lines: "54-55"
        quote: |-
          To obtain predicate information that is authenticated, consumers MUST parse the Envelope's `payload`, and verify it against its `signatures`.
      - source_lines: "16"
        quote: |-
          SHOULD NOT require the verifier to parse the payload before verifying
      - source_lines: "65"
        quote: |-
          For attestations intended for consumption by [in-toto-verify],
      - source_lines: "68"
        quote: |-
          For other verifiers,
flows:
  - id: "F01"
    name: "produce-envelope"
    title: "Producing a signed Envelope around an in-toto Statement"
    locator: "§1, §1.1, §2"
    kind_of_flow: "local-procedure"
    participants:
      - "producer"
      - "functionary"
    summary: >-
      The producer picks DSSE v1.0, or another format that meets the six ITE-5 properties (a
      single-signature format does not), serializes the Statement as the payload, fixes payloadType,
      has each signing functionary sign payloadType and payload together, and assembles signatures,
      keyids and payload into the Envelope. How a signature is computed and encoded is the envelope
      schema's, not this source's.
    order_note: >-
      The source orders nothing. Two orders follow from what is signed rather than from any
      sentence: the payload (step 4) and payloadType (step 5) exist before signing (step 6), because
      the signature covers payloadType and payload together; and the format (steps 1 to 3) comes
      first because it fixes the field names and the signing method. Steps 4 and 5 may swap. Step 7
      is inferred.
    steps:
      - n: "1"
        from: "producer"
        to: "producer"
        message: "Envelope"
        action: >-
          Use DSSE v1.0 as the Envelope's format and its signing and verification protocol: the
          RECOMMENDED choice.
        guard: "default (RECOMMENDED)"
        locator: "§1"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0001"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "producer"
        to: "producer"
        message: "Envelope"
        action: >-
          Or use another signature method and format that meets ITE-5: it supports several
          signatures in one envelope (must); it carries an authenticated payload type, avoids
          depending on canonicalization for security and supports a key hint, a KEYID (should); it
          lets a verifier check signatures without first parsing the payload, and does not need the
          signature to name the signing algorithm (should not).
        guard: "the producer does not use DSSE (MAY)"
        locator: "§1"
        kind: "stated"
        note: >-
          §2 makes a signed payloadType mandatory for every Envelope, so the ITE-5 should on an
          authenticated payload type is in effect a must here (SD-2).
        constrained_by:
          - "in-toto-envelope-v1#R-0002"
          - "in-toto-envelope-v1#R-0003"
          - "in-toto-envelope-v1#R-0004"
          - "in-toto-envelope-v1#R-0005"
          - "in-toto-envelope-v1#R-0006"
          - "in-toto-envelope-v1#R-0007"
          - "in-toto-envelope-v1#R-0008"
          - "in-toto-envelope-v1#R-0043"
          - "in-toto-envelope-v1#R-0048"
        on_error: >-
          unspecified by source: no consequence is stated for a format that misses an ITE-5 property
        on_error_basis: "unspecified"
      - n: "3"
        from: "producer"
        to: "producer"
        message: "Envelope"
        action: >-
          Exclude any format or container that holds only one signature: it is not ITE-5 compliant
          even when it carries DSSE. §1.1 names the Sigstore Bundle and COSE_Sign1 as not compliant
          and COSE_Sign as compliant.
        guard: "the candidate format admits a single signature only"
        locator: "§1.1"
        kind: "stated"
        quotes:
          - source_lines: "21-22"
            quote: |-
              The [Sigstore Bundle], while [supporting DSSE], is not currently [ITE-5] compliant because it requires a _single signature_ in the envelope.[^1]
          - source_lines: "23-24"
            quote: |-
              The [COSE_Sign] structure is [ITE-5] compliant, whereas the `COSE_Sign1` format that supports only one signer is NOT compliant.
        constrained_by:
          - "in-toto-envelope-v1#R-0003"
          - "in-toto-envelope-v1#R-0030"
          - "in-toto-envelope-v1#R-0032"
          - "in-toto-envelope-v1#R-0033"
          - "in-toto-envelope-v1#R-0048"
        on_error: >-
          stated as a classification (not compliant); what a consumer does with an Envelope in such
          a format is unspecified by source
        on_error_basis: "stated"
      - n: "4"
        from: "producer"
        to: "producer"
        message: "Statement"
        action: >-
          Serialize the in-toto Statement that is to be signed; it becomes the payload. Under DSSE
          it is a JSON object whose _type field names its schema, carried base64-encoded (step 8).
          The Statement's content is statement.md's.
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "46-47"
            quote: |-
              This indicates that the Envelope contains a JSON object with a `_type` field specifying its schema.
        constrained_by:
          - "in-toto-envelope-v1#R-0012"
          - "in-toto-envelope-v1#R-0020"
          - "in-toto-envelope-v1#R-0039"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "producer"
        to: "producer"
        message: "Envelope"
        field: "payloadType"
        action: >-
          Set payloadType. For any Envelope it names an in-toto Statement and its serialization,
          application/vnd.in-toto+<encoding>. For DSSE it is
          application/vnd.in-toto.<predicate>+json, <predicate> being the predicate specification's
          file name without its extension, or application/vnd.in-toto+json. No predicate version
          goes in it. Only application/vnd.in-toto+json meets both the general and the DSSE rule
          (SD-1).
        guard: >-
          DSSE: predicate-specific or generic value; another format: the general form
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "42-43"
            quote: |-
              In addition, the Envelope spec has the following specific requirements for the standard [DSSE][DSSE v1.0] fields.
          - source_lines: "56-57"
            quote: |-
              The predicate version is not specified in the media type; it is handled in the [Statement] layer.
        constrained_by:
          - "in-toto-envelope-v1#R-0014"
          - "in-toto-envelope-v1#R-0015"
          - "in-toto-envelope-v1#R-0016"
          - "in-toto-envelope-v1#R-0038"
          - "in-toto-envelope-v1#R-0040"
          - "in-toto-envelope-v1#R-0041"
          - "in-toto-envelope-v1#R-0046"
        on_error: >-
          unspecified by source: nothing is said of a payloadType of neither form, or of a
          <predicate> that names no predicate specification (SD-1, SD-6)
        on_error_basis: "unspecified"
      - n: "6"
        from: "functionary"
        to: "functionary"
        message: "Envelope"
        field: "signatures"
        action: >-
          Each signing functionary signs payloadType together with the payload, by the envelope
          schema's method (DSSE v1.0's under DSSE, out of scope); how the signature bytes are
          encoded is the envelope schema's too. Several functionaries may sign one payload.
        locator: "§1, §2"
        kind: "stated"
        quotes:
          - source_lines: "32-33"
            quote: |-
              The encoding of the signature bytes is determined by the envelope schema.
        constrained_by:
          - "in-toto-envelope-v1#R-0013"
          - "in-toto-envelope-v1#R-0003"
          - "in-toto-envelope-v1#R-0037"
        on_error: "unspecified by source (a signing failure belongs to the envelope schema)"
        on_error_basis: "unspecified"
      - n: "7"
        from: "functionary"
        to: "producer"
        message: "Envelope"
        field: "signatures"
        action: >-
          Hand each signature, with the signing key's keyid, to the producer assembling the
          Envelope.
        locator: "§1, §3"
        kind: "inferred"
        inferred_reason: >-
          The source requires a format to hold several signatures in one envelope and has
          functionaries producing Envelopes, but never says how signatures made by several
          functionaries reach one Envelope (OI-03). When one functionary produces its own Envelope
          this step is internal to it.
        constrained_by:
          - "in-toto-envelope-v1#R-0003"
          - "in-toto-envelope-v1#R-0010"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from: "producer"
        to: "producer"
        message: "Envelope"
        action: >-
          Assemble the Envelope: signatures, an array of digital signatures (required); a keyid for
          each signing key used (should), which the envelope schema may nest inside the signature
          array; the payload (should be present; under DSSE a base64-encoded JSON Statement, must).
        locator: "§2"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0009"
          - "in-toto-envelope-v1#R-0010"
          - "in-toto-envelope-v1#R-0011"
          - "in-toto-envelope-v1#R-0012"
          - "in-toto-envelope-v1#R-0020"
          - "in-toto-envelope-v1#R-0035"
          - "in-toto-envelope-v1#R-0036"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
  - id: "F02"
    name: "name-and-store-envelope"
    title: "Naming and storing the Envelope for its consumers"
    locator: "§3, §4, §4.1"
    kind_of_flow: "hand-off"
    participants:
      - "producer"
      - "consumer"
      - "storage"
    summary: >-
      Inside a Bundle the Envelope follows bundle.md. Stored as a file by itself it takes the .json
      suffix and a name chosen by who will verify it: the step name for in-toto-verify, a name
      agreed with the consumer otherwise, plus the signing functionary's truncated KEYID when
      several functionaries produce Envelopes for one step. In an arbitrary storage system it is
      labelled application/vnd.in-toto.<predicate>+dsse.
    order_note: >-
      The source does not say whether §3 and §4 exclude each other: a file held in a storage system
      that labels objects could carry both a §3 name and the §4 media type (OI-06). The diagram
      draws them as alternatives. Step 5 applies on top of step 3 or step 4: its name is
      <step/env-name>.<keyid[0:8]>.json.
    steps:
      - n: "1"
        from: "producer"
        to: "storage"
        message: "Envelope"
        action: >-
          Store the Envelope inside a Bundle; the file-naming rules of §3 do not apply, and the
          Bundle's own rules (bundle.md) are out of scope.
        guard: "stored as part of a Bundle"
        locator: "§3"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0021"
        on_error: "out of scope here (bundle.md)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "producer"
        to: "producer"
        message: "Envelope file name"
        action: "Use the .json suffix."
        guard: "kept as a file of its own, outside any Bundle"
        locator: "§3"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0021"
        on_error: >-
          unspecified by source; an Envelope that is not JSON (COSE_Sign, for one) is given no
          suffix (SD-5)
        on_error_basis: "unspecified"
      - n: "3"
        from: "producer"
        to: "producer"
        message: "Envelope file name"
        action: "Name it <step-name>.json."
        guard: "for consumption by in-toto-verify, about supply chain step <step-name>"
        locator: "§3"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0022"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "producer"
        to: "consumer"
        message: "Envelope file name"
        action: >-
          The two sides may settle between themselves on any name of the form <env-name>.json. How
          and when they agree is not described; the agreement happens outside the Envelope
          (inferred).
        guard: "for other verifiers, or no step name can easily be determined"
        locator: "§3"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0023"
        on_error: >-
          unspecified by source: no default name exists where no agreement is made (OI-02)
        on_error_basis: "unspecified"
      - n: "5"
        from: "producer"
        to: "producer"
        message: "Envelope file name"
        action: >-
          Add the signing functionary's truncated KEYID: <step/env-name>.<keyid[0:8]>.json.
          keyid[0:8] is read here as the first eight characters of the KEYID (slice notation,
          inferred); KEYID itself is the in-toto specification v1.0's (§4.2.1, out of scope).
        guard: >-
          one step has Envelopes from more than one functionary, each known by its public key
        locator: "§3"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0024"
          - "in-toto-envelope-v1#R-0049"
        on_error: >-
          unspecified by source: no name is given for one Envelope signed by several functionaries,
          nor for one without a keyid (SD-9)
        on_error_basis: "unspecified"
      - n: "6"
        from: "producer"
        to: "storage"
        message: "Envelope"
        action: "Write the Envelope as that dedicated file."
        guard: "kept as a file of its own, outside any Bundle"
        locator: "§3"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0021"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "7"
        from: "producer"
        to: "storage"
        message: "Storage media type"
        action: >-
          Label the Envelope application/vnd.in-toto.<predicate>+dsse, <predicate> being the
          predicate specification's file name without its extension; no predicate version goes in
          it. §4.1 gives three examples: provenance (SLSA Provenance), spdx and vsa.
        guard: "held in an arbitrary storage system"
        locator: "§4, §4.1"
        kind: "stated"
        note: >-
          The §4.1 lead-in (quoted) uses single in the sense of L79's individual attestation, not of
          §1.1's single signature (inferred reading); a single-signature Envelope would not be ITE-5
          compliant.
        quotes:
          - source_lines: "82-83"
            quote: |-
              Predicate versioning is handled in the [Statement] layer.
          - source_lines: "92"
            quote: |-
              Example media types for single DSSE-signed attestation predicates include:
          - source_lines: "94"
            quote: |-
              SLSA Provenance: `application/vnd.in-toto.provenance+dsse`
          - source_lines: "95"
            quote: |-
              SPDX: `application/vnd.in-toto.spdx+dsse`
          - source_lines: "96"
            quote: |-
              VSA: `application/vnd.in-toto.vsa+dsse`
        constrained_by:
          - "in-toto-envelope-v1#R-0025"
          - "in-toto-envelope-v1#R-0026"
          - "in-toto-envelope-v1#R-0042"
          - "in-toto-envelope-v1#R-0046"
        on_error: >-
          unspecified by source: the media type exists only for DSSE (+dsse) and only with a
          <predicate>; a non-DSSE Envelope, or one whose predicate has no specification file, gets
          none (SD-5, SD-6)
        on_error_basis: "unspecified"
  - id: "F03"
    name: "consume-envelope"
    title: "Consuming an Envelope: obtaining authenticated predicate information"
    locator: "§1, §2, §4"
    kind_of_flow: "local-procedure"
    participants:
      - "storage"
      - "consumer"
    summary: >-
      The consumer finds the Envelope by name or media type, treats no media type as a faithful
      indicator of the predicate type, verifies the payload against the Envelope's signatures by the
      envelope schema's method, parses the payload, and takes the predicate type from the
      Statement's predicateType alone. Only predicate information obtained by parsing and verifying
      is authenticated.
    order_note: >-
      The source fixes no order between parse and verify (SD-3). Its sentence names parse first; §1
      asks a format not to require parsing the payload before verifying. Steps 3 and 4 are
      verify-then-parse, an order this model chose (inferred): it meets the sentence, which requires
      both, and it is the order §1's property keeps open for every compliant format. Getting the
      signed bytes out of the Envelope for verification belongs to the envelope schema's
      verification (DSSE v1.0) either way. The source states the consumer rules only under its two
      media-type rules (SD-11); the model applies them to every Envelope consumed (inferred).
    steps:
      - n: "1"
        from: "storage"
        to: "consumer"
        message: "Envelope"
        action: >-
          Obtain the Envelope: by the file names of F02 (in-toto-verify looks for the step name,
          with the KEYID suffix where several functionaries produced Envelopes) or by the storage
          media type.
        locator: "§3, §4"
        kind: "inferred"
        inferred_reason: >-
          The source defines the names (§3) and a media type to denote an individual attestation
          (§4), for consumers it names, but never describes how a consumer finds an Envelope.
        constrained_by:
          - "in-toto-envelope-v1#R-0022"
          - "in-toto-envelope-v1#R-0023"
          - "in-toto-envelope-v1#R-0024"
          - "in-toto-envelope-v1#R-0025"
        on_error: "unspecified by source (no Envelope found, or several candidates)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "consumer"
        to: "consumer"
        message: "Envelope"
        action: >-
          Do not rely on a media type for the predicate type (should not): neither the
          predicate-specific payloadType (§2) nor the storage media type (§4) is a faithful
          indicator of it. A media type may still pick out candidate Envelopes (inferred); it
          decides nothing.
        locator: "§2, §4"
        kind: "stated"
        note: >-
          §2 nests this rule under the predicate-specific payloadType, yet names its object in the
          same words as §4 (the two quoted phrases); the model applies it to both media types.
          payloadType is signed with the payload (F01.6) and verified in step 3, so afterwards it is
          authenticated, and it is still not to be relied on for the predicate type.
        quotes:
          - source_lines: "51"
            quote: |-
              the media type for individual attestations
          - source_lines: "84"
            quote: |-
              the media type for individual attestations
        constrained_by:
          - "in-toto-envelope-v1#R-0017"
          - "in-toto-envelope-v1#R-0027"
        on_error: >-
          none: a restriction on what the consumer relies on; no consequence of breaking it is
          stated
        on_error_basis: "none"
      - n: "3"
        from: "consumer"
        to: "consumer"
        message: "Envelope"
        field: "signatures"
        action: >-
          Verify the payload against the Envelope's signatures, by the envelope schema's
          verification (DSSE v1.0's under DSSE, out of scope). payloadType is signed with the
          payload, so it is covered too. The keyid is only a hint for choosing a key, and the
          signature need not name the algorithm, so key and algorithm come from the consumer's own
          knowledge of the signer (inferred).
        guard: "before step 4 (this model's order, SD-3)"
        locator: "§1, §2, §4"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0019"
          - "in-toto-envelope-v1#R-0029"
          - "in-toto-envelope-v1#R-0013"
          - "in-toto-envelope-v1#R-0007"
          - "in-toto-envelope-v1#R-0006"
          - "in-toto-envelope-v1#R-0008"
          - "in-toto-envelope-v1#R-0044"
          - "in-toto-envelope-v1#R-0045"
        on_error: >-
          inferred: predicate information from an Envelope that does not verify is not authenticated
          (the contrapositive of in-toto-envelope-v1#R-0019 and in-toto-envelope-v1#R-0029).
          Rejecting it, retrying with another key, and how many of several signatures must verify
          are unspecified by source (OI-01).
        on_error_basis: "inferred"
      - n: "4"
        from: "consumer"
        to: "consumer"
        message: "Statement"
        field: "payload"
        action: >-
          Parse the payload: under DSSE, base64-decode it and read the JSON Statement.
        guard: "after step 3 succeeds (this model's order, SD-3)"
        locator: "§2, §4"
        kind: "stated"
        constrained_by:
          - "in-toto-envelope-v1#R-0019"
          - "in-toto-envelope-v1#R-0029"
          - "in-toto-envelope-v1#R-0020"
          - "in-toto-envelope-v1#R-0050"
        on_error: >-
          unspecified by source: a payload that is absent (allowed outside DSSE by a should), not
          base64, not JSON or not a Statement has no stated outcome (OI-04)
        on_error_basis: "unspecified"
      - n: "5"
        from: "consumer"
        to: "consumer"
        message: "Statement"
        action: >-
          Take the predicate type from the Statement's predicateType field and from nothing else
          (should), and the predicate version from the Statement layer. Predicate information
          obtained through steps 3 and 4 is authenticated.
        locator: "§2, §4"
        kind: "stated"
        quotes:
          - source_lines: "54"
            quote: |-
              To obtain predicate information that is authenticated,
          - source_lines: "56-57"
            quote: |-
              The predicate version is not specified in the media type; it is handled in the [Statement] layer.
          - source_lines: "82-83"
            quote: |-
              Predicate versioning is handled in the [Statement] layer.
        constrained_by:
          - "in-toto-envelope-v1#R-0018"
          - "in-toto-envelope-v1#R-0028"
          - "in-toto-envelope-v1#R-0019"
          - "in-toto-envelope-v1#R-0029"
          - "in-toto-envelope-v1#R-0041"
          - "in-toto-envelope-v1#R-0042"
          - "in-toto-envelope-v1#R-0047"
        on_error: >-
          stated in part: where a media type and predicateType disagree, predicateType is what the
          consumer relies on; whether the disagreement makes the Envelope unacceptable is
          unspecified by source (OI-05)
        on_error_basis: "stated"
error_paths:
  - id: "EP-01"
    condition: >-
      The format or container holds only one signature (Sigstore Bundle, COSE_Sign1).
    steps:
      - "F01.3"
    basis: "stated"
    outcome: >-
      Not ITE-5 compliant, so not a permitted alternative; a consumer's handling is unspecified.
  - id: "EP-02"
    condition: "An alternative format misses another ITE-5 property."
    steps:
      - "F01.2"
    basis: "unspecified"
    outcome: >-
      No consequence stated; a format without an authenticated payload type also breaks §2 (SD-2).
  - id: "EP-03"
    condition: >-
      payloadType has neither required form, or the predicate-specific DSSE form, which breaks the
      general form.
    steps:
      - "F01.5"
    basis: "unspecified"
    see:
      - "SD-1"
    outcome: "No consequence stated."
  - id: "EP-04"
    condition: "The predicate has no specification file to take <predicate> from."
    steps:
      - "F01.5"
      - "F02.7"
    basis: "unspecified"
    see:
      - "SD-6"
    outcome: >-
      Only the generic payloadType remains, and no storage media type can be formed.
  - id: "EP-05"
    condition: "No step name can be determined and no file name has been agreed."
    steps:
      - "F02.4"
    basis: "unspecified"
    see:
      - "OI-02"
    outcome: "No default name."
  - id: "EP-06"
    condition: >-
      One Envelope carries several functionaries' signatures, or no keyid, where a KEYID suffix is
      called for.
    steps:
      - "F02.5"
    basis: "unspecified"
    see:
      - "SD-9"
    outcome: "No name stated."
  - id: "EP-07"
    condition: >-
      A non-DSSE Envelope (COSE_Sign, for one) is stored as a file or in a storage system.
    steps:
      - "F02.2"
      - "F02.7"
    basis: "unspecified"
    see:
      - "SD-5"
    outcome: "No suffix and no media type stated."
  - id: "EP-08"
    condition: >-
      The consumer finds no Envelope, or several, under the expected name or media type.
    steps:
      - "F03.1"
    basis: "unspecified"
    outcome: "Not addressed; the lookup step itself is inferred."
  - id: "EP-09"
    condition: "Verification fails, or only some of several signatures verify."
    steps:
      - "F03.3"
    basis: "inferred"
    see:
      - "OI-01"
    outcome: >-
      The predicate information is not authenticated (inferred); rejection, retry and thresholds are
      unspecified.
  - id: "EP-10"
    condition: "The payload is absent, not base64, not JSON, or not a Statement."
    steps:
      - "F03.4"
    basis: "unspecified"
    see:
      - "OI-04"
    outcome: "No outcome stated; under DSSE each case breaks a producer-side must."
  - id: "EP-11"
    condition: "A media type and the Statement's predicateType disagree."
    steps:
      - "F03.2"
      - "F03.5"
    basis: "stated"
    see:
      - "OI-05"
    outcome: >-
      The consumer relies on predicateType; whether the Envelope is then unacceptable is
      unspecified.
source_defects_note: >-
  Canonical ids of normative.md's Source defects section, which holds the crosswalk; pass 2
  renamed this file's pass-1 ids: SD-01 to SD-03 are SD-1 to SD-3, SD-04 is SD-5, SD-05 SD-6,
  SD-06 SD-9 and SD-07 SD-11.
source_defects:
  - id: "SD-1"
    class: "contradiction"
    title: >-
      The DSSE predicate-specific payloadType does not have the form every payloadType must take
    locators:
      - "§2 (L28-29, L39-40, L42-43, L45-46)"
    quotes:
      - source_lines: "28-29"
        quote: |-
          The in-toto Attestation Framework has the following general field requirements for an Envelope:
      - source_lines: "39-40"
        quote: |-
          It MUST take the form `application/vnd.in-toto+<encoding>` to indicate an in-toto [Statement] payload and its serialized `<encoding>` format.
      - source_lines: "42-43"
        quote: |-
          In addition, the Envelope spec has the following specific requirements for the standard [DSSE][DSSE v1.0] fields.
      - source_lines: "45-46"
        quote: |-
          `payloadType` MUST be set to `application/vnd.in-toto.<predicate>+json` or to `application/vnd.in-toto+json`.
    description: >-
      The general field requirements, which apply to every Envelope, require payloadType to take the
      form application/vnd.in-toto+<encoding>. The DSSE requirements apply in addition and allow
      application/vnd.in-toto.<predicate>+json, which puts .<predicate> before the plus sign and so
      is not of that form.
    consequence: >-
      As written, a DSSE Envelope with a predicate-specific payloadType breaks
      in-toto-envelope-v1#R-0014; only application/vnd.in-toto+json meets both rules, and a
      validator enforcing both rejects every predicate-specific DSSE Envelope.
    modelled_as: "F01.5 lists both DSSE values and marks the conflict; EP-03."
  - id: "SD-2"
    class: "tension"
    title: >-
      An authenticated payload type is a should under ITE-5 and a must for every Envelope
    locators:
      - "§1 (L9-10, L13)"
      - "§2 (L28-29, L38)"
    quotes:
      - source_lines: "13"
        quote: |-
          SHOULD include an authenticated payload type
      - source_lines: "38"
        quote: |-
          `payloadType` (or equivalent) MUST be signed along with the `payload`.
    description: >-
      §1 admits other formats that meet ITE-5, and one ITE-5 property, held only as a should, is an
      authenticated payload type. §2's general field requirements make a signed payloadType
      mandatory for every Envelope.
    consequence: >-
      A format that meets ITE-5 while omitting an authenticated payload type cannot carry a
      conforming in-toto Envelope; the should is in effect a must. Not a contradiction, since
      meeting the must meets the should.
    modelled_as: "F01.2 note; EP-02."
  - id: "SD-3"
    class: "tension"
    title: >-
      The consumer sentence orders parse before verify; §1 asks formats not to require that
    locators:
      - "§1 (L16)"
      - "§2 (L54-55)"
      - "§4 (L87-88)"
    quotes:
      - source_lines: "16"
        quote: |-
          SHOULD NOT require the verifier to parse the payload before verifying
      - source_lines: "54-55"
        quote: |-
          To obtain predicate information that is authenticated, consumers MUST parse the Envelope's `payload`, and verify it against its `signatures`.
      - source_lines: "87-88"
        quote: |-
          To obtain predicate information that is authenticated, consumers MUST parse the Envelope's `payload`, and verify it against its `signatures`.
    description: >-
      The consumer obligation, stated twice, joins parsing and verifying with a plain and, names
      parsing first, and fixes no order. §1's property asks that a format not make the verifier
      parse the payload ahead of verification. No other sentence orders the two: before occurs once
      in the source, here at L16, and after, then and first not at all.
    consequence: >-
      Read as a sequence, the consumer rule asks for the order §1's property exists to make
      unnecessary. Read as two obligations, it allows either order, and the source does not say
      which a consumer should use.
    modelled_as: "F03 order_note; F03.3 verifies, F03.4 parses after it (inferred order)."
  - id: "SD-5"
    class: "gap"
    title: "Non-DSSE Envelopes have no file suffix and no storage media type"
    locators:
      - "§1.1 (L23-24)"
      - "§3 (L62-63)"
      - "§4 (L78-79)"
    quotes:
      - source_lines: "23-24"
        quote: |-
          The [COSE_Sign] structure is [ITE-5] compliant, whereas the `COSE_Sign1` format that supports only one signer is NOT compliant.
      - source_lines: "62-63"
        quote: |-
          If stored in a dedicated file by itself, and not as part of a [Bundle], an Envelope SHOULD use the suffix `.json`.
      - source_lines: "78-79"
        quote: |-
          The media type `application/vnd.in-toto.<predicate>+dsse` SHOULD be used to denote an individual attestation in arbitrary storage systems.
    description: >-
      §1 and §1.1 admit ITE-5 compliant formats other than DSSE and name COSE_Sign as one. §3's
      suffix is .json and §4's media type ends in +dsse, so both assume a DSSE JSON Envelope;
      nothing names or labels a COSE_Sign Envelope.
    consequence: >-
      A producer using a permitted alternative format can meet neither §3 nor §4.
    modelled_as: "F02.2 and F02.7 on_error; EP-07."
  - id: "SD-6"
    class: "gap"
    title: >-
      <predicate> exists only for predicates with a specification file in the in-toto repository
    locators:
      - "§2 (L49-50)"
      - "§4 (L81-82)"
      - "link definitions (L109)"
    quotes:
      - source_lines: "49-50"
        quote: |-
          `<predicate>` MUST match the [predicate specification filename] without the file extension.
      - source_lines: "81-82"
        quote: |-
          The `<predicate>` MUST match the [predicate specification filename] without the file extension.
      - source_lines: "109"
        quote: |-
          [predicate specification filename]: ../predicates
    description: >-
      Both media types take <predicate> from the predicate specification's file name, and the link
      for that term points at a predicates directory beside the specification in the in-toto
      attestation repository (../predicates). On that reading a predicate specified anywhere else
      has no such file. §4 gives no generic storage media type without a <predicate>.
    consequence: >-
      For such a predicate a producer can meet the payloadType rule only with
      application/vnd.in-toto+json, and cannot meet §4's should at all.
    modelled_as: "F01.5 and F02.7 on_error; EP-04."
  - id: "SD-9"
    class: "gap"
    title: >-
      The KEYID naming rule assumes one signer per Envelope and a keyid present
    locators:
      - "§1 (L12)"
      - "§2 (L34)"
      - "§3 (L71-74)"
    quotes:
      - source_lines: "12"
        quote: |-
          MUST support the inclusion of multiple signatures in a single envelope
      - source_lines: "34"
        quote: |-
          A `keyid` (or equivalent) SHOULD be included for each signing key used.
      - source_lines: "73-74"
        quote: |-
          the truncated [KEYID] of the public key `<keyid[0:8]>` of the signing functionary: `<step/env-name>.<keyid[0:8]>.json`.
    description: >-
      The suffix is the truncated KEYID of the signing functionary, singular, and covers several
      Envelopes for one step, one per functionary. Formats must support several signatures in one
      Envelope, and keyid is only a should.
    consequence: >-
      An Envelope signed by several functionaries, or carrying no keyid, has no stated name under
      the rule that would otherwise apply.
    modelled_as: "F02.5 on_error; EP-06."
  - id: "SD-11"
    class: "scope"
    title: "The consumer rules are stated only under the two media-type rules"
    locators:
      - "§2 (L45-57)"
      - "§4 (L78-88)"
    quotes:
      - source_lines: "47-48"
        quote: |-
          If the predicate-specific media type is used, the following requirements apply:
    description: >-
      §2's copies of the consumer rules (in-toto-envelope-v1#R-0017, in-toto-envelope-v1#R-0018,
      in-toto-envelope-v1#R-0019) are nested under the payloadType rule, after the condition quoted
      here; §4's copies (in-toto-envelope-v1#R-0027, in-toto-envelope-v1#R-0028,
      in-toto-envelope-v1#R-0029) are bullets of the storage media type rule. No sentence states
      them for consumers in general.
    consequence: >-
      Taken literally, an Envelope with the generic payloadType held as a plain file arguably falls
      under neither copy, so the consumer's obligation to parse and verify would not bind its
      consumption.
    modelled_as: >-
      F03 applies the consumer rules to every Envelope consumed (inferred, F03 order_note).
open_issues:
  - id: "OI-01"
    locator: "§2, §4"
    text: >-
      What a consumer does when verification fails, or when only some of several signatures verify.
      No threshold, no key-trust rule and no rejection is stated; the trust policy belongs to the
      verifier and lies outside this source.
  - id: "OI-02"
    locator: "§3"
    text: >-
      How producer and consumer agree an arbitrary file name, and what name applies when they have
      not.
  - id: "OI-03"
    locator: "§1, §3"
    text: >-
      How signatures from several functionaries reach one Envelope, and whether a step with several
      functionaries should yield one multi-signature Envelope (§1) or one Envelope per functionary
      (§3). Source defect SD-9.
  - id: "OI-04"
    locator: "§2"
    text: >-
      Outside DSSE the payload is only a should, yet the consumer rule calls for parsing it; a
      detached payload has no stated handling. Source defect SD-14.
  - id: "OI-05"
    locator: "§2, §4"
    text: >-
      Whether a media type that disagrees with the Statement's predicateType makes the Envelope
      unacceptable, or is merely ignored.
  - id: "OI-06"
    locator: "§3, §4"
    text: >-
      Whether §3's file name and §4's media type are alternatives or can both apply to one Envelope.
  - id: "OI-07"
    locator: "§1, §2"
    text: >-
      Where the consumer's verification key and algorithm come from: keyid is a hint, and the
      signature need not name the algorithm, so both come from outside the Envelope by means the
      source does not describe.
out_of_scope:
  - text: >-
      DSSE v1.0: the envelope's encoding, the bytes that are signed, signing, verification and the
      meaning of its keyid. The source names DSSE the recommended format and protocol and defines
      none of it.
    locator: "§1 (L8, L102)"
  - text: >-
      ITE-5 itself: §1 lists six properties that meeting it involves; ITE-5's own text is not held.
    locator: "§1 (L9-10, L103)"
  - text: >-
      The Statement layer (statement.md): `_type`, `predicateType`, the predicate and its version.
    locator: "§2, §4 (L46-47, L53, L56-57, L82-83, L106)"
  - text: "The Bundle (bundle.md) and storage of an Envelope inside one."
    locator: "§3 (L62, L100)"
  - text: >-
      KEYID and key formats (in-toto specification v1.0 §4.2.1) and what a functionary is (§2.1.2).
    locator: "§3 (L73, L104, L108)"
  - text: "How in-toto-verify looks Envelopes up and verifies them."
    locator: "§3 (L65, L107)"
  - text: >-
      The Sigstore Bundle, COSE_Sign and COSE_Sign1 structures (RFC 8152 §4.1), and the footnoted
      Sigstore discussion of DSSE signature extensions (informative).
    locator: "§1.1 (L21-24, L98, L101, L105)"
  - text: >-
      Key distribution, trust in a functionary's key, signature thresholds, and any policy for
      accepting an attestation: defined nowhere in the source.
    locator: "whole source"
coverage: >-
  4 roles (1 kind inferred: storage), 3 flows, 20 steps (2 kind inferred: F01.7, F03.1), 11 error
  paths, 7 source defects, 7 open issues, 8 out-of-scope items, counted by script over this file's
  data. constrained_by holds 73 links to 48 distinct ids (pass 1 held 50 links to the 29
  skeleton ids; pass 2 wired the ids the requirements lane appended): every requirement but
  R-0031, whose halves R-0032 and R-0033 are cited, and R-0034, the scope of §2's general rules,
  which SD-1 quotes. 45 quotations, every one checked by bin/check-quotes. Quoted spans that carry
  no requirement id, found by script: L92 (the §4.1 lead-in), L94, L95 and L96 (its examples) and
  L109 (a link definition).
