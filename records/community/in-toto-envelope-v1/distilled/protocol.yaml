applicability: >-
  APPLICABLE, as a store-and-forward hand-off between two named roles, not as an exchange. Counted
  over the 110 lines as whole words, case-insensitively, by script: exchange, request, response,
  send, receive, message, client, server, party, role, error, fail, failure, reject and invalid
  occur 0 times each; protocol occurs once (L8), recommending DSSE v1.0 for both the Envelope's
  format and its protocol. What the source does define: producers (L9, L69) build an Envelope, have
  its payload and payloadType signed, and name it as a file (§3) or label it with a media type in a
  storage system (§4); consumers (L51-55, L69, L84-88) should not take the predicate type from a
  media type, and must parse and verify the payload to obtain authenticated predicate information;
  and the two may agree a file name between them (L68-70), the only coordination in the document.
  Three flows model that: F01 produce, F02 name and store, F03 consume. DSSE's own encoding, signing
  and verification appear only as opaque steps (out_of_scope). Because the source names no error
  path, each on_error is a stated consequence, a reading marked inferred, or unspecified.
