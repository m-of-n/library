    testable: 'partial'
    testable_reason: 'that the consumer acts on predicateType is observable with a mismatched vector; rejection is prescribed neither way.'
    note: 'Applies to §4 as well as §2. Test vector: a payloadType or storage media type naming one predicate, a Statement whose predicateType names another.'
  - id: 'in-toto-envelope-v1#R-0048'
    locator: '§1'
    text: 'A producer that does not use DSSE (R-0001) is within R-0002 only with a format that meets ITE-5. §1.1 applies the multiple-signature criterion (R-0003): the Sigstore Bundle (R-0030) and COSE_Sign1 (R-0033) fail it, and COSE_Sign (R-0032) is called compliant. No sentence forbids a format outside both R-0001 and R-0002, or tells a consumer what to do with an envelope in one.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0001 L8; R-0002 L9-10; R-0003 L12; R-0030 L21-22; R-0031 L23-24'
    actor: 'producer; consumer'
    object: 'choice of envelope format'
    field: 'envelope schema: DSSE, or a format meeting ITE-5'
    testable: 'partial'
    testable_reason: 'the classification of a given format is decidable by R-0003; the consequence for a producer, beyond departing from a recommendation, and for a consumer is not stated (SD-7).'
    note: 'The only rule such a producer departs from in terms is the RECOMMENDED of R-0001: SD-7.'
  - id: 'in-toto-envelope-v1#R-0049'
    locator: '§3'
    text: 'The <keyid[0:8]> in the R-0024 file name is the [KEYID] of the signing functionary''s public key, as the in-toto specification linked at L104 defines it, cut to its first eight characters. It is not necessarily the keyid hint the Envelope carries (R-0010), which this source never ties to [KEYID].'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0024 L71-74; L104 (link definition of [KEYID]); R-0010 L34'
    actor: 'producer (signing functionary)'
    object: 'Envelope file'
    field: '<keyid[0:8]>'
    testable: 'partial'
    testable_reason: 'needs the KEYID definition of the in-toto specification, outside this source; [0:8] is undefined here and read as slice notation.'
    note: '[0:8] read as characters 0 to 7 of the KEYID as written; whether that is eight hexadecimal characters or eight bytes depends on the KEYID definition, outside this source.'
  - id: 'in-toto-envelope-v1#R-0050'
    locator: '§2'
    text: 'The rules on payloadType and payload (R-0014, R-0015, R-0020, R-0039) bind the producer. The source gives a consumer no rule for an envelope that breaks them, such as a payloadType outside the values of R-0015 or a payload that does not decode to a JSON Statement, beyond what R-0019 implies: predicate information can come only from a payload the consumer has parsed as a Statement and verified.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0014 L39-40; R-0015 L45-46; R-0020 L58; R-0039 L46-47; R-0019 L54-55'
    actor: 'consumer'
    object: 'Envelope that breaks a producer rule'
    field: 'payloadType; payload'
    testable: 'partial'
    testable_reason: 'only the consequence through R-0019 is observable, that no authenticated predicate information comes from such an envelope; whether the consumer rejects it, ignores it or reports it is not prescribed.'
    note: 'Negative vectors without a prescribed outcome: a payloadType of another media type, a payload that is not base64, base64 of something other than a JSON object with a _type field.'
