  - id: 'in-toto-envelope-v1#R-0043'
    locator: '§2'
    text: 'An Envelope carries a payloadType or its equivalent. No sentence makes it required the way R-0035 makes signatures required, but R-0013 has it signed along with the payload and R-0014 fixes its form, and an envelope without one can meet neither; for DSSE, R-0015 sets its value.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0013 L38; R-0014 L39-40; R-0015 L45-46; R-0035 L31 (contrast)'
    actor: 'producer'
    object: 'Envelope'
    field: 'payloadType (or equivalent): present'
