  - id: 'in-toto-envelope-v1#R-0044'
    locator: '§2'
    text: 'A consumer''s signature check covers payloadType as well as payload: an envelope whose payloadType is not the one that was signed fails verification and yields no authenticated predicate information (R-0019).'
    verb: 'none'
    kind: inferred
