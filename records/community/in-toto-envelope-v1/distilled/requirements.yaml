    object: 'Envelope signature verification'
    field: 'payloadType; payload; signatures'
    testable: 'yes'
    note: 'R-0013 binds the producer; signing payloadType protects nothing unless the verifier checks it, and the source states no verifier-side rule for payloadType. How payloadType and payload enter the signature input is the schema''s (for DSSE, outside this source). Negative vector: change payloadType, keep payload and signatures.'
  - id: 'in-toto-envelope-v1#R-0045'
    locator: '§2'
    text: 'Verifying an envelope against its signatures (R-0019, R-0029) needs at least one of them to verify over the payload and payloadType as received; an envelope with an empty signatures array, which R-0036 does not forbid, authenticates nothing. Whether one verifying signature suffices, or all or some threshold must verify, and against which public keys, the source does not say; keyid is only a hint to which key was used (R-0006, R-0010).'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0019 L54-55; R-0029 L87-88; R-0036 L31-32; R-0003 L12; R-0006 L15; R-0010 L34; preamble L3-4'
    actor: 'consumer'
    object: 'Envelope signature verification'
    field: 'signatures: how many must verify; keyid: a hint only'
    testable: 'partial'
    testable_reason: 'the empty-array and no-signature-verifies cases are testable (no authenticated predicate information may result); the acceptance rule for several signatures and the set of trusted keys are the consumer''s policy, which the source leaves open.'
    note: 'The Envelope is the layer that handles authentication via digital signatures (L3-4); R-0003 makes several signatures normal, which is why the missing acceptance rule matters. DSSE''s own verification protocol (R-0001) is outside this source.'
  - id: 'in-toto-envelope-v1#R-0046'
    locator: '§2'
    text: 'A producer using a predicate-specific media type, the first value of R-0015 or the storage media type of R-0025, sets <predicate> to the filename, without extension, of the specification of the predicate its Statement carries, the one its predicateType names. R-0016 and R-0026 say only that <predicate> must match the predicate specification filename, not which predicate''s.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0016 L49-50; R-0026 L81-82; R-0015 L45-46; R-0025 L78-79; R-0018 L52-53'
    actor: 'producer (or storing client, for R-0025)'
    object: 'payloadType; storage media type'
    field: '<predicate>'
    testable: 'partial'
    testable_reason: 'needs the mapping from a predicateType to its predicate specification filename, which lies in the predicates directory (L109) and the Statement layer, outside this source.'
    note: 'Applies to §4 as well as §2. Read otherwise, any predicate specification filename satisfies R-0016 for any Statement, and the consumer rules R-0017 and R-0027 are the only guard against a mismatch (R-0047).'
  - id: 'in-toto-envelope-v1#R-0047'
    locator: '§2'
    text: 'Where the <predicate> of a media type and the Statement''s predicateType disagree, a consumer following R-0018 and R-0028 acts on predicateType. The source does not make the disagreement an error, so whether to reject such an envelope is the consumer''s choice.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0017 L51-52; R-0018 L52-53; R-0027 L84-85; R-0028 L85-86'
    actor: 'consumer'
    object: 'payloadType or storage media type, against the Statement''s predicateType'
