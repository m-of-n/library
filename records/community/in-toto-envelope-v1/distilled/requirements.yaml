requirements:
  - id: 'in-toto-envelope-v1#R-0001'
    locator: '§1'
    source_lines: '8'
    text: 'The RECOMMENDED format and protocol for Envelopes are defined per [DSSE v1.0].'
    verb: 'RECOMMENDED'
    kind: stated
    actor: 'producer (format of the envelope it signs) and consumer (protocol it verifies by); attributed, the sentence names no actor'
    object: 'Envelope'
    field: 'envelope format and protocol: DSSE v1.0'
    testable: 'yes'
    note: 'The link definition at L102 points [DSSE v1.0] at the v1.0.2 ref of the DSSE repository''s envelope.md; what a DSSE envelope is and how it is signed and verified are defined there, outside this source, and a test of this entry applies DSSE''s own rules. RECOMMENDED, not required: R-0002 permits formats that meet ITE-5 instead (R-0048).'
  - id: 'in-toto-envelope-v1#R-0002'
    locator: '§1'
    source_lines: '9-10'
    text: 'Producers MAY use other signature methods and formats that meet the [ITE-5] specification:'
    verb: 'MAY'
    kind: stated
    actor: 'producer'
    object: 'Envelope'
    field: 'signature method and envelope format other than DSSE'
    testable: 'partial'
    testable_reason: 'a permission; what can be tested is its condition, that the format meets ITE-5: the six criteria the colon leads into (R-0003 to R-0008) and the ITE-5 text itself, which is outside this source.'
    note: 'The list at L12-17 is read as the ITE-5 criteria: its items have no subject of their own. §1.1 names two formats that fail the multiple-signature criterion (R-0030, R-0033) and calls one compliant by contrast (R-0032). A format that meets neither R-0001 nor this condition is not forbidden in terms, and no consumer rule covers it: SD-7, R-0048. [ITE-5] links a moving branch (L103): SD-12.'
  - id: 'in-toto-envelope-v1#R-0003'
    locator: '§1'
    source_lines: '12'
    text: '- MUST support the inclusion of multiple signatures in a single envelope'
    verb: 'MUST'
    kind: stated
    actor: 'alternative envelope format (attributed: the item has no subject; it qualifies the non-DSSE methods and formats that R-0002 permits)'
    object: 'envelope format definition (ITE-5 criterion)'
    field: 'signatures: two or more in one envelope'
    testable: 'yes'
    note: 'Decidable from the format''s definition: does it admit more than one signature in one envelope. §1.1 decides the Sigstore Bundle (R-0030) and COSE_Sign1 (R-0033) on this criterion and calls COSE_Sign compliant in contrast (R-0032). A criterion on a format, not on an envelope instance: an envelope holding one signature does not breach it. Its general-rule counterpart is R-0036.'
  - id: 'in-toto-envelope-v1#R-0004'
    locator: '§1'
    source_lines: '13'
    text: '- SHOULD include an authenticated payload type'
    verb: 'SHOULD'
    kind: stated
    actor: 'alternative envelope format (attributed: the item has no subject; it qualifies the non-DSSE methods and formats that R-0002 permits)'
    object: 'envelope format definition (ITE-5 criterion)'
    field: 'payload type covered by the signature'
    testable: 'yes'
    note: 'Decidable from the format''s definition: does it carry a payload type, and do its signatures cover it. §2 makes the same property a MUST for every envelope (R-0013), so a format that takes this SHOULD''s latitude meets ITE-5 and still cannot carry an in-toto Envelope: SD-2.'
  - id: 'in-toto-envelope-v1#R-0005'
    locator: '§1'
    source_lines: '14'
    text: '- SHOULD avoid depending on canonicalization for security'
    verb: 'SHOULD'
    kind: stated
    actor: 'alternative envelope format (attributed: the item has no subject; it qualifies the non-DSSE methods and formats that R-0002 permits)'
    object: 'envelope format definition (ITE-5 criterion)'
    field: 'signature input: no dependence on canonicalization'
    testable: 'partial'
    testable_reason: 'a property of the format''s design, judged by review of how its signature input is formed; the source does not define when a format depends on canonicalization for its security, nor give a test.'
    note: 'How DSSE forms its signature input is outside this source.'
  - id: 'in-toto-envelope-v1#R-0006'
    locator: '§1'
    source_lines: '15'
    text: '- SHOULD support a hint indicating what signing key was used, i.e., a KEYID'
    verb: 'SHOULD'
    kind: stated
    actor: 'alternative envelope format (attributed: the item has no subject; it qualifies the non-DSSE methods and formats that R-0002 permits)'
    object: 'envelope format definition (ITE-5 criterion)'
    field: 'key hint (KEYID)'
    testable: 'yes'
    note: 'Decidable from the format''s definition: does it carry a key identifier. A hint: nothing in the source makes it authenticated or decisive (R-0045). Its §2 counterpart is R-0010. KEYID here is plain text; the [KEYID] link of L73 points at the in-toto v1.0 key formats (L104).'
  - id: 'in-toto-envelope-v1#R-0007'
    locator: '§1'
    source_lines: '16'
    text: '- SHOULD NOT require the verifier to parse the payload before verifying'
    verb: 'SHOULD NOT'
    kind: stated
    actor: 'alternative envelope format (attributed: the item has no subject; it qualifies the non-DSSE methods and formats that R-0002 permits)'
    object: 'envelope format definition (ITE-5 criterion)'
    field: 'verification procedure: signature check without first parsing the payload'
    testable: 'partial'
    testable_reason: 'a property of the format''s verification procedure, judged by review; it can be exercised by giving a verifier of the format a validly signed envelope whose payload does not parse, and checking that it still reaches a signature verdict.'
    note: 'The consumer rules R-0019 and R-0029 name parsing first and verifying second and state no order: SD-3.'
  - id: 'in-toto-envelope-v1#R-0008'
    locator: '§1'
    source_lines: '17'
    text: '- SHOULD NOT require the inclusion of signing key algorithms in the signature'
    verb: 'SHOULD NOT'
    kind: stated
    actor: 'alternative envelope format (attributed: the item has no subject; it qualifies the non-DSSE methods and formats that R-0002 permits)'
    object: 'envelope format definition (ITE-5 criterion)'
    field: 'signature: no mandatory signing-key algorithm identifier'
    testable: 'yes'
    note: 'Decidable from the format''s definition: does a signature have to name its algorithm. §1.1 calls COSE_Sign compliant without saying how it meets this or any other SHOULD criterion (R-0032).'
  - id: 'in-toto-envelope-v1#R-0009'
    locator: '§2'
    source_lines: '31-32'
    text: '- `signatures` (or equivalent) is REQUIRED and MUST be defined as an array of digital signatures.'
    verb: 'REQUIRED'
    kind: stated
    actor: 'producer (presence) and envelope schema (type); attributed, the sentence names only the field'
    object: 'Envelope'
    field: 'signatures (or equivalent)'
    testable: 'yes'
    split_into:
      - 'in-toto-envelope-v1#R-0035'
      - 'in-toto-envelope-v1#R-0036'
    note: 'REQUIRED and MUST in one sentence; split into R-0035 (presence) and R-0036 (an array of digital signatures). A general field requirement (R-0034): it binds every Envelope, whatever its schema. No minimum count is set: an empty array meets the letter and authenticates nothing (R-0045).'
  - id: 'in-toto-envelope-v1#R-0010'
    locator: '§2'
    source_lines: '34'
    text: '- A `keyid` (or equivalent) SHOULD be included for each signing key used.'
    verb: 'SHOULD'
    kind: stated
    actor: 'producer (attributed; passive)'
    object: 'Envelope'
    field: 'keyid (or equivalent): one per signing key'
    testable: 'yes'
    note: 'Where the field sits is the schema''s choice (R-0011). §1 calls a key identifier a hint (R-0006), and nothing here ties its value to the [KEYID] that file names use (R-0024, R-0049).'
  - id: 'in-toto-envelope-v1#R-0011'
    locator: '§2'
    source_lines: '34-35'
    text: 'The envelope schema MAY nest this field within the signature array.'
    verb: 'MAY'
    kind: stated
    actor: 'envelope schema'
    object: 'Envelope'
    field: 'keyid placement: inside each element of the signatures array, or outside it'
    testable: 'no'
    testable_reason: 'a permission to the schema; both placements conform, so there is nothing to test.'
    note: 'this field is the keyid (or equivalent) of R-0010.'
  - id: 'in-toto-envelope-v1#R-0012'
    locator: '§2'
    source_lines: '36-37'
    text: '- `payload` (or equivalent) SHOULD be included and contain the in-toto [Statement] that was signed.'
    verb: 'SHOULD'
    kind: stated
    actor: 'producer (attributed; passive)'
    object: 'Envelope'
    field: 'payload (or equivalent): present, and holding the signed Statement'
    testable: 'yes'
    note: 'One SHOULD governs both conjuncts. For the DSSE fields R-0020 makes the payload a base64-encoded JSON Statement as a MUST. In another schema the SHOULD leaves room for an envelope without its payload, and the source does not say how a consumer then obtains the Statement R-0019 has it parse (SD-14). [Statement] is statement.md (L106), outside this source.'
  - id: 'in-toto-envelope-v1#R-0013'
    locator: '§2'
    source_lines: '38'
    text: '- `payloadType` (or equivalent) MUST be signed along with the `payload`.'
    verb: 'MUST'
    kind: stated
    actor: 'producer (attributed; passive)'
    object: 'Envelope signature'
    field: 'payloadType (or equivalent): inside the signed input, with the payload'
    testable: 'yes'
    note: 'Testable as: change payloadType after signing and the envelope must no longer verify; the verifier side is R-0044. How payloadType and payload enter the signature input is the schema''s (for DSSE, outside this source). Presupposes that a payloadType is present, which no sentence makes required as R-0035 does signatures (R-0043). §1 asks only SHOULD of the format for this (R-0004): SD-2.'
  - id: 'in-toto-envelope-v1#R-0014'
    locator: '§2'
    source_lines: '39-40'
    text: 'It MUST take the form `application/vnd.in-toto+<encoding>` to indicate an in-toto [Statement] payload and its serialized `<encoding>` format.'
    verb: 'MUST'
    kind: stated
    actor: 'producer (attributed; the sentence names only the field)'
    object: 'Envelope'
    field: 'payloadType (or equivalent): value of the form application/vnd.in-toto+<encoding>'
    testable: 'yes'
    note: 'It is the payloadType of L38. A general field requirement (R-0034), so it binds DSSE envelopes too, and the DSSE rule R-0015 is added to it (R-0038): the predicate-specific value R-0015 allows does not take this form, SD-1. What <encoding> may be in a schema other than DSSE is not said; the DSSE values end +json (R-0015): SD-15.'
  - id: 'in-toto-envelope-v1#R-0015'
    locator: '§2'
    source_lines: '45-46'
    text: '- `payloadType` MUST be set to `application/vnd.in-toto.<predicate>+json` or to `application/vnd.in-toto+json`.'
    verb: 'MUST'
    kind: stated
    actor: 'producer (attributed; passive)'
    object: 'DSSE envelope'
    field: 'payloadType: application/vnd.in-toto.<predicate>+json or application/vnd.in-toto+json'
    testable: 'yes'
    note: 'A DSSE-specific rule (R-0038). Its first value conflicts with the general form of R-0014: SD-1. Choosing it brings in the rules R-0040 leads into (R-0016 to R-0019, R-0041). Either value announces a JSON object with a _type field (R-0039). Not the storage media type of §4, which ends +dsse (R-0025).'
  - id: 'in-toto-envelope-v1#R-0016'
    locator: '§2'
    source_lines: '49-50'
    text: '- `<predicate>` MUST match the [predicate specification filename] without the file extension.'
    verb: 'MUST'
    kind: stated
    actor: 'producer (attributed; the sentence names only the value)'
    object: 'DSSE envelope'
    field: 'payloadType: the <predicate> component'
    testable: 'yes'
    note: 'Applies only when the predicate-specific value is used (R-0040). [predicate specification filename] is a relative link, ../predicates (L109), outside this source, so a test needs a dated listing of it. Which predicate''s filename is not said: R-0046. The same rule for the storage media type is R-0026.'
  - id: 'in-toto-envelope-v1#R-0017'
    locator: '§2'
    source_lines: '51-52'
    text: '- Consumers SHOULD NOT rely upon the media type for individual attestations as faithful indicators of predicate type.'
    verb: 'SHOULD NOT'
    kind: stated
    actor: 'consumer'
    object: 'DSSE envelope: predicate-specific payloadType'
    field: 'payloadType: the <predicate> component'
    testable: 'partial'
    testable_reason: 'reliance is internal to the consumer; observable only by giving it an envelope whose media type names a predicate other than the Statement''s predicateType, and checking which one it acts on.'
    note: 'In §2 the media type is the predicate-specific payloadType (R-0040), which R-0013 has signed: what is distrusted is its faithfulness to predicateType, not its authenticity. The text is identical to R-0027, which is about the §4 storage media type.'
  - id: 'in-toto-envelope-v1#R-0018'
    locator: '§2'
    source_lines: '52-53'
    text: 'Consumer SHOULD only rely on the `predicateType` field in the [Statement] layer.'
    verb: 'SHOULD'
    kind: stated
    actor: 'consumer'
    object: 'Statement (the decoded payload)'
    field: 'predicateType'
    testable: 'partial'
    testable_reason: 'as R-0017: observable only through a consumer given a media type and a predicateType that disagree.'
    note: 'Singular Consumer: SD-8. predicateType is a Statement-layer field (statement.md, L106, outside this source). Read as: for the predicate type, rely on predicateType alone. A disagreement is not made an error: R-0047. The text is identical to R-0028 (§4).'
  - id: 'in-toto-envelope-v1#R-0019'
    locator: '§2'
    source_lines: '54-55'
    text: '- To obtain predicate information that is authenticated, consumers MUST parse the Envelope''s `payload`, and verify it against its `signatures`.'
    verb: 'MUST'
    kind: stated
    actor: 'consumer'
    object: 'Envelope'
    field: 'payload; signatures'
    testable: 'partial'
    testable_reason: 'conditioned on the consumer wanting authenticated predicate information; observable where a consumer presents predicate information as authenticated: given an envelope whose signatures do not verify, it must not.'
    note: 'The order of the two steps is not stated, and the printed order is parse then verify: SD-3, R-0007. How many signatures must verify, and against which keys, is not said: R-0045. Scoped by R-0040 to the predicate-specific payloadType, though with the generic value the payload is the only source of predicate information anyway. The text is identical to R-0029 (§4).'
  - id: 'in-toto-envelope-v1#R-0020'
    locator: '§2'
    source_lines: '58'
    text: '- `payload` MUST be a base64-encoded JSON [Statement].'
    verb: 'MUST'
    kind: stated
    actor: 'producer (attributed; the sentence names only the field)'
    object: 'DSSE envelope'
    field: 'payload: base64 encoding of a JSON Statement'
    testable: 'yes'
    note: 'A DSSE-specific rule (R-0038). Which base64 alphabet and padding, and how the JSON is serialized, are not said here; how the signature bytes are encoded is left to the schema (R-0037). Testable as: decode, parse as JSON, find a JSON object with a _type field (R-0039) that is a Statement (statement.md, outside this source).'
  - id: 'in-toto-envelope-v1#R-0021'
    locator: '§3'
    source_lines: '62-63'
    text: 'If stored in a dedicated file by itself, and not as part of a [Bundle], an Envelope SHOULD use the suffix `.json`.'
    verb: 'SHOULD'
    kind: stated
    actor: 'producer (whoever writes the Envelope to a file; attributed)'
    object: 'Envelope file'
    field: 'file name suffix: .json'
    testable: 'yes'
    note: 'Condition: the file holds this Envelope alone and is not part of a [Bundle], which links bundle.md (L100), a sibling file of this specification, not the Sigstore Bundle of §1.1 (L105). Written for a JSON envelope: no suffix is given for an envelope in another serialization, SD-5.'
  - id: 'in-toto-envelope-v1#R-0022'
    locator: '§3'
    source_lines: '65-67'
    text: '- For attestations intended for consumption by [in-toto-verify], an Envelope containing an attestation about a particular software supply chain step `<step-name>` SHOULD be named `<step-name>.json`.'
    verb: 'SHOULD'
    kind: stated
    actor: 'producer (attributed; passive)'
    object: 'Envelope file'
    field: 'file name: <step-name>.json'
    testable: 'yes'
    note: 'Condition: the attestation is meant for in-toto-verify (L107) and is about one supply chain step. When several functionaries produce envelopes for that step, the name of R-0024, with a keyid component, takes this one''s place. Whether in-toto-verify itself depends on the name is outside this source.'
  - id: 'in-toto-envelope-v1#R-0023'
    locator: '§3'
    source_lines: '68-70'
    text: '- For other verifiers, or cases in which a step name cannot be easily determined, the attestation producer and consumer MAY agree on an arbitrary filename: `<env-name>.json`.'
    verb: 'MAY'
    kind: stated
    actor: 'producer and consumer, jointly'
    object: 'Envelope file'
    field: 'file name: <env-name>.json'
    testable: 'partial'
    testable_reason: 'the agreement is out of band and cannot be observed; the .json suffix the template keeps can be.'
    note: 'Condition: a verifier other than in-toto-verify, or no step name easily determined. Only <env-name> is free; the suffix stays .json (R-0021).'
  - id: 'in-toto-envelope-v1#R-0024'
    locator: '§3'
    source_lines: '71-74'
    text: '- If multiple Envelopes are produced for the same step by different [functionaries] uniquely identified by a public key, an Envelope name SHOULD include the truncated [KEYID] of the public key `<keyid[0:8]>` of the signing functionary: `<step/env-name>.<keyid[0:8]>.json`.'
    verb: 'SHOULD'
    kind: stated
    actor: 'producer (each signing functionary; attributed)'
    object: 'Envelope file'
    field: 'file name: <step/env-name>.<keyid[0:8]>.json'
    testable: 'yes'
    note: 'Condition: several envelopes for the same step, from functionaries each identified by a public key. <step/env-name> is the name of R-0022 or R-0023. [KEYID] links the in-toto v1.0 key formats (L104), outside this source, and [0:8] is not defined here (R-0049). Two envelopes for one step from the same functionary are not provided for, nor one Envelope carrying several functionaries'' signatures, or none with a keyid (SD-9); a step name containing a dot collides with this form (SD-10).'
  - id: 'in-toto-envelope-v1#R-0025'
    locator: '§4'
    source_lines: '78-79'
    text: 'The media type `application/vnd.in-toto.<predicate>+dsse` SHOULD be used to denote an individual attestation in arbitrary storage systems.'
    verb: 'SHOULD'
    kind: stated
    actor: 'producer or storing client (attributed; passive)'
    object: 'stored attestation (one Envelope)'
    field: 'storage media type: application/vnd.in-toto.<predicate>+dsse'
    testable: 'yes'
    note: 'Not payloadType (R-0015), which ends +json and sits inside the envelope under its signature; this label sits in the storage system, and nothing in the source puts it under a signature. Only a predicate-specific form is given, with no generic one (SD-6), and only for DSSE (SD-5). §4.1 gives three examples (C-0008 to C-0010, rejected as examples).'
  - id: 'in-toto-envelope-v1#R-0026'
    locator: '§4'
    source_lines: '81-82'
    text: '- The `<predicate>` MUST match the [predicate specification filename] without the file extension.'
    verb: 'MUST'
    kind: stated
    actor: 'producer or storing client (attributed; the sentence names only the value)'
    object: 'storage media type'
    field: 'the <predicate> component of the storage media type'
    testable: 'yes'
    note: 'As R-0016, for the storage media type, and testable the same way. Which predicate''s filename: R-0046. Versioning stays in the Statement layer (R-0042).'
  - id: 'in-toto-envelope-v1#R-0027'
    locator: '§4'
    source_lines: '84-85'
    text: '- Consumers SHOULD NOT rely upon the media type for individual attestations as faithful indicators of predicate type.'
    verb: 'SHOULD NOT'
    kind: stated
    actor: 'consumer'
    object: 'storage media type'
    field: 'the <predicate> component of the storage media type'
    testable: 'partial'
