vectors:
  # ==================================================================
  # 2.5 Numeric Reduction -- prose examples
  # ==================================================================
  - id: "draft-mcnally-deterministic-cbor#V-0001"
    locator: "§2.5"
    diagnostic: "2"
    hex: "02"
    decoded: "the unsigned integer 2"
    expect: valid
    notes: "Source line 289-290: 'Numeric Reduction ensures that semantically equal numeric values (e.g. 2 and 2.0) are encoded into identical byte streams (e.g. 0x02)'. The source prints 0x02. The integer half of that pair."
  - id: "draft-mcnally-deterministic-cbor#V-0002"
    locator: "§2.5"
    diagnostic: "2.0"
    hex: "02"
    decoded: "the unsigned integer 2 -- the float 2.0 reduced to its numerically equal integer"
    expect: valid
    notes: "The floating-point half of the same pair. The source prints 0x02 for it. Its preferred CBOR serialization as a float would be f94000; dCBOR forbids that encoding (same pattern as V-0053, the source's own 12.0 / f94a00 row)."
  - id: "draft-mcnally-deterministic-cbor#V-0003"
    locator: "§2.5 rule 1"
    diagnostic: "0"
    hex: "00"
    decoded: "the unsigned integer 0"
    expect: valid
    notes: "Source line 306-308: 'the three representations of a zero number in CBOR (0, 0.0, -0.0 in diagnostic notation) are all reduced to the basic integer 0 (with preferred encoding 0x00)'. The source prints 0x00. Table 3 repeats this value as V-0012."
  - id: "draft-mcnally-deterministic-cbor#V-0004"
    locator: "§2.5 rule 1"
    diagnostic: "0.0"
    hex: "00"
    decoded: "the unsigned integer 0 -- the float 0.0 reduced"
    expect: valid
    notes: "Second of the three zero representations. The source prints 0x00 for all three. This one appears only here, not in Table 3."
  - id: "draft-mcnally-deterministic-cbor#V-0005"
    locator: "§2.5 rule 1"
    diagnostic: "-0.0"
    hex: "00"
    decoded: "the unsigned integer 0 -- the float negative zero reduced, sign discarded"
    expect: valid
    notes: "Third of the three zero representations. The source prints 0x00. Table 3 repeats this value as V-0035 ('Reduced.')."
  - id: "draft-mcnally-deterministic-cbor#V-0006"
    locator: "§2.5, Figure 1"
    diagnostic: "{10: \"ten\", 10.0: \"floating ten\"}"
    hex: "a20a6374656ef949006c666c6f6174696e672074656e"
    decoded: "a two-entry map: key 10 -> \"ten\", key 10.0 (half-precision) -> \"floating ten\""
    expect: invalid
    violates: "§2.5 rule 1 (Numeric Reduction) read with §2.4 rule 2 (decoders MUST reject encoded maps with duplicate keys). 10.0 is an integral floating point value inside DCBOR_INT, so it MUST be reduced to the integer 10, which then collides with the first key."
    notes: "The source calls this 'Figure 1: Valid CBOR data item with numeric map keys' -- it is valid CBOR and NOT valid dCBOR. The source states the consequence directly: 'Numeric Reduction means that some maps that are valid CBOR cannot be reduced to valid dCBOR maps'. OUR COMPUTATION: the source prints diagnostic notation only, no bytes. The hex assumes RFC 8949 preferred serialization of 10.0 (half-precision f94900); any float width would make the same point. Key order as written is already bytewise lexicographic (0a < f94900), so map ordering (§2.3) is not the violation here."
  - id: "draft-mcnally-deterministic-cbor#V-0007"
    locator: "§2.5, Figure 2"
    diagnostic: "{10: \"ten\", 10: \"floating ten\"}"
    hex: "a20a6374656e0a6c666c6f6174696e672074656e"
    decoded: "a two-entry map with the integer key 10 appearing twice"
    expect: invalid
    violates: "§2.4 rule 1 and rule 2 -- dCBOR encoders MUST NOT emit, and decoders MUST reject, maps that contain duplicate keys."
    notes: "The source's 'Figure 2: Numeric Reduction turns valid CBOR invalid' -- what V-0006 becomes after Numeric Reduction. The source's own inline comment is '/ invalid: multiple entries with the same key /'. OUR COMPUTATION: the source prints diagnostic notation only, no bytes. Its closing advice: 'dCBOR applications need to avoid maps that have entries with keys that are semantically equivalent in dCBOR's numeric model'."
  - id: "draft-mcnally-deterministic-cbor#V-0008"
    locator: "§2.5 rule 2"
    diagnostic: "NaN"
    hex: "f97e00"
    decoded: "the single canonical quiet NaN, half-precision"
    expect: valid
    notes: "Source line 345-346: implementations 'MUST reduce all encoded NaN values to the quiet NaN value having the half-width CBOR representation 0xf97e00'. The source prints the bytes. First of three places the source prints this byte string; see also V-0052 (Table 3) and V-0069 (§8.3)."

  # ==================================================================
  # 2.6 Simple Values
  # ==================================================================
  - id: "draft-mcnally-deterministic-cbor#V-0009"
    locator: "§2.6"
    diagnostic: "false"
    hex: "f4"
    decoded: "the simple value false (major type 7, code point 20)"
    expect: valid
    notes: "Source line 367-369: 'Only the three \"simple\" (major type 7) values false (0xf4), true (0xf5), and null (0xf6) and the floating point values are valid in dCBOR.' The source prints the bytes. §8.4 restates the code point as 20."
  - id: "draft-mcnally-deterministic-cbor#V-0010"
    locator: "§2.6"
    diagnostic: "true"
    hex: "f5"
    decoded: "the simple value true (major type 7, code point 21)"
    expect: valid
    notes: "Same sentence as V-0009; the source prints the bytes. §8.4 restates the code point as 21."
  - id: "draft-mcnally-deterministic-cbor#V-0011"
    locator: "§2.6"
    diagnostic: "null"
    hex: "f6"
    decoded: "the simple value null (major type 7, code point 22)"
    expect: valid
    notes: "Same sentence as V-0009; the source prints the bytes. §8.4 restates the code point as 22, and §8.2 is the rationale for choosing null as dCBOR's sole placeholder for an absent value."

