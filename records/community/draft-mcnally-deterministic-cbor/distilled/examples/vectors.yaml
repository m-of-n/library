  # ==================================================================
  # 8.1 Why Numeric Reduction? -- the Tag 1 example
  # ==================================================================
  - id: "draft-mcnally-deterministic-cbor#V-0064"
    locator: "§8.1"
    diagnostic: "1(<an integral number of seconds since the epoch>)"
    decoded: "CBOR tag 1 (epoch-based date/time) whose content is an integer"
    expect: valid
    notes: "NO BYTES AND NO VALUE IN THE SOURCE. §8.1's prose example: 'An inhabitant of Tag 1, as long as it represents an integral number of seconds since the epoch, could therefore be encoded as an integer _or_ the equivalent floating point number. dCBOR's Numeric Reduction rule ensures that such values are always encoded as integers'. This vector is the integer arm. The section quotes RFC 8949 §3.4.2, which permits major types 0, 1 and 7 (additional information 25, 26, 27) as tag 1 content; dCBOR narrows that to the integer forms for integral seconds. `hex` is deliberately absent: the source names no concrete timestamp, so our suite must pick one."
  - id: "draft-mcnally-deterministic-cbor#V-0065"
    locator: "§8.1"
    diagnostic: "1(<the equivalent floating point number>)"
    decoded: "CBOR tag 1 whose content is a float numerically equal to an integral number of seconds"
    expect: invalid
    violates: "§2.5 rule 1 (Numeric Reduction) -- the tag content is an integral floating point value inside DCBOR_INT, so it MUST be converted to the numerically equal integer before encoding; §2.5 rule 3 makes a decoder reject it. §2's recursion clause ('A CBOR data item is considered to conform to dCBOR only if every CBOR data item nested within it, recursively (including ... the contents of tagged data items), also conforms') is what carries the rule inside the tag."
    notes: "NO BYTES AND NO VALUE IN THE SOURCE. The float arm of the same §8.1 example -- the variability the rule exists to remove. `hex` is deliberately absent for the same reason as V-0064. Note the boundary this example sits on: §2.5's last paragraph says tagged data items are not themselves part of the dCBOR numeric model, but their *contents* are, because of the recursion clause."

  # ==================================================================
  # 8.3 Why only a single NaN?
  # ==================================================================
  - id: "draft-mcnally-deterministic-cbor#V-0066"
    locator: "§8.3"
    diagnostic: "1.0 / 0.0"
    decoded: "the source presents this computation as producing NaN"
    expect: valid
    notes: "SOURCE INCONSISTENCY (reported, not repaired). Source line 999-1002: 'How to represent the result of a computation like 1.0 / 0.0 is another perennial question in data modeling.  The [IEEE754] floating point standard answers this question with the concept of \"Not a Number\" (NaN)'. Under IEEE 754, 1.0 / 0.0 is +Infinity, not NaN; the NaN-producing division is 0.0 / 0.0. The illustration is wrong, the rule it illustrates is not. `hex` is absent because the two readings encode differently and neither is printed: as the source means it the value is NaN (f97e00, V-0069); as written it is +Infinity (f97c00, V-0050). Both are valid dCBOR, so nothing normative turns on this."
  - id: "draft-mcnally-deterministic-cbor#V-0067"
    locator: "§8.3"
    diagnostic: "[1, NaN, 3]"
    hex: "8301f97e0003"
    decoded: "a three-element array: 1, the canonical quiet NaN, 3"
    expect: valid
    notes: "OUR COMPUTATION: the source prints the array in diagnostic notation only, no bytes. Source line 1027-1029: 'the array [1, NaN, 3] could be encoded in multiple ways depending on the NaN representation used'. This is the one dCBOR form of it, with the NaN canonicalized per §2.5 rule 2. The source's point is the existence of the alternatives, one of which is V-0068."
  - id: "draft-mcnally-deterministic-cbor#V-0068"
    locator: "§8.3"
    diagnostic: "[1, NaN, 3]"
    hex: "8301f97e0103"
    decoded: "the same array with a half-precision NaN carrying payload 1 in place of the canonical NaN"
    expect: invalid
    violates: "§2.5 rule 2 -- all NaN values MUST be reduced to 0xf97e00; §2.5 rule 3 makes a decoder reject any other NaN encoding. §2's recursion clause carries the rule into the array element."
    notes: "OUR COMPUTATION, and the array framing is ours: the source prints no encoding of this array. It names the class ('could be encoded in multiple ways depending on the NaN representation used') and warns that 'an attacker could use different NaN representations to exfiltrate data or hide malicious payloads, knowing that any comparison of NaN values will fail'. The non-canonical NaN used here, f97e01, is the source's own (V-0063); only its placement in the array is ours. Many other members of this class exist (fb7ff9100000000001, faffc00001, and every other NaN bit pattern)."
  - id: "draft-mcnally-deterministic-cbor#V-0069"
    locator: "§8.3"
    diagnostic: "NaN"
    hex: "f97e00"
    decoded: "the single canonical quiet NaN, half-precision"
    expect: valid
    notes: "Source line 1035-1038, restating §2.5 rule 2 as the conclusion of the rationale: 'dCBOR chooses to simplify the situation by requiring that all NaN values be encoded as the single quiet NaN value having the half-width CBOR representation 0xf97e00'. The source prints the bytes. Third of three places; see V-0008 (§2.5 rule 2) and V-0052 (Table 3)."

  # ==================================================================
  # 8.4 Why not other simple values?
  # ==================================================================
  - id: "draft-mcnally-deterministic-cbor#V-0070"
    locator: "§8.4"
    diagnostic: "undefined"
    hex: "f7"
    decoded: "the simple value undefined (major type 7, code point 23)"
    expect: invalid
    violates: "§2.6 rule 1 and rule 2 -- dCBOR encoders MUST NOT encode, and decoders MUST reject, major type 7 values other than false, true, null, and the floating point values."
    notes: "OUR COMPUTATION of the bytes: §8.4 gives the code point, not the encoding -- '[RFC8949] Major Type 7 defines a space of 256 code points for \"simple values\", and §3.3 defines four simple values and assigns them code points in the Major Type 7 space: false (20), true (21), null (22), and undefined (23)'. f7 is major type 7 with additional information 23. The other three code points are V-0009 to V-0011, whose bytes the source does print at §2.6. §8.2 ('Why Not undefined?') is the rationale: dCBOR picks null as the sole placeholder for an absent value. The source makes no example of the unassigned and reserved code points it also mentions, so none is recorded here; our own suite should cover e0 through f3 and f8xx."

  # ==================================================================
  # 8.5 Limiting Principles -- what dCBOR deliberately still permits
  # ==================================================================
  - id: "draft-mcnally-deterministic-cbor#V-0071"
    locator: "§8.5"
    diagnostic: "2(<byte string>) / 3(<byte string>)"
    decoded: "a bignum: CBOR tag 2 (unsigned) or tag 3 (negative) wrapping a byte string"
    expect: valid
    notes: "NO BYTES AND NO VALUE IN THE SOURCE. §8.5: 'dCBOR applications can freely use Tag 2 or Tag 3 to encode bignums, which contain byte strings, and on which dCBOR places no restrictions beyond those that apply to all byte strings (definite length only).' A permission, recorded as a vector because it is the escape hatch for the range DCBOR_INT excludes (V-0055, V-0056) -- but note that it is an *application's* choice: §2.5 rule 1 forbids an encoder from reaching a bignum by reduction ('Specifically, conversion to a CBOR bignum is never considered'). `hex` absent: the source names no bignum. Our suite must also check that the enclosed byte string is definite-length (§2.1)."
  - id: "draft-mcnally-deterministic-cbor#V-0072"
    locator: "§8.5"
    diagnostic: "80(<byte string>) / 81(<byte string>) / 82(<byte string>)"
    decoded: "an array of fixed-length IEEE 754 floats in big-endian order, carried as a byte string under tag 80, 81 or 82"
    expect: valid
    notes: "NO BYTES AND NO VALUE IN THE SOURCE. §8.5: 'the rare applications that need to convey nontrivial NaN values can use Tag 80, 81, or 82 as defined in the IANA CBOR Tags Registery [IANACBORTAGS].  These tags use byte strings to encode arrays of fixed-length IEEE 754 floating point values in big-endian byte order.' The escape hatch for the NaN payloads §2.5 rule 2 destroys (V-0061 to V-0063): inside a byte string the bit patterns are opaque to dCBOR. `hex` absent: the source names no instance, and the tag definitions are in the IANA registry, not in this source."
