  # ==================================================================
  # 7.2 Table 4 -- Invalid dCBOR Encodings (11 rows, in table order).
  # The source's framing: "These are valid CBOR encodings that MUST be
  # rejected as invalid by a dCBOR-compliant decoder." Every hex in
  # this block is the source's own.
  # ==================================================================
  - id: "draft-mcnally-deterministic-cbor#V-0053"
    locator: "§7.2 Table 4 row 1"
    diagnostic: "12.0"
    hex: "f94a00"
    decoded: "the half-precision float 12.0"
    expect: invalid
    violates: "§2.5 rule 1 (Numeric Reduction) -- an integral floating point value numerically equal to a value in DCBOR_INT MUST be converted to that integer before encoding, so 12.0 must be encoded as 0c; §2.5 rule 3 makes a decoder reject any float not encoded by those rules."
    notes: "Source reason column: 'Can be reduced to 12.' This is the archetype of the whole profile: a perfectly preferred-serialization CBOR float that dCBOR still forbids."
  - id: "draft-mcnally-deterministic-cbor#V-0054"
    locator: "§7.2 Table 4 row 2"
    diagnostic: "1.5"
    hex: "fb3ff8000000000000"
    decoded: "the double-precision float 1.5"
    expect: invalid
    violates: "§2.2 rule 2 (Preferred Serialization) -- a decoder MUST reject encoded CBOR that is not in preferred serialization; the preferred encoding of 1.5 is the half-precision f93e00 (V-0029). §2.5 rule 3 applies as well."
    notes: "Source reason column: 'Not preferred encoding.'"
  - id: "draft-mcnally-deterministic-cbor#V-0055"
    locator: "§7.2 Table 4 row 3"
    diagnostic: "-9223372036854775809"
    hex: "3b8000000000000000"
    decoded: "the negative integer -(2^63 + 1)"
    expect: invalid
    violates: "§7.2 Table 4, reason column '65-bit negative integer value', read against the dCBOR numeric range DCBOR_INT = [-2^63, 2^64-1] declared in §2.5 rule 1. Checked: -2^63-1 = -9223372036854775809, one step below the floor."
    notes: "GAP (reported, not repaired): §2 never states a narrowing rule that forbids a 65-bit negative *integer*. §2.5 rule 1 defines DCBOR_INT only as the range inside which floats are reduced; rule 3 constrains floats, not major type 1. These bytes are well-formed, preferred-serialization CBOR for a value RFC 8949 §3.1 permits, so §2.2 does not reach them either. The only normative statement that rejects them is §7.2's own 'MUST be rejected as invalid by a dCBOR-compliant decoder', in an appendix the document calls test vectors. Value column reads '-9223372036854775809 (-2^63 - 1)'; checked, the parenthetical is correct here."
  - id: "draft-mcnally-deterministic-cbor#V-0056"
    locator: "§7.2 Table 4 row 4"
    diagnostic: "-18446744073709551616"
    hex: "3bffffffffffffffff"
    decoded: "the negative integer -2^64, the largest-magnitude 65-bit negative CBOR permits"
    expect: invalid
    violates: "Same as V-0055: §7.2 Table 4, '65-bit negative integer value', against DCBOR_INT = [-2^63, 2^64-1] (§2.5 rule 1)."
