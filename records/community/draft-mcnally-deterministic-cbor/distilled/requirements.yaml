schema: "library-requirements/v1"
record: draft-mcnally-deterministic-cbor
source_version: "draft-mcnally-deterministic-cbor-18"
source_digest: "bce4874da41fc1dcb358f694adc8d16bb2bfd07eb5e628d838c496b72d13015f"
source_keyword_count: 18
extracted_keyword_count: 18
reconciliation: "Counts agree: all 18 BCP 14 occurrences in the source (16 MUST, 2 MUST NOT) are carried by the 18 entries marked kind stated, and no entry carries a keyword the source does not. Five things a reader of this file alone cannot see. (1) The numbered item at 2.5 item 1 carries TWO MUSTs in one item - check whether the value is numerically equal to an integer in DCBOR_INT, and convert it if so - and is split into R-0013 and R-0014 because each half is separately testable; each half keeps its own keyword, so splitting does not change the total. (2) R-0036 (7.2) is not a new rule: it restates, for Appendix A's table of invalid encodings, the decoder rejection duties already stated in 2.2, 2.5 and 2.6. It is extracted and counted because the keyword occurs there, which is why MUST totals 16 rather than 15. (3) R-0037 (8.1) is a verbatim block quotation of RFC 8949 section 3.4.2 (the Tag 1 content rule), reproduced inside Appendix B, which the document itself opens by declaring non-normative. It imposes no new obligation on dCBOR implementations; it is extracted and counted only because bin/bcp14-count counts the keyword occurrence in this source. Dropping it would have left the extraction one MUST short of 18. (4) The BCP 14 definition paragraph in 1.1 quotes every keyword and constrains nothing; bin/bcp14-count excludes it and so does this extraction. (5) 20 of the 38 entries carry verb none. This document states much of its binding content in lowercase prose or in tables - the recursive-conformance rule (R-0003), the dCBOR numeric model and its tagged-item equality rule (R-0021 to R-0023), the validity sentence that 2.6 then restates as MUST NOT (R-0024), the two CDDL control operators and tag 201 (R-0029, R-0030), both IANA registrations (R-0033, R-0034), the Appendix A test vectors (R-0035) and the lowercase must in 8.5 (R-0038) - so extracting only the keyword-bearing sentences would have captured under half of what an implementer must obey."
reviewed_by: ""
note: >
  Ids are stable and never reused. Cite as draft-mcnally-deterministic-cbor#R-NNNN.

requirements:
  - id: "draft-mcnally-deterministic-cbor#R-0001"
    object: dCBOR implementation
    field: "output must be well-formed, deterministically encoded CBOR per RFC 8949 - dCBOR narrows CBOR and does not fork it; no BCP 14 keyword backs it (lowercase declarative prose). The quote stops at the reference because the sentence continues across a page break in the source (it ends: and existing CBOR decoders will therefore be able to decode it)."
    verb: none
    actor: implementation
    locator: "§2"
    text: 'A dCBOR implementation produces well-formed, deterministically encoded CBOR according to [RFC8949]'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0002"
    object: dCBOR codec
    field: "applicability - the document's requirements bind any codec encoding or decoding dCBOR data, unified dCBOR/CBOR or single-purpose alike; no BCP 14 keyword backs it (lowercase declarative prose). Testable only as a scoping rule that routes the other entries onto a given codec."
    verb: none
    actor: implementation
    locator: "§2"
    text: 'The requirements in this document apply to encoding or decoding of dCBOR data, regardless of whether the codec is a unified dCBOR/CBOR codec operating in dCBOR-compliant modes, or a single-purpose dCBOR codec.'
    kind: inferred
    testable: partial
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0003"
    object: CBOR data item
    field: "recursive conformance - every nested item, including array elements, map keys, map values and tag content, must itself satisfy the section 2 narrowing rules; no BCP 14 keyword backs it (lowercase declarative prose). This is the rule that makes the 2.1 to 2.7 duties apply at every depth."
    verb: none
    actor: implementation
    locator: "§2"
    text: 'A CBOR data item is considered to conform to dCBOR only if every CBOR data item nested within it, recursively (including array elements, map keys and values, and the contents of tagged data items), also conforms to the narrowing rules in this section.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0004"
    object: dCBOR implementation
    field: "applicability by supported numeric range - dCBOR places no direct requirement on which subset of CBOR is implemented (floating point support is not required), but an implementation that supports 64-bit integers or 64-bit or smaller floating point numbers is bound by this document's requirements for them; no BCP 14 keyword backs it (lowercase declarative prose). Testable only as the scoping precondition for 2.5, not on its own."
    verb: none
    actor: implementation
    locator: "§2"
    text: 'However, this document does place requirements on dCBOR implementations that support 64-bit integers and 64-bit or smaller floating point numbers.'
    kind: inferred
    testable: partial
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0005"
    object: byte strings, text strings, arrays, maps
    field: "length form on emission - definite-length only. The grammatical subject comes from the dCBOR encoders lead-in above the numbered list."
    verb: MUST
    actor: encoder
    locator: "§2.1 item 1"
    text: 'MUST only emit "definite-length" items for byte strings, text strings, arrays, and maps.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0006"
    object: byte strings, text strings, arrays, maps
    field: "length form on decoding - indefinite-length items are rejected. The grammatical subject comes from the dCBOR decoders lead-in above the numbered list."
    verb: MUST
    actor: decoder
    locator: "§2.1 item 2"
    text: 'MUST reject any encoded "indefinite-length" items for byte strings, text strings, arrays, and maps.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0007"
    object: every data item
    field: "argument encoding on emission - RFC 8949 section 4.1 preferred serialization only"
    verb: MUST
    actor: encoder
    locator: "§2.2 item 1"
    text: 'MUST only emit "preferred serialization".'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0008"
    object: every data item
    field: "argument encoding on decoding - validate preferred serialization and reject non-conforming input. Kept as one entry: validate-and-reject is a single observable behaviour and the two clauses are not separately testable."
    verb: MUST
    actor: decoder
    locator: "§2.2 item 2"
    text: 'MUST validate that encoded CBOR conforms to "preferred serialization", and reject any encoded CBOR that does not conform.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0009"
    object: map
    field: "key order on emission - bytewise lexicographic order of the encoded keys, per the last bullet of RFC 8949 section 4.2.1"
    verb: MUST
    actor: encoder
    locator: "§2.3 item 1"
    text: 'MUST only emit CBOR maps with keys in "bytewise lexicographic order".'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0010"
    object: map
    field: "key order on decoding - validate bytewise lexicographic order and reject non-conforming maps. Kept as one entry: validate-and-reject is a single observable behaviour."
    verb: MUST
    actor: decoder
    locator: "§2.3 item 2"
    text: 'MUST validate that encoded CBOR maps have keys in "bytewise lexicographic order", and reject any encoded maps that do not conform.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0011"
    object: map
    field: "duplicate keys on emission - prohibited"
    verb: MUST NOT
    actor: encoder
    locator: "§2.4 item 1"
    text: 'MUST NOT emit CBOR maps that contain duplicate keys.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0012"
    object: map
    field: "duplicate keys on decoding - rejected, closing the handling choice RFC 8949 leaves to the implementor"
    verb: MUST
    actor: decoder
    locator: "§2.4 item 2"
    text: 'MUST reject encoded maps with duplicate keys.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0013"
    object: numeric reduction
    field: "detection step - test every floating point value to be encoded for a numerically equal value in DCBOR_INT = [-2^63, 2^64-1]. Split from R-0014 (the second MUST of the same numbered item) because the check and the conversion are separately testable."
    verb: MUST
    actor: implementation
    locator: "§2.5 item 1"
    text: 'MUST check whether floating point values to be encoded have the numerically equal value in DCBOR_INT = [-2^63, 2^64-1].'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0014"
    object: numeric reduction
    field: "conversion step - an integral floating point value within DCBOR_INT is converted to that integer before encoding, so preferred encoding then yields the shortest form. The referent of it is the floating point value of R-0013; the source's pronoun has no explicit antecedent."
    verb: MUST
    actor: implementation
    locator: "§2.5 item 1"
    text: 'If that is the case, it MUST be converted to that numerically equal integer value before encoding it.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0015"
    object: numeric reduction
    field: "non-reducible values - a non-zero fractional part, or an exponent outside DCBOR_INT, keeps the original floating point value for encoding; no BCP 14 keyword backs it (lowercase prose completing the 2.5 item 1 procedure)."
    verb: none
    actor: implementation
    locator: "§2.5 item 1"
    text: 'If a floating point value has a non-zero fractional part, or an exponent that takes it out of DCBOR_INT, the original floating point value is used for encoding.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0016"
    object: numeric reduction
    field: "bignum exclusion - a value outside DCBOR_INT is never reduced to a CBOR bignum; no BCP 14 keyword backs it (parenthetical lowercase prohibition in 2.5 item 1)."
    verb: none
    actor: implementation
    locator: "§2.5 item 1"
    text: '(Specifically, conversion to a CBOR bignum is never considered.)'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0017"
    object: zero
    field: "zero canonicalisation - 0, 0.0 and -0.0 all encode as 0x00; no BCP 14 keyword backs it (stated as a consequence of R-0013 and R-0014, and confirmed by the -0.0 row of Table 3)."
    verb: none
    actor: implementation
    locator: "§2.5 item 1"
    text: 'This also means that the three representations of a zero number in CBOR (0, 0.0, -0.0 in diagnostic notation) are all reduced to the basic integer 0 (with preferred encoding 0x00).'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0018"
    object: application map keys
    field: "map design - applications avoid map keys that numeric reduction would turn into duplicates (e.g. 10 and 10.0), since reduction can make a valid CBOR map an invalid dCBOR one. No BCP 14 keyword backs it (lowercase need to avoid), and it sits in the 2.5 aside block, whose source lines carry a leading vertical-bar margin marker. Testable only as a design review of an application profile, not of a codec."
    verb: none
    actor: application
    locator: "§2.5 (aside)"
    text: "In general, dCBOR applications need to avoid maps that have entries with keys that are semantically equivalent in dCBOR's numeric model."
    kind: inferred
    testable: partial
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0019"
    object: NaN
    field: "NaN canonicalisation - every NaN, whatever its sign, quiet or signaling bit, or payload, reduces to the half-width quiet NaN 0xf97e00"
    verb: MUST
    actor: implementation
    locator: "§2.5 item 2"
    text: 'MUST reduce all encoded NaN values to the quiet NaN value having the half-width CBOR representation 0xf97e00.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0020"
    object: floating point value
    field: "validation on decoding - reject any floating point encoding not produced by the 2.5 reduction and NaN rules (a reducible float, or a non-canonical NaN)"
    verb: MUST
    actor: decoder
    locator: "§2.5 item 3"
    text: 'MUST reject any encoded floating point values that are not encoded according to the above rules.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0021"
    object: dCBOR numeric model
    field: "membership of the model - untagged integers and untagged floating point values only, major types 0, 1 and 7. No BCP 14 keyword backs it, and it is definitional rather than an action, so there is nothing to test directly; it is the precondition for R-0022 and R-0023."
    verb: none
    actor: implementation
    locator: "§2.5"
    text: 'For the purposes of this document, the dCBOR numeric model comprises only untagged integers and untagged floating point values in the CBOR basic generic data model (major types 0, 1, and 7 as defined in [RFC8949] and by the type number in [RFC8610]).'
    kind: inferred
    testable: no
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0022"
    object: numeric reduction
    field: "scope limit - reduction and the duplicate-key consequences apply only to untagged numeric values, wherever they occur in the item; no BCP 14 keyword backs it (lowercase declarative prose)."
    verb: none
    actor: implementation
    locator: "§2.5"
    text: 'Numeric Reduction and the duplicate-key considerations in this section apply only to such untagged numeric values, wherever they occur in a dCBOR data item.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0023"
    object: tagged data item
    field: "equality - two tagged items are equal only if both tag number and enclosed item are equal, and a tagged item is never numerically equal to an untagged one; no BCP 14 keyword backs it (lowercase declarative prose). Governs duplicate-key detection when a key is tagged."
    verb: none
    actor: implementation
    locator: "§2.5"
    text: 'Tagged data items themselves are not part of the dCBOR numeric model: two tagged data items are equal in dCBOR only if both their tag numbers and their enclosed CBOR data items are equal, and no tagged data item is ever considered numerically equal to an untagged data item.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0024"
    object: major type 7
    field: "validity of the major type 7 space - only false (0xf4), true (0xf5), null (0xf6) and the floating point values are valid dCBOR, so undefined (0xf7) and every other simple value are excluded. No BCP 14 keyword backs it (lowercase declarative prose); 2.6 items 1 and 2 restate it as MUST NOT and MUST for encoders and decoders."
    verb: none
    actor: implementation
    locator: "§2.6"
    text: 'Only the three "simple" (major type 7) values false (0xf4), true (0xf5), and null (0xf6) and the floating point values are valid in dCBOR.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0025"
    object: major type 7
    field: "simple values on emission - nothing outside false, true, null and the floating point values"
    verb: MUST NOT
    actor: encoder
    locator: "§2.6 item 1"
    text: 'MUST NOT encode major type 7 values other than false, true, null, and the floating point values.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0026"
    object: major type 7
    field: "simple values on decoding - reject anything outside false, true, null and the floating point values, undefined included"
    verb: MUST
    actor: decoder
    locator: "§2.6 item 2"
    text: 'MUST reject any encoded major type 7 values other than false, true, null, and the floating point values.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0027"
    object: text string
    field: "Unicode normalisation on emission - NFC only"
    verb: MUST
    actor: encoder
    locator: "§2.7 item 1"
    text: 'MUST only emit text strings that are in NFC.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0028"
    object: text string
    field: "Unicode normalisation on decoding - reject text strings that are not in NFC. Source defect: this decoder item is numbered 1 in 2.7, where every other subsection numbers the decoder item 2."
    verb: MUST
    actor: decoder
    locator: "§2.7 item 1 (decoders)"
    text: 'MUST reject any encoded text strings that are not in NFC.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0029"
    object: CDDL control operators .dcbor and .dcborseq
    field: "semantics - identical to .cbor and .cborseq of RFC 8610 except that the encoded data item or sequence must also conform to dCBOR; no BCP 14 keyword backs it (lowercase require)."
    verb: none
    actor: implementation
    locator: "§3"
    text: 'The control operators .dcbor and .dcborseq are exactly like .cbor and .cborseq as defined in [RFC8610] except that they also require the encoded data item(s) to conform to dCBOR.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0030"
    object: tag 201
    field: "semantics - the tag declares its content to conform to dCBOR both at the data model level and at the encoded data item level; no BCP 14 keyword backs it (lowercase declarative prose). The source adds that tag 201 may also serve as a boundary marker into application data items."
    verb: none
    actor: implementation
    locator: "§3"
    text: 'Tag 201 (Section 6) is defined in this specification as a way to declare its tag content to conform to dCBOR at the data model level and the encoded data item level.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0031"
    object: security analysis
    field: "inherited security considerations - RFC 8949's considerations apply unchanged to dCBOR; no BCP 14 keyword backs it (lowercase declarative prose). Not testable: an inheritance statement, not an implementable behaviour."
    verb: none
    actor: implementation
    locator: "§5"
    text: 'This document inherits the security considerations of CBOR [RFC8949].'
    kind: inferred
    testable: no
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0032"
    object: application developer
    field: "attack-surface assessment - whether semantically equivalent documents that serialise to non-identical byte streams present an identifiable attack surface is for developers to consider. No BCP 14 keyword backs it (lowercase should), and it calls for judgement, so it cannot be mechanically tested."
    verb: none
    actor: developer
    locator: "§5"
    text: 'Whether these possibilities present an identifiable attack surface is a question that developers should consider.'
    kind: inferred
    testable: no
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0033"
    object: IANA CBOR Tags registry
    field: "registration - tag 201, data item (any), semantics enclosed dCBOR, as given in Table 1 and stated as already registered. No BCP 14 keyword backs it; the content of the obligation is carried by Table 1, not by the quoted sentence."
    verb: none
    actor: IANA
    locator: "§6"
    text: 'IANA has registered the following CBOR tag in the "CBOR Tags" registry of [IANACBORTAGS]:'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0034"
    object: IANA CDDL Control Operators registry
    field: "registration - the control operators .dcbor and .dcborseq. No BCP 14 keyword backs it, and the content is carried by the table. Source defect: the sentence asks IANA to register the contents of Table 1, but Table 1 is the CBOR tag registration; the control operators are Table 2."
    verb: none
    actor: IANA
    locator: "§6"
    text: 'This document requests IANA to register the contents of Table 1 into the registry "CDDL Control Operators" of [IANACDDL]:'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0035"
    object: numeric test vectors
    field: "conformance fixtures - Table 3 fixes the exact dCBOR encoding of each listed value, reduced and canonicalised rows included, and Table 4 the encodings a decoder rejects; an implementation is expected to reproduce them. No BCP 14 keyword backs this framing sentence, and the content of the obligation is carried by the table rows themselves."
    verb: none
    actor: implementation
    locator: "§7"
    text: 'The following tables provide common and edge-case numeric test vectors for dCBOR encoders and decoders, and are intended to exercise the requirements of this specification.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0036"
    object: Table 4 encodings
    field: "decoder rejection of the listed valid-CBOR encodings - reducible floats, non-preferred encodings, 65-bit negative integers and non-canonical NaNs. Restates the 2.2, 2.5 and 2.6 decoder duties for the Appendix A table rather than adding a new rule."
    verb: MUST
    actor: decoder
    locator: "§7.2"
    text: 'These are valid CBOR encodings that MUST be rejected as invalid by a dCBOR-compliant decoder.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0037"
    object: RFC 8949 tag 1 content
    field: "content type of Epoch-Based Date/Time - unsigned or negative integer, or a floating-point number with additional information 25, 26 or 27. Not testable as a dCBOR requirement: this is a verbatim block quotation of RFC 8949 section 3.4.2 reproduced inside Appendix B, which the source opens by declaring non-normative, and it imposes no obligation of its own on a dCBOR implementation. Extracted and counted because the keyword occurrence is in this source."
    verb: MUST
    actor: implementation
    locator: "§8.1 (quoting RFC 8949 §3.4.2)"
    text: 'The tag content MUST be an unsigned or negative integer (major types 0 and 1) or a floating-point number (major type 7 with additional information 25, 26, or 27).'
    kind: stated
    testable: no
    status: active

  - id: "draft-mcnally-deterministic-cbor#R-0038"
    object: less common data items (bignums, complex numbers, other tagged items)
    field: "optional support, mandatory conformance once supported - dCBOR places no requirement on these items, but an implementation that does support them supports them within the rules of dCBOR (a bignum's byte string, for instance, is definite-length only). No BCP 14 keyword backs it (lowercase must), and it appears in Appendix B, which the source declares non-normative."
    verb: none
    actor: implementation
    locator: "§8.5"
    text: 'dCBOR implementations are not required to support these data items, but if they do, they must support them within the rules of dCBOR.'
    kind: inferred
    testable: yes
    status: active
