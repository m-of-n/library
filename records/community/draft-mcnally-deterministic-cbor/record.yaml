distillation:
  standard: "FX-1"
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "74 located statements and 14 verbatim fenced blocks across §1, §1.1, §2, §2.1-§2.7, §3, §5, §6, §7/§7.1/§7.2 and a restricted §8; excludes §1 motivation, §4 Implementation Status (marked for removal before publication), §8.1-§8.6 rationale prose, references and boilerplate. Mechanically verified: 74/74 bullets are contiguous substrings of the whitespace-normalised source, 14/14 fences are byte-exact source line runs"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "38 entries R-0001 to R-0038 in source order, no gaps: 18 stated carrying all 18 BCP 14 occurrences (16 MUST, 2 MUST NOT; the document uses no SHOULD, MAY, REQUIRED or OPTIONAL) and 20 inferred carrying none, each declaring that no BCP 14 keyword backs it. source and extracted keyword counts both 18; reconciliation written anyway because five details of the count are invisible to a reader of the file alone. Pass 2 recounted independently and the counts, the split and the by-keyword breakdown all held"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "1 verbatim (cddl-prelude-number.cddl, the §3 prelude line) and 4 derived: a profile CDDL, a head-layer ABNF, and pseudocode for numeric reduction and for validation. The source ships almost no formal grammar of its own, so nearly every formal artifact here is ours. The cross-check pass transcribed the validation and numeric-reduction pseudocode and the ABNF's admitted-byte set into a runnable checker and ran the whole vector set through it (0 failures), confirmed the ABNF census independently (229 well-formed initial bytes, 202 admitted, the same 27 excluded, 5 of them by §2.1 and 22 by §2.6), and re-audited the CDDL (14 rules, no duplicates, no undefined references, the same 4 deliberately unreferenced). Each derived file's division of labour holds: the CDDL catches 3 of the 15 runnable invalid vectors and the ABNF 1, exactly the one-and-a-half plus one rules they claim"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "17 structures: the data item head, each major type's encoded layout as this profile narrows it, the numeric-reduction forms and map key ordering. 33 fields, every one carrying at least one constrained_by link; 148 links in all, naming 33 of the 38 requirements. The cross-check pass wired them from the per-structure constrained_by_note (section and rule number), which is kept beside them. The 5 requirements that link to no field constrain no structure: R-0002 and R-0004 are the §2 scoping sentences, R-0031 and R-0032 the §5 security sentences, and R-0037 is the non-normative RFC 8949 §3.4.2 quotation, whose subject is tag 1's content and belongs to the rfc-8949 record"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "72 vectors V-0001 to V-0072: 56 valid, 16 invalid, every invalid one carrying a violates. 62 hex strings are the source's own and were each confirmed to occur verbatim in it; 5 are our computation and say so in notes; 5 vectors state a case the source names without giving bytes. All 52 hex values in Tables 3 and 4 decoded by hand against their stated values and agree. The cross-check pass then ran all 67 vectors that carry bytes through a transcription of this record's own schema/ artifacts: 52 valid accepted, 15 invalid rejected, 0 failures, and every invalid one rejected under a rule its violates names. The 5 without bytes are scope markers the source states in prose without an instance"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "a 23-rule comparison of dCBOR against option 5 as drafted (same 3, stricter 3, looser 1, direct conflict 1, conditional conflict 1, silent 14), the R-O-03 question of whether option 5 can cite dCBOR rather than invent, and six places this document cuts against MD-3 with the favoured DEC-002 option named in each"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "dCBOR defines an encoding profile, not an exchange. Its only roles are codec roles ('dCBOR encoders:', 'dCBOR decoders:'); §2 fixes its scope as processing rather than conversation; every failure is a local decoder verdict with no error code and no peer; and §8.6 expressly declines to specify even an API."
    - kind: state-machine
      reason: "No lifecycle is defined. dCBOR conformance is a per-data-item predicate, defined recursively in §2. The only registration-like content is §6's one-time IANA action, which has no states, triggers or transitions. The one phrase that looks like a state is §2's 'a unified dCBOR/CBOR codec operating in dCBOR-compliant modes'; it names a mode and defines no states, no transitions, no triggers and no way to enter or leave one, and §2 goes on to say the requirements bind either kind of codec regardless, so nothing turns on which mode a codec is in."
  passes:
    - pass: extract
      by: "claude-opus-5 (6 parallel agents, one per artifact kind)"
      effort: max
      date: "2026-10-16"
      note: "each agent read only .cache/draft-mcnally-deterministic-cbor.txt, never a summary and never another agent's output"
    - pass: verify
      by: "claude-opus-5 (single adversarial agent that did not extract)"
      effort: max
      date: "2026-10-16"
      note: "re-derivation, not review. Recounted BCP 14 independently (18, 16 MUST + 2 MUST NOT, same by keyword); re-tested all 38 requirement quotes and all 74 normative.md bullets and 14 fences as contiguous substrings of the whitespace-normalised source, 0 failures, 0 splices, 0 locator mismatches; swept every artifact exhaustively for spans contiguous only after stripping the §2.5 '|' margin and found five, all of them the same aside and all verbatim after the strip: R-0018 (the one pass 1 disclosed), the V-0006 and V-0007 notes, the design-notes quotation of it, the map notes in messages.yaml, and derivation note 4 of the validate pseudocode — nowhere else in the source uses that margin, so nothing else can rely on it; walked every section for dropped statements and found none beyond the declared non-normative exclusions; decoded all 72 vectors with an independent CBOR decoder, confirmed 62 source hex strings verbatim and recomputed the 5 derived ones. Six small errors found and fixed, every one in our own commentary and none in a quotation, locator, requirement or vector: the V-0041 length claim, the initial-byte census sentence in the ABNF and its echo in schema/README.md, a mistyped non-preferred byte-string head in the validate pseudocode, a quotation there that had lowercased its first letter, and the 'four'/'five' miscount of the reconciliation's own items here and in distilled/README.md. The §2 integer-range gap was attacked and held, with §3's CDDL number recommendation added as corroboration."
    - pass: cross-check
      by: "claude-opus-5 (single agent; neither extracted nor verified)"
      effort: max
      date: "2026-10-16"
      note: "artifact against artifact, not against the source — the source was opened only to adjudicate. (1) EVERY EXAMPLE AGAINST THE SCHEMA, which had not been done: schema/dcbor-validate.derived.pseudocode.txt and schema/numeric-reduction.derived.pseudocode.txt were transcribed into a runnable checker, together with the ABNF's admitted-initial-byte set and the data-model half of the profile CDDL, and all 67 vectors that carry bytes were run through all three layers. 52 valid accepted, 15 invalid rejected, 0 failures, and each invalid one rejected under a rule its own violates cites — V-0006 and V-0053 on §2.5 rule 1, V-0054 and V-0057-V-0060 on §2.2, V-0055 and V-0056 on the §7.2 range, V-0061-V-0063 and V-0068 on §2.5 rule 2, V-0007 on §2.4, V-0070 on §2.6. The remaining 5 carry no bytes because the source names no instance. The checker was then shown to discriminate on 28 cases the source never prints (all four indefinite-length heads, non-preferred integer, string, tag and float heads, a misordered map, a duplicate-key map, a non-NFC text string, f7/f8/e0/f3, the three -0.0 spellings, tag 1 over a reducible float), and the encoder direction was run separately on all 43 values Table 3 names, byte-exact. (2) FIELD COVERAGE: all 38 requirements walked for the structure each names; 33 of them constrain a field and are now linked, 5 constrain no structure and are named in the messages coverage line above. (3) and (4) protocol and state-machine re-tested as not_applicable: no artifact implies an exchange, a role beyond the codec roles, or a trigger. RECONCILED: §2.1-§2.7 contains 15 numbered normative rules on all four artifacts that count them, with §2.7's two rules both numbered 1 in the source and told apart by role; the design-notes table's 23 rows resolve to 28 requirement ids, and the 10 that are not on it are prose consequences, scoping and security sentences, and the non-normative quotation; schema/README.md's claim that nothing in Appendix A exercises §2.1, §2.3, §2.4, §2.6 or §2.7 holds exactly (all 52 Appendix A vectors cite only §2.2, §2.5 and §7.2), and examples/README.md's finer claims hold too — §2.4 and §2.6 are exercised, but only outside Appendix A. FIXED: messages.yaml's header said constrained_by was NOT POPULATED ANYWHERE while record.yaml and distilled/README.md said it was populated where pass 1 was confident; the header was right, and all three now describe the finished wiring. FOUND: one new source ambiguity, design-notes defect 14 — a decoder rejects §2.5's Figure 1 for the reducible float key, never for the duplicate the figure is about, so the collision is an encoder-side phenomenon and a conformance suite built from the figure tests the wrong rule. The §2 'does not fork CBOR' claim and the §2.5 concession were left standing against each other, as both the README and design-notes already record them. No quoted source text, no locator, no requirement and no vector changed."
