distillation:
  standard: "FX-1"
  # NO `profile` ON PURPOSE. Pass 1 of 3 ran; verify and cross-check did not,
  # so this extraction is unfinished — and an unfinished extraction is neither
  # `full` nor `partial` (docs/extraction.md). bin/check-pr-extraction will
  # report it as declaring no profile. That report is correct: library#39 owns
  # finishing it, and the artifacts are readable but not buildable-on until
  # then.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "74 located statements and 14 verbatim fenced blocks across §1, §1.1, §2, §2.1-§2.7, §3, §5, §6, §7/§7.1/§7.2 and a restricted §8; excludes §1 motivation, §4 Implementation Status (marked for removal before publication), §8.1-§8.6 rationale prose, references and boilerplate. Mechanically verified: 74/74 bullets are contiguous substrings of the whitespace-normalised source, 14/14 fences are byte-exact source line runs"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "38 entries R-0001 to R-0038 in source order, no gaps: 18 stated carrying all 18 BCP 14 occurrences (16 MUST, 2 MUST NOT; the document uses no SHOULD, MAY, REQUIRED or OPTIONAL) and 20 inferred carrying none, each declaring that no BCP 14 keyword backs it. source and extracted keyword counts both 18; reconciliation written anyway because four details of the count are invisible to a reader of the file alone"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "1 verbatim (cddl-prelude-number.cddl, the §3 prelude line) and 4 derived: a profile CDDL, a head-layer ABNF, and pseudocode for numeric reduction and for validation. The source ships almost no formal grammar of its own, so nearly every formal artifact here is ours"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "17 structures: the data item head, each major type's encoded layout as this profile narrows it, the numeric-reduction forms and map key ordering. constrained_by populated only where pass 1 was confident from the source's own section numbering; completing it is a cross-check-pass job that has not run"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "72 vectors V-0001 to V-0072: 56 valid, 16 invalid, every invalid one carrying a violates. 62 hex strings are the source's own and were each confirmed to occur verbatim in it; 5 are our computation and say so in notes; 5 vectors state a case the source names without giving bytes. All 52 hex values in Tables 3 and 4 decoded by hand against their stated values and agree"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "a 23-rule comparison of dCBOR against option 5 as drafted (same 3, stricter 3, looser 1, direct conflict 1, conditional conflict 1, silent 14), the R-O-03 question of whether option 5 can cite dCBOR rather than invent, and six places this document cuts against MD-3 with the favoured DEC-002 option named in each"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "dCBOR defines an encoding profile, not an exchange. Its only roles are codec roles ('dCBOR encoders:', 'dCBOR decoders:'); §2 fixes its scope as processing rather than conversation; every failure is a local decoder verdict with no error code and no peer; and §8.6 expressly declines to specify even an API."
    - kind: state-machine
      reason: "No lifecycle is defined. dCBOR conformance is a per-data-item predicate, defined recursively in §2. The only registration-like content is §6's one-time IANA action, which has no states, triggers or transitions."
  passes:
    - pass: extract
      by: "claude-opus-5 (6 parallel agents, one per artifact kind)"
      effort: max
      date: "2026-10-16"
      note: "each agent read only .cache/draft-mcnally-deterministic-cbor.txt, never a summary and never another agent's output"
status: fetched
