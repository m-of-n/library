gaps:
  - "Distributor is a relational Party role the paper treats as first-class; ARCH-0001 §2b's role list (supplier, integrator, operator, consumer, owner, vendor-of) has no distributor."
  - "SupplyChainPolicy (authorized actors + expected actions + expected tests, evaluated against attestations) has no tmodel object; it is exactly a machine-checkable Gate exit criterion (R-041/R-042)."
  - "Attestation lifecycle (Creation → Distribution → Verification → Storage) is a state machine tmodel lacks; custody provenance is deferred to the radar contract (ADR-0001)."
  - "No key-management / root-of-trust sub-model (RootOfTrust, SigningKey rotation/revocation, threshold of offline keys)."
  - "Build-pipeline internals (BuildStep, BuildWorker, PipelineOrchestrator) would need Process/Component projections that tmodel only has generically."
