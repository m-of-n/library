note: >
  Object-model pass over the whole v2 markdown (Part 1 personas, Part 2 concepts, Part 3 stages and
  practices, "An Example Secure Supply Chain"). Locators are section headings of SSCBPv2.md.
  kind: stated = the paper names and describes the thing; inferred = implied.
objects:
  - {name: SoftwareProducer, definition: "Role category: develops software and wants to deliver it securely (OSS maintainers, end-user developers, vendor developers).", attributes: [], locator: "Part 1 › Audience/persona", kind: stated, tmodel_mapping: "Party relational role (supplier) — ARCH-0001 §2b edge, not node type", notes: "The paper itself says one party may fill all three roles."}
  - {name: SoftwareDistributor, definition: "Role category: stores artifacts with producer metadata and distributes them (PyPI, Maven Central, vendor/internal repositories).", attributes: [], locator: "Part 1 › Audience/persona", kind: stated, tmodel_mapping: "Party relational role (distributor) — missing in ARCH-0001 §2b role list", notes: ""}
  - {name: SoftwareConsumer, definition: "Role category: ingests and runs software; wants to verify trusted metadata cost-effectively.", attributes: [], locator: "Part 1 › Audience/persona", kind: stated, tmodel_mapping: "Party relational role (consumer)", notes: ""}
  - {name: Persona, definition: "Audience persona with a reading path: Developer; Producer's Security Team; Compliance-focused CISO; Ops and Platform Teams; Security Team of Consumer (Verifier); End User.", attributes: ["name", "where do I start", "then what"], locator: "Part 1 › Audience/persona › each ### persona", kind: stated, tmodel_mapping: "Role (SDL actor) — R-041 gate owner/approver candidates", notes: ""}
  - {name: Verifier, definition: "The consumer's security team that verifies integrity, authenticity and attestations against its own supply-chain policy.", attributes: [], locator: "Part 1 › Security Team of Consumer (Verifier)", kind: stated, tmodel_mapping: "Party role; PROV Agent of a verification Activity", notes: ""}
  - {name: Stage, definition: "One of five supply-chain stages: Source Code, Materials, Build Pipelines, Artifacts, Deployments and Distribution.", attributes: ["name", "SLSA threats mapped"], locator: "Part 3 › Software supply chain overview", kind: stated, tmodel_mapping: "LifecyclePhase (ARCH-0001 §3b) — implementation/production/distribution", notes: "The paper maps SLSA threats A,B,C→Source; dependencies→Materials; D,E→Build; F→Artifacts; G,H,I→Deployments."}
  - {name: PracticeCategory, definition: "Grouping within a stage: Verification, Automation, Controlled Environments, Secure Authentication (and Access).", attributes: ["name"], locator: "Part 3 › each stage's ### headings", kind: stated, tmodel_mapping: "none (taxonomy facet on Requirement)", notes: ""}
  - {name: Practice, definition: "A named best practice (#### / ##### heading) with recommendation prose; 59 in Part 3.", attributes: ["title", "stage", "category", "text"], locator: "Part 3 (see requirements.yaml)", kind: stated, tmodel_mapping: "Requirement (R-044 crosswalk row) satisfied by a MitigationInstance (R-040)", notes: ""}
  - {name: SupplyChainThreat, definition: "Threat points of the SLSA diagram the paper reuses: Producer, Authoring & Reviewing, Source Code Management, External Build Parameters, Build Process, Artifact Publication, Distribution Channel, Package Selection.", attributes: ["label", "description"], locator: "Part 3 › Software supply chain overview", kind: stated, tmodel_mapping: "ThreatInstance / AttackPattern applies_in_phase (R-037)", notes: "Borrowed from SLSA; see slsa-1-2."}
  - {name: Metadata, definition: "Supply-chain metadata associated with artifacts — SBOMs, VEX and attestations — that must be stored and distributed.", attributes: ["type", "storage (OCI, GitHub, Archivista)"], locator: "Part 2 › Concepts › Metadata", kind: stated, tmodel_mapping: "Entity (PROV)", notes: ""}
  - {name: SBOM, definition: "Inventory of components, libraries and dependencies and the build environment; best produced by build tools; reflects the producer's understanding.", attributes: ["format (CycloneDX, SPDX)", "generator"], locator: "Part 2 › Concepts › SBOM", kind: stated, tmodel_mapping: "documentation deliverable feeding composed_of", notes: ""}
  - {name: VEX, definition: "Vulnerability Exploitability eXchange document stating per-vulnerability status: AFFECTED, NOT AFFECTED, UNDER INVESTIGATION, FIXED.", attributes: ["vulnerability", "status", "product"], locator: "Part 2 › Concepts › VEX", kind: stated, tmodel_mapping: "VEX override Assertion + Review (ARCH-0001 §5, R-027b)", notes: ""}
  - {name: Attestation, definition: "Signed record of an action in the supply chain enabling policy evaluation; lifecycle Creation → Distribution → Verification → Storage.", attributes: ["subject artifact", "signer identity", "predicate (e.g. build inputs/outputs, tests)"], locator: "Part 2 › Concepts › Attestations", kind: stated, tmodel_mapping: "Assertion (ARCH-0001 §4) for custody provenance — deferred to radar contract (ADR-0001)", notes: "in-toto named as the popular format."}
  - {name: SupplyChainPolicy, definition: "Requirements for the supply chain defined in software, including authorized actors and expected actions (and expected tests); evaluated against attestations.", attributes: ["authorized actors", "expected actions", "expected tests"], locator: "Part 2 › Concepts › Policy; Testing", kind: stated, tmodel_mapping: "new — machine-checkable Gate exit criterion (R-041/R-042)", notes: ""}
  - {name: TestResult, definition: "Result of a test captured as a signed, verifiable attestation in a metadata store.", attributes: ["test", "result", "signature"], locator: "Part 2 › Concepts › Testing", kind: stated, tmodel_mapping: "Evidence", notes: ""}
  - {name: Identity, definition: "Identity of the actor performing an action — public (e.g. Linux Foundation) or pseudonymous (key-bound); continuously verified (zero trust).", attributes: ["kind (public|pseudonymous)", "key"], locator: "Part 2 › Concepts › Zero Trust", kind: stated, tmodel_mapping: "Party / PROV Agent identity (R-032 trust)", notes: ""}
  - {name: RootOfTrust, definition: "Entity giving the initial trust anchor; chains trust to other keys; hardened with offline keys and thresholds (e.g. Sigstore's TUF root).", attributes: ["keys", "threshold", "online|offline"], locator: "Part 2 › Concepts › Root of Trust", kind: stated, tmodel_mapping: "none (key-management sub-model absent)", notes: ""}
