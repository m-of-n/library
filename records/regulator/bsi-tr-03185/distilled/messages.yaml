schema: "library-messages/v1"
record: bsi-tr-03185
source_version: "1.1.1"
note: >
  The TR defines no encodings. What it does define is the required CONTENT of a set of work
  products and communications — each is listed here as a structure whose fields are taken from
  the requirement text (verbatim field phrases in `source_phrase`). `required` reflects the verb
  governing the field (MUST -> true; SHOULD -> "should"; listed under 'where applicable' ->
  "where-applicable"). Types are ours (derived). constrained_by lists the requirement ids.
  These structures are what a conformance check would inspect; derived JSON Schemas for four of
  them are in distilled/schema/.

structures:
  - id: requirement-row
    name: "TR requirement table row (Part 1 'System of Requirements')"
    locator: "§1.3 Table 4"
    kind: stated
    fields:
      - {name: requirement_id, type: string, required: true, source_phrase: "Abbreviation of the respective requirement"}
      - {name: requirement, type: string, required: true}
      - {name: additional_information, type: "list<string>", required: true, source_phrase: "Sources of further information"}
      - {name: keywords, type: "list<string>", required: true, source_phrase: "Important terms used in the text of the requirement"}
      - {name: glossary, type: "list<string>", required: true, source_phrase: "Terms explained in the glossary"}
    note: "Part 2 rows instead carry {ID, Requirement, Induced by} (§2.3, Tables 35-40)."

  - id: pruefspezifikation-row
    name: "Audit row of BSI's 'Anforderungen und Prüfspezifikation v1.0' spreadsheet"
    locator: "BSI-TR-03185_Hilfsmittel.zip, sheet Anforderungen-Prüfspezifikation (2026-01-09)"
    kind: stated
    fields:
      - {name: ID, type: integer, required: true}
      - {name: Kapitel_Nr, type: string, required: true, note: "German v1.0 chapter numbering (3.1.1 ...), not the EN v1.1.1 numbering (1.3.1.1.1 ...)"}
      - {name: Anforderungs_ID, type: string, required: true}
      - {name: Kapitel, type: string, required: true}
      - {name: Unterkapitel, type: string, required: true}
      - {name: Anforderungstext, type: string, required: true, note: "German requirement text"}
      - {name: gepruefte_Evidenzen, type: string, required: true, source_phrase: "geprüfte Evidenzen/ gesichtete Dokumente/ Referenzen"}
      - {name: Auditergebnis, type: "enum[Pass, Fail]", required: true, source_phrase: "Auditergebnis (Pass, Fail)"}
      - {name: Zusatzinformation, type: string, required: false, source_phrase: "Zusatzinformation zum Auditergebnis"}
    constrained_by: ["certification programme for TR-03185-1 (BSI landing page)"]

  - id: tool-requirements-catalogue
    name: "Requirements catalogue for software tools"
    locator: "§1.3.1.1.1 Table 5"
    kind: stated
    fields:
      - {name: purpose_and_information_processed, required: true, source_phrase: "what the software tools are used for and what information (with the respective protection needs) will be processed with them", constrained_by: [USER.PM.A.1]}
      - {name: user_involvement, required: true, constrained_by: [USER.PM.A.1]}
      - {name: interfaces, required: true, source_phrase: "how the software tools are linked to other applications and IT systems and through which interfaces", constrained_by: [USER.PM.A.1]}
      - {name: execution_systems_and_resources, required: true, constrained_by: [USER.PM.A.1]}
      - {name: vendor_dependency, required: true, constrained_by: [USER.PM.A.1]}
      - {name: functional_requirements, required: true, constrained_by: [USER.PM.A.2]}
      - {name: non_functional_and_security_requirements, required: true, constrained_by: [USER.PM.A.2, USER.PM.A.4]}
      - {name: legal_requirements, required: true, constrained_by: [USER.PM.A.3]}
      - {name: security_features, required: should, source_phrase: "encryption, logging and authentication", constrained_by: [USER.PM.A.4]}
      - {name: hardening_support, required: should, constrained_by: [USER.PM.A.4]}
      - {name: certificate_transparency_and_management, required: should, source_phrase: "display the certificates ... block certificates, remove trusted certificates or add proprietary certificates", constrained_by: [USER.PM.A.4]}
    note: "USER.PM.A.1: MUST decide, SHOULD document — the decision is mandatory, the documentation recommended."

  - id: test-specification
    name: "Test framework conditions and written test specification"
    locator: "§1.3.1.3 Table 10; §1.3.2.4 Table 28"
    kind: stated
    fields:
      - {name: protection_needs_units_test_environments, required: true, constrained_by: [USER.TESTREL.A.1, PROD.TEST.A.1]}
      - {name: requirements_catalogue_stipulations, required: true, constrained_by: [USER.TESTREL.A.1, PROD.TEST.A.1]}
      - {name: representative_test_cases_incl_negative, required: true, constrained_by: [USER.TESTREL.A.1, PROD.TEST.A.1]}
      - {name: known_vulnerability_checks, required: true, constrained_by: [PROD.TEST.A.1]}
      - {name: security_tests_from_requirements_and_threat_model, required: true, constrained_by: [PROD.TEST.A.2]}
      - {name: expected_results, required: should, constrained_by: [USER.TESTREL.A.2, PROD.TEST.A.3]}
      - {name: release_criteria, required: should, constrained_by: [USER.TESTREL.A.2, PROD.TEST.A.3]}
      - {name: release_rejection_procedure, required: should, constrained_by: [USER.TESTREL.A.2, PROD.TEST.A.3]}
      - {name: omitted_test_case_justification, required: should, constrained_by: [PROD.TEST.A.9, USER.TESTREL.A.12]}

  - id: penetration-testing-concept
    name: "Penetration testing concept"
    locator: "USER.TESTREL.A.13; PROD.TEST.A.15"
    kind: stated
    fields:
      - {name: success_criteria, required: should, constrained_by: [USER.TESTREL.A.13, PROD.TEST.A.15]}
      - {name: test_methods, required: should, constrained_by: [USER.TESTREL.A.13, PROD.TEST.A.15]}
      - {name: classified_findings, required: should, constrained_by: [USER.TESTREL.A.13, PROD.TEST.A.15]}

