      - {name: likelihood_and_impact, required: should, constrained_by: [PROD.DEV.C.1]}
      - {name: sensitive_data_flows, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: trust_boundaries, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: processes, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: data_storage, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: external_security_dependencies, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: communication_protocols, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: debug_interfaces, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: threat_severity, required: where-applicable, source_phrase: "as determined by a vulnerability assessment system (e. g. CVSS)", constrained_by: [PROD.DEV.C.2]}
      - {name: mitigations, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: security_issues_identified, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: external_code_dependencies, required: where-applicable, constrained_by: [PROD.DEV.C.2]}
      - {name: review_record, required: true, constrained_by: [PROD.DEV.C.3, PROD.DEV.C.4]}
