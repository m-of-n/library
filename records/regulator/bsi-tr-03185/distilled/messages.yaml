      - {name: safeguarding_measures, required: true, constrained_by: [PROD.DEV.B.3]}
      - {name: objects_affected_by_attacks, required: true, constrained_by: [PROD.DEV.B.3]}
      - {name: exposure, required: should, source_phrase: "accessible from the outside ... or from the inside ... or both", constrained_by: [PROD.DEV.B.3]}
      - {name: environment_impact, required: should, constrained_by: [PROD.DEV.B.3]}
      - {name: potential_users_and_protected_objects, required: should, constrained_by: [PROD.DEV.B.3]}
      - {name: crosses_trust_boundary, type: boolean, required: should, constrained_by: [PROD.DEV.B.3]}
      - {name: assumptions_and_applicable_threats, required: should, constrained_by: [PROD.DEV.B.3]}
      - {name: roles_and_authorizations, required: should, constrained_by: [PROD.DEV.B.3]}
      - {name: security_capabilities_incl_io_validation_and_error_handling, required: should, constrained_by: [PROD.DEV.B.3]}
      - {name: third_party_products_used, required: should, constrained_by: [PROD.DEV.B.3]}
      - {name: external_usage_documentation, required: should, constrained_by: [PROD.DEV.B.3]}
      - {name: threat_mitigation_description, required: should, source_phrase: "how the design mitigates the threats identified in the threat model", constrained_by: [PROD.DEV.B.3]}

  - id: threat-model
