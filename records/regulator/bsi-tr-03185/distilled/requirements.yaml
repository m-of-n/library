    locator: "§1.3.2.3.8 Code management, Table 25: Requirements Producer Development Code Management"
    text: "The source code of the development project MUST be managed using an appropriate version control system. The following aspects in particular must be considered: • Access to the version control MUST be regulated and defined. • It MUST be specified when changes to the source code should be saved as a separate version in the version control system. • All changes MUST be traceable and reversible. • Version management including data MUST be part of a data backup concept and MUST NOT be carried out without data backup."
