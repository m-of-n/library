    locator: "§1.3.1.1.2 Acquisition, Table 6: Requirements User Project Management Acquisition"
    text: "When purchasing software tools, the appropriate software MUST be selected based on the requirements catalogue. The software tool selected MUST be acquired from a trusted source. 3 The trusted source SHOULD provide a method of verifying the integrity of the software tool. Furthermore, the software tool SHOULD be acquired with an appropriate maintenance contract or a comparable commitment from the manufacturer or software provider. These contracts or commitments SHOULD, in particular, guarantee that any vulnerabilities arising in the software tools will be promptly fixed throughout the entire period of use."
    expects_deliverables:
      - "tool selection record against requirements catalogue"
      - "trusted-source / integrity verification record"
      - "maintenance contract or manufacturer commitment"
    verification: "document review: inspect tool selection record against requirements catalogue; trusted-source / integrity verification record; maintenance contract or manufacturer commitment"
