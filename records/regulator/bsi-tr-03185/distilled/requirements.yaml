  - id: "bsi-tr-03185#USER.PM.A.4"
    designator: "USER.PM.A.4"
    normativity: recommendation
    verb: "SHOULD"
    actor: "institution"
    nature: deliverable
    phase: "governance"
    locator: "§1.3.1.1.1 General, Table 5: Requirements User Project Management General"
    text: "The institution SHOULD consider the following security requirements in the requirements catalogue for the software tools: • The software tools SHOULD include general security features such as encryption, logging and authentication that are required in the application context. • The software tools SHOULD enable the hardening capabilities of the operating environment to be used. In particular, the hardening functions of the planned operating system and/or the anticipated execution environment SHOULD be considered (e.g. closing any ports that are not required, setting user permissions to a minimum). • If the software tools use (cryptographic) certificates, they SHOULD offer the option to display the certificates in a transparent manner. Moreover, it SHOULD be possible to block certificates, remove trusted certificates or add proprietary certificates. • The functions of the software tools arising from the security requirements SHOULD be used in the software operation."
    expects_deliverables:
      - "requirements catalogue security requirements section"
    verification: "document review: inspect requirements catalogue security requirements section"
    kind: stated
    testable: yes
    pruefspezifikation_adjustment: "b"
