  - id: "bsi-tr-03185#USER.PATCH.A.15"
    designator: "USER.PATCH.A.15"
    normativity: requirement
    verb: "SHOULD; MUST"
    actor: "manufacturer as software user"
    nature: deliverable
    phase: "operations/response"
    locator: "§1.3.1.5 Patch and change management, Table 12: Requirements User Patch and Change Management"
    text: "IT systems and software tools SHOULD be updated regularly. Patches SHOULD essentially be applied promptly after release. The following aspects have to be noted here: • Patches MUST be evaluated promptly after release and prioritised accordingly in accordance with the patch and change management concept. For the evaluation, a check SHOULD be carried out to ascertain whether any known vulnerabilities exist for this patch. • A decision MUST be taken whether to apply the patch: • If a patch is applied, checks SHOULD be carried out to ascertain if it was successfully applied promptly to all the relevant systems. • If a patch is not applied, the decision and reasons MUST be documented. If software tools will be used that are no longer supported by the manufacturer or for which support is no longer available, the secure operation of such tools in future MUST be checked. If this is not the case, such software tools MUST cease to be used."
    expects_deliverables:
      - "patch evaluation and prioritisation record"
      - "documented decision and reasons when a patch is not applied"
    verification: "document review: inspect patch evaluation and prioritisation record; documented decision and reasons when a patch is not applied"
    kind: stated
    testable: partial
    pruefspezifikation_adjustment: "b"
    maps_to:
      - ref: "IT-Grundschutz-Kompendium, Module OPS.1.1.3"
        published_by: "in-document 'Additional information' (chapter-level)"
      - ref: "OPS.1.1.3.A15"
        standard: "BSI IT-Grundschutz-Kompendium 2023"
        published_by: "BSI TR-03185 Anforderungen und Prüfspezifikation v1.0 (2026-01-09), sheet Anforderungen-Quellen"
    status: active
