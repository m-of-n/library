  - id: "bsi-tr-03185#PROD.DEV.B.3"
    designator: "PROD.DEV.B.3"
    normativity: requirement
    verb: "MUST; SHOULD"
    actor: "manufacturer as software producer"
    nature: deliverable
    phase: "design"
    locator: "§1.3.2.3.2 Design, Table 19: Requirements Producer Development Design"
    text: "A secure design MUST be created for each product interface. This MUST contain: • communication via the interface (e.g. data/control flows) • safeguarding measures, and • objects affected by attacks. The following SHOULD be observed: • A note whether the interface is accessible from the outside (from other products) or from the inside (from other product components), or both; • Information security impact of the product’s information security environment on the external interface • Potential users of the interface and the protected objects that can be accessed through it (directly or indirectly) • A determination of if access to the interface crosses a trust boundary • IT security considerations, assumptions and/or conditions relating to the use of the interface within the IT security environment of the product, including applicable threats • The IT security roles, authorizations/rights and access authorizations required to use the interface and to access the aforementioned protected objects • The IT security capabilities and/or compensation mechanisms to protect the interface and the aforementioned protected objects, including the validation of both inputs and outputs and error handling • The use of third-party products to implement the interface and the capabilities of such with respect to IT security • Documentation that describes how to use the interface when it is accessible from outside, and • A description of how the design mitigates the threats identified in the threat model."
    expects_deliverables:
      - "secure interface design per product interface"
    verification: "document review: inspect secure interface design per product interface"
    kind: stated
    testable: yes
    maps_to:
      - ref: "IT-Grundschutz-Kompendium, Module CON.8"
