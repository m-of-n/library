    text: "Software testing MUST be carried out during development and the source code, among others, must be checked for bugs (e.g. using a code review). The business owners of the client or commissioning department SHOULD be involved in this process. The development-related tests MUST include • the functional and non-functional requirements of the software • and must also cover negative testing. • Additionally, check all the critical limits of the input and data types, • identify non-observed coding standards, and • ascertain to what extent the implementation is adequately protected against the threats. Test data SHOULD be carefully selected and protected. Moreover, an automatic static code analysis SHOULD be performed. The software MUST be tested in a test and development environment that is separate from the production environment. In addition, testing MUST be carried out to evaluate if the system requirements for the intended software are sufficient."
    expects_deliverables:
      - "development test records incl. negative tests"
