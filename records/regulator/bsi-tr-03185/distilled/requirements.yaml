    text: "The institution SHOULD define mandatory regulations and summarise in a document how the software tools should be used and operated. All the relevant responsible persons, officers and employees of the institution SHOULD be aware of the document, which should form the basis for their work and actions. The document SHOULD also include a user manual that explains how to (securely) use and administer the software tools. Regular, random checks SHOULD be carried out to ensure that employees are complying with the stipulations in the document. The document SHOULD be updated regularly."
