  - id: "bsi-tr-03185#USER.PM.A.1"
    designator: "USER.PM.A.1"
    normativity: requirement
    verb: "MUST; SHOULD"
    actor: "institution"
    nature: deliverable
    phase: "governance"
    locator: "§1.3.1.1.1 General, Table 5: Requirements User Project Management General"
    text: "Before an institution introduces (new) software tools, it MUST decide and SHOULD document: • what the software tools are used for and what information (with the respective protection needs 1) will be processed with them, • how users should be involved in requirements gathering and what support they should receive during implementation, • how the software tools are linked to other applications and IT systems and through which interfaces, • on which IT systems the software tools will be executed and the resources required to execute the software tools, and • whether the institution is now dependent on a manufacturer if it uses such software tools. Security aspects MUST be also considered here."
    expects_deliverables:
      - "documented decision on introduction of software tools (purpose, information processed and protection needs, interfaces, execution systems, vendor dependency, security aspects)"
    verification: "document review: inspect documented decision on introduction of software tools (purpose, information processed and protection needs, interfaces, execution systems, vendor dependency, security aspects)"
    kind: stated
    testable: yes
    pruefspezifikation_adjustment: "b"
