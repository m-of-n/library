    text: "The software tools available on the market SHOULD be reviewed based on the requirements catalogue. They SHOULD be compared using an assessment scale. The next step SHOULD be to ascertain if the software tools selected fulfil the requirements of the institution. If several software tools are available, user acceptance and the additional effort for training or migration, for example, SHOULD also be considered. The responsible business owners SHOULD select a suitable software tool with the IT operations department based on the assessments and test results."
