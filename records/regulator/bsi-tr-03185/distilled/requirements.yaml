  - id: "bsi-tr-03185#PROD.FIX.A.8"
    designator: "PROD.FIX.A.8"
    normativity: requirement
    verb: "MUST; SHOULD"
    actor: "manufacturer as software producer"
    nature: deliverable
    phase: "operations/response"
    locator: "§1.3.2.6 Vulnerability management, Table 31: Requirements Producer Vulnerability Management"
    text: "Information security-related issues MUST be addressed/managed using a specific process. Based on the analysis, a decision MUST be taken as to whether the issue should reported/disclosed 6. An acceptable residual risk level MUST be established that will be achieved when managing the problem. Potential ways of fixing the issue include the following: • fix (patch/code change), • creation of a plan to fix the issue, • move to a future solution/version, or • a decision to not fix the problem if the residual risk appears acceptable. The following MUST apply: • other (relevant) procedures must be notified of the problem. This applies to the actual product and other products. • third-party providers will be notified if the issues affect their embedded source code. If the issues are resolved, recommendations SHOULD be made to avoid future problems. The process MUST include a periodic review (during each release or iteration cycle as a minimum) of known/open safety-related issues."
    expects_deliverables:
      - "issue management records (disclosure decision, accepted residual risk, chosen remedy)"
      - "periodic review of open issues"
    verification: "document review: inspect issue management records (disclosure decision, accepted residual risk, chosen remedy); periodic review of open issues"
    kind: stated
    testable: yes
    maps_to:
