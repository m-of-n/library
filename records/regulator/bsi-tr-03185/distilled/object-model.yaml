schema: "library-object-model/v1"
record: bsi-tr-03185
source_version: "1.1.1"
question: "What objects (entity types) and relationship edges does BSI TR-03185 assume or define?"
note: >
  Separate pass over .cache/bsi-tr-03185.txt (and, for the audit objects, BSI's Prüfspezifikation
  spreadsheet). kind: stated = the TR names the thing and gives it a role or definition; inferred =
  the TR presupposes it without naming it as such. tmodel_mapping targets ARCH-0001 v0.2.0 classes
  (§1 layers, §2b Party, §3b LifecyclePhase, §4 Assertion/Review, §5 MitigationInstance/Review) and the
  DL-0009 proposals (Requirement, Gate, WorkProduct, Evidence, SDL/SecurityProgram, governed view).

objects:
  # --- organisation, parties, roles ---
  - {name: Manufacturer, definition: "natural or legal person ... responsible for producing software, i.e. developing, creating, delivering/providing and supporting such software", attributes: [perspective], locator: "§1.2.1 'Manufacturer'; Part 2 Table 34 (CRA-aligned definition)", kind: stated, tmodel_mapping: "Party (§2b) with manufactured_by edge from Product", notes: "Part 1 and Part 2 define Manufacturer differently: Part 2 copies the CRA Art. 3(13) wording (markets under its name or trademark). The merged v1.1.1 keeps both definitions without reconciling them."}
  - {name: Perspective, definition: "the perspective from which a manufacturer operates in the software lifecycle: Software user (tools used for production) or Software producer (software to be produced); the producer perspective includes the user perspective at all times", attributes: ["value ∈ {software-user, software-producer}"], locator: "§1.2.1 'Perspectives'; Figure 1", kind: stated, tmodel_mapping: "new — a facet/role on Party relative to a Product (tool consumer vs product producer); closest is the relational-role edge rule of §2b", notes: "The organising axis of Part 1: USER.* vs PROD.* requirement ids."}
  - {name: Steward, definition: "A legal person, other than a manufacturer, that has the purpose or objective of systematically providing support on a sustained basis for the development of specific products with digital elements, qualifying as FOSS and intended for commercial activities", attributes: [], locator: "§2.2.2 Table 34", kind: stated, tmodel_mapping: "Party (§2b), intrinsic classification 'oss-steward'", notes: "CRA Art. 3(14) concept."}
  - {name: Maintainer, definition: "A person responsible for managing and overseeing a software project", attributes: [], locator: "§2.2.2 Table 34", kind: stated, tmodel_mapping: "Party (person) with maintains edge to OSSProject", notes: ""}
  - {name: Contributor, definition: "A person ... who participates in the development of a software project by providing code, documentation, bug reports, or other forms of support", attributes: [], locator: "§2.2.2 Table 34", kind: stated, tmodel_mapping: "Party (person)", notes: ""}
  - {name: Role, definition: "roles and responsibilities for software development activities (requirements & change management, design & architecture, information security, implementation, testing); person with overall responsibility; person responsible for information security per project; developer; tester; CISO; business owner; IT Operations; responsible organisational unit", attributes: [name, responsibilities, holder], locator: "PROD.PM.C.1; USER.PM.D.1-D.3; PROD.TEST.A.5; Glossary 'Business owner'", kind: stated, tmodel_mapping: "Party role edge (§2b relational roles); DL-0009 document owner/approver is a Party role", notes: "Roles carry duties, not just labels: CISO MUST be involved in security-affecting changes (USER.PATCH.A.8)."}
  - {name: SeparationOfDuties, definition: "incompatible tasks such as operational and control functions distributed among different individuals; defined and documented; representatives also subject", attributes: [incompatible_pairs], locator: "USER.PM.D.4; PROD.PM.C.2; PROD.TEST.A.5", kind: stated, tmodel_mapping: "new — constraint over Role assignments (cf. Review independence in §5)", notes: "developer ≠ tester (PROD.TEST.A.5); design reviewer not involved in design (PROD.DEV.E.3)."}
  - {name: Training, definition: "adequate training to perform duties; topic list for developers; courses and results documented", attributes: [topics, date, result], locator: "USER.PM.D.5; PROD.PM.C.5; PROD.PM.C.6", kind: stated, tmodel_mapping: "new (WorkProduct/Evidence of a training-phase Requirement)", notes: ""}
  - {name: ISMS, definition: "information security concept or ISMS (e.g. pursuant to the BSI IT-Grundschutz) within which IT provision is handled; outside the scope of Part 1", attributes: [], locator: "§1.2.2 'ISMS'", kind: stated, tmodel_mapping: "none (external context)", notes: "TR is positioned as an enrichment of IT-Grundschutz, not a standalone management system."}

  # --- process structure ---
  - {name: Process, definition: "Processes summarise the actions required to fulfil or implement the requirements for a secure software lifecycle and can be assigned to the perspectives", attributes: ["name ∈ {project management, documentation, development, testing and release, installation, patch and change management, delivery, vulnerability management, decommissioning}", perspective], locator: "§1.2.1 'Processes and requirements'; Figure 1", kind: stated, tmodel_mapping: "LifecyclePhase (§3b) — approximately; DL-0009 SDL phase", notes: "Explicitly NOT a chronological order (§1.2.2 'Project planning'); processes are groupings, not gates."}
  - {name: ProcessArea, definition: "Part 2 requirement groupings: Governance (GV), Legal (LE), Quality (QA), Build and Release (BR), Vulnerability Management (VM), Decommissioning (DE)", attributes: [code, name], locator: "§2.3.1-§2.3.6", kind: stated, tmodel_mapping: "LifecyclePhase / canonical phase (MAP-0001)", notes: ""}
  - {name: ProcessModel, definition: "Process models (e.g. waterfall model, V-model, agile development) stipulate specified action steps and the sequence of such to structure and plan the software development process", attributes: [type, schedule], locator: "Glossary; §1.2.2 'Process model'; PROD.PM.A.5, A.7, A.8", kind: stated, tmodel_mapping: "DL-0009 SDL/SecurityProgram (the org's own phase/gate plan)", notes: "TR mandates that one be defined and security requirements integrated, without prescribing which."}
  - {name: Requirement, definition: "a TR requirement: id, requirement text, additional information (sources), keywords, glossary terms; Part 2: id, requirement, induced-by", attributes: [id, text, modal_verb, additional_information, keywords, glossary, induced_by], locator: "§1.3 Table 4; §2.3", kind: stated, tmodel_mapping: "Requirement (DL-0009 R-042/R-044)", notes: "Native hierarchical ids <perspective>.<process>.<group>.<n>."}
  - {name: ReferenceFramework, definition: "the norms, standards and frameworks the requirements are compiled from / induced by: IT-Grundschutz-Kompendium 2023, NESAS FS.16 v2.3, DIN EN IEC 62443-4-1:2018-10, NIST SP 800-218 v1.1; Part 2 adds CRA, OpenChain ISO/IEC 18974, OpenCRE, OpenSSF OSPS Baseline 2025-02-25, SLSA 1.1, TR-03185 v1.0", attributes: [name, version], locator: "§1.3; §2.3", kind: stated, tmodel_mapping: "library record (published_by Party) — the crosswalk target of R-044", notes: ""}
  - {name: RequirementMapping, definition: "Additional information row (chapter-level); Induced-by cell ('neither directly derived from nor equivalent to'); Prüfspezifikation source columns (requirement-level)", attributes: [target_framework, target_ref, granularity, strength], locator: "§1.3 Table 4; §2.3 'Induced by'; Prüfspezifikation sheet Anforderungen-Quellen", kind: stated, tmodel_mapping: "maps_to edge of R-044 — needs a strength attribute", notes: "BSI explicitly denies equivalence for Part 2 mappings: an R-044 maps_to must be able to say 'induced-by', not only 'equivalent'."}

  # --- products, tools, environments ---
  - {name: SoftwareProduct, definition: "the software to be produced / product with digital elements", attributes: [version, protection_needs, security_profile], locator: "§1.2.1; §1.3.2; Part 2 Table 34", kind: stated, tmodel_mapping: "Product / ProductInstance (§1.1)", notes: ""}
  - {name: SoftwareTool, definition: "tools that support the software lifecycle (e.g. for project management, documentation, development, testing, CI/CD); explicitly incl. AI-based code assistants, vulnerability scanners and LLMs", attributes: [purpose, licence, interfaces, plugins, update_mechanism, support_status], locator: "§1.3.1; §0.1", kind: stated, tmodel_mapping: "Component (§1.1) used by the development Environment — new 'tooling' role", notes: "The whole USER.* half of Part 1 is about these."}
  - {name: ToolChain, definition: "the types of software tools that are integrated into tool chains and how they are interconnected", attributes: [members, interconnections], locator: "USER.PM.C.2", kind: stated, tmodel_mapping: "composed_of / connected_via over Components (§1.1)", notes: ""}
  - {name: Environment, definition: "development, build, test and production environments, operated separately", attributes: ["type ∈ {development, build, test, production}", access_points, integrity_checks], locator: "USER.PM.C.5-C.10; USER.TESTREL.A.7; PROD.DEV.F.2; PROD.TEST.A.11", kind: stated, tmodel_mapping: "Deployment→Environment (§1.1) — but here the dev/build environment is itself an attack surface", notes: ""}
  - {name: SigningKey, definition: "Private keys for the code signature", attributes: [protection], locator: "USER.PM.C.6; PROD.PM.A.13 ('keys for signing')", kind: stated, tmodel_mapping: "Asset (§3) of the dev environment", notes: ""}
  - {name: RequirementsCatalogue, definition: "catalogue of functional, non-functional and in particular security requirements for software tools (user) / information security requirements for the product (producer)", attributes: [functional, non_functional, security, legal], locator: "USER.PM.A.2-A.5; PROD.PM.A.1-A.3; PROD.DEV.B.1", kind: stated, tmodel_mapping: "WorkProduct (DL-0009); feeds Requirement instances on a Product", notes: "TR excludes requirements definition for the product itself from scope (§1.2.1, §1.3.2 NOTE) yet requires the security requirements be identified and documented (PROD.PM.A.2)."}
  - {name: ProtectionNeeds, definition: "protection needs of an object with respect to the basic values (availability, integrity, confidentiality), based on the severity of the damage if violated; cannot be quantified", attributes: [confidentiality, integrity, availability], locator: "Glossary 'Protection needs'; USER.PM.A.1; PROD.PM.A.13", kind: stated, tmodel_mapping: "data classification (§1.2) / Asset CIA properties", notes: "Qualitative only — 'cannot be quantified'."}
  - {name: SecurityProfile, definition: "Protection needs of data and functions regarding confidentiality, integrity and availability", attributes: [], locator: "Glossary; PROD.DEV.B.1; PROD.DEV.C.1", kind: stated, tmodel_mapping: "aggregate of data classification over a Product", notes: ""}

  # --- design and threat modelling ---
  - {name: ThreatModel, definition: "analysis of the product with respect to potential threats; basis for all security-relevant aspects in subsequent activities", attributes: [data_flows, trust_boundaries, processes, data_storage, external_dependencies, protocols, debug_interfaces, threats, severity, mitigations, issues, review_state], locator: "§1.3.2.3.3 Table 20 PROD.DEV.C.1-C.5", kind: stated, tmodel_mapping: "the tmodel threat-model instance (governed view R-043 over Product + DFD + ThreatInstance)", notes: "C.2's content list is a DFD element set: data flows, processes, data storage, trust boundaries, external entities."}
  - {name: Threat, definition: "potential threats identified from security profile, security catalogue and deployment environment; assessed by likelihood and impact; severity by a vulnerability assessment system (e.g. CVSS)", attributes: [likelihood, impact, severity], locator: "PROD.DEV.C.1; PROD.DEV.C.2", kind: stated, tmodel_mapping: "ThreatInstance (§1.3) + RiskScore", notes: ""}
  - {name: TrustBoundary, definition: "A limit at which the data changes the trust level", attributes: [], locator: "Glossary; PROD.DEV.B.3; PROD.DEV.C.2; PROD.DEV.A.4", kind: stated, tmodel_mapping: "TrustBoundary (§1.1)", notes: "Input testing required 'if the trust boundary is exceeded' (A.4)."}
  - {name: DataFlow, definition: "data flows of sensitive information; communication via the interface (data/control flows)", attributes: [sensitivity], locator: "PROD.DEV.C.2; PROD.DEV.B.3", kind: stated, tmodel_mapping: "DataFlow (§1.2)", notes: ""}
  - {name: ProductInterface, definition: "each product interface, for which a secure design MUST be created", attributes: [exposure, crosses_trust_boundary, users, protected_objects, roles, capabilities, third_party_products], locator: "PROD.DEV.B.3", kind: stated, tmodel_mapping: "AttackSurface / Interconnect (§1.1)", notes: ""}
  - {name: ProtectedObject, definition: "objects affected by attacks / protected objects that can be accessed through an interface", attributes: [], locator: "PROD.DEV.B.3", kind: stated, tmodel_mapping: "Asset (§3)", notes: ""}
  - {name: SoftwareDesign, definition: "software design determining how software is created from the requirements; considers requirements catalogue, security profile and threat-modelling results; system design documented", attributes: [interfaces, architecture, principles_applied], locator: "§1.3.2.3.2 Table 19 PROD.DEV.B.1-B.6", kind: stated, tmodel_mapping: "Product structure (§1.1) + DFD (§1.2) as designed", notes: ""}
  - {name: SecureDesignPrinciple, definition: "input validation, least privilege, security by default, protection on failure, confidentiality, trustworthy procedures, logging, removal of dev info, attack-surface reduction, error handling, privacy by design; architecture principles domain separation, encapsulation, layering", attributes: [name], locator: "PROD.DEV.B.4; PROD.DEV.D.2", kind: stated, tmodel_mapping: "generic Mitigation (§1.3, D3FEND-like) — kind: technical/process (R-040)", notes: ""}
  - {name: SecurityArchitecture, definition: "secure software architecture with layers each providing an information security mechanism", attributes: [layers], locator: "PROD.DEV.D.1-D.3", kind: stated, tmodel_mapping: "Product structure (§1.1) + MitigationInstance per layer", notes: ""}
  - {name: DesignReview, definition: "review that all specified security requirements for the system design are fulfilled, by an individual not involved in the design and/or automated tools", attributes: [sufficient_requirements, insufficient_requirements, threats_vs_interfaces, principle_deviations, reviewer], locator: "§1.3.2.3.5 Table 22", kind: stated, tmodel_mapping: "Review (§4/§5) with independence constraint", notes: ""}

  # --- implementation, build, supply chain ---
  - {name: CodingStandard, definition: "mandatory documented specifications regarding coding standards; minimum content listed", attributes: [banned_constructs, tools, techniques, input_testing, error_handling], locator: "PROD.DEV.A.4; PROD.PM.A.9", kind: stated, tmodel_mapping: "WorkProduct; generic Mitigation kind=process (R-040)", notes: ""}
  - {name: ThirdPartyComponent, definition: "frameworks, middleware, libraries, modules from external and internal sources", attributes: [source, integrity, maintenance_status, version], locator: "§1.3.2.3.7 Table 24", kind: stated, tmodel_mapping: "Component (§1.1) supplied_by Party", notes: ""}
  - {name: TrustedSource, definition: "source each institution determines to be trustworthy (e.g. manufacturer's download site or original installation media)", attributes: [], locator: "USER.PM.B.2 fn 3; PROD.DEV.G.1 fn 4", kind: stated, tmodel_mapping: "Party trust attribute / supply-chain provenance (deferred to radar contract, §4)", notes: ""}
  - {name: VersionControlSystem, definition: "appropriate version control system for the source code; regulated access; traceable and reversible changes; backed up", attributes: [access_rules, versioning_policy, backup], locator: "PROD.DEV.H.1; PROD.PM.A.11; PROD.DEV.I.4", kind: stated, tmodel_mapping: "Component of the dev Environment", notes: ""}
  - {name: Build, definition: "reproducible build produced by an automated build tool from VCS-originated data; build logs stored", attributes: [build_log, inputs, reproducible], locator: "PROD.DEV.I.3; PROD.DEV.I.4; BR.06", kind: stated, tmodel_mapping: "supply-chain provenance (SLSA), deferred per §4/F7", notes: ""}
  - {name: SBOM, definition: "machine-processable file that contains supply chain relationships and details of the components used in a software product", attributes: [], locator: "Glossary; PROD.DEV.L.2; USER.INST.8; QA.01", kind: stated, tmodel_mapping: "composed_of edges over Component (§1.1); external SBOM record", notes: "PROD.DEV.L.2 'proof of origin ... (e.g. in the form of a SBOM)' to be made available to third parties per manufacturer policy."}
  - {name: Inventory, definition: "up-to-date inventory of systems, tools and licences incl. security-relevant settings (user); per-release archive of essential files and information (producer)", attributes: [], locator: "USER.INST.8; PROD.DEV.L.1", kind: stated, tmodel_mapping: "Component/Deployment registry", notes: ""}

  # --- verification and release ---
  - {name: TestSpecification, definition: "framework conditions for testing, expected results, release criteria, release-rejection procedure", attributes: [see messages.yaml test-specification], locator: "USER.TESTREL.A.1-A.2; PROD.TEST.A.1-A.3", kind: stated, tmodel_mapping: "WorkProduct; Gate exit criteria (R-041)", notes: ""}
  - {name: Test, definition: "functional, non-functional/security-specific, negative, regression, penetration, development-related (code review, static analysis) tests", attributes: ["type", result, environment], locator: "§1.3.1.3; §1.3.2.3.6; §1.3.2.4; §1.3.2.4.1", kind: stated, tmodel_mapping: "Evidence (DL-0009 R-042) for MitigationInstance verification (§5)", notes: ""}
  - {name: PenetrationTestingConcept, definition: "documents the success criteria and the test methods", attributes: [success_criteria, methods], locator: "USER.TESTREL.A.13; PROD.TEST.A.15", kind: stated, tmodel_mapping: "WorkProduct", notes: ""}
  - {name: Finding, definition: "findings from development-related testing, threat modelling, penetration tests — documented and monitored", attributes: [classification, status], locator: "PROD.DEV.F.3; PROD.DEV.C.5; PROD.TEST.A.15", kind: stated, tmodel_mapping: "Finding (§1.3)", notes: ""}
  - {name: Release, definition: "release of the software by the responsible organisational unit once tests succeed and all security-related issues are conclusively addressed; documented; assigned to a specific build version with a unique version number", attributes: [build_version, release_record, integrity_mechanism], locator: "PROD.TEST.A.17; PROD.REL.1-2; PROD.PM.A.14; Glossary 'Release'", kind: stated, tmodel_mapping: "Gate (R-041) 'release' + ProductInstance version (§3b)", notes: "The TR's only explicit gate."}
  - {name: ReleaseCriteria, definition: "release criteria set out in writing", attributes: [], locator: "USER.TESTREL.A.2; PROD.TEST.A.3", kind: stated, tmodel_mapping: "Gate.exit_criteria (R-041)", notes: ""}
  - {name: VersionIdentifier, definition: "A label assigned to a specific release of the software; unique, monotonically increasing", attributes: [], locator: "Glossary; PROD.REL.2; BR.02", kind: stated, tmodel_mapping: "ProductInstance version", notes: ""}
  - {name: UserDocumentation, definition: "security instructions for installation/configuration/use, product security strategy, guaranteed features, environment requirements, hardening guidance, account management, version-specific, decommissioning", attributes: [see messages.yaml user-documentation], locator: "§1.3.2.2.2 Table 17; PROD.DECOM.1", kind: stated, tmodel_mapping: "governed view (R-043) + WorkProduct; MitigationInstance kind=documentation (R-040)", notes: ""}
  - {name: ProjectDocumentation, definition: "project, functional and interface documentation incl. software architecture and threat modelling; enables traceability of decisions and evidence of results", attributes: [], locator: "§1.3.2.2; PROD.DOC.A.1", kind: stated, tmodel_mapping: "governed view (R-043)", notes: ""}

  # --- vulnerability management ---
  - {name: SecurityIssue, definition: "information security-related issue with the product (incl. vulnerabilities); investigated, analysed, managed, possibly disclosed", attributes: [source, applicability, verifiability, severity, affected_versions, root_cause, status], locator: "§1.3.2.6 Table 31 PROD.FIX.A.3-A.9", kind: stated, tmodel_mapping: "Finding/Vulnerability (§1.3)", notes: "Lifecycle in state-machine.yaml SM1."}
  - {name: Vulnerability, definition: "a fault or bug in an IT system or institution relating to security ... renders an object vulnerable to threats", attributes: [], locator: "Glossary 'Vulnerability'", kind: stated, tmodel_mapping: "Vulnerability (§1.3)", notes: "Defined to include organisational faults, not just code."}
  - {name: ReportingPoint, definition: "A reporting point for information security-related issues with the product", attributes: [contact, private_channel], locator: "PROD.FIX.A.3; VM.01", kind: stated, tmodel_mapping: "new (Party role 'psirt' / contact endpoint)", notes: ""}
  - {name: Solution, definition: "Approach/(bundle of) measures from the manufacturer's perspective to address an accepted vulnerability", attributes: ["remedy ∈ {fix, plan, future-version, no-fix}"], locator: "Glossary 'Solution'; PROD.FIX.A.8, A.9", kind: stated, tmodel_mapping: "MitigationInstance (§5) — remedy choice ≈ DEC-009 mitigation lifecycle states", notes: ""}
  - {name: ResidualRisk, definition: "An acceptable residual risk level MUST be established that will be achieved when managing the problem", attributes: [level, accepted_by], locator: "PROD.FIX.A.8", kind: stated, tmodel_mapping: "RiskScore (§3) after treatment + Review acceptance", notes: ""}
  - {name: ITSecurityUpdate, definition: "A solution prepared for delivery ... provided to users to fix a vulnerability; always involves a code change (patch)", attributes: [applicable_versions, instructions, impact, verification, risk_if_not_applied, channel], locator: "Glossary; PROD.FIX.A.1, A.10, A.11", kind: stated, tmodel_mapping: "MitigationInstance kind=technical delivered as ProductInstance update", notes: ""}
  - {name: Patch, definition: "a bug fix for executable programs; may contain minor functional extensions; contains a code change incl. essential information", attributes: [], locator: "Glossary 'Patch'; USER.PATCH.*", kind: stated, tmodel_mapping: "ProductInstance version delta", notes: ""}
  - {name: UpdateTimeWindow, definition: "documentation that defines time windows for the provision of IT security updates", attributes: [impact, public_knowledge, exploit_published, scope_and_mitigations], locator: "PROD.FIX.A.1", kind: stated, tmodel_mapping: "new — SLA policy object on the SDL program", notes: "No numeric values set by the TR."}
  - {name: ChangeRequest, definition: "change requests (CR/request for changes/RfCs) recorded, documented and checked by the business owner", attributes: [], locator: "USER.PATCH.A.10; PROD.PM.A.12", kind: stated, tmodel_mapping: "Assertion/Activity (§4) — change tracking of the governed view", notes: ""}

  # --- OSS (Part 2) ---
  - {name: OSSProject, definition: "an Open Source Software project (upstream repository/organisation where development takes place, or downstream fork)", attributes: [repository, website, licence, contribution_guide, security_contacts], locator: "§2.1; §2.2.2-§2.2.3; Tables 35-40", kind: stated, tmodel_mapping: "Component (shared) + Party (project as organisation)", notes: ""}
  - {name: Repository, definition: "A storage location, often managed by a version control system, where the project's code, documentation, and other resources are stored", attributes: [access_controls], locator: "Glossary 'Repository'; GV.02; BR.05", kind: stated, tmodel_mapping: "Component of the dev Environment", notes: ""}
  - {name: License, definition: "A legal document that defines the terms under which the software can be used, modified, and distributed", attributes: [], locator: "Glossary; LE.01-02; USER.INST.3", kind: stated, tmodel_mapping: "none (legal attribute of Component)", notes: ""}
  - {name: ReleasedSoftwareAsset, definition: "Deliverables provided to users as part of a release", attributes: [integrity, authenticity], locator: "Glossary; BR.01-BR.05", kind: stated, tmodel_mapping: "ProductInstance artefact", notes: ""}
  - {name: ReleaseLog, definition: "a descriptive log of functional and security modifications", attributes: [], locator: "BR.04", kind: stated, tmodel_mapping: "governed view (change history)", notes: ""}

  # --- assurance (Prüfspezifikation / certification) ---
  - {name: Audit, definition: "audit of an organisation against TR-03185 Part 1 by a BSI-certified IT-Grundschutz audit team leader, using the Prüfspezifikation", attributes: [auditor, scope, date], locator: "BSI landing page 'Zertifizierung nach TR-03185, Teil 1'; Prüfspezifikation sheet", kind: stated, tmodel_mapping: "Review (§4/§5) at program level; deferred audit model (#19)", notes: "Certification offered only for Part 1 (German v1.0); not for Part 2."}
  - {name: AuditResult, definition: "per-requirement audit result Pass/Fail with checked evidence and additional information", attributes: ["result ∈ {Pass, Fail}", evidence_checked, notes], locator: "Prüfspezifikation sheet columns G-I", kind: stated, tmodel_mapping: "conformance check result (R-042)", notes: "Binary, no partial or N/A value in the sheet."}
  - {name: Evidence, definition: "geprüfte Evidenzen / gesichtete Dokumente / Referenzen (evidence checked / documents viewed / references)", attributes: [], locator: "Prüfspezifikation sheet column G", kind: stated, tmodel_mapping: "Evidence (DL-0009 R-042)", notes: ""}
  - {name: Certification, definition: "certification according to BSI TR-03185-1 offered by BSI on the basis of the certification programme", attributes: [], locator: "BSI landing page (DE)", kind: stated, tmodel_mapping: "Attestation (signed Review) — none yet in ARCH-0001", notes: ""}

edges:
  - {name: acts_as, from: Manufacturer, to: Perspective, cardinality: "1:2", definition: "the manufacturer operates as software user and/or software producer; producer includes user", locator: "§1.2.1; Figure 1", kind: stated, tmodel_mapping: "Party role facet"}
  - {name: comprises, from: Perspective, to: Process, cardinality: "1:N", definition: "processes assigned to a perspective", locator: "§1.2.1; Figure 1", kind: stated, tmodel_mapping: "SDL program → phase"}
  - {name: groups, from: Process, to: Requirement, cardinality: "1:N", definition: "requirements listed per process (table)", locator: "§1.3.1-§1.3.2; §2.3", kind: stated, tmodel_mapping: "phase → Requirement"}
  - {name: references, from: Requirement, to: ReferenceFramework, cardinality: "N:M", definition: "Additional information / Induced by / Prüfspezifikation source columns", locator: "Table 4; §2.3", kind: stated, tmodel_mapping: "maps_to (R-044) with strength ∈ {source-of, induced-by}"}
  - {name: cross_references, from: Requirement, to: Requirement, cardinality: "N:M", definition: "e.g. USER.TESTREL.A.8 → USER.PM.A.2; PROD.DEV.B.2 → PROD.DEV.B.4; DE.01/DE.02 induced by PROD.DECOM.2; NOTE rows pointing to other processes", locator: "USER.TESTREL.A.8; PROD.DEV.B.2; Table 40; NOTE rows", kind: stated, tmodel_mapping: "Requirement depends_on Requirement"}
  - {name: responsible_for, from: Role, to: Process, cardinality: "N:M", definition: "roles cover requirements, design, security, implementation, testing; responsibilities for support, release, administration", locator: "PROD.PM.C.1; USER.PM.D.1", kind: stated, tmodel_mapping: "Party role edge (owner)"}
  - {name: separated_from, from: Role, to: Role, cardinality: "N:M", definition: "incompatible functions held by different individuals (e.g. developer vs tester)", locator: "USER.PM.D.4; PROD.PM.C.2; PROD.TEST.A.5", kind: stated, tmodel_mapping: "new constraint"}
