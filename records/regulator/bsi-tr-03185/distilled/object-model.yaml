gaps:
  - "Perspective (tool-user vs producer): tmodel has no way to say that the development toolchain is itself a governed, threat-modelled subject with its own requirements (half of TR-03185 Part 1). Needs a dev-Environment-as-Product or 'tooling' role on Component."
  - "RequirementMapping strength: BSI distinguishes 'source of' (Part 1 / Prüfspezifikation) from 'induced by, neither derived from nor equivalent to' (Part 2). R-044 maps_to needs a typed strength, not a bare edge."
  - "AuditResult is binary Pass/Fail with evidence; R-042 conformance should support that verdict shape plus per-requirement evidence references."
  - "SeparationOfDuties / reviewer independence is a constraint over Role assignments that tmodel's Review does not carry (who may approve vs who authored)."
  - "UpdateTimeWindow / disclosure SLA policy has no home in ARCH-0001; it belongs on the DL-0009 SDL program."
  - "Solution remedy enum {fix, plan, future-version, no-fix} + accepted residual risk should be checked against DEC-009 mitigation lifecycle states."
  - "SecurityIssue covers organisational faults (Glossary 'Vulnerability' includes 'institution'), wider than CVE-style Vulnerability."
  - "Process ≠ Gate: the TR's processes are explicitly unordered (§1.2.2); only Release is a gate. tmodel's Gate (R-041) must not assume every phase grouping is a gate."
