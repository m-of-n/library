  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "Every requirement cell of Tables 5-32 (Part 1) and 35-40 (Part 2) verbatim with Additional information / Keywords / Glossary rows and Induced-by cells; framing prose §0.1, §1.1, §1.2.1-1.2.2, §1.3, §2.1.1, §2.2.1-2.2.3, §2.3; cited footnotes; glossary terms the requirements rely on (12 vocabulary-only glossary entries left to .cache)."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "191 entries = 169 Part 1 native ids (USER.*/PROD.*) + 20 Part 2 ids + 2 inferred §0.1 prose statements; 124 requirement / 63 recommendation / 4 permission. source_keyword_count 352, extracted 338; the 14 not extracted are the modal-verb definitions of §1.2.2 and §2.2.1/Table 33 (reconciliation). maps_to carries BSI-published mappings (chapter-level Additional information, requirement-level Prüfspezifikation v1.0, Part 2 Induced-by). Derived fields need review."
      reviewed_by: ""
    - kind: requirements
      path: distilled/crosswalk.yaml
      coverage: "Inverse index of the BSI-published mappings: IT-Grundschutz 62 refs, IEC 62443-4-1 42 ids, NESAS 20, SSDF 40, plus in-document chapter-level and Induced-by refs."
      generated_from: distilled/requirements.yaml
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "17 work-product/communication structures whose content the TR prescribes (requirement row, audit row, tool requirements catalogue, test spec, pentest concept, interface secure design, threat model, design review, issue report, issue analysis, resolution decision, update documentation x2, update time window, release record, user documentation, OSS documentation set); fields carry constrained_by. No encodings exist in the source."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "7 derived JSON Schemas generated from messages.yaml (the TR defines no schema); required = MUST-governed fields."
      generated_from: distilled/messages.yaml
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "6 process flows (issue intake→disclosure, proactive discovery, test→release→delivery, tool patch intake, end of support, OSS reporting) with roles, guards, error paths; Mermaid sequence diagrams in protocol.md. Step order partly inferred (§1.2.2 disclaims chronology)."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "5 machines: security issue (SM1, PROD.FIX.A.3-A.11), release (SM2), tool patch (SM3), threat model (SM4), product support (SM5); states/transitions tagged stated or inferred; no timers (source sets none)."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "Adopt/adapt/reject against R-040..R-044 and DEC-009; 7 open questions incl. 4 source defects (missing PROD.DEV.E.2, v1.0 date conflict, dangling 'section 3', Prüfspezifikation numbering lag)."
      reviewed_by: ""
    - kind: diagram
      path: distilled/object-model.yaml
      coverage: "object-model pass: 67 objects, 45 edges (1 inferred), 8 gaps vs ARCH-0001/DL-0009; Mermaid class diagram + findings in object-model.md. Audit/AuditResult/Evidence/Certification taken from BSI's Prüfspezifikation and landing page."
      reviewed_by: ""
