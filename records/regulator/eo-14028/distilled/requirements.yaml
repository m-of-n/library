reconciliation: "Not a BCP 14 document: 0 uppercase keywords in the whole order and in §4 (bin/bcp14-count on .cache/eo-14028.s4.clean.txt and .cache/eo-14028.txt). Slicing: requirements cover §4 only (Sec. 4 'Enhancing Software Supply Chain Security', FR pp. 26637-26641); §10 definitions are in normative.md, other sections are out of SDL scope. §4 own forms (grep -o -w -i on the §4 slice): shall 41/41, must 1/1, required 2/2, recommend* 6/6 — all inside extracted texts; may 9 vs 7 = the two Federal Register running heads 'Monday, May 17, 2021' (case-insensitive grep); the 7 real 'may' are §4(e)-2, §4(l), §4(m) and four inside §4(t)/§4(u) sentences. Whole-order counts (shall 128 ...) are not reconciled because §1-3 and §5-11 are out of scope."
note: "Ids: eo-14028#§4(x) with -N for further sentences in the same subsection; the ten §4(e) practice areas are #§4(e)(i)..(x) with (i)(A)-(F). The practice areas are typed 'practice-area': the EO obliges NIST to issue guidance 'regarding' them; they bind producers only via OMB/FAR (§4(k), (n)-(q)). due = order date + stated offset (computed by lane B). Amendment status: EO 14144 (2025-01-16) and EO 14306 (2025-06-06) do NOT textually amend §4; EO 14144 §2 built on it (RSAA machine-readable attestation, CISA validation, SSDF update) and EO 14306 §1(a) struck EO 14144 §2(a)-(b) (the attestation-validation part) while keeping a re-dated SSDF-update directive. The §4(k) implementation (M-22-18/M-23-16) was rescinded by M-26-05."
