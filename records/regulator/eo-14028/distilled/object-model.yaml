schema: "library-object-model/v1"
record: eo-14028
reviewed_by: ""
question: "What objects and edges does EO 14028 §4 (with §10 definitions) assume or define?"
objects:
  - {name: Agency, definition: "agency per 44 U.S.C. 3502", attributes: [], locator: "§10(a)", kind: stated, tmodel_mapping: "Party", notes: ""}
  - {name: Directive, definition: "a dated tasking to a named official (NIST, CISA, OMB, FAR Council, NTIA)", attributes: [owner, offset, deliverable], locator: "§4(b)-(x)", kind: stated, tmodel_mapping: "Milestone (R-041)", notes: ""}
  - {name: Guidance, definition: "NIST guidance identifying practices that enhance software supply-chain security, incl. standards/procedures/criteria for (i)-(x)", attributes: [preliminary, final, version], locator: "§4(c)-(e)", kind: stated, tmodel_mapping: "library record (sp-800-218) / Requirement set", notes: ""}
  - {name: PracticeArea, definition: "one of the ten §4(e) topics (i)-(x), (i) with actions (A)-(F)", attributes: [id], locator: "§4(e)", kind: stated, tmodel_mapping: "Requirement (abstract) — crosswalk hub (R-044)", notes: "the US-federal SDL requirement backbone; the CISA form and SSDF map to these ids"}
  - {name: SoftwareProducer, definition: "developer/supplier of software (the subject of the practices)", attributes: [], locator: "§4(b), §4(e), §4(n)", kind: stated, tmodel_mapping: "Party (supplier)", notes: "called 'developers and suppliers', 'vendors', 'suppliers of software'"}
  - {name: Purchaser, definition: "acquirer who may request artifacts and receives SBOMs", attributes: [], locator: "§4(e)(ii), (v), (vii)", kind: stated, tmodel_mapping: "Party (consumer)", notes: ""}
  - {name: Software, definition: "software used by the Federal Government; incl. legacy software (developed and procured before the order)", attributes: [procured_date, legacy], locator: "§4(a), §4(q)", kind: stated, tmodel_mapping: "Product", notes: ""}
  - {name: CriticalSoftware, definition: "software performing functions critical to trust; definition reflects privilege/access, integration and dependencies, direct network/compute access, function critical to trust, potential for harm", attributes: [category], locator: "§4(a), §4(g)", kind: stated, tmodel_mapping: "classification on Product (new)", notes: ""}
  - {name: BuildEnvironment, definition: "software development/build environment (administratively separate)", attributes: [], locator: "§4(e)(i)", kind: stated, tmodel_mapping: "Environment/Component for build infrastructure (gap)", notes: ""}
  - {name: TrustRelationship, definition: "auditing trust relationship: agreed relationship between system elements governed by criteria for secure interaction", attributes: [], locator: "§4(e)(i)(B), §10(b)", kind: stated, tmodel_mapping: "edge attribute / TrustBoundary", notes: ""}
  - {name: Artifact, definition: "artifacts demonstrating conformance to (e)(i), and artifacts of execution of tools in (e)(iii)-(iv)", attributes: [], locator: "§4(e)(ii), (v)", kind: stated, tmodel_mapping: "Evidence (R-042)", notes: ""}
  - {name: PublicSummary, definition: "publicly available summary of completion of actions incl. risks assessed and mitigated", attributes: [], locator: "§4(e)(v)", kind: stated, tmodel_mapping: "governed public view (R-043)", notes: "a public 'risks assessed and mitigated' summary is a threat-model-derived view"}
  - {name: Tool, definition: "automated tools or comparable processes (supply-chain integrity; vulnerability checks)", attributes: [], locator: "§4(e)(iii)-(iv), §4(r)", kind: stated, tmodel_mapping: "none (Tool) — new", notes: ""}
  - {name: Provenance, definition: "accurate, up-to-date data on origin of software code or components; and controls on components, tools, services", attributes: [], locator: "§4(e)(vi), (x)", kind: stated, tmodel_mapping: "supply-chain provenance (ADR-0001, post-MVP)", notes: ""}
  - {name: SBOM, definition: "formal record of details and supply chain relationships of components used in building software", attributes: [], locator: "§4(e)(vii), §4(f), §10(j)", kind: stated, tmodel_mapping: "Evidence; composed_of source", notes: ""}
  - {name: VulnerabilityDisclosureProgram, definition: "program with reporting and disclosure process", attributes: [], locator: "§4(e)(viii)", kind: stated, tmodel_mapping: "process mitigation", notes: ""}
  - {name: Attestation, definition: "attestation of conformity with secure development practices; and of OSS integrity/provenance", attributes: [], locator: "§4(e)(ix)-(x), §4(n)", kind: stated, tmodel_mapping: "Assertion + Review (new: Attestation)", notes: ""}
  - {name: Release, definition: "product, version, or update release — vulnerability checks run at a minimum prior to it", attributes: [], locator: "§4(e)(iv)", kind: stated, tmodel_mapping: "Gate (release) R-041", notes: ""}
  - {name: Extension, definition: "agency extension of §4(k) requirements, with plan", attributes: [plan], locator: "§4(l)", kind: stated, tmodel_mapping: "Milestone override", notes: ""}
  - {name: Waiver, definition: "agency waiver, exceptional, limited duration, with risk-mitigation plan", attributes: [duration, plan], locator: "§4(m)", kind: stated, tmodel_mapping: "risk acceptance Review", notes: ""}
  - {name: ContractVehicle, definition: "IDIQ contracts, Federal Supply Schedules, GWACs, BPAs, MACs", attributes: [], locator: "§4(p)", kind: stated, tmodel_mapping: "none", notes: ""}
  - {name: Label, definition: "consumer IoT / consumer software security label, possibly tiered rating", attributes: [tier], locator: "§4(s)-(u)", kind: stated, tmodel_mapping: "none — a public conformance mark (new)", notes: ""}
edges:
  - {name: tasks, from: Directive, to: Agency, cardinality: "N:1", definition: "directive owner", locator: "§4(b)-(x)", kind: stated, tmodel_mapping: "Milestone owner"}
  - {name: depends_on, from: Directive, to: Directive, cardinality: "N:M", definition: "offsets counted from another directive's output (e.g. 4e = 4c + 90d; 4k = 4e + 30d)", locator: "§4(e), (h), (j), (k), (o), (p)", kind: stated, tmodel_mapping: "Milestone precedes (R-041)"}
  - {name: covers, from: Guidance, to: PracticeArea, cardinality: "1:10", definition: "guidance shall include standards/procedures/criteria regarding (i)-(x)", locator: "§4(e)", kind: stated, tmodel_mapping: "Requirement set membership"}
  - {name: performed_by, from: PracticeArea, to: SoftwareProducer, cardinality: "N:1", definition: "", locator: "§4(e)", kind: inferred, tmodel_mapping: "Requirement actor"}
  - {name: secures, from: PracticeArea, to: BuildEnvironment, cardinality: "N:1", definition: "(i)(A)-(F)", locator: "§4(e)(i)", kind: stated, tmodel_mapping: "Mitigation on Environment"}
  - {name: demonstrates, from: Artifact, to: PracticeArea, cardinality: "N:M", definition: "", locator: "§4(e)(ii), (v)", kind: stated, tmodel_mapping: "Evidence supports Requirement"}
  - {name: provided_to, from: Artifact, to: Purchaser, cardinality: "N:M", definition: "when requested", locator: "§4(e)(ii), (v)", kind: stated, tmodel_mapping: ""}
  - {name: describes, from: SBOM, to: Software, cardinality: "N:1", definition: "SBOM for each product", locator: "§4(e)(vii)", kind: stated, tmodel_mapping: "composed_of"}
  - {name: runs_before, from: Tool, to: Release, cardinality: "N:M", definition: "checks operate regularly or at a minimum prior to release", locator: "§4(e)(iv)", kind: stated, tmodel_mapping: "Gate exit criterion"}
  - {name: attests_to, from: Attestation, to: PracticeArea, cardinality: "1:N", definition: "", locator: "§4(e)(ix), §4(n)", kind: stated, tmodel_mapping: "R-042 satisfies"}
  - {name: classified_as, from: Software, to: CriticalSoftware, cardinality: "N:0..1", definition: "", locator: "§4(g)-(h)", kind: stated, tmodel_mapping: "classification"}
  - {name: requires_compliance, from: Agency, to: Guidance, cardinality: "N:1", definition: "OMB requires agencies to comply (software procured after the order; legacy via plan)", locator: "§4(j), (k), (q)", kind: stated, tmodel_mapping: "Requirement profile adoption"}
  - {name: overrides, from: Waiver, to: Guidance, cardinality: "N:M", definition: "", locator: "§4(m)", kind: stated, tmodel_mapping: "Review verdict waived"}
gaps:
  - "Public 'summary of risks assessed and mitigated' (§4(e)(v)) is a public governed view of a threat model — tmodel needs a redaction/summary projection of the threat-model KG (R-043)."
  - "Build/development environment as a modelled asset (§4(e)(i))."
  - "Directive/Milestone dependency chains with offsets (R-041)."
  - "Conformance marks/labels (tiered rating) — not modelled."
