schema: "library-object-model/v1"
record: cisa-secure-by-demand-guide-2024
reviewed_by: ""
question: "What objects and edges does the Secure by Demand Guide assume or define?"
objects:
  - {name: SoftwareCustomer, definition: "organization buying software (incl. via resellers/service providers)", attributes: [], locator: "Overview", kind: stated, tmodel_mapping: "Party (consumer role)", notes: ""}
  - {name: SoftwareManufacturer, definition: "company that creates, ships, and maintains software", attributes: [pledge_signer], locator: "Overview", kind: stated, tmodel_mapping: "Party (supplier role)", notes: ""}
  - {name: Product, definition: "the software product procured; has a baseline version", attributes: [baseline_version, deployment (on-premises|cloud|SaaS)], locator: "pp.2-3", kind: stated, tmodel_mapping: "Product", notes: ""}
  - {name: ProcurementStage, definition: "before / during / following procurement", attributes: [stage], locator: "Overview bullets", kind: stated, tmodel_mapping: "LifecyclePhase (acquisition — not in ARCH-0001 §3b enum)", notes: "acquirer-side lifecycle"}
  - {name: Question, definition: "a due-diligence question posed to the manufacturer, grouped by category", attributes: [category, text], locator: "pp.2-3", kind: stated, tmodel_mapping: "Requirement (consumer-side, interrogative)", notes: ""}
  - {name: Category, definition: "General; Authentication; Eliminating Classes of Vulnerability; Evidence of Intrusions; Software Supply Chain Security; Vulnerability Disclosure and Reporting", attributes: [headline_should], locator: "pp.2-3", kind: stated, tmodel_mapping: "Requirement group", notes: ""}
  - {name: ManufacturerArtifact, definition: "artifact collected from the manufacturer (SBOM, vulnerability-class roadmap)", attributes: [], locator: "p.2", kind: stated, tmodel_mapping: "Evidence (producer-supplied)", notes: ""}
  - {name: SelfCollectedArtifact, definition: "evidence the customer gathers from public sources (baseline features, VDP page, CVE records, pledge status)", attributes: [], locator: "p.2", kind: stated, tmodel_mapping: "Evidence (consumer-gathered) — new provenance distinction", notes: ""}
  - {name: ContractLanguage, definition: "product security requirements integrated into contracts", attributes: [], locator: "Overview bullets", kind: stated, tmodel_mapping: "none (acquisition artifact)", notes: ""}
  - {name: SBOM, definition: "standard, machine-readable SBOM enumerating all third-party dependencies incl. OSS", attributes: [format, complete], locator: "p.3", kind: stated, tmodel_mapping: "Evidence; composed_of source", notes: ""}
  - {name: OSPO, definition: "open source program office governing use of and contributions to OSS", attributes: [], locator: "p.3", kind: stated, tmodel_mapping: "process mitigation (R-040)", notes: ""}
  - {name: SecurityLog, definition: "security logs in the baseline product; cloud/SaaS retained >= 6 months at no charge", attributes: [category, retention], locator: "p.3", kind: stated, tmodel_mapping: "technical mitigation", notes: ""}
  - {name: CVERecord, definition: "CVE record with accurate CWE and CPE", attributes: [cwe, cpe], locator: "p.3", kind: stated, tmodel_mapping: "Vulnerability + Weakness link", notes: ""}
  - {name: VDP, definition: "public vulnerability disclosure policy authorizing public testing", attributes: [], locator: "p.2-3", kind: stated, tmodel_mapping: "documentation mitigation", notes: ""}
  - {name: Pledge, definition: "CISA Secure by Design Pledge and its progress reports", attributes: [], locator: "p.2", kind: stated, tmodel_mapping: "library record cisa-secure-by-design-pledge-2024", notes: ""}
  - {name: VulnerabilityClass, definition: "class of vulnerability addressed systematically", attributes: [], locator: "p.2", kind: stated, tmodel_mapping: "Weakness (CWE)", notes: ""}
edges:
  - {name: asks, from: SoftwareCustomer, to: Question, cardinality: "1:N", definition: "", locator: "Q-lead", kind: stated, tmodel_mapping: "Review request"}
  - {name: answered_by, from: Question, to: SoftwareManufacturer, cardinality: "N:1", definition: "", locator: "p.2", kind: stated, tmodel_mapping: "Assertion by supplier Party"}
  - {name: grouped_in, from: Question, to: Category, cardinality: "N:1", definition: "", locator: "pp.2-3", kind: stated, tmodel_mapping: ""}
  - {name: asked_during, from: Question, to: ProcurementStage, cardinality: "N:M", definition: "", locator: "Overview", kind: stated, tmodel_mapping: "applies_in_phase"}
  - {name: evidenced_by, from: Question, to: ManufacturerArtifact, cardinality: "N:M", definition: "", locator: "p.2", kind: inferred, tmodel_mapping: "Evidence"}
  - {name: checked_via, from: Question, to: SelfCollectedArtifact, cardinality: "N:M", definition: "customer verifies from public sources", locator: "p.2", kind: inferred, tmodel_mapping: "Evidence with consumer provenance"}
  - {name: signed, from: SoftwareManufacturer, to: Pledge, cardinality: "N:0..1", definition: "", locator: "GEN-Q1", kind: stated, tmodel_mapping: ""}
  - {name: supplies, from: SoftwareManufacturer, to: Product, cardinality: "1:N", definition: "", locator: "Overview", kind: stated, tmodel_mapping: "supplied_by"}
  - {name: describes, from: SBOM, to: Product, cardinality: "N:1", definition: "", locator: "p.3", kind: stated, tmodel_mapping: "composed_of"}
  - {name: addresses, from: SoftwareManufacturer, to: VulnerabilityClass, cardinality: "N:M", definition: "systematically addressed or on a roadmap", locator: "p.2", kind: stated, tmodel_mapping: "Mitigation mitigates Weakness"}
  - {name: annotated_with, from: CVERecord, to: VulnerabilityClass, cardinality: "N:1", definition: "CWE field", locator: "p.3", kind: stated, tmodel_mapping: "instance_of"}
  - {name: governs, from: OSPO, to: SBOM, cardinality: "1:N", definition: "OSS governance and provenance", locator: "p.3", kind: inferred, tmodel_mapping: ""}
gaps:
  - "Acquirer-side lifecycle (before/during/after procurement) is not an ARCH-0001 §3b LifecyclePhase."
  - "Evidence provenance: producer-supplied vs consumer-collected — tmodel Evidence lacks a 'who gathered it' facet (PROV can carry it)."
