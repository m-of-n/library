reconciliation: "Not a BCP 14 document: 0 uppercase keywords. Its normative units are the customer questions (typed question), the artifact checklists (typed artifact), the per-section 'should' headline for the manufacturer, and 'Why this is important' sentences carrying should. All extracted. Residue in note. VERIFIER (2026-10-03): added the encourage* form (2 in source: 'CISA encourages organizations to read' p.1, 'We also encourage you' p.4) — both now extracted (OV-4 added in pass 2, FI-1)."
note: "Ids: OV/PL overview; Q-lead; <SECTION>-Q<n> questions; <SECTION> headline 'should' per section (AUTH, VC, EI, SC, VD); ART-M/ART-S artifact lists; *-why rationale with a modal. related_inferred = LANE JUDGEMENT link to the pledge goal each question tests (the guide names the Pledge and SbD principles but prints no item-level mapping), so no maps_to. Verbatim check run against pdftotext -layout + raw reading-order text (p.2 is two-column). Own-form residue (grep -o -w -i, layout txt): should 13 vs extracted 12 — 'actions that customers should take' (VD why, descriptive) not extracted; will 2 ('will drive down exploitable defects', 'will help protect all Americans') descriptive, not extracted."
