schema: "library-protocol/v1"
record: enisa-sbd-playbook-2026
note: "Process flows the playbook defines. No wire protocol; the attestation exchange (P3) is illustrative (§5.4)."
roles:
  - {id: team, name: "manufacturer development/product team (SME)", locator: "§1.3; §4"}
  - {id: release_review, name: "release review / CI-CD gate", locator: "§4; Table 2 'Release risk review gate'"}
  - {id: reporter, name: "customer / researcher", locator: "§3.1.2; §4.13"}
  - {id: customer, name: "customer / integrator / procurer", locator: "§5.2"}
  - {id: assessor, name: "third-party assessor / auditor", locator: "§5.4.2.4"}
  - {id: authority, name: "regulator (CRA reporting)", locator: "§4.13 'regulatory reporting obligations'"}
flows:
  - id: P1
    name: "Release with playbook release gates"
    locator: "§4 intro; Table 2 RM-7; each playbook's Release gate"
    steps:
      - {n: 1, actor: team, action: "determine which release-gate criteria require verification from product changes, threat model and risk assessment; unchanged controls recorded as not affected", constrained_by: ["R-0017"], kind: stated}
      - {n: 2, actor: release_review, action: "evaluate pass/fail criteria (CI/CD or release review)", constrained_by: ["R-0014", "R-0015"], kind: stated}
      - {n: 3, actor: release_review, action: "confirm checklist met, defaults verified, known vulnerabilities triaged, high risks treated/accepted with rationale; decide go/no-go", constrained_by: ["RM-7"], kind: stated}
      - {n: 4, actor: team, action: "record exceptions with rationale, owner, review date", constrained_by: ["R-0019"], kind: stated}
    error_paths:
      - {at: 2, condition: "criterion fails (e.g. port mismatch, writable /usr/bin)", outcome: "release fails; firmware rejected (§5.4.2.3)", kind: stated}
  - id: P2
    name: "Vulnerability intake to fix"
    locator: "§4.13; §4.7"
    steps:
      - {n: 1, actor: reporter, to: team, action: "report via intake channels (security email, VDP, scanners, advisories)", constrained_by: ["PB-4.13-CL-01", "PB-4.13-CL-02"], kind: stated}
      - {n: 2, actor: team, action: "triage: severity + internet-exposed / known-exploited flags; awareness of reporting timelines", constrained_by: ["PB-4.13-CL-03", "PB-4.13-CL-04"], kind: stated}
      - {n: 3, actor: team, action: "decide: fix now, mitigate, accept (time bound), defer (with rationale)", constrained_by: ["PB-4.13-CL-05"], kind: stated}
      - {n: 4, actor: team, to: authority, action: "escalate to assess applicable regulatory reporting obligations", constrained_by: ["PB-4.13-CL-13"], kind: stated}
      - {n: 5, actor: team, action: "fix reviewed and tested; secure OTA with rollback", constrained_by: ["PB-4.13-CL-08", "PB-4.13-CL-09"], kind: stated}
      - {n: 6, actor: team, to: customer, action: "publish release notes / advisories (CSAF, VEX where proportionate); verify rollout; update risk register", constrained_by: ["PB-4.13-CL-11", "PB-4.13-CL-12", "PB-4.13-CL-14"], kind: stated}
      - {n: 7, actor: team, action: "root-cause analysis; feed back into risk assessment, requirements and practices", constrained_by: ["PB-4.13-CL-15"], kind: stated}
  - id: P3
    name: "Attestation production and third-party verification (illustrative)"
    locator: "§5.1; §5.4.1-§5.4.2.4"
    steps:
      - {n: 1, actor: team, action: "threat model -> control layer objectives", kind: stated}
      - {n: 2, actor: team, action: "implementation layer claims with settings", kind: stated}
      - {n: 3, actor: release_review, action: "verification gates produce results + evidence hashes", kind: stated}
      - {n: 4, actor: team, to: customer, action: "publish signed public attestation layer; restricted technical overlay via authenticated API (e.g. Transparency Exchange API)", kind: stated}
      - {n: 5, actor: assessor, action: "locate claims, evidence, run spot checks (e.g. ls /bin/sh -> 'File not found')", kind: stated}
    notes: ["Attestation, verification and independent assessment are distinct activities (§5.1)."]
