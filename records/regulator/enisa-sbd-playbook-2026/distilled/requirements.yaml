  - id: "enisa-sbd-playbook-2026#PB-4.19"
    playbook: "4.19"
    principle_name: "Mandatory security onboarding"
    group: "secure by default / guided protection"
    locator: "§4.19"
    principle: "Require critical security controls to be configured during initial set-up. Do not allow products to enter an operational state until essential security steps are completed."
    objective: "Ensure that systems start in a secure state by preventing or limiting use before baseline security controls, such as strong authentication or encryption, are configured."
