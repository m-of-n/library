  - id: "enisa-sbd-playbook-2026#PB-4.18"
    playbook: "4.18"
    principle_name: "Unique device identity and secrets by default"
    group: "secure by default / default hardening"
    locator: "§4.18"
    principle: "Ship each product instance with a unique cryptographic identity and secrets by default if it uses any private/secret value. Do not use shared credentials, keys or certificates across devices or installations."
    objective: "Prevent large-scale compromise by ensuring that a breach of one device or a leaked secret cannot be reused to attack other devices, customers or the wider installed base."
    checklist_headings:
      - "Generate unique identities per device or instance"
      - "Eliminate shared or hard-coded secrets"
      - "Protect secrets against extraction"
      - "Use unique secrets for security-critical functions"
      - "Support revocation and replacement"
