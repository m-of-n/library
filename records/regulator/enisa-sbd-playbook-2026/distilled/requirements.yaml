  - id: "enisa-sbd-playbook-2026#PB-4.15"
    playbook: "4.15"
    principle_name: "Minimisation of default services"
    group: "secure by default / default hardening"
    locator: "§4.15"
    principle: "Disable non-essential features and services by default. Only the functionality required for the core operation of the product should be enabled by default."
    objective: "Reduce the attack surface and ensure that products start in a hardened state, without relying on users to disable specific functionality."
    checklist_headings:
      - "Define core functionality"
      - "Disable non-essential features and services by default"
      - "Require explicit opt-in for additional functionality"
      - "Explain security implications on enablement"
      - "Review defaults on change"
