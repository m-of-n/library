  - id: "enisa-sbd-playbook-2026#PB-4.11"
    playbook: "4.11"
    principle_name: "Configuration and change management"
    group: "secure by design / operational integrity"
    locator: "§4.11"
    principle: "Secure operation requires configurations to be controlled, consistent and auditable. Baseline hardening standards should be defined and applied through repeatable mechanisms such as templates and infrastructure as code to reduce drift."
    objective: "Prevent security regressions and outages by ensuring that system configuration is controlled, reviewable and reproducible and that changes are assessed for risk before reaching production. The priority is to eliminate ‘silent drift’, tighten defaults and make rollbacks reliable."
    checklist_headings:
      - "Version and review configuration (treat it as code)"
      - "Harden defaults and prevent drift"
      - "Separate environments and limit privilege"
      - "Implement change gating and rollback"
      - "Track and assess security-impacting changes"
    phase: "release"
    maps_to:
      - ref: "ANNEX-1.PT1.2.f"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(f)"
