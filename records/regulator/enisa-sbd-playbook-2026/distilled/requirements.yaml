principles:
  - id: "enisa-sbd-playbook-2026#PB-4.1"
    playbook: "4.1"
    principle_name: "Trust boundaries and threat modelling"
    group: "secure by design / architectural foundations"
    locator: "§4.1"
    principle: "Secure architectures make trust explicit rather than assumed. Trust boundaries define where data, identities and execution contexts cross from a more trusted domain to a less trusted one (or vice versa)."
    objective: "Ensure that the system’s architecture and data flows are understood, trust assumptions are explicit and the highest-risk attack paths are identified early, so that security controls and secure defaults are designed in, not retrofitted."
    checklist_headings:
      - "Draw the system (one diagram)"
      - "Mark trust boundaries and privileged paths"
      - "List critical assets"
      - "Identify and prioritise top threats"
      - "Define mitigations, secure defaults and verification"
    phase: "design"
    maps_to:
      - ref: "ANNEX-1.PT1.1"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(1)"
        cra: "Annex I Part I (1)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports identification and assessment of cybersecurity risks by making trust assumptions, assets and attack paths explicit during design"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.d"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(d)"
        cra: "Annex I Part I (2)(d)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports protection from unauthorised access by clarifying where authentication and access controls are required between trust boundaries"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.e"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(e)"
        cra: "Annex I Part I (2)(e)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports confidentiality protections by identifying where data crosses trust boundaries and requires protection"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.f"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(f)"
        cra: "Annex I Part I (2)(f)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports integrity protection by identifying where data, commands or configuration cross boundaries and may require integrity controls"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.j"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(j)"
        cra: "Annex I Part I (2)(j)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports attack surface limitation by identifying exposed interfaces and unnecessary trust relationships"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
  - id: "enisa-sbd-playbook-2026#PB-4.2"
    playbook: "4.2"
    principle_name: "Least privilege"
    group: "secure by design / architectural foundations"
    locator: "§4.2"
    principle: "Every user, service and process operates with the feasible minimum permissions needed to do its job – no more and for no longer than necessary."
    objective: "Reduces unauthorised access, limits blast radius, blocks lateral movement and prevents permission creep."
    checklist_headings:
      - "Define minimum viable permissions for each role/service"
      - "Use unique identities (no shared admin)"
      - "Default-deny and explicit allow lists"
      - "Time-bound admin access (JIT) + attribution"
      - "Automate privilege hygiene"
    phase: "design"
    maps_to:
      - ref: "ANNEX-1.PT1.2.d"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(d)"
        cra: "Annex I Part I (2)(d)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports protection from unauthorised access by limiting what authenticated users, services and processes are permitted to access or perform"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.f"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(f)"
        cra: "Annex I Part I (2)(f)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports integrity protection by limiting which identities are authorised to modify data, programs or configuration"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.g"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(g)"
        cra: "Annex I Part I (2)(g)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports data minimisation by limiting access to data to what is necessary for the intended purpose"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
  - id: "enisa-sbd-playbook-2026#PB-4.3"
    playbook: "4.3"
    principle_name: "Strong identity and authentication architecture"
    group: "secure by design / architectural foundations"
    locator: "§4.3"
    principle: "Design identity and authentication as a core part of the architecture. Use authoritative identity mechanisms for users, devices, services and administrators across interfaces."
    objective: "Prevent impersonation and unauthorised access."
    checklist_headings:
      - "Define authoritative identity sources"
      - "Use unique identities for all actors"
      - "Apply authentication across all interfaces"
      - "Strengthen authentication for high-risk access"
      - "Manage sessions and credentials securely"
    phase: "design"
    maps_to:
      - ref: "ANNEX-1.PT1.2.d"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(d)"
        cra: "Annex I Part I (2)(d)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports access protection by defining how identities are authenticated and managed across interfaces"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.l"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(l)"
        cra: "Annex I Part I (2)(l)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports logging and monitoring of authentication and access-related activity"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
  - id: "enisa-sbd-playbook-2026#PB-4.4"
    playbook: "4.4"
    principle_name: "Attack surface minimisation"
    group: "secure by design / architectural foundations"
    locator: "§4.4"
    principle: "Expose only what is strictly necessary. Remove or disable all unnecessary code, services, interfaces, protocols and dependencies by default."
    objective: "Reduce the likelihood and impact of compromise by eliminating unnecessary entry points and limiting attacker options."
    checklist_headings:
      - "List exposed interfaces"
      - "Enforce default deny"
      - "Remove development and diagnostic functionality"
      - "Minimise dependencies"
      - "Continuously monitor for legacy exposure"
      - "Minimise data collection, processing and retention"
    phase: "design"
    maps_to:
      - ref: "ANNEX-1.PT1.2.b"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(b)"
        cra: "Annex I Part I (2)(b)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports secure by default configuration by reducing enabled features and services at initial deployment"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.j"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(j)"
        cra: "Annex I Part I (2)(j)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports attack surface limitation by reducing unnecessary interfaces, services and exposed functionality"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
  - id: "enisa-sbd-playbook-2026#PB-4.5"
    playbook: "4.5"
    principle_name: "Defence in depth"
    group: "secure by design / architectural foundations"
    locator: "§4.5"
    principle: "Apply multiple layers of security so that the failure or bypass of a single control does not result in full compromise."
    objective: "Reduce the impact of security failures by layering independent controls that slow attackers, increase detection and prevent single points of compromise."
    checklist_headings:
      - "Layer controls around critical assets"
      - "Assume control failure and design for containment"
      - "Enable detection at multiple layers"
      - "Use diverse and independent controls"
      - "Slow attackers and enable response"
    phase: "design"
    maps_to:
      - ref: "ANNEX-1.PT1.2.h"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(h)"
        cra: "Annex I Part I (2)(h)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports availability and resilience by relying on multiple layers of protection rather than a single control"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.k"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(k)"
        cra: "Annex I Part I (2)(k)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports impact reduction by applying multiple mitigation mechanisms that limit the effect of exploitation"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
  - id: "enisa-sbd-playbook-2026#PB-4.6"
    playbook: "4.6"
    principle_name: "Open design"
    group: "secure by design / architectural foundations"
    locator: "§4.6"
    principle: "Systems should not depend on secrecy of design or hidden behaviour for protection. Security controls should remain effective even if an adversary understands how the system operates."
    objective: "Ensure that the product’s security does not depend on the secrecy of its design or implementation details (‘security through obscurity’). Open design makes security properties reviewable, testable and maintainable."
    checklist_headings:
      - "Document security-relevant design decisions"
      - "Prefer open standards and proven building blocks"
      - "Make interfaces and security expectations explicit"
      - "Enable review and disclosure"
      - "Maintain transparency of components and changes"
    phase: "design"
    maps_to:
      - ref: "ANNEX-1.PT2.3"
        target_id: "eu-cra-2024-2847#AnnexI-PartII(3)"
        cra: "Annex I Part II (3)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports effective testing and review by using designs that can be examined and assessed"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT2.4"
        target_id: "eu-cra-2024-2847#AnnexI-PartII(4)"
        cra: "Annex I Part II (4)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports vulnerability disclosure by aligning with transparent communication of security issues and fixes"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
  - id: "enisa-sbd-playbook-2026#PB-4.7"
    playbook: "4.7"
    principle_name: "Life-cycle management"
    group: "secure by design / operational integrity"
    locator: "§4.7"
    principle: "Security responsibilities extend beyond initial development. Components must be maintained, updated and eventually retired in a controlled manner."
    objective: "Ensure that security is maintained throughout the product’s full life cycle, from requirements and design through to deployment, maintenance and end of life, so that security does not degrade over time."
    checklist_headings:
      - "Define support commitments and life-cycle states"
      - "Make the product updatable and recoverable"
      - "Operate vulnerability and patch management"
      - "Monitor, log and handle incidents"
      - "Learn from deployed products"
      - "Plan secure decommissioning and disposal"
    phase: "operations/response"
    maps_to:
      - ref: "ANNEX-1.PT1.2.c"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(c)"
        cra: "Annex I Part I (2)(c)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports the ability to address vulnerabilities over the product lifetime through updates"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT1.2.m"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(m)"
        cra: "Annex I Part I (2)(m)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports secure decommissioning by providing mechanisms to remove data and settings at end of use"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT2.2"
        target_id: "eu-cra-2024-2847#AnnexI-PartII(2)"
        cra: "Annex I Part II (2)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports timely remediation of vulnerabilities throughout the supported life cycle"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT2.7"
        target_id: "eu-cra-2024-2847#AnnexI-PartII(7)"
        cra: "Annex I Part II (7)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports controlled and secure distribution of updates over time"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
  - id: "enisa-sbd-playbook-2026#PB-4.8"
    playbook: "4.8"
    principle_name: "User-centric design"
    group: "secure by design / operational integrity"
    locator: "§4.8"
    principle: "Security mechanisms must be usable and understandable even for everyday users."
    objective: "Ensure that security controls and secure defaults are usable, understandable and aligned with real user workflows, so that security outcomes do not depend on expert behaviour."
    checklist_headings:
      - "Design secure defaults that require minimal user action"
      - "Make set-up and onboarding safe and simple"
      - "Use clear, actionable security messaging"
      - "Provide least-friction access management"
      - "Validate usability to prevent insecure workarounds"
    phase: "design"
    maps_to:
      - ref: "ANNEX-1.PT1.2.b"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(b)"
        cra: "Annex I Part I (2)(b)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports secure by default configuration that users can reasonably adopt and maintain"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
  - id: "enisa-sbd-playbook-2026#PB-4.9"
    playbook: "4.9"
    principle_name: "Secure coding and verification practices"
    group: "secure by design / operational integrity"
    locator: "§4.9"
    principle: "Developers should follow established secure coding standards to prevent common vulnerabilities."
    objective: "Reduce common, high-impact vulnerabilities by eliminating relevant weakness classes through architectural and technology choices, where feasible, and by standardising how remaining risks are addressed in code, review and testing."
    checklist_headings:
      - "Eliminate vulnerability classes by construction"
      - "Adopt a secure coding baseline (language/framework specific)"
      - "Validate inputs and encode outputs"
      - "Use safe dependency and secrets practices"
      - "Make security-sensitive changes reviewable"
      - "Automate detection in CI/CD"
    phase: "implementation"
    maps_to:
      - ref: "ANNEX-1.PT1.2.a"
        target_id: "eu-cra-2024-2847#AnnexI-PartI(2)(a)"
        cra: "Annex I Part I (2)(a)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports release without known exploitable vulnerabilities by identifying and addressing issues during development"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT2.1"
        target_id: "eu-cra-2024-2847#AnnexI-PartII(1)"
        cra: "Annex I Part II (1)"
        standard: "Regulation (EU) 2024/2847 (CRA)"
        record: "eu-cra-2024-2847"
        support: "Supports identification and documentation of vulnerable components during development"
        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
      - ref: "ANNEX-1.PT2.3"
        target_id: "eu-cra-2024-2847#AnnexI-PartII(3)"
        cra: "Annex I Part II (3)"
