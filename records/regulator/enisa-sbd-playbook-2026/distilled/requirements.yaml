  - id: "enisa-sbd-playbook-2026#PB-4.16"
    playbook: "4.16"
    principle_name: "Restrictive initial access"
    group: "secure by default / default hardening"
    locator: "§4.16"
    principle: "Ship systems in the most restrictive access state possible. Eliminate shared or default credentials and require a secure access set-up before any privileged or sensitive operations are allowed."
    objective: "To prevent immediate compromise after deployment by ensuring that attackers cannot gain access through default or weak initial access."
    checklist_headings:
      - "Eliminate shared default credentials"
      - "Require unique credentials for each device or instance"
      - "Enforce a secure initial set-up"
      - "Restrict initial permissions"
      - "Protect initial access paths"
