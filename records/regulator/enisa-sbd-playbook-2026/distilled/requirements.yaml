  - id: "enisa-sbd-playbook-2026#TM-1"
    designator: "Table 3 Define scope, assumptions and security objectives"
    role: "threat-modelling-activity"
    normativity: "recommendation"
    verb: "imperative"
    actor: "SME manufacturer"
    nature: "deliverable"
    phase: "design"
    locator: "§2.3 Table 3, row 'Define scope, assumptions and security objectives'"
    text: "Time-box a short scoping stage to make the exercise decision focused. Capture what is in and out of scope (e.g. devices, apps, cloud services, admin tools), the deployment context(s) and the assumptions and constraints you are working under (e.g. 'device may be physically accessible', 'customer network is untrusted', 'cloud APIs are internet-exposed', 'advanced user capabilities'). Then state the security objectives that matter for this product (e.g. confidentiality, integrity, availability, plus privacy/safety if applicable)."
    expects_deliverables:
      - "One-page (or equivalent ticket/wiki) 'Threat model scope and objectives' note, covering: purpose (what decisions this will drive); scope boundaries (components and environments); assumptions/constraints; security objectives and 'crown jewels' (what must not fail)."
    verification: "deliverable present"
    kind: "stated"
    testable: "partial"
  - id: "enisa-sbd-playbook-2026#TM-2"
    designator: "Table 3 Model the system at a useful level of abstraction"
    role: "threat-modelling-activity"
    normativity: "recommendation"
    verb: "imperative"
    actor: "SME manufacturer"
    nature: "deliverable"
    phase: "design"
    locator: "§2.3 Table 3, row 'Model the system at a useful level of abstraction'"
    text: "Produce a simple representation of the system that answers Shostack's core question, 'What are we working on?' This may be an architecture diagram, a data-flow diagram or another suitable representation. It should show the main components, data stores, external entities, key data flows, entry points and trust boundaries in sufficient detail to assess exposure. Complementary techniques, such as misuse cases or attack trees, may also be used where helpful. Consider reusing the architecture and trust-boundary diagram developed during the design phase described in Table 1."
    expects_deliverables:
      - "System representation, covering: main components (devices, apps, cloud services, APIs); external entities (users, admins, third-party services); data stores (device storage, cloud database, logs); entry points (APIs, admin UI, update channel, local ports); trust boundaries (where trust assumptions, privileges or security properties change)."
    verification: "deliverable present"
    kind: "stated"
    testable: "partial"
  - id: "enisa-sbd-playbook-2026#TM-3"
    designator: "Table 3 Mark trust boundaries and privilege paths; identify key assets"
    role: "threat-modelling-activity"
    normativity: "recommendation"
    verb: "imperative"
    actor: "SME manufacturer"
    nature: "deliverable"
    phase: "design"
    locator: "§2.3 Table 3, row 'Mark trust boundaries and privilege paths; identify key assets'"
    text: "Annotate the diagram with (a) trust boundaries (a) (boundaries between environments with different security properties) and (b) the highest-privilege operations (e.g. firmware / OTA updates, remote admin, key provisioning, identity issuance). This is the step that turns architecture into security-relevant architecture."
    expects_deliverables:
      - "Diagram showing: trust boundaries (internet–back end, device–cloud, user–admin, tenant–tenant); privileged paths (updates, auth, key management, admin actions); top assets (credentials/keys, sensitive data, device control functions, availability)."
    verification: "deliverable present"
    kind: "stated"
    testable: "partial"
  - id: "enisa-sbd-playbook-2026#TM-4"
    designator: "Table 3 Identify and prioritise the top threats"
    role: "threat-modelling-activity"
    normativity: "recommendation"
    verb: "imperative"
    actor: "SME manufacturer"
    nature: "deliverable"
    phase: "design"
    locator: "§2.3 Table 3, row 'Identify and prioritise the top threats'"
    text: "Generate a short list/representation of the answers to the question 'What can go wrong?', mapped to entry/exit points, data flows and trust boundaries (e.g. 'credential stuffing → account takeover → remote control', 'malicious update', 'API authorisation bypass', 'man-in-the-middle attacks during onboarding'). Prioritise them using a lightweight, documented method appropriate to the product. This might take into account impact, likelihood, plausibility, exploitability and exposure or use predefined severity criteria. OWASP (b) describes this as threat identification and ranking as a core step in most threat-modelling approaches."
    expects_deliverables:
      - "Top threats table, showing: a manageable number of threat scenarios (e.g. the top 5 to 10) tied to specific entry/exit points and trust boundaries; priority or severity rating with a short rationale. Prioritised threat scenarios that drive design and default choices"
    verification: "deliverable present"
    kind: "stated"
    testable: "partial"
  - id: "enisa-sbd-playbook-2026#TM-5"
    designator: "Table 3 Define mitigations and secure defaults, verify their effectiveness and set refresh triggers"
    role: "threat-modelling-activity"
    normativity: "recommendation"
    verb: "imperative"
    actor: "SME manufacturer"
    nature: "deliverable"
    phase: "design"
    locator: "§2.3 Table 3, row 'Define mitigations and secure defaults, verify their effectiveness and set refresh triggers'"
    text: "Next, focus on 'What are we going to do about it?' For each top threat, specify the mitigation strategy, the required control(s) and the secure by default settings that the product should ship with (e.g. 'admin interface disabled by default', 'no default passwords', 'signed updates enforced', 'least-privilege roles', 'authentication attempts rate-limited'). Then map each control to how it will be verified (e.g. CI checks, tests, configuration validation, release gates), which will help to answer the question 'Did we do a good enough job?' Finally, define the triggers that require rerunning the model (e.g. a new internet-exposed interface, a new auth model, new sensitive data, a new critical dependency, a major architecture change)."
    expects_deliverables:
      - "Controls, defaults and verification checklist, including: Control/default decision for each top threat; test/verification mapping (automation first); explicit refresh triggers (so that the model stays current)."
    verification: "deliverable present"
    kind: "stated"
    testable: "partial"
