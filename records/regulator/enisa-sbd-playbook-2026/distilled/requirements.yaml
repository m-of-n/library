        published_by: "ENISA SbD&D Playbook Annex C (indicative mapping)"
  - id: "enisa-sbd-playbook-2026#PB-4.12"
    playbook: "4.12"
    principle_name: "Incident response and recovery"
    group: "secure by design / operational integrity"
    locator: "§4.12"
    principle: "Developers must be prepared to respond quickly and effectively to security incidents that affect their products in the field, including vulnerabilities, compromised code, malicious updates and misuse of product functionality."
    objective: "Detect, contain and recover from security incidents quickly while limiting customer impact and preventing recurrence. The priority is a clear playbook, defined ownership, fast triage and reliable restore/rollback, supported by the minimum logging and backup evidence needed to act decisively."
    checklist_headings:
      - "Define roles, escalation and decision authority"
      - "Create a minimal incident runbook"
      - "Prepare containment controls"
      - "Ensure recovery capability"
      - "Exercise and improve"
    phase: "operations/response"
    maps_to:
      - ref: "ANNEX-1.PT1.2.h"
