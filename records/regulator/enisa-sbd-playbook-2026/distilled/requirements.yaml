  - id: "enisa-sbd-playbook-2026#PB-4.20"
    playbook: "4.20"
    principle_name: "Automated maintenance and updates"
    group: "secure by default / guided protection"
    locator: "§4.20"
    principle: "Manufacturers should provide secure update mechanisms that minimise user and operational effort. Security updates should be enabled by default, while allowing authorised users or operators to approve or schedule installation where the deployment requires controlled updates."
    objective: "Ensure that vulnerabilities are addressed quickly and the device is left vulnerable for as little time as possible."
    checklist_headings:
