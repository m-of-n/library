schema: "library-messages/v1"
record: enisa-sbd-playbook-2026
note: >
  Structures whose content the playbook prescribes: the machine-processable attestation information groups (§5.4.1) and the
  work products named as deliverables / minimum evidence. ENISA explicitly does not define a schema for the attestation
  ('does not define a schema, field names or a required implementation format', §5.4.1); field lists below are its
  information-group functions and Figure 5's illustrative fields. constrained_by cites requirements.yaml ids.
messages:
  - id: MachineProcessableAttestation
    locator: "§5.1; §5.4; §5.4.1 table; Figure 5"
    fields:
      - {name: product_identity_and_scope, definition: "Defines product identity, versioning, scope to which the information applies and the manufacturer's cryptographic signature", required: true, constrained_by: []}
      - {name: control_layer, definition: "Defines structured security objectives aligned with requirements, security principles and/or applicable security policies or regulations", required: true, constrained_by: []}
      - {name: implementation_layer, definition: "Maps identified threats and security objectives to implemented controls, secure-default settings and supporting implementation information", required: true, constrained_by: []}
      - {name: assessment_and_verification_layer, definition: "Records assessment results and links to supporting evidence, such as test results, configuration checks, SBOMs and build-artefact hashes", required: true, constrained_by: []}
      - {name: component_identifiers, type: "PURL / CPE / SWHID", definition: "link claims and evidence to components listed in an SBOM", required: false, constrained_by: []}
      - {name: disclosure_tier, type: "enum (public attestation layer, restricted technical overlay)", required: false, constrained_by: []}
      - {name: schema_version, required: true, rule: "machine-processable requires defined field types and semantics, controlled values, structured representation of decision-relevant information and schema versioning (§5.1)", constrained_by: ["R-0027", "R-0028"]}
  - id: AttestationClaim
    locator: "Figure 5 (illustrative)"
    fields:
      - {name: threat_id, type: list, required: true, constrained_by: []}
      - {name: principle, required: true, constrained_by: []}
      - {name: mitigation_control, required: true, constrained_by: []}
      - {name: secure_by_default_setting, type: object, required: false, constrained_by: []}
      - {name: verification_gate, type: "object {method, status, evidence_hash}", required: true, constrained_by: []}
  - id: ReleaseSecurityReviewRecord
    locator: "Table 2 'Release risk review gate'; §4 release gate"
    fields:
      - {name: checklist_met, type: boolean, required: true, constrained_by: ["RM-7"]}
      - {name: defaults_verified, type: boolean, required: true, constrained_by: ["RM-7"]}
      - {name: known_vulnerabilities_triaged, type: boolean, required: true, constrained_by: ["RM-7"]}
      - {name: high_risks_treated_or_accepted_with_rationale, type: boolean, required: true, constrained_by: ["RM-7"]}
      - {name: decision, type: "enum (go, no-go)", required: true, constrained_by: ["RM-7"]}
      - {name: release_gate_results, type: "list of {criterion id PB-x-RG-nn, pass|fail|not affected}", required: true, constrained_by: ["R-0014", "R-0017"]}
      - {name: exceptions, type: "list of ExceptionRecord", required: false, constrained_by: ["R-0019"]}
  - id: ExceptionRecord
    locator: "§4 'Allow exceptions only with a documented rationale, owner and review date'; many release gates ('owner and expiry')"
    fields:
      - {name: rationale, required: true, constrained_by: ["R-0019"]}
      - {name: owner, required: true, constrained_by: ["R-0019"]}
      - {name: review_or_expiry_date, type: date, required: true, constrained_by: ["R-0019"]}
      - {name: compensating_controls, required: false, constrained_by: ["PB-4.13-EV-06"]}
  - id: RiskRegisterEntry
    locator: "Table 2 'Risk register'"
    fields:
      - {name: risk, required: true, constrained_by: ["RM-4"]}
      - {name: priority, rule: "simple, documented prioritisation method (impact, likelihood, plausibility, exploitability or exposure)", required: true, constrained_by: ["RM-4"]}
      - {name: owner, required: true, constrained_by: ["RM-4"]}
      - {name: treatment, required: true, constrained_by: ["RM-4"]}
      - {name: status, required: true, constrained_by: ["RM-4"]}
      - {name: backlog_links, type: list, required: false, constrained_by: ["RM-4"]}
      - {name: date, type: date, required: false, constrained_by: ["RM-8"]}
  - id: ThreatModelScopeNote
    locator: "Table 3 row 1"
    fields:
      - {name: purpose, required: true, constrained_by: ["TM-1"]}
      - {name: scope_boundaries, required: true, constrained_by: ["TM-1"]}
      - {name: assumptions_constraints, required: true, constrained_by: ["TM-1"]}
      - {name: security_objectives_and_crown_jewels, required: true, constrained_by: ["TM-1"]}
  - id: TopThreat
    locator: "Table 3 row 4; §4.1 minimum evidence"
    fields:
      - {name: scenario, required: true, constrained_by: ["TM-4"]}
      - {name: entry_exit_points_and_trust_boundaries, required: true, constrained_by: ["TM-4"]}
      - {name: priority, type: "H/M/L or severity", required: true, constrained_by: ["TM-4", "PB-4.1-CL-07"]}
      - {name: rationale, required: true, constrained_by: ["TM-4"]}
      - {name: owner, required: true, constrained_by: ["PB-4.1-EV-02"]}
      - {name: control_default_mapping, type: "what control, where enforced, how verified", required: true, constrained_by: ["PB-4.1-EV-03", "TM-5"]}
      - {name: refresh_triggers, type: list, required: true, constrained_by: ["TM-5", "PB-4.1-CL-10"]}
  - id: VulnerabilityRegisterEntry
    locator: "§4.13 Minimum evidence"
    fields:
      - {name: issue, required: true, constrained_by: ["PB-4.13-EV-01"]}
      - {name: severity, type: "critical/high/medium/low + internet-exposed, known-exploited flags", required: true, constrained_by: ["PB-4.13-EV-01", "PB-4.13-CL-03"]}
      - {name: affected_components_versions, required: true, constrained_by: ["PB-4.13-EV-01"]}
      - {name: owner, required: true, constrained_by: ["PB-4.13-EV-01"]}
      - {name: status, required: true, constrained_by: ["PB-4.13-EV-01"]}
      - {name: target_date, type: date, required: true, constrained_by: ["PB-4.13-EV-01"]}
      - {name: decision, type: "enum (fix now, mitigate, accept (time bound), defer (with rationale))", required: true, constrained_by: ["PB-4.13-CL-05"]}
      - {name: patch_release_link, type: "ticket -> PR(s) -> tests -> release version -> rollout confirmation", required: false, constrained_by: ["PB-4.13-EV-05"]}
  - id: SecurityLogEvent
    locator: "§4.10 Checklist"
    fields:
      - {name: actor, required: true, constrained_by: ["PB-4.10-CL-06"]}
      - {name: action_or_event_type, required: true, constrained_by: ["PB-4.10-CL-06"]}
      - {name: timestamp, type: datetime, required: true, constrained_by: ["PB-4.10-CL-06", "PB-4.10-CL-12"]}
      - {name: request_session_id, required: false, constrained_by: ["PB-4.10-RG-02"]}
      - {name: source, required: false, constrained_by: ["PB-4.10-RG-02"]}
  - id: AccessModelRow
    locator: "§4.2 Minimum evidence"
    fields:
      - {name: role_or_service, required: true, constrained_by: ["PB-4.2-EV-01", "PB-4.2-CL-01"]}
      - {name: allowed_actions, required: true, constrained_by: ["PB-4.2-EV-01", "PB-4.2-CL-02"]}
      - {name: resources, required: true, constrained_by: ["PB-4.2-EV-01", "PB-4.2-CL-02"]}
  - id: LifecyclePolicy
    locator: "§4.7 Checklist + Minimum evidence"
    fields:
      - {name: lifecycle_states, type: "active, maintenance, end of sale, end of support, end of life", required: true, constrained_by: ["PB-4.7-CL-01", "PB-4.7-EV-01"]}
      - {name: minimum_support_window, required: true, constrained_by: ["PB-4.7-CL-02"]}
      - {name: triage_and_patch_slas, type: "e.g. critical triaged in 48 hours; fixes within X days", required: true, constrained_by: ["PB-4.7-CL-02"]}
