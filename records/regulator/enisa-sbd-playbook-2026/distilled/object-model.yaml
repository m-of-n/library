schema: "library-object-model/v1"
record: enisa-sbd-playbook-2026
source_version: "1.0 (July 2026)"
question: "What objects (entity types) and relationship edges does the ENISA Secure by Design and Default Playbook assume or define?"
objects:
  - {name: Principle, definition: "a secure by design or secure by default principle (22), grouped into architectural foundations, operational integrity, default hardening, guided protection", attributes: [id, name, statement, group], locator: "§3; §4.1-§4.22", kind: stated, tmodel_mapping: "generic Mitigation pattern / Requirement family (DL-0009)", notes: "Groups are 'practical organising lenses rather than mutually exclusive classifications' (§3.1)."}
  - {name: Playbook, definition: "one-page, execution-focused guide per principle: Principle, Objective, Checklist, Minimum evidence, Release gate", attributes: [principle, objective, checklist, minimum_evidence, release_gate], locator: "§4 intro", kind: stated, tmodel_mapping: "SecurityProgram module (R-041) — a reusable bundle of Requirement + Evidence + Gate criteria", notes: ""}
  - {name: ChecklistAction, definition: "highest-impact action to implement, under a heading", attributes: [heading, text], locator: "§4 'Checklist'", kind: stated, tmodel_mapping: "Requirement (recommendation)", notes: ""}
  - {name: MinimumEvidence, definition: "smallest set of artefacts/logs/configurations demonstrating the checklist; reusable across playbooks; need not be separate documents", attributes: [text], locator: "§4 'Minimum evidence'", kind: stated, tmodel_mapping: "Evidence / WorkProduct (R-042)", notes: "Evidence reuse is explicit: one SBOM or release record may satisfy several playbooks."}
  - {name: ReleaseGateCriterion, definition: "copy and paste pass or fail criterion usable in release review or CI/CD", attributes: [text, result], locator: "§4 'Release gate'", kind: stated, tmodel_mapping: "Gate exit criterion (R-041) — automatable check (R-042)", notes: "125 criteria — the largest set of explicit gate criteria in the SDL records."}
  - {name: ReleaseGate, definition: "formal pre-release gate: checklist met, defaults verified, known vulnerabilities triaged, high risks treated/accepted with rationale; go/no-go", attributes: [decision, record], locator: "Table 2 'Release risk review gate'", kind: stated, tmodel_mapping: "Gate (R-041)", notes: "The only gate named; agile gates (definition of ready/done, PR checks) also mentioned (§2.1)."}
  - {name: Exception, definition: "documented exception with rationale, owner and review/expiry date", attributes: [rationale, owner, review_date], locator: "§4; many release gates", kind: stated, tmodel_mapping: "accepted-risk MitigationInstance (DEC-009)", notes: "Time-bound acceptance is the norm."}
  - {name: LifecycleProcess, definition: "Requirements, Design, Implementation, Verification, Deployment, Maintenance and disposal — groupings, not a mandatory sequence", attributes: [name, actions, deliverables], locator: "§2.1; Table 1", kind: stated, tmodel_mapping: "LifecyclePhase (§3b) / canonical phase", notes: ""}
  - {name: RiskManagementActivity, definition: "product context, asset & adverse effect identification, threat modelling, risk register, acceptance criteria, requirements baseline, release gate, change-triggered reassessment", attributes: [name, actions, deliverables], locator: "§2.2 Table 2", kind: stated, tmodel_mapping: "Requirement (process) with WorkProduct", notes: ""}
  - {name: ProductContext, definition: "intended use, deployment environments, user/admin roles, data types/sensitivity, external dependencies", attributes: [], locator: "Table 2 row 1", kind: stated, tmodel_mapping: "Product context node", notes: ""}
  - {name: Asset, definition: "top data, hardware or function assets; 'crown jewels'", attributes: [], locator: "Table 2; Table 3; §4.1", kind: stated, tmodel_mapping: "Asset (§3)", notes: ""}
  - {name: AdverseEffect, definition: "key adverse effect outcomes (privacy breach, takeover, outage, fraud, safety impact)", attributes: [], locator: "Table 2 row 2; §2.3", kind: stated, tmodel_mapping: "impact/damage scenario (cf. ISO 21434 damage scenario)", notes: ""}
  - {name: ThreatModel, definition: "minimum viable model: scope note, system representation, trust boundaries & privileged paths, top threats, controls/defaults/verification, refresh triggers", attributes: [scope, representation, threats, refresh_triggers], locator: "§2.3 Table 3; §4.1", kind: stated, tmodel_mapping: "tmodel threat-model instance (R-043 governed view)", notes: "Shostack four questions; collaborative, iterative; anti-patterns listed."}
  - {name: ThreatScenario, definition: "credible threat scenario mapped to entry/exit points, data flows, trust boundaries; prioritised (H/M/L) with owner", attributes: [scenario, boundary, likelihood, impact, priority, owner], locator: "Table 3 row 4; §4.1; §5.4.2.1", kind: stated, tmodel_mapping: "ThreatInstance (§1.3) + RiskScore", notes: "Top 5 to 10 for SMEs."}
  - {name: TrustBoundary, definition: "where data, identities and execution contexts cross from a more trusted domain to a less trusted one (or vice versa)", attributes: [], locator: "§3.1.1; §4.1", kind: stated, tmodel_mapping: "TrustBoundary (§1.1)", notes: ""}
  - {name: PrivilegedPath, definition: "highest-privilege operations/flows (firmware/OTA updates, remote admin, key provisioning, identity issuance)", attributes: [], locator: "Table 3 row 3; §4.1; §5.4.2.1", kind: stated, tmodel_mapping: "new — high-privilege DataFlow class", notes: ""}
  - {name: EntryPoint, definition: "APIs, admin UI, update channel, local ports", attributes: [], locator: "Table 3; §4.1", kind: stated, tmodel_mapping: "AttackSurface (§1.1)", notes: ""}
  - {name: RefreshTrigger, definition: "event requiring rerun of the model (new interface, auth change, new sensitive data, new critical dependency, major architecture change, OTA/update change)", attributes: [], locator: "Table 3 row 5; §4.1", kind: stated, tmodel_mapping: "new — event that invalidates a governed view (R-043)", notes: ""}
  - {name: RiskRegister, definition: "10 to 30 risks with owner, treatment, status, linked to backlog", attributes: [], locator: "Table 2 row 4", kind: stated, tmodel_mapping: "RiskScore set over ThreatInstances (governed view)", notes: ""}
  - {name: RiskAcceptanceCriteria, definition: "non-negotiable risk conditions + criteria for accepting residual risk", attributes: [], locator: "Table 2 row 5", kind: stated, tmodel_mapping: "Gate rule / DEC-009 accept policy", notes: ""}
  - {name: SecurityRequirement, definition: "testable 'must' requirements derived from top risks", attributes: [], locator: "Table 2 row 6", kind: stated, tmodel_mapping: "Requirement on Product", notes: ""}
  - {name: SecureDefault, definition: "setting a product ships with (deny by default, no default passwords, signed updates enforced, ...)", attributes: [setting, rationale], locator: "§3.2; Table 3 row 5; §4.8 evidence 'Secure defaults list'", kind: stated, tmodel_mapping: "MitigationInstance kind=technical with 'default' flag", notes: ""}
  - {name: Control, definition: "required control per top threat, where enforced, how verified", attributes: [where_enforced, verification_method], locator: "§4.1; §5.4.2.2", kind: stated, tmodel_mapping: "MitigationInstance (§5)", notes: ""}
  - {name: VerificationMethod, definition: "tests, CI checks, config validation, release gates; negative tests", attributes: [], locator: "§4.1; Table 3", kind: stated, tmodel_mapping: "Evidence generator", notes: ""}
  - {name: SecurityState, definition: "secure baseline vs degraded/unsupported state of the product", attributes: [], locator: "§4.21", kind: stated, tmodel_mapping: "new — runtime posture of ProductInstance", notes: ""}
  - {name: ProductLifecycleState, definition: "active, maintenance, end of sale, end of support, end of life", attributes: [], locator: "§4.7", kind: stated, tmodel_mapping: "ProductInstance lifecycle (§3b)", notes: ""}
  - {name: Vulnerability, definition: "issue with severity, flags, affected versions, owner, status, target date; disposition fix/mitigate/accept/defer", attributes: [], locator: "§4.13", kind: stated, tmodel_mapping: "Vulnerability / Finding (§1.3)", notes: ""}
  - {name: SLA, definition: "triage and remediation targets (e.g. critical triaged in 48 h)", attributes: [], locator: "§4.7; §4.13", kind: stated, tmodel_mapping: "timer on Finding workflow", notes: "Numbers left to the manufacturer ('XX hours')."}
  - {name: SBOM, definition: "per-release, machine-readable (SPDX or CycloneDX), signed/published per policy", attributes: [], locator: "§3.1.2; §4.6; §4.7; §4.14", kind: stated, tmodel_mapping: "external SBOM; composed_of", notes: ""}
  - {name: Supplier, definition: "critical supplier with security contact/VDP, patch timelines, secure development confirmation; SCVS-aligned questionnaire", attributes: [], locator: "§4.14", kind: stated, tmodel_mapping: "Party supplier", notes: ""}
  - {name: Identity, definition: "unique identity per user, device, service, administrator from an authoritative source", attributes: [], locator: "§4.3; §4.18", kind: stated, tmodel_mapping: "Party / device identity (cf. TCG DICE records)", notes: ""}
  - {name: DeviceSecret, definition: "unique per-device credential or key, protected against extraction, revocable", attributes: [], locator: "§4.18", kind: stated, tmodel_mapping: "Asset (security)", notes: ""}
  - {name: Attestation, definition: "machine-processable, manufacturer-issued, signed claim set linking security objectives, implementation and verification evidence", attributes: [layers, signature, schema_version], locator: "§5.1; §5.4", kind: stated, tmodel_mapping: "Assertion (§4) — signed, with evidence links; export target", notes: "ENISA: not proof of security; attestation ≠ verification ≠ independent assessment."}
  - {name: AttestationLayer, definition: "product identity & scope; control layer; implementation layer; assessment & verification layer", attributes: [], locator: "§5.4; §5.4.1", kind: stated, tmodel_mapping: "R-043 governed view structure / Requirement -> Mitigation -> Evidence chain", notes: "The cascade objective -> implementation -> evidence is the R-042 conformance chain."}
  - {name: DisclosureTier, definition: "public attestation layer vs restricted technical overlay behind authenticated API", attributes: [], locator: "§5.4", kind: stated, tmodel_mapping: "new — access tier on Evidence", notes: ""}
  - {name: ComponentIdentifier, definition: "PURL, CPE, SWHID linking claims to SBOM components", attributes: [], locator: "§5.4", kind: stated, tmodel_mapping: "Component identifier", notes: ""}
  - {name: Assessor, definition: "third-party assessor consuming claims, evidence and spot checks", attributes: [], locator: "§5.4.2.4", kind: stated, tmodel_mapping: "Party role (reviewer)", notes: ""}
  - {name: SME, definition: "organisation with fewer than 250 employees and turnover below EUR 50 million; target audience", attributes: [], locator: "§1.2", kind: stated, tmodel_mapping: "attribute of Party (manufacturer size) — applicability tier", notes: "Proportionality axis like ETSI DG."}
  - name: CRAEssentialRequirement
    definition: "an essential cybersecurity requirement of CRA Annex I (Part I or Part II), identified in the playbook as ANNEX-1.PT1.x / ANNEX-1.PT2.x and quoted in Annex B"
    attributes:
      - annex_id
      - text
    locator: "Annex B; Annex C"
    kind: stated
    tmodel_mapping: "Requirement (external, eu-cra-2024-2847#AnnexI-*)"
    notes: "added by the verify pass so the Annex C maps_to edge has a defined endpoint"
edges:
  - {name: realised_by, from: Principle, to: Playbook, cardinality: "1:1", definition: "each playbook distils a single principle", locator: "§4", kind: stated, tmodel_mapping: "Requirement family -> module"}
  - {name: contains, from: Playbook, to: ChecklistAction, cardinality: "1:N", definition: "", locator: "§4", kind: stated, tmodel_mapping: ""}
  - {name: evidenced_by, from: ChecklistAction, to: MinimumEvidence, cardinality: "N:M", definition: "minimum evidence demonstrates the checklist has been implemented", locator: "§4", kind: stated, tmodel_mapping: "Requirement satisfied_by Evidence (R-042)"}
  - {name: shared_across, from: MinimumEvidence, to: Playbook, cardinality: "N:M", definition: "a single item of evidence may support several playbooks", locator: "§4", kind: stated, tmodel_mapping: "Evidence reuse"}
  - {name: gated_by, from: Playbook, to: ReleaseGateCriterion, cardinality: "1:N", definition: "", locator: "§4", kind: stated, tmodel_mapping: "Gate exit criteria"}
  - {name: part_of, from: ReleaseGateCriterion, to: ReleaseGate, cardinality: "N:1", definition: "criteria as agenda items in release readiness", locator: "§4 intro", kind: stated, tmodel_mapping: "Gate composition"}
  - {name: maps_to, from: Principle, to: CRAEssentialRequirement, cardinality: "N:M", definition: "indicative mapping (62 rows)", locator: "Annex C", kind: stated, tmodel_mapping: "R-044 maps_to (strength: indicative)"}
  - {name: informs, from: RiskManagementActivity, to: Principle, cardinality: "N:M", definition: "risk management establishes the context within which principles are applied; prioritises playbooks", locator: "§2.1 Figure 1; §2.2", kind: stated, tmodel_mapping: "context -> selection"}
  - {name: crosses, from: ThreatScenario, to: TrustBoundary, cardinality: "N:M", definition: "threats tied to entry/exit points and boundaries", locator: "Table 3 row 4", kind: stated, tmodel_mapping: "ThreatInstance at boundary"}
  - {name: mitigated_by, from: ThreatScenario, to: Control, cardinality: "1:N", definition: "control/default decision per top threat", locator: "Table 3 row 5; §5.4.2.2", kind: stated, tmodel_mapping: "MitigationInstance mitigates ThreatInstance"}
  - {name: sets_default, from: Control, to: SecureDefault, cardinality: "1:N", definition: "secure-by-default setting per control", locator: "§5.4.2.2", kind: stated, tmodel_mapping: "technical mitigation configuration"}
  - {name: verified_by, from: Control, to: VerificationMethod, cardinality: "1:N", definition: "map each control to a verification method", locator: "§4.1", kind: stated, tmodel_mapping: "Mitigation -> Evidence generator"}
  - {name: invalidated_by, from: ThreatModel, to: RefreshTrigger, cardinality: "1:N", definition: "triggers require rerunning the model", locator: "Table 3 row 5", kind: stated, tmodel_mapping: "event invalidates governed view"}
  - {name: excepted_by, from: ReleaseGateCriterion, to: Exception, cardinality: "1:N", definition: "documented exception with owner and expiry", locator: "§4; release gates", kind: stated, tmodel_mapping: "accepted-risk"}
  - {name: attests, from: Attestation, to: Control, cardinality: "1:N", definition: "claims about implemented controls", locator: "§5.4", kind: stated, tmodel_mapping: "Assertion about MitigationInstance"}
  - {name: links_evidence, from: Attestation, to: MinimumEvidence, cardinality: "N:M", definition: "claims linked to evidence (test results, SBOMs, hashes)", locator: "§5.1; §5.4", kind: stated, tmodel_mapping: "Assertion -> Evidence (PROV)"}
  - {name: covers, from: Attestation, to: ComponentIdentifier, cardinality: "N:M", definition: "which components/versions/builds were covered", locator: "§5.4", kind: stated, tmodel_mapping: "Assertion scope"}
  - {name: verifies, from: Assessor, to: Attestation, cardinality: "N:M", definition: "third-party verification by spot checks", locator: "§5.4.2.4", kind: stated, tmodel_mapping: "Review of Assertion"}
  - {name: transitions_to, from: SecurityState, to: SecurityState, cardinality: "N:M", definition: "degraded by user choice, restored by one action", locator: "§4.21", kind: stated, tmodel_mapping: "runtime posture"}
gaps:
  - "Evidence reuse across Requirements is explicit (one artefact satisfies several playbooks) — tmodel Evidence must be many-to-many with Requirement, not owned by one."
  - "Release-gate criteria as a first-class, parameterised checklist (125 criteria; 'unchanged controls may be recorded as not affected') — R-041 Gate needs per-criterion results incl. 'not affected'."
  - "Refresh triggers that invalidate a threat model — R-043 governed views need an invalidation event type, not only versions."
  - "Attestation disclosure tiers (public signed claims vs restricted overlay) — tmodel Assertion has no access tier."
  - "Runtime security posture (secure baseline / degraded) of a ProductInstance — not modelled; only design-time state exists."
  - "PrivilegedPath as a distinguished flow class (updates, key provisioning, admin) — DFD layer has no privilege attribute on flows."
  - "Time-bound exceptions everywhere ('owner and expiry date') — DEC-009 accepted state needs mandatory expiry."
