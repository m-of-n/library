  - id: "F12"
    name: "guidance-and-assistance"
    title: "Asking agencies for guidance"
    locator: "Resources; Ownership; Vulnerability Management"
    participants:
      - "organization"
      - "agency"
      - "manufacturer"
    trigger: >-
      A buyer finds an element hard to apply to its sector, or a manufacturer considers becoming a
      CNA.
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "880-881"
        quote: |-
          Individual elements of secure by design may be difficult to apply perfectly to the current processes of a sector or subsector.
    summary: >-
      Buyers ask their Sector Risk Management Agency, or CISA's SecureByDesignOT address, for
      guidance, and U.S. organizations consult their sector agency on minimum system
      functionality; CISA offers free products and services; manufacturers ask CISA about becoming
      a CNA.
    order_note: "No order is stated; each step is an independent request."
    steps:
      - n: "1"
        from:
          - "organization"
        to:
          - "agency"
        message: "GuidanceRequest"
        action: >-
          Ask the appropriate Sector Risk Management Agency, or SecureByDesignOT@cisa.dhs.gov, for
          further guidance.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "881-882"
            quote: |-
              For further guidance, reach out to the appropriate Sector Risk Management Agency or SecureByDesignOT@cisa.dhs.gov.
        related:
          - "cisa-secure-by-demand-ot-2025#R-0100"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "organization"
        to:
          - "agency"
        message: "GuidanceRequest"
        condition: "A U.S. organization planning minimum system functionality for business continuity."
        action: "Consult the appropriate sector risk management agency."
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "448-450"
            quote: |-
              For guidance on the recommended minimum system functionality to aim for, U.S. organizations should consult their appropriate sector risk management agency.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0033"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "agency"
        to:
          - "organization"
        message: "AssistanceOffer"
        action: >-
          CISA offers free products and services; see its website or contact a regional
          cybersecurity advisor.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "882-884"
            quote: |-
              Additionally, CISA offers free products and services to help critical infrastructure owners and operators secure their current infrastructure. See our website for a full listing or contact a regional cybersecurity advisor.
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "manufacturer"
        to:
          - "agency"
        message: "CnaEnquiry"
        condition: "The manufacturer's vulnerability handling is mature."
        action: "Contact CISA (cvd@cisa.dhs.gov) about becoming a CNA."
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "810-811"
            quote: |-
              For more information, contact CISA at cvd@cisa.dhs.gov.
        related_candidates:
          - "C-0086"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
  - id: "F13"
    name: "secure-default-and-legacy"
    title: "Secure by default alongside legacy devices"
    locator: "Secure by Default"
    participants:
      - "manufacturer"
      - "operator"
      - "ot_product"
      - "legacy_device"
    trigger: "A product is deployed into an environment with legacy components."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "524-525"
        quote: |-
          Backwards compatibility is often embedded into new devices to help ensure they work with existing deployments.
    summary: >-
      The product ships with the most secure default preset and a hardening guide that states the
      risks of changing defaults; it keeps working with legacy components by prioritizing security
      features and downgrading only by negotiation, or through an embedded protocol gateway, so
      security improves gradually.
    order_note: "Stated: step 1 before deployment (delivered secure). Steps 2 to 4 are not placed."
    steps:
      - n: "1"
        from:
          - "manufacturer"
        to:
          - "operator"
        message: "SecureDefaultConfiguration"
        action: >-
          Deliver the most secure default configuration preset, document the level of security
          included, and embed a hardening guide stating the risks of changing default options.
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "520-522"
            quote: |-
              buyers should seek manufacturers that document the level of security included in their products, with the most secure default configuration preset removing the burden of hardening from operators.
          - source_lines: "509-510"
            quote: |-
              Embedding secure deployment guidance or hardening guides into the product by default; the guide should clearly state security risks introduced by operators changing default configuration options.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0041"
          - "cisa-secure-by-demand-ot-2025#R-0133"
          - "cisa-secure-by-demand-ot-2025#R-0134"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "ot_product"
        to:
          - "legacy_device"
        message: "NegotiatedDowngrade"
        condition: "A legacy component cannot use the secure option."
        action: "Prioritize the security features and downgrade only by negotiation, when necessary."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "530-531"
            quote: |-
              seek manufacturers that develop backwards compatibility operating models that prioritize security features with negotiated downgrades when necessary.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0045"
        order: "inferred"
        on_error: "see F13-E1"
        on_error_basis: "stated"
      - n: "3"
        from:
          - "ot_product"
        to:
          - "legacy_device"
        message: "ProtocolTranslation"
        condition: "A newer secure device is deployed among legacy devices."
        action: >-
          Bridge to the legacy devices through a protocol gateway built into the new device, which
          keeps its own communication secure by default.
        kind: "stated"
        basis: "example"
        quotes:
          - source_lines: "534-535"
            quote: |-
              an owner/operator could deploy a newer secure device with an embedded protocol gateway that translates it to observed legacy devices while still communicating securely by default.
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "GradualHardening"
        action: >-
          Improve security gradually inside existing operator workflows, instead of a large-scale
          rip and replace.
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "523-524"
            quote: |-
              Buyers should also ask for security implementations that work with their existing operator workflows and allow for gradual security improvements.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0042"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F13-E1"
        at: "2"
        condition: "Backwards compatibility requires security features to ship disabled."
        outcome: >-
          Security features are not enabled by default and long guidance is needed to turn off
          insecure services: the operating model the element asks buyers to move away from.
        kind: "stated"
        quotes:
          - source_lines: "525-528"
            quote: |-
              However, this compatibility often requires that security features in new devices are not enabled by default to help ensure the legacy components can communicate seamlessly. This can be seen in lengthy secure deployment guidance that details how to turn off old insecure services.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0043"
          - "cisa-secure-by-demand-ot-2025#R-0044"
provisions_not_in_flows:
  - what: >-
      Open Standards: interoperability, vendor switching, parsers and working groups (R-0024,
      R-0122 with its items R-0123 to R-0125, R-0026, R-0027).
    why: "Product and manufacturer properties weighed in F01 step 6; no exchange is stated."
    related:
      - "cisa-secure-by-demand-ot-2025#R-0026"
      - "cisa-secure-by-demand-ot-2025#R-0027"
  - what: >-
      Ownership: explicit roles and dependencies, support contracts with local engineering firms,
      warranty terms, barriers (R-0028, questions R-0227, R-0228, R-0229, R-0029, R-0126 with its
      items R-0127 to R-0129, R-0031).
    why: >-
      Contractual properties asked about in F01; the support and maintenance exchanges they enable
      are not described.
    related:
      - "cisa-secure-by-demand-ot-2025#R-0028"
      - "cisa-secure-by-demand-ot-2025#R-0126"
      - "cisa-secure-by-demand-ot-2025#R-0127"
      - "cisa-secure-by-demand-ot-2025#R-0128"
      - "cisa-secure-by-demand-ot-2025#R-0129"
  - what: >-
      Protection of Data: encryption at rest, integrity verification, minimal access and sharing
      (questions R-0233, R-0234, R-0034).
    why: "Product properties; only the push and approval exchange is modelled (F04)."
    related:
      - "cisa-secure-by-demand-ot-2025#R-0034"
      - "cisa-secure-by-demand-ot-2025#R-0233"
      - "cisa-secure-by-demand-ot-2025#R-0234"
  - what: >-
      Secure by Default: no default passwords, friction for internet exposure, security at no
      additional cost (R-0130, R-0131, R-0132, R-0039).
    why: >-
      Delivered properties of the product; F13 models only the default preset and legacy
      compatibility.
    related:
      - "cisa-secure-by-demand-ot-2025#R-0039"
      - "cisa-secure-by-demand-ot-2025#R-0130"
      - "cisa-secure-by-demand-ot-2025#R-0131"
      - "cisa-secure-by-demand-ot-2025#R-0132"
  - what: >-
      Threat Modeling: what a threat model contains and how buyers use it (R-0073, R-0075,
      R-0269 and its six questions R-0270, R-0271, R-0143, R-0144, R-0272, R-0273).
    why: >-
      The threat model is an answer in F01 and an input to patch prioritization in F09; its use by
      buyers is not an exchange.
    related:
      - "cisa-secure-by-demand-ot-2025#R-0073"
      - "cisa-secure-by-demand-ot-2025#R-0075"
      - "cisa-secure-by-demand-ot-2025#R-0269"
      - "cisa-secure-by-demand-ot-2025#R-0270"
      - "cisa-secure-by-demand-ot-2025#R-0271"
      - "cisa-secure-by-demand-ot-2025#R-0143"
      - "cisa-secure-by-demand-ot-2025#R-0144"
      - "cisa-secure-by-demand-ot-2025#R-0272"
      - "cisa-secure-by-demand-ot-2025#R-0273"
open_issues:
  - id: "OI-01"
    issue: >-
      Secure Communications labels its question list Key considerations, where the other eleven
      elements say Questions to ask. Whether these are questions to put to the manufacturer is not
      said; F01 treats them as such.
    quotes:
      - source_lines: "554"
        quote: |-
          Key considerations: Does the product simplify the deployment and renewal of certificates for devices?
  - id: "OI-02"
    issue: >-
      No decision rule: the elements are not in priority order and the guide gives no minimum set,
      weighting or threshold, so the outcome of F01 for a product missing an element is
      unspecified (F01-E2). The only stated exclusion is F01-E1.
    quotes:
      - source_lines: "260"
        quote: |-
          These elements are not in priority order.
  - id: "OI-03"
    issue: >-
      Upgrade and Patch Tooling refers to a Vulnerability Handling section; no section has that
      title (the element is Vulnerability Management).
    quotes:
      - source_lines: "857"
        quote: |-
          (see Vulnerability Handling section)
  - id: "OI-04"
    issue: >-
      When the operating system port is owed differs: the Summary puts it before the original
      operating system loses support, the selection criteria after it has lost support, and the
      question at its end of life.
    quotes:
      - source_lines: "142-143"
        quote: |-
          supports moving to a supported operating system version at no extra cost if the original operation system is soon to be no longer supported.
      - source_lines: "828-829"
        quote: |-
          This includes porting supported software to new operating systems free of charge if the original operating system is no longer supported.
  - id: "OI-05"
    issue: >-
      Only two VEX statuses are named ('not affected', 'under investigation'), for celebrity
      vulnerabilities only; whether other VEX statements are expected is not said.
    quotes:
      - source_lines: "794-796"
        quote: |-
          Vulnerability Exploitability eXchange (VEX) statements indicating the “not affected” or “under investigation” status for “celebrity vulnerabilities” (i.e., Log4Shell-type vulnerabilities) should follow the CSAF standard.
  - id: "OI-06"
    issue: >-
      Strong Authentication says RBAC and/or ABAC in its numbered list and RBAC and ABAC in the
      next sentence; the Summary and criteria name RBAC only. Whether ABAC is required alongside
      RBAC is ambiguous.
    quotes:
      - source_lines: "664-666"
        quote: |-
          1. RBAC and/or attribute-based access control (ABAC) 2. Phishing-resistant MFA Buyers should seek products with RBAC and ABAC rather than relying on common accounts.
  - id: "OI-07"
    issue: >-
      The first logging question has a stray comma straight after log (see the quotation), which
      leaves the object of log unclear; F03 reads it as logging restarts, logins and changes.
    quotes:
      - source_lines: "340"
        quote: |-
          Does the product log, restarts, logins, or changes to the product?
  - id: "OI-08"
    issue: >-
      Almost every act of a manufacturer or product in the guide is stated as something buyers
      should seek, look for or ask about (basis sought or question): the guide binds the buyer's
      selection. The exceptions, the 19 entries under related (most in Vulnerability Management,
      one to three sentences in each of six other considerations, as RR-2 says), state the act of the product
      or manufacturer without the buyer; the guide binds no one in either case (R-0311).
      Design notes should not read the sought steps as manufacturer obligations.
    quotes:
      - source_lines: "269"
        quote: |-
          The following sections provide buyers with guidance on questions to ask manufacturers
    related:
      - "cisa-secure-by-demand-ot-2025#R-0017"
