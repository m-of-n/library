        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "363-365"
            quote: |-
              Buyers should then seek manufacturers that supplement minimum log types with information from the manufacturer’s written threat model (see the Threat Model section).
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0022"
        order: "stated"
        order_reason: "Then: after the minimum set of step 1."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "ot_product"
        to:
          - "operator"
        message: "ProcessTelemetry"
        action: "Provide telemetry and logs useful for predicting and preventing process failures."
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "341"
            quote: |-
              provide telemetry and logs that help predict and prevent process failure?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0220"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F03-E1"
        at: "2"
        condition: "Shipping the logs over the network to a security tool is not safe."
        outcome: "Local logging, already enabled by default, still supports incident responders."
        kind: "stated"
        quotes:
          - source_lines: "351-352"
            quote: |-
              Even in scenarios where the logs cannot safely be aggregated over the network into a security tool, OT products with local logging already enabled through their default function will support incident responders.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0018"
      - id: "F03-E2"
        at: "1"
        condition: "The product keeps no logs."
        outcome: >-
          An attacker can persist through configuration or logic changes, or degrade operations,
          and nothing records it.
        kind: "stated"
        quotes:
          - source_lines: "366-368"
            quote: |-
              Without logs, cyber threat actors can establish persistence through configuration or logic changes, or degrade operational efficiency, without leaving a record of the action for the operator or incident responders.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0023"
  - id: "F04"
    name: "remote-connection-and-data"
    title: "Data leaving the OT network and two-way connections"
    locator: "Protection of Data"
    participants:
      - "ot_product"
      - "manufacturer"
      - "operator"
    trigger: >-
      The manufacturer or vendor needs operational data, or a connection for maintenance or
      management.
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "475-476"
        quote: |-
          These external connections are often used for maintenance and management purposes for complex systems.
    summary: >-
      Data leaves the OT network by being pushed out as necessary, not pulled; where a two-way
      connection is required, the product requires the operator's approval before establishing it.
      The manufacturer explains how it protects copies of the data.
    order_note: "Stated: step 3 before the connection exists. Steps 1 and 5 are not placed."
    steps:
      - n: "1"
        from:
          - "ot_product"
        to:
          - "manufacturer"
        message: "OperationalDataPush"
        action: >-
          Push data out of the OT network as necessary; the manufacturer relies on pushed data
          rather than pulling it out.
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "473-474"
            quote: |-
              Buyers should seek out manufacturers that rely on data pushed out of the OT network as necessary, rather than pulling data out of the OT network.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0036"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "manufacturer"
        to:
          - "ot_product"
        message: "ConnectionRequest"
        condition: "A two-way connection is required (e.g. for maintenance or management)."
        action: "Ask for a two-way connection into the OT network."
        kind: "stated"
        basis: "presupposed"
        quotes:
          - source_lines: "475-476"
            quote: |-
              These external connections are often used for maintenance and management purposes for complex systems.
        order: "inferred"
        on_error: "see F04-E1"
        on_error_basis: "inferred"
      - n: "3"
        from:
          - "ot_product"
        to:
          - "operator"
        message: "ConnectionApproval"
        action: "Require the operator's approval before the connection is established."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "476-477"
            quote: |-
              If two-way connections are required, buyers should seek out products that require an operator’s approval to establish a connection.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0037"
        order: "stated"
        order_reason: "The approval is a precondition of establishing the connection."
        on_error: "see F04-E1"
        on_error_basis: "inferred"
      - n: "4"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "ConnectionApproval"
        action: "Approve; the connection is established."
        kind: "inferred"
        inferred_reason: >-
          The source requires approval before establishment; the approval act and its form are not
          described.
        order: "inferred"
        on_error: "see F04-E1"
        on_error_basis: "inferred"
      - n: "5"
        from:
          - "manufacturer"
        to:
          - "operator"
        message: "DataProtectionExplanation"
        action: >-
          Explain how copies of the data are protected, and whether the product shares or sells
          its data.
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "471-472"
            quote: |-
              Look for manufacturers and vendors that can explain how they protect copies of this data.
          - source_lines: "464"
            quote: |-
              Does the product share or sell its data to anyone?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0035"
          - "cisa-secure-by-demand-ot-2025#R-0235"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F04-E1"
        at: "4"
        condition: "The operator does not approve."
        outcome: "No connection is established (this model's reading of the approval requirement)."
        kind: "inferred"
      - id: "F04-E2"
        at: "3"
        condition: "Network segmentation is misconfigured."
        outcome: "The approval check inside the product limits the impact."
        kind: "stated"
        quotes:
          - source_lines: "477-478"
            quote: |-
              Including this check in the product helps mitigate the impact of segmentation misconfigurations.
  - id: "F05"
    name: "authenticated-communication"
    title: "Authenticated device communication and certificates"
    locator: "Secure Communications; Summary element 7"
    participants:
      - "operator"
      - "ot_product"
      - "peer_device"
    trigger: "Devices on the OT network communicate machine to machine."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "560-561"
        quote: |-
          The goal of this consideration is to improve the usability and uptake of secure machine-to-machine communications in OT networks.
    summary: >-
      Devices communicate authenticated with deployed certificates that the operator can deploy
      and renew without being a cyber expert. An expired certificate fails loudly while critical
      processes continue; until certificate management is in place, a sign-only or opportunistic
      TLS mode logs expiry without blocking communication.
    order_note: >-
      Stated: step 2 after step 1; step 3 on expiry; step 5 after step 3. Steps 4 and 6 are not
      placed.
    steps:
      - n: "1"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "DeviceCertificate"
        action: >-
          Deploy device certificates and renew them; the product makes deployment and renewal
          simple enough that operators need not be cyber experts.
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "112-113"
            quote: |-
              Seek out products that simplify digital certificate deployment and renewal such that operators do not need to be cyber experts to achieve secure authenticated communications.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0053"
          - "cisa-secure-by-demand-ot-2025#R-0187"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "ot_product"
        to:
          - "peer_device"
        message: "AuthenticatedMessage"
        action: "Communicate authenticated, using the deployed device certificates."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "552"
            quote: |-
              Products should support authenticated communication with device certificates deployed
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0135"
        order: "stated"
        order_reason: "Uses the certificates deployed in step 1."
        on_error: "see F05-E2"
        on_error_basis: "stated"
      - n: "3"
        from:
          - "ot_product"
        to:
          - "operator"
        message: "CertificateFailureSignal"
        condition: "A certificate expires."
        action: "Fail loudly, but let critical processes continue."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "111-112"
            quote: |-
              fail loudly (e.g., when a certificate expires) but allows critical processes to continue.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0186"
        order: "stated"
        order_reason: "On expiry of a certificate deployed in step 1."
        on_error: "see F05-E1"
        on_error_basis: "stated"
      - n: "4"
        from:
          - "ot_product"
        to:
          - "peer_device"
        message: "InterimSignedMode"
        condition: "Certificate management is not yet established."
        action: >-
          Run TLS sign-only (unencrypted but signed) or opportunistic TLS as an interim safety
          solution: an expired certificate generates logs and does not prevent communication.
        kind: "stated"
        basis: "permission"
        quotes:
          - source_lines: "581-583"
            quote: |-
              operators may consider the equivalent of a TLS sign-only (unencrypted but still signed with a private key) or opportunistic TLS mode as an interim safety solution, where an expired certificate will generate logs but not prevent communication.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0054"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "CertificateRenewal"
        action: "Replace the expired certificate."
        kind: "stated"
        basis: "presupposed"
        note: "Named as the mistake that causes downtime when it is missed."
        quotes:
          - source_lines: "570-571"
            quote: |-
              It is easy for mistakes to occur, such as failure to replace an expired certificate, resulting in downtime.
        related_candidates:
          - "C-0058"
        order: "stated"
        order_reason: "After the loud failure of step 3."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "ot_product"
        to:
          - "ot_product"
        message: "CryptographicUpgrade"
        condition: "The product's cryptography becomes vulnerable."
        action: "Upgrade the cryptography (cryptographic agility)."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "576-577"
            quote: |-
              buyers should ask for products that support cryptographic agility to allow system upgrades if a product’s cryptography becomes vulnerable.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0052"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F05-E1"
        at: "3"
        condition: "A certificate expires."
        outcome: >-
          The product fails loudly and critical processes continue; in the interim modes an
          expired certificate produces logs and communication goes on.
        kind: "stated"
        quotes:
          - source_lines: "553"
            quote: |-
              that fails loudly but that allows critical processes to continue.
          - source_lines: "583"
            quote: |-
              where an expired certificate will generate logs but not prevent communication.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0135"
          - "cisa-secure-by-demand-ot-2025#R-0054"
      - id: "F05-E2"
        at: "2"
        condition: "Communication is unauthenticated."
        outcome: "Any device can be impersonated, and safety-impacting commands sent in its name."
        kind: "stated"
        quotes:
          - source_lines: "562-564"
            quote: |-
              Without authentication, cyber threat actors can impersonate any device and send safety-impacting commands across the network;
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0136"
  - id: "F06"
    name: "command-handling"
    title: "Handling commands on a hostile network"
    locator: "Secure Controls; Summary element 8"
    participants:
      - "supervisory_control"
      - "threat_actor"
      - "ot_product"
      - "operator"
    trigger: "A command reaches a component; the component assumes a threat actor is on the network."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "598-599"
        quote: |-
          The product assumes a threat actor is operating on the network and protects itself against malicious emergency, safety, or diagnostic commands.
    summary: >-
      The component establishes trust for commands, prevents or ignores commands that create known
      safety concerns, treats maintenance commands during active operation differently, alerts on
      breaks from a standard and may ignore or respond to anomalous behaviour rather than only log
      it. It stays stable through security scans.
    order_note: >-
      No order is stated between the checks; the scan of step 7 is independent of the command
      path.
    steps:
      - n: "1"
        from:
          - "supervisory_control"
        to:
          - "ot_product"
        message: "Command"
        action: "Send a command (control, emergency, safety, diagnostic, maintenance)."
        kind: "stated"
        basis: "presupposed"
        quotes:
          - source_lines: "598-599"
            quote: |-
              protects itself against malicious emergency, safety, or diagnostic commands.
        related:
          - "cisa-secure-by-demand-ot-2025#R-0250"
        order: "first"
        on_error: "see F06-E1"
        on_error_basis: "stated"
      - n: "2"
        from:
          - "threat_actor"
        to:
          - "ot_product"
        message: "Command"
        condition: "A threat actor is on the network."
        action: "Recreate failure conditions or send a command that weaponizes safety features."
        kind: "stated"
        basis: "presupposed"
        quotes:
          - source_lines: "615-616"
            quote: |-
              A threat actor can recreate those conditions or send a command to weaponize safety features against the system.
        related:
          - "cisa-secure-by-demand-ot-2025#R-0059"
        order: "inferred"
        on_error: "see F06-E1"
        on_error_basis: "stated"
      - n: "3"
        from:
          - "ot_product"
        to:
          - "ot_product"
        message: "CommandTrustCheck"
        action: "Establish trust for the command to or from a critical component."
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "600-601"
            quote: |-
              Does the product have a method to establish trust for commands to/from critical components?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0251"
        related:
          - "cisa-secure-by-demand-ot-2025#R-0254"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "ot_product"
        to:
          - "ot_product"
        message: "UnsafeCommandRejection"
        condition: "The command creates a known safety concern."
        action: "Prevent or ignore the command."
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "601"
            quote: |-
              Does the product prevent or ignore commands if they create known safety concerns?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0252"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "ot_product"
        to:
          - "ot_product"
        message: "ModeAwareHandling"
        condition: "A command meant for maintenance periods arrives during active operations."
        action: "Behave differently from the same command in a maintenance period."
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "602-603"
            quote: |-
              the product behave differently if commands meant for maintenance periods are sent during active operations?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0253"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "ot_product"
        to:
          - "operator"
        message: "DeviationAlert"
        condition: "The traffic breaks a standard or specification."
        action: "Alert."
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "603"
            quote: |-
              Can the product alert on breaks from a standard or specification?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0056"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "7"
        from:
          - "ot_product"
        to:
          - "ot_product"
        message: "AnomalyResponse"
        condition: >-
          The intended architecture or specification is broken, or does not follow the operational
          context.
        action: "Ignore or respond to the anomalous behaviour, not merely log it."
        kind: "stated"
        basis: "permission"
        quotes:
          - source_lines: "629-632"
            quote: |-
              Components do not need to merely log anomalous behavior. If the intended system architecture or specification is broken or does not follow the operational context, then a component may be able to ignore or respond to the anomalous behavior.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0062"
          - "cisa-secure-by-demand-ot-2025#R-0257"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "SecurityScan"
        action: >-
          Scan the network (vulnerability assessment, asset inventory); the product operates
          through the scan.
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "603-604"
            quote: |-
              Can the product remain stable during security scans, such as vulnerability assessments or asset inventory tools?
          - source_lines: "645"
            quote: |-
              Buyers should look for products that are designed to operate through security scans.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0057"
          - "cisa-secure-by-demand-ot-2025#R-0063"
        order: "inferred"
        on_error: "see F06-E2"
        on_error_basis: "stated"
    error_paths:
      - id: "F06-E1"
        at: "2"
        condition: >-
          A threat actor impersonates a singular Modbus client or bus controller, abuses network
          arbitration, or sends maintenance commands and updates mid-process.
        outcome: "The component may ignore or respond to the anomalous behaviour (step 7)."
        kind: "stated"
        quotes:
          - source_lines: "632-635"
            quote: |-
              Examples of system specifications being broken include: a singular Modbus client or bus controller being impersonated, network arbitration designed to disable an existing system such as a new engine appearing while a vehicle is in operation, or maintenance commands and updates mid process.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0062"
      - id: "F06-E2"
        at: "8"
        condition: "The product crashes during a noisy scan."
        outcome: >-
          A security weakness: operators lose an accurate view of the network, and Zero Trust in
          OT is limited.
        kind: "stated"
        quotes:
          - source_lines: "645-647"
            quote: |-
              Legacy OT products are prone to crashing during noisy scans. This fragility is a security weakness that makes it difficult for operators to maintain an accurate view of a network and limits the implementation of Zero Trust in OT.
  - id: "F07"
    name: "authenticated-change"
    title: "Authenticating changes to safety-critical equipment"
    locator: "Strong Authentication; Summary element 9"
    participants:
      - "operator"
      - "supervisory_control"
      - "ot_product"
      - "jump_host"
    trigger: "An individual changes logic or configuration of safety-critical equipment."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "654-655"
        quote: |-
          The baseline version of the product supports role-based access control (RBAC) and multifactor authentication (MFA), particularly for changes to safety-critical equipment.
    summary: >-
      Changes are made under individual roles (RBAC or ABAC, no common accounts) with
      phishing-resistant MFA from supervisory control, and controllers recognise whether
      supervisory control is authenticated. Freight rail adds a physical button press; jump hosts
      add MFA where components cannot.
    order_note: "Stated: step 2 after step 1. Steps 3 and 4 are examples, not placed."
    steps:
      - n: "1"
        from:
          - "operator"
        to:
          - "supervisory_control"
        message: "MfaAuthentication"
        action: >-
          Authenticate under an individual role (RBAC or ABAC, not a common account) with
          phishing-resistant MFA.
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "671"
            quote: |-
              Buyers should look for products with phishing-resistant MFA included in the baseline version.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0068"
          - "cisa-secure-by-demand-ot-2025#R-0139"
        order: "first"
        on_error: "see F07-E1"
        on_error_basis: "inferred"
      - n: "2"
        from:
          - "supervisory_control"
        to:
          - "ot_product"
        message: "AuthenticatedChange"
        action: >-
          Send the change; the controller recognises whether supervisory control is authenticated,
          and only authorized individuals can make changes.
        kind: "stated"
        basis: "example"
        quotes:
          - source_lines: "672-673"
            quote: |-
              MFA for engineering workstation or SCADA software with controllers designed to recognize if supervisory control is authenticated.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0067"
        related_candidates:
          - "C-0067"
        order: "stated"
        order_reason: "Supervisory control acts after the user authenticates (step 1)."
        on_error: "see F07-E1"
        on_error_basis: "inferred"
      - n: "3"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "PhysicalPresenceFactor"
        condition: "Vital (safety-critical) signaling logic in freight rail."
        action: "Press a local button on the controller and give a dynamic code with a password."
        kind: "stated"
        basis: "example"
        quotes:
          - source_lines: "675-677"
            quote: |-
              it is commonplace for wayside interface units to require a local button press on the controller and a dynamic code along with a password to change vital (safety-critical) signaling logic.
        related_candidates:
          - "C-0069"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "operator"
        to:
          - "jump_host"
        message: "JumpHostAccess"
        condition: "The components cannot carry MFA themselves."
        action: "Reach the OT components through a jump host that adds MFA."
        kind: "stated"
        basis: "example"
        quotes:
          - source_lines: "682"
            quote: |-
              Jump hosts are a way to add MFA restrictions to OT networks.
        related_candidates:
          - "C-0073"
        order: "inferred"
        on_error: "see F07-E2"
        on_error_basis: "stated"
    error_paths:
      - id: "F07-E1"
        at: "2"
        condition: "The change is unauthenticated, or the user's role does not allow it."
        outcome: >-
          Not accepted. The guide states the purpose (limit changes to authorized individuals) and
          not the rejection; the rejection is this model's reading.
        kind: "inferred"
      - id: "F07-E2"
        at: "4"
        condition: "Segmentation, which the jump host relies on, breaks."
        outcome: >-
          Critical components warrant their own layer: a backup control to prevent safety impacts.
        kind: "stated"
        quotes:
          - source_lines: "683-692"
            quote: |-
              However, segmentation is difficult to maintain, and critical components warrant that additional layer of protection.
          - source_lines: "693-694"
            quote: |-
              An organization of any size may want assurance that even if a single control (segmentation) fails, that there is a backup security control to prevent safety impacts.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0070"
          - "cisa-secure-by-demand-ot-2025#R-0264"
  - id: "F08"
    name: "vulnerability-handling"
    title: "Vulnerability reporting, handling and disclosure"
    locator: "Vulnerability Management; Summary element 11"
    participants:
      - "reporter"
      - "manufacturer"
      - "cve_program"
      - "users_public"
      - "operator"
    trigger: "A vulnerability is discovered in the product or in a third-party component it contains."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "802-804"
        quote: |-
          Measures to facilitate the sharing of information about potential vulnerabilities in operational technology as well as in third party components contained in such products, including by providing a contact address for the reporting of discovered vulnerabilities.
    summary: >-
      A mature process, based on the CVE Program and ISO/IEC 29147 and 30111: a published CVD
      policy and contact address (security.txt), complete documentation with an SBOM, CVE
      assignment and publication, risk-based remediation without delay, public advisories in a
      machine-processable format (CSAF) that operators match against their assets, VEX statements
      for celebrity vulnerabilities, and secure, prompt distribution of updates.
    order_note: >-
      The source lists elements a process should contain, not a sequence. Stated: step 6 concerns
      available updates, so it follows step 5; step 7 uses the advisories of step 6. Every other
      position is this model's.
    steps:
      - n: "1"
        from:
          - "manufacturer"
        to:
          - "users_public"
        message: "CvdPolicy"
        action: >-
          Publish a coordinated vulnerability disclosure policy: how discovered vulnerabilities
          are shared with affected parties and the public.
        kind: "stated"
        basis: "element"
        quotes:
          - source_lines: "797-799"
            quote: |-
              A policy on coordinated vulnerability disclosure setting out how the manufacturer intends to responsibly share information about discovered security vulnerabilities with affected parties and the public.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0152"
          - "cisa-secure-by-demand-ot-2025#R-0085"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "reporter"
        to:
          - "manufacturer"
        message: "VulnerabilityReport"
        action: >-
          Report the discovered vulnerability to the manufacturer's published contact address,
          supplied as a security.txt per RFC 9116.
        kind: "stated"
        basis: "element"
        quotes:
          - source_lines: "802-805"
            quote: |-
              Measures to facilitate the sharing of information about potential vulnerabilities in operational technology as well as in third party components contained in such products, including by providing a contact address for the reporting of discovered vulnerabilities. This should also be supplied according to RFC 9116 as a security.txt on the manufacturer’s website.
          - source_lines: "756-757"
            quote: |-
              make it easy to report security vulnerabilities by providing an RFC 9116 compliant security.txt?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0153"
          - "cisa-secure-by-demand-ot-2025#R-0284"
          - "cisa-secure-by-demand-ot-2025#R-0280"
        order: "inferred"
        on_error: "see F08-E2"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "manufacturer"
        to:
          - "manufacturer"
        message: "VulnerabilityRecord"
        action: >-
          Identify and document the vulnerability and the affected components completely,
          accurately and on time, with an SBOM in a common machine-readable format.
        kind: "stated"
        basis: "element"
        quotes:
          - source_lines: "769-771"
            quote: |-
              Complete, accurate, and timely identification and documentation of vulnerabilities and components contained in operational technology, including a software bill of materials in a commonly used and machine-readable format.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0147"
        order: "inferred"
        on_error: "see F08-E1"
        on_error_basis: "stated"
      - n: "4"
        from:
          - "manufacturer"
        to:
          - "cve_program"
        message: "CveRecord"
        action: "Assign a CVE identifier and publish the vulnerability to the CVE Program."
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "772"
            quote: |-
              Vulnerabilities should be assigned an identifier (CVE number) and published to CVE Program.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0148"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "manufacturer"
        to:
          - "manufacturer"
        message: "Remediation"
        action: "Remediate on a risk basis, without delay, including a security update."
        kind: "stated"
        basis: "element"
        quotes:
          - source_lines: "773"
            quote: |-
              Risk-based remediation of vulnerabilities without delay, including security updates.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0149"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "manufacturer"
        to:
          - "users_public"
        message: "SecurityAdvisory"
        action: >-
          Publish an advisory on the available security update (description, root cause, CWE,
          affected products, impacts, severity, remediation help), automatically retrievable and
          machine-processable (CSAF).
        kind: "stated"
        basis: "element"
        quotes:
          - source_lines: "774-778"
            quote: |-
              Public disclosure of information about available security updates, including an accurate description of the vulnerabilities, the root cause, the common weakness enumeration (CWE), information allowing users to identify the products affected, the impacts of the vulnerabilities, the severity, and clear and accessible information to help users to remediate the vulnerabilities as security advisories.
          - source_lines: "788"
            quote: |-
              Security advisories provided in an automatically retrievable, machine-processable format.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0150"
          - "cisa-secure-by-demand-ot-2025#R-0082"
          - "cisa-secure-by-demand-ot-2025#R-0282"
        order: "stated"
        order_reason: "It discloses available security updates, so it follows step 5."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "7"
        from:
          - "operator"
        to:
          - "operator"
        message: "AdvisoryMatching"
        action: "Match the advisories against own assets, with less human effort."
        kind: "stated"
        basis: "purpose"
        quotes:
          - source_lines: "788-790"
            quote: |-
              This enables the operator to match security advisories against its own assets and reduce the human resources needed to find and evaluate the information.
        order: "stated"
        order_reason: "Uses the advisories of step 6."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from:
          - "manufacturer"
        to:
          - "users_public"
        message: "VexStatement"
        condition: "A celebrity (Log4Shell-type) vulnerability."
        action: "State 'not affected' or 'under investigation' in a VEX statement following CSAF."
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "794-796"
            quote: |-
              Vulnerability Exploitability eXchange (VEX) statements indicating the “not affected” or “under investigation” status for “celebrity vulnerabilities” (i.e., Log4Shell-type vulnerabilities) should follow the CSAF standard.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0151"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "9"
        from:
          - "manufacturer"
        to:
          - "users_public"
        message: "SecurityUpdate"
        action: >-
          Distribute the update through a secure mechanism and without delay, with an advisory
          message telling users what action to take.
        kind: "stated"
        basis: "element"
        quotes:
          - source_lines: "806-808"
            quote: |-
              Mechanisms to securely distribute updates for products to fix or promptly mitigate vulnerabilities.  Dissemination of security updates without delay. Updates are accompanied by advisory messages providing users with relevant information, including on potential action to be taken.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0154"
          - "cisa-secure-by-demand-ot-2025#R-0155"
          - "cisa-secure-by-demand-ot-2025#R-0285"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "10"
        from:
          - "manufacturer"
        to:
          - "cve_program"
        message: "CnaParticipation"
        condition: "The vulnerability handling process is mature."
        action: "Consider becoming a CVE Numbering Authority."
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "809-810"
            quote: |-
              Entities that have mature vulnerability handling processes should consider becoming a CVE numbering authority (CNA) within the CVE Program.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0087"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F08-E1"
        at: "3"
        condition: >-
          The product is not affected by a celebrity vulnerability, or that is not yet known.
        outcome: "A VEX statement with status 'not affected' or 'under investigation', following CSAF."
        kind: "stated"
        quotes:
          - source_lines: "794-796"
            quote: |-
              Vulnerability Exploitability eXchange (VEX) statements indicating the “not affected” or “under investigation” status for “celebrity vulnerabilities” (i.e., Log4Shell-type vulnerabilities) should follow the CSAF standard.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0151"
      - id: "F08-E2"
        at: "2"
        condition: "The manufacturer publishes no contact address."
        outcome: >-
          Unspecified by source; the guide asks buyers whether reporting is made easy
          (security.txt).
        kind: "unspecified"
  - id: "F09"
    name: "patch-delivery"
    title: "Testing, delivering and applying a patch"
    locator: "Upgrade and Patch Tooling; Threat Modeling"
    participants:
      - "manufacturer"
      - "operator"
      - "ot_product"
    trigger: "A patch or upgrade is produced for the product."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "827-828"
        quote: |-
          The product has a well-documented and easy to follow process for patches and upgrades, and the manufacturer provides security patches at no extra cost.
    summary: >-
      The manufacturer tests patches in representative configurations and reports the results,
      delivers them over a secure channel and free of charge; the operator prioritizes them with
      the manufacturer's threat modelling, verifies authenticity and applies them under its own
      control, with golden images or safe modes to recover from a faulty patch.
    order_note: >-
      Stated: step 2 after step 1; step 7 on a faulty application. The rest is this model's order:
      verify (5) before apply (6).
    steps:
      - n: "1"
        from:
          - "manufacturer"
        to:
          - "manufacturer"
        message: "PatchTesting"
        action: >-
          Develop and test the patch in representative configurations: a developer preview
          program, or a test environment replicating client environments.
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "844-845"
            quote: |-
              For resilience, find manufacturers that develop and test patches in representative configurations to help address the risk of a faulty patch.
          - source_lines: "847-848"
            quote: |-
              Manufacturers can avoid incompatibility by using a developer preview program for the software used by the operator or their own testing environment that replicates client environments.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0088"
          - "cisa-secure-by-demand-ot-2025#R-0090"
          - "cisa-secure-by-demand-ot-2025#R-0297"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "manufacturer"
        to:
          - "operator"
        message: "PatchTestResults"
        action: >-
          Report the test results: compatibility with software, firmware and binaries, and no
          overwrite of existing configurations.
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "831-833"
            quote: |-
              Does the manufacturer test patches and report the results to check for compatibility issues with software/firmware/binaries and help ensure the patches do not overwrite existing configurations?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0291"
        order: "stated"
        order_reason: "Results follow the testing of step 1."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "operator"
        to:
          - "manufacturer"
        message: "PatchPrioritization"
        action: >-
          Prioritize the upgrades and patches that affect the OT system, with the manufacturer's
          threat modelling capability.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "724-725"
            quote: |-
              Asset owners and operators should partner with a manufacturer’s threat modelling capability to prioritize upgrades and patches that impact their OT system.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0076"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "manufacturer"
        to:
          - "operator"
        message: "PatchDelivery"
        action: >-
          Deliver the update over a secure channel, free of charge, with the relevant information.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "852-853"
            quote: |-
              The delivery mechanism for that update needs to be over a secure channel to help guarantee integrity.
          - source_lines: "835-836"
            quote: |-
              Are patches made available free of charge and disseminated via secure channels?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0094"
          - "cisa-secure-by-demand-ot-2025#R-0299"
          - "cisa-secure-by-demand-ot-2025#R-0295"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "operator"
        to:
          - "operator"
        message: "UpdateAuthenticity"
        action: "Determine that the update is authentic."
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "852"
            quote: |-
              For verification, buyers should be able to reliably determine the authenticity of an update.
          - source_lines: "835"
            quote: |-
              allow the buyer to verify an update is authentic?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0092"
          - "cisa-secure-by-demand-ot-2025#R-0294"
        related:
          - "cisa-secure-by-demand-ot-2025#R-0093"
        order: "inferred"
        on_error: "see F09-E2"
        on_error_basis: "inferred"
      - n: "6"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "PatchApplication"
        action: "Apply the patch under owner-controlled patch management."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "143-144"
            quote: |-
              Seek out products that can be verified and that support owner-controlled patch management.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0005"
        order: "inferred"
        on_error: "see F09-E1"
        on_error_basis: "stated"
      - n: "7"
        from:
          - "ot_product"
        to:
          - "ot_product"
        message: "PatchRecovery"
        condition: "The patch is faulty."
        action: "Recover automatically, from a golden image or into a safe mode."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "850-851"
            quote: |-
              Buyers should also ask about automatic recovery features to protect them from any patching issues, such as golden images or safe modes.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0091"
        order: "stated"
        order_reason: "On a faulty patch applied in step 6."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F09-E1"
        at: "6"
        condition: >-
          The patch is incompatible with other software, or overwrites the asset owner's
          configurations or engineering logic.
        outcome: "Automatic recovery protects the operator (step 7)."
        kind: "stated"
        quotes:
          - source_lines: "845-847"
            quote: |-
              For example, a patch may be incompatible with another piece of software, or a patch may overwrite the asset owner’s configurations or engineering logic.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0156"
          - "cisa-secure-by-demand-ot-2025#R-0157"
      - id: "F09-E2"
        at: "5"
        condition: "The update cannot be verified as authentic."
        outcome: >-
          Not applied. The guide requires that authenticity can be determined, not what follows a
          failure; this is this model's reading.
        kind: "inferred"
  - id: "F10"
    name: "support-and-end-of-life"
    title: "Support period, operating system end of life and retirement"
    locator: "Upgrade and Patch Tooling; Summary elements 11 and 12"
    participants:
      - "manufacturer"
      - "operator"
    trigger: "A product is bought and enters its support period."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "137-138"
        quote: |-
          Each product has a clearly defined support period during which vulnerabilities are managed and patches are supplied free of charge.
    summary: >-
      The manufacturer states the support period, handles vulnerabilities and supplies updates
      free of charge during it, publishes end-of-life dates and ports software to a supported
      operating system at no extra cost. The operator checks that a modern operating system does
      not void support, and plans replacement or mitigating controls from the retirement
      information.
    order_note: >-
      Stated: step 2 during the support period; step 4 when the operating system's support ends;
      step 6 on retirement.
    steps:
      - n: "1"
        from:
          - "manufacturer"
        to:
          - "operator"
        message: "SupportPeriodStatement"
        action: "State the length of the support period, matched to the product's intended lifecycle."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "858"
            quote: |-
              transparent about the length of the support period for a product.
          - source_lines: "858-860"
            quote: |-
              This support period should reflect the intended lifecycle of the product (i.e., a pump intended for remote areas may expect a greater period of support than a centralized manufacturing use-case).
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0094"
          - "cisa-secure-by-demand-ot-2025#R-0158"
        related:
          - "cisa-secure-by-demand-ot-2025#R-0159"
        order: "first"
        on_error: "see F10-E2"
        on_error_basis: "stated"
      - n: "2"
        from:
          - "manufacturer"
        to:
          - "operator"
        message: "SupportServices"
        condition: "During the support period."
        action: "Handle vulnerabilities and make security updates available, free of charge."
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "860-861"
            quote: |-
              During the support period, a buyer can expect that security vulnerabilities in their products will be handled and security updates will be made available.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0096"
          - "cisa-secure-by-demand-ot-2025#R-0198"
        order: "stated"
        order_reason: "During the support period stated in step 1."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "manufacturer"
        to:
          - "operator"
        message: "EndOfLifeNotice"
        action: "Publish end-of-life dates for the products."
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "834"
            quote: |-
              Does the manufacturer publish end-of-life dates for their products?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0293"
        order: "inferred"
        on_error: "see F10-E2"
        on_error_basis: "stated"
      - n: "4"
        from:
          - "manufacturer"
        to:
          - "operator"
        message: "OsPort"
        condition: "The original operating system is (soon) no longer supported."
        action: "Port the supported software to a supported operating system, free of charge."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "828-829"
            quote: |-
              This includes porting supported software to new operating systems free of charge if the original operating system is no longer supported.
          - source_lines: "142-143"
            quote: |-
              supports moving to a supported operating system version at no extra cost if the original operation system is soon to be no longer supported.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0204"
          - "cisa-secure-by-demand-ot-2025#R-0289"
        order: "stated"
        order_reason: "When the original operating system's support ends."
        on_error: "see F10-E1"
        on_error_basis: "stated"
      - n: "5"
        from:
          - "operator"
        to:
          - "operator"
        message: "SupportAgreementCheck"
        action: >-
          Check that running the software on a modern operating system does not needlessly
          invalidate the support agreement.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "874-875"
            quote: |-
              Operators should verify that running software on modern operating systems does not needlessly invalidate the support agreement.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0098"
        order: "inferred"
        on_error: "see F10-E1"
        on_error_basis: "stated"
      - n: "6"
        from:
          - "operator"
        to:
          - "operator"
        message: "RetirementPlan"
        action: >-
          Plan replacement hardware, or put mitigating controls in place (e.g. run the old system
          virtualized).
        kind: "stated"
        basis: "purpose"
        quotes:
          - source_lines: "862-864"
            quote: |-
              Transparency around retirements helps buyers schedule their replacement hardware or invest in mitigating controls such as virtualizing the out-of-date system within a modern operating system.
        related:
          - "cisa-secure-by-demand-ot-2025#R-0097"
        order: "stated"
        order_reason: "Follows the retirement information of steps 1 and 3."
        on_error: "see F10-E2"
        on_error_basis: "stated"
    error_paths:
      - id: "F10-E1"
        at: "4"
        condition: "Warranty or support is tied to an end-of-life operating system."
        outcome: >-
          The operator is forced to run the older operating system even where the software runs on
          newer ones.
        kind: "stated"
        quotes:
          - source_lines: "864-874"
            quote: |-
              it is very common for warranty or support packages to be tied to an underlying end-of-life operating system, so that an operator is forced to run an older version of an operating system even if the software is functional on newer operating systems.
      - id: "F10-E2"
        at: "1"
        condition: "No support period or end-of-life date is made known."
        outcome: "With nothing to plan by, the operator may run a high-risk product for years."
        kind: "stated"
        quotes:
          - source_lines: "875-876"
            quote: |-
              Without the planning that transparency allows, an operator may have to maintain a high-risk product for years.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0099"
  - id: "F11"
    name: "incident-reporting"
    title: "Reporting incidents to authorities"
    locator: "Contact Information"
    participants:
      - "organization"
      - "reporting_authority"
    trigger: >-
      An organization sees suspicious or criminal activity related to the guide's subject, or a
      cybersecurity incident.
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "887-888"
        quote: |-
          U.S. organizations are encouraged to report suspicious or criminal activity related to information in this guide to:
    summary: >-
      U.S. organizations report to CISA's 24/7 Operations Center or the local FBI field office,
      with date, time, location, activity type, people affected, equipment, submitter and point of
      contact when available; state, local, tribal and territorial governments report to the
      MS-ISAC; guidance inquiries go to NSA; six other countries' organizations report to their
      national centres.
    order_note: "Each step is an alternative channel; none is ordered."
    steps:
      - n: "1"
        from:
          - "organization"
        to:
          - "reporting_authority"
        message: "IncidentReport"
        condition: "A U.S. organization."
        action: >-
          Report suspicious or criminal activity to CISA's 24/7 Operations Center
          (report@cisa.gov, 888-282-0870) or to the local FBI field office.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "887-890"
            quote: |-
              U.S. organizations are encouraged to report suspicious or criminal activity related to information in this guide to:  CISA via CISA’s 24/7 Operations Center (report@cisa.gov or 888-282-0870) or your local FBI field office.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0300"
          - "cisa-secure-by-demand-ot-2025#R-0301"
        order: "first"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from:
          - "organization"
        to:
          - "reporting_authority"
        message: "IncidentReport"
        action: >-
          Include, when available, the incident details the guide lists: when and where, what kind
          of activity, how many people, which equipment, who submits, and a contact person.
        kind: "stated"
        basis: "direct"
        quotes:
