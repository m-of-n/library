  version: "Secure by Demand: Priority Considerations for OT Owners and Operators when Selecting Digital Products, 2025-01-13"
applicability: >-
  The guide defines no wire protocol: no transport, encoding, message syntax, timer or retry. It
  is procurement guidance addressed to buyers (OT owners and operators purchasing products):
  twelve security elements, each with selection criteria and questions to ask manufacturers. What
  passes between the parties is questions, answers, documents, reports, advisories, updates and
  decisions, modelled here as work products. Flow F01 is the procurement exchange itself; F02 to
  F13 are the operational exchanges the elements ask buyers to look for in a product or a
  manufacturer (configuration control, logging, remote connections, certificates, commands,
  authentication, vulnerability handling, patching, support period, incident reporting, guidance,
  legacy compatibility). Steps, orderings and error outcomes the source does not state are marked
  inferred or unspecified.
conventions:
  quoting: >-
    Every quotation is a quotes item of source_lines and quote, cut by script from
    .cache/cisa-secure-by-demand-ot-2025.txt as bin/_source_text reads a PDF rendering (running
    headers and footers removed, whitespace collapsed, line-end hyphens joined) between two
    anchors, never typed; the range is the tightest that holds the words. bin/check-quotes
    verifies every one. The bullet glyph U+F0A7 of the rendering is kept where a quotation spans a
    bulleted list. Text in action, condition, note, summary, outcome and meaning is this file's
    wording.
  step_kind: >-
    kind stated: the source names the act. kind inferred: this model's step, with inferred_reason.
    basis says how the source names a stated act: direct (a sentence addressed to the actor,
    should, must, are encouraged), sought (buyers are told to seek, look for or ask for a product
    or manufacturer that does it; nearly every manufacturer and product act in this guide has this
    basis), question (it is one of the questions to ask), element (it is listed as an element a
    mature process contains), permission (a can or may statement), example (For example, this
    might be), purpose (the source names it as what a provision enables), presupposed (the source
    assumes it), outcome (the source names it as the effect of another step).
  order: >-
    order first, stated or inferred. stated: the source fixes the step's position (then, during,
    as buyers are checking, after, a condition that names a prior event); order_reason says which.
    inferred: the source does not place it.
  on_error_basis: >-
    stated: the source says what follows a failure. unspecified: the source names the act and says
    nothing about its failure. inferred: this file's reading.
  constrained_by: >-
    Ids of requirements.yaml whose text binds the step: it performs them, or what it produces must
    satisfy them. candidates would list inferred-candidates.yaml ids (C-NNNN) that do the same and
    have no requirement yet; since pass 2 none does, every candidate pass 1 cited having been
    promoted to an entry or rejected. related and related_candidates name entries that state the
    step's purpose, condition or context without binding it; a rejected candidate is only ever
    related. An inferred step never carries constrained_by. A stated step with no constrained_by
    quotes no binding entry: a presupposed act, a purpose, an example or a pointer. An element of
    F01 lists its criterion, questions-to-ask, Summary element and seek-out entries.
  id_emission: >-
    Every id was emitted by script from a selector (line range plus a phrase of the entry's text)
    over the skeleton entries R-0001 to R-0101 and candidates C-0001 to C-0093; the selector
    refuses zero or several matches, split children and inferred entries are not considered, and
    every resolved pair was printed and read. Pass 2 (verify) re-wired every site against the
    finished requirements.yaml by script, the lanes having run concurrently: a split parent
    replaced by the child the site's quotations hold, a promoted candidate by its entry, a
    rejected candidate moved from candidates to related_candidates, each entry a stated site
    quotes added, and the elements selected by role and consideration; a few sites were decided
    by hand through a selector, and every resolved pair was printed and read.
  messages: >-
    message is the work product a step hands over or produces; it names an entry of work_products,
    this file's vocabulary, each with the steps that use it. Pass 3 joined the vocabulary to
    messages.yaml: structure names the structure that carries the work product (with
    structure_field where one field does), or is none with structure_reason. Six of the 75
    join (ElementQuestions, ElementAnswers, ElementEvaluation, EventLog, SecurityAdvisory,
    VexStatement); the other 69 are acts, checks and capabilities the guide gives no content to.
  roles: >-
    from and to name roles of the roles list. A step whose from equals its to is a role acting
    alone. role_rules say which roles are one organization.
