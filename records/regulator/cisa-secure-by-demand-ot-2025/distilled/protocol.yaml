flows:
  - id: "F01"
    name: "product-selection"
    title: "Selecting an OT product"
    locator: "Summary; Considerations for OT Product Selection; the twelve elements"
    participants:
      - "buyer"
      - "manufacturer"
    trigger: "A buyer procures an industrial automation and control system or another OT product."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "39-41"
        quote: |-
          describes how OT owners and operators should integrate security into their procurement process when purchasing industrial automation and control systems as well as other OT products.
    summary: >-
      The buyer checks the twelve elements by asking the manufacturer each element's questions,
      makes sure the manufacturer knows the Secure by Design principles, weighs the answers
      against the selection criteria and selects products from manufacturers that prioritize the
      elements. The guide gives no scoring, threshold or minimum set; its one stated exclusion is
      a product that relies entirely on a threat actor never reaching the OT network.
    order_note: >-
      Stated: step 3 during step 2 (as buyers are checking for these elements); step 8 is the
      effect of step 7. Step 1 happens during acquisition and is not placed against the others;
      the order of 2, 4, 6 and 7 is this model's.
    elements:
      - n: "1"
        title: "Configuration Management"
        locator: "Configuration Management"
        selection_criteria:
          - source_lines: "300-301"
            quote: |-
              Selection criteria: Products support controlling and tracking modifications to configuration settings and engineering logic.
        questions:
          - source_lines: "302-305"
            quote: |-
              Questions to ask: Does the product enable authenticated backup recording and deployment for configuration settings and engineering logic? Does the product have tamper prevention or detection? Does the manufacturer provide custom processes and response plans for interruptions involving their products or services?
        summary_statement:
          - source_lines: "86-88"
            quote: |-
              1. Configuration Management: The product supports controlling and tracking modifications to configuration settings and engineering logic. Seek out manufacturers whose products backup and deploy system configurations in a secure and simple manner.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0214"
          - "cisa-secure-by-demand-ot-2025#R-0215"
          - "cisa-secure-by-demand-ot-2025#R-0216"
          - "cisa-secure-by-demand-ot-2025#R-0217"
          - "cisa-secure-by-demand-ot-2025#R-0168"
          - "cisa-secure-by-demand-ot-2025#R-0169"
      - n: "2"
        title: "Logging in the Baseline Product"
        locator: "Logging in the Baseline Product"
        selection_criteria:
          - source_lines: "338-339"
            quote: |-
              Selection criteria: The baseline product version supports security and safety logging of all actions using open standard logging formats.
        questions:
          - source_lines: "340-342"
            quote: |-
              Questions to ask: Does the product log, restarts, logins, or changes to the product? Does the product provide telemetry and logs that help predict and prevent process failure? Does the product log security events and safety events by default?
        summary_statement:
          - source_lines: "89-92"
            quote: |-
              2. Logging in the Baseline Product: The product supports logging of all actions—including changes to configuration, security events, and safety events—in the baseline versions using open standard logging formats. Seek out products that come with standardized access and change logs for building incident response capabilities.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0218"
          - "cisa-secure-by-demand-ot-2025#R-0219"
          - "cisa-secure-by-demand-ot-2025#R-0220"
          - "cisa-secure-by-demand-ot-2025#R-0221"
          - "cisa-secure-by-demand-ot-2025#R-0170"
          - "cisa-secure-by-demand-ot-2025#R-0171"
      - n: "3"
        title: "Open Standards"
        locator: "Open Standards"
        selection_criteria:
          - source_lines: "380-381"
            quote: |-
              Selection criteria: The product uses open standards to support secure functions, services, and migrating configurations and logic.
        questions:
          - source_lines: "382-384"
            quote: |-
              Questions to ask: Does the product support open, interoperable standards to simplify replacing or adding products? Is the manufacturer demonstrating their alignment to industry regulations or international standards (e.g., ISA/IEC 62443)?
        summary_statement:
          - source_lines: "93-95"
            quote: |-
              3. Open Standards: The product uses open standards to support secure functions and services and for migrating configuration settings and engineering logic. Seek out products that support open, interoperable standards to facilitate replacing or adding products.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0223"
          - "cisa-secure-by-demand-ot-2025#R-0224"
          - "cisa-secure-by-demand-ot-2025#R-0225"
          - "cisa-secure-by-demand-ot-2025#R-0172"
          - "cisa-secure-by-demand-ot-2025#R-0173"
      - n: "4"
        title: "Ownership"
        locator: "Ownership"
        selection_criteria:
          - source_lines: "420-421"
            quote: |-
              Selection criteria: The product gives owners and operators full autonomy over the product, including maintenance and changes.
        questions:
          - source_lines: "422-425"
            quote: |-
              Questions to ask: Does the product enable OT operators to do what is needed without an onward dependency on the vendor? Does the manufacturer allow for support contracts with local engineering firms? Does the warranty policy for the product allow for adding security software or products (e.g., firewalls, gateways, continuous monitoring, diodes) to the environment?
        summary_statement:
          - source_lines: "96-98"
            quote: |-
              4. Ownership: The product gives owners and operators full autonomy over said product, including maintenance and changes. Seek out products that enable operator autonomy while minimizing dependency on the vendor.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0226"
          - "cisa-secure-by-demand-ot-2025#R-0227"
          - "cisa-secure-by-demand-ot-2025#R-0228"
          - "cisa-secure-by-demand-ot-2025#R-0229"
          - "cisa-secure-by-demand-ot-2025#R-0174"
          - "cisa-secure-by-demand-ot-2025#R-0175"
      - n: "5"
        title: "Protection of Data"
        locator: "Protection of Data"
        selection_criteria:
          - source_lines: "461-462"
            quote: |-
              Selection criteria: The product protects the integrity and confidentiality of data, services, and functions, including configurations and logic.
        questions:
          - source_lines: "463-464"
            quote: |-
              Questions to ask: Does the product encrypt data at rest? Does the product have a way to verify the integrity of its data? Does the product share or sell its data to anyone?
        summary_statement:
          - source_lines: "99-102"
            quote: |-
              5. Protection of Data: The product protects the integrity and confidentiality of data, services, and functions, including a product’s configuration settings and engineering logic. Seek out products that treat operational data as valuable and protect it at rest and during transit to and from vendors and manufacturers.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0232"
          - "cisa-secure-by-demand-ot-2025#R-0233"
          - "cisa-secure-by-demand-ot-2025#R-0234"
          - "cisa-secure-by-demand-ot-2025#R-0235"
          - "cisa-secure-by-demand-ot-2025#R-0176"
          - "cisa-secure-by-demand-ot-2025#R-0177"
      - n: "6"
        title: "Secure by Default"
        locator: "Secure by Default"
        selection_criteria:
          - source_lines: "483-484"
            quote: |-
              Selection criteria: The product is delivered secure out of the box, resilient against the most prevalent threats and vulnerabilities, without requiring additional configuration from users or administrators.
        questions:
          - source_lines: "485-488"
            quote: |-
              Questions to ask: Has the manufacturer eliminated or is working to eliminate default passwords? Does the product enable by default and use the secure, up-to-date, versions of protocols (e.g., Secure Shell [SSH], SFTP [SSH File Transfer Protocol])? Are older insecure protocols disabled by default (i.e., SNMPv1/2, Telnet, Trivial File Transfer Protocol [TFTP])?
        summary_statement:
          - source_lines: "103-109"
            quote: |-
              6. Secure by Default: The product is delivered secure out of the box, reducing the attack surface and removing the burden on owners and operators. Seek out products that include all security features in all versions; eliminate default passwords; allow for appropriate length and complexity for passwords; use secure up-to-date versions of protocols with older insecure protocols (e.g., SNMPv1/2, Telnet, SSL, TLS 1.0/1.1) disabled by default; do not unnecessarily expose external interfaces; and provide authorized users the ability to reset product configuration to its original state.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0237"
          - "cisa-secure-by-demand-ot-2025#R-0238"
          - "cisa-secure-by-demand-ot-2025#R-0239"
          - "cisa-secure-by-demand-ot-2025#R-0240"
          - "cisa-secure-by-demand-ot-2025#R-0178"
          - "cisa-secure-by-demand-ot-2025#R-0179"
      - n: "7"
        title: "Secure Communications"
        locator: "Secure Communications"
        selection_criteria:
          - source_lines: "552-553"
            quote: |-
              Selection criteria: Products should support authenticated communication with device certificates deployed that fails loudly but that allows critical processes to continue.
        questions:
          - source_lines: "554-556"
            quote: |-
              Key considerations: Does the product simplify the deployment and renewal of certificates for devices? Does the manufacturer need asset owners and operators to be cyber experts to sustain secure communication?
        summary_statement:
          - source_lines: "110-113"
            quote: |-
              7. Secure Communications: The product supports secure authenticated communication with digital certificates deployed that fail loudly (e.g., when a certificate expires) but allows critical processes to continue. Seek out products that simplify digital certificate deployment and renewal such that operators do not need to be cyber experts to achieve secure authenticated communications.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0135"
          - "cisa-secure-by-demand-ot-2025#R-0247"
          - "cisa-secure-by-demand-ot-2025#R-0248"
          - "cisa-secure-by-demand-ot-2025#R-0186"
          - "cisa-secure-by-demand-ot-2025#R-0187"
      - n: "8"
        title: "Secure Controls"
        locator: "Secure Controls"
        selection_criteria:
          - source_lines: "598-599"
            quote: |-
              Selection criteria: The product assumes a threat actor is operating on the network and protects itself against malicious emergency, safety, or diagnostic commands.
        questions:
          - source_lines: "600-604"
            quote: |-
              Questions to ask: Does the product have a method to establish trust for commands to/from critical components? Does the product prevent or ignore commands if they create known safety concerns? Does the product behave differently if commands meant for maintenance periods are sent during active operations? Can the product alert on breaks from a standard or specification? Can the product remain stable during security scans, such as vulnerability assessments or asset inventory tools?
        summary_statement:
          - source_lines: "114-118"
            quote: |-
              8. Secure Controls: The product is resilient to threat actors sending malicious emergency, safety, or diagnostic commands; protects the availability of essential functions; withstands active security scanning; and minimizes the impact of an incident on the overall system. Seek out manufacturers who can demonstrate trusted safety-critical controls and explain how operators can continuously verify and regain that trust.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0250"
          - "cisa-secure-by-demand-ot-2025#R-0251"
          - "cisa-secure-by-demand-ot-2025#R-0252"
          - "cisa-secure-by-demand-ot-2025#R-0253"
          - "cisa-secure-by-demand-ot-2025#R-0056"
          - "cisa-secure-by-demand-ot-2025#R-0057"
          - "cisa-secure-by-demand-ot-2025#R-0188"
          - "cisa-secure-by-demand-ot-2025#R-0004"
      - n: "9"
        title: "Strong Authentication"
        locator: "Strong Authentication"
        selection_criteria:
          - source_lines: "654-655"
            quote: |-
              Selection criteria: The baseline version of the product supports role-based access control (RBAC) and multifactor authentication (MFA), particularly for changes to safety-critical equipment.
        questions:
          - source_lines: "656-657"
            quote: |-
              Questions to ask: Has the manufacturer eliminated or is working to eliminate the use of shared role-based passwords in their products? Is MFA included in the baseline version?
        summary_statement:
          - source_lines: "119-122"
            quote: |-
              9. Strong Authentication: The baseline version of the product, especially safety-critical equipment, protects against unauthorized access through appropriate control measures, including role-based access control and phishing-resistant multifactor authentication. Seek out manufacturers that have eliminated the use of shared role-based passwords in their products.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0258"
          - "cisa-secure-by-demand-ot-2025#R-0259"
          - "cisa-secure-by-demand-ot-2025#R-0260"
          - "cisa-secure-by-demand-ot-2025#R-0193"
          - "cisa-secure-by-demand-ot-2025#R-0194"
      - n: "10"
        title: "Threat Modeling"
        locator: "Threat Modeling"
        selection_criteria:
          - source_lines: "701"
            quote: |-
              Selection criteria: The product has a full and detailed threat model.
        questions:
          - source_lines: "702-704"
            quote: |-
              Questions to ask: Can the manufacturer articulate the attack vectors they have considered when designing their product? What security measures does the product implement to reduce these threat scenarios? Does the manufacturer have a roadmap to address gaps in their threat model?
        summary_statement:
          - source_lines: "132-134"
            quote: |-
              10. Threat Modeling: The product has a full and detailed threat model. Seek out products that have an up-to-date threat model that articulates the ways in which it might be compromised, along with security measures implemented to reduce these threat scenarios.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0265"
          - "cisa-secure-by-demand-ot-2025#R-0142"
          - "cisa-secure-by-demand-ot-2025#R-0266"
          - "cisa-secure-by-demand-ot-2025#R-0267"
          - "cisa-secure-by-demand-ot-2025#R-0195"
          - "cisa-secure-by-demand-ot-2025#R-0196"
      - n: "11"
        title: "Vulnerability Management"
        locator: "Vulnerability Management"
        selection_criteria:
          - source_lines: "745-750"
            quote: |-
              Selection criteria: Product manufacturers should have mature vulnerability management processes based on the CVE Program. The processes help ensure that vulnerabilities in their products are identified and remediated across the entire life cycle. In addition, manufacturers need effective communication channels with users and the wider public, enabling them not only to share and publicly disclose information about vulnerabilities and mitigations, but also to receive information about newly discovered security flaws in their products.
        questions:
          - source_lines: "751-757"
            quote: |-
              Questions to ask: Has the manufacturer drawn up a software bill of materials? Does the manufacturer have a track record of remediating vulnerabilities in a complete, accurate, and timely manner and is relevant information about vulnerabilities and remediation shared with users and the public? Will security advisories be automatically retrievable according to the Common Security Advisory Framework (CSAF) standard? Does the manufacturer have a coordinated vulnerability disclosure policy? Does the manufacturer make it easy to report security vulnerabilities by providing an RFC 9116 compliant security.txt?
        summary_statement:
          - source_lines: "135-140"
            quote: |-
              11. Vulnerability Management: The manufacturer has a comprehensive vulnerability management regime in which products are rigorously tested to help ensure they contain no known exploitable vulnerabilities. Each product has a clearly defined support period during which vulnerabilities are managed and patches are supplied free of charge. Seek out manufacturers who include hardware and software bill of materials with product delivery and who commit to timely remediation of vulnerabilities through a vulnerability disclosure program.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0145"
          - "cisa-secure-by-demand-ot-2025#R-0274"
          - "cisa-secure-by-demand-ot-2025#R-0275"
          - "cisa-secure-by-demand-ot-2025#R-0276"
          - "cisa-secure-by-demand-ot-2025#R-0277"
          - "cisa-secure-by-demand-ot-2025#R-0278"
          - "cisa-secure-by-demand-ot-2025#R-0279"
          - "cisa-secure-by-demand-ot-2025#R-0280"
          - "cisa-secure-by-demand-ot-2025#R-0197"
          - "cisa-secure-by-demand-ot-2025#R-0198"
          - "cisa-secure-by-demand-ot-2025#R-0199"
      - n: "12"
        title: "Upgrade and Patch Tooling"
        locator: "Upgrade and Patch Tooling"
        selection_criteria:
          - source_lines: "827-829"
            quote: |-
              Selection criteria: The product has a well-documented and easy to follow process for patches and upgrades, and the manufacturer provides security patches at no extra cost. This includes porting supported software to new operating systems free of charge if the original operating system is no longer supported.
        questions:
          - source_lines: "830-836"
            quote: |-
              Questions to ask: Does the product employ resilient patching features to reduce the risk of downtime from a bad patch (e.g., golden images)? Does the manufacturer test patches and report the results to check for compatibility issues with software/firmware/binaries and help ensure the patches do not overwrite existing configurations? Does the manufacturer update software to modern operating systems if the operating system is end-of-life? Does the manufacturer publish end-of-life dates for their products? Does the manufacturer allow the buyer to verify an update is authentic? Are patches made available free of charge and disseminated via secure channels?
        summary_statement:
          - source_lines: "141-144"
            quote: |-
              12. Upgrade and Patch Tooling: The product has a well-documented and easy to follow patch and upgrade process and supports moving to a supported operating system version at no extra cost if the original operation system is soon to be no longer supported. Seek out products that can be verified and that support owner-controlled patch management.
            locator: "Summary"
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0286"
          - "cisa-secure-by-demand-ot-2025#R-0289"
          - "cisa-secure-by-demand-ot-2025#R-0290"
          - "cisa-secure-by-demand-ot-2025#R-0291"
          - "cisa-secure-by-demand-ot-2025#R-0292"
          - "cisa-secure-by-demand-ot-2025#R-0293"
          - "cisa-secure-by-demand-ot-2025#R-0294"
          - "cisa-secure-by-demand-ot-2025#R-0295"
          - "cisa-secure-by-demand-ot-2025#R-0202"
          - "cisa-secure-by-demand-ot-2025#R-0005"
    steps:
      - n: "1"
        from:
          - "buyer"
        to:
          - "buyer"
        message: "RegulatoryCheck"
        action: >-
          Consider applicable regulatory requirements (e.g. the NIS2 Directive) during acquisition
          and make sure the products bought comply with applicable legal obligations and carry the
          required marks of regulatory compliance.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "151-154"
            quote: |-
              Additionally, owners and operators may need to consider regulatory requirements, such as the European Union’s (EU’s) NIS2 Directive, during digital systems acquisition. 5 Where applicable, owners and operators should ensure that the products they buy are compliant with applicable legal obligations and carry required marks of regulatory compliance.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0103"
          - "cisa-secure-by-demand-ot-2025#R-0104"
        order: "stated"
        order_reason: "During digital systems acquisition; not placed against the element checks."
        on_error: "see F01-E3"
        on_error_basis: "inferred"
      - n: "2"
        from:
          - "buyer"
        to:
          - "manufacturer"
        message: "ElementQuestions"
        action: >-
          For each of the twelve elements, ask the manufacturer the element's questions (the
          elements list carries each element's selection criteria and questions).
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "252"
            quote: |-
              Buyers should look for the following key security elements when selecting OT products:
          - source_lines: "269"
            quote: |-
              The following sections provide buyers with guidance on questions to ask manufacturers
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0009"
        related_candidates:
          - "C-0050"
        order: "inferred"
        on_error: "see F01-E2"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "buyer"
        to:
          - "manufacturer"
        message: "PrincipleFamiliarityCheck"
        action: >-
          While checking the elements, make sure the manufacturer is familiar with the three
          Secure by Design principles: owning customers' security outcomes, transparency and
          accountability, and leadership that integrates security from the start of design.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "260-264"
            quote: |-
              As buyers are checking for these elements, they should ensure their manufacturers are familiar with the Secure by Design principles of taking ownership of their customers’ security outcomes, embracing transparency and accountability with their own security progress, and business leadership for integrating cybersecurity from the start of design decisions.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0010"
        order: "stated"
        order_reason: "As buyers are checking for these elements: during step 2."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
          - "manufacturer"
        to:
          - "buyer"
        message: "ElementAnswers"
        action: >-
          Answer the questions: articulate, show or document what each element asks (e.g. the
          attack vectors considered, an SBOM, end-of-life dates, patch test results).
        kind: "stated"
        basis: "presupposed"
        note: >-
          The guide poses questions to ask manufacturers; that the manufacturer answers is
          presupposed, never described.
        quotes:
          - source_lines: "702-703"
            quote: |-
              Can the manufacturer articulate the attack vectors they have considered when designing their product?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0142"
        order: "inferred"
        on_error: "see F01-E2"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "manufacturer"
        to:
          - "buyer"
        message: "AdoptionRoadmap"
        action: >-
          Demonstrate adoption of Secure by Design by publishing a roadmap of how the practices
          are being adopted.
        kind: "stated"
        basis: "permission"
        quotes:
          - source_lines: "267-268"
            quote: |-
              Manufacturers can demonstrate their adoption of Secure by Design by publishing roadmaps that detail how they are adopting these practices.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0106"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "buyer"
        to:
          - "buyer"
        message: "ElementEvaluation"
        action: >-
          Weigh the answers against each element's selection criteria, the elements in no priority
          order, preferring manufacturers that demonstrate adoption of Secure by Design and of the
          ISA/IEC 62443 standards.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "260"
            quote: |-
              These elements are not in priority order.
          - source_lines: "265-267"
            quote: |-
              Buyers should look for manufacturers that demonstrate their adoption of Secure by Design and International Society of Automation (ISA) 62443 standards.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0105"
          - "cisa-secure-by-demand-ot-2025#R-0209"
        order: "inferred"
        on_error: "see F01-E2"
        on_error_basis: "unspecified"
      - n: "7"
        from:
          - "buyer"
        to:
          - "buyer"
        message: "SelectionDecision"
        action: >-
          Select products from manufacturers that prioritize the elements, and enforce purchasing
          decisions that require and prioritize them.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "84-85"
            quote: |-
              When procuring products, OT owners and operators should select products from manufacturers who prioritize the following security elements:
          - source_lines: "145-147"
            quote: |-
              By rigorously enforcing purchasing decisions that require and prioritize the purchase of products that enforce these elements, critical infrastructure organizations can help mitigate current and emerging cyber threats to critical infrastructure and create a path away from legacy environments.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0003"
          - "cisa-secure-by-demand-ot-2025#R-0006"
        order: "inferred"
        on_error: "see F01-E1"
        on_error_basis: "stated"
      - n: "8"
        from:
          - "buyer"
        to:
          - "manufacturer"
        message: "MarketSignal"
        action: >-
          The purchasing decisions themselves tell manufacturers that buyers demand Secure by
          Design products.
        kind: "stated"
        basis: "outcome"
        quotes:
          - source_lines: "147-148"
            quote: |-
              Additionally, OT owners and operators will send a message to manufacturers to stimulate the supply of Secure by Design products.
        related_candidates:
          - "C-0030"
        order: "stated"
        order_reason: "The message is the effect of the purchasing decisions of step 7."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F01-E1"
        at: "7"
        condition: "The product's security assumes that no threat actor ever reaches the OT network."
        outcome: "Avoid the product."
        kind: "stated"
        quotes:
          - source_lines: "717-718"
            quote: |-
              Buyers should avoid products that rely entirely on a threat actor never accessing the OT network.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0074"
      - id: "F01-E2"
        at: "6"
        condition: "The manufacturer cannot answer a question, or the product lacks an element."
        outcome: >-
          Unspecified by source: no scoring, threshold or minimum set is given, and the elements
          are not in priority order, so whether one missing element disqualifies a product is not
          said.
        kind: "unspecified"
      - id: "F01-E3"
        at: "1"
        condition: >-
          The product does not comply with applicable legal obligations or lacks a required mark.
        outcome: >-
          Not bought: the buyer is to make sure the products it buys comply. The guide states no
          procedure for the failure.
        kind: "inferred"
  - id: "F02"
    name: "configuration-control-and-recovery"
    title: "Controlling configuration changes and recovering"
    locator: "Configuration Management; Summary element 6"
    participants:
      - "operator"
      - "ot_product"
      - "manufacturer"
      - "threat_actor"
    trigger: >-
      An operator changes configuration settings or engineering logic, or an incident damages a
      component.
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "311-313"
        quote: |-
          The goal of this consideration is to help ensure OT owners and operators can swiftly identify unauthorized configuration changes and recover critical infrastructure after an incident occurs to minimize societal impact and downtime.
    summary: >-
      Changes go through the product's own change control, which can authorize or restrict them,
      alerts on insecure configurations and on attempts to make a configuration less secure, and
      detects tampering. Authenticated backups in an open format let the operator restore, in
      person or over the network, after an attacker gains a foothold on, or wipes, a component.
    order_note: >-
      Stated: step 2 on the attempt of step 1; step 6 after the incident of step 5. Steps 3, 4, 7,
      8 and 9 are not placed.
    steps:
      - n: "1"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "ConfigurationChange"
        action: >-
          Change configuration settings or engineering logic through the product's change control,
          which can authorize or restrict changes and tracks them.
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "318"
            quote: |-
              The ability to authorize or restrict configuration changes,
          - source_lines: "300-301"
            quote: |-
              Products support controlling and tracking modifications to configuration settings and engineering logic.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0109"
          - "cisa-secure-by-demand-ot-2025#R-0214"
        order: "first"
        on_error: "see F02-E1"
        on_error_basis: "stated"
      - n: "2"
        from:
          - "ot_product"
        to:
          - "operator"
        message: "InsecureConfigurationAlert"
        condition: >-
          The configuration is known to be insecure, or the change attempts a less secure one.
        action: "Alert the operator."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "317"
            quote: |-
              Alerts for known insecure configurations or attempts to change to less secure configurations,
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0108"
        order: "stated"
        order_reason: "Raised on the attempt to change, so with or before step 1 takes effect."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from:
          - "ot_product"
        to:
          - "ot_product"
        message: "TamperDetection"
        action: "Prevent or detect tampering."
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "303"
            quote: |-
              Does the product have tamper prevention or detection?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0216"
        related:
          - "cisa-secure-by-demand-ot-2025#R-0012"
        order: "inferred"
        on_error: "see F02-E1"
        on_error_basis: "stated"
      - n: "4"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "ConfigurationBackup"
        action: >-
          Record authenticated backups of configuration settings and engineering logic, in
          open-standard backup files, through documented backup interfaces.
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "302-303"
            quote: |-
              Does the product enable authenticated backup recording and deployment for configuration settings and engineering logic?
          - source_lines: "320"
            quote: |-
              Open standards for backup files,
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0111"
          - "cisa-secure-by-demand-ot-2025#R-0169"
          - "cisa-secure-by-demand-ot-2025#R-0215"
          - "cisa-secure-by-demand-ot-2025#R-0112"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from:
          - "threat_actor"
        to:
          - "ot_product"
        message: "ComponentCompromise"
        action: "Establish a foothold on, or wipe, a component on the OT network."
        kind: "stated"
        basis: "presupposed"
        quotes:
          - source_lines: "314-315"
            quote: |-
              in which a threat actor establishes a foothold or wipes a component on the OT network.
        related:
          - "cisa-secure-by-demand-ot-2025#R-0013"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "ConfigurationRestore"
        action: >-
          Restore from the backups, in person or over the network, recovering quickly and
          independently.
        kind: "stated"
        basis: "direct"
        quotes:
          - source_lines: "321-322"
            quote: |-
              Documented interfaces for creating backups and restoring from backups in person or over the network.
          - source_lines: "308-309"
            quote: |-
              Recording and protecting backups of OT products is necessary for an operator to recover quickly and independently after a product failure.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0013"
          - "cisa-secure-by-demand-ot-2025#R-0112"
        order: "stated"
        order_reason: "Recovery follows the incident of step 5."
        on_error: "see F02-E2"
        on_error_basis: "unspecified"
      - n: "7"
        from:
          - "ot_product"
        to:
          - "ot_product"
        message: "SelfRecovery"
        action: >-
          Where the product supports it, recover and update itself with very little downtime (e.g.
          hot-swapped immutable containers).
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "323-324"
            quote: |-
              buyers should seek out resilient products that can rapidly recover and update themselves with very little downtime.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0015"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from:
          - "manufacturer"
        to:
          - "operator"
        message: "InterruptionResponsePlan"
        action: >-
          Offer tailored processes and response plans for interruptions that involve its products
          or services.
        kind: "stated"
        basis: "question"
        quotes:
          - source_lines: "303-305"
            quote: |-
              Does the manufacturer provide custom processes and response plans for interruptions involving their products or services?
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0217"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "9"
        from:
          - "operator"
        to:
          - "ot_product"
        message: "ConfigurationReset"
        action: "An authorized user resets the product configuration to its original state."
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "108-109"
            quote: |-
              provide authorized users the ability to reset product configuration to its original state.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0185"
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F02-E1"
        at: "1"
        condition: "An unauthorized configuration change is made."
        outcome: >-
          It is to be identified swiftly, through the alerts and tamper detection of steps 2 and
          3; the guide states no response beyond recovery (step 6).
        kind: "stated"
        quotes:
          - source_lines: "311-313"
            quote: |-
              help ensure OT owners and operators can swiftly identify unauthorized configuration changes and recover critical infrastructure after an incident occurs to minimize societal impact and downtime.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0012"
      - id: "F02-E2"
        at: "6"
        condition: "No usable backup exists, or the restore fails."
        outcome: "Unspecified by source."
        kind: "unspecified"
  - id: "F03"
    name: "event-logging"
    title: "Logging and evidence of intrusion"
    locator: "Logging in the Baseline Product"
    participants:
      - "ot_product"
      - "security_tool"
      - "incident_responder"
      - "manufacturer"
      - "operator"
      - "threat_actor"
    trigger: "An action, security event or safety event occurs on the product."
    trigger_kind: "stated"
    trigger_quotes:
      - source_lines: "338-339"
        quote: |-
          The baseline product version supports security and safety logging of all actions using open standard logging formats.
    summary: >-
      The baseline product logs a standardized minimum set of events by default, in open formats,
      each record carrying a fixed set of fields; logs go to a security tool where that is safe
      and stay local otherwise; manufacturers add log types from their threat model.
    order_note: >-
      Stated: step 4 after step 1 (then); the loss of step 2 is answered by local logs (F03-E1).
    steps:
      - n: "1"
        from:
          - "ot_product"
        to:
          - "ot_product"
        message: "EventLog"
        action: >-
          Log, by default and in the baseline version, the minimum event types the element lists,
          in open standard formats, each record with the fields the guide names (time, source
          address and port, account, correlation id, description).
        kind: "stated"
        basis: "sought"
        quotes:
          - source_lines: "353-354"
            quote: |-
              Buyers should seek products with a minimum set of logs enabled by default (which should be standardized across products and manufacturers).
          - source_lines: "362-363"
            quote: |-
              All event records should include a timestamp, source address and port, affected account details, correlation identifier, and event description.
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0113"
          - "cisa-secure-by-demand-ot-2025#R-0114"
          - "cisa-secure-by-demand-ot-2025#R-0115"
          - "cisa-secure-by-demand-ot-2025#R-0116"
          - "cisa-secure-by-demand-ot-2025#R-0117"
          - "cisa-secure-by-demand-ot-2025#R-0118"
          - "cisa-secure-by-demand-ot-2025#R-0119"
          - "cisa-secure-by-demand-ot-2025#R-0120"
          - "cisa-secure-by-demand-ot-2025#R-0121"
          - "cisa-secure-by-demand-ot-2025#R-0021"
          - "cisa-secure-by-demand-ot-2025#R-0017"
        order: "first"
        on_error: "see F03-E2"
        on_error_basis: "stated"
      - n: "2"
        from:
          - "ot_product"
        to:
          - "security_tool"
        message: "LogAggregation"
        condition: "The logs can safely be aggregated over the network."
        action: "Ship the logs over the network into a security tool."
        kind: "stated"
        basis: "presupposed"
        note: "Named only by the exception that answers its absence (F03-E1)."
        quotes:
          - source_lines: "351"
            quote: |-
              the logs cannot safely be aggregated over the network into a security tool
        related:
          - "cisa-secure-by-demand-ot-2025#R-0018"
