        from:
          - "security_tool"
        to:
          - "incident_responder"
        message: "IntrusionEvidence"
        action: >-
          Give defenders and incident responders the evidence: detect incidents, provide
          indicators of compromise, track threat actor behaviour.
        kind: "stated"
        basis: "purpose"
        quotes:
          - source_lines: "343"
            quote: |-
              Logging will help OT network defenders gather evidence of intrusions into OT networks.
          - source_lines: "347-348"
            quote: |-
              Logging is necessary to detect incidents, provide indicators of compromise, and track threat actor behavior.
        order: "inferred"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from:
