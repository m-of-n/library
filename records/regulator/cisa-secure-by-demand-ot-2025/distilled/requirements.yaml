    locator: 'Considerations for OT Product Selection'
    text: 'Conformance is judged on the baseline version, the product as sold without paid options: logging, RBAC and MFA belong to it (R-0218, R-0258, R-0260, R-0068, R-0141); logging is no add-on or paid feature (R-0017); every version carries every security feature (R-0180); security functionality and default protection come at no additional cost (R-0132, R-0241); security patches and the move to a supported operating system are free (R-0288, R-0289, R-0204, R-0094); and device security sold as an additional service is a barrier (R-0129). A feature present only in a premium edition or as a paid service does not count.'
