note: 'Ids are stable and never reused; cite as cisa-secure-by-demand-ot-2025#R-NNNN. R-0001 to R-0101 are the bin/fx1-skeleton verbal-form sentences; text, locator and source_lines are script-owned. R-0102 onward were appended by pass 1 (requirements lane), every text cut from the source by script and never typed: first the split_of children of skeleton sentences, then in source order the keyword-less statements (candidates promoted with candidate: C-NNNN, and hunted text no candidate caught), each followed by its own split children; then the kind: inferred entries, in our words, each with derived_from (ids emitted by script from this file). Splitting: an entry is split where it welds two statements (two sentences, a list lead-in and its items, a run-in label, a footnote number or a list glyph) or where its forms sit in separate provisions; a second form inside a relative or complement clause of the first is no provision of its own, and such an entry carries a note instead (R-0004, R-0007, R-0015, R-0075, R-0107). A split parent keeps its strongest form (must, should, may, can); a child names its own form or none. A list item is quoted without its bullet glyph and without the list’s joining comma or conjunction; item_of names the entry of the lead-in it sits under (an o sub-item names its item). verb is the entry’s own directive form or none. normativity is the kind of provision the sentence makes, judged per sentence, because this is joint guidance and not a standard: requirement (must; expressions of necessity: need, needs to, it is essential), recommendation (should, should not; an imperative addressed to the reader; recommends, encouraged; a selection criterion, a question, a Summary element or seek-out, or a list item under a recommending lead-in; an emphasis ranking where a recommendation matters most), permission (may or can admitting an option; an explicit exemption), possibility (can, cannot or may stating a capability, likelihood, consequence or benefit), none (definition, scope, status, alignment, purpose, cross-reference, structure, or a legal obligation the guide cites). The guide binds no one (R-0311): requirement names its strongest wording, not a legal duty. actor is the party the text names: buyer (the guide’s word, defined at L229-230 as the owners and operators who purchase products, R-0208; also the addressee of an imperative after that definition), OT owner/operator (owners and operators in any wording, organizations, and the addressee of an imperative in the Summary, before the definition), operator, manufacturer, vendor, entity, product, component, threat actor, or the party an administrative line names; (implied) marks a passive or impersonal subject, and none (...) says why no party is named. object is what the provision acts on; field is the attribute, feature or value it constrains. testable: yes (a test, inspection or document check decides it), partial (only in part, through an undefined qualifier, or on evidence the buyer judges), no (purpose, rationale, threat, benefit, status, definition, structure, administrative); testable_reason explains every partial and no. consideration names one of the twelve titles of the table of contents, emitted by script. role marks the entry whose text is exactly one unit: criterion (a Selection criteria sentence), question (one question), goal (the goal sentence), element (a description sentence of the Summary list), seek-out (a Seek out sentence of the Summary list); a narrower child or a wider weld carries none. question_set: questions to ask (the run-in list after each criterion; Secure Communications prints it under another label, SD-1) or threat model questions (L726-742). favourable_answer is our reading of which answer meets the consideration: yes, no, open (the question is not yes or no), or none (a yes-or-no question whose answer informs without meeting or failing it); the guide states none (R-0322). footnote names the footnote an entry quotes. SD-n names a defect in normative.md’s Source defects section.'
