schema: "library-object-model/v1"
record: cisa-secure-by-demand-ot-2025
reviewed_by: ""
question: "What objects and edges does the OT Secure by Demand guide assume or define?"
objects:
  - {name: Buyer, definition: "OT owner and operator purchasing products ('buyers')", attributes: [sector], locator: "Introduction p.6", kind: stated, tmodel_mapping: "Party (consumer/operator role)", notes: ""}
  - {name: Manufacturer, definition: "OT product manufacturer", attributes: [cna_status, isa_62443_adoption, sbd_roadmap], locator: "pp.3, 7", kind: stated, tmodel_mapping: "Party (supplier)", notes: ""}
  - {name: OTProduct, definition: "industrial automation and control system product or other OT product; has a baseline version and a defined support period", attributes: [baseline_version, support_period, safety_critical], locator: "pp.3-4, 18", kind: stated, tmodel_mapping: "Product / Component (OT)", notes: ""}
  - {name: SecurityElement, definition: "one of 12 key security elements (not in priority order): configuration management, logging in baseline, open standards, ownership, protection of data, secure by default, secure communications, secure controls, strong authentication, threat modeling, vulnerability management, upgrade and patch tooling", attributes: [selection_criteria, questions, why], locator: "pp.3-4, 7-20", kind: stated, tmodel_mapping: "Requirement group (consumer-side)", notes: ""}
  - {name: SelectionCriterion, definition: "the 'Selection criteria' statement per element", attributes: [], locator: "each element section", kind: stated, tmodel_mapping: "Requirement", notes: ""}
  - {name: Question, definition: "'Questions to ask' the manufacturer per element", attributes: [], locator: "each element section", kind: stated, tmodel_mapping: "Requirement (interrogative)", notes: ""}
  - {name: ThreatModel, definition: "a full and detailed, up-to-date product threat model articulating attack vectors and implemented security measures; tracks public threat sources (e.g. MITRE EMB3D); states assumed external controls, communication capabilities, intended environment, coding-error classes, supply-chain protections", attributes: [threat_sources, assumed_controls, intended_environment, gaps_roadmap], locator: "Threat Modeling, p.17", kind: stated, tmodel_mapping: "the tmodel threat-model instance itself — ThreatInstance/AttackPattern/MitigationInstance/Environment (ARCH-0001 §1-§5)", notes: "the buyer is a consumer of the manufacturer's threat model: a governed, shareable view (R-043)"}
  - {name: ThreatSource, definition: "public threat catalogue such as MITRE EMB3D", attributes: [], locator: "p.17", kind: stated, tmodel_mapping: "AttackPattern catalog (CAPEC/ATT&CK analogue; EMB3D not held)", notes: ""}
  - {name: Log, definition: "minimum log set enabled by default in open formats: authentication events, log deletion/modification, device changes, data CRUD events, errors; each with timestamp, source address/port, account, correlation id, description", attributes: [type, fields], locator: "Logging, p.9", kind: stated, tmodel_mapping: "technical mitigation; Evidence source", notes: ""}
  - {name: Configuration, definition: "configuration settings and engineering logic, backed up and restorable via documented interfaces in open formats", attributes: [], locator: "Configuration Management, p.8", kind: stated, tmodel_mapping: "Asset (data) on Component", notes: ""}
  - {name: SBOM_HBOM, definition: "software and hardware bill of materials delivered with the product, machine-readable", attributes: [], locator: "p.4, p.18", kind: stated, tmodel_mapping: "Evidence; composed_of", notes: ""}
  - {name: SecurityAdvisory, definition: "machine-processable advisory (CSAF), incl. CWE, affected products, impact, severity, remediation; VEX statements via CSAF", attributes: [format, cwe, vex_status], locator: "Vulnerability Management, pp.18-19", kind: stated, tmodel_mapping: "Finding/Vulnerability + VEX Assertion (ARCH-0001 §5)", notes: ""}
  - {name: CVDPolicy, definition: "coordinated vulnerability disclosure policy; security.txt per RFC 9116", attributes: [], locator: "p.19", kind: stated, tmodel_mapping: "documentation mitigation", notes: ""}
  - {name: Certificate, definition: "digital certificates for secure authenticated communication that fail loudly but let critical processes continue", attributes: [expiry], locator: "Secure Communications, p.3", kind: stated, tmodel_mapping: "Component property (crypto)", notes: ""}
  - {name: Regulation, definition: "NIS2, RED delegated regulation, CRA (CE marking)", attributes: [], locator: "p.4 fn 5-6", kind: stated, tmodel_mapping: "library records (eu-cra-2024-2847)", notes: ""}
  - {name: Standard, definition: "ISA/IEC 62443 (SL3 of 62443-4-2, 62443-3-3), NIST SP 800-82, SP 800-213A, ISO/IEC 29147/30111, CSAF, RFC 9116", attributes: [], locator: "pp.7, 18-19", kind: stated, tmodel_mapping: "library records / crosswalk targets", notes: ""}
edges:
  - {name: selects, from: Buyer, to: OTProduct, cardinality: "N:M", definition: "", locator: "p.3", kind: stated, tmodel_mapping: "Deployment / owned_by"}
  - {name: prioritizes, from: Buyer, to: SecurityElement, cardinality: "1:12", definition: "", locator: "p.3, p.7", kind: stated, tmodel_mapping: "Requirement profile selection (R-042)"}
  - {name: has_criterion, from: SecurityElement, to: SelectionCriterion, cardinality: "1:1", definition: "", locator: "each section", kind: stated, tmodel_mapping: ""}
  - {name: has_question, from: SecurityElement, to: Question, cardinality: "1:N", definition: "", locator: "each section", kind: stated, tmodel_mapping: ""}
  - {name: models, from: ThreatModel, to: OTProduct, cardinality: "N:1", definition: "product threat model", locator: "p.17", kind: stated, tmodel_mapping: "threat model of a Product"}
  - {name: tracks, from: ThreatModel, to: ThreatSource, cardinality: "N:M", definition: "", locator: "p.17", kind: stated, tmodel_mapping: "AttackPattern catalog link"}
  - {name: informs, from: ThreatModel, to: Log, cardinality: "1:N", definition: "manufacturer supplements minimum log types from its threat model", locator: "Logging, p.9", kind: stated, tmodel_mapping: "ThreatInstance -> detection mitigation"}
  - {name: assumes, from: ThreatModel, to: Standard, cardinality: "N:M", definition: "assumed external security products/controls protecting the product", locator: "p.17", kind: stated, tmodel_mapping: "Environment assumptions (ARCH-0001 §3)"}
  - {name: delivered_with, from: OTProduct, to: SBOM_HBOM, cardinality: "1:N", definition: "", locator: "p.4", kind: stated, tmodel_mapping: "composed_of evidence"}
  - {name: published_as, from: SecurityAdvisory, to: OTProduct, cardinality: "N:M", definition: "affected products identified", locator: "p.18", kind: stated, tmodel_mapping: "affects"}
  - {name: aligns_with, from: SecurityElement, to: Standard, cardinality: "N:M", definition: "guidance aligns with 62443 SL3, NIST 800-82/213A, CRA", locator: "p.7", kind: stated, tmodel_mapping: "R-044 crosswalk (document-level, not item-level)"}
gaps:
  - "Buyer as consumer of the supplier's threat model: the product threat model must be exportable as a governed view with assumed-environment statements (R-043) — tmodel has no 'assumptions' object."
  - "OT-specific: safety events, engineering logic, emergency/diagnostic commands — tmodel has no safety-function asset type distinct from data."
  - "Support period / end-of-support on Product (vulnerability management across decades) — ARCH-0001 §3b has end-of-support phase but no support-period attribute."
