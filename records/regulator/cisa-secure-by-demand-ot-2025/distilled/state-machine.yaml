note: >-
  Lifecycles the guide states or implies. A state or transition is stated when the source names it
  (a support period, end-of-life, an expired certificate, a degraded state, a VEX status),
  otherwise inferred with inferred_reason. guards must hold before a transition; effects are
  carried out as part of it; each lists the quotation and the ids that state it, with its own
  kind. A trigger is an event of the events list; flow_step names the protocol.yaml step or error
  path that produces it. Quotations are cut by script from the source and checked by
  bin/check-quotes; ids are emitted by script from a selector, refusing zero or several matches,
  and every resolved pair was read. Pass 2 (verify) re-wired the guards and effects against the
  finished requirements.yaml, the lanes having run concurrently: split children for split
  parents and entries for promoted candidates, each by selector. No flow or lifecycle here has a
  timer, deadline or duration:
  support periods, end-of-life dates and remediation without delay carry no values, and the
  guide's only dates besides its own publication date are footnote 5's, for EU instruments: the
  Radio Equipment Directive's Delegated Regulation applying from 1 August 2025 and the Cyber
  Resilience Act in force since December 10, 2024. Open issues OI-nn are in protocol.yaml.
  Pass 3 (cross-check) added flows to every machine: the flows of protocol.yaml that share its
  object, found from the events' flow_step; SM07 (business continuity) joins F12, whose step
  F12.2 quotes the next sentence of the same paragraph, on the minimum system
  functionality to aim for (L448-450).
