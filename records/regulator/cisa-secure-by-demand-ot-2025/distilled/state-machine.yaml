  - id: "SM08"
    name: "patch-on-site"
    object: "One patch at the operator's site"
    locator: "Upgrade and Patch Tooling"
    summary: "Verified before it is applied; a faulty patch is recovered from automatically."
    quotes:
      - source_lines: "852"
        quote: |-
          For verification, buyers should be able to reliably determine the authenticity of an update.
    flows: ["F09"]
    states:
      - id: "available"
        meaning: "Delivered over a secure channel."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "852-853"
            quote: |-
              The delivery mechanism for that update needs to be over a secure channel to help guarantee integrity.
      - id: "verified"
        meaning: "Determined to be authentic."
        kind: "stated"
        quotes:
          - source_lines: "852"
            quote: |-
              For verification, buyers should be able to reliably determine the authenticity of an update.
      - id: "rejected"
        meaning: "Not applied: not authentic."
        kind: "inferred"
        terminal: "yes"
        inferred_reason: >-
          The source requires authenticity can be determined, not what follows a failure.
      - id: "applied"
        meaning: "Applied under owner-controlled patch management."
        kind: "stated"
        quotes:
          - source_lines: "144"
            quote: |-
              support owner-controlled patch management.
