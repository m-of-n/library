      - id: "PA-T04"
        from: "applied"
        to: "faulty"
        trigger: "patch-fault"
        kind: "stated"
        quotes:
          - source_lines: "845-847"
            quote: |-
              For example, a patch may be incompatible with another piece of software, or a patch may overwrite the asset owner’s configurations or engineering logic.
