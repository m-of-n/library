        guards: "none stated"
      - id: "CF-T08"
        from: "any"
        to: "secure_default"
        trigger: "reset-to-original"
        kind: "stated"
        guards:
          - meaning: "The user is authorized."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0185"
  - id: "SM06"
