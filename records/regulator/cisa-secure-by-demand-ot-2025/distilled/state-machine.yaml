machines:
  - id: "SM01"
    name: "candidate-product"
    object: "A candidate OT product in a buyer's procurement"
    locator: "Summary; Considerations for OT Product Selection; Threat Modeling"
    summary: >-
      From candidate to selected or avoided. The guide states the selection and the one avoidance;
      it gives no threshold, so evaluation has no stated guard of its own.
    quotes:
      - source_lines: "84-85"
        quote: |-
          When procuring products, OT owners and operators should select products from manufacturers who prioritize the following security elements:
    flows: ["F01"]
    states:
      - id: "candidate"
        meaning: "A product under consideration."
        kind: "inferred"
        initial: "yes"
        inferred_reason: "The guide names selecting products, never a state before evaluation."
      - id: "under_evaluation"
        meaning: "The buyer is checking the elements."
        kind: "stated"
        quotes:
          - source_lines: "260-261"
            quote: |-
              As buyers are checking for these elements, they should ensure
      - id: "selected"
        meaning: "Selected (and prioritized) for purchase."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "84-85"
            quote: |-
              should select products from manufacturers who prioritize the following security elements:
      - id: "avoided"
        meaning: "Not bought."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "717-718"
            quote: |-
              Buyers should avoid products that rely entirely on a threat actor never accessing the OT network.
    transitions:
      - id: "PS-T01"
        from: "candidate"
        to: "under_evaluation"
        trigger: "element-questions-asked"
        kind: "stated"
        quotes:
          - source_lines: "252"
            quote: |-
              Buyers should look for the following key security elements when selecting OT products:
        guards: "none stated"
      - id: "PS-T02"
        from: "under_evaluation"
        to: "selected"
        trigger: "selection-decided"
        kind: "stated"
        note: "No stated rule says how many elements, or which, must be met (OI-02)."
        guards:
          - meaning: "The manufacturer prioritizes the security elements."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0003"
          - meaning: >-
              The product complies with applicable legal obligations and carries the required
              marks.
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0104"
      - id: "PS-T03"
        from: "under_evaluation"
        to: "avoided"
        trigger: "relies-on-no-network-access"
        kind: "stated"
        guards:
          - meaning: "The product's security assumes that no threat actor ever reaches the OT network."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0074"
      - id: "PS-T04"
        from: "under_evaluation"
        to: "avoided"
        trigger: "non-compliance-found"
        kind: "inferred"
        inferred_reason: >-
          The buyer is to ensure that what it buys complies; not buying is this model's
          consequence.
        guards: "none stated"
  - id: "SM02"
    name: "product-support"
    object: "A product's support relationship with its manufacturer"
    locator: "Upgrade and Patch Tooling; Summary elements 11 and 12"
    summary: >-
      Supported, then end of life, then retired; an operating system reaching end of life is a
      stated sub-state the manufacturer resolves by a free port. Two stated failure states:
      support tied to an end-of-life operating system, and years on a high-risk product for want
      of transparency.
    quotes:
      - source_lines: "860-861"
        quote: |-
          During the support period, a buyer can expect that security vulnerabilities in their products will be handled and security updates will be made available.
    flows: ["F10"]
    states:
      - id: "supported"
        meaning: "Inside the support period: vulnerabilities handled, free security updates."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "137-138"
            quote: |-
              Each product has a clearly defined support period during which vulnerabilities are managed and patches are supplied free of charge.
      - id: "os_end_of_life"
        meaning: "The product's operating system is end-of-life (or soon to be)."
        kind: "stated"
        quotes:
          - source_lines: "833-834"
            quote: |-
              if the operating system is end-of-life?
      - id: "end_of_life"
        meaning: "Past the published end-of-life date."
        kind: "stated"
        quotes:
          - source_lines: "834"
            quote: |-
              publish end-of-life dates for their products?
      - id: "retired"
        meaning: "Replaced, or kept behind mitigating controls (e.g. virtualized)."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "862-864"
            quote: |-
              Transparency around retirements helps buyers schedule their replacement hardware or invest in mitigating controls such as virtualizing the out-of-date system within a modern operating system.
      - id: "stuck_on_old_os"
        meaning: "Forced to run an older operating system because support is tied to it."
        kind: "stated"
        error: "yes"
        quotes:
          - source_lines: "864-874"
            quote: |-
              it is very common for warranty or support packages to be tied to an underlying end-of-life operating system, so that an operator is forced to run an older version of an operating system even if the software is functional on newer operating systems.
      - id: "high_risk_unsupported"
        meaning: "Maintaining a high-risk product for years, unplanned."
        kind: "stated"
        error: "yes"
        quotes:
          - source_lines: "875-876"
            quote: |-
              Without the planning that transparency allows, an operator may have to maintain a high-risk product for years.
    transitions:
      - id: "SU-T01"
        from: "supported"
        to: "supported"
        trigger: "vulnerability-handled"
        kind: "stated"
        effects:
          - meaning: "Security updates made available, free of charge."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0096"
              - "cisa-secure-by-demand-ot-2025#R-0094"
      - id: "SU-T02"
        from: "supported"
        to: "os_end_of_life"
        trigger: "os-support-ends"
        kind: "stated"
        quotes:
          - source_lines: "828-829"
            quote: |-
              This includes porting supported software to new operating systems free of charge if the original operating system is no longer supported.
        guards: "none stated"
      - id: "SU-T03"
        from: "os_end_of_life"
        to: "supported"
        trigger: "software-ported"
        kind: "stated"
        note: "When the port is owed differs between the Summary and the selection criteria (OI-04)."
        guards:
          - meaning: "At no extra cost."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0204"
              - "cisa-secure-by-demand-ot-2025#R-0289"
        effects:
          - meaning: >-
              The operator checks the support agreement still holds on the modern operating
              system.
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0098"
      - id: "SU-T04"
        from: "os_end_of_life"
        to: "stuck_on_old_os"
        trigger: "support-tied-to-eol-os"
        kind: "stated"
        quotes:
          - source_lines: "864-874"
            quote: |-
              it is very common for warranty or support packages to be tied to an underlying end-of-life operating system, so that an operator is forced to run an older version of an operating system even if the software is functional on newer operating systems.
        guards: "none stated"
      - id: "SU-T05"
        from: "supported"
        to: "end_of_life"
        trigger: "support-period-ends"
        kind: "stated"
        guards:
          - meaning: "The support period was stated and matches the intended lifecycle."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0094"
              - "cisa-secure-by-demand-ot-2025#R-0158"
      - id: "SU-T06"
        from: "end_of_life"
        to: "retired"
        trigger: "replacement-or-mitigation"
        kind: "stated"
        quotes:
          - source_lines: "862-864"
            quote: |-
              Transparency around retirements helps buyers schedule their replacement hardware or invest in mitigating controls such as virtualizing the out-of-date system within a modern operating system.
        guards: "none stated"
      - id: "SU-T07"
        from: "supported"
        to: "high_risk_unsupported"
        trigger: "no-transparency"
        kind: "stated"
        guards:
          - meaning: "Neither support period nor end-of-life date was made known."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0099"
  - id: "SM03"
    name: "vulnerability"
    object: "One vulnerability, from report to disclosure, on the manufacturer's side"
    locator: "Vulnerability Management"
    summary: >-
      The guide names two VEX statuses and the elements of handling; the order of CVE publication
      and remediation is not stated, disclosure follows the available update.
    quotes:
      - source_lines: "746-747"
        quote: |-
          The processes help ensure that vulnerabilities in their products are identified and remediated across the entire life cycle.
    flows: ["F08"]
    states:
      - id: "reported"
        meaning: "Reported to the manufacturer's contact address."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "804"
            quote: |-
              a contact address for the reporting of discovered vulnerabilities.
      - id: "under_investigation"
        meaning: "VEX status under investigation."
        kind: "stated"
        quotes:
          - source_lines: "794-796"
            quote: |-
              Vulnerability Exploitability eXchange (VEX) statements indicating the “not affected” or “under investigation” status for “celebrity vulnerabilities” (i.e., Log4Shell-type vulnerabilities) should follow the CSAF standard.
      - id: "not_affected"
        meaning: "VEX status not affected."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "794-796"
            quote: |-
              Vulnerability Exploitability eXchange (VEX) statements indicating the “not affected” or “under investigation” status for “celebrity vulnerabilities” (i.e., Log4Shell-type vulnerabilities) should follow the CSAF standard.
      - id: "identified"
        meaning: "Identified and documented, with the affected components and an SBOM."
        kind: "stated"
        quotes:
          - source_lines: "769-771"
            quote: |-
              Complete, accurate, and timely identification and documentation of vulnerabilities and components contained in operational technology, including a software bill of materials in a commonly used and machine-readable format.
      - id: "cve_published"
        meaning: "Assigned a CVE identifier and published to the CVE Program."
        kind: "stated"
        quotes:
          - source_lines: "772"
            quote: |-
              Vulnerabilities should be assigned an identifier (CVE number) and published to CVE Program.
      - id: "remediated"
        meaning: "A security update exists."
        kind: "stated"
        quotes:
          - source_lines: "773"
            quote: |-
              Risk-based remediation of vulnerabilities without delay, including security updates.
      - id: "disclosed"
        meaning: "Advisory published and update disseminated."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "807-808"
            quote: |-
              Dissemination of security updates without delay. Updates are accompanied by advisory messages providing users with relevant information, including on potential action to be taken.
    transitions:
      - id: "VU-T01"
        from: "reported"
        to: "under_investigation"
        trigger: "report-received"
        kind: "stated"
        note: "The status is named; that a report enters it first is this model's order."
        guards: "none stated"
      - id: "VU-T02"
        from: "under_investigation"
        to: "not_affected"
        trigger: "not-affected-determined"
        kind: "stated"
        effects:
          - meaning: "A VEX statement following CSAF."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0151"
      - id: "VU-T03"
        from: "under_investigation"
        to: "identified"
        trigger: "vulnerability-confirmed"
        kind: "inferred"
        inferred_reason: "No confirmation event is named; identification is listed as an element."
        effects:
          - meaning: "Complete, accurate and timely documentation with a machine-readable SBOM."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0147"
      - id: "VU-T04"
        from: "identified"
        to: "cve_published"
        trigger: "cve-published"
        kind: "stated"
        note: "Listed with remediation; their order is not stated."
        effects:
          - meaning: "CVE identifier assigned and published."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0148"
      - id: "VU-T05"
        from: "cve_published"
        to: "remediated"
        trigger: "update-produced"
        kind: "stated"
        guards:
          - meaning: "Risk-based, without delay."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0149"
      - id: "VU-T06"
        from: "remediated"
        to: "disclosed"
        trigger: "advisory-published"
        kind: "stated"
        effects:
          - meaning: "Public advisory on the available update, machine-processable."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0150"
              - "cisa-secure-by-demand-ot-2025#R-0082"
              - "cisa-secure-by-demand-ot-2025#R-0282"
          - meaning: "Secure distribution, without delay, with advisory messages."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0154"
              - "cisa-secure-by-demand-ot-2025#R-0155"
              - "cisa-secure-by-demand-ot-2025#R-0285"
  - id: "SM04"
    name: "device-communication"
    object: "A device's machine-to-machine communication"
    locator: "Secure Communications; Summary element 7"
    summary: >-
      From the stated status quo (unauthenticated traffic) through an interim signed mode to
      authenticated communication; an expired certificate fails loudly without stopping critical
      processes.
    quotes:
      - source_lines: "562"
        quote: |-
          Standard operating processes for most OT networks use unauthenticated and unencrypted traffic.
    flows: ["F05"]
    states:
      - id: "unauthenticated"
        meaning: "Unauthenticated, unencrypted traffic."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "562"
            quote: |-
              Standard operating processes for most OT networks use unauthenticated and unencrypted traffic.
      - id: "interim_signed"
        meaning: "TLS sign-only or opportunistic TLS; expiry logs, never blocks."
        kind: "stated"
        quotes:
          - source_lines: "581-583"
            quote: |-
              operators may consider the equivalent of a TLS sign-only (unencrypted but still signed with a private key) or opportunistic TLS mode as an interim safety solution, where an expired certificate will generate logs but not prevent communication.
      - id: "authenticated"
        meaning: "Authenticated communication with deployed device certificates."
        kind: "stated"
        quotes:
          - source_lines: "552"
            quote: |-
              Products should support authenticated communication with device certificates deployed
      - id: "failing_loudly"
        meaning: "A certificate has expired: loud failure, critical processes continue."
        kind: "stated"
        quotes:
          - source_lines: "111-112"
            quote: |-
              fail loudly (e.g., when a certificate expires) but allows critical processes to continue.
    transitions:
      - id: "DC-T01"
        from: "unauthenticated"
        to: "interim_signed"
        trigger: "interim-mode-enabled"
        kind: "stated"
        guards:
          - meaning: "Certificate management is not common in the environment yet (a may: permission)."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0054"
      - id: "DC-T02"
        from: "unauthenticated"
        to: "authenticated"
        trigger: "certificates-deployed"
        kind: "stated"
        guards:
          - meaning: "Deployment is easy and does not need cyber experts."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0053"
              - "cisa-secure-by-demand-ot-2025#R-0187"
      - id: "DC-T03"
