  - id: "SM05"
    name: "product-configuration"
    object: "The product's configuration settings and engineering logic"
    locator: "Configuration Management; Secure by Default; Summary element 6"
    summary: >-
      Delivered secure by default, changed under authorization, restored from backup after
      compromise, and resettable to the original state by an authorized user.
    quotes:
      - source_lines: "483-484"
        quote: |-
          The product is delivered secure out of the box, resilient against the most prevalent threats and vulnerabilities, without requiring additional configuration from users or administrators.
    flows: ["F02"]
    states:
      - id: "secure_default"
        meaning: "The configuration as delivered: the most secure default preset."
        kind: "stated"
        initial: "yes"
        quotes:
          - source_lines: "521-522"
            quote: |-
              with the most secure default configuration preset removing the burden of hardening from operators.
      - id: "modified"
        meaning: "Changed by the operator from the defaults, under change control."
        kind: "stated"
        quotes:
          - source_lines: "509-510"
            quote: |-
              the guide should clearly state security risks introduced by operators changing default configuration options.
      - id: "unauthorized_change"
        meaning: "An unauthorized change has been made and identified."
        kind: "stated"
        error: "yes"
        quotes:
          - source_lines: "311-312"
            quote: |-
              swiftly identify unauthorized configuration changes
      - id: "compromised"
        meaning: "A threat actor has a foothold, or a component was wiped."
        kind: "stated"
        error: "yes"
        quotes:
          - source_lines: "314-315"
            quote: |-
              in which a threat actor establishes a foothold or wipes a component on the OT network.
    transitions:
      - id: "CF-T01"
        from: "secure_default"
        to: "modified"
        trigger: "authorized-change"
        kind: "stated"
        guards:
          - meaning: "The change is authorized (the product can authorize or restrict changes)."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0109"
        effects:
          - meaning: "The hardening guide has stated the risks of changing the defaults."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0134"
      - id: "CF-T02"
        from: "modified"
        to: "modified"
        trigger: "authorized-change"
        kind: "stated"
        guards:
          - meaning: "The change is authorized."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0109"
      - id: "CF-T03"
        from: "any"
        to: "modified"
        trigger: "less-secure-change-attempted"
        kind: "stated"
        note: "Whether the attempt is then blocked is not stated; the product alerts."
        effects:
          - meaning: "Alert on the attempt."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0108"
      - id: "CF-T04"
        from: "any"
        to: "unauthorized_change"
        trigger: "unauthorized-change"
        kind: "stated"
        effects:
          - meaning: "Identified swiftly (alerts, tamper detection)."
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0012"
      - id: "CF-T05"
        from: "any"
        to: "compromised"
        trigger: "foothold-or-wipe"
        kind: "stated"
        quotes:
          - source_lines: "314-315"
            quote: |-
              in which a threat actor establishes a foothold or wipes a component on the OT network.
        guards: "none stated"
      - id: "CF-T06"
        from: "compromised"
        to: "modified"
        trigger: "restored-from-backup"
        kind: "stated"
        note: "Restored to the backed-up configuration, which may be the default."
        guards:
          - meaning: >-
              Authenticated backups exist in open-standard files, restorable in person or over the
              network.
            kind: "stated"
            ids:
              - "cisa-secure-by-demand-ot-2025#R-0215"
              - "cisa-secure-by-demand-ot-2025#R-0111"
              - "cisa-secure-by-demand-ot-2025#R-0112"
              - "cisa-secure-by-demand-ot-2025#R-0013"
      - id: "CF-T07"
        from: "unauthorized_change"
        to: "modified"
        trigger: "restored-from-backup"
        kind: "inferred"
        inferred_reason: >-
          The guide states identification of unauthorized changes and recovery after incidents,
