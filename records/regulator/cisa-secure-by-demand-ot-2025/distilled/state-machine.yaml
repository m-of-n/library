  - id: "SM09"
    name: "remote-connection"
    object: "Connectivity between the OT network and the manufacturer or vendor"
    locator: "Protection of Data"
    summary: "Push-only by default; a two-way connection exists only after the operator approves it."
    quotes:
      - source_lines: "473-474"
        quote: |-
          Buyers should seek out manufacturers that rely on data pushed out of the OT network as necessary, rather than pulling data out of the OT network.
    flows: ["F04"]
    states:
