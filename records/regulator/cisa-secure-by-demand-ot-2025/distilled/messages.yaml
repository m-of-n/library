  - name: "security-event-record"
    locator: "Logging in the Baseline Product, L362-363"
    encoding: "JSON object (derived)"
    layout: "What every event record includes."
    fields:
      - name: "timestamp"
        type: "string"
        required: true
        note: "Format not given."
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0021"
      - name: "source_address"
        type: "string"
        required: true
        note: "Source address; type not given."
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0021"
      - name: "source_port"
        type: "integer/string"
        required: true
        note: "Source port; the guide says address and port together. An integer 0 to 65535 or a non-empty string."
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0021"
      - name: "affected_account"
        type: "string"
        required: true
        note: "Affected account details."
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0021"
      - name: "correlation_id"
        type: "string"
        required: true
        note: "Correlation identifier."
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0021"
      - name: "event_description"
        type: "string"
        required: true
        note: "Event description."
        constrained_by:
          - "cisa-secure-by-demand-ot-2025#R-0021"
      - name: "event_type"
        type: "enum authentication|log-integrity|device-change|data-event|error"
        required: false
        note: "Optional: the five event kinds of the minimum log-type list (the sixth item, open standard formats, is a format, not an event kind). The guide does not put a type on the record."
