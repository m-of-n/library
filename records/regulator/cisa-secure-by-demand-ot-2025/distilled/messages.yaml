          - "cisa-secure-by-demand-ot-2025#R-0117"
          - "cisa-secure-by-demand-ot-2025#R-0118"
          - "cisa-secure-by-demand-ot-2025#R-0119"
          - "cisa-secure-by-demand-ot-2025#R-0120"
          - "cisa-secure-by-demand-ot-2025#R-0121"
    notes: "The guide does not say the minimum log types are fields of a record; event_type is optional and derived. Log types beyond the minimum come from the manufacturer's threat model (not a field). The sixth item of the minimum list, open standard formats (R-0116), constrains the encoding, which the guide does not name, and no field. required true reads the should of R-0021 as the conformance test: a record missing a detail does not meet it."
