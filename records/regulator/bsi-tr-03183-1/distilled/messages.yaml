schema: "library-messages/v1"
record: bsi-tr-03183-1
note: >
  The TR prescribes the content of several structures: the control record (§4.5), the risk scenario of an ARC (§6.1), the
  risk-assessment work products (RH_* Input/Output), the assessment report (§4.8) and the decision-criteria tables (§5.14).
  No encoding is given in the PDF; the controls themselves are said to exist in NIST OSCAL (Chapter 7) in a repository with
  access on request (not obtained). Field requirements cite requirement ids in requirements.yaml.
messages:
  - id: Control
    locator: "§4.5 'Each control consists of the following parts'"
    fields:
      - {name: input, applies_to: "Activity only", required: false, definition: "Expected input for manufacturer activities", constrained_by: []}
      - {name: risk, required: false, definition: "Risk-based scenario under which the control is applicable", constrained_by: []}
      - {name: control, required: true, definition: "has to be met by the PwDE or part thereof where applicable", constrained_by: ["R-0010"]}
      - {name: output, applies_to: "Activity only", required: false, definition: "Expected output of manufacturer activities", constrained_by: []}
      - {name: target, required: false, definition: "Type of component or function secured by the control", constrained_by: []}
      - {name: assessment_guidance, required: false, definition: "Additional guidance for the assessment of the control; levels by associated risk", constrained_by: []}
      - {name: implementation_guidance, required: false, definition: "Implementation specific information ... not a mandatory requirement, but rather a recommendation", constrained_by: []}
      - {name: compensation, required: false, definition: "Alternative control for compensation if the initial control can not be fulfilled", constrained_by: []}
      - {name: reference_cra, required: true, definition: "Essential requirement or other requirement of the CRA supported by the control", constrained_by: []}
      - {name: control_type, type: "enum (Activity, Mechanism, Documentation)", required: true, locator: "§4.6", constrained_by: []}
  - id: RiskScenario
    locator: "§6.1; §6.5 example"
    fields:
      - {name: risk_scenario, type: string, required: true, definition: "Prose describing the risk scenario", constrained_by: []}
      - {name: assets, type: "list of C(n)/I(n)/A(n) minimum impacts", required: true, definition: "Affected Assets and Impact", constrained_by: []}
      - {name: environment, type: "object {access_restriction, interface_restriction, user_capabilities}; '*' matches any; several values = any must match", required: true, constrained_by: []}
  - id: AssessmentVerdict
    locator: "§4.6; §4.7"
    fields:
      - {name: control_id, required: true, constrained_by: []}
      - {name: result, type: "enum (PASS, FAIL, N/A)", required: true, constrained_by: ["R-0010"]}
      - {name: na_reason, type: "enum (compensation fulfilled, target mechanism does not exist, 'if' condition does not apply, conflict with other regulations, risk does not apply)", required: "if result = N/A", constrained_by: []}
      - {name: assessment_level, type: "enum (conceptual, functional)", required: true, rule: "at least conceptual", constrained_by: ["R-0008", "R-0009"]}
      - {name: overall_verdict, type: "enum (PASS, FAIL)", rule: "PASS iff every control PASS or N/A", required: true, constrained_by: ["R-0010"]}
  - id: AssessmentReport
    locator: "§4.8"
    fields:
      - {name: assessment_date, type: date, required: true, constrained_by: ["R-0011"]}
      - {name: pwde_identification, type: "name and model; description, intended purpose and reasonably foreseeable use; HW/SW version; SBOM where applicable; HW photographs/illustrations", required: true, constrained_by: ["R-0011"]}
      - {name: risk_assessment, type: "identified assets and threats; evaluated risks; accepted risks", required: true, constrained_by: ["R-0011", "RH_DOC.1"]}
      - {name: design_documentation, type: "architecture incl. HW/SW components and network/physical interfaces; selected controls with mitigated risk and applicable ERs; non-applicable ERs with justification; implementation description; verification processes", required: true, constrained_by: ["R-0011", "RH_RT.1.1.2.1", "RH_RT.1.1.2.2"]}
      - {name: vulnerability_handling_description, required: true, constrained_by: ["R-0011"]}
      - {name: vulnerability_handling_verification, required: true, constrained_by: ["R-0011"]}
      - {name: user_documentation, required: true, constrained_by: ["R-0011"]}
      - {name: assessment_steps, type: list, required: false, rule: "every assessment step should be documented", constrained_by: ["R-0007"]}
  - id: RiskContext
    locator: "§5.7.1-§5.7.3"
    fields:
      - {name: intended_purpose_functionality, required: true, constrained_by: []}
      - {name: foreseeable_use_degrees_of_freedom, required: true, constrained_by: []}
      - {name: operational_environment, required: true, constrained_by: []}
      - {name: target_users_and_usage_scenarios, required: true, constrained_by: []}
      - {name: expected_period_of_use, required: true, constrained_by: []}
      - {name: architecture, type: "connective capabilities; relation to RDPS; relation to other PwDE; boundaries", required: true, constrained_by: []}
      - {name: decision_criteria, type: "impact, likelihood, acceptance criteria", required: true, constrained_by: ["R-0012", "R-0014"]}
  - id: Asset
    locator: "§5.2; §5.8.1.1; Tables 1-3"
    fields:
      - {name: name, required: true, constrained_by: ["RH_RA.1.1.1"]}
      - {name: category, type: "enum from Tables 1-3 (e.g. PII.Generic, Functions.Essential, Security.Secrets)", required: true, constrained_by: ["RH_RA.1.1.1"]}
      - {name: base_impact, type: "C/I/A each 1-5 or '-' or derived X'", required: true, constrained_by: ["RH_RA.1.2"]}
      - {name: amplifier, type: number, required: false, rule: "Impact = BaseImpact * Amplifier; justification required when used", constrained_by: []}
      - {name: environments, type: "list of environment ids", required: false, constrained_by: []}
  - id: Risk
    locator: "§5.8-§5.11"
    fields:
      - {name: threat, type: "generic threat (loss of C/I/A) × asset × environment, optionally × event type (Attack, Misconfiguration, Failure)", required: true, constrained_by: ["RH_RA.1.1.2"]}
      - {name: affected_components, required: true, constrained_by: ["RH_RA.1.1.2"]}
      - {name: impact, type: "1-5", required: true, constrained_by: ["RH_RA.1.2"]}
      - {name: likelihood, type: "criteria-based (environment tuple)", required: true, constrained_by: ["RH_RA.1.2"]}
      - {name: evaluation, type: "enum (accept, treat)", required: true, constrained_by: ["RH_RA.1.3"]}
      - {name: treatment, type: "enum (controls, shared-supplier, shared-user)", required: "if evaluation=treat", constrained_by: ["RH_RT.1.1.1", "RH_RT.1.2.1", "RH_RT.1.2.2"]}
      - {name: selected_controls, type: list, required: "if treated by controls", constrained_by: ["RH_RT.1.1.1"]}
      - {name: acceptance_justification, required: "if accepted", constrained_by: ["R-0030"]}
  - id: Environment
    locator: "§5.14.2 Tables 4, 5, 7; Annex D Tables 11-13; §6.2 step 3"
    fields:
      - {name: interface_restriction, type: "enum (Physical, Local, Dedicated known Network, Known network, External Network)", required: true, constrained_by: []}
      - {name: access_restriction, type: "enum (Restricted, Public Restricted, Movable, Non Restricted) - values from Annex D Table 12; §5.14.2 Table 6 missing", required: true, constrained_by: []}
      - {name: user_capability, type: "enum (Non-user-related, Skilled, Instructed, Layman)", required: true, constrained_by: []}
  - id: ApplicabilityStatement
    locator: "§5.11.2; Appendix B"
    fields:
      - {name: essential_requirement_id, type: "ER.x / VH.x", required: true, constrained_by: ["RH_RT.1.1.2.1"]}
      - {name: applicable, type: boolean, required: true, constrained_by: ["RH_RT.1.1.2.1"]}
      - {name: addressed_by_controls, type: list, required: "if applicable", constrained_by: ["RH_RT.1.1.2.1"]}
      - {name: justification, required: "if not applicable", constrained_by: ["RH_RT.1.1.2.2", "R-0017"]}
events:
  # Added by the cross-check pass (2026-10-02): every message named in protocol.yaml flows that is not a
  # content-prescribed structure above. These are process events / work items; the source names the act
  # but prescribes no fields, so no schema is derived for them.
  - id: "Early Warning Notification"
    content_prescribed: false
    used_in:
      - flow: "P3"
        step: 1
    note: "CRA Article 14 reporting step quoted as context by TR-03183-1 §3; normative source is eu-cra-2024-2847 Art. 14, not this TR"
  - id: "Vulnerability Notification / Incident Notification"
    content_prescribed: false
    used_in:
      - flow: "P3"
        step: 2
    note: "CRA Article 14 reporting step quoted as context by TR-03183-1 §3; normative source is eu-cra-2024-2847 Art. 14, not this TR"
  - id: "Final Report"
    content_prescribed: false
    used_in:
      - flow: "P3"
        step: 3
    note: "CRA Article 14 reporting step quoted as context by TR-03183-1 §3; normative source is eu-cra-2024-2847 Art. 14, not this TR"
  - id: "Notice of third-party notification"
    content_prescribed: false
    used_in:
      - flow: "P3"
        step: 4
    note: "CRA Article 14 reporting step quoted as context by TR-03183-1 §3; normative source is eu-cra-2024-2847 Art. 14, not this TR"
