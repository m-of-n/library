schema: "library-protocol/v1"
record: bsi-tr-03183-1
note: >
  Two process flows the TR defines: (P1) risk handling (Figure 4, §5.4-§5.13; ISO 31000-based) and (P2) the TR's
  assessment procedure (§4). The CRA reporting timelines summarised in §3.6 are the CRA's (Article 14), quoted as
  context in P3 with kind: stated-by-CRA; they are not TR requirements. Messages are the structures in messages.yaml.
roles:
  - {id: manufacturer, locator: "§3.3"}
  - {id: evaluator, locator: "§4.1 (manufacturer staff or third party; impartial)"}
  - {id: supplier, locator: "§5.11.3.1 (third-party component manufacturer / RDPS provider)"}
  - {id: user, locator: "§4.2 NOTE (integrator, administrator, end-user)"}
  - {id: csirt, locator: "§3.6 (CSIRT designated as coordinator)"}
  - {id: enisa, locator: "§3.6 (via single reporting platform, CRA Art. 16)"}
flows:
  - id: P1
    name: "Risk handling (per PwDE, iterative)"
    locator: "§5.4 Figure 4; §5.7-§5.13"
    steps:
      - {n: 1, actor: manufacturer, produces: RiskContext, note: "intended purpose/foreseeable use, architecture, decision criteria", constrained_by: ["R-0012"], kind: stated}
      - {n: 2, actor: manufacturer, produces: "Asset list", constrained_by: ["RH_RA.1.1.1"], kind: stated}
      - {n: 3, actor: manufacturer, produces: "Risk list (threats x assets x components)", constrained_by: ["RH_RA.1.1.2"], kind: stated}
      - {n: 4, actor: manufacturer, produces: "Analysed risks (impact, likelihood)", constrained_by: ["RH_RA.1.2"], kind: stated}
      - {n: 5, actor: manufacturer, produces: "Evaluated risks (accept / treat)", constrained_by: ["RH_RA.1.3", "R-0020", "R-0021", "R-0022", "R-0023", "R-0024", "R-0025"], kind: stated}
      - {n: 6, actor: manufacturer, produces: "Selected controls in the design", constrained_by: ["RH_RT.1.1.1"], kind: stated}
      - {n: 7, actor: manufacturer, produces: ApplicabilityStatement, constrained_by: ["RH_RT.1.1.2.1", "RH_RT.1.1.2.2"], kind: stated}
      - {n: 8, actor: manufacturer, to: supplier, produces: "Shared risks + due diligence actions", condition: "risk cannot be treated alone", constrained_by: ["RH_RT.1.2.1"], kind: stated}
      - {n: 9, actor: manufacturer, to: user, produces: "Shared risks + user guidance", condition: "within foreseeable user expectations", constrained_by: ["RH_RT.1.2.2"], kind: stated}
      - {n: 10, actor: manufacturer, produces: "Implemented controls + verification", constrained_by: ["RH_RT.1.3"], kind: stated}
      - {n: 11, actor: manufacturer, produces: "Risk assessment documentation", constrained_by: ["RH_DOC.1"], kind: stated}
      - {n: 12, actor: manufacturer, produces: "Updated risk assessment", trigger: "update with security implications; new vulnerability; new threat; or regular interval", constrained_by: ["RH_UPD.1", "R-0019"], kind: stated}
    loops:
      - {from: 10, to: 2, condition: "new security assets introduced by implemented controls (Annex C.8)", kind: stated}
      - {from: 12, to: 2, condition: "risk context changed", kind: stated}
  - id: P2
    name: "Assessment against the TR"
    locator: "§4.1-§4.8"
    steps:
      - {n: 1, actor: manufacturer, to: evaluator, produces: "all information required", constrained_by: ["R-0003"], kind: stated}
      - {n: 2, actor: evaluator, produces: "PwDE state: new or reset, initial setup per manual, updated to newest version", locator: "§4.3", kind: stated}
      - {n: 3, actor: evaluator, produces: AssessmentVerdict, note: "per control: applicability, PASS/FAIL/N-A; at least conceptual", constrained_by: ["R-0008", "R-0009"], kind: stated}
      - {n: 4, actor: evaluator, produces: "overall verdict", constrained_by: ["R-0010"], kind: stated}
      - {n: 5, actor: evaluator, produces: AssessmentReport, constrained_by: ["R-0007", "R-0011"], kind: stated}
    notes: ["A PASS is not a statement of CRA compliance, a FAIL not of non-compliance (§4.7)."]
  - id: P3
    name: "CRA Article 14 reporting (quoted context, not TR requirements)"
    locator: "§3.6 'Reporting obligations'"
    steps:
      - {n: 1, actor: manufacturer, to: "csirt+enisa", message: "Early Warning Notification", timer: "within 24 hours of becoming aware", kind: stated-by-CRA}
      - {n: 2, actor: manufacturer, to: "csirt+enisa", message: "Vulnerability Notification / Incident Notification", timer: "within 72 hours", kind: stated-by-CRA}
      - {n: 3, actor: manufacturer, to: "csirt+enisa", message: "Final Report", timer: "14 days after a corrective or mitigating measure is available (vulnerability); one month after incident report (severe incident)", kind: stated-by-CRA}
      - {n: 4, actor: csirt, to: manufacturer, message: "Notice of third-party notification", timer: "without undue delay", kind: stated-by-CRA}
