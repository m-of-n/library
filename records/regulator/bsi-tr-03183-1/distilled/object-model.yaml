schema: "library-object-model/v1"
record: bsi-tr-03183-1
source_version: "1.0.0 (2026-07-31)"
question: "What objects (entity types) and relationship edges does BSI TR-03183-1 assume or define?"
note: >
  Separate pass over .cache/bsi-tr-03183-1.txt. kind: stated = named and given a role/definition in the TR; inferred = presupposed.
  tmodel_mapping targets ARCH-0001 v0.2.0 and DL-0009. The TR's control catalogue (OSCAL, Chapter 7) was not available;
  objects that only it would define (e.g. Target vocabulary) are absent.
objects:
  - {name: Manufacturer, definition: "natural or legal person who develops or manufactures products with digital elements or has them designed, developed or manufactured, and markets them under its name or trademark", attributes: [], locator: "§3.3", kind: stated, tmodel_mapping: "Party (§2b) — producer role", notes: "Other CRA economic operators (importer, distributor) explicitly out of scope."}
  - {name: PwDE, definition: "product with digital elements: software or hardware product and its remote data processing solutions (RDPS), incl. components placed on the market separately", attributes: [name, model, intended_purpose, foreseeable_use, hw_version, sw_version, support_period, category], locator: "§3.2; §4.2 Figure 3", kind: stated, tmodel_mapping: "Product / ProductInstance (§1.1)", notes: ""}
  - {name: PlacedComponent, definition: "hardware and/or software components placed on the market and placed under the control of a user", attributes: [], locator: "§4.2", kind: stated, tmodel_mapping: "Component (§1.1)", notes: ""}
  - {name: RDPS, definition: "remote data processing solution: data processing at a distance designed/developed by or under the responsibility of the manufacturer, whose absence would prevent a function; TR assumes all manufacturer software providing a function to placed components incl. telemetry/advertising", attributes: [essential], locator: "§3.2; §4.2", kind: stated, tmodel_mapping: "Component deployed in a remote Environment (§1.1)", notes: "Configuring third-party software is not development (§4.2)."}
  - {name: ProductCategory, definition: "Default; Important Class I; Important Class II; Critical (Annex III/IV CRA) with conformity routes", attributes: ["value", conformity_routes], locator: "§3.8", kind: stated, tmodel_mapping: "new — classification attribute on Product driving which assessment applies", notes: ""}
  - {name: ConformityAssessmentModule, definition: "NLF modules A (internal control), B+C (EU-type examination + internal production control), H (full quality assurance); EU cybersecurity certification scheme", attributes: [module], locator: "§3.7; §3.8", kind: stated, tmodel_mapping: "new — assessment route (R-042 context)", notes: "Part H of TR-03183 covers Module H."}
  - {name: PresumptionOfConformity, definition: "assumption that a PwDE meeting harmonised standards / common specifications / certification schemes meets the essential requirements", attributes: [basis], locator: "§3.7", kind: stated, tmodel_mapping: "Assertion type (§4) with legal force", notes: "The TR explicitly does NOT provide it (§2)."}
  - {name: EssentialRequirement, definition: "CRA Annex I Part I/II requirement, split by BSI into sub-ids ER.0-ER.14 and VH.1-VH.8a", attributes: [id, cra_reference, text, applicable, justification], locator: "§3.9; Appendix B Tables 8-10", kind: stated, tmodel_mapping: "Requirement (DL-0009) from eu-cra-2024-2847", notes: "Sub-id granularity (ER.4a-d) is finer than the CRA's points."}
  - {name: Control, definition: "unit of the TR: Input (Activity only), Risk (optional), Control statement, Output (Activity only), Target, Assessment Guidance, Implementation Guidance, Compensation, Reference CRA", attributes: [id, type, input, risk, statement, output, target, assessment_guidance, implementation_guidance, compensation, reference_cra], locator: "§4.5", kind: stated, tmodel_mapping: "Requirement + generic Mitigation (§1.3) — a control is both a requirement and a mitigation template", notes: ""}
  - {name: ControlType, definition: "Activity (administrative control with input/output), Mechanism (active technical control), Documentation (generated in the context of the PwDE, not part of it)", attributes: ["value ∈ {Activity, Mechanism, Documentation}"], locator: "§4.6", kind: stated, tmodel_mapping: "R-040 MitigationInstance.kind — process / technical / documentation: exact match", notes: "Strongest primary-source confirmation of R-040's enum in the SDL set."}
  - {name: RiskBasedControl, definition: "control with one or more risk scenarios, a requirement and optional assessment criteria; N/A if the risk does not apply", attributes: [risk_scenarios], locator: "§4.6; §6", kind: stated, tmodel_mapping: "generic Mitigation with applicability predicate", notes: ""}
  - {name: ARC, definition: "Adaptable Risk-based Control: control always accompanied by risk scenarios, selected by matching assets/impact and environment", attributes: [risk_scenarios, control], locator: "§6", kind: stated, tmodel_mapping: "generic Mitigation (§1.3) + selection rule — candidate for R-042 automation", notes: ""}
  - {name: RiskScenario, definition: "Risk Scenario prose; Assets (affected assets and impact); Environment (access restriction, interface restriction, user capabilities)", attributes: [prose, asset_impacts, environment], locator: "§6.1", kind: stated, tmodel_mapping: "new — a ThreatInstance template with matching predicate", notes: ""}
  - {name: RiskProfile, definition: "combined (highest C/I/A impact, union of environments) used to select controls; predefined risk profiles carry preselected controls", attributes: [max_impact, environments, preselected_controls], locator: "§6.3; §6.4", kind: stated, tmodel_mapping: "new — Product-level aggregate (closest: SecurityProgram baseline / profile)", notes: ""}
  - {name: OSCALControlCatalogue, definition: "the TR's machine-readable control set in NIST OSCAL on GitHub (tr-03183/tr-03183-1), access on request", attributes: [], locator: "Chapter 7", kind: stated, tmodel_mapping: "external dataset (import candidate)", notes: "Not obtained."}
  - {name: Evaluator, definition: "performs the assessment; manufacturer staff or third party; knowledgeable, informed, impartial, preferably not involved in development", attributes: [independent], locator: "§4.1", kind: stated, tmodel_mapping: "Party role (reviewer) — Review independence (§5)", notes: ""}
  - {name: Assessment, definition: "evaluation of applicability and fulfilment of every control, at least conceptual, on the PwDE state after reset/setup/update", attributes: [date, level, scope], locator: "§4.2-§4.6", kind: stated, tmodel_mapping: "Review (§4) / deferred audit model (#19)", notes: ""}
  - {name: Verdict, definition: "PASS / FAIL / N/A per control; overall PASS iff all PASS or N/A", attributes: [value, na_reason], locator: "§4.6", kind: stated, tmodel_mapping: "R-042 conformance result", notes: "Explicitly not a CRA compliance statement (§4.7)."}
  - {name: AssessmentReport, definition: "report with date, PwDE identification (incl. SBOM), risk assessment, design documentation, vulnerability handling description/verification, user documentation", attributes: [see messages.yaml], locator: "§4.8", kind: stated, tmodel_mapping: "governed view (R-043) over the KG", notes: "Built to double as CRA Article 31 technical documentation."}
  - {name: TechnicalDocumentation, definition: "CRA Art. 31 / Annex VII documentation incl. risk assessment and SBOM, kept >= 10 years", attributes: [], locator: "§3.6; §4.8", kind: stated, tmodel_mapping: "governed view (R-043)", notes: ""}
  - {name: User, definition: "integrator installing, administrator configuring/maintaining, or end-user using the PwDE; distributor reselling as is is not a user", attributes: [capability], locator: "§4.2 NOTE", kind: stated, tmodel_mapping: "Party role (user)", notes: ""}
  - {name: Asset, definition: "everything worth protecting which is created, processed, stored or otherwise influenced by the PwDE (data, network resources, physical, integrity/function of the PwDE, privacy, safety, health)", attributes: [name, category, base_impact], locator: "§5.2; §5.8.1.1", kind: stated, tmodel_mapping: "Asset (§3)", notes: "Assets outside the PwDE should not be listed (§5.8.1.1.1)."}
  - {name: AssetCategory, definition: "impact-criteria categories: Data (PII.*, BusinessData.*, Other.*), Functional (Functions.*), Security (Security.*) with base C/I/A", attributes: [name, base_C, base_I, base_A, rationale], locator: "§5.14.1 Tables 1-3", kind: stated, tmodel_mapping: "data classification (§1.2) + Asset CIA defaults", notes: "Security assets inherit impact from protected asset (X')."}
  - {name: SecurityAsset, definition: "asset required to protect other assets (secrets, public configuration, logs, mechanisms); impact equals that of the protected asset", attributes: [protects], locator: "§5.14.1; Table 3", kind: stated, tmodel_mapping: "Asset with protects edge — new derivation rule", notes: ""}
  - {name: Threat, definition: "any potential circumstance, event or action that could damage, disrupt or otherwise adversely impact network and information systems ...; no likelihood or impact", attributes: [], locator: "§5.2 (CRA Art. 3)", kind: stated, tmodel_mapping: "ThreatInstance (§1.3)", notes: "Annex C makes threats generic: loss of C/I/A per asset x environment."}
  - {name: GenericThreat, definition: "loss of confidentiality / integrity / availability; event types Attack, Misconfiguration, Failure", attributes: [property, event_type], locator: "Annex C.4; §6.6", kind: stated, tmodel_mapping: "threat category", notes: "Threat naming scheme <AssetCategory>.<Environment>.<Property>[.<Event>]."}
  - {name: Incident, definition: "any event having an actual adverse effect on the security of network and information systems (CRA Art. 3)", attributes: [], locator: "§5.2", kind: stated, tmodel_mapping: "none (operations)", notes: ""}
  - {name: Risk, definition: "potential for loss or disruption caused by an incident, combination of magnitude and likelihood", attributes: [impact, likelihood, evaluation, treatment], locator: "§5.2; §5.9-§5.11", kind: stated, tmodel_mapping: "RiskScore (§3) on ThreatInstance", notes: ""}
  - {name: RiskContext, definition: "intended purpose & foreseeable use, PwDE architecture, decision criteria", attributes: [see messages.yaml], locator: "§5.7", kind: stated, tmodel_mapping: "Product context node (new)", notes: ""}
  - {name: DecisionCriteria, definition: "impact criteria, likelihood criteria, acceptance criteria — tailorable at sector/organisation/product level", attributes: [impact, likelihood, acceptance], locator: "§5.7.3; §5.14", kind: stated, tmodel_mapping: "DEC-003 risk-metric scheme parameters", notes: ""}
  - {name: Environment, definition: "tuple (access restriction, interface restriction, user capability) describing where a component handles an asset; composable and delegable along the supply chain", attributes: [access_restriction, interface_restriction, user_capability], locator: "§5.14.2; §6.2; §6.6; Annex D", kind: stated, tmodel_mapping: "Deployment->Environment (§1.1) + TrustBoundary-like exposure attributes", notes: "Composition: a component expects an environment the integrator must provide or delegate (§6.6, Figure 5)."}
  - {name: ImpactScale, definition: "1 Negligible ... 5 Very high; Impact = BaseImpact * Amplifier", attributes: [], locator: "§5.14.1", kind: stated, tmodel_mapping: "DEC-003 impact axis", notes: ""}
  - {name: AcceptanceCriterion, definition: "six binary rules over impact, attack locality (local/network/misconfiguration) and attacker reach/capability or user capability; or D.2 matrix rule", attributes: [rule], locator: "§5.14.3; Annex D.2", kind: stated, tmodel_mapping: "Gate exit rule / risk acceptance (DEC-009)", notes: ""}
  - {name: SharedRisk, definition: "risk shared with supplier (via CRA compliance or contract) or with user (via guidance within expectations); never fully transferred", attributes: [party, mechanism, due_diligence_actions], locator: "§5.11.3", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation/process + Party edge — new 'shared' state in DEC-009", notes: "FOSS: risk sharing uncommon; may rely on an open-source software steward."}
  - {name: ThirdPartyComponent, definition: "component integrated by the manufacturer, subject to due diligence (CRA Art. 13(5)); vulnerabilities reported to its maintainer, fixes shared", attributes: [maintainer], locator: "§3.6; §5.7.2; §5.11.3.1", kind: stated, tmodel_mapping: "Component supplied_by Party", notes: ""}
  - {name: OpenSourceSteward, definition: "third party providing support for a FOSS component", attributes: [], locator: "§5.11.3.1.1 Note", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: SBOM, definition: "software bill of materials in technical documentation; machine-readable, at least top-level dependencies (CRA)", attributes: [], locator: "§3.6; §4.8; VH.1a", kind: stated, tmodel_mapping: "external SBOM (TR-03183-2)", notes: "Part 2 specifies the SBOM."}
  - {name: SupportPeriod, definition: "period during which the manufacturer handles vulnerabilities; generally at least five years; updates and documentation available >= 10 years", attributes: [start, end], locator: "§3.5; §3.6", kind: stated, tmodel_mapping: "ProductInstance lifecycle (§3b)", notes: ""}
  - {name: Notification, definition: "CRA Art. 14 early warning (24 h), notification (72 h), final report (14 days / one month) to CSIRT + ENISA", attributes: [kind, deadline, content], locator: "§3.6", kind: stated, tmodel_mapping: "none (reporting; deferred)", notes: "Quoted context; Part 3 of TR-03183 covers handling."}
  - {name: UserDocumentation, definition: "[USER_DOCUMENTATION] — guidance documenting shared risks and expected user mitigation; CRA Annex II information", attributes: [], locator: "§5.11.3.2.3; §3.6", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation (R-040)", notes: "[USER_DOCUMENTATION] is a dangling reference to an OSCAL control id."}
edges:
  - {name: manufactures, from: Manufacturer, to: PwDE, cardinality: "1:N", definition: "markets under its name or trademark", locator: "§3.3", kind: stated, tmodel_mapping: "manufactured_by"}
  - {name: composed_of, from: PwDE, to: PlacedComponent, cardinality: "1:N", definition: "placed components", locator: "§4.2", kind: stated, tmodel_mapping: "composed_of (§1.1)"}
  - {name: composed_of, from: PwDE, to: RDPS, cardinality: "1:N", definition: "PwDE includes its RDPS", locator: "§3.2; §4.2", kind: stated, tmodel_mapping: "composed_of"}
  - {name: classified_as, from: PwDE, to: ProductCategory, cardinality: "N:1", definition: "category by core functionality", locator: "§3.8", kind: stated, tmodel_mapping: "attribute"}
  - {name: assessed_via, from: PwDE, to: ConformityAssessmentModule, cardinality: "N:M", definition: "route permitted by category", locator: "§3.8", kind: stated, tmodel_mapping: "new"}
  - {name: has_asset, from: PwDE, to: Asset, cardinality: "1:N", definition: "assets of the PwDE", locator: "RH_RA.1.1.1", kind: stated, tmodel_mapping: "Asset of Product"}
  - {name: categorised_as, from: Asset, to: AssetCategory, cardinality: "N:1", definition: "base impact from category", locator: "§5.14.1; §6.2 step 2", kind: stated, tmodel_mapping: "classification"}
  - {name: protects, from: SecurityAsset, to: Asset, cardinality: "N:M", definition: "security asset's impact equals protected asset's (X')", locator: "§5.14.1", kind: stated, tmodel_mapping: "new derivation edge"}
  - {name: handled_in, from: Asset, to: Environment, cardinality: "N:M", definition: "asset-environment pairing", locator: "§6.2 step 2; Annex C.4", kind: stated, tmodel_mapping: "Asset located_in Environment"}
  - {name: threatens, from: Threat, to: Asset, cardinality: "N:M", definition: "threats to assets and affected components", locator: "RH_RA.1.1.2", kind: stated, tmodel_mapping: "ThreatInstance targets Asset"}
  - {name: affects, from: Threat, to: PlacedComponent, cardinality: "N:M", definition: "potentially affected components", locator: "RH_RA.1.1.2", kind: stated, tmodel_mapping: "ThreatInstance on Component"}
  - {name: results_in, from: Threat, to: Risk, cardinality: "1:N", definition: "identified risks resulting from threats", locator: "§5.8.1.2.4", kind: stated, tmodel_mapping: "RiskScore"}
  - {name: evaluated_by, from: Risk, to: AcceptanceCriterion, cardinality: "N:M", definition: "accept or treat", locator: "RH_RA.1.3", kind: stated, tmodel_mapping: "Gate rule"}
  - {name: treated_by, from: Risk, to: Control, cardinality: "N:M", definition: "selected controls reduce risk to acceptable level", locator: "RH_RT.1.1.1", kind: stated, tmodel_mapping: "MitigationInstance mitigates ThreatInstance (§5)"}
  - {name: shared_with, from: Risk, to: SharedRisk, cardinality: "1:N", definition: "risk sharing with supplier or user", locator: "§5.11.3", kind: stated, tmodel_mapping: "new state/edge"}
  - {name: addresses, from: Control, to: EssentialRequirement, cardinality: "N:M", definition: "Reference CRA; a requirement is applicable iff some selected control addresses it", locator: "§4.5; §5.11.2.1", kind: stated, tmodel_mapping: "R-044 maps_to (applicability-defining)"}
  - {name: justified_non_applicable, from: EssentialRequirement, to: Risk, cardinality: "N:M", definition: "non-applicable ER justified by associated risks", locator: "RH_RT.1.1.2", kind: stated, tmodel_mapping: "new — applicability statement"}
  - {name: has_scenario, from: ARC, to: RiskScenario, cardinality: "1:N", definition: "ARCs are always accompanied by one or more risk scenarios", locator: "§6", kind: stated, tmodel_mapping: "Mitigation applicability"}
  - {name: matches, from: RiskScenario, to: RiskProfile, cardinality: "N:M", definition: "asset impact >= scenario impact AND environment parameter match ('*' any)", locator: "§6.2 step 4", kind: stated, tmodel_mapping: "automatable selection predicate (R-042)"}
  - {name: compensated_by, from: Control, to: Control, cardinality: "N:1", definition: "alternative control if the initial cannot be fulfilled", locator: "§4.5 Compensation", kind: stated, tmodel_mapping: "MitigationInstance alternative"}
  - {name: assesses, from: Evaluator, to: Assessment, cardinality: "1:N", definition: "", locator: "§4.1", kind: stated, tmodel_mapping: "Review by Party"}
  - {name: yields, from: Assessment, to: Verdict, cardinality: "1:N", definition: "per control + overall", locator: "§4.6", kind: stated, tmodel_mapping: "conformance result"}
  - {name: reported_in, from: Assessment, to: AssessmentReport, cardinality: "1:1", definition: "", locator: "§4.8", kind: stated, tmodel_mapping: "governed view"}
  - {name: provides_environment, from: Manufacturer, to: Environment, cardinality: "N:M", definition: "integrator provides the environment a component expects, or delegates the expectation to the next user with description and means", locator: "§6.6 Figure 5", kind: stated, tmodel_mapping: "new — supply-chain assumption/guarantee edge"}
  - {name: maintained_by, from: ThirdPartyComponent, to: OpenSourceSteward, cardinality: "N:1", definition: "steward support", locator: "§5.11.3.1.1", kind: stated, tmodel_mapping: "Party edge"}
  - {name: documents, from: UserDocumentation, to: SharedRisk, cardinality: "1:N", definition: "guidance documenting shared risks and expected user mitigation", locator: "RH_RT.1.2.2", kind: stated, tmodel_mapping: "documentation mitigation"}
gaps:
  - "Applicability statement: EssentialRequirement is applicable iff a selected control addresses it, else justified non-applicable (RH_RT.1.1.2). tmodel's R-042 has no 'non-applicable with justification' outcome distinct from FAIL."
  - "Control-as-template with an applicability predicate (RiskScenario: min impact × environment tuple) — tmodel's generic Mitigation (§1.3) has no machine-evaluable applicability condition."
  - "Environment tuple (access, interface, user capability) and its supply-chain delegation (§6.6 composition) — tmodel Deployment/Environment lacks user-capability and delegation (assumption/guarantee) edges."
  - "Security-asset impact inheritance (X') — needs a protects edge with impact propagation."
  - "Risk sharing as a treatment outcome with a counterparty and due-diligence evidence — DEC-009 lifecycle has mitigated/accepted but not 'shared'."
  - "Product category and conformity route (Module A/B+C/H) on Product — absent from ARCH-0001."
  - "Lifecycle-phase-dependent acceptance (D.2 NOTE: moderate risk acceptable post-market only) — acceptance rules need the §3b LifecyclePhase as an input."
