# §6.5 worked example of ARC selection (verbatim values).
example: "BSI TR-03183-1 §6.5 — ARC selection"
pwde: "A PwDE handling generic PIIs for the consumer market and indoor use with a RDPS operated by the manufacturer. The RDPS stores a huge amount of PII data sets."
components:
  - {name: "placed component", environment: "(Layman, Restricted, External network)", asset: PII.Generic, impact_CIA: "3/2/2"}
  - {name: "RDPS component", environment: "(Skilled, Restricted, External network)", asset: PII.Generic, impact_CIA_base: "3/2/2", amplifier: 1, impact_CIA: "4/3/3"}
control:
  name: "Automatic Update Mechanism (Mechanism)"
  risk_scenario: "The PwDE handles assets with moderate or higher impact which can not be protected if PwDE integrity is lost. The user is a layman not installing updates in regular intervals leaving the PwDE vulnerable to attack via external networks."
  assets: ["C(3)", "I(3)", "A(3)"]
  environment: {access_restriction: "*", interface_restriction: "External network", user_capabilities: "Layman"}
  control: "The update mechanism of the PwDE MUST include an automatic update mechanism able to check for new updates automatically."
expected:
  - {component: "placed component", applies: true, reason: "impact >= 3 over an external network without a skilled user"}
  - {component: "RDPS component", applies: false, reason: "operated in a skilled environment"}
source_inconsistencies:
  - "The RDPS environment is stated as (Skilled, Restricted, External network) but the impact paragraph says 'The RDPS component in the (Layman, Restricted, Network) environment'."
  - "Placed component impact given as 3/2/2 although Table 1 lists PII.Generic as 3/2/3."
  - "'an amplifier of 1' raises 3/2/2 to 4/3/3, i.e. used additively, while §5.14.1 defines Impact = BaseImpact * Amplifier."
