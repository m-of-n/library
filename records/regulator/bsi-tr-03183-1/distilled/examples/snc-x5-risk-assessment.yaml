# Annex C worked example: Simple Network Camera (SNC) X5. Transcribed verbatim (values and labels) from
# .cache/bsi-tr-03183-1.txt Annex C.2-C.8. Figures 6-8 (photo, network architecture, DFD) are images, not reproduced.
example: "BSI TR-03183-1 Annex C — SNC X5"
locator: "Annex C.1-C.8"
risk_context:
  functions: ["capture video and audio data", "store that data on a storage card locally inserted into the camera", "stream that data over a home network to a user device using a web interface or streaming protocol", "be configured and managed via a web interface"]
  operated: ["by unskilled consumers", "in a home network via WLAN and", "indoor in a restricted home environment"]
  not_intended: ["for security applications", "for professional or industrial environments", "for public spaces"]
  interfaces: ["Local card slot", "Wireless network (Wi-Fi): Web interface (HTTP/HTTPS); Streaming protocol (SRTP/RTP)", "Power supply (DC jack - no data transmission)"]
environments:
  - {id: 1, name: "Internal", access_restriction: Restricted, interface_restriction: Physical, user_capability: Layman}
  - {id: 2, name: "Local (SD-Card interface)", access_restriction: Restricted, interface_restriction: Local, user_capability: Layman}
  - {id: 3, name: "Known network (WLAN home network shared with other PwDEs)", access_restriction: Restricted, interface_restriction: "Known Network", user_capability: Layman}
assets_initial:
  - {asset: "Video and audio data", category: PII.Generic, environments: [1, 2, 3], impact_CIA: "3/2/3"}
  - {asset: "Connection data", category: PII.TechnicalNecessary, environments: [1, 3], impact_CIA: "2/1/1"}
  - {asset: "General Configuration data", category: Other.Configuration, environments: [1, 3], impact_CIA: "1/3/1"}
  - {asset: "WPA-Key for WLAN access", category: Security.Secrets.NetworkCredentials, environments: [1, 3], impact_CIA: "4/3/3", note: "Integrity and availability is 3 because both will impact the availability of essential functions (A:3)."}
  - {asset: "WLAN configuration besides WPA-Key", category: "Security.PrivateConfiguration(.Confidentiality)", environments: [1], impact_CIA: "3/3/3", note: "Confidentiality and Integrity is 3 because both will impact the confidentiality of PII.Generic (C:3)."}
  - {asset: "Video and audio capturing function", category: Functions.Essential, environments: [1, 3], impact_CIA: "-/-/3"}
  - {asset: "Web-Interface Configuration", category: Functions.NonEssential, environments: [1, 3], impact_CIA: "-/-/1"}
  - {asset: "Web-Interface Streaming", category: Functions.Essential, environments: [1, 3], impact_CIA: "-/-/3"}
  - {asset: "Streaming Protocol", category: Functions.Essential, environments: [1, 3], impact_CIA: "-/-/3"}
generic_threats:
  data_assets: ["Loss of Confidentiality", "Loss of Integrity", "Loss of Availability"]
  functional_assets: ["Loss of Availability"]
  event_types: ["Attack", "Misconfiguration", "Failure"]
threat_examples:
  - "PII.Generic.Local.Confidentiality"
  - "Security.PrivateConfiguration.KnownNetwork.Integrity"
  - "Function.Essential.KnownNetwork.Availability"
  - "PII.Generic.Local.Confidentiality.Attack"
acceptance_results:   # C.6, against §5.14.3 criteria
  - {scope: "Local threats to data assets with moderate impact", result: "accepted", reason: "mitigated by the local access restriction"}
  - {scope: "Network threats to data assets with moderate impact", result: "might be accepted; not advisable", reason: "network not dedicated, may contain compromised devices"}
  - {scope: "Network threats to assets with high impact (WPA-Key)", result: "not acceptable"}
  - {scope: "Misconfiguration threats", result: "not acceptable", reason: "user is a layman"}
controls_selected:    # C.7
  - "Use of encrypted protocols for the web interface and streaming protocol following the generally acknowledged state of the art (e.g. HTTPS, DTLS-SRTP)"
  - "Authentication for access to the web and streaming interface following the generally acknowledged state of the art (e.g. strong passwords, no default passwords)"
  - "Additional protection of the WPA-Key against information disclosure by storing in the PwDE with exclusive read-only access for the WLAN service and exclusive write-only access for configuration changes via the web interface."
assets_added_after_update:   # C.8
  - {asset: "HTTPS-Private Key", category: Security.Secrets.Confidentiality, environments: [1], impact_CIA: "4/4/3"}
  - {asset: "HTTPS-Public Key", category: Security.PublicConfiguration, environments: [1, 3], impact_CIA: "1/4/3"}
  - {asset: "SRTP-Private Key", category: Security.Secrets.Confidentiality, environments: [1], impact_CIA: "3/3/3"}
  - {asset: "SRTP-Public Key", category: Security.PublicConfiguration, environments: [1, 3], impact_CIA: "1/3/3"}
  - {asset: "User Credentials", category: Security.Secrets, environments: [1, 3], impact_CIA: "3/3/3"}
  - {asset: "HTTPS encryption / Permission System", category: Security.Mechanism, environments: [1, 3], impact_CIA: "-/4/3"}
  - {asset: "SRTP encryption", category: Security.Mechanism, environments: [1, 3], impact_CIA: "-/3/3"}
expected:
  - "Every combination asset x applicable environment x generic threat is a candidate risk (C.4)."
  - "Unaccepted risks are mitigated by the selected controls and re-evaluated in the updated assessment (C.7-C.8)."
source_inconsistencies:
  - "C.3 labels the WLAN configuration Security.PrivateConfiguration.Confidentiality; C.4 uses Security.PrivateConfiguration; Table 3 defines no PrivateConfiguration category (only PublicConfiguration)."
  - "C.3 uses Security.Secrets.NetworkCredentials / Security.Secrets.Confidentiality sub-categories not defined in Table 3."
  - "C.5 note on HTTPS key: 'The WPA-Key has the highest confidentiality impact and will be used to calculate the impact of the HTTPS-keys' but HTTPS-Private Key integrity is given as 4 while the WPA-Key integrity is 3."
