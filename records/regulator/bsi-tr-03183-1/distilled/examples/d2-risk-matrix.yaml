# Annex D.2 risk matrix and acceptance rule, verbatim; plus a check of the D.1 formula as printed.
example: "BSI TR-03183-1 Annex D.2 risk matrix"
scale: {1: "Very Low", 2: "Low", 3: "Moderate", 4: "High", 5: "Very high"}
acceptance_rule: "Every Low and Very Low Risk can be accepted, every other risk has to be treated."
matrix:   # rows Environment 5..1, columns Impact 1..5
  environment_5: [1, 1, 1, 2, 3]
  environment_4: [1, 1, 2, 3, 3]
  environment_3: [2, 2, 3, 4, 4]
  environment_2: [2, 3, 4, 4, 5]
  environment_1: [2, 3, 4, 5, 5]
vectors:
  - {environment: 3, impact: 3, expected_risk: 3, expected_decision: treat}
  - {environment: 5, impact: 4, expected_risk: 2, expected_decision: accept}
  - {environment: 1, impact: 1, expected_risk: 2, expected_decision: accept}
  - {environment: 2, impact: 2, expected_risk: 3, expected_decision: treat}
formula_check:
  printed: "environment = round(1 + interface restrictions * access restriction * user capability) * 4"
  inputs: {interface: "External Network 100%", access: "Non Restricted 100%", user: "Layman 100%"}
  printed_result: 8
  note: "As printed the result is 8 (or 4 for small products), outside the 1-5 Environment rows of D.2; the TR does not say how environment values map to the matrix rows. Recorded as a source defect, not corrected."
