  note: "Digest is of the PDF linked from the resource page. Version History: 1.0 July 12, 2021 (NTIA); 2.0 August 22, 2025 (draft for comment); 2.1 July 29, 2026 (this document). The document says it 'updates and replaces' the NTIA 2021 report (Introduction, p. 4), hence supersedes on ntia-sbom-minimum-elements. Source check 2026-11-04: the content.url returned HTTP 403 (Akamai 'Access Denied') to a direct fetch, so the check read a copy fetched earlier the same day in another worktree of this library; that copy has the recorded digest, so the bytes checked are the bytes recorded. maturity best-practice: the document presents itself as guidance (Guidance at a Glance, p. 2) and says it creates no new requirements (Scope, p. 7)."
