  - id: "cisa-secure-by-design-2023#P3-3"
    normativity: "recommendation"
    verb: "must"
    actor: "software manufacturer (secure by design executive)"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Principle 3 — Demonstrating This Principle item 3 (Empower the secure by design executive.) p. 27"
    text: "Empower the secure by design executive. There is a significant difference between an organization where the technical teams have “executive buy-in,” and those where business leaders personally manage the customer security improvement process using standard business processes. The term “executive buy-in” implies that someone had to sell the idea of a customer safety program rather than it being a top-level business goal. This executive must be empowered to influence product investments to achieve customer security outcomes."
    expects_deliverables:
      - "executive mandate over product investments"
    verification: "documented authority of the executive"
    kind: "stated"
    testable: "partial"
    notes: ""
  - id: "cisa-secure-by-design-2023#P3-4"
    normativity: "recommendation"
    verb: "align / weave (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Principle 3 — Demonstrating This Principle item 4 (Create meaningful internal incentives.) p. 27"
    text: "Create meaningful internal incentives. While being mindful to not create perverse incentives, align reward systems to improve customer security to match other valued behaviors and outcomes. From the secure by design executive to product management, software development, support, sales, legal, and other organizations, weave customer security incentives into hiring, promotions, salaries, bonuses, stock options, and other common processes in the running of the business. For example, when establishing criteria for promoting software developers, include considerations for improving the security of the product along with other criteria like uptime, performance, and feature improvements."
    expects_deliverables:
      - "incentive and promotion criteria including customer security"
    verification: "HR criteria text"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P3-5"
    normativity: "recommendation"
    verb: "create (imperative title)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 3 — Demonstrating This Principle item 5 (Create a secure by design council.) p. 27"
    text: "Create a secure by design council. In some industries, it is common for organizations to create a central quality council, and to embed quality representatives in key divisions or business units. By including both centralized and distributed members, these groups work to improve quality against top level goals while receiving telemetry from deep in the organization. Similarly, a secure by design council would improve security against secure by design goals throughout the organization."
    expects_deliverables:
      - "secure by design council charter"
    verification: "council exists"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P3-6"
    normativity: "recommendation"
    verb: "structure (imperative); should help steer"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Principle 3 — Demonstrating This Principle item 6 (Create and evolve customer councils.) p. 27"
    text: "Create and evolve customer councils. Many software manufacturers have customer councils comprised of customers from different regions, industries, and sizes. These councils can provide a great deal of information about customer successes and challenges in deploying the company’s products. Structure the council agenda with dedicated topics addressing customer safety, even if it is not currently top of mind for the participants. Consider where the customer council reports and how to tap participants for insights into the product’s security as deployed. For example, does the council have a bias towards marketing and sales purposes, or product management? The secure by design executive should help steer these customer interactions and should link them with other elements in this paper, such as field studies."
    expects_deliverables:
      - "customer council agenda with customer-safety topics"
    verification: "council agendas"
    kind: "stated"
    testable: "yes"
    notes: ""
