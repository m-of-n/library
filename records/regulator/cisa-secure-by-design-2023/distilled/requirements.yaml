  - id: "cisa-secure-by-design-2023#TAC-DEF-01"
    normativity: "recommendation"
    verb: "should not; recommend"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Secure by Default Tactics bullet 1 (Eliminate default passwords.) p. 30"
    text: "Eliminate default passwords. Products should not come with default passwords that are universally shared. To eliminate default passwords, the authoring organizations recommend products require administrators to set a strong password during installation and configuration or for the product to ship with a unique, strong password for each device."
    expects_deliverables:
      - "product ships without shared default password"
    verification: "install test: admin must set strong password, or unique per-device password shipped"
    kind: "stated"
    testable: "yes"
    notes: "Restates P1-DEF-1 at tactic level."
  - id: "cisa-secure-by-design-2023#TAC-DEF-02"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "design"
    locator: "Secure by Default Tactics bullet 2 (Mandate multifactor authentication (MFA) for privileged users.) p. 30"
    text: "Mandate multifactor authentication (MFA) for privileged users. We observe that many enterprise deployments are managed by administrators who have not protected their accounts with MFA. Given that administrators are high value targets, products should make MFA opt-out rather than opt-in. Further, the system should regularly prompt the administrator to enroll in MFA until they have successfully enabled it on their account. Netherlands’ NCSC has guidance that parallels CISA’s, visit their Mature Authentication Factsheet for more information."
    expects_deliverables: []
    verification: "test: privileged account without MFA is prompted repeatedly; MFA opt-out not opt-in"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#TAC-DEF-03"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "design"
    locator: "Secure by Default Tactics bullet 3 (Single sign-on (SSO).) p. 30"
    text: "Single sign-on (SSO). IT applications should implement single sign on support via modern open standards. Examples include Security Assertion Markup Language (SAML) or OpenID Connect (OIDC). This capability should be made available by default at no additional cost."
    expects_deliverables: []
    verification: "SSO via SAML/OIDC available by default at no additional cost"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#TAC-DEF-04"
    normativity: "recommendation"
    verb: "provide (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Secure by Default Tactics bullet 4 (Secure Logging.) p. 30"
    text: "Secure Logging. Provide high-quality audit logs to customers at no extra charge or additional configuration. Audit logs are crucial for detecting and escalating potential security incidents. They are also crucial during an investigation of a suspected or confirmed security incident. Consider best practices such as providing easy integration with security information and event management (SIEM) systems with application programming interface (API) access that uses coordinated universal time (UTC), standard time zone formatting, and robust documentation techniques."
    expects_deliverables:
      - "audit logs"
    verification: "audit logs available at no charge without extra configuration; SIEM/API integration in UTC"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#TAC-DEF-05"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Secure by Default Tactics bullet 5 (Software Authorization Profile.) p. 30"
    text: "Software Authorization Profile. Software suppliers should provide recommendations on authorized profile roles and their designated use case. Manufacturers should include a visible warning that notifies customers of an increased risk if they deviate from the recommended profile authorization. For example, medical doctors can view all patient records, but a medical scheduler has limited access to certain information that is required for scheduling appointments."
    expects_deliverables:
      - "recommended authorization profiles"
    verification: "documented role profiles; visible warning on deviation"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#TAC-DEF-06"
    normativity: "recommendation"
    verb: "prioritize (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "design"
    locator: "Secure by Default Tactics bullet 6 (Forward-looking security over backwards compatibility.) p. 30"
    text: "Forward-looking security over backwards compatibility. Too often, backwards-compatible legacy features are included, and often enabled, in products despite causing risks to product security. Prioritize security over backwards compatibility, empowering security teams to remove insecure features even if it means causing breaking changes."
    expects_deliverables: []
    verification: "release notes show insecure legacy features removed despite breaking changes"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#TAC-DEF-07"
    normativity: "recommendation"
    verb: "reduce (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Secure by Default Tactics bullet 7 (Track and reduce “hardening guide” size.) p. 30"
    text: "Track and reduce “hardening guide” size. Reduce the size of “hardening guides” that are included with products and strive to ensure that the size shrinks over time as new versions of the software are released. Integrate components of the “hardening guide” as the default configuration of the product. The authoring organizations recognize that shortened hardening guides result from ongoing partnership with existing customers and include efforts by many product teams, including user experience (UX)."
    expects_deliverables:
      - "hardening guide size metric per release"
    verification: "hardening-guide size decreases release-over-release; guide items folded into defaults"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#TAC-DEF-08"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "design"
    locator: "Secure by Default Tactics bullet 8 (Consider the user experience consequences of security settings.) p. 31"
    text: "Consider the user experience consequences of security settings. Each new setting increases the cognitive burden on end users and should be assessed in conjunction with the business benefit it derives. Ideally, a setting should not exist; instead, the most secure setting should be integrated into the product by default. When configuration is necessary, the default option should be broadly secure against common threats."
    expects_deliverables: []
    verification: "each new setting has a UX/business-benefit assessment; default option secure"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#R-0067"
    normativity: "recommendation"
    verb: "it is important"
    actor: "software manufacturer"
