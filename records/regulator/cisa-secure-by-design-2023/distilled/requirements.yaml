  - id: "cisa-secure-by-design-2023#P1-DEF-1"
    normativity: "recommendation"
    verb: "should (imperative title; \"Making a commitment\")"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Principle 1 — Secure By Default Practices item 1 (Eliminate default passwords.) p. 15"
    text: "Eliminate default passwords. Default passwords continue to be implicated as the cause of many attacks every year. Making a commitment to eliminate this chronic problem will deny easy access to attackers. Similarly, manufacturers should consider what password practices should be implemented, such as minimum password length and disallowing known breached passwords."
    expects_deliverables:
      - "public commitment to eliminate default passwords"
      - "password policy (minimum length, breached-password denylist)"
    verification: "no universally shared default credential in product; published commitment"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P1-DEF-2"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "verification"
    locator: "Principle 1 — Secure By Default Practices item 2 (Conduct field tests.) p. 15"
    text: "Conduct field tests. As technology continues to evolve and become more complex, it is increasingly important for software manufacturers to conduct security-centric user testing to understand their products’ security posture in the field. Similar to how user research informs software development requirements, software manufacturers should also conduct security-focused user research to understand where the security user experience (UX) falls short. By observing how customers deploy and use their products in real-world environments, software manufacturers can gain valuable insights into the usability and effectiveness of their security features and controls. These insights can help identify areas for improvement and refine their products to better meet the security needs of customers. For example, field tests might suggest changes in UX flow, defaults, alerting, and monitoring. Field tests may also show where past improvements in the product’s design reduce the velocity of security patches, reduce configuration errors, and minimize attack surface. Manufacturers should consider the following: Do customers correctly implement the hardening guide? Do the product’s existing security features perform as expected in the field? Do those features actually resist real-world attacks? Which features would better reduce the likelihood of compromise? Note: To gain deeper insights into these elements, software manufacturers may wish to partner with customers to conduct red team exercises to see how the product resists attacks. These field tests might take place at the customer’s physical site, virtually, or via telemetry from the application in a privacy-preserving manner."
    expects_deliverables:
      - "field test / security user-research report"
    verification: "field-test reports answering the four listed questions"
    kind: "stated"
    testable: "yes"
    notes: "Item contains the four field-test questions and a note permitting red-team partnership (may wish to)."
  - id: "cisa-secure-by-design-2023#P1-DEF-3"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "release"
    locator: "Principle 1 — Secure By Default Practices item 3 (Reduce hardening guide size.) p. 15"
    text: "Reduce hardening guide size. Manufacturers can improve customers’ security postures by streamlining or even eliminating product hardening guides and focusing on the most critical security measures that customers should prioritize when deploying their products. Rather than overwhelming customers with a laundry list of security measures, manufacturers should identify the top security risks that their products are susceptible to and provide clear and concise guidance on how to mitigate these risks. In addition, manufacturers should provide customers with tools and automation that simplify the process of implementing security controls, such as scripts that can easily be deployed in their environment. These tools should additionally be able to verify and clearly show the changes made from the original baseline. By streamlining hardening guides and providing customers with easy-to-use tools and automation, manufacturers can reduce the burden on their customers and help ensure that their products are deployed in a secure manner. One tactic would be to consider implementing the Pareto principle to reduce the number of steps for the common use cases (the 80%), and then providing contextual guidance and tooling for less common scenarios (the 20%). In this way, software manufacturers will be making the simple things simple, and the hard things possible. Field testing will be a powerful tool in measuring how long it takes customers to discover, understand, and implement hardening guides. Manufacturers should consider how the product could nudge administrators to take action within the product itself rather than relying on them to implement tasks from a hardening guide."
    expects_deliverables:
      - "shortened hardening guide"
      - "hardening automation scripts that show diff from baseline"
    verification: "hardening-guide size tracked over versions; tooling verifies and shows changes from baseline"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P1-DEF-4"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "operations/response"
    locator: "Principle 1 — Secure By Default Practices item 4 (Actively discourage use of unsafe legacy features.) p. 16"
    text: "Actively discourage use of unsafe legacy features. Prioritize security through clear upgrade paths over backwards compatibility. Publish blog posts showing the adoption of safer features and protocols, and deprecate unsafe features by announcement, possibly from within the product itself. A significant number of customers have demonstrated that they will not keep their systems current with modern network, identity, and other critical security features. In some cases, customers fear existing functionality will break with an upgrade. By making upgrades as seamless as possible, customers will likely upgrade and get security fixes more often and quickly. Software manufacturers should aggressively nudge customers along upgrade paths that reduce customer risk."
    expects_deliverables:
      - "deprecation announcements"
      - "blog posts on adoption of safer features"
    verification: "published deprecation notices; upgrade paths documented"
    kind: "stated"
    testable: "partial"
    notes: ""
  - id: "cisa-secure-by-design-2023#P1-DEF-5"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer (product feature)"
    condition: "unconditional"
    nature: "process"
    phase: "design"
    locator: "Principle 1 — Secure By Default Practices item 5 (Implement attention grabbing alerts.) p. 16"
    text: "Implement attention grabbing alerts. Similar to seat belt chimes in cars that continuously make noise when seat belts are not fastened, manufacturers should implement timely and repeated alerts when users or admins are in truly unsafe states, warning administrators that they are using deprecated protocols in their environments and suggest upgrade paths. Implement timely and repeated alerting when users or admins, or the application configuration, are in an unsafe state. Make the unsafe mode clear to the administrators on a regular basis. An additional feature could require a super administrator to acknowledge the lack of MFA on their account upon each login, or even disable certain key features until they enable MFA. There is room to innovate to achieve these goals while not creating alert fatigue."
    expects_deliverables: []
    verification: "test: unsafe state (deprecated protocol, admin without MFA) triggers timely repeated alert"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P1-DEF-6"
    normativity: "recommendation"
    verb: "create (imperative title)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Principle 1 — Secure By Default Practices item 6 (Create secure configuration templates.) p. 16"
    text: "Create secure configuration templates. These templates can pre-set certain configurations to safe settings based on an organization’s risk appetite. While it might be overly simplistic to have low/medium/high security templates, that example illustrates how many settings could be updated to manage risk for the organization. Templates can be supported by hardening guides on the risks the manufacturer has identified."
    expects_deliverables:
      - "secure configuration templates"
    verification: "templates shipped with product"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P1-DEV-1"
    normativity: "recommendation"
    verb: "consider (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 1 — Secure Product Development Practices item 1 (Document conformance to a secure SDLC framework.) p. 17"
    text: "Document conformance to a secure SDLC framework. Secure SDLC frameworks provide objectives and examples across people, processes, and technologies. Consider publishing a detailed description of which secure SDLC framework controls have been implemented and describe any alternate controls which have been used. Within the US, consider using the NIST Secure Software Development Framework (SSDF). While not a checklist, the SSDF “describes a set of fundamental, sound practices for secure software development.”"
    expects_deliverables:
      - "published description of implemented secure-SDLC framework controls and alternate controls"
    verification: "publication exists and names framework (e.g. SSDF) controls"
    kind: "stated"
    testable: "yes"
    maps_to:
      - "sp-800-218"
    notes: ""
  - id: "cisa-secure-by-design-2023#P1-DEV-2"
    normativity: "recommendation"
    verb: "should consider"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 1 — Secure Product Development Practices item 2 (Document Cybersecurity Performance Goals (CPG) or equivalent conformance.) p. 17"
    text: "Document Cybersecurity Performance Goals (CPG) or equivalent conformance. When an organization attests that they conform to the NIST SSDF standard, they are asserting that their SDLC is informed by well-understood best practices. However, it is not sufficient for them to only have a robust SDLC. They also need to protect their own enterprise and development environments from malicious actors who would seek to manipulate the security properties of the product while it is still in development. This is not a theoretical class of attack, but one that has been carried out with adverse effects to customers, and by extension national security. Organizations should consider publishing details on the organization’s conformance to the CISA CPGs, the NIST Cybersecurity Framework (CSF), or other cybersecurity program frameworks."
    expects_deliverables:
      - "published conformance to CISA CPGs / NIST CSF / other programme framework"
    verification: "publication exists"
    kind: "stated"
    testable: "yes"
    notes: "Source names CISA CPGs and NIST CSF; neither is a library record yet."
  - id: "cisa-secure-by-design-2023#P1-DEV-3"
    normativity: "recommendation"
    verb: "descriptive (mature programmes ...)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "operations/response"
    locator: "Principle 1 — Secure Product Development Practices item 3 (Vulnerability management.) p. 17"
    text: "Vulnerability management. Some manufacturers have a vulnerability management program that focuses on patching vulnerabilities discovered internally or externally, and little more. More mature programs incorporate extensive data-driven analysis of vulnerabilities and their root causes, taking steps to systemically eliminate entire classes of vulnerability. They implement formal programs around setting quality planning, quality control, quality improvement, and quality measurement. They view defect management as a business matter, not merely a security matter. These programs are not dissimilar in some ways to quality and safety programs in other industries."
    expects_deliverables:
      - "vulnerability root-cause analysis records"
      - "quality planning/control/improvement/measurement programme"
    verification: "RCA records; class-elimination actions"
    kind: "stated"
    testable: "partial"
    maps_to:
      - "sp-800-218#PO.1.2"
    notes: "Footnote 3 cites NIST SSDF PO.1.2 Example 2 verbatim; normativity carried by describing what \"more mature programs\" do."
  - id: "cisa-secure-by-design-2023#P1-DEV-4"
    normativity: "recommendation"
    verb: "be responsible (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "supply-chain"
    locator: "Principle 1 — Secure Product Development Practices item 4 (Responsibly use open source software.) p. 17"
    text: "Responsibly use open source software. When open source software is used, be responsible by vetting open source packages, fostering code contributions back to dependencies, and helping sustain the development and maintenance of critical components. For reference, Japan’s Ministry of Economy, Trade, and Industry (METI) has published \"Collection of Use Case Examples Regarding Management Methods for Utilizing OSS and Ensuring Its Security.\""
    expects_deliverables:
      - "open-source vetting records"
      - "upstream contribution records"
    verification: "OSS intake/vetting process; contribution evidence"
    kind: "stated"
    testable: "partial"
    notes: ""
  - id: "cisa-secure-by-design-2023#P1-DEV-5"
    normativity: "recommendation"
    verb: "make / ensure (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "implementation"
    locator: "Principle 1 — Secure Product Development Practices item 5 (Provide secure defaults for developers.) p. 17"
    text: "Provide secure defaults for developers. Make the default route during software development the secure one by providing safe building blocks for developers. For example, given the prevalence of SQL injection vulnerabilities causing real-world harm, ensure that developers use a well-maintained library to prevent that class of vulnerability. Also known as “paved roads” or “well-lit paths,” this practice ensures both speed and security, and reduces human error."
    expects_deliverables:
      - "paved-road secure libraries/frameworks"
    verification: "developers use maintained library preventing e.g. SQL injection"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P1-DEV-6"
    normativity: "recommendation"
    verb: "ensure (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "training"
