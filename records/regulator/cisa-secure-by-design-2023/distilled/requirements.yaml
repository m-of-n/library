reconciliation: "Not a BCP 14 document: bin/bcp14-count finds 0 uppercase keywords, so both BCP 14 counts are 0. Its normative register is lowercase should / recommend / urge / encourage / must / need to and imperative practice titles. Own-form reconciliation (source -> extracted): should 114->111 (excluded 3: the reported EU CRA sentence p. 4, the framing clause 'In addition to actions software manufacturers should take' p. 7, and the p. 13 pull-quote that repeats R-0041 verbatim); must 8->4 (excluded 4 non-obligations: 'applications must have default settings' p. 12, 'customers must implement at their own expense' p. 13, 'every software manufacturer must learn' p. 21, and the Foreign Affairs article title in Resources); recommend* 18->10 (excluded 8 nouns: 2 banner headings, 2 table-of-contents rows, 'provide the recommendations in this guide' p. 5, 'The Recommendations for Software Manufacturers section' p. 8, 'provides recommendations' p. 9, Disclaimer 'recommendation' p. 34); may 23->12 (excluded 11 epistemic 'may' = possibility, not permission); urge* 5->5; encourage* 11->9 (excluded 2 descriptive: 'which can encourage and enable' p. 7, 'to encourage customers to stay current' p. 12); need(s) to 7 in pdftotext (9 in the de-hyphenated capture) ->6 (excluded 3 non-obligations: industry belief p. 6, 'we need to create a secure by demand culture' p. 7, 'customers need to research' p. 13)."
