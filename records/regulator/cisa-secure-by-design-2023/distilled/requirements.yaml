    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 2 — Secure Product Development Practices item 3 (Publish detailed secure SDLC self-attestations.) p. 23"
    text: "Publish detailed secure SDLC self-attestations. Manufacturers following NIST SSDF or other similar frameworks are actively working towards a mature software development lifecycle. Publishing a self-attestation of which controls the manufacturer has enacted, and for which products, would demonstrate a commitment to adhering to these best practices and provide an increased level of confidence to their customers. Other certification schemes include the Israel Cyber Supply Chain Methodology, for instance."
    expects_deliverables:
      - "published secure-SDLC self-attestation per product and control"
    verification: "self-attestation published, listing controls and products"
    kind: "stated"
    testable: "yes"
    maps_to:
