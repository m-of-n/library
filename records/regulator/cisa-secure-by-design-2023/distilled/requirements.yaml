  - id: "cisa-secure-by-design-2023#TAC-SBD-06"
    normativity: "recommendation"
    verb: "imperative; should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "verification"
    locator: "Secure by Design Tactics bullet 6 (Static and dynamic application security testing (SAST/DAST) (SSDF PW.7.2, PW.8.2).) p. 28"
    text: "Static and dynamic application security testing (SAST/DAST) (SSDF PW.7.2, PW.8.2). Use these tools to analyze product source code and application behavior to detect error-prone practices. These tools cover issues ranging from improper management of memory to error prone database query construction (e.g., unescaped user input leading to SQL injection). SAST and DAST tools can be incorporated into development processes and run automatically as part of software development. SAST and DAST should complement other types of testing, such as unit testing and integration testing, to ensure products comply with expected security requirements. When issues are identified, manufacturers should perform root-cause analysis to systemically address vulnerabilities."
    expects_deliverables:
      - "SAST/DAST results"
      - "root-cause analyses"
    verification: "SAST/DAST run automatically in pipeline; RCA for findings"
    kind: "stated"
    testable: "yes"
    maps_to:
      - "sp-800-218#PW.7.2"
      - "sp-800-218#PW.8.2"
    notes: "SSDF task ids are the source's own mapping (printed in the bullet title)."
