    notes: ""
  - id: "cisa-secure-by-design-2023#P3-2"
    normativity: "recommendation"
    verb: "provide (imperative); should request"
    actor: "software manufacturer / board of directors"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 3 — Demonstrating This Principle item 2 (Provide regular reports to your board of directors.) p. 27"
    text: "Provide regular reports to your board of directors. Chief information security officer (CISO) reports to corporate boards usually include information about current and planned security programs, threats, suspected and confirmed security incidents, and other updates centered on the security posture and health of the company. In addition to receiving information about the security posture of the enterprise, boards should request information about product security and the impact it has on customer security. Boards should not look solely to the CISO, but primarily to other members of company management to drive customer risk down."
    expects_deliverables:
      - "regular board reports on product security and customer impact"
    verification: "board reporting records"
