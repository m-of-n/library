  - id: "cisa-secure-by-design-2023#P1-BIZ-1"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer (cloud service / on-premises product)"
    condition: "unconditional"
    nature: "process"
    phase: "operations/response"
    locator: "Principle 1 — Pro-Security Business Practices item 1 (Provide logging at no additional charge.) p. 19"
    text: "Provide logging at no additional charge. Cloud services should commit to generating and storing security-related logs at no additional charge. On-premises products should likewise generate security-related logs at no additional charge. Further, the product should log security events by default since many customers may not understand their value until after an incident. These tactics may require a thorough review of what security events should be logged to provide cybersecurity state awareness, how a customer may configure logging, for what time period logs are retained, how log integrity and storage are protected, and how logs can be analyzed. In some cases, the review may suggest the need for a refactoring of the application’s log management architecture to help make them actionable and at a cost that works for the manufacturer. Working with incident response (IR) experts can increase the chances that the logs will be useful to investigators in the field. See the section on SIEMs."
    expects_deliverables:
      - "security logs generated/stored at no additional charge"
      - "logging review"
    verification: "pricing and default config: security events logged by default at no charge"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P1-BIZ-2"
    normativity: "recommendation"
    verb: "publish (imperative); should not"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 1 — Pro-Security Business Practices item 2 (Eliminate hidden taxes.) p. 19"
    text: "Eliminate hidden taxes. Publish a commitment to never charge for security or privacy features or integrations. For example, within the larger scope of identity and access management (IAM), there are services called single sign-on (SSO) services. Some manufacturers charge more to connect their system to a SSO service (sometimes referred to as an identity provider). This “SSO tax” means that good identity and access management is out of reach for many SMOs, preventing them from achieving a strong security posture. Some services charge more to enable MFA for users. Security should not be priced as a luxury good but considered a customer right. Some manufacturers have argued that few customers request these features, and they cost more to maintain. These arguments ignore the fact that few customers will call to complain or bargain, not all customers actually understand what the benefits of these features are, and that all features cost something to maintain. Yet we do not see many manufacturers charging extra for availability or data integrity. The costs to support those key attributes are built into the price all customers pay, much like the costs to include seatbelts, collapsible steering columns, and airbags that save lives in accidents."
    expects_deliverables:
      - "public commitment never to charge for security/privacy features or integrations"
    verification: "published commitment; SSO/MFA not behind paid tier"
    kind: "stated"
    testable: "yes"
    notes: ""
