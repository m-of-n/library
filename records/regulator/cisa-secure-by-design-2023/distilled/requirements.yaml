    condition: "unconditional"
    nature: "process"
    phase: "requirements"
    locator: "Principle 1 — Explanation p. 11"
    text: "Applications need to support application features that relate to cybersecurity."
    expects_deliverables: []
    verification: "feature inventory"
    kind: "stated"
    testable: "partial"
