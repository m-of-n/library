  - id: "cisa-secure-by-design-2023#TAC-SBD-09"
    normativity: "recommendation"
    verb: "imperative; should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "operations/response"
    locator: "Secure by Design Tactics bullet 9 (Vulnerability disclosure programs (SSDF RV.1.3).) p. 29"
    text: "Vulnerability disclosure programs (SSDF RV.1.3). Establish vulnerability disclosure programs that allow security researchers to report vulnerabilities and receive legal safe harbor in doing so. As part of this, suppliers should establish processes to determine root causes of discovered vulnerabilities. Such processes should include determining whether adopting any of the secure by design practices in this document (or other similar practices) would have prevented the introduction of the vulnerability."
    expects_deliverables:
      - "vulnerability disclosure programme"
      - "root-cause determination process"
    verification: "VDP with safe harbor; RCA includes whether a SbD practice would have prevented it"
    kind: "stated"
