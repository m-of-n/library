    notes: ""
  - id: "cisa-secure-by-design-2023#P2-DEV-2"
    normativity: "recommendation"
    verb: "publish (imperative); should cover"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Principle 2 — Secure Product Development Practices item 2 (Publish high-level threat models.) p. 23"
    text: "Publish high-level threat models. Secure by design products start with written threat models that describe what the creators are trying to protect and from whom. Effective threat models are informed by the way intrusions happen in the wild, and should cover both the enterprise and development environments, as well as the way the software manufacturers intend for it to be used in customer environments."
    expects_deliverables:
      - "published high-level threat model (enterprise, development and customer environments)"
    verification: "published threat model covers the three environments"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P2-DEV-3"
    normativity: "recommendation"
