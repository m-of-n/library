    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "design"
    locator: "Principle 1 — Explanation p. 11"
    text: "The idea is that security must be “baked in,” and not “bolted on.”"
    expects_deliverables: []
    verification: "no defined check"
    kind: "stated"
    testable: "no"
