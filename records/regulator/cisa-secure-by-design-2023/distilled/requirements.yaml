  - id: "cisa-secure-by-design-2023#SDEF-1"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Secure by Default p. 9"
    text: "A secure configuration should be the default baseline. Secure by default products automatically enable the most important security controls needed to protect enterprises from malicious cyber actors, as well as supply the ability to use and further configure security controls at no additional cost."
    expects_deliverables:
      - "secure default configuration baseline"
    verification: "out-of-box configuration inspection: most important controls enabled at no additional cost"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#SDEF-2"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "design"
    locator: "Secure by Default p. 9"
    text: "The complexity of security configuration should not be a customer problem. Organizational IT staff are frequently overloaded with security and operational responsibilities, thus resulting in limited time to understand and implement the security implications and mitigations required for a robust cybersecurity posture. Manufacturers can aid their customers by optimizing secure product configuration—securing the “default path”—ensuring their products are manufactured, distributed, and used securely in accordance with “secure by default” standards."
    expects_deliverables: []
    verification: "usability / configuration-effort review of the default path"
    kind: "stated"
    testable: "partial"
    notes: ""
  - id: "cisa-secure-by-design-2023#R-0018"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Secure by Default (pull-quote) p. 9"
    text: "Security should not be a luxury option, but should be considered a right customers receive without negotiating or paying more."
    expects_deliverables: []
    verification: "price list: no security feature behind a paid tier"
    kind: "stated"
    testable: "yes"
    notes: "pull-quote"
