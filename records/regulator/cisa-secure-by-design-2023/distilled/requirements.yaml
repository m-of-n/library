  - id: "cisa-secure-by-design-2023#P2-DEV-4"
    normativity: "recommendation"
    verb: "publish (imperative); should publish"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "operations/response"
    locator: "Principle 2 — Secure Product Development Practices item 4 (Embrace vulnerability transparency.) p. 23"
    text: "Embrace vulnerability transparency. Publish a commitment that will ensure that identified product vulnerabilities will be published as CVE entries that are correct and complete. That’s especially true for the common weakness enumeration field that identifies the root cause of the vulnerabilities. The more correct and complete the public CVE database is, the more the industry can track how products are becoming more secure, and which classes of vulnerabilities are most prevalent. However, beware of the temptation to count CVEs as a negative metric, since such numbers are also a sign of a healthy code analysis and testing community. As manufacturers implement a secure by design philosophy, it’s possible that at first their raw CVE count will go up due to more comprehensive discovery and remediation of vulnerabilities in existing code. Manufacturers should publish analysis of past vulnerabilities, including any patterns and measures that were taken to address the entire class of vulnerabilities. For example, if a large percentage of a company’s CVEs were related to cross-site scripting (XSS), documenting the root cause analysis, response (such as shifting to web template frameworks that prevent XSS), and results would signal to customers that they will not be victimized by a class of vulnerability for which mitigations have been understood for decades."
    expects_deliverables:
      - "commitment to correct and complete CVE records incl. CWE"
      - "analysis of past vulnerabilities and class-level measures"
    verification: "CVE records carry CWE; published RCA analysis"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P2-DEV-5"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "supply-chain"
    locator: "Principle 2 — Secure Product Development Practices item 5 (Publish Software Bills of Materials (SBOMs).) p. 23"
    text: "Publish Software Bills of Materials (SBOMs). Manufacturers should have command of their supply chains. Organizations should build and maintain SBOMs [2] for each product, request data from their suppliers, and make SBOMs available for downstream customers and users. This will help demonstrate their diligence in understanding the components they use in the creation of their products, their ability to respond to newly identified risks, and can help customers understand how to respond if one of the modules in the supply chain has a newly found vulnerability. For reference, Japan’s Ministry of Economy, Trade, and Industry (METI) has published “Guide of Introduction of Software Bill of Materials (SBOM) for Software Management.” Transparency should extend to firmware in embedded devices and the data and models used in AI/machine learning (ML). Beyond assisting in purchasing decisions and operational capabilities, SBOMs play an important role in the infrastructure to detect and respond to malicious supply chain attacks."
    expects_deliverables:
      - "SBOM per product"
      - "supplier SBOM data"
    verification: "SBOM available for each product to downstream customers"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P2-DEV-6"
    normativity: "recommendation"
    verb: "publish (imperative); should perform"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "operations/response"
    locator: "Principle 2 — Secure Product Development Practices item 6 (Publish a vulnerability disclosure policy.) p. 24"
    text: "Publish a vulnerability disclosure policy. Publish a vulnerability disclosure policy that (1) authorizes testing against all products offered by the manufacturer and conditions for those tests, (2) provides legal safe harbor for actions performed consistent with the policy, and (3) allows public disclosure of vulnerabilities after a set timeline. Manufacturers should perform root-cause analysis of discovered vulnerabilities and, to the greatest extent feasible, take actions to eliminate entire vulnerability classes. See CISA’s Vulnerability Disclosure Policy Template for reference language."
    expects_deliverables:
      - "vulnerability disclosure policy (scope, safe harbor, disclosure timeline)"
      - "root-cause analyses"
    verification: "VDP text contains the three listed elements"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P2-BIZ-1"
    normativity: "recommendation"
    verb: "publicly name (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 2 — Pro-Security Business Practices item 1 (Publicly name a secure by design senior executive sponsor.) p. 25"
    text: "Publicly name a secure by design senior executive sponsor. In many organizations, security (like quality) is delegated to technical teams who have limited ability to make structural changes to dramatically improve the security of the products. Publicly naming a top business executive to oversee the secure by design program will transform the security of products into a top-level business concern."
    expects_deliverables:
      - "public naming of secure-by-design senior executive sponsor"
    verification: "public statement names executive"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P2-BIZ-2"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 2 — Pro-Security Business Practices item 2 (Publish a secure by design roadmap.) p. 25"
    text: "Publish a secure by design roadmap. Manufacturers should document changes made to their SDLC to improve customer security, including details about field-test reports, actions taken to eliminate entire classes of vulnerability, and other items listed in the other principles. As in the case of quality improvement efforts, security improvement programs have distinct phases of planning, control, and improvement. In the spirit of showing rather than telling, publishing the roadmap and the details behind these phases will build confidence that the products are secure by design. After achieving meaningful progress, manufacturers can detail them in transparency reports. Doing so not only demonstrates a commitment to secure by design principles but can inspire others to adopt similar programs by showing an existence proof."
    expects_deliverables:
      - "published secure-by-design roadmap"
      - "transparency reports"
    verification: "roadmap published with planning/control/improvement phases"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#P2-BIZ-3"
    normativity: "recommendation"
    verb: "publish (imperative title)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 2 — Pro-Security Business Practices item 3 (Publish a memory-safety roadmap.) p. 25"
    text: "Publish a memory-safety roadmap. Manufacturers can take steps to eliminate one of the largest classes of vulnerability by migrating existing products and building new products using memory safe languages. While this may not be possible in all cases, manufacturers can consider developing application wrappers in memory safe languages instead of re-writing entire applications. This can also include how manufacturers are updating hiring, training, code review, and other internal processes, as well as ways they are helping the open source community do the same."
    expects_deliverables:
      - "published memory-safety roadmap"
    verification: "roadmap published"
    kind: "stated"
    testable: "yes"
    notes: ""
