  - id: "cisa-secure-by-design-2023#P3-1"
    normativity: "recommendation"
    verb: "add (imperative)"
    actor: "software manufacturer"
    condition: "manufacturer is a publicly traded company"
    nature: "deliverable"
    phase: "governance"
    locator: "Principle 3 — Demonstrating This Principle item 1 (Include details of a secure by design program in corporate financial reports.) p. 27"
    text: "Include details of a secure by design program in corporate financial reports. If the manufacturer is a publicly traded company, add a section in each annual report devoted to secure by design efforts. It is common for automobile annual financial reports to include sections on driver and passenger safety, including information about centralized and distributed quality and safety committees. Detailing the secure by design program in a financial report will demonstrate that the organization is linking customer security and corporate financial outcomes and not simply adopting a term in marketing materials because it is in vogue."
    expects_deliverables:
      - "secure-by-design section in each annual report"
    verification: "annual report section exists"
    kind: "stated"
