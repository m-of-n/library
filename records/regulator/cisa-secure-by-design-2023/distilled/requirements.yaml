    phase: "governance"
    locator: "Principle 2 — Secure Product Development Practices item 1 (Establish internal security controls.) p. 23"
    text: "Establish internal security controls. Many companies have seen the benefits of moving their data to cloud providers. Now those cloud providers become the target of attackers. Software as a Service (SaaS) providers should publish statistics of their internal controls. For example, SaaS providers should publish statistics on their internal deployment of phishing-resistant MFA, like Fast Identity Online (FIDO) authentication. Ideally, they should be able to say that no staff member can access customer or other sensitive data without authenticating via phishing-resistant MFA."
    expects_deliverables:
      - "statistics on internal controls incl. phishing-resistant MFA deployment"
    verification: "published statistics"
