  - id: "cisa-secure-by-design-2023#TAC-SBD-01"
    normativity: "recommendation"
    verb: "imperative; should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "implementation"
    locator: "Secure by Design Tactics bullet 1 (Memory safe programming languages (SSDF PW.6.1).) p. 28"
    text: "Memory safe programming languages (SSDF PW.6.1). Prioritize the use of memory safe languages wherever possible. The authoring organizations acknowledge that memory specific mitigations may be helpful shorter-term tactics for legacy codebases. Examples include C/C++ language improvements, hardware mitigations, address space layout randomization (ASLR), control-flow integrity (CFI), and fuzzing. Nevertheless, there is a growing consensus that adoption of memory safe programming languages can eliminate this class of defect, and software manufacturers should explore ways to adopt them. Some examples of modern memory safe languages include C#, Rust, Ruby, Java, Go, and Swift. Read NSA’s memory safety information sheet for more."
    expects_deliverables:
      - "memory-safe language adoption plan"
    verification: "language inventory shows memory-safe languages prioritised; legacy mitigations (ASLR, CFI, fuzzing) documented"
    kind: "stated"
    testable: "yes"
    maps_to:
      - "sp-800-218#PW.6.1"
    notes: "SSDF task ids are the source's own mapping (printed in the bullet title)."
  - id: "cisa-secure-by-design-2023#TAC-SBD-02"
    normativity: "recommendation"
    verb: "imperative"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Secure by Design Tactics bullet 2 (Secure Hardware Foundation.) p. 28"
    text: "Secure Hardware Foundation. Incorporate architectural features that enable fine- grained memory protection, such as those described by Capability Hardware Enhanced RISC Instructions (CHERI) that can extend conventional hardware Instruction-Set Architectures (ISAs), as well as other features like Trusted Platform Modules and Hardware Security Modules. For more information visit, University of Cambridge’s CHERI webpage."
    expects_deliverables:
      - "hardware security architecture (CHERI, TPM, HSM)"
    verification: "architecture uses fine-grained memory protection / TPM / HSM"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#TAC-SBD-03"
