note: "Text is verbatim from .cache/cisa-secure-by-design-2023.md, which restores the ligatures (ft/tt/ff/fi) and full stops that the PDF text layer drops (see the capture header). One entry per practice / tactic item (native ids: P1..P3 principles; OPS-n operational tactics p. 11; P1-DEF/DEV/BIZ-n and P2-DEF/DEV/BIZ-n = Principle 1/2 Demonstrating items under SECURE BY DEFAULT PRACTICES / SECURE PRODUCT DEVELOPMENT PRACTICES / PRO-SECURITY BUSINESS PRACTICES; P3-n Principle 3 Demonstrating items; TAC-SBD-nn Secure by Design Tactics bullets; TAC-DEF-nn Secure by Default Tactics bullets; SDEF-n Secure by Default definition bullets p. 9; CUST-nn customer recommendations, one per sentence; R-nnnn narrative recommendation sentences). Item texts keep every sentence of the item, so an item carries several modal verbs. The document is guidance ('does not automatically serve as a regulatory document', Disclaimer): every entry is a recommendation in force, not a requirement. maps_to holds ONLY the SSDF task ids the source prints (Secure by Design Tactics bullets; footnote 3 PO.1.2; P1-DEV-1 / P2-DEV-3 name the SSDF as a whole). actor/nature/phase/expects_deliverables/verification/testable are derived and need human review."
