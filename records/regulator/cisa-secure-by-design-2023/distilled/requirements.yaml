  - id: "cisa-secure-by-design-2023#R-0024"
    normativity: "recommendation"
    verb: "sample tactics include"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "implementation"
    locator: "Principle 1 — Explanation p. 11"
    text: "Sample tactics include ensuring user input is validated and sanitized, and is not entered directly into code (i.e., by using parameterized queries instead), using a memory safe programming language, using rigorous software development life cycle (SDLC) management, and using hardware-backed cryptographic key management."
    expects_deliverables: []
    verification: "code review / SAST for parameterized queries; language inventory; key-management design"
    kind: "stated"
    testable: "yes"
    notes: "Listed as sample tactics of application hardening; no modal verb, recorded because each tactic recurs as a demonstration/tactic item."
