    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Software Product Security Principles p. 10"
    text: "Software manufacturers are encouraged to adopt a strategic focus that prioritizes software security."
    expects_deliverables: []
