  - id: "cisa-secure-by-design-2023#P1"
    normativity: "principle"
    verb: "principle (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Software Product Security Principles — Principle 1 p. 10"
    text: "Take ownership of customer security outcomes and evolve products accordingly. The burden of security should not fall solely on the customer."
    expects_deliverables: []
    verification: "demonstrated through the Principle 1 \"Demonstrating This Principle\" artifacts"
    kind: "stated"
    testable: "no"
    notes: "One of the three core principles; the operative practices are its demonstration items."
  - id: "cisa-secure-by-design-2023#P2"
    normativity: "principle"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Software Product Security Principles — Principle 2 p. 10"
    text: "Embrace radical transparency and accountability. Software manufacturers should pride themselves in delivering safe and secure products, as well as differentiating themselves from the rest of the manufacturer community based on their ability to do so. This may include sharing information they learn from their customer deployments, such as the uptake of strong authentication mechanisms by default. It also includes a strong commitment to ensure vulnerability advisories and associated common vulnerability and exposure (CVE) records are complete and accurate. However, beware of the temptation to count CVEs as a negative metric, since such numbers are also a sign of a healthy code analysis and testing community."
    expects_deliverables: []
    verification: "demonstrated through the Principle 2 \"Demonstrating This Principle\" artifacts"
    kind: "stated"
    testable: "no"
    notes: "One of the three core principles; the operative practices are its demonstration items."
  - id: "cisa-secure-by-design-2023#P3"
    normativity: "principle"
    verb: "need to"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Software Product Security Principles — Principle 3 p. 10"
    text: "Build organizational structure and leadership to achieve these goals. While technical subject matter expertise is critical to product security, senior executives are the primary decision makers for implementing change in an organization. Executives need to prioritize security as a critical element of product development across the organization, and in partnership with customers."
    expects_deliverables: []
    verification: "demonstrated through the Principle 3 \"Demonstrating This Principle\" artifacts"
    kind: "stated"
    testable: "no"
    notes: "One of the three core principles; the operative practices are its demonstration items."
  - id: "cisa-secure-by-design-2023#R-0021"
    normativity: "recommendation"
    verb: "should consider"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Software Product Security Principles p. 11"
    text: "To enable these three principles, manufacturers should consider several operational tactics to evolve their development processes."
    expects_deliverables: []
    verification: "see OPS-1..3"
    kind: "stated"
    testable: "no"
    notes: ""
  - id: "cisa-secure-by-design-2023#OPS-1"
    normativity: "recommendation"
    verb: "should (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Software Product Security Principles — operational tactics p. 11"
    text: "Convene routine meetings with company executive leadership to drive the importance of secure by design and secure by default within the organization. Policies and procedures should be established to reward production teams that develop products adhering to these principles, which could include awards for implementing outstanding software security practices or incentives for job ladders and promotion criteria."
    expects_deliverables:
      - "executive meeting cadence"
      - "reward/incentive policy"
    verification: "meeting records; incentive policy text"
    kind: "stated"
    testable: "partial"
    notes: ""
  - id: "cisa-secure-by-design-2023#OPS-2"
    normativity: "recommendation"
    verb: "should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "governance"
    locator: "Software Product Security Principles — operational tactics p. 11"
    text: "Operate around the importance of software security to business success. For example, consider assigning a “software security leader” or a “software security team” that upholds business and IT practices that directly link software security standards and manufacturer accountability. Manufacturers should ensure they have robust, independent product security assessment and evaluation programs for their products."
    expects_deliverables:
      - "named software security leader/team"
      - "independent product security assessment programme"
    verification: "org chart names role; independent assessment reports exist"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#OPS-3"
    normativity: "recommendation"
    verb: "should (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "design"
    locator: "Software Product Security Principles — operational tactics p. 11"
    text: "Use a tailored threat model during resource allocation and development to prioritize the most critical and high-impact features. Threat models consider a product’s specific use-case and enable development teams to fortify products. Finally, senior leadership should hold teams accountable for delivering secure products as a key element of product excellence and quality."
    expects_deliverables:
      - "tailored threat model used for resource allocation"
    verification: "threat model exists and is referenced in prioritisation decisions"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#R-0022"
    normativity: "recommendation"
    verb: "need to"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "implementation"
    locator: "Principle 1 — Explanation p. 11"
    text: "Software manufacturers need to implement application hardening by using processes and technologies that raise the cost for a malicious actor wishing to compromise applications."
    expects_deliverables: []
    verification: "hardening measures present (input validation, memory safety, SDLC, HW-backed keys)"
    kind: "stated"
    testable: "partial"
    notes: ""
