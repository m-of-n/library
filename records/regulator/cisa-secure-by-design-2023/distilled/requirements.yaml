    notes: "SSDF task ids are the source's own mapping (printed in the bullet title)."
  - id: "cisa-secure-by-design-2023#TAC-SBD-10"
    normativity: "recommendation"
    verb: "imperative"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "operations/response"
    locator: "Secure by Design Tactics bullet 10 (CVE completeness.) p. 29"
    text: "CVE completeness. Ensure that published CVEs include root cause or common weakness enumeration (CWE) to enable industry-wide analysis of software security design flaws. While ensuring that every CVE is correct and complete can take extra time, it allows disparate entities to spot industry trends that benefit all manufacturers and customers. For more information on managing vulnerabilities, see CISA’s Stakeholder-Specific Vulnerability Categorization (SSVC) guidance."
    expects_deliverables:
      - "CVE records with CWE"
    verification: "published CVEs carry CWE / root cause"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#TAC-SBD-11"
    normativity: "recommendation"
    verb: "imperative"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "design"
    locator: "Secure by Design Tactics bullet 11 (Defense-in-Depth.) p. 29"
    text: "Defense-in-Depth. Design infrastructure so that the compromise of a single security control does not result in compromise of the entire system. For example, ensuring that user privileges are narrowly provisioned, and access control lists are employed can reduce the impact of a compromised account. Also, software sandboxing techniques can quarantine a vulnerability to limit compromise of an entire application."
    expects_deliverables: []
    verification: "architecture review: no single control failure compromises whole system"
    kind: "stated"
    testable: "yes"
    notes: ""
  - id: "cisa-secure-by-design-2023#TAC-SBD-12"
    normativity: "recommendation"
    verb: "imperative; should"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "deliverable"
    phase: "governance"
    locator: "Secure by Design Tactics bullet 12 (Satisfy Cybersecurity Performance Goals (CPGs).) p. 29"
    text: "Satisfy Cybersecurity Performance Goals (CPGs). Design products that meet basic security practices. CISA’s Cybersecurity Performance Goals outline fundamental, baseline cybersecurity measures organizations should implement. Additionally, for more ways to strengthen your organization’s posture, see the NCSC–UK’s Cyber Assessment Framework which shares similarities to CISA’s CPGs. If a manufacturer fails to meet the CPGs— such as not requiring phishing-resistant MFA for all employees— then they cannot be seen as delivering secure by design products."
    expects_deliverables:
      - "CPG conformance evidence"
    verification: "organisation meets CISA CPGs (e.g. phishing-resistant MFA for all employees)"
    kind: "stated"
    testable: "yes"
    notes: ""
