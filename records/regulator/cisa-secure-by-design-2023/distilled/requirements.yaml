  - id: "cisa-secure-by-design-2023#P1-DEV-7"
    normativity: "recommendation"
    verb: "work jointly (imperative)"
    actor: "software manufacturer"
    condition: "unconditional"
    nature: "process"
    phase: "verification"
    locator: "Principle 1 — Secure Product Development Practices item 7 (Test security incident event management (SIEM) and security orchestration, automation, and response (SOAR) integration.) p. 18"
    text: "Test security incident event management (SIEM) and security orchestration, automation, and response (SOAR) integration. In addition to conducting field tests, work jointly with popular SIEM and SOAR providers in conjunction with select customers to understand how incident response teams use logs to investigate suspected or actual security incidents. Few software developers have experience responding to an incident and may create log entries that do not help responders as much as they would expect. By working both with SIEM and SOAR technologies and real incident response professionals, the development team can create logs that tell the correct and complete story, saving time and reducing uncertainty during an incident."
