gaps:
  - "Configuration / Setting object with is_default, safe, risk indicator and 'deviation from secure baseline' — ARCH-0001 has no configuration layer; secure-by-default conformance cannot be expressed without it."
  - "Class-level mitigation: a MitigationInstance that eliminates a Weakness (CWE class) across a ProductFamily, not a single ThreatInstance on one Component."
  - "PublicArtifact / Evidence with publication metadata and 'outsider-examinable' audience; DL-0009 R-043 governed views are internal sign-off snapshots — public transparency artifacts need a publication state and audience."
  - "PublicCommitment (forward-looking assertion, e.g. 'never charge for security features') — not an Assertion about current state."
  - "Metric / SecurityStatistics objects (MFA adoption %, patch currency %, unused privileges) and the measurement → SDLC feedback edge."
  - "Customer-side RiskAcceptanceDecision and PurchasingCriteria — tmodel models the producer's threat model, not the acquirer's acceptance."
  - "Governance bodies (BoardOfDirectors, SecureByDesignCouncil, CustomerCouncil) and Incentive — Party roles exist, but not bodies with reporting lines."
  - "Pricing attribute (security feature offered at no extra charge) — a business property the model has no place for."
  - "Hardening vs loosening guide: documentation-kind mitigations (R-040) need a polarity (steps to secure vs. risky deviations)."
