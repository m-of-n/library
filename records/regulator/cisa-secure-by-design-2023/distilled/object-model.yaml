schema: "library-object-model/v1"
record: cisa-secure-by-design-2023
extracted: "2026-10-02"
extracted_by: "claude (lane B fork) — object-model pass, separate re-read of .cache/cisa-secure-by-design-2023.md"
reviewed_by: ""
question: "What objects (entity types) and relationship edges does this document assume or define?"
note: >
  Locators are section + printed page of the 2023-10-25 revision. kind: stated = the document names the
  object/edge; inferred = the document relies on it without naming it as such. tmodel_mapping refers to
  ARCH-0001 v0.2.0 (iteration 6) classes and DL-0009 proposals (R-040..R-044); "new" = no counterpart yet.
  Requirement ids (P1-DEF-1, TAC-SBD-08 ...) refer to distilled/requirements.yaml.

objects:
  # ---------- parties and roles ----------
  - {name: SoftwareManufacturer, definition: "The party that designs, builds and ships the product and to which the three principles are addressed; variants named: technology manufacturer, vendor, supplier, online service, SaaS provider, cloud service, cloud provider.",
     attributes: [name, size (larger/smaller manufacturer), named_secure_by_design_executive, publicly_traded], locator: "Overview p. 4; What's New p. 6; P2-DEV-1 p. 23", kind: stated,
     tmodel_mapping: "Party (§2b) with relational role supplier/manufacturer (Product manufactured_by Party)", notes: "Size is a stated scoping theme (What's New) but not an attribute the guidance branches on."}
  - {name: Customer, definition: "Organization buying/deploying the software; includes enterprise customers and small and medium sized organizations (SMOs).",
     attributes: [size (SMO/enterprise), maturity, risk_appetite], locator: "How To Use p. 7; P1 Explanation p. 13; P1-DEF-6 p. 16", kind: stated,
     tmodel_mapping: "Party (§2b) with relational role consumer/operator; Asset owned_by", notes: "risk_appetite drives secure configuration templates (P1-DEF-6)."}
  - {name: AuthoringOrganization, definition: "The 18 co-sealing government agencies (CISA, NSA, FBI + 15 international partners) issuing the guidance.",
     attributes: [name, country], locator: "Overview p. 5; footnote 2", kind: stated, tmodel_mapping: "Party (intrinsic classification standards-body / regulator); library record publisher", notes: ""}
  - {name: Administrator, definition: "Customer-side privileged user who configures the product; target of nudges, alerts and MFA enrolment prompts; 'super administrator' named.",
     attributes: [mfa_enrolled, privilege_level], locator: "P1 Explanation p. 13; P1-DEF-5 p. 16; TAC-DEF-02 p. 30", kind: stated, tmodel_mapping: "ExternalEntity (DFD role) resolving to Party; trust level R-032", notes: ""}
  - {name: SecureByDesignExecutive, definition: "Top business executive publicly named to oversee the secure by design program; must be empowered to influence product investments.",
     attributes: [name, public_naming_date, authority_scope], locator: "P2-BIZ-1 p. 25; P3-3 p. 27; P3-6 p. 27", kind: stated, tmodel_mapping: "Party role (document owner / approver per DL-0009)", notes: "The only named accountable individual role in the document."}
  - {name: BoardOfDirectors, definition: "Corporate board that receives reports on product security and customer impact, and (customer side) receives risk-acceptance decisions.",
     attributes: [], locator: "P3-2 p. 27; P3 Explanation p. 26 (CCR); CUST-06 p. 33", kind: stated, tmodel_mapping: "Party (organizational unit) — new role", notes: ""}
  - {name: SecurityResearcher, definition: "External party authorized by the VDP to test products, granted legal safe harbor, reports vulnerabilities.",
     attributes: [], locator: "P2-DEV-6 p. 24; TAC-SBD-09 p. 29", kind: stated, tmodel_mapping: "Party (reported_by edge on Vulnerability/Finding, §2b)", notes: ""}
  - {name: SecureByDesignCouncil, definition: "Central plus distributed body improving security against secure by design goals across the organization (modelled on a quality council).",
     attributes: [central_members, distributed_members, goals], locator: "P3-5 p. 27", kind: stated, tmodel_mapping: "new (governance body; Party of type organizational unit)", notes: ""}
  - {name: CustomerCouncil, definition: "Group of customers across regions/industries/sizes whose agenda includes customer-safety topics, steered by the secure by design executive.",
     attributes: [agenda, reporting_line], locator: "P3-6 p. 27", kind: stated, tmodel_mapping: "new", notes: ""}
  - {name: SoftwareSecurityTeam, definition: "'software security leader' or 'software security team' linking software security standards and manufacturer accountability.",
     attributes: [], locator: "OPS-2 p. 11", kind: stated, tmodel_mapping: "Party role", notes: ""}

  # ---------- the guidance structure ----------
  - {name: Principle, definition: "One of three core software product security principles: (1) take ownership of customer security outcomes, (2) embrace radical transparency and accountability, (3) lead from the top.",
     attributes: [number, statement, explanation], locator: "Software Product Security Principles p. 10; P1 p. 11; P2 p. 20; P3 p. 26", kind: stated,
     tmodel_mapping: "Requirement (R-042/R-044) at the top of a requirement hierarchy (non-testable; satisfied via its practices)", notes: ""}
  - {name: Practice, definition: "A 'Demonstrating This Principle' step a manufacturer takes to show it implements a principle; each produces outsider-examinable artifacts ('show, rather than tell').",
     attributes: [id, title, text, category, principle], locator: "P1 Demonstrating p. 14; P2 Demonstrating p. 21; P3 Demonstrating p. 27", kind: stated,
     tmodel_mapping: "Requirement (R-042) — mitigation-requirement, satisfied by WorkProduct/Evidence", notes: "37 items: P1 18, P2 13, P3 6."}
  - {name: PracticeCategory, definition: "Grouping of Principle 1 and 2 practices: secure by default practices, secure product development practices, pro-security business practices.",
     attributes: [name], locator: "P1 pp. 15–19; P2 pp. 22–25", kind: stated, tmodel_mapping: "new (facet on Requirement); aligns with R-040 mitigation kind technical/process/documentation only loosely", notes: "Principle 3 items are uncategorised."}
  - {name: Tactic, definition: "A roadmap best practice in the 'Secure by Design Tactics' (12) or 'Secure by Default Tactics' (8) lists, or an operational tactic (3, p. 11).",
     attributes: [id, title, tactic_kind (secure-by-design | secure-by-default | operational), ssdf_tasks], locator: "SbD Tactics pp. 28–29; SbDefault Tactics pp. 30–31; p. 11", kind: stated,
     tmodel_mapping: "Mitigation (generic catalog, layer 3) + Requirement; several are D3FEND-like technical mitigations (memory-safe language, parameterized queries)", notes: ""}
  - {name: SecureSDLCFramework, definition: "An external secure SDLC framework whose controls the manufacturer implements and documents conformance to; NIST SSDF (SP 800-218) named; also CISA CPGs, NIST CSF, NCSC-UK CAF, Israel Cyber Supply Chain Methodology.",
     attributes: [name, controls], locator: "P1-DEV-1 p. 17; P1-DEV-2 p. 17; P2-DEV-3 p. 23; SbD Tactics p. 28", kind: stated, tmodel_mapping: "library record (sp-800-218) + Requirement set (MAP-0001)", notes: ""}
  - {name: FrameworkControl, definition: "A control/task of a secure SDLC framework (e.g. SSDF PW.6.1) that a tactic cites, or that a self-attestation lists as implemented, or an 'alternate control'.",
     attributes: [framework, control_id, implemented, alternate], locator: "P1-DEV-1 p. 17; SbD Tactics pp. 28–29; footnote 3", kind: stated, tmodel_mapping: "Requirement (from a spec) — MAP-0001 crosswalk node", notes: ""}

  # ---------- product side ----------
  - {name: Product, definition: "Software product or online service (on-premises, cloud, SaaS, embedded firmware, AI systems and models) in a manufacturer's portfolio, released in versions.",
     attributes: [name, deployment_model (on-premises|cloud|SaaS|embedded), version, criticality], locator: "Overview p. 5; What's New p. 6; P1-BIZ-1 p. 19; P2-DEV-5 p. 24", kind: stated, tmodel_mapping: "Product / ProductInstance (§1)", notes: ""}
  - {name: ProductPortfolio, definition: "The set of existing and new products a roadmap aligns to secure by design practices.",
     attributes: [], locator: "Secure by Design p. 8; SbD Tactics p. 28", kind: stated, tmodel_mapping: "ProductFamily (§1 cross-cutting)", notes: ""}
  - {name: SecurityFeature, definition: "'Application security feature' / 'capability' extending the product to raise customer security posture: TLS on all connections, SSO, MFA, security event audit logging, RBAC, ABAC.",
     attributes: [name, configurable, enabled_by_default, extra_charge], locator: "P1 Explanation pp. 11–12; TAC-DEF-03/04 p. 30", kind: stated, tmodel_mapping: "MitigationInstance kind=technical (R-040) on a Component", notes: "extra_charge=false is itself a practice (P1-BIZ-2 'hidden taxes')."}
  - {name: ApplicationHardening, definition: "Processes and technologies raising attacker cost (input validation, parameterized queries, memory-safe languages, rigorous SDLC, hardware-backed key management).",
     attributes: [], locator: "P1 Explanation p. 11", kind: stated, tmodel_mapping: "MitigationInstance kind=technical|process (R-040)", notes: ""}
  - {name: Setting, definition: "A configuration setting of the product; either a default ('out of the box') or customer-set; continuously evaluated against the manufacturer's current understanding of the threat landscape.",
     attributes: [name, value, is_default, set_by (manufacturer|customer), safe (bool), risk_indicator], locator: "P1 Explanation pp. 12–13; TAC-DEF-08 p. 31", kind: stated, tmodel_mapping: "new — no Configuration object in ARCH-0001; nearest is a Component property", notes: "Central object of 'secure by default'."}
  - {name: SecureDefaultBaseline, definition: "The default configuration that automatically enables the most important security controls at no additional cost.",
     attributes: [controls_enabled], locator: "Secure by Default p. 9", kind: stated, tmodel_mapping: "new (named configuration state of a ProductInstance)", notes: ""}
  - {name: SecureConfigurationTemplate, definition: "Template pre-setting configurations to safe settings according to an organization's risk appetite (e.g. low/medium/high).",
     attributes: [risk_level, settings], locator: "P1-DEF-6 p. 16", kind: stated, tmodel_mapping: "new", notes: ""}
  - {name: SecurityIndicator, definition: "In-product indicator, nudge or 'attention grabbing alert' (seatbelt chime) shown repeatedly while users/admins/configuration are in an unsafe state.",
     attributes: [trigger_state, frequency, remediation_resource], locator: "P1 Explanation p. 13; P1-DEF-5 p. 16", kind: stated, tmodel_mapping: "MitigationInstance kind=technical (R-040)", notes: ""}
  - {name: UnsafeState, definition: "A product/user/admin state the guidance calls 'truly unsafe': admin without MFA, deprecated or weak-crypto protocol enabled, excessive unused privilege, deviation from recommended authorization profile.",
     attributes: [kind], locator: "P1 Explanation p. 13; P1-DEF-5 p. 16; P2-DEF-3 p. 22; TAC-DEF-05 p. 30", kind: inferred, tmodel_mapping: "ThreatInstance precondition / Weakness (layer 3)", notes: "Inferred as a class; the document enumerates the cases."}
  - {name: LegacyFeature, definition: "Backwards-compatible legacy feature or protocol (e.g. 1990s–2000s networking protocols, weak cryptography) that should be deprecated and removed.",
     attributes: [name, deprecated, removal_version], locator: "P1 Explanation p. 12; P1-DEF-4 p. 16; TAC-DEF-06 p. 30", kind: stated, tmodel_mapping: "Component / AttackSurface element", notes: ""}
  - {name: AuthorizationProfile, definition: "Recommended role profile with designated use case; deviation triggers a visible warning.",
     attributes: [role, use_case], locator: "TAC-DEF-05 p. 30", kind: stated, tmodel_mapping: "new", notes: ""}
  - {name: SecurityLog, definition: "Security-related / audit log generated and stored at no additional charge, integrable with SIEM via API in UTC.",
     attributes: [events, retention, integrity_protection, cost], locator: "P1-BIZ-1 p. 19; TAC-DEF-04 p. 30; P1-DEV-7 p. 18", kind: stated, tmodel_mapping: "DataStore (DFD) realized_by Component; MitigationInstance kind=technical", notes: ""}
  - {name: SoftwareComponent, definition: "Third-party or open source component (library, module, middleware, framework) acquired from verified developers.",
     attributes: [supplier, open_source], locator: "TAC-SBD-03 p. 28; P1-DEV-4 p. 17", kind: stated, tmodel_mapping: "Component (CPE/purl, §1)", notes: ""}
  - {name: SecureBuildingBlock, definition: "'Paved road' / 'well-lit path': safe default library for developers (e.g. preventing SQL injection).",
     attributes: [], locator: "P1-DEV-5 p. 17", kind: stated, tmodel_mapping: "Mitigation (generic) applied at implementation phase", notes: ""}

  # ---------- vulnerabilities ----------
  - {name: Vulnerability, definition: "Product vulnerability found internally or externally, published as a CVE entry.",
     attributes: [cve_id, cwe, root_cause], locator: "P1-DEV-3 p. 17; P2-DEV-4 p. 23", kind: stated, tmodel_mapping: "Finding/Vulnerability (layer 3)", notes: ""}
  - {name: VulnerabilityClass, definition: "Class of vulnerability sharing a root cause (memory safety, XSS, SQL injection, input sanitization); identified by the CWE field; target of class-wide elimination.",
     attributes: [cwe_id, name], locator: "Secure by Design p. 8; P1 Explanation p. 12; P2-DEV-4 p. 23; TAC-SBD-10 p. 29", kind: stated, tmodel_mapping: "Weakness (CWE, layer 3)", notes: ""}
  - {name: RootCauseAnalysis, definition: "Analysis of a discovered vulnerability determining its root cause and whether a secure by design practice would have prevented it.",
     attributes: [vulnerability, root_cause, preventing_practice], locator: "P2-DEV-6 p. 24; TAC-SBD-06/09 pp. 28–29", kind: stated, tmodel_mapping: "Review/Assertion on a Finding (§4/§5)", notes: ""}
  - {name: CVERecord, definition: "Published CVE entry that must be correct and complete, including the CWE root-cause field.",
     attributes: [cve_id, cwe, completeness], locator: "Principles p. 10; P2-DEV-4 p. 23; TAC-SBD-10 p. 29", kind: stated, tmodel_mapping: "external ref on Vulnerability (record cve-json-5)", notes: ""}
  - {name: Compromise, definition: "A customer compromise, or compromise of the manufacturer's build process / SDLC, after which public explanation or disclosure is expected.",
     attributes: [kind (customer|build), preventing_feature, disclosed], locator: "P1 Explanation p. 14; P2 Explanation p. 21", kind: stated, tmodel_mapping: "new (Incident); nearest DamageScenario realized", notes: ""}

  # ---------- evidence / public artifacts ----------
  - {name: PublicArtifact, definition: "Evidence published 'for outsiders to examine'; no single artifact proves a program, a set builds the case. Superclass of the artifacts below.",
     attributes: [title, publisher, publication_date, product_scope, url], locator: "P1 Demonstrating p. 14; How To Use p. 7", kind: stated, tmodel_mapping: "WorkProduct/Evidence (R-042) rendered as governed document-view (R-043)", notes: "Key object: the document's conformance model is artifact-based, not audit-based."}
  - {name: SecureByDesignRoadmap, definition: "Written roadmap aligning the portfolio to secure by design practices; documents SDLC changes, field-test reports, class-elimination actions; has planning, control and improvement phases.",
     attributes: [products, practices, phases (planning|control|improvement), deviations], locator: "Secure by Design p. 8; P2-BIZ-2 p. 25; SbD Tactics p. 28", kind: stated, tmodel_mapping: "SDL/SecurityProgram plan (R-041) as governed view (R-043)", notes: ""}
  - {name: MemorySafetyRoadmap, definition: "Published plan to migrate existing and build new products in memory-safe languages (or wrappers), with hiring/training/code-review changes.",
     attributes: [products, languages], locator: "P2-BIZ-3 p. 25", kind: stated, tmodel_mapping: "SDL program plan component (R-041); evidence (R-042)", notes: ""}
  - {name: SBOM, definition: "Software bill of materials built and maintained for each product, with supplier data, available to downstream customers.",
     attributes: [product, components], locator: "P2-DEV-5 p. 23; TAC-SBD-08 p. 29", kind: stated, tmodel_mapping: "Evidence; Component inventory (composed_of) — radar→tmodel contract (ADR-0001)", notes: ""}
  - {name: VulnerabilityDisclosurePolicy, definition: "Published policy that (1) authorizes testing against all products and conditions, (2) provides legal safe harbor, (3) allows public disclosure after a set timeline.",
     attributes: [scope, test_conditions, safe_harbor, disclosure_timeline], locator: "P2-DEV-6 p. 24; TAC-SBD-09 p. 29", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation (R-040) + Evidence", notes: ""}
  - {name: PublishedThreatModel, definition: "High-level written threat model describing what is protected and from whom, covering enterprise, development and customer environments.",
     attributes: [assets, adversaries, environments_covered], locator: "P2-DEV-2 p. 23; Secure by Design p. 8; OPS-3 p. 11", kind: stated, tmodel_mapping: "tmodel's own threat-model governed view (R-043) over the KG", notes: "Direct demand for tmodel output to be publishable at high level."}
  - {name: SelfAttestation, definition: "Published secure-SDLC self-attestation of which framework controls are enacted, and for which products.",
     attributes: [framework, controls, products], locator: "P2-DEV-3 p. 23; P1-DEV-1 p. 17", kind: stated, tmodel_mapping: "Assertion (§4) by the manufacturer Party; Evidence (R-042)", notes: "Unsigned, uncertified; contrast cisa-ssdf-attestation-form-2024 (signed form)."}
  - {name: SecurityStatistics, definition: "Published aggregate statistics: MFA adoption, legacy protocol use, patching (% on latest version), unused privileges, internal control (phishing-resistant MFA) deployment, field effectiveness data.",
     attributes: [metric, value, period, anonymized], locator: "P1 Explanation p. 14; P2-DEF-1..3 p. 22; P2-DEV-1 p. 23", kind: stated, tmodel_mapping: "new (Metric / measurement)", notes: ""}
  - {name: PublicCommitment, definition: "Published commitment: eliminate default passwords; never charge for security/privacy features; publish correct and complete CVEs; cloud logging at no charge.",
     attributes: [statement, date], locator: "P1-DEF-1 p. 15; P1-BIZ-1/2 p. 19; P2-DEV-4 p. 23", kind: stated, tmodel_mapping: "new (Assertion with future-tense scope)", notes: "Same shape as the Pledge goals (cisa-secure-by-design-pledge-2024)."}
  - {name: TransparencyReport, definition: "Report detailing meaningful progress against the roadmap; also 'publish results' of successes and roadblocks.",
     attributes: [], locator: "P2-BIZ-2 p. 25; P2-BIZ-4 p. 25", kind: stated, tmodel_mapping: "governed view (R-043)", notes: ""}
  - {name: AnnualReportSection, definition: "Section in each annual financial report devoted to secure by design efforts (publicly traded companies).",
     attributes: [year], locator: "P3-1 p. 27", kind: stated, tmodel_mapping: "Evidence", notes: ""}
  - {name: BoardReport, definition: "Regular report to the board on product security and its impact on customer security.",
     attributes: [period], locator: "P3-2 p. 27", kind: stated, tmodel_mapping: "governed view (R-043)", notes: ""}
  - {name: HardeningGuide, definition: "Customer-implemented list of steps to secure a product; criticised as not scaling; to be tracked and shrunk per release.",
     attributes: [size, version], locator: "P1 Explanation p. 13; P1-DEF-3 p. 15; TAC-DEF-07 p. 30; Hardening vs Loosening p. 32", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation (R-040) — the kind the document wants minimised", notes: ""}
  - {name: LooseningGuide, definition: "Inverted model replacing hardening guides: lists changes users may make away from secure defaults and the resulting business risks, written by security practitioners.",
     attributes: [changes, risks], locator: "Hardening vs Loosening p. 32", kind: stated, tmodel_mapping: "new — documentation mitigation whose entries are risk-acceptance prompts", notes: ""}
  - {name: FieldTest, definition: "Security-centric user testing / research of the product in real customer environments (on site, virtual, or telemetry), possibly with red-team exercises.",
     attributes: [questions, method, findings], locator: "P1-DEF-2 p. 15", kind: stated, tmodel_mapping: "Review (verification evidence) on MitigationInstance effectiveness (§5)", notes: ""}
  - {name: PostCompromiseExplanation, definition: "Statement after a compromise explaining whether a feature/guidance would have prevented it and whether it will become a free default, or how the vulnerability class is being eliminated.",
     attributes: [], locator: "P1 Explanation p. 14", kind: stated, tmodel_mapping: "new", notes: ""}

  # ---------- program and customer-side governance ----------
  - {name: SecureByDesignProgram, definition: "The manufacturer's program of secure by design improvement, overseen by the executive, reported in financial reports, with SDLC feedback loop.",
     attributes: [executive, roadmap, phases], locator: "P2-BIZ-1/2 p. 25; P3-1 p. 27", kind: stated, tmodel_mapping: "SDL / SecurityProgram (R-041)", notes: "Phases are Juran's quality trilogy (planning/control/improvement), NOT lifecycle gates."}
  - {name: SDLC, definition: "The manufacturer's software development lifecycle, changed via a feedback loop from field measurements.",
     attributes: [framework, controls], locator: "P1 Explanation p. 14; P2-BIZ-2 p. 25", kind: stated, tmodel_mapping: "SDL (R-041); LifecyclePhase axis (§3b)", notes: ""}
  - {name: Incentive, definition: "Reward / promotion / compensation criterion that includes customer security.",
     attributes: [population, criterion], locator: "OPS-1 p. 11; P3-4 p. 27", kind: stated, tmodel_mapping: "none", notes: ""}
  - {name: RiskAssessment, definition: "Manufacturer's assessment enumerating prevalent cyber threats to critical systems to drive protections in product blueprints.",
     attributes: [], locator: "Secure by Design p. 8", kind: stated, tmodel_mapping: "RiskScore / ThreatInstance set (layer 3)", notes: ""}
  - {name: PurchasingCriteria, definition: "Customer IT department criteria emphasizing secure by design/default practices, enforced in purchasing decisions.",
     attributes: [], locator: "CUST-04/05 p. 33; How To Use p. 7", kind: stated, tmodel_mapping: "new (customer-side Requirement set)", notes: "Developed into cisa-secure-by-demand-guide-2024."}
  - {name: RiskAcceptanceDecision, definition: "Customer decision to accept risks of a specific technology product: formally documented, approved by a senior business executive, regularly presented to the board.",
     attributes: [product, approver, date, board_presentation], locator: "CUST-06 p. 33; Hardening vs Loosening p. 32", kind: stated, tmodel_mapping: "Review (§4) with verdict accept-risk — the 'accepted' risk treatment", notes: ""}
  - {name: SharedResponsibilityModel, definition: "Allocation of security responsibilities between cloud supplier and customer.",
     attributes: [supplier_responsibilities, customer_responsibilities], locator: "CUST-14..16 p. 34", kind: stated, tmodel_mapping: "new (Party-to-Party edge attributes)", notes: ""}

edges:
  - {name: demonstrated_by, from: Principle, to: Practice, cardinality: "1:N", definition: "Each principle has 'Demonstrating This Principle' steps.", locator: "pp. 14, 21, 27", kind: stated, tmodel_mapping: "Requirement refines Requirement (R-044 hierarchy)"}
  - {name: in_category, from: Practice, to: PracticeCategory, cardinality: "N:1", definition: "P1/P2 items grouped in three categories.", locator: "pp. 15–25", kind: stated, tmodel_mapping: "facet"}
  - {name: evidenced_by, from: Practice, to: PublicArtifact, cardinality: "N:M", definition: "Practices produce artifacts 'for outsiders to examine'.", locator: "P1 Demonstrating p. 14", kind: stated, tmodel_mapping: "Requirement satisfied_by WorkProduct/Evidence (R-042)"}
  - {name: publishes, from: SoftwareManufacturer, to: PublicArtifact, cardinality: "1:N", definition: "Manufacturer publicly documents actions.", locator: "How To Use p. 7", kind: stated, tmodel_mapping: "PROV wasAttributedTo (§4)"}
  - {name: examines, from: Customer, to: PublicArtifact, cardinality: "N:M", definition: "Customers ask hard questions, push vendors to document, use artifacts in procurement / due diligence / risk acceptance.", locator: "How To Use p. 7", kind: stated, tmodel_mapping: "Review (§4) by customer Party"}
  - {name: cites_control, from: Tactic, to: FrameworkControl, cardinality: "N:M", definition: "Secure by design tactics print SSDF task ids (PW.6.1, PW.4.1, PW.5.1, PW.7.1, PW.7.2, PW.8.2, PS.3.2, RV.1.3); footnote 3 cites PO.1.2.", locator: "SbD Tactics pp. 28–29; footnote 3 p. 17", kind: stated, tmodel_mapping: "Requirement maps_to Requirement (R-044 crosswalk, MAP-0001)"}
  - {name: listed_in, from: Tactic, to: SecureByDesignRoadmap, cardinality: "N:M", definition: "Tactics are 'a non-exhaustive illustrative list of roadmap best practices'.", locator: "SbD Tactics p. 28", kind: stated, tmodel_mapping: "SDL program step (R-041)"}
  - {name: prioritized_by, from: SecureByDesignRoadmap, to: PublishedThreatModel, cardinality: "N:1", definition: "Introduction of practices prioritised by tailored threat modeling, criticality, complexity and business impact.", locator: "SbD Tactics p. 29; OPS-3 p. 11", kind: stated, tmodel_mapping: "threat model drives SDL gate exit criteria (R-041/R-042)"}
  - {name: covers, from: SecureByDesignRoadmap, to: ProductPortfolio, cardinality: "1:1", definition: "Roadmap aligns existing portfolio; deviations only exceptional.", locator: "Secure by Design p. 8", kind: stated, tmodel_mapping: "SDL attached_to ProductFamily (R-041)"}
  - {name: manufactures, from: SoftwareManufacturer, to: Product, cardinality: "1:N", definition: "", locator: "passim", kind: stated, tmodel_mapping: "Product manufactured_by Party (§2b)"}
  - {name: has_setting, from: Product, to: Setting, cardinality: "1:N", definition: "Applications must have default settings until customers configure them.", locator: "P1 Explanation p. 12", kind: stated, tmodel_mapping: "new"}
  - {name: evaluated_against, from: Setting, to: RiskAssessment, cardinality: "N:1", definition: "Settings continuously evaluated against the manufacturer's current understanding of the threat landscape.", locator: "P1 Explanation p. 13", kind: stated, tmodel_mapping: "new — a configuration-vs-threat-model conformance check (R-042)"}
  - {name: signals, from: SecurityIndicator, to: UnsafeState, cardinality: "N:M", definition: "Indicator/alert fires repeatedly while the unsafe state persists.", locator: "P1 Explanation p. 13; P1-DEF-5 p. 16", kind: stated, tmodel_mapping: "MitigationInstance mitigates ThreatInstance"}
  - {name: supports, from: Product, to: SecurityFeature, cardinality: "1:N", definition: "Product supports security features (TLS, SSO, MFA, logging, RBAC, ABAC).", locator: "P1 Explanation pp. 11–12", kind: stated, tmodel_mapping: "Component has MitigationInstance (technical)"}
  - {name: replaces, from: LooseningGuide, to: HardeningGuide, cardinality: "1:1", definition: "Loosening guide is the inverted model that should replace hardening guides.", locator: "Hardening vs Loosening p. 32", kind: stated, tmodel_mapping: "new"}
