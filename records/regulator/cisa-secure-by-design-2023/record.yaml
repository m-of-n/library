  not_applicable:
    - kind: schema
      reason: "The guide defines no data format, form, field set or machine-readable structure. The artifacts it asks manufacturers to publish (SBOM, VDP, CVE records, self-attestation) are named but not specified; their schemas belong to their own records (e.g. cve-json-5, the SBOM format records, cisa-ssdf-attestation-form-2024)."
    - kind: messages
      reason: "No message, envelope or structured exchange is defined between parties. Manufacturer-to-customer communication is open-ended publication of documents, not a message format."
    - kind: protocol
      reason: "No roles exchanging messages in a defined sequence. The VDP elements (authorize testing, safe harbor, disclosure after a set timeline, P2-DEV-6) are requirements on a policy document, not a protocol. The disclosure protocol belongs to iso-iec-29147-2018 / iso-iec-30111-2019."
    - kind: state-machine
      reason: "No lifecycle with states and transitions is defined. The nearest candidates are informal: Juran's planning/control/improvement phases of a roadmap (P2-BIZ-2) are named but given no transitions or guards, and the unsafe-state alert loop (P1-DEF-5) has no specified states. Recorded as gaps in design-notes, not modelled."
    - kind: examples
      reason: "The document contains no worked examples or test vectors that could become fixtures. Its illustrations (seatbelt chime, SSO tax, medical scheduler role profile, XSS root cause) are prose analogies with no expected result."
