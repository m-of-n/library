  - {name: ContractTerm, definition: "contractual term requiring an SBOM upon request", attributes: [], locator: "para 4", kind: stated, tmodel_mapping: "none (acquisition artifact)", notes: ""}
  - {name: Memorandum, definition: "an OMB memorandum to heads of executive departments and agencies (M-26-05; the rescinded M-22-18 and M-23-16)", attributes: [number, date, status], locator: "header; para 3", kind: stated, tmodel_mapping: "library record (document), not a tmodel object", notes: "added by verifier 2026-10-03"}
  - {name: ReferenceDocument, definition: "document agencies 'can reference ... for additional information and options'", attributes: [title, date, draft], locator: "para 4, bullets p.1-2", kind: stated, tmodel_mapping: "library record", notes: "added by verifier 2026-10-03"}
  - {name: HBOMFramework, definition: "CISA HBOM framework for supply chain risk management (reference)", attributes: [], locator: "p.2 bullet 3", kind: stated, tmodel_mapping: "library reference (not held)", notes: ""}
edges:
