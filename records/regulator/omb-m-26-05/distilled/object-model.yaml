  - {name: cites, from: Memorandum, to: ReferenceDocument, cardinality: "1:N", definition: "optional references agencies can consult: SP 800-218 (+ appendices), CISA 2025 SBOM minimum elements (draft 2025-08-22), CISA HBOM framework (Sept. 2023)", locator: "para 4 and bullets p.1-2", kind: stated, tmodel_mapping: "library cites", notes: "added by verifier"}
gaps:
