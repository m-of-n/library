    - kind: schema
      reason: "The guide defines no data format; SBOM formats (SPDX, CycloneDX, SWID) are named only, and the App. D checklist is a table whose structure is captured as checklist-question requirements (question, SSDF tasks, artifacts, references)."
    - kind: messages
      reason: "No message or envelope between parties is defined; App. B lists dependencies (inputs) by name only, transcribed in crosswalk.yaml."
