      reason: "The only sequences are a 4-step attacker sequence (§2.4.1) and a 4-step branch-promotion flow (§2.2.1), neither an inter-party exchange; both are recorded (object-model AttackStep; requirements text)."
    - kind: state-machine
      reason: "No lifecycle with states/transitions/guards is defined; branch promotion (development -> QA -> production, locked after release) is a linear procedure recorded verbatim in requirements, and SLSA levels are quoted from SLSA alpha (use slsa-1-2)."
