    - {mitigation: "Development team trained in secure development", ssdf: [PO.2.2, PW.1.1, PS.1.1, PS.3.1, PW.4.2, PW.4.3, PW.5.1, PW.5.2, PW.6.1, PW.6.2, PW.7.1, PW.7.2]}
    - {mitigation: "Threat models", ssdf: [PW.1.1]}
    - {mitigation: "Security test plans", ssdf: [PO.3.1, PO.3.2, PO.3.3, PO.4.1, PO.4.2, PW.4.3, PW.5.1, PW.5.2, PW.6.1, PW.6.2, PW.7.1, PW.7.2, PW.7.2, PW.8.1, PW.8.2, PW.9.1, PW.9.2, RV.1.1, RV.1.2, RV.3.3, RV.3.4], note: "PW.7.2 printed twice"}
    - {mitigation: "Security test plans", detail: "Document results with CVSS scores; verify security defects are fixed", ssdf: [RV.3.2, RV.3.4, PS.2.1, PS.2.2]}
    - {mitigation: "Product release", detail: "Deliver testing and threat model documentation, vulnerability reports, and SBOM.", ssdf: [PS.2.1, PS.2.2, PW.2.1, RV.1.2]}
    - {mitigation: "Product release", detail: "Support channel to report flaws.", ssdf: [RV.1.1]}
    - {mitigation: "Product release", detail: "Digitally sign shipping binaries with key and trusted root certificate", ssdf: [PS.2.1]}
    - {mitigation: "Product support", detail: "Track known security issues/vulnerabilities", ssdf: [RV.1.1, RV.1.2, RV.1.3]}
    - {mitigation: "Product support", detail: "Incident response with public-facing reporting tools, fix reported items and disclose", ssdf: [RV.1.3, RV.2.1, RV.2.2, RV.3.1, RV.3.3], note: "'RV3.1' printed without dot"}
    - {mitigation: "Product support", detail: "Update in-field products", ssdf: [PS.3.2]}
    - {mitigation: "Assessment and training of developers", ssdf: [RV.3.4]}
    - {mitigation: "Security procedures and processes for each release", ssdf: [RV.2.2]}
