  observations: "Table header says 'Activity in SSDF v.1' while the text cites SSDF v1.1 (and footnote 4 the draft); PW.3.x does not exist in SSDF 1.1 final (merged into PW.4) — the guide was written against the draft."
appendix_a:
  locator: "§3.1 Appendix A: Crosswalk between Scenarios and SSDF, pp.37-38"
  source_note: "The reference numbers in the below crosswalk may look similar for each role (Developer, Supplier and Customer), however they correlate to their specific part of this series."
  rows:
    - {ssdf: PO.1, developer: ["2.2.3 Secure Development Practices"], supplier: ["2.1.1 Define criteria for software security checks"]}
    - {ssdf: PS.1, developer: ["2.2.1.1 Source Control Check-in Process", "2.2.1.4 Code Reviews", "2.2.6 External Development Extensions", "2.3.2 Selections and Integration", "24.1 Build Chain Exploits", "2.5.3 Secure the Distribution System"], supplier: ["2.2.1 Protect all forms of code from unauthorized access", "2.2.2 Provide a mechanism for verifying software release integrity (PS.1, PW.9)"]}
    - {ssdf: PS.3, developer: ["2.2.1.1 Source Control Check-in Process", "2.2.1.2 Automatic and Manual Dynamic and Static Security / Vulnerability Scanning", "2.3.2 Selections and Integration", "2.3.3 Obtain Components from a Known and Trusted Supplier", "2.4.1 Build Chain Exploits"], supplier: ["2.2.3 Archive and protect each software release"]}
    - {ssdf: PW.1, developer: ["2.3.2 Selections and Integration"], supplier: ["2.3.1 Design software to meet security requirements"]}
    - {ssdf: PW.3, developer: ["2.2.3 Secure Development Practices", "2.3.2 Selections and Integration", "2.3.3 Obtain Components from a Known and Trusted Supplier", "2.3.4 Component Maintenance", "2.3.5 Software Bill of Material (SBOM)"], supplier: ["2.3.2 Verify third-party software complies with security requirements"], customer: ["2.1 Procurement/Acquisition (1) Requirements Definition / Recommended Controls (viii)(viii)", "2.2 Deployment (6) (2) Testing – Functionality (c) Recommended Controls (ii) Verify contents in SBOM", "2.2 Deployment (6) Deploy (3) Contracting / Recommended Controls (v) (viii) (ix)(x)"]}
    - {ssdf: PW.6, developer: ["2.2.3.2 Use of Unsecure Development Build Configurations", "2.4.1 Build Chain Exploits"], supplier: ["2.3.3 Configure the compilation and build processes"]}
    - {ssdf: PW.7, developer: ["2.2.1.4 Code Reviews", "2.2 Open source Management Practices", "2.2.6 External Development Extensions", "23.2 Selections and Integration", "2.3.3 Obtain Components from a Known and Trusted Supplier"], supplier: ["2.3.4 Review and/or analyze human-readable code"]}
    - {ssdf: PW.8, developer: ["2.2.1.3 Nightly Builds with Regression Test Automation", "2.3.2 Selections and Integration", "2.4.1 Build Chain Exploits"], supplier: ["2.3.5 Test executable code"]}
    - {ssdf: PW.9, developer: ["2.2.3.2 Use of Unsecure Development Build Configurations", "2.4.1 Build Chain Exploits"], supplier: ["2.2.2 Provide a mechanism for verifying software release integrity (PS.1, PW.9)", "2.3.6 Configure the software to have secure settings by default"]}
    - {ssdf: RV.1, developer: ["2.3.4 Component Maintenance", "2.4.1 Build Chain Exploits"], supplier: ["2.4.1 Identify, analyze, and remediate vulnerabilities on a continuous basis"]}
  observations:
    - "'24.1' and '23.2' are typos for 2.4.1 and 2.3.2."
    - "Developer sub-item numbers 2.2.1.1-2.2.1.4 and 2.2.3.2 are not printed in the body; Appendix A's '2.2.1.4 Code Reviews' corresponds to body item 5 ('Prioritize code reviews'), body item 4 being 'Map features to requirements' — source inconsistency."
    - "The supplier and customer columns cite sections of Parts 2 and 3 of the series (not held)."
appendix_b_dependencies:
  locator: "§3.2 Appendix B: Dependencies, p.39"
  legend: "Green: provided by the supplier for the developer; Dark Green: by third-party suppliers for the developer; Pink: by the customer for the supplier/developer (colours not recoverable from text)"
  items: ["Provide issues from customers", "Provide given hashes as required", "SDLC policies and procedures", "Secure architecture, high-level design", "Qualified team assembly with code/security training", "Independent QA individual/team", "Independent security audit individual/team", "Open source Review Board (OSRB) with repository", "Product release management/resources", "SBOM", "Development location and information", "Third-party SBOM", "Third-party License", "Release notes (detailing vulnerabilities fixed)", "Vulnerability notifications", "Publish updates and patches to the customer to address new vulnerabilities or weaknesses found within the product", "Requirements and criteria for success", "Implied industry security requirements", "Provide issues from operational environment, take updates and patches", "Vulnerability notifications and reporting from the users"]
