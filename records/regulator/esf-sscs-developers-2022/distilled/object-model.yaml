schema: "library-object-model/v1"
record: esf-sscs-developers-2022
reviewed_by: ""
question: "What objects and edges does the ESF developer guide assume or define?"
objects:
  - {name: Role, definition: "the three supply-chain roles of the series: developer, supplier (vendor), customer (acquiring organization)", attributes: [kind], locator: "Exec Summary; §1; Fig 1", kind: stated, tmodel_mapping: "Party relational roles (ARCH-0001 §2b)", notes: "supplier liaises between customer and developer"}
  - {name: Team, definition: "development team (development, QA, build engineering, security experts); product management team; top-level organizational management; QA team; PSIRT; development integrity assurance team; Open source Review Board (OSRB)", attributes: [kind, members], locator: "§2.1, §2.2.1, App. B", kind: stated, tmodel_mapping: "Party (organizational unit) — new granularity", notes: "independence/impartiality is an attribute the guide relies on (threat-model reviewers, QA)"}
  - {name: SecureSDLC, definition: "secure software development lifecycle process: policies and procedures adapted by teams; produces artifacts attesting adherence", attributes: [policies, procedures], locator: "§2, §2.1, Fig 2", kind: stated, tmodel_mapping: "SDL / SecurityProgram (R-041)", notes: ""}
  - {name: LifecycleArea, definition: "the guide's organizing phases: secure product criteria and management (2.1); develop secure code (2.2); verify third-party components (2.3); harden the build environment (2.4); deliver code (2.5)", attributes: [id], locator: "§2.1-§2.5", kind: stated, tmodel_mapping: "LifecyclePhase (ARCH-0001 §3b) — maps to design/implementation/supply-chain/build/distribution", notes: "build environment is its own phase here"}
  - {name: ThreatScenario, definition: "an example of how a process in a lifecycle phase relates to a common vulnerability that could be exploited", attributes: [section, description, sub_scenarios], locator: "§1.2 ('Threat scenarios explain how processes ...'); each §2.x", kind: stated, tmodel_mapping: "ThreatInstance / AttackPattern (generic catalog) with applies_in_phase (ARCH-0001 §1, §3b)", notes: "4 top-level scenarios (§2.1): malicious/vulnerable code injection; vulnerable third-party code/binaries; build-process exploitation; delivery-mechanism modification"}
  - {name: RecommendedMitigation, definition: "controls and mitigations that could reduce the impact of the threats", attributes: [section, text, advanced], locator: "§1.2; each 'Recommended mitigations' heading", kind: stated, tmodel_mapping: "Mitigation (generic) -> MitigationInstance with kind technical|documentation|process (R-040)", notes: "'advanced' variant in §2.4.2 (hermetic, reproducible builds)"}
  - {name: InsiderThreatCase, definition: "five insider sub-scenarios: compromised engineers; poorly trained engineers; ease-of-development features (backdoors); compromised remote development systems; lingering accounts/credentials", attributes: [], locator: "§2.2.1", kind: stated, tmodel_mapping: "ThreatActor facet of Party (critic M1) + AttackPattern", notes: ""}
  - {name: AttackStep, definition: "build-chain exploit sequence: infiltrates development network -> scans to locate repository/build systems -> crafts exploit -> deploys exploit", attributes: [order], locator: "§2.4.1", kind: stated, tmodel_mapping: "AttackStep with precedes ordering (ARCH-0001 §2a)", notes: ""}
  - {name: InjectionPoint, definition: "where malicious code enters a build: compiled source, included libraries, reverted libraries, resident memory (rootkit), network MITM on source pull", attributes: [], locator: "§2.4.1", kind: stated, tmodel_mapping: "AttackSurface (ARCH-0001 §1)", notes: ""}
  - {name: SourceRepository, definition: "source control system with MFA, audit trail, development/QA/production branches; production branch locked after release", attributes: [branches, access_list], locator: "§2.2.1 item 1, Fig 3", kind: stated, tmodel_mapping: "Component (DataStore role) in dev Environment", notes: ""}
  - {name: SecureRepository, definition: "repository of vetted third-party/OSS components, continuously scanned; logs which developer downloaded which component and notifies them on new vulnerabilities", attributes: [download_log], locator: "§2.2.1, Fig 3, §2.2.2", kind: stated, tmodel_mapping: "Component (DataStore) + provenance", notes: ""}
  - {name: BuildEnvironment, definition: "build pipeline and systems: segregated engineering network, MFA, minimal service accounts, logging, secrets protection; advanced: hermetic and reproducible builds", attributes: [hermetic, reproducible], locator: "§2.4, Fig 4", kind: stated, tmodel_mapping: "Environment (dev/build) — gap in ARCH-0001 §3 (runtime-only)", notes: ""}
  - {name: SigningServer, definition: "code-signing system on an isolated segment, HSM-like protections, multi-party approval, small admin set", attributes: [], locator: "§2.4.3", kind: stated, tmodel_mapping: "Component (critical asset)", notes: ""}
  - {name: DistributionSystem, definition: "package/update distribution channel (TLS per SP 800-52r2, package managers)", attributes: [], locator: "§2.5.3", kind: stated, tmodel_mapping: "Component / DataFlow", notes: ""}
  - {name: Product, definition: "the software product and its releases, packages, updates", attributes: [version], locator: "§2", kind: stated, tmodel_mapping: "Product / ProductInstance", notes: ""}
  - {name: ThirdPartyComponent, definition: "third-party commercial or open source component, source or binary", attributes: [binary_only, supplier, eol], locator: "§2.3", kind: stated, tmodel_mapping: "Component (composed_of)", notes: ""}
  - {name: ThreatModel, definition: "threat model of the product and of critical build-pipeline systems; created by impartial senior architects; reviewed by >=2 independent engineers; updated on functionality change/major release/at least annually; shared with internal teams", attributes: [scope, reviewers, updated], locator: "§2.1 Threat models", kind: stated, tmodel_mapping: "the tmodel threat-model instance + governed view (R-043) with Review (2 approvers)", notes: "the guide's governance rules for threat models are directly adoptable"}
  - {name: SecurityTestPlan, definition: "QA-owned plan: coverage, SAST/DAST, SCA, fuzzing, pen test (>=1/yr), black box; results documented, synopsis with CVSS to customers", attributes: [coverage], locator: "§2.1 Security test plans", kind: stated, tmodel_mapping: "WorkProduct / Evidence", notes: ""}
  - {name: ReleaseCriteria, definition: "management-owned criteria a product is evaluated against before release (no unacceptable vulnerabilities, hygiene, artifacts stored, SBOM, signed binaries, crypto standards, OSS standards)", attributes: [criteria], locator: "§2.1 Release criteria", kind: stated, tmodel_mapping: "Gate exit criteria (R-041/R-042)", notes: "the release gate"}
  - {name: Artifact, definition: "any artifact created during the lifecycle that attests adherence; 13 example kinds (Appendix D table)", attributes: [kind, availability], locator: "§2 intro; App. D", kind: stated, tmodel_mapping: "Evidence (R-042) / WorkProduct", notes: ""}
  - {name: AvailabilityClass, definition: "publicly disclosed; externally available (NDA / government-mandated); private/company confidential", attributes: [], locator: "App. D p.42", kind: stated, tmodel_mapping: "visibility attribute on Evidence / governed view (R-043) — new", notes: ""}
  - {name: ChecklistItem, definition: "measurable-outcome question answered Yes/No/NA/Inc with description, SSDF tasks, artifact examples, document references", attributes: [response, ssdf_tasks, artifacts, refs], locator: "App. D pp.45-54", kind: stated, tmodel_mapping: "Requirement + conformance verdict (R-042)", notes: "a ready-made conformance-check template"}
  - {name: SSDFTask, definition: "SP 800-218 practice/task", attributes: [id], locator: "Table 1; App. A; App. D", kind: stated, tmodel_mapping: "Requirement (sp-800-218)", notes: ""}
  - {name: SBOM, definition: "software bill of materials (SPDX, CycloneDX, SWID); validated; all primary and transitive components", attributes: [format], locator: "§2.3.5", kind: stated, tmodel_mapping: "Evidence; composed_of", notes: ""}
  - {name: Vulnerability, definition: "security issue tracked as a defect with CWE and CVSS, in access-controlled pages", attributes: [cwe, cvss], locator: "§2.1 Product support", kind: stated, tmodel_mapping: "Finding/Vulnerability", notes: ""}
  - {name: SLSALevel, definition: "SLSA (alpha) build requirements L1-L4 (scripted, build service, ephemeral, isolated, parameterless, hermetic, reproducible)", attributes: [level], locator: "App. C", kind: stated, tmodel_mapping: "maturity level on BuildEnvironment (slsa-1-2 is the current line)", notes: ""}
  - {name: Dependency, definition: "inputs one role provides another (20 items, App. B)", attributes: [provider_role, consumer_role], locator: "App. B", kind: stated, tmodel_mapping: "edge between Party roles", notes: ""}
edges:
  - {name: liaises, from: Role, to: Role, cardinality: "N:M", definition: "supplier liaises between customer and developer", locator: "Exec Summary", kind: stated, tmodel_mapping: "Party relational edges"}
  - {name: occurs_in, from: ThreatScenario, to: LifecycleArea, cardinality: "N:1", definition: "scenario belongs to a phase of the SDLC", locator: "§1.2", kind: stated, tmodel_mapping: "applies_in_phase (R-037)"}
  - {name: mitigated_by, from: ThreatScenario, to: RecommendedMitigation, cardinality: "1:N", definition: "each section pairs scenarios with recommended mitigations", locator: "§1.2; §2.x", kind: stated, tmodel_mapping: "ThreatInstance mitigated_by MitigationInstance (ARCH-0001 §5)"}
  - {name: applies_in, from: RecommendedMitigation, to: LifecycleArea, cardinality: "N:1", definition: "", locator: "§2.x", kind: stated, tmodel_mapping: "applies_in_phase"}
  - {name: aligns_with, from: RecommendedMitigation, to: SSDFTask, cardinality: "N:M", definition: "Table 1 and Appendix A", locator: "§2.1 Table 1; App. A", kind: stated, tmodel_mapping: "R-044 maps_to"}
  - {name: specialises, from: InsiderThreatCase, to: ThreatScenario, cardinality: "N:1", definition: "five insider cases of the code-injection scenario", locator: "§2.2.1", kind: stated, tmodel_mapping: "AttackPattern hierarchy"}
  - {name: precedes, from: AttackStep, to: AttackStep, cardinality: "1:1", definition: "ordered build-chain exploit", locator: "§2.4.1", kind: stated, tmodel_mapping: "precedes (ARCH-0001 §2a)"}
  - {name: targets, from: AttackStep, to: InjectionPoint, cardinality: "N:M", definition: "", locator: "§2.4.1", kind: stated, tmodel_mapping: "AttackStep -> AttackSurface"}
  - {name: protects, from: RecommendedMitigation, to: BuildEnvironment, cardinality: "N:M", definition: "", locator: "§2.4", kind: stated, tmodel_mapping: "MitigationInstance on Component/Environment"}
  - {name: models, from: ThreatModel, to: Product, cardinality: "N:1", definition: "also for critical systems in the build pipeline", locator: "§2.1", kind: stated, tmodel_mapping: "threat model scope"}
  - {name: reviewed_by, from: ThreatModel, to: Team, cardinality: "1:2..N", definition: "reviewed and approved by at least two independent engineers", locator: "§2.1", kind: stated, tmodel_mapping: "Review (approval quorum) — R-043"}
  - {name: evaluated_against, from: Product, to: ReleaseCriteria, cardinality: "N:1", definition: "management evaluates whether the product satisfies release criteria", locator: "§2.1 Release criteria", kind: stated, tmodel_mapping: "Gate evaluation (R-041/R-042)"}
  - {name: attests, from: Artifact, to: SecureSDLC, cardinality: "N:1", definition: "artifacts attest to adherence to the Secure SDLC", locator: "§2 intro; App. D", kind: stated, tmodel_mapping: "Evidence supports Assertion"}
  - {name: has_availability, from: Artifact, to: AvailabilityClass, cardinality: "N:1", definition: "", locator: "App. D", kind: stated, tmodel_mapping: "visibility"}
  - {name: evidenced_by, from: ChecklistItem, to: Artifact, cardinality: "N:M", definition: "artifact examples column", locator: "App. D", kind: stated, tmodel_mapping: "Requirement evidenced_by Evidence"}
  - {name: maps_to, from: ChecklistItem, to: SSDFTask, cardinality: "N:M", definition: "SSDF tasks column", locator: "App. D", kind: stated, tmodel_mapping: "R-044"}
  - {name: incorporates, from: Product, to: ThirdPartyComponent, cardinality: "1:N", definition: "", locator: "§2.3", kind: stated, tmodel_mapping: "composed_of"}
  - {name: describes, from: SBOM, to: Product, cardinality: "N:1", definition: "", locator: "§2.3.5", kind: stated, tmodel_mapping: "composed_of evidence"}
  - {name: signed_by, from: Product, to: SigningServer, cardinality: "N:1", definition: "released binaries digitally signed", locator: "§2.1; §2.4.3", kind: stated, tmodel_mapping: "provenance"}
  - {name: tracked_as, from: Vulnerability, to: Product, cardinality: "N:1", definition: "tracked as product defects with CWE/CVSS", locator: "§2.1", kind: stated, tmodel_mapping: "affects"}
  - {name: provides, from: Role, to: Dependency, cardinality: "N:M", definition: "", locator: "App. B", kind: stated, tmodel_mapping: "Party edge"}
  - {name: meets_level, from: BuildEnvironment, to: SLSALevel, cardinality: "N:1", definition: "a build (service + script) satisfies the Appendix C row requirements checked for a level (L1-L4; Reproducible is best effort at L4)", locator: "App. C, pp.40-41", kind: inferred, tmodel_mapping: "maturity/conformance level on Environment (new)", notes: "added by verifier 2026-10-03 with the SLSA row requirements R-0483..R-0489"}
gaps:
  - "Build/development environment (repositories, build systems, signing server, engineering network) as first-class modelled assets — ARCH-0001 §3 Environment is runtime; the guide's whole §2.4 threatens the build."
  - "Approval quorum on a threat model (>= 2 independent engineers) and impartiality of the author — R-043 Review needs count/independence constraints."
  - "Threat-model refresh triggers (functionality change, major release, at least annually) — a governed view needs update obligations and staleness detection."
  - "Evidence availability class (public / NDA / government-mandated / confidential) — R-043 visibility."
  - "Checklist response states Yes/No/NA/Inc with explanation — a conformance verdict vocabulary for R-042."
  - "Role-to-role dependencies (App. B) — inputs a Party owes another for the SDL to work."
