distillation:
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "Code: full principle block (4 themes, theme stems, 14 principles) verbatim + all other normative Code statements + Table 1 applicability + Assurance and self-assessment; APC: all 45 claims per principle; IG: every normative statement per principle, the 3.3 informative approaches, Appendix 1 mapping. Excludes background prose, further-reading lists, glossary definitions without a modal (held in .cache capture)."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "166 entries (library-requirements/v2): 14 Code principles (#1.1..#4.3, 'shall' via theme stem in governing_clause) + 11 other Code statements (C-*) + 45 APC claims (APC-*) + 1 APC recommendation (APC-ABOUT-01, added in verify) + 95 implementation-guidance statements (IG-*). Verbatim, machine-checked as substrings of the source. BCP 14 count 0 (lower-case modals); own-form baseline and reconciliation in header. maps_to: IG Appendix 1 on #1.1 (the only source-published mapping)."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "Information-exchange flows only (no wire format): vulnerability handling 3.2-3.5, incident communication 4.3, support/end-of-support 4.1-4.2; 6 roles, 14 named exchanges; Mermaid in protocol.md. Ordering of notifications vs fix is inferred and flagged."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.md
      coverage: "Mermaid sequence diagrams for the three flows"
      generated_from: distilled/protocol.yaml
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "Vulnerability (triage outcomes fix/acknowledge/investigate further, temporary mitigation), product support (>= 1 year notice guard), incident. No conformance/maturity state machine: the source defines none."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "Adopt/adapt/reject against R-040..R-044, ARCH-0001 §2b/§3b/§4, DL-0009; 6 open questions incl. two source defects."
      reviewed_by: ""
    - kind: diagram
      path: distilled/object-model.yaml
      coverage: "object-model pass: 46 objects, 42 edges, 6 gaps; every entry located; 1 inferred object (CustomerNotification) and 1 inferred edge; Mermaid + findings in object-model.md"
      reviewed_by: ""
    - kind: diagram
      path: distilled/apc-claim-trees.yaml
      coverage: "APC Appendix claims trees, transcribed in the verify pass from the 4 NCSC SVGs (not in the APC PDF): 68 claim nodes with ids and verbatim text, 21 CAE strategy boxes; parent inferred from numbering; connector geometry not parsed; 43 nodes linked to body claims."
      reviewed_by: ""
  not_applicable:
    - kind: schema
      reason: "The Code, APC and implementation guidance define no data format, schema or field-level structure; the self-assessment form is a generic NCSC PBA Word template, not a schema. Nothing to copy verbatim and nothing derivable without invention."
    - kind: messages
      reason: "No message formats are defined. The information exchanges (vulnerability report, notifications, end-of-support notice, post-incident report) are named with their required content in protocol.yaml; the sources give content topics, not fields or encodings."
    - kind: examples
      reason: "The sources contain no worked examples, sample notices, sample VDPs or test vectors. The APC claims trees (SVG on the NCSC page; transcribed in distilled/apc-claim-trees.yaml) are argument structures, not example evidence."
