schema: "library-object-model/v1"
record: uk-software-security-code-of-practice
source_version: "Code May 2025; Implementation Guidance v1.0; APCs v1.0"
extracted_by: "claude (lane D)"
date: "2026-10-02"
reviewed_by: ""
note: >
  Object-model pass: the three sources re-read with one question - what entity types and edges do
  they assume or define? Locators: 'Code p.N' (DSIT PDF), 'IG page N' (NCSC implementation guidance),
  'APC' (NCSC Assurance Principles and Claims). kind: stated = the source names the thing (usually
  in the Code's Table 3 glossary); inferred = the source relies on it without naming it as a thing.
  tmodel_mapping refers to ARCH-0001 v0.2.0 (proposed) and DL-0009 (R-040..R-044).

objects:
  # --- parties and roles ---------------------------------------------------
  - name: SoftwareVendor
    definition: "Software vendors are organisations that develop and sell software or software services."
    attributes: [stakeholder_group, size, sector]
    locator: "Code p.9, Table 3 'Software Vendor'"
    kind: stated
    tmodel_mapping: "Party (ARCH-0001 §2b) with relational role vendor-of / manufactured_by"
    notes: "The Code's obligations land on the vendor organisation; the SRO is accountable for them."
  - name: StakeholderGroup
    definition: "Classification of an organisation that determines which principles apply: software developers and distributors (all principles); software resellers (principles 3 to 4); software developers only (1 and 2, and 3 where in scope); open-source developers and maintainers (not the primary audience)."
    attributes: [name, applicable_themes]
    locator: "Code p.3, Table 1"
    kind: stated
    tmodel_mapping: "new - an applicability profile on the Party-Product relation; closest is a relational role edge (§2b critic M2)"
    notes: "Applicability is by role in the supply relationship, not by product type. A conformance check (R-042) must first resolve which themes are in scope."
  - name: SeniorResponsibleOwner
    definition: "A Senior Responsible Owner is an individual appointed at senior leadership level to hold accountability for ensuring each action of the Code of Practice is achieved by the organisation."
    attributes: [person, appointed_at_level, organisation]
    locator: "Code p.9, Table 3 'Senior Responsible Owner'; Code p.4, Table 2; Code p.6"
    kind: stated
    tmodel_mapping: "Party (person) with an accountable-owner role (DL-0009 document owner/approver is a Party role)"
    notes: "Single accountable role for the whole Code; the obligation is to 'gain assurance', not to perform."
  - name: SeniorLeader
    definition: "A senior leader is someone at the top of the hierarchy of an organisation."
    attributes: [title]
    locator: "Code p.9, Table 3 'Senior Leader'"
    kind: stated
    tmodel_mapping: "Party (person)"
    notes: ""
  - name: SpecialistTeam
    definition: "Functions and roles within a software vendor organisation that implement the principles: those who design and develop software, those responsible for maintaining software, and those responsible for communicating with business customers."
    attributes: [function]
    locator: "Code p.4, Table 2 'Specialist and technical Teams/ roles'"
    kind: stated
    tmodel_mapping: "Party (team) - implementation owner of a MitigationInstance (ARCH-0001 §5)"
    notes: ""
  - name: EnterpriseCustomer
    definition: "For the purpose of this Code of Practice an enterprise customer is defined as any business or other organisation that procures software or software services."
    attributes: []
    locator: "Code p.7, Table 3 'Enterprise customer'; Code p.4, Table 2 'Organisations procuring software'"
    kind: stated
    tmodel_mapping: "Party with relational role consumer (§2b)"
    notes: "Customers may use the Code in negotiations and contracts (Table 2)."
  - name: SecurityResearcher
    definition: "External party who may test software and report vulnerabilities as part of a vulnerability disclosure process."
    attributes: []
    locator: "IG page 5, Principle 3.2"
    kind: stated
    tmodel_mapping: "Party (reporter); Vulnerability reported_by Party (§2b)"
    notes: ""
  - name: RelevantParty
    definition: "Parties external to the organisation who would benefit from knowledge of the identified vulnerability. These could be software vulnerability databases, customers, regulators or supply chains."
    attributes: [category]
    locator: "Code p.8, Table 3 'Relevant parties (action 3.4)'; IG page 5, Principle 3.4 (groups: internal security teams, customers and users, vulnerabilities systems, regulatory bodies, third-party vendors, open source software)"
    kind: stated
    tmodel_mapping: "Party (various facets: CNA/database, regulator, supplier, customer)"
    notes: "IG adds internal security teams, which the Code's glossary excludes ('external to the organisation')."
  - name: VulnerabilityDatabase
    definition: "Databases such as the National Vulnerability Database (NVD) or Common Vulnerabilities and Exposures (CVE)."
    attributes: [name]
    locator: "IG page 5, Principles 3.3 and 3.4"
    kind: stated
    tmodel_mapping: "Party (standards-body / CNA classification, §2b) + external ref registry"
    notes: ""
  # --- the Code's structure -----------------------------------------------
  - name: CodeOfPractice
    definition: "A voluntary Software Security Code of Practice ... It consists of 14 principles that software vendors are expected to implement."
    attributes: [version, publisher, date]
    locator: "Code p.2, Background"
    kind: stated
    tmodel_mapping: "library record (published_by Party) - source of Requirement objects (R-044)"
    notes: ""
  - name: Theme
    definition: "One of 4 groupings of the principles: 1 Secure design and development; 2 Build environment security; 3 Secure deployment and maintenance; 4 Communication with customers."
    attributes: [number, title, purpose_statement]
    locator: "Code p.6"
    kind: stated
    tmodel_mapping: "none directly; a grouping of Requirements, coarsely aligned to LifecyclePhase (§3b)"
    notes: "Themes 1-3 are phase-like (design/dev, build, deploy+maintain); theme 4 is a cross-cutting customer-communication duty."
  - name: Principle
    definition: "One of 14 numbered outcomes the SRO shall gain assurance that the organisation achieves (1.1-4.3)."
    attributes: [id, text, theme]
    locator: "Code p.6"
    kind: stated
    tmodel_mapping: "Requirement (R-042/R-044) with normativity requirement"
    notes: "The Code calls them both 'principles' and 'actions' (Table 3 'Relevant parties (action 3.4)', 'each action of the Code')."
  - name: AssuranceClaim
    definition: "An ideal-scenario claim that, if met and well-evidenced, means the vendor is achieving the principle (APC)."
    attributes: [principle, text, level]
    locator: "APC 'About this document'; Code p.5 'Assurance and self-assessment'; Code p.7, Table 3 'Assurance, Principles & Claims (APCs)'"
    kind: stated
    tmodel_mapping: "new - a conformance criterion between Requirement and Evidence (R-042)"
    notes: "Claims form trees (APC Appendix 'Claims trees', top-level claim = principle, low-level claims = objectively evidenced). The trees are SVG images on the NCSC page (not in the PDF); node text transcribed in apc-claim-trees.yaml (verify pass)."
  - name: APCDocument
    definition: "An APC is a document containing a complete set of Principles and Claims that describe an ideal baseline for a technology, system, service, or process."
    attributes: [version]
    locator: "Code p.7, Table 3"
    kind: stated
    tmodel_mapping: "library record (NCSC APC); a conformance profile"
    notes: ""
  - name: Evidence
    definition: "Evidence of a claim; 'The type of evidence can vary but examples include document inspection, interviewing individuals, or auditing test plans and results.'"
    attributes: ["type (document-inspection | interview | audit-of-test-plans-and-results)", artefact]
    locator: "APC 'About this document'"
    kind: stated
    tmodel_mapping: "Evidence (DL-0009, R-042) / PROV Entity (§4)"
    notes: ""
  - name: SelfAssessment
    definition: "A self-assessment form ... Software vendors can use this form to evidence that they meet the requirements of the Software Security Code of Practice. The self-assessment form uses APCs to provide structure whilst supporting a variety of forms of evidence."
    attributes: [vendor, date, claims_evidenced, shared_with]
    locator: "Code p.8, Table 3 'Self-assessment form'; Code p.4"
    kind: stated
    tmodel_mapping: "Review (ARCH-0001 §4/§5) over a governed view (R-043); assessor = vendor itself"
    notes: "Usable for internal compliance monitoring or shared with customers. The linked form is the generic NCSC PBA self-assessment template (.docx)."
  - name: IndependentAssessment
    definition: "Audit or independent testing through an NCSC-approved cyber resilience test facility."
    attributes: [facility]
    locator: "IG page 2 'Gaining assurance'; APC 'About this document'"
    kind: stated
    tmodel_mapping: "Review by a third-party Party"
    notes: "Code p.5: a certification scheme is being developed ('will be shared in due course'); not yet defined."
  - name: ImplementationGuidance
    definition: "Implementation guidance supports software vendors to achieve the security outcomes in the Code of Practice."
    attributes: [version]
    locator: "Code p.7, Table 3"
    kind: stated
    tmodel_mapping: "library record; source of recommendation-level Requirements"
    notes: ""
  # --- lifecycle and engineering objects ----------------------------------
  - name: SecureDevelopmentFramework
    definition: "A secure development framework provides a structured approach to integrating security throughout the software development life cycle."
    attributes: [name, "minimum_topics: threat modelling; secure coding practices; requirements capture; governance and roles; test strategy; data management; configuration management"]
    locator: "Code p.8, Table 3 'Secure development framework'; IG page 3, Principle 1.1; IG page 7, Appendix 1"
    kind: stated
    tmodel_mapping: "SDL / SecurityProgram (R-041)"
    notes: "The Code delegates the lifecycle to an external framework (SSDF, MS SDL, OWASP, Cisco SDL, SLSA, S2C2F) rather than defining one."
  - name: SoftwareDevelopmentLifecycle
    definition: "A software development lifecycle (SDLC) ... typically contain a variation of these 7 stages: Requirements gathering, analysis, design, implementation or coding, testing, deployment, and maintenance/support."
    attributes: [stages]
    locator: "Code p.8, Table 3 'Lifecycle'"
    kind: stated
    tmodel_mapping: "LifecyclePhase axis (§3b)"
    notes: "Seven-stage line; maps onto §3b's concept..maintenance/update; no end-of-support stage in the SDLC definition, but principle 4.2 adds one."
  - name: Software
    definition: "Software is code, programmes and applications that run on devices."
    attributes: [version, support_level, end_of_support_date]
    locator: "Code p.9, Table 3 'Software'; 'Software service (SaaS)'"
    kind: stated
    tmodel_mapping: "Product / ProductInstance (§1, §3b)"
    notes: "SaaS is in scope as 'software service'."
  - name: ThirdPartyComponent
    definition: "A third-party software component is a component of software developed by a party that is external to the software vendor organisation. They can be open source, or owned or licensed by third parties."
    attributes: [supplier, provenance, update_frequency, maintainer_count, contributor_geography, version]
    locator: "Code p.9, Table 3; IG page 3, Principle 1.2"
    kind: stated
    tmodel_mapping: "Component (§1, CPE/purl), supplied_by Party"
    notes: "IG names the security attributes to consider: provenance, frequency of updates, how many maintainers, geographic location of contributors."
  - name: ComponentInventory
    definition: "Inventory of all third-party software components including compilers and build systems; any format, such as a software bill of materials (SBOM)."
    attributes: [components, format, validated_on]
    locator: "IG page 3, Principle 1.2"
    kind: stated
    tmodel_mapping: "WorkProduct (DL-0009) / SBOM projection of composed_of"
    notes: "Must be shareable with customers 'in the best format'."
  - name: SecurityRequirement
    definition: "Security requirements shared with suppliers; defined security and functional requirements tested by the test process."
    attributes: []
    locator: "IG page 3, Principles 1.2 and 1.3; APC 1.1 'Requirements are captured and recorded.'"
    kind: stated
    tmodel_mapping: "Requirement (product-level)"
    notes: ""
  - name: TestPlan
    definition: "A test plan exists that covers all requirements and third-party components."
    attributes: [coverage, automation, review_date]
    locator: "APC Principle 1.3; IG page 3, Principle 1.3"
    kind: stated
    tmodel_mapping: "WorkProduct"
    notes: "IG names test types: static & dynamic analysis, peer/code review, unit, integration (incl. fuzzing), point-in-time assessments (penetration testing)."
  - name: TestResult
    definition: "Documented results of testing; anomalies and vulnerabilities analysed and addressed."
    attributes: [test, outcome, defects]
    locator: "IG page 3, Principle 1.3"
    kind: stated
    tmodel_mapping: "Evidence / Finding"
    notes: ""
  - name: ThreatModel
    definition: "Techniques to understand how the software might be exploited (threat modelling) have been used in the design of the software."
    attributes: []
    locator: "APC Principle 1.4; IG page 3, Principles 1.1 and 1.4; Code p.8 'Secure by Design' (risk assessment of prevalent cyber threats)"
    kind: stated
    tmodel_mapping: "the tmodel threat model itself (ThreatInstance set over a Product) - the governed view of R-043"
    notes: "The anchor point: a tmodel model is direct evidence for APC-1.4-01."
  - name: BuildEnvironment
    definition: "The environment where software is compiled, built and packaged ready for release. This should be logically or physically separate from areas where code is written and tested."
    attributes: [tools, repositories, configurations, metadata]
    locator: "Code p.7, Table 3; IG page 4"
    kind: stated
    tmodel_mapping: "Environment / Deployment (§1) of the producer's build system; supply-chain custody (radar contract, ADR-0001)"
    notes: ""
  - name: Credential
    definition: "Credentials that would cause harm in the wrong hands (examples include passwords, certificates and API keys)."
    attributes: [type, storage, multi_factor]
    locator: "IG page 3, Principle 1.4; APC Principle 2.1"
    kind: stated
    tmodel_mapping: "asset (DataStore classification) / none"
    notes: ""
  - name: AccessPolicy
    definition: "Policy that defines who is allowed to access (and change) systems within the build environment, and for removing users/privileges."
    attributes: [roles, removal_rule]
    locator: "IG page 4, Principles 2.1 and 2.2"
    kind: stated
    tmodel_mapping: "MitigationInstance kind=documentation (R-040)"
    notes: ""
  - name: ChangeLog
    definition: "Logs of access and changes to the build environment; auditable, retained for an agreed period, confidentiality and integrity protected."
    attributes: [retention_period, protection]
    locator: "APC Principle 2.2; IG page 4, Principle 2.2"
    kind: stated
    tmodel_mapping: "Evidence / PROV Activity record"
    notes: ""
  - name: Release
    definition: "Software or update distributed to customers; integrity verifiable in the customer environment; distributed over trusted channels; digitally signed."
    attributes: [version, signature, channel, security_fix, temporary_or_full]
    locator: "APC Principle 3.1; IG page 5, Principles 3.1 and 3.5"
    kind: stated
    tmodel_mapping: "ProductInstance version (§3b) / SLSA provenance (radar contract)"
    notes: ""
  - name: SecurityUpdate
    definition: "Security updates, patches and notifications to customers; may be a temporary fix or mitigation followed by a more stable solution; out-of-band for critical vulnerabilities."
    attributes: [vulnerabilities_fixed, priority, out_of_band, signed, tested, is_temporary_mitigation]
    locator: "Code p.6, Principle 3.5; IG page 5, Principle 3.5; APC Principle 3.5"
    kind: stated
    tmodel_mapping: "MitigationInstance kind=technical (R-040), linked to Vulnerability"
    notes: ""
  - name: DistributionChannel
    definition: "A trusted location or tool ... for customers to download the software from."
    attributes: [protection]
    locator: "IG page 5, Principle 3.1"
    kind: stated
    tmodel_mapping: "Interconnect / DataFlow (§1) from vendor to customer"
    notes: ""
  # --- vulnerability and incident objects ---------------------------------
  - name: Vulnerability
    definition: "A weakness, or flaw, in software. An attacker may exploit these to (for example) gain unauthorised access to a computer system."
    attributes: [severity, priority, "status (triage outcome: fix | acknowledge | investigate further)", root_cause]
    locator: "Code p.9, Table 3; IG page 5, Principles 3.3, 3.5"
    kind: stated
    tmodel_mapping: "Vulnerability / Finding (§1.3)"
    notes: ""
  - name: VulnerabilityDisclosurePolicy
    definition: "A process whereby individuals can, safely and accessibly, report vulnerabilities to the organisation. This should be backed up by a vulnerability disclosure policy which details how reports should be handled internally."
    attributes: [published, confidential_reporting_channel, internal_handling]
    locator: "Code p.9, Table 3 'Vulnerability disclosure process'; Code p.6, Principle 3.2; APC Principle 3.2"
    kind: stated
    tmodel_mapping: "MitigationInstance kind=process (R-040) + published document (governed view R-043)"
    notes: ""
  - name: VulnerabilityReport
    definition: "A report of a vulnerability received from a researcher or other reporter via the disclosure process."
    attributes: [reporter, received_at, content]
    locator: "IG page 5, Principle 3.2"
    kind: stated
    tmodel_mapping: "Assertion (§4) proposed by an external Party, pending Review"
    notes: ""
  - name: VulnerabilityManagementPlan
    definition: "A vulnerability management plan exists, which describes how vulnerabilities can be proactively detected."
    attributes: [detection_sources, severity_process, prioritisation]
    locator: "IG page 5, Principle 3.3; APC Principle 3.3"
    kind: stated
    tmodel_mapping: "WorkProduct; MitigationInstance kind=process"
    notes: ""
  - name: SecurityResponsePlaybook
    definition: "A 'security response playbook' in place with roles assigned to handle the response, tested periodically."
    attributes: [roles, last_tested]
    locator: "IG page 5, Principle 3.3"
    kind: stated
    tmodel_mapping: "WorkProduct"
    notes: ""
  - name: SupportStatement
    definition: "Information to the customer specifying the level of support and maintenance provided for the software being sold, including frequency of patching against known vulnerabilities, how these are to be distributed and how the customer will be notified."
    attributes: [support_level, patch_frequency, distribution_method, notification_method, end_of_support_dates]
    locator: "Code p.6, Principle 4.1; IG page 6, Principle 4.1; APC Principle 4.1"
    kind: stated
    tmodel_mapping: "none - a published commitment attached to Product (governed view, R-043)"
    notes: ""
  - name: EndOfSupportPolicy
    definition: "An end-of-support policy for the product ... should include the length of time the software is supported for, and/or the notice period that will be given ... not less than one year."
    attributes: [support_duration, "notice_period (>= 1 year)", end_of_support_date, notice_date]
    locator: "Code p.6, Principle 4.2; IG page 6, Principle 4.2; APC Principle 4.2"
    kind: stated
    tmodel_mapping: "LifecyclePhase end-of-support (§3b) - needs dated transition"
    notes: "The only quantitative timing in the Code (>= 1 year notice)."
  - name: UserDocumentation
    definition: "Documentation on how to securely use your software (applying updates, strong authentication/MFA, backups, access control, exposed ports and firewall rules)."
    attributes: [topics]
    locator: "IG page 6, Principle 4.1; APC Principle 4.1"
    kind: stated
    tmodel_mapping: "MitigationInstance kind=documentation (R-040)"
    notes: "A documentation-kind mitigation: direct support for R-040."
  - name: Incident
    definition: "A cyber incident ... is defined as unauthorised access (or attempted access) to an organisation’s IT systems."
    attributes: [impact, root_cause, status]
    locator: "Code p.7, Table 3 'Incident'"
    kind: stated
    tmodel_mapping: "none (operational event; ARCH-0001 has no Incident class)"
    notes: "Includes accidental incidents caused by vulnerabilities in software or updates."
  - name: IncidentSupportPlan
    definition: "A policy or plan ... created in advance and shared with the customers ... detailing how you will go about supporting them in the event of an incident occurring."
    attributes: [roles, procedures, contacts, containment, communication_plan, eradication, recovery, post_incident_review]
    locator: "IG page 6, Principle 4.3; APC Principle 4.3"
    kind: stated
    tmodel_mapping: "WorkProduct; MitigationInstance kind=process"
    notes: ""
  - name: CustomerNotification
    definition: "Notification to customers: of security updates (security update or not, temporary mitigation or full fix), of incidents (what happened, expected impact, what is being done), of end of support."
    attributes: ["type (security-update | incident | end-of-support)", content, sent_at]
    locator: "IG page 5, Principle 3.5; IG page 6, Principles 4.2, 4.3"
    kind: inferred
    tmodel_mapping: "none"
    notes: "The sources describe the content of each notification but do not define a single notification object; unified here."
  - name: PostIncidentReport
    definition: "followed up with a post incident report, identifying the root cause and specifying measures being taken to prevent a future similar event."
    attributes: [root_cause, preventive_measures]
    locator: "IG page 6, Principle 4.3"
    kind: stated
    tmodel_mapping: "WorkProduct"
    notes: ""

edges:
  - {name: part_of, from: Principle, to: Theme, cardinality: "N:1", definition: "14 principles split across 4 themes", locator: "Code p.6", kind: stated, tmodel_mapping: "Requirement grouping"}
  - {name: contains, from: CodeOfPractice, to: Principle, cardinality: "1:14", definition: "It consists of 14 principles", locator: "Code p.2", kind: stated, tmodel_mapping: "library record -> Requirement (R-044)"}
  - {name: accountable_for, from: SeniorResponsibleOwner, to: Principle, cardinality: "1:N", definition: "to hold accountability for ensuring each action of the Code of Practice is achieved by the organisation", locator: "Code p.9, Table 3; Code p.6", kind: stated, tmodel_mapping: "Party owner role on Requirement conformance"}
  - {name: appointed_by, from: SeniorResponsibleOwner, to: SoftwareVendor, cardinality: "1:1", definition: "should be appointed at the top-tier leadership level of an organisation", locator: "Code p.4, Table 2", kind: stated, tmodel_mapping: "Party-Party membership"}
  - {name: achieves, from: SoftwareVendor, to: Principle, cardinality: "N:M", definition: "gain assurance that their organisation achieves the following", locator: "Code p.6", kind: stated, tmodel_mapping: "conformance status (R-042)"}
  - {name: classified_as, from: SoftwareVendor, to: StakeholderGroup, cardinality: "N:M", definition: "organisation type determines which principles apply", locator: "Code p.3, Table 1", kind: stated, tmodel_mapping: "relational role edge (§2b)"}
  - {name: scopes, from: StakeholderGroup, to: Theme, cardinality: "N:M", definition: "resellers: principles 3 to 4; developers only: 1 and 2 (+3 where in scope); developers and distributors: all", locator: "Code p.3, Table 1", kind: stated, tmodel_mapping: "new - applicability filter for conformance"}
  - {name: decomposes, from: AssuranceClaim, to: Principle, cardinality: "N:1", definition: "breaks them down into a set of individual claims that describe a way to fully meet the associated principle", locator: "APC 'About this document'", kind: stated, tmodel_mapping: "new - Requirement -> conformance criterion"}
  - {name: refines, from: AssuranceClaim, to: AssuranceClaim, cardinality: "N:1", definition: "claims trees deconstruct top-level claims to low-level claims that can be simply and objectively evidenced", locator: "APC Appendix 'Claims trees'", kind: stated, tmodel_mapping: "new - claim tree (CAE)"}
  - {name: supports, from: Evidence, to: AssuranceClaim, cardinality: "N:M", definition: "If all these claims are well-evidenced, then a vendor can claim in good faith that they are meeting the principle", locator: "APC 'About this document'", kind: stated, tmodel_mapping: "Evidence satisfies Requirement (R-042)"}
  - {name: assesses, from: SelfAssessment, to: SoftwareVendor, cardinality: "N:1", definition: "Software vendors can use this form to evidence that they meet the requirements", locator: "Code p.8, Table 3", kind: stated, tmodel_mapping: "Review"}
  - {name: structured_by, from: SelfAssessment, to: APCDocument, cardinality: "N:1", definition: "The self-assessment form uses APCs to provide structure", locator: "Code p.8, Table 3", kind: stated, tmodel_mapping: "view-spec of a governed view (R-043)"}
  - {name: shared_with, from: SelfAssessment, to: EnterpriseCustomer, cardinality: "N:M", definition: "can be shared with customers to provide software security assurance", locator: "Code p.4", kind: stated, tmodel_mapping: "governed view publication"}
  - {name: supplements, from: ImplementationGuidance, to: CodeOfPractice, cardinality: "1:1", definition: "the Software Security Code of Practice is supplemented by implementation guidance", locator: "Code p.3", kind: stated, tmodel_mapping: "library relation"}
  - {name: follows, from: SoftwareVendor, to: SecureDevelopmentFramework, cardinality: "N:M", definition: "1.1 Follow an established secure development framework.", locator: "Code p.6, Principle 1.1", kind: stated, tmodel_mapping: "Product governed_by SDL (R-041)"}
  - {name: satisfies, from: SecureDevelopmentFramework, to: Principle, cardinality: "N:1", definition: "off-the-shelf frameworks listed as examples for principle 1.1 (SSDF, MS SDL, OWASP, Cisco SDL, SLSA, S2C2F)", locator: "IG page 7, Appendix 1", kind: stated, tmodel_mapping: "maps_to crosswalk edge (R-044)"}
  - {name: composed_of, from: Software, to: ThirdPartyComponent, cardinality: "N:M", definition: "Understand the composition of the software", locator: "Code p.6, Principle 1.2", kind: stated, tmodel_mapping: "composed_of / uses_component (§1)"}
  - {name: lists, from: ComponentInventory, to: ThirdPartyComponent, cardinality: "1:N", definition: "You capture all the third-party software components, including compilers and build systems.", locator: "IG page 3, Principle 1.2", kind: stated, tmodel_mapping: "SBOM projection"}
  - {name: shared_with, from: ComponentInventory, to: EnterpriseCustomer, cardinality: "N:M", definition: "ability to share your inventory with your customers in the best format", locator: "IG page 3, Principle 1.2", kind: stated, tmodel_mapping: "governed view publication"}
  - {name: supplied_by, from: ThirdPartyComponent, to: RelevantParty, cardinality: "N:1", definition: "Components may come from a supplier with whom you have a contractual relationship, or they may be Free Open-Source Software (FOSS).", locator: "IG page 3, Principle 1.2", kind: stated, tmodel_mapping: "supplied_by Party (§2b)"}
  - {name: covers, from: TestPlan, to: SecurityRequirement, cardinality: "1:N", definition: "A test plan exists that covers all requirements and third-party components.", locator: "APC Principle 1.3", kind: stated, tmodel_mapping: "verification of Requirement"}
  - {name: covers, from: TestPlan, to: ThirdPartyComponent, cardinality: "1:N", definition: "A test plan exists that covers all requirements and third-party components.", locator: "APC Principle 1.3", kind: stated, tmodel_mapping: ""}
  - {name: informs_design_of, from: ThreatModel, to: Software, cardinality: "N:1", definition: "threat modelling ... used in the design of the software", locator: "APC Principle 1.4", kind: stated, tmodel_mapping: "threat model scoped to Product"}
  - {name: builds, from: BuildEnvironment, to: Release, cardinality: "1:N", definition: "where software is compiled, built and packaged ready for release", locator: "Code p.7, Table 3", kind: stated, tmodel_mapping: "SLSA build provenance (radar contract)"}
  - {name: governs, from: AccessPolicy, to: BuildEnvironment, cardinality: "N:1", definition: "a policy that defines who is allowed to access systems within the build environment", locator: "IG page 4, Principle 2.1", kind: stated, tmodel_mapping: "MitigationInstance applies_to Component"}
  - {name: records, from: ChangeLog, to: BuildEnvironment, cardinality: "N:1", definition: "Access and changes to the build environment are logged.", locator: "APC Principle 2.2", kind: stated, tmodel_mapping: "Evidence"}
