gaps:
  - "AssuranceClaim / claim tree (Claims-Argument-Evidence): tmodel has Requirement -> Evidence + Review (R-042) but no intermediate conformance-criterion node or claim decomposition tree. The APC is exactly that layer and is what makes a principle testable."
  - "Applicability by StakeholderGroup: which requirements apply depends on the organisation's role in the supply relationship (developer+distributor / reseller / developer-only). R-042 needs an applicability filter before evaluating conformance."
  - "Accountable owner distinct from approver: the SRO 'gains assurance' (accountability) but is not an approver of individual work products; DL-0009 has owner/approver only."
  - "Customer-facing commitments with time bounds: SupportStatement and EndOfSupportPolicy (>= 1 year notice) are dated promises attached to a Product; ARCH-0001 §3b has an end-of-support phase but no dated transition or notice period (the missing valid_from/valid_to)."
  - "Incident and CustomerNotification: operational objects with no ARCH-0001 class; a threat model that is a governed view (R-043) would need them to evidence principles 3.4, 3.5 and 4.3."
  - "Build environment as a protected asset of the producer, not of the product: ARCH-0001 models the product's environments; the producer's build environment is supply-chain custody (deferred to the radar contract)."
