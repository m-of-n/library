schema: "library-protocol/v1"
record: uk-software-security-code-of-practice
extracted_by: "claude (lane D)"
date: "2026-10-02"
reviewed_by: ""
note: >
  The Code defines no wire protocol and no message formats. It does define obligations to exchange
  information between named parties - vendor, security researcher, relevant parties (vulnerability
  databases, regulators, third-party vendors), and customers - in a set order: report, triage, fix,
  notify (principles 3.2-3.5), incident notification and follow-up (4.3), end-of-support notice
  (4.2). These flows are modelled here at the level of named information exchanges, each step with
  a locator. Steps the sources state are kind: stated; ordering the sources imply but do not state
  is kind: inferred. No timing is given except the at-least-one-year end-of-support notice; the
  rest is 'timely', 'as soon as possible', 'within a reasonable timeframe, according to their
  priority'.

roles:
  - {id: vendor, name: "Software vendor (incl. internal security team)", locator: "Code p.9 'Software Vendor'; IG page 5 3.4"}
  - {id: researcher, name: "Security researcher / reporter", locator: "IG page 5 3.2"}
  - {id: customer, name: "Enterprise customer / users", locator: "Code p.7 'Enterprise customer'"}
  - {id: vuln-db, name: "Vulnerability database (CVE / NVD)", locator: "IG page 5 3.3, 3.4"}
  - {id: regulator, name: "Regulatory body", locator: "IG page 5 3.4; Code p.8 'Relevant parties'"}
  - {id: third-party-vendor, name: "Third-party vendor / open-source project whose component is affected", locator: "IG page 5 3.4"}

messages:
  - {id: vuln-report, from: researcher, to: vendor, content: "vulnerability report", locator: "IG page 5 3.2; APC 3.2 'describes how to confidentially report vulnerabilities'", kind: stated}
  - {id: internal-notification, from: vendor, to: vendor, content: "notice to internal security teams", locator: "IG page 5 3.4; APC 3.4 'Internal security teams are informed.'", kind: stated}
  - {id: customer-vuln-notification, from: vendor, to: customer, content: "affected customers informed of the vulnerability", locator: "IG page 5 3.4; APC 3.4 'Affected customers are informed.'", kind: stated}
  - {id: vuln-db-report, from: vendor, to: vuln-db, content: "discovered vulnerabilities are reported to the CVE Website", locator: "IG page 5 3.3, 3.4", kind: stated}
  - {id: regulator-report, from: vendor, to: regulator, content: "regulatory bodies might need to be informed to comply with legal requirements", locator: "IG page 5 3.4", kind: stated}
  - {id: upstream-report, from: vendor, to: third-party-vendor, content: "reported to the respective vendors to ensure they can address the issue", locator: "IG page 5 3.4", kind: stated}
  - {id: security-update, from: vendor, to: customer, content: "signed, tested security update or patch (temporary mitigation or full fix; out-of-band if critical)", locator: "IG page 5 3.5; APC 3.5", kind: stated}
  - {id: update-notification, from: vendor, to: customer, content: "that it is a security update (or includes one), whether it is a temporary mitigation or a full fix", locator: "IG page 5 3.5", kind: stated}
  - {id: incident-support-plan, from: vendor, to: customer, content: "policy or plan, created in advance, for supporting customers in an incident", locator: "IG page 6 4.3; APC 4.3", kind: stated}
  - {id: incident-notification, from: vendor, to: customer, content: "what happened, the expected impact and what is being done to resolve it", locator: "IG page 6 4.3", kind: stated}
  - {id: incident-update, from: vendor, to: customer, content: "regular updates until the incident is resolved", locator: "IG page 6 4.3", kind: stated}
  - {id: post-incident-report, from: vendor, to: customer, content: "root cause and measures being taken to prevent a future similar event", locator: "IG page 6 4.3", kind: stated}
  - {id: support-statement, from: vendor, to: customer, content: "level of support and maintenance; patch frequency; distribution; notification method", locator: "Code p.6 4.1; IG page 6 4.1", kind: stated}
  - {id: eos-notice, from: vendor, to: customer, content: "notice of end of support, at least 1 year ahead, advising on the risks of not taking mitigation measures", locator: "Code p.6 4.2; IG page 6 4.2", kind: stated}

flows:
  - id: vulnerability-handling
    title: "Report, triage, fix, notify (principles 3.2-3.5)"
    steps:
      - {n: 1, message: vuln-report, locator: "IG page 5 3.2", kind: stated}
      - {n: 2, action: "validate and triage; outcome: fix, acknowledge or investigate further", locator: "IG page 5 3.5", kind: stated}
      - {n: 3, message: internal-notification, locator: "IG page 5 3.4 ('usually will be the first people to contact')", kind: stated}
      - {n: 4, action: "fix within a reasonable timeframe according to priority; out-of-band update if critical; temporary fix or mitigation first, then a more stable solution", locator: "IG page 5 3.5", kind: stated}
      - {n: 5, message: customer-vuln-notification, locator: "IG page 5 3.4", kind: stated}
      - {n: 6, message: vuln-db-report, locator: "IG page 5 3.3, 3.4", kind: stated}
      - {n: 7, message: upstream-report, condition: "if the vulnerability affects third-party software or services", locator: "IG page 5 3.4", kind: stated}
      - {n: 8, message: regulator-report, condition: "where legal requirements apply", locator: "IG page 5 3.4", kind: stated}
      - {n: 9, message: security-update, locator: "IG page 5 3.5", kind: stated}
      - {n: 10, message: update-notification, locator: "IG page 5 3.5", kind: stated}
      - {n: 11, action: "root cause analysis to prevent recurring vulnerabilities", locator: "IG page 5 3.3", kind: stated}
    ordering_note: "IG 3.4 says groups are notified 'once a vulnerability has been reported or when a fix is available'; the order of steps 5-8 relative to step 9 is therefore not fixed. The sequence above is inferred."
    error_paths:
      - {condition: "triage outcome 'acknowledge' (not fixed)", effect: "no update; flow ends after notification decision", locator: "IG page 5 3.5", kind: inferred}
      - {condition: "triage outcome 'investigate further'", effect: "return to triage", locator: "IG page 5 3.5", kind: inferred}
      - {condition: "secondary vulnerabilities discovered in the vicinity", effect: "new instance of this flow", locator: "IG page 5 3.5 ('be prepared to respond to those secondary vulnerabilities')", kind: stated}
  - id: incident-communication
    title: "Incident support (principle 4.3)"
    steps:
      - {n: 0, message: incident-support-plan, timing: "in advance", locator: "IG page 6 4.3", kind: stated}
      - {n: 1, message: incident-notification, timing: "as soon as possible", locator: "IG page 6 4.3", kind: stated}
      - {n: 2, message: incident-update, timing: "regular, until the incident is resolved", locator: "IG page 6 4.3", kind: stated}
      - {n: 3, message: post-incident-report, timing: "after resolution", locator: "IG page 6 4.3", kind: stated}
  - id: end-of-support
    title: "Support statement and end-of-support notice (principles 4.1, 4.2)"
    steps:
      - {n: 1, message: support-statement, timing: "at sale", locator: "Code p.6 4.1", kind: stated}
      - {n: 2, message: eos-notice, timing: "at least 1 year before end of support", locator: "Code p.6 4.2", kind: stated}
