    governing_clause: "You should ensure that:"
    text: "You share security requirements with your suppliers. Your inventory should be validated and regularly updated as needed."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.2-06"
    source: "guidance"
    normativity: "recommendation"
    verb: "should (via governing_clause)"
    actor: "software vendor"
