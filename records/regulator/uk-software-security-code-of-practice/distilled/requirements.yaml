    parent: "uk-software-security-code-of-practice#4.1"
    text: "To ensure that the customer is aware of the expected lifespan of the software, they should be given enough notice to adapt when the software reaches end of support, and understand how to secure the product."
    expects_deliverables: []
    verification: "per parent principle / APC"
