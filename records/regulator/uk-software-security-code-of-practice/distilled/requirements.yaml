    governing_clause: "You should ensure that:"
    text: "You have the ability to share your inventory with your customers in the best format, so that, in the event that it is appropriate to do so, they have a validated and up-to-date list of all the third-party components in your software for their own supply chain security needs."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.2-07"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "supply-chain"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.2 (bullet)"
    parent: "uk-software-security-code-of-practice#1.2"
    governing_clause: "You should ensure that:"
    text: "Each third-party component of the software is up to date when first integrated into the product, and then regularly checked for vulnerabilities for the lifespan of the product. Not all your components will be provided through a contractual arrangement by a supplier who provides you with confidence that they have supply chain security measures in place. Therefore regular testing of all your third-party components and dependencies needs to be in place. You should be able to demonstrate that adequate testing has been carried out on each component."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.2-08"
    source: "guidance"
    normativity: "recommendation"
    verb: "should (via governing_clause)"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "supply-chain"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.2 (bullet)"
    parent: "uk-software-security-code-of-practice#1.2"
    governing_clause: "You should ensure that:"
    text: "You can prioritise and test if a new vulnerability or attack is discovered outside of your regular testing cadence, to minimise the risk of the vulnerability being exploited."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.2-09"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "supply-chain"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.2 (bullet)"
    parent: "uk-software-security-code-of-practice#1.2"
    governing_clause: "You should ensure that:"
    text: "You can manage and deploy updates to third-party components and libraries provided by suppliers, and carry out any remediation required if vulnerabilities that can be exploited are discovered. Responding to these instances, and effectively communicating with customers is as important as discovery. You should carry out any remediation required (for example developing and issuing updates and patches) in a timely way and report these to your customers."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-01"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
