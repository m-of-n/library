    governing_clause: "You should ensure that:"
    text: "You capture all the third-party software components, including compilers and build systems. Components may come from a supplier with whom you have a contractual relationship, or they may be Free Open-Source Software (FOSS). An inventory can take any format that suits the processes and culture of the organisation, such as a software bill of materials (SBOM)."
    expects_deliverables:
      - "inventory of third-party components incl. compilers and build systems (e.g. SBOM)"
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "yes"
  - id: "uk-software-security-code-of-practice#IG-1.2-05"
    source: "guidance"
