    governing_clause: "You should ensure that:"
    text: "Once identified, vulnerabilities should be validated and triaged. Prioritisation and classification criteria might include how easy to exploit they are and the potential impact if exploited. The outcome of this triage process will tell you whether to fix, acknowledge or investigate further."
    expects_deliverables: []
    verification: "per parent principle / APC"
