    text: "You validate input data. All input data is verified, as early as possible, and any error handling output is clear and does not expose internal information that could be exploited. Use prepared statements with parameterised queries as standard practice. Character wildcards should not be permitted. Syntactic validation is in place that enforces correct syntax for structured fields, such as the set of characters that are permitted. Semantic validation is in place that enforces correctness of values in the context of the software, such as minimum and maximum inputs (like start dates and end dates) and ranges."
