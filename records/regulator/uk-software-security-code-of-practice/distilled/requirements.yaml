    parent: "uk-software-security-code-of-practice#4.1"
    governing_clause: "You should ensure that:"
    text: "You provide information to the customer, in an accessible way, specifying the level of support and maintenance provided for the software being sold. You clarify what level of support will be provided, including frequency of patching against known vulnerabilities, how these are to be distributed and how the customer will be notified of these patches being available."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-4.1-03"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "4. Communication with customers"
    phase: "release"
    locator: "IG page 6 'Theme 4: Communication with customers', Principle 4.1 (bullet)"
    parent: "uk-software-security-code-of-practice#4.1"
    governing_clause: "You should ensure that:"
    text: "You provide customers with documentation on how to securely use your software. This should emphasise the importance of applying the latest software updates, using strong authentication / MFA, how to regularly back up important data, controlling access to only those that require it and what ports may be exposed to the outside world along with firewall rules."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-4.2-01"
    source: "guidance"
    normativity: "recommendation"
    verb: "should not"
    actor: "software vendor"
    nature: "process"
    theme: "4. Communication with customers"
    phase: "operations/response"
    locator: "IG page 6 'Theme 4: Communication with customers', Principle 4.2 (bullet)"
    parent: "uk-software-security-code-of-practice#4.2"
    governing_clause: "You should ensure that:"
    text: "An end-of-support policy for the product is declared. This should include the length of time the software is supported for, and/or the notice period that will be given of the product containing the software reaching its end of life. This notification period should not be less than one year to allow the customer to take appropriate risk mitigation measures and should advise on the risks of not taking such measures."
    expects_deliverables:
      - "declared end-of-support policy"
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "yes"
  - id: "uk-software-security-code-of-practice#IG-4.3-01"
    source: "guidance"
    normativity: "permission"
    verb: "may"
    actor: "software vendor"
    nature: "process"
    theme: "4. Communication with customers"
    phase: "operations/response"
    locator: "IG page 6 'Theme 4: Communication with customers', Principle 4.3 (bullet)"
    parent: "uk-software-security-code-of-practice#4.3"
    governing_clause: "You should ensure:"
    text: "A policy or plan is created in advance and shared with the customers of your software detailing how you will go about supporting them in the event of an incident occurring. This may contain roles and responsibilities, incident response procedures (including key points of contact), containment strategies, communication plans, eradication measures, recovery plans and post-incident reviews."
    expects_deliverables:
      - "incident support policy/plan shared with customers"
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "yes"
  - id: "uk-software-security-code-of-practice#IG-4.3-02"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "4. Communication with customers"
    phase: "operations/response"
    locator: "IG page 6 'Theme 4: Communication with customers', Principle 4.3 (bullet)"
    parent: "uk-software-security-code-of-practice#4.3"
    governing_clause: "You should ensure:"
    text: "When an incident occurs, you should prompt notification to users as soon as possible in a clear and concise way, communicating what happened, the expected impact and what is being done to resolve it. This will help minimise impact and maintain trust. Regular updates should be provided until the incident is resolved, and followed up with a post incident report, identifying the root cause and specifying measures being taken to prevent a future similar event."
    expects_deliverables:
      - "incident notification"
      - "post incident report"
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
