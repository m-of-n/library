note: >
  Ids: '#1.1'..'#4.3' are the Code's own principle numbers (the normative requirements). 'C-*' are
  other normative statements in the Code. 'APC-<p>-NN' are the NCSC Assurance Principles and Claims,
  i.e. the conformance criteria for principle <p> (parent). 'IG-<p>-NN' are statements of the NCSC
  implementation guidance for principle <p> (IG-2.x-* = 'Additional good practice for: build
  environment security'). normativity: requirement (shall/must/will need to), recommendation
  (should), permission (may), conformance-claim (APC outcome statement). Every text is verbatim and
  was machine-checked as a substring of the whitespace-normalised source (PDF text or the same
  document's gov.uk/NCSC HTML where the PDF's two-column layout interleaves lines). Where a statement
  draws its modal from a lead-in, the lead-in is in governing_clause, never spliced into text.
  actor, nature, phase, expects_deliverables, verification and testable are DERIVED and need human
  review. The Code publishes no clause-level crosswalk; the only source-published mapping is
  Implementation Guidance Appendix 1 (off-the-shelf frameworks that satisfy principle 1.1), carried
  as maps_to on #1.1. Source typo preserved verbatim: APC 3.1 'distributed overtrusted channels'.

