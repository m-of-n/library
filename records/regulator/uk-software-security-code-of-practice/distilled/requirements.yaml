    governing_clause: "You should ensure that:"
    text: "Vulnerabilities should be fixed within a reasonable timeframe, according to their priority. If they are critical, you will need to issue an ‘out-of-band’ update that sits outside any regular update cadence. You may need to issue a temporary fix or mitigation to begin with, followed by a more stable solution."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
