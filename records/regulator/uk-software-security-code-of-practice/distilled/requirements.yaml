    parent: "uk-software-security-code-of-practice#1.3"
    text: "As a minimum, your testing approach should include:"
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-02"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.3 (bullet)"
    parent: "uk-software-security-code-of-practice#1.3"
    governing_clause: "You should ensure that:"
    text: "Your tests include all individual components of your software, as well as the final software package. Your process includes testing defined security and functional requirements. Baseline levels of code coverage should be achieved on all code that is checked in, before new code is committed. Missing components and stages of your development process could mean that you miss important places where vulnerabilities exist."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-03"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.3 (bullet)"
    parent: "uk-software-security-code-of-practice#1.3"
    governing_clause: "You should ensure that:"
    text: "The results of testing are documented, and all discovered anomalies and vulnerabilities should be analysed and addressed. Your test plan is regularly reviewed against all these aspects to ensure that it continues to provide you with the confidence you need in your software. When a security issue is found, consider writing a new test for it. If you are experiencing a high number of false positives, consider correcting or removing failing tests. Consider testing your test regime on code which you know contains security flaws, so you can check it is functioning correctly."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-04"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.3 (bullet)"
    parent: "uk-software-security-code-of-practice#1.3"
    governing_clause: "You should ensure that:"
    text: "You test regularly; the more frequently you can test your code, the more confidence you can have in its security. Regular security testing does not have to get in the way of continuous delivery; it should take place throughout the life cycle of your software, not just in the development phase. Automating security testing where possible will provide you with easily repeatable, scalable security measures. Skilled testers can then concentrate on finding subtle and uncommon weaknesses."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-05"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.3 (bullet)"
    parent: "uk-software-security-code-of-practice#1.3"
    governing_clause: "You should ensure that:"
    text: "Your testing regime employs a range of different approaches that verify different aspects of the development life cycle. As a minimum, your testing approach should include:"
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-06"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.3 (bullet, nested)"
    parent: "uk-software-security-code-of-practice#1.3"
    governing_clause: "As a minimum, your testing approach should include:"
    text: "Static & Dynamic Analysis: automated testing carried out on all code prior to check-in and for each release using a standard set of company-approved tools."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-07"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.3 (bullet, nested)"
    parent: "uk-software-security-code-of-practice#1.3"
    governing_clause: "As a minimum, your testing approach should include:"
    text: "Peer/code review: having two or more people review code to check its quality and security. This is a collaborative exercise that is general good practice as it promotes clean and maintainable code and encourages knowledge sharing."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-08"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.3 (bullet, nested)"
    parent: "uk-software-security-code-of-practice#1.3"
    governing_clause: "As a minimum, your testing approach should include:"
    text: "Unit testing: testing which focuses on individual units or components of software. This should be used to check that each unit is operating as it is intended before it is integrated into the whole system."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-09"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.3 (bullet, nested)"
    parent: "uk-software-security-code-of-practice#1.3"
    governing_clause: "As a minimum, your testing approach should include:"
    text: "Integration testing: testing which focuses on the whole system of the software once components have been brought together. It will look for unintended consequences and employ techniques such as ‘fuzzing’."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.3-10"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "verification"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.3 (bullet, nested)"
    parent: "uk-software-security-code-of-practice#1.3"
    governing_clause: "As a minimum, your testing approach should include:"
    text: "Point-in-time assessments: Manual testing (such as ‘penetration testing’ or ‘software security assessment’) which is relatively slow and resource intensive. However it does allow security specialists to use their ingenuity in ways that aren’t possible for other types of testing."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.4-01"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "design"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.4 (bullet)"
    parent: "uk-software-security-code-of-practice#1.4"
    governing_clause: "You should ensure that:"
    text: "A structured process, such as threat modelling, should consider security threats from an adversarial perspective. By understanding what might go wrong, early in the development cycle, these aspects can be given focus and addressed."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.4-02"
    source: "guidance"
    normativity: "recommendation"
    verb: "should"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "design"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.4 (bullet)"
    parent: "uk-software-security-code-of-practice#1.4"
    governing_clause: "You should ensure that:"
    text: "You mandate strong authentication such as multi-factor authentication (MFA) for privileged users. Your software should make phishing-resistant MFA opt-out (rather than opt-in) for privileged users. It should be easy for users of your software to set up MFA. Your choice of extra factor should be made based on the context and user experience of your software. We recommend choosing the strongest factor available as per the NCSC guidance."
    expects_deliverables: []
    verification: "per parent principle / APC"
    kind: "stated"
    testable: "partial"
  - id: "uk-software-security-code-of-practice#IG-1.4-03"
    source: "guidance"
    normativity: "recommendation"
    verb: "should (via governing_clause)"
    actor: "software vendor"
    nature: "process"
    theme: "1. Secure design and development"
    phase: "design"
    locator: "IG page 3 'Theme 1: Secure design and development', Principle 1.4 (bullet)"
    parent: "uk-software-security-code-of-practice#1.4"
    governing_clause: "You should ensure that:"
    text: "You change any default passwords in your toolset, following best practice. Administrators change or set up their own (strong) password during installation and configuration (or even better, other strong forms of authentication are established). You follow NCSC Password Guidance to enable users to set up a strong password for their accounts."
