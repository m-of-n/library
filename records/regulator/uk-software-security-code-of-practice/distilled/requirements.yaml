reconciliation: >
  bin/bcp14-count is 0 on all three sources: none is a BCP 14 document; every modal is lower-case
  and BCP 14 does not apply. The Code defines its own normative term (Table 3 glossary, 'Shall':
  "'shall' represents a requirement of the Code of Practice"). Baseline of the document's own
  normative forms (grep -wi on the .txt/.md renderings): Code shall 6 = 4 theme stems (one per
  theme; each governs that theme's principles, extracted as the 14 principle entries carrying the
  stem as governing_clause) + the glossary headword 'Shall' + its definition sentence (definitional,
  not extracted). Code should 16: 12 occurrences extracted in 10 entries (C-SRO, C-SRO-T2, C-SKILLS, C-RESELLER, C-SCOPE-GOV,
  C-SCOPE-OTHER counted twice as it has two 'should', C-GLOSS-BUILDENV, C-GLOSS-SBD, C-GLOSS-SDF,
  C-GLOSS-VDP counted twice); not extracted 4: two descriptive 'should be reasonably expected'
  statements of the Code's purpose (Background, Audience and scope), 'The Software Security Code of
  Practice should be considered as part of the broader suite...' (reading guidance, not an
  obligation on a vendor), 'cyber security professional should demonstrate' (describes UK Cyber
  Security Council standards).
  Code must 1: C-OSS. Code may 18: all permissive/descriptive ('may be relevant', 'may vary'),
  none extracted. Guidance: should 60 + must 5 = 65 occurrences; 62 are inside extracted
  texts (IG-*); 3 excluded after checking: 'should a post-release issue be found' and 'should a
  vulnerability or incident occur' (conditional 'should' = 'if', not a modal), and 'What exactly
  should we be logging?' (title of a further-reading link). Guidance may 16: extracted only where
  it grants a vendor option inside a statement already extracted; the rest are descriptive
  ('may be', 'may come from'). The 3.3 list of discovery approaches ('can be achieved through a
  variety of approaches, including:') is permissive and not extracted; it is in normative.md.
  Bullets under 'You should ensure that:' carry no modal of their own; they are extracted one per
  bullet with the lead-in as governing_clause and verb 'should (via governing_clause)'. APC: 45
  claims, all extracted (APC-*). APC modal forms (verify pass): should 4 = 1 extracted (APC-ABOUT-01, independent audit) + 1 descriptive ('suggests remedial actions should they fall short' = 'if') + 1 non-vendor ('it should be clear what steps to take') + 1 duplicate of the Code glossary sentence already extracted as C-GLOSS-BUILDENV (Theme 2 intro); may 5, all descriptive ('may need to be', 'may cause', 'may impact'), none extracted. Guidance 'will need to' is 4, not 1 as pass 1 recorded: 3 inside extracted texts (IG-2.2-01, IG-2.x-05, IG-3.5-05) + 1 descriptive ('decisions will need to be taken', About page). Totals: 166 entries = code 25, guidance 95, apc 46 (45 claims + APC-ABOUT-01). The APC Appendix claims trees (68 nodes) are transcribed in apc-claim-trees.yaml, not here: tree nodes are the decomposition of the 45 body claims, not separate statements.
