# APC claims trees (NCSC, Software Security Code of Practice - Assurance Principles and Claims v1.0, Appendix)
# Added in the verify pass (2026-10-02). The APC PDF (sha256 5064391a...) prints only the theme headings of the
# Appendix; the trees themselves are four SVG images on the NCSC web page
# https://www.ncsc.gov.uk/guidance/software-security-code-of-practice-assurance-principles-claims .
# Each SVG carries its node text as <text> elements; this file transcribes them mechanically
# (scratchpad parser: text elements grouped by position into boxes). Normalisations: SVG kerning splits
# re-joined ("T ools" -> "Tools", "ef fective" -> "effective", "V ulnerabilities", "Af fected"), line
# breaks inside a box joined with one space. Source spellings kept: "adequatly", "funtionality", "seperate".
# NOT recovered: the connector geometry. Edge labels in the SVGs are "Is a subclaim of", "Supports" and
# "Comments on"; `parent` below is INFERRED from the dotted numbering, and `arguments` (the CAE
# strategy boxes: Decomposition / Substitution / Time split / Concretion) are listed per tree without
# their attachment point.
# Cross-check against the APC body (requirements.yaml APC-*): 43 of 68 tree claims are textually the
# body claims (same_as_body_claim); 2 are wording variants (2.1.1, 4.1.3); 23 are tree-only
# intermediate claims, of which 1.2.3 "Security requirements are shared with third party suppliers"
# is a LEAF with no counterpart among the 45 body claims (source inconsistency, see design-notes).
