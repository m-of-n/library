schema: "library-object-model/v1"
record: cisa-ssdf-attestation-form-2024
reviewed_by: ""
question: "What objects and edges does the attestation form assume or define?"
objects:
  - {name: SoftwareProducer, definition: "company that produces the software and attests", attributes: [company_name, address, city, state_or_province, postal_code, country, company_website], locator: "Section II.1", kind: stated, tmodel_mapping: "Party (organization), supplied_by role — ARCH-0001 §2b", notes: ""}
  - {name: PrimaryContact, definition: "contact for the document; may be an individual, role, or group", attributes: [name, title, address, phone, email], locator: "Section II.2", kind: stated, tmodel_mapping: "Party (person/role) — contact facet", notes: "a role or group is allowed, i.e. not necessarily a person"}
  - {name: Signatory, definition: "CEO or designee, an employee with authority to bind the corporation", attributes: [name, title, date], locator: "p.4; Section III signature", kind: stated, tmodel_mapping: "Party (person) acting for the producer; PROV Agent actedOnBehalfOf", notes: "legal accountability: 18 U.S.C. § 1001 (p.1)"}
  - {name: Attestation, definition: "the completed form: a statement that the producer presently makes consistent use of the SSDF-derived practices in developing the named software", attributes: [form_version, attestation_kind, attestation_scope, date, omb_control_number], locator: "pp.5-7", kind: stated, tmodel_mapping: "new: Attestation (specialises Assertion §4) — a signed, scoped conformance claim", notes: "kinds: new / following extension or waiver / revised"}
  - {name: AttestationScope, definition: "company-wide, individual product, or multiple products / specific versions", attributes: [kind], locator: "Section I", kind: stated, tmodel_mapping: "selector over Party -> Product / ProductInstance", notes: ""}
  - {name: SoftwareProduct, definition: "named product with version and release/publish date", attributes: [name, version, release_date], locator: "Section I table", kind: stated, tmodel_mapping: "Product / ProductInstance (versioned)", notes: "fn 4: attestation binds future versions"}
  - {name: ExcludedCategory, definition: "software or components not covered: agency-developed; freely obtained OSS; third-party components in the end product; freely obtained and publicly available software", attributes: [category], locator: "p.3; Section I", kind: stated, tmodel_mapping: "applicability predicate on Requirement", notes: ""}
  - {name: AttestedPractice, definition: "one numbered Section III practice (1a-1f, 2, 3, 4a-4c)", attributes: [number, text], locator: "Section III", kind: stated, tmodel_mapping: "Requirement (R-042/R-044)", notes: "12 attestable leaves"}
  - {name: SSDFTask, definition: "SP 800-218 practice/task referenced by the Appendix", attributes: [id], locator: "Appendix", kind: stated, tmodel_mapping: "Requirement in sp-800-218 (crosswalk target)", notes: ""}
  - {name: EOProvision, definition: "EO 14028 §4(e) subsection referenced by the Appendix", attributes: [id], locator: "Appendix", kind: stated, tmodel_mapping: "Requirement in eo-14028", notes: ""}
  - {name: Environment, definition: "software development and build environments, with components within them", attributes: [], locator: "Section III.1", kind: stated, tmodel_mapping: "Environment / Component (build infrastructure) — ARCH-0001 §3", notes: "the form treats the build environment as an attack surface"}
  - {name: TrustRelationship, definition: "trust relationships used for authorization and access to and within environments", attributes: [], locator: "Section III.1.b", kind: stated, tmodel_mapping: "edge property on connected_via / TrustBoundary", notes: ""}
  - {name: ThirdPartyComponent, definition: "third-party components incorporated into the software", attributes: [], locator: "p.3; III.2, III.3", kind: stated, tmodel_mapping: "Component composed_of", notes: ""}
  - {name: Provenance, definition: "provenance for internal code and third-party components", attributes: [], locator: "III.3", kind: stated, tmodel_mapping: "supply-chain provenance (ADR-0001 radar contract; §4 defers)", notes: ""}
  - {name: AutomatedTool, definition: "automated tools or comparable processes for source-supply-chain security and vulnerability checks", attributes: [], locator: "III.2, III.4", kind: stated, tmodel_mapping: "none (Tool) — new", notes: ""}
  - {name: Vulnerability, definition: "discovered or disclosed security vulnerability", attributes: [], locator: "III.4.b-c", kind: stated, tmodel_mapping: "Finding/Vulnerability", notes: ""}
  - {name: VulnerabilityDisclosureProgram, definition: "program through which the producer accepts, reviews and addresses disclosed vulnerabilities within its timelines", attributes: [timelines], locator: "III.4.c", kind: stated, tmodel_mapping: "process mitigation (R-040 kind=process)", notes: ""}
  - {name: Release, definition: "product, version or update release; vulnerability checks run before it", attributes: [], locator: "III.4.a-b", kind: stated, tmodel_mapping: "Gate (release) — R-041", notes: "the form's only explicit gate"}
  - {name: ThirdPartyAssessment, definition: "assessment by a FedRAMP-certified or agency-approved 3PAO against NIST Guidance covering all form elements", attributes: [assessor, basis, attachment], locator: "p.4; Section III", kind: stated, tmodel_mapping: "Review by independent Party (assurance level attribute)", notes: "not posted publicly"}
  - {name: ThirdPartyAssessorOrganization, definition: "3PAO", attributes: [fedramp_certified, agency_approval], locator: "p.4", kind: stated, tmodel_mapping: "Party", notes: ""}
  - {name: POAM, definition: "plan of actions and milestones for practices the producer cannot attest to", attributes: [], locator: "p.4", kind: stated, tmodel_mapping: "MitigationInstance kind=process + Milestones", notes: ""}
  - {name: Agency, definition: "Federal agency receiving the form", attributes: [privacy_act_statement, email_address], locator: "pp.1-4", kind: stated, tmodel_mapping: "Party", notes: ""}
  - {name: Repository, definition: "CISA online form at softwaresecurity.cisa.gov (RSAA)", attributes: [url], locator: "p.3", kind: stated, tmodel_mapping: "external system (external_refs)", notes: ""}
  - {name: Addendum, definition: "attached artifact or agency-specific conformance addendum", attributes: [title, description], locator: "p.3; Section III attachments", kind: stated, tmodel_mapping: "Evidence", notes: ""}
  - {name: LapseNotification, definition: "producer notice that it no longer makes consistent use of the practices", attributes: [], locator: "Section III; fn 4", kind: stated, tmodel_mapping: "new — revocation event on Attestation", notes: ""}
edges:
  - {name: issued_by, from: Attestation, to: SoftwareProducer, cardinality: "N:1", definition: "attestation is on behalf of the company", locator: "Section III lead", kind: stated, tmodel_mapping: "PROV wasAttributedTo"}
  - {name: signed_by, from: Attestation, to: Signatory, cardinality: "N:0..1", definition: "signature (absent on 3PAO path)", locator: "p.4", kind: stated, tmodel_mapping: "PROV wasAssociatedWith"}
  - {name: acts_for, from: Signatory, to: SoftwareProducer, cardinality: "N:1", definition: "employee with authority to bind", locator: "p.4", kind: stated, tmodel_mapping: "PROV actedOnBehalfOf"}
  - {name: contact_for, from: PrimaryContact, to: Attestation, cardinality: "1:N", definition: "", locator: "Section II.2", kind: stated, tmodel_mapping: "Party role"}
  - {name: scoped_to, from: Attestation, to: AttestationScope, cardinality: "N:1", definition: "", locator: "Section I", kind: stated, tmodel_mapping: "selector"}
  - {name: covers, from: Attestation, to: SoftwareProduct, cardinality: "1:N", definition: "named products/versions, and future versions until lapse", locator: "Section I; fn 4", kind: stated, tmodel_mapping: "new — Assertion subject set"}
  - {name: excludes, from: Attestation, to: ExcludedCategory, cardinality: "1:4", definition: "", locator: "Section I", kind: stated, tmodel_mapping: "applicability predicate"}
  - {name: affirms, from: Attestation, to: AttestedPractice, cardinality: "1:12", definition: "all-or-nothing over the Section III practices", locator: "Section III", kind: stated, tmodel_mapping: "R-042 satisfies"}
  - {name: derived_from, from: AttestedPractice, to: SSDFTask, cardinality: "N:M", definition: "Appendix mapping 'for reference purposes'", locator: "Appendix", kind: stated, tmodel_mapping: "R-044 maps_to"}
  - {name: addresses, from: AttestedPractice, to: EOProvision, cardinality: "N:1", definition: "Appendix 'Related E.O. 14028 Subsection'", locator: "Appendix", kind: stated, tmodel_mapping: "R-044 maps_to"}
  - {name: secures, from: AttestedPractice, to: Environment, cardinality: "N:M", definition: "1a-1f secure development and build environments", locator: "III.1", kind: stated, tmodel_mapping: "MitigationInstance mitigates threats to Environment"}
  - {name: governs, from: AttestedPractice, to: TrustRelationship, cardinality: "N:M", definition: "1b logging/monitoring/auditing", locator: "III.1.b", kind: stated, tmodel_mapping: ""}
  - {name: incorporates, from: SoftwareProduct, to: ThirdPartyComponent, cardinality: "1:N", definition: "", locator: "III.2, III.3", kind: stated, tmodel_mapping: "composed_of"}
  - {name: has_provenance, from: ThirdPartyComponent, to: Provenance, cardinality: "1:N", definition: "provenance maintained to greatest extent feasible", locator: "III.3", kind: stated, tmodel_mapping: "supply-chain provenance (post-MVP)"}
  - {name: checked_by, from: SoftwareProduct, to: AutomatedTool, cardinality: "N:M", definition: "vulnerability checks ongoing and before releases", locator: "III.4.a", kind: stated, tmodel_mapping: "Evidence generation"}
  - {name: precedes_release, from: Vulnerability, to: Release, cardinality: "N:M", definition: "discovered vulnerabilities addressed prior to product release", locator: "III.4.b", kind: stated, tmodel_mapping: "Gate exit criterion (R-041/R-042)"}
  - {name: received_via, from: Vulnerability, to: VulnerabilityDisclosureProgram, cardinality: "N:1", definition: "", locator: "III.4.c", kind: stated, tmodel_mapping: "reported_by"}
  - {name: in_lieu_of_signature, from: ThirdPartyAssessment, to: Attestation, cardinality: "1:1", definition: "assessment attached; signature not needed", locator: "p.4", kind: stated, tmodel_mapping: "Review with higher assurance"}
  - {name: performed_by, from: ThirdPartyAssessment, to: ThirdPartyAssessorOrganization, cardinality: "N:1", definition: "", locator: "p.4", kind: stated, tmodel_mapping: "PROV wasAssociatedWith"}
  - {name: substitutes, from: POAM, to: Attestation, cardinality: "1:1", definition: "when a complete attestation cannot be obtained", locator: "p.4", kind: stated, tmodel_mapping: "gap-with-plan conformance state"}
  - {name: submitted_to, from: Attestation, to: Repository, cardinality: "N:1", definition: "online submission (or PDF to Agency)", locator: "p.3", kind: stated, tmodel_mapping: "external_refs"}
  - {name: received_by, from: Attestation, to: Agency, cardinality: "N:M", definition: "agency receives an appropriately signed copy", locator: "p.4", kind: stated, tmodel_mapping: "Review/acceptance"}
  - {name: revokes, from: LapseNotification, to: Attestation, cardinality: "1:1", definition: "notice that practices no longer conform ends the binding effect", locator: "fn 4; Section III", kind: stated, tmodel_mapping: "Assertion status -> withdrawn"}
  - {name: attached_to, from: Addendum, to: Attestation, cardinality: "N:1", definition: "", locator: "Section III", kind: stated, tmodel_mapping: "Evidence attachment"}
gaps:
  - "First-class Attestation (signed, scoped, versioned, revocable Assertion over a Requirement set) with kinds new/revised/following-waiver — tmodel has Assertion+Review but no signatory, scope selector or revocation."
  - "Forward-binding scope: an attestation covers future versions of a product until revoked (fn 4). tmodel ProductInstance is identity-by-hash; a claim over a version *range* is not modelled."
  - "Build/development environment as a modelled asset (III.1): tmodel Environment is the runtime deployment; the SDL needs the dev/build environment as Components with trust relationships."
  - "Tool (automated scanner) as an evidence producer — no Tool entity."
  - "Assurance level of a Review (self vs 3PAO) — attribute needed."
