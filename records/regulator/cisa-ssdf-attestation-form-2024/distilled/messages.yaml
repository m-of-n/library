schema: "library-messages/v1"
record: cisa-ssdf-attestation-form-2024
reviewed_by: ""
note: >
  The form itself is the primary message. Field-level detail and types are in
  schema/attestation-form.schema.json (derived); here: sections, required-ness, encoding options,
  and constrained_by links to requirement ids. P = cisa-ssdf-attestation-form-2024.
messages:
  - name: attestation-form
    locator: "Form pp.5-7"
    from: software-producer
    to: agency
    encodings:
      - {kind: online, where: "https://softwaresecurity.cisa.gov (CISA Repository for Software Attestations and Artifacts, RSAA)", locator: "p.3"}
      - {kind: pdf-email, filename: "[Software Producer]_[Product]_[Version]_[Attestation Date]", to: "agency-provided email address", locator: "p.3"}
    sections:
      - name: header
        fields:
          - {name: form_version, type: string, required: true, value: "1.0", locator: "p.5"}
          - {name: omb_control_number, type: string, required: true, value: "1670-0052", locator: "page header", constrained_by: ["cisa-ssdf-attestation-form-2024#BURDEN-1"]}
      - name: section-I
        locator: "p.5"
        fields:
          - {name: attestation_kind, type: "enum{new, following-extension-or-waiver, revised}", required: true, constrained_by: ["cisa-ssdf-attestation-form-2024#I-type"]}
          - {name: attestation_scope, type: "enum{company-wide, individual-product, multiple-products-or-specific-versions}", required: true, constrained_by: ["cisa-ssdf-attestation-form-2024#I-scope"]}
          - {name: products, type: "list of {name, version?, release_date?}", required: "if scope != company-wide", constrained_by: ["cisa-ssdf-attestation-form-2024#I-products", "cisa-ssdf-attestation-form-2024#I-fn4"]}
          - {name: exclusions, type: "fixed text (4 categories)", required: false, constrained_by: ["cisa-ssdf-attestation-form-2024#I-excl", "cisa-ssdf-attestation-form-2024#INS-07"]}
      - name: section-II
        locator: "pp.5-6"
        fields:
          - {name: producer.company_name, type: string, required: true, constrained_by: ["cisa-ssdf-attestation-form-2024#INS-12"]}
          - {name: producer.address, type: string, required: true}
          - {name: producer.city, type: string, required: true}
          - {name: producer.state_or_province, type: string, required: true}
          - {name: producer.postal_code, type: string, required: true}
          - {name: producer.country, type: string, required: true}
          - {name: producer.company_website, type: uri, required: true}
          - {name: primary_contact.name, type: string, required: true, note: "may be an individual, role, or group", constrained_by: ["cisa-ssdf-attestation-form-2024#II-contact"]}
          - {name: primary_contact.title, type: string, required: true}
          - {name: primary_contact.address, type: string, required: true}
          - {name: primary_contact.phone, type: string, required: true}
          - {name: primary_contact.email, type: email, required: true, note: "may be an alias/distribution list", constrained_by: ["cisa-ssdf-attestation-form-2024#II-email"]}
      - name: section-III
        locator: "pp.6-7"
        fields:
          - {name: practices_attested.1a..4c, type: "12 x boolean (all true)", required: true, constrained_by: ["cisa-ssdf-attestation-form-2024#III-lead", "cisa-ssdf-attestation-form-2024#III.1.a", "cisa-ssdf-attestation-form-2024#III.1.b.i", "cisa-ssdf-attestation-form-2024#III.1.b.ii", "cisa-ssdf-attestation-form-2024#III.1.c", "cisa-ssdf-attestation-form-2024#III.1.d", "cisa-ssdf-attestation-form-2024#III.1.e", "cisa-ssdf-attestation-form-2024#III.1.f", "cisa-ssdf-attestation-form-2024#III.2", "cisa-ssdf-attestation-form-2024#III.3", "cisa-ssdf-attestation-form-2024#III.4.a", "cisa-ssdf-attestation-form-2024#III.4.b", "cisa-ssdf-attestation-form-2024#III.4.c"]}
          - {name: notify_on_lapse, type: boolean, required: true, constrained_by: ["cisa-ssdf-attestation-form-2024#III-notify"]}
          - {name: signature, type: "{signed, date YYYY-MM-DD, name, title}", required: "unless 3PAO path", constrained_by: ["cisa-ssdf-attestation-form-2024#III-sign", "cisa-ssdf-attestation-form-2024#INS-14", "cisa-ssdf-attestation-form-2024#INS-15"]}
          - {name: third_party_assessment, type: "{box_checked, attachment} (+ optional library extensions assessor, assessor_basis — not form fields)", required: "alternative to signature", constrained_by: ["cisa-ssdf-attestation-form-2024#III-3PAO", "cisa-ssdf-attestation-form-2024#INS-17", "cisa-ssdf-attestation-form-2024#INS-18", "cisa-ssdf-attestation-form-2024#INS-19", "cisa-ssdf-attestation-form-2024#INS-20", "cisa-ssdf-attestation-form-2024#INS-21"]}
          - {name: attachments, type: "list of {title, description}", required: false, constrained_by: ["cisa-ssdf-attestation-form-2024#III-attach", "cisa-ssdf-attestation-form-2024#INS-10"]}
    constrained_by: ["cisa-ssdf-attestation-form-2024#INS-05", "cisa-ssdf-attestation-form-2024#INS-12", "cisa-ssdf-attestation-form-2024#INS-13"]
  - name: third-party-assessment
    locator: "p.4; Section III p.7"
    from: 3pao
    to: agency (attached to the form by the producer)
    fields:
      - {name: assessor_credential, required: true, note: "FedRAMP certified, or approved in writing by an appropriate agency official — a condition on the 3PAO (INS-18), not a field of the form"}
      - {name: baseline, required: true, note: "relevant NIST Guidance including all elements of the form"}
    handling: "agency ensures it is not posted publicly"
    constrained_by: ["cisa-ssdf-attestation-form-2024#INS-18", "cisa-ssdf-attestation-form-2024#INS-19", "cisa-ssdf-attestation-form-2024#INS-22"]
  - name: poam-package
    locator: "Additional Information, p.4"
    from: software-producer
    to: agency
    fields:
      - {name: practices_not_attested, required: true}
      - {name: mitigating_practices, required: true}
      - {name: poam, required: true}
    constrained_by: ["cisa-ssdf-attestation-form-2024#INS-23"]
  - name: extension-or-waiver-request
    locator: "Additional Information, p.4"
    from: agency
    to: OMB
    note: "per OMB guidance (omb-m-22-18 §III.A.6-7, omb-m-23-16 §C)"
    constrained_by: ["cisa-ssdf-attestation-form-2024#INS-24"]
  - name: lapse-notification
    locator: "Section III p.7; Section I fn 4"
    from: software-producer
    to: "every agency to which the form was submitted"
    trigger: "producer ceases to make consistent use of the attested practices / practices no longer conform"
    constrained_by: ["cisa-ssdf-attestation-form-2024#III-notify", "cisa-ssdf-attestation-form-2024#I-fn4"]
  - name: agency-addendum
    locator: "p.3"
    from: software-producer
    to: agency
    description: "conformance to agency-specific requirements, attached as addendum; agency handles PRA"
    constrained_by: ["cisa-ssdf-attestation-form-2024#INS-09", "cisa-ssdf-attestation-form-2024#INS-10"]
  - name: privacy-act-statement
    locator: "p.1 note"
    from: agency
    to: software-producer
    constrained_by: ["cisa-ssdf-attestation-form-2024#INS-01", "cisa-ssdf-attestation-form-2024#INS-01b"]
