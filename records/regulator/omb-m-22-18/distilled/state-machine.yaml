schema: "library-state-machine/v1"
record: omb-m-22-18
reviewed_by: ""
note: >
  Two machines. (1) software-item: the agency-side lifecycle of one third-party software item
  under M-22-18 as originally issued (omb-m-23-16 amends the POA&M branch and the deadlines; see
  that record's state-machine.yaml). (2) program-milestones: the dated deadline chain of §III /
  Appendix A, modelled as milestones (R-041 Gate/Milestone material). Every state and transition
  carries a locator; kind: inferred marks what the memo implies but does not name as a state.
  Terminal for the whole regime: rescinded by omb-m-26-05 on 2026-01-23.
machines:
  - name: software-item
    entity: "third-party software (product/version) used by a Federal agency"
    initial: candidate
    states:
      - {name: candidate, locator: "§I", kind: inferred, description: "software an agency intends to use"}
      - {name: out-of-scope, locator: "§I bullets 1-2", kind: stated, description: "developed before 2022-09-14 with no later major version change, or agency-developed; no attestation required"}
      - {name: attestation-required, locator: "§I, §II.1", kind: inferred, description: "in scope; may not be used until an attestation (or alternative) is on file"}
      - {name: attested, locator: "§II.1, §II.1.c", kind: stated, description: "acceptable self-attestation obtained (minimum contents II.1.c) and retained (II.1.b) — or a public link"}
      - {name: third-party-assessed, locator: "§II.1.d", kind: stated, description: "FedRAMP 3PAO or agency-approved assessment against the NIST Guidance accepted in lieu of self-attestation"}
      - {name: partial-attestation, locator: "§II.1.a.ii", kind: stated, description: "producer cannot attest to >=1 practice; must identify them, document mitigations, develop a POA&M"}
      - {name: poam-accepted, locator: "§II.1.a.ii", kind: stated, description: "agency finds the documentation satisfactory; software may be used despite incomplete attestation"}
      - {name: in-use, locator: "§II", kind: inferred, description: "software may be used on agency systems"}
      - {name: not-usable, locator: "§II ('must only use')", kind: inferred, description: "no acceptable attestation/alternative; agency must not use"}
      - {name: rescinded, locator: "omb-m-26-05#R-0004", kind: stated, description: "regime withdrawn 2026-01-23; attestation becomes discretionary"}
    transitions:
      - {from: candidate, to: out-of-scope, trigger: scope-determination, guard: "developed before effective date and no major version change after it, OR agency-developed", locator: "§I"}
      - {from: candidate, to: attestation-required, trigger: scope-determination, guard: "developed after 2022-09-14 OR major version change after it (incl. renewals)", locator: "§I, §II.1.a"}
      - {from: attestation-required, to: attested, trigger: "self-attestation received", guard: "contains II.1.c.i-iii; agency retains it unless public link given", locator: "§II.1.b-c"}
      - {from: attestation-required, to: third-party-assessed, trigger: "3PAO assessment received", guard: "assessor is FedRAMP 3PAO or agency-approved AND baseline = NIST Guidance", locator: "§II.1.d"}
      - {from: attestation-required, to: third-party-assessed, trigger: "agency risk-based determination requires 3PAO", guard: "criticality per M-21-30", locator: "§II.1.c.iv"}
      - {from: attestation-required, to: partial-attestation, trigger: "producer cannot attest to one or more practices", locator: "§II.1.a.ii"}
      - {from: partial-attestation, to: poam-accepted, trigger: "documentation + POA&M supplied", guard: "agency finds it satisfactory", locator: "§II.1.a.ii"}
      - {from: partial-attestation, to: not-usable, trigger: "documentation not supplied or not satisfactory", locator: "§II.1.a.ii", kind: inferred}
      - {from: attested, to: in-use, trigger: "agency decision to use", locator: "§II"}
      - {from: third-party-assessed, to: in-use, trigger: "agency decision to use", locator: "§II.1.d"}
      - {from: poam-accepted, to: in-use, trigger: "agency decision to use", locator: "§II.1.a.ii"}
      - {from: in-use, to: attestation-required, trigger: "renewal or major version change", locator: "§II.1.a", kind: stated}
      - {from: attestation-required, to: not-usable, trigger: "deadline passes without attestation, extension or waiver", locator: "§III.A.3-4, §III.A.6-7", kind: inferred}
      - {from: "*", to: rescinded, trigger: "OMB M-26-05 issued", locator: "omb-m-26-05#R-0004"}
    error_states: [not-usable]
  - name: program-milestones
    entity: "agency implementation of M-22-18 (dated program, cf. tmodel Gate/Milestone R-041)"
    epoch: "2022-09-14 (memo date) unless noted; R = date OMB establishes repository requirements (III.B.2)"
    milestones:
      - {id: M1, offset: "+90 days", date: "2022-12-13", owner: agencies, deliverable: "software inventory + critical-software inventory", req: "omb-m-22-18#III.A.1"}
      - {id: M2, offset: "+90 days", date: "2022-12-13", owner: OMB, deliverable: "waiver/extension instructions on MAX.gov", req: "omb-m-22-18#III.B.1"}
      - {id: M3, offset: "+120 days", date: "2023-01-12", owner: agencies, deliverable: "vendor-communication process + central attestation system", req: "omb-m-22-18#III.A.2"}
      - {id: M4, offset: "+120 days", date: "2023-01-12", owner: CISA, deliverable: "common self-attestation form for PRA clearance", req: "omb-m-22-18#III.C.1", actual: "final form 2024-03-11 (cisa-ssdf-attestation-form-2024)"}
      - {id: M5, offset: "+180 days", date: "2023-03-13", owner: "agency CIOs", deliverable: "training-needs assessment + training plans", req: "omb-m-22-18#III.A.5"}
      - {id: M6, offset: "+180 days", date: "2023-03-13", owner: OMB, deliverable: "requirements for centralized attestation/artifact repository (defines R)", req: "omb-m-22-18#III.B.2"}
      - {id: M7, offset: "+270 days", date: "2023-06-11", owner: agencies, deliverable: "attestations collected for critical software", req: "omb-m-22-18#III.A.3", amended_by: "omb-m-23-16#A-2 (PRA approval + 3 months)"}
      - {id: M8, offset: "+365 days", date: "2023-09-14", owner: agencies, deliverable: "attestations collected for all in-scope software", req: "omb-m-22-18#III.A.4", amended_by: "omb-m-23-16#A-3 (PRA approval + 6 months)"}
      - {id: M9, offset: "R + 1 year", owner: CISA, deliverable: "repository program plan", req: "omb-m-22-18#III.C.2"}
      - {id: M10, offset: "R + 18 months", owner: CISA, deliverable: "repository IOC", req: "omb-m-22-18#III.C.3"}
      - {id: M11, offset: "R + 24 months", owner: CISA, deliverable: "FOC requirements evaluation", req: "omb-m-22-18#III.C.4"}
      - {id: M-ext, offset: "deadline - 30 days", owner: agencies, deliverable: "extension or waiver request to OMB Director (with plan)", req: "omb-m-22-18#III.A.6-2, omb-m-22-18#III.A.7-2", note: "guard on every agency milestone"}
    note: "Calendar dates computed by lane B from the memo date; the memo states only offsets."
