reconciliation: "Not a BCP 14 document: bin/bcp14-count finds 0 uppercase keywords in source and extraction alike. OMB writes obligations as lowercase shall/must/are required/will; every such statement in the body (Intro, §I–§III) is extracted. Appendix A restates §III.A–D in a table and is not re-extracted (its rows are cited in the locators); its one addition ('incorporating the minimum elements of NIST 800-218 as identified by OMB') is noted on III.C.1. Form-count residue: shall 19 vs 14 = the 5 Appendix A rows restating III.A.1-5; will 20 vs 12 = the 8 Appendix A rows restating III.B.1-2, III.C.1-5 and III.D; recommend* 1 is inside the quotation of NIST guidance in §II ('recommendations to federal agencies'), not a modal of this memo; may 11 vs 10 = the date 'May 12, 2021' (case-insensitive grep); must 12 and should 2 match exactly."
note: "Ids follow the memo's own outline (I, II.1.a.ii, III.A.1 ...); '-N' suffix splits a subsection holding several separately testable sentences. status: rescinded on every entry — M-26-05 rescinded this memo on 2026-01-23; kept for history and crosswalk (the attestation regime it created is the model for an attestation gate). normativity also uses: scope, definition, commitment (a non-agency body's 'will'), statement-of-intent, prohibition."
