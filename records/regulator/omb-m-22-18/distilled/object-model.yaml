schema: "library-object-model/v1"
record: omb-m-22-18
reviewed_by: ""
question: "What objects and edges does M-22-18 assume or define?"
objects:
  - {name: Agency, definition: "Federal agency per 44 U.S.C. § 3502(1); acts through its CIO, requiring offices and CAO", attributes: [name], locator: "§I fn 9, §II", kind: stated, tmodel_mapping: "Party (organization) — ARCH-0001 §2b", notes: "CIO/CAO are roles of the Party, not separate nodes (critic M1)"}
  - {name: SoftwareProducer, definition: "producer of third-party software used by an agency", attributes: [name], locator: "§II", kind: stated, tmodel_mapping: "Party with relational role supplied_by/manufactured_by — ARCH-0001 §2b", notes: ""}
  - {name: Software, definition: "firmware, operating systems, applications, application services (e.g. cloud-based software), and products containing software", attributes: [developed_date, version (Major.Minor.Patch), third_party, agency_developed, critical], locator: "§I", kind: stated, tmodel_mapping: "Product / ProductInstance (versioned) — ARCH-0001 §1", notes: "scope turns on development date and major-version change"}
  - {name: CriticalSoftware, definition: "software classified critical per OMB M-21-30 (EO 14028 §4(g))", attributes: [], locator: "§III.A.1 fn 14", kind: stated, tmodel_mapping: "attribute/classification on Product (new)", notes: "a classification, not a subtype; drives earlier deadline and optional 3PAO/SBOM"}
  - {name: NISTGuidance, definition: "SP 800-218 (SSDF) + NIST Software Supply Chain Security Guidance under EO 14028 §4e", attributes: [version], locator: "Intro p.1", kind: stated, tmodel_mapping: "library record (sp-800-218) -> Requirement set (R-044)", notes: "the requirement baseline being attested to"}
  - {name: SelfAttestation, definition: "producer's statement that it follows the practices itemized in the standard form; the NIST 'conformance statement'", attributes: [producer_name, product_scope, attestation_statement, public_link, date], locator: "§II.1.a-c", kind: stated, tmodel_mapping: "Assertion (by a Party) + Review — ARCH-0001 §4; new: Attestation", notes: "a signed claim of conformance over a Requirement set, at producer/product-line scope"}
  - {name: ThirdPartyAssessment, definition: "assessment by a FedRAMP 3PAO or agency-approved assessor using the NIST Guidance as baseline, accepted in lieu of self-attestation", attributes: [assessor, baseline], locator: "§II.1.d", kind: stated, tmodel_mapping: "Review by an independent Party (new kind: assessment)", notes: ""}
  - {name: Assessor, definition: "FedRAMP 3PAO or agency-approved assessor organization", attributes: [accreditation], locator: "§II.1.d", kind: stated, tmodel_mapping: "Party", notes: ""}
  - {name: PracticeGap, definition: "a practice from the standard form to which the producer cannot attest", attributes: [practice_ref], locator: "§II.1.a.ii", kind: stated, tmodel_mapping: "new — a negative conformance finding per Requirement", notes: "the conformance delta that R-042 must represent"}
  - {name: POAM, definition: "Plan of Action & Milestones for unattested practices, with documentation of mitigating practices", attributes: [gaps, mitigations, milestones, satisfactory], locator: "§II.1.a.ii", kind: stated, tmodel_mapping: "MitigationInstance (kind=process/documentation, R-040) with Milestones (R-041)", notes: "confidential: never posted publicly"}
  - {name: SBOM, definition: "Software Bill of Materials in an NTIA minimum-elements format or CISA successor", attributes: [format, public_link], locator: "§II.2.a-b", kind: stated, tmodel_mapping: "Evidence/WorkProduct; also the source of Component composed_of edges (ARCH-0001 §1)", notes: ""}
  - {name: Artifact, definition: "evidence of conformance other than the SBOM, e.g. outputs of automated integrity and vulnerability checks", attributes: [], locator: "§II.2.d", kind: stated, tmodel_mapping: "Evidence (R-042)", notes: ""}
  - {name: VDPEvidence, definition: "evidence that the producer participates in a Vulnerability Disclosure Program", attributes: [], locator: "§II.2.e", kind: stated, tmodel_mapping: "Evidence", notes: ""}
  - {name: Inventory, definition: "agency inventory of in-scope software, with a separate critical-software inventory", attributes: [items, critical_items], locator: "§III.A.1", kind: stated, tmodel_mapping: "a governed View over Product nodes (R-043)", notes: ""}
  - {name: CentralAttestationSystem, definition: "one central agency system holding non-public attestation letters", attributes: [], locator: "§III.A.2", kind: stated, tmodel_mapping: "none (system of record outside the KG)", notes: ""}
  - {name: Repository, definition: "government-wide repository for software attestations and artifacts (later CISA RSAA)", attributes: [IOC, FOC], locator: "§III.B.2, §III.C.2-4", kind: stated, tmodel_mapping: "none — external store; reference via external_refs", notes: ""}
  - {name: CommonForm, definition: "standard self-attestation form for PRA clearance, incorporating minimum elements of SP 800-218", attributes: [], locator: "§III.C.1, App. A", kind: stated, tmodel_mapping: "library record cisa-ssdf-attestation-form-2024 (template of Attestation)", notes: ""}
  - {name: Extension, definition: "agency request to OMB for more time, with a plan, >= 30 days before a deadline", attributes: [deadline, plan, submitted_at], locator: "§III.A.6", kind: stated, tmodel_mapping: "new — Gate deadline override (R-041)", notes: ""}
  - {name: Waiver, definition: "agency request to OMB to waive specific requirements, exceptional and time-limited, with a risk-mitigation plan", attributes: [requirements, duration, plan, decision], locator: "§III.A.7", kind: stated, tmodel_mapping: "new — Requirement waiver / risk acceptance (R-042)", notes: "decided by OMB Director with APNSA"}
  - {name: Deadline, definition: "dated milestone counted from the memo date or from OMB's repository requirements", attributes: [offset, owner, deliverable], locator: "§III, App. A", kind: stated, tmodel_mapping: "Milestone (R-041)", notes: ""}
  - {name: TrainingPlan, definition: "plan for review and validation of attestations and artifacts", attributes: [], locator: "§III.A.5", kind: stated, tmodel_mapping: "WorkProduct", notes: ""}
edges:
  - {name: produces, from: SoftwareProducer, to: Software, cardinality: "1:N", definition: "producer of the end product", locator: "§II", kind: stated, tmodel_mapping: "Product supplied_by Party (§2b)"}
  - {name: uses, from: Agency, to: Software, cardinality: "N:M", definition: "agency use of third-party software on its systems", locator: "§I", kind: stated, tmodel_mapping: "Deployment / owned_by (inferred)"}
  - {name: attests, from: SoftwareProducer, to: SelfAttestation, cardinality: "1:N", definition: "producer issues the attestation", locator: "§II.1", kind: stated, tmodel_mapping: "PROV wasAttributedTo (§4)"}
  - {name: covers, from: SelfAttestation, to: Software, cardinality: "1:N", definition: "product scope of the attestation (company/product-line level preferred)", locator: "§II.1.c.ii", kind: stated, tmodel_mapping: "new"}
  - {name: conforms_to, from: SelfAttestation, to: NISTGuidance, cardinality: "N:1", definition: "attestation is a conformance statement against the NIST Guidance practices itemized in the form", locator: "§II.1.a, §II.1.c.iii", kind: stated, tmodel_mapping: "R-042 satisfies edge (Requirement set)"}
  - {name: obtains, from: Agency, to: SelfAttestation, cardinality: "N:M", definition: "agency must obtain before use; retains unless public link", locator: "§II.1, §II.1.b", kind: stated, tmodel_mapping: "Review/acceptance by Party"}
  - {name: in_lieu_of, from: ThirdPartyAssessment, to: SelfAttestation, cardinality: "1:1", definition: "assessment accepted instead of self-attestation", locator: "§II.1.d", kind: stated, tmodel_mapping: "alternative Evidence path"}
  - {name: performed_by, from: ThirdPartyAssessment, to: Assessor, cardinality: "N:1", definition: "", locator: "§II.1.d", kind: stated, tmodel_mapping: "PROV wasAssociatedWith"}
  - {name: identifies, from: POAM, to: PracticeGap, cardinality: "1:N", definition: "POA&M lists the practices not attested", locator: "§II.1.a.ii", kind: stated, tmodel_mapping: "new"}
  - {name: mitigates, from: POAM, to: PracticeGap, cardinality: "1:N", definition: "documented mitigating practices + milestones", locator: "§II.1.a.ii", kind: stated, tmodel_mapping: "MitigationInstance mitigates (R-040)"}
  - {name: accepted_by, from: POAM, to: Agency, cardinality: "N:1", definition: "agency finds it satisfactory", locator: "§II.1.a.ii", kind: stated, tmodel_mapping: "Review (approve) — §4/§5"}
  - {name: describes, from: SBOM, to: Software, cardinality: "N:1", definition: "SBOM of the product", locator: "§II.2.a", kind: stated, tmodel_mapping: "Component composed_of derivation"}
  - {name: evidences, from: Artifact, to: SelfAttestation, cardinality: "N:1", definition: "artifacts demonstrate conformance", locator: "§II.2", kind: stated, tmodel_mapping: "Evidence supports Assertion (R-042)"}
  - {name: reciprocal_with, from: Agency, to: Artifact, cardinality: "N:M", definition: "agencies consider reciprocity of artifacts held by other agencies", locator: "§II.2.c", kind: stated, tmodel_mapping: "new — evidence reuse across consumers"}
  - {name: lists, from: Inventory, to: Software, cardinality: "1:N", definition: "", locator: "§III.A.1", kind: stated, tmodel_mapping: "View membership"}
  - {name: extends, from: Extension, to: Deadline, cardinality: "N:1", definition: "", locator: "§III.A.6", kind: stated, tmodel_mapping: "new"}
  - {name: waives, from: Waiver, to: NISTGuidance, cardinality: "N:M", definition: "waiver of specific requirement(s) of the memo", locator: "§III.A.7", kind: stated, tmodel_mapping: "new — Requirement waiver"}
  - {name: due_by, from: Deadline, to: Agency, cardinality: "N:1", definition: "milestone owner (Agency/OMB/CISA/NIST)", locator: "App. A", kind: stated, tmodel_mapping: "Milestone owner Party"}
gaps:
  - "Attestation: a signed, scoped conformance claim by a Party over a Requirement set — tmodel has Assertion+Review (§4) but no first-class Attestation with signatory, scope and baseline version."
  - "PracticeGap / POA&M: a per-Requirement negative finding with a dated remediation plan — R-042 needs 'not satisfied, with accepted plan' as a third conformance state, not just satisfied/unsatisfied."
  - "Waiver / Extension: risk acceptance and deadline override of a Requirement or Milestone, approved by a named authority — not modelled."
  - "Requirement status lifecycle (active -> rescinded) driven by another document — R-044 crosswalk needs time-validity on Requirements."
  - "Scope rules on Software (development date, major-version change, third-party vs agency-developed, critical) — tmodel Product lacks the attributes that decide applicability of a Requirement."
