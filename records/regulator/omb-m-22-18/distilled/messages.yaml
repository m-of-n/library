schema: "library-messages/v1"
record: omb-m-22-18
reviewed_by: ""
note: >
  Documents the memo names as exchanged or produced. Prose-defined only: no encoding, no
  byte layout. Field-level schema of the actual attestation lives in
  cisa-ssdf-attestation-form-2024 (distilled/schema). constrained_by -> requirement ids.
messages:
  - name: self-attestation
    locator: "§II.1, §II.1.c"
    from: producer
    to: agency
    description: "software producer's self-attestation; serves as the NIST Guidance 'conformance statement' (§II.1.a)"
    fields:
      - {name: producer_name, required: true, locator: "§II.1.c.i", constrained_by: ["omb-m-22-18#II.1.c.i"]}
      - {name: product_scope, required: true, locator: "§II.1.c.ii", note: "preferably company or product-line level, inclusive of all unclassified products sold to Federal agencies", constrained_by: ["omb-m-22-18#II.1.c.ii", "omb-m-22-18#II.1.a.i"]}
      - {name: attestation_statement, required: true, locator: "§II.1.c.iii", note: "follows the practices and tasks itemized in the standard self-attestation form", constrained_by: ["omb-m-22-18#II.1.c.iii"]}
      - {name: public_link, required: false, locator: "§II.1.b", note: "if posted publicly, a link in the proposal response replaces agency retention", constrained_by: ["omb-m-22-18#II.1.b"]}
    constrained_by: ["omb-m-22-18#II.1", "omb-m-22-18#II.1.a-2", "omb-m-22-18#II.1.b", "omb-m-22-18#II.1.c"]
  - name: third-party-assessment
    locator: "§II.1.d"
    from: assessor
    to: agency
    fields:
      - {name: assessor, required: true, note: "certified FedRAMP 3PAO or one approved by the agency"}
      - {name: baseline, required: true, note: "must be the NIST Guidance"}
      - {name: scope, required: true, kind: inferred, note: "the product(s), incl. open source or products incorporating open source"}
    constrained_by: ["omb-m-22-18#II.1.d", "omb-m-22-18#II.1.c.iv"]
  - name: partial-attestation-package
    locator: "§II.1.a.ii"
    from: producer
    to: agency
    fields:
      - {name: practices_not_attested, required: true}
      - {name: mitigating_practices_documentation, required: true}
      - {name: poam, required: true, note: "Plan of Action & Milestones"}
    handling: "not posted publicly by vendor or agency"
    constrained_by: ["omb-m-22-18#II.1.a.ii-1", "omb-m-22-18#II.1.a.ii-2", "omb-m-22-18#II.1.a.ii-4"]
  - name: poam-determination
    locator: "§II.1.a.ii"
    from: agency
    to: agency
    fields:
      - {name: satisfactory, type: boolean, required: true}
    constrained_by: ["omb-m-22-18#II.1.a.ii-3"]
  - name: sbom
    locator: "§II.2.a-b"
    from: producer
    to: agency
    fields:
      - {name: format, required: true, note: "a data format defined in the NTIA Minimum Elements report or CISA successor guidance"}
      - {name: public_link, required: false, note: "replaces agency retention"}
    constrained_by: ["omb-m-22-18#II.2.a-1", "omb-m-22-18#II.2.a-2", "omb-m-22-18#II.2.b", "omb-m-22-18#II.2.c"]
  - name: other-artifact
    locator: "§II.2.d"
    from: producer
    to: agency
    description: "e.g. outputs of automated tools validating source-code integrity and checking for known or potential vulnerabilities"
    constrained_by: ["omb-m-22-18#II.2", "omb-m-22-18#II.2.d"]
  - name: vdp-evidence
    locator: "§II.2.e"
    from: producer
    to: agency
    description: "evidence of participation in a Vulnerability Disclosure Program"
    constrained_by: ["omb-m-22-18#II.2.e"]
  - name: requirements-notice
    locator: "§II.2.f, §III.A.2"
    from: agency
    to: producer
    constrained_by: ["omb-m-22-18#II.2.f", "omb-m-22-18#III.A.2", "omb-m-22-18#II-4"]
  - name: extension-request
    locator: "§III.A.6"
    from: agency
    to: omb
    fields:
      - {name: plan_for_meeting_requirements, required: true}
      - {name: submitted_at, required: true, note: ">= 30 days before the relevant deadline"}
    constrained_by: ["omb-m-22-18#III.A.6-1", "omb-m-22-18#III.A.6-2"]
  - name: waiver-request
    locator: "§III.A.7"
    from: agency
    to: omb
    fields:
      - {name: specific_requirements, required: true}
      - {name: risk_mitigation_plan, required: true}
      - {name: duration, required: true, note: "limited duration; exceptional circumstances only"}
      - {name: submitted_at, required: true, note: ">= 30 days before the relevant deadline"}
    constrained_by: ["omb-m-22-18#III.A.7-1", "omb-m-22-18#III.A.7-2", "omb-m-22-18#III.A.7-3"]
  - name: software-inventory
    locator: "§III.A.1"
    from: agency
    to: agency
    fields:
      - {name: in_scope_software, required: true}
      - {name: critical_software, required: true, note: "separate inventory; 'critical software' per M-21-30"}
    constrained_by: ["omb-m-22-18#III.A.1"]
  - name: training-plan
    locator: "§III.A.5"
    from: agency
    to: agency
    constrained_by: ["omb-m-22-18#III.A.5"]
  - name: common-form
    locator: "§III.C.1"
    from: cisa
    to: agency
    note: "realised as cisa-ssdf-attestation-form-2024"
    constrained_by: ["omb-m-22-18#III.C.1", "omb-m-22-18#II.1.e-1"]
  - name: repository-requirements
    locator: "§III.B.2"
    from: omb
    to: cisa
    constrained_by: ["omb-m-22-18#III.B.2"]
