schema: "library-object-model/v1"
record: cisa-secure-by-design-pledge-2024
reviewed_by: ""
question: "What objects and edges does the pledge assume or define?"
objects:
  - {name: Manufacturer, definition: "enterprise software manufacturer (on-prem, cloud, SaaS) serving US customers", attributes: [name], locator: "PRE-1; sign-up template", kind: stated, tmodel_mapping: "Party", notes: ""}
  - {name: Pledge, definition: "voluntary, not legally binding commitment to a good-faith effort on seven goals over one year", attributes: [signed_date, signer_authority], locator: "PRE-3, PRE-7", kind: stated, tmodel_mapping: "new — Commitment (a forward-looking Assertion by a Party)", notes: ""}
  - {name: Goal, definition: "one of seven core criteria, each 'within one year of signing'", attributes: [id, core_criteria, due], locator: "Goals 1-7", kind: stated, tmodel_mapping: "Requirement (time-bound) + Milestone (R-041)", notes: "MFA, default passwords, vulnerability classes, patches, VDP, CVEs, evidence of intrusions"}
  - {name: ExampleApproach, definition: "an optional way to achieve a goal", attributes: [], locator: "'Example approaches' lists", kind: stated, tmodel_mapping: "Mitigation (generic catalog) with kind technical/process (R-040)", notes: ""}
  - {name: ProgressEvidence, definition: "an example artifact demonstrating measurable progress (statistics, blog, roadmap, policy)", attributes: [kind, published_date], locator: "'Examples of demonstrating measurable progress'", kind: stated, tmodel_mapping: "Evidence (R-042)", notes: "public by default"}
  - {name: Metric, definition: "a measurable quantity tracked over time (MFA adoption by user/MFA type; products with default passwords; customers transitioned; patch adoption by version; CVE root-cause CWE)", attributes: [breakdown, time_series], locator: "G1-M1, G2-M2, G2-M3, G3-M1, G4-M1", kind: stated, tmodel_mapping: "none — new (measured outcome)", notes: "outcome measures, not practices"}
  - {name: Roadmap, definition: "published plan for remaining products, memory safety / vulnerability classes, or logging", attributes: [], locator: "PRE-9, G3-M2, G7-M2", kind: stated, tmodel_mapping: "SDL plan / governed view (R-043) with Milestones", notes: ""}
  - {name: Product, definition: "the manufacturer's products; a subset may be addressed first", attributes: [baseline_version, end_of_life, internet_facing], locator: "PRE-9, G2-C, G4-A3", kind: stated, tmodel_mapping: "Product", notes: ""}
  - {name: VulnerabilityClass, definition: "class of vulnerability preventable at scale (SQLi, XSS, memory safety) — chosen by the manufacturer", attributes: [cwe], locator: "Goal 3", kind: stated, tmodel_mapping: "Weakness (CWE)", notes: ""}
  - {name: VDP, definition: "vulnerability disclosure policy with four required elements", attributes: [testing_authorization, safe_harbor, channel, disclosure], locator: "Goal 5", kind: stated, tmodel_mapping: "process mitigation (R-040) + documentation", notes: ""}
  - {name: CVERecord, definition: "CVE record with accurate CWE and CPE; issued timely for critical/high vulnerabilities needing customer action or actively exploited", attributes: [cwe, cpe, issued_date], locator: "Goal 6", kind: stated, tmodel_mapping: "Finding/Vulnerability with Weakness link", notes: ""}
  - {name: Log, definition: "customer-available logs (configuration, identity/network flows, data access), retained e.g. 6 months for cloud", attributes: [category, retention], locator: "Goal 7", kind: stated, tmodel_mapping: "technical mitigation / product capability", notes: ""}
  - {name: Customer, definition: "user/administrator whose behaviour (MFA, patching) is measured", attributes: [user_type], locator: "Goals 1, 4", kind: stated, tmodel_mapping: "Party (consumer role)", notes: ""}
  - {name: CISA, definition: "receives sign-ups and challenge reports, lists signers and progress reports; does not enforce nor verify", attributes: [], locator: "PRE-5, WEB-3", kind: stated, tmodel_mapping: "Party", notes: ""}
edges:
  - {name: signs, from: Manufacturer, to: Pledge, cardinality: "1:0..1", definition: "", locator: "PRE-3", kind: stated, tmodel_mapping: "PROV wasAttributedTo"}
  - {name: comprises, from: Pledge, to: Goal, cardinality: "1:7", definition: "", locator: "p.1 'structured with seven goals'", kind: stated, tmodel_mapping: "Requirement set membership"}
  - {name: achieved_by, from: Goal, to: ExampleApproach, cardinality: "1:N", definition: "optional approaches; discretion to choose", locator: "PRE-8", kind: stated, tmodel_mapping: "Requirement satisfied_by Mitigation"}
  - {name: evidenced_by, from: Goal, to: ProgressEvidence, cardinality: "1:N", definition: "", locator: "PRE-4", kind: stated, tmodel_mapping: "Requirement evidenced_by Evidence (R-042)"}
  - {name: measures, from: ProgressEvidence, to: Metric, cardinality: "N:M", definition: "", locator: "G1-M1, G4-M1", kind: stated, tmodel_mapping: "new"}
  - {name: applies_to, from: Goal, to: Product, cardinality: "N:M", definition: "all products or a chosen subset plus roadmap", locator: "PRE-9", kind: stated, tmodel_mapping: "applicability scope"}
  - {name: targets, from: Goal, to: VulnerabilityClass, cardinality: "1:N", definition: "Goal 3 picks one or more classes", locator: "G3-C1", kind: stated, tmodel_mapping: "Mitigation mitigates Weakness"}
  - {name: annotated_with, from: CVERecord, to: VulnerabilityClass, cardinality: "N:1", definition: "CWE field", locator: "Goal 6", kind: stated, tmodel_mapping: "Vulnerability instance_of Weakness"}
  - {name: plans, from: Roadmap, to: Product, cardinality: "1:N", definition: "", locator: "PRE-9", kind: stated, tmodel_mapping: "Milestone over Product"}
  - {name: reports_to, from: Manufacturer, to: CISA, cardinality: "N:1", definition: "challenge report when no measurable progress", locator: "PRE-5", kind: stated, tmodel_mapping: "message"}
  - {name: behaviour_of, from: Metric, to: Customer, cardinality: "N:M", definition: "customer-behaviour metrics (MFA use, version distribution)", locator: "G1-N2, G4-N1", kind: stated, tmodel_mapping: "new"}
gaps:
  - "Commitment (forward-looking, time-boxed, voluntary) as distinct from Attestation (present-tense) — tmodel Assertion has no modality/time-horizon."
  - "Outcome Metrics over time (adoption rates, counts) as conformance evidence — R-042 is practice/mitigation-based; the pledge measures customer-side outcomes."
  - "Interpretation rules on metrics (a short-term CVE rise counts as success) — conformance checks need direction/horizon semantics."
