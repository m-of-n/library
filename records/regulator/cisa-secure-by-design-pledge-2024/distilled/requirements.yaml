reconciliation: "Not a BCP 14 document: 0 uppercase keywords in source and extraction. The pledge's normative units are the 7 GOAL statements (pledged core criteria) plus preamble commitments; its modal forms are lowercase should / encouraged / may / could. Every GOAL, every CONTEXT sentence that carries should/defines/can-pick, every example approach, every example of demonstrating progress and every Note is extracted (examples typed example-approach / example-evidence, not requirements). Residue in note."
note: "Ids: PRE-n preamble; WEB-n statements present only on the live web page (verified against the cached page text); G<n> goal; G<n>-C<k> context directive; G<n>-A<k> example approach; G<n>-M<k> example of demonstrating progress; G<n>-N<k> note. related_inferred points at the SbD whitepaper practices each goal operationalises — LANE JUDGEMENT, not source-published (the pledge says only that it 'complement[s] and build[s] on' existing best practices and cites the first SbD principle in Goal 4), so no maps_to is given. Own-form residue (grep -o -w -i): should: PDF 9, extracted 9 = 7 from the PDF + 2 web-only (WEB-1, WEB-2); the two 'should' in Goal 6 CONTEXT ('actions that customers should take', 'actions they should take') are descriptive and not extracted; may 3/3, encouraged 4/4, will 1/1, required 1/1, recommend* 1/1 all inside extracted texts (the 'may' are epistemic but sit inside extracted sentences)."
