schema: "library-protocol/v1"
record: cisa-secure-by-design-pledge-2024
reviewed_by: ""
note: "Only the exchanges the pledge PDF and web page state."
roles:
  - {name: manufacturer, locator: "PRE-1..PRE-10"}
  - {name: cisa, locator: "web page; PRE-5"}
  - {name: public, description: "customers, researchers, other manufacturers reading publications", locator: "PRE-4, PRE-6"}
flows:
  - name: sign
    steps:
      - {from: manufacturer, to: cisa, message: sign-up-email, locator: "web page mailto (SecureByDesign@cisa.dhs.gov)"}
      - {from: cisa, to: public, message: signer-listing, locator: "web page 'Pledge Signers'", kind: inferred}
  - name: report-progress
    steps:
      - {from: manufacturer, to: public, message: progress-publication, locator: "PRE-4, PRE-10, G<n>-M<k>", timing: "within one year of signing"}
      - {from: cisa, to: public, message: progress-report-listing, locator: "https://www.cisa.gov/securebydesign/pledge/progress-reports", kind: inferred}
  - name: report-challenges
    steps:
      - {from: manufacturer, to: cisa, message: challenges-report, locator: "PRE-5", timing: "within one year of signing", guard: "no measurable progress"}
      - {from: manufacturer, to: public, message: approach-publication, locator: "PRE-6", optional: true}
