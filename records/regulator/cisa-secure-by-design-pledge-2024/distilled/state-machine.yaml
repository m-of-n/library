schema: "library-state-machine/v1"
record: cisa-secure-by-design-pledge-2024
reviewed_by: ""
note: "Lifecycle of one manufacturer's pledge, and of one goal within it. States named by us; transitions grounded in the preamble (PRE-*) and web page. CISA neither enforces nor verifies (WEB-3), so no state is 'verified'."
machines:
  - name: pledge
    initial: not-signed
    states:
      - {name: not-signed, kind: inferred, locator: "web page 'Take the Pledge'"}
      - {name: signed, kind: stated, locator: "PRE-3; sign-up template", description: "manufacturer pledged a good-faith effort over the following year"}
      - {name: reporting-due, kind: stated, locator: "PRE-4, PRE-5", description: "one year after signing"}
      - {name: reported, kind: stated, locator: "PRE-4..PRE-6, PRE-10; progress-reports page", description: "progress documented publicly and/or shared with CISA"}
      - {name: not-reported, kind: inferred, locator: "PRE-7 (voluntary, not legally binding)", description: "no consequence defined"}
    transitions:
      - {from: not-signed, to: signed, trigger: sign-up-email, guard: "enterprise software manufacturer serving US customers; signer has authority to commit the company", locator: "web page mailto template"}
      - {from: signed, to: reporting-due, trigger: "signing date + 1 year", locator: "PRE-4, PRE-5; every GOAL 'Within one year of signing'"}
      - {from: reporting-due, to: reported, trigger: progress-publication, locator: "PRE-4, PRE-10", note: "also CISA progress-reports page listing"}
      - {from: reporting-due, to: reported, trigger: challenges-report, guard: "no measurable progress on a goal", notes: "trigger renamed by verifier 2026-10-03 from report-to-cisa to the defined message challenges-report (messages.yaml)", locator: "PRE-5"}
      - {from: reporting-due, to: not-reported, trigger: "no publication or report", kind: inferred, locator: "PRE-7"}
  - name: goal-status
    entity: "one of the 7 goals for one signer"
    initial: pledged
    states:
      - {name: pledged, kind: stated, locator: "PRE-3"}
      - {name: already-met, kind: stated, locator: "PRE-10", description: "manufacturer already meets or exceeds the goal -> should publicly describe how"}
      - {name: measurable-progress, kind: stated, locator: "PRE-4", description: "should publicly document how progress was achieved"}
      - {name: no-measurable-progress, kind: stated, locator: "PRE-5, PRE-6", description: "encouraged to tell CISA (and publicly) how it worked towards the goal and challenges"}
    transitions:
      - {from: pledged, to: already-met, trigger: "self-assessment at signing", locator: "PRE-10"}
      - {from: pledged, to: measurable-progress, trigger: "evidence published (G<n>-M<k>)", guard: "within one year", locator: "PRE-4"}
      - {from: pledged, to: no-measurable-progress, trigger: "one year elapses", locator: "PRE-5"}
