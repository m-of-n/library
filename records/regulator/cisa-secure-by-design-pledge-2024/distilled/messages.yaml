schema: "library-messages/v1"
record: cisa-secure-by-design-pledge-2024
reviewed_by: ""
messages:
  - name: sign-up-email
    locator: "web page mailto link (snapshot 2026-09-20)"
    from: manufacturer
    to: "SecureByDesign@cisa.dhs.gov"
    subject: "Taking CISA's Secure by Design Pledge"
    fields:
      - {name: company_name, required: true, note: "[INSERT NAME]"}
      - {name: confirm_enterprise_software_manufacturer_us_customers, type: boolean, required: true}
      - {name: confirm_reviewed_pledge_and_authority_to_commit, type: boolean, required: true}
    constrained_by: ["cisa-secure-by-design-pledge-2024#PRE-1", "cisa-secure-by-design-pledge-2024#PRE-3"]
  - name: progress-publication
    locator: "PRE-4, PRE-10; Examples of demonstrating progress"
    from: manufacturer
    to: public
    description: "per-goal public evidence; the form is at the manufacturer's discretion (PRE-8)"
    variants:
      - {goal: G1, items: ["MFA adoption statistics by user type and MFA type", "blog post", "standards participation"]}
      - {goal: G2, items: ["blog post", "count of products with default passwords over time", "count of customers transitioned"]}
      - {goal: G3, items: ["blog incl. CWE root-cause analysis of CVEs over time", "memory-safety or other vulnerability-class roadmap"]}
      - {goal: G4, items: ["patch adoption statistics by product", "blog post"]}
      - {goal: G5, items: ["public VDP with the four Goal-5 elements", "machine-readable VDP e.g. security.txt", "lessons-learned blog"]}
      - {goal: G6, items: ["CWE and CPE in every CVE record", "public CVE issuance policy"]}
      - {goal: G7, items: ["log provision and retention policy", "logging roadmap"]}
    constrained_by: ["cisa-secure-by-design-pledge-2024#PRE-4", "cisa-secure-by-design-pledge-2024#PRE-8", "cisa-secure-by-design-pledge-2024#PRE-9", "cisa-secure-by-design-pledge-2024#PRE-10"]
  - name: challenges-report
    locator: "PRE-5"
    from: manufacturer
    to: cisa
    fields:
      - {name: how_worked_towards_goal, required: true}
      - {name: challenges, required: true}
    constrained_by: ["cisa-secure-by-design-pledge-2024#PRE-5"]
  - name: vdp
    locator: "Goal 5"
    from: manufacturer
    to: public
    fields:
      - {name: testing_authorization, required: true, note: "authorizes testing by members of the public on products offered"}
      - {name: no_legal_action_commitment, required: true, note: "not recommending or pursuing legal action against good-faith researchers"}
      - {name: reporting_channel, required: true}
      - {name: public_disclosure_allowed, required: true, note: "in line with CVD best practices and international standards"}
    constrained_by: ["cisa-secure-by-design-pledge-2024#G5", "cisa-secure-by-design-pledge-2024#G5-M2"]
  - name: cve-record
    locator: "Goal 6"
    from: manufacturer (as CNA or via CNA)
    to: public
    fields:
      - {name: cwe, required: true}
      - {name: cpe, required: true}
    constrained_by: ["cisa-secure-by-design-pledge-2024#G6", "cisa-secure-by-design-pledge-2024#G6-2"]
