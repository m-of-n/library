gaps:
  - "Incident / SevereIncident / NearMiss: tmodel has ThreatInstance and Finding but no operational incident object; CRA reporting needs one."
  - "Notification as a staged, deadline-bound outbound regulatory report (early warning / notification / intermediate / final) with clocks anchored to awareness, fix availability and prior submission — no tmodel equivalent; needed to automate an Art 14 conformity check (R-042)."
  - "SupportPeriod as a dated, product-level window with a legal minimum (5 years) and published end date; ARCH §3b has the phase enum but no dated window object (valid_from/valid_to still owed)."
  - "Vulnerability state 'actively exploited' (evidence-bearing) and 'known exploitable' at release — needs a state attribute with provenance (Assertion + Review), not a boolean."
  - "Jurisdiction: MemberState / main establishment / made_available_in — tmodel has no market/jurisdiction object."
  - "Requirement applicability with written justification (Art 13(3)-(4)): Requirement needs applicable: bool + justification + implementation pointer, per product."
  - "CE marking / DoC as a conformity claim covering product AND processes — the SDL (process) and the product are certified together; R-041 SDL object must be linkable to a product conformity claim."
  - "Single point of contact / CVD policy as Party-facing artefacts with retention obligations (10 years)."
