schema: "library-object-model/v1"
record: eu-cra-2024-2847
question: "What entity types and relationship edges does the CRA assume or define?"
note: >
  Read from Art 3 (definitions), Arts 13-17, 24, 31, 69, 71 and Annexes I, II, VII. kind: stated = defined or
  explicitly named by the Regulation; inferred = needed to connect what the text says, flagged. tmodel_mapping
  names an ARCH-0001 v0.2.0 class (tmodel spec/ARCH-0001-PROPOSAL-v0.2.0.md), a DL-0009 proposal (Gate, Requirement,
  WorkProduct, Evidence, governed view; R-040..R-044), 'new', or 'none'.

objects:
  # ---- parties ----
  - {name: EconomicOperator, definition: "the manufacturer, the authorised representative, the importer, the distributor, or other natural or legal person who is subject to obligations in relation to the manufacture of products with digital elements or to the making available of products with digital elements on the market", attributes: [name, establishment_member_state], locator: "Art. 3(12)", kind: stated, tmodel_mapping: "Party (ARCH §2b) — the roles are RELATIONAL edges, not subtypes", notes: "CRA itself treats roles relationally: Art 21-22 make an importer/distributor a manufacturer when it markets under its own name or substantially modifies"}
  - {name: Manufacturer, definition: "a natural or legal person who develops or manufactures products with digital elements or has products with digital elements designed, developed or manufactured, and markets them under its name or trademark, whether for payment, monetisation or free of charge", attributes: [name_or_trademark, postal_address, digital_contact, website, main_establishment_member_state, enterprise_size], locator: "Art. 3(13); Art. 13(16); Art. 14(7)", kind: stated, tmodel_mapping: "Party + manufactured_by edge", notes: "enterprise_size (micro/small) changes penalty exposure (Art 64(10)(a))"}
  - {name: AuthorisedRepresentative, definition: "a natural or legal person established within the Union who has received a written mandate from a manufacturer to act on its behalf in relation to specified tasks", attributes: [member_state], locator: "Art. 3(15)", kind: stated, tmodel_mapping: "Party (role edge)", notes: ""}
  - {name: Importer, definition: "a natural or legal person established in the Union who places on the market a product with digital elements that bears the name or trademark of a natural or legal person established outside the Union", attributes: [member_state], locator: "Art. 3(16)", kind: stated, tmodel_mapping: "Party (role edge)", notes: ""}
  - {name: Distributor, definition: "a natural or legal person in the supply chain, other than the manufacturer or the importer, that makes a product with digital elements available on the Union market without affecting its properties", attributes: [member_state], locator: "Art. 3(17)", kind: stated, tmodel_mapping: "Party (role edge supplied_by)", notes: ""}
  - {name: OpenSourceSoftwareSteward, definition: "a legal person, other than a manufacturer, that has the purpose or objective of systematically providing support on a sustained basis for the development of specific products with digital elements, qualifying as free and open-source software and intended for commercial activities, and that ensures the viability of those products", attributes: [cybersecurity_policy], locator: "Art. 3(14); Art. 24", kind: stated, tmodel_mapping: "Party (role edge)", notes: "light-touch regime: policy, cooperation, partial Art 14"}
  - {name: User, definition: "not defined; the person using the product (Consumer is defined as a natural person acting outside trade)", attributes: [preferred_communication_means], locator: "Art. 3(18); Art. 13(17); Art. 14(8)", kind: inferred, tmodel_mapping: "Party (consumer role) / ExternalEntity resolves to Party", notes: "'business user' appears for tailor-made products (Annex I Part I(2)(b), Part II(8))"}
  - {name: ComponentMaintainer, definition: "the person or entity manufacturing or maintaining the component", attributes: [], locator: "Art. 13(6)", kind: stated, tmodel_mapping: "Party (supplier role of a Component)", notes: ""}
  - {name: CSIRTDesignatedAsCoordinator, definition: "a CSIRT designated as coordinator pursuant to Article 12(1) of Directive (EU) 2022/2555", attributes: [member_state, notification_end_point], locator: "Art. 3(51); Art. 14(7); Art. 16", kind: stated, tmodel_mapping: "Party (intrinsic classification 'csirt'; cf ARCH §2b 'cna')", notes: "two roles per notification: initially-receiving and relevant (DR-2026/881 Art 2)"}
  - {name: ENISA, definition: "European Union Agency for Cybersecurity; establishes and operates the single reporting platform", attributes: [], locator: "Art. 16(1)", kind: stated, tmodel_mapping: "Party (singleton)", notes: ""}
  - {name: MarketSurveillanceAuthority, definition: "a market surveillance authority as defined in Article 3, point (4), of Regulation (EU) 2019/1020", attributes: [member_state], locator: "Art. 3(33)", kind: stated, tmodel_mapping: "Party", notes: "the auditor role for conformity (R-042) in the real world"}
  - {name: NotifiedBody, definition: "a conformity assessment body designated in accordance with Article 43 and other relevant Union harmonisation legislation", attributes: [identification_number], locator: "Art. 3(29)", kind: stated, tmodel_mapping: "Party (assessor)", notes: "Chapter IV not extracted"}
  - {name: ADCO, definition: "the dedicated administrative cooperation group established pursuant to Article 52(15)", attributes: [], locator: "Art. 13(8), 13(25)", kind: stated, tmodel_mapping: "Party", notes: ""}
  - {name: MemberState, definition: "an EU Member State; target of dissemination and locus of main establishment", attributes: [code], locator: "Art. 14(2)(a), 14(7)", kind: stated, tmodel_mapping: "new (jurisdiction)", notes: "tmodel has no jurisdiction/market object"}
  # ---- product ----
  - {name: ProductWithDigitalElements, definition: "a software or hardware product and its remote data processing solutions, including software or hardware components being placed on the market separately", attributes: [type_batch_serial_identifier, name_and_type, intended_purpose, software_versions, product_class, tailor_made, placed_on_market_date, member_states_made_available], locator: "Art. 3(1); Art. 13(15); Annex II(3); Annex VII(1)", kind: stated, tmodel_mapping: "Product / ProductInstance (ARCH §1.1)", notes: "the CRA's unit of obligation is the product TYPE placed on the market; serial/batch identify instances"}
  - {name: RemoteDataProcessingSolution, definition: "data processing at a distance for which the software is designed and developed by the manufacturer, or under the responsibility of the manufacturer, and the absence of which would prevent the product with digital elements from performing one of its functions", attributes: [], locator: "Art. 3(2)", kind: stated, tmodel_mapping: "Component (cloud backend) + Deployment", notes: "pulls the vendor backend into product scope; SaaS as such is out (recital 12)"}
  - {name: Component, definition: "software or hardware intended for integration into an electronic information system", attributes: [maintainer, is_foss, support_period], locator: "Art. 3(6); Art. 13(5)-(6)", kind: stated, tmodel_mapping: "Component (purl/CPE)", notes: ""}
  - {name: FreeAndOpenSourceSoftware, definition: "software the source code of which is openly shared and which is made available under a free and open-source licence which provides for all rights to make it freely accessible, usable, modifiable and redistributable", attributes: [licence], locator: "Art. 3(48)", kind: stated, tmodel_mapping: "Component attribute (license)", notes: ""}
  - {name: ProductClass, definition: "important (Class I, Class II) or critical product category, determining the conformity assessment route", attributes: [class], locator: "Arts. 7-8; Annexes III-IV (not extracted); Implementing Reg (EU) 2025/2392", kind: stated, tmodel_mapping: "new", notes: "not extracted here; listed for completeness"}
  - {name: IntendedPurpose, definition: "the use for which a product with digital elements is intended by the manufacturer, including the specific context and conditions of use", attributes: [], locator: "Art. 3(23)", kind: stated, tmodel_mapping: "Product attribute; Environment (ARCH §3)", notes: "with reasonably foreseeable use (3(24)) and misuse (3(25)) it bounds the threat model scope"}
  - {name: SupportPeriod, definition: "the period during which a manufacturer is required to ensure that vulnerabilities of a product with digital elements are handled effectively and in accordance with the essential cybersecurity requirements set out in Part II of Annex I", attributes: [start, end_month_year, rationale, technical_support_type], locator: "Art. 3(20); Art. 13(8), 13(19); Annex II(7); Annex VII(4)", kind: stated, tmodel_mapping: "new — maps to LifecyclePhase operation..end-of-support with valid_from/valid_to (ARCH §3b)", notes: "a dated, product-level window; the strongest legal anchor for the lifecycle axis"}
  - {name: SubstantialModification, definition: "a change to the product with digital elements following its placing on the market, which affects the compliance of the product with digital elements with the essential cybersecurity requirements set out in Part I of Annex I or which results in a modification to the intended purpose for which the product with digital elements has been assessed", attributes: [], locator: "Art. 3(30); Art. 69(2)", kind: stated, tmodel_mapping: "new (version-change event on ProductInstance)", notes: ""}
  # ---- risk & requirements ----
  - {name: CybersecurityRisk, definition: "the potential for loss or disruption caused by an incident and is to be expressed as a combination of the magnitude of such loss or disruption and the likelihood of occurrence of the incident", attributes: [magnitude, likelihood], locator: "Art. 3(37)", kind: stated, tmodel_mapping: "RiskScore (ARCH §3 risk metric, DEC-003)", notes: "magnitude x likelihood — compatible with DEC-003; 'significant' variant Art 3(38)"}
  - {name: CybersecurityRiskAssessment, definition: "the documented assessment of cybersecurity risks, at least an analysis based on intended purpose, reasonably foreseeable use and conditions of use, indicating applicability and implementation of each Annex I Part I(2) requirement", attributes: [version, assets_to_be_protected, operational_environment, expected_use_time, applicability_per_requirement, justification_for_non_applicable], locator: "Art. 13(2)-(4); Annex VII(3)", kind: stated, tmodel_mapping: "the threat model itself (TM governed view, R-043) — WorkProduct", notes: "THE hook for tmodel: a threat model is how a manufacturer evidences Art 13(2)-(3)"}
  - {name: EssentialCybersecurityRequirement, definition: "a requirement of Annex I: Part I (product properties, points (1) and (2)(a)-(m)) or Part II (vulnerability handling, points (1)-(8))", attributes: [part, point, applicable, implementation, justification], locator: "Annex I", kind: stated, tmodel_mapping: "Requirement (DL-0009 R-042/R-044)", notes: "Part I = product property; Part II = process; DoC/CE cover both (Art 3(31))"}
  - {name: HarmonisedStandard, definition: "a harmonised standard as defined in Article 2, point (1)(c), of Regulation (EU) No 1025/2012", attributes: [reference, oj_citation, parts_applied], locator: "Art. 3(36); Art. 27; Annex VII(5)", kind: stated, tmodel_mapping: "library record (published_by Party)", notes: "presumption of conformity only once cited in OJ; none cited as of 2026-10-02"}
  # ---- vulnerability & incident ----
  - {name: Vulnerability, definition: "a weakness, susceptibility or flaw of a product with digital elements that can be exploited by a cyber threat", attributes: [description, severity, impact, affected_product, affected_components], locator: "Art. 3(40)", kind: stated, tmodel_mapping: "Finding/Vulnerability (ARCH §1.3)", notes: ""}
  - {name: ExploitableVulnerability, definition: "a vulnerability that has the potential to be effectively used by an adversary under practical operational conditions", attributes: [], locator: "Art. 3(41); Annex I Part I(2)(a)", kind: stated, tmodel_mapping: "Vulnerability + exploitability (VEX status)", notes: "release gate: none known (Annex I Part I(2)(a))"}
  - {name: ActivelyExploitedVulnerability, definition: "a vulnerability for which there is reliable evidence that a malicious actor has exploited it in a system without permission of the system owner", attributes: [aware_at, evidence, malicious_actor_information], locator: "Art. 3(42); Art. 14(1)-(2)", kind: stated, tmodel_mapping: "Vulnerability state (cf KEV) — new state value", notes: "a STATE of a Vulnerability, not a subtype: SM1 trigger"}
  - {name: Incident, definition: "an incident as defined in Article 6, point (6), of Directive (EU) 2022/2555; for the CRA, one 'having an impact on the security of the product' negatively affects or is capable of negatively affecting the ability of a product to protect the availability, authenticity, integrity or confidentiality of data or functions", attributes: [aware_at, nature, initial_assessment, root_cause, suspected_malicious], locator: "Art. 3(43)-(44)", kind: stated, tmodel_mapping: "new (tmodel has no Incident; closest is ThreatInstance realised)", notes: ""}
  - {name: SevereIncident, definition: "an incident having an impact on the security of the product that meets Art 14(5)(a) or (b)", attributes: [severity_ground], locator: "Art. 14(5)", kind: stated, tmodel_mapping: "new", notes: "a classification of Incident"}
  - {name: NearMiss, definition: "a near miss as defined in Article 6, point (5), of Directive (EU) 2022/2555", attributes: [], locator: "Art. 3(45); Art. 15(2)", kind: stated, tmodel_mapping: "none", notes: ""}
  - {name: CyberThreat, definition: "a cyber threat as defined in Article 2, point (8), of Regulation (EU) 2019/881", attributes: [], locator: "Art. 3(46); Art. 15(1)", kind: stated, tmodel_mapping: "ThreatInstance / AttackPattern (ARCH §1.3)", notes: ""}
  - {name: MaliciousActor, definition: "the actor that has exploited or is exploiting a vulnerability", attributes: [], locator: "Art. 3(42); Art. 14(2)(c)(ii)", kind: inferred, tmodel_mapping: "ThreatActor facet of Party (ARCH §2b critic M1)", notes: ""}
  # ---- mitigation & disclosure artefacts ----
  - {name: SecurityUpdate, definition: "an update addressing vulnerabilities, distributed securely, separately from functionality updates where technically feasible, free of charge, with advisory messages, available >= 10 years", attributes: [issued_at, automatic, separate_from_functionality, free_of_charge, advisory_message], locator: "Annex I Part I(2)(c); Part II(2),(7),(8); Art. 13(9)", kind: stated, tmodel_mapping: "MitigationInstance kind=technical (R-040)", notes: ""}
  - {name: CorrectiveOrMitigatingMeasure, definition: "a security update or other corrective measure, or a mitigating measure that users can take", attributes: [available_at, actor_manufacturer_or_user], locator: "Art. 14(2)(b)-(c), 14(4)(b), 14(8); Art. 17(5)", kind: stated, tmodel_mapping: "MitigationInstance (technical | documentation via user guidance) — R-040", notes: "availability timestamp drives T14d"}
  - {name: SecurityAdvisory, definition: "public information about fixed vulnerabilities: description, affected product identification, impacts, severity, remediation information", attributes: [published_at, deferred_until], locator: "Annex I Part II(4)", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation (R-040) / governed view", notes: ""}
  - {name: CoordinatedVulnerabilityDisclosurePolicy, definition: "policy on coordinated vulnerability disclosure, put in place and enforced", attributes: [location_url], locator: "Annex I Part II(5); Art. 13(8); Annex II(2); Annex VII(2)(b)", kind: stated, tmodel_mapping: "MitigationInstance kind=process (R-040) / WorkProduct", notes: ""}
  - {name: SinglePointOfContact, definition: "a single point of contact to enable users to communicate directly and rapidly with the manufacturer, including to report vulnerabilities", attributes: [means_of_communication], locator: "Art. 13(17); Annex II(2); Annex I Part II(6)", kind: stated, tmodel_mapping: "new (Party contact facet)", notes: ""}
  - {name: SoftwareBillOfMaterials, definition: "a formal record containing details and supply chain relationships of components included in the software elements of a product with digital elements", attributes: [format, top_level_dependencies, generated_at], locator: "Art. 3(39); Annex I Part II(1); Annex VII(8)", kind: stated, tmodel_mapping: "composed_of / uses_component edges (ARCH §1.1) materialised as a WorkProduct; library records spdx-3-0-1, cyclonedx-1-7", notes: ""}
  # ---- documentation & conformity ----
  - {name: TechnicalDocumentation, definition: "documentation containing all relevant data or details of the means used to ensure conformity with Annex I, at least the Annex VII elements; drawn up before placing on the market and continuously updated during the support period", attributes: [version, language, elements_annex_vii], locator: "Art. 31; Annex VII; Art. 13(12)-(13)", kind: stated, tmodel_mapping: "governed document view (R-043) over KG state", notes: "a versioned, retained (>=10y) projection — exactly R-043's shape"}
  - {name: UserInformation, definition: "information and instructions to the user (Annex II), clear, legible, retained and online >= 10 years", attributes: [items_1_to_9, language, url], locator: "Art. 13(18); Annex II", kind: stated, tmodel_mapping: "governed document view (R-043); MitigationInstance kind=documentation where it carries secure-use guidance", notes: ""}
  - {name: EUDeclarationOfConformity, definition: "declaration drawn up per Art 28 / Annex V (or simplified per Annex VI) once conformity is demonstrated", attributes: [url, simplified], locator: "Art. 13(12), 13(20); Annexes V-VI", kind: stated, tmodel_mapping: "Review/approval node on a governed view (R-043) — a signed attestation", notes: ""}
  - {name: CEMarking, definition: "a marking by which a manufacturer indicates that a product with digital elements and the processes put in place by the manufacturer are in conformity with the essential cybersecurity requirements set out in Annex I", attributes: [], locator: "Art. 3(31)", kind: stated, tmodel_mapping: "new (conformity claim on Product)", notes: "covers product AND processes"}
  - {name: ConformityAssessment, definition: "the process of verifying whether the essential cybersecurity requirements set out in Annex I have been fulfilled", attributes: [procedure_module, notified_body, certificate], locator: "Art. 3(27); Art. 13(12); Art. 32", kind: stated, tmodel_mapping: "conformity check (R-042) + Gate (R-041)", notes: "the 'placing on the market' gate"}
  - {name: TestReport, definition: "reports of the tests carried out to verify conformity of the product and of the vulnerability handling processes", attributes: [], locator: "Annex VII(6); Annex I Part II(3)", kind: stated, tmodel_mapping: "Evidence (DL-0009)", notes: ""}
  # ---- reporting infrastructure ----
  - {name: SingleReportingPlatform, definition: "a single reporting platform established by ENISA, whose architecture allows Member States and ENISA to put in place their own electronic notification end-points", attributes: [end_points], locator: "Art. 16(1)", kind: stated, tmodel_mapping: "none (external system; export target)", notes: "live 2026-09-11"}
  - {name: NotificationEndPoint, definition: "electronic notification end-point of a CSIRT designated as coordinator or ENISA", attributes: [member_state], locator: "Art. 14(7); Art. 16(1)", kind: stated, tmodel_mapping: "none", notes: ""}
  - {name: Notification, definition: "a submission under Art 14 (mandatory) or Art 15 (voluntary): early warning, notification, intermediate report, final report", attributes: [subject, stage, submitted_at, sensitivity, member_states_made_available, mandatory], locator: "Art. 14(2), 14(4), 14(6); Art. 15", kind: stated, tmodel_mapping: "new — an outbound regulatory report; could be a governed view (R-043) over Vulnerability/Incident state", notes: "staged, deadline-bound; see messages.yaml"}
  - {name: Dissemination, definition: "forwarding of a notification by the initially receiving CSIRT to relevant CSIRTs, possibly delayed", attributes: [delayed, ground, expected_at], locator: "Art. 16(2), 16(6); DR-2026/881", kind: stated, tmodel_mapping: "none", notes: ""}
  - {name: EuropeanVulnerabilityDatabase, definition: "the European vulnerability database established pursuant to Article 12(2) of Directive (EU) 2022/2555", attributes: [], locator: "Art. 17(5)", kind: stated, tmodel_mapping: "external ref (like NVD/CVE)", notes: ""}

edges:
  - {name: manufactured_by, from: ProductWithDigitalElements, to: Manufacturer, cardinality: "N:1", definition: "develops or manufactures ... and markets them under its name or trademark", locator: "Art. 3(13)", kind: stated, tmodel_mapping: "manufactured_by (ARCH §2b)"}
  - {name: placed_on_market_by, from: ProductWithDigitalElements, to: EconomicOperator, cardinality: "N:M", definition: "first making available on the Union market (manufacturer or importer)", locator: "Art. 3(16), 3(21)", kind: stated, tmodel_mapping: "supplied_by (ARCH §2b)"}
  - {name: made_available_in, from: ProductWithDigitalElements, to: MemberState, cardinality: "N:M", definition: "Member States on the territory of which the manufacturer is aware that their product with digital elements has been made available", locator: "Art. 14(2)(a), 14(4)(a); Art. 16(2)", kind: stated, tmodel_mapping: "new"}
  - {name: integrates, from: ProductWithDigitalElements, to: Component, cardinality: "N:M", definition: "components sourced from third parties integrated in the product", locator: "Art. 13(5)-(6)", kind: stated, tmodel_mapping: "composed_of / uses_component"}
  - {name: maintained_by, from: Component, to: ComponentMaintainer, cardinality: "N:1", definition: "the person or entity manufacturing or maintaining the component", locator: "Art. 13(6)", kind: stated, tmodel_mapping: "supplied_by"}
  - {name: stewarded_by, from: FreeAndOpenSourceSoftware, to: OpenSourceSoftwareSteward, cardinality: "N:M", definition: "systematically providing support on a sustained basis", locator: "Art. 3(14)", kind: stated, tmodel_mapping: "new role edge"}
  - {name: describes, from: SoftwareBillOfMaterials, to: ProductWithDigitalElements, cardinality: "N:1", definition: "details and supply chain relationships of components included in the software elements", locator: "Art. 3(39)", kind: stated, tmodel_mapping: "materialisation of composed_of"}
  - {name: has_support_period, from: ProductWithDigitalElements, to: SupportPeriod, cardinality: "1:1", definition: "manufacturers shall determine the support period", locator: "Art. 13(8)", kind: stated, tmodel_mapping: "new (dated lifecycle window)"}
  - {name: assessed_by, from: ProductWithDigitalElements, to: CybersecurityRiskAssessment, cardinality: "1:N (versions)", definition: "assessment of the cybersecurity risks associated with a product, documented and updated during the support period", locator: "Art. 13(2)-(3)", kind: stated, tmodel_mapping: "Product -> threat model (governed view)"}
  - {name: determines_applicability_of, from: CybersecurityRiskAssessment, to: EssentialCybersecurityRequirement, cardinality: "1:N", definition: "shall indicate whether and, if so in what manner, the security requirements set out in Part I, point (2), of Annex I are applicable ... and how those requirements are implemented", locator: "Art. 13(3); Art. 13(4)", kind: stated, tmodel_mapping: "Requirement applicability (R-042) — carries justification when not applicable"}
  - {name: implemented_by, from: EssentialCybersecurityRequirement, to: CorrectiveOrMitigatingMeasure, cardinality: "N:M", definition: "how those requirements are implemented as informed by the cybersecurity risk assessment", locator: "Art. 13(3)", kind: inferred, tmodel_mapping: "Requirement satisfied_by MitigationInstance (R-042)"}
  - {name: part_of, from: CybersecurityRiskAssessment, to: TechnicalDocumentation, cardinality: "1:1", definition: "include the cybersecurity risk assessment ... in the technical documentation", locator: "Art. 13(4); Annex VII(3)", kind: stated, tmodel_mapping: "governed view composition (R-043)"}
  - {name: documents, from: TechnicalDocumentation, to: ProductWithDigitalElements, cardinality: "N:1", definition: "the means used to ensure that the product and the processes comply", locator: "Art. 31(1)", kind: stated, tmodel_mapping: "governed view over Product (R-043)"}
  - {name: evidenced_by, from: ConformityAssessment, to: TestReport, cardinality: "1:N", definition: "reports of the tests carried out to verify the conformity", locator: "Annex VII(6)", kind: stated, tmodel_mapping: "Evidence (DL-0009)"}
  - {name: declares_conformity_of, from: EUDeclarationOfConformity, to: ProductWithDigitalElements, cardinality: "1:1", definition: "drawn up where compliance ... has been demonstrated by that conformity assessment procedure", locator: "Art. 13(12)", kind: stated, tmodel_mapping: "Review (approval) over a governed view (R-043)"}
  - {name: references_standard, from: TechnicalDocumentation, to: HarmonisedStandard, cardinality: "N:M", definition: "a list of the harmonised standards applied in full or in part", locator: "Annex VII(5)", kind: stated, tmodel_mapping: "cites library record"}
  - {name: affects, from: Vulnerability, to: ProductWithDigitalElements, cardinality: "N:M", definition: "a weakness, susceptibility or flaw of a product", locator: "Art. 3(40)", kind: stated, tmodel_mapping: "affects (ARCH §2b)"}
  - {name: located_in, from: Vulnerability, to: Component, cardinality: "N:M", definition: "a vulnerability in a component ... which is integrated in the product", locator: "Art. 13(6)", kind: stated, tmodel_mapping: "propagation along uses_component (ARCH §5)"}
  - {name: exploited_by, from: ActivelyExploitedVulnerability, to: MaliciousActor, cardinality: "N:M", definition: "a malicious actor has exploited it", locator: "Art. 3(42); Art. 14(2)(c)(ii)", kind: stated, tmodel_mapping: "ThreatActor facet"}
  - {name: remedied_by, from: Vulnerability, to: SecurityUpdate, cardinality: "N:M", definition: "address and remediate vulnerabilities without delay, including by providing security updates", locator: "Annex I Part II(2)", kind: stated, tmodel_mapping: "mitigated_by MitigationInstance (DEC-009)"}
  - {name: disclosed_in, from: Vulnerability, to: SecurityAdvisory, cardinality: "N:1", definition: "publicly disclose information about fixed vulnerabilities", locator: "Annex I Part II(4)", kind: stated, tmodel_mapping: "new"}
  - {name: impacts, from: Incident, to: ProductWithDigitalElements, cardinality: "N:M", definition: "an incident having an impact on the security of the product", locator: "Art. 3(44)", kind: stated, tmodel_mapping: "new"}
  - {name: reports, from: Notification, to: "ActivelyExploitedVulnerability | SevereIncident", cardinality: "N:1", definition: "notify any actively exploited vulnerability / any severe incident", locator: "Art. 14(1), 14(3)", kind: stated, tmodel_mapping: "new"}
  - {name: submitted_to, from: Notification, to: CSIRTDesignatedAsCoordinator, cardinality: "N:1", definition: "using the electronic notification end-point of the CSIRT designated as coordinator of the Member State where the manufacturers have their main establishment", locator: "Art. 14(7)", kind: stated, tmodel_mapping: "none"}
  - {name: accessible_to, from: Notification, to: ENISA, cardinality: "N:1", definition: "shall be simultaneously accessible to ENISA", locator: "Art. 14(7)", kind: stated, tmodel_mapping: "none"}
  - {name: precedes, from: Notification, to: Notification, cardinality: "1:1", definition: "early warning -> notification -> final report stage ordering with deadlines", locator: "Art. 14(2), 14(4)", kind: inferred, tmodel_mapping: "none"}
  - {name: disseminated_to, from: Notification, to: CSIRTDesignatedAsCoordinator, cardinality: "N:M", definition: "disseminate the notification via the single reporting platform to the CSIRTs designated as coordinators on the territory of which ...", locator: "Art. 16(2)", kind: stated, tmodel_mapping: "none"}
  - {name: forwarded_to, from: Notification, to: MarketSurveillanceAuthority, cardinality: "N:M", definition: "provide the market surveillance authorities ... with the notified information", locator: "Art. 16(3)", kind: stated, tmodel_mapping: "none"}
  - {name: informs, from: Manufacturer, to: User, cardinality: "N:M", definition: "inform the impacted users ... of that vulnerability or incident and ... risk mitigation and corrective measures", locator: "Art. 14(8)", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation delivered to Party"}
  - {name: contact_point_of, from: SinglePointOfContact, to: Manufacturer, cardinality: "1:1", definition: "designate a single point of contact", locator: "Art. 13(17)", kind: stated, tmodel_mapping: "new"}
  - {name: has_policy, from: Manufacturer, to: CoordinatedVulnerabilityDisclosurePolicy, cardinality: "1:N", definition: "put in place and enforce a policy on coordinated vulnerability disclosure", locator: "Annex I Part II(5)", kind: stated, tmodel_mapping: "process mitigation (R-040)"}
  - {name: substantially_modifies, from: SubstantialModification, to: ProductWithDigitalElements, cardinality: "N:1", definition: "a change ... following its placing on the market which affects compliance or intended purpose", locator: "Art. 3(30)", kind: stated, tmodel_mapping: "version edge (ProductInstance valid_from/valid_to)"}
  - {name: classified_as, from: ProductWithDigitalElements, to: ProductClass, cardinality: "N:1", definition: "important / critical by core functionality", locator: "Arts. 7-8 (not extracted)", kind: stated, tmodel_mapping: "new"}
  - {name: published_in, from: Vulnerability, to: EuropeanVulnerabilityDatabase, cardinality: "N:1", definition: "ENISA shall ... add the publicly known vulnerability ... to the European vulnerability database", locator: "Art. 17(5)", kind: stated, tmodel_mapping: "external_refs"}

