schema: "library-messages/v1"
record: eu-cra-2024-2847
source_version: "OJ L, 2024/2847, 20.11.2024"
note: >
  The CRA defines notification CONTENT in prose, not a wire format. No field names, types or encodings are
  given; Art 14(10) empowers the Commission to specify format and procedures by implementing act, and none had
  been adopted as of 2026-10-02 (SPARQL over acts based on 32024R2847: only Delegated Reg 2025/1535,
  Implementing Reg 2025/2392, Delegated Reg 2026/881). Field names below are OURS (snake_case), each tied to the
  verbatim phrase that requires it (`source_phrase`) and the requirement ids that constrain it. ENISA's single
  reporting platform (live 2026-09-11) has its own form fields; they are not in the Regulation and are NOT
  modelled here. `required` values: yes = "including at least" / "shall provide"; conditional = "where
  applicable" / "where available" / "as available"; no = permissive.
  Encoding: none mandated, except Art 14(8) user information "where appropriate in a structured, machine-readable
  format that is easily automatically processable" and Annex I Part II(1) SBOM "commonly used and
  machine-readable format".

messages:
  # ---------------- Mandatory reporting: actively exploited vulnerability (Art 14(1)-(2)) ----------------
  - id: aev-early-warning
    name: "Early warning notification of an actively exploited vulnerability"
    locator: "Art. 14(2)(a)"
    from: manufacturer
    to: "CSIRT designated as coordinator (main-establishment Member State, Art 14(7)), simultaneously accessible to ENISA"
    channel: "single reporting platform, electronic notification end-point (Art 14(7), Art 16(1))"
    deadline: "without undue delay and in any event within 24 hours of the manufacturer becoming aware of it"
    constrained_by: ["eu-cra-2024-2847#Art14(1)-1", "eu-cra-2024-2847#Art14(1)-2", "eu-cra-2024-2847#Art14(2)(a)", "eu-cra-2024-2847#Art14(7)-1", "eu-cra-2024-2847#Art14(7)-2"]
    fields:
      - {name: notification_kind, value: "early-warning/vulnerability", required: yes, source_phrase: "an early warning notification of an actively exploited vulnerability", kind: inferred}
      - {name: product, required: yes, source_phrase: "actively exploited vulnerability contained in the product with digital elements (Art 14(1))", kind: inferred, note: "the product is implied by the subject of the notification; not listed as content of (a)"}
      - {name: member_states_made_available, type: "list of Member State codes", required: conditional, source_phrase: "indicating, where applicable, the Member States on the territory of which the manufacturer is aware that their product with digital elements has been made available", kind: stated, note: "drives Art 16(2) dissemination targets"}
      - {name: aware_at, type: datetime, required: yes, source_phrase: "within 24 hours of the manufacturer becoming aware of it", kind: inferred, note: "the clock origin; needed to test the deadline"}
  - id: aev-vulnerability-notification
    name: "Vulnerability notification"
    locator: "Art. 14(2)(b)"
    from: manufacturer
    to: "CSIRT designated as coordinator + ENISA (via SRP)"
    deadline: "without undue delay and in any event within 72 hours of the manufacturer becoming aware of the actively exploited vulnerability"
    condition: "unless the relevant information has already been provided"
    constrained_by: ["eu-cra-2024-2847#Art14(2)(b)", "eu-cra-2024-2847#Art16(2)-5"]
    fields:
      - {name: product_general_information, required: conditional, source_phrase: "general information, as available, about the product with digital elements concerned", kind: stated}
      - {name: exploit_general_nature, required: conditional, source_phrase: "the general nature of the exploit", kind: stated}
      - {name: vulnerability_general_nature, required: conditional, source_phrase: "and of the vulnerability concerned", kind: stated}
      - {name: corrective_measures_taken, required: conditional, source_phrase: "any corrective or mitigating measures taken", kind: stated}
      - {name: user_mitigations, required: conditional, source_phrase: "corrective or mitigating measures that users can take", kind: stated}
      - {name: sensitivity, required: conditional, source_phrase: "how sensitive the manufacturer considers the notified information to be", kind: stated, note: "input to Art 16(2) dissemination delay; Art 16(2) second subparagraph wrongly cites Art 14(2)(a) as its source"}
      - {name: exceptional_circumstances, type: "set of {exploited-only-in-this-MS, essential-interests, imminent-high-risk}", required: no, source_phrase: "where the manufacturer indicates in the notification referred to in Article 14(2), point (b): (a) ... (b) ... (c) ...", locator: "Art. 16(2) third subparagraph", kind: stated}
  - id: aev-final-report
    name: "Final report (actively exploited vulnerability)"
    locator: "Art. 14(2)(c)"
    from: manufacturer
    to: "CSIRT designated as coordinator + ENISA (via SRP)"
    deadline: "no later than 14 days after a corrective or mitigating measure is available"
    condition: "unless the relevant information has already been provided"
    constrained_by: ["eu-cra-2024-2847#Art14(2)(c)"]
    fields:
      - {name: vulnerability_description, required: yes, source_phrase: "(i) a description of the vulnerability, including its severity and impact", kind: stated}
      - {name: severity, required: yes, source_phrase: "including its severity", kind: stated, note: "no scale mandated (CVSS etc. not named)"}
      - {name: impact, required: yes, source_phrase: "and impact", kind: stated}
      - {name: malicious_actor_information, required: conditional, source_phrase: "(ii) where available, information concerning any malicious actor that has exploited or that is exploiting the vulnerability", kind: stated}
      - {name: security_update_details, required: yes, source_phrase: "(iii) details about the security update or other corrective measures that have been made available to remedy the vulnerability", kind: stated}
      - {name: measure_available_at, type: datetime, required: yes, source_phrase: "14 days after a corrective or mitigating measure is available", kind: inferred, note: "clock origin for the 14-day deadline"}
  # ---------------- Mandatory reporting: severe incident (Art 14(3)-(5)) ----------------
  - id: incident-early-warning
    name: "Early warning notification of a severe incident having an impact on the security of the product"
    locator: "Art. 14(4)(a)"
    from: manufacturer
    to: "CSIRT designated as coordinator + ENISA (via SRP)"
    deadline: "without undue delay and in any event within 24 hours of the manufacturer becoming aware of it"
    constrained_by: ["eu-cra-2024-2847#Art14(3)-1", "eu-cra-2024-2847#Art14(3)-2", "eu-cra-2024-2847#Art14(4)(a)", "eu-cra-2024-2847#Art14(5)"]
    fields:
      - {name: suspected_unlawful_or_malicious, type: boolean, required: yes, source_phrase: "including at least whether the incident is suspected of being caused by unlawful or malicious acts", kind: stated}
      - {name: member_states_made_available, type: "list of Member State codes", required: conditional, source_phrase: "which shall also indicate, where applicable, the Member States on the territory of which the manufacturer is aware that their product with digital elements has been made available", kind: stated}
      - {name: severity_ground, type: "enum {14(5)(a) CIA of sensitive/important data or functions, 14(5)(b) malicious code}", required: no, source_phrase: "shall be considered to be severe where: (a) ... or (b) ...", locator: "Art. 14(5)", kind: inferred, note: "the Regulation does not require the ground to be reported; it is the guard for reporting at all"}
      - {name: aware_at, type: datetime, required: yes, source_phrase: "within 24 hours of the manufacturer becoming aware of it", kind: inferred}
  - id: incident-notification
    name: "Incident notification"
    locator: "Art. 14(4)(b)"
    from: manufacturer
    to: "CSIRT designated as coordinator + ENISA (via SRP)"
    deadline: "without undue delay and in any event within 72 hours of the manufacturer becoming aware of the incident"
    condition: "unless the relevant information has already been provided"
    constrained_by: ["eu-cra-2024-2847#Art14(4)(b)"]
    fields:
      - {name: incident_nature, required: conditional, source_phrase: "general information, where available, about the nature of the incident", kind: stated}
      - {name: initial_assessment, required: conditional, source_phrase: "an initial assessment of the incident", kind: stated}
      - {name: corrective_measures_taken, required: conditional, source_phrase: "any corrective or mitigating measures taken", kind: stated}
      - {name: user_mitigations, required: conditional, source_phrase: "corrective or mitigating measures that users can take", kind: stated}
      - {name: sensitivity, required: conditional, source_phrase: "how sensitive the manufacturer considers the notified information to be", kind: stated}
      - {name: submitted_at, type: datetime, required: yes, source_phrase: "within one month after the submission of the incident notification under point (b)", locator: "Art. 14(4)(c)", kind: inferred, note: "clock origin for the final incident report"}
  - id: incident-final-report
    name: "Final report (severe incident)"
    locator: "Art. 14(4)(c)"
    from: manufacturer
    to: "CSIRT designated as coordinator + ENISA (via SRP)"
    deadline: "within one month after the submission of the incident notification under point (b)"
    condition: "unless the relevant information has already been provided"
    constrained_by: ["eu-cra-2024-2847#Art14(4)(c)"]
    fields:
      - {name: incident_detailed_description, required: yes, source_phrase: "(i) a detailed description of the incident, including its severity and impact", kind: stated}
      - {name: severity, required: yes, source_phrase: "including its severity", kind: stated}
      - {name: impact, required: yes, source_phrase: "and impact", kind: stated}
      - {name: threat_type_or_root_cause, required: yes, source_phrase: "(ii) the type of threat or root cause that is likely to have triggered the incident", kind: stated}
      - {name: mitigation_measures, required: yes, source_phrase: "(iii) applied and ongoing mitigation measures", kind: stated}
  - id: intermediate-report-request
    name: "Request for an intermediate report"
    locator: "Art. 14(6)"
    from: "CSIRT designated as coordinator initially receiving the notification"
    to: manufacturer
    condition: "Where necessary"
    constrained_by: ["eu-cra-2024-2847#Art14(6)"]
    fields:
      - {name: subject_notification, required: yes, source_phrase: "about the actively exploited vulnerability or severe incident", kind: inferred}
  - id: intermediate-report
    name: "Intermediate report on relevant status updates"
    locator: "Art. 14(6)"
    from: manufacturer
    to: "CSIRT designated as coordinator (via SRP)"
    deadline: "none stated"
    constrained_by: ["eu-cra-2024-2847#Art14(6)"]
    fields:
      - {name: status_updates, required: yes, source_phrase: "an intermediate report on relevant status updates", kind: stated}
  - id: user-information
    name: "Information to impacted users"
    locator: "Art. 14(8)"
    from: manufacturer
    to: "impacted users, and where appropriate all users"
    deadline: "none stated ('After becoming aware'); CSIRT may step in if not 'in a timely manner'"
    encoding: "where appropriate in a structured, machine-readable format that is easily automatically processable"
    constrained_by: ["eu-cra-2024-2847#Art14(8)-1", "eu-cra-2024-2847#Art14(8)-2"]
    fields:
      - {name: vulnerability_or_incident, required: yes, source_phrase: "of that vulnerability or incident", kind: stated}
      - {name: user_mitigations, required: conditional, source_phrase: "where necessary, of any risk mitigation and corrective measures that the users can deploy", kind: stated}
  # ---------------- Authority-side flows (Arts 15-17) ----------------
  - id: voluntary-notification
    name: "Voluntary notification (vulnerability, cyber threat, incident, near miss)"
    locator: "Art. 15(1)-(2)"
    from: "manufacturer or any natural or legal person"
    to: "a CSIRT designated as coordinator or ENISA"
    constrained_by: ["eu-cra-2024-2847#Art15(1)", "eu-cra-2024-2847#Art15(2)", "eu-cra-2024-2847#Art15(3)-1", "eu-cra-2024-2847#Art15(5)-1"]
    fields:
      - {name: subject_kind, type: "enum {vulnerability, cyber-threat, incident, near-miss}", required: yes, source_phrase: "any vulnerability ... as well as cyber threats ... any incident ... as well as near misses", kind: stated}
  - id: third-party-report-to-manufacturer
    name: "CSIRT informs manufacturer of a third-party notification"
    locator: "Art. 15(4)"
    from: "CSIRT designated as coordinator"
    to: manufacturer
    deadline: "without undue delay"
    constrained_by: ["eu-cra-2024-2847#Art15(4)"]
    fields:
      - {name: subject, required: yes, source_phrase: "notifies an actively exploited vulnerability or a severe incident", kind: inferred, note: "receipt makes the manufacturer 'aware' and starts the Art 14 clocks"}
  - id: dissemination
    name: "Dissemination of a notification to other CSIRTs"
    locator: "Art. 16(2) first subparagraph"
    from: "CSIRT designated as coordinator initially receiving the notification"
    to: "CSIRTs designated as coordinators of the Member States where the product has been made available (per member_states_made_available)"
    channel: "single reporting platform"
    deadline: "without delay (unless withheld, Art 16(2) second subparagraph / Art 16(6) / Delegated Reg 2026/881)"
    constrained_by: ["eu-cra-2024-2847#Art16(2)-1"]
    fields:
      - {name: notification, required: yes, source_phrase: "disseminate the notification", kind: stated}
  - id: withholding-decision
    name: "Withholding decision to ENISA"
    locator: "Art. 16(2) second subparagraph"
    from: "CSIRT designated as coordinator"
    to: ENISA
    deadline: "immediately"
    constrained_by: ["eu-cra-2024-2847#Art16(2)-2", "eu-cra-2024-2847#Art16(2)-3"]
    fields:
      - {name: justification, required: yes, source_phrase: "provide both a justification for withholding the notification", kind: stated}
      - {name: expected_dissemination, required: yes, source_phrase: "an indication of when it will disseminate the notification", kind: stated}
  - id: restricted-enisa-view
    name: "Restricted information made available to ENISA in particularly exceptional circumstances"
    locator: "Art. 16(2) third subparagraph"
    from: "CSIRT designated as coordinator (via SRP)"
    to: ENISA
    constrained_by: ["eu-cra-2024-2847#Art16(2)-5"]
    fields:
      - {name: notification_made, required: yes, source_phrase: "the information that a notification was made by the manufacturer", kind: stated}
      - {name: product_general_information, required: yes, source_phrase: "the general information about the product", kind: stated}
      - {name: exploit_general_nature, required: yes, source_phrase: "the information on the general nature of the exploit", kind: stated}
      - {name: security_grounds_raised, type: boolean, required: yes, source_phrase: "the information that security related grounds were raised", kind: stated}
  - id: enisa-dissemination-recommendation
    name: "ENISA recommendation to disseminate (systemic risk)"
    locator: "Art. 16(2) third subparagraph, closing sentence"
    from: ENISA
    to: "recipient CSIRT"
    constrained_by: ["eu-cra-2024-2847#Art16(2)-6"]
    fields:
      - {name: systemic_risk_finding, required: yes, source_phrase: "considers that there is a systemic risk affecting security in the internal market", kind: inferred}
  - id: msa-forward
    name: "Notified information to market surveillance authorities"
    locator: "Art. 16(3)"
    from: "CSIRTs designated as coordinators"
    to: "market surveillance authorities of their Member States"
    constrained_by: ["eu-cra-2024-2847#Art16(3)"]
    fields:
      - {name: notified_information, required: yes, source_phrase: "the notified information necessary for the market surveillance authorities to fulfil their obligations", kind: stated}
  - id: srp-incident-notice
    name: "Security incident affecting the single reporting platform"
    locator: "Art. 16(4)"
    from: ENISA
    to: "CSIRTs network and the Commission"
    deadline: "without undue delay"
    constrained_by: ["eu-cra-2024-2847#Art16(4)-2"]
    fields:
      - {name: srp_incident, required: yes, source_phrase: "any security incident affecting the single reporting platform", kind: stated}
  - id: public-information
    name: "Public information about a severe incident"
    locator: "Art. 17(2)"
    from: "CSIRT designated as coordinator of the relevant Member State (after consulting the manufacturer) or the manufacturer when required"
    to: public
    constrained_by: ["eu-cra-2024-2847#Art17(2)"]
    fields:
      - {name: incident, required: yes, source_phrase: "inform the public about the incident", kind: stated}
  - id: euvd-entry
    name: "Entry in the European vulnerability database"
    locator: "Art. 17(5)"
    from: ENISA
    to: "European vulnerability database (NIS2 Art 12(2))"
    condition: "After a security update or another form of corrective or mitigating measure is available; in agreement with the manufacturer"
    constrained_by: ["eu-cra-2024-2847#Art17(5)"]
    fields:
      - {name: publicly_known_vulnerability, required: yes, source_phrase: "add the publicly known vulnerability notified pursuant to Article 14(1) or Article 15(1)", kind: stated}
  # ---------------- Manufacturer vulnerability handling outputs (Art 13, Annex I Part II) ----------------
  - id: inbound-vulnerability-report
    name: "Vulnerability report received at the manufacturer's contact address / single point of contact"
    locator: "Annex I, Part II, point (6); Art. 13(17); Annex II point 2"
    from: "reporter (internal or external source, Art 13(8))"
    to: manufacturer
    constrained_by: ["eu-cra-2024-2847#AnnexI-PartII(6)", "eu-cra-2024-2847#Art13(17)-1", "eu-cra-2024-2847#Art13(17)-4", "eu-cra-2024-2847#Art13(8)-9"]
    fields:
      - {name: reported_vulnerability, required: yes, source_phrase: "a contact address for the reporting of the vulnerabilities discovered in the product with digital elements", kind: inferred}
      - {name: channel, required: yes, source_phrase: "shall allow users to choose their preferred means of communication and shall not limit such means to automated tools", kind: stated}
  - id: upstream-component-report
    name: "Report of a vulnerability in an integrated component to its maintainer"
    locator: "Art. 13(6)"
    from: manufacturer
    to: "person or entity manufacturing or maintaining the component"
    constrained_by: ["eu-cra-2024-2847#Art13(6)-1", "eu-cra-2024-2847#Art13(6)-2"]
    fields:
      - {name: component_vulnerability, required: yes, source_phrase: "report the vulnerability to the person or entity manufacturing or maintaining the component", kind: stated}
      - {name: fix_code_or_documentation, required: conditional, source_phrase: "share the relevant code or documentation ... where appropriate in a machine-readable format", kind: stated}
  - id: security-advisory
    name: "Public disclosure of fixed vulnerabilities"
    locator: "Annex I, Part II, point (4)"
    from: manufacturer
    to: public
    condition: "once a security update has been made available; may be delayed in duly justified cases until users have been given the possibility to apply the patch"
    constrained_by: ["eu-cra-2024-2847#AnnexI-PartII(4)", "eu-cra-2024-2847#AnnexI-PartII(4)-delay"]
    fields:
      - {name: vulnerability_description, required: yes, source_phrase: "a description of the vulnerabilities", kind: stated}
      - {name: affected_product_identification, required: yes, source_phrase: "information allowing users to identify the product with digital elements affected", kind: stated}
      - {name: impacts, required: yes, source_phrase: "the impacts of the vulnerabilities", kind: stated}
      - {name: severity, required: yes, source_phrase: "their severity", kind: stated}
      - {name: remediation_information, required: yes, source_phrase: "clear and accessible information helping users to remediate the vulnerabilities", kind: stated}
  - id: security-update
    name: "Security update with advisory message"
    locator: "Annex I, Part II, points (2), (7), (8); Art. 13(9)"
    from: manufacturer
    to: users
    constrained_by: ["eu-cra-2024-2847#AnnexI-PartII(2)", "eu-cra-2024-2847#AnnexI-PartII(7)", "eu-cra-2024-2847#AnnexI-PartII(8)", "eu-cra-2024-2847#Art13(9)", "eu-cra-2024-2847#AnnexI-PartI(2)(c)"]
    fields:
      - {name: update_payload, required: yes, source_phrase: "mechanisms to securely distribute updates", kind: inferred}
      - {name: separate_from_functionality, type: boolean, required: conditional, source_phrase: "where technically feasible, new security updates shall be provided separately from functionality updates", kind: stated}
      - {name: advisory_message, required: yes, source_phrase: "accompanied by advisory messages providing users with the relevant information, including on potential action to be taken", kind: stated}
      - {name: free_of_charge, type: boolean, required: yes, source_phrase: "unless otherwise agreed ... tailor-made product ..., free of charge", kind: stated}
      - {name: issued_at, type: date, required: yes, source_phrase: "remains available after it has been issued for a minimum of 10 years or for the remainder of the support period, whichever is longer", locator: "Art. 13(9)", kind: inferred}
  - id: end-of-support-notification
    name: "End of support period notification"
    locator: "Art. 13(19) second subparagraph"
    from: manufacturer
    to: users
    condition: "Where technically feasible"
    constrained_by: ["eu-cra-2024-2847#Art13(19)-2"]
    fields:
      - {name: end_of_support_reached, required: yes, source_phrase: "informing them that their product with digital elements has reached the end of its support period", kind: stated}
  - id: cessation-notice
    name: "Notice of impending cessation of operations"
    locator: "Art. 13(23)"
    from: manufacturer
    to: "relevant market surveillance authorities and, to the extent possible, users"
    deadline: "before the cessation of operations takes effect"
    constrained_by: ["eu-cra-2024-2847#Art13(23)"]
    fields:
      - {name: impending_cessation, required: yes, source_phrase: "of the impending cessation of operations", kind: stated}

structures:
  - id: software-bill-of-materials
    locator: "Art. 3(39); Annex I, Part II, point (1); Annex VII point 8; Art. 13(24)-(25)"
    definition: "a formal record containing details and supply chain relationships of components included in the software elements of a product with digital elements"
    constraints: ["commonly used and machine-readable format", "covering at the very least the top-level dependencies of the products", "format and elements may be specified by implementing act (Art 13(24)) — none adopted as of 2026-10-02", "provided to MSA on reasoned request (Annex VII point 8; Art 13(25))", "user access optional (Annex II point 9)"]
    constrained_by: ["eu-cra-2024-2847#AnnexI-PartII(1)", "eu-cra-2024-2847#AnnexVII(8)", "eu-cra-2024-2847#AnnexII(9)", "eu-cra-2024-2847#Art13(24)-1"]
  - id: user-information-annex-ii
    locator: "Annex II"
    fields: ["manufacturer_identity_contact (1)", "vulnerability_spoc_and_cvd_policy_location (2)", "product_identification (3)", "intended_purpose_security_environment_properties (4)", "foreseeable_risk_circumstances (5)", "doc_url (6, where applicable)", "support_type_and_end_date (7)", "instructions: secure_commissioning_use (8a), change_effects (8b), update_install (8c), secure_decommissioning (8d), auto_update_opt_out (8e), integrator_information (8f)", "sbom_location (9, if SBOM shared)"]
    constrained_by: ["eu-cra-2024-2847#AnnexII(1)", "eu-cra-2024-2847#AnnexII(9)"]
  - id: technical-documentation-annex-vii
    locator: "Annex VII; Art. 31"
    fields: ["general_description: intended_purpose, software_versions, hw_photographs, user_information (1a-d)", "design_development: architecture (2a), vulnerability_handling_spec incl. SBOM/CVD/contact/update distribution (2b), production_monitoring_validation (2c)", "cybersecurity_risk_assessment (3)", "support_period_rationale (4)", "standards_applied_or_solutions (5)", "conformity_test_reports (6)", "doc_copy (7)", "sbom_on_request (8)"]
    constrained_by: ["eu-cra-2024-2847#AnnexVII(1(a))", "eu-cra-2024-2847#AnnexVII(8)", "eu-cra-2024-2847#Art31(1)-2"]
