    applies_from: "2026-09-11"
    text: "For the purposes of paragraph 3, an incident having an impact on the security of the product with digital elements shall be considered to be severe where: (a) it negatively affects or is capable of negatively affecting the ability of a product with digital elements to protect the availability, authenticity, integrity or confidentiality of sensitive or important data or functions; or (b) it has led or is capable of leading to the introduction or execution of malicious code in a product with digital elements or in the network and information systems of a user of the product with digital elements."
    expects_deliverables: []
    verification: "classification decision record"
    kind: stated
    testable: partial
    note: "Classification rule, not an obligation; kept because it is the guard on the incident-reporting transition."
