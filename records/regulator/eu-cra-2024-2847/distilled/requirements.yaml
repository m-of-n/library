note: >
  Scope is the SDL-bearing parts of the Regulation, not the whole act: Article 13 (manufacturer obligations),
  Article 14 (reporting), Articles 15-17 (voluntary reporting, single reporting platform, other reporting provisions),
  Article 24 (open-source software stewards), Article 31 (technical documentation), Article 64(2)-(4),(10) (penalty tiers),
  Articles 69 and 71 (transition, application dates), Annex I Parts I and II, Annex II and Annex VII. NOT extracted:
  Articles 1-12, 18-23, 25-30, 32-63 (other than 64), 65-68, 70 and Annexes III-VIII (conformity assessment, notified bodies,
  market surveillance, product classes) - listed by title only in normative.md. One entry per sentence carrying a modal;
  list points under a shared chapeau are separate entries with the chapeau in `chapeau`. normativity uses
  requirement (shall), prohibition (shall not), permission (may / is empowered), definition (a shall that states a rule
  of law or a classification rather than imposing a duty: Arts 14(5), 14(7) main-establishment rule, 69, 71).
  applies_from: Art 14 (and 69(3)) 2026-09-11; everything else 2027-12-11 (Art 71(2)). DERIVED fields (actor, nature,
  phase, short_title, expects_deliverables, verification, testable) are pass-1 judgement and need human review; text is verbatim.
