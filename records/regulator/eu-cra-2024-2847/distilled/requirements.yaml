    nature: "process"
    phase: "operations/response"
    locator: "Art. 16(2) third subparagraph"
    short_title: "Restricted ENISA view in particularly exceptional circumstances"
    applies_from: "2027-12-11"
    chapeau: "In particularly exceptional circumstances, where the manufacturer indicates in the notification referred to in Article 14(2), point (b): (a) that the notified vulnerability has been actively exploited by a malicious actor and, according to the information available, it has been exploited in no other Member State than the one of the CSIRT designated as coordinator to which the manufacturer has notified the vulnerability; (b) that any immediate further dissemination of the notified vulnerability would likely result in the supply of information the disclosure of which would be contrary to the essential interests of that Member State; or (c) that the notified vulnerability poses an imminent high cybersecurity risk stemming from the further dissemination;"
    text: "only the information that a notification was made by the manufacturer, the general information about the product, the information on the general nature of the exploit and the information that security related grounds were raised are to be made available simultaneously to ENISA until the full notification is disseminated to the CSIRTs concerned and ENISA."
