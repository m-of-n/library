usefulness:
  verdict: useful
  reason: "The first binding horizontal SDL law in a major market: risk assessment (threat model), a no-known-exploitable-vulnerabilities release gate, SBOM, CVD and Art 14 reporting clocks (in force since 2026-09-11) are legal obligations evidenced by governed technical documentation — the strongest external anchor for R-041..R-043."
