distillation:
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "Verbatim, with the Regulation's own locators: Art 3 definitions; Arts 13, 14, 15, 16, 17, 24, 31, 64(2)-(4),(10), 69, 71; Annex I Parts I and II, Annex II, Annex VII; Delegated Reg (EU) 2026/881 Arts 2-5 summarised with own locators. Every other Article and Annex listed by title only (ToC) — conformity assessment (Arts 27-34), notified bodies (Arts 35-51), market surveillance (Arts 52-60) NOT extracted. Corrigendum OJ L 2025/90555 to Art 64(10) applied inline."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "191 entries (153 requirement, 4 prohibition, 24 permission, 10 definition) as eu-cra-2024-2847#Art13(1) … #AnnexVII(8); library-requirements/v2 typing. In-scope baseline shall 126 / shall not 5 / may 24, fully reconciled (6 shall in shared chapeaus carried in chapeau fields). BCP 14 count 0 in source and extraction. No maps_to: the Regulation publishes no mapping."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "10 roles (manufacturer, reporter, component maintainer, coordinator CSIRT, relevant CSIRTs, ENISA, SRP, MSA, users, public), reporting timers (24 h / 72 h / 14 d / 1 month / intermediate on request), 12 flows incl. dissemination delay (Art 16(2) + DR 2026/881) and error paths; protocol.md carries the Mermaid sequence diagrams."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "4 machines: SM1 actively-exploited-vulnerability reporting clocks, SM2 severe-incident reporting clocks, SM3 vulnerability handling (Annex I Part II), SM4 product support lifecycle (Art 13(8)-(9), 13(13)); guards and breach states."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "28 entries: the Art 14 notification family (early warning, notification, intermediate, final; vulnerability and severe-incident subjects), Art 14(8) user information, Art 15 voluntary notifications, plus structures for Annex II user information, Annex VII technical documentation, SBOM and CVD policy; each field quotes its locator."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "One DERIVED JSON Schema 2020-12 for Art 14 notifications (every property quotes its source phrase); the Regulation ships no schema. ENISA SRP form fields, SBOM format (Art 13(24) implementing act not adopted) not modelled."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "Adopt A1-A7 / adapt D1-D5 / reject X1-X3 against R-040..R-044, DEC-009, ARCH-0001 §1-§5; inferred crosswalk hooks; 9 open questions incl. 2 source defects (Q9 Art 64 vs Art 14 dates added in verify) (Art 16(2) cross-reference; Art 16 vs Art 14 application dates)."
      reviewed_by: ""
    - kind: diagram
