schema: "library-object-model/v1"
record: omb-m-23-16
reviewed_by: ""
question: "What objects and edges does M-23-16 assume or define (beyond M-22-18)?"
objects:
  - {name: SoftwareEndProduct, definition: "the software product an agency uses; attestation is collected from its producer", attributes: [producer, hosted_continuous_updates, free_publicly_available, demo_or_pilot], locator: "§A, §B.1", kind: stated, tmodel_mapping: "Product (ARCH-0001 §1)", notes: "M-23-16 makes the end product the unit of accountability"}
  - {name: ThirdPartyComponent, definition: "component (open-source or proprietary) developed by an entity other than the end-product producer", attributes: [open_source, developer], locator: "§B.1, fn 4", kind: stated, tmodel_mapping: "Component composed_of (ARCH-0001 §1)", notes: "fn 4 defines component (NIST SP 800-95)"}
  - {name: Producer, definition: "producer of the software end product", attributes: [], locator: "§B.1", kind: stated, tmodel_mapping: "Party", notes: ""}
  - {name: Attestation, definition: "affirmative statement that the producer follows the secure software development minimum requirements of the common form", attributes: [], locator: "§B.1", kind: stated, tmodel_mapping: "Assertion + Review (new: Attestation)", notes: ""}
  - {name: MinimumRequirement, definition: "a secure software development minimum requirement articulated in the common form (incl. third-party code risk practices)", attributes: [ssdf_refs], locator: "§B.1, fn 6", kind: stated, tmodel_mapping: "Requirement (R-042/R-044)", notes: "fn 6 maps to SSDF PO.1.3, PW.4.1, PW.4.4, PW.7.1"}
  - {name: POAM, definition: "plan of action and milestones for practices the producer cannot attest to", attributes: [practices_not_attested, mitigations], locator: "§C", kind: stated, tmodel_mapping: "MitigationInstance kind=process + Milestones", notes: ""}
  - {name: ExtensionRequest, definition: "agency request to OMB extending the attestation deadline; must include the POA&M; mandatory for continued use under a POA&M", attributes: [poam], locator: "§C", kind: stated, tmodel_mapping: "new — gate deadline override", notes: ""}
  - {name: LeadAgency, definition: "agency designated by OMB to coordinate a shared POA&M across affected agencies", attributes: [], locator: "§C", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: CIODetermination, definition: "agency CIO decision whether contractor-developed software is agency-developed", attributes: [can_ensure_sdl], locator: "§B.3", kind: stated, tmodel_mapping: "Review (verdict on applicability)", notes: ""}
  - {name: SDLPhase, definition: "requirements, design, development, testing, deployment, and maintenance — the lifecycle across which practices must be ensured", attributes: [], locator: "§B.3", kind: stated, tmodel_mapping: "LifecyclePhase (ARCH-0001 §3b)", notes: "a six-phase SDL list stated by OMB"}
  - {name: RiskAssessment, definition: "agency risk assessment for out-of-scope free software", attributes: [], locator: "§B.2", kind: stated, tmodel_mapping: "Review / RiskScore", notes: ""}
  - {name: NonConformanceMetric, definition: "OMB metrics on products in use not meeting minimum requirements; POA&M approvals; extensions and waivers", attributes: [], locator: "§C, App. A", kind: stated, tmodel_mapping: "derived View (R-043)", notes: ""}
edges:
  - {name: incorporates, from: SoftwareEndProduct, to: ThirdPartyComponent, cardinality: "1:N", definition: "components incorporated into the end product", locator: "§B.1", kind: stated, tmodel_mapping: "composed_of"}
  - {name: produced_by, from: SoftwareEndProduct, to: Producer, cardinality: "N:1", definition: "", locator: "§B.1", kind: stated, tmodel_mapping: "supplied_by"}
  - {name: accountable_for_components, from: Producer, to: ThirdPartyComponent, cardinality: "1:N", definition: "burden of third-party code risk placed on end-product producer, not the agency", locator: "§B.1", kind: stated, tmodel_mapping: "new — responsibility edge (Party -> Component)"}
  - {name: affirms, from: Attestation, to: MinimumRequirement, cardinality: "1:N", definition: "", locator: "§B.1", kind: stated, tmodel_mapping: "R-042 satisfies"}
  - {name: attached_to, from: POAM, to: ExtensionRequest, cardinality: "1:1", definition: "extension must include the producer's POA&M", locator: "§C", kind: stated, tmodel_mapping: "Evidence attachment"}
  - {name: shared_by, from: POAM, to: SoftwareEndProduct, cardinality: "1:N", definition: "a common POA&M across products/agencies", locator: "§C", kind: stated, tmodel_mapping: "new"}
  - {name: coordinates, from: LeadAgency, to: POAM, cardinality: "1:1", definition: "", locator: "§C", kind: stated, tmodel_mapping: "Party role edge"}
  - {name: ensures_across, from: CIODetermination, to: SDLPhase, cardinality: "1:N", definition: "determination tests whether practices are ensured across all six phases", locator: "§B.3", kind: stated, tmodel_mapping: "LifecyclePhase scope"}
  - {name: maps_to, from: MinimumRequirement, to: MinimumRequirement, cardinality: "N:M", definition: "fn 6 maps third-party practices to SSDF tasks", locator: "fn 6", kind: stated, tmodel_mapping: "R-044 crosswalk"}
gaps:
  - "Responsibility allocation edge (end-product producer accountable for its components' secure development) — tmodel has composed_of but no 'who is accountable for which component's assurance'."
  - "Mandatory coupling of two approvals (agency accepts POA&M AND files extension) as a guard — R-042 conformance check would need compound guards."
  - "Applicability predicates (free, hosted-continuous-updates, demo/pilot, contractor-developed) on Product."
