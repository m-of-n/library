schema: "library-state-machine/v1"
record: omb-m-23-16
reviewed_by: ""
note: >
  The software-item lifecycle of omb-m-22-18 as AMENDED by M-23-16 (M-23-16 controls on conflict,
  omb-m-23-16#intro-2). Changes vs M-22-18: wider scope (hosted services with continuous
  updates), explicit exemptions (third-party components, free proprietary, agency/contractor-
  developed by CIO determination), and the POA&M branch now requires a concurrent OMB extension
  request or the software must be discontinued. Deadlines re-anchored on PRA approval of the
  common form. Terminal: rescinded by omb-m-26-05 (2026-01-23).
machines:
  - name: software-item
    entity: "software end product used by a Federal agency"
    initial: candidate
    states:
      - {name: candidate, kind: inferred, locator: "§A"}
      - {name: out-of-scope, kind: stated, locator: "§B.1-§B.3", description: "third-party component of an end product; free & publicly available proprietary software; freely obtained open source; agency-developed (incl. contractor-developed where CIO so determines)"}
      - {name: risk-assessed-free-software, kind: stated, locator: "§B.2", description: "out-of-scope free software still requires agency risk assessment and risk minimisation (B.2-4)"}
      - {name: attestation-required, kind: inferred, locator: "§A, §B.1"}
      - {name: attested, kind: stated, locator: "§B.1", description: "attestation from the producer of the end product"}
      - {name: poam-submitted, kind: stated, locator: "§C", description: "producer identified non-attested practices, documented mitigations, submitted POA&M"}
      - {name: in-use-under-poam-extension-pending, kind: stated, locator: "§C", description: "agency found POA&M satisfactory, continues use, concurrently seeks OMB extension with POA&M attached"}
      - {name: in-use, kind: inferred, locator: "§A"}
      - {name: discontinued, kind: stated, locator: "§C", description: "agency must discontinue use"}
      - {name: rescinded, kind: stated, locator: "omb-m-26-05#R-0004"}
    transitions:
      - {from: candidate, to: out-of-scope, trigger: scope-determination, guard: "B.1-5 / B.2-1..3 / B.3-1..2 exemption applies", locator: "§B"}
      - {from: out-of-scope, to: risk-assessed-free-software, trigger: "agency risk assessment", guard: "free / publicly available software", locator: "§B.2 (B.2-4)"}
      - {from: candidate, to: attestation-required, trigger: scope-determination, guard: "developed after 2022-09-14, OR major version change after it, OR hosted service with continuous updates, OR demo/pilot of non-free product, OR deployed/configured/modified by a contractor but otherwise in scope", locator: "§A (A-1, A-1b), §B.2-5, §B.3-5"}
      - {from: attestation-required, to: attested, trigger: "attestation from end-product producer", guard: "collected by PRA approval + 3 months (critical) / + 6 months (all)", locator: "§A (A-2, A-3), §B.1-1"}
      - {from: attestation-required, to: poam-submitted, trigger: "producer cannot attest to >=1 practice and submits POA&M package", locator: "§C (C-1)"}
      - {from: poam-submitted, to: in-use-under-poam-extension-pending, trigger: "agency finds documentation satisfactory AND files extension request incl. POA&M", locator: "§C (C-2, C-3)"}
      - {from: poam-submitted, to: discontinued, trigger: "documentation unsatisfactory OR agency cannot confirm the three POA&M elements", locator: "§C (C-4)"}
      - {from: in-use-under-poam-extension-pending, to: discontinued, trigger: "agency fails to submit extension request (POA&M not valid)", locator: "§C (C-5)"}
      - {from: in-use-under-poam-extension-pending, to: attested, trigger: "producer later attests", locator: "§C ('ensure progress towards attestation', C-9)", kind: inferred}
      - {from: attested, to: in-use, trigger: "agency decision to use", locator: "§A", kind: inferred}
      - {from: "*", to: rescinded, trigger: "OMB M-26-05 issued", locator: "omb-m-26-05#R-0004"}
    error_states: [discontinued]
  - name: program-milestones
    epoch: "P = date OMB approves the CISA common form under the PRA (form final 2024-03-11; OMB control no. 1670-0052)"
    milestones:
      - {id: M7a, offset: "P + 3 months", owner: agencies, deliverable: "attestations for critical software", req: "omb-m-23-16#A-2", replaces: "omb-m-22-18#III.A.3"}
      - {id: M8a, offset: "P + 6 months", owner: agencies, deliverable: "attestations for all in-scope software", req: "omb-m-23-16#A-3", replaces: "omb-m-22-18#III.A.4"}
      - {id: M12, offset: "2023-06-09 + 1 year", date: "2024-06-09", owner: OMB, deliverable: "begin collecting metrics on non-conforming products / POA&M approvals / extensions and waivers", req: "omb-m-23-16#C-11"}
