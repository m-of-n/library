schema: "library-protocol/v1"
record: omb-m-23-16
reviewed_by: ""
note: "Only the exchanges M-23-16 adds or changes; the base flows are in omb-m-22-18/distilled/protocol.yaml."
roles:
  - {name: agency, locator: "§A-§C"}
  - {name: producer, description: "producer of the software end product", locator: "§B.1"}
  - {name: omb, locator: "§C"}
  - {name: lead-agency, description: "agency OMB may designate when several agencies share a producer's POA&M", locator: "§C"}
flows:
  - name: poam-with-extension
    steps:
      - {from: producer, to: agency, message: poam-package, locator: "§C (C-1)"}
      - {from: agency, to: agency, message: poam-determination, locator: "§C (C-2)"}
      - {from: agency, to: omb, message: extension-request, locator: "§C (C-2, C-3)", note: "concurrent with continued use; must include the producer's POA&M"}
    error_paths:
      - {condition: "documentation unsatisfactory or unconfirmed", outcome: "discontinue use", locator: "§C (C-4)"}
      - {condition: "no extension request filed", outcome: "POA&M invalid; discontinue use", locator: "§C (C-5)"}
  - name: shared-poam-coordination
    steps:
      - {from: omb, to: lead-agency, message: lead-agency-designation, locator: "§C (C-7)", optional: true}
      - {from: lead-agency, to: agency, message: common-update, locator: "§C (C-8)"}
      - {from: agency, to: producer, message: progress-follow-up, locator: "§C (C-9)", optional: true}
  - name: contractor-software-determination
    steps:
      - {from: agency, to: agency, message: cio-determination, locator: "§B.3 (B.3-4)"}
