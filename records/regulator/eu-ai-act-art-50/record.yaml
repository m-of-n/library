  note: "Secondary source: the AI Act Explorer at artificialintelligenceact.eu, not the Official Journal. EUR-Lex returned an empty 202 to our client. The Explorer shows paragraph 7 twice with an 'amended' marker and links a Digital Omnibus page. The digest is of that page as served on 2026-11-01. Rechecked 2026-11-04: the page differs on every fetch (an inline Cloudflare challenge script), so the digest cannot be reproduced; the Article 50 text as rendered matches this record. The Explorer's rendering of the Digital Omnibus on AI, Regulation (EU) 2026/1744 (https://artificialintelligenceact.eu/ai-act-explorer/digital-omnibus/, sha256 3aa5cf7672d182d78740759ce539ba5f903084084657fd4954571a0c748fd3a9 as fetched 2026-11-04, also unstable), was read for its Article 50 and 111 amendments; its recital 1 gives the AI Act's OJ reference, OJ L, 2024/1689, 12.7.2024."
