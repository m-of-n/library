  note: "media.defense.gov returned HTTP 403 to every direct fetch on 2026-11-03 (bot blocking; a browser User-Agent did not help). The digest is of the Internet Archive raw (id_) capture of the canonical URL taken 2026-10-23, which the archive serves byte-for-byte; it is the document the canonical URL served on that date, not necessarily what it serves today. Version: the cover reads 'U/OO/6072712-26 | PP-26-3194 | October 2026 Ver. 2.2', PDF created 2026-10-13. The FAQ is revised in place at the same 2022 URL: a 2025-12-23 capture of that URL is 'December 2024 Ver. 2.1' (U/OO/194427-22 | PP-24-4014, sha256 ca447adb27af022f6bcca70873ef3404a7db0758fa0626fe9cd994451d86f5e0, 21 pp.), and the archive's CDX shows the content digest change first captured 2026-10-16. v2.1 was spot-checked against v2.2 only for the differences the summary names. The September 2022 CSA announcing CNSA 2.0 (with the per-category transition chart) is a separate document and is not held. Maturity left unset: none of the enum values fits an agency FAQ that explains a binding NSS policy (CNSSP 15) without being it."
