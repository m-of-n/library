usefulness:
  verdict: useful
  reason: "The strictest stated PQ path any regulator has published: one signature algorithm (ML-DSA-87) plus LMS/XMSS for firmware, no SLH-DSA, no hybrids or composites in PKI, and an explicit 'no generally approved solutions' for threshold signatures."
