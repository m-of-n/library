record: fda-premarket-cybersecurity-guidance
reviewed_by: ""
note: >
  FDA defines no wire format: these 'messages' are the documentation elements a manufacturer
  sends FDA in a premarket submission (Appendix 4 Table 1 is FDA's own organisation of them) and
  the substructures the guidance specifies field by field (SBOM supplement, architecture-view and
  communication-path details of Appendix 2.B, penetration test report elements, labeling items,
  management-plan elements). Field names are ours; every field carries the locator of the text
  that asks for it and constrained_by = the requirement ids that ask for it (computed by section
  filter + text pattern, then reviewed). required: recommended | REQUIRED (statute) | conditional
  | permitted | optional. Encoding is not specified by FDA except 'machine-readable' for the SBOM.
messages:
  - name: premarket-cybersecurity-documentation
    locator: "App. 4 Table 1; \u00a7IV.D; \u00a7VII.C"
    description: "The cybersecurity documentation set of a premarket submission (510(k), De Novo, PMA, PDP, HDE, BLA, IND; IDE subset in App. 3). Table 1 is FDA's own organisation of it; 'This table represents one possible way to organize the recommended information' (App. 4). Element names and the IDE column are verbatim from Table 1."
    encoding: "document"
    fields:
      - name: cybersecurity_risk_management_report
        type: "ref:security-risk-management-report"
        required: "recommended"
        constrained_by:
          - "fda-premarket-cybersecurity-guidance#V.A-11"
          - "fda-premarket-cybersecurity-guidance#V.A-13"
          - "fda-premarket-cybersecurity-guidance#V.A-14"
          - "fda-premarket-cybersecurity-guidance#V.A-15"
          - "fda-premarket-cybersecurity-guidance#V.A-16"
          - "fda-premarket-cybersecurity-guidance#V.A-17"
        notes: "Table 1: Sections V, VI.B; IDE: could be helpful to submit, but not specifically recommended"
      - name: threat_model
