        type: "list"
        required: "recommended"
        constrained_by:
          - "fda-premarket-cybersecurity-guidance#V.A.1-06"
        notes: "supply chain, manufacturing, deployment, interoperation with other devices, maintenance/update, decommission"
      - name: scope
        type: "text"
        required: "recommended"
        constrained_by:
          - "fda-premarket-cybersecurity-guidance#V.A.1-02"
      - name: methodology
        type: "text"
