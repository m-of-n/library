  - name: security-risk-management-report
    locator: "\u00a7V.A"
    description: "Security risk management plan and report 'such as that described in AAMI TIR57 and ANSI/AAMI SW96' (§V.A)."
    encoding: "document"
    fields:
      - name: plan
        type: "document"
        required: "recommended"
        constrained_by:
