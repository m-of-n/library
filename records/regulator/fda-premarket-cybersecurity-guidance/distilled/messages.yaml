          - "fda-premarket-cybersecurity-guidance#VII.C.1-15"
        notes: "differences in risk management for fielded devices / versions"
      - name: update_history
        type: "text"
        required: "recommended"
        constrained_by:
          - "fda-premarket-cybersecurity-guidance#V.A.6-02"
        notes: "kept current as new threats, vulnerabilities, assets, or adverse impacts are discovered"
  - name: threat-model
    locator: "\u00a7V.A.1"
    description: "Threat modeling documentation (§V.A.1); may be conveyed through the architecture views (§V.B.2: 'These views can therefore be an effective way to provide threat modeling information to FDA')."
    encoding: "document"
