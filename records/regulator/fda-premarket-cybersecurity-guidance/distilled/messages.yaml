          - "fda-premarket-cybersecurity-guidance#V.A.3-04"
        notes: "risks and controls associated with interoperability capabilities"
  - name: cybersecurity-risk-assessment
    locator: "\u00a7V.A.2"
    description: "Cybersecurity risk assessment: residual risk of security risks and controls, assessed on exploitability rather than probability (§V.A.2)."
