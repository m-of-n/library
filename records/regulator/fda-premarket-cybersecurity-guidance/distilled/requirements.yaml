note: >
  FDA guidance is non-binding: per Section I, 'should' means suggested or recommended, but not
  required. normativity=recommendation for should/recommend/encourage; normativity=requirement only
  where the guidance restates a statute (FD&C Act 524B, 502) or regulation (21 CFR 820 QMSR /
  ISO 13485:2016, 21 CFR 812.25), with the authority in basis; permission for may/could/can.
  nature extends the v2 enum: process | deliverable | product, where product = a design
  characteristic of the device itself (the Appendix 1 security controls) - the 'technical' kind of
  R-040. Ids are <record>#<section>-NN in source order (section V.A.4(b) -> V.A.4.b; Appendix 1
  subsection letters A-H are FDA's own, used in the text as 'Appendix 1 subsection C'); footnote
  statements are #fnN-NN. Texts are verbatim except footnote call numbers, which pdftotext renders
  as trailing digits and which are removed. expects_deliverables names the premarket documentation
  element of Appendix 4 Table 1 (see messages.yaml); verification says how a reviewer checks it.
  DERIVED fields (actor, nature, phase, expects_deliverables, verification, testable) need human review.
