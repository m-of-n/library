# Sentences that carry a normative form but were NOT extracted, with the reason. Kept so the
# counts above reconcile and a verifier can challenge each exclusion.
excluded:
  - locator: "I"
    text: "Instead, guidances describe the Agency’s current thinking on a topic and should be viewed only as recommendations, unless specific regulatory or statutory requirements are cited."
    reason: "interpretive boilerplate on the legal force of guidance (§I); defines what 'should' means, constrains no actor"
  - locator: "I"
    text: "The use of the word should in Agency guidances means that something is suggested or recommended, but not required."
    reason: "interpretive boilerplate (§I): defines 'should' = suggested or recommended, but not required"
  - locator: "II"
    text: "Furthermore, this guidance applies to all types of devices within the meaning of section 201(h) of the FD&C Act, including devices that meet the definition of a biological product under section 351 of the Public Health Service Act, whether or not they require a premarket submission."
    reason: "scope statement (§II)"
  - locator: "II"
    text: "Therefore, the recommendations in this guidance also apply to devices for which a premarket submission is not required (e.g., for 510(k)-exempt devices)."
    reason: "scope statement (§II)"
  - locator: "IV.D"
    text: "This guidance identifies the cybersecurity information FDA recommends to help support a premarket submission for devices within the scope of this guidance, including but not limited to cyber devices."
    reason: "descriptive: what the guidance contains (§IV.D)"
  - locator: "IV.D"
    text: "For cyber devices, some of the information recommended in this guidance may help manufacturers meet their obligations for what is required to be in premarket submissions under section 524B of the FD&C Act."
    reason: "descriptive cross-reference to §VII"
  - locator: "V"
    text: "The following subsections provide recommendations for using SPDF processes that FDA believes provide important considerations for the development of devices that are safe and effective, how these processes can complement the QMSR, and the documentation FDA recommends manufacturers provide for review as part of premarket submissions."
    reason: "descriptive roadmap of §V"
  - locator: "V"
    text: "These recommendations may be helpful for manufacturers of cyber devices that must “design, develop, and maintain processes and procedures to provide a reasonable assurance that the device and related systems are cybersecure . . .” pursuant to section 524B(b)(2) of the FD&C Act (see Section VII.C.2)."
    reason: "restates the 524B(b)(2) obligation, extracted once at §VII.C.2"
  - locator: "V.A"
    text: "Also, while safety risk management focuses on physical injury, damage to property or the environment, or delay and/or denial of care due to device or system unavailability, security risk management may include risks that can result in indirect or direct patient harm."
    reason: "descriptive contrast of safety vs security risk (§V.A)"
  - locator: "V.A"
    text: "For example, AAMI TIR57 and ANSI/AAMI SW96 detail how the security and safety risk management processes should interface to ensure all risks are adequately assessed."
    reason: "reports the content of AAMI TIR57 / ANSI/AAMI SW96; the recommendation is the preceding sentence"
  - locator: "V.A"
    text: "A security risk management report, such as that described in AAMI TIR57 and ANSI/AAMI SW96, should be sufficient to support the security risk management process aspect of demonstrating a reasonable assurance of safety and effectiveness."
    reason: "FDA statement of sufficiency; constrains no actor"
  - locator: "V.A.1"
    text: "Additional recommendations on how threat modeling documentation should be submitted to FDA are discussed in Section V.B below."
    reason: "cross-reference to §V.B"
  - locator: "V.A.4"
    text: "Manufacturers may not have control of source code due to licensing restrictions, terms of supplier agreements, or other challenges."
    reason: "descriptive acknowledgement of a constraint"
  - locator: "V.A.4(a)"
    text: "A robust SBOM includes both the device manufacturer-developed components and third-party components, including purchased/licensed software and open-source software, and the upstream software dependencies that are required/depended upon by proprietary, purchased/licensed, and open-source software."
    reason: "descriptive characterisation of a robust SBOM ('required/depended upon' describes dependencies)"
  - locator: "V.A.4(b)"
    text: "FDA’s guidance document “Off-The-Shelf (OTS) Software Use in Medical Devices” describes information that should be provided in premarket submissions for software components for which a manufacturer cannot claim complete software lifecycle control."
    reason: "reports another guidance's recommendations (OTS guidance); not restated here"
  - locator: "V.A.5"
    text: "FDA’s Premarket Software Guidance recommends that device manufacturers provide a list of software anomalies that exist in a product at the time of submission."
    reason: "reports another guidance's recommendation (Premarket Software Guidance); the security-specific recommendation follows in §V.A.5"
  - locator: "V.A.5"
    text: "Some anomalies discovered during development or testing may have security implications and may also be considered vulnerabilities."
    reason: "descriptive"
  - locator: "V.B"
    text: "These risks may include those introduced by device reliance on hospital networks, cloud infrastructure, or “other functions” (as defined in FDA’s guidance “Multiple Function Device Products: Policy and Considerations”), for example."
    reason: "descriptive enumeration of risk sources"
  - locator: "VI.A"
    text: "Secure configurations may include end point protections such as anti-malware, firewall/firewall rules, allow lists, deny lists, security event parameters, logging parameters, and physical security detection, and resetting of credentials, among others."
    reason: "example enumeration qualifying the preceding labeling item"
  - locator: "VI.A"
    text: "At the end of support, a manufacturer may no longer be able to reasonably provide security patches or software updates."
    reason: "descriptive consequence of end of support"
  - locator: "VII.C.1"
    text: "A “known unacceptable vulnerability” in section 524B(b)(2)(A) contrasts with a “critical vulnerability that could cause uncontrolled risks” in section 524B(b)(2)(B)."
    reason: "interpretive contrast of 524B(b)(2)(A) vs (B); carried in state-machine.yaml"
  - locator: "VII.C.1"
    text: "A known unacceptable vulnerability could include a vulnerability that could not cause uncontrolled risks; a vulnerability that is not currently known to cause uncontrolled risks; or a vulnerability that could present controlled risk, as described in FDA’s Postmarket Cybersecurity Guidance."
    reason: "interpretive definition; carried in state-machine.yaml"
  - locator: "VII.C.1"
    text: "In general, this includes vulnerabilities that could cause uncontrolled risks, as described in FDA’s Postmarket Cybersecurity Guidance."
    reason: "interpretive definition of 524B(b)(2)(B) scope; carried in state-machine.yaml"
  - locator: "VII.D"
    text: "In keeping with least burdensome principles, the information we recommend that manufacturers of cyber devices provide will generally differ based on the type of change and whether such change impacts the cybersecurity of the device."
    reason: "descriptive: recommended information differs by change type"
  - locator: "VII.D.1"
    text: "In general, changes that may impact cybersecurity and may require premarket submission could include changes to authentication or encryption algorithms, new connectivity features, or changing software update process/mechanisms."
    reason: "classification examples; held as fixtures in distilled/examples/modification-classification.yaml"
  - locator: "VII.D.2"
    text: "In general, changes unlikely to impact cybersecurity could include changes in materials, sterilization method changes, or a change to an algorithm without change to architecture/software structure/connectivity."
    reason: "classification examples; held as fixtures in distilled/examples/modification-classification.yaml"
  - locator: "VII.E"
    text: "Section 3305(c) of FDORA provides that nothing in section 524B of the FD&C Act “shall be construed to affect the Secretary’s authority related to ensuring that there is a reasonable assurance of the safety and effectiveness of devices, which may include ensuring that there is a reasonable assurance of the cybersecurity of certain cyber devices . . .”"
    reason: "statutory rule of construction about FDA authority; constrains no manufacturer"
  - locator: "App1.F"
    text: "Secure configurations may include endpoint protections, such as anti-malware, firewall/firewall rules, allow-listing, defining security event parameters, logging parameters, physical security detection, and/or HIDS/HIPS."
    reason: "example enumeration qualifying the preceding design recommendation"
  - locator: "App2.B"
    text: "Security-relevant analysis requires the ability to construct and follow a detailed trace for important communication paths, which describes how data, code, and commands are protected between any two assets in the medical device system."
    reason: "descriptive: what the analysis needs"
  - locator: "App2.B"
    text: "This analysis can also help identify the software that should be included in the SBOM for each device."
    reason: "descriptive: benefit of the trace (SBOM completeness)"
  - locator: "App4"
    text: "Table 1 below summarizes the specific documentation elements identified throughout the guidance for premarket submissions, the associated sections of the guidance for the document, and whether the documentation is recommended for IDE submissions."
    reason: "descriptive introduction to Table 1"
  - locator: "III fn 14"
    text: "While section 524B(b)(4) of the FD&C Act authorizes FDA to promulgate additional cybersecurity requirements via regulation, FDA is not required to promulgate a regulation to elaborate on the new requirements specified in section 524B of the FD&C Act."
    reason: "statement of FDA rulemaking authority (fn 14)"
  - locator: "IV.D fn 22"
    text: "As previously discussed, section 524B of the FD&C Act requires the submission of certain documentation for cyber devices."
    reason: "generic cross-reference to §VII (fn 22)"
  - locator: "V.A fn 29"
    text: "AAMI TIR57 Principles for medical device security—Risk management describes the security risk management process and how the security risk management process should have links into the safety risk management process and vice versa."
    reason: "describes the content of AAMI TIR57 / SW96 (fn 29)"
  - locator: "V.A fn 33"
    text: "While security architecture is likely captured as a component of the security risk management process, it is discussed separately for the purposes of this guidance due to the level of detail recommended to be provided by manufacturers in order to facilitate FDA review of the safety and effectiveness of the device."
    reason: "editorial note on document structure (fn 33)"
  - locator: "VII.C.1 fn 65"
    text: "At the same time, exploitation of a seemingly lower-risk device may provide opportunities to affect other devices within the environment of use, leading to significantly greater risk of harm if these other devices or the larger environment are exploited or disrupted."
    reason: "descriptive (fn 65)"
  - locator: "App1.B fn 77"
    text: "The NIST Computer Security Resource Center Glossary defines “least privilege” as “A security principle that a system should restrict the access privileges of users (or processes acting on behalf of users) to the minimum necessary to accomplish assigned tasks”"
    reason: "quoted external definition (fn 77)"
  - locator: "App1.E fn 82"
    text: "Although protecting the confidentiality of PHI is beyond the scope of this document, it should be noted that manufacturers and other entities, depending on the facts and circumstances, may be obligated to protect the confidentiality, integrity and availability of PHI throughout the product lifecycle, in accordance with applicable federal and state laws, including the Health Insurance Portability and Accountability Act (HIPAA)."
    reason: "out-of-scope note on HIPAA obligations (fn 82)"
