# §VII.D fixtures: which 524B documentation a cyber-device MODIFICATION submission carries.
schema: "library-examples/v1"
record: fda-premarket-cybersecurity-guidance
function: modification_documentation(change) -> {impact, documentation}
cases:
  - {id: auth-algorithm-change, source: stated, locator: "§VII.D.1", change: "changes to authentication or encryption algorithms", expected: {impact: may-impact-cybersecurity, documentation: "full §VII.C (524B(b)(1)-(3)) required and recommended documentation"}}
  - {id: new-connectivity, source: stated, locator: "§VII.D.1", change: "new connectivity features", expected: {impact: may-impact-cybersecurity, documentation: "full §VII.C"}}
  - {id: update-mechanism-change, source: stated, locator: "§VII.D.1", change: "changing software update process/mechanisms", expected: {impact: may-impact-cybersecurity, documentation: "full §VII.C"}}
  - {id: materials-change, source: stated, locator: "§VII.D.2", change: "changes in materials", expected: {impact: unlikely-to-impact-cybersecurity, documentation: "abbreviated: 524B(b)(1) plan (or reference + summary of changes), statement on critical vulnerabilities with uncontrolled risk and remediations since last authorization, SBOM (statutory)"}}
  - {id: sterilization-change, source: stated, locator: "§VII.D.2", change: "sterilization method changes", expected: {impact: unlikely-to-impact-cybersecurity, documentation: abbreviated}}
  - {id: algorithm-no-arch-change, source: stated, locator: "§VII.D.2", change: "a change to an algorithm without change to architecture/software structure/connectivity", expected: {impact: unlikely-to-impact-cybersecurity, documentation: abbreviated}}
always: "regardless of the type of change ... FDA intends to take into account known cybersecurity concerns that are applicable to such device (§VII.D.2, last paragraph)"
