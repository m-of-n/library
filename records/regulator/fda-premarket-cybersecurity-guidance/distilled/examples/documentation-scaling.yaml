# Scaling fixtures: documentation breadth scales with CYBERSECURITY risk, not software Documentation Level (§IV.D).
schema: "library-examples/v1"
record: fda-premarket-cybersecurity-guidance
cases:
  - id: thermometer-isolated
    source: stated
    locator: "§IV.D"
    input: "simple, non-connected thermometer"
    expected: "risk assessment may conclude that the risks are limited; limited security architecture (device hardware and software only) and few security controls"
  - id: thermometer-in-control-loop
    source: stated
    locator: "§IV.D"
    input: "thermometer used in a safety-critical control loop, or connected to networks or other devices"
    expected: "greater cybersecurity risk; more substantial design and development activities should result"
  - id: usb-only-vs-network-cloud
    source: stated
    locator: "§V.B.2"
    input: ["medical device system with network and/or cloud access", "medical device system that has only a USB interface"]
    expected: "the first is expected to have more Security Use Case Views than the second"
  - id: single-connection-or-simple-samd
    source: stated
    locator: "App. 4, first bullet"
    input: "device with only one hardware connection (e.g., USB port) or a SaMD product with limited other software dependencies and connectivity"
    expected: "a single architecture view each for global system, multi-patient harm, updateability/patchability; a smaller subset of unique security use case views"
  - id: complex-networked
    source: stated
    locator: "App. 4, second bullet"
    input: "networking, wireless connections, cloud, and/or commercial operating systems"
    expected: "multiple multi-patient harm and updateability/patchability views may be needed; many security use case views"
  - id: software-risk-vs-cyber-risk
    source: stated
    locator: "§IV.D"
    input: ["greater software risk, small cybersecurity risk by design", "smaller software risk, significant cybersecurity risk"]
    expected: "documentation follows the cybersecurity risk assessment, not the Premarket Software Guidance Documentation Level"
  - id: regular-cycle-length
    source: stated
    locator: "fn 65"
    input: ["interconnected thermometer (taking and reporting temperature)", "interconnected surgery robot"]
    expected: "the thermometer may have lower risk of harm if exploited and so may justify a different regular update cycle — but exploitation of a seemingly lower-risk device may affect other devices in the environment of use"
