# Fixtures for the section 524B(c) "cyber device" test as FDA interprets it in §VII.B.
# Rule (statute, quoted in §VII.B): a cyber device "(1) includes software validated, installed, or
# authorized by the sponsor as a device or in a device; (2) has the ability to connect to the
# internet; and (3) contains any such technological characteristics validated, installed, or
# authorized by the sponsor that could be vulnerable to cybersecurity threats." All three must hold.
# FDA's interpretation (§VII.B): software includes firmware and programmable logic; "ability to
# connect to the internet" includes intentional or unintentional connection "through any means".
# Cases marked source: stated come from the guidance text; source: constructed are ours, built to
# exercise each criterion, and say so.
schema: "library-examples/v1"
record: fda-premarket-cybersecurity-guidance
function: is_cyber_device(includes_sponsor_software, can_connect_to_internet, has_vulnerable_characteristics) -> bool
connectivity_features_that_count:   # §VII.B list, "illustrative, not exhaustive"
  - "Network, server, or Cloud Service Provider connections"
  - "Radio-frequency communications (e.g., Wi-Fi, cellular, Bluetooth, Bluetooth Low Energy)"
  - "Magnetic inductive communications"
  - "Hardware connectors capable of connecting to the internet (e.g., USB, ethernet, serial port)"
cases:
  - id: usb-service-port
    source: stated
    locator: "fn 61"
    text: "For example, a device may need to be serviced via a USB connection. While the connection may be brief, the ability to connect is present and the device is therefore considered to have the ability to connect to the internet."
    input: {includes_sponsor_software: true, connectivity: ["USB (service only)"], has_vulnerable_characteristics: true}
    expected: {can_connect_to_internet: true, is_cyber_device: true}
  - id: implant-magnetic-inductive
    source: stated
    locator: "§VII.B list; fn 60"
    text: "magnetic inductive communication allows wireless data transmission between an implantable medical device and an external programmer."
    input: {includes_sponsor_software: true, connectivity: ["magnetic inductive"], has_vulnerable_characteristics: true}
    expected: {can_connect_to_internet: true, is_cyber_device: true}
  - id: firmware-only-ble
    source: stated
    locator: "§VII.B ('software, including software that is firmware or programmable logic'; RF list)"
    input: {includes_sponsor_software: true, software_kind: firmware, connectivity: ["Bluetooth Low Energy"], has_vulnerable_characteristics: true}
    expected: {can_connect_to_internet: true, is_cyber_device: true}
  - id: fpga-programmable-logic
    source: stated
    locator: "§VII.B; fn 57; App. 5 'Programmable logic'"
    input: {includes_sponsor_software: true, software_kind: programmable-logic, connectivity: ["ethernet"], has_vulnerable_characteristics: true}
    expected: {is_cyber_device: true}
  - id: unintended-connectivity
    source: stated
    locator: "§VII.B ('whether intentionally or unintentionally, through any means'; 'regardless of whether such connectivity was intended by the device sponsor')"
    input: {includes_sponsor_software: true, connectivity: ["serial port, not intended for network use"], has_vulnerable_characteristics: true}
    expected: {can_connect_to_internet: true, is_cyber_device: true}
  - id: no-software
    source: constructed
    locator: "524B(c)(1)"
    input: {includes_sponsor_software: false, connectivity: ["ethernet"], has_vulnerable_characteristics: false}
    expected: {is_cyber_device: false}
    note: "criterion (1) fails; the guidance gives no worked negative example"
  - id: no-connectivity-at-all
    source: constructed
    locator: "524B(c)(2); §VII.B"
    input: {includes_sponsor_software: true, connectivity: [], has_vulnerable_characteristics: true}
    expected: {is_cyber_device: false}
    note: "only if no means of connection exists at any point identified in the threat-surface evaluation; any hardware connector flips this (usb-service-port). The guidance still applies to such a device (§II: not limited to network-enabled devices) — only 524B does not."
