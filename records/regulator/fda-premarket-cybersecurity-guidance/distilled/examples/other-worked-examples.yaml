# The remaining illustrative examples in the guidance, verbatim, with the expected behaviour they illustrate.
schema: "library-examples/v1"
record: fda-premarket-cybersecurity-guidance
cases:
  - id: nse-alarm-no-encryption
    locator: "§VII.E"
    text: "if in reviewing the 510(k) for an alarm for a central nursing station software, FDA identifies that the device has increased risks compared to its predicate because it does not have the necessary encryption to protect against a recently identified cyber threat, FDA may ask for additional performance data (e.g., see the documentation recommendations in Section V). If the data provided is inadequate, FDA would likely make a determination that the new device is not substantially equivalent (NSE) to the predicate device"
    expected: "state-machine.yaml device-support-lifecycle: premarket-review -> design-development on additional-information request / NSE if data inadequate"
  - id: end-to-end-update-path
    locator: "§V.B.2(c)"
    text: "if a device manufacturer intends to push software from a software update server to an in-clinic cardiac implant programmer, “end-to-end” means the path from the update server to the in-clinic programmer that programs the implanted device."
    expected: "updatability/patchability view covers update server -> programmer -> implant, incl. non-manufacturer-controlled technology traversed"
  - id: multi-patient-monitors
    locator: "§V.B.2(b)"
    text: "multiparameter bedside monitors all restarting at once, leaving all monitors connected to the same network no longer monitoring patient vitals and staffing levels not able to monitor all patient vitals"
    expected: "a multi-patient harm scenario the multi-patient harm view must address"
  - id: hostile-network-assumption
    locator: "§V.A.1"
    text: "hospital networks are inherently hostile, therefore manufacturers are recommended to assume that an adversary controls the network with the ability to alter, drop, and replay packets"
    expected: "default threat-model assumption: network adversary with alter/drop/replay capability"
  - id: patient-credential-compromise
    locator: "App. 1 B"
    text: "in a situation in which a malicious actor has gained access to a credential associated with patient privileges, that malicious actor should not be able to access device resources or functionality reserved for the manufacturer or for the healthcare provider, such as device maintenance routines or the ability to change medication dosage amounts."
    expected: "least-privilege test: patient-role credential denied maintenance and dosage functions"
  - id: nfc-signal-of-intent
    locator: "App. 1 B"
    text: "a medical device programmer that is capable of Near-Field Communications (NFC) could have elevated privileges that are granted based on a signal of intent over NFC that cannot physically be produced by another unauthorized device over Radio-Frequency (RF) (e.g., a home monitor)."
    expected: "authorization based on physical proximity evidence, justified by benefit/risk per AAMI TIR57 / SW96 and security testing"
  - id: mutual-auth-offsite-server
    locator: "App. 1 A"
    text: "if a device connects to an offsite server, then the device and the server should mutually authenticate each session and limit the duration of the session, even if the connection is initiated over one or more existing trusted channels"
    expected: "messages.yaml communication-path between device and offsite server: mutual authentication of each session, bounded session duration, even over existing trusted channels"
  - id: ble-underlay-controls
    locator: "§V.A.3"
    text: "added security controls beneath Bluetooth Low Energy to protect against risks if vulnerabilities in the Bluetooth Low Energy protocol or supporting technology are discovered"
    expected: "defence in depth below a standard interoperability protocol"
  - id: clinical-user-anomaly
    locator: "§V.A.5"
    text: "a clinical user may inadvertently reveal the presence of a previously unknown software anomaly during normal use, where the impact of the anomaly might occur sporadically and be assessed to be acceptable from a software risk perspective. Conversely, a threat might seek out these types of anomalies, and identify means to exploit them in order to manifest the anomaly’s impact continuously"
    expected: "see vulnerability-disposition.yaml security-anomaly"
  - id: programming-and-data-share-protocol
    locator: "§V.B.2(d)"
    text: "programming commands and sending/receiving device data may share the same communication protocol and therefore may not exhibit differences between the security views for both scenarios, despite having different clinical risk assessments."
    expected: "one security use case view may cover several use cases with the same security assessment"
