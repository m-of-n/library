gaps:
  - "CyberDevice classification: a rule-evaluated facet on Product (three statutory criteria) that switches recommendations into requirements — tmodel has no applicability/regime facet."
  - "SoftwareComponent.level_of_support and end_of_support_date: Component lacks support-status attributes; needed for SBOM supplement and EoS risk."
  - "Mitigation owner/locus: designed-in control vs compensating control (user-deployed) vs risk transfer — MitigationInstance needs a locus (manufacturer|user|patient) beyond R-040 kind."
  - "SecurityObjective as a property achieved by controls (authenticity, authorization, availability, confidentiality, updatability) — no tmodel object."
  - "Traceability as a first-class, checkable artifact (TM ↔ risk assessment ↔ SBOM ↔ tests ↔ architecture elements ↔ requirements) — R-042 needs these typed edges and a completeness check."
  - "Safety risk vs security risk as two linked assessments with an explicit transfer method — tmodel has one RiskScore axis."
  - "Program-level metrics (time-to-patch, deployment latency) on the SDL object."
  - "Modification events with an impact class on the version axis."
  - "SecurityEvent / incident at runtime (shared gap with the CRA)."
