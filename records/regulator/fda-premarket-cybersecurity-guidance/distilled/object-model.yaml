schema: "library-object-model/v1"
record: fda-premarket-cybersecurity-guidance
source_version: "2026-02-03 final guidance"
note: >
  Object-model pass over the cleaned capture (.cache/fda-premarket-cybersecurity-guidance.md), asking one
  question: what entity types and edges does the guidance assume or define? Appendix 5 terminology gives the
  definitions where it has them; other objects are named in the body. kind: stated = the guidance names the
  object or relation; inferred = we name it, flagged. tmodel_mapping is against ARCH-0001 v0.2.0 and DL-0009.
objects:
  - {name: MedicalDeviceSystem, definition: "the device together with the larger system in which it operates; the unit of threat modeling and security architecture", attributes: [intended_use, indications_for_use, reasonably_foreseeable_misuse, environment_of_use], locator: "§V.A, §V.B; App. 5 'System'", kind: stated, tmodel_mapping: "Product + Deployment→Environment (ARCH §1.1)", notes: "App. 5 'System – the combination of interacting elements or assets organized to achieve one or more function.'"}
  - {name: Device, definition: "the medical device under submission", attributes: [device_type, software, hardware, firmware, programmable_logic], locator: "§II, §VII.B", kind: stated, tmodel_mapping: "Product / ProductInstance"}
  - {name: CyberDevice, definition: "device that (1) includes software validated, installed, or authorized by the sponsor as a device or in a device; (2) has the ability to connect to the internet; and (3) contains any such technological characteristics ... that could be vulnerable to cybersecurity threats", attributes: [includes_software, can_connect_to_internet, vulnerable_characteristics], locator: "§VII.B; FD&C 524B(c)", kind: stated, tmodel_mapping: "new — a classification facet on Product that triggers statutory requirements", notes: "Subtype of Device. FDA reads 'ability to connect to the internet' as intentional or unintentional connection through any means (USB, serial, RF, magnetic inductive)."}
  - {name: RelatedSystem, definition: "manufacturer-controlled elements such as other devices, software performing 'other functions', software/firmware update servers, and connections to healthcare facility networks", attributes: [], locator: "§VII.C.2", kind: stated, tmodel_mapping: "Component / Interconnect in the structural layer"}
  - {name: Asset, definition: "anything that has value to an individual or an organization", attributes: [category], locator: "App. 5 'Asset'; App. 2.B", kind: stated, tmodel_mapping: "Component (structural) / Asset", notes: "App. 2.B categories: device hardware; directly interacting applications/hardware; healthcare facility-operated assets; communications/networking assets; manufacturer-controlled assets (e.g., update server)."}
  - {name: CommunicationPath, definition: "a path between any two assets, direct or through intermediate assets", attributes: [interfaces, carries (data|code|commands), protocol_name, protocol_version, ports_channels_frequencies, authentication_mechanism, crypto_method, session_management, handoff_sequences, unused_interfaces], locator: "App. 2.B", kind: stated, tmodel_mapping: "DataFlow + Interconnect/NetworkLink (ARCH §1.1-1.2)"}
  - {name: Interface, definition: "electronic data interface / network port that receives or sends data", attributes: [direction (incoming|outgoing|both), functionality, approved_destination_endpoints], locator: "§IV.B, §VI.A", kind: stated, tmodel_mapping: "AttackSurface element"}
  - {name: TrustBoundary, definition: "security context, domains, boundaries of the medical device system", attributes: [], locator: "§V.B, §V.B.2; App. 5 'Boundary Analysis'", kind: stated, tmodel_mapping: "TrustBoundary (zone)"}
  - {name: Party-Manufacturer, definition: "device manufacturer / sponsor submitting the premarket submission", attributes: [], locator: "§VII.A, fn 53", kind: stated, tmodel_mapping: "Party (manufactured_by edge role)"}
  - {name: User, definition: "user/operator of the device: patients, caregivers, healthcare facilities, servicers", attributes: [type, capability_to_take_mitigation_role], locator: "§V, §VI, §VI.A", kind: stated, tmodel_mapping: "Party (operator/consumer roles)", notes: "'different types of users ... will have different abilities to take on a mitigation role' (§VI)."}
  - {name: Regulator-FDA, definition: "FDA as reviewer of premarket submissions", attributes: [], locator: "§IV.D, §VII.E", kind: stated, tmodel_mapping: "Party (regulator classification) — new intrinsic classification"}
  - {name: QualityManagementSystem, definition: "QMSR, 21 CFR Part 820, incorporating ISO 13485:2016 by reference", attributes: [], locator: "§IV.A", kind: stated, tmodel_mapping: "none — organizational context of an SDL program (R-041)"}
  - {name: SPDF, definition: "Secure Product Development Framework: a set of processes that reduce the number and severity of vulnerabilities in products", attributes: [processes], locator: "§IV.A.1; App. 5", kind: stated, tmodel_mapping: "SDL / SecurityProgram (R-041)", notes: "FDA names JSP2, IEC 81001-5-1, ANSI/ISA 62443-4-1 as candidate frameworks (§V)."}
  - {name: SecurityObjective, definition: "authenticity (incl. integrity); authorization; availability; confidentiality; secure and timely updatability and patchability", attributes: [name], locator: "§IV.B", kind: stated, tmodel_mapping: "new — a property a control achieves; close to STRIDE's inverse properties"}
  - {name: SecurityControlCategory, definition: "Authentication; Authorization; Cryptography; Code, Data, and Execution Integrity; Confidentiality; Event Detection and Logging; Resiliency and Recovery; Updatability and Patchability", attributes: [name], locator: "§V.B.1; App. 1 A-H", kind: stated, tmodel_mapping: "Mitigation (generic, D3FEND-like) category"}
  - {name: SecurityControl, definition: "a control built into the device design; management, technical and operational controls across the system", attributes: [category, requirement, acceptance_criteria, implemented, tested], locator: "§V.B.1", kind: stated, tmodel_mapping: "MitigationInstance kind=technical (R-040)"}
  - {name: CompensatingControl, definition: "a safeguard or countermeasure deployed, in lieu of, or in the absence of controls designed in by a device manufacturer. These controls are external to the device design, configurable in the field, employed by a user, and provide supplementary or comparable cyber protection for a medical device.", attributes: [], locator: "App. 5; §V.A", kind: stated, tmodel_mapping: "MitigationInstance with owner=user (R-040) — needs an owner/locus attribute"}
  - {name: SecurityRequirement, definition: "design input requirement for security, with acceptance criteria", attributes: [text, acceptance_criteria, category], locator: "§V.B, §V.B.1, §V.C", kind: stated, tmodel_mapping: "Requirement (R-042/R-044) — product-level, not spec-level"}
  - {name: ThreatModel, definition: "documentation of threat modeling: a methodology for identifying objectives and vulnerabilities, then defining countermeasures", attributes: [methodology, methodology_rationale, assumptions, risks, mitigations, pre_post_mitigation_risks], locator: "§V.A.1; App. 5 'Threat modeling'", kind: stated, tmodel_mapping: "the tmodel threat-model governed view (R-043)"}
  - {name: Threat, definition: "any circumstance or event with the potential to adversely impact the device ... through an information system via unauthorized access, destruction, disclosure, modification of information, and/or denial of service", attributes: [], locator: "App. 5 'Threat'", kind: stated, tmodel_mapping: "ThreatInstance"}
  - {name: Vulnerability, definition: "a weakness in an information system, system security procedure(s), internal control(s), human behavior, or implementation that could be exploited", attributes: [discovery_method, in_cisa_kev, exploitability, known_unacceptable, critical, residual_risk (controlled|uncontrolled)], locator: "App. 5; §V.A.2, §V.A.4(b), §VII.C.1", kind: stated, tmodel_mapping: "Finding/Vulnerability"}
  - {name: Anomaly, definition: "any condition that deviates from the expected behavior based on user needs, requirements, specifications, design documents, or standards", attributes: [security_impact, cwe_categories, resolved], locator: "App. 5; §V.A.5", kind: stated, tmodel_mapping: "Finding (non-security defect that may be a vulnerability) — new subtype"}
  - {name: CybersecurityRiskAssessment, definition: "assessment of security risks and controls for residual risk, exploitability-based (non-probabilistic)", attributes: [scoring_method, acceptance_criteria, pre_mitigation_risk, post_mitigation_risk, transfer_method_to_safety_risk], locator: "§V.A.2", kind: stated, tmodel_mapping: "RiskScore + attack_feasibility (ARCH §3, DEC-003)"}
  - {name: SafetyRiskAssessment, definition: "ISO 14971 safety risk management, distinct from but linked to security risk management", attributes: [], locator: "§V.A, §V.A.2", kind: stated, tmodel_mapping: "none — separate axis (critic H3: do not overload S/F/O/P)"}
  - {name: SecurityRiskManagementPlan, definition: "plan for security risk management, e.g., per AAMI TIR57 / ANSI/AAMI SW96", attributes: [], locator: "§V.A", kind: stated, tmodel_mapping: "governed document view (R-043)"}
  - {name: SecurityRiskManagementReport, definition: "report containing threat model, risk assessment, SBOM, component support information, vulnerability assessments, unresolved anomaly assessments; risk evaluation methods; residual risk conclusion; mitigation activities; traceability", attributes: [risk_evaluation_methods, residual_risk_conclusion, mitigation_activities, traceability], locator: "§V.A; App. 4 Table 1", kind: stated, tmodel_mapping: "governed document view (R-043) — the tmodel report"}
  - {name: RiskTransfer, definition: "transfer of residual risk to the user/operator or patient", attributes: [recipient, information_communicated, eos_handling], locator: "§V.A, fn 31; §VI.A", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation + Review (R-040) — needs explicit acceptance by recipient"}
  - {name: SBOM, definition: "a formal inventory of software components and dependencies, information about those components, and their hierarchical relationships", attributes: [format (machine-readable, industry-accepted), ntia_minimum_elements], locator: "App. 5; §V.A.4(a)-(b), §VII.C.3", kind: stated, tmodel_mapping: "materialisation of composed_of / uses_component"}
  - {name: SoftwareComponent, definition: "proprietary, purchased/licensed, open-source, off-the-shelf software and upstream dependencies", attributes: [ntia_baseline_attributes, level_of_support, end_of_support_date, known_vulnerabilities], locator: "§V.A.4, §V.A.4(b)", kind: stated, tmodel_mapping: "Component (purl/CPE) — level_of_support and end_of_support_date are new attributes"}
  - {name: KEVCatalogEntry, definition: "a vulnerability listed in CISA's Known Exploited Vulnerabilities Catalog", attributes: [], locator: "§V.A.2, §V.A.4(b), §VI.B", kind: stated, tmodel_mapping: "external_ref on Vulnerability"}
  - {name: ArchitectureView, definition: "security architecture view; types: Global System, Multi-Patient Harm, Updatability/Patchability, Security Use Case", attributes: [view_type, diagrams, explanatory_text, call_flows, omission_explanation], locator: "§V.B.2; App. 2", kind: stated, tmodel_mapping: "View/Perspective (ARCH §10) promoted to a governed view (R-043)"}
  - {name: SecurityUseCase, definition: "system functionality through which a compromise could impact safety or effectiveness, across operational and clinical functionality states", attributes: [operational_states, clinical_states], locator: "§V.B.2(d)", kind: stated, tmodel_mapping: "Workflow (ARCH §1.2) — new link to clinical states"}
  - {name: TestReport, definition: "security testing documentation: security requirements, threat mitigation, vulnerability testing, penetration testing", attributes: [test_type, performed_by, independence, scope, duration, methods, results, findings_assessment, deferral_rationale], locator: "§V.C", kind: stated, tmodel_mapping: "Evidence (R-042)"}
  - {name: Tester, definition: "who performed the testing (independent internal testers, external testers) and their independence from the developers", attributes: [independence_level, technical_expertise], locator: "§V.C", kind: stated, tmodel_mapping: "Party role"}
  - {name: TraceabilityLink, definition: "traceability between threat model, cybersecurity risk assessment, SBOM, testing documentation; architecture elements to security requirements; diagram elements to hazards, controls and testing; assets to SBOM components", attributes: [from, to], locator: "§V.A, §V.B.2; App. 2.B", kind: stated, tmodel_mapping: "typed edges + Assertion (ARCH §4) — the core of R-042"}
  - {name: Labeling, definition: "device labeling carrying cybersecurity information for users", attributes: [items (VI.A list), audience], locator: "§VI.A", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation (R-040)"}
  - {name: CybersecurityManagementPlan, definition: "plan to identify and communicate postmarket vulnerabilities; for cyber devices the 524B(b)(1) plan", attributes: [personnel, monitoring_sources_methods_frequency, kev_handling, periodic_testing, patch_timeline, update_process, patching_capability, cvd_process, customer_communication], locator: "§VI.B, §VII.C.1", kind: stated, tmodel_mapping: "MitigationInstance kind=process (R-040) + governed view"}
  - {name: CVDProcess, definition: "coordinated vulnerability disclosure and related procedures", attributes: [external_disclosure, manufacturer_disclosure, procedures], locator: "§VII.C.1", kind: stated, tmodel_mapping: "process (cf. iso-iec-29147-2018)"}
  - {name: Update, definition: "corrective, preventative, adaptive, or perfective modifications made to software of a medical device; a patch is the immediate fix", attributes: [cadence (regular|out-of-cycle), version_identifiable, authorized], locator: "App. 5 'Update', 'Patch'; §VII.C.1", kind: stated, tmodel_mapping: "MitigationInstance kind=technical; Release"}
  - {name: Metric, definition: "SPDF effectiveness measures: % vulnerabilities patched; time from identification to patch; time from patch availability to field deployment", attributes: [name, value, timeframe], locator: "§V.A.6", kind: stated, tmodel_mapping: "new — program-level KPI on the SDL object (R-041)"}
  - {name: PremarketSubmission, definition: "510(k), PMA, PDP, De Novo, HDE (and BLA/IND for CBER) submission; IDE subset", attributes: [pathway, documentation_elements], locator: "§II, §VII.A; App. 4 Table 1", kind: stated, tmodel_mapping: "Gate (R-041) — the regulatory release gate"}
  - {name: Modification, definition: "a change to a marketed device: may impact cybersecurity or unlikely to impact", attributes: [impact_class], locator: "§VII.D", kind: stated, tmodel_mapping: "new — change event on ProductInstance version axis"}
  - {name: QSubmission, definition: "pre-submission interaction with FDA to discuss design considerations", attributes: [], locator: "§V.B.1", kind: stated, tmodel_mapping: "Gate (optional early checkpoint)"}
  - {name: EndOfSupport, definition: "a point beyond which the product manufacturer ceases to provide support, which may include cybersecurity support", attributes: [date], locator: "App. 5; §VI.A", kind: stated, tmodel_mapping: "LifecyclePhase end-of-support (ARCH §3b) — needs a date"}
  - {name: DesignHistoryRecords, definition: "Design and Development Files (ISO 13485 7.3.10) and Medical Device File (4.2.3)", attributes: [], locator: "§V.A.4", kind: stated, tmodel_mapping: "governed views (R-043)"}
  - {name: SecurityEvent, definition: "anomalous conditions detected by the device: configuration changes, network anomalies, login attempts, anomalous traffic", attributes: [type, logged, user_notified], locator: "§VI.A; App. 1 F", kind: stated, tmodel_mapping: "new (operational) — cf. CRA Incident gap"}
