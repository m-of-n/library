  not_applicable:
    - kind: protocol
      reason: "The guidance defines no message exchange between parties: CVD procedures are to be described in the cybersecurity management plan (§VI.B, §VII.C.1) and their flows and timelines are in FDA's separate 2016 Postmarket Cybersecurity Guidance; the FDA review interaction (Q-Submission, additional-information requests, SE/NSE) is agency procedure documented elsewhere. The one exchange-like outcome (NSE on inadequate data, §VII.E) is a transition in state-machine.yaml device-support-lifecycle."
