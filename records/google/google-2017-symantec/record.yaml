  note: "Digest is of the whole Blogger HTML page, which carries template, sidebar and widget markup around the post, including a per-render token with a timestamp (window['__wavt']). The page bytes therefore change between fetches whatever the content: 2026-11-01 gave sha256 9a700cdd...4c2f, an earlier attempt on 2026-11-04 recorded 053460a2...4350, and this pass got 428d479c...9275 (recorded) and 1a397a14...a5d6; on 2026-11-04 the server reported Last-Modified 2026-11-02 throughout. The post itself sits in a script text/template block; that block's bytes hashed the same in two fetches with different page digests, sha256 a5a978b496b6bdfa48af052e4bfc4866221a7e551021e6794d70cc4c5681e0cc, 18,708 bytes, and are the stable check. Earlier bytes were not kept, so whether the post text changed before 2026-11-04 cannot be shown."
