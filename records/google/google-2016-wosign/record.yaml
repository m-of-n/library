  note: "Digest is of the whole Blogger HTML page, which carries template, sidebar and widget markup around the post, including a per-render token with a timestamp (window['__wavt']). The page bytes therefore change between fetches whatever the content: 2026-11-01 gave sha256 36b4b2d7...6e3c, an earlier attempt on 2026-11-04 recorded 6852c0e8...7275, and this pass got b65e8723...614b (recorded) and dc975f4a...6dfb; on 2026-11-04 the server reported Last-Modified 2026-11-02 throughout. The post itself sits in a script text/template block; that block's bytes hashed the same in two fetches with different page digests, sha256 ec3b8ff1d3836e4d8c82dd942ea3cf627b4bb0248aac2d12d641307c90e7b1de, 4,319 bytes, and are the stable check. Earlier bytes were not kept, so whether the post text changed before 2026-11-04 cannot be shown."
