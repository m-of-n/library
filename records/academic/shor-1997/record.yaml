usefulness:
  verdict: useful
  reason: "The primary source for the threat model behind the post-quantum-migration topic. Read closely, it covers factoring and discrete logs in cyclic multiplicative groups of fields (sections 5-6), and mentions only an abelian-group generalisation by Boneh and Lipton (section 6). It does not itself treat elliptic curves. 'Shor breaks ECDSA/EdDSA' rests on later work, not on this text."
