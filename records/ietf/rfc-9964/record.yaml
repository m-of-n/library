  reason: "The current post-quantum signature binding for COSE, and the concrete mechanism behind R-M-02 for PQ keys: its AKP thumbprint rules (6) fix exactly which parameters enter a key digest. Upgraded from marginal on 2026-10-03 after reading 6 against rfc-9679."
