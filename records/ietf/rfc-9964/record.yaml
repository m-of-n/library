bears_on:
  # Widened 2026-10-19 by the FX-1 extraction, which found this record informs
  # far more than the one requirement it named. Each addition is evidenced in
  # distilled/design-notes.md, not assumed:
  #   DEC-003 — the strongest. DEC-003's own mandatory clause is "Must specify:
  #     canonical key bytes before hashing", and RFC 9964 §6 IS that
  #     specification for AKP. The record also shows that FOR AKP KEYS
  #     DEC-003's option 1 (raw COSE key) is immune to the `alg` instability
  #     and option 2 (thumbprint) is not.
  #     [narrowed 2026-10-20, maintenance pass, library#39 Tier 2. This line
  #     read "DEC-003's option 1 (raw COSE key) is immune to the `alg`
  #     instability" with no key type named. The immunity is AKP-specific, not
  #     a property of option 1: it holds exactly when a key type's public-key
  #     encoding carries no parameter code point. An AKP `pub` carries none —
  #     the parameter set shows only in its length — but an HSS-LMS `pub`
  #     begins with two, RFC 8778 §2.2's `u32str(lms_algorithm_type) ||
  #     u32str(otstype)`. See records/ietf/rfc-8778 and
  #     distilled/design-notes.md §2 item 2.]
  #   DEC-002 — six named cuts. The hardest: a post-quantum KeyId CONTAINS an
  #     IANA allocation (alg -48/-49/-50) inside the digest preimage, in a
  #     value that changes the digest — so registry-independence is
  #     unavailable for post-quantum principals under EVERY candidate option,
  #     which is a correction to MD-3's premise rather than a cost of one
  #     option. Also: all three COSE examples are tag 18 and the untagged form
  #     is never printed, which qualifies rfc-9679's finding that the no-tags
  #     half of MD-3 costs nothing.
  #     [narrowed 2026-10-20, same pass. The general proposition stands and is
  #     STRENGTHENED — rfc-8778 is a second independent instance, where the
  #     allocation sits in the key material and no digest-input choice removes
  #     it. What was wrong is Cut B's claim to novelty against rfc-9679's
  #     Cut A: "a value that changes the digest" does not distinguish the two,
  #     because RFC 9679 §4 requires the IANA `kty` VALUE for every key type.
  #     The real distinction is coarse-and-constant (`kty`, one number per key
  #     type) against fine-and-varying (`alg`, varying over identical key
  #     material). Cut B's `(kty, pub)` escape clause is refuted twice over:
  #     `kty` is itself an allocation, and for HSS-LMS so is `pub`.
  #     Adjudicated verdict: Cut B NARROWS, it does not fail.]
  #   R-M-12 — requires an extension point be a (key, local label) pair; this
  #     record shows the pair's FIRST element is alg-unstable for AKP keys.
  #     Promoted to ARCH-0002 P1 by ADR-0001.
  #   R-O-01 — "Every signed object SHALL have an issuer key that can be
  #     specified as KeyId." This document says what a KeyId IS for a
  #     post-quantum issuer, and that it is algorithm-dependent.
  #   DEC-005 — COSE gets three "Recommended: Yes" algorithms, JOSE the same
  #     three "Optional", and DSSE nothing at all.
  #   R-O-03 — the whole "adopt §6 whole, do not invent (kty, pub)" argument
  #     rests on it: a digest over (kty, pub) would not be a COSE Key
  #     Thumbprint and so would be an invention.
  - R-M-02
  - DEC-002
  - DEC-003
  - DEC-005
  - R-O-01
  - R-O-03
  - R-M-12
