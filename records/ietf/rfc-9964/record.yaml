        requirement texts are contiguous substrings of the whitespace-normalised
        source and 88/88 locators resolve inside their stated section, as do
        79/79 normative.md quotations; 18/18 fences are byte-exact source line
        runs; all three line-break severances are declared and NO span heals a
        break (structurally — a healed token is not a substring of the
