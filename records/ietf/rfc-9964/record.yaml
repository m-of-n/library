distillation:
  standard: "FX-1"
  # `profile: full` declared by pass 3 (cross-check) on 2026-10-20, replacing
  # the block that read "NO `profile` IS CLAIMED. Passes 1 and 2 of 3 have run;
  # cross-check has not." All three machine passes are now recorded below at
  # effort max; the artifact set is complete, with protocol and state-machine
  # not_applicable and a written, re-measured reason for each; both keyword
  # counts are 9 and reconciled; no file under distilled/ holds a TODO, FIXME
  # or XXX marker. `reviewed_by` is empty throughout: pass 4 is a human
  # signature and is not ours to give (docs/extraction.md).
  #
  # ON THE SEVEN UNVERIFIABLE-HERE `bears_on` IDENTIFIERS, argued rather than
  # waved through, because it is the one candidate limit on this profile.
  # R-M-02, R-M-12, R-O-01, R-O-03, DEC-002, DEC-003 and DEC-005 are defined in
  # `mofn` documents this library does not hold — it is standalone by design
  # (CLAUDE.md) — so their quotations cannot be checked from this repository.
  # That is COMPATIBLE with `profile: full`, and the reason is that FX-1
  # measures an extraction against ITS SOURCE. docs/extraction.md's artifact
  # table requires design notes that map the document onto ARCH / DEC / MD-n
  # decisions; it does not and cannot require that this repository hold those
  # decisions, since the same table is satisfiable by a fork with no `mofn` at
  # all. Every FINDING in this record is measured against .cache/rfc-9964.txt
  # and re-measured by two later passes: the six reproduced thumbprints, the
  # one-octet hazard, the FIPS 204 re-derivations, the 88 requirement spans,
  # the 12 vectors. The `mofn` ids say which of OUR decisions a measured
  # finding bears on; none of them is load-bearing for whether the finding is
  # true. Treating them as a bar to `full` would make every record in this
  # library permanently unfinishable, which is the opposite of standalone.
  # What IS owed is that the unverifiability be stated rather than implied, and
  # pass 3 states it — distilled/design-notes.md's provenance block and
  # summary.md's Limits, following records/ietf/rfc-9741, which adopted the
  # convention on 2026-10-20 and is so far the only other record carrying it.
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: >-
        Every normative sentence of the Abstract and §1-§8 with its locator: 79
        quoted statements plus 18 fenced blocks that are byte-exact runs of
        source lines (both §3 figures, §5 Table 1, §6's two bullet lists and all
        twelve §8.1 registration templates). Three line-break severances are
        DECLARED AND NOT HEALED (source lines 18-19 Post-Quantum, 180-181
        ML-DSA-87, 219-220 ML-DSA-65), the third falling inside the document's
        only algorithm-behaviour MUST. Four statements appear here with no
        requirements.yaml entry and the file says which and why. 79/79
        quotations re-confirmed contiguous and in-section by the verify pass.
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: >-
        88 entries R-0001 to R-0088 in source order, no gaps, ids distinct under
        both YAML readers: 9 stated (6 MUST, 2 REQUIRED, 1 MUST NOT) and 79
        inferred. source_keyword_count and extracted_keyword_count both 9 and
        reconciled at length. THE FINDING IS WHERE THE NINE ARE NOT: §3 x3, §4
        x2, §5 x1, §7.3 x3 — not one in §6 or §8, the two sections carrying the
        operative content, so the real normative baseline is a code-point table
        and a format delegation rather than obligations on an actor. 88/88 texts
        are contiguous substrings of the whitespace-normalised source with
        88/88 locators resolving inside their stated section. The §2 BCP 14
        boilerplate recital is deliberately not an entry and the reconciliation
        says so.
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: >-
        1 verbatim + 5 derived. RFC 9964 SHIPS NO GRAMMAR OF ANY KIND — `CDDL`,
        `ABNF`, `ASN.1` and `JSON Schema` each occur zero times — so the
        verbatim file is not a grammar: it is the four places the document
        renders a structure itself (Figures 1 and 2, Table 1, §6's two bullet
        lists), each with its source line range and its own sha256, all four
        re-cut and all four digests re-verified at cross-check. The five derived
        files carry `.derived.` and agree with their headers: three CDDL (the
        AKP COSE_Key, the two §6 thumbprint inputs, the Appendix A.2 signature
        side) and two JSON (the registry data with measured byte layouts, and a
        2020-12 schema over the fixture rendering), both `$id: urn:library:*`.
        Rule census re-derived at cross-check: 45 per-file (23 + 6 + 16), 36
        distinct names, 9 defined in two files and all 9 byte-identical, no rule
        duplicated inside a file, no dangling reference, no prelude collision.
        Does NOT constrain map order, encoding determinism, key validity,
        `pub`/`priv` agreement, or `ctx` — each absence written out in the file
        that would have carried it.
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: >-
        9 structures, 36 fields, with the actual code points and octet-level
        layouts decoded from the Appendix A hex rather than read off the prose:
        the AKP and ML-DSA `COSE_Key`, BOTH §6 thumbprint inputs, the JWK, the
        tag-18 `COSE_Sign1`, the `Sig_structure`, the header parameters and the
        JWS. `constrained_by` WIRED BY PASS 3, which pass 1 deferred to it in
        terms: 25 fields carry at least one R-id, 66 of 88 requirements are
        cited, 0 dangling, and the header states the matching rule and the 22
        unwired requirements with a reason for each. The 11 empty lists are a
        finding — every one of those fields belongs to RFC 9052, RFC 7515 or
        RFC 7517, which is `protocol.yaml`'s not-applicable measurement seen
        from the other side. Also records what the document does NOT define: no
        COSE header parameter and no JOSE header parameter, six registries
        touched and "COSE Header Parameters" not among them.
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: >-
        12 vectors V-0001 to V-0012, ids contiguous and distinct: 9 printed, 2
        computed with every computed field declared, 1 derived. THE LIBRARY'S
        FIRST POST-QUANTUM FIXTURES, and they reproduce. Pass 3 re-cut all six
        Appendix A figures from their declared source line ranges with a THIRD
        independently written CBOR codec and ran 318 assertions with zero
        failures: all three COSE Key Thumbprints (inputs 1322/1962/2602 octets)
        and all three JWK Thumbprints (1790/2643/3496) reproduce the printed
        `kid` values; every layout, length and code point agrees; the hazard
        fixture's three 1322-octet inputs differ in EXACTLY ONE OCTET at offset
        5 (measured, not asserted) and share zero digest octets pairwise; and
        the two computed digests occur nowhere in the source. All six printed
        public keys re-derive from KeyGen_internal(0^32) and all six printed
        signatures verify, on an implementation re-gated in the cross-check
        session at 75/75 ACVP keyGen and 90/90 ACVP sigVer (72 expected-reject,
        18 expected-accept — re-counted). Pass 3 added a control pass 2 did not
        run: a NON-EMPTY `ctx` is rejected on all six, which is what makes
        R-0034's satisfaction demonstrated rather than asserted.
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: >-
        What our post-quantum export must carry with code points; THE `KeyId`
        CONSEQUENCE and the four mitigations that exist, including the
        naming-key-root regress no sibling record raises; six cuts against
        `MD-3` naming `DEC-002` options 1-5, `DEC-003` and `DEC-005`; five open
        questions, one of them now answered; the sibling records' claims
        checked, with one of this record's own claims about `rfc-9679` failing
        that check and corrected in place; and six source defects reported and
        unrepaired. Carries a provenance block, added at cross-check, marking
        every `mofn` quotation as unverifiable from this standalone repository
        and listing what IS checkable here and was re-verified.
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: >-
        RFC 9964 defines a key type, three algorithm identifiers and a
        thumbprint parameter set. It defines no protocol: `verifier`, `sender`,
        `recipient`, `protocol` and `exchange` each occur ZERO times in its 2906
        lines, `signer` once (§7.1, line 298, in a sentence about impersonation)
        and `request` once (line 6, the RFC masthead). §5 defers the envelope
        outright: "When producing COSE signatures, no encoding is needed; see
        Section 4 of [RFC9052] for more details on how COSE signatures are
        created." The signing protocol is RFC 9052's; see records/ietf/rfc-9052.
        Re-attacked by the verify pass, which re-counted every one of those
        words by source line and additionally confirmed that no VERIFICATION
        algorithm is named anywhere in the document — §5 cites FIPS 204
        Algorithm 2 for signing and nothing cites Algorithm 3 — so there is not
        even a one-sided procedure to model. The six §8 registries are IANA
        actions completed by this document, not steps between parties.
    - kind: state-machine
      reason: >-
        No lifecycle. `state`, `lifecycle`, `revoke`, `revocation`,
        `handshake`, `negotiate`, `rotate` and `expire` each occur ZERO times,
        re-counted by the verify pass. The only ordered procedure is §7.3's key
        validation — the 32-byte seed length check, then `pkDecode`/`skDecode`
        range checks — and it is a precondition list, not a lifecycle: no
        states, no transitions, no terminal condition, and nothing that can be
        in one state rather than another. An AKP key's thumbprint is a pure
        function of (`kty`, `alg`, `pub`), which the verify pass demonstrated by
        re-deriving all six printed `kid` values; a pure function has no states.
  passes:
    - pass: extract
      by: "claude-opus-5 (2 parallel agents: normative+requirements; schema+messages+examples+design-notes)"
      effort: max
      date: "2026-10-19"
      note: >-
        88 requirements (9 stated / 79 inferred, 9 = 9 reconciled), 79 quoted
        statements, 18 fences cut programmatically from source line runs, 12
        vectors, 45 CDDL rules. Built the hazard fixture the tier asked for:
        three COSE Key Thumbprints over one byte-identical 1312-octet `pub`,
        with the −48 leg being RFC 9964's own printed `kid`. Found and fixed a
        spliced quotation inside sibling record rfc-9679, which is at
        `profile: full` — a string in quotation marks that is not in RFC 9964,
        in a paragraph asserting the sections were "verified verbatim".
    - pass: verify
      by: "claude-opus-5 (single adversarial agent, independent of the extract pass)"
      effort: max
      date: "2026-10-20"
      note: >-
        Adversarial re-derivation, not a re-read: every count, quotation,
        locator, code point and digest recomputed from .cache/rfc-9964.txt with
        a SECOND hand-written CBOR codec rather than checked against pass 1's
        working. CONFIRMED — all three COSE Key Thumbprints (inputs 1322/1962/
        2602 octets) and all three JWK Thumbprints (1790/2643/3496 octets)
        reproduce the printed `kid` values; the hazard fixture reproduces
        including both computed legs, and neither computed digest occurs
