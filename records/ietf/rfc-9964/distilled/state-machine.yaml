note: >-
  RFC 9964 DEFINES NO LIFECYCLE AND NO STATE MACHINE.

  Written out by the verify pass (2026-10-20), which found this file holding the
  ingest scaffold's unedited placeholder values while `distilled/README.md`
  described it as a deliberate statement of non-applicability. The same reasoning is recorded
  in `record.yaml` under `distillation.not_applicable`.

  WORD COUNTS OVER ALL 2906 LINES, re-counted by the verify pass as whole words,
  case-insensitively: `state` 0, `lifecycle` 0, `revoke` 0, `revocation` 0,
  `rotate` 0, `expire` 0. Not one of them occurs anywhere in the document.

  THE ONLY ORDERED PROCEDURE IS A PRECONDITION LIST, NOT A LIFECYCLE. §7.3
  (source lines 311-328) requires that "all algorithm-related key parameters
  MUST be validated" (R-0062), that for the ML-DSA algorithms registered here
  "the seed length check MUST be performed" because `priv` is the 32-byte seed
  (R-0065), and that "when the priv parameter is expanded using
  KeyGen_internal, the skEncode and skDecode algorithms MUST be used" (R-0067).
  Those are three checks a validator runs before use. There are no states, no
  transitions, no triggers, no guards and no terminal condition: nothing in the
  document can be in one state rather than another, and §7.3 names no entity
  that persists between checks.

  A THUMBPRINT IS A PURE FUNCTION, WHICH IS THE SHARPEST FORM OF THIS. §6 fixes
  the required parameter set as (`kty`, `alg`, `pub`) and defers the digest to
  RFC 9679 §3 unchanged, so an AKP key's `KeyId` is a deterministic function of
  three values and nothing else. The verify pass demonstrated this rather than
  arguing it: all six printed `kid` values in Appendix A re-derive from the key
  material alone, and all six public keys re-derive from the all-zeros seed. A
  pure function has no states to machine.

  WHERE A LIFECYCLE WOULD HAVE TO COME FROM, if we ever need one: not here. Key
  rotation under a changing `alg` is the hazard this record exists to document
  (`design-notes.md`, the `KeyId` consequence), but RFC 9964 says nothing about
  it — the consequence is ours to own, and under ARCH-0002 P1 a post-quantum
  parameter change is a namespace rename, not a state transition.

