schema: "library-requirements/v1"
record: rfc-9964
source_version: "RFC 9964"
source_digest: "8c42035b948301b197d431de8b3f40019bdaa3bb40150dc523306923948f34cf"
source_keyword_count: 9         # bin/bcp14-count .cache/rfc-9964.txt --by-keyword: 6 MUST, 2 REQUIRED, 1 MUST NOT
extracted_keyword_count: 9      # recomputed and checked by bin/validate
reconciliation: >-
  The counts agree: bin/bcp14-count reports 9 all-capitals BCP 14 keyword
  occurrences in the 180 KB / 2906-line source (6 MUST, 2 REQUIRED, 1 MUST
  NOT) and the 88 entries below carry exactly those 9, each once. A
  reconciliation is written anyway, because 88 entries against 9 keywords
  needs explaining and because 9 keywords in the second-largest document of
  this reference set is itself a finding.

  WHERE THE 9 ARE: §3 (REQUIRED x2, MUST NOT x1 - alg present, pub present,
  priv absent from public keys), §4 (MUST x2 in ONE sentence - priv is the
  seed, priv is 32 bytes), §5 (MUST x1 - ctx is the empty string), §7.3
  (MUST x3 - validate all algorithm-related parameters, perform the seed
  length check, use skEncode/skDecode on expansion). Not one of the 9 is in
  §6 or §8.

  THE REAL NORMATIVE BASELINE IS A CODE-POINT TABLE AND A FORMAT DELEGATION,
  NOT OBLIGATIONS ON AN ACTOR. This is an algorithm- and
  key-type-registration document: what an implementer must obey lives in (i)
  the twelve IANA registration templates of §8.1.1-§8.1.6 and their six
  lead-ins, which are where alg -48/-49/-50, kty 7, pub -1 and priv -2 are
  actually fixed - 18 of the 88 entries, R-0071 to R-0088, and not a BCP 14
  keyword among them; (ii) §6's two lead-in sentences and nine bullets,
  which fix the required parameter set for an AKP thumbprint and are stated
  as a BULLET LIST with no keyword at all; (iii) §3's definitional
  sentences, above all "The parameters for public and private information
  classes contain byte strings in a format specified by the alg value",
  which is the whole of the format story and carries no keyword; and (iv) §5
  Table 1's three size rows. 79 of 88 entries are therefore kind: inferred,
  and each names in `field` the phrase that carries the force. This is the
  same shape as the sibling record rfc-9053, whose extraction found its
  hardest constraints were not BCP 14 either.

  WHAT WAS COUNTED INSTEAD: every registration template as one entry with
  its template reproduced (R-0071 to R-0088); every §6 bullet that carries a
  label or type as its own entry (R-0045 to R-0047); every §5 Table 1 data
  row as its own entry (R-0029 to R-0031); and every definitional,
  scope-limiting, encoding and threat sentence of §1-§7.4.

  WHAT WAS NOT COUNTED: the §2 BCP 14 boilerplate recital (source lines
  94-98) is deliberately NOT an entry. It recites all eleven keywords and
  constrains nothing; bin/validate counts the entry texts with
  boilerplate=False, so including it would have added 11 phantom keywords
  and broken the reconciliation. It is quoted in normative.md instead. Also
  not counted, because they are lowercase and so not BCP 14 keywords of this
  document: "may require or recommend" (§3), "may not be suitable" (§5),
  "should also refer" (§7), "need to be" (§7.3), and the "should" and
  "shall" inside the FIPS-204 quotation at §7.3. Each is recorded as
  inferred with the phrase named in `field`.

  COMPOUND SENTENCE SPLIT: §4's "the priv parameter MUST be the seed and
  MUST have a length of 32 bytes" carries 2 of the 9 keywords in one
  sentence. R-0020 and R-0021 quote its two contiguous clauses separately so
  that content and length are separately testable; nothing is spliced and
  the sentence is quoted whole in normative.md.

  THREE LINE-BREAK SEVERANCES, DECLARED NOT HEALED: the plain-text wrap cuts
  Post-Quantum (lines 18-19, Abstract), ML-DSA-87 (lines 180-181, §5) and
  ML-DSA-65 (lines 219-220, §5) in two, so those three sentences cannot be
  quoted whole. R-0024 and R-0034 quote the obligation-bearing half and say
  so in `field`; the Abstract case is declared in normative.md. The 219-220
  severance falls inside the document's only algorithm-behaviour MUST.
reviewed_by: ""
note: >-
  Ids are stable and never reused. Cite as rfc-9964#R-NNNN.

  Pass 1 of the FX-1 extraction; normative and requirements only. A parallel
  agent owns schema, messages, examples and design notes.

  `text` is the source's own wording with whitespace normalised: line breaks
  and the RFC's double sentence spacing become single spaces, and in the §8
  registration templates the blank lines between fields do too. Every `text`
  is a contiguous substring of the whitespace-normalised source, verified
  mechanically, never by eye. `distilled/normative.md` carries the
  byte-exact renderings, including every table, figure, bullet list and
  registration template as an exact fenced run of source lines.

  `verb: none` marks an inferred entry - the source sentence carries no BCP
  14 keyword, and `field` names the phrase that carries the force instead.

  THIS DOCUMENT DEFINES NO PROTOCOL EXCHANGE AND NO LIFECYCLE. The words
  protocol, exchange, handshake, negotiate, state, rotate, expire and revoke
  do not occur in its 2906 lines, and neither do EdDSA, Ed25519, Ed448, crv,
  curve or OKP. It registers one key type in two registries, four key
  parameters and six algorithm identifiers, and delegates signing to
  FIPS-204 Algorithm 2 (R-0033) without naming any verification algorithm at
  all.

  DISPOSITIVE FOR rfc-9679, which is at profile: full and whose central
  finding rests on this record: R-0009 (§3, alg REQUIRED for all AKP keys),
  R-0044 to R-0047 (§6, the AKP COSE Key Thumbprint required-parameter set
  and its three bullets) and R-0048 (§6, the digest process is RFC 9679 §3
  unchanged). R-0008 (§3, format "specified by the alg value") and R-0079
  (§8.1.3.2, pub and priv are the only COSE key type parameters registered
  for kty 7) are the evidence that there is no crv and no second
  discriminator, which is what forces alg into the digest.

  FOUR STATEMENTS APPEAR IN normative.md WITH NO ENTRY HERE, deliberately:
  the Abstract's scope sentence (lines 16-20), which §1 R-0001 already
  carries and which cannot be quoted whole anyway; the §2 BCP 14 boilerplate
  recital (lines 94-98), excluded so it cannot inflate the keyword count, as
  the reconciliation explains; and the two bare internal cross-references
  "See the Security Considerations of this document for details." (§4) and
  "See Section 4 for further details." (§5), which point somewhere and
  require nothing. Nothing else in the source's §1-§8 is in one artifact and
  not the other.

