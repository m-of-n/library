note: >-
  RFC 9964 DEFINES NO PROTOCOL, and this file records the measurement rather
  than asserting the conclusion. It registers one key type in two registries,
  four key parameters and six algorithm identifiers, and it hands the envelope
  to another document.

  Written out by the verify pass (2026-10-20), which found this file and
  `state-machine.yaml` still holding the ingest scaffold's unedited placeholders
  while `distilled/README.md` described them as deliberate statements of
  non-applicability. They were not statements of anything. They are now, and
  the same reasoning is recorded in `record.yaml` under
  `distillation.not_applicable`.

  WORD COUNTS OVER ALL 2906 LINES, re-counted by the verify pass as whole words,
  case-insensitively, and reported with the lines where they occur: `verifier` 0,
  `sender` 0, `recipient` 0, `protocol` 0, `exchange` 0, `handshake` 0,
  `negotiate` 0. Exactly two near-misses exist and neither is a role in a flow:
  `signer` occurs ONCE, at line 298 in §7.1, inside a sentence about what an
  attacker could do ("attackers could impersonate the legitimate signer"); and
  `request` occurs ONCE, at line 6, in the RFC masthead ("Request for Comments:
  9964").

  THE DOCUMENT DEFERS THE ENVELOPE IN ITS OWN WORDS. §5, source lines 227-229:
  "When producing COSE signatures, no encoding is needed; see Section 4 of
  [RFC9052] for more details on how COSE signatures are created." The signing
  protocol is RFC 9052's. See `records/ietf/rfc-9052`, which holds it.

  AND THERE IS NOT EVEN A ONE-SIDED PROCEDURE TO MODEL. §5 cites FIPS 204
  "Algorithm 2" for producing signatures; NO VERIFICATION ALGORITHM IS NAMED
  ANYWHERE in the document — nothing cites FIPS 204 Algorithm 3, and the word
  "verify" occurs in the prose exactly once, in §7.2's "As the verify routines
  are different". A document that names no verification procedure cannot be
  rendered as a verifier's flow.

  WHAT §8 IS NOT. §8.1.1-§8.1.6 contain twelve completed IANA registration
  templates across six registries. Those are registry actions completed once by
  this document, not steps between parties, and they carry no actor, no
  ordering and no error path.

