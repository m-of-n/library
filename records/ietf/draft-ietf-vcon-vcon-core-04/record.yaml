distillation:
  standard: FX-1
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "202 verbatim blocks, §1-§7 complete, in source order. Carries all 169 of the body's BCP 14 occurrences; the other 47 of the source's 216 are Appendix B (8) and C (39) and are held verbatim by the schema artifact instead. 127 fences and 75 blockquotes are BYTE-exact, not merely contiguous. §4.3.1.6 Table 1 is reproduced whole - legend, 24 rows, 4 footnotes - rejoined across the page break it straddles. NOT covered: §8 references, Appendices A-C. Closes with 11 unresolved source contradictions."
      reviewed_by: "nfnewbury 2026-10-14"
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "251 entries R-0001..R-0251, source-ordered, no gaps, none retargeted. 169 BCP 14 occurrences carried and reconciled against the source's 216; 86 entries are verb none - lowercase obligations, IANA registration rules and two exemptions - carried because a register holding obligations without their exemptions fails a conformance checker on conforming input. Every text is a contiguous substring of the whitespace-normalised source: 251/251, zero splices. NOT a projection of fields.yaml, which is why it holds §2, the §4.3.1.6 table and all of §5; the field-derived predecessor held 34 of 216."
      reviewed_by: "nfnewbury 2026-10-14"
    - kind: fields
      path: distilled/fields.yaml
      coverage: "106 rows across 15 objects, reconciled field-for-field against the draft's own IANA registries (§6.3.2-§6.3.9): zero missing, zero extra. Covers the §5 signed and encrypted objects, Party_History, Redacted, Amended, Dialog Transfer and the three Content sections - all absent or pending before. 96/96 quotes exact after 47 undeclared quote substitutions were restored from the source. `required` is conditional on 8 rows rather than rounded to a boolean; `protected` and `aad` are kind inferred from RFC 7516 §7.2.1, which §5.3's own member list omits."
      reviewed_by: "nfnewbury 2026-10-14"
    - kind: schema
      path: distilled/schema
      coverage: "The draft's OWN two schemas, lifted verbatim for the first time: Appendix B (vcon.schema.json, src 6742-8352) and Appendix C (types.cddl, src 8363-8839), each carrying its sha256 and source line range, both re-derived byte-exactly by an agent that did not produce them. vcon.derived.schema.json is the parseable rendering - Appendix B AS PRINTED IS NOT VALID JSON, 89 line breaks falling inside string literals, 25 of them irrecoverably eating a word space. types.derived.cddl is ours, regenerated from the corrected field table. Table 1 census: both appendices express its M and X cells, NEITHER expresses S, SN or `-`; Appendix C additionally conflates SN with X."
      reviewed_by: "nfnewbury 2026-10-14"
    - kind: messages
      path: distilled/messages.yaml
      coverage: "28 structures, 187 fields, spanning all three container forms and all nine object types plus the JOSE objects. 451 constrained_by links across 158 fields citing 222 of the 251 requirement ids, every one resolving; the 29 unconstrained fields each carry a written reason rather than a bare empty list. 382 quoted spans verified verbatim."
      reviewed_by: "nfnewbury 2026-10-14"
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "applicability PARTIAL and said so in-file: the draft defines no network exchange, but §2.5 names a transcriber and a redactor with different admission rules on one input, and §5.3, §5.2.3 and §5.4 each mandate an ordering. 5 flows, 5 Mermaid sequence diagrams in protocol.md, 60 requirement links over 52 ids. The finding is the ABSENCE: one defined error path and eight undefined, and across §§1-7 the words fail/failure/error/invalid/discard/abort occur twice, neither about processing."
      reviewed_by: "nfnewbury 2026-10-14"
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "3 machines, 20 transitions, 66 requirement links over 48 ids. vcon-form (the three container forms, discriminated by the uuid being INVARIANT across them - verified in A.4/A.6/A.7); vcon-instance-version-chain (redacted/amended, where identity does NOT survive); party-participation-in-dialog (8 events, every state marked inferred because the draft names events and zero states). Of 8 form transitions exactly ONE is MUST-guarded, under a stated definition so the count is checkable. Dialog type was examined and REJECTED as a machine on five pieces of evidence."
      reviewed_by: "nfnewbury 2026-10-14"
    - kind: examples
      path: distilled/examples
      coverage: "12 fixtures - Appendix A's nine worked vCons plus three figures - each with sha256 and source line range, all 12 re-derived byte-for-byte by an independent implementation of the de-wrapping rule (833 rejoins, zero anomalies). A.6's RS256 signature VERIFIES under openssl against the key in its own x5c[0], and its payload decodes to a document equal to the A.4 fixture, which confirms the de-furnishing from outside the extraction. 108 consistency checks: 72 pass, 28 fail, 8 not determinable. Schema validation run: 7 of 9 clean, the 2 failures being JWS/JWE documents against a schema titled 'Unsigned Form'. 7 negative controls confirm the validation is live, not vacuous."
      reviewed_by: "nfnewbury 2026-10-14"
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "7 adopt / 6 adapt / 9 reject, each mapped to a named decision; the four questions #9 posed; 20 open questions. Headline, and it cuts AGAINST MD-3: vCon is JSON, signed, implemented, and has NO canonicalisation - the word appears once in 8904 lines, in a block copied from STIR PASSporT referencing an rcd claim vCon does not have - so canonical-encoding conditions 1, 2 and 3 are vacuous for it, which puts the deciding axis at re-derive-versus-don't, orthogonal to the JSON-versus-CBOR axis MD-3 narrowed on. Second finding, against ARCH-0002 P3: a type is NOT its schema here."
      reviewed_by: "nfnewbury 2026-10-14"
