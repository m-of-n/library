    kind: stated
    testable: no            # cannot detect an undeclared extension generically

  - object: vCon
    field: critical
    json_type: "string[]"
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.1.4"
    text: "Implementations that include extensions which are incompatible with the core vCon schema MUST list the names of those extensions in the critical parameter."
    text_2: "An implementation that does not recognize or support the extensions listed in the critical parameter MUST NOT attempt to process or operate on the vCon, except to reject it or report unsupported content."
    note_quotes: "Two non-adjacent sentences in §4.1.4; a third sentence separates them. Kept apart rather than spliced."
    semantics: "Must-understand list. Consumer MUST NOT process a vCon carrying unsupported critical extensions, except to reject or report."
    kind: stated
    testable: yes
    note: "Producer opt-in. Omission is indistinguishable from 'no critical extensions'. See ARCH-0002 P5."

