    semantics: "Array of Attachment Objects (§4.4)."
    kind: stated
    testable: yes

  - object: vCon
    field: group
    json_type: unknown
    cardinality: 0..1
    required: false
    verb: none
    locator: "§6.3.2"
    semantics: "Registered in the vCon Object Parameter Names Registry with the description 'reserved for future extension'. It has NO §4 definition section and no type."
    kind: stated
    testable: no
    note: "Registry-only parameter. Its Specification Document column names 'RFC XXXX' with no section, unlike every other row in Table 2. Carried here so the table and the registry agree; an implementation can do nothing with it."

  - object: Party
    field: tel
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.2.1"
    text: '* tel: "String" (optional) The value of the tel parameter SHOULD be a valid [TEL] URL.'
    semantics: "Telephone URI for the party. SHOULD be a valid [TEL] URL."
    kind: stated
    testable: yes
  - object: Party
    field: sip
    json_type: string
    cardinality: 0..1
    required: false
    verb: none
    locator: "§4.2.2"
    semantics: "SIP URI for the party."
    kind: stated
    testable: yes
  - object: Party
    field: stir
    json_type: string
    cardinality: 0..1
    required: false
    verb: none
    locator: "§4.2.3"
    semantics: "STIR/PASSporT token asserting the party's telephone identity."
    kind: stated
    testable: partial
  - object: Party
    field: mailto
    json_type: string
    cardinality: 0..1
    required: false
    verb: MAY
    locator: "§4.2.4"
    text: 'It MAY be provided in any common form, such as a bare address or a [MAILTO] URL; when a [MAILTO] URL is used, the "mailto:" scheme prefix is optional.'
    semantics: "mailto URI for the party."
    kind: stated
    testable: yes
  - object: Party
    field: name
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.2.5"
    text: "A Party Object SHOULD be create for each anonymous party in the conversation."
    semantics: "Human-readable party name. The SHOULD is on creating a Party Object per anonymous party, not on the name parameter's presence."
    kind: stated
    testable: no
    note: "Source typo: 'SHOULD be create'. Quoted verbatim."
  - object: Party
    field: did
    json_type: string
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.2.6"
    text: '* did: "String" (optional) The value of the did parameter MUST be a valid DID URI that enables verifiable, decentralized digital identity for the party.'
    semantics: "Decentralized Identifier for the party."
    kind: stated
    testable: partial
    note: "CORRECTED 2026-10-13: was required: true / cardinality 1. The quoted line says '(optional)'. The MUST constrains the VALUE, not the PRESENCE - the same distinction distilled/README.md draws for vcon."
  - object: Party
    field: validation
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD NOT
    locator: "§4.2.7"
    text: "For confidentially reasons, it SHOULD NOT contain the data used to validate the name."
    text_2: '* validation: "String" (SHOULD be provided if name parameter is provided)'
    semantics: "How the party's identity was validated. Two separate normative statements: a conditional SHOULD on presence (when name is present) and a SHOULD NOT on content (never the validating data itself)."
    kind: stated
    testable: no
    note: "The conditional SHOULD on presence sat in the definition line and was dropped by the first pass. Source typo: 'confidentially' for 'confidentiality'."
  - object: Party
    field: gmlpos
    json_type: string
    cardinality: 0..1
    required: false
    verb: none
    locator: "§4.2.8"
    semantics: "GML position - geographic location of the party, same format as gml:pos in [PIDF-LO] §3.2."
    kind: stated
    testable: yes
  - object: Party
    field: civicaddress
    json_type: object
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.2.9"
    text: "Note that the parameter names MUST be in lower case when contained in the Civicaddress Object even though they are in upper case in [GEOPRIV]."
    text_2: "The Civicaddress Object MAY contain any or all of the following parameters: country, a1, a2, a3, a4, a5, a6, prd, pod, sts, hno, hns, lmk, loc, flr, nam, pc as defined in section 2.2.1 of [GEOPRIV]."
    semantics: "Civic address per PIDF-LO. The MUST is a casing constraint on the sub-parameter NAMES, not on presence of civicaddress."
    sub_parameters: [country, a1, a2, a3, a4, a5, a6, prd, pod, sts, hno, hns, lmk, loc, flr, nam, pc]
    sub_parameter_shape: "all 17 are 'String' and all 17 are marked (optional) in §4.2.9; none carries a verb of its own"
    kind: stated
    testable: partial
    note: "CORRECTED 2026-10-13: was required: true / cardinality 1 / json_type civicaddress. The definition line says 'civicaddress: \"Civicaddress\" (optional)'. The 17 sub-parameters are listed rather than given 17 rows, because they are normatively identical and share one MUST. Source typo: 'The the civicaddress parameter'."
  - object: Party
    field: uuid
    json_type: string
    cardinality: 0..1
    required: false
    verb: MAY
    locator: "§4.2.10"
    text: "Operators often have existing methods of generating unique participant identifiers and MAY use any unique string value."
    semantics: "Party-scoped identifier, referenced by dialog and attachment objects. Explicitly NOT constrained to [UUID] syntax."
    kind: stated
    testable: yes
    note: "§4.2.10 also says the value 'must be static across interactions' in lowercase - not a BCP 14 keyword, so not a requirement."
  - object: Party
    field: type
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.2.11"
    text: '* type: "String" (optional) The value of the type parameter SHOULD be one of the following: "person", "bot", "organization"'
    semantics: "Party classification."
    enum: [person, bot, organization]
    kind: stated
    testable: no
  - object: Party
    field: org
    json_type: string
    cardinality: 0..1
    required: false
    verb: none
    locator: "§4.2.12"
    semantics: "Organisation the party belongs to."
    kind: stated
    testable: no
  - object: Party
    field: dept
    json_type: string
    cardinality: 0..1
    required: false
    verb: none
    locator: "§4.2.13"
    semantics: "Department within the organisation."
    kind: stated
    testable: no

  - object: Dialog
    field: type
    json_type: string
    cardinality: 1
    required: true
    verb: MUST
    locator: "§4.3 / §4.3.1"
    text: '* type: "String" The string MUST have the value of either "recording", "recording- set", "text", "transfer" or "incomplete".'
    text_2: 'As the consultative call is a call, a placeholder Dialog Object for it MUST be of type "recording" if the call was set up, or of type "incomplete" if it was not.'
    semantics: "Dialog kind: recording, recording-set, text, transfer, incomplete. Determines which other parameters apply (see 4.3.1.6)."
    enum: [recording, recording-set, text, transfer, incomplete]
    enum_locator: "§4.3.1.1-§4.3.1.5"
    note: "Per-type parameter applicability is tabulated at §4.3.1.6 - a field being present is not sufficient; it must be valid FOR THE TYPE. text_2 is a second MUST on this field's value, in §4.3's prose rather than in §4.3.1, and was missed by the first pass. The source line-breaks 'recording-set' as 'recording- set'; quoted verbatim."
    kind: stated
    testable: yes
  - object: Dialog
    field: start
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.3.2"
    text: "The start parameter SHOULD be present unless it is not known."
    text_2: 'The start parameter is optional for the "transfer" type Dialog Object as it may not always be known.'
    semantics: "Dialog start time, RFC 3339. §4.3.1.6 scores it S for recording, recording-set, text and incomplete, O for transfer."
    kind: stated
    testable: yes
  - object: Dialog
    field: duration
    json_type: unknown
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.3.3"
    text: '* duration: "UnsignedInt" | "UnsignedFloat" (optional) The value MUST be the dialog duration in seconds.'
    semantics: "Dialog length in seconds. UnsignedInt or UnsignedFloat - a union this table's json_type vocabulary cannot express, so it degrades to unknown, which bin/derive renders as CDDL 'any'."
    json_type_source: "'UnsignedInt' | 'UnsignedFloat'  (Appendix C: duration_type = uint / float)"
    kind: stated
    testable: yes
    note: "CORRECTED 2026-10-13: was required: true / cardinality 1 / json_type unsignedint. Its own definition line says '(optional)' and §4.3.1.6 scores it O for four types and '-' (undefined) for transfer. The MUST is on the VALUE's meaning, not on presence."
  - object: Dialog
    field: parties
    json_type: unknown
    cardinality: 0..1
    required: false
    verb: MUST NOT
    locator: "§4.3.4"
    text: 'The parties parameter MUST NOT be present in "transfer" type Dialog Objects (see Section 4.3.14).'
    text_2: "Multi-channel recordings MUST have a parties value that is an array of the same size as the number of channels in the recording."
    text_3: "If not all channels are used in a recording, such that no parties are recorded on one or more channels, a null placeholder MUST be inserted into the parties array for the corresponding channel."
    semantics: "Indices into the vCon parties array for participants in this dialog. Declared type is 'UnsignedInt' | 'UnsignedInt[]' | ('UnsignedInt' | 'UnsignedInt[]')[] - scalar, array, or array-of-(scalar-or-array) one element per recorded channel."
    kind: stated
    testable: yes
    note: "CORRECTED 2026-10-13: json_type was unsignedint, which hid the three-way union. Two MUSTs on the value's SHAPE (text_2, text_3) sat in §4.3.4's prose and were dropped by the first pass; the null placeholder rule is the one a naive array validator will get wrong. §4.3.1.6 scores it S/S/S/X/O."
  - object: Dialog
    field: originator
    json_type: unsignedint
    cardinality: 0..1
    required: false
    verb: MUST NOT
    locator: "§4.3.5"
    text: 'The originator parameter MUST NOT be present in "transfer" type Dialog Objects (see Section 4.3.14).'
    text_2: "The originator parameter is only provided if the first party of the dialog Object parties list is NOT the originator."
    semantics: "Index of the party that originated this dialog. Absent means the first entry of parties is the originator."
    kind: stated
    testable: yes
  - object: Dialog
    field: recordings
    json_type: unknown
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.3.6"
    text: "The recordings parameter MUST be present in recording-set Dialog Objects. The recordings parameter MUST NOT be present in other Dialog Object types."
    semantics: "Indices of the recording Dialog Objects that make up a recording-set. Declared type 'UnsignedInt[]'. CONDITIONALLY mandatory - see required_when."
    required_when: "type == 'recording-set' - mandatory. MUST NOT be present for any other type (§4.3.1.6 scores it X/M/X/X/X). Appendix C writes it without '?' inside dialog_recording_set_type and omits it from every other branch."
    kind: stated
    testable: yes
    note: "The MUST-be-present half was dropped by the first pass, which kept only the MUST NOT. Both sentences are adjacent in §4.3.6 and are quoted as one contiguous span. Conditionally required: M for recording-set, X for every other type (§4.3.1.6)."
  - object: Dialog
    field: recording_set
    json_type: unsignedint
    cardinality: 0..1
    required: false
    verb: MUST NOT
    locator: "§4.3.7"
    text: "The recording_set parameter SHOULD be present when a recording Dialog Object is part of a recording-set Dialog Object. The recording_set parameter MUST NOT be present in other Dialog Object types."
    semantics: "Back-reference from a recording Dialog Object to the recording-set Dialog Object it belongs to. SOURCE DISAGREEMENT on strength: §4.3.7 says SHOULD be present when the recording is part of a recording-set; Table 1 (§4.3.1.6) scores it plain O for the recording type, which under-reports that SHOULD. §4.3.1.6 settles it in its own words - 'The parameter definitions in the subsections of this document are definitive; this table is provided as a summary' - so this entry follows §4.3.7, not the table. A reader coming from Table 1 will expect O and find SHOULD here."
    required_when: "type == 'recording' AND the recording is part of a recording-set - SHOULD be present (not MUST). MUST NOT be present for any other type."
    kind: stated
    testable: partial
    note: "The SHOULD-be-present half was dropped by the first pass. Both sentences adjacent in §4.3.7, quoted as one span. 'other Dialog Object types' means all but recording: §4.3.1.6 scores it O/X/X/X/X."
  - object: Dialog
    field: mediatype
    json_type: mediatype
    cardinality: 0..1
    required: false
    verb: MUST NOT
    locator: "§4.3.8"
    text: 'The mediatype parameter MUST NOT be present in "recording-set", "transfer" or "incomplete" type Dialog Objects as they do not have Dialog Content.'
    text_2: "The mediatype parameter MUST be provided for inline dialog files and MUST be provided if the Content- Type header in the [HTTPS] response for the externally referenced URL is not provided."
    text_3: "The mediatype parameter is not required when the Dialog Content is absent, such as in a placeholder Dialog Object or when the body and url have been redacted."
    semantics: "MIME media type of the dialog content. CONDITIONALLY mandatory and conditionally prohibited at once; required: false expresses neither. See required_when."
    required_when: "type is recording or text AND Dialog Content is inline (body present) - mandatory; or type is recording or text AND url is present with no Content-Type header in the [HTTPS] response - mandatory. Not required when Dialog Content is absent (placeholder or redacted). MUST NOT be present at all for recording-set, transfer or incomplete (§4.3.1.6 scores it M(1)/X/M(1)/X/X)."
    kind: stated
    testable: yes
    note: "The two MUSTs in text_2 sat in §4.3.8's prose and were dropped by the first pass. The source line-breaks 'Content-Type' as 'Content- Type'; quoted verbatim, hyphen and all."
  - object: Dialog
    field: filename
    json_type: string
    cardinality: 0..1
    required: false
    verb: MUST NOT
    locator: "§4.3.9"
    text: 'The filename parameter MUST NOT be present in "recording-set", "transfer" or "incomplete" type Dialog Objects as they do not have Dialog Content.'
    semantics: "Suggested filename for the content."
    kind: stated
    testable: no
  - object: Dialog
    field: body
    json_type: unknown
    cardinality: 0..1
    required: false
    verb: MUST NOT
    locator: "§4.3.10 / §2.3 / §2.3.1"
    text: 'The Dialog Object SHOULD contain the body and encoding parameters or the url and content_hash parameters for all dialog types other than "incomplete", "transfer" and "recording-set", these parameters MUST NOT be present for "incomplete", "transfer" or "recording-set" dialog types (see Inline Files (Section 2.3) and Externally Referenced Files (Section 2.4)).'
    text_2: "The exception to this is that the body or url MAY be absent if it is redacted."
    base_text: "Objects that contain a file or data inline (i.e. within the vCon) MUST have the parameters: body and encoding."
    semantics: "Inline dialog payload. Declared '*' (any JSON type, §2.2). Mutually alternative with url: body+encoding OR url+content_hash."
    kind: stated
    testable: yes
    note: "§4.3.10's definition line is 'body: \"*\" (optional in a redacted vCon)'. §4.3.1.6 scores it S/X/S/X/X with note (2). The §2.3 base rule in base_text is a MUST conditioned on inline carriage, not an unconditional MUST on this object."
  - object: Dialog
    field: encoding
    json_type: string
    cardinality: 0..1
    required: false
    verb: MUST
