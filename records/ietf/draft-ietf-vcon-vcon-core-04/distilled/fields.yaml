verification: "2026-10-14, FX-1 pass 2 (adversarial verifier), against .cache/draft-ietf-vcon-vcon-core-04.txt sha256 cc2a2cb5051b860e2f29478a9ff946e3d882818bfad55dff48e0f5ae033cd722 (8904 lines). What holds: all 139 text / text_2 / text_3 / base_text / base_text_2 values are each a SINGLE contiguous substring of that source under WHITESPACE NORMALISATION ALONE - a line break and the indent following it become one space, and nothing else is altered. 139 of 139 match exactly, with no quote folding and no other transformation; no splices. Pass 1's run of this check folded the source's double quotes to single ones and did not say so, and 47 of the 139 values carried that substitution; pass 2 restored the source's own quote characters in all 47 and the scalars are single-quoted YAML so the draft's double quotes survive verbatim, as in requirements.yaml. Three values carry a hyphen the draft splits across a line (recording- set, Content- Type); each is kept split and each says so in its note, per the rule in requirements.yaml's header. 13 locators that named a section not containing their quote were corrected - three of them cited §2.3.2/§2.4.1/§2.4.2 for text that is a footnote to Table 1 in §4.3.1.6. every section cited in a locator was read in full body, not only its bulleted definition line; the IANA parameter-name registries (§6.3.2-§6.3.9) were diffed against this table and account for every row; and every required value for the unsigned form was cross-checked against the draft's own Appendix B (JSON Schema) and Appendix C (CDDL), which moved nine rows - see extraction_notes.appendix_evidence for why those appendices corroborate rather than prove. Pass 2 re-derived all nine from the §4 prose bullet alone and confirms all nine; it also extracted all 120 declaration bullets in §2-§5 and found no tenth, and diffed the table against the draft's own IANA registries (§6.3.2-§6.3.9), which match row for row with nothing missing and nothing extra. What does NOT hold: no second party has read this. reviewed_by is empty, so nothing may be built on it (docs/requirements.md §3)."
prior_verification: "The 2026-09-22 line cited 'distilled.md §6' for its 5 defects. That file was superseded by distilled/ at schema v5 and no longer exists, so the citation dangled. The defect record it pointed at is preserved in extraction_notes.prior_defects below."
coverage: "complete - every parameter-defining passage in the document. §2.2 base types and the mandatory-by-default notation rule; §2.3/§2.4 file carriage (body, encoding, url, content_hash); §4.1 vCon top level including the Redacted (§4.1.8.1) and Amended (§4.1.9.1) Objects; §4.2 Party, with the 17 Civicaddress sub-parameters (§4.2.9) carried as a list on the civicaddress row rather than as 17 rows, since all are optional Strings under one shared MUST; §4.3 Dialog including Dialog Content (§4.3.10), Party_History (§4.3.13.1) and Dialog Transfer (§4.3.14); §4.4 Attachment including Attachment Content (§4.4.7); §4.5 Analysis including Analysis Content (§4.5.9); §5 signed and encrypted forms (§5.2, §5.2.1, §5.2.2, §5.3, §5.3.1, §5.3.2, §5.3.3); and vCon.group, which exists only in the §6.3.2 registry. Deliberately out of scope for a FIELD table: §4.3.1.6 is a per-type applicability matrix, carried as per-row notes and not as rows; §4.3.1.1-§4.3.1.5 are VALUES of Dialog.type, carried as its enum; §6 registry machinery, §7 version history, §8 references and the Appendix A examples contribute no parameter this table lacks. The three Content sections (§4.3.10, §4.4.7, §4.5.9) DO contribute fields - see extraction_notes.content_sections."

fields:
  - object: vCon
    field: vcon
    json_type: string
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.1.1"
    text: 'For syntax defined in this document, the string MUST have the value: "0.4.0"'
    semantics: "Schema version. Marked DEPRECATED in the draft; value 0.4.0. The value itself is constrained by a MUST."
    kind: stated
    testable: yes
    note: "The MUST constrains the VALUE, not the PRESENCE. §4.1.1 carries no '(optional)' marker, which under the §2.2 default would make it mandatory; DEPRECATED and the §5.4 form-differentiation rules (which never mention vcon) are read as the override. See extraction_notes.mandatory_by_default."

  - object: vCon
    field: uuid
    json_type: string
    cardinality: "1"
    required: true
    verb: MUST
    locator: "§4.1.2"
    text: "The UUID value MUST be globally unique. All vCon documents MUST have the uuid parameter and value set."
    semantics: "Globally unique identifier; SHOULD be UUID version 8 per [UUID]."
    kind: stated
    testable: partial       # global uniqueness is not locally testable

  - object: vCon
    field: extensions
    json_type: "string[]"
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.1.3"
    text: "The extensions parameter SHOULD contain the list of names of all vCon extensions for any parameters used that are not defined in this core vCon schema document."
    semantics: "Declares extensions in use. SHOULD, not MUST."
    kind: stated
    testable: no            # cannot detect an undeclared extension generically

  - object: vCon
    field: critical
    json_type: "string[]"
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.1.4"
    text: "Implementations that include extensions which are incompatible with the core vCon schema MUST list the names of those extensions in the critical parameter."
    text_2: "An implementation that does not recognize or support the extensions listed in the critical parameter MUST NOT attempt to process or operate on the vCon, except to reject it or report unsupported content."
    note_quotes: "Two non-adjacent sentences in §4.1.4; a third sentence separates them. Kept apart rather than spliced."
    semantics: "Must-understand list. Consumer MUST NOT process a vCon carrying unsupported critical extensions, except to reject or report."
    kind: stated
    testable: yes
    note: "Producer opt-in. Omission is indistinguishable from 'no critical extensions'. See ARCH-0002 P5."

  - object: vCon
    field: created_at
    json_type: string
    cardinality: "1"
    required: true
    verb: MUST
    locator: "§4.1.5"
    text: "The created_at parameter provides the creation time of this vcon, which MUST be present, and should not change once the vcon object is created."
    semantics: "RFC 3339 date string per the Date base type, §2.2. The MUST is on PRESENCE; immutability after creation is a lowercase 'should not' and is NOT normative."
    kind: stated
    testable: yes

  - object: vCon
    field: updated_at
    json_type: string
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.1.6"
    text: "Future updates MUST first set the updated_at to the new signing time as the vcon object is signed again."
    semantics: "RFC 3339 date string. On re-signing, updated_at MUST be set to the new signing time - the field is bound to the signature, not merely descriptive."
    kind: stated
    testable: partial

  - object: vCon
    field: subject
    json_type: string
    cardinality: 0..1
    required: false
    verb: none
    locator: "§4.1.7"
    semantics: "Conversation topic."
    kind: stated
    testable: no

  - object: vCon
    field: redacted
    json_type: object
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.1.8 / §4.1.8.1"
    text: "If a reference to the unredacted vCon is provided in the url parameter, the access to that URL MUST be restricted to only those who should be allowed"
    text_2: "A redacted vCon SHOULD provide a reference to the unredacted or prior, less redacted, vCon instance version of itself."
    semantics: "Reference to a less-redacted prior vCon. Points backwards; does not replace. Conditional MUST: the URL's access MUST be restricted."
    kind: stated
    testable: no
    note: "§4.1.8's definition line reads 'redacted: \"Redacted\" (optional, mutually exclusive with amended parameter)'. The mutual exclusion with amended is a cross-field constraint that no generated artifact expresses."

  - object: vCon
    field: amended
    json_type: object
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.1.9 / §4.1.9.1"
    text: "In these cases, to allow for adding of additional information a new vCon instance version MUST be created."
    semantics: "Reference to a prior version to which data has been added. Adding information MUST create a new vCon instance rather than mutating."
    kind: stated
    testable: partial
    note: "§4.1.9's definition line reads 'amended: \"Amended\" (optional, mutually exclusive with redacted parameter)'. Same unexpressed cross-field constraint as redacted."

  - object: vCon
    field: parties
    json_type: "object[]"
    cardinality: 0..1
    required: false
    verb: none
    locator: "§4.1.10"
    semantics: "Array of Party Objects (§4.2)."
    kind: stated
    testable: yes

  - object: vCon
    field: dialog
    json_type: "object[]"
    cardinality: 0..1
    required: false
    verb: none
    locator: "§4.1.11"
