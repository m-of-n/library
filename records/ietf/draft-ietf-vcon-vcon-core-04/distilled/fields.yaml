  - object: Analysis
    field: schema
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.5 / §4.5.8"
    text: "For analysis data or files types for which a media type is not defined, the vendor and schema parameters SHOULD be used."
    semantics: "Token or label for the data format or schema of the analysis content."
    kind: stated
    testable: partial
    note: "Same §4.5 SHOULD that governs vendor; dropped by the first pass, which recorded verb: none. Unlike vendor, schema IS optional: §4.5.8 marks it '(optional)', Appendix B omits it from Analysis required, and Appendix C writes '? schema: tstr'. The §4.5 sentence names the two together, but only one of them is mandatory."
  - object: Analysis
    field: body
    json_type: unknown
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.5.9 / §2.3 / §2.3.1"
    text: "The Analysis Object SHOULD contain the body and encoding parameters or the url and content_hash parameters (see Inline Files (Section 2.3) and Externally Referenced Files (Section 2.4))."
    text_2: "The exception to this is that the body or url MAY be absent if it is redacted."
    base_text: "Objects that contain a file or data inline (i.e. within the vCon) MUST have the parameters: body and encoding."
    semantics: "Inline analysis payload, declared '*'. Both Appendix A analysis examples use it with a JSON object or array value, not a string."
    kind: stated
    testable: yes
    note: "Same unannotated definition line as §4.4.7: 'body: \"*\"' with no '(optional in a redacted vCon)' although the prose grants it."
  - object: Analysis
    field: encoding
    json_type: string
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.5.9 / §2.3.2"
    text: "If the body parameter is provided and is not an empty string, the encoding parameter MUST be provided."
    base_text: "This MUST be one of the following strings:"
    semantics: "How body was encoded. For analysis the usual value is 'json', since the payload is already a JSON value."
    enum: [base64url, json, none]
    enum_locator: "§2.3.2"
    kind: stated
    testable: yes
  - object: Analysis
    field: url
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.5.9 / §2.4.1"
    text: "The Analysis Object SHOULD contain the body and encoding parameters or the url and content_hash parameters (see Inline Files (Section 2.3) and Externally Referenced Files (Section 2.4))."
    base_text: "The url value contains the [HTTPS] URL where the externally referenced file is stored. HTTPS MUST be used for retrieval to protect the privacy of the contents of the file."
    semantics: "HTTPS location of externally stored analysis content."
    kind: stated
    testable: yes
  - object: Analysis
    field: content_hash
    json_type: unknown
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.5.9 / §2.4 / §2.4.2"
    text: "Objects that refer to a file which is externally stored from the vCon MUST have the parameters: url, content_hash."
    base_text: "The SHA-512 [SHA-512] algorithm MUST be supported. Other algorithms MAY be included."
    semantics: "Integrity hash over externally referenced analysis content. Declared 'ContentHash' | 'ContentHash[]'."
    kind: stated
    testable: yes

  - object: Redacted
    field: uuid
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.1.8 / §4.1.8.1"
    text: "The Redacted Object (Section 4.1.8.1) SHOULD contain the uuid parameter and MAY include the url, content_hash parameters (see Externally Referenced Files (Section 2.4))."
    text_2: "The absence of a value for uuid indicates that the less redacted version of this vCon is not available or does not exist."
    semantics: "UUID of the unredacted or less-redacted prior vCon instance version. Absence is MEANINGFUL, not merely omission - it asserts the prior version is unavailable or does not exist. SOURCE DEFECT: this parameter is mandatory and optional at once. §4.1.8.1 declares it bare, 'uuid: \"String\"', with no '(optional)' marker, so §2.2's 'All parameters are assumed to be mandatory unless otherwise noted' makes it mandatory - while the very next sentence (text_2) defines what its ABSENCE means, which only makes sense if it may be absent. No validator can satisfy both readings."
    kind: stated
    testable: no
    note: "required: false follows text_2 and the §4.1.8 SHOULD, and is corroborated by Appendix B, whose Redacted required list is [type] alone. Recorded rather than silently resolved: the two readings are both in the source. §4.1.9.1 avoids the identical trap for the Amended Object by writing '(optional if external reference provided)' on the same parameter, which is evidence the omission here is an editing slip and not a deliberate difference."
  - object: Redacted
    field: type
    json_type: string
    cardinality: "1"
    required: true
    verb: none
    locator: "§4.1.8.1"
    text: "The value of the redacted type parameter is used to indicate the type of redaction that was performed on this vCon relative to the less redacted version referenced by the redacted uuid parameter."
    semantics: "What kind of information was redacted. Free string - Appendix A.8 uses 'PII Redaction'. No registry, no enumeration."
    kind: inferred
    testable: no
    note: "Presence inferred from §2.2's mandatory-by-default rule: §4.1.8.1 gives it no '(optional)' marker, and unlike uuid, url and content_hash it is NOT mentioned in §4.1.8's SHOULD/MAY sentence. Appendix A.8's Redacted Object carries exactly uuid and type."
  - object: Redacted
    field: url
    json_type: string
    cardinality: 0..1
    required: false
    verb: MAY
    locator: "§4.1.8 / §4.1.8.1 / §2.4.1"
    text: "The the location of the referenced vCon MAY be provided as defined in Externally Referenced Files (Section 2.4) by including url and content_hash."
    text_2: "If a reference to the unredacted vCon is provided in the url parameter, the access to that URL MUST be restricted to only those who should be allowed to see the identity or PII for the redacted vCon."
    semantics: "HTTPS location of the less-redacted vCon. Carrying it imposes a MUST on ACCESS CONTROL at that URL - the only access-control requirement in the document attached to a field."
    kind: stated
    testable: no
    note: "Source typo quoted verbatim: 'The the location'. The MUST in text_2 is not testable from the vCon alone; it constrains a server the vCon merely points at."
  - object: Redacted
    field: content_hash
    json_type: unknown
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.1.8.1 / §2.4.2"
    text: "content_hash MUST be included if url is provided."
    semantics: "Integrity hash over the referenced less-redacted vCon. Declared 'ContentHash' | 'ContentHash[]'. Conditionally mandatory on url."
    kind: stated
    testable: yes

  - object: Amended
    field: uuid
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§4.1.9 / §4.1.9.1"
    text: "The prior vCon instance version SHOULD be referenced via the uuid of the prior vCon instance version, and MAY include the url and content_hash parameters (see Externally Referenced Files (Section 2.4))."
    semantics: "UUID of the prior vCon instance version this one amends."
    kind: stated
    testable: no
    note: "§4.1.9.1's definition line is 'uuid: \"String\" (optional if external reference provided)' - a conditional in lowercase prose, weaker than the SHOULD quoted here. Unlike Redacted.uuid, absence is given no defined meaning."
  - object: Amended
    field: url
    json_type: string
    cardinality: 0..1
    required: false
    verb: MAY
    locator: "§4.1.9.1 / §2.4.1"
    text: "The location of the referenced vCon MAY be provided, as defined in Externally Referenced Files (Section 2.4) by including url and content_hash."
    semantics: "HTTPS location of the prior vCon instance version."
    kind: stated
    testable: yes
    note: "No access-restriction MUST here, unlike Redacted.url - an amended prior version is not assumed to hold more PII than its successor."
  - object: Amended
    field: content_hash
    json_type: unknown
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§4.1.9.1 / §2.4.2"
    text: "content_hash MUST be provided if url is provided."
    semantics: "Integrity hash over the referenced prior vCon. Declared 'ContentHash' | 'ContentHash[]'. Conditionally mandatory on url."
    kind: stated
    testable: yes
    note: "The Redacted twin of this rule says 'MUST be included'; this one says 'MUST be provided'. Same rule, two wordings, two sections apart."

  - object: vCon (signed form)
    field: payload
    json_type: string
    cardinality: "1"
    required: true
    verb: none
    locator: "§5.2 / §5.4"
    text: "The value of the payload is the Base64Url Encoded string containing either: the unsigned form of the JSON vCon; or the gzipped [GZIP] unsigned form of the JSON vCon."
    semantics: "The signed vCon's JWS payload: Base64url of the unsigned vCon, optionally gzipped first. The General JWS JSON Serialization of [JWS] §7.2.1."
    kind: inferred
    testable: yes
    note: "Presence inferred: no '(optional)' marker, so §2.2's default applies, and §5.4 makes payload plus signatures the recognition test for the signed form. The object is the whole JWS wrapper, not a member of the unsigned vCon - it never co-occurs with parties/dialog/analysis/attachments."
  - object: vCon (signed form)
    field: signatures
    json_type: "object[]"
    cardinality: "1"
    required: true
    verb: MUST
    locator: "§5.2 / §5.2.1"
    text: "The vCon General JWS JSON Serialization MUST include x5c or x5u in the unprotected header."
    text_2: "The value of signatures is an array of Signature Objects (Section 5.2.1)"
    semantics: "Array of Signature Objects (§5.2.1). The MUST reaches down two levels - into each Signature Object's header - and is the document's one addition to plain [JWS]."
    kind: stated
    testable: yes
    note: "§5.2 calls it 'the unprotected header' while §5.2.1 names the member 'header'; [JWS] §7.2.1's per-signature 'header' member IS the unprotected one, so they agree, but the document never says so. §5.4 makes payload plus signatures the recognition test for the signed form. Source defect: text_2 ends without a full stop."

  - object: Signature
    field: header
    json_type: object
    cardinality: "1"
    required: true
    verb: MUST
    locator: "§5.2.1"
    text: "The Signature Object MUST contain a header, protected and signature parameter as defined in section 7.2.1 of [JWS]."
    text_2: "The value of header is defined in Header Object (Section 5.2.2)"
    semantics: "The per-signature unprotected JWS header; its contents are the Header Object of §5.2.2, which is where the x5c-or-x5u MUST lands."
    kind: stated
    testable: yes
    note: "One MUST covers all three members of this object; the same sentence is quoted on each. Source defect: text_2 ends without a full stop."
  - object: Signature
    field: protected
    json_type: string
    cardinality: "1"
    required: true
    verb: MUST
    locator: "§5.2.1"
    text: "The Signature Object MUST contain a header, protected and signature parameter as defined in section 7.2.1 of [JWS]."
    semantics: "Base64url of the protected JWS header, per [JWS] §7.2.1. The document adds no constraint of its own on its contents."
    kind: stated
    testable: yes
  - object: Signature
    field: signature
    json_type: string
    cardinality: "1"
    required: true
    verb: MUST
    locator: "§5.2.1"
    text: "The Signature Object MUST contain a header, protected and signature parameter as defined in section 7.2.1 of [JWS]."
    semantics: "The signature value itself, per [JWS] §7.2.1."
    kind: stated
    testable: yes
    note: "Renamed in 0.0.2: §7.3 records that 'alg' and 'signature' were combined into 'content_hash' - that was the externally-referenced-file signature, a different thing from this JWS member with the same name."

  - object: Header (JWS)
    field: alg
    json_type: string
    cardinality: "1"
    required: true
    verb: MUST
    locator: "§5.2.2"
    text: "The Header Object and its contents are defined in section 4 of [JWS]. The Header Object for a signed vCon MUST include the alg and either the x5c or x5u arrays."
    text_2: 'The string value of alg is defined in section 4.1.1 of [JWS]. For a signed vCon this value SHOULD be "RS256" to maximize interoperability.'
    semantics: "Signing algorithm. MUST be present; SHOULD be RS256. The MUST on presence and the SHOULD on value are separate requirements."
    kind: stated
    testable: yes
  - object: Header (JWS)
    field: x5c
    json_type: "string[]"
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§5.2.2"
    text: '* x5c: "String[]" (MUST provide x5c or x5u)'
    text_2: "The Header Object for a signed vCon MUST include the alg and either the x5c or x5u arrays."
    semantics: "X.509 certificate chain, per [JWS] §4.1.6. Either x5c or x5u MUST be present - neither alone is individually required."
    kind: stated
    testable: yes
    note: "An exclusive-or on PRESENCE across two fields; required is false on each because neither is required by itself. §5.2's rationale: it lets the certificate chain travel with the vCon."
  - object: Header (JWS)
    field: x5u
    json_type: string
    cardinality: 0..1
    required: false
    verb: MUST
    locator: "§5.2.2"
    text: '* x5u: "String" (MUST provide x5c or x5u)'
    text_2: "The string value of x5u MUST contain an [HTTPS] URL as defined in section 4.1.5 of [JWS]."
    semantics: "URL of the X.509 certificate chain. Two MUSTs: the x5c-or-x5u presence rule, and https on the value."
    kind: stated
    testable: yes
    note: "§5.2.2 calls x5c and x5u 'the x5c or x5u arrays', but x5u is declared 'String', not an array - a source defect."
  - object: Header (JWS)
    field: uuid
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§5.2.2 / §6.5"
    text: '* uuid: "String" (SHOULD be provided)'
    text_2: "When the vCon is verified, the value of this uuid parameter SHOULD be verified against the UUID in the signed vCon."
    semantics: "The payload vCon's UUID, lifted into the header so it can be read without verifying the signature. Two SHOULDs: provide it, and check it against the payload on verification."
    kind: stated
    testable: yes
    note: "Registered in the [JWS] JSON Web Signature and Encryption Header Parameters registry by §6.5, usable in both JWS and JWE. A convenience that is also an attack surface: it is readable, and under the SHOULD, unverified. §6.5's Specification Document column cites 'Header Object (Section 5.3.1)', but §5.3.1 is the Unprotected Object, not a Header Object - a source cross-reference defect."

  - object: vCon (encrypted form)
    field: unprotected
    json_type: object
    cardinality: "1"
    required: true
    verb: none
    locator: "§5.3 / §5.3.1"
    text: '* unprotected: "Unprotected"'
    semantics: "The JWE shared unprotected header, whose members are the Unprotected Object of §5.3.1."
    kind: inferred
    testable: yes
    note: "Presence inferred from §2.2's mandatory-by-default rule; §5.3 gives it no '(optional)' marker and no verb."
  - object: vCon (encrypted form)
    field: recipients
    json_type: "object[]"
    cardinality: "1"
    required: true
    verb: none
    locator: "§5.3 / §5.4"
    text: '* recipients: "Recipient[]"'
    semantics: "Array of Recipient Objects (§5.3.2), per the General JWE JSON Serialization of [JWE] §7.2.1."
    kind: inferred
    testable: yes
    note: "Presence inferred from §2.2 plus §5.4, which makes ciphertext plus recipients the recognition test for the encrypted form."
  - object: vCon (encrypted form)
    field: iv
    json_type: string
    cardinality: "1"
    required: true
    verb: none
    locator: "§5.3"
    text: "The string value of iv is the Initialization Vector as constructed as defined in section 7.2.1 of [JWE]."
    semantics: "JWE Initialization Vector."
    kind: inferred
    testable: yes
    note: "Presence inferred from §2.2; the document delegates its construction wholly to [JWE] and adds no verb."
  - object: vCon (encrypted form)
    field: ciphertext
    json_type: string
    cardinality: "1"
    required: true
    verb: MUST
    locator: "§5.3 / §5.4"
    text: "A vCon MUST be signed first using JWS as defined in Signed Form of vCon Object (Section 5.2), then encrypted using JWE as opposed to just encrypted with integrity protection."
    text_2: "The string value of ciphertext is constructed as defined in section 7.2.1 of [JWE] using the signed form of the vCon as the plaintext input for encryption."
    text_3: "vCons may be stored in unencrypted form, but the signed form MUST be maintained to ensure its integrity."
    semantics: "The encrypted payload. Its plaintext MUST be the SIGNED form, never the unsigned form - sign-then-encrypt is mandatory, and the ordering is the one requirement in §5 that a conforming producer can get silently wrong."
    kind: stated
    testable: partial
    note: "Testable only with the key. §5.4 makes ciphertext plus recipients the recognition test for the encrypted form."
  - object: vCon (encrypted form)
    field: tag
    json_type: string
    cardinality: "1"
    required: true
    verb: none
    locator: "§5.3"
    text: "The string value of tag is the the Authentication Tag as defined in section 7.2.1 of [JWE]."
    semantics: "JWE Authentication Tag."
    kind: inferred
    testable: yes
    note: "Presence inferred from §2.2. Source typo quoted verbatim: 'is the the Authentication Tag'."

  - object: vCon (encrypted form)
    field: protected
    json_type: string
    cardinality: 0..1
    required: false
    required_when: 'the JWE Protected Header is non-empty - then it MUST be present; otherwise it MUST be absent. Both branches are a MUST, so this is a conditional obligation and not an optional parameter.'
    verb: MUST
    locator: "§5.3 (omitted from its member list) / [JWE] RFC 7516 §7.2.1 / Appendix A.7"
    semantics: 'The Base64Url-encoded JWE Protected Header - the only header of an encrypted vCon that is integrity protected. No text of this draft defines it, which is why this row carries no verbatim text. RFC 7516 §7.2.1 does: "The "protected" member MUST be present and contain the value BASE64URL(UTF8(JWE Protected Header)) when the JWE Protected Header value is non-empty; otherwise, it MUST be absent."'
    kind: inferred
    testable: yes
    note: 'D3, settled in FX-1 pass 2. §5.3 enumerates only unprotected, recipients, iv, ciphertext and tag, but it invokes "the General JWE JSON Serialization Syntax form as defined in section 7.2.1 of [JWE]", and that serialization defines protected as one of its members - so the draft''s own enumeration is INCOMPLETE and its A.7 example, which carries protected at the top level, is right. Appendix C repeats the omission in encrypted_vcon_type, so normative text and informational schema are wrong together. Cited from .cache/rfc-7516.txt sha256 722cfcddc15f58e746891ba4b846853d3711153a774e4dd55ad6db100474a21f, not from this record''s own source, hence kind: inferred.'

  - object: vCon (encrypted form)
    field: aad
    json_type: string
    cardinality: 0..1
    required: false
    required_when: 'the JWE AAD value is non-empty - then it MUST be present; otherwise it MUST be absent. As with protected, both branches are a MUST.'
    verb: MUST
    locator: "§5.3 (omitted from its member list) / [JWE] RFC 7516 §7.2.1"
    semantics: 'Base64Url-encoded Additional Authenticated Data: a value integrity protected but NOT encrypted. No text of this draft defines it, so this row carries no verbatim text. RFC 7516 §7.2.1 does: "The "aad" member MUST be present and contain the value BASE64URL(JWE AAD)) when the JWE AAD value is non-empty; otherwise, it MUST be absent." The doubled closing parenthesis after JWE AAD is the RFC''s own typo, reproduced here.'
    kind: inferred
    testable: yes
    note: 'D3, settled in FX-1 pass 2, same ground as protected and found in the same sweep: §5.3''s member list omits aad as well, and Appendix C''s encrypted_vcon_type omits it too. Unlike protected, no Appendix A example exercises it, so nothing in the record would have revealed the gap - it is visible only by reading the serialization §5.3 invokes. Worth naming because aad is the one place an encrypted vCon can carry integrity-protected cleartext, which is exactly the kind of parameter a redaction or provenance extension would reach for. Cited from .cache/rfc-7516.txt sha256 722cfcddc15f58e746891ba4b846853d3711153a774e4dd55ad6db100474a21f, hence kind: inferred.'

  - object: Unprotected
    field: cty
    json_type: string
    cardinality: "1"
    required: true
    verb: SHOULD
    locator: "§5.3.1"
    text: 'The string value of cty SHOULD be either "application/vcon" or "application/vcon+gzip"'
    semantics: "Content type of the encrypted payload, distinguishing a gzipped vCon from a plain one before decryption."
    enum: [application/vcon, application/vcon+gzip]
    kind: stated
    testable: yes
    note: "Presence is inferred from §2.2's default (no '(optional)' marker); the SHOULD constrains the VALUE. Both tokens are the media types registered in §6.1 and §6.2. Source defect: the sentence ends without a full stop."
  - object: Unprotected
    field: enc
    json_type: string
    cardinality: "1"
    required: true
    verb: SHOULD
    locator: "§5.3.1"
    text: 'The string value of enc SHOULD be "A256CBC-HS512"'
    semantics: "JWE content encryption algorithm."
    kind: stated
    testable: yes
    note: "Presence inferred from §2.2; the SHOULD constrains the VALUE. Source defect: the sentence ends without a full stop."
  - object: Unprotected
    field: uuid
    json_type: string
    cardinality: 0..1
    required: false
    verb: SHOULD
    locator: "§5.3.1 / §6.5"
    text: '* uuid: "String" (SHOULD be provided)'
    text_2: "The value of this uuid parameter SHOULD be verified when the vCon is decrypted."
    semantics: "The enciphered vCon's UUID, readable without the decryption key - the whole point of putting it in the unprotected header."
    kind: stated
    testable: partial
    note: "Same registered parameter as Header (JWS).uuid (§6.5). Identifiable-without-the-key is a deliberate privacy trade the document does not discuss."

  - object: Recipient
    field: header
    json_type: object
    cardinality: "1"
    required: true
    verb: none
    locator: "§5.3.2 / §5.3.3"
    text: '* header: "Header"'
    semantics: "Per-recipient JWE header; its contents are the Header Object of §5.3.3, which is a different object from the §5.2.2 Header Object of the same name."
    kind: inferred
    testable: yes
    note: "Presence inferred from §2.2. The document defines two distinct objects both called 'Header Object', §5.2.2 for JWS and §5.3.3 for JWE, with different members; only context distinguishes them."
  - object: Recipient
    field: encrypted_key
    json_type: string
    cardinality: "1"
    required: true
    verb: none
    locator: "§5.3.2"
    text: "The string value of encrypted_key is defined in section 7.2.1 of [JWE]."
    semantics: "The content encryption key, encrypted to this recipient."
    kind: inferred
    testable: yes
    note: "Presence inferred from §2.2; construction delegated wholly to [JWE]."

  - object: Header (JWE)
    field: alg
    json_type: string
    cardinality: "1"
    required: true
    verb: SHOULD
    locator: "§5.3.3"
    text: 'The string value of alg SHOULD be "RSA-OAEP".'
    semantics: "Key management algorithm for this recipient."
    kind: stated
    testable: yes
    note: "Presence inferred from §2.2's default; the SHOULD constrains the VALUE. §5.3.3 is the whole of this object - one member, no MUST, in contrast with §5.2.2's MUST on alg for the signed form. An encrypted vCon therefore has no mandatory header member."

extraction_notes:
  tool: "bin/extract-fields - first pass only; semantics and testability are human"
  tool_artifact: >
    The extractor treated Dialog type VALUES (recording, recording-set, text,
    transfer, incomplete) as fields, because they are subsections under
    4.3.1 with the same shape as a field definition. They are an enumeration
    of Dialog.type, not fields. Corrected by hand and recorded here: a tool
    that reads structure cannot tell a value from a field.
    The same tool artifact bit a second time, and the first pass did not
    catch it: Dialog.party_history was recorded with the field name
    "party_history Objects Array", which is the §4.3.13 SECTION TITLE. That
    one was worse than the Dialog type values, because it survived into
    generated code - bin/derive snake-cases field straight into the CDDL,
    Python and Rust, so types.derived.cddl carried a Dialog member keyed
    "party_history Objects Array". Caught by a cross-check of the derived
    CDDL against the draft's own Appendix C, not by reading the table. The
    general shape: a tool that reads document structure cannot tell a
    HEADING from a field any more than it can tell a VALUE from a field,
    and §4.1.10-§4.1.13 and §4.3.13 are headings of the form "<name>
    Objects Array" that look exactly like one.
  content_sections: >
    Verdict on §4.3.10, §4.4.7 and §4.5.9, which the first pass set aside as
    "content-carriage rules, not fields". They are fields. Each of the three
    sections prints four definition lines of exactly the shape every other
    parameter gets - body, encoding, url, content_hash, with types "*",
    "String", "String" and "ContentHash" | "ContentHash[]" - and §6.3.4,
    §6.3.6 and §6.3.7 register all four as parameter names of the Dialog,
    Attachment and Analysis Objects, citing §4.3.10, §4.4.7 and §4.5.9 as
    their defining sections. §4.3.1.6's Table 1 scores body, encoding, url and
    content_hash as Dialog Object parameters alongside type and start. They
    are therefore carried as twelve rows on the three objects, not as a
    separate carriage concept.
    What §2.3 and §2.4 contribute is the BASE rule, not a separate field: the
    MUST that inline carriage implies body and encoding, the MUST that
    external reference implies url and content_hash, the MUST that encoding is
    present whenever body is non-empty and is one of three tokens, the MUST on
    https for retrieval, and the MUST that SHA-512 be supported. Those are
    carried on each row as base_text, so a row is readable without §2, while
    text carries the object's own presence rule. The three sections do add
    rules of their own and are not mere cross-references: §4.3.10 alone adds
    a MUST NOT for the incomplete, transfer and recording-set types, and all
    three add the redaction exception.
  appendix_evidence: >
    Appendices B (JSON Schema) and C (CDDL) were used in this pass to
    cross-check required-ness, and nine rows moved because of them. Their
    standing must not be overstated. Appendix C states it outright:
    "Generated from the prose of draft-ietf-vcon-vcon-core", "The prose of
    the draft is normative. This CDDL is informative", and if it conflicts
    with the text then "the CDDL below should be consider incorrect".
    Appendix B carries no such preamble but is the same kind of artifact.
    They are therefore NOT independent witnesses to the prose - they are the
    editors' own reading of it, restated twice. Where all three agree, what
    that shows is that the editors read their own convention the way this
    table now does; it is corroboration of intent, not a second source.
    Where they would disagree with the prose, the prose wins by Appendix C's
    own instruction, and this table follows the prose.
    Two places where they are nonetheless more precise than the prose, and
    are quoted in notes as such: Appendix B writes the Table 1 per-type
    prohibitions as if/then/not over required, and writes the conditional
    requirements (body implies encoding, body implies mediatype, url implies
    content_hash, keydown or keyup implies button) that §4 states only in
    prose. Appendix C writes the five Dialog types as five distinct CDDL
    groups, which is the cleanest statement of §4.3.1.6 anywhere in the
    document.
    One correction to a cross-check claim received during this pass:
    Appendix C is NOT silent on Dialog Content or the transfer parameters.
    It defines file_content_type = ( inline_content_type //
    external_content_type ) and references it as "? file_content_type" in
    dialog_recording_type, dialog_text_type, attachment_object_type and
    analysis_object_type, and it defines dialog_transfer_type with all six
    transfer parameters. It is silent on them only in the sense that it
    marks every one optional.
  mandatory_by_default: >
    The largest internal contradiction in the document. §2.2 ends: "All
    parameters are assumed to be mandatory unless otherwise noted." Taken
    literally this makes every parameter without an "(optional)" marker
    required - including vcon, which §4.1.1 marks DEPRECATED, and
    updated_at, whose own section says it "MAY be present".
    The rule is applied here where nothing overrides it and the field is a
    scalar: Attachment.start, Attachment.dialog, Analysis.type,
    Analysis.vendor, Redacted.type, Party_History.party, Party_History.time,
    Party_History.event, and every member of §5's objects. Those rows carry
    kind: inferred where they have no verb of their own, and each says so in
    its note. Appendices B and C agree with every one of them that they
    cover, which is corroboration of intent rather than a second source -
    see appendix_evidence.
    It is NOT applied where the section's own prose relieves presence
    (Dialog.start, Dialog.duration, Redacted.uuid, updated_at, vcon), nor to
    arrays and objects, which §2.2's very next sentence excuses: "Objects or
    arrays with no or null values MAY be excluded from the vCon." That second
    sentence is what keeps extensions, critical, parties, dialog, analysis and
    attachments optional.
    Where this pass got it wrong once: Analysis.vendor was first put in the
    relieved list, reading §4.5's "the vendor and schema parameters SHOULD be
    used" as relief. It is not. That sentence says what to USE vendor and
    schema FOR; §4.5.6 carries no "(optional)" marker, Appendix B lists
    Analysis required as [type, vendor], and Appendix C writes it without "?".
    Its sibling schema IS optional and marked so. A SHOULD about a
    parameter's purpose is not a note about its presence - the same trap as
    mistaking a MUST on a value for a MUST on presence, running the other way.
    §5's objects are the weakest application of the rule: nothing in §5
    marks any member optional, and nothing relieves any, so every member of
    vCon (signed form), vCon (encrypted form), Recipient, Unprotected and
    Header (JWE) is required here on the §2.2 default alone. Appendices B and
    C cover only the UNSIGNED form, so they cannot corroborate those rows.
    [JWS] §7.2.1 and [JWE] §7.2.1 would, and a later pass should check them.
  prior_defects: >
    The 2026-09-22 pass recorded five defects in a file, distilled.md §6,
    that schema v5 removed. Preserved here because the verification line
    cited it: four of the five were MUSTs that sat in a section's PROSE
    rather than in its bulleted definition line and were therefore missed by
    a definition-line-only read, and two were quotes spliced from
    non-adjacent sentences. This pass found the same class again and fixed
    it in place - see the notes on Dialog.recordings, Dialog.recording_set,
    Dialog.mediatype, Dialog.disposition, Dialog.parties, Dialog.session_id,
    Dialog.type, Party.validation, Analysis.vendor and Analysis.schema, ten
    further dropped normative statements, every one of them in prose.
  source_defects: >
    Found while reading whole section bodies, all quoted verbatim where they
    appear in a text field. Typos: "The the location" (§4.1.8.1), "The the
    civicaddress parameter" (§4.2.9), "is the the Authentication Tag"
    (§5.3), "SHOULD be create" (§4.2.5), "the part is taken off hold" and
    "off mute" for "party" (§4.3.13.1), "confidentially reasons" (§4.2.7),
    "one of the following string" (§4.3.11), "it is analysis to be captures"
    (§4.3.14). Type-token defect: §4.5.7 declares product as "string",
    lowercase, the only lowercased type token in the document. Syntax
    defect: §4.3.15's definition line omits the colon - 'application
    "String" (optional)'. Cross-reference defects: §6.3.2 cites Section
    4.1.8 as the defining section for amended, which is §4.1.9; §6.5 cites
    "Header Object (Section 5.3.1)", but §5.3.1 is the Unprotected Object.
    Structural defects: §5.2.2 calls x5c and x5u "the x5c or x5u arrays"
    while x5u is declared a String; §4.3.14 says there may be "more than one
    consultation" while consultation is declared a single UnsignedInt with
    no array alternative; §4.4.7 and §4.5.9 print body and url with no
    "(optional in a redacted vCon)" annotation although their own prose
    grants that exception, where §4.3.10 annotates both; §4.3.10's governing
    sentence is a comma splice joining a SHOULD clause to a MUST NOT clause.
    Registry-only parameter: vCon.group is registered in §6.3.2 with no
    defining section and no type.
  objects: >
    Fifteen objects. Five from the unsigned form (vCon, Party, Dialog,
    Attachment, Analysis), four sub-objects of it (Redacted, Amended,
    Party_History, and Civicaddress, which is carried as a sub_parameters
    list on Party.civicaddress rather than as its own rows), and six from §5
    (vCon (signed form), Signature, Header (JWS), vCon (encrypted form),
    Unprotected, Recipient, Header (JWE)). Note that the §5 objects are not
    members of the unsigned vCon: they are the JWS and JWE wrappers around
    it, and bin/derive will emit them as sibling types with no relation to
    the unsigned ones. SessionId - an object of two String parameters, local
    and remote - is defined in §2.2 as a base TYPE, not as a schema object
    with a section of its own, and is carried in the semantics of
    Dialog.session_id.
  not_expressed: >
    Beyond what distilled/README.md already lists: the redacted/amended
    mutual exclusion (§4.1.8, §4.1.9), the x5c-or-x5u exclusive or (§5.2.2),
    Party_History.button's conditional requirement on event (§4.3.13.1),
    Analysis.dialog's and Analysis.attachment's "optional only if not
    derived from" conditions (§4.5.2, §4.5.3), the referent-TYPE constraints
    on Dialog.original, consultation and target_dialog (§4.3.14), the
    positional correlation between session_id and parties (§4.3.12), and
    sign-then-encrypt ordering (§5.3). Every one is a cross-field or
    cross-object constraint; none is reachable from a per-field table or
    anything generated from one.
