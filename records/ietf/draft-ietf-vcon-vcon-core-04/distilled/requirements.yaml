  - id: draft-ietf-vcon-vcon-core-04#R-0043
    object: 'Inline file'
    field: 'body'
    verb: MUST
    actor: 'producer'
    locator: '§2.3'
    text: 'For this reason inline files MUST be Base64url (see Section 2 [JWS]) encoded to be included as a valid JSON string value if they are not already valid JSON strings.'
