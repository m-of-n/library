reconciliation: 'The source states 216 BCP 14 keyword occurrences and this extraction carries 169. The 47 not carried are all in Appendix B (8) and Appendix C (39), which are informative renderings of the same rules and are excluded on the source''s own instruction: Appendix B opens ''This JSON schema is provided as informational. The text in sections 1-6 of this document define the normative definition of the vCon schema'', Appendix C opens the same way and adds ''The prose and Table 1 of the draft are definitive.'' Every keyword in them restates a statement already carried from sections 2 to 6 -- for instance Appendix C line ''mediatype MUST be present for inline content'' restates 4.3.8, and Appendix B''s closing comment ''At least one of the parties, dialog, analysis or attachments parameters SHOULD be present'' restates section 4. Extracting them would double-count obligations and create ids that a later draft could retarget when the appendices are regenerated; the two appendices are carried verbatim as artifacts under distilled/schema/ instead. Sections 2 to 6 are carried in full and the per-section totals reconcile exactly: section 2 = 20, section 4 = 121, section 5 = 27, section 6 = 1, section 7 = 0 (it states no keywords), 169 in all. Three things a reader of this file alone cannot see. (1) Five sentences carry two keywords each and are kept whole because their halves are one rule: R-0002 (uuid globally unique, uuid present), R-0030 and the matching 4.3.8 mediatype sentence (inline, and externally referenced without a Content-Type header), and the two 4.3 placement sentences about faxes and musical recordings (SHOULD attachment, SHOULD NOT dialog). Five other compound sentences ARE split, each half separately testable, and each half keeps its own keyword, so splitting changes no total. (2) Six sentences appear verbatim more than once in the source and are extracted once per occurrence -- nineteen entries in all -- because each occurrence binds a different object: ''The exception to this is that the body or url MAY be absent if it is redacted'' at 4.3.10, 4.4.7 and 4.5.9; ''uuid: "String" (SHOULD be provided)'' at 5.2.2 and 5.3.1; ''Optional parameters: N/A; unrecognized parameters should be ignored'' in both media type registrations at 6.1 and 6.2; and the three registration-template rules that all four templates repeat verbatim -- the Change Controller rule, the Specification Document(s) rule and the relevant-sections rule -- at 6.3.1, 6.3.4.1.1, 6.3.5.1.1 and 6.4.1. The fourth template rule, on name case sensitivity, is also stated four times but is not a repeated text: each template gives it a different lead-in naming its own registry, and 6.3.4.1.1 additionally breaks ''case-insensitive'' across a line. Only the keyword-bearing repeats affect the count; all of the registration-template entries are verb none. (3) One occurrence is not a requirement at all and is recorded with verb none: section 4.5 writes ''a SHOULD support list of types'', using the capitalised keyword inside a noun phrase. BCP 14 does not sanction that use. It is counted because bin/bcp14-count counts it in the source, and dropping it would have made the two totals disagree for a reason no reconciliation could honestly state.'
reviewed_by: "nfnewbury 2026-10-14"
note: >
  Ids are stable and never reused. Cite as draft-ietf-vcon-vcon-core-04#R-NNNN;
  resolving yields locator, source_version, source_digest, verb and verbatim text.
  R-0001 through R-0033 keep the statements they named when this file was generated
  from distilled/fields.yaml. Texts were repaired, never retargeted. Sixteen of the
  thirty-three were not verbatim: fifteen (R-0009, R-0010, R-0012, R-0016, R-0017,
  R-0019, R-0020, R-0021, R-0024, R-0025, R-0026, R-0027, R-0028, R-0031, R-0033)
  had the draft's double quotes rewritten as single quotes, so "transfer" read
  'transfer'; those are restored. R-0005 held no source text at all -- it read
  "RFC 3339 date string per the Date base type, 2.2.", a paraphrase carrying no
  keyword -- and now holds the one MUST that 4.1.5 actually states, which is the
  statement its verb, locator and field always claimed; the 2.2 Date rule it
  paraphrased is carried on its own as R-0034. R-0001 and R-0007 were truncated
  mid-sentence and are completed. R-0033's field read "party_history Objects Array",
  the section title, and now reads the JSON name party_history. R-0034 onward are new. Entries are in SOURCE order, so the ids are not
  monotonic: R-0033 sits at its real home in 4.3.13, between R-0027 and R-0028.
  R-0220 onward were added by the pass-2 verifier: statements the first pass carried in
  normative.md but never registered as requirements -- the four extension-document
  sections of 2.5 that sit beside R-0051's MUST, its two lowercase redactor sentences,
  4.2.10's lowercase must on party uuid, 4.3.4's three [SMTP] mapping rules and its
  lowercase single-channel parties rule (R-0244, the twin of R-0136's MUST), 5.1's
  consumer-side hash check, the default-skip rule in both media type registrations, and
  the eleven registration-template rules that complete the four-by-four above. R-0245 to
  R-0247 complete 2.5's *Parameter Definitions* bullet at sentence level, and R-0248 and
  R-0249 carry the two mediatype exemptions that qualify R-0146 and R-0030 -- registered
  because a checker reading an obligation without its exemption fails every redacted and
  placeholder object. Every one is verb none, so no keyword total moves.
  This file is no longer generated. Under FX-1 requirements.yaml is a primary
  artifact read out of the source; the former generated_from/generated_by header is
  gone, because a field-centric table could only hold statements that attach to a
  field and so carried 34 of the 216 keywords. distilled/fields.yaml remains as its
  own artifact.
  Every text is one contiguous run of source characters with the draft line wrapping
  undone: a line break and the indent that follows it become one space, and nothing
  else is altered. No two non-adjacent passages are ever spliced. The draft breaks
  already-hyphenated words across lines, and those are NOT rejoined, because the
  whitespace-normalised source really does read "recording- set", "non- redacted",
  "Content- Type", "case- insensitive", "de- identification" and "party- identifying".
  This is a rule, not a habit: any entry whose text carries a split hyphen MUST say so
  in testable_note, so the next one cannot be forgotten. Six entries carry one today --
  R-0017, R-0028, R-0146, R-0178, R-0213 and R-0223 -- and each says so. Joining them
  would break the one invariant a verifier can check mechanically, that every text is a
  contiguous substring of the whitespace-normalised source; prose artifacts such as
  distilled/design-notes.md join instead, because they are read, not checked. That
  split is deliberate and is the resolution of pass-2 dispute D5.
  Entries with verb none carry lowercase obligations, applicability-table rows and
  registration rules that bind an implementer but use no BCP 14 keyword.
  The four IANA registration templates (6.3.1, 6.3.4.1.1, 6.3.5.1.1 and 6.4.1) each
  state the same four rules, and all sixteen are registered: one entry per occurrence,
  because each occurrence binds a different registry and a registrant filling in one
  template must resolve the rule under that template, not under another. The repetition
  in the ids is the source's repetition, not duplication.
  Every entry is kind stated: nothing here is inferred.

