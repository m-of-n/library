  - id: draft-ietf-vcon-vcon-core-04#R-0051
    object: 'Extension document'
    verb: MUST
    actor: 'extension author'
    locator: '§2.5'
    text: 'In addition to the standard sections of an Internet-Draft, a vCon extension document MUST also contain the following sections.'
    kind: stated
    testable: partial
    testable_note: 'Testable against an extension document, not against a vCon instance; the five required sections are enumerated in the bullets that follow.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0220
    object: 'Extension document'
    field: 'Extension Name'
    verb: none
    actor: 'extension author'
    locator: '§2.5'
    text: '* *Extension Name*: State the registered extensions token name for the extension. State whether and under what conditions the name appears in the extensions (Section 4.1.3) parameter, the critical (Section 4.1.4) parameter, or both. This is the name registered in the vCon Extensions Names Registry (Section 6.4) and the name against which implementations determine whether they support the extension.'
    kind: stated
    testable: no
    testable_note: 'One of the five sections R-0051 makes mandatory in a vCon extension document. Enforced by review of that document, not by inspecting a vCon instance. Four of the five bullets are carried whole, one entry each: this one, R-0221, R-0222 and R-0223. The fifth, *Parameter Definitions*, is carried as five sentence-level entries instead -- R-0052, R-0053, R-0245, R-0246 and R-0247 -- so its coverage matches the other four even though its shape does not. That difference is a consequence of id stability, not a style choice: R-0052 and R-0053 were minted at sentence level before the bullets were, and the only ways to make the fifth bullet look like the other four are to retarget those two ids or to add a whole-bullet entry whose text contains theirs. Retargeting is forbidden outright, and an entry that contains another lets one obligation be cited twice and counted twice, which is what makes an id mean a single statement. The asymmetry is the cheaper defect, and it is recorded here so a reader who notices it does not have to re-derive the reason.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0245
    object: 'Extension document'
    verb: none
    actor: 'extension author'
    locator: '§2.5'
    text: 'Define each new parameter, the level of the schema at which it appears, its value type, and its semantics.'
    kind: stated
    testable: no
    testable_note: 'A sentence-level entry in the *Parameter Definitions* bullet, matching R-0052 and R-0053. The other four bullets of §2.5 are carried whole; see R-0220 for why this one is not. Testable against an extension document, not against a vCon instance.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0246
    object: 'Extension document'
    verb: none
    actor: 'extension author'
    locator: '§2.5'
    text: 'For any existing parameter whose meaning or permitted values are redefined, state the new semantics and values.'
    kind: stated
    testable: no
    testable_note: 'A sentence-level entry in the *Parameter Definitions* bullet, matching R-0052 and R-0053. The other four bullets of §2.5 are carried whole; see R-0220 for why this one is not. Testable against an extension document, not against a vCon instance.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0247
    object: 'Extension document'
    verb: none
    actor: 'extension author'
    locator: '§2.5'
    text: 'For any deprecated parameter, state what is to be used in its stead and the migration approach.'
    kind: stated
    testable: no
    testable_note: 'A sentence-level entry in the *Parameter Definitions* bullet, matching R-0052 and R-0053. The other four bullets of §2.5 are carried whole; see R-0220 for why this one is not. Testable against an extension document, not against a vCon instance.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0052
    object: 'Extension document'
    verb: none
    actor: 'extension author'
    locator: '§2.5'
    text: 'Use the snake case naming convention for all parameter names, as opposed to camel case.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0053
    object: 'Extension document'
    verb: none
    actor: 'extension author'
    locator: '§2.5'
    text: 'Register each new parameter in the appropriate Object registry with IANA.'
    kind: stated
    testable: no
    testable_note: 'An action on IANA, outside anything a vCon instance can be checked against.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0221
    object: 'Extension document'
    field: 'Compatibility Considerations'
    verb: none
    actor: 'extension author'
    locator: '§2.5'
    text: '* *Compatibility Considerations*: Describe how the extension behaves in the presence of implementations that do not support it. Identify the parameters and semantics the extension introduces or changes, and explain for each why an implementation that does not recognize the extension can continue to process the vCon correctly by ignoring the additions, or state the conditions under which that holds. An extension that is *Compatible* under all conditions states so explicitly and justifies that claim.'
    kind: stated
    testable: no
    testable_note: 'One of the five sections R-0051 makes mandatory in a vCon extension document. Enforced by review of that document, not by inspecting a vCon instance.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0222
    object: 'Extension document'
    field: 'Incompatibility Considerations'
    verb: none
    actor: 'extension author'
    locator: '§2.5'
    text: '* *Incompatibility Considerations*: Demonstrate either that the extension introduces no incompatibilities, or enumerate each incompatibility that it does introduce. For each incompatibility, state the processing that is affected, for example redaction versus transcription, whether the extension name is therefore required in the critical (Section 4.1.4) parameter, and the behavior required of implementations that do not support the extension. An extension that claims to be *Compatible* uses this section to show why no incompatibility exists.'
    kind: stated
    testable: no
    testable_note: 'One of the five sections R-0051 makes mandatory in a vCon extension document. Enforced by review of that document, not by inspecting a vCon instance. This is the section that decides whether the extension name belongs in the critical (Section 4.1.4) parameter.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0223
    object: 'Extension document'
    field: 'Privacy and Integrity Considerations'
    verb: none
    actor: 'extension author'
    locator: '§2.5'
    text: '* *Privacy and Integrity Considerations*: Describe how the extension''s parameters interact with redaction and de- identification, including whether any of them can carry party- identifying data or PII and how a redactor is expected to handle them. State whether the extension introduces any new external content references, and if so, the integrity mechanism that protects them, such as Section 2.4.2.'
    kind: stated
    testable: no
    testable_note: 'One of the five sections R-0051 makes mandatory in a vCon extension document. Enforced by review of that document, not by inspecting a vCon instance. Verbatim under whitespace normalisation: the source breaks "de-identification" and "party-identifying" across lines, so the normalised text reads "de- identification" and "party- identifying".'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0054
    object: 'Extension'
    verb: SHOULD
    actor: 'extension author'
    locator: '§2.5'
    text: 'Wherever feasible, extensions *SHOULD* be designed as *Compatible* to preserve compatibility with existing implementations.'
    kind: stated
    testable: no
    testable_note: '"Wherever feasible" and the Compatible/Incompatible split are judgements the source itself calls subjective; no mechanical check exists.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0224
    object: 'Extension'
    verb: none
    actor: 'redactor'
    locator: '§2.5'
    text: 'On the other hand, a redactor must be aware of the implications of all parameters in the vCon to be sure to redact all of the objective information.'
    kind: stated
    testable: no
    testable_note: 'Lowercase "must". The draft states this obligation on a redactor with no BCP 14 keyword, in a passage whose own opening calls the question "a little subjective". distilled/design-notes.md cites it as evidence for ARCH-0002 P5, so it is registered to make that citation resolve to an id. Its weight is advisory; it is not carried as a MUST.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0225
    object: 'Extension'
    verb: none
    actor: 'redactor'
    locator: '§2.5'
    text: 'However the redactor perhaps should reject vCons with any extension that it does not support.'
    kind: stated
    testable: no
    testable_note: 'Lowercase and explicitly hedged - "perhaps should" - in the one place the draft drops its normative register while describing the must-understand mechanism. Registered so distilled/design-notes.md can cite it by id. The hedge is the reason it is not carried as a SHOULD.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0055
    object: 'vCon'
    field: 'critical'
    verb: MUST
    actor: 'producer'
    locator: '§2.5'
    text: 'However, when disruptive extensions are necessary, the names of all such extensions *MUST* be listed in the critical (Section 4.1.4) parameter of the vCon.'
    kind: stated
    testable: partial
    testable_note: 'Checkable only against a known list of disruptive extensions; a producer that omits an extension name cannot be caught from the instance alone.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0056
    object: 'vCon'
    field: 'critical'
    verb: MUST NOT
    actor: 'consumer'
    locator: '§2.5'
    text: 'Implementations that encounter a vCon containing a disruptive extension listed in the critical parameter, but do not support that extension, *MUST NOT* process the vCon except to reject it or notify the user.'
    kind: stated
    testable: partial
    testable_note: 'A behavioural requirement on the consumer: testable with a fixture carrying an unsupported critical extension, not from the vCon alone.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0057
    object: 'vCon'
    verb: none
    actor: 'implementation'
    locator: '§3'
    text: 'The JSON form of a vCon is contained in a JSON object in one of three forms: * unsigned * signed * encrypted'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0058
