  - id: draft-ietf-vcon-vcon-core-04#R-0130
    object: 'Dialog'
    field: 'mediatype'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.1.6'
    text: '(1) MUST be present for inline Dialog Content; optional for externally referenced Dialog Content when the media type is provided in the [HTTPS] Content-Type header; not required when Dialog Content is absent, such as in a placeholder Dialog Object or a redacted vCon.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0131
    object: 'Dialog'
    field: 'body, url'
    verb: MAY
    actor: 'producer'
    locator: '§4.3.1.6'
    text: '(2) body or url MAY be absent in a redacted vCon.'
    kind: stated
    testable: partial
    testable_note: 'Nothing in the instance marks it as redacted unless the redacted parameter is present.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0132
    object: 'Dialog'
    field: 'encoding'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.1.6'
    text: '(3) MUST be present when the body parameter is present and is not an empty string (see Inline Files (Section 2.3)).'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0133
    object: 'Dialog'
    field: 'content_hash'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.1.6'
    text: '(4) MUST be present when the url parameter is present (see Section 2.4.2).'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0018
    object: 'Dialog'
    field: 'start'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3.2'
    text: 'The start parameter SHOULD be present unless it is not known.'
    kind: stated
    testable: partial
    testable_note: '"unless it is not known" is not recorded, so absence can never be shown to be a violation.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0019
    object: 'Dialog'
    field: 'duration'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.3'
    text: '* duration: "UnsignedInt" | "UnsignedFloat" (optional) The value MUST be the dialog duration in seconds.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0134
    object: 'Dialog'
    field: 'parties'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3.4'
    text: 'The parties parameter SHOULD be present in "recording", "recording-set" and "text" type Dialog Objects.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0020
    object: 'Dialog'
    field: 'parties'
    verb: MUST NOT
    actor: 'producer'
    locator: '§4.3.4'
    text: 'The parties parameter MUST NOT be present in "transfer" type Dialog Objects (see Section 4.3.14).'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0244
    object: 'Dialog'
    field: 'parties'
    verb: none
    actor: 'producer'
    locator: '§4.3.4'
    text: 'Single channel recordings should have a parties value of the form: "UnsignedInt" or "UnsignedInt[]" where the integer value or array of integer values are the indices to the Party Object(s) in the parties array that contributed to the mix for the single channel recording.'
    kind: stated
    testable: yes
    testable_note: 'Lowercase "should", and the twin of R-0136, which states the multi-channel rule in the very next paragraph as a MUST. The draft states the single-channel case in lowercase and the multi-channel case in uppercase side by side; only the uppercase one was registered by the first pass. Exercised by the single-channel fixtures A.1, A.4 and A.5.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0135
    object: 'Dialog'
    field: 'parties'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3.4'
    text: 'The index for the Party Object SHOULD be included even if the indicated party was silent the entire piece of dialog.'
    kind: stated
    testable: no
    testable_note: 'Silence is not recorded in the vCon.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0136
    object: 'Dialog'
    field: 'parties'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.4'
    text: 'Multi-channel recordings MUST have a parties value that is an array of the same size as the number of channels in the recording.'
    kind: stated
    testable: partial
    testable_note: 'Requires decoding the referenced media to count channels.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0137
    object: 'Dialog'
    field: 'parties'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3.4'
    text: 'The index for Party Objects SHOULD be included even if the party was silent the entire conversation.'
    kind: stated
    testable: no
    testable_note: 'Silence is not recorded in the vCon.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0138
    object: 'Dialog'
    field: 'parties'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.4'
    text: 'If not all channels are used in a recording, such that no parties are recorded on one or more channels, a null placeholder MUST be inserted into the parties array for the corresponding channel.'
    kind: stated
    testable: partial
    testable_note: 'Requires decoding the referenced media to know which channels carry parties.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0139
    object: 'Dialog'
    verb: MAY
    actor: 'producer'
    locator: '§4.3.4'
    text: 'A recording-set Dialog Object MAY be used to represent the complete call or session.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0140
    object: 'Dialog'
    field: 'parties'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3.4'
    text: 'The parties parameter of a recording-set Dialog Object SHOULD contain all parties known to participate in the call or session, regardless of whether they contribute recorded media.'
    kind: stated
    testable: no
    testable_note: 'The full participant set is not knowable from the vCon.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0227
    object: 'Dialog'
    field: 'parties'
    verb: none
    actor: 'producer'
    locator: '§4.3.4'
    text: 'The From header should be the first party index in the parties parameter for the text Dialog Object.'
    kind: stated
    testable: yes
    testable_note: 'Lowercase "should". An [SMTP] header-to-parties mapping rule, exercised by the A.2 and A.3 email fixtures.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0228
    object: 'Dialog'
    field: 'parties'
    verb: none
    actor: 'producer'
    locator: '§4.3.4'
    text: 'The parties listed in the To, Cc and Bcc [SMTP] headers (if present) should all be added in that order to the parties parameter in the text Dialog Object.'
    kind: stated
    testable: yes
    testable_note: 'Lowercase "should". An [SMTP] header-to-parties mapping rule, exercised by the A.2 and A.3 email fixtures. R-0141 carries the SHOULD about Bcc policy that interrupts this run of lowercase rules.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0141
    object: 'Dialog'
    field: 'parties'
    verb: SHOULD
    actor: 'implementation'
    locator: '§4.3.4'
    text: 'The sender SHOULD be allowed to set a policy, through out of band means, as to whether they would like their application or server to include the Bcc parties in the vCon.'
    kind: stated
    testable: no
    testable_note: 'An out-of-band product policy; no artefact of it appears in the vCon.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0229
    object: 'Dialog'
    verb: none
    actor: 'producer'
    locator: '§4.3.4'
    text: 'A text Dialog Object should only contain a single [SMTP] message.'
    kind: stated
    testable: yes
    testable_note: 'Lowercase "should". Caps a text Dialog Object at one [SMTP] message; exercised by the A.2 and A.3 email fixtures.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0142
    object: 'Dialog'
    field: 'originator'
    verb: none
    actor: 'producer'
    locator: '§4.3.5'
    text: 'The originator parameter is only provided if the first party of the dialog Object parties list is NOT the originator.'
    kind: stated
    testable: no
    testable_note: 'Which party originated the dialog is not otherwise recorded.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0021
    object: 'Dialog'
    field: 'originator'
    verb: MUST NOT
    actor: 'producer'
    locator: '§4.3.5'
    text: 'The originator parameter MUST NOT be present in "transfer" type Dialog Objects (see Section 4.3.14).'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0143
    object: 'Dialog'
    field: 'recordings'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.6'
    text: 'The recordings parameter MUST be present in recording-set Dialog Objects.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0022
    object: 'Dialog'
    field: 'recordings'
    verb: MUST NOT
    actor: 'producer'
    locator: '§4.3.6'
    text: 'The recordings parameter MUST NOT be present in other Dialog Object types.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0144
    object: 'Dialog'
    field: 'recording_set'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3.7'
    text: '* recording_set: "UnsignedInt" (optional; SHOULD be present when the recording is part of a recording-set)'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0145
    object: 'Dialog'
    field: 'recording_set'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3.7'
    text: 'The recording_set parameter SHOULD be present when a recording Dialog Object is part of a recording-set Dialog Object.'
    kind: stated
    testable: partial
    testable_note: 'Membership of a recording-set is only discoverable from the recording-set Dialog Object''s recordings array, so this is checkable only across the pair.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0023
    object: 'Dialog'
    field: 'recording_set'
    verb: MUST NOT
    actor: 'producer'
    locator: '§4.3.7'
    text: 'The recording_set parameter MUST NOT be present in other Dialog Object types.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0146
    object: 'Dialog'
    field: 'mediatype'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.8'
    text: 'The mediatype parameter MUST be provided for inline dialog files and MUST be provided if the Content- Type header in the [HTTPS] response for the externally referenced URL is not provided.'
    kind: stated
    testable: partial
    testable_note: 'Two keywords in one sentence, kept together. The second half depends on an HTTPS response header, which is outside the document. Verbatim under whitespace normalisation: the source breaks "Content-Type" across a line, so the normalised text reads "Content- Type".'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0248
    object: 'Dialog'
    field: 'mediatype'
    verb: none
    actor: 'producer'
    locator: '§4.3.8'
    text: 'The mediatype parameter is not required when the Dialog Content is absent, such as in a placeholder Dialog Object or when the body and url have been redacted.'
    kind: stated
    testable: yes
    testable_note: 'An exemption, not an obligation, and registered because it is part of the rule rather than a comment on it: a conformance checker reading R-0146 alone flags every redacted object and every placeholder Dialog Object. Qualifies R-0146.'
    status: active
