    object: 'vCon'
    verb: SHOULD
    actor: 'producer'
    locator: '§5.4'
    text: 'The gzip compressed vCon SHOULD be identified by the media type "application/vcon+gzip" when a media type is available, such as in the [HTTPS] Content-Type header.'
    kind: stated
    testable: partial
    testable_note: 'Depends on the transport carrying a media type at all.'
    status: active
