  - id: draft-ietf-vcon-vcon-core-04#R-0195
    object: 'vCon'
    verb: MUST
    actor: 'producer'
    locator: '§5.3'
    text: 'A vCon MUST be signed first using JWS as defined in Signed Form of vCon Object (Section 5.2), then encrypted using JWE as opposed to just encrypted with integrity protection.'
    kind: stated
    testable: partial
    testable_note: 'Checkable after decryption: the JWE plaintext must be a JWS vCon.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0196
    object: 'vCon'
    verb: MUST
    actor: 'producer'
    locator: '§5.3'
    text: 'vCons may be stored in unencrypted form, but the signed form MUST be maintained to ensure its integrity.'
    kind: stated
    testable: partial
    testable_note: 'Checkable as "the stored form is the JWS form"; the integrity claim is the reason, not a separate check.'
    status: active
