    field: 'encoding'
    verb: MUST
    actor: 'producer'
    locator: '§2.3.2'
    text: 'This MUST be one of the following strings: * "base64url": The payload of the file has been Base64Url encoded and provided as the string value of the body parameter. * "json": The value of the body parameter is a JSON value (object, array, number, string, or one of the literals true, false, or null) as defined in [JSON]. * "none": The payload of the file is a valid JSON string and can be included without modification as the string value to the body parameter.'
