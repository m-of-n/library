    object: 'vCon'
    verb: none
    actor: 'consumer'
    locator: '§5.4'
    text: 'When no media type is available, a gzip compressed vCon can be identified by the gzip member header magic numbers defined in section 2.3.1 of [GZIP].'
    kind: stated
    testable: yes
    status: active
