  - id: draft-ietf-vcon-vcon-core-04#R-0001
    object: 'vCon'
    field: 'vcon'
    verb: MUST
    actor: 'producer'
    locator: '§4.1.1'
    text: 'For syntax defined in this document, the string MUST have the value: "0.4.0"'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0002
    object: 'vCon'
    field: 'uuid'
    verb: MUST
    actor: 'producer'
    locator: '§4.1.2'
    text: 'The UUID value MUST be globally unique. All vCon documents MUST have the uuid parameter and value set.'
    kind: stated
    testable: partial
    testable_note: 'Two adjacent sentences kept in one entry for id stability. Presence of uuid is checkable; global uniqueness is not checkable from one document.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0064
    object: 'vCon'
    field: 'uuid'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.1.2'
    text: 'The value of the string SHOULD be generated using the version 8 UUID defined in [UUID] which is generated identically to a version 7 UUID with the exception that: * rand_b/custom_c is generated from the high 62 bits of the SHA-1 hash of the FQHN string * the variant and version fields are set as described for version 8 UUID'
    kind: stated
    testable: partial
    testable_note: 'The version and variant bits are checkable; that rand_b came from the SHA-1 hash of an FQHN is not, without the FQHN.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0065
    object: 'vCon'
    field: 'uuid'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.1.2'
    text: 'The DNS name string used in generating the uuid value SHOULD be the same FQHN, or a subdomain to allow for more distributed generation of UUIDs, as would used in the signing certificate as they are the same domains of uniqueness.'
    kind: stated
    testable: no
    testable_note: 'Requires the signing certificate and the generating FQHN; not derivable from the uuid value.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0003
    object: 'vCon'
    field: 'extensions'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.1.3'
    text: 'The extensions parameter SHOULD contain the list of names of all vCon extensions for any parameters used that are not defined in this core vCon schema document.'
    kind: stated
    testable: no
    testable_note: 'Detecting an undeclared extension requires knowing every parameter the core schema defines AND that an unknown parameter is an extension rather than an error.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0004
    object: 'vCon'
    field: 'critical'
    verb: MUST
    actor: 'producer'
    locator: '§4.1.4'
    text: 'Implementations that include extensions which are incompatible with the core vCon schema MUST list the names of those extensions in the critical parameter.'
    kind: stated
    testable: partial
    testable_note: 'Needs an external list of which extensions are incompatible.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0066
    object: 'vCon'
    field: 'critical'
    verb: MUST NOT
    actor: 'consumer'
    locator: '§4.1.4'
    text: 'An implementation that does not recognize or support the extensions listed in the critical parameter MUST NOT attempt to process or operate on the vCon, except to reject it or report unsupported content.'
    kind: stated
    testable: partial
    testable_note: 'Behavioural requirement on the consumer; testable with a fixture, not from the document.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0005
    object: 'vCon'
    field: 'created_at'
    verb: MUST
    actor: 'producer'
    locator: '§4.1.5'
    text: 'The created_at parameter provides the creation time of this vcon, which MUST be present, and should not change once the vcon object is created.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0067
    object: 'vCon'
    field: 'updated_at'
    verb: MAY
    actor: 'producer'
    locator: '§4.1.6'
    text: 'The updated_at parameter provides the last modified time of this vcon, which MAY be present.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0068
    object: 'vCon'
    field: 'updated_at'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.1.6'
    text: 'For unsigned forms, the updated_at of the vcon object SHOULD be updated as it is modified.'
    kind: stated
    testable: partial
    testable_note: 'Needs two instance versions to compare.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0006
    object: 'vCon'
    field: 'updated_at'
    verb: MUST
    actor: 'signer'
    locator: '§4.1.6'
    text: 'Future updates MUST first set the updated_at to the new signing time as the vcon object is signed again.'
    kind: stated
    testable: partial
    testable_note: 'Checkable only against the signature time, which this document does not bind to updated_at by any other means.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0069
    object: 'vCon'
    field: 'redacted'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.1.8'
    text: 'A redacted vCon SHOULD provide a reference to the unredacted or prior, less redacted, vCon instance version of itself.'
    kind: stated
    testable: partial
    testable_note: 'Nothing in the schema marks a vCon as redacted, so the antecedent is not detectable from the instance.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0070
    object: 'Redacted'
    field: 'uuid'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.1.8'
    text: 'The Redacted Object (Section 4.1.8.1) SHOULD contain the uuid parameter'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0071
    object: 'Redacted'
    field: 'url, content_hash'
    verb: MAY
    actor: 'producer'
    locator: '§4.1.8'
    text: 'and MAY include the url, content_hash parameters (see Externally Referenced Files (Section 2.4)).'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0007
    object: 'Redacted'
    field: 'url'
    verb: MUST
    actor: 'producer'
    locator: '§4.1.8'
    text: 'If a reference to the unredacted vCon is provided in the url parameter, the access to that URL MUST be restricted to only those who should be allowed to see the identity or PII for the redacted vCon.'
    kind: stated
    testable: no
    testable_note: 'Access control on an external URL is outside the document; nothing in the vCon records it.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0072
    object: 'vCon'
    field: 'redacted'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.1.8'
    text: 'The assurance of the accuracy of the redaction is made by the entity that creates the redaction which SHOULD sign the redacted version of the vCon.'
    kind: stated
    testable: partial
    testable_note: 'Checkable as "the redacted vCon is in signed form"; the assurance itself is not mechanically checkable.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0073
    object: 'vCon'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.1.8'
    text: 'Data which is to be completely removed from the redacted version, that is contained in a JSON array in the unredacted vCon, SHOULD create an empty placeholder such that object array indices do not change for the rest of the elements of the array.'
    kind: stated
    testable: partial
    testable_note: 'Requires both the redacted and the less-redacted instance versions to compare array lengths and indices.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0074
    object: 'vCon'
    field: 'redacted'
    verb: none
    actor: 'producer'
    locator: '§4.1.8'
    text: '* redacted: "Redacted" (optional, mutually exclusive with amended parameter)'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0075
    object: 'Redacted'
    field: 'uuid'
    verb: none
    actor: 'consumer'
    locator: '§4.1.8.1'
    text: 'The absence of a value for uuid indicates that the less redacted version of this vCon is not available or does not exist.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0076
    object: 'Redacted'
    field: 'url, content_hash'
    verb: MAY
    actor: 'producer'
    locator: '§4.1.8.1'
    text: 'The the location of the referenced vCon MAY be provided as defined in Externally Referenced Files (Section 2.4) by including url and content_hash.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0077
    object: 'Redacted'
    field: 'content_hash'
    verb: MUST
    actor: 'producer'
    locator: '§4.1.8.1'
    text: 'content_hash MUST be included if url is provided.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0008
    object: 'vCon'
    field: 'amended'
    verb: MUST
    actor: 'producer'
    locator: '§4.1.9'
    text: 'In these cases, to allow for adding of additional information a new vCon instance version MUST be created.'
    kind: stated
    testable: partial
    testable_note: 'The obligation fires on an attempt to modify a signed or encrypted vCon, which is an act, not a state of a document.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0078
    object: 'Amended'
    field: 'uuid'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.1.9'
    text: 'The prior vCon instance version SHOULD be referenced via the uuid of the prior vCon instance version'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0079
    object: 'Amended'
    field: 'url, content_hash'
    verb: MAY
    actor: 'producer'
    locator: '§4.1.9'
    text: 'and MAY include the url and content_hash parameters (see Externally Referenced Files (Section 2.4)).'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0080
    object: 'vCon'
    field: 'amended'
    verb: none
    actor: 'producer'
    locator: '§4.1.9'
    text: '* amended: "Amended" (optional, mutually exclusive with redacted parameter)'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0081
    object: 'Amended'
    field: 'url, content_hash'
    verb: MAY
    actor: 'producer'
    locator: '§4.1.9.1'
    text: 'The location of the referenced vCon MAY be provided, as defined in Externally Referenced Files (Section 2.4) by including url and content_hash.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0082
    object: 'Amended'
    field: 'content_hash'
    verb: MUST
    actor: 'producer'
    locator: '§4.1.9.1'
    text: 'content_hash MUST be provided if url is provided.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0250
    object: 'vCon'
    field: 'dialog'
    verb: none
    actor: 'consumer'
    locator: '§4.1.11'
    text: 'It is the applications responsibility to sort dialog and transcriptions if they are needed in chronological order.'
    kind: stated
    testable: no
    testable_note: 'An obligation on the consuming application, not on the document, so no vCon can be found conforming or not by it. Registered because it is the only statement telling a consumer that array order carries no chronology, and a reader who assumes otherwise misreads every multi-dialog vCon.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0083
    object: 'Party'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.2'
    text: 'A Party Object SHOULD be created for each participant.'
    kind: stated
    testable: no
    testable_note: 'The set of participants is not knowable from the vCon.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0009
    object: 'Party'
    field: 'tel'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.2.1'
    text: '* tel: "String" (optional) The value of the tel parameter SHOULD be a valid [TEL] URL.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0010
    object: 'Party'
    field: 'mailto'
    verb: MAY
    actor: 'producer'
    locator: '§4.2.4'
    text: 'It MAY be provided in any common form, such as a bare address or a [MAILTO] URL; when a [MAILTO] URL is used, the "mailto:" scheme prefix is optional.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0084
    object: 'Party'
    field: 'name'
    verb: MAY
    actor: 'producer'
    locator: '§4.2.5'
    text: 'This MAY be indicated by creating a Party Object with only the name parameter and setting its value to "anonymous".'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0011
    object: 'Party'
    field: 'name'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.2.5'
    text: 'A Party Object SHOULD be create for each anonymous party in the conversation.'
    kind: stated
    testable: no
    testable_note: 'The number of anonymous parties is not knowable from the vCon.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0012
    object: 'Party'
    field: 'did'
    verb: MUST
    actor: 'producer'
    locator: '§4.2.6'
    text: '* did: "String" (optional) The value of the did parameter MUST be a valid DID URI that enables verifiable, decentralized digital identity for the party.'
    kind: stated
    testable: partial
    testable_note: 'DID URI syntax is checkable; that it resolves and is controlled by the party is not.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0013
    object: 'Party'
    field: 'validation'
    verb: SHOULD NOT
    actor: 'producer'
    locator: '§4.2.7'
    text: 'For confidentially reasons, it SHOULD NOT contain the data used to validate the name.'
    kind: stated
    testable: no
    testable_note: 'Whether a token is a label or the validation data itself cannot be told apart mechanically.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0085
    object: 'Party'
    field: 'validation'
    verb: MAY
    actor: 'producer'
    locator: '§4.2.7'
    text: 'However it MAY name the data used to validate the name (e.g. "SSN", "DOB", "user ID and password").'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0086
    object: 'Party'
    field: 'validation'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.2.7'
    text: '* validation: "String" (SHOULD be provided if name parameter is provided)'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0087
    object: 'Party'
    field: 'validation'
    verb: MAY
    actor: 'producer'
    locator: '§4.2.7'
    text: 'The value of the validation string MAY be "none" or enterprise or domain defined token or string values.'
    kind: stated
    testable: no
    testable_note: 'Open value space, defined per enterprise or domain.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0088
    object: 'Civicaddress'
    verb: MAY
    actor: 'producer'
    locator: '§4.2.9'
    text: 'The Civicaddress Object MAY contain any or all of the following parameters: country, a1, a2, a3, a4, a5, a6, prd, pod, sts, hno, hns, lmk, loc, flr, nam, pc as defined in section 2.2.1 of [GEOPRIV].'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0014
    object: 'Civicaddress'
    verb: MUST
    actor: 'producer'
    locator: '§4.2.9'
    text: 'Note that the parameter names MUST be in lower case when contained in the Civicaddress Object even though they are in upper case in [GEOPRIV].'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0226
    object: 'Party'
    field: 'uuid'
    verb: none
    actor: 'producer'
    locator: '§4.2.10'
    text: 'In a contact center, this is particularly important for the call agent participant, and must be static across interactions to allow correlation with the actual agent configuration provisioned into the systems.'
    kind: stated
    testable: partial
    testable_note: 'Lowercase "must", a real constraint on the Party Object uuid. R-0015 carries the MAY from the same paragraph; this is the obligation standing beside it. Testable only across vCons, where the same participant recurs.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0015
    object: 'Party'
    field: 'uuid'
    verb: MAY
    actor: 'producer'
    locator: '§4.2.10'
    text: 'Operators often have existing methods of generating unique participant identifiers and MAY use any unique string value.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0016
    object: 'Party'
    field: 'type'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.2.11'
    text: '* type: "String" (optional) The value of the type parameter SHOULD be one of the following: "person", "bot", "organization"'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0089
    object: 'Dialog'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3'
    text: 'Media captured in a media-based Dialog Object (type text and recording) SHOULD satisfy two constraints: the media is part of the conversation itself, and the media is transcribable.'
    kind: stated
    testable: no
    testable_note: '"part of the conversation" and "transcribable" are editorial judgements; the source says it may not even be known at construction time.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0090
    object: 'Dialog'
    verb: SHOULD NOT
    actor: 'producer'
    locator: '§4.3'
    text: 'While images such as sunsets, cows, photographs of documents, or application forms may be describable, they are not transcribable in a concise manner and SHOULD NOT be included as Dialog Objects.'
    kind: stated
    testable: no
    testable_note: 'Requires judging whether content is transcribable.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0091
    object: 'Attachment'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3'
    text: 'They SHOULD be included as Attachment Objects.'
    kind: stated
    testable: no
    testable_note: 'Same judgement as the statement it follows.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0092
    object: 'Attachment'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3'
    text: 'Media that is not transcribable SHOULD be included in the vCon as Attachment Objects rather than Dialog Objects.'
    kind: stated
    testable: no
    testable_note: 'Requires judging whether content is transcribable.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0093
    object: 'Dialog'
    verb: MAY
    actor: 'producer'
    locator: '§4.3'
    text: 'A letter faxed to the other party as the communication itself, such as a letter faxed to a doctor, is both transcribable and part of the conversation and MAY be included as a Dialog Object.'
    kind: stated
    testable: no
    testable_note: 'Role-of-the-document judgement.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0094
    object: 'Attachment'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3'
    text: 'The same letter shared or discussed within some other conversation is referenced material rather than the conversation itself and SHOULD be included as an Attachment Object, even though it is transcribable.'
    kind: stated
    testable: no
    testable_note: 'Role-of-the-document judgement.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0095
    object: 'Attachment'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3'
    text: 'Most other faxes and photographs SHOULD be included as Attachment Objects and SHOULD NOT be included as Dialog Objects.'
    kind: stated
    testable: no
    testable_note: 'Two keywords in one sentence, kept together: they are the two halves of one placement rule. Requires classifying the media.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0096
    object: 'Attachment'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3'
    text: 'Similarly, a musical recording, even if it is in MP3 audio format, SHOULD be included as an Attachment and SHOULD NOT be included as a Dialog Object.'
    kind: stated
    testable: no
    testable_note: 'Two keywords in one sentence, kept together. Requires classifying the media.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0097
    object: 'Dialog'
    field: 'type'
    verb: MUST
    actor: 'producer'
    locator: '§4.3'
    text: 'As the consultative call is a call, a placeholder Dialog Object for it MUST be of type "recording" if the call was set up, or of type "incomplete" if it was not.'
    kind: stated
    testable: partial
    testable_note: 'Whether the call was set up is not recorded anywhere in the vCon.'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0017
    object: 'Dialog'
    field: 'type'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.1'
    text: '* type: "String" The string MUST have the value of either "recording", "recording- set", "text", "transfer" or "incomplete".'
    kind: stated
    testable: partial
    testable_note: 'Verbatim under whitespace normalisation: the source breaks "recording-set" across a line, so the normalised text reads "recording- set".'
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0104
    object: 'Dialog'
    verb: none
    actor: 'implementation'
    locator: '§4.3.1.6'
    text: 'The parameter definitions in the subsections of this document are definitive; this table is provided as a summary.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0098
    object: 'Dialog'
    verb: MUST
    actor: 'producer'
    locator: '§4.3.1.6'
    text: 'M The parameter MUST be present.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0099
    object: 'Dialog'
    verb: SHOULD
    actor: 'producer'
    locator: '§4.3.1.6'
    text: 'S The parameter SHOULD be present.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0100
    object: 'Dialog'
    verb: none
    actor: 'producer'
    locator: '§4.3.1.6'
    text: 'O The parameter is optional.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0101
    object: 'Dialog'
    verb: SHOULD NOT
    actor: 'producer'
    locator: '§4.3.1.6'
    text: 'SN The parameter SHOULD NOT be present.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0102
    object: 'Dialog'
    verb: MUST NOT
    actor: 'producer'
    locator: '§4.3.1.6'
    text: 'X The parameter MUST NOT be present.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0103
    object: 'Dialog'
    verb: MAY
    actor: 'producer'
    locator: '§4.3.1.6'
    text: '- The parameter has no defined meaning for this type; it MAY be present but its semantics are undefined.'
    kind: stated
    testable: yes
    status: active
  - id: draft-ietf-vcon-vcon-core-04#R-0105
    object: 'Dialog'
