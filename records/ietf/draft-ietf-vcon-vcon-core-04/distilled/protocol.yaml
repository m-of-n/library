guard_strength:
  finding: >-
    Every flow above is overwhelmingly advisory, and the one MUST that matters
    cannot be checked by either of the draft's formal schemas. Counts were
    re-derived over the source with word-boundary matching, MUST NOT
    subtracted from MUST. The full per-section table is in
    distilled/state-machine.yaml under guard_strength; what follows is the
    protocol-relevant subset.
  by_flow:
    - flow: external-content-retrieval
      strength: "MUST on the carriage, none on the check"
      detail: >-
        Section 2.4 is the hardest section in this flow - 4 MUST and 0 SHOULD
        across lines 543-585 - and all four constrain what a PRODUCER puts in
        the vCon: url and content_hash MUST be present, HTTPS MUST be used,
        SHA-512 MUST be supported. Section 5.1, which is what a CONSUMER does
        with them, has 0 MUST and 1 SHOULD across lines 2655-2671, and the
        verification-ordering sentence itself is lowercase "should be
        verified". So the obligation to CARRY integrity data is MUST and the
        obligation to CHECK it is not even a SHOULD.
    - flow: export-from-security-domain
      strength: "MUST ordering, SHOULD trigger"
      detail: >-
        Signing is never required: "it SHOULD be signed or encrypted by the
        domain that constructed it" (4), "Before a vCon leaves a security
        domain, it SHOULD be signed" (5), "Any time a vCon is shared outside
        its original security domain, it SHOULD be signed and optionally
        encrypted" (5). The MUST appears only once you have chosen to do both
        - sign before encrypt (5.3) - and once as a channel condition, "vCons
        transported over non-secure channels such as email MUST be in the
        encrypted form" (5).
    - flow: consume-received-vcon
      strength: "MUST only at the admission step"
      detail: >-
        Section 5.4, the whole recognise-the-form procedure, contains ZERO
        MUST and one SHOULD across lines 2881-2939, even though the document
        calls it necessary. Steps 3 and 4, decrypt and verify, rest on SHOULD
        (5.2.2, 5.3.1). Only step 5, the critical-extension admission, is
        MUST NOT - and it is the only step with a defined failure exit. The
        pattern holds across the whole document: where there is a MUST there
        is an error path, and where there is a SHOULD there is none.
    - flow: derive-new-instance-version
      strength: "MUST that a new version exists, SHOULD that it is linked"
      detail: >-
        "a new vCon instance version MUST be created" (4.1.9) is a MUST. The
        back-reference that makes it a chain is SHOULD on both sides - "A
        redacted vCon SHOULD provide a reference" (4.1.8), "The prior vCon
        instance version SHOULD be referenced via the uuid" (4.1.9). The
        mutual exclusion of the two parameters carries no BCP 14 keyword at
        all. A conforming producer can emit an unbroken succession of
        amendments that link to nothing.
    - flow: long-term-archive
      strength: NONE
      detail: >-
        Section 5.2.3 contains ZERO BCP 14 keywords of any kind across lines
        2755-2804, and introduces itself as "an approach". The document's only
        answer to signing-certificate expiry is entirely non-normative.

formal_schema_coverage:
  consequence_for_this_artifact: >-
    The single MUST-guarded ordering in the document - sign, then encrypt -
    is not expressible in either schema the document ships, so no validator
    derived from them can detect the violation. Appendix B covers the unsigned
    form only; its own title is "vCon - Unsigned Form". Appendix C covers all
    three but as a flat union, "vcon = unsigned_vcon_type / signed_vcon_type /
    encrypted_vcon_type", in which payload and ciphertext are both
    base64url_value_type and base64url_value_type = tstr. Containment is typed
    away to a plain string, so an encrypted-but-never-signed vCon validates
    cleanly against the draft's own CDDL. Full treatment, with the verbatim
    productions, is in distilled/state-machine.yaml under
    formal_schema_coverage.
  also_absent_from_both: >-
    The Section 4.3.1.6 applicability table. Appendix B states its own limit -
    "SHOULD-level statements are not enforced by this schema." (source line
    8351) - and Appendix C states its own - the extension wildcard "(* tstr =>
    any)" makes the per-type prohibitions advisory. Both schemas are
    informative; the prose governs.

cross_references:
  state_machine: "distilled/state-machine.yaml"
  prose_and_diagrams: "distilled/protocol.md"
  requirements_wired:
    - id: "draft-ietf-vcon-vcon-core-04#R-0004"
      used_by: "consume-received-vcon step 5"
    - id: "draft-ietf-vcon-vcon-core-04#R-0007"
      used_by: "derive-new-instance-version step 5"
    - id: "draft-ietf-vcon-vcon-core-04#R-0008"
      used_by: "derive-new-instance-version step 2"
  requirements_not_yet_wired: >-
    requirements.yaml held 33 field-derived entries when this pass ran and
    covers nothing from 2.4, 2.5, 5.1, 5.2, 5.2.3, 5.3 or 5.4. Every step in
    external-content-retrieval, export-from-security-domain,
    consume-received-vcon and long-term-archive therefore cites the source
    directly. The cross-check pass must wire them once those sections are
    extracted.
