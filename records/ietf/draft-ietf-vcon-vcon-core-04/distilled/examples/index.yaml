    harness_expects:
      - "Parses as JSON. The smallest complete vCon in the set at 762 bytes - the fixture to use for a round-trip or canonicalisation test."
      - "It is also the payload of A.6. A harness should assert that base64url-decoding a6.payload and parsing it yields a document EQUAL to this fixture. That is checked here and passes."
      - "content_hash is the single-token form, not the array form. 2.4.2 allows either; only the token form appears anywhere in this document, so the array branch of ContentHash[] has no fixture in the source at all."
      - "The digest cannot be verified without ab_call.mp3, which this library does not hold. Structure is verified instead."
    checks:
      - id: CHK-A4-PARSE
        result: pass
        what: "fixture parses as JSON"
        computed: "json.load succeeds; 762 bytes"
      - id: CHK-A4-UUID-V8
        result: pass
        what: "4.1.2 SHOULD: uuid is a version 8 UUID"
        computed: "01a07da8-c2bb-83e5-b9a2-279e0d16bc46 -> version 8, variant b. uuid version nibble is 8 and variant bits are 10 (RFC 4122), as 4.1.2 SHOULD"
      - id: CHK-A4-PARTY-INDEX
        result: pass
        what: "dialog[].parties indices fall inside the top-level parties array"
        computed: "dialog[0].parties = [0, 1]; len(parties) = 2; both in range"
      - id: CHK-A4-HASH-STRUCT
        result: pass
        what: "the content_hash token is shaped as 2.2 requires: algorithm, hyphen, base64url digest"
        computed: "token is sha512-GLy6IPaIUM1GqzZqfIPZlWjaDsNgNvZM0iCONNThnH0a75fhUM6cYzLZ5GynSURREvZwmOh54-2lRRieyj82UQ ; algorithm token sha512; separator is one hyphen; the remaining 86 characters are base64url with no padding and decode to exactly 64 octets, which is the SHA-512 digest length the draft specifies in 2.2 and 2.4.2. Note the digest itself contains a hyphen - the base64url 62nd character - so a naive split on '-' finds four fields, not two. Split on the FIRST hyphen only."
      - id: CHK-A4-HASH-ALG-TOKEN
        result: fail
        what: "2.2 MUST: \"Hash algorithm identifiers MUST use only lowercase letters, and they MUST NOT contain hyphen characters\""
        computed: "the algorithm identifier is sha512, which contains the digits 5, 1 and 2. isalpha() is False."
        finding: "SOURCE DEFECT, an internal contradiction rather than a typo. 2.2 says in the same paragraph that \"The hash algorithm is identified by 'sha512'\" and that identifiers MUST use only lowercase LETTERS. Every content_hash in Appendix A - A.4, A.5, A.8, A.9 - fails the MUST as written. The constraint was inherited from section 6 of [STIR-PASS], which the draft copies 'to remove the normative dependency'; the copy kept a sentence the draft's own identifier does not satisfy. An implementation that enforces the MUST literally rejects every example in the document. The repair is one word - letters -> characters, or lowercase alphanumerics - and it is not ours to make."
      - id: CHK-A4-HASH-VALUE
        result: not-determinable
        what: "does the digest match the content at the url"
        computed: "the referenced file is https://github.com/ietf-wg-vcon/draft-ietf-vcon-vcon-core/raw/refs/heads/main/examples/ab_call.mp3 . This library never fetches or commits a third-party document, so the bytes are not here and the SHA-512 cannot be compared. What IS established: the digest decodes to 64 octets, the correct length, and the same token appears identically in A.4, A.5, A.8 and A.9 - four copies, byte-identical, so no transcription error between them. To complete this check, fetch ab_call.mp3, take SHA-512 per 6.3/6.4 of [SHA-512], base64url-encode without padding, and compare to GLy6IPaIUM1GqzZqfIPZlWjaDsNgNvZM0iCONNThnH0a75fhUM6cYzLZ5GynSURREvZwmOh54-2lRRieyj82UQ"
      - id: CHK-A4-URL-HTTPS
        result: pass
        what: "2.4.1 MUST: the url is an HTTPS URL"
        computed: "https://github.com/ietf-wg-vcon/draft-ietf-vcon-vcon-core/raw/refs/heads/main/examples/ab_call.mp3 - scheme is https"
      - id: CHK-A4-UUID-UNIQUE
        result: fail
        what: "4.1.2 MUST: \"The UUID value MUST be globally unique\""
        computed: "01a07da8-c2bb-83e5-b9a2-279e0d16bc46 is the uuid of this fixture AND of A.5, which is a DIFFERENT unsigned vCon: A.5 is this document with one Analysis Object added, and the two differ in nothing else. Verified by comparing the two fixtures with analysis removed from both: they are equal."
        finding: "SOURCE DEFECT, and the most consequential one in the set. COUNTED PRECISELY AT PASS 2, because the number matters if this is filed: the string occurs SEVEN times as a JSON value in Appendix A - A.4.uuid, A.5.uuid, A.6.payload's uuid, A.6.signatures[0].header.uuid, A.7.unprotected.uuid, A.8.redacted.uuid and A.9.amended.uuid. Four printed documents bear it as their own identifier (A.4, A.5, A.6, A.7) and two reference it (A.8, A.9). Of the four bearers, THREE are licensed to share it: 5.4 makes unsigned, signed and encrypted forms three forms of one vCon, and A.6's payload base64url-decodes to a JSON document deep-equal to the A.4 fixture (not byte-equal - 579 octets against 762 - but the same document), so A.4/A.6 are demonstrably one vCon and A.7 is presumptively its encrypted form. The violation is the FOURTH: A.5 is a different document carrying the same uuid. 4.1.9 says a vCon that gains data MUST become a new vCon instance version referenced through amended; A.5 gains an Analysis Object and does neither. So the one identifier that 4.1.8 and 4.1.9 rely on to link versions resolves ambiguously inside this very document. See design-notes; this is the vCon analogue of the identity question DEC-005 and R-M-11 turn on."

  - id: VCON-A5
