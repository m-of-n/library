# --------------------------------------------------------------------
# Added at pass 3, the cross-check. This check had never been run: no JSON
# Schema implementation was installed when pass 2 ran, and pass 2 said so
# rather than claiming a result.
schema_validation:
  run: "pass 3, 2026-10-14"
  tool: "python jsonschema 4.26.0 with the format-nongpl extras, in a throwaway virtualenv outside this repository. Nothing was installed globally and this repository remains dependency-free."
  schema: "distilled/schema/vcon.derived.schema.json - Appendix B with its 89 string-internal line breaks closed, draft-07, accepted by Draft7Validator.check_schema"
  scope_warning: "Appendix B's own title is \"vCon - Unsigned Form\" and its top-level required list is [uuid, created_at]. It models the UNSIGNED form only. A signed or encrypted vCon therefore cannot validate against it, and a failure for that reason is a statement about the schema's coverage, not about the fixture."
  result: "9 JSON fixtures. SEVEN validate with ZERO errors - A.1, A.2, A.3, A.4, A.5, A.8 and A.9. TWO fail, each with exactly two errors and both the same two: A.6 and A.7 have neither uuid nor created_at at top level, because A.6 is a JWS and A.7 a JWE. No fixture produced any other error. The three .txt fixtures are object-tree diagrams and are not schema-validatable."
  the_signed_payload_checked_separately: "A.6's payload was base64url-decoded and the enclosed vCon validated on its own: ZERO errors, and deep-equal to the A.4 fixture. So A.6's content is conformant and only its JOSE wrapper is unmodelled - which locates the gap in the schema rather than in the example."
  format_assertion: "draft-07 treats `format` as an annotation, so this was run twice. The schema uses three formats - uuid (3 uses), date-time (5), uri (5) - and NONE of the three has a checker in jsonschema's default draft-07 set, so an unaugmented run asserts nothing. Re-run with rfc3339-validator and rfc3986-validator installed and a uuid checker registered by hand: ZERO additional errors on all ten documents, including the decoded A.6 payload. Recorded because a format pass that was never actually performed is worse than none."
  negative_controls: "A clean pass means nothing unless the schema bites, so seven controls were run. Six mutations were REJECTED as they should be: a recording Dialog carrying `transferee`; a recording Dialog carrying `recordings` (both Table 1 X cells, enforced through Appendix B's 14 if/then chains); `redacted` and `amended` together; a vCon with no `uuid`; `vcon` set to 0.3.0 against the const 0.4.0; `duration` as a string. The seventh, unmodified A.1, was ACCEPTED. The validation is live."
  what_this_check_cannot_see: "Every source defect this file records survives it, and none of them is re-opened by the clean result. Appendix B has no JOSE vocabulary at all, so it cannot see A.6's protected/header collision on alg and x5c, A.7's three-way enc collision, or A.7's recipient header carrying no alg - that last being a failure against the draft's own Appendix C CDDL, not against Appendix B. It cannot see the sha512 lowercase-letters contradiction of 2.2, which is a rule about a token's spelling that the schema types as a plain string. It cannot see the A.4/A.5 uuid collision, which is a cross-document fact. And it cannot see A.8's redaction incoherence, which is about what the content MEANS. All three JOSE defects were re-derived from the fixture bytes at this pass and reproduce exactly: A.6 protected and header share {alg, x5c}; A.7's protected, unprotected and recipients[0].header all carry enc with the same value, which RFC 7516 section 7.2.1 forbids - \"The Header Parameter names in the three locations MUST be disjoint.\"; A.7's recipients[0].header carries enc and nothing else."
  not_run: "No CDDL validator exists in this environment, so neither types.cddl (verbatim Appendix C) nor types.derived.cddl has been run against the fixtures by a real parser. The Appendix C findings in this file were derived by reading, as they were at pass 2."

# ====================================================================
# Where the examples are, and where the old note said they were
# ====================================================================
#
# The record README has said since 2026-09 that `examples/` was empty and
# that the examples live in "section 7". Section 7 is "Non-Upward Compatible
# Changes to the vCon Container", a version-migration log, and prints no
# example. Every worked example in this document is in Appendix A, source
# lines 4047-6726, nine complete vCons. Three further examples - two labelled
# figures and one unlabelled illustration - are in the body at 968-1002,
# 1069-1099 and 2778-2789. Sections 1-6 print no inline JSON at all: a sweep
# for a JSON key-value pair (a quoted name followed by a colon and a quoted
# value) over lines 1-4046 returns zero hits. Section 2.2 defines a notation
# (Date, String, UnsignedInt, Mediatype, ContentHash, SessionId) rather than
# giving examples of it; section 6 is registry tables and a media type
# registration template.
#
# ====================================================================
# How the fixture bytes were derived from the printed page
# ====================================================================
#
# The fixtures are the source's characters. Two presentation transforms the
# RFC text format applies were reversed, and nothing else was touched. The
# recipe is deterministic, so any verifier can re-derive each file and get
# the sha256 recorded below.
#
#   1. PAGE FURNITURE REMOVED. Inside each line range, every line matching
#      one of
#          ^Petrie\s+Expires .*\[Page \d+\]\s*$
#          ^\x0c\s*$
#          ^Internet-Draft\s+JSON vCon\s+September \d{4}\s*$
#      and every empty line, is dropped. The empty lines are safe to drop
#      without inspection in these ranges and this was checked rather than
#      assumed: every page break in Appendix A is exactly three empty lines,
#      the running footer, a bare form feed, the running header and two empty
#      lines, and a scan found ZERO empty lines in any of the nine JSON
#      ranges that were not inside such a cluster. A pretty-printed JSON
#      document contains no empty lines of its own. The 48 whitespace-only
#      but non-empty lines in Appendix A are all bare form feeds, so no
#      continuation line was lost to the formatter trimming it to nothing.
#
#   2. UNIFORM LEFT MARGIN REMOVED. Every Appendix A JSON block sits at a
#      three-space margin; the minimum indent over the whole block is 3 in
#      all nine. Three characters are removed from every line. Relative
#      indentation is untouched.
#
#   3. LINE WRAPPING UNDONE. Appendix A opens by saying "The vCons have been
#      formatted such that long text lines have been wrapped with a left hand
#      white space indent for readability purposes", and links an unwrapped
#      copy of each example. The wrap is reversed by the only rule that is
#      decidable from the text: a line that ENDS INSIDE AN OPEN JSON STRING
#      is continued by the next line, because [JSON] forbids a literal line
#      terminator inside a string, so an unterminated string at end-of-line
#      can only be a wrap. The continuation carries exactly two spaces more
#      than the line on which the string opened; those two are removed and
#      everything after them is content.
#
#      The two-space rule is measured, not assumed. Across 833 rejoins in
#      the nine examples, ZERO continuation lines carried less than the
#      expected indent, and A.3 proves the rule has teeth: its dialog[1] and
#      dialog[2] bodies are quoted email text whose own leading spaces sit
#      on top of the wrap indent, at 12, 13 and 14 columns where the wrap
#      indent is 11. Stripping all leading whitespace would silently eat
#      those spaces. They survive here.
#
#      The rule is also confirmed from outside: A.6's `payload` is the
#      base64url of A.4, and it decodes to a JSON document equal to the A.4
#      fixture, and A.6's RS256 signature cryptographically verifies over
#      the rejoined `protected` and `payload` strings. A single wrong
#      character anywhere in them would break both.
#
#      PASS 2 made these numbers exact, because pass 1 attributed the whole
#      fixture's rejoin count to the payload alone. The rejoins that the
#      cryptographic checks actually depend on are 131, not 231: `payload`
#      is one wrapped string needing 12 rejoins, `protected` needs 119, and
#      the remaining 100 of A.6's 231 are the three x5c certificates (40,
#      30, 24) and the `signature` string (6). The signing input is
#      `protected` + "." + `payload` = 6822 + 1 + 772 = 7595 characters,
#      every one of which has to be right for openssl to return Verified OK,
#      and it does. `payload` decodes to 579 octets, which parse to a
#      document deep-equal to the 762-byte A.4 fixture - the same document,
#      not the same bytes, since the two are serialised with different
#      whitespace.
#
# The three diagram fixtures needed only step 2; no furniture and no wrap
# falls inside their ranges, and each is a strict margin-stripped copy.
#
# ====================================================================
# Conventions
# ====================================================================
#
#   source_lines   first and last line of the fixture's block in the cached
#                  source, inclusive, 1-based, INCLUDING the furniture that
#                  was removed
#   sha256         of the fixture file as written, including its final newline
#   form           unsigned | signed | encrypted | redacted | amended | diagram
#   checks         every consistency check run against this fixture, each with
#                  result: pass | fail | not-determinable, and the computed
#                  value. A check that could not be run is recorded, not
#                  dropped - see `not-determinable` entries.
#   finding        marks a check whose result is a defect or a deviation in
#                  the SOURCE. Nothing was repaired; the fixture is as printed.
#
# Nothing in `fixtures[].checks[].computed` is in the source. Every one of
# those values was computed here from the fixture bytes.

fixtures:
  - id: VCON-A1
    file: "a1-two-party-call-inline-recording.json"
    title: "Two Party Call vCon With Inline Recording"
    source_section: "Appendix A.1"
    source_lines: "4067-4317"
    sha256: "126652aefde93e64a2346ce305d435e672d281536cc6bb6ad3b3dd83fa9bceca"
    bytes: 10883
    form: unsigned
    furniture_lines_removed: 40
    wrapped_lines_rejoined: 180
    exercises:
      - "vCon top level: created_at, parties, dialog, analysis, attachments, uuid"
      - "Party Object: tel, name"
      - "Dialog Object type recording: start, duration, parties, mediatype, filename, encoding, body"
      - "Inline Files (2.3): encoding base64url with the payload in body"
    harness_expects:
      - "Parses as JSON. 24 top-level-reachable scalar values, 2 parties, 1 dialog, empty analysis and attachments."
      - "dialog[0].body decodes as base64url (no padding) to 7730 octets of RIFF/WAVE audio."
      - "The decoded WAV is self-consistent: the RIFF size field says 7722 and the file is 7730 octets, which is 7722 + 8. A harness can assert this without the original file."
      - "No content_hash anywhere: 2.4 requires url and content_hash only for EXTERNALLY stored files, and this one is inline. A harness must not demand content_hash on an inline dialog."
      - "The ONLY example in the set that carries real media inline. It is the fixture to use for the inline/external branch of Dialog Content (4.3.10)."
    checks:
      - id: CHK-A1-PARSE
        result: pass
        what: "fixture parses as JSON"
        computed: "json.load succeeds; 10883 bytes"
      - id: CHK-A1-UUID-V8
        result: pass
        what: "4.1.2 SHOULD: uuid is a version 8 UUID"
        computed: "01a07da3-661d-89b0-b9a2-279e0d16bc46 -> version nibble 8, variant nibble b (10xx). uuid version nibble is 8 and variant bits are 10 (RFC 4122), as 4.1.2 SHOULD"
      - id: CHK-A1-PARTY-INDEX
        result: pass
        what: "dialog[].parties indices fall inside the top-level parties array"
        computed: "dialog[0].parties = [0, 1]; len(parties) = 2; both in range"
      - id: CHK-A1-BODY-B64
        result: pass
        what: "body is well-formed base64url for the declared encoding"
        computed: "10307 characters, charset [A-Za-z0-9_-] only, no padding, decodes to 7730 octets"
      - id: CHK-A1-RIFF
        result: pass
        what: "the decoded inline body is a self-consistent RIFF/WAVE file"
        computed: "magic RIFF....WAVE; RIFF size field = 7722; file length - 8 = 7722; match"
      - id: CHK-A1-CONTENT-HASH
        result: not-determinable
        what: "does content_hash match the inline content"
        computed: "no content_hash is present on this dialog, so there is nothing to reconcile. Recorded for completeness: sha512 of the decoded body, base64url, is Re9R7UWKaD7yN9kxoYLbFFNSKU8XfH18NFbTc3AgT4_aBubMtvGUEtRmP6XUxSS3Nl4LU-1mOCtezoTHQ67cVQ ; sha256 hex is 04d95f674b980e207c9fa8a92be38f93f78ed59521842dcad73d41faa221e366. The draft specifies SHA-512, 6.3/6.4 of [SHA-512], base64url encoded, prefixed by the algorithm token and a hyphen (2.2, 2.4.2)."
      - id: CHK-A1-UUID-TS
        result: pass
        what: "informational: the time prefix of the version 8 uuid against created_at"
        computed: "uuid time prefix decodes to 2026-09-07T20:50:55.645Z; created_at is 2022-06-21T13:53:00-04:00. They differ by four years and that is correct behaviour - created_at is when the conversation was created and the uuid is generated when the vCon is. A harness must NOT correlate them. Contrast A.2 and A.3, where they agree to 10 ms."
      - id: CHK-A1-VCON-PARAM
        result: pass
        what: "4.1.1 vcon syntax version parameter"
        computed: "absent, as in all nine examples. 4.1.1 DEPRECATES the parameter, so its absence is correct and a harness must not require it."

  - id: VCON-A2
    file: "a2-email-thread-multipart.json"
    title: "Email Thread Multipart vCon"
    source_section: "Appendix A.2"
    source_lines: "4329-4469"
    sha256: "a7a9caa18dc2ced5088151b8772049dc721a401375b588dca46cc6a9a5418744"
    bytes: 5448
    form: unsigned
    furniture_lines_removed: 16
    wrapped_lines_rejoined: 80
    exercises:
      - "Party Object: mailto, name"
      - "Dialog Object type text: message_id, mediatype with parameters, encoding none"
      - "Inline Files (2.3): encoding none with a non-JSON payload carried as a JSON string"
      - "subject"
    harness_expects:
      - "Parses as JSON. 2 parties, 2 dialogs, both multipart MIME bodies carried whole inside a JSON string."
      - "The MIME boundary in each body matches the boundary parameter in that dialog's mediatype - check this, it is the only place in the set where a parameter inside one field has to agree with the bytes of another."
      - "parties[0] is BOB and parties[1] is ALICE. A.3 is the other way round. A harness that hardcodes party 0 = Alice from A.1 will pass A.1 and fail here, which is the point of keeping both."
      - "mediatype carries a folded MIME header, LF followed by TAB, inside the value. See CHK-A2-MEDIATYPE: a conforming media type parser will reject it."
    checks:
      - id: CHK-A2-PARSE
        result: pass
        what: "fixture parses as JSON"
        computed: "json.load succeeds; 5448 bytes"
      - id: CHK-A2-UUID-V8
        result: pass
        what: "4.1.2 SHOULD: uuid is a version 8 UUID"
        computed: "01a07dfb-fe0b-89ee-b9a2-279e0d16bc46 -> version 8, variant b. uuid version nibble is 8 and variant bits are 10 (RFC 4122), as 4.1.2 SHOULD"
      - id: CHK-A2-PARTY-INDEX
        result: pass
        what: "dialog[].parties indices fall inside the top-level parties array"
        computed: "dialog[0].parties = [0, 1]; dialog[1].parties = [1, 0]; len(parties) = 2; all in range"
      - id: CHK-A2-BOUNDARY
        result: pass
        what: "the MIME boundary inside body matches the boundary parameter of mediatype"
        computed: "dialog[0]: boundary ----=_Part_388314_1108189513.1663969465698 ; body opens with --<boundary>, closes with --<boundary>--, 3 occurrences. dialog[1]: boundary ----=_Part_390234_811845464.1663969499935 ; same, 3 occurrences. Both agree."
      - id: CHK-A2-MEDIATYPE
        result: fail
        what: "2.2 Mediatype is type \"/\" subtype per 5.1 of [MIME]"
        computed: "both mediatype values contain a literal newline and tab: 'multipart/mixed; \n\tboundary=\"...\"' and 'multipart/alternative; \n\tboundary=\"...\"'. These are RFC 5322 folded header lines that were stored without unfolding. Unfolded they are valid: 'multipart/mixed; boundary=\"----=_Part_388314_1108189513.1663969465698\"'."
        finding: "SOURCE DEFECT. A media type value may not contain a line terminator. The folding is an artefact of the email header the example was built from; 2.2 defines Mediatype by reference to section 5.1 of [MIME], which has no folding. Every consumer that compares mediatype to a literal, or splits it on ';' and trims, will see a value no other example has. Not repaired here."
      - id: CHK-A2-MSGID
        result: fail
        what: "RFC 5322 3.6.4: a Message-ID is a globally unique identifier for one message"
        computed: "dialog[0].message_id = <1126698042.388315.1663969465698@mail.yahoo.com> is also A.3 dialog[1].message_id, on a different message with a different body and a start time 1h50m later. dialog[1].message_id = <2031327240.390235.1663969499936@mail.yahoo.com> is also A.3 dialog[0] AND A.3 dialog[2]."
        finding: "SOURCE DEFECT, shared with A.3. Two Message-IDs are reused across three distinct messages between the two examples. See CHK-A3-MSGID for the within-example case, which is worse."
      - id: CHK-A2-UUID-TS
        result: pass
        what: "informational: the uuid time prefix against created_at"
        computed: "uuid time prefix 2026-09-07T22:27:41.707Z against created_at 2026-09-07T22:27:41.697+00:00 - they agree to 10 ms. The opposite of A.1, A.4, A.5 and A.9."
      - id: CHK-A2-ENCODING
        result: pass
        what: "2.3 encoding: none means the payload is a valid JSON string included without modification"
        computed: "encoding is none on both dialogs and both bodies are JSON strings carrying CRLF-separated MIME text. Consistent."

  - id: VCON-A3
    file: "a3-email-thread-text.json"
    title: "Email Thread Text vCon"
    source_section: "Appendix A.3"
    source_lines: "4490-4569"
    sha256: "4821bfcc2ece02e0d1abe084e86e59b246dd93fe592ad810b4f3ba091f8e9476"
    bytes: 1924
    form: unsigned
    furniture_lines_removed: 8
    wrapped_lines_rejoined: 14
    exercises:
      - "Dialog Object type text with plain bodies and an explicit charset parameter"
      - "message_id"
      - "three dialogs, interleaved party order"
    harness_expects:
      - "Parses as JSON. 2 parties, 3 dialogs."
      - "THE WRAP-FIDELITY FIXTURE. Its bodies are quoted email text whose own leading spaces sit on top of the RFC's wrap indent. dialog[1].body must contain the exact run '\n \n  Hi Bob:\n  I just wanted' and dialog[2].body the run '\n   \n    Hi Bob:\n    I just wanted'. Any de-furnishing that strips leading whitespace from continuation lines collapses those and the fixture silently loses data."
      - "dialog starts are strictly increasing: 23:24:59, 23:34:32, 23:38:12."
      - "The quoted reply text inside dialog[1].body names 23:24:59, which is dialog[0].start. The quoted text inside dialog[2].body names '23:34:' - the seconds are missing where dialog[1].start says 23:34:32."
    checks:
      - id: CHK-A3-PARSE
        result: pass
        what: "fixture parses as JSON"
        computed: "json.load succeeds; 1924 bytes"
      - id: CHK-A3-UUID-V8
        result: pass
        what: "4.1.2 SHOULD: uuid is a version 8 UUID"
        computed: "01a07e00-0ecc-81db-b9a2-279e0d16bc46 -> version 8, variant b. uuid version nibble is 8 and variant bits are 10 (RFC 4122), as 4.1.2 SHOULD"
      - id: CHK-A3-PARTY-INDEX
        result: pass
        what: "dialog[].parties indices fall inside the top-level parties array"
        computed: "dialog[0].parties = [0, 1]; dialog[1].parties = [1, 0]; dialog[2].parties = [0, 1]; len(parties) = 2; all in range"
      - id: CHK-A3-MSGID
        result: fail
        what: "RFC 5322 3.6.4: a Message-ID is a globally unique identifier for one message"
        computed: "dialog[0].message_id and dialog[2].message_id are the SAME string, <2031327240.390235.1663969499936@mail.yahoo.com>, on two different messages in ONE vCon: 'Hi Bob: I just wanted to follow up' at 23:24:59 and 'Awesome!' at 23:38:12."
        finding: "SOURCE DEFECT, and the sharpest one in the set. A single vCon assigns one Message-ID to two of its three dialogs. Anything that keys a message by message_id - deduplication, threading, a database unique index - breaks on the document's own example. The third message's own id, which A.2 shows belongs to the 'Awesome!' reply chain, is nowhere in A.3."
      - id: CHK-A3-ORDER
        result: pass
        what: "dialog start times are monotonic"
        computed: "2022-09-23T23:24:59.000+00:00 < 23:34:32.000+00:00 < 23:38:12.000+00:00"
      - id: CHK-A3-QUOTE-TIME
        result: fail
        what: "the timestamps quoted inside the reply bodies against the dialog start times they refer to"
        computed: "dialog[1].body quotes 'On Friday, September 23, 2022, 23:24:59 PM UTC' and dialog[0].start is 23:24:59 - agrees. dialog[2].body quotes 'On Friday, September 23, 2022, 23:34: PM UTC' and dialog[1].start is 23:34:32 - the seconds field is empty."
        finding: "Cosmetic SOURCE DEFECT inside the example's body text: '23:34:' has a trailing colon and no seconds, and '23:24:59 PM' uses a 24-hour clock with a PM suffix. Carried verbatim; a harness should treat body text as opaque and not parse it."
      - id: CHK-A3-UUID-TS
        result: pass
        what: "informational: the uuid time prefix against created_at"
        computed: "2026-09-07T22:32:08.140Z against 2026-09-07T22:32:08.133+00:00 - agree to 7 ms."

