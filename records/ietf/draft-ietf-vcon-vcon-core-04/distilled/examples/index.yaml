        finding: "SOURCE DEFECT, and the source says so itself: A.5 opens with an editorial note that the diarization in the transcript is to be fixed. This is the machine-checkable form of that note - a harness can assert len(distinct speakers) < len(dialog[0].parties) and watch it fail in a later draft when the example is regenerated. The note is an editorial marker left in a document in IETF Last Call; it is not an erratum against a published RFC. Recorded because the fixture is otherwise usable and a reader who skips the prose will take the speaker labels at face value."
