        finding: "SOURCE DEFECT. A.5 is A.4 plus one Analysis Object - verified by removing `analysis` from both fixtures and comparing: equal. Under 4.1.9 the added analysis makes a new vCon instance version, which SHOULD carry its own uuid and reference the prior one through `amended`. A.5 does neither. A.9 is the example that does it correctly, which makes the contrast inside one appendix the clearest evidence of the problem."
      - id: CHK-A5-PARTY-INDEX
        result: pass
        what: "dialog[].parties indices fall inside the top-level parties array"
