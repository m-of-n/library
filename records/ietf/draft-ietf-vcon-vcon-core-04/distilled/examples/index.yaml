  - id: VCON-A6
    file: "a6-signed-vcon.json"
    title: "Signed vCon (JWS General JSON Serialization over A.4)"
    source_section: "Appendix A.6"
    source_lines: "5732-6020"
    sha256: "562c391e189e1772d7bb3b591beff7c1e5197a37e09cec0d44611b0a8021e39b"
    bytes: 13283
    form: signed
    furniture_lines_removed: 40
    wrapped_lines_rejoined: 231
    exercises:
      - "5.2 Signed Form: payload, signatures"
      - "5.2.1 Signature Object: header, protected, signature"
      - "5.2.2 Header Object: alg, x5c, uuid"
      - "RFC 7515 General JWS JSON Serialization"
    harness_expects:
      - "Parses as JSON. The one fixture in the set whose correctness can be settled by arithmetic rather than by reading: its signature verifies."
      - "base64url-decode payload, parse, and assert deep equality with the A.4 fixture. This passes."
      - "Verify the RS256 signature over the ASCII string protected + '.' + payload using the RSA public key in signatures[0].header.x5c[0]. This passes - see CHK-A6-SIGVERIFY. It makes A.6 and A.4 self-validating fixtures: a harness that mangles either one will find out."
      - "signatures[0].header and the decoded protected header BOTH carry alg and x5c, with equal values. RFC 7515 7.2.1 requires the two header locations to be disjoint, so a strict JWS library will refuse this document."
      - "The protected header declares typ: JWT. The payload is a vCon, not a JWT claims set."
    checks:
      - id: CHK-A6-PARSE
        result: pass
        what: "fixture parses as JSON"
        computed: "json.load succeeds; 13283 bytes"
      - id: CHK-A6-PAYLOAD-B64
        result: pass
        what: "payload is well-formed base64url"
        computed: "772 characters, charset [A-Za-z0-9_-] only, no padding, decodes to 579 octets"
      - id: CHK-A6-PAYLOAD-EQ-A4
        result: pass
        what: "the payload decodes to the A.4 vCon"
        computed: "579 octets, first two bytes 0x7b 0x22 so it is plain JSON and not the gzipped alternative 5.2 permits. Parsed and compared element by element with a4-two-party-call-external-recording.json: EQUAL, including key order and the uuid. This is simultaneously a check on the source and a proof that 233 line rejoins across the two fixtures were done correctly."
      - id: CHK-A6-SIGVERIFY
        result: pass
        what: "the RS256 signature verifies over protected + '.' + payload with the key in x5c[0]"
        computed: "Public key recovered from the leaf certificate's SubjectPublicKeyInfo: RSA, modulus 2048 bits, exponent 65537. s^e mod n yields a PKCS#1 v1.5 EM: 00 01 FF...FF 00 followed by the DigestInfo header 3031300d060960864801650304020105000420 for SHA-256. Recovered digest eff4bcac0dac92244b4e1634c92e59a2f3fc2e31143cdd8f46b8f49309b3f994 equals SHA-256 of the 7595-byte ASCII signing input. THE SIGNATURE IS VALID. Done from first principles with integer arithmetic, no crypto library, so it is reproducible anywhere."
      - id: CHK-A6-SIG-LEN
        result: pass
        what: "the signature length agrees with the key size and the declared algorithm"
        computed: "342 base64url characters, 256 octets, equal to the 2048-bit modulus length, as RS256 requires"
      - id: CHK-A6-ALG
        result: pass
        what: "5.2.2 SHOULD: alg is RS256"
        computed: "signatures[0].header.alg is RS256 and the decoded protected header's alg is RS256. Both."
      - id: CHK-A6-X5C-REQUIRED
        result: pass
        what: "5.2.2 MUST: the Header Object includes alg and either x5c or x5u"
        computed: "alg and x5c are both present in signatures[0].header. x5u is absent, which the either/or permits."
      - id: CHK-A6-JOSE-DISJOINT
        result: fail
        what: "RFC 7515 7.2.1 MUST: the Header Parameter names in the protected and unprotected header locations are disjoint"
        computed: "decoded protected header keys are [alg, typ, x5c]; signatures[0].header keys are [x5c, alg, uuid]. alg and x5c appear in BOTH, with equal values (x5c compared element by element: identical)."
        finding: "SOURCE DEFECT, and a structural one rather than a typo. 5.2.2 of the draft requires alg and x5c/x5u in the UNPROTECTED Header Object; the generator also put them in the protected header, where RS256 signing normally puts alg. RFC 7515 7.2.1 says the names in the two locations MUST be disjoint, so a conforming JWS implementation rejects this document before it ever checks the signature - which, as CHK-A6-SIGVERIFY shows, is valid. The draft has engineered a requirement that cannot be met by a JWS library that signs in the usual way, because an RS256 signer puts alg in the protected header and the draft demands it in the unprotected one. Either 5.2.2 should say 'protected header', or it should say that alg is NOT to be repeated. Carry this into design notes: it is a worked case of a profile adding a MUST that collides with its own normative reference."
      - id: CHK-A6-TYP
        result: fail
        what: "RFC 7519 1: typ JWT names a JWT, whose payload is a JSON claims set"
        computed: "the protected header declares typ: JWT while the payload is a vCon document with keys created_at, parties, dialog, analysis, attachments, uuid and no JWT claim whatever."
        finding: "SOURCE DEFECT, mild. The draft says nothing about typ, so nothing in it is violated; but a JOSE library that dispatches on typ will route this to a JWT claims validator and reject it. 5.3.1 defines cty for the encrypted form and no companion typ for the signed form, which is where the gap comes from."
      - id: CHK-A6-X5C-DER
        result: pass
        what: "each x5c entry is standard base64 of a DER certificate, per RFC 7515 4.1.6"
        computed: "three entries of 1308, 1640 and 2124 characters. Charset is standard base64 (contains + and /), NOT base64url - correct for x5c and a deliberate contrast with every other string in the file. They decode to 981, 1229 and 1591 octets, each beginning 30 82, a DER SEQUENCE."
      - id: CHK-A6-X5C-CHAIN
        result: pass
        what: "the certificate chain links: each certificate's issuer is the next certificate's subject"
        computed: "x5c[0] subject CN=grp.div.fakevcon.io, issuer CN=div.fakevcon.io. x5c[1] subject CN=div.fakevcon.io, issuer CN=fakevcon.io. x5c[2] subject CN=fakevcon.io, issuer CN=fakevcon.io, self-signed root. Both links hold on the full Distinguished Name, not just the CN."
      - id: CHK-A6-X5C-V1
        result: fail
        what: "RFC 5280 6.1.4: a CA certificate asserts basicConstraints CA, and a v1 or v2 certificate must be verified as a CA out of band or rejected"
        computed: "x5c[0] and x5c[1] are X.509 VERSION 1 certificates - no [0] EXPLICIT version field, six tbsCertificate children, serial number 1 on both, and NO extensions at all: no basicConstraints, no keyUsage, no subjectAltName, no subject key identifier. x5c[2] is v3 and carries 2.5.29.14, 2.5.29.35 and 2.5.29.19. So the intermediate that signs the leaf asserts no CA bit."
        finding: "Defect in the EXAMPLE's test certificates, not in the draft. A conforming RFC 5280 path validator must reject or out-of-band-accept x5c[1]; an implementer who copies these certificates to bootstrap a test suite gets a chain that cannot be validated. The draft links the private key as a 'fake' key, so the certificates are understood to be throwaway - but 5.2.2 argues that x5c exists precisely so the chain travels with the vCon, and this chain does not survive the journey."
      - id: CHK-A6-X5C-SAN
        result: fail
        what: "RFC 5280 4.2.1.6: subjectAltName is a certificate EXTENSION, OID 2.5.29.17"
        computed: "all three certificates carry OID 2.5.29.17 as an ATTRIBUTE TYPE inside the subject and issuer Distinguished Names, with values grp.div.fakevcon.org, div.fakevcon.org and fakevcon.org. 2.5.29.17 is not a directory attribute type and has no place in a Name. x5c[2], the only v3 certificate, has extensions 2.5.29.14, 2.5.29.35 and 2.5.29.19 and NO 2.5.29.17 extension - so the intended SAN was mis-encoded into the DN in all three."
        finding: "Defect in the EXAMPLE's test certificates. Any relying party looking for a SAN finds none. It also undercuts 4.1.2's claim that the uuid's FQHN is 'the same FQHN ... as would [be] used in the signing certificate': the certificate names a domain only in its CN and in a malformed RDN."
      - id: CHK-A6-UUID-V8
        result: pass
        what: "4.1.2 SHOULD, applied to signatures[0].header.uuid"
        computed: "01a07da8-c2bb-83e5-b9a2-279e0d16bc46 -> version 8, variant b"
      - id: CHK-A6-UUID-MATCH
        result: pass
        what: "5.2.2: the header uuid SHOULD be verified against the uuid in the signed vCon"
        computed: "signatures[0].header.uuid equals the uuid inside the decoded payload. Both are 01a07da8-c2bb-83e5-b9a2-279e0d16bc46. This is the one uuid consistency check the draft asks for by name, and the example passes it."
      - id: CHK-A6-CERT-VALIDITY
        result: pass
        what: "informational: the certificate validity windows"
        computed: "x5c[0] 2022-06-04 to 2032-06-01; x5c[1] and x5c[2] 2022-05-29 to 2032-05-26. All three are inside their window on the 2026-09 publication date, so a harness that checks notAfter will not start failing until 2032."

  - id: VCON-A7
    file: "a7-encrypted-vcon.json"
    title: "Encrypted vCon (JWE General JSON Serialization over the A.6 signed form)"
    source_section: "Appendix A.7"
    source_lines: "6034-6403"
    sha256: "9e0a85404e7cfad359e811f7af4b841774c5143871d77e54202fdadecf92ffcb"
    bytes: 18365
    form: encrypted
    furniture_lines_removed: 56
    wrapped_lines_rejoined: 295
    exercises:
      - "5.3 Encrypted Form: unprotected, recipients, iv, ciphertext, tag"
      - "5.3.1 Unprotected Object: cty, enc, uuid"
      - "5.3.2 Recipient Object: header, encrypted_key"
      - "RFC 7516 General JWE JSON Serialization"
    harness_expects:
      - "Parses as JSON. 18365 bytes, the largest fixture."
      - "All four base64url members decode to the lengths A256CBC-HS512 and RSA-OAEP imply: iv 16 octets, tag 32 octets, encrypted_key 256 octets, ciphertext 13184 octets which is 824 whole AES blocks."
      - "The ciphertext cannot be decrypted - no private key is published for the encryption, only for the signing - so what the ciphertext contains is established by length rather than by decryption. See CHK-A7-CIPHERTEXT-SIZE: it matches the A.6 signed form to the octet."
      - "It carries a top-level `protected` member that neither 5.3 nor the draft's own CDDL names. See CHK-A7-PROTECTED-UNDEFINED."
      - "recipients[0].header carries enc and NOT alg, which inverts 5.3.3 and fails the draft's own CDDL."
    checks:
      - id: CHK-A7-PARSE
        result: pass
        what: "fixture parses as JSON"
        computed: "json.load succeeds; 18365 bytes"
      - id: CHK-A7-PROTECTED-DECODE
        result: pass
        what: "the protected header is well-formed base64url and decodes to a JSON object"
        computed: "eyJhbGciOiJSU0EtT0FFUCIsImVuYyI6IkEyNTZDQkMtSFM1MTIifQ decodes to {\"alg\": \"RSA-OAEP\", \"enc\": \"A256CBC-HS512\"}"
      - id: CHK-A7-PROTECTED-UNDEFINED
        result: fail
        what: "5.3 enumerates the members of the encrypted form, and the Appendix C CDDL types it"
        computed: "5.3 lists unprotected, recipients, iv, ciphertext and tag. encrypted_vcon_type in Appendix C lists the same five plus extension_parameters_type. The example's top-level keys are protected, iv, ciphertext, tag, recipients, unprotected - `protected` is in the example and in neither list. Note the asymmetry: the JWS side does define it, signature_object_type carries protected: base64url_value_type."
        finding: "SOURCE DEFECT. 5.3 says the encrypted form 'takes the General JWE JSON Serialization Syntax form as defined in section 7.2.1 of [JWE]', and RFC 7516 7.2.1 defines `protected` as a member of exactly that serialization - so the member is normatively required by the reference the section invokes and absent from the section's own enumeration and from the CDDL. The example is right and the specification text is incomplete. Three consequences worth separating: a validator built from the 5.3 prose list rejects the document's own example; a validator built from the CDDL accepts `protected` only through the extension_parameters_type catch-all (* tstr => any), which means it is admitted as an unregistered extension rather than as the core JOSE member it is, and 2.5 would then expect it declared in `extensions`; and an implementer reading only 5.3 will not know where the content encryption algorithm is authenticated. Independently reported by the sibling pass lifting Appendix C and confirmed here against both the prose and the CDDL."
      - id: CHK-A7-RECIPIENT-ALG
        result: fail
        what: "5.3.3 and the CDDL recipient_header_object_type: the Recipient Header Object has alg, SHOULD be RSA-OAEP"
        computed: "recipients[0].header has exactly one key, enc, with value A256CBC-HS512. There is no alg anywhere in the recipient header; the alg RSA-OAEP sits in the top-level protected header instead. recipient_header_object_type = { alg: tstr, extension_parameters_type } makes alg NON-optional, so the example FAILS the draft's own CDDL."
        finding: "SOURCE DEFECT, and the only place in Appendix A where an example is refused by the draft's own formal schema rather than by its prose. Two errors in one object: the required member is missing and a member defined elsewhere (enc, 5.3.1, on the Unprotected Object) is present in its place. RFC 7516 does permit alg in the protected header when there is a single recipient, so the example is valid JWE on this point and invalid vCon."
      - id: CHK-A7-JOSE-DISJOINT
        result: fail
        what: "RFC 7516 7.2.1 MUST: the Header Parameter names in the three locations are disjoint"
        computed: "enc appears in all three: the protected header, the shared unprotected header, and recipients[0].header. All three values are A256CBC-HS512, so they agree, but the names are not disjoint."
        finding: "SOURCE DEFECT. Note how it arises: 5.3.1 requires enc on the Unprotected Object, the JWE encrypter puts enc in the protected header because that is where it is authenticated, and the generator additionally copied it into the recipient header. The same collision between a vCon MUST and a JOSE MUST that CHK-A6-JOSE-DISJOINT records on the signed side. Two independent instances of one design fault: the draft specifies WHICH header a JOSE parameter goes in without saying that it must then be absent from the others."
      - id: CHK-A7-CTY
        result: fail
        what: "5.3.1 SHOULD: cty is application/vcon or application/vcon+gzip"
        computed: "unprotected.cty is application/vcon+json, which is neither. The media type section 6 registers is application/vcon, with application/vcon+gzip in 6.2; application/vcon+json is registered nowhere in this document and appears exactly once in it, in this example."
        finding: "SOURCE DEFECT. The example names a media type the document does not define, where the document's own SHOULD offers two that it does. If the +json suffix is wanted it has to be registered; if not, the example should say application/vcon."
      - id: CHK-A7-ENC
        result: pass
        what: "5.3.1 SHOULD: enc is A256CBC-HS512"
        computed: "A256CBC-HS512 in all three places it appears"
      - id: CHK-A7-SIZES
        result: pass
        what: "the member lengths agree with the declared algorithms"
        computed: "iv 22 base64url characters -> 16 octets, the AES-CBC block size. tag 43 characters -> 32 octets, the HS512 tag truncated to 256 bits as A256CBC-HS512 specifies. encrypted_key 342 characters -> 256 octets, an RSA-OAEP encryption under a 2048-bit key, matching the signing key size in A.6. ciphertext 17579 characters -> 13184 octets, exactly 824 AES blocks with no remainder. Every length is what the declared algorithms require."
      - id: CHK-A7-CIPHERTEXT-SIZE
        result: pass
        what: "5.3 MUST: a vCon is signed first, then encrypted, so the plaintext is the signed form"
        computed: "the ciphertext is 13184 octets. The A.6 signed vCon serialized the way its generator serialized it - Python json.dumps defaults, ', ' and ': ' separators - is 13172 octets, and PKCS#7 padding to the next 16-octet boundary adds 12, giving 13184. EXACT MATCH. With the compact separators it would be 13157 and pad to 13168, which does not match, so the match is informative rather than a coincidence of rounding: it identifies the serialization as well as the content. This is as close as one gets to confirming the MUST without the decryption key."
      - id: CHK-A7-CIPHERTEXT-DECRYPT
        result: not-determinable
        what: "does the ciphertext decrypt to the A.6 signed vCon"
        computed: "no private key is published for the encryption. A.6 links a signing key at https://raw.githubusercontent.com/vcon-dev/vcon/main/certs/fake_grp.key and A.7 links nothing. The library does not fetch third-party documents, and the recipient key is not in the draft in any case. Settled by length instead - see CHK-A7-CIPHERTEXT-SIZE - and recorded here as a check that cannot be closed from the document alone."
      - id: CHK-A7-UUID-V8
        result: pass
        what: "4.1.2 SHOULD, applied to unprotected.uuid"
        computed: "01a07da8-c2bb-83e5-b9a2-279e0d16bc46 -> version 8, variant b"
      - id: CHK-A7-UUID-MATCH
        result: not-determinable
        what: "5.3.1: the unprotected uuid SHOULD be verified when the vCon is decrypted"
        computed: "unprotected.uuid equals the uuid in A.4, A.5 and A.6's header, so it is coherent with the chain. Whether it equals the uuid inside the ciphertext cannot be checked without decrypting. The check the draft asks for is precisely the one that needs the key."
      - id: CHK-A7-FORM-DISCRIMINATION
        result: pass
        what: "5.4: the presence of ciphertext and recipients identifies the encrypted form"
        computed: "both present; no parties, dialog, analysis or attachments; no payload or signatures. The 5.4 discrimination rule gives a unique answer for this fixture, and for all nine - see the README table."

  - id: VCON-A8
    file: "a8-redacted-vcon.json"
    title: "Redacted vCon"
    source_section: "Appendix A.8"
    source_lines: "6419-6596"
    sha256: "82fd821dd0a594478302e825c650ff31fd34ff2ad5a354e8ffa38d5b575217f6"
    bytes: 4184
    form: redacted
    furniture_lines_removed: 24
    wrapped_lines_rejoined: 3
    exercises:
      - "4.1.8 redacted and 4.1.8.1 Redacted Object: uuid, type"
      - "4.3.10: a Dialog Object whose url is absent because it was redacted"
      - "redaction of a Party Object in place, preserving array indices"
      - "an Analysis Object whose body is an ARRAY of utterances"
    harness_expects:
      - "Parses as JSON. The only fixture carrying a Redacted Object."
      - "parties keeps two entries and each keeps name while tel is gone. Indices are preserved, which is what 4.1.8 asks for so that dialog[].parties keeps pointing at the right party."
      - "dialog[0] has content_hash and filename but NO url and NO body. That is legal - see CHK-A8-DIALOG-CONTENT - and it is the ONLY fixture exercising that branch."
      - "analysis[0].body is a JSON ARRAY of 18 utterance objects, each { parties, start, duration, text }. Note `parties` here is a scalar index, not an array, unlike Dialog Object parties. A harness must handle both shapes."
      - "Its text is the A.5 transcript with three substitutions. Pair the two fixtures to test a redaction pipeline end to end."
    checks:
      - id: CHK-A8-PARSE
        result: pass
        what: "fixture parses as JSON"
        computed: "json.load succeeds; 4184 bytes"
      - id: CHK-A8-UUID-V8
        result: pass
        what: "4.1.2 SHOULD: uuid is a version 8 UUID"
        computed: "01928e10-193e-8231-b9a2-279e0d16bc46 -> version 8, variant b. uuid version nibble is 8 and variant bits are 10 (RFC 4122), as 4.1.2 SHOULD"
      - id: CHK-A8-REDACTED-UUID-V8
        result: pass
        what: "4.1.8.1: the redacted uuid is a vCon uuid"
        computed: "01a07da8-c2bb-83e5-b9a2-279e0d16bc46 -> version 8, variant b"
      - id: CHK-A8-LINK
        result: pass
        what: "redacted.uuid names a vCon that exists in this document"
        computed: "it equals the uuid of A.4, of A.5, of A.6's signature header and of A.7's unprotected header. The link resolves."
      - id: CHK-A8-LINK-AMBIGUOUS
        result: fail
        what: "4.1.8: the Redacted Object identifies THE prior, less redacted vCon"
        computed: "CORRECTED AT PASS 2 - pass 1 wrote 'SIX things' and then listed five, importing the six-USES count of CHK-A4-UUID-UNIQUE into a resolves-to context. The honest count: the uuid is borne by four printed documents (A.4, A.5, A.6, A.7), but 5.4 licenses three of those to share one identifier as three forms of one vCon, so the reference is ambiguous between exactly TWO distinct contents - A.4's (printed unsigned at A.4 and signed at A.6, whose payload decodes to it) and A.5's (A.4 plus one Analysis Object). Two is smaller than six and is the number that survives scrutiny; it is still one more than a unique identifier permits. Nothing in the example says which. 5 says the non-redacted version referenced from a redacted vCon MUST be encrypted so that only the authorised can decrypt it, which points at A.7 - but A.4 and A.5 are printed unencrypted in the same appendix under the same uuid, so the MUST is defeated by the document that states it."
        finding: "SOURCE DEFECT, downstream of CHK-A4-UUID-UNIQUE. The Redacted Object has url and content_hash available to disambiguate and uses neither, so uuid is the whole of the reference and the uuid is not unique. Sharper still: A.8's redacted analysis is derived from A.5's transcript (CHK-A8-REDACTION-CONTENT), so the SEMANTICS point at A.5, while the section 5 MUST that the non-redacted version be encrypted points at A.7, whose content cannot be checked without the key. The two pointers disagree and the identifier cannot adjudicate between them. This is the single most useful finding in the set for our own design: a reference by identifier alone is only as good as the uniqueness of the identifier, and here the document's own examples break it."
      - id: CHK-A8-REDACTED-HASH
        result: not-determinable
        what: "do the uuid and hash in the Redacted Object cohere with each other"
        computed: "there is no hash. redacted has exactly two members, uuid and type ('PII Redaction'); url and content_hash are both absent. 4.1.8.1 makes them optional and says content_hash MUST be included if url is provided - with no url, nothing is required and nothing can be reconciled. So the one cross-document integrity check the Redacted Object was designed to support has no fixture anywhere in this draft."
      - id: CHK-A8-PARTY-INDEX
        result: pass
        what: "dialog[].parties indices fall inside the top-level parties array after redaction"
        computed: "dialog[0].parties = [0, 1]; len(parties) = 2; both in range. The redaction emptied the party objects' tel but kept the array length, exactly as 4.1.8 asks."
      - id: CHK-A8-ANALYSIS-PARTY-INDEX
        result: pass
        what: "the scalar parties index on each analysis utterance is in range"
        computed: "all 18 utterances carry parties: 0; len(parties) = 2; in range. Note they are ALL 0 - every utterance is attributed to Alice, including 'My name is Bob'. The single-speaker diarization of A.5 is carried into the redacted analysis."
      - id: CHK-A8-ANALYSIS-DIALOG-INDEX
        result: pass
        what: "4.5.2: analysis[].dialog indexes the dialog array"
        computed: "analysis[0].dialog = 0; len(dialog) = 1; in range"
      - id: CHK-A8-ANALYSIS-TYPE
        result: fail
        what: "4.5.1 SHOULD: analysis type is one of report, sentiment, summary, transcript, translation, tts"
        computed: "type is transcript-redacted, which is not in the list of six."
        finding: "SOURCE DEFECT, minor but worth keeping: 4.5.1 gives a SHOULD list and the document's own redaction example steps outside it, with no registry to extend - 6.3.7 registers Analysis Object PARAMETER names, not type values, so unlike the Dialog Type Name Registry of 6.3.4.1 there is no mechanism by which transcript-redacted could ever become registered. Either the list wants a registry or the example wants type: transcript."
      - id: CHK-A8-DIALOG-CONTENT
        result: pass
        what: "4.3.10: the Dialog Object SHOULD have body+encoding or url+content_hash"
        computed: "dialog[0] has content_hash and filename, and neither url nor body. 4.3.10 states the exception explicitly: 'the body or url MAY be absent if it is redacted', and lists url as '(optional in a redacted vCon)'. So this is conforming, and it is the only fixture that exercises the exception. Recorded as a PASS against a rule that looks like a failure until the sentence after it is read."
      - id: CHK-A8-HASH-STRUCT
        result: pass
        what: "the content_hash token is shaped as 2.2 requires"
        computed: "byte-identical to A.4's token. The hash of the external recording survived the redaction while the url that it protects did not."
      - id: CHK-A8-HASH-ALG-TOKEN
        result: fail
        what: "2.2 MUST: hash algorithm identifiers use only lowercase letters"
        computed: "sha512 contains digits. Same defect as CHK-A4-HASH-ALG-TOKEN."
        finding: "SOURCE DEFECT, same instance."
      - id: CHK-A8-REDACTION-CONTENT
        result: fail
        what: "4.1.8: every datum in the prior version is removed, copied-and-partially-redacted, or copied as is"
        computed: "the redacted transcript is the A.5 transcript with three substitutions - example.com -> {{URL}}, 1234567890 -> {{BAN}}, and 'Okay.' -> '{{US_STATE}}' in both places it occurs - but it is ALSO re-tokenized: A.5 reads 'I'd liketo add' and 'so I can look up' and 'I've addedtwo', A.8 reads 'I'd like to add' and 'soI can look up' and 'I've added two'. Word counts differ, 74 against 75. So A.8's analysis is not any of the three operations 4.1.8 allows applied to A.5's."
        finding: "SOURCE DEFECT, two separate problems in one object. (1) The redaction is not a transformation of the prior version: the two texts came from different runs, so the audit trail 4.1.8 is built to provide does not hold even between the document's own examples. (2) The redaction is WRONG in both directions. 'Okay' was classified as a US state - OK, Oklahoma - and redacted twice, a false positive that destroys meaning; while 'Bob' and 'Alice' survive in the transcript although tel was stripped from the Party Objects for being PII, a false negative that defeats the redaction's stated purpose, 'PII Redaction'. The phone number was redacted as {{BAN}}, a bank account number. The vendor is named in the example as CapitalOne / dataprofiler, so this is a real tool's real output, which is why it is worth keeping: it is evidence about what automated redaction does, not a strawman."
      - id: CHK-A8-UUID-TIME-ORDER
        result: fail
        what: "4.1.2: a version 8 uuid built like version 7 carries a millisecond timestamp in its first 48 bits, so uuids sort by creation time"
        computed: "this vCon's uuid time prefix decodes to 2024-10-15T02:44:32.702Z. The uuid of the vCon it redacts decodes to 2026-09-07T20:56:47.035Z. The derived document's identifier is timestamped nearly two years BEFORE its source."
        finding: "SOURCE DEFECT. Time ordering is the entire reason 4.1.2 chose a version 7 construction over a random uuid; a redaction that sorts before the thing it redacts breaks any consumer that uses the prefix to order versions - which is the one thing the prefix is for. All the other examples share a 2026-09-07 generation window, so this one uuid is the outlier."

  - id: VCON-A9
    file: "a9-amended-signed-vcon.json"
    title: "Amended Signed vCon"
    source_section: "Appendix A.9"
    source_lines: "6669-6715"
    sha256: "f0c787c2a8ab04a2064bdc1a4012c3b895f37cf1acf0fc03c90c3fd4954df36f"
    bytes: 1050
    form: amended
    furniture_lines_removed: 0
    wrapped_lines_rejoined: 2
    exercises:
      - "4.1.9 amended and 4.1.9.1 Amended Object: uuid"
      - "the deep-copy rule: the amended vCon carries everything the prior version had"
      - "a text Dialog Object added as the amendment"
    harness_expects:
      - "Parses as JSON. 1050 bytes."
      - "Assert the deep-copy rule mechanically: a9.parties equals a4.parties and a9.dialog[0] equals a4.dialog[0], element for element. Both hold. a9.created_at equals a4.created_at. The amendment is dialog[1] and nothing else changed."
      - "a9.uuid differs from a4.uuid while a9.amended.uuid equals it. This is the ONLY place in the appendix where a derived vCon gets its own identifier, and it is the behaviour A.5 should have had."
      - "dialog[1] has no duration. 4.3.3 does not require one on a text dialog; do not assert its presence."
      - "The section is titled 'Amended Signed vCon' and the fixture is UNSIGNED. See CHK-A9-NOT-SIGNED."
    checks:
      - id: CHK-A9-PARSE
        result: pass
        what: "fixture parses as JSON"
        computed: "json.load succeeds; 1050 bytes"
      - id: CHK-A9-UUID-V8
        result: pass
        what: "4.1.2 SHOULD: uuid is a version 8 UUID"
        computed: "01a07da8-c5c1-8db4-a20f-d188127fad29 -> version nibble 8, variant nibble a (10xx). uuid version nibble is 8 and variant bits are 10 (RFC 4122), as 4.1.2 SHOULD"
      - id: CHK-A9-AMENDED-UUID-V8
        result: pass
        what: "4.1.9.1: the amended uuid is a vCon uuid"
        computed: "01a07da8-c2bb-83e5-b9a2-279e0d16bc46 -> version 8, variant b"
      - id: CHK-A9-LINK
        result: pass
        what: "amended.uuid names a vCon that exists in this document"
        computed: "equal to the uuid of A.4, A.5, A.6's signature header and A.7's unprotected header. The link resolves - but to six things; see CHK-A8-LINK-AMBIGUOUS, which applies here unchanged. The prose says it references the signed vCon of A.6, and only the prose says so."
      - id: CHK-A9-AMENDED-HASH
        result: not-determinable
        what: "do the uuid and hash in the Amended Object cohere with each other"
        computed: "there is no hash. amended has exactly one member, uuid; url and content_hash are both absent, which 4.1.9.1 permits. So, as with A.8, the integrity link the Amended Object was designed to carry is exercised by no example in this draft. Of the four objects that can carry a ContentHash - Dialog, Analysis, Attachment, Redacted and Amended - only Dialog has a fixture."
      - id: CHK-A9-DEEPCOPY
        result: pass
        what: "4.1.9: the newer version is a deep copy of the prior version with the amendments added"
        computed: "a9.parties == a4.parties (compared element by element). a9.dialog[0] == a4.dialog[0], all eight members including the content_hash token. a9.created_at == a4.created_at. a9.analysis and a9.attachments are empty, as in A.4. The only additions are dialog[1] and the amended object, and the only change is uuid. The deep-copy rule holds exactly."
      - id: CHK-A9-UUID-DISTINCT
        result: pass
        what: "4.1.9: a new vCon instance version gets its own identity"
        computed: "a9.uuid != a9.amended.uuid. The one example in the appendix that gives a derived document a new uuid. Contrast A.5, which adds an Analysis Object to A.4 and keeps the identifier - see CHK-A5-UUID-UNIQUE. The pair A.5/A.9 is the evidence that the draft's versioning rule is stated correctly and followed inconsistently."
      - id: CHK-A9-UUID-FQHN
        result: not-determinable
        what: "4.1.2 SHOULD: rand_b is the high 62 bits of the SHA-1 hash of the FQHN, and the FQHN is the one in the signing certificate"
        computed: "this fixture's trailing 62 bits are 0x220fd188127fad29 (a20f-d188127fad29). Every other example in the appendix shares 0x39a2279e0d16bc46 (b9a2-279e0d16bc46). Under 4.1.2 those bits are a function of the FQHN alone, so either A.9 was generated for a different FQHN or the rule was not applied. Which cannot be decided: the document never states the FQHN, and 16 candidates drawn from the certificates and the example data - fakevcon.io, fakevcon.org, div.fakevcon.io, div.fakevcon.org, grp.div.fakevcon.io, grp.div.fakevcon.org, example.com, vcon.dev, py-vcon, localhost, sipez.com, vcon.io, mail.yahoo.com, ietf.org, FakeVcon, admin@fakevcon.org - were tested against three readings of 'high 62 bits of the SHA-1 hash' (first 8 octets shifted right 2, low 62 of the first 8 octets, and the first 8 octets verbatim) and none matched either value. Recorded in full so a verifier with the FQHN can close it in one line."
      - id: CHK-A9-PARTY-INDEX
        result: pass
        what: "dialog[].parties indices fall inside the top-level parties array"
        computed: "dialog[0].parties = [0, 1]; dialog[1].parties = [1, 0]; len(parties) = 2; all in range"
      - id: CHK-A9-HASH-STRUCT
        result: pass
        what: "the content_hash token is shaped as 2.2 requires"
        computed: "byte-identical to A.4's token, as the deep-copy rule requires"
      - id: CHK-A9-HASH-ALG-TOKEN
        result: fail
        what: "2.2 MUST: hash algorithm identifiers use only lowercase letters"
        computed: "sha512 contains digits. Same defect as CHK-A4-HASH-ALG-TOKEN."
        finding: "SOURCE DEFECT, same instance."
      - id: CHK-A9-NOT-SIGNED
        result: fail
        what: "the section title and Figure 2 against what the example prints"
        computed: "A.9 is titled 'Amended Signed vCon' and its prose says the Amended Object references 'the signed vCon example above'. Figure 2, the amended vCon object tree, draws the TOP level as a JWS carrying the amended vCon in its payload. The fixture has no payload and no signatures: it is an unsigned vCon with an amended member. The outer JWS that the title and the figure both promise is not printed."
        finding: "SOURCE DEFECT of omission. Either the example is the inner object of Figure 2 and the title should say so, or the signed wrapper is missing. It matters because 4.1.9's whole premise is that 'A signed or encrypted vCon cannot be modified without invalidating it' - the amendment mechanism exists FOR signed vCons, and the one example of it is unsigned. A harness driven by the titles will look for signatures here and not find them."
      - id: CHK-A9-DIALOG-DURATION
        result: pass
        what: "4.3.3: duration on the added text dialog"
        computed: "dialog[1] has no duration member. Nothing requires one on a text dialog; dialog[0] carries 33.12 as A.4 did. Recorded so that a harness does not assert duration on every dialog - A.2 and A.3 carry duration: 0 on their text dialogs and A.9 omits it, so the document shows both conventions."
      - id: CHK-A9-ORDER
        result: pass
        what: "dialog start times"
        computed: "dialog[0].start and dialog[1].start are both 2022-06-21T17:53:26.000+00:00. The amendment is given the same start as the recording it is attached to. Non-decreasing, so any sort is stable, but note that the amendment carries no time of its own."

