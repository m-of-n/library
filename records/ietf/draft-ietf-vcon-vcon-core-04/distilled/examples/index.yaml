      - "analysis[0].body.results.channels[0].alternatives[0] carries transcript, confidence, words (76) and paragraphs. The last word ends at 31.8949 s, inside the dialog duration of 33.12 s."
      - "body.metadata.duration is 33.119938 against dialog[0].duration 33.12 - the vendor's value is the unrounded one. Compare with a tolerance, not for equality."
      - "Its transcript is the plaintext that A.8's redacted analysis was derived from. Keep the two fixtures together; the pair is the only redaction-in-practice evidence the document gives."
    checks:
      - id: CHK-A5-PARSE
        result: pass
        what: "fixture parses as JSON"
