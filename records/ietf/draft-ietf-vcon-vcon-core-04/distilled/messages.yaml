      - name: lower-case-naming-rule
        json_type: constraint
        cardinality: "1"
        required: true
        locator: "§4.2.9"
        semantics: 'Verbatim: "Note that the parameter names MUST be in lower case when contained in the Civicaddress Object even though they are in upper case in [GEOPRIV]."'
        constrained_by_locator: "§4.2.9"
        constrained_by: []
        notes: 'Recorded as a field because it is the only normative statement the object carries and it binds every member name. A GEOPRIV-literate implementation that emits "A1" rather than "a1" produces an invalid vCon, and since JSON member names are case sensitive, a consumer matching on the lower-cased names will silently see an empty address rather than fail.'

  - name: dialog-object
    locator: "§4.3"
    encoding: "JSON object; an element of the top-level dialog array"
    normative_status: normative
    semantics: 'The conversation itself, or metadata about a piece of it. Twenty-four defined parameters, of which exactly one (type) is present for every dialog; the rest are governed by the §4.3.1.6 applicability table, which is reproduced here per field under applicability. Membership is bounded by two tests stated in §4.3: media in a text or recording Dialog Object "SHOULD satisfy two constraints: the media is part of the conversation itself, and the media is transcribable", and anything failing either "SHOULD be included in the vCon as Attachment Objects rather than Dialog Objects". The document says why this matters: "This distinction is important for interoperability. If it is ambiguous as to what belongs in a Dialog Object versus an Attachment Object, interoperability cannot be achieved".'
    fields:
      - name: type
        json_type: String
        cardinality: "1"
        required: true
        locator: "§4.3.1"
        semantics: 'The discriminator every other parameter is conditioned on. Verbatim: "The string MUST have the value of either "recording", "recording- set", "text", "transfer" or "incomplete"."'
        constrained_by_locator: "§4.3.1"
        constrained_by: []
        applicability:
          recording: 'M'
          recording-set: 'M'
          text: 'M'
          transfer: 'M'
          incomplete: 'M'
        values:
          - '"recording"'
          - '"recording-set"'
          - '"text"'
          - '"transfer"'
          - '"incomplete"'
        notes: 'Closed by a MUST but extensible by registration: §6.3.4.1 creates a Dialog Type Name Registry seeded with exactly these five. A placeholder dialog carries only type and, for incomplete, disposition — verbatim: "it is possible to have a placeholder Dialog Object which contains only the type parameter and, for the "incomplete" type, the required disposition parameter." And the placeholder type is itself constrained: "As the consultative call is a call, a placeholder Dialog Object for it MUST be of type "recording" if the call was set up, or of type "incomplete" if it was not." SPLIT HYPHEN, mandatory note: the Verbatim span above keeps "recording- set", because the draft breaks "recording-set" across a line and the whitespace-normalised source really does read it that way. It is NOT rejoined here, because a Verbatim span in this file is held to the contiguous-substring invariant that catches splices; prose and commentary join instead (D5, and the rule stated in requirements.yaml''''s header).'
      - name: start
        json_type: Date
        cardinality: "0..1"
        required: conditional
        locator: "§4.3.2"
        semantics: 'Beginning of this piece of dialog. Verbatim: "The start parameter SHOULD be present unless it is not known." Per type: for text, the time the party started typing or failing that the time the text was sent; for recordings, the beginning of the recording; for a recording-set, "the time corresponding to the beginning of the call or session."'
        constrained_by_locator: "§4.3.2"
        constrained_by: []
        applicability:
          recording: 'S'
          recording-set: 'S'
          text: 'S'
          transfer: 'O — "The start parameter is optional for the "transfer" type Dialog Object as it may not always be known."'
          incomplete: 'S'
        notes: 'Declared as "start: "Date"" with no (optional) marker, which the §2.2 default would make mandatory, while §4.3.2 and the table both say SHOULD. Recorded as conditional. Verbatim on the crucial non-guarantee: "It should be noted that Dialog Objects may not be ordered by the value of the start parameter. Dialog Objects in the dialog array are in order that they were added to the vCon and cannot be reordered with out correcting the dialog indices which occur in other Objects in the vCon." Array order is insertion order and is load-bearing for indices; chronology must be reconstructed by the application.'
      - name: duration
        json_type: "UnsignedInt | UnsignedFloat"
        cardinality: "0..1"
        required: false
        locator: "§4.3.3"
        semantics: 'Length of the referenced or included dialog. Verbatim: "The value MUST be the dialog duration in seconds." For a recording-set, the duration of the whole call; verbatim: "The start and duration parameters of a recording-set Dialog Object identify the complete time interval represented by the associated recording Dialog Objects."'
        constrained_by_locator: "§4.3.3"
        constrained_by: []
        applicability:
          recording: 'O'
          recording-set: 'O'
          text: 'O'
          transfer: '- (no defined meaning; MAY be present with undefined semantics) — "The duration parameter is not applicable to the "transfer" type Dialog Object."'
          incomplete: 'O — "the duration parameter may capture the time from the attempt to setup the call or conversation until it failed."'
        notes: 'The only parameter in the whole table marked "-" rather than X or O, and the distinction is sharp: "-" means "The parameter has no defined meaning for this type; it MAY be present but its semantics are undefined." So a transfer dialog carrying a duration is VALID and UNINTERPRETABLE. For text, "if known, it is the time duration from when the party started typing to when they completed typing and the text was sent."'
      - name: parties
        json_type: "UnsignedInt | UnsignedInt[] | (UnsignedInt | UnsignedInt[])[]"
        cardinality: "0..1 (value may be scalar, array, or array of arrays)"
        required: conditional
        locator: "§4.3.4"
        semantics: 'Indices into the TOP-LEVEL parties array naming who generated this dialog. Three shapes with three meanings. Single channel: "the integer value or array of integer values are the indices to the Party Object(s) in the parties array that contributed to the mix for the single channel recording." Multi channel, verbatim: "Multi-channel recordings MUST have a parties value that is an array of the same size as the number of channels in the recording. The values in that array are either an integer or an array of integers which are the indices to the parties that contributed to the mix for the associated channel of the recording."'
        constrained_by_locator: "§4.3.4"
        constrained_by: []
        applicability:
          recording: 'S'
          recording-set: 'S — "SHOULD contain all parties known to participate in the call or session, regardless of whether they contribute recorded media."'
          text: 'S'
          transfer: 'X — "The parties parameter MUST NOT be present in "transfer" type Dialog Objects"'
          incomplete: 'O — "it indicates the parties between which the call or conversation setup was attempted."'
        notes: 'REFERENTIAL CONSTRAINT, and the single most important one in the container: these are integer INDEX references into vCon.parties, not identifiers. Nothing in the document range-checks them, defines consumer behaviour on an out-of-range index, forbids a duplicate, or requires vCon.parties to exist at all (it is optional, §4.1.10). The only protection of the mapping is procedural, in §4.1.8: a redactor removing an array element "SHOULD create an empty placeholder such that object array indices do not change". SHOULD, not MUST. A redaction that drops a party silently re-points every dialog in the vCon.'
      - name: parties-null-channel-placeholder
        json_type: "null"
        cardinality: "0..n within the channel array"
        required: conditional
        locator: "§4.3.4"
        semantics: 'Verbatim: "If not all channels are used in a recording, such that no parties are recorded on one or more channels, a null placeholder MUST be inserted into the parties array for the corresponding channel."'
        constrained_by_locator: "§4.3.4"
        constrained_by: []
        notes: 'DEFECT, recorded as a separate field because it is otherwise invisible: the declared type of parties is "UnsignedInt" | "UnsignedInt[]" | ("UnsignedInt" | "UnsignedInt[]")[] and NULL IS NOT IN IT, yet a MUST requires null to appear in the third form. The declared type and the normative prose contradict each other. Both informational schemas resolve it in favour of the prose: Appendix B admits {"type": "null"} as a third alternative inside the outer array, and Appendix C writes dialog_parties_type = party_index_type / [* ( party_index_type / [* party_index_type] / null )] under the comment "null is the placeholder for an unused channel (Section 4.3.4)". So the type notation in §4.3.4 is wrong and the rest of the document knows it. A validator built from the §4.3.4 notation alone will reject conforming vCons.'
      - name: originator
        json_type: UnsignedInt
        cardinality: "0..1"
        required: false
        locator: "§4.3.5"
        semantics: 'Index into vCon.parties naming the party that originated this dialog. Verbatim on when it appears: "The originator parameter is only provided if the first party of the dialog Object parties list is NOT the originator." Verbatim on the default it overrides: "It is implied that the first party in the dialog Object parties list, is the originator of the dialog." (§4.3.4)'
        constrained_by_locator: "§4.3.5"
        constrained_by: []
        applicability:
          recording: 'O'
          recording-set: 'O'
          text: 'O'
          transfer: 'X — "The originator parameter MUST NOT be present in "transfer" type Dialog Objects"'
          incomplete: 'O'
        notes: 'REFERENTIAL CONSTRAINT: index into vCon.parties, unchecked. Two cases force its use: a recording whose first channel is not the originator, and per-party recordings where "the dialog Object parties parameter may contain only one party and may not be the originator." Per mode: "For email and text, this is the sender of the text. For audio and video calls, this is the calling party. For a scheduled meeting or conference, this is the organizer, the party that scheduled or created the meeting." The organizer case is explicitly not the host: "The organizer is distinct from the party acting as host or controller of the conference at any point during the meeting; identifying the host or controller is out of scope for this document." If unknown, "an empty Party Object (see Party Object (Section 4.2)) may be used as the first party or as the party referenced by the originator parameter."'
      - name: recordings
        json_type: "UnsignedInt[]"
        cardinality: "0..1"
        required: conditional
        locator: "§4.3.6"
        semantics: 'Indices into the TOP-LEVEL dialog array naming the recording Dialog Objects that make up this set. Verbatim: "The recordings parameter contains the indices of all recording Dialog Objects that are part of the recording-set. The recordings parameter MUST be present in recording-set Dialog Objects. The recordings parameter MUST NOT be present in other Dialog Object types."'
        constrained_by_locator: "§4.3.6"
        constrained_by: []
        applicability:
          recording: 'X'
          recording-set: 'M'
          text: 'X'
          transfer: 'X'
          incomplete: 'X'
        notes: 'REFERENTIAL CONSTRAINT: indices into vCon.dialog, unchecked, and additionally TYPE-constrained — the referents must be of type recording. Nothing enforces that, nothing forbids a cycle (a recording-set listing itself), and nothing requires the referenced recordings to carry a matching recording_set back-pointer.'
      - name: recording_set
        json_type: UnsignedInt
        cardinality: "0..1"
        required: false
        locator: "§4.3.7"
        semantics: 'The inverse of recordings: an index into vCon.dialog naming the recording-set this recording belongs to. Verbatim: "The recording_set parameter SHOULD be present when a recording Dialog Object is part of a recording-set Dialog Object. The recording_set parameter MUST NOT be present in other Dialog Object types."'
        constrained_by_locator: "§4.3.7"
        constrained_by: []
        applicability:
          recording: 'O (SHOULD be present when the recording is part of a recording-set)'
          recording-set: 'X'
          text: 'X'
          transfer: 'X'
          incomplete: 'X'
        notes: 'STRENGTH DISAGREEMENT between the subsection and the table, and the subsection wins. §4.3.7 states a SHOULD conditioned on membership of a set; Table 1 flattens it to a plain O, which carries no obligation at all. §4.3.1.6 settles it in advance: "The parameter definitions in the subsections of this document are definitive; this table is provided as a summary." So the table under-reports here, and a consumer reading only the column will not know a recording in a set is expected to point back. The declaration itself agrees with the subsection: "recording_set: "UnsignedInt" (optional; SHOULD be present when the recording is part of a recording-set)". Appendix C preserves the subsection strength in a comment, "recording_set SHOULD be present when part of a recording-set". Note the contrast with its partner §4.3.6, where prose and table agree on M. REFERENTIAL CONSTRAINT, unchecked, and the pair recordings/recording_set is a two-way edge neither side of which is required to agree with the other.'
      - name: mediatype
        json_type: Mediatype
        cardinality: "0..1"
        required: conditional
        locator: "§4.3.8"
        semantics: 'Media type of the dialog content. Verbatim: "The mediatype parameter MUST be provided for inline dialog files and MUST be provided if the Content- Type header in the [HTTPS] response for the externally referenced URL is not provided. The mediatype parameter is not required when the Dialog Content is absent, such as in a placeholder Dialog Object or when the body and url have been redacted. The mediatype parameter MUST NOT be present in "recording-set", "transfer" or "incomplete" type Dialog Objects as they do not have Dialog Content."'
        constrained_by_locator: "§4.3.8"
        constrained_by: []
        applicability:
          recording: 'M, footnote (1)'
          recording-set: 'X'
          text: 'M, footnote (1)'
          transfer: 'X'
          incomplete: 'X'
        values:
          - '"text/plain"'
          - '"audio/x-wav"'
          - '"audio/x-mp3"'
          - '"audio/x-mp4"'
          - '"audio/ogg"'
          - '"video/x-mp4"'
          - '"video/ogg"'
          - '"multipart/mixed"'
        notes: 'The list is SHOULD, not MUST: "The media types SHOULD be one of the following strings". Four of the eight are x- experimental names (x-wav, x-mp3, x-mp4 twice) rather than the registered audio/wav, audio/mpeg and video/mp4, which will cost interoperability with any consumer matching on IANA names. For multipart the document notes: "multi-part will also likely include the boundary parameter" — which the §2.2 Mediatype production does not admit. Footnote (1) is the conditional in full: "MUST be present for inline Dialog Content; optional for externally referenced Dialog Content when the media type is provided in the [HTTPS] Content-Type header; not required when Dialog Content is absent, such as in a placeholder Dialog Object or a redacted vCon." Note the consequence: for an external reference the authoritative media type can live OUTSIDE the signed bytes, in an HTTP header no signature covers. SPLIT HYPHEN, mandatory note: the Verbatim span above keeps "Content- Type", because the draft breaks "Content-Type" across a line and the whitespace-normalised source really does read it that way. It is NOT rejoined here, because a Verbatim span in this file is held to the contiguous-substring invariant that catches splices; prose and commentary join instead (D5, and the rule stated in requirements.yaml''''s header).'
