      - name: disposition
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.3.11"
        semantics: 'Why a call or conversation failed before any exchange. Verbatim: "If the dialog type is "incomplete", it MUST have a disposition parameter." Declared as "disposition: "String" (required for incomplete type Dialog Objects, SHOULD NOT be present for other dialog types)".'
        constrained_by_locator: "§4.3.11"
        constrained_by: []
        applicability:
          recording: 'SN'
          recording-set: 'SN'
          text: 'SN'
          transfer: 'SN'
          incomplete: 'M'
        values:
          - '"no-answer" — "a call or connection was attempted, but no one answered or accepted the connection"'
          - '"congestion" — "a call or connection was attempted, but was unable to be completed due to system load"'
          - '"failed" — "a call or connection was attempted, but failed"'
          - '"busy" — "a call or connection was attempted, but the party was busy with another conversation"'
          - '"hung-up" — "a call or connection was made, but the party hung-up before any conversation occurred"'
          - '"voicemail-no-message" — "a call or connection was made, the voicemail system answered, but no message was left"'
        notes: 'Closed enumeration: "The value of the disposition parameter MUST be one of the following string". No IANA registry is created for these six, unlike the dialog type names and party_event names — so extending them requires a schema extension rather than a registration. Default for the unknown case: "If the reason that the call or conversation failed is not known, such as in a placeholder Dialog Object, the disposition value "failed" SHOULD be used." Boundary note on voicemail: "if a message was left with the voicemail system this is no longer an "incomplete" type dialog, it is a "recording" type and the conversation SHOULD be included in the Dialog Content." The section also carefully distinguishes this from an agent-assigned call disposition, which "is not dialog, but analysis of the conversation and is not included in the dialog portion."'
      - name: session_id
        json_type: "SessionId | SessionId[] | (SessionId | SessionId[])[]"
        cardinality: "0..1"
        required: false
        locator: "§4.3.12"
        semantics: 'RFC 7989 Session-ID correlation for this dialog. Verbatim on the single-value case: "If the same [SESSION-ID] applies to all the parties in a dialog, than a single instance of the SessionId Object is provided as the value of session_id." Verbatim on the per-party case: "If some parties have a different or no associated [SESSION-ID] for this Dialog Object, then the array structure of the session_id objects MUST correlate to the array structure of the Dialog Object''s parties index array."'
        constrained_by_locator: "§4.3.12"
        constrained_by: []
