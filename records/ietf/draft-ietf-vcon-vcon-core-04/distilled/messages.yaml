record: draft-ietf-vcon-vcon-core-04
reviewed_by: ""

# ---------------------------------------------------------------------------
# Single-line scalars throughout: bin/_yaml.py is not a YAML implementation.
# Values are single-quoted; an apostrophe inside a value is doubled, which this
# reader does undo (verified against bin/_yaml.py:_scalar). Verbatim source text
# is wrapped in double quotes inside the single-quoted scalar.
applicability: 'PARTIAL, and the partiality is a finding rather than a gap in this extraction. draft-ietf-vcon-vcon-core-04 defines no wire protocol: there are no messages on a network, no request or response, no framing above a single JSON document, no transport state and no header fields of its own except the one JWS/JWE header parameter it registers in section 6.5. What it defines instead is a CONTAINER: one JSON document that exists in three mutually exclusive forms (unsigned, JWS signed, JWE encrypted), optionally gzip compressed, holding nine object types plus four helper types. That is what this file captures, decomposed structure by structure and field by field, because that decomposition is the level an implementer builds from and the level at which a consumer can reject a document. What is deliberately NOT here, because the document does not define it: any retrieval, submission or subscription operation (section 5 says secure storage and access of externally referenced conversation data is out of scope); any key distribution or trust anchor discovery beyond the x5c/x5u carriage rule of section 5.2.2; and the redaction and de-identification methods themselves, which section 4.1.8 puts out of scope. The one piece of true wire behaviour the document does state is the externally referenced file fetch over HTTPS of section 2.4.1 and 5.1; it is captured here as the externally-referenced-file-pattern structure rather than as a message, since the document specifies the reference and the integrity check, not the exchange.'

cross_links: 'constrained_by is EMPTY on every field here, deliberately, and each field instead carries constrained_by_locator naming the section whose normative statement binds it. This artifact was produced in pass 1 of the FX-1 extraction, concurrently with a rewrite of distilled/requirements.yaml, so no stable R-NNNN id list existed to cite: wiring ids against a list being rewritten under us would have produced citations that point at the wrong requirements, which is worse than none. Pass 3 resolves each constrained_by_locator to the requirement ids at that locator and fills constrained_by. Where a locator is a table cell rather than a sentence (the section 4.3.1.6 applicability rows), the locator is given as the table section plus the parameter name.'

conventions: 'Three reading rules carried from the source. (1) Section 2.2 ends with "All parameters are assumed to be mandatory unless otherwise noted." — so a parameter declaration with no (optional) marker is REQUIRED even where the surrounding prose only says SHOULD, and this file records required: true for those while noting the tension. (2) Section 2.2 also says "Objects or arrays with no or null values MAY be excluded from the vCon." — which softens (1) for empty values specifically. (3) The draft ships TWO informational schemas and they do not cover the same ground: Appendix B is a JSON Schema titled "vCon - Unsigned Form" with $id unsigned-vcon.json and covers section 4 ONLY, while Appendix C is a CDDL covering sections 2, 4 AND 5, so for the signed and encrypted forms Appendix C is the only schema the draft has. Both disclaim themselves in the same words. Appendix B states: "The text in sections 1-6 of this document define the normative definition of the vCon schema. If the JSON schema provided below differs from that in the text of the above sections, the text should be taken as the definitive definition and the JSON Schema below should be consider incorrect." Appendix C states: "This CDDL for vCon core is provided as informational. The text in sections 1-6 of this document define the normative definition of the vCon CDDL. If the CDDL provided below differs or conflicts from that in the text of the above sections, the text should be taken as the definitive definition and the CDDL below should be consider incorrect." Every required/cardinality judgement in this file is taken from sections 1-6; the two appendices are cited only as corroboration or as a recorded divergence, and where they disagree with each other that disagreement is itself recorded.'

# ---------------------------------------------------------------------------
messages:

  - name: json-notation-types
    locator: "§2.2"
    encoding: "JSON (RFC 8259); the type vocabulary every other structure in this file is written in"
    normative_status: normative
    semantics: 'The document does not use JSON Schema or CDDL normatively. It writes each parameter as "name: Type" using a notation borrowed wholesale: "the convention for [JSON] notation used in this document is copied from sections 1.1-1.5 of [JMAP]". This structure is that vocabulary, listed first because every json_type elsewhere in this file resolves here.'
    fields:
      - name: Date
        json_type: string
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'An RFC 3339 date-time. Verbatim: "A string that MUST have the form of an [RFC3339] date string as defined for the Date type in section 1.4 of [JMAP]."'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'Used by created_at, updated_at, Dialog.start, Attachment.start and Party_History.time. No timezone, resolution or ordering rule is imposed beyond RFC 3339 itself.'
      - name: "*"
        json_type: any
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'Verbatim: "The type is undefined; the value can be any JSON type, although permitted values may be constrained by the context of the value, as defined in section 1.1 of [JMAP]."'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'The only parameter typed "*" in the core schema is body, in all three content-carrying objects. It is why encoding exists.'
      - name: String
        json_type: string
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'Verbatim: "a JSON string type." No length bound, charset restriction or normalisation rule is stated anywhere in the document.'
        constrained_by_locator: "§2.2"
        constrained_by: []
      - name: UnsignedInt
        json_type: number
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'Verbatim: "a positive JSON integer as defined in section 1.3 of [JMAP]."'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'Every array index in the container is an UnsignedInt. The word "positive" is the source text; JMAP section 1.3 admits zero, and index 0 is used throughout the Appendix A examples, so zero is included. Marked inferred for the zero case.'
        inferred: 'that UnsignedInt includes 0 — the source says "positive" but every example indexes from 0'
      - name: UnsignedFloat
        json_type: number
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'Verbatim: "a positive JSON floating point number containing a decimal point as defined in section 6 of [JSON]."'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'Only Dialog.duration uses it, as an alternative to UnsignedInt.'
      - name: Mediatype
        json_type: string
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'Verbatim: "A "String" value that MUST be of the following form as defined in section 5.1 of [MIME]:" followed by the production: type "/" subtype'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'The production shown has no parameter part, yet §4.3.8 notes of multipart/mixed: "multi-part will also likely include the boundary parameter". The stated form and the stated usage disagree; the usage is the one implementations will meet.'
      - name: ContentHash
        json_type: string
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'A single token binding a named hash algorithm to a Base64Url digest, lifted from section 6 of STIR-PASS to remove the normative dependency. Decomposed as its own structure below (contenthash-token).'
        constrained_by_locator: "§2.2"
        constrained_by: []
      - name: SessionId
        json_type: object
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'Verbatim: "An object with the String parameters: "local" and "remote"." Decomposed as its own structure below (sessionid-object).'
        constrained_by_locator: "§2.2"
        constrained_by: []
      - name: "A[]"
        json_type: array
        cardinality: "0..n"
        required: false
        locator: "§2.2"
        semantics: 'Verbatim: ""A[]" and array of values of type A." The sole array notation; nested forms such as ("UnsignedInt" | "UnsignedInt[]")[] are built from it by hand in §4.3.4 and §4.3.12.'
        constrained_by_locator: "§2.2"
        constrained_by: []
      - name: default-mandatory-rule
        json_type: constraint
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'Verbatim: "All parameters are assumed to be mandatory unless otherwise noted." This is the default every parameter in sections 4 and 5 is read against, and it is why a declaration that carries no (optional) marker is recorded as required: true in this file.'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'This rule collides with the §4.3.1.6 applicability table, which downgrades several unmarked parameters to S (SHOULD). See the dialog-parameter-applicability-by-type structure.'
      - name: empty-value-omission-rule
        json_type: constraint
        cardinality: "1"
        required: false
        locator: "§2.2"
        semantics: 'Verbatim: "Objects or arrays with no or null values MAY be excluded from the vCon." A permission to drop an empty container rather than write it.'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'Applies to objects and arrays only, by its own words; it does not license dropping a mandatory scalar. It also interacts badly with §4.1.8 redaction, which asks for empty ARRAY placeholders so indices do not shift: one rule says an empty array may be dropped, the other says an empty element must be kept.'

  - name: contenthash-token
    locator: "§2.2 (type ContentHash), §2.4.2, §5.1"
    encoding: "ASCII token: algorithm name, hyphen, Base64Url digest"
    normative_status: normative
    semantics: 'The integrity binding for every file the vCon references rather than carries, and for a prior vCon instance version referenced by redacted or amended. It is a single flat string, not an object.'
    fields:
      - name: algorithm
        json_type: string-fragment
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'The crypto algorithm identifier. Verbatim: "The hash algorithm is identified by "sha512"." Verbatim on its lexical form: "Hash algorithm identifiers MUST use only lowercase letters, and they MUST NOT contain hyphen characters."'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'The no-hyphen rule is what makes the token splittable on its first hyphen. Verbatim on additional algorithms: "Implementations MAY support additional recommended hash algorithms in [IANA-COSE-ALG]; that is, the hash algorithm has "Yes" in the "Recommended" column of the IANA registry." Combined with the lowercase-only rule this silently excludes COSE names containing digits or hyphens, which most of them do.'
      - name: separator
        json_type: literal-hyphen
        cardinality: "1"
        required: true
        locator: "§2.2"
        semantics: 'Verbatim: "The character following the algorithm string MUST be a hyphen character, "-", or ASCII 45."'
        constrained_by_locator: "§2.2"
        constrained_by: []
      - name: digest
        json_type: string-fragment
        cardinality: "1"
        required: true
        locator: "§2.2, §2.4.2"
        semantics: 'Verbatim: "The subsequent characters are the Base64Url encoded (see Section 2 [JWS]) digest of a canonicalized and concatenated string or binary data based on the JSON pointer referenced elements of "rcd" claim or the URI referenced content contained in the claim."'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'DEFECT, carried over from the STIR-PASS text it was copied from: the sentence still describes an "rcd" claim and JSON pointers, neither of which exists in a vCon. For a vCon the digest is over the body of the content at the given url, as the preceding sentence in the same bullet says. An implementer reading only the copied sentence has no definition of what gets hashed.'

  - name: sessionid-object
    locator: "§2.2 (type SessionId), §4.3.12"
    encoding: "JSON object"
    normative_status: normative
    semantics: 'Carries an RFC 7989 Session-ID pair so a dialog can be correlated back to the signalling that produced it. Designed to double as the H.323 correlated identifier pair.'
    fields:
      - name: local
        json_type: string
        cardinality: "0..1"
        required: false
        locator: "§2.2"
        semantics: 'A UUID as defined in section 5 of SESSION-ID as "local-uuid"; the H.323 H-460-27 "Sender-UUID".'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'Verbatim on the missing-end case: "In the case that one end of the [SESSION-ID] does not have a UUID, the "nil UUID" String value SHOULD be used as defined in section 7 of [SESSION-ID]." (§4.3.12)'
      - name: remote
        json_type: string
        cardinality: "0..1"
        required: false
        locator: "§2.2"
        semantics: 'A UUID as defined in section 5 of SESSION-ID as "remote-uuid"; the H.323 H-460-27 "Recipient-UUID".'
        constrained_by_locator: "§2.2"
        constrained_by: []
        notes: 'Both members are absent in the empty-object form {} that §4.3.12 requires for a party with no Session-ID, and §4.3.12 is explicit that this is NOT the same as two nil UUIDs: "That an empty Object and not an Object with two "nil UUIDs" as defined in section 7 of [SESSION-ID]." The two spellings are semantically distinct and both legal.'

  - name: inline-file-pattern
    locator: "§2.3, §2.3.1, §2.3.2"
    encoding: "two JSON members carried inside the vCon"
    normative_status: normative
    semantics: 'One of the two ways any file reaches a consumer. The whole payload sits inside the vCon, so the signature over the vCon covers it. Verbatim on the obligation: "Objects that contain a file or data inline (i.e. within the vCon) MUST have the parameters: body and encoding."'
    fields:
      - name: body
        json_type: "*"
        cardinality: "0..1"
        required: conditional
        locator: "§2.3.1"
        semantics: 'Verbatim: "The body parameter contains the payload of the file to be included inline. Depending upon the data in the file, it may require encoding to be represented as a valid JSON value."'
        constrained_by_locator: "§2.3"
        constrained_by: []
        notes: 'Required when the file is carried inline rather than referenced; MAY be absent in a redacted vCon (§4.3.10, §4.4.7, §4.5.9). The declared type "*" is wider than the real one, and only Appendix C says so: inline_content_type is written as ( encoding: "json", body: any ) // ( encoding: "none" / "base64url", body: tstr ) under the comment "body is any JSON value when encoding is "json"; otherwise body is a string (Sections 2.3.1 and 2.3.2)". So body is any JSON value ONLY when encoding is "json"; under base64url or none it is a string. Sections 2.3.1 and 2.3.2 imply this but never state it, so a producer reading the prose alone may legally emit a JSON object under encoding "none". Verbatim on why encoding is needed at all: "JSON does not support binary data values. For this reason inline files MUST be Base64url (see Section 2 [JWS]) encoded to be included as a valid JSON string value if they are not already valid JSON strings."'
      - name: encoding
        json_type: string
        cardinality: "0..1"
        required: conditional
        locator: "§2.3.2"
        semantics: 'Names the transformation applied to produce body. Verbatim: "If the body parameter is provided and is not an empty string, the encoding parameter MUST be provided."'
        constrained_by_locator: "§2.3.2"
        constrained_by: []
        values:
          - '"base64url" — "The payload of the file has been Base64Url encoded and provided as the string value of the body parameter."'
          - '"json" — "The value of the body parameter is a JSON value (object, array, number, string, or one of the literals true, false, or null) as defined in [JSON]."'
          - '"none" — "The payload of the file is a valid JSON string and can be included without modification as the string value to the body parameter."'
        notes: 'The enumeration is closed: "This MUST be one of the following strings". But §2.3.2 then undercuts its own MUST: "In the interest of being tolerant for interoperability, if the encoding value is not provided, applications can attempt to derive the encoding token value based upon the mediatype parameter or filename extension if either is provided." A consumer is therefore told both that encoding MUST be present and how to proceed when it is not. Guessing the encoding from a filename extension is the weakest statement in the container and is worth flagging to any implementer.'

  - name: externally-referenced-file-pattern
    locator: "§2.4, §2.4.1, §2.4.2, §5.1"
    encoding: "two JSON members naming content held outside the vCon"
    normative_status: normative
    semantics: 'The other way a file reaches a consumer. The payload is not in the vCon, so the vCon signature cannot cover it; the hash is the substitute. Verbatim: "Files and data stored externally from the vCon MUST be "signed" to ensure that they have not been modified. Objects that refer to a file which is externally stored from the vCon MUST have the parameters: url, content_hash."'
    fields:
      - name: url
        json_type: string
        cardinality: "0..1"
        required: conditional
        locator: "§2.4.1"
        semantics: 'Verbatim: "The url value contains the [HTTPS] URL where the externally referenced file is stored. HTTPS MUST be used for retrieval to protect the privacy of the contents of the file."'
        constrained_by_locator: "§2.4.1"
        constrained_by: []
        notes: 'Required when the file is referenced rather than carried; MAY be absent in a redacted vCon. The scheme restriction is normative and is on RETRIEVAL, so a non-HTTPS url is a malformed reference, not merely an unwise one.'
      - name: content_hash
        json_type: "ContentHash | ContentHash[]"
        cardinality: "0..1 (the value may itself be an array)"
        required: conditional
        locator: "§2.4.2"
        semantics: 'Verbatim: "The integrity of externally referenced files are protected using a hash of the external content. The algorithm and hash value are contained in the content_hash parameter. The value of the content_hash can be a single token or an array of tokens if multiple hash algorithms are desired to be provided. The SHA-512 [SHA-512] algorithm MUST be supported. Other algorithms MAY be included."'
        constrained_by_locator: "§2.4.2"
        constrained_by: []
        notes: 'MUST be present whenever url is (§4.3.1.6 footnote 4, §4.1.8.1, §4.1.9.1). Verification timing is stated once, in §5.1: "After retrieving externally referenced files, before using its content, the payload of the HTTPS request should be verified using the signature parameter value for the hash for the url body using the procedure defined in section 6.3 and 6.4 of [SHA-512]." That sentence is lowercase "should", so the verification step is not a BCP 14 obligation anywhere in the document — the only normative statements are about CARRYING the hash, never about CHECKING it. This is the sharpest gap in the integrity story and belongs in the design notes.'
        inferred: 'that an array value means alternatives rather than a conjunction — the source says "if multiple hash algorithms are desired to be provided" and never says whether a verifier must satisfy one or all'

  - name: content-carriage-sites
    locator: "§4.3.10, §4.4.7, §4.5.9, Appendix C (file_content_type)"
    encoding: "the inline and external patterns, recurring verbatim at three places"
    normative_status: normative
    inferred: 'that inline and external carriage are mutually exclusive — only the informational Appendix C commits to it; sections 1 to 6 only juxtapose the two pairs with "or"'
    semantics: 'The inline and externally-referenced patterns above are not defined once and referenced; they are RESTATED at each of the three objects that carry content. The three restatements differ, and the differences are normative. This structure exists so the differences are visible side by side. One rule is common to all three and is stated normatively nowhere: the two patterns are EXCLUSIVE. Each of the three sections writes "the body and encoding parameters or the url and content_hash parameters", which reads as an exclusive or but never says so, and only Appendix C commits to it, with file_content_type = ( inline_content_type // external_content_type ) — a CDDL group choice, not a union. Marked inferred: no section of 1 to 6 forbids a vCon from carrying both an inline body and an external url for the same content, and nothing says which a consumer is then to prefer.'
    fields:
      - name: dialog-content
        json_type: "body+encoding | url+content_hash"
        cardinality: "0..1 of the two pairs"
        required: conditional
        locator: "§4.3.10"
        semantics: 'Verbatim: "The Dialog Object SHOULD contain the body and encoding parameters or the url and content_hash parameters for all dialog types other than "incomplete", "transfer" and "recording-set", these parameters MUST NOT be present for "incomplete", "transfer" or "recording-set" dialog types (see Inline Files (Section 2.3) and Externally Referenced Files (Section 2.4)). The exception to this is that the body or url MAY be absent if it is redacted."'
        constrained_by_locator: "§4.3.10"
        constrained_by: []
        notes: 'The only one of the three with a type-conditional prohibition. The prohibition is a MUST NOT and is restated per parameter in §4.3.8, §4.3.9 and the §4.3.1.6 table. Note the declaration here marks body as "(optional in a redacted vCon)" and url likewise, while encoding and content_hash carry no marker and so are mandatory-when-their-partner-is-present.'
      - name: attachment-content
        json_type: "body+encoding | url+content_hash"
        cardinality: "0..1 of the two pairs"
        required: conditional
        locator: "§4.4.7"
        semantics: 'Verbatim: "The Attachment Object SHOULD contain the body and encoding parameters or the url and content_hash parameters (see Inline Files (Section 2.3) and Externally Referenced Files (Section 2.4)). The exception to this is that the body or url MAY be absent if it is redacted."'
        constrained_by_locator: "§4.4.7"
        constrained_by: []
        notes: 'No type discriminator exists for attachments, so the carriage rule is unconditional. Unlike §4.3.10, the declarations here carry no "(optional in a redacted vCon)" marker on body or url even though the surrounding prose grants the same redaction exception.'
      - name: analysis-content
        json_type: "body+encoding | url+content_hash"
        cardinality: "0..1 of the two pairs"
        required: conditional
        locator: "§4.5.9"
        semantics: 'Verbatim: "The Analysis Object SHOULD contain the body and encoding parameters or the url and content_hash parameters (see Inline Files (Section 2.3) and Externally Referenced Files (Section 2.4)). The exception to this is that the body or url MAY be absent if it is redacted."'
        constrained_by_locator: "§4.5.9"
        constrained_by: []
        notes: 'Word for word identical to §4.4.7. The difference between analysis and attachment carriage is not here but in mediatype: §4.5.4 downgrades it to SHOULD and offers vendor/product/schema as the fallback identification, where §4.4.5 keeps it a MUST for inline content.'

  - name: extension-mechanism
    locator: "§1.2, §2.5, §4.1.3, §4.1.4"
    encoding: "two top-level string arrays plus an out-of-band document contract"
    normative_status: normative
    semantics: 'The single most consequential mechanism in the container for a consumer, because it is the only one that can require a consumer to REFUSE a document it can otherwise parse. The vcon version parameter was retired in its favour: "The extension mechanism replaces the need for schema versioning." (§4.1.1)'
    fields:
      - name: extensions
        json_type: "String[]"
        cardinality: "0..1 array, 0..n members"
        required: false
        locator: "§4.1.3"
        semantics: 'Verbatim: "The extensions parameter SHOULD contain the list of names of all vCon extensions for any parameters used that are not defined in this core vCon schema document."'
        constrained_by_locator: "§4.1.3"
        constrained_by: []
        notes: 'Advisory only. SHOULD, not MUST, so a vCon may carry unregistered parameters without declaring them, and a consumer cannot treat the absence of extensions as proof that the document is pure core schema. Names come from the vCon Extensions Names Registry (§6.4), which this document creates and populates with nothing.'
      - name: critical
        json_type: "String[]"
        cardinality: "0..1 array, 0..n members"
        required: false
        locator: "§4.1.4, §2.5"
        semantics: 'The rejection list. Verbatim: "Implementations that include extensions which are incompatible with the core vCon schema MUST list the names of those extensions in the critical parameter. A vCon that includes a critical parameter indicates that correct interpretation of the vCon requires explicit support for the listed extensions. An implementation that does not recognize or support the extensions listed in the critical parameter MUST NOT attempt to process or operate on the vCon, except to reject it or report unsupported content."'
        constrained_by_locator: "§4.1.4"
        constrained_by: []
        notes: 'Restated at §2.5 with the same force: "when disruptive extensions are necessary, the names of all such extensions *MUST* be listed in the critical (Section 4.1.4) parameter of the vCon" and "Implementations that encounter a vCon containing a disruptive extension listed in the critical parameter, but do not support that extension, *MUST NOT* process the vCon except to reject it or notify the user." Note what the obligation is NOT: it does not say a listed name must also appear in extensions, it does not say critical may not name a core parameter, and it does not say what a consumer does with an unknown parameter that is in neither list. It was called must_support before this revision (§7.1).'
      - name: compatible-extension-class
        json_type: classification
        cardinality: "1"
        required: false
        locator: "§2.5"
        semantics: 'Verbatim: "*Compatible*: These extensions introduce additional data or fields without altering the meaning or structure of existing elements. Implementations that do not recognize these extensions can safely ignore them while maintaining valid processing of the vCon."'
        constrained_by_locator: "§2.5"
        constrained_by: []
        notes: 'Verbatim on preference: "Wherever feasible, extensions *SHOULD* be designed as *Compatible* to preserve compatibility with existing implementations."'
      - name: incompatible-extension-class
        json_type: classification
        cardinality: "1"
        required: false
        locator: "§2.5"
        semantics: 'Verbatim: "*Incompatible*: These extensions modify existing semantics or schema definitions in ways that render a vCon incompatible with implementations that do not support the extension. Interpreting such a vCon correctly requires explicit awareness of the extension."'
        constrained_by_locator: "§2.5"
        constrained_by: []
        notes: 'The document concedes the line is not crisp: "The question of Compatible vs Incompatible is a little subjective." It then makes the classification depend on the CONSUMER, not the extension: a transcriber "will likely only need to look at the critical extensions", whereas "the redactor perhaps should reject vCons with any extension that it does not support." So critical is calibrated for one class of consumer and under-protects another. This is the design finding to carry forward.'
      - name: extension-redefinition-scope
        json_type: capability
        cardinality: "1"
        required: false
        locator: "§2.5"
        semantics: 'What an extension is permitted to do. Verbatim: "A vCon extension can define new parameters at any level of the schema. It can also redefine the semantics of or deprecate existing parameters."'
        constrained_by_locator: "§2.5"
        constrained_by: []
        notes: 'Redefinition of existing parameters means no parameter in this file can be assumed stable in the presence of an extension a consumer does not recognise. Combined with extensions being only SHOULD-declared, a consumer has no reliable signal that redefinition has occurred unless the extension author also listed it in critical.'
      - name: any-object-placement
        json_type: wildcard-member
        cardinality: "0..n in every object"
        required: false
        locator: "§2.5, Appendix C (extension_parameters_type)"
        semantics: 'Where an extension parameter may appear. §2.5 says "A vCon extension can define new parameters at any level of the schema"; Appendix C makes that concrete by appending extension_parameters_type = ( * tstr => any ) to EVERY object it defines — the unsigned vCon, Redacted, Amended, Party, Civicaddress, Dialog, Party_History, Attachment, Analysis, the signed and encrypted forms and every header object. The comment reads "Extension parameters MAY appear in any object (Section 2.5)".'
        constrained_by_locator: "§2.5"
        constrained_by: []
        notes: 'This wildcard is what makes Appendix C unable to express a prohibition, by its own admission, and it is why no closed-world validation of a vCon is possible: any object may carry any additional member, so an unknown parameter is never by itself an error. A consumer that wants to reject unknown members has to do it outside the schema, and §2.5 tells the redactor to do exactly that: "the redactor perhaps should reject vCons with any extension that it does not support."'
      - name: extension-document-contract
        json_type: document-structure
        cardinality: "1"
        required: true
        locator: "§2.5"
        semantics: 'Sections an extension document MUST contain, verbatim as named: "*Extension Name*", "*Parameter Definitions*", "*Compatibility Considerations*", "*Incompatibility Considerations*", "*Privacy and Integrity Considerations*". Introduced by: "In addition to the standard sections of an Internet-Draft, a vCon extension document MUST also contain the following sections."'
        constrained_by_locator: "§2.5"
        constrained_by: []
        notes: 'Parameter Definitions carries a naming rule that binds every future parameter: "Use the snake case naming convention for all parameter names, as opposed to camel case." The Privacy and Integrity section is the one that matters to us: it requires an extension to state "whether any of them can carry party-identifying data or PII and how a redactor is expected to handle them" and whether it introduces new external content references and their integrity mechanism.'

  - name: vcon-json-object-forms
    locator: "§3, §4, §5.2, §5.3, §6.2"
    encoding: "one JSON document, in one of three forms, optionally gzip wrapped"
    normative_status: normative
    semantics: 'Verbatim: "The JSON form of a vCon is contained in a JSON object in one of three forms:" followed by the three bullets unsigned, signed and encrypted. The forms nest rather than alternate freely: the unsigned object is the innermost payload of both others.'
    fields:
      - name: unsigned
        json_type: object
        cardinality: "1 of 3"
        required: conditional
        locator: "§3, §4"
        semantics: 'The bare container. Verbatim: "The unsigned form of the vCon has a single top level object. This top level vCon object is also contained as described in the signed (Section 5.2) and encrypted (Section 5.3) forms of the vCon." Its reason to exist is the in-progress case: "a vCon will be partially constructed and in process as conversation data is collected."'
        constrained_by_locator: "§4"
        constrained_by: []
        notes: 'Verbatim on minimum content: "A vCon in the unsigned form SHOULD contain at least one of the parties, dialog, analysis or attachments parameters." SHOULD, not MUST — which is what breaks §5.4 form detection for a metadata-only vCon.'
      - name: signed
        json_type: object
        cardinality: "1 of 3"
        required: conditional
        locator: "§5.2"
        semantics: 'A JWS General JSON Serialization whose payload is the unsigned form. Verbatim: "signed form - JWS signed document with the unsigned vCon form contained in the payload" (§2.1). Decomposed below as signed-vcon-object.'
        constrained_by_locator: "§5.2"
        constrained_by: []
        notes: 'Verbatim on when it is expected: "Before a vCon leaves a security domain, it SHOULD be signed to prevent it from being altered." (§5) and "Any time a vCon is shared outside its original security domain, it SHOULD be signed and optionally encrypted." (§5)'
      - name: encrypted
        json_type: object
        cardinality: "1 of 3"
        required: conditional
        locator: "§5.3"
        semantics: 'A JWE General JSON Serialization whose ciphertext is the SIGNED form, never the unsigned one. Verbatim: "encrypted form - encrypted JWE document with the JWS signed vCon form contained in the ciphertext" (§2.1). Verbatim on the ordering obligation: "A vCon MUST be signed first using JWS as defined in Signed Form of vCon Object (Section 5.2), then encrypted using JWE as opposed to just encrypted with integrity protection." Decomposed below as encrypted-vcon-object.'
        constrained_by_locator: "§5.3"
        constrained_by: []
        notes: 'Verbatim on persistence of the signature: "vCons may be stored in unencrypted form, but the signed form MUST be maintained to ensure its integrity." And on transport: "vCons transported over non-secure channels such as email MUST be in the encrypted form." (§5) The sign-then-encrypt order is justified by lifetime, not by cryptography: "The signing is likely for the lifetime of the vCon, where the encryption may be shorter term or domain specific."'

  - name: form-differentiation
    locator: "§5.4"
    encoding: "presence tests over top-level JSON member names, plus a pre-JSON gzip test"
    normative_status: normative
    semantics: 'How a consumer decides what it is holding. There is no version field to consult (vcon is deprecated), no media type inside the document, and no envelope tag: discrimination is entirely by which top-level members are present. Verbatim framing, in two consecutive sentences separated in the source by one sentence about gzip compression: "vCons in the unsigned, signed and encrypted form are all valid JSON." and "It is necessary to distinguish which form a vCon is in, and whether it is compressed, in order to properly handle it. For example a signed vCon needs to be verified. The following is the recommended approaches to identifying which form a particular vCon is in:"'
    fields:
      - name: unsigned-test
        json_type: presence-disjunction
        cardinality: "1"
        required: false
        locator: "§5.4"
        semantics: 'Verbatim: "The presence of one or more of the following parameters indicates that the vCon is in the unsigned form:" parties, dialog, analysis, attachments.'
        constrained_by_locator: "§5.4"
        constrained_by: []
        notes: 'DEFECT. The four members this test keys on are all optional (§4.1.10 to §4.1.13), and §4 only SHOULD-requires one of them to be present. The two members that are actually mandatory, uuid and created_at, are not part of the test. So a legal unsigned vCon carrying only uuid, created_at and subject matches no rule in §5.4 at all. The test is also a disjunction while the other two are conjunctions, so it is the weakest of the three and will match first on anything malformed.'
      - name: signed-test
        json_type: presence-conjunction
        cardinality: "1"
        required: false
        locator: "§5.4"
        semantics: 'Verbatim: "The presence of both of the following parameters indicates that the vCon is in the signed (JWS) form:" payload, signatures.'
        constrained_by_locator: "§5.4"
        constrained_by: []
        notes: 'Matches §5.2, which defines exactly those two top-level members. Both are mandatory there, so this test is sound.'
      - name: encrypted-test
        json_type: presence-conjunction
        cardinality: "1"
        required: false
        locator: "§5.4"
        semantics: 'Verbatim: "The presence of both of the following parameters indicates that the vCon is in the encrypted (JWE) form:" ciphertext, recipients.'
        constrained_by_locator: "§5.4"
        constrained_by: []
        notes: 'Sound against §5.3, which lists both. Note it deliberately does not key on unprotected, which is the member a JWE Flattened Serialization would also lack.'
      - name: gzip-test
        json_type: pre-json-test
        cardinality: "1"
        required: false
        locator: "§5.4, §6.2"
        semantics: 'Applied BEFORE any of the above, because the bytes are not JSON. Verbatim: "A gzip compressed vCon is not JSON and is differentiated from the JSON forms before the above parameter based rules can be applied. The gzip compressed vCon SHOULD be identified by the media type "application/vcon+gzip" when a media type is available, such as in the [HTTPS] Content-Type header. When no media type is available, a gzip compressed vCon can be identified by the gzip member header magic numbers defined in section 2.3.1 of [GZIP]. Once decompressed, the contained vCon is in one of the JSON forms and is differentiated using the parameter based rules above."'
        constrained_by_locator: "§5.4"
        constrained_by: []
        notes: 'gzip is a modifier on all three forms, not a fourth form. §6.2 registers application/vcon+gzip and sets the support asymmetry: "Applications SHOULD support the receiving of gzip format vCons, but do not need to use the gzip format when sending." A signed vCon may also be gzipped INSIDE the JWS rather than outside it: §5.2 says the payload holds "either: the unsigned form of the JSON vCon; or the gzipped [GZIP] unsigned form of the JSON vCon", which the §5.4 rules do not cover, since the compression is then invisible until after signature verification and is signalled only by cty.'

  - name: unsigned-vcon-object
    locator: "§4, §4.1"
    encoding: "JSON object; the top-level container and the payload of both other forms"
    normative_status: normative
    semantics: 'The vCon proper. Thirteen defined members plus one registry-reserved name. Two are mandatory (uuid, created_at); the four content arrays are all optional, and two of the remaining members are mutually exclusive with each other.'
    fields:
      - name: vcon
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.1.1"
        semantics: 'The syntactic version of the JSON format. Verbatim: "The "vcon" parameter is DEPRECATED as of the publication of this document as an RFC." Verbatim on its value when present: "For syntax defined in this document, the string MUST have the value: "0.4.0""'
        constrained_by_locator: "§4.1.1"
        constrained_by: []
        values:
          - '"0.4.0"'
        notes: 'Deprecated but still constrained: a MUST on the value of a parameter nothing requires you to send. Section 7 nevertheless documents non-upward-compatible changes BY version number (0.0.1, 0.0.2, 0.3.0, 0.4.0), so the only field that could carry those version numbers is the one being retired. Verbatim on the replacement: "The extension mechanism replaces the need for schema versioning."'
      - name: uuid
        json_type: String
        cardinality: "1"
        required: true
        locator: "§4.1.2"
        semantics: 'The identity of this vCon instance version. Verbatim: "The UUID value MUST be globally unique. All vCon documents MUST have the uuid parameter and value set."'
        constrained_by_locator: "§4.1.2"
        constrained_by: []
        notes: 'Generation is SHOULD, not MUST, and is unusual: a version 8 UUID "generated identically to a version 7 UUID with the exception that:" followed by two bullets, "rand_b/custom_c is generated from the high 62 bits of the SHA-1 hash of the FQHN string" and "the variant and version fields are set as described for version 8 UUID". The domain is tied to the signer: "The DNS name string used in generating the uuid value SHOULD be the same FQHN, or a subdomain to allow for more distributed generation of UUIDs, as would used in the signing certificate as they are the same domains of uniqueness." This is the join key for redacted and amended, for the JWS header uuid and for the JWE unprotected uuid, so it is the one value whose stability the whole versioning model rests on.'
      - name: extensions
        json_type: "String[]"
        cardinality: "0..1"
        required: false
        locator: "§4.1.3"
        semantics: 'Names of all extensions whose parameters appear. See the extension-mechanism structure.'
        constrained_by_locator: "§4.1.3"
        constrained_by: []
      - name: critical
        json_type: "String[]"
        cardinality: "0..1"
        required: false
        locator: "§4.1.4"
        semantics: 'Names of extensions a consumer MUST support or else refuse the vCon. See the extension-mechanism structure.'
        constrained_by_locator: "§4.1.4"
        constrained_by: []
      - name: created_at
        json_type: Date
        cardinality: "1"
        required: true
        locator: "§4.1.5"
        semantics: 'Verbatim: "The created_at parameter provides the creation time of this vcon, which MUST be present, and should not change once the vcon object is created."'
        constrained_by_locator: "§4.1.5"
        constrained_by: []
        notes: 'The immutability clause is lowercase "should", so it is not a BCP 14 obligation. With uuid, one of the only two mandatory members of the whole container.'
      - name: updated_at
        json_type: Date
        cardinality: "0..1"
        required: false
        locator: "§4.1.6"
        semantics: 'Last modification time, and for signed forms the signing time. Verbatim: "For unsigned forms, the updated_at of the vcon object SHOULD be updated as it is modified. For signed forms of the vCon object, the updated_at contains the time when this vcon was last signed. Future updates MUST first set the updated_at to the new signing time as the vcon object is signed again."'
        constrained_by_locator: "§4.1.6"
        constrained_by: []
        notes: 'The field means two different things depending on the enclosing form, and the two readings are not distinguishable from the value. The MUST is an ordering constraint on the signer: set updated_at, then sign, so the timestamp falls inside the signed bytes.'
      - name: subject
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.1.7"
        semantics: 'The topic of the conversation. Verbatim: "The string value of the subject parameter is a free formed JSON string with no constrained syntax."'
        constrained_by_locator: "§4.1.7"
        constrained_by: []
        notes: 'May be derived rather than observed: "The subject may also be derived from analysis of the dialog." A consumer cannot tell which from the container, and nothing records the provenance of a derived subject.'
      - name: redacted
        json_type: Redacted
        cardinality: "0..1"
        required: false
        locator: "§4.1.8"
        semantics: 'A reference BACK to a less redacted prior vCon instance version. Declaration verbatim: "redacted: "Redacted" (optional, mutually exclusive with amended parameter)". Decomposed below as redacted-object.'
        constrained_by_locator: "§4.1.8"
        constrained_by: []
        notes: 'Linkage direction matters: the redacted vCon points at the unredacted one, never the reverse, so possession of the public document never leaks the existence of its PII-bearing parent except through this pointer. Verbatim on protecting it: "If a reference to the unredacted vCon is provided in the url parameter, the access to that URL MUST be restricted to only those who should be allowed to see the identity or PII for the redacted vCon." And §5: "The non-redacted version of the vCon referenced from the redacted vCon MUST be encrypted such that only those with permission to view the non-redacted content can decrypt it."'
      - name: amended
        json_type: Amended
        cardinality: "0..1"
        required: false
        locator: "§4.1.9"
        semantics: 'A reference back to the prior vCon instance version this one adds to. Declaration verbatim: "amended: "Amended" (optional, mutually exclusive with redacted parameter)". Decomposed below as amended-object.'
        constrained_by_locator: "§4.1.9"
        constrained_by: []
        notes: 'Verbatim on why it exists and what it contains: "A signed or encrypted vCon cannot be modified without invalidating it. In these cases, to allow for adding of additional information a new vCon instance version MUST be created." and "the newer version of the vCon is a deep copy of the prior version with the amended and additional data added to it." Deep copy, not delta: the amended vCon is self-contained, and the reference is provenance rather than a required dereference. Renamed from "appended" in this revision (§7.1).'
      - name: mutual-exclusion-of-redacted-and-amended
        json_type: constraint
        cardinality: "1"
        required: true
        locator: "§4.1.8, §4.1.9"
        semantics: 'Stated twice, once in each declaration, as "(optional, mutually exclusive with amended parameter)" and "(optional, mutually exclusive with redacted parameter)". A vCon instance version is therefore either a redaction of its parent or an amendment of it, never both.'
        constrained_by_locator: "§4.1.8"
        constrained_by: []
        notes: 'Recorded as a field because it is a normative constraint of the top-level object that belongs to no single member. Consequence worth naming: a domain that must both add analysis and strip PII in one step cannot describe what it did — it must emit two instance versions, and the document never says in which order. The two informational schemas disagree about it: Appendix B does NOT encode the exclusion — redacted and amended are independent properties there and no combinator relates them, so JSON Schema validation accepts a document the text forbids — while Appendix C does, writing it as the CDDL group choice "? ( redacted: redacted_object_type // amended: amended_object_type )". An implementer who validates with the JSON Schema alone will not catch this; one who validates with the CDDL will.'
      - name: parties
        json_type: "Party[]"
        cardinality: "0..1 array, 0..n members"
        required: false
        locator: "§4.1.10"
        semantics: 'Verbatim: "Whether the parties were observers, passive or active participants in the conversation, they each are included as a Party Object in the parties array."'
        constrained_by_locator: "§4.1.10"
        constrained_by: []
        notes: 'REFERENTIAL ANCHOR. Dialog.parties, Dialog.originator, Dialog.transferee, Dialog.transferor, Dialog.transfer_target, Party_History.party and Attachment.party are all integer indices into THIS array. Nothing in the document range-checks them, states a consumer behaviour on an out-of-range index, or forbids a dangling one. The array is optional, so a vCon may carry dialogs whose party indices point into an array that does not exist.'
      - name: dialog
        json_type: "Dialog[]"
        cardinality: "0..1 array, 0..n members"
        required: false
        locator: "§4.1.11"
        semantics: 'The captured conversation. Verbatim on ordering: "It should be noted that the Dialog Objects may not be sorted in chronological order. They are in the order that they were added. It is the applications responsibility to sort dialog and transcriptions if they are needed in chronological order."'
        constrained_by_locator: "§4.1.11"
        constrained_by: []
        notes: 'REFERENTIAL ANCHOR. Dialog.recordings, Dialog.recording_set, Dialog.original, Dialog.consultation, Dialog.target_dialog, Attachment.dialog and Analysis.dialog are indices into this array. Index stability is load-bearing and is stated only indirectly, in §4.3.2: "Dialog Objects in the dialog array are in order that they were added to the vCon and cannot be reordered with out correcting the dialog indices which occur in other Objects in the vCon."'
      - name: analysis
        json_type: "Analysis[]"
        cardinality: "0..1 array, 0..n members"
        required: false
        locator: "§4.1.12"
        semantics: 'Verbatim: "Analysis, which is performed on the conversational data, is stored in the analysis Objects array."'
        constrained_by_locator: "§4.1.12"
        constrained_by: []
        notes: 'Not itself a referential anchor: nothing indexes into analysis. It is the array that typically grows across an amended instance version (see Figure 2, §4.1.9.1).'
      - name: attachments
        json_type: "Attachment[]"
        cardinality: "0..1 array, 0..n members"
        required: false
        locator: "§4.1.13"
        semantics: 'Verbatim: "Ancillary documents, discussed, presented, referenced or related to the conversation may be stored in the attachments array. It should be noted that the Attachment Objects may not be sorted in chronological order. They are in the order that they were added."'
        constrained_by_locator: "§4.1.13"
        constrained_by: []
        notes: 'REFERENTIAL ANCHOR for Analysis.attachment. Index stability is stated at §4.4.2: Attachment Objects "cannot be reordered with out correcting the attachment indices which may occur in other Objects in the vCon."'
      - name: group
        json_type: unspecified
        cardinality: unspecified
        required: false
        locator: "§6.3.2 (registry only)"
        semantics: 'A top-level parameter name registered in the vCon Object Parameter Names Registry with the description "reserved for future extension" and a Specification Document of "RFC XXXX" — this document. It has no definition in §4 and no type.'
        constrained_by_locator: "§6.3.2"
        constrained_by: []
        notes: 'DEFECT, recorded rather than resolved. The registry entry cites this document as the specification for a parameter this document never specifies. A consumer implementing from §4 alone will not know the name is taken; an extension author reading the registry will be blocked from using it without knowing why. Listed here so the field inventory of the top-level object is complete against the registry as well as against §4.'

  - name: redacted-object
    locator: "§4.1.8.1"
    encoding: "JSON object; the value of the top-level redacted member"
    normative_status: normative
    semantics: 'A back-pointer from a redacted vCon to the less redacted vCon it was derived from, with an optional retrievable location and a mandatory hash when that location is given. Verbatim on purpose: "The purpose of the Redacted Object (Section 4.1.8.1) is to provide the reference to the unredacted or less redacted version of the vCon from which this vCon was derived."'
    fields:
      - name: uuid
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.1.8.1"
        semantics: 'Verbatim: "The value contains the uuid string value (Section 4.1.2) of the unredacted/prior vCon instance version. The absence of a value for uuid indicates that the less redacted version of this vCon is not available or does not exist."'
        constrained_by_locator: "§4.1.8.1"
        constrained_by: []
        notes: 'SOURCE DEFECT, left unresolved here rather than decided. The parameter is declared bare, as "uuid: "String"", and §2.2 says "All parameters are assumed to be mandatory unless otherwise noted" — so by the document''s own default rule it is mandatory. Yet §4.1.8 says only that the object "SHOULD contain the uuid parameter", and the very next sentence of §4.1.8.1 gives its absence a defined meaning, which a mandatory parameter cannot have. The two readings cannot both hold. §4.1.9.1 shows the author knew how to say it, marking the Amended Object''s uuid "(optional if external reference provided)"; §4.1.8.1 carries no such marker. Both informational schemas take the opposite side from the §2.2 default and from each other''s silence: Appendix B lists type — not uuid — as the single required member of the Redacted Object, and Appendix C writes "? uuid" with "type: tstr" mandatory. This file records required: false because the defined-absence sentence is the more specific statement, and flags the contradiction rather than treating it as settled. Note too that the absence is OVERLOADED: it means both "no less redacted version exists" and "one exists but is not available", and a consumer cannot tell which.'
      - name: type
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.1.8.1"
        semantics: 'What kind of redaction was performed relative to the referenced version. Verbatim: "The value of the redacted type parameter is used to indicate the type of redaction that was performed on this vCon relative to the less redacted version referenced by the redacted uuid parameter. This should indicate the type of information that was redacted."'
        constrained_by_locator: "§4.1.8.1"
        constrained_by: []
        notes: 'No enumeration and no registry. §5 names two example levels in prose — "PII masked to remove PII data in the text, audio, video or transcripts" and "De-identified to remove segments or whole recordings that might be used for voice printing or facial recognition" — and §2.1 defines de-identification and PII masked as terms, but neither is given as a token value for this field. CONTRADICTION, and both informational schemas take the same wrong side: Appendix B makes type the single REQUIRED member of the Redacted Object and Appendix C writes it as mandatory "type: tstr" with "? uuid" optional, while §4.1.8 requires nothing of type and only SHOULD-requires uuid. Per both appendices the text governs, so type is recorded as conditional, not required. The pairing is suggestive: the appendices appear to have swapped the obligations of uuid and type relative to the prose.'
      - name: url
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.1.8.1, §2.4.1"
        semantics: 'HTTPS location of the referenced vCon. Verbatim: "The the location of the referenced vCon MAY be provided as defined in Externally Referenced Files (Section 2.4) by including url and content_hash."'
        constrained_by_locator: "§4.1.8.1"
        constrained_by: []
        notes: 'Access control on this URL is normative and is the strongest privacy statement in the document: "the access to that URL MUST be restricted to only those who should be allowed to see the identity or PII for the redacted vCon" (§4.1.8).'
      - name: content_hash
        json_type: "ContentHash | ContentHash[]"
        cardinality: "0..1"
        required: conditional
        locator: "§4.1.8.1, §2.4.2"
        semantics: 'Integrity binding for the referenced vCon. Verbatim: "content_hash MUST be included if url is provided."'
        constrained_by_locator: "§4.1.8.1"
        constrained_by: []
        notes: 'This hash is what makes the redaction chain verifiable: it is computed over the prior instance version, and it sits inside the bytes the current vCon signature covers. Note the hash binds the referenced document, not the redaction itself — nothing lets a consumer check that the redaction was faithful. §4.1.8 says so plainly: "The assurance of the accuracy of the redaction is made by the entity that creates the redaction which SHOULD sign the redacted version of the vCon."'

  - name: amended-object
    locator: "§4.1.9.1"
    encoding: "JSON object; the value of the top-level amended member"
    normative_status: normative
    semantics: 'A back-pointer from an amended vCon to the prior instance version it deep-copied and added to. Same three-member shape as the Redacted Object minus type, with the uuid obligation stated the other way round.'
    fields:
      - name: uuid
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.1.9.1"
        semantics: 'Declared verbatim as: "uuid: "String" (optional if external reference provided)". Verbatim on the value: "The value contains the uuid string value (Section 4.1.2) of the unredacted/original vCon instance version."'
        constrained_by_locator: "§4.1.9.1"
        constrained_by: []
        notes: 'Required unless url is present — the inverse of the Redacted Object, where uuid is SHOULD and its absence is MEANINGFUL. The informational Appendix B schema encodes this correctly with an if/not-required-url/then-required-uuid pair, so here the schema and the text agree. The §4.1.9 prose is weaker than the declaration, saying only "The prior vCon instance version SHOULD be referenced via the uuid of the prior vCon instance version, and MAY include the url and content_hash parameters". Note the word "unredacted" in the value description is a copy-paste from §4.1.8.1; an amendment has nothing to do with redaction.'
      - name: url
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.1.9.1, §2.4.1"
        semantics: 'HTTPS location of the prior instance version. Verbatim: "The location of the referenced vCon MAY be provided, as defined in Externally Referenced Files (Section 2.4) by including url and content_hash."'
        constrained_by_locator: "§4.1.9.1"
        constrained_by: []
        notes: 'No access-control obligation is attached here, unlike the redacted url. That is consistent — the prior version of an amended vCon holds LESS data, not more — but it means the two objects have different security postures despite identical shape.'
      - name: content_hash
        json_type: "ContentHash | ContentHash[]"
        cardinality: "0..1"
        required: conditional
        locator: "§4.1.9.1, §2.4.2"
        semantics: 'Verbatim: "content_hash MUST be provided if url is provided."'
        constrained_by_locator: "§4.1.9.1"
        constrained_by: []
        notes: 'As with redacted, the hash is the only cryptographic link between instance versions. Figure 2 shows the intended chain: a JWS signed amended vCon whose payload names, in its amended member, a JWS signed original vCon. The amended object may point at the SIGNED form of the parent, so the hash is over the JWS document, not over the unsigned vCon inside it. The document never says which, and the choice is not recoverable from the token.'
        inferred: 'that the hash covers whichever representation the url returns — the source never states the hash input for a vCon reference as it does for a file'

  - name: party-object
    locator: "§4.2"
    encoding: "JSON object; an element of the top-level parties array"
    normative_status: normative
    semantics: 'Who was on the conversation. Every member is optional, including all of them at once. Verbatim: "it is possible to have a Party Object with no parameters in it. A Party Object SHOULD be created for each participant. This may result in more than one empty Party Object. They are distinct by the order or index in the Party Object array."'
    fields:
      - name: tel
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.1"
        semantics: 'Verbatim: "The value of the tel parameter SHOULD be a valid [TEL] URL. The URL scheme prefix (i.e. "tel:") is optional."'
        constrained_by_locator: "§4.2.1"
        constrained_by: []
        notes: 'Optional scheme prefix means two spellings of the same identifier are both legal, so equality comparison of parties by tel requires normalisation the document does not define.'
      - name: sip
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.2"
        semantics: 'Verbatim: "The value of the sip parameter is the addr-spec as defined in section 25.1 of [SIP]."'
        constrained_by_locator: "§4.2.2"
        constrained_by: []
        notes: 'The IANA registry at §6.3.3 cites Section 4.2.1 for this parameter; the definition is at §4.2.2. Minor source defect.'
      - name: stir
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.3"
        semantics: 'Verbatim: "The string value of the stir parameter contains the [PASSporT] in the JWS Compact Serialization form."'
        constrained_by_locator: "§4.2.3"
        constrained_by: []
        notes: 'A second, independent signature object nested inside the vCon, over the call setup rather than over the conversation. Nothing in the document requires the identity it asserts to agree with tel, sip or name, and nothing requires a consumer to verify it.'
      - name: mailto
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.4"
        semantics: 'Verbatim: "It MAY be provided in any common form, such as a bare address or a [MAILTO] URL; when a [MAILTO] URL is used, the "mailto:" scheme prefix is optional."'
        constrained_by_locator: "§4.2.4"
        constrained_by: []
        notes: 'Three legal spellings of one address (bare, mailto URL, mailto URL without prefix). Same comparison problem as tel, and worse, since a bare address and a mailto URL are not distinguishable by a prefix test.'
      - name: name
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.5"
        semantics: 'Verbatim: "The string value of the name parameter is a free form JSON string in which part or all of the party''s name can be included."'
        constrained_by_locator: "§4.2.5"
        constrained_by: []
        values:
          - '"anonymous" — the one reserved value'
        notes: 'The anonymity convention is normative-ish and load-bearing for redaction. Verbatim: "This MAY be indicated by creating a Party Object with only the name parameter and setting its value to "anonymous". A Party Object SHOULD be create for each anonymous party in the conversation. This is necessary to capture the number of parties and distinction between which party contributed what data or dialog in the conversation." So a redactor removes identity but must PRESERVE cardinality and index position — the same invariant §4.1.8 states for arrays generally.'
      - name: did
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.6"
        semantics: 'Verbatim: "The value of the did parameter MUST be a valid DID URI that enables verifiable, decentralized digital identity for the party."'
        constrained_by_locator: "§4.2.6"
        constrained_by: []
        notes: 'The only party identifier carrying a MUST on its syntax. The document adds that "The DID can refer to any subject (person, organization, thing, etc.) as determined by the controller of the DID", so a DID here does not imply the party is a person.'
      - name: validation
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.2.7"
        semantics: 'A label naming HOW the party identity was checked, not the evidence. Declared verbatim: "validation: "String" (SHOULD be provided if name parameter is provided)".'
        constrained_by_locator: "§4.2.7"
        constrained_by: []
        values:
          - '"none"'
          - 'enterprise or domain defined token or string values'
        notes: 'Verbatim on the confidentiality boundary: "For confidentially reasons, it SHOULD NOT contain the data used to validate the name. However it MAY name the data used to validate the name (e.g. "SSN", "DOB", "user ID and password")." The examples are instructive: naming the CATEGORY of evidence is permitted even though the category is itself disclosive. Verbatim on who defines the vocabulary: "It is up to the domain creating the vCon to define the set of tokens or values to be used for the validation parameter." — so this field is not interoperable by construction.'
      - name: gmlpos
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.8"
        semantics: 'Geodetic position of the party at conversation start. Verbatim: "The gmlpos parameter value contains a string of the same format as the gml:pos element defined in section 3.2 of the [PIDF-LO] PIDF."'
        constrained_by_locator: "§4.2.8"
        constrained_by: []
        notes: 'Snapshot, not a track: "the latitude and longitude of the location of the party at the time of the conversation start." No CRS, precision or uncertainty is carried, and no obfuscation policy is defined, which makes this one of the two fields a redactor must always consider (the other is civicaddress).'
      - name: civicaddress
        json_type: Civicaddress
        cardinality: "0..1"
        required: false
        locator: "§4.2.9"
        semantics: 'Civic address of the party. Decomposed below as civicaddress-object.'
        constrained_by_locator: "§4.2.9"
        constrained_by: []
      - name: uuid
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.10"
        semantics: 'A stable identifier for the PARTICIPANT across conversations, distinct from the vCon uuid. Verbatim: "In a contact center, this is particularly important for the call agent participant, and must be static across interactions to allow correlation with the actual agent configuration provisioned into the systems."'
        constrained_by_locator: "§4.2.10"
        constrained_by: []
        notes: 'Verbatim on its syntax: "The value is not constrained to the syntax defined in [UUID]. Operators often have existing methods of generating unique participant identifiers and MAY use any unique string value." So a member named uuid is explicitly NOT a UUID — a name collision with §4.1.2 that an implementer typing against the schema will hit. Note also the lowercase "must be static across interactions", which is an un-keyworded obligation on a cross-conversation linkable identifier; this is the field that defeats redaction if a redactor forgets it.'
      - name: type
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.11"
        semantics: 'What kind of participant this is. Verbatim: "The value of the type parameter SHOULD be one of the following: "person", "bot", "organization""'
        constrained_by_locator: "§4.2.11"
        constrained_by: []
        values:
          - '"person"'
          - '"bot"'
          - '"organization"'
        notes: 'SHOULD, and no IANA registry is created for these tokens, unlike the Dialog type names and the party_event names. So the enumeration is open in practice and unextensible by registration.'
      - name: org
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.12"
        semantics: 'Verbatim: "The org parameter is a free form text string for containing the organization identifier."'
        constrained_by_locator: "§4.2.12"
        constrained_by: []
      - name: dept
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.2.13"
        semantics: 'Verbatim: "The dept parameter is a free form text string for containing the party''s department identifier."'
        constrained_by_locator: "§4.2.13"
        constrained_by: []

  - name: civicaddress-object
