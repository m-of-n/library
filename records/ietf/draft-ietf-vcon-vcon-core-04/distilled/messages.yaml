  - name: dialog-type-enumeration
    locator: "§4.3.1.1, §4.3.1.2, §4.3.1.3, §4.3.1.4, §4.3.1.5"
    encoding: "the five legal values of Dialog.type, each a distinct structural contract"
    normative_status: normative
    semantics: 'Not a label but a schema selector. Two of the five carry Dialog Content, three carry none, and one of the three makes a different parameter mandatory instead. Registered in the Dialog Type Name Registry (§6.3.4.1.2) with these five initial values.'
    fields:
      - name: recording
        json_type: enum-value
        cardinality: "1 of 5"
        required: conditional
        locator: "§4.3.1.1"
        semantics: 'Verbatim: "A dialog of type "recording" has Dialog Content that either contains a body or refers to via url, which is a recording of the video and/or audio of a segment of the conversation. A recording Dialog Object that is part of a set of recordings which collectively represent a call or session, may reference the associated recording-set Dialog Object via the recording_set parameter (see Section 4.3.7)."'
        constrained_by_locator: "§4.3.1.1"
        constrained_by: []
        notes: 'Carries content. The only type on which recording_set is legal. Note that message_id is permitted here as well as on text, which is odd for an audio recording and is unexplained.'
      - name: recording-set
        json_type: enum-value
        cardinality: "1 of 5"
        required: conditional
        locator: "§4.3.1.2"
        semantics: 'Verbatim: "A dialog of type "recording-set" contains metadata describing a set of "recording" Dialog Objects that collectively represent a call or session. The conversation itself is captured in the referenced "recording" Dialog Objects; a recording-set Dialog Object does not have Dialog Content (see Section 4.3.10). The recordings parameter identifies the "recording" Dialog Objects in the set (see Section 4.3.6). The start, duration, parties and session_id parameters of a recording-set Dialog Object describe the call or session as a whole."'
        constrained_by_locator: "§4.3.1.2"
        constrained_by: []
        notes: 'No content; recordings is mandatory. Added in this revision as the answer to a real problem stated in §4.3.4: per-party or periodically segmented recordings mean "no single recording Dialog Object necessarily identifies all parties participating in the conversation", so the set object is the only place a complete party list or a whole-session identifier can live.'
      - name: text
        json_type: enum-value
        cardinality: "1 of 5"
        required: conditional
        locator: "§4.3.1.3"
        semantics: 'Verbatim: "A dialog of type "text" has Dialog Content that either contains a body or refers to via url, which contains the text from one of the parties for a segment of the conversation."'
        constrained_by_locator: "§4.3.1.3"
        constrained_by: []
        notes: 'Carries content. The email mapping in §4.3.4 is the detailed case: the SMTP From header is the first index in parties and "They are the implied originator"; To, Cc and Bcc parties "should all be added in that order"; and "A text Dialog Object should only contain a single [SMTP] message." Bcc inclusion is policy, not schema: "The sender SHOULD be allowed to set a policy, through out of band means, as to whether they would like their application or server to include the Bcc parties in the vCon."'
      - name: transfer
        json_type: enum-value
        cardinality: "1 of 5"
        required: conditional
        locator: "§4.3.1.4"
        semantics: 'Verbatim: "A dialog of type "transfer" does not capture actual conversation exchange, but rather captures operations, parties and relations between dialog segments. The conversation is captured in other Dialog Objects; a transfer Dialog Object does not have Dialog Content (see Section 4.3.10). The Dialog Transfer parameters are used to show the roles and relationships between the parties and other Dialog Objects as the transfer process occurred."'
        constrained_by_locator: "§4.3.1.4"
        constrained_by: []
        notes: 'The most restricted type: of 24 parameters, 16 are X, one is "-", only type, start, application and the six transfer parameters are permitted. Notably parties is X here even though the transfer names three parties — they are carried by the role parameters instead, which is the one place the container uses named roles rather than a positional list.'
      - name: incomplete
        json_type: enum-value
        cardinality: "1 of 5"
        required: conditional
        locator: "§4.3.1.5"
        semantics: 'Verbatim: "A dialog of type "incomplete" captures a call or conversation that failed to be setup to the point of exchanging any conversation. As no conversation was exchanged, an incomplete Dialog Object does not have Dialog Content (see Section 4.3.10). An incomplete Dialog Object has a required disposition parameter which indicates why the call or conversation failed (see Section 4.3.11)."'
        constrained_by_locator: "§4.3.1.5"
        constrained_by: []
        notes: 'No content; disposition is mandatory and is the only parameter in the container whose M applies to exactly one type. This is the type that records a conversation that did not happen, which is why §4.3 permits a Dialog Object with nothing but type and disposition.'

  - name: dialog-parameter-applicability-by-type
    locator: "§4.3.1.6 (Table 1 and its legend and footnotes)"
    encoding: "a 24-row by 5-column constraint table over the Dialog Object"
    normative_status: normative
    semantics: 'The second schema of the Dialog Object, and the reason a Dialog Object that satisfies the JSON Schema can still be invalid. A consumer that checks types and required-members only will accept a recording-set carrying a body, a transfer carrying parties, or a recording carrying transferee — all of which this table forbids with MUST NOT. The per-row content is attached to each field of the dialog-object structure above under applicability, so it stays with the field it constrains; this structure carries the legend, the four footnotes and the finding. The source hedges its own status: "The parameter definitions in the subsections of this document are definitive; this table is provided as a summary." Every cell checked here against the per-parameter prose agrees with it. CENSUS, recounted cell by cell: 24 parameters x 5 types = 120 cells, of which X 57, O 30, S 19, M 9, SN 4 and — 1. HOW FAR THE APPENDICES REACH, since this is the question the two schemas are usually asked: both carry M and X and neither carries S, SN or —, but they fail differently and the difference is the finding. M: 7 of 9 in both, and the same 7; Appendix B then encodes the remaining two as footnote 1''s conditional while Appendix C demotes them to a comment. X: all 57 in both, enforceably in Appendix B and advisorily in Appendix C, which says so itself. S and SN: 0 in both, because a schema language''s verdict is binary and SHOULD is a third value; Appendix B leaves them unasserted, Appendix C renders SN as omission and so cannot tell it from X. O: 30 in both, but only as the default state, never as a positive assertion. —: 0 in both as schema, because — and O are syntactically identical and differ only in meaning; Appendix C alone preserves it, verbatim, in a comment on the transfer branch. That is the expressive ceiling of schema language, and it is the reason this table is reproduced here in full rather than delegated to either appendix.'
    fields:
      - name: "M"
        json_type: legend-symbol
        cardinality: "1"
        required: true
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "M  The parameter MUST be present."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
        notes: 'Appears for: type (all five types), recordings (recording-set), mediatype (recording, text — qualified by footnote 1), disposition (incomplete).'
      - name: "S"
        json_type: legend-symbol
        cardinality: "1"
        required: false
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "S  The parameter SHOULD be present."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
      - name: "O"
        json_type: legend-symbol
        cardinality: "1"
        required: false
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "O  The parameter is optional."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
      - name: "SN"
        json_type: legend-symbol
        cardinality: "1"
        required: false
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "SN  The parameter SHOULD NOT be present."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
        notes: 'Used for exactly one parameter: disposition, on the four non-incomplete types. A SHOULD NOT rather than a MUST NOT, so a recording carrying a disposition is discouraged but legal, which leaves a consumer no way to distinguish a failed call recorded as incomplete from one recorded as recording with a disposition tacked on.'
      - name: "X"
        json_type: legend-symbol
        cardinality: "1"
        required: true
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "X  The parameter MUST NOT be present."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
        notes: 'The symbol that does the work. 57 of the 120 cells in the table are X. The figure is easy to overcount: the four disposition cells on the non-incomplete types are SN, not X, and 57 + 4 is where a count of 61 comes from. Every X is a validity condition that no JSON type check will catch, and the informational Appendix B schema encodes ALL 57 of them, exactly — its five per-type prohibition lists hold 7 + 14 + 8 + 13 + 15 = 57 parameters and they match the table cell for cell, with nothing over and nothing under. Appendix C writes the same 57 by omitting each prohibited parameter from the per-type group, but cannot enforce any of them; see the two encoding rows below.'
      - name: "-"
        json_type: legend-symbol
        cardinality: "1"
        required: false
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "-  The parameter has no defined meaning for this type; it MAY be present but its semantics are undefined."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
        notes: 'Used in exactly one cell: duration on transfer. A deliberate third state between permitted and forbidden — the value may travel but means nothing, so a consumer must neither reject it nor act on it. Worth preserving as a pattern: it is a cheaper answer than X for a parameter whose prohibition would gain nothing.'
      - name: appendix-b-encoding
        json_type: informational-schema
        cardinality: "1"
        required: false
        locator: "Appendix B (definitions/Dialog/allOf)"
        semantics: 'The JSON Schema encodes the X cells as real constraints: a chain of if/then pairs keyed on "type" whose consequent is a "not" over an "anyOf" of "required" clauses, one per prohibited parameter. Per-type prohibition counts, read off the schema: transfer 13, recording-set 14, incomplete 15, recording 7, text 8 — 57 in all, which is every X cell in the table. It also encodes 7 of the 9 M cells: type on all five types, as the single entry of the Dialog definition''s own "required" list, plus recordings on recording-set and disposition on incomplete, each as an if/then. The remaining two M cells are mediatype on recording and on text, both carrying footnote 1; Appendix B encodes the FOOTNOTE rather than the flat M, as a type-agnostic if/then whose antecedent is body present and not the empty string and whose consequent requires mediatype, which is the more faithful reading since footnote 1 excuses mediatype for externally referenced content. Three of the four footnotes are encoded: 1 and 3 as that same body-conditional pair, and 4 as a "dependencies" entry mapping url to content_hash. Footnote 2 is a permission, so there is nothing to encode.'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
        notes: 'These prohibitions BITE: "required" is a closed test, so a transfer carrying parties fails Appendix B validation. What Appendix B does not encode is the S and SN cells, which are unenforceable by construction, and the referential constraints, which no JSON Schema can express. Note what it does NOT do with SN: disposition appears in none of the five prohibition lists, so Appendix B leaves the four SN cells unasserted rather than silently promoting them to X. That is the right call and it is the one place where Appendix B is more faithful to Table 1 than Appendix C. It covers section 4 only — its title is "vCon - Unsigned Form" — so none of section 5 is validated by it.'
      - name: appendix-c-encoding
        json_type: informational-schema
        cardinality: "1"
        required: false
        locator: "Appendix C (dialog_object_type and its five branches)"
        semantics: 'The CDDL encodes the table structurally instead, as a group choice over five per-type groups (dialog_recording_type, dialog_text_type, dialog_recording_set_type, dialog_transfer_type, dialog_incomplete_type) sharing dialog_common_type for start, duration and application — not for type, which each branch pins itself to its own string literal — and a dialog_session_group_type for session_id and party_history that the transfer branch deliberately omits. A prohibited parameter is prohibited by simply not appearing in its branch. On the M cells it reaches the same 7 of 9 that Appendix B does — type pinned to a string literal in each of the five branches, recordings in dialog_recording_set_type and disposition in dialog_incomplete_type, all seven written without the CDDL optional marker. The other two it loses: mediatype on recording and on text is written "? mediatype" with footnote 1 moved into a comment, "mediatype MUST be present for inline content; not required when Dialog Content is absent", so the obligation survives only as prose. Appendix B encodes that same footnote as a live conditional.'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
        notes: 'And the CDDL disclaims its own prohibitions, verbatim in its preamble: "Note: the extension parameter wildcard (* tstr => any) means the per-type parameter prohibitions in this CDDL are advisory; a prohibited parameter matches the wildcard. The prose and Table 1 of the draft are definitive." So the two informational schemas differ in STRENGTH as well as in coverage: Appendix B enforces the per-type prohibitions and validates only the unsigned form, Appendix C covers all three forms but cannot enforce a prohibition at all. There is a second, quieter loss here. Appendix C expresses a prohibition by OMITTING the parameter from the branch, and omission is also the only thing it can do with a SHOULD NOT — so disposition, which Table 1 scores SN on the four non-incomplete types, is absent from dialog_recording_type, dialog_text_type, dialog_recording_set_type and dialog_transfer_type in exactly the way a MUST NOT parameter is absent. Appendix C therefore CONFLATES SN with X: four cells the table distinguishes are indistinguishable in the CDDL, and a reader who reconstructs Table 1 from Appendix C alone will read four SHOULD NOTs as MUST NOTs. Neither appendix alone is a sufficient conformance check, and the table remains the only complete statement.'
      - name: footnote-1-mediatype
        json_type: footnote
        cardinality: "1"
        required: true
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "(1) MUST be present for inline Dialog Content; optional for externally referenced Dialog Content when the media type is provided in the [HTTPS] Content-Type header; not required when Dialog Content is absent, such as in a placeholder Dialog Object or a redacted vCon."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
        notes: 'Turns the table cell M into a three-way conditional. The middle branch places authoritative metadata outside the signed document, in an HTTP response header.'
      - name: footnote-2-body-or-url
        json_type: footnote
        cardinality: "1"
        required: true
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "(2) body or url MAY be absent in a redacted vCon."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
        notes: 'The redaction escape hatch for content carriage. Applies to body and url only, not to encoding or content_hash, which remain conditioned on their partners.'
      - name: footnote-3-encoding
        json_type: footnote
        cardinality: "1"
        required: true
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "(3) MUST be present when the body parameter is present and is not an empty string (see Inline Files (Section 2.3))."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
      - name: footnote-4-content-hash
        json_type: footnote
        cardinality: "1"
        required: true
        locator: "§4.3.1.6"
        semantics: 'Verbatim: "(4) MUST be present when the url parameter is present (see Section 2.4.2)."'
        constrained_by_locator: "§4.3.1.6"
        constrained_by: []
        notes: 'Footnotes 3 and 4 are the two cases where the table cell S is strictly weaker than the governing rule: both are MUSTs conditioned on a sibling parameter, and both are invisible to anyone reading the column alone.'

  - name: party-history-object
    locator: "§4.3.13.1"
    encoding: "JSON object; an element of Dialog.party_history"
    normative_status: normative
    semantics: 'One timestamped presence or keypress event for one party within one dialog. Three mandatory members and one conditionally mandatory.'
    fields:
      - name: party
        json_type: UnsignedInt
        cardinality: "1"
        required: true
        locator: "§4.3.13.1"
        semantics: 'Verbatim: "The index of the party for this event."'
        constrained_by_locator: "§4.3.13.1"
        constrained_by: []
        notes: 'REFERENTIAL CONSTRAINT: an index into the TOP-LEVEL vCon.parties array, not into the enclosing Dialog.parties. Nothing says the party must also appear in the dialog parties list, so a party_history event may name a party the dialog itself does not claim. Unchecked, like every other index in the container.'
      - name: time
        json_type: Date
        cardinality: "1"
        required: true
        locator: "§4.3.13.1"
        semantics: 'Verbatim: "The time at which this event occurred."'
        constrained_by_locator: "§4.3.13.1"
        constrained_by: []
        notes: 'Absolute, not an offset from Dialog.start. No ordering constraint on the array is stated, so events may arrive out of order and must be sorted by the consumer, as with dialog itself.'
      - name: event
        json_type: String
        cardinality: "1"
        required: true
        locator: "§4.3.13.1"
        semantics: 'Verbatim: "The string token for the event which MUST be one of the following:"'
        constrained_by_locator: "§4.3.13.1"
        constrained_by: []
        values:
          - '"join" — "when the party joins the dialog"'
          - '"drop" — "when the party drops out of the dialog"'
          - '"hold" — "when the party is put on hold"'
          - '"unhold" — "when the part is taken off hold"'
          - '"mute" — "when the party is muted"'
          - '"unmute" — "when the part is taken off mute"'
          - '"keydown" — "when a DTMF or application key/button was pressed"'
          - '"keyup" — "when a DTMF or application key/button was released"'
        notes: 'Closed by MUST and extensible by registration: §6.3.5.1 creates a party_event Event Name Registry seeded with exactly these eight. Four are state transitions in unhold/hold and mute/unmute pairs, two are lifecycle (join, drop) and two are input (keydown, keyup); nothing requires them to be balanced or well nested, so a consumer cannot assume an unhold follows a hold. The source typo "the part" appears twice, for unhold and unmute.'
      - name: button
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.3.13.1"
        semantics: 'Declared verbatim as: "button: "String" - (optional, required for keydown and keyup events)". Verbatim on the value: "The button parameter value is the String value of the DTMF digit, character or string label for the button that was pressed or released."'
        constrained_by_locator: "§4.3.13.1"
        constrained_by: []
        notes: 'A conditional obligation keyed on a sibling value, the same pattern as encoding on body and content_hash on url. Appendix C encodes it structurally rather than as a comment, splitting the event member into two branches — ( event: "join" / "drop" / "hold" / "unhold" / "mute" / "unmute" // ( event: "keydown" / "keyup", button: tstr ) ) — which makes button mandatory for the two key events and, read strictly, absent for the other six. The prose only says optional-except-for-keydown-and-keyup and never forbids button on a join, so the CDDL is stricter than the text here; its own wildcard makes that strictness advisory. PRIVACY NOTE worth carrying: DTMF keypresses routinely carry card numbers, PINs and social security numbers, and this field records them verbatim inside the dialog. The §2.5 extension contract asks extensions to state whether their parameters "can carry party-identifying data or PII and how a redactor is expected to handle them"; the core schema never asks that of button, and §4.1.8 gives a redactor no specific instruction about it.'

  - name: dialog-transfer-model
    locator: "§4.3.14"
    encoding: "six index parameters on a transfer-type Dialog Object; three name parties, three name dialogs"
    normative_status: normative
    semantics: 'The roles and call graph of a call transfer, as a Dialog Object that holds no conversation. Verbatim on the frame: "A dialog of type "transfer" documents the roles of three parties and the relationship between 2 or three dialog segments." The three roles are taken from SIP-XFER; the two-or-three calls are the original, the optional consultative and the target. Verbatim on the blanket rule: "To capture the above roles and dialog segments, the following parameters are defined for the "transfer" type dialog and MUST NOT be present in other dialog types. Each of these parameters SHOULD be present in the "transfer" type Dialog Object unless noted as optional." This structure records the referential model; the parameters themselves are decomposed as fields of dialog-object.'
    fields:
      - name: transferee-role
        json_type: party-index
        cardinality: "0..1"
        required: conditional
        locator: "§4.3.14"
        semantics: 'Verbatim: "The value of the transferee parameter is the index into the parties Object array to the party that played the role of the Transferee." The party who is transferred; party to both the original and the target call.'
        constrained_by_locator: "§4.3.14"
        constrained_by: []
        notes: 'REFERENTIAL CONSTRAINT into vCon.parties, unchecked. Nothing requires the transferee to appear in the parties list of the original or target dialogs it is said to be party to.'
      - name: transferor-role
        json_type: party-index
        cardinality: "0..1"
        required: conditional
        locator: "§4.3.14"
        semantics: 'Verbatim: "The value of the transferor parameter is the index into the parties Object array to the party that played the role of the Transferor." The party who performs the transfer; party to the original and, when it exists, the consultative call.'
        constrained_by_locator: "§4.3.14"
        constrained_by: []
      - name: transfer-target-role
        json_type: party-index
        cardinality: "0..1"
        required: false
        locator: "§4.3.14"
        semantics: 'Verbatim: "The value of the transfer_target parameter is the index into the parties Object array to the party that played the role of the Transfer Target. The transfer_target is optional in the case where the transfer is abandoned before the target was identified."'
        constrained_by_locator: "§4.3.14"
        constrained_by: []
        notes: 'The only role that may be unknown, and the reason is temporal: the transfer can fail before a target exists. Note the asymmetry with target_dialog, which is S rather than O — so a transfer may legally name the target CALL while omitting the target PARTY.'
      - name: original-call
        json_type: dialog-index
        cardinality: "0..1"
        required: conditional
        locator: "§4.3.14"
        semantics: 'Verbatim: "The value of the original parameter is the index into the dialog Object array to the "recording", "recording-set" or "text" type Dialog Object for the original dialog between the Transferee and the Transferor."'
        constrained_by_locator: "§4.3.14"
        constrained_by: []
        notes: 'REFERENTIAL CONSTRAINT with a TYPE restriction: the referent must be recording, recording-set or text — never incomplete, since an original call that never connected cannot have been transferred. Unchecked.'
      - name: consultation-call
        json_type: dialog-index
        cardinality: "0..1"
        required: false
        locator: "§4.3.14"
        semantics: 'Verbatim: "The value of the consultation parameter is the index into the Dialog Object array to the "recording", "recording-set", "text" or "incomplete" type Dialog Object for the consultative dialog between the Transferor and the Transfer Target."'
        constrained_by_locator: "§4.3.14"
        constrained_by: []
        notes: 'Admits incomplete as a referent type, unlike original — a consultation may legitimately have failed. Verbatim on multiplicity: "It is also possible for there to be more than one consultation. This may occur for a number of reasons. Call attempts may fail. The caller may decide the consultation with a party is not the desired transfer target." DEFECT: consultation is a single UnsignedInt and cannot hold more than one index, so the document describes a case its own schema cannot express. The only workaround the document offers elsewhere is a recording-set, which is defined for recordings, not for consultations.'
      - name: target-call
        json_type: dialog-index
        cardinality: "0..1"
        required: conditional
        locator: "§4.3.14"
        semantics: 'Verbatim: "The value of the target_dialog parameter is the index into the Dialog Object array to the "recording", "recording-set", "text" or "incomplete" type Dialog Object for the target dialog between the Transferee and the Transfer Target."'
        constrained_by_locator: "§4.3.14"
        constrained_by: []
        notes: 'Shared rules for all three call references, verbatim: "The values for the consultation, target_dialog and original parameters each reference a single Dialog Object. When a call is represented by multiple recording Dialog Objects, a recording-set type Dialog Object which represents that call MAY be referenced (see Section 4.3.1.2)." On unknown calls: "There are scenarios where we know that a transfer has occurred, but we have no Dialog Object information for one or two of the consultation, target or transfer calls. In this case a placeholder Dialog Object is created and its index is used for the consultation, target_dialog or original parameter." On sharing: "A unique Dialog Object SHOULD be referenced for each role in the transfer. However a Dialog Object may be referenced in more than one transfer dialogs when multiple transfers occur." Scope limit, verbatim: "The "transfer" type dialog only captures the roles, operations and events of the parties and the dialog setup. It does not capture the purpose or reason for the transfer as that is analysis to be captures in the analysis section of the Vcon after the conversation has occurred."'

  - name: attachment-object
    locator: "§4.4"
    encoding: "JSON object; an element of the top-level attachments array"
    normative_status: normative
    semantics: 'An ancillary document exchanged in or related to the conversation, as opposed to the conversation itself. Verbatim on scope: "There is no constraint on the types files which can be included or referenced. As most modes of communication, that allow the exchange of files, do not constrain the file type, any file type may be included here." The §4.3 transcribability test is what routes content here rather than to a Dialog Object.'
    fields:
      - name: purpose
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.4.1"
        semantics: 'Verbatim: "The purpose parameter may be used to provide a text base description of the purpose or point of the attachment. There is no restricted set of values for this description."'
        constrained_by_locator: "§4.4.1"
        constrained_by: []
      - name: start
        json_type: Date
        cardinality: "1"
        required: true
        locator: "§4.4.2"
        semantics: 'Verbatim: "The start parameter contains the date and time that the Attachment Object was sent/exchanged."'
        constrained_by_locator: "§4.4.2"
        constrained_by: []
        notes: 'Mandatory on three agreeing grounds: declared with no (optional) marker so the §2.2 default applies, listed among the three REQUIRED members of Attachment in Appendix B, and written without the CDDL optional marker in Appendix C. TENSION worth naming even so: §4.4.3 contemplates "an organization that processes or constructs the vCon" adding an attachment about the conversation after the fact, for which a sent or exchanged time does not exist. The schema demands a value the use case cannot supply. Ordering caveat as for dialog: "It should be noted that Attachment Objects may not be ordered by the value of the start parameter. Attachment Objects in the attachments array are in order that they were added to the vCon and cannot be reordered with out correcting the attachment indices which may occur in other Objects in the vCon."'
      - name: party
        json_type: UnsignedInt
        cardinality: "1"
        required: true
        locator: "§4.4.3"
        semantics: 'Index into vCon.parties naming the party that DISTRIBUTED the attachment. Verbatim: "To provide provenance for the attachment, the party index MUST be specified."'
        constrained_by_locator: "§4.4.3"
        constrained_by: []
        notes: 'The only MUST-specified index in the container. Distribution, not authorship, verbatim: "This party is not necessarily the document''s author, but rather the party that distributed the document." And the distributor need not have been in the conversation: "The identified party need not be a participant in the conversation itself. For example, an organization that processes or constructs the vCon may add attachments containing information about the conversation. The organization or entity that adds the attachment SHOULD be represented as a Party Object." So the parties array is not purely a roster of conversation participants, which matters to anyone counting parties or redacting them.'
      - name: dialog
        json_type: UnsignedInt
        cardinality: "1"
        required: true
        locator: "§4.4.4"
        semantics: 'Index into vCon.dialog naming the dialog this attachment belongs to. Verbatim: "The dialog parameter is used to identify the dialog that the attachment is part of. The dialog is identified by the index to the dialog Object in the dialog objects array."'
        constrained_by_locator: "§4.4.4"
        constrained_by: []
        notes: 'Declared with no (optional) marker and listed as required in the informational Appendix B schema, so an attachment cannot float free of a dialog — yet §4.4.3 explicitly contemplates an organisation adding an attachment ABOUT the conversation, which may belong to no single dialog. Single-valued, unlike Analysis.dialog, which admits an array. REFERENTIAL CONSTRAINT, unchecked.'
      - name: mediatype
        json_type: Mediatype
        cardinality: "0..1"
        required: conditional
        locator: "§4.4.5"
        semantics: 'Verbatim: "The mediatype parameter MUST be provided for inline attachment files and MUST be provided if the Content-Type header in the [HTTPS] response for the externally referenced URL is not provided. The mediatype parameter is not required when the Attachment Content is absent, such as when the body and url have been redacted."'
        constrained_by_locator: "§4.4.5"
        constrained_by: []
        notes: 'Same three-way conditional as Dialog.mediatype but with no SHOULD list of values, since any file type is permitted here.'
      - name: filename
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.4.6"
        semantics: 'Verbatim: "The file name string contains an optional name for the attachment file referenced in this Attachment Object."'
        constrained_by_locator: "§4.4.6"
        constrained_by: []
      - name: body
        json_type: "*"
        cardinality: "0..1"
        required: conditional
        locator: "§4.4.7, §2.3.1"
        semantics: 'Inline attachment payload. See inline-file-pattern and content-carriage-sites.'
        constrained_by_locator: "§4.4.7"
        constrained_by: []
        notes: 'Unlike §4.3.10, the §4.4.7 declaration carries no "(optional in a redacted vCon)" marker even though the prose grants the exception.'
      - name: encoding
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.4.7, §2.3.2"
        semantics: 'One of base64url, json, none. MUST be present when body is present and non-empty.'
        constrained_by_locator: "§4.4.7"
        constrained_by: []
      - name: url
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.4.7, §2.4.1"
        semantics: 'HTTPS location of an externally referenced attachment.'
        constrained_by_locator: "§4.4.7"
        constrained_by: []
      - name: content_hash
        json_type: "ContentHash | ContentHash[]"
        cardinality: "0..1"
        required: conditional
        locator: "§4.4.7, §2.4.2"
        semantics: 'Integrity binding for the externally referenced attachment. MUST be present when url is.'
        constrained_by_locator: "§4.4.7"
        constrained_by: []

  - name: analysis-object
    locator: "§4.5"
    encoding: "JSON object; an element of the top-level analysis array"
    normative_status: normative
    semantics: 'Something derived from the dialog or the attachments: a transcript, a summary, a sentiment score, a translation. The document deliberately underspecifies it. Verbatim: "Analysis is a broad and in some cases developing field. This document does not attempt to suggest a SHOULD support list of types. Nor are formats for analysis data defined in this document. That is for research and specification outside the scope of this document." The consequence is three identification fields instead of one: "For this reason the Analysis Object provides multiple ways to define the media type of the analysis file. If a well known media type is defined, it SHOULD be used. For analysis data or files types for which a media type is not defined, the vendor and schema parameters SHOULD be used."'
    fields:
      - name: type
        json_type: String
        cardinality: "1"
        required: true
        locator: "§4.5.1"
        semantics: 'The semantic kind of analysis. Verbatim: "The type parameter is used to label the semantic type of analysis data." and "The string value SHOULD be one of the following:"'
        constrained_by_locator: "§4.5.1"
        constrained_by: []
        values:
          - '"report"'
          - '"sentiment"'
          - '"summary"'
          - '"transcript"'
          - '"translation"'
          - '"tts"'
        notes: 'SHOULD rather than MUST, and no IANA registry is created for these six — unlike Dialog.type and party_event, both of which get one. So the analysis vocabulary is open and unregisterable, which is consistent with the stated intent but leaves no extension path short of a schema extension. Declared with no (optional) marker, so mandatory by §2.2; the informational Appendix B schema agrees, listing type and vendor as the two required members.'
      - name: dialog
        json_type: "UnsignedInt | UnsignedInt[]"
        cardinality: "0..1"
        required: conditional
        locator: "§4.5.2"
        semantics: 'Indices into vCon.dialog naming what this analysis was derived from. Declared verbatim as: "dialog: "UnsignedInt" | "UnsignedInt[]" (optional only if the analysis was not derived from any of the dialog)".'
        constrained_by_locator: "§4.5.2"
        constrained_by: []
        notes: 'REFERENTIAL CONSTRAINT, unchecked. The "optional only if" phrasing makes this the clearest provenance obligation in the container: an analysis derived from dialog MUST say which dialog. Multi-valued, unlike Attachment.dialog.'
      - name: attachment
        json_type: "UnsignedInt | UnsignedInt[]"
        cardinality: "0..1"
        required: conditional
        locator: "§4.5.3"
        semantics: 'Indices into vCon.attachments naming what this analysis was derived from. Declared verbatim as: "attachment: "UnsignedInt" | "UnsignedInt[]" (optional only if the analysis was not derived from any of the attachments)".'
        constrained_by_locator: "§4.5.3"
        constrained_by: []
        notes: 'REFERENTIAL CONSTRAINT, unchecked. With dialog, the pair means an analysis derived from neither source may legally name neither — and nothing then records where it came from.'
      - name: mediatype
        json_type: Mediatype
        cardinality: "0..1"
        required: false
        locator: "§4.5.4"
        semantics: 'Verbatim: "The mediatype parameter SHOULD be provided for inline analysis files and for externally referenced analysis files when the Content-Type header in the [HTTPS] response is not provided. A media type may not be defined for the format of the analysis data; in this case the vendor, product and schema parameters SHOULD be used to identify the data format instead."'
        constrained_by_locator: "§4.5.4"
        constrained_by: []
        notes: 'The one place in the container where mediatype is SHOULD rather than MUST for inline content — Dialog and Attachment both make it a MUST. The downgrade is deliberate and is what the vendor/product/schema triple exists to compensate for.'
      - name: filename
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.5.5"
        semantics: 'Verbatim: "The file name string contains an optional name for the analysis data file referenced in this Analysis Object."'
        constrained_by_locator: "§4.5.5"
        constrained_by: []
      - name: vendor
        json_type: String
        cardinality: "1"
        required: true
        locator: "§4.5.6"
        semantics: 'Who produced the analysis. Verbatim: "The vendor string value contains the vendor or product name of the software which generated this analysis."'
        constrained_by_locator: "§4.5.6"
        constrained_by: []
        notes: 'Declared with no (optional) marker and listed as required in the informational Appendix B schema, so this is a MANDATORY provenance field — the only mandatory attribution anywhere in the container. The reason given is quality, not credit: "Different implementations perform differently and knowing the implementation can be useful in interpreting the analysis." No registry, no syntax, no identity binding: the string is unverifiable and anyone can write anything in it.'
      - name: product
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.5.7"
        semantics: 'Verbatim: "As the vendor may have more than one product, the product parameter may be used to differentiate it from other products which may have different schemas of analysis data."'
        constrained_by_locator: "§4.5.7"
        constrained_by: []
        notes: 'Declared as "product: "string" (optional)" with a lowercase type name, the only such case in §4; every other declaration writes "String". A typographic defect, not a semantic one.'
      - name: schema
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§4.5.8"
        semantics: 'Verbatim: "The schema string contains a token or label for the data format or schema for the analysis data. As the vendor name may not be specific enough to identify the format of the analysis, the schema value is provide to differentiate from potentially multiple data formats for analysis provided by the same vendor or software."'
        constrained_by_locator: "§4.5.8"
        constrained_by: []
        notes: 'Third leg of the fallback identification triple. It is a label, not a URI and not a document reference, so it identifies a format only to a consumer that already knows the vendor vocabulary. For our purposes this is the weakest interoperability point in the container: the payload of an Analysis Object may be a vendor-private format named by a vendor-private token.'
      - name: body
        json_type: "*"
        cardinality: "0..1"
        required: conditional
        locator: "§4.5.9, §2.3.1"
        semantics: 'Inline analysis payload. See inline-file-pattern and content-carriage-sites.'
        constrained_by_locator: "§4.5.9"
        constrained_by: []
      - name: encoding
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.5.9, §2.3.2"
        semantics: 'One of base64url, json, none. MUST be present when body is present and non-empty.'
        constrained_by_locator: "§4.5.9"
        constrained_by: []
        notes: 'The "json" value matters most here: an analysis payload is usually itself JSON, so it can be embedded as a JSON value rather than base64url-wrapped, which keeps it readable and queryable inside the signed container.'
      - name: url
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§4.5.9, §2.4.1"
        semantics: 'HTTPS location of externally referenced analysis data.'
        constrained_by_locator: "§4.5.9"
        constrained_by: []
      - name: content_hash
        json_type: "ContentHash | ContentHash[]"
        cardinality: "0..1"
        required: conditional
        locator: "§4.5.9, §2.4.2"
        semantics: 'Integrity binding for externally referenced analysis data. MUST be present when url is.'
        constrained_by_locator: "§4.5.9"
        constrained_by: []

  - name: signed-vcon-object
    locator: "§5.2"
    encoding: "JWS General JSON Serialization (RFC 7515 §7.2.1)"
    normative_status: normative
    semantics: 'The signed form. Verbatim: "A signed vCon uses [JWS] and takes the General JWS JSON Serialization Syntax form as defined in section 7.2.1 of [JWS]." General, not Flattened, so signatures is always an array even with one signer. The vCon-specific additions to JWS are exactly two: a carriage obligation for the certificate chain, and a uuid header parameter. SCHEMA COVERAGE: Appendix B does not reach this form at all — it is titled "vCon - Unsigned Form" and models section 4 only — so Appendix C is the only schema the draft gives for the signed form, as signed_vcon_type = { payload, signatures: [* signature_object_type], extension_parameters_type }.'
    fields:
      - name: payload
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.2"
        semantics: 'Verbatim: "The value of the payload is the Base64Url Encoded string containing either: the unsigned form of the JSON vCon; or the gzipped [GZIP] unsigned form of the JSON vCon. The general construction of the payload string value is described in section 7.2.1 of [JWS]"'
        constrained_by_locator: "§5.2"
        constrained_by: []
        notes: 'Two possible payload contents behind one Base64Url string, and §5.2 gives no in-band discriminator for which. The JOSE answer would be cty in the protected header, and §5.3.1 uses cty for exactly this purpose on the JWE side, but §5.2.2 does not list cty among the Header Object members. A verifier must therefore sniff for the gzip magic number after decoding — the §5.4 rules do not reach inside a JWS payload.'
      - name: signatures
        json_type: "Signature[]"
        cardinality: "1 array, 1..n members"
        required: true
        locator: "§5.2"
        semantics: 'Verbatim: "The value of signatures is an array of Signature Objects (Section 5.2.1)". Decomposed below as signature-object.'
        constrained_by_locator: "§5.2"
        constrained_by: []
        notes: 'Multiple signatures are structurally permitted and semantically undefined: nothing says whether a verifier needs one valid signature or all of them, nor what it means for two domains to sign the same vCon. The §5.2.3 archiving pattern deliberately does NOT use this array — it nests whole JWS documents instead.'
      - name: certificate-carriage-obligation
        json_type: constraint
        cardinality: "1"
        required: true
        locator: "§5.2"
        semantics: 'Verbatim: "The vCon General JWS JSON Serialization MUST include x5c or x5u in the unprotected header."'
        constrained_by_locator: "§5.2"
        constrained_by: []
        notes: 'Recorded as a field because it is a constraint of the whole object, not of one member. Note the word UNPROTECTED: the MUST is on the per-signature header member, so the certificate reference travels OUTSIDE the signed bytes and can be substituted without breaking the signature. §5.2.2 restates the obligation without the unprotected qualifier. The A.6 example hedges by putting x5c in both the unprotected header and the protected header. Rationale given: "The x5c or x5u requirement makes the management and use of vCons easier, allowing the certificate chain to be found as the vCon is moved."'

  - name: signature-object
    locator: "§5.2.1"
    encoding: "JSON object; an element of signatures"
    normative_status: normative
    semantics: 'One signature over the payload. Verbatim: "The Signature Object MUST contain a header, protected and signature parameter as defined in section 7.2.1 of [JWS]."'
    fields:
      - name: header
        json_type: Header
        cardinality: "1"
        required: true
        locator: "§5.2.1, §5.2.2"
        semantics: 'The JWS unprotected header for this signature. Verbatim: "The value of header is defined in Header Object (Section 5.2.2)". Decomposed below as jws-header-object.'
        constrained_by_locator: "§5.2.1"
        constrained_by: []
        notes: 'Mandatory here, where plain JWS makes it optional. This is a vCon-specific tightening, and it follows from the x5c/x5u obligation of §5.2 having been placed in the unprotected header.'
      - name: protected
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.2.1"
        semantics: 'The Base64Url-encoded JWS Protected Header. The document gives no vCon-specific content for it, deferring entirely to section 7.2.1 of JWS.'
        constrained_by_locator: "§5.2.1"
        constrained_by: []
        notes: 'Mandatory here, where plain JWS makes it optional for a given signature. The document never says which header parameters belong in protected rather than header, which is the whole security question; the A.6 example puts alg, typ and x5c in protected and alg, x5c and uuid in header.'
      - name: signature
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.2.1"
        semantics: 'The Base64Url-encoded signature value, as section 7.2.1 of JWS defines it.'
        constrained_by_locator: "§5.2.1"
        constrained_by: []

  - name: jws-header-object
    locator: "§5.2.2"
    encoding: "JSON object; the unprotected header of a Signature Object"
    normative_status: normative
    semantics: 'Verbatim: "The Header Object and its contents are defined in section 4 of [JWS]. The Header Object for a signed vCon MUST include the alg and either the x5c or x5u arrays."'
    fields:
      - name: alg
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.2.2"
        semantics: 'Verbatim: "The string value of alg is defined in section 4.1.1 of [JWS]. For a signed vCon this value SHOULD be "RS256" to maximize interoperability."'
        constrained_by_locator: "§5.2.2"
        constrained_by: []
        values:
          - '"RS256" (SHOULD, for interoperability)'
        notes: 'A SHOULD on RSASSA-PKCS1-v1_5 with SHA-256, chosen for reach rather than for strength; no floor and no prohibition is stated, so "none" is not explicitly forbidden anywhere in this document. Note the alg lives in the UNPROTECTED header by this section, which is where algorithm substitution attacks begin. That is OUR analysis, not a citation: RFC 7515 §4.1.1 requires only that alg be present — "This Header Parameter MUST be present and MUST be understood and processed by implementations" — and names no header for it, and §4 does not say what an earlier draft of this file claimed it said. What RFC 7515 does say, in §7.2.1, is that "The Header Parameter names in the two locations MUST be disjoint", so a signer must choose one location for alg; an alg that is not integrity-protected is one an attacker can rewrite, which is the substitution attack. The draft states no preference. Appendix C agrees on presence, writing alg without the CDDL optional marker and the x5c/x5u pair as a group choice, ( x5c: [* tstr] // x5u: url_value_type ), which makes the one-of obligation structural.'
      - name: x5c
        json_type: "String[]"
        cardinality: "0..1"
        required: conditional
        locator: "§5.2.2"
        semantics: 'Declared verbatim as: "x5c: "String[]" (MUST provide x5c or x5u)". Verbatim on the value: "The array of string values for x5c are defined in section 4.1.6 of [JWS]."'
        constrained_by_locator: "§5.2.2"
        constrained_by: []
        notes: 'The certificate chain carried inline. One of the pair is mandatory; §5.2 and §5.2.2 both say so.'
      - name: x5u
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "§5.2.2"
        semantics: 'Declared verbatim as: "x5u: "String" (MUST provide x5c or x5u)". Verbatim on the value: "The string value of x5u MUST contain an [HTTPS] URL as defined in section 4.1.5 of [JWS]."'
        constrained_by_locator: "§5.2.2"
        constrained_by: []
        notes: 'HTTPS is a MUST, as for every other URL in the container. §5.2.2 calls x5c and x5u "arrays" in the plural obligation sentence, but x5u is a single String — a minor wording defect.'
      - name: uuid
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§5.2.2, §6.5"
        semantics: 'The UUID of the vCon inside payload, lifted out so it can be read without verifying. Declared verbatim as: "uuid: "String" (SHOULD be provided)". Verbatim on purpose and on checking: "The string value of the UUID for the vCon contained in the payload parameter. This is added for convenience to not require verification of the signed vCon to get it''s UUID. When the vCon is verified, the value of this uuid parameter SHOULD be verified against the UUID in the signed vCon."'
        constrained_by_locator: "§5.2.2"
        constrained_by: []
        notes: 'The ONE new JOSE header parameter this document registers (§6.5: Header Parameter Name "uuid", Description "UUID of the signed object", Usage Locations "JWS, JWE"). It sits in the UNPROTECTED header, so it is attacker-controlled: a document can be re-labelled with a different uuid without disturbing the signature, and the cross-check that would catch it is only a SHOULD. This is the field an indexer or router will key on precisely because it can be read without verifying, which is exactly when the check has not yet been done.'

  - name: encrypted-vcon-object
    locator: "§5.3"
    encoding: "JWE General JSON Serialization (RFC 7516 §7.2.1)"
    normative_status: normative
    semantics: 'The encrypted form, whose plaintext is the SIGNED form. Verbatim: "A encrypted vCon uses [JWE] and takes the General JWE JSON Serialization Syntax form as defined in section 7.2.1 of [JWE]." SCHEMA COVERAGE: as with the signed form, Appendix B does not model this at all and Appendix C is the only schema, as encrypted_vcon_type = { unprotected, recipients: [* recipient_object_type], iv, ciphertext, tag, extension_parameters_type }.'
    fields:
      - name: unprotected
        json_type: Unprotected
        cardinality: "1"
        required: true
        locator: "§5.3, §5.3.1"
        semantics: 'The shared unprotected header. Decomposed below as unprotected-object.'
        constrained_by_locator: "§5.3"
        constrained_by: []
      - name: recipients
        json_type: "Recipient[]"
        cardinality: "1 array, 1..n members"
        required: true
        locator: "§5.3, §5.3.2"
        semantics: 'Per-recipient key wrapping. Decomposed below as recipient-object. One of the two members §5.4 keys the encrypted-form test on.'
        constrained_by_locator: "§5.3"
        constrained_by: []
      - name: iv
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.3"
        semantics: 'Verbatim: "The string value of iv is the Initialization Vector as constructed as defined in section 7.2.1 of [JWE]."'
        constrained_by_locator: "§5.3"
        constrained_by: []
      - name: ciphertext
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.3"
        semantics: 'Verbatim: "The string value of ciphertext is constructed as defined in section 7.2.1 of [JWE] using the signed form of the vCon as the plaintext input for encryption."'
        constrained_by_locator: "§5.3"
        constrained_by: []
        notes: 'This sentence is the whole sign-then-encrypt rule in operational form: the plaintext is the JWS document, never the bare vCon. A consumer that decrypts and expects a vCon has one more layer to peel, and §5.4 does not say so — its rules are for a document you already hold, not for one you just decrypted.'
      - name: tag
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.3"
        semantics: 'Verbatim: "The string value of tag is the the Authentication Tag as defined in section 7.2.1 of [JWE]."'
        constrained_by_locator: "§5.3"
        constrained_by: []
      - name: protected
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "not defined in §5.3; present in Appendix A.7; defined in RFC 7516 §7.2.1"
        semantics: 'The Base64Url-encoded JWE Protected Header. §5.3 does not list it among the parameters of an encrypted vCon, but the normative JWE General JSON Serialization it points at defines it, and the A.7 example carries it at the top level with the value decoding to the object containing alg RSA-OAEP and enc A256CBC-HS512. CONDITIONAL MUST, not optional, and both branches are a MUST: RFC 7516 §7.2.1 states "The "protected" member MUST be present and contain the value BASE64URL(UTF8(JWE Protected Header)) when the JWE Protected Header value is non-empty; otherwise, it MUST be absent." A.7''s Protected Header is non-empty, so for A.7 the parameter is mandatory, and a producer emitting a non-empty Protected Header without it is non-conforming to the serialization §5.3 names.'
        constrained_by_locator: "§5.3"
        constrained_by: []
        notes: 'DEFECT, recorded because an implementer building the member list from §5.3 alone will omit the one header that is integrity-protected. The document names five top-level members; its own example carries six. And the omission is systematic rather than a slip in one section: Appendix C repeats it, writing encrypted_vcon_type with the same five members and no protected, so both normative text and informational schema disagree with the worked example. Marked inferred: the obligation comes from JWE, not from this document. D3 SETTLED (pass 2, 2026-10-14): §5.3''s member list is INCOMPLETE, not merely terse. §5.3 invokes "the General JWE JSON Serialization Syntax form as defined in section 7.2.1 of [JWE]", and RFC 7516 §7.2.1 (.cache/rfc-7516.txt, sha256 722cfcddc15f58e746891ba4b846853d3711153a774e4dd55ad6db100474a21f) defines protected as a member of exactly that serialization. The A.7 example is therefore right and the enumeration in §5.3 is wrong. The same section omits aad, which RFC 7516 §7.2.1 also defines; both are now carried in distilled/fields.yaml as kind: inferred.'
        inferred: 'that protected is permitted and expected — §5.3 omits it from its list, the A.7 example includes it, and RFC 7516 §7.2.1 defines it'
      - name: aad
        json_type: String
        cardinality: "0..1"
        required: conditional
        locator: "not defined in §5.3; no Appendix A example; defined in RFC 7516 §7.2.1"
        semantics: 'Base64Url-encoded Additional Authenticated Data — the one place an encrypted vCon can carry cleartext that is integrity protected but NOT encrypted. Like protected it is a member of the General JWE JSON Serialization that §5.3 invokes and then omits from its own list. RFC 7516 §7.2.1, verbatim: "The "aad" member MUST be present and contain the value BASE64URL(JWE AAD)) when the JWE AAD value is non-empty; otherwise, it MUST be absent." The doubled closing parenthesis after JWE AAD is the RFC''s own typo, reproduced rather than repaired. Conditional, and both branches are a MUST.'
        constrained_by_locator: "§5.3"
        constrained_by: []
        notes: 'SECOND HALF OF THE SAME DEFECT as protected, and the harder half to notice. protected at least shows up in the A.7 example, so a reader comparing text to example can catch it; aad appears in no example in this document, so nothing in the record reveals the gap — it is visible only by reading section 7.2.1 of [JWE], which §5.3 names and does not reproduce. Appendix C omits it too, writing encrypted_vcon_type with the same five members, so text and schema are wrong together here exactly as they are for protected. Worth carrying rather than filing as pedantry: aad is the natural carrier for a redaction, provenance or routing label that must survive encryption with its integrity intact, and an implementer building from §5.3 alone will not know the slot exists. Cited from .cache/rfc-7516.txt sha256 722cfcddc15f58e746891ba4b846853d3711153a774e4dd55ad6db100474a21f.'
        inferred: 'that aad is permitted at all — §5.3 omits it, no example exercises it, and only RFC 7516 §7.2.1 defines it'


  - name: unprotected-object
    locator: "§5.3.1"
    encoding: "JSON object; the shared JWE unprotected header"
    normative_status: normative
    semantics: 'Three members, all readable without a key. This is the metadata surface of an encrypted vCon. Read the SHOULDs carefully: for cty and enc the SHOULD governs the VALUE, not the presence — both are declared bare and so are mandatory by the §2.2 default, and Appendix C writes both without the CDDL optional marker. Only uuid carries a presence qualifier, "(SHOULD be provided)".'
    fields:
      - name: cty
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.3.1"
        semantics: 'The content type of the plaintext. Verbatim: "The string value of cty SHOULD be either "application/vcon" or "application/vcon+gzip""'
        constrained_by_locator: "§5.3.1"
        constrained_by: []
        values:
          - '"application/vcon"'
          - '"application/vcon+gzip"'
        notes: 'DEFECT in the examples: Appendix A.7 sets cty to "application/vcon+json", which is neither of the two values this section names and is not a media type this document registers — §6.1 registers application/vcon and §6.2 registers application/vcon+gzip. An implementer copying the example produces a non-conforming vCon. Note also what cty does NOT say: the plaintext is a JWS document per §5.3, so neither permitted value describes what is actually inside the ciphertext.'
      - name: enc
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.3.1"
        semantics: 'Verbatim: "The string value of enc SHOULD be "A256CBC-HS512""'
        constrained_by_locator: "§5.3.1"
        constrained_by: []
        values:
          - '"A256CBC-HS512"'
        notes: 'DEFECT: in JWE, enc belongs in the JWE Protected Header — putting it in the unprotected header leaves the content encryption algorithm unauthenticated. The A.7 example puts it in all three places at once: the protected header, the unprotected header and the recipient header. Nothing in the document says which one a decryptor is to believe.'
      - name: uuid
        json_type: String
        cardinality: "0..1"
        required: false
        locator: "§5.3.1, §6.5"
        semantics: 'The UUID of the vCon inside the ciphertext. Declared verbatim as: "uuid: "String" (SHOULD be provided)". Verbatim on purpose: "The string value of the UUID for the vCon contained in the ciphertext parameter. This is provided for identification of the encrypted vCon without the need of the key to decrypt the vCon. The value of this uuid parameter SHOULD be verified when the vCon is decrypted."'
        constrained_by_locator: "§5.3.1"
        constrained_by: []
        notes: 'The same registered header parameter as §5.2.2, used here so an encrypted vCon can be filed and retrieved without a key. The same hazard applies and is sharper: it is the only identifying information an encrypted vCon exposes, it is outside the AEAD-protected material, and the verification is a SHOULD. Figure 1 depends on it — the redacted vCon reaches its unredacted parent by matching this uuid. §6.5 cites "Header Object (Section 5.3.1)" for this parameter, but §5.3.1 is the Unprotected Object; the Header Object is §5.3.3. The pointer is to the right section under the wrong name.'

  - name: recipient-object
    locator: "§5.3.2"
    encoding: "JSON object; an element of recipients"
    normative_status: normative
    semantics: 'One wrapped content-encryption key for one recipient.'
    fields:
      - name: header
        json_type: Header
        cardinality: "1"
        required: true
        locator: "§5.3.2, §5.3.3"
        semantics: 'The per-recipient header. Decomposed below as jwe-header-object.'
        constrained_by_locator: "§5.3.2"
        constrained_by: []
      - name: encrypted_key
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.3.2"
        semantics: 'Verbatim: "The string value of encrypted_key is defined in section 7.2.1 of [JWE]."'
        constrained_by_locator: "§5.3.2"
        constrained_by: []
        notes: 'The recipients array is what makes multi-domain distribution possible — one ciphertext, many wrapped keys — and it is the mechanism §5 relies on when it says an unredacted vCon referenced from a redacted one "MUST be encrypted such that only those with permission to view the non-redacted content can decrypt it."'

  - name: jwe-header-object
    locator: "§5.3.3"
    encoding: "JSON object; the per-recipient header of a Recipient Object"
    normative_status: normative
    semantics: 'The document defines exactly one member for it.'
    fields:
      - name: alg
        json_type: String
        cardinality: "1"
        required: true
        locator: "§5.3.3"
        semantics: 'The key management algorithm. Verbatim, and this is the entire section: "The string value of alg SHOULD be "RSA-OAEP"."'
        constrained_by_locator: "§5.3.3"
        constrained_by: []
        values:
          - '"RSA-OAEP" (SHOULD)'
        notes: 'DEFECT in the examples: the A.7 recipient header carries enc, not alg — the alg RSA-OAEP that this section calls for sits in the top-level protected header instead. So the one member §5.3.3 defines does not appear where §5.3.3 says it appears, in the document''s own example. RSA-OAEP here is RSAES-OAEP with SHA-1 (JWA), not RSA-OAEP-256; the document does not say which it means, and the example''s protected header decodes to the bare string "RSA-OAEP", so the SHA-1 variant is what is shown.'
