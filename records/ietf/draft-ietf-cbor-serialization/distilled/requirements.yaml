reconciliation: >
  The counts match exactly: bin/bcp14-count reports 65 BCP 14 keyword
  occurrences in draft-ietf-cbor-serialization-08 (41 MUST, 8 MAY, 7
  RECOMMENDED, 4 SHOULD, 4 MUST NOT, 1 NOT RECOMMENDED), and the 65 entries
  marked kind stated carry 65 between them. Each stated entry carries
  exactly one occurrence, none splices two non-adjacent quotes, and no
  occurrence is quoted by two entries. Two sentences each carry two
  occurrences for two different actors and are therefore quoted as two
  non-overlapping verbatim clauses rather than twice in full, which would
  have double-counted: R-0010/R-0011 (sender MAY / receiver MUST, 2.1.2) and
  R-0060/R-0061 (deterministic MUST be used / except maps and arrays MUST be
  indefinite, Section 6); each says so in its field. The verify pass
  re-derived this independently - it segmented the source into statement
  units, counting a list item as its own unit, and found exactly these two
  units carrying two occurrences each; the pass-1 reconciliation said three
  and named R-0049/R-0050, which are the Section 4.2 item 5 empty-byte-string
  rule and an inferred entry carrying no keyword at all. Both quoted clause
  pairs were confirmed non-overlapping: R-0010 ends two characters before
  R-0011 begins (the source's ", ") and R-0060 one character before R-0061.
  Seven of the 65
  occurrences constrain nothing in this document and are recorded so a later
  pass does not read them as dropped obligations: R-0060, R-0061 and R-0062
  are an illustrative example of how a protocol would word a special
  serialization (Section 6), and R-0072, R-0073, R-0074 and R-0075 are two
  hypothetical application-layer specifications quoted in Appendix B to show
  what a non-deterministic application layer looks like. They are kept as
  stated entries because the source does carry the keyword at those
  locators. The verify pass also enumerated the 65 source occurrences by
  line and matched each to the one stated entry whose quoted text spans it:
  0 unclaimed, 0 claimed twice, 0 entries carrying none and 0 entries
  carrying more than one. All 100 quoted texts - stated and inferred - were
  confirmed to be contiguous substrings of the cached source once its hard
  line wraps are collapsed, and every locator names a section that actually
  contains its quote; no quote matched at more than one place in the
  document, so no locator rests on a first-match guess. The 35 entries
  marked kind inferred carry no BCP 14 keyword at
  all and so move neither count; each names in its field the lowercase verb
  that carries the obligation. Note, finally, that the source has no BCP 14
  / RFC 8174 boilerplate paragraph and no Conventions section anywhere,
  though it lists RFC 2119 among its normative references and uses 65
  uppercase keywords; bin/bcp14-count therefore strips no boilerplate here
  and all 65 occurrences are live text. That gap is reported, not repaired,
  in the Source defects section of normative.md.
reviewed_by: ""
note: >
  Ids are stable and never reused. Cite as draft-ietf-cbor-serialization#R-NNNN.

requirements:
  - id: "draft-ietf-cbor-serialization#R-0001"
    object: 'CBOR-based framework protocol specification'
    field: 'whether the specification states serialization requirements at all; the default this document sets for toolbox protocols such as CWT, COSE, EAT and CBOR itself'
    verb: 'RECOMMENDED'
    actor: 'specification'
    locator: "§2.1.1"
    text: 'It is RECOMMENDED that CBOR-based framework protocols not state serialization requirements, enabling individual uses and profiles to choose serialization to suit their environments and constraints.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0002"
    object: 'CBOR-based framework protocol specification'
    field: 'permission to impose serialization requirements notwithstanding the preceding RECOMMENDED'
    verb: 'MAY'
    actor: 'specification'
    locator: "§2.1.1"
    text: 'CBOR-based framework protocols MAY impose serialization requirements.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0003"
    object: 'CBOR-based framework protocol specification'
    field: 'the one case where a framework protocol has to mandate deterministic serialization: when the parties independently construct and serialize the data that is hashed or signed instead of transmitting the exact bytes'
    verb: 'MUST'
    actor: 'specification'
    locator: "§2.1.1"
    text: 'There is one situation in which a framework protocol MUST require deterministic serialization, though typically limited to a specific subset of the protocol.  This requirement arises when the protocol design requires the involved parties to independently construct and serialize data to be hashed or signed, rather than transmitting the exact serialized bytes that were hashed or signed.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0004"
    object: 'end-to-end protocol specification'
    field: 'existence of a stated serialization strategy that makes sender and receiver interoperable'
    verb: 'MUST'
    actor: 'specification'
    locator: "§2.1.2"
    text: 'End-to-end protocols MUST define a serialization strategy that ensures the sender and receiver use interoperable serialization.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0005"
    object: 'end-to-end protocol specification'
    field: 'which strategy to pick: normatively requiring preferred-plus serialization'
    verb: 'RECOMMENDED'
    actor: 'specification'
    locator: "§2.1.2"
    text: 'The strategy most highly RECOMMENDED is to normatively require preferred-plus serialization.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0006"
    object: 'end-to-end protocol specification'
    field: 'the alternative recommended strategy where map sorting cost is not a constraint'
    verb: 'RECOMMENDED'
    actor: 'specification'
    locator: "§2.1.2"
    text: 'If a protocol does not need to be deployed where map sorting is too expensive, requiring deterministic serialization is also RECOMMENDED.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0007"
    object: 'end-to-end protocol specification'
    field: 'permission to define a special serialization (Section 6) instead of one of the three named ones'
    verb: 'MAY'
    actor: 'specification'
    locator: "§2.1.2"
    text: 'An end-to-end protocol MAY instead define its own specialized serialization (see Section 6).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0008"
    object: 'end-to-end protocol specification'
    field: 'when a special serialization is defined, the permitted serialization behaviors must be spelled out'
    verb: 'MUST'
    actor: 'specification'
    locator: "§2.1.2"
    text: 'In such cases, it MUST explicitly specify the permitted serialization behaviors necessary to ensure interoperability.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0009"
    object: 'end-to-end protocol specification'
    field: 'the worked case of that obligation: permitting indefinite-length output obliges the protocol to require indefinite-length decoding'
    verb: 'MUST'
    actor: 'specification'
    locator: "§2.1.2"
    text: 'For example, if a sender is permitted to use indefinite-length serialization, the protocol MUST require that receivers be capable of decoding indefinite-length items.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0010"
    object: 'sender in a protocol that states no serialization requirement'
    field: 'what the sender may emit when general serialization applies by default; text is the first clause of the sentence, split from the receiver obligation at R-0011 so that each BCP 14 occurrence is carried once'
    verb: 'MAY'
    actor: 'encoder'
    locator: "§2.1.2"
    text: 'In this case, the sender MAY use any valid serialization'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0011"
    object: 'receiver in a protocol that states no serialization requirement'
    field: 'what the receiver must decode when general serialization applies by default; text is the second clause of the sentence begun at R-0010'
    verb: 'MUST'
    actor: 'decoder'
    locator: "§2.1.2"
    text: 'and the receiver MUST be able to decode it.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0012"
    object: 'protocol specification'
    field: 'falling back on general serialization by stating nothing'
    verb: 'NOT RECOMMENDED'
    actor: 'specification'
    locator: "§2.1.2"
    text: 'Defaulting to general serialization is NOT RECOMMENDED, because some serializations like indefinite-lengths are not widely supported.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0013"
    object: 'CBOR library'
    field: 'support for preferred-plus serialization, and how a library achieves it (Section 4.2 decoding plus Section 4.1 encoding as the default API)'
    verb: 'RECOMMENDED'
    actor: 'implementation'
    locator: "§2.2.1"
    text: 'It is RECOMMENDED that CBOR libraries support preferred-plus serialization.  This can be achieved by conforming to the decoding requirements in Section 4.2 and by making the encoding behavior defined in Section 4.1 the default or primary encoding API.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0014"
    object: 'CBOR library'
    field: 'support for deterministic serialization as well, because protocols such as COSE require it'
    verb: 'RECOMMENDED'
    actor: 'implementation'
    locator: "§2.2.1"
    text: 'It is also RECOMMENDED that CBOR libraries support deterministic serialization, as some protocols (for example, COSE) require it.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0015"
    object: 'CBOR library'
    field: 'permission to implement deterministic serialization only, since it is a superset of preferred-plus; no BCP 14 keyword backs it - the force is the lowercase ''may'' in both sentences'
    verb: 'may'
    actor: 'implementation'
    locator: "§2.2.1"
    text: 'A CBOR library may choose to implement only deterministic serialization and make it the default.  Deterministic serialization is a superset of preferred-plus serialization; therefore, if deterministic serialization is fully supported, explicit support for preferred-plus serialization may be omitted.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0016"
    object: 'CBOR library'
    field: 'permission to support general serialization in whole or part, which is what enables protocols using special serializations'
    verb: 'MAY'
    actor: 'implementation'
    locator: "§2.2.1"
    text: 'A CBOR library MAY also choose to support some or all aspects of general serialization (see Section 3) thereby enabling support for protocols that use specialized serializations (see Section 6).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0017"
    object: 'library implementing a framework protocol (CWT, COSE)'
    field: 'which serialization the library implements when the framework protocol mandates none'
    verb: 'RECOMMENDED'
    actor: 'implementation'
    locator: "§2.2.2"
    text: 'When a framework protocol specification does not mandate a specific serialization, it is RECOMMENDED that it implement preferred-plus serialization.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0018"
    object: 'library implementing a framework protocol'
    field: 'permission to support only deterministic serialization where that fits the deployment'
    verb: 'MAY'
    actor: 'implementation'
    locator: "§2.2.2"
    text: 'However, a library MAY choose to support only deterministic serialization if this aligns with its deployment environment and design goals.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0019"
    object: 'library implementing a framework protocol'
    field: 'conformance to a serialization the framework protocol does mandate; no BCP 14 keyword backs it - the lowercase ''must of course conform'' carries the whole force'
    verb: 'must'
    actor: 'implementation'
    locator: "§2.2.2"
    text: 'When a framework protocol mandates serialization requirements, libraries must of course conform.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0020"
    object: 'end-to-end protocol specification and its libraries'
    field: 'that the specification state serialization requirements and that libraries meet them; no BCP 14 keyword backs it - both verbs are lowercase ''should'''
    verb: 'should'
    actor: 'implementation'
    locator: "§2.2.3"
    text: 'End-to-end protocols should have explicit serialization requirements to ensure interoperability.  Libraries for end-to-end protocols should fulfill them.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0021"
    object: 'library implementing an end-to-end protocol'
    field: 'which serialization the library implements when the end-to-end protocol states none'
    verb: 'RECOMMENDED'
    actor: 'implementation'
    locator: "§2.2.3"
    text: 'If an end-to-end protocol specification does not state serialization requirements, the library is free to choose, but it is RECOMMENDED that they implement preferred-plus serialization.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0022"
    object: 'decoder that claims general-serialization support'
    field: 'acceptance of every encoding general serialization permits, for the data types the decoder supports'
    verb: 'MUST'
    actor: 'decoder'
    locator: "§3"
    text: 'A decoder claiming to support general serialization MUST accept and decode all the encodings for the data types it supports.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0023"
    object: 'decoder for a protocol whose specification is silent on serialization'
    field: 'the default: general serialization is the implied requirement, so the decoder has to take definite and indefinite lengths alike; no BCP 14 keyword backs it - the force is the lowercase ''must accept and decode'''
    verb: 'must'
    actor: 'decoder'
    locator: "§3.1"
    text: 'When a CBOR-based protocol specification does not explicitly specify serialization, general serialization is the implied requirement — meaning a compliant decoder must accept and decode any and all encodings it permits, including both definite and indefinite lengths.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0024"
    object: 'protocol specification that needs general serialization'
    field: 'saying so explicitly rather than relying on it being the theoretical default'
    verb: 'SHOULD'
    actor: 'specification'
    locator: "§3.2"
    text: 'When general serialization is required by a protocol, this SHOULD be stated explicitly.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0025"
    object: 'CBOR argument, all major types'
    field: 'the umbrella shortest-form rule for arguments, which the four MUST bullets of §4.1 item 1 then enumerate; no BCP 14 keyword backs it - the lowercase ''must be used'' carries it, while the sub-bullets use MUST'
    verb: 'must'
    actor: 'encoder'
    locator: "§4.1 item 1"
    text: 'The shortest-form of the CBOR argument must be used for all major types.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0026"
    object: 'argument values 0 to 23 and -1 to -24'
    field: 'shortest-form encoding: the argument is in the initial byte'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 1"
    text: '0 to 23 and -1 to -24 MUST be encoded in the same byte as the major type.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0027"
    object: 'argument values 24 to 255 and -25 to -256'
    field: 'shortest-form encoding: exactly one additional byte, ai = 0x18'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 1"
    text: '24 to 255 and -25 to -256 MUST be encoded only with an additional byte (ai = 0x18).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0028"
    object: 'argument values 256 to 65535 and -257 to -65536'
    field: 'shortest-form encoding: exactly two additional bytes, ai = 0x19'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 1"
    text: '256 to 65535 and -257 to -65536 MUST be encoded only with an additional two bytes (ai = 0x19).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0029"
    object: 'argument values 65536 to 4294967295 and -65537 to -4294967296'
    field: 'shortest-form encoding: exactly four additional bytes, ai = 0x1a'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 1"
    text: '65536 to 4294967295 and -65537 to -4294967296 MUST be encoded only with an additional four bytes (ai = 0x1a).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0030"
    object: 'map and array heads'
    field: 'definite-length encoding only; indefinite-length maps and arrays are excluded from preferred-plus'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 2"
    text: 'If maps or arrays are encoded, they MUST use definite-length encoding (never indefinite-length).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0031"
    object: 'text string and byte string heads'
    field: 'definite-length encoding only; the source wraps ''definite-length'' across a line break as ''definite-'' / ''length'', so the quotation rejoins it without a space'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 3"
    text: 'If text or byte strings are encoded, they MUST use definite-length encoding (never indefinite-length).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0032"
    object: 'half-precision floating-point encoding'
    field: 'encoder support for half precision; a precondition for the shortest-float rule'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 4"
    text: 'Half-precision MUST be supported'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0033"
    object: 'floating-point values'
    field: 'shortest of double, single or half precision that preserves precision'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 4"
    text: 'Values MUST be encoded in the shortest of double, single or half-precision that preserves precision.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0034"
    object: 'the floating-point value 0.0'
    field: 'the worked example of the shortest-float rule: 0.0 reduces to half precision'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 4"
    text: 'For example, 0.0 can always be reduced to half-precision so it MUST be encoded as 0xf90000.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0035"
    object: 'the floating-point value 0.1'
