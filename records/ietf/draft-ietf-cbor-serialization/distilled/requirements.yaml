    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 4"
    text: 'For another example, 0.1 would lose precision if not encoded as double-precision so it MUST be encoded as 0xfb3fb999999999999a.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0036"
    object: 'subnormal floating-point values'
    field: 'subnormal support inside the shortest-length encoding rule'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 4"
    text: 'Subnormal numbers MUST be supported in this shortest-length encoding.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0037"
    object: 'NaN output'
    field: 'the single permitted NaN encoding; this is the whole of the divergence from RFC 8949 §4.1 and §4.2.1'
    verb: 'MUST NOT'
    actor: 'encoder'
    locator: "§4.1 item 4"
    text: 'Encoders MUST NOT output any NaN other than the half-precision NaN 0xf9 0x7e 0x00 (sign bit clear, most significant significand bit set, all remaining significand bits clear).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-serialization#R-0038"
    object: 'a non-trivial NaN presented to the encoder'
    field: 'the encoder''s choice on input it may not emit: reject, or coerce to 0xf9 0x7e 0x00'
    verb: 'MUST'
    actor: 'encoder'
    locator: "§4.1 item 4"
    text: 'When a signaling NaN, a NaN with a non-zero payload, or a NaN with the sign bit set is presented to an application or library for encoding, the encoder MUST either reject it or encode it as 0xf9 0x7e 0x00.'
    kind: stated
    testable: yes
    status: active

