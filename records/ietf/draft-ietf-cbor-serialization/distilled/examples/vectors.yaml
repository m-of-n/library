record: draft-ietf-cbor-serialization
reviewed_by: ""
# Every example in draft-ietf-cbor-serialization-08, in source order.
#
# WHAT `expect` MEANS HERE.  This document does not define a format that
# encodings can be well-formed or ill-formed against: it defines three nested
# serializations, and every encoding below is well-formed, valid CBOR and valid
# GENERAL serialization - the source says so itself (Appendix L.1, "All examples
# are well-formed and valid").  So a single valid/invalid verdict needs a
# denominator.  Here:
#
#   expect        the verdict under PREFERRED-PLUS serialization (Section 4),
#                 which Section 4.3 calls "the recommended default"
#   conformance   the verdict under each of the three serializations
#   violates      why `expect` is invalid, cited by section
#   violates_deterministic
#                 present wherever deterministic serialization rejects for the
#                 one rule it adds, map key order (Section 5.1 item 2).  On the
#                 10 vectors that preferred-plus ACCEPTS this is the sole
#                 reason for rejection, and those 10 are the whole delta
#                 between the two modes.  V-0052 and V-0053 also carry it as an
#                 ADDITIONAL reason beside `violates`: both are unsorted maps
#                 as well as ill-framed ones.  So 12 vectors carry the field
#                 and 41 - 31 = 10 is still the delta.
#
# `expect: invalid` therefore means "a checking decoder configured for
# preferred-plus must reject these bytes", which is exactly the test Appendix
# L.1.3 describes.  A NON-checking preferred-plus decoder may well accept them;
# Appendix L.1.4 expects it to.
#
# HEX PROVENANCE.  All 105 byte strings below are printed in the source.  NONE is
# computed by this library - the document gives bytes for every example it
# states, including the ones buried in prose, so no vector needed reconstructing
# from a diagnostic form.  103 appear as contiguous h'' literals and were checked
# against the cached text mechanically.  Two normalisations, neither touching a
# byte: letter case, because Section 9.1 writes two of its five encodings with
# uppercase hex digits (0x1A00000001, 0x1B0000000000000001); and rejoining, for
# V-0001 and V-0002 only, whose bytes the source prints spaced and wrapped across
# two lines of a table cell (source lines 186-187 and 189-190).
#
# AND EVERY ONE WAS DECODED.  An independent CBOR decoder re-derived each value
# and each per-serialization verdict from the bytes; the generator aborts if a
# verdict stated here is not the one the decoder computes.  The decoded value in
# `decoded` is therefore checked against the source's EDN, not copied from it.
vectors:

  # ------------------------------------------------------------------
  # §1, Table 1 - Table 1, "[1, 2] definite-length and indefinite-length serializations" - the first example in the document.
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0001"
    locator: '§1, Table 1'
    diagnostic: '[1, 2]'
    hex: '820102'
    decoded: 'an array of two items, unsigned 1 and unsigned 2 - definite length: the count 2 is in the initial byte'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: 'Table 1 row 1, "Definite-length": "The array length (2) is encoded at the beginning". PROVENANCE: the source prints these bytes spaced AND wrapped inside the table cell - "0x82 0x01" on source line 186, "0x02" on line 187 - so this and V-0002 are the only vectors in the file whose hex had to be rejoined across a line break. No byte is ours.'
  - id: "draft-ietf-cbor-serialization#V-0002"
    locator: '§1, Table 1'
    diagnostic: '[1, 2]'
    hex: '9f0102ff'
    decoded: 'an array of two items, unsigned 1 and unsigned 2 - indefinite length: head 0x9f, then the items, then the break byte'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 2 - indefinite-length array or map'
    notes: 'Table 1 row 2, "Indefinite-length": "The array is terminated by the break byte (0xff)". PROVENANCE: as V-0001, wrapped inside the table cell - "0x9f 0x01" on source line 189, "0x02 0xff" on line 190, rejoined here. This is the document''s opening illustration of the problem it exists to solve - "CBOR intentionally allows multiple valid serializations of the same data item".'

  # ------------------------------------------------------------------
  # §3 - Section 3's bullet list of what general serialization permits. These are examples of encodings preferred-plus removes, given before preferred-plus is defined.
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0003"
    locator: '§3'
    diagnostic: '0'
    hex: '00'
    decoded: 'the unsigned integer 0 - argument in the initial byte'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: 'First of the three forms the bullet lists: "CBOR arguments of any length (for example, the integer 0 may be encoded as 0x00, 0x1800, or 0x190000 and so on)".'
  - id: "draft-ietf-cbor-serialization#V-0004"
    locator: '§3'
    diagnostic: '0'
    hex: '1800'
    decoded: 'the unsigned integer 0 - argument in one additional byte (ai 0x18)'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Second form from the same bullet. The bullet''s "and so on" is open-ended; Appendix L.2''s zero.edn closes it with the four- and eight-byte forms and the two big-number forms.'
  - id: "draft-ietf-cbor-serialization#V-0005"
    locator: '§3'
    diagnostic: '0'
    hex: '190000'
    decoded: 'the unsigned integer 0 - argument in two additional bytes (ai 0x19)'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Third form from the same bullet.'

  # ------------------------------------------------------------------
  # §3
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0006"
    locator: '§3'
    diagnostic: '0.00'
    hex: 'f90000'
    decoded: 'the floating-point value positive zero - half precision'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: 'From the bullet "Floating-point values encoded at any length (for example, 0.00 can be 0xf90000, 0xfa00000000, and so on)". The source writes the value as "0.00"; Appendix L.2''s float_zero.edn writes the same value as "0.0".'
  - id: "draft-ietf-cbor-serialization#V-0007"
    locator: '§3'
    diagnostic: '0.00'
    hex: 'fa00000000'
    decoded: 'the floating-point value positive zero - single precision'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 4 - not the shortest of double, single or half-precision that preserves precision'
    notes: 'Second form from the same bullet. Half precision represents positive zero exactly, so every wider encoding of it is a rule-4 violation.'

  # ------------------------------------------------------------------
  # §3
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0008"
    locator: '§3'
    diagnostic: '0'
    hex: 'c34100'
    decoded: 'the big number -1 - NOT the 0 the source claims, see notes - tag 3 (negative big number) with a one-byte content of 0x00'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 5 - leading zeros encoded in a big number; §4.1 item 5 - a value major type 0 or 1 can carry, encoded as a big number'
    notes: 'DEFECT IN THE SOURCE, reported and not repaired. The bullet reads "Big number representation of values that are also representable using major types 0 and 1 (for example, 0 can be encoded as the big number 0xc34100)". It cannot: 0xc3 is tag 3, the NEGATIVE big number, whose value is -1-n, so with a content of 0x00 these bytes decode to -1, not 0. The positive big number 0 is 0xc2 0x41 0x00 or 0xc2 0x40, and Appendix L.2''s zero.edn lists exactly those two (h''c2420000'' and h''c240'') among its general encodings of 0 - never 0xc34100. The point the bullet is making survives the slip, because -1 is also representable with a major type (type 1, as 0x20), but the stated value is wrong. Verified by decoding: these bytes are the big number -1.'

  # ------------------------------------------------------------------
  # §4.1 item 4
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0009"
    locator: '§4.1 item 4'
    diagnostic: '0.0'
    hex: 'f90000'
    decoded: 'the floating-point value positive zero - half precision'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: 'The rule''s own worked example: "For example, 0.0 can always be reduced to half-precision so it MUST be encoded as 0xf90000" (draft-ietf-cbor-serialization#R-0034). Same bytes as V-0006 and as float_zero.edn; recorded separately because it is a separate example in the source, and because this is the one place the document states it as a MUST.'

  # ------------------------------------------------------------------
  # §4.1 item 4
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0010"
    locator: '§4.1 item 4'
    diagnostic: '0.1'
    hex: 'fb3fb999999999999a'
    decoded: 'the floating-point value 0.1, which no shorter width represents exactly - double precision'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: '"For another example, 0.1 would lose precision if not encoded as double-precision so it MUST be encoded as 0xfb3fb999999999999a" (R-0035). The counter-example to 0.0: it fixes the rule''s upper end, as 0.0 fixes its lower. Not repeated in Appendix L.2, which uses 1.7976931348623157e+308 for its double vector instead, so this is the only test case in the document for a value that is irreducible for PRECISION rather than for range.'

  # ------------------------------------------------------------------
  # §4.1 item 4
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0011"
    locator: '§4.1 item 4'
    diagnostic: 'NaN'
    hex: 'f97e00'
    decoded: 'the canonical quiet NaN - half precision, sign bit clear, most significant significand bit set, all remaining significand bits clear'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: '"Encoders MUST NOT output any NaN other than the half-precision NaN 0xf9 0x7e 0x00 (sign bit clear, most significant significand bit set, all remaining significand bits clear)" (R-0037). The source prints the bytes spaced, as 0xf9 0x7e 0x00. Appendix L.2''s float_quiet_nan.edn repeats the same encoding as a vector.'

  # ------------------------------------------------------------------
  # §9.1 - Section 9.1, "Covert Channel" - the only place in the document that enumerates all five argument widths for one value. Requiring preferred-plus or deterministic serialization is offered as the mitigation: "Another option is to require preferred-plus or deterministic serialization and to have decoders issue a warning if not compliant."
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0012"
    locator: '§9.1'
    diagnostic: '1'
    hex: '01'
    decoded: 'the unsigned integer 1 - argument in the initial byte'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: 'First of the five forms in the covert-channel example: "a CBOR argument (such as an integer encoding or a string length) can be encoded up to five different ways (e.g. the value 1 can be encoded as 0x01, 0x1801, 0x190001, 0x1A00000001, or 0x1B0000000000000001)". The source writes the last two with uppercase hex digits; this file normalises hex to lower case throughout, which changes no byte.'
  - id: "draft-ietf-cbor-serialization#V-0013"
    locator: '§9.1'
    diagnostic: '1'
    hex: '1801'
    decoded: 'the unsigned integer 1 - argument in one additional byte'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Second of the five. The security argument: "This variability can be used to encode ~2 hidden bits per argument. Since every CBOR item carries an argument, even moderately complex protocols may accumulate sufficient bits to exfiltrate sensitive material (e.g., cryptographic keys) or to generate persistent identifiers for tracking users or devices."'
  - id: "draft-ietf-cbor-serialization#V-0014"
    locator: '§9.1'
    diagnostic: '1'
    hex: '190001'
    decoded: 'the unsigned integer 1 - argument in two additional bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Third of the five.'
  - id: "draft-ietf-cbor-serialization#V-0015"
    locator: '§9.1'
    diagnostic: '1'
    hex: '1a00000001'
    decoded: 'the unsigned integer 1 - argument in four additional bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Fourth of the five.'
  - id: "draft-ietf-cbor-serialization#V-0016"
    locator: '§9.1'
    diagnostic: '1'
    hex: '1b0000000000000001'
    decoded: 'the unsigned integer 1 - argument in eight additional bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Fifth of the five - and the one encoding whose prohibition Section 4.1 item 1 never actually states, since its enumeration stops at the four-byte form. Section 9.1 counts five ways; Section 4.1 rules out three of them explicitly and the fourth only by implication.'

  # ------------------------------------------------------------------
  # App. L.2 (zero.edn) - "The integer 0". Seven general encodings, one preferred-plus, one deterministic - the widest spread of any vector in the document, and the clearest demonstration of what preferred-plus removes.
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0017"
    locator: 'App. L.2 (zero.edn)'
    diagnostic: '0'
    hex: '00'
    decoded: 'the unsigned integer 0 - major type 0, argument in the initial byte'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: 'Printed in the source; decoded and checked. Conforms to all three serializations.'
  - id: "draft-ietf-cbor-serialization#V-0018"
    locator: 'App. L.2 (zero.edn)'
    diagnostic: '0'
    hex: '1800'
    decoded: 'the unsigned integer 0 - major type 0, one additional argument byte'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Printed in the source; decoded and checked. A general-serialization-only encoding of this value.'
  - id: "draft-ietf-cbor-serialization#V-0019"
    locator: 'App. L.2 (zero.edn)'
    diagnostic: '0'
    hex: '190000'
    decoded: 'the unsigned integer 0 - major type 0, two additional argument bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Printed in the source; decoded and checked. A general-serialization-only encoding of this value.'
  - id: "draft-ietf-cbor-serialization#V-0020"
    locator: 'App. L.2 (zero.edn)'
    diagnostic: '0'
    hex: '1a00000000'
    decoded: 'the unsigned integer 0 - major type 0, four additional argument bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Printed in the source; decoded and checked. A general-serialization-only encoding of this value.'
  - id: "draft-ietf-cbor-serialization#V-0021"
    locator: 'App. L.2 (zero.edn)'
    diagnostic: '0'
    hex: '1b0000000000000000'
    decoded: 'the unsigned integer 0 - major type 0, eight additional argument bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Printed in the source; decoded and checked. A general-serialization-only encoding of this value.'
  - id: "draft-ietf-cbor-serialization#V-0022"
    locator: 'App. L.2 (zero.edn)'
    diagnostic: '0'
    hex: 'c2420000'
    decoded: 'the unsigned integer 0 - tag 2 with a two-byte content of 0x0000'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 5 - leading zeros encoded in a big number; §4.1 item 5 - a value major type 0 or 1 can carry, encoded as a big number'
    notes: 'Violates both bullets of rule 5 at once: the content has leading zeros, and the value fits in major type 0.'
  - id: "draft-ietf-cbor-serialization#V-0023"
    locator: 'App. L.2 (zero.edn)'
    diagnostic: '0'
    hex: 'c240'
    decoded: 'the unsigned integer 0 - tag 2 with an EMPTY content'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 5 - a value major type 0 or 1 can carry, encoded as a big number'
    notes: 'The empty big number byte string. An encoder may never produce it, but Section 4.2 item 5 requires a decoder to take it: "An empty byte string MUST be accepted and treated as the value zero" (draft-ietf-cbor-serialization#R-0049). No leading-zero violation, because there are no bytes to lead.'

  # ------------------------------------------------------------------
  # App. L.2 (three.edn) - "The integer 3". Same shape as zero.edn without the empty-content case.
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0024"
    locator: 'App. L.2 (three.edn)'
    diagnostic: '3'
    hex: '03'
    decoded: 'the unsigned integer 3 - major type 0, argument in the initial byte'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: 'Printed in the source; decoded and checked. Conforms to all three serializations.'
  - id: "draft-ietf-cbor-serialization#V-0025"
    locator: 'App. L.2 (three.edn)'
    diagnostic: '3'
    hex: '1803'
    decoded: 'the unsigned integer 3 - major type 0, one additional argument byte'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Printed in the source; decoded and checked. A general-serialization-only encoding of this value.'
  - id: "draft-ietf-cbor-serialization#V-0026"
    locator: 'App. L.2 (three.edn)'
