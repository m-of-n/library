    decoded: 'the negative integer -25 - major type 1, eight additional argument bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Printed in the source; decoded and checked. A general-serialization-only encoding of this value.'
  - id: "draft-ietf-cbor-serialization#V-0034"
    locator: 'App. L.2 (minus_twenty_five.edn)'
    diagnostic: '-25'
    hex: 'c3420018'
    decoded: 'the negative integer -25 - tag 3 with a two-byte content of 0x0018 (n = 24, value -1-24)'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 5 - leading zeros encoded in a big number; §4.1 item 5 - a value major type 0 or 1 can carry, encoded as a big number'
    notes: 'Printed in the source; decoded and checked. A general-serialization-only encoding of this value.'

  # ------------------------------------------------------------------
  # App. L.2 (65_bit_neg.edn) - "Largest negative integer".
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0035"
    locator: 'App. L.2 (65_bit_neg.edn)'
    diagnostic: '-18446744073709551616'
    hex: '3bffffffffffffffff'
    decoded: 'the negative integer -2^64, the largest-magnitude value major type 1 can carry - major type 1, eight argument bytes, argument 2^64-1, value -1-(2^64-1)'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: 'The far end of major type 1. Its argument is 0xffffffffffffffff, which needs all eight bytes, so this is the one integer vector in the document where the eight-byte form IS the shortest form.'
  - id: "draft-ietf-cbor-serialization#V-0036"
    locator: 'App. L.2 (65_bit_neg.edn)'
    diagnostic: '-18446744073709551616'
    hex: 'c348ffffffffffffffff'
    decoded: 'the negative integer -2^64, the largest-magnitude value major type 1 can carry - tag 3 with an eight-byte content of 0xffffffffffffffff'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 5 - a value major type 0 or 1 can carry, encoded as a big number'
    notes: 'No leading zeros, so only the unification bullet is violated - and this is the vector that fixes the 9-byte floor for big numbers: an 8-byte content is always a value major type 1 can carry.'

  # ------------------------------------------------------------------
  # App. L.2 (byte_string.edn) - "The byte string of length 3: 0x010203".
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0037"
    locator: 'App. L.2 (byte_string.edn)'
    diagnostic: 'h''010203'''
    hex: '43010203'
    decoded: 'the three-byte byte string 0x010203 - definite length 3 in the initial byte, then the content'
