  # ------------------------------------------------------------------
  # App. L.2 (minus_twenty_five.edn) - "The integer -25". The only vector exercising the negative half of the shortest-form table.
  # ------------------------------------------------------------------
  - id: "draft-ietf-cbor-serialization#V-0030"
    locator: 'App. L.2 (minus_twenty_five.edn)'
    diagnostic: '-25'
    hex: '3818'
    decoded: 'the negative integer -25 - major type 1, one additional argument byte (argument 24, value -1-24)'
    expect: valid
    conformance:
      general: valid
      preferred_plus: valid
      deterministic: valid
    notes: 'The boundary case for rule 1''s second bullet on the negative side: -25 is the first value that needs an additional byte, because -1..-24 fit in the initial byte.'
  - id: "draft-ietf-cbor-serialization#V-0031"
    locator: 'App. L.2 (minus_twenty_five.edn)'
    diagnostic: '-25'
    hex: '390018'
    decoded: 'the negative integer -25 - major type 1, two additional argument bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Printed in the source; decoded and checked. A general-serialization-only encoding of this value.'
  - id: "draft-ietf-cbor-serialization#V-0032"
    locator: 'App. L.2 (minus_twenty_five.edn)'
    diagnostic: '-25'
    hex: '3a00000018'
    decoded: 'the negative integer -25 - major type 1, four additional argument bytes'
    expect: invalid
    conformance:
