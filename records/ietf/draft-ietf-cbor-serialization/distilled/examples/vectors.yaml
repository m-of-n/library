  - id: "draft-ietf-cbor-serialization#V-0027"
    locator: 'App. L.2 (three.edn)'
    diagnostic: '3'
    hex: '1a00000003'
    decoded: 'the unsigned integer 3 - major type 0, four additional argument bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
    notes: 'Printed in the source; decoded and checked. A general-serialization-only encoding of this value.'
  - id: "draft-ietf-cbor-serialization#V-0028"
    locator: 'App. L.2 (three.edn)'
    diagnostic: '3'
    hex: '1b0000000000000003'
    decoded: 'the unsigned integer 3 - major type 0, eight additional argument bytes'
    expect: invalid
    conformance:
      general: valid
      preferred_plus: invalid
      deterministic: invalid
    violates: '§4.1 item 1 - the argument is not in shortest form'
