  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "statements and verbatim blocks across the source's own section structure. Re-derived by the verify pass: 294 inline quotations, all contiguous substrings of the source and all correctly located against a section map built from the document's own headings; 36 fenced blocks, each a byte-exact and uniquely located line range of the source; no quotation crosses a page boundary and none splices two non-adjacent passages. §4.1, §4.2, §5.1 and §5.2 are reproduced in full. Appendix C.2 is omitted and the omission is now declared in the preamble"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "100 entries R-0001 to R-0100 in source order: 65 stated carrying all 65 BCP 14 occurrences (41 MUST, 8 MAY, 7 RECOMMENDED, 4 SHOULD, 4 MUST NOT, 1 NOT RECOMMENDED) and 35 inferred carrying none. source and extracted counts both 65, recomputed by the verify pass. The 65 source occurrences were enumerated by line and matched one-to-one to the 65 stated entries: 0 unclaimed, 0 claimed twice, 0 entries carrying none or more than one. All 100 quoted texts are contiguous substrings of the cached source and every locator names a section that contains its quote, with no quote matching at two places. Two sentences carry two occurrences each for two different actors and are quoted as two non-overlapping verbatim clauses rather than twice in full, which would have double-counted; pass 1 said three and named the wrong pair, corrected by the verify pass"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "3 verbatim (bignums.cddl from Appendix F; serial-control-operator.cddl from §8; pref-plus-float.c, Appendix D's 133-line C function) and 3 derived (a head-layer ABNF, an encode procedure, a check procedure). Each verbatim fence was byte-compared against the cached source by script. The source ships NO ABNF, NO JSON Schema and no CDDL profile of either serialization it defines — §8 adds a control operator instead of a grammar. The derived ABNF admits 224 of RFC 8949's 229 well-formed initial bytes, excluding exactly 5f 7f 9f bf ff, and its float byte-range predicates were checked exhaustively against IEEE 754. The verify pass re-ran all of it independently: the three verbatim regions are byte-exact at their claimed source ranges (pref-plus-float.c reconstructs to exactly 133 lines once the three documented 8-line page-furniture blocks are removed); the ABNF admits 224 of 229, 28 per major type, excluding exactly those five, with 0 half-pattern mismatches over all 65536 and 0 leading-two-byte mismatches over all 65536 single and 65536 double patterns; and the Appendix F floor of 9 was re-derived from the major-type ranges. The README's count of derived files said four and is corrected to three. The cross-check pass made all three derived files executable and ran them against the vectors, which found one defect in this library's own material and one in the source. OURS, fixed: serialization-check.derived.pseudocode.txt's CHECK_ITEM step 5 applied CHECK_SHORTEST to major type 7, whose argument is a float payload or a simple value rather than a length or count, so as written it rejected h'f90000' — the encoding of 0.0 that §4.1 item 4 states as a MUST and that the corpus carries three times as valid in all three serializations — along with all 256 half patterns below 0x0100, 65535 of the 65536 single patterns below 0x00010000 and every double pattern below 2^32. The ABNF never had the bug, reaching major type 7 through simple-head and float-head, so the two derived artifacts disagreed and the ABNF was right; step 5 now carries the guard, and with it the procedure implemented literally reproduces all 210 preferred-plus and deterministic verdicts with 0 disagreements. THE SOURCE'S, reported: Appendix D's off-by-one, schema/README.md item 7. The ABNF's own census claim was re-derived a second time from the grammar as parsed rather than as described: 224 of 229, 28 per major type, excluding exactly 5f 7f 9f bf ff"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "19 structures and 48 fields, every field carrying constrained_by. The map key comparison is spelled out byte by byte: unsigned, over the whole encoded key, explicitly NOT RFC 7049 §3.9 length-first. Pass 1 linked only where §4.1/§4.2/§5.1 item numbering mapped one-to-one onto an id — 49 links over 25 ids — and the verify pass recounted those and corrected the sort-discrimination number carried in the `map` entry. The cross-check pass completed them: 40 fields now hold 203 links to 68 of the 100 requirements and 8 hold an explicit empty list with a note, every id resolving and identical under bin/_yaml.parse and bin/_record_yaml.load_yaml. The two-part linking rule is written into the file header with four worked corollaries, and the 32 unlinked requirements are enumerated in five groups: 10 protocol-design policy, 9 library policy, 2 profile-inheritance sentences, 3 incorporation-by-reference and IANA, and the 7 non-binding occurrences the requirements reconciliation names. One pass-1 link was removed with its reason stated on the field (R-0025 on data-item-head.major_type: it says 'for all major types' but constrains the argument). Two findings recorded on fields: tag.content carries one link because §8's recursion clause names only arrays and maps, and text-string.content carries none because the document has no normalization rule at all"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: "105 vectors V-0001 to V-0105. All 105 hex strings come from the source and none were computed by this extraction; 103 matched the cached text as contiguous hex by script, the other two (V-0001/V-0002) only after rejoining bytes Table 1 prints spaced and wrapped across table-cell lines. `expect` is the verdict under preferred-plus (41 valid / 64 invalid); `conformance` carries all three serializations; deterministic rejects 74. Verdicts were computed from §4.1/§5.1 by a decoder that never read Appendix L.2's own lists, and then agreed with those lists for all 25 files across 34 and 24 encodings with 0 mismatches. The verify pass reproduced all of this with a second, independent decoder written without a CBOR library and with exact-rational IEEE 754 arithmetic: 105/105 decoded, every diagnostic confirmed, all 315 conformance verdicts and all 105 `expect` values re-derived identically, the 103/2 provenance split confirmed, and the 25 files' own classifications reproduced again with 0 mismatches. Two `violates_deterministic` fields (V-0052, V-0053) were out of contract with the file's own definition; the definition was corrected rather than the data, since both statements are true. The cross-check pass then ran all 105 through a layered checker transcribed from distilled/schema/ — a grammar layer that parses prefp-head.derived.abnf itself and matches `prefp-head` at every head position, a check layer for the two value-dependent rules no grammar reaches, and an encode layer that decodes and re-encodes — and reproduced all 420 verdicts with 0 mismatches. 58 of the 64 preferred-plus rejections are decided by the grammar alone (27 non-shortest arguments, 12 indefinite, 10 fixed float patterns, 9 big-number), 6 need Appendix D's arithmetic, and the 10 extra deterministic rejections are all map order; the encode layer caught nothing the other two had not, and was shown non-vacuous by disabling the check layer. Every invalid vector failed for its stated prose reason, 0 disagreements, and that mapping is what `violates_requirements` was derived from: 64 vectors, 109 links over 13 ids, plus `violates_deterministic_requirements` on all 12, every id resolving. Discrimination was proved on 210 negative controls, 181 of them absent from the corpus, across indefinite heads, non-preferred widths at every argument size, misordered and duplicate-key maps, big-number leading-zero and range edges, reserved `ai` and the float boundaries: 0 failures"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "this document against RFC 8949 §4.2, CDE and dCBOR; the convergence question owned by topics/deterministic-cbor-profiles.yaml; the R-O-03 citation-target question; and where the source cuts against MD-3. Written with the dCBOR and CDE design notes available for comparison. The cross-check pass re-checked every assertion it makes about those two records against their own artifacts, now both at profile: full — CDE's expiry and its .cde/.cdeseq registrations, its strictly-greater map-key phrasing, its eleven restrictions, its row CDE-26, and dCBOR's tag 201, NFC requirement, simple-value restriction, expiry and implementation findings — and found none contradicted. The CDE NaN claim was strengthened with the sharpest available evidence rather than corrected: draft-ietf-cbor-cde#V-0081 is h'f97dff' with expect valid and draft-ietf-cbor-serialization#V-0103 is the same three bytes, invalid under both of this document's serializations. Two source defects added by the cross-check pass as items 17 and 18: Appendix D's S2H_MIN_SUBNORM_EXP is 102 where the half subnormal floor is biased single exponent 103, so pref_plus_single_to_half() narrows ±2^-25 to half ±0.0 and the example code violates the preserves-precision rule it implements — exactly 2 of the 63,493 inputs it narrows change value, established by exhaustive exact enumeration, while the parallel D2S constant is correct; and §8's recursion clause names arrays and maps and never tags, although the document's own date_epoch_tag.edn treats tag content as profile-dependent"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "The document defines serializations, not an exchange, and says so itself: \"This document defines two CBOR serializations: 'preferred-plus serialization' and 'deterministic serialization.' It also introduces the term 'general serialization'\" (Abstract). Nothing else is defined. The words handshake, session, retry, acknowledg*, exchange and transition occur ZERO times in 2968 lines; the only negotiation vocabulary describes other people's protocols (\"When such a protocol includes optional features, they are typically selected through real-time negotiation\", §2.1.2). Where a sender and receiver do appear it is to require that the BYTES match, not that anything is exchanged: \"both the sender and the receiver must independently construct the exact same sequence of bytes\" (§5.3.1). The one message structure discussed is explicitly someone else's and is reproduced nowhere (Appendix K on COSE_Sign1, RFC 9052 §4.2)."
    - kind: state-machine
      reason: "No lifecycle and no states. Every occurrence of \"state\" in the document is the verb to state, checked line by line; there is no protocol state vocabulary at all. The closest thing to a sequence is Appendix D's double->single->half conversion, which is a pipeline inside one encoder, and the three serializations form a subset lattice (deterministic within preferred-plus within general), not a set of states. Both are captured in distilled/schema/ as pseudocode."
