    - pass: cross-check
      by: "claude-opus-5"
      effort: max
      date: "2026-10-19"
      note: "artifact against artifact; the source was opened only to adjudicate. (1) FIELDS: walked all 100 requirements against the 19 structures and completed constrained_by on all 48 fields - 40 fields, 203 links, 68 ids, plus 8 fields with an explicit empty list and a reason; the two-part linking rule and the 32 unlinked requirements, in five groups, are in the file header; one pass-1 link removed with its reason on the field. Every structure or field named by any requirement exists in messages.yaml or distilled/schema/, with one stated exception: the library API surface named by §2.2 and Appendix G is not modelled, correctly, because messages.yaml holds encoded forms. (2)(3) PROTOCOL AND STATE MACHINE: confirmed no artifact implies an exchange or a lifecycle - the exchange vocabulary appears nowhere in distilled/ except in the README sentence that denies it, and there is no sequence, flow, trigger or state table anywhere. (4) EXAMPLES AGAINST THE SCHEMA: transcribed all three derived files into a runnable layered checker, the grammar layer PARSING prefp-head.derived.abnf itself so it cannot drift, and ran every vector through it - 420 of 420 verdicts reproduced, 0 mismatches; 58 of 64 preferred-plus rejections decided by the grammar alone, 6 by Appendix D's arithmetic, the 10 extra deterministic ones all map order, and 0 by the encode layer, which was shown non-vacuous by disabling the layer above it. Discrimination proved on 210 negative controls, 181 absent from the corpus, 0 failures. Added violates_requirements to all 64 vectors carrying `violates` and violates_deterministic_requirements to all 12 carrying `violates_deterministic`, each derived from the bytes and then agreeing with the prose clause by clause. THREE DEFECTS FOUND: Appendix D's S2H_MIN_SUBNORM_EXP off-by-one, which makes the document's own example code lose the value ±2^-25 (design-notes 17, proved by exhaustive exact enumeration of all 63,493 narrowed inputs); §8's recursion clause never mentioning tags (design-notes 18); and, in this library's own material, CHECK_SHORTEST applied to major type 7, which rejected h'f90000' - now fixed and reconciled with the ABNF. One stale claim corrected: V-0061's note still carried the withdrawn one-disagreement sort finding; re-derived across all 16 map encodings as 0 under the stated sort key and 1 under the printed-bytes reading. Counts reconciled across every artifact: 16 map encodings with zero sort-order disagreements, 25 corpus files from source line 2366, 34 preferred-plus and 24 deterministic encodings across those files, 12 violates_deterministic fields with a 10-vector delta, and the withdrawn Table 3 defect still withdrawn. Both YAML readers return identical counts on all three artifacts with every `#`-bearing id surviving distinctly"
