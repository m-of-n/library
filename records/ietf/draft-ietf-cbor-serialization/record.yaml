distillation:
  standard: "FX-1"
  # NO `profile` YET. Passes 1 (extract) and 2 (verify) are complete across
  # the whole artifact set, but the cross-check pass has NOT run, and an
  # unfinished extraction is neither `full` nor `partial`
  # (docs/extraction.md). bin/check-pr-extraction will report this record as
  # declaring no profile; that report is correct.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "statements and verbatim blocks across the source's own section structure. Re-derived by the verify pass: 294 inline quotations, all contiguous substrings of the source and all correctly located against a section map built from the document's own headings; 36 fenced blocks, each a byte-exact and uniquely located line range of the source; no quotation crosses a page boundary and none splices two non-adjacent passages. §4.1, §4.2, §5.1 and §5.2 are reproduced in full. Appendix C.2 is omitted and the omission is now declared in the preamble"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "100 entries R-0001 to R-0100 in source order: 65 stated carrying all 65 BCP 14 occurrences (41 MUST, 8 MAY, 7 RECOMMENDED, 4 SHOULD, 4 MUST NOT, 1 NOT RECOMMENDED) and 35 inferred carrying none. source and extracted counts both 65, recomputed by the verify pass. The 65 source occurrences were enumerated by line and matched one-to-one to the 65 stated entries: 0 unclaimed, 0 claimed twice, 0 entries carrying none or more than one. All 100 quoted texts are contiguous substrings of the cached source and every locator names a section that contains its quote, with no quote matching at two places. Two sentences carry two occurrences each for two different actors and are quoted as two non-overlapping verbatim clauses rather than twice in full, which would have double-counted; pass 1 said three and named the wrong pair, corrected by the verify pass"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "3 verbatim (bignums.cddl from Appendix F; serial-control-operator.cddl from §8; pref-plus-float.c, Appendix D's 133-line C function) and 3 derived (a head-layer ABNF, an encode procedure, a check procedure). Each verbatim fence was byte-compared against the cached source by script. The source ships NO ABNF, NO JSON Schema and no CDDL profile of either serialization it defines — §8 adds a control operator instead of a grammar. The derived ABNF admits 224 of RFC 8949's 229 well-formed initial bytes, excluding exactly 5f 7f 9f bf ff, and its float byte-range predicates were checked exhaustively against IEEE 754. The verify pass re-ran all of it independently: the three verbatim regions are byte-exact at their claimed source ranges (pref-plus-float.c reconstructs to exactly 133 lines once the three documented 8-line page-furniture blocks are removed); the ABNF admits 224 of 229, 28 per major type, excluding exactly those five, with 0 half-pattern mismatches over all 65536 and 0 leading-two-byte mismatches over all 65536 single and 65536 double patterns; and the Appendix F floor of 9 was re-derived from the major-type ranges. The README's count of derived files said four and is corrected to three"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "19 structures with 49 constrained_by links over 25 distinct requirement ids, each verified to exist in requirements.yaml; linked only where §4.1/§4.2/§5.1 item numbering maps one-to-one onto ids, omitted elsewhere. The map key comparison is spelled out byte by byte: unsigned, over the whole encoded key, explicitly NOT RFC 7049 §3.9 length-first. The verify pass recounted 19 structures, 49 links and 25 distinct ids, all resolving, and corrected the sort-discrimination number carried in the `map` entry"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: "105 vectors V-0001 to V-0105. All 105 hex strings come from the source and none were computed by this extraction; 103 matched the cached text as contiguous hex by script, the other two (V-0001/V-0002) only after rejoining bytes Table 1 prints spaced and wrapped across table-cell lines. `expect` is the verdict under preferred-plus (41 valid / 64 invalid); `conformance` carries all three serializations; deterministic rejects 74. Verdicts were computed from §4.1/§5.1 by a decoder that never read Appendix L.2's own lists, and then agreed with those lists for all 25 files across 34 and 24 encodings with 0 mismatches. The verify pass reproduced all of this with a second, independent decoder written without a CBOR library and with exact-rational IEEE 754 arithmetic: 105/105 decoded, every diagnostic confirmed, all 315 conformance verdicts and all 105 `expect` values re-derived identically, the 103/2 provenance split confirmed, and the 25 files' own classifications reproduced again with 0 mismatches. Two `violates_deterministic` fields (V-0052, V-0053) were out of contract with the file's own definition; the definition was corrected rather than the data, since both statements are true"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "this document against RFC 8949 §4.2, CDE and dCBOR; the convergence question owned by topics/deterministic-cbor-profiles.yaml; the R-O-03 citation-target question; and where the source cuts against MD-3. Written with the dCBOR and CDE design notes available for comparison"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "The document defines serializations, not an exchange, and says so itself: \"This document defines two CBOR serializations: 'preferred-plus serialization' and 'deterministic serialization.' It also introduces the term 'general serialization'\" (Abstract). Nothing else is defined. The words handshake, session, retry, acknowledg*, exchange and transition occur ZERO times in 2968 lines; the only negotiation vocabulary describes other people's protocols (\"When such a protocol includes optional features, they are typically selected through real-time negotiation\", §2.1.2). Where a sender and receiver do appear it is to require that the BYTES match, not that anything is exchanged: \"both the sender and the receiver must independently construct the exact same sequence of bytes\" (§5.3.1). The one message structure discussed is explicitly someone else's and is reproduced nowhere (Appendix K on COSE_Sign1, RFC 9052 §4.2)."
    - kind: state-machine
      reason: "No lifecycle and no states. Every occurrence of \"state\" in the document is the verb to state, checked line by line; there is no protocol state vocabulary at all. The closest thing to a sequence is Appendix D's double->single->half conversion, which is a pipeline inside one encoder, and the three serializations form a subset lattice (deterministic within preferred-plus within general), not a set of states. Both are captured in distilled/schema/ as pseudocode."
  passes:
    - pass: extract
      by: "claude-opus-5 (3 parallel agents, resumed after a rate limit)"
      effort: max
      date: "2026-10-18"
      note: "each agent read only .cache/draft-ietf-cbor-serialization.txt; vectors.yaml is reproducible from a generator that aborts if any declared verdict disagrees with an independent decoder"
    - pass: verify
      by: "claude-opus-5"
      effort: max
      date: "2026-10-19"
      note: "adversarial re-derivation against the cached source alone. Recounted BCP 14 (65 = 65, same keyword split) and matched all 65 source occurrences to stated entries by line, one-to-one. Swept all 394 quotations (100 requirements, 294 normative.md inline) for contiguity and locator truth against a section map built from the document's own headings, and byte-compared all 36 fenced blocks and the 3 verbatim schema files against their claimed source ranges. Re-decoded all 105 vectors with a second decoder using no CBOR library and exact-rational IEEE 754, re-deriving every verdict. Re-checked the derived ABNF exhaustively (224 of 229 well-formed initial bytes; 65536 half patterns and 65536 leading-two-byte single and double patterns, 0 mismatches). Four pass-1 claims corrected: the reconciliation said three split sentences and named the wrong ids (two, R-0010/R-0011 and R-0060/R-0061); normative.md's Table 3 defect was false and is withdrawn; normative.md said 24 example data items from line 2354 (25, from 2366); the corpus sort-order finding said the two orders disagree on one encoding (zero, under the sort key §5.1 item 2 actually names - which strengthens the finding). No dropped normative statement was found and no requirement was added or removed"
