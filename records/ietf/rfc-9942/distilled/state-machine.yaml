record: rfc-9942
reviewed_by: ""
source_version: "RFC 9942"
source_digest: "da8ed24ef2d757ece900decf34a003a7b02679a16f4c1f25670ea59435372da0"
source_lines_total: 1033
note: >
  RFC 9942 defines no state machine. It defines two verification procedures
  in prose — one as two numbered steps (§5.2.1), one as unnumbered narrative
  (§5.3.1) — plus an admission gate on the enclosing envelope (§4.3). The
  three machines below are a derived rendering, not a quotation: the states
  and transitions are inferred, while every `text:` value is a contiguous
  verbatim span of the source joined one line to the next by exactly one
  space, the same line-join convention requirements.yaml records. Double
  spaces after sentence-ending periods are preserved wherever they fall
  mid-line. Section-symbol locators are the RFC's own numbering; the
  `source_lines` values index the cached text rendering
  (.cache/rfc-editor-org-rfc-rfc9942-txt.bin, 1033 lines, never committed —
  digest above). The reason this artifact exists is
  `verification_order_inversion` below: the two procedures run in opposite
  orders, the document never says so, and an implementation that factors them
  into one shared routine inverts one of them silently.

# ---------------------------------------------------------------------------
# THE FINDING. Read this before the machines.
# ---------------------------------------------------------------------------
verification_order_inversion:
  summary: >
    The two Receipt-verification procedures in this document run their two
    checks in opposite orders. Inclusion (§5.2.1) is proof then signature.
    Consistency (§5.3.1) is signature then proof. The document states each
    order plainly in its own section and never once remarks that they differ,
    so the inversion is visible only to a reader holding both sections at the
    same time.
  constrained_by:
    - rfc-9942#R-0014    # §5.2.1 "Verification of the inclusion proof and signature occurs in two sequential steps"
    - rfc-9942#R-0019    # §5.3.1 "The signature and consistency proof are verified in order."
    - rfc-9942#R-0020    # §5.3.1 single-boolean recommendation
    - rfc-9942#R-0004    # §4.4 payload SHOULD be detached
    - rfc-9942#R-0009    # §5.2 leaf_index >= tree_size

  # The inversion is recorded five independent ways, so that losing any one
  # of them still leaves the finding checkable. README.md cites this count;
  # the list below is what it cites. Each way is locatable by the YAML path
  # given, and each is derivable without reading the other four.
  enumerated_ways:
    count: 5
    ways:
      - n: 1
        name: the two order vectors
        path: 'verification_order_inversion.inclusion.order, .consistency.order'
        what: >
          Two explicit ordered lists — [inclusion-proof-verification,
          signature-verification] against [signature-verification,
          consistency-proof-verification] — which are reverses of each other
          element for element. A reader compares two literals, not two
          paragraphs.
      - n: 2
        name: the per-machine order tag and its warning
        path: 'machines[].order, machines[consistency-receipt-verification].order_warning'
        what: >
          Each verification machine carries order PROOF-THEN-SIGNATURE or
          SIGNATURE-THEN-PROOF as a field of its own, and the consistency
          machine additionally carries order_warning naming the inclusion
          machine as OPPOSITE. A tool reading only the machine headers sees
          the inversion without reading a transition.
      - n: 3
        name: the transition topology
        path: 'machines[].transitions'
        what: >
          Derivable from the edges alone, with no prose read. In
          inclusion-receipt-verification the sole predecessor of
          signature-verified is payload-bound, which is reachable only
          through root-recomputed; in consistency-receipt-verification the
          sole predecessor of consistency-checked is signature-verified. The
          two graphs order the same pair of checks oppositely.
      - n: 4
        name: the absent transitions
        path: 'machines[].absent_transitions'
        what: >
          Four entries stating, as data, the transitions that must NOT exist:
          receipt-admitted -> signature-verified and payload-bound ->
          inclusion-confirmed for inclusion; receipt-admitted ->
          consistency-checked and signature-invalid -> consistency-checked
          for consistency. Each absence IS one of the two orderings, so a
          conformance checker can test for the ordering by testing for the
          absence.
      - n: 5
        name: the hazard, stated as the implementation defect
        path: 'verification_order_inversion.hazard'
        what: >
          The inversion named as the concrete factoring that causes it —
          shared-verify-routine-inverts-one-procedure — with
          consequence_inclusion and consequence_consistency spelling out what
          breaks in each direction and mitigation_in_source recording what
          the document itself offers against it (rfc-9942#R-0020).
    further_corroboration_not_counted: >
      Two further places make the inversion visible but are NOT counted among
      the five, because each is derived from one of them rather than
      independent of it: consistency-receipt-verification.result_reporting
      (signature-verified must not be observable as an outcome distinct from
      append-only-assured, which restates way 4's second consistency absence)
      and detachment_tension (which explains WHY the inclusion order is
      forced, and so depends on way 3's topology).

  inclusion:
    locator: "§5.2.1"
    source_lines: "556-566"
    order: [inclusion-proof-verification, signature-verification]
    numbered_in_source: true
    coupling: data-dependency
    coupling_note: >
      The order here is not a convention that an implementation may reverse.
      Step 1 produces the input to step 2: the recomputed Merkle Tree root
      *becomes* the COSE_Sign1 payload. With a detached payload there is
      nothing to verify a signature over until the proof has been applied, so
      a verifier that signature-checks first has necessarily supplied the
      payload from somewhere other than the proof.
    quotes:
      - locator: "§5.2.1"
        source_lines: "556-557"
        text: 'Verification of the inclusion proof and signature occurs in two sequential steps:'
      - locator: "§5.2.1 step 1"
        source_lines: "559-562"
        text: '1.  Inclusion Proof Verification: The verifier applies the inclusion proof to the bytes of a candidate entry.  If this fails, the proof is invalid.  If it succeeds, the resulting Merkle Tree root becomes the COSE_Sign1 payload.'
      - locator: "§5.2.1 step 2"
        source_lines: "564-566"
        text: '2.  Signature Verification: The verifier checks the COSE_Sign1 signature.  Successful verification confirms the entry''s inclusion in the VDS; otherwise, the signature is invalid.'
    verbatim_layout: |
      Verification of the inclusion proof and signature occurs in two
      sequential steps:

      1.  Inclusion Proof Verification: The verifier applies the inclusion
          proof to the bytes of a candidate entry.  If this fails, the
          proof is invalid.  If it succeeds, the resulting Merkle Tree root
          becomes the COSE_Sign1 payload.

      2.  Signature Verification: The verifier checks the COSE_Sign1
          signature.  Successful verification confirms the entry's
          inclusion in the VDS; otherwise, the signature is invalid.

  consistency:
    locator: "§5.3.1"
    source_lines: "668-679"
    order: [signature-verification, consistency-proof-verification]
    numbered_in_source: false
    numbered_in_source_note: >
      §5.3.1 carries no numbered list. The order is given as "First ... Second
      ..." inside a single run-on paragraph that also states the failure
      consequence, a VDS-specificity caveat and the result-type
      recommendation. A reader skimming for the numbered-step pattern of
      §5.2.1 finds none, which is part of why the inversion goes unnoticed.
    coupling: control-dependency
    coupling_note: >
      The order here is a short-circuit, not a data dependency: a signature
      failure suppresses the proof check ("the consistency proof is not
      checked"). The proof check needs an input the receipt does not carry —
      "a previous inclusion proof" — and the signature check needs the newer
      Merkle Tree root, which §5.3.1 declares a detached payload. So both
      checks depend on verifier-supplied state, and neither feeds the other.
    quotes:
      - locator: "§5.3.1"
        source_lines: "668"
        text: 'The signature and consistency proof are verified in order.'
      - locator: "§5.3.1"
        source_lines: "670-679"
        text: 'First, the verifier checks the signature on the COSE_Sign1.  If the verification fails, the consistency proof is not checked.  Second, the consistency proof is checked by applying a previous inclusion proof to the consistency proof.  If the verification fails, the append-only property of the VDS is not assured.  This approach is specific to RFC9162_SHA256; different VDSs may not support consistency proofs.  It is recommended that implementations return a single boolean result for Receipt-verification operations to reduce the chance of accepting a valid signature over an invalid consistency proof.'
    verbatim_layout: |
      The signature and consistency proof are verified in order.

      First, the verifier checks the signature on the COSE_Sign1.  If the
      verification fails, the consistency proof is not checked.  Second,
      the consistency proof is checked by applying a previous inclusion
      proof to the consistency proof.  If the verification fails, the
      append-only property of the VDS is not assured.  This approach is
      specific to RFC9162_SHA256; different VDSs may not support
      consistency proofs.  It is recommended that implementations return a
      single boolean result for Receipt-verification operations to reduce
      the chance of accepting a valid signature over an invalid consistency
      proof.

  # What goes wrong, stated as the concrete implementation defect.
  hazard:
    name: shared-verify-routine-inverts-one-procedure
    statement: >
      A single verify(receipt) that branches only on the VDP label (-1
      inclusion / -2 consistency) after a common signature check will have
      inverted §5.2.1. A single routine that applies the proof first and then
      checks the signature will have inverted §5.3.1. Either factoring is a
      natural one to reach for, because the two receipt profiles are
      byte-identical apart from the proof label — the §5.2.1 and §5.3.1
      header field tables repeat alg and vds verbatim (rfc-9942#R-0010 and
      rfc-9942#R-0015, rfc-9942#R-0011 and rfc-9942#R-0016), which invites
      exactly the code sharing that loses the ordering.
    consequence_inclusion: >
      Inverting §5.2.1 means the verifier must have obtained a payload other
      than from the proof in order to have a signature to check. That is
      precisely the condition §4.4 says detached payloads exist to prevent:
      "implementation errors where the signature is verified but the payload
      is incompatible with the proof". The result is a receipt that passes
      signature verification while attesting to a root the candidate entry
      does not hash into.
    consequence_consistency: >
      Inverting §5.3.1 forfeits the short-circuit: the consistency proof is
      applied under an unverified signature, so proof-application code
      processes attacker-chosen path bytes before authentication. It also
      leaks a distinguishable outcome — proof-invalid versus
      signature-invalid — which is the two-value result the single-boolean
      recommendation (rfc-9942#R-0020) exists to suppress.
    mitigation_in_source:
      locator: "§5.3.1"
      source_lines: "676-679"
      requirement: rfc-9942#R-0020
      text: 'It is recommended that implementations return a single boolean result for Receipt-verification operations to reduce the chance of accepting a valid signature over an invalid consistency proof.'
      reading: >
        The recommendation names the failure it guards against — "accepting a
        valid signature over an invalid consistency proof" — which is the
        same shape of defect §4.4 names for inclusion. The document therefore
        knows about this hazard class twice, in two places, without ever
        joining them up. Note what the recommendation does and does not do:
        collapsing the result to one boolean hides *which* check failed from
        the caller, but it does not by itself force the checks to run in the
        specified order. Ordering has to be enforced in the routine.

  # The second-order observation. The one that is easy to miss.
  detachment_tension:
    locator: "§4.4 vs §5.3.1"
    statement: >
      §4.4 gives a reason for detaching the payload: it "force[s] verifiers
      to recompute the root from the proof". §5.2.1 honours that — the
      recomputed root becomes the payload. §5.3.1 declares the newer Merkle
      Tree root "a detached payload" and then has the verifier check the
      signature *first*, which is only possible if the verifier already holds
      that root from outside the receipt. Detachment in the consistency
      profile therefore does not force recomputation from the proof the way
      §4.4 motivates it; it just means the root travels separately. Both
      EDN examples (Figure 6, source line 547; Figure 9, source line 659)
      carry `/ payload / null`.
    quotes:
      - locator: "§4.4"
        source_lines: "408-412"
        requirement: rfc-9942#R-0004
        text: 'New VDSs can require the definition of a profile.  The payload in such definitions SHOULD be detached.  Detached payloads force verifiers to recompute the root from the proof and protect against implementation errors where the signature is verified but the payload is incompatible with the proof.'
      - locator: "§5.2.1"
        source_lines: "483-484"
        text: 'In a signed proof, the payload is the Merkle Tree root that corresponds to the log at size tree-size.'
      - locator: "§5.3.1"
        source_lines: "592-594"
        text: 'In a signed consistency proof, the newer Merkle Tree root (proven to be consistent with an older Merkle Tree root) is a detached payload and corresponds to the log at size tree-size-2.'
    open_question: >
      Where does the verifier of a Receipt of Consistency get the newer root
      it needs for the signature check, and what binds that root to the
      tree-size-2 inside the proof? The document does not say, and it defines
      no exchange in which the root could be fetched — see protocol.yaml.

# ---------------------------------------------------------------------------
# THE MACHINES
# ---------------------------------------------------------------------------
machines:

  # -----------------------------------------------------------------------
  - name: receipt-admission
    locator: "§4.3"
    source_lines: "226-232, 236-258"
    derived: true
    purpose: >
      The gate both verification machines enter from. §4.3 governs a Receipt
      carried in the `receipts` (394) header of an enclosing Enveloped COSE
      Structure; a bare Receipt verified on its own starts at
      `receipt-admitted` directly.
    initial: envelope-received
    states:
      - envelope-received          # a Signature_With_Receipt = #6.18(COSE_Sign1), Figure 1
      - receipts-parameter-read    # unprotected header label 394 present, value [+ bstr .cbor Receipt]
      - receipt-decoded            # one Receipt decoded — Receipt_For_Inclusion / Receipt_For_Consistency
      - tag-checked                # the Receipt itself is tagged COSE_Sign1 (#6.18)
      - registries-checked         # vds (395) and vdp (396) labels resolve in the IANA registries
      - receipt-admitted           # terminal accept; the entry state of both verification machines
    transitions:
      - from: envelope-received
        to: receipts-parameter-read
        trigger: Signature_With_Receipt
        guard: 'unprotected header carries label 394 with an array of one or more bstr .cbor Receipt'
        locator: "§4.3"
      - from: envelope-received
        to: no-receipt-present
        trigger: Signature_With_Receipt
        guard: 'label 394 absent — nothing in this document applies; the envelope is an ordinary COSE_Sign1'
        locator: "§4.3"
      - from: receipts-parameter-read
        to: receipt-decoded
        trigger: Receipt
        guard: 'the bstr decodes as CBOR matching Receipt_For_Inclusion or Receipt_For_Consistency'
        locator: "§4.3 (Figure 1)"
      - from: receipts-parameter-read
        to: malformed-receipt
        trigger: Receipt
        guard: 'the bstr does not decode, or matches neither Receipt alternative'
        locator: "§4.3 (Figure 1)"
      - from: receipt-decoded
        to: tag-checked
        trigger: cbor-tag-inspection
        guard: 'the Receipt is tagged COSE_Sign1 (#6.18)'
        locator: "§4.3"
        constrained_by: [rfc-9942#R-0003]
      - from: receipt-decoded
        to: not-tagged-cose-sign1
        trigger: cbor-tag-inspection
        guard: 'the Receipt is not tagged COSE_Sign1'
        locator: "§4.3"
        constrained_by: [rfc-9942#R-0003]
      - from: tag-checked
        to: registries-checked
        trigger: registry-lookup
        guard: 'vds and the VDP labels present match entries in the registries this document establishes, including later registrations'
        locator: "§4.3"
        constrained_by: [rfc-9942#R-0002]
      - from: tag-checked
        to: vds-or-vdp-unregistered
        trigger: registry-lookup
        guard: 'vds or a VDP label has no matching registry entry'
        locator: "§4.3"
        constrained_by: [rfc-9942#R-0002]
      - from: registries-checked
        to: receipt-admitted
        trigger: vds-dispatch
        guard: 'vds (395) names a VDS whose proof structures the verifier implements; the VDS determines how to read the VDP'
        locator: "§5.2.1 line 553-554, §5.3.1 line 665-666"
        note: >
          'The VDS in the protected header is necessary to understand the
          inclusion proof structure in the unprotected header.' (§5.2.1,
          source lines 553-554; §5.3.1 repeats it for consistency proofs at
          665-666.) This is why the dispatch is on `vds` from the *protected*
          header and not on the proof label alone.
      - from: registries-checked
        to: vds-unsupported
        trigger: vds-dispatch
        guard: 'vds is registered but this verifier implements no reader for its proof structures'
        locator: "§4.2"
        note: >
          'Implementers should not expect interoperability across "Verifiable
          Data Structures".' (§4.2, source lines 216-217.) A registered-but-
          unsupported VDS is an expected outcome here, not a defect.
    error_states:
      - no-receipt-present
      - malformed-receipt
      - not-tagged-cose-sign1
      - vds-or-vdp-unregistered
      - vds-unsupported
    accepting_states: [receipt-admitted]

  # -----------------------------------------------------------------------
  - name: inclusion-receipt-verification
    locator: "§5.2.1"
    source_lines: "556-566"
    derived: true
    order: PROOF-THEN-SIGNATURE
    purpose: >
      Verify a Receipt of Inclusion. Two explicitly numbered steps in the
      source. The output of step 1 is the input to step 2, so the order is
      forced by the data flow and not merely stipulated.
    inputs:
      from_receipt:
        - 'protected: alg (1), vds (395)'                                  # rfc-9942#R-0010, rfc-9942#R-0011
        - 'unprotected: vdp (396) -> inclusion-proof (-1) -> [+ bstr]'     # rfc-9942#R-0012, rfc-9942#R-0013
        - 'each proof bstr decodes to [tree-size: uint, leaf-index: uint, inclusion-path: [+ bstr]]'
        - 'payload: bstr / nil — nil in the Figure 6 example (source line 547)'
        - 'signature: bstr'
      from_verifier:
        - 'the bytes of a candidate entry — NOT carried in the receipt (§5.2.1 step 1)'
        - 'the signer public key for alg — key discovery is out of scope for this document'
    initial: receipt-admitted
    states:
      - receipt-admitted           # from receipt-admission, or a bare Receipt_For_Inclusion
      - proof-decoded              # inclusion-proof-content read — tree-size, leaf-index, inclusion-path
      - bounds-checked             # leaf-index < tree-size
      - root-recomputed            # inclusion path applied to the candidate entry bytes
      - payload-bound              # the recomputed root has BECOME the COSE_Sign1 payload
      - signature-verified         # COSE_Sign1 signature checked over that payload
      - inclusion-confirmed        # terminal accept — "confirms the entry's inclusion in the VDS"
    transitions:
      - from: receipt-admitted
        to: proof-decoded
        trigger: Receipt_For_Inclusion
        guard: 'vdp (396) present and carries inclusion-proof (-1) as an array of one or more bstr, each decoding as inclusion-proof-content'
        locator: "§5.2.1 (Figure 5), §5.2 (Figure 3)"
        constrained_by: [rfc-9942#R-0012, rfc-9942#R-0013]
      - from: receipt-admitted
        to: proof-absent
        trigger: Receipt_For_Inclusion
        guard: 'vdp or inclusion-proof (-1) missing, or a proof bstr does not decode as inclusion-proof-content'
        locator: "§5.2.1 (Figure 5)"
        constrained_by: [rfc-9942#R-0012, rfc-9942#R-0013]

      # --- the RFC 9162 bound, quoted into §5.2 ---
      - from: proof-decoded
        to: leaf-index-out-of-bounds
        trigger: bounds-evaluation
        guard: 'leaf-index >= tree-size'
        locator: "§5.2"
        source_lines: "475-476"
        constrained_by: [rfc-9942#R-0009]
        guard_text: 'If leaf_index is greater than or equal to tree_size, then fail the proof verification.'
        note: >
          Quoted into §5.2 from RFC 9162 as an indented block with a leading
          pipe gutter, so the bound is normative-by-reference here rather
          than stated in RFC 9942's own voice; this is why
          rfc-9942#R-0009 is kind `inferred`. Two naming conventions collide
          around it: the quoted excerpt and the Figure 1 CDDL use
          `leaf_index` / `tree_size`, while the Figure 3 proof content uses
          `leaf-index` / `tree-size`. Same two fields. §5.2 also records that
          'The identifying index of a leaf node is relative to all nodes in
          the tree size for which the proof was obtained.' (source lines
          478-479) and that RFC 9162 'defines inclusion proofs only for leaf
          nodes' (source lines 472-473) — so a non-leaf index is out of scope,
          not merely out of bounds.
      - from: proof-decoded
        to: bounds-checked
        trigger: bounds-evaluation
        guard: 'leaf-index < tree-size'
        locator: "§5.2"
        constrained_by: [rfc-9942#R-0009]

      # --- STEP 1: the proof ---
      - from: bounds-checked
        to: candidate-entry-unavailable
        trigger: apply-inclusion-proof
        guard: 'the verifier holds no candidate entry bytes to apply the proof to'
        locator: "§5.2.1 step 1"
        note: >
          Not an error the document names. It is a precondition the document
          assumes: step 1 applies the proof "to the bytes of a candidate
          entry", and no field of the receipt carries that entry.
      - from: bounds-checked
        to: root-recomputed
        trigger: apply-inclusion-proof
        guard: 'candidate entry bytes available; inclusion-path applied from the leaf upward per RFC 9162 §2.1.3.2'
        locator: "§5.2.1 step 1"
        constrained_by: [rfc-9942#R-0014]
      - from: root-recomputed
        to: proof-invalid
        trigger: proof-application-result
        guard: 'application of the inclusion proof fails — "If this fails, the proof is invalid."'
        locator: "§5.2.1 step 1"
        constrained_by: [rfc-9942#R-0014]
      - from: root-recomputed
        to: payload-bound
        trigger: proof-application-result
        guard: 'application succeeds — "If it succeeds, the resulting Merkle Tree root becomes the COSE_Sign1 payload."'
        locator: "§5.2.1 step 1"
        constrained_by: [rfc-9942#R-0014, rfc-9942#R-0004]
        note: >
          This transition is the hinge of the whole machine. The recomputed
          root is not *compared* with a payload the receipt supplied; it
          *becomes* the payload. With the Figure 6 detached payload (`/
          payload / null`, source line 547) there is no other candidate for
          it. §5.2.1 line 523-524 fixes what that payload is: 'The payload of
          an RFC9162_SHA256 inclusion proof signature is the Merkle Tree Hash
          as defined in [RFC9162].'

      # --- STEP 2: the signature ---
      - from: payload-bound
        to: signature-verified
        trigger: cose-sign1-signature-verification
        guard: 'the COSE_Sign1 signature verifies over the Sig_structure built with the recomputed root as payload, under alg from the protected header'
        locator: "§5.2.1 step 2"
        constrained_by: [rfc-9942#R-0010, rfc-9942#R-0014]
      - from: payload-bound
        to: signature-invalid
        trigger: cose-sign1-signature-verification
        guard: 'the signature does not verify — "otherwise, the signature is invalid."'
        locator: "§5.2.1 step 2"
        constrained_by: [rfc-9942#R-0014]
      - from: signature-verified
        to: inclusion-confirmed
        trigger: result-report
        guard: 'both steps succeeded — "Successful verification confirms the entry''s inclusion in the VDS"'
        locator: "§5.2.1 step 2"
        constrained_by: [rfc-9942#R-0020]
        note: >
          rfc-9942#R-0020 is written for consistency receipts, but the same
          single-boolean discipline collapses every error state of this
          machine to one false for the caller.
    error_states:
      - proof-absent
      - leaf-index-out-of-bounds
      - candidate-entry-unavailable
      - proof-invalid
      - signature-invalid
    accepting_states: [inclusion-confirmed]
    absent_transitions:
      - from: receipt-admitted
        to: signature-verified
        why_absent: >
          There is no path into signature verification that does not pass
          through payload-bound. This absence IS the §5.2.1 ordering. Any
          implementation that has such a path has supplied the payload from
          outside the proof and has inverted step 1 and step 2.
      - from: payload-bound
        to: inclusion-confirmed
        why_absent: >
          A recomputed root is not a verified receipt. The signature step is
          not optional: without it the verifier has shown only that the
          candidate entry hashes to *some* root, with nothing attesting that
          the root is the log's.

  # -----------------------------------------------------------------------
  - name: consistency-receipt-verification
    locator: "§5.3.1"
    source_lines: "668-679"
    derived: true
    order: SIGNATURE-THEN-PROOF
    order_warning: >
      OPPOSITE to inclusion-receipt-verification. See
      verification_order_inversion above. Do not share a verify routine
      between the two machines without re-reading both orders.
    purpose: >
      Verify a Receipt of Consistency. The source gives no numbered steps —
      only "First ... Second ..." inside one paragraph — and it short-circuits
      the proof check on signature failure.
    inputs:
      from_receipt:
        - 'protected: alg (1), vds (395)'                                      # rfc-9942#R-0015, rfc-9942#R-0016
        - 'unprotected: vdp (396) -> consistency-proof (-2) -> [+ bstr]'       # rfc-9942#R-0017, rfc-9942#R-0018
        - 'each proof bstr decodes to [tree-size-1: uint, tree-size-2: uint, consistency-path: [+ bstr]]'
        - 'payload: nil — declared a detached payload (§5.3.1 line 593)'
        - 'signature: bstr'
      from_verifier:
        - 'the newer Merkle Tree root for tree-size-2 — detached, so NOT carried in the receipt, yet needed BEFORE the signature check'
        - 'a previous inclusion proof, applied to the consistency proof in the second step — NOT carried in the receipt'
        - 'the signer public key for alg'
    initial: receipt-admitted
    states:
      - receipt-admitted           # from receipt-admission, or a bare Receipt_For_Consistency
      - proof-decoded              # consistency-proof-content read — tree-size-1, tree-size-2, consistency-path
      - payload-supplied           # the verifier has bound the newer root as the detached payload
      - signature-verified         # "First, the verifier checks the signature on the COSE_Sign1."
      - consistency-checked        # the previous inclusion proof has been applied to the consistency proof
      - append-only-assured        # terminal accept
    transitions:
      - from: receipt-admitted
        to: proof-decoded
        trigger: Receipt_For_Consistency
        guard: 'vdp (396) present and carries consistency-proof (-2) as an array of one or more bstr, each decoding as consistency-proof-content'
        locator: "§5.3.1 (uncaptioned CDDL block, source lines 616-625), §5.3 (Figure 7)"
        constrained_by: [rfc-9942#R-0017, rfc-9942#R-0018]
      - from: receipt-admitted
        to: proof-absent
        trigger: Receipt_For_Consistency
        guard: 'vdp or consistency-proof (-2) missing, or a proof bstr does not decode as consistency-proof-content'
        locator: "§5.3.1"
        constrained_by: [rfc-9942#R-0017, rfc-9942#R-0018]
      - from: proof-decoded
        to: payload-supplied
        trigger: detached-payload-supply
        guard: 'the verifier holds the newer Merkle Tree root corresponding to the log at size tree-size-2'
        locator: "§5.3.1"
        source_lines: "592-594, 632-633"
        constrained_by: [rfc-9942#R-0004]
        note: >
          A derived state with no counterpart in the prose. It has to exist:
          §5.3.1 says the newer root "is a detached payload" (lines 592-594)
          and then has the signature checked first, and a signature cannot be
          checked over a payload the verifier does not have. §5.3.1 lines
          632-633 fix what it must be: 'The payload of an RFC9162_SHA256
          consistency proof signature is: The newer Merkle Tree Hash as
          defined in [RFC9162].' Nothing in the document says where the
          verifier gets it or what binds it to tree-size-2.
      - from: proof-decoded
        to: detached-payload-unavailable
        trigger: detached-payload-supply
        guard: 'the verifier has no newer root to bind as the payload'
        locator: "§5.3.1"
        note: >
          Not an error the document names, and the one the detachment_tension
          finding turns on.

      # --- FIRST: the signature ---
      - from: payload-supplied
        to: signature-verified
        trigger: cose-sign1-signature-verification
        guard: 'the COSE_Sign1 signature verifies over the supplied newer root, under alg from the protected header'
        locator: "§5.3.1"
        constrained_by: [rfc-9942#R-0015, rfc-9942#R-0019]
      - from: payload-supplied
        to: signature-invalid
        trigger: cose-sign1-signature-verification
        guard: 'the signature does not verify — "If the verification fails, the consistency proof is not checked."'
        locator: "§5.3.1"
        constrained_by: [rfc-9942#R-0019]
        note: >
          A hard short-circuit, and the only place in this document where one
          check's failure is said to suppress another. It is the opposite
          short-circuit to §5.2.1, where proof failure suppresses the
          signature check.

      # --- SECOND: the proof ---
      - from: signature-verified
        to: previous-inclusion-proof-unavailable
        trigger: apply-previous-inclusion-proof
        guard: 'the verifier holds no previous inclusion proof to apply'
        locator: "§5.3.1"
        note: >
          Another unnamed precondition: the second step is "applying a
          previous inclusion proof to the consistency proof", and no field of
          the receipt carries that previous proof. Where it comes from is not
          specified here.
      - from: signature-verified
        to: consistency-checked
        trigger: apply-previous-inclusion-proof
        guard: 'a previous inclusion proof is available and is applied to the consistency proof'
        locator: "§5.3.1"
        constrained_by: [rfc-9942#R-0019]
      - from: consistency-checked
        to: append-only-assured
        trigger: result-report
        guard: 'the consistency check succeeds'
        locator: "§5.3.1"
        constrained_by: [rfc-9942#R-0020]
      - from: consistency-checked
        to: append-only-not-assured
        trigger: result-report
        guard: 'the consistency check fails — "If the verification fails, the append-only property of the VDS is not assured."'
        locator: "§5.3.1"
        constrained_by: [rfc-9942#R-0019]
    error_states:
      - proof-absent
      - detached-payload-unavailable
      - signature-invalid
      - previous-inclusion-proof-unavailable
      - append-only-not-assured
    accepting_states: [append-only-assured]
    result_reporting:
      requirement: rfc-9942#R-0020
      locator: "§5.3.1"
      rule: >
        Every error state above, and append-only-assured, collapse to one
        boolean at the caller. signature-verified must NOT be observable as
        an outcome distinct from append-only-assured, because the pair
        (signature valid, proof invalid) is exactly the result the
        recommendation names.
      text: 'It is recommended that implementations return a single boolean result for Receipt-verification operations to reduce the chance of accepting a valid signature over an invalid consistency proof.'
    absent_transitions:
      - from: receipt-admitted
        to: consistency-checked
        why_absent: >
          There is no path to the proof check that bypasses the signature
          check. This absence IS the §5.3.1 ordering, and it is the mirror
          image of the absence recorded in inclusion-receipt-verification.
      - from: signature-invalid
        to: consistency-checked
        why_absent: >
          Stated outright: "If the verification fails, the consistency proof
          is not checked." A verifier that reports both results has run the
          proof check it was told to skip.
    vds_scope_caveat:
      locator: "§5.3.1"
      source_lines: "674-676"
      text: 'This approach is specific to RFC9162_SHA256; different VDSs may not support consistency proofs.'
      reading: >
        This machine is not the general shape of consistency verification. It
        is RFC9162_SHA256's. §4.2 ('Implementers should not expect
        interoperability across "Verifiable Data Structures".', source lines
        216-217) and §4.4.1 (each VDS specification MUST define how to encode
        and how to produce and consume its Proof Types — rfc-9942#R-0006,
        rfc-9942#R-0007) together mean a future VDS may define a different
        order again, and must say so itself.

# ---------------------------------------------------------------------------
cross_check:
  requirements_cited:
    - rfc-9942#R-0002   # §4.3 registry confirmation — receipt-admission
    - rfc-9942#R-0003   # §4.3 tagged COSE_Sign1 — receipt-admission
    - rfc-9942#R-0004   # §4.4 detached payload — the payload-bound / payload-supplied states
    - rfc-9942#R-0006   # §4.4.1 per-VDS CBOR encodings — vds_scope_caveat
    - rfc-9942#R-0007   # §4.4.1 per-VDS produce/consume — vds_scope_caveat
    - rfc-9942#R-0009   # §5.2 leaf_index >= tree_size — the bounds guard
    - rfc-9942#R-0010   # §5.2.1 alg — signature step input
    - rfc-9942#R-0011   # §5.2.1 vds — dispatch input
    - rfc-9942#R-0012   # §5.2.1 vdp — proof-decoded guard
    - rfc-9942#R-0013   # §5.2.1 inclusion-proof (-1) — proof-decoded guard
    - rfc-9942#R-0014   # §5.2.1 two sequential steps — the inclusion order
    - rfc-9942#R-0015   # §5.3.1 alg — signature step input
    - rfc-9942#R-0016   # §5.3.1 vds — dispatch input
    - rfc-9942#R-0017   # §5.3.1 vdp — proof-decoded guard
    - rfc-9942#R-0018   # §5.3.1 consistency-proof (-2) — proof-decoded guard
    - rfc-9942#R-0019   # §5.3.1 verified in order — the consistency order
    - rfc-9942#R-0020   # §5.3.1 single boolean — result_reporting
  schema_backing:
    - 'distilled/schema/figure-01-cose-sign1-with-receipts.cddl — Signature_With_Receipt, Receipt, Receipt_For_Inclusion, Receipt_For_Consistency (the admission-machine triggers)'
    - 'distilled/schema/figure-03-inclusion-proof-content.cddl — tree-size, leaf-index, inclusion-path (the bounds guard and step 1)'
    - 'distilled/schema/figure-04-inclusion-protected-header.cddl — alg, vds'
    - 'distilled/schema/figure-05-inclusion-unprotected-header.cddl — vdp, inclusion-proof (-1)'
    - 'distilled/schema/figure-07-consistency-proof-content.cddl — tree-size-1, tree-size-2, consistency-path'
    - 'distilled/schema/figure-08-consistency-protected-header.cddl — alg, vds'
    - 'distilled/schema/uncaptioned-consistency-unprotected-header.cddl — vdp, consistency-proof (-2)'
  states_with_no_source_counterpart:
    - 'payload-supplied (consistency) — required by the order, absent from the prose'
    - 'candidate-entry-unavailable (inclusion) — a precondition, not a named failure'
    - 'detached-payload-unavailable (consistency) — likewise'
    - 'previous-inclusion-proof-unavailable (consistency) — likewise'
    - 'the whole of receipt-admission — assembled from §4.3 prose and Figure 1, which the document never frames as a procedure'
  trigger_to_message:
    note: >
      FX-1 pass 3 asks that every transition trigger name a defined message.
      Fourteen distinct triggers appear across the three machines. Four name
      a structure messages.yaml defines, by the CDDL rule names of Figure 1;
      the remaining ten are local operations, which is itself the protocol
      finding. "Message" here means a structure defined in messages.yaml, not
      a thing one party sends another — no trigger in this file is the
      latter, and no_protocol_exchange below says so. The two Receipt aliases
      are recorded in messages.yaml under the structures they expand to —
      Receipt_For_Inclusion = #6.18(Signed_Inclusion_Proof) and
      Receipt_For_Consistency = #6.18(Signed_Consistency_Proof).
    message_triggers:
      - trigger: Signature_With_Receipt
        messages_entry: 'Signature_With_Receipt'
      - trigger: Receipt
        messages_entry: 'Receipt'
      - trigger: Receipt_For_Inclusion
        messages_entry: 'Signed_Inclusion_Proof (via the Receipt_For_Inclusion alias)'
      - trigger: Receipt_For_Consistency
        messages_entry: 'Signed_Consistency_Proof (via the Receipt_For_Consistency alias)'
    local_operation_triggers:
      - cbor-tag-inspection
      - registry-lookup
      - vds-dispatch
      - bounds-evaluation
      - apply-inclusion-proof
      - proof-application-result
      - cose-sign1-signature-verification
      - detached-payload-supply
      - apply-previous-inclusion-proof
      - result-report

  no_protocol_exchange: >
    Every trigger above is local: a decode, a bounds test, a hash
    recomputation, a signature check. None is a message one party sends
    another. That is the finding recorded in protocol.yaml.
