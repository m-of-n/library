note: >
  Ids are stable and never reused. Cite as rfc-9942#R-NNNN.
  Every text value is a single contiguous verbatim span of RFC 9942 — no
  span was spliced from two non-adjacent parts of the document. Contiguity
  is asserted under the line-join and gutter conventions set out below, both
  of which concern only leading line decoration and inter-line whitespace;
  no interior word, clause or punctuation mark of any span was altered,
  dropped or reordered.
  Two line-join conventions are applied. A wrap between two separate words
  joins with exactly one space, which means an RFC sentence break that
  happens to fall on a wrap boundary carries one space rather than the two
  it would carry mid-line. R-0012 is the only requirement in this file where
  that arises: "Proofs." meets "Value" across the wrap at source lines
  517/518, so it carries one space there. R-0017 reads similarly but is NOT
  an instance — its whole entry sits on source line 627 alone, so it carries
  the source's two spaces between "VDPs." and "Value" verbatim. A wrap at an
  end-of-line hyphen inside one word joins with no space at all; that case
  does not arise here, because the only end-of-line hyphen in the whole
  document sits in the Abstract ("end-to-end"), at line 23, which no
  requirement quotes. Double spaces after sentence-ending periods are
  preserved verbatim wherever they fall mid-line.
  R-0009 quotes the §5.2 excerpt of RFC 9162, which the RFC renders as an
  indented block quote with a leading pipe gutter on every line (source
  lines 475-476). The gutter is stripped as leading line decoration, exactly
  as the RFC's three-column body margin is stripped from every line of every
  other quote; the pipe is a rendering glyph, not content, and not
  whitespace, so it does not "collapse" as a wrap space does — it is
  removed. Stated plainly: no gutter-free span of the rendered text contains
  this sentence whole, and the quote is contiguous in the quoted content, not
  in the rendered column. The sentence is reproduced entire rather than
  trimmed at the wrap, because the trimmed span ("...then fail the") is not a
  statement. R-0009 is the only quote in this file that needs this rule;
  that is mechanically checked, not assumed — stripping the gutter changes
  the match outcome for R-0009 and for no other requirement.
  Eight of the sixteen BCP 14 keywords in this document — half of them —
  are the word REQUIRED used as a field designator in the receipt field
  tables of §5.2.1 and §5.3.1, four in each. They mark a header map field
  as mandatory rather than stating a sentence-level obligation on an
  actor. Each one is carried here as its own requirement, quoted as the
  whole field-table entry it heads, because each is a real constraint on a
  real field of a real header map. That yields exactly eight keywords, so
  the total matches the source count of sixteen without double counting
  and without dropping the designators. R-0010 through R-0013 are the
  §5.2.1 four and R-0015 through R-0018 are the §5.3.1 four. R-0010 and
  R-0015, and R-0011 and R-0016, carry byte-identical text; this is not a
  duplication defect but the RFC itself, which repeats the alg and vds
  entries verbatim in both receipt profiles, and the two locators are
  distinct.
  The eight sentence-level keyword statements are R-0001 through R-0004,
  R-0006, R-0007, R-0021 and R-0024 — six MUST, one SHOULD, one MAY. The
  §1.1 BCP 14 boilerplate is never quoted, matching the source count.
  Requirements marked inferred carry no uppercase BCP 14 keyword and so
  cannot perturb either count. Their verbs are written in lower case
  precisely to mark them as not BCP 14. Several rest on a lower-case
  keyword in the source — must in R-0008, should in R-0022 and R-0025,
  recommended in R-0020 and R-0023 — and the rest on a constraint the
  document states as fact or as a prohibition without any keyword at all.
  Ids run sequentially in source order by line number.
  Promotion threshold for keyword-free text. This record applies the same
  threshold as its sibling records/ietf/rfc-9943/distilled/requirements.yaml,
  so that one rule governs both: a sentence carrying no BCP 14 keyword is
  promoted to kind inferred when all three of these hold — it is quoted
  contiguously and verbatim; it names, or unambiguously fixes, the actor
  bound by it; and it states an obligation, a prohibition or an ordering
  that a conforming implementation could violate. "Conforming
  implementation" is read as any artifact this document binds: an
  implementation or verifier, a receipt producer, or a VDS specification or
  profile author, the last of which §4.4.1 already places under two
  uppercase MUSTs (R-0006, R-0007). Detectability is a separate axis,
  recorded in testable; a requirement may stand on this threshold and still
  be testable no, exactly as R-0021, R-0022 and R-0025 are.
  What the threshold admits here: R-0005 ("are encouraged to make their
  presence mandatory" — a profile that defines extra protected parameters
  and leaves them optional has violated it), R-0008, R-0009, R-0014,
  R-0019, R-0020, R-0022, R-0023, R-0025, R-0026 and R-0027.
  What it declines, settled in pass 3. §8.2.1 lists five expert-review
  bullets. Two are here — R-0026 (line 799, "Specifications are required for
  all point assignments") and R-0027 (line 802, "It is not permissible to
  assign points..."). The other three are declined: line 791 "Experts are
  advised to assign the next available positive integer for VDSs", line 794
  "Point squatting should be discouraged...", and line 807 "The change
  controller for related registrations of structures and proofs should be
  the same." They are declined on the third limb of the threshold, NOT on
  the earlier and wrong ground that they carry no BCP 14 keyword — that
  ground is true of R-0005, R-0022 and R-0025 as well, which stand. The
  real difference: R-0026 and R-0027 state absolute conditions on what may
  exist in the two registries, violable by a VDS specification author and
  detectable by inspecting the registries, whereas the three declined
  bullets are hortatory advice addressed to the IANA expert reviewer's
  judgement — an actor this document binds nowhere else — and their
  violation is exhibited by no artifact: a point assigned out of sequence is
  still a valid assignment, a squatted point is indistinguishable from a
  used one, and two differing change controllers leave both registrations
  valid and every label still resolving. Line 794's first sentence also
  fails the second limb (it names no actor), as does line 807. All five
  bullets are lowercase, so neither resolution of this question could move
  source_keyword_count or extracted_keyword_count: both stay 16, and the
  entry count stays 27. The parallel note in messages.yaml under
  iana_subregistries.expert_review.promotion_outcome records the same
  outcome at the point of use.

requirements:
  - id: rfc-9942#R-0001
    object: migration to a new Verifiable Data Structure
    field: security and privacy assumptions
    verb: MUST
    actor: implementation
    locator: "§4.2"
    text: 'Security analysis MUST be conducted prior to migrating to new structures to ensure the new security and privacy assumptions are acceptable for the use case.'
    kind: stated
    testable: partial    # a human security analysis is an out-of-band process artifact; only its existence can be evidenced, not its adequacy
    status: active

  - id: rfc-9942#R-0002
    object: COSE_Sign1 carrying the receipts header parameter
    field: vds and vdp registry membership
    verb: MUST
    actor: verifier
    locator: "§4.3"
    text: 'When the "receipts" header parameter is present, the verifier MUST confirm that the associated VDS and VDPs match entries present in the registries established in this specification, including values added in subsequent registrations.'
    kind: stated
    testable: yes
    status: active

  - id: rfc-9942#R-0003
    object: Receipt
    field: CBOR tag
    verb: MUST
    actor: receipt producer
    locator: "§4.3"
    text: 'Receipts MUST be tagged as COSE_Sign1.'
    kind: stated
    testable: yes
    status: active

