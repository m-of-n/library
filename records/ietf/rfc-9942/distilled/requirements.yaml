    field: cryptographic strength
    verb: should
    actor: implementation
    locator: "§7.1"
    text: 'A security analysis ought to be performed to ensure that the digital signature algorithm alg has the appropriate strength to secure receipts.'
    kind: inferred
    testable: no    # requires human cryptographic judgement about strength adequacy for a deployment
    status: active

  - id: rfc-9942#R-0023
