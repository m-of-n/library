  corroborating_checks:
    - check: 'normative and informative reference lists (§9, lines 896-977)'
      finding: >
        Fourteen references, every one a data-format, cryptography or IANA-
        process document: IANA.cose_header-parameters, RFC 2119, RFC 8174,
        RFC 8610 (CDDL), RFC 8949 (CBOR), RFC 9053 (COSE algorithms),
        RFC 9162 (Certificate Transparency 2.0), RFC 9596, RFC 9597, STD 96,
        CBOR-EDN, RFC 7120, RFC 8126, RFC 8392. Not one transport, API or
        messaging specification among them.
    - check: 'references to the SCITT architecture'
      finding: >
        Zero. The strings "SCITT", "9943" and "SCRAPI" do not occur anywhere
        in RFC 9942. The document that would supply the exchange is not even
        cited by the document that defines the receipt.
    - check: 'actor nouns'
      finding: >
        The document does name actors — "verifier" (6 occurrences),
        "receipt producer" (1, §6.2), "implementers" (2), "transparency
        service" (2) — but never in a sending relation. The verifier only
        verifies; the receipt producer only produces and is told to perform a
        privacy analysis (rfc-9942#R-0021). No sentence in the document has
        one of them as subject and another as indirect object.
    - check: '"convey", 6 occurrences (lines 110, 132, 136, 166, 175, 224)'
      finding: >
        Every one is about conveying data *inside a header or a structure*,
        never about conveying it to a party. This is the vocabulary of
        containment, not of transmission.

# ---------------------------------------------------------------------------
# WHY THERE IS NO SINGLE PROTOCOL HERE — the document's own reasons
# ---------------------------------------------------------------------------
why_no_protocol:
  - locator: "§1"
    source_lines: "109-111"
    text: 'This document describes how to convey VDS and associated VDP types in unified Enveloped COSE Structures.'
    reading: >
      The document's own statement of what it does. Conveying types in
      structures — a format problem — not conveying anything to anyone.
  - locator: "§3"
    source_lines: "165-167"
    text: 'Receipt:  A COSE Single Signer Data Object, as defined in RFC 9052 of [STD96], containing the header parameters necessary to convey one or more VDP for an associated VDS.'
    reading: >
      A Receipt is defined as an object, by its contents. Not as a response,
      not as something issued in reply to anything.
  - locator: "§4.2"
    source_lines: "216-217"
    text: 'Implementers should not expect interoperability across "Verifiable Data Structures".'
    reading: >
      A protocol's purpose is interoperation. This document disclaims
      interoperation across the very axis it is extensible along, which is
      why no single exchange could be specified here even in principle: what
      a party would have to send depends on a VDS this document does not fix.
  - locator: "§4.4.1"
    source_lines: "421-424"
    text: 'Each VDS specification applying for inclusion in this registry MUST define how to encode the VDS identifier and its Proof Types in CBOR. Each specification MUST define how to produce and consume the supported Proof Types.'
    constrained_by: [rfc-9942#R-0006, rfc-9942#R-0007]
    reading: >
      The encodings are deferred, per VDS, to future specifications. RFC 9942
      is an extension point with one worked example (RFC9162_SHA256), and an
      extension point cannot carry a fixed wire exchange. Line-join note: the
      wrap between "CBOR." and "Each" falls on a sentence boundary, so this
      span carries one space there rather than the source's usual two — the
      same convention requirements.yaml records.
  - locator: "§5.3.1"
    source_lines: "674-676"
    text: 'This approach is specific to RFC9162_SHA256; different VDSs may not support consistency proofs.'
    reading: >
      Even the verification procedure is scoped to one VDS. A future VDS may
      not have a consistency notion at all, so there is no procedure here that
      a general protocol could wrap.

# ---------------------------------------------------------------------------
# WHERE THE EXCHANGE LIVES INSTEAD
# ---------------------------------------------------------------------------
exchange_specified_elsewhere:
  - record: rfc-9943
    title: "An Architecture for Trustworthy and Transparent Digital Supply Chains"
    what: >
      The SCITT architecture: the Registration flow in which an Issuer submits
      a Signed Statement to a Transparency Service and receives a Receipt, and
      the roles — Issuer, Transparency Service, Relying Party, Auditor — that
      RFC 9942 never names. The question "who gives the verifier the candidate
      entry, the previous inclusion proof and the detached newer root?" is
      answerable there and unanswerable here.
    relation: see_also    # already recorded in records/ietf/rfc-9942/record.yaml
  - record: draft-ietf-scitt-scrapi
    title: "SCITT Reference APIs (SCRAPI)"
    what: >
      The HTTP binding — endpoints, methods, status codes, the concrete
      request and response shapes by which a Receipt is actually asked for and
      returned. This is the artifact that would fill `flows` above, and it is
      a separate, unfinished document that RFC 9942 does not cite.
    relation: not-yet-recorded-on-this-record
    caution: >
      A draft, not a standard. Nothing in RFC 9942 depends on it, and nothing
      in it is normative for a RFC 9942 implementation.

# ---------------------------------------------------------------------------
consequences_for_us:
  - >
    An implementation of RFC 9942 alone is a library, not a participant. It
    can produce and check bytes; it cannot obtain them.
  - >
    Each of the three verifier-supplied inputs the state machines record — the
    candidate entry bytes (§5.2.1), the previous inclusion proof (§5.3.1) and
    the detached newer Merkle Tree root (§5.3.1) — is a hole this document
    leaves for a protocol to fill. If we define our own carriage rather than
    adopting SCRAPI, those three are exactly what it has to supply, and the
    binding between the supplied root and the proof's tree-size-2 is ours to
    specify, because RFC 9942 does not.
  - >
    Reviewing this record's artifact set: messages.yaml carries real content
    (the structures), state-machine.yaml carries real content (the
    procedures), and protocol is empty. That split is the honest shape of the
    document and should not be papered over by inventing a flow.
