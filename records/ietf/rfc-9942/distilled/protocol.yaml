# ---------------------------------------------------------------------------
# VERDICT
# ---------------------------------------------------------------------------
applicable: false
verdict: not-applicable

not_applicable_reason: >
  RFC 9942 specifies a data format and the local verification procedures over
  it — a Receipt carried in a COSE_Sign1 header — and defines no exchange
  between roles anywhere in its 1033 lines: no request, no response, no
  endpoint, no transport binding and no message any party sends another, so
  the exchange that would carry a Receipt is left to RFC 9943's registration
  model and to SCRAPI, neither of which this document defines.

# This is the shape the scaffold asks for, kept so that a consumer expecting
# `roles` and `flows` still parses the file. Both are empty on purpose, and
# the emptiness is the finding — see `evidence` below.
roles: []
flows: []

# ---------------------------------------------------------------------------
# WHAT THE DOCUMENT DEFINES INSTEAD
# ---------------------------------------------------------------------------
defines_instead:
  - kind: data format
    what: >
      Three COSE header parameters — receipts (394), vds (395), vdp (396) —
      and the CDDL for a COSE_Sign1 carrying Receipts, plus the CBOR encodings
      of RFC9162_SHA256 inclusion and consistency proofs.
    locator: "§2, §4.3, §5.2, §5.3"
    artifacts: ["distilled/schema/", "distilled/messages.yaml"]
  - kind: local verification procedures
    what: >
      Two verification procedures a verifier runs on its own, over bytes it
      already holds: §5.2.1 (proof then signature) and §5.3.1 (signature then
      proof). Both are modelled in distilled/state-machine.yaml. Every trigger
      in those machines is a decode, a bounds test, a hash recomputation or a
      signature check — none is a message.
    locator: "§5.2.1, §5.3.1"
    artifacts: ["distilled/state-machine.yaml"]
  - kind: envelope carriage, not transport
    what: >
      The document's entire account of how a Receipt travels is that it sits
      in a header of an enclosing COSE envelope. What carries the envelope is
      never named.
    locator: "§4.3"
    source_lines: "223-225"
    text: 'This document registers a new COSE header parameter "receipts" (394) to enable Receipts to be conveyed in the protected and unprotected headers of Enveloped COSE Structures.'
  - kind: IANA registry procedure
    what: >
      Expert review criteria and registration templates for the VDS algorithm
      and VDS proof subregistries (§8.2.1, §8.2.2). This is process between
      humans and IANA, not a wire exchange; it is the only place in the
      document where anything is "requested" of anybody.
    locator: "§8.2"

