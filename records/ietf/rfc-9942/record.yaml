  not_applicable:
    - kind: protocol
      reason: "RFC 9942 specifies a data format and the local verification procedures over it - a Receipt carried in a COSE_Sign1 header - and defines no exchange between roles anywhere in its 1033 lines: no request, no response, no endpoint, no transport binding and no message any party sends another. The word 'protocol' does not occur once; 25 protocol terms were searched and every nonzero count is a false positive inside a longer word; all 14 references in section 9 are format, crypto or IANA-process documents; and no sentence has one actor as subject and another as object. The exchange that would carry a Receipt is left to rfc-9943's registration model and to draft-ietf-scitt-scrapi, neither of which this document defines or cites."
    - kind: examples
      reason: "The source contains no reproducible example. All 21 hex byte strings are elided in the truncated form h'bc297b51...e4edf0de' - zero non-elided literals and zero complete 32-hex runs - with no base64 and no key material. The three EDN figures (2, 6 and 9) are structurally informative and Figure 2 is marked informative by the source itself, but not one Merkle root, inclusion proof, consistency proof or signature in this RFC can be recomputed. Fixtures would have to come from rfc-9162, whose bytes this library has never fetched, or from the SCITT WG vector lead already recorded in this record."
