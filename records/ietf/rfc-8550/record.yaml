implementations:
  open_source:
    - name: Mozilla Thunderbird (via NSS)
      url: https://www.thunderbird.net/
      license: MPL-2.0
      note: "End-user S/MIME client; certificate validation and trust anchors come from NSS and its root store. Not checked here for the section 3 From/Sender match behaviour."
    - name: OpenSSL (openssl cms, openssl smime)
      url: https://docs.openssl.org/master/man1/openssl-cms/
      license: Apache-2.0
      language: c
      note: "CMS plus RFC 5280 path validation against a caller-supplied CAfile/CApath, so the trust anchor is whatever the caller passes. A library and CLI, not a mail agent: the section 3 header match is the caller's job."
    - name: Bouncy Castle (bcmail, bcpkix)
      url: https://www.bouncycastle.org/
      license: MIT-style
      language: java
      note: "CMS/S-MIME and PKIX path building; same caveat as OpenSSL on the header match."
  commercial:
    - name: Microsoft Outlook / Exchange
      url: https://learn.microsoft.com/en-us/exchange/policy-and-compliance/smime
      note: "Trust anchors from the Windows or Exchange certificate store, i.e. administrator policy."
    - name: Apple Mail
      url: https://support.apple.com/guide/mail/welcome/mac
      note: "Trust anchors from the system keychain and Apple's root program."
  searched: "2026-10-26"
usefulness:
  verdict: useful
  reason: "It is where S/MIME's trust and identity rules actually live, and the finding for #14 is precise: it adds no delegation mechanism of its own, leaves the trust anchor to the agent, and its one distinctive identity rule is the section 3 From/Sender match against an address the CA put in subjectAltName."
  assessed: "2026-10-26"
