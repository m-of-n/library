    - pass: verify
      by: "claude-opus-5 (pass 2 of library#39 Tier 2, COSE X.509 / hash lane; adversarial, did not extract; rfc-9054 and rfc-9360 verified against each other)"
      effort: max
      date: "2026-10-21"
      note: >-
        KEYWORDS RECOUNTED AND LOCATED. bin/bcp14-count gives 14 and by keyword
