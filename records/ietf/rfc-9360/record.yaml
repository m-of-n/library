usefulness:
  verdict: marginal
  reason: "X.509 carriage is the identifier model m-of-n is arguing against, and DEC-003 must say why. Kept for three things it supplies: §5's identity-misbinding attack, which is the RFC's own argument for ARCH-0002 P1; §2's in-band protected `hashAlg`, which R-O-05 should copy; and the DEC-002 finding that option 5's exclusions stop at the CBOR layer while DER sits below it."
  assessed: "2026-10-20"
