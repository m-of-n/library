relations:
  # Added 2026-10-20 by the summary pass. Both `contradicts` edges are
  # curatorial judgements with their reasons in summary.md, as
  # docs/references.md requires — an unexplained contradiction is an
  # unresolved one.
  contradicts:
    # RFC 9054 §4.1 defines "Filter Only" as "not to be used for purposes that
    # require collision resistance" and registers SHA-1 (-14) and SHA-256/64
    # (-15) under it. RFC 9360 §5 asserts "The security of the algorithm used
    # for 'x5t' does not affect the security of the system", while §2 makes a
    # PROTECTED `x5t` the sanctioned integrity binding for an `x5chain` in the
    # UNPROTECTED bucket that "allows an intermediary to remove or add
    # certificates". That position needs second-preimage resistance at
    # minimum, and collision resistance where the attacker can influence
    # issuance — the identity-misbinding attack §5's own next paragraph
    # describes. `COSE_CertHash` excludes no registry value and the only
    # constraint is "MUST support SHA-256" for interop. The two cannot both
    # stand. ROOT: internal to this document (§2 vs §5); RFC 9054 §3.2 only
    # inherits it, citing this document's draft as the justification.
    - rfc-9054
    # RFC 9679 §5.4 writes: "the "x5t" (X.509 certificate SHA-1 thumbprint)
    # [RFC9360] value". "SHA-1" occurs ZERO times in RFC 9360; `x5t` here is
    # `[hashAlg, hashValue]` with SHA-256 mandatory to support. The
    # parenthetical is RFC 7515 §4.1.7's JOSE registry name, where `x5t` IS a
    # SHA-1 digest — imported wholesale and attached to the COSE citation.
    # rfc-9679 is at profile: full and its FX-1 pass captured the sentence in
    # normative.md without flagging it; reported there, not edited from here.
    - rfc-9679
  # A citation gap, not a similarity: §4.3 registers `application/cose-x509`
  # whose content is "a CBOR sequence of single-entry COSE_X509 structures"
  # and cites RFC 8742 ZERO times, though RFC 8742 defines CBOR sequences and
  # `application/cbor-seq`.
  see_also:
    - rfc-8742
  part_of:
    - ietf-cose-wg
bears_on:
  # Widened 2026-10-20 by the summary pass; each addition is argued in
  # summary.md.
  #   DEC-002 — the sharpest cut in this lane, and it cuts by EVASION:
  #     `COSE_X509` is `bstr` holding DER (§2), and a reduced-CBOR profile
  #     does not reach inside a byte string. Eight IANA allocations, zero
  #     CBOR tags, so option 5's literal "no IANA tags" clause survives
  #     untouched while the profile acquires ASN.1 — a second encoding,
  #     parser, canonical form and trust system.
  #   R-O-01 — `kid` occurs ZERO times in the document. Four ways to identify
  #     a key, none related to COSE's own key identifier, so a cert-bearing
  #     COSE object may satisfy no KeyId without a rule we write.
  #   R-O-05 — ADOPT: `x5t` carries `hashAlg` in-band and (in §2's
  #     recommended configuration) inside the PROTECTED bucket — an
  #     authenticated algorithm indicator, the shape R-O-05's type-indicator
  #     clause wants, and the opposite of rfc-9679's bare `ckt`.
  #   R-M-12 — §3's x5*-sender labels (-27/-28/-29) live in the COSE Header
  #     ALGORITHM Parameters registry (§4.2), so they mean these things only
  #     under the five ECDH-SS algorithms in Table 2. IANA's own answer to
  #     label scoping is (algorithm, label) — not R-M-12's (key, local label),
  #     but the nearest ratified relative, and proof the pattern fits inside
  #     COSE without a registry per extension point.
  - DEC-002
  - DEC-003
  - DEC-005
  - R-O-01
  - R-O-05
  - R-M-12
