distillation:
  standard: "FX-1"
  # `profile: full` DECLARED on the cross-check pass's report, 2026-10-21.
  # Every artifact in FX-1's set is present with NO `not_applicable`
  # declaration at all.
  #
  # `distillation.passes` below is the ONLY authority for which passes have
  # run. DO NOT RESTATE THE PASS COUNT here or in any artifact: a restatement
  # goes stale the moment the next pass lands and nothing reports it. This
  # comment was itself the proof, reading "pass 2 and pass 3 have NOT run"
  # after both had.
  #
  # ONE THING A READER SHOULD KNOW BEFORE BUILDING ON distilled/schema/: pass 3
  # found that `x5-headers.derived.cddl` PARSED PERFECTLY AND BOUND NOTHING.
  # Its x5 entries sit inside a map that also carries `* label => any`, and
  # RFC 8610 section 3.5.4 says of its own structurally identical example that
  # an item with a wrongly typed value "does match this specification: while
  # the first entry of the group does not match, the second one (the wildcard)
  # does." So a map carrying a nonsense value under label 34 matched the rule
  # for two passes. The cut operator is now applied to all seven x5 entries.
  # A schema that parses is not a schema that binds, and no parse check can
  # see the difference.
  #
  # What `full` does NOT mean: no `reviewed_by` is signed on any artifact, so
  # pass 4 (human review) is outstanding and nothing may be BUILT on these yet
  # (docs/requirements.md). They may be read.
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: >-
        29 verbatim regions covering every normative statement of section 1 to
        section 5, in source order, each an exact run of source lines with its
        line range and its own sha256 (the region's lines joined by \n, no
        trailing newline). Includes section 2's four parameter definitions
        whole, Table 1 with its lead-in and caption, the two CDDL lines with the
        DER sentence under them, Table 2, the complete section 4.3 media-type
        template, and ALL NINE PARAGRAPHS OF SECTION 5 AS NINE SEPARATE REGIONS
        so their order is on the record - which is what establishes that the x5t
        security claim is paragraph 9 of 9 and the identity-misbinding attack is
        paragraph 3. NO SECTION IS SPLIT AND NOTHING IS WELDED: this rendering
        has ZERO form feeds and no running headers or footers in 614 lines,
        checked with the same patterns that match 25 page breaks in RFC 8392, so
        there are no gaps to weld across. Built with split("\n"), never
        splitlines(). 390 distinct source lines are quoted and no line is quoted
        twice. The section 1.1 BCP 14 recital is quoted here and deliberately
        never in requirements.yaml
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: >-
        129 entries R-0001 to R-0129 in source order with no gaps: 14 stated,
        115 inferred. source_keyword_count and extracted_keyword_count both 14
        and AGREEING, by keyword as well as in total (10 MUST, 3 MUST NOT, 1
        SHOULD), with a 5.7 kB reconciliation written anyway. All 129 texts
        verified MECHANICALLY as contiguous substrings of the
        whitespace-normalised source, 0 failures, and a terminator check found
        26 spans that ran past their own sentence into the next and every one
        was tightened before the file was written. THE SHAPE OF THE 14 IS THE
        FIRST FINDING: four of the ten MUSTs are ONE SENTENCE RESTATED once per
        carrying parameter ("The end-entity certificate MUST be integrity
        protected by COSE", lines 163, 198, 261 and conditionally 463), each of
        the first three followed by "This can, for example, be done by" and
        three mechanisms with NONE MANDATED (line 229's restatement is about the
        IDENTIFICATION of the certificate and is followed by "This can be done
        by", without the "for example"); and the document's strongest
        prohibition - the public key of an untrusted certificate "cannot be used
        for cryptographic operations" - is LOWER CASE and binds nobody. What was
        counted instead: every sentence of the four parameter definitions split
        where separately testable, all four Table 1 rows, both CDDL rules and
        the DER sentence, all three sender parameters and all three Table 2
        rows, both IANA registry actions, the section 4.3 template - 20 of its
        21 label lines plus the two `usage` bullets and the lead-in, 24 entries
        under locator section 4.3; the one label with no entry is the container
        `Additional information:` at line 420, which has no value and is carried
        in normative.md - and all nine paragraphs of section 5. Every text
        carries its source_lines, and bin/check-locators reports all 129
        locators contained
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: >-
        7 files: 2 verbatim, 4 derived, 1 README. RFC 9360 SHIPS TWO LINES OF
        CDDL AND NOTHING ELSE - ABNF, ASN.1, JSON Schema, schema and grammar
        each occur ZERO times, CDDL occurs twice (the lead-in and the RFC 8610
        reference). cose-x509.cddl is lines 311-312 byte for byte with the
        source's margin; source-renderings.txt carries Table 1, the CDDL block,
        Table 2 and the media-type template as 4 regions with line ranges and
        digests. Derived: x5-headers.derived.cddl (the header grammar the
        document does not ship, with the requirement id behind every line, the
        COSE structures NAMED not redefined, and this library's narrowing as a
        second section); x5t-hashalg-policy.derived.yaml, which is the artifact
        that earns its place - all eight of rfc-9054's hash identifiers with a
        per-value PERMIT/REFUSE verdict for the integrity-binding position,
        because RFC 9360 restricts hashAlg to NO SUBSET of the registry;
        cose-cert-hash.derived.schema.json with $id
        urn:library:rfc-9360:cose-cert-hash.derived; and cddl-parse.derived.txt,
        the output of running RFC 8610 Appendix B's grammar - transcribed from
        this library's own capture and gated on RFC 8610's prelude plus three
        negatives - which establishes that both rules parse AS PRINTED and as
        TYPE rules, and that the 2* forbidding the one-element array is a
        deliberate choice rather than a grammatical necessity. Header markers
        and filenames agree on all six non-README files. PASS 3 RE-IMPLEMENTED
        THE PARSER INDEPENDENTLY - a set-returning recogniser over the same
        RFC 8610 Appendix B grammar, gated on 13 positives and negatives and on
        RFC 8610's own 40-rule prelude - and reproduced every verdict in both
        records' parse reports exactly, then found a defect in
        x5-headers.derived.cddl that the parse report could not see: an
        optional map entry followed by a `* label => any` wildcard matches a
        WRONGLY-TYPED value, per RFC 8610 section 3.5.4, so `{ 34: "nonsense" }`
        satisfied x5-signature-header and the one thing this file exists to
        say was unsaid. CDDL's cut, `^ =>`, is the fix; the file re-parses
        whole with the same twelve rules and the same kinds
    - kind: messages
      path: distilled/messages.yaml
      coverage: >-
        7 structures and 21 fields with the actual code points and octet-level
        layouts: COSE_X509, COSE_CertHash, the four general header parameters,
        the three algorithm-scoped ones, the application/cose-x509 media-type
        payload, the x5u retrieval exchange, and the carrying locations. EVERY
        LAYOUT WAS ENCODED FOR THIS
        PASS from RFC 8949 section 3 with a CBOR encoder written here - no CBOR,
        COSE or X.509 library - because the source prints NOT ONE BYTE, and
        every octet count is re-derived at write time. constrained_by IS WIRED:
        78 of the 129 requirement ids, 0 dangling, every one SELECTED FROM THE
        ID TABLE BY SCRIPT with a predicate on the entry's own locator, object
        and field that refuses to resolve unless unique. Three fields are listed
        BECAUSE THEY ARE ABSENT and the absence is the finding: kid (zero
        occurrences in 614 lines), external_aad's encoding (offered four times
        as an integrity mechanism and never specified), and the missing
        x5bag-sender - each named by a requirement and answered by an entry
        that records WHAT IS MISSING AND THE MEASUREMENT BEHIND IT, which is
        how an absent field is closed. Two cross-record ids are cited, both
        spelled in full and selected from rfc-9054's own id table. Pass 3 added
        the x5u-retrieval structure (F-2's GET and its response, neither
        defined by RFC 9360) with the four permitted target media types
        R-0051 to R-0054, which no artifact had wired
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: >-
        APPLICABLE, and the verdict is measured rather than assumed. Three
        flows: F-1, the relying party's nine-step validation with the section 5
        JOIN at its end; F-2, the six-step x5u retrieval with the document's
        only SHOULD; and F-3, the three-step INTERMEDIARY REWRITE the document
        admits itself, twice. Five error paths, six roles, 37 requirement ids
        wired, 0 dangling. protocol.md carries a Mermaid sequence diagram per
        flow. WHY APPLICABLE, counted over all 614 lines as whole words with a
        hyphen counting as a word boundary and an underscore not: sender 13
        (three of them the x5*-sender labels), party 6, "relying party" 4 (one
        of the four broken across lines 185-186 - pass 1 counted 3),
        recipient 3 or 4 with COSE_recipient, intermediary 2, server 2,
        retrieve 2, GET 1 (case-sensitively; a lower-case "get" at line 451 is
        not the method), client 1 - against verifier 0 and verify 0, in a document whose
        whole subject is what a verifier may conclude. There is no numbered
        procedure (steps 0, step 1), so the flows are the document's obligations
        arranged in the order it imposes. The absent list carries nine items, of
        which the three that matter are: NO ERROR REPORTING OF ANY KIND, no
        revocation mechanism, and no encoding for external_aad
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: >-
        APPLICABLE and deliberately small, with what was MEASURED separated from
        what was MODELLED at the top of the file. Measured: RFC 9360 has NO
        STATE VOCABULARY AT ALL - state, states, lifecycle, transition, revoke,
        rotate, rotation, expire, expiry, expiration, issuance and enroll each
        ZERO occurrences in 614 lines; revocation occurs 4 times and names no
        mechanism. Modelled anyway, because two normative statements are
        propositions about a system changing over time and dropping them would
        lose both: M-1, the end-entity certificate from untrusted input to
        usable key, whose finding is that TWO INDEPENDENT PATHS lead into the
        accept state and section 5 argues both orders and fixes only the join;
        and M-2, the trust-anchor set, whose only forbidden transition is the
        one thing in the document stated THREE TIMES - twice as a MUST NOT and
        once, in section 5, in lower case. 9 states, 8 permitted transitions, 1
        forbidden, 15 requirement ids, and an eight-item absent list. EVERY
        STATE NAME IS THIS EXTRACTION'S: the document names none, and the file's
        own `note` separates what was measured from what was modelled so a
        reviewer can disagree with the modelling without disagreeing with the
        measurement. (Pass 1's sentence stopped at "EXTRACTION'S"; completed by
        pass 2 from the artifact's own coverage field.)
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: >-
        8 vectors, and SEVEN OF THE EIGHT WOULD NOT EXIST IF THE SOURCE HAD
        PRINTED ANYTHING: Figure, Appendix, vector and "test vector" each occur
        ZERO times in 614 lines, there is no hex and no base64, and the six
        occurrences of example are all prose. So every vector is marked source:
        computed or derived and nothing is presented as printed. TWO RESULTS ARE
        IDENTITIES BETWEEN BYTE STRINGS RATHER THAN OBSERVATIONS ABOUT
        IMPLEMENTATIONS: V-0004, a filtering x5t and a binding x5t with the same
        algorithm are THE SAME BYTES - 23 octets with SHA-1, and the identity
        holds for every value of hashAlg - because COSE_CertHash has exactly two
        fields and Filter Only is a registry column; and V-0003, for ONE
        certificate the x5chain array framing and the application/cose-x509
        CBOR-sequence framing are THE SAME BYTES. V-0006 executes section 2's
        own recommended configuration and shows the protected bucket's bytes are
        IDENTICAL across an intermediary rewrite, so the digest comparison is
        the whole binding. V-0008 shows [-16, h''] - an EMPTY digest declaring
        itself SHA-256 - conforms to the document's own grammar. The
        certificates are PLACEHOLDERS that are deliberately not valid X.509,
        because a fabricated certificate presented as a fixture would invite
        someone to parse it. 28 requirement ids wired, 3 cross-record ids cited
        in full
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: >-
        15 sections. THE HEADLINE IS A CORRECTION TO THIS RECORD'S OWN SUMMARY
        that sharpens the finding rather than weakening it: section 5 has NINE
        paragraphs, the x5t security claim is the NINTH AND LAST with nothing
        after it, the identity-misbinding attack is the THIRD - 41 lines earlier
        - and the paragraph immediately BEFORE the claim says that protecting
        x5bag, x5chain AND x5t in the protected bucket mitigates a misbehaving
        CA. The adjacent pair is the better citation. MD-3 MAPPED HEADER BY
        HEADER over 10 of our fields, each with its carrier, label, registry and
        option-5 verdict, plus the export mapping in one line and what we
        deliberately do not carry. THEN FIVE CUTS AGAINST MD-3, each naming the
        DEC-002 option it costs: (1) the DER cut, which costs EVERY option
        identically - eight IANA allocations, zero CBOR tags, so the no-tags
        clause survives untouched while the profile acquires ASN.1 - so it is an
        argument about SCOPE and the decision belongs to DEC-003; (2) option 5
        inherits the COSE Header Parameters registry at two octets a label,
        costing option 5 where options 1 and 3 are registry-free; (3) the export
        format carries THREE framings of one list and two of them are the same
        bytes, failing canonical-encoding condition (1) inside a format option 5
        exports to; (4) the export format admits a Filter Only algorithm in a
        binding position and cannot say which, costing option 5 by construction;
        (5) the export format makes the key identifier OPTIONAL, which option 1
        cannot pay at all because it has no separate identifier field. All six
        canonical-encoding conditions scored, with THREE FAILS and condition (3)
        named as the structural one: the document's own digest definition makes
        a verifier re-encode untrusted input during verification unless it
        digests the received bytes verbatim, and nothing says to. 3 adopts, 4
        adaptations, 7 rejections. All nine of the summary's findings tested:
        four confirmed, one REFUTED as stated, three scoped, one confirmed with
        a positive control on the errata search. 9 source defects reported and
        never repaired (D-1 to D-9). 6 open questions. QUOTATIONS, RE-MEASURED
        BY PASS 2 WITH THE METHOD STATED, because pass 1's "15 of 15" is not
        reproducible: of the spans delimited by double quote marks, 11 resolve
        EXACTLY in a cached source - 9 in RFC 9360, 2 in RFC 9054 - and 0 need
        any relaxation; three further verbatim spans are delimited by single
        quotes or backticks. Every quotation of a mofn document is marked
        UNVERIFIABLE FROM THIS REPOSITORY, following rfc-9741 and rfc-9964, and
        pass 2 corrected the R-O-03 wording to the form five other records in
        this library quote
      reviewed_by: ""
  not_applicable: []
  passes:
