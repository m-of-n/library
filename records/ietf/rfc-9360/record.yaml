        EVERY VERBATIM BLOCK AND EVERY QUOTATION WAS LIFTED FROM THE CACHE BY
        LINE RANGE BY SCRIPT, never retyped, and verified mechanically rather
        than by eye: 129 of 129 requirement texts and 15 of 15 design-note
        quotations are contiguous substrings of the whitespace-normalised
        source, 0 failures. 29 normative.md regions and 4 schema regions carry
