        DEFECTS FOUND AND FIXED IN THIS RECORD. (1) THE 25-OCTET FOSSIL: the
        V-0004 identity was stated as "the same 25 octets" at 8 sites in this
        record and 1 in rfc-9054, while the artifact's own field says 23 and
        the encoding gives 23 (0x82 array head, 0x2d for -14, 0x54 bstr head,
        20 SHA-1 octets). Corrected everywhere, with the algorithm named,
        because the count is the algorithm's and the identity is not. (2) Four
