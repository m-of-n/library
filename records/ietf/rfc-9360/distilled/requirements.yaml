  - id: 'rfc-9360#R-0114'
    object: 'order of checking signature and certificate'
    field: 'a trade-off the document states and does not resolve'
    verb: 'none'
    actor: 'constrained systems'
    locator: '§5'
    text: 'In constrained systems, there is a trade-off between the order of checking the signature and checking the certificate for validity. Validating certificates can require that network resources be accessed in order to get revocation information or retrieve certificates during path building. The resulting network access can consume power and network bandwidth.'
    kind: inferred
    testable: 'no'
    status: active
    source_lines: '448-453'
  - id: 'rfc-9360#R-0115'
