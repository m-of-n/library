    field: 'they carry identities a passive on-path attacker can use to track the subject'
    verb: 'none'
    actor: 'attacker'
    locator: '§5'
    text: 'End-entity X.509 certificates contain identities that a passive on- path attacker eavesdropping on the conversation can use to identify and track the subject.'
    kind: inferred
    testable: 'no'
    status: active
    source_lines: '471-473'
  - id: 'rfc-9360#R-0120'
    object: 'x5t and x5u'
    field: 'they are alternative permanent identifiers and are equally trackable'
    verb: 'none'
    actor: 'attacker'
    locator: '§5'
    text: 'COSE does not provide identity protection by itself, and the ''x5t'' and ''x5u'' header parameters are just alternative permanent identifiers and can also be used to track the subject.'
    kind: inferred
    testable: 'no'
    status: active
    source_lines: '473-476'
    note: 'The document''s only statement about what x5t IS beyond a selector: a permanent identifier. Bears on ARCH-0002 P1 and on R-O-01.'
