    field: 'the oracle it can create'
    verb: 'none'
    actor: 'constrained systems'
    locator: '§5'
    text: 'On the other hand, if the certificates are validated after the signature is validated, an oracle can potentially be built based on detecting the network resources, which is only done if the signature validation passes.'
    kind: inferred
    testable: 'no'
    status: active
    source_lines: '453-456'
  - id: 'rfc-9360#R-0116'
    object: 'signature validation and certificate validation'
    field: 'both must complete successfully before acting'
    verb: 'MUST'
    actor: 'relying party'
    locator: '§5'
    text: 'In any event, both the signature validation and the certificate validation MUST be completed successfully before acting on any requests.'
    kind: stated
    testable: 'partial'
    status: active
    source_lines: '456-459'
    note: 'Stated keyword 12 of 14. A JOIN with no stated order: the preceding two entries argue both orders and the document picks neither.'
  - id: 'rfc-9360#R-0117'
    object: 'end-entity certificate'
    field: 'integrity protection, CONDITIONAL on a CA practice the message does not carry'
    verb: 'MUST'
    actor: 'sender'
    locator: '§5'
    text: 'Unless it is known that the Certificate Authority (CA) required proof of possession of the subject''s private key to issue an end-entity certificate, the end-entity certificate MUST be integrity protected by COSE.'
    kind: stated
    testable: 'no'
    status: active
    source_lines: '461-464'
    note: 'Stated keyword 13 of 14, and the FOURTH occurrence of this obligation - this one with an "Unless it is known that" escape that depends on a CA practice statement nowhere in the message. Untestable for that reason.'
  - id: 'rfc-9360#R-0118'
    object: 'an identity-misbinding certificate'
    field: 'the attack the obligation defends against'
    verb: 'none'
    actor: 'attacker'
    locator: '§5'
    text: 'Without proof of possession, an attacker can trick the CA into issuing an identity-misbinding certificate with someone else''s "borrowed" public key but with a different subject. An on-path attacker can then perform an identity-misbinding attack by replacing the real end-entity certificate in COSE with such an identity- misbinding certificate.'
    kind: inferred
    testable: 'no'
    status: active
    source_lines: '464-469'
    note: 'THE RFC''S OWN ARGUMENT FOR ARCH-0002 P1: the attack exists only because the name and the key are separable. It is section 5''s THIRD paragraph of nine, not the paragraph after the x5t claim - see design-notes.md section 10.'
  - id: 'rfc-9360#R-0119'
