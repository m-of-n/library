  - id: 'rfc-9360#R-0129'
    object: 'the hash algorithm used for x5t'
    field: 'the claim that its security does not affect the system''s'
    verb: 'none'
    actor: 'applications'
    locator: '§5'
    text: 'The security of the algorithm used for ''x5t'' does not affect the security of the system, as this header parameter selects which certificate that is already present on the system should be used, but it does not provide any trust.'
