extracted_keyword_count: 14     # recomputed and checked by bin/validate
reconciliation: >-
  THE COUNTS AGREE AT 14 and a reconciliation is written anyway, because 129
  entries against 14 keywords needs explaining and because the SHAPE of the 14
  is this record's first finding.

  WHERE THE 14 ARE, by source line. MUST x10: L154 and L189 (the trust
  mechanism must process certificates as untrusted input - once for x5bag, once
  for x5chain); L163, L198 and L261 (THE SAME SENTENCE, "The end-entity
  certificate MUST be integrity protected by COSE", once per carrying
  parameter); L229 (the IDENTIFICATION of the end-entity certificate must be
  integrity protected - a different subject); L238 (applications using x5t must
  support SHA-256); L458 (signature validation and certificate validation must
  both complete before acting); L463 (the end-entity certificate must be
  integrity protected, UNLESS the CA required proof of possession); L479 (the
  key must be checked against the algorithm). MUST NOT x3: L156 and L191 (a
  self-signed certificate in the parameter must not update the trust anchors -
  once per parameter); L270 (a retrieved certificate that does not chain to an
  anchor must not be trusted). SHOULD x1: L277 (TLS, DTLS or OSCORE for an
  HTTP or CoAP GET). THERE IS NO SHOULD NOT, NO MAY, NO SHALL, NO REQUIRED,
  NO RECOMMENDED and NO OPTIONAL anywhere outside section 1.1's recital.

  FOUR OF THE TEN MUSTS ARE ONE OBLIGATION RESTATED, and all four are
  untestable from a single header. "The end-entity certificate MUST be
  integrity protected by COSE" appears at L163, L198, L261 and (conditionally)
  L463. Each of the first three is followed by "This can, for example, be done
  by" and a list of three mechanisms, NONE MANDATED; the fourth adds an
  "Unless it is known that the Certificate Authority (CA) required proof of
  possession" escape that depends on a CA practice statement the message does
  not carry. The property is about the whole COSE object, so a validator
  holding one header cannot decide it. Any profile of ours must collapse the
  four into one checkable rule - see design-notes.md.

  AND THE DOCUMENT'S STRONGEST PROHIBITION IS LOWER CASE. "If the application
  cannot establish trust in the certificate, the public key contained in the
  certificate cannot be used for cryptographic operations" (L134-L137) is the
  sentence on which every other obligation depends, and under section 1.1's "when,
  and only when, they appear in all capitals" it binds nobody. Recorded as
  R-0012, kind: inferred, with the carrying phrase named in `field`. The same
  is true of section 5's "A new self-signed certificate appearing on the client cannot
  be a trigger to modify the set of trust anchors" (R-0112), which is the
  lower-case restatement of two of the three MUST NOTs.

  SO THE REAL NORMATIVE BASELINE IS A TABLE, A GRAMMAR AND A REGISTRY
  TEMPLATE, NOT BCP 14. What an implementer must obey lives in (i) section 2's four
  parameter definitions, each fixing a name, a type and a bucket rule in
  keyword-free prose; (ii) Table 1's four data rows, which are the whole of
  the label assignment, reproduced here one row per entry; (iii) the two CDDL
  rules at L311-L312, which are the whole wire format; (iv) Table 2's three
  rows, where the label is scoped BY ALGORITHM; and (v) section 4.3's media-type
  registration template, every field of which is reproduced here.

  WHAT WAS COUNTED INSTEAD, therefore: every sentence of section 2's four parameter
  definitions split where each half is separately testable (contents, order,
  cardinality, encoding, bucket, integrity); all four Table 1 data rows; both
  CDDL rules and the DER sentence; all three sender parameters and all three
  Table 2 rows; both IANA registry actions with their Value Registry and
  Reference fields; all twenty-one fields of the section 4.3 media-type template,
  including the two states of the `usage` parameter as two entries; and all
  nine paragraphs of section 5, broken at each separately testable claim.

  WHAT WAS DELIBERATELY NOT COUNTED: section 1.1's BCP 14 recital at L96-L100. It
  recites all eleven keywords and constrains nothing; bin/validate recounts
  these texts with boilerplate stripping OFF, so quoting it would add eleven
  phantom keywords and make the extraction read 25 against a source of 14. It
  is quoted in normative.md, which nothing counts.

  NOTHING IS SPLICED. Where two entries share a flowed line range they are
  contiguous character spans of the SAME range, cut by script with an explicit
  start and end marker - never two non-adjacent quotes welded into one. The
  pairs that overlap this way are (R-0018, R-0019), (R-0022, R-0023),
  (R-0030, R-0031), (R-0033, R-0034), (R-0045, R-0046), (R-0065, R-0066),
  (R-0081, R-0082) and (R-0122, R-0123). Every text was then verified
  mechanically as a contiguous substring of the whitespace-normalised source:
  129 of 129, zero failures. A terminator check found 26 spans that ran past
  their own sentence into the first words of the next and every one was
  tightened before this file was written.

  TEXT NORMALISATION, DECLARED: `text` is the source's own wording with
  whitespace normalised - line breaks and the RFC's double sentence spacing
  become single spaces. No hyphenation is healed: the source wraps
  "DER-encoded" across L222-L223 as "DER-" + "encoded certificate", and
  R-0042's text therefore reads "computed over the DER- encoded certificate"
  exactly as the whitespace-normalised source does. THAT IS NOT A TYPO IN THIS
  FILE. normative.md carries the byte-exact rendering.

  PAGE DECORATION: there is none. This rendering of RFC 9360 has ZERO form
  feeds and no running headers or footers in its 614 lines, so no region in
  this record can contain page furniture and no section is quoted in parts for
  that reason. Checked, not assumed: the footer and header patterns that
  match in RFC 8392 match nowhere here.
reviewed_by: ""
note: >-
  Ids are stable and never reused. Cite as rfc-9360#R-NNNN.

  Pass 1 of the FX-1 extraction (extract), effort max, 2026-10-20. Read only
  .cache/rfc-9360.txt - never summary.md and never another record's artifacts.
  Every `text` was cut from the cache by line range by script and never
  retyped.

  `verb: none` marks an entry whose source sentence carries no capitalised BCP
  14 keyword; `field` then names the phrase that carries the force instead.
  `actor` is who must comply, in the document's own vocabulary where it has one
  ("the trust mechanism", "applications", "the relying party", "the party
  evaluating the signature", "an intermediary", "IANA") and the nearest role
  otherwise. The document has NO word for the verifying side: `verifier` and
  `verify` occur ZERO times in 614 lines.

  THIS DOCUMENT HAS PARTIES AND A RETRIEVAL STEP, SO protocol.yaml AND
  state-machine.yaml ARE BOTH APPLICABLE - see their own notes for what is and
  is not in them. `sender` occurs 13 times (all in section 3), `recipient` 4,
  "relying party" 3, `intermediary` 2, `server` 2, and section 2 specifies an HTTP or
  CoAP GET with a transport-security SHOULD.

  IT SHIPS TWO LINES OF CDDL AND NOTHING ELSE. `CDDL` occurs twice (L308 and
  the RFC 8610 reference at L589); `ABNF`, `ASN.1`, `JSON Schema`, `schema` and
  `grammar` occur ZERO times. Everything in distilled/schema/ is either the
  verbatim capture of L311-L312 and the three source-rendered tables, or
  carries `.derived.` in its filename.

  AND IT PRINTS NO EXAMPLE. `Figure`, `Appendix` and `vector` occur ZERO times;
  the six occurrences of `example` are all prose ("for example", "An example of
  this would be"). There is not one COSE object, not one certificate and not
  one x5t value in the document. Every vector in distilled/examples/ is
  therefore THIS EXTRACTION'S COMPUTATION, marked as such.

