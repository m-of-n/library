source_lines_total: 614

# Every structure, header parameter and media-type payload RFC 9360 defines,
# constrains or registers, with the actual code points and octet-level
# layouts. Section numbers are RFC 9360's unless another document is named.
#
# ---------------------------------------------------------------------------
# PROVENANCE OF EVERY BYTE LAYOUT
# ---------------------------------------------------------------------------
# RFC 9360 PRINTS NOT ONE BYTE. `Figure`, `Appendix`, `vector` and "test
# vector" occur ZERO times in its 614 lines; the six occurrences of `example`
# are all prose. So no layout below is read off a printed example - every one
# was ENCODED FOR THIS PASS from RFC 8949 §3 with a CBOR encoder written here,
# no CBOR, COSE or X.509 library involved, and every octet count was
# re-derived by the generator at write time. Each such value is labelled
# `computed: true`. ../examples/vectors.yaml carries them as fixtures with the
# same provenance.
#
# ---------------------------------------------------------------------------
# `constrained_by` IS WIRED FROM THE ID TABLE, NOT BY HAND
# ---------------------------------------------------------------------------
# Every id below was selected out of ../requirements.yaml by a predicate on
# that entry's own `locator`, `object` and `field`, by script, and the
# selection REFUSES to resolve if it is not unique. The guardrail is not
# hypothetical: a batched lane in this same effort wrote 30 ids by
# pattern-match against the wrong record's layout, and they resolved to
# plausible-but-different statements, which no checker here catches. A join
# audit printing every id beside the text it resolves to was read before this
# file was accepted.
#
# `constrained_by: []` IS A FINDING. Every empty list below belongs to
# RFC 9052: RFC 9360 defines no COSE structure, no bucket and no algorithm. It
# adds entries to maps somebody else owns.
#
# ---------------------------------------------------------------------------
# WHAT THIS DOCUMENT DOES NOT DEFINE, STATED UP FRONT
# ---------------------------------------------------------------------------
# NO CBOR TAG. `tag`, `tags` and `tagged` occur ZERO times. Its eight IANA
# allocations are four header labels, three algorithm-scoped header labels and
# one media type.
#
# NO COSE STRUCTURE. COSE_Sign1, COSE_Signature, COSE_recipient and the
# protected/unprotected buckets are RFC 9052's. §2 names exactly two locations
# for these parameters and COSE_Encrypt, COSE_Mac and COSE_Mac0 are not among
# them.
#
# NO KEY IDENTIFIER. `kid` occurs ZERO times. This document adds four ways to
# identify a key and relates none of them to COSE's own label 4.
#
# NO ALGORITHM, AND NO ALGORITHM RESTRICTION. It names one algorithm, SHA-256,
# as a floor on support, and restricts `hashAlg` to no subset of the COSE
# Algorithms registry. The eight values that registry holds for hashing are
# rfc-9054's; see ../schema/x5t-hashalg-policy.derived.yaml.
#
# NO CANONICAL FORM AT THE CBOR LAYER, AND ONE AT THE LAYER BELOW.
# `canonical`, `canonicalization` and `deterministic` occur ZERO times - but
# every `bstr` here holds DER, which IS a canonical encoding with its own
# rules. That is the DEC-002 finding and it is a property of the payload, not
# of the CBOR.

messages:

  # =========================================================================
  - name: COSE_X509
    locator: "§2 (CDDL, source line 311), Table 1, §4.1"
    encoding: "CBOR byte string, or CBOR array of byte strings"
    summary: >-
      THE TYPE BOTH CERTIFICATE-CARRYING PARAMETERS USE. Verbatim from
      source line 311: `COSE_X509 = bstr / [ 2*certs: bstr ]`. Two shapes
      for one field, chosen so that one certificate has exactly one
      encoding: the `2*` makes the one-element array INVALID. That is an
      ambiguity removed by construction rather than by a canonicalization
      rule, and it is the one thing in this document `canonical-encoding`
      condition (1) can point at approvingly. The price is that every
      decoder must accept two shapes.

      `certs` is a bareword MEMBER KEY, not a type name - RFC 8610's
      `memberkey = bareword S ":"`. In an array context RFC 8610 Appendix
      C notes a member key is only usable for arrays, which is what this
      is; the name is documentation.
    layout: >-
      COMPUTED FOR THIS PASS, not printed anywhere in RFC 9360. One
      certificate (here a 3-octet placeholder, since the document supplies
      no certificate): `43300100` - major type 2, length 3. Two
      certificates: `824330010043300101` - major type 4 length 2, then two
      byte strings. The one-element array `8143300100` and the empty array
      `80` are both INVALID against the `2*`.
    computed: true
    fields:
      - name: 'bstr (single-certificate form)'
        type: "bstr"
        required: false
        encoding: "major type 2; the bytes are ASN.1 DER"
        locator: "§2, source lines 311 and 314"
        constrained_by:
          - 'rfc-9360#R-0069'
          - 'rfc-9360#R-0071'
          - 'rfc-9360#R-0025'
          - 'rfc-9360#R-0037'
        note: >-
          THE DEC-002 CUT, IN ONE FIELD. Source line 314: "The contents of
          "bstr" are the bytes of a DER-encoded certificate." A
          reduced-CBOR profile reduces the CBOR; it does not reach inside
          a byte string. Carrying this field buys ASN.1 DER - a second
          encoding, a second parser, a second canonical form and a second
          trust system - and none of that is excluded by "no IANA tags".
          CDDL cannot constrain it either: `.cbor` would be wrong, because
          the content is not CBOR.
      - name: 'array (multi-certificate form)'
        type: "[ 2*certs: bstr ]"
        required: false
        encoding: "major type 4, two or more elements, each major type 2"
        locator: "§2, source line 311"
        constrained_by:
          - 'rfc-9360#R-0069'
          - 'rfc-9360#R-0026'
          - 'rfc-9360#R-0038'
          - 'rfc-9360#R-0014'
          - 'rfc-9360#R-0015'
        note: >-
          MINIMUM TWO, AND NO MAXIMUM. Nothing bounds the length, and for
          `x5bag` §2 adds that the array may hold duplicates and
          certificates "completely extraneous to the message" while
          possibly still not holding "the full set of certificates needed
          to build any particular chain". A constrained relying party
          cannot bound the cost of a conforming message.

  # =========================================================================
  - name: COSE_CertHash
    locator: "§2 (CDDL, source line 312), Table 1, Table 2"
    encoding: "CBOR array of exactly two elements"
    summary: >-
      EXACTLY TWO FIELDS, AND THAT IS THE FINDING. Verbatim from source
      line 312: `COSE_CertHash = [ hashAlg: (int / tstr), hashValue: bstr
      ]`. There is no third field, so there is nowhere to carry what the
      digest is FOR. rfc-9054 registers SHA-1 (-14) and SHA-256/64 (-15)
      with `Recommended: Filter Only`, which rfc-9054 §4.1 defines as "not
      to be used for purposes that require collision resistance" - but
      Filter Only is a REGISTRY COLUMN, not a wire field. A verifier
      handed `[-14, h'...']` cannot tell whether the sender was filtering
      or binding; ../examples/vectors.yaml shows the two uses are
      byte-identical.

      Field for field this is rfc-9054 §2.1's `COSE_Hash_Find`, down to
      the member key names. Neither document cites the other's structure.
    layout: >-
      COMPUTED. `[-16, h'<32 zero octets>']` encodes as
      `822f5820000000...` - 36 octets: `82` (array of 2), `2f` (-16, one
      octet), `5820` (byte string of 32), then the digest. Inside a
      protected header map as label 34 it costs 39. Every algorithm's cost
      is tabulated in ../examples/vectors.yaml.
    computed: true
    fields:
      - name: hashAlg
        index: 0
        type: "int / tstr"
        required: true
        encoding: "major type 0 or 1 for the integer form, major type 3 for the string form"
        locator: "§2, source lines 216-221"
        constrained_by:
          - 'rfc-9360#R-0070'
          - 'rfc-9360#R-0041'
          - 'rfc-9360#R-0047'
          - 'rfc-9360#R-0048'
        note: >-
          THE REGISTRY JOIN, AND IT CITES NO DOCUMENT. §2 says the value
          corresponds to "the Value column (integer or text string) of the
          algorithm registered in the "COSE Algorithms" registry" and
          gives the IANA URL. rfc-9054, which populates that registry with
          all eight hash identifiers, is cited ZERO times in RFC 9360 -
          `9054` does not occur in the source. The restriction on the
          value is NONE; the only algorithm statement in the document is a
          floor on SUPPORT.

          THE STRING FORM IS UNREACHABLE TODAY. "an integer or a string"
          admits a text identifier, and the COSE Algorithms registry holds
          no text identifier for any hash algorithm, so the `tstr` branch
          is dead on arrival and stays in the grammar.
      - name: hashValue
        index: 1
        type: "bstr"
        required: true
        encoding: "major type 2; length is the digest length of hashAlg and is NOT stated anywhere"
        locator: "§2, source lines 221-223"
        constrained_by:
          - 'rfc-9360#R-0070'
          - 'rfc-9360#R-0042'
        note: >-
          THE WRONG ANSWER TO DEC-003, AND IT IS EXPLICIT. The digest is
          "computed over the DER-encoded certificate" - the whole
          certificate, not the key. DEC-003's mandatory clause is that
          canonical KEY bytes are specified before hashing, so an `x5t`
          value is not a KeyId and must not be used as one. rfc-9679 §5.4
          draws the same distinction from the other side, preferring a
          SubjectPublicKeyInfo digest to a digest of a complete
          certificate value.

          NO LENGTH RULE. Nothing says the length must match the digest
          length of hashAlg, so `[-16, h'00']` is a conforming
          COSE_CertHash. The source wraps `DER-encoded` across lines
          222-223 and ../requirements.yaml carries the break rather than
          healing it.

