  # =========================================================================
  - name: application/cose-x509
    locator: "§2 (lines 256-259), §4.3"
    encoding: "a CBOR SEQUENCE (RFC 8742) of single-entry COSE_X509 structures"
    summary: >-
      A THIRD WIRE FRAMING FOR THE SAME INFORMATION, and the construct it
      names is rfc-8742's. §4.3: "the data is a CBOR sequence of
      single-entry COSE_X509 structures (encoding "bstr")". So the same
      list of certificates has three encodings in this one document: a
      bare `bstr` (one certificate), a `[ 2*certs: bstr ]` array (two or
      more), and a concatenation of `bstr`s with no enclosing item (this
      media type). RFC 8742 defines CBOR sequences and registers
      `application/cbor-seq`, and RFC 9360 cites it ZERO times - `8742`
      does not occur in the source.

      CDDL CANNOT DESCRIBE IT. CDDL describes single data items, so no
      rule in this document covers the media type's content;
      ../schema/x5-headers.derived.cddl can only give the shape of one
      element.
    layout: >-
      COMPUTED. Two certificates as this media type: `4330010043300101`, 8
      octets, two concatenated byte strings and no array head. The same
      two as an `x5chain` array: `824330010043300101`, 9 octets. For ONE
      certificate the two framings COINCIDE exactly - `43300100` is both a
      valid COSE_X509 and a valid one-item CBOR sequence - so a decoder
      cannot tell which framing it was handed without being told. Decoding
      the two-certificate sequence as a single CBOR item fails with
      trailing bytes.
    computed: true
    fields:
      - name: 'sequence element'
        type: "bstr"
        required: false
        encoding: "major type 2, repeated with no enclosing data item"
        locator: "§2 lines 256-258, §4.3 lines 384-385"
        constrained_by:
          - 'rfc-9360#R-0055'
          - 'rfc-9360#R-0086'
          - 'rfc-9360#R-0071'
      - name: 'usage parameter'
        type: "media type parameter, optional"
        required: false
        encoding: 'absent, or the literal "chain"'
        locator: "§4.3"
        constrained_by:
          - 'rfc-9360#R-0087'
          - 'rfc-9360#R-0056'
          - 'rfc-9360#R-0093'
          - 'rfc-9360#R-0094'
        note: >-
          EXACTLY TWO STATES AND NO DEFAULT BEYOND SILENCE. Absent means
          "no further information about the intended meaning of the
          order"; "chain" means the sequence is a certificate chain. So an
          unparameterised `application/cose-x509` is an ORDER-UNDEFINED
          list - the media-type equivalent of `x5bag` - and the parameter
          is the only thing distinguishing it from the equivalent of
          `x5chain`.
    registration_notes:
      note: >-
        NO MAGIC NUMBER AND NO FILE EXTENSION (rfc-9360#R-0102,
        rfc-9360#R-0103), so a file of this type is not self-identifying:
        it is a run of CBOR byte strings carrying DER, and nothing in the
        bytes says so. Encoding considerations are "binary"
        (rfc-9360#R-0095) and fragment identifiers are N/A
        (rfc-9360#R-0100).

  # =========================================================================
  - name: x5u-retrieval
    locator: "§2 lines 244-277; §5 lines 487-489"
    encoding: "NOT DEFINED HERE - an HTTP or CoAP GET and its response"
    summary: >-
      THE ONE EXCHANGE IN THE DOCUMENT, AND RFC 9360 DEFINES NEITHER
      MESSAGE. Added by pass 3, because ../protocol.yaml F-2 steps 2 and
      3 are a request and a response and the cross-check rule is that
      every message in a flow is defined here. What the document
      actually supplies is a method name, a transport-security SHOULD
      and a CLOSED LIST OF FOUR MEDIA TYPES for the response; the
      request has no format, no headers and no parameters of its own,
      and there is no error response of any kind - `verifier`, `verify`
      and any error vocabulary occur ZERO times in 614 lines.

      THE DOCUMENT'S ONLY SHOULD IS HERE, and bin/bcp14-count's 14
      keywords break down as 10 MUST, 3 MUST NOT and exactly this one:
      "If an HTTP or Constrained Application Protocol (CoAP) GET request
      is used to retrieve a certificate, TLS [RFC8446], DTLS [RFC9147],
      or Object Security for Constrained RESTful Environments (OSCORE)
      [RFC8613] SHOULD be used." (rfc-9360#R-0061, source lines
      274-277). It binds the TRANSPORT rather than either message, and
      it is conditional on the method being used at all.

      AND THE LIST OF FOUR IS NOT STATED AS CLOSED. R-0050 reads "The
      referenced resource can be any of the following media types:" -
      `can be`, lower case, with no keyword - so "exactly four" is this
      extraction's reading of a permissive sentence, and a fifth media
      type is not prohibited by any text. Recorded rather than smoothed
      over, because ../protocol.yaml F-2 step 3 calls the list closed.
    computed: false    # nothing is encoded here; neither message is CBOR
    fields:
      - name: 'the GET request'
        type: "HTTP or CoAP GET"
        required: false
        encoding: "not defined by RFC 9360; the method is HTTP's or CoAP's"
        locator: "§2 lines 274-277"
        constrained_by:
          - 'rfc-9360#R-0061'
          - 'rfc-9360#R-0059'
        note: >-
          MEASURED: `GET` occurs ONCE in 614 lines, case-sensitively, at
          line 275 (the lower-case "get" at line 451 is "get revocation
          information", not the method); `request` twice, at line 6 (the
          masthead) and line 275. The document names no other method,
          no header, no status code and no retry rule. The URI's own
          protection is where the document contradicts itself - see
          ../protocol.yaml F-2's `open_question`, R-0059 against R-0060.
      - name: 'the response body (the x5u target)'
        type: "one of exactly four media types"
        required: false
        encoding: "whatever the named media type specifies; only the fourth is CBOR"
        locator: "§2 lines 246-259"
        media_types:
          - 'application/pkix-cert'                                  # rfc-9360#R-0051
          - 'application/pkcs7-mime with smime-type="certs-only"'    # rfc-9360#R-0052
          - 'application/cose-x509'                                  # rfc-9360#R-0053
          - 'application/cose-x509 with usage=chain'                 # rfc-9360#R-0054
        constrained_by:
          - 'rfc-9360#R-0050'
          - 'rfc-9360#R-0051'
          - 'rfc-9360#R-0052'
          - 'rfc-9360#R-0053'
          - 'rfc-9360#R-0054'
          - 'rfc-9360#R-0055'
          - 'rfc-9360#R-0056'
          - 'rfc-9360#R-0060'
        note: >-
          FOUR NAMED TYPES AND NO NEGOTIATION. R-0050 introduces the
          list and R-0051 to R-0054 are its four members, each a bare
          line of the bullet list with its own reference. There is no
          content negotiation, no Accept rule, and no statement of what
          a relying party does with a type that is not on the list -
          nor, as the summary above says, any text making the list
          exhaustive. Only the last two are this document's own; their
          payload is the `application/cose-x509` structure above, which
