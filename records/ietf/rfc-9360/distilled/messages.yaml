  # =========================================================================
  - name: x5-sender-header-parameters
    locator: "§3 (definitions and Table 2), §4.2"
    encoding: "entries in a COSE_recipient header map, VALID ONLY under five algorithms"
    summary: >-
      THREE PARAMETERS, NOT FOUR, AND THEY ARE SCOPED BY ALGORITHM. §3
      defines `x5chain-sender`, `x5t-sender` and `x5u-sender` entirely by
      reference to their §2 siblings, and declines a sender-side bag
      because "the same attribute would be used for both the sender and
      recipient certificates".

      THE SCOPING IS THE R-M-12 DATUM. §4.2 registers these in the **COSE
      Header ALGORITHM Parameters** registry, not the general one, so
      -27/-28/-29 mean these things ONLY under ECDH-SS+HKDF-256,
      ECDH-SS+HKDF-512, ECDH-SS+A128KW, ECDH-SS+A192KW and ECDH-SS+A256KW.
      The same integers are free elsewhere. That is IANA's own answer to
      label scoping - the *(algorithm, label)* pair - and the nearest
      ratified relative of R-M-12's *(key, local label)*. CDDL cannot
      express it; ../schema/x5-headers.derived.cddl carries it as a
      comment, which is itself the finding.
    layout: >-
      COMPUTED: -27 -> `381a`, -28 -> `381b`, -29 -> `381c`. Two octets
      each, major type 1 with a one-octet argument.
    computed: true
    valid_only_under_algorithms:
      - 'ECDH-SS+HKDF-256'   # Table 2; the algorithm identifiers themselves are rfc-9053's
      - 'ECDH-SS+HKDF-512'   # Table 2; the algorithm identifiers themselves are rfc-9053's
      - 'ECDH-SS+A128KW'   # Table 2; the algorithm identifiers themselves are rfc-9053's
      - 'ECDH-SS+A192KW'   # Table 2; the algorithm identifiers themselves are rfc-9053's
      - 'ECDH-SS+A256KW'   # Table 2; the algorithm identifiers themselves are rfc-9053's
