note: |
  Ids are stable and never reused. Cite as rfc-9165#R-NNNN.
  Entries are in source order by section, then by position within the section;
  ids run from R-0001 with no gaps.
  KIND. `stated` means an all-capitals BCP 14 keyword backs the entry; there are
  five, and all five are the bare keyword MUST: rfc-9165#R-0016, rfc-9165#R-0023,
  rfc-9165#R-0026, rfc-9165#R-0047 and rfc-9165#R-0048. `inferred` means no BCP 14
  keyword backs it - the force is an operator definition, a matching rule, a stated
  algorithm, a grammar production, a stated consequence, an explicit absence, or a
  lower-case force-word - and every inferred entry names that carrier in `field`.
  `inferred` here does NOT mean the text is paraphrased: every `text` in this file
  is a single contiguous verbatim span of RFC 9165, sliced out of the cached source
  by line range rather than retyped. This follows rfc-8610 and
  draft-ietf-cbor-edn-literals, not rfc-8785, where `inferred` marked non-verbatim
  text.
  VERB. Upper case only for the five stated entries. Lower case reproduces the
  source's own force-word or hedge ('need to', 'requiring', 'requires', 'should',
  'can', 'could', 'may', 'might', 'will usually'); `none` means the sentence
  carries no force-word at all and its normativity is definitional.
  CONTIGUITY. Asserted after collapsing runs of whitespace and nothing else. This
  source carries NO form feeds, NO '[Page n]' markers and NO running header or
  footer, so there is no page decoration to remove and no span crosses a page
  frame. No interior word, clause or punctuation mark of any span was altered,
  dropped or reordered, and no span is spliced from two non-adjacent parts of the
  document. Several entries quote two adjacent sentences.
  THE ONE HYPHENATION BREAK. rfc-9165#R-0064's span stops mid-sentence because the
  token `left-hand` is severed by the line break between source lines 370 and 371.
  Per docs/extraction.md it is not quoted whole anywhere in this record; the entry
  quotes the obligation-bearing half and its `field` states the severance and
  gives the dropped half in our words. It is the only hyphenation break in the
  document.
  ACTOR. CDDL has no protocol roles, so `actor` names the party a constraint falls
  on in practice: `CDDL tool implementer` for an operator definition or matching
  rule, `CDDL specification author` for a drafting rule or an idiom,
  `IANA / registrant` for Section 5, `reader of this specification` for Section 1.1's
  definitions.

requirements:
  - id: "rfc-9165#R-0001"
    object: 'CDDL, as standardized in RFC 8610'
    field: 'no BCP 14 keyword backs this; the force is the statement of fact that control operators are CDDL''s MAIN language extension point, which is what makes every operator this document adds an exercise of that one point'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§1"
    text: 'The Concise Data Definition Language (CDDL), standardized in [RFC8610], provides "control operators" as its main language extension point (Section 3.8 of [RFC8610]).'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement about where CDDL''s extensibility lives, not a condition on a specification or an instance'
    status: active
  - id: "rfc-9165#R-0002"
    object: 'this document'
    field: 'no BCP 14 keyword backs this; the force is the document''s own statement of scope, completed by Table 1'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§1"
    text: 'The present document defines a number of control operators that were not yet ready at the time [RFC8610] was completed:'
    kind: inferred
    testable: 'no'
    testable_reason: 'a scope statement; the testable content is in the per-operator entries'
    status: active
  - id: "rfc-9165#R-0003"
    object: 'the set of operators this document defines'
    field: 'no BCP 14 keyword backs this; the force is the TABLE, reproduced verbatim as a block in normative.md - .plus (Numeric addition), .cat (String concatenation), .det (String concatenation, pre-dedenting), .abnf (ABNF in CDDL (text strings)), .abnfb (ABNF in CDDL (byte strings)), .feature (Indicates name of feature used (extension point)). Six operators, and the table is the only place the document lists them together'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§1"
    text: 'Table 1: New Control Operators in this Document'
    kind: inferred
    testable: 'yes'
    testable_reason: 'a tool either implements these six names or it does not'
    status: active
  - id: "rfc-9165#R-0004"
    object: 'this specification'
    field: 'no BCP 14 keyword backs this; the force is the incorporation of RFC 8610''s vocabulary wholesale, which makes RFC 8610 a prerequisite read'
    verb: 'none'
    actor: 'reader of this specification'
    locator: "§1.1"
    text: 'This specification uses terminology from [RFC8610].'
    kind: inferred
    testable: 'no'
    testable_reason: 'an incorporation of vocabulary'
    status: active
  - id: "rfc-9165#R-0005"
    object: 'the terms target and controller'
    field: 'no BCP 14 keyword backs this; the force is a DEFINITION, and it fixes the orientation of every operand rule in this document'
    verb: 'none'
    actor: 'reader of this specification'
    locator: "§1.1"
    text: 'In particular, with respect to control operators, "target" refers to the left-hand side operand and "controller" to the right-hand side operand.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a definition; it is presupposed by the testable entries rather than tested itself'
    status: active
  - id: "rfc-9165#R-0006"
    object: 'the term tool'
    field: 'no BCP 14 keyword backs this; the force is a DEFINITION. It matters because .feature''s whole semantics is stated in terms of what a tool reports, and the reference model is the CDDL tool of RFC 8610 Appendix F - an appendix RFC 8610 declares "for information only"'
    verb: 'none'
    actor: 'reader of this specification'
    locator: "§1.1"
    text: '"Tool" refers to tools along the lines of that described in Appendix F of [RFC8610].'
    kind: inferred
    testable: 'no'
    testable_reason: 'a definition, and it points at an informative appendix of another document'
    status: active
  - id: "rfc-9165#R-0007"
    object: 'text strings and byte strings'
    field: 'no BCP 14 keyword backs this; the force is a DEFINITION that makes the two string MUSTs of this document (R-0023, R-0047) range over both types'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§1.1"
    text: 'Note also that the data model underlying CDDL provides for text strings as well as byte strings as two separate types, which are then collectively referred to as "strings".'
    kind: inferred
    testable: 'yes'
    testable_reason: 'whether an operand of either string type is accepted is decidable against a specification'
    status: active
  - id: "rfc-9165#R-0008"
    object: 'the ABNF dialect accepted by .abnf and .abnfb'
    field: 'no BCP 14 keyword backs this; the force is a DEFINITION of the controller language. It is load-bearing twice over: it makes RFC 7405 normative for a CDDL extension, and, because RFC 5234 quoted strings are case-INSENSITIVE unless RFC 7405''s %s prefix is used, it settles the case sensitivity of every literal in an embedded ABNF'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§1.1"
    text: 'The term "ABNF" in this specification stands for the combination of [RFC5234] and [RFC7405]; i.e., the ABNF control operators defined by this document allow use of the case-sensitive extensions defined in [RFC7405].'
    kind: inferred
    testable: 'yes'
    testable_reason: 'an ABNF parser either accepts RFC 7405''s %s/%i prefixes or it does not'
    status: active
  - id: "rfc-9165#R-0009"
    object: 'CDDL before this document'
    field: 'no BCP 14 keyword backs this; it is an explicit DISCLAIMER OF CAPABILITY in RFC 8610, and under this library''s convention an explicit absence is recorded as a requirement because what the language declines to do is as load-bearing as what it does'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2"
    text: 'CDDL as defined in [RFC8610] does not have any mechanisms to compute literals.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'decidable against RFC 8610''s own operator set: none of its fourteen computes a value'
    status: active
  - id: "rfc-9165#R-0010"
    object: 'the three computed-literal operators'
    field: 'no BCP 14 keyword backs this; the force is the DEFINITIONAL enumeration, and it is the only place the document states that .det dedents BOTH sides'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2"
    text: 'To cover a large part of the use cases, this specification adds three control operators: .plus for numeric addition, .cat for string concatenation, and .det for string concatenation with dedenting of both sides (target and controller).'
    kind: inferred
    testable: 'yes'
    testable_reason: 'a tool either provides all three or it does not'
    status: active
  - id: "rfc-9165#R-0011"
    object: 'the operands of every control operator'
    field: 'no BCP 14 keyword backs this; the force is a MATCHING RULE stated as fact, and it is the single most consequential sentence in the document for us: operands are TYPES IN THE SPECIFICATION, not values in the instance, so no operator here can reach another member of the same map'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2"
    text: 'For these operators, as with all control operators, targets and controllers are types.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'decidable from the specification: an operand is a type expression'
    status: active
  - id: "rfc-9165#R-0012"
    object: 'the type produced by a computed-literal operator'
    field: 'no BCP 14 keyword backs this; the force is a MATCHING RULE - the result is the image of the whole cross-product, so a non-singleton operand yields a non-singleton result'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2"
    text: 'The resulting type is therefore formally a function of the elements of the cross-product of the two types.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'decidable from the specification, and checkable against an instance once the result set is enumerated'
    status: active
  - id: "rfc-9165#R-0013"
    object: 'a tool''s support for non-singleton operands'
    field: 'no BCP 14 keyword backs this (the "may" is lower case); the force is an explicit CONCESSION OF TOOL VARIANCE. It means the cross-product semantics of R-0012 is not portable, and a specification that relies on it may validate under one tool and fail under another'
    verb: 'may'
    actor: 'CDDL tool implementer'
    locator: "§2"
    text: 'Not all tools may be able to work with non-unique targets or controllers.'
    kind: inferred
    testable: 'no'
    testable_reason: 'the document states a permitted divergence between tools and gives no criterion for either behaviour'
    status: active
  - id: "rfc-9165#R-0014"
    object: 'the motivating case for .plus'
    field: 'no BCP 14 keyword backs this; it states what the operator is FOR, which fixes its intended scope as relative numbering within a specification'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.1"
    text: 'In many cases, numbers are needed relative to a base number in a specification.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of purpose'
    status: active
  - id: "rfc-9165#R-0015"
    object: '.plus'
    field: 'no BCP 14 keyword backs this; the force is the OPERATOR DEFINITION - the predicate is numeric addition of the two operands'' values'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.1"
    text: 'The .plus control identifies a number that is constructed by adding the numeric values of the target and the controller.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'a tool''s computed value is checkable against arithmetic'
    status: active
  - id: "rfc-9165#R-0016"
    object: '.plus target and controller'
    field: 'the MUST is this document''s own, in its own voice, and it is a TYPE ADMISSIBILITY rule on an operand - not an obligation on any actor. Nothing in CDDL''s grammar enforces it: `ctlop = "." id` admits `"x" .plus 1`'
    verb: 'MUST'
    actor: 'CDDL tool implementer'
    locator: "§2.1"
    text: 'The target and controller both MUST be numeric.'
    kind: stated
    testable: 'yes'
    testable_reason: 'statically decidable from the specification alone'
    status: active
  - id: "rfc-9165#R-0017"
    object: '.plus mixed-type result'
    field: 'no BCP 14 keyword backs this; the force is the OPERATOR DEFINITION of the mixed int/float case. Two rules in one sentence: the result takes the TARGET''s type, and float-to-int conversion is FLOOR, not truncation or round-half-even - so -1.5 .plus 0 is -2'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.1"
    text: 'If the target is a floating point number and the controller an integer number, or vice versa, the sum is converted into the type of the target; converting from a floating point number to an integer selects its floor (the largest integer less than or equal to the floating point number, i.e., rounding towards negative infinity).'
    kind: inferred
    testable: 'yes'
    testable_reason: 'statically decidable, and the floor rule is directly testable'
    status: active
  - id: "rfc-9165#R-0018"
    object: 'Figure 1''s interval group'
    field: 'no BCP 14 keyword backs this; the force is the worked reading of the example, which is the document''s only statement of the intended idiom'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.1"
    text: 'The example in Figure 1 contains the generic definition of a CDDL group interval that gives a lower and upper bound and, optionally, a tolerance.'
    kind: inferred
    testable: 'no'
    testable_reason: 'an explanation of an example'
    status: active
  - id: "rfc-9165#R-0019"
    object: 'the generic parameter as the .plus operand'
    field: 'no BCP 14 keyword backs this; the force is the stated mechanism, and it is the exact boundary of .plus''s power - the computation runs over a GENERIC PARAMETER bound at instantiation, i.e. at specification-expansion time, not over any value in the instance'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.1"
    text: 'The parameter BASE allows the non-conflicting use of a multiple of these interval groups in one map by assigning different labels to the entries of the interval.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'decidable from the specification: the operand is a parameter, resolved before matching'
    status: active
  - id: "rfc-9165#R-0020"
    object: 'Figure 1''s rect map'
    field: 'no BCP 14 keyword backs this; the force is the worked reading, which shows that what .plus computes here are MAP LABELS (keys), not constraints between map values'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.1"
    text: 'The rule rect combines two of these interval groups into a map, one group for the X dimension (using 0, 1, and 2 as labels) and one for the Y dimension (using 3, 4, and 5 as labels).'
    kind: inferred
    testable: 'yes'
    testable_reason: 'the six labels 0,1,2,3,4,5 are checkable against an instance'
    status: active
  - id: "rfc-9165#R-0021"
    object: 'the motivating case for .cat'
    field: 'no BCP 14 keyword backs this; it states what the operator is for'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.2"
    text: 'It is often useful to be able to compose string literals out of component literals defined in different places in the specification.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of purpose'
    status: active
  - id: "rfc-9165#R-0022"
    object: '.cat'
    field: 'no BCP 14 keyword backs this; the force is the OPERATOR DEFINITION - the predicate is concatenation of the two operands'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.2"
    text: 'The .cat control identifies a string that is built from a concatenation of the target and the controller.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'the computed string is checkable'
    status: active
  - id: "rfc-9165#R-0023"
    object: '.cat target and controller'
    field: 'the MUST is this document''s own and is a TYPE ADMISSIBILITY rule on an operand. Note what it does NOT say: it does not require the two to be the SAME string type, and R-0025 then makes mixing well defined'
    verb: 'MUST'
    actor: 'CDDL tool implementer'
    locator: "§2.2"
    text: 'The target and controller both MUST be strings.'
    kind: stated
    testable: 'yes'
    testable_reason: 'statically decidable from the specification alone'
    status: active
  - id: "rfc-9165#R-0024"
    object: 'the type of a .cat result'
    field: 'no BCP 14 keyword backs this; the force is the OPERATOR DEFINITION of the result type. It is the rule that makes the operator asymmetric: `"a" .cat ''b''` is a TEXT string and `''a'' .cat "b"` is a BYTE string'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.2"
    text: 'The result of the operation has the same type as the target.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'statically decidable from the specification alone'
    status: active
  - id: "rfc-9165#R-0025"
    object: 'the .cat operation'
    field: 'no BCP 14 keyword backs this; the force is the OPERATOR DEFINITION. Concatenation is at the BYTE level, not the code-point level, which is what makes mixing a text and a byte operand meaningful at all - and what makes R-0026 necessary'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.2"
    text: 'The concatenation is performed on the bytes in both strings.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'byte-level comparison is exact'
    status: active
  - id: "rfc-9165#R-0026"
    object: 'a .cat result whose target is a text string'
    field: 'the MUST is this document''s own. It is a WELL-FORMEDNESS condition on a computed value, and it is the one place where byte-level concatenation can produce something the CDDL data model has no room for - two valid UTF-8 operands can be spliced into an invalid sequence only by cutting a multi-byte sequence, which byte concatenation of two complete strings cannot do; the condition therefore bites when an operand is a byte string holding non-UTF-8 bytes'
    verb: 'MUST'
    actor: 'CDDL tool implementer'
    locator: "§2.2"
    text: 'If the target is a text string, the result of that concatenation MUST be valid UTF-8.'
    kind: stated
    testable: 'yes'
    testable_reason: 'UTF-8 validity of the computed result is mechanically decidable'
    status: active
  - id: "rfc-9165#R-0027"
    object: 'Figure 2'
    field: 'no BCP 14 keyword backs this; the force is the worked reading, and it is the document''s own confirmation of R-0024: the result is a TEXT string because the target is'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.2"
    text: 'The example in Figure 2 builds a text string named c from concatenating the target text string "foo" and the controller byte string entered in a text form byte string literal.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'the type of c is decidable from the specification'
    status: active
  - id: "rfc-9165#R-0028"
    object: 'the text-in-byte-string idiom'
    field: 'no BCP 14 keyword backs this (the "may" is lower case); the force is the stated rationale - the byte-string literal exists here as a READABLE spelling for multi-line text, which is why Figure 4 spells a text-string result in byte-string notation'
    verb: 'may'
    actor: 'CDDL specification author'
    locator: "§2.2"
    text: '(This particular idiom is useful when the text string contains newlines, which, as shown in the example for b, may be harder to read when entered in the format that the pure CDDL text string notation inherits from JSON.)'
    kind: inferred
    testable: 'no'
    testable_reason: 'a readability rationale'
    status: active
  - id: "rfc-9165#R-0029"
    object: 'multi-line string literals used as an operand'
    field: 'no BCP 14 keyword backs this; the force is the lower-case force-word "need to", and it is the document''s statement of WHY .det exists - embedded ABNF is unusable unless it is flush left'
    verb: 'need to'
    actor: 'CDDL specification author'
    locator: "§2.3"
    text: 'Multi-line string literals for various applications, including embedded ABNF (Section 3), need to be set flush left, at least partially.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'whether a controller string is flush left is decidable'
    status: active
  - id: "rfc-9165#R-0030"
    object: 'indentation in a CDDL source file'
    field: 'no BCP 14 keyword backs this; a readability rationale that states the tension .det resolves'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.3"
    text: 'Often, having some indentation in the source code for the literal can promote readability, as in Figure 3.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a readability rationale'
    status: active
  - id: "rfc-9165#R-0031"
    object: '.det'
    field: 'no BCP 14 keyword backs this; the force is the OPERATOR DEFINITION, given by DELTA from .cat. "works like .cat" inherits R-0023 (both operands strings), R-0024 (result takes the target''s type), R-0025 (byte-level) and R-0026 (UTF-8 validity); "independently" means each operand''s own minimum indent is computed separately'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'The control operator .det works like .cat, except that both arguments (target and controller) are independently _dedented_ before the concatenation takes place.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'the computed string is checkable, and the independence is observable'
    status: active
  - id: "rfc-9165#R-0032"
    object: 'Figure 3''s first rule'
    field: 'no BCP 14 keyword backs this; the force is an asserted EQUIVALENCE between two figures, which is the document''s only worked demonstration of .det and is captured as a vector pair'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'For the first rule in Figure 3, the result is equivalent to Figure 4.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'the equivalence is mechanically checkable by applying R-0034 and R-0035'
    status: active
  - id: "rfc-9165#R-0033"
    object: 'the term dedenting'
    field: 'no BCP 14 keyword backs this; the force is a DEFINITION, scoped explicitly to this specification, whose two steps are R-0034 and R-0035'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'For the purposes of this specification, we define "dedenting" as:'
    kind: inferred
    testable: 'no'
    testable_reason: 'the definition''s content is in the two steps'
    status: active
  - id: "rfc-9165#R-0034"
    object: 'step 1 of dedenting'
    field: 'no BCP 14 keyword backs this; the force is the ALGORITHM. Three things are pinned: the minimum is over NON-BLANK lines only, "blank space" is parenthesised as LEADING SPACE CHARACTERS, and therefore a horizontal tab is not blank space here - which is consistent with RFC 8610''s grammar, where SP = %x20 and no tab exists anywhere in CDDL'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'determining the smallest amount of leftmost blank space (number of leading space characters) present in all the non-blank lines, and'
    kind: inferred
    testable: 'yes'
    testable_reason: 'a deterministic computation over the literal'
    status: active
  - id: "rfc-9165#R-0035"
    object: 'step 2 of dedenting'
    field: 'no BCP 14 keyword backs this; the force is the ALGORITHM. "exactly that number" forbids normalising deeper indentation, so relative indentation inside the literal survives - which is what lets an ABNF continuation line stay a continuation line. The blank-line clause is a separate rule: blanks are exempt from the exact count and lose all leading space'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'removing exactly that number of leading space characters from each line. For blank (blank space only or empty) lines, there may be fewer (or no) leading space characters than this amount, in which case all leading space is removed.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'a deterministic computation over the literal'
    status: active
  - id: "rfc-9165#R-0036"
    object: 'dedenting one operand only'
    field: 'no BCP 14 keyword backs this; it states a need the operator set does not serve directly, and R-0037 gives the workaround'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.3"
    text: 'Occasionally, dedenting of only a single item is needed.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of a need'
    status: active
  - id: "rfc-9165#R-0037"
    object: 'the single-item dedent idiom'
    field: 'no BCP 14 keyword backs this; the force is the stated IDIOM, and it is also where the operator set shows a seam: the document offers `"" .det rhs` and `lhs .det ""` in one breath, but by R-0024 the first makes the result a TEXT string whatever rhs was, while the second preserves the target''s type. The two are not interchangeable when rhs is a byte string, and the document does not say so'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.3"
    text: 'This can be achieved by using this operator with an empty string, e.g., "" .det rhs or lhs .det "", which can in turn be combined with a .cat: in the construct lhs .cat ("" .det rhs), only rhs is dedented.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'the result type of each form is statically decidable, so the difference is checkable'
    status: active
  - id: "rfc-9165#R-0038"
    object: 'the motivating case for .abnf'
    field: 'no BCP 14 keyword backs this; it states what the operator is for and names both ABNF documents as the dialect'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§3"
    text: 'Many IETF protocols define allowable values for their text strings in ABNF [RFC5234] [RFC7405].'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of purpose'
    status: active
  - id: "rfc-9165#R-0039"
    object: 'ABNF embedded in a CDDL specification'
    field: 'no BCP 14 keyword backs this; a statement of purpose that fixes the direction of reuse - existing ABNF is brought INTO CDDL, not translated out of it'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§3"
    text: 'It is often desirable to define a text string type in CDDL by employing existing ABNF embedded into the CDDL specification.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of purpose'
    status: active
  - id: "rfc-9165#R-0040"
    object: 'the alternative to .abnf'
    field: 'no BCP 14 keyword backs this; the force is an explicit statement of what CDDL could not do before - and the parenthetical "(if that is even possible)" is the document conceding that the .regexp workaround is not always available, since XSD regular expressions are a regular language and ABNF is not'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§3"
    text: 'Without specific ABNF support in CDDL, that ABNF would usually need to be translated into a regular expression (if that is even possible).'
    kind: inferred
    testable: 'yes'
    testable_reason: 'whether a given ABNF is expressible as an XSD regular expression is decidable in principle'
    status: active
  - id: "rfc-9165#R-0041"
    object: 'the mechanism by which ABNF enters CDDL'
    field: 'no BCP 14 keyword backs this; the force is the statement that this is an ordinary control-operator extension, exactly parallel to RFC 8610 Section 3.8.3''s .regexp - so everything RFC 8610 says about control syntax applies unchanged'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'ABNF is added to CDDL in the same way that regular expressions were added: by defining a .abnf control operator.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of mechanism'
    status: active
  - id: "rfc-9165#R-0042"
    object: '.abnf target and controller'
    field: 'no BCP 14 keyword backs this ("usually" is a hedge, not a rule); the force is the OPERAND DEFINITION, and the hedge matters: the target is not RESTRICTED to text - R-0046 states outright that either string type is admitted'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'The target is usually text or some restriction on it, and the controller is the text of an ABNF specification.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'statically decidable from the specification'
    status: active
  - id: "rfc-9165#R-0043"
    object: 'the four issues of embedding ABNF'
    field: 'no BCP 14 keyword backs this; it is the heading sentence for the four bulleted solutions, each recorded separately below'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'There are several small issues; the solutions are given here:'
    kind: inferred
    testable: 'no'
    testable_reason: 'an introductory sentence'
    status: active
  - id: "rfc-9165#R-0044"
    object: 'what ABNF can describe'
    field: 'no BCP 14 keyword backs this; the force is the stated fact that drives the split into two operators'
    verb: 'can'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'ABNF can be used to define byte sequences as well as UTF-8 text strings interpreted as Unicode scalar sequences.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement about ABNF, not about CDDL'
    status: active
  - id: "rfc-9165#R-0045"
    object: '.abnf and .abnfb'
    field: 'no BCP 14 keyword backs this; the force is the OPERATOR DEFINITION of the pair, and it fixes the ALPHABET each one matches over: bytes for .abnfb, Unicode scalar values for .abnf'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'This means this specification defines two control operators: .abnfb for ABNF denoting byte sequences and .abnf for denoting sequences of Unicode scalar values (code points) represented as UTF-8 text strings.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'which alphabet a tool applies is observable from matching behaviour'
    status: active
  - id: "rfc-9165#R-0046"
    object: 'the target of .abnf and .abnfb'
    field: 'no BCP 14 keyword backs this; the force is the MATCHING RULE. Note the orthogonality it creates: the TARGET''s string type and the OPERATOR''s alphabet are independent, so there are four combinations and the operator - not the target - decides whether the ABNF sees bytes or code points'
    verb: 'can'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'Both control operators can be applied to targets of either string type; the ABNF is applied to the sequence of bytes in the string and interprets it as a sequence of bytes (.abnfb) or as a sequence of code points represented as an UTF-8 text string (.abnf).'
    kind: inferred
    testable: 'yes'
    testable_reason: 'all four target/operator combinations are decidable against an instance'
    status: active
  - id: "rfc-9165#R-0047"
    object: '.abnf and .abnfb controller'
    field: 'the MUST is this document''s own and is a TYPE ADMISSIBILITY rule on an operand. The sentence is tautological as written - "The controller string MUST be a string." - and its work is done by the next sentence, R-0048'
    verb: 'MUST'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'The controller string MUST be a string.'
    kind: stated
    testable: 'yes'
    testable_reason: 'statically decidable from the specification alone'
    status: active
  - id: "rfc-9165#R-0048"
    object: 'a byte-string controller for .abnf or .abnfb'
    field: 'the MUST is this document''s own. It is a WELL-FORMEDNESS condition plus a COERCION: a byte-string controller is not merely permitted, it is REINTERPRETED as the text string with the same bytes, so the ABNF source is always text. This is what makes the byte-string literal spelling of Figures 3, 4, 5 and the .det idiom legitimate'
    verb: 'MUST'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'When a byte string, it MUST be valid UTF-8 and is interpreted as the text string that has the same sequence of bytes.'
    kind: stated
    testable: 'yes'
    testable_reason: 'UTF-8 validity of the controller is mechanically decidable'
    status: active
  - id: "rfc-9165#R-0049"
    object: 'the shape of an ABNF document'
    field: 'no BCP 14 keyword backs this; the force is the statement of the mismatch R-0050 resolves. The parenthetical names RFC 5234''s `elements` production (plural), which is `alternation *c-wsp`'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'ABNF defines a list of rules, not a single expression (called "elements" in [RFC5234]).'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement about ABNF''s own shape'
    status: active
  - id: "rfc-9165#R-0050"
    object: 'the structure of an ABNF controller string'
    field: 'no BCP 14 keyword backs this, but "requiring" is as close as this document comes to an imperative outside its five MUSTs; the force is a STRUCTURAL RULE on the controller - exactly one selector, then a newline, then zero or more rules. Note the production mismatch with R-0049: the parenthetical there names `elements` (= `alternation`), and this sentence requires one valid "element" (singular), which in RFC 5234 is the far narrower `element = rulename / group / option / char-val / num-val / prose-val`'
    verb: 'requiring'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'This is resolved by requiring the controller string to be one valid "element", followed by zero or more valid "rules" separated from the element by a newline; thus, the controller string can be built by preceding a piece of valid ABNF by an "element" that selects from that ABNF and a newline.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'an ABNF parser can decide whether the first line is an `element` and the remainder a `rulelist`'
    status: active
  - id: "rfc-9165#R-0051"
    object: 'newlines in an ABNF controller'
    field: 'no BCP 14 keyword backs this; the force is the stated constraint that drives the whole .cat / .det apparatus - ABNF is line-oriented and CDDL text strings are not'
    verb: 'requires'
    actor: 'CDDL specification author'
    locator: "§3"
    text: 'For the same reason, ABNF requires newlines; specifying newlines in CDDL text strings is tedious (and leads to essentially unreadable ABNF).'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of the constraint being worked around'
    status: active
  - id: "rfc-9165#R-0052"
    object: 'the newline workaround'
    field: 'no BCP 14 keyword backs this; the force is the stated composition - two of this document''s own operators plus RFC 8610''s text-in-byte-string literal, which is a line-spanning literal where a text string literal is not (RFC 8610''s BCHAR admits CRLF, SCHAR does not)'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§3"
    text: 'The workaround employs the .cat operator introduced in Section 2.2 and the syntax for text in byte strings.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of mechanism'
    status: active
  - id: "rfc-9165#R-0053"
    object: 'the newline of the embedded ABNF metalanguage'
    field: 'no BCP 14 keyword backs this; the force is a GRAMMAR REDEFINITION, given as an ABNF production in the document''s own voice. It redefines RFC 5234''s CRLF core rule to admit a bare LF, and the scope is stated precisely - the syntax of ABNF ITSELF, not the syntax expressed in it. RFC 8610 Appendix B makes the identical redefinition for CDDL''s own grammar without declaring it; this document declares it and calls it customary'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§3"
    text: 'As is customary for ABNF, the syntax of ABNF itself (_not_ the syntax expressed in ABNF!) is relaxed to allow a single line feed as a newline: CRLF = %x0A / %x0D.0A'
    kind: inferred
    testable: 'yes'
    testable_reason: 'whether a tool accepts a bare LF between ABNF rules is directly testable'
    status: active
  - id: "rfc-9165#R-0054"
    object: 'shared ABNF rule sets'
    field: 'no BCP 14 keyword backs this; it states the reuse problem R-0055 and R-0056 answer'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§3"
    text: 'One set of rules provided in an ABNF specification is often used in multiple positions, particularly staples such as DIGIT and ALPHA.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of a problem'
    status: active
  - id: "rfc-9165#R-0055"
    object: 'rule closure of an ABNF controller string'
    field: 'no BCP 14 keyword backs this; the force is the lower-case force-word "need to" and it is the strongest operational rule in Section 3: each controller string must be CLOSED. There is no implicit import, so RFC 5234''s core rules - DIGIT, ALPHA, HEXDIG, CRLF, WSP - must be restated in every controller that uses them'
    verb: 'need to'
    actor: 'CDDL specification author'
    locator: "§3"
    text: '(Note that all rules referenced need to be defined in each ABNF operator controller string -- there is no implicit import of core ABNF rules from [RFC5234] or other rules.)'
    kind: inferred
    testable: 'yes'
    testable_reason: 'closure is statically decidable: collect the rulenames referenced and check each is defined in the same controller string'
    status: active
  - id: "rfc-9165#R-0056"
    object: 'composing ABNF rule sets'
    field: 'no BCP 14 keyword backs this; the force is the stated mechanism, and it is the document''s own statement that closure (R-0055) is achieved by CONCATENATION rather than by any import construct'
    verb: 'can'
    actor: 'CDDL specification author'
    locator: "§3"
    text: 'The composition this calls for can be provided by the .cat operator and/or by .det if there is indentation to be disposed of.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'the composed controller''s closure is decidable'
    status: active
  - id: "rfc-9165#R-0057"
    object: 'Figure 5'
    field: 'no BCP 14 keyword backs this; it is the locator anchor for the document''s only full worked example, and it names what the example produces - one CBOR tag from each of two RFCs'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§3"
    text: 'These points are combined into an example in Figure 5, which uses ABNF from [RFC3339] to specify one of each of the Concise Binary Object Representation (CBOR) tags defined in [RFC8943] and [RFC8949].'
    kind: inferred
    testable: 'yes'
    testable_reason: 'Figure 5''s two tag definitions are checkable against instances'
    status: active
  - id: "rfc-9165#R-0058"
    object: 'the outcome of CDDL validation before .feature'
    field: 'no BCP 14 keyword backs this; the force is the statement of the BASELINE VALIDATION MODEL that .feature changes - two outcomes'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§4"
    text: 'Commonly, the kind of validation enabled by languages such as CDDL provides a Boolean result: valid or invalid.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'a tool''s outcome set is observable'
    status: active
  - id: "rfc-9165#R-0059"
    object: 'the two-outcome validation model'
    field: 'no BCP 14 keyword backs this; it is the document''s own verdict on the baseline and the premise for .feature'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§4"
    text: 'In rapidly evolving environments, this is too simplistic.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a judgement, not a criterion'
    status: active
  - id: "rfc-9165#R-0060"
    object: 'extension points in a CDDL specification'
    field: 'no BCP 14 keyword backs this (the "may" is lower case); the force is the stated GOAL, and it names the three things .feature must do at once - identify the extension point, accept the extension, and mark it'
    verb: 'may'
    actor: 'CDDL specification author'
    locator: "§4"
    text: 'The data models described by a CDDL specification may continually be enhanced by additional features, and it would be useful even for a specification that does not yet describe a specific future feature to identify the extension point the feature can use and accept such extensions while marking them as extensions.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'whether a tool marks rather than rejects is observable'
    status: active
  - id: "rfc-9165#R-0061"
    object: '.feature'
    field: 'no BCP 14 keyword backs this; the force is the OPERATOR DEFINITION - and it is unlike every other operator in CDDL, because it constrains NOTHING. The target''s matching is unchanged; the operator only attaches a name to it'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§4"
    text: 'The .feature control annotates the target as making use of the feature named by the controller.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'the annotation is observable in a tool''s output'
    status: active
  - id: "rfc-9165#R-0062"
    object: 'the .feature controller'
    field: 'no BCP 14 keyword backs this; "will usually" is a hedge and NOT a type admissibility rule - which makes .feature the only operator in this document whose controller type is left open. R-0066 then gives the array form, so at least two controller shapes are intended'
    verb: 'will usually'
    actor: 'CDDL tool implementer'
    locator: "§4"
    text: 'The latter will usually be a string.'
    kind: inferred
    testable: 'no'
    testable_reason: 'the document states no admissibility rule, so there is nothing to decide against'
    status: active
  - id: "rfc-9165#R-0063"
    object: 'a validating tool''s output'
    field: 'no BCP 14 keyword backs this (the "may" is lower case); the force is a PERMISSION on tool behaviour, and the permission is the whole of .feature''s semantics. A tool that ignores .feature entirely is conformant'
    verb: 'may'
    actor: 'CDDL tool implementer'
    locator: "§4"
    text: 'A tool that validates an instance against that specification may mark the instance as using a feature that is annotated by the specification.'
    kind: inferred
    testable: 'no'
    testable_reason: 'the document permits both behaviours and gives no criterion for choosing'
    status: active
  - id: "rfc-9165#R-0064"
    object: 'the mapping of operands onto diagnostic output'
    field: 'no BCP 14 keyword backs this ("might" is a hedge); the force is the stated CORRESPONDENCE - controller to feature NAME, target to feature DETAIL. THE SPAN STOPS MID-SENTENCE AND DELIBERATELY SO: the token `left-hand` is SEVERED BY HYPHENATION at the line break between source lines 370 and 371, which the source sets as `...and the target (left-` then `hand side) as a feature detail.` - and because whitespace normalisation turns that into `(left- hand side)`, the healed form `(left-hand side)` is NOT this document''s bytes and is therefore not written anywhere in this record. Under docs/extraction.md a token cut by a line break cannot be quoted whole, so this entry quotes the obligation-bearing half only. The dropped half, in OUR words and not the document''s: the target supplies the feature detail as the controller supplies the feature name. This is the ONLY hyphenation break in the whole of RFC 9165'
    verb: 'might'
    actor: 'CDDL tool implementer'
    locator: "§4"
    text: 'More specifically, the tool''s diagnostic output might contain the controller (right-hand side) as a feature name'
    kind: inferred
    testable: 'no'
    testable_reason: 'a hedged description of diagnostic output; no outcome is required'
    status: active
  - id: "rfc-9165#R-0065"
    object: 'an over-detailed .feature target'
    field: 'no BCP 14 keyword backs this; it states the problem the array controller form solves'
    verb: 'might'
    actor: 'CDDL specification author'
    locator: "§4"
    text: 'However, in some cases, the target has too much detail, and the specification might want to hint to the tool that more limited detail is appropriate.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of a problem'
    status: active
  - id: "rfc-9165#R-0066"
    object: 'the array form of the .feature controller'
    field: 'no BCP 14 keyword backs this - "should" is LOWER CASE and is this document''s only lower-case should outside Section 6; the force is a STRUCTURAL RULE on the controller: a two-element array, [name, detail]. Note that this makes the controller''s SHAPE semantic, which no other control operator in CDDL does'
    verb: 'should'
    actor: 'CDDL specification author'
    locator: "§4"
    text: 'In this case, the controller should be an array, with the first element being the feature name (that would otherwise be the entire controller) and the second element being the detail (usually another string), as illustrated in Figure 6.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'the controller''s arity and element order are statically decidable'
    status: active
  - id: "rfc-9165#R-0067"
    object: 'Figure 7'
    field: 'no BCP 14 keyword backs this; it is the locator anchor for the map-extensibility idiom. THE SPAN STOPS BEFORE the rule name `further-person-extension`, which the source sets on the next line; the span is contiguous and ends at a word boundary, so nothing is severed - the name itself is carried verbatim in the Figure 7 block in normative.md and in vector V-0012'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§4"
    text: 'Figure 7 shows what could be the definition of a person, with potential extensions beyond name and organization being marked'
    kind: inferred
    testable: 'no'
    testable_reason: 'an explanation of an example'
    status: active
  - id: "rfc-9165#R-0068"
    object: 'known extensions'
    field: 'no BCP 14 keyword backs this; the force is the stated idiom, and it pairs RFC 8610''s socket/plug convention with this document''s .feature - the socket carries the KNOWN extensions and .feature marks the UNKNOWN ones'
    verb: 'can'
    actor: 'CDDL specification author'
    locator: "§4"
    text: 'Extensions that are known at the time this definition is written can be collected into $$person-extensions.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'decidable from the specification: a socket name versus a .feature-annotated wildcard'
    status: active
  - id: "rfc-9165#R-0069"
    object: 'a map with no wildcard entry'
    field: 'no BCP 14 keyword backs this; the force is a stated CONSEQUENCE, and it is the sharp limit of .feature: the operator marks an extension point but does not create one. RFC 8610''s map matching is exhaustive in both directions, so without `* ... => any` the extension is simply invalid'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§4"
    text: 'However, future extensions would be deemed invalid unless the wildcard at the end of the map is added.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'directly testable: the same instance against the schema with and without the wildcard'
    status: active
  - id: "rfc-9165#R-0070"
    object: 'the consumer of a feature annotation'
    field: 'no BCP 14 keyword backs this; the force is the stated downstream use, and it names the one consumer the mechanism actually has - a USER or a tool that reads the validation result, not the validator itself'
    verb: 'could'
    actor: 'CDDL tool implementer'
    locator: "§4"
    text: 'These extensions could then be specifically examined by a user or a tool that makes use of the validation result; the label (map key) actually used makes a fine feature detail for the tool''s diagnostic output.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a hedged statement about downstream consumers'
    status: active
  - id: "rfc-9165#R-0071"
    object: 'a schema with no extension point'
    field: 'no BCP 14 keyword backs this; the force is a stated CONSEQUENCE and it is half of the two-sided argument for .feature'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§4"
    text: 'Leaving out the entire extension point would mean that instances that make use of an extension would be marked as wholesale invalid, making the entire validation approach much less useful.'
    kind: inferred
    testable: 'yes'
    testable_reason: 'testable: an extended instance against a closed schema'
    status: active
  - id: "rfc-9165#R-0072"
    object: 'an unmarked extension point'
    field: 'no BCP 14 keyword backs this; the force is a stated CONSEQUENCE and it is the other half of the argument. The example given is a TYPO becoming silently valid, which is exactly the failure mode a wildcard introduces'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§4"
    text: 'Leaving the extension point in but not marking its use as special would render mistakes (such as using the label "organisation" instead of "organization") invisible.'
