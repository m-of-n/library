  - id: "rfc-9165#R-0074"
    object: 'the minimal .feature behaviour'
    field: 'no BCP 14 keyword backs this (the "may" is lower case); the force is a PERMISSION, and it names the one party outside the tool this document ever mentions - "the process requesting the validation". That is the closest this document comes to a role, and it is still a single-party tool invocation, not an exchange'
    verb: 'may'
    actor: 'CDDL tool implementer'
