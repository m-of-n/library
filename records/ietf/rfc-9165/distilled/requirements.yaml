reconciliation: 'RFC 9165 contains exactly FIVE all-capitals BCP 14 keyword occurrences in 23 KB - source lines 141, 179, 182, 279 and 280 - and bin/bcp14-count reports 5. All five are the bare keyword MUST; the document uses no SHOULD, no MAY, no SHALL and no negative form anywhere outside the Section 1.1 boilerplate. That is expected and correct, and it is not a thin document. THIS IS A GRAMMAR EXTENSION. It adds six entries to CDDL''s one declared extension point, and like RFC 8610 itself its normativity is carried by OPERATOR DEFINITIONS AND MATCHING RULES, not by obligations laid on an actor. A document that says what `.cat` MEANS has almost no occasion to say that somebody MUST do something. WHAT THE FIVE ARE, so that the baseline is not mistaken for weakness: every one of the five is a TYPE ADMISSIBILITY OR WELL-FORMEDNESS RULE ON AN OPERAND, and not one is an obligation on a tool, an author, a registrant or any other actor. R-0016 (both .plus operands numeric) and R-0023 (both .cat operands strings) admit operand types; R-0026 (a text-targeted .cat result must be valid UTF-8) and R-0048 (a byte-string controller must be valid UTF-8) are well-formedness conditions on a computed or coerced string; and R-0047 ("The controller string MUST be a string") is tautological as written and does its real work only through R-0048, the sentence that follows it. Four of the five are statically decidable from a specification alone; none needs an instance. WHAT WAS COUNTED INSTEAD, and extracted here as kind: inferred: (a) every OPERATOR DEFINITION - the predicate, the operand types and the result type of .plus, .cat, .det, .abnf, .abnfb and .feature (Sections 2.1, 2.2, 2.3, 3, 4); (b) the two STATED ALGORITHMS, dedenting''s two numbered steps (Section 2.3) and the structure of an ABNF controller string as one `element` plus a rule-list (Section 3); (c) the GRAMMAR REDEFINITION `CRLF = %x0A / %x0D.0A`, which is given as an ABNF production in the document''s own voice (Section 3); (d) the SECTION 2 TYPE-THEORETIC FRAME - that targets and controllers are types and the result is a function of their cross-product - which is the most consequential statement in the document for us, because it places every computation at specification-expansion time and therefore out of reach of any value in an instance; (e) every explicit DISCLAIMER OF CAPABILITY, of which this document has three: that CDDL has no mechanism to compute literals at all (Section 2), that ABNF would otherwise have to be translated into a regular expression "(if that is even possible)" (Section 3), and - the sharpest - that "The language currently has no way to enforce mutually exclusive use of features, as would be needed in this example." (Section 4), which concedes that the document''s own last example cannot be made correct; (f) the IANA REGISTRATION of Table 2, stated in the past tense; and (g) the lower-case force-words the document does use: "need to" (Sections 2.3 and 3), "requiring" (Section 3), "should" (Sections 4 and 6), "requires" (Section 3), and the hedges "usually", "will usually", "may", "might", "can" and "could", each reproduced in the entry''s `verb` rather than strengthened. Each inferred entry names in its `field` the phrase, matching rule, algorithm step or stated absence that carries the force, and says that no BCP 14 keyword backs it. No obligation was invented and no count was inflated. SOURCE AND EXTRACTION AGREE AT 5: the five stated entries are R-0016 (Section 2.1), R-0023 and R-0026 (Section 2.2), and R-0047 and R-0048 (Section 3), carrying one MUST each. The Section 1.1 BCP 14 boilerplate is deliberately NOT quoted in any entry and not in normative.md either: bin/validate counts requirement texts with boilerplate stripping OFF, so quoting it would add 11 phantom keywords and the two counts would disagree by exactly that. ONE TOKEN IN THIS DOCUMENT IS SEVERED BY HYPHENATION at a line break - `left-` / `hand` at source lines 370/371 - and R-0064 stops before it and says so in its `field`. It is the only such break in the document, and nothing was silently healed. There are no form feeds, no page markers and no running header or footer in this source, so unlike RFC 8610 and RFC 8949 no span here crosses a page frame.'
