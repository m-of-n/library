    verb: 'could'
    actor: 'CDDL specification author'
    locator: "§4"
    text: 'The latter approach could, for instance, be used for a JSON/CBOR switch, as illustrated in Figure 9, using Sensor Measurement Lists (SenML) [RFC8428] as the example data model used with both JSON and CBOR.'
