# =====================================================================
# rfc-9165 test vectors -- every example RFC 9165 prints, plus the
# controller strings its own operators compute from them.
#
# Each `cddl:` and `abnf:` block is lifted from the cached source by line
# range, by script, never retyped; the only transformation is removal of
# the common left margin, which a YAML block scalar does in any case.
# Relative indentation inside a block, the RFC's own comments and the
# RFC's own spelling are the source's.
#
# PROVENANCE IS EXPLICIT PER VECTOR, because four of the eighteen are not
# printed anywhere in the document:
#   SOURCE CDDL / SOURCE ABNF / SOURCE PROSE -- the document's own bytes.
#   COMPUTED BY US -- produced by applying the document's OWN rules
#     (Section 2.3's two-step dedent, Section 2.2's concatenation) to
#     source line ranges. V-0005, V-0011, V-0012. These are the strings a
#     tool must actually produce, and the source computes only one of
#     them (Figure 4) and stops.
#   OURS -- an instance we wrote to exhibit a defect the SOURCE states in
#     its own words. V-0018 only, and its `notes` say so.
#
# Anything marked OURS or CHECKED BY SCRIPT is this library's reading or
# arithmetic, not the document's.
#
# Source: RFC 9165, cached source sha256
#   94f86116c04fde0f11d54576465181090ec33983d78db82527c0703a41976774
# =====================================================================
record: rfc-9165
reviewed_by: ""
vectors:
  - id: 'rfc-9165#V-0001'
    locator: '§2.1 (Figure 1)'
    cddl: |
      interval<BASE> = (
        BASE => int             ; lower bound
        (BASE .plus 1) => int   ; upper bound
        ? (BASE .plus 2) => int ; tolerance
      )

      X = 0
      Y = 3
      rect = {
        interval<X>
        interval<Y>
      }
    matches: 'A map with six integer-labelled entries: four required (0, 1, 3, 4) and two optional (2, 5), each valued `int`.'
    expect: 'valid'
    provenance: 'SOURCE CDDL (lines 148-159).'
    notes: 'The document''s .plus example, and its only one. The source states the label assignment: "The rule rect combines two of these interval groups into a map, one group for the X dimension (using 0, 1, and 2 as labels) and one for the Y dimension (using 3, 4, and 5 as labels)." No instance is printed. OURS: the label set {0,1,2,3,4,5} is arithmetic the source states, not an instance we invented, and it is the whole observable effect of .plus here. OURS: note what is computed -- MAP LABELS from a GENERIC PARAMETER bound at instantiation, never a relation between two values in the instance. See ../schema/control-operators.derived.yaml, cross_field_constraints.'
  - id: 'rfc-9165#V-0002'
    locator: '§2.2 (Figure 2)'
    cddl: |
      c = "foo" .cat '
        bar
        baz
      '
      ; on a system where the newline is \n, is the same string as:
      b = "foo\n  bar\n  baz\n"
    matches: 'Two rules the source asserts denote the same text string. `c` is computed with .cat; `b` is the same string written as a JSON-style text literal.'
    equivalence: 'c == b, asserted by the source'
    expect: 'valid'
    provenance: 'SOURCE CDDL (lines 184-189), including the source''s own comment line.'
    notes: 'The source''s own equivalence claim is in the comment, not in prose: "; on a system where the newline is \n, is the same string as:". The explanation confirms the result type: "The example in Figure 2 builds a text string named c from concatenating the target text string "foo" and the controller byte string entered in a text form byte string literal." OURS, AND IT IS A REAL CAVEAT: the equality is CONDITIONAL ON THE SOURCE FILE''S LINE ENDINGS. RFC 8610''s BCHAR admits `CRLF = %x0A / %x0D.0A`, so the literal carries whatever bytes the file has; under CRLF line endings `c` is "foo\r\n  bar\r\n  baz\r\n" and the asserted equality fails. The document flags this in a code comment and nowhere in its normative text. OURS: the two-space indent survives because this is .cat, not .det -- contrast V-0003/V-0004.'
  - id: 'rfc-9165#V-0003'
    locator: '§2.3 (Figure 3)'
    cddl: |
      oid = bytes .abnfb ("oid" .det cbor-tags-oid)
      roid = bytes .abnfb ("roid" .det cbor-tags-oid)

      cbor-tags-oid = '
        oid = 1*arc
        roid = *arc
        arc = [nlsb] %x00-7f
        nlsb = %x81-ff *%x80-ff
      '
    matches: 'A byte string whose bytes are an OID or relative-OID per the embedded ABNF, selected by the `oid` / `roid` element.'
    expect: 'valid'
    provenance: 'SOURCE CDDL (lines 207-215).'
    notes: 'The .det composition the document introduces the operator for. Two rules share one controller rule-list, differing only in the selector element. OURS, CHECKED BY SCRIPT: the dedented rule-list is rule-closed -- 4 rules, 0 undefined, closed from both `oid` and `roid` -- so Section 3''s closure rule (rfc-9165#R-0055) is satisfied with no core-rule import. OURS: `%x00-7f`, `%x81-ff` and `%x80-ff` use lower-case hex, which is valid because RFC 5234''s HEXDIG is built from case-insensitive quoted strings.'
  - id: 'rfc-9165#V-0004'
    locator: '§2.3 (Figure 4)'
    cddl: |
      oid = bytes .abnfb 'oid
      oid = 1*arc
      roid = *arc
      arc = [nlsb] %x00-7f
      nlsb = %x81-ff *%x80-ff
      '
    matches: 'The same type as V-0003''s first rule. This is the SOURCE''s own rendering of the computed result.'
    equivalence: 'equal to V-0003''s `oid` rule, asserted by the source'
    expect: 'valid'
    provenance: 'SOURCE CDDL (lines 225-230).'
    notes: 'The source asserts the equivalence: "For the first rule in Figure 3, the result is equivalent to Figure 4." OURS, CHECKED: applying the document''s own two-step dedent to lines 211-214 and concatenating per Section 2.2 reproduces this figure''s literal content exactly. OURS, THE CONDITION ON THAT CHECK, re-derived and made explicit by the verify pass: the equality holds ONLY AFTER THE RFC''S THREE-COLUMN BODY MARGIN IS REMOVED FROM FIGURE 4 AS WELL AS FROM FIGURE 3. Compared as printed bytes the two differ: a dedent''s result is FLUSH LEFT by construction, whereas Figure 4 is printed inside an RFC body and so carries three spaces on every rule line. Dedenting is margin-invariant in its OPERAND, which is what makes Figure 3 a correct example; it is not margin-invariant in its RESULT, so Figure 4 as it sits on the page is not literally its own answer. Not a defect -- a figure in an RFC cannot be flush left -- but the direction of the check matters, and it is what makes this vector a test of our reading of the algorithm rather than of our arithmetic. OURS, A NOTATIONAL DISCREPANCY, reported not repaired: Figure 4 spells the result as a BYTE string literal, but Section 2.2''s result rule -- inherited by .det through "works like .cat" -- makes the result of `"oid" .det cbor-tags-oid` a TEXT string, because the target `"oid"` is a text string. The two are interchangeable as an .abnfb controller, since rfc-9165#R-0048 admits either and coerces a byte string to text, so the figure is equivalent in EFFECT and not in TYPE.'
  - id: 'rfc-9165#V-0005'
    locator: '§2.3 (Figure 3, second rule)'
    cddl: |
      roid
      oid = 1*arc
      roid = *arc
      arc = [nlsb] %x00-7f
      nlsb = %x81-ff *%x80-ff
    matches: 'The controller string of V-0003''s `roid` rule, after .det.'
    expect: 'valid'
    provenance: 'COMPUTED BY US. Not printed in the source. Produced by applying Section 2.3''s dedent to source lines 211-214 and concatenating per Section 2.2, exactly as the source did for the first rule in Figure 4.'
    notes: 'The source computes Figure 3''s FIRST rule and stops. This is the second, by the same two rules, and it is a fixture a tool must produce. OURS, CHECKED: closed from `roid`, 4 rules, 0 undefined. The only difference from V-0004 is the selector line.'
  - id: 'rfc-9165#V-0006'
    locator: '§2.3 (prose)'
    cddl: '"" .det rhs'
    matches: '`rhs`, dedented, AS A TEXT STRING whatever `rhs`''s own type was.'
    expect: 'valid'
    provenance: 'SOURCE CDDL, quoted in running prose (lines 249-252), not in a figure.'
    notes: 'One of the two single-item dedent forms the source offers in one sentence: "This can be achieved by using this operator with an empty string, e.g., "" .det rhs or lhs .det "", which can in turn be combined with a .cat: in the construct lhs .cat ("" .det rhs), only rhs is dedented." OURS: this form forces the result to TEXT, by Section 2.2''s result rule, and so drags in the UTF-8 MUST (rfc-9165#R-0026). Contrast V-0007.'
  - id: 'rfc-9165#V-0007'
    locator: '§2.3 (prose)'
    cddl: 'lhs .det ""'
    matches: '`lhs`, dedented, IN ITS OWN STRING TYPE.'
    expect: 'valid'
    provenance: 'SOURCE CDDL, quoted in running prose (lines 249-252).'
    notes: 'The other single-item form from the same sentence. OURS, AND THE SOURCE DOES NOT SAY IT: V-0006 and V-0007 are presented as alternatives but are not interchangeable. This one preserves the operand''s type and so does not invoke the UTF-8 MUST; V-0006 yields text and does. For an ABNF controller the difference is moot, because rfc-9165#R-0048 demands UTF-8 of a byte-string controller anyway; for .det on any other binary data it is a real divergence.'
  - id: 'rfc-9165#V-0008'
    locator: '§2.3 (prose)'
    cddl: 'lhs .cat ("" .det rhs)'
    matches: '`lhs` concatenated with a dedented `rhs`; `lhs`''s own indentation is untouched.'
    expect: 'valid'
    provenance: 'SOURCE CDDL, quoted in running prose (lines 249-252).'
    notes: 'The source''s own reading: "in the construct lhs .cat ("" .det rhs), only rhs is dedented." OURS: this is also direct evidence for rfc-8610''s G-44. The inner control is PARENTHESISED, because `type1` admits at most one range-or-control operator and `lhs .cat "" .det rhs` does not parse. The source never states that rule and obeys it here.'
  - id: 'rfc-9165#V-0009'
    locator: '§3'
    abnf: 'CRLF = %x0A / %x0D.0A'
    matches: 'A newline in the EMBEDDED ABNF''s own syntax: either a bare LF or a CRLF pair.'
    expect: 'valid'
    provenance: 'SOURCE ABNF (line 298). The document''s own production, in its own voice -- not an example.'
    notes: 'Scoped by the sentence that introduces it: "As is customary for ABNF, the syntax of ABNF itself (_not_ the syntax expressed in ABNF!) is relaxed to allow a single line feed as a newline". OURS: this REDEFINES RFC 5234''s CRLF core rule, whose own definition is `%x0D %x0A` and admits no bare LF. RFC 8610 Appendix B makes the identical redefinition for CDDL''s own grammar and does NOT declare it -- recorded as a source defect in rfc-8610''s own extraction. RFC 9165 makes the same change, declares it, scopes it, and calls it customary. So the substance of that rfc-8610 defect is deliberate community practice; what remains defective there is that it is undeclared.'
  - id: 'rfc-9165#V-0010'
    locator: '§3 (Figure 5)'
    cddl: |
      ; for RFC 8943
      Tag1004 = #6.1004(text .abnf full-date)
      ; for RFC 8949
      Tag0 = #6.0(text .abnf date-time)

      full-date = "full-date" .cat rfc3339
      date-time = "date-time" .cat rfc3339

      ; Note the trick of idiomatically starting with a newline, separating
      ;   off the element in the concatenations above from the rule-list
      rfc3339 = '
         date-fullyear   = 4DIGIT
         date-month      = 2DIGIT  ; 01-12
         date-mday       = 2DIGIT  ; 01-28, 01-29, 01-30, 01-31 based on
                                   ; month/year
         time-hour       = 2DIGIT  ; 00-23
         time-minute     = 2DIGIT  ; 00-59
         time-second     = 2DIGIT  ; 00-58, 00-59, 00-60 based on leap sec
                                   ; rules
         time-secfrac    = "." 1*DIGIT
         time-numoffset  = ("+" / "-") time-hour ":" time-minute
         time-offset     = "Z" / time-numoffset

         partial-time    = time-hour ":" time-minute ":" time-second
                           [time-secfrac]
         full-date       = date-fullyear "-" date-month "-" date-mday
         full-time       = partial-time time-offset

         date-time       = full-date "T" full-time
      ' .det rfc5234-core

      rfc5234-core = '
         DIGIT          =  %x30-39 ; 0-9
         ; abbreviated here
      '
    matches: 'CBOR tag 1004 wrapping an RFC 3339 full-date text string, and CBOR tag 0 wrapping an RFC 3339 date-time text string.'
    sub_definitions: 'Tag1004 = #6.1004(text .abnf full-date)  /  Tag0 = #6.0(text .abnf date-time)'
    expect: 'valid'
    provenance: 'SOURCE CDDL (lines 312-346).'
    notes: 'The document''s only full worked example and the only place .abnf, .cat and .det compose. OURS, CHECKED BY SCRIPT: the composed controller is rule-closed -- 14 rules (13 from rfc3339 plus DIGIT from rfc5234-core), 0 undefined, closed from both `full-date` (4 rules reachable) and `date-time` (all 14) -- so closure holds ACROSS the .det join, and the "; abbreviated here" elision of rfc5234-core breaks nothing because nothing in rfc3339 references a core rule other than DIGIT. OURS: composition here is by NAMED INTERMEDIATE RULE (`rfc3339`) rather than by parentheses, which is the second way around the one-control-per-type1 limit (G-44).'
  - id: 'rfc-9165#V-0011'
    locator: '§3 (Figure 5, computed)'
    abnf: |
      date-time
      date-fullyear   = 4DIGIT
      date-month      = 2DIGIT  ; 01-12
      date-mday       = 2DIGIT  ; 01-28, 01-29, 01-30, 01-31 based on
                                ; month/year
      time-hour       = 2DIGIT  ; 00-23
      time-minute     = 2DIGIT  ; 00-59
      time-second     = 2DIGIT  ; 00-58, 00-59, 00-60 based on leap sec
                                ; rules
      time-secfrac    = "." 1*DIGIT
      time-numoffset  = ("+" / "-") time-hour ":" time-minute
      time-offset     = "Z" / time-numoffset

      partial-time    = time-hour ":" time-minute ":" time-second
                        [time-secfrac]
      full-date       = date-fullyear "-" date-month "-" date-mday
      full-time       = partial-time time-offset

      date-time       = full-date "T" full-time

      DIGIT          =  %x30-39 ; 0-9
      ; abbreviated here
    matches: 'The controller string a tool must parse for `Tag0`: the `date-time` selector, a newline, then the rule-list.'
    expect: 'valid'
    provenance: 'COMPUTED BY US. Not printed in the source. Produced by dedenting source lines 323-340 and 344-345 independently per Section 2.3, concatenating them per Section 2.2 (the .det), then prefixing the selector per the .cat.'
    notes: 'OURS: the blank line before DIGIT is the join of the first literal''s trailing newline and the second''s leading newline, and is ABNF-legal. OURS, CHECKED: closed from `date-time`, all 14 rules reachable. OURS, A TRAP: the only quoted strings containing letters anywhere in this controller are "T" and "Z", and no RFC 7405 %s or %i prefix appears, so RFC 5234 Section 2.3 makes them CASE INSENSITIVE -- `Tag0` therefore admits `1990-12-31t23:59:60z`. That agrees with RFC 3339, which permits lower case, but it is a property of ABNF''s defaults rather than a choice this document made, and it is stated nowhere in it.'
  - id: 'rfc-9165#V-0012'
    locator: '§3 (Figure 5, computed)'
    abnf: |
      full-date
      date-fullyear   = 4DIGIT
      date-month      = 2DIGIT  ; 01-12
      date-mday       = 2DIGIT  ; 01-28, 01-29, 01-30, 01-31 based on
                                ; month/year
      time-hour       = 2DIGIT  ; 00-23
      time-minute     = 2DIGIT  ; 00-59
      time-second     = 2DIGIT  ; 00-58, 00-59, 00-60 based on leap sec
                                ; rules
      time-secfrac    = "." 1*DIGIT
      time-numoffset  = ("+" / "-") time-hour ":" time-minute
      time-offset     = "Z" / time-numoffset

      partial-time    = time-hour ":" time-minute ":" time-second
                        [time-secfrac]
      full-date       = date-fullyear "-" date-month "-" date-mday
      full-time       = partial-time time-offset

      date-time       = full-date "T" full-time

      DIGIT          =  %x30-39 ; 0-9
      ; abbreviated here
    matches: 'The controller string a tool must parse for `Tag1004`: the `full-date` selector, a newline, then the rule-list.'
    expect: 'valid'
    provenance: 'COMPUTED BY US, as V-0011. Identical but for the selector line.'
    notes: 'OURS, CHECKED: closed from `full-date`, 5 of the 14 rules reachable (full-date, date-fullyear, date-month, date-mday, DIGIT). The remaining 9 rules are present and unreferenced from this selector, which Section 3''s closure rule permits -- it requires every rule REFERENCED to be defined, not every rule defined to be referenced. (Pass 1 wrote "4 rules reachable" while enumerating five names, and "the remaining 10" where 14 - 5 = 9; both corrected by the verify pass, which re-derived the reachable sets.)'
  - id: 'rfc-9165#V-0013'
    locator: '§4 (Figure 6)'
    cddl: |
      foo = {
        kind: bar / baz .feature (["foo-extensions", "bazify"])
      }
      bar = ...
      baz = ... ; complex stuff that doesn't all need to be in the detail
    matches: 'A map with one entry `kind`, whose value matches `bar` or `baz`; a `baz` value is additionally reported as using feature "foo-extensions" with detail "bazify".'
    expect: 'indeterminate'
    provenance: 'SOURCE CDDL (lines 379-383).'
    notes: '`expect: indeterminate` rather than valid, and the reason is the source''s own bytes, not a judgement of ours: `bar = ...` and `baz = ...` use `...` as a PROSE PLACEHOLDER, and the trailing comment says so ("complex stuff that doesn''t all need to be in the detail"). CDDL''s `...` is only a range operator between two values -- RFC 8610 Appendix B gives `rangeop = "..." / ".."` and no `type2` alternative begins with a dot -- so this figure DOES NOT PARSE as CDDL. Forcing valid or invalid would assert something about a figure the source wrote as a sketch. OURS: the figure is also the document''s only unparenthesised nested control, and it depends on `.ctrl` binding tighter than `/` so that only `baz` is annotated -- RFC 8610''s Table 1 gives 7 and 2, which is the one row of that table not in dispute.'
  - id: 'rfc-9165#V-0014'
    locator: '§4 (Figure 7)'
    cddl: |
      person = {
        ? name: text
        ? organization: text
        $$person-extensions
        * (text .feature "further-person-extension") => any
      }

      $$person-extensions //= (? bloodgroup: text)
    matches: 'A map with optional `name` and `organization` text entries, an optional `bloodgroup` text entry via the plug, and any number of further text-keyed entries of any value -- each further key reported as using feature "further-person-extension" with the key as detail.'
    expect: 'valid'
    provenance: 'SOURCE CDDL (lines 404-411).'
    notes: 'The map-extensibility idiom, and the only vector here that uses all three mechanisms at once: an RFC 8610 socket/plug for known extensions, a wildcard for unknown ones, and .feature to mark them. The source names the load-bearing part: "However, future extensions would be deemed invalid unless the wildcard at the end of the map is added." OURS: .feature does not create the extension point; the wildcard does. A schema that adds .feature and omits `* ... => any` changes nothing, because RFC 8610''s map matching is exhaustive in both directions.'
  - id: 'rfc-9165#V-0015'
    locator: '§4 (Figure 7, the source''s own negative)'
    instance: '{"organisation": "ACME"}'
    against: 'V-0014 (Figure 7)'
    matches: 'the wildcard entry `* (text .feature "further-person-extension") => any`, NOT the `organization` entry.'
    expect: 'valid'
    violates: 'nothing. That is the point, and the document says so.'
    provenance: 'SOURCE PROSE (lines 399-402). The misspelling is the document''s own; the surrounding braces are OURS, to make it a fixture.'
    notes: 'The document''s own cautionary example, quoted in full: "Leaving the extension point in but not marking its use as special would render mistakes (such as using the label "organisation" instead of "organization") invisible." OURS: so `expect: valid` IS the finding. The wildcard buys extensibility at the price of silently accepting a typo, and .feature buys back only the ability to SEE it in a diagnostic -- never to reject it. For us this is the exact shape of the risk in any `* tstr => any` extension point we ship, and it is why a feature report has to be read rather than merely emitted.'
  - id: 'rfc-9165#V-0016'
    locator: '§4 (Figure 8)'
    cddl: |
      allowed-types = number / text / bool / null
                    / [* number] / [* text] / [* bool]
                    / (any .feature "allowed-type-extension")
    matches: 'A number, text, bool, null, or an array of numbers, texts or bools; or ANY data item at all, reported as using feature "allowed-type-extension".'
    expect: 'valid'
    provenance: 'SOURCE CDDL (lines 418-420).'
    notes: 'Type extensibility rather than map extensibility. OURS, AND IT MATTERS FOR OPTION 5: the final alternative is `any`, which RFC 8610''s prelude defines as `#` -- every data item, major type 6 included. So this idiom readmits the entire CBOR tag space at the extension point, and .feature marks its use without restricting it. Under MD-3''s option 5 that is a lint obligation, not a schema property. See ../design-notes.md.'
  - id: 'rfc-9165#V-0017'
    locator: '§4 (Figure 9)'
    cddl: |
      SenML-Record = {
      ; ...
        ? v => number
      ; ...
      }
      v = JC<"v", 2>
      JC<J,C> = J .feature "json" / C .feature "cbor"
    matches: 'A SenML record whose optional `v` entry is keyed either by the text "v" (reported as feature "json") or by the integer 2 (reported as feature "cbor").'
    expect: 'valid'
    provenance: 'SOURCE CDDL (lines 433-439).'
    notes: 'The JSON/CBOR switch. OURS: two control operators appear in one `type` here, and it is not a chain -- `type = type1 *(S "/" S type1)` gives each its own type1, so this is a type choice of controlled types. The source withholds endorsement of the whole idiom: "It remains to be seen if the enable/disable approach can lead to new idioms of using CDDL." Do not adopt Figure 9 on this document''s authority; see V-0018.'
  - id: 'rfc-9165#V-0018'
    locator: '§4 (Figure 9, the source''s own negative)'
    instance: '{"v": 1, 2: 1}'
    against: 'V-0017 (Figure 9)'
    matches: 'both arms of `JC<"v", 2>` -- the instance is reported as using feature "json" AND feature "cbor".'
    expect: 'valid'
    violates: 'nothing in CDDL. The document states the gap: "The language currently has no way to enforce mutually exclusive use of features, as would be needed in this example."'
    provenance: 'OURS. The instance is ours; the DEFECT it exhibits is the source''s own, stated in its own words.'
    notes: 'OURS: the document concedes that its own final example cannot be made correct. Figure 9 is offered as a JSON/CBOR switch, and an instance that carries BOTH spellings of the same member satisfies it and is reported as using both features -- which is exactly what a switch must forbid. `expect: valid` is again the finding. This is the sharpest of the document''s three disclaimers of capability and the reason .feature cannot be used to enforce anything. Marked OURS because the source names the gap without printing an instance that exhibits it.'
