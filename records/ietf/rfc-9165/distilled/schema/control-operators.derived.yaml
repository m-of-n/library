# =====================================================================
# control-operators.derived.yaml
#
# DERIVED -- NOT verbatim. This table is this library's rendering, not
# RFC 9165's. Do not cite it as the standard's text. Every `quote` field
# below IS the source's own wording, marked as such; everything else
# (the target/controller admissibility fields, the predicate forms, the
# `class`, the `grammar_gap` notes, the comparison with rfc-8610) is
# ours, written from the prose of Sections 2, 3 and 4.
#
# Why it exists: RFC 9165 registers six operators into the IANA "CDDL
# Control Operators" registry, and Table 2 -- the whole of the registry
# entry -- carries a NAME and a REFERENCE and nothing else. No target
# type, no controller type, no semantics, no indication of what KIND of
# operator it is. All of that is in prose. A tool needs it as data.
#
# This file is the companion to
#   records/ietf/rfc-8610/distilled/schema/control-operators.derived.yaml
# and uses the same field names deliberately, so the two can be read as
# one table of twenty operators. Read `registry_state` below FIRST: twenty
# is NOT the registry total, and this record used to say it was.
#
# Source: RFC 9165, Sections 1 (Table 1), 2, 2.1, 2.2, 2.3, 3, 4 and 5
#   (Table 2), cached source sha256
#   94f86116c04fde0f11d54576465181090ec33983d78db82527c0703a41976774
# =====================================================================
record: rfc-9165
artifact: control-operators
claim: derived
reviewed_by: ""

# ---------------------------------------------------------------------
# What this document adds to the registry, and what it does not touch.
# ---------------------------------------------------------------------
registry_state:
  rfc_8610_initial_entries: 14
  this_document_adds: 6
  all_six_are_new: true
  rfc_8610_fourteen_plus_these_six: 20
  TWENTY_IS_NOT_THE_REGISTRY_TOTAL: >-
    SAID IN CAPITALS BECAUSE THIS EXTRACTION GOT IT WRONG FIRST. 14 + 6 = 20
    is the number of DISTINCT OPERATORS these two documents define between
    them, and nothing more. It is NOT the size of the IANA registry, at any
    date. RFC 9165 says only that "IANA has registered the contents of
    Table 2 into the "CDDL Control Operators" registry of [IANA.cddl]" --
    it makes no claim whatever about what else that registry holds, and
    neither may we. RFC 9090 (July 2021) PREDATES this document and also
    registers control operators, so 20 was never even the total as of
    December 2021. For current registry state read records/ietf/rfc-9741,
    whose extraction reports RFC 9741 Section 1 naming RFC 9090 and RFC 9165
    as earlier additions and RFC 9741 Section 4 registering fourteen more.
    Deriving a registry total from the documents one happens to have read is
    EXACTLY the error recorded in `what_rfc_8610_got_wrong` below; this
    extraction made it too, and the number is scoped here rather than
    quietly corrected.
  overlap_with_rfc_8610: "NONE. No name registered here appears among RFC 8610's fourteen (.size .bits .regexp .cbor .cborseq .within .and .lt .le .gt .ge .eq .ne .default), and this document redefines none of them. The two sets are disjoint, so these two documents define 20 distinct operators -- see TWENTY_IS_NOT_THE_REGISTRY_TOTAL -- and rfc-8610's table of 14 is CORRECT AS A STATEMENT ABOUT RFC 8610."
  what_rfc_8610_got_wrong: >-
    ALREADY FIXED, BY ANOTHER LANE, WHILE THIS PASS WAS RUNNING -- recorded
    because the convergence is the evidence.
    records/ietf/rfc-8610/distilled/schema/control-operators.derived.yaml
    used to state, in `syntax.extension_point.policy_note`: "All names other
    than the fourteen below are Unassigned." Present tense, no date
    qualifier, and false as a statement of registry state. This extraction
    reached that finding from RFC 9165 alone -- six names assigned in
    December 2021 -- and the rfc-9741 extraction reached it independently
    and more completely on the same day (commit 9adcb8d, library#39 Tier 2),
    THIS RECORD DID NOT READ RFC 9741, so that lane's finding is cited from
    its artifact rather than from the source: it records RFC 9741 Section 1 as
    saying "RFCs have added to this extension point in both an
    application-specific [RFC9090] and a more general [RFC9165] way." and
    Section 4 as registering fourteen more.
    That lane has already removed the sentence and added
    `registry_state_is_not_rfc_8610` in its place, so nothing is owed here.
    Two of the four Tier 2 lanes finding the same false claim in a
    `profile: full` record, from two different sources, is what rfc-8610's
    gate existed to produce.
  registry_carries_no_semantics:
    quote: >-
      IANA has registered the contents of Table 2 into the "CDDL Control
      Operators" registry of [IANA.cddl]:
    ours: >-
      Table 2 has exactly two columns, Name and Reference. Nothing in the
      registry says what an operator's target may be, what its controller
      may be, whether it constrains the target or replaces it, or whether a
      tool that does not implement it should fail or ignore it. A tool
      author must read a different RFC per operator group to implement any
