# ---------------------------------------------------------------------
# Syntax and composition -- what this document does and does not change.
# ---------------------------------------------------------------------
syntax:
  unchanged: true
  note: >-
    RFC 9165 adds no grammar. It introduces no production, no precedence
    rule and no new operand position. Every operator below is an ordinary
    `ctlop` under RFC 8610's `type1 = type2 [S (rangeop / ctlop) S type2]`
    and `ctlop = "." id`, and the document says so of .abnf in its own
    words.
  quote: >-
    ABNF is added to CDDL in the same way that regular expressions were
    added: by defining a .abnf control operator.
  all_six_are_type_controls:
    verdict: true
    basis: >-
      OURS, and it is grammatical rather than stated. CDDL has no group
      control operator syntax at all: `ctlop` occurs only inside `type1`,
      which is a TYPE production. RFC 8610's fourteen are type controls for
      the same reason. So the answer to "type or group control?" is the
      same for all twenty operators these two documents define, and it is
      forced by the grammar rather than chosen per operator.
    positions_this_document_actually_uses: >-
      All four type positions, which is worth recording because it shows
      the operators are not restricted to a bare type rule: as a MEMBER KEY
      computed from a generic parameter (Figure 1, `(BASE .plus 1) => int`);
      as the TARGET OF A TAG (Figure 5, `#6.0(text .abnf date-time)`); as a
      MAP-KEY TYPE under an occurrence indicator (Figure 7,
      `* (text .feature "further-person-extension") => any`); and as a
      member of a TYPE CHOICE (Figure 8, Figure 9).
  precedence_untouched:
    verdict: >-
      OURS. RFC 9165 never mentions operator precedence and never cites
      RFC 8610's Table 1. It neither confirms nor repairs the three places
      where that table disagrees with the grammar
      (../../../rfc-8610/distilled/schema/grammar-gaps.derived.txt, G-42,
      G-43, G-44), and it does not touch the cut `^` that Table 1 omits.
    but_it_corroborates_G_44: >-
      OURS, and this is the useful part. G-44 is this library's INFERENCE
      that `type1` admits at most one range-or-control operator, so controls
      do not chain, and that RFC 8610's Table 1 is wrong to imply they do.
      RFC 9165 never states the rule - and then OBEYS IT IN EVERY NESTED USE
      IT PRINTS. Six independent pieces of evidence, all of them the
      source's own bytes:
    evidence:
      - 'Figure 1: `(BASE .plus 1) => int` and `? (BASE .plus 2) => int` -- parenthesised although nothing else requires it there.'
      - 'Figure 3: `oid = bytes .abnfb ("oid" .det cbor-tags-oid)` -- the inner control is parenthesised to be the controller of the outer one.'
      - 'Section 2.3 prose: `lhs .cat ("" .det rhs)`, quoted in full below under .det, where the document explains which operand is dedented.'
      - 'Figure 5 composes by NAMED INTERMEDIATE RULE instead of by parentheses: `full-date = "full-date" .cat rfc3339` with `rfc3339 = ''...'' .det rfc5234-core`. Two controls, one per rule, never two in one type1.'
      - 'Figure 7: `(text .feature "further-person-extension")`.'
      - 'Figure 8: `(any .feature "allowed-type-extension")`.'
    counter_evidence_examined: >-
      OURS. Two figures put two control operators in one `type`, and
      neither is a counter-example: Figure 6's
      `kind: bar / baz .feature (["foo-extensions", "bazify"])` and
      Figure 9's `JC<J,C> = J .feature "json" / C .feature "cbor"`. In both,
      a `/` separates the controls, and `type = type1 *(S "/" S type1)`
      gives each its own `type1`. That is a type choice of controlled types,
      not a chain. Figure 6 additionally relies on `.ctrl` binding tighter
      than `/` so that only `baz` is annotated, which Table 1's precedences
      7 and 2 give -- the one place this document depends on Table 1 at all,
      and it depends on the row that is not in dispute.
    so: >-
      G-44 stands, strengthened. A second independent document, by one of
      RFC 8610's own authors, parenthesises or names every nested control
      and never once chains two in a single type1.

# ---------------------------------------------------------------------
# A classification this library needs and the registry does not record.
# ---------------------------------------------------------------------
operator_classes:
  basis: >-
    OURS. Not in RFC 9165, not in RFC 8610, not in the IANA registry. It is
    forced on us by the fact that `.plus` is not a constraint: a tool that
    implements these twenty operators as a single uniform
    "narrow the target" interface will get three of them wrong and one of
    them backwards.
  classes:
    restrictive: >-
      The result is a SUBSET of the target type. The operator narrows.
      All fourteen of RFC 8610's are restrictive, and so are .abnf and
      .abnfb. 16 of the 20 these two documents define.
    constructive: >-
      The result is COMPUTED and is in general DISJOINT from the target
      type. .plus, .cat and .det. 3 of those 20, all new in this document, and
      the first of their kind in CDDL. `(BASE .plus 1)` where `BASE = 0` is
      the type `1`, which is not a subset of `0`. The source states the
      frame itself: "The resulting type is therefore formally a function of
      the elements of the cross-product of the two types."
    annotative: >-
      The result EQUALS the target type. The operator constrains nothing
      and only attaches a name for a tool to report. .feature alone,
      1 of those 20, and also the first of its kind. It is the only CDDL
      control operator known to this record that cannot make an instance
      invalid.
  consequence_for_a_tool: >-
    OURS. A validator can implement a restrictive operator as a predicate
    evaluated against an instance. A constructive operator must be
    evaluated during SPECIFICATION EXPANSION, before any instance is seen,
    because its result is a type that other rules then reference (Figure 5
    chains three of them through two named rules before the type is usable).
    An annotative operator must be carried through to the OUTPUT CHANNEL,
    which is a third place entirely. The registry distinguishes none of
    this; `records/ietf/rfc-9165/distilled/messages.yaml` holds the
    evaluation order.

# ---------------------------------------------------------------------
# The operators, in Table 2's registry order.
# ---------------------------------------------------------------------
operators:
  - name: ".plus"
    locator: "§2.1"
    iana_reference: "RFC 9165"
    new_in_this_document: true
    control_kind: "type control (ctlop in type1; CDDL has no group controls)"
    class: constructive
    target: "a numeric type -- stated as a MUST"
    controller: "a numeric type -- stated as the same MUST"
    result_type: >-
      OURS, from the mixed-type rule: the type of the TARGET. So
      `1.5 .plus 1` is a floating-point type and `1 .plus 1.5` is an
      integer type.
    predicate: >-
      OURS. There is no predicate. The operator CONSTRUCTS the type whose
      members are { target_value + controller_value } over the
      cross-product of the two operand types, each sum then converted to
      the target's numeric type, with float-to-int conversion taking the
      FLOOR. An instance matches `X .plus Y` iff it is a member of that
      constructed type -- which is a membership test against a computed
      set, not a constraint on the target.
    quote: >-
      The .plus control identifies a number that is constructed by adding
      the numeric values of the target and the controller.
    operand_rule_quote: "The target and controller both MUST be numeric."
    mixed_type_quote: >-
      If the target is a floating point number and the controller an
      integer number, or vice versa, the sum is converted into the type of
      the target; converting from a floating point number to an integer
      selects its floor (the largest integer less than or equal to the
      floating point number, i.e., rounding towards negative infinity).
    constrained_by: ["rfc-9165#R-0015", "rfc-9165#R-0016", "rfc-9165#R-0017"]
    example: "(BASE .plus 1) => int"
    floor_is_not_truncation: >-
      OURS, and it is the one place a careless implementation will differ.
      Floor and truncation agree on non-negative values and disagree on
      every negative non-integer: `-1.5 .plus 0` is -2 under the stated
      rule and -1 under C-style truncation. The document names floor
      explicitly and parenthesises it twice over ("the largest integer less
      than or equal to", "rounding towards negative infinity"), so there is
      no ambiguity to resolve - only an easy mistake to make.
    what_it_computes_over: >-
      OURS, and this is the finding that matters most for us. The operands
      are TYPES IN THE SPECIFICATION. In the document's only example the
      target is a GENERIC PARAMETER, bound at instantiation: "The parameter
      BASE allows the non-conflicting use of a multiple of these interval
      groups in one map by assigning different labels to the entries of the
      interval." Nothing in the construct can name another member of the
      same map, another entry of the same array, or any value in the
      instance. See `cross_field_constraints` at the foot of this file.
    grammar_gap: >-
      Nothing in the grammar restricts either operand to a numeric type.
      `ctlop = "." id` admits `"x" .plus 1`, which parses and is forbidden
      only by the prose MUST. This extends RFC 8610's G-11 to a fifteenth
      operator; it closes nothing.
    second_grammar_gap: >-
      OURS. `.plus` has no defined behaviour on a non-singleton operand
      beyond the cross-product frame, and the document concedes that tools
      vary: "Not all tools may be able to work with non-unique targets or
      controllers." So `uint .plus 1` is well defined on paper and may be
      refused in practice, with no conformance rule either way.

  - name: ".cat"
    locator: "§2.2"
    iana_reference: "RFC 9165"
    new_in_this_document: true
    control_kind: "type control (ctlop in type1; CDDL has no group controls)"
    class: constructive
    target: "a string type, text or byte -- stated as a MUST"
    controller: "a string type, text or byte -- stated as the same MUST; the two need NOT be the same string type"
    result_type: "the type of the TARGET -- stated"
    predicate: >-
      OURS. No predicate. The operator CONSTRUCTS the type whose members
      are { bytes(target) || bytes(controller) } over the cross-product,
      each result carrying the target's string type; if the target is a
      text string the result must additionally be valid UTF-8.
    quote: >-
      The .cat control identifies a string that is built from a
      concatenation of the target and the controller.
    operand_rule_quote: "The target and controller both MUST be strings."
    result_rule_quote: "The result of the operation has the same type as the target."
    byte_level_quote: "The concatenation is performed on the bytes in both strings."
    utf8_rule_quote: >-
      If the target is a text string, the result of that concatenation MUST
      be valid UTF-8.
    constrained_by: ["rfc-9165#R-0022", "rfc-9165#R-0023", "rfc-9165#R-0024", "rfc-9165#R-0025", "rfc-9165#R-0026"]
    example: 'c = "foo" .cat ''\n  bar\n  baz\n'''
    asymmetry: >-
      OURS. The operator is not commutative in TYPE, only in bytes.
      `"a" .cat 'b'` is a text string and `'a' .cat "b"` is a byte string,
      from the same four bytes. The UTF-8 MUST therefore applies to one
      ordering and not the other, which makes operand order a correctness
      question and not a style question.
    where_the_utf8_rule_bites: >-
      OURS. Two complete, individually valid UTF-8 strings cannot be
      concatenated into an invalid one -- byte concatenation of whole
      sequences never cuts a multi-byte sequence. So the MUST is not about
      splicing; it bites exactly when the CONTROLLER is a byte string
      holding bytes that are not valid UTF-8 and the TARGET is text. That
      is the one reachable violation, and a tool should report it there.
    grammar_gap: >-
      Nothing in the grammar restricts the operands to strings, and nothing
      makes the result's type visible to a reader: `a = "x" .cat b` has a
      type that depends on a rule defined elsewhere. Extends G-11; closes
      nothing.

  - name: ".det"
    locator: "§2.3"
    iana_reference: "RFC 9165"
    new_in_this_document: true
    control_kind: "type control (ctlop in type1; CDDL has no group controls)"
    class: constructive
    target: "a string type -- inherited from .cat by 'works like .cat'"
    controller: "a string type -- inherited from .cat"
    result_type: "the type of the TARGET -- inherited from .cat"
    predicate: >-
      OURS. No predicate. The operator CONSTRUCTS the type whose members
      are { bytes(dedent(target)) || bytes(dedent(controller)) } over the
      cross-product, where dedent is the two-step algorithm quoted below
      and is applied to each operand INDEPENDENTLY, and where the result
      carries the target's string type and inherits .cat's UTF-8 condition.
    quote: >-
      The control operator .det works like .cat, except that both arguments
      (target and controller) are independently _dedented_ before the
      concatenation takes place.
    dedent_algorithm_quote: >-
      1. determining the smallest amount of leftmost blank space (number of
      leading space characters) present in all the non-blank lines, and
      2. removing exactly that number of leading space characters from each
      line. For blank (blank space only or empty) lines, there may be fewer
      (or no) leading space characters than this amount, in which case all
      leading space is removed.
    dedent_algorithm_note: >-
      The two steps are quoted here JOINED, with the source's numbering, as
      a convenience. They are two separate numbered items in the source;
      each is held as its own contiguous verbatim span in
      ../requirements.yaml at rfc-9165#R-0034 and rfc-9165#R-0035, and
      ../normative.md reproduces the whole list as one verbatim block. Cite
      those, not this field.
    constrained_by: ["rfc-9165#R-0031", "rfc-9165#R-0033", "rfc-9165#R-0034", "rfc-9165#R-0035", "rfc-9165#R-0037"]
    single_item_idiom_quote: >-
      This can be achieved by using this operator with an empty string,
      e.g., "" .det rhs or lhs .det "", which can in turn be combined with a
      .cat: in the construct lhs .cat ("" .det rhs), only rhs is dedented.
    three_things_the_algorithm_pins:
      - 'OURS. The minimum is over NON-BLANK lines only, so a blank line never forces the amount to zero -- which is what makes a literal that opens with a newline work at all, and every multi-line literal in this document opens with one.'
      - 'OURS. "blank space" is parenthesised as "number of leading space characters", so a HORIZONTAL TAB is not blank space here. That is consistent with RFC 8610, whose grammar has SP = %x20 and admits no tab anywhere in CDDL, not even inside a string literal (G-30) -- but it means a tab-indented literal dedents by zero and the embedded ABNF silently stays indented. The document does not say so.'
      - 'OURS. "removing exactly that number" forbids normalising deeper indentation, so relative indent survives. That is not a nicety: an ABNF continuation line IS a continuation line only because it is more indented than its rule, and Figure 5 depends on it for partial-time.'
    margin_invariance: >-
      OURS. Because the RFC prints each figure shifted right by a uniform
      body margin, every line of a literal shifts by the same amount and
      step 1's minimum shifts with it. Dedenting the margin-bearing form and
      the author's flush-left form therefore give identical bytes. This is
      what lets a figure in a published RFC be a correct example rather than
      an approximation, and it is why
      embedded-abnf-dedented.derived.abnf can be derived from the margin-
      bearing capture without first un-indenting it.
    seam_the_document_does_not_state: >-
      OURS. The single-item idiom is offered in one breath as `"" .det rhs`
      OR `lhs .det ""`, as if the two were interchangeable. By the inherited
      result rule they are not: `"" .det rhs` yields a TEXT string whatever
      `rhs` was, and so drags in .cat's UTF-8 MUST, while `rhs .det ""`
      preserves `rhs`'s own type and does not. For an ABNF controller the
      difference is moot, because rfc-9165#R-0048 requires UTF-8 of a
      byte-string controller anyway; for any other use of .det on binary
      data it is a real divergence between two forms the document presents
      as alternatives.
    grammar_gap: >-
      Extends G-11; closes nothing. Additionally, dedenting is invisible in
      the grammar and in the type: two rules that differ only in `.cat`
      versus `.det` have different members and nothing marks it.

  - name: ".abnf"
    locator: "§3"
    iana_reference: "RFC 9165"
    new_in_this_document: true
    control_kind: "type control (ctlop in type1; CDDL has no group controls)"
    class: restrictive
    target: "either string type. 'usually text or some restriction on it', but the admissibility statement is explicit that both are allowed"
    controller: "a string -- stated as a MUST. OURS, restating the next sentence rather than quoting it: a byte-string controller is required to be valid UTF-8 and is reinterpreted as the text string with the same bytes. The exact sentences are `controller_rule_quote` and `controller_coercion_quote` below"
    result_type: "OURS: the target type, narrowed to the members the ABNF matches."
    predicate: >-
      OURS. The target matches iff the sequence of UNICODE SCALAR VALUES
      (code points) obtained by decoding the target's bytes as UTF-8 is
      derivable from the controller's leading `element`, under the rule-list
      that follows it, in the ABNF of RFC 5234 together with RFC 7405.
    quote: >-
      This means this specification defines two control operators: .abnfb
      for ABNF denoting byte sequences and .abnf for denoting sequences of
      Unicode scalar values (code points) represented as UTF-8 text
      strings.
    target_rule_quote: >-
      Both control operators can be applied to targets of either string
      type; the ABNF is applied to the sequence of bytes in the string and
      interprets it as a sequence of bytes (.abnfb) or as a sequence of code
      points represented as an UTF-8 text string (.abnf).
    controller_rule_quote: "The controller string MUST be a string."
    controller_coercion_quote: >-
      When a byte string, it MUST be valid UTF-8 and is interpreted as the
      text string that has the same sequence of bytes.
    controller_structure_quote: >-
      This is resolved by requiring the controller string to be one valid
      "element", followed by zero or more valid "rules" separated from the
      element by a newline; thus, the controller string can be built by
      preceding a piece of valid ABNF by an "element" that selects from that
      ABNF and a newline.
    closure_rule_quote: >-
      (Note that all rules referenced need to be defined in each ABNF
      operator controller string -- there is no implicit import of core ABNF
      rules from [RFC5234] or other rules.)
    dialect_quote: >-
      The term "ABNF" in this specification stands for the combination of
      [RFC5234] and [RFC7405]; i.e., the ABNF control operators defined by
      this document allow use of the case-sensitive extensions defined in
      [RFC7405].
    constrained_by: ["rfc-9165#R-0008", "rfc-9165#R-0042", "rfc-9165#R-0045", "rfc-9165#R-0046", "rfc-9165#R-0047", "rfc-9165#R-0048", "rfc-9165#R-0050", "rfc-9165#R-0053", "rfc-9165#R-0055"]
    example: "Tag0 = #6.0(text .abnf date-time)"
    four_orthogonal_combinations: >-
      OURS. The target's string type and the operator's alphabet are
      independent, so there are four combinations and it is the OPERATOR,
      not the target, that decides what the ABNF sees. `bytes .abnf X`
      decodes the byte string as UTF-8 and matches code points; `text
      .abnfb X` matches over the text string's UTF-8 bytes. Neither is an
      error and the document admits both in one sentence.
    case_insensitivity_is_the_default: >-
      OURS, and it is the sharpest trap in this document. RFC 5234
      Section 2.3 makes ABNF quoted strings CASE INSENSITIVE; RFC 7405's
      `%s` prefix is what makes one case sensitive. So `text .abnf '"cbor"'`
      matches "CBOR" and "cBoR". Checked by script against this document's
      own example: the only letter-bearing quoted strings in Figure 5's
      composed controller are "T" and "Z", and no %s or %i appears
      anywhere, so `Tag0` admits `1990-12-31t23:59:60z`. That happens to
      agree with RFC 3339, which permits lower case -- but it is a property
      of ABNF's defaults, not a choice this document made, and it is not
      stated anywhere in it.
    this_is_new_capability_not_just_a_new_operator: >-
      OURS. RFC 8610 Section 3.1 states that CDDL has no case insensitivity
      for text strings and that regular expressions are the workaround
      (G-35), and the .regexp notes in rfc-8610's own operator table record
      that case insensitivity "must be written out, as in
      "[Cc][Aa][Ss][Ee]"". `.abnf` supplies it directly, and by default.
      G-35 is therefore PARTIALLY CLOSED by this document - the only gap of
      the 44 that is.
    grammar_gap: >-
      Extends G-11. Worse than for the others, because the controller is a
      WHOLE SECOND FORMAL LANGUAGE inside a CDDL string literal: `ctlop`
      cannot check that it is valid ABNF, that it begins with an `element`,
      that it is rule-closed, or that it parses at all. A CDDL tool must
      embed an ABNF parser or reject the operator.
    source_defect_element_vs_elements: >-
      OURS, reported not repaired. The structure rule says "one valid
      "element"" (singular). The sentence before it names the production
      differently: "ABNF defines a list of rules, not a single expression
      (called "elements" in [RFC5234])" -- and in RFC 5234 `elements` is
      `alternation *c-wsp`, while `element` is the far narrower
      `rulename / group / option / char-val / num-val / prose-val`. The two
      readings differ: under `element` a selector of `DIGIT DIGIT` or
      `"a" / "b"` is ill-formed, under `elements` it is fine. Both of this
      document's own selectors are bare rulenames (`full-date`,
      `date-time`, `oid`, `roid`), so no example distinguishes the readings
      and a tool author must choose. See README.md.

  - name: ".abnfb"
    locator: "§3"
    iana_reference: "RFC 9165"
    new_in_this_document: true
    control_kind: "type control (ctlop in type1; CDDL has no group controls)"
    class: restrictive
    target: "either string type -- same statement as .abnf"
    controller: "a string -- same MUST and the same UTF-8 coercion as .abnf"
    result_type: "OURS: the target type, narrowed to the members the ABNF matches."
    predicate: >-
      OURS. The target matches iff the sequence of BYTES in the target is
      derivable from the controller's leading `element`, under the rule-list
      that follows it, in the ABNF of RFC 5234 together with RFC 7405.
      Identical to .abnf except for the alphabet: bytes, not code points.
    quote: >-
      ABNF can be used to define byte sequences as well as UTF-8 text
      strings interpreted as Unicode scalar sequences.
    see: ".abnf -- every quote under it covers both operators; the source defines the pair in one sentence and states every rule for both at once"
    constrained_by: ["rfc-9165#R-0044", "rfc-9165#R-0045", "rfc-9165#R-0046", "rfc-9165#R-0047", "rfc-9165#R-0048", "rfc-9165#R-0050", "rfc-9165#R-0053", "rfc-9165#R-0055"]
    example: 'oid = bytes .abnfb ("oid" .det cbor-tags-oid)'
    why_two_operators_and_not_a_target_rule: >-
      OURS. The split exists because the ALPHABET is not recoverable from
      the target's type: a byte string can be matched byte-wise or decoded
      and matched code-point-wise, and both are useful. Putting the choice
      in the operator name rather than in the target keeps `#6.1004(text
      .abnf full-date)` and `bytes .abnfb oid-rules` both expressible.
      The cost is that the registry now holds two names that differ in one
      letter and in nothing a reader can see.
    grammar_gap: "as .abnf."

  - name: ".feature"
    locator: "§4"
    iana_reference: "RFC 9165"
    new_in_this_document: true
    control_kind: "type control (ctlop in type1; CDDL has no group controls)"
    class: annotative
    target: "any type. No admissibility rule is stated at all"
    controller: >-
      no admissibility rule is stated. 'The latter will usually be a
      string' is a hedge, not a MUST, and a two-element array is the
      explicitly sanctioned second form. This is the only operator in
      either document whose controller type is left open.
    result_type: "OURS: the target type, UNCHANGED. The operator narrows nothing."
    predicate: >-
      OURS. There is no predicate. An instance matches `T .feature F`
      exactly when it matches `T`. The operator's whole effect is on the
      TOOL'S OUTPUT: the instance may be reported as using the feature
      named by the controller, with the target as the detail. A tool that
      ignores .feature entirely accepts and rejects exactly the same
      instances as one that implements it.
    quote: >-
      The .feature control annotates the target as making use of the feature
      named by the controller.
    controller_hedge_quote: "The latter will usually be a string."
    tool_behaviour_quote: >-
      A tool that validates an instance against that specification may mark
      the instance as using a feature that is annotated by the
      specification.
    diagnostic_mapping_quote: >-
      More specifically, the tool's diagnostic output might contain the
      controller (right-hand side) as a feature name
    diagnostic_mapping_quote_note: >-
      THE QUOTE ABOVE STOPS MID-SENTENCE AND DELIBERATELY SO. The token
      `left-hand` is SEVERED BY HYPHENATION at the line break between source
      lines 370 and 371, which the source sets as `...and the target (left-`
      then `hand side) as a feature detail.` Whitespace normalisation turns
      that into `(left- hand side)`, so the healed spelling is not this
      document's bytes and is written nowhere in this record. Under
      docs/extraction.md a token cut by a line break is not quoted whole, so
      only the obligation-bearing half appears above. The dropped half,
      OURS: the target supplies the feature detail as the controller
      supplies the feature name. It is the only hyphenation break in
      RFC 9165.
    array_form_quote: >-
      In this case, the controller should be an array, with the first
      element being the feature name (that would otherwise be the entire
      controller) and the second element being the detail (usually another
      string), as illustrated in Figure 6.
    minimal_behaviour_quote: >-
      A CDDL tool may simply report the set of features being used; the
      control then only provides information to the process requesting the
      validation.
    constrained_by: ["rfc-9165#R-0061", "rfc-9165#R-0062", "rfc-9165#R-0063", "rfc-9165#R-0064", "rfc-9165#R-0066", "rfc-9165#R-0069", "rfc-9165#R-0074", "rfc-9165#R-0078"]
    examples:
      - 'kind: bar / baz .feature (["foo-extensions", "bazify"])'
      - '* (text .feature "further-person-extension") => any'
      - '/ (any .feature "allowed-type-extension")'
      - 'JC<J,C> = J .feature "json" / C .feature "cbor"'
    it_changes_the_validation_OUTCOME_SET: >-
      OURS, and it is the only thing in either document that does. The
      source states the baseline it replaces -- "Commonly, the kind of
      validation enabled by languages such as CDDL provides a Boolean
      result: valid or invalid" -- and then "In rapidly evolving
      environments, this is too simplistic." The outcome becomes three-
      valued in effect: invalid; valid; valid-and-using-features-F. That is
      a change to the CONTRACT of a validator, not to the language's
      expressiveness, and it is the reason this operator cannot be modelled
      as a predicate anywhere in this record.
    it_does_not_create_the_extension_point: >-
      OURS, and the source says the operative half itself: "However, future
      extensions would be deemed invalid unless the wildcard at the end of
      the map is added." RFC 8610's map matching is exhaustive in both
      directions (G-22), so `.feature` on a key type does nothing unless a
      `* ... => any` entry already admits the key. The operator MARKS an
      extension point; the wildcard MAKES one. A schema that adds .feature
      and forgets the wildcard changes nothing.
    the_cost_the_source_states: >-
      "Leaving the extension point in but not marking its use as special
      would render mistakes (such as using the label "organisation" instead
      of "organization") invisible." OURS: so the wildcard buys
      extensibility at the price of silently accepting typos, and .feature
      buys back only the ability to SEE them in a diagnostic -- not to
      reject them.
    conformance_is_optional_throughout: >-
      OURS. Every statement about what a tool does with .feature is hedged:
      "may mark", "might contain", "may simply report", "One could also
      imagine". There is no MUST, no SHOULD and no criterion. A tool that
      silently discards every .feature annotation is conformant, which
      makes the operator's value non-portable in a way no restrictive
      operator's is.
    the_document_concedes_its_own_last_example_is_wrong: >-
      "The language currently has no way to enforce mutually exclusive use
      of features, as would be needed in this example." OURS: Figure 9's
      `JC<J,C> = J .feature "json" / C .feature "cbor"` is offered as a
      JSON/CBOR switch and admits an instance reported as using BOTH
      features. The document shows the idiom, withholds endorsement of it
      ("It remains to be seen if the enable/disable approach can lead to new
      idioms of using CDDL"), and states the gap. Do not adopt Figure 9 on
      this document's authority.
    grammar_gap: >-
      Extends G-11, and in a new direction: because `.feature` constrains
      nothing, NO instance can ever reveal that a tool failed to implement
      it. Every other operator in the registry is testable by exhibiting an
      instance it should reject. This one is testable only against a tool's
      diagnostic output, for which the document specifies no format.
      Additionally, the two-element array form makes the controller's SHAPE
      semantic, which no other CDDL control operator does, and nothing in
      the grammar or the type system distinguishes
      `.feature "x"` from `.feature ["x", "y"]` from `.feature ["x","y","z"]`
      -- the last being undefined.

# ---------------------------------------------------------------------
# The question this record was extracted to answer.
# ---------------------------------------------------------------------
cross_field_constraints:
  question: >-
    Does anything in RFC 9165 let CDDL express a constraint BETWEEN TWO
    MEMBERS of one instance -- `1 <= k <= n`, `n = len(members)`,
    `not_before <= not_after`? rfc-8610's extraction found it cannot, and
    DEC-002's acceptance fixture names the threshold subject, so this is the
    most consequential thing Tier 2 could change.
  verdict: "NO. Nothing here closes it, and .plus is the operator that looks as though it might."
  why_not:
    - 'OURS, from the source''s own frame. Section 2 settles it in one sentence: "For these operators, as with all control operators, targets and controllers are types." An operand is a TYPE EXPRESSION in the specification. There is no construct in CDDL or in this document that denotes `the value that the member named k takes in this instance`, so there is nothing for an operator to relate.'
    - 'OURS. `.plus` is evaluated during SPECIFICATION EXPANSION, not during matching. Its only example computes over a GENERIC PARAMETER bound at instantiation: `interval<BASE>` with `X = 0`, `Y = 3`. What it produces are MAP LABELS -- "one group for the X dimension (using 0, 1, and 2 as labels)". Relating two KEYS at authoring time is not relating two VALUES at validation time.'
    - 'OURS. The route that would smuggle it in is closed independently: occurrence indicators take literal integers in the grammar (`occur = [uint] "*" [uint] / "+" / "?"`), not types, so `n .plus 0` cannot become an occurrence count and `[k* member]` cannot be driven by another member''s value. `.plus` yields a TYPE, and a type is not admitted where `occur` expects a `uint`.'
    - 'OURS. `.feature` does not help either: it constrains nothing, so it cannot enforce an invariant. What it CAN do is make the hole visible - see below.'
  what_it_does_change_for_us: >-
    OURS, and it is worth the extraction on its own. `.feature` gives a
    DISCIPLINED WAY TO DECLARE AN INVARIANT THE SCHEMA DOES NOT CHECK,
    inside the schema, in a form a tool reports. Where DEC-002's acceptance
    fixture needs `1 <= k <= n` and CDDL cannot state it, a
    `.feature`-annotated type records in the schema that this member carries
    a constraint checked elsewhere, and a validator that reports feature use
    will name it on every instance. That does not close the gap; it stops
    the gap being silent, which is the actual failure mode. See
    ../design-notes.md.
  grammar_gaps_touched:
    closes: ["G-35 (partially) -- case insensitivity, via ABNF's case-insensitive quoted strings; see .abnf above"]
    extends: ["G-11 -- per-operator target/controller side conditions. G-11 is headed \"all fourteen operators\"; these six add six more sets of side conditions, and the grammar constrains none of them. The true count is higher still, since rfc-9741 and rfc-9090 add their own"]
    corroborates: ["G-44 -- controls do not chain; six independent parenthesisations and two named-rule compositions, and not one chain"]
    does_not_touch: ["G-42, G-43 -- Table 1's comma row and the omitted cut; RFC 9165 never mentions precedence or Table 1"]
    adds_new_ones_of_its_own: >-
      OURS, five, and they belong in any successor to
      grammar-gaps.derived.txt: (1) the `element` versus `elements`
      production mismatch in the ABNF controller rule; (2) ABNF rule
      CLOSURE, which the grammar cannot check and which no CDDL construct
      expresses; (3) the floor-versus-truncation conversion in `.plus`;
      (4) `.cat`'s type asymmetry, so operand order is semantic; (5)
      `.feature`'s untestability -- no instance can reveal a tool that
      ignores it.

