distillation:
  standard: "FX-1"
  # NO `profile` YET. Pass 1 (extract) is complete across the artifact set;
  # verify and cross-check have NOT run, and an unfinished extraction is
  # neither `full` nor `partial` (docs/extraction.md).
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "78 verbatim bullets and 13 reproduced blocks across 9 locators (§1, §1.1, §2, §2.1, §2.2, §2.3, §3, §4, §5, §6). All 78 confirmed contiguous substrings of the whitespace-normalised source AND inside the locator's own section range, checked against a section map built from the document's own numbered headings rather than document-wide; all 13 fenced blocks byte-identical to their declared source line ranges, one of them rebuilt from the source after the first pass set Table 2's centring one column short. The 13 blocks are both tables, all nine figures, the dedenting definition and the CRLF production. This source has NO form feeds, NO page markers and NO running header or footer, so unlike rfc-8610 and rfc-8949 no span crosses a page frame; the one hyphenation break in the document is declared and not healed"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "84 entries R-0001 to R-0084 in source order, no gaps: 5 stated, 79 inferred. source and extracted keyword counts both 5. Every `text` was SLICED OUT OF THE CACHE by line range and boundary marker rather than retyped, and all 84 verify as contiguous substrings inside their own section. NOT ONE of the five stated keywords is an obligation on an actor: every one is a type-admissibility or well-formedness rule on an operator's operand, and R-0047 ('The controller string MUST be a string.') is tautological as written and does its work only through R-0048. The reconciliation states the real baseline - this is a GRAMMAR EXTENSION, so normativity is carried by operator definitions and matching rules - and names what was counted instead: every operator definition, the two stated algorithms, the CRLF grammar redefinition, Section 2's type-theoretic frame, the three explicit disclaimers of capability, the IANA registration, and the lower-case force-words the document does use. §1.1's boilerplate is deliberately never quoted: bin/validate counts texts with stripping off, so quoting it would add 11 phantom keywords"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "8 verbatim files in 15 regions, 2 derived. The central artifact is control-operators.derived.yaml: all six operators as data in Table 2's registry order, with target, controller, result type, predicate, control kind, class, IANA entry and per-operator gaps, using rfc-8610's field names so the two read as one table of twenty operators - which is NOT a registry total, a scoping this pass had to correct in itself after the rfc-9741 lane independently found the same false claim in rfc-8610. Verbatim: the four ABNF regions the document prints (its own CRLF redefinition plus three rule-lists), all nine CDDL figures in five files split where rule names collide, and both registry tables. All 15 regions re-verified byte-for-byte by a checker that parses the BEGIN/END markers and re-slices independently of the generator - 15/15 exact, 15/15 per-region sha256 verify, and for all 15 the digest equals that of the same lines rstripped, which independently proves no line carries trailing whitespace. Two regions are nested inside two others deliberately, because the ABNF lives inside the CDDL byte-string literals. Derived: the ABNF after the document's OWN operators have run, which is what a tool actually parses"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "13 constructs - the 6 operators, 3 string structures, 1 operation, 3 idioms - plus a 5-PHASE EVALUATION ORDER, which is the part a tool gets wrong: constructive operators must run during specification expansion, ABNF recognizers during matching, and .feature on the output channel. `constrained_by` IS populated here, unlike in rfc-8610 where the file header states it is omitted throughout; the difference is honest rather than stylistic, since this document carries 84 requirements across 9 sections. 62 distinct requirement ids referenced, 0 dangling"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "18 vectors V-0001 to V-0018 in source order, no gaps: 17 valid, 1 indeterminate, 0 invalid. The document prints NO instance anywhere - not one data item, not one hex string - so provenance is explicit per vector: 14 the source's own bytes by line range, 3 COMPUTED BY US by applying the document's own §2.3 dedent and §2.2 concatenation, 1 OURS. 10 of 10 declared ranges re-slice byte-identically and every range is contiguous in the raw source; 3 of 3 computed blocks re-derive exactly, and V-0004 was checked the other way round - our implementation of the source's dedent reproduces the source's OWN Figure 4 literal, which tests our reading of the algorithm rather than our arithmetic. V-0013 is indeterminate because Figure 6 DOES NOT PARSE as CDDL: `bar = ...` uses `...` as a prose placeholder while CDDL's `...` is only a range operator. Both negatives are the source's own and both are expect: valid, because in each case the validity IS the finding"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the full operator set as the real target rather than rfc-8610's fourteen; the cross-field verdict (NO, and .plus is the operator that looks as though it should change it); eight numbered mappings onto our decisions, of which five cut against MD-3. The sharpest are: all six names registered in the FLAT GLOBAL form with zero internal dots, which is rfc-8610's 'the dotted-name rule is backwards for us' observed rather than predicted; the measured cost of the registry escape hatch, since RFC 9165 is Standards Track by one of RFC 8610's own authors and took four years; and that embedded ABNF gives CDDL CASE-INSENSITIVE matching by default, which under ARCH-0002 P1 - where a local label IS identity - is a collision arriving from the schema layer. One finding goes MD-3's way, the first in this library's CDDL chain: .feature is a disciplined way to DECLARE an invariant the schema cannot check, which is exactly the failure mode rfc-8610 §3e named at DEC-002's own acceptance fixture. Plus 11 source defects and what this invalidates in rfc-8610"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "A genuine call rather than an absence, so the reasoning is recorded. This document defines no roles, no peers and no exchange. §4 comes closer than anything in rfc-8610 did: it names a second party, \"the process requesting the validation\", and describes an information flow to it - \"A CDDL tool may simply report the set of features being used; the control then only provides information to the process requesting the validation.\" But that is a single-party tool invocation returning a result to its caller, not an exchange between peers. The speculative enable/disable interface - \"One could also imagine a tool that takes arguments, allowing the tool to accept certain features and reject others (enable/disable)\" - is tool CONFIGURATION, is explicitly imagined rather than specified, and is withdrawn from in the next paragraph (\"It remains to be seen if the enable/disable approach can lead to new idioms of using CDDL\"). There is no message, no error path between parties, and no second role that acts. §6 adds nothing: it incorporates RFC 8610's security considerations by reference, and RFC 8610 §5 says a content rules language \"does not bring any security issues on itself\"."
    - kind: state-machine
      reason: "No states and no transitions. Matching is a predicate over one specification and one instance. The one thing that might look like state is .feature's OUTCOME SET, which this document widens from two values to three in effect - invalid, valid, valid-and-using-features-F - against the baseline it states itself: \"Commonly, the kind of validation enabled by languages such as CDDL provides a Boolean result: valid or invalid.\" But an outcome set is not a lifecycle: nothing persists between instances, no instance is IN a state, and the enable/disable feature set is configuration fixed before a run rather than state carried through one. The precedent is draft-ietf-cbor-edn-literals, whose extraction made the same distinction about §5.1's three-outcome resolution rule - \"what varies between stages of the §5 chain is CONFIGURATION, not state\". Contrast rfc-9053, which DOES carry a state machine, because its key-usage counters persist across messages. And the document forecloses the one construct that would need state: \"The language currently has no way to enforce mutually exclusive use of features, as would be needed in this example.\""
  passes:
    - pass: extract
      by: "claude-opus-5 (single agent, owning the whole artifact set)"
      effort: max
      date: "2026-10-19"
      note: "read only .cache/rfc-9165.txt, never a summary and never another agent's output. Every verbatim artifact was GENERATED FROM THE CACHE BY SCRIPT rather than retyped: requirement texts by line range plus boundary marker, schema regions by line range with a per-region sha256, vector blocks by line range with margin removal, and the three computed vectors by an implementation of the document's own §2.3 dedent. Checks run and passing: bcp14-count 5, enumerated to source lines 141/179/182/279/280, all five the bare keyword MUST and all five confirmed by hand to be operand rules rather than obligations on an actor; 78/78 normative bullets contiguous and in-section; 13/13 fences byte-identical; 84/84 requirement texts contiguous and in-section, with load_yaml, miniyaml and distinct-id counts all 84; 15/15 schema regions byte-identical with digests verifying and no trailing whitespace; 18/18 vectors, 10/10 source ranges re-slicing and 3/3 computed blocks re-deriving; 62 requirement ids referenced from messages.yaml with 0 dangling; 96 further quotations hand-enumerated and verified against the document each is quoted FROM, including our own ARCH/ADR/DECISIONS documents and rfc-8610's artifacts; and a near-miss detector over all nine artifacts, which is the check that found real damage. WHAT THE MECHANICAL CHECKS CAUGHT AND FIXED, all of them ours, none in the source: ONE HEALED HYPHENATION - the token `left-hand` is severed at source lines 370/371 and three artifacts had quoted it whole, which is precisely the failure docs/extraction.md names; two quotations whose leading 'The' had been silently lowercased to fit a sentence (§3's controller MUST, §4's mutual-exclusion disclaimer); two of OUR OWN phrasings wearing quotation marks as though they were the source's; one Figure 5 comment that dropped the second ';' the source sets at its line break; Table 2's centring one column short in a fenced block; one requirement miscategorised as `stated` with no keyword behind it (R-0017); and two near-verbatim restatements that could be read as quotations, now marked OURS and pointed at the field holding the exact text. NOT run: any third-party CDDL or ABNF implementation, none being installed here, so the dedent, the closure checker and the case-sensitivity census are this library's own and settle structure rather than conformance. PASS 2 SHOULD ATTACK FIRST: the claim that all six operators are type controls (grammatical, inferred, not stated); the `element` versus `elements` reading of §3's controller rule; the operator-class taxonomy, which is entirely ours; and the assertion that Figure 6 does not parse, which is argued from RFC 8610's grammar rather than executed against it."
