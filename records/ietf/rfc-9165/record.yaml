  # Declared 2026-10-20 by the cross-check pass, which is pass 3 of 3. All four
  # of its deliverables are met: every field a requirement names exists in
  # messages.yaml or the schema; `protocol` and `state-machine` are
  # not_applicable with reasons that the verify pass attacked and upheld and
  # that nothing else in the record contradicts; and every example was RUN
  # against the schema rather than asserted against it.
  # THE RFC 5234 QUESTION WAS PUT AND ANSWERED, not left open. Two claims in
  # this record rest on documents the library does not hold (RFC 5234's
  # `element`/`elements` productions, and - the one the verify pass did not
  # name - case insensitivity itself, from RFC 5234 Section 2.3 and RFC 7405's
  # %s). That is a REFERENCE-level limit, not a document-level one: RFC 9165
  # is fully cached and fully extracted, no requirement text, schema region,
  # vector, computed literal or design mapping depends on an RFC 5234
  # production, and rfc-8610 is already at `standard: FX-1, profile: full`
  # while its own G-29 asserts what RFC 5234's CRLF is. `profile: partial`
  # requires a profile_reason naming what is NOT COVERED, and nothing about
  # RFC 9165 is uncovered here, so `partial` would misdescribe the record.
  # The limit is declared instead, labelled at every appearance, and the fix
  # is named: ingest RFC 5234 and RFC 7405. bin/ingest was NOT run by this
  # pass. Full argument in distilled/README.md, "The RFC 5234 limit".
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "78 verbatim bullets and 13 reproduced blocks across 9 locators (§1, §1.1, §2, §2.1, §2.2, §2.3, §3, §4, §5, §6). All 78 confirmed contiguous substrings of the whitespace-normalised source AND inside the locator's own section range, checked against a section map built from the document's own numbered headings rather than document-wide; all 13 fenced blocks byte-identical to their declared source line ranges, one of them rebuilt from the source after the first pass set Table 2's centring one column short. The 13 blocks are both tables, all nine figures, the dedenting definition and the CRLF production. This source has NO form feeds, NO page markers and NO running header or footer, so unlike rfc-8610 and rfc-8949 no span crosses a page frame; the one hyphenation break in the document is declared and not healed"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "84 entries R-0001 to R-0084 in source order, no gaps: 5 stated, 79 inferred. source and extracted keyword counts both 5. Every `text` was SLICED OUT OF THE CACHE by line range and boundary marker rather than retyped, and all 84 verify as contiguous substrings inside their own section. NOT ONE of the five stated keywords is an obligation on an actor: every one is a type-admissibility or well-formedness rule on an operator's operand, and R-0047 ('The controller string MUST be a string.') is tautological as written and does its work only through R-0048. The reconciliation states the real baseline - this is a GRAMMAR EXTENSION, so normativity is carried by operator definitions and matching rules - and names what was counted instead: every operator definition, the two stated algorithms, the CRLF grammar redefinition, Section 2's type-theoretic frame, the three explicit disclaimers of capability, the IANA registration, and the lower-case force-words the document does use. §1.1's boilerplate is deliberately never quoted: bin/validate counts texts with stripping off, so quoting it would add 11 phantom keywords"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "7 verbatim files in 15 regions, 2 derived - 10 files in the directory, counting README.md, which is neither and which docs/extraction.md excludes from the convention. [correction] 2026-10-20 (cross-check pass): this said 8, against schema/README.md's own 7; 7 is right and the eighth was README.md. The central artifact is control-operators.derived.yaml: all six operators as data in Table 2's registry order, with target, controller, result type, predicate, control kind, class, IANA entry and per-operator gaps, using rfc-8610's field names so the two read as one table of twenty operators - which is NOT a registry total, a scoping this pass had to correct in itself after the rfc-9741 lane independently found the same false claim in rfc-8610. Verbatim: the four ABNF regions the document prints (its own CRLF redefinition plus three rule-lists), all nine CDDL figures in five files split where rule names collide, and both registry tables. All 15 regions re-verified byte-for-byte by a checker that parses the BEGIN/END markers and re-slices independently of the generator - 15/15 exact, 15/15 per-region sha256 verify, and for all 15 the digest equals that of the same lines rstripped, which independently proves no line carries trailing whitespace. Three regions are nested inside two others deliberately, because the ABNF lives inside the CDDL byte-string literals - A-2 inside F-3, and both A-3 and A-4 inside F-5; the verify pass corrected pass 1's count of two. Derived: the ABNF after the document's OWN operators have run, which is what a tool actually parses"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "13 constructs - the 6 operators, 3 string structures, 1 operation, 3 idioms - plus a 5-PHASE EVALUATION ORDER, which is the part a tool gets wrong: constructive operators must run during specification expansion, ABNF recognizers during matching, and .feature on the output channel. THE ORDER IS OURS AND NOW CARRIES PER-BOUNDARY PROVENANCE, added by the cross-check pass after attacking it as the record's largest unexercised claim: the only ordering statement in the whole source is INSIDE .det, yet three of the four phase boundaries do have a basis in the document - 1->2 and 2->3 by demonstration in Figures 1 and 5, 4->5 by Section 4's own words - while 3->4, 'check an ABNF controller before matching', is forced by nothing and CHANGES VERDICTS: `a = int / (text .abnf 'x<LF>x = 1*DIGIT')` is an ill-formed specification to an eager tool and a valid match for the instance 1 to a lazy one, both conformant. See evaluation_order.boundaries and evaluation_order.schedule_sensitivity. `constrained_by` IS populated here, unlike in rfc-8610 where the file header states it is omitted throughout; the difference is honest rather than stylistic, since this document carries 84 requirements across 9 sections. 62 distinct requirement ids referenced, 0 dangling"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "18 vectors V-0001 to V-0018 in source order, no gaps: 17 valid, 1 indeterminate, 0 invalid. The document prints NO instance anywhere - not one data item, not one hex string - so provenance is explicit per vector: 14 the source's own bytes by line range, 3 COMPUTED BY US by applying the document's own §2.3 dedent and §2.2 concatenation, 1 OURS. 10 of 10 declared ranges re-slice byte-identically and every range is contiguous in the raw source; 3 of 3 computed blocks re-derive exactly - after the verify pass fixed V-0011 and V-0012, which were one line short because the .det join of Figure 5's two literals produces a BLANK LINE before DIGIT that both blocks omitted although V-0011's own notes asserted it. V-0004 was checked the other way round - our implementation of the source's dedent reproduces the source's OWN Figure 4 literal, which tests our reading of the algorithm rather than our arithmetic - and the verify pass made the condition on it explicit: the equality holds only once the RFC's three-column body margin is removed from Figure 4 as well as from Figure 3, because a dedent's result is flush left by construction and a figure printed in an RFC body cannot be. V-0013 is indeterminate because Figure 6 DOES NOT PARSE as CDDL: `bar = ...` uses `...` as a prose placeholder while CDDL's `...` is only a range operator. Both negatives are the source's own and both are expect: valid, because in each case the validity IS the finding"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the full operator set as the real target rather than rfc-8610's fourteen; the cross-field verdict (NO, and .plus is the operator that looks as though it should change it); eight numbered mappings onto our decisions, of which five cut against MD-3. The sharpest are: all six names registered in the FLAT GLOBAL form with zero internal dots, which is rfc-8610's 'the dotted-name rule is backwards for us' observed rather than predicted; the measured cost of the registry escape hatch, since RFC 9165 is Standards Track by one of RFC 8610's own authors and arrived two and a half years after RFC 8610 (June 2019 to December 2021, both from the document itself); pass 1 wrote `four years`, which the source supports nowhere, and the verify pass corrected it; and that embedded ABNF gives CDDL CASE-INSENSITIVE matching by default, which under ARCH-0002 P1 - where a local label IS identity - is a collision arriving from the schema layer. One finding goes MD-3's way, the first in this library's CDDL chain: .feature is a disciplined way to DECLARE an invariant the schema cannot check, which is exactly the failure mode rfc-8610 §3e named at DEC-002's own acceptance fixture. Plus 11 source defects and what this invalidates in rfc-8610. The verify pass added the document's own stated reason for a registered name's form - .dedcat rejected `as it is longer` - which was the one Section 1-6 sentence the extraction had dropped without declaring"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "A genuine call rather than an absence, so the reasoning is recorded. This document defines no roles, no peers and no exchange. §4 comes closer than anything in rfc-8610 did: it names a second party, \"the process requesting the validation\", and describes an information flow to it - \"A CDDL tool may simply report the set of features being used; the control then only provides information to the process requesting the validation.\" But that is a single-party tool invocation returning a result to its caller, not an exchange between peers. The speculative enable/disable interface - \"One could also imagine a tool that takes arguments, allowing the tool to accept certain features and reject others (enable/disable)\" - is tool CONFIGURATION, is explicitly imagined rather than specified, and is withdrawn from in the next paragraph (\"It remains to be seen if the enable/disable approach can lead to new idioms of using CDDL\"). There is no message, no error path between parties, no encoding or framing, and no second role that acts ON THE DATA - the requesting process asks and is told, which is an invocation contract rather than a peer exchange. ATTACKED AND UPHELD BY THE VERIFY PASS, on the two tests that could have overturned it: nothing in §4 persists between instances, and the enable/disable interface is configuration fixed before a run. §6 adds nothing: it incorporates RFC 8610's security considerations by reference, and RFC 8610 §5 says a content rules language \"does not bring any security issues on itself\"."
    - kind: state-machine
      reason: "No states and no transitions. Matching is a predicate over one specification and one instance. The one thing that might look like state is .feature's OUTCOME SET, which this document widens from two values to three in effect - invalid, valid, valid-and-using-features-F - against the baseline it states itself: \"Commonly, the kind of validation enabled by languages such as CDDL provides a Boolean result: valid or invalid.\" But an outcome set is not a lifecycle: nothing persists between instances, no instance is IN a state, and the enable/disable feature set is configuration fixed before a run rather than state carried through one. The precedent is draft-ietf-cbor-edn-literals, whose extraction made the same distinction about §5.1's three-outcome resolution rule - \"what varies between stages of the §5 chain is CONFIGURATION, not state\". Contrast rfc-9053, which DOES carry a state machine, because its key-usage counters persist across messages. And the document forecloses the one construct that would need state: \"The language currently has no way to enforce mutually exclusive use of features, as would be needed in this example.\" ATTACKED AND UPHELD BY THE VERIFY PASS. The one thing a tool genuinely accumulates is the SET of (feature name, detail) pairs within ONE validation - Figure 7's wildcard reports the same feature name once per further key - but that is an output accumulator inside a single run, which messages.yaml places in phase 5 on the output channel, not a lifecycle: it is discarded with the run, no instance is in a state, and no two instances interact."
  passes:
    - pass: extract
      by: "claude-opus-5 (single agent, owning the whole artifact set)"
      effort: max
      date: "2026-10-19"
      note: "read only .cache/rfc-9165.txt, never a summary and never another agent's output. Every verbatim artifact was GENERATED FROM THE CACHE BY SCRIPT rather than retyped: requirement texts by line range plus boundary marker, schema regions by line range with a per-region sha256, vector blocks by line range with margin removal, and the three computed vectors by an implementation of the document's own §2.3 dedent. Checks run and passing: bcp14-count 5, enumerated to source lines 141/179/182/279/280, all five the bare keyword MUST and all five confirmed by hand to be operand rules rather than obligations on an actor; 78/78 normative bullets contiguous and in-section; 13/13 fences byte-identical; 84/84 requirement texts contiguous and in-section, with load_yaml, miniyaml and distinct-id counts all 84; 15/15 schema regions byte-identical with digests verifying and no trailing whitespace; 18/18 vectors, 10/10 source ranges re-slicing and 3/3 computed blocks re-deriving; 62 requirement ids referenced from messages.yaml with 0 dangling; 96 further quotations hand-enumerated and verified against the document each is quoted FROM, including our own ARCH/ADR/DECISIONS documents and rfc-8610's artifacts; and a near-miss detector over all nine artifacts, which is the check that found real damage. WHAT THE MECHANICAL CHECKS CAUGHT AND FIXED, all of them ours, none in the source: ONE HEALED HYPHENATION - the token `left-hand` is severed at source lines 370/371 and three artifacts had quoted it whole, which is precisely the failure docs/extraction.md names; two quotations whose leading 'The' had been silently lowercased to fit a sentence (§3's controller MUST, §4's mutual-exclusion disclaimer); two of OUR OWN phrasings wearing quotation marks as though they were the source's; one Figure 5 comment that dropped the second ';' the source sets at its line break; Table 2's centring one column short in a fenced block; one requirement miscategorised as `stated` with no keyword behind it (R-0017); and two near-verbatim restatements that could be read as quotations, now marked OURS and pointed at the field holding the exact text. NOT run: any third-party CDDL or ABNF implementation, none being installed here, so the dedent, the closure checker and the case-sensitivity census are this library's own and settle structure rather than conformance. PASS 2 SHOULD ATTACK FIRST: the claim that all six operators are type controls (grammatical, inferred, not stated); the `element` versus `elements` reading of §3's controller rule; the operator-class taxonomy, which is entirely ours; and the assertion that Figure 6 does not parse, which is argued from RFC 8610's grammar rather than executed against it. [ALL FOUR WERE ATTACKED BY PASS 2 AND ALL FOUR SURVIVED; three are now executed rather than argued. See the verify pass note.]"
    - pass: verify
      by: "claude-opus-5 (single agent; did not extract)"
      effort: max
      date: "2026-10-20"
      note: "read only .cache/rfc-9165.txt, RFC 8610's and RFC 9682's grammars from this library's own records, and the artifacts under test. ALL FOUR OF PASS 1'S SELF-FLAGGED CLAIMS SURVIVE, three of them now EXECUTED rather than argued. (1) All six are type controls: CONFIRMED by counting - `ctlop` occurs in exactly one production, `type1`, in BOTH RFC 8610 Appendix B and RFC 9682's replacement grammar, which carries `type1` and `ctlop` over unchanged among its 41 and adds no ctlop position; `forced` is justified, with the qualification that it is forced by a grammar this document leaves untouched and never cites. (2) The `element`/`elements` fork: CONFIRMED on both halves, with three refinements - `4DIGIT` is a sharper witness than `\"a\" / \"b\"` because a `repeat` prefix is reachable from `elements` and not from `element`; parenthesising closes it, since `group` IS an `element`, so the fork bites a tool reading foreign ABNF rather than a specification author; and the selector census is complete at five applications (source lines 207, 208, 225, 313, 315) carrying four distinct selectors, all bare rulenames. ONE LIMIT RECORDED: this library holds no rfc-5234 record and no cached RFC 5234, so the two productions quoted are the record's one load-bearing claim resting on an uncached document. [CROSS-CHECK PASS: THE LIMIT IS REAL BUT NOT THE ONLY ONE, AND THE OTHER IS THIS RECORD'S HEADLINE FINDING. That embedded ABNF is case-insensitive by default rests on RFC 5234 Section 2.3 and on RFC 7405's %s, and the library holds no record and no cache of EITHER document. The census is verified from this document's own bytes and the consequence was executed, but by a recogniser whose literal matching is case-insensitive BY CONSTRUCTION, so the run cannot reach the premise. Both claims are now labelled as testimony at every appearance.] (3) The operator-class taxonomy: SOUND and the assignments are RIGHT, including the two that were genuinely at risk - RFC 8610 §3.8.5 says .within and .and have \"the identical formal semantics (intersection)\" and §3.8.6 says .default carries an \"implied .ne\", so both can reject an instance and both are restrictive; `.feature` really is the only one of the twenty that cannot invalidate an instance. `(BASE .plus 1)` with `BASE = 0` being the type `1` is the DOCUMENT'S OWN arithmetic, stated in §2.1's \"using 0, 1, and 2 as labels\", not our inference. The one defect in the taxonomy was ours: stated as bare set inclusion, restrictive and annotative overlap, now fixed with `proper` and an explicit partition criterion. (4) Figure 6 does not parse: EXECUTED. An Earley recogniser built for this pass from rfc-8610's own grammar rejects Figure 6 and stalls at the first `.` of `bar = ...` (source line 382, column 9); patching the two `...` to any real type makes it parse. The recogniser was validated first - it accepts the other eight figures including Figure 5 whole, and ~11 KB of RFC 8610's own CDDL - so the rejection is the grammar's. MECHANICAL RESULTS, all recomputed independently: bcp14 5 under `_bcp14.count(texts, boilerplate=False)` exactly as bin/validate does, at source lines 141/179/182/279/280, each matched one-to-one by offset to R-0016/R-0023/R-0026/R-0047/R-0048, and the boilerplate measured at exactly the 11 phantom keywords the reconciliation names; 84/84 requirement texts and 78/78 normative bullets contiguous in the whitespace-normalised source AND inside their locator's own range, against a section map rebuilt from the document's column-0 headings; 13/13 fences and 15/15 schema regions byte-identical with digests verifying; 18/18 vectors, 10/10 source ranges re-slicing, 3/3 computed blocks re-derived by an independent dedent; closure and the case-sensitivity census re-derived and then EXECUTED, the composed `date-time` controller matching `1990-12-31t23:59:60z` and rejecting `1990-12-31x23:59:60Z`; G-44 executed; 62 requirement ids from messages.yaml and every V-ref resolving, 0 dangling; every YAML parsing identically under both loaders. THE PAIRING DISCLOSURE IS TRUE AND WAS DEMONSTRATED: naive quote-pairing yields 700 candidate spans, 561 absent from the source and 25 flagged as near-misses, and every one of the 25 is a mispaired span that starts inside a verbatim block and runs past its end - no altered quotation anywhere. Nothing load-bearing depends on pairing: every verbatim claim is carried by a structurally delimited unit. All 27 attributed `*_quote` fields verify verbatim with line ranges. The hyphenation fix is COMPLETE - line 370 is the document's only line ending in a hyphen, `left-hand` is quoted whole nowhere as the source's bytes (the §1.1 occurrence at source line 109 is NOT severed), and no span heals a break. SIX REAL DEFECTS FOUND AND FIXED, all ours: the `.det` join of A-3 and A-4 produces a BLANK LINE before `DIGIT` which three blocks omitted while their own prose asserted it (schema/embedded-abnf-dedented.derived.abnf D-3, V-0011, V-0012); `two regions nested inside two others` where three are (A-4 is inside F-5 exactly as A-3 is); `4 rules reachable` from `full-date` where 5 are, counted exclusively against `all 14` counted inclusively, and `the remaining 10` where 9 remain; a §1 quotation attributed to the abstract, which writes the reference unbracketed; `it spent four years in the working group`, which the source supports nowhere - June 2019 to December 2021 is two and a half years; and edn-literals' cache cited at 100 KB where it is 164 KB. SOURCE WALKED FOR DROPPED STATEMENTS, §1 through §6 sentence by sentence: 85 of 88 body sentences held verbatim, and all three omissions now declared - the BCP 14 boilerplate, the hyphenated §4 half, and §2.3's `.dedcat` naming aside, which was the only undeclared one and is now recorded in normative.md and used in design-notes where the flat-name finding lives. The ABSTRACT was also unquoted and is now declared, because it alone calls these operators ones for the \"construction of constants\" and `.feature` one for a \"non-basic feature\", a term defined nowhere in the document. TWO ADDITIONS TO THE GAP LEDGER: G-28 is EXTENDED, not merely G-35 partially closed - embedded ABNF is a third case-sensitivity notation in one language, which is the cause of the finding the record already stated as a consequence; and a sixth new gap, found by executing the grammar - an operator name is NOT maximally munched, so `a = 1 .plus` parses as `.p` applied to a type called `lus`, the mirror of G-27 and the only side of that trap Appendix B does not comment on. `protocol` and `state-machine` not_applicable ATTACKED AND UPHELD on the two tests that could have overturned them: nothing persists between instances, and §4's enable/disable interface is configuration. NOT run: any third-party CDDL or ABNF implementation, none being installed here; the recogniser, the dedent, the closure checker and the census are this library's own and settle structure, not conformance. NO `profile` DECLARED and no `reviewed_by` signed: cross-check has not run. WHAT PASS 3 SHOULD ATTACK: the `element`/`elements` productions, which no cached source in this library can confirm; whether this record's `G-28 extends` belongs in rfc-8610's gap file rather than here; and the five-phase evaluation order in messages.yaml, which is wholly ours and which no example in the document exercises end to end. [ALL THREE WERE TAKEN UP BY PASS 3: the uncached-source limit was argued against the profile and found compatible with `full` but WIDER than stated above; `G-28 extends` was found to belong HERE while the maximal-munch gap beside it belongs in rfc-8610; and the five-phase order was split per boundary, three of four forced by the source and one not, with an executed fixture on which the schedules disagree. See the cross-check note.]"
    - pass: cross-check
      by: "claude-opus-5 (single agent; did neither the extract nor the verify pass)"
      effort: max
      date: "2026-10-20"
      note: "read .cache/rfc-9165.txt, rfc-8610's grammar and gap ledger from this library's own records, the artifacts under test, and the verify pass's accounts in the two READMEs. Reused the verify pass's Earley recogniser rather than rebuilding it, and wrote its own implementations of everything else. ALL FOUR FX-1 CROSS-CHECK DELIVERABLES MET. (1) EVERY FIELD A REQUIREMENT NAMES EXISTS: all six operators have a construct in messages.yaml AND an entry in schema/control-operators.derived.yaml; every structural part a requirement names - target, controller, result, selector/element, rule-list, newline, feature name, feature detail, the two-element array, dedent, closure, CRLF - is present in messages.yaml and in the schema; and 16 of the 17 backticked identifiers in the 84 requirement texts and fields resolve into messages.yaml or a schema file. The seventeenth is `(left-hand side)`, which is the hyphenation-severed half R-0064's field quotes in OUR words to explain the severance, not a field name - so 17 of 17 accounted for. (2) and (3) PROTOCOL AND STATE-MACHINE: confirmed consistent rather than re-derived, as the verify pass had already attacked and upheld both. distilled/ holds no protocol.yaml, protocol.md or state-machine.yaml; both not_applicable entries carry written reasons; and a sweep for `state machine`, `transition`, `lifecycle`, `sequence diagram`, `mermaid`, `protocol flow`, `error path` and `role` across every artifact and summary.md returns ONLY the three lines inside the not_applicable reasoning itself - two negations and the rfc-9053 contrast. Nothing in the record refers to a flow, a message in a flow, a state, a transition or a trigger as though one existed, and messages.yaml's five phases are a static schedule with no state carried between them. (4) EVERY EXAMPLE VALIDATES AGAINST THE SCHEMA - EXECUTED, not asserted, and it found a mis-keyed vector. All 18 were run: 8 of the 9 whole CDDL documents parse under rfc-8610's Appendix B and the ninth is V-0013, whose `indeterminate` IS the finding (reproduced at source line 382 column 9); the 3 prose one-liners V-0006/7/8 parse as `type`, `type1` and `grpent` and as no other production, so they are well-formed CDDL at the production the source uses them at; the 4 ABNF controller strings load with 0 undefined rules; and the 2 instance-bearing vectors are the honest limit, since a match needs a VALIDATOR and none is installed - the schemas parse and the instances are well formed but the match is reasoned. examples/README.md now carries the production table. A DEDICATED PROPAGATION SWEEP WAS RUN OVER EVERY CORRECTION THE VERIFY PASS MADE, because the rfc-9741, draft-ietf-cbor-cddl-modules and rfc-9682 cross-checks each found a pass-2 fix that had landed in one artifact and not in the others stating the same claim. THIS RECORD HAD TWO. (i) THE 4-VS-5 REACHABILITY MISCOUNT survived in `examples/vectors.yaml` V-0010's notes - `closed from both `full-date` (4 rules reachable) and `date-time` (all 14)`, the exclusive-against-inclusive pairing the verify pass itself described - after being fixed in schema/README.md, schema/embedded-abnf-dedented.derived.abnf, examples/README.md AND V-0012's own notes. Four artifacts fixed, a fifth missed. Re-derived here at 5 of 14 and corrected. (ii) THE NON-PARTITION survived in distilled/README.md, which still stated the operator classes as BARE SET INCLUSION - `16 of those 20 restrictive (the result is a subset of the target) ... 1 annotative (the result equals the target)` - under which restrictive and annotative OVERLAP, since equality is a subset and .feature would satisfy both. That is precisely the defect the verify pass fixed with `proper` plus an explicit partition criterion in control-operators.derived.yaml and in summary.md; it did not reach the index. Corrected, with the partition criterion now named there. THE OTHER FOUR VERIFY-PASS CORRECTIONS PROPAGATED CLEANLY, each checked across every artifact that states it: the `.det` join's blank line (present in D-3, V-0011 and examples/README.md, and present in V-0012's DATA as re-derivation confirms); `three regions nested inside two others` (schema/README.md, distilled/README.md and record.yaml all say three); `four years` (surviving only inside design-notes.md's own [correction] note, and summary.md makes no interval claim); and the hyphenated `left-hand`, which is quoted whole only from source line 109 where the break falls between `left-hand` and `side` and the token is NOT severed, while R-0064 and normative.md both stop before the real severance at lines 370/371. ONE IMMATERIAL INCONSISTENCY JUDGED NOT WORTH A CORRECTION: the sibling-calibration cache sizes mix units - edn-literals is cited at 164 KB, which is KiB (167736 bytes = 163.8 KiB), while rfc-8610's 125 KB and this document's 23 KB are SI. A 2.4% unit collision in a keywords-per-size aside misleads nobody, so it is recorded here rather than churned through three files. FIVE DEFECTS FOUND AND FIXED, ALL OURS, ALL THE SAME FAMILY - PROSE RIGHT, DATA WRONG. (a) THE ONE THAT MATTERS MOST: schema/control-operators.derived.yaml:689 carried a MULTI-LINE YAML FLOW SEQUENCE, the only one in this library's YAML. bin/_record_yaml cannot parse one and raised `unexpected indent 14, wanted 4`; bin/_yaml, which has no flow collections and IS THE READER bin/validate USES, parsed it SILENTLY WRONG - it took the first colon inside the G-28 text as a map key and split the finding across a bogus key and its value. So the verify pass's own claim that `every YAML parsing identically under both loaders` was false in the file that pass had just edited, and bin/validate could not see it. Respelled as a block sequence; both strings byte-for-byte unchanged. (b) `8 verbatim files` in this file and in distilled/README.md against schema/README.md's 7; 7 is right and the eighth was schema/README.md itself, which docs/extraction.md excludes from the convention. (c) V-0005 was keyed `cddl:` and is an ABN