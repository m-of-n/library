  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "176 located statements and 50 verbatim fenced blocks (33 source ranges once blocks split only by a page break are rejoined) across 32 headings, §1 through Appendix F; excludes Status of This Memo, Copyright, ToC, About This Document, §7.2 informative references, List of Figures, List of Tables, Acknowledgments, Contributors and Author's Address, each omission named in the file's own preamble. Mechanically verified in both passes: 176/176 bullets contiguous substrings of the source with every locator naming the section that actually contains the quote, 50/50 fences byte-exact source line runs with no page furniture leaked, all 7 tables and the one figure caption captured in full. The verify pass added six statements the extract pass had dropped (three in §1.1, one in §3, two in §4)"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "73 entries R-0001 to R-0073 in source order, no gaps: 40 stated carrying all 40 BCP 14 occurrences (33 MUST, 3 MUST NOT, 1 RECOMMENDED, 1 NOT RECOMMENDED, 1 MAY, 1 SHOULD) and 33 inferred carrying none. source and extracted keyword counts both 40; reconciliation filled anyway because five of the 40 occurrences impose nothing on a CDE implementation — two inside an invented example protocol in Appendix B, two inside a block quote of RFC 9679 §4.2, one a bare meta-mention. Verify pass: the 40 source occurrences were re-enumerated by line and matched one-to-one onto the 40 stated entries, none claimed twice and none unclaimed; all 73 quoted texts re-confirmed as contiguous substrings with correct locators; Appendix C's share corrected from 29 to 30"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "2 verbatim (cde-control-operator.cddl, the .cde/.cdeseq definition; try-float16-encode.c, Appendix F Figure 1) and 5 derived: a constraints CDDL, a shortest-head CDDL, and pseudocode for encoding, for checking and for float shortest-head. The source ships no encoding procedure and no decoder algorithm, so both are ours. Known under-constraint recorded in schema/README.md: CDDL cannot express shortest-head or sibling map ordering. Verify pass: both verbatim extracts re-checked byte for byte against the cached source (source line 915; source lines 2195-2215), try-float16-encode.c corrected so it compiles (the figure caption had been left bare inside the verbatim region), and the source's try_float16_encode cross-checked against an independent implementation over 125,560 inputs including all 65,536 binary16 patterns with no disagreement. Cross-check pass: the derived pseudocode and the data-model rules of both derived CDDL files were transcribed into one runnable layered checker and every vector that carries bytes was put through it (see the examples artifact). The stated division of labour holds and is lopsided — of the 21 runnable invalid vectors the CDDL layer catches 0, the head layer 9, the value layer 12 and cde-encode section 4.2's extra-code check the 1 that nothing else does; the CDDL layer's nil score is the known under-constraint measured, not a defect. Both verbatim regions re-confirmed byte-identical (source line 915; source lines 2195-2215) and cc -c still exits 0. Still wanted: a run through a real RFC 8610 parser, which is not installed here"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "24 structures, 81 fields: the data item head, each major type's encoded layout as CDE constrains it, the shortest-head argument forms, float shortening and the bytewise map-key comparison. Cross-check pass: constrained_by is populated on every field — 63 of the 81 carry 240 links to 62 of the 73 requirements, and 18 carry an explicit empty list with its reason on the field. The linking rule and its three corollaries are written into the file header so a reviewer can argue with a specific link, and the per-field source locators are kept beside the links because they are what the links were resolved against. The 18 unlinked fields are a result: six of the eight major-type assignments (CDE pins only major types 0 and 1, via R-0048/R-0049), the IEEE 754 interchange widths in all three float layouts plus nan-encoding.exponent (R-0044 enumerates a NaN's preserved value as sign bit, quiet bit and payload, which are exactly that structure's other three fields), three of Appendix F's four fields because no requirement in requirements.yaml has an Appendix F locator at all, and major-type-2-byte-string.content, the only major-type content field with no link against text-string content's four"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "118 vectors V-0001 to V-0118: 96 valid, 22 invalid, every invalid one carrying a violates; 117 carry hex. Drawn from Tables 4-7 and from prose. Verify pass: Tables 4, 5 and 6 re-parsed out of the source and diffed row for row (22/22, 63/63, 8/8 in order and byte for byte), all 9 distinct Table 7 serializations covered, and all 117 hex-bearing vectors re-decoded with a CBOR decoder and IEEE 754 arithmetic written for the purpose rather than a library — every diagnostic, decoded and expect agreed, the 8 EDN-form diagnostics additionally re-encoded from scratch, and every invalid vector has an independently computed violation backing its violates. Appendices D, E and F do not declare themselves informative (A, B and C do), so their tables were treated as in scope; this overlaps normative.md deliberately. Cross-check pass: all 117 hex-bearing vectors were run against this record's own distilled/schema/ through a layered checker transcribed from the derived pseudocode and CDDL — 96 valid accepted, 21 invalid rejected, 0 failures — and V-0012, which prints no bytes because the source prints none, was synthesised exactly as its own notes instruct and is rejected, with the definite-length counterpart accepted as a control. All 96 valid vectors also satisfy the re-encode check the source itself proposes in the Appendix C preamble, byte for byte. Every invalid vector now carries violates_requirements (55 links across the 22, every one resolving to a defined entry) and 0 are rejected under a rule those ids fail to name. The checker was shown to discriminate on 54 cases the source never prints: 54 correct, 0 wrong"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "what CDE requires; adopt/adapt/reject; a rule-by-rule table of every CDE rule against option 5 as drafted; a three-level answer to 'what is option 5's relation to CDE', the first level being that option 5 names no canonicalisation algorithm at all and so has not discharged R-O-03; the cost of citing a draft that expired 2026-04-17; and four findings on where CDE cuts against MD-3, each naming an option. Cross-check pass: all 28 rows of the option-5 table are traced to requirement ids — 20 resolve, 8 do not and the reason is stated per row (two score an absence; six score informative statements carrying no BCP 14 keyword), the practical finding being that five of the rows our profile most needs to cite are citable only as prose rather than as a numbered requirement of CDE. Two new source defects recorded, D-5 and D-6: C.1.1 item 1 scopes itself to 'any argument' and then enumerates signed integer ranges, so the argument width table exists only for integers; and the C.1.2 scoping problem bites a third time at item 5, where leading zero bytes MUST be ignored by one checklist and rejected by another"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "CDE defines an encoding constraint set that other protocols reference, not an exchange. §4: 'It does not specify encoding; CBOR protocols can specify the use of CDE (or simply definite-length-only encoding) independent of the CDDL data model.' The only role-shaped language is an informative aside in Appendix B describing a hypothetical application protocol — informative by the appendix's own first line, hypothetical by its own wording ('an application protocol that needs to represent birthdate/times could specify'), and offered as a negative example the document immediately faults ('While this specification is interoperable, it lacks determinism'). Every failure path is local; the verify pass counted four, not two: an encoder's serialization failure (§3.3), a decoder that advertises support rejecting non-conforming input (Appendix C preamble), the same preamble's duplicate-key error handling, and a CDE-checking decoder refusing to present data to the application (C.3.2). None involves a peer, a response or an error code."
    - kind: state-machine
      reason: "No states, transitions or lifecycle beyond a one-shot IANA registration. The two things that could be mistaken for machines are algorithms — the bytewise key comparison of §3.3 and Appendix F's try_float16_encode — and both are captured, but NOT both verbatim; the cross-check pass corrected that claim, which this field and distilled/README.md both carried. try_float16_encode is verbatim, at distilled/schema/try-float16-encode.c. The key comparison is DERIVED: its sentences are quoted verbatim in distilled/normative.md (§3.3) and inside distilled/schema/cde-encode.derived.pseudocode.txt section 3, but the step-by-step rendering there is ours and the .derived. infix says so. schema/README.md names only two verbatim files and never listed it. Saying 'both verbatim' was our error, not the source's, and under FX-1's derived/verbatim convention it is precisely the error the convention exists to prevent."
