distillation:
  standard: "FX-1"
  # NO `profile` ON PURPOSE. Pass 1 of 3 ran; verify and cross-check did not,
  # so this extraction is unfinished — and an unfinished extraction is neither
  # `full` nor `partial` (docs/extraction.md). bin/check-pr-extraction will
  # report it as declaring no profile. That report is correct: library#39 owns
  # finishing it, and the artifacts are readable but not buildable-on until
  # then.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "170 located statements and 50 verbatim fenced blocks (from 39 source ranges) across 32 headings, §1 through Appendix F; excludes Status of This Memo, Copyright, ToC, About This Document, §7.2 informative references, Acknowledgments, Contributors and Author's Address, each omission named in the file's own preamble. Mechanically verified: 170/170 bullets contiguous substrings, 50/50 fences byte-exact source line runs with no page furniture leaked"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "73 entries R-0001 to R-0073 in source order, no gaps: 40 stated carrying all 40 BCP 14 occurrences (33 MUST, 3 MUST NOT, 1 RECOMMENDED, 1 NOT RECOMMENDED, 1 MAY, 1 SHOULD) and 33 inferred carrying none. source and extracted keyword counts both 40; reconciliation filled anyway because five of the 40 occurrences impose nothing on a CDE implementation — two inside an invented example protocol in Appendix B, two inside a block quote of RFC 9679 §4.2, one a bare meta-mention"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "2 verbatim (cde-control-operator.cddl, the .cde/.cdeseq definition; try-float16-encode.c, Appendix F Figure 1) and 5 derived: a constraints CDDL, a shortest-head CDDL, and pseudocode for encoding, for checking and for float shortest-head. The source ships no encoding procedure and no decoder algorithm, so both are ours. Known under-constraint recorded in schema/README.md: CDDL cannot express shortest-head or sibling map ordering"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "24 structures, 81 fields: the data item head, each major type's encoded layout as CDE constrains it, the shortest-head argument forms, float shortening and the bytewise map-key comparison. constrained_by populated only where pass 1 was confident from the source's own section numbering; completing it is a cross-check-pass job that has not run"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "118 vectors V-0001 to V-0118: 96 valid, 22 invalid, every invalid one carrying a violates; 117 carry hex. Drawn from Tables 4-7 and from prose. Tables 5 and 6 were spot-checked, not exhaustively re-derived — that is a verify-pass job. Appendices D, E and F do not declare themselves informative (A, B and C do), so their tables were treated as in scope; this overlaps normative.md deliberately"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "what CDE requires; adopt/adapt/reject; a rule-by-rule table of every CDE rule against option 5 as drafted; a three-level answer to 'what is option 5's relation to CDE', the first level being that option 5 names no canonicalisation algorithm at all and so has not discharged R-O-03; the cost of citing a draft that expired 2026-04-17; and four findings on where CDE cuts against MD-3, each naming an option"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "CDE defines an encoding constraint set that other protocols reference, not an exchange. §4: 'It does not specify encoding; CBOR protocols can specify the use of CDE (or simply definite-length-only encoding) independent of the CDDL data model.' The only role-shaped language is an informative aside in Appendix B describing a hypothetical application protocol. Exactly two failure paths exist and both are local: an encoder's serialization failure (§3.3) and a CDE-checking decoder refusing to present data to the application (C.3.2)."
    - kind: state-machine
      reason: "No states, transitions or lifecycle beyond a one-shot IANA registration. The two things that could be mistaken for machines are algorithms — the bytewise key comparison of §3.3 and Appendix F's try_float16_encode — and both are captured verbatim under distilled/schema/."
  passes:
