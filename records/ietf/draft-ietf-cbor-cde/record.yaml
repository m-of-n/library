      effort: max
      date: "2026-10-18"
      note: >
        Adversarial re-derivation, not review. Re-ran bin/bcp14-count and
        enumerated the 40 source occurrences by line, matching each to exactly
        one stated requirement; re-checked all 73 requirement texts and all 176
        normative.md bullets for contiguity and locator; re-parsed Tables 4-6
        out of the source and diffed them row for row against the vectors;
