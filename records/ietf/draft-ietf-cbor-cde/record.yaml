        distilled/README.md; the largest were the structural finding
        (overstated), Appendix C's keyword share (29 -> 30), six dropped
        normative statements, and schema/try-float16-encode.c, which did not
        compile. No profile was declared at the end of this pass, because
        cross-check had not yet run; see the entry below.
    - pass: cross-check
      by: "claude-opus-5 (single agent, had neither extracted nor verified)"
      effort: max
      date: "2026-10-18"
      note: >
        Artifact against artifact; the cached source was opened only to
        adjudicate a disagreement between two of our own files, and nothing
        pass 2 established was re-derived. Ran the suite that had never been
        run: transcribed cde-check.derived.pseudocode.txt,
        float-shortest-head.derived.pseudocode.txt, cde-encode's head() and
        lex_strictly_greater(), and the data-model rules of both derived CDDL
        files into one runnable layered checker, and put every vector carrying
        bytes through it -- 117 of 118, 96 valid accepted and 21 invalid
        rejected, 0 failures, each rejection under a rule the vector's own
        violates cites; V-0012 prints no bytes and was synthesised as its notes
        instruct. Showed the checker discriminates on 54 cases the source never
        prints (54 correct, 0 wrong) and ran the source's own
        re-encode-and-compare check over all 96 valid vectors byte-exact. The
        layers divide as schema/README.md claims: CDDL 0, head 9, value 12, and
        the section 4.2 extra-code check the 1 nothing else catches.
        Completed messages.yaml's constrained_by, which pass 1 had left off
        entirely because requirements.yaml was being written in parallel: 81
        fields, 240 links, 62 of 73 requirements, 18 fields deliberately at zero
        with a reason each, and the linking rule written into the file header.
        Wired examples/vectors.yaml's violates prose to requirement ids (55
        links over the 22 invalid vectors, 0 rejected under a rule they fail to
        name) and traced all 28 rows of design-notes.md's option-5 table to ids.
        Reconciled every count pass 2 moved across record.yaml, distilled/
        README.md, requirements.yaml, design-notes.md and summary.md: none was
        stale. Found two new source defects (D-5, D-6) and one place where our
        own files contradicted each other -- the state-machine not_applicable
        reason claimed both algorithms were held verbatim when one is derived,
        now corrected here and in distilled/README.md. No quoted source text, no
        locator, no requirement and no vector changed. reviewed_by left empty
        throughout: that is a human's.
