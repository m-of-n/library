distillation:
  standard: "FX-1"
  # NO `profile` ON PURPOSE. Pass 1 of 3 ran; verify and cross-check did not,
  # so this extraction is unfinished — and an unfinished extraction is neither
  # `full` nor `partial` (docs/extraction.md). bin/check-pr-extraction will
  # report it as declaring no profile. That report is correct: library#39 owns
  # finishing it, and the artifacts are readable but not buildable-on until
  # then.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "176 located statements and 50 verbatim fenced blocks (33 source ranges once blocks split only by a page break are rejoined) across 32 headings, §1 through Appendix F; excludes Status of This Memo, Copyright, ToC, About This Document, §7.2 informative references, List of Figures, List of Tables, Acknowledgments, Contributors and Author's Address, each omission named in the file's own preamble. Mechanically verified in both passes: 176/176 bullets contiguous substrings of the source with every locator naming the section that actually contains the quote, 50/50 fences byte-exact source line runs with no page furniture leaked, all 7 tables and the one figure caption captured in full. The verify pass added six statements the extract pass had dropped (three in §1.1, one in §3, two in §4)"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "73 entries R-0001 to R-0073 in source order, no gaps: 40 stated carrying all 40 BCP 14 occurrences (33 MUST, 3 MUST NOT, 1 RECOMMENDED, 1 NOT RECOMMENDED, 1 MAY, 1 SHOULD) and 33 inferred carrying none. source and extracted keyword counts both 40; reconciliation filled anyway because five of the 40 occurrences impose nothing on a CDE implementation — two inside an invented example protocol in Appendix B, two inside a block quote of RFC 9679 §4.2, one a bare meta-mention. Verify pass: the 40 source occurrences were re-enumerated by line and matched one-to-one onto the 40 stated entries, none claimed twice and none unclaimed; all 73 quoted texts re-confirmed as contiguous substrings with correct locators; Appendix C's share corrected from 29 to 30"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "2 verbatim (cde-control-operator.cddl, the .cde/.cdeseq definition; try-float16-encode.c, Appendix F Figure 1) and 5 derived: a constraints CDDL, a shortest-head CDDL, and pseudocode for encoding, for checking and for float shortest-head. The source ships no encoding procedure and no decoder algorithm, so both are ours. Known under-constraint recorded in schema/README.md: CDDL cannot express shortest-head or sibling map ordering. Verify pass: both verbatim extracts re-checked byte for byte against the cached source (source line 915; source lines 2195-2215), try-float16-encode.c corrected so it compiles (the figure caption had been left bare inside the verbatim region), and the source's try_float16_encode cross-checked against an independent implementation over 125,560 inputs including all 65,536 binary16 patterns with no disagreement"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "24 structures, 81 fields: the data item head, each major type's encoded layout as CDE constrains it, the shortest-head argument forms, float shortening and the bytewise map-key comparison. constrained_by is deliberately absent throughout, for the reason the file's own header gives: no R-NNNN id is derivable from the source's section numbering, so each structure and field carries the exact source locator instead and the cross-check pass wires the links mechanically"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "118 vectors V-0001 to V-0118: 96 valid, 22 invalid, every invalid one carrying a violates; 117 carry hex. Drawn from Tables 4-7 and from prose. Verify pass: Tables 4, 5 and 6 re-parsed out of the source and diffed row for row (22/22, 63/63, 8/8 in order and byte for byte), all 9 distinct Table 7 serializations covered, and all 117 hex-bearing vectors re-decoded with a CBOR decoder and IEEE 754 arithmetic written for the purpose rather than a library — every diagnostic, decoded and expect agreed, the 8 EDN-form diagnostics additionally re-encoded from scratch, and every invalid vector has an independently computed violation backing its violates. Appendices D, E and F do not declare themselves informative (A, B and C do), so their tables were treated as in scope; this overlaps normative.md deliberately"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "what CDE requires; adopt/adapt/reject; a rule-by-rule table of every CDE rule against option 5 as drafted; a three-level answer to 'what is option 5's relation to CDE', the first level being that option 5 names no canonicalisation algorithm at all and so has not discharged R-O-03; the cost of citing a draft that expired 2026-04-17; and four findings on where CDE cuts against MD-3, each naming an option"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "CDE defines an encoding constraint set that other protocols reference, not an exchange. §4: 'It does not specify encoding; CBOR protocols can specify the use of CDE (or simply definite-length-only encoding) independent of the CDDL data model.' The only role-shaped language is an informative aside in Appendix B describing a hypothetical application protocol — informative by the appendix's own first line, hypothetical by its own wording ('an application protocol that needs to represent birthdate/times could specify'), and offered as a negative example the document immediately faults ('While this specification is interoperable, it lacks determinism'). Every failure path is local; the verify pass counted four, not two: an encoder's serialization failure (§3.3), a decoder that advertises support rejecting non-conforming input (Appendix C preamble), the same preamble's duplicate-key error handling, and a CDE-checking decoder refusing to present data to the application (C.3.2). None involves a peer, a response or an error code."
    - kind: state-machine
      reason: "No states, transitions or lifecycle beyond a one-shot IANA registration. The two things that could be mistaken for machines are algorithms — the bytewise key comparison of §3.3 and Appendix F's try_float16_encode — and both are captured verbatim under distilled/schema/."
  passes:
    - pass: extract
      by: "claude-opus-5 (6 parallel agents, one per artifact kind)"
      effort: max
      date: "2026-10-16"
      note: "each agent read only .cache/draft-ietf-cbor-cde.txt, never a summary and never another agent's output"
    - pass: verify
      by: "claude-opus-5 (single adversarial agent, did not extract)"
      effort: max
      date: "2026-10-18"
      note: >
        Adversarial re-derivation, not review. Re-ran bin/bcp14-count and
        enumerated the 40 source occurrences by line, matching each to exactly
        one stated requirement; re-checked all 73 requirement texts and all 176
        normative.md bullets for contiguity and locator; re-parsed Tables 4-6
        out of the source and diffed them row for row against the vectors;
        re-decoded all 117 hex-bearing vectors with a CBOR decoder and IEEE 754
        arithmetic written for the pass (exact rationals, round-half-even, no
        library); and cross-checked Appendix F's C function against an
        independent implementation over 125,560 inputs. Eight corrections
        landed, listed under "What the verify pass changed" in
        distilled/README.md; the largest were the structural finding
        (overstated), Appendix C's keyword share (29 -> 30), six dropped
        normative statements, and schema/try-float16-encode.c, which did not
        compile. No profile is declared: cross-check has not run.
