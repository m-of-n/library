          [IEEE754]'s and the content is the value. For a NaN the Q-bit and
          the payload inside this field ARE constrained, and those links are
          carried by nan-encoding.q_bit and nan-encoding.nan_payload.
        layout: |
          Bits 9-0: the low 2 bits of the first argument byte followed by
          all 8 bits of the second. For a NaN this splits into the Q-bit
          (bit 9) and a 9-bit payload (bits 8-0); see nan-encoding.
    layout: |
      f9 B1 B0
        B1 bit 7     sign
        B1 bits 6-2  exponent (5 bits)
        B1 bits 1-0  trailing significand bits 9-8
        B0 bits 7-0  trailing significand bits 7-0
      Source-exhibited values (Table 5): `f90000` 0.0, `f98000` -0.0,
