        type: bits(5)
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD. The exponent width and the
          all-zeros/all-ones class encoding are [IEEE754] binary16's, which
          this document names but never restates. CDE decides WHICH format
          carries a value (the initial_byte links above); it never constrains
          the bits inside a format. The one exception is the NaN triple, and
          it is modelled as its own structure: see nan-encoding.
        layout: |
          Bits 14-10, i.e. bits 6-2 of the first argument byte. All zeros
