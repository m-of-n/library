      forms arrived — which is exactly why re-encoding under CDE and
      comparing bytes (§C) is a valid conformance check.
  - name: nan-encoding
    locator: "§1.2 (NaN payload, Trivial NaN); §3.1.2 item 3; §C.1.1 item 2; Table 5"
    encoding: CBOR
    fields:
      - name: sign_bit
        type: bits(1)
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0004"
          - "draft-ietf-cbor-cde#R-0017"
          - "draft-ietf-cbor-cde#R-0044"
        layout: |
          The top bit of the interchange form. Part of "the value to be
          preserved" (§C.1.1 item 2), so a negative NaN stays negative
          through shortening: `fff8000000000000` shortens to `f9fe00`,
          not to `f97e00`.
      - name: exponent
        type: bits(5)
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD, and the omission is exact
          rather than accidental: R-0044 enumerates what a NaN's preserved
          value consists of -- 'the sign bit, the quiet bit, and the NaN
          payload' -- and those are precisely the other three fields of this
          structure, all three of which carry links. The all-ones exponent
          that makes the value a NaN at all is [IEEE754]'s and is inherited.
        layout: |
          All ones in every format (5 bits for binary16, 8 for binary32,
          11 for binary64). The informative aside in §3.1.2 describes
          widening as successively adding "the necessary one bits to the
          exponent and trailing zero bits to the payload to build the next
          longer form".
      - name: q_bit
        type: bits(1)
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0014"
          - "draft-ietf-cbor-cde#R-0015"
          - "draft-ietf-cbor-cde#R-0016"
          - "draft-ietf-cbor-cde#R-0044"
          - "draft-ietf-cbor-cde#R-0047"
        layout: |
          "the first bit (Q-bit) of the trailing significand component"
          (§1.2), i.e. the most significant bit of the trailing
          significand: bit 9 in binary16, bit 22 in binary32, bit 51 in
          binary64. §3.1.2 item 3 pins it: "the CBOR encoding always uses
          a leading bit of 1 in the significand to encode a quiet NaN; the
          use of signaling NaNs by application protocols is NOT RECOMMENDED
          but when presented by an application these are encoded by using a
          leading significand bit of 0." Preserved by shortening.
      - name: nan_payload
        type: bits(51)
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0004"
          - "draft-ietf-cbor-cde#R-0012"
          - "draft-ietf-cbor-cde#R-0013"
          - "draft-ietf-cbor-cde#R-0017"
          - "draft-ietf-cbor-cde#R-0041"
          - "draft-ietf-cbor-cde#R-0042"
          - "draft-ietf-cbor-cde#R-0044"
          - "draft-ietf-cbor-cde#R-0045"
          - "draft-ietf-cbor-cde#R-0046"
          - "draft-ietf-cbor-cde#R-0047"
          - "draft-ietf-cbor-cde#R-0058"
        layout: |
          "All but the first bit (Q-bit) of the trailing significand
          component of the [IEEE754] value for a NaN. Separate from sign
          bit and Q-bit" (§1.2). Widths: 9 bits (binary16), 22 (binary32),
          51 (binary64). Preserved by shortening, zero or non-zero
          (§C.1.1 item 2).
    layout: |
      A NaN is encoded as the shortest of binary64, binary32 and binary16
      that preserves sign bit, Q-bit and payload (§C.1.1 item 2). The
      shortening is purely a bit operation on the payload:

        N = (significand bits of the source format)
            - (significand bits of the target format)
          = 13   binary32 -> binary16   (23 - 10)
          = 29   binary64 -> binary32   (52 - 23)
          = 42   binary64 -> binary16   (52 - 10)
        Shorten only if the rightmost N bits of the payload are all zero;
        then drop them, keeping sign and Q-bit in their new positions.

      §C.1.1 item 2 states it as removing "the rightmost N bits of the
      payload, where N is the difference in the number of bits in the
      significand (mantissa representation) between the original format
      and the shortest format. This trimming is performed only (preserves
      the value only) if all the rightmost bits removed are zero", with
      the corollary "(This means that a double or single quiet NaN that
      has a zero NaN payload will always be represented in a
      half-precision quiet NaN.)" §3.1.2 item 3 says the same from the
      other side: "shorter forms of encodings for a NaN are used when that
      can be achieved by only removing trailing zeros in the NaN payload".

      Trivial NaN (§1.2): "A NaN with a zero sign bit, and a payload
      composed of zero bits only. Note that in [IEEE754], all-zero payload
      implies that the Q-bit is set to one. Represented in CDE as the
      three bytes 0xf97e00." §3.1.2 item 3 adds that most applications use
      only this value.

      Worked rows from Table 5 (source hex, with the arithmetic derived):
        float'7fbfe000' -> `f97dff`   binary32 sNaN, 9-bit payload, low 13
                                      payload bits zero, so it trims
        float'7fbff000' -> `fa7fbff000`  10-bit payload: a 1 falls inside
                                      the 13 bits, no shorter encoding
        float'7fc00000' -> `f97e00`   quiet, zero payload
        float'7fffe000' -> `f97fff`   quiet, 9-bit payload
        float'7ffff000' -> `fa7ffff000`  10-bit payload, stays binary32
        float'7f800001' -> `fa7f800001`  rightmost payload bit set, stays
        float'7ff0000020000000' -> `fa7f800001`  binary64 sNaN whose only
                                      set payload bit is bit 29, so the
                                      low 29 bits are zero and it trims
        float'7ff43d7c40000000' -> `fa7fa1ebe2`  arbitrary pattern, trims
        float'7ff7fffff0000000' -> `fb7ff7fffff0000000`  23 leftmost
                                      payload bits set, no shorter form
        float'7ff8000000000000' -> `f97e00`
        float'7ffffc0000000000' -> `f97fff`
        float'7fffffffe0000000' -> `fa7fffffff`
        float'7fffffffffffffff' -> `fb7fffffffffffffff`
        float'fe00'             -> `f9fe00`   negative, zero payload
        float'fff0000000000001' -> `fbfff0000000000001`
        float'fff8000000000000' -> `f9fe00`
        float'ffffffffe0000000' -> `faffffffff`
    notes: |
      Why item 2's corollary names only QUIET NaNs: an all-ones exponent
      with an all-zero significand is Infinity, not a NaN, so a
      zero-payload signaling NaN does not exist and the case needs no rule
      (derived). Practical traps the source does flag: [IEEE754] "leaves
      several details about handling NaNs implementation-defined", and the
      getpayload/setpayload interface of Section 9.7 of [IEEE754] (and
      [C23]) is size-specific, so "The representation size for interchange
      will be chosen by Preferred Serialization for each value, which may
      not always be the size that was intended" — the recommended handling
      is to widen every decoded NaN to a common size (usually binary64)
      before using those functions. Notation gap: "there is no established
      EDN for notating NaNs with non-zero payloads at the time of
      writing", so Table 5 falls back to float'hex' and the test vectors
      must be read as raw interchange hex. Cross-reference for more
      serialisations: Appendix A.1.2 of [I-D.bormann-cbor-numbers]
      (referenced, not reproduced).
  - name: half-precision-encode-result
    locator: "§F (Figure 1, try_float16_encode)"
    encoding: CBOR
    fields:
      - name: s16
        type: bits(16)
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD. No requirement in
          ../requirements.yaml has an Appendix F locator -- Figure 1 carries
          no BCP 14 keyword and states no obligation; it is example code. s16,
          mant and exp are decompositions of an [IEEE754] binary64 input,
          fixed by that standard. Only return_value is reachable from this
          document's own rules, because the bytes it returns are the ones the
          float rules mandate.
        layout: |
          `b64 >> 48 & 0x8000UL` — the binary64 sign bit moved into the
          binary16 sign position (bit 15). Every successful return path
          adds to it.
      - name: mant
        type: bits(52)
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD; see s16.
        layout: "`b64 & 0xfffffffffffffUL` — the 52-bit trailing significand."
      - name: exp
        type: bits(11)
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD; see s16.
        layout: "`b64 >> 52 & 0x7ffUL` — the 11-bit biased exponent."
      - name: return_value
        type: int32
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0039"
          - "draft-ietf-cbor-cde#R-0040"
          - "draft-ietf-cbor-cde#R-0042"
          - "draft-ietf-cbor-cde#R-0043"
          - "draft-ietf-cbor-cde#R-0045"
          - "draft-ietf-cbor-cde#R-0046"
        layout: |
          -1 when no binary16 form preserves the value; otherwise
          0x0000..0xFFFF, the two bytes that, "prefixed with 0xF9, is
          suitable to encode the value" (§F). The caller emits
          f9 <hi> <lo>, big-endian.
    layout: |
      Decision order, exactly as Figure 1 runs (the only executable
      statement of the shortening rule in the document):

        if exp == 0 and mant == 0:        return s16
            zero only; binary64 subnormals "are out of range" for
            binary16, so they fall through to -1 later
        if 999 <= exp <= 1008:            binary16 subnormal, exp16 = 0
            if mant & ((1 << (1051 - exp)) - 1): return -1   bits lost
            return s16 + ((mant + 0x10000000000000) >> (1051 - exp))
            the added 0x10000000000000 restores the binary64 implicit
            leading 1 before the shift
        if mant & 0x3ffffffffff:          return -1
            the low 42 bits must be zero — 42 = 52 - 10, the same N the
            NaN rule uses, so this single test covers finite values,
            infinities and NaN payloads alike (derived correspondence)
        if 1009 <= exp <= 1038:           normalized binary16
            return s16 + ((exp - 1008) << 10) + (mant >> 42)
        if exp == 2047:                   Infinity or NaN
            return s16 + 0x7c00 + (mant >> 42)
            mant >> 42 carries the Q-bit and the 9 surviving payload bits
            into the binary16 trailing significand
        return -1

      Checks against the tables (derived): 0.0 returns 0x0000 and -0.0
      returns 0x8000, giving `f90000` and `f98000`; Infinity returns
      0x7c00, giving `f97c00`; a quiet NaN with zero payload returns
      0x7e00, giving `f97e00`; exp = 999 with mant = 0 returns 0x0001,
      the smallest binary16 subnormal `f90001`.
    notes: |
      Portability defect in the published code: `b64` is typed
      `unsigned long` and the code shifts it by 48 and masks with
      `0xfffffffffffffUL`. C guarantees `unsigned long` only 32 bits, so
      the function is silently wrong on any ILP32 target; `uint64_t` is
      what the algorithm needs. Scope note: the function takes a binary64
      input, so an encoder holding a binary32 value must widen it first,
      and nothing in §F covers the binary32 -> binary16 step directly.
      §F explains why the code is here at all: Appendix D of RFC 8949
      published only half-precision DECODING code, and "CDE
      implementations that support floating point Numbers not only need to
      decode, but also to encode their 16-bit format".
  - name: indefinite-length-encoding
    locator: "§2; §3.2; §A.1; §C.2; Table 6; §E"
    encoding: CBOR
    fields:
      - name: head_with_ai_31
        type: uint5
