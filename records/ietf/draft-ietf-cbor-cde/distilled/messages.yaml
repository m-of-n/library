record: draft-ietf-cbor-cde
reviewed_by: ""
# Every structure draft-ietf-cbor-cde-13 defines or constrains.
#
# CDE is an encoding profile, not a protocol: the structures here are the
# encoded forms themselves — the data item head, each major type's encoded
# layout as this profile narrows it, the preferred-serialization forms, the
# map-key ordering and the comparison it specifies, float shortening, the tag
# and application-extension structures CDE admits, and the two CDDL control
# operators it registers.
#
# `constrained_by`: POPULATED, cross-check pass, 2026-10-18. All 81 fields of
# the 24 structures below now carry the key. 63 of them hold 240 links to 62 of
# the 73 entries in ../requirements.yaml; the other 18 hold an explicit empty
# list and a `constrained_by_note` saying why. Pass 1 left the key off
# altogether on purpose — requirements.yaml was being written in parallel and a
# wrong id is worse than a missing one — so each structure and field carries the
# exact source locator (section, item, bullet, table row) of the text that
# constrains it. Those locators are kept: they are what the links were resolved
# against, and they survive a renumbering of the R-ids.
#
# THE LINKING RULE, stated so a reviewer can disagree with a specific link
# rather than with the whole table. A requirement R is linked to a field F iff
# R determines which values or bytes F may take, or R explicitly names F's
# subject as the thing it governs. Three corollaries decide the hard cases:
#
#  (a) Transitive consequences are NOT linked. R-0022 (the comparison "fails
#      entirely" when it runs out of byte pairs) reaches map.key and both keys
#      of lexicographic-map-key-sorting, but not major-type-0's argument, whose
#      admissible values it does not change.
#  (b) Where a bit is modelled as its own field in a dedicated structure, the
#      link goes to that field, not to the wider field that contains it. The
#      NaN Q-bit lives inside float16/32/64's `trailing_significand`, but
#      R-0014/R-0016 are linked to nan-encoding.q_bit alone. This is why the
#      three interchange-layout structures carry links only on `initial_byte`
#      and `sign`: CDE decides WHICH format carries a value, never the bits
#      inside a format, and the one exception is the NaN triple.
#  (c) A requirement that names one of CDE's three constituents as the thing it
#      governs is linked to that constituent's field in
#      cde-encoding-constraint-set, whether it governs it by defining it
#      (R-0006, R-0018, R-0020) or by imposing a duty with respect to it
#      (R-0033, R-0063, R-0069). That is the "names F's subject" half of the
#      rule, and it is what keeps the encoder/decoder duty sentences from
#      floating free of the structures they are duties about.
#
# ELEVEN REQUIREMENTS ARE LINKED TO NO FIELD, and that is a result, not a hole.
# None constrains a structure. R-0001 (§1.2, RFC 8949's conventions apply) and
# R-0025 (§5, RFC 8949's security considerations apply) are incorporations by
# reference. R-0003 (§1.2) is the document's own RECOMMENDED status. R-0024 (§4)
# invites OTHER specifications to define their own control operators, not these
# two. R-0026 (§5) is the hinge sentence about a deployment, not an encoding.
# R-0028 to R-0032 are the five occurrences requirements.yaml's reconciliation
# names as imposing nothing on CDE — two from an invented example protocol in
# Appendix B, two from a block quote of RFC 9679 §4.2 whose force belongs to
# that record, and one meta-mention of the word MUST. R-0072 (C.3.2, the
# fail-closed rule) is the only one worth arguing about: it governs what a
# decoder may hand to the application, and no structure here models that —
# messages.yaml holds encoded forms, not API surface.
#
# EIGHTEEN FIELDS CARRY NO LINK, each with its reason on the field. They fall
# into three groups and all three are substantive: six of the eight major-type
# assignments (CDE pins only major types 0 and 1, on the integer structures via
# R-0048/R-0049; the rest are RFC 8949's untouched); the [IEEE754] interchange
# widths (`exponent` and `trailing_significand` in all three float layouts, plus
# nan-encoding.exponent); and three of Appendix F's four fields, because NO
# requirement in ../requirements.yaml has an Appendix F locator at all — Figure
# 1 carries no BCP 14 keyword and states no obligation. The eighteenth is
# major-type-2-byte-string.content: the only major-type content field with no
# link, against major-type-3-text-string.content's four. UTF-8 validity is the
# single data-content constraint CDE has and it reaches text strings only.
#
# ONE TENSION IS RECORDED AT THE FIELD RATHER THAN SMOOTHED OVER. R-0018 (§3.2,
# "indefinite length encoding MUST NOT be used") and R-0053/R-0054 (C.1.2,
# indefinite-length arrays, maps and strings "MUST be accepted") are linked to
# the same fields — indefinite-length-encoding's three, and the `ai` of major
# types 2 to 5. They point in opposite directions. C.1.2's preamble scopes
# itself to partial preferred-serialization decoders, which takes CDE decoders
# out of scope, but it never says so in terms; see ../design-notes.md.
#
# Byte values: where the source itself exhibits a byte (Tables 4, 5, 6, 7,
# Appendix E, Figure 1) it is cited. Where the initial-byte arithmetic
# (major_type << 5 | ai) or an IEEE 754 field width is inherited from
# Section 3 of RFC 8949 or from [IEEE754] rather than restated by CDE, the
# note says so. Bytes computed here and not shown by the source are marked
# "derived".
messages:
  - name: data-item-head
    locator: "§C.1 (defines 'ai'); §2, §3.1 (shortest-head); §3 of RFC 8949 (inherited)"
    encoding: CBOR
    fields:
      - name: major_type
        type: uint3
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD. The 3-bit major-type field and
          all eight of its assignments are RFC 8949 Section 3's; CDE changes
          none of them and states nothing about them. Only the two INTEGER
          assignments are pinned by this document, and they are pinned on the
          integer structures (R-0048, R-0049), not here.
        layout: |
          Bits 7-5 of the initial byte — the 3-bit field that the 5-bit ai
          field "follows" (§C.1). Values 0-7 select, in order: unsigned
          integer, negative integer, byte string, text string, array, map,
          tag, simple value / floating point (§C.1.1 item 1 names major
          type 7 as "floating-point and simple values"). CDE changes no
          major type assignment; it only removes encoding choices within
          each.
      - name: additional_information
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0018"
          - "draft-ietf-cbor-cde#R-0034"
        layout: |
          Bits 4-0 of the initial byte; the source abbreviates this field
          "ai" (§C.1). CDE constrains which ai value may be used for a
          given argument (§C.1.1 item 1, the shortest-head constraint):
            ai = 0..23       the argument IS ai; no bytes follow
            ai = 24  (0x18)  one argument byte follows
            ai = 25  (0x19)  two argument bytes follow
            ai = 26  (0x1a)  four argument bytes follow
            ai = 27  (0x1b)  eight argument bytes follow
            ai = 31  (0x1f)  indefinite length — MUST NOT be used under
                             definite-length-only (§3.2, §C.2)
          For major type 7, ai 25/26/27 instead select binary16, binary32
          and binary64 (§C.1.1 item 2), and ai 24 (initial byte 0xf8)
          carries a one-byte simple value.
      - name: argument
        type: uint64
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0034"
        layout: |
          0, 1, 2, 4 or 8 bytes immediately following the initial byte,
          big-endian, unsigned; the count is fixed by ai alone. Present
          only when ai >= 24. Its meaning depends on the major type: the
          value itself (mt 0/1), a length in bytes (mt 2/3), an element
          count (mt 4), a key/value pair count (mt 5), a tag number
          (mt 6), a simple value or the IEEE 754 interchange bits (mt 7).
    layout: |
      initial byte = (major_type << 5) | ai
      [argument: 0, 1, 2, 4 or 8 bytes, big-endian, per ai]
      [content: for mt 2/3 exactly `argument` raw bytes; for mt 4
       `argument` data items; for mt 5 2 * `argument` data items in
       key, value, key, value order; for mt 6 exactly one data item]
      Head = initial byte + argument. Under CDE every head in a data item
      — including string lengths, array element counts and map pair
      counts, not just numeric values — carries the shortest ai that
      represents its argument (§C.1.1 item 1). Failing example `98020405`
      (Table 6): an array of two elements that used ai = 0x18 with a
      one-byte count instead of ai = 2, i.e. `820405` (derived).
    notes: |
      §C.1.1 writes ai values in hexadecimal (ai = 0x18, 0x19, 0x1a) where
      RFC 8949's own tables are decimal (24, 25, 26); a reader cross-reading
      the two must translate. The initial-byte composition
      (major_type << 5 | ai) and the ai 28-30 "not well-formed" reservation
      are inherited from Section 3 of RFC 8949 and are never restated by
      this document. CDE adds nothing to the head beyond (a) shortest ai
      and (b) the exclusion of ai = 31.
  - name: shortest-head-argument
    locator: "§C.1.1 item 1 (bullets 1-4); Table 4 (§D.1); Table 7 (§E)"
    encoding: CBOR
    fields:
      - name: ai_0_to_23_immediate
        type: uint5
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0035"
          - "draft-ietf-cbor-cde#R-0052"
        layout: |
          Arguments 0..23 MUST be encoded in the same byte as the major
          type (§C.1.1 item 1 bullet 1): ai = argument, no bytes follow.
          The bullet states it in value terms for the integer major types:
          "0 to 23 and -1 to -24 MUST be encoded in the same byte as the
          major type". Evidence: `00` (0), `17` (23), `20` (-1), `37`
          (-24) in Table 4.
      - name: ai_0x18_uint8
        type: uint8
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0036"
          - "draft-ietf-cbor-cde#R-0052"
        layout: |
          One additional byte (§C.1.1 item 1 bullet 2): arguments 24..255,
          i.e. integers 24 to 255 and -25 to -256. Evidence: `1818` (24),
          `18ff` (255), `3818` (-25), `38ff` (-256) in Table 4.
      - name: ai_0x19_uint16
        type: uint16
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0037"
          - "draft-ietf-cbor-cde#R-0052"
        layout: |
          Two additional bytes, big-endian (§C.1.1 item 1 bullet 3):
          arguments 256..65535, i.e. integers 256 to 65535 and -257 to
          -65536. Evidence: `190100` (256), `19ffff` (65535), `390100`
          (-257), `39ffff` (-65536) in Table 4.
      - name: ai_0x1a_uint32
        type: uint32
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0038"
          - "draft-ietf-cbor-cde#R-0052"
        layout: |
          Four additional bytes, big-endian (§C.1.1 item 1 bullet 4):
          arguments 65536..4294967295, i.e. integers 65536 to 4294967295
          and -65537 to -4294967296. Evidence: `1a00010000`,
          `1affffffff`, `3a00010000`, `3affffffff` in Table 4.
      - name: ai_0x1b_uint64
        type: uint64
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0052"
        layout: |
          Eight additional bytes, big-endian: arguments
          4294967296..18446744073709551615, i.e. integers 4294967296 to
          18446744073709551615 and -4294967297 to -18446744073709551616.
          Evidence: `1b0000000100000000`, `1bffffffffffffffff`,
          `3b0000000100000000`, `3bffffffffffffffff` in Table 4; ai = 0x1b
          is named for binary64 in §C.1.1 item 2.
    layout: |
      One of five forms, selected solely by the magnitude of the argument:
        (mt<<5 | n)                        n = 0..23
        (mt<<5 | 0x18) nn                  24..255
        (mt<<5 | 0x19) nn nn               256..65535
        (mt<<5 | 0x1a) nn nn nn nn         65536..4294967295
        (mt<<5 | 0x1b) nn nn nn nn nn nn nn nn   4294967296..2^64-1
      All argument bytes are big-endian. No leading-zero argument byte may
      be spent to reach a longer form: `1900ff` for 255 is listed as not
      CDE (Table 6), as are `1801`, `190001`, `1a00000001` and
      `1b0000000000000001` for the integer 1 (Table 7).
    notes: |
      Source gap: the bullet list in §C.1.1 item 1 enumerates ai only up to
      0x1a (four additional bytes) and never states the 0x1b case for
      non-float arguments. The 8-byte form is established only by Table 4
      and by the float rule in item 2, so an implementer working from the
      checklist alone has no written rule for arguments above 4294967295.
      The checklist also frames the bullets as integer VALUE ranges while
      the rule it restates is about the ARGUMENT: for major type 1 the
      argument is -1 minus the value, and for major types 2-6 it is a
      length, count or tag number whose range is the plain unsigned one.
  - name: major-type-0-unsigned-integer
    locator: "§3.1.1; §C.1.1 items 1 and 3; Table 4 (§D.1); Table 7 (§E)"
    encoding: CBOR
    fields:
      - name: major_type
        type: uint3
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0048"
          - "draft-ietf-cbor-cde#R-0059"
        layout: "Bits 7-5 of the initial byte = 0b000."
      - name: ai
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0007"
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0035"
          - "draft-ietf-cbor-cde#R-0036"
          - "draft-ietf-cbor-cde#R-0037"
          - "draft-ietf-cbor-cde#R-0038"
        layout: |
          Bits 4-0. Shortest form per shortest-head-argument: initial byte
          0x00-0x17 for values 0..23, else 0x18, 0x19, 0x1a or 0x1b.
      - name: argument
        type: uint64
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0007"
          - "draft-ietf-cbor-cde#R-0048"
        layout: |
          0/1/2/4/8 big-endian bytes; the value of the data item IS the
          argument. Full range 0..18446744073709551615 (2^64 - 1).
    layout: |
      00..17                                0..23
      18 nn                                 24..255
      19 nn nn                              256..65535
      1a nn nn nn nn                        65536..4294967295
      1b nn nn nn nn nn nn nn nn            4294967296..18446744073709551615
      CDE mandate (§3.1.1): "Integers that can be represented by basic
      major type 0 and 1 MUST be encoded using the (shortest-head)
      deterministic encoding defined for them" — every integer in
      0..2^64-1 is major type 0, never tag 2. Restated as §C.1.1 item 3
      bullet 1: "Positive integers from 0 to 2^64 - 1 MUST be encoded as a
      type 0 integer." Table 6 rejects `c243010000` (65536 as a bignum):
      "Integer value too small for bignum".
    notes: |
      Two independent constraints bite here: shortest ai within major type
      0 (so `1900ff` for 255 fails) and the choice of major type 0 over tag
      2 across the whole basic range (so `c24101` for 1 fails, Table 7).
      Note the scope difference between body and checklist: §C.1.1 item 3
      is guarded by "If tags 2 and 3 are supported", while §3.1.1's mandate
      in the normative body is unconditional.
  - name: major-type-1-negative-integer
    locator: "§3.1.1; §C.1.1 items 1 and 3; Table 4 (§D.1)"
    encoding: CBOR
    fields:
      - name: major_type
        type: uint3
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0049"
          - "draft-ietf-cbor-cde#R-0059"
        layout: "Bits 7-5 of the initial byte = 0b001."
      - name: ai
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0007"
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0035"
          - "draft-ietf-cbor-cde#R-0036"
          - "draft-ietf-cbor-cde#R-0037"
          - "draft-ietf-cbor-cde#R-0038"
        layout: |
          Bits 4-0, shortest form; initial byte 0x20-0x37 for -1..-24,
          else 0x38, 0x39, 0x3a or 0x3b.
      - name: argument
        type: uint64
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0007"
          - "draft-ietf-cbor-cde#R-0049"
        layout: |
          0/1/2/4/8 big-endian bytes holding n, where the value of the data
          item is -1 - n. The shortest-head decision is made on n, not on
          the negative value; §C.1.1 item 1 expresses the same boundaries
          as "-1 to -24", "-25 to -256", "-257 to -65536", "-65537 to
          -4294967296".
    layout: |
      20..37                                -1..-24
      38 nn                                 -25..-256
      39 nn nn                              -257..-65536
      3a nn nn nn nn                        -65537..-4294967296
      3b nn nn nn nn nn nn nn nn            -4294967297..-18446744073709551616
      §C.1.1 item 3 bullet 2: "Negative integers from -(2^64) to -1 MUST be
      encoded as a type 1 integer", i.e. never tag 3 within that range.
    notes: |
      Table 4's endpoints fix the boundary exactly: -18446744073709551616
      (-(2^64)) is `3bffffffffffffffff`, and the next value down,
      -18446744073709551617, is the smallest negative bignum
      `c349010000000000000000`.
  - name: major-type-2-byte-string
    locator: "§3.2; §C.2; §C.1.1 item 1; Table 4, Table 6, §E"
    encoding: CBOR
    fields:
      - name: major_type
        type: uint3
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD; the assignment is RFC 8949's.
        layout: "Bits 7-5 of the initial byte = 0b010."
      - name: ai
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0018"
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0054"
          - "draft-ietf-cbor-cde#R-0061"
        layout: |
          Bits 4-0 = the length of the content in bytes, in shortest form:
          initial byte 0x40-0x57 for lengths 0..23, then 0x58 (one length
          byte), 0x59 (two), 0x5a (four), 0x5b (eight). ai = 31 (initial
          byte 0x5f, indefinite length) MUST NOT be used under
          definite-length-only. Evidence: `41` (1 byte), `42` (2), `43`
          (3), `49` (9), `4a` (10) appear in Tables 4 and 6 and in §E.
      - name: content
        type: bstr
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD, and it is the only major-type
          content field in this file with no link. CDE constrains the byte
          string's HEAD (the ai links above) and forbids chunking, but says
          nothing whatever about the content octets. Contrast major-
          type-3-text-string.content, which carries four links: UTF-8 validity
          is the single data-content constraint CDE has, and it reaches text
          strings only.
        layout: |
          Exactly `argument` raw bytes, uninterpreted. CDE places no
          constraint on the bytes themselves — only on the head and on the
          prohibition of chunking.
    layout: |
      40..57 <content>                      lengths 0..23
      58 nn <content>                       24..255
      59 nn nn <content>                    256..65535
      5a nn nn nn nn <content>              65536..4294967295
      5b nn*8 <content>                     above that
      Definite length only: the indefinite form `5f <chunks> ff` is not
      CDE. Table 6 rejects `5f4101420203ff` (EDN `(_ h'01', h'0203')`) for
      "Indefinite length encoding".
    notes: |
      The byte string is also the content type of tags 2 and 3, where CDE
      adds the no-leading-zeros rule; see tag-2-positive-bignum. §E notes
      explicitly that preferred-serialization alone does NOT exclude an
      indefinite-length byte string as tag 2 content
      (`0xc25f41004101ff`) — it is definite-length-only that rules it out,
      which is why both constituents are needed for a unique encoding.
  - name: major-type-3-text-string
    locator: "§3.2; §C.2; §C.3.1 item 3 and its note; §C.3.2 item 3; Table 6"
    encoding: CBOR
    fields:
      - name: major_type
        type: uint3
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD; the assignment is RFC 8949's.
        layout: "Bits 7-5 of the initial byte = 0b011."
      - name: ai
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0018"
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0054"
          - "draft-ietf-cbor-cde#R-0061"
        layout: |
          Bits 4-0 = the length of the content in BYTES (not characters),
          shortest form: initial byte 0x60-0x77 for 0..23, then 0x78,
          0x79, 0x7a, 0x7b. ai = 31 (0x7f) MUST NOT be used. Evidence:
          `61` (1 byte) and `62` (2 bytes) in Table 6's map example.
      - name: content
        type: tstr
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0066"
          - "draft-ietf-cbor-cde#R-0067"
          - "draft-ietf-cbor-cde#R-0068"
          - "draft-ietf-cbor-cde#R-0071"
        layout: |
          Exactly `argument` bytes of UTF-8. CDE encoders MUST emit "only
          valid UTF-8 in major type 3 text strings" (§C.3.1 item 3, part of
          basic validity), and CDE-checking decoders MUST check that
          validity (§C.3.2 item 3). No Unicode normalization is required:
          "CDE does NOT include a requirement for Unicode normalization"
          (§C.3.1 note).
    layout: |
      60..77 <utf8>                         lengths 0..23
      78 nn <utf8>                          24..255
      79 nn nn <utf8>                       256..65535
      7a nn nn nn nn <utf8>                 65536..4294967295
      7b nn*8 <utf8>                        above that
      Text strings are the common map key, so their encoded bytes — head
      byte(s) first, then UTF-8 — are what the lexicographic comparison
      walks; see lexicographic-map-key-sorting.
    notes: |
      UTF-8 validity is the one data-content constraint CDE carries, and it
      arrives through basic validity (Section 5.3.1 of RFC 8949) rather
      than through any encoding constraint. Normalization sits at the ALDR
      level instead: §B cites dCBOR's NFC requirement
      ([I-D.mcnally-deterministic-cbor]) as an example of an
      application-level exclusion, explicitly not part of CDE. §C.3.1's
      note points at Appendix C of
      [I-D.bormann-dispatch-modern-network-unicode] for the rationale.
  - name: major-type-4-array
    locator: "§3.2; §C.2; §C.1.1 item 1; Table 6"
    encoding: CBOR
    fields:
      - name: major_type
        type: uint3
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD; the assignment is RFC 8949's.
        layout: "Bits 7-5 of the initial byte = 0b100."
      - name: ai
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0018"
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0053"
          - "draft-ietf-cbor-cde#R-0061"
          - "draft-ietf-cbor-cde#R-0062"
        layout: |
          Bits 4-0 = the number of elements, shortest form: initial byte
          0x80-0x97 for 0..23 elements, then 0x98, 0x99, 0x9a, 0x9b.
          ai = 31 (0x9f) MUST NOT be used. Evidence: Table 6 rejects
          `98020405` ("Array length not in preferred serialization") for a
          two-element array, which must be `820405` (derived).
      - name: elements
        type: "data item *"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0063"
          - "draft-ietf-cbor-cde#R-0069"
        layout: |
          Exactly `argument` data items follow the head, each itself fully
          CDE-encoded. Element ORDER is semantic in an array and CDE does
          not touch it — only map entries are reordered.
    layout: |
      80..97 <element>*                     0..23 elements
      98 nn <element>*                      24..255
      99 nn nn <element>*                   256..65535
      9a nn nn nn nn <element>*             65536..4294967295
      9b nn*8 <element>*                    above that
    notes: |
      The §C.2 aside warns about exactly this head: some encoders switch to
      indefinite length for arrays and maps "with 256 or more
      elements/entries, to use the slightly smaller serialization size"
      (derived: 1 head byte + 1 break byte against a 3-byte definite head),
      and "such behavior needs to be turned off for CDE".
  - name: major-type-5-map
    locator: "§3.3; §2; §C.3.1 items 2-3; §C.3.2 items 2-3; Table 6"
    encoding: CBOR
    fields:
      - name: major_type
        type: uint3
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD; the assignment is RFC 8949's.
          R-0070 names 'map (major type 5) entries', but what it governs is
          the ordering of the entries, not the major-type field.
        layout: "Bits 7-5 of the initial byte = 0b101."
      - name: ai
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0018"
          - "draft-ietf-cbor-cde#R-0034"
          - "draft-ietf-cbor-cde#R-0053"
          - "draft-ietf-cbor-cde#R-0061"
          - "draft-ietf-cbor-cde#R-0062"
        layout: |
          Bits 4-0 = the number of key/value PAIRS (not of data items),
          shortest form: initial byte 0xa0-0xb7 for 0..23 pairs, then
          0xb8, 0xb9, 0xba, 0xbb. ai = 31 (0xbf) MUST NOT be used.
          Evidence: `a2` for the two-entry map in Table 6.
      - name: entries
        type: "(key, value) *"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0019"
          - "draft-ietf-cbor-cde#R-0020"
          - "draft-ietf-cbor-cde#R-0064"
          - "draft-ietf-cbor-cde#R-0066"
          - "draft-ietf-cbor-cde#R-0067"
          - "draft-ietf-cbor-cde#R-0070"
        layout: |
          2 * `argument` data items follow the head, in the order
          key_0, value_0, key_1, value_1, ... key_(n-1), value_(n-1).
          A key is an arbitrary CDE-encoded data item of any major type,
          not only a text string.
      - name: key
        type: "data item"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0019"
          - "draft-ietf-cbor-cde#R-0020"
          - "draft-ietf-cbor-cde#R-0022"
          - "draft-ietf-cbor-cde#R-0064"
          - "draft-ietf-cbor-cde#R-0065"
          - "draft-ietf-cbor-cde#R-0066"
          - "draft-ietf-cbor-cde#R-0067"
          - "draft-ietf-cbor-cde#R-0070"
        layout: |
          The first item of each pair. Its complete CDE encoding — initial
          byte, argument bytes, content bytes, and the encodings of any
          nested items — is the byte string the ordering constraint
          compares (§3.3: "the (CDE-encoded) map key of a map entry").
      - name: value
        type: "data item"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0063"
          - "draft-ietf-cbor-cde#R-0069"
        layout: |
          The second item of each pair, itself fully CDE-encoded. Values
          take no part in the ordering.
    layout: |
      a0..b7 <key value>*                   0..23 pairs
      b8 nn <key value>*                    24..255 pairs
      b9 nn nn <key value>*                 256..65535 pairs
      ba nn nn nn nn <key value>*           65536..4294967295 pairs
      bb nn*8 <key value>*                  above that
      Ordering invariant (§3.3): for every i in 1..n-1, the encoded byte
      string of key_i MUST be bytewise lexicographically STRICTLY GREATER
      than that of key_(i-1) — see lexicographic-map-key-sorting for the
      comparison itself. The constraint is stated pairwise over
      immediately adjacent entries, which given a total order makes the
      whole map ascending; strictness is what also excludes duplicate
      keys. It is "trivially satisfied by data items that do not contain
      maps or only contain maps that have zero or one map entry" (§3.3).
      Table 6 rejects `a2616200616101` (EDN `{"b":0,"a":1}`) for
      "Incorrect map key ordering": key_0 = `6162` ("b"), key_1 = `6161`
      ("a"), and `6161` is not greater than `6162`. The CDE form is
      `a2616101616200` (derived).
    notes: |
      Three separate obligations land on a map: shortest-ai pair count,
      definite length, and strict key ordering. A fourth — no duplicate
      keys — is a VALIDITY requirement (Sections 5.3.1 and 5.6 of RFC
      8949), not an encoding constraint, and CDE encoders MUST meet it
      (§C.3.1 item 3) while CDE-checking decoders MUST reject it (§C.3.2
      item 2, "including rejecting duplicate map keys"). The §3.3 aside
      explains why this is cheap under CDE: entries with the same key have
      the same deterministic key serialization and therefore sort
      adjacent, so strict-increase checking catches them. The aside also
      flags the one case strict-increase does NOT catch: Section 5.6.1 of
      RFC 8949 treats -0.0 and 0.0 as equal keys, yet their encodings
      `f90000` and `f98000` differ and sort apart, so a map containing
      both passes lexicographic-map-sorting while being invalid CBOR;
      "this needs to be checked with extra code for a full validity
      checker".
  - name: lexicographic-map-key-sorting
    locator: "§3.3; §C.3.1 item 2; §C.3.2 item 2"
    encoding: CBOR
    fields:
      - name: preceding_encoded_key
        type: bstr
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0019"
          - "draft-ietf-cbor-cde#R-0020"
          - "draft-ietf-cbor-cde#R-0021"
          - "draft-ietf-cbor-cde#R-0022"
          - "draft-ietf-cbor-cde#R-0064"
          - "draft-ietf-cbor-cde#R-0065"
          - "draft-ietf-cbor-cde#R-0070"
        layout: |
          The complete CDE encoding of the key of the map entry
          "immediately preceding" the current one in the encoding of the
          map (§3.3). Call it A, indexed A[0], A[1], ... Bytes, not
          characters, and not the decoded value.
      - name: current_encoded_key
        type: bstr
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0019"
          - "draft-ietf-cbor-cde#R-0020"
          - "draft-ietf-cbor-cde#R-0021"
          - "draft-ietf-cbor-cde#R-0022"
          - "draft-ietf-cbor-cde#R-0064"
          - "draft-ietf-cbor-cde#R-0065"
          - "draft-ietf-cbor-cde#R-0070"
        layout: |
          The complete CDE encoding of the current entry's key. Call it B.
          B MUST compare strictly greater than A.
      - name: compared_byte
        type: uint8
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0021"
          - "draft-ietf-cbor-cde#R-0065"
        layout: |
          At each step j, the pair A[j] and B[j], each taken as "the
          unsigned integer value of" that byte (§3.3), i.e. 0..255 —
          never as a signed char, which is the classic C implementation
          error here.
    layout: |
      Comparison procedure, verbatim in structure from §3.3 ("The bytewise
      lexicographic comparison steps in parallel through the bytes of the
      two encoded map keys, comparing the (unsigned integer values of the)
      bytes. If the bytes differ, the difference determines the outcome of
      the comparison. If the bytes are the same, the next pair of bytes
      are examined. If there is no such next pair, the comparison and thus
      CDE serialization fails entirely"):

        j = 0
        loop:
          if j < len(A) and j < len(B):
            a = A[j] as unsigned 8-bit (0..255)
            b = B[j] as unsigned 8-bit (0..255)
            if a != b:            B > A iff b > a   -> decided, done
            j = j + 1             bytes equal, continue
          else:
            no next pair exists -> FAIL the whole CDE serialization

      The failure branch is not an ordering outcome but an abort. §3.3
      gives both reasons: either the two keys are byte-identical ("the map
      keys of the two map entries are the same, which is not valid in a
      CBOR map"), or one would be an extension of the other, "which is not
      possible in the self-delimiting CBOR encoding". So under CDE the
      only reachable failure is the duplicate-key case, and a conforming
      encoder never emits a map whose keys do not strictly increase.

      What is compared is the ENCODED key including its head, so the
      ordering falls out of the byte layout: first by the initial byte
      (hence by major type, since that is its top 3 bits, then by ai),
      then by the argument bytes, then by content. Worked example from
      Table 6: "a" encodes `6161` and "b" encodes `6162`; j = 0 compares
      0x61 to 0x61 (equal), j = 1 compares 0x61 to 0x62, so "a" sorts
      first and `{"b":0,"a":1}` is rejected.
    notes: |
      Three traps an implementer must get from this section and nowhere
      else. (1) The keys are compared after CDE encoding, so the ordering
      of a numeric key depends on its preferred serialization — change the
      head and you change the sort position. (2) The comparison includes
      the head bytes, so for short text strings the length byte dominates
      the first comparison and shorter strings can sort before longer ones
      that would precede them in a content-only comparison (derived from
      the stated rule: "b" is `6162` and "ab" is `626162`, so "b" sorts
      first). (3) CDE does NOT use the alternative, length-first
      deterministic ordering: §3 points at Section 4.2.3 of RFC 8949 as a
      distinct variant of deterministic encoding "now being phased out",
      but never restates its rule, so a reader who has to recognise legacy
      data must go to RFC 8949 for it. §3.3's own aside notes the
      pragmatic side: lexicographic-map-sorting already requires the
      encoder to hold all map keys at once, unlike plain validity
      checking, which "may be particularly difficult to implement for
      streaming encoders".
  - name: major-type-6-tagged-data-item
    locator: "§1.2; §2; §3.1 and §3.1.1 aside; §3.1.2 item 5; Table 4"
    encoding: CBOR
    fields:
      - name: major_type
        type: uint3
        required: true
        constrained_by: []
        constrained_by_note: >-
          NO REQUIREMENT CONSTRAINS THIS FIELD; the assignment is RFC 8949's.
        layout: "Bits 7-5 of the initial byte = 0b110."
      - name: ai
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0034"
        layout: |
          Bits 4-0 encode the tag number as the argument, shortest form:
          initial byte 0xc0-0xd7 for tags 0..23, then 0xd8 (one byte),
          0xd9 (two), 0xda (four), 0xdb (eight). Evidence: `c2` and `c3`
          for tags 2 and 3 in Table 4. The source never exhibits the
          multi-byte forms, though it names tags 24 (as the CDDL head
          `#6.24` in §4) and 1001 (§B), which need 0xd8 and 0xd9.
      - name: tag_number
        type: uint64
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0034"
        layout: "0/1/2/4/8 big-endian argument bytes when ai >= 24."
      - name: tag_content
        type: "data item"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0006"
          - "draft-ietf-cbor-cde#R-0051"
          - "draft-ietf-cbor-cde#R-0063"
          - "draft-ietf-cbor-cde#R-0069"
        layout: |
          Exactly one data item follows the tag head and is itself fully
          CDE-encoded; CDE recurses through tag content without
          exception. In addition, a tag's own Preferred Serialization —
          "Tag specifications can also define the Preferred Serialization
          of the specific tag that are defining" (§1.2) — is part of the
          preferred-serialization constraint: §2 states that "the
          shortest-head encoding constraint together with the preferred
          serializations of tags constitute the preferred-serialization
          encoding constraint".
    layout: |
      c0..d7 <content>                      tags 0..23
      d8 nn <content>                       24..255
      d9 nn nn <content>                    256..65535
      da nn nn nn nn <content>              65536..4294967295
      db nn*8 <content>                     above that
      This is the extension point CDE admits: a tag defines its own
      preferred serialization for its content, and that definition is
      pulled into preferred-serialization and therefore into cde. The
      only tags whose encoding CDE itself pins down are 2 and 3.
    notes: |
      §3.1.1's aside is the live warning for extension authors: most tags
      "capture more specific application semantics than tag 2/3 and
      therefore may be harder to define a deterministic encoding for",
      the mapping of platform types onto tag content may need extra
      attention, and "not in all cases the tag's deterministic encoding
      constraints will be confined to its definition of Preferred
      Serialization". The document therefore "recommends that new tag
      registrations address deterministic encoding in the context of
      CDE". §3.1.2 item 5 draws the boundary for numeric tags: CDE "does
      not presume equivalence of basic floating point values with floating
      point values using other representations (e.g., tag 4/5)", and a new
      tag "might define Preferred Serializations that are basic major-type
      7 floating point values; this is unproblematic as long as the tag
      definition does not attempt to redefine the Preferred Serialization
      for basic floating point values". Tags named but never defined here:
      0, 1, 4, 5, 24, 1001.
  - name: tag-2-positive-bignum
    locator: "§3.1.1; §C.1.1 item 3; §C.1.2 item 5; Table 4; Table 6; §E"
    encoding: CBOR
    fields:
      - name: tag_head
        type: uint8
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0008"
          - "draft-ietf-cbor-cde#R-0059"
        layout: "The single byte 0xc2: major type 6 with ai = 2."
      - name: content_head
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0008"
          - "draft-ietf-cbor-cde#R-0018"
          - "draft-ietf-cbor-cde#R-0034"
        layout: |
          A major type 2 definite-length byte string head giving the
          length of the magnitude in bytes, shortest form (0x40-0x57,
          0x58 nn, ...). Indefinite length is excluded by
          definite-length-only; §E shows `0xc25f41004101ff` as a
          serialization that preferred-serialization alone would still
          permit.
      - name: magnitude
        type: bstr
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0007"
          - "draft-ietf-cbor-cde#R-0008"
          - "draft-ietf-cbor-cde#R-0048"
          - "draft-ietf-cbor-cde#R-0050"
          - "draft-ietf-cbor-cde#R-0051"
          - "draft-ietf-cbor-cde#R-0060"
        layout: |
          The unsigned magnitude, big-endian. "Leading zeros MUST NOT be
          present in the byte string content of tag 2 and 3" (§C.1.1 item
          3 bullet 3), so the first content byte is never 0x00. Because
          every value up to 2^64-1 must instead be major type 0 (§3.1.1),
          a CDE tag 2 content is at least 9 bytes long (derived from the
          two rules; Table 4's smallest bignum
          `c249010000000000000000` is exactly that: `49` = byte string of
          9, content 01 followed by eight 00 = 2^64).
    layout: |
      c2 <bstr-head> <magnitude>
      value = the big-endian unsigned integer in `magnitude`
      Admissible range under CDE: 18446744073709551616 (2^64) and up.
      Rejected by Table 6: `c243010000` (65536, "Integer value too small
      for bignum"). Rejected by Table 7: `c24101`, `c2420001`,
      `c243000001`, `c25f41004101ff` for the integer 1. §E's worked
      example for 10^20 is the only full three-line byte breakdown the
      document gives:
        C2                       # tag(2)
           49                    # bytes(9)
              056BC75E2D63100000 #
    notes: |
      §C.1.1 item 3's parenthetical extends both rules inward: "(This also
      applies to the use of tags 2 and 3 within other tags, such as 4 or
      5.)" — a bignum mantissa inside a decimal fraction or bigfloat is
      held to the same no-leading-zeros and range rules. Apparent
      conflict between two informative checklists: §C.1.2 item 5 tells a
      preferred-serialization-accepting decoder that "Leading zero bytes
      in the tag content of a tag 2 or 3 MUST be ignored", while a
      CDE-checking decoder MUST reject exactly those bytes (§C.3.2 item 1,
      via preferred-serialization; Table 6 lists
      `c34a00010000000000000000` as not CDE). The two apply to different
      roles, but the document never says so in either place.
  - name: tag-3-negative-bignum
    locator: "§3.1.1; §C.1.1 item 3; Table 4; Table 6"
    encoding: CBOR
    fields:
      - name: tag_head
        type: uint8
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0008"
          - "draft-ietf-cbor-cde#R-0059"
        layout: "The single byte 0xc3: major type 6 with ai = 3."
      - name: content_head
        type: uint5
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0008"
          - "draft-ietf-cbor-cde#R-0018"
          - "draft-ietf-cbor-cde#R-0034"
        layout: |
