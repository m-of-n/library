        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0009"
          - "draft-ietf-cbor-cde#R-0011"
          - "draft-ietf-cbor-cde#R-0012"
          - "draft-ietf-cbor-cde#R-0039"
          - "draft-ietf-cbor-cde#R-0040"
          - "draft-ietf-cbor-cde#R-0042"
          - "draft-ietf-cbor-cde#R-0056"
          - "draft-ietf-cbor-cde#R-0057"
        layout: "ai = 0x1a, initial byte 0xfa, four argument bytes."
      - name: double_binary64
        type: float64
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0009"
          - "draft-ietf-cbor-cde#R-0011"
          - "draft-ietf-cbor-cde#R-0012"
          - "draft-ietf-cbor-cde#R-0039"
          - "draft-ietf-cbor-cde#R-0042"
          - "draft-ietf-cbor-cde#R-0056"
          - "draft-ietf-cbor-cde#R-0057"
        layout: "ai = 0x1b, initial byte 0xfb, eight argument bytes."
    layout: |
      Selection rule (§C.1.1 item 2): "If multiple of these encodings
      preserve the precision of the value to be encoded, only the shortest
      form of these MUST be emitted." The test is exact value
      preservation, evaluated binary16 first, then binary32, then
      binary64 — not a magnitude range test. §3.1.2 adds that CDE itself
      defines no further float constraint beyond shortest-head, and
      spells out five consequences, in the order of the bullet list at
      the end of Section 4.2.2 of RFC 8949:
        1. The two zeros get no special action: -0.0 encodes as `f98000`.
        2. No mixing of integers and floating point numbers — an integral
           float stays a float, so 2.0 is `f94000`, never `02`.
        3. NaNs follow the same preferred-serialization rules (see
           nan-encoding).
        4. "There is no special handling of subnormal values": they
           shorten exactly when the shorter form preserves the value, so
           `fa00000001` (the smallest positive binary32 subnormal) stays
           binary32 while `f90001` is a binary16 subnormal in its own
           right.
        5. No presumed equivalence with tag 4/5 representations.
      Consequence stated in §3.1.2: "the application has no control over
      the representation size, e.g., the number 1.0 will always be
      serialized as a binary16 floating point number (0xf93c00)".
      Rejected by Table 6: `fa41280000` for 10.5, which fits binary16
      (derived: `f94940`), and `fa7fc00000` for a zero-payload quiet NaN,
      which must be `f97e00`.
    notes: |
      Two shortening boundaries are worth having as test cases from Table
      5: 10.559998512268066 is `fa4128f5c1` (binary32 is exact) while the
      next value up, 10.559998512268068, needs `fb40251eb820000001`; and
      2^68 is `fa61800000`, i.e. a large magnitude can still be
      binary32-exact. Table 5's "adjacent to" rows exist precisely to pin
      the boundaries: a value one ulp away from the largest binary16
      cannot shorten (65503.99999999999 is `fb40effbffffffffff`). Note
      also what §3.1.2 declines to do: the float/integer choice, the
      choice between tag 4/5 and basic floats, and any NaN canonicalisation
      are all pushed to ALDR rules (§B), so two CDE encoders handed
      different data-model inputs for "the same" number legitimately
      produce different bytes.
