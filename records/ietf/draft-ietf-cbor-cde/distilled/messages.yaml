  - name: preferred-float-size-selection
    locator: "§3.1.2 (items 1-5); §C.1.1 item 2; Table 5; Table 6"
    encoding: CBOR
    fields:
      - name: half_binary16
        type: float16
        required: false
        constrained_by:
          - "draft-ietf-cbor-cde#R-0004"
          - "draft-ietf-cbor-cde#R-0009"
          - "draft-ietf-cbor-cde#R-0010"
          - "draft-ietf-cbor-cde#R-0011"
          - "draft-ietf-cbor-cde#R-0012"
          - "draft-ietf-cbor-cde#R-0017"
          - "draft-ietf-cbor-cde#R-0039"
          - "draft-ietf-cbor-cde#R-0040"
          - "draft-ietf-cbor-cde#R-0042"
