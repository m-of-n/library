          - "draft-ietf-cbor-cde#R-0053"
          - "draft-ietf-cbor-cde#R-0054"
          - "draft-ietf-cbor-cde#R-0061"
        layout: |
          The terminating byte, exhibited as the trailing `ff` of
          `5f4101420203ff` and of `c25f41004101ff`; the document never
          names it or gives its encoding (ai = 31 on major type 7).
    layout: |
      (mt<<5 | 0x1f) <chunks or items> ff
      This structure is what CDE forbids: "The definite-length-only
      encoding constraint means that indefinite length encoding MUST NOT
      be used" (§3.2), excluding it "both for (binary/text) strings and
      for arrays and maps" (§C.2). Table 6 lists `5f4101420203ff` as not
      CDE for "Indefinite length encoding".
    notes: |
      This is the one constituent of CDE that is an INTEROPERABILITY
      constraint in its own right rather than an encoder guideline (§2,
      Table 1): it exists so that partial decoders can omit the code path
      entirely, since "Indefinite length strings require non-trivial
      implementation effort when a with zero allocation/zero copy approach
      is in use" (§3.2 aside; the sentence is garbled in -13). Two
      encoder behaviours must be switched off for CDE: streaming without a
      known length, and the size optimisation for arrays/maps "with 256 or
      more elements/entries" (§C.2 aside). §E is the sharpest statement of
      why definite-length-only is needed alongside
      preferred-serialization: for 10^20 "there are multiple
      serializations that would also count as _preferred_ serializations,
      as the preferred serialization constraint by itself does not exclude
      indefinite length encoding of the byte string that is the content of
      tag 2."
  - name: cde-encoding-constraint-set
    locator: "§1.2 (definitions); §2 and Table 1; §3; §C.3"
    encoding: CBOR
    fields:
      - name: preferred_serialization
        type: "encoding constraint"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0002"
          - "draft-ietf-cbor-cde#R-0005"
          - "draft-ietf-cbor-cde#R-0006"
          - "draft-ietf-cbor-cde#R-0033"
          - "draft-ietf-cbor-cde#R-0063"
          - "draft-ietf-cbor-cde#R-0069"
          - "draft-ietf-cbor-cde#R-0073"
        layout: |
          "the shortest-head encoding constraint together with the
          preferred serializations of tags" (§2; §3.1: "a combination of
          the shortest-head constraint and tag-specific encoding
          constraints defined to be part of preferred-serialization").
          Defined for the basic data model in Section 4.1 of RFC 8949.
      - name: definite_length_only
        type: "encoding constraint"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0002"
          - "draft-ietf-cbor-cde#R-0005"
          - "draft-ietf-cbor-cde#R-0018"
          - "draft-ietf-cbor-cde#R-0033"
          - "draft-ietf-cbor-cde#R-0061"
          - "draft-ietf-cbor-cde#R-0062"
          - "draft-ietf-cbor-cde#R-0063"
          - "draft-ietf-cbor-cde#R-0069"
          - "draft-ietf-cbor-cde#R-0073"
        layout: "Indefinite length encoding MUST NOT be used (§3.2)."
      - name: lexicographic_map_sorting
        type: "encoding constraint"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0002"
          - "draft-ietf-cbor-cde#R-0005"
          - "draft-ietf-cbor-cde#R-0019"
          - "draft-ietf-cbor-cde#R-0020"
          - "draft-ietf-cbor-cde#R-0033"
          - "draft-ietf-cbor-cde#R-0064"
          - "draft-ietf-cbor-cde#R-0070"
          - "draft-ietf-cbor-cde#R-0073"
        layout: |
          Map entries sorted bytewise lexicographically by their
          CDE-encoded map keys, strictly increasing (§3.3).
    layout: |
      Not a byte layout: an encoding constraint SET. §1.2 defines the
      composition — "Several encoding constraints can be combined into an
      encoding constraint set, which is itself an encoding constraint that
      requires that all encoding constraints in the set are met" — and §3
      instantiates it: "Formally, Common Deterministic Encoding (CDE) is
      an encoding constraint (named cde for short), built from multiple
      constituent encoding constraints ... CDE combines the constraints of
      preferred-serialization with definite-length-only and the
      lexicographic-map-sorting constraint." All three hold
      simultaneously and recursively, at every nesting level of a data
      item. §C.3.1 restates them as three encoder obligations and adds
      basic validity (Section 5.3.1 of RFC 8949); §C.3.2 restates them as
      three decoder checks plus the rule that a CDE-checking decoder "MUST
      NOT present to the application a decoded data item that fails one of
      these checks (except maybe via special diagnostic channels with no
      potential for confusion with a correctly CDE-decoded data item)".
    notes: |
      Naming defect in -13: Table 1 and the §2 text that introduces it
      call the second constituent `definite-length-encoding`, while §3,
      §3.2, §A.1 and §C.2 call it `definite-length-only`. Table 1's own
      `cde` row spells the combination with the former name. §1.2 fixes
      the naming convention ("lower-case words separated by hyphens,
      rendered in a typewriter font"), which makes the two spellings two
      different constraint names on the page. Status: CDE "is RECOMMENDED
      for implementation and specification where deterministic encoding is
      required or desired" (§1.2). Conformance shortcut for a decoder that
      does not support CDE natively (§C): "re-encode the decoded data with
      CDE and check for bit-to-bit equality with the original input".
      Layering: ALDR rules sit above CDE and are out of scope (§1.1, §B) —
      CDE touches serialization only and "do[es] not place any
      requirements, exclusions, mappings or such on the data model level"
      (§C note 3).
  - name: cddl-control-operator-cde
    locator: "§4; Table 2 (§6)"
    encoding: CDDL
    fields:
      - name: target
        type: "CDDL type"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0023"
        layout: |
          The left-hand side: the byte string type whose content carries
          the embedded data item, written `bytes` in the document's
          example. Same position as the target of `.cbor` (Section 2.2.1
          of RFC 8610, referenced not restated).
      - name: controller
        type: "CDDL type"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0023"
        layout: |
          The right-hand side: the CDDL type the embedded data item must
          match. §4 notes that using the general type `any` is the weak
          case — "if the encoded data item also needs to have a specific
          structure, this can be expressed by the right-hand side".
    layout: |
      <byte-string-type> .cde <cddl-type>
      Semantics (§4): "The control operators .cde and .cdeseq are exactly
      like .cbor and .cborseq except that they also require the encoded
      data item(s) to be encoded according to CDE." The document's one
      example wraps it in tag 24:
        leaf = #6.24(bytes .cde any)
      Registered in Table 2 as `.cde`, reference [RFCXXXX], in the "CDDL
      Control Operators" registry of the [IANA.cddl] registry group.
    notes: |
      CDDL constrains the data model, not the encoding — "It does not
      specify encoding; CBOR protocols can specify the use of CDE (or
      simply definite-length-only encoding) independent of the CDDL data
      model" (§4) — so these two operators are the only place where an
      encoding constraint becomes expressible in CDDL, and only for CBOR
      embedded in a byte string. Deliberate omission recorded in a draft
      comment: "there is no .dlo or .dloseq for definite-length-only, as,
      so far, a requirement for these hasn't been detected." §4 also notes
      that CDE leaves CDDL otherwise untouched: there is "no effect on the
      Concise Data Definition Language (CDDL) [RFC8610], except where the
      data description is documenting specific encoding decisions for byte
      strings that carry embedded CBOR" (§3.1.2), with the float16/float32
      caveat that `float32` admits values that preferred serialization
      will nonetheless emit as binary16.
  - name: cddl-control-operator-cdeseq
    locator: "§4; Table 2 (§6)"
    encoding: CDDL
    fields:
      - name: target
        type: "CDDL type"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0023"
        layout: |
          The byte string type whose content carries a CBOR SEQUENCE of
          encoded data items, as for `.cborseq`.
      - name: controller
        type: "CDDL type"
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0023"
        layout: |
          The CDDL type every element of the sequence must match — one
          type for the whole sequence.
    layout: |
      <byte-string-type> .cdeseq <cddl-type>
      As `.cborseq`, plus the requirement that the data items be
      CDE-encoded. Registered in Table 2 as `.cdeseq`, reference
      [RFCXXXX].
    notes: |
      Stated limitation (§4): ".cdeseq control operator does not enable
      specifying different deterministic encoding requirements for the
      elements of the sequence. If a use case for such a feature becomes
      known, it could be added, or the CBOR sequence could be constructed
      with .join (Section 3.1 of [RFC9741])." §4 also invites ALDR
      ruleset documents to define their own analogous control operators.
  - name: iana-cddl-control-operator-registration
    locator: "§6, Table 2"
    encoding: "IANA registry row"
    fields:
      - name: name
        type: tstr
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0027"
        layout: |
          The control operator name including its leading dot: `.cde` for
          one row, `.cdeseq` for the other.
      - name: reference
        type: tstr
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0027"
        layout: |
          `[RFCXXXX]` in both rows, with the draft note "RFC Editor:
          please replace RFCXXXX with the RFC number of this RFC and
          remove this note."
    layout: |
      Two rows, two columns (Name, Reference), to be registered in the
      registry "CDDL Control Operators" of the [IANA.cddl] registry
      group:
        | .cde    | [RFCXXXX] |
        | .cdeseq | [RFCXXXX] |
    notes: |
      The only IANA action in the document; no new CBOR tag, simple value
      or media type is requested, and no registry is created. The
      registration template's other columns, if the registry has any, are
      not given here.
