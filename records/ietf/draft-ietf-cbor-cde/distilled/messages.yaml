    notes: |
      Every CDE encoder that emits floats at all must be able to produce
      this form (§C.1.1 item 2: encoders "MUST support half-precision and
      single-precision floating point"), and every decoder that accepts
      floats must accept it (§C.1.2 item 4: "Half-precision values MUST be
      accepted"). Appendix F exists because of this asymmetry with RFC
      8949, which published only decoding code; see
      half-precision-encode-result.
