          for tag 2.
      - name: magnitude
        type: bstr
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0007"
          - "draft-ietf-cbor-cde#R-0008"
          - "draft-ietf-cbor-cde#R-0049"
          - "draft-ietf-cbor-cde#R-0050"
          - "draft-ietf-cbor-cde#R-0051"
          - "draft-ietf-cbor-cde#R-0060"
        layout: |
          Big-endian unsigned n with no leading zero bytes (§C.1.1 item 3
          bullet 3); the value of the data item is -1 - n. Admissible
          under CDE only below -(2^64), since -(2^64)..-1 must be major
