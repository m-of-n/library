      fb B7 B6 B5 B4 B3 B2 B1 B0   (big-endian)
        B7 bit 7     sign
        B7 bits 6-0  exponent bits 10-4
        B6 bits 7-4  exponent bits 3-0
        B6 bits 3-0  trailing significand bits 51-48
        B5..B0       trailing significand bits 47-0
