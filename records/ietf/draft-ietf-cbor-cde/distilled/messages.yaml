          - "draft-ietf-cbor-cde#R-0039"
          - "draft-ietf-cbor-cde#R-0043"
          - "draft-ietf-cbor-cde#R-0055"
        layout: "0xf9 — major type 7, ai = 25 (0x19)."
      - name: sign
        type: bits(1)
        required: true
        constrained_by:
          - "draft-ietf-cbor-cde#R-0010"
          - "draft-ietf-cbor-cde#R-0044"
