      fa B3 B2 B1 B0   (big-endian)
        B3 bit 7     sign
        B3 bits 6-0  exponent bits 7-1
        B2 bit 7     exponent bit 0
        B2 bits 6-0  trailing significand bits 22-16
        B1, B0       trailing significand bits 15-0
