record: draft-ietf-cbor-cde
reviewed_by: ""
vectors:
  - id: "draft-ietf-cbor-cde#V-0001"
    locator: "§1.2"
    diagnostic: "NaN"
    hex: "f97e00"
    decoded: 'f16 quiet NaN, sign bit 0, all-zero payload (the "Trivial NaN")'
    expect: "valid"
    notes: 'The definition of "Trivial NaN": "A NaN with a zero sign bit, and a payload composed of zero bits only... Represented in CDE as the three bytes 0xf97e00." Bytes as printed in the source. The EDN form "NaN" is this document''s own notation for it (Appendix D.2 Table 5 uses it for the same bytes). Shares bytes with draft-ietf-cbor-cde#V-0004, draft-ietf-cbor-cde#V-0005, draft-ietf-cbor-cde#V-0040, draft-ietf-cbor-cde#V-0083, draft-ietf-cbor-cde#V-0089; match vectors on id, not on hex or diagnostic.'
  - id: "draft-ietf-cbor-cde#V-0002"
    locator: "§3.1.2"
    diagnostic: "1.0"
    hex: "f93c00"
    decoded: "f16 float 1.0"
    expect: "valid"
    notes: '"the number 1.0 will always be serialized as a binary16 floating point number (0xf93c00) as that is the shortest representation that preserves the value." Bytes as printed in the source. The point of the example is that the application has no control over the representation size.'
  - id: "draft-ietf-cbor-cde#V-0003"
    locator: "§3.1.2 item 1"
    diagnostic: "-0.0"
    hex: "f98000"
    decoded: "f16 float negative zero"
    expect: "valid"
    notes: '"an encoder that is asked by an application to represent a negative floating point zero (-0.0) will generate 0xf98000." Bytes as printed in the source. CDE takes no further specific action for the two zero values beyond preferred serialization: -0.0 and 0.0 stay distinct encodings. Shares bytes with draft-ietf-cbor-cde#V-0037; match vectors on id, not on hex or diagnostic.'
  - id: "draft-ietf-cbor-cde#V-0004"
    locator: "§3.1.2 item 3"
    diagnostic: "NaN"
    hex: "f97e00"
    decoded: "f16 quiet NaN, sign bit 0, all-zero payload"
    expect: "valid"
    notes: '"most applications that employ NaNs ... will only use a single NaN value: quiet, non-negative NaN with a payload of all zero bits. This value therefore deterministically encodes as 0xf97e00." Bytes as printed in the source. Shares bytes with draft-ietf-cbor-cde#V-0001, draft-ietf-cbor-cde#V-0005, draft-ietf-cbor-cde#V-0040, draft-ietf-cbor-cde#V-0083, draft-ietf-cbor-cde#V-0089; match vectors on id, not on hex or diagnostic.'
  - id: "draft-ietf-cbor-cde#V-0005"
    locator: "§3.1.2"
    diagnostic: "NaN"
    hex: "f97e00"
    decoded: "f16 quiet NaN, sign bit 0, all-zero payload"
    expect: "valid"
    notes: '"an application''s ALDR rules can decide that it only ever allows a single NaN value that would be encoded as 0xf97e00, so a CDE implementation focusing on this application would not even need to provide processing for other NaN values." Bytes as printed in the source. Recorded separately because it is a separate occurrence, making an ALDR-level point rather than a CDE-level one. Shares bytes with draft-ietf-cbor-cde#V-0001, draft-ietf-cbor-cde#V-0004, draft-ietf-cbor-cde#V-0040, draft-ietf-cbor-cde#V-0083, draft-ietf-cbor-cde#V-0089; match vectors on id, not on hex or diagnostic.'
  - id: "draft-ietf-cbor-cde#V-0006"
    locator: "§3.3"
    diagnostic: ""
    hex: "a201010102"
    decoded: "map with two entries, both keyed by the unsigned integer 1 (1 -> 1, 1 -> 2)"
    expect: "invalid"
    violates_requirements:
      - "draft-ietf-cbor-cde#R-0020"
      - "draft-ietf-cbor-cde#R-0022"
      - "draft-ietf-cbor-cde#R-0066"
      - "draft-ietf-cbor-cde#R-0067"
      - "draft-ietf-cbor-cde#R-0070"
    violates: '§3.3 lexicographic-map-sorting: "the (CDE-encoded) map key of a map entry MUST be lexicographically strictly greater than that of the map entry immediately preceding it in the encoding of the map". Equal keys are not strictly greater. Also Appendix C.3.1 item 3 (basic validity: no duplicate keys) and Appendix C.3.2 item 2 (CDE-checking decoders MUST reject duplicate map keys).'
    notes: 'The case §3.3 describes in prose when it walks the bytewise comparison: "If there is no such next pair, the comparison and thus CDE serialization fails entirely (the map keys of the two map entries are the same...)". HEX COMPUTED BY US: the source names this case but prints no bytes. The §3.3 aside explains why this matters: with the other CDE constraints, identical keys serialize identically and therefore sort adjacent, so the strictly-increasing phrasing is what turns the duplicate-key validity rule into a cheap check.'
  - id: "draft-ietf-cbor-cde#V-0007"
    locator: "§3.3"
    diagnostic: ""
    hex: "a2f9000001f9800002"
    decoded: "map with two entries keyed by the f16 floats 0.0 and -0.0 (0.0 -> 1, -0.0 -> 2)"
    expect: "invalid"
    violates_requirements:
      - "draft-ietf-cbor-cde#R-0066"
      - "draft-ietf-cbor-cde#R-0067"
    violates: 'Appendix C.3.1 item 3: "CDE encoders MUST generate CBOR that fulfills basic validity (Section 5.3.1 of RFC 8949)... this includes not emitting duplicate keys in a major type 5 map". Per the §3.3 aside, RFC 8949 Section 5.6.1 treats -0.0 and 0.0 as equal map keys, so these two entries are duplicates.'
    notes: 'The one case the §3.3 aside singles out: "Section 5.6.1 of RFC 8949 lists one specific case ''(specifically, -0.0 is equal to 0.0)'' where two different keys are considered equivalent for the purpose of duplicate map keys; this needs to be checked with extra code for a full validity checker." HEX COMPUTED BY US: the source names this case but prints no bytes. NOTE THE TRAP THIS VECTOR EXISTS TO CATCH: lexicographic-map-sorting is SATISFIED here (0xf90000 < 0xf98000, strictly increasing), so an implementation that checks only the ordering constraint accepts it; the extra equivalence check is what rejects it.'
  - id: "draft-ietf-cbor-cde#V-0008"
    locator: "Appendix B"
    diagnostic: "2"
    hex: "02"
    decoded: "unsigned integer 2"
    expect: "valid"
    notes: 'Appendix B: "the number 2 can be represented as an integer, float, big number, decimal fraction and other." The source names the representations to make an application-level (ALDR) point - that CDE fixes the encoding of each data item but does not choose between semantically equivalent data items - and prints no bytes for any of them. HEX COMPUTED BY US: the source names this case but prints no bytes. Trivially follows the Table 4 pattern for 0 to 23. The EDN is the source''s own words ("the number 2").'
  - id: "draft-ietf-cbor-cde#V-0009"
    locator: "Appendix B"
    diagnostic: "2.0"
    hex: "f94000"
    decoded: "f16 float 2.0"
    expect: "valid"
    notes: 'Appendix B: "the number 2 can be represented as an integer, float, big number, decimal fraction and other." The source names the representations to make an application-level (ALDR) point - that CDE fixes the encoding of each data item but does not choose between semantically equivalent data items - and prints no bytes for any of them. These bytes are not printed in Appendix B; they are taken from the Table 5 row "2.0" (Appendix D.2), which prints both that EDN and those bytes. Shares bytes with draft-ietf-cbor-cde#V-0057; match vectors on id, not on hex or diagnostic.'
  - id: "draft-ietf-cbor-cde#V-0010"
    locator: "Appendix B"
    diagnostic: "2(h'02')"
    hex: "c24102"
    decoded: "tag 2 (bignum) over the one-byte string 0x02, value 2"
    expect: "invalid"
    violates_requirements:
      - "draft-ietf-cbor-cde#R-0007"
      - "draft-ietf-cbor-cde#R-0048"
    violates: '§3.1.1: "Integers that can be represented by basic major type 0 and 1 MUST be encoded using the (shortest-head) deterministic encoding defined for them". Appendix C.1.1 item 3: "Positive integers from 0 to 2^64 - 1 MUST be encoded as a type 0 integer."'
    notes: 'Appendix B: "the number 2 can be represented as an integer, float, big number, decimal fraction and other." The source names the representations to make an application-level (ALDR) point - that CDE fixes the encoding of each data item but does not choose between semantically equivalent data items - and prints no bytes for any of them. HEX COMPUTED BY US: the source names this case but prints no bytes. Included because the "big number" representation of 2 that Appendix B names is, as an encoding, forbidden by CDE - the same failure Table 6 records for 65536 as c243010000. THE EDN SHOWN IS OUR OWN NOTATION (RFC 8949 tag notation); the source prints no diagnostic form for it.'
  - id: "draft-ietf-cbor-cde#V-0011"
    locator: "Appendix B"
    diagnostic: "4([0, 2])"
    hex: "c4820002"
    decoded: "tag 4 (decimal fraction) over the array [0, 2], i.e. 2 x 10^0"
    expect: "valid"
    notes: 'Appendix B: "the number 2 can be represented as an integer, float, big number, decimal fraction and other." The source names the representations to make an application-level (ALDR) point - that CDE fixes the encoding of each data item but does not choose between semantically equivalent data items - and prints no bytes for any of them. HEX COMPUTED BY US: the source names this case but prints no bytes. Valid as an ENCODING: shortest heads, definite length, no maps. CDE does not equate it with the integer 2 or with 2.0 - per §3.1.2 item 5, "CDE does not presume equivalence of basic floating point values with floating point values using other representations (e.g., tag 4/5)". Choosing between these four encodings of "the number 2" is ALDR work, not CDE work. THE EDN SHOWN IS OUR OWN NOTATION; the source prints no diagnostic form for it.'
  - id: "draft-ietf-cbor-cde#V-0012"
    locator: "Appendix C.2"
    diagnostic: ""
    decoded: "an array or map of 256 or more elements/entries encoded with an indefinite-length head (0x9f or 0xbf) and a 0xff break"
    expect: "invalid"
    violates_requirements:
      - "draft-ietf-cbor-cde#R-0018"
      - "draft-ietf-cbor-cde#R-0063"
    violates: '§3.2 definite-length-only: "indefinite length encoding MUST NOT be used". Also Appendix C.3.1 item 1 (CDE encoders MUST only emit CBOR that fulfills definite-length-only).'
    notes: 'The Appendix C.2 aside: "Some encoders turn to indefinite length encoding for arrays and maps with 256 or more elements/entries, to use the slightly smaller serialization size indefinite length encoding offers for these cases... As CDE requires definite-length-only, such behavior needs to be turned off for CDE." NO HEX RECORDED: the source gives neither bytes nor element content, so any instance would be entirely our invention. A harness should synthesise one, e.g. 0x9f followed by 256 encoded items and 0xff, and check that it is rejected.'
  - id: "draft-ietf-cbor-cde#V-0013"
    locator: "Appendix C.3.1 item 3"
    diagnostic: ""
    hex: "62c0ae"
    decoded: "text string of length 2 whose content bytes 0xc0 0xae are not valid UTF-8 (an overlong encoding of U+002E)"
    expect: "invalid"
    violates_requirements:
      - "draft-ietf-cbor-cde#R-0066"
      - "draft-ietf-cbor-cde#R-0067"
      - "draft-ietf-cbor-cde#R-0071"
    violates: 'Appendix C.3.1 item 3: "CDE encoders MUST generate CBOR that fulfills basic validity (Section 5.3.1 of RFC 8949)... emitting only valid UTF-8 in major type 3 text strings." Also Appendix C.3.2 item 3: CDE-checking decoders "MUST check the validity of the UTF-8 encoding of text strings (major type 3)".'
    notes: "This draft states the UTF-8 rule twice (encoder and checking decoder) but shows no instance. HEX NOT FROM THIS SOURCE: 0x62c0ae is RFC 8949 Section 5.2's own well-formed-but-invalid-UTF-8 example (our rfc-8949#V-0133), reused here so the rule is exercised without inventing new bytes. Note that CDE deliberately does NOT require Unicode normalization (Appendix C.3.1 note), so a non-NFC text string is valid CDE."
