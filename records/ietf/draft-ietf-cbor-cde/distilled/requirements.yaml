schema: "library-requirements/v1"
record: draft-ietf-cbor-cde
source_version: "draft-ietf-cbor-cde-13"
source_digest: "bc554e3d2d37182f5f37c88aac2e61298089438068ccbc7c674d0940e675605c"
source_keyword_count: 40
extracted_keyword_count: 40
reconciliation: >
  The counts match exactly: 40 BCP 14 keyword occurrences in the source
  (33 MUST, 3 MUST NOT, 1 RECOMMENDED, 1 NOT RECOMMENDED, 1 MAY, 1 SHOULD,
  with the keyword-defining boilerplate excluded as bin/bcp14-count excludes
  it), and 40 carried by the 40 entries marked kind stated. Each stated entry
  carries exactly one occurrence and none splices two. Five of the 40
  occurrences are counted by the tool but impose nothing on a CDE
  implementation, and are recorded here so a later pass does not mistake them
  for dropped obligations. R-0028 and R-0029 are a hypothetical
  application-protocol specification quoted inside an aside in Appendix B to
  show what a non-deterministic application layer looks like. R-0030 and
  R-0031 are a verbatim block quote from Section 4.2 of RFC 9679, cited in
  Appendix B as a worked example of ALDR rules; their force belongs to that
  record, not this one. R-0032 is a meta-mention of the word MUST in the
  Appendix C preamble, which constrains nothing. They are kept as stated
  entries because the source does carry the keyword at those locators, and
  dropping them would open a gap between the two counts with no real
  difference behind it. The 33 entries marked kind inferred carry no BCP 14
  keyword at all and so move neither count. Note also that the whole of
  Appendix C declares itself informative and says it does not contain any
  normative mandates, yet carries 29 of the 40 occurrences, including the
  only end-to-end statement of what a CDE encoder and a CDE-checking decoder
  have to do; the entries drawn from that appendix say so in their field.
reviewed_by: ""
note: >
  Ids are stable and never reused. Cite as draft-ietf-cbor-cde#R-NNNN.

requirements:
  - id: "draft-ietf-cbor-cde#R-0001"
    object: CDE specification text
    field: "terminology and conventions incorporated wholesale from RFC 8949 (STD 94); no BCP 14 keyword backs it - the lowercase verb 'apply' carries the whole force, and the obligation is on a reader or implementer to resolve CDE's terms against RFC 8949 Section 1.2"
    verb: applies
    actor: implementation
    locator: "§1.2"
    text: 'The conventions and definitions of [STD94] apply.'
    kind: inferred
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0002"
    object: encoding constraint set
    field: "conjunction semantics - a named set of encoding constraints is met only when every constraint in it is met; no BCP 14 keyword backs it, the force is the lowercase 'requires' in a definition entry"
    verb: must
    actor: encoder
    locator: "§1.2"
    text: 'Several encoding constraints can be combined into an encoding constraint set, which is itself an encoding constraint that requires that all encoding constraints in the set are met.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0003"
    object: choice of deterministic encoding scheme
    field: "which deterministic encoding a specification or implementation should pick where deterministic encoding is wanted; the only RECOMMENDED in the document and the whole point of it as a BCP"
    verb: RECOMMENDED
    actor: implementation
    locator: "§1.2"
    text: 'Out of many potential and actual deterministic encodings, CDE is RECOMMENDED for implementation and specification where deterministic encoding is required or desired.'
    kind: stated
    testable: partial
    status: active

  - id: "draft-ietf-cbor-cde#R-0004"
    object: trivial NaN
    field: "the exact byte encoding of the defined term Trivial NaN (zero sign bit, all-zero payload); no BCP 14 keyword backs it - the force is a definition entry stating the representation, restated at §3.1.2 as R-0017"
    verb: must
    actor: encoder
    locator: "§1.2"
    text: 'Represented in CDE as the three bytes 0xf97e00.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0005"
    object: cde encoding constraint
    field: "CDE's structure as a composite encoding constraint; no BCP 14 keyword backs it. The sentence immediately following, which names all three constituents, is broken across a hyphenated line wrap in the source and so is not quoted here; the three are stated normatively at R-0063 and R-0064 and defined one per section in §3.1, §3.2 and §3.3"
    verb: must
    actor: encoder
    locator: "§3"
    text: 'Formally, Common Deterministic Encoding (CDE) is an encoding constraint (named cde for short), built from multiple constituent encoding constraints (which may, in turn, be built from multiple constituent encoding constraints).'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0006"
    object: preferred-serialization encoding constraint
    field: "what preferred-serialization is composed of - shortest-head plus any tag-specific encoding constraints a tag definition declares part of preferred serialization; no BCP 14 keyword backs it"
    verb: must
    actor: encoder
    locator: "§3.1"
    text: 'The preferred-serialization encoding constraint is a combination of the shortest-head constraint and tag-specific encoding constraints defined to be part of preferred-serialization.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0007"
    object: integer in the range of basic major types 0 and 1
    field: "head length - an integer representable in major type 0 or 1 is encoded with the shortest-head deterministic encoding, not as a bignum and not with a longer argument. This is CDE's own sentence turning RFC 8949 Section 4.2.2's recommendation into a mandate"
    verb: MUST
    actor: encoder
    locator: "§3.1.1"
    text: 'Integers that can be represented by basic major type 0 and 1 MUST be encoded using the (shortest-head) deterministic encoding defined for them'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0008"
    object: integer outside the range of basic major types 0 and 1
    field: "bignum content encoding - integers beyond the basic major type 0/1 range take tag 2 or tag 3 in that tag's preferred serialization, which excludes leading zero bytes in the byte string content"
    verb: MUST
    actor: encoder
    locator: "§3.1.1"
    text: 'integers outside this range MUST be encoded using the Preferred Serialization (Section 3.4.3 of RFC 8949 [STD94]) of tag 2 and 3 (i.e., no leading zero bytes).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0009"
    object: basic floating point data item
    field: "representation size - the shortest head that preserves the value, so the application has no control over whether a float goes out as binary16, binary32 or binary64; no BCP 14 keyword backs it, and CDE states here that it adds no float constraints of its own beyond shortest-head"
    verb: must
    actor: encoder
    locator: "§3.1.2"
    text: 'Similar to the shortest-head constraint for major types 0 to 6, floating point values are represented with the shortest head (Section 3 of RFC 8949 [STD94]) that preserves the value of the data item.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0010"
    object: floating point zero
    field: "the two zeros stay distinct - negative zero is encoded as 0xf98000 and is not folded into positive zero; no BCP 14 keyword backs it, the force is the lowercase 'will generate' in numbered item 1"
    verb: must
    actor: encoder
    locator: "§3.1.2"
    text: 'Besides the mandated use of Preferred Serialization, there is no further specific action for the two different zero values, e.g., an encoder that is asked by an application to represent a negative floating point zero (-0.0) will generate 0xf98000.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0011"
    object: floating point value whose mathematical value is integral
    field: "no integer/float reduction - a float stays a float even when its value is integral, unlike dCBOR's numeric reduction; no BCP 14 keyword backs it, the force is the lowercase 'are encoded as' in numbered item 2"
    verb: must
    actor: encoder
    locator: "§3.1.2"
    text: 'There is no attempt to mix integers and floating point numbers, i.e., all floating point values are encoded as the preferred floating-point representation that accurately represents the value, independent of whether the floating point value is, mathematically, an integral value (choice 2 of the second bullet in Section 4.2.2 of RFC 8949 [STD94]).'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0012"
    object: NaN value
    field: "scope - NaNs with zero and with non-zero payloads are in scope of preferred serialization and are encoded per IEEE 754 Section 6.2.1, and CDE adds no special NaN handling; no BCP 14 keyword backs it"
    verb: must
    actor: encoder
    locator: "§3.1.2"
    text: 'In CDE, there is no special handling of NaN values, except a clarification that the Preferred Serialization rules also apply to NaNs (with zero or non-zero payloads), using the encoding of NaNs as defined in Section 6.2.1 of [IEEE754].'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0013"
    object: NaN payload
    field: "shortening condition - a NaN moves to a shorter form only when the bits dropped from the payload are trailing zeros; no BCP 14 keyword backs it, the force is the lowercase 'are used when'. Restated with the arithmetic at R-0045 and R-0046"
    verb: must
    actor: encoder
    locator: "§3.1.2"
    text: 'Specifically, shorter forms of encodings for a NaN are used when that can be achieved by only removing trailing zeros in the NaN payload'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0014"
    object: quiet NaN
    field: "the leading significand bit is 1 for a quiet NaN - CDE pins down what IEEE 754 Section 6.2.1 leaves at should-level; no BCP 14 keyword backs it, the force is the lowercase 'always uses'"
    verb: must
    actor: encoder
    locator: "§3.1.2"
    text: 'Further clarifying a "should"-level statement in Section 6.2.1 of [IEEE754], the CBOR encoding always uses a leading bit of 1 in the significand to encode a quiet NaN'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0015"
    object: signaling NaN
    field: "application protocol design - signaling NaNs are discouraged for interchange; the only NOT RECOMMENDED in the document, and it binds the protocol designer rather than the encoder"
    verb: NOT RECOMMENDED
    actor: application
    locator: "§3.1.2"
    text: 'the use of signaling NaNs by application protocols is NOT RECOMMENDED'
    kind: stated
    testable: partial
    status: active

  - id: "draft-ietf-cbor-cde#R-0016"
    object: signaling NaN presented by an application
    field: "encoding of a signaling NaN that an application does present - leading significand bit 0; no BCP 14 keyword backs this clause, it is the lowercase remainder of the sentence whose NOT RECOMMENDED half is R-0015"
    verb: must
    actor: encoder
    locator: "§3.1.2"
    text: 'when presented by an application these are encoded by using a leading significand bit of 0.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0017"
    object: quiet non-negative NaN with an all-zero payload
    field: "the single NaN value most applications use encodes deterministically as 0xf97e00; no BCP 14 keyword backs it, the force is the lowercase 'deterministically encodes as'. Same byte string as R-0004"
    verb: must
    actor: encoder
    locator: "§3.1.2"
    text: 'This value therefore deterministically encodes as 0xf97e00.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0018"
    object: indefinite length encoding
    field: "prohibition of indefinite-length heads for strings, arrays and maps under the definite-length-only constraint, and so under CDE"
    verb: MUST NOT
    actor: encoder
    locator: "§3.2"
    text: 'The definite-length-only encoding constraint means that indefinite length encoding MUST NOT be used.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0019"
    object: map entries
    field: "ordering - map entries are sorted bytewise lexicographically by their encoded map keys; no BCP 14 keyword backs this sentence, the force is the lowercase 'is the constraint to sort'. The testable keyword form is R-0020"
    verb: must
    actor: encoder
    locator: "§3.3"
    text: 'In line with Section 4.2.1 of RFC 8949 [STD94], the third constituent of CDE is the constraint to sort map entries bytewise lexicographically by their map keys.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0020"
    object: adjacent map entries
    field: "strict ordering - each encoded map key is lexicographically strictly greater than its immediate predecessor, which sorts the map and forbids duplicate keys in one rule"
    verb: MUST
    actor: encoder
    locator: "§3.3"
    text: 'Specifically, for lexicographic-map-sorting the (CDE-encoded) map key of a map entry MUST be lexicographically strictly greater than that of the map entry immediately preceding it in the encoding of the map, if any.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0021"
    object: bytewise lexicographic comparison of two encoded map keys
    field: "the comparison algorithm itself - step in parallel over the bytes, compare them as unsigned integers, first difference decides; no BCP 14 keyword backs it, it is a procedure in lowercase prose"
    verb: must
    actor: implementation
    locator: "§3.3"
    text: 'The bytewise lexicographic comparison steps in parallel through the bytes of the two encoded map keys, comparing the (unsigned integer values of the) bytes.  If the bytes differ, the difference determines the outcome of the comparison.  If the bytes are the same, the next pair of bytes are examined.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0022"
    object: CDE serialization of a map
    field: "failure path - when the comparison runs out of byte pairs the whole CDE serialization fails, which is how equal map keys are caught; no BCP 14 keyword backs it, the force is the lowercase 'fails entirely'"
    verb: must
    actor: encoder
    locator: "§3.3"
    text: 'If there is no such next pair, the comparison and thus CDE serialization fails entirely'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0023"
    object: CDDL control operators .cde and .cdeseq
    field: "semantics of the two new control operators - like .cbor and .cborseq but additionally requiring the embedded data item(s) to be CDE-encoded; no BCP 14 keyword backs it, the force is the lowercase 'require'"
    verb: must
    actor: implementation
    locator: "§4"
    text: 'The control operators .cde and .cdeseq are exactly like .cbor and .cborseq except that they also require the encoded data item(s) to be encoded according to CDE.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0024"
    object: specification documenting ALDR rules
    field: "an invitation, not an obligation, to define control operators embodying the ALDR processing; no BCP 14 keyword backs it, the force is the lowercase 'are encouraged to do so', which is why testable is no"
    verb: should
    actor: application
    locator: "§4"
    text: 'Obviously, specifications that document ALDR rules can define related control operators that also embody the processing required by those ALDR rules, and are encouraged to do so.'
    kind: inferred
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0025"
    object: CDE implementation
    field: "security considerations incorporated by reference from RFC 8949 Section 10; no BCP 14 keyword backs it, the force is the lowercase 'apply', and it is not testable as a property of an encoding"
    verb: applies
    actor: implementation
    locator: "§5"
    text: 'The security considerations in Section 10 of RFC 8949 [STD94] apply.'
    kind: inferred
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0026"
    object: decoder in a deterministic-encoding deployment
    field: "the mitigation against attacker-crafted non-preferred serializations accrues only to a decoder that actually checks the encoding, so a non-checking decoder forfeits it; no BCP 14 keyword backs it, the force is the lowercase 'only accrues if'"
    verb: must
    actor: decoder
    locator: "§5"
    text: 'However, this effect only accrues if the decoder actually checks that deterministic encoding was applied correctly.'
    kind: inferred
    testable: partial
    status: active

  - id: "draft-ietf-cbor-cde#R-0027"
    object: IANA CDDL Control Operators registry
    field: "registration action - .cde and .cdeseq are to be added to the CDDL Control Operators registry; no BCP 14 keyword backs it, and it is an action on IANA rather than on an implementation"
    verb: must
    actor: IANA
    locator: "§6"
    text: 'This document requests IANA to register the contents of Table 2 into the registry "CDDL Control Operators" of the [IANA.cddl] registry group'
    kind: inferred
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0028"
    object: birthdate/time field of a hypothetical application protocol
    field: "NOT A CDE REQUIREMENT - the only MAY in the document, and it belongs to an invented example application protocol quoted inside an aside in Appendix B to show an application layer that is interoperable but non-deterministic. Recorded because bin/bcp14-count counts the occurrence"
    verb: MAY
    actor: application
    locator: "Appendix B"
    text: 'At the sender’s convenience, the birthdate/time MAY be sent either in epoch date format (as in tag 1) or string date format (as in tag 0).'
    kind: stated
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0029"
    object: receiver in a hypothetical application protocol
    field: "NOT A CDE REQUIREMENT - the other half of the invented Appendix B example; the document immediately says this specification lacks determinism. Recorded because bin/bcp14-count counts the occurrence"
    verb: MUST
    actor: application
    locator: "Appendix B"
    text: 'The receiver MUST decode both formats.'
    kind: stated
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0030"
    object: COSE key point representation
    field: "NOT A CDE REQUIREMENT - verbatim block quote from Section 4.2 of RFC 9679, cited in Appendix B as a worked example of ALDR rules (an exclusion plus a reduction). The obligation is RFC 9679's and belongs to that record. Recorded because bin/bcp14-count counts the occurrence"
    verb: MUST
    actor: implementation
    locator: "Appendix B"
    text: 'For interoperability, implementations adhering to this specification MUST use the uncompressed point representation.'
    kind: stated
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0031"
    object: compressed COSE key point representation
    field: "NOT A CDE REQUIREMENT - second sentence of the same verbatim block quote from Section 4.2 of RFC 9679 in Appendix B; it is the reduction, converting to uncompressed form before thumbprinting. Recorded because bin/bcp14-count counts the occurrence"
    verb: MUST
    actor: implementation
    locator: "Appendix B"
    text: 'If an implementation uses the compressed point representation, it MUST first convert it to the uncompressed form for the purpose of thumbprint calculation.'
    kind: stated
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0032"
    object: Appendix C checklists
    field: "NOT A REQUIREMENT AT ALL - a meta-mention of the word MUST, declaring how the appendix uses RFC 2119 language to highlight checklist items. Counted by bin/bcp14-count and constrains nothing; the same paragraph says the appendix does not contain any normative mandates"
    verb: MUST
    actor: implementation
    locator: "Appendix C"
    text: 'It uses RFC2119 language, specifically the keyword MUST, to highlight the specific items that implementers may want to check.'
    kind: stated
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0033"
    object: decoder advertising support for preferred serialization or CDE
    field: "advertising support obliges checking and rejecting non-conforming input - the definition the term CDE-checking decoder rests on; no BCP 14 keyword backs it, the force is the lowercase 'need to check ... and reject'"
    verb: must
    actor: decoder
    locator: "Appendix C"
    text: 'Decoder implementations that advertise "support" for preferred serialization or CDE need to check the encoding and reject input that is not encoded to the encoding specification in use.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0034"
    object: argument of every major type
    field: "shortest-head - the argument is encoded in its shortest form for all major types. Appendix C declares itself informative, yet this is its operative statement of the shortest-head constraint"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'Shortest-form encoding of the argument MUST be used for all major types (shortest-head constraint).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0035"
    object: argument value 0 to 23, or -1 to -24
    field: "head length - immediate argument, encoded in the same byte as the major type (ai 0x00 to 0x17). Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: '0 to 23 and -1 to -24 MUST be encoded in the same byte as the major type.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0036"
    object: argument value 24 to 255, or -25 to -256
    field: "head length - exactly one additional byte, ai 0x18. Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: '24 to 255 and -25 to -256 MUST be encoded only with one additional byte (ai = 0x18).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0037"
    object: argument value 256 to 65535, or -257 to -65536
    field: "head length - exactly two additional bytes, ai 0x19. Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: '256 to 65535 and -257 to -65536 MUST be encoded only with an additional two bytes (ai = 0x19).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0038"
    object: argument value 65536 to 4294967295, or -65537 to -4294967296
    field: "head length - exactly four additional bytes, ai 0x1a. Appendix C is declared informative. The source gives no bullet for the eight-byte range (ai 0x1b); it is left implied by exclusion and shown only in Table 4"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: '65536 to 4294967295 and -65537 to -4294967296 MUST be encoded only with an additional four bytes (ai = 0x1a).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0039"
    object: floating point value with more than one precision-preserving encoding
    field: "precision selection - only the shortest of binary16, binary32 and binary64 that preserves the value may be emitted. Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'If multiple of these encodings preserve the precision of the value to be encoded, only the shortest form of these MUST be emitted.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0040"
    object: encoder that emits floating point numbers
    field: "capability - an encoder that emits floats has to be able to produce half and single precision, which follows from R-0039; a float-capable encoder cannot opt out of binary16. Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'That is, encoders MUST support half-precision and single-precision floating point.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0041"
    object: IEEE 754 infinities, NaNs and NaN payloads
    field: "capability - support for infinities and NaNs including payloads, qualified by 'to the extent possible on the platform', which is what makes it only partially testable. Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: '[IEEE754] Infinites and NaNs, and thus NaN payloads, MUST be supported, to the extent possible on the platform.'
    kind: stated
    testable: partial
    status: active

  - id: "draft-ietf-cbor-cde#R-0042"
    object: infinities and NaNs
    field: "precision selection extends to non-finite values - shortest of double, single or half that preserves the value. Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'As with all floating point numbers, Infinites and NaNs MUST be encoded in the shortest of double, single or half precision that preserves the value:'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0043"
    object: positive infinity, negative infinity and zero
    field: "fixed representation - always half precision (0xf97c00, 0xf9fc00, 0xf90000, and 0xf98000 for negative zero per R-0010). Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'Positive and negative infinity and zero MUST be represented in half-precision floating point.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0044"
    object: NaN value
    field: "what counts as the value to be preserved when shortening a NaN - sign bit, quiet bit and payload; no BCP 14 keyword backs it. The quote stops at 'payload' because the source wraps the following words as 'non-' then 'zero)' across a hyphenated line break; the full phrase there is whether zero or non-zero"
    verb: must
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'For NaNs, the value to be preserved includes the sign bit, the quiet bit, and the NaN payload'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0045"
    object: NaN payload
    field: "the shortening arithmetic - drop the rightmost N payload bits, where N is the significand width difference between the original and the shortest format; no BCP 14 keyword backs it, it is a lowercase procedure inside a keyword-bearing list"
    verb: must
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'The shortest form is obtained by removing the rightmost N bits of the payload, where N is the difference in the number of bits in the significand (mantissa representation) between the original format and the shortest format.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0046"
    object: NaN payload trimming
    field: "the guard on R-0045 - trim only when every bit removed is zero; no BCP 14 keyword backs it. The sentence begins on the previous source page as 'This trimming is performed only' and this quote starts after the page break, so nothing is spliced"
    verb: must
    actor: encoder
    locator: "Appendix C.1.1"
    text: '(preserves the value only) if all the rightmost bits removed are zero.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0047"
    object: double or single precision quiet NaN with a zero payload
    field: "the consequence of R-0045 and R-0046 - such a NaN always lands in half precision, i.e. 0xf97e00; no BCP 14 keyword backs it, the force is the lowercase 'will always be represented'"
    verb: must
    actor: encoder
    locator: "Appendix C.1.1"
    text: '(This means that a double or single quiet NaN that has a zero NaN payload will always be represented in a half-precision quiet NaN.)'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0048"
    object: positive integer from 0 to 2^64 - 1 presented as a big number
    field: "bignum range floor - values inside the basic major type 0 range go out as type 0, not tag 2. Appendix C is declared informative, and the item is conditioned on tags 2 and 3 being supported"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'Positive integers from 0 to 2^64 - 1 MUST be encoded as a type 0 integer.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0049"
    object: negative integer from -(2^64) to -1 presented as a big number
    field: "bignum range floor - values inside the basic major type 1 range go out as type 1, not tag 3. Appendix C is declared informative, and the item is conditioned on tags 2 and 3 being supported"
    verb: MUST
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'Negative integers from -(2^64) to -1 MUST be encoded as a type 1 integer.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0050"
    object: byte string content of tag 2 or tag 3
    field: "no leading zero bytes in bignum content. Appendix C is declared informative; this is the checklist form of R-0008"
    verb: MUST NOT
    actor: encoder
    locator: "Appendix C.1.1"
    text: 'Leading zeros MUST NOT be present in the byte string content of tag 2 and 3.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0051"
    object: tags 2 and 3 nested inside another tag
    field: "scope extension - the bignum rules R-0048 to R-0050 also bind tag 2 and tag 3 used inside other tags such as tag 4 or tag 5 (decimal fraction, bigfloat); no BCP 14 keyword backs it"
    verb: must
    actor: encoder
    locator: "Appendix C.1.1"
    text: '(This also applies to the use of tags 2 and 3 within other tags, such as 4 or 5.)'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0052"
    object: decoder
    field: "acceptance - shortest-form arguments have to decode. Appendix C is declared informative, and C.1.2 frames these items as what a partial decoder must do to accept at least preferred serialization"
    verb: MUST
    actor: decoder
    locator: "Appendix C.1.2"
    text: 'Decoders MUST accept shortest-form encoded arguments (see Section 3 of RFC 8949 [STD94]).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0053"
    object: arrays and maps at a preferred-serialization decoder
    field: "acceptance - both definite and indefinite length forms, because preferred serialization alone does not exclude indefinite length; conditioned on arrays or maps being supported. Appendix C is declared informative"
    verb: MUST
    actor: decoder
    locator: "Appendix C.1.2"
    text: 'If arrays or maps are supported, both definite-length and indefinite-length arrays or maps MUST be accepted.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0054"
    object: text and byte strings at a preferred-serialization decoder
    field: "acceptance - both definite and indefinite length forms; conditioned on strings being supported. Appendix C is declared informative"
    verb: MUST
    actor: decoder
    locator: "Appendix C.1.2"
    text: 'If text or byte strings are supported, both definite-length and indefinite-length text or byte strings MUST be accepted.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0055"
    object: half-precision floating point values at a decoder
    field: "acceptance - binary16 has to decode, which the encoder-side shortest-form rule forces; conditioned on floats being supported. Appendix C is declared informative"
    verb: MUST
    actor: decoder
    locator: "Appendix C.1.2"
    text: 'Half-precision values MUST be accepted.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0056"
    object: double- and single-precision floating point values at a decoder
    field: "acceptance at SHOULD level - the only SHOULD in the document; omission is foreseen only for exceptionally constrained decoders. Appendix C is declared informative"
    verb: SHOULD
    actor: decoder
    locator: "Appendix C.1.2"
    text: 'Double- and single-precision values SHOULD be accepted; leaving these out is only foreseen for decoders that need to work in exceptionally constrained environments.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0057"
    object: single-precision floating point values at a decoder that accepts double precision
    field: "no gap in the precision ladder - accepting binary64 obliges accepting binary32. Appendix C is declared informative"
    verb: MUST
    actor: decoder
    locator: "Appendix C.1.2"
    text: 'If double-precision values are accepted, single-precision values MUST be accepted.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0058"
    object: infinities, NaNs and NaN payloads at a decoder
    field: "acceptance and presentation to the application, with a platform-number-format escape that leaves the presentation half only partially testable. Appendix C is declared informative"
    verb: MUST
    actor: decoder
    locator: "Appendix C.1.2"
    text: 'Infinites and NaNs, and thus NaN payloads, MUST be accepted and presented to the application (not necessarily in the platform number format, if that doesn''t support those values).'
    kind: stated
    testable: partial
    status: active

  - id: "draft-ietf-cbor-cde#R-0059"
    object: basic major type 0 and 1 integers at a bignum-capable decoder
    field: "acceptance - wherever a tag 2 or 3 would be accepted the basic integer forms have to be too, the decoder mirror of R-0048 and R-0049; conditioned on big numbers being supported. Appendix C is declared informative"
    verb: MUST
    actor: decoder
    locator: "Appendix C.1.2"
    text: 'If big numbers (tags 2 and 3) are supported, type 0 and type 1 integers MUST be accepted where a tag 2 or 3 would be accepted.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0060"
    object: leading zero bytes in tag 2 or tag 3 content at a decoder
    field: "ignored on input - a preferred-serialization decoder tolerates them rather than rejecting, which is weaker than a CDE-checking decoder, where R-0069 makes them a violation to be caught"
    verb: MUST
    actor: decoder
    locator: "Appendix C.1.2"
    text: 'Leading zero bytes in the tag content of a tag 2 or 3 MUST be ignored.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0061"
    object: definite-length-only encoding constraint
    field: "scope of the exclusion - both strings and arrays/maps, so no indefinite-length form of any kind; no BCP 14 keyword backs this sentence, the keyword form is R-0018"
    verb: must
    actor: encoder
    locator: "Appendix C.2"
    text: 'The encoding constraint definite-length-only excludes the use of indefinite length encoding, both for (binary/text) strings and for arrays and maps.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0062"
    object: encoder optimisation that switches to indefinite length for large arrays and maps
    field: "such behaviour has to be disabled for CDE, naming the concrete configuration an implementer must turn off; no BCP 14 keyword backs it, the force is the lowercase 'requires' and 'needs to be turned off'"
    verb: must
    actor: encoder
    locator: "Appendix C.2"
    text: 'As CDE requires definite-length-only, such behavior needs to be turned off for CDE.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0063"
    object: CDE encoder
    field: "output conformance - every data item emitted satisfies preferred-serialization and definite-length-only. Appendix C is declared informative, yet this and R-0064 are the only end-to-end statement of what a CDE encoder does"
    verb: MUST
    actor: encoder
    locator: "Appendix C.3.1"
    text: 'CDE encoders MUST only emit CBOR that fulfills the encoding constraints preferred-serialization and definite-length-only.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0064"
    object: CDE encoder
    field: "output conformance - maps sorted by the CBOR representation of the map key, i.e. lexicographic-map-sorting. Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.3.1"
    text: 'CDE encoders MUST only emit CBOR that fulfills the encoding constraints lexicographic-map-sorting, i.e., sort maps by the CBOR representation of the map key.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0065"
    object: map key sort order
    field: "the comparand is the encoded map key data item and the order is byte-wise lexicographic - not the data-model value and not a type-aware order; no BCP 14 keyword backs this sentence"
    verb: must
    actor: encoder
    locator: "Appendix C.3.1"
    text: 'The sorting is byte-wise lexicographic order of the encoded map key data items.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0066"
    object: CDE encoder
    field: "basic validity of the output per RFC 8949 Section 5.3.1 - CDE is a validity constraint as well as an encoding constraint. Appendix C is declared informative"
    verb: MUST
    actor: encoder
    locator: "Appendix C.3.1"
    text: 'CDE encoders MUST generate CBOR that fulfills basic validity (Section 5.3.1 of RFC 8949 [STD94]).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0067"
    object: basic validity obligations of a CDE encoder
    field: "what basic validity concretely excludes - duplicate keys in a major type 5 map, and invalid UTF-8 in a major type 3 text string; no BCP 14 keyword backs this note, which elaborates R-0066"
    verb: must
    actor: encoder
    locator: "Appendix C.3.1"
    text: 'Note that this includes not emitting duplicate keys in a major type 5 map as well as emitting only valid UTF-8 in major type 3 text strings.'
    kind: inferred
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0068"
    object: text strings under CDE
    field: "explicit non-requirement - CDE does not require Unicode normalization, so NFC and non-NFC text are both CDE-conformant and normalization is an ALDR-level concern (dCBOR imposes it, CDE does not); no BCP 14 keyword backs it, and a non-requirement is not testable"
    verb: not-required
    actor: encoder
    locator: "Appendix C.3.1"
    text: 'Note also that CDE does NOT include a requirement for Unicode normalization [UAX-15]'
    kind: inferred
    testable: no
    status: active

  - id: "draft-ietf-cbor-cde#R-0069"
    object: CDE-checking decoder
    field: "input checking - the decoder verifies preferred-serialization and definite-length-only on input, which is what turns these encoding constraints into interoperability constraints. Appendix C is declared informative"
    verb: MUST
    actor: decoder
    locator: "Appendix C.3.2"
    text: 'CDE-checking decoders MUST check the input for keeping the preferred-serialization and definite-length-only encoding constraints.'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0070"
    object: CDE-checking decoder
    field: "input checking - strict ordering of major type 5 entries by lexicographic key comparison, including rejection of duplicate map keys. Appendix C is declared informative"
    verb: MUST
    actor: decoder
    locator: "Appendix C.3.2"
    text: 'CDE-checking decoders MUST check the input for keeping the lexicographic-map-sorting encoding constraints, i.e., they need to check for strict ordering of map (major type 5) entries by lexicographically comparing their keys (including rejecting duplicate map keys).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0071"
    object: CDE-checking decoder
    field: "input checking - UTF-8 validity of major type 3 text strings, completing the basic-validity check. Appendix C is declared informative. The source sentence has an unbalanced parenthesis, the one opened at 'see' never being closed"
    verb: MUST
    actor: decoder
    locator: "Appendix C.3.2"
    text: 'To complete checking for basic validity of the CBOR encoding (see Section 5.3.1 of RFC 8949 [STD94], CDE-checking decoders MUST check the validity of the UTF-8 encoding of text strings (major type 3).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0072"
    object: data item that fails a CDE check
    field: "fail-closed - a failing data item is not handed to the application, except via a diagnostic channel that cannot be confused with a correctly CDE-decoded item; this is the condition for calling a decoder CDE-checking at all. Appendix C is declared informative"
    verb: MUST NOT
    actor: decoder
    locator: "Appendix C.3.2"
    text: 'To be called a CDE-checking decoder, it MUST NOT present to the application a decoded data item that fails one of these checks (except maybe via special diagnostic channels with no potential for confusion with a correctly CDE-decoded data item).'
    kind: stated
    testable: yes
    status: active

  - id: "draft-ietf-cbor-cde#R-0073"
