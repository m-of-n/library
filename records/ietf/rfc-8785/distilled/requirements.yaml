note: >
  Ids are stable and never reused. Cite as rfc-8785#R-NNNN.
  Entries are in source order. A compound sentence is split only where each
  part is separately testable, so one RFC sentence can carry several ids
  (R-0012/R-0013, R-0014/R-0015, R-0020/R-0021, R-0022/R-0023/R-0024); each
  split keeps its own BCP 14 keyword, so the two counts still agree.
  Entries with keyword "none" are lowercase obligations carrying no BCP 14
  keyword. Exactly one entry is kind "inferred" (R-0036); its text is not
  verbatim RFC text and it carries no keyword.

requirements:
  - id: "rfc-8785#R-0001"
    object: 'JCS support in an existing JSON tool'
    field: 'the way JCS support is added to an existing JSON tool'
    verb: RECOMMENDED
    actor: 'JSON tool vendor / JCS implementer'
    locator: "§3"
    text: 'Appendix F describes the RECOMMENDED way of adding JCS support to existing JSON tools.'
    kind: stated
    testable: partial
    testable_reason: 'designates an integration architecture (canonicalizer as a post processor to an existing serializer) rather than a property of the output; compliance is judged by inspecting how JCS support was added, not by comparing canonical bytes.'
    status: active
  - id: "rfc-8785#R-0002"
    object: 'input data to be canonically serialized'
    field: 'conformance of the input data to the I-JSON subset, however the data was created'
    verb: MUST
    actor: 'data producer (creator of the input data)'
    locator: "§3.1"
    text: 'Irrespective of the method used, the data to be serialized MUST be adapted for I-JSON [RFC7493] formatting, which implies the following:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0003"
    object: 'JSON object in the input data'
    field: 'presence of duplicate property names'
    verb: MUST NOT
    actor: 'data producer (creator of the input data)'
    locator: "§3.1"
    text: 'JSON objects MUST NOT exhibit duplicate property names.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0004"
    object: 'JSON string data in the input data'
    field: 'expressibility of string data as Unicode'
    verb: MUST
    actor: 'data producer (creator of the input data)'
    locator: "§3.1"
    text: 'JSON string data MUST be expressible as Unicode [UNICODE].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0005"
    object: 'JSON number data in the input data'
    field: 'expressibility of number data as an IEEE 754 double-precision value'
    verb: MUST
    actor: 'data producer (creator of the input data)'
    locator: "§3.1"
    text: 'JSON number data MUST be expressible as IEEE 754 [IEEE754] double-precision values.'
    kind: stated
    testable: partial
    testable_reason: 'the document gives no procedure for deciding whether a given JSON number is expressible as a double; overflow (1.4e+9999) is detectable, but silent precision loss on a long integer such as 9223372036854775807 is rejected nowhere in JCS, and Appendix B note (1) only SHOULDs the safe-integer range (rfc-8785#R-0038).'
    status: active
  - id: "rfc-8785#R-0006"
    object: 'numbers needing more precision or range than an IEEE 754 double'
    field: 'carrying high-precision or long-integer values as JSON strings instead of JSON numbers'
    verb: RECOMMENDED
    actor: 'data producer / schema designer'
    locator: "§3.1"
    text: 'For applications needing higher precision or longer integers than offered by IEEE 754 double precision, it is RECOMMENDED to represent such numbers as JSON strings; see Appendix D for details on how this can be performed in an interoperable and extensible way.'
    kind: stated
    testable: partial
    testable_reason: 'triggered by an application''s precision needs, which are outside this document; nothing in a JSON text mechanically shows that a number should have been string-wrapped.'
    status: active
  - id: "rfc-8785#R-0007"
    object: 'parsed JSON string data'
    field: 'stability of a parsed string value across a later re-serialization'
    verb: MUST NOT
    actor: 'JSON parser and serializer of the application (the parse-serialize round trip)'
    locator: "§3.1"
    text: 'An additional constraint is that parsed JSON string data MUST NOT be altered during subsequent serializations.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0008"
    object: 'Unicode string data anywhere in a JCS-dependent scheme'
    field: 'Unicode Normalization, which JCS does not apply and no component may apply'
    verb: MUST
    actor: 'every component of a scheme depending on JCS (producer, serializer, canonicalizer, transport, verifier)'
    locator: "§3.1"
    text: 'That is, all components involved in a scheme depending on JCS MUST preserve Unicode string data "as is".'
    kind: stated
    testable: partial
    testable_reason: 'the obligation falls on every component of a deployed scheme, including storage and transport outside any one implementation; a single implementation can be tested for non-normalization by feeding it NFC/NFD pairs, but scheme-wide compliance cannot be tested.'
    status: active
  - id: "rfc-8785#R-0009"
    object: 'canonical output'
    field: 'whitespace between JSON tokens'
    verb: MUST NOT
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.1"
    text: 'Whitespace between JSON tokens MUST NOT be emitted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0010"
    object: 'JSON literals'
    field: 'serialized form of the literals null, true and false'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.2.1"
    text: 'In accordance with JSON [RFC8259], the literals "null", "true", and "false" MUST be serialized as null, true, and false, respectively.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0011"
    object: 'JSON string data, including object property names'
    field: 'the per-code-point serialization rule, applied to property names as well as values'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.2.2"
    text: 'For JSON string data (which includes JSON object property names as well), each Unicode code point MUST be serialized as described below (see Section 24.3.2.2 of [ECMA-262]):'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0012"
    object: 'Unicode code point in U+0000 through U+001F'
    field: 'escaping of ASCII control characters as lowercase hexadecimal \uhhhh'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.2.2"
    text: 'If the Unicode value falls within the traditional ASCII control character range (U+0000 through U+001F), it MUST be serialized using lowercase hexadecimal Unicode notation (\uhhhh) unless it is in the set of predefined JSON control characters U+0008, U+0009, U+000A, U+000C, or U+000D,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0013"
    object: 'U+0008, U+0009, U+000A, U+000C, U+000D'
    field: 'two-character escapes for the five predefined JSON control characters'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.2.2"
    text: 'which MUST be serialized as \b, \t, \n, \f, and \r, respectively.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0014"
    object: 'Unicode code point outside the ASCII control range'
    field: 'literal (unescaped) emission of non-control code points'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.2.2"
    text: 'If the Unicode value is outside of the ASCII control character range, it MUST be serialized "as is" unless it is equivalent to U+005C (\) or U+0022 ("),'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0015"
    object: 'U+005C and U+0022'
    field: 'escaping of reverse solidus and quotation mark'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.2.2"
    text: 'which MUST be serialized as \\ and \", respectively.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0016"
    object: 'serialized string'
    field: 'enclosure of the resulting code point sequence in double quotes'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.2.2"
    text: 'Finally, the resulting sequence of Unicode code points MUST be enclosed in double quotes (").'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0017"
    object: 'invalid Unicode data such as lone surrogates'
    field: 'termination with an error instead of producing output'
    verb: MUST
    actor: 'JCS implementation (canonicalizer)'
    locator: "§3.2.2.2"
    text: 'Note: Since invalid Unicode data like "lone surrogates" (e.g., U+DEAD) may lead to interoperability issues including broken signatures, occurrences of such data MUST cause a compliant JCS implementation to terminate with an appropriate error.'
    kind: stated
    testable: partial
    testable_reason: 'termination is observable, but an appropriate error is not specified, so only the abort can be checked and not the error itself.'
    status: active
  - id: "rfc-8785#R-0018"
    object: 'JSON number data'
    field: 'the number serialization algorithm, ECMA-262 7.1.12.1 including the Note 2 enhancement'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.2.3"
    text: 'Such data MUST be serialized according to Section 7.1.12.1 of [ECMA-262], including the "Note 2" enhancement.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0019"
    object: 'NaN and Infinity'
    field: 'termination with an error instead of producing output'
    verb: MUST
    actor: 'JCS implementation (canonicalizer)'
    locator: "§3.2.2.3"
    text: 'Note: Since Not a Number (NaN) and Infinity are not permitted in JSON, occurrences of NaN or Infinity MUST cause a compliant JCS implementation to terminate with an appropriate error.'
    kind: stated
    testable: partial
    testable_reason: 'termination is observable, but an appropriate error is not specified, so only the abort can be checked and not the error itself.'
    status: active
  - id: "rfc-8785#R-0020"
    object: 'JSON object properties'
    field: 'recursive application of property sorting'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.3"
    text: 'JSON object properties MUST be sorted recursively,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0021"
    object: 'JSON child object'
    field: 'sorting of a nested object''s own properties'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.3"
    text: 'which means that JSON child Objects MUST have their properties sorted as well.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0022"
    object: 'JSON array data'
    field: 'descent into arrays looking for contained JSON objects'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.3"
    text: 'JSON array data MUST also be scanned for the presence of JSON objects'
    kind: stated
    testable: partial
    testable_reason: 'the scan is an internal action, observable only through its effect, which is stated separately as rfc-8785#R-0023.'
    status: active
  - id: "rfc-8785#R-0023"
    object: 'JSON object found inside an array'
    field: 'sorting of the properties of an object nested in an array'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.3"
    text: '(if an object is found, then its properties MUST be sorted)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0024"
    object: 'JSON array elements'
    field: 'order of array elements, which is preserved while object properties are reordered'
    verb: MUST NOT
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.3"
    text: 'but array element order MUST NOT be changed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0025"
    object: 'the property sorting process'
    field: 'the three measures that define the sort (raw form, UTF-16 code units, comparison rule)'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.3"
    text: 'When a JSON object is about to have its properties sorted, the following measures MUST be adhered to:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0026"
    object: 'property name strings being sorted'
    field: 'sorting operates on raw unescaped names, not on their escaped JSON form'
    verb: none
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.3"
    text: 'The sorting process is applied to property name strings in their "raw" (unescaped) form. That is, a newline character is treated as U+000A.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0027"
    object: 'property name strings being sorted'
    field: 'names compared as arrays of UTF-16 code units, as unsigned integers, independent of locale'
    verb: none
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.3"
    text: 'Property name strings to be sorted are formatted as arrays of UTF-16 [UNICODE] code units. The sorting is based on pure value comparisons, where code units are treated as unsigned integers, independent of locale settings.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0028"
    object: 'two property name strings'
    field: 'the comparison predicate, first differing code unit and otherwise shorter string first'
    verb: none
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.3"
    text: 'Property name strings either have different values at some index that is a valid index for both strings, or their lengths are different, or both. If they have different values at one or more index positions, let k be the smallest such index; then, the string whose value at position k has the smaller value, as determined by using the "<" operator, lexicographically precedes the other string. If there is no index position at which they differ, then the shorter string lexicographically precedes the longer string.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0029"
    object: 'property name strings on a non-UTF-16 platform'
    field: 'conversion of names to UTF-16 code unit arrays before sorting'
    verb: none
    actor: 'JCS implementer on a platform whose internal string representation is not UTF-16'
    locator: "§3.2.3"
    text: 'Systems using another internal representation of string data will need to convert JSON property name strings into arrays of UTF-16 code units before sorting.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0030"
    object: 'the final canonical representation'
    field: 'character encoding of the output octets'
    verb: MUST
    actor: 'JCS canonicalizer (serializer)'
    locator: "§3.2.4"
    text: 'Finally, in order to create a platform-independent representation, the result of the preceding step MUST be encoded in UTF-8.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0031"
    object: 'received input data'
    field: 'sanity checking of input to protect system integrity'
    verb: none
    actor: 'application acting on received data (signature verifier)'
    locator: "§5"
    text: 'It is crucial to perform sanity checks on input data to avoid overflowing buffers and similar things that could affect the integrity of the system.'
    kind: stated
    testable: no
    testable_reason: 'sanity checks and similar things are not enumerated and no conformance criterion is given; it is advice, not a checkable rule.'
    status: active
  - id: "rfc-8785#R-0032"
    object: 'received signed data'
    field: 'the three operations required before acting upon received data'
    verb: MUST
    actor: 'application acting on received data (signature verifier)'
    locator: "§5"
    text: 'When JCS is applied to signature schemes like the one described in Appendix F, applications MUST perform the following operations before acting upon received data:'
    kind: stated
    testable: partial
    testable_reason: 'constrains application-level processing before acting on data; observable only by behavioural testing of the consuming application, never from a canonicalizer''s output.'
    status: active
  - id: "rfc-8785#R-0033"
    object: 'received JSON data (step 1)'
    field: 'parsing and I-JSON conformance checking of received data'
    verb: none
    actor: 'application acting on received data (signature verifier)'
    locator: "§5"
    text: 'Parse the JSON data and verify that it adheres to I-JSON.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0034"
    object: 'received data (step 2)'
    field: 'ecosystem correctness checking, including locating the signature property'
    verb: none
    actor: 'application acting on received data (signature verifier)'
    locator: "§5"
    text: 'Verify the data for correctness according to the conventions defined by the ecosystem where it is to be used. This also includes locating the property holding the signature data.'
    kind: stated
    testable: no
    testable_reason: 'the conventions are defined by the ecosystem in which the data is used, not by this document, so there is no criterion here to test against.'
    status: active
  - id: "rfc-8785#R-0035"
    object: 'the signature (step 3)'
    field: 'cryptographic verification of the signature'
    verb: none
    actor: 'application acting on received data (signature verifier)'
    locator: "§5"
    text: 'Verify the signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0036"
    object: 'the three operations of Section 5'
    field: 'the operations form an ordered sequence, not an unordered set'
    verb: none
    actor: 'application acting on received data (signature verifier)'
    locator: "§5"
    text: 'The three operations are performed in the order given, that is, I-JSON parse, then ecosystem correctness checking including location of the signature property, then signature verification, before any action is taken on the received data.'
    kind: inferred
    testable: partial
    testable_reason: 'the ordering is implied by the numbered list and by the phrase before acting upon received data; it is not stated in those words. Observable only where a later step would otherwise mask an earlier failure, for example verifying a signature over data that was never checked against I-JSON.'
    status: active
  - id: "rfc-8785#R-0037"
    object: 'the operation in progress'
    field: 'aborting when any of the three operations fails'
    verb: MUST
    actor: 'application acting on received data (signature verifier)'
    locator: "§5"
    text: 'If any of these steps fail, the operation in progress MUST be aborted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8785#R-0038"
    object: 'JSON numbers intended as true integers'
    field: 'the safe-integer range -9007199254740991 to 9007199254740991'
    verb: SHOULD
    actor: 'data producer / application designer'
    locator: "Appendix B"
    text: 'For maximum compliance with the ECMAScript "JSON" object, values that are to be interpreted as true integers SHOULD be in the range -9007199254740991 to 9007199254740991.'
    kind: stated
    testable: partial
    testable_reason: 'values that are to be interpreted as true integers is an application-level notion not visible in the JSON text, and the same note states that how numbers are used in applications does not affect the JCS algorithm.'
    status: active
  - id: "rfc-8785#R-0039"
    object: 'numbers with no natural place in the JSON number type (big integers, giant exponents, decimal money)'
    field: 'wrapping such values in the JSON string type'
    verb: MUST
    actor: 'data producer / schema designer'
    locator: "Appendix D"
    text: 'Due to the above, numbers that do not have a natural place in the current JSON ecosystem MUST be wrapped using the JSON string type.'
    kind: stated
    testable: partial
    testable_reason: 'numbers that do not have a natural place in the current JSON ecosystem has no mechanical definition in this document; the boundary is an application judgement.'
    status: active
  - id: "rfc-8785#R-0040"
    object: 'JSON string subtypes such as BigInt and DateTime'
    field: 'handling the interoperability problems that subtype-carrying strings cause'
    verb: MUST
    actor: 'JCS-compliant application that uses JSON string subtypes and targets a wider audience'
    locator: "Appendix E"
    text: 'This can, depending on JSON parsing method, lead to interoperability problems, which MUST be dealt with by JCS-compliant applications targeting a wider audience.'
    kind: stated
    testable: partial
    testable_reason: 'dealt with is not defined at this point and targeting a wider audience is not mechanically decidable; the concrete obligation it anticipates is rfc-8785#R-0041.'
    status: active
  - id: "rfc-8785#R-0041"
    object: 'subtypes under stream-based and schema-based parsing'
    field: 'subtype strings stay immutable JSON strings, with native conversion in a later step'
    verb: MUST
    actor: 'stream-based or schema-based JSON parser of the application'
    locator: "Appendix E"
    text: 'That is, stream- and schema-based parsing MUST treat subtypes as "pure" (immutable) JSON string types and perform the actual conversion to the designated native type in a subsequent step.'
    kind: stated
    testable: yes
    status: active
