schema: "library-distilled-protocol/v1"
record: rfc-8785
applicability: "PARTIAL. RFC 8785 defines no exchange protocol - no counterparties, no messages, no framing, no IANA actions (section 4). It does define local PROCESSING ORDER in section 5 (normative) and Appendix F (non-normative), and that order is what R-O-05 contradicts. Prose, diagrams and verbatim quotes are in protocol.md."
note: "bin/_yaml.py supports no multi-line scalars, so every value here is a single-line quoted string. Do not introduce > or | blocks."

roles:
  - name: producer
    description: "Creates and signs data. Appendix F steps 1-6."
  - name: verifier
    description: "Application acting on received data. Section 5 steps 1-3 and Appendix F steps 1-6."
  - name: canonicalizer
    description: "External filter invoked by both. Appendix F calls it a filter, potentially usable with a multitude of different cryptographic schemes."

flows:
  - name: application-acting-on-received-data
    locator: "§5"
    normative: true
    keyword: MUST
    description: "The only procedural content in the document carrying a BCP 14 keyword."
    steps:
      - n: 1
        text: "Parse the JSON data and verify that it adheres to I-JSON."
        on_unauthenticated_input: true
      - n: 2
        text: "Verify the data for correctness according to the conventions defined by the ecosystem where it is to be used.  This also includes locating the property holding the signature data."
        on_unauthenticated_input: true
      - n: 3
        text: "Verify the signature."
        on_unauthenticated_input: false
    failure: "If any of these steps fail, the operation in progress MUST be aborted."
    finding: "Steps 1 and 2 run on unauthenticated input and step 2 locates the signature property inside it before step 3 authenticates anything. R-O-05 requires the inverse order."

  - name: signature-creation
    locator: "Appendix F"
    normative: false
    keyword: none
    description: "Producer side. No BCP 14 keyword appears anywhere in Appendix F."
    steps:
      - n: 1
        text: "Create the data to be signed."
      - n: 2
        text: "Serialize the data using existing JSON tools."
      - n: 3
        text: "Let the external canonicalizer process the serialized data and return canonicalized result data."
      - n: 4
        text: "Sign the canonicalized data."
      - n: 5
        text: "Add the resulting signature value to the original JSON data through a designated signature property."
      - n: 6
        text: "Serialize the completed (now signed) JSON object using existing JSON tools."
    finding: "Steps 1-4 are compatible with R-O-05 - canonicalise once, at authoring, on trusted input. Steps 5-6 are not, because they re-serialise after signing, so the signed octets are not the transmitted octets."

  - name: signature-verification
    locator: "Appendix F"
    normative: false
    keyword: none
    description: "Verifier side. This is the procedure R-O-05 forbids."
    steps:
      - n: 1
        text: "Parse the signed JSON data using existing JSON tools."
        on_unauthenticated_input: true
      - n: 2
        text: "Read and save the signature value from the designated signature property."
        on_unauthenticated_input: true
      - n: 3
        text: "Remove the signature property from the parsed JSON object."
        on_unauthenticated_input: true
        mutates_input: true
      - n: 4
        text: "Serialize the remaining JSON data using existing JSON tools."
        on_unauthenticated_input: true
      - n: 5
        text: "Let the external canonicalizer process the serialized data and return canonicalized result data."
        on_unauthenticated_input: true
        canonicalises_during_verification: true
      - n: 6
        text: "Verify that the canonicalized data matches the saved signature value using the algorithm and key used for creating the signature."
        on_unauthenticated_input: false
    finding: "Steps 3-5 mutate, re-serialise and re-canonicalise unauthenticated input before any cryptography runs at step 6. R-O-05 forbids canonicalising as part of verification."

error_paths:
  - trigger: "Input is not I-JSON"
    response: "abort"
    locator: "§5"
    actor: application
  - trigger: "Ecosystem correctness check fails"
    response: "abort"
    locator: "§5"
    actor: application
  - trigger: "Signature does not verify"
    response: "abort"
    locator: "§5"
    actor: application
  - trigger: "Lone surrogate in string data"
    response: "terminate with an appropriate error"
    locator: "§3.2.2.2"
    actor: canonicalizer
  - trigger: "NaN or Infinity in number data"
    response: "terminate with an appropriate error"
    locator: "§3.2.2.3"
    actor: canonicalizer

absent:
  - "No transport, negotiation, versioning handshake or key distribution."
  - "No algorithm identifier, key representation or signature-value encoding; Appendix F leaves the signature property merely designated."
  - "No signalling to a counterparty, because there is none."
  - "An appropriate error is nowhere specified."

signature_property:
  finding: "The designated signature property is never present while canonicalization runs - added at creation step 5 after signing at step 4, removed at verification step 3 before canonicalising at step 5."
  derived_consequence_1: "Its name cannot affect sort order, so it may be chosen freely."
  derived_consequence_2: "The signature input carries no tag, length, algorithm binding or domain separation; any such binding must live as ordinary properties inside the canonicalized object."
