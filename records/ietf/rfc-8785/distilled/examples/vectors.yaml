      5d 2c 22 73 74 72 69 6e 67 22 3a 22 e2 82 ac 24 5c 75 30 30
      30 66 5c 6e 41 27 42 5c 22 5c 5c 5c 5c 5c 22 2f 22 7d
    expected_encoding: "hexadecimal, space-separated, 20 bytes per line as printed in the source"
    expected_byte_count: 118
    input_char_count: 116
    notes: >-
      The expected block is the source's hexadecimal listing verbatim,
      including its line breaks (which are display layout; the byte sequence
