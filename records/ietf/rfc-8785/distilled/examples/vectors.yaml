# Conventions used in this file
#
# Every vector carries:
#   id        stable identifier, never reused
#   locator   section or appendix of RFC 8785 the vector is taken from
#   kind      what the vector tests
#   input     the input, verbatim unless `fidelity` says otherwise
#   expected  the expected output, verbatim; `error` for cases the spec
#             requires an implementation to reject
#   fidelity  verbatim      -- character-for-character from the source
#             reconstructed -- source showed a display-only line wrap; the
#                              true single-line value has been rejoined
#             split         -- extracted from a larger verbatim example in
#                              the source; the characters are the source's
#             constructed   -- built from the source's prose, which states
#                              the rule but prints no literal example
#   violates  for error cases: the rule broken and its locator
#
# `fidelity` describes `expected`. Where the input was obtained
# differently, an `input_fidelity` key overrides it for `input`
# (only JCS-324-01 needs this: its expected hex block is verbatim,
# while its input is the rejoined Section 3.2.3 canonical string).
#
# All `input` and `expected` values are YAML literal block scalars (|-), so
# no escape processing is applied by the YAML parser. A backslash in a value
# is a backslash in the data.
#
# The source renders every example indented 5 spaces inside the RFC text
# margin. That uniform margin is RFC page layout, not content, and has been
# removed. Indentation *relative* to the start of an example is preserved.
#
# Derived material is never mixed into `input` or `expected`. Where it is
# useful it appears under `derived:` with `in_source: false`.

vectors:

  # ===================================================================
  # Section 3.1 -- Creation of Input Data
  # ===================================================================

  - id: JCS-31-E1
    locator: "RFC 8785 Section 3.1"
    kind: error-duplicate-property-names
    fidelity: constructed
    input: |-
      {"a":1,"a":2}
    expected: error
    violates:
      rule: "JSON objects MUST NOT exhibit duplicate property names."
      locator: "RFC 8785 Section 3.1 (I-JSON, RFC 7493)"
    notes: >-
      The source states the rule but prints no literal example. The input
      above is the minimal object exhibiting the violation. Section 5 step 1
      requires a verifier to parse and confirm I-JSON adherence before
      acting on received data, and to abort if that step fails.

  # ===================================================================
  # Section 3.2.2 -- Serialization of Primitive Data Types
  # ===================================================================

  - id: JCS-322-01
    locator: "RFC 8785 Section 3.2.2"
    kind: ecmascript-stringify-divergence-not-canonical
    fidelity: reconstructed
    input: |-
      {
        "numbers": [333333333.33333329, 1E30, 4.50,
                    2e-3, 0.000000000000000000000000001],
        "string": "\u20ac$\u000F\u000aA'\u0042\u0022\u005c\\\"\/",
        "literals": [null, true, false]
      }
    expected: |-
      {"numbers":[333333333.3333333,1e+30,4.5,0.002,1e-27],"string":"€$\u000f\nA'B\"\\\\\"/","literals":[null,true,false]}
    notes: >-
      This expected value is NOT the JCS canonical form. It is the result of
      ECMAScript "JSON.stringify()", which performs JCS-compatible primitive
      serialization but preserves property creation/receipt order. The source
      prints it to show how far the serialized form diverges from the parsed
      input. The canonical form of the same object is JCS-323-01.
    reconstruction: >-
      The source prints the expected value across two lines and states
      explicitly "(with a line wrap added for display purposes only)". The
      wrap falls between `"string":` and `"€$...`. The two lines have been
      rejoined with no separator to recover the true single-line value. This
      reconstruction is confirmed independently: the same string appears in
      JCS-323-01, whose byte encoding is given in full in Section 3.2.4
      (JCS-324-01), and those bytes decode to exactly the sequence used here.
    properties:
      euro_sign_codepoint: "U+20AC"
      euro_sign_utf8: "e2 82 ac"

  - id: JCS-322-02
    locator: "RFC 8785 Section 3.2.2 (string member of the sample object)"
    kind: string-escape-serialization
    fidelity: split
    input: |-
      "\u20ac$\u000F\u000aA'\u0042\u0022\u005c\\\"\/"
    expected: |-
      "€$\u000f\nA'B\"\\\\\"/"
    notes: >-
      Extracted from the `"string"` member of the JCS-322-01 object. The
      characters are the source's; only the surrounding object has been
      removed. The same expected value is produced by the canonical form
      (Section 3.2.3) and is confirmed byte-for-byte by Section 3.2.4.
    derived:
      in_source: false
      description: >-
        Per-escape breakdown, derived by applying the Section 3.2.2.2 rules
        to the input. Offered as an implementation aid; it is not in RFC 8785.
      breakdown:
        - input_token: '\u20ac'
          code_point: "U+20AC EURO SIGN"
          output: "€"
          rule: "outside ASCII control range, not U+005C or U+0022 -> emitted as is"
        - input_token: '$'
          code_point: "U+0024"
          output: "$"
          rule: "emitted as is"
        - input_token: '\u000F'
          code_point: "U+000F"
          output: '\u000f'
          rule: "ASCII control range, not a predefined JSON control char -> lowercase \\uhhhh"
        - input_token: '\u000a'
          code_point: "U+000A"
          output: '\n'
          rule: "predefined JSON control character -> \\n"
        - input_token: 'A'
          code_point: "U+0041"
          output: "A"
          rule: "emitted as is"
        - input_token: "'"
          code_point: "U+0027"
          output: "'"
          rule: "emitted as is; apostrophe is NOT escaped"
        - input_token: '\u0042'
          code_point: "U+0042"
          output: "B"
          rule: "escape resolved on parse, then emitted as is"
        - input_token: '\u0022'
          code_point: "U+0022"
          output: '\"'
          rule: 'equivalent to U+0022 -> backslash plus double quote'
        - input_token: '\u005c'
          code_point: "U+005C"
          output: '\\'
          rule: "equivalent to U+005C -> two backslashes"
        - input_token: '\\'
          code_point: "U+005C"
          output: '\\'
          rule: "equivalent to U+005C -> two backslashes"
        - input_token: '\"'
          code_point: "U+0022"
          output: '\"'
          rule: 'equivalent to U+0022 -> backslash plus double quote'
        - input_token: '\/'
          code_point: "U+002F"
          output: "/"
          rule: >-
            JSON permits the \/ escape on input; U+002F is outside the ASCII
            control range and is neither U+005C nor U+0022, so it is emitted
            as is. The escape is NOT reproduced on output.

  - id: JCS-322-03
    locator: "RFC 8785 Section 3.2.2 (numbers member of the sample object)"
    kind: number-reserialization
    fidelity: split
    input: |-
      [333333333.33333329, 1E30, 4.50, 2e-3, 0.000000000000000000000000001]
    expected: |-
      [333333333.3333333,1e+30,4.5,0.002,1e-27]
    notes: >-
      Extracted from the `"numbers"` member of the JCS-322-01 object; in the
      source the array itself is split across two display lines inside the
      pretty-printed input object, so the input here is that array rejoined.
      Element-by-element: 333333333.33333329 -> 333333333.3333333 (rounded to
      the nearest IEEE 754 double, then shortest round-trip); 1E30 -> 1e+30
      (uppercase E normalised to lowercase, explicit + sign); 4.50 -> 4.5
      (trailing zero dropped); 2e-3 -> 0.002 (exponent below the threshold,
      written positionally); 0.000000000000000000000000001 -> 1e-27. Array
      element order MUST NOT be changed (Section 3.2.3).

  - id: JCS-322-04
    locator: "RFC 8785 Sections 3.2.2 and 3.2.2.1"
    kind: literal-serialization
    fidelity: split
    input: |-
      [null, true, false]
    expected: |-
      [null,true,false]
    notes: >-
      Extracted from the `"literals"` member of the JCS-322-01 object.
      Section 3.2.2.1: the literals null, true and false MUST be serialized
      as null, true and false respectively. Whitespace between tokens MUST
      NOT be emitted (Section 3.2.1).

  # ===================================================================
  # Section 3.2.2.2 -- Serialization of Strings
  # ===================================================================

  - id: JCS-3222-E1
    locator: "RFC 8785 Section 3.2.2.2 (Note)"
    kind: error-lone-surrogate
    fidelity: constructed
    input: |-
      "\udead"
    expected: error
    violates:
      rule: >-
        Since invalid Unicode data like "lone surrogates" (e.g., U+DEAD) may
        lead to interoperability issues including broken signatures,
        occurrences of such data MUST cause a compliant JCS implementation to
        terminate with an appropriate error.
      locator: "RFC 8785 Section 3.2.2.2, Note"
    notes: >-
      The source names U+DEAD as its example of a lone surrogate but prints
      no JSON literal. U+DEAD lies in the low-surrogate range
      U+DC00..U+DFFF; expressed as a JSON string it is "\udead", with no
      preceding high surrogate. An unpaired high surrogate such as "\ud83d"
      is the symmetric case and must be rejected on the same rule. Compare
      JCS-323-02, where "\ud83d\ude00" is a well-formed surrogate PAIR and
      must be accepted.

  # ===================================================================
  # Section 3.2.2.3 -- Serialization of Numbers
  # ===================================================================

  - id: JCS-3223-E1
    locator: "RFC 8785 Section 3.2.2.3 (Note); Appendix B note (3)"
    kind: error-nan
    fidelity: constructed
    input: |-
      NaN
    expected: error
    violates:
      rule: >-
        Since Not a Number (NaN) and Infinity are not permitted in JSON,
        occurrences of NaN or Infinity MUST cause a compliant JCS
        implementation to terminate with an appropriate error.
      locator: "RFC 8785 Section 3.2.2.3, Note"
    notes: >-
      Stated as a rule in Section 3.2.2.3 and tabulated as IEEE 754
      7fffffffffffffff with an empty JSON Representation cell in Appendix B
      (see JCS-B-10, which carries the same case in IEEE 754 bit form).

  - id: JCS-3223-E2
    locator: "RFC 8785 Section 3.2.2.3 (Note); Appendix B note (3)"
    kind: error-infinity
    fidelity: constructed
    input: |-
      Infinity
    expected: error
    violates:
      rule: >-
        Since Not a Number (NaN) and Infinity are not permitted in JSON,
        occurrences of NaN or Infinity MUST cause a compliant JCS
        implementation to terminate with an appropriate error.
      locator: "RFC 8785 Section 3.2.2.3, Note"
    notes: >-
      Tabulated as IEEE 754 7ff0000000000000 with an empty JSON
      Representation cell in Appendix B (see JCS-B-11). Negative infinity,
      fff0000000000000, is the symmetric case; the source tabulates only the
      positive one.

  # ===================================================================
  # Section 3.2.3 -- Sorting of Object Properties
  # ===================================================================

  - id: JCS-323-01
    locator: "RFC 8785 Section 3.2.3"
    kind: canonicalization-end-to-end
    fidelity: reconstructed
    input: |-
      {
        "numbers": [333333333.33333329, 1E30, 4.50,
                    2e-3, 0.000000000000000000000000001],
        "string": "\u20ac$\u000F\u000aA'\u0042\u0022\u005c\\\"\/",
        "literals": [null, true, false]
      }
    expected: |-
      {"literals":[null,true,false],"numbers":[333333333.3333333,1e+30,4.5,0.002,1e-27],"string":"€$\u000f\nA'B\"\\\\\"/"}
    notes: >-
      The canonical form of the same object as JCS-322-01. Properties are
      sorted "literals" < "numbers" < "string"; array element order within
      "numbers" and "literals" is unchanged. This is the single most
      load-bearing vector in the document: its UTF-8 encoding is given
      byte-for-byte in Section 3.2.4 as JCS-324-01.
    reconstruction: >-
      The source prints the expected value across two lines and states
      explicitly "(with a line wrap added for display purposes only)". The
      wrap falls between `333333333.3333333,` and `1e+30`. The two lines have
      been rejoined with no separator. Verified: the rejoined string encodes
      to exactly the 118 bytes listed in Section 3.2.4.
    expected_utf8_byte_count: 118
    expected_char_count: 116

  - id: JCS-323-02
    locator: "RFC 8785 Section 3.2.3 (the document's own sorting conformance vector)"
    kind: property-name-sorting-utf16-code-units
    fidelity: verbatim
    conformance: >-
      The source introduces this as "The following JSON test data can be used
      for verifying the correctness of the sorting scheme in a JCS
      implementation". It is the document's designated sorting test.
    input: |-
      {
        "\u20ac": "Euro Sign",
        "\r": "Carriage Return",
        "\ufb33": "Hebrew Letter Dalet With Dagesh",
        "1": "One",
        "\ud83d\ude00": "Emoji: Grinning Face",
        "\u0080": "Control",
        "\u00f6": "Latin Small Letter O With Diaeresis"
      }
    expected: |-
      "Carriage Return"
      "One"
      "Control"
      "Latin Small Letter O With Diaeresis"
      "Euro Sign"
      "Emoji: Grinning Face"
      "Hebrew Letter Dalet With Dagesh"
    expected_form: >-
      The source gives the expectation as the property VALUES listed in the
      order their property names take after sorting, under the heading
      "Expected argument order after sorting property strings". Each value
      identifies its property uniquely, so the list fixes the key order
      exactly. The seven lines above are verbatim, in the source's order.
    expected_key_order:
      in_source: false
      description: >-
        The same expectation restated as the property-name sort key sequence,
        derived by mapping each value back to its property name. Included
        because an implementation compares keys, not values.
      order:
        - name_escaped: '"\r"'
          code_point: "U+000D"
          utf16_code_units: ["000d"]
          value: "Carriage Return"
        - name_escaped: '"1"'
          code_point: "U+0031"
          utf16_code_units: ["0031"]
          value: "One"
        - name_escaped: '"\u0080"'
          code_point: "U+0080"
          utf16_code_units: ["0080"]
          value: "Control"
        - name_escaped: '"\u00f6"'
          code_point: "U+00F6"
          utf16_code_units: ["00f6"]
          value: "Latin Small Letter O With Diaeresis"
        - name_escaped: '"\u20ac"'
          code_point: "U+20AC"
          utf16_code_units: ["20ac"]
          value: "Euro Sign"
        - name_escaped: '"\ud83d\ude00"'
          code_point: "U+1F600"
          utf16_code_units: ["d83d", "de00"]
          value: "Emoji: Grinning Face"
        - name_escaped: '"\ufb33"'
          code_point: "U+FB33"
          utf16_code_units: ["fb33"]
          value: "Hebrew Letter Dalet With Dagesh"
    derived:
      in_source: false
      description: >-
        RFC 8785 stops at the sort order and never prints the canonicalized
        document for this input. The canonical output below was derived by
        applying Sections 3.2.1, 3.2.2.2, 3.2.3 and 3.2.4 to the input, and
        is given in both text and hex so the vector is reproducible
        byte-for-byte. It is NOT in RFC 8785; treat it as pass-1 derivation
        pending verification.
      canonical_output: |-
        {"\r":"Carriage Return","1":"One","<U+0080>":"Control","<U+00F6>":"Latin Small Letter O With Diaeresis","<U+20AC>":"Euro Sign","<U+1F600>":"Emoji: Grinning Face","<U+FB33>":"Hebrew Letter Dalet With Dagesh"}
      canonical_output_note: >-
        In the text form above, the property name after "One" is the single
        RAW character U+0080, which is not printable. The hex form below is
        authoritative; read bytes 36-37 (c2 80) as that character.
      canonical_output_utf8_hex: |-
        7b 22 5c 72 22 3a 22 43 61 72 72 69 61 67 65 20 52 65 74 75
        72 6e 22 2c 22 31 22 3a 22 4f 6e 65 22 2c 22 c2 80 22 3a 22
        43 6f 6e 74 72 6f 6c 22 2c 22 c3 b6 22 3a 22 4c 61 74 69 6e
        20 53 6d 61 6c 6c 20 4c 65 74 74 65 72 20 4f 20 57 69 74 68
        20 44 69 61 65 72 65 73 69 73 22 2c 22 e2 82 ac 22 3a 22 45
        75 72 6f 20 53 69 67 6e 22 2c 22 f0 9f 98 80 22 3a 22 45 6d
        6f 6a 69 3a 20 47 72 69 6e 6e 69 6e 67 20 46 61 63 65 22 2c
        22 ef ac b3 22 3a 22 48 65 62 72 65 77 20 4c 65 74 74 65 72
        20 44 61 6c 65 74 20 57 69 74 68 20 44 61 67 65 73 68 22 7d
      canonical_output_byte_count: 180
      warning: >-
        Note the trap in this vector. The "\u0080" property name is OUTSIDE
        the ASCII control character range U+0000..U+001F, so under Section
        3.2.2.2 it MUST be emitted "as is" -- as the raw two-byte UTF-8
        sequence c2 80 -- and MUST NOT be re-escaped as \u0080. The canonical
        output therefore contains a raw C1 control byte. "\r" by contrast is
        inside the ASCII control range and is a predefined JSON control
        character, so it becomes the two-character escape backslash-r. An
        implementation that escapes everything non-ASCII, or that escapes all
        control characters, fails here while passing every ASCII-only test.
    notes: >-
      Section 3.2.3 requires that sorting is applied to property names in
      their "raw" (unescaped) form, formatted as arrays of UTF-16 code units
      compared as unsigned integers, independent of locale. The emoji is the
      discriminator: as UTF-16 its first code unit is d83d, which sorts BELOW
      fb33, so the Grinning Face precedes the Hebrew letter. Sorting the same
      names as UTF-8 or UTF-32 would place U+1F600 ABOVE U+FB33 and produce a
      different, non-conforming order. The source says so explicitly in its
      closing Note, adding that in practice property names are rarely defined
      outside 7-bit ASCII, which makes UTF-8 or UTF-32 sorting compatible in
      most deployments -- but not in this one.

  - id: JCS-323-03
    locator: "RFC 8785 Section 3.2.3 (plain-English ordering example)"
    kind: property-name-sorting-prefix-rule
    fidelity: verbatim
    input: |-
      ""
      "a"
      "aa"
      "ab"
    expected: |-
      ""
      "a"
      "aa"
      "ab"
    notes: >-
      The source prints this list as already being in ascending order, to
      illustrate the rule that where there is no index position at which two
      property names differ, the shorter name lexicographically precedes the
      longer. Input and expected are the same sequence; the vector tests that
      a sort leaves it unchanged, and equivalently that any permutation of it
      sorts back to this order. Note the empty property name is legal and
      sorts first.

