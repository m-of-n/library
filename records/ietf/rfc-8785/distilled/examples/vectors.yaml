  # ===================================================================
  # Appendix C -- Canonicalized JSON as "Wire Format"
  # ===================================================================

  - id: JCS-C-01
    locator: "RFC 8785 Appendix C"
    kind: property-sorting-readability-cost
    fidelity: verbatim
    input: |-
      {
        "name": "John Doe",
        "address": "2000 Sunset Boulevard",
        "city": "Los Angeles",
        "zip": "90001",
        "state": "CA"
      }
    expected: |-
      "address", "city", "name", "state", and "zip"
    expected_form: >-
      The source does not print a canonicalized string for this example. It
      states only the resulting property order, in prose: "Using
      canonicalization, the properties above would be output in the order
      'address', 'city', 'name', 'state', and 'zip', which adds fuzziness to
      the data from a human (developer or technical support) perspective."
      The `expected` value above is that order fragment verbatim. A
      conforming implementation's output must place the properties in this
      order.
    derived:
      in_source: false
      description: >-
        The canonical string implied by the stated order, derived by applying
        Sections 3.2.1 and 3.2.3. All values are plain ASCII strings needing
        no escaping, so the derivation is unambiguous. NOT in RFC 8785.
      canonical_output: |-
        {"address":"2000 Sunset Boulevard","city":"Los Angeles","name":"John Doe","state":"CA","zip":"90001"}
      canonical_output_byte_count: 101
    notes: >-
      Appendix C is an argument about ergonomics, not a conformance
      requirement: the canonical output is fully valid JSON and so MAY be
      used as wire format, but ECMAScript's creation-order serialization is
      more readable for debugging and logging, and canonicalization collapses
      the document to a single line. Cryptographic schemes based on JCS would
      in most cases not depend on externally supplied JSON already being
      canonicalized.

  # ===================================================================
  # Appendix D -- Dealing with Big Numbers
  # ===================================================================

  - id: JCS-D-01
    locator: "RFC 8785 Appendix D"
    kind: error-number-not-expressible-as-ieee754-double
    fidelity: verbatim
    input: |-
      {
        "giantNumber": 1.4e+9999,
        "payMeThis": 26000.33,
        "int64Max": 9223372036854775807
      }
    expected: error
    violates:
      rule: >-
        JSON number data MUST be expressible as IEEE 754 [IEEE754]
        double-precision values. Since Not a Number (NaN) and Infinity are
        not permitted in JSON, occurrences of NaN or Infinity MUST cause a
        compliant JCS implementation to terminate with an appropriate error.
      rule_note: >-
        Two sentences, each quoted verbatim, from the two sections the locator
        names: the first from Section 3.1, the second from the Section 3.2.2.3
        Note. They are not adjacent in the source.
      inference: >-
        NOT in the source. 1.4e+9999 exceeds the maximum finite binary64 value
        (JCS-B-05, 7fefffffffffffff) and therefore overflows to Infinity when
        parsed as a double; that is the step joining the Section 3.1 rule to
        the Section 3.2.2.3 rule, and it is this extraction's, not RFC 8785's.
      locator: "RFC 8785 Section 3.1 and Section 3.2.2.3, Note"
    source_states_error: false
    notes: >-
      CAREFUL. The source does NOT label this object an error. It says the
      sample "conforms to JSON [RFC8259]" and uses it to motivate wrapping
      such numbers in JSON strings: "numbers that do not have a natural place
      in the current JSON ecosystem MUST be wrapped using the JSON string
      type." The `expected: error` above is this extractor's reading of
      Section 3.1 together with Section 3.2.2.3 applied to the object as
      written -- 1.4e+9999 exceeds the maximum double (see JCS-B-05) and
      becomes Infinity on parse, which Section 3.2.2.3 requires an
      implementation to reject. Flagged `source_states_error: false` so a
      later pass can confirm or overturn it. Separately, "int64Max"
      9223372036854775807 is not exactly representable as a double and would
      silently round; the source makes that point in prose ("applications
      would normally use different native data types") but prints no
      serialization, so none has been invented here. "payMeThis" 26000.33 is
      the monetary case: the source notes such data "would presumably not
      rely on floating-point data types due to rounding issues with respect
      to decimal arithmetic."

  - id: JCS-D-02
    locator: "RFC 8785 Appendix D"
    kind: big-number-wrapped-as-json-string
    fidelity: verbatim
    input: |-
      var obj = JSON.parse('{"giantNumber": "1.4e+9999"}');
      var biggie = new BigNumber(obj.giantNumber);
    expected: |-
      {"giantNumber": "1.4e+9999"}
    expected_form: >-
      The source prints this as a two-line ECMAScript snippet, not as an
      input/output pair. `input` is the snippet verbatim; `expected` is the
      JSON literal embedded in it -- the remedy the appendix prescribes. The
      source prints no canonicalized form of it.
    derived:
      in_source: false
      description: >-
        The canonical form of the embedded JSON document, derived by applying
        Section 3.2.1 (whitespace between tokens MUST NOT be emitted). The
        number is now a string and so passes through unaltered, which is the
        whole point of the appendix. NOT in RFC 8785.
      canonical_output: |-
        {"giantNumber":"1.4e+9999"}
    notes: >-
      The contrast with JCS-D-01 is the vector. The same magnitude that is
      unrepresentable as a JSON number survives canonicalization untouched as
      a JSON string, and an application reconstitutes it with a big-number
      type after parsing. The source: given a system using the JSON string
      type, whether programmatic as above or declarative like OpenAPI, "JCS
      imposes no limits on applications, including when using ECMAScript".
      The same treatment is prescribed for other types JSON lacks, such as
      DateTime -- see JCS-E-01.

  # ===================================================================
  # Appendix E -- String Subtype Handling
  # ===================================================================

  - id: JCS-E-01
    locator: "RFC 8785 Appendix E"
    kind: string-subtype-canonicalization-conformant
    fidelity: verbatim
    input: |-
      {
        "time": "2019-01-28T07:45:10Z",
        "big": "055",
        "val": 3.5
      }
    parsing_method: |-
      var object = JSON.parse(JSON_object_featured_as_a_string);
    expected: |-
      {"big":"055","time":"2019-01-28T07:45:10Z","val":3.5}
    notes: >-
      The CONFORMANT case. The schema designer assigned "big" to hold a
      BigInt subtype and "time" a DateTime subtype, while "val" is an
      ordinary JCS-compliant JSON number. Parsed with plain JSON.parse, the
      subtype properties stay pure JSON strings, so canonicalization sorts
      them ("big" < "time" < "val") and emits their characters unchanged:
      "055" keeps its leading zero and the timestamp keeps its "Z" form with
      no fractional seconds. Conversion to native types happens afterwards
      (new Date(object.time), BigInt(object.big), object.val); the source
      notes BigInt is at the time of writing natively supported only by V8.
      The expected output above is what the Appendix A sample canonicalizer
      returns.

  - id: JCS-E-02
    locator: "RFC 8785 Appendix E"
    kind: string-subtype-canonicalization-nonconformant
    fidelity: verbatim
    input: |-
      {
        "time": "2019-01-28T07:45:10Z",
        "big": "055",
        "val": 3.5
      }
    parsing_method: |-
      // "BigInt" requires the following code to become JSON serializable
      BigInt.prototype.toJSON = function() {
          return this.toString();
      };

      // JSON parsing using a "stream"-based method
      var object = JSON.parse(JSON_object_featured_as_a_string,
          (k,v) => k == 'time' ? new Date(v) : k == 'big' ? BigInt(v) : v
      );
    expected: |-
      {"big":"55","time":"2019-01-28T07:45:10.000Z","val":3.5}
    violates:
      rule: >-
        An additional constraint is that parsed JSON string data MUST NOT be
        altered during subsequent serializations. That is, stream- and
        schema-based parsing MUST treat subtypes as "pure" (immutable) JSON
        string types and perform the actual conversion to the designated
        native type in a subsequent step.
      locator: "RFC 8785 Section 3.1 and Appendix E"
    notes: >-
      The NON-CONFORMANT counterpart to JCS-E-01, on identical input. The
      expected value above is what the source says the Appendix A
      canonicalizer WOULD generate under reviver-based parsing -- a faithful
      record of a failure mode, not a target. Two string arguments have
      silently changed: "055" lost its leading zero to BigInt round-tripping
      and became "55", and "2019-01-28T07:45:10Z" gained milliseconds from
      Date serialization and became "2019-01-28T07:45:10.000Z". The source:
      "presumably making an application depending on JCS fail." Property
      order is identical to JCS-E-01, so the difference is invisible to any
      test that only checks sorting. The prescribed remedy is the C#/Json.NET
      pattern the appendix prints -- a private string field carries the JSON
      representation ([JsonProperty("amount")] private string _amount) while
      a [JsonIgnore] typed property exposes the native value to the
      application. The source adds that this also addresses I-JSON's numeric
      constraints, since the C# "decimal" type has quite different
      characteristics from IEEE 754 double precision.
    test_guidance: >-
      Treat JCS-E-01 and JCS-E-02 as a pair. An implementation passes only if
      it produces JCS-E-01's expected output from this input; producing
      JCS-E-02's expected output is a detected defect in the surrounding
      parser, not in the canonicalizer itself.

  - id: JCS-E1-01
    locator: "RFC 8785 Appendix E.1"
    kind: string-subtype-in-arrays
    fidelity: constructed
    input: null
    expected: null
    notes: >-
      NO VECTOR EXISTS. Appendix E.1 is two lines of prose in full: "Since
