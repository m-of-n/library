      string, which is what independently confirms the reconstruction in
      JCS-322-01 and JCS-323-01. 118 bytes for 116 characters: the single
      non-ASCII character, U+20AC EURO SIGN, occupies three bytes
      (e2 82 ac). The source closes: "This data is intended to be usable as
      input to cryptographic methods."

  # ===================================================================
  # Appendix B -- Number Serialization Samples (Table 1)
  #
  # Every row of Table 1, in source order, 26 rows. `input` is the IEEE 754
  # column: the 64-bit double-precision bit pattern in hexadecimal,
  # big-endian, exactly as the source prints it. `expected` is the JSON
  # Representation column verbatim. `comment` is the Comment column
  # verbatim, with the source's note markers resolved under `source_note`.
  # ===================================================================

  - id: JCS-B-01
    locator: "RFC 8785 Appendix B, Table 1, row 1"
    kind: number-serialization-ieee754
    fidelity: verbatim
    input: |-
      0000000000000000
    expected: |-
      0
    comment: "Zero"

  - id: JCS-B-02
    locator: "RFC 8785 Appendix B, Table 1, row 2"
    kind: number-serialization-ieee754-negative-zero
    fidelity: verbatim
    input: |-
      8000000000000000
    expected: |-
      0
    comment: "Minus zero"
    notes: >-
      Minus zero serializes to "0", not "-0". The sign of zero is not
      preserved through canonicalization, so negative zero and positive zero
      produce identical canonical bytes and identical signatures.

  - id: JCS-B-03
    locator: "RFC 8785 Appendix B, Table 1, row 3"
    kind: number-serialization-ieee754-min-subnormal
    fidelity: verbatim
    input: |-
      0000000000000001
    expected: |-
      5e-324
    comment: "Min pos number"

  - id: JCS-B-04
    locator: "RFC 8785 Appendix B, Table 1, row 4"
    kind: number-serialization-ieee754-min-subnormal-negative
    fidelity: verbatim
    input: |-
      8000000000000001
    expected: |-
      -5e-324
    comment: "Min neg number"

  - id: JCS-B-05
    locator: "RFC 8785 Appendix B, Table 1, row 5"
    kind: number-serialization-ieee754-max
    fidelity: verbatim
    input: |-
      7fefffffffffffff
    expected: |-
      1.7976931348623157e+308
    comment: "Max pos number"

  - id: JCS-B-06
    locator: "RFC 8785 Appendix B, Table 1, row 6"
    kind: number-serialization-ieee754-max-negative
    fidelity: verbatim
    input: |-
      ffefffffffffffff
    expected: |-
      -1.7976931348623157e+308
    comment: "Max neg number"

  - id: JCS-B-07
    locator: "RFC 8785 Appendix B, Table 1, row 7"
    kind: number-serialization-max-safe-integer-boundary
    fidelity: verbatim
    input: |-
      4340000000000000
    expected: |-
      9007199254740992
    comment: "Max pos int    (1)"
    source_note:
      marker: "(1)"
      text: >-
        For maximum compliance with the ECMAScript "JSON" object, values that
        are to be interpreted as true integers SHOULD be in the range
        -9007199254740991 to 9007199254740991. However, how numbers are used
        in applications does not affect the JCS algorithm.

  - id: JCS-B-08
    locator: "RFC 8785 Appendix B, Table 1, row 8"
    kind: number-serialization-max-safe-integer-boundary-negative
    fidelity: verbatim
    input: |-
      c340000000000000
    expected: |-
      -9007199254740992
    comment: "Max neg int    (1)"
    source_note:
      marker: "(1)"
      text: >-
        For maximum compliance with the ECMAScript "JSON" object, values that
        are to be interpreted as true integers SHOULD be in the range
        -9007199254740991 to 9007199254740991. However, how numbers are used
        in applications does not affect the JCS algorithm.

  - id: JCS-B-09
    locator: "RFC 8785 Appendix B, Table 1, row 9"
    kind: number-serialization-large-integer-positional
    fidelity: verbatim
    input: |-
      4430000000000000
    expected: |-
      295147905179352830000
    comment: "~2**68         (2)"
    source_note:
      marker: "(2)"
      text: >-
        Although a set of specific integers like 2**68 could be regarded as
        having extended precision, the JCS/ECMAScript number serialization
        algorithm does not take this into consideration.
    notes: >-
      2**68 is exactly 295147905179352825856, but the shortest round-tripping
      decimal is 2.9514790517935283e20, which ECMAScript writes positionally
      as 295147905179352830000 because the exponent is below the 1e+21
      threshold. The trailing digits are padding, not precision.

