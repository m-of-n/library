  # Section 3.2.4 -- UTF-8 Generation
  # ===================================================================

  - id: JCS-324-01
    locator: "RFC 8785 Section 3.2.4"
    kind: utf8-encoding-of-canonical-form
    fidelity: verbatim
    input_fidelity: reconstructed
    input: |-
