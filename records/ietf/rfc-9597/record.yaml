relations:
  # Set 2026-10-20 with summary.md.
  #
  # `updates: rfc-8392` was considered and REJECTED, and the reasoning is in
  # summary.md under Limits. §2's duplication rule is a step RFC 8392 §7.2's
  # seven validation steps do not contain, and RFC 9597 carries no
  # "Updates: 8392" header — but a CWT that declines label 15 needs nothing
  # from this document, so `updates` would assert an incompleteness in
  # RFC 8392 that is not there. The missing forward pointer is recorded as a
  # finding, not as a relation.
  #
  # `contradicts: rfc-9596` was also considered and rejected: RFC 9596 makes
  # unprotected placement a MUST NOT for `typ` where §2 only RECOMMENDS
  # protected placement for label 15. That is an asymmetry of strength, not an
  # incompatibility — both can be obeyed at once.
  see_also:
    # What label 15's value is: a CWT Claims Set, and the registry §2's
    # Value Registry column names.
    - rfc-8392
    # §1's RECOMMENDED way to convey the intended interpretation — and, per
    # RFC 9596 §2, a parameter that by its own terms does not describe the
    # unprotected header §2 permits label 15 to sit in.
    - rfc-9596
    # §4.4's Sig_structure is what decides whether a protected claim is
    # covered and an unprotected one is not.
    - rfc-9052
    # The one ratified profile that closes §2's RECOMMENDED into a MUST:
    # §6 requires label 15 in the protected header with iss and sub.
    - rfc-9943
    # The only concrete use of label 15 found on 2026-10-20: SCRAPI's Signed
    # Statement example carries it with iss (1) and sub (2) nested.
    - draft-ietf-scitt-scrapi
  part_of:
    - ietf-cose-wg
bears_on:
  # Widened 2026-10-20 by the FX-1 extraction (pass 1). DEC-005 is kept and is
  # the WEAKEST of these, which distilled/design-notes.md §8 says plainly: the
  # document names no algorithm, no key type and no hash, and its only DEC-005
  # connection is §1's "the issuer value is used for key discovery". Each
  # addition is evidenced in distilled/design-notes.md, not assumed:
  #   R-M-12 — THE STRONGEST EDGE, and it is evidence rather than argument. §1
  #     records two independently governed global integer label spaces growing
  #     into each other across their whole cheap range (CWT claims 1/2/3/4 are
  #     iss/sub/aud/exp; COSE header parameters 1/2/3/4 are alg/crit/content
  #     type/kid), with the only available remedy being to buy one label in the
  #     first registry and nest the second inside it. The IETF paid for this
  #     rather than predicting it, and R-M-12's justification currently has no
  #     case where two registries actually collided.
  #   R-O-01 — "Every signed object SHALL have an issuer key that can be
  #     specified as KeyId." §2 only RECOMMENDS protected placement and its one
  #     MUST bars label 15 from BOTH buckets while expressly permitting the
  #     unprotected one, so a conformant producer can emit an UNSIGNED iss.
  #   R-O-03 — the fix is to cite rfc-9943 §6's protected-only placement rather
  #     than invent the rule; and every fixture for label 15 would be ours,
  #     because the document prints not one byte.
  #   DEC-002 — five named cuts, one of them FOR option 5 (label 15 is a header
  #     parameter, not a tag, so the no-tags clause is untouched). Against it:
  #     Table 1's Value Registry column NAMES [CWT.Claims] as this parameter's
  #     value space, so the claim-key registry dependence is a column rather
  #     than a consequence.
  #   DEC-003 — this is where a protected iss lands, so it is where the KeyId
  #     question is answered in practice.
  - DEC-002
  - DEC-003
  - DEC-005
  - R-M-12
  - R-O-01
  - R-O-03
