distillation:
  standard: "FX-1"
  # `profile: full` DECLARED by the cross-check pass on 2026-10-21, the third
  # and last of FX-1's passes. The artifact set is complete: five artifacts
  # present and three (protocol, state-machine, examples) declared
  # `not_applicable` with reasons the cross-check RE-DERIVED from the source
  # rather than accepted - 14 protocol tokens and 17 state-machine tokens
  # measured zero over the document's 265 lines. Read `passes:` for what each
  # pass did; it is the normative record, not this comment, and a comment must
  # not repeat a count that can go stale.
  #
  # What `full` means here: the FX-1 ARTIFACT SET is complete. It does NOT mean
  # a human has countersigned anything - `reviewed_by` is empty on all five
  # artifacts, so pass 4 (human review) is outstanding and nothing may be BUILT
  # on them yet (docs/requirements.md). They may be read.
  #
  # Two caveats `full` does not retire. D-6: §2's placement MUST ("MUST only
  # occur once in either the protected or unprotected header") is AMBIGUOUS
  # across three readings and the document disambiguates none of them. This
  # record takes READING 1 - at most once ACROSS the two buckets - and says so
  # in all four files that state the rule; under reading 2 the derived CDDL's
  # enumeration of three conformant shapes is incomplete rather than wrong.
  # And the §7.6 implementation-status cut rests on a single 2026-10-20 web
  # search, so it is the one claim here not checkable against a cached source
  # and is labelled unverifiable wherever it is asserted.
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "16 verbatim regions covering the whole document except the references, the acknowledgements and the authors' addresses, each an exact run of source lines with its own sha256 (the region's lines joined by \\n, no trailing newline). §1 IS QUOTED IN FOUR PARTS BECAUSE IT IS NORMATIVE, NOT BACKGROUND - four of the document's eight BCP 14 keywords are in it, including the only MUST NOT - and §2 in FIVE parts, one per rule (corrected 2026-10-21 by pass 3: this read SIX; the regions per section are §1 4, §1.1 1, §2 5, §3 1, §4 4, §5 1 = 16). The §1.1 BCP 14 recital is quoted here and deliberately never in requirements.yaml. The non-normative CDDL declaration and the fragment it governs are quoted as ONE region, because separating them would leave the fragment looking normative. NO PAGE DECORATION EXISTS: this is an unpaginated RFC v3 rendering with zero form feeds and no running footers, so no region removes anything and no line number can be shifted by splitlines(). Also carries three observations about the document's normative shape"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "28 entries R-0001 to R-0028 in source order with no gaps: 8 stated, 20 inferred. source_keyword_count and extracted_keyword_count both 8 and AGREEING, with a reconciliation written anyway because WHERE the 8 are is the document's central finding. ALL EIGHT ARE IN §1 AND §2, FOUR IN EACH, by line: L102 MAY, L105 RECOMMENDED, L107 MAY, L108 MUST NOT in §1; L148 MUST, L152 RECOMMENDED, L154 MUST, L157 MAY in §2. §3, §4 AND §5 CONTAIN ZERO, so §4's \"Implementers must ensure that any tentative decisions made based on previously unverified information are confirmed once the cryptographic processing has been completed\" - the most important instruction in the document - is LOWER CASE and binds nobody under §1.1. All 28 texts verified mechanically as contiguous substrings of the whitespace-normalised source, 0 failures, with a terminator check catching three hand-chosen spans that stopped mid-sentence. The §1.1 recital is deliberately not counted: it would add 11 phantom keywords"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "1 verbatim file and 2 derived, plus a README. THE DOCUMENT SHIPS FOUR LINES OF CDDL AND DECLARES THEM NON-NORMATIVE IN THE SENTENCE IMMEDIATELY BEFORE THEM, so source-renderings.txt reproduces the declaration AND the fragment as one region with its line range and sha256, alongside §2's Table 1. `CDDL` occurs twice in the document (that sentence and the reference entry); ABNF, ASN.1 and JSON Schema occur zero times. The derived CDDL carries what §1's and §2's NORMATIVE sentences fix and the source's CDDL omits - the label, the three conformant placements INCLUDING THE CONFORMANT-BUT-UNSIGNED ONE, and a named list of what CDDL cannot express (a cross-structure equality predicate scoped to a classification rfc-8392 §6 declines to define, and a constraint on USE rather than on bytes). Plus a JSON-projection schema with $id urn:library:rfc-9597:cwt-claims-header.derived. Header markers and filenames agree on all three files"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "3 structures, 5 fields: label 15 itself, the two COSE header buckets as §2 constrains them, and the payload claims set that §2's duplication rule relates to the header. `constrained_by` wired, 8 of 28 requirements cited, 0 dangling - AND ALL EIGHT ARE §2's, R-0015 to R-0022, with nothing from any other section. That one-section wiring is the measurement rather than an oversight: §2 is the only section of RFC 9597 that says anything about bytes. EVERY LAYOUT IS DERIVED from Table 1 and RFC 9052 §3 rather than decoded, because the document prints no bytes at all - which is also why examples is not_applicable"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "The decision this record forces: §2 only RECOMMENDS protected placement and its one MUST bars label 15 from BOTH buckets while expressly permitting the unprotected one, so our profile must state protected-only placement and cite rfc-9943 §6 rather than invent it. THE COVERAGE BOUNDARY IS DEMONSTRATED, NOT READ: the sibling rfc-8392 extraction in this same pass rebuilt Sig_structure from RFC 9052 §4.4 and verified RFC 8392's A.3 signature from exactly its four fields, so an unprotected map is PROVABLY not an input. The duplication MUST's two escape hatches and its undefined \"identical\". R-M-12 evidence stated from both registries. 4 adopts, 6 adapt-or-reject items. MD-3 MAPPED HEADER BY HEADER over 8 of our fields with carrier, label, registry and option-5 verdict for each, plus the export mapping in one line. THEN FIVE CUTS AGAINST MD-3, each naming the DEC-002 option it affects: (1) FOR option 5 - label 15 is a header parameter, not a tag, so the no-tags clause is untouched and this is the one way in the COSE set to carry CWT claims without touching tag 61; (2) Table 1's Value Registry column NAMES [CWT.Claims], so the registry dependence is a column not a consequence, and topics/canonical-encoding.yaml records that options 1 and 3 are both registry-free - costs option 5; (3) Claim-Label = int / text has no key component, which ARCH-0002 P1 rejects; (4) privacy is structural and reaches the naming scheme, costing every option alike; (5) no library implements the published RFC, which inverts option 5's interoperability argument at exactly this joint - a cost with a stated shelf life. DEC-005 stated honestly as the weakest edge. All six canonical-encoding conditions, with condition (4) named as the one this record most nearly addresses and still lands on a recommendation. The summary's seven findings tested: SIX CONFIRMED, NONE REFUTED, one not re-testable from the source. 6 source defects, D-1 to D-6 (corrected 2026-10-21 by pass 3: this read 5, which was pass 1's count before pass 2 added D-6, the ambiguous placement MUST). 5 open questions. 14 quotations of RFC 9597 cut by line range - 13 blockquotes and one fenced CDDL block (also corrected by pass 3 from 12: pass 1 wrote 11 blockquotes plus the fence, pass 2 added D-6's blockquote, and pass 3 turned D-5's unmarked verbatim sentence into the blockquote it should always have been) - every one cut from the cache by line range by script and verified as a contiguous substring; every quotation of a mofn document is marked UNVERIFIABLE FROM THIS REPOSITORY, following rfc-9741"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "RFC 9597 defines no exchange, no role and no flow - it registers ONE COSE header parameter and states three rules about it. Measured whole-word and case-insensitively over all 265 lines: `protocol` 0, `exchange` 0, `handshake` 0, `negotiate` 0, `sender` 0, `receiver` 0, `verifier` 0, `response` 0, `transport` 0, `party` 0, `producer` 0, `consumer` 0, `step` 0, `steps` 0. Four near-misses and none is a role in a flow: `recipients` occurs ONCE, at line 108, as the subject of the MUST NOT; `request` ONCE, at line 6, in the RFC masthead; `parties` ONCE, at line 167, in §3's privacy sentence; and `application`/`applications` 9 times, as the party that decides what the format does not. THERE IS ONE RECEIVER-SIDE PREDICATE AND IT IS NOT A PROTOCOL: §2's duplication check has no specified failure action, no ordering relative to anything else, no error path and no counterparty, so it is carried in requirements.yaml as R-0019 and in messages.yaml as a constraint on the payload claim. The envelope and its procedures belong to RFC 9052 and RFC 8392; distilled/protocol.yaml and protocol.md carry the measurement."
    - kind: state-machine
      reason: "RFC 9597 defines no lifecycle. Measured whole-word and case-insensitively over all 265 lines: `state` 0, `states` 0, `lifecycle` 0, `revoke` 0, `revocation` 0, `rotate` 0, `rotation` 0, `expire` 0, `expiry` 0, `expiration` 0, `issue` 0, `issuance` 0, `register` 0, `registration` 0, `step` 0, `steps` 0, `return` 0 - not one of them occurs, including `registration`, although §5 performs one (it uses the verb: \"IANA has registered the new COSE header parameter\"). §1 says the scope exclusion in terms: \"This specification does not define how to use CWT claims and their semantics for particular applications, whether they are in the COSE payload or the CWT Claims header parameter, or both.\" [correction 2026-10-21, pass 3 - cross-check] That quotation stopped at 'particular applications.' - the source cuts at a COMMA there and a full stop was substituted, dropping the clause that extends the exclusion TO THE HEADER PARAMETER, which is the mechanism this record exists for. Three sibling artifacts quote it whole (requirements.yaml R-0009, state-machine.yaml, normative.md) and so does summary.md, so this was the one un-propagated site. THE NEAREST THING TO STATE IS §4's LOWER-CASE WARNING about tentative decisions confirmed after cryptographic processing - which describes exactly two states of a decision and names neither, and specifies no failure action. A lifecycle is what that sentence is MISSING, not what it defines, so writing one would be inventing the document's missing half. Recorded in distilled/state-machine.yaml and owed by our profile."
    - kind: examples
      reason: "RFC 9597 PRINTS NOT ONE BYTE. Measured whole-word and case-insensitively over all 265 lines: `example` 0, `examples` 0, `Figure` 0, `hex` 0, `vector` 0, `test vector` 0, `diagnostic notation` 0. The only structural rendering in the document is four lines of CDDL that the document itself declares non-normative. THE ABSENCE IS THE FINDING: every fixture for label 15 would be ours under R-O-03, with nothing to cite - and the contrast inside this one lane is stark, since rfc-8392 prints five complete CWTs (all five verified in this pass) while neither of the two header parameters we would actually rely on supplies any. The nearest reference instance found on 2026-10-20 is draft-ietf-scitt-scrapi's Signed Statement example, a draft specification rather than a library, and rfc-9943 §6 requires the shape without printing it. Written out in distilled/examples/README.md."
  passes:
    - pass: extract
      by: "claude-opus-5 (pass 1 of library#39 Tier 2, CWT envelope lane; single agent, whole artifact set, three records)"
      effort: max
      date: "2026-10-20"
      note: "Read only .cache/rfc-9597.txt - never summary.md and never another record's artifacts. EVERY VERBATIM BLOCK AND EVERY QUOTATION WAS LIFTED FROM THE CACHE BY LINE RANGE BY SCRIPT, never retyped, and verified mechanically rather than by eye: 28 of 28 requirement texts and 12 of 12 design-note quotations are contiguous substrings of the whitespace-normalised source, 0 failures; 16 normative.md regions and 2 schema regions carry their own sha256. The source has no form feeds and no page decoration, so nothing is removed from any region. Cross-artifact consistency was checked at write time: every requirement id cited by messages.yaml resolves (0 dangling) and both of the library's YAML readers parse every file written here. The three not_applicable verdicts were each DERIVED from word sweeps run over the whole source, not assumed from the document's size, and each sweep's result is written into the artifact it justifies as well as into this block. NOTHING IN THIS RECORD'S summary.md IS REFUTED by the source - six of its seven findings are confirmed and the seventh is a search result rather than a source fact - which is the best any summary in this lane survived contact with its document."
    - pass: verify
      by: "claude-opus-5 (pass 2 of 3, independent; did not extract; three records in one lane)"
      effort: max
      date: "2026-10-20"
      note: "RECOUNT: 8 = 8, re-derived. THE CLAIM THAT SECTION 1 IS NORMATIVE IS CONFIRMED EXACTLY, with the section map computed rather than read: section 1 spans lines 69-112, 1.1 spans 113-120, 2 spans 121-160, and the eight keywords sit at L102 MAY, L105 RECOMMENDED, L107 MAY, L108 MUST NOT (four in section 1) and L148 MUST, L152 RECOMMENDED, L154 MUST, L157 MAY (four in section 2). Sections 3, 4 and 5 have none. So half the document's BCP 14 force, INCLUDING ITS ONLY MUST NOT, is in the introduction. 28 of 28 requirement texts re-verified verbatim; all 28 locators verified under a STRICTER rule than bin/check-locators applies, comparing the innermost containing section rather than permitting an ancestor - 0 misfiled, 0 imprecise, 0 unresolvable, which is the result that matters most here because section 1 spans 44 lines of four unlike paragraphs. All 16 normative.md regions and both schema regions re-verified: digest AND printed block byte-identical to the cache. Body source-line coverage computed: the only uncovered lines are the six section headings, so no statement is dropped. THE DERIVED CDDL'S .ne CONSTRUCT IS CORRECT, checked against RFC 8610 sections 3.8 and 3.8.6 directly: the 'target .control-operator controller' syntax is satisfied, .ne is 'defined for both numeric values and values of other types', and a tstr target compared with 15 falls under 'All other cases are not equal' so it satisfies the control rather than erroring. ONE LOCATOR CORRECTED: `label = int / tstr` was cited as RFC 9052 section 1.4; it is section 1.5, and rfc-9596 carried the same error, which is the signature of one wrong cross-record locator copied across a lane. THE THREE not_applicable VERDICTS ARE CONFIRMED and pass 1's sweeps were more thorough than its README summarised - it had already swept party, producer, consumer, step, transport, handshake and negotiate, and had already recorded `application`/`applications` 9 times, which pass 2 re-counted at exactly 9. THE SECTION 4 LIFECYCLE HUNT FOUND WHAT PASS 1 ALREADY RECORDED and nothing more: paragraph 4's tentative-then-confirmed decision is two states of a decision with neither named and no failure action, and pass 1 wrote that into state-machine.yaml rather than missing it. ONE DEFECT ADDED THAT PASS 1 DID NOT LIST: D-6, the placement MUST ('MUST only occur once in either the protected or unprotected header') is ambiguous across three readings, and the derived CDDL's enumeration of exactly three conformant shapes is complete only under the first. The section 7.6 implementation cut was RE-DATED, NOT RE-ASSERTED: pass 2 deliberately did not repeat the search, so it stands on pass 1's 2026-10-20 search alone and is the only claim in the record not checkable against a cached source."
    - pass: cross-check
      by: "claude-opus-5 (pass 3 of 3, independent; did not extract and did not verify; plus a lane-wide quote and cross-record audit spanning rfc-8392, rfc-9596 and rfc-9597)"
      effort: max
      date: "2026-10-21"
      note: 'ALL FOUR FX-1 CLOSURES CLOSED, three vacuously and one by a recorded pointer. Fields: 3 structures, 5 fields, 14 constrained_by citations resolving to exactly the 8 ids of section 2, 0 dangling, each read field by field. ONE FIELD A REQUIREMENT NAMES IS DEFINED IN NEITHER FILE - `typ`, which is RFC 9596 label 16 - and so are COSE_Sign and COSE_Sign1, which are RFC 9052. All are modelled in the sibling records, so the closure was recorded as a cross_check key in messages.yaml rather than by extracting another document; that file header had also claimed everything non-RFC-9597 belongs to RFC 9052 or RFC 8392, missing RFC 9596. The three not_applicable verdicts were re-measured over all 265 lines: 14 protocol tokens and 17 state-machine tokens zero, every example token zero, so the message, trigger and schema checks are vacuous legitimately. 17 DEFECTS FOUND AND FIXED; EVERY ONE IN OUR PROSE, NONE IN THE SOURCE. THE BEST FIND IS A CLASS NOTHING IN bin/ CATCHES: FOUR BARE `R-NNNN` TOKENS RESOLVING TO A REAL BUT WRONG REQUIREMENT. bin/check-id-joins deliberately collects only the prefixed record#R-NNNN form, and pass 2 bare-reference check asked WHICH RECORD a bare number belongs to, not WHICH REQUIREMENT - so a bare number naming the wrong requirement INSIDE ITS OWN RECORD passes both. protocol.yaml and protocol.md both filed section 2 duplication MUST as R-0020, which is the RECOMMENDED protected placement; it is R-0019. The derived JSON Schema filed the two placement rules as R-0021 and R-0022, where R-0022 is the any-COSE-object MAY; they are R-0020 and R-0021. All 63 bare references in the record were then resolved by script and every resolved sentence read: after the fixes, 63 of 63 name the intended statement. D-6 WAS RECORDED IN EXACTLY THE FILES THAT DO NOT STATE THE RULE. Pass 2 added the placement ambiguity to design-notes.md, README.md and record.yaml; the four places that assert the placement model AS SETTLED said nothing, and the derived CDDL did not say which reading it encodes. All four now state that the record takes READING 1 - at most once ACROSS the two buckets - that the three-shape enumeration is complete only under it, and that reading 2 makes it incomplete rather than wrong. Also fixed: a claim about a sibling artifact that was simply false, normative.md asserting schema/ marks something `non_normative: true` when no such key exists anywhere in the record; a lost quotation delimiter in design-notes.md section 8 leaving a verbatim fragment as our own words with an orphaned full stop; a verbatim MAY printed as unmarked prose, indistinguishable from our voice; an ELIDED quotation in the same section as the note declaring that nothing in the directory elides one; a D-6 locator naming lines 154-155 for a sentence that begins with the last word of 153; and five counts contradicted by the artifacts they describe - 31 texts where there are 28, section 1 spanning 43 lines where it spans 44, section 2 in six regions where it is five, 5 source defects where pass 2 made it 6, and 12 quotations where there are now 14. THE LANE-WIDE AUDIT FOUND ONE MORE IN THIS RECORD, and it is the most consequential single quotation defect in the lane: record.yaml state-machine reason quoted section 1 scope exclusion CUT AT A COMMA with a full stop substituted, dropping `whether they are in the COSE payload or the CWT Claims header parameter, or both` - THE CLAUSE THAT EXTENDS THE EXCLUSION TO THE HEADER PARAMETER, which is the mechanism this record exists for. Three sibling artifacts and summary.md quote it whole, so it was a single un-propagated site. Restored and re-verified contiguous. Three now-false lane-wide claims were withdrawn in place, and the blanket `never elided` convention narrowed to what it actually is: an elision is visible as an ellipsis and the full sentence is carried verbatim in requirements.yaml. THE SECTION 7.6 CUT was labelled unverifiable in 2 of 5 places and is now labelled in all; the search was deliberately not re-run, so it still rests on pass 1 single 2026-10-20 search and is the only claim here not checkable against a cached source. Verified unchanged: 265 content lines and 0 form feeds; 8 = 8 with the keywords at exactly the eight asserted line numbers, four of them in the INTRODUCTION including the only MUST NOT; section spans 69-112, 113-120 and 121-160 computed; 28 of 28 texts contiguous and 28 of 28 locators contained under the innermost-section rule; all 18 regions digest-matched and byte-identical; the derived CDDL .ne construct checked against RFC 8610 sections 3.8 and 3.8.6 from the cache AND from that record own artifacts; both readers agreeing on all 5 YAML artifacts at 484 leaf paths; the record own `\n` convention statements decoding to a literal backslash-n under both readers. bin/validate 0 errors and no warning naming this record.'
