note: >-
  RFC 9597 DEFINES NO PROTOCOL, and this file records the measurement rather
  than asserting the conclusion. It registers ONE COSE header parameter and
  states three rules about it.

  WORD COUNTS OVER ALL 265 LINES, whole-word and case-insensitive, with the
  lines where each occurs: `protocol` 0, `exchange` 0, `handshake` 0,
  `negotiate` 0, `sender` 0, `receiver` 0, `verifier` 0, `response` 0,
  `transport` 0, `party` 0, `producer` 0, `consumer` 0, `step` 0, `steps` 0.
  FOUR NEAR-MISSES EXIST AND NONE IS A ROLE IN A FLOW. `recipients` occurs
  ONCE, at line 108, as the subject of the MUST NOT - "Recipients of the CWT
  Claims header parameter MUST NOT use the information ... beyond the integrity
  protection or authentication afforded to the CWT Claims header and the
  information used to derive its intended interpretation." `request` occurs
  ONCE, at line 6, in the RFC masthead. `parties` occurs ONCE, at line 167, in
  §3's privacy sentence about who an object is made visible to. And
  `application` / `applications` occur 9 times between them, as the party that
  DECIDES things the format does not - which is the finding, not a flow.

  THERE IS ONE RECEIVER-SIDE PREDICATE AND IT IS NOT A PROTOCOL. §2: "In cases
  where CWT claims are present both in the payload and the header of a CWT, an
  application receiving such a structure MUST verify that their values are
  identical, unless the application defines other specific processing rules for
  these claims." That is a single check with NO SPECIFIED FAILURE ACTION, no
  ordering relative to anything else, no error path and no counterparty. It is
  carried in ../requirements.yaml as R-0019 and in ../messages.yaml as a
  constraint on the payload claim, which is where a check belongs when there is
  no flow to put it in.

  [correction 2026-10-21, pass 3 - cross-check] This check was cited as R-0020
  here and in protocol.md. R-0020 is the RECOMMENDED protected placement; the
  duplication MUST quoted immediately above is R-0019, which is the id
  record.yaml's own not_applicable reason and ../messages.yaml both use. A real
  id resolving to the wrong statement, invisible to bin/check-id-joins because
  the bare form carries no record prefix.

  AND IT IS A STEP ANOTHER DOCUMENT'S PROCEDURE DOES NOT CONTAIN. rfc-8392
  §7.2's seven validation steps say nothing about header claims, and RFC 9597
  carries no "Updates: 8392" header - the missing forward pointer that record's
  summary records as a finding. An implementer working from RFC 8392 alone never
  learns this rule exists. THE ENVELOPE AND ITS PROCEDURES BELONG TO RFC 9052
  AND RFC 8392; see records/ietf/rfc-9052 and records/ietf/rfc-8392, both of
  which hold them.

