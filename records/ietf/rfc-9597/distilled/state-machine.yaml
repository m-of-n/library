applicability: "NOT APPLICABLE"

note: >-
  RFC 9597 DEFINES NO LIFECYCLE AND NO STATE MACHINE.

  WORD COUNTS OVER ALL 265 LINES, whole-word and case-insensitive: `state` 0,
  `states` 0, `lifecycle` 0, `revoke` 0, `revocation` 0, `rotate` 0,
  `rotation` 0, `expire` 0, `expiry` 0, `expiration` 0, `issue` 0, `issuance` 0,
  `register` 0, `registration` 0, `step` 0, `steps` 0, `return` 0. NOT ONE of
  them occurs anywhere in the document - including `registration`, which is
  notable given that §5 performs one: the section reads "IANA has registered the
  new COSE header parameter "CWT Claims" defined in Table 1 in the "COSE Header
  Parameters" registry", using the verb rather than the noun.

  THE DOCUMENT RELOCATES CLAIMS; IT DOES NOT GIVE THEM A LIFE. §1 says so in
  terms: "This specification does not define how to use CWT claims and their
  semantics for particular applications, whether they are in the COSE payload
  or the CWT Claims header parameter, or both." So nothing here reads exp or
  nbf, nothing issues or revokes anything, and no sentence describes a sequence
  of events.

  THE NEAREST THING TO STATE IS A WARNING ABOUT PROVISIONALITY, AND IT IS
  LOWER CASE. §4: "Implementers must ensure that any tentative decisions made
  based on previously unverified information are confirmed once the
  cryptographic processing has been completed. This includes any information
  that was used to derive the intended interpretation of the CWT claims
  parameter." THAT IS THE ONE PLACE A STATE MACHINE WOULD HAVE BEEN USEFUL -
  it describes exactly two states of a decision, tentative and confirmed, and a
  transition between them - and the document neither names the states nor
  specifies what happens if the confirmation fails. A lifecycle is what this
  sentence is MISSING, not what it defines, so writing one here would be
  inventing the document's missing half rather than extracting it. Our profile
  owes it; see ../design-notes.md, open question 3.

machines: []

absent:
  - "No issuance, rotation, revocation or expiry of anything; none of those words occurs."
  - "No states a CWT, a claim or a header parameter can be in; `state` occurs zero times."
  - "No transitions, triggers or guards."
  - "No terminal or error states: the one MUST in §2 has no specified failure action."
  - "No ordering between the header check and the signature check, which is exactly the ordering §4's lower-case warning is about."
