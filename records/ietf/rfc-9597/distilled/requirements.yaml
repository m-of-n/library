record: rfc-9597
source_version: "RFC 9597 (June 2024)"
source_digest: "b6baaec655bc86606602a6f6e93f0103db6e6f98460f1e43437e74a6a5e02bdd"
source_keyword_count: 8        # bin/bcp14-count .cache/rfc-9597.txt --by-keyword: 3 MAY, 2 RECOMMENDED, 2 MUST, 1 MUST NOT
extracted_keyword_count: 8     # recomputed and checked by bin/validate
reconciliation: >-
  THE COUNTS AGREE AT 8, and a reconciliation is written anyway because 28
  entries against 8 keywords needs explaining and because WHERE the 8 are is
  this document's central finding.

  ALL 8 ARE IN §1 AND §2, FOUR IN EACH, by source line: L102 (MAY - the
  interpretation may come from other header parameters), L105 (RECOMMENDED -
  the typ header parameter of RFC 9596), L107 (MAY - other methods may also be
  used), L108 (MUST NOT - a recipient must not use the information beyond the
  protection afforded to it); L148 (MUST - duplicate claims must have identical
  values), L152 (RECOMMENDED - protected-header placement), L154 (MUST - at
  most one occurrence), L157 (MAY - usable in any COSE object).

  §3, §4 AND §5 CONTAIN ZERO CAPITALISED KEYWORDS, and that is the finding
  rather than the arithmetic. §4's "Implementers must ensure that any tentative
  decisions made based on previously unverified information are confirmed once
  the cryptographic processing has been completed" is the most important
  instruction in the document and it is LOWER CASE, while §1.1 restricts
  interpretation to keywords "when, and only when, they appear in all capitals,
  as shown here." In a document whose entire purpose is to make claims readable
  BEFORE verification, the rule against acting on unverified claims carries no
  normative force under the document's own terms. §3's privacy guidance is in
  the same position.

  §1 IS NORMATIVE, NOT BACKGROUND. Half the keywords are in it, including the
  only MUST NOT, and the whole chain by which a recipient learns what the
  claims mean lives there: MAY from other header parameters, RECOMMENDED via
  RFC 9596's typ, MAY by any other method, and MUST NOT use them beyond the
  protection afforded. An extraction that treated §1 as introduction would have
  dropped four of eight.

  WHAT WAS COUNTED INSTEAD, since 8 keywords do not describe the document: §2's
  Table 1 registration as one entry with the template reproduced; the CDDL
  fragment and its label rule as two entries, both flagged with the source's
  own statement that they are non-normative; §1's scope exclusion and its
  collision rationale, which are the two sentences the design notes rest on;
  §3's structural privacy statement; §4's four paragraphs; and §5's completed
  registration.

  WHAT WAS DELIBERATELY NOT COUNTED: §1.1's BCP 14 recital at source lines
  115-119. It recites all eleven keywords and constrains nothing; bin/validate
  recounts these texts with boilerplate stripping OFF, so quoting it would add
  11 phantom keywords and make the extraction read 19 against a source of 8.
  It is quoted in normative.md, which nothing counts.

  LOWER-CASE FORCE WORDS, each recorded as kind: inferred with the phrase named
  in `field`: §3's "should ensure", §4's "Implementers should also review",
  "must ensure", and "it is the responsibility of the application". None is
  promoted.

  COMPOUND SENTENCES SPLIT, AND NOTHING SPLICED. §2's placement paragraph
  carries two keywords in two sentences (RECOMMENDED at L152, MUST at L154) and
  is split at the sentence boundary, as a contiguous character span inside one
  flowed line range. §1's "These include encrypted COSE structures ... and/or
  those featuring a detached signature" and its following sentence are two
  entries for the same reason. No entry welds two non-adjacent quotes.

  TEXT NORMALISATION, DECLARED: `text` is the source's own wording with
  whitespace normalised - line breaks and the RFC's double sentence spacing
  become single spaces. Every one of the 28 texts was cut from
  .cache/rfc-9597.txt by line range by script, never retyped, and then VERIFIED
  mechanically as a contiguous substring of the whitespace-normalised source:
  28 of 28, zero failures.

  NO PAGE DECORATION EXISTS. This is an unpaginated RFC v3 rendering with ZERO
  form feeds and no running footers, so no line number here can be shifted by
  splitlines() and no region removes anything. Contrast rfc-8392 in the same
  lane, which has 25 of each.
reviewed_by: ""
note: >-
  Ids are stable and never reused. Cite as rfc-9597#R-NNNN.

  Pass 1 of the FX-1 extraction (extract), effort max, 2026-10-20. Read only
  .cache/rfc-9597.txt - never summary.md and never another record's artifacts.

  `verb: none` marks an entry whose source sentence carries no capitalised BCP
  14 keyword; `field` then names the phrase that carries the force instead.

  THIS DOCUMENT DEFINES NO PROTOCOL, NO LIFECYCLE AND PRINTS NOT ONE BYTE.
  Measured over all 265 lines, whole-word and case-insensitive: `protocol`,
  `exchange`, `handshake`, `negotiate`, `sender`, `receiver`, `verifier` and
  `response` each occur ZERO times, and `recipients` occurs ONCE, at line 108,
  inside the MUST NOT. `state`, `states`, `lifecycle`, `revoke`, `revocation`,
  `rotate`, `expire` and `registration` each occur ZERO times. `example`,
  `examples`, `Figure`, `hex`, `vector` and `diagnostic notation` each occur
  ZERO times. So protocol, state-machine and examples are declared
  not_applicable in record.yaml, each with the measurement written out in its
  own file.

requirements:
  - id: 'rfc-9597#R-0001'
    object: 'CWT claims in COSE header parameters'
    field: 'why the mechanism exists; force carried by "it is useful to have a standard representation"'
    verb: 'none'
    actor: 'reader'
    locator: '§1'
    text: 'In some applications of COSE, it is useful to have a standard representation of CWT claims [RFC8392] available in the header parameters.'
    kind: inferred
    testable: 'no'
    status: active
  - id: 'rfc-9597#R-0002'
    object: 'the cases served'
    field: 'which COSE structures: encrypted structures and detached signatures'
    verb: 'none'
    actor: 'reader'
    locator: '§1'
    text: 'These include encrypted COSE structures, which may or may not be an encrypted CWT, and/or those featuring a detached signature.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0003'
    object: 'the cases served'
    field: 'payloads that are not CWT Claims Sets, including non-CBOR payloads'
    verb: 'none'
    actor: 'reader'
    locator: '§1'
    text: 'Another use case is using CWT claims with payloads that are not CWT Claims Sets, including payloads that are not CBOR at all.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0004'
    object: 'iss claim in a COSE_Sign1 over a non-CBOR payload'
    field: 'the worked motive, and the one place the document names a USE for a claim: key discovery'
    verb: 'none'
    actor: 'application'
    locator: '§1'
    text: 'For instance, an application might want to include an "iss" (issuer) claim in a COSE_Sign1 structure when the payload being signed is a non-CBOR data structure, such as a bitmap image, and the issuer value is used for key discovery.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The only functional purpose any claim is given in this document, and it is a DEC-005 touchpoint: ''the issuer value is used for key discovery'' is a precondition for selecting a key, and therefore an algorithm.'
  - id: 'rfc-9597#R-0005'
    object: 'JWT'
    field: 'the JOSE precedent: RFC 7519 §5.3 did this for JWT'
    verb: 'none'
    actor: 'reader'
    locator: '§1'
    text: 'Section 5.3 of [RFC7519], "JSON Web Token (JWT)", defined a similar mechanism for expressing selected JWT-based claims as JSON Object Signing and Encryption (JOSE) header parameters.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0006'
    object: 'this specification'
    field: 'what it fixes; force carried by "an omission that this specification corrects"'
    verb: 'none'
    actor: 'reader'
    locator: '§1'
    text: 'This JWT feature was motivated by the desire to have certain claims, such as the Issuer value, be visible to software processing the JWT, even though the JWT is encrypted. No corresponding feature was standardized for CWTs, which was an omission that this specification corrects.'
    kind: inferred
    testable: 'no'
    status: active
  - id: 'rfc-9597#R-0007'
    object: 'CWT claim values as COSE header parameter values'
    field: 'WHY NESTING WAS NECESSARY: the numeric header parameter assignments and the numeric CWT claim assignments conflict'
    verb: 'none'
    actor: 'reader'
    locator: '§1'
    text: 'Directly including CWT claim values as COSE header parameter values would not work, since there are conflicts between the numeric header parameter assignments and the numeric CWT claim assignments.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'THE STRONGEST FIELD EVIDENCE FOR R-M-12 IN THIS LANE. Two independently governed global integer label spaces grew into each other across their whole cheap range - CWT claims 1/2/3/4 are iss/sub/aud/exp while COSE header parameters 1/2/3/4 are alg/crit/content type/kid - and the only available remedy was to buy one label in the first registry and nest the second inside it. Evidence rather than argument, because the IETF paid for it.'
  - id: 'rfc-9597#R-0008'
    object: 'this specification'
    field: 'the remedy: ONE header parameter that creates a location for CWT claims'
    verb: 'none'
    actor: 'implementation'
    locator: '§1'
    text: 'Instead, this specification defines a single header parameter registered in the IANA "COSE Header Parameters" registry that creates a location to store CWT claims in a COSE header parameter.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0009'
    object: 'this specification'
    field: 'SCOPE EXCLUSION: it does not define how to use any claim it relocates, or its semantics, in payload or header or both'
    verb: 'none'
    actor: 'profile author'
    locator: '§1'
    text: 'This specification does not define how to use CWT claims and their semantics for particular applications, whether they are in the COSE payload or the CWT Claims header parameter, or both.'
    kind: inferred
    testable: 'no'
    status: active
    note: 'So the mechanism is inert without a profile. Ours does not exist yet.'
  - id: 'rfc-9597#R-0010'
    object: 'processing the CWT Claims header parameter'
    field: 'the precondition: "unambiguously knowing the intended interpretation"'
    verb: 'none'
    actor: 'recipient'
    locator: '§1'
    text: 'Therefore, understanding how to process the CWT Claims header parameter requires unambiguously knowing the intended interpretation.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0011'
    object: 'the intended interpretation'
    field: 'source 1: other header parameters'
    verb: 'MAY'
    actor: 'application'
    locator: '§1'
    text: 'The necessary information about this MAY come from other header parameters.'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0012'
    object: 'the intended interpretation'
    field: 'source 2, the RECOMMENDED one: the typ header parameter of RFC 9596 - and only when no natural way exists at an appropriate level of integrity protection and authentication'
    verb: 'RECOMMENDED'
    actor: 'application'
    locator: '§1'
    text: 'Unless there already is a natural way of providing this information at an appropriate level of integrity protection and authentication, a RECOMMENDED way to include this information in the COSE structure is use of the "typ" (type) Header Parameter [RFC9596].'
    kind: stated
    testable: 'yes'
    status: active
    note: 'RECOMMENDED, not required - and RFC 9596 §2 makes its own use OPTIONAL, so the chain is RECOMMENDED over OPTIONAL. See design-notes.md.'
  - id: 'rfc-9597#R-0013'
    object: 'the intended interpretation'
    field: 'source 3: anything else'
    verb: 'MAY'
    actor: 'application'
    locator: '§1'
    text: 'Other methods for determining the intended interpretation MAY also be used.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'This is what keeps the typ recommendation from closing the gap: any other method is permitted and none is named or constrained.'
  - id: 'rfc-9597#R-0014'
    object: 'recipient of the CWT Claims header parameter'
    field: 'THE DEFENCE, AND IT IS PLACED ON THE PARTY UNDER ATTACK: do not use the information beyond the protection afforded to the header AND to whatever derived its interpretation'
    verb: 'MUST NOT'
    actor: 'recipient'
    locator: '§1'
    text: 'Recipients of the CWT Claims header parameter MUST NOT use the information in the CWT Claims header parameter beyond the integrity protection or authentication afforded to the CWT Claims header and the information used to derive its intended interpretation.'
    kind: stated
    testable: 'partial'
    status: active
    note: 'A real MUST NOT and correct, but unenforceable by the producer, untestable by a conformance checker, and defeated by any COSE API that presents a merged view of the two header maps to its caller. Note the second conjunct: the protection afforded to ''the information used to derive its intended interpretation'' - so an unprotected typ would cap the claims'' usability too.'
  - id: 'rfc-9597#R-0015'
    object: 'CWT Claims header parameter'
    field: 'the registration: name, label, value type, value registry, description and reference'
    verb: 'none'
    actor: 'IANA'
    locator: '§2, Table 1'
    text: '| CWT | 15 | map | map keys in | Location | Section 2 | | Claims | | | [CWT.Claims] | for CWT | of RFC | | | | | | Claims in | 9597 | | | | | | COSE Header | | | | | | | Parameters | | +--------+-------+-------+--------------+---------------+-----------+'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Label 15, Value Type `map`, Value Registry [CWT.Claims]. THE VALUE REGISTRY COLUMN IS THE COST: this parameter does not merely permit a claim-registry dependence, it NAMES the registry as the definition of its own value space.'
  - id: 'rfc-9597#R-0016'
    object: 'the CDDL fragment'
    field: 'THE DOCUMENT''S OWN DECLARATION THAT ITS ONLY STRUCTURAL DESCRIPTION IS NON-NORMATIVE'
    verb: 'none'
    actor: 'reader'
    locator: '§2'
    text: 'The following is a non-normative description for the value type of the CWT claim header parameter using CDDL [RFC8610].'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'So nothing in schema/ derived from it may be cited as a constraint. The empty map {} is admitted and no normative sentence forbids a float, boolean or byte-string claim label.'
  - id: 'rfc-9597#R-0017'
    object: 'CWT-Claims value type'
    field: 'the non-normative CDDL: a map of zero or more Claim-Label => any'
    verb: 'none'
    actor: 'implementation'
    locator: '§2'
    text: 'CWT-Claims = { * Claim-Label => any }'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0018'
    object: 'Claim-Label'
    field: 'the non-normative label space: int / text, flat and global, with no key component'
    verb: 'none'
    actor: 'implementation'
    locator: '§2'
    text: 'Claim-Label = int / text'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'ARCH-0002 P1 wants (defining key, label). This is int / text. Even the strictest ratified profile keeps it open - rfc-9943''s Figure 3 admits `* label => any` with `label = int / tstr`.'
  - id: 'rfc-9597#R-0019'
    object: 'claims present in BOTH the payload and the header of a CWT'
    field: 'THE DUPLICATION RULE: verify the values are identical - unless the application defines other specific processing rules'
    verb: 'MUST'
    actor: 'recipient'
    locator: '§2'
    text: 'In cases where CWT claims are present both in the payload and the header of a CWT, an application receiving such a structure MUST verify that their values are identical, unless the application defines other specific processing rules for these claims.'
    kind: stated
    testable: 'partial'
    status: active
    note: 'TWO ESCAPE HATCHES. (1) The `unless` clause voids it by profile, and nothing constrains what those other rules may be. (2) It fires only for ''a CWT'', and rfc-8392 §6 opens ''How to determine that a CBOR data structure is a CWT is application dependent'' - while §2''s last paragraph here says the parameter is not restricted to CWTs. And ''identical'' is undefined: byte equality of the encoded items, or equality of the CBOR data items? A preferred and a non-preferred encoding of the same integer are one value and two byte strings.'
  - id: 'rfc-9597#R-0020'
    object: 'CWT Claims header parameter'
    field: 'PLACEMENT: protected only, to avoid malleability - RECOMMENDED, not required'
    verb: 'RECOMMENDED'
    actor: 'producer'
    locator: '§2'
    text: 'It is RECOMMENDED that the CWT Claims header parameter only be used in a protected header to avoid the contents being malleable.'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0021'
    object: 'CWT Claims header parameter'
    field: 'OCCURRENCE: at most once, in either bucket'
    verb: 'MUST'
    actor: 'producer'
    locator: '§2'
    text: 'The header parameter MUST only occur once in either the protected or unprotected header of a COSE structure.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'WEAKER THAN IT READS. It bars label 15 appearing in BOTH buckets; it expressly permits it appearing in the unprotected one. RFC 9052 §4.4''s Sig_structure is [context, body_protected, external_aad, payload] and the unprotected header is not an input, so a fully conformant producer can emit a CWT Claims header parameter that no signature covers at all.'
  - id: 'rfc-9597#R-0022'
    object: 'CWT Claims header parameter'
    field: 'SCOPE: any COSE object using header parameters, not only CWTs'
    verb: 'MAY'
    actor: 'producer'
    locator: '§2'
    text: 'The CWT Claims header parameter MAY be used in any COSE object using header parameters, such as COSE_Sign objects. Its use is not restricted to CWTs.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'This is what makes the §2 duplication MUST conditional on an undefined predicate: the parameter may appear where there is no CWT for ''a CWT'' to denote.'
  - id: 'rfc-9597#R-0023'
    object: 'registered CWT claims in a COSE header'
    field: 'PRIVACY IS STRUCTURAL: claims in COSE headers are not encrypted, so privacy-sensitive claims are published'
    verb: 'none'
    actor: 'application'
    locator: '§3'
    text: 'Some of the registered CWT claims may contain privacy-sensitive information. Since CWT claims in COSE headers are not encrypted, when privacy-sensitive information is present in these claims, applications and protocols using them should ensure that these COSE objects are only made visible to parties for which it is appropriate for them to have access to this sensitive information.'
    kind: inferred
    testable: 'no'
    status: active
    note: 'Pre-decryption visibility IS the feature (§1), so publication is the price. Lowercase ''should ensure'': no normative force under §1.1.'
  - id: 'rfc-9597#R-0024'
    object: 'implementer'
    field: 'incorporated security considerations: RFC 8392 §8'
    verb: 'none'
    actor: 'implementation'
    locator: '§4'
    text: 'Implementers should also review the security considerations for CWT, which are documented in Section 8 of [RFC8392].'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0025'
    object: 'detached content'
    field: 'the application, not the format, must ensure the payload travels unchanged'
    verb: 'none'
    actor: 'application'
    locator: '§4'
    text: 'As described in [RFC9052], if the COSE payload is transported separately ("detached content"), then it is the responsibility of the application to ensure that it will be transported without changes.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0026'
    object: 'the duplication rule'
    field: 'the rationale: eliminate confusion from different values for the same claim, which could cause inconsistent processing'
    verb: 'none'
    actor: 'reader'
    locator: '§4'
    text: 'The reason for applications to verify that CWT claims present in both the payload and the header of a CWT are identical, unless they define other specific processing rules for these claims, is to eliminate potential confusion that might arise by having different values for the same claim, which could result in inconsistent processing of such claims.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9597#R-0027'
    object: 'information in claims processed before its integrity is verified'
    field: 'THE DOCUMENT''S MOST IMPORTANT INSTRUCTION, AND IT IS LOWERCASE: confirm any tentative decision once cryptographic processing completes, including whatever derived the intended interpretation'
    verb: 'none'
    actor: 'implementation'
    locator: '§4'
    text: 'Processing information in claims prior to validating that their integrity is cryptographically secure can pose security risks. This is true whether the claims are in the payload or a header parameter. Implementers must ensure that any tentative decisions made based on previously unverified information are confirmed once the cryptographic processing has been completed. This includes any information that was used to derive the intended interpretation of the CWT claims parameter.'
    kind: inferred
    testable: 'partial'
    status: active
    note: '''Implementers must ensure'' - lower case, so under §1.1 it carries no normative force. In a document whose whole purpose is to make claims readable BEFORE verification, the rule against acting on unverified claims is advice.'
  - id: 'rfc-9597#R-0028'
    object: 'CWT Claims header parameter'
    field: 'IANA has registered it in the COSE Header Parameters registry'
    verb: 'none'
    actor: 'IANA'
    locator: '§5'
    text: 'IANA has registered the new COSE header parameter "CWT Claims" defined in Table 1 in the "COSE Header Parameters" registry [COSE.HeaderParameters].'
    kind: inferred
    testable: 'yes'
    status: active
