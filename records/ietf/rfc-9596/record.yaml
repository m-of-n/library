relations:
  # Set 2026-10-20 with summary.md. No `contradicts` edge: see the rfc-9597
  # note and summary.md — the protection-strength asymmetry between these two
  # documents is an asymmetry, not an incompatibility.
  see_also:
    # §1 of RFC 9597 names `typ` as its RECOMMENDED interpretation signal,
    # while §2 here states that `typ` does not describe unprotected headers —
    # exactly where RFC 9597 §2 permits its claims to sit.
    - rfc-9597
    # §4.4's Sig_structure is why the §2 MUST NOT (no `typ` in unprotected
    # headers) makes this the only authenticated type signal in the set.
    - rfc-9052
    # Registered BOTH spellings of a CWT type: media type application/cwt
    # (§9.2.1) and CoAP Content-Format Id 61 (§9.3.1) — the two `typ` values
    # that denote one type and compare unequal. Also CBOR tag 61 (§9.4.1),
    # the unauthenticated signal `typ` replaces.
    - rfc-8392
    # Its design-notes record the cost this parameter removes: option 5
    # declines the tag registry, "which means the recipient must be told out
    # of band that these bytes are a COSE_Sign1".
    - rfc-9053
    # §4.4 reaches for `typ` for the same reason and in lowercase:
    # "One way to include this information in the COSE structure".
    - rfc-9942
    # The JOSE `typ` this parameter is a port of.
    - rfc-7515
  part_of:
    - ietf-cose-wg
bears_on:
  # Widened 2026-10-20 by the FX-1 extraction (pass 1). Each addition is
  # evidenced in distilled/design-notes.md, not assumed:
  #   DEC-002 — THE STRONGEST EDGE, and the one thing in this lane that lands
  #     in option 5's favour: rfc-9053's extraction recorded that "option 5
  #     declines the tag registry - no tag, which means the recipient must be
  #     told out of band that these bytes are a COSE_Sign1", and label 16 is
  #     the in-band substitute, inside Sig_structure because §2's MUST NOT
  #     forces it there. That converts a recorded COST of option 5 into a
  #     recorded NON-COST. Scoping correction the extraction insists on: the
  #     word `tag` occurs ZERO times in RFC 9596, so the replacement argument
  #     is OURS and is marked [analysis], not attributed to the RFC. Against
  #     option 5: typ's value space is two global registries with no key
  #     component, so the mechanism that saves the no-tags clause can only
  #     name types the way the P1 clause forbids.
  #   R-O-05 — condition (4) of topics/canonical-encoding.yaml is "an
  #     authenticated type indicator carried inside the signed bytes", and
  #     THIS IS THE ONLY DOCUMENT IN THE LANE THAT SUPPLIES THE MECHANISM.
  #     What it does not supply is the obligation (OPTIONAL) or the
  #     vocabulary. Cheapest canonical-encoding gap in the set to close.
  #   R-M-12 — both value registries are global with no key component, which
  #     is the shape R-M-12 and ARCH-0002 P1 reject. Same cut rfc-9597 and
  #     rfc-8392 make about their own spaces: three documents, three
  #     registries, one shape.
  #   R-O-03 — the equality relation is undefined, so "map both spellings to a
  #     single canonical form before comparing" is a rule we must STATE rather
  #     than assume; and every fixture is ours, because the document names not
  #     one typ value.
  - DEC-002
  - DEC-005
  - R-M-12
  - R-O-03
  - R-O-05
