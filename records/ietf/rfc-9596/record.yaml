distillation:
  standard: "FX-1"
  # NO `profile` IS DECLARED. Pass 1 (extract) is complete and the artifact set
  # is complete (five artifacts present, three declared not_applicable with
  # measured reasons); pass 2 (verify) and pass 3 (cross-check) have NOT run
  # and no `reviewed_by` is signed. Under docs/extraction.md an unfinished
  # extraction has no profile at all.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "11 verbatim regions covering the whole document except the references, the acknowledgements and the authors' addresses, each an exact run of source lines with its own sha256 (the region's lines joined by \\n, no trailing newline). §1 IS QUOTED IN THREE PARTS BECAUSE THE VALUE SPACE IS STATED THERE AS WELL AS IN §2 (source lines 83-87 and 114-119), so a reader who treats §1 as background misses half the document's statement of its own type space. §2 is quoted in six parts, one per sentence group. The §1.1 BCP 14 recital is quoted here and deliberately never in requirements.yaml - and normative.md notes where it quotes it that §1.1 is also the sentence that DISARMS §3. NO PAGE DECORATION EXISTS: unpaginated RFC v3 rendering, zero form feeds. Carries four observations about the document's normative shape, including that the word `tag` occurs ZERO times in it"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "21 entries R-0001 to R-0021 in source order with no gaps: 3 stated, 18 inferred. source_keyword_count and extracted_keyword_count both 3 and AGREEING, with a reconciliation that is about what 3 MEANS rather than about arithmetic. THE THREE, by line: L112 OPTIONAL, L119 MAY, L130 MUST NOT, all in §2; §1, §3, §4 and §5 contain NONE. THERE IS NO MUST, NO SHOULD, NO SHALL AND NO RECOMMENDED ANYWHERE IN THE DOCUMENT, and not one of the three keywords REQUIRES anything - one makes the use optional, one permits media type parameters, one forbids a placement. So a conformant implementation performs NO CHECK WHATSOEVER, which the document states twice: §2 tells COSE libraries to ignore the parameter and §3's two reject rules are LOWER CASE. TWO LINE-BREAK SEVERANCES ARE DECLARED NOT HEALED, AND THEY ARE NOT THE SAME KIND: the wrap cuts 'CoAP Content-Formats' at 85/86 (at the SPACE, hyphen intact on line 86) and again at 116/117 (at the HYPHEN), and R-0010 carries the hyphenated span with the hyphen visible while R-0004 carries the 85/86 span as printed. [correction 2026-10-20, pass 2 - verify] This read 'at 86/87 and again at 116/117, hyphen and all'; the first break is at 85/86 and cuts at a space, so only the second is a hyphenation break. The data was correct everywhere - 11 of 11 normative regions and 5 of 5 schema regions reproduce from the cache - only the description was wrong. All 21 texts verified mechanically as contiguous substrings, 0 failures, with a terminator check catching two hand-chosen spans that stopped mid-sentence"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "1 verbatim file and 2 derived, plus a README. THE DOCUMENT SHIPS NO GRAMMAR OF ANY KIND - CDDL, ABNF, ASN.1 and JSON Schema each occur ZERO times in its 232 lines, and `syntax` occurs three times as the English word in prose about the value space. So source-renderings.txt captures the only structural renderings the document makes: §1's and §2's statements of the value space, the one MUST NOT, the two sentences about what typ does NOT describe, and §4.1's Table 1 - five regions with line ranges and digests, carrying the two 'CoAP Content-Formats' line breaks EXACTLY as printed. The derived CDDL gives the label, the two-branch value space and the placement rule as a shape, and NAMES THE THREE THINGS IT CANNOT EXPRESS, each a real gap: equality (two wire spellings for one type, with no rule), consistency with content type (labels 16 and 3, same syntax, no requirement to agree), and any check at all. Plus a JSON-projection schema with $id urn:library:rfc-9596:typ-header.derived"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "3 structures, 4 fields: label 16 itself, the two COSE header buckets as §2's one prohibition constrains them, and content type (label 3), which is named because §2 defines typ BY CONTRAST with it and borrows its syntax wholesale. `constrained_by` wired, 7 of 21 requirements cited, 0 dangling; content type's empty list is a finding, since RFC 9596 constrains it in no way and nothing requires the two labels to agree. EVERY LAYOUT IS DERIVED from Table 1 and RFC 9052 §3 rather than decoded, because the document prints no bytes at all. One measurement of ours: a CoAP Content-Format id costs 2 octets of value against 16 for 'application/cwt', so the two spellings of ONE type differ by an order of magnitude in size as well as in bytes"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "The finding this record exists for: label 16 is the in-band, AUTHENTICATED substitute for the CBOR tag MD-3 removes, answering a cost rfc-9053's extraction recorded by name - and the boundary is DEMONSTRATED, since the sibling rfc-8392 extraction in this same pass verified RFC 8392's A.3 signature from Sig_structure's four fields alone. WITH A SCOPING CORRECTION THE PASS INSISTS ON: the word `tag` occurs ZERO times in RFC 9596, so the entire replacement argument is OURS, marked [analysis], and must be cited that way in the DEC-002 ADR rather than attributed to the RFC. Also: what the mechanism's absence enables and its presence does not prevent (a conformant implementation performs no check whatsoever, with the full keyword census behind it); the rfc-9597 asymmetry, where typ by its own text does not describe the bucket rfc-9597 permits its claims to sit in; the four-signal table with its third row now proved; the three-document chain stated as one sentence - a MUST whose antecedent is undefined, resting on a RECOMMENDED pointer, to a parameter whose use is OPTIONAL. 3 adopts, 3 adaptations, 2 rejections. MD-3 MAPPED HEADER BY HEADER over 7 of our fields, then FIVE CUTS, each naming the DEC-002 option it affects: (1) FOR option 5, the strongest thing in the lane in its favour; (2) the linting consequence - a no-tags lint must not treat typ: 61 as a tag hit, because rfc-8392 registered 61 twice in two registries with opposite verdicts under MD-3; (3) two global value registries with no key component, costs option 5; (4) no equality relation, so the mechanism can be defeated by RESPELLING the type - costs options 5 and 3 alike, and this pass added the size measurement; (5) no implementation exists and never will need to, which cuts both ways and the useful way is that adopting typ costs no library support. DEC-005. CONDITION (4) OF canonical-encoding, which this is the ONLY document in the lane to supply the mechanism for. The summary's nine findings tested: eight confirmed, one scoped, three sharpened, NONE REFUTED. 6 source defects. 5 open questions. A SECOND DOCUMENT IS CITED AND NOT HELD, and it is not ours: RFC 8725 (BCP 225) carries the entire security case and is not in this library. 10 quotations of RFC 9596, every one cut from the cache by line range by script and verified as a contiguous substring; every quotation of a mofn document is marked UNVERIFIABLE FROM THIS REPOSITORY, following rfc-9741"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "RFC 9596 defines no exchange, no role and no flow - it registers ONE COSE header parameter and states one prohibition about it. Measured whole-word and case-insensitively over all 232 lines: `protocol` 0, `exchange` 0, `handshake` 0, `negotiate` 0, `sender` 0, `receiver` 0, `recipient` 0, `recipients` 0, `verifier` 0, `response` 0, `transport` 0, `party` 0, `parties` 0, `producer` 0, `consumer` 0, `step` 0, `steps` 0. THIS IS THE ONLY RECORD IN THE LANE WHERE EVEN `recipient` IS ABSENT - rfc-8392 has 8 occurrences and rfc-9597 has one. The single near-miss is `request` at line 6, the RFC masthead; `application`/`applications` occur 12 times and that IS the finding, since the application is the party that does everything this document declines to do. AND THE DOCUMENT SAYS IN TERMS THAT THERE IS NOTHING TO MODEL: \"The \"typ\" (type) header parameter is ignored by COSE implementations (libraries implementing [RFC9052] and this specification), other than being passed through to applications using those implementations. Any processing of this parameter is performed by the COSE application using application-specific processing rules.\" The one check it describes is lower case and illustrative - §2's \"For instance, an application might verify ... and reject the data structure if it is not\" - so there is no required step, no ordering and no error path. Written out in distilled/protocol.yaml and protocol.md."
    - kind: state-machine
      reason: "RFC 9596 defines no lifecycle. Measured whole-word and case-insensitively over all 232 lines: `state` 0, `states` 0, `lifecycle` 0, `revoke` 0, `revocation` 0, `rotate` 0, `rotation` 0, `expire` 0, `expiry` 0, `expiration` 0, `issue` 0, `issuance` 0, `register` 0, `registration` 0, `step` 0, `steps` 0, `return` 0 - not one occurs, including `registration`, although §4.1 performs one and is titled \"COSE Header Parameter Registrations\" (the body uses the verb: \"IANA has registered the following value\"). A TYPE INDICATOR IS A CONSTANT, WHICH IS THE SHARPEST FORM OF THIS, and §2 says it in the one sentence that would otherwise have described a transition: \"Changes to unprotected headers do not change the type of the COSE object.\" The type is fixed at signing, so there is nothing for a state to be: the value is immutable, the check is optional, and the failure action is an illustration. The one ordering question in the lane - when a tentative decision made on unverified information is confirmed - is in rfc-9597 §4 and is lower case there. Written out in distilled/state-machine.yaml."
    - kind: examples
      reason: "RFC 9596 PRINTS NOT ONE BYTE. Measured whole-word and case-insensitively over all 232 lines: `Figure` 0, `hex` 0, `vector` 0, `test vector` 0, `diagnostic notation` 0, `examples` 0, and `example` ONCE - at line 89, and it is a DEFINITION rather than a fixture (\"An example of a COSE object is a COSE_Sign1 structure, as described in Section 4.2 of [RFC9052].\"). NOT ONE typ VALUE IS NAMED ANYWHERE IN THE DOCUMENT: §2 says the value is \"either an unsigned integer as registered in the \"CoAP Content-Formats\" registry [CoAP.ContentFormats] or a string content type value\" and then gives no instance of either, so there is no reference fixture, no worked example of the equality problem the mechanism has, and every fixture we build is ours under R-O-03. §4.1 registers the parameter without registering a single value. The lane contrast is the useful measurement: rfc-8392 prints five complete CWTs (all five verified in this pass) and neither of the two header parameters we would actually rely on supplies any. Written out in distilled/examples/README.md."
  passes:
    - pass: extract
      by: "claude-opus-5 (pass 1 of library#39 Tier 2, CWT envelope lane; single agent, whole artifact set, three records)"
      effort: max
      date: "2026-10-20"
      note: "Read only .cache/rfc-9596.txt - never summary.md and never another record's artifacts. EVERY VERBATIM BLOCK AND EVERY QUOTATION WAS LIFTED FROM THE CACHE BY LINE RANGE BY SCRIPT, never retyped, and verified mechanically rather than by eye: 21 of 21 requirement texts and 10 of 10 design-note quotations are contiguous substrings of the whitespace-normalised source, 0 failures; 11 normative.md regions and 5 schema regions carry their own sha256. The source has no form feeds and no page decoration. THE TWO LINE-BREAK SEVERANCES OF 'CoAP Content-Formats' AT 85/86 (at the space) AND 116/117 (at the hyphen) ARE DECLARED NOT HEALED in three places - schema/source-renderings.txt carries the byte-exact lines, requirements.yaml R-0004 and R-0010 carry the flowed span with the hyphen visible, and schema/README.md and design-notes.md D-5 both say so - because two silently healed line breaks are among the five transcription defects this lane's own quote audit found in its own prose. Cross-artifact consistency was checked at write time: every requirement id cited by messages.yaml resolves (0 dangling) and both of the library's YAML readers parse every file. The three not_applicable verdicts were each DERIVED from word sweeps over the whole source. ONE CLAIM IN THIS RECORD'S summary.md IS SCOPED RATHER THAN REFUTED - the tag-replacement argument is ours, since the word `tag` occurs zero times in RFC 9596 - and three are sharpened; the scoping is recorded in summary.md in place rather than edited away."
    - pass: verify
      by: "claude-opus-5 (pass 2 of 3, independent; did not extract; three records in one lane)"
      effort: max
      date: "2026-10-20"
      note: "THE KEYWORD CENSUS IS CONFIRMED AND THERE IS NO FOURTH KEYWORD. Re-counted two ways: bin/bcp14-count gives 3, and a raw whole-word sweep over all 233 split lines finds 14 all-caps keyword tokens of which 11 are the section 1.1 BCP 14 recital at L95-L97, leaving exactly OPTIONAL at L112, MAY at L119 and MUST NOT at L130, all in section 2. No MUST, SHOULD, SHALL or RECOMMENDED anywhere. So the three claims resting on the census stand. THE ZERO IS VERIFIED: `tag` and `tags` each occur ZERO times, so the typ-replaces-the-tag argument is ours, and its three assembled premises were each checked at source - section 2's MUST NOT at L130, RFC 9052 section 4.4's Sig_structure from records/ietf/rfc-9052's own cose.cddl, and rfc-8392 section 7.1 step 6 (the tag is prepended AFTER the signing of step 4) with section 7.2 steps 2-3 (both tags are REMOVED before the cryptographic validation of step 5). The middle premise is now DEMONSTRATED rather than cited: pass 2's independent A.3 verification succeeds on the four-field Sig_structure and FAILS when the unprotected map is folded in as a fifth field. 21 of 21 requirement texts re-verified verbatim, 0 terminator suspects; all 21 locators verified under a STRICTER rule than bin/check-locators applies, comparing the innermost containing section - 0 misfiled, 0 imprecise, so the feared section 1 / section 2 mix-up did not happen even though the value space is stated in both. All 11 normative.md regions and all 5 schema regions re-verified: digest AND printed block byte-identical to the cache. Body source-line coverage computed: the only uncovered lines are the six section headings. THE 2-VERSUS-16 ARITHMETIC IS CONFIRMED BY ENCODING, not by reading: 61 encodes as 0x18 0x3d (2 octets) and 'application/cwt' as 0x6f plus 15 characters (16 octets), with both head bytes exactly as claimed, and rfc-8392 section 9.3.1 does register Id 61 for that media type. THE protocol not_applicable IS CONFIRMED: section 2's 'For instance, an application might verify ... and reject the data structure if it is not' is illustrative, carrying no keyword, no counterparty and no ordering, and section 2 disclaims procedure in terms. THE LINE-BREAK CLAIM IS THE ONE DEFECT FOUND: the record said in eight places across six files that the wrap cuts 'CoAP Content-Formats' at 86/87 and 116/117 'hyphen and all'. The first break is at 85/86 and cuts at the SPACE, not the hyphen; only 116/117 is a hyphenation break. The DATA was correct everywhere - every region reproduces from the cache and R-0004/R-0010 carry exactly what the source prints - so only the description was wrong, and all eight sites are corrected. ONE LOCATOR CORRECTED: `label = int / tstr` was cited as RFC 9052 section 1.4; it is section 1.5, the same error rfc-9597 carried."
