note: >-
  RFC 9596 DEFINES NO LIFECYCLE AND NO STATE MACHINE.

  WORD COUNTS OVER ALL 232 LINES, whole-word and case-insensitive: `state` 0,
  `states` 0, `lifecycle` 0, `revoke` 0, `revocation` 0, `rotate` 0,
  `rotation` 0, `expire` 0, `expiry` 0, `expiration` 0, `issue` 0,
  `issuance` 0, `register` 0, `registration` 0, `step` 0, `steps` 0,
  `return` 0. NOT ONE of them occurs anywhere in the document - including
  `registration`, although §4.1 performs one and the section is titled "COSE
  Header Parameter Registrations"; the body uses the verb ("IANA has registered
  the following value").

  A TYPE INDICATOR IS A CONSTANT, WHICH IS THE SHARPEST FORM OF THIS. §2 says
  so in the one sentence that would otherwise have described a transition:
  "Changes to unprotected headers do not change the type of the COSE object."
  So the type of a COSE object is fixed at signing and cannot change; there is
  nothing for a state to be. The value is immutable, the check is optional, and
  the failure action is an illustration.

  THE ONE ORDERING QUESTION IN THE LANE IS NOT HERE EITHER. rfc-9597 §4 warns
  that tentative decisions made on unverified information must be confirmed
  after cryptographic processing - the one place a two-state model would have
  been useful - and that sentence is in rfc-9597, not here, and is lower case
  there. See records/ietf/rfc-9597/distilled/state-machine.yaml, which records
  it as the lifecycle that document is missing.

machines: []

absent:
  - "No issuance, rotation, revocation or expiry of anything; none of those words occurs."
  - "No states a COSE object or a typ value can be in. §2: changes to unprotected headers do not change the type, so the type is immutable once signed."
  - "No transitions, triggers or guards."
  - "No terminal or error states: the only failure mentioned anywhere is §2's illustrative 'reject the data structure if it is not'."
  - "No ordering between reading typ and verifying the signature - which is the one ordering a profile most needs, since typ is inside the signature and so is only trustworthy after it."
