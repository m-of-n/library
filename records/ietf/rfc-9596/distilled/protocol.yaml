note: >-
  RFC 9596 DEFINES NO PROTOCOL, and this file records the measurement rather
  than asserting the conclusion. It registers ONE COSE header parameter and
  states one prohibition about it.

  WORD COUNTS OVER ALL 232 LINES, whole-word and case-insensitive, with the
  lines where each occurs: `protocol` 0, `exchange` 0, `handshake` 0,
  `negotiate` 0, `sender` 0, `receiver` 0, `recipient` 0, `recipients` 0,
  `verifier` 0, `response` 0, `transport` 0, `party` 0, `parties` 0,
  `producer` 0, `consumer` 0, `step` 0, `steps` 0. ONE NEAR-MISS: `request`
  occurs once, at line 6, in the RFC masthead. `application` and
  `applications` occur 12 times between them and that IS the finding - the
  application is the party that does everything this document declines to do.

  THE DOCUMENT SAYS IN TERMS THAT THERE IS NO PROCESSING TO MODEL. §2: "The
  "typ" (type) header parameter is ignored by COSE implementations (libraries
  implementing [RFC9052] and this specification), other than being passed
  through to applications using those implementations. Any processing of this
  parameter is performed by the COSE application using application-specific
  processing rules." A parameter whose processing is defined as
  application-specific has no flow of its own.

  AND THE ONE CHECK IT DESCRIBES IS LOWER CASE AND ILLUSTRATIVE. §2: "For
  instance, an application might verify that the "typ" value is a particular
  application-chosen media type and reject the data structure if it is not." §3
  repeats it twice as lower-case `should reject`. NEITHER BINDS ANYBODY under
  §1.1's "when, and only when, they appear in all capitals, as shown here", so
  there is no required step, no ordering and no error path - and A CONFORMANT
  IMPLEMENTATION OF RFC 9596 PERFORMS NO CHECK WHATSOEVER.

  THE ENVELOPE AND ITS PROCEDURES BELONG ELSEWHERE: RFC 9052 §4 for signing and
  verification, and rfc-8392 §7.1/§7.2 for CWT creation and validation. Both
  are held in this library, and rfc-8392's protocol.yaml is APPLICABLE and
  models all three of its flows.

