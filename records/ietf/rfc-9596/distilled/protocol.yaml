absent:
  - "No counterparties at all: `sender`, `receiver`, `recipient` and `verifier` each occur zero times. This is the only record in the lane where even `recipient` is absent."
  - "No messages, framing or ordering between parties."
  - "No required check. §2 says libraries ignore the parameter; §3's two reject rules are lower case."
  - "No error path and no error codes: §2's illustrative 'reject the data structure' is the only failure mentioned anywhere, and it is an example."
  - "No negotiation of type names, no versioning, and no vocabulary - §4.1 registers the parameter and leaves the values to applications."
