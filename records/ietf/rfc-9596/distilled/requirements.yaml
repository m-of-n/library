requirements:
  - id: 'rfc-9596#R-0001'
    object: 'COSE'
    field: 'the gap: COSE defines header parameters paralleling JOSE''s but not typ'
    verb: 'none'
    actor: 'reader'
    locator: '§1'
    text: 'CBOR Object Signing and Encryption (COSE) [RFC9052] defines header parameters that parallel many of those defined by the JSON Object Signing and Encryption (JOSE) specifications [RFC7515] [RFC7516]. However, one way in which COSE does not provide equivalent functionality to JOSE is that it does not define an equivalent of the "typ" (type) header parameter, which is used for declaring the type of the entire JOSE data structure.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9596#R-0002'
    object: 'explicit typing'
    field: 'the imported argument: RFC 8725 §3.11 recommends typ values to distinguish kinds of JWT'
    verb: 'none'
    actor: 'reader'
    locator: '§1'
    text: 'The security benefits of having "typ" (type) are described in Section 3.11 of [RFC8725], which recommends its use for "explicit typing" -- using "typ" values to distinguish between different kinds of JSON Web Tokens (JWTs) [RFC7519].'
    kind: inferred
    testable: 'no'
    status: active
    note: 'RFC 8725 (BCP 225) IS NOT IN THIS LIBRARY. §1 and §3 rest the entire security case on its §3.11 and this document reproduces none of the argument, so the warrant for the mechanism we would adopt is a document we do not hold. A cites gap and an ingest candidate.'
  - id: 'rfc-9596#R-0003'
    object: 'this specification'
    field: 'what it adds: the JOSE typ equivalent, so explicit typing reaches COSE objects'
    verb: 'none'
    actor: 'implementation'
    locator: '§1'
    text: 'This specification adds the equivalent of the JOSE "typ" (type) header parameter to COSE so that the benefits of explicit typing can be brought to COSE objects.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9596#R-0004'
    object: 'typ value'
    field: 'THE VALUE SPACE, and it is two global IANA registries: unsigned integers from the CoAP Content-Formats registry and string media type values'
    verb: 'none'
    actor: 'implementation'
    locator: '§1'
    text: 'The syntax of the COSE type header parameter value is the same as the existing COSE content type header parameter, allowing both unsigned integers as registered in the "CoAP Content-Formats" registry [CoAP.ContentFormats] and string media type values [MediaTypes] to be used.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'ARCH-0002 P1 wants (defining key, label). BOTH of these are global registries with no key component, which is the shape P1 and R-M-12 reject. The registry name is split across the line break at 85/86 in the source, AT THE SPACE: line 85 ends `the "CoAP` and line 86 begins `Content-Formats"`, so the hyphen is intact on one line and this flowed text reads "CoAP Content-Formats" correctly. [correction 2026-10-20, pass 2 - verify] This note said the name "is hyphenated across the line break at 86/87". The line numbers were off by one and the break is not a hyphenation break at all - that is R-0010''s break, at 116/117. The text itself was and is correct. normative.md''s fence is byte-exact.'
  - id: 'rfc-9596#R-0005'
    object: 'COSE object'
    field: 'the term is RFC 9052''s, and the canonical instance is a COSE_Sign1'
    verb: 'none'
    actor: 'reader'
    locator: '§1'
    text: 'The term "COSE object" is used as defined in [RFC9052]. An example of a COSE object is a COSE_Sign1 structure, as described in Section 4.2 of [RFC9052].'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9596#R-0006'
    object: 'typ header parameter'
    field: 'what it declares: the type of the COMPLETE COSE object, as against content type, which declares the type of the PAYLOAD'
    verb: 'none'
    actor: 'application'
    locator: '§2'
    text: 'The "typ" (type) header parameter is used by COSE applications to declare the type of this complete COSE object, as compared to the content type header parameter, which declares the type of the COSE object payload.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9596#R-0007'
    object: 'typ header parameter'
    field: 'the intended use: disambiguating among kinds of COSE object that could appear in one application data structure'
    verb: 'none'
    actor: 'application'
    locator: '§2'
    text: 'This is intended for use by the application when more than one kind of COSE object could be present in an application data structure that can contain a COSE object; the application can use this value to disambiguate among the different kinds of COSE objects that might be present.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9596#R-0008'
    object: 'typ header parameter'
    field: 'when it will not be used: when the kind of COSE object is already known'
    verb: 'none'
    actor: 'application'
    locator: '§2'
    text: 'It will typically not be used by applications when the kind of COSE object is already known.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9596#R-0009'
    object: 'typ header parameter'
    field: 'USE IS OPTIONAL'
    verb: 'OPTIONAL'
    actor: 'application'
    locator: '§2'
    text: 'Use of this header parameter is OPTIONAL.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'One of only three capitalised keywords in the document, and one of zero obligations to use the mechanism. Across its own definition and both ratified consumers the library holds, typ is NEVER mandatory: here OPTIONAL, in rfc-9597 §1 RECOMMENDED with ''Other methods ... MAY also be used'', and in rfc-9942 §4.4 lowercase ''One way''.'
  - id: 'rfc-9596#R-0010'
    object: 'typ header parameter value'
    field: 'SYNTAX: the same as content type (RFC 9052 §3.1) - either an unsigned integer from the CoAP Content-Formats registry or a string content type value'
    verb: 'none'
    actor: 'implementation'
    locator: '§2'
    text: 'The syntax of this header parameter value is the same as the content type header parameter defined in Section 3.1 of [RFC9052]; it is either an unsigned integer as registered in the "CoAP Content- Formats" registry [CoAP.ContentFormats] or a string content type value.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Quoted as the flowed region: the registry name ''CoAP Content-Formats'' is hyphenated across the line break at 116/117, so this span carries the hyphen as printed rather than healing it. normative.md''s fence is byte-exact. [correction 2026-10-21, pass 3 - cross-check] This span used to run seven words into the NEXT sentence and stop inside it, at "... or a string content type value. Content type values have a media type name [MediaTypes]", truncating "and MAY include media type parameters." R-0011 carries that sentence whole, so the trailing fragment added nothing and cost a mid-sentence stop - one step from the splice signature hazards.md is built around, and the ONE terminator suspect in all 21 texts. Trimmed to the sentence boundary: still verbatim, still carries the 116/117 hyphen, and extracted_keyword_count is unaffected because the MAY was never inside this span. record.yaml and ../README.md each claimed "0 terminator suspects" against this text; both are corrected.'
  - id: 'rfc-9596#R-0011'
    object: 'typ header parameter value'
    field: 'media type PARAMETERS are permitted and unconstrained'
    verb: 'MAY'
    actor: 'producer'
    locator: '§2'
    text: 'Content type values have a media type name [MediaTypes] and MAY include media type parameters.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'THE EQUALITY HAZARD. §2 permits media type parameters and constrains them not at all, media type names are case-insensitive (RFC 2045 §5.1, a document this library does not hold) while a CBOR tstr is not, and §3''s only guidance is to reject a value ''different than values that they expect'' - with ''different'' undefined. So application/cwt, Application/CWT and application/cwt; v=1 are three values and one type, and a confusion-resistance mechanism with an unspecified equality relation can be defeated by RESPELLING the type.'
  - id: 'rfc-9596#R-0012'
    object: 'COSE implementations (libraries implementing RFC 9052 and this specification)'
    field: 'THE LIBRARY LAYER DOES NOTHING: typ is ignored other than being passed through'
    verb: 'none'
    actor: 'implementation'
    locator: '§2'
    text: 'The "typ" (type) header parameter is ignored by COSE implementations (libraries implementing [RFC9052] and this specification), other than being passed through to applications using those implementations.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9596#R-0013'
    object: 'the application'
    field: 'ALL processing of typ is the application''s, under application-specific rules'
    verb: 'none'
    actor: 'application'
    locator: '§2'
    text: 'Any processing of this parameter is performed by the COSE application using application-specific processing rules.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-9596#R-0014'
    object: 'the application'
    field: 'the worked example of a check - and it is illustrative, not required'
    verb: 'none'
    actor: 'application'
    locator: '§2'
    text: 'For instance, an application might verify that the "typ" value is a particular application-chosen media type and reject the data structure if it is not.'
    kind: inferred
    testable: 'no'
    status: active
  - id: 'rfc-9596#R-0015'
    object: 'typ parameter'
    field: 'PLACEMENT: it must not be present in unprotected headers'
    verb: 'MUST NOT'
    actor: 'producer'
    locator: '§2'
    text: 'The "typ" parameter MUST NOT be present in unprotected headers.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'THE ONLY OBLIGATION IN THE DOCUMENT, and it is the one that makes the mechanism worth having: RFC 9052 §4.4''s Sig_structure is [context, body_protected, external_aad, payload], so forcing typ out of the unprotected bucket puts it INSIDE the signature. Contrast rfc-9597 §2, which only RECOMMENDS protected placement for label 15 - an asymmetry of strength, not an incompatibility.'
  - id: 'rfc-9596#R-0016'
    object: 'typ parameter'
    field: 'SCOPE LIMIT: it does not describe the content of unprotected headers, and changing an unprotected header does not change the object''s type'
    verb: 'none'
    actor: 'application'
    locator: '§2'
    text: 'The "typ" parameter does not describe the content of unprotected headers. Changes to unprotected headers do not change the type of the COSE object.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'AND rfc-9597 §2 PERMITS ITS CLAIMS TO SIT IN EXACTLY THAT BUCKET, while rfc-9597 §1 names typ as its RECOMMENDED disambiguator. So when a producer takes the permitted unprotected placement, the recommended disambiguator is declared, by its own text, not to describe it. rfc-9597 §1''s MUST NOT closes the hole - but only for an implementer who joins three sentences across two documents published the same month by an overlapping author set.'
  - id: 'rfc-9596#R-0017'
    object: 'explicit typing of COSE objects'
    field: 'the security case, by reference: it is equivalent to RFC 8725 §3.11''s, and explicit typing can prevent confusion between kinds of COSE object'
    verb: 'none'
    actor: 'reader'
    locator: '§3'
    text: 'The case for explicit typing of COSE objects is equivalent to the case made for explicit typing in Section 3.11 of [RFC8725]: Explicit typing can prevent confusion between different kinds of COSE objects.'
    kind: inferred
    testable: 'no'
    status: active
    note: 'THE WHOLE SUBSTANCE OF §3. The document reproduces none of RFC 8725''s argument, and RFC 8725 is not in this library.'
  - id: 'rfc-9596#R-0018'
    object: 'COSE application employing explicit typing'
    field: 'REJECT RULE 1, LOWERCASE: reject objects whose typ value differs from what the application expects'
    verb: 'none'
    actor: 'application'
    locator: '§3'
    text: 'COSE applications employing explicit typing should reject COSE objects with a type header parameter value different than values that they expect in that application context.'
    kind: inferred
    testable: 'partial'
    status: active
    note: 'Lowercase ''should reject'', so under §1.1''s ''when, and only when, they appear in all capitals'' it carries no normative force. ''Different'' is undefined, which is the equality hazard again.'
  - id: 'rfc-9596#R-0019'
    object: 'COSE application employing explicit typing'
    field: 'REJECT RULE 2, LOWERCASE: reject objects with NO typ when one is expected'
    verb: 'none'
    actor: 'application'
    locator: '§3'
    text: 'They should also reject COSE objects without a type header parameter when one is expected.'
    kind: inferred
    testable: 'partial'
    status: active
    note: 'The absence case, and also lowercase. Between them these two sentences are the entire enforcement side of the mechanism, and NEITHER BINDS ANYBODY under the document''s own terms. A conformant implementation performs no check whatsoever.'
  - id: 'rfc-9596#R-0020'
    object: 'typ (type) header parameter'
    field: 'the registration: name, label 16, value type uint / tstr, value registry, description and reference'
    verb: 'none'
    actor: 'IANA'
    locator: '§4.1, Table 1'
    text: '|typ |16 |uint /| [CoAP.ContentFormats] |Content |Section 2| |(type)| |tstr | or [MediaTypes] |type of the|of RFC | | | | | registry |complete |9596 | | | | | |COSE object| |'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Label 16. Value Registry: [CoAP.ContentFormats] or [MediaTypes] - TWO global registries for one parameter, which is both the equality hazard (one type, two spellings) and the ARCH-0002 P1 cut.'
  - id: 'rfc-9596#R-0021'
    object: 'IANA'
    field: 'the registration has been performed in the COSE Header Parameters registry'
    verb: 'none'
    actor: 'IANA'
    locator: '§4.1'
    text: 'IANA has registered the following value in the IANA "COSE Header Parameters" registry [COSE.HeaderParameters].'
    kind: inferred
    testable: 'yes'
    status: active
