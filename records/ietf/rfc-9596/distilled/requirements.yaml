reconciliation: >-
  THE COUNTS AGREE AT 3, and the number itself is this record's central
  finding, so the reconciliation is about what 3 MEANS rather than about
  arithmetic.

  THE THREE, by source line: L112 (OPTIONAL - "Use of this header parameter is
  OPTIONAL."), L119 (MAY - "Content type values have a media type name
  [MediaTypes] and MAY include media type parameters."), L130 (MUST NOT - "The
  "typ" parameter MUST NOT be present in unprotected headers."). ALL THREE ARE
  IN §2. §1, §1.1's body, §3, §4 and §5 contain NONE.

  THERE IS NO MUST, NO SHOULD, NO SHALL AND NO RECOMMENDED ANYWHERE IN THE
  DOCUMENT. Not one of the three keywords REQUIRES anything: one makes the
  parameter's use optional, one permits media type parameters, and one forbids
  a placement. SO A CONFORMANT IMPLEMENTATION OF RFC 9596 PERFORMS NO CHECK
  WHATSOEVER - and that is the document's design, stated by it twice. §2: "The
  "typ" (type) header parameter is ignored by COSE implementations (libraries
  implementing [RFC9052] and this specification), other than being passed
  through to applications using those implementations." And §3's two reject
  rules, which are the entire enforcement side of the mechanism, are LOWER CASE:
  "COSE applications employing explicit typing should reject COSE objects with a
  type header parameter value different than values that they expect in that
  application context. They should also reject COSE objects without a type
  header parameter when one is expected." §1.1 restricts normative force to
  keywords "when, and only when, they appear in all capitals, as shown here."

  THE ONE OBLIGATION IS A PROHIBITION, AND IT IS WHAT MAKES THE MECHANISM WORTH
  HAVING. §2's MUST NOT forces typ out of the unprotected bucket, and RFC 9052
  §4.4's Sig_structure is [context, body_protected, external_aad, payload] - so
  typ is INSIDE the signature. The sibling rfc-8392 extraction in this same pass
  demonstrated that boundary rather than reading it, by verifying RFC 8392's A.3
  signature from exactly those four fields.

  WHAT WAS COUNTED INSTEAD, since 3 keywords do not describe the document: §1's
  gap statement, its imported RFC 8725 argument and its statement of the VALUE
  SPACE (which is where the ARCH-0002 P1 cut lives, not in §2); §2's eight
  sentences, including the two that say the library layer does nothing and the
  two that say what typ does NOT describe; §3's reference-only security case and
  its two lower-case reject rules, each as its own entry because each is
  separately testable if we promote it; and §4.1's Table 1 registration with its
  TWO value registries.

  WHAT WAS DELIBERATELY NOT COUNTED: §1.1's BCP 14 recital at source lines
  95-99. It recites all eleven keywords and constrains nothing; bin/validate
  recounts these texts with boilerplate stripping OFF, so quoting it would add
  11 phantom keywords and make the extraction read 14 against a source of 3. It
  is quoted in normative.md, which nothing counts - and it is also the sentence
  that disarms §3, so normative.md says so where it quotes it.

  LOWER-CASE FORCE WORDS, each recorded as kind: inferred with the phrase named
  in `field` rather than promoted: §3's "should reject" (twice), §2's "is
  ignored by COSE implementations", "Any processing of this parameter is
  performed by the COSE application", "It will typically not be used", and §1's
  "which recommends its use".

  TWO LINE-BREAK SEVERANCES, DECLARED NOT HEALED - AND THEY ARE NOT THE SAME
  KIND. The plain-text wrap cuts the registry name "CoAP Content-Formats" in
  two at lines 85/86 and again at 116/117, and ONLY THE SECOND CUTS AT THE
  HYPHEN. Line 85 ends `the "CoAP` and line 86 begins `Content-Formats"`, so
  that break falls at the SPACE and the hyphen is intact on one line; joining
  it with a single space is ordinary whitespace normalisation, not a heal.
  Line 116 ends `the "CoAP Content-` and line 117 begins `Formats"`, so that
  one is a true hyphenation break. R-0010 carries that flowed span, so the
  hyphen appears as "CoAP Content- Formats" after whitespace normalisation
  rather than being silently repaired; R-0004 spans the 85/86 break and reads
  "CoAP Content-Formats" because that is what the source says across the space.
  normative.md's fences carry the byte-exact lines for both.

  [correction 2026-10-20, pass 2 - verify] This paragraph said the breaks fall
  at "lines 86/87 and again at 116/117, hyphen and all". BOTH halves of that
  were wrong for the first break: it is at 85/86, not 86/87, and it cuts at a
  space, not at a hyphen. Re-derived by reading the cache line by line. The
  second break, 116/117, was correct. The DATA was right everywhere in this
  record - R-0004 and R-0010 both carry exactly what the source prints, and all
  11 normative.md regions and all 5 schema regions reproduce byte for byte -
  so only the description of the breaks was defective. It was repeated in eight
  places across six files; each is corrected. NOTHING IS WELDED and nothing is
  healed: this is the defect class the lane's own quote audit caught twice in
  its prose.

  TEXT NORMALISATION, DECLARED: `text` is the source's own wording with
  whitespace normalised - line breaks and the RFC's double sentence spacing
  become single spaces. Every one of the 21 texts was cut from
  .cache/rfc-9596.txt by line range by script, never retyped, and then VERIFIED
  mechanically as a contiguous substring of the whitespace-normalised source:
  21 of 21, zero failures.

  NO PAGE DECORATION EXISTS. Unpaginated RFC v3 rendering, zero form feeds, no
  running footers, so no region removes anything and no line number here can be
  shifted by splitlines(). Contrast rfc-8392 in the same lane, which has 25 of
  each.
