implementations:
  open_source:
    - name: GnuPG
      url: https://gnupg.org/
      language: c
      note: "Emits and understands trust signatures via the key editor commands tsign / tlsign. Supports exactly one shape of Regular Expression subpacket in practice, and dev.gnupg.org T6238 records that the domain restriction does not work when a key has only an email address with no name part."
    - name: Sequoia PGP
      url: https://sequoia-pgp.org/
      language: rust
      note: "sq pki link authorize / sq pki vouch authorize expose scoped trusted introducers, including constraining which User IDs a delegate may vouch for by regular expression. Interoperable with GnuPG on the wire."
    - name: OpenPGP.js
      url: https://openpgpjs.org/
      language: javascript
      note: "Proton-maintained; one of the implementations behind the v6 key work in this RFC."
    - name: rpgp
      url: https://github.com/rpgp/rpgp
      language: rust
      note: "Independent Rust implementation."
    - name: Ribose RNP
      url: https://www.rnpgp.org/
      language: cpp
      note: "Also the home of sexpp, the S-expression processor named in RFC 9804 Appendix A."
  commercial: []
  searched: "2026-10-08"
usefulness:
  verdict: useful
  reason: "The only record in this lane whose delegation mechanism is both a distinct subpacket and name-scoped by expression, and the only one that chose INTEGER delegation depth — the option RFC 2693 considered and rejected. R-I-04 names OpenPGP identity signatures explicitly, so the import mapping needs this document."
  assessed: "2026-10-08"
