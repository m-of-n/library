schema: "library-requirements/v1"
record: rfc-9580
source_version: "RFC 9580"
source_digest: "36540e57b63d24c0b17be0748b704bdeed3d643ce99a4fb1abb6469c1eb1ff18"
source_keyword_count: 365
extracted_keyword_count: 359
reconciliation: "bin/bcp14-count on .cache/rfc-9580.txt finds 365 BCP 14 keywords once the section 1.1 RFC 2119 / RFC 8174 paragraph is stripped: MUST 126, MUST NOT 87, SHOULD 71, SHOULD NOT 24, MAY 46, RECOMMENDED 7, REQUIRED 2, NOT RECOMMENDED 1, SHALL NOT 1. The 421 entry texts carry 359, and agree with the source keyword for keyword except MUST (122 against 126), MAY (45 against 46) and SHOULD (70 against 71). The 6 not extracted are not requirements of this document: line 4775 (section 9.1) MUST in 'has only DSA (17) and Elgamal (16) as the algorithms that MUST be implemented', and line 6082 (section 12.2) MUST in 'have TripleDES as the only algorithm that MUST be implemented', both report what RFC 4880 required; line 6848 (section 14) quotes the word in 'this is not a \"MUST\" feature', a mention; line 9072 (Appendix C) MUST and MAY in the erratum title 'Simple hash MUST/MAY clarification'; line 9074 (Appendix C) SHOULD in the erratum title 'Native line endings SHOULD clarification'. Each is kept in normative.md. The section 1.1 paragraph itself is normative.md N-001. One counting artefact: the Table 3 row for Packet Type ID 0 (lines 1154-1156) breaks 'MUST NOT' across two table-cell lines, so the counter reads it as MUST in the source and in R-0034 alike; R-0034 is verb MUST NOT. 85 entries are verb none: binding lowercase text (field and subpacket definitions, trust-signature levels and amounts, regular-expression scoping, revocation semantics, hashing steps, PKCS#1 and EdDSA steps, armor and dash-escaping rules), each a verbatim source text and therefore kind stated."
reviewed_by: ""
note: >
  Ids are stable and never reused. Cite as rfc-9580#R-NNNN.
  Entries are in source order. Pass 1 extracted five slices in parallel,
  lines 1-1463 (R-0001 to R-0042), 1464-2887 (R-0043 to R-0180), 2888-4238
  (R-0181 to R-0239), 4239-5946 (R-0240 to R-0362) and 5947-9138 (R-0363 to
  R-0421), and the merge renumbered them without reordering. Every text is a
  verbatim run of the source with the RFC line wrapping undone: a source line
  break and the indent that follows it become a single space, two spaces after
  a full stop inside a line are kept, and a word hyphenated at a line end is
  rejoined with no space. Table-row texts keep the source's | cell borders.
  Several texts are identical because the source repeats itself (the PKCS#1
  re-encoding paragraphs of 5.1.3 and 5.1.4, 'Such a packet MUST be ignored
  when received.' in 5.8 and 5.14, 'Implementations MAY implement any other
  algorithm.' in 9.1, 9.3 and 9.4, the SHOULD-be-critical sentences of
  5.2.3); each is a separate source position. verbs lists every keyword of a
  sentence that carries more than one; verb is the dominant one. Lowercase
  coverage is uneven by slice in pass 1: section 5.2, sections 6-12 carry
  verb none entries, while the lowercase rules of 1-5.1, 5.3-5.14 and 13-15
  are in normative.md only.

requirements:
  - id: "rfc-9580#R-0001"
    object: 'OpenPGP implementation'
    field: 'support for compression of data'
    verb: MAY
    actor: 'implementations'
    locator: '§2.3'
    text: 'An OpenPGP implementation MAY support the compression of data.'
    kind: stated
    testable: no
    testable_reason: 'permission; an implementation conforms whether or not it supports compression'
    status: active
  - id: "rfc-9580#R-0002"
    object: 'OpenPGP implementation'
    field: 'support for base64 (ASCII Armor) conversions'
    verb: SHOULD
    actor: 'implementations'
    locator: '§2.4'
    text: 'Implementations SHOULD support base64 conversions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0003"
    object: 'MPI in a v6 Key, Signature or PKESK packet'
    field: 'encoded bit length equals the length from the most significant non-zero bit; mismatch rejects the packet as malformed'
    verb: MUST
    actor: 'parsing implementation'
    locator: '§3.2'
    text: 'When parsing an MPI in a version 6 Key, Signature, or Public Key Encrypted Session Key (PKESK) packet, the implementation MUST check that the encoded length matches the length starting from the most significant non-zero bit; if it doesn''t match, reject the packet as malformed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0004"
    object: 'MPI'
    field: 'unused bits are zero'
    verb: MUST
    actor: 'generating implementation'
    locator: '§3.2'
    text: 'Unused bits of an MPI MUST be zero.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0005"
    object: 'Key ID'
    field: 'not assumed unique'
    verb: SHOULD NOT
    actor: 'implementations'
    locator: '§3.3'
    text: 'Implementations SHOULD NOT assume that Key IDs are unique.'
    kind: stated
    testable: partial
    testable_reason: 'testable by presenting two keys with colliding Key IDs and checking the implementation distinguishes them; the absence of an assumption is not directly observable'
    status: active
  - id: "rfc-9580#R-0006"
    object: 'S2K Specifier Type'
    field: 'types without "Yes" in the Generate? column (Simple, Reserved 2, Salted, Private/Experimental) are read-only'
    verb: SHOULD NOT
    actor: 'generating implementation'
    locator: '§3.7.1'
    text: 'If "Yes" is not present in the "Generate?" column, the S2K entry is used only for reading in backward-compatibility mode and SHOULD NOT be used to generate new output.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0007"
    object: 'Argon2 S2K salt'
    field: 'uniqueness per passphrase'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§3.7.1.4'
    text: 'The salt SHOULD be unique for each passphrase.'
    kind: stated
    testable: partial
    testable_reason: 'salt freshness is observable across repeated generations (no repeats); uniqueness across all passphrases is not provable'
    status: active
  - id: "rfc-9580#R-0008"
    object: 'Argon2 S2K Specifier'
    field: 'number of passes t and degree of parallelism p are non-zero'
    verb: MUST
    actor: 'generating implementation'
    locator: '§3.7.1.4'
    text: 'The number of passes t and the degree of parallelism p MUST be non-zero.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0009"
    object: 'Argon2 S2K Specifier'
    field: 'encoded_m in the range 3+ceil(log_2(p)) to 31'
    verb: MUST
    actor: 'generating implementation'
    locator: '§3.7.1.4'
    text: 'The encoded memory size MUST be a value from 3+ceil(log_2(p)) to 31, such that the decoded memory size m is a value from 8*p to 2^31.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0010"
    object: 'Argon2 memory size m'
    field: 'rounding a non-power-of-2 recommended m up to the next power of 2 when performance allows, otherwise down'
    verb: RECOMMENDED
    actor: 'generating implementation'
    locator: '§3.7.1.4'
    text: 'If the recommended value of m for a given application is not a power of 2, it is RECOMMENDED to round up to the next power of 2 if the resulting performance would be acceptable; otherwise, round down (keeping in mind that m must be at least 8*p).'
    kind: stated
    testable: no
    testable_reason: 'depends on an application-specific judgement of acceptable performance; only the result m being a power of 2 at least 8*p is observable'
    status: active
  - id: "rfc-9580#R-0011"
    object: 'S2K Specifier generation'
    field: 'Simple S2K (type 0) not used'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§3.7.2'
    text: 'Therefore, when generating an S2K Specifier, an implementation MUST NOT use Simple S2K.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0012"
    object: 'S2K Specifier generation'
    field: 'Salted S2K (type 1) only for input strings known to be high entropy'
    verb: SHOULD NOT
    actor: 'generating implementation'
    locator: '§3.7.2'
    text: 'Furthermore, an implementation SHOULD NOT generate a Salted S2K unless the implementation knows that the input string is high entropy (for example, it generated the string itself using a known good source of randomness).'
    kind: stated
    testable: partial
    testable_reason: 'emission of Salted S2K for a user-supplied passphrase is observable; whether the implementation knew the string to be high entropy is not'
    status: active
  - id: "rfc-9580#R-0013"
    object: 'S2K Specifier generation'
    field: 'Argon2 (type 4) as the S2K method'
    verb: RECOMMENDED
    actor: 'implementations'
    locator: '§3.7.2'
    text: 'It is RECOMMENDED that implementations use Argon2.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0014"
    object: 'S2K Specifier generation'
    field: 'Iterated and Salted S2K (type 3) as fallback when Argon2 is unavailable, with high octet count and strong passphrase'
    verb: MAY
    actor: 'implementations'
    locator: '§3.7.2'
    text: 'If Argon2 is not available, Iterated and Salted S2K MAY be used if care is taken to use a high octet count and a strong passphrase.'
    kind: stated
    testable: partial
    testable_reason: 'the coded octet count is observable; "high" and "strong passphrase" are not defined thresholds'
