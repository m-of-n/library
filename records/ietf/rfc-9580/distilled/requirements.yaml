    verb: MAY
    actor: 'decrypting implementation'
    locator: '§9.3'
    text: 'Implementations MAY decrypt data that uses IDEA, TripleDES, or CAST5 for the sake of reading older messages or new messages from implementations predating support for [RFC2440].'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0291"
    object: 'symmetric key algorithms IDEA, TripleDES, CAST5'
    field: 'deprecation warning on decryption'
    verb: SHOULD
    actor: 'decrypting implementation'
    locator: '§9.3'
    text: 'An Implementation that decrypts data using IDEA, TripleDES, or CAST5 SHOULD generate a deprecation warning about the symmetric algorithm, indicating that message confidentiality is suspect.'
    kind: stated
    testable: partial
    testable_reason: 'a warning is a user-interface effect; testable only where the implementation exposes warnings'
    status: active
  - id: "rfc-9580#R-0292"
    object: 'symmetric key algorithms'
    field: 'any other algorithm permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§9.3'
    text: 'Implementations MAY implement any other algorithm.'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0293"
    object: 'compression algorithms'
    field: 'uncompressed (0) implemented'
    verb: MUST
    actor: 'implementations'
    locator: '§9.4'
    text: 'Implementations MUST implement uncompressed data.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0294"
    object: 'compression algorithms'
    field: 'ZLIB (2) implemented'
    verb: SHOULD
    actor: 'implementations'
    locator: '§9.4'
    text: 'Implementations SHOULD implement ZLIB.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0295"
    object: 'compression algorithms'
    field: 'ZIP (1) decompression'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§9.4'
    text: 'For interoperability reasons, implementations SHOULD be able to decompress using ZIP.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0296"
    object: 'compression algorithms'
    field: 'any other algorithm permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§9.4'
    text: 'Implementations MAY implement any other algorithm.'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0297"
    object: 'hash algorithms'
    field: 'SHA2-256 implemented'
    verb: MUST
    actor: 'implementations'
    locator: '§9.5'
    text: 'Implementations MUST implement SHA2-256.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0298"
    object: 'hash algorithms'
    field: 'SHA2-384 and SHA2-512 implemented'
    verb: SHOULD
    actor: 'implementations'
    locator: '§9.5'
    text: 'Implementations SHOULD implement SHA2-384 and SHA2-512.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0299"
    object: 'hash algorithms'
    field: 'other algorithms permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§9.5'
    text: 'Implementations MAY implement other algorithms.'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0300"
    object: 'hash algorithm SHA-1'
    field: 'no messages requiring SHA-1 except v4 fingerprints for the v1 SEIPD MDC'
    verb: SHOULD NOT
    actor: 'generating implementation'
    locator: '§9.5'
    text: 'Implementations SHOULD NOT create messages that require the use of SHA-1, with the exception of computing version 4 key fingerprints for purposes of the MDC in version 1 Symmetrically Encrypted and Integrity Protected Data packets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0301"
    object: 'hash algorithms MD5, SHA-1, RIPEMD-160'
    field: 'not used to generate signatures'
    verb: MUST NOT
    actor: 'signing implementation'
    locator: '§9.5'
    text: 'Implementations MUST NOT generate signatures with MD5, SHA-1, or RIPEMD-160.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0302"
    object: 'hash algorithms MD5, SHA-1, RIPEMD-160'
    field: 'not used as the ECDH KDF hash'
    verb: MUST NOT
    actor: 'implementations'
    locator: '§9.5'
    text: 'Implementations MUST NOT use MD5, SHA-1, or RIPEMD-160 as a hash function in an ECDH KDF.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0303"
    object: 'hash algorithms MD5, SHA-1, RIPEMD-160'
    field: 'not used as the S2K KDF hash in generated packets'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§9.5'
    text: 'Implementations MUST NOT generate packets using MD5, SHA-1, or RIPEMD-160 as a hash function in an S2K KDF.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0304"
    object: 'hash algorithms MD5, SHA-1, RIPEMD-160'
    field: 'no secret decrypted via such an S2K in v6 or later packets'
    verb: MUST NOT
    actor: 'receiving implementation'
    locator: '§9.5'
    text: 'Implementations MUST NOT decrypt a secret using MD5, SHA-1, or RIPEMD-160 as a hash function in an S2K KDF in a version 6 (or later) packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0305"
    object: 'hash algorithms MD5, SHA-1, RIPEMD-160'
    field: 'recent signatures depending on them not validated'
    verb: MUST NOT
    actor: 'verifier'
    locator: '§9.5'
    text: 'Implementations MUST NOT validate any recent signature that depends on MD5, SHA-1, or RIPEMD-160.'
    kind: stated
    testable: partial
    testable_reason: '"recent" is not defined; testable for signatures created after the known weakness'
    status: active
  - id: "rfc-9580#R-0306"
    object: 'hash algorithms MD5, SHA-1, RIPEMD-160'
    field: 'old signatures validated only if they predate the weakness and custody is assured'
    verb: SHOULD NOT
    actor: 'verifier'
    locator: '§9.5'
    text: 'Implementations SHOULD NOT validate any old signature that depends on MD5, SHA-1, or RIPEMD-160 unless the signature''s creation date predates known weakness of the algorithm used, and the implementation is confident that the message has been in the secure custody of the user the whole time.'
    kind: stated
    testable: partial
    testable_reason: '"confident" of secure custody is not observable; the creation-date condition is testable'
    status: active
  - id: "rfc-9580#R-0307"
    object: 'AEAD algorithms'
    field: 'OCB (2) implemented'
    verb: MUST
    actor: 'implementations'
    locator: '§9.6'
    text: 'Implementations MUST implement OCB.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0308"
    object: 'AEAD algorithms'
    field: 'EAX, GCM and others permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§9.6'
    text: 'Implementations MAY implement EAX, GCM, and other algorithms.'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0309"
    object: 'packet sequences'
    field: 'unknown critical or known-unexpected packet invalidates the sequence; unknown non-critical packets allowed anywhere'
    verb: none
    actor: 'receiving implementation'
    locator: '§10'
    text: 'The presence of an unknown critical packet, or a known but unexpected packet, is a critical error, invalidating the entire sequence (see Section 4.3).  On the other hand, unknown non-critical packets can appear anywhere within any sequence.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0310"
    object: 'packet sequence generation'
    field: 'no critical packet of a type outside the grammar'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§10'
    text: 'When generating a sequence of OpenPGP packets according to one of the three grammars, an implementation MUST NOT inject a critical packet of a type that does not adhere to the grammar.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0311"
    object: 'packet sequence consumption'
    field: 'sequence with a critical packet of an inappropriate type rejected'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§10'
    text: 'When consuming a sequence of OpenPGP packets, if an implementation encounters a critical packet of an inappropriate type according to the relevant grammar, the implementation MUST reject the sequence with an error.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0312"
    object: 'v6 certificate subkeys'
    field: 'every subkey is version 6'
    verb: MUST
    actor: 'key generator; certificate validator'
    locator: '§10.1.1'
    text: 'Every subkey for a version 6 primary key MUST be a version 6 subkey.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0313"
    object: 'v6 certificate subkeys'
    field: 'at least one Subkey Binding signature per subkey'
    verb: MUST
    actor: 'key generator; certificate validator'
    locator: '§10.1.1'
    text: 'Every subkey MUST have at least one Subkey Binding signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0314"
    object: 'v6 certificate Subkey Binding signature'
    field: 'made by the v6 primary key (self-signature)'
    verb: MUST
    actor: 'key generator; certificate validator'
    locator: '§10.1.1'
    text: 'Every Subkey Binding signature MUST be a self-signature (that is, made by the version 6 primary key).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0315"
    object: 'self-signatures by a v6 key'
    field: 'version 6 signature'
    verb: MUST
    actor: 'signer'
    locator: '§10.1.1'
    text: 'Like all other signatures, every self-signature made by a version 6 key MUST be a version 6 signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0316"
    object: 'v4 certificate Subkey Binding signatures'
    field: 'version 4 format'
    verb: SHOULD
    actor: 'signer'
    locator: '§10.1.3'
    text: 'These binding signatures may be in either version 3 or version 4 format, but they SHOULD be in version 4 format.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0317"
    object: 'v4 certificate signing-capable subkeys'
    field: 'v4 binding signature (for the embedded Primary Key Binding signature)'
    verb: MUST
    verbs:
      - MUST
      - REQUIRED
    actor: 'key generator; certificate validator'
    locator: '§10.1.3'
    text: 'Subkeys that can issue signatures MUST have a version 4 binding signature due to the REQUIRED embedded Primary Key Binding signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0318"
    object: 'v4 certificate subkeys'
    field: 'every subkey is version 4'
    verb: MUST
    actor: 'key generator; certificate validator'
    locator: '§10.1.3'
    text: 'Every subkey for a version 4 primary key MUST be a version 4 subkey.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0319"
    object: 'v6 revocation certificate'
    field: 'includes the primary key packet'
    verb: MUST
    actor: 'generating implementation'
    locator: '§10.1.3'
    text: 'Instead, a version 6 revocation certificate MUST include the primary key packet, as described in Section 10.1.2.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0320"
    object: 'version 3 keys'
    field: 'no new keys generated; existing ones may be used'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MAY
    actor: 'implementations'
    locator: '§10.1.4'
    text: 'Implementations MUST NOT generate new version 3 keys but MAY continue to use existing ones.'
    kind: stated
    testable: partial
    testable_reason: 'non-generation is testable; the permission to use existing keys is not'
    status: active
  - id: "rfc-9580#R-0321"
    object: 'version 3 keys'
    field: 'no subkeys'
    verb: MUST NOT
    actor: 'key generator; certificate validator'
    locator: '§10.1.4'
    text: 'Version 3 keys MUST NOT have subkeys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0322"
    object: 'Transferable Public Key'
    field: 'Public Key packet first'
    verb: none
    actor: 'key generator; certificate validator'
    locator: '§10.1.5'
    text: 'The Public Key packet occurs first.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0323"
    object: 'Transferable Public Key primary key'
    field: 'signature-capable algorithm'
    verb: MUST
    actor: 'key generator; certificate validator'
    locator: '§10.1.5'
    text: 'The primary key MUST be an algorithm capable of making signatures (that is, not an encryption-only algorithm).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0324"
    object: 'Transferable Public Key'
    field: 'at least one User ID packet'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§10.1.5'
    text: 'A Transferable Public Key SHOULD include at least one User ID packet unless storage requirements prohibit this.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0325"
    object: 'Transferable Public Key Subkey packet'
    field: 'followed by one Signature packet (should be a Subkey Binding signature by the top-level key)'
    verb: MUST
    actor: 'key generator; certificate validator'
    locator: '§10.1.5'
    text: 'Each Subkey packet MUST be followed by one Signature packet, which should be a Subkey Binding signature issued by the top-level key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0326"
    object: 'Subkey Binding signature of a signing-capable subkey'
    field: 'Embedded Signature subpacket with a Primary Key Binding signature (0x19) by the subkey'
    verb: MUST
    actor: 'key generator; certificate validator'
    locator: '§10.1.5'
    text: 'For subkeys that can issue signatures, the Subkey Binding signature MUST contain an Embedded Signature subpacket with a Primary Key Binding signature (Type ID 0x19) issued by the subkey on the top-level key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0327"
    object: 'Padding packet in a v4 Transferable Public Key'
    field: 'absent unless the recipient can ignore it'
    verb: SHOULD NOT
    actor: 'generating implementation'
    locator: '§10.1.5'
    text: 'For maximum interoperability, if the Public Key packet is a version 4 key, the optional Padding packet SHOULD NOT be present unless the recipient has indicated that they are capable of ignoring it successfully.'
    kind: stated
    testable: partial
    testable_reason: 'recipient capability signalling is out of band; presence of Padding in v4 output is testable'
    status: active
  - id: "rfc-9580#R-0328"
    object: 'Padding packet in a v6 Transferable Public Key'
    field: 'accepted and ignored'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§10.1.5'
    text: 'An implementation that is capable of receiving a Transferable Public Key with a version 6 Public Key primary key MUST be able to accept (and ignore) the trailing optional Padding packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0329"
    object: 'Transferable Secret Key'
    field: 'self-signatures on User IDs and subkeys included'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§10.2'
    text: 'An implementation SHOULD include self-signatures on any User IDs and subkeys, as this allows for a complete public key to be automatically extracted from the Transferable Secret Key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0330"
    object: 'Transferable Secret Key'
    field: 'omitting self-signatures permitted'
    verb: MAY
    actor: 'generating implementation'
    locator: '§10.2'
    text: 'An implementation MAY choose to omit the self-signatures, especially if a Transferable Public Key accompanies the Transferable Secret Key.'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation on the generator'
    status: active
  - id: "rfc-9580#R-0331"
    object: 'unwrapping a v2 SEIPD packet'
    field: 'decrypted content is a valid Optionally Padded Message'
    verb: MUST
    actor: 'generating implementation; receiving implementation (validation)'
    locator: '§10.3.1'
    text: 'Decrypting a version 2 Symmetrically Encrypted and Integrity Protected Data packet MUST yield a valid Optionally Padded Message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0332"
    object: 'unwrapping a v1 SEIPD or SED packet'
    field: 'decrypted content is a valid OpenPGP Message'
    verb: MUST
    actor: 'generating implementation; receiving implementation (validation)'
    locator: '§10.3.1'
    text: 'Decrypting a version 1 Symmetrically Encrypted and Integrity Protected Data packet or -- for historic data -- a Symmetrically Encrypted Data packet MUST yield a valid OpenPGP Message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0333"
    object: 'unwrapping a Compressed Data packet'
    field: 'decompressed content is a valid OpenPGP Message'
    verb: MUST
    actor: 'generating implementation; receiving implementation (validation)'
    locator: '§10.3.1'
    text: 'Decompressing a Compressed Data packet MUST also yield a valid OpenPGP Message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0334"
    object: 'unwrapped octet stream'
    field: 'no octets beyond its boundaries interpreted as packet data'
    verb: MUST NOT
    actor: 'receiving implementation'
    locator: '§10.3.1'
    text: 'An implementation MUST NOT interpret octets beyond the boundaries of the unwrapped octet stream as part of any OpenPGP packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0335"
    object: 'unwrapped octet stream'
    field: 'packet whose header length overruns the stream rejected as malformed'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§10.3.1'
    text: 'If an implementation encounters a packet whose header length indicates that it would extend beyond the boundaries of the unwrapped octet stream, the implementation MUST reject that packet as malformed and unusable.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0336"
    object: 'SED packet (Section 5.7)'
    field: 'never generated'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§10.3.2.1'
    text: 'In some historic data, the payload may be a deprecated SED packet (Section 5.7) instead of SEIPD, though implementations MUST NOT generate SED packets (see Section 13.7).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0337"
    object: 'Encrypted Message ESK packets'
    field: 'versions aligned with the SEIPD payload version'
    verb: MUST
    actor: 'generating implementation'
    locator: '§10.3.2.1'
    text: 'The versions of the preceding ESK packets within an Encrypted Message MUST align with the version of the payload SEIPD packet, as described in this section.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0338"
    object: 'ESK packets preceding a v1 SEIPD'
    field: 'v3 PKESK or v4 SKESK only'
    verb: MUST
    actor: 'generating implementation'
    locator: '§10.3.2.1'
    text: 'Since a v1 SEIPD does not contain a symmetric algorithm ID, all ESK packets preceding a v1 SEIPD payload MUST be either v3 PKESK or v4 SKESK.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0339"
    object: 'payload following a v6 PKESK or v6 SKESK'
    field: 'v2 SEIPD'
    verb: MUST
    actor: 'generating implementation'
    locator: '§10.3.2.1'
    text: 'The payload following any v6 PKESK or v6 SKESK packet MUST be a v2 SEIPD.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0340"
    object: 'v2 SEIPD payload'
    field: 'not preceded by v3 PKESK or v4 SKESK'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§10.3.2.1'
    text: 'Additionally, to avoid potentially conflicting cipher algorithm IDs, and for simplicity, implementations MUST NOT precede a v2 SEIPD payload with either v3 PKESK or v4 SKESK packets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0341"
    object: 'Encrypted Message packet versions'
    field: 'only rows of Table 26 with Generate? = Yes'
    verb: MUST
    actor: 'generating implementation'
    locator: '§10.3.2.1'
    text: 'An implementation MUST only generate an Encrypted Message using packet versions that match a row with "Yes" in the "Generate?" column.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0342"
    object: 'Encrypted Message packet versions'
    field: 'all packets correspond to a single row of Table 26'
    verb: MUST
    actor: 'generating implementation'
    locator: '§10.3.2.1'
    text: 'A conforming implementation MUST only generate an Encrypted Message using packets whose versions correspond to a single row.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0343"
    object: 'Encrypted Message processing'
    field: 'ESK packets misaligned with the payload version discarded'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§10.3.2.1'
    text: 'An implementation processing an Encrypted Message MUST discard any preceding ESK packet with a version that does not align with the version of the payload.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0344"
    object: 'Signature packets made by a v6 key'
    field: 'version 6 regardless of signature type'
    verb: MUST
    actor: 'signer'
    locator: '§10.3.2.2'
    text: 'When a version 6 key produces a Signature packet, it MUST produce a version 6 Signature packet, regardless of the Signature packet type.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0345"
    object: 'One-Pass Signature packet'
    field: 'version aligned with key and signature versions (Table 27)'
    verb: none
    actor: 'signer'
    locator: '§10.3.2.2'
    text: 'When a message is signed or verified using the one-pass construction, the version of the One-Pass Signature packet (Section 5.4) should also be aligned to the other versions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0346"
    object: 'Signature packet versions'
    field: 'only rows of Table 27 with Generate? = Yes'
    verb: MUST
    actor: 'signer'
    locator: '§10.3.2.2'
    text: 'A conforming implementation MUST only generate Signature packets with version numbers matching rows with "Yes" in the "Generate?" column.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0347"
    object: 'signature with an unknown version'
    field: 'discarded; the packet sequence remains valid'
    verb: SHOULD
    actor: 'verifier'
    locator: '§10.3.2.2'
    text: 'Note, however, that a version mismatch between these packets does not invalidate the packet sequence as a whole; it merely invalidates the signature, as a signature with an unknown version SHOULD be discarded (see Section 5.2.5).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0348"
    object: 'ECC methods'
    field: 'not used with version 3 keys'
    verb: none
    actor: 'implementations'
    locator: '§11'
    text: 'None of the ECC methods described in this document are allowed with deprecated version 3 keys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0349"
    object: 'SEC1 point coordinates'
    field: 'big-endian, zero-padded to the adjusted field size (fsize)'
    verb: none
    actor: 'implementations'
    locator: '§11.2.1'
    text: 'where x and y are coordinates of the point P = (x, y), and each is encoded in the big-endian format and zero-padded to the adjusted underlying field size.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0350"
    object: 'EC point at infinity (zero point)'
    field: 'never appears in OpenPGP data structures'
    verb: SHALL NOT
    actor: 'implementations (generating and receiving)'
    locator: '§11.2.3'
    text: 'Even though the zero point (also called the "point at infinity") may occur as a result of arithmetic operations on points of an elliptic curve, it SHALL NOT appear in data structures defined in this document.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0351"
    object: 'EC point wire format'
    field: 'only the format associated with the curve'
    verb: MUST NOT
    actor: 'implementations'
    locator: '§11.2.3'
    text: 'An implementation MUST NOT use a different wire format for a point other than the wire format associated with the curve.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0352"
    object: 'EC key derivation function'
    field: 'Concatenation KDF (SP 800-56A Approved Alternative 1) with SHA2-256 or stronger'
    verb: REQUIRED
    actor: 'implementations'
    locator: '§11.4'
    text: 'The Concatenation Key Derivation Function (Approved Alternative 1) [SP800-56A] with the KDF hash function that is SHA2-256 [FIPS180] or stronger is REQUIRED.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0353"
    object: 'ECDH (One-Pass Diffie-Hellman C(1, 1, ECC CDH))'
    field: 'implemented with cofactor 1, the 11.4 KDF and the 11.5 KDF parameters'
    verb: MUST
    actor: 'implementations'
    locator: '§11.5'
    text: 'The One-Pass Diffie-Hellman method C(1, 1, ECC CDH) [SP800-56A] MUST be implemented with the following restrictions: the ECC Cofactor Diffie-Hellman (CDH) primitive employed by this method is modified to always assume the cofactor is 1, the KDF specified in Section 11.4 is used, and the KDF parameters specified below are used.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0354"
    object: 'ECDH KEK algorithm'
    field: 'one of the three AES algorithms'
    verb: SHOULD
    actor: 'implementations'
    locator: '§11.5'
    text: 'Refer to Section 11.5.1 for the details regarding the choice of the KEK algorithm, which SHOULD be one of the three AES algorithms.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0355"
    object: 'ECDH key wrapping'
    field: 'RFC 3394 default initial value for wrapping and unwrapping'
    verb: none
    actor: 'implementations'
    locator: '§11.5'
    text: 'Key wrapping and unwrapping is performed with the default initial value of [RFC3394].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0356"
    object: 'ECDH session key padding (v3 PKESK)'
    field: 'size-obfuscating padding to 40 octets permitted'
    verb: MAY
    actor: 'sender'
    locator: '§11.5'
    text: 'For example, assuming that an AES algorithm is used for the session key, the sender MAY use 21, 13, and 5 octets of padding for AES-128, AES-192, and AES-256, respectively, to provide the same number of octets, 40 total, as an input to the key wrapping method.'
    kind: stated
    testable: partial
    testable_reason: 'a permission for the sender; a receiver must accept the padded forms, which is testable'
    status: active
  - id: "rfc-9580#R-0357"
    object: 'ECDH session key padding (v6 PKESK)'
    field: 'size-obfuscating padding to 40 octets permitted'
    verb: MAY
    actor: 'sender'
    locator: '§11.5'
    text: 'In this case, assuming that an AES algorithm is used for the session key, the sender MAY use 22, 14, and 6 octets of padding for AES-128, AES-192, and AES-256, respectively, to provide the same number of octets, 40 total, as an input to the key wrapping method.'
    kind: stated
    testable: partial
    testable_reason: 'a permission for the sender; a receiver must accept the padded forms, which is testable'
    status: active
  - id: "rfc-9580#R-0358"
    object: 'ECDH parameters for v6 keys'
    field: 'Table 30 KDF hash and KEK algorithm per curve'
    verb: MUST
    actor: 'implementations'
    locator: '§11.5.1'
    text: 'For version 6 keys, the following algorithms MUST be used depending on the curve.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0359"
    object: 'v6 ECDH key generation'
    field: 'no listed-curve key with KDF or KEK parameters other than Table 30'
    verb: MUST NOT
    actor: 'key generator'
    locator: '§11.5.1'
    text: 'An implementation MUST NOT generate a version 6 ECDH key over any listed curve that uses different KDF or KEK parameters.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0360"
    object: 'encryption to a v6 ECDH key'
    field: 'refused when a listed-curve key announces other KDF or KEK parameters'
    verb: MUST NOT
    actor: 'encrypting implementation'
    locator: '§11.5.1'
    text: 'An implementation MUST NOT encrypt any message to a version 6 ECDH key over a listed curve that announces a different KDF or KEK parameter.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0361"
    object: 'ECDH parameters for v4 keys'
    field: 'Table 30 KDF hash and KEK algorithm per curve'
    verb: SHOULD
    actor: 'implementations'
    locator: '§11.5.1'
    text: 'For version 4 keys, the following algorithms SHOULD be used depending on the curve.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0362"
    object: 'ECDH KEK algorithm (v4 keys)'
    field: 'AES only'
    verb: SHOULD
    actor: 'implementations'
    locator: '§11.5.1'
    text: 'An implementation SHOULD only use an AES algorithm as a KEK algorithm.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0363"
    object: 'EME-PKCS1-v1_5-ENCODE'
    field: 'step 1: length check, mLen > k - 11 fails with "message too long"'
    verb: none
    actor: 'encrypting implementation (RSA / Elgamal PKESK)'
    locator: '§12.1.1 step 1'
    text: 'Length checking: If mLen > k - 11, output "message too long" and stop.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0364"
    object: 'EME-PKCS1-v1_5-ENCODE'
    field: 'step 2: PS is k - mLen - 3 pseudorandom non-zero octets, at least 8'
    verb: none
    actor: 'encrypting implementation (RSA / Elgamal PKESK)'
    locator: '§12.1.1 step 2'
    text: 'Generate an octet string PS of length k - mLen - 3 consisting of pseudorandomly generated non-zero octets.  The length of PS will be at least 8 octets.'
    kind: stated
    testable: partial
    testable_reason: 'length and non-zero octets are checkable in a decrypted EM; pseudorandomness is not testable from one output'
    status: active
  - id: "rfc-9580#R-0365"
    object: 'EME-PKCS1-v1_5-ENCODE'
    field: 'step 3: EM = 0x00 || 0x02 || PS || 0x00 || M, length k'
    verb: none
    actor: 'encrypting implementation (RSA / Elgamal PKESK)'
    locator: '§12.1.1 step 3'
    text: 'Concatenate PS, the message M, and other padding to form an encoded message EM of length k octets as EM = 0x00 || 0x02 || PS || 0x00 || M.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0366"
    object: 'EME-PKCS1-v1_5-DECODE'
    field: 'separation of EM into PS (non-zero octets) and M'
    verb: none
    actor: 'decrypting implementation (RSA / Elgamal PKESK)'
    locator: '§12.1.2'
    text: 'To decode an EME-PKCS1_v1_5 message, separate the encoded message EM into an octet string PS consisting of non-zero octets and a message M as follows EM = 0x00 || 0x02 || PS || 0x00 || M.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0367"
    object: 'EME-PKCS1-v1_5-DECODE'
    field: 'rejection: first octet not 0x00, second not 0x02, no 0x00 separator, or PS shorter than 8 octets gives "decryption error"'
    verb: none
    actor: 'decrypting implementation (RSA / Elgamal PKESK)'
    locator: '§12.1.2'
    text: 'If the first octet of EM does not have hexadecimal value 0x00, the second octet of EM does not have hexadecimal value 0x02, there is no octet with hexadecimal value 0x00 to separate PS from M, or the length of PS is less than 8 octets, output "decryption error" and stop.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0368"
    object: 'EMSA-PKCS1-v1_5'
    field: 'step 1: H = Hash(M); hash "message too long" propagates'
    verb: none
    actor: 'RSA signer / verifier'
    locator: '§12.1.3 step 1'
    text: 'Apply the hash function to the message M to produce hash value H: H = Hash(M). If the hash function outputs "message too long," output "message too long" and stop.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0369"
    object: 'EMSA-PKCS1-v1_5'
    field: 'step 2: T = Full Hash Prefix (Table 24) || H; tLen = length of T'
    verb: none
    actor: 'RSA signer / verifier'
    locator: '§12.1.3 step 2'
    text: 'Let T be the Full Hash Prefix from Table 24 for the given hash function, concatenated with the hash digest H (representing an ASN.1 DER value for the hash function used and the hash digest). Let tLen be the length in octets of T.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0370"
    object: 'EMSA-PKCS1-v1_5'
    field: 'step 3: emLen < tLen + 11 fails with "intended encoded message length too short"'
    verb: none
    actor: 'RSA signer / verifier'
    locator: '§12.1.3 step 3'
    text: 'If emLen < tLen + 11, output "intended encoded message length too short" and stop.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0371"
    object: 'EMSA-PKCS1-v1_5'
    field: 'step 4: PS is emLen - tLen - 3 octets of 0xFF, at least 8'
    verb: none
    actor: 'RSA signer / verifier'
    locator: '§12.1.3 step 4'
    text: 'Generate an octet string PS consisting of emLen - tLen - 3 octets with hexadecimal value 0xFF.  The length of PS will be at least 8 octets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0372"
    object: 'EMSA-PKCS1-v1_5'
    field: 'step 5: EM = 0x00 || 0x01 || PS || 0x00 || T'
    verb: none
    actor: 'RSA signer / verifier'
    locator: '§12.1.3 step 5'
    text: 'Concatenate PS, the hash prefix T, and other padding to form the encoded message EM as EM = 0x00 || 0x01 || PS || 0x00 || T.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0373"
    object: 'symmetric algorithm preference list'
    field: 'AES-128 is mandatory to implement and is tacitly at the end of every list that omits it'
    verb: MUST
    actor: 'implementations'
    locator: '§12.2'
    text: 'Since AES-128 is the algorithm that MUST be implemented, if it is not explicitly in the list, it is tacitly at the end.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0374"
    object: 'symmetric algorithm selection'
    field: 'only algorithms in the recipient''s preference list'
    verb: MUST NOT
    actor: 'encrypting implementation'
    locator: '§12.2'
    text: 'An implementation MUST NOT use a symmetric algorithm that is not in the recipient''s preference list.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0375"
    object: 'symmetric algorithm selection (multiple recipients)'
    field: 'intersection of the recipients'' preferences; AES-128 mandatory to implement so the intersection is non-empty'
    verb: MUST
    actor: 'encrypting implementation'
    locator: '§12.2'
    text: 'When encrypting to more than one recipient, the implementation finds a suitable algorithm by taking the intersection of the preferences of the recipients.  Note that since the AES-128 algorithm MUST be implemented, the intersection is guaranteed to be non-empty.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0376"
    object: 'decryption with an algorithm outside the keyholder''s preferences'
    field: 'decrypt anyway (SHOULD) and warn the keyholder (MUST)'
    verb: MUST
    verbs:
      - MUST
      - SHOULD
    actor: 'decrypting implementation'
    locator: '§12.2'
    text: 'If an implementation can decrypt a message that a keyholder doesn''t have in their preferences, the implementation SHOULD decrypt the message anyway, but it MUST warn the keyholder.'
    kind: stated
    testable: partial
    testable_reason: 'decryption is testable; the warning is a user-interface obligation, observable only through the implementation''s warning or status channel'
    status: active
  - id: "rfc-9580#R-0377"
    object: 'symmetric algorithm 0 (plaintext)'
    field: 'only denotes unencrypted secret keys; never the cipher of an encrypted data packet (5.7, 5.13)'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§12.2.1'
    text: 'Algorithm 0, "plaintext", may only be used to denote secret keys that are stored in the clear.  An implementation MUST NOT use algorithm 0 as the indicated symmetric cipher for an encrypted data packet (Sections 5.7 or 5.13); it can use a Literal Data packet (Section 5.9) to encode unencrypted literal data.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0378"
    object: 'compression algorithm selection'
    field: 'only algorithms in the preference vector; Uncompressed (0) tacitly at the end'
    verb: MUST NOT
    actor: 'compressing implementation'
    locator: '§12.3.1'
    text: 'Like the algorithm preferences, an implementation MUST NOT use an algorithm that is not in the preference vector.  If Uncompressed (0) is not explicitly in the list, it is tacitly at the end.  That is, uncompressed messages may always be sent.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0379"
    object: 'Preferred Compression Algorithms subpacket'
    field: 'explicitly state a preference for uncompressed data'
    verb: SHOULD
    actor: 'key-generating implementation that prefers uncompressed data'
    locator: '§12.3.1'
    text: 'Therefore, an implementation that prefers uncompressed data SHOULD explicitly state this in the Preferred Compression Algorithms.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0380"
    object: 'compression algorithm 0 (uncompressed)'
    field: 'only denotes a preference; never the algorithm of a Compressed Data packet (5.6)'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§12.3.1.1'
    text: 'Algorithm 0, "uncompressed", may only be used to denote a preference for uncompressed data.  An implementation MUST NOT use algorithm 0 as the indicated compression algorithm in a Compressed Data packet (Section 5.6); it can use a Literal Data packet (Section 5.9) to encode uncompressed literal data.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0381"
    object: 'hash algorithm preference list'
    field: 'SHA2-256 is mandatory to implement and is tacitly at the end of every list that omits it'
    verb: MUST
    actor: 'implementations'
    locator: '§12.3.2'
    text: 'Since SHA2-256 is the hash algorithm that MUST be implemented, if it is not explicitly in the list, it is tacitly at the end.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0382"
    object: 'RSA key generation'
    field: 'do not generate RSA keys'
    verb: SHOULD NOT
    actor: 'key-generating implementation'
    locator: '§12.4'
    text: 'Therefore, an implementation SHOULD NOT generate RSA keys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0383"
    object: 'RSA Sign-Only and RSA Encrypt-Only keys (public key algorithms 2 and 3)'
    field: 'never created; may be interpreted'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MAY
    actor: 'implementations'
    locator: '§12.4'
    text: 'There are algorithm types for RSA Sign-Only and RSA Encrypt-Only keys.  These types are deprecated in favor of the Key Flags signature subpacket.  An implementation MUST NOT create such a key, but it MAY interpret it.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0384"
    object: 'RSA key generation'
    field: 'modulus size at least 3072 bits'
    verb: MUST NOT
    actor: 'key-generating implementation'
    locator: '§12.4'
    text: 'An implementation MUST NOT generate RSA keys of a size less than 3072 bits.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0385"
    object: 'RSA encrypt / sign / verify'
    field: 'keys smaller than 3072 bits not used'
    verb: SHOULD NOT
    actor: 'implementations'
    locator: '§12.4'
    text: 'An implementation SHOULD NOT encrypt, sign, or verify using RSA keys of a size less than 3072 bits.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0386"
    object: 'RSA encrypt / sign / verify'
    field: 'keys smaller than 2048 bits never used'
    verb: MUST NOT
    actor: 'implementations'
    locator: '§12.4'
    text: 'An implementation MUST NOT encrypt, sign, or verify using RSA keys of a size less than 2048 bits.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0387"
    object: 'RSA decryption with a key smaller than 3072 bits'
    field: 'deprecation warning that the key is too weak'
    verb: SHOULD
    actor: 'decrypting implementation'
    locator: '§12.4'
    text: 'An implementation that decrypts a message using an RSA secret key of a size less than 3072 bits SHOULD generate a deprecation warning that the key is too weak for modern use.'
    kind: stated
    testable: partial
    testable_reason: 'the warning is a user-interface obligation, observable only through the implementation''s warning or status channel'
    status: active
  - id: "rfc-9580#R-0388"
    object: 'DSA key generation'
    field: 'never generate DSA keys'
    verb: MUST NOT
    actor: 'key-generating implementation'
    locator: '§12.5'
    text: 'Therefore, an implementation MUST NOT generate DSA keys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0389"
    object: 'DSA signing and verification'
    field: 'never sign or verify with DSA keys'
    verb: MUST NOT
    actor: 'implementations'
    locator: '§12.5'
    text: 'An implementation MUST NOT sign or verify using DSA keys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0390"
    object: 'Elgamal key generation'
    field: 'never generate Elgamal keys'
    verb: MUST NOT
    actor: 'key-generating implementation'
    locator: '§12.6'
    text: 'Therefore, an implementation MUST NOT generate Elgamal keys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0391"
    object: 'Elgamal encryption'
    field: 'never encrypt to Elgamal keys'
    verb: MUST NOT
    actor: 'encrypting implementation'
    locator: '§12.6'
    text: 'An implementation MUST NOT encrypt using Elgamal keys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0392"
    object: 'Elgamal decryption'
    field: 'deprecation warning that the key is too weak'
    verb: SHOULD
    actor: 'decrypting implementation'
    locator: '§12.6'
    text: 'An implementation that decrypts a message using an Elgamal secret key SHOULD generate a deprecation warning that the key is too weak for modern use.'
    kind: stated
    testable: partial
    testable_reason: 'the warning is a user-interface obligation, observable only through the implementation''s warning or status channel'
    status: active
  - id: "rfc-9580#R-0393"
    object: 'EdDSA input'
    field: 'a digest of the message (pre-hashed), never the raw message'
    verb: none
    actor: 'signer / verifier (EdDSA)'
    locator: '§12.7'
    text: 'Although the EdDSA algorithm allows arbitrary data as input, its use with OpenPGP requires that a digest of the message be used as input (pre-hashed).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0394"
    object: 'EdDSA input digest'
    field: 'never truncated; used verbatim'
    verb: none
    actor: 'signer / verifier (EdDSA)'
    locator: '§12.7'
    text: 'Truncation of the resulting digest is never applied; the resulting digest value is used verbatim as input to the EdDSA algorithm.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0395"
    object: 'EdDSA variant'
    field: 'PureEdDSA over the OpenPGP signature hash'
    verb: none
    actor: 'signer / verifier (EdDSA)'
    locator: '§12.7'
    text: 'For clarity: while [RFC8032] describes different variants of EdDSA, OpenPGP uses the "pure" variant (PureEdDSA).  The hashing that happens with OpenPGP is done as part of the standard OpenPGP signature process, and that hash itself is fed as the input message to the PureEdDSA algorithm.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0396"
    object: 'Ed448 context string'
    field: 'empty string'
    verb: none
    actor: 'signer / verifier (Ed448)'
    locator: '§12.7'
    text: 'As specified in [RFC8032], Ed448 also expects a "context string".  In OpenPGP, Ed448 is used with the empty string as a context string.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0397"
    object: 'public key algorithm 20 (Elgamal sign/encrypt)'
    field: 'never generate such keys'
    verb: MUST NOT
    actor: 'key-generating implementation'
    locator: '§12.8'
    text: 'Previous versions of the OpenPGP specification permitted Elgamal [ELGAMAL] signatures with a public key algorithm ID of 20.  These are no longer permitted.  An implementation MUST NOT generate such keys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0398"
    object: 'Elgamal signatures'
    field: 'never generated'
    verb: MUST NOT
    actor: 'signer'
    locator: '§12.8'
    text: 'An implementation MUST NOT generate Elgamal signatures; see [BLEICHENBACHER].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0399"
    object: 'CFB mode'
    field: 'segment size s equals the cipher block size (n-bit CFB, SP800-38A 6.3)'
    verb: none
    actor: 'implementations'
    locator: '§12.9'
    text: 'The Cipher Feedback (CFB) mode used in this document is defined in Section 6.3 of [SP800-38A]. The CFB segment size s is equal to the block size of the cipher (i.e., n-bit CFB mode, where n is the block size used).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0400"
    object: 'non-backward-compatible extension proposal'
    field: 'explanation when the Features system is not updated'
    verb: SHOULD
    actor: 'extension proposal authors'
    locator: '§12.11'
    text: 'If an extension proposal does not update the Features system, it SHOULD include an explanation of why this is unnecessary.'
    kind: stated
    testable: no
    testable_reason: 'a constraint on specification documents, judged in review; not observable in an implementation'
    status: active
  - id: "rfc-9580#R-0401"
    object: 'extension proposal with neither a Features extension nor an explanation'
    field: 'rejection'
    verb: SHOULD
    actor: 'reviewers of extension proposals (designated experts, working group)'
    locator: '§12.11'
    text: 'If the proposal contains neither an extension to the Features system nor an explanation of why such an extension is unnecessary, the proposal SHOULD be rejected.'
    kind: stated
    testable: no
    testable_reason: 'a constraint on the review process, not on an implementation'
    status: active
  - id: "rfc-9580#R-0402"
    object: 'SHA-1 collision detection'
    field: 'optionally detect hash input from a known collision attack and reject it or modify the hash output'
    verb: MAY
    actor: 'implementations'
    locator: '§13.1'
    text: 'To avoid the risk of uncertain breakage from a maliciously introduced SHA-1 collision, an OpenPGP implementation MAY attempt to detect when a hash input is likely from a known collision attack and then either reject the hash input deliberately or modify the hash output.'
    kind: stated
    testable: partial
    testable_reason: 'permission; testable only for an implementation that claims it, e.g. against the SHAttered / Shambles collision inputs'
    status: active
  - id: "rfc-9580#R-0403"
    object: 'PKCS#1 padding checks'
    field: 'strict, robust and constant time'
    verb: SHOULD
    actor: 'decrypting implementation'
    locator: '§13.5'
    text: 'To make the attack more difficult, an implementation SHOULD implement strict, robust, and constant time padding checks.'
    kind: stated
    testable: partial
    testable_reason: 'strictness is testable with malformed-padding vectors; constant time needs timing analysis'
    status: active
  - id: "rfc-9580#R-0404"
    object: 'fingerprint presentation'
    field: 'do not promote manual transfer or comparison of full fingerprints unless no other way exists'
    verb: SHOULD NOT
    actor: 'implementations'
    locator: '§13.6'
    text: 'An OpenPGP implementation should prioritize mechanical fingerprint transfer and comparison where possible and SHOULD NOT promote manual transfer or comparison of full fingerprints by a human unless there is no other way to achieve the desired result.'
    kind: stated
    testable: partial
    testable_reason: 'a user-interface property; checkable only by inspecting the implementation''s interface'
    status: active
  - id: "rfc-9580#R-0405"
    object: 'decryption of data that appears malleable'
    field: 'clear integrity error (MUST); no parsing or release of decrypted data (SHOULD NOT); halt with error (SHOULD)'
    verb: MUST
    verbs:
      - MUST
      - SHOULD NOT
      - SHOULD
    actor: 'decrypting implementation'
    locator: '§13.7'
    text: 'When an OpenPGP implementation discovers that it is decrypting data that appears to be malleable, it MUST generate a clear error message that indicates the integrity of the message is suspect, it SHOULD NOT attempt to parse nor release decrypted data to the user, and it SHOULD halt with an error.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0406"
    object: 'AEAD decryption with a failing authentication tag'
    field: 'no parsing or release of decrypted data; halt with error'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MUST
    actor: 'decrypting implementation'
    locator: '§13.7'
    text: 'In the case of AEAD encrypted data, if the authentication tag fails to verify, the implementation MUST NOT attempt to parse nor release decrypted data to the user, and it MUST halt with an error.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0407"
    object: 'release of cleartext from malleable ciphertext'
    field: 'permitted only when not AEAD, known historic archived legacy data, and the user is aware of the risks'
    verb: MAY
    actor: 'decrypting implementation'
    locator: '§13.7'
    text: 'An implementation that encounters malleable ciphertext MAY choose to release cleartext to the user if it is not encrypted using AEAD, it is known to be dealing with historic archived legacy data, and the user is aware of the risks.'
    kind: stated
    testable: partial
    testable_reason: 'permission whose conditions (known legacy data, user awareness) are outside the data; only the not-AEAD condition is mechanically testable'
    status: active
  - id: "rfc-9580#R-0408"
    object: 'truncated AEAD message (final zero-octet chunk missing)'
    field: 'streaming release of fully authenticated chunks permitted; clear error as soon as truncation is detected'
    verb: MUST
    verbs:
      - MAY
      - MUST
    actor: 'decrypting implementation'
    locator: '§13.7'
    text: 'In the case of AEAD encrypted messages, if the message is truncated, i.e., the final zero-octet chunk and possibly (part of) some chunks before it are missing, the implementation MAY choose to release cleartext from the fully authenticated chunks before it to the user if it is operating in a streaming fashion, but it MUST indicate a clear error message as soon as the truncation is detected.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0409"
    object: 'choice of encrypted container format'
    field: 'most robust protection the intended recipients can handle'
    verb: SHOULD
    actor: 'encrypting implementation'
    locator: '§13.7'
    text: 'To avoid these circumstances, an implementation that generates OpenPGP encrypted data SHOULD select the encrypted container format with the most robust protections that can be handled by the intended recipients.'
    kind: stated
    testable: partial
    testable_reason: 'depends on what the implementation knows of the recipients'' capabilities; the concrete cases are the bulleted list that follows it (SED, v2 and v1 SEIPD, AEAD secret-key protection)'
    status: active
  - id: "rfc-9580#R-0410"
    object: 'Symmetrically Encrypted Data (SED) packet'
    field: 'never generated'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§13.7'
    text: 'The SED packet is deprecated and MUST NOT be generated.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0411"
    object: 'public-key encryption container'
    field: 'v2 SEIPD when all recipient keys signal v2 SEIPD in Features, are v6 keys without Features, or support is otherwise inferred'
    verb: SHOULD
    actor: 'encrypting implementation'
    locator: '§13.7'
    text: 'If all recipient keys indicate support for a version 2 Symmetrically Encrypted and Integrity Protected Data packet in their Features signature subpacket (Section 5.2.3.32), if all recipient keys are version 6 keys without a Features signature subpacket, or the implementation can otherwise infer that all recipients support v2 SEIPD packets, the implementation SHOULD encrypt using a v2 SEIPD packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0412"
    object: 'public-key encryption container'
    field: 'v1 SEIPD permitted when a recipient does not support v2 SEIPD'
    verb: MAY
    actor: 'encrypting implementation'
    locator: '§13.7'
    text: 'If one of the recipients does not support v2 SEIPD packets, then the message generator MAY use a v1 SEIPD packet instead.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0413"
    object: 'passphrase-protected secret key material in v6 Secret Key / Secret Subkey packets'
    field: 'AEAD protection (S2K usage octet 253) unless transferred to an implementation known not to support AEAD'
    verb: SHOULD
    actor: 'key-protecting implementation'
    locator: '§13.7'
    text: 'Passphrase-protected secret key material in a version 6 Secret Key or version 6 Secret Subkey packet SHOULD be protected with AEAD encryption (S2K usage octet 253) unless it will be transferred to an implementation that is known to not support AEAD.'
    kind: stated
    testable: partial
    testable_reason: 'the default is testable on generated keys; the exception depends on knowledge of the destination implementation'
    status: active
  - id: "rfc-9580#R-0414"
    object: 'migration to AEAD'
    field: 'users migrate to AEAD'
    verb: RECOMMENDED
    actor: 'users'
    locator: '§13.7'
    text: 'Users are RECOMMENDED to migrate to AEAD.'
    kind: stated
    testable: no
    testable_reason: 'a recommendation to users, not to an implementation'
    status: active
  - id: "rfc-9580#R-0415"
    object: 'CSPRNG'
    field: 'use an existing CSPRNG implementation rather than a new one'
    verb: RECOMMENDED
    actor: 'implementations'
    locator: '§13.10'
    text: 'It is RECOMMENDED to use an existing CSPRNG implementation as opposed to crafting a new one.'
    kind: stated
    testable: no
    testable_reason: 'a design-provenance property, not observable from output'
    status: active
  - id: "rfc-9580#R-0416"
    object: 'Intended Recipient Fingerprint subpacket (5.2.3.36)'
    field: 'implemented, to prevent surreptitious forwarding'
    verb: SHOULD
    actor: 'implementations'
    locator: '§13.12'
    text: 'To prevent this, an implementation SHOULD implement the Intended Recipient Fingerprint subpacket (Section 5.2.3.36).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0417"
    object: 'Issuer Fingerprint subpacket synthesised locally'
    field: 'may be stored in the unhashed section of a signature that lacks one in the hashed section'
    verb: MAY
    actor: 'implementations'
    locator: '§13.13'
    text: 'For example, consider an implementation working with a specific signature that happens to know that the signature was made by a certain key, even though the signature contains no Issuer Fingerprint subpacket (Section 5.2.3.35) in the hashed section.  That implementation MAY synthesize an Issuer Fingerprint subpacket and store it in the unhashed section so that it will be able to recall which key issued the signature in the future.'
    kind: stated
    testable: partial
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-9580#R-0418"
    object: 'subpackets only useful in the hashed section'
    field: 'ignored when found with unknown provenance in the unhashed section'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§13.13'
    text: 'Some subpackets are only useful when they are in the hashed section, and an implementation SHOULD ignore them when they are found with unknown provenance in the unhashed section.'
    kind: stated
    testable: partial
    testable_reason: 'the set of subpackets "only useful" in the hashed section is not enumerated; testable for the cited example, Preferred AEAD Ciphersuites in the unhashed section'
    status: active
  - id: "rfc-9580#R-0419"
    object: 'decompression'
    field: 'limit on the number of compression layers decompressed in one message'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§13.14'
    text: 'An OpenPGP implementation SHOULD limit the number of layers of compression it is willing to decompress in a single message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0420"
    object: 'constrained (e.g. 20-octet) fingerprint storage'
    field: 'no part of a v6 fingerprint mapped into it unless the constrained environment''s specification gives explicit, v4-distinguishing guidance'
    verb: MUST NOT
    actor: 'implementations'
    locator: '§14.1'
    text: 'An OpenPGP implementation MUST NOT attempt to map any part of a version 6 fingerprint to such a constrained field unless the relevant specification for the constrained environment has explicit guidance for storing a version 6 fingerprint that distinguishes it from a version 4 fingerprint.'
    kind: stated
    testable: partial
    testable_reason: 'testable against a constrained environment (e.g. OpenPGP card) whose specification has no such guidance'
    status: active
  - id: "rfc-9580#R-0421"
    object: 'interaction with a constrained fingerprint field'
    field: 'calculate the v6 fingerprint from the public key material and metadata instead of relying on the field'
    verb: SHOULD
    actor: 'implementations'
    locator: '§14.1'
    text: 'An implementation interacting with such a constrained field SHOULD directly calculate the version 6 fingerprint from public key material and associated metadata instead of relying on the constrained field.'
    kind: stated
    testable: partial
    testable_reason: 'internal behaviour; observable only by giving the implementation a constrained field whose content disagrees with the key'
    status: active
