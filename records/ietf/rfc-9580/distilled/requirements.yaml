    testable: yes
    status: active
  - id: "rfc-9580#R-0052"
    object: 'revoked subkey'
    field: 'not to be used'
    verb: none
    actor: 'implementations'
    locator: '§5.2.1.12'
    text: 'A revoked subkey is not to be used.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0053"
    object: 'Subkey Revocation Signature (0x28)'
    field: 'valid only if issued by the bound top-level key or a (deprecated) Revocation Key'
    verb: none
    actor: 'verifying implementation'
    locator: '§5.2.1.12'
    text: 'Only Revocation Signatures by the top-level signature key that is bound to this subkey, or by a (deprecated) Revocation Key, should be considered valid Revocation Signatures.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0054"
    object: 'Certification Revocation Signature (0x30)'
    field: 'issuer: same key as the revoked signature or a (deprecated) Revocation Key'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.1.13'
    text: 'It should be issued by the same key that issued the revoked signature or by a (deprecated) Revocation Key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0055"
    object: 'Certification Revocation Signature (0x30)'
    field: 'computed over same data as revoked certification; later creation date'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.1.13'
    text: 'The signature is computed over the same data as the certification that it revokes, and it should have a later creation date than that certification.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0056"
    object: 'Third-Party Confirmation Signature (0x50)'
    field: 'Signature Target subpacket identifying the confirmed signature'
    verb: SHOULD
    actor: 'signer'
    locator: '§5.2.1.15'
    text: 'A Third-Party Confirmation signature SHOULD include a Signature Target subpacket that identifies the confirmed signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0057"
    object: 'Signature Type ID 0xFF'
    field: 'never created, never validated'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MUST NOT
    actor: 'implementations'
    locator: '§5.2.1.16'
    text: 'An implementation MUST NOT create any signature with this type and MUST NOT validate any signature made with this type.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0058"
    object: 'version 3 Signature packet'
    field: 'length of hashed material octet equals 5'
    verb: MUST
    actor: 'generating and parsing implementations'
    locator: '§5.2.2'
    text: 'A 1-octet length of the following hashed material; it MUST be 5:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0059"
    object: 'version 3 Signature packet'
    field: 'hash input: data, signature type, creation time (5 octets)'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.2'
    text: 'The concatenation of the data to be signed, the signature type, and the creation time from the Signature packet (5 additional octets) is hashed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0060"
    object: 'version 6 Signature packet'
    field: 'salt size octet matches the hash algorithm''s value in Table 23'
    verb: MUST
    actor: 'generating and parsing implementations'
    locator: '§5.2.3'
    text: 'A 1-octet salt size.  The value MUST match the value defined for the hash algorithm as specified in Table 23.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0061"
    object: 'version 3 signature'
    field: 'not created and not used with ECDSA'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MUST NOT
    actor: 'implementations'
    locator: '§5.2.3.2'
    text: 'A version 3 signature MUST NOT be created and MUST NOT be used with the Elliptic Curve Digital Signature Algorithm (ECDSA).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0062"
    object: 'DSA signature'
    field: 'hash digest size at least the bit length of q'
    verb: MUST
    actor: 'signer'
    locator: '§5.2.3.2'
    text: 'A DSA signature MUST use a hash algorithm with a digest size of at least the number of bits of q, the group generated by the DSA key''s generator value.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0063"
    object: 'DSA signature'
    field: 'hash truncated to the leftmost bits of q'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.3.2'
    text: 'If the output size of the chosen hash is larger than the number of bits of q, the hash result is truncated to fit by taking the number of leftmost bits equal to the number of bits of q.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0064"
    object: 'ECDSA signature'
    field: 'hash digest size at least curve fsize; at least 512 bits for NIST P-521'
    verb: MUST
    verbs:
      - MUST
      - MUST
    actor: 'signer'
    locator: '§5.2.3.2'
    text: 'An ECDSA signature MUST use a hash algorithm with a digest size of at least the curve''s "fsize" value (see Section 9.2), except in the case of NIST P-521, for which at least a 512-bit hash algorithm MUST be used.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0065"
    object: 'version 3 signature'
    field: 'not created and not used with EdDSALegacy'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MUST NOT
    actor: 'implementations'
    locator: '§5.2.3.3'
    text: 'A version 3 signature MUST NOT be created and MUST NOT be used with EdDSALegacy.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0066"
    object: 'EdDSALegacy signature'
    field: 'hash digest size at least curve fsize'
    verb: MUST
    actor: 'signer'
    locator: '§5.2.3.3'
    text: 'An EdDSALegacy signature MUST use a hash algorithm with a digest size of at least the curve''s "fsize" value (see Section 9.2).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0067"
    object: 'EdDSALegacy signature'
    field: 'rejection when hash digest is smaller than fsize'
    verb: MUST
    actor: 'verifying implementation'
    locator: '§5.2.3.3'
    text: 'A verifying implementation MUST reject any EdDSALegacy signature that uses a hash algorithm with a smaller digest size.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0068"
    object: 'Ed25519Legacy signature'
    field: 'not used in Signature packets version 6 or above'
    verb: MUST NOT
    actor: 'implementations'
    locator: '§5.2.3.3.1'
    text: 'Ed25519Legacy MUST NOT be used in Signature packets version 6 or above.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0069"
    object: 'version 3 signature'
    field: 'not created and not used with Ed25519'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MUST NOT
    actor: 'implementations'
    locator: '§5.2.3.4'
    text: 'A version 3 signature MUST NOT be created and MUST NOT be used with Ed25519.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0070"
    object: 'Ed25519 signature'
    field: 'hash digest size at least 256 bits'
    verb: MUST
    actor: 'signer'
    locator: '§5.2.3.4'
    text: 'An Ed25519 signature MUST use a hash algorithm with a digest size of at least 256 bits.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0071"
    object: 'Ed25519 signature'
    field: 'rejection when hash digest is smaller than 256 bits'
    verb: MUST
    actor: 'verifying implementation'
    locator: '§5.2.3.4'
    text: 'A verifying implementation MUST reject any Ed25519 signature that uses a hash algorithm with a smaller digest size.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0072"
    object: 'version 3 signature'
    field: 'not created and not used with Ed448'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MUST NOT
    actor: 'implementations'
    locator: '§5.2.3.5'
    text: 'A version 3 signature MUST NOT be created and MUST NOT be used with Ed448.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0073"
    object: 'Ed448 signature'
    field: 'hash digest size at least 512 bits'
    verb: MUST
    actor: 'signer'
    locator: '§5.2.3.5'
    text: 'An Ed448 signature MUST use a hash algorithm with a digest size of at least 512 bits.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0074"
    object: 'Ed448 signature'
    field: 'rejection when hash digest is smaller than 512 bits'
    verb: MUST
    actor: 'verifying implementation'
    locator: '§5.2.3.5'
    text: 'A verifying implementation MUST reject any Ed448 signature that uses a hash algorithm with a smaller digest size.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0075"
    object: 'version 4/6 signature'
    field: 'hash input: data, signature fields from version through hashed subpackets, 6-octet trailer'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.3.6'
    text: 'The concatenation of the data being signed, the signature data from the version number through the hashed subpacket data (inclusive), and (for signature versions later than 3) a 6-octet trailer (see Section 5.2.4) is hashed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0076"
    object: 'version 6 signature'
    field: 'rejection when the left 16 bits do not match the computed hash'
    verb: MUST
    actor: 'verifying implementation'
    locator: '§5.2.3.6'
    text: 'When verifying a version 6 signature, an implementation MUST reject the signature if these octets do not match the first two octets of the computed hash.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0077"
    object: 'unhashed subpacket area'
    field: 'carries only advisory information'
    verb: none
    actor: 'signer'
    locator: '§5.2.3.6'
    text: 'The second set of subpackets (the "unhashed section") is not cryptographically protected by the signature and should include only advisory information.'
    kind: stated
    testable: partial
    testable_reason: '''advisory'' is a semantic judgement; only the absence of non-advisory subpacket types can be checked'
    status: active
  - id: "rfc-9580#R-0078"
    object: 'subpacket length'
    field: 'covers type ID and data, excludes the length field itself'
    verb: none
    actor: 'generating and parsing implementations'
    locator: '§5.2.3.7'
    text: 'The subpacket length field covers the encoded Subpacket Type ID and the subpacket-specific data, and it does not include the subpacket length field itself.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0079"
    object: 'Subpacket Type ID octet'
    field: 'bit 7 is the critical bit'
    verb: none
    actor: 'generating and parsing implementations'
    locator: '§5.2.3.7'
    text: 'Bit 7 of the encoded Subpacket Type ID is the "critical" bit.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0080"
    object: 'critical subpacket unknown to the evaluator'
    field: 'signature considered in error'
    verb: SHOULD
    actor: 'evaluating (verifying) implementation'
    locator: '§5.2.3.7'
    text: 'If a subpacket is encountered that is marked critical but is unknown to the evaluating implementation, the evaluator SHOULD consider the signature to be in error.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0081"
    object: 'unrecognised non-critical subpacket'
    field: 'ignored'
    verb: SHOULD
    actor: 'evaluating (verifying) implementation'
    locator: '§5.2.3.7'
    text: 'An implementation SHOULD ignore any non-critical subpacket of a type that it does not recognize.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0082"
    object: 'signature subpackets 11, 21, 22, 39, 30, 29'
    field: 'implemented'
    verb: SHOULD
    actor: 'implementations'
    locator: '§5.2.3.7'
    text: 'Implementations SHOULD implement the four preferred algorithm subpackets (11, 21, 22, and 39), as well as the "Features" (30) and "Reason for Revocation" (29) subpackets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0083"
    object: 'Intended Recipient Fingerprint subpacket (35)'
    field: 'implemented'
    verb: SHOULD
    actor: 'implementations'
    locator: '§5.2.3.7'
    text: 'To avoid surreptitious forwarding (see Section 13.12), implementations SHOULD also implement the "Intended Recipients Fingerprint" (35) subpacket.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0084"
    object: 'unimplemented preference subpackets'
    field: 'fallback to mandatory-to-implement algorithms'
    verb: MUST
    actor: 'implementations'
    locator: '§5.2.3.7'
    text: 'Note that if an implementation chooses not to implement some of the preferences subpackets, it MUST default to the mandatory-to-implement algorithms to ensure interoperability.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0085"
    object: 'encrypted data format selection without Features (30) support'
    field: 'chosen from recipient key versions or external inference'
    verb: SHOULD
    actor: 'encrypting implementation'
    locator: '§5.2.3.7'
    text: 'An encrypting implementation that does not implement the "Features" (30) subpacket SHOULD select the type of encrypted data format based on the versions of the recipient keys or external inference (see Section 13.7 for more details).'
    kind: stated
    testable: partial
    testable_reason: '''external inference'' is unspecified; only the key-version-based choice can be checked'
    status: active
  - id: "rfc-9580#R-0086"
    object: 'conflicting subpackets'
    field: 'resolution: last subpacket in hashed section, or another scheme'
    verb: SHOULD
    verbs:
      - SHOULD
      - MAY
    actor: 'receiving implementation'
    locator: '§5.2.3.9'
    text: 'In most cases, an implementation SHOULD use the last subpacket in the hashed section of the signature, but it MAY use any conflict resolution scheme that makes more sense.'
    kind: stated
    testable: partial
    testable_reason: 'the MAY permits any scheme; only the default (last hashed subpacket) is checkable'
    status: active
  - id: "rfc-9580#R-0087"
    object: 'certification self-signature'
    field: 'each User ID may carry its own self-signature'
    verb: MAY
    actor: 'keyholder'
    locator: '§5.2.3.10'
    text: 'For certification self-signatures, each User ID MAY have a self-signature and thus different subpackets in those self-signatures.'
    kind: stated
    testable: no
    testable_reason: 'permission'
    status: active
  - id: "rfc-9580#R-0088"
    object: 'subkey'
    field: 'has a Subkey Binding self-signature'
    verb: MUST
    actor: 'keyholder / receiving implementation'
    locator: '§5.2.3.10'
    text: 'For Subkey Binding signatures, each subkey MUST have a self-signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0089"
    object: 'self-signature preference subpackets'
    field: 'interpreted as narrowly as possible (per User ID)'
    verb: none
    actor: 'receiving implementation'
    locator: '§5.2.3.10'
    text: 'An implementation should interpret a self-signature''s preference subpackets as narrowly as possible.'
    kind: stated
    testable: partial
    testable_reason: '''as narrowly as possible'' is checkable only through the worked example (lookup by User ID)'
    status: active
  - id: "rfc-9580#R-0090"
    object: 'revocation of a self-signature'
    field: 'User ID self-sig revocation retires the user name'
    verb: none
    actor: 'receiving implementation'
    locator: '§5.2.3.10'
    text: 'Revoking the self-signature on a User ID effectively retires that user name.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0091"
    object: 'revocation of a binding or Direct Key signature'
    field: 'binding revocation retires the subkey; Direct Key revocation cancels the signature'
    verb: none
    actor: 'receiving implementation'
    locator: '§5.2.3.10'
    text: 'Revoking a binding signature effectively retires that subkey.  Revoking a Direct Key signature cancels that signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0092"
    object: 'self-signature'
    field: 'user can rewrite it and its important information'
    verb: SHOULD
    actor: 'implementations'
    locator: '§5.2.3.10'
    text: 'Since a self-signature contains important information about the key''s use, an implementation SHOULD allow the user to rewrite the self-signature and important information in it, such as preferences and key expiration.'
    kind: stated
    testable: partial
    testable_reason: 'user-interface capability'
    status: active
  - id: "rfc-9580#R-0093"
    object: 'secret key import'
    field: 'check that self-signatures advertise only supported features/algorithms'
    verb: SHOULD
    actor: 'importing implementation'
    locator: '§5.2.3.10'
    text: 'When an implementation imports a secret key, it SHOULD verify that the key''s internal self-signatures do not advertise features or algorithms that the implementation doesn''t support.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0094"
    object: 'secret key import mismatch'
    field: 'warn the user and offer new self-signatures'
    verb: SHOULD
    actor: 'importing implementation'
    locator: '§5.2.3.10'
    text: 'If an implementation observes such a mismatch, it SHOULD warn the user and offer to create new self-signatures that advertise the actual set of features and algorithms supported by the implementation.'
    kind: stated
    testable: partial
    testable_reason: 'user-interface behaviour'
    status: active
  - id: "rfc-9580#R-0095"
    object: 'multiple self-signatures on one object'
    field: 'most recent valid one selected, others ignored'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§5.2.3.10'
    text: 'An implementation that encounters multiple self-signatures on the same object MUST select the most recent valid self-signature and ignore all other self-signatures.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0096"
    object: 'version 4 key'
    field: 'at least one User ID with a self-signature'
    verb: RECOMMENDED
    actor: 'key generator'
    locator: '§5.2.3.10'
    text: 'For this reason, it is RECOMMENDED to include at least one User ID with a self-signature in version 4 keys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0097"
    object: 'version 6 key'
    field: 'key-wide information stored in a Direct Key signature rather than a User ID self-signature'
    verb: RECOMMENDED
    actor: 'key generator'
    locator: '§5.2.3.10'
    text: 'For version 6 keys, it is RECOMMENDED to store information about the primary Public Key as well as the Transferable Public Key as a whole (key flags, key expiration, features, algorithm preferences, etc.) in a Direct Key signature (Type ID 0x1F) over the Public Key, instead of placing that information in a User ID self-signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0098"
    object: 'version 6 key'
    field: 'valid Direct Key signature present before use'
    verb: MUST
    actor: 'implementations'
    locator: '§5.2.3.10'
    text: 'An implementation MUST ensure that a valid Direct Key signature is present before using a version 6 key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0099"
    object: 'key consumption'
    field: 'no User ID self-signature required unless the use depends on the User ID'
    verb: SHOULD NOT
    actor: 'implementations'
    locator: '§5.2.3.10'
    text: 'An implementation SHOULD NOT require a User ID self-signature to be present in order to consume or use a key, unless the particular use is contingent on the keyholder identifying themselves with the textual label in the User ID.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0100"
    object: 'signature over an email message'
    field: 'may require a self-signed User ID matching the From: header'
    verb: MAY
    actor: 'verifying implementation'
    locator: '§5.2.3.10'
    text: 'On the other hand, when verifying a signature over an email message, an implementation MAY choose to only accept a signature from a key that has a valid self-signature over a User ID that matches the message''s From: header, as a way to avoid a signature transplant attack.'
    kind: stated
    testable: no
    testable_reason: 'permission'
    status: active
  - id: "rfc-9580#R-0101"
    object: 'Signature Creation Time subpacket'
    field: 'present in the hashed area'
    verb: MUST
    actor: 'signer; verifier'
    locator: '§5.2.3.11'
    text: 'This subpacket MUST be present in the hashed area.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0102"
    object: 'Signature Creation Time subpacket'
    field: 'critical bit set when generated'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.2.3.11'
    text: 'When generating this subpacket, it SHOULD be marked as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0103"
    object: 'Issuer Key ID subpacket'
    field: 'absent when the issuing key version is greater than 4'
    verb: MUST NOT
    actor: 'signer'
    locator: '§5.2.3.12'
    text: 'If the version of that key is greater than 4, this subpacket MUST NOT be included in the signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0104"
    object: 'Key Expiration Time subpacket'
    field: 'absent or zero means the key never expires'
    verb: none
    actor: 'receiving implementation'
    locator: '§5.2.3.13'
    text: 'If this is not present or has a value of zero, the key never expires.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0105"
    object: 'Key Expiration Time subpacket'
    field: 'critical bit set when generated'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.2.3.13'
    text: 'When an implementation generates this subpacket, it SHOULD be marked as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0106"
    object: 'Preferred AEAD Ciphersuites subpacket'
    field: 'AES-128/OCB implicitly listed last when absent'
    verb: none
    actor: 'encrypting implementation'
    locator: '§5.2.3.15'
    text: 'If AES-128 and OCB are not found in the subpacket, it is implicitly listed at the end.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0107"
    object: 'Signature Expiration Time subpacket'
    field: 'absent or zero means the signature never expires'
    verb: none
    actor: 'receiving implementation'
    locator: '§5.2.3.18'
    text: 'If this is not present or has a value of zero, it never expires.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0108"
    object: 'Signature Expiration Time subpacket'
    field: 'critical bit set when generated'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.2.3.18'
    text: 'When an implementation generates this subpacket, it SHOULD be marked as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0109"
    object: 'Exportable Certification subpacket'
    field: 'absent means exportable (equivalent to 1)'
    verb: none
    actor: 'receiving implementation'
    locator: '§5.2.3.19'
    text: 'If this packet is not present, the certification is exportable; it is equivalent to a flag containing a 1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0110"
    object: 'local (non-exportable) certifications'
    field: 'deleted when a key is exported'
    verb: none
    actor: 'exporting implementation'
    locator: '§5.2.3.19'
    text: 'Thus, when an implementation prepares a user''s copy of a key for transport to another user (this is the process of "exporting" the key), any local certification signatures are deleted from the key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0111"
    object: 'Exportable Certification subpacket denoting non-exportable'
    field: 'critical bit set'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.2.3.19'
    text: 'When an implementation generates this subpacket and denotes the signature as non-exportable, the subpacket MUST be marked as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0112"
    object: 'non-revocable signature (Revocable = 0)'
    field: 'later Revocation Signatures ignored'
    verb: none
    actor: 'verifying implementation'
    locator: '§5.2.3.20'
    text: 'Signatures that are not revocable ignore any later Revocation Signatures.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0113"
    object: 'Revocable subpacket'
    field: 'absent means revocable'
    verb: none
    actor: 'verifying implementation'
    locator: '§5.2.3.20'
    text: 'If this packet is not present, the signature is revocable.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0114"
    object: 'Trust Signature subpacket'
    field: 'body: 1 octet level (depth), 1 octet trust amount'
    verb: none
    actor: 'generating and parsing implementations'
    locator: '§5.2.3.21'
    text: '(1 octet "level" (depth), 1 octet of trust amount)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0115"
    object: 'Trust Signature level 0'
    field: 'same meaning as an ordinary validity signature'
    verb: none
    actor: 'trust-model evaluator'
    locator: '§5.2.3.21'
    text: 'Level 0 has the same meaning as an ordinary validity signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0116"
    object: 'Trust Signature level 1'
    field: 'signed key is a trusted introducer; second octet is the degree of trust'
    verb: none
    actor: 'trust-model evaluator'
    locator: '§5.2.3.21'
    text: 'Level 1 means that the signed key is asserted to be a valid trusted introducer, with the 2nd octet of the body specifying the degree of trust.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0117"
    object: 'Trust Signature level 2'
    field: 'signed key trusted to issue level 1 Trust Signatures (meta introducer)'
    verb: none
    actor: 'trust-model evaluator'
    locator: '§5.2.3.21'
    text: 'Level 2 means that the signed key is asserted to be trusted to issue level 1 Trust Signatures; that is, the signed key is a "meta introducer".'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0118"
    object: 'Trust Signature level n'
    field: 'signed key trusted to issue level n-1 Trust Signatures'
    verb: none
    actor: 'trust-model evaluator'
    locator: '§5.2.3.21'
    text: 'Generally, a level n Trust Signature asserts that a key is trusted to issue level n-1 Trust Signatures.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0119"
    object: 'Trust Signature trust amount'
    field: 'range 0-255; below 120 partial, 120 or above complete'
    verb: none
    actor: 'trust-model evaluator'
    locator: '§5.2.3.21'
    text: 'The trust amount is in a range from 0-255, interpreted such that values less than 120 indicate partial trust and values of 120 or greater indicate complete trust.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0120"
    object: 'Trust Signature trust amount'
    field: 'emitted values: 60 partial, 120 complete'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.2.3.21'
    text: 'Implementations SHOULD emit values of 60 for partial trust and 120 for complete trust.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0121"
    object: 'Regular Expression subpacket'
    field: 'body: null-terminated UTF-8 regular expression'
    verb: none
    actor: 'generating and parsing implementations'
    locator: '§5.2.3.22'
    text: '(null-terminated UTF-8 encoded Regular Expression)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0122"
    object: 'Regular Expression subpacket'
    field: 'scopes Trust Signatures of level > 0'
    verb: none
    actor: 'trust-model evaluator'
    locator: '§5.2.3.22'
    text: 'Used in conjunction with Trust Signature packets (of level > 0) to limit the scope of trust that is extended.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0123"
    object: 'Regular Expression subpacket'
    field: 'trust extended only to signatures by the target key on matching User IDs'
    verb: none
    actor: 'trust-model evaluator'
    locator: '§5.2.3.22'
    text: 'Only signatures by the target key on User IDs that match the Regular Expression in the body of this packet have trust extended by the Trust Signature subpacket.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0124"
    object: 'Regular Expression syntax'
    field: 'Henry Spencer regex syntax (Section 8)'
    verb: none
    actor: 'trust-model evaluator'
    locator: '§5.2.3.22'
    text: 'The Regular Expression uses the same syntax as Henry Spencer''s "almost public domain" Regular Expression [REGEX] package.  A description of the syntax is found in Section 8.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0125"
    object: 'Regular Expression matching'
    field: 'over UTF-8 Unicode characters of User IDs; expression written in UTF-8'
    verb: none
    actor: 'trust-model evaluator'
    locator: '§5.2.3.22'
    text: 'The Regular Expression matches (or does not match) a sequence of UTF-8-encoded Unicode characters from User IDs.  The expression itself is also written with UTF-8 characters.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0126"
    object: 'Regular Expression subpacket parsing'
    field: 'trailing null octet removed'
    verb: MUST
    actor: 'parsing implementation'
    locator: '§5.2.3.22'
    text: 'When an implementation parses a Regular Expression subpacket, it MUST remove this octet;'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0127"
    object: 'Regular Expression subpacket parsing'
    field: 'missing null terminator: subpacket rejected (ignored if non-critical, signature rejected if critical)'
    verb: MUST
    actor: 'parsing implementation'
    locator: '§5.2.3.22'
    text: 'if it is not present, it MUST reject the subpacket (i.e., ignore the subpacket if it''s non-critical and reject the signature if it''s critical).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0128"
    object: 'Regular Expression subpacket generation'
    field: 'null terminator included'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.2.3.22'
    text: 'When an implementation generates a Regular Expression subpacket, it MUST include the null terminator.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0129"
    object: 'Regular Expression subpacket'
    field: 'critical bit set when generated'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.2.3.22'
    text: 'When generating this subpacket, it SHOULD be marked as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0130"
    object: 'Revocation Key subpacket'
    field: 'body: 1 octet class, 1 octet public key algorithm ID, 20 octets v4 fingerprint'
    verb: none
    actor: 'parsing implementation'
    locator: '§5.2.3.23'
    text: '(1 octet of class, 1 octet of public key algorithm ID, 20 octets of version 4 fingerprint)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0131"
    object: 'Revocation Key subpacket'
    field: 'never generated'
    verb: MUST NOT
    actor: 'applications (generating implementation)'
    locator: '§5.2.3.23'
    text: 'This mechanism is deprecated.  Applications MUST NOT generate such a subpacket.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0132"
    object: 'Revocation Key subpacket class octet'
    field: 'bit 0x80 set'
    verb: none
    actor: 'implementations that interpret the subpacket'
    locator: '§5.2.3.23'
    text: 'The class octet must have bit 0x80 set.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0133"
    object: 'Revocation Key subpacket class octet'
    field: 'bit 0x40 marks revocation information as sensitive'
    verb: none
    actor: 'implementations that interpret the subpacket'
    locator: '§5.2.3.23'
    text: 'If bit 0x40 is set, it means the revocation information is sensitive.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0134"
    object: 'Revocation Key subpacket'
    field: 'found only on a Direct Key self-signature (0x1F); other placements unspecified'
    verb: none
    actor: 'implementations that interpret the subpacket'
    locator: '§5.2.3.23'
    text: 'This is only found on a Direct Key self-signature (Type ID 0x1F).  The use on other types of self-signatures is unspecified.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0135"
    object: 'signature carrying a sensitive Revocation Key subpacket'
    field: 'not exported except to, or together with a revocation from, the designated revoker'
    verb: SHOULD NOT
    actor: 'exporting implementation'
    locator: '§5.2.3.23'
    text: 'If this flag is set, implementations SHOULD NOT export this signature to other users except in cases where the data needs to be available, i.e., when the signature is being sent to the designated revoker or when it is accompanied by a Revocation Signature from that revoker.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0136"
    object: 'Notation Data flags'
    field: 'undefined flags zero'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.2.3.24'
    text: 'All undefined flags MUST be zero.  Defined flags are as follows:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0137"
    object: 'IETF-namespace notation names'
    field: 'no "@" character'
    verb: MUST NOT
    actor: 'IANA registrations / generating implementation'
    locator: '§5.2.3.24'
    text: 'The IETF namespace is registered with IANA.  These names MUST NOT contain the "@" character (0x40).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0138"
    object: 'user-namespace notation name tag'
    field: 'no "@" character in the tag'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§5.2.3.24'
    text: 'Note that the tag MUST NOT contain an "@" character.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0139"
    object: 'user-namespace notation name'
    field: 'address reaching a person who can be consulted'
    verb: MAY
    actor: 'implementers'
    locator: '§5.2.3.24'
    text: 'Since the user namespace is in the form of an email address, implementers MAY wish to arrange for that address to reach a person who can be consulted about the use of the named tag.'
    kind: stated
    testable: no
    testable_reason: 'permission about an out-of-band contact address'
    status: active
  - id: "rfc-9580#R-0140"
    object: 'Key Server Preferences flags'
    field: 'undefined flags zero'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.2.3.25'
    text: 'This is a list of 1-bit flags that indicates preferences that the keyholder has about how the key is handled on a key server.  All undefined flags MUST be zero.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0141"
    object: 'multiple primary User IDs'
    field: 'priority to the User ID with the most recent self-signature'
    verb: RECOMMENDED
    actor: 'receiving implementation'
    locator: '§5.2.3.27'
    text: 'If more than one User ID in a key is marked as primary, the implementation may resolve the ambiguity in any way it sees fit, but it is RECOMMENDED that priority be given to the User ID with the most recent self-signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0142"
    object: 'Key Flags subpacket'
    field: 'no fixed size assumed'
    verb: MUST NOT
    actor: 'parsing implementation'
    locator: '§5.2.3.29'
    text: 'It is a string of octets, and an implementation MUST NOT assume a fixed size, so that it can grow over time.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0143"
    object: 'Key Flags subpacket'
    field: 'missing trailing flags read as zero'
    verb: none
    actor: 'parsing implementation'
    locator: '§5.2.3.29'
    text: 'If a list is shorter than an implementation expects, the unstated flags are considered to be zero.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0144"
    object: 'split key (0x10) and group key (0x80) flags'
    field: 'only on a Direct Key or Subkey Binding signature'
    verb: SHOULD
    actor: 'keyholder / generating implementation'
    locator: '§5.2.3.29'
    text: 'They SHOULD be placed only on a Direct Key signature (Type ID 0x1F) or a Subkey Binding signature (Type ID 0x18), one that refers to the key the flag applies to.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0145"
    object: 'Key Flags subpacket'
    field: 'critical bit set when generated'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.2.3.29'
    text: 'When an implementation generates this subpacket, it SHOULD be marked as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0146"
    object: 'Reason for Revocation subpacket'
    field: 'used only in Key Revocation and Certification Revocation signatures'
    verb: none
    actor: 'signer'
    locator: '§5.2.3.31'
    text: 'This subpacket is used only in Key Revocation and Certification Revocation signatures.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0147"
    object: 'Reason for Revocation subpacket'
    field: 'length = reason string length + 1'
    verb: none
    actor: 'generating and parsing implementations'
    locator: '§5.2.3.31'
    text: 'The length of the subpacket is the length of the reason string plus one.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0148"
    object: 'Reason for Revocation subpacket'
    field: 'implemented, included in all Revocation Signatures, interpreted'
    verb: SHOULD
    actor: 'implementations'
    locator: '§5.2.3.31'
    text: 'An implementation SHOULD implement this subpacket, include it in all Revocation Signatures, and interpret revocations appropriately.'
    kind: stated
    testable: partial
    testable_reason: 'inclusion in every Revocation Signature is checkable; ''interpret revocations appropriately'' is not'
    status: active
  - id: "rfc-9580#R-0149"
    object: 'key revoked for compromise vs superseded/retired'
    field: 'compromise: all signatures suspect; superseded/retired: old signatures still valid'
    verb: none
    actor: 'verifying implementation'
    locator: '§5.2.3.31'
    text: 'If a key has been revoked because of a compromise, all signatures created by that key are suspect.  However, if it was merely superseded or retired, old signatures are still valid.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0150"
    object: 'revocation of a User ID self-certification'
    field: 'Reason for Revocation code 32'
    verb: SHOULD
    actor: 'signer (keyholder)'
    locator: '§5.2.3.31'
    text: 'If the revoked signature is the self-signature for certifying a User ID, a revocation denotes that that user name is no longer in use.  Such a signature revocation SHOULD include a Reason for Revocation subpacket containing code 32.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0151"
    object: 'revoked certification'
    field: 'excluded from validity calculations'
    verb: none
    actor: 'verifying implementation'
    locator: '§5.2.3.31'
    text: 'A revoked certification is no longer a part of validity calculations.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0152"
    object: 'feature use'
    field: 'not used toward a recipient that does not advertise it, absent other inference'
    verb: SHOULD NOT
    actor: 'sending implementation'
    locator: '§5.2.3.32'
    text: 'An implementation SHOULD NOT use a feature listed when sending to a user who does not state that they can use it, unless the implementation can infer support for the feature from another implementation-dependent mechanism.'
    kind: stated
    testable: partial
    testable_reason: '''implementation-dependent mechanism'' is unspecified'
    status: active
  - id: "rfc-9580#R-0153"
    object: 'Features subpacket'
    field: 'implemented by any implementation of a defined feature'
    verb: SHOULD
    actor: 'implementations'
    locator: '§5.2.3.32'
    text: 'If an implementation implements any of the defined features, it SHOULD implement the Features subpacket, too.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0154"
    object: 'Signature Target subpacket in Revocation Signatures'
    field: 'designates which signature is revoked'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.3.33'
    text: 'For Revocation Signatures, this subpacket provides explicit designation of which signature is being revoked.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0155"
    object: 'Signature Target hash'
    field: 'N octets equal the size of the target signature''s hash'
    verb: MUST
    actor: 'generating and parsing implementations'
    locator: '§5.2.3.33'
    text: 'The N octets of hash data MUST be the size of the signature''s hash.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0156"
    object: 'Signature Target hash (SHA-1 example)'
    field: '20 octets for a SHA-1 target'
    verb: MUST
    actor: 'generating and parsing implementations'
    locator: '§5.2.3.33'
    text: 'For example, a target signature with a SHA-1 hash MUST have 20 octets of hash data.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0157"
    object: 'Issuer Fingerprint subpacket'
    field: 'included in all signatures'
    verb: SHOULD
    actor: 'signer'
    locator: '§5.2.3.35'
    text: 'This subpacket SHOULD be included in all signatures.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0158"
    object: 'Issuer Key ID vs Issuer Fingerprint (v4 key)'
    field: 'Key ID equals low 64 bits of the fingerprint'
    verb: MUST
    actor: 'signer; verifier'
    locator: '§5.2.3.35'
    text: 'If the version of the issuing key is 4 and an Issuer Key ID subpacket (Section 5.2.3.12) is also included in the signature, the Key ID of the Issuer Key ID subpacket MUST match the low 64 bits of the fingerprint.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0159"
    object: 'Issuer Fingerprint version octet'
    field: 'equals the signature version'
    verb: MUST
    actor: 'signer'
    locator: '§5.2.3.35'
    text: 'Since the version of the signature is bound to the version of the key, the version octet here MUST match the version of the signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0160"
    object: 'Issuer Fingerprint version mismatch'
    field: 'signature treated as malformed'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§5.2.3.35'
    text: 'If the version octet does not match the signature version, the receiving implementation MUST treat it as a malformed signature (see Section 5.2.5).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0161"
    object: 'signature with Intended Recipient Fingerprint'
    field: 'valid only in an encrypted context to one of the indicated keys or subkeys'
    verb: SHOULD
    actor: 'verifying implementation'
    locator: '§5.2.3.36'
    text: 'If one or more subpackets of this type are included in a signature, it SHOULD be considered valid only in an encrypted context, where the key it was encrypted to is one of the indicated primary keys or one of their subkeys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0162"
    object: 'Intended Recipient Fingerprint subpacket'
    field: 'generated for signed and encrypted messages'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.2.3.36'
    text: 'An implementation SHOULD generate this subpacket when creating a signed and encrypted message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0163"
    object: 'Intended Recipient Fingerprint subpacket in v6 signatures'
    field: 'critical bit set'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.2.3.36'
    text: 'When generating this subpacket in a version 6 signature, it SHOULD be marked as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0164"
    object: 'version 6 signature hashing'
    field: 'salt hashed first'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'When creating or verifying a version 6 signature, the salt is fed into the hash context before any other data.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0165"
    object: 'binary document signature (0x00) hashing'
    field: 'document data hashed directly'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'For binary document signatures (Type ID 0x00), the document data is hashed directly.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0166"
    object: 'text document signature (0x01) hashing'
    field: 'document canonicalised to <CR><LF> and UTF-8 before hashing'
    verb: MUST
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'For text document signatures (Type ID 0x01), the implementation MUST first canonicalize the document by converting line endings to <CR><LF> and encoding it in UTF-8 (see [RFC3629]).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0167"
    object: 'version 4 signature over a key'
    field: 'hash: 0x99, 2-octet length, key packet body'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'When a version 4 signature is made over a key, the hash data starts with the octet 0x99, followed by a 2-octet length of the key, followed by the body of the key packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0168"
    object: 'version 6 signature over a key'
    field: 'hash: salt, 0x9B, 4-octet length, key packet body'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'When a version 6 signature is made over a key, the hash data starts with the salt and then octet 0x9B, followed by a 4-octet length of the key, followed by the body of the key packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0169"
    object: 'Subkey Binding (0x18) / Primary Key Binding (0x19) hashing'
    field: 'subkey hashed in the same format as the primary key'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'A Subkey Binding signature (Type ID 0x18) or Primary Key Binding signature (Type ID 0x19) then hashes the subkey using the same format as the main key (also using 0x99 or 0x9B as the first octet).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0170"
    object: 'Key Revocation (0x20) hashing'
    field: 'only the revoked key hashed'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'Primary Key Revocation signatures (Type ID 0x20) hash only the key being revoked.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0171"
    object: 'Subkey Revocation (0x28) hashing'
    field: 'primary key then revoked subkey'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'A Subkey Revocation signature (Type ID 0x28) first hashes the primary key and then the subkey being revoked.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0172"
    object: 'Certification (0x10-0x13) hashing'
    field: 'User ID / User Attribute hashed after key data; v3 without header; v4/v6 with 0xB4/0xD1 and 4-octet length'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'A Certification signature (Type IDs 0x10 through 0x13) hashes the User ID that is bound to the key into the hash context after the above data.  A version 3 certification hashes the contents of the User ID or User Attribute packet without the packet header.  A version 4 or version 6 certification hashes the constant 0xB4 for User ID certifications or the constant 0xD1 for User Attribute certifications, followed by a 4-octet number giving the length of the User ID or User Attribute data, followed by the User ID or User Attribute data.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0173"
    object: 'Third-Party Confirmation (0x50) hashing'
    field: 'salt (v6), 0x88, 4-octet length, signature body; unhashed subpackets excluded, length set to zero'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'A Third-Party Confirmation signature (Type ID 0x50) hashes the salt (version 6 signatures only), followed by the octet 0x88, followed by the 4-octet length of the signature, and then the body of the Signature packet.  (Note that this is a Legacy packet header for a Signature packet with the length-of-length field set to zero.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0174"
    object: 'version 3 signature trailer'
    field: 'five octets: signature type, 4-octet creation time'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'A version 3 signature hashes five octets of the packet body, starting from the signature type field.  This data is the signature type, followed by the 4-octet Signature Creation Time.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0175"
    object: 'version 4/6 signature trailer'
    field: 'version through hashed subpackets, then version octet, 0xFF, 4-octet big-endian length mod 2^32'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4'
    text: 'A version 4 or version 6 signature hashes the packet body starting from its first field, the version number, through the end of the hashed subpacket data and a final extra trailer.  Thus, the hashed fields are: -  an octet indicating the signature version (0x04 for version 4, and 0x06 for version 6), -  the signature type, -  the public key algorithm, -  the hash algorithm, -  the hashed subpacket length, -  the hashed subpacket body, -  a second version octet (0x04 for version 4, and 0x06 for version 6), -  a single octet 0xFF, and -  a number representing the length (in octets) of the hashed data from the Signature packet through the hashed subpacket body. This a 4-octet big-endian unsigned integer of the length modulo 2^32.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0176"
    object: 'version 3 signature'
    field: 'Signature Type ID is not 0xFF'
    verb: MUST NOT
    actor: 'signer; verifier'
    locator: '§5.2.4.1'
    text: 'A version 3 signature uses the fifth octet from the end to store its Signature Type ID.  This MUST NOT be Signature Type ID 0xFF.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0177"
    object: 'version 4+ signature trailer'
    field: '0xFF at fifth octet from the end, version at sixth'
    verb: none
    actor: 'signer / verifier'
    locator: '§5.2.4.1'
    text: 'All signature versions later than version 3 always use a literal 0xFF in the fifth octet from the end.  For these later signature versions, the sixth octet from the end (the octet before the 0xFF) stores the signature version number.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0178"
    object: 'malformed or unknown signature'
    field: 'ignored for validation'
    verb: MUST
    actor: 'verifying implementation'
    locator: '§5.2.5'
    text: 'When an implementation encounters such a malformed or unknown signature, it MUST ignore the signature for validation purposes.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0179"
    object: 'malformed or unknown signature'
    field: 'never reported as successfully validated'
    verb: MUST NOT
    actor: 'verifying implementation'
    locator: '§5.2.5'
    text: 'It MUST NOT indicate a successful signature validation for such a signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0180"
    object: 'malformed or unknown signature'
    field: 'processing continues; other signatures not rejected'
    verb: MUST NOT
    actor: 'verifying implementation'
    locator: '§5.2.5'
    text: 'At the same time, it MUST NOT halt processing on the packet stream or reject other signatures in the same packet stream just because an unknown or invalid signature exists.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0181"
    object: 'v4 SKESK packet'
    field: 'placement: must not precede a v2 SEIPD packet'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§5.3.1'
    text: 'A v4 SKESK packet MUST NOT precede a v2 SEIPD packet (see Section 10.3.2.1).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0182"
    object: 'v4 SKESK packet S2K Specifier'
    field: 'S2K type must use a salt (Salted, Iterated and Salted, or Argon2)'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.3.1'
    text: 'Note: because an all-zero IV is used for this decryption, the S2K Specifier MUST use a salt value, a Salted S2K, an Iterated and Salted S2K, or Argon2.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0183"
    object: 'v6 SKESK packet'
    field: 'placement: must not precede a v1 SEIPD packet or a Symmetrically Encrypted Data packet'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§5.3.2'
    text: 'A v6 SKESK packet MUST NOT precede a v1 SEIPD packet or a deprecated Symmetrically Encrypted Data packet (see Section 10.3.2.1).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0184"
    object: 'v6 One-Pass Signature packet'
    field: 'salt size octet equals the salt size defined for the hash algorithm in Table 23'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.4'
    text: 'A 1-octet salt size.  The value MUST match the value defined for the hash algorithm as specified in Table 23.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0185"
    object: 'v6 One-Pass Signature packet'
    field: 'salt equals the salt field of the corresponding Signature packet'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.4'
    text: 'The salt; a random value of the specified size.  The value MUST match the salt field of the corresponding Signature packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0186"
    object: 'One-Pass Signature packet'
    field: 'OPS version corresponds to the Signature packet version (v3 OPS for v4 signatures)'
    verb: MUST
    actor: 'signer'
    locator: '§5.4'
    text: 'When generating a one-pass signature, the OPS packet version MUST correspond to the version of the associated Signature packet, except for the historical accident that version 4 keys use a version 3 One-Pass Signature packet (there is no version 4 OPS).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0187"
    object: 'key generation'
    field: 'key packet version 6 for newly created keys'
    verb: SHOULD
    actor: 'implementations'
    locator: '§5.5.2'
    text: 'OpenPGP implementations SHOULD create keys with version 6 format.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0188"
    object: 'version 4 key'
    field: 'not generated; accepted'
    verb: SHOULD NOT
    verbs:
      - SHOULD NOT
      - SHOULD
    actor: 'implementations'
    locator: '§5.5.2'
    text: 'Version 4 keys are deprecated; an implementation SHOULD NOT generate a version 4 key but SHOULD accept it.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0189"
    object: 'version 3 key'
    field: 'never generated; acceptance optional'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MAY
    actor: 'implementations'
    locator: '§5.5.2'
    text: 'Version 3 keys are deprecated; an implementation MUST NOT generate a version 3 key but MAY accept it.'
    kind: stated
    testable: partial
    testable_reason: 'the generation prohibition is testable; the MAY to accept permits either behaviour and cannot fail'
    status: active
  - id: "rfc-9580#R-0190"
    object: 'version 2 key'
    field: 'never generated; acceptance optional'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MAY
    actor: 'implementations'
    locator: '§5.5.2'
    text: 'Version 2 keys are deprecated; an implementation MUST NOT generate a version 2 key but MAY accept it.'
    kind: stated
    testable: partial
    testable_reason: 'the generation prohibition is testable; the MAY to accept permits either behaviour and cannot fail'
    status: active
  - id: "rfc-9580#R-0191"
    object: 'v6 Secret Key / Secret Subkey packet'
    field: 'S2K usage octet value 255 (MalleableCFB) forbidden'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§5.5.3'
    text: 'A version 6 packet MUST NOT use the value 255 (MalleableCFB).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0192"
    object: 'Secret Key packet secret data protection'
    field: 'S2K usage 255 or a cipher ID (2-octet checksum) is deprecated and should not be used'
    verb: SHOULD NOT
    actor: 'generating implementation'
    locator: '§5.5.3'
    text: 'If the S2K usage octet is 255 (MalleableCFB) or another non-zero value (that is, a symmetric key encryption algorithm identifier), a 2-octet checksum of the plaintext of the algorithm-specific portion (sum of all octets, mod 65536) is appended to plaintext and encrypted with it.  (This is deprecated and SHOULD NOT be used; see below.)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0193"
    object: 'passphrase-protected Secret Key packet'
    field: 'S2K Specifier present (no simple MD5 hash of the passphrase)'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.5.3'
    text: 'An implementation producing a passphrase-protected Secret Key packet MUST use an S2K Specifier;'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0194"
    object: 'existing private keys protected with the simple MD5 hash'
    field: 'continued use permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§5.5.3'
    text: 'though implementations MAY continue to use existing private keys in the old format.'
    kind: stated
    testable: no
    testable_reason: 'a permission; either behaviour conforms'
    status: active
  - id: "rfc-9580#R-0195"
    object: 'secret key 2-octet checksum'
    field: 'not used (SHA-1 hash, usage octet 254, instead)'
    verb: SHOULD NOT
    actor: 'implementations'
    locator: '§5.5.3'
    text: 'However, this checksum is deprecated, and an implementation SHOULD NOT use it; instead, an implementation should use the SHA-1 hash denoted with a usage octet of 254.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0196"
    object: 'decrypted secret key material'
    field: 'octets beyond the unwrapped cleartext stream not read into any MPI'
    verb: MUST NOT
    actor: 'receiving implementation'
    locator: '§5.5.3'
    text: 'In particular, an implementation MUST NOT interpret octets beyond the unwrapped cleartext octet stream as part of any of the unwrapped MPI objects.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0197"
    object: 'decrypted secret key material'
    field: 'rejected as unusable when cleartext length does not align with the unwrapped MPI lengths'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§5.5.3'
    text: 'Furthermore, an implementation MUST reject any secret key material whose cleartext length does not align with the lengths of the unwrapped MPI objects as unusable.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0198"
    object: 'Curve25519Legacy ECDH key'
    field: 'not used in key packets of version 6 or above'
    verb: MUST NOT
    actor: 'implementations'
    locator: '§5.5.5.6.1.1'
    text: 'Curve25519Legacy MUST NOT be used in key packets version 6 or above.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0199"
    object: 'Curve25519Legacy secret key integer'
    field: 'appropriate form (as the three following constraints define)'
    verb: MUST
    actor: 'implementations'
    locator: '§5.5.5.6.1.1'
    text: 'Note also that the integer for a Curve25519Legacy secret key for OpenPGP MUST have the appropriate form;'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0200"
    object: 'Curve25519Legacy secret key integer'
    field: 'divisible by 8'
    verb: MUST
    actor: 'implementations'
    locator: '§5.5.5.6.1.1'
    text: 'that is, it MUST be divisible by 8,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0201"
    object: 'Curve25519Legacy secret key integer'
    field: 'at least 2^254'
    verb: MUST
    actor: 'implementations'
    locator: '§5.5.5.6.1.1'
    text: 'MUST be at least 2^254,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0202"
    object: 'Curve25519Legacy secret key integer'
    field: 'less than 2^255'
    verb: MUST
    actor: 'implementations'
    locator: '§5.5.5.6.1.1'
    text: 'and MUST be less than 2^255.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0203"
    object: 'Compressed Data packet'
    field: 'OpenPGP packet framing format'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.6'
    text: 'An implementation that generates a Compressed Data packet MUST use the OpenPGP format for packet framing (see Section 4.2.1).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0204"
    object: 'Compressed Data packet'
    field: 'Legacy packet framing format not generated'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§5.6'
    text: 'It MUST NOT generate a Compressed Data packet with Legacy format (Section 4.2.2).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0205"
    object: 'Compressed Data packet with Legacy framing'
    field: 'interpretation permitted for historic or pre-RFC 2440 data'
    verb: MAY
    actor: 'receiving implementation'
    locator: '§5.6'
    text: 'An implementation that deals with either historic data or data generated by legacy implementations predating support for [RFC2440] MAY interpret Compressed Data packets that use the Legacy format for packet framing.'
    kind: stated
    testable: no
    testable_reason: 'a permission; either behaviour conforms'
    status: active
  - id: "rfc-9580#R-0206"
    object: 'Symmetrically Encrypted Data packet'
    field: 'never created'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§5.7'
    text: 'This packet is obsolete.  An implementation MUST NOT create this packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0207"
    object: 'Symmetrically Encrypted Data packet'
    field: 'rejected and message processing stopped'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§5.7'
    text: 'An implementation SHOULD reject such a packet and stop processing the message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0208"
    object: 'Symmetrically Encrypted Data packet'
    field: 'clear warning when processed anyway'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§5.7'
    text: 'If an implementation chooses to process the packet anyway, it MUST return a clear warning that a non-integrity-protected packet has been processed.'
    kind: stated
    testable: partial
    testable_reason: 'presence of a warning is observable; whether it is clear is a judgement'
    status: active
  - id: "rfc-9580#R-0209"
    object: 'Marker packet'
    field: 'ignored on receipt'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§5.8'
    text: 'Such a packet MUST be ignored when received.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0210"
    object: 'Literal Data packet format octet'
    field: 'value t (0x74) not emitted'
    verb: SHOULD NOT
    actor: 'generating implementation'
    locator: '§5.9'
    text: 'Previous versions of the OpenPGP specification used t (0x74) to indicate textual data but did not specify the character encoding.  Implementations SHOULD NOT emit this value.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0211"
    object: 'Literal Data packet format octet t (0x74)'
    field: 'data interpreted as UTF-8 unless reliable context indicates another encoding'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§5.9'
    text: 'An implementation that receives a Literal Data packet with this value in the format field SHOULD interpret the packet data as UTF-8 encoded text, unless reliable (not attacker-controlled) context indicates a specific alternate text encoding.'
    kind: stated
    testable: partial
    testable_reason: 'the UTF-8 default is testable; the reliable-context exception depends on out-of-band context'
    status: active
  - id: "rfc-9580#R-0212"
    object: 'Literal Data packet file name'
    field: 'may be treated as more authoritative than the actual file name'
    verb: MAY
    actor: 'receiving implementation'
    locator: '§5.9'
    text: 'An implementation MAY consider the file name in the Literal Data packet to be a more authoritative name than the actual file name.'
    kind: stated
    testable: no
    testable_reason: 'a permission; either behaviour conforms'
    status: active
  - id: "rfc-9580#R-0213"
    object: 'Literal Data packet text data'
    field: 'UTF-8 encoding and <CR><LF> line endings'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.9'
    text: 'Text data MUST be encoded with UTF-8 (see [RFC3629]) and stored with <CR><LF> text endings (that is, network-normal line endings).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0214"
    object: 'Literal Data packet format octet, file name and date'
    field: 'not treated as protected by the surrounding signature'
    verb: MUST NOT
    actor: 'receiving implementation'
    locator: '§5.9'
    text: 'A receiving implementation MUST NOT treat those fields as though they were cryptographically secured by the surrounding signature when either representing them to the user or acting on them.'
    kind: stated
    testable: partial
    testable_reason: 'observable only through UI presentation or application behaviour, not on the wire'
    status: active
  - id: "rfc-9580#R-0215"
    object: 'Literal Data packet metadata fields'
    field: 'no significant data stored in format, file name and date fields'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.9'
    text: 'Due to their inherent malleability, an implementation that generates a Literal Data packet SHOULD avoid storing any significant data in these fields.'
    kind: stated
    testable: partial
    testable_reason: 'what counts as significant data is a judgement; R-0218 gives the testable defaults'
    status: active
  - id: "rfc-9580#R-0216"
    object: 'Literal Data packet format octet'
    field: 'u permitted when the data is certainly UTF-8 text'
    verb: MAY
    actor: 'generating implementation'
    locator: '§5.9'
    text: 'If the implementation is certain that the data is textual and is encoded with UTF-8 (for example, if it will follow this Literal Data packet with a Signature packet of type 0x01 (see Section 5.2.1), it MAY set the format octet to u.'
    kind: stated
    testable: no
    testable_reason: 'a permission; either behaviour conforms'
    status: active
  - id: "rfc-9580#R-0217"
    object: 'Literal Data packet format octet'
    field: 'b when the data is not certainly UTF-8 text'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.9'
    text: 'Otherwise, it MUST set the format octet to b.'
    kind: stated
    testable: partial
    testable_reason: 'testable for input known not to be UTF-8 text; the condition rests on the implementation''s certainty'
    status: active
  - id: "rfc-9580#R-0218"
    object: 'Literal Data packet file name and date'
    field: 'empty file name and zero timestamp'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.9'
    text: 'It SHOULD set the filename to the empty string (encoded as a single zero octet) and the timestamp to zero (encoded as four zero octets).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0219"
    object: 'Literal Data packet'
    field: 'OpenPGP packet framing format'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.9'
    text: 'An implementation that generates a Literal Data packet MUST use the OpenPGP format for packet framing (see Section 4.2.1).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0220"
    object: 'Literal Data packet'
    field: 'Legacy packet framing format not generated'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§5.9'
    text: 'It MUST NOT generate a Literal Data packet with Legacy format (Section 4.2.2).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0221"
    object: 'Literal Data packet with Legacy framing'
    field: 'interpretation permitted for historic or pre-RFC 2440 data'
    verb: MAY
    actor: 'receiving implementation'
    locator: '§5.9'
    text: 'An implementation that deals with either historic data or data generated by an implementation that predates support for [RFC2440] MAY interpret Literal Data packets that use the Legacy format for packet framing.'
    kind: stated
    testable: no
    testable_reason: 'a permission; either behaviour conforms'
    status: active
  - id: "rfc-9580#R-0222"
    object: '_CONSOLE file name'
    field: 'no reliance on the indicator being honoured'
    verb: MUST NOT
    actor: 'OpenPGP deployment generating Literal Data packets'
    locator: '§5.9.1'
    text: 'An OpenPGP deployment that generates Literal Data packets MUST NOT depend on this indicator being honored in any particular way.'
    kind: stated
    testable: no
    testable_reason: 'a constraint on deployment design, not on any packet or observable behaviour'
    status: active
  - id: "rfc-9580#R-0223"
    object: '_CONSOLE file name'
    field: 'not used in newly generated Literal Data packets'
    verb: NOT RECOMMENDED
    actor: 'generating implementation'
    locator: '§5.9.1'
    text: 'It is NOT RECOMMENDED to use this special filename in a newly generated Literal Data packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0224"
    object: 'Trust packet'
    field: 'not emitted to output transferred to other users'
    verb: SHOULD NOT
    actor: 'implementations'
    locator: '§5.10'
    text: 'Trust packets SHOULD NOT be emitted to output streams that are transferred to other users'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0225"
    object: 'Trust packet'
    field: 'ignored on any input other than local keyring files'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§5.10'
    text: 'they SHOULD be ignored on any input other than local keyring files.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0226"
    object: 'User Attribute packet'
    field: 'certification signature on it handled properly'
    verb: SHOULD
    actor: 'implementations'
    locator: '§5.12'
    text: 'While User Attribute packets are not a required part of the OpenPGP specification, implementations SHOULD provide at least enough compatibility to properly handle a certification signature on the User Attribute packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0227"
    object: 'User Attribute subpacket of unknown type'
    field: 'ignored'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§5.12'
    text: 'An implementation SHOULD ignore any subpacket of a type that it does not recognize.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0228"
    object: 'version 1 image header'
    field: '12 reserved octets set to 0'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.12.1'
    text: 'The rest of the version 1 image header is made up of 12 reserved octets, all of which MUST be set to 0.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0229"
    object: 'Image Attribute subpacket'
    field: 'image type may be sniffed from the data when header version or encoding is unknown'
    verb: MAY
    actor: 'receiving implementation'
    locator: '§5.12.1'
    text: 'An implementation MAY try to determine the type of an image by examination of the image data if it is unable to handle a particular version of the image header or if a specified encoding format value is not recognized.'
    kind: stated
    testable: no
    testable_reason: 'a permission; either behaviour conforms'
    status: active
  - id: "rfc-9580#R-0230"
    object: 'v1 SEIPD packet'
    field: 'symmetric cipher specified in a preceding PKESK or SKESK packet'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.13.1'
    text: 'The symmetric cipher used MUST be specified in a Public Key or Symmetric Key Encrypted Session Key packet that precedes the Symmetrically Encrypted and Integrity Protected Data packet.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0231"
    object: 'v1 SEIPD packet MDC'
    field: 'hash mismatch treated as a security problem'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§5.13.1'
    text: 'A mismatch of the hash indicates that the message has been modified and MUST be treated as a security problem.'
    kind: stated
    testable: partial
    testable_reason: 'a failed decryption result is observable on a tampered vector; what treatment as a security problem requires is not specified'
    status: active
  - id: "rfc-9580#R-0232"
    object: 'v1 SEIPD packet MDC'
    field: 'failure reported to the user'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§5.13.1'
    text: 'Any failure SHOULD be reported to the user.'
    kind: stated
    testable: partial
    testable_reason: 'reporting is observable only through the user interface or API error surface'
    status: active
  - id: "rfc-9580#R-0233"
    object: 'v2 SEIPD packet salt'
    field: '32-octet salt securely generated'
    verb: MUST
    actor: 'generating implementation'
    locator: '§5.13.2'
    text: 'The salt is used to derive the message key and MUST be securely generated (see Section 13.10).'
    kind: stated
    testable: partial
    testable_reason: 'randomness quality cannot be established from output; only repetition across messages is detectable'
    status: active
  - id: "rfc-9580#R-0234"
    object: 'v2 SEIPD packet chunk size octet'
    field: 'values 0 to 16 accepted'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§5.13.2'
    text: 'An implementation MUST accept chunk size octets with values from 0 to 16.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0235"
    object: 'v2 SEIPD packet chunk size octet'
    field: 'value no larger than 16 (4 MiB chunks) when creating'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§5.13.2'
    text: 'An implementation MUST NOT create data with a chunk size octet value larger than 16 (4 MiB chunks).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0236"
    object: 'Padding packet'
    field: 'ignored on receipt'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§5.14'
    text: 'Such a packet MUST be ignored when received.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0237"
    object: 'Padding packet contents'
    field: 'random octets'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§5.14'
    text: 'Its contents SHOULD be random octets to make the length obfuscation it provides more robust even when compressed.'
    kind: stated
    testable: partial
    testable_reason: 'randomness quality cannot be established from output; compressibility of the contents is a weak proxy'
    status: active
  - id: "rfc-9580#R-0238"
    object: 'Padding packet placement'
    field: 'end of a v6 Transferable Public Key over an encrypted channel; last packet of an Optionally Padded Message inside a v2 SEIPD packet'
    verb: SHOULD
    actor: 'implementation adding padding'
    locator: '§5.14'
    text: 'An implementation adding padding to an OpenPGP stream SHOULD place such a packet: * At the end of a version 6 Transferable Public Key that is transferred over an encrypted channel (see Section 10.1). * As the last packet of an Optionally Padded Message within a version 2 Symmetrically Encrypted and Integrity Protected Data packet (see Section 10.3.1).'
    kind: stated
    testable: partial
    testable_reason: 'placement in the SEIPD case is testable; whether a channel is encrypted is outside the packet stream'
    status: active
  - id: "rfc-9580#R-0239"
    object: 'Padding packet'
    field: 'processed wherever it appears in an OpenPGP stream'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§5.14'
    text: 'An implementation MUST be able to process Padding packets anywhere else in an OpenPGP stream so that future revisions of this document may specify further locations for padding.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0240"
    object: 'base64 armor data'
    field: 'line length no more than 76 characters'
    verb: none
    actor: 'generating implementation'
    locator: '§6'
    text: 'The base64 encoding used is described in Section 4 of [RFC4648], and it is wrapped into lines of no more than 76 characters each.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0241"
    object: 'base64 decoding'
    field: 'whitespace in base64 data ignored'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§6'
    text: 'When decoding base64, an OpenPGP implementation MUST ignore all whitespace.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0242"
    object: 'ASCII Armor checksum (CRC24)'
    field: 'generator 0x864CFB, initialization 0xB704CE, computed over the binary data'
    verb: none
    actor: 'generating implementation'
    locator: '§6.1'
    text: 'The CRC is computed by using the generator 0x864CFB and an initialization of 0xB704CE.  The accumulation is done on the data before it is converted to base64 rather than on the converted data.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0243"
    object: 'ASCII Armor checksum (CRC24 footer)'
    field: 'position: next line after the base64-encoded data'
    verb: MUST
    actor: 'generating implementation'
    locator: '§6.1'
    text: 'If present, the checksum with its leading equal sign MUST appear on the next line after the base64-encoded data.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0244"
    object: 'ASCII Armor checksum (CRC24 footer)'
    field: 'no rejection on present, missing, malformed or mismatching CRC24'
    verb: MUST NOT
    actor: 'receiving implementation'
    locator: '§6.1'
    text: 'An implementation MUST NOT reject an OpenPGP object when the CRC24 footer is present, missing, malformed, or disagrees with the computed CRC24 sum.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0245"
    object: 'ASCII Armor checksum (CRC24 footer)'
    field: 'not generated unless needed for interoperability'
    verb: SHOULD NOT
    actor: 'generating implementation'
    locator: '§6.1'
    text: 'When forming ASCII Armor, the CRC24 footer SHOULD NOT be generated, unless interoperability with implementations that require the CRC24 footer to be present is a concern.'
    kind: stated
    testable: partial
    testable_reason: 'whether interoperability is "a concern" is a judgement of the generator; absence of the footer in default output is testable'
    status: active
  - id: "rfc-9580#R-0246"
    object: 'ASCII Armor checksum (CRC24 footer)'
    field: 'not generated when the consumer is known to accept footer-less blocks'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§6.1'
    text: 'The CRC24 footer MUST NOT be generated if it can be determined by the context or by the OpenPGP object being encoded that the consuming implementation accepts base64-encoded blocks without a CRC24 footer.'
    kind: stated
    testable: partial
    testable_reason: 'the general condition depends on context the tester cannot always observe; the four listed cases that follow it are directly testable'
    status: active
  - id: "rfc-9580#R-0247"
    object: 'ASCII-armored Encrypted Message ending in v2 SEIPD'
    field: 'no CRC24 footer'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§6.1'
    text: 'An ASCII-armored Encrypted Message packet sequence that ends in a v2 SEIPD packet MUST NOT contain a CRC24 footer.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0248"
    object: 'ASCII-armored sequence of only v6 Signature packets'
    field: 'no CRC24 footer'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§6.1'
    text: 'An ASCII-armored sequence of Signature packets that only includes version 6 Signature packets MUST NOT contain a CRC24 footer.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0249"
    object: 'ASCII-armored Transferable Public Key of a v6 key'
    field: 'no CRC24 footer'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§6.1'
    text: 'An ASCII-armored Transferable Public Key packet sequence of a version 6 key MUST NOT contain a CRC24 footer.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0250"
    object: 'ASCII-armored keyring of only v6 keys'
    field: 'no CRC24 footer'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§6.1'
    text: 'An ASCII-armored keyring consisting of only version 6 keys MUST NOT contain a CRC24 footer.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0251"
    object: 'ASCII Armor'
    field: 'use to protect raw binary data permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§6.2'
    text: 'An OpenPGP implementation MAY use ASCII Armor to protect raw binary data.'
    kind: stated
    testable: no
    testable_reason: 'permission; nothing to test beyond the armor format itself'
    status: active
  - id: "rfc-9580#R-0252"
    object: 'Armor Header Line'
    field: 'starts at the beginning of a line'
    verb: MUST
    actor: 'generating implementation'
    locator: '§6.2.1'
    text: 'Therefore, the header lines MUST start at the beginning of a line'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0253"
    object: 'Armor Header Line'
    field: 'no text other than whitespace after it on the same line'
    verb: MUST NOT
    actor: 'generating implementation'
    locator: '§6.2.1'
    text: 'and MUST NOT have text other than whitespace following them on the same line.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0254"
    object: 'Armor Header'
    field: 'key and value separated by a colon and a single space'
    verb: none
    actor: 'generating implementation'
    locator: '§6.2.2'
    text: 'A colon (: 0x3A) and a single space (0x20) separate the key and value.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0255"
    object: 'Armor Headers (improperly formatted)'
    field: 'effort to recover rather than fail'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§6.2.2'
    text: 'An OpenPGP implementation may consider improperly formatted Armor Headers to be a corruption of the ASCII Armor, but it SHOULD make an effort to recover.'
    kind: stated
    testable: partial
    testable_reason: '"an effort to recover" has no defined outcome; a parser that rejects malformed headers outright can be observed'
    status: active
  - id: "rfc-9580#R-0256"
    object: 'Armor Headers (unknown keys)'
    field: 'unknown keys ignored, message processing continues'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§6.2.2'
    text: 'Unknown keys should be silently ignored, and an OpenPGP implementation SHOULD continue to process the message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0257"
    object: '"Version" Armor Header'
    field: 'not emitted except for debugging with explicit user consent'
    verb: SHOULD NOT
    actor: 'generating implementation'
    locator: '§6.2.2.1'
    text: 'To minimize metadata, implementations SHOULD NOT emit this key and its corresponding value except for debugging purposes with explicit user consent.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0258"
    object: '"Hash" Armor Header'
    field: 'emitted only for v4 SHA2 cleartext signatures that a legacy verifier may check'
    verb: SHOULD NOT
    actor: 'generating implementation'
    locator: '§6.2.2.3'
    text: 'These headers SHOULD NOT be emitted unless: * the cleartext signed message contains a version 4 signature made using a SHA2-based digest (SHA224, SHA256, SHA384, or SHA512), and * the cleartext signed message might be verified by a legacy OpenPGP implementation that requires this header.'
    kind: stated
    testable: partial
    testable_reason: 'the first condition is testable from the message; whether a legacy verifier "might" verify it is not observable'
    status: active
  - id: "rfc-9580#R-0259"
    object: '"Hash" Armor Header (non-conformant)'
    field: 'every signature in the message declined'
    verb: MUST
    actor: 'verifying application'
    locator: '§6.2.2.3'
    text: 'A verifying application MUST decline to validate any signature in a message with a non-conformant Hash header (that is, a Hash header that contains anything other than a comma-separated list of hash algorithms).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0260"
    object: '"Hash" Armor Header (conformant)'
    field: 'contents ignored; hash algorithm taken from the signature'
    verb: MUST
    actor: 'verifying application'
    locator: '§6.2.2.3'
    text: 'When a conformant Hash header is present, a verifying application MUST ignore its contents, deferring to the hash algorithm indicated in the Embedded Signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0261"
    object: '"Charset" Armor Header'
    field: 'overriding the UTF-8 default permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§6.2.2.4'
    text: 'In such instances, an implementation MAY override the UTF-8 default by using this header key.'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0262"
    object: '"Charset" Armor Header'
    field: 'implementing the key and translations permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§6.2.2.4'
    text: 'An implementation MAY implement this key and any translations it cares to;'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0263"
    object: '"Charset" Armor Header'
    field: 'ignoring the key and assuming UTF-8 permitted'
    verb: MAY
    actor: 'receiving implementation'
    locator: '§6.2.2.4'
    text: 'an implementation MAY ignore it and assume all text is UTF-8.'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0264"
    object: 'cleartext signed message: legacy Hash Armor Headers'
    field: 'may be included; ignored when well formed'
    verb: MUST
    verbs:
      - MUST
      - MAY
    actor: 'generating implementation (MAY); verifying implementation (MUST)'
    locator: '§7.1'
    text: 'One or more legacy Hash Armor Headers that MAY be included by some implementations and MUST be ignored when well formed (see Section 6.2.2.3).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0265"
    object: 'cleartext signature'
    field: 'calculated on the text with canonical <CR><LF> line endings, excluding the line ending before the armored signature'
    verb: none
    actor: 'signer; verifier'
    locator: '§7.1'
    text: 'As with any other Text signature (Section 5.2.1.2), a cleartext signature is calculated on the text using canonical <CR><LF> line endings.  As described above, the line ending before the -----BEGIN PGP SIGNATURE----- Armor Header Line of the armored signature is not considered part of the signed text.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0266"
    object: 'cleartext signed message'
    field: 'trailing spaces and tabs removed before signing or verifying'
    verb: none
    actor: 'signer; verifier'
    locator: '§7.1'
    text: 'Also, any trailing whitespace -- spaces (0x20) and tabs (0x09) -- at the end of any line is removed before signing or verifying a cleartext signed message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0267"
    object: 'cleartext signed message: Armor Headers before the first empty line'
    field: 'any header other than a well-formed Hash header causes every signature to be declined'
    verb: MUST
    actor: 'verifying implementation'
    locator: '§7.1'
    text: 'Between the -----BEGIN PGP SIGNED MESSAGE----- line and the first empty line, the only Armor Header permitted is a well-formed Hash Armor Header (see Section 6.2.2.3).  To reduce the risk of confusion about what has been signed, a verifying implementation MUST decline to validate any signature in a cleartext message if that message has any other Armor Header present in this location.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0268"
    object: 'cleartext signed message content'
    field: 'dash-escaped'
    verb: none
    actor: 'generating implementation'
    locator: '§7.2'
    text: 'The cleartext content of the message must also be dash-escaped.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0269"
    object: 'dash-escaping'
    field: 'any line may be dash-escaped'
    verb: MAY
    actor: 'generating implementation'
    locator: '§7.2'
    text: 'An implementation MAY dash-escape any line'
    kind: stated
    testable: no
    testable_reason: 'permission; a receiver handling extra escaping is covered by the MUST on reversing dash-escaping'
    status: active
  - id: "rfc-9580#R-0270"
    object: 'dash-escaping'
    field: 'lines commencing in "From " dash-escaped'
    verb: SHOULD
    actor: 'generating implementation'
    locator: '§7.2'
    text: 'SHOULD dash-escape lines commencing in "From" followed by a space'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0271"
    object: 'dash-escaping'
    field: 'lines commencing in a dash dash-escaped'
    verb: MUST
    actor: 'generating implementation'
    locator: '§7.2'
    text: 'and MUST dash-escape any line commencing in a dash.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0272"
    object: 'cleartext signature digest'
    field: 'computed over the cleartext, not the dash-escaped form'
    verb: none
    actor: 'signer; verifier'
    locator: '§7.2'
    text: 'The message digest is computed using the cleartext itself, not the dash-escaped form.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0273"
    object: 'reversing dash-escaping'
    field: 'leading "- " stripped'
    verb: MUST
    actor: 'receiving implementation'
    locator: '§7.2'
    text: 'When reversing dash-escaping, an implementation MUST strip the string - if it occurs at the beginning of a line'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0274"
    object: 'reversing dash-escaping'
    field: 'warning for "-" followed by a non-space at line start'
    verb: SHOULD
    actor: 'receiving implementation'
    locator: '§7.2'
    text: 'and it SHOULD provide a warning for - and any character other than a space at the beginning of a line.'
    kind: stated
    testable: partial
    testable_reason: 'a warning is a user-interface effect; testable only where the implementation exposes warnings'
    status: active
  - id: "rfc-9580#R-0275"
    object: 'Cleartext Signature Framework'
    field: 'not used for streams with meaningful whitespace or very large size'
    verb: SHOULD NOT
    actor: 'signing implementation'
    locator: '§7.3'
    text: 'An implementation that knows it is working with a textual stream with any of the above characteristics SHOULD NOT use the Cleartext Signature Framework.'
    kind: stated
    testable: partial
    testable_reason: 'depends on what the implementation "knows" about the stream'
    status: active
  - id: "rfc-9580#R-0276"
    object: 'algorithm registries'
    field: 'unlisted algorithms permitted only with Private or Experimental Use IDs'
    verb: MAY
    actor: 'implementations'
    locator: '§9'
    text: 'Note that these tables are not exhaustive lists; an implementation MAY implement an algorithm that is not on these lists, as long as the algorithm IDs are chosen from the Private or Experimental Use algorithm range.'
    kind: stated
    testable: partial
    testable_reason: 'the permission is untestable; the ID-range condition is testable on emitted packets'
    status: active
  - id: "rfc-9580#R-0277"
    object: 'public key algorithms'
    field: 'Ed25519 (27) and X25519 (25) implemented'
    verb: MUST
    actor: 'implementations'
    locator: '§9.1'
    text: 'Implementations MUST implement Ed25519 (27) for signatures and X25519 (25) for encryption.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0278"
    object: 'public key algorithms'
    field: 'Ed448 (28) and X448 (26) implemented'
    verb: SHOULD
    actor: 'implementations'
    locator: '§9.1'
    text: 'Implementations SHOULD implement Ed448 (28) and X448 (26).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0279"
    object: 'public key algorithm RSA (1)'
    field: 'keys not generated (interpretation permitted)'
    verb: SHOULD NOT
    actor: 'key-generating implementation'
    locator: '§9.1'
    text: 'RSA (1) keys are deprecated and SHOULD NOT be generated but may be interpreted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0280"
    object: 'public key algorithms RSA Encrypt-Only (2), RSA Sign-Only (3)'
    field: 'not generated'
    verb: MUST NOT
    actor: 'key-generating implementation'
    locator: '§9.1'
    text: 'RSA Encrypt-Only (2) and RSA Sign-Only (3) are deprecated and MUST NOT be generated (see Section 12.4).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0281"
    object: 'public key algorithm Elgamal (16)'
    field: 'keys not generated'
    verb: MUST NOT
    actor: 'key-generating implementation'
    locator: '§9.1'
    text: 'Elgamal (16) keys are deprecated and MUST NOT be generated (see Section 12.6).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0282"
    object: 'public key algorithm DSA (17)'
    field: 'keys not generated'
    verb: MUST NOT
    actor: 'key-generating implementation'
    locator: '§9.1'
    text: 'DSA (17) keys are deprecated and MUST NOT be generated (see Section 12.5).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0283"
    object: 'public key algorithms'
    field: 'any other algorithm permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§9.1'
    text: 'Implementations MAY implement any other algorithm.'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0284"
    object: 'curve OID encoding'
    field: 'only the truncated DER octets are valid'
    verb: none
    actor: 'implementations'
    locator: '§9.2'
    text: 'Only the truncated sequence of octets is the valid representation of a curve OID.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0285"
    object: 'ECC curve OIDs Ed25519Legacy, Curve25519Legacy'
    field: 'implementing for v4 compatibility permitted'
    verb: MAY
    actor: 'implementations'
    locator: '§9.2'
    text: 'Implementations MAY implement these variants for compatibility with existing version 4 key material and signatures.'
    kind: stated
    testable: no
    testable_reason: 'permission; no observable obligation'
    status: active
  - id: "rfc-9580#R-0286"
    object: 'ECC curve OIDs Ed25519Legacy, Curve25519Legacy'
    field: 'v6 key material with these OIDs neither accepted nor generated'
    verb: MUST NOT
    actor: 'implementations (generating and receiving)'
    locator: '§9.2'
    text: 'Implementations MUST NOT accept or generate version 6 key material using the deprecated OIDs.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0287"
    object: 'symmetric key algorithms'
    field: 'AES-128 implemented'
    verb: MUST
    actor: 'implementations'
    locator: '§9.3'
    text: 'Implementations MUST implement AES-128.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0288"
    object: 'symmetric key algorithms'
    field: 'AES-256 implemented'
    verb: SHOULD
    actor: 'implementations'
    locator: '§9.3'
    text: 'Implementations SHOULD implement AES-256.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0289"
    object: 'symmetric key algorithms IDEA, TripleDES, CAST5'
    field: 'not used to encrypt'
    verb: MUST NOT
    actor: 'encrypting implementation'
    locator: '§9.3'
    text: 'Implementations MUST NOT encrypt data with IDEA, TripleDES, or CAST5.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9580#R-0290"
