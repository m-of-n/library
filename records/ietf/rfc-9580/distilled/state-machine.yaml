record: rfc-9580
reviewed_by: ""
kind: state-machine
source: 'RFC 9580, OpenPGP, Standards Track, July 2024'
source_digest: '36540e57b63d24c0b17be0748b704bdeed3d643ce99a4fb1abb6469c1eb1ff18'
extracted: "2026-10-13"
extracted_by: 'claude, FX-1 pass 1, state-machine agent, effort max, from the source text only'
note: >-
  Every lifecycle RFC 9580 describes, as machines an implementation or a test
  harness can drive. RFC 9580 is a data format, not a wire protocol: there
  are no sessions, no peers exchanging messages in turn and no timers. Every
  machine here is therefore one party processing objects: a consumer parsing
  an octet stream against a grammar (M01 to M04, M15, M16), a verifier or
  decryptor running a check sequence over one object (M05, M11 to M14), or an
  evaluator deriving the status of a key, User ID, certification or
  introducer at an evaluation time t from the signatures it holds (M06 to
  M10). The producer side (what a generator MUST and MUST NOT emit) is not a
  lifecycle and is cited only where it constrains what a consumer can meet.

  Machines. M01 packet framing (section 4: headers, length forms, partial
  bodies, criticality). M02 the OpenPGP Message grammar of 10.3 as a
  pushdown automaton, with unwrapping of compressed and encrypted data
  (10.3.1) and one-pass and prefixed signatures. M03 the detached-signature
  sequence (10.4). M04 Transferable Public and Secret Keys (10.1, 10.2): v6,
  v4, v3, revocation certificates, keyrings. M05 verification of one
  signature (5.2, 5.2.4, 5.2.5, 9.5, 12). M06 primary-key validity over
  time, including hard and soft revocation and the deprecated designated
  revoker. M07 subkey validity. M08 User ID and User Attribute binding by
  self-signature. M09 the lifecycle of one certification (expiry,
  revocation, irrevocability, exportability). M10 trust-signature evaluation
  along an introducer chain. M11 recovering a session key from PKESK and
  SKESK packets (5.1, 5.3, 10.3.2.1). M12 v1 SEIPD (and legacy SED)
  decryption with the MDC. M13 v2 SEIPD AEAD chunk decryption with
  truncation handling (5.13.2, 13.7). M14 secret key unlock through the S2K
  usage octet and S2K specifier (3.7, 5.5.3). M15 ASCII Armor decoding (6).
  M16 the Cleartext Signature Framework (7) including dash-unescaping.

  Steps. A control state that runs a check sequence carries steps, in the
  order an implementation can run them. A step is a check, an action or an
  invoke. applies_when says when it runs ('always' if it always runs). A
  check that fails takes the transition named in on_failure. Step ids are
  ours; the source numbers none of these sequences.

  Notation in guards and actions. t is the evaluation time (a time field,
  section 3.5: seconds since 1970-01-01 UTC). sig.x is field or subpacket x
  of the Signature packet in hand; key.created is the key creation time
  field of a key packet. := is assignment. tag(p) is the Packet Type ID of
  packet p. Hexadecimal values are written 0xNN. Sets are written in
  braces; {} is the empty set. The short field names map onto the field
  names of messages.yaml as follows: sig.version, key.version = version;
  sig.type = signature-type; sig.pk_algo = public-key-algorithm;
  sig.hash_algo = hash-algorithm (signature-v3, signature-v4,
  signature-v6); the salt size octet = salt-length; the hashed-material
  length octet (v3) = hashed-length; the left-16-bits field = hash-left-16;
  key.created, subkey.created = creation-time (public-key-v3, public-key-v4,
  public-key-v6); OPS.nested_flag and the nested_flag of an ops frame =
  nested (ops-v3, ops-v6); the sig_type, hash_algo, pk_algo, key_id and
  fingerprint of an ops frame = signature-type, hash-algorithm,
  public-key-algorithm, key-id and fingerprint of the OPS; the S2K usage
  octet = s2k-usage (secret-key); c of M13 = chunk-size (seipd-v2); t, p and
  encoded_m of M14 = t, p and encoded-m (s2k-argon2).

  From and to. from names one state, several states joined by 'or', 'any
  state', or 'any non-final state' (every state not in terminal_states),
  optionally 'other than' a named state. to 'same state' is a self-loop on
  each from state; a to of several states joined by 'or' is chosen by the
  guard.

  Triggers. A packet trigger is named by the source's own shorthand from
  Table 3 (section 5): PKESK, SIG, SKESK, OPS, SECKEY, PUBKEY, SECSUBKEY,
  COMP, SED, MARKER, LIT, TRUST, UID, PUBSUBKEY, UAT, SEIPD, PADDING. One
  shorthand covers every version of its packet, so it maps onto one or more
  messages.yaml entries; messages_yaml on each packet event (and on the
  stream events next_octet and text_line) names them. Every
  other trigger is a named event defined under events_used with a locator.
  A trigger written 'X or Y' (or 'X, Y or Z') fires on any of the named
  events. A trigger written 'any packet event not accepted by another
  transition from the current state' fires on each packet event above for
  which no other transition from the current state has a guard that holds.
  completion is the UML completion event: the activity of the source state
  has finished and the guards choose the branch. ignorable(p) holds for
  MARKER, PADDING, an unknown non-critical packet (Type IDs 40 to 63), and
  TRUST outside a local keyring file (see the M02 note and OQ-05).

  Quotes. Every quote is one contiguous run of source characters with the RFC
  line wrapping undone: a line break and the indent that follows become one
  space, and a line-final hyphen inside a word joins the next line with no
  space. Spacing inside a line, including the two spaces the RFC puts after a
  full stop, is kept. The source file has no page furniture. No two passages
  are spliced; a quote is reused where one sentence supports several
  elements. Quotes were checked mechanically against .cache/rfc-9580.txt.

  Flags and fields. basis: stated marks an element the source states;
  basis: inferred marks a state, step or transition the source does not
  literally state, and inferred_reason says what was supplied. Machine,
  state, step and event names are ours. error_states are states in which the
  machine yields no usable result. unspecified entries record situations the
  source leaves open; each points into open_questions and is not a
  transition. constrained_by lists the rfc-9580#R-NNNN entries whose text is
  quoted by, or governs, the element; it was checked mechanically to name
  only ids that exist in requirements.yaml.

events_used:
  # ---------------------------------------------------------------- packets
  - name: 'PKESK'
    kind: 'packet'
    messages_yaml: ['pkesk-v3', 'pkesk-v6']
    locator: '§5.1'
    quote: 'Zero or more PKESK packets and/or SKESK packets (Section 5.3) precede an encryption container (that is, a Symmetrically Encrypted and Integrity Protected Data (SEIPD) packet or -- for historic data -- a Symmetrically Encrypted Data (SED) packet), which holds an Encrypted Message.'
    note: 'Public Key Encrypted Session Key Packet, Type ID 1, versions 3 and 6.'
  - name: 'SIG'
    kind: 'packet'
    messages_yaml: ['signature-v3', 'signature-v4', 'signature-v6']
    locator: '§5.2'
    quote: 'A Signature packet describes a binding between some public key and some data.'
    note: 'Signature Packet, Type ID 2, versions 3, 4 and 6. Where a guard names a signature type it is the Signature Type ID of Table 4.'
  - name: 'SKESK'
    kind: 'packet'
    messages_yaml: ['skesk-v4', 'skesk-v6']
    locator: '§5.3'
    quote: 'The Symmetric Key Encrypted Session Key (SKESK) packet holds the symmetric key encryption of a session key used to encrypt a message.'
    note: 'Type ID 3, versions 4 and 6.'
  - name: 'OPS'
    kind: 'packet'
    messages_yaml: ['ops-v3', 'ops-v6']
    locator: '§5.4'
    quote: 'The One-Pass Signature packet precedes the signed data and contains enough information to allow the receiver to begin calculating any hashes needed to verify the signature.'
    note: 'One-Pass Signature Packet, Type ID 4, versions 3 and 6.'
  - name: 'SECKEY'
    kind: 'packet'
    messages_yaml: ['secret-key']
    locator: '§5.5.1.3'
    quote: 'A Secret Key packet contains all the information that is found in a Public Key packet, including the public key material, but it also includes the secret key material after all the public key fields.'
    note: 'Type ID 5.'
  - name: 'PUBKEY'
    kind: 'packet'
    messages_yaml: ['public-key-v3', 'public-key-v4', 'public-key-v6']
    locator: '§5.5.1.1'
    quote: 'A Public Key packet starts a series of packets that forms an OpenPGP Key (sometimes called an OpenPGP certificate).'
    note: 'Type ID 6, versions 2, 3, 4 and 6.'
  - name: 'SECSUBKEY'
    kind: 'packet'
    messages_yaml: ['secret-key']
    locator: '§5.5.1.4'
    quote: 'A Secret Subkey packet (Type ID 7) is the subkey analog of the Secret Key packet and has exactly the same format.'
  - name: 'COMP'
    kind: 'packet'
    messages_yaml: ['compressed-data']
    locator: '§5.6'
    quote: 'A Compressed Data packet''s body contains data that is a compression of a series of OpenPGP packets.'
    note: 'Compressed Data Packet, Type ID 8.'
  - name: 'SED'
    kind: 'packet'
    messages_yaml: ['symmetrically-encrypted-data']
    locator: '§5.7'
    quote: 'This packet is obsolete.  An implementation MUST NOT create this packet.'
    note: 'Symmetrically Encrypted Data Packet, Type ID 9.'
  - name: 'MARKER'
    kind: 'packet'
    messages_yaml: ['marker']
    locator: '§5.8'
    quote: 'Such a packet MUST be ignored when received.'
    note: 'Marker Packet, Type ID 10, body 0x50 0x47 0x50.'
  - name: 'LIT'
    kind: 'packet'
    messages_yaml: ['literal-data']
    locator: '§5.9'
    quote: 'A Literal Data packet contains the body of a message; that is, data that is not to be further interpreted.'
    note: 'Type ID 11.'
  - name: 'TRUST'
    kind: 'packet'
    messages_yaml: ['trust']
    locator: '§5.10'
    quote: 'The Trust packet is used only within keyrings and is not normally exported.'
    note: 'Type ID 12; format implementation-defined.'
  - name: 'UID'
    kind: 'packet'
    messages_yaml: ['user-id']
    locator: '§5.11'
    quote: 'A User ID packet consists of UTF-8 text that is intended to represent the name and email address of the keyholder.'
    note: 'Type ID 13.'
  - name: 'PUBSUBKEY'
    kind: 'packet'
    messages_yaml: ['public-key-v4', 'public-key-v6']
    locator: '§5.5.1.2'
    quote: 'A Public Subkey packet (Type ID 14) has exactly the same format as a Public Key packet, but it denotes a subkey.'
  - name: 'UAT'
    kind: 'packet'
    messages_yaml: ['user-attribute']
    locator: '§5.12'
    quote: 'Except as noted, a User Attribute packet may be used anywhere that a User ID packet may be used.'
    note: 'User Attribute Packet, Type ID 17.'
  - name: 'SEIPD'
    kind: 'packet'
    messages_yaml: ['seipd-v1', 'seipd-v2']
    locator: '§5.13'
    quote: 'The SEIPD packet contains integrity-protected and encrypted data.'
    note: 'Type ID 18, versions 1 and 2.'
  - name: 'PADDING'
    kind: 'packet'
    messages_yaml: ['padding']
    locator: '§5.14'
    quote: 'The Padding packet contains random data and can be used to defend against traffic analysis (see Section 13.11) on v2 SEIPD messages (see Section 5.13.2) and Transferable Public Keys (see Section 10.1).'
    note: 'Type ID 21.'
  - name: 'unknown_critical_packet'
    kind: 'event'
    messages_yaml: ['packet-type-0-reserved', 'packet-type-15-16-unlisted', 'packet-type-19-reserved-mdc', 'packet-type-20-reserved', 'packet-type-22-39-unassigned-critical']
    locator: '§4.3'
    quote: 'Packets with Type IDs from 0 to 39 are critical.  Packets with Type IDs from 40 to 63 are non-critical.'
    basis: inferred
    inferred_reason: 'The source defines the partition, not an event. Raised by M01 for a complete packet whose Type ID is in 0 to 39 and is not one of the packets above: 22 to 39 (unassigned), the reserved IDs 0, 19 and 20, and 15 and 16, which Table 3 does not list (see OQ-02).'
  - name: 'unknown_noncritical_packet'
    kind: 'event'
    messages_yaml: ['packet-type-40-59-unassigned-non-critical', 'packet-type-60-63-private']
    locator: '§4.3'
    quote: 'On the other hand, an unknown non-critical packet MUST be ignored.'
    basis: inferred
    inferred_reason: 'Raised by M01 for a complete packet whose Type ID is in 40 to 63 and that the implementation does not implement.'
  # ---------------------------------------------------------------- stream
  - name: 'next_octet'
    kind: 'event'
    messages_yaml: ['packet-header-openpgp', 'packet-header-legacy', 'packet-length-openpgp']
    locator: '§4.2'
    quote: 'The first octet of the packet denotes the format of the rest of the header, and it encodes the Packet Type ID, indicating the type of the packet (see Section 5).'
    basis: inferred
    inferred_reason: 'One octet of the stream being parsed is available to M01.'
  - name: 'end_of_stream'
    kind: 'event'
    locator: '§10.3.1'
    quote: 'The packet boundaries found in the series of octets are expected to align with the length of the unwrapped octet stream.'
    basis: inferred
    inferred_reason: 'The end of the input being parsed: the end of a file or transport object at top level, or the end of the unwrapped octet stream of a Compressed Data, SED or SEIPD packet (M01 to M04); the end of the encrypted data in the body of the SED or SEIPD packet (M12, M13); the end of the text input (M15, M16).'
  - name: 'completion'
    kind: 'event'
    locator: 'none'
    basis: inferred
    inferred_reason: 'Modelling device, not source text: the activity of the source state has finished and the guards choose the branch.'
  - name: 'unwrap_accepted'
    kind: 'event'
    locator: '§10.3.1'
    quote: 'When any unwrapping is performed, the resulting stream of octets is parsed into a series of OpenPGP packets like any other stream of octets.'
    basis: inferred
    inferred_reason: 'Raised to a parent M02 instance when the child M02 instance parsing the unwrapped stream reaches accepted.'
  - name: 'unwrap_rejected'
    kind: 'event'
    locator: '§10.3.1'
    quote: 'Decompressing a Compressed Data packet MUST also yield a valid OpenPGP Message.'
    basis: inferred
    inferred_reason: 'Raised to a parent M02 instance when the child instance reaches rejected, when decompression fails, or when M11, M12 or M13 ends in an error state.'
  - name: 'text_line'
    kind: 'event'
    messages_yaml: ['ascii-armor', 'cleartext-signed-message']
    locator: '§6.2, §7.1'
    quote: 'Note that all of these Armor Header Lines are to consist of a complete line.'
    basis: inferred
    inferred_reason: 'One line of text input to M15 or M16, without its line ending.'
  # ---------------------------------------------------------------- time
  - name: 'clock_reaches_creation'
    kind: 'event'
    locator: '§5.5.2.2'
    quote: 'A 4-octet number denoting the time that the key was created.'
    basis: inferred
    inferred_reason: 'The source gives the creation time field; the clock event is ours.'
  - name: 'clock_passes_key_expiration'
    kind: 'event'
    locator: '§5.2.3.13'
    quote: 'This is the number of seconds after the key creation time that the key expires.'
    basis: inferred
    inferred_reason: 'The source gives the offset; the clock event (t reaches key.created + Key Expiration Time) is ours. OQ-21 on the boundary instant.'
  - name: 'clock_passes_signature_expiration'
    kind: 'event'
    locator: '§5.2.3.18'
    quote: 'This is the number of seconds after the Signature Creation Time that the signature expires.'
    basis: inferred
    inferred_reason: 'The source gives the offset; the clock event (t reaches creation + Signature Expiration Time) is ours.'
  # ---------------------------------------------------------------- inputs
  - name: 'passphrase_supplied'
    kind: 'event'
    locator: '§3.7'
    quote: 'A string-to-key (S2K) Specifier is used to convert a passphrase string into a symmetric key encryption/decryption key.'
    basis: inferred
    inferred_reason: 'The user (or a caller) supplies a passphrase to M11 (SKESK) or M14 (secret key unlock).'
  - name: 'chunk_available'
    kind: 'event'
    locator: '§5.13.2'
    quote: 'The encrypted data consists of the encryption of each chunk of plaintext, followed immediately by the relevant authentication tag.'
    basis: inferred
    inferred_reason: 'M13 has buffered chunk_size ciphertext octets plus one tag and more octets follow, so the buffered octets are a full non-final chunk.'
  - name: 'decompression_failure'
    kind: 'event'
    locator: '§13.7'
    quote: 'Within any encrypted container, any Compressed Data packet (Section 5.6) where there is a decompression failure.'
    basis: inferred
    inferred_reason: 'The decompressor fails on the body of a COMP packet. It is not a trigger of its own: M02 receives it as unwrap_rejected (M02-T16), whose actions single out a decompression failure inside an encrypted container.'
  - name: 'stream_malformed'
    kind: 'event'
    locator: '§4.1, §10.3.1'
    quote: 'If an implementation encounters a packet whose header length indicates that it would extend beyond the boundaries of the unwrapped octet stream, the implementation MUST reject that packet as malformed and unusable.'
    basis: inferred
    inferred_reason: 'Raised by M01 to its sequence machine (M02, M03 or M04) when M01 reaches malformed: the stream cannot be cut into packets, so no further packet or end_of_stream reaches the sequence machine. Added in pass 3: without it a sequence machine had no transition for a framing failure.'
  # ---------------------------------------------------------------- status
  - name: 'primary_status_change'
    kind: 'event'
    locator: '§5.2.1.11'
    quote: 'A revoked key is not to be used.'
    basis: inferred
    inferred_reason: 'Raised to an M07 instance when the M06 state of its primary key changes (by a clock event, a new self-signature or a revocation). The source gives no event; that a subkey follows its primary is our reading (OQ-24).'
  - name: 'key_export_or_import'
    kind: 'event'
    locator: '§5.2.3.19'
    quote: 'Thus, when an implementation prepares a user''s copy of a key for transport to another user (this is the process of "exporting" the key), any local certification signatures are deleted from the key.'
    basis: inferred
    inferred_reason: 'An implementation prepares a key for transport (export) or receives a transported key (import). The source describes the processes; the event is ours.'

machines:
  # ======================================================================
  - id: 'M01'
    name: 'packet-framing'
    locator: '§4.1, §4.2, §4.2.1, §4.2.1.1 to §4.2.1.4, §4.2.2, §4.3, §10.3.1'
    actor: 'consumer: the packet reader under every sequence machine (M02, M03, M04) and under every unwrapped stream'
    purpose: 'Cut an octet stream into packets: decode the header octet (OpenPGP or Legacy format), the length form (1-, 2-, 5-octet, Partial Body Length, Legacy indeterminate), deliver each complete packet with its Type ID to the sequence machine, classify unknown types by criticality, and stop on a malformed stream.'
    state_variables:
      - name: 'tag'
        type: 'Packet Type ID, 0 to 63 (OpenPGP format) or 0 to 15 (Legacy format)'
        source:
          - locator: '§4.2'
            quote: 'Note that Legacy format headers only have 4 bits for the Packet Type ID and hence can only encode Packet Type IDs less than 16, whereas the OpenPGP format headers can encode IDs as great as 63.'
      - name: 'remaining'
        type: 'octets of the current body portion still to read'
      - name: 'partial'
        type: 'boolean: the packet uses Partial Body Length headers'
      - name: 'first_partial'
        type: 'boolean: the next Partial Body Length header is the first of the packet'
    initial: 'at-boundary'
    states:
      - name: 'at-boundary'
        meaning: 'Positioned at the offset where the previous packet header says the next packet starts (or at the start of the stream).'
        basis: stated
        source:
          - locator: '§4.1'
            quote: 'An implementation handling a packet stream that wants to find the next packet MUST look for it at the precise offset indicated in the previous packet header.'
        constrained_by: ['rfc-9580#R-0020']
      - name: 'openpgp-length'
        meaning: 'OpenPGP format header octet read; the first length octet is next.'
        basis: stated
      - name: 'legacy-length'
        meaning: 'Legacy format header octet read; length-type (bits 1-0) selects the length field.'
        basis: stated
      - name: 'reading-body'
        meaning: 'Reading the final (or only) body portion of definite length.'
        basis: stated
      - name: 'reading-partial'
        meaning: 'Reading a body portion announced by a Partial Body Length header; another length header follows it.'
        basis: stated
      - name: 'partial-next-length'
        meaning: 'A partial portion is consumed; the next length header of the same packet is next.'
        basis: stated
      - name: 'reading-indeterminate'
        meaning: 'Legacy length-type 3: the body runs to the end of the stream.'
        basis: stated
      - name: 'packet-complete'
        meaning: 'The whole body is read and is delivered to the sequence machine as the trigger named by tag.'
        basis: inferred
      - name: 'end'
        meaning: 'End of stream at a packet boundary.'
        basis: inferred
      - name: 'malformed'
        meaning: 'The stream cannot be cut into packets; parsing stops and stream_malformed is raised to the sequence machine.'
        basis: inferred
        kind: 'error'
    transitions:
      - id: 'M01-T01'
        from: 'at-boundary'
        to: 'openpgp-length'
        trigger: 'next_octet'
        guard: 'octet & 0xC0 = 0xC0 (bit 7 and bit 6 set).'
        actions: ['tag := octet & 0x3F', 'partial := false', 'first_partial := true']
        source:
          - locator: '§4.2'
            quote: 'Bit 6 of the first octet of the packet header indicates whether the packet is encoded in the OpenPGP or Legacy packet format.'
        basis: stated
        constrained_by: ['rfc-9580#R-0020']
      - id: 'M01-T02'
        from: 'at-boundary'
        to: 'legacy-length'
        trigger: 'next_octet'
        guard: 'octet & 0xC0 = 0x80 (bit 7 set, bit 6 clear).'
        actions: ['tag := (octet >> 2) & 0x0F', 'length_type := octet & 0x03']
        source:
          - locator: '§4.2'
            quote: 'The Legacy packet format MAY be used when consuming packets to facilitate interoperability and accessing archived data.'
        basis: stated
        constrained_by: ['rfc-9580#R-0023']
        note: 'A consumer that does not implement the Legacy format takes M01-T03 instead (inferred).'
      - id: 'M01-T03'
        from: 'at-boundary'
        to: 'malformed'
        trigger: 'next_octet'
        guard: 'octet & 0x80 = 0 (bit 7 clear).'
        source:
          - locator: '§4.2'
            quote: 'Note that the most significant bit is the leftmost bit, called "bit 7".'
        basis: inferred
        inferred_reason: 'The figure says bit 7 is always one in both formats; the source does not say what a consumer does with a header octet whose bit 7 is zero (OQ-01).'
      - id: 'M01-T04'
        from: 'at-boundary'
        to: 'end'
        trigger: 'end_of_stream'
        guard: 'always'
        basis: inferred
        inferred_reason: 'A stream ending at a packet boundary is complete as far as framing goes; whether the sequence is complete is the sequence machine''s guard.'
      - id: 'M01-T05'
        from: 'openpgp-length'
        to: 'reading-body'
        trigger: 'next_octet'
        guard: 'o1 < 192.'
        actions: ['remaining := o1']
        source:
          - locator: '§4.2.1.1'
            quote: 'A 1-octet Body Length header encodes a length of 0 to 191 octets. This type of length header is recognized because the 1-octet value is less than 192.'
        basis: stated
      - id: 'M01-T06'
        from: 'openpgp-length'
        to: 'reading-body'
        trigger: 'next_octet'
        guard: '192 <= o1 <= 223; one more octet o2 is read.'
        actions: ['remaining := ((o1 - 192) << 8) + o2 + 192']
        source:
          - locator: '§4.2.1.2'
            quote: 'It is recognized because its first octet is in the range 192 to 223.'
        basis: stated
      - id: 'M01-T07'
        from: 'openpgp-length'
        to: 'reading-body'
        trigger: 'next_octet'
        guard: 'o1 = 255; four more octets o2..o5 are read.'
        actions: ['remaining := (o2 << 24) | (o3 << 16) | (o4 << 8) | o5']
        source:
          - locator: '§4.2.1.3'
            quote: 'A 5-octet Body Length header consists of a single octet holding the value 255, followed by a 4-octet scalar.'
        basis: stated
      - id: 'M01-T08'
        from: 'openpgp-length'
        to: 'reading-partial'
        trigger: 'next_octet'
        guard: '224 <= o1 <= 254.'
        actions: ['remaining := 1 << (o1 & 0x1F)', 'partial := true', 'first_partial := false']
        source:
          - locator: '§4.2.1.4'
            quote: 'It is recognized by its 1-octet value that is greater than or equal to 224, and less than 255.'
          - locator: '§4.2.1.4'
            quote: 'An implementation MAY use Partial Body Lengths for data packets, whether they are literal, compressed, or encrypted.  The first partial length MUST be at least 512 octets long.  Partial Body Lengths MUST NOT be used for any other packet types.'
        basis: stated
        constrained_by: ['rfc-9580#R-0027', 'rfc-9580#R-0028', 'rfc-9580#R-0029']
        unspecified:
          - 'tag not in {LIT, COMP, SED, SEIPD}, or a first partial length below 512: the requirements bind the producer; what a consumer does is not stated (OQ-03).'
      - id: 'M01-T09'
        from: 'legacy-length'
        to: 'reading-body'
        trigger: 'next_octet'
        guard: 'length_type in {0, 1, 2}; 1, 2 or 4 length octets are read.'
        actions: ['remaining := the 1-, 2- or 4-octet scalar']
        source:
          - locator: '§4.2.2'
            quote: 'The packet has a 1-octet length.  The header is 2 octets long.'
          - locator: '§4.2.2'
            quote: 'The packet has a 4-octet length.  The header is 5 octets long.'
        basis: stated
      - id: 'M01-T10'
        from: 'legacy-length'
        to: 'reading-indeterminate'
        trigger: 'completion'
        guard: 'length_type = 3 and the implementation accepts indeterminate length.'
        source:
          - locator: '§4.2.2'
            quote: 'If the packet is in a file, it means that the packet extends until the end of the file.'
          - locator: '§4.2.2'
            quote: 'An implementation MAY interpret an indeterminate length Legacy format packet in order to deal with historic data or data generated by a legacy system that predates support for [RFC2440].'
        basis: stated
        constrained_by: ['rfc-9580#R-0031']
      - id: 'M01-T11'
        from: 'legacy-length'
        to: 'malformed'
        trigger: 'completion'
        guard: 'length_type = 3 and the implementation does not accept indeterminate length.'
        basis: inferred
        inferred_reason: 'R-0031 is a permission; refusing it leaves no way to find the packet end.'
        constrained_by: ['rfc-9580#R-0031']
      - id: 'M01-T12'
        from: 'reading-partial'
        to: 'partial-next-length'
        trigger: 'next_octet'
        guard: 'remaining octets of the portion consumed.'
        source:
          - locator: '§4.2.1.4'
            quote: 'Each Partial Body Length header is followed by a portion of the packet body data; the Partial Body Length header specifies this portion''s length.  Another length header (1-octet, 2-octet, 5-octet, or partial) follows that portion.'
        basis: stated
      - id: 'M01-T13'
        from: 'partial-next-length'
        to: 'reading-partial'
        trigger: 'next_octet'
        guard: '224 <= o1 <= 254.'
        actions: ['remaining := 1 << (o1 & 0x1F)']
        source:
          - locator: '§4.2.1.4'
            quote: 'Partial Body Length headers may only be used for the non-final parts of the packet.'
        basis: stated
      - id: 'M01-T14'
        from: 'partial-next-length'
        to: 'reading-body'
        trigger: 'next_octet'
        guard: 'o1 < 224 or o1 = 255 (a 1-, 2- or 5-octet length; zero is allowed).'
        actions: ['remaining := decoded length, as in M01-T05 to M01-T07']
        source:
          - locator: '§4.2.1.4'
            quote: 'The last length header in the packet MUST NOT be a Partial Body Length header.'
          - locator: '§4.2.1.4'
            quote: 'Note also that the last Body Length header can be a zero-length header.'
        basis: stated
        constrained_by: ['rfc-9580#R-0026']
      - id: 'M01-T15'
        from: 'reading-partial'
        to: 'malformed'
        trigger: 'end_of_stream'
        guard: 'always (the stream ends inside, or right after, a partial portion).'
        source:
          - locator: '§4.2.1.4'
            quote: 'The last length header in the packet MUST NOT be a Partial Body Length header.'
        basis: inferred
        inferred_reason: 'A packet whose last header is partial violates R-0026; the consumer action is not stated, but the packet has no end.'
        constrained_by: ['rfc-9580#R-0026']
      - id: 'M01-T16'
        from: 'partial-next-length'
        to: 'malformed'
        trigger: 'end_of_stream'
        guard: 'always'
        basis: inferred
        inferred_reason: 'Same as M01-T15: the final non-partial length header is missing.'
        constrained_by: ['rfc-9580#R-0026']
      - id: 'M01-T17'
        from: 'reading-body'
        to: 'packet-complete'
        trigger: 'next_octet'
        guard: 'remaining octets consumed (immediately, if remaining = 0).'
        source:
          - locator: '§4.1'
            quote: 'When handling a stream of packets, the length information in each packet header is the canonical source of packet boundaries.'
        basis: stated
        constrained_by: ['rfc-9580#R-0020', 'rfc-9580#R-0022']
      - id: 'M01-T18'
        from: 'reading-body'
        to: 'malformed'
        trigger: 'end_of_stream'
        guard: 'remaining > 0.'
        source:
          - locator: '§10.3.1'
            quote: 'If an implementation encounters a packet whose header length indicates that it would extend beyond the boundaries of the unwrapped octet stream, the implementation MUST reject that packet as malformed and unusable.'
        basis: stated
        constrained_by: ['rfc-9580#R-0334', 'rfc-9580#R-0335']
        note: 'Stated for unwrapped streams; applied to the top-level stream by inference.'
      - id: 'M01-T19'
        from: 'reading-indeterminate'
        to: 'packet-complete'
        trigger: 'end_of_stream'
        guard: 'always'
        source:
          - locator: '§4.2.2'
            quote: 'The header is 1 octet long, and the implementation must determine how long the packet is.'
        basis: stated
        constrained_by: ['rfc-9580#R-0031']
      - id: 'M01-T20'
        from: 'packet-complete'
        to: 'at-boundary'
        trigger: 'completion'
        guard: 'tag names a packet the implementation implements.'
        actions: ['deliver the packet to the sequence machine as trigger PKESK, SIG, SKESK, OPS, SECKEY, PUBKEY, SECSUBKEY, COMP, SED, MARKER, LIT, TRUST, UID, PUBSUBKEY, UAT, SEIPD or PADDING']
        source:
          - locator: '§4.1'
            quote: 'Each packet consists of a packet header, followed by the packet body.'
        basis: stated
        constrained_by: ['rfc-9580#R-0020']
      - id: 'M01-T21'
        from: 'packet-complete'
        to: 'at-boundary'
        trigger: 'completion'
        guard: 'tag is in 40 to 63 and not implemented.'
        actions: ['deliver unknown_noncritical_packet (every sequence machine ignores it)']
        source:
          - locator: '§4.3'
            quote: 'On the other hand, an unknown non-critical packet MUST be ignored.'
        basis: stated
        constrained_by: ['rfc-9580#R-0033']
      - id: 'M01-T22'
        from: 'packet-complete'
        to: 'at-boundary'
        trigger: 'completion'
        guard: 'tag is in 0 to 39 and not implemented.'
        actions: ['deliver unknown_critical_packet (every sequence machine rejects the whole sequence on it)']
        source:
          - locator: '§4.3'
            quote: 'If an implementation encounters a critical packet where the packet type is unknown in a packet sequence, it MUST reject the whole packet sequence (see Section 10).'
        basis: stated
        constrained_by: ['rfc-9580#R-0032', 'rfc-9580#R-0034']
      - id: 'M01-T23'
        from: 'packet-complete'
        to: 'at-boundary'
        trigger: 'completion'
        guard: 'a subfield length inside the body implies octets outside the body.'
        actions: ['stop parsing the body without writing outside it', 'deliver the packet marked malformed and unusable (a malformed SIG goes to M05, which ignores it; any other malformed packet is an error of the sequence machine, see OQ-04)']
        source:
          - locator: '§4.1'
            quote: 'In the event that a subfield length indicator within a packet implies inclusion of octets outside the range indicated in the packet header, a parser MUST abort without writing outside the indicated range and MUST treat the packet as malformed and unusable.'
        basis: stated
        constrained_by: ['rfc-9580#R-0021', 'rfc-9580#R-0022']
    error_states: ['malformed']
    terminal_states: ['end', 'malformed']
    guard_coverage:
      - 'From at-boundary, T01 to T03 partition the header octet on bits 7 and 6.'
      - 'From openpgp-length, T05 to T08 partition o1 into 0-191, 192-223, 224-254, 255.'
      - 'From partial-next-length, T13 and T14 partition the next length octet the same way.'
      - 'From packet-complete, T20 to T22 partition on whether tag is implemented and its criticality; T23 overrides when a subfield overruns.'
    note: 'Framing is the same for the top-level stream and for every unwrapped stream (§10.3.1). Legacy-format COMP and LIT packets MAY be interpreted (R-0205, R-0221) but MUST NOT be generated (R-0203, R-0204, R-0219, R-0220). Producer rules on the Legacy format bind generation and redistribution only: it SHOULD NOT be used for new data (R-0024), Legacy packets MAY be redistributed as they are or transformed (R-0025), and an indeterminate length MUST NOT be generated (R-0030).'
    constrained_by: ['rfc-9580#R-0203', 'rfc-9580#R-0204', 'rfc-9580#R-0205', 'rfc-9580#R-0219', 'rfc-9580#R-0220', 'rfc-9580#R-0221', 'rfc-9580#R-0024', 'rfc-9580#R-0025', 'rfc-9580#R-0030']

  # ======================================================================
  - id: 'M02'
    name: 'openpgp-message-grammar'
    locator: '§10, §10.3, §10.3.1, §10.3.2.1, §10.3.2.2, §5.4, §5.6, §5.14, §4.3, §13.14'
    actor: 'consumer: the parser of one OpenPGP Message stream (top level, or one unwrapped stream)'
    purpose: 'Accept or reject a packet sequence against the OpenPGP Message grammar, track one-pass and prefixed signatures and the data they cover, and unwrap Compressed Data and encrypted containers by running a child instance of M02 over the unwrapped stream.'
    grammar:
      source:
        - locator: '§10.3'
          quote: 'OpenPGP Message:  Encrypted Message | Signed Message | Compressed Message | Literal Message.'
        - locator: '§10.3'
          quote: 'Encrypted Message:  Encrypted Data | ESK Sequence, Encrypted Data.'
        - locator: '§10.3'
          quote: 'One-Pass Signed Message:  One-Pass Signature Packet, OpenPGP Message, Corresponding Signature Packet.'
        - locator: '§10.3'
          quote: 'Signed Message:  Signature Packet, OpenPGP Message | One-Pass Signed Message.'
        - locator: '§10.3'
          quote: 'Optionally Padded Message:  OpenPGP Message | OpenPGP Message, Padding Packet.'
        - locator: '§10.3'
          quote: 'In addition to these rules, a Marker packet (Section 5.8) can appear anywhere in the sequence.'
      text: 'Compressed Message = COMP; Literal Message = LIT; ESK = PKESK | SKESK; ESK Sequence = ESK+; Encrypted Data = SED | SEIPD. The grammar is context-free (Signed Message and One-Pass Signed Message nest), so the machine is a pushdown automaton over a stack of signature frames.'
      constrained_by: ['rfc-9580#R-0309', 'rfc-9580#R-0310', 'rfc-9580#R-0311']
    parameters:
      - name: 'goal'
        type: 'OpenPGPMessage | OptionallyPaddedMessage'
        note: 'OptionallyPaddedMessage for the plaintext of a v2 SEIPD (R-0331); OpenPGPMessage for the top level, for the plaintext of a v1 SEIPD or SED (R-0332) and for decompressed data (R-0333). The top-level goal is inferred: the source does not say which production a top-level stream must match (OQ-06).'
        constrained_by: ['rfc-9580#R-0331', 'rfc-9580#R-0332', 'rfc-9580#R-0333']
      - name: 'compression_depth'
        type: 'integer >= 0: COMP layers enclosing this instance'
        constrained_by: ['rfc-9580#R-0419']
      - name: 'in_encrypted_container'
        type: 'boolean: some ancestor instance is the plaintext of SED or SEIPD'
        note: 'Needed for the 13.7 malleability rule on decompression failure.'
    state_variables:
      - name: 'stack'
        type: 'list of frames, top last. ops{version, sig_type, hash_algo, pk_algo, salt (v6), key_id (v3) or fingerprint (v6), nested_flag, hash_context}; prefix{sig: SIG packet, hash_context}'
        initial: 'empty'
        basis: inferred
        note: 'The frames are ours. Each frame''s hash context receives the data its signature covers (see M02-T07).'
      - name: 'last_ops_nested_flag'
        type: 'octet or none: the nested flag of the OPS just read'
        initial: 'none'
    initial: 'expect-message'
    states:
      - name: 'expect-message'
        meaning: 'The next significant packet must begin an OpenPGP Message.'
        basis: stated
      - name: 'esk-sequence'
        meaning: 'One or more PKESK or SKESK packets read; more ESK packets or the encrypted data follow.'
        basis: stated
      - name: 'unwrapping'
        meaning: 'A COMP, SED or SEIPD packet is being unwrapped; a child M02 instance parses the unwrapped stream (and, for SED and SEIPD, M11 then M12 or M13 decrypt it first).'
        basis: stated
        source:
          - locator: '§10.3.1'
            quote: 'In addition to the above grammar, certain messages can be "unwrapped" to yield new messages.'
      - name: 'message-done'
        meaning: 'One OpenPGP Message production has just completed at the current stack depth.'
        basis: inferred
      - name: 'expect-signature'
        meaning: 'The stack top is an ops frame whose inner OpenPGP Message is complete; the Corresponding Signature Packet is next.'
        basis: stated
      - name: 'expect-padding-or-end'
        meaning: 'goal is OptionallyPaddedMessage and the OpenPGP Message is complete; one PADDING may follow, then the end of the unwrapped stream.'
        basis: stated
      - name: 'expect-end'
        meaning: 'The goal production is complete; only ignorable packets may precede the end of the stream.'
        basis: inferred
      - name: 'accepted'
        meaning: 'The stream is a valid instance of goal. Signature results (from M05) and literal data are reported.'
        basis: inferred
      - name: 'rejected'
        meaning: 'The whole packet sequence is invalid.'
        basis: stated
        kind: 'error'
        source:
          - locator: '§10'
            quote: 'The presence of an unknown critical packet, or a known but unexpected packet, is a critical error, invalidating the entire sequence (see Section 4.3).'
        constrained_by: ['rfc-9580#R-0309', 'rfc-9580#R-0311']
    transitions:
      - id: 'M02-T01'
        from: 'any non-final state'
        to: 'same state'
        trigger: 'MARKER'
        guard: 'always'
        source:
          - locator: '§10.3'
            quote: 'In addition to these rules, a Marker packet (Section 5.8) can appear anywhere in the sequence.'
          - locator: '§5.8'
            quote: 'Such a packet MUST be ignored when received.'
        basis: stated
        constrained_by: ['rfc-9580#R-0209']
      - id: 'M02-T02'
        from: 'any non-final state'
        to: 'same state'
        trigger: 'unknown_noncritical_packet'
        guard: 'always'
        source:
          - locator: '§10'
            quote: 'On the other hand, unknown non-critical packets can appear anywhere within any sequence.'
        basis: stated
        constrained_by: ['rfc-9580#R-0033', 'rfc-9580#R-0309']
      - id: 'M02-T03'
        from: 'any non-final state other than expect-padding-or-end'
        to: 'same state'
        trigger: 'PADDING'
        guard: 'always'
        source:
          - locator: '§5.14'
            quote: 'An implementation MUST be able to process Padding packets anywhere else in an OpenPGP stream so that future revisions of this document may specify further locations for padding.'
          - locator: '§5.14'
            quote: 'Such a packet MUST be ignored when received.'
        basis: stated
        constrained_by: ['rfc-9580#R-0236', 'rfc-9580#R-0239']
        note: 'The grammar admits PADDING only at the end of an Optionally Padded Message, while Padding is a critical packet (Type ID 21) and 10 calls a known but unexpected packet a critical error. R-0239 is read as overriding that for PADDING (OQ-05).'
      - id: 'M02-T04'
        from: 'any non-final state'
        to: 'same state'
        trigger: 'TRUST'
        guard: 'always'
        source:
          - locator: '§5.10'
            quote: 'Trust packets SHOULD NOT be emitted to output streams that are transferred to other users, and they SHOULD be ignored on any input other than local keyring files.'
        basis: stated
        constrained_by: ['rfc-9580#R-0225']
        note: 'Same tension as M02-T03: TRUST is a known critical packet the grammar does not admit (OQ-05).'
      - id: 'M02-T05'
        from: 'any non-final state'
        to: 'rejected'
        trigger: 'unknown_critical_packet'
        guard: 'always'
        source:
          - locator: '§4.3'
            quote: 'If an implementation encounters a critical packet where the packet type is unknown in a packet sequence, it MUST reject the whole packet sequence (see Section 10).'
        basis: stated
        constrained_by: ['rfc-9580#R-0032', 'rfc-9580#R-0309']
      - id: 'M02-T06'
        from: 'any non-final state'
        to: 'rejected'
        trigger: 'any packet event not accepted by another transition from the current state'
        guard: 'always'
        note: 'For example PUBKEY, SECKEY, PUBSUBKEY, SECSUBKEY, UID or UAT anywhere; LIT, SIG or OPS in esk-sequence; a packet beginning a second message in expect-end. MARKER, PADDING, TRUST and the unknown packets have transitions of their own (M02-T01 to M02-T05).'
        source:
          - locator: '§10'
            quote: 'When consuming a sequence of OpenPGP packets, if an implementation encounters a critical packet of an inappropriate type according to the relevant grammar, the implementation MUST reject the sequence with an error.'
        basis: stated
        constrained_by: ['rfc-9580#R-0311', 'rfc-9580#R-0309']
      - id: 'M02-T07'
        from: 'expect-message'
        to: 'message-done'
        trigger: 'LIT'
        guard: 'always'
        actions:
          - 'deliver the literal data (format octet b, u or deprecated t; file name; date; data)'
          - 'feed the literal data octets (not the format octet, file name or date) into the hash context of every frame on the stack, canonicalised per frame for text signatures (0x01)'
          - 'mark the format, file name and date as not covered by any signature'
        source:
          - locator: '§10.3'
            quote: 'Literal Message:  Literal Data Packet.'
          - locator: '§5.9'
            quote: 'Note that OpenPGP signatures do not include the formatting octet, the file name, and the date field of the Literal Data packet in a signature hash; therefore, those fields are not protected against tampering in a signed document.'
        basis: stated
        constrained_by: ['rfc-9580#R-0214', 'rfc-9580#R-0211', 'rfc-9580#R-0166']
        note: 'That every open frame hashes the same literal data, including frames of an enclosing ops frame whose message is itself one-pass signed, is inferred from the bracketing rule of 5.4 (OQ-07).'
      - id: 'M02-T08'
        from: 'expect-message'
        to: 'expect-message'
        trigger: 'OPS'
        guard: 'always (an OPS may follow an OPS with nested flag 0, and may begin the inner OpenPGP Message of an OPS with a non-zero flag).'
        actions: ['push ops frame from the OPS fields; start its hash context (v6: salt first)', 'last_ops_nested_flag := OPS.nested_flag']
        source:
          - locator: '§10.3'
            quote: 'One-Pass Signed Message:  One-Pass Signature Packet, OpenPGP Message, Corresponding Signature Packet.'
          - locator: '§5.4'
            quote: 'A zero value indicates that the next packet is another One-Pass Signature packet that describes another signature to be applied to the same message data.'
        basis: stated
        constrained_by: ['rfc-9580#R-0164']
        unspecified:
          - 'An OPS with nested flag 0 followed by anything other than another OPS (OQ-08).'
      - id: 'M02-T09'
        from: 'expect-message'
        to: 'expect-message'
        trigger: 'SIG'
        guard: 'always'
        actions: ['push prefix frame holding the SIG; start its hash context per its version and type (M05 hashing steps)']
        source:
          - locator: '§10.3'
            quote: 'Signed Message:  Signature Packet, OpenPGP Message | One-Pass Signed Message.'
        basis: stated
        constrained_by: ['rfc-9580#R-0311', 'rfc-9580#R-0178', 'rfc-9580#R-0179', 'rfc-9580#R-0180']
        note: 'A malformed or unknown SIG still occupies its place in the grammar; it is only ignored for validation (R-0178 to R-0180).'
      - id: 'M02-T10'
        from: 'expect-message'
        to: 'unwrapping'
        trigger: 'COMP'
        guard: 'compression_depth < the implementation''s layer limit, and the algorithm octet names an implemented algorithm other than 0.'
        actions: ['decompress the body (ZIP raw DEFLATE, ZLIB, BZip2)', 'run a child M02 with goal OpenPGPMessage, compression_depth + 1, the same in_encrypted_container and the same stack (its LIT feeds the open frames)']
        source:
          - locator: '§10.3.1'
            quote: 'Decompressing a Compressed Data packet MUST also yield a valid OpenPGP Message.'
          - locator: '§13.14'
            quote: 'An OpenPGP implementation SHOULD limit the number of layers of compression it is willing to decompress in a single message.'
        basis: stated
        constrained_by: ['rfc-9580#R-0333', 'rfc-9580#R-0419', 'rfc-9580#R-0293', 'rfc-9580#R-0294', 'rfc-9580#R-0295', 'rfc-9580#R-0001']
      - id: 'M02-T11'
        from: 'expect-message'
        to: 'rejected'
        trigger: 'COMP'
        guard: 'compression_depth reaches the layer limit, or the algorithm is 0 or not implemented.'
        source:
          - locator: '§12.3.1.1'
            quote: 'An implementation MUST NOT use algorithm 0 as the indicated compression algorithm in a Compressed Data packet (Section 5.6); it can use a Literal Data packet (Section 5.9) to encode uncompressed literal data.'
        basis: inferred
        inferred_reason: 'R-0380 and R-0419 bind the producer and the layer limit; that the consumer rejects (rather than, say, reports) is ours.'
        constrained_by: ['rfc-9580#R-0380', 'rfc-9580#R-0419']
      - id: 'M02-T12'
        from: 'expect-message'
        to: 'esk-sequence'
        trigger: 'PKESK or SKESK'
        guard: 'always'
        actions: ['append the ESK to the ESK list for M11']
        source:
          - locator: '§10.3'
            quote: 'ESK Sequence:  ESK | ESK Sequence, ESK.'
        basis: stated
      - id: 'M02-T13'
        from: 'esk-sequence'
        to: 'esk-sequence'
        trigger: 'PKESK or SKESK'
        guard: 'always'
        actions: ['append the ESK to the ESK list']
        source:
          - locator: '§10.3'
            quote: 'ESK Sequence:  ESK | ESK Sequence, ESK.'
        basis: stated
      - id: 'M02-T14'
        from: 'expect-message or esk-sequence'
        to: 'unwrapping'
        trigger: 'SEIPD or SED'
        guard: 'always'
        actions:
          - 'invoke M11 with the ESK list (possibly empty) and the payload version; on a session key invoke M12 (SEIPD v1, SED) or M13 (SEIPD v2)'
          - 'run a child M02 over the plaintext with goal OptionallyPaddedMessage for SEIPD v2, OpenPGPMessage otherwise; in_encrypted_container := true; the same stack'
        source:
          - locator: '§10.3.1'
            quote: 'Decrypting a version 2 Symmetrically Encrypted and Integrity Protected Data packet MUST yield a valid Optionally Padded Message.'
          - locator: '§10.3.1'
            quote: 'Decrypting a version 1 Symmetrically Encrypted and Integrity Protected Data packet or -- for historic data -- a Symmetrically Encrypted Data packet MUST yield a valid OpenPGP Message.'
        basis: stated
        constrained_by: ['rfc-9580#R-0331', 'rfc-9580#R-0332', 'rfc-9580#R-0336', 'rfc-9580#R-0337']
        note: 'M12 and M13 decide when plaintext may be handed to the child: never before integrity is confirmed, except as M13-T08 allows for authenticated chunks.'
      - id: 'M02-T15'
        from: 'unwrapping'
        to: 'message-done'
        trigger: 'unwrap_accepted'
        guard: 'the child instance ended in accepted exactly at the end of the unwrapped stream.'
        source:
          - locator: '§10.3.1'
            quote: 'An implementation MUST NOT interpret octets beyond the boundaries of the unwrapped octet stream as part of any OpenPGP packet.'
        basis: stated
        constrained_by: ['rfc-9580#R-0334', 'rfc-9580#R-0335']
      - id: 'M02-T16'
        from: 'unwrapping'
        to: 'rejected'
        trigger: 'unwrap_rejected'
        guard: 'the child instance was rejected, framing was malformed, decompression failed, or decryption ended in an M11, M12 or M13 error state.'
        actions: ['if in_encrypted_container and the failure is a decompression failure: report that the integrity of the message is suspect (13.7)']
        source:
          - locator: '§13.7'
            quote: 'Within any encrypted container, any Compressed Data packet (Section 5.6) where there is a decompression failure.'
          - locator: '§13.7'
            quote: 'When an OpenPGP implementation discovers that it is decrypting data that appears to be malleable, it MUST generate a clear error message that indicates the integrity of the message is suspect, it SHOULD NOT attempt to parse nor release decrypted data to the user, and it SHOULD halt with an error.'
        basis: stated
        constrained_by: ['rfc-9580#R-0405', 'rfc-9580#R-0331', 'rfc-9580#R-0332', 'rfc-9580#R-0333']
      - id: 'M02-T17'
        from: 'message-done'
        to: 'expect-signature'
        trigger: 'completion'
        guard: 'stack top is an ops frame pushed by this instance.'
        source:
          - locator: '§5.4'
            quote: 'It allows the Signature packet to be placed at the end of the message so that the signer can compute the entire signed message in one pass.'
        basis: stated
      - id: 'M02-T18'
        from: 'message-done'
        to: 'message-done'
        trigger: 'completion'
        guard: 'stack top is a prefix frame pushed by this instance.'
        actions: ['pop it; invoke M05 on its SIG with the frame''s hash context; record the result']
        source:
          - locator: '§10.3'
            quote: 'Signed Message:  Signature Packet, OpenPGP Message | One-Pass Signed Message.'
        basis: inferred
        inferred_reason: 'The grammar gives the order; that the signed OpenPGP Message ends where the enclosing production ends, and that verification runs then, is ours.'
        constrained_by: ['rfc-9580#R-0178', 'rfc-9580#R-0179', 'rfc-9580#R-0180']
      - id: 'M02-T19'
        from: 'message-done'
        to: 'expect-padding-or-end'
        trigger: 'completion'
        guard: 'stack holds no frame pushed by this instance, and goal = OptionallyPaddedMessage.'
        source:
          - locator: '§10.3'
            quote: 'Optionally Padded Message:  OpenPGP Message | OpenPGP Message, Padding Packet.'
        basis: stated
        constrained_by: ['rfc-9580#R-0331', 'rfc-9580#R-0238']
      - id: 'M02-T20'
        from: 'message-done'
        to: 'expect-end'
        trigger: 'completion'
        guard: 'stack holds no frame pushed by this instance, and goal = OpenPGPMessage.'
        basis: inferred
        inferred_reason: 'The goal production is complete; frames pushed by an ancestor instance stay open for it.'
      - id: 'M02-T21'
        from: 'expect-signature'
        to: 'message-done'
        trigger: 'SIG'
        guard: 'always'
        actions:
          - 'pop the ops frame (the last OPS pushed is matched by the first SIG after the message)'
          - 'invoke M05 on the SIG with the frame''s hash context and the OPS fields; M05 treats a version mismatch (Table 27) or salt mismatch as a malformed signature'
        source:
          - locator: '§5.4'
            quote: 'Note that if a message contains more than one one-pass signature, then the Signature packets bracket the message; that is, the first Signature packet after the message corresponds to the last One-Pass Signature packet and the final Signature packet corresponds to the first One-Pass Signature packet.'
          - locator: '§10.3.2.2'
            quote: 'Note, however, that a version mismatch between these packets does not invalidate the packet sequence as a whole; it merely invalidates the signature, as a signature with an unknown version SHOULD be discarded (see Section 5.2.5).'
        basis: stated
        constrained_by: ['rfc-9580#R-0185', 'rfc-9580#R-0186', 'rfc-9580#R-0345', 'rfc-9580#R-0347', 'rfc-9580#R-0178', 'rfc-9580#R-0180']
      - id: 'M02-T22'
        from: 'expect-signature'
        to: 'rejected'
        trigger: 'end_of_stream'
        guard: 'always'
        source:
          - locator: '§10.3'
            quote: 'One-Pass Signed Message:  One-Pass Signature Packet, OpenPGP Message, Corresponding Signature Packet.'
        basis: inferred
        inferred_reason: 'The grammar makes the Corresponding Signature Packet part of the production; no rule says what a consumer does with a stream that ends before it (R-0311 concerns a packet of an inappropriate type, not a missing one). Rejection is the grammar reading, as in M02-T25.'
        constrained_by: ['rfc-9580#R-0311']
        unspecified:
          - 'What makes a Signature packet the Corresponding Signature Packet of an OPS, and the consumer action when it is missing (OQ-38).'
      - id: 'M02-T23'
        from: 'expect-padding-or-end'
        to: 'expect-end'
        trigger: 'PADDING'
        guard: 'always'
        source:
          - locator: '§5.14'
            quote: 'As the last packet of an Optionally Padded Message within a version 2 Symmetrically Encrypted and Integrity Protected Data packet (see Section 10.3.1).'
        basis: stated
        constrained_by: ['rfc-9580#R-0236', 'rfc-9580#R-0238']
      - id: 'M02-T24'
        from: 'expect-padding-or-end or expect-end'
        to: 'accepted'
        trigger: 'end_of_stream'
        guard: 'always'
        actions: ['raise unwrap_accepted to the parent instance, if any']
        basis: inferred
        inferred_reason: 'Acceptance at the end of the production is implied by the grammar.'
      - id: 'M02-T25'
        from: 'expect-message or esk-sequence'
        to: 'rejected'
        trigger: 'end_of_stream'
        guard: 'always'
        actions: ['raise unwrap_rejected to the parent instance, if any']
        basis: inferred
        inferred_reason: 'An empty stream, a stream of only signatures or OPS packets, and an ESK sequence with no encrypted data are not OpenPGP Messages under the grammar.'
        constrained_by: ['rfc-9580#R-0311']
      - id: 'M02-T26'
        from: 'any non-final state'
        to: 'rejected'
        trigger: 'stream_malformed'
        guard: 'always'
        actions: ['raise unwrap_rejected to the parent instance, if any']
        source:
          - locator: '§10.3.1'
            quote: 'If an implementation encounters a packet whose header length indicates that it would extend beyond the boundaries of the unwrapped octet stream, the implementation MUST reject that packet as malformed and unusable.'
        basis: inferred
        inferred_reason: 'Added in pass 3. M01 stops on a stream it cannot cut into packets; the source states that the packet is malformed and unusable, and rejecting the sequence that contains it is ours.'
        constrained_by: ['rfc-9580#R-0021', 'rfc-9580#R-0335']
    error_states: ['rejected']
    terminal_states: ['accepted', 'rejected']
    guard_coverage:
      - 'message-done: T17, T18 and T19/T20 partition on the stack top (an ops frame of this instance, a prefix frame of this instance, no frame of this instance: a child instance shares its parent''s stack and must not close the parent''s frames); T19 and T20 partition on goal.'
      - 'expect-message: every packet type has a transition: LIT T07, OPS T08, SIG T09, COMP T10/T11, PKESK/SKESK T12, SEIPD/SED T14, ignorable T01 to T04, unknown critical T05, anything else T06.'
    note: 'The SIG and OPS packets that are malformed or of an unknown version keep their grammatical place; M05 ignores them without halting the stream (§5.2.5). SED handling (reject, or process with a warning) is in M12.'

  # ======================================================================
  - id: 'M03'
    name: 'detached-signature-sequence'
    locator: '§10.4, §10'
    actor: 'consumer of a detached signature (for example a BEGIN PGP SIGNATURE armor body)'
    purpose: 'Accept one or more Signature packets stored apart from the data they sign, and verify each with M05 over the external data.'
    initial: 'start'
    states:
      - name: 'start'
        meaning: 'No Signature packet read yet.'
        basis: inferred
      - name: 'signatures'
        meaning: 'At least one Signature packet read.'
        basis: stated
        source:
          - locator: '§10.4'
            quote: 'These detached signatures are simply one or more Signature packets stored separately from the data for which they are a signature.'
      - name: 'accepted'
        meaning: 'Every SIG has been handed to M05 with the external data.'
        basis: inferred
      - name: 'rejected'
        meaning: 'Not a detached-signature sequence.'
        basis: stated
        kind: 'error'
    transitions:
      - id: 'M03-T01'
        from: 'start or signatures'
        to: 'signatures'
        trigger: 'SIG'
        guard: 'always'
        actions: ['invoke M05 on the SIG with the external data as the signed document']
        source:
          - locator: '§10.4'
            quote: 'These detached signatures are simply one or more Signature packets stored separately from the data for which they are a signature.'
        basis: stated
      - id: 'M03-T02'
        from: 'start or signatures'
        to: 'same state'
        trigger: 'MARKER, PADDING, TRUST or unknown_noncritical_packet'
        guard: 'always'
        source:
          - locator: '§10.4'
            quote: 'In addition, a Marker packet (Section 5.8) and a Padding packet (Section 5.14) can appear anywhere in the sequence.'
          - locator: '§5.10'
            quote: 'Trust packets SHOULD NOT be emitted to output streams that are transferred to other users, and they SHOULD be ignored on any input other than local keyring files.'
        basis: stated
        constrained_by: ['rfc-9580#R-0209', 'rfc-9580#R-0236', 'rfc-9580#R-0033', 'rfc-9580#R-0225']
        note: 'TRUST added in pass 3 so that M03 ignores it as M02-T04 does and as OQ-05 says; the same tension with the 10 rule on known but unexpected packets applies (OQ-05).'
      - id: 'M03-T03'
        from: 'signatures'
        to: 'accepted'
        trigger: 'end_of_stream'
        guard: 'always'
        basis: inferred
        inferred_reason: 'End of the one-or-more production.'
      - id: 'M03-T04'
        from: 'start'
        to: 'rejected'
        trigger: 'end_of_stream'
        guard: 'always'
        basis: inferred
        inferred_reason: 'Zero signatures is not one or more.'
      - id: 'M03-T05'
        from: 'start or signatures'
        to: 'rejected'
        trigger: 'unknown_critical_packet, or any packet event not accepted by another transition from the current state'
        guard: 'always'
        source:
          - locator: '§10'
            quote: 'When consuming a sequence of OpenPGP packets, if an implementation encounters a critical packet of an inappropriate type according to the relevant grammar, the implementation MUST reject the sequence with an error.'
        basis: stated
        constrained_by: ['rfc-9580#R-0311', 'rfc-9580#R-0032']
      - id: 'M03-T06'
        from: 'start or signatures'
        to: 'rejected'
        trigger: 'stream_malformed'
        guard: 'always'
        source:
          - locator: '§10.3.1'
            quote: 'If an implementation encounters a packet whose header length indicates that it would extend beyond the boundaries of the unwrapped octet stream, the implementation MUST reject that packet as malformed and unusable.'
        basis: inferred
        inferred_reason: 'Added in pass 3. M01 stops on a stream it cannot cut into packets; the source states that the packet is malformed and unusable, and rejecting the sequence that contains it is ours.'
        constrained_by: ['rfc-9580#R-0021', 'rfc-9580#R-0335']
    error_states: ['rejected']
    terminal_states: ['accepted', 'rejected']
    note: 'Each SIG is typically 0x00 (binary) or 0x01 (text) over the external document; text canonicalisation is M05 step H02.'

  # ======================================================================
  - id: 'M04'
    name: 'transferable-key-structure'
    locator: '§10.1, §10.1.1, §10.1.2, §10.1.3, §10.1.4, §10.1.5, §10.2, §3.6, §5.5.2'
    actor: 'consumer: the parser of a Transferable Public Key (OpenPGP certificate), a Transferable Secret Key, or a keyring of concatenated ones'
    purpose: 'Accept or reject a key packet sequence against the v6, v4 and v3 structures, attach each signature to the component it follows, enforce the version rules between primary key, subkeys and self-signatures, and hand the assembled key to M06, M07 and M08 for validity.'
    grammar:
      source:
        - locator: '§10.1.1'
          quote: 'Entries in square brackets are optional and ellipses indicate repetition.'
      text: |-
        v6 (10.1.1):  Primary Key, [Revocation Signature...], Direct Key Signature...,
                      [User ID or User Attribute [Certification Revocation Signature...] [Certification Signature...]]...,
                      [Subkey [Subkey Revocation Signature...] Subkey Binding Signature...]..., [Padding]
        v6 revocation certificate (10.1.2): Primary Key, Revocation Signature
        v4 (10.1.3):  Primary Key, [Revocation Signature], [Direct Key Signature...],
                      [User ID or User Attribute [Signature...]]...,
                      [Subkey [Subkey Revocation Signature...] Subkey Binding Signature...]...
        v3 (10.1.4):  RSA Public Key, [Revocation Signature], User ID [Signature...], [User ID [Signature...]]...
        all: a Marker packet can appear anywhere. TSK (10.2): SECKEY and SECSUBKEY may stand in for PUBKEY and PUBSUBKEY.
      note: 'The grammar is over packet types; the bracketed roles (Revocation, Direct Key, Certification, Binding) are Signature Type IDs of one packet type, SIG. The source does not say whether a SIG of the wrong signature type for its position is a grammar error (OQ-09); this machine attaches it to the component it follows and leaves its effect to the validity machines.'
      constrained_by: ['rfc-9580#R-0309', 'rfc-9580#R-0311']
    state_variables:
      - name: 'v'
        type: 'version of the primary key packet: 2, 3, 4 or 6'
      - name: 'tsk'
        type: 'boolean: a SECKEY or SECSUBKEY has been read'
        initial: 'false'
      - name: 'has_dks'
        type: 'boolean: a SIG of type 0x1F followed the primary key'
        initial: 'false'
      - name: 'uid_count'
        type: 'integer'
        initial: '0'
      - name: 'current'
        type: 'the component the next SIG attaches to: primary, a User ID or User Attribute, or a subkey'
      - name: 'subkey_bindings'
        type: 'number of type 0x18 SIGs after the current subkey'
    initial: 'start'
    states:
      - name: 'start'
        meaning: 'No packet of this key read yet.'
        basis: inferred
      - name: 'primary'
        meaning: 'The primary key packet is read, with any primary-key signatures that follow it (revocations 0x20, Direct Key 0x1F).'
        basis: stated
        source:
          - locator: '§10.1.5'
            quote: 'The Public Key packet occurs first.'
        constrained_by: ['rfc-9580#R-0322']
      - name: 'user-block'
        meaning: 'A User ID or User Attribute packet is read, with the certifications and certification revocations that follow it.'
        basis: stated
        source:
          - locator: '§10.1.5'
            quote: 'Immediately following each User ID packet, there are zero or more Signature packets.  Each Signature packet is calculated on the immediately preceding User ID packet and the initial Public Key packet.'
      - name: 'subkey-unbound'
        meaning: 'A subkey packet is read; no Subkey Binding signature after it yet (subkey revocations may precede the binding).'
        basis: stated
      - name: 'subkey-bound'
        meaning: 'The current subkey has at least one Subkey Binding signature after it.'
        basis: stated
      - name: 'v4-revocation-certificate'
        meaning: 'A v4 Key Revocation signature distributed by itself, without the primary key packet.'
        basis: stated
        source:
          - locator: '§10.1.3'
            quote: 'When a primary version 4 Public Key is revoked, the Revocation Signature is sometimes distributed by itself, without the primary key packet it applies to.  This is referred to as a "revocation certificate".'
      - name: 'complete'
        meaning: 'One TPK or TSK assembled; handed to M06, M07, M08. In a keyring the next PUBKEY or SECKEY starts a new instance.'
        basis: stated
        source:
          - locator: '§10.1.5'
            quote: 'Transferable Public Key packet sequences may be concatenated to allow transferring multiple public keys in one operation (see Section 3.6).'
      - name: 'rejected'
        meaning: 'The packet sequence is not a Transferable Public or Secret Key.'
        basis: stated
        kind: 'error'
    transitions:
      - id: 'M04-T01'
        from: 'start'
        to: 'primary'
        trigger: 'PUBKEY or SECKEY'
        guard: 'key version v in {4, 6}; or v in {2, 3} and the implementation accepts deprecated versions; for v in {2, 3} the algorithm is RSA; for v = 6, the key material uses no deprecated curve OID and is not Curve25519Legacy.'
        actions: ['v := version', 'tsk := (trigger = SECKEY)', 'current := primary']
        source:
          - locator: '§5.5.2'
            quote: 'Version 4 keys are deprecated; an implementation SHOULD NOT generate a version 4 key but SHOULD accept it.'
          - locator: '§10.1.5'
            quote: 'The primary key MUST be an algorithm capable of making signatures (that is, not an encryption-only algorithm).'
          - locator: '§10.2'
            quote: 'If a single Secret Key or Secret Subkey packet is included in a packet sequence, it is a Transferable Secret Key and should be handled and marked as such (see Section 6.2.1).'
          - locator: '§5.5.3'
            quote: 'A different mode is used with version 3 keys (which are only RSA) than with other key formats.'
          - locator: '§9.2'
            quote: 'Implementations MUST NOT accept or generate version 6 key material using the deprecated OIDs.'
        basis: stated
        constrained_by: ['rfc-9580#R-0188', 'rfc-9580#R-0189', 'rfc-9580#R-0190', 'rfc-9580#R-0322', 'rfc-9580#R-0323', 'rfc-9580#R-0320', 'rfc-9580#R-0286', 'rfc-9580#R-0198']
        unspecified:
          - 'A primary key whose algorithm cannot sign (R-0323): whether the consumer rejects the sequence or only finds no valid self-signature (OQ-10).'
      - id: 'M04-T02'
        from: 'start'
        to: 'v4-revocation-certificate'
        trigger: 'SIG'
        guard: 'sig.type = 0x20 and sig.version = 4.'
        source:
          - locator: '§10.1.3'
            quote: 'When a primary version 4 Public Key is revoked, the Revocation Signature is sometimes distributed by itself, without the primary key packet it applies to.  This is referred to as a "revocation certificate".'
        basis: stated
        note: 'The revocation can be applied (M06) only to a key the consumer already holds, found by the issuer fingerprint or Key ID.'
      - id: 'M04-T03'
        from: 'start'
        to: 'rejected'
        trigger: 'SIG'
        guard: 'not (sig.type = 0x20 and sig.version = 4): a v6 revocation by itself (a v6 revocation certificate must include the primary key), a v3 one, or any other signature type.'
        source:
          - locator: '§10.1.3'
            quote: 'Instead, a version 6 revocation certificate MUST include the primary key packet, as described in Section 10.1.2.'
        basis: inferred
        inferred_reason: 'R-0319 binds the producer; rejecting a bare v6 revocation is the consumer reading of it.'
        constrained_by: ['rfc-9580#R-0319']
      - id: 'M04-T04'
        from: 'primary'
        to: 'primary'
        trigger: 'SIG'
        guard: 'v in {4, 6} and sig.type in {0x20, 0x1F}; or v in {2, 3} and sig.type = 0x20.'
        actions: ['attach to primary', 'if sig.type = 0x1F: has_dks := true']
        source:
          - locator: '§10.1.1'
            quote: 'Note that a version 6 key uses a self-signed Direct Key signature to store algorithm preferences.'
          - locator: '§5.2.1.10'
            quote: 'It is also appropriate for statements that non-self certifiers want to make about the key itself rather than the binding between a key and a name.'
        basis: stated
        constrained_by: ['rfc-9580#R-0097', 'rfc-9580#R-0098']
        note: 'v6 and v4 grammars list revocations before Direct Key signatures; v4 admits at most one revocation ([Revocation Signature]). Order and count are not enforced here (OQ-09).'
      - id: 'M04-T05'
        from: 'primary or user-block'
        to: 'user-block'
        trigger: 'UID or UAT'
        guard: 'trigger = UID, or v in {4, 6} (the v3 structure has no User Attribute).'
        actions: ['uid_count := uid_count + 1 (for UID)', 'current := the new User ID or User Attribute']
        source:
          - locator: '§10.1.5'
            quote: 'User Attribute packets and User ID packets may be freely intermixed in this section, as long as the signatures that follow them are maintained on the proper User Attribute or User ID packet.'
        basis: stated
        constrained_by: ['rfc-9580#R-0324', 'rfc-9580#R-0226']
        note: 'For v6 without has_dks the structure lacks the required Direct Key Signature...; the sequence is still parsed and M06 makes the key unusable (R-0098). Whether the consumer should instead reject the sequence is OQ-11.'
      - id: 'M04-T06'
        from: 'user-block'
        to: 'user-block'
        trigger: 'SIG'
        guard: 'always'
        actions: ['attach to current (expected types 0x10 to 0x13 and 0x30)']
        source:
          - locator: '§10.1.5'
            quote: 'The signature serves to certify the corresponding public key and User ID.'
        basis: stated
      - id: 'M04-T07'
        from: 'primary or user-block or subkey-bound'
        to: 'subkey-unbound'
        trigger: 'PUBSUBKEY or SECSUBKEY'
        guard: 'v in {4, 6}.'
        actions: ['if trigger = SECSUBKEY: tsk := true', 'current := the new subkey', 'subkey_bindings := 0', 'if subkey version != v, or v = 6 and the subkey key material uses a deprecated curve OID or Curve25519Legacy (R-0286, R-0198): mark the subkey unusable']
        source:
          - locator: '§10.1.5'
            quote: 'After the sequence of User ID packets and Attribute packets and their associated signatures, zero or more Subkey packets follow, each with their own signatures.'
          - locator: '§10.1.1'
            quote: 'Every subkey for a version 6 primary key MUST be a version 6 subkey.'
          - locator: '§10.1.3'
            quote: 'Every subkey for a version 4 primary key MUST be a version 4 subkey.'
        basis: stated
        constrained_by: ['rfc-9580#R-0312', 'rfc-9580#R-0318']
        unspecified:
          - 'A subkey whose version differs from the primary key: marking only that subkey unusable is our reading; the source does not say whether the whole sequence is rejected (OQ-12).'
      - id: 'M04-T08'
        from: 'primary or user-block or subkey-bound'
        to: 'rejected'
        trigger: 'PUBSUBKEY or SECSUBKEY'
        guard: 'v in {2, 3}.'
        source:
          - locator: '§10.1.4'
            quote: 'Version 3 keys MUST NOT have subkeys.'
        basis: stated
        constrained_by: ['rfc-9580#R-0321', 'rfc-9580#R-0311']
      - id: 'M04-T09'
        from: 'subkey-unbound'
        to: 'subkey-unbound'
        trigger: 'SIG'
        guard: 'sig.type = 0x28.'
        actions: ['attach to current subkey']
        source:
          - locator: '§10.1.5'
            quote: 'Subkey and Key packets may each be followed by a Revocation Signature packet to indicate that the key is revoked.'
        basis: stated
      - id: 'M04-T10'
        from: 'subkey-unbound or subkey-bound'
        to: 'subkey-bound'
        trigger: 'SIG'
        guard: 'sig.type = 0x18, or (state = subkey-bound and sig.type = 0x28).'
        actions: ['attach to current subkey', 'if sig.type = 0x18: subkey_bindings := subkey_bindings + 1']
        source:
          - locator: '§10.1.5'
            quote: 'Each Subkey packet MUST be followed by one Signature packet, which should be a Subkey Binding signature issued by the top-level key.'
          - locator: '§10.1.1'
            quote: 'Every subkey MUST have at least one Subkey Binding signature.'
        basis: stated
        constrained_by: ['rfc-9580#R-0313', 'rfc-9580#R-0325', 'rfc-9580#R-0088']
      - id: 'M04-T11'
        from: 'subkey-unbound or subkey-bound'
        to: 'same state'
        trigger: 'SIG'
        guard: 'sig.type not in {0x18, 0x28}.'
        actions: ['attach to current subkey; it has no validity effect']
        basis: inferred
        inferred_reason: 'A signature of another type after a subkey is not described (OQ-09). Pass 3 extended the transition to subkey-bound, which had no transition for such a SIG.'
      - id: 'M04-T12'
        from: 'subkey-unbound'
        to: 'subkey-unbound'
        trigger: 'PUBSUBKEY or SECSUBKEY'
        guard: 'v in {4, 6}.'
        actions: ['the previous subkey has no binding: mark it unusable', 'current := the new subkey']
        source:
          - locator: '§10.1.3'
            quote: 'A subkey always has at least one Subkey Binding signature after it that is issued using the primary key to tie the two keys together.'
        basis: inferred
        inferred_reason: 'Dropping the unbound subkey rather than rejecting the sequence is ours (OQ-12).'
        constrained_by: ['rfc-9580#R-0313', 'rfc-9580#R-0325']
      - id: 'M04-T13'
        from: 'subkey-unbound or subkey-bound'
        to: 'rejected'
        trigger: 'UID or UAT'
        guard: 'always (a User ID or User Attribute after the subkey section).'
        source:
          - locator: '§10.1.5'
            quote: 'After the sequence of User ID packets and Attribute packets and their associated signatures, zero or more Subkey packets follow, each with their own signatures.'
        basis: stated
        constrained_by: ['rfc-9580#R-0311']
        note: 'Strict reading of the grammar as a packet-type grammar.'
      - id: 'M04-T14'
        from: 'any non-final state'
        to: 'same state'
        trigger: 'MARKER, PADDING or unknown_noncritical_packet'
        guard: 'always'
        source:
          - locator: '§10.1.1'
            quote: 'In addition to these rules, a Marker packet (Section 5.8) can appear anywhere in the sequence.'
          - locator: '§10.1.5'
            quote: 'An implementation that is capable of receiving a Transferable Public Key with a version 6 Public Key primary key MUST be able to accept (and ignore) the trailing optional Padding packet.'
        basis: stated
        constrained_by: ['rfc-9580#R-0209', 'rfc-9580#R-0236', 'rfc-9580#R-0239', 'rfc-9580#R-0328', 'rfc-9580#R-0327', 'rfc-9580#R-0033']
        note: 'PADDING is in the v6 grammar only as a trailing element; R-0239 covers it elsewhere. For v4 the producer SHOULD NOT add it unless the recipient copes (R-0327).'
      - id: 'M04-T15'
        from: 'any non-final state'
        to: 'same state'
        trigger: 'TRUST'
        guard: 'the input is a local keyring file (attach to current as local trust data), or otherwise (ignore).'
        source:
          - locator: '§5.10'
            quote: 'Trust packets SHOULD NOT be emitted to output streams that are transferred to other users, and they SHOULD be ignored on any input other than local keyring files.'
        basis: stated
        constrained_by: ['rfc-9580#R-0224', 'rfc-9580#R-0225']
      - id: 'M04-T16'
        from: 'primary or user-block or subkey-bound or subkey-unbound'
        to: 'complete'
        trigger: 'end_of_stream, PUBKEY or SECKEY'
        guard: 'v in {2, 3} requires uid_count >= 1. A subkey-unbound current subkey is marked unusable. A PUBKEY or SECKEY trigger starts a new instance of M04 in state primary.'
        actions: ['hand the key to M06 (primary), M07 (each subkey), M08 (each User ID and User Attribute)']
        source:
          - locator: '§10.1.4'
            quote: 'The RSA public key can have many User IDs, and each User ID can have many signatures.'
          - locator: '§10.1.5'
            quote: 'Transferable Public Key packet sequences may be concatenated to allow transferring multiple public keys in one operation (see Section 3.6).'
        basis: stated
        constrained_by: ['rfc-9580#R-0324', 'rfc-9580#R-0329', 'rfc-9580#R-0330']
        note: 'v6 revocation certificate (10.1.2): primary followed only by a 0x20 is complete without a Direct Key signature. A TPK without any User ID is complete; R-0324 is a SHOULD on the producer and R-0099 tells consumers not to require one.'
      - id: 'M04-T17'
        from: 'primary'
        to: 'rejected'
        trigger: 'end_of_stream, PUBKEY or SECKEY'
        guard: 'v in {2, 3} and uid_count = 0.'
        source:
          - locator: '§10.1.4'
            quote: 'The RSA public key can have many User IDs, and each User ID can have many signatures.'
        basis: inferred
        inferred_reason: 'The v3 structure has a non-optional first User ID; rejecting its absence is the grammar reading.'
      - id: 'M04-T18'
        from: 'v4-revocation-certificate'
        to: 'complete'
        trigger: 'end_of_stream'
        guard: 'always'
        actions: ['hand the revocation to M06 for the key it names']
        basis: inferred
        inferred_reason: 'Completion of the bare revocation certificate form.'
      - id: 'M04-T19'
        from: 'any non-final state'
        to: 'rejected'
        trigger: 'unknown_critical_packet, or any packet event not accepted by another transition from the current state'
        guard: 'always'
        note: 'For example PKESK, SKESK, OPS, COMP, SED, LIT or SEIPD anywhere; UID, UAT, PUBSUBKEY or SECSUBKEY in start.'
        source:
          - locator: '§10'
            quote: 'The presence of an unknown critical packet, or a known but unexpected packet, is a critical error, invalidating the entire sequence (see Section 4.3).'
        basis: stated
        constrained_by: ['rfc-9580#R-0032', 'rfc-9580#R-0309', 'rfc-9580#R-0311']
      - id: 'M04-T20'
        from: 'start'
        to: 'rejected'
        trigger: 'PUBKEY or SECKEY'
        guard: 'the guard of M04-T01 does not hold: a key version the implementation does not accept (including an undefined one), a v2 or v3 key that is not RSA, or v6 key material over a deprecated curve OID or Curve25519Legacy.'
        source:
          - locator: '§9.2'
            quote: 'Implementations MUST NOT accept or generate version 6 key material using the deprecated OIDs.'
        basis: inferred
        inferred_reason: 'Added in pass 3: start had no transition for a key packet M04-T01 refuses. R-0286 forbids accepting the key material; rejecting the whole sequence, rather than skipping to the next key, is ours, and for an undefined version the consumer action is open (OQ-37).'
        constrained_by: ['rfc-9580#R-0286', 'rfc-9580#R-0198']
        unspecified:
          - 'A primary key packet of a version the source does not define (OQ-37).'
      - id: 'M04-T21'
        from: 'primary'
        to: 'primary'
        trigger: 'SIG'
        guard: 'the guard of M04-T04 does not hold: v in {4, 6} and sig.type not in {0x20, 0x1F}, or v in {2, 3} and sig.type != 0x20.'
        actions: ['attach to primary; it has no validity effect except where M06 uses it (a 0x30 that revokes a Direct Key signature)']
        basis: inferred
        inferred_reason: 'Added in pass 3: primary had no transition for such a SIG. A signature of another type directly after the primary key is not described (OQ-09); attaching it rather than rejecting mirrors M04-T11.'
        unspecified:
          - 'A SIG of a type the grammar does not place after the primary key: attach, ignore, or reject the sequence (OQ-09).'
      - id: 'M04-T22'
        from: 'any non-final state'
        to: 'rejected'
        trigger: 'stream_malformed'
        guard: 'always'
        source:
          - locator: '§10.3.1'
            quote: 'If an implementation encounters a packet whose header length indicates that it would extend beyond the boundaries of the unwrapped octet stream, the implementation MUST reject that packet as malformed and unusable.'
        basis: inferred
        inferred_reason: 'Added in pass 3. M01 stops on a stream it cannot cut into packets; the source states that the packet is malformed and unusable, and rejecting the sequence that contains it is ours.'
        constrained_by: ['rfc-9580#R-0021', 'rfc-9580#R-0335']
    error_states: ['rejected']
    terminal_states: ['complete', 'rejected']
    invariants:
      - text: 'Every self-signature of a v6 key is a v6 signature; every Subkey Binding signature of a v6 key is made by the primary key. A v4 subkey that can sign has a v4 binding signature (it carries the embedded 0x19). Checked in M07 and M08, which treat a violating signature as not valid.'
        source:
          - locator: '§10.1.1'
            quote: 'Every Subkey Binding signature MUST be a self-signature (that is, made by the version 6 primary key).'
          - locator: '§10.1.3'
            quote: 'Subkeys that can issue signatures MUST have a version 4 binding signature due to the REQUIRED embedded Primary Key Binding signature.'
        constrained_by: ['rfc-9580#R-0314', 'rfc-9580#R-0315', 'rfc-9580#R-0316', 'rfc-9580#R-0317']
    note: 'Version 6 key material over the deprecated curve OIDs and Curve25519Legacy in v6 key packets are refused (R-0198, R-0286): a primary key by M04-T01 and M04-T20, a subkey by marking it unusable in M04-T07 (as for a version mismatch, OQ-12).'
    constrained_by: ['rfc-9580#R-0198', 'rfc-9580#R-0286']

  # ======================================================================
  - id: 'M05'
    name: 'signature-verification'
    locator: '§5.2, §5.2.1, §5.2.2, §5.2.3, §5.2.3.1 to §5.2.3.7, §5.2.3.9, §5.2.3.11, §5.2.3.12, §5.2.3.18, §5.2.3.22, §5.2.3.35, §5.2.3.36, §5.2.4, §5.2.4.1, §5.2.5, §9.5, §10.3.2.2, §12.1.3, §12.4, §12.5, §12.7, §13.1, §13.13'
    actor: 'verifier of one Signature packet'
    purpose: 'Take one SIG (and, for a one-pass signature, its OPS), a candidate signer key, the signed data and the evaluation time t, and end in valid, invalid, ignored (malformed or unknown: never success, never halting the stream) or refused by algorithm policy.'
    inputs:
      - name: 'sig'
        type: 'SIG packet body (v3, v4 or v6), possibly flagged malformed by M01-T23'
      - name: 'ops'
        type: 'the matching OPS packet, for a one-pass signature (M02-T21); else none'
      - name: 'signed_data'
        type: 'per signature type: document octets (0x00, 0x01), nothing (0x02), key and User ID or User Attribute (0x10 to 0x13, 0x30), primary key and subkey (0x18, 0x19, 0x28), key (0x1F, 0x20), Signature packet (0x50)'
      - name: 'candidate_keys'
        type: 'keys found by Issuer Fingerprint or Issuer Key ID; Key IDs are not unique'
        source:
          - locator: '§3.3'
            quote: 'Implementations SHOULD NOT assume that Key IDs are unique.'
        constrained_by: ['rfc-9580#R-0005']
      - name: 't'
        type: 'evaluation time'
      - name: 'context'
        type: 'encrypted context and the keys it was encrypted to, for R-0161; cleartext Hash header state, for M16'
    initial: 'received'
    states:
      - name: 'received'
        meaning: 'The packet body is in hand.'
        basis: inferred
        steps:
          - id: 'S01'
            kind: 'check'
            applies_when: 'always'
            check: 'sig was not flagged malformed by framing (no subfield overran the body).'
            on_failure: 'M05-T02'
            source:
              - locator: '§4.1'
                quote: 'In the event that a subfield length indicator within a packet implies inclusion of octets outside the range indicated in the packet header, a parser MUST abort without writing outside the indicated range and MUST treat the packet as malformed and unusable.'
            basis: stated
            constrained_by: ['rfc-9580#R-0021']
          - id: 'S02'
            kind: 'check'
            applies_when: 'always'
            check: 'sig.version in {3, 4, 6}, and the implementation supports it (v3 MAY be accepted).'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.5'
                quote: 'An unknown signature version'
              - locator: '§5.2'
                quote: 'Implementations MUST NOT create version 3 signatures; they MAY accept version 3 signatures.'
            basis: stated
            constrained_by: ['rfc-9580#R-0045', 'rfc-9580#R-0046', 'rfc-9580#R-0347']
          - id: 'S03'
            kind: 'check'
            applies_when: 'sig.version = 3'
            check: 'the hashed-material length octet is 5, and the public key algorithm is not ECDSA, EdDSALegacy, Ed25519 or Ed448.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.2'
                quote: 'A 1-octet length of the following hashed material; it MUST be 5:'
              - locator: '§5.2.3.2'
                quote: 'A version 3 signature MUST NOT be created and MUST NOT be used with the Elliptic Curve Digital Signature Algorithm (ECDSA).'
            basis: stated
            constrained_by: ['rfc-9580#R-0058', 'rfc-9580#R-0061', 'rfc-9580#R-0065', 'rfc-9580#R-0069', 'rfc-9580#R-0072']
            note: 'Taking ignored (rather than invalid) for these is ours: they are malformed signatures in the sense of 5.2.5.'
          - id: 'S04'
            kind: 'check'
            applies_when: 'always'
            check: 'sig.type is a known Signature Type ID of Table 4 and is not 0xFF; not (sig.version = 3 and sig.type = 0x02).'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.5'
                quote: 'An unknown signature type'
              - locator: '§5.2.1.16'
                quote: 'An implementation MUST NOT create any signature with this type and MUST NOT validate any signature made with this type.'
              - locator: '§5.2.1.3'
                quote: 'Version 3 Standalone signatures MUST NOT be generated and MUST be ignored.'
            basis: stated
            constrained_by: ['rfc-9580#R-0057', 'rfc-9580#R-0048', 'rfc-9580#R-0176']
          - id: 'S05'
            kind: 'check'
            applies_when: 'sig.version in {4, 6}'
            check: 'the hashed subpacket count (2 octets for v4, 4 for v6) and the unhashed count fit inside the packet body.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.5'
                quote: 'A hashed subpacket area with length that exceeds the length of the Signature packet itself'
            basis: stated
            constrained_by: ['rfc-9580#R-0021']
          - id: 'S06'
            kind: 'check'
            applies_when: 'sig.version = 6'
            check: 'salt size octet = the V6 Signature Salt Size of Table 23 for sig.hash_algo (SHA2-256 16, SHA2-384 24, SHA2-512 32, SHA2-224 16, SHA3-256 16, SHA3-512 32); a hash with salt size N/A (MD5, SHA-1, RIPEMD-160) fails.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.3'
                quote: 'A 1-octet salt size.  The value MUST match the value defined for the hash algorithm as specified in Table 23.'
              - locator: '§5.2.5'
                quote: 'A mismatch between the expected salt length of the hash algorithm and the actual salt length'
            basis: stated
            constrained_by: ['rfc-9580#R-0060']
          - id: 'S07'
            kind: 'check'
            applies_when: 'sig.version = 6 and MPIs are present (RSA, DSA, ECDSA)'
            check: 'every MPI bit length equals the length from its most significant non-zero bit; unused bits are zero.'
            on_failure: 'M05-T02'
            source:
              - locator: '§3.2'
                quote: 'When parsing an MPI in a version 6 Key, Signature, or Public Key Encrypted Session Key (PKESK) packet, the implementation MUST check that the encoded length matches the length starting from the most significant non-zero bit; if it doesn''t match, reject the packet as malformed.'
            basis: stated
            constrained_by: ['rfc-9580#R-0003', 'rfc-9580#R-0004']
          - id: 'S08'
            kind: 'check'
            applies_when: 'ops is not none'
            check: 'OPS version corresponds to SIG version per Table 27 (v3 OPS with v3 or v4 SIG; v6 OPS with v6 SIG); for v6, OPS salt = SIG salt.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.5'
                quote: 'A mismatch between the One-Pass Signature version and the Signature version (see Section 10.3.2.2)'
              - locator: '§5.4'
                quote: 'The salt; a random value of the specified size.  The value MUST match the salt field of the corresponding Signature packet.'
            basis: stated
            constrained_by: ['rfc-9580#R-0185', 'rfc-9580#R-0186', 'rfc-9580#R-0345', 'rfc-9580#R-0347', 'rfc-9580#R-0184']
            note: 'Whether a mismatch of signature type, hash algorithm, public key algorithm or issuer between OPS and SIG is also a malformed signature is not stated (OQ-13).'
      - name: 'subpackets'
        meaning: 'Parsing the hashed and unhashed subpacket areas (v4, v6).'
        basis: stated
        steps:
          - id: 'P01'
            kind: 'check'
            applies_when: 'sig.version in {4, 6}'
            check: 'every subpacket length (1, 2 or 5 octets, covering type octet and data) stays inside its area and matches the length its type requires.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.3.7'
                quote: 'The subpacket length field covers the encoded Subpacket Type ID and the subpacket-specific data, and it does not include the subpacket length field itself.'
              - locator: '§5.2.5'
                quote: 'A subpacket with a length that diverges from the expected length'
            basis: stated
            constrained_by: ['rfc-9580#R-0078', 'rfc-9580#R-0021']
          - id: 'P02'
            kind: 'check'
            applies_when: 'a hashed subpacket has bit 7 of its type octet set'
            check: 'its Subpacket Type ID (bits 6-0) is recognised.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.3.7'
                quote: 'If a subpacket is encountered that is marked critical but is unknown to the evaluating implementation, the evaluator SHOULD consider the signature to be in error.'
              - locator: '§5.2.5'
                quote: 'An unknown "critical" subpacket (see Section 5.2.3.7) in the hashed area'
            basis: stated
            constrained_by: ['rfc-9580#R-0079', 'rfc-9580#R-0080']
            note: 'A critical unknown subpacket in the unhashed area is covered by R-0080 but not by the 5.2.5 list (OQ-14).'
          - id: 'P03'
            kind: 'action'
            applies_when: 'a subpacket is not critical and its type is not recognised'
            action: 'skip it.'
            source:
              - locator: '§5.2.3.7'
                quote: 'An implementation SHOULD ignore any non-critical subpacket of a type that it does not recognize.'
            basis: stated
            constrained_by: ['rfc-9580#R-0081']
          - id: 'P04'
            kind: 'check'
            applies_when: 'a Regular Expression subpacket (6) is present'
            check: 'its last octet is 0x00 (then remove it). If absent: a non-critical subpacket is ignored; a critical one fails.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.3.22'
                quote: 'When an implementation parses a Regular Expression subpacket, it MUST remove this octet; if it is not present, it MUST reject the subpacket (i.e., ignore the subpacket if it''s non-critical and reject the signature if it''s critical).'
            basis: stated
            constrained_by: ['rfc-9580#R-0126', 'rfc-9580#R-0127']
          - id: 'P05'
            kind: 'check'
            applies_when: 'an Issuer Fingerprint subpacket (33) is present'
            check: 'its key version octet = sig.version; length is 20 for version 4 and 32 for version 6.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.3.35'
                quote: 'If the version octet does not match the signature version, the receiving implementation MUST treat it as a malformed signature (see Section 5.2.5).'
            basis: stated
            constrained_by: ['rfc-9580#R-0159', 'rfc-9580#R-0160']
          - id: 'P06'
            kind: 'check'
            applies_when: 'sig.version = 4 and both Issuer Fingerprint and Issuer Key ID are present'
            check: 'Issuer Key ID = low 64 bits of the fingerprint.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.3.35'
                quote: 'If the version of the issuing key is 4 and an Issuer Key ID subpacket (Section 5.2.3.12) is also included in the signature, the Key ID of the Issuer Key ID subpacket MUST match the low 64 bits of the fingerprint.'
            basis: inferred
            inferred_reason: 'The MUST binds the content; treating a mismatch as malformed is ours.'
            constrained_by: ['rfc-9580#R-0158']
          - id: 'P07'
            kind: 'check'
            applies_when: 'sig.version in {4, 6}'
            check: 'a Signature Creation Time subpacket (2) is in the hashed area.'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.3.11'
                quote: 'This subpacket MUST be present in the hashed area.'
            basis: inferred
            inferred_reason: 'R-0101 binds the producer; the consumer action on absence is not stated (OQ-15).'
            constrained_by: ['rfc-9580#R-0101']
          - id: 'P08'
            kind: 'action'
            applies_when: 'a subpacket type occurs more than once in the hashed area'
            action: 'use the last occurrence (or another documented conflict-resolution scheme).'
            source:
              - locator: '§5.2.3.9'
                quote: 'In most cases, an implementation SHOULD use the last subpacket in the hashed section of the signature, but it MAY use any conflict resolution scheme that makes more sense.'
            basis: stated
            constrained_by: ['rfc-9580#R-0086']
          - id: 'P09'
            kind: 'action'
            applies_when: 'always'
            action: 'treat unhashed subpackets as advisory: they may locate the issuer key but no decision about validity, expiry, preferences, flags or trust rests on them.'
            source:
              - locator: '§13.13'
                quote: 'Some subpackets are only useful when they are in the hashed section, and an implementation SHOULD ignore them when they are found with unknown provenance in the unhashed section.'
              - locator: '§5.2.3.6'
                quote: 'The second set of subpackets (the "unhashed section") is not cryptographically protected by the signature and should include only advisory information.'
            basis: stated
            constrained_by: ['rfc-9580#R-0077', 'rfc-9580#R-0417', 'rfc-9580#R-0418']
      - name: 'key-and-policy'
        meaning: 'Choosing a signer key and applying algorithm policy.'
        basis: stated
        steps:
          - id: 'K01'
            kind: 'action'
            applies_when: 'always'
            action: 'select candidate keys by Issuer Fingerprint (v4, v6) or Issuer Key ID (v3, v4), or for a one-pass signature by the OPS key-id (v3 OPS) or fingerprint (v6 OPS); with no issuer information, the caller''s candidates; try each candidate in turn.'
            source:
              - locator: '§5.2.3.35'
                quote: 'This subpacket SHOULD be included in all signatures.'
            basis: inferred
            inferred_reason: 'Trying every candidate follows from R-0005; the order is ours.'
            constrained_by: ['rfc-9580#R-0005', 'rfc-9580#R-0157']
          - id: 'K02'
            kind: 'check'
            applies_when: 'always'
            check: 'key version and signature version align (Table 27): a v6 key only with a v6 signature; a v4 key with v4 (or historic v3).'
            on_failure: 'M05-T02'
            source:
              - locator: '§5.2.5'
                quote: 'A signature with a version other than 6, made by a version 6 key'
              - locator: '§10.3.2.2'
                quote: 'When a version 6 key produces a Signature packet, it MUST produce a version 6 Signature packet, regardless of the Signature packet type.'
            basis: stated
            constrained_by: ['rfc-9580#R-0043', 'rfc-9580#R-0044', 'rfc-9580#R-0344', 'rfc-9580#R-0346']
          - id: 'K03'
            kind: 'check'
            applies_when: 'always'
            check: 'sig.pk_algo matches the key algorithm and can sign; not DSA; not Ed25519Legacy (EdDSALegacy) in a v6 signature; RSA modulus >= 2048 bits (>= 3072 SHOULD).'
            on_failure: 'M05-T05'
            source:
              - locator: '§12.5'
                quote: 'An implementation MUST NOT sign or verify using DSA keys.'
              - locator: '§12.4'
                quote: 'An implementation MUST NOT encrypt, sign, or verify using RSA keys of a size less than 2048 bits.'
              - locator: '§5.2.3.3.1'
                quote: 'Ed25519Legacy MUST NOT be used in Signature packets version 6 or above.'
            basis: stated
            constrained_by: ['rfc-9580#R-0389', 'rfc-9580#R-0386', 'rfc-9580#R-0385', 'rfc-9580#R-0068', 'rfc-9580#R-0383']
          - id: 'K04'
            kind: 'check'
            applies_when: 'always'
            check: 'sig.hash_algo is implemented and acceptable: not MD5, SHA-1 or RIPEMD-160 for a recent signature; for an old one only if its creation predates the known weakness and the data stayed in the user''s custody.'
            on_failure: 'M05-T05'
            source:
              - locator: '§9.5'
                quote: 'Implementations MUST NOT validate any recent signature that depends on MD5, SHA-1, or RIPEMD-160.'
              - locator: '§5.2.5'
                quote: 'A hash algorithm known to be weak (e.g., MD5)'
            basis: stated
            constrained_by: ['rfc-9580#R-0305', 'rfc-9580#R-0306', 'rfc-9580#R-0402']
            note: '5.2.5 lists a weak hash among malformed signatures, so T02 (ignored) is an equally conforming outcome; both end without success (OQ-16 on what counts as recent).'
          - id: 'K05'
            kind: 'check'
            applies_when: 'always'
            check: 'digest size is at least: q bits (DSA); the curve fsize (ECDSA; 512 bits for NIST P-521); the curve fsize (EdDSALegacy); 256 bits (Ed25519); 512 bits (Ed448).'
            on_failure: 'M05-T04 (another candidate key) else M05-T11'
            source:
              - locator: '§5.2.3.4'
                quote: 'A verifying implementation MUST reject any Ed25519 signature that uses a hash algorithm with a smaller digest size.'
              - locator: '§5.2.3.5'
                quote: 'A verifying implementation MUST reject any Ed448 signature that uses a hash algorithm with a smaller digest size.'
              - locator: '§5.2.3.3'
                quote: 'A verifying implementation MUST reject any EdDSALegacy signature that uses a hash algorithm with a smaller digest size.'
            basis: stated
            constrained_by: ['rfc-9580#R-0062', 'rfc-9580#R-0064', 'rfc-9580#R-0066', 'rfc-9580#R-0067', 'rfc-9580#R-0070', 'rfc-9580#R-0071', 'rfc-9580#R-0073', 'rfc-9580#R-0074']
      - name: 'hashing'
        meaning: 'Computing the digest over salt, signed data and trailer in one hash context.'
        basis: stated
        steps:
          - id: 'H01'
            kind: 'action'
            applies_when: 'sig.version = 6'
            action: 'feed the salt first.'
            source:
              - locator: '§5.2.4'
                quote: 'When creating or verifying a version 6 signature, the salt is fed into the hash context before any other data.'
            basis: stated
            constrained_by: ['rfc-9580#R-0164']
          - id: 'H02'
            kind: 'action'
            applies_when: 'always'
            action: 'feed the signed data by type. 0x00: document octets. 0x01: document with line endings converted to CR LF, UTF-8. 0x02: nothing (as a zero-length binary document). Key (0x1F, 0x20; also the first part of the others): v4 0x99 || 2-octet length || key packet body; v6 0x9B || 4-octet length || key packet body. 0x18, 0x19: primary key then subkey, same format. 0x28: primary key then subkey. 0x10 to 0x13 and 0x30: key then, v4/v6, 0xB4 (User ID) or 0xD1 (User Attribute) || 4-octet length || data; v3, the data without header. 0x50: 0x88 || 4-octet length || Signature packet body with unhashed data omitted and its length set to zero.'
            source:
              - locator: '§5.2.4'
                quote: 'For text document signatures (Type ID 0x01), the implementation MUST first canonicalize the document by converting line endings to <CR><LF> and encoding it in UTF-8 (see [RFC3629]).'
              - locator: '§5.2.4'
                quote: 'When a version 6 signature is made over a key, the hash data starts with the salt and then octet 0x9B, followed by a 4-octet length of the key, followed by the body of the key packet.'
              - locator: '§5.2.1.3'
                quote: 'It is calculated identically to a signature over a zero-length binary document.'
            basis: stated
            constrained_by: ['rfc-9580#R-0047', 'rfc-9580#R-0165', 'rfc-9580#R-0166', 'rfc-9580#R-0167', 'rfc-9580#R-0168', 'rfc-9580#R-0169', 'rfc-9580#R-0170', 'rfc-9580#R-0171', 'rfc-9580#R-0172', 'rfc-9580#R-0173', 'rfc-9580#R-0055']
            note: 'The data hashed for 0x40 (Timestamp) and for a 0x30 that revokes a Direct Key signature are not spelled out (OQ-17).'
          - id: 'H03'
            kind: 'action'
            applies_when: 'always'
            action: 'feed the trailer. v3: signature type || 4-octet creation time. v4/v6: version || type || pk_algo || hash_algo || hashed-subpacket count || hashed subpackets, then version || 0xFF || 4-octet big-endian (length of those hashed fields mod 2^32).'
            source:
              - locator: '§5.2.4'
                quote: 'A version 3 signature hashes five octets of the packet body, starting from the signature type field.  This data is the signature type, followed by the 4-octet Signature Creation Time.'
              - locator: '§5.2.4.1'
                quote: 'All signature versions later than version 3 always use a literal 0xFF in the fifth octet from the end.'
            basis: stated
            constrained_by: ['rfc-9580#R-0059', 'rfc-9580#R-0174', 'rfc-9580#R-0175', 'rfc-9580#R-0176', 'rfc-9580#R-0177', 'rfc-9580#R-0075']
          - id: 'H04'
            kind: 'check'
            applies_when: 'sig.version = 6'
            check: 'the 2-octet left-16-bits field = the first two octets of the digest.'
            on_failure: 'M05-T04 (another candidate key) else M05-T11'
            source:
              - locator: '§5.2.3.6'
                quote: 'When verifying a version 6 signature, an implementation MUST reject the signature if these octets do not match the first two octets of the computed hash.'
            basis: stated
            constrained_by: ['rfc-9580#R-0076']
          - id: 'H05'
            kind: 'check'
            applies_when: 'sig.version in {3, 4} and the implementation uses the quick reject'
            check: 'the 2-octet left-16-bits field = the first two octets of the digest.'
            on_failure: 'M05-T04 (another candidate key) else M05-T11'
            source:
              - locator: '§5.2.2'
                quote: 'The high 16 bits (first two octets) of the hash are included in the Signature packet to provide a way to reject some invalid signatures without performing a signature verification.'
            basis: stated
      - name: 'cryptographic-check'
        meaning: 'Verifying the signature value against the digest with the candidate key.'
        basis: stated
        steps:
          - id: 'C01'
            kind: 'check'
            applies_when: 'always'
            check: 'RSA: EMSA-PKCS1-v1_5 encoding of the digest with the Table 24 prefix equals m^e mod n. DSA/ECDSA: (r, s) verify over the digest truncated to the bit length of q (or the curve order). EdDSALegacy, Ed25519, Ed448: PureEdDSA over the digest, never truncated; Ed448 with an empty context string.'
            on_failure: 'M05-T04 (another candidate key) else M05-T11'
            source:
              - locator: '§5.2.3.1'
                quote: 'With RSA signatures, the hash value is encoded using PKCS#1 encoding type EMSA-PKCS1-v1_5, as described in Section 9.2 of [RFC8017] (see also Section 12.1.3).'
              - locator: '§12.7'
                quote: 'Truncation of the resulting digest is never applied; the resulting digest value is used verbatim as input to the EdDSA algorithm.'
            basis: stated
            constrained_by: ['rfc-9580#R-0063', 'rfc-9580#R-0368', 'rfc-9580#R-0369', 'rfc-9580#R-0370', 'rfc-9580#R-0371', 'rfc-9580#R-0372', 'rfc-9580#R-0393', 'rfc-9580#R-0394', 'rfc-9580#R-0395', 'rfc-9580#R-0396']
      - name: 'context-checks'
        meaning: 'The signature is cryptographically sound; time, key status and context decide whether it is valid at t.'
        basis: stated
        steps:
          - id: 'X01'
            kind: 'check'
            applies_when: 'a hashed Signature Expiration Time subpacket with a non-zero value is present'
            check: 't < creation time + expiration.'
            on_failure: 'M05-T06'
            source:
              - locator: '§5.2.3.18'
                quote: 'The validity period of the signature.  This is the number of seconds after the Signature Creation Time that the signature expires.  If this is not present or has a value of zero, it never expires.'
            basis: stated
            constrained_by: ['rfc-9580#R-0107']
            note: 'Boundary instant: OQ-21.'
          - id: 'X02'
            kind: 'check'
            applies_when: 'always'
            check: 'the signer key (and, for a subkey, its binding) was valid at the signature creation time per M06 and M07, and is not hard-revoked (M06 revoked-hard makes every signature by the key suspect).'
            on_failure: 'M05-T07'
            source:
              - locator: '§5.2.3.31'
                quote: 'If a key has been revoked because of a compromise, all signatures created by that key are suspect.  However, if it was merely superseded or retired, old signatures are still valid.'
            basis: stated
            constrained_by: ['rfc-9580#R-0149', 'rfc-9580#R-0050', 'rfc-9580#R-0052']
            note: 'Whether the signing key must carry the sign-data key flag (0x02) for a document signature, or 0x01 for a third-party certification, is not stated as a verifier rule (OQ-18). Self-signatures need no flag (5.2.3.10).'
          - id: 'X03'
            kind: 'check'
            applies_when: 'one or more hashed Intended Recipient Fingerprint subpackets (35) are present'
            check: 'the signature was found in an encrypted context whose recipient key is one of the listed primary keys or one of their subkeys.'
            on_failure: 'M05-T07'
            source:
              - locator: '§5.2.3.36'
                quote: 'If one or more subpackets of this type are included in a signature, it SHOULD be considered valid only in an encrypted context, where the key it was encrypted to is one of the indicated primary keys or one of their subkeys.'
            basis: stated
            constrained_by: ['rfc-9580#R-0161', 'rfc-9580#R-0416']
          - id: 'X04'
            kind: 'check'
            applies_when: 'the signature comes from a cleartext signed message (M16)'
            check: 'M16 found no non-conformant Hash header and no Armor Header other than Hash.'
            on_failure: 'M05-T07'
            source:
              - locator: '§6.2.2.3'
                quote: 'A verifying application MUST decline to validate any signature in a message with a non-conformant Hash header (that is, a Hash header that contains anything other than a comma-separated list of hash algorithms).'
            basis: stated
            constrained_by: ['rfc-9580#R-0259', 'rfc-9580#R-0267']
      - name: 'valid'
        meaning: 'The signature verifies under a key that was valid for it, at t.'
        basis: inferred
      - name: 'invalid'
        meaning: 'The signature is well formed but does not verify, or its key or context disqualifies it.'
        basis: inferred
      - name: 'ignored'
        meaning: 'Malformed or unknown (5.2.5): ignored for validation, never reported as success, stream processing continues.'
        kind: 'error'
        basis: stated
      - name: 'refused'
        meaning: 'Well formed, but the algorithm, key size or hash is one the verifier must not or should not validate.'
        kind: 'error'
        basis: inferred
      - name: 'expired'
        meaning: 'Cryptographically sound, but past its Signature Expiration Time at t.'
        basis: inferred
    transitions:
      - id: 'M05-T01'
        from: 'received'
        to: 'subpackets'
        trigger: 'completion'
        guard: 'S01 to S08 pass.'
        basis: inferred
        inferred_reason: 'Ordering of the check groups is ours; the result does not depend on it.'
      - id: 'M05-T02'
        from: 'received or subpackets or key-and-policy'
        to: 'ignored'
        trigger: 'completion'
        guard: 'a check whose on_failure names M05-T02 fails.'
        actions: ['report no successful validation for this signature', 'continue processing the packet stream and every other signature']
        source:
          - locator: '§5.2.5'
            quote: 'When an implementation encounters such a malformed or unknown signature, it MUST ignore the signature for validation purposes.  It MUST NOT indicate a successful signature validation for such a signature.  At the same time, it MUST NOT halt processing on the packet stream or reject other signatures in the same packet stream just because an unknown or invalid signature exists.'
        basis: stated
        constrained_by: ['rfc-9580#R-0178', 'rfc-9580#R-0179', 'rfc-9580#R-0180', 'rfc-9580#R-0347', 'rfc-9580#R-0160']
      - id: 'M05-T03'
        from: 'subpackets'
        to: 'key-and-policy'
        trigger: 'completion'
        guard: 'P01 to P09 done without failure.'
        basis: inferred
        inferred_reason: 'Sequencing.'
      - id: 'M05-T04'
        from: 'key-and-policy or hashing or cryptographic-check'
        to: 'key-and-policy'
        trigger: 'completion'
        guard: 'K05, H04, H05 or C01 failed and another candidate key remains.'
        actions: ['take the next candidate key; restart hashing']
        basis: inferred
        inferred_reason: 'Retry over candidates follows from Key IDs not being unique (R-0005).'
        constrained_by: ['rfc-9580#R-0005']
      - id: 'M05-T05'
        from: 'key-and-policy'
        to: 'refused'
        trigger: 'completion'
        guard: 'K03 or K04 fails.'
        basis: stated
        source:
          - locator: '§9.5'
            quote: 'Implementations MUST NOT validate any recent signature that depends on MD5, SHA-1, or RIPEMD-160.'
        constrained_by: ['rfc-9580#R-0305', 'rfc-9580#R-0306', 'rfc-9580#R-0386', 'rfc-9580#R-0389']
      - id: 'M05-T06'
        from: 'context-checks'
        to: 'expired'
        trigger: 'completion'
        guard: 'X01 fails.'
        basis: inferred
        inferred_reason: 'The source defines the validity period; that an expired signature is not valid at t is the plain reading.'
        constrained_by: ['rfc-9580#R-0107']
      - id: 'M05-T07'
        from: 'context-checks'
        to: 'invalid'
        trigger: 'completion'
        guard: 'X02, X03 or X04 fails.'
        basis: stated
        source:
          - locator: '§5.2.1.11'
            quote: 'A revoked key is not to be used.'
        constrained_by: ['rfc-9580#R-0050', 'rfc-9580#R-0149', 'rfc-9580#R-0161', 'rfc-9580#R-0259']
      - id: 'M05-T08'
        from: 'key-and-policy'
        to: 'hashing'
        trigger: 'completion'
        guard: 'K01 to K05 pass for the current candidate key.'
        basis: inferred
        inferred_reason: 'Sequencing.'
      - id: 'M05-T09'
        from: 'hashing'
        to: 'cryptographic-check'
        trigger: 'completion'
        guard: 'H04 (v6) or H05 (if used) pass.'
        basis: inferred
        inferred_reason: 'Sequencing.'
      - id: 'M05-T10'
        from: 'cryptographic-check'
        to: 'context-checks'
        trigger: 'completion'
        guard: 'C01 passes.'
        basis: inferred
        inferred_reason: 'Sequencing.'
      - id: 'M05-T11'
        from: 'key-and-policy or hashing or cryptographic-check'
        to: 'invalid'
        trigger: 'completion'
        guard: 'K05, H04, H05 or C01 failed and no candidate key remains.'
        source:
          - locator: '§2.2'
            quote: 'The receiving implementation generates a new hash digest for the received message and verifies it using the message''s signature. If the verification is successful, the message is accepted as authentic.'
        basis: stated
        constrained_by: ['rfc-9580#R-0076', 'rfc-9580#R-0067', 'rfc-9580#R-0071', 'rfc-9580#R-0074']
      - id: 'M05-T12'
        from: 'context-checks'
        to: 'valid'
        trigger: 'completion'
        guard: 'X01 to X04 pass.'
        source:
          - locator: '§2.2'
            quote: 'If the verification is successful, the message is accepted as authentic.'
        basis: stated
    error_states: ['ignored', 'refused']
    terminal_states: ['valid', 'invalid', 'ignored', 'refused', 'expired']
    note: 'The steps run for every caller: M02 (prefix and one-pass signatures), M03 (detached), M06 to M10 (self-signatures, bindings, certifications, revocations, trust signatures), M16 (cleartext). An Embedded Signature subpacket (32) holds a complete Signature packet body and is verified by a nested run of M05 (M07-T02).'

  # ======================================================================
  - id: 'M06'
    name: 'primary-key-validity'
    locator: '§5.2.1.10, §5.2.1.11, §5.2.3.10, §5.2.3.13, §5.2.3.23, §5.2.3.31, §10.1.2, §10.1.3, §10.1.5, §13.9'
    actor: 'evaluator: an implementation deciding whether a primary key may be used at time t'
    purpose: 'Derive the status of a primary key at t from its creation time, its effective self-signature (expiration), and its Key Revocation signatures (by the key itself, or by a deprecated designated Revocation Key), distinguishing revocations after which earlier signatures stay valid (soft) from those after which every signature is suspect (hard).'
    inputs:
      - name: 'key'
        type: 'the primary key and its signatures from M04'
      - name: 't'
        type: 'evaluation time'
    derived:
      - name: 'effective_self_signature'
        text: 'The most recent valid (M05 valid) self-signature that carries key-wide information: for v6, the Direct Key signature (0x1F); for v4, a Direct Key signature or, by convention, the User ID self-signature (0x10 or 0x13) of the primary User ID. A Direct Key signature revoked by a valid Certification Revocation (0x30) from the primary key or a Revocation Key is cancelled and does not count; if no other valid 0x1F remains, a v6 key falls to unusable (M06-T03).'
        source:
          - locator: '§5.2.3.10'
            quote: 'An implementation that encounters multiple self-signatures on the same object MUST select the most recent valid self-signature and ignore all other self-signatures.'
          - locator: '§5.2.3.10'
            quote: 'Revoking a Direct Key signature cancels that signature.'
          - locator: '§5.2.1.13'
            quote: 'This signature revokes an earlier User ID certification signature (Type IDs 0x10 through 0x13) or Direct Key signature (Type ID 0x1F).'
          - locator: '§5.2.3.10'
            quote: 'By convention, a version 4 key stores information about the primary Public Key (key flags, key expiration, etc.) and the Transferable Public Key as a whole (features, algorithm preferences, etc.) in a User ID self-signature of type 0x10 or 0x13.'
        basis: stated
        constrained_by: ['rfc-9580#R-0095', 'rfc-9580#R-0096', 'rfc-9580#R-0097', 'rfc-9580#R-0141', 'rfc-9580#R-0091']
        note: 'Where in the key a 0x30 that revokes a Direct Key signature sits is not stated: the grammars name only Revocation and Direct Key signatures after the primary key, and M04-T04 does not admit 0x30 there; M04-T21 attaches it to the primary by our reading (OQ-09). For v4, how a Direct Key signature and a User ID self-signature combine when both carry a Key Expiration Time is not stated (OQ-19).'
      - name: 'expires_at'
        text: 'key.created + Key Expiration Time of effective_self_signature; never if the subpacket is absent or zero. For v3 keys, the validity-days field of the key packet (zero: does not expire).'
        source:
          - locator: '§5.2.3.13'
            quote: 'If this is not present or has a value of zero, the key never expires.'
          - locator: '§5.5.2.1'
            quote: 'A 2-octet number denoting the time in days that the key is valid. If this number is zero, then it does not expire.'
        basis: stated
        constrained_by: ['rfc-9580#R-0104']
      - name: 'authorised_revoker(sig)'
        text: 'sig is a valid Key Revocation (0x20) made by the primary key itself, or by a key named in a Revocation Key subpacket (12, class bit 0x80 set) in a hashed Direct Key self-signature of this key.'
        source:
          - locator: '§10.1.5'
            quote: 'Revocation Signatures are only accepted if they are issued by the key itself or by a key that is authorized to issue revocations via a Revocation Key subpacket in a self-signature by the top-level key.'
          - locator: '§5.2.3.23'
            quote: 'The class octet must have bit 0x80 set.'
        basis: stated
        constrained_by: ['rfc-9580#R-0051', 'rfc-9580#R-0130', 'rfc-9580#R-0132', 'rfc-9580#R-0134']
        note: 'An escrowed revocation (13.9) is a 0x20 made by the key itself and published by someone else; it needs no Revocation Key. The Revocation Key subpacket is deprecated and support for it is uneven (13.9).'
      - name: 'reason(sig)'
        text: 'Reason for Revocation code of sig: 0 no reason, 1 superseded, 2 compromised, 3 retired, 100-110 private; absent if no subpacket.'
        source:
          - locator: '§5.2.3.31'
            quote: 'An implementation SHOULD implement this subpacket, include it in all Revocation Signatures, and interpret revocations appropriately.'
        basis: stated
        constrained_by: ['rfc-9580#R-0146', 'rfc-9580#R-0147', 'rfc-9580#R-0148']
    initial: 'candidate'
    states:
      - name: 'candidate'
        meaning: 'Parsed (M04 complete); status not yet evaluated.'
        basis: inferred
      - name: 'unusable'
        meaning: 'A v6 key with no valid Direct Key signature, or a key with no valid self-signature at all: not to be used.'
        basis: stated
        kind: 'error'
        source:
          - locator: '§5.2.3.10'
            quote: 'An implementation MUST ensure that a valid Direct Key signature is present before using a version 6 key.  This prevents certain attacks where an adversary strips a self-signature specifying a Key Expiration Time or certain preferences.'
        constrained_by: ['rfc-9580#R-0098']
      - name: 'not-yet-valid'
        meaning: 't < key.created.'
        basis: inferred
      - name: 'valid'
        meaning: 'Created, bound by its effective self-signature, not expired, not revoked at t.'
        basis: stated
      - name: 'expired'
        meaning: 't >= expires_at. By our reading, signatures it made while valid stay valid, and a newer self-signature can revive it (M06-T09).'
        basis: inferred
        inferred_reason: 'Only the validity period is stated (5.2.3.13). The source states no consequence of key expiry, neither for signatures made before it nor for revival by a later self-signature; both are the plain reading.'
        source:
          - locator: '§5.2.3.13'
            quote: 'The validity period of the key.  This is the number of seconds after the key creation time that the key expires.'
      - name: 'revoked-soft'
        meaning: 'Revoked by an authorised revoker with reason 1 (superseded) or 3 (retired): not to be used after the revocation; signatures created before it remain valid.'
        basis: stated
        source:
          - locator: '§5.2.3.31'
            quote: 'If a key has been revoked because of a compromise, all signatures created by that key are suspect.  However, if it was merely superseded or retired, old signatures are still valid.'
        constrained_by: ['rfc-9580#R-0149']
      - name: 'revoked-hard'
        meaning: 'Revoked by an authorised revoker with reason 2 (compromised), and by our reading with reason 0, a private code, or no reason (OQ-20): not to be used, and every signature it ever made is suspect.'
        basis: stated
        kind: 'error'
        source:
          - locator: '§5.2.3.31'
            quote: 'If a key has been revoked because of a compromise, all signatures created by that key are suspect.  However, if it was merely superseded or retired, old signatures are still valid.'
        constrained_by: ['rfc-9580#R-0149', 'rfc-9580#R-0050']
    transitions:
      - id: 'M06-T01'
        from: 'candidate'
        to: 'revoked-hard'
        trigger: 'completion'
        guard: 'some SIG of type 0x20 on the key is valid under M05 with authorised_revoker, and reason in {2, 0, private, absent}.'
        source:
          - locator: '§5.2.1.11'
            quote: 'Only Revocation Signatures by the key being revoked, or by a (deprecated) Revocation Key, should be considered valid Revocation Signatures.'
        basis: stated
        constrained_by: ['rfc-9580#R-0050', 'rfc-9580#R-0051', 'rfc-9580#R-0149']
        note: 'This branch needs no Direct Key signature: a v6 revocation certificate is primary key plus revocation only (10.1.2).'
      - id: 'M06-T02'
        from: 'candidate'
        to: 'revoked-soft'
        trigger: 'completion'
        guard: 'no T01 revocation; some authorised valid 0x20 has reason in {1, 3} and creation time <= t.'
        source:
          - locator: '§5.2.3.31'
            quote: 'If a key has been revoked because of a compromise, all signatures created by that key are suspect.  However, if it was merely superseded or retired, old signatures are still valid.'
          - locator: '§10.1.2'
            quote: 'In this case, the Direct Key signature is no longer necessary, since the primary key itself has been marked as unusable.'
        basis: stated
        constrained_by: ['rfc-9580#R-0050', 'rfc-9580#R-0149']
      - id: 'M06-T03'
        from: 'candidate'
        to: 'unusable'
        trigger: 'completion'
        guard: 'no revocation applies, and (key.version = 6 and no valid 0x1F self-signature) or (no valid self-signature of any kind).'
        source:
          - locator: '§5.2.3.10'
            quote: 'An implementation MUST ensure that a valid Direct Key signature is present before using a version 6 key.'
        basis: stated
        constrained_by: ['rfc-9580#R-0098', 'rfc-9580#R-0099']
        note: 'For v4, a valid Direct Key signature or a valid User ID self-signature suffices; requiring a User ID self-signature is discouraged unless the use depends on the User ID (R-0099).'
      - id: 'M06-T04'
        from: 'candidate'
        to: 'not-yet-valid'
        trigger: 'completion'
        guard: 'not T01 to T03, and t < key.created.'
        basis: inferred
        inferred_reason: 'The source gives the creation time but no rule for evaluation before it (OQ-21).'
      - id: 'M06-T05'
        from: 'candidate'
        to: 'expired'
        trigger: 'completion'
        guard: 'not T01 to T04, and t >= expires_at.'
        source:
          - locator: '§5.2.3.13'
            quote: 'This is the number of seconds after the key creation time that the key expires.'
        basis: stated
        constrained_by: ['rfc-9580#R-0104']
      - id: 'M06-T06'
        from: 'candidate'
        to: 'valid'
        trigger: 'completion'
        guard: 'not T01 to T05.'
        basis: stated
        source:
          - locator: '§5.2.3.10'
            quote: 'A cryptographically valid self-signature should be accepted from any primary key, regardless of what Key Flags (Section 5.2.3.29) apply to the primary key.'
      - id: 'M06-T07'
        from: 'not-yet-valid'
        to: 'valid'
        trigger: 'clock_reaches_creation'
        guard: 'not expired at that instant.'
        basis: inferred
        inferred_reason: 'Clock progression.'
      - id: 'M06-T08'
        from: 'valid'
        to: 'expired'
        trigger: 'clock_passes_key_expiration'
        guard: 'expires_at is not never.'
        source:
          - locator: '§5.2.3.13'
            quote: 'The validity period of the key.'
        basis: stated
        constrained_by: ['rfc-9580#R-0104']
      - id: 'M06-T09'
        from: 'expired'
        to: 'valid'
        trigger: 'SIG'
        guard: 'sig is a valid self-signature carrying key-wide information, newer than the current effective_self_signature, whose Key Expiration Time is absent, zero, or puts expires_at after t.'
        actions: ['effective_self_signature := sig']
        source:
          - locator: '§5.2.3.10'
            quote: 'Since a self-signature contains important information about the key''s use, an implementation SHOULD allow the user to rewrite the self-signature and important information in it, such as preferences and key expiration.'
        basis: inferred
        inferred_reason: 'R-0092 lets the keyholder rewrite the expiration and R-0095 makes the newest valid self-signature govern; that this revives an expired key is the combination.'
        constrained_by: ['rfc-9580#R-0092', 'rfc-9580#R-0095']
      - id: 'M06-T10'
        from: 'valid'
        to: 'valid or expired'
        trigger: 'SIG'
        guard: 'sig is a valid self-signature carrying key-wide information, newer than effective_self_signature; the target is expired iff its new expires_at <= t.'
        actions: ['effective_self_signature := sig (preferences, flags, features and expiration now come from it)']
        source:
          - locator: '§5.2.3.10'
            quote: 'An implementation that encounters multiple self-signatures on the same object MUST select the most recent valid self-signature and ignore all other self-signatures.'
        basis: stated
        constrained_by: ['rfc-9580#R-0095']
      - id: 'M06-T11'
        from: 'not-yet-valid or valid or expired'
        to: 'revoked-soft'
        trigger: 'SIG'
        guard: 'sig.type = 0x20, valid under M05, authorised_revoker(sig), reason(sig) in {1, 3}.'
        source:
          - locator: '§10.1.5'
            quote: 'Subkey and Key packets may each be followed by a Revocation Signature packet to indicate that the key is revoked.'
        basis: stated
        constrained_by: ['rfc-9580#R-0050', 'rfc-9580#R-0051', 'rfc-9580#R-0148', 'rfc-9580#R-0149']
      - id: 'M06-T12'
        from: 'not-yet-valid or valid or expired or revoked-soft or unusable'
        to: 'revoked-hard'
        trigger: 'SIG'
        guard: 'sig.type = 0x20, valid under M05, authorised_revoker(sig), reason(sig) in {2, 0, private, absent}.'
        source:
          - locator: '§5.2.3.31'
            quote: 'There are important semantic differences between the reasons, and there are thus important reasons for revoking signatures.'
        basis: stated
        constrained_by: ['rfc-9580#R-0050', 'rfc-9580#R-0051', 'rfc-9580#R-0148', 'rfc-9580#R-0149']
        note: 'From revoked-soft: a later compromise revocation hardens an earlier superseded or retired one (inferred). Treating 0, private and absent as hard is OQ-20.'
      - id: 'M06-T13'
        from: 'any non-final state'
        to: 'same state'
        trigger: 'SIG'
        guard: 'sig.type = 0x20 and (not valid under M05, or not authorised_revoker(sig)).'
        source:
          - locator: '§5.2.1.11'
            quote: 'Only Revocation Signatures by the key being revoked, or by a (deprecated) Revocation Key, should be considered valid Revocation Signatures.'
        basis: stated
        constrained_by: ['rfc-9580#R-0051']
      - id: 'M06-T14'
        from: 'unusable'
        to: 'candidate'
        trigger: 'SIG'
        guard: 'sig is a valid Direct Key self-signature (v6) or valid self-signature (v4) newly obtained, for example by a key refresh.'
        basis: inferred
        inferred_reason: 'Re-evaluation once the missing self-signature is present; R-0098 only forbids use while it is absent.'
        constrained_by: ['rfc-9580#R-0098']
    error_states: ['unusable', 'revoked-hard']
    terminal_states: ['revoked-hard']
    guard_coverage:
      - 'T01 to T06 are evaluated in order and are exclusive and complete for one evaluation at t.'
    note: 'Revocation is final: the source defines no way to undo a Key Revocation (a Revocable=0 subpacket concerns revocation of the signature that carries it, not 0x20). revoked-soft is final for use but leaves old signatures valid. Sensitive Revocation Key subpackets (class bit 0x40) SHOULD NOT be exported except to the revoker or with its revocation (R-0133, R-0135).'
    constrained_by: ['rfc-9580#R-0131', 'rfc-9580#R-0133', 'rfc-9580#R-0135']

  # ======================================================================
  - id: 'M07'
    name: 'subkey-validity'
    locator: '§5.2.1.8, §5.2.1.9, §5.2.1.12, §5.2.3.10, §5.2.3.13, §5.2.3.29, §10.1.1, §10.1.3, §10.1.5'
    actor: 'evaluator: an implementation deciding whether a subkey may be used at time t'
    purpose: 'Derive the status of one subkey from its Subkey Binding signatures (with the embedded Primary Key Binding signature for a signing subkey), the Key Expiration Time on its effective binding signature, its Subkey Revocation signatures, and the status of the primary key.'
    inputs:
      - name: 'subkey'
        type: 'one subkey and its signatures from M04, not marked unusable by M04'
      - name: 'primary_status'
        type: 'M06 state of the primary key at t'
      - name: 't'
        type: 'evaluation time'
    derived:
      - name: 'effective_binding'
        text: 'The most recent 0x18 signature on this subkey that M05 finds valid, is made by the primary key, has the same version as the primary key for v6, and, if its Key Flags (hashed) include 0x02 (sign data) or the subkey otherwise signs, carries in its hashed area an Embedded Signature (32) holding a 0x19 by the subkey over primary key and subkey that M05 finds valid.'
        source:
          - locator: '§5.2.1.8'
            quote: 'A signature that binds a signing subkey MUST have an Embedded Signature subpacket in this binding signature that contains a 0x19 signature made by the signing subkey on the primary key and subkey.'
          - locator: '§10.1.1'
            quote: 'Every Subkey Binding signature MUST be a self-signature (that is, made by the version 6 primary key).'
        basis: stated
        constrained_by: ['rfc-9580#R-0049', 'rfc-9580#R-0095', 'rfc-9580#R-0314', 'rfc-9580#R-0315', 'rfc-9580#R-0317', 'rfc-9580#R-0326']
        note: 'Which subkeys count as signing subkeys (key flag 0x02, a sign-capable algorithm, or both) is not defined (OQ-22).'
      - name: 'expires_at'
        text: 'subkey.created + Key Expiration Time of effective_binding; never if absent or zero.'
        source:
          - locator: '§5.2.3.13'
            quote: 'For a Subkey Binding signature, the key creation time is that of the subkey.'
        basis: stated
        constrained_by: ['rfc-9580#R-0104']
    initial: 'candidate'
    states:
      - name: 'candidate'
        meaning: 'Parsed; not yet evaluated.'
        basis: inferred
      - name: 'unbound'
        meaning: 'No effective_binding: the subkey is not part of the key.'
        basis: stated
        kind: 'error'
        source:
          - locator: '§5.2.3.10'
            quote: 'For Subkey Binding signatures, each subkey MUST have a self-signature.'
        constrained_by: ['rfc-9580#R-0088', 'rfc-9580#R-0313']
      - name: 'bound'
        meaning: 'Bound, created, not expired, not revoked, and the primary key is usable at t; usable for the purposes its Key Flags allow.'
        basis: stated
      - name: 'expired'
        meaning: 't >= expires_at.'
        basis: stated
      - name: 'revoked'
        meaning: 'A valid 0x28 by the primary key or a designated revoker exists (soft or hard per its reason, OQ-23).'
        basis: stated
        kind: 'error'
      - name: 'primary-unusable'
        meaning: 'The primary key is unusable, expired or revoked at t, so the subkey is not used.'
        basis: inferred
        kind: 'error'
    transitions:
      - id: 'M07-T01'
        from: 'candidate'
        to: 'revoked'
        trigger: 'completion'
        guard: 'some SIG of type 0x28 on this subkey is valid under M05 and made by the primary key or by a designated Revocation Key of the primary.'
        source:
          - locator: '§5.2.1.12'
            quote: 'Only Revocation Signatures by the top-level signature key that is bound to this subkey, or by a (deprecated) Revocation Key, should be considered valid Revocation Signatures.'
          - locator: '§5.2.1.12'
            quote: 'A revoked subkey is not to be used.'
        basis: stated
        constrained_by: ['rfc-9580#R-0052', 'rfc-9580#R-0053', 'rfc-9580#R-0091']
      - id: 'M07-T02'
        from: 'candidate'
        to: 'unbound'
        trigger: 'completion'
        guard: 'no T01, and no effective_binding exists (no valid 0x18, or a signing subkey without a valid embedded 0x19).'
        actions: ['for each 0x18: run M05; for a signing subkey, run M05 on the embedded 0x19 signature too']
        source:
          - locator: '§10.1.5'
            quote: 'For subkeys that can issue signatures, the Subkey Binding signature MUST contain an Embedded Signature subpacket with a Primary Key Binding signature (Type ID 0x19) issued by the subkey on the top-level key.'
        basis: stated
        constrained_by: ['rfc-9580#R-0049', 'rfc-9580#R-0326', 'rfc-9580#R-0313', 'rfc-9580#R-0088']
      - id: 'M07-T03'
        from: 'candidate'
        to: 'primary-unusable'
        trigger: 'completion'
        guard: 'no T01 or T02, and primary_status in {unusable, revoked-soft, revoked-hard, expired, not-yet-valid}.'
        source:
          - locator: '§5.2.1.11'
            quote: 'A revoked key is not to be used.'
        basis: inferred
        inferred_reason: 'The source says a revoked key is not to be used; extending that to its subkeys, and the same for an expired or unusable primary, is ours (OQ-24).'
        constrained_by: ['rfc-9580#R-0050', 'rfc-9580#R-0098']
      - id: 'M07-T04'
        from: 'candidate'
        to: 'expired'
        trigger: 'completion'
        guard: 'not T01 to T03, and t >= expires_at.'
        source:
          - locator: '§5.2.3.13'
            quote: 'For a Subkey Binding signature, the key creation time is that of the subkey.'
        basis: stated
        constrained_by: ['rfc-9580#R-0104']
      - id: 'M07-T05'
        from: 'candidate'
        to: 'bound'
        trigger: 'completion'
        guard: 'not T01 to T04 (and t >= subkey.created; OQ-21).'
        actions: ['usage := Key Flags of effective_binding (unstated flags are zero; no fixed length assumed)']
        source:
          - locator: '§5.2.3.29'
            quote: 'If a list is shorter than an implementation expects, the unstated flags are considered to be zero.'
        basis: stated
        constrained_by: ['rfc-9580#R-0142', 'rfc-9580#R-0143', 'rfc-9580#R-0144']
      - id: 'M07-T06'
        from: 'bound'
        to: 'expired'
        trigger: 'clock_passes_key_expiration'
        guard: 'expires_at is not never.'
        basis: stated
        source:
          - locator: '§5.2.3.13'
            quote: 'The validity period of the key.'
        constrained_by: ['rfc-9580#R-0104']
      - id: 'M07-T07'
        from: 'expired or unbound'
        to: 'candidate'
        trigger: 'SIG'
        guard: 'a new 0x18 on this subkey, newer than effective_binding.'
        actions: ['re-evaluate with the new binding as effective_binding if valid']
        source:
          - locator: '§5.2.3.10'
            quote: 'An implementation that encounters multiple self-signatures on the same object MUST select the most recent valid self-signature and ignore all other self-signatures.'
        basis: stated
        constrained_by: ['rfc-9580#R-0095']
      - id: 'M07-T08'
        from: 'bound or expired or unbound'
        to: 'revoked'
        trigger: 'SIG'
        guard: 'sig.type = 0x28, valid under M05, by the primary key or a designated Revocation Key.'
        source:
          - locator: '§5.2.3.10'
            quote: 'Revoking a binding signature effectively retires that subkey.'
        basis: stated
        constrained_by: ['rfc-9580#R-0052', 'rfc-9580#R-0053', 'rfc-9580#R-0091']
      - id: 'M07-T09'
        from: 'bound'
        to: 'primary-unusable'
        trigger: 'primary_status_change'
        guard: 'the new primary_status is not valid.'
        basis: inferred
        inferred_reason: 'As M07-T03. Pass 3 replaced the completion trigger: a change of the primary key status is an external event, not the end of an activity of bound.'
      - id: 'M07-T10'
        from: 'primary-unusable'
        to: 'candidate'
        trigger: 'primary_status_change'
        guard: 'the new primary_status is valid (for example the primary key was renewed by a newer self-signature, M06-T09).'
        actions: ['re-evaluate']
        basis: inferred
        inferred_reason: 'Added in pass 3: primary-unusable had no outgoing transition and is not terminal, while M06 lets an expired or unusable primary key become valid again. That the subkey follows its primary is our reading (OQ-24).'
    error_states: ['unbound', 'revoked', 'primary-unusable']
    terminal_states: ['revoked']
    note: 'Encryption-subkey choice by Key Flags (0x04 communications, 0x08 storage) is left wholly to the implementation (5.2.3.29 usage notes); the split-key (0x10) and group-key (0x80) flags belong only on 0x1F or 0x18 (R-0144).'

  # ======================================================================
  - id: 'M08'
    name: 'user-id-binding'
    locator: '§5.2.1.4 to §5.2.1.7, §5.2.1.13, §5.2.3.10, §5.2.3.18, §5.2.3.27, §5.2.3.31, §5.12, §10.1.5'
    actor: 'evaluator: an implementation deciding whether a User ID (or User Attribute) is bound to its key at t'
    purpose: 'Status of one User ID or User Attribute from its self-certifications (0x10 to 0x13 by the primary key) and self-made Certification Revocations (0x30).'
    derived:
      - name: 'effective_self_cert'
        text: 'The most recent certification (0x10 to 0x13) on this User ID made by the primary key that M05 finds valid at t.'
        source:
          - locator: '§5.2.3.10'
            quote: 'An implementation that encounters multiple self-signatures on the same object MUST select the most recent valid self-signature and ignore all other self-signatures.'
        basis: stated
        constrained_by: ['rfc-9580#R-0095', 'rfc-9580#R-0087']
      - name: 'primary_user_id'
        text: 'Among bound User IDs, the one whose effective_self_cert has Primary User ID = 1; with several, the most recent self-signature is RECOMMENDED; User IDs and User Attributes have independent primaries.'
        source:
          - locator: '§5.2.3.27'
            quote: 'If more than one User ID in a key is marked as primary, the implementation may resolve the ambiguity in any way it sees fit, but it is RECOMMENDED that priority be given to the User ID with the most recent self-signature.'
        basis: stated
        constrained_by: ['rfc-9580#R-0141']
    initial: 'candidate'
    states:
      - name: 'candidate'
        meaning: 'Parsed; not yet evaluated.'
        basis: inferred
      - name: 'unbound'
        meaning: 'No valid self-certification: the User ID is not asserted by the keyholder.'
        basis: inferred
        kind: 'error'
      - name: 'bound'
        meaning: 'A valid, unexpired self-certification exists; its subpackets apply to this User ID.'
        basis: stated
        source:
          - locator: '§5.2.3.10'
            quote: 'Subpackets that appear in a certification self-signature apply to the User ID, and subpackets that appear in the subkey self-signature apply to the subkey.'
      - name: 'self-cert-expired'
        meaning: 'The effective self-certification passed its Signature Expiration Time.'
        basis: stated
      - name: 'retired'
        meaning: 'The keyholder revoked the self-certification: the user name is no longer in use.'
        basis: stated
        kind: 'error'
        source:
          - locator: '§5.2.3.10'
            quote: 'Revoking the self-signature on a User ID effectively retires that user name.'
        constrained_by: ['rfc-9580#R-0090', 'rfc-9580#R-0150']
    transitions:
      - id: 'M08-T01'
        from: 'candidate'
        to: 'retired'
        trigger: 'completion'
        guard: 'a 0x30 on this User ID made by the primary key (or a designated Revocation Key) is valid under M05, is later than the certification it revokes, and that certification is revocable (no Revocable = 0).'
        source:
          - locator: '§5.2.1.13'
            quote: 'The signature is computed over the same data as the certification that it revokes, and it should have a later creation date than that certification.'
          - locator: '§5.2.3.31'
            quote: 'If the revoked signature is the self-signature for certifying a User ID, a revocation denotes that that user name is no longer in use.  Such a signature revocation SHOULD include a Reason for Revocation subpacket containing code 32.'
        basis: stated
        constrained_by: ['rfc-9580#R-0054', 'rfc-9580#R-0055', 'rfc-9580#R-0090', 'rfc-9580#R-0112', 'rfc-9580#R-0150']
        note: 'Which self-certification a 0x30 revokes (all earlier ones, or the one its Signature Target names) is not fully stated (OQ-25). The later-creation clause of the guard is ours as a hard condition: the source says only that the revocation should have a later creation date (OQ-39).'
        unspecified:
          - 'A 0x30 whose creation time is not later than the certification it names (OQ-39).'
      - id: 'M08-T02'
        from: 'candidate'
        to: 'unbound'
        trigger: 'completion'
        guard: 'no T01, and no self-certification is valid under M05.'
        basis: inferred
        inferred_reason: 'Absence of the keyholder''s assertion.'
      - id: 'M08-T03'
        from: 'candidate'
        to: 'self-cert-expired'
        trigger: 'completion'
        guard: 'no T01; every valid self-certification has passed its Signature Expiration Time at t.'
        source:
          - locator: '§5.2.3.10'
            quote: 'Revoking a self-signature or allowing it to expire has a semantic meaning that varies with the signature type.'
        basis: stated
        constrained_by: ['rfc-9580#R-0107']
      - id: 'M08-T04'
        from: 'candidate'
        to: 'bound'
        trigger: 'completion'
        guard: 'not T01 to T03.'
        basis: stated
        source:
          - locator: '§10.1.5'
            quote: 'Each of the following User ID packets provides the identity of the owner of this public key.'
      - id: 'M08-T05'
        from: 'bound'
        to: 'self-cert-expired'
        trigger: 'clock_passes_signature_expiration'
        guard: 'no newer valid self-certification remains unexpired.'
        basis: stated
        source:
          - locator: '§5.2.3.18'
            quote: 'This is the number of seconds after the Signature Creation Time that the signature expires.'
        constrained_by: ['rfc-9580#R-0107']
      - id: 'M08-T06'
        from: 'self-cert-expired or unbound or bound'
        to: 'candidate'
        trigger: 'SIG'
        guard: 'a new self-certification on this User ID.'
        actions: ['re-evaluate']
        source:
          - locator: '§5.2.3.10'
            quote: 'Since a self-signature contains important information about the key''s use, an implementation SHOULD allow the user to rewrite the self-signature and important information in it, such as preferences and key expiration.'
        basis: stated
        constrained_by: ['rfc-9580#R-0092', 'rfc-9580#R-0095']
      - id: 'M08-T07'
        from: 'bound or self-cert-expired'
        to: 'retired'
        trigger: 'SIG'
        guard: 'as M08-T01.'
        source:
          - locator: '§5.2.3.10'
            quote: 'Similarly, if the users themselves revoke their self-signature, then the users no longer go by that name, no longer have that email address, etc.'
        basis: stated
        constrained_by: ['rfc-9580#R-0090', 'rfc-9580#R-0150']
    error_states: ['unbound', 'retired']
    terminal_states: ['retired']
    note: 'A key may be used without any bound User ID (R-0099), except where the use depends on the User ID; an email verifier MAY require a bound User ID matching From: (R-0100). User Attributes follow the same machine; an implementation SHOULD at least handle their certifications (R-0226).'
    constrained_by: ['rfc-9580#R-0099', 'rfc-9580#R-0100', 'rfc-9580#R-0226']

  # ======================================================================
  - id: 'M09'
    name: 'certification-lifecycle'
    locator: '§5.2.1.13, §5.2.3.18, §5.2.3.19, §5.2.3.20, §5.2.3.31, §5.2.3.33'
    actor: 'evaluator, and an exporting or importing implementation'
    purpose: 'Lifecycle of one certification signature (0x10 to 0x13, including trust signatures, or 0x1F by a third party): valid, expired, revoked, with irrevocable and local (non-exportable) variants.'
    initial: 'issued'
    states:
      - name: 'issued'
        meaning: 'Present on the key; not yet verified.'
        basis: inferred
      - name: 'valid'
        meaning: 'M05 valid; counts in validity and trust calculations.'
        basis: stated
      - name: 'expired'
        meaning: 'Past its Signature Expiration Time.'
        basis: stated
      - name: 'revoked'
        meaning: 'Revoked by its issuer (or a designated revoker): no longer part of validity calculations.'
        basis: stated
        kind: 'error'
        source:
          - locator: '§5.2.3.31'
            quote: 'A revoked certification is no longer a part of validity calculations.'
        constrained_by: ['rfc-9580#R-0151']
      - name: 'stripped'
        meaning: 'A local (non-exportable) certification removed on export or import.'
        basis: stated
      - name: 'invalid'
        meaning: 'M05 did not end in valid.'
        basis: inferred
        kind: 'error'
    transitions:
      - id: 'M09-T01'
        from: 'issued'
        to: 'valid'
        trigger: 'completion'
        guard: 'M05 ends in valid.'
        basis: stated
        source:
          - locator: '§10.1.5'
            quote: 'In effect, the signer is testifying to the belief that this public key belongs to the user identified by this User ID.'
      - id: 'M09-T02'
        from: 'issued'
        to: 'invalid'
        trigger: 'completion'
        guard: 'M05 ends in invalid, ignored or refused.'
        basis: inferred
        inferred_reason: 'Complement of T01.'
      - id: 'M09-T03'
        from: 'issued'
        to: 'expired'
        trigger: 'completion'
        guard: 'M05 ends in expired.'
        basis: stated
        source:
          - locator: '§5.2.3.18'
            quote: 'If this is not present or has a value of zero, it never expires.'
        constrained_by: ['rfc-9580#R-0107']
      - id: 'M09-T04'
        from: 'valid'
        to: 'expired'
        trigger: 'clock_passes_signature_expiration'
        guard: 'a non-zero Signature Expiration Time is in the hashed area.'
        basis: stated
        source:
          - locator: '§5.2.3.18'
            quote: 'The validity period of the signature.'
        constrained_by: ['rfc-9580#R-0107']
      - id: 'M09-T05'
        from: 'valid or expired'
        to: 'revoked'
        trigger: 'SIG'
        guard: 'sig.type = 0x30 over the same data, valid under M05, issued by the same key as the certification or a designated Revocation Key, created after the certification, and the certification has no hashed Revocable subpacket with value 0. A Signature Target, if present, names this certification (hash size per its hash algorithm).'
        source:
          - locator: '§5.2.1.13'
            quote: 'It should be issued by the same key that issued the revoked signature or by a (deprecated) Revocation Key.'
          - locator: '§5.2.3.33'
            quote: 'For Revocation Signatures, this subpacket provides explicit designation of which signature is being revoked.'
        basis: stated
        constrained_by: ['rfc-9580#R-0054', 'rfc-9580#R-0055', 'rfc-9580#R-0113', 'rfc-9580#R-0151', 'rfc-9580#R-0154', 'rfc-9580#R-0155', 'rfc-9580#R-0156']
        note: 'The created-after clause of the guard is ours as a hard condition: the source says only that the revocation should have a later creation date (OQ-39).'
        unspecified:
          - 'A 0x30 whose creation time is not later than the certification it names (OQ-39).'
      - id: 'M09-T06'
        from: 'valid or expired'
        to: 'same state'
        trigger: 'SIG'
        guard: 'sig.type = 0x30 that would match T05, but the certification has Revocable = 0.'
        source:
          - locator: '§5.2.3.20'
            quote: 'Signatures that are not revocable ignore any later Revocation Signatures.  They represent the signer''s commitment that its signature cannot be revoked for the life of its key.'
        basis: stated
        constrained_by: ['rfc-9580#R-0112', 'rfc-9580#R-0113']
      - id: 'M09-T07'
        from: 'issued or valid or expired'
        to: 'stripped'
        trigger: 'key_export_or_import'
        guard: 'the certification has a hashed Exportable Certification subpacket with value 0.'
        actions: ['delete the certification from the copy']
        source:
          - locator: '§5.2.3.19'
            quote: 'Thus, when an implementation prepares a user''s copy of a key for transport to another user (this is the process of "exporting" the key), any local certification signatures are deleted from the key.'
          - locator: '§5.2.3.19'
            quote: 'The receiver of a transported key "imports" it and likewise trims any local certifications.'
        basis: stated
        constrained_by: ['rfc-9580#R-0109', 'rfc-9580#R-0110', 'rfc-9580#R-0111']
        note: 'An absent Exportable Certification subpacket means exportable (R-0109).'
    error_states: ['revoked', 'invalid']
    terminal_states: ['revoked', 'stripped', 'invalid']
    note: 'A reason code 32 on a certification revocation says the User ID information is no longer valid; reasons 0 and 32 are the certification-revocation codes of Table 10.'

  # ======================================================================
  - id: 'M10'
    name: 'trust-signature-chain'
    locator: '§5.2.3.21, §5.2.3.22, §8, §5.2.3.31'
    actor: 'evaluator of trust along a chain of certifications from a trusted starting key to a target User ID'
    purpose: 'Propagate introducer status from key to key through Trust Signature subpackets: each hop consumes one level of depth, carries a trust amount (below 120 partial, 120 or more complete), and narrows the set of User IDs on which the introducer is trusted by any Regular Expression subpackets.'
    state_variables:
      - name: 'introducer'
        type: 'the key currently acting as introducer'
      - name: 'depth'
        type: 'integer >= 0: how many further levels of trust signatures the introducer may issue; 0 means its certifications validate keys but do not create introducers'
        basis: inferred
      - name: 'amount'
        type: 'integer 0 to 255; < 120 partial, >= 120 complete'
        source:
          - locator: '§5.2.3.21'
            quote: 'The trust amount is in a range from 0-255, interpreted such that values less than 120 indicate partial trust and values of 120 or greater indicate complete trust.'
        constrained_by: ['rfc-9580#R-0119']
      - name: 'scope'
        type: 'set of Regular Expressions; a User ID is in scope iff it matches every expression in the set (empty set: every User ID)'
        basis: inferred
        note: 'Conjunction along the chain is our reading of ''limit the scope of trust that is extended'' (OQ-26).'
    initial: 'root'
    states:
      - name: 'root'
        meaning: 'The evaluator''s own trusted key (or locally configured trust root) with depth and scope from local policy.'
        basis: inferred
      - name: 'introducer'
        meaning: 'A key asserted, by a valid trust signature of level >= 1 from an introducer, to be a trusted introducer, with (depth, amount, scope).'
        basis: stated
        source:
          - locator: '§5.2.3.21'
            quote: 'Level 1 means that the signed key is asserted to be a valid trusted introducer, with the 2nd octet of the body specifying the degree of trust.'
        constrained_by: ['rfc-9580#R-0116', 'rfc-9580#R-0117']
      - name: 'validated'
        meaning: 'The target User ID on the target key is certified by an introducer whose scope includes it (partially or completely, per amount).'
        basis: stated
        source:
          - locator: '§5.2.3.21'
            quote: 'Level 0 has the same meaning as an ordinary validity signature.'
        constrained_by: ['rfc-9580#R-0115']
      - name: 'out-of-scope'
        meaning: 'The certification is on a User ID the introducer''s scope excludes; no trust is extended through it.'
        basis: stated
        source:
          - locator: '§5.2.3.22'
            quote: 'Only signatures by the target key on User IDs that match the Regular Expression in the body of this packet have trust extended by the Trust Signature subpacket.'
        constrained_by: ['rfc-9580#R-0123']
      - name: 'exhausted'
        meaning: 'The introducer has depth 0 and the certification would make another introducer; it only validates.'
        basis: inferred
      - name: 'no-trust'
        meaning: 'The certification is not valid (M09 not valid) or carries a malformed Regular Expression; nothing propagates.'
        basis: inferred
        kind: 'error'
    transitions:
      - id: 'M10-T01'
        from: 'root or introducer'
        to: 'introducer'
        trigger: 'SIG'
        guard: 'sig is a certification by the current introducer on User ID u of key K; M09 valid; u matches every expression in scope; sig has a hashed Trust Signature (5) with level L >= 1; depth >= 1.'
        actions:
          - 'introducer := K'
          - 'depth := min(depth - 1, L - 1) (a level n signature lets K issue level n-1 signatures)'
          - 'amount := the trust amount octet of sig (how amounts combine along the chain is OQ-27)'
          - 'scope := scope plus each hashed Regular Expression of sig (null terminator removed)'
        source:
          - locator: '§5.2.3.21'
            quote: 'Generally, a level n Trust Signature asserts that a key is trusted to issue level n-1 Trust Signatures.'
          - locator: '§5.2.3.22'
            quote: 'Used in conjunction with Trust Signature packets (of level > 0) to limit the scope of trust that is extended.'
        basis: inferred
        inferred_reason: 'Level semantics and regex scoping are stated; the min() with the introducer''s remaining depth and the accumulation of scope are ours.'
        constrained_by: ['rfc-9580#R-0114', 'rfc-9580#R-0116', 'rfc-9580#R-0117', 'rfc-9580#R-0118', 'rfc-9580#R-0119', 'rfc-9580#R-0122', 'rfc-9580#R-0123', 'rfc-9580#R-0124', 'rfc-9580#R-0125', 'rfc-9580#R-0126']
      - id: 'M10-T02'
        from: 'root or introducer'
        to: 'validated'
        trigger: 'SIG'
        guard: 'sig is a certification by the introducer on User ID u of key K; M09 valid; u matches every expression in scope; sig has no Trust Signature, or one with level 0.'
        actions: ['record (K, u) as validated with weight amount of the introducer (partial < 120, complete >= 120)']
        source:
          - locator: '§5.2.3.21'
            quote: 'Level 0 has the same meaning as an ordinary validity signature.'
        basis: stated
        constrained_by: ['rfc-9580#R-0115', 'rfc-9580#R-0119']
      - id: 'M10-T03'
        from: 'root or introducer'
        to: 'exhausted'
        trigger: 'SIG'
        guard: 'as T01 but depth = 0.'
        actions: ['treat sig as T02 (validation only)']
        basis: inferred
        inferred_reason: 'Follows from level n-1 being the most an introducer of level n may issue.'
        constrained_by: ['rfc-9580#R-0118']
      - id: 'M10-T04'
        from: 'root or introducer'
        to: 'out-of-scope'
        trigger: 'SIG'
        guard: 'u fails to match some expression in scope.'
        source:
          - locator: '§5.2.3.22'
            quote: 'The Regular Expression matches (or does not match) a sequence of UTF-8-encoded Unicode characters from User IDs.  The expression itself is also written with UTF-8 characters.'
        basis: stated
        constrained_by: ['rfc-9580#R-0123', 'rfc-9580#R-0125']
      - id: 'M10-T05'
        from: 'root or introducer'
        to: 'no-trust'
        trigger: 'SIG'
        guard: 'M09 not valid (invalid, expired, revoked), or a critical Regular Expression subpacket lacks its null terminator (the signature is rejected), or the expression does not parse under section 8.'
        source:
          - locator: '§5.2.3.31'
            quote: 'A revoked certification is no longer a part of validity calculations.'
          - locator: '§5.2.3.22'
            quote: 'When an implementation parses a Regular Expression subpacket, it MUST remove this octet; if it is not present, it MUST reject the subpacket (i.e., ignore the subpacket if it''s non-critical and reject the signature if it''s critical).'
        basis: stated
        constrained_by: ['rfc-9580#R-0151', 'rfc-9580#R-0127']
        note: 'A non-critical Regular Expression without its terminator is ignored, which widens scope. The source does not address an expression that fails to parse (OQ-26): that clause of the guard is ours (inferred); the other two clauses are stated.'
    error_states: ['no-trust']
    terminal_states: ['validated', 'out-of-scope', 'exhausted', 'no-trust']
    note: 'The source defines what one trust signature asserts; how partial amounts add up to validity, and how many independent paths are required, are local policy (not_modelled). Implementations SHOULD emit 60 for partial and 120 for complete trust (R-0120). The Regular Expression syntax is section 8 (Henry Spencer); the matcher itself is not modelled.'
    constrained_by: ['rfc-9580#R-0120', 'rfc-9580#R-0121', 'rfc-9580#R-0128', 'rfc-9580#R-0129']

  # ======================================================================
  - id: 'M11'
    name: 'session-key-recovery'
    locator: '§5.1, §5.1.1 to §5.1.8, §5.3, §5.3.1, §5.3.2, §5.7, §10.3.2.1, §11.5, §12.1.2, §12.2, §13.4, §13.5, §9.3'
    actor: 'recipient: the decrypting implementation, with its secret keys (unlocked through M14) and any passphrases'
    purpose: 'From the ESK packets preceding an encryption container, discard those whose version does not align with the payload, try the remaining ones against the available secret keys and passphrases, and end with a session key and symmetric algorithm for M12 or M13, or with no session key.'
    inputs:
      - name: 'esk_list'
        type: 'the PKESK and SKESK packets collected by M02, in order'
      - name: 'payload'
        type: 'SED, SEIPD v1 or SEIPD v2 (version octet and, for v2, cipher, AEAD algorithm, chunk size, salt)'
    initial: 'filtering'
    states:
      - name: 'filtering'
        meaning: 'Discarding ESKs whose version does not align with the payload (Table 26).'
        basis: stated
        steps:
          - id: 'F01'
            kind: 'action'
            applies_when: 'payload is SEIPD v1'
            action: 'keep only v3 PKESK and v4 SKESK; discard v6 PKESK and v6 SKESK.'
            source:
              - locator: '§10.3.2.1'
                quote: 'Since a v1 SEIPD does not contain a symmetric algorithm ID, all ESK packets preceding a v1 SEIPD payload MUST be either v3 PKESK or v4 SKESK.'
            basis: stated
            constrained_by: ['rfc-9580#R-0338', 'rfc-9580#R-0343', 'rfc-9580#R-0036', 'rfc-9580#R-0183']
          - id: 'F02'
            kind: 'action'
            applies_when: 'payload is SEIPD v2'
            action: 'keep only v6 PKESK and v6 SKESK; discard v3 PKESK and v4 SKESK.'
            source:
              - locator: '§10.3.2.1'
                quote: 'Additionally, to avoid potentially conflicting cipher algorithm IDs, and for simplicity, implementations MUST NOT precede a v2 SEIPD payload with either v3 PKESK or v4 SKESK packets.'
              - locator: '§10.3.2.1'
                quote: 'An implementation processing an Encrypted Message MUST discard any preceding ESK packet with a version that does not align with the version of the payload.'
            basis: stated
            constrained_by: ['rfc-9580#R-0339', 'rfc-9580#R-0340', 'rfc-9580#R-0343', 'rfc-9580#R-0035', 'rfc-9580#R-0181']
          - id: 'F03'
            kind: 'action'
            applies_when: 'payload is SED'
            action: 'keep v3 PKESK, v4 SKESK and (historic) v2 PKESK; discard v6 ESKs.'
            source:
              - locator: '§5.1.2'
                quote: 'A v6 PKESK packet MUST NOT precede a v1 SEIPD packet or a deprecated SED packet (see Section 10.3.2.1).'
            basis: stated
            constrained_by: ['rfc-9580#R-0036', 'rfc-9580#R-0183', 'rfc-9580#R-0343']
          - id: 'F04'
            kind: 'action'
            applies_when: 'an ESK has an unknown version'
            action: 'discard it.'
            basis: inferred
            inferred_reason: 'An unknown version cannot align with any payload (R-0343); the source states no consumer action for it (OQ-37).'
            constrained_by: ['rfc-9580#R-0343']
      - name: 'trying'
        meaning: 'Trying the next remaining ESK.'
        basis: inferred
        steps:
          - id: 'E01'
            kind: 'check'
            applies_when: 'ESK is a PKESK'
            check: 'it addresses an available secret key or subkey: v3 by Key ID, v6 by key version and fingerprint; an all-zero Key ID or a zero-length v6 key field (anonymous recipient) matches every available key, each tried in turn.'
            on_failure: 'M11-T03'
            source:
              - locator: '§5.1.8'
                quote: 'In this case, the receiving implementation would try all available private keys, checking for a valid decrypted session key.'
            basis: stated
            constrained_by: ['rfc-9580#R-0042', 'rfc-9580#R-0005']
          - id: 'E02'
            kind: 'invoke'
            applies_when: 'ESK is a PKESK and the matching secret key is locked'
            invoke: 'M14 (secret key unlock).'
            on_failure: 'M11-T03'
            basis: inferred
            inferred_reason: 'The secret key material is needed to decrypt.'
          - id: 'E03'
            kind: 'check'
            applies_when: 'ESK is a v6 PKESK carrying MPIs (RSA, Elgamal, ECDH)'
            check: 'each MPI bit length matches its most significant non-zero bit.'
            on_failure: 'M11-T03'
            source:
              - locator: '§3.2'
                quote: 'When parsing an MPI in a version 6 Key, Signature, or Public Key Encrypted Session Key (PKESK) packet, the implementation MUST check that the encoded length matches the length starting from the most significant non-zero bit; if it doesn''t match, reject the packet as malformed.'
            basis: stated
            constrained_by: ['rfc-9580#R-0003']
          - id: 'E04'
            kind: 'action'
            applies_when: 'ESK is a PKESK'
            action: 'decrypt per algorithm. RSA: m = c^d mod n, then EME-PKCS1-v1_5-DECODE. Elgamal: as RSA with PKCS#1 decode. ECDH: S = rV, Z = KDF(S, Z_len, Param) with the recipient fingerprint, AES key unwrap (RFC 3394 default IV), remove PKCS#5 padding. X25519 / X448: HKDF-SHA256 / HKDF-SHA512 (info "OpenPGP X25519" / "OpenPGP X448", no salt) over ephemeral key || recipient public key || shared secret, then AES-128 / AES-256 key unwrap; for v3 the cipher octet is in the clear before the wrapped key.'
            source:
              - locator: '§5.1.3'
                quote: 'When decoding "m" during decryption, an implementation should follow Step 3 in Section 7.2.2 of [RFC8017] (see also Section 12.1.2).'
              - locator: '§11.5'
                quote: 'The decryption is the inverse of the method given.'
            basis: stated
            constrained_by: ['rfc-9580#R-0366', 'rfc-9580#R-0367', 'rfc-9580#R-0353', 'rfc-9580#R-0355', 'rfc-9580#R-0352', 'rfc-9580#R-0302']
          - id: 'E05'
            kind: 'check'
            applies_when: 'ESK is a PKESK with RSA, Elgamal or ECDH'
            check: 'the PKCS#1 (or PKCS#5) padding is well formed; for v3 the first octet is a known symmetric algorithm other than 0; the trailing 2-octet checksum equals the sum of the session key octets mod 65536; the session key length fits the algorithm (v3: the cipher of the first octet; v6: the cipher of the v2 SEIPD).'
            on_failure: 'M11-T03'
            source:
              - locator: '§12.1.2'
                quote: 'If the first octet of EM does not have hexadecimal value 0x00, the second octet of EM does not have hexadecimal value 0x02, there is no octet with hexadecimal value 0x00 to separate PS from M, or the length of PS is less than 8 octets, output "decryption error" and stop.'
              - locator: '§13.5'
                quote: 'To make the attack more difficult, an implementation SHOULD implement strict, robust, and constant time padding checks.'
            basis: stated
            constrained_by: ['rfc-9580#R-0367', 'rfc-9580#R-0403', 'rfc-9580#R-0377']
          - id: 'E06'
            kind: 'check'
            applies_when: 'ESK is a v3 PKESK with X25519 or X448'
            check: 'the clear-text symmetric algorithm octet is 7, 8 or 9 (AES-128, AES-192, AES-256).'
            on_failure: 'M11-T03'
            source:
              - locator: '§5.1.6'
                quote: 'In this case, the symmetric algorithm used MUST be AES-128, AES-192, or AES-256 (algorithm IDs 7, 8, or 9, respectively).'
            basis: inferred
            inferred_reason: 'The MUST binds the content; treating any other value as a failed ESK is ours.'
            constrained_by: ['rfc-9580#R-0040', 'rfc-9580#R-0041']
          - id: 'E07'
            kind: 'check'
            applies_when: 'ESK is an SKESK'
            check: 'a passphrase is available (passphrase_supplied, or a cached passphrase) and the S2K Specifier is one the implementation supports; derive the S2K key from it as M14 steps U02 to U04 do, with the cipher key size of the SKESK.'
            on_failure: 'M11-T03'
            basis: stated
            source:
              - locator: '§5.3'
                quote: 'If the encryption container is preceded by one or more Symmetric Key Encrypted Session Key packets, each specifies a passphrase that may be used to decrypt the message.'
            constrained_by: ['rfc-9580#R-0182', 'rfc-9580#R-0304', 'rfc-9580#R-0019']
          - id: 'E08'
            kind: 'action'
            applies_when: 'ESK is a v4 SKESK'
            action: 'if no encrypted session key follows the S2K Specifier: session key := S2K key, cipher := the SKESK algorithm; else decrypt the field with the S2K key in CFB mode with an all-zero IV: first octet cipher, the rest the session key.'
            source:
              - locator: '§5.3.1'
                quote: 'If the encrypted session key is not present (which can be detected on the basis of packet length and S2K Specifier size), then the S2K algorithm applied to the passphrase produces the session key for decrypting the message, using the Symmetric Cipher Algorithm ID from the Symmetric Key Encrypted Session Key packet.'
              - locator: '§5.3.1'
                quote: 'If the encrypted session key is present, the result of applying the S2K algorithm to the passphrase is used to decrypt just that encrypted session key field, using CFB mode with an IV of all zeros.'
            basis: stated
            constrained_by: ['rfc-9580#R-0182']
            note: 'A v4 SKESK has no integrity check: a wrong passphrase yields a wrong key silently, which M12 discovers (by the optional quick check or at the MDC).'
          - id: 'E09'
            kind: 'check'
            applies_when: 'ESK is a v6 SKESK'
            check: 'KEK := HKDF-SHA256(IKM = S2K key, no salt, info = 0xC3 || 0x06 || cipher || AEAD); AEAD-decrypt the encrypted session key with KEK, the starting IV and additional data 0xC3 || 0x06 || cipher || AEAD; the tag verifies.'
            on_failure: 'M11-T03'
            source:
              - locator: '§5.3.2'
                quote: 'Then, the session key is encrypted using the resulting key, with the AEAD algorithm specified for the version 2 Symmetrically Encrypted and Integrity Protected Data packet.  Note that no chunks are used and that there is only one authentication tag.'
            basis: stated
            note: 'A wrong passphrase is detected here by the tag. Whether the v6 SKESK cipher must equal the v2 SEIPD cipher is not stated (OQ-28).'
          - id: 'E10'
            kind: 'check'
            applies_when: 'a session key and cipher were obtained'
            check: 'the cipher is not 0 and is implemented; for v1 SEIPD and SED it came from the ESK, for v2 SEIPD from the SEIPD header.'
            on_failure: 'M11-T03'
            source:
              - locator: '§12.2.1'
                quote: 'An implementation MUST NOT use algorithm 0 as the indicated symmetric cipher for an encrypted data packet (Sections 5.7 or 5.13); it can use a Literal Data packet (Section 5.9) to encode unencrypted literal data.'
            basis: stated
            constrained_by: ['rfc-9580#R-0377', 'rfc-9580#R-0230']
      - name: 'legacy-passphrase'
        meaning: 'SED with no ESK: the session key is the MD5 hash of a passphrase, cipher IDEA.'
        basis: stated
      - name: 'session-key'
        meaning: 'A session key and symmetric algorithm are available.'
        basis: stated
      - name: 'no-session-key'
        meaning: 'No ESK yielded a session key.'
        basis: inferred
        kind: 'error'
    transitions:
      - id: 'M11-T01'
        from: 'filtering'
        to: 'trying'
        trigger: 'completion'
        guard: 'at least one ESK remains.'
        basis: stated
        source:
          - locator: '§5.1'
            quote: 'The recipient of the message finds a session key that is encrypted to their public key, decrypts the session key, and then uses the session key to decrypt the message.'
        constrained_by: ['rfc-9580#R-0337', 'rfc-9580#R-0343']
      - id: 'M11-T02'
        from: 'filtering'
        to: 'legacy-passphrase'
        trigger: 'completion'
        guard: 'no ESK remains and payload is SED.'
        source:
          - locator: '§5.7'
            quote: 'If no packets of these types precede the encrypted data, the IDEA algorithm is used with the session key calculated as the MD5 hash of the passphrase, though this use is deprecated.'
        basis: stated
        constrained_by: ['rfc-9580#R-0019', 'rfc-9580#R-0290']
      - id: 'M11-T03'
        from: 'trying'
        to: 'trying'
        trigger: 'completion'
        guard: 'a step of this ESK failed and another ESK (or another candidate key for an anonymous PKESK) remains.'
        actions: ['record one undifferentiated failure; move to the next ESK']
        source:
          - locator: '§13.5'
            quote: 'To prevent the attack, in settings where the attacker does not have access to timing information concerning message decryption, the simplest solution is to report a single error code for all variants of PKESK processing errors as well as SEIPD integrity errors (this also includes session key parsing errors, such as on an invalid cipher algorithm for v3 PKESK, or a session key size mismatch for v6 PKESK).'
        basis: stated
        constrained_by: ['rfc-9580#R-0403']
        note: 'The order in which ESKs are tried is the implementation''s.'
      - id: 'M11-T04'
        from: 'trying'
        to: 'session-key'
        trigger: 'completion'
        guard: 'E01 to E10 that apply passed.'
        actions: ['hand (cipher, session key) to M12 (SEIPD v1, SED) or M13 (SEIPD v2)', 'if the cipher is not in the recipient''s preferences: warn the keyholder (and decrypt anyway)', 'if the cipher is IDEA, TripleDES or CAST5: warn that confidentiality is suspect', 'if the PKESK was decrypted with an RSA secret key of fewer than 3072 bits or with an Elgamal secret key: generate a deprecation warning that the key is too weak for modern use']
        source:
          - locator: '§12.2'
            quote: 'If an implementation can decrypt a message that a keyholder doesn''t have in their preferences, the implementation SHOULD decrypt the message anyway, but it MUST warn the keyholder.'
          - locator: '§9.3'
            quote: 'An Implementation that decrypts data using IDEA, TripleDES, or CAST5 SHOULD generate a deprecation warning about the symmetric algorithm, indicating that message confidentiality is suspect.'
        basis: stated
        constrained_by: ['rfc-9580#R-0376', 'rfc-9580#R-0290', 'rfc-9580#R-0291', 'rfc-9580#R-0387', 'rfc-9580#R-0392']
      - id: 'M11-T05'
        from: 'trying or filtering'
        to: 'no-session-key'
        trigger: 'completion'
        guard: 'no ESK remains to try (or none remained after filtering and payload is SEIPD).'
        actions: ['report one error for the message; raise unwrap_rejected']
        basis: inferred
        inferred_reason: 'Exhaustion of the ESKs; a SEIPD with no aligned ESK has no in-band session key (out-of-band session keys are not modelled).'
        constrained_by: ['rfc-9580#R-0403']
      - id: 'M11-T06'
        from: 'legacy-passphrase'
        to: 'session-key'
        trigger: 'passphrase_supplied'
        guard: 'the implementation consumes IDEA.'
        actions: ['session key := MD5(passphrase) as an IDEA key (Simple S2K semantics)']
        source:
          - locator: '§3.7.2.2'
            quote: 'IDEA MUST NOT be generated but MAY be consumed for backward compatibility.'
        basis: stated
        constrained_by: ['rfc-9580#R-0019', 'rfc-9580#R-0290', 'rfc-9580#R-0291']
    error_states: ['no-session-key']
    terminal_states: ['session-key', 'no-session-key']
    note: 'Producer-side rules that a recipient may meet and not reject on structure alone: a new PKCS#1 encoding per key (R-0037, R-0038), no Elgamal v6 PKESK (R-0039), no Elgamal encryption (R-0391), the ECDH KDF and KEK parameters for v6 keys (R-0358 to R-0362), ECDH padding for size obfuscation (R-0356, R-0357), the KEK being AES (R-0354).'
    constrained_by: ['rfc-9580#R-0037', 'rfc-9580#R-0038', 'rfc-9580#R-0039', 'rfc-9580#R-0391', 'rfc-9580#R-0354', 'rfc-9580#R-0356', 'rfc-9580#R-0357', 'rfc-9580#R-0358', 'rfc-9580#R-0359', 'rfc-9580#R-0360', 'rfc-9580#R-0361', 'rfc-9580#R-0362']

  # ======================================================================
  - id: 'M12'
    name: 'seipd-v1-decryption'
    locator: '§5.13.1, §5.7, §12.9, §13.4, §13.7'
    actor: 'recipient decrypting a v1 SEIPD packet (or a legacy SED packet) with a session key from M11'
    purpose: 'CFB-decrypt the payload, optionally run the quick check, verify the MDC (v1 SEIPD), and release plaintext to the child M02 only once integrity is confirmed; SED has no integrity protection and is rejected or released only with a warning.'
    initial: 'start'
    states:
      - name: 'start'
        meaning: 'Payload and session key in hand.'
        basis: inferred
      - name: 'sed-decision'
        meaning: 'The payload is a SED packet.'
        basis: stated
        source:
          - locator: '§5.7'
            quote: 'An implementation SHOULD reject such a packet and stop processing the message.  If an implementation chooses to process the packet anyway, it MUST return a clear warning that a non-integrity-protected packet has been processed.'
        constrained_by: ['rfc-9580#R-0207', 'rfc-9580#R-0208']
      - name: 'decrypting'
        meaning: 'CFB decryption with an all-zero IV; for SEIPD v1 the prefix (block size + 2 octets) is in the same CFB context; for SED the CFB state is resynchronised after the prefix.'
        basis: stated
      - name: 'mdc-check'
        meaning: 'All ciphertext decrypted; the last 22 plaintext octets are 0xD3 0x14 and a 20-octet SHA-1.'
        basis: stated
      - name: 'released'
        meaning: 'Integrity confirmed (SEIPD v1) and the plaintext (without prefix, 0xD3 0x14 and MDC) handed to the child M02 instance.'
        basis: stated
      - name: 'released-unprotected'
        meaning: 'SED plaintext released with a clear warning (historic data, user aware of the risk).'
        basis: stated
      - name: 'integrity-failure'
        meaning: 'The data is malleable or was modified: a clear error that the integrity of the message is suspect; nothing parsed or released.'
        basis: stated
        kind: 'error'
      - name: 'wrong-key'
        meaning: 'The quick check failed: the session key is wrong.'
        basis: stated
        kind: 'error'
    transitions:
      - id: 'M12-T01'
        from: 'start'
        to: 'decrypting'
        trigger: 'completion'
        guard: 'payload is SEIPD with version octet 1.'
        source:
          - locator: '§5.13.1'
            quote: 'The data is encrypted in CFB mode (see Section 12.9).  The IV is specified as all zeros.'
        basis: stated
        constrained_by: ['rfc-9580#R-0230', 'rfc-9580#R-0399']
      - id: 'M12-T02'
        from: 'start'
        to: 'sed-decision'
        trigger: 'completion'
        guard: 'payload is SED.'
        basis: stated
        source:
          - locator: '§13.7'
            quote: 'All Symmetrically Encrypted Data packets (Section 5.7).'
        constrained_by: ['rfc-9580#R-0336', 'rfc-9580#R-0410']
      - id: 'M12-T03'
        from: 'sed-decision'
        to: 'integrity-failure'
        trigger: 'completion'
        guard: 'the implementation does not process SED (the SHOULD), or the data is not known historic data, or the user is not aware of the risk.'
        actions: ['generate a clear error that the integrity of the message is suspect; halt']
        source:
          - locator: '§13.7'
            quote: 'When an OpenPGP implementation discovers that it is decrypting data that appears to be malleable, it MUST generate a clear error message that indicates the integrity of the message is suspect, it SHOULD NOT attempt to parse nor release decrypted data to the user, and it SHOULD halt with an error.'
        basis: stated
        constrained_by: ['rfc-9580#R-0207', 'rfc-9580#R-0405']
      - id: 'M12-T04'
        from: 'sed-decision'
        to: 'released-unprotected'
        trigger: 'completion'
        guard: 'the implementation chooses to process SED, the data is known historic archived legacy data, and the user is aware of the risks.'
        actions: ['CFB-decrypt (random prefix with all-zero IV; resynchronise; data)', 'generate a clear error message that the integrity of the message is suspect (SED is malleable, 13.7)', 'return a clear warning that a non-integrity-protected packet has been processed', 'hand the plaintext to the child M02']
        source:
          - locator: '§13.7'
            quote: 'An implementation that encounters malleable ciphertext MAY choose to release cleartext to the user if it is not encrypted using AEAD, it is known to be dealing with historic archived legacy data, and the user is aware of the risks.'
        basis: stated
        constrained_by: ['rfc-9580#R-0208', 'rfc-9580#R-0407', 'rfc-9580#R-0405']
        note: 'The SED quick check (octets block+1, block+2 equal block-1, block) may detect a wrong key; 13.4 applies.'
      - id: 'M12-T05'
        from: 'decrypting'
        to: 'wrong-key'
        trigger: 'completion'
        guard: 'the implementation uses the quick check, and plaintext octets bs+1, bs+2 differ from octets bs-1, bs (bs = cipher block size).'
        source:
          - locator: '§5.13.1'
            quote: 'The repetition of 16 bits in the random data prefixed to the message allows the receiver to immediately check whether the session key is incorrect.'
          - locator: '§13.4'
            quote: 'There is a danger when using the quick check if timing or error information about the check can be exposed to an attacker, particularly via an automated service that allows rapidly repeated queries.'
        basis: stated
        note: 'Disabling the quick check prevents the oracle attack (13.4); it is useful mainly for a wrong passphrase on a v4 SKESK; with a PKESK it is not useful. With M11 trying several ESKs, a wrong-key result can return to M11 for the next ESK (inferred).'
      - id: 'M12-T06'
        from: 'decrypting'
        to: 'mdc-check'
        trigger: 'end_of_stream'
        guard: 'the plaintext is at least bs + 2 + 22 octets.'
        actions: ['buffer the plaintext; do not parse or release it yet']
        source:
          - locator: '§13.7'
            quote: 'Parsing or releasing decrypted data before having confirmed its integrity can leak the decrypted data [EFAIL] [MRLG15].'
        basis: stated
        constrained_by: ['rfc-9580#R-0405']
      - id: 'M12-T07'
        from: 'decrypting'
        to: 'integrity-failure'
        trigger: 'end_of_stream'
        guard: 'the plaintext is shorter than bs + 2 + 22 octets.'
        basis: inferred
        inferred_reason: 'No room for the MDC: the MDC cannot validate.'
        constrained_by: ['rfc-9580#R-0231', 'rfc-9580#R-0405']
      - id: 'M12-T08'
        from: 'mdc-check'
        to: 'released'
        trigger: 'completion'
        guard: 'octets -22, -21 are 0xD3 0x14, and SHA-1(prefix || plaintext || 0xD3 0x14) equals the last 20 octets.'
        actions: ['hand the plaintext between the prefix and 0xD3 to the child M02 (goal OpenPGPMessage)']
        source:
          - locator: '§5.13.1'
            quote: 'During decryption, the plaintext data should be hashed with SHA-1, including the prefix data as well as the trailing constant octets 0xD3, 0x14, but excluding the last 20 octets containing the SHA-1 hash.'
        basis: stated
        constrained_by: ['rfc-9580#R-0332', 'rfc-9580#R-0300']
      - id: 'M12-T09'
        from: 'mdc-check'
        to: 'integrity-failure'
        trigger: 'completion'
        guard: 'the constant octets or the SHA-1 do not match.'
        actions: ['treat as a security problem; report the failure; generate a clear error that integrity is suspect; release nothing']
        source:
          - locator: '§5.13.1'
            quote: 'A mismatch of the hash indicates that the message has been modified and MUST be treated as a security problem. Any failure SHOULD be reported to the user.'
          - locator: '§13.7'
            quote: 'Any version 1 Symmetrically Encrypted and Integrity Protected Data packet (Section 5.13.1) where the internal Modification Detection Code does not validate.'
        basis: stated
        constrained_by: ['rfc-9580#R-0231', 'rfc-9580#R-0232', 'rfc-9580#R-0405', 'rfc-9580#R-0407']
        note: 'R-0407 permits release to an aware user of known historic data even here, since v1 SEIPD is not AEAD.'
    error_states: ['integrity-failure', 'wrong-key']
    terminal_states: ['released', 'released-unprotected', 'integrity-failure', 'wrong-key']
    note: 'The MDC was a separate packet (Type ID 19, now reserved) in older specifications; here it is inside the encrypted plaintext.'

  # ======================================================================
  - id: 'M13'
    name: 'seipd-v2-aead-decryption'
    locator: '§5.13.2, §5.13.3, §5.13.4, §5.13.5, §9.6, §13.7, §13.8'
    actor: 'recipient decrypting a v2 SEIPD packet with a session key from M11'
    purpose: 'Derive the message key and IV by HKDF, then decrypt and authenticate the chunks in order with nonce IV || chunk index, check the final tag over the total plaintext length, and handle tag failure (halt, release nothing) and truncation (error; already-authenticated chunks MAY have been released when streaming).'
    state_variables:
      - name: 'c'
        type: 'chunk size octet; chunk_size = 1 << (c + 6)'
        source:
          - locator: '§5.13.2'
            quote: 'An implementation MUST accept chunk size octets with values from 0 to 16.  An implementation MUST NOT create data with a chunk size octet value larger than 16 (4 MiB chunks).'
        constrained_by: ['rfc-9580#R-0234', 'rfc-9580#R-0235']
      - name: 'index'
        type: '64-bit chunk index; the first chunk is 0'
        initial: '0'
      - name: 'total'
        type: 'number of plaintext octets authenticated so far'
        initial: '0'
      - name: 'ad'
        type: 'additional data: 0xD2 || 0x02 || cipher || aead || c'
        source:
          - locator: '§5.13.2'
            quote: 'For example, the additional data of the first chunk using EAX and AES-128 with a chunk size of 2^22 octets consists of the octets 0xD2, 0x02, 0x07, 0x01, and 0x10.'
      - name: 'tag_len'
        type: '16 for EAX, OCB and GCM'
      - name: 'nonce_len'
        type: 'EAX 16, OCB 15, GCM 12'
      - name: 'released_any'
        type: 'boolean'
        initial: 'false'
    initial: 'header'
    states:
      - name: 'header'
        meaning: 'Version 2, cipher, AEAD algorithm, chunk size octet and 32-octet salt read.'
        basis: stated
      - name: 'keyed'
        meaning: 'Message key (M bits) and IV (N - 64 bits) derived; expecting chunks.'
        basis: stated
      - name: 'chunk-ok'
        meaning: 'The latest chunk authenticated.'
        basis: stated
      - name: 'final-check'
        meaning: 'The packet body has ended; the remaining octets are the last (possibly short) chunk with its tag, and the final tag.'
        basis: stated
      - name: 'released'
        meaning: 'Every chunk and the final tag verified; the plaintext (an Optionally Padded Message) is with the child M02.'
        basis: stated
      - name: 'tag-failure'
        meaning: 'A chunk tag or the final tag failed: no parse, no release, halt with an error.'
        basis: stated
        kind: 'error'
      - name: 'truncated'
        meaning: 'The final tag, and possibly chunks before it, are missing: a clear error as soon as detected.'
        basis: stated
        kind: 'error'
      - name: 'unsupported'
        meaning: 'Cipher or AEAD algorithm not implemented, or a chunk size the implementation does not accept.'
        basis: inferred
        kind: 'error'
    transitions:
      - id: 'M13-T01'
        from: 'header'
        to: 'keyed'
        trigger: 'completion'
        guard: 'cipher is implemented, is not 0, and its block size is 16 octets; aead is implemented (OCB is mandatory); c <= 16 or the implementation accepts larger.'
        actions: ['HKDF-SHA256(IKM = session key, salt = the 32-octet salt, info = ad) -> M + N - 64 bits', 'message_key := leftmost M bits; iv := remaining N - 64 bits']
        source:
          - locator: '§5.13.2'
            quote: 'The leftmost M bits are used as a symmetric algorithm key, and the remaining N - 64 bits are used as an IV.'
          - locator: '§5.13.2'
            quote: 'The session key is used as IKM and the salt as salt.'
        basis: stated
        constrained_by: ['rfc-9580#R-0234', 'rfc-9580#R-0307', 'rfc-9580#R-0308', 'rfc-9580#R-0377']
      - id: 'M13-T02'
        from: 'header'
        to: 'unsupported'
        trigger: 'completion'
        guard: 'cipher or AEAD algorithm not implemented, cipher block size is not 16, or c > 16 and not accepted.'
        source:
          - locator: '§5.13.4'
            quote: 'The OCB algorithm can only use block ciphers with 16-octet blocks.'
        basis: inferred
        inferred_reason: 'The source fixes what must be accepted; the outcome for the rest is ours (OQ-29 for c > 16).'
      - id: 'M13-T03'
        from: 'keyed or chunk-ok'
        to: 'chunk-ok'
        trigger: 'chunk_available'
        guard: 'AEAD-decrypt(message_key, nonce = iv || be64(index), ad, chunk_size ciphertext octets || tag) succeeds.'
        actions: ['total := total + chunk_size', 'index := index + 1', 'if streaming: the chunk plaintext MAY be passed on (released_any := true); else buffer it']
        source:
          - locator: '§5.13.2'
            quote: 'The nonce for AEAD mode consists of two parts.  Let N be the size of the nonce.  The leftmost N - 64 bits are the IV derived using HKDF. The rightmost 64 bits are the chunk index as a big-endian value.  The index of the first chunk is zero.'
          - locator: '§5.13.2'
            quote: 'For each chunk, the AEAD construction is given the Packet Type ID encoded in OpenPGP format (bits 7 and 6 are set, and bits 5-0 carry the Packet Type ID), version number, cipher algorithm ID, AEAD algorithm ID, and chunk size octet as additional data.'
        basis: stated
        constrained_by: ['rfc-9580#R-0408']
        note: 'Releasing an authenticated chunk before the final tag is the MAY of R-0408 for streaming implementations; a non-streaming implementation releases at M13-T06 only.'
      - id: 'M13-T04'
        from: 'keyed or chunk-ok'
        to: 'tag-failure'
        trigger: 'chunk_available'
        guard: 'the chunk tag fails to verify.'
        actions: ['do not parse or release this chunk', 'halt with an error (integrity suspect)']
        source:
          - locator: '§13.7'
            quote: 'In the case of AEAD encrypted data, if the authentication tag fails to verify, the implementation MUST NOT attempt to parse nor release decrypted data to the user, and it MUST halt with an error.'
        basis: stated
        constrained_by: ['rfc-9580#R-0406', 'rfc-9580#R-0405']
      - id: 'M13-T05'
        from: 'keyed or chunk-ok'
        to: 'final-check'
        trigger: 'end_of_stream'
        guard: 'the remaining octets r satisfy 2 * tag_len <= r <= chunk_size + 2 * tag_len.'
        actions: ['split: last chunk ciphertext = first r - 2*tag_len octets with the next tag; final tag = last tag_len octets']
        source:
          - locator: '§5.13.2'
            quote: 'If the last chunk of plaintext is smaller than the chunk size, the ciphertext for that data may be shorter; nevertheless, it is followed by a full authentication tag.'
        basis: stated
        note: 'When the plaintext length is a multiple of chunk_size the last full chunk arrives here rather than by chunk_available. Whether an empty plaintext has one empty chunk (r = 2 * tag_len) or none (r = tag_len) is not stated (OQ-30).'
      - id: 'M13-T06'
        from: 'final-check'
        to: 'released'
        trigger: 'completion'
        guard: 'the last chunk verifies (nonce index as T03) and the final tag verifies: AEAD over the empty string with nonce iv || be64(index after the last chunk) and additional data ad || be64(total).'
        actions: ['hand the remaining plaintext (all of it, if not streaming) to the child M02 with goal OptionallyPaddedMessage']
        source:
          - locator: '§5.13.2'
            quote: 'After the final chunk, the AEAD algorithm is used to produce a final authentication tag encrypting the empty string.  This AEAD instance is given the additional data specified above, plus an 8-octet, big-endian value specifying the total number of plaintext octets encrypted.  This allows detection of a truncated ciphertext.'
        basis: stated
        constrained_by: ['rfc-9580#R-0331']
        note: 'The nonce index of the final tag is not stated in the prose (OQ-31); the value here is the reading the Appendix A test vectors are expected to confirm.'
      - id: 'M13-T07'
        from: 'final-check'
        to: 'tag-failure'
        trigger: 'completion'
        guard: 'the last chunk tag fails.'
        actions: ['halt with an error; release nothing more']
        source:
          - locator: '§13.7'
            quote: 'Any version 2 Symmetrically Encrypted and Integrity Protected Data packet (Section 5.13.2) where the authentication tag of any chunk fails or where there is no final zero-octet chunk.'
        basis: stated
        constrained_by: ['rfc-9580#R-0406']
      - id: 'M13-T08'
        from: 'final-check'
        to: 'truncated'
        trigger: 'completion'
        guard: 'the last chunk verifies but the final tag does not verify against the total length (chunks or the final tag were removed).'
        actions: ['indicate a clear error at once', 'chunks already released (released_any) stay released; release nothing further']
        source:
          - locator: '§13.7'
            quote: 'In the case of AEAD encrypted messages, if the message is truncated, i.e., the final zero-octet chunk and possibly (part of) some chunks before it are missing, the implementation MAY choose to release cleartext from the fully authenticated chunks before it to the user if it is operating in a streaming fashion, but it MUST indicate a clear error message as soon as the truncation is detected.'
        basis: stated
        constrained_by: ['rfc-9580#R-0408', 'rfc-9580#R-0405', 'rfc-9580#R-0406']
        note: 'With chunk boundaries removed the split in T05 misaligns and a chunk tag fails first (T07); either path is a failure. Distinguishing truncation from tampering is not required by the source. A final tag that fails is both an authentication tag failure (R-0406: release nothing, halt) and the sign of a missing final zero-octet chunk (R-0408: chunks released while streaming may stand); the source does not reconcile the two (OQ-40). Either way nothing further is released.'
        unspecified:
          - 'Whether a failing final tag is a tag failure (R-0406) or a truncation (R-0408) (OQ-40).'
      - id: 'M13-T09'
        from: 'keyed or chunk-ok'
        to: 'truncated'
        trigger: 'end_of_stream'
        guard: 'r < 2 * tag_len (no room for a chunk tag and the final tag).'
        actions: ['indicate a clear error at once']
        source:
          - locator: '§13.7'
            quote: 'Any version 2 Symmetrically Encrypted and Integrity Protected Data packet (Section 5.13.2) where the authentication tag of any chunk fails or where there is no final zero-octet chunk.'
        basis: stated
        constrained_by: ['rfc-9580#R-0408']
    error_states: ['tag-failure', 'truncated', 'unsupported']
    terminal_states: ['released', 'tag-failure', 'truncated', 'unsupported']
    note: 'Session-key reuse for replies (13.8) only changes the salt, so it yields a new message key with the same machine. Unlike v1 SEIPD and SED, no release path exists after a tag failure: R-0407 excludes AEAD.'

  # ======================================================================
  - id: 'M14'
    name: 'secret-key-unlock'
    locator: '§3.7, §3.7.1, §3.7.1.1 to §3.7.1.4, §3.7.2, §3.7.2.1, §5.5.3, §9.5, §13.4, §13.7'
    actor: 'keyholder''s implementation unlocking the secret material of a SECKEY or SECSUBKEY packet'
    purpose: 'Read the S2K usage octet and the conditional parameter fields, reject forms that the key version forbids, derive the key from the passphrase with the S2K Specifier, decrypt (AEAD with HKDF key separation, or CFB), and check integrity (AEAD tag, SHA-1, or the deprecated 2-octet checksum) and structure before the secret MPIs are used.'
    initial: 'read-usage'
    states:
      - name: 'read-usage'
        meaning: 'Public fields parsed; the S2K usage octet is next.'
        basis: stated
      - name: 'unprotected'
        meaning: 'Usage 0: the secret material is in the clear (v3/v4 followed by a 2-octet checksum).'
        basis: stated
      - name: 'protected'
        meaning: 'Usage 253, 254, 255 or a cipher ID: parameters parsed, passphrase needed.'
        basis: stated
      - name: 'deriving'
        meaning: 'Passphrase in hand; S2K running.'
        basis: stated
        steps:
          - id: 'U01'
            kind: 'action'
            applies_when: 'usage is a cipher ID (LegacyCFB, v3/v4 only)'
            action: 'key := MD5(passphrase), sized for the cipher (Simple S2K semantics).'
            source:
              - locator: '§3.7.2.1'
                quote: 'In this case, the MD5 hash function was always used to convert the passphrase to a key for the specified cipher algorithm.'
            basis: stated
          - id: 'U02'
            kind: 'action'
            applies_when: 'S2K type 0 (Simple) or 1 (Salted)'
            action: 'hash (salt ||) passphrase; if the key is longer than the digest, run k contexts preloaded with 0, 1, 2, ... zero octets and concatenate; take the leftmost key-size octets.'
            source:
              - locator: '§3.7.1.2'
                quote: 'Salted S2K is exactly like Simple S2K, except that the input to the hash function(s) consists of the 8 octets of salt from the S2K Specifier, followed by the passphrase.'
            basis: stated
          - id: 'U03'
            kind: 'action'
            applies_when: 'S2K type 3 (Iterated and Salted)'
            action: 'count := (16 + (c & 15)) << ((c >> 4) + 6); hash salt || passphrase repeated until count octets (at least one full copy), per context as U02.'
            source:
              - locator: '§3.7.1.3'
                quote: 'Note that the resulting count value is an octet count of how many octets will be hashed, not an iteration count.'
              - locator: '§3.7.1.3'
                quote: 'That is, at least one copy of the full salt plus passphrase will be provided as input to each hash context regardless of the octet count.'
            basis: stated
          - id: 'U04'
            kind: 'check'
            applies_when: 'S2K type 4 (Argon2)'
            check: 't != 0, p != 0, 3 + ceil(log2(p)) <= encoded_m <= 31; then key := Argon2id(P = passphrase, S = 16-octet salt, t, p, m = 2^encoded_m KiB, T = key size, v = 0x13).'
            on_failure: 'M14-T09'
            source:
              - locator: '§3.7.1.4'
                quote: 'The encoded memory size MUST be a value from 3+ceil(log_2(p)) to 31, such that the decoded memory size m is a value from 8*p to 2^31.'
              - locator: '§3.7.1.4'
                quote: 'Argon2 is invoked with the passphrase as P, the salt as S, the values of t, p, and m as described above, the required key size as the tag length T, 0x13 as the version v, and Argon2id as the type.'
            basis: inferred
            inferred_reason: 'R-0008 and R-0009 state the valid ranges; rejecting out-of-range parameters (rather than running Argon2 with them) is ours (OQ-32).'
            constrained_by: ['rfc-9580#R-0008', 'rfc-9580#R-0009']
      - name: 'decrypting'
        meaning: 'Key derived; decrypting the secret material.'
        basis: stated
      - name: 'unlocked'
        meaning: 'The secret MPIs are available and well formed.'
        basis: stated
      - name: 'malformed'
        meaning: 'The packet uses a form the source forbids for its version or combination: rejected.'
        basis: stated
        kind: 'error'
      - name: 'wrong-passphrase-or-corrupt'
        meaning: 'Integrity check failed: wrong passphrase, or the key was modified (malleable for 254, 255 and cipher IDs).'
        basis: stated
        kind: 'error'
      - name: 'unusable'
        meaning: 'The cleartext does not align with the MPI lengths.'
        basis: stated
        kind: 'error'
    transitions:
      - id: 'M14-T01'
        from: 'read-usage'
        to: 'unprotected'
        trigger: 'completion'
        guard: 'usage = 0.'
        source:
          - locator: '§3.7.2.1'
            quote: 'If the S2K usage octet is zero, the secret key data is unprotected.'
        basis: stated
      - id: 'M14-T02'
        from: 'read-usage'
        to: 'malformed'
        trigger: 'completion'
        guard: 'key version 6 and (usage = 255, or usage is a cipher ID, that is any value other than 0, 253, 254); or the S2K Specifier type is Argon2 and usage != 253.'
        source:
          - locator: '§5.5.3'
            quote: 'A version 6 packet MUST NOT use the value 255 (MalleableCFB).'
          - locator: '§3.7.2.1'
            quote: 'Version 6 secret keys using these formats MUST be rejected.'
          - locator: '§3.7.2.1'
            quote: 'An implementation MUST NOT create and MUST reject as malformed any Secret Key packet where the S2K usage octet is not AEAD (253) and the S2K Specifier Type is Argon2.'
        basis: stated
        constrained_by: ['rfc-9580#R-0015', 'rfc-9580#R-0016', 'rfc-9580#R-0017', 'rfc-9580#R-0018', 'rfc-9580#R-0191']
        note: '"These formats" are the Table 2 rows marked Generate? No: a known cipher ID (LegacyCFB) and 255 (MalleableCFB). Simple and Salted S2K in a v6 key are discouraged for generation (R-0006, R-0011, R-0012) but no consumer rule rejects them, except through R-0304 for a weak hash.'
      - id: 'M14-T03'
        from: 'read-usage'
        to: 'protected'
        trigger: 'completion'
        guard: 'usage in {253, 254} (any version), or usage in {255, cipher ID} with key version <= 4.'
        actions:
          - 'v6: read the 1-octet parameter count'
          - '253, 254, 255: read cipher; 253: read AEAD algorithm; v6 with 253 or 254: read the S2K Specifier length octet; read the S2K Specifier'
          - '253: read the AEAD nonce (size per AEAD algorithm); 254, 255, cipher ID: read an IV of the cipher block size'
        source:
          - locator: '§5.5.3'
            quote: 'Only for a version 6 packet where the secret key material is encrypted (that is, where the previous octet is not zero), a 1-octet scalar octet count of the cumulative length of all the following conditionally included S2K parameter fields.'
          - locator: '§3.7.2.1'
            quote: 'Later implementations indicate a protected secret key by storing one of the special values 253 (AEAD), 254 (CFB), or 255 (MalleableCFB) in the S2K usage octet.'
        basis: stated
        constrained_by: ['rfc-9580#R-0193', 'rfc-9580#R-0194']
        note: 'The v6 counts let a parser skip unknown S2K types or algorithms; for v4 an unknown S2K type makes the rest of the packet unparseable.'
      - id: 'M14-T04'
        from: 'unprotected'
        to: 'unlocked'
        trigger: 'completion'
        guard: 'v3/v4: the 2-octet checksum equals the sum of the secret octets mod 65536 (v6 has no checksum); the cleartext aligns with the MPI lengths.'
        source:
          - locator: '§5.5.3'
            quote: 'Only for a version 3 or 4 packet where the S2K usage octet is zero, a 2-octet checksum of the algorithm-specific portion (sum of all octets, mod 65536).'
        basis: stated
        constrained_by: ['rfc-9580#R-0196', 'rfc-9580#R-0197']
      - id: 'M14-T05'
        from: 'protected'
        to: 'deriving'
        trigger: 'passphrase_supplied'
        guard: 'the S2K Specifier type and its hash (or Argon2) are implemented; for a v6 packet the S2K hash is not MD5, SHA-1 or RIPEMD-160.'
        source:
          - locator: '§9.5'
            quote: 'Implementations MUST NOT decrypt a secret using MD5, SHA-1, or RIPEMD-160 as a hash function in an S2K KDF in a version 6 (or later) packet.'
        basis: stated
        constrained_by: ['rfc-9580#R-0304']
      - id: 'M14-T06'
        from: 'deriving'
        to: 'decrypting'
        trigger: 'completion'
        guard: 'a key was derived.'
        actions:
          - '253: KEK := HKDF-SHA256(IKM = S2K key, no salt, info = (0xC0 | tag) || version || cipher || AEAD); AEAD-decrypt the secret octets || tag with the nonce, additional data (0xC0 | tag) || the public key packet fields from the version octet (v6: including the 4-octet key material count)'
          - '254, 255, cipher ID: CFB-decrypt with the IV; v4/v6 all MPI octets including length prefixes are encrypted; v3 only the MPI data, resynchronising CFB at each MPI'
        source:
          - locator: '§5.5.3'
            quote: 'If the S2K usage octet is 253, the KEK is derived using HKDF [RFC5869] to provide key separation.'
          - locator: '§5.5.3'
            quote: 'With version 4 and version 6 keys, a simpler method is used.  All secret MPI values are encrypted, including the MPI bit count prefix.'
        basis: stated
      - id: 'M14-T07'
        from: 'decrypting'
        to: 'unlocked'
        trigger: 'completion'
        guard: '253: the AEAD tag verifies. 254: the last 20 octets equal SHA-1 of the preceding plaintext. 255 or cipher ID: the last 2 octets equal the sum of the plaintext octets mod 65536 (v3: checksum stored in clear). And the cleartext length aligns exactly with the unwrapped MPIs.'
        source:
          - locator: '§5.5.3'
            quote: 'When decrypting the secret key material using any of these schemes (that is, where the usage octet is non-zero), the resulting cleartext octet stream must be well formed.  In particular, an implementation MUST NOT interpret octets beyond the unwrapped cleartext octet stream as part of any of the unwrapped MPI objects.'
        basis: stated
        constrained_by: ['rfc-9580#R-0196', 'rfc-9580#R-0197', 'rfc-9580#R-0192', 'rfc-9580#R-0195']
        note: 'The 2-octet checksum is deprecated and SHOULD NOT be used (R-0195): it detects a wrong passphrase but not tampering. Curve25519Legacy secret scalars must be divisible by 8, >= 2^254 and < 2^255 (R-0199 to R-0202).'
      - id: 'M14-T08'
        from: 'decrypting'
        to: 'wrong-passphrase-or-corrupt'
        trigger: 'completion'
        guard: 'the integrity check of T07 fails.'
        actions: ['for 253 (AEAD tag), 254 (SHA-1) or 255/cipher (checksum): integrity of the secret key material is suspect; do not use the material']
        source:
          - locator: '§13.7'
            quote: 'Any Secret-Key packet with encrypted secret key material (Section 3.7.2.1) where there is an integrity failure, based on the value of the secret key protection octet:'
        basis: stated
        constrained_by: ['rfc-9580#R-0405']
        note: 'A wrong passphrase and a tampered key are indistinguishable here. CFB-encrypted keys (254, 255) are open to corruption attacks by anyone with write access (13.7), which is why v6 keys SHOULD use 253 (R-0413).'
      - id: 'M14-T09'
        from: 'deriving or decrypting'
        to: 'unusable'
        trigger: 'completion'
        guard: 'the cleartext length does not align with the MPI lengths, or Argon2 parameters are out of range (U04).'
        source:
          - locator: '§5.5.3'
            quote: 'Furthermore, an implementation MUST reject any secret key material whose cleartext length does not align with the lengths of the unwrapped MPI objects as unusable.'
        basis: stated
        constrained_by: ['rfc-9580#R-0197', 'rfc-9580#R-0008', 'rfc-9580#R-0009']
        note: 'Only the cleartext-length clause is stated (R-0197). The Argon2 clause comes from the inferred step U04: R-0008 and R-0009 constrain the parameter values, and the consumer action for out-of-range values is open (OQ-32).'
      - id: 'M14-T10'
        from: 'protected'
        to: 'malformed'
        trigger: 'completion'
        guard: 'usage 253 with an AEAD algorithm or cipher the implementation does not implement, or an unknown S2K Specifier type (v4: the rest of the packet cannot be parsed), or an S2K hash the implementation does not implement, or a version 6 packet whose S2K hash is MD5, SHA-1 or RIPEMD-160.'
        source:
          - locator: '§9.5'
            quote: 'Implementations MUST NOT decrypt a secret using MD5, SHA-1, or RIPEMD-160 as a hash function in an S2K KDF in a version 6 (or later) packet.'
        basis: inferred
        inferred_reason: 'No consumer rule is stated for unknown algorithms here; the v6 counts allow the public part to be used even so (5.5.3 note). The weak-hash clause (R-0304) and the unimplemented-hash clause were added in pass 3: M14-T05 excludes them, and protected had no transition for them.'
        constrained_by: ['rfc-9580#R-0304']
    error_states: ['malformed', 'wrong-passphrase-or-corrupt', 'unusable']
    terminal_states: ['unlocked', 'malformed', 'wrong-passphrase-or-corrupt', 'unusable']
    note: 'Generation-side rules: emit only Generate? Yes rows (R-0015, R-0016), never Simple S2K (R-0011), Salted only for high-entropy strings (R-0012), Argon2 RECOMMENDED (R-0013), no MD5/SHA-1/RIPEMD-160 in an S2K KDF (R-0303), a unique salt per passphrase and m rounded to a power of 2 for Argon2 (R-0007, R-0010), Iterated and Salted only when Argon2 is not available (R-0014), v6 passphrase-protected keys SHOULD use AEAD (R-0413), users RECOMMENDED to migrate (R-0414).'
    constrained_by: ['rfc-9580#R-0006', 'rfc-9580#R-0011', 'rfc-9580#R-0012', 'rfc-9580#R-0013', 'rfc-9580#R-0014', 'rfc-9580#R-0007', 'rfc-9580#R-0010', 'rfc-9580#R-0303', 'rfc-9580#R-0413', 'rfc-9580#R-0414', 'rfc-9580#R-0199', 'rfc-9580#R-0200', 'rfc-9580#R-0201', 'rfc-9580#R-0202']

  # ======================================================================
  - id: 'M15'
    name: 'ascii-armor-decode'
    locator: '§6, §6.1, §6.2, §6.2.1, §6.2.2, §6.2.2.1 to §6.2.2.4, §6.2.3, §10.2'
    actor: 'consumer of an ASCII-armored OpenPGP object'
    purpose: 'Find the Armor Header Line, read the Armor Headers up to the blank line, base64-decode the body ignoring whitespace, accept and never reject on the optional CRC24 line, match the Armor Tail Line, and hand the octets to the sequence machine the header names.'
    state_variables:
      - name: 'kind'
        type: 'MESSAGE | PUBLIC KEY BLOCK | PRIVATE KEY BLOCK | SIGNATURE'
        source:
          - locator: '§6.2.1'
            quote: 'The header line text is chosen based on the type of data being encoded in Armor and how it is being encoded.'
      - name: 'headers'
        type: 'list of (key, value); keys may repeat'
      - name: 'data'
        type: 'decoded octets'
      - name: 'crc'
        type: 'the 24-bit value from the checksum line, or none'
    initial: 'seek-header'
    states:
      - name: 'seek-header'
        meaning: 'Looking for an Armor Header Line.'
        basis: inferred
      - name: 'armor-headers'
        meaning: 'Reading Key: value lines.'
        basis: stated
      - name: 'body'
        meaning: 'Reading base64 lines.'
        basis: stated
      - name: 'after-checksum'
        meaning: 'The checksum line was read; the tail line is next.'
        basis: stated
      - name: 'decoded'
        meaning: 'Tail line matched; data handed to M02 (MESSAGE), M04 (PUBLIC or PRIVATE KEY BLOCK, the latter as a Transferable Secret Key) or M03 (SIGNATURE).'
        basis: stated
      - name: 'not-armor'
        meaning: 'No armor found, or the armor cannot be recovered.'
        basis: inferred
        kind: 'error'
    transitions:
      - id: 'M15-T01'
        from: 'seek-header'
        to: 'armor-headers'
        trigger: 'text_line'
        guard: 'the line starts with "-----BEGIN PGP MESSAGE-----", "-----BEGIN PGP PUBLIC KEY BLOCK-----", "-----BEGIN PGP PRIVATE KEY BLOCK-----" or "-----BEGIN PGP SIGNATURE-----" at its first character, followed only by whitespace.'
        actions: ['kind := the header line text after BEGIN PGP']
        source:
          - locator: '§6.2.1'
            quote: 'An Armor Header Line consists of the appropriate header line text surrounded by five (5) dashes (-, 0x2D) on either side of the header line text.'
          - locator: '§6.2.1'
            quote: 'Therefore, the header lines MUST start at the beginning of a line and MUST NOT have text other than whitespace following them on the same line.'
        basis: stated
        constrained_by: ['rfc-9580#R-0252', 'rfc-9580#R-0253', 'rfc-9580#R-0002', 'rfc-9580#R-0251']
        note: '-----BEGIN PGP SIGNED MESSAGE----- starts M16 instead.'
      - id: 'M15-T02'
        from: 'seek-header'
        to: 'seek-header'
        trigger: 'text_line'
        guard: 'not a header line.'
        basis: inferred
        inferred_reason: 'Text around the armor is not part of it.'
      - id: 'M15-T03'
        from: 'armor-headers'
        to: 'armor-headers'
        trigger: 'text_line'
        guard: 'the line is non-blank.'
        actions: ['split at the first colon followed by a single space into key and value', 'Version, Comment, Charset: record (Charset MAY override UTF-8); Hash: record for M16 only; unknown key: ignore silently', 'a line that does not parse: treat as a corruption but try to recover (for example skip it)']
        source:
          - locator: '§6.2.2'
            quote: 'The format of an Armor Header is that of a key-value pair.  A colon (: 0x3A) and a single space (0x20) separate the key and value.'
          - locator: '§6.2.2'
            quote: 'An OpenPGP implementation may consider improperly formatted Armor Headers to be a corruption of the ASCII Armor, but it SHOULD make an effort to recover.  Unknown keys should be silently ignored, and an OpenPGP implementation SHOULD continue to process the message.'
        basis: stated
        constrained_by: ['rfc-9580#R-0254', 'rfc-9580#R-0255', 'rfc-9580#R-0256', 'rfc-9580#R-0257', 'rfc-9580#R-0261', 'rfc-9580#R-0262', 'rfc-9580#R-0263']
        note: 'Armor Headers are not covered by any signature (6.2.2).'
      - id: 'M15-T04'
        from: 'armor-headers'
        to: 'body'
        trigger: 'text_line'
        guard: 'the line is blank (zero length or only whitespace).'
        source:
          - locator: '§6.2'
            quote: 'A blank (zero length or containing only whitespace) line'
        basis: stated
      - id: 'M15-T05'
        from: 'body'
        to: 'body'
        trigger: 'text_line'
        guard: 'the line is not a checksum line and not a tail line.'
        actions: ['base64-decode (RFC 4648 section 4), ignoring all whitespace; append to data']
        source:
          - locator: '§6'
            quote: 'When decoding base64, an OpenPGP implementation MUST ignore all whitespace.'
        basis: stated
        constrained_by: ['rfc-9580#R-0240', 'rfc-9580#R-0241']
        note: 'Lines are at most 76 characters when produced; nothing says a consumer rejects longer ones.'
      - id: 'M15-T06'
        from: 'body'
        to: 'after-checksum'
        trigger: 'text_line'
        guard: 'the line is "=" followed by four base64 characters (and optional whitespace), directly after the base64 data.'
        actions: ['crc := decoded 24 bits', 'optionally compare with CRC24(data) (init 0xB704CE, generator 0x864CFB, over the decoded octets); the result never causes rejection']
        source:
          - locator: '§6.1'
            quote: 'If present, the checksum with its leading equal sign MUST appear on the next line after the base64-encoded data.'
          - locator: '§6.1'
            quote: 'An implementation MUST NOT reject an OpenPGP object when the CRC24 footer is present, missing, malformed, or disagrees with the computed CRC24 sum.'
        basis: stated
        constrained_by: ['rfc-9580#R-0242', 'rfc-9580#R-0243', 'rfc-9580#R-0244']
        note: 'A checksum on a v6 or v2-SEIPD object violates R-0247 to R-0250 but still does not cause rejection (R-0244). Telling a checksum line from a final base64 line ending in = padding is OQ-34.'
      - id: 'M15-T07'
        from: 'body or after-checksum'
        to: 'decoded'
        trigger: 'text_line'
        guard: 'the line is the Armor Tail Line: the header line with BEGIN replaced by END.'
        actions: ['hand data to M02, M04 or M03 by kind; for PRIVATE KEY BLOCK expect a Transferable Secret Key']
        source:
          - locator: '§6.2.3'
            quote: 'The Armor Tail Line is composed in the same manner as the Armor Header Line, except the string "BEGIN" is replaced by the string "END".'
          - locator: '§10.2'
            quote: 'If a single Secret Key or Secret Subkey packet is included in a packet sequence, it is a Transferable Secret Key and should be handled and marked as such (see Section 6.2.1).'
        basis: stated
        constrained_by: ['rfc-9580#R-0252', 'rfc-9580#R-0253']
      - id: 'M15-T08'
        from: 'armor-headers or body or after-checksum'
        to: 'not-armor'
        trigger: 'end_of_stream'
        guard: 'no tail line seen.'
        basis: inferred
        inferred_reason: 'An armor without its tail is incomplete; recovery (6.2.2) concerns headers only.'
      - id: 'M15-T09'
        from: 'after-checksum'
        to: 'not-armor'
        trigger: 'text_line'
        guard: 'a non-blank line other than the tail line.'
        basis: inferred
        inferred_reason: 'The checksum must be the last line before the tail (OQ-34).'
      - id: 'M15-T10'
        from: 'seek-header'
        to: 'not-armor'
        trigger: 'end_of_stream'
        guard: 'always'
        basis: inferred
        inferred_reason: 'No header line in the input.'
    error_states: ['not-armor']
    terminal_states: ['decoded', 'not-armor']
    note: 'Producer rules: CRC24 SHOULD NOT be generated (R-0245) and MUST NOT be for v2 SEIPD messages, v6-only signatures, v6 TPKs and v6-only keyrings (R-0246 to R-0250); Version header SHOULD NOT be emitted (R-0257).'
    constrained_by: ['rfc-9580#R-0245', 'rfc-9580#R-0246', 'rfc-9580#R-0247', 'rfc-9580#R-0248', 'rfc-9580#R-0249', 'rfc-9580#R-0250']

  # ======================================================================
  - id: 'M16'
    name: 'cleartext-signed-message'
    locator: '§7, §7.1, §7.2, §7.3, §6.2.2.3, §5.2.1.2, §5.2.4'
    actor: 'verifier of a cleartext signed message'
    purpose: 'Parse the cleartext header, admit only well-formed Hash Armor Headers, dash-unescape the cleartext, canonicalise it (trailing whitespace stripped, CR LF line endings, final line ending excluded), parse the armored signature(s) with M15, and verify each with M05 as a text signature.'
    state_variables:
      - name: 'decline'
        type: 'boolean: some signature must not be validated because of the headers'
        initial: 'false'
      - name: 'text'
        type: 'list of unescaped lines'
    initial: 'seek-header'
    states:
      - name: 'seek-header'
        meaning: 'Looking for the cleartext header line.'
        basis: inferred
      - name: 'hash-headers'
        meaning: 'Between the cleartext header and the first empty line.'
        basis: stated
      - name: 'cleartext'
        meaning: 'Reading dash-escaped cleartext lines.'
        basis: stated
      - name: 'signature-armor'
        meaning: 'The BEGIN PGP SIGNATURE line was found; M15 decodes the signature block from its header lines on.'
        basis: stated
      - name: 'verified'
        meaning: 'Every signature has an M05 result (each forced to not valid if decline).'
        basis: inferred
      - name: 'failed'
        meaning: 'No signature block, or the signature armor did not decode.'
        basis: inferred
        kind: 'error'
    transitions:
      - id: 'M16-T01'
        from: 'seek-header'
        to: 'hash-headers'
        trigger: 'text_line'
        guard: 'the line is -----BEGIN PGP SIGNED MESSAGE----- (at line start, only whitespace after).'
        source:
          - locator: '§7.1'
            quote: 'The cleartext header -----BEGIN PGP SIGNED MESSAGE----- on a single line.'
        basis: stated
      - id: 'M16-T02'
        from: 'hash-headers'
        to: 'hash-headers'
        trigger: 'text_line'
        guard: 'the line is non-empty.'
        actions: ['if it is "Hash: " followed by a comma-separated list of hash algorithm names (Table 23 Text Name): ignore its contents', 'else (a Hash header with anything else, or any other header key): decline := true']
        source:
          - locator: '§7.1'
            quote: 'To reduce the risk of confusion about what has been signed, a verifying implementation MUST decline to validate any signature in a cleartext message if that message has any other Armor Header present in this location.'
          - locator: '§6.2.2.3'
            quote: 'When a conformant Hash header is present, a verifying application MUST ignore its contents, deferring to the hash algorithm indicated in the Embedded Signature.'
        basis: stated
        constrained_by: ['rfc-9580#R-0259', 'rfc-9580#R-0260', 'rfc-9580#R-0264', 'rfc-9580#R-0267', 'rfc-9580#R-0258']
        note: '"the Embedded Signature" appears to mean the signature packet(s) in the armored block, not the Embedded Signature subpacket (OQ-35). Hash headers are optional despite "One or more" in 7.1 (OQ-36).'
      - id: 'M16-T03'
        from: 'hash-headers'
        to: 'cleartext'
        trigger: 'text_line'
        guard: 'the line is empty.'
        source:
          - locator: '§7.1'
            quote: 'An empty line (not included in the message digest).'
        basis: stated
        note: 'Whether a line of only whitespace ends the headers here, as in 6.2, is not stated for 7.1.'
      - id: 'M16-T04'
        from: 'cleartext'
        to: 'cleartext'
        trigger: 'text_line'
        guard: 'the line does not start with "-".'
        actions: ['append the line']
        source:
          - locator: '§7.2'
            quote: 'Dash-escaped cleartext is the ordinary cleartext where every line starting with a "-" (HYPHEN-MINUS, U+002D) is prefixed by the sequence "-" (HYPHEN-MINUS, U+002D) and " " (SPACE, U+0020).'
        basis: stated
      - id: 'M16-T05'
        from: 'cleartext'
        to: 'cleartext'
        trigger: 'text_line'
        guard: 'the line starts with "- " (dash, space).'
        actions: ['strip the leading "- " and append the rest']
        source:
          - locator: '§7.2'
            quote: 'When reversing dash-escaping, an implementation MUST strip the string - if it occurs at the beginning of a line, and it SHOULD provide a warning for - and any character other than a space at the beginning of a line.'
        basis: stated
        constrained_by: ['rfc-9580#R-0273', 'rfc-9580#R-0268', 'rfc-9580#R-0271']
        note: 'The source text reads "strip the string -"; the string is "- " (dash, space) by the escaping rule of the preceding paragraph (OQ-33, a source defect).'
      - id: 'M16-T06'
        from: 'cleartext'
        to: 'signature-armor'
        trigger: 'text_line'
        guard: 'the line is -----BEGIN PGP SIGNATURE----- (at line start, only whitespace after).'
        actions: ['start M15 at armor-headers with kind SIGNATURE']
        source:
          - locator: '§7.1'
            quote: 'The ASCII-armored signature(s), including the -----BEGIN PGP SIGNATURE----- Armor Header and Armor Tail Lines.'
          - locator: '§7.2'
            quote: 'This prevents the parser from recognizing Armor Headers of the cleartext itself.'
        basis: stated
      - id: 'M16-T07'
        from: 'cleartext'
        to: 'cleartext'
        trigger: 'text_line'
        guard: 'the line starts with "-" followed by a character other than a space, and is not the BEGIN PGP SIGNATURE line.'
        actions: ['warn', 'append the line unchanged']
        source:
          - locator: '§7.2'
            quote: 'When reversing dash-escaping, an implementation MUST strip the string - if it occurs at the beginning of a line, and it SHOULD provide a warning for - and any character other than a space at the beginning of a line.'
        basis: stated
        constrained_by: ['rfc-9580#R-0274']
        note: 'Keeping such a line unchanged (rather than dropping it or failing) is ours.'
      - id: 'M16-T08'
        from: 'signature-armor'
        to: 'verified'
        trigger: 'completion'
        guard: 'M15 reached decoded and M03 accepted the signature packets.'
        actions:
          - 'canonical text := the appended lines, each with trailing spaces (0x20) and tabs (0x09) removed, joined with CR LF, without the line ending that precedes the BEGIN PGP SIGNATURE line'
          - 'for each SIG: if decline, report not validated; else run M05 with signed_data = canonical text (text signature, 0x01)'
        source:
          - locator: '§7.1'
            quote: 'As with any other Text signature (Section 5.2.1.2), a cleartext signature is calculated on the text using canonical <CR><LF> line endings.  As described above, the line ending before the -----BEGIN PGP SIGNATURE----- Armor Header Line of the armored signature is not considered part of the signed text.'
          - locator: '§7.1'
            quote: 'Also, any trailing whitespace -- spaces (0x20) and tabs (0x09) -- at the end of any line is removed before signing or verifying a cleartext signed message.'
          - locator: '§7.2'
            quote: 'The message digest is computed using the cleartext itself, not the dash-escaped form.'
        basis: stated
        constrained_by: ['rfc-9580#R-0265', 'rfc-9580#R-0266', 'rfc-9580#R-0272', 'rfc-9580#R-0047', 'rfc-9580#R-0166', 'rfc-9580#R-0259', 'rfc-9580#R-0267']
      - id: 'M16-T09'
        from: 'hash-headers or cleartext or signature-armor'
        to: 'failed'
        trigger: 'end_of_stream'
        guard: 'no complete signature block.'
        basis: inferred
        inferred_reason: 'A cleartext signed message without its armored signature cannot be verified.'
      - id: 'M16-T10'
        from: 'signature-armor'
        to: 'failed'
        trigger: 'completion'
        guard: 'M15 ended in not-armor, or M03 ended in rejected.'
        basis: inferred
        inferred_reason: 'Added in pass 3: failed covers signature armor that did not decode, but only end_of_stream led there; M15 can also end in not-armor on a line (M15-T09) and M03 can reject the decoded packets.'
    error_states: ['failed']
    terminal_states: ['verified', 'failed']
    note: 'Producers MAY dash-escape any line, SHOULD escape lines starting "From ", MUST escape lines starting "-" (R-0269 to R-0271), and SHOULD NOT use the framework for text with meaningful trailing whitespace or very large text (R-0275); a cleartext message cannot be verified in one pass because salt and hash algorithm come at the end (7.3).'
    constrained_by: ['rfc-9580#R-0269', 'rfc-9580#R-0270', 'rfc-9580#R-0271', 'rfc-9580#R-0275']

not_modelled:
  - item: 'Message and key generation'
    locator: '§2.1, §2.2, §5, §10'
    reason: 'Producing packets is a sequence of choices constrained by MUST/MUST NOT rules, not a lifecycle; the generator rules are cited where a consumer meets them (constrained_by at machine level).'
    source:
      - locator: '§10'
        quote: 'When generating a sequence of OpenPGP packets according to one of the three grammars, an implementation MUST NOT inject a critical packet of a type that does not adhere to the grammar.'
  - item: 'Algorithm selection by recipient preferences and Features'
    locator: '§5.2.3.14 to §5.2.3.17, §5.2.3.32, §12.2, §12.3, §13.7'
    reason: 'A sender-side function (intersection of preference lists, implicit AES-128 / OCB / SHA2-256 / uncompressed, v2 SEIPD when every recipient supports it), with no states.'
    source:
      - locator: '§12.2'
        quote: 'When encrypting to more than one recipient, the implementation finds a suitable algorithm by taking the intersection of the preferences of the recipients.'
  - item: 'Session-key reuse for replies'
    locator: '§13.8'
    reason: 'Application guidance with no defined procedure; the source says no documentation for safe reuse exists yet. M13 is unchanged by it.'
    source:
      - locator: '§13.8'
        quote: 'At the time of this writing, there is no known documentation about safe reuse of OpenPGP session keys for any specific context.'
  - item: 'Keyring and key storage management'
    locator: '§3.6, §5.10'
    reason: 'Out of scope by the source; Trust packet contents are implementation-defined.'
    source:
      - locator: '§3.6'
        quote: 'It is beyond the scope of this specification to discuss the details of keyrings or other databases.'
  - item: 'Web-of-trust validity policy'
    locator: '§5.2.1, §5.2.3.21'
    reason: 'How many partial or complete introducers make a key valid, and how certification levels 0x10 to 0x13 weigh, is left to the receiver; M10 models only what one trust signature asserts.'
    source:
      - locator: '§5.2.1'
        quote: 'Because OpenPGP places final authority for validity upon the receiver of a signature, it may be that one signer''s casual act might be more rigorous than some other authority''s positive act.'
  - item: 'The Regular Expression matcher'
    locator: '§8'
    reason: 'A matching engine for the Henry Spencer syntax of section 8; it is a function used by M10, not a lifecycle.'
    source:
      - locator: '§8'
        quote: 'Regular Expression:  Zero or more branches, separated by |. It matches anything that matches one of the branches.'
  - item: 'Cryptographic primitives'
    locator: '§5.13.3 to §5.13.5, §11, §12.1, §12.7'
    reason: 'EAX, OCB, GCM, CFB, ECDH, X25519/X448, EdDSA, RSA and PKCS#1 are invoked as functions in M05 and M11 to M14; their internals belong to the referenced specifications.'
    source:
      - locator: '§12.1'
        quote: '[RFC8017] should be treated as the ultimate authority on PKCS#1 for OpenPGP.'
  - item: 'SHA-1 collision detection'
    locator: '§13.1'
    reason: 'An optional (MAY) filter on hash inputs that either rejects or modifies the hash; it adds no state to M05 beyond K04.'
    source:
      - locator: '§13.1'
        quote: 'To avoid the risk of uncertain breakage from a maliciously introduced SHA-1 collision, an OpenPGP implementation MAY attempt to detect when a hash input is likely from a known collision attack and then either reject the hash input deliberately or modify the hash output.'
  - item: 'Fingerprint display and constrained fingerprint storage'
    locator: '§13.6, §14.1'
    reason: 'User-interface and storage rules (R-0404, R-0420, R-0421), not lifecycles.'
    source:
      - locator: '§14.1'
        quote: 'An implementation interacting with such a constrained field SHOULD directly calculate the version 6 fingerprint from public key material and associated metadata instead of relying on the constrained field.'
  - item: 'OpenPGP/MIME and other transports'
    locator: '§7, §14'
    reason: 'Defined elsewhere (RFC 3156); RFC 9580 defines no transport.'
    source:
      - locator: '§7'
        quote: '[RFC3156] defines another way to sign cleartext messages for environments that support MIME.'
open_questions:
  - id: 'OQ-01'
    locator: '§4.2'
    question: 'A header octet with bit 7 clear. Both formats have bit 7 always one, but no consumer action is stated; M01-T03 treats the stream as malformed.'
    source:
      - locator: '§4.2'
        quote: 'Note that the most significant bit is the leftmost bit, called "bit 7".'
    affects: ['M01-T03']
  - id: 'OQ-02'
    locator: '§5 Table 3, §4.3'
    question: 'Table 3 lists Type IDs 0 (reserved, MUST NOT be used), 19 and 20 (reserved) but omits 15 and 16 altogether; all fall in the critical range 0 to 39. Whether a consumer treats them as unknown critical packets (reject the sequence) or as known-but-unexpected (also reject) gives the same result, but the registry gap for 15 and 16 is a source defect.'
    source:
      - locator: '§4.3'
        quote: 'Packets with Type IDs from 0 to 39 are critical.  Packets with Type IDs from 40 to 63 are non-critical.'
    affects: ['M01-T22']
  - id: 'OQ-03'
    locator: '§4.2.1.4'
    question: 'Partial Body Lengths on a packet other than LIT, COMP, SED or SEIPD, or a first partial length below 512: both rules bind the producer; the consumer may accept, reject the packet, or reject the sequence.'
    source:
      - locator: '§4.2.1.4'
        quote: 'The first partial length MUST be at least 512 octets long.  Partial Body Lengths MUST NOT be used for any other packet types.'
    affects: ['M01-T08']
  - id: 'OQ-04'
    locator: '§4.1, §10'
    question: 'A packet "malformed and unusable" (R-0021) inside a sequence: for SIG, 5.2.5 says ignore it and continue; for other packets (a malformed PKESK, key packet, LIT) the source does not say whether the packet is skipped or the sequence rejected.'
    source:
      - locator: '§4.1'
        quote: 'In the event that a subfield length indicator within a packet implies inclusion of octets outside the range indicated in the packet header, a parser MUST abort without writing outside the indicated range and MUST treat the packet as malformed and unusable.'
    affects: ['M01-T23']
  - id: 'OQ-05'
    locator: '§10, §5.14, §5.10'
    question: 'Padding (21) and Trust (12) are critical packets. Section 10 calls a known but unexpected packet a critical error, yet 5.14 requires Padding to be processed anywhere and 5.10 says Trust SHOULD be ignored outside keyrings. M02, M03 and M04 ignore both; a strict grammar reading would reject.'
    source:
      - locator: '§10'
        quote: 'The presence of an unknown critical packet, or a known but unexpected packet, is a critical error, invalidating the entire sequence (see Section 4.3).'
      - locator: '§5.14'
        quote: 'An implementation MUST be able to process Padding packets anywhere else in an OpenPGP stream so that future revisions of this document may specify further locations for padding.'
    affects: ['M02-T03', 'M02-T04', 'M04-T14', 'M04-T15']
  - id: 'OQ-06'
    locator: '§10.3'
    question: 'Which production a top-level stream must match (OpenPGP Message or Optionally Padded Message), and whether several concatenated OpenPGP Messages in one stream are valid, are not stated.'
    source:
      - locator: '§10.3'
        quote: 'An OpenPGP Message is a packet or sequence of packets that adheres to the following grammatical rules (a comma (,) represents sequential composition, and a vertical bar (|) separates alternatives):'
    affects: ['M02-T20', 'M02-T06']
  - id: 'OQ-07'
    locator: '§5.4, §5.2.4, §10.3'
    question: 'What octets a prefixed or one-pass signature hashes when the signed OpenPGP Message is not a bare Literal Message (for example compressed, or itself one-pass signed): the literal data after unwrapping is the usual reading, but the source states only how document data is hashed.'
    source:
      - locator: '§5.2.4'
        quote: 'For binary document signatures (Type ID 0x00), the document data is hashed directly.'
    affects: ['M02-T07', 'M02-T10']
  - id: 'OQ-08'
    locator: '§5.4'
    question: 'The nested flag: 0 is defined (another OPS follows over the same data); the meaning of a non-zero value is not stated, nor the consumer action when a 0 is not followed by an OPS.'
    source:
      - locator: '§5.4'
        quote: 'A 1-octet number holding a flag showing whether the signature is nested.'
    affects: ['M02-T08']
  - id: 'OQ-09'
    locator: '§10.1.1, §10.1.3'
    question: 'The key grammars name signature roles (revocation, Direct Key, certification, binding) that are Signature Type IDs of one packet type. Whether a SIG of the wrong type for its position, a revocation after a Direct Key signature, or two revocations on a v4 primary ([Revocation Signature] without ellipsis) invalidates the sequence is not stated. Nor is the position of a Certification Revocation (0x30) that revokes a Direct Key signature (5.2.1.13 allows it; no grammar slot after the primary key names it).'
    source:
      - locator: '§10.1.3'
        quote: 'The format of an OpenPGP version 4 key is as follows.'
    affects: ['M04-T04', 'M04-T06', 'M04-T11', 'M04-T21']
  - id: 'OQ-10'
    locator: '§10.1.5'
    question: 'A primary key with an encryption-only algorithm (for example X25519): rejection of the sequence, or only an unusable key, is not stated.'
    source:
      - locator: '§10.1.5'
        quote: 'The primary key MUST be an algorithm capable of making signatures (that is, not an encryption-only algorithm).'
    affects: ['M04-T01']
  - id: 'OQ-11'
    locator: '§10.1.1, §5.2.3.10'
    question: 'A v6 TPK with no Direct Key signature (other than the 10.1.2 revocation certificate form): the grammar makes it non-conforming, R-0098 makes the key unusable; whether a consumer also rejects the packet sequence is not stated.'
    source:
      - locator: '§5.2.3.10'
        quote: 'An implementation MUST ensure that a valid Direct Key signature is present before using a version 6 key.'
    affects: ['M04-T05', 'M06-T03']
  - id: 'OQ-12'
    locator: '§10.1.1, §10.1.3, §10.1.5'
    question: 'A subkey with no binding signature, or of a different version than the primary key: whether the consumer drops that subkey or rejects the whole key is not stated. M04 drops the subkey.'
    source:
      - locator: '§10.1.1'
        quote: 'Every subkey MUST have at least one Subkey Binding signature.'
    affects: ['M04-T07', 'M04-T12', 'M04-T16']
  - id: 'OQ-13'
    locator: '§5.4, §5.2.5'
    question: 'Only a version mismatch between OPS and SIG is listed as malformed, and the salt MUST match. A mismatch in signature type, hash algorithm, public key algorithm or issuer between them is not addressed.'
    source:
      - locator: '§5.2.5'
        quote: 'A mismatch between the One-Pass Signature version and the Signature version (see Section 10.3.2.2)'
    affects: ['M05 S08', 'M02-T21']
  - id: 'OQ-14'
    locator: '§5.2.3.7, §5.2.5'
    question: 'An unknown critical subpacket in the unhashed area: 5.2.3.7 says the signature SHOULD be in error wherever it is encountered; 5.2.5 lists it only for the hashed area; 13.13 says unhashed data is advisory.'
    source:
      - locator: '§5.2.5'
        quote: 'An unknown "critical" subpacket (see Section 5.2.3.7) in the hashed area'
    affects: ['M05 P02']
  - id: 'OQ-15'
    locator: '§5.2.3.11'
    question: 'A v4 or v6 signature without a hashed Signature Creation Time: the MUST binds the producer; the verifier action is not stated. M05 treats it as malformed.'
    source:
      - locator: '§5.2.3.11'
        quote: 'This subpacket MUST be present in the hashed area.'
    affects: ['M05 P07']
  - id: 'OQ-16'
    locator: '§9.5'
    question: 'What makes a signature "recent" (MUST NOT validate) or "old" (SHOULD NOT validate unless it predates the known weakness) for MD5, SHA-1 and RIPEMD-160 is not defined, and 5.2.5 separately calls a weak-hash signature malformed.'
    source:
      - locator: '§9.5'
        quote: 'Implementations SHOULD NOT validate any old signature that depends on MD5, SHA-1, or RIPEMD-160 unless the signature''s creation date predates known weakness of the algorithm used, and the implementation is confident that the message has been in the secure custody of the user the whole time.'
    affects: ['M05 K04']
  - id: 'OQ-17'
    locator: '§5.2.1.14, §5.2.1.13, §5.2.4'
    question: 'The data hashed for a Timestamp signature (0x40) is not specified, and 5.2.4 does not spell out the hash input of a 0x30 that revokes a Direct Key signature or of a third-party 0x1F (by inference the key alone, as 0x1F and 0x20).'
    source:
      - locator: '§5.2.1.14'
        quote: 'This signature is only meaningful for the timestamp contained in it.'
    affects: ['M05 H02']
  - id: 'OQ-18'
    locator: '§5.2.3.29, §5.2.3.10'
    question: 'Whether a verifier must require the sign-data flag (0x02) on the key that made a document signature, or the certify flag (0x01) on a third-party certifier, is not stated as a verifier rule; only that self-signatures need no flag.'
    source:
      - locator: '§5.2.3.10'
        quote: 'In particular, a primary key does not need to have 0x01 set in the first octet of the Key Flags order to make a valid self-signature.'
    affects: ['M05 X02', 'M07-T05']
  - id: 'OQ-19'
    locator: '§5.2.3.10, §5.2.3.13'
    question: 'For a v4 key, how a Key Expiration Time on a Direct Key signature combines with one on the primary User ID self-signature (which wins, or the earlier) is not stated.'
    source:
      - locator: '§5.2.3.13'
        quote: 'For a direct or certification self-signature, the key creation time is that of the primary key.'
    affects: ['M06 effective_self_signature']
  - id: 'OQ-20'
    locator: '§5.2.3.31'
    question: 'The source distinguishes compromise (all signatures suspect) from superseded or retired (old signatures valid). Reason 0 (no reason specified), private codes 100 to 110, and a revocation without a Reason for Revocation subpacket are not classified. M06 treats them as hard.'
    source:
      - locator: '§5.2.3.31'
        quote: 'If a key has been revoked because of a compromise, all signatures created by that key are suspect.  However, if it was merely superseded or retired, old signatures are still valid.'
    affects: ['M06-T01', 'M06-T12']
  - id: 'OQ-21'
    locator: '§5.2.3.13, §5.2.3.18, §3.5'
    question: 'Boundary and clock questions: is a key or signature still valid at exactly creation + expiration; how is a key evaluated before its creation time; how is a signature with a creation time in the future, or older than its key, treated.'
    source:
      - locator: '§5.2.3.18'
        quote: 'This is the number of seconds after the Signature Creation Time that the signature expires.'
    affects: ['M05 X01', 'M06-T04', 'M06-T05', 'M07-T05']
  - id: 'OQ-22'
    locator: '§5.2.1.8, §10.1.5'
    question: 'A "signing subkey" (one that needs the embedded 0x19) is not defined: by Key Flags 0x02, by a sign-capable algorithm, or both.'
    source:
      - locator: '§10.1.5'
        quote: 'For subkeys that can issue signatures, the Subkey Binding signature MUST contain an Embedded Signature subpacket with a Primary Key Binding signature (Type ID 0x19) issued by the subkey on the top-level key.'
    affects: ['M07 effective_binding']
  - id: 'OQ-23'
    locator: '§5.2.3.31'
    question: 'Reason for Revocation is said to be used only in Key Revocation and Certification Revocation signatures, which omits the Subkey Revocation signature (0x28); whether its codes 0 to 3 apply to 0x28, and so whether a subkey revocation is soft or hard, is not stated. Likely a source defect.'
    source:
      - locator: '§5.2.3.31'
        quote: 'This subpacket is used only in Key Revocation and Certification Revocation signatures.'
    affects: ['M07 revoked']
  - id: 'OQ-24'
    locator: '§5.2.1.11'
    question: 'Whether a subkey may be used while its primary key is expired, soft-revoked or unusable is not stated (only that a revoked key is not to be used).'
    source:
      - locator: '§5.2.1.11'
        quote: 'A revoked key is not to be used.'
    affects: ['M07-T03', 'M07-T09', 'M07-T10']
  - id: 'OQ-25'
    locator: '§5.2.1.13, §5.2.3.33'
    question: 'A Certification Revocation without a Signature Target: does it revoke every earlier certification by the same issuer on that User ID, or only one?'
    source:
      - locator: '§5.2.1.13'
        quote: 'This signature revokes an earlier User ID certification signature (Type IDs 0x10 through 0x13) or Direct Key signature (Type ID 0x1F).'
    affects: ['M08-T01', 'M09-T05']
  - id: 'OQ-26'
    locator: '§5.2.3.22, §8'
    question: 'How Regular Expressions accumulate along a chain of trust signatures (M10 intersects them), how several Regular Expression subpackets in one signature combine, and what to do with an expression that fails to parse under section 8.'
    source:
      - locator: '§5.2.3.22'
        quote: 'Only signatures by the target key on User IDs that match the Regular Expression in the body of this packet have trust extended by the Trust Signature subpacket.'
    affects: ['M10-T01', 'M10-T05']
  - id: 'OQ-27'
    locator: '§5.2.3.21'
    question: 'How trust amounts combine along a chain (minimum, product, or the last hop only) and how a level-L trust signature interacts with an introducer whose own remaining depth is smaller (M10 takes the minimum).'
    source:
      - locator: '§5.2.3.21'
        quote: 'Generally, a level n Trust Signature asserts that a key is trusted to issue level n-1 Trust Signatures.'
    affects: ['M10-T01']
  - id: 'OQ-28'
    locator: '§5.3.2, §5.13.2'
    question: 'A v6 SKESK carries its own cipher and AEAD algorithm for wrapping the session key; whether they must equal those of the following v2 SEIPD is not stated.'
    source:
      - locator: '§5.3.2'
        quote: 'A 1-octet Symmetric Cipher Algorithm ID (from Table 21).'
    affects: ['M11 E09']
  - id: 'OQ-29'
    locator: '§5.13.2'
    question: 'A chunk size octet above 16: generation is forbidden, acceptance of 0 to 16 is required; acceptance or rejection above 16 is open.'
    source:
      - locator: '§5.13.2'
        quote: 'An implementation MUST accept chunk size octets with values from 0 to 16.  An implementation MUST NOT create data with a chunk size octet value larger than 16 (4 MiB chunks).'
    affects: ['M13-T01', 'M13-T02']
  - id: 'OQ-30'
    locator: '§5.13.2'
    question: 'A v2 SEIPD "consists of one or more chunks"; for an empty plaintext it is not stated whether there is one empty chunk (with its tag) or none before the final tag.'
    source:
      - locator: '§5.13.2'
        quote: 'A v2 SEIPD packet consists of one or more chunks of data.'
    affects: ['M13-T05']
  - id: 'OQ-31'
    locator: '§5.13.2, §13.7'
    question: 'The prose does not state the nonce (chunk index) used for the final authentication tag. Also, 5.13.2 calls it a final summary authentication tag "encrypting the empty string" while 13.7 calls it a "final zero-octet chunk": the same thing under two names (terminology defect).'
    source:
      - locator: '§5.13.2'
        quote: 'A final summary authentication tag for the AEAD mode.'
      - locator: '§13.7'
        quote: 'Any version 2 Symmetrically Encrypted and Integrity Protected Data packet (Section 5.13.2) where the authentication tag of any chunk fails or where there is no final zero-octet chunk.'
    affects: ['M13-T06']
  - id: 'OQ-32'
    locator: '§3.7.1.4'
    question: 'Argon2 parameters outside the stated ranges (t or p zero, encoded_m out of range): the MUSTs constrain the value; whether the consumer rejects the packet is not stated.'
    source:
      - locator: '§3.7.1.4'
        quote: 'The number of passes t and the degree of parallelism p MUST be non-zero.'
    affects: ['M14 U04', 'M14-T09']
  - id: 'OQ-33'
    locator: '§7.2'
    question: 'Source defect: the text says to strip "the string -", and to warn for "- and any character other than a space"; the quotation marks around "- " (dash, space) and "-" were lost. By the escaping rule the stripped string is "- ".'
    source:
      - locator: '§7.2'
        quote: 'When reversing dash-escaping, an implementation MUST strip the string - if it occurs at the beginning of a line, and it SHOULD provide a warning for - and any character other than a space at the beginning of a line.'
    affects: ['M16-T05', 'M16-T07']
  - id: 'OQ-34'
    locator: '§6.1, §6.2.3'
    question: 'How a consumer tells the checksum line from base64 data (a final data line can end in = padding but does not start with =), what follows a malformed checksum line, and what happens when the Armor Tail Line text differs from the Header Line text, are not stated.'
    source:
      - locator: '§6.1'
        quote: 'If present, the checksum with its leading equal sign MUST appear on the next line after the base64-encoded data.'
    affects: ['M15-T06', 'M15-T07', 'M15-T09']
  - id: 'OQ-35'
    locator: '§6.2.2.3'
    question: 'Source defect: a conformant Hash header is to be ignored "deferring to the hash algorithm indicated in the Embedded Signature", but a cleartext signed message carries Signature packets in an armored block, not an Embedded Signature subpacket; the hash algorithm of each Signature packet is meant.'
    source:
      - locator: '§6.2.2.3'
        quote: 'When a conformant Hash header is present, a verifying application MUST ignore its contents, deferring to the hash algorithm indicated in the Embedded Signature.'
    affects: ['M16-T02']
  - id: 'OQ-36'
    locator: '§7.1'
    question: 'Source defect: the structure lists "One or more legacy Hash Armor Headers" which "MAY be included", that is zero or more.'
    source:
      - locator: '§7.1'
        quote: 'One or more legacy Hash Armor Headers that MAY be included by some implementations and MUST be ignored when well formed (see Section 6.2.2.3).'
    affects: ['M16-T02', 'M16-T03']
  - id: 'OQ-37'
    locator: '§5.1, §5.3, §5.5.2, §5.13, §5.2.5'
    question: 'Unknown packet versions. Only a Signature packet of unknown version has stated handling (5.2.5: ignore it, continue). For a PKESK, SKESK, Key or Subkey packet, or SEIPD packet whose version octet is not one the source defines, no consumer action is stated. M11 F04 discards an unknown-version ESK (inferred); M04-T01 accepts only key versions 2, 3, 4 and 6 and M04-T20 rejects the sequence otherwise (inferred); M12-T01 and M13 accept only SEIPD versions 1 and 2, so an unknown SEIPD version has no transition: whether it rejects the sequence, makes only that key or packet unusable, or is skipped is open.'
    source:
      - locator: '§5.1'
        quote: 'The currently defined versions are 3 and 6.'
      - locator: '§5.2.5'
        quote: 'An unknown signature version'
    affects: ['M11 F04', 'M04-T01', 'M04-T20', 'M12-T01', 'M13-T01']

  - id: 'OQ-38'
    locator: '§10.3, §5.4'
    question: 'The One-Pass Signed Message production ends in a "Corresponding Signature Packet", which the source does not define. M02-T21 pairs the last OPS pushed with the first SIG after its message (the bracketing reading of 5.4); whether a SIG whose type, algorithms or issuer differ from the OPS is still the corresponding one is OQ-13. The consumer action when the stream ends before the Corresponding Signature Packet is not stated either; M02-T22 rejects by the grammar reading. Added in pass 3.'
    source:
      - locator: '§10.3'
        quote: 'One-Pass Signed Message:  One-Pass Signature Packet, OpenPGP Message, Corresponding Signature Packet.'
    affects: ['M02-T21', 'M02-T22']
  - id: 'OQ-39'
    locator: '§5.2.1.13'
    question: 'A Certification Revocation "should have a later creation date than that certification", with no consequence stated for one that does not. M08-T01 and M09-T05 require a later creation time before the revocation takes effect; ignoring the revocation, or honouring it regardless of date, are also readings the source admits. Added in pass 3.'
    source:
      - locator: '§5.2.1.13'
        quote: 'The signature is computed over the same data as the certification that it revokes, and it should have a later creation date than that certification.'
    affects: ['M08-T01', 'M08-T07', 'M09-T05']
  - id: 'OQ-40'
    locator: '§13.7, §5.13.2'
    question: 'Source tension. For AEAD data, a tag that fails to verify forbids parsing or releasing any decrypted data and requires a halt (R-0406), while a truncated message, whose final zero-octet chunk is missing, MAY have released the fully authenticated chunks before it when streaming (R-0408). A missing or altered final chunk is detected only by the final authentication tag failing to verify, so the same event falls under both rules; 13.7 also lists both "the authentication tag of any chunk fails" and "there is no final zero-octet chunk" as separate signs of malleable ciphertext. M13-T08 treats a failing final tag after a verified last chunk as truncation and keeps already-released chunks released; M13-T07 treats a failing last-chunk tag as a tag failure. Added in pass 3.'
    source:
      - locator: '§13.7'
        quote: 'In the case of AEAD encrypted data, if the authentication tag fails to verify, the implementation MUST NOT attempt to parse nor release decrypted data to the user, and it MUST halt with an error.'
      - locator: '§13.7'
        quote: 'In the case of AEAD encrypted messages, if the message is truncated, i.e., the final zero-octet chunk and possibly (part of) some chunks before it are missing, the implementation MAY choose to release cleartext from the fully authenticated chunks before it to the user if it is operating in a streaming fashion, but it MUST indicate a clear error message as soon as the truncation is detected.'
      - locator: '§13.7'
        quote: 'Any version 2 Symmetrically Encrypted and Integrity Protected Data packet (Section 5.13.2) where the authentication tag of any chunk fails or where there is no final zero-octet chunk.'
    affects: ['M13-T03', 'M13-T07', 'M13-T08']

source_defects: ['OQ-02', 'OQ-23', 'OQ-31', 'OQ-33', 'OQ-35', 'OQ-36', 'OQ-40']
