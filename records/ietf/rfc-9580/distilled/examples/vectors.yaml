  - rfc-9580#R-0026
  - rfc-9580#R-0027
  - rfc-9580#R-0028
  - rfc-9580#R-0029
  verified: true
  derived:
    in_source: false
    decode: 1 << (0xEF & 0x1F) = 32768; 0xE1 -> 2; 0xE0 -> 1; 0xF0 -> 65536; 0xC5 0xDD -> 1693; sum 100000
    rules: the first partial length (32768) is at least 512 (R-0028); later partial parts may be smaller (2 and 1); the last header is not partial (R-0026)
    parser: a 100000-octet Literal Data packet framed this way (header 0xCB) was built in scratch and re-parsed to one 100000-octet body
