    packet_hex: c5860663877fe31b00000020f94da7bb48d60a61e567706a6587d0331999bb9d891a08242ead84543df895a3fe260914045d6fd71c9e096d1eb6917b6e6e1eecae010415b4a8a9274fabe632f875a70659202100679f166edb7159c0a740ac7cb1b888b1e305dc7baacc5820ea9934f56cfc55296907b1f049231a783ad495ba189880fbd8deb4d2
  expected_basis: rule-quoted
  rule_text:
  - An implementation MUST NOT create and MUST reject as malformed any Secret Key packet where the S2K usage octet is not AEAD (253) and the S2K Specifier Type is Argon2.
  constrained_by:
  - rfc-9580#R-0018
  verified: true
  derived:
    in_source: false
    outcome: rejected as malformed
    pass3_rebuild: 'pass 3 rebuilt this vector. The pass-1 bytes changed only the usage octet and kept the AEAD layout. Read as usage 254, the AEAD octet 02 then becomes the S2K length, the S2K Specifier becomes 14 04 (type 20, unassigned), and the count 38 no longer matches the fields. So no Argon2 specifier was present at the usage-254 position, and R-0018 was not exercised. The rebuilt packet is well formed for usage 254: count 38 = 1 + 1 + 20 + 16, and the CFB plaintext decrypts with a valid SHA-1. Its only defect is Argon2 under a usage other than 253. validate.derived.py: the schema requires s2k_usage 253 for an Argon2 S2K'
- id: PGP-0553-C01
  source:
    locator: §5.5.3
    lines: 3195-3196
  kind: secret-key
  in_source: false
  fidelity: constructed
  input:
    description: 'the A.4 primary key (v6) protected under S2K usage 255 (MalleableCFB) with the usage-255 layout: ff || count 1c || cipher 09 || the A.9.1 Iterated and Salted S2K 0308a5ae579d1fc5d82bff || 16-octet IV b4a8a9274fabe632f875a70659202100 || AES-256-CFB(A.4 secret || checksum 0da7). The key is the PGP-0371-C01 32-octet S2K output for ''password'''
    packet_hex: c56a0663877fe31b00000020f94da7bb48d60a61e567706a6587d0331999bb9d891a08242ead84543df895a3ff1c090308a5ae579d1fc5d82bffb4a8a9274fabe632f875a7065920210002ab91c24e2e15a9e4b839bd77882a5c218f3ab901784ef4cb56068cb3398959a689
  expected_basis: rule-quoted
  rule_text:
  - A version 6 packet MUST NOT use the value 255 (MalleableCFB).
  constrained_by:
  - rfc-9580#R-0191
  - rfc-9580#R-0017
  verified: true
  derived:
    in_source: false
    outcome: rejected
    pass3_rebuild: 'pass 3 rebuilt this vector. The pass-1 bytes changed only the usage octet of the A.5 packet. Under usage 255 there is no AEAD octet and no S2K length, so 02 was read as the S2K type (reserved) and the packet ran out before its IV. It was malformed in structure before R-0191 applied. The rebuilt packet follows the usage-255 layout: count 28 = 1 + 11 + 16, and the CFB plaintext decrypts to the A.4 secret with a matching checksum. It uses Iterated and Salted, not Argon2, so that R-0018 is not hit as well. validate.derived.py: s2k_usage 255 is not one of [0, 253, 254] for a v6 key'
