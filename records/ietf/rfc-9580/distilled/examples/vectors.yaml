# ====================================================================
# Conventions used in this file
# ====================================================================
#
# RFC 9580 is a data format, not a wire protocol: every vector is an
# object (packet, packet sequence, armor block, field) and what a
# conforming producer must emit or a conforming consumer must accept,
# reject or compute from it. No vector involves a peer or a session.
#
# ids        PGP-<section>-NN for source examples, PGP-<section>-CNN for
#            constructed ones. The section is its digits without dots:
#            Appendix A.3.1 is A31, §5.2.3.15 is 05315, §4.2.3 is 0423.
#            Never reused.
# source     locator and the line range(s) of .cache/rfc-9580.txt that hold
#            the example or, for a constructed vector, each quoted rule.
# in_source  true: the source prints the input. false: built for this file.
# fidelity   verbatim    -- a fixture file re-extracted byte for byte from
#                           the source (indent removed, see fixtures).
#            split       -- taken out of running prose; every quoted
#                           character is the source's.
#            table       -- read off a table (Tables 19, 24).
#            constructed -- built in scratch from a rule the source states
#                           but gives no literal for.
# input      fixtures: [{file, sha256 of the file, decoded_sha256 of the
#            octets it encodes}]; or the printed value(s).
# expected   what the source states. Hex values carry the source lines they
#            were read from; every value under expected was re-read from
#            those lines by the checker. Quoted strings are verbatim after
#            whitespace normalisation (a line break and the next line's
#            indent read as one space; a word hyphenated at a line end is
#            rejoined, as in requirements.yaml).
# expected_basis   stated (the source states the result for this input) or
#            rule-quoted (only the rule is stated; rule_text quotes it and
#            the result is derived.outcome).
# expected_result  the result in words; for rule-quoted vectors it is
#            derived.outcome.
# constrained_by   rfc-9580#R-NNNN ids from requirements.yaml. Empty where
#            the governing rule is lowercase prose with no BCP 14 keyword
#            (length decoding, fingerprint construction, the KDF layout).
# verified   true: every computation under derived was run in scratch and
#            every equality it claims held. Constructed vectors are
#            verified in the sense that their bytes were built and the
#            stated property (signature verifies / tag fails / value) was
#            checked; their outcome follows from the quoted rule.
# derived    everything this extraction computed, in_source: false. Tools:
#            Python 3.12, cryptography 41.0.7 (Ed25519, X25519, HKDF,
#            AES key wrap, AES-OCB3, AES-GCM, AES-CFB/CTR, CMAC),
#            libargon2.so.1 via ctypes (Argon2id), hashlib, GnuPG 2.4.4;
#            nothing fetched.
# ambiguous  true where the source supports more than one result;
#            ambiguous_reason says why.
# source_defects   defects in the SOURCE, recorded and not repaired.

