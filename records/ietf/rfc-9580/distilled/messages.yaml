          - rfc-9580#R-0188
          - rfc-9580#R-0318
      - name: creation-time
        type: time32
        required: true
      - name: public-key-algorithm
        type: u8
        required: true
        constraints: >-
          Table 18. A primary key must be signing-capable (R-0323).
        constrained_by:
          - rfc-9580#R-0323
          - rfc-9580#R-0277
          - rfc-9580#R-0283
      - name: key-material
        type: algorithm-specific public part (key-part-*)
        required: true
        constraints: "A series of values comprising the key material. This is algorithm specific and described in Section 5.5.5."
    layout: >-
      0x04 || ctime (4) || pkalgo (1) || algorithm-specific public fields. A.1 (lines 7601-7604):
      98 33 | 04 53f35f0b 16 | 09 2b06010401da470f01 | 0107 40 3f09...2406.
    notes: >-
      A v4 key has no key-material length, so a parser that does not know the algorithm cannot
      find the end of the public part inside a Secret Key packet (the reason v6 adds one).

  - name: public-key-v6
    packet_type: "6 (Public Key), 14 (Public Subkey)"
    shorthand: "PUBKEY, PUBSUBKEY"
    version: 6
    source: "§5.5.1.1-§5.5.1.2, lines 3066-3078; §5.5.2, lines 3091-3105; §5.5.2.3, lines 3156-3177"
    normative_status: current
    generate: "\"OpenPGP implementations SHOULD create keys with version 6 format.\""
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 6
        required: true
        constrained_by:
          - rfc-9580#R-0187
          - rfc-9580#R-0312
      - name: creation-time
        type: time32
        required: true
      - name: public-key-algorithm
        type: u8
        required: true
        constraints: >-
          Table 18. Not EdDSALegacy or ECDH over Curve25519Legacy (deprecated OIDs, R-0286).
        constrained_by:
          - rfc-9580#R-0323
          - rfc-9580#R-0286
          - rfc-9580#R-0277
          - rfc-9580#R-0283
      - name: key-material-length
        type: u32
        required: true
        constraints: "A 4-octet scalar octet count for the public key material specified in the next field."
        constrained_by:
          - rfc-9580#R-0021
      - name: key-material
        type: algorithm-specific public part (key-part-*)
        required: true
    layout: >-
      0x06 || ctime (4) || pkalgo (1) || u32 len || public fields (len). A.3 (decoded): c6 2a |
      06 63877fe3 1b 00000020 f94d...95a3 (Ed25519). Subkey: ce 2a | 06 63877fe3 19 00000020
      8693...4435 (X25519).
    constrained_by:
      - rfc-9580#R-0003

  - name: secret-key
    packet_type: "5 (Secret Key), 7 (Secret Subkey)"
    shorthand: "SECKEY, SECSUBKEY"
    version: "3, 4, 6 (the public part's version)"
    source: "§5.5.1.3-§5.5.1.4, lines 3080-3089; §5.5.3, lines 3179-3316; §3.7.2.1, lines 809-907"
    normative_status: current
    encoding: binary packet body
    fields:
      - name: public-fields
        type: "public-key-v3 | public-key-v4 | public-key-v6 body"
        required: true
        constraints: "The fields of a Public Key or Public Subkey packet, as described above."
      - name: s2k-usage
        type: u8
        required: true
        constraints: >-
          0 unprotected; 253 AEAD; 254 CFB; 255 MalleableCFB; any other value a Symmetric Cipher
          Algorithm ID (LegacyCFB, MD5 of the passphrase). "A version 6 packet MUST NOT use the
          value 255 (MalleableCFB)." See s2k-usage-forms.
        constrained_by:
          - rfc-9580#R-0191
          - rfc-9580#R-0015
          - rfc-9580#R-0016
          - rfc-9580#R-0017
          - rfc-9580#R-0193
          - rfc-9580#R-0194
          - rfc-9580#R-0413
      - name: params-length
        type: u8
        required: conditional
        required_when: version 6 and s2k-usage != 0
        constraints: >-
          "a 1-octet scalar octet count of the cumulative length of all the following
          conditionally included S2K parameter fields."
      - name: symmetric-algorithm
        type: u8
        required: conditional
        required_when: s2k-usage 253, 254 or 255
        constrained_by:
          - rfc-9580#R-0287
          - rfc-9580#R-0289
      - name: aead-algorithm
        type: u8
        required: conditional
        required_when: s2k-usage 253
        constrained_by:
          - rfc-9580#R-0307
          - rfc-9580#R-0308
      - name: s2k-length
        type: u8
        required: conditional
        required_when: version 6 and s2k-usage 253 or 254
        constraints: "a 1-octet count of the size of the one field following this octet."
      - name: s2k
        type: s2k
        required: conditional
        required_when: s2k-usage 253, 254 or 255
        constraints: >-
          Argon2 only with usage 253: "An implementation MUST NOT create and MUST reject as
          malformed any Secret Key packet where the S2K usage octet is not AEAD (253) and the S2K
          Specifier Type is Argon2."
        constrained_by:
          - rfc-9580#R-0018
          - rfc-9580#R-0303
          - rfc-9580#R-0304
      - name: iv
        type: octets[var]
        required: conditional
        required_when: s2k-usage != 0
        constraints: >-
          Usage 253: nonce of the AEAD algorithm's nonce length. Usage 254, 255 or a cipher ID:
          "an IV of the same length as the cipher's block size."
        constrained_by:
          - rfc-9580#R-0415
      - name: secret-material
        type: algorithm-specific secret part (key-part-*), plain or encrypted
        required: true
        constraints: >-
          Usage 253: AEAD ciphertext of the secret part followed by the AEAD tag. Usage 254:
          CFB(secret part || SHA-1(secret part)). Usage 255 or cipher ID: CFB(secret part ||
          checksum16). With v3 keys only the MPI value octets are encrypted, the 2-octet bit
          counts stay clear and CFB resynchronizes at each MPI; v4 and v6 encrypt the MPIs whole.
          After decryption the cleartext must parse exactly into the secret part.
        constrained_by:
          - rfc-9580#R-0192
          - rfc-9580#R-0195
          - rfc-9580#R-0196
          - rfc-9580#R-0197
          - rfc-9580#R-0399
      - name: checksum
        type: checksum16
        required: conditional
        required_when: version 3 or 4 and s2k-usage 0
        constraints: >-
          "Only for a version 3 or 4 packet where the S2K usage octet is zero, a 2-octet checksum
          of the algorithm-specific portion (sum of all octets, mod 65536)." A v6 unprotected key
          has none (A.4).
    layout: >-
      public fields || usage || [v6: n] || [cipher] || [aead] || [v6: s] || [S2K] || [IV] ||
      secret part (plain or encrypted, with tag, SHA-1 or checksum per usage) || [v3/v4 usage 0:
      u16 checksum]. A.4 (decoded, v6 unprotected): c5 4b | <42-octet v6 public part> | 00 |
      1972...b0b7 (32-octet Ed25519 secret). A.5 (decoded, v6 locked): c5 82 | <public part> |
      fd | 26 | 09 | 02 | 14 | 04 <16 salt> 01 04 15 | <15-octet OCB nonce> | 48 octets (32
      encrypted + 16 tag).
    aead_derivation: >-
      Usage 253: KEK = HKDF-SHA256(IKM = S2K output, salt = none, info = packet type octet in
      OpenPGP format || packet version || cipher || aead); AD = packet type octet || the public
      key packet fields starting with the version octet. Example AD for a v4 Secret Key: 0xC5,
      0x04, creation time, algorithm, public parameters; Secret Subkey 0xC7; v6 includes the
      4-octet key-material count.
    constrained_by:
      - rfc-9580#R-0405
      - rfc-9580#R-0406
    notes: >-
      Derived (recomputed): HKDF-SHA256 of the A.5.1 S2K output with info c5 06 09 02 gives the
      A.5.1 key 9e37cb26...77fd51, and the A.5.1 AD (lines 7925-7926) is c5 || the 42-octet v6
      public part, confirming the info layout (type, version, cipher, AEAD) and the AD layout.
      Derived arithmetic check: A.5 params-length 0x26 = 38 = cipher 1 + aead 1 + s2k-length 1 +
      Argon2 S2K 20 + nonce 15. Table 2 says LegacyCFB and MalleableCFB encrypt check(secrets),
      but §5.5.3 says "With version 3 keys, the checksum is stored in the clear." (SD-M12).

  - name: s2k-usage-forms
    applies_to: secret-key.s2k-usage
    source: "§3.7.2.1 Table 2, lines 841-907; §5.5.3, lines 3190-3242"
    normative_status: current
    rows:
      - usage: 0
        shorthand: Unprotected
        parameter_fields: none
        encryption: "v3 or v4: cleartext secrets || check(secrets); v6: cleartext secrets"
        generate: "Yes"
      - usage: "known symmetric cipher ID"
        shorthand: LegacyCFB
        parameter_fields: IV
        encryption: "CFB(MD5(passphrase), secrets || check(secrets))"
        generate: "No"
      - usage: 253
        shorthand: AEAD
        parameter_fields: "params-length (v6-only), cipher-algo, AEAD-mode, S2K-specifier-length (v6-only), S2K-specifier, nonce"
        encryption: "AEAD(HKDF(S2K(passphrase), info), secrets, packetprefix)"
        generate: "Yes"
      - usage: 254
        shorthand: CFB
        parameter_fields: "params-length (v6-only), cipher-algo, S2K-specifier-length (v6-only), S2K-specifier, IV"
        encryption: "CFB(S2K(passphrase), secrets || SHA1(secrets))"
        generate: "Yes"
      - usage: 255
        shorthand: MalleableCFB
        parameter_fields: "cipher-algo, S2K-specifier, IV"
        encryption: "CFB(S2K(passphrase), secrets || check(secrets))"
        generate: "No"
    constrained_by:
      - rfc-9580#R-0015
      - rfc-9580#R-0016
      - rfc-9580#R-0017
      - rfc-9580#R-0191
      - rfc-9580#R-0413
    notes: >-
      Symmetric algorithm IDs 253-255 are reserved in Table 21 to avoid collision with these
      usage values. Integrity failures of protected key material (bad AEAD tag, SHA-1 mismatch,
      checksum mismatch) indicate malleable ciphertext (§13.7).

  # ----- S2K Specifiers (§3.7.1) -----

  - name: s2k-simple
    s2k_type: 0
    source: "§3.7.1.1, lines 670-697; Table 1, lines 637-663"
    normative_status: deprecated
    generate: "No (Table 1); \"an implementation MUST NOT use Simple S2K\""
    encoding: binary
    fields:
      - name: type
        type: u8
        value: "0x00"
        required: true
      - name: hash-algorithm
        type: u8
        required: true
    layout: "00 || hash (2 octets)"
    derivation: >-
      Key = leftmost key-size octets of H0(pass) || H1(pass) || ..., where context Hi is preloaded
      with i zero octets.
    constrained_by:
