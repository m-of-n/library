    constrained_by:
      - rfc-9580#R-0236
      - rfc-9580#R-0238
      - rfc-9580#R-0239
      - rfc-9580#R-0327
      - rfc-9580#R-0328
    layout: "random octets; A.8.4 line 8269: d5 0e + 14 octets"
    notes: >-
      Placement: end of a v6 TPK sent over an encrypted channel, last packet inside v2 SEIPD;
      accepted anywhere. Size policy is out of scope. Derived: a zero-length Padding packet is not
      excluded.

