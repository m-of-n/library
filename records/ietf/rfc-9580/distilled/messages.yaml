record: rfc-9580
reviewed_by: ""
extracted: "2026-10-13"

# ---------------------------------------------------------------------------
applicability: >-
  RFC 9580 defines a data format, not a wire protocol. There is no transport, no session, no
  handshake and no request/response exchange: every structure here is an octet string that an
  implementation writes to, or reads from, a file, a mail body, a key server response or any
  other carrier the application chooses. The unit of the format is the packet (§4): a header
  carrying a Packet Type ID and a body length, then a body whose layout depends on the type and,
  for most types, on a version octet. Packets are concatenated into the three packet sequences of
  §10 (Transferable Public/Secret Keys, OpenPGP Messages, Detached Signatures); the grammar of
  those sequences is the business of protocol.yaml and state-machine.yaml, and this file defines
  only the structures they are built from. Several packets carry nested structures that are not
  packets: signature subpackets (§5.2.3.7), User Attribute subpackets (§5.12), S2K Specifiers
  (§3.7.1), the algorithm-specific key, signature and session-key fields (§5.1.3-§5.1.7,
  §5.2.3.1-§5.2.3.5, §5.5.5), EC point and scalar encodings (§11.2, §11.3) and the ECDH KDF
  parameter strings (§5.5.5.6, §11.5). Other structures here are never transmitted but are byte
  strings an implementation must build exactly: the data hashed for a signature (§5.2.4), the
  fingerprint input (§5.5.4), the HKDF info and AEAD additional data of v6 SKESK, v2 SEIPD and
  AEAD-protected secret keys (§5.3.2, §5.13.2, §5.5.3), the X25519/X448 HKDF input (§5.1.6,
  §5.1.7), the ECDH key-wrap input and KDF OtherInfo (§11.4, §11.5) and the PKCS#1 encodings
  (§12.1). Those carry encoding: computed. Two structures are text, not binary: ASCII Armor
  (§6) and the Cleartext Signature Framework (§7); their layouts are given as line structures.
  Cryptographic primitives (RSA, DSA, ECDSA, EdDSA, X25519, X448, AES, Camellia, OCB, EAX, GCM,
  HKDF, Argon2, AES Key Wrap, the hash functions) are delegated to the references the source names
  and are out of scope except where OpenPGP fixes a parameter or an input layout. The Trust packet
  body (§5.10) is implementation-defined and has no layout. Keyring storage (§3.6) is out of scope.

# ---------------------------------------------------------------------------
note: >-
  Conventions. (1) Text in double quotes is verbatim from the source (.cache/rfc-9580.txt, sha256
  36540e57...1ff18) with the RFC line wrapping undone: a line break and the indent that follows
  become one space; a word hyphenated at a line end is quoted rejoined. Every quote was checked
  mechanically against the source. Unquoted text is this file's own description. Anything not
  literally stated by the source is prefixed Derived: and names its basis (another section,
  arithmetic, a test vector in Appendix A, or an external specification the source cites).
  (2) source gives the section and source line range of the definition. (3) Field types:
  u8, u16, u32 are 1-, 2- and 4-octet unsigned big-endian scalars (§3.1); u64 is an 8-octet
  big-endian value (used only in §5.13.2); time32 is a u32 count of seconds since 1970-01-01
  00:00:00 UTC (§3.5); MPI is the §3.2 multiprecision integer (u16 bit count, then
  ceil(bits/8) octets); octets[N] is a fixed-length octet string; octets[var] runs to the end of
  the enclosing length; utf8[...] is UTF-8 text (§3.4); keyid is octets[8] (§3.3); fingerprint is
  octets[20] for a version 4 key and octets[32] for a version 6 key (§5.5.4); body-length is the
  1-, 2- or 5-octet OpenPGP-format length (§4.2.1.1-§4.2.1.3); s2k is an S2K Specifier
  (§3.7.1); subpackets is a §5.2.3.7 subpacket data set. (4) required is true, false or
  conditional; conditional fields carry required_when. (5) constrained_by lists
  rfc-9580#R-NNNN ids from distilled/requirements.yaml. Each id is cited on the field it binds
  or, for a rule that binds the structure as a whole, on the entry. A requirement cited on more
  than one entry binds each of them (for example the algorithm deprecations bind both the key and
  the signature or session-key fields of that algorithm). constrained_by_locators names source
  text that binds a field but has no R-id. (6) normative_status: current (generate and accept);
  deprecated (the source says do not generate or avoid, but defines the format for reading);
  obsolete (MUST NOT be generated; read only for historic data); reserved (an ID with no
  format); private (100-110 or 60-63 ranges); computed (never on the wire; built for hashing,
  key derivation or encryption); text (ASCII Armor and Cleartext Signature Framework).
  (7) generate restates the source's Generate? column or BCP 14 rule for that version; it is
  absent where the source says nothing. (8) layout is the octet-level structure, written as
  concatenation (a || b) with each field's width; hex constants are written 0xNN. Example
  octets are cited from Appendix A by line and were re-derived mechanically: the Appendix A
  armored blocks were base64-decoded and split into packets, the v4 and v6 fingerprints
  (A.1, A.3), the v4 and v6 signature hash inputs (A.2, A.6), and the HKDF outputs of A.5.1,
  A.8.2, A.8.4 and A.9.2 were recomputed with Python hashlib/hmac and all match the source.
  (9) Wiring: see wiring at the end of this file for counts and the requirements deliberately
  not wired here.

# ---------------------------------------------------------------------------
# Data element types (§3). Each is cited by the fields that use it.
data_types:
  - id: scalar
    source: "§3.1, lines 544-549"
    definition: >-
      "Scalar numbers are unsigned and always stored in big-endian format." The value of a
      2-octet scalar is ((n[0] << 8) + n[1]); of a 4-octet scalar ((n[0] << 24) + (n[1] << 16) +
      (n[2] << 8) + n[3]).
    widths: [u8, u16, u32]
    notes: >-
      The one exception in the document is the image header length of the Image Attribute
      subpacket, which "due to a historical accident, this value is encoded as a little-endian
      number" (§5.12.1, lines 3927-3929). u64 appears only in §5.13.2 ("an 8-octet, big-endian
      value", line 4169; chunk index "as a big-endian value", line 4183).
  - id: MPI
    source: "§3.2, lines 551-586; §3.2.1, lines 588-596"
    definition: >-
      "An MPI consists of two pieces: a 2-octet scalar that is the length of the MPI in bits,
      followed by a string of octets that contain the actual integer." "The size of an MPI is
      ((MPI.length + 7) / 8) + 2 octets." "The length field of an MPI describes the length
      starting from its most significant non-zero bit."
    layout: "u16 bitlen || octets[(bitlen + 7) / 8], big-endian, no leading zero octet"
    examples:
      - "[00 00] = 0; [00 01 01] = 1; [00 09 01 FF] = 511 (lines 568-572)"
      - "[00 02 01] is not formed correctly; it should be [00 01 01] (lines 579-580)"
    constraints: >-
      Version 6 Key, Signature and PKESK packets: the bit length must match the most significant
      non-zero bit or the packet is rejected as malformed. Unused bits must be zero. For other
      packet versions the check is not required (Derived: R-0003 names only version 6 packets).
    constrained_by:
      - rfc-9580#R-0003
      - rfc-9580#R-0004
    notes: >-
      §3.2.1: MPIs also carry EC points (§11.2) and fixed-length octet strings (§11.3); the wire
      form is the same: "2 octets of length in bits counted from the first non-zero bit,
      followed by the smallest series of octets that can represent the value while stripping
      off any leading zero octets." Derived: the zero MPI is [00 00] with no value octets.
  - id: keyid
    source: "§3.3, lines 598-605; §5.5.4, lines 3318-3344"
    definition: >-
      "A Key ID is an 8-octet scalar that identifies a key." Computation per key version is in
      fingerprint-and-keyid below.
    constrained_by:
      - rfc-9580#R-0005
  - id: text
    source: "§3.4, lines 607-610"
    definition: >-
      "Unless otherwise specified, the character set for text is the UTF-8 [RFC3629] encoding of
      Unicode [ISO10646]."
    notes: >-
      Derived: no text field in a packet is null-terminated except the Regular Expression
      subpacket (§5.2.3.22); every other text field's length is given by an enclosing length
      (packet length, subpacket length or a 1-octet or 2-octet length prefix).
  - id: time32
    source: "§3.5, lines 612-615"
    definition: >-
      "A time field is an unsigned 4-octet number containing the number of seconds elapsed since
      midnight, 1 January 1970 UTC."
    notes: >-
      The Key Expiration Time and Signature Expiration Time subpackets are labelled "(4-octet
      time field)" but hold a duration in seconds (SD-M05).
  - id: body-length
    source: "§4.2.1, lines 1005-1049; §5.2.3.7, lines 1880-1896; §5.12, lines 3893-3901"
    definition: >-
      The OpenPGP-format length: first octet < 192: one octet, value = octet; 192..223: two
      octets, value = ((o1 - 192) << 8) + o2 + 192; 255: five octets, value = u32 of octets 2-5.
      "This basic set of 1-octet, 2-octet, and 5-octet lengths is also used internally to some
      packets." (signature subpacket lengths and User Attribute subpacket lengths).
    ranges:
      one-octet: "0..191"
      two-octet: "192..8383 (first octet 0xC0..0xDF)"
      five-octet: "0..4294967295 (first octet 0xFF)"
    notes: >-
      In a packet header the first-octet range 224..254 is a Partial Body Length (packet-length
      below). In a signature subpacket length the source's decoding rule maps every first octet
      from 192 to 254 to the two-octet form (§5.2.3.7, lines 1890-1892), so 224..254 have no
      partial meaning there; Derived: a two-octet subpacket length with first octet 224..254
      decodes to 8384..16319, a value the packet-header two-octet form (192..223) cannot
      express (SD-M06).
  - id: checksum16
    source: "§5.1.3, lines 1335-1336; §5.5.3, lines 3296-3298; §3.7.2.1, lines 836-837"
    definition: >-
      "the sum of all octets in x mod 65536" stored as u16. Used for the session-key checksum in
      RSA, Elgamal and ECDH PKESK plaintexts and for the deprecated secret-key checksum.

# ---------------------------------------------------------------------------
# Encoding rules that apply across structures.
encoding_rules:
  - id: ENC-01
    rule: packet boundaries come only from the packet header
    source: "§4.1, lines 941-955"
    text: >-
      "When handling a stream of packets, the length information in each packet header is the
      canonical source of packet boundaries." A subfield length that points outside the packet
      makes the packet malformed; octets outside the header's range are not packet contents.
    constrained_by:
      - rfc-9580#R-0020
      - rfc-9580#R-0021
      - rfc-9580#R-0022
  - id: ENC-02
    rule: unwrapped streams are parsed as fresh packet streams bounded by the unwrapped length
    source: "§10.3.1, lines 5400-5424"
    text: >-
      "When any unwrapping is performed, the resulting stream of octets is parsed into a series
      of OpenPGP packets like any other stream of octets." Applies to the plaintext of SED,
      v1 SEIPD and v2 SEIPD and to decompressed Compressed Data.
    constrained_by:
      - rfc-9580#R-0331
      - rfc-9580#R-0332
      - rfc-9580#R-0333
      - rfc-9580#R-0334
      - rfc-9580#R-0335
  - id: ENC-03
    rule: Packet Type ID in OpenPGP-format encoding, as used inside derived byte strings
    source: "§5.3.2, lines 2985-2987; §5.5.3, lines 3275-3277; §5.13.2, lines 4136-4138"
    text: >-
      HKDF info and AEAD additional data begin with "the Packet Type ID in OpenPGP format
      encoding (bits 7 and 6 are set, and bits 5-0 carry the Packet Type ID)". Derived: 0xC3
      for SKESK (3), 0xC5 Secret Key (5), 0xC7 Secret Subkey (7), 0xD2 SEIPD (18); the source
      confirms 0xC3 (line 2998), 0xC5 and 0xC7 (lines 3289, 3292) and 0xD2 (line 4163).
  - id: ENC-04
    rule: CFB mode
    source: "§12.9, lines 6227-6233"
    text: >-
      "The CFB segment size s is equal to the block size of the cipher (i.e., n-bit CFB mode,
      where n is the block size used)." Used by SED, v1 SEIPD, v4 SKESK session-key encryption
      and CFB-protected secret keys.
    constrained_by:
      - rfc-9580#R-0399
  - id: ENC-05
    rule: Private or Experimental ranges
    source: "§12.10, lines 6235-6246; §9, lines 4629-4632"
    text: >-
      S2K Specifier types, Signature Subpacket Type IDs, User Attribute Subpacket Type IDs, image
      format IDs and the Section 9 algorithm IDs reserve 100 to 110; Packet Type IDs reserve 60
      to 63. An implementation may implement an algorithm not in the tables "as long as the
      algorithm IDs are chosen from the Private or Experimental Use algorithm range."
    constrained_by:
      - rfc-9580#R-0276
  - id: ENC-06
    rule: no symmetric algorithm 0 for encrypted data, no compression algorithm 0 in a Compressed Data packet
    source: "§12.2.1, lines 6101-6107; §12.3.1.1, lines 6129-6135"
    text: >-
      Symmetric algorithm 0, plaintext, "may only be used to denote secret keys that are stored
      in the clear." Compression algorithm 0, uncompressed, "may only be used to denote a
      preference for uncompressed data."
    constrained_by:
      - rfc-9580#R-0377
      - rfc-9580#R-0380

# ---------------------------------------------------------------------------
messages:

  # ======================= §4 packet framing =======================

  - name: packet
    source: "§4.1, lines 928-955; §4.2, lines 957-1003"
    normative_status: current
    encoding: binary
    description: >-
      "Each packet consists of a packet header, followed by the packet body. The packet header is
      of variable length." The first header octet selects the OpenPGP or Legacy format and carries
      the Packet Type ID; the rest of the header is the body length.
    fields:
      - name: header
        type: packet-header-openpgp | packet-header-legacy
        required: true
        constraints: >-
          Bit 7 of the first octet is always one; bit 6 selects the format (one: OpenPGP, zero:
          Legacy). Derived: a first octet with bit 7 clear is not a packet header; the source
          gives no rule for it beyond ENC-01.
        constrained_by:
          - rfc-9580#R-0023
          - rfc-9580#R-0024
          - rfc-9580#R-0025
      - name: body
        type: octets[body length]
        required: true
        constraints: >-
          Layout by Packet Type ID (packet_types). "An implementation MUST NOT interpret octets
          outside the range indicated in the packet header as part of the contents of the
          packet."
        constrained_by:
          - rfc-9580#R-0021
          - rfc-9580#R-0022
    constrained_by:
      - rfc-9580#R-0020
      - rfc-9580#R-0032
      - rfc-9580#R-0033
    layout: >-
      header (1 to 6 octets) || body. "the total length of the packet is the length of the
      header(s) plus the length of the body" (§4.2.3, lines 1131-1133); with partial lengths the
      body is interleaved with further length headers (packet-length-openpgp).

  - name: packet-header-openpgp
    source: "§4.2, lines 969-979 and 986-1003; §4.2.1, lines 1005-1074"
    normative_status: current
    encoding: binary
    fields:
      - name: first-octet
        type: u8
        required: true
        constraints: >-
          Bit 7 = 1, bit 6 = 1, bits 5-0 = Packet Type ID (0..63). "the OpenPGP format headers can
          encode IDs as great as 63." Derived: first octet = 0xC0 | type.
        constrained_by:
          - rfc-9580#R-0034
      - name: length
        type: packet-length-openpgp
        required: true
    layout: >-
      0b11tttttt || length, where length is 1, 2 or 5 octets, or a Partial Body Length octet
      followed by a body portion and further length headers. Examples (Appendix A): 0xC6 Public
      Key, 0xC2 Signature, 0xCE Public Subkey (A.3, decoded); 0xC5, 0xC7 Secret Key and Secret
      Subkey (A.4); 0xC1 PKESK, 0xD2 SEIPD (A.8.1 line 8118, A.8.3 line 8198); 0xC3 SKESK (A.9.1
      line 8313); 0xC4 OPS, 0xCB Literal Data (A.7, decoded).

  - name: packet-header-legacy
    source: "§4.2, lines 980-1003; §4.2.2, lines 1076-1098"
    normative_status: deprecated
    generate: >-
      "The Legacy packet format SHOULD NOT be used to generate new data, unless the recipient is
      known to only support the Legacy packet format." Compressed Data and Literal Data MUST NOT
      be generated with it (R-0203, R-0204, R-0219, R-0220).
    encoding: binary
    fields:
      - name: first-octet
        type: u8
        required: true
        constraints: >-
          Bit 7 = 1, bit 6 = 0, bits 5-2 = Packet Type ID, bits 1-0 = length-type. "Legacy format
          headers only have 4 bits for the Packet Type ID and hence can only encode Packet Type
          IDs less than 16". Derived: first octet = 0x80 | (type << 2) | length-type.
        constrained_by:
          - rfc-9580#R-0023
          - rfc-9580#R-0024
          - rfc-9580#R-0025
      - name: length
        type: "u8 | u16 | u32 | absent"
        required: conditional
        required_when: >-
          length-type 0: 1-octet length, header 2 octets; 1: 2-octet length, header 3 octets;
          2: 4-octet length, header 5 octets; 3: no length field, header 1 octet, indeterminate
          length ("If the packet is in a file, it means that the packet extends until the end of
          the file.").
        constraints: >-
          "An implementation MUST NOT generate a Legacy format packet with indeterminate length."
          It MAY interpret one for historic data.
        constrained_by:
          - rfc-9580#R-0030
          - rfc-9580#R-0031
    layout: >-
      0b10ttttll || (u8 | u16 | u32 | nothing). Example: the A.1 hex dump and the A.2 packet use
      Legacy headers 0x98 0x33 (Public Key, length-type 0, length 51; line 7601) and 0x88 0x5E
      (Signature, length-type 0, length 94; line 7635; its armored form, lines 7644-7648, decodes
      to the same 0x88 0x5E). The A.1 armored form (lines 7608-7612), which the source calls "The
      same packet", decodes to the OpenPGP-format header 0xC6 0x33 over the same 51-octet body
      (SD-M31).
    notes: >-
      Derived: the constants 0x99 (v4 key hashing and fingerprint), 0x88 (Third-Party
      Confirmation hashing) and 0xB4 (User ID certification hashing) are Legacy-format first
      octets: 0x99 = Public Key with length-type 1, 0x88 = Signature with length-type 0, 0xB4 =
      User ID with length-type 0. 0x9B (v6 key hashing) is Public Key with length-type 3, yet a
      4-octet length follows it, and 0xD1 (User Attribute certification hashing) is an
      OpenPGP-format first octet for type 17. They are hashing constants, not headers (SD-M08).

  - name: packet-length-openpgp
    source: "§4.2.1, lines 1005-1021; §4.2.1.1-§4.2.1.4, lines 1023-1074; §4.2.3, lines 1100-1133"
    normative_status: current
    encoding: binary
    fields:
      - name: one-octet
        type: u8
        required: conditional
        required_when: first octet < 192
        constraints: "bodyLen = 1st_octet; encodes 0 to 191."
      - name: two-octet
        type: octets[2]
        required: conditional
        required_when: first octet 192..223
        constraints: "bodyLen = ((1st_octet - 192) << 8) + (2nd_octet) + 192; encodes 192 to 8383."
      - name: five-octet
        type: "0xFF || u32"
        required: conditional
        required_when: first octet 255
        constraints: >-
          bodyLen = (2nd_octet << 24) | (3rd_octet << 16) | (4th_octet << 8) | 5th_octet;
          encodes up to 4,294,967,295.
      - name: partial
        type: u8
        required: conditional
        required_when: first octet 224..254
        constraints: >-
          "partialBodyLen = 1 << (1st_octet & 0x1F);" a power of 2 from 1 to 2^30. Each partial
          length header is followed by that many body octets and then another length header
          (1-octet, 2-octet, 5-octet or partial). "The last length header in the packet MUST NOT
          be a Partial Body Length header." "Note also that the last Body Length header can be a
          zero-length header." "The first partial length MUST be at least 512 octets long."
          Partial lengths are for data packets only: "Partial Body Lengths MUST NOT be used for
          any other packet types."
        constrained_by:
          - rfc-9580#R-0026
          - rfc-9580#R-0027
          - rfc-9580#R-0028
          - rfc-9580#R-0029
    layout: >-
      Definite: one of the three forms, then bodyLen octets. Partial: (P_i || portion_i of
      2^(P_i & 0x1F) octets)+ || L || last portion of L octets, where P_i in 0xE0..0xFE and L is
      a 1-, 2- or 5-octet length. Examples (§4.2.3): 100 = 0x64; 1723 = 0xC5 0xFB; 100000 = 0xFF
      0x00 0x01 0x86 0xA0, or 0xEF (32768 octets), 0xE1 (2), 0xE0 (1), 0xF0 (65536), 0xC5 0xDD
      (1693).
    notes: >-
      Derived: the packet types that may use partial lengths are the data packets the source
      lists, "whether they are literal, compressed, or encrypted" (Literal Data 11, Compressed
      Data 8, SED 9, SEIPD 18); the source does not enumerate encrypted types by ID. Derived:
      0xE0 is a partial length of 1 octet and 0xFF is never a partial length; a Legacy header
      cannot carry partial lengths (its indeterminate form, length-type 3, is the Legacy
      analogue and is not generated). Derived arithmetic check: 0xC5 0xFB = ((197-192)<<8)+251+192
      = 1723, and 0xC5 0xDD = 1693; 32768 + 2 + 1 + 65536 + 1693 = 100000.

  # ======================= §5 Table 3 packet types: reserved and unassigned =======================

  - name: packet-type-0-reserved
    packet_type: 0
    source: "§5 Table 3, lines 1154-1156"
    normative_status: reserved
    critical: true
    description: "Reserved - this Packet Type ID MUST NOT be used"
    fields: []
    constrained_by:
      - rfc-9580#R-0034
    notes: >-
      Derived: being critical (§4.3), a packet of type 0 in a sequence is an unknown critical
      packet, so the whole sequence is rejected (R-0032, R-0311).

  - name: packet-type-15-16-unlisted
    packet_type: "15, 16"
    source: "§5 Table 3, lines 1200-1205; §4.3, lines 1143-1144"
    normative_status: reserved
    critical: true
    description: >-
      Table 3 has no row for 15 or 16 (it jumps from 14 Public Subkey to 17 User Attribute).
      Derived: by §4.3 "Packets with Type IDs from 0 to 39 are critical", so they are critical and
      unknown; see SD-M01.
    fields: []
    constrained_by:
      - rfc-9580#R-0032

  - name: packet-type-19-reserved-mdc
    packet_type: 19
    source: "§5 Table 3, lines 1211-1214; Appendix B.1, lines 9040-9046"
    normative_status: reserved
    critical: true
    description: >-
      Table 3 row: Reserved (formerly Modification Detection Code Packet). The MDC is now intrinsic to the
      v1 SEIPD plaintext (seipd-v1). Derived: the two constant octets 0xD3 0x14 that precede the
      MDC hash in v1 SEIPD plaintext are an OpenPGP-format header for type 19 with length 20.
    fields: []
    constrained_by:
      - rfc-9580#R-0032

  - name: packet-type-20-reserved
    packet_type: 20
    source: "§5 Table 3, line 1216"
    normative_status: reserved
    critical: true
    description: "Reserved"
    fields: []
    constrained_by:
      - rfc-9580#R-0032

  - name: packet-type-22-39-unassigned-critical
    packet_type: "22-39"
    source: "§5 Table 3, lines 1221-1222; §4.3, lines 1135-1144"
    normative_status: reserved
    critical: true
    description: "Unassigned Critical Packets"
    fields: []
    constrained_by:
      - rfc-9580#R-0032
      - rfc-9580#R-0309
      - rfc-9580#R-0310
      - rfc-9580#R-0311

  - name: packet-type-40-59-unassigned-non-critical
    packet_type: "40-59"
    source: "§5 Table 3, lines 1224-1225; §4.3, lines 1135-1144; §10, lines 5154-5161"
    normative_status: reserved
    critical: false
    description: >-
      "Unassigned Non-Critical Packets". "unknown non-critical packets can appear anywhere within
      any sequence." Derived: only the OpenPGP header format can carry these IDs (Legacy carries
      IDs below 16).
    fields: []
    constrained_by:
      - rfc-9580#R-0033
      - rfc-9580#R-0309

  - name: packet-type-60-63-private
    packet_type: "60-63"
    source: "§5 Table 3, lines 1227-1228; §12.10, lines 6240-6242"
    normative_status: private
    critical: false
    description: "Private or Experimental Use"
    fields: []
    constrained_by:
      - rfc-9580#R-0033

  # ======================= §5.1 PKESK (Type ID 1) =======================

  - name: pkesk-v3
    packet_type: 1
    shorthand: PKESK
    version: 3
    source: "§5.1, lines 1238-1260; §5.1.1, lines 1262-1291; §5.1.8, lines 1456-1462"
    normative_status: current
    generate: >-
      Yes, only ahead of a v1 SEIPD payload (Table 26 row "v1 SEIPD | v4 SKESK | v3 PKESK | Yes").
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 3
        required: true
        constrained_by:
          - rfc-9580#R-0035
          - rfc-9580#R-0337
          - rfc-9580#R-0338
          - rfc-9580#R-0340
          - rfc-9580#R-0341
          - rfc-9580#R-0342
          - rfc-9580#R-0343
      - name: key-id
        type: keyid
        required: true
        constraints: >-
          The Key ID of the recipient public key; for a subkey, the subkey's Key ID. "The Key ID
          may also be all zeros, for an "anonymous recipient"" (§5.1.8), in which case the
          receiver tries all available private keys.
        constrained_by:
          - rfc-9580#R-0042
          - rfc-9580#R-0005
      - name: public-key-algorithm
        type: u8
        required: true
        constraints: >-
          Table 18 ID of an encryption-capable algorithm: 1 RSA, 2 RSA Encrypt-Only, 16 Elgamal,
          18 ECDH, 25 X25519, 26 X448 (Derived: the algorithms with a PKESK Format column entry).
      - name: encrypted-session-key
        type: octets[var]
        required: true
        constraints: >-
          "A series of values comprising the encrypted session key. This is algorithm specific
          and described below." See pkesk-fields-rsa, -elgamal, -ecdh, -x25519, -x448. For v3 the
          public-key algorithm is passed the session key and "The 1-octet algorithm identifier
          that specifies the symmetric key encryption algorithm used to encrypt the v1 SEIPD
          packet".
    layout: >-
      0x03 || keyid (8) || pkalgo (1) || algorithm-specific fields (to end of body).
    notes: >-
      The symmetric algorithm ID reaches the recipient inside the encrypted plaintext for RSA,
      Elgamal and ECDH, and in the clear, prepended to the wrapped key, for X25519 and X448
      (§5.1.6, §5.1.7). In historic data a v3 PKESK may precede a SED packet (§5.1.1); the source's
      wording "used to encrypt the v1 SEIPD packet" does not cover that case (SD-M28).

  - name: pkesk-v6
    packet_type: 1
    shorthand: PKESK
    version: 6
    source: "§5.1, lines 1238-1260; §5.1.2, lines 1293-1321; §5.1.8, lines 1456-1462"
    normative_status: current
    generate: >-
      Yes, only ahead of a v2 SEIPD payload (Table 26 row "v2 SEIPD | v6 SKESK | v6 PKESK | Yes").
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 6
        required: true
        constrained_by:
          - rfc-9580#R-0036
          - rfc-9580#R-0337
          - rfc-9580#R-0339
          - rfc-9580#R-0341
          - rfc-9580#R-0342
          - rfc-9580#R-0343
      - name: recipient-length
        type: u8
        required: true
        constraints: >-
          "A 1-octet size of the following two fields. This size may be zero, if the key version
          number field and the fingerprint field are omitted for an "anonymous recipient"".
          Derived: the values in use are 0, 21 (v4 recipient: 1 + 20) and 33 (v6 recipient:
          1 + 32); Appendix A.8.1 has 0x21 (line 8121).
        constrained_by:
          - rfc-9580#R-0042
      - name: key-version
        type: u8
        required: conditional
        required_when: recipient-length > 0
        constraints: >-
          "A 1-octet key version number." Derived: 4 or 6, the versions with a defined fingerprint.
      - name: fingerprint
        type: fingerprint
        required: conditional
        required_when: recipient-length > 0
        constraints: >-
          "The fingerprint of the public key or subkey to which the session key is encrypted.
          Note that the length N of the fingerprint for a version 4 key is 20 octets; for a
          version 6 key, N is 32."
      - name: public-key-algorithm
        type: u8
        required: true
        constraints: >-
          As for pkesk-v3. Elgamal (16) is excluded: "An implementation MUST NOT generate
          ElGamal v6 PKESK packets."
        constrained_by:
          - rfc-9580#R-0039
      - name: encrypted-session-key
        type: octets[var]
        required: true
        constraints: >-
          Algorithm-specific fields. "No symmetric key encryption algorithm identifier is passed
          to the public key algorithm for a v6 PKESK packet, as it is included in the v2 SEIPD
          packet."
    layout: >-
      0x06 || n (1) || [ keyver (1) || fingerprint (n - 1) ] || pkalgo (1) || algorithm-specific
      fields. Appendix A.8.1 (lines 8118-8138): c1 5d | 06 | 21 | 06 | 12c83f...930885 (32) | 19
      (X25519) | 87cf...6764 (32, ephemeral) | 18 | dea355...3ab7 (24, wrapped key).
    notes: >-
      Derived: a v4 recipient key is addressable by a v6 PKESK (key-version 4, 20-octet
      fingerprint); nothing in §5.1.2 restricts the recipient key version.

  - name: pkesk-fields-rsa
    applies_to: "pkesk-v3, pkesk-v6; public-key-algorithm 1 or 2"
    source: "§5.1.3, lines 1323-1347; Table 18 rows 1-2, lines 4645-4654"
    normative_status: deprecated
    generate: >-
      RSA keys "SHOULD NOT be generated" (R-0279); RSA Encrypt-Only (2) "MUST NOT be generated"
      (R-0280). Encrypting to RSA keys under 2048 bits is forbidden (R-0386).
    encoding: binary
    fields:
      - name: m^e-mod-n
        type: MPI
        required: true
        constraints: >-
          "MPI of RSA-encrypted value m^e mod n." m is the EME-PKCS1-v1_5 encoding
          (eme-pkcs1-v1_5) of pkcs1-session-key-plaintext.
        constrained_by:
          - rfc-9580#R-0037
          - rfc-9580#R-0279
          - rfc-9580#R-0280
          - rfc-9580#R-0382
          - rfc-9580#R-0383
          - rfc-9580#R-0384
          - rfc-9580#R-0385
          - rfc-9580#R-0386
          - rfc-9580#R-0387
          - rfc-9580#R-0003
    layout: "MPI(m^e mod n)"

  - name: pkesk-fields-elgamal
    applies_to: "pkesk-v3 only (v6 forbidden); public-key-algorithm 16"
    source: "§5.1.4, lines 1349-1377; Table 18 row 16, lines 4660-4667"
    normative_status: deprecated
    generate: >-
      "An implementation MUST NOT encrypt using Elgamal keys." (R-0391); "An implementation MUST
      NOT generate ElGamal v6 PKESK packets." (R-0039).
    encoding: binary
    fields:
      - name: g^k-mod-p
        type: MPI
        required: true
        constraints: "MPI of Elgamal (Diffie-Hellman) value g^k mod p."
      - name: m*y^k-mod-p
        type: MPI
        required: true
        constraints: >-
          "MPI of Elgamal (Diffie-Hellman) value m * y^k mod p." m is the EME-PKCS1-v1_5
          encoding of pkcs1-session-key-plaintext.
        constrained_by:
          - rfc-9580#R-0038
    constrained_by:
      - rfc-9580#R-0039
      - rfc-9580#R-0281
      - rfc-9580#R-0390
      - rfc-9580#R-0391
      - rfc-9580#R-0392
    layout: "MPI(g^k mod p) || MPI(m * y^k mod p)"

  - name: pkcs1-session-key-plaintext
    applies_to: "pkesk-fields-rsa, pkesk-fields-elgamal (the message M input to EME-PKCS1-v1_5)"
    source: "§5.1.3, lines 1327-1342; §5.1.4, lines 1355-1370"
    normative_status: computed
    encoding: computed
    fields:
      - name: symmetric-algorithm
        type: u8
        required: conditional
        required_when: pkesk-v3 ("if it was passed (in the case of a v3 PKESK packet)")
        constrained_by:
          - rfc-9580#R-0289
          - rfc-9580#R-0377
      - name: session-key
        type: octets[key size of the symmetric algorithm]
        required: true
      - name: checksum
        type: checksum16
        required: true
        constraints: >-
          "A 2-octet checksum of the session key, equal to the sum of the session key octets,
          modulo 65536."
    layout: "[symalgo (1)] || session key || u16 checksum; then EME-PKCS1-v1_5 encoded to k octets"
    constrained_by:
      - rfc-9580#R-0037
      - rfc-9580#R-0038

  - name: eme-pkcs1-v1_5
    source: "§12.1.1, lines 5961-5988; §12.1.2, lines 5990-6013; §13.5, lines 6437-6462"
    normative_status: computed
    encoding: computed
    fields:
      - name: lead
        type: octets[2]
        value: "0x00 0x02"
        required: true
      - name: PS
        type: "octets[k - mLen - 3], each non-zero"
        required: true
        constraints: >-
          "Generate an octet string PS of length k - mLen - 3 consisting of pseudorandomly
          generated non-zero octets. The length of PS will be at least 8 octets."
        constrained_by:
          - rfc-9580#R-0364
      - name: separator
        type: u8
        value: "0x00"
        required: true
      - name: M
        type: octets[mLen]
        required: true
        constraints: >-
          mLen <= k - 11; "If mLen > k - 11, output "message too long" and stop."
        constrained_by:
          - rfc-9580#R-0363
    layout: "EM = 0x00 || 0x02 || PS || 0x00 || M, k octets (k = modulus length in octets)"
    constrained_by:
      - rfc-9580#R-0365
      - rfc-9580#R-0366
      - rfc-9580#R-0367
      - rfc-9580#R-0403
    notes: >-
      Decoding rejects with "decryption error" if octet 1 is not 0x00, octet 2 is not 0x02, no
      0x00 separator exists, or PS is shorter than 8 octets. §13.5 asks for padding checks that
      are strict, robust and constant time.

  - name: pkesk-fields-ecdh
    applies_to: "pkesk-v3, pkesk-v6; public-key-algorithm 18"
    source: "§5.1.5, lines 1379-1386; §11.5, lines 5748-5909; Table 18 row 18, lines 4675-4688"
    normative_status: current
    encoding: binary
    fields:
      - name: ephemeral-point
        type: MPI (EC point)
        required: true
        constraints: >-
          "MPI of an EC point representing an ephemeral public key in the point format associated
          with the curve as specified in Section 9.2." SEC1 for the NIST and brainpool curves,
          prefixed native for Curve25519Legacy (Table 20). Never the point at infinity.
        constrained_by:
          - rfc-9580#R-0350
          - rfc-9580#R-0351
          - rfc-9580#R-0003
      - name: wrapped-key-length
        type: u8
        required: true
        constraints: >-
          "One octet encoding the size in octets of the result of the key wrapping method; the
          value 255 is reserved for future extensions."
      - name: wrapped-key
        type: "octets[wrapped-key-length], at most 254"
        required: true
        constraints: >-
          AES Key Wrap (RFC 3394, default IV) under the KDF output (ecdh-kdf) of
          ecdh-key-wrap-input. "Note that for session key sizes 128, 192, and 256 bits, the size
          of the result of the key wrapping method is, respectively, 32, 40, and 48 octets, unless
          size obfuscation is used."
        constrained_by:
          - rfc-9580#R-0353
          - rfc-9580#R-0354
          - rfc-9580#R-0355
          - rfc-9580#R-0360
          - rfc-9580#R-0362
    layout: "MPI(ephemeral point V) || len(C) (1) || C"
    notes: >-
      Derived: §5.1.5 calls the second field "A 1-octet size, followed by a symmetric key
      encoded using the method described in Section 11.5"; §11.5 output is "(MPI(VB) || len(C) ||
      C)" (line 5903). Curve25519Legacy is forbidden for v6 keys (R-0198, R-0286), so a v6 PKESK
      with ECDH uses a SEC1 curve.

  - name: ecdh-key-wrap-input
    applies_to: pkesk-fields-ecdh
    source: "§11.5, lines 5816-5871"
    normative_status: computed
    encoding: computed
    fields:
      - name: symmetric-algorithm
        type: u8
        required: conditional
        required_when: pkesk-v3
        constrained_by:
          - rfc-9580#R-0289
          - rfc-9580#R-0377
      - name: session-key
        type: octets[key size]
        required: true
      - name: checksum
        type: checksum16
        required: true
      - name: padding
        type: "octets[p], each octet = p"
        required: true
        constraints: >-
          "the above values are padded to an 8-octet granularity using the method described in
          [RFC8018]." Larger padding is permitted to hide the key size: 21, 13 and 5 octets (v3)
          or 22, 14 and 6 octets (v6) for AES-128, AES-192 and AES-256 to reach 40 octets.
        constrained_by:
          - rfc-9580#R-0356
          - rfc-9580#R-0357
    layout: >-
      v3: symalgo || k0..kn || s0 s1 || pad; example AES-256: 09 k0 k1 ... k31 s0 s1 05 05 05 05 05
      (40 octets, line 5834). v6: k0..kn || s0 s1 || pad; example AES-256: k0 k1 ... k31 s0 s1 06
      06 06 06 06 06 (40 octets, line 5849).
    notes: >-
      Derived arithmetic check: v3 AES-128/192/256 plaintexts are 19, 27, 35 octets, + 21/13/5 =
      40; v6 are 18, 26, 34, + 22/14/6 = 40; without obfuscation they pad to 24, 32, 40 and wrap
      to 32, 40, 48, as the source states. The 21-, 22-, 13- and 14-octet paddings exceed the 1
      to 8 octets of the RFC 8018 padding method the source cites (SD-M19).

  - name: ecdh-kdf-param
    applies_to: "pkesk-fields-ecdh (KDF OtherInfo); computed, not transmitted"
    source: "§11.5, lines 5763-5807 and 5885-5890"
    normative_status: computed
    encoding: computed
    fields:
      - name: curve-oid-length
        type: u8
        required: true
      - name: curve-oid
        type: octets[curve-oid-length]
        required: true
        constraints: The truncated DER OID of Table 19 (curve-oid).
      - name: public-key-algorithm
        type: u8
        value: 18
        required: true
      - name: kdf-params
        type: ecdh-kdf-params
        required: true
        constraints: "identical to the corresponding field in the ECDH public key"
      - name: anonymous-sender
        type: octets[20]
        value: "41 6E 6F 6E 79 6D 6F 75 73 20 53 65 6E 64 65 72 20 20 20 20"
        required: true
        constraints: >-
          "20 octets representing the UTF-8 encoding of the string "Anonymous Sender" padded at
          the end with spaces (0x20) to 20 octets"
      - name: recipient-fingerprint
        type: fingerprint
        required: true
        constraints: >-
          "the fingerprint of the recipient encryption subkey identifying the key material that
          is needed for decryption. For version 4 keys, this field is 20 octets. For version 6
          keys, this field is 32 octets."
    layout: >-
      Param = curve_OID_len || curve_OID || public_key_alg_ID || 03 || 01 || KDF_hash_ID ||
      KEK_alg_ID || "Anonymous Sender" (20) || recipient_fingerprint. Total for a v4 recipient:
      54 (NIST P-256), 51 (P-384, P-521), 55 (brainpool), 56 (Curve25519Legacy); for v6: 66, 63,
      67.
    notes: >-
      Derived arithmetic check: 1 + OID length (8, 5, 9, 10) + 1 + 4 + 20 + 20 = 54, 51, 55, 56;
      + 12 for a 32-octet fingerprint = 66, 63, 67. The source lists no v6 size for
      Curve25519Legacy, consistent with R-0198. The source says the recipient "encryption
      subkey" but the key may be a primary key; Derived: the fingerprint is that of the key
      whose ECDH public key is used.

  - name: ecdh-kdf
    applies_to: pkesk-fields-ecdh
    source: "§11.4, lines 5720-5746; §11.5, lines 5892-5896"
    normative_status: computed
    encoding: computed
    fields:
      - name: counter
        type: octets[4]
        value: "00 00 00 01"
        required: true
      - name: ZB
        type: octets[fsize]
        required: true
        constraints: >-
          The x coordinate of the shared point S: "ZB = x;", "the compact representation of X as
          defined in Section 4.2 of [RFC6090]".
      - name: Param
        type: ecdh-kdf-param
        required: true
    layout: >-
      MB = Hash(00 || 00 || 00 || 01 || ZB || Param); Z = leftmost oBits of MB, oBits = the KEK
      key size (Z_len). Hash is the KDF hash of ecdh-kdf-params; oBits <= hBits.
    constrained_by:
      - rfc-9580#R-0352
      - rfc-9580#R-0353
      - rfc-9580#R-0302
    notes: >-
      For Curve25519Legacy the shared secret is an X25519 output, not an (x, y) point; the source
      does not say what ZB is for that curve (SD-M20).

  - name: pkesk-fields-x25519
    applies_to: "pkesk-v3, pkesk-v6; public-key-algorithm 25"
    source: "§5.1.6, lines 1388-1420; Table 18 row 25, lines 4726-4734"
    normative_status: current
    encoding: binary
    fields:
      - name: ephemeral-public-key
        type: octets[32]
        required: true
        constraints: "32 octets representing an ephemeral X25519 public key."
      - name: length
        type: u8
        required: true
        constraints: "A 1-octet size of the following fields."
      - name: symmetric-algorithm
        type: u8
        required: conditional
        required_when: pkesk-v3
        constraints: >-
          In the clear: "the symmetric algorithm ID is not encrypted. Instead, it is prepended to
          the encrypted session key in plaintext. In this case, the symmetric algorithm used MUST
          be AES-128, AES-192, or AES-256 (algorithm IDs 7, 8, or 9, respectively)."
        constrained_by:
          - rfc-9580#R-0040
      - name: encrypted-session-key
        type: octets[var]
        required: true
        constraints: >-
          AES-128 key wrap (RFC 3394) of the bare session key under the HKDF output of
          x25519-hkdf-input; "no checksum or padding are appended to the session key before key
          wrapping."
    layout: >-
      eph (32) || n (1) || [symalgo (1)] || wrapped key (n or n - 1). A.8.1: n = 0x18, 24-octet
      wrapped key of a 16-octet AES-128 session key in a v6 PKESK.
    constrained_by:
      - rfc-9580#R-0277
    notes: >-
      Derived: n counts the optional algorithm octet; wrapped length = session key length + 8
      (RFC 3394), so 24, 32 or 40 octets for AES-128/192/256.

  - name: x25519-hkdf-input
    applies_to: pkesk-fields-x25519
    source: "§5.1.6, lines 1399-1412"
    normative_status: computed
    encoding: computed
    fields:
      - name: ephemeral-public-key
        type: octets[32]
        required: true
      - name: recipient-public-key
        type: octets[32]
        required: true
      - name: shared-secret
        type: octets[32]
        required: true
    layout: >-
      HKDF-SHA256(IKM = eph || recipient public key || X25519 shared secret, salt = none, info =
      "OpenPGP X25519") -> 16-octet AES-128 KEK. A.8.2: HKDF output f6 6d ad cf f6 45 92 23 9b 25
      45 39 b6 4f f6 07 (line 8171), recomputed.
    notes: >-
      Derived: the HKDF output length is the AES-128 key size, 16 octets; the source names the
      cipher (AES-128 key wrap) but not the HKDF L parameter.

  - name: pkesk-fields-x448
    applies_to: "pkesk-v3, pkesk-v6; public-key-algorithm 26"
    source: "§5.1.7, lines 1422-1454; Table 18 row 26, lines 4735-4743"
    normative_status: current
    encoding: binary
    fields:
      - name: ephemeral-public-key
        type: octets[56]
        required: true
      - name: length
        type: u8
        required: true
      - name: symmetric-algorithm
        type: u8
        required: conditional
        required_when: pkesk-v3
        constraints: In the clear; must be 7, 8 or 9.
        constrained_by:
          - rfc-9580#R-0041
      - name: encrypted-session-key
        type: octets[var]
        required: true
        constraints: >-
          AES-256 key wrap of the bare session key under HKDF-SHA512(IKM = eph (56) || recipient
          public key (56) || shared secret (56), no salt, info "OpenPGP X448").
    layout: "eph (56) || n (1) || [symalgo (1)] || wrapped key"
    constrained_by:
      - rfc-9580#R-0278
    notes: >-
      Derived: the HKDF output is 32 octets, the AES-256 key size; not stated by the source.

  # ======================= §5.2 Signature (Type ID 2) =======================

  - name: signature-v3
    packet_type: 2
    shorthand: SIG
    version: 3
    source: "§5.2, lines 1464-1484; §5.2.2, lines 1653-1696"
    normative_status: deprecated
    generate: >-
      No. "Implementations MUST NOT create version 3 signatures; they MAY accept version 3
      signatures." Table 27 rows for v3 signatures are all Generate? No.
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 3
        required: true
        constrained_by:
          - rfc-9580#R-0045
          - rfc-9580#R-0046
          - rfc-9580#R-0346
      - name: hashed-length
        type: u8
        value: 5
        required: true
        constraints: "A 1-octet length of the following hashed material; it MUST be 5:"
        constrained_by:
          - rfc-9580#R-0058
      - name: signature-type
        type: u8
        required: true
        constraints: >-
          Table 4 (signature_types). Must not be 0xFF (R-0176). "Version 3 Standalone signatures
          MUST NOT be generated and MUST be ignored." (type 0x02).
        constrained_by:
          - rfc-9580#R-0176
          - rfc-9580#R-0048
      - name: creation-time
        type: time32
        required: true
      - name: signer-key-id
        type: keyid
        required: true
      - name: public-key-algorithm
        type: u8
        required: true
        constraints: >-
          RSA (1, 3) or DSA (17) per the algorithm-specific fields the section gives. Version 3
          is forbidden with ECDSA, EdDSALegacy, Ed25519 and Ed448.
        constrained_by:
          - rfc-9580#R-0061
          - rfc-9580#R-0065
          - rfc-9580#R-0069
          - rfc-9580#R-0072
      - name: hash-algorithm
        type: u8
        required: true
        constraints: Table 23 ID.
        constrained_by:
          - rfc-9580#R-0305
          - rfc-9580#R-0306
      - name: hash-left-16
        type: octets[2]
        required: true
        constraints: >-
          "A 2-octet field holding left 16 bits of the signed hash value." "The high 16 bits
          (first two octets) of the hash are included in the Signature packet to provide a way to
          reject some invalid signatures without performing a signature verification."
      - name: signature
        type: "MPI+"
        required: true
        constraints: >-
          RSA: MPI(m^d mod n) (sig-fields-rsa); DSA: MPI(r) || MPI(s) (sig-fields-dsa-ecdsa).
    layout: >-
      0x03 || 0x05 || sigtype (1) || ctime (4) || keyid (8) || pkalgo (1) || hashalgo (1) ||
      left16 (2) || algorithm-specific MPIs. Hash input: data || sigtype || ctime
      (signature-hash-trailer-v3).
    constrained_by:
      - rfc-9580#R-0059
      - rfc-9580#R-0178
      - rfc-9580#R-0179
      - rfc-9580#R-0180
    notes: >-
      Derived: a v3 signature has no subpackets, so it can carry no Issuer Fingerprint, no
      expiration and no preferences; the signer is named only by the Key ID.

  - name: signature-v4
    packet_type: 2
    shorthand: SIG
    version: 4
    source: "§5.2, lines 1464-1484; §5.2.3, lines 1698-1739; §5.2.3.6, lines 1833-1860"
    normative_status: current
    generate: >-
      Yes, by a version 4 key: "An implementation MUST generate a version 4 signature when signing
      with a version 4 key." (Table 27 row 4 | 4 | 3 | Yes).
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 4
        required: true
        constrained_by:
          - rfc-9580#R-0044
          - rfc-9580#R-0346
          - rfc-9580#R-0347
      - name: signature-type
        type: u8
        required: true
        constraints: Table 4 (signature_types); 0xFF never created nor validated.
        constrained_by:
          - rfc-9580#R-0057
      - name: public-key-algorithm
        type: u8
        required: true
        constraints: Table 18 ID with a Signature Format entry (1, 3, 17, 19, 22, 27, 28).
      - name: hash-algorithm
        type: u8
        required: true
        constraints: >-
          Table 23 ID. MD5, SHA-1 and RIPEMD-160 are not generated and recent signatures using
          them are not validated.
        constrained_by:
          - rfc-9580#R-0297
          - rfc-9580#R-0298
          - rfc-9580#R-0299
          - rfc-9580#R-0300
          - rfc-9580#R-0301
          - rfc-9580#R-0305
          - rfc-9580#R-0306
      - name: hashed-subpacket-length
        type: u16
        required: true
        constraints: >-
          "Note that this is the length in octets of all of the hashed subpackets; an
          implementation's pointer incremented by this number will skip over the hashed
          subpackets." A hashed area longer than the packet makes the signature malformed (§5.2.5).
      - name: hashed-subpackets
        type: subpackets
        required: true
        constraints: >-
          Zero or more subpackets (signature-subpacket). Covered by the signature. Must contain a
          Signature Creation Time subpacket (R-0101).
        constrained_by:
          - rfc-9580#R-0101
      - name: unhashed-subpacket-length
        type: u16
        required: true
      - name: unhashed-subpackets
        type: subpackets
        required: true
        constraints: >-
          Zero or more subpackets. "The second set of subpackets (the "unhashed section") is not
          cryptographically protected by the signature and should include only advisory
          information."
        constrained_by:
          - rfc-9580#R-0077
          - rfc-9580#R-0417
          - rfc-9580#R-0418
      - name: hash-left-16
        type: octets[2]
        required: true
        constraints: "A 2-octet field holding the left 16 bits of the signed hash value."
      - name: signature
        type: algorithm-specific
        required: true
        constraints: >-
          "One or more MPIs comprising the signature. This portion is algorithm specific." For
          Ed25519 and Ed448 it is a fixed octet string, not MPIs (SD-M03). See sig-fields-*.
    layout: >-
      0x04 || sigtype (1) || pkalgo (1) || hashalgo (1) || u16 hlen || hashed subpackets (hlen) ||
      u16 ulen || unhashed subpackets (ulen) || left16 (2) || algorithm-specific fields. A.2
      (lines 7635-7640): 04 00 16 08 | 0006 | 05 02 55f95f95 | 000a | 09 10 8cfde12197965a9a |
      f622 | MPI 00ff r | MPI 0100 s (Binary signature, EdDSALegacy, SHA2-256; the Issuer Key ID
      subpacket is unhashed).
    constrained_by:
      - rfc-9580#R-0075
      - rfc-9580#R-0178
      - rfc-9580#R-0179
      - rfc-9580#R-0180
      - rfc-9580#R-0043
      - rfc-9580#R-0344

  - name: signature-v6
    packet_type: 2
    shorthand: SIG
    version: 6
    source: "§5.2, lines 1464-1484; §5.2.3, lines 1698-1739; §5.2.3.6, lines 1833-1860; §13.2, lines 6363-6390"
    normative_status: current
    generate: >-
      Yes, by a version 6 key, for every signature type: "When a version 6 key produces a
      Signature packet, it MUST produce a version 6 Signature packet, regardless of the Signature
      packet type."
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 6
        required: true
        constrained_by:
          - rfc-9580#R-0043
          - rfc-9580#R-0315
          - rfc-9580#R-0344
          - rfc-9580#R-0346
          - rfc-9580#R-0347
      - name: signature-type
        type: u8
        required: true
        constrained_by:
          - rfc-9580#R-0057
      - name: public-key-algorithm
        type: u8
        required: true
        constraints: >-
          Table 18 signing algorithm. Ed25519Legacy (EdDSALegacy, 22) is forbidden in version 6
          signatures (R-0068); v6 keys cannot use the deprecated OIDs (R-0286).
        constrained_by:
          - rfc-9580#R-0068
      - name: hash-algorithm
        type: u8
        required: true
        constraints: Table 23 ID with a defined V6 Signature Salt Size (8, 9, 10, 11, 12, 14).
        constrained_by:
          - rfc-9580#R-0297
          - rfc-9580#R-0298
          - rfc-9580#R-0299
          - rfc-9580#R-0301
          - rfc-9580#R-0305
      - name: hashed-subpacket-length
        type: u32
        required: true
        constraints: "For a version 6 signature, this is a 4-octet field."
      - name: hashed-subpackets
        type: subpackets
        required: true
        constrained_by:
          - rfc-9580#R-0101
      - name: unhashed-subpacket-length
        type: u32
        required: true
      - name: unhashed-subpackets
        type: subpackets
        required: true
        constrained_by:
          - rfc-9580#R-0077
          - rfc-9580#R-0417
          - rfc-9580#R-0418
      - name: hash-left-16
        type: octets[2]
        required: true
        constraints: >-
          "When verifying a version 6 signature, an implementation MUST reject the signature if
          these octets do not match the first two octets of the computed hash."
        constrained_by:
          - rfc-9580#R-0076
      - name: salt-length
        type: u8
        required: true
        constraints: >-
          "A 1-octet salt size. The value MUST match the value defined for the hash algorithm as
          specified in Table 23." (16 for SHA2-256, SHA2-224, SHA3-256; 24 for SHA2-384; 32 for
          SHA2-512, SHA3-512). A mismatch makes the signature malformed (§5.2.5).
        constrained_by:
          - rfc-9580#R-0060
      - name: salt
        type: octets[salt-length]
        required: true
        constraints: >-
          "The salt, which is a random value of the specified size." It is hashed first
          (signature-hash-input), and must be fresh for each signature (§13.2).
        constrained_by:
          - rfc-9580#R-0164
          - rfc-9580#R-0415
      - name: signature
        type: algorithm-specific
        required: true
    layout: >-
      0x06 || sigtype (1) || pkalgo (1) || hashalgo (1) || u32 hlen || hashed subpackets || u32
      ulen || unhashed subpackets || left16 (2) || saltlen (1) || salt || algorithm-specific
      fields. A.6 (lines 7971-8007): c2 98 | 06 01 1b 0a | 00000029 | 05 82 6398a363 | 22 21 06
      cb18...acc9 | 00000000 | 69 36 | 20 | 76495f...fbac (32) | 64-octet Ed25519 signature.
    constrained_by:
      - rfc-9580#R-0075
      - rfc-9580#R-0178
      - rfc-9580#R-0179
      - rfc-9580#R-0180
    notes: >-
      The two differences from v4 are the 4-octet subpacket area lengths and the salt (§5.2.3.6,
      lines 1853-1857). The salt is transmitted after the left-16 field but hashed before all
      other data. Derived (Appendix A.3, A.6): every v6 signature in the vectors carries a
      critical Signature Creation Time and an Issuer Fingerprint in the hashed area.

  # ----- algorithm-specific signature fields -----

  - name: sig-fields-rsa
    applies_to: "signature-v3, signature-v4, signature-v6; public-key-algorithm 1 or 3"
    source: "§5.2.3.1, lines 1741-1750; §5.2.2, lines 1683-1685; §12.1.3, lines 6015-6063"
    normative_status: deprecated
    encoding: binary
    fields:
      - name: m^d-mod-n
        type: MPI
        required: true
        constraints: >-
          "MPI of RSA signature value m^d mod n." m is EMSA-PKCS1-v1_5 of the signature hash
          (emsa-pkcs1-v1_5).
        constrained_by:
          - rfc-9580#R-0003
          - rfc-9580#R-0279
          - rfc-9580#R-0280
          - rfc-9580#R-0383
          - rfc-9580#R-0384
          - rfc-9580#R-0385
          - rfc-9580#R-0386
    layout: "MPI(m^d mod n)"

  - name: emsa-pkcs1-v1_5
    applies_to: sig-fields-rsa
    source: "§12.1.3, lines 6015-6063; Table 24, lines 5036-5094"
    normative_status: computed
    encoding: computed
    fields:
      - name: lead
        type: octets[2]
        value: "0x00 0x01"
        required: true
      - name: PS
        type: "octets[emLen - tLen - 3], each 0xFF"
        required: true
        constraints: "The length of PS will be at least 8 octets."
        constrained_by:
          - rfc-9580#R-0371
      - name: separator
        type: u8
        value: "0x00"
        required: true
      - name: T
        type: "Table 24 Full Hash Prefix || H"
        required: true
        constraints: >-
          "Let T be the Full Hash Prefix from Table 24 for the given hash function, concatenated
          with the hash digest H". emLen < tLen + 11 is an error.
        constrained_by:
          - rfc-9580#R-0368
          - rfc-9580#R-0369
          - rfc-9580#R-0370
    layout: "EM = 0x00 || 0x01 || PS || 0x00 || T"
    constrained_by:
      - rfc-9580#R-0372
    full_hash_prefixes:
      MD5: "30 20 30 0C 06 08 2A 86 48 86 F7 0D 02 05 05 00 04 10"
      SHA-1: "30 21 30 09 06 05 2B 0E 03 02 1A 05 00 04 14"
      RIPEMD-160: "30 21 30 09 06 05 2B 24 03 02 01 05 00 04 14"
      SHA2-256: "30 31 30 0D 06 09 60 86 48 01 65 03 04 02 01 05 00 04 20"
      SHA2-384: "30 41 30 0D 06 09 60 86 48 01 65 03 04 02 02 05 00 04 30"
      SHA2-512: "30 51 30 0D 06 09 60 86 48 01 65 03 04 02 03 05 00 04 40"
      SHA2-224: "30 2D 30 0D 06 09 60 86 48 01 65 03 04 02 04 05 00 04 1C"
      SHA3-256: "30 31 30 0D 06 09 60 86 48 01 65 03 04 02 08 05 00 04 20"
      SHA3-512: "30 51 30 0D 06 09 60 86 48 01 65 03 04 02 0A 05 00 04 40"
    notes: >-
      Derived: the last prefix octet is the digest length (0x10 = 16 for MD5, 0x14 = 20, 0x1C =
      28, 0x20 = 32, 0x30 = 48, 0x40 = 64), which gives the digest sizes the source does not
      tabulate. Table 24 writes the SHA3-512 octet in lowercase (0x0a, line 5089).

  - name: sig-fields-dsa-ecdsa
    applies_to: "signature-v3 (DSA only), signature-v4, signature-v6; public-key-algorithm 17 or 19"
    source: "§5.2.3.2, lines 1752-1774; §5.2.2, lines 1687-1691"
    normative_status: current
    normative_status_by_algorithm: {"17 DSA": deprecated, "19 ECDSA": current}
    encoding: binary
    fields:
      - name: r
        type: MPI
        required: true
        constraints: "MPI of DSA or ECDSA value r."
      - name: s
        type: MPI
        required: true
        constraints: "MPI of DSA or ECDSA value s."
    constrained_by:
      - rfc-9580#R-0003
      - rfc-9580#R-0061
      - rfc-9580#R-0062
      - rfc-9580#R-0063
      - rfc-9580#R-0064
      - rfc-9580#R-0282
      - rfc-9580#R-0388
      - rfc-9580#R-0389
    layout: "MPI(r) || MPI(s)"
    notes: >-
      DSA: the hash is truncated to the bit length of q. ECDSA: digest size at least the curve's
      fsize, and at least 512 bits for NIST P-521. DSA signing and verifying are forbidden
      (R-0389), so the DSA form is read-only and cannot be validated.

  - name: sig-fields-eddsa-legacy
    applies_to: "signature-v4 only; public-key-algorithm 22 with the Ed25519Legacy OID"
    source: "§5.2.3.3, lines 1776-1788; §5.2.3.3.1, lines 1790-1804; Table 20, lines 4894-4898"
    normative_status: deprecated
    encoding: binary
    fields:
      - name: R
        type: MPI (EC octet string, little-endian native)
        required: true
        constraints: >-
          "MPI of an EC point R, represented as a (non-prefixed) native (little-endian) octet
          string up to 32 octets."
      - name: S
        type: MPI (EC octet string, little-endian native)
        required: true
        constraints: >-
          "MPI of EdDSA value S, also in (non-prefixed) native (little-endian) format with a
          length up to 32 octets."
    constrained_by:
      - rfc-9580#R-0065
      - rfc-9580#R-0066
      - rfc-9580#R-0067
      - rfc-9580#R-0068
      - rfc-9580#R-0285
    layout: >-
      MPI(R) || MPI(S), each an ec-scalar-octet-string of 32 octets with leading zero octets
      stripped. A.2: 00ff 56f9...3366 (R, 255 bits), 0100 d09c...b404 (S, 256 bits).
    notes: >-
      Derived: a decoder must left-pad R and S to 32 octets (§11.3.1) before passing them to
      Ed25519 verification.

  - name: sig-fields-ed25519
    applies_to: "signature-v4, signature-v6; public-key-algorithm 27"
