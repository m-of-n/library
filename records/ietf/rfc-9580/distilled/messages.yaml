    source: "Table 1, lines 649-650"
    normative_status: reserved
    fields: []
    constrained_by:
      - rfc-9580#R-0006

  - name: s2k-iterated-salted
    s2k_type: 3
    source: "§3.7.1.3, lines 713-749"
    normative_status: current
    generate: "Yes (Table 1); MAY be used if Argon2 is not available"
    encoding: binary
    fields:
      - name: type
        type: u8
        value: "0x03"
        required: true
      - name: hash-algorithm
        type: u8
        required: true
      - name: salt
        type: octets[8]
        required: true
      - name: coded-count
        type: u8
        required: true
        constraints: >-
          count = ((Int32)16 + (c & 15)) << ((c >> 4) + EXPBIAS), EXPBIAS = 6. "Note that the
          resulting count value is an octet count of how many octets will be hashed, not an
          iteration count." At least one full salt || passphrase is hashed regardless of count.
    layout: "03 || hash || salt (8) || c; 11 octets. A.9.1: 03 08 a5ae579d1fc5d82b ff (count 65011712)"
    derivation: >-
      Each context hashes (salt || passphrase) repeated and truncated to count octets; key data
      as for Simple S2K.
    constrained_by:
      - rfc-9580#R-0014
      - rfc-9580#R-0303
      - rfc-9580#R-0304
    notes: >-
      Derived arithmetic check: c = 0xFF gives (16 + 15) << (15 + 6) = 65011712, matching A.9.1
      line 8324; the range is 1024 (c = 0) to 65011712.

  - name: s2k-argon2
    s2k_type: 4
    source: "§3.7.1.4, lines 751-790"
    normative_status: current
    generate: "Yes (Table 1); \"It is RECOMMENDED that implementations use Argon2.\""
    encoding: binary
    fields:
      - name: type
        type: u8
        value: "0x04"
        required: true
      - name: salt
        type: octets[16]
        required: true
        constraints: "The salt SHOULD be unique for each passphrase."
        constrained_by:
          - rfc-9580#R-0007
      - name: t
        type: u8
        required: true
        constraints: number of passes; non-zero
        constrained_by:
          - rfc-9580#R-0008
      - name: p
        type: u8
        required: true
        constraints: degree of parallelism; non-zero
        constrained_by:
          - rfc-9580#R-0008
      - name: encoded-m
        type: u8
        required: true
        constraints: >-
          m = 2^encoded_m KiB. "The encoded memory size MUST be a value from 3+ceil(log_2(p)) to
          31, such that the decoded memory size m is a value from 8*p to 2^31."
        constrained_by:
          - rfc-9580#R-0009
          - rfc-9580#R-0010
    layout: "04 || salt (16) || t || p || encoded_m; 20 octets. Example (line 787-788): 04 XX..XX 01 04 15 (t=1, p=4, m=2^21)"
    derivation: >-
      Argon2id, version 0x13, P = passphrase, S = salt, tag length T = required key size.
    constrained_by:
      - rfc-9580#R-0013
      - rfc-9580#R-0018
    notes: >-
      Argon2 has no hash-algorithm octet. Only with secret-key usage 253 (R-0018); permitted in
      v4 and v6 SKESK (R-0182; A.12 uses v4 SKESK).

