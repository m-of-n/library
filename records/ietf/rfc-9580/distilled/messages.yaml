enumerations:
  packet_types:
    source: "§5 Table 3, lines 1150-1231; §4.3, lines 1143-1144"
    rows:
      - "0 | critical | Reserved, MUST NOT be used | packet-type-0-reserved"
      - "1 | critical | PKESK | pkesk-v3, pkesk-v6"
      - "2 | critical | SIG | signature-v3, signature-v4, signature-v6"
      - "3 | critical | SKESK | skesk-v4, skesk-v6"
      - "4 | critical | OPS | ops-v3, ops-v6"
      - "5 | critical | SECKEY | secret-key"
      - "6 | critical | PUBKEY | public-key-v3, public-key-v4, public-key-v6"
      - "7 | critical | SECSUBKEY | secret-key"
      - "8 | critical | COMP | compressed-data"
      - "9 | critical | SED | symmetrically-encrypted-data"
      - "10 | critical | MARKER | marker"
      - "11 | critical | LIT | literal-data"
      - "12 | critical | TRUST | trust"
      - "13 | critical | UID | user-id"
      - "14 | critical | PUBSUBKEY | public-key-v4, public-key-v6 (v3 keys have no subkeys)"
      - "15-16 | critical (by §4.3) | not listed | packet-type-15-16-unlisted"
      - "17 | critical | UAT | user-attribute"
      - "18 | critical | SEIPD | seipd-v1, seipd-v2"
      - "19 | critical | Reserved (formerly MDC) | packet-type-19-reserved-mdc"
      - "20 | critical | Reserved | packet-type-20-reserved"
      - "21 | critical | PADDING | padding"
      - "22-39 | critical | Unassigned | packet-type-22-39-unassigned-critical"
      - "40-59 | non-critical | Unassigned | packet-type-40-59-unassigned-non-critical"
      - "60-63 | non-critical | Private or Experimental | packet-type-60-63-private"
    constrained_by:
      - rfc-9580#R-0032
      - rfc-9580#R-0033
      - rfc-9580#R-0309
      - rfc-9580#R-0310
      - rfc-9580#R-0311

  signature_types:
    source: "§5.2.1 Table 4, lines 1497-1533; §5.2.1.1-§5.2.1.16, lines 1538-1651; §5.2.4, lines 2747-2784"
    rows:
      - id: "0x00"
        name: Binary Signature
        meaning: "the signer owns it, created it, or certifies that it has not been modified"
        hashes: document octets
      - id: "0x01"
        name: Text Signature
        meaning: as 0x00, over the canonical text
        hashes: "document with line endings converted to <CR><LF>, UTF-8"
        constrained_by: [rfc-9580#R-0047, rfc-9580#R-0166]
      - id: "0x02"
        name: Standalone Signature
        meaning: "a signature of only its own subpacket contents"
        hashes: nothing (a zero-length binary document); v3 forms MUST NOT be generated and MUST be ignored
        constrained_by: [rfc-9580#R-0048]
      - id: "0x10"
        name: Generic Certification
        meaning: no assertion about how well the certifier checked the User ID
        hashes: primary key, User ID or User Attribute
      - id: "0x11"
        name: Persona Certification
        meaning: no verification of the identity claim
        hashes: primary key, User ID or User Attribute
      - id: "0x12"
        name: Casual Certification
        meaning: some casual verification
        hashes: primary key, User ID or User Attribute
      - id: "0x13"
        name: Positive Certification
        meaning: substantial verification
        hashes: primary key, User ID or User Attribute
      - id: "0x18"
        name: Subkey Binding
        meaning: the primary key owns the subkey; for a signing subkey MUST embed a 0x19
        hashes: primary key, subkey
        constrained_by: [rfc-9580#R-0049, rfc-9580#R-0088, rfc-9580#R-0313, rfc-9580#R-0314, rfc-9580#R-0316, rfc-9580#R-0317, rfc-9580#R-0325, rfc-9580#R-0326]
      - id: "0x19"
        name: Primary Key Binding
        meaning: the signing subkey is owned by the primary key
        hashes: primary key, subkey
      - id: "0x1F"
        name: Direct Key
        meaning: binds its subpackets to the key; carries v6 key-wide preferences and flags
        hashes: the key
        constrained_by: [rfc-9580#R-0097, rfc-9580#R-0098]
      - id: "0x20"
        name: Key Revocation
        meaning: >-
          "A revoked key is not to be used." Valid only by the key itself or a (deprecated) Revocation Key
        hashes: the key being revoked
        constrained_by: [rfc-9580#R-0050, rfc-9580#R-0051, rfc-9580#R-0319]
      - id: "0x28"
        name: Subkey Revocation
        meaning: "A revoked subkey is not to be used."
        hashes: primary key, subkey
        constrained_by: [rfc-9580#R-0052, rfc-9580#R-0053, rfc-9580#R-0091]
      - id: "0x30"
        name: Certification Revocation
        meaning: revokes a 0x10-0x13 certification or a 0x1F Direct Key signature; later creation date than it
        hashes: the same data as the revoked signature
        constrained_by: [rfc-9580#R-0054, rfc-9580#R-0055, rfc-9580#R-0090, rfc-9580#R-0091]
      - id: "0x40"
        name: Timestamp
        meaning: "only meaningful for the timestamp contained in it"
        hashes: not stated (SD-M10)
      - id: "0x50"
        name: Third-Party Confirmation
        meaning: a notary seal over another signature; SHOULD carry a Signature Target
        hashes: "[salt] || 0x88 || u32 length || target Signature body without unhashed subpackets"
        constrained_by: [rfc-9580#R-0056, rfc-9580#R-0173]
      - id: "0xFF"
        name: Reserved
        meaning: never created, never validated
        constrained_by: [rfc-9580#R-0057, rfc-9580#R-0176]
    notes: >-
      Self-signatures are the certifications by the key on its own User IDs, the Direct Key
      signature and Subkey Binding signatures (§5.2.3.10). §5.2.4 calls 0x20 "Primary Key
      Revocation signatures" (SD-M30).

