    layout: "len 0x02 || 0x84 || 0x00 (local), or len 0x02 || 0x04|0x84 || 0x01"

  - name: subpacket-trust-signature
    subpacket_type: 5
    source: "§5.2.3.21, lines 2309-2325"
    normative_status: current
    body: "(1 octet \"level\" (depth), 1 octet of trust amount)"
    fields:
      - name: level
        type: u8
        required: true
        constraints: >-
          Depth. "Level 0 has the same meaning as an ordinary validity signature." Level 1: the
          signed key is a trusted introducer. Level 2: "the signed key is asserted to be trusted
          to issue level 1 Trust Signatures; that is, the signed key is a "meta introducer"."
          "Generally, a level n Trust Signature asserts that a key is trusted to issue level n-1
          Trust Signatures."
        constrained_by:
          - rfc-9580#R-0114
          - rfc-9580#R-0115
          - rfc-9580#R-0116
          - rfc-9580#R-0117
          - rfc-9580#R-0118
      - name: amount
        type: u8
        required: true
        constraints: >-
          "The trust amount is in a range from 0-255, interpreted such that values less than 120
          indicate partial trust and values of 120 or greater indicate complete trust." Emit 60
          (partial) or 120 (complete).
        constrained_by:
          - rfc-9580#R-0114
          - rfc-9580#R-0119
          - rfc-9580#R-0120
    critical: not stated by the source
    placement: >-
      Derived: hashed (it is an assertion by the signer; R-0418 lets an implementation ignore it
      unhashed). The source states no placement.
    signature_types: >-
      Derived: certifications over another key's User ID (0x10-0x13), since level 0 "has the same
      meaning as an ordinary validity signature"; the source does not restrict types.
    layout: "len 0x03 || 0x05|0x85 || level || amount"
    notes: >-
      Scope can be limited by a Regular Expression subpacket in the same signature when level >
      0 (subpacket-regular-expression).

  - name: subpacket-regular-expression
    subpacket_type: 6
    source: "§5.2.3.22, lines 2327-2350; §8, lines 4591-4623"
    normative_status: current
    body: "(null-terminated UTF-8 encoded Regular Expression)"
    fields:
      - name: regex
        type: utf8[var]
        required: true
        constraints: >-
          §8 syntax (Henry Spencer); matches "a sequence of UTF-8-encoded Unicode characters from
          User IDs". Only signatures by the target key on User IDs that match have trust
          extended by the Trust Signature subpacket.
        constrained_by:
          - rfc-9580#R-0121
          - rfc-9580#R-0122
          - rfc-9580#R-0123
          - rfc-9580#R-0124
          - rfc-9580#R-0125
      - name: terminator
        type: u8
        value: "0x00"
        required: true
        constraints: >-
          "When an implementation parses a Regular Expression subpacket, it MUST remove this
          octet; if it is not present, it MUST reject the subpacket (i.e., ignore the subpacket if
          it's non-critical and reject the signature if it's critical). When an implementation
          generates a Regular Expression subpacket, it MUST include the null terminator."
        constrained_by:
          - rfc-9580#R-0121
          - rfc-9580#R-0126
          - rfc-9580#R-0127
          - rfc-9580#R-0128
    critical: "SHOULD be marked critical when generated (R-0129)"
    signature_types: "signatures carrying a Trust Signature subpacket of level > 0"
    constrained_by:
      - rfc-9580#R-0129
    layout: "len (n + 2) || 0x06|0x86 || regex (n octets UTF-8) || 0x00"
    regex_grammar: >-
      §8: Regular Expression = zero or more branches separated by |. Branch = zero or more
      pieces, concatenated. Piece = atom optionally followed by * (0 or more), + (1 or more) or
      ? (0 or 1). Atom = ( regex ) | range | . (any single Unicode character) | ^ (null string at
      start) | $ (null string at end) | \ followed by one Unicode character | any other single
      Unicode character. Range = [ ... ], [^ ...] negated; a-b spans codepoints; a literal ] is
      first (after a possible ^); a literal - is first or last.
    notes: >-
      The section says "Used in conjunction with Trust Signature packets (of level > 0)"; Trust
      Signature is a subpacket, not a packet (SD-M25). Derived: the terminator is part of the
      subpacket length.

