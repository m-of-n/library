        type: u8
        required: true
        constraints: "values 0 and 0xFF are reserved for future extensions."
      - name: oid
        type: octets[length]
        required: true
        constraints: >-
          DER encoding of the OID with the tag and length octets removed. "Only the truncated
          sequence of octets is the valid representation of a curve OID."
        constrained_by:
          - rfc-9580#R-0284
          - rfc-9580#R-0286
    table_19:
      - "NIST P-256 | 1.2.840.10045.3.1.7 | 08 | 2A 86 48 CE 3D 03 01 07 | ECDSA, ECDH | fsize 32"
      - "NIST P-384 | 1.3.132.0.34 | 05 | 2B 81 04 00 22 | ECDSA, ECDH | fsize 48"
      - "NIST P-521 | 1.3.132.0.35 | 05 | 2B 81 04 00 23 | ECDSA, ECDH | fsize 66"
      - "brainpoolP256r1 | 1.3.36.3.3.2.8.1.1.7 | 09 | 2B 24 03 03 02 08 01 01 07 | ECDSA, ECDH | fsize 32"
      - "brainpoolP384r1 | 1.3.36.3.3.2.8.1.1.11 | 09 | 2B 24 03 03 02 08 01 01 0B | ECDSA, ECDH | fsize 48"
      - "brainpoolP512r1 | 1.3.36.3.3.2.8.1.1.13 | 09 | 2B 24 03 03 02 08 01 01 0D | ECDSA, ECDH | fsize 64"
      - "Ed25519Legacy | 1.3.6.1.4.1.11591.15.1 | 09 | 2B 06 01 04 01 DA 47 0F 01 | EdDSALegacy | fsize 32 | v4 only"
      - "Curve25519Legacy | 1.3.6.1.4.1.3029.1.5.1 | 0A | 2B 06 01 04 01 97 55 01 05 01 | ECDH | fsize 32 | v4 only"
    layout: "len || OID octets. NIST P-256: 08 2A 86 48 CE 3D 03 01 07 (from DER 06 08 2A 86 48 CE 3D 03 01 07)"
    constrained_by:
      - rfc-9580#R-0285
      - rfc-9580#R-0348

  - name: ec-point-sec1
    source: "§11.2, lines 5571-5588; §11.2.1, lines 5590-5601; §11.2.3, lines 5614-5632"
    normative_status: current
    encoding: "MPI content"
    layout: "MPI( 0x04 || x (fsize) || y (fsize) ), x and y big-endian, zero-padded to fsize"
    sizes: "515 bits (P-256, brainpoolP256r1), 771 (P-384, brainpoolP384r1), 1059 (P-521), 1027 (brainpoolP512r1)"
    constrained_by:
      - rfc-9580#R-0349
      - rfc-9580#R-0350
      - rfc-9580#R-0351
    notes: >-
      Derived arithmetic check: 0x04 contributes 3 bits, so 3 + 16 x fsize: 3 + 512 = 515, 3 +
      768 = 771, 3 + 1056 = 1059, 3 + 1024 = 1027. Derived (§11.2.1 "uncompressed" point; R-0351): compressed SEC1 points are not allowed.

  - name: ec-point-prefixed-native
    source: "§11.2.2, lines 5603-5612; §11.2.3, lines 5616-5622"
    normative_status: current
    encoding: "MPI content"
    layout: "MPI( 0x40 || native point (32) ); 263 bits for Curve25519Legacy and Ed25519Legacy"
    constrained_by:
      - rfc-9580#R-0350
      - rfc-9580#R-0351
    notes: Used by Curve25519Legacy ECDH and EdDSALegacy public points. A.1 shows 0107 40 ... (263 = 0x107).

  - name: ec-scalar-integer
    source: "§11.3, lines 5634-5662; Table 29"
    normative_status: current
    encoding: "MPI"
    layout: "standard big-endian MPI (§3.2)"
    notes: ECDSA and SEC1-curve ECDH secret keys; Curve25519Legacy secret (reverse of native).

  - name: ec-scalar-octet-string
    source: "§11.3.1, lines 5664-5690"
    normative_status: current
    encoding: "MPI"
    layout: >-
      MPI(N octets of X): leading zero octets stripped, bit count from the highest set bit.
      Example: X = 00 02 EE 19 00 (N = 5) is 00 1A 02 EE 19 00. Decode: check bit count <= 8N,
      left-pad the value octets with zeros to N.
    notes: EdDSALegacy R, S and secret.

  - name: ec-scalar-prefixed
    source: "§11.3.2, lines 5692-5718"
    normative_status: current
    encoding: "MPI"
    layout: >-
      MPI(prefixed N octets of X) = u16 (8N + 7) || 0x40 || X. Example: X = 00 02 EE 19 00 is 00 2F
      40 00 02 EE 19 00. Decode: check the first three octets are 00 2F 40 (for N = 5).
    notes: >-
      The source says "the 2-bit count octets" for the 2-octet count (line 5712, SD-M23). No
      algorithm in this document is listed in Table 20 as using this scalar form; Derived: it is
      defined for registry completeness.

  # ======================= §6 ASCII Armor (text) =======================

  - name: ascii-armor
    source: "§6, lines 4239-4258; §6.2, lines 4328-4348; §6.2.1-§6.2.3, lines 4350-4480"
    normative_status: text
    encoding: "text lines; base64 per RFC 4648 §4"
    structure:
      - name: armor-header-line
        format: "-----BEGIN <label>-----"
        required: true
        constraints: >-
          Labels (Table 16): PGP MESSAGE (signed, encrypted or compressed files), PGP PUBLIC KEY
          BLOCK, PGP PRIVATE KEY BLOCK, PGP SIGNATURE (detached, OpenPGP/MIME and cleartext
          signatures). "the header lines MUST start at the beginning of a line and MUST NOT have
          text other than whitespace following them on the same line." A sequence with any Secret
          Key packet is marked as a Transferable Secret Key (§10.2).
        constrained_by:
          - rfc-9580#R-0252
          - rfc-9580#R-0253
      - name: armor-headers
        format: "<key>: <value>, one per line, zero or more"
        required: false
        constraints: >-
          "A colon (: 0x3A) and a single space (0x20) separate the key and value." Keys (Table 17):
          Version (SHOULD NOT emit), Comment, Hash (deprecated, cleartext v4 only), Charset. Unknown
          keys ignored; malformed headers: try to recover. No length limit; a key may repeat. Not
          protected by any signature.
        constrained_by:
          - rfc-9580#R-0254
          - rfc-9580#R-0255
          - rfc-9580#R-0256
          - rfc-9580#R-0257
          - rfc-9580#R-0258
          - rfc-9580#R-0261
          - rfc-9580#R-0262
          - rfc-9580#R-0263
      - name: blank-line
        format: "zero length or containing only whitespace"
        required: true
      - name: base64-data
        format: "base64 lines of at most 76 characters"
        required: true
        constraints: "When decoding base64, an OpenPGP implementation MUST ignore all whitespace."
        constrained_by:
          - rfc-9580#R-0240
          - rfc-9580#R-0241
          - rfc-9580#R-0002
          - rfc-9580#R-0251
      - name: checksum
        format: "= followed by 4 base64 characters of the CRC24 (3 octets)"
        required: false
        constraints: >-
          "If present, the checksum with its leading equal sign MUST appear on the next line after
          the base64-encoded data." Never a reason to reject; SHOULD NOT be generated; MUST NOT be
          generated for v2 SEIPD messages, v6-only signature sequences, v6 TPKs and v6-only
          keyrings.
        constrained_by:
          - rfc-9580#R-0242
          - rfc-9580#R-0243
          - rfc-9580#R-0244
          - rfc-9580#R-0245
          - rfc-9580#R-0246
          - rfc-9580#R-0247
          - rfc-9580#R-0248
          - rfc-9580#R-0249
          - rfc-9580#R-0250
      - name: armor-tail-line
        format: "-----END <label>-----"
        required: true
        constraints: "composed in the same manner as the Armor Header Line, except the string \"BEGIN\" is replaced by the string \"END\"."
    crc24: >-
      Generator 0x864CFB, initial value 0xB704CE, over the binary data before base64; per octet:
      crc ^= octet << 16; 8 times: crc <<= 1; if crc & 0x1000000 then crc &= 0xFFFFFF, crc ^=
      generator; result crc & 0xFFFFFF (§6.1.1, lines 4307-4326).
    layout: >-
      A.1 (lines 7608-7612): -----BEGIN PGP PUBLIC KEY BLOCK----- / (blank) / two base64 lines /
      -----END PGP PUBLIC KEY BLOCK-----, no checksum. A.12.1 carries Comment headers (lines
      8829-8830).
    notes: >-
      Derived: §6 states the armor format; an implementation is not required to implement it
      (R-0002 is SHOULD; §14 "this is not a "MUST" feature").

  # ======================= §7 Cleartext Signature Framework (text) =======================

  - name: cleartext-signed-message
    source: "§7, lines 4482-4491; §7.1, lines 4493-4529; §7.2, lines 4531-4547; §7.3, lines 4549-4589"
    normative_status: text
    encoding: text lines
    structure:
      - name: header
        format: "-----BEGIN PGP SIGNED MESSAGE-----"
        required: true
      - name: hash-headers
        format: "Hash: <comma-separated Table 23 Text Names>"
        required: false
        constraints: >-
          Only Hash headers are permitted here; any other Armor Header makes a verifier decline
          every signature; a non-conformant Hash header likewise; a conformant one is ignored.
          Emit only for a v4 SHA2 signature that a legacy verifier needs.
        constrained_by:
          - rfc-9580#R-0258
          - rfc-9580#R-0259
          - rfc-9580#R-0260
          - rfc-9580#R-0264
          - rfc-9580#R-0267
      - name: empty-line
        required: true
        constraints: not part of the signed text
      - name: dash-escaped-text
        required: true
        constraints: >-
          Lines starting with "-" are prefixed with "- "; MAY escape any line, SHOULD escape lines
          starting "From ", MUST escape lines starting with a dash. The digest covers the
          unescaped text. On reversal strip the prefix and warn on "-" followed by a non-space.
        constrained_by:
          - rfc-9580#R-0268
          - rfc-9580#R-0269
          - rfc-9580#R-0270
          - rfc-9580#R-0271
          - rfc-9580#R-0272
          - rfc-9580#R-0273
          - rfc-9580#R-0274
      - name: line-ending
        required: true
        constraints: the line ending before the signature armor is not signed
      - name: signature-armor
        required: true
        constraints: "-----BEGIN PGP SIGNATURE----- armor (ascii-armor) of one or more Signature packets of type 0x01"
    signed_data: >-
      The cleartext with escapes removed, trailing spaces (0x20) and tabs (0x09) removed from
      every line, lines joined with <CR><LF>, and no final line ending; hashed as a Text
      signature (0x01).
    constrained_by:
      - rfc-9580#R-0265
      - rfc-9580#R-0266
      - rfc-9580#R-0275
    layout: >-
      A.6 (lines 7953-7967): header / blank / "What we need from the grocery store:" / blank /
      "- - tofu" / "- - vegetables" / "- - noodles" / blank / signature armor. The signed bytes
      (lines 8039-8048) end 6e 6f 6f 64 6c 65 73 0d 0a: the CRLF after "- noodles" is signed
      because the source text has an empty line before the armor.
    notes: >-
      §7.1 lists "One or more legacy Hash Armor Headers that MAY be included" (SD-M16); §6.2.2.3
      defers to "the hash algorithm indicated in the Embedded Signature" (SD-M15); Table 16 has
      no row for BEGIN PGP SIGNED MESSAGE (SD-M17); §7.2 says to strip "the string -" without the
      space (SD-M18).

