  - name: sig-fields-ed448
    applies_to: "signature-v4, signature-v6; public-key-algorithm 28"
    source: "§5.2.3.5, lines 1820-1831; §12.7, lines 6192-6207"
    normative_status: current
    encoding: binary
    fields:
      - name: signature
        type: octets[114]
        required: true
        constraints: "114 octets of the native signature."
    constrained_by:
      - rfc-9580#R-0072
      - rfc-9580#R-0073
      - rfc-9580#R-0074
      - rfc-9580#R-0278
      - rfc-9580#R-0393
      - rfc-9580#R-0394
      - rfc-9580#R-0395
      - rfc-9580#R-0396
    layout: "114 octets, no MPI framing; PureEdDSA with the empty context string"

  - name: sig-fields-elgamal-reserved
    applies_to: "public-key-algorithm 20 (formerly Elgamal Encrypt or Sign)"
    source: "§12.8, lines 6209-6225; Table 18 row 20, lines 4696-4700"
    normative_status: reserved
    encoding: none
    fields: []
    constrained_by:
      - rfc-9580#R-0397
      - rfc-9580#R-0398
    notes: >-
