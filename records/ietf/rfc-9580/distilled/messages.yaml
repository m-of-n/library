          list is shorter than an implementation expects, the unstated flags are considered to be
          zero." First octet: 0x01 certify (User ID certifications 0x10-0x13 or Direct Key 0x1F
          over other keys); 0x02 sign data; 0x04 encrypt communications; 0x08 encrypt storage;
          0x10 split key; 0x20 authentication; 0x80 group key. Second octet: 0x04 reserved
          (ADSK); 0x08 reserved (timestamping). Split and group flags only on a self-signature,
          and SHOULD be on a Direct Key or Subkey Binding signature.
        constrained_by:
          - rfc-9580#R-0142
          - rfc-9580#R-0143
          - rfc-9580#R-0144
    critical: "SHOULD be marked critical when generated (R-0145)"
    signature_types: >-
      Self-signatures and certification signatures ("The flags in this packet may appear in
      self-signatures or in certification signatures."). A self-signature is valid regardless of
      the primary key's flags (§5.2.3.10).
    constrained_by:
      - rfc-9580#R-0145
    layout: "len (n + 1) || 0x1B|0x9B || flags. A.3.1 lines 7751-7753: 02 9b 03 = {certify, sign}; Subkey Binding line 7842-7843: 02 9b 0c = {EncComms, EncStorage}"
    notes: >-
      Derived: first-octet bit 0x40 is not defined; second-octet notation 0x0004... means the
      second octet's 0x04 bit. RSA Encrypt-Only and Sign-Only algorithm IDs are deprecated in
      favour of these flags (R-0383).

  - name: subpacket-signers-user-id
    subpacket_type: 28
    source: "§5.2.3.30, lines 2563-2574"
    normative_status: current
    body: "(String)"
    fields:
      - name: user-id
        type: utf8[var]
        required: true
        constraints: >-
          States which User ID is responsible for the signing. "This subpacket is not appropriate
          to use to refer to a User Attribute packet."
    signature_types: not restricted by the source
    layout: "len (n + 1) || 0x1C || User ID text"

  - name: subpacket-reason-for-revocation
    subpacket_type: 29
    source: "§5.2.3.31, lines 2576-2632"
    normative_status: current
    body: "(1 octet of revocation code, N octets of reason string)"
    fields:
      - name: code
        type: u8
        required: true
        constraints: >-
          Table 10: 0 no reason specified (Key or Certification Revocation); 1 key is superseded
          (Key Revocation); 2 key material has been compromised (Key Revocation); 3 key is retired
          and no longer used (Key Revocation); 32 User ID information is no longer valid
          (Certification Revocation); 100-110 private use. A revocation of a User ID
          self-certification SHOULD use code 32. Compromise makes all signatures by the key
          suspect; superseded or retired leaves old signatures valid.
        constrained_by:
          - rfc-9580#R-0149
          - rfc-9580#R-0150
          - rfc-9580#R-0151
      - name: reason
        type: utf8[var]
        required: true
        constraints: >-
          "a string of octets that gives information about the Reason for Revocation in
          human-readable form (UTF-8). The string may be null (of zero length). The length of the
          subpacket is the length of the reason string plus one."
        constrained_by:
          - rfc-9580#R-0147
    signature_types: >-
      "This subpacket is used only in Key Revocation and Certification Revocation signatures."
      (0x20, 0x30). R-0148 asks for it in "all Revocation Signatures", which includes 0x28
      (SD-M07).
    constrained_by:
      - rfc-9580#R-0146
      - rfc-9580#R-0148
      - rfc-9580#R-0082
    layout: "len (n + 2) || 0x1D || code || reason (n)"
    notes: >-
      Derived: the source's "length of the subpacket is the length of the reason string plus
      one" counts the code octet and not the type octet, so it describes the body (subpacket
      data), not the §5.2.3.7 subpacket length, which is n + 2.

  - name: subpacket-features
    subpacket_type: 30
    source: "§5.2.3.32, lines 2634-2676; §13.7, lines 6573-6584; §12.11"
    normative_status: current
    body: "(N octets of flags)"
    fields:
      - name: flags
        type: octets[n]
        required: true
        constraints: >-
          First octet: 0x01 v1 SEIPD supported; 0x02 reserved; 0x04 reserved; 0x08 v2 SEIPD
          supported. A sender SHOULD NOT use an unlisted feature unless it can infer support
          another way; v2 SEIPD SHOULD be used when all recipient keys set 0x08, when all are
          version 6 keys without a Features subpacket, or when support by all recipients can
          otherwise be inferred (R-0411).
        constrained_by:
          - rfc-9580#R-0152
          - rfc-9580#R-0153
          - rfc-9580#R-0085
          - rfc-9580#R-0411
          - rfc-9580#R-0412
    signature_types: "self-signatures only (\"only appears in a self-signature\")"
    constrained_by:
      - rfc-9580#R-0082
    layout: "len (n + 1) || 0x1E || flags. A.3.1 lines 7754-7756: 02 1e 09 = {v1SEIPD, v2SEIPD}"
    notes: >-
      Derived: unstated flags in a short list are zero by analogy with Key Flags; the source
      states that rule only for Key Flags (R-0143).

  - name: subpacket-signature-target
    subpacket_type: 31
    source: "§5.2.3.33, lines 2678-2691"
    normative_status: current
    body: "(1 octet public key algorithm, 1 octet hash algorithm, N octets hash)"
    fields:
      - name: public-key-algorithm
        type: u8
        required: true
        constraints: Of the target signature.
      - name: hash-algorithm
        type: u8
        required: true
        constraints: Of the target signature.
      - name: hash
        type: octets[digest size of hash-algorithm]
        required: true
        constraints: >-
          "The N octets of hash data MUST be the size of the signature's hash. For example, a
          target signature with a SHA-1 hash MUST have 20 octets of hash data."
        constrained_by:
          - rfc-9580#R-0155
          - rfc-9580#R-0156
    signature_types: >-
      Revocation Signatures (0x20, 0x28, 0x30): "provides explicit designation of which signature
      is being revoked"; Third-Party Confirmation (0x50) and Timestamp (0x40): "designates what
      signature is signed".
    constrained_by:
      - rfc-9580#R-0154
      - rfc-9580#R-0056
    layout: "len (n + 3) || 0x1F || pkalgo || hashalgo || hash (n)"
    notes: >-
      The source does not say over what data the N-octet hash is computed (SD-M11). Derived:
      "the signature's hash" most plausibly means the target signature's own digest (the value
      whose left 16 bits it carries), but that is an inference.

  - name: subpacket-embedded-signature
    subpacket_type: 32
    source: "§5.2.3.34, lines 2693-2699; §5.2.1.8, lines 1585-1593; §10.1.5, lines 5326-5331"
    normative_status: current
    body: "(1 Signature packet body)"
    fields:
      - name: signature
        type: "signature-v4 | signature-v6 body (no packet header)"
        required: true
        constraints: >-
          "This subpacket contains a complete Signature packet body as specified in Section 5.2."
          In a Subkey Binding signature (0x18) for a signing-capable subkey it holds the Primary
          Key Binding signature (0x19) made by the subkey.
        constrained_by:
          - rfc-9580#R-0049
          - rfc-9580#R-0326
          - rfc-9580#R-0317
    signature_types: >-
      Subkey Binding signatures of signing subkeys (required, R-0049); the source does not
      restrict other uses ("useful when one signature needs to refer to, or be incorporated in,
      another signature").
    layout: "len (n + 1) || 0x20|0xA0 || Signature packet body (n)"
    notes: >-
      Derived: the embedded body's own version must follow Table 27 for the subkey, and it is
      subject to §5.2.5 like any signature. Placement: Derived, hashed, since the 0x19 binding is
      meaningful only if the primary key's signature covers it; the source does not say.

  - name: subpacket-issuer-fingerprint
    subpacket_type: 33
    source: "§5.2.3.35, lines 2701-2717; §13.13, lines 6792-6798"
    normative_status: current
    body: "(1 octet key version number, N octets of fingerprint)"
    fields:
      - name: key-version
        type: u8
        required: true
        constraints: >-
          "Since the version of the signature is bound to the version of the key, the version
          octet here MUST match the version of the signature. If the version octet does not match
          the signature version, the receiving implementation MUST treat it as a malformed
          signature (see Section 5.2.5)."
        constrained_by:
          - rfc-9580#R-0159
          - rfc-9580#R-0160
      - name: fingerprint
        type: fingerprint
        required: true
        constraints: >-
          20 octets for a v4 key, 32 for a v6 key. For a v4 issuer with an Issuer Key ID
          subpacket, that Key ID MUST match the low 64 bits.
        constrained_by:
          - rfc-9580#R-0158
    critical: not stated by the source
    placement: >-
      Either. A.3 and A.6 put it hashed; an implementation MAY synthesize one into the unhashed
      area (R-0417).
    signature_types: "all: \"This subpacket SHOULD be included in all signatures.\""
    constrained_by:
      - rfc-9580#R-0157
      - rfc-9580#R-0417
    layout: >-
      v6: len 0x22 || 0x21 || 0x06 || fp (32). v4: len 0x16 || 0x21 || 0x04 || fp (20). A.6 lines
      7982-7989: 22 21 06 cb186c4f...bad9acc9.

  - name: subpacket-intended-recipient-fingerprint
    subpacket_type: 35
    source: "§5.2.3.36, lines 2719-2737; §13.12, lines 6775-6782; §13.8, lines 6630-6635"
    normative_status: current
    body: "(1 octet key version number, N octets of fingerprint)"
    fields:
      - name: key-version
        type: u8
        required: true
        constraints: >-
          Version of the recipient primary key. Derived: unlike Issuer Fingerprint, no rule ties
          it to the signature version, so a v6 signature may name a v4 recipient.
      - name: fingerprint
        type: fingerprint
        required: true
        constraints: >-
          "The OpenPGP Key fingerprint of the intended recipient primary key." 20 octets for v4,
          32 for v6.
    semantics: >-
      With one or more of these, the signature "SHOULD be considered valid only in an encrypted
      context, where the key it was encrypted to is one of the indicated primary keys or one of
      their subkeys." Generate one per recipient when signing and encrypting.
    critical: "SHOULD be marked critical in a version 6 signature (R-0163)"
    signature_types: "Derived: data signatures (0x00, 0x01) inside an encrypted message"
    constrained_by:
      - rfc-9580#R-0161
      - rfc-9580#R-0162
      - rfc-9580#R-0163
      - rfc-9580#R-0083
      - rfc-9580#R-0416
    layout: "v6 recipient: len 0x22 || 0x23|0xA3 || 0x06 || fp (32); v4 recipient: len 0x16 || 0x23|0xA3 || 0x04 || fp (20)"
    notes: >-
      Derived: placement must be hashed for the mechanism to resist forwarding; the source states
      no placement. §5.2.3.7 spells the name "Intended Recipients Fingerprint" (line 2008).

  - name: subpacket-preferred-aead-ciphersuites
    subpacket_type: 39
    source: "§5.2.3.15, lines 2193-2231; §13.13, lines 6800-6808"
    normative_status: current
    body: "(array of pairs of octets indicating Symmetric Cipher and AEAD algorithms)"
    fields:
      - name: pairs
        type: "(u8 cipher, u8 aead)[n]"
        required: true
        constraints: >-
          "The Symmetric Cipher Algorithm ID precedes the AEAD algorithm ID in each pair." Most
          preferred first. Only listed combinations are assumed supported, except AES-128 with
          OCB: "If AES-128 and OCB are not found in the subpacket, it is implicitly listed at the
          end." Relevant only when generating v2 SEIPD. Example 09 02 09 03 13 02: AES-256/OCB,
          AES-256/GCM, Camellia-256/OCB, then implicit AES-128/OCB.
        constrained_by:
          - rfc-9580#R-0106
    signature_types: "self-signatures only (\"This subpacket is only found on a self-signature.\")"
    placement: hashed; §13.13 uses it as the example of a subpacket to ignore when unhashed
    constrained_by:
      - rfc-9580#R-0082
      - rfc-9580#R-0084
      - rfc-9580#R-0418
    layout: "len (2n + 1) || 0x27 || c1 a1 ... cn an. A.3.1 lines 7765-7768: 05 27 09 02 07 02"
    notes: >-
      Derived: 0x13 in the example is 19 decimal; Table 21 has Camellia-256 at 13 decimal (0x0D),
      and 19 is unassigned, so the example's third pair does not decode as "Camellia-256 with OCB"
      (SD-M29).

  # ======================= §5.3 SKESK (Type ID 3) =======================

  - name: skesk-v4
    packet_type: 3
    shorthand: SKESK
    version: 4
    source: "§5.3, lines 2888-2914; §5.3.1, lines 2916-2952; §3.7.2.2, lines 909-922"
    normative_status: current
    generate: Yes, only ahead of a v1 SEIPD payload (Table 26).
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 4
        required: true
        constrained_by:
          - rfc-9580#R-0181
          - rfc-9580#R-0337
          - rfc-9580#R-0338
          - rfc-9580#R-0340
          - rfc-9580#R-0341
          - rfc-9580#R-0342
          - rfc-9580#R-0343
      - name: symmetric-algorithm
        type: u8
        required: true
        constraints: >-
          "A 1-octet number describing the symmetric algorithm used." Without an encrypted
          session key it is the message cipher; with one, it is the cipher used to decrypt that
          field (Derived from lines 2935-2947).
        constrained_by:
          - rfc-9580#R-0287
          - rfc-9580#R-0289
          - rfc-9580#R-0019
      - name: s2k
        type: s2k
        required: true
        constraints: >-
          "The length of the S2K Specifier depends on its type". "because an all-zero IV is used
          for this decryption, the S2K Specifier MUST use a salt value, a Salted S2K, an Iterated
          and Salted S2K, or Argon2."
        constrained_by:
          - rfc-9580#R-0182
          - rfc-9580#R-0011
          - rfc-9580#R-0303
      - name: encrypted-session-key
        type: octets[var]
        required: false
        constraints: >-
          "Optionally, the encrypted session key itself, which is decrypted with the S2K object."
          Absence "can be detected on the basis of packet length and S2K Specifier size"; then
          the S2K output is the session key. Present: CFB with an all-zero IV under the S2K
          output; plaintext = 1-octet symmetric algorithm ID of the encryption container ||
          session key.
    layout: >-
      0x04 || symalgo (1) || S2K (2, 10, 11 or 20 octets) || [CFB(S2K(pass), IV = 0, symalgo' ||
      session key)]. A.12.1 (decoded): 04 07 | 04 9c52...3136 | 01 04 15 (Argon2, t=1, p=4, m=2^21) |
      17 octets (1 + 16).
    notes: >-
      Derived: the S2K length is fixed by its type (Table 1), so the parser can tell whether the
      encrypted session key is present. A v4 SKESK carries no integrity check, which is why the
      v1 SEIPD quick check exists (§13.4). The IDEA-with-Simple-S2K case with no ESK at all is
      the pre-RFC 2440 SED convention (§3.7.2.2, §5.7).

  - name: skesk-v6
    packet_type: 3
    shorthand: SKESK
    version: 6
    source: "§5.3, lines 2888-2914; §5.3.2, lines 2954-2998"
    normative_status: current
    generate: Yes, only ahead of a v2 SEIPD payload (Table 26).
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 6
        required: true
        constrained_by:
          - rfc-9580#R-0183
          - rfc-9580#R-0337
          - rfc-9580#R-0339
          - rfc-9580#R-0341
          - rfc-9580#R-0342
          - rfc-9580#R-0343
      - name: params-length
        type: u8
        required: true
        constraints: >-
          "A 1-octet scalar octet count for the 5 fields following this octet." Derived (A.9.1,
          A.10.1, A.11.1): it counts cipher, AEAD, S2K length, S2K and IV; 0x1E, 0x1D, 0x1A for a
          16-, 15- and 12-octet nonce with an 11-octet S2K.
      - name: symmetric-algorithm
        type: u8
        required: true
        constraints: "A 1-octet Symmetric Cipher Algorithm ID (from Table 21)."
        constrained_by:
          - rfc-9580#R-0287
          - rfc-9580#R-0289
      - name: aead-algorithm
        type: u8
        required: true
        constraints: "A 1-octet AEAD algorithm identifier (from Table 25)."
        constrained_by:
          - rfc-9580#R-0307
          - rfc-9580#R-0308
      - name: s2k-length
        type: u8
        required: true
        constraints: "A 1-octet scalar octet count of the following field."
      - name: s2k
        type: s2k
        required: true
        constrained_by:
          - rfc-9580#R-0011
          - rfc-9580#R-0303
          - rfc-9580#R-0304
      - name: iv
        type: octets[nonce length of aead-algorithm]
        required: true
        constraints: >-
          "A starting IV of the size specified by the AEAD algorithm." 16 (EAX), 15 (OCB), 12 (GCM).
        constrained_by:
          - rfc-9580#R-0415
      - name: encrypted-session-key
        type: octets[session key size]
        required: true
      - name: tag
        type: octets[16]
        required: true
        constraints: >-
          "An authentication tag for the AEAD mode." 16 octets for EAX, OCB and GCM.
    key_derivation: >-
      KEK = HKDF-SHA256(IKM = S2K output, salt = none, info = 0xC3 || 0x06 || cipher || aead),
      length = cipher key size (Derived; the source does not state the HKDF output length). Session key = AEAD-Decrypt(KEK, nonce = iv, AD = 0xC3 || 0x06 ||
      cipher || aead, ciphertext || tag). "Note that no chunks are used and that there is only one
      authentication tag." Example AD for AES-128 with OCB: 0xC3, 0x06, 0x07, 0x02.
    layout: >-
      0x06 || n (1) || cipher (1) || aead (1) || s (1) || S2K (s) || IV || ESK || tag (16), with
      n = 3 + s + IV length. A.9.1 (lines 8313-8333): 06 1e 07 01 0b | 03 08 a5ae579d1fc5d82b ff |
      nonce (16) | ESK (16) | tag (16).
    constrained_by:
      - rfc-9580#R-0406
    notes: >-
      Derived (recomputed): HKDF-SHA256 of the A.9.2 derived key with info c3 06 07 01 gives
      the A.9.2 HKDF output 2fce331f...c72139. The info and AD omit the S2K and nonce.

  # ======================= §5.4 One-Pass Signature (Type ID 4) =======================

  - name: ops-v3
    packet_type: 4
    shorthand: OPS
    version: 3
    source: "§5.4, lines 3000-3052; §10.3.2.2 Table 27, lines 5509-5526"
    normative_status: current
    generate: Yes, for a v4 signature by a v4 key ("there is no version 4 OPS").
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 3
        required: true
        constrained_by:
          - rfc-9580#R-0186
          - rfc-9580#R-0345
      - name: signature-type
        type: u8
        required: true
      - name: hash-algorithm
        type: u8
        required: true
        constraints: >-
          Note the order: hash algorithm precedes public-key algorithm here, the reverse of the
          Signature packet (Derived from lines 3017-3019 vs 1707-1709).
      - name: public-key-algorithm
        type: u8
        required: true
      - name: key-id
        type: keyid
        required: true
        constraints: "Only for v3 packets, an 8-octet number holding the Key ID of the signing key."
      - name: nested
        type: u8
        required: true
        constraints: >-
          "A zero value indicates that the next packet is another One-Pass Signature packet that
          describes another signature to be applied to the same message data." Derived: non-zero
          (A.7 uses 0x01) marks the last OPS before the signed data.
    layout: "0x03 || sigtype || hashalgo || pkalgo || keyid (8) || nested (1); 13 octets"
    notes: >-
      Several OPS packets are bracketed: the first Signature after the data matches the last
      OPS. A mismatch between OPS and Signature versions makes the signature malformed (§5.2.5).

  - name: ops-v6
    packet_type: 4
    shorthand: OPS
    version: 6
    source: "§5.4, lines 3000-3052"
    normative_status: current
    generate: Yes, for a v6 signature.
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 6
        required: true
        constrained_by:
          - rfc-9580#R-0186
          - rfc-9580#R-0345
      - name: signature-type
        type: u8
        required: true
      - name: hash-algorithm
        type: u8
        required: true
      - name: public-key-algorithm
        type: u8
        required: true
      - name: salt-length
        type: u8
        required: true
        constraints: >-
          "A 1-octet salt size. The value MUST match the value defined for the hash algorithm as
          specified in Table 23."
        constrained_by:
          - rfc-9580#R-0184
      - name: salt
        type: octets[salt-length]
        required: true
        constraints: >-
          "The salt; a random value of the specified size. The value MUST match the salt field of
          the corresponding Signature packet."
        constrained_by:
          - rfc-9580#R-0185
      - name: fingerprint
        type: octets[32]
        required: true
        constraints: >-
          "Only for version 6 packets, 32 octets of the fingerprint of the signing key. Since a
          version 6 signature can only be made by a version 6 key, the length of the fingerprint
          is fixed."
      - name: nested
        type: u8
        required: true
    layout: >-
      0x06 || sigtype || hashalgo || pkalgo || saltlen || salt || fingerprint (32) || nested.
      A.7 (decoded): c4 46 | 06 01 0a 1b 20 | 76495f...fbac (32) | cb186c4f...acc9 (32) | 01.

  # ======================= §5.5 key material packets =======================

