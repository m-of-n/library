# ---------------------------------------------------------------------------
# Source defects, ambiguities and absences that bear on the structures.
source_defects:
  - id: SD-M01
    locator: "§5 Table 3 lines 1200-1205; §5.2.3.7 Table 5 lines 1985-1990"
    finding: >-
      Absence: Table 3 has no row for Packet Type IDs 15 and 16, and Table 5 no row for
      Subpacket Type ID 36. §4.3 makes 15 and 16 critical; neither table says whether the gaps
      are reserved or unassigned.
  - id: SD-M02
    locator: "§5.5.4 lines 3322-3323"
    finding: >-
      "the Key ID (which is only used in v3 PKESK packets; see Section 5.1.1)" contradicts the
      Issuer Key ID subpacket (§5.2.3.12), the v3 OPS (§5.4) and the v3 Signature (§5.2.2), all
      of which carry Key IDs.
  - id: SD-M03
    locator: "§5.2.2 line 1673; §5.2.3 lines 1738-1739; §5.5.3 lines 3227-3229"
    finding: >-
      The signature and secret-key formats say the algorithm-specific portion is "One or more
      MPIs" / "multiprecision integers", but Ed25519, Ed448, X25519 and X448 fields are native
      octet strings without MPI framing (§5.2.3.4, §5.2.3.5, §5.5.5.7-§5.5.5.10).
  - id: SD-M04
    locator: "§5.2.3.7 lines 1871-1878"
    finding: >-
      "Each subpacket consists of a subpacket header and a body. The header consists of:" then
      lists the subpacket-specific data as a header item. §5.12 (lines 3893-3901) states the same
      structure correctly ("and is followed by the subpacket specific data").
  - id: SD-M05
    locator: "§5.2.3.13 line 2166; §5.2.3.18 line 2255; §3.5"
    finding: >-
      Key Expiration Time and Signature Expiration Time are labelled "(4-octet time field)", the
      §3.5 term for an absolute time since the epoch, but hold a relative number of seconds.
  - id: SD-M06
    locator: "§5.2.3.7 lines 1886-1896 vs §4.2.1.2 lines 1031-1037"
    finding: >-
      Subpacket lengths are said to be "encoded similarly to a 1-octet, 2-octet, or 5-octet
      OpenPGP format packet header" but the decoding rule treats every first octet from 192 to
      254 as a 2-octet length, where a packet header uses 192..223 only (224..254 being partial
      lengths). First octets 224..254 in a subpacket length are thus 2-octet lengths 8384..16319,
      a form that cannot be produced by the packet-header encoder; generators and parsers can
      disagree.
  - id: SD-M07
    locator: "§5.2.3.31 lines 2580-2581, 2614-2616; Table 10"
    finding: >-
      Reason for Revocation is "used only in Key Revocation and Certification Revocation
      signatures", omitting Subkey Revocation (0x28), while the same section says to "include it
      in all Revocation Signatures" (R-0148); Table 10 marks codes 1-3 for "Key Revocation
      signatures" only, so their use on 0x28 is not stated.
  - id: SD-M08
    locator: "§5.2.4 lines 2777-2781"
    finding: >-
      Third-Party Confirmation hashing uses 0x88 followed by "the 4-octet length", and the
      source notes this "is a Legacy packet header for a Signature packet with the
      length-of-length field set to zero". Length-type 0 denotes a 1-octet length; a 4-octet
      length would be length-type 2 (0x8A). The constant is right (A.3.1-style test vectors are
      absent for 0x50); the explanation is not.
  - id: SD-M09
    locator: "§5.2.4 lines 2753-2758; §10.1.3 lines 5246-5248"
    finding: >-
      Absence: the key hash prefix is given for version 4 (0x99) and version 6 (0x9B)
      signatures only. Version 3 Subkey Binding signatures are permitted for v4 keys (§10.1.3)
      and v3 key revocations exist, but the data a v3 signature hashes over a key is not stated.
  - id: SD-M10
    locator: "§5.2.1.14 line 1638; §5.2.4"
    finding: >-
      Absence: §5.2.4 does not say what a Timestamp signature (0x40) hashes; §5.2.3.33 implies it
      can designate a target signature.
  - id: SD-M11
    locator: "§5.2.3.33 lines 2680-2691"
    finding: >-
      Absence: the Signature Target's N octets of "hash" have a stated size but no stated input;
      the data hashed to identify the target signature is not defined.
  - id: SD-M12
    locator: "§3.7.2.1 Table 2 lines 852-859, 885-888 vs §5.5.3 lines 3263-3267, 3299-3300"
    finding: >-
      Table 2 gives LegacyCFB and MalleableCFB as CFB(..., secrets || check(secrets)), but for
      version 3 keys the checksum "is stored in the clear", the MPI bit counts are not encrypted
      and CFB resynchronizes per MPI. Table 2 does not distinguish v3.
  - id: SD-M13
    locator: "§13.7 lines 6528-6530, 6549-6551 vs §5.13.2 lines 4166-4170"
    finding: >-
      §13.7 speaks of "the final zero-octet chunk"; §5.13.2 defines a final authentication tag
      over the empty string, not a chunk (the chunk index used for it is not stated, SD-M14).
  - id: SD-M14
    locator: "§5.13.2 lines 4166-4184"
    finding: >-
      Absence: the nonce of the final authentication tag is not stated. The test vectors (A.8.4,
      A.9.4, A.10.4, A.11.4) use the IV with the chunk index equal to the number of chunks.
  - id: SD-M15
    locator: "§6.2.2.3 lines 4458-4460"
    finding: >-
      "deferring to the hash algorithm indicated in the Embedded Signature": a cleartext signed
      message carries ordinary Signature packets, not an Embedded Signature subpacket; the hash
      algorithm is the Signature packet's own field.
  - id: SD-M16
    locator: "§7.1 lines 4500-4502"
    finding: >-
      "One or more legacy Hash Armor Headers that MAY be included" contradicts optionality (and
      §6.2.2.3's SHOULD NOT emit); it should read zero or more. A.6 has none.
  - id: SD-M17
    locator: "§6.2.1 Table 16 lines 4358-4374; §7.1 line 4497"
    finding: >-
      Absence: the cleartext header -----BEGIN PGP SIGNED MESSAGE----- is not in the Armor Header
      Lines registry.
  - id: SD-M18
    locator: "§7.2 lines 4544-4547"
    finding: >-
      Dash-escaping prefixes "-" and " " but the reverse rule says to "strip the string -", with
      the space lost (plain-text rendering); whether the following space is stripped is only
      implied by the warning for "-" followed by a non-space.
  - id: SD-M19
    locator: "§11.5 lines 5827-5857"
    finding: >-
      The session key is "padded to an 8-octet granularity using the method described in
      [RFC8018]", whose padding is 1 to 8 octets, yet the obfuscation paddings of 13, 14, 21
      and 22 octets are permitted (R-0356, R-0357). The padding rule a decoder must accept is
      thus wider than RFC 8018.
  - id: SD-M20
    locator: "§11.4 lines 5732-5746"
    finding: >-
      The KDF synopsis takes a point X = (x, y) and uses ZB = x; for Curve25519Legacy the shared
      secret is a Montgomery-curve value whose wire form is native little-endian; the octet
      string used as ZB for that curve is not stated.
  - id: SD-M21
    locator: "§9.5 lines 5098-5101"
    finding: >-
      SHA-1 exception "computing version 4 key fingerprints for purposes of the MDC in version 1
      Symmetrically Encrypted and Integrity Protected Data packets" conflates two uses of SHA-1
      (v4 fingerprints and the MDC); the MDC hashes plaintext, not fingerprints.
  - id: SD-M22
    locator: "Appendix A.7 lines 8084-8090; §5.9 lines 3803-3804"
    finding: >-
      The A.7 inline-signed message's Literal Data packet (decoded) has format u and LF (0x0A)
      line endings, contrary to "Text data MUST be encoded with UTF-8" and "stored with <CR><LF>
      text endings" (R-0213). The signature still verifies because 0x01 canonicalizes.
  - id: SD-M23
    locator: "§11.3.2 line 5712"
    finding: "\"the 2-bit count octets\" should be the 2-octet count."
  - id: SD-M24
    locator: "§10.3.2.1 Table 26 line 5471"
    finding: >-
      Table 26 lists a "v2 PKESK [RFC2440]" row; this document defines only versions 3 and 6
      (§5.1) and gives no v2 format.
  - id: SD-M25
    locator: "§5.2.3.22 line 2331"
    finding: "\"Used in conjunction with Trust Signature packets\": Trust Signature is a subpacket (§5.2.3.21)."
  - id: SD-M26
    locator: "§9.3 Table 21; §5.5.3 lines 3223-3225; §5.7; §5.13.1"
    finding: >-
      Absence: cipher block sizes, on which the CFB IV, the SED/v1 SEIPD prefix and the secret-key
      IV length depend, are not tabulated; only the AES-style examples (16 octets) and an 8-octet
      example are given.
  - id: SD-M27
    locator: "Appendix A.3.1 line 7735; A.8.3 line 8219; A.9.3 line 8388; A.12 line 8824"
    finding: >-
      Annotation typos in the test vectors: "hash ago"; a stray "S" before 0x0060; the salt row
      labelled 0x0005 (it starts at 0x0006); "m = 21" where m = 2^21 and encoded_m = 21.
  - id: SD-M28
    locator: "§5.1.1 lines 1289-1291"
    finding: >-
      The v3 PKESK's symmetric algorithm is described as the one "used to encrypt the v1 SEIPD
      packet", although §5.1.1 itself says a v3 PKESK may precede a SED packet in historic data.
  - id: SD-M29
    locator: "§5.2.3.15 lines 2216-2222; Table 21 line 4943"
    finding: >-
      The Preferred AEAD Ciphersuites example octets "09 02 09 03 13 02" are said to include
      Camellia-256 with OCB, but Camellia-256 is ID 13 decimal (0x0D); octet 0x13 is ID 19,
      unassigned. The example should read 0D 02.
  - id: SD-M30
    locator: "§5.2.4 line 2763 vs Table 4 line 1520"
    finding: "§5.2.4 names 0x20 \"Primary Key Revocation signatures\"; Table 4 names it Key Revocation Signature."
  - id: SD-M31
    locator: "Appendix A.1 lines 7599-7612"
    finding: >-
      A.1 gives "The entire Public Key packet" as 98 33 04 53 f3 ... (a Legacy-format header,
      line 7601) and then "The same packet represented in ASCII-armored form", but the armored
      base64 (xjME...) decodes to c6 33 04 53 f3 ..., an OpenPGP-format header. The 51-octet
      bodies are identical, so the fingerprint is unaffected; the two encodings of the header are
      not the same octets.

