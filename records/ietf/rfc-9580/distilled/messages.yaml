  # ----- what is hashed (§5.2.4) -----

  - name: signature-hash-input
    applies_to: "signature-v3, signature-v4, signature-v6 (computed, never transmitted)"
    source: "§5.2.4, lines 2739-2827; §5.2.3.6, lines 1835-1838; §5.2.4.1, lines 2829-2844"
    normative_status: computed
    encoding: computed
    description: >-
      One hash context receives, in order: the v6 salt, the signed data for the signature type
      (signature_types.hashes and the key, User ID and signature encodings below), then the
      version-specific trailer. "After all this has been hashed in a single hash context, the
      resulting hash field is used in the signature algorithm, and its first two octets are
      placed in the Signature packet".
    fields:
      - name: salt
        type: octets[saltlen]
        required: conditional
        required_when: version 6 ("the salt is fed into the hash context before any other data")
        constrained_by:
          - rfc-9580#R-0164
      - name: document
        type: octets[var]
        required: conditional
        required_when: sigtype 0x00 (raw octets) or 0x01 (canonical text); empty for 0x02
        constraints: >-
          "For binary document signatures (Type ID 0x00), the document data is hashed directly."
          For text signatures, "the implementation MUST first canonicalize the document by
          converting line endings to <CR><LF> and encoding it in UTF-8". A Standalone signature
          (0x02) "is calculated identically to a signature over a zero-length binary document."
        constrained_by:
          - rfc-9580#R-0165
          - rfc-9580#R-0166
          - rfc-9580#R-0047
      - name: primary-key
        type: key-hash-encoding
        required: conditional
        required_when: sigtype 0x10-0x13, 0x18, 0x19, 0x1F, 0x20, 0x28, 0x30
        constrained_by:
          - rfc-9580#R-0167
          - rfc-9580#R-0168
          - rfc-9580#R-0170
      - name: subkey
        type: key-hash-encoding
        required: conditional
        required_when: sigtype 0x18, 0x19, 0x28 (after the primary key)
        constrained_by:
          - rfc-9580#R-0169
          - rfc-9580#R-0171
      - name: user-id-or-attribute
        type: userid-hash-encoding
        required: conditional
        required_when: sigtype 0x10-0x13, and 0x30 when it revokes such a certification
        constrained_by:
          - rfc-9580#R-0172
          - rfc-9580#R-0055
      - name: confirmed-signature
        type: signature-hash-encoding
        required: conditional
        required_when: sigtype 0x50
        constrained_by:
          - rfc-9580#R-0173
      - name: trailer
        type: "signature-hash-trailer-v3 | signature-hash-trailer-v4-v6"
        required: true
        constrained_by:
          - rfc-9580#R-0174
          - rfc-9580#R-0175
          - rfc-9580#R-0176
          - rfc-9580#R-0177
    layout: >-
      [salt] || type-specific data || trailer. Worked examples: A.3.1 (Direct Key signature,
      lines 7691-7771: salt (32) || 9b 0000002a <42-octet key body> || 06 1f 1b 0a 00000042
      <66 octets> || 06 ff 0000004a) and the Subkey Binding signature (lines 7776-7854); A.6
      (Text signature, lines 8011-8069: salt || canonical text with 0d 0a line ends || 06 01 1b 0a
      00000029 <41 octets> || 06 ff 00000031).
    notes: >-
      Derived (recomputed): SHA2-256 over the A.2 input m (line 7620) gives d at line 7624, and
      SHA2-512 over the A.6 data gives the digest at lines 8073-8074, whose first two octets 69
      36 are the A.6 hash-left-16. The Timestamp signature (0x40) has no stated hash input
      (SD-M10).

  - name: key-hash-encoding
    applies_to: signature-hash-input (primary-key, subkey)
    source: "§5.2.4, lines 2753-2765"
    normative_status: computed
    encoding: computed
    variants:
      - when: version 4 signature
        layout: "0x99 || u16 length of the key packet body || key packet body"
        constrained_by:
          - rfc-9580#R-0167
      - when: version 6 signature
        layout: "0x9B || u32 length of the key packet body || key packet body (the salt is hashed before, not here)"
        constrained_by:
          - rfc-9580#R-0168
      - when: version 3 signature
        layout: not stated by the source (SD-M09)
    constraints: >-
      The key body is the Public Key (or Public Subkey) packet body from the version octet; a
      subkey "using the same format as the main key (also using 0x99 or 0x9B as the first
      octet)". Derived: for a Secret Key or Secret Subkey packet, only the public-key fields are
      hashed, as A.3.1 and A.4 share the signature packets.
    notes: >-
      Derived: the prefix octet follows the signature version, not the key version; Table 27
      ties v4 signatures to v4 keys and v6 to v6, so in conforming data they coincide. The 0x99
      form cannot carry a key body longer than 65535 octets.

  - name: userid-hash-encoding
    applies_to: signature-hash-input (user-id-or-attribute)
    source: "§5.2.4, lines 2767-2775"
    normative_status: computed
    encoding: computed
    variants:
      - when: version 3 certification
        layout: "User ID or User Attribute packet body, without the packet header"
      - when: version 4 or 6 certification of a User ID
        layout: "0xB4 || u32 length || User ID packet body"
      - when: version 4 or 6 certification of a User Attribute
        layout: "0xD1 || u32 length || User Attribute packet body"
    constrained_by:
      - rfc-9580#R-0172

  - name: signature-hash-encoding
    applies_to: "signature-hash-input (confirmed-signature, sigtype 0x50)"
    source: "§5.2.4, lines 2777-2784"
    normative_status: computed
    encoding: computed
    layout: >-
      [salt (v6 only, as for every v6 signature)] || 0x88 || u32 length || Signature packet body
      of the confirmed signature with its unhashed subpacket data removed and its unhashed
      subpacket length field set to zero.
    constrained_by:
      - rfc-9580#R-0173
    notes: >-
      "(Note that this is a Legacy packet header for a Signature packet with the length-of-length
      field set to zero.)" Length-type 0 denotes a 1-octet length, yet 4 octets follow (SD-M08).
      Derived: "the 4-octet length of the signature" is the length of the body as modified.

  - name: signature-hash-trailer-v3
    applies_to: signature-v3
    source: "§5.2.2, lines 1676-1681; §5.2.4, lines 2789-2791; §5.2.4.1, lines 2838-2839"
    normative_status: computed
    encoding: computed
    layout: "sigtype (1) || creation time (4)"
    constrained_by:
      - rfc-9580#R-0059
      - rfc-9580#R-0174
      - rfc-9580#R-0176
    notes: >-
      The fifth octet from the end of the hashed stream is the signature type, which "MUST NOT be
      Signature Type ID 0xFF" so that no v3 stream ends like a v4/v6 stream.

  - name: signature-hash-trailer-v4-v6
    applies_to: "signature-v4, signature-v6"
    source: "§5.2.4, lines 2793-2819; §5.2.4.1, lines 2841-2844"
    normative_status: computed
    encoding: computed
    fields:
      - name: version
        type: u8
        required: true
      - name: signature-type
        type: u8
        required: true
      - name: public-key-algorithm
        type: u8
        required: true
      - name: hash-algorithm
        type: u8
        required: true
      - name: hashed-subpacket-length
        type: "u16 (v4) | u32 (v6)"
        required: true
      - name: hashed-subpackets
        type: octets[hashed-subpacket-length]
        required: true
      - name: version-again
        type: u8
        required: true
        constraints: "a second version octet (0x04 for version 4, and 0x06 for version 6),"
      - name: sentinel
        type: u8
        value: "0xFF"
        required: true
      - name: hashed-length
        type: u32
        required: true
        constraints: >-
          "a number representing the length (in octets) of the hashed data from the Signature
          packet through the hashed subpacket body. This a 4-octet big-endian unsigned integer of
          the length modulo 2^32."
    layout: >-
      v4: 0x04 || sigtype || pkalgo || hashalgo || u16 hlen || hashed || 0x04 || 0xFF || u32
      (6 + hlen). v6: 0x06 || sigtype || pkalgo || hashalgo || u32 hlen || hashed || 0x06 || 0xFF
      || u32 (8 + hlen). A.2: 04 00 16 08 0006 05 02 55f95f95 04 ff 0000000c (line 7620).
    constrained_by:
      - rfc-9580#R-0075
      - rfc-9580#R-0175
      - rfc-9580#R-0177
    notes: >-
      Derived arithmetic check: A.2 6 + 6 = 12 = 0x0C; A.3.1 Direct Key 8 + 0x42 = 0x4A; A.3.1
      Subkey Binding 8 + 0x2C = 0x34; A.6 8 + 0x29 = 0x31. The trailer is the "6-octet trailer"
      of §5.2.3.6: version, 0xFF, u32.

  # ======================= §5.2.3.7 signature subpackets =======================

  - name: signature-subpacket
    applies_to: "hashed and unhashed areas of signature-v4 and signature-v6"
    source: "§5.2.3.7, lines 1862-1914; §5.2.3.8, lines 2016-2029; §5.2.3.9, lines 2031-2050; §5.2.3.10, lines 2052-2140; §13.13, lines 6784-6808"
    normative_status: current
    encoding: binary
    fields:
      - name: length
        type: body-length
        required: true
        constraints: >-
          "The subpacket length field covers the encoded Subpacket Type ID and the
          subpacket-specific data, and it does not include the subpacket length field itself."
          Decoding: first octet < 192: 1 octet; 192..254: 2 octets, ((o1 - 192) << 8) + o2 + 192;
          255: 5 octets, u32. A length that "diverges from the expected length" makes the
          signature malformed (§5.2.5).
        constrained_by:
          - rfc-9580#R-0078
      - name: type
        type: u8
        required: true
        constraints: >-
          Bit 7 "is the "critical" bit"; bits 6-0 are the Subpacket Type ID (Table 5). Unknown and
          critical: the evaluator "SHOULD consider the signature to be in error"; unknown and not
          critical: ignored. An unknown critical subpacket in the hashed area is listed among
          malformed signatures (§5.2.5).
        constrained_by:
          - rfc-9580#R-0079
          - rfc-9580#R-0080
          - rfc-9580#R-0081
      - name: data
        type: octets[length - 1]
        required: true
        constraints: Layout by type (the subpacket-* entries below).
    layout: >-
      length (1, 2 or 5) || C|type (1) || data. Example A.3.1 line 7737-7739: 05 82 63877fe3 =
      length 5, critical type 2 (Signature Creation Time).
    constrained_by:
      - rfc-9580#R-0082
      - rfc-9580#R-0083
      - rfc-9580#R-0084
      - rfc-9580#R-0085
      - rfc-9580#R-0086
      - rfc-9580#R-0417
      - rfc-9580#R-0418
    placement_rules: >-
      A subpacket may be in either area; "If a subpacket is not hashed, then the information in
      it cannot be considered definitive because it is not covered by the cryptographic
      signature." An implementation MAY synthesize an Issuer Fingerprint subpacket in the
      unhashed area (R-0417) and SHOULD ignore subpackets that are only useful hashed when found
      unhashed with unknown provenance (R-0418). Conflicts: "In most cases, an implementation
      SHOULD use the last subpacket in the hashed section of the signature".
    self_signature_scope: >-
      §5.2.3.10: subpackets in a certification self-signature apply to the User ID, in a subkey
      self-signature to the subkey, and on the Direct Key signature to the entire key. Preference
      subpackets are interpreted "as narrowly as possible". Multiple self-signatures: the most
      recent valid one is selected.
    self_signature_constrained_by:
      - rfc-9580#R-0087
      - rfc-9580#R-0088
      - rfc-9580#R-0089
      - rfc-9580#R-0092
      - rfc-9580#R-0093
      - rfc-9580#R-0094
      - rfc-9580#R-0095
      - rfc-9580#R-0096
      - rfc-9580#R-0097
      - rfc-9580#R-0098
      - rfc-9580#R-0099
      - rfc-9580#R-0100
    notes: >-
      The source says "The header consists of:" the length, the type "and" the subpacket-specific
      data (lines 1871-1878), placing the body inside the header (SD-M04). On the 192..254 range
      see body-length and SD-M06.

  - name: subpacket-reserved
    subpacket_type: "0, 1, 8, 13, 14, 15, 17, 18, 19, 34"
    source: "§5.2.3.7 Table 5, lines 1921-1923, 1937, 1950, 1954, 1985"
    normative_status: reserved
