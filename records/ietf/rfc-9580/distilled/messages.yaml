    normative_status: current
    generate: Yes (Table 26); SHOULD be used when every recipient supports it (R-0411).
    encoding: binary packet body
    fields:
      - name: version
        type: u8
        value: 2
        required: true
        constrained_by:
          - rfc-9580#R-0339
          - rfc-9580#R-0340
          - rfc-9580#R-0409
          - rfc-9580#R-0411
      - name: symmetric-algorithm
        type: u8
        required: true
        constraints: >-
          "A 1-octet cipher algorithm ID." Derived: a 16-octet-block cipher (EAX, OCB, GCM require it).
        constrained_by:
          - rfc-9580#R-0287
          - rfc-9580#R-0288
          - rfc-9580#R-0289
          - rfc-9580#R-0377
      - name: aead-algorithm
        type: u8
        required: true
        constraints: "1 EAX (nonce 16, tag 16), 2 OCB (nonce 15, tag 16), 3 GCM (nonce 12, tag 16)."
        constrained_by:
          - rfc-9580#R-0307
          - rfc-9580#R-0308
      - name: chunk-size
        type: u8
        required: true
        constraints: >-
          "chunk_size = (uint32_t) 1 << (c + 6)". "An implementation MUST accept chunk size
          octets with values from 0 to 16. An implementation MUST NOT create data with a chunk
          size octet value larger than 16 (4 MiB chunks)."
        constrained_by:
          - rfc-9580#R-0234
          - rfc-9580#R-0235
      - name: salt
        type: octets[32]
        required: true
        constraints: >-
          "The salt is used to derive the message key and MUST be securely generated (see Section
          13.10)." A fresh salt allows session-key reuse in replies (§13.8).
        constrained_by:
          - rfc-9580#R-0233
          - rfc-9580#R-0415
      - name: chunks
        type: "(octets[<= chunk_size] || tag (16))+"
        required: true
        constraints: >-
          "The encrypted data consists of the encryption of each chunk of plaintext, followed
          immediately by the relevant authentication tag. If the last chunk of plaintext is
          smaller than the chunk size, the ciphertext for that data may be shorter; nevertheless,
          it is followed by a full authentication tag."
        constrained_by:
          - rfc-9580#R-0406
          - rfc-9580#R-0408
      - name: final-tag
        type: octets[16]
        required: true
        constraints: >-
          "A final summary authentication tag for the AEAD mode." Computed over the empty string
          with AD || u64 total plaintext octets; "This allows detection of a truncated
          ciphertext."
        constrained_by:
          - rfc-9580#R-0408
    plaintext: >-
      The decrypted chunks concatenate to an Optionally Padded Message (OpenPGP Message,
      optionally followed by a Padding packet) (R-0331).
    key_derivation: seipd-v2-key-schedule
    layout: >-
      0x02 || cipher || aead || c || salt (32) || C_0 || T_0 || ... || C_{n-1} || T_{n-1} ||
      T_final. A.8.3 (lines 8198-8220): d2 69 | 02 07 02 06 | salt 6164...69a2 | 37-octet chunk
      #0 ciphertext | 16-octet tag #0 | 16-octet final tag.
    constrained_by:
      - rfc-9580#R-0331
      - rfc-9580#R-0334
      - rfc-9580#R-0335
      - rfc-9580#R-0405
    notes: >-
      Derived: ciphertext and plaintext lengths are equal for EAX, OCB and GCM, so a parser
      splits the body after the 36-octet header into ceil(P / chunk_size) chunks of (chunk_size
      + 16) octets, the last shorter, plus the 16-octet final tag. The source says the packet has
      "one or more chunks"; it does not say what an empty plaintext produces.

  - name: seipd-v2-key-schedule
    applies_to: seipd-v2
    source: "§5.13.2, lines 4129-4184"
    normative_status: computed
    encoding: computed
    fields:
      - name: hkdf-info
        type: octets[5]
        required: true
        constraints: >-
          Packet type octet in OpenPGP format (0xD2) || version (0x02) || cipher || aead ||
          chunk-size octet.
      - name: hkdf-output
        type: "octets[M/8 + N/8 - 8]"
        required: true
        constraints: >-
          HKDF-SHA256(IKM = session key, salt = packet salt, info); "The leftmost M bits are used
          as a symmetric algorithm key, and the remaining N - 64 bits are used as an IV." M =
          cipher key size, N = AEAD nonce size.
      - name: nonce
        type: octets[N/8]
        required: true
        constraints: >-
          "The leftmost N - 64 bits are the IV derived using HKDF. The rightmost 64 bits are the
          chunk index as a big-endian value. The index of the first chunk is zero."
      - name: chunk-ad
        type: octets[5]
        required: true
        constraints: >-
          The same five octets as hkdf-info: "the additional data of the first chunk using EAX and
          AES-128 with a chunk size of 2^22 octets consists of the octets 0xD2, 0x02, 0x07, 0x01,
          and 0x10."
      - name: final-ad
        type: octets[13]
        required: true
        constraints: chunk-ad || u64 total number of plaintext octets.
      - name: final-nonce
        type: octets[N/8]
        required: true
        constraints: >-
          Not stated by the source (SD-M14). Derived from A.8.4, A.9.4, A.10.4 and A.11.4: IV ||
          u64 number of chunks (the index after the last chunk).
    layout: >-
      A.8.4 (lines 8226-8279): info d2 02 07 02 06; HKDF output (23 octets) = message key 4512...fc42
      (16) || IV 5faf3250212ff9 (7); nonce #0 = IV || 00 x 8; final nonce = IV || 00..01; final
      AD = d2 02 07 02 06 || 00 00 00 00 00 00 00 25 (37 plaintext octets = 21 LIT + 16 PADDING).
    notes: >-
      Derived (recomputed): HKDF-SHA256 of the A.8.2 session key with the A.8.3 salt and info d2
      02 07 02 06, L = 23, gives the A.8.4 HKDF output. Unlike v6 SKESK and AEAD secret keys, the
      info includes the chunk-size octet. AEAD failure of any chunk or of the final tag: halt,
      release nothing (R-0406); truncation: error as soon as detected (R-0408). §13.7 calls the
      final tag a "final zero-octet chunk" (SD-M13).

  - name: padding
    packet_type: 21
    shorthand: PADDING
    source: "§5.14, lines 4211-4237; §13.11, lines 6752-6773; §10.1.5, lines 5339-5346"
    normative_status: current
