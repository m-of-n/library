    fields: []

  # ----- fingerprints and Key IDs (§5.5.4) -----

  - name: fingerprint-and-keyid
    source: "§5.5.4, lines 3318-3419; Table 12, lines 3326-3344; §14.1, lines 6869-6883"
    normative_status: computed
    encoding: computed
    variants:
      - key_version: 3
        fingerprint: "MD5(n value octets || e value octets), MPI bit counts excluded; 128 bits"
        key_id: low 64 bits of the RSA modulus n
      - key_version: 4
        fingerprint: "SHA-1(0x99 || u16 body length || Public Key packet body from the version octet); 160 bits"
        hash_material: "a.1) 0x99; a.2) 2-octet count of (b)-(e); b) version 4; c) creation time (4); d) algorithm (1); e) algorithm-specific fields"
        key_id: low-order 64 bits (last 8 octets) of the fingerprint
      - key_version: 6
        fingerprint: "SHA2-256(0x9B || u32 body length || Public Key packet body from the version octet); 256 bits"
        hash_material: "a.1) 0x9B; a.2) 4-octet count of (b)-(f); b) version 6; c) creation time (4); d) algorithm (1); e) 4-octet key-material count; f) algorithm-specific public key material"
        key_id: high-order 64 bits (first 8 octets) of the fingerprint
    constraints: >-
      Subkeys use the same computation, "including the 0x99 (version 4 key) or 0x9B (version 6
      key) as the first octet (even though this is not a valid Packet Type ID for a public
      subkey)." Secret packets are fingerprinted over their public fields (Derived). No part of
      a v6 fingerprint may be mapped into a constrained (for example 20-octet) fingerprint field
      unless that environment's specification gives explicit guidance distinguishing it from a
      v4 fingerprint (R-0420); such an implementation SHOULD recompute the v6 fingerprint from
      the key material instead (R-0421).
    constrained_by:
      - rfc-9580#R-0005
      - rfc-9580#R-0420
      - rfc-9580#R-0421
      - rfc-9580#R-0404
      - rfc-9580#R-0300
    examples: >-
      Recomputed: A.1 v4 key gives C959 BDBA FA32 A2F8 9A15 3B67 8CFD E121 9796 5A9A (line 7590),
      Key ID 8CFDE12197965A9A as in the A.2 Issuer Key ID subpacket; A.3 v6 primary gives
      CB186C4F...BAD9ACC9 and subkey 12C83F1E...A9930885 (lines 7664, 7668).
    notes: >-
      §5.5.4 says the Key ID "is only used in v3 PKESK packets", but Key IDs also appear in the
      Issuer Key ID subpacket, v3 OPS and v3 signatures (SD-M02). Same RSA material in v3, v4 and
      v6 keys yields different Key IDs and fingerprints.

