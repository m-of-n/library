flows:
  - name: "encrypt-and-sign-message"
    title: >-
      Public-key encryption of a message, optionally signed first: recipient key
      selection, container and algorithm choice from the recipients' certificates, session
      key generation, ESK construction, v2 SEIPD encryption, assembly and transfer
    locator: "§2.1, §5.1, §5.2.3.32, §5.3, §5.13.2, §5.14, §10.3, §10.3.2.1, §12.2, §13.7, §13.10"
    kind: "construction"
    participants:
      - "sender"
      - "keyring"
      - "recipient"
    summary: >-
      The sender's whole job, in the source's order (§2.1), with each choice wired to the
      rule that binds it. Nothing is negotiated with the recipient: every choice is read
      from the recipient's certificate. Steps 1 to 4 are selection, 5 to 9 build the
      plaintext Optionally Padded Message, 10 to 13 encrypt and assemble, 14 and 15 encode
      and hand over. The v2 SEIPD path (v6 PKESK, v6 SKESK) is the main line; the v1 SEIPD
      path (v3 PKESK, v4 SKESK) is given as message_alternatives. The source defines no
      sender-side error reporting: a sender that cannot meet an obligation simply must not
      produce the object.
    examples:
      - "Appendix A.8 (X25519, AES-128, OCB, v6 PKESK and v2 SEIPD)"
    steps:
      - n: "1"
        from: "keyring"
        to: "sender"
        message: "OpenPGP Version 6 Certificate"
        message_alternatives:
          - "OpenPGP Version 4 Certificate"
        action: >-
          Obtain each recipient's certificate and establish that it is the authentic,
          currently valid key of that recipient: a v6 key is usable only with a valid
          Direct Key signature; no User ID self-signature is needed unless the use depends
          on the User ID. How the certificate is found and authenticated is not defined.
        basis: "inferred"
        locator: "§11.5, §5.2.3.10, §2.1"
        quotes:
          - |-
            Obtain the authenticated recipient public key R
          - |-
            An implementation MUST ensure that a valid Direct Key signature is present before using a version 6 key.
        constrained_by:
          - "rfc-9580#R-0098"
          - "rfc-9580#R-0099"
        invokes:
          - "key-validity-evaluation"
        on_error: >-
          unspecified. A recipient with no valid certificate cannot be encrypted to; the
          source says nothing about whether to drop that recipient or abort the message.
        on_error_basis: "unspecified"
        note: >-
          The quoted line is the first step of the ECDH synopsis; the source states the
          precondition nowhere else in general terms. Key discovery is not_defined.
      - n: "2"
        from: "sender"
        to: "sender"
        message: "OpenPGP Version 6 Certificate"
        subpackets:
          - "Key Flags"
        action: >-
          In each recipient certificate select the encryption key or keys: a primary key or
          bound subkey whose Key Flags allow communications (0x04) or storage (0x08)
          encryption, which is not expired or revoked, and whose algorithm and size may
          still be used for encryption.
        basis: "inferred"
        locator: "§5.2.3.29, §10.1.5, §11.5.1, §12.4, §12.6"
        quotes:
          - |-
            This key may be used to encrypt communications.
          - |-
            This key may be used to encrypt storage.
          - |-
            However, note that determining what is "communications" and what is "storage" is a thorny issue. This decision is left wholly up to the implementation;
          - |-
            In general, subkeys are provided in cases where the top-level public key is a certification-only key.
        constrained_by:
          - "rfc-9580#R-0360"
          - "rfc-9580#R-0385"
          - "rfc-9580#R-0386"
          - "rfc-9580#R-0391"
        on_error: >-
          unspecified. No rule says what to do when a certificate has no usable encryption
          key, or several (the source does not say whether to encrypt to all of them).
        on_error_basis: "unspecified"
      - n: "3"
        from: "sender"
        to: "sender"
        message: "OpenPGP Version 6 Certificate"
        subpackets:
          - "Features"
        action: >-
          Choose the encryption container. v2 SEIPD when every recipient key advertises it
          in Features, or every recipient key is v6 with no Features subpacket, or support
          can otherwise be inferred; otherwise v1 SEIPD may be used. Never SED. The choice
          fixes the ESK versions (step 10 and 11): one row of Table 26.
        basis: "stated"
        locator: "§13.7, §5.2.3.7, §5.2.3.32, §10.3.2.1"
        quotes:
          - |-
            To avoid these circumstances, an implementation that generates OpenPGP encrypted data SHOULD select the encrypted container format with the most robust protections that can be handled by the intended recipients.
          - |-
            The SED packet is deprecated and MUST NOT be generated.
        constrained_by:
          - "rfc-9580#R-0085"
          - "rfc-9580#R-0152"
          - "rfc-9580#R-0336"
          - "rfc-9580#R-0341"
          - "rfc-9580#R-0342"
          - "rfc-9580#R-0409"
          - "rfc-9580#R-0410"
          - "rfc-9580#R-0411"
          - "rfc-9580#R-0412"
        invokes:
          - "preference-negotiation"
        on_error: >-
          not applicable: v1 SEIPD is always an allowed fallback for recipients without v2
          support (R-0412).
        on_error_basis: "stated"
      - n: "4"
        from: "sender"
        to: "sender"
        message: "OpenPGP Version 6 Certificate"
        subpackets:
          - "Preferred AEAD Ciphersuites"
          - "Preferred Symmetric Ciphers for v1 SEIPD"
          - "Preferred Compression Algorithms"
        action: >-
          Choose the algorithms from the intersection of the recipients' preferences, read
          from hashed subpackets of the self-signature that applies (the Direct Key
          signature of a v6 key, or the self-signature of the User ID the key was located
          by): for v2 SEIPD a (cipher, AEAD mode) pair, with AES-128/OCB implicitly last; for
          v1 SEIPD a cipher, with AES-128 tacitly last; and a compression algorithm, with
          Uncompressed tacitly last. Never a cipher outside the recipients' lists, never
          IDEA, TripleDES or CAST5, never algorithm 0.
        basis: "stated"
        locator: "§5.2.3.14, §5.2.3.15, §5.2.3.17, §5.2.3.10, §12.2, §12.2.1, §12.3.1, §9.3, §13.13, §5.2.3.7"
        quotes:
          - |-
            It is assumed that only the combinations of algorithms listed are supported by the recipient's implementation, with the exception of the mandatory-to-implement combination of AES-128 and OCB.
          - |-
            When generating a v2 SEIPD packet, this preference list is not relevant. See Section 5.2.3.15 instead.
        constrained_by:
          - "rfc-9580#R-0084"
          - "rfc-9580#R-0089"
          - "rfc-9580#R-0106"
          - "rfc-9580#R-0289"
          - "rfc-9580#R-0373"
          - "rfc-9580#R-0374"
          - "rfc-9580#R-0375"
          - "rfc-9580#R-0377"
          - "rfc-9580#R-0378"
          - "rfc-9580#R-0418"
        invokes:
          - "preference-negotiation"
        on_error: >-
          not applicable: the intersection is never empty because AES-128 (and AES-128/OCB,
          and Uncompressed) is implicitly in every list.
        on_error_basis: "stated"
      - n: "5"
        from: "sender"
        to: "sender"
        message: "Encrypted Message"
        action: >-
          Generate a fresh random session key for this message alone, of the size the
          chosen cipher needs, from a CSPRNG. (The only sanctioned exception is the
          session-key-reuse reply, flow session-key-reuse-reply.)
        basis: "stated"
        locator: "§2.1, §13.10"
        quotes:
          - |-
            Each symmetric key is used only once, for a single object. A new "session key" is generated as a random number for each object (sometimes referred to as a "session").
          - |-
            OpenPGP requires a cryptographically secure pseudorandom number generator (CSPRNG).
        constrained_by:
          - "rfc-9580#R-0415"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "6"
        from: "sender"
        to: "sender"
        message: "One-Pass Signed Message"
        message_alternatives:
          - "Signed Message"
        subpackets:
          - "Intended Recipient Fingerprint"
        action: >-
          If the message is also to be signed, sign first (flow sign-message-inline), so
          that the signature ends up inside the encryption; include an Intended Recipient
          Fingerprint subpacket for each recipient primary key, critical in a v6
          signature.
        basis: "stated"
        locator: "§2.1, §5.2.3.36, §13.12, §5.2.3.7"
        quotes:
          - |-
            Both digital signature and confidentiality services may be applied to the same message. First, a signature is generated for the message and attached to the message. Then, the message plus signature is encrypted using a symmetric message key derived from the session key.
        constrained_by:
          - "rfc-9580#R-0083"
          - "rfc-9580#R-0162"
          - "rfc-9580#R-0163"
          - "rfc-9580#R-0416"
        on_error: "see flow sign-message-inline."
        on_error_basis: "inferred"
      - n: "7"
        from: "sender"
        to: "sender"
        message: "Literal Data Packet"
        action: >-
          (Unsigned case; in the signed case step 6 already produced it.) Wrap the content in
          a Literal Data packet in OpenPGP packet format: format octet b, or u only for text
          known to be UTF-8; text in UTF-8 with CR LF line endings; empty file name and zero
          date recommended; t not to be emitted (SHOULD NOT); _CONSOLE not recommended.
        basis: "stated"
        locator: "§5.9, §5.9.1"
        constrained_by:
          - "rfc-9580#R-0210"
          - "rfc-9580#R-0213"
          - "rfc-9580#R-0215"
          - "rfc-9580#R-0216"
          - "rfc-9580#R-0217"
          - "rfc-9580#R-0218"
          - "rfc-9580#R-0219"
          - "rfc-9580#R-0220"
          - "rfc-9580#R-0222"
          - "rfc-9580#R-0223"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "8"
        from: "sender"
        to: "sender"
        message: "Compressed Data Packet"
        action: >-
          Optionally compress the message (the Literal Data packet, or the whole signed
          message) with an algorithm in the recipients' preferences, framed in OpenPGP
          packet format; never use algorithm 0 in a Compressed Data packet.
        basis: "stated"
        locator: "§2.1, §2.3, §5.6, §12.3.1, §12.3.1.1"
        quotes:
          - |-
            The sending OpenPGP implementation optionally compresses the message and then encrypts it using a message key derived from the session key.
        constrained_by:
          - "rfc-9580#R-0001"
          - "rfc-9580#R-0203"
          - "rfc-9580#R-0204"
          - "rfc-9580#R-0378"
          - "rfc-9580#R-0380"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "9"
        from: "sender"
        to: "sender"
        message: "Padding Packet"
        action: >-
          Optionally append a Padding packet of random octets as the last packet of the
          Optionally Padded Message that will be encrypted in the v2 SEIPD packet, to hide
          the plaintext length. How much padding is out of scope.
        basis: "stated"
        locator: "§5.14, §10.3, §13.11"
        quotes:
          - |-
            Policy about how large to make such a packet to defend against traffic analysis is beyond the scope of this document.
        constrained_by:
          - "rfc-9580#R-0237"
          - "rfc-9580#R-0238"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "10"
        from: "sender"
        to: "sender"
        message: "Public Key Encrypted Session Key Packet v6"
        message_alternatives:
          - "Public Key Encrypted Session Key Packet v3"
        action: >-
          For each selected recipient key build one PKESK: v6 (fingerprint of the key or
          subkey, or size 0 for an anonymous recipient) before v2 SEIPD, v3 (Key ID, or all
          zeros) before v1 SEIPD. Encrypt the session key with the key's algorithm: X25519
          and X448 by ephemeral ECDH, HKDF and AES key wrap; ECDH per §11.5 with the
          announced KDF and KEK; RSA with a fresh PKCS#1 encoding per key. A v3 PKESK
          also carries the cipher ID (encrypted, or in clear for X25519/X448, which then
          must be AES). No Elgamal v6 PKESK.
        basis: "stated"
        locator: "§5.1, §5.1.1, §5.1.2, §5.1.3, §5.1.4, §5.1.6, §5.1.7, §5.1.8, §11.5, §3.2, §9.5, §12.1.1"
        quotes:
          - |-
            The encryption container is preceded by one Public Key Encrypted Session Key packet for each OpenPGP Key to which the message is encrypted.
          - |-
            No symmetric key encryption algorithm identifier is passed to the public key algorithm for a v6 PKESK packet, as it is included in the v2 SEIPD packet.
          - |-
            Wipe the memory that contained S, v, and Z to avoid leaking ephemeral secrets
        constrained_by:
          - "rfc-9580#R-0004"
          - "rfc-9580#R-0035"
          - "rfc-9580#R-0036"
          - "rfc-9580#R-0037"
          - "rfc-9580#R-0038"
          - "rfc-9580#R-0039"
          - "rfc-9580#R-0040"
          - "rfc-9580#R-0041"
          - "rfc-9580#R-0042"
          - "rfc-9580#R-0302"
          - "rfc-9580#R-0353"
          - "rfc-9580#R-0354"
          - "rfc-9580#R-0355"
          - "rfc-9580#R-0356"
          - "rfc-9580#R-0357"
          - "rfc-9580#R-0358"
          - "rfc-9580#R-0360"
          - "rfc-9580#R-0362"
          - "rfc-9580#R-0363"
          - "rfc-9580#R-0364"
          - "rfc-9580#R-0365"
        on_error: >-
          stated for RSA only: EME-PKCS1-v1_5 encoding outputs "message too long" and stops
          when the session key does not fit (R-0363). Otherwise unspecified.
        on_error_basis: "stated"
      - n: "11"
        from: "sender"
        to: "sender"
        message: "Symmetric Key Encrypted Session Key Packet v6"
        message_alternatives:
          - "Symmetric Key Encrypted Session Key Packet v4"
        action: >-
          For each passphrase that may also open the message, build one SKESK (see flow
          passphrase-encryption for the details): v6 with S2K, HKDF-derived KEK and AEAD
          encryption of the session key before v2 SEIPD; v4 with a salted S2K before v1
          SEIPD. Argon2 recommended; never Simple S2K.
        basis: "stated"
        locator: "§3.7.2, §3.7.2.2, §5.3, §5.3.1, §5.3.2"
        quotes:
          - |-
            This allows a message to be encrypted to a number of public keys, and also to one or more passphrases.
        constrained_by:
          - "rfc-9580#R-0011"
          - "rfc-9580#R-0013"
          - "rfc-9580#R-0181"
          - "rfc-9580#R-0182"
          - "rfc-9580#R-0183"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "12"
        from: "sender"
        to: "sender"
        message: "Symmetrically Encrypted and Integrity Protected Data Packet v2"
        message_alternatives:
          - "Symmetrically Encrypted and Integrity Protected Data Packet v1"
        action: >-
          Encrypt the Optionally Padded Message. v2: generate a 32-octet random salt; HKDF-
          SHA256 (IKM session key, salt, info = packet type octet, version, cipher, AEAD,
          chunk size) yields the message key and the nonce prefix; encrypt chunk by chunk
          (chunk index in the nonce, the five header octets as additional data), each chunk
          followed by its tag, then a final tag over the empty string with the total
          plaintext length appended to the additional data; chunk size octet at most 16. v1:
          CFB with a zero IV over block-size random octets plus two repeated octets, the
          plaintext, 0xD3 0x14 and the SHA-1 MDC. Partial body lengths are allowed for
          this packet.
        basis: "stated"
        locator: "§5.13.1, §5.13.2, §4.2.1.4, §13.10, §12.2.1, §12.9"
        quotes:
          - |-
            After the final chunk, the AEAD algorithm is used to produce a final authentication tag encrypting the empty string. This AEAD instance is given the additional data specified above, plus an 8-octet, big-endian value specifying the total number of plaintext octets encrypted. This allows detection of a truncated ciphertext.
          - |-
            The rightmost 64 bits are the chunk index as a big-endian value. The index of the first chunk is zero.
        constrained_by:
          - "rfc-9580#R-0027"
          - "rfc-9580#R-0028"
          - "rfc-9580#R-0029"
          - "rfc-9580#R-0230"
          - "rfc-9580#R-0233"
          - "rfc-9580#R-0235"
          - "rfc-9580#R-0377"
          - "rfc-9580#R-0399"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "13"
        from: "sender"
        to: "sender"
        message: "Encrypted Message"
        action: >-
          Assemble the Encrypted Message: the ESK sequence (all PKESK and SKESK packets, in
          any order) followed by the SEIPD packet, every packet version from the single
          Table 26 row chosen in step 3, no critical packet outside the grammar, OpenPGP
          packet format only.
        basis: "stated"
        locator: "§10, §10.3, §10.3.2.1, §4.2, §4.2.2"
        quotes:
          - |-
            Encrypted Message: Encrypted Data | ESK Sequence, Encrypted Data.
        constrained_by:
          - "rfc-9580#R-0024"
          - "rfc-9580#R-0030"
          - "rfc-9580#R-0310"
          - "rfc-9580#R-0337"
          - "rfc-9580#R-0338"
          - "rfc-9580#R-0339"
          - "rfc-9580#R-0340"
          - "rfc-9580#R-0341"
          - "rfc-9580#R-0342"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "14"
        from: "sender"
        to: "sender"
        message: "ASCII Armor"
        action: >-
          Optionally armor for a text-only channel: BEGIN PGP MESSAGE header line, no
          Version header (SHOULD NOT be emitted), base64 in lines of at most 76 characters, no CRC24 footer (an
          armored message ending in a v2 SEIPD packet must not carry one).
        basis: "stated"
        locator: "§6, §6.1, §6.2, §6.2.1, §6.2.2.1, §2.4"
        constrained_by:
          - "rfc-9580#R-0002"
          - "rfc-9580#R-0240"
          - "rfc-9580#R-0245"
          - "rfc-9580#R-0246"
          - "rfc-9580#R-0247"
          - "rfc-9580#R-0252"
          - "rfc-9580#R-0253"
          - "rfc-9580#R-0257"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "15"
        from: "sender"
        to: "recipient"
        message: "Encrypted Message"
        message_alternatives:
          - "ASCII Armor"
        action: >-
          Hand the message to the recipients over any channel. The session key travels in
          the ESK packets at the front of the message; nothing else is exchanged.
        basis: "stated"
        locator: "§2.1, §2.4"
        quotes:
          - |-
            The session key is encrypted using each recipient's public key. These "encrypted session keys" start the message.
        on_error: >-
          unspecified. No transport, delivery confirmation or error return is defined.
        on_error_basis: "unspecified"
        status: "not-defined"
  - name: "decrypt-and-verify-message"
    title: >-
      Receiving an OpenPGP Message: dearmor, parse, ESK alignment, session key recovery,
      integrity-checked decryption, unwrapping, decompression, signature verification and
      release of the literal data
    locator: "§2.1, §2.2, §5.1.8, §5.7, §5.9, §5.13, §10.3, §10.3.1, §10.3.2, §12.2, §13.4, §13.5, §13.7"
    kind: "consumption"
    participants:
      - "sender"
      - "recipient"
      - "verifier"
    summary: >-
      The recipient's processing, the mirror of encrypt-and-sign-message. The source is
      explicit about failure here: no release of unauthenticated plaintext from AEAD data,
      a mandatory clear error for malleable ciphertext, rejection of out-of-grammar critical
      packets and of overlong lengths, and a forward-compatible rule that a bad signature is
      ignored, never fatal. The order is the order the layers must be peeled; each layer's
      own procedure is an algorithm.
    examples:
      - "Appendix A.8 to A.11 (v2 SEIPD with OCB, EAX, GCM)"
      - "Appendix A.12 (v4 SKESK with Argon2 and v1 SEIPD)"
    steps:
      - n: "1"
        from: "sender"
        to: "recipient"
        message: "Encrypted Message"
        message_alternatives:
          - "ASCII Armor"
          - "Signed Message"
          - "Compressed Message"
          - "Literal Message"
        action: >-
          Receive an OpenPGP Message by some channel. It may be encrypted, signed,
          compressed or bare literal data; the top-level grammar decides.
        basis: "stated"
        locator: "§10.3"
        quotes:
          - |-
            OpenPGP Message: Encrypted Message | Signed Message | Compressed Message | Literal Message.
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "2"
        from: "recipient"
        to: "recipient"
        message: "ASCII Armor"
        action: >-
          If armored, decode the armor: find the header line, skip Armor Headers (unknown
          keys ignored), base64-decode ignoring whitespace, ignore the CRC24 footer whatever
          its state.
        basis: "stated"
        locator: "§6, §6.1, §6.2"
        constrained_by:
          - "rfc-9580#R-0241"
          - "rfc-9580#R-0244"
          - "rfc-9580#R-0255"
          - "rfc-9580#R-0256"
        invokes:
          - "armor-decoding"
        on_error: >-
          Improperly formatted Armor Headers may be treated as corruption, but the
          implementation SHOULD try to recover (R-0255). A bad or missing CRC24 MUST NOT
          cause rejection (R-0244).
        on_error_basis: "stated"
      - n: "3"
        from: "recipient"
        to: "recipient"
        message: "Encrypted Message"
        action: >-
          Parse the octets into packets and check the sequence against the message grammar.
          An unknown or out-of-grammar critical packet rejects the whole sequence; unknown
          non-critical packets and Marker packets are skipped.
        basis: "stated"
        locator: "§4.1, §4.3, §5.8, §10, §10.3"
        constrained_by:
          - "rfc-9580#R-0020"
          - "rfc-9580#R-0021"
          - "rfc-9580#R-0022"
          - "rfc-9580#R-0032"
          - "rfc-9580#R-0033"
          - "rfc-9580#R-0209"
          - "rfc-9580#R-0309"
          - "rfc-9580#R-0311"
        invokes:
          - "packet-stream-parsing"
          - "message-grammar-parsing"
        on_error: >-
          Reject the whole packet sequence with an error (R-0032, R-0311); a packet whose
          subfield overruns its header length is malformed and unusable (R-0021).
        on_error_basis: "stated"
      - n: "4"
        from: "recipient"
        to: "recipient"
        message: "Encrypted Message"
        action: >-
          Discard every ESK packet whose version does not align with the payload: before a v2
          SEIPD keep only v6 PKESK and v6 SKESK; before a v1 SEIPD (or SED) keep only v3
          PKESK and v4 SKESK (before a historic SED, Table 26 also lists the v2 PKESK of
          RFC 2440, which this document does not define).
        basis: "stated"
        locator: "§10.3.2.1"
        constrained_by:
          - "rfc-9580#R-0343"
        on_error: >-
          unspecified when nothing is left: the source does not say what to report when no
          aligned ESK remains.
        on_error_basis: "unspecified"
      - n: "5"
        from: "recipient"
        to: "recipient"
        message: "Public Key Encrypted Session Key Packet v6"
        message_alternatives:
          - "Public Key Encrypted Session Key Packet v3"
          - "Symmetric Key Encrypted Session Key Packet v6"
          - "Symmetric Key Encrypted Session Key Packet v4"
        action: >-
          Recover the session key: find a PKESK addressed (by fingerprint or Key ID) to a
          secret key the recipient holds, or for an anonymous PKESK try every available
          private key; unlock the secret key; decrypt and check the session key. Otherwise
          try the SKESK packets with a passphrase obtained from the user.
        basis: "stated"
        locator: "§2.1, §5.1, §5.1.8, §5.3, §13.5, §3.2, §3.3"
        quotes:
          - |-
            In this case, the receiving implementation would try all available private keys, checking for a valid decrypted session key.
        constrained_by:
          - "rfc-9580#R-0003"
          - "rfc-9580#R-0005"
          - "rfc-9580#R-0042"
          - "rfc-9580#R-0403"
        invokes:
          - "secret-key-unlock"
          - "session-key-recovery"
        on_error: >-
          One error code for every PKESK processing failure and for SEIPD integrity
          failures, in constant time if the attacker can measure timing (§13.5). If no ESK
          yields a session key the message cannot be decrypted; the reporting is not
          specified.
        on_error_basis: "stated"
      - n: "6"
        from: "recipient"
        to: "recipient"
        message: "Symmetrically Encrypted and Integrity Protected Data Packet v2"
        action: >-
          Decrypt a v2 SEIPD: derive message key and nonce prefix, decrypt and authenticate
          every chunk, then check the final tag over the total length. Accept chunk size
          octets 0 to 16.
        basis: "stated"
        locator: "§5.13.2, §13.7"
        constrained_by:
          - "rfc-9580#R-0234"
          - "rfc-9580#R-0406"
          - "rfc-9580#R-0408"
        invokes:
          - "seipd-v2-decryption"
        on_error: >-
          A failed tag: do not parse or release decrypted data, halt with an error
          (R-0406). Truncation (no final zero-octet chunk): a streaming implementation may
          already have released fully authenticated chunks but must give a clear error as
          soon as truncation is detected (R-0408).
        on_error_basis: "stated"
      - n: "7"
        from: "recipient"
        to: "recipient"
        message: "Symmetrically Encrypted and Integrity Protected Data Packet v1"
        action: >-
          Decrypt a v1 SEIPD: CFB with a zero IV using the cipher named by the ESK, then
          verify the MDC (SHA-1 over prefix, plaintext and 0xD3 0x14) before using any
          plaintext. Use the quick check, if at all, without exposing timing or error
          detail.
        basis: "stated"
        locator: "§5.13.1, §13.4, §13.7"
        constrained_by:
          - "rfc-9580#R-0231"
          - "rfc-9580#R-0232"
          - "rfc-9580#R-0405"
          - "rfc-9580#R-0407"
        invokes:
          - "seipd-v1-decryption"
        on_error: >-
          MDC mismatch: the message has been modified, a security problem (R-0231); report
          it (R-0232); a clear integrity error, no parsing or release, halt (R-0405), unless
          it is known historic data and the user accepts the risk (R-0407).
        on_error_basis: "stated"
      - n: "8"
        from: "recipient"
        to: "recipient"
        message: "Symmetrically Encrypted Data Packet"
        action: >-
          A SED payload (historic data only): reject it and stop, or, if processing it
          anyway, warn clearly that non-integrity-protected data was processed.
        basis: "stated"
        locator: "§5.7, §10.3.2.1, §13.7"
        constrained_by:
          - "rfc-9580#R-0207"
          - "rfc-9580#R-0208"
          - "rfc-9580#R-0405"
          - "rfc-9580#R-0407"
        on_error: >-
          SHOULD reject and stop (R-0207); if processed, MUST warn (R-0208). All SED packets
          count as malleable ciphertext (§13.7), so R-0405 applies.
        on_error_basis: "stated"
        status: "deprecated"
      - n: "9"
        from: "recipient"
        to: "recipient"
        message: "Encrypted Message"
        action: >-
          Warn where the source asks: a cipher outside the keyholder's own preferences
          (decrypt anyway), a deprecated cipher (IDEA, TripleDES, CAST5), an RSA key under
          3072 bits or an Elgamal key used to decrypt.
        basis: "stated"
        locator: "§12.2, §9.3, §12.4, §12.6"
        constrained_by:
          - "rfc-9580#R-0290"
          - "rfc-9580#R-0291"
          - "rfc-9580#R-0376"
          - "rfc-9580#R-0387"
          - "rfc-9580#R-0392"
        on_error: "Decrypt, with the warning (R-0376: MUST warn)."
        on_error_basis: "stated"
      - n: "10"
        from: "recipient"
        to: "recipient"
        message: "Optionally Padded Message"
        action: >-
          Unwrap: parse the decrypted octets as a new packet stream that ends exactly at the
          end of the plaintext. v2 SEIPD must yield an Optionally Padded Message, v1 SEIPD
          (or SED) an OpenPGP Message. Ignore Padding packets.
        basis: "stated"
        locator: "§10.3.1, §5.14"
        constrained_by:
          - "rfc-9580#R-0236"
          - "rfc-9580#R-0239"
          - "rfc-9580#R-0331"
          - "rfc-9580#R-0332"
          - "rfc-9580#R-0334"
          - "rfc-9580#R-0335"
        invokes:
          - "message-grammar-parsing"
        on_error: >-
          A packet whose length runs past the unwrapped stream is malformed and unusable
          (R-0335). A result that is not a valid message violates R-0331/R-0332; the
          consequence is the grammar rule (reject the sequence, R-0311).
        on_error_basis: "stated"
      - n: "11"
        from: "recipient"
        to: "recipient"
        message: "Compressed Data Packet"
        action: >-
          Decompress (Uncompressed, ZIP, ZLIB, BZip2), parse the result as an OpenPGP
          Message, and limit the number of nested compression layers.
        basis: "stated"
        locator: "§5.6, §9.4, §10.3.1, §13.7, §13.14"
        quotes:
          - |-
            Within any encrypted container, any Compressed Data packet (Section 5.6) where there is a decompression failure.
        constrained_by:
          - "rfc-9580#R-0293"
          - "rfc-9580#R-0294"
          - "rfc-9580#R-0295"
          - "rfc-9580#R-0333"
          - "rfc-9580#R-0405"
          - "rfc-9580#R-0419"
        on_error: >-
          A decompression failure inside an encrypted container is malleable ciphertext:
          clear integrity error, no release, halt (R-0405). Exceeding the layer limit:
          unspecified beyond the limit itself.
        on_error_basis: "stated"
      - n: "12"
        from: "recipient"
        to: "verifier"
        message: "One-Pass Signed Message"
        message_alternatives:
          - "Signed Message"
        subpackets:
          - "Intended Recipient Fingerprint"
        action: >-
          If the message is signed, verify each signature (flow sign-message-inline gives
          the structure). A signature carrying Intended Recipient Fingerprint subpackets is
          valid only if the message was encrypted to one of the listed primary keys or
          their subkeys.
        basis: "stated"
        locator: "§2.2, §5.2.3.36, §5.2.5, §10.3"
        constrained_by:
          - "rfc-9580#R-0161"
          - "rfc-9580#R-0178"
          - "rfc-9580#R-0179"
          - "rfc-9580#R-0180"
        invokes:
          - "signature-verification"
        on_error: >-
          A malformed, unknown or invalid signature is ignored for validation, never
          reported as valid, and does not stop processing or invalidate other signatures
          (R-0178 to R-0180).
        on_error_basis: "stated"
      - n: "13"
        from: "recipient"
        to: "recipient"
        message: "Literal Data Packet"
        action: >-
          Release the literal data: text (u, or legacy t read as UTF-8) has CR LF converted
          to native line endings; the format octet, file name and date are not covered by
          any signature and must not be presented or used as authenticated; _CONSOLE is
          advisory only.
        basis: "stated"
        locator: "§5.9, §5.9.1"
        quotes:
          - |-
            These should be converted to native line endings by the receiving implementation.
          - |-
            Note that OpenPGP signatures do not include the formatting octet, the file name, and the date field of the Literal Data packet in a signature hash; therefore, those fields are not protected against tampering in a signed document.
        constrained_by:
          - "rfc-9580#R-0211"
          - "rfc-9580#R-0212"
          - "rfc-9580#R-0214"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "14"
        from: "verifier"
        to: "recipient"
        message: "One-Pass Signed Message"
        action: >-
          Report the outcome locally: which signatures validated (possibly none), any
          integrity or deprecation warnings. "No successful signatures" is a normal result.
        basis: "stated"
        locator: "§5.2.5"
        quotes:
          - |-
            Producing an output that indicates that no successful signatures were found is preferable to aborting processing entirely.
        constrained_by:
          - "rfc-9580#R-0179"
        on_error: "not applicable."
        on_error_basis: "stated"
  - name: "sign-message-inline"
    title: >-
      Inline signing of a message with the one-pass construction: key and hash choice,
      salt, One-Pass Signature packet, literal data, hashing, subpackets, Signature packet,
      bracketing of several signatures
    locator: "§2.2, §5.2, §5.2.3, §5.2.3.11, §5.2.3.35, §5.2.4, §5.4, §10.3, §10.3.2.2, §12.3.2, §12.7, §13.2"
    kind: "construction"
    participants:
      - "signer"
      - "keyring"
      - "verifier"
    summary: >-
      A Signed Message is either Signature then message, or the one-pass form
      OPS, message, Signature, which lets the signer stream: the OPS announces the hash
      algorithm, salt and key so the verifier can hash while reading. The signature
      version is dictated by the key version (v6 key, v6 signature and v6 OPS; v4 key, v4
      signature and v3 OPS). The verifier side is algorithm signature-verification.
    examples:
      - "Appendix A.7 (inline-signed v6 message)"
    steps:
      - n: "1"
        from: "keyring"
        to: "signer"
        message: "Secret Key Packet v6"
        message_alternatives:
          - "Secret Subkey Packet v6"
        subpackets:
          - "Key Flags"
        action: >-
          Select a signing key: the primary key or a bound signing subkey (with its Primary
          Key Binding back-signature) that is valid now and whose Key Flags allow signing
          data (0x02); unlock its secret material. No DSA, no Elgamal signatures, no RSA
          under 2048 bits (3072 recommended), no Ed25519Legacy in v6.
        basis: "inferred"
        locator: "§5.2.3.29, §10.1.5, §12.4, §12.5, §12.8, §5.2.3.3.1"
        quotes:
          - |-
            This key may be used to sign data.
        constrained_by:
          - "rfc-9580#R-0068"
          - "rfc-9580#R-0326"
          - "rfc-9580#R-0385"
          - "rfc-9580#R-0386"
          - "rfc-9580#R-0389"
          - "rfc-9580#R-0398"
        invokes:
          - "key-validity-evaluation"
          - "secret-key-unlock"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "signer"
        to: "signer"
        message: "Signature Packet v6 (type 0x00)"
        subpackets:
          - "Preferred Hash Algorithms"
        action: >-
          Choose the hash algorithm: the signer's choice, guided by the recipient's
          Preferred Hash Algorithms where the recipient is known, with SHA2-256 tacitly
          acceptable; at least the digest size the key algorithm requires (DSA q bits,
          ECDSA and EdDSALegacy fsize, P-521 512 bits, Ed25519 256, Ed448 512); never MD5,
          SHA-1 or RIPEMD-160.
        basis: "stated"
        locator: "§12.3.2, §5.2.3.2, §5.2.3.3, §5.2.3.4, §5.2.3.5, §9.5, §13"
        quotes:
          - |-
            Thus, if Alice is authenticating herself to Bob with a signature, it makes sense for her to use a hash algorithm that Bob's implementation uses.
          - |-
            However, the signer would be foolish to use a weak algorithm simply because the recipient requests it.
        constrained_by:
          - "rfc-9580#R-0062"
          - "rfc-9580#R-0064"
          - "rfc-9580#R-0066"
          - "rfc-9580#R-0070"
          - "rfc-9580#R-0073"
          - "rfc-9580#R-0297"
          - "rfc-9580#R-0301"
          - "rfc-9580#R-0381"
        invokes:
          - "preference-negotiation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "signer"
        to: "signer"
        message: "Signature Packet v6 (type 0x00)"
        action: >-
          Fix the signature version from the key version (v6 for a v6 key, v4 for a v4 key,
          never v3) and, for v6, draw a new random salt of the size Table 23 gives for the
          hash (16, 24 or 32 octets).
        basis: "stated"
        locator: "§5.2, §5.2.3, §10.3.2.2, §13.2, §9.5"
        quotes:
          - |-
            By selecting a new random salt for each signature made, the signed hashes and the signatures are not predictable.
        constrained_by:
          - "rfc-9580#R-0043"
          - "rfc-9580#R-0044"
          - "rfc-9580#R-0045"
          - "rfc-9580#R-0060"
          - "rfc-9580#R-0344"
          - "rfc-9580#R-0346"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "signer"
        to: "signer"
        message: "One-Pass Signature Packet v6"
        message_alternatives:
          - "One-Pass Signature Packet v3"
        action: >-
          Emit the One-Pass Signature packet: signature type, hash and public-key algorithm,
          (v6) salt equal to the Signature packet's and the 32-octet signing key fingerprint,
          (v3) the Key ID, and the nested flag (0 means another OPS for the same data
          follows). OPS v6 for a v6 signature, OPS v3 for a v4 signature.
        basis: "stated"
        locator: "§5.4, §10.3.2.2"
        quotes:
          - |-
            The One-Pass Signature packet precedes the signed data and contains enough information to allow the receiver to begin calculating any hashes needed to verify the signature.
          - |-
            A zero value indicates that the next packet is another One-Pass Signature packet that describes another signature to be applied to the same message data.
        constrained_by:
          - "rfc-9580#R-0184"
          - "rfc-9580#R-0185"
          - "rfc-9580#R-0186"
          - "rfc-9580#R-0345"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "5"
        from: "signer"
        to: "signer"
        message: "Literal Data Packet"
        message_alternatives:
          - "Compressed Data Packet"
        action: >-
          Emit the signed content as an OpenPGP Message, normally a Literal Data packet (u
          allowed when a text signature 0x01 follows), possibly inside a Compressed Data
          packet.
        basis: "stated"
        locator: "§5.9, §10.3"
        quotes:
          - |-
            One-Pass Signed Message: One-Pass Signature Packet, OpenPGP Message, Corresponding Signature Packet.
        constrained_by:
          - "rfc-9580#R-0216"
          - "rfc-9580#R-0217"
          - "rfc-9580#R-0219"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "6"
        from: "signer"
        to: "signer"
        message: "Signature Packet v6 (type 0x00)"
        message_alternatives:
          - "Signature Packet v6 (type 0x01)"
        action: >-
          Hash: the salt first (v6), then the document (binary as is; text canonicalised to
          UTF-8 with CR LF), then the signature fields from the version octet through the
          hashed subpackets, then the trailer (version, 0xFF, 4-octet length).
        basis: "stated"
        locator: "§5.2.4, §5.2.1.1, §5.2.1.2"
        constrained_by:
          - "rfc-9580#R-0047"
          - "rfc-9580#R-0164"
          - "rfc-9580#R-0165"
          - "rfc-9580#R-0166"
          - "rfc-9580#R-0175"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "7"
        from: "signer"
        to: "signer"
        message: "Signature Packet v6 (type 0x00)"
        subpackets:
          - "Signature Creation Time"
          - "Issuer Fingerprint"
          - "Issuer Key ID"
          - "Signature Expiration Time"
          - "Intended Recipient Fingerprint"
          - "Notation Data"
          - "Signer's User ID"
          - "Policy URI"
        action: >-
          Fill the hashed subpacket area (part of what step 6 hashes): Signature Creation
          Time (mandatory, critical recommended), Issuer Fingerprint (recommended in every
          signature; the version octet equals the signature version), no Issuer Key ID in a
          signature by a key above v4, optional Signature Expiration Time (critical),
          Intended Recipient Fingerprint when the message will be encrypted, Notation Data
          with undefined flags zero and IETF names without @. The unhashed area carries
          only advisory data.
        basis: "stated"
        locator: "§5.2.3.6, §5.2.3.11, §5.2.3.12, §5.2.3.18, §5.2.3.24, §5.2.3.35, §5.2.3.36, §13.13"
        constrained_by:
          - "rfc-9580#R-0077"
          - "rfc-9580#R-0101"
          - "rfc-9580#R-0102"
          - "rfc-9580#R-0103"
          - "rfc-9580#R-0108"
          - "rfc-9580#R-0136"
          - "rfc-9580#R-0137"
          - "rfc-9580#R-0138"
          - "rfc-9580#R-0157"
          - "rfc-9580#R-0158"
          - "rfc-9580#R-0159"
          - "rfc-9580#R-0162"
          - "rfc-9580#R-0163"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "8"
        from: "signer"
        to: "signer"
        message: "Signature Packet v6 (type 0x00)"
        message_alternatives:
          - "Signature Packet v6 (type 0x01)"
          - "Signature Packet v4 (type 0x00)"
        action: >-
          Sign the digest and emit the Signature packet after the content: left 16 bits of
          the digest, (v6) salt, algorithm-specific fields. Ed25519 and Ed448 sign the
          digest with PureEdDSA (Ed448 with an empty context), RSA uses EMSA-PKCS1-v1_5 with
          the Table 24 prefix, ECDSA and DSA take the possibly truncated digest.
        basis: "stated"
        locator: "§5.2.3, §5.2.3.1, §5.2.3.2, §5.2.3.4, §5.2.3.5, §12.1.3, §12.7"
        constrained_by:
          - "rfc-9580#R-0063"
          - "rfc-9580#R-0368"
          - "rfc-9580#R-0369"
          - "rfc-9580#R-0370"
          - "rfc-9580#R-0371"
          - "rfc-9580#R-0372"
          - "rfc-9580#R-0393"
          - "rfc-9580#R-0394"
          - "rfc-9580#R-0395"
          - "rfc-9580#R-0396"
        on_error: >-
          stated for RSA only: EMSA-PKCS1-v1_5 outputs "message too long" or "intended
          encoded message length too short" and stops (R-0368, R-0370).
        on_error_basis: "stated"
      - n: "9"
        from: "signer"
        to: "signer"
        message: "One-Pass Signed Message"
        action: >-
          With several signatures over the same data, nest the OPS packets (nested flag 0
          on all but the last) and emit the Signature packets in reverse order, so the
          first Signature after the data matches the last OPS.
        basis: "stated"
        locator: "§5.4"
        quotes:
          - |-
            Note that if a message contains more than one one-pass signature, then the Signature packets bracket the message; that is, the first Signature packet after the message corresponds to the last One-Pass Signature packet and the final Signature packet corresponds to the first One-Pass Signature packet.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "10"
        from: "signer"
        to: "signer"
        message: "Signed Message"
        action: >-
          Alternative form without one-pass: the Signature packet precedes the message.
          The signer must have hashed the whole content before emitting anything.
        basis: "inferred"
        locator: "§10.3, §5.4"
        quotes:
          - |-
            Signed Message: Signature Packet, OpenPGP Message | One-Pass Signed Message.
          - |-
            It allows the Signature packet to be placed at the end of the message so that the signer can compute the entire signed message in one pass.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "11"
        from: "signer"
        to: "verifier"
        message: "One-Pass Signed Message"
        message_alternatives:
          - "Signed Message"
          - "Encrypted Message"
          - "ASCII Armor"
        action: >-
          Transfer the signed message, either alone (armored with no CRC24 footer when every
          Signature packet is v6) or as the plaintext of encrypt-and-sign-message.
        basis: "stated"
        locator: "§2.2, §6.1"
        quotes:
          - |-
            The signature is attached to or transmitted alongside the message.
        constrained_by:
          - "rfc-9580#R-0248"
        on_error: "unspecified. No channel is defined."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "12"
        from: "verifier"
        to: "verifier"
        message: "One-Pass Signed Message"
        action: >-
          The verifier hashes the content as it streams, using the hash algorithm and salt
          the OPS announced, matches each Signature to its OPS, and verifies. A version
          mismatch between OPS and Signature invalidates that signature only.
        basis: "stated"
        locator: "§5.4, §5.2.5, §10.3.2.2"
        constrained_by:
          - "rfc-9580#R-0347"
          - "rfc-9580#R-0178"
          - "rfc-9580#R-0180"
        invokes:
          - "signature-verification"
        on_error: >-
          The mismatched or invalid signature is discarded (R-0347) and ignored for
          validation (R-0178); the rest of the stream is processed (R-0180).
        on_error_basis: "stated"
  - name: "detached-signature"
    title: >-
      Detached signature: one or more Signature packets stored apart from the data they sign,
      made and verified over data each side obtains by its own means
    locator: "§10.4, §5.2.1.1, §5.2.1.2, §5.2.4, §6.1, §6.2.1, §7.3"
    kind: "transfer"
    participants:
      - "signer"
      - "verifier"
    summary: >-
      The signature and the data travel separately; the grammar is only "one or more
      Signature packets", with Marker and Padding packets allowed anywhere. The source
      recommends a detached signature (or a signed message) over the Cleartext Signature
      Framework when whitespace is meaningful or the text is large. How the verifier pairs
      a signature with its data is not defined.
    steps:
      - n: "1"
        from: "signer"
        to: "signer"
        message: "Signature Packet v6 (type 0x00)"
        message_alternatives:
          - "Signature Packet v6 (type 0x01)"
        action: >-
          Select key, hash, version and salt and fill the subpackets as in
          sign-message-inline steps 1 to 3 and 7; hash the file data directly (binary) or
          canonicalised (text), then the signature trailer; sign.
        basis: "stated"
        locator: "§5.2.4, §5.2.1.1, §5.2.1.2, §5.2"
        constrained_by:
          - "rfc-9580#R-0043"
          - "rfc-9580#R-0060"
          - "rfc-9580#R-0101"
          - "rfc-9580#R-0157"
          - "rfc-9580#R-0165"
          - "rfc-9580#R-0166"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "signer"
        to: "signer"
        message: "Detached Signature"
        action: >-
          Emit the Signature packet (or several, from different keys) as a separate object;
          Marker and Padding packets may appear anywhere in it.
        basis: "stated"
        locator: "§10.4"
        quotes:
          - |-
            These detached signatures are simply one or more Signature packets stored separately from the data for which they are a signature.
          - |-
            In addition, a Marker packet (Section 5.8) and a Padding packet (Section 5.14) can appear anywhere in the sequence.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "signer"
        to: "signer"
        message: "ASCII Armor"
        action: >-
          Optionally armor under BEGIN PGP SIGNATURE; no CRC24 footer when every Signature
          packet is v6.
        basis: "stated"
        locator: "§6.1, §6.2.1, §7.3"
        quotes:
          - |-
            Either of these alternatives may be ASCII-armored (see Section 6.2) if they need to be transmitted across a text-only (or 7-bit clean) channel.
        constrained_by:
          - "rfc-9580#R-0248"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "signer"
        to: "verifier"
        message: "Detached Signature"
        action: >-
          Distribute the signature beside the data (for example a program bundle carrying a
          file and its signature file). Neither the channel nor the pairing of signature and
          data is defined.
        basis: "stated"
        locator: "§10.4"
        quotes:
          - |-
            For example, a program bundle may contain a file, and with it a second file that is a detached signature of the first file.
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "Detached Signature"
        action: >-
          Parse the signature sequence (only Signature packets, plus Marker and Padding),
          obtain the data, hash it as the Signature Type ID says, and verify each signature.
        basis: "stated"
        locator: "§10.4, §2.2, §5.2.5, §10"
        quotes:
          - |-
            The receiving implementation obtains a copy of the message and the message signature.
        constrained_by:
          - "rfc-9580#R-0178"
          - "rfc-9580#R-0179"
          - "rfc-9580#R-0180"
          - "rfc-9580#R-0311"
        invokes:
          - "signature-verification"
        on_error: >-
          A non-Signature critical packet in the sequence rejects it (R-0311). An invalid
          signature is ignored and does not affect the others (R-0178 to R-0180).
        on_error_basis: "stated"
  - name: "cleartext-signature"
    title: >-
      Cleartext Signature Framework: canonicalising, dash-escaping and armoring a text
      signature so the text stays readable, and the verifier's header and unescaping rules
    locator: "§7, §7.1, §7.2, §7.3, §6.2.2.3, §5.2.1.2"
    kind: "transfer"
    participants:
      - "signer"
      - "verifier"
    summary: >-
      A Text Signature (0x01) carried with the text it signs, readable without OpenPGP
      tools. Not reversible: trailing whitespace is stripped before signing and verifying.
      The verifier's defences are header-based: only a well-formed Hash header may sit
      between the BEGIN line and the empty line, and its contents are ignored. The
      verification procedure is algorithm cleartext-signature-verification.
    examples:
      - "Appendix A.6 (dash-escaped cleartext with a v6 signature)"
    steps:
      - n: "1"
        from: "signer"
        to: "signer"
        message: "Cleartext Signed Message"
        action: >-
          Decide whether the framework is safe for this text: not for text with meaningful
          whitespace (for example unified diffs) and not for very large text; use a signed
          message or a detached signature instead.
        basis: "stated"
        locator: "§7.3"
        quotes:
          - |-
            Since creating a cleartext signed message involves trimming trailing whitespace on every line, the Cleartext Signature Framework will fail to safely round-trip any textual stream that may include semantically meaningful whitespace.
        constrained_by:
          - "rfc-9580#R-0275"
        on_error: "Use sign-message-inline or detached-signature instead (R-0275)."
        on_error_basis: "stated"
      - n: "2"
        from: "signer"
        to: "signer"
        message: "Signature Packet v6 (type 0x01)"
        action: >-
          Canonicalise the text: UTF-8, trailing spaces and tabs removed from every line, CR
          LF line endings, the line ending before the signature not included; compute a
          Text Signature over it.
        basis: "stated"
        locator: "§7.1, §5.2.1.2, §5.2.4"
        constrained_by:
          - "rfc-9580#R-0047"
          - "rfc-9580#R-0166"
          - "rfc-9580#R-0265"
          - "rfc-9580#R-0266"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "signer"
        to: "signer"
        message: "Cleartext Signed Message"
        action: >-
          Write the BEGIN PGP SIGNED MESSAGE line; a Hash header only for a v4 signature
          with a SHA2 digest that a legacy verifier needs; an empty line.
        basis: "stated"
        locator: "§7.1, §6.2.2.3"
        quotes:
          - |-
            The cleartext header -----BEGIN PGP SIGNED MESSAGE----- on a single line.
        constrained_by:
          - "rfc-9580#R-0258"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "signer"
        to: "signer"
        message: "Cleartext Signed Message"
        action: >-
          Dash-escape the text: prefix "- " to every line beginning with a dash (MUST), to
          lines beginning "From " (SHOULD), to any other line (MAY). The digest is over the
          unescaped text.
        basis: "stated"
        locator: "§7.2"
        constrained_by:
          - "rfc-9580#R-0268"
          - "rfc-9580#R-0269"
          - "rfc-9580#R-0270"
          - "rfc-9580#R-0271"
          - "rfc-9580#R-0272"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "5"
        from: "signer"
        to: "signer"
        message: "ASCII Armor"
        action: >-
          Append a line ending and the armored signature(s) under BEGIN PGP SIGNATURE /
          END PGP SIGNATURE; no CRC24 footer for v6 signatures.
        basis: "stated"
        locator: "§7.1, §6.1, §6.2.1"
        quotes:
          - |-
            The ASCII-armored signature(s), including the -----BEGIN PGP SIGNATURE----- Armor Header and Armor Tail Lines.
        constrained_by:
          - "rfc-9580#R-0248"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "6"
        from: "signer"
        to: "verifier"
        message: "Cleartext Signed Message"
        action: "Transfer the cleartext signed message over a text channel (mail, web page)."
        basis: "inferred"
        locator: "§7"
        quotes:
          - |-
            It is desirable to be able to sign a textual octet stream without ASCII armoring the stream itself, so the signed text is still readable with any tool capable of rendering text.
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "7"
        from: "verifier"
        to: "verifier"
        message: "Cleartext Signed Message"
        action: >-
          Verify: reject the header block unless it holds only well-formed Hash headers (and
          then ignore them), undo the dash-escaping, canonicalise as the signer did, verify
          the Text Signature.
        basis: "stated"
        locator: "§7.1, §7.2, §6.2.2.3"
        constrained_by:
          - "rfc-9580#R-0259"
          - "rfc-9580#R-0260"
          - "rfc-9580#R-0264"
          - "rfc-9580#R-0267"
          - "rfc-9580#R-0273"
          - "rfc-9580#R-0274"
        invokes:
          - "cleartext-signature-verification"
        on_error: >-
          Any other Armor Header, or a non-conformant Hash header: decline to validate any
          signature in the message (R-0259, R-0267). A "-" followed by anything but a space
          at line start: warn (R-0274).
        on_error_basis: "stated"
  - name: "passphrase-encryption"
    title: >-
      Symmetric (passphrase) encryption of a message: shared passphrase out of band, S2K,
      v6 SKESK with HKDF and AEAD (or v4 SKESK), v2 SEIPD (or v1), and the recipient's
      session key recovery
    locator: "§2.1, §3.7, §3.7.2, §3.7.2.2, §5.3, §5.3.1, §5.3.2, §13.4"
    kind: "transfer"
    participants:
      - "sender"
      - "recipient"
    summary: >-
      Same container as public-key encryption, with the session key protected by a key
      derived from a passphrase. The v6 SKESK authenticates the session key with an AEAD
      tag, so a wrong passphrase is detected cleanly; the v4 SKESK has no integrity check,
      which is why the v1 SEIPD quick check exists and why it is dangerous. A v4 SKESK may
      even omit the encrypted session key, in which case the S2K output is the session key.
    examples:
      - "Appendix A.9 to A.11 (v6 SKESK with EAX, OCB, GCM)"
      - "Appendix A.12 (v4 SKESK with Argon2)"
    steps:
      - n: "1"
        from: "sender"
        to: "recipient"
        message: "passphrase"
        action: "Agree a passphrase by some means outside OpenPGP."
        basis: "inferred"
        locator: "§2.1"
        quotes:
          - |-
            When using symmetric key encryption, a similar process as described above is used, but the session key is encrypted with a symmetric algorithm derived from a shared secret.
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "out-of-band"
      - n: "2"
        from: "sender"
        to: "sender"
        message: "Symmetric Key Encrypted Session Key Packet v6"
        action: >-
          Build the S2K Specifier: Argon2 recommended (16-octet salt unique per passphrase,
          t and p non-zero, encoded m from 3+ceil(log2 p) to 31), Iterated and Salted with a
          high count otherwise; never Simple; Salted only for high-entropy strings; no MD5,
          SHA-1 or RIPEMD-160.
        basis: "stated"
        locator: "§3.7.1, §3.7.1.4, §3.7.2, §9.5"
        constrained_by:
          - "rfc-9580#R-0006"
          - "rfc-9580#R-0007"
          - "rfc-9580#R-0008"
          - "rfc-9580#R-0009"
          - "rfc-9580#R-0010"
          - "rfc-9580#R-0011"
          - "rfc-9580#R-0012"
          - "rfc-9580#R-0013"
          - "rfc-9580#R-0014"
          - "rfc-9580#R-0303"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "sender"
        to: "sender"
        message: "Symmetric Key Encrypted Session Key Packet v6"
        message_alternatives:
          - "Symmetric Key Encrypted Session Key Packet v4"
        action: >-
          v6: KEK = HKDF-SHA256(IKM = S2K output, no salt, info = 0xC3, 6, cipher, AEAD);
          encrypt the session key with the AEAD mode under a fresh IV, additional data the
          same four octets, one tag. v4: encrypt cipher ID and session key with the S2K
          output in CFB with a zero IV (salt required), or omit the encrypted session key
          and use the S2K output as the session key.
        basis: "stated"
        locator: "§5.3.1, §5.3.2"
        quotes:
          - |-
            A key-encryption key (KEK) is derived using HKDF [RFC5869] with SHA256 [RFC6234] as the hash algorithm. The Initial Keying Material (IKM) for HKDF is the key derived from S2K. No salt is used.
          - |-
            For example, the additional data used with AES-128 with OCB consists of the octets 0xC3, 0x06, 0x07, and 0x02.
        constrained_by:
          - "rfc-9580#R-0181"
          - "rfc-9580#R-0182"
          - "rfc-9580#R-0183"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "sender"
        to: "sender"
        message: "Encrypted Message"
        action: >-
          Encrypt and assemble exactly as encrypt-and-sign-message steps 7 to 14 (SKESK v6
          with v2 SEIPD, SKESK v4 with v1 SEIPD), possibly mixed with PKESK packets of the
          same row.
        basis: "stated"
        locator: "§3.7.2.2, §10.3.2.1"
        quotes:
          - |-
            This allows a message to be decrypted with either a passphrase or a public key pair.
        constrained_by:
          - "rfc-9580#R-0337"
          - "rfc-9580#R-0342"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "5"
        from: "sender"
        to: "recipient"
        message: "Encrypted Message"
        action: "Transfer the message."
        basis: "inferred"
        locator: "§2.1"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "6"
        from: "recipient"
        to: "recipient"
        message: "Symmetric Key Encrypted Session Key Packet v6"
        message_alternatives:
          - "Symmetric Key Encrypted Session Key Packet v4"
        action: >-
          Ask the user for the passphrase, run the S2K, derive the KEK and decrypt the
          session key (v6: verify the AEAD tag). For v4 there is no check: a wrong
          passphrase shows only later, by the v1 SEIPD quick check or MDC.
        basis: "stated"
        locator: "§5.3.1, §5.3.2, §13.4, §9.5"
        quotes:
          - |-
            This check was intended for early detection of session key decryption errors, particularly to detect a wrong passphrase, since v4 SKESK packets do not include an integrity check.
        constrained_by:
          - "rfc-9580#R-0304"
        invokes:
          - "session-key-recovery"
        on_error: >-
          v6: tag failure means wrong passphrase or tampering; the source does not
          distinguish or prescribe the report. v4: see seipd-v1-decryption.
        on_error_basis: "unspecified"
      - n: "7"
        from: "recipient"
        to: "recipient"
        message: "Symmetrically Encrypted and Integrity Protected Data Packet v2"
        message_alternatives:
          - "Symmetrically Encrypted and Integrity Protected Data Packet v1"
        action: "Decrypt and unwrap as decrypt-and-verify-message steps 6 to 13."
        basis: "stated"
        locator: "§5.13, §10.3.1"
        invokes:
          - "seipd-v2-decryption"
          - "seipd-v1-decryption"
        on_error: "As decrypt-and-verify-message steps 6 and 7."
        on_error_basis: "stated"
  - name: "key-generation-and-certificate-construction"
    title: >-
      Generating an OpenPGP v6 key and building its certificate: primary key, secret key
      protection, Direct Key self-signature, optional User IDs, subkeys with Subkey Binding
      and Primary Key Binding signatures, padding, export and distribution
    locator: "§5.2.1.8, §5.2.1.9, §5.2.1.10, §5.2.3.10, §5.5, §10.1, §10.1.1, §10.1.5, §10.2, §12.4 to §12.6, §13.7"
    kind: "construction"
    participants:
      - "keyholder"
      - "keyring"
      - "key-server"
      - "sender"
      - "verifier"
    summary: >-
      The keyholder is the only producer of a certificate's structural signatures. A v6
      certificate is Primary Key, Direct Key self-signature(s), optional User IDs with
      their certifications, Subkeys each followed by Subkey Binding signature(s), optional
      Padding; the key-wide metadata (flags, expiry, features, preferences) lives in the
      Direct Key signature. A signing subkey must cross-sign the primary key (the
      embedded Primary Key Binding signature). v4 differences are noted per step. The
      source defines the object; how it reaches correspondents is not defined.
    examples:
      - "Appendix A.3 (v6 certificate: Ed25519 primary, Direct Key signature, X25519 subkey, Subkey Binding)"
      - "Appendix A.4 and A.5 (the matching Transferable Secret Key, unlocked and locked)"
    steps:
      - n: "1"
        from: "keyholder"
        to: "keyholder"
        message: "Public Key Packet v6"
        action: >-
          Generate the primary key as a v6 key with a signature-capable algorithm (Ed25519
          is mandatory to implement, Ed448 recommended). Do not generate v4 keys (SHOULD
          NOT), v3 or v2 keys, RSA keys (SHOULD NOT; never under 3072 bits), DSA, Elgamal,
          RSA Sign-Only or Encrypt-Only, Elgamal-signature keys, or legacy curves and OIDs in
          v6. Use a CSPRNG.
        basis: "stated"
        locator: "§5.5.2, §9.1, §9.2, §10.1.5, §12.4, §12.5, §12.6, §12.8, §13.10, §5.5.5.6.1.1"
        quotes:
          - |-
            This is because the primary key needs to be able to create self-signatures (see Section 5.2.3.10).
        constrained_by:
          - "rfc-9580#R-0187"
          - "rfc-9580#R-0188"
          - "rfc-9580#R-0189"
          - "rfc-9580#R-0190"
          - "rfc-9580#R-0198"
          - "rfc-9580#R-0277"
          - "rfc-9580#R-0278"
          - "rfc-9580#R-0279"
          - "rfc-9580#R-0280"
          - "rfc-9580#R-0281"
          - "rfc-9580#R-0282"
          - "rfc-9580#R-0286"
          - "rfc-9580#R-0323"
          - "rfc-9580#R-0382"
          - "rfc-9580#R-0383"
          - "rfc-9580#R-0384"
          - "rfc-9580#R-0388"
          - "rfc-9580#R-0390"
          - "rfc-9580#R-0397"
          - "rfc-9580#R-0415"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "keyholder"
        to: "keyring"
        message: "Secret Key Packet v6"
        action: >-
          Store the secret part in a Secret Key packet: unprotected (usage 0) or, with a
          passphrase, S2K usage 253 (AEAD, with Argon2 allowed) or 254 (CFB with SHA-1); AEAD
          recommended for v6. Never 255 (MalleableCFB) in v6, never a bare cipher ID, never
          Argon2 outside usage 253, only rows of Table 2 marked Generate.
        basis: "stated"
        locator: "§3.7.2.1, §5.5.3, §13.7, §9.5"
        constrained_by:
          - "rfc-9580#R-0015"
          - "rfc-9580#R-0016"
          - "rfc-9580#R-0018"
          - "rfc-9580#R-0191"
          - "rfc-9580#R-0192"
          - "rfc-9580#R-0193"
          - "rfc-9580#R-0195"
          - "rfc-9580#R-0303"
          - "rfc-9580#R-0413"
          - "rfc-9580#R-0414"
        invokes:
          - "secret-key-unlock"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "keyholder"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x1F)"
        subpackets:
          - "Signature Creation Time"
          - "Issuer Fingerprint"
          - "Key Flags"
          - "Key Expiration Time"
          - "Features"
          - "Preferred AEAD Ciphersuites"
          - "Preferred Symmetric Ciphers for v1 SEIPD"
          - "Preferred Hash Algorithms"
          - "Preferred Compression Algorithms"
          - "Key Server Preferences"
          - "Preferred Key Server"
        action: >-
          Make the Direct Key self-signature over the primary key (hash: salt, 0x9B, 4-octet
          length, key body) carrying, in the hashed area, the key-wide metadata: Key Flags
          (certify 0x01, sign 0x02 as wanted; critical), Key Expiration Time (critical; zero
          or absent means never), Features (v2 SEIPD 0x08 and v1 SEIPD 0x01), the four
          preference lists, key server preferences. A v6 key is unusable without it.
        basis: "stated"
        locator: "§5.2.1.10, §5.2.3.10, §5.2.3.13, §5.2.3.29, §5.2.3.32, §5.2.4, §10.1.1, §5.2.3.7, §5.2.3.11, §5.2.3.25, §5.2.3.35, §12.3.1"
        quotes:
          - |-
            Note that a version 6 key uses a self-signed Direct Key signature to store algorithm preferences.
        constrained_by:
          - "rfc-9580#R-0082"
          - "rfc-9580#R-0097"
          - "rfc-9580#R-0098"
          - "rfc-9580#R-0101"
          - "rfc-9580#R-0104"
          - "rfc-9580#R-0105"
          - "rfc-9580#R-0140"
          - "rfc-9580#R-0144"
          - "rfc-9580#R-0145"
          - "rfc-9580#R-0153"
          - "rfc-9580#R-0157"
          - "rfc-9580#R-0168"
          - "rfc-9580#R-0315"
          - "rfc-9580#R-0379"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "keyholder"
        to: "keyholder"
        message: "User ID Packet"
        message_alternatives:
          - "User Attribute Packet"
          - "Signature Packet v6 (type 0x13)"
        subpackets:
          - "Primary User ID"
        action: >-
          Optionally add User ID packets (UTF-8, conventionally an RFC 2822 name-addr) and
          User Attribute packets, each followed by a certification self-signature (0x10 to
          0x13, positive 0x13 is the usual) over the primary key and the User ID (0xB4,
          4-octet length, the User ID). One may be flagged Primary User ID. For a v4 key
          this self-signature carries the key-wide metadata instead of a Direct Key
          signature.
        basis: "stated"
        locator: "§5.11, §5.12, §5.2.3.10, §5.2.3.27, §5.2.4, §10.1.5"
        quotes:
          - |-
            A User ID packet consists of UTF-8 text that is intended to represent the name and email address of the keyholder.
          - |-
            The self-signature is a statement, "My name X is tied to my signing key K", and it is corroborated by other users' certifications.
        constrained_by:
          - "rfc-9580#R-0087"
          - "rfc-9580#R-0096"
          - "rfc-9580#R-0099"
          - "rfc-9580#R-0141"
          - "rfc-9580#R-0172"
          - "rfc-9580#R-0226"
          - "rfc-9580#R-0324"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "5"
        from: "keyholder"
        to: "keyholder"
        message: "Public Subkey Packet v6"
        message_alternatives:
          - "Secret Subkey Packet v6"
        action: >-
          Generate subkeys, all v6 under a v6 primary: conventionally an encryption subkey
          (X25519 mandatory to implement) and optionally signing or authentication subkeys;
          separate subkeys per operation are good practice.
        basis: "stated"
        locator: "§5.5.1.2, §10.1.1, §10.1.5, §13, §9.1, §11.5.1"
        quotes:
          - |-
            It is good practice to use separate subkeys for every operation (i.e., signature-only, encryption-only, authentication-only keys, etc.).
          - |-
            Using a single key for encrypting and signing is discouraged.
        constrained_by:
          - "rfc-9580#R-0277"
          - "rfc-9580#R-0312"
          - "rfc-9580#R-0359"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "6"
        from: "keyholder"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x19)"
        action: >-
          For each subkey that can sign: make, with the subkey, a Primary Key Binding
          signature over the primary key and the subkey (both hashed with 0x9B and their
          lengths). It will be embedded in the binding signature of step 7.
        basis: "stated"
        locator: "§5.2.1.9, §5.2.1.8, §5.2.4, §10.1.5"
        quotes:
          - |-
            This signature is a statement by a signing subkey, indicating that it is owned by the primary key.
        constrained_by:
          - "rfc-9580#R-0049"
          - "rfc-9580#R-0169"
          - "rfc-9580#R-0326"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "7"
        from: "keyholder"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x18)"
        subpackets:
          - "Key Flags"
          - "Key Expiration Time"
          - "Embedded Signature"
        action: >-
          Bind each subkey with a Subkey Binding signature made by the primary key over the
          primary key and the subkey: Key Flags for the subkey (encrypt 0x04 and/or 0x08,
          sign 0x02, authenticate 0x20), optional Key Expiration Time counted from the
          subkey's creation, and for a signing subkey an Embedded Signature holding the 0x19
          from step 6. v4: binding signatures should be v4, and must be when the subkey can
          sign.
        basis: "stated"
        locator: "§5.2.1.8, §5.2.3.13, §5.2.3.29, §5.2.3.34, §10.1.1, §10.1.3, §10.1.5, §5.2.3.10"
        quotes:
          - |-
            This signature is a statement by the top-level signing key, indicating that it owns the subkey.
          - |-
            For a Subkey Binding signature, the key creation time is that of the subkey.
        constrained_by:
          - "rfc-9580#R-0049"
          - "rfc-9580#R-0088"
          - "rfc-9580#R-0144"
          - "rfc-9580#R-0313"
          - "rfc-9580#R-0314"
          - "rfc-9580#R-0315"
          - "rfc-9580#R-0316"
          - "rfc-9580#R-0317"
          - "rfc-9580#R-0318"
          - "rfc-9580#R-0325"
          - "rfc-9580#R-0326"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "8"
        from: "keyholder"
        to: "keyholder"
        message: "OpenPGP Version 6 Certificate"
        message_alternatives:
          - "OpenPGP Version 4 Certificate"
          - "Transferable Secret Key"
        action: >-
          Assemble the Transferable Public Key in grammar order: Primary Key, [Revocation
          Signature...], Direct Key Signature..., [User ID or User Attribute
          [Certification Revocation...] [Certification...]]..., [Subkey [Subkey
          Revocation...] Subkey Binding...]..., [Padding]. A Transferable Secret Key is the
          same with Secret Key and Secret Subkey packets and should keep the
          self-signatures.
        basis: "stated"
        locator: "§10.1.1, §10.1.5, §10.2, §10"
        constrained_by:
          - "rfc-9580#R-0310"
          - "rfc-9580#R-0322"
          - "rfc-9580#R-0329"
          - "rfc-9580#R-0330"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "9"
        from: "keyholder"
        to: "keyholder"
        message: "Padding Packet"
        action: >-
          Optionally end a v6 certificate that will go over an encrypted channel with a
          Padding packet, to hide its length. Not on a v4 certificate unless the recipient
          is known to ignore it.
        basis: "stated"
        locator: "§5.14, §10.1.5, §13.11"
        constrained_by:
          - "rfc-9580#R-0237"
          - "rfc-9580#R-0238"
          - "rfc-9580#R-0327"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "10"
        from: "keyring"
        to: "keyholder"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          Export: delete local (non-exportable) certifications, emit no Trust packets, keep
          a sensitive Revocation Key signature back unless it goes to the designated
          revoker; armor as BEGIN PGP PUBLIC KEY BLOCK (PRIVATE KEY BLOCK for a TSK) with no
          CRC24 footer for v6.
        basis: "stated"
        locator: "§5.2.3.19, §5.10, §5.2.3.23, §6.1, §6.2.1, §10.2"
        quotes:
          - |-
            Thus, when an implementation prepares a user's copy of a key for transport to another user (this is the process of "exporting" the key), any local certification signatures are deleted from the key.
        constrained_by:
          - "rfc-9580#R-0110"
          - "rfc-9580#R-0135"
          - "rfc-9580#R-0224"
          - "rfc-9580#R-0249"
          - "rfc-9580#R-0250"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "11"
        from: "keyholder"
        to: "key-server"
        message: "OpenPGP Version 6 Certificate"
        message_alternatives:
          - "ASCII Armor"
        action: >-
          Distribute the certificate to correspondents, directly or through a key server or
          any URI-reachable copy. Several certificates may be concatenated in one transfer.
        basis: "stated"
        locator: "§10.1, §10.1.5, §5.2.3.26"
        quotes:
          - |-
            OpenPGP users may transfer public keys. This section describes the structure of public keys in transit to ensure interoperability.
          - |-
            Transferable Public Key packet sequences may be concatenated to allow transferring multiple public keys in one operation (see Section 3.6).
        on_error: "unspecified. Distribution is not defined."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "12"
        from: "key-server"
        to: "sender"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          Correspondents obtain the certificate (and later its updates) and import it (flow
          certificate-import-and-evaluation).
        basis: "inferred"
        locator: "§5.2.3.26, §5.2.3.10"
        quotes:
          - |-
            For example, when refreshing a key to learn about changes in expiration, advertised features, algorithm preferences, revocation, subkey rotation, and so forth, there is no need to require a User ID self-signature.
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
  - name: "certificate-import-and-evaluation"
    title: >-
      Importing a certificate (or secret key): dearmor and parse against the TPK grammar,
      trim local certifications and Trust packets, evaluate validity, check imported secret
      keys' advertised features, store
    locator: "§5.2.3.10, §5.2.3.19, §5.10, §10.1, §10.1.5, §10.2"
    kind: "consumption"
    participants:
      - "key-server"
      - "verifier"
      - "keyring"
      - "keyholder"
    summary: >-
      What a consumer does with a received Transferable Public Key. The grammar is strict
      for critical packets and lax for non-critical ones; the validity rules are algorithm
      key-validity-evaluation. Merging a new copy with a stored one is not defined beyond
      "the most recent valid self-signature wins".
    steps:
      - n: "1"
        from: "key-server"
        to: "verifier"
        message: "OpenPGP Version 6 Certificate"
        message_alternatives:
          - "OpenPGP Version 4 Certificate"
          - "OpenPGP Version 6 Revocation Certificate"
          - "Transferable Secret Key"
          - "ASCII Armor"
        action: "Receive one or more concatenated certificates by any means."
        basis: "inferred"
        locator: "§10.1, §3.6"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          Dearmor and parse against the certificate grammar of the primary key's version:
          Marker anywhere, a trailing Padding packet accepted and ignored for v6, unknown
          non-critical packets skipped, Legacy format accepted, Trust packets ignored unless
          read from a local keyring.
        basis: "stated"
        locator: "§10, §10.1.1, §10.1.3, §10.1.5, §4.2, §5.10, §4.3"
        constrained_by:
          - "rfc-9580#R-0023"
          - "rfc-9580#R-0025"
          - "rfc-9580#R-0032"
          - "rfc-9580#R-0033"
          - "rfc-9580#R-0225"
          - "rfc-9580#R-0311"
          - "rfc-9580#R-0328"
        invokes:
          - "armor-decoding"
          - "packet-stream-parsing"
        on_error: >-
          An unknown critical packet, or a known critical packet out of place, rejects the
          whole sequence (R-0032, R-0311).
        on_error_basis: "stated"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "OpenPGP Version 6 Certificate"
        subpackets:
          - "Exportable Certification"
        action: >-
          Trim local certifications (Exportable Certification 0); a key server always
          does.
        basis: "stated"
        locator: "§5.2.3.19"
        quotes:
          - |-
            The receiver of a transported key "imports" it and likewise trims any local certifications.
        constrained_by:
          - "rfc-9580#R-0109"
        on_error: "not applicable."
        on_error_basis: "stated"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          Evaluate the certificate: Direct Key signature, self-signatures, bindings,
          back-signatures, revocations, expiry, per key and per User ID.
        basis: "stated"
        locator: "§5.2.3.10, §10.1"
        constrained_by:
          - "rfc-9580#R-0095"
          - "rfc-9580#R-0098"
        invokes:
          - "key-validity-evaluation"
        on_error: >-
          Components that fail are unusable; signatures that fail are ignored (R-0178). No
          rule rejects a whole certificate for a bad third-party signature.
        on_error_basis: "inferred"
      - n: "5"
        from: "keyholder"
        to: "keyring"
        message: "Transferable Secret Key"
        action: >-
          On importing a secret key, check that its self-signatures do not advertise
          features or algorithms the implementation lacks; if they do, warn and offer to
          make new self-signatures.
        basis: "stated"
        locator: "§5.2.3.10"
        constrained_by:
          - "rfc-9580#R-0093"
          - "rfc-9580#R-0094"
        on_error: "Warn and offer to rewrite the self-signatures (R-0094)."
        on_error_basis: "stated"
      - n: "6"
        from: "verifier"
        to: "keyring"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          Store or merge into the keyring. Where several self-signatures now cover the
          same object, only the most recent valid one counts.
        basis: "inferred"
        locator: "§3.6, §5.2.3.10"
        constrained_by:
          - "rfc-9580#R-0095"
        on_error: "unspecified. Keyring formats and merging are out of scope."
        on_error_basis: "unspecified"
        status: "not-defined"
  - name: "third-party-certification"
    title: >-
      Certification of a User ID by a third party: identity check out of band, a
      certification signature over the keyholder's primary key and User ID, its
      exportability and revocability, return to the keyholder, and use by verifiers
    locator: "§5.2.1.4 to §5.2.1.7, §5.2.3.18, §5.2.3.19, §5.2.3.20, §5.2.3.29, §5.2.4, §10.1.5"
    kind: "construction"
    participants:
      - "keyholder"
      - "certifier"
      - "key-server"
      - "verifier"
    summary: >-
      A certifier vouches that a User ID belongs to the key. The four certification types
      grade the check (generic, persona, casual, positive) but the source declines to
      give them precise meaning, and most implementations use 0x10. The signature goes back
      into the keyholder's certificate after the User ID it certifies. How the identity is
      checked, how the signature reaches the keyholder, and how a verifier weighs it are
      not defined.
    steps:
      - n: "1"
        from: "keyholder"
        to: "certifier"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          The certifier obtains the keyholder's certificate and checks, by its own means,
          that the User ID belongs to the key's owner (for example by comparing
          fingerprints, mechanically where possible).
        basis: "inferred"
        locator: "§5.2.1.4 to §5.2.1.7, §13.6"
        quotes:
          - |-
            An OpenPGP implementation should prioritize mechanical fingerprint transfer and comparison where possible and SHOULD NOT promote manual transfer or comparison of full fingerprints by a human unless there is no other way to achieve the desired result.
        constrained_by:
          - "rfc-9580#R-0404"
        on_error: "unspecified. Identity verification is not defined."
        on_error_basis: "unspecified"
        status: "out-of-band"
      - n: "2"
        from: "certifier"
        to: "certifier"
        message: "Signature Packet v6 (type 0x10-0x13)"
        action: >-
          Choose the certification type by the strength of the check: 0x10 no assertion,
          0x11 no verification, 0x12 casual, 0x13 substantial. The certifier's own key is
          expected to carry Key Flag 0x01 (may certify User IDs over other keys).
        basis: "stated"
        locator: "§5.2.1.4, §5.2.1.5, §5.2.1.6, §5.2.1.7, §5.2.3.29"
        quotes:
          - |-
            The issuer of this certification has done substantial verification of the claim of identity.
          - |-
            Most OpenPGP implementations make their "key signatures" as generic (Type ID 0x10) certifications. Some implementations can issue 0x11-0x13 certifications, but few differentiate between the types.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "certifier"
        to: "certifier"
        message: "Signature Packet v6 (type 0x10-0x13)"
        subpackets:
          - "Signature Creation Time"
          - "Issuer Fingerprint"
          - "Exportable Certification"
          - "Revocable"
          - "Signature Expiration Time"
          - "Key Flags"
          - "Trust Signature"
          - "Regular Expression"
          - "Policy URI"
          - "Notation Data"
        action: >-
          Build the certification in the certifier's key version over the keyholder's
          primary key and the User ID (or User Attribute, prefix 0xD1): hashed subpackets
          Signature Creation Time, Issuer Fingerprint, optionally Exportable Certification 0
          (critical) for a local-only certification, Revocable 0 to waive revocation,
          Signature Expiration Time, Key Flags stating what the certification is for, a
          Trust Signature (flow trust-signature-introduction), Policy URI.
        basis: "stated"
        locator: "§5.2.4, §5.2.3.18, §5.2.3.19, §5.2.3.20, §5.2.3.28, §5.2.3.29, §5.2"
        quotes:
          - |-
            For example, a certification signature that has the "sign data" flag is stating that the certification is for that use.
          - |-
            Non-exportable, or "local", certifications are signatures made by a user to mark a key as valid within that user's implementation only.
        constrained_by:
          - "rfc-9580#R-0043"
          - "rfc-9580#R-0101"
          - "rfc-9580#R-0107"
          - "rfc-9580#R-0108"
          - "rfc-9580#R-0109"
          - "rfc-9580#R-0111"
          - "rfc-9580#R-0112"
          - "rfc-9580#R-0113"
          - "rfc-9580#R-0157"
          - "rfc-9580#R-0167"
          - "rfc-9580#R-0168"
          - "rfc-9580#R-0172"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "certifier"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x10-0x13)"
        action: >-
          Return the certification to the keyholder (or publish it). The channel is not
          defined; a local certification is never exported.
        basis: "inferred"
        locator: "§5.2.3.19"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "5"
        from: "keyholder"
        to: "key-server"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          The certification takes its place among the Signature packets that follow the
          User ID it certifies, and the updated certificate is redistributed.
        basis: "stated"
        locator: "§10.1.5, §10.1.1"
        quotes:
          - |-
            Immediately following each User ID packet, there are zero or more Signature packets. Each Signature packet is calculated on the immediately preceding User ID packet and the initial Public Key packet.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "6"
        from: "key-server"
        to: "verifier"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          A verifier that receives the certificate verifies the certification and uses it,
          by a trust model of its choosing, as evidence that the User ID belongs to the key.
          A revoked certification no longer counts; a non-revocable one ignores later
          revocations.
        basis: "stated"
        locator: "§5.2.1, §5.2.3.20, §5.2.3.31"
        constrained_by:
          - "rfc-9580#R-0112"
          - "rfc-9580#R-0151"
        invokes:
          - "signature-verification"
        on_error: "An invalid certification is ignored (R-0178)."
        on_error_basis: "stated"
  - name: "trust-signature-introduction"
    title: >-
      Making a key a trusted introducer: a certification with a Trust Signature (level and
      amount), optionally scoped by a Regular Expression, and the verifier's reading of it
    locator: "§5.2.3.21, §5.2.3.22, §8, §5.10"
    kind: "construction"
    participants:
      - "certifier"
      - "trusted-introducer"
      - "keyholder"
      - "verifier"
      - "keyring"
    summary: >-
      The only trust-delegation mechanism the format carries. A level 1 Trust Signature
      says "this key is a trusted introducer" with an amount (under 120 partial, 120 or more
      complete); level n delegates the right to make level n-1 Trust Signatures; a Regular
      Expression limits the User IDs for which the introducer's certifications count. The
      source defines the encoding and the meaning of one signature, not how a verifier
      combines chains, amounts or depths into a validity decision: that is the web of trust,
      not_defined. Locally kept trust settings go in implementation-defined Trust packets.
    steps:
      - n: "1"
        from: "certifier"
        to: "certifier"
        message: "Signature Packet v6 (type 0x10-0x13)"
        message_alternatives:
          - "Signature Packet v6 (type 0x1F)"
        subpackets:
          - "Trust Signature"
          - "Regular Expression"
        action: >-
          Certify the introducer's key (third-party-certification steps 2 to 3) with a
          Trust Signature subpacket: level (0 ordinary validity, 1 trusted introducer, 2
          meta introducer, n trusted for level n-1) and amount (emit 60 partial, 120
          complete). To scope it, add a Regular Expression subpacket, null-terminated,
          critical recommended.
        basis: "stated"
        locator: "§5.2.3.21, §5.2.3.22"
        quotes:
          - |-
            The signer asserts that the key is not only valid but also trustworthy at the specified level.
        constrained_by:
          - "rfc-9580#R-0114"
          - "rfc-9580#R-0115"
          - "rfc-9580#R-0116"
          - "rfc-9580#R-0117"
          - "rfc-9580#R-0118"
          - "rfc-9580#R-0119"
          - "rfc-9580#R-0120"
          - "rfc-9580#R-0121"
          - "rfc-9580#R-0122"
          - "rfc-9580#R-0128"
          - "rfc-9580#R-0129"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        note: >-
          The source attaches Trust Signature to certification signatures without naming
          the types; that a Direct Key signature may carry it is inferred from §5.2.1.10
          ("statements that non-self certifiers want to make about the key itself").
      - n: "2"
        from: "certifier"
        to: "verifier"
        message: "Signature Packet v6 (type 0x10-0x13)"
        action: >-
          The trust signature reaches the verifier: typically the verifier's own key is the
          certifier (its local root), or the signature arrives inside the introducer's
          certificate.
        basis: "inferred"
        locator: "§5.2.3.21"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "3"
        from: "trusted-introducer"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x10-0x13)"
        action: >-
          The introducer certifies other keyholders' User IDs (third-party-certification),
          and at level 2 or more may itself issue Trust Signatures one level lower.
        basis: "stated"
        locator: "§5.2.3.21"
        constrained_by:
          - "rfc-9580#R-0118"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "Signature Packet v6 (type 0x10-0x13)"
        subpackets:
          - "Trust Signature"
          - "Regular Expression"
        action: >-
          When evaluating a keyholder certified by the introducer, count the introducer's
          certification only for User IDs matching the Regular Expression of the trust
          signature, matched over UTF-8 characters with the §8 syntax; strip the null
          terminator, and reject a subpacket without one (ignore if non-critical, reject
          the signature if critical). A revoked trust signature no longer counts.
        basis: "stated"
        locator: "§5.2.3.22, §8, §5.2.3.31"
        constrained_by:
          - "rfc-9580#R-0123"
          - "rfc-9580#R-0124"
          - "rfc-9580#R-0125"
          - "rfc-9580#R-0126"
          - "rfc-9580#R-0127"
          - "rfc-9580#R-0151"
        invokes:
          - "trust-signature-scoping"
        on_error: >-
          Missing null terminator: ignore the subpacket if non-critical, reject the
          signature if critical (R-0127).
        on_error_basis: "stated"
      - n: "5"
        from: "verifier"
        to: "keyring"
        message: "Trust Packet"
        action: >-
          Record the user's own decisions about which keyholders are trusted introducers in
          the keyring, in Trust packets of implementation-defined format that are never
          exported.
        basis: "stated"
        locator: "§5.10"
        quotes:
          - |-
            Trust packets contain data that record the user's specifications of which keyholders are trustworthy introducers, along with other information that implementation uses for trust information. The format of Trust packets is defined by a given implementation.
        constrained_by:
          - "rfc-9580#R-0224"
          - "rfc-9580#R-0225"
        on_error: "unspecified."
        on_error_basis: "unspecified"
  - name: "key-revocation"
    title: >-
      Revoking a primary key: Key Revocation signature (0x20) by the key itself with a
      Reason for Revocation, the v6 revocation certificate, publication, and the
      verifier's handling of revoked keys and of signatures made before
    locator: "§5.2.1.11, §5.2.3.31, §5.2.4, §10.1.2, §10.1.3, §10.1.5"
    kind: "construction"
    participants:
      - "keyholder"
      - "key-server"
      - "verifier"
    summary: >-
      A key is revoked by a signature from itself (or, deprecated, from a designated
      revoker, or published from escrow). The reason code matters to verifiers: compromise
      makes every signature by the key suspect, supersession or retirement leaves earlier
      signatures valid. A v6 revocation certificate always carries the primary key packet
      so it verifies on its own.
    steps:
      - n: "1"
        from: "keyholder"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x20)"
        subpackets:
          - "Reason for Revocation"
          - "Signature Creation Time"
          - "Issuer Fingerprint"
        action: >-
          Make a Key Revocation signature with the primary key over the primary key alone,
          with a Reason for Revocation: 0 none given, 1 superseded, 2 compromised, 3
          retired, plus an optional UTF-8 reason string.
        basis: "stated"
        locator: "§5.2.1.11, §5.2.3.31, §5.2.4"
        quotes:
          - |-
            This signature is calculated directly on the key being revoked.
          - |-
            There are important semantic differences between the reasons, and there are thus important reasons for revoking signatures.
        constrained_by:
          - "rfc-9580#R-0051"
          - "rfc-9580#R-0146"
          - "rfc-9580#R-0147"
          - "rfc-9580#R-0148"
          - "rfc-9580#R-0170"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "keyholder"
        to: "keyholder"
        message: "OpenPGP Version 6 Revocation Certificate"
        message_alternatives:
          - "OpenPGP Version 6 Certificate"
        action: >-
          Package it: inside the full certificate (Revocation Signature right after the
          Primary Key), or as a revocation certificate, which for v6 is Primary Key plus
          Revocation Signature (no Direct Key signature needed). A v4 revocation
          certificate may be the signature alone.
        basis: "stated"
        locator: "§10.1.1, §10.1.2, §10.1.3"
        quotes:
          - |-
            In this case, the Direct Key signature is no longer necessary, since the primary key itself has been marked as unusable.
          - |-
            When a primary version 4 Public Key is revoked, the Revocation Signature is sometimes distributed by itself, without the primary key packet it applies to. This is referred to as a "revocation certificate".
        constrained_by:
          - "rfc-9580#R-0319"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "keyholder"
        to: "key-server"
        message: "OpenPGP Version 6 Revocation Certificate"
        action: "Publish the revocation. The channel is not defined."
        basis: "inferred"
        locator: "§10.1.2"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "4"
        from: "key-server"
        to: "verifier"
        message: "OpenPGP Version 6 Revocation Certificate"
        action: >-
          The verifier verifies the revocation signature and accepts it only if made by the
          revoked key itself (or a designated revoker). The revoked key is then not to be
          used.
        basis: "stated"
        locator: "§5.2.1.11, §10.1.5"
        quotes:
          - |-
            Revocation Signatures are only accepted if they are issued by the key itself or by a key that is authorized to issue revocations via a Revocation Key subpacket in a self-signature by the top-level key.
        constrained_by:
          - "rfc-9580#R-0050"
          - "rfc-9580#R-0051"
        invokes:
          - "signature-verification"
          - "key-validity-evaluation"
        on_error: "A revocation from any other key is not a valid revocation and is ignored."
        on_error_basis: "inferred"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "Signature Packet v6 (type 0x20)"
        subpackets:
          - "Reason for Revocation"
        action: >-
          Apply the reason to signatures already made by the key: after compromise treat
          all of them as suspect; after supersession or retirement keep old signatures
          valid.
        basis: "stated"
        locator: "§5.2.3.31"
        constrained_by:
          - "rfc-9580#R-0148"
          - "rfc-9580#R-0149"
        on_error: "not applicable."
        on_error_basis: "stated"
        note: >-
          The source does not say how to treat code 0 (no reason) or a missing subpacket
          when judging earlier signatures; see source_defects_and_ambiguities.
  - name: "subkey-revocation"
    title: "Revoking a subkey: Subkey Revocation signature (0x28) by the primary key"
    locator: "§5.2.1.12, §5.2.3.10, §5.2.4, §10.1.1, §10.1.5"
    kind: "construction"
    participants:
      - "keyholder"
      - "key-server"
      - "verifier"
    summary: >-
      The primary key retires a subkey. The revocation sits after the Subkey packet,
      before its binding signatures. Revoking the binding signature itself also retires
      the subkey, but the source names only 0x28 as the subkey revocation type.
    steps:
      - n: "1"
        from: "keyholder"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x28)"
        subpackets:
          - "Reason for Revocation"
        action: >-
          With the primary key, sign the primary key then the subkey being revoked, with a
          Reason for Revocation.
        basis: "stated"
        locator: "§5.2.1.12, §5.2.4, §5.2.3.31"
        quotes:
          - |-
            This signature is calculated directly on the primary key and the subkey being revoked.
        constrained_by:
          - "rfc-9580#R-0053"
          - "rfc-9580#R-0148"
          - "rfc-9580#R-0171"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "keyholder"
        to: "key-server"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          Place it after the Subkey packet ([Subkey [Subkey Revocation Signature...]
          Subkey Binding Signature...]) and redistribute the certificate.
        basis: "stated"
        locator: "§10.1.1"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "3"
        from: "key-server"
        to: "verifier"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          Accept the revocation only from the primary key bound to the subkey (or a
          designated revoker); the subkey is then not to be used.
        basis: "stated"
        locator: "§5.2.1.12, §5.2.3.10"
        constrained_by:
          - "rfc-9580#R-0052"
          - "rfc-9580#R-0053"
          - "rfc-9580#R-0091"
        invokes:
          - "key-validity-evaluation"
        on_error: "A revocation by any other key is ignored."
        on_error_basis: "inferred"
  - name: "certification-revocation"
    title: >-
      Revoking a certification or a Direct Key signature: Certification Revocation (0x30) by
      the issuer of the revoked signature, over the same data, later, naming the target
    locator: "§5.2.1.13, §5.2.3.10, §5.2.3.20, §5.2.3.31, §5.2.3.33"
    kind: "construction"
    participants:
      - "certifier"
      - "keyholder"
      - "key-server"
      - "verifier"
    summary: >-
      Revokes one earlier certification (0x10 to 0x13) or Direct Key signature (0x1F). The
      revoker is whoever made the revoked signature: a keyholder revoking its own User ID
      self-signature retires that name (reason 32); a certifier revoking its certification
      withdraws its belief in the binding. A signature marked non-revocable ignores later
      revocations.
    steps:
      - n: "1"
        from: "certifier"
        to: "certifier"
        message: "Signature Packet v6 (type 0x30)"
        subpackets:
          - "Reason for Revocation"
          - "Signature Target"
        action: >-
          With the same key that issued the certification, sign the same data the
          certification covered (primary key and User ID, or the key for 0x1F), with a
          creation time later than the certification's; designate the revoked signature with
          a Signature Target (hash of the target signature, of that signature's hash size);
          include a Reason for Revocation (32 when a keyholder retires its own User ID).
        basis: "stated"
        locator: "§5.2.1.13, §5.2.3.31, §5.2.3.33"
        quotes:
          - |-
            This signature revokes an earlier User ID certification signature (Type IDs 0x10 through 0x13) or Direct Key signature (Type ID 0x1F).
        constrained_by:
          - "rfc-9580#R-0054"
          - "rfc-9580#R-0055"
          - "rfc-9580#R-0148"
          - "rfc-9580#R-0150"
          - "rfc-9580#R-0154"
          - "rfc-9580#R-0155"
          - "rfc-9580#R-0156"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "certifier"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x30)"
        action: >-
          The revocation joins the certificate after the User ID ([Certification Revocation
          Signature...] precede [Certification Signature...]) and is redistributed.
        basis: "stated"
        locator: "§10.1.1"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "3"
        from: "keyholder"
        to: "verifier"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          The verifier drops the revoked certification from its validity calculation,
          unless the revoked signature carries Revocable 0; a revoked User ID self-signature
          retires the User ID; a revoked Direct Key signature is cancelled.
        basis: "stated"
        locator: "§5.2.3.10, §5.2.3.20, §5.2.3.31"
        constrained_by:
          - "rfc-9580#R-0090"
          - "rfc-9580#R-0091"
          - "rfc-9580#R-0112"
          - "rfc-9580#R-0151"
        invokes:
          - "key-validity-evaluation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
  - name: "designated-revoker-revocation"
    title: >-
      Deprecated: revocation by a third-party key named in a Revocation Key subpacket on
      the keyholder's Direct Key self-signature
    locator: "§5.2.3.23, §5.2.1.11, §5.2.1.12, §5.2.1.13, §10.1.5, §13.9"
    kind: "construction"
    status: "deprecated"
    participants:
      - "keyholder"
      - "designated-revoker"
      - "verifier"
    summary: >-
      Kept only so that implementations can read historic data. Generating the subpacket is
      forbidden; the source describes how "some implementations attempt to interpret"
      it, calls support "uneven and unreliable", and replaces it with escrowed revocation.
      The subpacket holds a v4 fingerprint, so it cannot name a v6 key.
    steps:
      - n: "1"
        from: "keyholder"
        to: "keyholder"
        message: "Signature Packet v4 (type 0x1F)"
        subpackets:
          - "Revocation Key (deprecated)"
        action: >-
          (Historic.) The keyholder's Direct Key self-signature carries a Revocation Key
          subpacket: class with 0x80 set (0x40 means sensitive), the revoker's public-key
          algorithm and 20-octet v4 fingerprint. New implementations must not generate it.
        basis: "stated"
        locator: "§5.2.3.23"
        constrained_by:
          - "rfc-9580#R-0130"
          - "rfc-9580#R-0131"
          - "rfc-9580#R-0132"
          - "rfc-9580#R-0133"
          - "rfc-9580#R-0134"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "keyholder"
        to: "designated-revoker"
        message: "Signature Packet v4 (type 0x1F)"
        action: >-
          A sensitive designation is exported only to the designated revoker, or together
          with a revocation from that revoker.
        basis: "stated"
        locator: "§5.2.3.23"
        constrained_by:
          - "rfc-9580#R-0135"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "designated-revoker"
        to: "verifier"
        message: "Signature Packet v4 (type 0x20)"
        message_alternatives:
          - "Signature Packet v4 (type 0x28)"
          - "Signature Packet v4 (type 0x30)"
        action: >-
          The designated revoker signs a revocation of the keyholder's key, subkey or
          certification with its own key and publishes it.
        basis: "stated"
        locator: "§5.2.1.11, §5.2.1.12, §5.2.1.13"
        constrained_by:
          - "rfc-9580#R-0051"
          - "rfc-9580#R-0053"
          - "rfc-9580#R-0054"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "Signature Packet v4 (type 0x20)"
        action: >-
          A verifier that honours the mechanism accepts the revocation if its issuer's
          fingerprint matches the Revocation Key subpacket of a valid Direct Key
          self-signature by the top-level key.
        basis: "stated"
        locator: "§10.1.5, §5.2.3.23, §13.9, §5.2.1.11"
        quotes:
          - |-
            Implementation support for enforcing a revocation from an authorized Revocation Key subpacket is uneven and unreliable.
        constrained_by:
          - "rfc-9580#R-0051"
        invokes:
          - "key-validity-evaluation"
        on_error: "unspecified. Whether to honour the mechanism at all is not stated."
        on_error_basis: "unspecified"
  - name: "escrowed-revocation"
    title: >-
      Delegating revocation by escrow: the keyholder pre-signs revocations, hands them to a
      preferred revoker securely, and the revoker publishes one when appropriate
    locator: "§13.9"
    kind: "out-of-band"
    participants:
      - "keyholder"
      - "preferred-revoker"
      - "key-server"
      - "verifier"
    summary: >-
      The replacement for the designated revoker. Everything cryptographic is done by
      the keyholder in advance; the third party only holds and later publishes, so
      verifiers check an ordinary self-revocation and need no key of the revoker. The
      secure hand-over and any secret-sharing of the signature are outside the source.
    steps:
      - n: "1"
        from: "keyholder"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x20)"
        message_alternatives:
          - "Signature Packet v6 (type 0x28)"
          - "Signature Packet v6 (type 0x30)"
        action: >-
          Pre-compute exactly the revocations the keyholder is willing to delegate (key,
          subkey or certification revocation), with appropriate reasons.
        basis: "stated"
        locator: "§13.9, §5.2.3.31"
        quotes:
          - |-
            The keyholder can constrain what types of revocation the preferred revoker can issue, by only escrowing those specific signatures.
        constrained_by:
          - "rfc-9580#R-0148"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "keyholder"
        to: "preferred-revoker"
        message: "Signature Packet v6 (type 0x20)"
        action: >-
          Hand the signatures over securely, possibly split into shares among several
          parties. The preferred revoker needs no OpenPGP key if another secure transport
          exists.
        basis: "stated"
        locator: "§13.9"
        quotes:
          - |-
            The preferred revoker doesn't even need to have a public OpenPGP Key if some other secure transport is possible between them and the keyholder.
          - |-
            A Revocation Signature may also be split up into shares and distributed among multiple parties, requiring some subset of those parties to collaborate before the escrowed Revocation Signature is recreated.
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "out-of-band"
      - n: "3"
        from: "preferred-revoker"
        to: "key-server"
        message: "Signature Packet v6 (type 0x20)"
        action: "Publish the escrowed revocation when the revoker judges it appropriate."
        basis: "stated"
        locator: "§13.9"
        quotes:
          - |-
            The preferred revoker can then publish the escrowed Revocation Signature at whatever time is deemed appropriate rather than generating the Revocation Signature themselves.
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "4"
        from: "key-server"
        to: "verifier"
        message: "Signature Packet v6 (type 0x20)"
        action: >-
          Verify it as the keyholder's own revocation (key-revocation step 4); no lookup of
          the revoker is needed.
        basis: "stated"
        locator: "§13.9"
        quotes:
          - |-
            Third parties can verify the revocation without needing to find the key of the preferred revoker.
        invokes:
          - "signature-verification"
        on_error: "As key-revocation step 4."
        on_error_basis: "inferred"
  - name: "key-expiry-and-preference-update"
    title: >-
      Changing expiry, flags, features or preferences: a new self-signature supersedes the
      old, the updated certificate is republished, consumers take the most recent valid
      self-signature
    locator: "§5.2.3.9, §5.2.3.10, §5.2.3.13, §5.2.3.25, §5.2.3.26, §13.13"
    kind: "construction"
    participants:
      - "keyholder"
      - "key-server"
      - "verifier"
      - "sender"
    summary: >-
      Self-signatures are the certificate's mutable state. To extend or shorten expiry,
      or to change advertised algorithms, the keyholder issues a new self-signature of the
      same kind; consumers keep the most recent valid one. Keeping v6 metadata in the
      Direct Key signature (which must be present) stops an attacker from stripping the
      signature that sets an expiry or preferences.
    steps:
      - n: "1"
        from: "keyholder"
        to: "keyholder"
        message: "Signature Packet v6 (type 0x1F)"
        message_alternatives:
          - "Signature Packet v6 (type 0x13)"
          - "Signature Packet v6 (type 0x18)"
        subpackets:
          - "Key Expiration Time"
          - "Key Flags"
          - "Features"
          - "Preferred AEAD Ciphersuites"
        action: >-
          Issue a new self-signature with the changed subpackets: a Direct Key signature for
          key-wide data of a v6 key, a User ID self-signature for v4 key-wide data or
          per-User-ID preferences, a Subkey Binding signature for a subkey (expiry counted
          from the subkey's creation).
        basis: "stated"
        locator: "§5.2.3.10, §5.2.3.13"
        quotes:
          - |-
            Since a self-signature contains important information about the key's use, an implementation SHOULD allow the user to rewrite the self-signature and important information in it, such as preferences and key expiration.
        constrained_by:
          - "rfc-9580#R-0092"
          - "rfc-9580#R-0097"
          - "rfc-9580#R-0105"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "keyholder"
        to: "key-server"
        message: "OpenPGP Version 6 Certificate"
        subpackets:
          - "Key Server Preferences"
          - "Preferred Key Server"
        action: >-
          Publish the updated certificate, to the Preferred Key Server if one is named; the
          No-modify flag asks the key server to accept changes only from the keyholder or
          its administrator.
        basis: "stated"
        locator: "§5.2.3.25, §5.2.3.26"
        constrained_by:
          - "rfc-9580#R-0140"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "3"
        from: "key-server"
        to: "verifier"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          Consumers refresh the certificate (no User ID self-signature is needed for this)
          and, per object, keep only the most recent valid self-signature; within one
          signature the last instance of a repeated hashed subpacket normally wins;
          preferences found only in the unhashed area are ignored.
        basis: "stated"
        locator: "§5.2.3.9, §5.2.3.10, §13.13"
        constrained_by:
          - "rfc-9580#R-0086"
          - "rfc-9580#R-0095"
          - "rfc-9580#R-0099"
          - "rfc-9580#R-0418"
        invokes:
          - "key-validity-evaluation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "sender"
        message: "OpenPGP Version 6 Certificate"
        action: >-
          The next encryption to the key (encrypt-and-sign-message steps 2 to 4) uses the new
          expiry, flags and preferences.
        basis: "inferred"
        locator: "§5.2.3.10, §12.2"
        on_error: "not applicable."
        on_error_basis: "inferred"
  - name: "session-key-reuse-reply"
    title: >-
      Replying with session-key reuse: the recipient of a v2 SEIPD message reuses its v6
      PKESK packets with a fresh salt to reply to the same set of parties without their
      certificates
    locator: "§5.13.2, §13.8, §5.2.3.36"
    kind: "transfer"
    participants:
      - "recipient"
      - "sender"
      - "attacker"
    summary: >-
      Possible only with v2 SEIPD, because the message key is derived from the session key
      and a per-message salt. The source gives no procedure, only hazards: the reply is
      readable by exactly the original recipient set, so changing that set leaks, and an
      attacker who removes itself from the visible list still reads the reply. The source
      notes there is no deployment guidance for any application.
    steps:
      - n: "1"
        from: "sender"
        to: "recipient"
        message: "Encrypted Message"
        action: "A v2 SEIPD message with v6 PKESK packets arrives and is decrypted normally."
        basis: "stated"
        locator: "§13.8"
        on_error: "As decrypt-and-verify-message."
        on_error_basis: "stated"
      - n: "2"
        from: "recipient"
        to: "recipient"
        message: "Signature Packet v6 (type 0x00)"
        subpackets:
          - "Intended Recipient Fingerprint"
        action: >-
          Before reusing, check the recipient set for consistency, using the Intended
          Recipient Fingerprint subpackets of the original signature, so that a party that
          removed itself in transit is noticed.
        basis: "stated"
        locator: "§13.8"
        quotes:
          - |-
            Implementations are encouraged to use the Intended Recipient Fingerprint subpacket (Section 5.2.3.36) when composing messages and checking the consistency of the set of recipients of a message before replying to it with session-key reuse.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "recipient"
        to: "recipient"
        message: "Symmetrically Encrypted and Integrity Protected Data Packet v2"
        action: >-
          Under the user's control, and only if the reply goes to exactly the original
          sender and recipients: copy the original v6 PKESK packets, draw a new random salt,
          derive a new message key from the same session key, encrypt the reply. The same
          recipient-set safeguard applies when a reuse reply is saved (for example as a
          draft) and reopened before sending; the feature must not be used silently where the
          user assumes fresh public-key encryption (for example when a recipient's key is
          known but expired); and a higher-layer protocol must not carry another, interfering
          practice of session-key reuse.
        basis: "stated"
        locator: "§5.13.2, §13.8"
        quotes:
          - |-
            Furthermore, an implementation can securely reply to a message even if a recipient's certificate is unknown by reusing the Encrypted Session Key packets and replying with a different salt that yields a new, unique message key.
          - |-
            Generally, the use of the session-key-reuse feature should be under the control of the user.
          - |-
            A modification of the list of recipients addressed in the above points also needs to be safeguarded when a message is initially composed as a reply with session-key reuse but then is stored (e.g., as a draft) and later reopened for further editing and to be finally sent.
          - |-
            Specifically, care should be taken so that this feature is not silently used when the user assumes that proper public key encryption is used.
          - |-
            When using the session-key-reuse feature in any higher-layer protocol, care should be taken to ensure that there is no other potentially interfering practice of session-key reuse established in that protocol.
        constrained_by:
          - "rfc-9580#R-0233"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "recipient"
        to: "sender"
        message: "Encrypted Message"
        action: >-
          Send the reply to the sender and all original recipients. Prefer fresh public-key
          encryption whenever the certificates are available.
        basis: "stated"
        locator: "§13.8"
        quotes:
          - |-
            Whenever possible, a client should prefer a fresh public key encryption over the session-key reuse.
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "5"
        from: "attacker"
        to: "recipient"
        message: "Encrypted Message"
        action: >-
          The hazard the checks exist for: a recipient of the original message with network
          or mailbox access deletes itself from the message before the victim's client
          receives it; a reuse reply is then readable by it.
        basis: "stated"
        locator: "§13.8"
        quotes:
          - |-
            There is the potential threat that an attacker with network or mailbox access, who is at the same time a recipient of the original message, silently removes themselves from the message before the victim's client receives it.
        on_error: "not applicable."
        on_error_basis: "stated"
  - name: "third-party-confirmation-and-timestamp"
    title: >-
      Signatures over signatures and over nothing: Third-Party Confirmation (0x50),
      Timestamp (0x40) and Standalone (0x02) signatures
    locator: "§5.2.1.3, §5.2.1.14, §5.2.1.15, §5.2.3.33, §5.2.4"
    kind: "construction"
    participants:
      - "signer"
      - "verifier"
    summary: >-
      Minor signature types with no defined surrounding flow: a notary-style signature
      over another Signature packet, a signature meaningful only for its timestamp, and a
      signature over its own subpackets only. The source gives their hashing and the
      Signature Target link, not where they are carried or how they are used.
    steps:
      - n: "1"
        from: "signer"
        to: "signer"
        message: "Signature Packet v6 (type 0x50)"
        subpackets:
          - "Signature Target"
        action: >-
          Third-Party Confirmation: hash (salt), 0x88, the 4-octet length and the body of the
          confirmed Signature packet with its unhashed subpacket area removed and its
          length set to zero; include a Signature Target identifying the confirmed
          signature.
        basis: "stated"
        locator: "§5.2.1.15, §5.2.4, §5.2.3.33"
        quotes:
          - |-
            It is analogous to a notary seal on the signed data.
          - |-
            The unhashed subpacket data of the Signature packet being hashed is not included in the hash, and the unhashed subpacket data length value is set to zero.
        constrained_by:
          - "rfc-9580#R-0056"
          - "rfc-9580#R-0173"
        invokes:
          - "signature-hash-computation"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "signer"
        to: "signer"
        message: "Signature Packet v6 (type 0x40)"
        message_alternatives:
          - "Signature Packet v6 (type 0x02)"
        action: >-
          Timestamp signature: meaningful only for its timestamp (a Signature Target may
          name the signature it timestamps). Standalone signature: over its own subpackets,
          computed as over an empty binary document; never v3.
        basis: "stated"
        locator: "§5.2.1.14, §5.2.1.3, §5.2.3.33"
        quotes:
          - |-
            This signature is only meaningful for the timestamp contained in it.
          - |-
            It is calculated identically to a signature over a zero-length binary document.
        constrained_by:
          - "rfc-9580#R-0048"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "signer"
        to: "verifier"
        message: "Detached Signature"
        action: >-
          Carry the signature to verifiers; the source defines no container or exchange for
          these types.
        basis: "inferred"
        locator: "§10.4"
        on_error: "unspecified."
        on_error_basis: "unspecified"
        status: "not-defined"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "Signature Packet v6 (type 0x50)"
        action: >-
          Verify by recomputing the same hash; a v3 Standalone signature is ignored.
        basis: "stated"
        locator: "§5.2.1.3, §5.2.4"
        constrained_by:
          - "rfc-9580#R-0048"
        invokes:
          - "signature-verification"
        on_error: "Ignore an invalid signature (R-0178)."
        on_error_basis: "stated"
algorithms:
  - name: "packet-stream-parsing"
    title: "Splitting an octet stream into packets: header formats, body lengths, criticality, MPI checks"
    locator: "§3.2, §4.1, §4.2, §4.2.1, §4.2.2, §4.3, §5"
    performed_by:
      - "recipient"
      - "verifier"
    status: "normative-procedure"
    inputs:
      - "an octet stream (after dearmoring, decryption or decompression)"
    outputs:
      - "a sequence of (Packet Type ID, body) pairs, or a malformed-packet failure"
    steps:
      - n: "1"
        kind: "parse"
        action: >-
          Read the first header octet. Bit 7 is always one. Bit 6 one: OpenPGP format,
          Packet Type ID in bits 5 to 0. Bit 6 zero: Legacy format, Packet Type ID in bits 5
          to 2, length-type in bits 1 to 0 (accepted when consuming).
        basis: "stated"
        locator: "§4.2"
        quotes:
          - |-
            Bit 6 of the first octet of the packet header indicates whether the packet is encoded in the OpenPGP or Legacy packet format.
        constrained_by:
          - "rfc-9580#R-0023"
        on_fail: >-
          unspecified for an octet with bit 7 clear: the source never says what such a
          stream is.
        on_fail_basis: "unspecified"
      - n: "2"
        kind: "compute"
        action: >-
          OpenPGP format length: first octet < 192 is the length; 192 to 223 starts a
          2-octet length ((o1 - 192) << 8) + o2 + 192; 255 is followed by a 4-octet length;
          224 to 254 is a Partial Body Length 1 << (o1 & 0x1F), followed by that many body
          octets and another length header.
        basis: "stated"
        locator: "§4.2.1.1, §4.2.1.2, §4.2.1.3, §4.2.1.4"
        quotes:
          - |-
            bodyLen = ((1st_octet - 192) << 8) + (2nd_octet) + 192
          - |-
            partialBodyLen = 1 << (1st_octet & 0x1F);
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "3"
        kind: "check"
        action: >-
          Partial Body Lengths: only on Literal, Compressed or encrypted data packets; the
          first part at least 512 octets; the last length header a regular one (possibly
          zero).
        basis: "stated"
        locator: "§4.2.1.4"
        constrained_by:
          - "rfc-9580#R-0026"
          - "rfc-9580#R-0028"
          - "rfc-9580#R-0029"
        on_fail: >-
          unspecified. These are producer obligations; the source does not say whether a
          consumer must reject a violation.
        on_fail_basis: "unspecified"
      - n: "4"
        kind: "compute"
        action: >-
          Legacy format length by length-type: 0 one octet, 1 two octets, 2 four octets, 3
          indeterminate (to end of file; may be read for historic data, never generated).
        basis: "stated"
        locator: "§4.2.2"
        constrained_by:
          - "rfc-9580#R-0030"
          - "rfc-9580#R-0031"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "5"
        kind: "check"
        action: >-
          Bound the body by the header length: look for the next packet exactly there;
          never read outside the range; a subfield length that would extend beyond it makes
          the packet malformed.
        basis: "stated"
        locator: "§4.1"
        constrained_by:
          - "rfc-9580#R-0020"
          - "rfc-9580#R-0021"
          - "rfc-9580#R-0022"
        on_fail: "Abort without writing outside the range; the packet is malformed and unusable (R-0021)."
        on_fail_basis: "stated"
      - n: "6"
        kind: "check"
        action: >-
          Criticality by Packet Type ID: 0 to 39 critical, 40 to 63 non-critical. An
          unknown critical type rejects the whole sequence; an unknown non-critical type is
          skipped. ID 0 is reserved and never valid.
        basis: "stated"
        locator: "§4.3, §5"
        quotes:
          - |-
            Packets with Type IDs from 0 to 39 are critical. Packets with Type IDs from 40 to 63 are non-critical.
        constrained_by:
          - "rfc-9580#R-0032"
          - "rfc-9580#R-0033"
          - "rfc-9580#R-0034"
        on_fail: "Reject the whole packet sequence (R-0032)."
        on_fail_basis: "stated"
      - n: "7"
        kind: "check"
        action: >-
          Inside v6 Key, Signature and PKESK packets, every MPI's bit count must equal the
          position of its most significant non-zero bit; unused bits zero.
        basis: "stated"
        locator: "§3.2"
        constrained_by:
          - "rfc-9580#R-0003"
          - "rfc-9580#R-0004"
        on_fail: "Reject the packet as malformed (R-0003)."
        on_fail_basis: "stated"
  - name: "message-grammar-parsing"
    title: >-
      Recognising an OpenPGP Message by the §10.3 grammar, with Marker and Padding
      packets, unwrapping of encrypted and compressed layers, and the version constraints
    locator: "§10, §10.3, §10.3.1, §10.3.2, §5.4, §5.8, §5.14, §13.14"
    performed_by:
      - "recipient"
      - "verifier"
    status: "normative-procedure"
    inputs:
      - "the packet sequence from packet-stream-parsing"
    outputs:
      - "a parse tree of nested messages ending in Literal Data, or a sequence rejection"
    grammar:
      locator: "§10.3"
      quotes:
        - |-
          OpenPGP Message: Encrypted Message | Signed Message | Compressed Message | Literal Message.
        - |-
          Compressed Message: Compressed Data Packet.
        - |-
          Literal Message: Literal Data Packet.
        - |-
          ESK: Public Key Encrypted Session Key Packet | Symmetric Key Encrypted Session Key Packet.
        - |-
          ESK Sequence: ESK | ESK Sequence, ESK.
        - |-
          Encrypted Data: Symmetrically Encrypted Data Packet | Symmetrically Encrypted and Integrity Protected Data Packet.
        - |-
          Encrypted Message: Encrypted Data | ESK Sequence, Encrypted Data.
        - |-
          One-Pass Signed Message: One-Pass Signature Packet, OpenPGP Message, Corresponding Signature Packet.
        - |-
          Signed Message: Signature Packet, OpenPGP Message | One-Pass Signed Message.
        - |-
          Optionally Padded Message: OpenPGP Message | OpenPGP Message, Padding Packet.
        - |-
          In addition to these rules, a Marker packet (Section 5.8) can appear anywhere in the sequence.
    steps:
      - n: "1"
        kind: "control"
        action: >-
          Drop Marker packets wherever they appear, and unknown non-critical packets.
          Ignore Trust packets: they belong only to local keyring files and are to be
          ignored on any other input.
        basis: "stated"
        locator: "§10, §10.3, §5.8, §5.10"
        quotes:
          - |-
            Trust packets SHOULD NOT be emitted to output streams that are transferred to other users, and they SHOULD be ignored on any input other than local keyring files.
        constrained_by:
          - "rfc-9580#R-0209"
          - "rfc-9580#R-0225"
          - "rfc-9580#R-0309"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "2"
        kind: "parse"
        action: >-
          Match the first significant packet. PKESK or SKESK: an ESK Sequence must be
          followed by one Encrypted Data packet (SEIPD, or historic SED), which ends this
          level. SEIPD or SED alone: an Encrypted Message without ESKs. Signature: a Signed
          Message, Signature then an OpenPGP Message. One-Pass Signature: an OPS, a nested
          OpenPGP Message, then the corresponding Signature. Compressed Data: a Compressed
          Message. Literal Data: a Literal Message.
        messages:
          - "Encrypted Message"
          - "Signed Message"
          - "One-Pass Signed Message"
          - "Compressed Message"
          - "Literal Message"
        basis: "stated"
        locator: "§10.3, §10"
        constrained_by:
          - "rfc-9580#R-0311"
        on_fail: "A critical packet the grammar does not allow here rejects the sequence (R-0311)."
        on_fail_basis: "stated"
      - n: "3"
        kind: "check"
        action: >-
          Pair OPS and Signature packets by bracketing: with nested OPS packets the first
          Signature after the content belongs to the last OPS. An OPS with nested flag 0 is
          followed directly by another OPS over the same content.
        basis: "stated"
        locator: "§5.4, §10.3.2.2"
        constrained_by:
          - "rfc-9580#R-0347"
        on_fail: >-
          A version mismatch between an OPS and its Signature invalidates only that
          signature (R-0347). A missing corresponding Signature: unspecified.
        on_fail_basis: "stated"
      - n: "4"
        kind: "check"
        action: >-
          Version constraints: discard ESKs not aligned with the payload version (Table
          26); OPS, Signature and key versions per Table 27.
        basis: "stated"
        locator: "§10.3.2.1, §10.3.2.2"
        constrained_by:
          - "rfc-9580#R-0343"
          - "rfc-9580#R-0347"
        on_fail: "Discard the misaligned ESK (R-0343); discard the misaligned signature (R-0347)."
        on_fail_basis: "stated"
      - n: "5"
        kind: "control"
        action: >-
          Unwrap: after decryption (seipd-v2-decryption, seipd-v1-decryption) or
          decompression, parse the resulting octets from step 1 as a new, bounded stream: v2
          SEIPD content must be an Optionally Padded Message, v1 SEIPD and SED content an
          OpenPGP Message, decompressed content an OpenPGP Message. Limit compression depth.
        messages:
          - "Optionally Padded Message"
          - "Compressed Data Packet"
        basis: "stated"
        locator: "§10.3.1, §13.14"
        quotes:
          - |-
            When any unwrapping is performed, the resulting stream of octets is parsed into a series of OpenPGP packets like any other stream of octets.
        constrained_by:
          - "rfc-9580#R-0331"
          - "rfc-9580#R-0332"
          - "rfc-9580#R-0333"
          - "rfc-9580#R-0334"
          - "rfc-9580#R-0335"
          - "rfc-9580#R-0419"
        invokes:
          - "packet-stream-parsing"
        on_fail: >-
          A packet whose length crosses the end of the unwrapped stream is malformed and
          unusable (R-0335).
        on_fail_basis: "stated"
      - n: "6"
        kind: "control"
        action: >-
          Padding packets: accept one as the last packet inside a v2 SEIPD (Optionally
          Padded Message), and be able to process (ignore) one anywhere else.
        messages:
          - "Padding Packet"
        basis: "stated"
        locator: "§5.14, §10.3"
        constrained_by:
          - "rfc-9580#R-0236"
          - "rfc-9580#R-0239"
        on_fail: "n/a"
        on_fail_basis: "n/a"
        note: "See source_defects_and_ambiguities padding-vs-grammar."
  - name: "session-key-recovery"
    title: >-
      Recovering the session key from a PKESK (v6 or v3) or SKESK (v6 or v4), with
      anonymous recipients, PKCS#1 decoding, X25519/X448 and ECDH unwrapping, and the
      uniform-error rule
    locator: "§5.1, §5.1.1 to §5.1.8, §5.3, §5.3.1, §5.3.2, §11.5, §12.1.2, §13.5"
    performed_by:
      - "recipient"
    status: "composite"
    inputs:
      - "the aligned ESK packets of an Encrypted Message"
      - "the recipient's secret keys, and passphrases from the user"
    outputs:
      - "the session key and the symmetric cipher ID (from the v3 PKESK or v4 SKESK plaintext, or from the v2 SEIPD header)"
    steps:
      - n: "1"
        kind: "select"
        action: >-
          Choose a PKESK addressed to a key held: v6 by key version and fingerprint, v3 by
          Key ID (not assumed unique); an anonymous PKESK (size 0, or all-zero Key ID) is
          tried against every available private key.
        messages:
          - "Public Key Encrypted Session Key Packet v6"
          - "Public Key Encrypted Session Key Packet v3"
        basis: "stated"
        locator: "§5.1.1, §5.1.2, §5.1.8, §3.3"
        constrained_by:
          - "rfc-9580#R-0005"
          - "rfc-9580#R-0042"
        on_fail: "Try the next ESK; with none left the message cannot be decrypted (reporting unspecified)."
        on_fail_basis: "inferred"
      - n: "2"
        kind: "compute"
        action: >-
          Unlock the matching secret key (secret-key-unlock), then decrypt by algorithm:
          RSA/Elgamal and EME-PKCS1-v1_5 decode; ECDH: S = rV, KDF with the recipient's
          parameters, AES key unwrap, strip PKCS#5 padding, check the 2-octet checksum;
          X25519/X448: shared secret, HKDF-SHA256/SHA512 over ephemeral key, recipient key and
          shared secret ("OpenPGP X25519"/"OpenPGP X448"), AES-128/AES-256 key unwrap.
        basis: "stated"
        locator: "§5.1.3, §5.1.4, §5.1.5, §5.1.6, §5.1.7, §11.5, §12.1.2"
        quotes:
          - |-
            The decryption is the inverse of the method given. Note that the recipient with key pair (r,R) obtains the shared secret by calculating:
        constrained_by:
          - "rfc-9580#R-0366"
          - "rfc-9580#R-0367"
          - "rfc-9580#R-0355"
        invokes:
          - "secret-key-unlock"
        on_fail: >-
          PKCS#1: output "decryption error" and stop (R-0367). Other algorithms: unspecified
          beyond the uniform error of step 4.
        on_fail_basis: "stated"
      - n: "3"
        kind: "check"
        action: >-
          Parse the plaintext: v3 PKESK: cipher ID (in clear for X25519/X448, which must
          name AES-128/192/256), session key, 2-octet checksum (not for X25519/X448); v6
          PKESK: session key (and checksum where the algorithm adds one), its size matching
          the v2 SEIPD cipher.
        basis: "stated"
        locator: "§5.1.3, §5.1.6, §5.1.7, §13.5"
        constrained_by:
          - "rfc-9580#R-0040"
          - "rfc-9580#R-0041"
        on_fail: "Uniform error (step 4)."
        on_fail_basis: "stated"
      - n: "4"
        kind: "control"
        action: >-
          Report every PKESK failure, every session-key parsing failure and every SEIPD
          integrity failure with one error code, in constant time where timing is
          observable; padding checks strict and constant time.
        basis: "stated"
        locator: "§13.5"
        quotes:
          - |-
            To prevent the attack, in settings where the attacker does not have access to timing information concerning message decryption, the simplest solution is to report a single error code for all variants of PKESK processing errors as well as SEIPD integrity errors (this also includes session key parsing errors, such as on an invalid cipher algorithm for v3 PKESK, or a session key size mismatch for v6 PKESK).
        constrained_by:
          - "rfc-9580#R-0403"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "5"
        kind: "compute"
        action: >-
          SKESK v6: S2K over the passphrase, KEK = HKDF-SHA256(S2K output, no salt, info
          0xC3, 6, cipher, AEAD); AEAD-decrypt the encrypted session key with the stored IV
          and additional data equal to info; the tag must verify.
        messages:
          - "Symmetric Key Encrypted Session Key Packet v6"
        basis: "stated"
        locator: "§5.3.2, §9.5"
        constrained_by:
          - "rfc-9580#R-0304"
        on_fail: "Tag failure: wrong passphrase or tampering; reporting unspecified."
        on_fail_basis: "unspecified"
      - n: "6"
        kind: "compute"
        action: >-
          SKESK v4: S2K over the passphrase; if no encrypted session key is present (judged
          from packet length and S2K size) the S2K output is the session key with the
          packet's cipher; otherwise CFB-decrypt with a zero IV to get cipher ID and session
          key. No integrity check exists.
        messages:
          - "Symmetric Key Encrypted Session Key Packet v4"
        basis: "stated"
        locator: "§5.3.1"
        quotes:
          - |-
            If the encrypted session key is not present (which can be detected on the basis of packet length and S2K Specifier size), then the S2K algorithm applied to the passphrase produces the session key for decrypting the message, using the Symmetric Cipher Algorithm ID from the Symmetric Key Encrypted Session Key packet.
        on_fail: "Undetectable here; a wrong key surfaces at the v1 SEIPD quick check or MDC."
        on_fail_basis: "inferred"
  - name: "seipd-v2-decryption"
    title: "v2 SEIPD (AEAD) decryption: key derivation, chunk loop, final tag, release policy"
    locator: "§5.13.2, §5.13.3, §5.13.4, §5.13.5, §9.6, §13.7"
    performed_by:
      - "recipient"
    status: "normative-procedure"
    inputs:
      - "v2 SEIPD packet: version 2, cipher ID, AEAD ID, chunk size octet c, 32-octet salt, ciphertext chunks with tags, final tag"
      - "session key"
    outputs:
      - "the plaintext Optionally Padded Message, or an integrity failure"
    steps:
      - n: "1"
        kind: "check"
        action: "Accept chunk size octets 0 to 16; chunk_size = 1 << (c + 6)."
        basis: "stated"
        locator: "§5.13.2"
        quotes:
          - |-
            chunk_size = (uint32_t) 1 << (c + 6)
        constrained_by:
          - "rfc-9580#R-0234"
        on_fail: "unspecified for c > 16 (only acceptance of 0 to 16 is required)."
        on_fail_basis: "unspecified"
      - n: "2"
        kind: "compute"
        action: >-
          HKDF-SHA256 with IKM the session key, salt the packet salt, info the packet type
          octet 0xD2, version, cipher ID, AEAD ID, chunk size octet; take M + N - 64 bits:
          the leftmost M bits are the message key, the remaining N - 64 bits the IV (N: 128
          EAX, 120 OCB, 96 GCM).
        basis: "stated"
        locator: "§5.13.2, §9.6"
        quotes:
          - |-
            The leftmost M bits are used as a symmetric algorithm key, and the remaining N - 64 bits are used as an IV.
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "3"
        kind: "control"
        action: >-
          For chunk i = 0, 1, ...: nonce = IV || i (64-bit big-endian); additional data =
          the five header octets; decrypt and verify the chunk's 16-octet tag. The last
          chunk may be short.
        basis: "stated"
        locator: "§5.13.2, §13.7"
        quotes:
          - |-
            The encrypted data consists of the encryption of each chunk of plaintext, followed immediately by the relevant authentication tag.
        constrained_by:
          - "rfc-9580#R-0406"
        on_fail: >-
          Tag failure: MUST NOT parse or release decrypted data, MUST halt with an error
          (R-0406).
        on_fail_basis: "stated"
      - n: "4"
        kind: "check"
        action: >-
          Verify the final tag: AEAD over the empty string with additional data the five
          header octets plus the 8-octet total plaintext length (the nonce index is the
          number of chunks, shown only by the test vectors).
        basis: "stated"
        locator: "§5.13.2, Appendix A.8.4, §13.7"
        constrained_by:
          - "rfc-9580#R-0406"
          - "rfc-9580#R-0408"
        on_fail: >-
          Bad final tag: halt with an error, release nothing (R-0406). Missing final chunk
          (truncation): a streaming implementation may have released fully authenticated
          chunks but must give a clear error at once (R-0408).
        on_fail_basis: "stated"
      - n: "5"
        kind: "emit"
        action: >-
          Only now hand the plaintext to message-grammar-parsing (non-streaming), or confirm
          the stream (streaming).
        basis: "stated"
        locator: "§13.7"
        quotes:
          - |-
            Parsing or releasing decrypted data before having confirmed its integrity can leak the decrypted data [EFAIL] [MRLG15].
        on_fail: "n/a"
        on_fail_basis: "n/a"
  - name: "seipd-v1-decryption"
    title: "v1 SEIPD (CFB with MDC) decryption: prefix, quick check, MDC, release policy"
    locator: "§5.13.1, §13.4, §13.7, §12.9"
    performed_by:
      - "recipient"
    status: "normative-procedure"
    inputs:
      - "v1 SEIPD packet: version 1, CFB ciphertext"
      - "session key and cipher ID from the v3 PKESK or v4 SKESK"
    outputs:
      - "the plaintext OpenPGP Message, or an integrity failure"
    steps:
      - n: "1"
        kind: "compute"
        action: >-
          Decrypt in CFB mode (segment size = block size) with an all-zero IV, one context
          throughout, no resynchronisation.
        basis: "stated"
        locator: "§5.13.1, §12.9"
        constrained_by:
          - "rfc-9580#R-0399"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "2"
        kind: "check"
        action: >-
          Quick check (optional): the last two prefix octets repeat the two before them. A
          mismatch means a wrong session key, but exposing its timing or result is an
          oracle; disabling it prevents the attack; it is pointless when the session key
          came from a PKESK.
        basis: "stated"
        locator: "§5.13.1, §13.4"
        quotes:
          - |-
            Disabling the quick check prevents the attack.
          - |-
            If the session key is public key encrypted, the quick check is not useful as the public key encryption of the session key should guarantee that it is the right session key.
        on_fail: >-
          unspecified as a normative outcome; the source only warns against leaking timing
          or error information.
        on_fail_basis: "unspecified"
      - n: "3"
        kind: "check"
        action: >-
          MDC: plaintext must end with 0xD3 0x14 and 20 octets equal to SHA-1 over the prefix,
          the plaintext and 0xD3 0x14.
        basis: "stated"
        locator: "§5.13.1, §13.7"
        quotes:
          - |-
            During decryption, the plaintext data should be hashed with SHA-1, including the prefix data as well as the trailing constant octets 0xD3, 0x14, but excluding the last 20 octets containing the SHA-1 hash.
        constrained_by:
          - "rfc-9580#R-0231"
          - "rfc-9580#R-0232"
          - "rfc-9580#R-0405"
        on_fail: >-
          Treat as a security problem (R-0231), report it (R-0232), give a clear integrity
          error, do not parse or release, halt (R-0405), unless historic data with the
          user's informed consent (R-0407).
        on_fail_basis: "stated"
      - n: "4"
        kind: "emit"
        action: "Strip prefix and MDC trailer; hand the plaintext to message-grammar-parsing."
        basis: "inferred"
        locator: "§5.13.1, §10.3.1"
        on_fail: "n/a"
        on_fail_basis: "n/a"
  - name: "signature-hash-computation"
    title: "What a signature hashes, by signature version and Signature Type ID"
    locator: "§5.2.2, §5.2.3.6, §5.2.4, §5.2.4.1, §5.2.1.3, Appendix A.3.1"
    performed_by:
      - "signer"
      - "verifier"
      - "keyholder"
      - "certifier"
    status: "normative-procedure"
    inputs:
      - "the Signature packet's version, type, algorithms, hashed subpackets (and v6 salt)"
      - "the signed object: document, key(s), User ID or User Attribute, or another signature"
    outputs:
      - "the digest; its left 16 bits go in the packet"
    steps:
      - n: "1"
        kind: "compute"
        action: "v6: feed the salt into the hash context before anything else."
        basis: "stated"
        locator: "§5.2.4"
        constrained_by:
          - "rfc-9580#R-0164"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "2"
        kind: "compute"
        action: >-
          Document types: 0x00 the data as is; 0x01 the data converted to UTF-8 with CR LF
          line endings; 0x02 nothing (as a zero-length binary document).
        basis: "stated"
        locator: "§5.2.4, §5.2.1.2, §5.2.1.3"
        constrained_by:
          - "rfc-9580#R-0047"
          - "rfc-9580#R-0165"
          - "rfc-9580#R-0166"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "3"
        kind: "compute"
        action: >-
          Key types: the key is hashed as 0x99, 2-octet length, key packet body (v4) or 0x9B,
          4-octet length, body (v6). 0x1F and 0x20: the primary key only. 0x18 and 0x19:
          primary key then subkey, same format. 0x28: primary key then the revoked subkey.
          0x10 to 0x13 and 0x30: primary key then (v4/v6) 0xB4 or 0xD1, 4-octet length, User
          ID or User Attribute body (v3: the body without header).
        basis: "stated"
        locator: "§5.2.4, §5.2.1.13"
        constrained_by:
          - "rfc-9580#R-0055"
          - "rfc-9580#R-0167"
          - "rfc-9580#R-0168"
          - "rfc-9580#R-0169"
          - "rfc-9580#R-0170"
          - "rfc-9580#R-0171"
          - "rfc-9580#R-0172"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "4"
        kind: "compute"
        action: >-
          0x50: 0x88, 4-octet length, the target Signature packet body with its unhashed
          area dropped and the unhashed length set to zero.
        basis: "stated"
        locator: "§5.2.4"
        constrained_by:
          - "rfc-9580#R-0173"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "5"
        kind: "compute"
        action: >-
          Trailer. v4/v6: version, type, public-key algorithm, hash algorithm, hashed
          subpacket length (2 octets v4, 4 octets v6), hashed subpackets, then version again,
          0xFF, and the 4-octet length (mod 2^32) of the hashed signature data. v3: type and
          4-octet creation time only (type never 0xFF).
        basis: "stated"
        locator: "§5.2.4, §5.2.4.1, §5.2.2, §5.2.3.6"
        constrained_by:
          - "rfc-9580#R-0058"
          - "rfc-9580#R-0059"
          - "rfc-9580#R-0075"
          - "rfc-9580#R-0174"
          - "rfc-9580#R-0175"
          - "rfc-9580#R-0176"
          - "rfc-9580#R-0177"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "6"
        kind: "emit"
        action: >-
          Finish the single hash context; the digest is the input to the signature
          algorithm and its first two octets go in the packet.
        basis: "stated"
        locator: "§5.2.4"
        quotes:
          - |-
            After all this has been hashed in a single hash context, the resulting hash field is used in the signature algorithm, and its first two octets are placed in the Signature packet, as described in Section 5.2.3.
        on_fail: "n/a"
        on_fail_basis: "n/a"
  - name: "signature-verification"
    title: >-
      Verifying one Signature packet: well-formedness and version binding, subpacket
      criticality, issuer key, hash recomputation, quick reject, cryptographic check,
      algorithm strength, time and context checks, and the ignore-not-abort outcome
    locator: "§5.2.3, §5.2.3.6, §5.2.3.7, §5.2.3.11, §5.2.3.12, §5.2.3.18, §5.2.3.35, §5.2.3.36, §5.2.5, §9.5, §10.3.2.2, §13.13"
    performed_by:
      - "verifier"
    status: "composite"
    inputs:
      - "a Signature packet (and its OPS, if one-pass)"
      - "the signed object"
      - "candidate certificates of the issuer"
      - "the encryption context, if the signature was inside an encrypted message"
    outputs:
      - "valid, or ignored for validation (never an abort of the stream)"
    steps:
      - n: "1"
        kind: "check"
        action: >-
          Well-formedness: known signature type and version (v3 may be accepted, 0xFF
          never validated), lengths consistent, hashed area within the packet, salt length
          equal to Table 23 for the hash (v6), no weak hash, OPS version matching.
        basis: "stated"
        locator: "§5.2.5, §5.2.1.16, §5.2.3, §5.2"
        quotes:
          - |-
            A hashed subpacket area with length that exceeds the length of the Signature packet itself
          - |-
            A mismatch between the expected salt length of the hash algorithm and the actual salt length
        constrained_by:
          - "rfc-9580#R-0046"
          - "rfc-9580#R-0057"
          - "rfc-9580#R-0060"
          - "rfc-9580#R-0178"
        on_fail: "Ignore the signature for validation (R-0178); never report it valid (R-0179)."
        on_fail_basis: "stated"
      - n: "2"
        kind: "check"
        action: >-
          Subpackets: an unknown subpacket with the critical bit set (in the hashed area)
          makes the signature in error; unknown non-critical ones are ignored; a critical
          notation's criticality applies to that notation only. A Regular Expression
          without its null terminator is rejected (critical: the signature).
        basis: "stated"
        locator: "§5.2.3.7, §5.2.3.24, §5.2.3.22, §5.2.5"
        quotes:
          - |-
            An unknown "critical" subpacket (see Section 5.2.3.7) in the hashed area
          - |-
            If there is a critical notation, the criticality applies to that specific notation and not to notations in general.
        constrained_by:
          - "rfc-9580#R-0080"
          - "rfc-9580#R-0081"
          - "rfc-9580#R-0127"
        on_fail: "The signature is in error, hence ignored for validation (R-0080, R-0178)."
        on_fail_basis: "stated"
      - n: "3"
        kind: "check"
        action: >-
          Signature Creation Time must be present in the hashed area. Use hashed
          subpackets for anything definitive; unhashed ones are advisory and may be ignored
          when their provenance is unknown.
        basis: "stated"
        locator: "§5.2.3.11, §5.2.3.8, §13.13"
        quotes:
          - |-
            If a subpacket is not hashed, then the information in it cannot be considered definitive because it is not covered by the cryptographic signature.
        constrained_by:
          - "rfc-9580#R-0101"
          - "rfc-9580#R-0418"
        on_fail: >-
          unspecified for a missing creation time: R-0101 binds the producer; treating the
          signature as malformed is the inferred reading.
        on_fail_basis: "unspecified"
      - n: "4"
        kind: "select"
        action: >-
          Find the issuer key: by Issuer Fingerprint (whose version octet must equal the
          signature version; with a v4 key an Issuer Key ID must equal the fingerprint's low
          64 bits), or by Issuer Key ID (not unique; try every candidate), or by the OPS
          fingerprint or Key ID. The signature version must match the key version (a v6
          key signs only v6).
        basis: "stated"
        locator: "§5.2.3.12, §5.2.3.35, §3.3, §5.2.5, §10.3.2.2"
        quotes:
          - |-
            A signature with a version other than 6, made by a version 6 key
        constrained_by:
          - "rfc-9580#R-0005"
          - "rfc-9580#R-0158"
          - "rfc-9580#R-0159"
          - "rfc-9580#R-0160"
          - "rfc-9580#R-0344"
        on_fail: >-
          Version octet mismatch: malformed signature (R-0160), ignored. No key found: no
          successful validation (inferred).
        on_fail_basis: "stated"
      - n: "5"
        kind: "check"
        action: >-
          The issuer key must be valid for the act at the signature's creation time: not
          revoked (or revoked only as superseded or retired, for older signatures), not
          expired, bound by a valid self-signature and, for a subkey, a binding signature
          with back-signature for signing.
        basis: "inferred"
        locator: "§5.2.3.10, §5.2.3.31, §5.2.1.11, §5.2.1.12, §10.1.5"
        constrained_by:
          - "rfc-9580#R-0050"
          - "rfc-9580#R-0052"
          - "rfc-9580#R-0098"
          - "rfc-9580#R-0149"
        invokes:
          - "key-validity-evaluation"
        on_fail: >-
          inferred: no successful validation. The source states that revoked keys are not
          to be used but not how a verifier dates the check.
        on_fail_basis: "inferred"
      - n: "6"
        kind: "compute"
        action: "Recompute the digest over the signed object."
        basis: "stated"
        locator: "§5.2.4"
        invokes:
          - "signature-hash-computation"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "7"
        kind: "check"
        action: >-
          Quick reject: compare the packet's left 16 bits with the digest's first two
          octets. For v6 a mismatch rejects; for v4 it is an optional shortcut.
        basis: "stated"
        locator: "§5.2.3.6, §5.2.2"
        constrained_by:
          - "rfc-9580#R-0076"
        on_fail: "v6: reject the signature (R-0076)."
        on_fail_basis: "stated"
      - n: "8"
        kind: "check"
        action: >-
          Cryptographic verification with the issuer key's algorithm: Ed25519/Ed448
          (PureEdDSA over the digest; Ed448 empty context), ECDSA/DSA (truncated digest),
          RSA (EMSA-PKCS1-v1_5 with the Table 24 prefix), EdDSALegacy (v4 only). Reject
          digests smaller than the algorithm requires; no DSA; no RSA under 2048 bits.
        basis: "stated"
        locator: "§5.2.3.1 to §5.2.3.5, §12.4, §12.5, §12.7"
        constrained_by:
          - "rfc-9580#R-0061"
          - "rfc-9580#R-0065"
          - "rfc-9580#R-0067"
          - "rfc-9580#R-0068"
          - "rfc-9580#R-0069"
          - "rfc-9580#R-0071"
          - "rfc-9580#R-0072"
          - "rfc-9580#R-0074"
          - "rfc-9580#R-0386"
          - "rfc-9580#R-0389"
          - "rfc-9580#R-0394"
        on_fail: "The signature is invalid: ignored, never reported valid (R-0178, R-0179)."
        on_fail_basis: "stated"
      - n: "9"
        kind: "check"
        action: >-
          Hash strength: never validate a recent signature that depends on MD5, SHA-1 or
          RIPEMD-160; an old one only if it predates the known weakness and has been in
          the user's custody. Optionally detect SHA-1 collision inputs.
        basis: "stated"
        locator: "§9.5, §13.1, §13"
        quotes:
          - |-
            Only signatures using acceptably strong hash algorithms should be accepted as valid.
        constrained_by:
          - "rfc-9580#R-0305"
          - "rfc-9580#R-0306"
          - "rfc-9580#R-0402"
        on_fail: "Do not validate (R-0305)."
        on_fail_basis: "stated"
      - n: "10"
        kind: "check"
        action: >-
          Time: the signature has expired if Signature Expiration Time is non-zero and
          creation time plus it is past. Context: with Intended Recipient Fingerprint
          subpackets, valid only if decrypted with one of those keys or their subkeys. For
          mail, optionally require a valid User ID self-signature matching the From:
          header.
        basis: "stated"
        locator: "§5.2.3.18, §5.2.3.36, §5.2.3.10, §13.12"
        constrained_by:
          - "rfc-9580#R-0100"
          - "rfc-9580#R-0107"
          - "rfc-9580#R-0161"
        on_fail: >-
          Outside its encrypted context: SHOULD be considered invalid (R-0161). Expired:
          unspecified beyond the definition of the validity period.
        on_fail_basis: "stated"
      - n: "11"
        kind: "emit"
        action: >-
          Outcome: valid, or ignored. Never halt the stream or reject other signatures
          because one is unknown or invalid.
        basis: "stated"
        locator: "§5.2.5"
        constrained_by:
          - "rfc-9580#R-0178"
          - "rfc-9580#R-0179"
          - "rfc-9580#R-0180"
        on_fail: "n/a"
        on_fail_basis: "n/a"
  - name: "key-validity-evaluation"
    title: >-
      Evaluating a certificate: Direct Key signature, most recent valid self-signatures,
      revocations, expiry, User ID bindings, subkey bindings with back-signatures, key
      flags, version and algorithm constraints
    locator: "§5.2.1.8 to §5.2.1.13, §5.2.3.10, §5.2.3.13, §5.2.3.29, §5.2.3.31, §10.1, §10.1.5"
    performed_by:
      - "verifier"
      - "sender"
    status: "composite"
    inputs:
      - "a Transferable Public Key (parsed)"
      - "an evaluation time"
    outputs:
      - "per component (primary key, each User ID, each subkey): usable or not, and the effective flags, expiry, features and preferences"
    steps:
      - n: "1"
        kind: "check"
        action: >-
          Structure and versions: primary key first, signing-capable; v6 subkeys under a v6
          primary and v4 under v4; v3 keys without subkeys; ECDH v6 parameters fixed;
          deprecated curve OIDs and Curve25519Legacy not in v6.
        messages:
          - "OpenPGP Version 6 Certificate"
          - "OpenPGP Version 4 Certificate"
        basis: "stated"
        locator: "§10.1.1, §10.1.3, §10.1.4, §10.1.5, §9.2, §11.5.1, §5.5.5.6.1.1"
        constrained_by:
          - "rfc-9580#R-0198"
          - "rfc-9580#R-0286"
          - "rfc-9580#R-0312"
          - "rfc-9580#R-0318"
          - "rfc-9580#R-0321"
          - "rfc-9580#R-0323"
        on_fail: "unspecified. The component, or the certificate, is not usable (inferred)."
        on_fail_basis: "unspecified"
      - n: "2"
        kind: "check"
        action: >-
          Primary key revocation: a valid Key Revocation signature by the primary key
          itself (or a Revocation Key) means the key is not to be used.
        messages:
          - "Signature Packet v6 (type 0x20)"
        basis: "stated"
        locator: "§5.2.1.11, §10.1.5"
        constrained_by:
          - "rfc-9580#R-0050"
          - "rfc-9580#R-0051"
        invokes:
          - "signature-verification"
        on_fail: "The key is revoked; the meaning for earlier signatures depends on the reason (R-0149)."
        on_fail_basis: "stated"
      - n: "3"
        kind: "select"
        action: >-
          Self-signatures: verify each (accepted regardless of the primary key's own Key
          Flags), and for each object keep only the most recent valid one. A v6 key needs
          a valid Direct Key signature before any use; a v4 key's metadata is
          conventionally in a User ID self-signature. A Direct Key signature revoked by a
          valid Certification Revocation (0x30) is cancelled and does not count.
        messages:
          - "Signature Packet v6 (type 0x1F)"
          - "Signature Packet v6 (type 0x13)"
          - "Signature Packet v6 (type 0x30)"
        basis: "stated"
        locator: "§5.2.3.10, §5.2.1.13"
        quotes:
          - |-
            A cryptographically valid self-signature should be accepted from any primary key, regardless of what Key Flags (Section 5.2.3.29) apply to the primary key.
          - |-
            Revoking a Direct Key signature cancels that signature.
        constrained_by:
          - "rfc-9580#R-0091"
          - "rfc-9580#R-0095"
          - "rfc-9580#R-0096"
          - "rfc-9580#R-0098"
        invokes:
          - "signature-verification"
        on_fail: "v6 without a valid Direct Key signature: MUST NOT be used (R-0098)."
        on_fail_basis: "stated"
      - n: "4"
        kind: "compute"
        action: >-
          Expiry: the primary key expires Key Expiration Time seconds after its creation
          (from the Direct Key or certification self-signature); zero or absent means
          never. Subpackets in the most recent self-signature apply to the key, User ID or
          subkey that signature covers.
        messages:
          - "Key Expiration Time"
        basis: "stated"
        locator: "§5.2.3.13, §5.2.3.10"
        quotes:
          - |-
            For a direct or certification self-signature, the key creation time is that of the primary key.
          - |-
            Subpackets that appear in a certification self-signature apply to the User ID, and subpackets that appear in the subkey self-signature apply to the subkey. Lastly, subpackets on the Direct Key signature apply to the entire key.
        constrained_by:
          - "rfc-9580#R-0104"
        on_fail: "An expired key: unspecified beyond the definition (not usable is the inferred reading)."
        on_fail_basis: "unspecified"
      - n: "5"
        kind: "check"
        action: >-
          Each User ID: bound if its most recent valid self-signature is not revoked by a
          valid Certification Revocation; a revoked self-signature retires the name.
          Third-party certifications on it are kept for the verifier's own validity
          calculation, minus revoked ones.
        messages:
          - "User ID Packet"
          - "Signature Packet v6 (type 0x30)"
        basis: "stated"
        locator: "§5.2.3.10, §5.2.1.13, §5.2.3.31, §5.2.3.20"
        constrained_by:
          - "rfc-9580#R-0090"
          - "rfc-9580#R-0112"
          - "rfc-9580#R-0151"
        on_fail: "The User ID is not bound (inferred)."
        on_fail_basis: "inferred"
      - n: "6"
        kind: "check"
        action: >-
          Each subkey: at least one valid Subkey Binding signature by the primary key; a
          signing-capable subkey also needs the embedded Primary Key Binding signature made
          by the subkey; not revoked by a Subkey Revocation from the primary key; not
          expired (Key Expiration Time counted from the subkey's creation).
        messages:
          - "Signature Packet v6 (type 0x18)"
          - "Signature Packet v6 (type 0x19)"
          - "Signature Packet v6 (type 0x28)"
          - "Embedded Signature"
        basis: "stated"
        locator: "§5.2.1.8, §5.2.1.12, §5.2.3.13, §10.1.1, §10.1.5, §5.2.3.10"
        constrained_by:
          - "rfc-9580#R-0049"
          - "rfc-9580#R-0052"
          - "rfc-9580#R-0053"
          - "rfc-9580#R-0088"
          - "rfc-9580#R-0313"
          - "rfc-9580#R-0314"
          - "rfc-9580#R-0326"
        invokes:
          - "signature-verification"
        on_fail: "The subkey is not usable (inferred from R-0052 and the MUST rules)."
        on_fail_basis: "inferred"
      - n: "7"
        kind: "compute"
        action: >-
          Effective use: Key Flags of the most recent binding (Direct Key or Subkey Binding)
          say what the key may be used for; a flags list shorter than expected has the
          missing flags zero. Effective preferences and Features come from the hashed area
          of the applicable self-signature.
        messages:
          - "Key Flags"
          - "Features"
        basis: "stated"
        locator: "§5.2.3.29, §5.2.3.32, §5.2.3.10, §13.13"
        constrained_by:
          - "rfc-9580#R-0142"
          - "rfc-9580#R-0143"
          - "rfc-9580#R-0418"
        on_fail: "n/a"
        on_fail_basis: "n/a"
  - name: "preference-negotiation"
    title: >-
      Choosing algorithms and formats from recipients' advertised Features and preference
      lists, with the implicit mandatory-to-implement fallbacks
    locator: "§5.2.3.7, §5.2.3.14 to §5.2.3.17, §5.2.3.32, §12.2, §12.3, §13.7"
    performed_by:
      - "sender"
      - "signer"
    status: "composite"
    inputs:
      - "each recipient's effective Features and preference subpackets (key-validity-evaluation step 7)"
    outputs:
      - "container version, cipher (and AEAD mode), compression algorithm, hash algorithm"
    steps:
      - n: "1"
        kind: "select"
        action: >-
          Container: v2 SEIPD if every recipient supports it (Features 0x08, or a v6 key
          without Features, or other inference); else v1 SEIPD. Without Features support,
          decide from key versions or external inference.
        messages:
          - "Features"
        basis: "stated"
        locator: "§13.7, §5.2.3.7, §5.2.3.32"
        constrained_by:
          - "rfc-9580#R-0085"
          - "rfc-9580#R-0152"
          - "rfc-9580#R-0411"
          - "rfc-9580#R-0412"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "2"
        kind: "select"
        action: >-
          Cipher: for v2 the first (cipher, AEAD) pair in every recipient's Preferred AEAD
          Ciphersuites, AES-128/OCB if none; for v1 the first cipher in every recipient's
          Preferred Symmetric Ciphers, AES-128 if none. A recipient without the subpacket
          is treated as AES-128 only.
        messages:
          - "Preferred AEAD Ciphersuites"
          - "Preferred Symmetric Ciphers for v1 SEIPD"
        basis: "stated"
        locator: "§5.2.3.14, §5.2.3.15, §12.2, §5.2.3.7"
        quotes:
          - |-
            Note also that if an implementation does not implement the preference, then it is implicitly an AES-128-only implementation.
        constrained_by:
          - "rfc-9580#R-0084"
          - "rfc-9580#R-0106"
          - "rfc-9580#R-0373"
          - "rfc-9580#R-0374"
          - "rfc-9580#R-0375"
        on_fail: "n/a (the intersection is never empty)."
        on_fail_basis: "stated"
      - n: "3"
        kind: "select"
        action: >-
          Compression: an algorithm in every recipient's list, Uncompressed tacitly
          allowed; the absence of the subpacket means uncompressed preferred (older
          implementations may assume ZIP).
        messages:
          - "Preferred Compression Algorithms"
        basis: "stated"
        locator: "§5.2.3.17, §12.3.1"
        constrained_by:
          - "rfc-9580#R-0378"
          - "rfc-9580#R-0379"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "4"
        kind: "select"
        action: >-
          Hash (when signing for a known recipient): one in the recipient's Preferred Hash
          Algorithms, SHA2-256 tacitly last, but never a weak one because it is requested.
        messages:
          - "Preferred Hash Algorithms"
        basis: "stated"
        locator: "§5.2.3.16, §12.3.2, §13"
        constrained_by:
          - "rfc-9580#R-0381"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "5"
        kind: "check"
        action: >-
          Scope: read preferences narrowly (the User ID the key was found by, the Primary
          User ID when found by Key ID, the Direct Key signature for v6) and only from the
          hashed area.
        basis: "stated"
        locator: "§5.2.3.10, §13.13"
        quotes:
          - |-
            If the key is located by Key ID, the algorithm of the Primary User ID of the key provides the preferred AEAD ciphersuite.
        constrained_by:
          - "rfc-9580#R-0089"
          - "rfc-9580#R-0418"
        on_fail: "n/a"
        on_fail_basis: "n/a"
  - name: "cleartext-signature-verification"
    title: "Verifying a Cleartext Signature Framework message"
    locator: "§7.1, §7.2, §6.2.2.3, §5.2.1.2"
    performed_by:
      - "verifier"
    status: "normative-procedure"
    inputs:
      - "a cleartext signed message"
    outputs:
      - "the signed text and the signature results, or a refusal to validate"
    steps:
      - n: "1"
        kind: "parse"
        action: "Find the -----BEGIN PGP SIGNED MESSAGE----- line."
        messages:
          - "Cleartext Signed Message"
        basis: "stated"
        locator: "§7.1"
        on_fail: "Not a cleartext signed message (inferred)."
        on_fail_basis: "inferred"
      - n: "2"
        kind: "check"
        action: >-
          Up to the first empty line only well-formed Hash headers may appear; ignore their
          contents and use the hash algorithm in the signature itself.
        basis: "stated"
        locator: "§7.1, §6.2.2.3"
        constrained_by:
          - "rfc-9580#R-0259"
          - "rfc-9580#R-0260"
          - "rfc-9580#R-0264"
          - "rfc-9580#R-0267"
        on_fail: "Decline to validate any signature in the message (R-0259, R-0267)."
        on_fail_basis: "stated"
      - n: "3"
        kind: "parse"
        action: >-
          Read the text up to the line ending before -----BEGIN PGP SIGNATURE-----; undo
          dash-escaping (strip "- " at line start), warning on "-" followed by any other
          character.
        basis: "stated"
        locator: "§7.1, §7.2"
        constrained_by:
          - "rfc-9580#R-0265"
          - "rfc-9580#R-0273"
          - "rfc-9580#R-0274"
        on_fail: "Warn (R-0274)."
        on_fail_basis: "stated"
      - n: "4"
        kind: "compute"
        action: >-
          Canonicalise: remove trailing spaces and tabs from every line, CR LF line
          endings, drop the final line ending.
        basis: "stated"
        locator: "§7.1"
        constrained_by:
          - "rfc-9580#R-0266"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "5"
        kind: "check"
        action: "Dearmor the signature block and verify each Text Signature over the canonical text."
        messages:
          - "ASCII Armor"
          - "Signature Packet v6 (type 0x01)"
        basis: "stated"
        locator: "§7.1, §5.2.1.2"
        invokes:
          - "armor-decoding"
          - "signature-verification"
        on_fail: "As signature-verification."
        on_fail_basis: "stated"
  - name: "armor-decoding"
    title: "Decoding ASCII Armor: header line, Armor Headers, base64, optional CRC24, tail"
    locator: "§6, §6.1, §6.2, §6.2.1, §6.2.2, §6.2.3"
    performed_by:
      - "recipient"
      - "verifier"
    status: "normative-procedure"
    inputs:
      - "armored text"
    outputs:
      - "the binary OpenPGP object and its kind (from the header line)"
    steps:
      - n: "1"
        kind: "parse"
        action: >-
          Find an Armor Header Line (BEGIN PGP MESSAGE, PUBLIC KEY BLOCK, PRIVATE KEY BLOCK,
          SIGNATURE) that starts a line and has only whitespace after it.
        messages:
          - "ASCII Armor"
        basis: "stated"
        locator: "§6.2.1"
        constrained_by:
          - "rfc-9580#R-0252"
          - "rfc-9580#R-0253"
        on_fail: "unspecified."
        on_fail_basis: "unspecified"
      - n: "2"
        kind: "parse"
        action: >-
          Read Armor Headers ("Key: value") until a blank line; ignore unknown keys; treat
          Comment, Version and Charset as unauthenticated information (Charset may be
          honoured or ignored).
        basis: "stated"
        locator: "§6.2.2, §6.2.2.4"
        quotes:
          - |-
            The Armor Headers are a part of the armor, not the message, and hence are not protected by any signatures applied to the message.
        constrained_by:
          - "rfc-9580#R-0255"
          - "rfc-9580#R-0256"
          - "rfc-9580#R-0261"
          - "rfc-9580#R-0262"
          - "rfc-9580#R-0263"
        on_fail: "Improperly formatted headers: may be treated as corruption, but SHOULD try to recover (R-0255)."
        on_fail_basis: "stated"
      - n: "3"
        kind: "compute"
        action: "Base64-decode the body, ignoring all whitespace."
        basis: "stated"
        locator: "§6"
        constrained_by:
          - "rfc-9580#R-0240"
          - "rfc-9580#R-0241"
        on_fail: "unspecified."
        on_fail_basis: "unspecified"
      - n: "4"
        kind: "check"
        action: >-
          A line starting with "=" right after the data is the CRC24 footer (generator
          0x864CFB, init 0xB704CE); never reject on its presence, absence, malformation or
          mismatch.
        basis: "stated"
        locator: "§6.1"
        constrained_by:
          - "rfc-9580#R-0242"
          - "rfc-9580#R-0243"
          - "rfc-9580#R-0244"
        on_fail: "Do not reject (R-0244)."
        on_fail_basis: "stated"
      - n: "5"
        kind: "parse"
        action: "Expect the matching tail line (BEGIN replaced by END)."
        basis: "stated"
        locator: "§6.2.3"
        on_fail: "unspecified."
        on_fail_basis: "unspecified"
  - name: "secret-key-unlock"
    title: >-
      Unlocking (and, for the producer, protecting) secret key material by S2K usage
      octet: unprotected, AEAD (253), CFB with SHA-1 (254), MalleableCFB (255), legacy
      cipher ID
    locator: "§3.7, §3.7.1, §3.7.2.1, §5.5.3, §9.5, §13.7"
    performed_by:
      - "keyholder"
      - "recipient"
      - "signer"
    status: "normative-procedure"
    inputs:
      - "a Secret Key or Secret Subkey packet"
      - "a passphrase, if protected"
    outputs:
      - "the cleartext algorithm-specific secret key material, or a failure"
    steps:
      - n: "1"
        kind: "check"
        action: >-
          Read the S2K usage octet: 0 clear, 253 AEAD, 254 CFB, 255 MalleableCFB, other
          values a cipher ID with MD5 of the passphrase (legacy). For v6, reject 255, cipher
          IDs and every Generate No row; reject Argon2 with any usage but 253; reject an S2K
          with MD5, SHA-1 or RIPEMD-160 in a v6 packet.
        basis: "stated"
        locator: "§3.7.2.1, §5.5.3, §9.5"
        constrained_by:
          - "rfc-9580#R-0017"
          - "rfc-9580#R-0018"
          - "rfc-9580#R-0191"
          - "rfc-9580#R-0194"
          - "rfc-9580#R-0304"
        on_fail: "Reject the packet (as malformed for the Argon2 rule) (R-0017, R-0018)."
        on_fail_basis: "stated"
      - n: "2"
        kind: "compute"
        action: >-
          Derive the key from the passphrase with the S2K Specifier: Simple, Salted,
          Iterated and Salted (count = (16 + (c & 15)) << ((c >> 4) + 6) octets hashed), or
          Argon2id (version 0x13, t, p, m = 2^encoded_m KiB, tag length = key size).
        basis: "stated"
        locator: "§3.7.1.1, §3.7.1.2, §3.7.1.3, §3.7.1.4"
        quotes:
          - |-
            Argon2 is invoked with the passphrase as P, the salt as S, the values of t, p, and m as described above, the required key size as the tag length T, 0x13 as the version v, and Argon2id as the type.
        constrained_by:
          - "rfc-9580#R-0008"
          - "rfc-9580#R-0009"
        on_fail: "unspecified for invalid Argon2 parameters on input."
        on_fail_basis: "unspecified"
      - n: "3"
        kind: "check"
        action: >-
          253: KEK = HKDF-SHA256(S2K key, no salt, info = packet type octet, version,
          cipher, AEAD); AEAD-decrypt the secret material with the stored nonce and
          additional data = packet type octet plus the public key fields; the tag must
          verify. 254: CFB-decrypt, check the trailing SHA-1 of the plaintext. 255 and
          cipher IDs: CFB-decrypt, check the 2-octet sum (v3 keys resynchronise per MPI and
          leave the length prefixes in clear).
        basis: "stated"
        locator: "§5.5.3, §13.7"
        quotes:
          - |-
            Any Secret-Key packet with encrypted secret key material (Section 3.7.2.1) where there is an integrity failure, based on the value of the secret key protection octet:
        constrained_by:
          - "rfc-9580#R-0195"
          - "rfc-9580#R-0405"
        on_fail: >-
          An integrity failure is malleable ciphertext: clear error, no use of the data
          (R-0405). For 255 and cipher IDs the check is weak and the format is open to
          corruption attacks (§13.7).
        on_fail_basis: "stated"
      - n: "4"
        kind: "check"
        action: >-
          The cleartext must parse exactly into the algorithm's secret MPIs or fields:
          nothing read beyond it, and a length mismatch makes the material unusable.
        basis: "stated"
        locator: "§5.5.3"
        constrained_by:
          - "rfc-9580#R-0196"
          - "rfc-9580#R-0197"
        on_fail: "Reject the secret key material as unusable (R-0197)."
        on_fail_basis: "stated"
      - n: "5"
        kind: "emit"
        action: >-
          Producer side (protecting): only Generate Yes rows; AEAD (253) recommended for v6;
          an S2K Specifier always for passphrase protection.
        basis: "stated"
        locator: "§3.7.2.1, §5.5.3, §13.7"
        constrained_by:
          - "rfc-9580#R-0015"
          - "rfc-9580#R-0016"
          - "rfc-9580#R-0193"
          - "rfc-9580#R-0413"
        on_fail: "n/a"
        on_fail_basis: "n/a"
  - name: "trust-signature-scoping"
    title: >-
      Reading one Trust Signature and its Regular Expression: level, amount, User ID
      matching. Not the web-of-trust computation, which the source does not define
    locator: "§5.2.3.21, §5.2.3.22, §8"
    performed_by:
      - "verifier"
    status: "composite"
    inputs:
      - "a valid certification carrying a Trust Signature subpacket, and its Regular Expression subpackets"
      - "a later certification made by the introducer, and the User ID it certifies"
    outputs:
      - "whether the introducer's certification is within the trust extended, at what depth and amount"
    steps:
      - n: "1"
        kind: "parse"
        action: >-
          Level and amount: level 0 is ordinary validity; level n >= 1 makes the key an
          introducer trusted to issue level n-1 trust signatures; amount < 120 partial, >=
          120 complete.
        messages:
          - "Trust Signature"
        basis: "stated"
        locator: "§5.2.3.21"
        constrained_by:
          - "rfc-9580#R-0115"
          - "rfc-9580#R-0116"
          - "rfc-9580#R-0117"
          - "rfc-9580#R-0118"
          - "rfc-9580#R-0119"
        on_fail: "n/a"
        on_fail_basis: "n/a"
      - n: "2"
        kind: "parse"
        action: >-
          Regular Expression: strip the null terminator (reject the subpacket if missing),
          compile with the §8 syntax (branches with |, pieces with * + ?, atoms ( ) . ^ $ \x,
          ranges [ ] with ^ and -) over Unicode characters.
        messages:
          - "Regular Expression"
        basis: "stated"
        locator: "§5.2.3.22, §8"
        quotes:
          - |-
            Regular Expression: Zero or more branches, separated by |. It matches anything that matches one of the branches.
        constrained_by:
          - "rfc-9580#R-0124"
          - "rfc-9580#R-0125"
          - "rfc-9580#R-0126"
          - "rfc-9580#R-0127"
        on_fail: "Missing terminator: ignore if non-critical, reject the signature if critical (R-0127)."
        on_fail_basis: "stated"
      - n: "3"
        kind: "check"
        action: >-
          Count a certification by the introducer only if the certified User ID matches the
          expression.
        basis: "stated"
        locator: "§5.2.3.22"
        constrained_by:
          - "rfc-9580#R-0122"
          - "rfc-9580#R-0123"
        on_fail: "The certification carries no extended trust."
        on_fail_basis: "stated"
      - n: "4"
        kind: "control"
        action: >-
          Combining levels along a chain, amounts across introducers, several Regular
          Expressions, and the result into key validity is left to the implementation.
        basis: "inferred"
        locator: "§5.2.1, §5.2.3.21"
        on_fail: "n/a"
        on_fail_basis: "n/a"
        status: "not-defined"
error_paths:
  - id: "unknown-critical-packet"
    trigger: "A packet with an unknown Type ID in 0 to 39 appears in a sequence."
    detected_by: "recipient"
    in:
      - "packet-stream-parsing 6"
      - "decrypt-and-verify-message 3"
      - "certificate-import-and-evaluation 2"
    outcome: "The whole packet sequence is rejected."
    basis: "stated"
    locator: "§4.3, §10"
    quotes:
      - |-
        If an implementation encounters a critical packet where the packet type is unknown in a packet sequence, it MUST reject the whole packet sequence (see Section 10).
    constrained_by:
      - "rfc-9580#R-0032"
  - id: "out-of-grammar-critical-packet"
    trigger: "A known critical packet appears where the relevant grammar does not allow it."
    detected_by: "recipient"
    in:
      - "message-grammar-parsing 2"
      - "certificate-import-and-evaluation 2"
      - "detached-signature 5"
    outcome: "The sequence is rejected with an error."
    basis: "stated"
    locator: "§10"
    quotes:
      - |-
        The presence of an unknown critical packet, or a known but unexpected packet, is a critical error, invalidating the entire sequence (see Section 4.3).
    constrained_by:
      - "rfc-9580#R-0309"
      - "rfc-9580#R-0311"
  - id: "unknown-non-critical-packet"
    trigger: "A packet with an unknown Type ID in 40 to 63."
