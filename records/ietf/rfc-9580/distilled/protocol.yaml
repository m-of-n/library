# rfc-9580 protocol model, FX-1 pass 1 (protocol agent). See protocol.md for the prose and diagrams.
record: "rfc-9580"
reviewed_by: ""
extracted: "2026-10-13"
source:
  file: ".cache/rfc-9580.txt"
  sha256: "36540e57b63d24c0b17be0748b704bdeed3d643ce99a4fb1abb6469c1eb1ff18"
  lines: "9138"
  bcp14_keywords: "365"
applicability: >-
  PARTIAL. RFC 9580 is a data format, not a wire protocol. It defines no transport, no
  session, no request or response, no acknowledgement and no error signalling between
  parties: every OpenPGP object (message, signature, certificate, revocation) is a
  self-contained packet sequence that one role produces and another consumes later, by any
  channel, store-and-forward. What the source does define, and what this model holds, is
  (1) the producing role's obligations when it builds each object (encrypt, sign, generate a
  key, certify, revoke), modelled as flows whose arrows mean "this object reaches that role
  by some means the source does not specify"; (2) the consuming role's processing of each
  object (decrypt, verify, import), with the source's failure handling; and (3) the local
  algorithms that both sides need: packet-stream parsing, message-grammar parsing with
  unwrapping, session-key recovery, v1 and v2 SEIPD decryption, signature hash computation
  and verification, certificate (key validity) evaluation, algorithm preference
  negotiation, cleartext-signature processing, ASCII Armor decoding and secret-key
  unlocking. Key discovery, key distribution, keyserver protocols, trust (web of trust)
  computation and user interaction are outside the source and listed under not_defined.
  Anything not literally in the source is marked inferred.
conventions:
  quoting: >-
    Each item under a key ending in quotes is one contiguous span of .cache/rfc-9580.txt
    (which has no page furniture) with every run of whitespace collapsed to one space and a
    hyphen that ends a source line joined to the next word without a space. Non-adjacent
    text is never joined and nothing is elided. Every quote was checked mechanically against
    the source.
  basis: >-
    stated means literally in the source at the locator given. inferred means the reading an
    implementer has to adopt to make the stated text executable (ordering of steps that the
    source scatters across sections, the role that performs an act the source states in the
    passive, a check the source implies but does not sequence).
  on_error_basis: >-
    stated, inferred or unspecified. unspecified means the source names the step or implies
    a failure and says nothing about what follows. Because there is no wire protocol, no
    error is ever signalled back to the producing role; every on_error is local to the role
    that detects it.
  constrained_by: >-
    rfc-9580#R-NNNN ids from distilled/requirements.yaml (421 entries). Entries of verb none
    (binding lowercase text) are cited where the step states them.
  kind: >-
    Flows: construction means one role builds and (usually) signs an object; transfer means
    the object moves from one role to another by a channel the source does not define;
    consumption means the receiving role processes the object; out-of-band means the source
    describes the exchange but places its mechanism outside the document; local-use means a
    role's own sequence with no counterpart. A flow is usually a mix; kind names its main
    character. Algorithm step kinds: parse, check (can fail), compute (derives a value),
    select (chooses among candidates), update (changes state), control (loop, branch or
    exit), emit (outputs a result or warning).
  status: >-
    Algorithms: normative-procedure means the source states the procedure itself (signature
    hashing, v2 SEIPD key derivation and chunking, the MDC, dash-escaping, S2K); composite
    means the source states the individual rules and this model orders them into one
    procedure (signature verification, key validity, message parsing), so the order is
    inferred while each rule is stated. Flows: deprecated means the source keeps the
    mechanism for reading only and forbids generating it.
  message_names: >-
    Every name in a step's message, message_alternatives or subpackets, and in an
    algorithm step's messages, is listed in messages_used and resolved in message_notes.
    Packet names are the source's (Table 3 and the section titles of section 5) with the
    packet version appended where the version changes the format ("Public Key Encrypted
    Session Key Packet v6"); Signature packets also carry the Signature Type ID ("Signature
    Packet v6 (type 0x18)"), because the type changes what is hashed and what the signature
    means. Packet sequences use the section 10 names ("OpenPGP Version 6 Certificate",
    "Encrypted Message", "Detached Signature"); subpackets use the Table 5 names. messages.yaml
    was written in parallel with this file (pass 1); the mapping of each name to its
    messages.yaml entry is to be reconciled in the cross-check pass.
framing:
  - id: "data-format-not-protocol"
    text: >-
      The document specifies packet formats for encryption, signing and key management; it
      provides formats for encoding and transferring objects, not a protocol for exchanging
      them, and puts key storage and management out of scope.
    locator: "§1, §2"
    basis: "stated"
    quotes:
      - |-
        This document provides information on the message-exchange packet formats used by OpenPGP to provide encryption, decryption, signing, and key management functions.
      - |-
        It provides formats for encoding and transferring encrypted and/or signed messages. In addition, OpenPGP provides functionality for encoding and transferring keys and certificates, though key storage and management are beyond the scope of this document.
  - id: "store-and-forward"
    text: >-
      The session key travels with the message it protects; nothing is negotiated in
      advance between sender and recipient. Whatever the sender knows about the recipient
      comes from the recipient's certificate (preferences, features, key flags).
    locator: "§2.1, §5.2.3.14, §5.2.3.15, §5.2.3.32"
    basis: "stated"
    quotes:
      - |-
        Since it is used only once, the session key is bound to the message and transmitted with it.
      - |-
        The Features subpacket denotes which advanced OpenPGP features a user's implementation supports.
  - id: "receiver-has-final-authority"
    text: >-
      Validity decisions belong to the receiver of a signature; the signature types are
      deliberately vague, and the document defines no trust model that would make them
      precise.
    locator: "§5.2.1"
    basis: "stated"
    quotes:
      - |-
        Please note that the vagueness of these meanings is not a flaw but rather a feature of the system. Because OpenPGP places final authority for validity upon the receiver of a signature, it may be that one signer's casual act might be more rigorous than some other authority's positive act.
  - id: "three-grammars"
    text: >-
      Every object a flow moves is one of three packet sequences, each with its own grammar:
      Transferable Public (and Secret) Keys, OpenPGP Messages, and Detached Signatures. The
      Cleartext Signature Framework and ASCII Armor are text encodings around them.
    locator: "§10, §6, §7"
    basis: "stated"
    quotes:
      - |-
        OpenPGP packets are assembled into sequences in order to create messages and to transfer keys. Not all possible packet sequences are meaningful and correct.
      - |-
        Each sequence has an explicit grammar of what packet types (Table 3) can appear in what place.
  - id: "forward-compatibility-over-abort"
    text: >-
      The consumer's error model favours continuing: an unknown or malformed signature is
      ignored, not fatal; an unknown non-critical packet is skipped; only critical packets
      out of grammar, failed integrity checks and malformed lengths end processing.
    locator: "§4.3, §5.2.5"
    basis: "stated"
    quotes:
      - |-
        This requirement is necessary for forward compatibility. Producing an output that indicates that no successful signatures were found is preferable to aborting processing entirely.
roles:
  - name: "sender"
    kind: "party"
    also_called:
      - "sending OpenPGP implementation"
      - "sending implementation"
      - "encrypting implementation"
      - "message generator"
    description: >-
      Creates an OpenPGP Message for one or more recipients: generates the session key,
      encrypts it to each recipient (and/or under passphrases), optionally signs and
      compresses, and encrypts the payload. Chooses formats and algorithms from what the
      recipients' certificates advertise.
    locators:
      - "§2.1"
      - "§5.2.3.7"
      - "§12.2"
      - "§13.7"
    quotes:
      - |-
        The sending OpenPGP implementation generates a random session key for this message.
      - |-
        An encrypting implementation that does not implement the "Features" (30) subpacket SHOULD select the type of encrypted data format based on the versions of the recipient keys or external inference (see Section 13.7 for more details).
      - |-
        If one of the recipients does not support v2 SEIPD packets, then the message generator MAY use a v1 SEIPD packet instead.
    basis: "stated"
  - name: "recipient"
    kind: "party"
    also_called:
      - "receiving OpenPGP implementation"
      - "receiving implementation"
      - "receiver"
      - "decrypting implementation"
    description: >-
      Holds a private key (or a passphrase) that can recover the session key of a message;
      decrypts, checks integrity, unwraps and, if the message is signed, hands the signatures
      to the verifier role (usually the same implementation).
    locators:
      - "§2.1"
      - "§5.1"
      - "§5.1.8"
    quotes:
      - |-
        The recipient of the message finds a session key that is encrypted to their public key, decrypts the session key, and then uses the session key to decrypt the message.
      - |-
        The receiving OpenPGP implementation decrypts the session key using the recipient's private key.
    basis: "stated"
  - name: "signer"
    kind: "party"
    also_called:
      - "issuer (of a signature)"
      - "sending implementation"
    description: >-
      Holds a signing-capable private key and makes a Signature packet over a document, a
      key, a User ID binding or another signature. The signature version follows the key
      version.
    locators:
      - "§2.2"
      - "§5.2"
      - "§10.3.2.2"
      - "§12.3.2"
    quotes:
      - |-
        The sending implementation generates a signature from the hash digest using the sender's private key.
      - |-
        Typically, the signer chooses which hash algorithm to use, rather than the verifier, because a signer rarely knows who is going to be verifying the signature.
    basis: "stated"
  - name: "verifier"
    kind: "party"
    also_called:
      - "receiving implementation"
      - "verifying implementation"
      - "verifying application"
      - "evaluator"
      - "receiver of a signature"
    description: >-
      Checks a signature against the issuer's public key and decides validity. Has final
      authority over what a signature means. The same role evaluates certificates (self
      signatures, bindings, revocations) and third-party certifications; how much it trusts
      a certifier is its own business.
    locators:
      - "§2.2"
      - "§5.2.1"
      - "§5.2.3.7"
      - "§6.2.2.3"
      - "§13"
    quotes:
      - |-
        The receiving implementation generates a new hash digest for the received message and verifies it using the message's signature. If the verification is successful, the message is accepted as authentic.
      - |-
        If a subpacket is encountered that is marked critical but is unknown to the evaluating implementation, the evaluator SHOULD consider the signature to be in error.
      - |-
        Verifiers should be aware that even if the signer used a strong hash, an attacker could have modified the signature to use a weak one.
    basis: "stated"
  - name: "keyholder"
    kind: "party"
    also_called:
      - "key owner"
      - "owner of this public key"
      - "certificate owner"
      - "user"
    description: >-
      Owns an OpenPGP Key: generates it, makes its self-signatures (Direct Key, User ID
      certification, Subkey Binding), states its preferences, features and expiration, and
      revokes it. The source's own word is keyholder; "certificate" means Transferable
      Public Key.
    locators:
      - "§5.2.3.10"
      - "§5.2.3.14"
      - "§5.12"
      - "§10.1.5"
      - "§13.9"
    quotes:
      - |-
        A self-signature is a binding signature made by the key to which the signature refers.
      - |-
        Each of the following User ID packets provides the identity of the owner of this public key.
      - |-
        A keyholder, Alice, may wish to designate a third party to be able to revoke her own key.
    basis: "stated"
  - name: "certifier"
    kind: "party"
    also_called:
      - "issuer of this certification"
      - "non-self certifier"
      - "other key owner"
    description: >-
      A key other than the certified key that signs a binding between that key and a User ID
      or User Attribute (Type IDs 0x10 to 0x13), or makes a Direct Key statement about it
      (0x1F). With a Trust Signature subpacket it also makes the certified key an introducer.
    locators:
      - "§5.2.1.4"
      - "§5.2.1.10"
      - "§5.12"
      - "§10.1.5"
    quotes:
      - |-
        The issuer of this certification does not make any particular assertion as to how well the certifier has checked that the owner of the key is in fact the person described by the User ID.
      - |-
        It is also appropriate for statements that non-self certifiers want to make about the key itself rather than the binding between a key and a name.
      - |-
        In effect, the signer is testifying to the belief that this public key belongs to the user identified by this User ID.
    basis: "stated"
  - name: "trusted-introducer"
    kind: "party"
    also_called:
      - "valid trusted introducer"
      - "meta introducer"
    description: >-
      A key that a Trust Signature (level 1 or more) asserts may be relied on to certify
      other keys; at level 2 it may in turn make level 1 Trust Signatures. Its scope can be
      limited by a Regular Expression subpacket. The role is a status a key acquires in a
      verifier's evaluation, not a separate implementation.
    locators:
      - "§5.2.3.21"
      - "§5.2.3.22"
    quotes:
      - |-
        Level 1 means that the signed key is asserted to be a valid trusted introducer, with the 2nd octet of the body specifying the degree of trust.
      - |-
        Level 2 means that the signed key is asserted to be trusted to issue level 1 Trust Signatures; that is, the signed key is a "meta introducer".
    basis: "stated"
  - name: "designated-revoker"
    kind: "party"
    also_called:
      - "Revocation Key (deprecated)"
      - "a key that is authorized to issue revocations"
    description: >-
      A third-party key that a Revocation Key subpacket on the keyholder's Direct Key
      self-signature authorizes to issue Revocation Signatures for the keyholder's key.
      Deprecated: generating the subpacket is forbidden; some implementations still
      interpret it.
    locators:
      - "§5.2.3.23"
      - "§5.2.1.11"
      - "§5.2.1.12"
      - "§10.1.5"
    quotes:
      - |-
        This packet was intended to authorize the specified key to issue Revocation Signatures for this key.
      - |-
        i.e., when the signature is being sent to the designated revoker or when it is accompanied by a Revocation Signature from that revoker.
    basis: "stated"
    status: "deprecated"
  - name: "preferred-revoker"
    kind: "party"
    also_called:
      - "third party (escrow holder)"
    description: >-
      Holds in escrow a Revocation Signature the keyholder made in advance and publishes it
      when appropriate; it never signs anything itself and needs no OpenPGP key. The
      replacement for the designated revoker.
    locators:
      - "§13.9"
    quotes:
      - |-
        The preferred way for Alice to do this is to produce a specific Revocation Signature (Signature Type ID 0x20, 0x28, or 0x30) and distribute it securely to a preferred revoker who can hold it in escrow.
    basis: "stated"
  - name: "key-server"
    kind: "mentioned"
    also_called:
      - "key server"
      - "administrator of the key server"
    description: >-
      Stores and distributes certificates. Named only through the subpackets that address
      it (Key Server Preferences, Preferred Key Server) and the export rule that it trims
      local certifications; no key server protocol is defined.
    locators:
      - "§5.2.3.19"
      - "§5.2.3.25"
      - "§5.2.3.26"
    quotes:
      - |-
        Some implementations do not represent the interest of a single user (for example, a key server). Such implementations always trim local certifications from any key they handle.
      - |-
        This is a URI of a key server that the keyholder prefers be used for updates.
    basis: "stated"
  - name: "keyring"
    kind: "store"
    also_called:
      - "keyring"
      - "local keyring files"
      - "keystore"
    description: >-
      A role's local collection of keys, with implementation-defined Trust packets. Its
      format and management are out of scope; it appears here as the place an import
      lands and an export comes from.
    locators:
      - "§3.6"
      - "§5.10"
      - "§13.6"
    quotes:
      - |-
        A keyring is a collection of one or more keys in a file or database. Typically, a keyring is simply a sequential list of keys, but it may be any suitable database. It is beyond the scope of this specification to discuss the details of keyrings or other databases.
      - |-
        Trust packets SHOULD NOT be emitted to output streams that are transferred to other users, and they SHOULD be ignored on any input other than local keyring files.
    basis: "stated"
  - name: "attacker"
    kind: "mentioned"
    also_called:
      - "attacker"
      - "adversary"
      - "Mallet"
      - "Frank (forger)"
    description: >-
      Not a protocol party. Included because several flows exist only as defences against
      it: tampering with ciphertext (malleability), stripping self-signatures, forwarding a
      signature to someone else, and silently dropping itself from a recipient list before a
      session-key-reuse reply.
    locators:
      - "§5.2.3.10"
      - "§13.7"
      - "§13.8"
      - "§13.12"
    quotes:
      - |-
        This prevents certain attacks where an adversary strips a self-signature specifying a Key Expiration Time or certain preferences.
      - |-
        When an attacker obtains a signature for some text, e.g., by receiving a signed message, they may be able to use that signature maliciously by sending a message purporting to come from the original sender, with the same body and signature, to a different recipient.
    basis: "stated"
