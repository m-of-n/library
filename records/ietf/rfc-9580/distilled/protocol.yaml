  - id: "length-overrun"
    trigger: "A subfield length points outside the packet, or a packet length crosses the end of an unwrapped stream."
    detected_by: "recipient"
    in:
      - "packet-stream-parsing 5"
      - "message-grammar-parsing 5"
    outcome: "Abort without writing outside the range; the packet is malformed and unusable."
