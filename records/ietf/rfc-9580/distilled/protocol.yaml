source_defects_and_ambiguities:
  - id: "padding-vs-grammar"
    kind: "contradiction"
    locator: "§5.14, §10, §10.3, §10.4, §5.10"
    text: >-
      The Padding packet (Type ID 21) is critical. The message grammar admits it only as
      the last packet of an Optionally Padded Message, which is used only inside v2 SEIPD;
      §10 says a known but unexpected packet invalidates the entire sequence, while §5.14
      says an implementation must be able to process Padding packets anywhere else. A
      consumer cannot obey both for a Padding packet at the top level of a Signed Message.
      This model follows §5.14 (ignore). The Trust packet (Type ID 12, also critical) is in
      the same position: no message grammar admits it, while §5.10 says to ignore it on any
      input other than a local keyring file; this model ignores it too.
    quotes:
      - |-
        An implementation MUST be able to process Padding packets anywhere else in an OpenPGP stream so that future revisions of this document may specify further locations for padding.
      - |-
        The presence of an unknown critical packet, or a known but unexpected packet, is a critical error, invalidating the entire sequence (see Section 4.3).
      - |-
        Trust packets SHOULD NOT be emitted to output streams that are transferred to other users, and they SHOULD be ignored on any input other than local keyring files.
  - id: "subkey-followed-by-one-signature"
    kind: "contradiction"
    locator: "§10.1.5, §10.1.1, §10.1.3"
    text: >-
      §10.1.5 says each Subkey packet must be followed by one Signature packet, while the v6
      and v4 grammars allow several Subkey Revocation signatures and several Subkey Binding
      signatures, with revocations first.
    quotes:
      - |-
        Each Subkey packet MUST be followed by one Signature packet, which should be a Subkey Binding signature issued by the top-level key.
  - id: "revocation-issuer-for-subkeys"
    kind: "contradiction"
    locator: "§10.1.5, §5.2.1.12"
    text: >-
      §10.1.5 accepts revocations "issued by the key itself", which for a subkey would be
      the subkey; §5.2.1.12 accepts subkey revocations only from the top-level key. This
      model follows §5.2.1.12.
    quotes:
      - |-
        Revocation Signatures are only accepted if they are issued by the key itself or by a key that is authorized to issue revocations via a Revocation Key subpacket in a self-signature by the top-level key.
      - |-
        Only Revocation Signatures by the top-level signature key that is bound to this subkey, or by a (deprecated) Revocation Key, should be considered valid Revocation Signatures.
  - id: "reason-for-revocation-subkey"
    kind: "ambiguity"
    locator: "§5.2.3.31"
    text: >-
      Reason for Revocation is "used only in Key Revocation and Certification Revocation
      signatures", yet the same paragraph asks for it in all Revocation Signatures, which
      include Subkey Revocation (0x28). Codes 1 to 3 are labelled for Key Revocation
      signatures; whether they apply to 0x28 is not stated. Code 0 and an absent
      subpacket have no stated consequence for earlier signatures.
    quotes:
      - |-
        This subpacket is used only in Key Revocation and Certification Revocation signatures.
  - id: "embedded-signature-in-hash-claim"
    kind: "defect"
    locator: "§6.2.2.3"
    text: >-
      A verifier of a cleartext message is told to defer "to the hash algorithm indicated in
      the Embedded Signature". A cleartext signature is an armored Signature packet, not an
      Embedded Signature subpacket; the intended reading is the Signature packet's own hash
      algorithm field.
    quotes:
      - |-
        When a conformant Hash header is present, a verifying application MUST ignore its contents, deferring to the hash algorithm indicated in the Embedded Signature.
  - id: "sha1-exception-wording"
    kind: "defect"
    locator: "§9.5"
    text: >-
      The SHA-1 exception mentions "computing version 4 key fingerprints for purposes of the
      MDC". The MDC (§5.13.1) is a SHA-1 hash of the plaintext and involves no fingerprint;
      the sentence apparently conflates two separate SHA-1 uses (v4 fingerprints and the
      MDC).
    quotes:
      - |-
        Implementations SHOULD NOT create messages that require the use of SHA-1, with the exception of computing version 4 key fingerprints for purposes of the MDC in version 1 Symmetrically Encrypted and Integrity Protected Data packets.
  - id: "final-tag-nonce-index"
    kind: "gap"
    locator: "§5.13.2, Appendix A.8.4"
    text: >-
      The text gives the nonce for each chunk (IV plus chunk index) but not the index used
      for the final authentication tag. The test vectors use the number of chunks (one
      past the last index).
    quotes:
      - |-
        The rightmost 64 bits are the chunk index as a big-endian value. The index of the first chunk is zero.
  - id: "esk-less-seipd"
    kind: "gap"
    locator: "§10.3, §5.7"
    text: >-
      The grammar allows Encrypted Data with no ESK Sequence. For SED the source gives the
      historic rule (IDEA with an MD5 of the passphrase); for SEIPD it gives no source for
      the session key or the cipher, so such a message cannot be decrypted by the document
      alone.
    quotes:
      - |-
        If no packets of these types precede the encrypted data, the IDEA algorithm is used with the session key calculated as the MD5 hash of the passphrase, though this use is deprecated.
  - id: "no-aligned-esk-outcome"
    kind: "gap"
    locator: "§10.3.2.1"
    text: >-
      Misaligned ESKs must be discarded, but nothing says what follows when none remain, or
      whether the message is then in error.
    quotes:
      - |-
        An implementation processing an Encrypted Message MUST discard any preceding ESK packet with a version that does not align with the version of the payload.
  - id: "corresponding-signature-undefined"
    kind: "gap"
    locator: "§10.3, §5.4"
    text: >-
      The grammar's "Corresponding Signature Packet" is defined only by the bracketing
      rule; the source does not say which fields (type, algorithms, key, salt) must agree
      between an OPS and its Signature, beyond the version and the v6 salt, nor what to do
      when a corresponding Signature is missing.
    quotes:
      - |-
        The value MUST match the salt field of the corresponding Signature packet.
  - id: "critical-subpacket-should-vs-must"
    kind: "ambiguity"
    locator: "§5.2.3.7, §5.2.5"
    text: >-
      §5.2.3.7 says an evaluator SHOULD consider a signature with an unknown critical
      subpacket in error; §5.2.5 lists an unknown critical subpacket in the hashed area as
      a malformed signature that MUST be ignored. A critical unknown subpacket in the
      unhashed area is covered only by the first.
    quotes:
      - |-
        If a subpacket is encountered that is marked critical but is unknown to the evaluating implementation, the evaluator SHOULD consider the signature to be in error.
  - id: "recent-and-old-undefined"
    kind: "ambiguity"
    locator: "§9.5"
    text: >-
      Weak-hash signatures must not be validated if "recent" and may be if "old" and
      predating the known weakness; neither term is given a date or a test.
    quotes:
      - |-
        Implementations MUST NOT validate any recent signature that depends on MD5, SHA-1, or RIPEMD-160.
  - id: "most-recent-self-signature-scope"
    kind: "ambiguity"
    locator: "§5.2.3.10, §5.2.3.13"
    text: >-
      "The most recent valid self-signature" is chosen per "object"; the source does not
      say whether a v6 key's expiry and flags come from the Direct Key signature alone or
      may be overridden by a newer User ID self-signature, nor what happens when the
      newest self-signature omits a subpacket an older one had (for example Key
      Expiration Time).
    quotes:
      - |-
        An implementation that encounters multiple self-signatures on the same object MUST select the most recent valid self-signature and ignore all other self-signatures.
  - id: "preference-narrowness-vs-v6"
    kind: "ambiguity"
    locator: "§5.2.3.10, §5.2.3.15"
    text: >-
      Preferences are to be read "as narrowly as possible", via the User ID the key was
      located by, while v6 keys are told to put preferences in the Direct Key signature.
      Precedence between Direct Key and User ID preferences for a v6 key is not stated.
    quotes:
      - |-
        An implementation should interpret a self-signature's preference subpackets as narrowly as possible.
  - id: "key-flags-enforcement"
    kind: "gap"
    locator: "§5.2.3.29, §5.2.3.10"
    text: >-
      Key Flags state what a key "may be used" for, and self-signatures are valid regardless
      of the primary key's flags. Whether a verifier must reject a data signature, or a
      sender must refuse to encrypt, when the flags do not allow it is not stated
      normatively; this model infers it.
    quotes:
      - |-
        In particular, a primary key does not need to have 0x01 set in the first octet of the Key Flags order to make a valid self-signature.
  - id: "revocable-vs-key-revocation"
    kind: "ambiguity"
    locator: "§5.2.3.20, §5.2.1.11"
    text: >-
      A non-revocable signature ignores "any later Revocation Signatures"; the interplay
      with revocation of the issuing key (which removes the issuer's authority) and the
      meaning of "later" (creation time or arrival) are not stated.
    quotes:
      - |-
        They represent the signer's commitment that its signature cannot be revoked for the life of its key.
  - id: "certification-revocation-earlier-date"
    kind: "gap"
    locator: "§5.2.1.13"
    text: >-
      A certification revocation "should have a later creation date" than the revoked
      certification; the effect of an earlier one is unspecified.
    quotes:
      - |-
        The signature is computed over the same data as the certification that it revokes, and it should have a later creation date than that certification.
  - id: "revocation-key-v4-only"
    kind: "gap"
    locator: "§5.2.3.23, §10.1.5"
    text: >-
      The deprecated Revocation Key subpacket carries a 20-octet v4 fingerprint and cannot
      designate a v6 key, yet §10.1.5 still names it as a basis for accepting revocations
      with no version restriction; its use outside Direct Key self-signatures is
      unspecified.
    quotes:
      - |-
        This is only found on a Direct Key self-signature (Type ID 0x1F). The use on other types of self-signatures is unspecified.
  - id: "trust-combination-undefined"
    kind: "gap"
    locator: "§5.2.3.21, §5.2.3.22"
    text: >-
      The meaning of one Trust Signature is given; how depths decrease along a chain, how
      partial amounts add up, and how several Regular Expressions combine (any or all) are
      not. Whether the regular expression must match the whole User ID or any substring
      follows only from the Henry Spencer semantics (unanchored unless ^ and $ are used).
    quotes:
      - |-
        Only signatures by the target key on User IDs that match the Regular Expression in the body of this packet have trust extended by the Trust Signature subpacket.
  - id: "embedded-signature-area"
    kind: "gap"
    locator: "§5.2.1.8, §5.2.3.34, §10.1.5"
    text: >-
      The Primary Key Binding back-signature must be in an Embedded Signature subpacket of
      the Subkey Binding signature; the source does not say whether in the hashed or the
      unhashed area, although §13.13 lets an implementation ignore unhashed subpackets of
      unknown provenance.
    quotes:
      - |-
        For subkeys that can issue signatures, the Subkey Binding signature MUST contain an Embedded Signature subpacket with a Primary Key Binding signature (Type ID 0x19) issued by the subkey on the top-level key.
  - id: "quick-check-not-normative"
    kind: "ambiguity"
    locator: "§13.4, §5.13.1"
    text: >-
      The quick check is described as an oracle and disabling it as the fix, but no BCP 14
      statement forbids or limits it; "with care" is the only guidance.
    quotes:
      - |-
        But the implementation should use the quick check with care.
  - id: "single-error-code-lowercase"
    kind: "ambiguity"
    locator: "§13.5, §12.1.2"
    text: >-
      The uniform error code for PKESK and SEIPD failures is lowercase advice ("the
      simplest solution"), while §12.1.2 points to §13.5 "regarding differences in reporting
      between a decryption error and a padding error".
    quotes:
      - |-
        See also Section 13.5 regarding differences in reporting between a decryption error and a padding error.
  - id: "features-absent-v4"
    kind: "gap"
    locator: "§13.7, §5.2.3.7"
    text: >-
      A v6 key without Features implies v2 SEIPD support; for a v4 key without Features the
      source offers only "external inference", and the v1 SEIPD flag's meaning for such a
      key is not stated.
    quotes:
      - |-
        An encrypting implementation that does not implement the "Features" (30) subpacket SHOULD select the type of encrypted data format based on the versions of the recipient keys or external inference (see Section 13.7 for more details).
  - id: "consumer-partial-length-checks"
    kind: "gap"
    locator: "§4.2.1.4"
    text: >-
      The partial-length rules (first part at least 512 octets, only on data packets, last
      header not partial) bind generators; whether a consumer must reject violations is not
      stated.
    quotes:
      - |-
        The first partial length MUST be at least 512 octets long.
  - id: "chunk-size-above-16"
    kind: "gap"
    locator: "§5.13.2"
    text: >-
      Consumers must accept chunk size octets 0 to 16; behaviour for larger values (which no
      conforming producer emits) is not stated.
    quotes:
      - |-
        An implementation MUST accept chunk size octets with values from 0 to 16.
  - id: "intended-recipient-anonymous"
    kind: "ambiguity"
    locator: "§5.2.3.36, §5.1.8"
    text: >-
      Intended Recipient Fingerprint validity depends on "the key it was encrypted to";
      with anonymous PKESKs or a SKESK-only message, the verifier knows only which key it
      used itself, and the rule's application in those cases is not stated.
    quotes:
      - |-
        If one or more subpackets of this type are included in a signature, it SHOULD be considered valid only in an encrypted context, where the key it was encrypted to is one of the indicated primary keys or one of their subkeys.
  - id: "expired-key-consequence"
    kind: "gap"
    locator: "§5.2.3.13, §5.2.3.18"
    text: >-
      Key and signature expiration times are defined, but the source never states the
      consequence of expiry (no signing, no encryption, signatures made before expiry still
      valid) except an example in §13.8 of an expired recipient key.
    quotes:
      - |-
        The validity period of the key. This is the number of seconds after the key creation time that the key expires.
  - id: "unknown-packet-versions"
    kind: "gap"
    locator: "§5.1, §5.3, §5.5.2, §5.13, §5.2.5"
    text: >-
      Only a Signature packet of unknown version has a stated consumer rule (ignore it and
      continue, §5.2.5). For a PKESK, SKESK, Key or SEIPD packet whose version is not one
      the source defines, nothing says whether the packet is skipped, the key or message
      is unusable, or the sequence is rejected. An unknown-version ESK cannot align with
      the payload and so is discarded by the §10.3.2.1 rule (inferred).
    quotes:
      - |-
        The currently defined versions are 3 and 6.
      - |-
        An unknown signature version
not_defined:
  - item: >-
      Any wire protocol, transport, session or error signalling. Objects are produced and
      consumed; how they travel is not specified.
    locator: "§1, §2"
    quotes:
      - |-
        It provides formats for encoding and transferring encrypted and/or signed messages.
  - item: "Key storage and management, keyring formats and the merging of certificate copies."
    locator: "§2, §3.6"
    quotes:
      - |-
        though key storage and management are beyond the scope of this document.
  - item: >-
      Key discovery and authentication of a correspondent's certificate: how a sender
      finds and decides to trust a recipient's key. The ECDH synopsis assumes an
      "authenticated recipient public key".
    locator: "§11.5"
    quotes:
      - |-
        Obtain the authenticated recipient public key R
  - item: >-
      Key server protocols. Key servers appear only through Key Server Preferences,
      Preferred Key Server (a URI) and the trimming of local certifications.
    locator: "§5.2.3.19, §5.2.3.25, §5.2.3.26"
  - item: >-
      The web of trust: how validity is computed from certifications, trust signature
      depths and amounts, and regular expressions. Trust packets that record the user's
      decisions have an implementation-defined format.
    locator: "§5.2.1, §5.2.3.21, §5.10"
    quotes:
      - |-
        The format of Trust packets is defined by a given implementation.
  - item: >-
      Identity verification by certifiers, and human fingerprint comparison: the source
      discourages manual comparison and defers interoperable human verification to another
      document.
    locator: "§5.2.1.4 to §5.2.1.7, §13.6"
    quotes:
      - |-
        NOTE: the topic of interoperable human-in-the-loop key verification needs more work, which will be done in a separate document.
  - item: "How passphrases are agreed or entered; secure hand-over of escrowed revocations; secret sharing of a revocation signature."
    locator: "§2.1, §13.9"
  - item: >-
      Guidance for deploying session-key reuse in any application; the source states none
      exists.
    locator: "§13.8"
    quotes:
      - |-
        At the time of this writing, there is no known documentation about safe reuse of OpenPGP session keys for any specific context.
  - item: "Padding size policy against traffic analysis."
    locator: "§5.14"
    quotes:
      - |-
        Policy about how large to make such a packet to defend against traffic analysis is beyond the scope of this document.
  - item: >-
      MIME integration (OpenPGP/MIME is RFC 3156) and any email binding, including how
      the From: header check of §5.2.3.10 is done.
    locator: "§7, §5.2.3.10"
    quotes:
      - |-
        [RFC3156] defines another way to sign cleartext messages for environments that support MIME.
  - item: "Policies for what counts as communications versus storage encryption."
    locator: "§5.2.3.29"
    quotes:
      - |-
        This decision is left wholly up to the implementation;
  - item: >-
      Conflict resolution among duplicated or conflicting subpackets beyond "the last one in
      the hashed section".
    locator: "§5.2.3.9"
    quotes:
      - |-
        Please note that conflict resolution is intentionally left to the implementer;
  - item: "The decision rules for when keys or signatures count as too weak beyond the stated size and hash limits."
    locator: "§13"
  - item: "Key rotation, renewal and recovery procedures (beyond rewriting self-signatures and revoking)."
    locator: "§5.2.3.10"
  - item: "Side-channel countermeasures at the protocol level (limiting failures, time blinding) are suggested, not specified."
    locator: "§13.3"
    quotes:
      - |-
        Countermeasures can often be taken at the higher protocol level, such as limiting the number of allowed failures or time-blinding the operations associated with each network interface.
  - item: "How a detached signature is paired with its data, and where Timestamp, Standalone and Third-Party Confirmation signatures are carried."
    locator: "§10.4, §5.2.1.3, §5.2.1.14, §5.2.1.15"
outside_source_notes:
  - >-
    Not part of the extracted text. RFC 9580 obsoletes RFC 4880, RFC 5581 and RFC 6637
    (§1). Key server protocols, OpenPGP/MIME (RFC 3156) and any later extensions of
    OpenPGP are specified elsewhere; none of that is applied here.
