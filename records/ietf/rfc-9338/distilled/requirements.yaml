  - id: 'rfc-9338#R-0100'
    object: 'Countersign_structure'
    field: 'CDDL rule as printed, with erratum 7338 intact'
    verb: 'none'
    actor: 'an implementation'
    locator: '§3.3'
    text: 'Countersign_structure = [ context : "CounterSignature" / "CounterSignature0" / "CounterSignatureV2" / "CounterSignature0V2" /, body_protected : empty_or_serialized_map, ? sign_protected : empty_or_serialized_map, external_aad : bstr, payload : bstr, ? other_fields : [+ bstr ] ]'
    kind: stated
    testable: 'yes'
    status: active
    source_lines: '407-415'
    note: >-
        ERRATUM 7338 (Reported, Technical, section 3.3, Carsten Bormann,
        2023-02-06; errata searched 2026-10-20 and this is the ONLY erratum on RFC
        9338). The trailing "/" after "CounterSignature0V2" is a choice operator
        with no right operand. RFC 8610 Appendix B: `type = type1 *(S "/" S
        type1)`, so the fragment does not parse. NOT REPAIRED HERE; the repaired
        rule is schema/countersign-structure.derived.cddl. Note also `payload :
        bstr` is MANDATORY in the CDDL, which the prose does not reconcile with
        the four targets that have no payload.
