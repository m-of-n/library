reconciliation: >-
  THE COUNTS AGREE AT 2. bin/bcp14-count .cache/rfc-9338.txt --by-keyword
  reports 2 all-capitals BCP 14 keyword occurrences in the 921-line source,
  both MUST, and the entries below carry exactly those 2, each once. A
  reconciliation is written anyway, because TWO KEYWORDS IN A
  STANDARDS-TRACK REPAIR DOCUMENT THAT RETIRES AN EXISTING MECHANISM IS
  ITSELF THE FINDING.

  WHERE THE TWO ARE. Section 4, source lines 457-459: "The narrowed
  deterministic encoding rules MUST be used to ensure that all
  implementations generate the same byte string for the" and then the
  source's own nested quotation, "to be signed", and "value." - BROKEN AT
  THE NESTED QUOTATION MARKS, not re-punctuated, because the source writes
  them and healing them into single quotes would be an alteration. Section
  6, source line 523: "To provide 128-bit security against collision
  attacks, the tag length MUST be at least 256 bits." That is the whole
  normative surface. Neither is about countersignatures: the first is an
  inherited encoding rule from RFC 8949 section 4.2 as narrowed by RFC 9052
  section 9, and the second constrains the TARGET's authentication tag,
  chosen by whoever built the COSE_Mac or COSE_Encrypt, not by the
  countersigner. Sections 1, 1.2, 1.3, 2, 3, 3.1, 3.2, 3.3, 5, 5.1 and 5.2
  contain no BCP 14 keyword at all.

  EVERY MIGRATION OBLIGATION IS LOWERCASE, in a document whose section 1.1
  recites BCP 14 in the standard form. Measured whole-word and
  case-insensitively over all 921 lines, the four statements that carry the
  backward-compatibility contract are, each quoted with the source's own
  nested quotation marks intact and never re-punctuated: "implementers are
  encouraged to migrate" (line 129), "uses of "CounterSignature" will
  migrate to "CounterSignatureV2"" (line 132), "verification of
  "CounterSignature" must be supported by new implementations" (line 134)
  and "verification of "CounterSignature0" may be supported" (line 138).
  None is in all capitals, so none is a BCP 14 keyword of this document, and
  the contract that keeps a version-2 verifier interoperable with an RFC
  8152 sender carries no normative force. The deprecation of labels 7 and 9
  is likewise a registry Description-field edit (section 5.2) and not a
  statement in this document: there is no MUST NOT and no SHOULD NOT against
  either label anywhere.

  THE OTHER LOWERCASE FORCE-BEARING WORDS, all recorded as inferred with the
  carrying phrase named in `field`: "should be consulted" (section 2, Table
  1), "should generally be included" (section 1.3, context), "needs to be
  treated as a separate operation" (section 3), "needs to be clear about the
  security properties" (section 3), "needs to have all of its cryptographic
  functions finalized" (section 3.3 - the document's only ordering
  constraint), "only a signature algorithm with appendix ... can be used"
  (section 3.1), "should be able to be processed" (section 3.1), "cannot be
  converted between each other" (section 3), "performs the appropriate
  checks" (section 3.3) and "Please review the Security Considerations
  section in [RFC9052]" (section 6). Whole-word counts over the source:
  lowercase-or-capital `must` 5 lines (48 boilerplate, 134 migration, 143
  recital, 457 and 523 the two keywords), `should` 6 lines (144 recital plus
  the five above), `may` 6 lines (35, 138, 144, 156, 540, 615 - only 138
  carries force), `required` 4 lines (143 recital, 232, 308, 338 - none
  normative), `optional` 2 lines (145 recital, 231).

  WHAT WAS NOT COUNTED. The section 1.1 BCP 14 recital (source lines
  143-147) is deliberately NOT an entry. It recites eleven keywords and
  constrains nothing; bin/validate counts the entry texts with
  boilerplate=False, so an entry for it would add eleven phantom keywords
  and break this reconciliation. It is quoted in normative.md instead. Also
  not entries: the Abstract (lines 15-22) and the front page's STD: 96 /
  Updates: 9052 / Category: Standards Track (lines 5-10), because neither
  sits in a numbered section and a locator naming none would be unresolvable
  to bin/check-locators; both are quoted in normative.md and the standing is
  recorded in record.yaml, summary.md and distilled/README.md. Section 1's
  opening IoT/CBOR paragraph (lines 90-101) is background with no normative
  content and is the only non-heading run of sections 1 to 6 that
  normative.md does not reproduce. Section 7's two reference lists and the
  Acknowledgments are bibliography and provenance.

  ONE LINE-BREAK SEVERANCE, DECLARED AND NOT HEALED. The plain-text wrap
  cuts "long-term" across source lines 308-309, so section 3.1's archiving
  sentence can only be quoted as "long- term archiving services". It is
  quoted that way, with the severance named in the entry's note. Nothing in
  this file is spliced, healed or re-hyphenated.

  TWO DELIBERATE DUPLICATE TEXTS. Section 3.3 prints "Create the value
  ToBeSigned by encoding the Countersign_structure to a byte string, using
  the encoding described in Section 4." twice, as step 2 of creation and
  step 2 of verification. Both entries exist, with the same `text` and
  different `object`, because the source repeats itself verbatim and each
  procedure needs its own step. Step 1 of each procedure is also the same
  sentence and is quoted WITH its lead-in ("How to compute a
  countersignature:" / "The steps for verifying a countersignature:") so
  those two are distinct.

  BOTH REGISTRY TABLES ARE QUOTED WHOLE WITH THEIR CAPTIONS, not row by row,
  because Table 1 (section 2) and Table 2 (section 5.2) are IDENTICAL IN
  CONTENT and differ only in caption - so a row quoted alone is not unique
  in this document and could not be told apart by any later reader or
  script.
reviewed_by: ""
note: >-
  Ids are stable and never reused. Cite as rfc-9338#R-NNNN.

  FX-1 extraction, every pass at effort max. No `profile` is claimed in
  record.yaml and no `reviewed_by` is signed; record.yaml's
  `distillation.passes` is the authority for which passes have run.

  `text` is the source's own wording with whitespace normalised - line
  breaks and the RFC's double sentence spacing become single spaces, and
  inside the two registry tables the box rules and column padding do too.
  EVERY `text` WAS MECHANICALLY VERIFIED, never by eye: each is a contiguous
  substring of the whitespace-normalised source, each occurrence count is
  recorded, and each is confirmed to fall inside the section its `locator`
  claims using the same containment rule bin/check-locators applies. The
  generator refuses to write the file if any check fails, and it did refuse
  three times before this version.

  `verb: none` marks an entry whose source sentence carries no BCP 14
  keyword; `field` then names the phrase that carries the force instead, and
  where that phrase is a lowercase near-keyword the verb records it as
  such - for example `none (lowercase "must")`.

  THE DOCUMENT CONTRADICTS ITSELF ABOUT ITS OWN PERMITTED TARGETS, IN BOTH
  DIRECTIONS, AND NEITHER LIST IS IN THE ERRATA. Section 2 permits label 11
  in COSE_Sign1, COSE_Signature, COSE_Encrypt, COSE_recipient,
  COSE_Encrypt0, COSE_Mac and COSE_Mac0 - seven, with COSE_Sign ABSENT.
  Section 3.3's process takes COSE_Signature, COSE_Sign1, COSE_Sign,
  COSE_Mac, COSE_Mac0, COSE_Encrypt or COSE_Encrypt0 - seven, with COSE_Sign
  PRESENT and COSE_recipient ABSENT. The union is eight, the intersection
  six, and Appendix A.1.1 - the document's only signed-message example -
  countersigns a tagged COSE_Sign, which section 2 does not permit and to
  which section 3 assigns no countersignature semantics at all. Label 12 is
  given no permitted-target list anywhere.

  THE TARGET-COVERAGE TABLE IS DERIVED, NOT ASSERTED. Which targets
  get `other_fields`, and therefore which get the "V2" context strings, is
  arithmetic on RFC 9052's CDDL rather than anything this document states
  per structure. The derivation is mechanical, off this library's verbatim
  capture of that CDDL, in distilled/schema/bstr-slot-census.derived.txt;
  messages.yaml carries the result as eight rows. Summary: other_fields is
  present for COSE_Sign1, COSE_Mac and COSE_Mac0 only, and of those it
  carries a SIGNATURE for exactly one, COSE_Sign1.

  UNVERIFIABLE IN THIS REPOSITORY. Notes above and in design-notes.md cite
  R-M-12, R-O-03, R-O-05, DEC-002 and MD-3, which are defined in `mofn`
  documents this library does not hold - it is standalone by design
  (CLAUDE.md). Those citations cannot be checked from this repository and
  are marked as such wherever they appear, following records/ietf/rfc-9741
  and records/ietf/rfc-9964. Every finding here is measured against
  .cache/rfc-9338.txt and, for the slot census, against
  records/ietf/rfc-9052/distilled/schema/cose.cddl.

