    text: 'Countersignatures of COSE_Encrypt and COSE_Mac with short authentication tags do not provide the security properties associated with the same algorithm used in COSE_Sign.'
    kind: inferred
    testable: 'yes'
    status: active
    source_lines: '520-522'
  - id: 'rfc-9338#R-0128'
    object: 'the authentication tag length'
    field: 'minimum for 128-bit collision security'
    verb: 'MUST'
    actor: 'an implementation'
    locator: '§6'
    text: 'To provide 128-bit security against collision attacks, the tag length MUST be at least 256 bits.'
    kind: stated
    testable: 'yes'
    status: active
    source_lines: '522-524'
    note: >-
        BCP 14 KEYWORD 2 OF 2. It constrains the TARGET's tag length, not the
        countersignature's algorithm, and the actor is whoever chose the MAC or
        AEAD - not the countersigner. Unsatisfiable with the two algorithms named
        in the next two sentences.
  - id: 'rfc-9338#R-0129'
    object: 'a countersignature of a COSE_Mac with AES-MAC'
    field: 'integrity ceiling'
    verb: 'none'
    actor: 'reader'
    locator: '§6'
    text: 'A countersignature of a COSE_Mac with AES-MAC (using a 128-bit key or larger) provides at most 64 bits of integrity protection.'
    kind: inferred
    testable: 'yes'
    status: active
    source_lines: '524-526'
    note: >-
        64 < 256, so this configuration cannot satisfy the MUST above. The ceiling
        is set by the target, and no countersignature algorithm lifts it.
  - id: 'rfc-9338#R-0130'
    object: 'a countersignature of a COSE_Encrypt with AES-CCM-16-64-128'
    field: 'integrity ceiling'
    verb: 'none'
    actor: 'reader'
    locator: '§6'
    text: 'Similarly, a countersignature of a COSE_Encrypt with AES-CCM-16-64-128 provides at most 32 bits of integrity protection.'
    kind: inferred
    testable: 'yes'
    status: active
    source_lines: '526-527'
    note: >-
        32 < 256; same point.
