    source_lines: '114-118'
    note: >-
        LOAD-BEARING. "the third slot of the array" is the only statement of how
        the RFC 8152 algorithm chose what it covered, and it is the evidence for
        reading section 3.3's `payload` POSITIONALLY. RFC 8152 section 4.5 puts it
        as "a set of protected attributes, a set of unprotected attributes, and a
        body, in that order". See design-notes.md section 3.
        [verified 2026-10-21, after pass 2] THIS QUOTATION IS NO LONGER
        UNVERIFIABLE HERE. Pass 2 flagged it as the record's one load-bearing
        quotation of a document the library held without a cached rendering,
        and reported two circulating wordings of it - a signal hazards.md says
        to treat as evidence rather than judgement. RFC 8152 has since been
        cached with bin/fetch-source (digest-verified against its record), and
        the sentence resolves as a contiguous span of it: "The elements are a
        set of protected attributes, a set of unprotected attributes, and a
        body, in that order." So THIS wording is the correct one and the
        record needs no change. The shorter wording, without the two "a set
        of", appears only in pass 1's COMMIT MESSAGE, which is git history and
        not an artifact - so nothing here was ever wrong, and reading P stands
        on a quotation that can now be checked.
