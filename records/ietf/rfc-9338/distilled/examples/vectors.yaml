    hex: '8570436f756e7465725369676e617475726543a1012643a101264054546869732069732074686520636f6e74656e742e'
    note: >-
      THE SEMANTIC READING OF THE SAME CASE: `payload` = the content. 48 bytes,
      and THE SIGNATURE VALUE APPEARS NOWHERE - which is what section 1's "there
      is no cryptographically computed value" says and what section 3 denies.
      UNDER THIS READING ONLY, TWO SIGNERS COLLIDE: this byte string depends on
      the COSE_Signature's PROTECTED bucket and not on its unprotected one,
      and `kid` is unprotected in all six of the document's examples, so two
      signers over one payload with identical protected buckets produce this
      same array and a countersignature over one verifies unchanged as a
      countersignature over the other. Under the positional reading (V-0013)
      they do not collide. Verified by construction, not asserted: see
      README.md.

collisions:
  - name: 'two signers, one payload, identical protected buckets'
    locator: '§3.3 + Appendix A'
    result: >-
      CONSTRUCTED, NOT ASSERTED. Two COSE_Signature entries in one COSE_Sign
      with the same protected bucket (h'a10126', as A.1.1 uses) differing only
      in the unprotected `kid`, countersigned by the same countersigner. Under
      the SEMANTIC reading both Countersign_structures are the byte string of
      V-0014 and are IDENTICAL, so a countersignature over one verifies
      unchanged as one over the other. Under the POSITIONAL reading they differ,
      because each signer's own signature value lands in the `payload` slot.
      Measured both ways; the document chooses neither reading.
    identical_under_semantic_reading: true
    identical_under_positional_reading: false
    structure_sha256_semantic: '88b49d7260ca695ceab460c7f3464cc5e2de77ee488a72332d022811272fab3c'

not_reproducible: >-
  NO SIGNATURE VERIFICATION. RFC 9338 prints no key material of any kind, so
  none of the six examples can be verified from this document. The three
  ECDSA examples (A.1.1, A.2.1, A.3.1) are randomised and could not be
  REPRODUCED even with the keys; the three EdDSA ones (A.4.1, A.5.1, A.6.1)
  are deterministic and would be. A later pass that wants signature
  verification needs the key set, which lives in RFC 8152's and RFC 9052's
  appendices and is not this record's to copy.

  NO TAG-19 EXAMPLE. The document registers CBOR tag 19 for a standalone
  countersignature and prints no example of one, and protocol.yaml flow F-4
  is empty for the same reason: there is no specified way to associate a
  standalone countersignature with its target.

  NO ABBREVIATED (LABEL 12) EXAMPLE. All six examples use label 11.

  NO DETACHED-PAYLOAD EXAMPLE, which is the one that would have forced the
  document to say whether its bstr count is by type slot or by wire
  item. `detach` and `nil` occur ZERO times in the source.
