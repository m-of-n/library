note: >-
  FOURTEEN VECTORS: the six messages Appendix A prints, and eight derived
  to-be-signed structures built from them.

  THE SIX PRINTED MESSAGES ARE CBOR DIAGNOSTIC NOTATION, NOT BYTES. RFC 9338
  prints no octets for any whole message; Appendix A says the examples are
  "presented using the extended CBOR diagnostic notation (defined
  in [RFC8610]) rather than as a binary dump" and points at the external
  tool diag2cbor.rb. Each fixture under fixtures/ is therefore an EXACT RUN
  OF SOURCE LINES with its line range and its own sha256, and the hex beside
  it is DERIVED - produced by encoding that diagnostic notation under RFC
  8949 shortest-form heads, preserving the written map key order.

  FIVE OF THE SIX STATED SIZES REPRODUCE EXACTLY: 180, 275, 326, 136, 159.
  THE SIXTH DOES NOT. Appendix A.6.1 states "The size of the binary file is
  159 bytes" and the message it prints encodes to 139 BYTES. A.6.1 is a
  COSE_Mac0 and A.5.1 a COSE_Mac with the same protected bucket, the same
  countersignature, the same payload and a tag of the same width; the whole
  difference between them is the tag head (two octets for 97, one for 17)
  plus A.5.1's 19-octet recipients array, which is exactly 20. The two
  preambles are BYTE-IDENTICAL runs of source text, so the 159 was carried
  over from A.5.1. No erratum covers it: errata searched 2026-10-20 and EID
  7338 on section 3.3 is the only one on RFC 9338. Recorded, not repaired.

  THAT FIVE-OF-SIX AGREEMENT IS ALSO THE ENCODER'S VALIDATION.
  Independently, every `<< { ... } >>` embedded map encodes to exactly the
  hex the document's own diagnostic comment claims for it - h'a10126',
  h'A201260300', h'A1013823', h'a10101', h'a1013823', h'a1013818',
  h'A10101', h'A10127', h'A10105', and the five repeats. THIRTEEN COMMENTS,
  THIRTEEN MATCHES.

  NO SIGNATURE IN APPENDIX A CAN BE VERIFIED FROM THIS DOCUMENT. RFC 9338
  prints no key material anywhere - no COSE_Key, no x/y/d, no public key for
  any of the five `kid` values ('11', 'bilbo.baggins@hobbiton.example',
  'our-secret', 'meriadoc.brandybuck@buckland.example'). The three ECDSA
  examples are randomised and so could not be reproduced even with keys; the
  three EdDSA ones are deterministic and would be reproducible WITH the
  keys. What is reproduced here is the encoding, the sizes and the
  to-be-signed structures.

  THE EIGHT DERIVED ToBeSigned VECTORS ARE THE POINT OF THIS DIRECTORY. They
  are what an implementer actually has to get right and what the document
  never prints. V-0007 to V-0010 are the four whose target has a `payload`
  field and so have a unique answer. V-0011 and V-0012 are the two whose
  target has NO payload field, built under the positional reading only,
  BECAUSE THE DOCUMENT DOES NOT SAY. V-0013 and V-0014 are the
  COSE_Signature case built BOTH ways, which is the measurement behind
  design-notes.md section 3.

  ONE OBSERVATION ABOUT DETERMINISTIC ENCODING. section 4's MUST binds the
  to-be-signed value, not the message. It is just as well: A.3.1's recipient
  unprotected map is written {-1: {...}, 4: '...'}, and under RFC 8949
  section 4.2.1 bytewise key ordering the encoded keys are 0x20 and 0x04, so
  DETERMINISTIC ORDER WOULD PUT 4 FIRST. The document's own example is not
  in deterministic key order. Every other map in the six examples is. So
  these fixtures are countersignature vectors, not deterministic-encoding
  vectors.

