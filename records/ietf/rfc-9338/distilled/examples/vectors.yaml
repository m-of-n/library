      note: 'the hex and both digests of the ENCODING are derived; the fixture is verbatim'
    note: >-
      THE DOCUMENT'S ONLY SIGNED-MESSAGE EXAMPLE, AND IT COUNTERSIGNS A
      COSE_Sign. Label 11 sits at index 1 of the 98(...) array - the BODY's
      unprotected map - not inside the COSE_Signature at index 3. section 2's
      permitted-target list does not include COSE_Sign; section 3.3's does;
      section 3 assigns COSE_Sign no countersignature semantics at all. And
      section 3.1 calls this example "a countersignature on a signature", which
      it is not.

      IT ALSO CANNOT DISAMBIGUATE sign_protected, because the document says "The
      same header parameters are used for both the signature and the
      countersignature": the COSE_Signature's protected bucket and the
      countersigner's are both h'a10126', so the two candidate readings give
      identical bytes. See V-0013 and V-0014.
