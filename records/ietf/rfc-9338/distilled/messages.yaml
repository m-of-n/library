# Every structure, header parameter, registry row and byte-level layout RFC
# 9338 defines. Section numbers are RFC 9338's unless another document is
# named. Requirement ids were RESOLVED FROM THE TEXT of
# distilled/requirements.yaml by a uniqueness-enforcing selector, never typed.

note: >-
  WHAT THIS DOCUMENT ADDS TO THE WIRE: two unprotected header parameters
  (labels 11 and 12), one CBOR tag (19), and three CDDL rules, two of which
  are one-line aliases of RFC 9052 types. Nothing here is a message in the
  exchange sense; a countersignature is a header parameter inside somebody
  else's message, or - with tag 19 only - a standalone item.

  THE ONE STRUCTURE THAT IS WHOLLY THIS DOCUMENT'S IS Countersign_structure,
  the to-be-signed array, and it is never transmitted: section 1.2 puts it
  under `Internal_Types`, "those non-terminals that are used for security
  computations but are not emitted for transport".

  THE TARGET-COVERAGE TABLE BELOW IS THE LOAD-BEARING PART OF THIS FILE, and
  it is DERIVED rather than quoted. RFC 9338 states which targets
  get `other_fields`, and therefore which get the "V2" context strings, for
  exactly one structure - COSE_Sign1, as an example in section 3.3. For the
  other seven the answer is arithmetic on RFC 9052's CDDL, carried out
  mechanically against this library's verbatim capture of it in
  schema/bstr-slot-census.derived.txt.

  TWO THINGS THE TABLE SHOWS THAT THE DOCUMENT DOES NOT SAY ANYWHERE.
  First, `other_fields` is present for three of the eight permitted targets,
  so FIVE OF EIGHT KEEP RFC 8152's CONTEXT STRINGS - the only domain
  separator between the two versions of the algorithm does not separate them
  for most targets. Second, of the three that do get `other_fields`, it
  carries a SIGNATURE for exactly one (COSE_Sign1) and a MAC TAG for the
  other two, and for COSE_Sign no signature value is reachable at all
  because `signatures` is an array and not a bstr field.

  THE TWO PERMITTED-TARGET LISTS DISAGREE IN BOTH DIRECTIONS and the table
  carries all eight rows for that reason: section 2's list omits COSE_Sign,
  section 3.3's omits COSE_recipient, the union is eight and the
  intersection six. Each row records which list it is in.

  BYTE-LEVEL LAYOUT IS GIVEN WHERE IT COULD BE COMPUTED. RFC 9338 prints no
  octets for any whole message - Appendix A is CBOR diagnostic notation - so
  every hex string in this file was produced by encoding the document's own
  diagnostic notation under RFC 8949 shortest-form heads and is recorded as
  derived. examples/vectors.yaml carries the fixtures and the one size
  mismatch.

structures:
  - name: 'Countersignature version 2 (header parameter, label 11)'
    kind: header-parameter
    locator: '§2, §5.2 (Table 1 and Table 2)'
    label: 11
    value_type: 'COSE_Countersignature / [+ COSE_Countersignature]'
    bucket: 'unprotected ONLY'
    cddl: 'CountersignatureV2_header = ( ? 11 => COSE_Countersignature / [+ COSE_Countersignature] )'
    required: false
    encoding: 'map entry in the unprotected header map, integer key 11'
    registry: 'COSE Header Parameters (global label space), Value Registry blank, Reference RFC 9338'
    constrained_by:
      - 'rfc-9338#R-0031'
      - 'rfc-9338#R-0033'
      - 'rfc-9338#R-0036'
      - 'rfc-9338#R-0120'
      - 'rfc-9338#R-0121'
    note: >-
      PERMITTED TARGETS PER section 2, seven: COSE_Sign1, COSE_Signature,
      COSE_Encrypt, COSE_recipient, COSE_Encrypt0, COSE_Mac, COSE_Mac0.
      COSE_Sign is NOT in that list, yet Appendix A.1.1 - the document's only
      signed-message example - puts label 11 in the unprotected map of a tagged
      COSE_Sign.

      THE VALUE TYPE IS A CHOICE, so one countersignature and an array of one
      countersignature are both legal and are different bytes. All six Appendix
      A examples use the bare non-array form. Nothing says a receiver must
      accept both, and nothing makes either canonical.

      UNPROTECTED, ALWAYS. Nothing beside a countersignature is signed by the
      primary signer, so a countersignature can be added to, removed from or
      reordered within a finished message without disturbing the primary
      signature. That is what makes it a countersignature and it is also the
      whole of its malleability.

      SCOPE EXPOSURE (unverifiable-here id R-M-12, defined in `mofn`). The value
      is a COSE_Signature, which carries its own `Headers` bucket, so a
      countersignature nests a second UNBOUNDED instance of the same global COSE
      header label space, scoped by neither key nor countersigner, and section
      3.1 allows that to recurse. Contrast rfc-9360 section 3, whose x5*-sender
      labels IANA placed in the COSE Header ALGORITHM Parameters registry and so
      scoped to an (algorithm, label) pair; label 11 went into the unscoped
      registry.
  - name: 'Countersignature0 version 2 (header parameter, label 12)'
    kind: header-parameter
    locator: '§2 (Table 1), §3.2, §5.2 (Table 2)'
    label: 12
    value_type: 'COSE_Countersignature0'
    bucket: 'unprotected ONLY'
    cddl: 'Countersignature0V2_header = ( ? 12 => COSE_Countersignature0 )'
    required: false
    encoding: 'map entry in the unprotected header map, integer key 12'
    registry: 'COSE Header Parameters (global label space), Value Registry blank, Reference RFC 9338'
    constrained_by:
      - 'rfc-9338#R-0037'
      - 'rfc-9338#R-0080'
      - 'rfc-9338#R-0081'
      - 'rfc-9338#R-0120'
    note: >-
      NO PERMITTED-TARGET LIST EXISTS FOR THIS PARAMETER ANYWHERE IN THE
      DOCUMENT. section 2 has exactly one labelled entry, "V2 countersignature",
      whose target list is for label 11; Table 1 gives label 12 a name, a value
      type and a Description and no targets; section 3.2 describes the form and
      names no structure; section 3.3's input list is about the TARGET, not
      about which header parameter carries the result. So where label 12 may
      appear is undefined, and none of the six Appendix A examples uses it.

      UNUSABLE BY A THIRD PARTY, BY CONSTRUCTION. section 3.2: the parameters
      for computing or verifying it "are provided by the same context used to
      describe the encryption, signature, or MAC processing", and section 1.3
      defines context as "information that is not part of the COSE message". A
      witness or transparency service is by definition outside that context, so
      it cannot carry one and cannot verify one.

      AND IT IS NOT INTERCONVERTIBLE WITH THE FULL FORM, because the `context`
      text string differs - section 3's own reason for the rule.
  - name: 'COSE_Countersignature'
    kind: structure
    locator: '§3.1'
    cddl: 'COSE_Countersignature = COSE_Signature'
    defined_in_this_document: false
    shape: '[ protected : empty_or_serialized_map, unprotected : header_map, signature : bstr ]  (RFC 9052 §4.1)'
    encoding: 'CBOR array of 3 items'
    constrained_by:
      - 'rfc-9338#R-0071'
      - 'rfc-9338#R-0046'
      - 'rfc-9338#R-0062'
      - 'rfc-9338#R-0063'
      - 'rfc-9338#R-0072'
    note: >-
      A ONE-LINE ALIAS. The structure is RFC 9052's COSE_Signature and this
      document neither restates nor constrains it; section 3.1 points at RFC
      9052 section 4.1 for the fields. So the collected CDDL that section 1.2's
      XPath yields references COSE_Signature without defining it - see
      schema/README.md.

      FIELD-BY-FIELD, from RFC 9052's own CDDL as held verbatim at
      records/ietf/rfc-9052/distilled/schema/cose.cddl: `protected`
      is `empty_or_serialized_map`, `unprotected` is `header_map`, `signature`
      is `bstr`. In all six Appendix A examples `protected` carries only `alg`
      (label 1) and `unprotected` only `kid` (label 4).

      KID IS IN THE UNPROTECTED BUCKET IN EVERY EXAMPLE, which matters for the
      COSE_Signature-target case: see target_coverage below and design-notes.md
      section 4.
  - name: 'COSE_Countersignature_Tagged'
    kind: structure
    locator: '§3.1, §5.1'
    cddl: 'COSE_Countersignature_Tagged = #6.19(COSE_Countersignature)'
    cbor_tag: 19
    encoding: "tag head 0xd3 (major type 6, value 19 < 24, so one octet) followed by the 3-item array"
    constrained_by:
      - 'rfc-9338#R-0070'
      - 'rfc-9338#R-0068'
      - 'rfc-9338#R-0067'
      - 'rfc-9338#R-0118'
    note: >-
      THE ONLY NEW CBOR TAG IN THE COSE LANE, and its registered Semantics are
      "COSE standalone V2 countersignature" - standalone being the point. The
      header-parameter form at label 11 or 12 is UNTAGGED, so an encoder that
      forbids IANA CBOR tags can still produce and consume every in-message
      countersignature this document defines. What it cannot produce is a
      DETACHED one. design-notes.md section 7 names that against DEC-002 option
      5.

      THE TAG IS ONE OCTET. 19 < 24, so the tag head is 0xd3; `start` in section
      1.2 is `COSE_Countersignature_Tagged / Internal_Types`, which means the
      only thing the document's own grammar admits as a top-level transmitted
      item is the TAGGED standalone form.
  - name: 'COSE_Countersignature0'
    kind: structure
    locator: '§3.2'
    cddl: 'COSE_Countersignature0 = bstr'
    encoding: 'a bare CBOR byte string holding the signature value'
    constrained_by:
      - 'rfc-9338#R-0079'
      - 'rfc-9338#R-0049'
      - 'rfc-9338#R-0077'
      - 'rfc-9338#R-0078'
    note: >-
      NO HEADERS AT ALL, so no `alg` and no `kid` travel with it. There is no
      field in which to put a key identifier, which is why section 3.2 scopes it
      to "encrypted group messaging" where the context already fixes the key.
  - name: 'Countersign_structure (to-be-signed; never transmitted)'
    kind: 'security-computation structure'
    locator: '§3.3'
    transmitted: false
    encoding: >-
      CBOR array of 4, 5 or 6 items depending on form and on the target's
      bstr-slot count. Encoded under RFC 8949 section 4.2 as narrowed by RFC
      9052 section 9 - the document's first of two MUSTs.
    arity:
      - 'full, other_fields absent  -> 5 items: context, body_protected, sign_protected, external_aad, payload'
      - 'full, other_fields present -> 6 items: the above plus other_fields'
      - 'abbreviated, absent        -> 4 items: sign_protected omitted'
      - 'abbreviated, present       -> 5 items: sign_protected omitted, other_fields appended'
    constrained_by:
      - 'rfc-9338#R-0100'
      - 'rfc-9338#R-0085'
      - 'rfc-9338#R-0083'
      - 'rfc-9338#R-0087'
      - 'rfc-9338#R-0086'
      - 'rfc-9338#R-0113'
    note: >-
      THE CDDL AS PRINTED DOES NOT PARSE. Erratum 7338 (Reported, Technical,
      section 3.3, Carsten Bormann, 2023-02-06; errata searched 2026-10-20 and
      this is the only erratum on RFC 9338) - a trailing `/` after
      "CounterSignature0V2". schema/rfc9338.cddl keeps it; the repaired rule is
      schema/countersign-structure.derived.cddl.

      THE CDDL AND THE PROSE DISAGREE ABOUT ARITY. The CDDL makes `context` a
      free choice of all four strings and `? other_fields` independent of it, so
      the grammar admits "CounterSignature" WITH other_fields and
      "CounterSignatureV2" WITHOUT - both of which section 3.3's four prose
      bullets forbid. The pairing is encoded only in
      schema/countersign-structure.derived.schema.json's oneOf, which is
      therefore stricter than the source's own grammar.

      `payload : bstr` IS MANDATORY IN THE CDDL and four of the eight permitted
      targets have no payload field. See the `payload` field below.
    fields:
      - name: 'context'
        position: 1
        type: '"CounterSignature" / "CounterSignature0" / "CounterSignatureV2" / "CounterSignature0V2"'
        required: true
        encoding: >-
            CBOR text string (major type 3). 0x70 + 16 bytes for "CounterSignature",
            0x71 + 17 for "CounterSignature0", 0x72 + 18 for "CounterSignatureV2",
            0x73 + 19 for "CounterSignature0V2" - all four under 24 bytes, so a
            one-octet head.
        locator: '§3.3'
        constrained_by:
          - 'rfc-9338#R-0088'
          - 'rfc-9338#R-0089'
          - 'rfc-9338#R-0090'
          - 'rfc-9338#R-0091'
          - 'rfc-9338#R-0092'
          - 'rfc-9338#R-0050'
        note: >-
          THE DOCUMENT'S ONLY DOMAIN SEPARATOR, and the switch is NOT a choice the
          signer makes: it is `other_fields` present or absent, which is arithmetic
          on the target. Five of the eight permitted targets therefore sign the RFC
          8152 string "CounterSignature", identical to the version 1 algorithm's, so
          the indicator fails to distinguish the two versions of the protocol it is
          meant to version. Combined with section 1's instruction that new
          implementations keep VERIFYING label 7, a verifier that accepts both
          accepts the same bytes under two names.

          THIS IS ALSO AN R-O-05-SHAPED HAZARD (unverifiable-here id, defined
          in `mofn`): an authenticated type indicator inside the signed bytes is the
          right SHAPE, and this is a worked example of such an indicator carrying
          the wrong value.
      - name: 'body_protected'
        position: 2
        type: 'empty_or_serialized_map (a bstr)'
        required: true
        encoding: >-
            CBOR byte string holding the target's serialized protected map, or a
            zero-length byte string (0x40) if there are no protected attributes. In
            Appendix A.1.1 it is 0x40; in A.2.1 it is 0x45a201260300.
        locator: '§3.3'
        constrained_by:
          - 'rfc-9338#R-0093'
        note: >-
          THE NAME FIGHTS THE DEFINITION. It is named for the body and defined as
          "The serialized protected attributes from the target structure". When the
          target is a COSE_Signature inside a COSE_Sign those are different buckets,
          and under either reading THE ENCLOSING BODY'S PROTECTED HEADER IS COVERED
          NOWHERE - so a countersignature over one signer's COSE_Signature does not
          bind the message's content type or `crit`. RFC 9052 section 4.4's
          Sig_structure uses the same two field names for the BODY and the SIGNER,
          so a reader who transfers that meaning gets a different answer.
          design-notes.md section 4.
      - name: 'sign_protected'
        position: 3
        type: 'empty_or_serialized_map (a bstr); omitted for the abbreviated form'
        required: 'conditional'
        encoding: >-
            CBOR byte string, or absent. Absent for the Countersignature0V2 attribute
            per section 3.3. Zero-length (0x40) if the countersigner has no protected
            attributes.
        locator: '§3.3'
        constrained_by:
          - 'rfc-9338#R-0094'
          - 'rfc-9338#R-0084'
        note: >-
          "the signer structure" IS THE COUNTERSIGNER, per section 3.3's input list
          which names "the signer information (COSE_Signature)" as a separate input
          from the target. But when the TARGET is itself a COSE_Signature, both
          inputs are COSE_Signatures and the field names stop disambiguating them.
          Appendix A.1.1 CANNOT SETTLE IT: the document says "The same header
          parameters are used for both the signature and the countersignature", so
          both candidate values are h'a10126' and the two readings give
          byte-identical results. The document provides no example where they
          differ.

          THE OMISSION RULE IS INCOMPLETE. It names "the Countersignature0V2
          attribute" - one of the two abbreviated context strings. For an
          abbreviated countersignature over a COSE_Encrypt0, whose context is
          "CounterSignature0", the text does not say whether this field is absent or
          present-and-empty, and the two give different signed bytes. Charitably the
          sentence means the label-12 attribute whatever the context string; it does
          not say so.
      - name: 'external_aad'
        position: 4
        type: bstr
        required: true
        encoding: >-
            CBOR byte string; zero-length (0x40) when not supplied. 0x40 in all six
            Appendix A examples, none of which uses external AAD.
        locator: '§3.3'
        constrained_by:
          - 'rfc-9338#R-0095'
        note: >-
          The only slot in which an application's own context can be bound, and
          section 1.3 says "Context should generally be included in the
          cryptographic construction" without saying where. This is where.
      - name: 'payload'
        position: 5
        type: bstr
        required: true
        encoding: >-
            CBOR byte string. In the four Appendix A examples whose target has a
            payload field it is 0x54 followed by 'This is the content.' (20 bytes).
        locator: '§3.3'
        constrained_by:
          - 'rfc-9338#R-0096'
          - 'rfc-9338#R-0098'
          - 'rfc-9338#R-0057'
          - 'rfc-9338#R-0006'
        note: >-
          THE UNDER-SPECIFIED FIELD, AND THE ONE EVERYTHING TURNS ON. It is
          mandatory in the CDDL, and FOUR OF THE EIGHT PERMITTED TARGETS HAVE NO
          payload FIELD: COSE_Signature, COSE_Encrypt, COSE_Encrypt0 and
          COSE_recipient. section 3.3 says only "The payload to be signed", so there
          are two readings.

          POSITIONAL: the target's SECOND bstr slot fills it, which is what "all
          bstr fields after the second" presupposes and what RFC 8152 section 4.5
          did - its Sig_structure took the target as "a set of protected attributes,
          a set of unprotected attributes, and a body, in that order", the "third
          slot" section 1 names. Under this reading payload is the ciphertext for
          the encryption targets and THE SIGNATURE VALUE for a COSE_Signature
          target, and section 1's "designed to produce the same countersignature
          value in those cases where the computed cryptographic value was already
          included" is satisfied.

          SEMANTIC: `payload` means the content, which is what "The payload is
          placed here independently of how it is transported" is about. Under this
          reading a COSE_Signature target's signature bytes are covered NOWHERE and
          section 3's "the normal countersignature semantics are preserved" is false
          for it.

          THE DOCUMENT CHOOSES NEITHER, and the consequence is measurable: two of
          its own six examples (A.3.1 COSE_Encrypt and A.4.1 COSE_Encrypt0) cannot
          be reduced to a unique ToBeSigned. examples/vectors.yaml V-0011 to V-0014
          builds both readings. For COSE_Sign the readings AGREE and the answer is
          the content, so no signature value is bound either way.
      - name: 'other_fields'
        position: 6
        type: '[+ bstr]; omitted when the target has only two bstr fields'
        required: 'conditional'
        encoding: >-
            CBOR array of one or more byte strings, or absent. For every target that
            gets it the array has exactly one element, so the encoding is 0x81
            followed by one byte string.
        locator: '§3.3'
        constrained_by:
          - 'rfc-9338#R-0097'
          - 'rfc-9338#R-0098'
          - 'rfc-9338#R-0099'
          - 'rfc-9338#R-0052'
        note: >-
          THE WHOLE OF THE REPAIR, AND IT REACHES THREE OF EIGHT TARGETS. Derived
          mechanically against RFC 9052's verbatim CDDL in
          schema/bstr-slot-census.derived.txt: present for COSE_Sign1 ([signature]),
          COSE_Mac ([tag]) and COSE_Mac0 ([tag]); absent for COSE_Signature,
          COSE_Sign, COSE_Encrypt, COSE_Encrypt0 and COSE_recipient.

          THE COUNT IS BY TYPE SLOT, NOT BY WIRE ITEM, and section 3.3's own
          COSE_Sign1 example is the proof: the claim "an array of one element ...
          containing the signature value" holds only if `protected` is bstr field
          one and `payload : bstr / nil` is bstr field two.

          THE DETACHED-PAYLOAD HAZARD IS EXACTLY THIS. A COSE_Sign1 with a detached
          payload carries `nil` on the wire, so it has three bstr TYPE SLOTS and two
          WIRE items; an implementer who counts what arrived omits other_fields,
          drops the signature from the signed bytes and silently loses the repair.
          The words `detach` and `nil` occur ZERO times in RFC 9338.

# DERIVED from records/ietf/rfc-9052/distilled/schema/cose.cddl by script;
# see schema/bstr-slot-census.derived.txt. Not printed in RFC 9338.
target_coverage:
  - target: 'COSE_Sign1'
    in_permitted_target_lists: 'both §2 and §3.3'
    bstr_type_slots: 3
    bstr_wire_items_when_payload_or_ciphertext_is_nil: 2
    bstr_slot_order: 'protected, payload, signature'
    other_fields: '[signature]'
    context_string_full_form: 'CounterSignatureV2'
    context_string_abbreviated_form: 'CounterSignature0V2'
    binds: >-
      the target's own signature value
    note: >-
      THE ONLY TARGET WHOSE other_fields CARRIES A SIGNATURE, and the one
      structure the document works through. Also the one detached payloads
      break: 3 type slots, 2 wire items.
  - target: 'COSE_Mac'
    in_permitted_target_lists: 'both §2 and §3.3'
    bstr_type_slots: 3
    bstr_wire_items_when_payload_or_ciphertext_is_nil: 2
    bstr_slot_order: 'protected, payload, tag'
    other_fields: '[tag]'
    context_string_full_form: 'CounterSignatureV2'
    context_string_abbreviated_form: 'CounterSignature0V2'
    binds: >-
      a MAC tag, not a signature
    note: >-
      §6 caps it: with AES-MAC at most 64 bits of integrity protection, against
      a MUST of at least 256.
  - target: 'COSE_Mac0'
    in_permitted_target_lists: 'both §2 and §3.3'
    bstr_type_slots: 3
    bstr_wire_items_when_payload_or_ciphertext_is_nil: 2
    bstr_slot_order: 'protected, payload, tag'
    other_fields: '[tag]'
    context_string_full_form: 'CounterSignatureV2'
    context_string_abbreviated_form: 'CounterSignature0V2'
    binds: >-
      a MAC tag, not a signature
    note: >-
      Same as COSE_Mac. Appendix A.6.1 is this case and its stated size is wrong
      by 20 bytes.
  - target: 'COSE_Signature'
    in_permitted_target_lists: 'both §2 and §3.3'
    bstr_type_slots: 2
    bstr_wire_items_when_payload_or_ciphertext_is_nil: 2
    bstr_slot_order: 'protected, signature'
    other_fields: 'OMITTED'
    context_string_full_form: 'CounterSignature'
    context_string_abbreviated_form: 'CounterSignature0'
    binds: >-
      the signature value ONLY under the positional reading of `payload`;
      nothing under the semantic reading
    note: >-
      THE CONTESTED ROW. §1 concedes "there is no cryptographically computed
      value"; §3 claims "the normal countersignature semantics are preserved".
      They are reconcilable under the positional reading and not under the
      semantic one, and the document states neither. Under BOTH readings the
      ENCLOSING COSE_Sign's protected bucket is covered nowhere. Note the slot
      count is 2 by type AND 2 by wire - this is the one target where the two
      columns agree at 2.
  - target: 'COSE_Sign'
    in_permitted_target_lists: '§3.3 ONLY (§2 omits it)'
    bstr_type_slots: 2
    bstr_wire_items_when_payload_or_ciphertext_is_nil: 1
    bstr_slot_order: 'protected, payload'
    other_fields: 'OMITTED'
    context_string_full_form: 'CounterSignature'
    context_string_abbreviated_form: 'CounterSignature0'
    binds: >-
      NOTHING - no signature value is reachable under either reading,
      because `signatures : [+ COSE_Signature]` is an array and not a bstr field
    note: >-
      THE DECISIVE ROW FOR A WITNESS OVER A MULTI-SIGNER EXPORT, and it is
      unconditional. §3 assigns COSE_Sign no countersignature semantics at all,
      §2 does not permit label 11 in it, and Appendix A.1.1 does it anyway.
      design-notes.md section 9.
  - target: 'COSE_Encrypt'
    in_permitted_target_lists: 'both §2 and §3.3'
    bstr_type_slots: 2
    bstr_wire_items_when_payload_or_ciphertext_is_nil: 1
    bstr_slot_order: 'protected, ciphertext'
    other_fields: 'OMITTED'
    context_string_full_form: 'CounterSignature'
    context_string_abbreviated_form: 'CounterSignature0'
    binds: >-
      the ciphertext, under the positional reading; undefined under the semantic
      one
    note: >-
      §3's "the existence of the encrypted data is attested to" is the only
      support for filling `payload` with the ciphertext. A.3.1 is this case.
  - target: 'COSE_Encrypt0'
    in_permitted_target_lists: 'both §2 and §3.3'
    bstr_type_slots: 2
    bstr_wire_items_when_payload_or_ciphertext_is_nil: 1
    bstr_slot_order: 'protected, ciphertext'
    other_fields: 'OMITTED'
    context_string_full_form: 'CounterSignature'
    context_string_abbreviated_form: 'CounterSignature0'
    binds: >-
      the ciphertext, under the positional reading; undefined under the semantic
      one
    note: >-
      A.4.1 is this case. §6 caps it: with AES-CCM-16-64-128 at most 32 bits.
  - target: 'COSE_recipient'
    in_permitted_target_lists: '§2 ONLY (§3.3 omits it)'
    bstr_type_slots: 2
    bstr_wire_items_when_payload_or_ciphertext_is_nil: 1
    bstr_slot_order: 'protected, ciphertext'
    other_fields: 'OMITTED'
    context_string_full_form: 'CounterSignature'
    context_string_abbreviated_form: 'CounterSignature0'
    binds: >-
      the ciphertext, under the positional reading; undefined under the semantic
      one
    note: >-
      PERMITTED BY §2 AND NOT AN INPUT TO §3.3's PROCESS, so the document
      permits a countersignature it gives no algorithm for. It carries
      a `Headers` bucket like every other target, so there is no structural
      reason for the omission.

target_coverage_summary: >-
  other_fields present for 3 of 8 permitted targets (COSE_Sign1, COSE_Mac,
  COSE_Mac0). Of those 3 it carries a SIGNATURE for 1 (COSE_Sign1) and a MAC
  TAG for 2. 5 of 8 keep RFC 8152's context strings. 1 of 8 (COSE_Sign)
  binds no cryptographic value under any reading. 3 of 8 (COSE_Signature,
  COSE_Encrypt, COSE_Encrypt0) plus COSE_recipient have no payload field and
  so depend on an unstated reading of Countersign_structure.payload. The
  intersection of the two permitted-target lists is 6; the union is 8.

