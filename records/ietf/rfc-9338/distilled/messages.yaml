    head_sequence: >-
      d862 (tag 98, COSE_Sign_Tagged) 84 (array(4)) 40 (protected: bstr(0)) a1
      (unprotected: map(1)) 0b (key 11) 83 (array(3), the countersignature) 43
      a10126 (its protected) a1 04 4231 31 (its unprotected {4: '11'}) 5840 ...
      (its 64-byte signature) 54 ... (payload, 20 bytes) 81 (signatures:
      array(1)) 83 ... (the COSE_Signature)
    note: >-
      The countersignature sits at index 1 of the COSE_Sign array - in the
      BODY's unprotected map - not inside the COSE_Signature at index 3. section
