status: summarized
usefulness:
  verdict: useful
  reason: "Part of STD 96 with RFC 9052, and the closest COSE primitive to a witness over someone else's statement. The summary pass narrowed that and the extract pass narrowed it further: §3.3's `other_fields` rule reaches COSE_Sign1, COSE_Mac and COSE_Mac0 ONLY, and of those three it carries a SIGNATURE for COSE_Sign1 alone - COSE_Mac and COSE_Mac0 get a MAC TAG. The other five structures, COSE_Sign among them, keep RFC 8152's context string; for COSE_Sign no cryptographic value is reachable under any reading, while for the rest what `Countersign_structure.payload` covers is UNDER-SPECIFIED rather than empty - see distilled/design-notes.md section 3.4, which refuted that limb of the framing. That is the cost of rfc-9052 design-notes open question 7."
  assessed: "2026-10-20"
confidence: high
owner: S1
