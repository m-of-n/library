  retrieved: "2026-09-22"
  local: false
relations:
  # The RFC's own header reads `Updates: 9052`; this edge is fact as well as
  # judgement. RFC 9052 removed ALL countersignature text (§1) and this
  # document puts the mechanism back, so the pair is only complete together.
  updates:
    - rfc-9052
  # Added 2026-10-20 by the summary pass, and `supersedes: rfc-8152` was
  # considered and DELIBERATELY NOT SET. What the document does to RFC 8152 is
  # real: §1 replaces RFC 8152 §4.5's algorithm, and §5.2 has IANA stamp
  # "(Deprecated by RFC 9338)" on the Descriptions of labels 7 and 9. But
  # docs/references.md §3 scopes `supersedes` to document LINES; rfc-9052
  # already carries `supersedes: rfc-8152`; and rfc-9053 — which replaces
  # another severed part of RFC 8152 — does not. A second edge would render
  # rfc-8152 as `superseded_by: [rfc-9052, rfc-9338]`, reading as two
  # alternative WHOLE replacements of one document, which is exactly the
  # silent citation retargeting the id rules exist to prevent. Mechanism-level
  # supersession has no relation in this library; recorded in summary.md with
  # the §5.2 locator instead. Overrule if the library decides it deserves one.
  see_also:
    - rfc-8152
  part_of:
    - ietf-cose-wg
bears_on:
  # Widened 2026-10-20 by the summary pass; each addition is argued in
  # summary.md.
  #   DEC-002 — §5.1 registers CBOR tag 19, the ONLY new CBOR tag in the COSE
  #     lane, against option 5's one spelled-out exclusion. Shallow: §3.1
  #     permits tagged OR untagged and the label 11/12 header form is
  #     untagged, so the cut is specifically that option 5 cannot carry a
  #     DETACHED countersignature — a receipt either lives inside the message
  #     it witnesses or it is an invention R-O-03 must then cite.
  #   R-M-12 — the full countersignature "has the same structure as
  #     COSE_Signature" (§3), so it nests a second, UNBOUNDED instance of the
  #     global COSE header label space with no scoping by key or signer. Where
  #     rfc-9360 §3 at least scopes by algorithm, this scopes by nothing.
  #   R-O-05 — HAZARD, not adopt. The `context` text string is an
  #     authenticated type indicator inside the signed bytes, which is the
  #     right shape — and for five of the eight target structures it is the
  #     RFC 8152 string "CounterSignature", so the indicator fails to
  #     distinguish the two versions of the protocol it is meant to version.
  - DEC-002
  - DEC-005
  - R-M-12
  - R-O-05
applicability:
  security: core
