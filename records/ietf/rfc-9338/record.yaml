identifiers:
  # STD 96 is deliberately NOT added as a `std:` key here. The document header
  # reads `STD: 96` and the summary records it, but no record in this library
  # uses a `std` identifier scheme — including rfc-9052, which is STD 96 too —
  # and `identifiers` keys are rendered in index/bibliography.md and exported
  # to CSL-JSON. Introducing a scheme on one record of a pair is how the two
  # drift. Worth a PR that adds it to both, or to neither.
  rfc: 9338
  doi: 10.17487/RFC9338
  url: https://www.rfc-editor.org/rfc/rfc9338.html
content:
  url: https://www.rfc-editor.org/rfc/rfc9338.txt
