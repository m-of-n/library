status: summarized
usefulness:
  verdict: useful
  reason: "Part of STD 96 with RFC 9052, and the closest COSE primitive to a witness over someone else's statement. The summary pass narrows that: §3.3's `other_fields` rule binds the target's signature bytes for COSE_Sign1, COSE_Mac and COSE_Mac0 ONLY — the other five structures, COSE_Sign among them, keep RFC 8152's context string and cover no cryptographic value. That is the cost of rfc-9052 design-notes open question 7."
  assessed: "2026-10-20"
confidence: high
owner: S1
