usefulness:
  verdict: useful
  reason: "The only Standards Track X.509 profile that states an authorization-reduction rule: inherited rights are the issuer's rights intersected with the proxy policy, recursively, unioned with the proxy's own rights (§3.8.2); key usage intersects along the chain (§4.2). A direct comparison case for how SPKI 5-tuple reduction and tag intersection compose."
