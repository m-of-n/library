implementations:
  open_source:
    - name: transparency-dev/merkle
      url: https://github.com/transparency-dev/merkle
      license: Apache-2.0
      language: go
      note: "Merkle tree construction plus inclusion and consistency proof generation and verification. Labelled RFC 6962; the tree hash, PATH and PROOF definitions are the same in 9162 section 2.1 for SHA-256, so this is the proof layer 9942's RFC9162_SHA256 needs. Does not implement the v2 TransItem formats."
    - name: google/trillian
      url: https://github.com/google/trillian
      license: Apache-2.0
      language: go
      note: "Verifiable log store behind Google's CT logs. README cites RFC 6962, not 9162."
    - name: google/certificate-transparency-go
      url: https://github.com/google/certificate-transparency-go
      license: "Apache-2.0 per the repository's LICENSE text; GitHub reports NOASSERTION"
      language: go
      note: "CT client, log personality and tooling. README cites RFC 6962 throughout; no v2 support found."
    - name: FiloSottile/sunlight
      url: https://github.com/FiloSottile/sunlight
      license: ISC
      language: go
      note: "Tiled CT log implementing C2SP static-ct-api, which describes itself as largely RFC 6962 compliant. A v1 lineage, not v2."
    - name: transmute-industries/rfc9162
      url: https://github.com/transmute-industries/rfc9162
      license: Apache-2.0
      language: typescript
      note: "Repository description is 'Implementation of RFC9162'. Zero stars at search time; not vetted, and no evidence it is used by any CT log."
  commercial: []
  searched: "2026-10-23"
usefulness:
  verdict: useful
  reason: "The only document that defines the tree, both proofs and their verification algorithms that rfc-9942's sole VDS points at, and it states in its own words what those proofs do not cover: split views (section 1), with gossip left undefined (11.3)."
  assessed: "2026-10-23"
distillation:
  standard: "FX-1"
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "Every requirement text of requirements.yaml verbatim under its section, script-rendered from line markers; the 28 inferred entries named, not quoted; source defects SD-1 to SD-22 with a table joining them to the other artifacts' ids. Not quoted: the 1.1 BCP 14 recital."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "491 entries: 125 skeleton BCP 14 sentences, 30 split children, 154 keyword-less statements promoted from candidates, 154 hunted, 28 inferred. All 138 BCP 14 keywords reconciled (bin/bcp14-count 138; the XML's 149 adds the 11 in the 1.1 recital). All 341 candidates have a verdict (154 stated, 3 inferred, 184 reject). Sections 1 to 11, including the 10 IANA registries."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema/
      coverage: "Verbatim: the 10 TLS presentation-language blocks and both ASN.1 fragments (7.1, Appendix B). Derived: 13 JSON Schemas for the section 5 request, query and response bodies and the error body; 28 must-accept and 169 must-reject cases, 0 failures. TLS structures are exercised as bytes by examples/reproduce.py."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "37 messages: every TLS structure, the 7 endpoints with request, response and error codes, TLS and X.509/OCSP carriers, the precertificate profile, log parameters; 7 encoding rules, 9 registries, 11 source defects; 435 constrained_by links to 355 ids; 12 ids listed unwired with reasons."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "11 roles, 28 flows, 162 steps (9 inferred); every 5 endpoint and all 14 Error Types; submission, STH issuance, TLS delivery, client validation, monitoring, auditing, freezing, the 2.1 algorithms; one Mermaid diagram per flow in protocol.md; 13 source defects, 12 open issues."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "12 machines, 152 states, 188 transitions: the three verification algorithms as printed (erratum 8670 exits included), log lifecycle, submission to incorporation, STH cadence, TLS handshake, SCT validation, client evidence, monitor, MMD and STH audit. Not modelled: front-end skew, client retry, proof generation, gossip."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/
      coverage: "23 verbatim fixtures (11 code blocks, 12 2.1 figures), 5 derived fixtures (7-leaf tree, inclusion and consistency proofs, wire vectors, API samples); reproduce.py runs 25,501 checks over every tree of 1 to 65 leaves, 0 failed. The RFC prints no hash values, so there is no external oracle."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "31 rows against m-of-n at bb005ed (8 adopt, 4 adapt, 4 reject, 7 constrains, 3 conflicts, 5 silent); proof guarantees checked by script; MD-3 and DEC-002 option by option; the untagged STH signing input analysed from the bytes; 11 open questions. Decides nothing."
      reviewed_by: ""
