    layout: "Extension ::= SEQUENCE { extnID OID 1.3.101.75 (2b654b), critical BOOLEAN DEFAULT FALSE (omitted in DER), extnValue OCTET STRING { OCTET STRING { TransItemList octets } } }. A TransItemList is NOT put directly in extnValue; it is wrapped in an extra OCTET STRING."
