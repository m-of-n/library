    constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    notes:
      - "No requirement with a BCP 14 keyword is in Section 4.12 or Section 2.1.3. The verification algorithm is introduced with \"may be used\" (Section 2.1.3.2), so its steps are in protocol.yaml and examples/reproduce.py, not requirements.yaml."
  - id: "MSG-14"
    name: "SerializedTransItem"
    locator: "§6.3"
    kind: "tls-vector"
    encoding: "TLS opaque vector <1..2^16-1>, 2-octet length prefix"
    summary: "A serialized TransItem as an opaque byte string, so a reader can skip an item whose type it does not know."
    described:
      source_lines: "1802-1807"
      quote: "Here, SerializedTransItem is an opaque byte string that contains the serialized TransItem structure. This encoding ensures that TLS clients can decode each TransItem individually (so, for example, if there is a version upgrade, out-of-date clients can still parse old TransItem structures while skipping over new TransItem structures whose versions they don't understand)."
    declared:
      source_lines: "1796"
      quote: "opaque SerializedTransItem<1..2^16-1>;"
    layout: "[len:2][TransItem octets:len]; len in 1..65535, so one item is at most 65535 octets."
    constrained_by:
      - "rfc-9162#R-0367"
      - "rfc-9162#R-0368"
    constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
  - id: "MSG-15"
    name: "TransItemList"
    locator: "§6.3"
    kind: "tls-struct"
    encoding: "TLS struct"
    summary: "List of TransItems of any type: used as extension_data of transparency_info and inside the Transparency Information X.509v3 extension."
    declared:
      source_lines: "1798-1800"
      quote: "struct { SerializedTransItem trans_item_list<1..2^16-1>; } TransItemList;"
    layout: "[list_len:2]{[item_len:2][TransItem:item_len]}+. list_len is the total octets of all SerializedTransItems. The declared minimum 1 means a TransItemList cannot be empty on the wire."
    fields:
      - name: "trans_item_list"
        type: "SerializedTransItem<1..2^16-1>"
        required: true
        encoding: "2-octet total octet length then SerializedTransItem elements"
        declared:
          source_lines: "1799"
          quote: "SerializedTransItem trans_item_list<1..2^16-1>;"
        constrained_by:
          - "rfc-9162#R-0093"
          - "rfc-9162#R-0094"
        note: "the first requirement applies to each TransItemList sent in a TLS handshake, not to one in an X.509 extension"
    constrained_by:
      - "rfc-9162#R-0366"
      - "rfc-9162#R-0367"
      - "rfc-9162#R-0487"
    constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    notes:
      - "SOURCE TENSION SD-03: trans_item_list is declared <1..2^16-1> (at least one octet) yet Section 6.5 says that if the list is empty the server \"MAY send it with an empty array\" (R-0098). An empty list cannot be encoded as TransItemList; the only legal empty form is an extension_data of zero length, i.e. omitting the structure."
  - id: "MSG-16"
    name: "Merkle hash inputs"
    locator: "§2.1.1, §4.7"
    kind: "hash-input"
    encoding: "byte string fed to HASH"
    summary: "What is hashed to build the tree. HASH is the log hash algorithm (registry value 0x00 = SHA-256)."
    fields:
      - name: "leaf hash"
        type: "HASH_SIZE octets"
        required: true
        encoding: "HASH(0x00 || TransItem)"
        described:
          source_lines: "337"
          quote: "MTH({d[0]}) = HASH(0x00 || d[0])."
        constrained_by:
          - "rfc-9162#R-0131"
          - "rfc-9162#R-0247"
        constrained_by_note: "in a CT log d[i] is the serialized TransItem of type x509_entry_v2 or precert_entry_v2, including its 2-octet versioned_type (Section 4.7); see examples/wire-vectors.derived.json"
        inferred: true
        inferred_reason: "Section 4.7 says leaf hashes are HASH(0x00 || TransItem); the TransItem octets are its serialization under MSG-03"
      - name: "node hash"
        type: "HASH_SIZE octets"
        required: true
        encoding: "HASH(0x01 || left || right)"
        described:
          source_lines: "343"
          quote: "MTH(D_n) = HASH(0x01 || MTH(D[0:k]) || MTH(D[k:n])),"
        constrained_by:
          - "rfc-9162#R-0132"
        constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
      - name: "empty tree hash"
        type: "HASH_SIZE octets"
        required: true
        encoding: "HASH() of the empty string"
        described:
          source_lines: "333"
          quote: "MTH({}) = HASH()."
        constrained_by:
          - "rfc-9162#R-0130"
          - "rfc-9162#R-0488"
        constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    constrained_by:
      - "rfc-9162#R-0127"
      - "rfc-9162#R-0128"
      - "rfc-9162#R-0129"
    constrained_by_note: "no requirement with a BCP 14 keyword binds this structure as a whole; the notation and definition statements (verb none: HASH and HASH_SIZE, the list input and single-hash output, the MTH definition) are wired above (pass 3, 2026-11-08)"
    notes:
      - "Domain separation by the 0x00/0x01 prefix is required \"to give second preimage resistance\" (Section 2.1.1, lowercase \"required\": not a requirement id)."
  - id: "MSG-17"
    name: "Precertificate (CMS SignedData profile)"
    locator: "§3.2"
    kind: "cms-profile"
    encoding: "DER, CMS SignedData (RFC 5652) constrained as listed"
    summary: "A precertificate submitted to a log: a CMS signed-data object whose eContent is the TBSCertificate to be issued."
    declared:
      source_lines: "690-738"
      quote: "A precertificate is a CMS [RFC5652] signed-data object that conforms to the following profile: * It MUST be DER encoded, as described in [X690]. * SignedData.version MUST be v3(3). * SignedData.digestAlgorithms MUST be the same as the SignerInfo.digestAlgorithm OID value (see below). * SignedData.encapContentInfo: - eContentType MUST be the OID 1.3.101.78. - eContent MUST contain a TBSCertificate [RFC5280] that will be identical to the TBSCertificate in the issued certificate, except that the Transparency Information (Section 7.1) extension MUST be omitted. * SignedData.certificates MUST be omitted. * SignedData.crls MUST be omitted. * SignedData.signerInfos MUST contain one SignerInfo: - version MUST be v3(3). - sid MUST use the subjectKeyIdentifier option. - digestAlgorithm MUST be one of the hash algorithm OIDs listed in the IANA \"Hash Algorithms\" registry, described in Section 10.2.1. - signedAttrs MUST be present and MUST contain two attributes: o a content-type attribute whose value is the same as SignedData.encapContentInfo.eContentType and o a message-digest attribute whose value is the message digest of SignedData.encapContentInfo.eContent. - signatureAlgorithm MUST be the same OID as TBSCertificate.signature. - signature MUST be from the same (root or intermediate) CA that intends to issue the corresponding certificate (see Section 3.2.1). - unsignedAttrs MUST be omitted."
    layout: "ContentInfo{SignedData{version=3, digestAlgorithms={X}, encapContentInfo{eContentType=1.3.101.78, eContent=DER TBSCertificate without the Transparency Information extension}, certificates and crls absent, signerInfos={SignerInfo{version=3, sid=subjectKeyIdentifier, digestAlgorithm=X, signedAttrs{content-type, message-digest}, signatureAlgorithm, signature, unsignedAttrs absent}}}}"
    fields:
      - name: "encoding"
        type: "DER"
        required: true
        encoding: "DER (X.690)"
        constrained_by:
          - "rfc-9162#R-0007"
      - name: "SignedData.version"
        type: "CMSVersion"
        required: true
        encoding: "v3(3)"
        constrained_by:
          - "rfc-9162#R-0008"
      - name: "SignedData.digestAlgorithms"
        type: "DigestAlgorithmIdentifiers"
        required: true
        encoding: "same as SignerInfo.digestAlgorithm"
        constrained_by:
          - "rfc-9162#R-0009"
      - name: "SignedData.encapContentInfo.eContentType"
        type: "OBJECT IDENTIFIER"
        required: true
        encoding: "1.3.101.78 (id-ct-tbsCertificate, Appendix B)"
        constrained_by:
          - "rfc-9162#R-0010"
      - name: "SignedData.encapContentInfo.eContent"
        type: "TBSCertificate"
        required: true
        encoding: "DER; identical to the TBSCertificate in the issued certificate except the Transparency Information extension (Section 7.1) is omitted"
        constrained_by:
          - "rfc-9162#R-0011"
          - "rfc-9162#R-0194"
          - "rfc-9162#R-0195"
      - name: "SignedData.certificates"
        type: "CertificateSet"
        required: false
        encoding: "absent"
        constrained_by:
          - "rfc-9162#R-0012"
      - name: "SignedData.crls"
        type: "RevocationInfoChoices"
        required: false
        encoding: "absent"
        constrained_by:
          - "rfc-9162#R-0013"
      - name: "SignedData.signerInfos"
        type: "SignerInfos"
        required: true
        encoding: "exactly one SignerInfo"
        constrained_by:
          - "rfc-9162#R-0014"
      - name: "SignerInfo.version"
        type: "CMSVersion"
        required: true
        encoding: "v3(3)"
        constrained_by:
          - "rfc-9162#R-0015"
      - name: "SignerInfo.sid"
        type: "SignerIdentifier"
        required: true
        encoding: "subjectKeyIdentifier choice"
        constrained_by:
          - "rfc-9162#R-0016"
      - name: "SignerInfo.digestAlgorithm"
        type: "DigestAlgorithmIdentifier"
        required: true
        encoding: "one of the OIDs in the IANA Hash Algorithms registry (Section 10.2.1)"
        constrained_by:
          - "rfc-9162#R-0017"
      - name: "SignerInfo.signedAttrs"
        type: "SignedAttributes"
        required: true
        encoding: "present; two attributes: content-type equal to eContentType, message-digest of eContent"
        constrained_by:
          - "rfc-9162#R-0018"
          - "rfc-9162#R-0196"
          - "rfc-9162#R-0197"
          - "rfc-9162#R-0198"
          - "rfc-9162#R-0199"
        note: "the two attribute bullets of Section 3.2 carry no keyword of their own; the MUST contain two attributes is R-0018"
      - name: "SignerInfo.signatureAlgorithm"
        type: "SignatureAlgorithmIdentifier"
        required: true
        encoding: "same OID as TBSCertificate.signature"
        constrained_by:
          - "rfc-9162#R-0019"
      - name: "SignerInfo.signature"
        type: "SignatureValue"
        required: true
        encoding: "by the same CA that intends to issue the certificate"
        constrained_by:
          - "rfc-9162#R-0020"
      - name: "SignerInfo.unsignedAttrs"
        type: "UnsignedAttributes"
        required: false
        encoding: "absent"
        constrained_by:
          - "rfc-9162#R-0021"
    constrained_by:
      - "rfc-9162#R-0006"
      - "rfc-9162#R-0193"
      - "rfc-9162#R-0479"
    notes:
      - "signedAttrs is inside the message digest (RFC 5652 Section 5.4), so SignerInfo.signature is never a valid X.509 signature over the TBSCertificate (Section 3.2)."
  - id: "MSG-18"
