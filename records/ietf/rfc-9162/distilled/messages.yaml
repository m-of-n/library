          quote: "Section 7.1.2). Since [RFC5280] requires the extnValue field (an OCTET STRING) of each X.509v3 extension to include the DER encoding of an ASN.1 value, a TransItemList MUST NOT be included directly. Instead, it MUST be wrapped inside an additional OCTET STRING, which is then put into the extnValue field: TransparencyInformationSyntax ::= OCTET STRING"
        constrained_by:
