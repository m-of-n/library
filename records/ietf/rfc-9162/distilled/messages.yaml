  - id: "MSG-19"
    name: "submit-entry request"
    locator: "§5.1"
    kind: "http-request"
    encoding: "POST, JSON body"
    summary: "Submit a certificate or precertificate with its chain."
    http:
      method: "POST"
      path: "<Base URL>/ct/v2/submit-entry"
    schema: "schema/submit-entry-request.derived.schema.json"
    errors:
      - type: "urn:ietf:params:trans:error:badSubmission"
        token: "badSubmission"
        detail_cell: "submission is neither a valid certificate nor a valid precertificate."
        constrained_by:
          - "rfc-9162#R-0032"
          - "rfc-9162#R-0033"
        constrained_by_note: "Section 4.2.1 says the log MUST reject a submission that fails its conditions but does not map a condition to an error token"
        source_lines: "1392-1393"
        detail_cell_note: "cell text joined from the wrapped table rows by script"
      - type: "urn:ietf:params:trans:error:badType"
        token: "badType"
        detail_cell: "type is neither 1 nor 2."
        constrained_by:
          - "rfc-9162#R-0033"
        source_lines: "1395-1395"
        detail_cell_note: "cell text joined from the wrapped table rows by script"
      - type: "urn:ietf:params:trans:error:badChain"
        token: "badChain"
        detail_cell: "The first element of chain is not the certifier of the submission, or the second element does not certify the first, etc."
        constrained_by:
          - "rfc-9162#R-0033"
        source_lines: "1397-1399"
        detail_cell_note: "cell text joined from the wrapped table rows by script"
      - type: "urn:ietf:params:trans:error:badCertificate"
        token: "badCertificate"
        detail_cell: "One or more certificates in chain are not valid (e.g., not properly encoded)."
        constrained_by:
          - "rfc-9162#R-0070"
          - "rfc-9162#R-0071"
        source_lines: "1401-1402"
        detail_cell_note: "cell text joined from the wrapped table rows by script"
      - type: "urn:ietf:params:trans:error:unknownAnchor"
        token: "unknownAnchor"
        detail_cell: "The last element of chain (or, if chain is an empty array, the submission) is not, nor is it certified by, an accepted trust anchor."
        constrained_by:
          - "rfc-9162#R-0072"
        source_lines: "1404-1406"
        detail_cell_note: "cell text joined from the wrapped table rows by script"
      - type: "urn:ietf:params:trans:error:shutdown"
        token: "shutdown"
        detail_cell: "The log is no longer accepting submissions."
        constrained_by:
          - "rfc-9162#R-0060"
        constrained_by_note: "R-0060 is the lead-in of the Section 4.13 shutdown list (SHOULD); its second bullet says the code shutdown should be returned"
        source_lines: "1408-1408"
        detail_cell_note: "cell text joined from the wrapped table rows by script"
      - type: "urn:ietf:params:trans:error:malformed"
        token: "malformed"
        detail_cell: "The request could not be parsed."
        source_lines: "1334-1334"
        endpoints: "all"
    declared:
      source_lines: "1356"
      quote: "POST <Base URL>/ct/v2/submit-entry"
    fields:
      - name: "submission"
        type: "string (base64)"
        required: true
        encoding: "JSON string, RFC 4648 Section 4"
        declared:
          source_lines: "1359"
          quote: "submission: The base64-encoded certificate or precertificate."
        constrained_by:
          - "rfc-9162#R-0033"
          - "rfc-9162#R-0229"
          - "rfc-9162#R-0032"
          - "rfc-9162#R-0036"
          - "rfc-9162#R-0302"
        note: "R-0036: a precertificate submission MUST conform to Section 3.2 (MSG-17)"
      - name: "type"
        type: "integer"
        required: true
        encoding: "JSON number: 1 for x509_entry_v2, 2 for precert_entry_v2"
        declared:
          source_lines: "1361-1363"
          quote: "type: The VersionedTransType integer value that indicates the type of the submission: 1 for x509_entry_v2 or 2 for precert_entry_v2."
        constrained_by:
          - "rfc-9162#R-0033"
          - "rfc-9162#R-0229"
          - "rfc-9162#R-0303"
        note: "SD-01: the TransItem enum value is 0x0100/0x0101; this input is 1/2"
      - name: "chain"
        type: "array of string (base64)"
        required: true
        encoding: "JSON array of zero or more base64 CA certificates; element 0 certifies the submission, element n+1 certifies element n; the last element (or the submission) is certified by an accepted trust anchor"
        declared:
          source_lines: "1365-1370"
          quote: "chain: An array of zero or more JSON strings, each of which is a base64-encoded CA certificate. The first element is the certifier of the submission, the second certifies the first, etc. The last element of chain (or, if chain is an empty array, the submission) is certified by an accepted trust anchor."
        constrained_by:
          - "rfc-9162#R-0033"
          - "rfc-9162#R-0229"
          - "rfc-9162#R-0002"
          - "rfc-9162#R-0034"
          - "rfc-9162#R-0035"
          - "rfc-9162#R-0003"
          - "rfc-9162#R-0304"
          - "rfc-9162#R-0230"
          - "rfc-9162#R-0231"
          - "rfc-9162#R-0232"
        note: "the trust anchor MAY be omitted (R-0003); R-0002 requires all certificates needed to verify the chain up to an accepted trust anchor; R-0034 and R-0035 are the Section 4.2.1 acceptance conditions on each chain certificate (CA flag or keyCertSign, pathLenConstraint)"
    constrained_by:
      - "rfc-9162#R-0061"
      - "rfc-9162#R-0062"
      - "rfc-9162#R-0030"
      - "rfc-9162#R-0032"
      - "rfc-9162#R-0301"
      - "rfc-9162#R-0192"
      - "rfc-9162#R-0286"
      - "rfc-9162#R-0287"
      - "rfc-9162#R-0308"
    notes:
      - "A log that detects bad encoding in an otherwise valid chain MUST either log the certificate (and then issue an SCT) or return badCertificate (R-0070, R-0071). If submission is an accepted trust anchor whose certifier is neither an accepted anchor nor chain[0], the log MUST return unknownAnchor (R-0072)."
  - id: "MSG-20"
    name: "submit-entry response"
    locator: "§5.1"
    kind: "http-response"
    encoding: "JSON body"
    summary: "The SCT and, when the entry is already in the tree, the STH and inclusion proof."
    schema: "schema/submit-entry-response.derived.schema.json"
    declared:
      source_lines: "1372"
      quote: "Outputs:"
    fields:
      - name: "sct"
        type: "string (base64 TransItem)"
        required: true
        encoding: "base64 of a TransItem of type x509_sct_v2 or precert_sct_v2"
        declared:
          source_lines: "1373-1375"
          quote: "sct: A base64-encoded TransItem of type x509_sct_v2 or precert_sct_v2, signed by this log, that corresponds to the submission."
        constrained_by:
          - "rfc-9162#R-0069"
          - "rfc-9162#R-0071"
          - "rfc-9162#R-0204"
          - "rfc-9162#R-0305"
        note: "a v2 client MUST NOT treat an SCT whose version is not v2 as an error (R-0069); a log that logs a certificate despite bad encoding MUST issue an SCT (R-0071); a resubmission of a valid submission SHOULD get the same SCT as before (R-0204)"
      - name: "sth"
        type: "string (base64 TransItem)"
