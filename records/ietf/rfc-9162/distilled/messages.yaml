record: "rfc-9162"
reviewed_by: ""
source_digest: "a0e432ce7580c99fcc8faf0cf3f6191f9ce6b4864f949158e020d4ecb295081f"
source: ".cache/rfc-9162.txt (RFC 9162, Certificate Transparency Version 2.0, December 2021). Line numbers count in that file; quotations are checked against it with bin/check-quotes."
extracted: "2026-11-07"
extracted_by: "FX-1 pass 1 (extract), schema+examples+messages agent, from the source only"
applicability: "RFC 9162 defines wire structures in the TLS presentation language (Sections 4.4-4.12, 6.3), a JSON-over-HTTPS API (Section 5), two TLS-extension carriers (Section 6), X.509v3 and OCSP extension carriers (Section 7.1), a CMS precertificate profile (Section 3.2), and registries (Section 10). It also uses structures it does not define: TLS 1.2/1.3 messages (RFC 5246, RFC 8446), OCSP (RFC 6960), CMS (RFC 5652), the problem details object (RFC 7807), TBSCertificate and SubjectPublicKeyInfo (RFC 5280). Out of scope as not defined here: the TLS record and handshake framing around the extension, the OCSP SingleResponse, and the JSON.Metadata log list format."
note: "Conventions. (1) declared and described are {source_lines, quote} pairs written by script from the cached source (lib join of lines to text), never typed; a quote is the whole of its lines. (2) constrained_by lists rfc-9162#R-NNNN ids resolved by script from distilled/requirements.yaml: an id is selected by section locator plus a distinctive phrase of the requirement text, and the build raises when a selector matches zero or several requirements; every resolved pair was then read. Where constrained_by is empty the entry says why in constrained_by_note. (3) A field marked inferred states its reason. (4) Widths of length prefixes and enumerations are RFC 8446 Section 3 applied to the declarations (ENC-02 to ENC-04), not statements of RFC 9162, and are marked inferred there. (5) SD-nn marks a defect or tension in the source, copied as printed and never repaired; they are collected in source_defects and joined to the other artifacts' ids by the table at the end of the Source defects section of normative.md. (6) required is a boolean for structure fields; for JSON members required_when says what makes an optional member appear. (7) Error detail cells are assembled from wrapped table rows by script (a table cell is not contiguous in the .txt, so it is not a quote: item). (8) Hex serializations of every structure are in examples/wire-vectors.derived.json; reproduce them with examples/reproduce.py. (9) Pass 3 joined every field name a requirement's field: value uses against this file and schema/ (349 identifier tokens over 491 requirements, 560 clause-leading words): all are found except the algorithm variables of Section 2.1 (D_m, SUBPROOF, first_hash, second_hash, fn, sn, fr, sr, merge_count, stack, m), which are inputs and registers of the algorithms modelled in state-machine.yaml and examples/reproduce.py and not message members, and basicConstraints.cA, basicConstraints.pathLenConstraint, keyUsage.keyCertSign (R-0034, R-0035, R-0231, R-0232), which are RFC 5280 extensions of the certificates in the submit-entry chain, wired under the chain input here and not defined by this document; CertificateEntry (R-0486, a TLS 1.3 structure of RFC 8446) and context (R-0245, what a registration document must specify, not a wire member)."
encoding_rules:
  - id: "ENC-01"
    rule: "Data structures follow the TLS presentation language of RFC 8446 Section 3"
    locator: "§1.2"
    quote_of_source:
      source_lines: "231-232"
      quote: "Data structures are defined and encoded according to the conventions laid out in Section 3 of [RFC8446]."
    constrained_by:
      - "rfc-9162#R-0126"
    detail: "This document does not restate the language. The width rules in ENC-02 to ENC-05 are RFC 8446 Section 3 applied to the declarations here; they are not stated in RFC 9162 and are marked inferred where used."
    inferred: true
    inferred_reason: "RFC 8446 Section 3 is outside this document; the widths are derived from it"
  - id: "ENC-02"
    rule: "A vector <lo..hi> is a length prefix then that many OCTETS; the prefix is the fewest octets that hold hi"
    locator: "§4.4-§4.12, §6.3"
    table:
      - declaration: "LogID<2..127>"
        prefix_octets: 1
      - declaration: "NodeHash<32..2^8-1>"
        prefix_octets: 1
      - declaration: "issuer_key_hash<32..2^8-1>"
        prefix_octets: 1
      - declaration: "sct_extensions / sth_extensions<0..2^16-1>"
        prefix_octets: 2
      - declaration: "extension_data<0..2^16-1>"
        prefix_octets: 2
      - declaration: "signature<1..2^16-1>"
        prefix_octets: 2
      - declaration: "consistency_path / inclusion_path<0..2^16-1>"
        prefix_octets: 2
      - declaration: "SerializedTransItem<1..2^16-1>"
        prefix_octets: 2
      - declaration: "trans_item_list<1..2^16-1>"
        prefix_octets: 2
      - declaration: "TBSCertificate<1..2^24-1>"
        prefix_octets: 3
    detail: "The prefix counts octets, never elements. A vector of structures (Extension, NodeHash, SerializedTransItem) carries the total octet length of all its elements. The length must lie in the declared range, so an empty vector is legal only where lo is 0."
    quote_of_source:
      source_lines: "955-959"
      quote: "Note that the ASN.1 length and the opaque vector length are identical in size (1 byte) and value, so the full DER encoding (including the tag and length) of the OID can be reproduced simply by prepending an OBJECT IDENTIFIER tag (0x06) to the opaque vector length and contents."
    inferred: true
    inferred_reason: "prefix widths derive from the declared maxima under RFC 8446 Section 3.4; the source states the 1-octet width only for LogID (Section 4.4)"
  - id: "ENC-03"
    rule: "NodeHash is itself a vector: every hash in a path or in root_hash carries its own 1-octet length prefix"
    locator: "§4.9, §4.11, §4.12"
    detail: "consistency_path and inclusion_path are vectors of NodeHash, and NodeHash is opaque NodeHash<32..2^8-1>, so each element is length octet + HASH_SIZE octets (33 octets for SHA-256) inside the 2-octet outer length. root_hash is one NodeHash: 0x20 then 32 octets. The source never shows a serialization; examples/wire-vectors.derived.json does."
    inferred: true
    inferred_reason: "literal reading of the declarations; the source prints no serialized example"
  - id: "ENC-04"
    rule: "Enumerations are 2 octets; a TransItem body follows its type with no length prefix"
    locator: "§4.5, §4.6"
    detail: "VersionedTransType has maximum (0xFFFF) and ExtensionType reserved(65535), so each is 2 octets, big-endian. A TransItem is versioned_type (2) then the selected structure with no length: only TransItemList framing (SerializedTransItem) makes items skippable (Section 6.3)."
    inferred: true
    inferred_reason: "enum width follows from the maximum value under RFC 8446 Section 3.5"
  - id: "ENC-05"
    rule: "uint64 timestamp: milliseconds since the Unix Epoch, ignoring leap seconds, network byte order"
    locator: "§4.7"
    quote_of_source:
      source_lines: "1057-1062"
      quote: "timestamp is the date and time at which the certificate or precertificate was accepted by the log, in the form of a 64-bit unsigned number of milliseconds elapsed since the Unix Epoch (1 January 1970 00:00:00 UTC -- see [UNIXTIME]), ignoring leap seconds, in network byte order. Note that the leaves of a log's Merkle Tree are not required to be in strict chronological order."
  - id: "ENC-06"
    rule: "HTTPS GET/POST; POST body and every response body are JSON; GET parameters are order-independent application/x-www-form-urlencoded key/value pairs; binary data is base64 (RFC 4648 Section 4)"
    locator: "§5"
    quote_of_source:
      source_lines: "1263-1269"
      quote: "Messages are sent as HTTPS GET or POST requests. Parameters for POSTs and all responses are encoded as JavaScript Object Notation (JSON) objects [RFC8259]. Parameters for GETs are encoded as order-independent key/value URL parameters, using the \"application/x-www-form-urlencoded\" format described in the \"HTML 4.01 Specification\" [HTML401]. Binary data is base64 encoded according to Section 4 of [RFC4648], as specified in the individual messages."
    constrained_by:
      - "rfc-9162#R-0288"
      - "rfc-9162#R-0289"
      - "rfc-9162#R-0291"
      - "rfc-9162#R-0471"
  - id: "ENC-07"
    rule: "A LogID is the DER content octets of the log OID, without the ASN.1 tag and length"
    locator: "§4.4"
    quote_of_source:
      source_lines: "950-953"
      quote: "means.) Various data structures include the DER encoding of this OID, excluding the ASN.1 tag and length bytes, in an opaque vector: opaque LogID<2..127>;"
    detail: "OID 1.3.101.80.0 encodes as 2b655000; LogID = 04 2b655000; prepending 0x06 gives the DER OBJECT IDENTIFIER 06 04 2b655000 (Section 4.4)."
source_defects:
  - id: "SD-01"
    locator: "§5.1 vs §4.5"
    summary: "submit-entry type is the \"VersionedTransType integer value\" 1 or 2, but VersionedTransType gives x509_entry_v2 0x0100 and precert_entry_v2 0x0101; badType says neither 1 nor 2"
    quote_a:
      source_lines: "1361-1363"
      quote: "type: The VersionedTransType integer value that indicates the type of the submission: 1 for x509_entry_v2 or 2 for precert_entry_v2."
    quote_b:
      source_lines: "972"
      quote: "x509_entry_v2(0x0100), precert_entry_v2(0x0101),"
  - id: "SD-02"
    locator: "§5.3 vs §2.1.4.2"
    summary: "an empty consistency proof is required when first and second are equal, but the verification algorithm fails on an empty path and is stated for 0 < first < second"
    quote_a:
      source_lines: "1468-1470"
      quote: "match the second input. If first and second are equal and correspond to a known STH, the returned consistency proof MUST be empty (a consistency_path array with zero elements)."
    quote_b:
      source_lines: "541"
      quote: "1. If consistency_path is an empty array, stop and fail the proof"
  - id: "SD-03"
    locator: "§6.3 vs §6.5"
    summary: "TransItemList cannot be empty (vector minimum 1) but the server MAY send an empty array"
    quote_a:
      source_lines: "1799"
      quote: "SerializedTransItem trans_item_list<1..2^16-1>;"
    quote_b:
      source_lines: "1837"
      quote: "the extension_data element but MAY send it with an empty array."
  - id: "SD-04"
    locator: "§5.6"
    summary: "sth is listed inside the entries objects but the log must return the latest STH in any case, including for an empty entries array"
    quote_a:
      source_lines: "1627"
      quote: "sth: A base64-encoded TransItem of type signed_tree_head_v2,"
    quote_b:
      source_lines: "1668"
      quote: "In any case, the log server MUST return the latest STH it knows"
  - id: "SD-05"
    locator: "§5.7"
    summary: "max_chain_length is \"in decimal\"; a JSON number or a string is not said"
    quote_a:
      source_lines: "1698"
      quote: "max_chain_length: If the server has chosen to limit the length of"
  - id: "SD-06"
    locator: "§5.4, §10.2.6"
    summary: "treeSizeUnknown detail speaks of hash where the unknown parameter is tree_size (identical in Table 4 and Table 18)"
    quote_a:
      source_lines: "1535-1537"
      quote: "| treeSizeUnknown | hash is before the latest known STH | | but is not from an existing STH. | +-----------------+-------------------------------------+"
  - id: "SD-07"
    locator: "§7.1 vs Appendix B"
    summary: "the text says the extension SHOULD be noncritical, the ASN.1 module fixes CRITICALITY { FALSE }"
    quote_a:
      source_lines: "1856"
      quote: "structures in a TransItemList. This extension MAY be included in"
    quote_b:
      source_lines: "2896"
      quote: "CRITICALITY { FALSE } }"
  - id: "SD-08"
    locator: "Appendix B (skeleton)"
    summary: "Not a source defect (the source is right): bin/fx1-skeleton headed the ASN.1 module fixture \"Appendix A\"; the module is Appendix B (Appendix A is the v1/v2 coexistence text). Listed here because this lane found it. Corrected in the schema fixture header and in the code-block list of normative.md (pass 1); the tool itself is not fixed."
  - id: "SD-09"
    locator: "§4.6 vs §10.2.4"
    summary: "ExtensionType 65535 is named reserved in the enum, while Table 14 assigns 0xF000-0xFFFF (65535 included) to Private Use; the enum value may only fix the two-octet width"
    quote_a:
      source_lines: "1019-1021"
      quote: "enum { reserved(65535) } ExtensionType;"
    quote_b:
      source_lines: "2365-2365"
      quote: "| 0xF000-0xFFFF | Private Use |"
  - id: "SD-10"
    locator: "Appendix B vs §10.3"
    summary: "the ASN.1 module header carries a comment asking for the id-mod-public-notary-v2 OID to be filled in from above instead of the OID, although §10.3 assigns 102"
    quote_a:
      source_lines: "2852-2855"
      quote: "CertificateTransparencyV2Module-2021 -- { id-mod-public-notary-v2 from above, in iso(1) identified-organization(3) ... form }"
    quote_b:
      source_lines: "2545-2545"
      quote: "| 102 | id-mod-public-notary-v2 | RFC 9162 |"
  - id: "SD-11"
    locator: "§4.1, §5.1, §5.7"
    summary: "what a chain length counts (the submission, the trust anchor, CA certificates only) is not said, though the Maximum Chain Length parameter and max_chain_length bound it while the chain input holds CA certificates only"
    quote_a:
      source_lines: "841-842"
      quote: "Maximum Chain Length: The longest certificate chain submission the log is willing to accept, if the log imposes any limit."
    quote_b:
      source_lines: "1365-1366"
      quote: "chain: An array of zero or more JSON strings, each of which is a base64-encoded CA certificate."
messages:
  - id: "MSG-01"
    name: "LogID"
    locator: "§4.4"
    kind: "tls-vector"
    encoding: "TLS opaque vector <2..127>, 1-octet length prefix"
    summary: "Identifies a log by its OID: the DER content octets of the OID, no tag, no length."
    declared:
      source_lines: "953"
      quote: "opaque LogID<2..127>;"
    layout: "[len:1][oid-content:len]; len in 2..127. Full DER OID = 0x06 || vector (the ASN.1 length equals the vector length, one octet)."
    constrained_by:
      - "rfc-9162#R-0041"
      - "rfc-9162#R-0042"
      - "rfc-9162#R-0043"
      - "rfc-9162#R-0237"
      - "rfc-9162#R-0238"
    notes:
      - "Registered OIDs: 1.3.101.8192-1.3.101.16383 and 1.3.101.80.* (Section 10.2.5, registry Log IDs); a log may use any OID."
      - "The upper bound 127 in the declaration and the sentence limiting the DER content to 127 octets state the same bound twice (R-0043)."
  - id: "MSG-02"
    name: "VersionedTransType"
    locator: "§4.5"
    kind: "tls-enum"
    encoding: "TLS enum, 2 octets big-endian (maximum 0xFFFF)"
    summary: "Type and earliest conforming protocol version of a TransItem. Combines the v1 Version, LogEntryType, SignatureType and MerkleLeafType."
    declared:
      source_lines: "971-982"
      quote: "enum { x509_entry_v2(0x0100), precert_entry_v2(0x0101), x509_sct_v2(0x0102), precert_sct_v2(0x0103), signed_tree_head_v2(0x0104), consistency_proof_v2(0x0105), inclusion_proof_v2(0x0106), /* Reserved Code Points */ reserved_rfc6962(0x0000..0x00FF), reserved_experimentaluse(0xE000..0xEFFF), reserved_privateuse(0xF000..0xFFFF), (0xFFFF) } VersionedTransType;"
    layout: "uint16. Assigned 0x0100-0x0106; reserved 0x0000-0x00FF (RFC 6962), 0xE000-0xEFFF experimental use, 0xF000-0xFFFF private use."
    fields:
      - name: "x509_entry_v2"
        value: "0x0100"
        value_decimal: 256
        data_structure: "TimestampedCertificateEntryDataV2"
        defined_in: "§4.7"
      - name: "precert_entry_v2"
        value: "0x0101"
        value_decimal: 257
        data_structure: "TimestampedCertificateEntryDataV2"
        defined_in: "§4.7"
      - name: "x509_sct_v2"
        value: "0x0102"
        value_decimal: 258
        data_structure: "SignedCertificateTimestampDataV2"
        defined_in: "§4.8"
      - name: "precert_sct_v2"
        value: "0x0103"
        value_decimal: 259
        data_structure: "SignedCertificateTimestampDataV2"
        defined_in: "§4.8"
      - name: "signed_tree_head_v2"
        value: "0x0104"
        value_decimal: 260
        data_structure: "SignedTreeHeadDataV2"
        defined_in: "§4.10"
      - name: "consistency_proof_v2"
        value: "0x0105"
        value_decimal: 261
        data_structure: "ConsistencyProofDataV2"
        defined_in: "§4.11"
      - name: "inclusion_proof_v2"
        value: "0x0106"
        value_decimal: 262
        data_structure: "InclusionProofDataV2"
        defined_in: "§4.12"
      - name: "reserved_rfc6962"
        range: "0x0000..0x00FF"
      - name: "reserved_experimentaluse"
        range: "0xE000..0xEFFF"
      - name: "reserved_privateuse"
        range: "0xF000..0xFFFF"
    constrained_by:
      - "rfc-9162#R-0239"
      - "rfc-9162#R-0242"
      - "rfc-9162#R-0433"
      - "rfc-9162#R-0435"
    constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    notes:
      - "No requirement with a BCP 14 keyword binds the enum itself. The registry (Section 10.2.3, Specification Required for 0x0100-0xDFFF) is in registries below."
      - "SOURCE DEFECT SD-01: Section 5.1 calls the submit-entry type input the \"VersionedTransType integer value ... 1 for x509_entry_v2 or 2 for precert_entry_v2\", but this enum gives them 0x0100 (256) and 0x0101 (257). The badType error detail also says \"neither 1 nor 2\". The two sections cannot both be literal; the wire (HTTP) value is 1 or 2 and the TransItem value is 0x0100 or 0x0101 (Section 4.7 says the TransItem type corresponds to the type parameter)."
  - id: "MSG-03"
    name: "TransItem"
    locator: "§4.5"
    kind: "tls-struct"
    encoding: "TLS struct with a select; no length prefix on data"
    summary: "Common envelope for every CT artifact: a 2-octet type then the structure it selects."
    variants:
      - versioned_type: "x509_entry_v2"
        value: "0x0100"
        data: "TimestampedCertificateEntryDataV2"
      - versioned_type: "precert_entry_v2"
        value: "0x0101"
        data: "TimestampedCertificateEntryDataV2"
      - versioned_type: "x509_sct_v2"
        value: "0x0102"
        data: "SignedCertificateTimestampDataV2"
      - versioned_type: "precert_sct_v2"
        value: "0x0103"
        data: "SignedCertificateTimestampDataV2"
      - versioned_type: "signed_tree_head_v2"
        value: "0x0104"
        data: "SignedTreeHeadDataV2"
      - versioned_type: "consistency_proof_v2"
        value: "0x0105"
        data: "ConsistencyProofDataV2"
      - versioned_type: "inclusion_proof_v2"
        value: "0x0106"
        data: "InclusionProofDataV2"
    declared:
      source_lines: "984-995"
      quote: "struct { VersionedTransType versioned_type; select (versioned_type) { case x509_entry_v2: TimestampedCertificateEntryDataV2; case precert_entry_v2: TimestampedCertificateEntryDataV2; case x509_sct_v2: SignedCertificateTimestampDataV2; case precert_sct_v2: SignedCertificateTimestampDataV2; case signed_tree_head_v2: SignedTreeHeadDataV2; case consistency_proof_v2: ConsistencyProofDataV2; case inclusion_proof_v2: InclusionProofDataV2; } data; } TransItem;"
    layout: "[versioned_type:2][data: exactly the structure selected by versioned_type, no length]. A reader must know every selectable structure to find the end of an item; hence TransItemList wraps each item in a SerializedTransItem (Section 6.3)."
    fields:
      - name: "versioned_type"
        type: "VersionedTransType"
        required: true
        encoding: "uint16, big-endian"
        declared:
          source_lines: "985"
          quote: "VersionedTransType versioned_type;"
        described:
          source_lines: "997-1000"
          quote: "versioned_type is a value from the IANA registry in Section 10.2.3 that identifies the type of the encapsulated data structure and the earliest version of this protocol to which it conforms. This document is v2."
        constrained_by:
          - "rfc-9162#R-0240"
          - "rfc-9162#R-0433"
        constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
      - name: "data"
        type: "select(versioned_type)"
        required: true
        encoding: "the structure of the selected case, no length prefix"
        declared:
          source_lines: "986-994"
          quote: "select (versioned_type) { case x509_entry_v2: TimestampedCertificateEntryDataV2; case precert_entry_v2: TimestampedCertificateEntryDataV2; case x509_sct_v2: SignedCertificateTimestampDataV2; case precert_sct_v2: SignedCertificateTimestampDataV2; case signed_tree_head_v2: SignedTreeHeadDataV2; case consistency_proof_v2: ConsistencyProofDataV2; case inclusion_proof_v2: InclusionProofDataV2; } data;"
        described:
          source_lines: "1002-1004"
          quote: "data is the encapsulated data structure. The various structures named with the DataV2 suffix are defined in later sections of this document."
        constrained_by:
          - "rfc-9162#R-0241"
        constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    constrained_by:
      - "rfc-9162#R-0239"
    constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    notes:
      - "An implementation that does not recognise a versioned_type cannot parse past it; Section 5.6 therefore says a v2 client MUST NOT construe an unrecognised TransItem type as an error (R-0079)."
      - "Future versions may reuse VersionedTransType values only if the data structures are unchanged (Section 4.5, last paragraph)."
  - id: "MSG-04"
    name: "ExtensionType"
    locator: "§4.6"
    kind: "tls-enum"
    encoding: "TLS enum, 2 octets (maximum 65535)"
    summary: "Type of a log artifact extension. This document defines no extension; the one declared value is reserved(65535)."
    declared:
      source_lines: "1019-1021"
      quote: "enum { reserved(65535) } ExtensionType;"
    layout: "uint16, big-endian. Registry \"Log Artifact Extensions\" (Section 10.2.4): 0x0000-0xDFFF Specification Required, 0xE000-0xEFFF experimental, 0xF000-0xFFFF private."
    constrained_by:
      - "rfc-9162#R-0243"
      - "rfc-9162#R-0245"
      - "rfc-9162#R-0438"
    constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    notes:
      - "\"This document does not define any extensions\" (Section 4.6); a registration must say whether the extension is for SCT, STH or both (registry Use column)."
  - id: "MSG-05"
    name: "Extension"
    locator: "§4.6"
    kind: "tls-struct"
    encoding: "TLS struct"
    summary: "Generic extension carried in sct_extensions and sth_extensions. Interpretation of extension_data is determined solely by extension_type."
    declared:
      source_lines: "1023-1026"
      quote: "struct { ExtensionType extension_type; opaque extension_data<0..2^16-1>; } Extension;"
    layout: "[extension_type:2][extension_data_len:2][extension_data:len]; len in 0..65535. In a vector the elements are concatenated and the vector carries the total octet length (2 octets)."
    fields:
      - name: "extension_type"
        type: "ExtensionType"
        required: true
        encoding: "uint16"
        declared:
          source_lines: "1024"
          quote: "ExtensionType extension_type;"
        described:
          source_lines: "1028-1031"
          quote: "The Extension structure provides a generic extensibility for log artifacts, including SCTs (Section 4.8) and STHs (Section 4.10). The interpretation of the extension_data field is determined solely by the value of the extension_type field."
        constrained_by: []
        constrained_by_note: "no requirement with a BCP 14 keyword names this field"
      - name: "extension_data"
        type: "opaque<0..2^16-1>"
        required: true
        encoding: "2-octet length prefix then octets"
        declared:
          source_lines: "1025"
          quote: "opaque extension_data<0..2^16-1>;"
        constrained_by:
          - "rfc-9162#R-0244"
        constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    constrained_by:
      - "rfc-9162#R-0243"
    constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    notes:
      - "Ordering and uniqueness of extensions inside a vector are required by Section 4.8 (SCT) and Section 4.9 (STH): see sct_extensions and sth_extensions."
  - id: "MSG-06"
    name: "TBSCertificate"
    locator: "§4.7"
    kind: "tls-vector"
    encoding: "TLS opaque vector <1..2^24-1>, 3-octet length prefix"
    summary: "The DER-encoded TBSCertificate from the submission, carried as opaque octets."
    declared:
      source_lines: "1048"
      quote: "opaque TBSCertificate<1..2^24-1>;"
    layout: "[len:3][DER TBSCertificate:len]; len in 1..16777215."
    constrained_by:
      - "rfc-9162#R-0248"
    constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
    notes:
      - "For a precertificate the TBSCertificate is the one in the CMS eContent (Section 3.2); a verifier reconstructs it from the certificate (Section 8.1.2)."
  - id: "MSG-07"
    name: "TimestampedCertificateEntryDataV2"
    locator: "§4.7"
    kind: "tls-struct"
    encoding: "TLS struct; body of a TransItem of type x509_entry_v2 or precert_entry_v2"
    summary: "The log entry: what is hashed into the Merkle Tree (as part of a TransItem) and what an SCT signature covers."
    declared:
      source_lines: "1050-1055"
      quote: "struct { uint64 timestamp; opaque issuer_key_hash<32..2^8-1>; TBSCertificate tbs_certificate; Extension sct_extensions<0..2^16-1>; } TimestampedCertificateEntryDataV2;"
    layout: "[timestamp:8][issuer_key_hash_len:1][issuer_key_hash:len][tbs_len:3][tbs_certificate:len][sct_extensions_len:2][sct_extensions:len]. The enclosing TransItem adds [versioned_type:2] in front; that whole TransItem is the Merkle leaf input."
    fields:
      - name: "timestamp"
        type: "uint64"
        required: true
        encoding: "8 octets, network byte order, milliseconds since the Unix Epoch ignoring leap seconds"
        declared:
          source_lines: "1051"
          quote: "uint64 timestamp;"
        described:
          source_lines: "1057-1062"
          quote: "timestamp is the date and time at which the certificate or precertificate was accepted by the log, in the form of a 64-bit unsigned number of milliseconds elapsed since the Unix Epoch (1 January 1970 00:00:00 UTC -- see [UNIXTIME]), ignoring leap seconds, in network byte order. Note that the leaves of a log's Merkle Tree are not required to be in strict chronological order."
        constrained_by:
          - "rfc-9162#R-0249"
          - "rfc-9162#R-0250"
        constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
      - name: "issuer_key_hash"
        type: "opaque<32..2^8-1>"
        required: true
        encoding: "1-octet length prefix; length MUST equal HASH_SIZE"
        declared:
          source_lines: "1052"
          quote: "opaque issuer_key_hash<32..2^8-1>;"
        described:
          source_lines: "1064-1071"
          quote: "issuer_key_hash is the HASH of the public key of the CA that issued the certificate or precertificate, calculated over the DER encoding of the key represented as SubjectPublicKeyInfo [RFC5280]. This is needed to bind the CA to the certificate or precertificate, making it impossible for the corresponding SCT to be valid for any other certificate or precertificate whose TBSCertificate matches tbs_certificate. The length of the issuer_key_hash MUST match HASH_SIZE."
        constrained_by:
          - "rfc-9162#R-0044"
          - "rfc-9162#R-0251"
          - "rfc-9162#R-0477"
        note: "HASH of the DER SubjectPublicKeyInfo of the issuing CA key (RFC 5280). The declared minimum 32 is below HASH_SIZE for none of the registered algorithms (SHA-256 only)."
      - name: "tbs_certificate"
        type: "TBSCertificate"
        required: true
        encoding: "3-octet length prefix, DER"
        declared:
          source_lines: "1053"
          quote: "TBSCertificate tbs_certificate;"
        described:
          source_lines: "1073-1076"
          quote: "tbs_certificate is the DER-encoded TBSCertificate from the submission. (Note that a precertificate's TBSCertificate can be reconstructed from the corresponding certificate, as described in Section 8.1.2)."
        constrained_by:
          - "rfc-9162#R-0252"
        constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
      - name: "sct_extensions"
        type: "Extension<0..2^16-1>"
        required: true
        encoding: "2-octet total length, then Extension elements"
        declared:
          source_lines: "1054"
          quote: "Extension sct_extensions<0..2^16-1>;"
        described:
          source_lines: "1078-1079"
          quote: "sct_extensions is byte-for-byte identical to the SCT extensions of the corresponding SCT."
        constrained_by:
          - "rfc-9162#R-0253"
        constrained_by_note: "Must be byte-for-byte the SCT extensions (Section 4.7, lowercase \"is\": no BCP 14 keyword, but a stated requirement with verb none, R-0253, wired above by pass 2). The order and uniqueness rules of Section 4.8 (R-0045, R-0046) bind the SCT copy and so, by identity, this one."
        inferred: true
        inferred_reason: "the extension order rule is stated for the SCT vector; applying it here follows from the byte-for-byte identity sentence"
    constrained_by:
      - "rfc-9162#R-0022"
      - "rfc-9162#R-0023"
      - "rfc-9162#R-0038"
      - "rfc-9162#R-0039"
      - "rfc-9162#R-0246"
      - "rfc-9162#R-0247"
      - "rfc-9162#R-0248"
      - "rfc-9162#R-0254"
      - "rfc-9162#R-0234"
      - "rfc-9162#R-0236"
      - "rfc-9162#R-0205"
    notes:
      - "R-0038 and R-0039: the log stores the entire verification chain (the entry, intermediates and the trust anchor used) even though the TransItem does not carry it; a log may store entries in any format but must keep timestamp and sct_extensions (Section 4.3)."
      - "Leaf hash = HASH(0x00 || TransItem), HASH the log hash algorithm (Section 4.7). The type of the TransItem corresponds to the type input of submit-entry (Section 4.7, last sentence)."
  - id: "MSG-08"
    name: "SignedCertificateTimestampDataV2"
    locator: "§4.8"
    kind: "tls-struct"
    encoding: "TLS struct; body of a TransItem of type x509_sct_v2 or precert_sct_v2"
    summary: "The SCT: the log promise to merge a submission within the MMD."
    declared:
      source_lines: "1090-1095"
      quote: "struct { LogID log_id; uint64 timestamp; Extension sct_extensions<0..2^16-1>; opaque signature<1..2^16-1>; } SignedCertificateTimestampDataV2;"
    layout: "[log_id_len:1][log_id:len][timestamp:8][sct_extensions_len:2][sct_extensions:len][signature_len:2][signature:len]. Complete SCT = [versioned_type:2] + this."
    fields:
      - name: "log_id"
        type: "LogID"
        required: true
        encoding: "1-octet length prefix"
        declared:
          source_lines: "1091"
          quote: "LogID log_id;"
        described:
          source_lines: "1097-1098"
          quote: "log_id is this log's unique ID, encoded in an opaque vector, as described in Section 4.4."
        constrained_by:
          - "rfc-9162#R-0257"
        constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
      - name: "timestamp"
        type: "uint64"
        required: true
        encoding: "8 octets, network byte order"
        declared:
          source_lines: "1092"
          quote: "uint64 timestamp;"
        described:
          source_lines: "1100-1101"
          quote: "timestamp is equal to the timestamp from the corresponding TimestampedCertificateEntryDataV2 structure."
        constrained_by:
          - "rfc-9162#R-0258"
        constrained_by_note: "no BCP 14 keyword binds this; the keyword-less stated text (verb none) and inferred readings that do are wired above (pass 2, 2026-11-08)"
      - name: "sct_extensions"
        type: "Extension<0..2^16-1>"
        required: true
        encoding: "2-octet total length then Extension elements; unique, ascending by extension_type"
        declared:
          source_lines: "1093"
          quote: "Extension sct_extensions<0..2^16-1>;"
        described:
          source_lines: "1103-1110"
          quote: "sct_extensions is a vector of 0 or more SCT extensions. This vector MUST NOT include more than one extension with the same extension_type. The extensions in the vector MUST be ordered by the value of the extension_type field, smallest value first. All SCT extensions are similar to noncritical X.509v3 extensions (i.e., the mustUnderstand field is not set), and a recipient SHOULD ignore any extension it does not understand. Furthermore, an implementation MAY choose to ignore any extension(s) that it does understand."
        constrained_by:
          - "rfc-9162#R-0045"
          - "rfc-9162#R-0046"
          - "rfc-9162#R-0047"
          - "rfc-9162#R-0048"
          - "rfc-9162#R-0489"
        note: "R-0047 and R-0048 are about a recipient, not about the vector content"
      - name: "signature"
        type: "opaque<1..2^16-1>"
        required: true
        encoding: "2-octet length prefix; raw signature octets with no algorithm identifier"
        declared:
          source_lines: "1094"
          quote: "opaque signature<1..2^16-1>;"
        described:
          source_lines: "1112-1115"
          quote: "signature is computed over a TransItem structure of type x509_entry_v2 or precert_entry_v2 (see Section 4.7) using the signature algorithm declared in the log's parameters (see Section 4.1)."
        constrained_by:
          - "rfc-9162#R-0113"
          - "rfc-9162#R-0259"
        note: "R-0113 is the client-side validation of the SCT. The signature is over a whole TransItem of type x509_entry_v2 or precert_entry_v2 (including its 2-octet type), using the signature algorithm in the log parameters. The structure carries no algorithm field, unlike RFC 6962 DigitallySigned: the verifier takes the algorithm from the log parameters (Section 8.1.3)."
    constrained_by:
      - "rfc-9162#R-0022"
      - "rfc-9162#R-0023"
      - "rfc-9162#R-0024"
      - "rfc-9162#R-0004"
      - "rfc-9162#R-0005"
      - "rfc-9162#R-0255"
      - "rfc-9162#R-0256"
      - "rfc-9162#R-0206"
      - "rfc-9162#R-0207"
      - "rfc-9162#R-0468"
    notes:
      - "A verifier builds the signature input per Section 8.1.3 (R-0113): timestamp and sct_extensions copied from the SCT, tbs_certificate reconstructed per Section 8.1.2, issuer_key_hash computed per Section 4.7."
