# rfc-9162 state machines, FX-1 pass 1 (extract), protocol and state-machine agent. Flows are in protocol.yaml; prose in protocol.md.
record: "rfc-9162"
reviewed_by: ""
kind: "state-machine"
extracted: "2026-11-08"
extracted_by: >-
  FX-1 pass 1 (extract), protocol and state-machine agent, effort max, from the source only
source:
  file: ".cache/rfc-9162.txt"
  sha256: "a0e432ce7580c99fcc8faf0cf3f6191f9ce6b4864f949158e020d4ecb295081f"
note: >-
  Conventions. States are {name, meaning, kind}; error states carry error "yes" and are listed in
  error_states; terminal states carry terminal "yes". A transition's trigger is a messages.yaml
  entry name (trigger_kind message) or an event defined under events (trigger_kind event). guard
  and action are this file's notation (LSB(x) is x AND 1; x >>= 1 halves; HASH and || as §2.1.1);
  the source words are in each transition's quotes, written from .cache/rfc-9162.txt by script
  and checked by bin/check-quotes. kind stated means the source prints the transition; inferred
  means this model added it, with inferred_reason. constrained_by ids were emitted by script from
  requirements.yaml (R-0001 to R-0125 only at pass 1) and each resolved pair was read; pass 2
  (2026-11-08) added the stated keyword-less ids whose source_lines lie inside a quotation the
  transition carries, joined by line containment by script, every pair read. M01, M02 and M03 follow
  the printed algorithms step for step, including a branch the printed text makes unreachable
  (SD-11 in protocol.yaml); they were executed as printed in a scratch simulation (SHA-256, every
  tree of 1 to 64 leaves, every leaf and every prefix size; script not committed): every valid
  proof accepted, every tampered one rejected, the fn-is-0 exits taken 0 times, the empty
  equal-size proof rejected 64 of 64, and §2.1.2 left with an empty stack at tree_size 0.
events:
  - name: "verify-inclusion-requested"
    meaning: "A client starts §2.1.3.2 with hash, leaf_index, tree_size, root_hash and inclusion_path."
  - name: "verify-consistency-requested"
    meaning: "A client starts §2.1.4.2 with first, first_hash, second, second_hash and consistency_path."
  - name: "verify-tree-requested"
    meaning: "A client starts §2.1.2 with entries 0 to tree_size - 1 and root_hash."
  - name: "advance"
    meaning: "The algorithm moves to its next printed step; no input is consumed."
  - name: "next-element"
    meaning: "The loop takes the next element of the path (p or c) or the next entry index i."
  - name: "elements-exhausted"
    meaning: "The loop has no element left."
  - name: "shift"
    meaning: "One right-shift of fn and sn inside an until-loop."
  - name: "operator-decision"
    meaning: "The log operator decides to start, freeze or shut down a log (out of band)."
  - name: "algorithm-deprecation"
    meaning: "An algorithm a live log uses has to be deprecated (§9)."
  - name: "checks-passed"
    meaning: "The checks named by the guard all succeeded."
  - name: "check-failed"
    meaning: "One of the checks named by the guard failed."
  - name: "mmd-deadline"
    meaning: "SCT timestamp plus MMD has been reached."
  - name: "mmd-period-elapsed"
    meaning: "An MMD-long period has ended."
  - name: "entries-merged"
    meaning: "The log has appended new entries to its tree."
  - name: "index-allocated"
    meaning: "The log has given the entry a tree index."
  - name: "root-calculated"
    meaning: "The log has computed the root over a tree that includes the entry."
  - name: "key-destroyed"
    meaning: "The operator destroys the log's private key (§4.13)."
  - name: "all-certificates-expired-or-relogged"
    meaning: "Every certificate in the log has expired or exists in other logs."
  - name: "session-resumed"
    meaning: "The TLS handshake is a session resumption."
  - name: "handshake-complete"
    meaning: "The TLS handshake has delivered whatever transparency information the server sent."
  - name: "proof-verified"
    meaning: "M01 or M02 ended in proven or consistent."
  - name: "proof-failed"
    meaning: "M01 or M02 ended in an error state."
  - name: "poll"
    meaning: "The monitor fetches the STH again; the frequency is not specified (§8.2)."
  - name: "timeout"
    meaning: "An extended period passed without the awaited data; its length is not specified."
machines:
  - id: "M01"
    name: "inclusion-proof-verification"
    locator: "§2.1.3.2"
    actor: "log-client"
    protocol_flow: "F26"
    purpose: >-
      §2.1.3.2 step for step. Inputs hash (leaf hash), leaf_index, tree_size, root_hash,
      inclusion_path; variables fn, sn, r. Success only at step 5 with sn = 0 and r = root_hash.
    initial: "idle"
    states:
      - name: "idle"
        meaning: "No verification running."
        kind: "inferred"
        inferred_reason: "An entry state for the machine; the source starts at step 1."
      - name: "step-1"
        meaning: "Comparing leaf_index with tree_size."
        kind: "stated"
      - name: "step-2"
        meaning: "Setting fn and sn."
        kind: "stated"
      - name: "step-3"
        meaning: "Setting r."
        kind: "stated"
      - name: "step-4"
        meaning: "Loop head over inclusion_path; p is the current element."
        kind: "stated"
      - name: "step-4a"
        meaning: "Testing sn for 0."
        kind: "stated"
      - name: "step-4b"
        meaning: "Choosing the branch on LSB(fn) and fn = sn."
        kind: "stated"
      - name: "step-4b-i"
        meaning: "r becomes HASH(0x01 || p || r)."
        kind: "stated"
      - name: "step-4b-ii"
        meaning: "Testing LSB(fn) before the until-loop."
        kind: "stated"
      - name: "step-4b-ii-shifting"
        meaning: "Inside the until-loop: one shift done, exit tested."
        kind: "stated"
      - name: "step-4b-otherwise-i"
        meaning: "r becomes HASH(0x01 || r || p)."
        kind: "stated"
      - name: "step-4c"
        meaning: "The final single shift of the iteration."
        kind: "stated"
      - name: "step-5"
        meaning: "Final comparison."
        kind: "stated"
      - name: "proven"
        meaning: "The log has proven inclusion of hash in root_hash."
        kind: "stated"
        terminal: "yes"
      - name: "failed-index-out-of-range"
        meaning: "leaf_index >= tree_size."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "failed-path-too-long"
        meaning: "An element remained when sn was already 0."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "failed-final-check"
        meaning: "Path consumed with sn != 0 (too short) or r != root_hash."
        kind: "stated"
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M01.T01"
        from: "idle"
        to: "step-1"
        trigger_kind: "event"
        trigger: "verify-inclusion-requested"
        kind: "stated"
        quotes:
          - source_lines: "436-440"
            quote: |-
              When a client has received an inclusion proof (e.g., in a TransItem of type inclusion_proof_v2) and wishes to verify inclusion of an input hash for a given tree_size and root_hash, the following algorithm may be used to prove the hash was included in the root_hash:
        constrained_by:
          - "rfc-9162#R-0152"
      - id: "M01.T02"
        from: "step-1"
        to: "failed-index-out-of-range"
        trigger_kind: "event"
        trigger: "advance"
        guard: "leaf_index >= tree_size"
        kind: "stated"
        quotes:
          - source_lines: "442-444"
            quote: |-
              Compare leaf_index from the inclusion_proof_v2 structure against tree_size. If leaf_index is greater than or equal to tree_size, then fail the proof verification.
        constrained_by:
          - "rfc-9162#R-0153"
          - "rfc-9162#R-0154"
      - id: "M01.T03"
        from: "step-1"
        to: "step-2"
        trigger_kind: "event"
        trigger: "advance"
        guard: "leaf_index < tree_size"
        kind: "stated"
      - id: "M01.T04"
        from: "step-2"
        to: "step-3"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0155"
        action: "fn = leaf_index; sn = tree_size - 1"
        kind: "stated"
        quotes:
          - source_lines: "446"
            quote: |-
              Set fn to leaf_index and sn to tree_size - 1.
      - id: "M01.T05"
        from: "step-3"
        to: "step-4"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0156"
        action: "r = hash"
        kind: "stated"
        quotes:
          - source_lines: "448"
            quote: |-
              Set r to hash.
      - id: "M01.T06"
        from: "step-4"
        to: "step-4a"
        trigger_kind: "event"
        trigger: "next-element"
        constrained_by:
          - "rfc-9162#R-0157"
        action: "p = next element of inclusion_path"
        kind: "stated"
        quotes:
          - source_lines: "450"
            quote: |-
              For each value p in the inclusion_path array:
      - id: "M01.T07"
        from: "step-4"
        to: "step-5"
        trigger_kind: "event"
        trigger: "elements-exhausted"
        kind: "stated"
      - id: "M01.T08"
        from: "step-4a"
        to: "failed-path-too-long"
        trigger_kind: "event"
        trigger: "advance"
        guard: "sn == 0"
        kind: "stated"
        quotes:
          - source_lines: "452-453"
            quote: |-
              If sn is 0, then stop the iteration and fail the proof verification.
        constrained_by:
          - "rfc-9162#R-0158"
      - id: "M01.T09"
        from: "step-4a"
        to: "step-4b"
        trigger_kind: "event"
        trigger: "advance"
        guard: "sn != 0"
        kind: "stated"
      - id: "M01.T10"
        from: "step-4b"
        to: "step-4b-i"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 1 OR fn == sn"
        kind: "stated"
        quotes:
          - source_lines: "455"
            quote: |-
              If LSB(fn) is set, or if fn is equal to sn, then:
        constrained_by:
          - "rfc-9162#R-0159"
      - id: "M01.T11"
        from: "step-4b"
        to: "step-4b-otherwise-i"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 0 AND fn != sn"
        kind: "stated"
        quotes:
          - source_lines: "462"
            quote: |-
              Otherwise:
      - id: "M01.T12"
        from: "step-4b-i"
        to: "step-4b-ii"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0160"
        action: "r = HASH(0x01 || p || r)"
        kind: "stated"
        quotes:
          - source_lines: "457"
            quote: |-
              Set r to HASH(0x01 || p || r).
      - id: "M01.T13"
        from: "step-4b-ii"
        to: "step-4c"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 1"
        kind: "stated"
      - id: "M01.T14"
        from: "step-4b-ii"
        to: "step-4b-ii-shifting"
        trigger_kind: "event"
        trigger: "shift"
        guard: "LSB(fn) == 0"
        constrained_by:
          - "rfc-9162#R-0161"
        action: "fn >>= 1; sn >>= 1"
        kind: "stated"
        quotes:
          - source_lines: "459-460"
            quote: |-
              If LSB(fn) is not set, then right-shift both fn and sn equally until either LSB(fn) is set or fn is 0.
        note: >-
          Reached only with fn == sn (T10's second disjunct) and sn != 0 (T09), so fn != 0 on entry.
          The until-loop is drawn shift-then-test; with fn != 0 the while reading gives the same run.
      - id: "M01.T15"
        from: "step-4b-ii-shifting"
        to: "step-4b-ii-shifting"
        trigger_kind: "event"
        trigger: "shift"
        guard: "LSB(fn) == 0 AND fn != 0"
        action: "fn >>= 1; sn >>= 1"
        kind: "stated"
      - id: "M01.T16"
        from: "step-4b-ii-shifting"
        to: "step-4c"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 1"
        kind: "stated"
      - id: "M01.T17"
        from: "step-4b-ii-shifting"
        to: "step-4c"
        trigger_kind: "event"
        trigger: "advance"
        guard: "fn == 0"
        kind: "stated"
        reachable: "no"
        note: >-
          The or-fn-is-0 exit as printed. Unreachable: fn is non-zero on entry (T14 note) and
          right-shifting a non-zero value reaches a set LSB before 0. Erratum 8670 (editorial,
          per record.yaml) concerns this wording. protocol.yaml SD-11.
      - id: "M01.T18"
        from: "step-4b-otherwise-i"
        to: "step-4c"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0162"
        action: "r = HASH(0x01 || r || p)"
        kind: "stated"
        quotes:
          - source_lines: "464"
            quote: |-
              Set r to HASH(0x01 || r || p).
      - id: "M01.T19"
        from: "step-4c"
        to: "step-4"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0163"
        action: "fn >>= 1; sn >>= 1"
        kind: "stated"
        quotes:
          - source_lines: "466"
            quote: |-
              Finally, right-shift both fn and sn one time.
      - id: "M01.T20"
        from: "step-5"
        to: "proven"
        trigger_kind: "event"
        trigger: "advance"
        guard: "sn == 0 AND r == root_hash"
        kind: "stated"
        quotes:
          - source_lines: "468-471"
            quote: |-
              Compare sn to 0. Compare r against the root_hash. If sn is equal to 0 and r and the root_hash are equal, then the log has proven the inclusion of hash. Otherwise, fail the proof verification.
        constrained_by:
          - "rfc-9162#R-0164"
          - "rfc-9162#R-0165"
          - "rfc-9162#R-0166"
          - "rfc-9162#R-0461"
      - id: "M01.T21"
        from: "step-5"
        to: "failed-final-check"
        trigger_kind: "event"
        trigger: "advance"
        guard: "sn != 0 OR r != root_hash"
        kind: "stated"
    error_states:
      - "failed-index-out-of-range"
      - "failed-path-too-long"
      - "failed-final-check"
  - id: "M02"
    name: "consistency-proof-verification"
    locator: "§2.1.4.2"
    actor: "log-client"
    protocol_flow: "F28"
    purpose: >-
      §2.1.4.2 step for step. Inputs first, first_hash, second, second_hash, consistency_path,
      stated for 0 < first < second; variables fn, sn, fr, sr. fr rebuilds the old root, sr the new.
    initial: "idle"
    states:
      - name: "idle"
        meaning: "No verification running."
        kind: "inferred"
        inferred_reason: "An entry state for the machine; the source starts at step 1."
      - name: "step-1"
        meaning: "Testing for an empty consistency_path."
        kind: "stated"
      - name: "step-2"
        meaning: "Prepending first_hash when first is a power of 2."
        kind: "stated"
      - name: "step-3"
        meaning: "Setting fn and sn."
        kind: "stated"
      - name: "step-4"
        meaning: "Testing LSB(fn) before the step-4 until-loop."
        kind: "stated"
      - name: "step-4-shifting"
        meaning: "Inside the step-4 loop: shift while LSB(fn) is set."
        kind: "stated"
      - name: "step-5"
        meaning: "fr and sr set to the first path element."
        kind: "stated"
      - name: "step-6"
        meaning: "Loop head over the remaining elements; c is the current element."
        kind: "stated"
      - name: "step-6a"
        meaning: "Testing sn for 0."
        kind: "stated"
      - name: "step-6b"
        meaning: "Choosing the branch on LSB(fn) and fn = sn."
        kind: "stated"
      - name: "step-6b-i"
        meaning: "fr becomes HASH(0x01 || c || fr)."
        kind: "stated"
      - name: "step-6b-ii"
        meaning: "sr becomes HASH(0x01 || c || sr)."
        kind: "stated"
      - name: "step-6b-iii"
        meaning: "Testing LSB(fn) before the until-loop."
        kind: "stated"
      - name: "step-6b-iii-shifting"
        meaning: "Inside the until-loop: one shift done, exit tested."
        kind: "stated"
      - name: "step-6b-otherwise-i"
        meaning: "sr becomes HASH(0x01 || sr || c)."
        kind: "stated"
      - name: "step-6c"
        meaning: "The final single shift of the iteration."
        kind: "stated"
      - name: "step-7"
        meaning: "Final checks of fr, sr and sn."
        kind: "stated"
      - name: "consistent"
        meaning: "The two tree heads are consistent: the old tree is a prefix of the new."
        kind: "stated"
        terminal: "yes"
      - name: "failed-empty-path"
        meaning: "consistency_path was empty at step 1; this includes the equal-size proof §5.3 mandates (SD-01)."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "failed-path-too-long"
        meaning: "An element remained when sn was already 0."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "failed-final-check"
        meaning: "fr != first_hash, sr != second_hash, or sn != 0 after the path."
        kind: "inferred"
        inferred_reason: "Step 7 says verify; that a false check fails the proof is implied, not printed."
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M02.T01"
        from: "idle"
        to: "step-1"
        trigger_kind: "event"
        trigger: "verify-consistency-requested"
        guard: "0 < first < second (the source's precondition; not tested by any step)"
        kind: "stated"
        quotes:
          - source_lines: "535-539"
            quote: |-
              When a client has a tree head first_hash for tree size first, has a tree head second_hash for tree size second where 0 < first < second, and has received a consistency proof between the two (e.g., in a TransItem of type consistency_proof_v2), the following algorithm may be used to verify the consistency proof:
        constrained_by:
          - "rfc-9162#R-0177"
        note: "first == second never reaches a step that tests it; with the mandated empty path it ends in failed-empty-path (SD-01)."
      - id: "M02.T02"
        from: "step-1"
        to: "failed-empty-path"
        trigger_kind: "event"
        trigger: "advance"
        guard: "len(consistency_path) == 0"
        kind: "stated"
        quotes:
          - source_lines: "541-542"
            quote: |-
              If consistency_path is an empty array, stop and fail the proof verification.
        constrained_by:
          - "rfc-9162#R-0076"
          - "rfc-9162#R-0178"
        note: "R-0076 is the requirement this transition contradicts (SD-01), not one it implements; R-0178 (step 1 itself, verb none) is the one it implements."
      - id: "M02.T03"
        from: "step-1"
        to: "step-2"
        trigger_kind: "event"
        trigger: "advance"
        guard: "len(consistency_path) > 0"
        kind: "stated"
      - id: "M02.T04"
        from: "step-2"
        to: "step-3"
        trigger_kind: "event"
        trigger: "advance"
        guard: "first & (first - 1) == 0"
        constrained_by:
          - "rfc-9162#R-0179"
        action: "consistency_path = [first_hash] + consistency_path"
        kind: "stated"
        quotes:
          - source_lines: "544-545"
            quote: |-
              If first is an exact power of 2, then prepend first_hash to the consistency_path array.
      - id: "M02.T05"
        from: "step-2"
        to: "step-3"
        trigger_kind: "event"
        trigger: "advance"
        guard: "first & (first - 1) != 0"
        kind: "stated"
      - id: "M02.T06"
        from: "step-3"
        to: "step-4"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0180"
        action: "fn = first - 1; sn = second - 1"
        kind: "stated"
        quotes:
          - source_lines: "547"
            quote: |-
              Set fn to first - 1 and sn to second - 1.
      - id: "M02.T07"
        from: "step-4"
        to: "step-5"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 0"
        kind: "stated"
      - id: "M02.T08"
        from: "step-4"
        to: "step-4-shifting"
        trigger_kind: "event"
        trigger: "shift"
        guard: "LSB(fn) == 1"
        constrained_by:
          - "rfc-9162#R-0181"
        action: "fn >>= 1; sn >>= 1"
        kind: "stated"
        quotes:
          - source_lines: "549-550"
            quote: |-
              If LSB(fn) is set, then right-shift both fn and sn equally until LSB(fn) is not set.
      - id: "M02.T09"
        from: "step-4-shifting"
        to: "step-4-shifting"
        trigger_kind: "event"
        trigger: "shift"
        guard: "LSB(fn) == 1"
        action: "fn >>= 1; sn >>= 1"
        kind: "stated"
      - id: "M02.T10"
        from: "step-4-shifting"
        to: "step-5"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 0"
        kind: "stated"
        note: "fn may be 0 here (first = 2^j gives fn = 2^j - 1, all ones)."
      - id: "M02.T11"
        from: "step-5"
        to: "step-6"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0182"
        action: "fr = consistency_path[0]; sr = consistency_path[0]"
        kind: "stated"
        quotes:
          - source_lines: "552-553"
            quote: |-
              Set both fr and sr to the first value in the consistency_path array.
      - id: "M02.T12"
        from: "step-6"
        to: "step-6a"
        trigger_kind: "event"
        trigger: "next-element"
        constrained_by:
          - "rfc-9162#R-0183"
        action: "c = next element of consistency_path after the first"
        kind: "stated"
        quotes:
          - source_lines: "555"
            quote: |-
              For each subsequent value c in the consistency_path array:
      - id: "M02.T13"
        from: "step-6"
        to: "step-7"
        trigger_kind: "event"
        trigger: "elements-exhausted"
        kind: "stated"
      - id: "M02.T14"
        from: "step-6a"
        to: "failed-path-too-long"
        trigger_kind: "event"
        trigger: "advance"
        guard: "sn == 0"
        kind: "stated"
        quotes:
          - source_lines: "557-558"
            quote: |-
              If sn is 0, then stop the iteration and fail the proof verification.
        constrained_by:
          - "rfc-9162#R-0184"
      - id: "M02.T15"
        from: "step-6a"
        to: "step-6b"
        trigger_kind: "event"
        trigger: "advance"
        guard: "sn != 0"
        kind: "stated"
      - id: "M02.T16"
        from: "step-6b"
        to: "step-6b-i"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 1 OR fn == sn"
        kind: "stated"
        quotes:
          - source_lines: "560"
            quote: |-
              If LSB(fn) is set, or if fn is equal to sn, then:
        constrained_by:
          - "rfc-9162#R-0185"
      - id: "M02.T17"
        from: "step-6b"
        to: "step-6b-otherwise-i"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 0 AND fn != sn"
        kind: "stated"
        quotes:
          - source_lines: "569"
            quote: |-
              Otherwise:
      - id: "M02.T18"
        from: "step-6b-i"
        to: "step-6b-ii"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0186"
        action: "fr = HASH(0x01 || c || fr)"
        kind: "stated"
        quotes:
          - source_lines: "562"
            quote: |-
              Set fr to HASH(0x01 || c || fr).
      - id: "M02.T19"
        from: "step-6b-ii"
        to: "step-6b-iii"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0187"
        action: "sr = HASH(0x01 || c || sr)"
        kind: "stated"
        quotes:
          - source_lines: "564"
            quote: |-
              Set sr to HASH(0x01 || c || sr).
      - id: "M02.T20"
        from: "step-6b-iii"
        to: "step-6c"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 1"
        kind: "stated"
      - id: "M02.T21"
        from: "step-6b-iii"
        to: "step-6b-iii-shifting"
        trigger_kind: "event"
        trigger: "shift"
        guard: "LSB(fn) == 0"
        constrained_by:
          - "rfc-9162#R-0188"
        action: "fn >>= 1; sn >>= 1"
        kind: "stated"
        quotes:
          - source_lines: "566-567"
            quote: |-
              If LSB(fn) is not set, then right-shift both fn and sn equally until either LSB(fn) is set or fn is 0.
        note: "Reached only with fn == sn and sn != 0 (T15, T16), so fn != 0 on entry."
      - id: "M02.T22"
        from: "step-6b-iii-shifting"
        to: "step-6b-iii-shifting"
        trigger_kind: "event"
        trigger: "shift"
        guard: "LSB(fn) == 0 AND fn != 0"
        action: "fn >>= 1; sn >>= 1"
        kind: "stated"
      - id: "M02.T23"
        from: "step-6b-iii-shifting"
        to: "step-6c"
        trigger_kind: "event"
        trigger: "advance"
        guard: "LSB(fn) == 1"
        kind: "stated"
      - id: "M02.T24"
        from: "step-6b-iii-shifting"
        to: "step-6c"
        trigger_kind: "event"
        trigger: "advance"
        guard: "fn == 0"
        kind: "stated"
        reachable: "no"
        note: "The or-fn-is-0 exit as printed; unreachable for the reason of M01.T17. Erratum 8670 (editorial). SD-11."
      - id: "M02.T25"
        from: "step-6b-otherwise-i"
        to: "step-6c"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0189"
        action: "sr = HASH(0x01 || sr || c)"
        kind: "stated"
        quotes:
          - source_lines: "571"
            quote: |-
              Set sr to HASH(0x01 || sr || c).
      - id: "M02.T26"
        from: "step-6c"
        to: "step-6"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0190"
        action: "fn >>= 1; sn >>= 1"
        kind: "stated"
        quotes:
          - source_lines: "573"
            quote: |-
              Finally, right-shift both fn and sn one time.
      - id: "M02.T27"
        from: "step-7"
        to: "consistent"
        trigger_kind: "event"
        trigger: "advance"
        guard: "fr == first_hash AND sr == second_hash AND sn == 0"
        kind: "stated"
        quotes:
          - source_lines: "575-578"
            quote: |-
              After completing iterating through the consistency_path array as described above, verify that the fr calculated is equal to the first_hash supplied, that the sr calculated is equal to the second_hash supplied, and that sn is 0.
        constrained_by:
          - "rfc-9162#R-0191"
          - "rfc-9162#R-0462"
      - id: "M02.T28"
        from: "step-7"
        to: "failed-final-check"
        trigger_kind: "event"
        trigger: "advance"
        guard: "fr != first_hash OR sr != second_hash OR sn != 0"
        kind: "inferred"
        inferred_reason: "The failing outcome of step 7's verify is implied, not printed."
    error_states:
      - "failed-empty-path"
      - "failed-path-too-long"
      - "failed-final-check"
  - id: "M03"
    name: "tree-head-verification"
    locator: "§2.1.2"
    actor: "log-client"
    protocol_flow: "F24"
    purpose: >-
      §2.1.2 step for step: a stack rebuild of MTH from entries 0 to tree_size - 1, compared with
      root_hash. Variables stack, i, merge_count, left, right.
    initial: "idle"
    states:
      - name: "idle"
        meaning: "No verification running."
        kind: "inferred"
        inferred_reason: "An entry state for the machine; the source starts at step 1."
      - name: "step-1"
        meaning: "stack set to empty."
        kind: "stated"
      - name: "step-2"
        meaning: "Loop head over i from 0 to tree_size - 1."
        kind: "stated"
      - name: "step-2a"
        meaning: "Pushing the leaf hash of entries[i]."
        kind: "stated"
      - name: "step-2b"
        meaning: "Computing merge_count, the count of trailing 1 bits of i."
        kind: "stated"
      - name: "step-2c"
        meaning: "Merge loop: merges left to do this iteration."
        kind: "stated"
      - name: "step-3"
        meaning: "Final merges while more than one element remains."
        kind: "stated"
      - name: "step-4"
        meaning: "Comparing the one remaining element with root_hash."
        kind: "stated"
      - name: "verified"
        meaning: "The entries produce root_hash."
        kind: "stated"
        terminal: "yes"
      - name: "mismatch"
        meaning: "The entries do not produce root_hash."
        kind: "inferred"
        inferred_reason: "Step 4 says compare by equality; the failing outcome is implied."
        error: "yes"
        terminal: "yes"
      - name: "undefined-empty-tree"
        meaning: "tree_size 0: the stack is empty at step 4 and the algorithm has no element to compare (SD-12)."
        kind: "inferred"
        inferred_reason: "The source does not treat tree_size 0; this state records where the printed algorithm runs out."
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M03.T01"
        from: "idle"
        to: "step-1"
        trigger_kind: "event"
        trigger: "verify-tree-requested"
        kind: "stated"
        quotes:
          - source_lines: "366-369"
            quote: |-
              When a client has a complete list of entries from 0 up to tree_size - 1 and wishes to verify this list against a tree head root_hash returned by the log for the same tree_size, the following algorithm may be used:
        constrained_by:
          - "rfc-9162#R-0136"
      - id: "M03.T02"
        from: "step-1"
        to: "step-2"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0137"
        action: "stack = []; i = 0"
        kind: "stated"
        quotes:
          - source_lines: "371"
            quote: |-
              Set stack to an empty stack.
      - id: "M03.T03"
        from: "step-2"
        to: "step-2a"
        trigger_kind: "event"
        trigger: "next-element"
        guard: "i <= tree_size - 1"
        kind: "stated"
        quotes:
          - source_lines: "373"
            quote: |-
              For each i from 0 up to tree_size - 1:
        constrained_by:
          - "rfc-9162#R-0138"
      - id: "M03.T04"
        from: "step-2"
        to: "step-3"
        trigger_kind: "event"
        trigger: "elements-exhausted"
        guard: "i == tree_size"
        kind: "stated"
      - id: "M03.T05"
        from: "step-2a"
        to: "step-2b"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0139"
        action: "push HASH(0x00 || entries[i])"
        kind: "stated"
        quotes:
          - source_lines: "375"
            quote: |-
              Push HASH(0x00 || entries[i]) to stack.
      - id: "M03.T06"
        from: "step-2b"
        to: "step-2c"
        trigger_kind: "event"
        trigger: "advance"
        constrained_by:
          - "rfc-9162#R-0140"
        action: "merge_count = least m >= 0 with LSB(i >> m) == 0"
        kind: "stated"
        quotes:
          - source_lines: "377-381"
            quote: |-
              Set merge_count to the lowest value (0 included) such that LSB(i >> merge_count) is not set, where LSB means the least significant bit. In other words, set merge_count to the number of consecutive 1s found starting at the least significant bit of i.
      - id: "M03.T07"
        from: "step-2c"
        to: "step-2c"
        trigger_kind: "event"
        trigger: "advance"
        guard: "merge_count > 0"
        constrained_by:
          - "rfc-9162#R-0141"
          - "rfc-9162#R-0142"
          - "rfc-9162#R-0143"
          - "rfc-9162#R-0144"
        action: "right = pop; left = pop; push HASH(0x01 || left || right); merge_count -= 1"
        kind: "stated"
        quotes:
          - source_lines: "383-389"
            quote: |-
              Repeat merge_count times: i. Pop right from stack. ii. Pop left from stack. iii. Push HASH(0x01 || left || right) to stack.
      - id: "M03.T08"
        from: "step-2c"
        to: "step-2"
        trigger_kind: "event"
        trigger: "advance"
        guard: "merge_count == 0"
        action: "i += 1"
        kind: "stated"
      - id: "M03.T09"
        from: "step-3"
        to: "step-3"
        trigger_kind: "event"
        trigger: "advance"
        guard: "len(stack) > 1"
        constrained_by:
          - "rfc-9162#R-0145"
        action: "right = pop; left = pop; push HASH(0x01 || left || right)"
        kind: "stated"
        quotes:
          - source_lines: "391-393"
            quote: |-
              If there is more than one element in the stack, repeat the same merge procedure (the sub-items of Step 2(c) above) until only a single element remains.
      - id: "M03.T10"
        from: "step-3"
        to: "step-4"
        trigger_kind: "event"
        trigger: "advance"
        guard: "len(stack) == 1"
        kind: "stated"
      - id: "M03.T11"
        from: "step-3"
        to: "undefined-empty-tree"
        trigger_kind: "event"
        trigger: "advance"
        guard: "len(stack) == 0 (tree_size == 0)"
        kind: "inferred"
        constrained_by:
          - "rfc-9162#R-0130"
        inferred_reason: "Steps 3 and 4 assume at least one element; MTH({}) = HASH() is defined in §2.1.1 but §2.1.2 never reaches it. SD-12."
        quotes:
          - source_lines: "331-333"
            quote: |-
              The hash of an empty list is the hash of an empty string: MTH({}) = HASH().
      - id: "M03.T12"
        from: "step-4"
        to: "verified"
        trigger_kind: "event"
        trigger: "advance"
        guard: "stack[0] == root_hash"
        kind: "stated"
        quotes:
          - source_lines: "395-397"
            quote: |-
              The remaining element in stack is the Merkle Tree Hash for the given tree_size and should be compared by equality against the supplied root_hash.
        constrained_by:
          - "rfc-9162#R-0146"
      - id: "M03.T13"
        from: "step-4"
        to: "mismatch"
        trigger_kind: "event"
        trigger: "advance"
        guard: "stack[0] != root_hash"
        kind: "inferred"
        inferred_reason: "The failing outcome of the comparison is implied."
    error_states:
      - "mismatch"
      - "undefined-empty-tree"
  - id: "M04"
    name: "log-lifecycle"
    locator: "§4.1, §4.4, §4.10, §4.13, §9"
    actor: "log-operator, log"
    protocol_flow: "F01, F22"
    purpose: >-
      From parameters to retirement. The source gives the shutdown sequence as SHOULD bullets
      (§4.13) and makes freezing a MUST when an algorithm must be deprecated (§9).
    initial: "planned"
    states:
      - name: "planned"
        meaning: "Parameters not yet established."
        kind: "inferred"
        inferred_reason: "An entry state; the source starts with established parameters."
      - name: "parameters-established"
        meaning: "Every parameter except the Final STH fixed and immutable."
        kind: "stated"
      - name: "operating"
        meaning: "Accepting submissions (M05), merging within the MMD, signing STHs (M06)."
        kind: "stated"
      - name: "freeze-announced"
        meaning: "Clients and monitors told out of band that the log will be frozen; still accepting."
        kind: "stated"
      - name: "draining"
        meaning: "No new submissions (shutdown error); pending entries still being merged."
        kind: "stated"
      - name: "final-sth-published"
        meaning: "Final STH issued and published as a parameter; reads still served."
        kind: "stated"
      - name: "key-destroyed"
        meaning: "Private key destroyed; no further signature possible."
        kind: "stated"
      - name: "retired"
        meaning: "Every logged certificate has expired or is logged elsewhere; the log may stop."
        kind: "inferred"
        inferred_reason: "The source says keep the log running until this condition; stopping after it is implied."
        terminal: "yes"
      - name: "misbehaving"
        meaning: "A promise was broken: an SCT's entry not merged within the MMD, or STHs over the frequency count."
        kind: "inferred"
        inferred_reason: "§11.3 names these as misbehaviour detected by clients; the log-side state is this model's."
        error: "yes"
        terminal: "yes"
      - name: "freshness-unmeetable"
        meaning: "Key destroyed while §4.10 still asks for a fresh STH each MMD period (SD-08)."
        kind: "inferred"
        inferred_reason: "Records the collision of §4.13 with §4.10; the source does not say which yields."
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M04.T01"
        from: "planned"
        to: "parameters-established"
        trigger_kind: "event"
        trigger: "operator-decision"
        guard: "base URL, hash and signature algorithms, unique keypair, Log ID, MMD, version, maximum chain length (if any), STH Frequency Count all set"
        kind: "stated"
        quotes:
          - source_lines: "813-816"
            quote: |-
              A log is defined by a collection of immutable parameters, which are used by clients to communicate with the log and to verify log artifacts. Except for the Final STH, each of these parameters MUST be established before the log operator begins to operate the log.
        constrained_by:
          - "rfc-9162#R-0026"
          - "rfc-9162#R-0027"
          - "rfc-9162#R-0028"
          - "rfc-9162#R-0041"
          - "rfc-9162#R-0042"
          - "rfc-9162#R-0043"
          - "rfc-9162#R-0001"
          - "rfc-9162#R-0212"
      - id: "M04.T02"
        from: "parameters-established"
        to: "operating"
        trigger_kind: "event"
        trigger: "operator-decision"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0419"
        note: "The parameters never change after this point; algorithms cannot change part way (§9)."
        quotes:
          - source_lines: "2115-2116"
            quote: |-
              It is not possible for a log to change either of its algorithms part way through its lifetime:
      - id: "M04.T03"
        from: "operating"
        to: "operating"
        trigger_kind: "message"
        trigger: "submit-entry request"
        action: "run M05 for the submission"
        kind: "stated"
      - id: "M04.T04"
        from: "operating"
        to: "freeze-announced"
        trigger_kind: "event"
        trigger: "operator-decision"
        action: "announce the freeze out of band"
        kind: "stated"
        quotes:
          - source_lines: "1234-1235"
            quote: |-
              Log operators may decide to shut down a log for various reasons, such as deprecation of the signature algorithm.
          - source_lines: "1241-1243"
            quote: |-
              Make it known to clients and monitors that the log will be frozen. This is not part of the API, so it will have to be done via a relevant out-of-band mechanism.
        constrained_by:
          - "rfc-9162#R-0060"
          - "rfc-9162#R-0281"
      - id: "M04.T05"
        from: "operating"
        to: "freeze-announced"
        trigger_kind: "event"
        trigger: "algorithm-deprecation"
        action: "freeze this log; start a new log (a new M04 instance) for certificates needing new SCTs"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0122"
          - "rfc-9162#R-0123"
          - "rfc-9162#R-0421"
          - "rfc-9162#R-0422"
      - id: "M04.T06"
        from: "freeze-announced"
        to: "draining"
        trigger_kind: "event"
        trigger: "operator-decision"
        action: "stop accepting submissions"
        kind: "stated"
        quotes:
          - source_lines: "1245-1246"
            quote: |-
              Stop accepting new submissions (the error code "shutdown" should be returned for such requests).
        constrained_by:
          - "rfc-9162#R-0060"
          - "rfc-9162#R-0282"
      - id: "M04.T07"
        from: "draining"
        to: "draining"
        trigger_kind: "message"
        trigger: "submit-entry request"
        action: "answer Error response (problem details) with type shutdown"
        kind: "stated"
      - id: "M04.T08"
        from: "draining"
        to: "final-sth-published"
        trigger_kind: "event"
        trigger: "mmd-deadline"
        guard: "now >= last accepted SCT timestamp + MMD AND every pending submission incorporated"
        action: "sign a final STH; publish it as the Final STH parameter (TransItem signed_tree_head_v2)"
        kind: "stated"
        quotes:
          - source_lines: "1248-1253"
            quote: |-
              Once MMD from the last accepted submission has passed and all pending submissions are incorporated, issue a final STH and publish it as one of the log's parameters. Having an STH with a timestamp that is after the MMD has passed from the last SCT issuance allows clients to audit this log regularly without special handling for the final STH.
          - source_lines: "852-853"
            quote: |-
              If a log is still accepting entries, this value should not be provided.
        constrained_by:
          - "rfc-9162#R-0029"
          - "rfc-9162#R-0283"
          - "rfc-9162#R-0227"
      - id: "M04.T09"
        from: "final-sth-published"
        to: "key-destroyed"
        trigger_kind: "event"
        trigger: "key-destroyed"
        kind: "stated"
        quotes:
          - source_lines: "1253-1254"
            quote: |-
              At this point, the log's private key is no longer needed and can be destroyed.
        constrained_by:
          - "rfc-9162#R-0284"
      - id: "M04.T10"
        from: "final-sth-published"
        to: "retired"
        trigger_kind: "event"
        trigger: "all-certificates-expired-or-relogged"
        kind: "stated"
        quotes:
          - source_lines: "1256-1259"
            quote: |-
              Keep the log running until the certificates in all of its entries have expired or exist in other logs (this can be determined by scanning other logs or connecting to domains mentioned in the certificates and inspecting the SCTs served).
        constrained_by:
          - "rfc-9162#R-0285"
      - id: "M04.T11"
        from: "key-destroyed"
        to: "retired"
        trigger_kind: "event"
        trigger: "all-certificates-expired-or-relogged"
        kind: "stated"
      - id: "M04.T12"
        from: "key-destroyed"
        to: "freshness-unmeetable"
        trigger_kind: "event"
        trigger: "mmd-period-elapsed"
        guard: "log still answering get-sth"
        kind: "inferred"
        inferred_reason: "SD-08: §4.10's freshness MUSTs cannot be met without the key; the source does not exempt a frozen log."
        constrained_by:
          - "rfc-9162#R-0055"
          - "rfc-9162#R-0057"
      - id: "M04.T13"
        from: "operating"
        to: "misbehaving"
        trigger_kind: "event"
        trigger: "mmd-deadline"
        guard: "an issued SCT's entry is not in any STH by its timestamp + MMD (M05 in mmd-missed)"
        kind: "inferred"
        inferred_reason: "§11.3 lists this as misbehaviour; the source has no log-side state for it."
        constrained_by:
          - "rfc-9162#R-0024"
      - id: "M04.T14"
        from: "draining"
        to: "misbehaving"
        trigger_kind: "event"
        trigger: "mmd-deadline"
        guard: "as M04.T13"
        kind: "inferred"
        inferred_reason: "As M04.T13."
        constrained_by:
          - "rfc-9162#R-0024"
      - id: "M04.T15"
        from: "operating"
        to: "misbehaving"
        trigger_kind: "message"
        trigger: "SignedTreeHeadDataV2"
        guard: "STHs signed in an MMD-long period exceed the STH Frequency Count (M06 in over-rate)"
        kind: "inferred"
        inferred_reason: "§11.3 lists issuing STHs too frequently as misbehaviour."
        constrained_by:
          - "rfc-9162#R-0056"
    error_states:
      - "misbehaving"
      - "freshness-unmeetable"
  - id: "M05"
    name: "submission-to-incorporation"
    locator: "§4, §4.2, §4.2.1, §4.2.2, §4.3, §5.1, §11.3"
    actor: "log, log-front-end"
    protocol_flow: "F02, F04"
    purpose: >-
      One submission at the log: Table 2 checks, minimum and discretionary criteria, SCT (new or
      repeated), then the promise: index, root, signed STH, all before timestamp + MMD. The order
      of the checks is not stated (protocol.yaml F02 order_note); this machine uses Table 2's order.
    initial: "idle"
    states:
      - name: "idle"
        meaning: "No submission."
        kind: "inferred"
        inferred_reason: "Entry state."
      - name: "received"
        meaning: "A submit-entry POST arrived."
        kind: "stated"
      - name: "table-2-checks"
        meaning: "type, submission, chain encoding, chain order, trust anchor (§5.1 Table 2)."
        kind: "stated"
      - name: "minimum-criteria"
        meaning: "§4.2.1: cA or keyCertSign on intermediates, pathLenConstraint, precertificate profile."
        kind: "stated"
      - name: "discretionary"
        meaning: "§4.2.2 and §4.2: RFC 5280 validity, chain length, load."
        kind: "stated"
      - name: "accepted"
        meaning: "The log accepts the submission."
        kind: "stated"
      - name: "sct-issued"
        meaning: "A new SCT signed, the chain stored, the response sent."
        kind: "stated"
      - name: "sct-repeated"
        meaning: "The same valid submission seen before; the earlier SCT returned, no new leaf."
        kind: "stated"
        terminal: "yes"
      - name: "pending-merge"
        meaning: "The promise is running: deadline = SCT timestamp + MMD."
        kind: "stated"
      - name: "index-allocated"
        meaning: "The entry has a tree index."
        kind: "stated"
      - name: "root-calculated"
        meaning: "A root over a tree including the entry is computed."
        kind: "stated"
      - name: "incorporated"
        meaning: "An STH covering the entry is signed; the promise is kept."
        kind: "stated"
        terminal: "yes"
      - name: "rejected-shutdown"
        meaning: "The log no longer accepts submissions."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "rejected-malformed"
        meaning: "Request unparseable (error type malformed)."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "rejected-badType"
        meaning: "type outside the set {1, 2} (error type badType)."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "rejected-badSubmission"
        meaning: "submission parses as no certificate and no precertificate (error type badSubmission)."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "rejected-badCertificate"
        meaning: "A chain certificate is not valid."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "rejected-badChain"
        meaning: "The chain is out of order."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "rejected-unknownAnchor"
        meaning: "No accepted trust anchor ends the chain."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "rejected-untyped"
        meaning: "Rejected for a reason the source gives no error type for (OI-01)."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "mmd-missed"
        meaning: "The deadline passed with the entry in no signed tree head."
        kind: "inferred"
        inferred_reason: "§11.3 names failing to incorporate within the MMD as misbehaviour; the state is this model's."
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M05.T01"
        from: "idle"
        to: "received"
        trigger_kind: "message"
        trigger: "submit-entry request"
        kind: "stated"
      - id: "M05.T02"
        from: "received"
        to: "rejected-shutdown"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "M04 in draining or later"
        action: "respond Error response (problem details), type shutdown"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0060"
      - id: "M05.T03"
        from: "received"
        to: "rejected-malformed"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "request does not parse"
        action: "respond 4xx, type malformed"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0063"
      - id: "M05.T04"
        from: "received"
        to: "table-2-checks"
        trigger_kind: "event"
        trigger: "checks-passed"
        guard: "accepting AND request parses"
        kind: "inferred"
        inferred_reason: "Table 2 gives no order; checking shutdown and parsing first is this model's."
      - id: "M05.T05"
        from: "table-2-checks"
        to: "rejected-badType"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "type not in {1, 2}"
        kind: "stated"
      - id: "M05.T06"
        from: "table-2-checks"
        to: "rejected-badSubmission"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "submission is neither a valid certificate nor a valid precertificate"
        kind: "stated"
      - id: "M05.T07"
        from: "table-2-checks"
        to: "rejected-badCertificate"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "a chain certificate is invalid, and not (only its encoding is bad, the chain verifies, and the log chooses to log)"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0070"
      - id: "M05.T08"
        from: "table-2-checks"
        to: "rejected-badChain"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "chain[0] does not certify the submission, or some chain[i+1] does not certify chain[i]"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0033"
      - id: "M05.T09"
        from: "table-2-checks"
        to: "rejected-unknownAnchor"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "last chain element (or the submission) neither is nor is certified by an accepted anchor; or the submission is an accepted anchor certified by neither an anchor nor chain[0]"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0072"
      - id: "M05.T10"
        from: "table-2-checks"
        to: "minimum-criteria"
        trigger_kind: "event"
        trigger: "checks-passed"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0071"
        note: "Includes the case of bad encoding in a chain that verifies, when the log chooses to log it."
      - id: "M05.T11"
        from: "minimum-criteria"
        to: "rejected-untyped"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "an intermediate lacks both cA and keyCertSign, or a pathLenConstraint is exceeded, or a precertificate breaks §3.2"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0032"
          - "rfc-9162#R-0034"
          - "rfc-9162#R-0035"
          - "rfc-9162#R-0036"
          - "rfc-9162#R-0478"
      - id: "M05.T12"
        from: "minimum-criteria"
        to: "discretionary"
        trigger_kind: "event"
        trigger: "checks-passed"
        kind: "stated"
      - id: "M05.T13"
        from: "discretionary"
        to: "rejected-untyped"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "the log declines: RFC 5280 defects, chain longer than its maximum, or temporary refusal under load"
        kind: "stated"
        quotes:
          - source_lines: "866-868"
            quote: |-
              (A log may decide, for example, to temporarily reject acceptable submissions to protect itself against denial-of-service attacks.)
        constrained_by:
          - "rfc-9162#R-0037"
          - "rfc-9162#R-0228"
      - id: "M05.T14"
        from: "discretionary"
        to: "accepted"
        trigger_kind: "event"
        trigger: "checks-passed"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0030"
      - id: "M05.T15"
        from: "accepted"
        to: "sct-repeated"
        trigger_kind: "event"
        trigger: "checks-passed"
        guard: "the same valid submission was accepted before (not a certificate previously logged only as a precertificate)"
        action: "return the earlier SCT"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0023"
          - "rfc-9162#R-0204"
          - "rfc-9162#R-0125"
      - id: "M05.T16"
        from: "accepted"
        to: "sct-issued"
        trigger_kind: "event"
        trigger: "checks-passed"
        guard: "not seen before"
        action: "sign the SCT over the entry TransItem; store the full chain with its anchor; respond with sct"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0022"
          - "rfc-9162#R-0038"
          - "rfc-9162#R-0039"
          - "rfc-9162#R-0001"
      - id: "M05.T17"
        from: "accepted"
        to: "incorporated"
        trigger_kind: "event"
        trigger: "entries-merged"
        guard: "the entry is appended and an STH signed before the response"
        action: "respond with sct, sth and inclusion"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0068"
      - id: "M05.T18"
        from: "sct-issued"
        to: "pending-merge"
        trigger_kind: "event"
        trigger: "advance"
        action: "deadline = sct.timestamp + MMD"
        kind: "stated"
        quotes:
          - source_lines: "792-793"
            quote: |-
              An SCT is the log's promise to append to its Merkle Tree an entry for the accepted submission.
        constrained_by:
          - "rfc-9162#R-0024"
          - "rfc-9162#R-0207"
      - id: "M05.T19"
        from: "pending-merge"
        to: "index-allocated"
        trigger_kind: "event"
        trigger: "index-allocated"
        guard: "now <= deadline"
        kind: "stated"
        quotes:
          - source_lines: "798-803"
            quote: |-
              Allocate a tree index to the entry representing the accepted submission. * Calculate the root of the tree. * Sign the root of the tree (see Section 4.10).
        constrained_by:
          - "rfc-9162#R-0208"
          - "rfc-9162#R-0209"
          - "rfc-9162#R-0210"
      - id: "M05.T20"
        from: "index-allocated"
        to: "root-calculated"
        trigger_kind: "event"
        trigger: "root-calculated"
        guard: "now <= deadline"
        kind: "stated"
      - id: "M05.T21"
        from: "root-calculated"
        to: "incorporated"
        trigger_kind: "message"
        trigger: "SignedTreeHeadDataV2"
        guard: "now <= deadline AND sth.tree_size > index"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0058"
      - id: "M05.T22"
        from: "pending-merge"
        to: "mmd-missed"
        trigger_kind: "event"
        trigger: "mmd-deadline"
        kind: "inferred"
        inferred_reason: "The failing side of the MMD promise; §11.3 calls it misbehaviour."
        quotes:
          - source_lines: "2588-2590"
            quote: |-
              A log can misbehave in several ways. Examples include the following: failing to incorporate a certificate with an SCT in the Merkle Tree within the MMD;
      - id: "M05.T23"
        from: "index-allocated"
        to: "mmd-missed"
        trigger_kind: "event"
        trigger: "mmd-deadline"
        kind: "inferred"
        inferred_reason: "As M05.T22."
      - id: "M05.T24"
        from: "root-calculated"
        to: "mmd-missed"
        trigger_kind: "event"
        trigger: "mmd-deadline"
        kind: "inferred"
        inferred_reason: "As M05.T22."
    error_states:
      - "rejected-shutdown"
      - "rejected-malformed"
      - "rejected-badType"
      - "rejected-badSubmission"
      - "rejected-badCertificate"
      - "rejected-badChain"
      - "rejected-unknownAnchor"
      - "rejected-untyped"
      - "mmd-missed"
  - id: "M06"
    name: "sth-cadence"
    locator: "§4.10, §4.9, §11.3"
    actor: "log"
    protocol_flow: "F05"
    purpose: >-
      When the log signs: after new entries, and at least once per MMD period even without them;
      never more often than the STH Frequency Count per MMD-long period.
    initial: "current"
    states:
      - name: "current"
        meaning: "The latest STH covers every merged entry and is younger than the MMD."
        kind: "inferred"
        inferred_reason: "A resting state for the cadence; the source states only the obligations."
      - name: "sign-due"
        meaning: "New entries merged, or an MMD period without submissions has ended."
        kind: "stated"
      - name: "rate-limited"
        meaning: "A signature is due but the period's STH Frequency Count is used up."
        kind: "inferred"
        inferred_reason: "The waiting consequence of the MUST NOT; not described."
      - name: "signed"
        meaning: "A new STH with a later timestamp exists."
        kind: "stated"
      - name: "over-rate"
        meaning: "More STHs than the frequency count in one MMD-long period."
        kind: "inferred"
        inferred_reason: "The violation the MUST NOT forbids, provable from the STHs (§11.3)."
        error: "yes"
        terminal: "yes"
      - name: "stale"
        meaning: "No STH younger than the MMD to serve."
        kind: "inferred"
        inferred_reason: "The violation of §4.10's freshness MUST."
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M06.T01"
        from: "current"
        to: "sign-due"
        trigger_kind: "event"
        trigger: "entries-merged"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0054"
      - id: "M06.T02"
        from: "current"
        to: "sign-due"
        trigger_kind: "event"
        trigger: "mmd-period-elapsed"
        guard: "no submission accepted during the period"
        action: "the same root will be signed with a fresh timestamp"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0057"
      - id: "M06.T03"
        from: "sign-due"
        to: "signed"
        trigger_kind: "event"
        trigger: "advance"
        guard: "STHs in the current MMD-long period < STH Frequency Count"
        action: "sign tree_head: timestamp >= newest SCT timestamp in the tree and > previous STH timestamp; deterministic signature or one STH per tree_size"
        kind: "stated"
        emits: "SignedTreeHeadDataV2"
        constrained_by:
          - "rfc-9162#R-0056"
          - "rfc-9162#R-0058"
          - "rfc-9162#R-0059"
          - "rfc-9162#R-0125"
      - id: "M06.T04"
        from: "sign-due"
        to: "rate-limited"
        trigger_kind: "event"
        trigger: "advance"
        guard: "STHs in the current MMD-long period == STH Frequency Count"
        kind: "inferred"
        inferred_reason: "What the log does when a signature is due but not allowed is not described."
      - id: "M06.T05"
        from: "rate-limited"
        to: "sign-due"
        trigger_kind: "event"
        trigger: "mmd-period-elapsed"
        kind: "inferred"
        inferred_reason: "The window rolls; inferred as M06.T04."
      - id: "M06.T06"
        from: "signed"
        to: "current"
        trigger_kind: "event"
        trigger: "advance"
        action: "front ends serve it once they hold every entry under it"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0062"
      - id: "M06.T07"
        from: "sign-due"
        to: "over-rate"
        trigger_kind: "event"
        trigger: "advance"
        guard: "the log signs although the period's count is used up"
        kind: "inferred"
        inferred_reason: "The forbidden path, kept so an auditor's finding has a state."
      - id: "M06.T08"
        from: "rate-limited"
        to: "stale"
        trigger_kind: "message"
        trigger: "get-sth request and response"
        guard: "latest STH older than the MMD"
        kind: "inferred"
        inferred_reason: "A frequency count too small for the MMD would force this; the source does not relate the two parameters."
        constrained_by:
          - "rfc-9162#R-0055"
    error_states:
      - "over-rate"
      - "stale"
  - id: "M07"
    name: "tls-handshake-transparency"
    locator: "§6, §6.3, §6.5, §8.1.1"
    actor: "tls-client, tls-server"
    protocol_flow: "F13, F14, F15"
    purpose: >-
      The transparency_info negotiation and what the client collects from all three channels. TLS
      itself (record layer, alerts, other extensions) is outside the source.
    initial: "client-start"
    states:
      - name: "client-start"
        meaning: "The client is building its ClientHello."
        kind: "inferred"
        inferred_reason: "Entry state."
      - name: "hello-sent"
        meaning: "ClientHello sent, normally with transparency_info (empty) and status_request."
        kind: "stated"
      - name: "server-evaluating"
        meaning: "The server has the ClientHello."
        kind: "stated"
      - name: "server-resumed"
        meaning: "Resumption: the server neither processes nor sends transparency_info."
        kind: "stated"
      - name: "server-checking-empty"
        meaning: "The server checks the client's extension_data is empty."
        kind: "stated"
      - name: "server-building-list"
        meaning: "The server builds the TransItemList (§6.4, §6.5)."
        kind: "stated"
      - name: "sent-with-extension"
        meaning: "transparency_info sent with a non-empty TransItemList."
        kind: "stated"
      - name: "sent-without-list"
        meaning: "List empty: extension_data omitted or an empty array sent (SD-07)."
        kind: "stated"
      - name: "client-receiving"
        meaning: "The client has the server's flight (extension, stapled OCSP, certificate)."
        kind: "stated"
      - name: "client-collected"
        meaning: "TransItems from all three channels decoded one by one; each SCT goes to M08."
        kind: "stated"
        terminal: "yes"
      - name: "client-aborted"
        meaning: "transparency_info arrived on a resumed session; the handshake is aborted."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "server-ext-data-nonempty"
        meaning: "The client's extension_data was not empty; the server's next action is not stated (OI-06)."
        kind: "stated"
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M07.T01"
        from: "client-start"
        to: "hello-sent"
        trigger_kind: "message"
        trigger: "transparency_info TLS extension (ClientHello)"
        action: "include transparency_info with empty extension_data, and status_request"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0111"
          - "rfc-9162#R-0118"
      - id: "M07.T02"
        from: "hello-sent"
        to: "server-evaluating"
        trigger_kind: "message"
        trigger: "transparency_info TLS extension (ClientHello)"
        kind: "stated"
      - id: "M07.T03"
        from: "server-evaluating"
        to: "server-resumed"
        trigger_kind: "event"
        trigger: "session-resumed"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0100"
      - id: "M07.T04"
        from: "server-evaluating"
        to: "server-checking-empty"
        trigger_kind: "event"
        trigger: "advance"
        guard: "client offered transparency_info AND server supports it AND not resuming"
        kind: "stated"
        quotes:
          - source_lines: "1823-1825"
            quote: |-
              Provided that a TLS client includes the transparency_info extension type in the ClientHello and the TLS server supports the transparency_info extension:
        constrained_by:
          - "rfc-9162#R-0369"
      - id: "M07.T05"
        from: "server-evaluating"
        to: "client-receiving"
        trigger_kind: "event"
        trigger: "handshake-complete"
        guard: "server does not support transparency_info, or the client did not offer it; not resuming"
        action: "server may still staple OCSP or send a certificate with the extension"
        kind: "inferred"
        inferred_reason: "The source states only the supporting case; the other is ordinary TLS."
        quotes:
          - source_lines: "1711-1713"
            quote: |-
              (Of course, a server can only send a TLS extension if the client has specified it first.)
      - id: "M07.T06"
        from: "server-checking-empty"
        to: "server-ext-data-nonempty"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "extension_data not empty"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0095"
      - id: "M07.T07"
        from: "server-checking-empty"
        to: "server-building-list"
        trigger_kind: "event"
        trigger: "checks-passed"
        guard: "extension_data empty"
        kind: "stated"
      - id: "M07.T08"
        from: "server-building-list"
        to: "sent-with-extension"
        trigger_kind: "message"
        trigger: "transparency_info TLS extension (server)"
        guard: "TransItemList not empty"
        action: "in ServerHello (TLS 1.2 or earlier) or Certificate / CertificateRequest (TLS 1.3); at least one SCT; proofs and STHs if obtainable; minus items already embedded or stapled"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0096"
          - "rfc-9162#R-0097"
          - "rfc-9162#R-0099"
          - "rfc-9162#R-0093"
          - "rfc-9162#R-0094"
          - "rfc-9162#R-0092"
      - id: "M07.T09"
        from: "server-building-list"
        to: "sent-without-list"
        trigger_kind: "event"
        trigger: "advance"
        guard: "TransItemList empty"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0098"
      - id: "M07.T10"
        from: "sent-with-extension"
        to: "client-receiving"
        trigger_kind: "event"
        trigger: "handshake-complete"
        kind: "stated"
      - id: "M07.T11"
        from: "sent-without-list"
        to: "client-receiving"
        trigger_kind: "event"
        trigger: "handshake-complete"
        kind: "stated"
      - id: "M07.T12"
        from: "server-resumed"
        to: "client-receiving"
        trigger_kind: "event"
        trigger: "handshake-complete"
        kind: "stated"
      - id: "M07.T13"
        from: "client-receiving"
        to: "client-aborted"
        trigger_kind: "message"
        trigger: "transparency_info TLS extension (server)"
        guard: "session resumed"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0112"
      - id: "M07.T14"
        from: "client-receiving"
        to: "client-collected"
        trigger_kind: "event"
        trigger: "handshake-complete"
        guard: "not (resumed AND transparency_info present)"
        action: "gather TransItems from transparency_info, the stapled OCSP response extension and the certificate extension; decode each SerializedTransItem on its own, skipping unknown types"
        kind: "stated"
        quotes:
          - source_lines: "1803-1807"
            quote: |-
              This encoding ensures that TLS clients can decode each TransItem individually (so, for example, if there is a version upgrade, out-of-date clients can still parse old TransItem structures while skipping over new TransItem structures whose versions they don't understand).
        constrained_by:
          - "rfc-9162#R-0110"
    error_states:
      - "client-aborted"
      - "server-ext-data-nonempty"
  - id: "M08"
    name: "sct-validation"
    locator: "§8.1.2, §8.1.3, §4.7, §4.8"
    actor: "tls-client (also a submitter, §3)"
    protocol_flow: "F16"
    purpose: "One SCT: rebuild what the log signed and check the signature."
    initial: "awaiting-sct"
    states:
      - name: "awaiting-sct"
        meaning: "No SCT under validation."
        kind: "inferred"
        inferred_reason: "Entry state."
      - name: "dispatch"
        meaning: "Reading the SCT's versioned_type."
        kind: "stated"
      - name: "tbs-unmodified"
        meaning: "x509_sct_v2: the certificate's TBSCertificate as is."
        kind: "stated"
      - name: "tbs-reconstructed"
        meaning: "precert_sct_v2: TBSCertificate without Transparency Information and v1 SCT extensions."
        kind: "stated"
      - name: "looking-up-log"
        meaning: "Finding the log's parameters by log_id."
        kind: "stated"
      - name: "signature-input-built"
        meaning: "The entry TransItem the log signed has been rebuilt."
        kind: "stated"
      - name: "validated"
        meaning: "Signature verified; the SCT counts for compliance."
        kind: "stated"
        terminal: "yes"
      - name: "skipped-unknown-type"
        meaning: "Not a v2 SCT type this client understands; skipped, not an error."
        kind: "stated"
        terminal: "yes"
      - name: "unvalidatable"
        meaning: "No parameters for the log; not validated and not counted."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "signature-invalid"
        meaning: "The signature does not verify."
        kind: "inferred"
        inferred_reason: "The failing outcome of the signature check is implied."
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M08.T01"
        from: "awaiting-sct"
        to: "dispatch"
        trigger_kind: "message"
        trigger: "SignedCertificateTimestampDataV2"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0113"
      - id: "M08.T02"
        from: "dispatch"
        to: "tbs-unmodified"
        trigger_kind: "event"
        trigger: "advance"
        guard: "versioned_type == x509_sct_v2"
        kind: "stated"
        quotes:
          - source_lines: "1921-1923"
            quote: |-
              Validation of an SCT for a certificate (where the type of the TransItem is x509_sct_v2) uses the unmodified TBSCertificate component of the certificate.
        constrained_by:
          - "rfc-9162#R-0378"
      - id: "M08.T03"
        from: "dispatch"
        to: "tbs-reconstructed"
        trigger_kind: "event"
        trigger: "advance"
        guard: "versioned_type == precert_sct_v2"
        constrained_by:
          - "rfc-9162#R-0380"
          - "rfc-9162#R-0381"
          - "rfc-9162#R-0379"
        action: "remove the Transparency Information extension and extension 1.3.6.1.4.1.11129.2.4.2"
        kind: "stated"
        quotes:
          - source_lines: "1930-1933"
            quote: |-
              Remove the Transparency Information extension (see Section 7.1). * Remove embedded v1 SCTs, identified by OID 1.3.6.1.4.1.11129.2.4.2 (see Section 3.3 of [RFC6962]).
      - id: "M08.T04"
        from: "dispatch"
        to: "skipped-unknown-type"
        trigger_kind: "event"
        trigger: "advance"
        guard: "versioned_type is neither x509_sct_v2 nor precert_sct_v2"
        kind: "inferred"
        inferred_reason: "§6.3 lets old clients skip unknown TransItems and §5.1 forbids treating a non-v2 SCT as an error; neither is said of §8.1.3 directly."
        constrained_by:
          - "rfc-9162#R-0069"
      - id: "M08.T05"
        from: "tbs-unmodified"
        to: "looking-up-log"
        trigger_kind: "event"
        trigger: "advance"
        kind: "stated"
      - id: "M08.T06"
        from: "tbs-reconstructed"
        to: "looking-up-log"
        trigger_kind: "event"
        trigger: "advance"
        kind: "stated"
      - id: "M08.T07"
        from: "looking-up-log"
        to: "unvalidatable"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "no parameters for log_id"
        kind: "stated"
        quotes:
          - source_lines: "1960-1963"
            quote: |-
              If the TLS client does not have the corresponding log's parameters, it cannot attempt to validate the SCT. When evaluating compliance (see Section 8.1.6), the TLS client will consider only those SCTs that it was able to validate.
        constrained_by:
          - "rfc-9162#R-0390"
          - "rfc-9162#R-0391"
      - id: "M08.T08"
        from: "looking-up-log"
        to: "signature-input-built"
        trigger_kind: "event"
        trigger: "checks-passed"
        guard: "parameters known"
        action: "TransItem x509_entry_v2 or precert_entry_v2: timestamp and sct_extensions from the SCT, tbs_certificate from the previous state, issuer_key_hash = HASH(issuer SubjectPublicKeyInfo DER)"
        kind: "stated"
        quotes:
          - source_lines: "1941-1953"
            quote: |-
              Compute the signature input by constructing a TransItem of type x509_entry_v2 or precert_entry_v2, depending on the SCT's TransItem type. The TimestampedCertificateEntryDataV2 structure is constructed in the following manner: - timestamp is copied from the SCT. - tbs_certificate is the reconstructed TBSCertificate portion of the server certificate, as described in Section 8.1.2. - issuer_key_hash is computed as described in Section 4.7. - sct_extensions is copied from the SCT.
        constrained_by:
          - "rfc-9162#R-0044"
          - "rfc-9162#R-0382"
          - "rfc-9162#R-0383"
          - "rfc-9162#R-0384"
          - "rfc-9162#R-0385"
          - "rfc-9162#R-0386"
          - "rfc-9162#R-0387"
          - "rfc-9162#R-0468"
      - id: "M08.T09"
        from: "signature-input-built"
        to: "validated"
        trigger_kind: "event"
        trigger: "checks-passed"
        guard: "signature verifies under the log's public key and signature algorithm"
        kind: "stated"
        quotes:
          - source_lines: "1955-1958"
            quote: |-
              Verify the SCT's signature against the computed signature input using the public key of the corresponding log, which is identified by the log_id. The required signature algorithm is one of the log's parameters.
        constrained_by:
          - "rfc-9162#R-0047"
          - "rfc-9162#R-0048"
          - "rfc-9162#R-0388"
          - "rfc-9162#R-0389"
      - id: "M08.T10"
        from: "signature-input-built"
        to: "signature-invalid"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "signature does not verify"
        kind: "inferred"
        inferred_reason: "Implied failing outcome."
    error_states:
      - "unvalidatable"
      - "signature-invalid"
  - id: "M09"
    name: "tls-client-evidence-and-compliance"
    locator: "§8.1.4, §8.1.5, §8.1.6, §11.1"
    actor: "tls-client"
    protocol_flow: "F17, F18"
    purpose: >-
      For each validated SCT, the inclusion and consistency evidence the client gathers; then, per
      connection over all SCTs, the compliance decision. The evidence part is per SCT, the decision
      per handshake; one machine shows how they connect.
    initial: "evidence-pending"
    states:
      - name: "evidence-pending"
        meaning: "An SCT validated (M08); its proof status not yet known."
        kind: "stated"
      - name: "proof-held"
        meaning: "An inclusion proof and STH for the SCT are in hand."
        kind: "stated"
      - name: "fetching-proof"
        meaning: "get-proof-by-hash or get-all-by-hash in flight."
        kind: "stated"
      - name: "no-proof"
        meaning: "No proof, by choice (privacy) or because the fetch failed."
        kind: "inferred"
        inferred_reason: "The converse of the MAY of §8.1.4."
      - name: "verifying-inclusion"
        meaning: "M01 running against the STH."
        kind: "stated"
      - name: "inclusion-verified"
        meaning: "M01 ended in proven."
        kind: "stated"
      - name: "checking-consistency"
        meaning: "M02 between the provided STH and one the client knows."
        kind: "stated"
      - name: "sth-refresh"
        meaning: "The client's STH predates the SCT; fetching a newer STH and a consistency proof."
        kind: "stated"
      - name: "consistent-view"
        meaning: "M02 ended in consistent."
        kind: "stated"
      - name: "evaluating-compliance"
        meaning: "Local policy applied to the validated SCTs and verified proofs of the handshake."
        kind: "stated"
      - name: "compliant"
        meaning: "Policy satisfied."
        kind: "stated"
        terminal: "yes"
      - name: "noncompliant"
        meaning: "Policy not satisfied; handling is local."
        kind: "stated"
        terminal: "yes"
      - name: "not-evaluated"
        meaning: "ClientHello lacked transparency_info or status_request; compliance must not be evaluated."
        kind: "stated"
        terminal: "yes"
      - name: "inclusion-failed"
        meaning: "M01 failed: signed evidence of log misbehaviour."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "consistency-failed"
        meaning: "M02 failed: signed evidence of log misbehaviour."
        kind: "stated"
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M09.T01"
        from: "evidence-pending"
        to: "proof-held"
        trigger_kind: "message"
        trigger: "InclusionProofDataV2"
        guard: "an inclusion proof and STH for this SCT arrived in the handshake"
        kind: "stated"
      - id: "M09.T02"
        from: "evidence-pending"
        to: "fetching-proof"
        trigger_kind: "message"
        trigger: "get-proof-by-hash request"
        guard: "no proof held AND client chooses to fetch (get-all-by-hash request equally)"
        kind: "stated"
        quotes:
          - source_lines: "1975-1979"
            quote: |-
              Note that fetching inclusion proofs directly from a log will disclose to the log which TLS server the client has been communicating with. This may be regarded as a significant privacy concern, and so it is preferable for the TLS server to send the inclusion proofs (see Section 6.4).
        constrained_by:
          - "rfc-9162#R-0114"
      - id: "M09.T03"
        from: "evidence-pending"
        to: "no-proof"
        trigger_kind: "event"
        trigger: "advance"
        guard: "no proof held AND client does not fetch"
        kind: "inferred"
        inferred_reason: "The MAY permits not fetching."
      - id: "M09.T04"
        from: "fetching-proof"
        to: "proof-held"
        trigger_kind: "message"
        trigger: "get-proof-by-hash response"
        kind: "stated"
        note: "or get-all-by-hash response"
      - id: "M09.T05"
        from: "fetching-proof"
        to: "no-proof"
        trigger_kind: "message"
        trigger: "Error response (problem details)"
        kind: "inferred"
        inferred_reason: "The source gives the log's errors but not the TLS client's reaction to them."
      - id: "M09.T06"
        from: "proof-held"
        to: "verifying-inclusion"
        trigger_kind: "event"
        trigger: "advance"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0115"
          - "rfc-9162#R-0476"
      - id: "M09.T07"
        from: "verifying-inclusion"
        to: "inclusion-verified"
        trigger_kind: "event"
        trigger: "proof-verified"
        kind: "stated"
      - id: "M09.T08"
        from: "verifying-inclusion"
        to: "inclusion-failed"
        trigger_kind: "event"
        trigger: "proof-failed"
        kind: "stated"
      - id: "M09.T09"
        from: "inclusion-verified"
        to: "checking-consistency"
        trigger_kind: "event"
        trigger: "advance"
        guard: "client holds another STH of this log"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0116"
      - id: "M09.T10"
        from: "inclusion-verified"
        to: "evaluating-compliance"
        trigger_kind: "event"
        trigger: "advance"
        guard: "no other STH held, or the client skips the SHOULD"
        kind: "inferred"
        inferred_reason: "The path the SHOULD permits; not described."
      - id: "M09.T11"
        from: "checking-consistency"
        to: "sth-refresh"
        trigger_kind: "message"
        trigger: "get-sth request and response"
        guard: "held STH predates the SCT"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0117"
      - id: "M09.T12"
        from: "sth-refresh"
        to: "checking-consistency"
        trigger_kind: "message"
        trigger: "get-sth-consistency response"
        kind: "stated"
      - id: "M09.T13"
        from: "checking-consistency"
        to: "consistent-view"
        trigger_kind: "event"
        trigger: "proof-verified"
        kind: "stated"
      - id: "M09.T14"
        from: "checking-consistency"
        to: "consistency-failed"
        trigger_kind: "event"
        trigger: "proof-failed"
        kind: "stated"
      - id: "M09.T15"
        from: "consistent-view"
        to: "evaluating-compliance"
        trigger_kind: "event"
        trigger: "advance"
        kind: "stated"
      - id: "M09.T16"
        from: "no-proof"
        to: "evaluating-compliance"
        trigger_kind: "event"
        trigger: "advance"
        kind: "stated"
      - id: "M09.T17"
        from: "evaluating-compliance"
        to: "not-evaluated"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "ClientHello lacked transparency_info or status_request"
        kind: "stated"
        quotes:
          - source_lines: "2000-2003"
            quote: |-
              A TLS client can only evaluate compliance if it has given the TLS server the opportunity to send SCTs and inclusion proofs by any of the three mechanisms that are mandatory to implement for CT-using TLS clients (see Section 8.1.1).
        constrained_by:
          - "rfc-9162#R-0118"
      - id: "M09.T18"
        from: "evaluating-compliance"
        to: "compliant"
        trigger_kind: "event"
        trigger: "checks-passed"
        guard: "local policy met by the validated SCTs and verified proofs"
        kind: "stated"
        quotes:
          - source_lines: "1996-1998"
            quote: |-
              It is up to a client's local policy to specify the quantity and form of evidence (SCTs, inclusion proofs, or a combination) needed to achieve compliance and how to handle noncompliance.
      - id: "M09.T19"
        from: "evaluating-compliance"
        to: "noncompliant"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "local policy not met; a certificate with no valid SCT never meets it"
        kind: "stated"
        quotes:
          - source_lines: "2571-2572"
            quote: |-
              Misissued certificates that have not been publicly logged, and thus do not have a valid SCT, are not considered compliant.
    error_states:
      - "inclusion-failed"
      - "consistency-failed"
  - id: "M10"
    name: "monitor"
    locator: "§8.2"
    actor: "monitor"
    protocol_flow: "F19, F20"
    purpose: "One log watched by one monitor: the first full pass (§8.2 first list), then the repeated new-entry loop (second list)."
    initial: "start"
    states:
      - name: "start"
        meaning: "The monitor begins watching a log."
        kind: "inferred"
        inferred_reason: "Entry state."
      - name: "init-sth-fetched"
        meaning: "First list, step 1 done."
        kind: "stated"
      - name: "init-sth-verified"
        meaning: "First list, step 2 done."
        kind: "stated"
      - name: "init-entries-fetched"
        meaning: "First list, steps 3 and 4 done (all entries, interest checked)."
        kind: "stated"
      - name: "watching"
        meaning: "Second list, step 1: polling get-sth until it changes."
        kind: "stated"
      - name: "new-sth-verified"
        meaning: "Second list, step 2 done."
        kind: "stated"
      - name: "new-entries-fetched"
        meaning: "Second list, steps 3 and 4 done."
        kind: "stated"
      - name: "consistency-fetched"
        meaning: "Second list, step 5 (not keeping entries), a and b: proof fetched and checked by M02."
        kind: "stated"
      - name: "sth-signature-invalid"
        meaning: "An STH signature failed."
        kind: "inferred"
        inferred_reason: "The failing outcome of step 2 is implied."
        error: "yes"
        terminal: "yes"
      - name: "root-mismatch"
        meaning: "The entries do not rebuild the STH root (M03 mismatch)."
        kind: "inferred"
        inferred_reason: "Implied failing outcome of step 5."
        error: "yes"
        terminal: "yes"
      - name: "entries-unavailable"
        meaning: "New entries unavailable for an extended period: log misbehaviour."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "consistency-failed"
        meaning: "The consistency proof, or the new entries against it, failed."
        kind: "inferred"
        inferred_reason: "Implied failing outcome of step 5 b and c."
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M10.T01"
        from: "start"
        to: "init-sth-fetched"
        trigger_kind: "message"
        trigger: "get-sth request and response"
        kind: "stated"
        quotes:
          - source_lines: "2020"
            quote: |-
              Fetch the current STH (Section 5.2).
        constrained_by:
          - "rfc-9162#R-0120"
          - "rfc-9162#R-0395"
      - id: "M10.T02"
        from: "init-sth-fetched"
        to: "init-sth-verified"
        trigger_kind: "event"
        trigger: "checks-passed"
        guard: "STH signature valid"
        kind: "stated"
        quotes:
          - source_lines: "2022"
            quote: |-
              Verify the STH signature.
        constrained_by:
          - "rfc-9162#R-0396"
      - id: "M10.T03"
        from: "init-sth-fetched"
        to: "sth-signature-invalid"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "STH signature invalid"
        kind: "inferred"
        inferred_reason: "Implied."
      - id: "M10.T04"
        from: "init-sth-verified"
        to: "init-entries-fetched"
        trigger_kind: "message"
        trigger: "get-entries response"
        guard: "entries 0 to tree_size - 1 all received (F10, repeated)"
        constrained_by:
          - "rfc-9162#R-0397"
          - "rfc-9162#R-0398"
        action: "check each entry for certificates of interest"
        kind: "stated"
        quotes:
          - source_lines: "2024-2028"
            quote: |-
              Fetch all the entries in the tree corresponding to the STH (Section 5.6). 4. If applicable, check each entry to see if it's a certificate of interest.
      - id: "M10.T05"
        from: "init-entries-fetched"
        to: "watching"
        trigger_kind: "event"
        trigger: "proof-verified"
        guard: "M03 verified against the STH"
        kind: "stated"
        quotes:
          - source_lines: "2030-2031"
            quote: |-
              Confirm that the tree made from the fetched entries produces the same hash as that in the STH.
        constrained_by:
          - "rfc-9162#R-0399"
      - id: "M10.T06"
        from: "init-entries-fetched"
        to: "root-mismatch"
        trigger_kind: "event"
        trigger: "proof-failed"
        guard: "M03 mismatch"
        kind: "inferred"
        inferred_reason: "Implied."
      - id: "M10.T07"
        from: "watching"
        to: "watching"
        trigger_kind: "event"
        trigger: "poll"
        guard: "STH unchanged"
        kind: "stated"
        quotes:
          - source_lines: "2036-2038"
            quote: |-
              Repeat until the STH changes. To allow for experimentation, this document does not specify the polling frequency.
        constrained_by:
          - "rfc-9162#R-0121"
          - "rfc-9162#R-0119"
          - "rfc-9162#R-0393"
          - "rfc-9162#R-0400"
          - "rfc-9162#R-0401"
      - id: "M10.T08"
        from: "watching"
        to: "new-sth-verified"
        trigger_kind: "message"
        trigger: "get-sth request and response"
        guard: "STH changed AND signature valid"
        kind: "stated"
        quotes:
          - source_lines: "2040"
            quote: |-
              Verify the STH signature.
        constrained_by:
          - "rfc-9162#R-0402"
      - id: "M10.T09"
        from: "watching"
        to: "sth-signature-invalid"
        trigger_kind: "message"
        trigger: "get-sth request and response"
        guard: "STH changed AND signature invalid"
        kind: "inferred"
        inferred_reason: "Implied."
      - id: "M10.T10"
        from: "new-sth-verified"
        to: "new-entries-fetched"
        trigger_kind: "message"
        trigger: "get-entries response"
        guard: "entries from the old tree_size to the new tree_size - 1 received"
        constrained_by:
          - "rfc-9162#R-0403"
          - "rfc-9162#R-0404"
          - "rfc-9162#R-0405"
        action: "check each new entry for certificates of interest"
        kind: "stated"
        quotes:
          - source_lines: "2042-2048"
            quote: |-
              Fetch all the new entries in the tree corresponding to the STH (Section 5.6). If they remain unavailable for an extended period, then this should be viewed as misbehavior on the part of the log. 4. If applicable, check each entry to see if it's a certificate of interest.
      - id: "M10.T11"
        from: "new-sth-verified"
        to: "entries-unavailable"
        trigger_kind: "event"
        trigger: "timeout"
        guard: "new entries still unavailable after an extended period"
        kind: "stated"
      - id: "M10.T12"
        from: "new-entries-fetched"
        to: "watching"
        trigger_kind: "event"
        trigger: "proof-verified"
        guard: "monitor keeps all entries AND M03 over the updated list verifies against the new STH"
        kind: "stated"
        quotes:
          - source_lines: "2052-2053"
            quote: |-
              Verify that the updated list of all entries generates a tree with the same hash as the new STH.
        constrained_by:
          - "rfc-9162#R-0119"
          - "rfc-9162#R-0394"
          - "rfc-9162#R-0407"
          - "rfc-9162#R-0406"
      - id: "M10.T13"
        from: "new-entries-fetched"
        to: "root-mismatch"
        trigger_kind: "event"
        trigger: "proof-failed"
        guard: "monitor keeps all entries AND M03 mismatch"
        kind: "inferred"
        inferred_reason: "Implied."
      - id: "M10.T14"
        from: "new-entries-fetched"
        to: "consistency-fetched"
        trigger_kind: "message"
        trigger: "get-sth-consistency response"
        guard: "monitor does not keep all entries AND M02 consistent (previous STH to new)"
        kind: "stated"
        quotes:
          - source_lines: "2055-2060"
            quote: |-
              Or, if it is not keeping all log entries: a. Fetch a consistency proof for the new STH with the previous STH (Section 5.3). b. Verify the consistency proof.
        constrained_by:
          - "rfc-9162#R-0408"
          - "rfc-9162#R-0409"
          - "rfc-9162#R-0410"
          - "rfc-9162#R-0406"
      - id: "M10.T15"
        from: "new-entries-fetched"
        to: "consistency-failed"
        trigger_kind: "message"
        trigger: "get-sth-consistency response"
        guard: "monitor does not keep all entries AND M02 failed"
        kind: "inferred"
        inferred_reason: "Implied."
      - id: "M10.T16"
        from: "consistency-fetched"
        to: "watching"
        trigger_kind: "event"
        trigger: "checks-passed"
        guard: "the new entries generate the corresponding proof elements (procedure not given: OI-04)"
        kind: "stated"
        quotes:
          - source_lines: "2062-2065"
            quote: |-
              Verify that the new entries generate the corresponding elements in the consistency proof. 6. Repeat from Step 1.
        constrained_by:
          - "rfc-9162#R-0411"
          - "rfc-9162#R-0412"
      - id: "M10.T17"
        from: "consistency-fetched"
        to: "consistency-failed"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "the new entries do not generate the proof elements"
        kind: "inferred"
        inferred_reason: "Implied."
    error_states:
      - "sth-signature-invalid"
      - "root-mismatch"
      - "entries-unavailable"
      - "consistency-failed"
  - id: "M11"
    name: "mmd-audit"
    locator: "§8.3, §11.3, §8.1.4"
    actor: "auditor (a TLS client or a monitor)"
    protocol_flow: "F21"
    purpose: >-
      Per observed SCT: wait for an STH dated at least the SCT timestamp plus the MMD, request the
      inclusion proof in it, and decide whether the log kept its promise. Once per certificate,
      asynchronously.
    initial: "sct-observed"
    states:
      - name: "sct-observed"
        meaning: "An SCT seen with a certificate; its entry checked to be that certificate or its precertificate."
        kind: "stated"
      - name: "awaiting-mature-sth"
        meaning: "No STH yet dated at or after SCT timestamp + MMD."
        kind: "stated"
      - name: "mature-sth-held"
        meaning: "An STH with timestamp >= SCT timestamp + MMD is held."
        kind: "stated"
      - name: "proof-requested"
        meaning: "get-proof-by-hash in flight for that STH's tree_size."
        kind: "stated"
      - name: "verifying"
        meaning: "M01 running."
        kind: "stated"
      - name: "indeterminate"
        meaning: "hashUnknown (skew or not merged); no conclusion yet."
        kind: "inferred"
        inferred_reason: "The source defines hashUnknown but no auditor reaction (OI-05)."
      - name: "promise-kept"
        meaning: "The entry is in the mature STH."
        kind: "stated"
        terminal: "yes"
      - name: "mmd-violated"
        meaning: "The entry is not in an STH dated after SCT timestamp + MMD: signed proof of misbehaviour."
        kind: "stated"
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M11.T01"
        from: "sct-observed"
        to: "awaiting-mature-sth"
        trigger_kind: "event"
        trigger: "advance"
        guard: "no STH with timestamp >= sct.timestamp + MMD held"
        kind: "stated"
        quotes:
          - source_lines: "2101-2106"
            quote: |-
              A TLS client (Section 8.1) can audit by verifying an SCT against any STH dated after the SCT timestamp + the Maximum Merge Delay by requesting a Merkle inclusion proof (Section 5.4). It can also verify that the SCT corresponds to the server certificate it arrived with (i.e., the log entry is that certificate or is a precertificate corresponding to that certificate).
        constrained_by:
          - "rfc-9162#R-0418"
          - "rfc-9162#R-0413"
          - "rfc-9162#R-0414"
          - "rfc-9162#R-0474"
          - "rfc-9162#R-0491"
      - id: "M11.T02"
        from: "sct-observed"
        to: "mature-sth-held"
        trigger_kind: "event"
        trigger: "advance"
        guard: "an STH with timestamp >= sct.timestamp + MMD held"
        kind: "stated"
      - id: "M11.T03"
        from: "awaiting-mature-sth"
        to: "mature-sth-held"
        trigger_kind: "message"
        trigger: "get-sth request and response"
        guard: "sth.timestamp >= sct.timestamp + MMD"
        kind: "stated"
      - id: "M11.T04"
        from: "mature-sth-held"
        to: "proof-requested"
        trigger_kind: "message"
        trigger: "get-proof-by-hash request"
        constrained_by:
          - "rfc-9162#R-0458"
        action: "hash = leaf hash of the SCT's entry; tree_size = the mature STH's"
        kind: "stated"
        quotes:
          - source_lines: "2596-2600"
            quote: |-
              Violation of the MMD contract is detected by log clients requesting a Merkle inclusion proof (Section 5.4) for each observed SCT. These checks can be asynchronous and need only be done once per certificate. However, note that there may be privacy concerns (see Section 8.1.4).
      - id: "M11.T05"
        from: "proof-requested"
        to: "verifying"
        trigger_kind: "message"
        trigger: "get-proof-by-hash response"
        kind: "stated"
      - id: "M11.T06"
        from: "proof-requested"
        to: "indeterminate"
        trigger_kind: "message"
        trigger: "Error response (problem details)"
        guard: "type hashUnknown"
        kind: "inferred"
        inferred_reason: "OI-05."
      - id: "M11.T07"
        from: "indeterminate"
        to: "proof-requested"
        trigger_kind: "event"
        trigger: "timeout"
        guard: "retry later (skew may resolve)"
        kind: "inferred"
        inferred_reason: "OI-05; §5 allows retrying."
      - id: "M11.T08"
        from: "indeterminate"
        to: "mmd-violated"
        trigger_kind: "event"
        trigger: "timeout"
        guard: "the log, given time beyond any plausible skew, still does not know the leaf in an STH dated after sct.timestamp + MMD"
        kind: "inferred"
        inferred_reason: "OI-05: the source sets no bound."
      - id: "M11.T09"
        from: "verifying"
        to: "promise-kept"
        trigger_kind: "event"
        trigger: "proof-verified"
        kind: "stated"
      - id: "M11.T10"
        from: "verifying"
        to: "mmd-violated"
        trigger_kind: "event"
        trigger: "proof-failed"
        kind: "stated"
        quotes:
          - source_lines: "2092-2094"
            quote: |-
              The action taken by the auditor, if an audit fails, is not specified, but note that in general, if an audit fails, the auditor is in possession of signed proof of the log's misbehavior.
    error_states:
      - "mmd-violated"
  - id: "M12"
    name: "sth-audit"
    locator: "§8.3, §11.3, §4.10"
    actor: "auditor (a TLS client or a monitor)"
    protocol_flow: "F21"
    purpose: >-
      Over the STHs one auditor sees from one log: signature, timestamp order, append-only (M02
      between successive STHs) and the frequency count. A split view needs other parties' STHs
      (gossip), which the source does not define.
    initial: "idle"
    states:
      - name: "idle"
        meaning: "Waiting for the next STH."
        kind: "inferred"
        inferred_reason: "Resting state."
      - name: "sth-received"
        meaning: "A new STH from the log."
        kind: "stated"
      - name: "signature-checked"
        meaning: "Signature valid and timestamp later than the previous STH's."
        kind: "stated"
      - name: "append-only-checked"
        meaning: "M02 consistent between the previous and the new STH."
        kind: "stated"
      - name: "bad-signature"
        meaning: "The STH signature does not verify."
        kind: "inferred"
        inferred_reason: "Implied."
        error: "yes"
        terminal: "yes"
      - name: "timestamp-regressed"
        meaning: "The new STH is not more recent than the previous one."
        kind: "inferred"
        inferred_reason: "The violation of §4.10's MUST, checkable by any client; the check itself is not described."
        error: "yes"
        terminal: "yes"
      - name: "append-only-violated"
        meaning: "No valid consistency proof, or a root that does not match a copy of the log."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "rate-violated"
        meaning: "STHs issued too close together for the STH Frequency Count."
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "view-split"
        meaning: "Another party holds a conflicting STH (gossip; not defined)."
        kind: "stated"
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M12.T01"
        from: "idle"
        to: "sth-received"
        trigger_kind: "message"
        trigger: "get-sth request and response"
        kind: "stated"
      - id: "M12.T02"
        from: "sth-received"
        to: "bad-signature"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "signature invalid"
        kind: "inferred"
        inferred_reason: "Implied."
      - id: "M12.T03"
        from: "sth-received"
        to: "timestamp-regressed"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "signature valid AND timestamp <= previous STH timestamp"
        kind: "inferred"
        inferred_reason: "As the state."
        constrained_by:
          - "rfc-9162#R-0059"
      - id: "M12.T04"
        from: "sth-received"
        to: "signature-checked"
        trigger_kind: "event"
        trigger: "checks-passed"
        kind: "stated"
      - id: "M12.T05"
        from: "signature-checked"
        to: "append-only-checked"
        trigger_kind: "message"
        trigger: "get-sth-consistency response"
        guard: "M02 consistent from the previous STH to this one"
        constrained_by:
          - "rfc-9162#R-0203"
          - "rfc-9162#R-0416"
          - "rfc-9162#R-0475"
        kind: "stated"
        quotes:
          - source_lines: "2096-2097"
            quote: |-
              A monitor (Section 8.2) can audit by verifying the consistency of STHs it receives,
      - id: "M12.T06"
        from: "signature-checked"
        to: "append-only-violated"
        trigger_kind: "message"
        trigger: "get-sth-consistency response"
        guard: "M02 failed"
        kind: "stated"
        quotes:
          - source_lines: "2602-2609"
            quote: |-
              Violation of the append-only property or the STH issuance rate limit can be detected by multiple clients comparing their instances of the STHs. This technique, known as "gossip", is an active area of research and not defined here. Proof of misbehavior in such cases would be either a series of STHs that were issued too closely together, proving violation of the STH issuance rate limit, or an STH with a root hash that does not match the one calculated from a copy of the log, proving violation of the append-only property.
      - id: "M12.T07"
        from: "append-only-checked"
        to: "rate-violated"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "more STHs dated within one MMD-long period than the STH Frequency Count"
        kind: "stated"
        constrained_by:
          - "rfc-9162#R-0056"
          - "rfc-9162#R-0415"
      - id: "M12.T08"
        from: "append-only-checked"
        to: "idle"
        trigger_kind: "event"
        trigger: "checks-passed"
        kind: "stated"
      - id: "M12.T09"
        from: "idle"
        to: "view-split"
        trigger_kind: "event"
        trigger: "check-failed"
        guard: "an STH from another party conflicts (same tree_size, other root; or no consistency between them)"
        constrained_by:
          - "rfc-9162#R-0417"
        kind: "stated"
        quotes:
          - source_lines: "2108-2111"
            quote: |-
              Checking of the consistency of the log view presented to all entities is more difficult to perform because it requires a way to share log responses among a set of CT-using entities and is discussed in Section 11.3.
        note: "How STHs are shared is not defined (gossip, §11.3)."
    error_states:
      - "bad-signature"
      - "timestamp-regressed"
      - "append-only-violated"
      - "rate-violated"
      - "view-split"
source_tensions:
  - id: "SD-01"
    where: "M02.T01, M02.T02"
    text: "The empty proof §5.3 mandates for equal sizes ends in failed-empty-path; executed 64 of 64. Full record in protocol.yaml SD-01."
  - id: "SD-08"
    where: "M04.T09, M04.T12"
    text: "Key destruction after the final STH collides with §4.10's freshness rules. protocol.yaml SD-08."
  - id: "SD-11"
    where: "M01.T17, M02.T24"
    text: "The or-fn-is-0 exits are unreachable; erratum 8670 (editorial) concerns their wording. protocol.yaml SD-11."
  - id: "SD-12"
    where: "M03.T11"
    text: "§2.1.2 has no result for tree_size 0. protocol.yaml SD-12."
  - id: "OI-09"
    where: "M08.T03"
    text: "The precertificate TBSCertificate differs from the issued one by the Transparency Information extension only, yet validation also strips embedded v1 SCTs (Appendix A builds certificates that carry them). protocol.yaml OI-09, normative.md SD-11."
  - id: "OI-10"
    where: "M06.T02, M06.T03"
    text: "Re-signing the same root for an idle MMD period (M06.T02) gives a second STH for one tree_size; the one-STH-per-tree_size mitigation named in M06.T03 cannot hold for such a log, only deterministic signatures satisfy both. protocol.yaml OI-10, normative.md SD-12."
  - id: "OI-11"
    where: "M04.T05"
    text: "Deprecating an algorithm makes freezing a MUST as specified in section 4.13, whose actions are SHOULD; which ones become mandatory is undetermined. protocol.yaml OI-11, normative.md SD-14."
  - id: "SD-06, SD-07"
    where: "M07.T08, M07.T09"
    text: "TransItemList with no SCT after omission; empty list not encodable. protocol.yaml SD-06, SD-07."
  - id: "OI-04, OI-05"
    where: "M10.T16, M11.T06 to M11.T08"
    text: "No procedure for checking new entries against a consistency proof; no bound turning hashUnknown into an MMD violation."
not_modelled:
  - text: "Front-end response selection under skew for §5.3 to §5.6: decision tables, modelled as guarded steps in protocol.yaml F07 to F10, not as machines."
  - text: "Client retry after HTTP errors (§5): protocol.yaml F12."
  - text: "Proof generation (§2.1.3.1, §2.1.4.1): pure recursive functions with no lifecycle; protocol.yaml F25, F27."
  - text: "Gossip and the reaction to misbehaviour: not defined by the source."
coverage: >-
  12 machines, 152 states (28 kind inferred), 188 transitions (32 kind inferred), counted by script
  with bin/_yaml.py. Every transition's from and to is a state of its machine, every state is
  reachable from the initial state, every non-terminal state has an exit, error_states equals the
  set of states marked error, and every trigger is a messages.yaml name (trigger_kind message) or
  an event defined above (trigger_kind event). constrained_by: 76 links to 62 distinct requirement
  ids at pass 1; 162 links to 148 distinct ids after pass 2 added 86 by quotation containment; 186 links to 171 distinct ids after pass 3 (cross-check) wired ids cited by none of the three artifacts. 79 quotations, checked by bin/check-quotes. M01, M02 and M03 were also interpreted literally
  (guards and actions as written here) against a reference implementation of the printed
  algorithms over every tree of 1 to 40 leaves: 2460 inclusion and 2340 consistency verdicts
  agree, valid and tampered; the tree rebuild agrees for 80 of 81 cases, the exception being
  tree_size 0 (SD-12). The only transitions never taken were M01.T02 and M02.T02 (inputs the run
  did not generate; M02.T02 is the equal-size case, run separately) and the two unreachable exits.
