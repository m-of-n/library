    field: 'HASH_SIZE'
    testable: 'yes'
    note: 'The §10.2.1 expert criteria (R-0427) do not mention this floor.'
  - id: 'rfc-9162#R-0470'
    locator: '§4.9'
    text: 'Every NodeHash is encoded with its own one-octet length prefix (equal to HASH_SIZE) before the hash value: root_hash in TreeHeadDataV2 and each element of consistency_path and inclusion_path, which as vectors also carry a two-octet length for the whole list.'
    verb: 'none'
    kind: inferred
    derived_from: '§1.2 L231-232 (RFC 8446 §3.4); §4.9 L1121; §4.11 L1193; §4.12 L1216'
    actor: 'log (encoder); clients (decoders)'
    object: 'NodeHash'
    field: 'NodeHash length octet; path vector length'
    testable: 'yes'
    note: 'For SHA-256 each node occupies 33 octets inside the path vector.'
  - id: 'rfc-9162#R-0471'
    locator: '§5'
    text: 'Binary values in §5 messages use the base64 alphabet of RFC 4648 §4 (with + and /) and its = padding, not base64url; RFC 4648 §3.2 requires the padding unless the referring document says otherwise, and §5 does not.'
    verb: 'none'
    kind: inferred
    derived_from: '§5 L1268-1269'
    actor: 'log and client'
    object: 'binary values in §5 messages'
    field: 'base64 encoding'
    testable: 'yes'
  - id: 'rfc-9162#R-0472'
    locator: '§5'
    text: 'A base64 value sent as a GET parameter (the hash of get-proof-by-hash and get-all-by-hash) must be percent-encoded as application/x-www-form-urlencoded requires; an unencoded + would be read back as a space.'
    verb: 'none'
    kind: inferred
    derived_from: '§5 L1265-1269; §5.4 L1502; §5.5 L1550'
    actor: 'client'
    object: 'GET query strings'
    field: 'hash (input)'
    testable: 'yes'
  - id: 'rfc-9162#R-0473'
    locator: '§5'
    text: 'A request URL is the Base URL followed directly by the suffix each endpoint prints after <Base URL> (for example /ct/v2/get-sth), with GET parameters as a query string; because the Base URL never ends in a slash, exactly one slash precedes ct.'
    verb: 'none'
    kind: inferred
    derived_from: '§5 L1272-1273; endpoint lines L1356, L1438, L1448, L1499, L1547, L1606, L1690; §4.1 L819-822'
    actor: 'client'
    object: 'request URLs'
    field: 'Base URL; endpoint suffix'
    testable: 'yes'
  - id: 'rfc-9162#R-0474'
    locator: '§4'
    text: 'Every STH dated later than an SCT timestamp plus the log MMD must have a tree_size that includes that SCT entry, so that an inclusion proof to that STH can be obtained; this is the outside view of R-0024 that §8.3 audits.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0024 L793-796; §4 L792-793; §8.3 L2101-2103; §11.1 L2573-2575'
    actor: 'log'
    object: 'STHs after the merge deadline'
    field: 'tree_head.timestamp, tree_size; SCT timestamp; Maximum Merge Delay'
    testable: 'yes'
    note: 'MMD has no stated unit while timestamps are milliseconds; convert before comparing.'
  - id: 'rfc-9162#R-0475'
    locator: '§4'
    text: 'The STHs of one log must form one consistent sequence: an STH with a later timestamp has a tree_size at least that of every earlier one, and a consistency proof between any two of them verifies.'
    verb: 'none'
    kind: inferred
    derived_from: '§4 L777-778; R-0059 L1174-1175; §2.1.4'
    actor: 'log'
    object: 'sequence of STHs'
    field: 'tree_head.timestamp, tree_size, root_hash'
    testable: 'yes'
  - id: 'rfc-9162#R-0476'
    locator: '§8.1.5'
    text: 'Before relying on an inclusion proof to a provided STH, a TLS client should verify that STH signature over tree_head with the key of the log named by log_id; §8.2 lists this step for monitors, but §8.1.5 does not state it for TLS clients.'
    verb: 'none'
    kind: inferred
    derived_from: '§8.1.5 L1983-1986; §4.10 L1180-1181; §8.2 L2022, L2040'
    actor: 'TLS client'
    object: 'provided STH'
    field: 'signature (over tree_head)'
    testable: 'yes'
  - id: 'rfc-9162#R-0477'
    locator: '§4.7'
    text: 'issuer_key_hash is computed over the SubjectPublicKeyInfo of the certifier of the submission: the first element of chain or, when chain is empty, the accepted trust anchor that certifies the submission, taken from the log anchor list; for a precertificate that is the CA whose signature the CMS object carries.'
    verb: 'none'
    kind: inferred
    derived_from: '§4.7 L1064-1066; §5.1 L1365-1370, L1427-1429; §3.2 L734-736'
    actor: 'log; TLS client'
    object: 'TimestampedCertificateEntryDataV2'
    field: 'issuer_key_hash'
    testable: 'yes'
    note: 'A TLS client takes the issuer from the server certificate chain it validated (§8.1.3 points back to §4.7).'
  - id: 'rfc-9162#R-0478'
    locator: '§4.2.1'
    text: 'To apply R-0036 to the signature rule R-0020, the log has to verify the precertificate CMS signature with the public key of the certifier (the first element of chain, or the anchor when chain is empty); a failure has no named error, and both badSubmission and badChain fit.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0020 L734-736; R-0036 L899-900; §5.1 L1365-1370; Table 2'
    actor: 'log'
    object: 'precertificate submission'
    field: 'SignerInfo.signature'
    testable: 'partial'
    testable_reason: 'the verification is testable; the error token is not specified.'
  - id: 'rfc-9162#R-0479'
    locator: '§3.2'
    text: 'A precertificate submission is read as the DER encoding of a CMS ContentInfo whose contentType is id-signedData, carrying the profiled SignedData; §3.2 calls it a CMS signed-data object and profiles SignedData fields but never says whether the ContentInfo wrapper is present.'
    verb: 'none'
    kind: inferred
    derived_from: '§3.2 L690-691; R-0007; §5.1 L1359'
    actor: 'CA; log'
    object: 'precertificate encoding'
    field: 'submission bytes'
    testable: 'partial'
    testable_reason: 'an interoperability choice the source leaves open; test that a log accepts the ContentInfo form.'
    note: 'Open question: the ContentInfo reading is the conventional CMS encoding, not a stated rule.'
  - id: 'rfc-9162#R-0480'
    locator: '§5.1'
    text: 'A log rejecting a submission for a reason Table 2 does not name (an intermediate without cA or keyCertSign, a pathLenConstraint violation, an over-long chain, a precertificate outside the §3.2 profile, or temporary overload) still answers with a 4xx or 5xx status and a problem details body; which type token it uses is not specified.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0032 to R-0037; R-0292; R-0293; Table 2 L1389-1409; R-0228'
    actor: 'log'
    object: 'submit-entry error response'
    field: 'type token'
    testable: 'partial'
    testable_reason: 'status class and body shape are testable; the token is not.'
  - id: 'rfc-9162#R-0481'
    locator: '§5.6'
    text: 'A get-entries request with start equal to the number of entries is not startUnknown (start is not greater than that number) and lies outside the range R-0084 honours; under R-0088 it gets an empty entries array, with the latest STH (R-0089).'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0084 L1650-1652; R-0088 L1664-1666; Table 6 L1679-1680'
    actor: 'log'
    object: 'get-entries response at start = tree_size'
    field: 'entries (empty)'
    testable: 'yes'
  - id: 'rfc-9162#R-0482'
    locator: '§5.6'
    text: 'When a submission left out its trust anchor, the log adds the anchor as the last element of submitted_entry.chain, which keeps the certifier-first order the chain input defines.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0082 L1644-1646; §5.1 L1365-1370; §5.6 L1619-1622'
    actor: 'log'
    object: 'get-entries response'
    field: 'entries[].submitted_entry.chain (last element)'
    testable: 'yes'
  - id: 'rfc-9162#R-0483'
    locator: '§5.6'
    text: 'A client that needs a range of entries must repeat get-entries from the first index not yet received until it reaches end, because a log may return fewer entries than requested (R-0085 to R-0087) and may change that limit at any time.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0085; R-0086; R-0087; §5.6 L1659-1662'
    actor: 'client of get-entries (monitor, auditor)'
    object: 'get-entries requests'
    field: 'start, end; entries length'
    testable: 'yes'
  - id: 'rfc-9162#R-0484'
    locator: '§5.3'
    text: 'When get-sth-consistency also returns an sth, consistency.tree_size_2 must equal that STH tree_size, since the proof then runs from the first STH to the returned one.'
    verb: 'none'
    kind: inferred
    derived_from: '§5.3 L1458-1461; R-0075'
    actor: 'log front end'
    object: 'get-sth-consistency response'
    field: 'consistency.tree_size_2; sth.tree_head.tree_size'
    testable: 'yes'
  - id: 'rfc-9162#R-0485'
    locator: '§5.4'
    text: 'In a get-proof-by-hash response, inclusion.tree_size must equal the requested tree_size when no sth is returned, and the returned STH tree_size when one is.'
    verb: 'none'
    kind: inferred
    derived_from: '§5.4 L1509-1512, L1515-1518'
    actor: 'log front end'
    object: 'get-proof-by-hash response'
    field: 'inclusion.tree_size; sth.tree_head.tree_size'
    testable: 'yes'
  - id: 'rfc-9162#R-0486'
    locator: '§6.5'
    text: 'In TLS 1.3 the server carries transparency_info in the extensions of the CertificateEntry of its end-entity certificate, where RFC 8446 §4.4.2 places per-certificate extensions; RFC 9162 names only the messages (Certificate or CertificateRequest for TLS 1.3, R-0375; ServerHello for TLS 1.2 or earlier), never the CertificateEntry within Certificate.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0099 L1839-1844; R-0375; RFC 8446 §4.4.2'
    actor: 'TLS server (TLS 1.3)'
    object: 'Certificate message'
    field: 'CertificateEntry extensions'
    testable: 'yes'
  - id: 'rfc-9162#R-0487'
    locator: '§6.3'
    text: 'A TLS client must skip a SerializedTransItem whose versioned_type it does not recognize and carry on with the rest of the TransItemList, rather than reject the list.'
    verb: 'none'
    kind: inferred
    derived_from: '§6.3 L1803-1807; R-0079 (the same rule for get-entries)'
    candidate: 'C-0189'
    actor: 'TLS client'
    object: 'TransItemList'
    field: 'SerializedTransItem'
    testable: 'yes'
  - id: 'rfc-9162#R-0488'
    locator: '§2.1.1'
    text: 'An empty log tree head has tree_size 0 and root_hash HASH() (for SHA-256, e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855), and the log still signs such heads (R-0055, R-0057); a verifier must accept it although the §2.1.2 procedure leaves no element for an empty list.'
    verb: 'none'
    kind: inferred
    derived_from: '§2.1.1 L331-333; R-0055; R-0057; §2.1.2 L391-397'
    actor: 'log; monitor'
    object: 'STH of an empty log'
    field: 'tree_size 0; root_hash'
    testable: 'yes'
    note: 'The §2.1.2 gap is SD-16.'
  - id: 'rfc-9162#R-0489'
    locator: '§4.8'
    source_lines: '1103'
