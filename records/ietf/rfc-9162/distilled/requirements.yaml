  - id: 'rfc-9162#R-0491'
    locator: '§8.3'
    source_lines: '2103-2106'
    text: 'It can also verify that the SCT corresponds to the server certificate it arrived with (i.e., the log entry is that certificate or is a precertificate corresponding to that certificate).'
    verb: 'none'
    kind: stated
    actor: 'TLS client (auditor)'
    object: 'SCT audit against the server certificate'
    field: 'SCT; server certificate; log entry (certificate or corresponding precertificate)'
    testable: 'partial'
    testable_reason: 'a permission (can) with no stated procedure beyond the parenthesis; testable as: an SCT whose leaf is neither the server certificate nor a precertificate corresponding to it fails the check.'
    note: 'Hunted by pass 2 in its source walk: the second audit check of the TLS client, after R-0418 in the same paragraph. The pairing of SCT and leaf types is R-0468.'
