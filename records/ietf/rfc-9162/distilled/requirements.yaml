requirements:
  - id: 'rfc-9162#R-0001'
    locator: '§2.2'
    source_lines: '650-652'
    text: 'When signing data structures, a log MUST use one of the signature algorithms from the IANA "Signature Algorithms" registry, described in Section 10.2.2.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'signatures on SCTs and STHs (every data structure the log signs)'
    field: 'Signature Algorithm log parameter (§4.1); signature fields of SignedCertificateTimestampDataV2 and SignedTreeHeadDataV2'
    testable: 'yes'
    note: 'The registry is Table 11 (§10.2.2): 0x0403 ecdsa_secp256r1_sha256 (randomized or deterministic ECDSA, R-0429) and 0x0807 ed25519 at publication. Test against a dated snapshot of the registry.'
  - id: 'rfc-9162#R-0002'
    locator: '§3'
    source_lines: '658-661'
    text: 'In order to enable attribution of each logged certificate or precertificate to its issuer, each submission MUST be accompanied by all additional certificates required to verify the chain up to an accepted trust anchor (Section 5.7).'
    verb: 'MUST'
    kind: stated
    actor: 'submitter'
    object: 'submit-entry request (§5.1)'
    field: 'chain (input)'
    testable: 'yes'
    note: 'The log-side consequence is rejection: badChain or unknownAnchor (Table 2, R-0308). The trust anchor itself may be left out (R-0003).'
  - id: 'rfc-9162#R-0003'
    locator: '§3'
    source_lines: '661-663'
    text: 'The trust anchor (a root or intermediate CA certificate) MAY be omitted from the submission.'
    verb: 'MAY'
    kind: stated
    actor: 'submitter'
    object: 'submit-entry request (§5.1)'
    field: 'chain (input): the final trust-anchor element'
    testable: 'yes'
    note: 'Testable on the log: a chain that stops below its trust anchor must be accepted on that ground, and the log must still store and serve the anchor (R-0039, R-0082). Read with the chain definition at R-0304 (last element, or the submission, is certified by an accepted trust anchor).'
  - id: 'rfc-9162#R-0004'
    locator: '§3'
    source_lines: '666-669'
    text: 'The submitter SHOULD validate the returned SCT, as described in Section 8.1, if they understand its format and they intend to use it directly in a TLS handshake or to construct a certificate.'
    verb: 'SHOULD'
    kind: stated
    actor: 'submitter'
    object: 'SCT returned by submit-entry'
    field: 'sct (output); SCT validation procedure of §8.1 (§8.1.3)'
    testable: 'partial'
    testable_reason: 'conditioned on the submitter understanding the format and intending direct use, neither of which is observable; testable only in a submitter implementation configured to use the SCT, by giving it an SCT whose signature does not verify and checking that it is not used.'
  - id: 'rfc-9162#R-0005'
    locator: '§3'
    source_lines: '669-671'
    text: 'If the submitter does not need the SCT (for example, the certificate is being submitted simply to make it available in the log), it MAY validate the SCT.'
    verb: 'MAY'
    kind: stated
    actor: 'submitter'
    object: 'SCT returned by submit-entry'
    field: 'sct (output)'
    testable: 'no'
    testable_reason: 'a permission with no counterpart duty: validating or not validating are both conforming.'
  - id: 'rfc-9162#R-0006'
    locator: '§3.2'
    source_lines: '684-685'
    text: 'The CA MAY incorporate the returned SCT in the issued certificate.'
    verb: 'MAY'
    kind: stated
    actor: 'CA'
    object: 'issued certificate'
    field: 'Transparency Information X.509v3 extension (OID 1.3.101.75, §7.1.2)'
    testable: 'no'
    testable_reason: 'a permission; the testable counterpart is R-0110 (TLS clients implement the certificate-extension mechanism) and R-0108 (what an embedded SCT must be for).'
  - id: 'rfc-9162#R-0007'
    locator: '§3.2'
    source_lines: '693'
    text: '* It MUST be DER encoded, as described in [X690].'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate (CMS signed-data object, §3.2)'
    field: 'the whole object encoding'
    testable: 'yes'
    note: 'It is the precertificate CMS object of L690-691. Whether the encoding wraps SignedData in a CMS ContentInfo is not stated: see R-0479.'
  - id: 'rfc-9162#R-0008'
    locator: '§3.2'
    source_lines: '695'
    text: '* SignedData.version MUST be v3(3).'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate'
    field: 'SignedData.version'
    testable: 'yes'
  - id: 'rfc-9162#R-0009'
    locator: '§3.2'
    source_lines: '697-698'
    text: '* SignedData.digestAlgorithms MUST be the same as the SignerInfo.digestAlgorithm OID value (see below).'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate'
    field: 'SignedData.digestAlgorithms'
    testable: 'yes'
    note: 'digestAlgorithms is a SET OF AlgorithmIdentifier in RFC 5652; read as exactly one element whose OID is that of SignerInfo.digestAlgorithm. The sentence compares OIDs only; whether parameters (absent vs NULL) must also match is not said.'
  - id: 'rfc-9162#R-0010'
    locator: '§3.2'
    source_lines: '702'
    text: '- eContentType MUST be the OID 1.3.101.78.'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate'
    field: 'SignedData.encapContentInfo.eContentType'
    testable: 'yes'
    note: '1.3.101.78 is id-ct-tbsCertificate in the informative Appendix B module.'
  - id: 'rfc-9162#R-0011'
    locator: '§3.2'
    source_lines: '704-707'
    text: '- eContent MUST contain a TBSCertificate [RFC5280] that will be identical to the TBSCertificate in the issued certificate, except that the Transparency Information (Section 7.1) extension MUST be omitted.'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate'
    field: 'SignedData.encapContentInfo.eContent (TBSCertificate)'
    testable: 'partial'
    testable_reason: 'split: R-0194 (identity with the issued TBSCertificate, checkable only once the certificate exists) and R-0195 (absence of the extension, checkable at submission).'
    note: 'Two MUSTs; split into R-0194 and R-0195. The exception list names only the Transparency Information extension, yet §8.1.2 also strips embedded v1 SCTs before validation and Appendix A adds them after the CMS precertificate exists: SD-11 in normative.md.'
  - id: 'rfc-9162#R-0012'
    locator: '§3.2'
    source_lines: '709'
    text: '* SignedData.certificates MUST be omitted.'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate'
    field: 'SignedData.certificates'
    testable: 'yes'
  - id: 'rfc-9162#R-0013'
    locator: '§3.2'
    source_lines: '711'
    text: '* SignedData.crls MUST be omitted.'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate'
    field: 'SignedData.crls'
    testable: 'yes'
  - id: 'rfc-9162#R-0014'
    locator: '§3.2'
    source_lines: '713'
    text: '* SignedData.signerInfos MUST contain one SignerInfo:'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate'
    field: 'SignedData.signerInfos'
    testable: 'yes'
    note: 'one is read as exactly one SignerInfo.'
  - id: 'rfc-9162#R-0015'
    locator: '§3.2'
    source_lines: '715'
    text: '- version MUST be v3(3).'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate SignerInfo'
    field: 'SignerInfo.version'
    testable: 'yes'
    note: 'v3 is also what RFC 5652 requires when sid is subjectKeyIdentifier (R-0016).'
  - id: 'rfc-9162#R-0016'
    locator: '§3.2'
    source_lines: '717'
    text: '- sid MUST use the subjectKeyIdentifier option.'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate SignerInfo'
    field: 'SignerInfo.sid'
    testable: 'yes'
  - id: 'rfc-9162#R-0017'
    locator: '§3.2'
    source_lines: '719-721'
    text: '- digestAlgorithm MUST be one of the hash algorithm OIDs listed in the IANA "Hash Algorithms" registry, described in Section 10.2.1.'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate SignerInfo'
    field: 'SignerInfo.digestAlgorithm'
    testable: 'yes'
    note: 'At publication the only listed OID is SHA-256, 2.16.840.1.101.3.4.2.1 (Table 9, R-0426). Nothing ties it to the log''s own Hash Algorithm parameter.'
  - id: 'rfc-9162#R-0018'
    locator: '§3.2'
    source_lines: '723'
    text: '- signedAttrs MUST be present and MUST contain two attributes:'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate SignerInfo'
    field: 'SignerInfo.signedAttrs'
    testable: 'partial'
    testable_reason: 'split: R-0196 (presence) is testable; R-0197 does not say whether a third signed attribute (for example signing-time) is forbidden or merely beside the two required ones.'
    note: 'Two MUSTs; split into R-0196 and R-0197. The two attributes are R-0198 and R-0199.'
  - id: 'rfc-9162#R-0019'
    locator: '§3.2'
    source_lines: '731-732'
    text: '- signatureAlgorithm MUST be the same OID as TBSCertificate.signature.'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate SignerInfo'
    field: 'SignerInfo.signatureAlgorithm'
    testable: 'yes'
    note: 'Compares the algorithm OID with TBSCertificate.signature; parameters are not mentioned.'
  - id: 'rfc-9162#R-0020'
    locator: '§3.2'
    source_lines: '734-736'
    text: '- signature MUST be from the same (root or intermediate) CA that intends to issue the corresponding certificate (see Section 3.2.1).'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate SignerInfo'
    field: 'SignerInfo.signature'
    testable: 'partial'
    testable_reason: 'intent to issue is not observable; a test can check that the signature verifies under the key of the CA named as issuer in the eContent TBSCertificate, which is also the certifier the submit-entry chain must start with (see R-0478).'
  - id: 'rfc-9162#R-0021'
    locator: '§3.2'
    source_lines: '738'
    text: '- unsignedAttrs MUST be omitted.'
    verb: 'MUST'
    kind: stated
    actor: 'CA (precertificate producer)'
    object: 'precertificate SignerInfo'
    field: 'SignerInfo.unsignedAttrs'
    testable: 'yes'
  - id: 'rfc-9162#R-0022'
    locator: '§4'
    source_lines: '780-782'
    text: 'When it receives and accepts a valid submission, the log MUST return an SCT that corresponds to the submitted certificate or precertificate.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'submit-entry response (§5.1)'
    field: 'sct (output)'
    testable: 'yes'
    note: 'Corresponds is checked by validating the SCT per §8.1.3 against the submission.'
  - id: 'rfc-9162#R-0023'
    locator: '§4'
    source_lines: '782-786'
    text: 'If the log has previously seen this valid submission, it SHOULD return the same SCT as it returned before, as discussed in Section 11.3. If different SCTs are produced for the same submission, multiple log entries will have to be created, one for each SCT (as the timestamp is a part of the leaf structure).'
    verb: 'SHOULD'
    kind: stated
    actor: 'log'
    object: 'submit-entry response for a resubmission'
    field: 'sct (output); log entries'
    testable: 'yes'
    note: 'Two sentences; split into R-0204 (SHOULD, same SCT) and R-0205 (no keyword: one entry per distinct SCT). The precertificate-then-certificate case is not a resubmission: R-0206.'
  - id: 'rfc-9162#R-0024'
    locator: '§4'
    source_lines: '793-796'
    text: 'Upon producing an SCT, the log MUST fulfill this promise by performing the following actions within a fixed amount of time known as the Maximum Merge Delay (MMD), which is one of the log''s parameters (see Section 4.1):'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'log entry for an issued SCT'
    field: 'Maximum Merge Delay log parameter; STH tree_head'
    testable: 'yes'
    note: 'The three actions are R-0208, R-0209, R-0210. Testable from outside as R-0474: an STH dated at or after SCT timestamp + MMD must include the entry, as §8.3 audits (R-0418).'
  - id: 'rfc-9162#R-0025'
    locator: '§4'
    source_lines: '808-809'
    text: 'Log operators SHOULD NOT impose any conditions on retrieving or sharing data from the log.'
    verb: 'SHOULD NOT'
    kind: stated
    actor: 'log operator'
    object: 'data served by the log (every §5 read endpoint)'
    field: 'none (access conditions)'
    testable: 'partial'
    testable_reason: 'conditions is open-ended. The document itself permits a per-request limit on get-entries (R-0085) and temporary rejection of submissions (R-0228), so a test can flag authentication or licensing gates but not rate limits.'
  - id: 'rfc-9162#R-0026'
    locator: '§4.1'
    source_lines: '815-816'
    text: 'Except for the Final STH, each of these parameters MUST be established before the log operator begins to operate the log.'
    verb: 'MUST'
    kind: stated
    actor: 'log operator'
    object: 'log parameters (§4.1)'
    field: 'Base URL, Hash Algorithm, Signature Algorithm, Public Key, Log ID, Maximum Merge Delay, Version, Maximum Chain Length, STH Frequency Count'
    testable: 'partial'
    testable_reason: 'establishment happens before operation and off the protocol; a test can only detect a parameter that changes after operation began, which R-0212 (immutable) forbids.'
  - id: 'rfc-9162#R-0027'
    locator: '§4.1'
    source_lines: '819-822'
    text: 'The base URL MUST be an "https" URL, MAY contain a port, and MAY contain a path with any number of path segments but MUST NOT contain a query string, fragment, or trailing "/".'
    verb: 'MUST'
    kind: stated
    actor: 'log operator'
    object: 'Base URL log parameter'
    field: 'Base URL'
    testable: 'yes'
    note: 'MUST, MAY, MAY and MUST NOT in one sentence; split into R-0214, R-0215, R-0216, R-0217. Example in the source: https://ct.example.org/blue (L822).'
  - id: 'rfc-9162#R-0028'
    locator: '§4.1'
    source_lines: '830'
    text: 'A log MUST NOT use the same keypair as any other log.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'log operator'
    object: 'log signing keypair'
    field: 'Public Key log parameter'
    testable: 'partial'
    testable_reason: 'checkable only across a known set of logs (for example a client''s log list); global uniqueness cannot be observed.'
  - id: 'rfc-9162#R-0029'
    locator: '§4.1'
    source_lines: '850-851'
    text: 'This value MUST be provided in the form of a TransItem of type signed_tree_head_v2.'
    verb: 'MUST'
    kind: stated
    actor: 'log operator'
    object: 'Final STH log parameter'
    field: 'Final STH (TransItem, versioned_type signed_tree_head_v2 = 0x0104)'
    testable: 'yes'
    note: 'Present only once the log is closed (R-0227); produced by the §4.13 procedure (R-0283).'
  - id: 'rfc-9162#R-0030'
    locator: '§4.2'
    source_lines: '865-866'
    text: 'If the acceptance criteria are met, the log SHOULD accept the submission.'
    verb: 'SHOULD'
    kind: stated
    actor: 'log'
    object: 'submit-entry request'
    field: 'none (acceptance decision)'
    testable: 'partial'
    testable_reason: 'the discretionary criteria of §4.2.2 are not published, apart from Maximum Chain Length and the anchor list, and the log may reject acceptable submissions temporarily (R-0228); a test can show only that a submission meeting every published criterion is usually accepted.'
  - id: 'rfc-9162#R-0031'
    locator: '§4.2'
    source_lines: '870-872'
    text: 'The log SHALL allow retrieval of its list of accepted trust anchors (see Section 5.7), each of which is a root or intermediate CA certificate.'
    verb: 'SHALL'
    kind: stated
    actor: 'log'
    object: 'get-anchors endpoint (§5.7)'
    field: 'certificates (output)'
    testable: 'yes'
  - id: 'rfc-9162#R-0032'
    locator: '§4.2.1'
    source_lines: '877-881'
    text: 'To ensure that logged certificates and precertificates are attributable to an accepted trust anchor, to set clear expectations for what monitors would find in the log, and to avoid being overloaded by invalid submissions, the log MUST reject a submission if any of the following conditions are not met:'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'submit-entry request'
    field: 'submission, type, chain (inputs)'
    testable: 'yes'
    note: 'Each bullet is a negative test. Table 2 names an error for some failures (badType, badChain, badCertificate, unknownAnchor, badSubmission) but none for a missing CA feature (R-0034) or a pathLenConstraint violation (R-0035): R-0480.'
  - id: 'rfc-9162#R-0033'
    locator: '§4.2.1'
    source_lines: '883-886'
    text: '* The submission, type, and chain inputs MUST be set as described in Section 5.1. The log MUST NOT accommodate misordered CA certificates or use any other source of intermediate CA certificates to attempt certification path construction.'
    verb: 'MUST'
    kind: stated
    actor: 'submitter (inputs) and log (no path building)'
    object: 'submit-entry request'
    field: 'submission, type, chain'
    testable: 'yes'
    note: 'Two sentences, MUST and MUST NOT; split into R-0229 and R-0230.'
  - id: 'rfc-9162#R-0034'
    locator: '§4.2.1'
    source_lines: '888-889'
    text: '* Each of the zero or more intermediate CA certificates in the chain MUST have one or both of the following features:'
    verb: 'MUST'
    kind: stated
    actor: 'CA certificates submitted (condition the log enforces, R-0032)'
    object: 'intermediate CA certificates in chain'
    field: 'basicConstraints.cA; keyUsage.keyCertSign'
    testable: 'yes'
    note: 'One or both suffices (R-0231, R-0232), which is laxer than RFC 5280, where keyCertSign requires cA. No Table 2 error names this failure.'
  - id: 'rfc-9162#R-0035'
    locator: '§4.2.1'
    source_lines: '895-897'
    text: '* Each certificate in the chain MUST fall within the limits imposed by the zero or more Basic Constraints pathLenConstraint values found higher up the chain.'
    verb: 'MUST'
    kind: stated
    actor: 'certificates submitted (condition the log enforces, R-0032)'
    object: 'chain (submission and CA certificates)'
    field: 'basicConstraints.pathLenConstraint'
    testable: 'yes'
    note: 'Each certificate in the chain is read as every certificate of the path, submission included, counted as RFC 5280 counts (non-self-issued intermediates). No Table 2 error names this failure.'
  - id: 'rfc-9162#R-0036'
    locator: '§4.2.1'
    source_lines: '899-900'
    text: '* Precertificate submissions MUST conform to all of the requirements in Section 3.2.'
    verb: 'MUST'
    kind: stated
    actor: 'submitter (CA); enforced by the log (R-0032)'
    object: 'precertificate submission (type 2)'
    field: 'submission'
    testable: 'yes'
    note: 'The §3.2 profile is R-0007 to R-0021 with the split children of R-0011 and R-0018 and R-0198, R-0199.'
  - id: 'rfc-9162#R-0037'
    locator: '§4.2.2'
    source_lines: '917'
    text: 'Logs SHOULD limit the length of chain they will accept.'
    verb: 'SHOULD'
    kind: stated
    actor: 'log'
    object: 'submit-entry chain'
    field: 'Maximum Chain Length log parameter; max_chain_length (get-anchors output)'
    testable: 'partial'
    testable_reason: 'a log that sets a limit is observable through the parameter and get-anchors; the error for an over-long chain is not named in Table 2, and whether the count includes the submission and the trust anchor is not said (SD-17).'
  - id: 'rfc-9162#R-0038'
    locator: '§4.3'
    source_lines: '922-923'
    text: 'If a submission is accepted and an SCT is issued, the accepting log MUST store the entire chain used for verification.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'stored log entry'
    field: 'chain used for verification'
    testable: 'partial'
    testable_reason: 'storage is internal; observable only through get-entries submitted_entry (R-0040, R-0082).'
  - id: 'rfc-9162#R-0039'
    locator: '§4.3'
    source_lines: '923-927'
    text: 'This chain MUST include the certificate or precertificate itself, the zero or more intermediate CA certificates provided by the submitter, and the trust anchor used to verify the chain (even if it was omitted from the submission).'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'stored chain'
    field: 'submitted_entry.chain (get-entries output)'
    testable: 'yes'
    note: 'Where the omitted anchor goes in the array is not said: R-0482.'
  - id: 'rfc-9162#R-0040'
    locator: '§4.3'
    source_lines: '927-929'
    text: 'The log MUST provide this chain for auditing upon request (see Section 5.6) so that the CA cannot avoid blame by logging a partial or empty chain.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-entries response (§5.6)'
    field: 'submitted_entry (output)'
    testable: 'yes'
  - id: 'rfc-9162#R-0041'
    locator: '§4.4'
    source_lines: '939-941'
    text: 'Each log is identified by an OID, which is one of the log''s parameters (see Section 4.1) and which MUST NOT be used to identify any other log.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'log operator'
    object: 'Log ID'
    field: 'log_id (LogID) in SCT, STH and proofs; Log ID log parameter'
    testable: 'partial'
    testable_reason: 'uniqueness is checkable only across a known set of logs.'
  - id: 'rfc-9162#R-0042'
    locator: '§4.4'
    source_lines: '941-943'
    text: 'A log''s operator MUST either allocate the OID themselves or request an OID from the Log ID registry (see Section 10.2.5).'
    verb: 'MUST'
    kind: stated
    actor: 'log operator'
    object: 'Log ID'
    field: 'Log ID log parameter'
    testable: 'partial'
    testable_reason: 'an OID from the 1.3.101.8192-16383 range or the 1.3.101.80 arc can be checked against the IANA Log IDs registry (R-0445); a self-allocated OID under the operator''s own arc is not observable.'
  - id: 'rfc-9162#R-0043'
    locator: '§4.4'
    source_lines: '961-963'
    text: 'The OID used to identify a log is limited such that the DER encoding of its value, excluding the tag and length, MUST be no longer than 127 octets.'
    verb: 'MUST'
    kind: stated
    actor: 'log operator'
    object: 'Log ID'
    field: 'LogID opaque vector (DER OID contents without tag and length)'
    testable: 'yes'
    note: 'Agrees with opaque LogID<2..127> (R-0237); the floor of 2 octets is a further constraint the sentence does not state.'
  - id: 'rfc-9162#R-0044'
    locator: '§4.7'
    source_lines: '1070-1071'
    text: 'The length of the issuer_key_hash MUST match HASH_SIZE.'
    verb: 'MUST'
    kind: stated
    actor: 'log (when building the leaf); TLS client (when rebuilding it, §8.1.3)'
    object: 'TimestampedCertificateEntryDataV2'
    field: 'issuer_key_hash'
    testable: 'yes'
    note: 'With the vector bound issuer_key_hash<32..2^8-1> this forces HASH_SIZE into 32..255: R-0469.'
  - id: 'rfc-9162#R-0045'
    locator: '§4.8'
    source_lines: '1103-1105'
    text: 'This vector MUST NOT include more than one extension with the same extension_type.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'log'
    object: 'SignedCertificateTimestampDataV2'
    field: 'sct_extensions'
    testable: 'yes'
    note: 'Same text as R-0050 (STH); the two differ only by section.'
  - id: 'rfc-9162#R-0046'
    locator: '§4.8'
    source_lines: '1105-1106'
    text: 'The extensions in the vector MUST be ordered by the value of the extension_type field, smallest value first.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'SignedCertificateTimestampDataV2'
    field: 'sct_extensions (order by extension_type)'
    testable: 'yes'
    note: 'With R-0045 the order is strictly ascending. Same text as R-0051 (STH).'
  - id: 'rfc-9162#R-0047'
    locator: '§4.8'
    source_lines: '1106-1109'
    text: 'All SCT extensions are similar to noncritical X.509v3 extensions (i.e., the mustUnderstand field is not set), and a recipient SHOULD ignore any extension it does not understand.'
    verb: 'SHOULD'
    kind: stated
    actor: 'recipient of an SCT (TLS client, monitor, auditor, submitter)'
    object: 'SCT'
    field: 'sct_extensions'
    testable: 'yes'
    note: 'Ignoring is not dropping: the extension bytes stay in the signature input, because §8.1.3 copies sct_extensions from the SCT (R-0387). No ExtensionType is registered (R-0438), so every extension is currently one a recipient does not understand.'
  - id: 'rfc-9162#R-0048'
    locator: '§4.8'
    source_lines: '1109-1110'
    text: 'Furthermore, an implementation MAY choose to ignore any extension(s) that it does understand.'
    verb: 'MAY'
    kind: stated
    actor: 'recipient of an SCT'
    object: 'SCT'
    field: 'sct_extensions'
    testable: 'no'
    testable_reason: 'a permission; nothing observable distinguishes ignoring an understood extension from using it.'
    note: 'Same text as R-0053 (STH).'
  - id: 'rfc-9162#R-0049'
    locator: '§4.9'
    source_lines: '1130'
    text: 'The length of NodeHash MUST match HASH_SIZE of the log.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'NodeHash (root_hash, every consistency_path and inclusion_path element)'
    field: 'NodeHash'
    testable: 'yes'
    note: 'With NodeHash<32..2^8-1>: R-0469. Each NodeHash carries its own length octet: R-0470.'
  - id: 'rfc-9162#R-0050'
    locator: '§4.9'
    source_lines: '1140-1142'
    text: 'This vector MUST NOT include more than one extension with the same extension_type.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'log'
    object: 'TreeHeadDataV2'
    field: 'sth_extensions'
    testable: 'yes'
    note: 'Same text as R-0045 (SCT).'
  - id: 'rfc-9162#R-0051'
    locator: '§4.9'
    source_lines: '1142-1143'
    text: 'The extensions in the vector MUST be ordered by the value of the extension_type field, smallest value first.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'TreeHeadDataV2'
    field: 'sth_extensions (order by extension_type)'
    testable: 'yes'
    note: 'Same text as R-0046 (SCT).'
  - id: 'rfc-9162#R-0052'
    locator: '§4.9'
    source_lines: '1143-1145'
    text: 'If an implementation sees an extension that it does not understand, it SHOULD ignore that extension.'
    verb: 'SHOULD'
    kind: stated
    actor: 'recipient of an STH (TLS client, monitor, auditor)'
    object: 'STH'
    field: 'sth_extensions'
    testable: 'yes'
    note: 'As for R-0047, the bytes stay in the signed tree_head.'
  - id: 'rfc-9162#R-0053'
    locator: '§4.9'
    source_lines: '1145-1146'
    text: 'Furthermore, an implementation MAY choose to ignore any extension(s) that it does understand.'
    verb: 'MAY'
    kind: stated
    actor: 'recipient of an STH'
    object: 'STH'
    field: 'sth_extensions'
    testable: 'no'
    testable_reason: 'a permission; not observable.'
    note: 'Same text as R-0048 (SCT).'
  - id: 'rfc-9162#R-0054'
    locator: '§4.10'
    source_lines: '1150-1151'
    text: 'Periodically, each log SHOULD sign its current tree head information (see Section 4.9) to produce an STH.'
    verb: 'SHOULD'
    kind: stated
    actor: 'log'
    object: 'STH'
    field: 'tree_head'
    testable: 'partial'
    testable_reason: 'periodically is undefined; the observable bounds are R-0055 (no older than MMD on request) and R-0057 (fresh timestamp each quiet MMD period).'
  - id: 'rfc-9162#R-0055'
    locator: '§4.10'
    source_lines: '1151-1153'
    text: 'When a client requests a log''s latest STH (see Section 5.2), the log MUST return an STH that is no older than the log''s MMD.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-sth response (§5.2)'
    field: 'sth.tree_head.timestamp'
    testable: 'yes'
    note: 'Test: now minus timestamp is at most MMD (allowing for clock skew). A frozen log whose key is destroyed cannot keep this: SD-13.'
  - id: 'rfc-9162#R-0056'
    locator: '§4.10'
    source_lines: '1153-1156'
    text: 'However, since STHs could be used to mark individual clients (by producing a new STH for each query), a log MUST NOT produce STHs more frequently than its parameters declare (see Section 4.1).'
    verb: 'MUST NOT'
    kind: stated
    actor: 'log'
    object: 'sequence of STHs'
    field: 'STH Frequency Count log parameter; tree_head.timestamp'
    testable: 'partial'
    testable_reason: 'the limit is per sliding period of length MMD (R-0225); one client sees only the STHs served to it, so a violation is proven by several clients pooling STHs (gossip, §11.3), which the document does not define.'
  - id: 'rfc-9162#R-0057'
    locator: '§4.10'
    source_lines: '1156-1159'
    text: 'In general, there is no need to produce a new STH unless there are new entries in the log; however, in the event that a log does not accept any submissions during an MMD period, the log MUST sign the same Merkle Tree Hash with a fresh timestamp.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'STH'
    field: 'tree_head.timestamp, tree_head.root_hash'
    testable: 'yes'
    note: 'The MMD period has no defined start; test as: after MMD with no accepted submission, get-sth returns an STH with the same root_hash and tree_size and a newer timestamp. This conflicts with option 2 of R-0125 (SD-12) and is impossible after key destruction (SD-13).'
  - id: 'rfc-9162#R-0058'
    locator: '§4.10'
    source_lines: '1173-1174'
    text: 'The timestamp in tree_head MUST be at least as recent as the most recent SCT timestamp in the tree.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'SignedTreeHeadDataV2'
    field: 'tree_head.timestamp'
    testable: 'yes'
    note: 'Test: fetch entries 0..tree_size-1 and compare the largest leaf timestamp.'
  - id: 'rfc-9162#R-0059'
    locator: '§4.10'
    source_lines: '1174-1175'
    text: 'Each subsequent timestamp MUST be more recent than the timestamp of the previous update.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'sequence of STHs'
    field: 'tree_head.timestamp'
    testable: 'yes'
    note: 'Update is read as each successive STH; strictly increasing.'
  - id: 'rfc-9162#R-0060'
    locator: '§4.13'
    source_lines: '1238-1239'
    text: 'In order to avoid that, the following actions SHOULD be taken:'
    verb: 'SHOULD'
    kind: stated
    actor: 'log operator'
    object: 'log shutdown procedure (§4.13)'
    field: 'none (procedure)'
    testable: 'partial'
    testable_reason: 'the four actions are R-0281 (out of band, not observable), R-0282 (shutdown error, testable), R-0283 (Final STH, partly testable) and R-0285 (keep serving, testable only over time).'
  - id: 'rfc-9162#R-0061'
    locator: '§5'
    source_lines: '1280-1281'
    text: 'Any fields that are not understood SHOULD be ignored.'
    verb: 'SHOULD'
    kind: stated
    actor: 'receiver of a §5 message (log or client)'
    object: 'JSON objects and URL parameters of every §5 message'
    field: 'any field not specified in §5'
    testable: 'yes'
    note: 'The sender-side permission is R-0291.'
  - id: 'rfc-9162#R-0062'
    locator: '§5'
    source_lines: '1288-1291'
    text: 'Front ends MUST only serve data that is free of gaps (that is, for example, no front end will respond with an STH unless it is also able to prove consistency from all log entries logged within that STH).'
    verb: 'MUST'
    kind: stated
    actor: 'log front end'
    object: 'every §5 response'
    field: 'sth outputs and the proofs and entries behind them'
    testable: 'partial'
    testable_reason: 'testable per response: for any STH a front end serves, proofs and entries up to its tree_size must then be obtainable from that front end; gaps that never surface in a request cannot be seen.'
  - id: 'rfc-9162#R-0063'
    locator: '§5'
    source_lines: '1302-1305'
    text: 'If the log is unable to process a client''s request, it MUST return an HTTP response code of 4xx/5xx (see [RFC7231]), and, in place of the responses outlined in the subsections below, the body SHOULD be a JSON problem details object (see Section 3 of [RFC7807]) containing:'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'error response to any §5 request'
    field: 'HTTP status code; problem details body (type, detail)'
    testable: 'yes'
    note: 'MUST and SHOULD in one sentence; split into R-0292 and R-0293. The type URN prefix is R-0295; the detail member is R-0296.'
  - id: 'rfc-9162#R-0064'
    locator: '§5'
    source_lines: '1339-1341'
    text: 'Clients SHOULD treat 500 Internal Server Error and 503 Service Unavailable responses as transient failures and MAY retry the same request without modification at a later date.'
    verb: 'SHOULD'
    kind: stated
    actor: 'client'
    object: 'HTTP 500 and 503 responses'
    field: 'HTTP status code'
    testable: 'partial'
    testable_reason: 'split: R-0299 concerns an internal classification, observable only as a client that does not give up permanently; R-0300 is a permission.'
    note: 'SHOULD and MAY in one sentence; split into R-0299 and R-0300.'
  - id: 'rfc-9162#R-0065'
    locator: '§5'
    source_lines: '1341-1344'
    text: 'Note that in the case of a 503 response, the log MAY include a Retry-After header field per [RFC7231] in order to request a minimum time for the client to wait before retrying the request.'
    verb: 'MAY'
    kind: stated
    actor: 'log'
    object: 'HTTP 503 response'
    field: 'Retry-After header field'
    testable: 'no'
    testable_reason: 'a permission; no duty on the client to honour the header is stated.'
  - id: 'rfc-9162#R-0066'
    locator: '§5'
    source_lines: '1347-1348'
    text: 'Clients SHOULD treat any 4xx error as a problem with the request and not attempt to resubmit without some modification to the request.'
    verb: 'SHOULD'
    kind: stated
    actor: 'client'
    object: 'HTTP 4xx response'
    field: 'HTTP status code'
    testable: 'yes'
    note: 'Test: after a 4xx, the client does not resend a byte-identical request.'
  - id: 'rfc-9162#R-0067'
    locator: '§5'
    source_lines: '1349'
    text: 'The full status code MAY provide additional details.'
    verb: 'MAY'
    kind: stated
    actor: 'log'
    object: 'HTTP status code'
    field: 'HTTP status code'
    testable: 'no'
    testable_reason: 'a statement that the code may carry information; nothing to test.'
  - id: 'rfc-9162#R-0068'
    locator: '§5.1'
    source_lines: '1377-1378'
    text: 'If the submitted entry is immediately appended to (or already exists in) this log''s tree, then the log SHOULD also output:'
    verb: 'SHOULD'
    kind: stated
    actor: 'log'
    object: 'submit-entry response'
    field: 'sth, inclusion (outputs)'
    testable: 'partial'
    testable_reason: 'immediately appended is internal; a test can check that sth and inclusion, when present, verify against each other (inclusion.tree_size equal to the sth tree_size) and that a resubmission of an already merged entry returns them.'
  - id: 'rfc-9162#R-0069'
    locator: '§5.1'
    source_lines: '1414'
    text: 'It MUST NOT construe this as an error.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'v2 client of submit-entry'
    object: 'submit-entry response'
    field: 'sct (versioned_type other than x509_sct_v2 or precert_sct_v2)'
    testable: 'yes'
    note: 'It is a v2 client and this is an sct whose version is not v2 (L1413-1414).'
  - id: 'rfc-9162#R-0070'
    locator: '§5.1'
    source_lines: '1418-1420'
    text: 'If a log detects bad encoding in a chain that otherwise verifies correctly, then the log MUST either log the certificate or return the "badCertificate" error.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'submit-entry response for a chain that verifies but is badly encoded'
    field: 'sct (output) or error type badCertificate'
    testable: 'yes'
    note: 'Either outcome conforms; any third outcome fails.'
  - id: 'rfc-9162#R-0071'
    locator: '§5.1'
    source_lines: '1420-1421'
    text: 'If the certificate is logged, an SCT MUST be issued.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'submit-entry response'
    field: 'sct (output)'
    testable: 'yes'
  - id: 'rfc-9162#R-0072'
    locator: '§5.1'
    source_lines: '1425-1427'
    text: 'If submission is an accepted trust anchor whose certifier is neither an accepted trust anchor nor the first element of chain, then the log MUST return the "unknownAnchor" error.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'submit-entry error response'
    field: 'type = urn:ietf:params:trans:error:unknownAnchor'
    testable: 'yes'
  - id: 'rfc-9162#R-0073'
    locator: '§5.1'
    source_lines: '1431-1433'
    text: 'If the returned sct is intended to be provided to TLS clients, then sth and inclusion (if returned) SHOULD also be provided to TLS clients.'
    verb: 'SHOULD'
    kind: stated
    actor: 'submitter that hands SCTs to TLS clients (CA or TLS server operator)'
    object: 'TransItems delivered to TLS clients'
    field: 'sth, inclusion (submit-entry outputs) placed in a TransItemList'
    testable: 'partial'
    testable_reason: 'the intent is not observable; testable as the content of the TransItemList a TLS client receives.'
  - id: 'rfc-9162#R-0074'
    locator: '§5.3'
    source_lines: '1464-1467'
    text: 'Outputs: consistency: A base64-encoded TransItem of type consistency_proof_v2 whose tree_size_1 MUST match the first input.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-sth-consistency response (§5.3)'
    field: 'consistency.tree_size_1'
    testable: 'yes'
  - id: 'rfc-9162#R-0075'
    locator: '§5.3'
    source_lines: '1467-1468'
    text: 'If the sth output is omitted, then tree_size_2 MUST match the second input.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-sth-consistency response'
    field: 'consistency.tree_size_2'
    testable: 'yes'
    note: 'When sth is returned, tree_size_2 is the returned STH size: R-0484.'
  - id: 'rfc-9162#R-0076'
    locator: '§5.3'
    source_lines: '1468-1470'
    text: 'If first and second are equal and correspond to a known STH, the returned consistency proof MUST be empty (a consistency_path array with zero elements).'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-sth-consistency response with first equal to second'
    field: 'consistency.consistency_path'
    testable: 'yes'
    note: 'The §2.1.4.2 verifier assumes 0 < first < second and fails on an empty path (step 1), so a client must treat this case separately: R-0463.'
  - id: 'rfc-9162#R-0077'
    locator: '§5.5'
    source_lines: '1578-1579'
    text: 'It is also possible for none to be true; in which case, the front end MUST return an empty response.'
    verb: 'MUST'
    kind: stated
    actor: 'log front end'
    object: 'get-all-by-hash response (§5.5)'
    field: 'whole response'
    testable: 'partial'
    testable_reason: 'empty response is undefined (an empty JSON object, or no body), and the same request can also meet the hashUnknown error that §5.5 imports from §5.4: SD-6.'
  - id: 'rfc-9162#R-0078'
    locator: '§5.6'
    source_lines: '1632'
    text: 'All leaves MUST be v2.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-entries response (§5.6)'
    field: 'entries[].log_entry versioned_type'
    testable: 'yes'
    note: 'v2 is read as x509_entry_v2 (0x0100) or precert_entry_v2 (0x0101).'
  - id: 'rfc-9162#R-0079'
    locator: '§5.6'
    source_lines: '1632-1633'
    text: 'However, a compliant v2 client MUST NOT construe an unrecognized TransItem type as an error.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'v2 client of get-entries (monitor, auditor)'
    object: 'get-entries response'
    field: 'entries[].log_entry versioned_type'
    testable: 'yes'
    note: 'How to comply is R-0352: hash the unrecognized leaf as opaque input.'
  - id: 'rfc-9162#R-0080'
    locator: '§5.6'
    source_lines: '1639-1640'
    text: 'The start and end parameters SHOULD be within the range 0 <= x < tree_size, as returned by get-sth in Section 5.2.'
    verb: 'SHOULD'
    kind: stated
    actor: 'client'
    object: 'get-entries request'
    field: 'start, end (inputs)'
    testable: 'yes'
  - id: 'rfc-9162#R-0081'
    locator: '§5.6'
    source_lines: '1642'
    text: 'The start parameter MUST be less than or equal to the end parameter.'
    verb: 'MUST'
    kind: stated
    actor: 'client'
    object: 'get-entries request'
    field: 'start, end (inputs)'
    testable: 'yes'
    note: 'The log-side error is endBeforeStart (Table 6, R-0356).'
  - id: 'rfc-9162#R-0082'
    locator: '§5.6'
    source_lines: '1644-1646'
    text: 'Each submitted_entry output parameter MUST include the trust anchor that the log used to verify the submission, even if that trust anchor was not provided to submit-entry (see Section 5.1).'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-entries response'
    field: 'entries[].submitted_entry.chain'
    testable: 'yes'
    note: 'Position of the added anchor: R-0482.'
  - id: 'rfc-9162#R-0083'
    locator: '§5.6'
    source_lines: '1646-1648'
    text: 'If the submission does not certify itself, then the first element of chain MUST be present and MUST certify the submission.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-entries response'
    field: 'entries[].submitted_entry.chain[0]'
    testable: 'yes'
    note: 'Two MUSTs; split into R-0353 and R-0354. Does not certify itself is read as: the submission is not self-signed.'
  - id: 'rfc-9162#R-0084'
    locator: '§5.6'
    source_lines: '1650-1653'
    text: 'Log servers MUST honor requests where 0 <= start < tree_size and end >= tree_size by returning a partial response covering only the valid entries in the specified range. end >= tree_size could be caused by skew.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-entries response'
    field: 'entries (output)'
    testable: 'yes'
    note: 'end is inclusive (R-0346); the partial response is start..tree_size-1, subject to R-0086.'
  - id: 'rfc-9162#R-0085'
    locator: '§5.6'
    source_lines: '1655-1656'
    text: 'Logs MAY restrict the number of entries that can be retrieved per get-entries request.'
    verb: 'MAY'
    kind: stated
    actor: 'log'
    object: 'get-entries response'
    field: 'entries (output length)'
    testable: 'no'
    testable_reason: 'a permission; its testable consequences are R-0086 and R-0087.'
  - id: 'rfc-9162#R-0086'
    locator: '§5.6'
    source_lines: '1656-1658'
    text: 'If a client requests more than the permitted number of entries, the log SHALL return the maximum number of entries permissible.'
    verb: 'SHALL'
    kind: stated
    actor: 'log'
    object: 'get-entries response'
    field: 'entries (output length)'
    testable: 'partial'
    testable_reason: 'the permitted number is not published and may change at any time (R-0355), so a test can only check that a truncated response is non-empty and is a prefix of the range (R-0087).'
  - id: 'rfc-9162#R-0087'
    locator: '§5.6'
    source_lines: '1658-1659'
    text: 'These entries SHALL be sequential beginning with the entry specified by start.'
    verb: 'SHALL'
    kind: stated
    actor: 'log'
    object: 'get-entries response'
    field: 'entries (order and first index)'
    testable: 'yes'
    note: 'Clients must therefore page: R-0483.'
  - id: 'rfc-9162#R-0088'
    locator: '§5.6'
    source_lines: '1665-1666'
    text: 'In this case, it MUST return an empty entries array.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-entries response'
    field: 'entries (empty array)'
    testable: 'yes'
    note: 'Overlaps with startUnknown when start exceeds the number of entries: SD-5. start equal to tree_size: R-0481.'
  - id: 'rfc-9162#R-0089'
    locator: '§5.6'
    source_lines: '1668-1669'
    text: 'In any case, the log server MUST return the latest STH it knows about.'
    verb: 'MUST'
    kind: stated
    actor: 'log'
    object: 'get-entries response'
    field: 'sth'
    testable: 'partial'
    testable_reason: '§5.6 defines sth inside each element of entries (L1614-1628), so with an empty entries array (R-0088) the response has no defined place to carry it: SD-4.'
  - id: 'rfc-9162#R-0090'
    locator: '§6'
    source_lines: '1708-1711'
    text: 'CT-using TLS servers MUST use at least one of the mechanisms described below to present one or more SCTs from one or more logs to each TLS client during full TLS handshakes, when requested by the client, where each SCT corresponds to the server certificate.'
    verb: 'MUST'
    kind: stated
    actor: 'TLS server (CT-using)'
    object: 'TLS handshake'
    field: 'transparency_info extension; stapled OCSP response; certificate Transparency Information extension'
    testable: 'yes'
    note: 'The three mechanisms are R-0361, R-0362 and R-0365.'
  - id: 'rfc-9162#R-0091'
    locator: '§6'
    source_lines: '1713-1714'
    text: 'Servers SHOULD also present corresponding inclusion proofs and STHs.'
    verb: 'SHOULD'
    kind: stated
    actor: 'TLS server (CT-using)'
    object: 'TLS handshake'
    field: 'inclusion_proof_v2 and signed_tree_head_v2 TransItems'
    testable: 'yes'
  - id: 'rfc-9162#R-0092'
    locator: '§6.2'
    source_lines: '1760'
    text: 'CT-using TLS servers SHOULD send SCTs from multiple logs because:'
    verb: 'SHOULD'
    kind: stated
    actor: 'TLS server (CT-using)'
    object: 'SCTs presented in the handshake'
    field: 'log_id of each SCT (distinct logs)'
    testable: 'yes'
  - id: 'rfc-9162#R-0093'
    locator: '§6.4'
    source_lines: '1811-1813'
    text: 'In each TransItemList that is sent during a TLS handshake, the TLS server MUST include a TransItem structure of type x509_sct_v2 or precert_sct_v2.'
    verb: 'MUST'
    kind: stated
    actor: 'TLS server'
    object: 'every TransItemList sent in a TLS handshake'
    field: 'TransItem of type x509_sct_v2 (0x0102) or precert_sct_v2 (0x0103)'
    testable: 'yes'
    note: 'Conflicts with the SHOULD in R-0371 when every SCT is already embedded: SD-7.'
  - id: 'rfc-9162#R-0094'
    locator: '§6.4'
    source_lines: '1817-1819'
    text: 'Therefore, if the TLS server can obtain them, it SHOULD also include TransItems of type inclusion_proof_v2 and signed_tree_head_v2 in the TransItemList.'
    verb: 'SHOULD'
    kind: stated
    actor: 'TLS server'
    object: 'TransItemList'
    field: 'inclusion_proof_v2 and signed_tree_head_v2 TransItems'
    testable: 'partial'
    testable_reason: 'can obtain them is not observable; testable when the test harness makes proofs available to the server.'
  - id: 'rfc-9162#R-0095'
    locator: '§6.5'
    source_lines: '1827-1828'
    text: '* The TLS server MUST verify that the received extension_data is empty.'
    verb: 'MUST'
    kind: stated
    actor: 'TLS server supporting transparency_info'
    object: 'ClientHello transparency_info extension'
    field: 'extension_data'
    testable: 'partial'
    testable_reason: 'what the server does when extension_data is not empty is not said (abort with which alert, or ignore); only that a non-empty value is not treated as valid input can be tested.'
  - id: 'rfc-9162#R-0096'
    locator: '§6.5'
    source_lines: '1830-1833'
    text: '* The TLS server MUST construct a TransItemList of relevant TransItems (see Section 6.4), which SHOULD omit any TransItems that are already embedded in the server certificate or the stapled OCSP response (see Section 7.1).'
    verb: 'MUST'
    kind: stated
    actor: 'TLS server'
    object: 'TransItemList for the transparency_info extension'
    field: 'TransItemList contents'
    testable: 'yes'
    note: 'MUST and SHOULD in one sentence; split into R-0370 and R-0371.'
  - id: 'rfc-9162#R-0097'
    locator: '§6.5'
    source_lines: '1833-1836'
    text: 'If the constructed TransItemList is not empty, then the TLS server MUST include the transparency_info extension with the extension_data set to this TransItemList.'
    verb: 'MUST'
    kind: stated
    actor: 'TLS server'
    object: 'ServerHello (TLS 1.2) or Certificate message (TLS 1.3)'
    field: 'transparency_info extension_data = TransItemList'
    testable: 'yes'
    note: 'In TLS 1.3 the extension belongs in a CertificateEntry: R-0486.'
  - id: 'rfc-9162#R-0098'
    locator: '§6.5'
    source_lines: '1836-1837'
    text: 'If the list is empty, then the server SHOULD omit the extension_data element but MAY send it with an empty array.'
    verb: 'SHOULD'
    kind: stated
    actor: 'TLS server'
    object: 'transparency_info extension when the TransItemList is empty'
    field: 'extension_data'
    testable: 'partial'
    testable_reason: 'a TLS extension always has extension_data, possibly of zero length, so omitting the element can only mean omitting the extension; and an empty TransItemList cannot be encoded (trans_item_list<1..2^16-1>): SD-8.'
    note: 'SHOULD and MAY in one sentence; split into R-0372 and R-0373.'
  - id: 'rfc-9162#R-0099'
    locator: '§6.5'
    source_lines: '1839-1840'
    text: 'TLS servers MUST only include this extension in the following messages:'
    verb: 'MUST'
    kind: stated
    actor: 'TLS server'
    object: 'TLS handshake messages'
    field: 'transparency_info extension placement'
    testable: 'yes'
    note: 'The list is R-0374, R-0375. CertificateRequest has no defined meaning here, since §6.1 leaves client certificates out: SD-9.'
  - id: 'rfc-9162#R-0100'
    locator: '§6.5'
    source_lines: '1846-1848'
    text: 'TLS servers MUST NOT process or include this extension when a TLS session is resumed, since session resumption uses the original session information.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'TLS server'
    object: 'resumed TLS session'
    field: 'transparency_info extension'
    testable: 'yes'
    note: 'Client side: R-0112.'
  - id: 'rfc-9162#R-0101'
    locator: '§7.1'
    source_lines: '1854-1856'
    text: 'The Transparency Information X.509v3 extension, which has OID 1.3.101.75 and SHOULD be noncritical, contains one or more TransItem structures in a TransItemList.'
    verb: 'SHOULD'
    kind: stated
    actor: 'CA (certificate issuer, OCSP responder)'
    object: 'Transparency Information X.509v3 extension'
    field: 'critical flag'
    testable: 'yes'
    note: 'Appendix B (informative) permits only non-critical (CRITICALITY {FALSE}): SD-10.'
  - id: 'rfc-9162#R-0102'
    locator: '§7.1'
    source_lines: '1856-1858'
    text: 'This extension MAY be included in OCSP responses (see Section 7.1.1) and certificates (see Section 7.1.2).'
    verb: 'MAY'
    kind: stated
    actor: 'CA'
    object: 'OCSP responses and certificates'
    field: 'Transparency Information extension'
    testable: 'no'
    testable_reason: 'a permission; client support is required by R-0110.'
  - id: 'rfc-9162#R-0103'
    locator: '§7.1'
    source_lines: '1858-1860'
    text: 'Since [RFC5280] requires the extnValue field (an OCTET STRING) of each X.509v3 extension to include the DER encoding of an ASN.1 value, a TransItemList MUST NOT be included directly.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'CA'
    object: 'Transparency Information extension'
    field: 'extnValue'
    testable: 'yes'
  - id: 'rfc-9162#R-0104'
    locator: '§7.1'
    source_lines: '1861-1862'
    text: 'Instead, it MUST be wrapped inside an additional OCTET STRING, which is then put into the extnValue field:'
    verb: 'MUST'
    kind: stated
    actor: 'CA'
    object: 'Transparency Information extension'
    field: 'extnValue = DER OCTET STRING containing an OCTET STRING whose contents are the TransItemList'
    testable: 'yes'
    note: 'TransparencyInformationSyntax ::= OCTET STRING (R-0376) contains a TransItemList (R-0377).'
  - id: 'rfc-9162#R-0105'
    locator: '§7.1.1'
    source_lines: '1870-1872'
    text: 'A certification authority MAY include a Transparency Information X.509v3 extension in the singleExtensions of a SingleResponse in an OCSP response.'
    verb: 'MAY'
    kind: stated
    actor: 'CA (OCSP responder)'
    object: 'OCSP SingleResponse'
    field: 'singleExtensions'
    testable: 'no'
    testable_reason: 'a permission.'
  - id: 'rfc-9162#R-0106'
    locator: '§7.1.1'
    source_lines: '1872-1874'
    text: 'All included SCTs and inclusion proofs MUST be for the certificate identified by the certID of that SingleResponse or for a precertificate that corresponds to that certificate.'
    verb: 'MUST'
    kind: stated
    actor: 'CA (OCSP responder)'
    object: 'OCSP SingleResponse Transparency Information extension'
    field: 'SCTs and inclusion proofs in the TransItemList'
    testable: 'yes'
    note: 'Checked by validating each SCT (§8.1.3) and recomputing each leaf hash against the certificate named by certID.'
  - id: 'rfc-9162#R-0107'
    locator: '§7.1.2'
    source_lines: '1878-1879'
    text: 'A certification authority MAY include a Transparency Information X.509v3 extension in a certificate.'
    verb: 'MAY'
    kind: stated
    actor: 'CA'
    object: 'certificate'
    field: 'Transparency Information extension'
    testable: 'no'
    testable_reason: 'a permission.'
  - id: 'rfc-9162#R-0108'
    locator: '§7.1.2'
    source_lines: '1879-1881'
    text: 'All included SCTs and inclusion proofs MUST be for a precertificate that corresponds to this certificate.'
    verb: 'MUST'
    kind: stated
    actor: 'CA'
    object: 'certificate Transparency Information extension'
    field: 'SCTs and inclusion proofs in the TransItemList'
    testable: 'yes'
    note: 'Only precertificate SCTs (precert_sct_v2) can satisfy this: a certificate cannot embed an SCT for itself.'
  - id: 'rfc-9162#R-0109'
    locator: '§7.2'
    source_lines: '1885-1889'
    text: 'A certification authority SHOULD NOT issue any certificate that identifies the transparency_info TLS extension in a TLS feature extension [RFC7633], because TLS servers are not required to support the transparency_info TLS extension in order to participate in CT (see Section 6).'
    verb: 'SHOULD NOT'
    kind: stated
    actor: 'CA'
    object: 'certificate'
    field: 'TLS Feature extension (RFC 7633) listing extension type 52'
    testable: 'yes'
  - id: 'rfc-9162#R-0110'
    locator: '§8.1.1'
    source_lines: '1910-1911'
    text: 'CT-using TLS clients MUST implement all of the three mechanisms by which TLS servers may present SCTs (see Section 6).'
    verb: 'MUST'
    kind: stated
    actor: 'TLS client (CT-using)'
    object: 'the three presentation mechanisms of §6'
    field: 'transparency_info extension; stapled OCSP Transparency Information; certificate Transparency Information'
    testable: 'yes'
  - id: 'rfc-9162#R-0111'
    locator: '§8.1.1'
    source_lines: '1913-1915'
    text: 'TLS clients that support the transparency_info TLS extension (see Section 6.5) SHOULD include it in ClientHello messages, with empty extension_data.'
    verb: 'SHOULD'
    kind: stated
    actor: 'TLS client supporting transparency_info'
    object: 'ClientHello'
    field: 'transparency_info extension (empty extension_data)'
    testable: 'yes'
  - id: 'rfc-9162#R-0112'
    locator: '§8.1.1'
    source_lines: '1915-1917'
    text: 'If a TLS server includes the transparency_info TLS extension when resuming a TLS session, the TLS client MUST abort the handshake.'
    verb: 'MUST'
    kind: stated
    actor: 'TLS client'
    object: 'resumed TLS handshake'
    field: 'transparency_info extension'
    testable: 'yes'
    note: 'The alert to send is not specified.'
  - id: 'rfc-9162#R-0113'
    locator: '§8.1.3'
    source_lines: '1938-1939'
    text: 'In order to make use of a received SCT, the TLS client MUST first validate it as follows:'
    verb: 'MUST'
    kind: stated
    actor: 'TLS client'
    object: 'received SCT'
    field: 'SCT signature; reconstructed TimestampedCertificateEntryDataV2'
    testable: 'yes'
    note: 'The steps are R-0382 to R-0389.'
  - id: 'rfc-9162#R-0114'
    locator: '§8.1.4'
    source_lines: '1970-1973'
    text: 'When a TLS client has validated a received SCT but does not yet possess a corresponding inclusion proof, the TLS client MAY request the inclusion proof directly from a log using get-proof-by-hash (Section 5.4) or get-all-by-hash (Section 5.5).'
    verb: 'MAY'
    kind: stated
    actor: 'TLS client'
    object: 'get-proof-by-hash or get-all-by-hash request'
    field: 'hash, tree_size (inputs)'
    testable: 'no'
    testable_reason: 'a permission; disclosure to the log is the privacy cost (candidate C-0211, rejected as rationale).'
  - id: 'rfc-9162#R-0115'
    locator: '§8.1.5'
    source_lines: '1983-1985'
    text: 'When a TLS client has received, or fetched, an inclusion proof (and an STH), it SHOULD proceed to verify the inclusion proof to the provided STH.'
    verb: 'SHOULD'
    kind: stated
    actor: 'TLS client'
    object: 'inclusion proof and STH'
    field: 'inclusion_path, leaf_index, tree_size; sth root_hash'
    testable: 'yes'
    note: 'Verify means the outcome of §2.1.3.2: R-0461. The leaf hash to verify is R-0467; the STH signature should be checked first: R-0476.'
  - id: 'rfc-9162#R-0116'
    locator: '§8.1.5'
    source_lines: '1985-1986'
    text: 'The TLS client SHOULD also verify consistency between the provided STH and an STH it knows about.'
    verb: 'SHOULD'
    kind: stated
    actor: 'TLS client'
    object: 'STH pair'
    field: 'consistency proof (§5.3)'
    testable: 'partial'
    testable_reason: 'an STH it knows about is unspecified, so the pair under test is the client''s choice.'
    note: 'Verify means the outcome of §2.1.4.2: R-0462.'
  - id: 'rfc-9162#R-0117'
    locator: '§8.1.5'
    source_lines: '1988-1990'
    text: 'If the TLS client holds an STH that predates the SCT, it MAY, in the process of auditing, request a new STH from the log (Section 5.2) and then verify it by requesting a consistency proof (Section 5.3).'
    verb: 'MAY'
    kind: stated
    actor: 'TLS client'
    object: 'get-sth and get-sth-consistency requests'
    field: 'sth; consistency'
    testable: 'no'
    testable_reason: 'a permission.'
  - id: 'rfc-9162#R-0118'
    locator: '§8.1.6'
    source_lines: '2003-2005'
    text: 'Therefore, a TLS client MUST NOT evaluate compliance if it did not include both the transparency_info and status_request TLS extensions in the ClientHello.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'TLS client'
    object: 'CT compliance evaluation'
    field: 'ClientHello transparency_info and status_request extensions'
    testable: 'partial'
    testable_reason: 'evaluating compliance is internal; observable as a client that does not reject a connection on CT grounds when it sent the ClientHello without both extensions.'
  - id: 'rfc-9162#R-0119'
    locator: '§8.2'
    source_lines: '2014-2015'
    text: 'A monitor MUST at least inspect every new entry in every log it watches, and it MAY also choose to keep copies of entire logs.'
    verb: 'MUST'
    kind: stated
    actor: 'monitor'
    object: 'entries of every watched log'
    field: 'entries (get-entries output)'
    testable: 'partial'
    testable_reason: 'split: inspection (R-0393) is observable only through the monitor''s own reports; keeping copies (R-0394) is a permission.'
    note: 'MUST and MAY in one sentence; split into R-0393 and R-0394.'
  - id: 'rfc-9162#R-0120'
    locator: '§8.2'
    source_lines: '2017-2018'
    text: 'To inspect all of the existing entries, the monitor SHOULD follow these steps once for each log:'
    verb: 'SHOULD'
    kind: stated
    actor: 'monitor'
    object: 'existing entries of a log'
    field: 'get-sth, get-entries'
    testable: 'partial'
    testable_reason: 'the steps (R-0395 to R-0399) are observable in the requests a monitor makes; step 4 is conditional on interest.'
  - id: 'rfc-9162#R-0121'
    locator: '§8.2'
    source_lines: '2033-2034'
    text: 'To inspect new entries, the monitor SHOULD follow these steps repeatedly for each log:'
    verb: 'SHOULD'
    kind: stated
    actor: 'monitor'
    object: 'new entries of a log'
    field: 'get-sth, get-entries, get-sth-consistency'
    testable: 'partial'
    testable_reason: 'the steps (R-0400 to R-0412 and R-0407 to R-0411) are observable in the monitor''s requests; polling frequency is unspecified (candidate C-0221).'
  - id: 'rfc-9162#R-0122'
    locator: '§9'
    source_lines: '2130-2132'
    text: 'If it should become necessary to deprecate an algorithm used by a live log, then the log MUST be frozen, as specified in Section 4.13, and a new log SHOULD be started.'
    verb: 'MUST'
    kind: stated
    actor: 'log operator'
    object: 'live log whose algorithm is deprecated'
    field: 'log state (frozen); new log'
    testable: 'partial'
    testable_reason: 'split: when deprecation becomes necessary is a judgement; freezing (R-0421) is observable as the shutdown error and a Final STH; starting a new log (R-0422) only as a new Log ID appearing.'
    note: 'MUST and SHOULD in one sentence; split into R-0421 and R-0422. The MUST points at §4.13, whose actions are SHOULD (R-0060): SD-14.'
  - id: 'rfc-9162#R-0123'
    locator: '§9'
    source_lines: '2132-2134'
    text: 'Certificates in the frozen log that have not yet expired and require new SCTs SHOULD be submitted to the new log and the SCTs from that log used instead.'
    verb: 'SHOULD'
    kind: stated
    actor: 'submitters (CAs, certificate holders)'
    object: 'unexpired certificates of a frozen log'
    field: 'submit-entry to the new log'
    testable: 'partial'
    testable_reason: 'observable only as such certificates appearing in the new log and its SCTs being served.'
  - id: 'rfc-9162#R-0124'
    locator: '§10.2.5'
    source_lines: '2432-2433'
    text: 'Each application for the allocation of a Log ID MUST be accompanied by:'
    verb: 'MUST'
    kind: stated
    actor: 'applicant for a Log ID (log operator)'
    object: 'IANA Log IDs registry application'
    field: 'Log Base URL; Log Operator contact details'
    testable: 'partial'
    testable_reason: 'an IANA process; checkable only as registry rows carrying both columns.'
    note: 'The two items are R-0450 and R-0451.'
  - id: 'rfc-9162#R-0125'
    locator: '§11.3'
    source_lines: '2613'
    text: 'Logs SHOULD mitigate this risk by either:'
    verb: 'SHOULD'
    kind: stated
    actor: 'log'
    object: 'SCT and STH signatures'
    field: 'signature (SCT, STH)'
    testable: 'partial'
    testable_reason: 'option 1 is testable by requesting the same STH or resubmitting the same certificate and comparing signatures; option 2 cannot be kept literally together with R-0057 (SD-12).'
    note: 'The two options are R-0459 and R-0460.'
  - id: 'rfc-9162#R-0126'
    locator: '§1.2'
    source_lines: '231-232'
    text: 'Data structures are defined and encoded according to the conventions laid out in Section 3 of [RFC8446].'
    verb: 'none'
    kind: stated
    actor: 'every encoder and decoder of the protocol structures'
    object: 'all TLS presentation language structures (§4, §6.3)'
    field: 'encoding rules (RFC 8446 §3)'
    testable: 'yes'
    note: 'Vectors carry length prefixes sized by their ceilings; integers are big-endian.'
  - id: 'rfc-9162#R-0127'
    locator: '§2.1.1'
    source_lines: '323-325'
    text: 'Throughout this document, the hash algorithm in use is referred to as HASH and the size of its output in bytes is referred to as HASH_SIZE.'
    verb: 'none'
    kind: stated
    actor: 'implementer of the Merkle Tree Hash (log, monitor, auditor, client)'
    object: 'Merkle Tree notation'
    field: 'HASH, HASH_SIZE (output size in bytes)'
    testable: 'yes'
  - id: 'rfc-9162#R-0128'
    locator: '§2.1.1'
    source_lines: '325-328'
    text: 'The input to the Merkle Tree Hash is a list of data entries; these entries will be hashed to form the leaves of the Merkle Tree. The output is a single HASH_SIZE Merkle Tree Hash.'
    verb: 'none'
    kind: stated
    actor: 'implementer of the Merkle Tree Hash (log, monitor, auditor, client)'
    object: 'Merkle Tree Hash'
    field: 'input list; output of HASH_SIZE octets'
    testable: 'yes'
  - id: 'rfc-9162#R-0129'
    locator: '§2.1.1'
    source_lines: '328-329'
    text: 'Given an ordered list of n inputs, D_n = {d[0], d[1], ..., d[n-1]}, the Merkle Tree Hash (MTH) is thus defined as follows:'
    verb: 'none'
    kind: stated
    actor: 'implementer of the Merkle Tree Hash (log, monitor, auditor, client)'
    object: 'Merkle Tree Hash'
    field: 'D_n (ordered inputs)'
    testable: 'yes'
    note: 'The inputs of a log tree are the TLS-encoded leaf TransItems in index order (R-0247).'
  - id: 'rfc-9162#R-0130'
    locator: '§2.1.1'
    source_lines: '331-333'
    text: 'The hash of an empty list is the hash of an empty string: MTH({}) = HASH().'
    verb: 'none'
    kind: stated
    actor: 'implementer of the Merkle Tree Hash (log, monitor, auditor, client)'
    object: 'Merkle Tree Hash'
    field: 'MTH({}) = HASH()'
    testable: 'yes'
    note: 'For SHA-256 the empty-tree root is the SHA-256 of the empty string: R-0488.'
  - id: 'rfc-9162#R-0131'
    locator: '§2.1.1'
    source_lines: '335-337'
    text: 'The hash of a list with one entry (also known as a leaf hash) is: MTH({d[0]}) = HASH(0x00 || d[0]).'
    verb: 'none'
    kind: stated
    actor: 'implementer of the Merkle Tree Hash (log, monitor, auditor, client)'
    object: 'Merkle Tree Hash'
    field: 'leaf hash MTH({d[0]}) = HASH(0x00 || d[0])'
    testable: 'yes'
  - id: 'rfc-9162#R-0132'
    locator: '§2.1.1'
    source_lines: '339-343'
    text: 'For n > 1, let k be the largest power of two smaller than n (i.e., k < n <= 2k). The Merkle Tree Hash of an n-element list D_n is then defined recursively as: MTH(D_n) = HASH(0x01 || MTH(D[0:k]) || MTH(D[k:n])),'
    verb: 'none'
    kind: stated
    actor: 'implementer of the Merkle Tree Hash (log, monitor, auditor, client)'
    object: 'Merkle Tree Hash'
    field: 'MTH(D_n) = HASH(0x01 || MTH(D[0:k]) || MTH(D[k:n])), k the largest power of two below n'
    testable: 'yes'
  - id: 'rfc-9162#R-0133'
    locator: '§2.1.1'
    source_lines: '347'
    text: '* || denotes concatenation'
    verb: 'none'
    kind: stated
    candidate: 'C-0032'
    actor: 'implementer of the Merkle Tree Hash (log, monitor, client)'
    object: 'Merkle Tree notation'
    field: '|| (concatenation)'
    testable: 'partial'
    testable_reason: 'notation; tested through the MTH, PATH and PROOF definitions (R-0132, R-0150, R-0173).'
  - id: 'rfc-9162#R-0134'
    locator: '§2.1.1'
    source_lines: '349'
    text: '* : denotes concatenation of lists'
    verb: 'none'
    kind: stated
    candidate: 'C-0033'
    actor: 'implementer of the Merkle Tree Hash'
    object: 'Merkle Tree notation'
    field: ': (list concatenation)'
    testable: 'partial'
    testable_reason: 'notation; tested through PATH and PROOF.'
  - id: 'rfc-9162#R-0135'
    locator: '§2.1.1'
    source_lines: '351-352'
    text: '* D[k1:k2] = D''_(k2-k1) denotes the list {d''[0] = d[k1], d''[1] = d[k1+1], ..., d''[k2-k1-1] = d[k2-1]} of length (k2 - k1).'
    verb: 'none'
    kind: stated
    candidate: 'C-0034'
    actor: 'implementer of the Merkle Tree Hash'
    object: 'Merkle Tree notation'
    field: 'D[k1:k2] (sublist)'
