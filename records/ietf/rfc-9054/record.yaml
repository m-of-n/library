relations:
  # Added 2026-10-20 by the summary pass. Each edge has a stated reason in
  # summary.md; no edge is a bare "related".
  #   rfc-9679 — checked both ways: RFC 9679 cites RFC 9054 ZERO times and
  #     never names the "COSE Algorithms" registry, so it does NOT select its
  #     hash from here. Its `ckt` is a bare digest with nowhere to name H.
  #     RFC 9054 `-16` is the citation that would close that hole, and
  #     RFC 9679 cannot reach it — the same shape as the rfc-8230 edge
  #     rfc-9679 already carries.
  #   rfc-9964 — RFC 9964 cites RFC 9054 in its §9.1 NORMATIVE references and
  #     uses it with RFC 9053 as the template for its own COSE Algorithms
  #     registration actions (§8.1.1). rfc-9964's own record lists rfc-9053
  #     but not rfc-9054; authored here so the edge exists either way.
  # NOT authored: see_also rfc-9053. rfc-9053 already carries see_also
  # rfc-9054 and see_also is symmetric — docs/references.md, inverses are
  # derived, never authored.
  # NOT authored: contradicts rfc-9360. The Filter Only / `x5t` conflict is
  # real but its root is internal to RFC 9360 (§2 vs §5), so the edge is
  # authored on rfc-9360 and reasoned in both summaries.
  see_also:
    - rfc-9679
    - rfc-9964
  part_of:
    - ietf-cose-wg
bears_on:
  # Widened 2026-10-20 by the summary pass; each addition is argued in
  # summary.md rather than assumed.
  #   DEC-002 — it registers ZERO CBOR tags, so option 5's literal "no IANA
  #     tags" clause is untouched; the cost it exposes is the ABSENT digest
  #     carrier (§1, §2.1 — "This omission was intentional"), which option 1
  #     does not pay because rfc-2693 §2.8 defines `(hash …)`.
  #   DEC-003 — supplies the hash-identifier half of the mandatory clause and
  #     is silent on the half DEC-003 calls mandatory: canonical key bytes
  #     before hashing. It never says what gets hashed, anywhere.
  #   R-O-03 — a registered identifier is HOW a digest algorithm is cited
  #     rather than invented. `-16` discharges the algorithm half; the
  #     four-field structure around it (§2.1) stays an invention.
  #   R-O-05 — ADDED 2026-10-20 by the FX-1 extraction (pass 1), evidenced in
  #     distilled/design-notes.md section 6 rather than assumed. Section 1's definition
  #     of indirect signing puts the algorithm identifier INSIDE the signed
  #     content — "that hash value -- along with an identifier for the hash
  #     algorithm -- is included in the content that will be signed" — which is
  #     `topics/canonical-encoding.yaml` condition (4), an authenticated in-band
  #     type indicator. Same answer rfc-9360 section 2's `x5t` gives and the opposite
  #     of rfc-9679's bare `ckt`. Section 2.1's additional-data length rule is the
  #     other half: condition (1), injectivity, argued in a parenthetical and
  #     executed as a zero-work collision in distilled/examples/vectors.yaml
  #     V-0007.
  - DEC-002
  - DEC-003
  - DEC-005
  - R-M-07
  - R-O-03
  - R-O-05
