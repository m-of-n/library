  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: >-
        25 verbatim regions covering every normative statement of section 1 to
        section 5, in source order, each an exact run of source lines with its
        line range and its own sha256 (the region's lines joined by \n, no
        trailing newline). Includes section 1's two absence statements with
        "This omission was intentional", the paragraph holding BOTH of the
        document's BCP 14 keywords, both section 2.1 CDDL fragments as printed
        with erratum 7335 intact, all three registry tables with their captions,
        the SHA-256/64 NOTE, and section 4.1's two definitions of "Filter Only".
        297 distinct source lines, no line quoted twice. No section is split:
        this rendering has ZERO form feeds and no running headers or footers in
        498 lines. Built with split("\n"), never splitlines(). The section 1.1
        BCP 14 recital is quoted here and deliberately never in
        requirements.yaml
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: >-
        96 entries R-0001 to R-0096 in source order with no gaps: 2 stated, 94
        inferred. source_keyword_count and extracted_keyword_count both 2 and
        AGREEING (1 SHOULD NOT, 1 SHOULD), with a reconciliation written anyway
        because TWO KEYWORDS IN A 498-LINE DOCUMENT THAT CHANGES A REGISTRY'S
        SEMANTICS is itself the finding. Both keywords are in section 2, both
        are about collision attacks, and NEITHER IS DECIDABLE BY AN
        IMPLEMENTATION: the SHOULD NOT turns on "practical", which the document
        never defines and section 5 concedes moves over time, and the SHOULD is
        conditioned on alternatives being available AND migration being viable
        with "protocol maintainers and users" as its actor. SIX FORCE-BEARING
        SENTENCES CARRY NO KEYWORD AT ALL and each is recorded as kind: inferred
        with the carrying phrase named in `field` - including the document's
        whole position on agility ("Applications should also make sure...") and
