        case. All 96 texts verified mechanically as contiguous substrings of the
        whitespace-normalised source, 0 failures; a terminator check found 23
        over-running spans and all were tightened. bin/check-locators reports
        all 96 locators contained
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: >-
        7 files: 2 verbatim, 4 derived, 1 README. RFC 9054 NEVER USES THE WORD
        "CDDL" and prints two CDDL fragments - CDDL, ABNF, JSON Schema, schema
        and grammar each occur ZERO times, and RFC 8610 is in NEITHER reference
