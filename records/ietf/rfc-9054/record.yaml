distillation:
  standard: "FX-1"
  # NO `profile` IS DECLARED. Pass 1 (extract) is complete and the artifact set
  # is complete; pass 2 (verify) and pass 3 (cross-check) have NOT run and no
  # `reviewed_by` is signed. Under docs/extraction.md an unfinished extraction
  # has no profile at all, and that is the state of this record.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: >-
        25 verbatim regions covering every normative statement of section 1 to
        section 5, in source order, each an exact run of source lines with its
        line range and its own sha256 (the region's lines joined by \n, no
        trailing newline). Includes section 1's two absence statements with
        "This omission was intentional", the paragraph holding BOTH of the
        document's BCP 14 keywords, both section 2.1 CDDL fragments as printed
        with erratum 7335 intact, all three registry tables with their captions,
        the SHA-256/64 NOTE, and section 4.1's two definitions of "Filter Only".
        297 distinct source lines, no line quoted twice. No section is split:
        this rendering has ZERO form feeds and no running headers or footers in
        498 lines. Built with split("\n"), never splitlines(). The section 1.1
        BCP 14 recital is quoted here and deliberately never in
        requirements.yaml
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: >-
        96 entries R-0001 to R-0096 in source order with no gaps: 2 stated, 94
        inferred. source_keyword_count and extracted_keyword_count both 2 and
        AGREEING (1 SHOULD NOT, 1 SHOULD), with a reconciliation written anyway
        because TWO KEYWORDS IN A 498-LINE DOCUMENT THAT CHANGES A REGISTRY'S
        SEMANTICS is itself the finding. Both keywords are in section 2, both
        are about collision attacks, and NEITHER IS DECIDABLE BY AN
        IMPLEMENTATION: the SHOULD NOT turns on "practical", which the document
        never defines and section 5 concedes moves over time, and the SHOULD is
        conditioned on alternatives being available AND migration being viable
        with "protocol maintainers and users" as its actor. SIX FORCE-BEARING
        SENTENCES CARRY NO KEYWORD AT ALL and each is recorded as kind: inferred
        with the carrying phrase named in `field` - including the document's
        whole position on agility ("Applications should also make sure...") and
        the condition on SHA-256/64 ("it must be limited to..."), both lower
        case. All 96 texts verified mechanically as contiguous substrings of the
        whitespace-normalised source, 0 failures; a terminator check found 23
        over-running spans and all were tightened. bin/check-locators reports
        all 96 locators contained
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: >-
        7 files: 2 verbatim, 4 derived, 1 README. RFC 9054 NEVER USES THE WORD
        "CDDL" and prints two CDDL fragments - CDDL, ABNF, JSON Schema, schema
        and grammar each occur ZERO times, and RFC 8610 is in NEITHER reference
        list. cose-hash-structures.cddl carries both fragments byte for byte
        WITH ERRATUM 7335 INTACT; source-renderings.txt carries Tables 1-3, the
        four-field prose bullets and the SHA-256/64 NOTE as 5 regions. Derived:
        cose-hash.derived.cddl (erratum 7335 applied, the map wrapper the
        document never supplies, and this library's own structure, with the
        round-trip to the verbatim bytes ASSERTED by the generator);
        hash-algorithms.derived.yaml (the eight rows as data, each with its CBOR
        encoding computed, which is how section 4.1's size rationale was found
        to be backwards); cose-hash.derived.schema.json with $id
        urn:library:rfc-9054:cose-hash.derived; and cddl-parse.derived.txt,
        WHICH CARRIES THIS RECORD'S SHARPEST SCHEMA RESULT - COSE_Hash_V as
        printed DOES parse, as a group of 24 entries rather than 4 with 15
        undefined names harvested from the comment words, so the failure is at
        NAME RESOLUTION and not at syntax; and even with the erratum applied it
        is a GROUP, not a type, which RFC 8610 section 2.2.4 forbids as a root
        and which no erratum covers
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: >-
        4 structures and 16 fields, which is everything the document offers or
        registers: both section 2.1 example structures with all six of their
        fields, all eight registry rows with their CBOR encodings computed, and
        the "Filter Only" column value with the two rows that carry it. THE FILE
        OPENS BY SAYING WHAT IS NOT THERE, because that is the finding: RFC 9054
        defines no message and no normative structure, section 1 says COSE
        defines no digested-object structure and that the omission was
        intentional, and both section 2.1 fragments are introduced as examples.
        28 requirement ids wired, every one selected from the id table by a
        uniqueness-enforcing predicate; 3 cross-record ids cited in full from
        rfc-9360's own id table. Records that section 4.1's two-byte rationale
        is false for five of eight allocations, and that COSE_Hash_Find is
        rfc-9360's COSE_CertHash field for field
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: >-
        8 vectors: 1 printed, 6 computed, 1 derived census. RFC 9054 PRINTS NOT
        ONE DIGEST VALUE for any of the eight algorithms it registers, including
        the one it defines itself - Figure, Appendix and vector each ZERO
        occurrences - so one fixed input is declared in the file and every
        digest is computed over it, letting any value be recomputed from the
        file alone. THREE RESULTS TO CARRY FORWARD: V-0003 computes BOTH
        readings of SHA-256/64 and shows the document admits both, because
        section 3.2's NOTE is the whole definition and does not say which 64
        bits (the analogous rule IS stated one document away, in rfc-9053
        section 3.1's leftmost-bits sentence, and RFC 9054 does not cite it);
        V-0006 shows COSE_Hash_Find and rfc-9360's COSE_CertHash encode
        IDENTICALLY for all eight algorithms; and V-0007 executes section 2.1's
        length rule and exhibits the ZERO-WORK COLLISION it prevents -
        ("AB","C") and ("A","BC") concatenate to the same three octets and hash
        the same, while their CBOR array encodings differ. V-0001 is the
        measurement that contradicts section 4.1; V-0004 shows SHA-512/256 is
        not a truncated SHA-512, which Table 2's own Description column says it
        is; V-0005 carries both section 2.1 fragments verbatim with their
        mechanical parse verdicts. 18 requirement ids wired, 2 cross-record ids
        in full
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: >-
        13 sections. THE CENTRAL FINDING: the document registers the identifiers
        and refuses the carrier, so citing -16 discharges the ALGORITHM half of
        R-O-03 and the four-field structure around it stays an invention with
        nothing to cite - which is also a reportable gap in R-O-03's own
        wording, since the rule as written does not cover the envelope. ONE
        CLAIM IN THIS RECORD'S SUMMARY IS REFUTED: COSE_Hash_V does parse, and
        the mechanism is name resolution rather than syntax; the worse defect,
        that it is a group rather than a type and cannot be a root, no erratum
        covers. THE CROSS-RECORD CHAIN NEITHER RECORD REACHES ALONE is section
        4.1: section 3.2 justifies registering a 64-bit truncation by citing
        rfc-9360's DRAFT and by the argument that a false positive is caught
        downstream by testing the public key, and rfc-9360 section 2's
        recommended configuration has no such test - so the registration's own
        justification does not hold in the position the justifying document
        recommends. MD-3 MAPPED HEADER BY HEADER over 7 of our fields, THEN FOUR
        CUTS AND ONE CONVERGENCE, each naming the DEC-002 option: (1) the
        expensive dependency is an ABSENT STRUCTURE rather than a tag - zero
        CBOR tags registered - and option 1 does not pay it because rfc-2693
        section 2.8's (hash ...) cites carrier and algorithm together; (2) the
        export format cannot carry the fitness judgement, because Recommended is
        a registry column and both candidate structures have two fields, costing
        option 5 by construction; (3) citing the registry inherits an
        UNDER-SPECIFIED VALUE, because an option that adopts a registry adopts
        its worst member; (4) section 4.1's own size rationale is backwards for
        five of eight allocations, which is a source defect AND a point IN
        OPTION 5'S FAVOUR, because reduced CBOR makes you count octets and
        counting octets is what catches it; and (5) a CONVERGENCE rather than a
        cut - section 2.1's injectivity rule names the CBOR array as its
        mechanism, which reduced CBOR supplies free. All six canonical-encoding
        conditions scored: one SUPPLIED (condition (1), in a parenthetical), one
        passed, three unaddressed, one failed. 4 adopts, 3 adaptations, 5
        rejections. All nine of the summary's findings tested: six confirmed,
        one refuted, two scoped - including the summary's "it does not cut
        against MD-3" verdict, which this pass WITHDRAWS. 9 source defects, 8 of
        them covered by no erratum. 6 open questions. 20 quotations of RFC 9054,
        every one cut from the cache by line range by script and verified; every
        quotation of a mofn document is marked UNVERIFIABLE FROM THIS REPOSITORY
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: >-
        NO PROTOCOL IS DEFINED, and the verdict is measured rather than
        assumed. Counted as whole words over all 498 lines: `sender`,
        `recipient`, `receiver`, `verifier`, `exchange`, `handshake`,
        `negotiate`, `negotiation`, `response`, `server`, `client`, `retrieve`,
        `GET`, `intermediary` and "relying party" each occur ZERO times.
        `protocol` occurs ONCE, at line 148, inside "SHOULD trigger protocol
        maintainers and users to review"; `party` ONCE, at line 403, inside "is
        it the originator that is the attacker or a third party?"; `verify`
        ONCE, at line 162; `request` ONCE, at line 6, in the masthead.
        Section 1's indirect-signing paradigm is the closest thing to a flow and it
        is a DESCRIPTION rather than a specification - it names no parties, no
        messages, no media types, no ordering obligation and no error path, and
        the only worked instance it points at is section 5.4 of an Internet-Draft.
        Section 2's filtering argument is a two-sentence procedure at a single party.
        And section 1 states in terms that the structure such a flow would carry does
        not exist: COSE "does not define a structure syntax that is used to
        encode a digested object structure along the lines of the DigestedData
        ASN.1 structure in [CMS]", and "This omission was intentional". The
        protocol obligations it does state - section 5's analysis and agility
        requirements - are addressed to OTHER documents' protocols. Contrast
        rfc-9360 in the same lane, which IS applicable with four parties, a GET
        carrying a transport-security SHOULD, an active intermediary and a
        two-check join: the split is in the documents, not in how hard each was
        looked at. distilled/protocol.yaml and protocol.md carry the
        measurement, the counts and where the protocol lives instead.
    - kind: state-machine
      reason: >-
        NO LIFECYCLE AND NO STATE MACHINE, and the verdict is measured.
        Counted as whole words over all 498 lines: `state`, `lifecycle`,
        `transition`, `revoke`, `revocation`, `rotate`, `rotation`, `expire`,
        `expiry`, `expiration`, `issue`, `issuance`, `enroll`, `step`, `steps`
        and `order` each occur ZERO times - AND BOTH OCCURRENCES OF `states`
        ARE "United States", at lines 233 and 266. What the document produces
        is eight integers and one registry column value; an integer has no
        lifecycle, and IANA allocates it once. The one thing that looks like a
        lifecycle is a lifecycle OF THE REGISTRY and the document declines to
        model it: there is a progression in view - sound, theoretically
        attacked, practically attacked, Filter Only, unusable - and NOT ONE OF
        ITS STEPS IS DEFINED. The actor is "protocol maintainers and users",
        i.e. people rather than code; the trigger ("practical") is undefined;
        the transition is a REVIEW rather than a change of state; and nothing
        says how the Recommended column is ever revised. SHA-1 is the worked
        case: the document records that the IETF started discouraging it in
        2011 and registers it anyway in 2022, with a lower-case "it should no
        longer be used" and an escape hatch for an HSM "that cannot be
        replaced". A machine over that would be OURS ENTIRELY, with no sentence
        of the document behind any transition - which is the line this library
        does not cross, and the difference from rfc-9360, where the same pass
        DID write two machines because two normative sentences there are
        propositions about a system changing over time. The consequence for us
        is recorded in distilled/state-machine.yaml: R-O-03 is satisfied today
        by citing -16, and NOTHING HERE TELLS US WHAT TO DO WHEN -16 WEAKENS,
        so the agility policy is ours to write in full.
  passes:
    - pass: extract
      by: "claude-opus-5 (pass 1 of library#39 Tier 2, COSE X.509 / hash lane; single agent, whole artifact set, two records)"
      effort: max
      date: "2026-10-20"
      note: >-
        Read only .cache/rfc-9054.txt - never summary.md and never another
        record's artifacts, except where a cross-record claim had to be
        verified against another record's own cached source (rfc-9679's zero
        citations of RFC 9054 and zero mentions of the COSE Algorithms
        registry; rfc-9053's leftmost-bits truncation sentence at lines
        424-425) or against an artifact this library already holds at
        profile: full (rfc-8610's CDDL grammar and its 44 enumerated grammar
        gaps).

        EVERY VERBATIM BLOCK AND EVERY QUOTATION WAS LIFTED FROM THE CACHE BY
        LINE RANGE BY SCRIPT, never retyped, and verified mechanically: 96 of
        96 requirement texts and 20 of 20 design-note quotations are contiguous
        substrings of the whitespace-normalised source, 0 failures. 25
        normative.md regions and 5 schema regions carry their own sha256 over
        the region's lines joined by \n with no trailing newline. A terminator
        check caught 23 over-running spans and all were tightened. There is no
        page decoration in this source - zero form feeds, checked.

        THE CDDL QUESTION WAS CLOSED IN THIS PASS rather than argued. A
        recursive-descent parser for RFC 8610 Appendix B's grammar was written
        here, transcribed production for production from this library's own
        capture of that grammar and gated first on RFC 8610's 40-rule prelude,
        on rfc-9360's two rules and on three deliberate negatives. It REFUTES
        this record's summary on one point and confirms a worse defect the
        summary does not reach. A CBOR encoder was written from RFC 8949
        section 3 - no CBOR or COSE library - because the document prints no
        encoded value at all, and it produced the measurement that contradicts
        section 4.1's own size rationale.

        CROSS-ARTIFACT CONSISTENCY WAS CHECKED AT WRITE TIME AND BY A LANE-WIDE
        JOIN AUDIT. Every requirement id cited by messages.yaml,
        examples/vectors.yaml, protocol.yaml, state-machine.yaml and the schema
        files was SELECTED FROM THE ID TABLE BY A UNIQUENESS-ENFORCING
        PREDICATE, never typed or pattern-matched - the selector REFUSED four
        times during this pass on ambiguous predicates and each was narrowed
        rather than guessed. The audit then resolved all 271 citations across
        both records to the requirement texts they point at and printed the
        pairs for reading: 0 dangling, 14 cross-record, every cross-record id
        spelled in full because both records define the same bare numbers.
        Both of the library's YAML readers parse every file written here.

        ONE CLAIM IN THIS RECORD'S OWN summary.md IS REFUTED AS STATED and the
        falsified wording is recorded in place rather than edited away:
        COSE_Hash_V DOES parse. The summary's conclusion stands and its
        mechanism does not. A second summary claim - that this document does
        not cut against MD-3 - is WITHDRAWN by this pass, which names four
        cuts and one convergence.
status: summarized
usefulness:
  verdict: useful
  reason: "Registers the eight COSE hash algorithm identifiers R-M-07 and R-O-03 need to CITE rather than invent — and, decisively, no structure to carry them: §1 and §2.1 state COSE defines no digest carrier, so the envelope stays ours."
  assessed: "2026-10-20"
confidence: high
owner: S1
