# Every structure and registry row RFC 9054 defines, offers or registers.
# Section numbers are RFC 9054's unless another document is named.
#
# ---------------------------------------------------------------------------
# THE FIRST THING TO SAY IS WHAT IS NOT HERE
# ---------------------------------------------------------------------------
# RFC 9054 DEFINES NO MESSAGE AND NO NORMATIVE STRUCTURE. §1: COSE "does not
# define a structure syntax that is used to encode a digested object structure
# along the lines of the DigestedData ASN.1 structure in [CMS]. This omission
# was intentional". §2.1 repeats it: "[COSE] did not provide a default
# structure for holding a hash value". The two CDDL fragments §2.1 prints are
# introduced as "An example of a structure ... would look like the following"
# and "Below is an alternative structure that could be used"; neither is
# normative and neither is registered anywhere.
#
# So this file carries THREE things: the two offered example structures, with
# what is actually wrong with them; and the eight registry rows, which are the
# document's real content. Nothing here is a message in the sense the FX-1
# template means, and that is the finding rather than a gap.
#
# ---------------------------------------------------------------------------
# PROVENANCE
# ---------------------------------------------------------------------------
# RFC 9054 PRINTS NOT ONE DIGEST VALUE AND NOT ONE ENCODED IDENTIFIER.
# `Figure`, `Appendix`, `vector` and "test vector" occur ZERO times; there is
# no hex and no base64 anywhere in the document. Every `cbor_head` and every
# octet count below was COMPUTED for this pass from RFC 8949 §3 with an
# encoder written here - no CBOR or COSE library - and is labelled
# `computed: true`. The CDDL verdicts were produced by a parser for RFC 8610
# Appendix B's grammar written for this pass; see
# ../schema/cddl-parse.derived.txt.
#
# `constrained_by` IS WIRED FROM THE ID TABLE BY SCRIPT, with a predicate on
# each entry's own locator, object and field that refuses to resolve unless it
# is unique. A join audit printing every id beside the statement it resolves
# to was read before this file was accepted.

messages:

  # =========================================================================
  - name: COSE_Hash_V
    locator: "§2.1, source lines 211-216"
    encoding: "CDDL GROUP - not a type, and not instantiable as printed"
    status: 'EXAMPLE, not normative; and it does not say what it looks like'
    summary: >-
      THE FOUR-FIELD STRUCTURE, AND IT HAS TWO DEFECTS, ONE OF WHICH NO
      ERRATUM COVERS.

      Defect 1, erratum 7335 (Reported, Technical, §2.1, Carsten Bormann,
      2023-02-06): the comment marker is `#`, where CDDL's is `;` (RFC
      8610 Appendix B: `COMMENT = ";" *PCHAR CRLF`). `#` is CDDL's TAG
      operator. MEASURED rather than inferred: the fragment STILL PARSES,
      as a group of 24 entries instead of 4 - four member entries, four
      `#` read as the "any" type, and sixteen comment words read as bare
      type references, 15 of them distinct. None begins with `$`, so RFC
      8610 §3.9's socket convention does not silence them and a
      name-resolving tool rejects the file. The defect is real; "it does
      not parse" is not the mechanism.

      Defect 2, covered by nothing: even with the erratum applied it is a
      parenthesised GROUP, not a type. Forced as a type rule it fails
      after 14 characters, because a parenthesised `type` cannot contain
      member keys. RFC 8610 §2.2.4: "there is no way to use a group as a
      root -- it must be a type". So it needs a `{ }` the document never
      supplies, and the member keys mean a map is the only legal wrapper.
      ../schema/cose-hash.derived.cddl supplies it.
    computed: false    # nothing is encoded here; the fragment is text
    fields:
      - name: 'algorithm identifier'
        label: 1
        type: "int / tstr"
        required: true
        encoding: "map entry, integer key 1"
        locator: "§2.1"
        constrained_by:
          - 'rfc-9054#R-0043'
          - 'rfc-9054#R-0036'
          - 'rfc-9054#R-0037'
          - 'rfc-9054#R-0008'
        note: >-
          THE FIELD THAT MATTERS FOR R-O-03. §1's definition of indirect
          signing puts this identifier INSIDE the signed content: "a hash
          of the content is computed, and that hash value -- along with an
          identifier for the hash algorithm -- is included in the content
          that will be signed". That is an authenticated in-band algorithm
          indicator, which is the shape R-O-05's type-indicator clause
          wants, and it is the opposite of rfc-9679's bare `ckt`.
      - name: 'hash value'
        label: 2
        type: "bstr"
        required: true
        encoding: "map entry, integer key 2"
        locator: "§2.1"
        constrained_by:
          - 'rfc-9054#R-0043'
          - 'rfc-9054#R-0036'
          - 'rfc-9054#R-0038'
        note: >-
          No length rule anywhere, for any of the eight algorithms.
      - name: 'location of object that was hashed'
        label: 3
        type: "tstr"
        required: false
        encoding: "map entry, integer key 3"
        locator: "§2.1"
        constrained_by:
          - 'rfc-9054#R-0043'
          - 'rfc-9054#R-0036'
          - 'rfc-9054#R-0039'
        note: >-
          A text string with no stated syntax: "a pointer to a file, an
          object that can be obtained from the network, a pointer to
          someplace in the message, or something very application
          specific". Four kinds of thing in one `tstr` and no way to tell
          them apart.
      - name: 'additional data'
        label: 4
        type: "any"
        required: false
        encoding: "map entry, integer key 4"
        locator: "§2.1"
        constrained_by:
          - 'rfc-9054#R-0043'
          - 'rfc-9054#R-0036'
          - 'rfc-9054#R-0040'
          - 'rfc-9054#R-0041'
        note: >-
          `any`, and the salt rationale is a second-preimage argument:
          "because the payload handed to the application could have been
          selected to have a collision". The length rule attached to it is
          the one piece of canonicalization constraint in the document.
    defects:
      - 'erratum 7335 (Reported): # instead of ; as the comment marker. rfc-9054#R-0043'
      - 'NO ERRATUM: it is a group, not a type, so RFC 8610 section 2.2.4 forbids it as a root and the document supplies no wrapper.'
      - 'NO ERRATUM: field 3 is a tstr carrying four different kinds of reference with no discriminator. rfc-9054#R-0039'

  # =========================================================================
  - name: COSE_Hash_Find
    locator: "§2.1, source lines 224-227"
    encoding: "CBOR array of exactly two elements"
    status: 'EXAMPLE, not normative - but it parses, and as a TYPE rule'
    summary: >-
      THE TWO-FIELD STRUCTURE, AND IT IS rfc-9360's COSE_CertHash.
      Verbatim: `COSE_Hash_Find = [ hashAlg : int / tstr, hashValue : bstr
      ]`. rfc-9360 §2 line 312: `COSE_CertHash = [ hashAlg: (int / tstr),
      hashValue: bstr ]`. Same member key names, same types, same order;
      the only difference is a pair of parentheses that changes nothing.
      Same working group, same author, two documents six months apart, and
      NEITHER CITES THE OTHER'S STRUCTURE - rfc-9360 cites RFC 9054 zero
      times, and RFC 9054 cites rfc-9360 only as draft-ietf-cose-x509-08
      and only for the scenarios, never for the type.

      §2.1 says why the location and the additional data are dropped in
      this variant: "In this case, the location would not be needed, and
      adding extra data to the hash would be counterproductive." So the
      two structures are for different threat models, and the document
      says which.

      AND THIS IS THE SHAPE WITH NO ROOM FOR A PURPOSE. Two fields, so
      "Filter Only" - a registry column - cannot travel with the value.
    layout: >-
      COMPUTED. `[-16, h'<32 octets>']` encodes as 36 octets: `82` (array
      of 2), `2f` (-16), `5820`, then the digest. With -14 and a 20-octet
      SHA-1 digest it is 23 octets; with -15 and 8 octets, 11. Every
      algorithm's cost is tabulated in ../examples/vectors.yaml.
    computed: true
    fields:
      - name: hashAlg
        index: 0
        type: "int / tstr"
        required: true
        encoding: "major type 0 or 1 (integer form), major type 3 (string form)"
        locator: "§2.1"
        constrained_by:
          - 'rfc-9054#R-0045'
          - 'rfc-9054#R-0037'
        note: >-
          The eight values this document registers are the integer form;
          the registry holds no text identifier for a hash algorithm, so
          the `tstr` branch is unreachable today in both this structure
          and rfc-9360's.
      - name: hashValue
        index: 1
        type: "bstr"
        required: true
        encoding: "major type 2; length unconstrained"
        locator: "§2.1"
        constrained_by:
          - 'rfc-9054#R-0045'
          - 'rfc-9054#R-0038'

  # =========================================================================
  - name: COSE-Algorithms-registry-rows
    locator: "§3.1 Table 1, §3.2 Table 2, §3.3 Table 3, §4.1"
    encoding: "registry rows, not wire format; the Value column is what travels"
    summary: >-
      THE DOCUMENT'S ACTUAL CONTENT: eight rows, five columns, three
      tables, three different column layouts. The Value column is the only
      part that appears on a wire, as a CBOR integer in a `hashAlg`
      position. ../schema/ hash-algorithms.derived.yaml is the same data
      as machine-readable rows.

      THE COST MEASUREMENT §4.1 INVITES AND DOES NOT MAKE. §4.1 says "use
      of a two-byte algorithm identifier seems reasonable" and that for
      SHA-1 "a longer algorithm identifier is appropriate even though it
      is a shorter hash value". Against RFC 8949 §3, FIVE OF THE EIGHT
      ENCODE IN ONE OCTET (-14 to -18 are 0x2d to 0x31) and SHA-1 at -14
      is in the SHORTEST class available, while SHA-384 at -43 costs two.
      The allocation does the opposite of what the rationale says. No
      erratum covers it.
    computed: true
    fields:
      - name: SHA-1
        value: -14
        type: "COSE Algorithms registry entry"
        required: false
        encoding: "0x2d, 1 octet(s) (RFC 8949 §3, computed)"
        digest_bits: 160
        recommended: 'Filter Only'
        cose_capabilities: '[]'
        locator: "§3.1"
        constrained_by:
          - 'rfc-9054#R-0054'
          - 'rfc-9054#R-0053'
          - 'rfc-9054#R-0080'
          - 'rfc-9054#R-0088'
        note: >-
          BROKEN AND REGISTERED ANYWAY, with the reason stated: "there are
          still times where SHA-1 needs to be used" - unreplaceable HSMs,
          and filtering. §3.1 cites the 2017 full collision and RFC 6194.
          The strongest thing said about it is the LOWER-CASE "the fact
          that it should no longer be used".
      - name: SHA-256/64
        value: -15
        type: "COSE Algorithms registry entry"
        required: false
        encoding: "0x2e, 1 octet(s) (RFC 8949 §3, computed)"
        digest_bits: 64
        recommended: 'Filter Only'
        cose_capabilities: '[]'
        locator: "§3.2"
        constrained_by:
          - 'rfc-9054#R-0067'
          - 'rfc-9054#R-0066'
          - 'rfc-9054#R-0080'
          - 'rfc-9054#R-0088'
        note: >-
          THE ROW THAT COSTS US MOST, for three separate reasons. (1) 64
          bits, so a birthday collision is about 2^32 work. (2) Its
          definition is one sentence of a NOTE - "a simple truncation of
          SHA-256 to 64 bits defined in this specification" - WHICH DOES
          NOT SAY WHICH 64 BITS, and the document prints no test vector;
          ../examples/vectors.yaml carries both candidate values over one
          input and they differ. (3) ITS JUSTIFICATION IS rfc-9360's
          DRAFT: §3.2 says the noncryptographic case applies "for some of
          the scenarios identified in [COSE-x509], specifically, for the
          cases when the hash value is used to select among possible
          certificates: if there are multiple choices remaining, then each
          choice can be tested by using the public key." rfc-9360 §2's
          recommended configuration puts `x5t` in the PROTECTED bucket as
          the integrity binding for an `x5chain` an intermediary may
          rewrite - where no such downstream test of the certificate's
          identity happens. See ../design-notes.md §4.
        cross_record:
          - 'rfc-9360#R-0046'   # x5t provides integrity protection of the end-entity certificate
          - 'rfc-9360#R-0035'   # x5chain unprotected plus x5t protected
      - name: SHA-256
        value: -16
        type: "COSE Algorithms registry entry"
        required: false
        encoding: "0x2f, 1 octet(s) (RFC 8949 §3, computed)"
        digest_bits: 256
        recommended: 'Yes'
        cose_capabilities: '[]'
        locator: "§3.2"
        constrained_by:
          - 'rfc-9054#R-0068'
          - 'rfc-9054#R-0066'
          - 'rfc-9054#R-0080'
          - 'rfc-9054#R-0088'
        note: >-
          THE CITATION R-O-03 NEEDS, and the only value rfc-9360 §2 makes
          mandatory to support.
        cross_record:
          - 'rfc-9360#R-0047'   # applications using x5t MUST support SHA-256
      - name: SHA-512/256
        value: -17
        type: "COSE Algorithms registry entry"
        required: false
        encoding: "0x30, 1 octet(s) (RFC 8949 §3, computed)"
        digest_bits: 256
        recommended: 'Yes'
        cose_capabilities: '[]'
        locator: "§3.2"
        constrained_by:
          - 'rfc-9054#R-0071'
          - 'rfc-9054#R-0066'
          - 'rfc-9054#R-0080'
          - 'rfc-9054#R-0088'
        note: >-
          NOT A TRUNCATION OF SHA-512. §3.2's NOTE separates it:
          "SHA-512/256 is a modified variant of SHA-512 truncated to 256
          bits, as defined in [FIPS-180-4]". Measured in
          ../examples/vectors.yaml: the first 256 bits of SHA-512 and
          SHA-512/256 of the same input differ.
      - name: SHAKE128
        value: -18
        type: "COSE Algorithms registry entry"
        required: false
        encoding: "0x31, 1 octet(s) (RFC 8949 §3, computed)"
        digest_bits: 256
        recommended: 'Yes'
        cose_capabilities: '[]'
        locator: "§3.3"
        constrained_by:
          - 'rfc-9054#R-0078'
          - 'rfc-9054#R-0077'
          - 'rfc-9054#R-0080'
          - 'rfc-9054#R-0088'
        note: >-
          AN XOF PINNED TO A FIXED OUTPUT LENGTH by this document: "no
          algorithm identifier is created for shorter lengths". So a SHAKE
          identifier carries its length, while -15 carries a truncation
          the document does not locate - the two decisions are
          inconsistent and §3.3 gives no reason.
      - name: SHA-384
        value: -43
        type: "COSE Algorithms registry entry"
        required: false
        encoding: "0x382a, 2 octet(s) (RFC 8949 §3, computed)"
        digest_bits: 384
        recommended: 'Yes'
        cose_capabilities: '[]'
        locator: "§3.2"
        constrained_by:
          - 'rfc-9054#R-0069'
          - 'rfc-9054#R-0066'
          - 'rfc-9054#R-0080'
          - 'rfc-9054#R-0088'
      - name: SHA-512
        value: -44
        type: "COSE Algorithms registry entry"
        required: false
        encoding: "0x382b, 2 octet(s) (RFC 8949 §3, computed)"
        digest_bits: 512
        recommended: 'Yes'
        cose_capabilities: '[]'
        locator: "§3.2"
        constrained_by:
          - 'rfc-9054#R-0070'
          - 'rfc-9054#R-0066'
          - 'rfc-9054#R-0080'
          - 'rfc-9054#R-0088'
      - name: SHAKE256
        value: -45
        type: "COSE Algorithms registry entry"
        required: false
        encoding: "0x382c, 2 octet(s) (RFC 8949 §3, computed)"
        digest_bits: 512
        recommended: 'Yes'
        cose_capabilities: '[]'
        locator: "§3.3"
        constrained_by:
          - 'rfc-9054#R-0079'
          - 'rfc-9054#R-0077'
          - 'rfc-9054#R-0080'
          - 'rfc-9054#R-0088'
        note: >-
          AN XOF PINNED TO A FIXED OUTPUT LENGTH by this document: "no
          algorithm identifier is created for shorter lengths". So a SHAKE
          identifier carries its length, while -15 carries a truncation
          the document does not locate - the two decisions are
          inconsistent and §3.3 gives no reason.
    absent_columns:
      - 'No digest length column: the lengths above come from section 3.2 and section 3.3 prose and from FIPS 180-4 / FIPS 202, not from the tables.'
      - 'No purpose column that travels. Recommended is a REGISTRY column; nothing in COSE carries it. rfc-9054#R-0034, rfc-9054#R-0087'

  # =========================================================================
  - name: "Recommended column value: Filter Only"
    locator: "§2 (lines 173-177), §4.1 (lines 387-392)"
    encoding: "a value in an IANA registry column - NOT a field, NOT on the wire"
    summary: >-
      THE DOCUMENT'S ONE STRUCTURAL CONTRIBUTION, AND IT IS DEFINED TWICE
      IN DIFFERENT WORDS.

      §2: "Filter Only" indicates that the only purpose of a hash function
      should be to filter results; it is not intended for applications
      that require a cryptographically strong algorithm." - about
      STRENGTH, and the force word is the lower-case "should".

      §4.1: "This value is only to be used for hash functions and
      indicates that it is not to be used for purposes that require
      collision resistance." - about ONE SPECIFIC PROPERTY.

      These are not the same constraint, and the second is the one the
      conflict with rfc-9360 turns on. Neither is a BCP 14 statement, and
      this is an Informational document.

      AND IT IS UNENFORCEABLE BY CONSTRUCTION. A registry column is not a
      wire field. COSE_Hash_Find and rfc-9360's COSE_CertHash both have
      exactly two fields, so a verifier handed `[-14, h'...']` cannot tell
      whether the sender was filtering or binding.
      ../examples/vectors.yaml demonstrates that the two uses are
      byte-identical.
    computed: false
    fields:
      - name: 'Filter Only'
        type: "registry column value"
        required: false
        encoding: "none - it exists only in the IANA registry"
        locator: "§2, §4.1"
        constrained_by:
          - 'rfc-9054#R-0034'
          - 'rfc-9054#R-0087'
          - 'rfc-9054#R-0033'
          - 'rfc-9054#R-0086'
      - name: 'the two values that carry it'
        type: "COSE Algorithms registry entries"
        required: false
        encoding: "-14 (0x2d) and -15 (0x2e)"
        locator: "§3.1 Table 1, §3.2 Table 2"
        constrained_by:
          - 'rfc-9054#R-0054'
          - 'rfc-9054#R-0067'
          - 'rfc-9054#R-0060'
          - 'rfc-9054#R-0061'

coverage: >-
  Four structures and 16 fields, which is everything RFC 9054 offers or
  registers: both §2.1 example structures with all six of their fields,
  all eight registry rows, and the "Filter Only" column value with the
  two rows that carry it. 28 of ../requirements.yaml's 96 requirement
  ids are wired here. The ones that are not are §1's motivation, §2's
  prose about collision attacks, §3's provenance paragraphs and all of
  §5 - they constrain no byte, because THIS DOCUMENT CONSTRAINS NO
  BYTES. Its whole output is eight integers and a column value, and the
  structure that would carry them is, in its own words, an omission that
  "was intentional".
absent_by_measurement:
  - 'A normative structure of any kind: section 1 and section 2.1 both say COSE provides none, and section 1 calls the omission intentional.'
  - 'CBOR tags: ZERO. `tag` appears once, inside the word `tagged` at line 383, about the Recommended column.'
  - 'kid, thumbprint, key identifier: ZERO occurrences. This document is about hashing OBJECTS, and the object it names is a certificate.'
  - 'Canonical form: `canonical`, `canonicalization` and `deterministic` ZERO occurrences. The nearest thing is section 2.1''s length rule on additional data.'
  - 'Test vectors: ZERO. No hex, no base64, no digest value, for any of the eight algorithms - including the one it defines itself.'
  - 'A length rule on hashValue, in either structure, for any algorithm.'
  - 'Any statement of which 64 bits SHA-256/64 keeps.'
