record: rfc-9054
source_version: "RFC 9054 (August 2022), Informational"
source_digest: "75a6bf62b4226baa1e14ccdcc4c603b8a039084ad79677db029e0bbec4525e6f"
source_keyword_count: 2         # bin/bcp14-count .cache/rfc-9054.txt --by-keyword: 1 SHOULD NOT, 1 SHOULD
extracted_keyword_count: 2      # recomputed and checked by bin/validate
reconciliation: >-
  THE COUNTS AGREE AT 2, and this is the smallest BCP 14 budget any record in
  this library has reconciled. A reconciliation is written anyway because 96
  entries against 2 keywords needs explaining, and because TWO KEYWORDS IN A
  498-LINE DOCUMENT THAT CHANGES A REGISTRY'S SEMANTICS is itself the finding.

  WHERE THE TWO ARE, by source line. SHOULD NOT x1: L146 - "A hash function
  that is susceptible to practical collision attacks SHOULD NOT be used for a
  cryptographic purpose." SHOULD x1: L148 - "The discovery of theoretical
  collision attacks against a given hash function SHOULD trigger protocol
  maintainers and users to review the continued suitability of the algorithm if
  alternatives are available and migration is viable." BOTH ARE IN SECTION 2 AND
  BOTH ARE ABOUT COLLISION ATTACKS. There is no MUST, no MUST NOT, no SHALL,
  no MAY, no REQUIRED, no RECOMMENDED and no OPTIONAL anywhere in the document
  outside section 1.1's recital. The document is Informational and reads like it:
  "This document is not an Internet Standards Track specification; it is
  published for informational purposes" (Status of This Memo, L25-L26).

  AND NEITHER OF THE TWO IS DECIDABLE BY AN IMPLEMENTATION. The SHOULD NOT
  turns on the word "practical", which the document never defines and which
  section 5 concedes moves - "the cryptographic strength of hash algorithms will be
  reduced over time" (L413-L414). The SHOULD is doubly conditioned, on
  alternatives being available AND migration being viable, and its actor is
  "protocol maintainers and users" - people, not code. So the extraction has 2
  testable: partial and 0 testable: yes among its stated entries.

  THE REAL NORMATIVE CONTENT IS EIGHT REGISTRY ROWS AND ONE NEW COLUMN VALUE,
  none of it carrying a keyword. What an implementer must obey lives in (i)
  Table 1, Table 2 and Table 3, whose eight data rows fix a name, a value, a
  description, a capabilities array and a Recommended level, reproduced here
  one row per entry; (ii) section 2's and section 4.1's TWO DIFFERENT DEFINITIONS of
  "Filter Only" (R-0035 and R-0086), which are not the same sentence and are
  recorded separately for that reason; (iii) section 2.1's four hash-structure
  fields, which are the nearest thing to a carrier the document offers and are
  declared examples; and (iv) section 4.1's registration actions.

  LOWER-CASE FORCE WORDS, each recorded as kind: inferred with the carrying
  phrase named in `field` rather than silently promoted: section 2's "Applications
  should also make sure that the ability to change hash functions is part of
  the base design" (R-0019 - the document's whole position on agility, and it
  is lower case); section 2's and section 4.1's "the only purpose of a hash function
  should be to filter results"; section 3.1's "the fact that it should no longer be
  used" (about SHA-1); section 3.2's "it must be limited to where the purpose of the
  hash is noncryptographic" (about SHA-256/64 - a lower-case must); section 2.1's
  "it is strongly suggested that either it be a fixed known size, or the lengths
  of the pieces being hashed be included"; and section 5's "Algorithm agility needs to
  be considered a requirement". SIX FORCE-BEARING SENTENCES, ZERO KEYWORDS
  AMONG THEM.

  WHAT WAS DELIBERATELY NOT COUNTED: section 1.1's BCP 14 recital at L115-L119. It
  recites all eleven keywords and constrains nothing; bin/validate recounts
  these texts with boilerplate stripping OFF, so quoting it would add eleven
  phantom keywords and make the extraction read 13 against a source of 2. It
  is quoted in normative.md, which nothing counts.

  NOTHING IS SPLICED. Where two entries share a flowed line range they are
  contiguous character spans of the SAME range, cut by script with an explicit
  start and end marker. Every text was verified mechanically as a contiguous
  substring of the whitespace-normalised source: 96 of 96, zero failures. A
  terminator check found 23 spans that ran into the first words of the next
  sentence and every one was tightened before this file was written; the one
  remaining report is R-0091, which legitimately ends in a question mark
  ("is it the originator that is the attacker or a third party?").

  TEXT NORMALISATION, DECLARED: `text` is the source's own wording with
  whitespace normalised - line breaks and the RFC's double sentence spacing
  become single spaces. Bullet markers and the asterisk emphasis the RFC uses
  around algorithm names are handled by cutting the span after them, not by
  editing them away: R-0057's text begins "SHA-256/64* provides a truncated
  hash" because the source writes "*SHA-256/64*" and the cut starts inside the
  emphasis. THAT TRAILING ASTERISK IS THE SOURCE'S, not this file's.

  PAGE DECORATION: there is none. This rendering of RFC 9054 has ZERO form
  feeds and no running headers or footers in its 498 lines. Checked, not
  assumed.
reviewed_by: ""
note: >-
  Ids are stable and never reused. Cite as rfc-9054#R-NNNN.

  Pass 1 of the FX-1 extraction (extract), effort max, 2026-10-20. Read only
  .cache/rfc-9054.txt - never summary.md and never another record's artifacts.
  Every `text` was cut from the cache by line range by script and never
  retyped.

  `verb: none` marks an entry whose source sentence carries no capitalised BCP
  14 keyword; `field` then names the phrase that carries the force instead.
  `actor` is who must comply, in the document's own vocabulary where it has one
  ("applications", "protocols", "protocol maintainers and users", "IANA") and
  the nearest role otherwise.

  THIS DOCUMENT HAS NO PARTIES AND NO LIFECYCLE, so protocol.yaml and
  state-machine.yaml are both NOT APPLICABLE and say why with counts. Measured
  over all 498 lines: `sender`, `recipient`, `receiver`, `verifier`,
  `exchange`, `handshake`, `negotiate`, `server`, `client` and `retrieve` each
  occur ZERO times; `protocol` occurs ONCE, at L148, in "SHOULD trigger
  protocol maintainers"; `party` occurs ONCE, at L403, in "a third party";
  `verify` occurs ONCE, at L162, in "used to verify that it is the correct
  certificate". `state` occurs ZERO times and the two occurrences of `states`
  are both "United States" (L233, L266).

  IT SHIPS TWO CDDL FRAGMENTS AND CALLS BOTH EXAMPLES. `CDDL` occurs ZERO
  times in the document - the word is never used - and `ABNF`, `JSON Schema`,
  `schema` and `grammar` also occur ZERO times; `ASN.1` occurs once, at L77, in
  the sentence saying COSE has NO equivalent of it. Everything in
  distilled/schema/ is either the verbatim capture of L211-L216 and L224-L227
  or carries `.derived.` in its filename.

  AND IT PRINTS NOT ONE DIGEST VALUE. `Figure`, `Appendix`, `vector` and "test
  vector" occur ZERO times; there is no hex, no base64 and no worked example
  anywhere in the document. Every vector in distilled/examples/ is THIS
  EXTRACTION'S COMPUTATION, marked as such, and the one the document most
  needed - a SHA-256/64 test vector - is the one it could most cheaply have
  printed.

