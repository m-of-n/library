# RFC 9054 PRINTS NOT ONE DIGEST VALUE, FOR ANY OF THE EIGHT ALGORITHMS IT
# REGISTERS - INCLUDING THE ONE IT DEFINES ITSELF.
#
# Measured over all 498 source lines, as whole words: `Figure` 0, `Appendix` 0,
# `vector` 0, "test vector" 0. No hex, no base64, no diagnostic notation. The
# two occurrences of `Example` are a section heading and its table-of-contents
# line. For a document whose whole purpose is to name eight hash functions so
# that two parties can agree on which one, there is nothing to check an
# implementation against - and SHA-256/64 at -15 is DEFINED IN THIS
# SPECIFICATION AND NOWHERE ELSE, by one sentence of a NOTE that does not say
# which 64 bits it keeps.
#
# SO EVERY VECTOR HERE IS `source: computed` OR `source: derived` AND NOTHING
# IS PRESENTED AS PRINTED. Digests come from `hashlib`; CBOR encodings from an
# encoder written for this pass out of RFC 8949 section 3, with no CBOR or COSE
# library; CDDL verdicts from a parser for RFC 8610 Appendix B's grammar
# written for this pass. Every length and octet count is re-derived by the
# generator at write time.
#
# THE FIXED INPUT, used by every digest vector below so the values can be
# compared across algorithms:
#   ASCII     "RFC 9054 hash algorithm fixture"   (31 octets)
#   hex       5246432039303534206861736820616c676f726974686d2066697874757265
# It is this extraction's choice and carries no meaning. It is printed in both
# forms so any value in this file can be recomputed from this file alone.

fixed_input:
  ascii: 'RFC 9054 hash algorithm fixture'
  hex: '5246432039303534206861736820616c676f726974686d2066697874757265'
  octets: 31

vectors:
  - id: V-0001
    name: 'All eight identifiers as CBOR, against §4.1''s own size rationale'
    source: computed
    locator: '§3.1 Table 1, §3.2 Table 2, §3.3 Table 3, §4.1 lines 382-385'
    computed_fields:
      - 'cbor_head'
      - 'octets'
    computed_why: >-
      THE MEASUREMENT section 4.1 INVITES AND DOES NOT MAKE, and it comes
      out against the text. section 4.1 says "Many of the hash values
      produced are relatively long; as such, use of a two-byte algorithm
      identifier seems reasonable", and then "SHA-1 is tagged as "Filter
      Only", so a longer algorithm identifier is appropriate even though it
      is a shorter hash value."

      Against RFC 8949 section 3: a negative integer -1-n with n < 24 fits
      in the initial byte, so -1 to -24 cost ONE octet and -25 and below
      cost two. FIVE OF THE EIGHT IDENTIFIERS (-14 to -18) COST ONE OCTET.
      And SHA-1 at -14 encodes as the single octet 0x2d - the SHORTEST class
      available - while SHA-384 at -43 costs two. The allocation does the
      opposite of what the rationale says it does, for the one algorithm the
      rationale names.

      NO ERRATUM COVERS THIS. An errata search at
      https://errata.rfc-editor.org/search/?rfc_number=9054 on 2026-10-20
      returned exactly one erratum, 7335, and it is about section 2.1's CDDL
      comment markers.
    algorithms:
      - value: -14
        name: SHA-1
        cbor_head: '2d'
        octets: 1
        recommended: 'Filter Only'
      - value: -15
        name: SHA-256/64
        cbor_head: '2e'
        octets: 1
        recommended: 'Filter Only'
      - value: -16
        name: SHA-256
        cbor_head: '2f'
        octets: 1
        recommended: 'Yes'
      - value: -17
        name: SHA-512/256
        cbor_head: '30'
        octets: 1
        recommended: 'Yes'
      - value: -18
        name: SHAKE128
        cbor_head: '31'
        octets: 1
        recommended: 'Yes'
      - value: -43
        name: SHA-384
        cbor_head: '382a'
        octets: 2
        recommended: 'Yes'
      - value: -44
        name: SHA-512
        cbor_head: '382b'
        octets: 2
        recommended: 'Yes'
      - value: -45
        name: SHAKE256
        cbor_head: '382c'
        octets: 2
        recommended: 'Yes'
    expected_result: >-
      One-octet identifiers: [-14, -15, -16, -17, -18] (5 of 8). Two-octet
      identifiers: [-43, -44, -45] (3 of 8). SHA-1 at -14 is one octet;
      SHA-384 at -43 is two. Verified by encoding, not asserted.
    constrains:
      - 'rfc-9054#R-0084'
      - 'rfc-9054#R-0085'
      - 'rfc-9054#R-0054'
      - 'rfc-9054#R-0069'

  - id: V-0002
    name: 'All eight algorithms computed over one fixed input'
    source: computed
    locator: '§3.1-§3.3; the algorithms are FIPS 180-4, FIPS 202 and RFC 3174''s'
    computed_fields:
      - 'digest'
    computed_why: >-
      The eight values the document registers, each computed over the fixed
      input in this file's preamble. THE DOCUMENT PRINTS NONE OF THESE, so
      there is nothing to reproduce and this vector is a reference set
      rather than a reproduction: seven of the eight come from FIPS 180-4,
      FIPS 202 or RFC 3174 via `hashlib`, and are therefore checkable
      against those standards' own vectors. The eighth, -15, is the one that
      cannot be - see V-0003.
    digests:
      - value: -14
        name: SHA-1
        digest_bits: 160
        digest_octets: 20
        digest: '179d318b1fa6265c8b9f6862f9e95aed62631198'
        specified_in: 'RFC 3174'
      - value: -15
        name: SHA-256/64
        digest_bits: 64
        digest_octets: 8
        digest: '4ee97e2c90335c1a'
        specified_in: 'RFC 9054 itself'
      - value: -16
        name: SHA-256
        digest_bits: 256
        digest_octets: 32
        digest: '4ee97e2c90335c1a35384e2e8a8b5d10c3ca6b60a5fc16ba704247d687ff4aaa'
        specified_in: 'FIPS 180-4'
      - value: -17
        name: SHA-512/256
        digest_bits: 256
        digest_octets: 32
        digest: '2f8af45c8937449869856ef0087f3d1a88b354a9f2b534ab8a14c2261a54a358'
        specified_in: 'FIPS 180-4'
      - value: -18
        name: SHAKE128
        digest_bits: 256
        digest_octets: 32
        digest: '72d8da8f4aea121e6b4d1849d40d1ac279cc51f356abc2640d22b4618c715e8a'
        specified_in: 'FIPS 202'
      - value: -43
        name: SHA-384
        digest_bits: 384
        digest_octets: 48
        digest: '98e84727379b61984b28341498bce51d39d66252440b216d4c43dbbfd0885d0094e47525df28a8f5b1b8a514642d1023'
        specified_in: 'FIPS 180-4'
      - value: -44
        name: SHA-512
        digest_bits: 512
        digest_octets: 64
        digest: '941743b8fac523b3bb047f38af4aff8ef64e5a54a9232d1a480ee151c37354c327a3598e8bb31c937ab97fdda640166f667de21f32321b023dd84b0633f5dc63'
        specified_in: 'FIPS 180-4'
      - value: -45
        name: SHAKE256
        digest_bits: 512
        digest_octets: 64
        digest: '38bb6f921b2d352d481b090a2db6aa4ae37a9fc9e77e05b769dfb5c30b6334da0b5114e4842675f0923d70244b9dc63e32c60827ffa0b2e6dbc6dd35c74202af'
        specified_in: 'FIPS 202'
    expected_result: 'eight digests, 8 to 64 octets, all reproducible from `hashlib` except -15'
    constrains:
      - 'rfc-9054#R-0076'
      - 'rfc-9054#R-0080'

  - id: V-0003
    name: 'THE SHA-256/64 AMBIGUITY, MADE TESTABLE: two conforming values'
    source: computed
    locator: '§3.2 lines 277-283 and the NOTE at lines 301-304'
    computed_fields:
      - 'leading'
      - 'trailing'
    computed_why: >-
      THE INTEROPERABILITY HAZARD THIS RECORD MOST NEEDED A VECTOR FOR, and
      the document could have closed it in one line.

      section 3.2's NOTE is the WHOLE of SHA-256/64's definition:
      "SHA-256/64 is a simple truncation of SHA-256 to 64 bits defined in
      this specification." It does not say which 64 bits, and it prints no
      test vector that would pin it. So two implementations can both conform
      and never match.

      THE ANALOGOUS CASE IS STATED ONE DOCUMENT AWAY AND RFC 9054 DOES NOT
      CITE IT. rfc-9053 section 3.1 (.cache/rfc-9053.txt lines 424-425):
      "When truncating, the leftmost tag-length bits are kept and
      transmitted" - about HMAC 256/64, the same truncation of the same hash
      to the same length, in the same registry, by the same working group.

      Both candidates are computed here over the same input so a decision
      can be tested rather than assumed. This library's own profile takes
      the leading reading and cites rfc-9053 section 3.1 for it - which is
      R-O-03 applied: the truncation rule is CITED, because RFC 9054 does
      not supply one.
    sha256_full: '4ee97e2c90335c1a35384e2e8a8b5d10c3ca6b60a5fc16ba704247d687ff4aaa'
    leading_64_bits: '4ee97e2c90335c1a'
    trailing_64_bits: '704247d687ff4aaa'
    differ: true
    both_conforming: true
    cbor_encodings:
      - reading: leading
        cose_hash_find: '822e484ee97e2c90335c1a'
        octets: 11
      - reading: trailing
        cose_hash_find: '822e48704247d687ff4aaa'
        octets: 11
    expected_result: >-
      The two readings differ (4ee97e2c90335c1a vs 704247d687ff4aaa) and the
      document admits both. Each encodes as an 11-octet COSE_Hash_Find or
      COSE_CertHash. A verifier cannot tell which convention the sender
      used, because -15 is the same identifier either way.
    constrains:
      - 'rfc-9054#R-0065'
      - 'rfc-9054#R-0059'
      - 'rfc-9054#R-0060'
      - 'rfc-9054#R-0067'
    cross_record:
      - 'rfc-9360#R-0047'   # rfc-9360 permits -15 in x5t: it excludes no registry value

  - id: V-0004
    name: 'SHA-512/256 is not a truncated SHA-512, demonstrated'
    source: computed
    locator: '§3.2 lines 298-304'
    computed_fields:
      - 'sha512_truncated'
      - 'sha512_256'
    computed_why: >-
      section 3.2's NOTE does one thing well: it separates the two
      truncation-shaped names. "SHA-512/256 is a modified variant of SHA-512
      truncated to 256 bits, as defined in [FIPS-180-4]" - a different
      initial value, not a post-hoc truncation. An implementer who read only
      the registry row ("SHA-2 512-bit Hash truncated to 256-bits", Table 2)
      would get this wrong, and the row and the NOTE are 30 lines apart. The
      two values are computed here so the distinction is testable.
    sha512_full: '941743b8fac523b3bb047f38af4aff8ef64e5a54a9232d1a480ee151c37354c327a3598e8bb31c937ab97fdda640166f667de21f32321b023dd84b0633f5dc63'
    sha512_truncated_to_256: '941743b8fac523b3bb047f38af4aff8ef64e5a54a9232d1a480ee151c37354c3'
    sha512_256_fips_180_4: '2f8af45c8937449869856ef0087f3d1a88b354a9f2b534ab8a14c2261a54a358'
    equal: false
    expected_result: 'the two differ completely; -17 is NOT a truncation of -44'
    constrains:
      - 'rfc-9054#R-0064'
      - 'rfc-9054#R-0065'
      - 'rfc-9054#R-0071'
    note: >-
      A SOURCE DEFECT WORTH NAMING: Table 2's Description column for -17
      reads "SHA-2 512-bit Hash truncated to 256-bits", which is exactly
      what the NOTE says it is not. The table is what gets copied into an
      implementation's lookup table; the NOTE is 30 lines away and in a
      different block. No erratum covers this.

  - id: V-0005
    name: 'The source''s own two structures, as fixtures, with their parse verdicts'
    source: printed
    locator: '§2.1, source lines 211-216 and 224-227'
    reproduced: >-
      THE DOCUMENT'S ONLY TWO EXAMPLES OF ANYTHING, carried as fixtures
      because they are what an implementer would copy. Both are verbatim;
      both verdicts were produced mechanically against RFC 8610 Appendix B's
      grammar, which this library holds verbatim at
      records/ietf/rfc-8610/distilled/schema/cddl.abnf. The full report is
      ../schema/cddl-parse.derived.txt.
    cases:
      - name: COSE_Hash_V
        locator: '§2.1, source lines 211-216'
        printed: |-
             COSE_Hash_V = (
                 1 : int / tstr, # Algorithm identifier
                 2 : bstr, # Hash value
                 ? 3 : tstr, # Location of object that was hashed
                 ? 4 : any   # object containing other details and things
                 )
        parses: true
        parses_as: 'a GROUP rule, not a type rule'
        group_entries_recognised: 24
        group_entries_intended: 4
        undefined_names_acquired: 15
        expected_result: >-
          PARSES, AND THAT CORRECTS THIS RECORD'S OWN SUMMARY, which says "the
          fragment does not parse". `#` is CDDL's TAG operator, not a comment
          marker (erratum 7335, Reported), so each `#` is read as the "any"
          type and each comment word after it as a bare type reference: the
          grammar sees 24 group entries where 4 were written, with 15 distinct
          undefined names (Algorithm, identifier, Hash, value, Location, of,
          object, that, was, hashed, containing, other, details, and, things).
          None begins with "$", so RFC 8610 section 3.9's socket convention
          does not silence them and a name-resolving tool rejects the file AT
          NAME RESOLUTION, not at syntax. With the erratum applied the
          undefined count is zero - but it is still a GROUP, and RFC 8610
          section 2.2.4 says a group cannot be a root.
      - name: COSE_Hash_Find
        locator: '§2.1, source lines 224-227'
        printed: |-
             COSE_Hash_Find = [
                 hashAlg : int / tstr,
                 hashValue : bstr
             ]
        parses: true
        parses_as: 'a TYPE rule'
        group_entries_recognised: 2
        group_entries_intended: 2
        undefined_names_acquired: 0
        expected_result: >-
          PARSES AS INTENDED, as a type rule, because `[ ... ]` is a `type2`.
          Usable as the root of a model. The two structures the same section
          offers are therefore not comparable: one is a working type, the
          other needs an erratum AND a wrapper the document never supplies.
    constrains:
      - 'rfc-9054#R-0043'
      - 'rfc-9054#R-0042'
      - 'rfc-9054#R-0045'
      - 'rfc-9054#R-0044'

  - id: V-0006
    name: 'COSE_Hash_Find and rfc-9360''s COSE_CertHash encode identically'
    source: computed
    locator: '§2.1 lines 224-227; rfc-9360 §2 line 312'
    computed_fields:
      - 'cbor'
    computed_why: >-
      THE CROSS-RECORD RESULT, and it is an equality rather than a
      resemblance.

      RFC 9054 section 2.1: `COSE_Hash_Find = [ hashAlg : int / tstr,
      hashValue : bstr ]`. RFC 9360 section 2: `COSE_CertHash = [ hashAlg:
      (int / tstr), hashValue: bstr ]`. Same member key names, same types,
      same order. The only textual difference is a pair of parentheses
      around `int / tstr`, which changes nothing: CDDL's `/` is the only
      operator in the expression. So THE TWO TYPES ACCEPT EXACTLY THE SAME
      BYTE STRINGS, and the same (algorithm, digest) pair encodes
      identically under both.

      Same working group, same author, two documents six months apart, and
      NEITHER CITES THE OTHER'S STRUCTURE: RFC 9360 cites RFC 9054 zero
      times, and RFC 9054 cites rfc-9360 only as draft-ietf-cose-x509-08 and
      only for the certificate SELECTION scenarios, never for the type. That
      is as close as the COSE registry gets to a settled digest shape, and
      it is settled by coincidence.
    cases:
      - alg: -14
        name: SHA-1
        as_COSE_Hash_Find: '822d54179d318b1f...'
        as_COSE_CertHash: '822d54179d318b1f...'
        identical: true
      - alg: -15
        name: SHA-256/64
        as_COSE_Hash_Find: '822e484ee97e2c90...'
        as_COSE_CertHash: '822e484ee97e2c90...'
        identical: true
      - alg: -16
        name: SHA-256
        as_COSE_Hash_Find: '822f58204ee97e2c...'
        as_COSE_CertHash: '822f58204ee97e2c...'
        identical: true
      - alg: -17
        name: SHA-512/256
        as_COSE_Hash_Find: '823058202f8af45c...'
        as_COSE_CertHash: '823058202f8af45c...'
        identical: true
      - alg: -18
        name: SHAKE128
        as_COSE_Hash_Find: '8231582072d8da8f...'
        as_COSE_CertHash: '8231582072d8da8f...'
        identical: true
      - alg: -43
        name: SHA-384
        as_COSE_Hash_Find: '82382a583098e847...'
        as_COSE_CertHash: '82382a583098e847...'
        identical: true
      - alg: -44
        name: SHA-512
        as_COSE_Hash_Find: '82382b5840941743...'
        as_COSE_CertHash: '82382b5840941743...'
        identical: true
      - alg: -45
        name: SHAKE256
        as_COSE_Hash_Find: '82382c584038bb6f...'
        as_COSE_CertHash: '82382c584038bb6f...'
        identical: true
    expected_result: >-
      Identical for all eight algorithms, verified by encoding both and
      comparing. The consequence for us: a single CBOR codec serves both,
      and a profile that restricts hashAlg restricts both at once.
      ../schema/cose-hash.derived.cddl and
      ../../rfc-9360/distilled/schema/x5-headers.derived.cddl use the same
      mofn-hash-alg set for exactly that reason.
    constrains:
      - 'rfc-9054#R-0045'
    cross_record:
      - 'rfc-9360#R-0070'   # rfc-9360's COSE_CertHash, the type this is identical to

  - id: V-0007
    name: '§2.1''s length rule executed: why a CBOR array is the answer'
    source: computed
    locator: '§2.1 lines 200-206'
    computed_fields:
      - 'digest'
    computed_why: >-
      THE ONE CANONICALIZATION CONSTRAINT IN THE DOCUMENT, demonstrated
      rather than quoted. section 2.1 on the additional-data field: "it is
      strongly suggested that either it be a fixed known size, or the
      lengths of the pieces being hashed be included so that the resulting
      byte string has a unique interpretation as the additional data.
      (Encoding as a CBOR array accomplishes this requirement.)"

      That is `canonical-encoding` condition (1) - INJECTIVITY - argued in a
      parenthetical with no keyword. Here is the collision it prevents: two
      different (additional data, content) pairs whose naive concatenation
      is the same byte string, so the same digest, so a signature over one
      validates the other. Encoding the pair as a CBOR array separates them,
      exactly as the parenthetical says.
    naive_concatenation:
      - aad: 'AB'
        content: 'C'
        concatenated: '414243'
        sha256: 'b5d4045c3f466fa91fe2cc6abe79232a1a57cdf104f7a26e716e0a1e2789df78'
      - aad: 'A'
        content: 'BC'
        concatenated: '414243'
        sha256: 'b5d4045c3f466fa91fe2cc6abe79232a1a57cdf104f7a26e716e0a1e2789df78'
    naive_digests_collide: true
    cbor_array_encoding:
      - aad: 'AB'
        content: 'C'
        cbor: '824241424143'
        sha256: 'df553d5149a7e9dc12286421f4e3974beeb64288b6a10c2d4d748e864c4d5b8e'
      - aad: 'A'
        content: 'BC'
        cbor: '824141424243'
        sha256: 'a47a7a92f18a742dfd832726e36615d495c8a230e577644f23f6565061f53fcb'
    cbor_array_digests_differ: true
    expected_result: >-
      The naive concatenations are the same 3 octets and therefore the same
      digest - a collision with no cryptographic work at all. The CBOR array
      encodings differ in their length heads and the digests differ. section
      2.1's parenthetical is correct and it is the only injectivity argument
      in either document of this lane.
    constrains:
      - 'rfc-9054#R-0041'
      - 'rfc-9054#R-0040'
    note: >-
      WHAT IT MEANS FOR R-O-03. This is a citable canonicalization rule, in
      a document we already cite for the algorithm identifier. It is lower
      case and non-normative, so it is advice rather than a requirement -
      but it is the difference between citing and inventing, and our digest
      structure can cite it by section rather than assert it.

  - id: V-0008
    name: 'Derived census: what the source does not print'
    source: derived
    locator: 'the whole document, all 498 lines'
    computed_why: >-
      A census recorded as a vector so the absences are in the
      machine-readable set. Counted as whole words, case-insensitively, over
      the cached source.
    counts:
      - term: 'Figure'
        occurrences: 0
      - term: 'Appendix'
        occurrences: 0
      - term: 'vector'
        occurrences: 0
      - term: 'test vector'
        occurrences: 0
      - term: 'CDDL'
        occurrences: 0
        note: 'the word is never used, although §2.1 prints two CDDL fragments'
      - term: 'ABNF / JSON Schema / schema / grammar'
        occurrences: 0
      - term: 'ASN.1'
        occurrences: 1
        note: 'line 77, in the sentence saying COSE has no DigestedData equivalent'
      - term: 'tag'
        occurrences: 1
        note: 'line 383, inside the word ''tagged'', about the Recommended column'
      - term: 'kid / thumbprint / key identifier'
        occurrences: 0
      - term: 'canonical / canonicalization / deterministic'
        occurrences: 0
      - term: 'state / lifecycle / transition'
        occurrences: 0
      - term: 'states'
        occurrences: 2
        note: 'both ''United States'' (lines 233, 266)'
      - term: 'protocol'
        occurrences: 1
        note: 'line 148, ''protocol maintainers'''
      - term: 'party'
        occurrences: 1
        note: 'line 403, ''a third party'''
      - term: 'verify'
        occurrences: 1
        note: 'line 162, ''used to verify that it is the correct certificate'''
      - term: 'fingerprint'
        occurrences: 4
        note: 'lines 20, 161, 162, 165'
      - term: 'collision'
        occurrences: 15
        note: 'and ZERO in rfc-9360, whose central mechanism is a digest comparison'
      - term: 'Filter Only'
        occurrences: 6
        note: 'lines 175, 249, 258, 311, 384, 387'
      - term: '9360 / RFC 9360'
        occurrences: 0
        note: 'cited only as draft-ietf-cose-x509-08'
    expected_result: >-
      The sharpest pair: `collision` occurs 15 times here and ZERO times in
      rfc-9360, which is the document that makes a digest comparison the
      integrity binding. And `CDDL` occurs zero times in a document that
      prints two CDDL fragments and cites RFC 8610 in neither its normative
      nor its informative references.

coverage: >-
  Eight vectors: one printed (section 2.1's two structures, the
  document's only examples of anything), six computed and one derived
  census. 18 of ../requirements.yaml's 96 requirement ids are wired.
  Three results are the ones to carry forward: V-0003 computes both
  readings of SHA-256/64 and shows the document admits both; V-0006
  shows COSE_Hash_Find and rfc-9360's COSE_CertHash encode identically
  for all eight algorithms; and V-0007 executes section 2.1's length
  rule and exhibits the zero-work collision it prevents. Two
  cross-record ids are cited, both spelled in full and selected from
  rfc-9360's own id table.
provenance: >-
  Digests from `hashlib` (SHA-1, SHA-256, SHA-384, SHA-512, SHA-512/256,
  SHAKE128, SHAKE256). CBOR encodings from an encoder written for this
  pass out of RFC 8949 section 3; no CBOR or COSE library was used. CDDL
  verdicts from a recursive-descent parser for RFC 8610 Appendix B's
  grammar written for this pass and gated first on RFC 8610's own
  prelude and on three deliberate negatives. Every length and octet
  count was re-derived at write time. No value in this file is presented
  as printed by RFC 9054 except the two section 2.1 fragments in V-0005,
  which are cut from the cache by line range.
