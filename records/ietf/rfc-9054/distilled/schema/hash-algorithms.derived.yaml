# =====================================================================
# hash-algorithms.derived.yaml
#
# DERIVED -- NOT verbatim. The `value`, `name`, `digest_bits`,
# `recommended` and `specified_in` columns are RFC 9054's Tables 1-3 and
# section 3.1-section 3.3 prose, cited per row. THE `cbor_head` AND
# `cbor_head_octets` COLUMNS ARE COMPUTED by this pass from RFC 8949
# section 3, and every `note` is this library's.
#
# WHY IT EXISTS. RFC 9054's whole normative content is eight registry
# rows spread over three tables in three subsections, each table with a
# different column layout and none of them machine-readable. This is
# that content as data, plus the one measurement the document invites
# and does not make.
#
# THE MEASUREMENT. section 4.1 says "Many of the hash values produced are
# relatively long; as such, use of a two-byte algorithm identifier seems
# reasonable" (rfc-9054#R-0084) and "SHA-1 is tagged as "Filter Only", so a
# longer algorithm identifier is appropriate even though it is a shorter
# hash value" (rfc-9054#R-0085). Against RFC 8949 section 3 neither holds:
# FIVE OF THE EIGHT IDENTIFIERS ENCODE IN ONE OCTET, NOT TWO (-14 to
# -18 are 0x2d to 0x31), and SHA-1 at -14 is in the SHORTEST class
# available while SHA-384 at -43 takes two octets (0x382a). The
# allocation does the opposite of what the rationale says it does. No
# erratum covers this; the only erratum on RFC 9054 is 7335, on
# section 2.1's comment markers.
#
# AND "FILTER ONLY" IS DEFINED TWICE, NOT ONCE. section 2 (rfc-9054#R-0034): the
# "only purpose of a hash function should be to filter results; it is
# not intended for applications that require a cryptographically strong
# algorithm". section 4.1 (rfc-9054#R-0087): "not to be used for purposes that
# require collision resistance". The first is about strength and is
# lower-case advice; the second is about one specific property. They are
# not the same constraint, and the second is the one the conflict with
# rfc-9360 turns on.
# =====================================================================
record: rfc-9054
kind: schema-data
reviewed_by: ""
derived: true
registry: "COSE Algorithms (https://www.iana.org/assignments/cose/)"
registry_action: "IANA has registered all eight; section 4.1"
recommended_column_values_added: '"Filter Only"'
algorithms:
  - value: -14
    name: SHA-1
    digest_bits: 160
    recommended: 'Filter Only'
    cose_capabilities: '[]'
    specified_in: 'RFC 3174'
    locator: '§3.1'
    registry_row: 'rfc-9054#R-0054'
    cbor_head: '2d'
    cbor_head_octets: 1
    note: >-
      Registered only because "there are still times where SHA-1 needs to
      be used": unreplaceable HSMs, and filtering.
  - value: -15
    name: SHA-256/64
    digest_bits: 64
    recommended: 'Filter Only'
    cose_capabilities: '[]'
    specified_in: 'RFC 9054 itself'
    locator: '§3.2'
    registry_row: 'rfc-9054#R-0067'
    cbor_head: '2e'
    cbor_head_octets: 1
    note: >-
      A truncation "defined in this specification" and nowhere else. THE
      DOCUMENT DOES NOT SAY WHICH 64 BITS and prints no test vector; both
      candidate ends are computed in ../examples/vectors.yaml and they
      differ.
  - value: -16
    name: SHA-256
    digest_bits: 256
    recommended: 'Yes'
    cose_capabilities: '[]'
    specified_in: 'FIPS 180-4'
    locator: '§3.2'
    registry_row: 'rfc-9054#R-0068'
    cbor_head: '2f'
    cbor_head_octets: 1
    note: >-
      The value rfc-9360 §2 makes mandatory to support, and the one R-O-03
      cites.
  - value: -17
    name: SHA-512/256
    digest_bits: 256
    recommended: 'Yes'
    cose_capabilities: '[]'
    specified_in: 'FIPS 180-4'
    locator: '§3.2'
    registry_row: 'rfc-9054#R-0071'
    cbor_head: '30'
    cbor_head_octets: 1
    note: >-
      A modified SHA-512 with a different IV, NOT a truncation of SHA-512;
      measured in ../examples/vectors.yaml.
  - value: -18
    name: SHAKE128
    digest_bits: 256
    recommended: 'Yes'
    cose_capabilities: '[]'
    specified_in: 'FIPS 202'
    locator: '§3.3'
    registry_row: 'rfc-9054#R-0078'
    cbor_head: '31'
    cbor_head_octets: 1
    note: >-
      An XOF pinned to a fixed 256-bit output by this document.
  - value: -43
    name: SHA-384
    digest_bits: 384
    recommended: 'Yes'
    cose_capabilities: '[]'
    specified_in: 'FIPS 180-4'
    locator: '§3.2'
    registry_row: 'rfc-9054#R-0069'
    cbor_head: '382a'
    cbor_head_octets: 2
  - value: -44
    name: SHA-512
    digest_bits: 512
    recommended: 'Yes'
    cose_capabilities: '[]'
    specified_in: 'FIPS 180-4'
    locator: '§3.2'
    registry_row: 'rfc-9054#R-0070'
    cbor_head: '382b'
    cbor_head_octets: 2
  - value: -45
    name: SHAKE256
    digest_bits: 512
    recommended: 'Yes'
    cose_capabilities: '[]'
    specified_in: 'FIPS 202'
    locator: '§3.3'
    registry_row: 'rfc-9054#R-0079'
    cbor_head: '382c'
    cbor_head_octets: 2
    note: >-
      An XOF pinned to a fixed 512-bit output by this document.

cbor_cost_summary:
  one_octet_identifiers:
    - -14
    - -15
    - -16
    - -17
    - -18
  two_octet_identifiers:
    - -43
    - -44
    - -45
  note: >-
    Computed, not read. RFC 8949 section 3: a negative integer -1-n with n < 24
    is one octet (major type 1 in the initial byte); -25 and below need a
    one-octet argument, so two octets in all. section 4.1's rationale is
    therefore true of three of the eight allocations and false of five,
    and it is exactly backwards for the one algorithm it names.
truncation_hazard:
  value: -15
  statement: >-
    section 3.2's NOTE - "SHA-256/64 is a simple truncation of SHA-256 to 64
    bits defined in this specification" - is the whole of the definition.
    It does not say whether the 64 bits are the leading or the trailing
    ones, and the document prints no test vector for any of its eight
    algorithms. Two interoperable implementations can therefore disagree
    on -15 while both conforming. ../examples/vectors.yaml carries both
    candidate values over one fixed input so the ambiguity is testable
    rather than described.
coverage: >-
  Eight rows: every value RFC 9054 registers, which is every value in
  its three tables. Nothing is omitted. The non-hash identifiers in the
  same registry belong to rfc-9053 and are not this document's.
