source_digest: "75a6bf62b4226baa1e14ccdcc4c603b8a039084ad79677db029e0bbec4525e6f"
source_lines_total: 498
applicability: "NOT APPLICABLE"
note: >-
  RFC 9054 DEFINES NO PROTOCOL, and the verdict is measured rather than
  asserted. It registers eight algorithm identifiers and one registry
  column value, it describes two paradigms in which hashes get used, and
  it hands every structure and every exchange to the application.

  WORD COUNTS OVER ALL 498 LINES, as whole words, case-insensitively, with
  the lines where each occurs. ZERO: `sender`, `recipient`, `receiver`,
  `verifier`, `exchange`, `handshake`, `negotiate`, `negotiation`,
  `response`, `server`, `client`, `retrieve`, `GET`, `intermediary`,
  "relying party". ONE each, and none of them a role in a flow: `protocol`
  at line 148, inside "SHOULD trigger protocol maintainers and users to
  review"; `party` at line 403, inside "is it the originator that is the
  attacker or a third party?"; `verify` at line 162, inside "If the
  fingerprint is used to verify that it is the correct certificate";
  `request` at line 6, in the RFC masthead ("Request for Comments: 9054").

  THE TWO PARADIGMS ARE DESCRIBED, NOT SPECIFIED. section 1 describes
  indirect signing - "the content is not directly signed, but instead a
  hash of the content is computed, and that hash value -- along with an
  identifier for the hash algorithm -- is included in the content that
  will be signed" (rfc-9054#R-0008) - and goes on to describe a validation
  sequence (rfc-9054#R-0010): validate the signature over the hash values
  and pointers, download the associated parts, recompute, and compare.
  THAT IS THE CLOSEST THING TO A FLOW IN THE DOCUMENT, and it names no
  parties, no messages, no media types, no ordering obligation and no
  error path. It is an explanation of why the identifiers are useful. The
  one worked instance it points at is section 5.4 of an Internet-Draft
  (rfc-9054#R-0012).

  AND THE DOCUMENT SAYS IN TERMS THAT THE STRUCTURE WHICH WOULD CARRY SUCH
  A FLOW DOES NOT EXIST (rfc-9054#R-0002): COSE "does not define a
  structure syntax that is used to encode a digested object structure
  along the lines of the DigestedData ASN.1 structure in [CMS]", and "This
  omission was intentional". A document with no structure, no parties and
  no messages has no protocol to model.

  WHAT SECTION 2'S FILTERING ARGUMENT IS, since it is the other candidate.
  It is a PROCEDURE AT ONE PARTY and it is two sentences long
  (rfc-9054#R-0032, rfc-9054#R-0031): sort a collection of certificates by
  fingerprint to find candidates, then "one still needs to confirm that
  the public key validates the signature (and that the certificate is
  trusted), and all certificates that don't contain a key that validates
  the signature can be discarded as false positives". No counterparty, no
  message, no ordering beyond "then". That procedure is carried in
  ../design-notes.md, where it does work, because it is the precondition
  rfc-9360 section 2's protected `x5t` configuration does not satisfy.

  THE PROTOCOL OBLIGATIONS IT DOES STATE ARE ABOUT PROTOCOLS IT DOES NOT
  DEFINE. section 5: "Protocols need to perform a careful analysis of the
  properties of a hash function that are needed" (rfc-9054#R-0089) and
  "Algorithm agility needs to be considered a requirement for any use of
  hash functions" (rfc-9054#R-0095). Both are addressed to other
  documents' protocols. The document defines no negotiation, no
  deprecation mechanism and no way for an endpoint to express which hash
  functions it accepts - which is the gap rfc-9360 section 2's "MUST
  support SHA-256" partially fills from the other side, in the other
  document.

  CONTRAST rfc-9360, WHICH IS APPLICABLE. The same working group's X.509
  document has four parties, an HTTP/CoAP GET with a transport-security
  SHOULD, an active intermediary and a two-check join. The two records in
  this lane split on this verdict, and the split is real rather than a
  difference in how hard each was looked at: see
  records/ietf/rfc-9360/distilled/protocol.yaml.

roles: []
flows: []
error_paths: []

absent:
  - 'No counterparties: `sender`, `recipient`, `receiver` and `verifier` each occur ZERO times.'
  - 'No messages, no framing, no media type and no ordering between parties.'
  - 'No structure to carry a digest at all - section 1 says so and calls the omission intentional.'
  - 'No negotiation, no versioning, no deprecation mechanism and no way to advertise which hash functions an endpoint accepts, although section 5 says agility "needs to be considered a requirement".'
  - 'No error path: nothing in the document says what to do when a comparison fails.'
  - 'No retrieval step, although section 1''s indirect-signing paradigm has a download in it; `retrieve` and `GET` occur ZERO times.'
  - 'The one occurrence of `protocol` is "protocol maintainers", and the one occurrence of `party` is "a third party" in an attacker-model sentence.'

where_the_protocol_lives: >-
  For the signing envelope: records/ietf/rfc-9052 (COSE structures and
  process). For the one position in COSE where these identifiers are
  actually consumed: records/ietf/rfc-9360 section 2's `x5t`, whose
  protocol model is applicable and is written out. For the digest
  carrier R-M-07 needs: nowhere - it is ours to design, which is this
  record's whole finding.
