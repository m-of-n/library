applicability: "NOT APPLICABLE"
note: >-
  RFC 9054 DEFINES NO LIFECYCLE AND NO STATE MACHINE, and the verdict is
  measured.

  WORD COUNTS OVER ALL 498 LINES, as whole words, case-insensitively:
  `state` 0, `lifecycle` 0, `transition` 0, `revoke` 0, `revocation` 0,
  `rotate` 0, `rotation` 0, `expire` 0, `expiry` 0, `expiration` 0,
  `issue` 0, `issuance` 0, `enroll` 0, `step` 0, `steps` 0, `order` 0. AND
  THE TWO OCCURRENCES OF `states` ARE BOTH "United States" - line 233
  ("designed by the United States National Security Agency", about SHA-1)
  and line 266 (the same phrase about SHA-2). That is the whole of the
  state vocabulary in this document.

  AN ALGORITHM IDENTIFIER IS NOT A STATEFUL THING. What RFC 9054 produces
  is eight integers and one registry column value. An integer has no
  lifecycle; it is allocated once by IANA and never changes. The document
  registers them and stops.

  THE ONE THING THAT LOOKS LIKE A LIFECYCLE IS A LIFECYCLE OF THE
  REGISTRY, AND THE DOCUMENT DECLINES TO MODEL IT. section 2 says a hash
  function susceptible to practical collision attacks SHOULD NOT be used
  for a cryptographic purpose (rfc-9054#R-0024), and that the discovery of
  THEORETICAL collision attacks SHOULD trigger "protocol maintainers and
  users to review the continued suitability of the algorithm if
  alternatives are available and migration is viable" (rfc-9054#R-0025).
  section 5 adds that "the cryptographic strength of hash algorithms will
  be reduced over time" (rfc-9054#R-0096) and that agility "needs to be
  considered a requirement" (rfc-9054#R-0095). SO THERE IS A PROGRESSION
  IN VIEW - sound, theoretically attacked, practically attacked, Filter
  Only, unusable - AND NOT ONE OF ITS STEPS IS DEFINED. The actor is
  people, not code; the trigger ("practical") is undefined; the transition
  is a REVIEW rather than a change of state; and there is no mechanism by
  which the registry's Recommended column is ever revised. SHA-1 is the
  worked case and it is instructive: the document records that "The IETF
  formally started discouraging the use of SHA-1 in [RFC6194]"
  (rfc-9054#R-0048) in 2011, and in 2022 registers it anyway, with a
  lower-case "it should no longer be used" and an escape hatch for an HSM
  "that cannot be replaced" (rfc-9054#R-0026).

  A STATE MACHINE OVER THAT WOULD BE OURS ENTIRELY: every state name,
  every trigger and every guard would be invented here, with no sentence
  of the document behind any transition. That is the line this library
  does not cross, and it is the difference from rfc-9360, where the same
  pass DID write two machines because two normative sentences there are
  propositions about a system changing over time. See
  records/ietf/rfc-9360/distilled/state-machine.yaml, whose `note`
  separates what it measured from what it modelled.

  WHERE A LIFECYCLE WOULD HAVE TO COME FROM, if we need one: BCP 201 (RFC
  7696), which both section 2 and section 5 cite for exactly this and
  which this library does not hold. The deprecation policy for a hash we
  have cited is ours to write, and R-O-03 makes that explicit rather than
  optional.

machines: []

absent:
  - 'No state vocabulary: `state`, `lifecycle` and `transition` each occur ZERO times, and both occurrences of `states` are "United States".'
  - 'No lifecycle for an algorithm identifier: allocated once by IANA, never revised by this document.'
  - 'No mechanism for revising the Recommended column, although this document adds a value to it.'
  - 'No deprecation procedure, no sunset date and no migration step, although section 5 says strength "will be reduced over time".'
  - 'No definition of "practical" in section 2''s SHOULD NOT, so the one transition the document gestures at has an undecidable guard.'
  - 'No states for a digest: `expire`, `expiry` and `expiration` each ZERO. A digest in this document has no freshness.'
  - 'No actor that is code: section 2''s review obligation falls on "protocol maintainers and users".'

what_this_means_for_us: >-
  R-O-03 requires that a canonicalization or digest algorithm be cited
  rather than invented silently. Citing -16 satisfies that today.
  NOTHING IN RFC 9054 TELLS US WHAT TO DO WHEN -16 WEAKENS: there is no
  deprecation state, no mechanism, and no actor but "protocol
  maintainers and users". The agility policy for a hash we have cited is
  therefore ours to write, in full, and this NOT APPLICABLE verdict is
  the evidence that there is nothing to inherit.
