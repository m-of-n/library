source_keyword_count: 2        # bin/bcp14-count .cache/rfc-8610.txt
extracted_keyword_count: 2     # recomputed and checked by bin/validate
reconciliation: 'RFC 8610 contains exactly TWO all-capitals BCP 14 keyword occurrences in 125 KB, and bin/bcp14-count reports 2. That is not a measurement error and not a thin document: CDDL''s normativity is carried by its GRAMMAR AND ITS MATCHING RULES, not by obligations laid on an actor. A type system says what a construct means and what an instance must look like to match; it has almost no occasion to say that somebody MUST do something. The document says as much structurally - six of its eight appendices open with "This appendix is normative." (A, B, C, D, E, G), and Appendix C, which is nothing but matching rules, is one of them. What was counted instead, and extracted here as kind: inferred: (a) every type- and group-MATCHING rule (§2.1, §2.1.2, §2.2.2, Appendix A, Appendix C); (b) every OCCURRENCE semantic, including the 1*1 default and the reduction of occurrence to a group choice; (c) every CONTROL-OPERATOR definition, including the .eq/.ne equality case analysis of §3.8.6, which is the only value-equality definition CDDL gives; (d) the SOCKET/PLUG mechanism of §3.9 and the prelude''s fixity in Appendix D; (e) every explicit DISCLAIMER of capability - §2.2.3, §3.2, §3.8.1 and Appendix E - because what CDDL declines to constrain is as load-bearing for us as what it does; and (f) the lower-case force-words the document does use: ''must'' (§2.2.4, §3.1, §3.8.2, §3.9, §4.2, §6.1), ''needs to'' (§3.8.3, §5), ''ought not'' (§5), ''urged'' (§3.5.3), ''strongly encouraged'' (§5), ''necessary'' (§3.5.1). Each inferred entry names in its `field` the phrase or matching rule that carries the force and states that no BCP 14 keyword backs it; no obligation was invented and no count was inflated. THE TWO COUNTED KEYWORDS, both carried, so source and extraction agree at 2: rfc-8610#R-0070 is the SHOULD of §3.8.3.1 - the only all-capitals keyword RFC 8610 asserts in its own voice, and it binds the author of a downstream specification, not a CDDL tool. rfc-8610#R-0139 is a MUST NOT inside Appendix H, which the appendix''s own opening sentence declares "for information only"; it is RFC 8610 QUOTING RFC 7071 in order to call that sentence ambiguous. It is recorded for count fidelity and is marked, in `field` and in `note`, as not an RFC 8610 requirement. Strip it and the extraction would carry 1 against a source count of 2, which would need explaining in the other direction. The §1.1 BCP 14 boilerplate is deliberately NOT quoted in any entry: bin/validate counts requirement texts with boilerplate stripping OFF, so quoting it would add 11 phantom keywords.'
reviewed_by: ""
note: |
  Ids are stable and never reused. Cite as rfc-8610#R-NNNN.
  Entries are in source order by section, then by position within the section;
  ids run from R-0001 with no gaps.
  KIND. `stated` means an all-capitals BCP 14 keyword backs the entry; there are
  two, rfc-8610#R-0070 and rfc-8610#R-0139. `inferred` means no BCP 14 keyword backs it - the force is
  a matching rule, a definition, a stated consequence, an explicit absence, or a
  lower-case force-word - and every inferred entry names that carrier in `field`.
  `inferred` here does NOT mean the text is paraphrased: every `text` in this file is
  a single contiguous verbatim span of RFC 8610. This follows the convention of
  records/ietf/rfc-9942/distilled/requirements.yaml, not that of rfc-8785, where
  `inferred` marked non-verbatim text.
  VERB. Upper case only for the two stated entries. Lower case reproduces the
  source's own force-word ('must', 'needs to', 'ought not', 'urged', 'necessary',
  'strongly encouraged'); `none` means the sentence carries no force-word at all and
  its normativity is definitional.
  CONTIGUITY. Asserted after removing the running page decoration
  (`Birkholz, et al. ... [Page n]`, `RFC 8610 CDDL June 2019`, form feeds) and
  collapsing runs of whitespace; no interior word, clause or punctuation mark of any
  span was altered, dropped or reordered, and no span is spliced from two
  non-adjacent parts of the document. Several entries quote two adjacent sentences,
  and rfc-8610#R-0022 runs a short CDDL display line (`min..max`) through the middle of one
  sentence; in every such case the source's own sentence runs through it too, so the
  span is contiguous in the document and not assembled here.
  ACTOR. CDDL has no protocol roles, so `actor` names the party a constraint falls
  on in practice: `validator` for a matching rule, `tool implementer` for a lexical or
  grammar rule, `CDDL specification author` for a drafting rule, `IANA / registrant`
  for §6.1, `EDN tool implementer` for Appendix G.

requirements:
  - id: "rfc-8610#R-0001"
    object: 'a new term in the running text of this document'
    field: 'no BCP 14 keyword backs this; the force is the rendering convention stated as fact — "New terms are introduced in _cursive_"'
    verb: none
    actor: 'reader of this specification'
    locator: "§1.2"
    text: 'New terms are introduced in _cursive_, which is rendered in plain text as the new term surrounded by underscores.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a typographic convention of the document, not a property of a CDDL specification or of an instance'
    status: active
  - id: "rfc-8610#R-0002"
    object: 'CDDL text appearing in the running text of this document'
    field: 'no BCP 14 keyword backs this; the force is the rendering convention stated as fact — CDDL text "is in “typewriter”", rendered as double quotes'
    verb: none
    actor: 'reader of this specification'
    locator: "§1.2"
    text: 'CDDL text in the running text is in "typewriter", which is rendered in plain text as the CDDL text in double quotes (double quotes are also used in the usual English sense; the reader is expected to disambiguate this by context).'
    kind: inferred
    testable: 'no'
    testable_reason: 'a typographic convention of the document; the document itself says the reader disambiguates by context, so there is no mechanical criterion'
    status: active
  - id: "rfc-8610#R-0003"
    object: 'the term "byte" wherever this document uses it'
    field: 'no BCP 14 keyword backs this; the force is a definitional equivalence stated as fact — "is used in its now-customary sense as a synonym for “octet”"'
    verb: none
    actor: 'implementer of a control operator that counts bytes'
    locator: "§1.2"
    text: 'In this specification, the term "byte" is used in its now-customary sense as a synonym for "octet".'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Load-bearing for .size (§3.8.1), which counts bytes in a string, and for .bits (§3.8.2), whose bit numbering indexes bytes.'
  - id: "rfc-8610#R-0004"
    object: 'composition of data structures in CDDL'
    field: 'no BCP 14 keyword backs this; the force is an exclusive existence claim stated as fact — "there is only one kind of composition in CDDL"'
    verb: none
    actor: 'CDDL specification author / tool implementer'
    locator: "§2"
    text: 'Instead of defining all four types of composition in CDDL separately, or even defining one kind for arrays (vectors and records) and one kind for maps (tables and structs), there is only one kind of composition in CDDL: the _group_ (Section 2.1).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0005"
    object: 'a complete CDDL specification'
    field: 'no BCP 14 keyword backs this; the force is a definition of what a specification denotes — "defines a type (the one defined by its first _rule_), which formally is the set of CBOR data items that are acceptable"'
    verb: none
    actor: 'validator'
    locator: "§2"
    text: 'The entire CDDL specification defines a type (the one defined by its first _rule_), which formally is the set of CBOR data items that are acceptable as "instances" for this specification.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0006"
    object: 'a value expressible as a CBOR data item'
    field: 'no BCP 14 keyword backs this; the force is a definitional identity stated as fact — "is also a type in its own right"'
    verb: none
    actor: 'validator'
    locator: "§2"
    text: 'Each value that can be expressed as a CBOR data item is also a type in its own right, e.g., "1".'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0007"
    object: 'a group entry used in an array context versus a map context'
    field: 'no BCP 14 keyword backs this; the force is the definition of the two contexts — "only the value … is represented; the name is annotation only" and "the names become the map keys"'
    verb: none
    actor: 'validator'
    locator: "§2.1"
    text: 'In an array context, only the value of the name/value pair is represented; the name is annotation only (and can be left off from the group specification if not needed). In a map context, the names become the map keys ("member keys").'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0008"
    object: 'the order of entries within a group, in an array context'
    field: 'no BCP 14 keyword backs this; the force is a significance claim stated as fact — "the actual sequence of elements in the group is important"'
    verb: none
    actor: 'validator'
    locator: "§2.1"
    text: 'In an array context, the actual sequence of elements in the group is important, as that sequence is the information that allows associating actual array elements with entries in the group.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0009"
    object: 'the order of entries within a group, in a map context'
    field: 'no BCP 14 keyword backs this; the force is a non-significance claim stated as fact — "the sequence of entries in a group is not relevant"'
    verb: none
    actor: 'validator'
    locator: "§2.1"
    text: 'In a map context, the sequence of entries in a group is not relevant (but there is still a need to write down group entries in a sequence).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0010"
    object: 'a CBOR array matched against a group'
    field: 'no BCP 14 keyword backs this; the force is the array-matching rule itself — "An array matches a specification given as a group when …"'
    verb: none
    actor: 'validator'
    locator: "§2.1"
    text: 'An array matches a specification given as a group when the group matches a sequence of name/value pairs the value parts of which exactly match the elements of the array in order.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0011"
    object: 'a CBOR map matched against a group'
    field: 'no BCP 14 keyword backs this; the force is the map-matching rule itself, including its exhaustiveness clause — "the map has no name/value pair that is not covered by the group"'
    verb: none
    actor: 'validator'
    locator: "§2.1"
    text: 'A map matches a specification given as a group when the group matches a sequence of name/value pairs such that all of these name/value pairs are present in the map and the map has no name/value pair that is not covered by the group.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0012"
    object: 'a group with respect to the brackets that enclose it'
    field: 'no BCP 14 keyword backs this; the force is a neutrality claim stated as fact — "the groups themselves are neutral as to whether they will be used in a map or an array"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§2.1"
    text: 'Note that the (curly) braces signify the creation of a map; the groups themselves are neutral as to whether they will be used in a map or an array.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0013"
    object: 'the comma separating group entries'
    field: 'no BCP 14 keyword backs this; the force is a permission stated as fact plus a style preference — "actually optional (not just in the final entry)" / "considered good style"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§2.1.2"
    text: 'The comma is actually optional (not just in the final entry), but it is considered good style to set it.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0014"
    object: 'a basic group entry'
    field: 'no BCP 14 keyword backs this; the force is the entry-matching rule — "this entry matches any name/value pair the name of which is in the keytype and the value of which is in the valuetype"'
    verb: none
    actor: 'validator'
    locator: "§2.1.2"
    text: 'A basic entry consists of a _keytype_ and a _valuetype_, both of which are types (Section 2.2); this entry matches any name/value pair the name of which is in the keytype and the value of which is in the valuetype.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0015"
    object: 'a group written as a sequence of group entries'
    field: 'no BCP 14 keyword backs this; the force is the group-matching rule — "matches any sequence of name/value pairs that is composed by concatenation in order of what the entries match"'
    verb: none
    actor: 'validator'
    locator: "§2.1.2"
    text: 'A group defined as a sequence of group entries matches any sequence of name/value pairs that is composed by concatenation in order of what the entries match.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0016"
    object: 'a numeric literal used as a type'
    field: 'no BCP 14 keyword backs this; the force is a disjointness claim stated as fact — "the type “1” does not include any floating-point numbers"'
    verb: none
    actor: 'validator'
    locator: "§2.2.1"
    text: 'The value notation for numbers inherits from C the distinction between integer values (no fractional part or exponent given -- NR1 [ISO6093]; "NR" stands for "numerical representation") and floating-point values (where a fractional part, an exponent, or both are present -- NR2 or NR3), so the type "1" does not include any floating-point numbers while the types "1e3" and "1.5" are both floating-point numbers and do not include any integer numbers.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0017"
    object: 'a group choice'
    field: 'no BCP 14 keyword backs this; the force is the group-choice matching rule — "matches the union of the sets of name/value pair sequences that the alternatives in the choice can"'
    verb: none
    actor: 'validator'
    locator: "§2.2.2"
    text: 'A group choice matches the union of the sets of name/value pair sequences that the alternatives in the choice can.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0018"
    object: 'a rule name first used with "/=" or "//="'
    field: 'no BCP 14 keyword backs this; the force is an explicit non-error statement — "It is not an error if a name is first used with a “/=” or “//=”"'
    verb: none
    actor: 'tool implementer'
    locator: "§2.2.2"
    text: 'It is not an error if a name is first used with a "/=" or "//=" (there is no need to "create it" with "=").'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0019"
    object: 'a range expression'
    field: 'no BCP 14 keyword backs this; the force is the definition of the two range operators — ".." includes both bounds, "..." excludes the upper'
    verb: none
    actor: 'validator'
    locator: "§2.2.2.1"
    text: 'A range can be inclusive of both bounds given (denoted by joining two values by ".."), or it can include the lower bound and exclude the upper bound (denoted by instead using "...").'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0020"
    object: 'a range whose lower bound exceeds its upper bound'
    field: 'no BCP 14 keyword backs this; the force is a stated consequence — "the resulting type is the empty set"'
    verb: none
    actor: 'validator'
    locator: "§2.2.2.1"
    text: 'If the lower bound exceeds the upper bound, the resulting type is the empty set (this behavior can be desirable when generics (Section 3.10) are being used).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0021"
    object: 'the operand types of a range operator'
    field: 'no BCP 14 keyword backs this; the force is a restriction stated as fact — "CDDL currently only allows ranges between integers … or between floating-point values"; the document marks the mixed forms "NOT DEFINED"'
    verb: none
    actor: 'CDDL specification author / tool implementer'
    locator: "§2.2.2.1"
    text: 'CDDL currently only allows ranges between integers (matching integer values) or between floating-point values (matching floating-point values).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0022"
    object: 'a name used as the left-hand side of a range operator'
    field: 'no BCP 14 keyword backs this; the force is a lexical fact plus an imperative with no BCP 14 keyword — "the dot is a valid name continuation character" / "use spacing as in"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§2.2.2.1"
    text: 'Note that the dot is a valid name continuation character in CDDL, so min..max is not a range expression but a single name.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0023"
    object: 'member names inside a group turned into a choice with "&"'
    field: 'no BCP 14 keyword backs this; the force is a stated limitation of meaning — "the member names have only documentary value"'
    verb: none
    actor: 'validator / tool implementer'
    locator: "§2.2.2.2"
    text: 'As with the use of groups in arrays (Section 3.4), the member names have only documentary value (in particular, they might be used by a tool when displaying integers that are taken from that choice).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0024"
    object: 'a representation type written as "#" major.ai'
    field: 'no BCP 14 keyword backs this; the force is the definition of the notation — "a hash mark (“#”) optionally followed by a number from 0 to 7 identifying the major type"'
    verb: none
    actor: 'validator'
    locator: "§2.2.3"
    text: 'How this is used should be evident from the prelude (Appendix D): a hash mark ("#") optionally followed by a number from 0 to 7 identifying the major type, which then can be followed by a dot and a number specifying the additional information.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0025"
    object: 'the set of values a representation type denotes'
    field: 'no BCP 14 keyword backs this; the force is a definitional scoping statement — "specifies the set of values that can be serialized in CBOR"'
    verb: none
    actor: 'validator'
    locator: "§2.2.3"
    text: 'This construction specifies the set of values that can be serialized in CBOR (i.e., "any"), by the given major type if one is given, or by the given major type with the additional information if both are given.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0026"
    object: 'the relationship between a CDDL type and the bytes an instance is serialized to'
    field: 'no BCP 14 keyword backs this; the force is an explicit disclaimer of capability — "it does not mandate" and "CDDL does not provide any language means to restrict the choice of serialization variants"'
    verb: none
    actor: 'CDDL specification author / verifier relying on a CDDL schema'
    locator: "§2.2.3"
    text: 'Note that although this notation is based on the CBOR serialization, it is about a set of values at the data model level, e.g., "#7.25" specifies the set of values that can be represented as half-precision floats; it does not mandate that these values also do have to be serialized as half-precision floats: CDDL does not provide any language means to restrict the choice of serialization variants.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The single most consequential sentence in RFC 8610 for a canonical-encoding decision: a CDDL schema cannot make an encoding deterministic. See design-notes section 2.'
  - id: "rfc-8610#R-0027"
    object: 'the root of a CDDL data structure definition'
    field: 'no BCP 14 keyword backs this; the force is a definition by designation — "that role is simply taken by the first rule defined in the file"'
    verb: none
    actor: 'validator'
    locator: "§2.2.4"
    text: 'There is no special syntax to identify the root of a CDDL data structure definition: that role is simply taken by the first rule defined in the file.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0028"
    object: 'a group proposed as the root of a specification'
    field: 'no BCP 14 keyword backs this; the force is a prohibition stated without a keyword — "there is no way to use a group as a root -- it must be a type" (lower-case "must")'
    verb: 'must'
    actor: 'validator'
    locator: "§2.2.4"
    text: '(Note that there is no way to use a group as a root -- it must be a type.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0029"
    object: 'a CDDL rule name'
    field: 'no BCP 14 keyword backs this; the force is the definition of the name character set — "A name can consist of any of the characters from the set"'
    verb: none
    actor: 'validator / tool implementer'
    locator: "§3.1"
    text: 'A name can consist of any of the characters from the set {"A" to "Z", "a" to "z", "0" to "9", "_", "-", "@", ".", "$"}, starting with an alphabetic character (including "@", "_", "$") and ending in such a character or a digit.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0030"
    object: 'comparison of two CDDL names'
    field: 'no BCP 14 keyword backs this; the force is a property stated as fact — "Names are case sensitive."'
    verb: none
    actor: 'validator / tool implementer'
    locator: "§3.1"
    text: 'Names are case sensitive.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0031"
    object: 'rule names versus barewords, in the encoded instance'
    field: 'no BCP 14 keyword backs this; the force is a presence claim stated as fact — rule names "do not appear in the actual CBOR encoding, but names used as “barewords” in member keys do"'
    verb: none
    actor: 'validator'
    locator: "§3.1"
    text: 'Rule names (types or groups) do not appear in the actual CBOR encoding, but names used as "barewords" in member keys do.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0032"
    object: 'a comment in a CDDL file'
    field: 'no BCP 14 keyword backs this; the force is the definition of comment syntax — "started by a “;” … and finish at the end of a line (LF or CRLF)"'
    verb: none
    actor: 'tool implementer'
    locator: "§3.1"
    text: 'Comments are started by a ";" (semicolon) character and finish at the end of a line (LF or CRLF).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0033"
    object: 'whitespace between syntactic elements of a CDDL file'
    field: 'no BCP 14 keyword backs this; the force is a definition of significance — "it is otherwise completely optional", with the exception named in the same sentence'
    verb: none
    actor: 'tool implementer'
    locator: "§3.1"
    text: 'Except within strings, whitespace (spaces, newlines, and comments) is used to separate syntactic elements for readability (and to separate identifiers, range operators, or numbers that follow each other); it is otherwise completely optional.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0034"
    object: 'case insensitivity of a text string type'
    field: 'no BCP 14 keyword backs this; the force is an explicit absence of a feature — "there is no support in CDDL for the concept of case insensitivity in text strings"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§3.1"
    text: '(ABNF users may want to note that there is no support in CDDL for the concept of case insensitivity in text strings; if necessary, regular expressions can be used (Section 3.8.3).)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0035"
    object: 'an unprefixed byte string literal'
    field: 'no BCP 14 keyword backs this; the force is the definition of the literal, carrying a lower-case "must" — "single quotes must be escaped"'
    verb: 'must'
    actor: 'tool implementer'
    locator: "§3.1"
    text: 'If unprefixed, the string is interpreted as with a text string, except that single quotes must be escaped and that the resulting UTF-8 bytes are marked as a byte string (major type 2).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0036"
    object: 'a byte string literal prefixed "h" or "b64"'
    field: 'no BCP 14 keyword backs this; the force is the definition of the literal, including a stated exclusion — "any whitespace present within the string (including comments) is ignored in the prefixed case"'
    verb: none
    actor: 'tool implementer'
    locator: "§3.1"
    text: 'If prefixed as "h" or "b64", the string is interpreted as a sequence of pairs of hex digits (base16; see Section 8 of [RFC4648]) or a base64(url) string (Section 4 or Section 5 of [RFC4648]), respectively (as with the diagnostic notation in Section 6 of [RFC7049]; cf. Appendix G.2); any whitespace present within the string (including comments) is ignored in the prefixed case.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0037"
    object: 'the encoding of a CDDL file and the normalization of its text'
    field: 'no BCP 14 keyword backs this; the force is a statement of fact plus an explicit exclusion — "CDDL uses UTF-8 … Processing of CDDL does not involve Unicode normalization processes."'
    verb: none
    actor: 'tool implementer'
    locator: "§3.1"
    text: 'CDDL uses UTF-8 [RFC3629] for its encoding. Processing of CDDL does not involve Unicode normalization processes.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Bears directly on ARCH-0002 P1: a bareword member key is a text string, and two normalization variants of the same label are two different keys. See design-notes.'
  - id: "rfc-8610#R-0038"
    object: 'an occurrence indicator on a group entry'
    field: 'no BCP 14 keyword backs this; the force is the definition of the permitted forms and their default limits — "n is the lower limit (default 0) and m is the upper limit (default no limit)"'
    verb: none
    actor: 'validator / tool implementer'
    locator: "§3.2"
    text: 'An optional _occurrence_ indicator can be given in front of a group entry. It is either (1) one of the characters "?" (optional), "*" (zero or more), or "+" (one or more) or (2) of the form n*m, where n and m are optional unsigned integers and n is the lower limit (default 0) and m is the upper limit (default no limit) of occurrences.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0039"
    object: 'a group entry with no occurrence indicator'
    field: 'no BCP 14 keyword backs this; the force is a default stated as fact — "is to occur exactly once (as if 1*1 were specified)"'
    verb: none
    actor: 'validator'
    locator: "§3.2"
    text: 'If no occurrence indicator is specified, the group entry is to occur exactly once (as if 1*1 were specified).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0040"
    object: 'a group entry carrying an occurrence indicator'
    field: 'no BCP 14 keyword backs this; the force is the occurrence-matching rule — "matches sequences of name/value pairs that are composed by concatenating a number of sequences … allowed by the occurrence indicator"'
    verb: none
    actor: 'validator'
    locator: "§3.2"
    text: 'A group entry with an occurrence indicator matches sequences of name/value pairs that are composed by concatenating a number of sequences that the basic group entry matches, where the number needs to be allowed by the occurrence indicator.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0041"
    object: 'definite-length versus indefinite-length encoding of an array or map'
    field: 'no BCP 14 keyword backs this; the force is an explicit disclaimer — "does not make any prescription" and "there is no correlation"'
    verb: none
    actor: 'CDDL specification author / verifier relying on a CDDL schema'
    locator: "§3.2"
    text: 'Note that CDDL, outside any directives/annotations that could possibly be defined, does not make any prescription as to whether arrays or maps use definite-length or indefinite-length encoding. That is, there is no correlation between leaving the size of an array "open" in the spec and the fact that it is then interchanged with definite or indefinite length.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Second half of the encoding-neutrality disclaimer begun at §2.2.3. A CDDL schema cannot forbid indefinite lengths.'
  - id: "rfc-8610#R-0042"
    object: 'a CDDL specification that is more permissive than the target data model'
    field: 'no BCP 14 keyword backs this; the force is a capability claim stated as fact — "CDDL can describe flexibility that the data model of the target representation does not have"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§3.2"
    text: 'Please also note that CDDL can describe flexibility that the data model of the target representation does not have. This is rather obvious for JSON but is also relevant for CBOR:'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The worked case in the same section is `* bedroom: size`, which the target data model silently reduces to `? bedroom: size`. The grammar admits what the type system cannot mean.'
  - id: "rfc-8610#R-0043"
    object: 'predefined names for arrays and maps'
    field: 'no BCP 14 keyword backs this; the force is an explicit absence — "there are no predefined names for arrays or maps"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§3.3"
    text: '(Note that there are no predefined names for arrays or maps; these are defined with the syntax given below.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0044"
    object: 'an array type expression'
    field: 'no BCP 14 keyword backs this; the force is the definition of array syntax — "Array definitions surround a group with square brackets."'
    verb: none
    actor: 'validator'
    locator: "§3.4"
    text: 'Array definitions surround a group with square brackets.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0045"
    object: 'the ordering of key/value pairs in a CBOR map'
    field: 'no BCP 14 keyword backs this; the force is a property of the target data model stated as fact — "the key/value pairs in CBOR maps have no fixed ordering"'
    verb: none
    actor: 'validator'
    locator: "§3.5"
    text: 'But first, let''s reiterate a feature of CBOR that it has inherited from JSON: the key/value pairs in CBOR maps have no fixed ordering.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0046"
    object: 'a CDDL specification that wishes to fix map key order'
    field: 'no BCP 14 keyword backs this; the force is an explicit non-feature — "no attempt was made to support this in CDDL either"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§3.5"
    text: 'Unfortunately, neither JSON nor CBOR supports this, so no attempt was made to support this in CDDL either.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'CDDL has no vocabulary for map key order; a deterministic key ordering therefore cannot be expressed in a CDDL schema at all. See design-notes section 2.'
  - id: "rfc-8610#R-0047"
    object: 'a map type expression'
    field: 'no BCP 14 keyword backs this; the force is the definition of map syntax — "defined in the same way as that for defining an array … except for using curly braces"'
    verb: none
    actor: 'validator'
    locator: "§3.5.1"
    text: 'A map is defined in the same way as that for defining an array (see Section 3.4), except for using curly braces "{}" instead of square brackets "[]".'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0048"
    object: 'an identifier followed by a colon in member-key position'
    field: 'no BCP 14 keyword backs this; the force is the definition of a bareword member key — "can be directly used as the text string for a member key"'
    verb: none
    actor: 'validator'
    locator: "§3.5.1"
    text: 'This is actually a complete example: an identifier that is followed by a colon can be directly used as the text string for a member key (we speak of a "bareword" member key), as can a double-quoted string or a number.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0049"
    object: 'a type named by an identifier used in key-type position'
    field: 'no BCP 14 keyword backs this; the force is a necessity stated without a keyword — "the double arrow is necessary if a type is named by an identifier"'
    verb: 'necessary'
    actor: 'CDDL specification author'
    locator: "§3.5.1"
    text: 'More generally, types specified in ways other than those listed for the cases described above can be used in a key-type position by following them with a double arrow -- in particular, the double arrow is necessary if a type is named by an identifier (which, when followed by a colon, would be interpreted as a "bareword" and turned into a text string).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0050"
    object: 'a named group included in a struct'
    field: 'no BCP 14 keyword backs this; the force is a stated consequence — "does not generate another map; instead, all four keys are directly in the struct"'
    verb: none
    actor: 'validator'
    locator: "§3.5.1"
    text: 'Note that the group definition for NameComponents does not generate another map; instead, all four keys are directly in the struct built by PersonalData.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0051"
    object: 'a map entry with no occurrence indicator'
    field: 'no BCP 14 keyword backs this; the force is a definitional default — "With no occurrence indicator, an entry is mandatory."'
    verb: none
    actor: 'validator'
    locator: "§3.5.1"
    text: 'In this example, all key/value pairs are optional from the perspective of CDDL. With no occurrence indicator, an entry is mandatory.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0052"
    object: 'a table'
    field: 'no BCP 14 keyword backs this; the force is the definition of the table idiom — "a map with entries where the key type allows more than just a single value"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§3.5.2"
    text: 'A table can be specified by defining a map with entries where the key type allows more than just a single value; for example:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0053"
    object: 'matching a group against a map'
    field: 'no BCP 14 keyword backs this; the force is the map-matching procedure — "a matching member is picked out of the entire map"'
    verb: none
    actor: 'validator'
    locator: "§3.5.3"
    text: 'For each candidate name/value pair that the PEG algorithm would try, a matching member is picked out of the entire map.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0054"
    object: 'a group expression whose pick from a map is indeterminate'
    field: 'no BCP 14 keyword backs this; the force is a stated tooling limitation — "CDDL tools cannot detect such cases automatically" — plus a lower-case exhortation, "the specification writer is simply urged to not write pathologically non-deterministic specifications"'
    verb: 'urged'
    actor: 'CDDL specification author'
    locator: "§3.5.3"
    text: 'At the time of writing, CDDL tools cannot detect such cases automatically, and for the present version of the CDDL specification, the specification writer is simply urged to not write pathologically non-deterministic specifications.'
    kind: inferred
    testable: 'partial'
    testable_reason: '"pathologically non-deterministic" is characterised by example and by cause ("more general" before "more specific") but carries no decision procedure; the same sentence states that tools cannot decide it'
    status: active
  - id: "rfc-8610#R-0055"
    object: 'a map entry carrying a cut ("^")'
    field: 'no BCP 14 keyword backs this; the force is the definition of cut semantics — "other potential matches … are no longer allowed" and "the entire map fails to match"'
    verb: none
    actor: 'validator'
    locator: "§3.5.4"
    text: 'A cut in this position means that once the member key matches the name part of an entry that carries a cut, other potential matches for the key of the member that occur in later entries in the group of the map are no longer allowed.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0056"
    object: 'a group entry that picks a key/value pair on a matching key alone'
    field: 'no BCP 14 keyword backs this; the force is the lock-in rule, stated as a rule — "it “locks in” the pick -- this rule applies, independently of whether the value matches as well"'
    verb: none
    actor: 'validator'
    locator: "§3.5.4"
    text: 'In other words, when a group entry would pick a key/value pair based on just a matching key, it "locks in" the pick -- this rule applies, independently of whether the value matches as well, so when it does not, the entire map fails to match.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0057"
    object: 'the ":" member-key shortcut'
    field: 'no BCP 14 keyword backs this; the force is a definitional equivalence — "the “:” shortcut is actually defined to include the cut semantics"'
    verb: none
    actor: 'validator'
    locator: "§3.5.4"
    text: 'Since the desire for this kind of exclusive matching is so frequent, the ":" shortcut is actually defined to include the cut semantics.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0058"
    object: 'a CBOR tag in a CDDL type'
    field: 'no BCP 14 keyword backs this; the force is the definition of tag notation — "giving #6.nnn(type) where nnn is an unsigned integer giving the tag number"'
    verb: none
    actor: 'validator'
    locator: "§3.6"
    text: 'A type can make use of a CBOR tag (major type 6) by using the representation type notation, giving #6.nnn(type) where nnn is an unsigned integer giving the tag number and "type" is the type of the data item being tagged.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0059"
    object: 'a tag registered after RFC 7049 was written'
    field: 'no BCP 14 keyword backs this; the force is a need stated as fact — "need to be added to a CDDL specification as needed"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§3.6"
    text: 'Additional tags registered since [RFC7049] was written need to be added to a CDDL specification as needed; e.g., a binary Universally Unique Identifier (UUID) tag could be referenced as "buuid" in a specification after defining'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Read with Appendix D (rfc-8610#R-0124): the prelude is fixed at the RFC 7049 tag set, so every later tag is the specification author''s to declare. Bears on MD-3 — see design-notes section 3.'
  - id: "rfc-8610#R-0060"
    object: 'the unwrap operator "~"'
    field: 'no BCP 14 keyword backs this; the force is the definition of the operator — "can be used to strip the type defined for a name by one layer"'
    verb: none
    actor: 'validator'
    locator: "§3.7"
    text: 'The "unwrap" operator (written by preceding a name by a tilde character "~") can be used to strip the type defined for a name by one layer, exposing the underlying group (for maps and arrays) or type (for tags).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0061"
    object: 'a control type'
    field: 'no BCP 14 keyword backs this; the force is the definition of control syntax — "target .control-operator controller"'
    verb: none
    actor: 'validator / tool implementer'
    locator: "§3.8"
    text: 'The syntax for a control type is "target .control-operator controller", where control operators are special identifiers prefixed by a dot.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0062"
    object: 'a control operator beyond those defined in this document'
    field: 'no BCP 14 keyword backs this; the force is an enumeration of the only two admissible routes — "by new versions of this specification or by registering them according to the procedures in Section 6.1"'
    verb: none
    actor: 'author of a new control operator'
    locator: "§3.8"
    text: 'A number of control operators are defined at this point. Further control operators may be defined by new versions of this specification or by registering them according to the procedures in Section 6.1.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'CDDL''s declared main extension point (§3.8.3.2) is reachable only through an IANA registry or a new RFC. Directly relevant to R-M-12; see design-notes section 3.'
  - id: "rfc-8610#R-0063"
    object: 'the .size control on a text or byte string'
    field: 'no BCP 14 keyword backs this; the force is the definition of the operator — "it directly controls the number of bytes in the string"'
    verb: none
    actor: 'validator'
    locator: "§3.8.1"
    text: 'The control is defined for text and byte strings, where it directly controls the number of bytes in the string. It is also defined for unsigned integers (see below).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0064"
    object: 'the .size control on an unsigned integer'
    field: 'no BCP 14 keyword backs this; the force is a definitional equivalence — "“uint .size N” is equivalent to “0...BYTES_N”, where BYTES_N == 256**N"'
    verb: none
    actor: 'validator'
    locator: "§3.8.1"
    text: 'When applied to an unsigned integer, the ".size" control restricts the range of that integer by giving a maximum number of bytes that should be needed in a computer representation of that unsigned integer. In other words, "uint .size N" is equivalent to "0...BYTES_N", where BYTES_N == 256**N.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0065"
    object: 'the .size control considered as a constraint on serialized bytes'
    field: 'no BCP 14 keyword backs this; the force is an explicit disclaimer — "this control is not a representation constraint"'
    verb: none
    actor: 'verifier relying on a CDDL schema'
    locator: "§3.8.1"
    text: 'Note that, as with value restrictions in CDDL, this control is not a representation constraint; a number that fits into fewer bytes can still be represented in that form, and an inefficient implementation could use a longer form (unless that is restricted by some format constraints outside of CDDL, such as the rules in Section 3.9 of [RFC7049]).'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Third statement of the encoding-neutrality disclaimer, and the one that names the remedy: a constraint "outside of CDDL". RFC 7049 §3.9 is now RFC 8949 §4.2.'
  - id: "rfc-8610#R-0066"
    object: 'the .bits control on a byte string'
    field: 'no BCP 14 keyword backs this; the force is the definition of the operator — "only the bits numbered by a number in the control type are allowed to be set"'
    verb: none
    actor: 'validator'
    locator: "§3.8.2"
    text: 'A ".bits" control on a byte string indicates that, in the target, only the bits numbered by a number in the control type are allowed to be set.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0067"
    object: 'the .bits control on an unsigned integer'
    field: 'no BCP 14 keyword backs this; the force is the definition of the operator, carrying a lower-case "must" — "“n” must be in the control type"'
    verb: 'must'
    actor: 'validator'
    locator: "§3.8.2"
    text: 'Similarly, a ".bits" control on an unsigned integer "i" indicates that for all unsigned integers "n" where "(i & (1 << n)) != 0", "n" must be in the control type.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0068"
    object: 'the length of a byte string constrained only by .bits'
    field: 'no BCP 14 keyword backs this; the force is a stated consequence — a valid all-clear instance "could be “h’’” or “h’00’” or even “h’000000’” as well"'
    verb: none
    actor: 'validator'
    locator: "§3.8.2"
    text: 'These examples do not illustrate that the above CDDL specification does not explicitly specify a size of two bytes: a valid all-clear instance of flag bytes could be "h''''" or "h''00''" or even "h''000000''" as well.'
    kind: inferred
    testable: 'yes'
    status: active
    note: '.bits constrains which bits may be set, never how many bytes carry them; a length constraint needs a separate .size.'
  - id: "rfc-8610#R-0069"
    object: 'the .regexp control'
    field: 'no BCP 14 keyword backs this; the force is the definition of the operator plus its normative reference — "needs to match the XML Schema Definition (XSD) regular expression"'
    verb: 'needs to'
    actor: 'validator'
    locator: "§3.8.3"
    text: 'A ".regexp" control indicates that the text string given as a target needs to match the XML Schema Definition (XSD) regular expression given as a value in the control type.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0070"
    object: 'a specification that employs CDDL and uses Unicode character classes in an XSD regular expression'
    field: 'identification of the Unicode versions addressed'
    verb: 'SHOULD'
    actor: 'author of a specification that employs CDDL'
    locator: "§3.8.3.1"
    text: 'XSD regular expressions support character class subtraction, a feature often not found in regular expression libraries; specification writers may want to use this feature sparingly. Similar considerations apply to Unicode character classes; where these are used, the specification that employs CDDL SHOULD identify which Unicode versions are addressed.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'The ONLY all-capitals BCP 14 keyword RFC 8610 asserts in its own voice. It is an obligation on the author of a downstream specification, not on a CDDL tool or on an instance.'
  - id: "rfc-8610#R-0071"
    object: 'the .cbor control'
    field: 'no BCP 14 keyword backs this; the force is the definition of the operator — "Decoded, the data item matches the type given as the right-hand-side argument"'
    verb: none
    actor: 'validator'
    locator: "§3.8.4"
    text: 'A ".cbor" control on a byte string indicates that the byte string carries a CBOR-encoded data item. Decoded, the data item matches the type given as the right-hand-side argument (type1 in the following example).'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'This is how CDDL describes the bstr-wrapped-CBOR pattern that RFC 9052 §3 uses for the protected header and that R-O-05 wants for the signed payload.'
  - id: "rfc-8610#R-0072"
    object: 'the .cborseq control'
    field: 'no BCP 14 keyword backs this; the force is the definition of the operator — "When the data items are taken as an array, the array matches the type"'
    verb: none
    actor: 'validator'
    locator: "§3.8.4"
    text: 'Similarly, a ".cborseq" control on a byte string indicates that the byte string carries a sequence of CBOR-encoded data items. When the data items are taken as an array, the array matches the type given as the right-hand-side argument (type2 in the following example).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0073"
    object: 'the .and control'
    field: 'no BCP 14 keyword backs this; the force is a formal definition — "the resulting type is the intersection of the two types given"'
    verb: none
    actor: 'validator'
    locator: "§3.8.5"
    text: 'A ".and" control on a type indicates that the data item matches both the left-hand-side type and the type given as the right-hand side. (Formally, the resulting type is the intersection of the two types given.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0074"
    object: 'the .within control'
    field: 'no BCP 14 keyword backs this; the force is a definition of identical formal semantics plus a declared intent — "the left-hand-side type is meant to be a subset of the right-hand-side type"'
    verb: none
    actor: 'validator / tool implementer'
    locator: "§3.8.5"
    text: 'A variant of the ".and" control is the ".within" control, which expresses an additional intent: the left-hand-side type is meant to be a subset of the right-hand-side type.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0075"
    object: 'a tool checking .within versus .and'
    field: 'no BCP 14 keyword backs this; the force is a permissive statement about tools — "a tool might flag an error if type1 allows data items that are not allowed by type2"'
    verb: none
    actor: 'tool implementer'
    locator: "§3.8.5"
    text: 'For ".within", a tool might flag an error if type1 allows data items that are not allowed by type2. In contrast, for ".and", there is no expectation that type1 is already a subset of type2.'
    kind: inferred
    testable: 'no'
    testable_reason: '"might flag an error" makes the check optional, so neither flagging nor not flagging can fail; the formal semantics of both operators are identical and are tested by rfc-8610#R-0073 and rfc-8610#R-0074'
    status: active
  - id: "rfc-8610#R-0076"
    object: 'the .lt, .le, .gt and .ge controls'
    field: 'no BCP 14 keyword backs this; the force is a restriction of the domain of definition — "defined only for numeric types"'
    verb: none
    actor: 'validator'
    locator: "§3.8.6"
    text: 'In the present specification, the first four controls (.lt, .le, .gt, and .ge) are defined only for numeric types, as these have a natural ordering relationship.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0077"
    object: 'value equality under .eq and .ne'
    field: 'no BCP 14 keyword backs this; the force is the only value-equality definition CDDL gives — "equality is determined as follows" followed by a closed case analysis'
    verb: none
    actor: 'validator'
    locator: "§3.8.6"
    text: '.ne and .eq are defined for both numeric values and values of other types. If one of the values is not of a numeric type, equality is determined as follows: text strings are equal (satisfy .eq / do not satisfy .ne) if they are bytewise identical; the same applies for byte strings. Arrays are equal if they have the same number of elements, all of which are equal pairwise in order between the arrays. Maps are equal if they have the same number of key/value pairs, and there is pairwise equality between the key/value pairs between the two maps. Tagged values are equal if they both have the same tag and the values are equal. Values of simple types match if they are the same values. Numeric types that occur within arrays, maps, or tagged values are equal if their numeric value is equal and they are both integers or both floating-point values. All other cases are not equal (e.g., comparing a text string with a byte string).'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Text strings compare BYTEWISE, so no Unicode normalization is applied here either (cf. rfc-8610#R-0037). Map equality is defined without reference to key order. Numeric equality INSIDE a container is value-equal across integer widths but not across the integer/float boundary - a different rule from the top-level NR1/NR2 disjointness of rfc-8610#R-0016.'
  - id: "rfc-8610#R-0078"
    object: 'the .default control'
    field: 'no BCP 14 keyword backs this; the force is a definitional variant plus a scope restriction — "only meaningful when the control type is used in an optional context"'
    verb: none
    actor: 'CDDL specification author / validator'
    locator: "§3.8.6"
    text: 'A variant of the ".ne" control is the ".default" control, which expresses an additional intent: the value specified by the right-hand-side type is intended as a default value for the left-hand-side type given, and the implied .ne control is there to prevent this value from being sent over the wire.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The only place CDDL constrains what is ON THE WIRE rather than what the data model admits - and it does so by excluding a value, not by fixing an encoding.'
  - id: "rfc-8610#R-0079"
    object: 'a socket name left undefined'
    field: 'no BCP 14 keyword backs this; the force is a convention honoured by tools, stated as fact — "Tools honor that convention by not raising an error if such a type or group is not defined at all"'
    verb: none
    actor: 'tool implementer'
    locator: "§3.9"
    text: 'Per convention, CDDL extension points are marked with a leading dollar sign (types) or two leading dollar signs (groups). Tools honor that convention by not raising an error if such a type or group is not defined at all; the symbol is then taken to be an empty type choice (group choice), i.e., no choice is available.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0080"
    object: 'type sockets and group sockets'
    field: 'no BCP 14 keyword backs this; the force is the definition of the two socket kinds and their extension operators — "intended to be extended via “/=”" / "via “//=”"'
    verb: none
    actor: 'CDDL specification author'
    locator: "§3.9"
    text: 'Names that start with a single "$" are "type sockets", starting out as an empty type, and intended to be extended via "/=". Names that start with a double "$$" are "group sockets", starting out as an empty group choice, and intended to be extended via "//=".'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0081"
    object: 'a plug definition for a socket name'
    field: 'no BCP 14 keyword backs this; the force is a convention carrying a lower-case "must" twice — "all definitions (plugs) for socket names must be augmentations … they must be using “/=” and “//=”"'
    verb: 'must'
    actor: 'CDDL specification author'
    locator: "§3.9"
    text: 'As a convention, all definitions (plugs) for socket names must be augmentations, i.e., they must be using "/=" and "//=", respectively.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The strongest obligation in the whole document and it is a lower-case "must" inside the phrase "As a convention". This is CDDL''s ONLY registry-free extension mechanism; see design-notes section 3.'
  - id: "rfc-8610#R-0082"
    object: 'a generic rule'
    field: 'no BCP 14 keyword backs this; the force is the definition of binding — "the formal parameters are bound to the actual arguments supplied … (as if there were a rule of the form parameter = argument)"'
    verb: none
    actor: 'validator / tool implementer'
    locator: "§3.10"
    text: 'When using a generic rule, the formal parameters are bound to the actual arguments supplied (also using angle brackets), within the scope of the generic rule (as if there were a rule of the form parameter = argument).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0083"
    object: 'the relative binding of type operators and group operators'
    field: 'no BCP 14 keyword backs this; the force is a derivation stated as fact — "type operators naturally bind closer than group operators"'
    verb: none
    actor: 'validator / tool implementer'
    locator: "§3.11"
    text: 'Type operators (such as "/" for type choice) operate on types, while group operators (such as "//" for group choice) operate on groups. Types can simply be used in groups, but groups need to be bracketed (as arrays or maps) to become types. So, type operators naturally bind closer than group operators.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0084"
    object: 'the full operator precedence order'
    field: 'no BCP 14 keyword backs this; the force is a normative cross-reference to the grammar — "are defined in Appendix B and summarized in Table 1"'
    verb: none
    actor: 'tool implementer'
    locator: "§3.11"
    text: 'The operator precedences, in sequence of loose to tight binding, are defined in Appendix B and summarized in Table 1. (Arities given are 1 for unary prefix operators and 2 for binary infix operators.)'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Table 1 is reproduced verbatim in distilled/normative.md §3.11; Appendix B governs where the two disagree.'
  - id: "rfc-8610#R-0085"
    object: 'how thoroughly an application enforces a CDDL data description'
    field: 'no BCP 14 keyword backs this; the force is an explicit delegation carrying a lower-case "must" — "how far the data description must be enforced by an application is left to the designers and implementers of that application"'
    verb: 'must'
    actor: 'application designer / implementer'
    locator: "§4.2"
    text: 'The matter of how far the data description must be enforced by an application is left to the designers and implementers of that application, keeping in mind related security considerations.'
    kind: inferred
    testable: 'no'
    testable_reason: 'the sentence delegates the decision rather than stating a level; no conformance level is fixed, so no artifact of an implementation can fail it'
    status: active
    note: 'This plus §4.2''s preceding sentence (an application "may decide not to check the data structure at all") is why a CDDL schema alone is not a verifier contract. See design-notes section 2.'
  - id: "rfc-8610#R-0086"
    object: 'code generation from a CDDL definition'
    field: 'no BCP 14 keyword backs this; the force is a statement of intent in the negative — "In no case is it intended that a CDDL tool would be “writing code”"'
    verb: none
    actor: 'tool implementer'
    locator: "§4.2"
    text: 'In no case is it intended that a CDDL tool would be "writing code" for an implementation.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement about the authors'' intent for tooling, not a property of any CDDL specification, tool output or instance'
    status: active
  - id: "rfc-8610#R-0087"
    object: 'a system in which a CDDL matcher is part of the implementation'
    field: 'no BCP 14 keyword backs this; the force is a lower-case normative "ought not" — "the security of the system ought not depend on the correctness of the CDDL specification or CDDL implementation"'
    verb: 'ought not'
    actor: 'system implementer'
    locator: "§5"
    text: 'Where a CDDL matcher is part of the implementation of a system, the security of the system ought not depend on the correctness of the CDDL specification or CDDL implementation without any further defenses in place.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'the presence of defenses beyond the matcher is observable in an architecture; "security … ought not depend" states no threshold'
    status: active
  - id: "rfc-8610#R-0088"
    object: 'a CDDL specification that includes extension points'
    field: 'no BCP 14 keyword backs this; the force is a lower-case necessity — "the impact of extensions on the security of the system needs to be carefully considered"'
    verb: 'needs to'
    actor: 'author of a specification that employs CDDL'
    locator: "§5"
    text: 'Where the CDDL specification includes extension points, the impact of extensions on the security of the system needs to be carefully considered.'
    kind: inferred
    testable: 'no'
    testable_reason: '"carefully considered" names a human analysis with no artifact and no criterion'
    status: active
  - id: "rfc-8610#R-0089"
    object: 'the style of a CDDL specification'
    field: 'no BCP 14 keyword backs this; the force is a lower-case exhortation — "strongly encouraged to value clarity and transparency … over its elegance"'
    verb: 'strongly encouraged'
    actor: 'CDDL specification author'
    locator: "§5"
    text: 'Writers of CDDL specifications are strongly encouraged to value clarity and transparency of the specification over its elegance. Keep it as simple as possible while still expressing the needed data model.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a drafting preference between two unquantified qualities'
    status: active
  - id: "rfc-8610#R-0090"
    object: 'an entry in the CDDL Control Operators registry'
    field: 'no BCP 14 keyword backs this; the force is a lower-case "must" twice — "must include the name of the control operator … and a reference to its documentation" and "Names must be composed of the leading dot followed by a text string conforming to the production “id”"'
    verb: 'must'
    actor: 'IANA / registrant'
    locator: "§6.1"
    text: 'Each entry in the subregistry must include the name of the control operator (by convention given with the leading dot) and a reference to its documentation. Names must be composed of the leading dot followed by a text string conforming to the production "id" in Appendix B.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0091"
    object: 'an unregistered control operator name'
    field: 'no BCP 14 keyword backs this; the force is a registry status statement — "All other control operator names are Unassigned."'
    verb: none
    actor: 'tool implementer'
    locator: "§6.1"
    text: 'All other control operator names are Unassigned.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0092"
    object: 'addition of a name to the CDDL Control Operators registry'
    field: 'no BCP 14 keyword backs this; the force is the declaration of an IANA policy — "the IANA policy for additions to this registry is “Specification Required” … and “IETF Review”"'
    verb: none
    actor: 'IANA / registrant'
    locator: "§6.1"
    text: 'The IANA policy for additions to this registry is "Specification Required" as defined in [RFC8126] (which involves an Expert Review) for names that do not include an internal dot and "IETF Review" for names that do include an internal dot.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The internal-dot rule is the one place CDDL offers a cheaper allocation path, and it is the MORE expensive one (IETF Review). A dotted name such as `.mofn.statement` is harder to register than an undotted one. Bears on R-M-12; see design-notes section 3.'
  - id: "rfc-8610#R-0093"
    object: 'the status of Appendix A'
    field: 'no BCP 14 keyword backs this; the force is a scope declaration — "This appendix is normative."'
    verb: none
    actor: 'reader of this specification'
    locator: "Appendix A"
    text: 'This appendix is normative.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Appendices A, B, C, D, E and G each open with this sentence; F and H open with "This appendix is for information only." The six normative appendices carry most of CDDL''s semantics. This entry stands for the declaration; rfc-8610#R-0132 records the informative counterpart.'
  - id: "rfc-8610#R-0094"
    object: 'a choice in a CDDL type or group'
    field: 'no BCP 14 keyword backs this; the force is the PEG prioritized-choice rule — "tested in left-to-right order, locking in the first successful match and disregarding any further potential matches"'
    verb: none
    actor: 'validator'
    locator: "Appendix A"
    text: 'However, where BNF uses the unordered (symmetrical) choice operator "|" (incidentally notated as "/" in ABNF), PEG provides a prioritized choice operator "/". The two alternatives listed are to be tested in left-to-right order, locking in the first successful match and disregarding any further potential matches within the choice (but not disabling alternatives in choices containing this choice, as a cut (Section 3.5.4) would).'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Order of alternatives is semantic. Rules contributed later with /= or //= are appended in rule order (rfc-8610#R-0102), so the order in which plug files are concatenated changes which alternative wins.'
  - id: "rfc-8610#R-0095"
    object: 'an occurrence indicator under PEG semantics'
    field: 'no BCP 14 keyword backs this; the force is the greediness rule plus a worked impossibility — "“*a a” in CDDL syntax never can match anything"'
    verb: none
    actor: 'validator'
    locator: "Appendix A"
    text: 'Similarly, the occurrence indicators ("?", "*", "+") are "greedy" in PEG, i.e., they consume as much input as they match (and, as a consequence, "a* a" in PEG notation or "*a a" in CDDL syntax never can match anything, as all input matching "a" is already consumed by the initial "a*", leaving nothing to match the second "a").'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0096"
    object: 'syntactic predicate operators in CDDL'
    field: 'no BCP 14 keyword backs this; the force is an explicit absence — "CDDL does not provide the syntactic predicate operators NOT (“!”) or AND (“&”) from PEG"'
    verb: none
    actor: 'CDDL specification author'
    locator: "Appendix A"
    text: 'Also, CDDL does not provide the syntactic predicate operators NOT ("!") or AND ("&") from PEG, reducing expressiveness as well as complexity.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'There is no negation in CDDL. A constraint of the form "any map except one containing key K" cannot be written; .ne excludes a value, not a structure.'
  - id: "rfc-8610#R-0097"
    object: 'case sensitivity in the CDDL grammar versus in CDDL itself'
    field: 'no BCP 14 keyword backs this; the force is a statement about the grammar notation — "the quote-delimited strings below are case insensitive (while string values and names are case sensitive in CDDL)"'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix B"
    text: 'The following is a formal definition of the CDDL syntax in ABNF [RFC5234]. Note that, as is defined in ABNF, the quote-delimited strings below are case insensitive (while string values and names are case sensitive in CDDL).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0098"
    object: 'the contents of a prefixed byte string, as described by the grammar'
    field: 'no BCP 14 keyword backs this; the force is a stated limitation of the grammar — "this ABNF does not attempt to reflect the detailed rules of what can be in a prefixed byte string"'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix B"
    text: 'Note that this ABNF does not attempt to reflect the detailed rules of what can be in a prefixed byte string.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'A declared gap between the grammar and the language: §3.1''s prose governs prefixed byte strings, not Figure 13.'
  - id: "rfc-8610#R-0099"
    object: 'the meaning of "matches"'
    field: 'no BCP 14 keyword backs this; the force is the definition the whole appendix rests on — an instance "“matches” a CDDL specification if it is allowed by the CDDL specification"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'In this appendix, we go through the ABNF syntax rules defined in Appendix B and briefly describe the matching semantics of each syntactic feature. In this context, an instance (data item) "matches" a CDDL specification if it is allowed by the CDDL specification; this is then broken down into parts of specifications (type and group expressions) and parts of instances (data items).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0100"
    object: 'the significance of rule order in a specification'
    field: 'no BCP 14 keyword backs this; the force is a closed enumeration — "The order of the rules is significant only in two cases"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'A CDDL specification is a sequence of one or more rules. Each rule gives a name to a right-hand-side expression, either a CDDL type or a CDDL group. Rule names can be used in the rule itself and/or other rules (and tools can output warnings if that is not the case). The order of the rules is significant only in two cases:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0101"
    object: 'the first rule of a specification'
    field: 'no BCP 14 keyword backs this; the force is a definition by designation — "The first rule defines the semantics of the entire specification"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'The first rule defines the semantics of the entire specification; hence, there is no need to give that root rule a special name or special syntax in the language (as, for example, with "start" in RELAX NG); its name can therefore be chosen to be descriptive.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0102"
    object: 'a choice populated by "/=" or "//=" rules'
    field: 'no BCP 14 keyword backs this; the force is an ordering rule — "that choice is populated in the order the rules are given"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'Where a rule contributes to a type or group choice (using "/=" or "//="), that choice is populated in the order the rules are given; see below.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'With prioritized choice (rfc-8610#R-0094) this makes socket/plug assembly ORDER-DEPENDENT: concatenating the same plug files in a different order can yield a different language.'
  - id: "rfc-8610#R-0103"
    object: 'a rule name substituted by its definition'
    field: 'no BCP 14 keyword backs this; the force is a semantic invariant — "the semantics does not change when the name is replaced by its (parenthesized if needed) definition"'
    verb: none
    actor: 'validator / tool implementer'
    locator: "Appendix C"
    text: 'A rule defines a name for a type expression (production "type") or for a group expression (production "grpent"), with the intention that the semantics does not change when the name is replaced by its (parenthesized if needed) definition.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0104"
    object: 'determining whether a rule name denotes a type or a group'
    field: 'no BCP 14 keyword backs this; the force is an explicit limitation of the grammar — "isn’t always determined by syntax alone"'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix C"
    text: 'Note that whether the name defined by a rule stands for a type or a group isn''t always determined by syntax alone: e.g., "a = b" can make "a" a type if "b" is a type, or a group if "b" is a group.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'A type/group determination may "need to span several levels of rule definitions", per the parenthetical that follows in the same section. The grammar admits strings whose meaning is undecidable locally - the clearest instance of the gap between what the grammar admits and what the type system means.'
  - id: "rfc-8610#R-0105"
    object: 'a rule name redefined with a plain "="'
    field: 'no BCP 14 keyword backs this; the force is an explicit error condition — "it is an error if the name was already defined with a different expression"'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix C"
    text: 'A plain equals sign defines the rule name as the equivalent of the expression to the right; it is an error if the name was already defined with a different expression.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0106"
    object: 'a type choice'
    field: 'no BCP 14 keyword backs this; the force is the type-choice matching rule — "the first choice that matches wins"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'A type can be given as a choice between one or more types. The choice matches a data item if the data item matches any one of the types given in the choice. The choice uses PEG semantics as discussed in Appendix A: the first choice that matches wins. (As a result, the order of rules that contribute to a single rule name can very well matter.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0107"
    object: 'a single value used as a type'
    field: 'no BCP 14 keyword backs this; the force is the value-matching rule plus an explicit exclusion — "matches only a data item with that specific value (no conversions defined)"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'A type can be just a single value (such as 1 or "icecream" or h''0815''), which matches only a data item with that specific value (no conversions defined),'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0108"
    object: 'a map expression'
    field: 'no BCP 14 keyword backs this; the force is the map-expression matching rule — "matches a valid CBOR map the key/value pairs of which can be ordered in such a way that the resulting sequence matches the group expression"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'a map expression, which matches a valid CBOR map the key/value pairs of which can be ordered in such a way that the resulting sequence matches the group expression, or'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Note "a VALID CBOR map": validity is RFC 8949 §5.3''s level, so duplicate keys and invalid UTF-8 are excluded by the target data model, not by CDDL.'
  - id: "rfc-8610#R-0109"
    object: 'an array expression'
    field: 'no BCP 14 keyword backs this; the force is the array-expression matching rule — elements are "complemented by a wildcard (matches anything) key each"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'an array expression, which matches a CBOR array the elements of which -- when taken as values and complemented by a wildcard (matches anything) key each -- match the group, or'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0110"
    object: 'an unwrapped group'
    field: 'no BCP 14 keyword backs this; the force is the unwrap matching rule — "matches the group inside a type defined as a map or an array by wrapping the group"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'an "unwrapped" group (see Section 3.7), which matches the group inside a type defined as a map or an array by wrapping the group, or'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0111"
    object: 'an enumeration expression'
    field: 'no BCP 14 keyword backs this; the force is the enumeration matching rule — "matches any value that is within the set of values that the values of the group given can take"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'an enumeration expression, which matches any value that is within the set of values that the values of the group given can take, or'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0112"
    object: 'a tagged data item expression'
    field: 'no BCP 14 keyword backs this; the force is the tag matching rule — "tagged with the “uint” given and containing the type given as the tagged value"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'a tagged data item, tagged with the "uint" given and containing the type given as the tagged value, or'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0113"
    object: 'a bare major-type expression'
    field: 'no BCP 14 keyword backs this; the force is the major-type matching rule — "optionally constrained to the additional information given by the uint"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'a data item of a major type (given by the DIGIT), optionally constrained to the additional information given by the uint, or'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0114"
    object: 'a range operator between two type expressions'
    field: 'no BCP 14 keyword backs this; the force is the range matching rule — "the first value is always included in the matching set and the second value is included for “..” and excluded for “...”"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'A range operator can be used to join two type expressions that stand for either two integer values or two floating-point values; it matches any value that is between the two values, where the first value is always included in the matching set and the second value is included for ".." and excluded for "...".'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0115"
    object: 'control operators as an extension point'
    field: 'no BCP 14 keyword backs this; the force is the declaration of an extension point — "control operators are an extension point for CDDL; additional documents may want to define additional control operators"'
    verb: none
    actor: 'author of a new control operator'
    locator: "Appendix C"
    text: 'A control operator ties a _target_ type to a _controller_ type as defined in Section 3.8. Note that control operators are an extension point for CDDL; additional documents may want to define additional control operators.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0116"
    object: 'a group with group choices'
    field: 'no BCP 14 keyword backs this; the force is the group matching rule — "matches any sequence of key/value pairs that matches any of the choices given (again using PEG semantics)"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'A group matches any sequence of key/value pairs that matches any of the choices given (again using PEG semantics).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0117"
    object: 'a single group choice'
    field: 'no BCP 14 keyword backs this; the force is the sequence matching rule — "the sequence of key/value pairs given needs to match the sequence of group entries in the sequence given"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'Each of the component groups is given as a sequence of group entries. For a match, the sequence of key/value pairs given needs to match the sequence of group entries in the sequence given.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0118"
    object: 'a group entry with no member key'
    field: 'no BCP 14 keyword backs this; the force is a usage restriction — "the entry can only be used for matching arrays, not for maps"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'If the memberkey is not given, the entry can only be used for matching arrays, not for maps. (See below for how that is modified by the occurrence indicator.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0119"
    object: 'a key value matched against a key type'
    field: 'no BCP 14 keyword backs this; the force is the member-key matching rule, including the cut exception — "unless a cut preceding it in the group applies"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'Key types can be given by a type expression, a bareword (which stands for a type that just contains a string value created from this bareword), or a value (which stands for a type that just contains this value). A key value matches its key type if the key value is a member of the key type, unless a cut preceding it in the group applies (see Section 3.5.4 for how map matching is influenced by the presence of the cuts denoted by "^" or ":" in previous entries).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0120"
    object: 'a bareword'
    field: 'no BCP 14 keyword backs this; the force is a definitional equivalence plus a syntactic restriction — "it can only be used in the syntactic context given above"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'A bareword is an alternative way to write a type with a single text string value; it can only be used in the syntactic context given above.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0121"
    object: 'commas between group entries, in matching'
    field: 'no BCP 14 keyword backs this; the force is an explicit non-effect — "(Optional commas do not influence the matching.)"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: '(Optional commas do not influence the matching.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0122"
    object: 'an occurrence indicator, formally'
    field: 'no BCP 14 keyword backs this; the force is a formal reduction — "it acts as a (possibly infinite) group choice that contains choices with the group repeated each of the occurrences times"'
    verb: none
    actor: 'validator'
    locator: "Appendix C"
    text: 'An occurrence indicator modifies the group given to its right by requiring the group to match the sequence to be matched exactly for a certain number of times (see Section 3.2) in sequence, i.e., it acts as a (possibly infinite) group choice that contains choices with the group repeated each of the occurrences times.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Reducing occurrence to a group choice means PEG prioritized choice applies to it, which is what makes the indicators greedy (rfc-8610#R-0095).'
  - id: "rfc-8610#R-0123"
    object: 'the standard prelude'
    field: 'no BCP 14 keyword backs this; the force is a statement of automatic inclusion — "The following prelude is automatically added to each CDDL file."'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix D"
    text: 'The following prelude is automatically added to each CDDL file. (Note that technically, it is a postlude, as it does not disturb the selection of the first rule as the root of the definition.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0124"
    object: 'extension of the standard prelude'
    field: 'no BCP 14 keyword backs this; the force is a fixity declaration plus its consequence — "the prelude is deemed to be fixed" and additional tags "need to be defined in each CDDL file that is using them"'
    verb: none
    actor: 'CDDL specification author'
    locator: "Appendix D"
    text: 'Note that the prelude is deemed to be fixed. This means, for instance, that additional tags beyond those defined in [RFC7049], as registered, need to be defined in each CDDL file that is using them.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The prelude is a closed vocabulary frozen at the RFC 7049 tag set. CDDL''s own vocabulary therefore grows only by registry (control operators, §6.1) or by per-file redeclaration - never by a key-relative mechanism. Directly relevant to R-M-12; see design-notes section 3.'
  - id: "rfc-8610#R-0125"
    object: 'a type named "string"'
    field: 'no BCP 14 keyword backs this; the force is an explicit absence and its reason — "the prelude does not define a type “string” … would be ambiguous"'
    verb: none
    actor: 'CDDL specification author'
    locator: "Appendix D"
    text: 'A common stumbling point is that the prelude does not define a type "string". CBOR has byte strings ("bytes" in the prelude) and text strings ("text"), so a type that is simply called "string" would be ambiguous.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0126"
    object: 'use of CDDL for JSON data'
    field: 'no BCP 14 keyword backs this; the force is the definition of the JSON subset — "leaving out byte strings, tags, and simple values other than “false”, “true”, and “null”"'
    verb: none
    actor: 'CDDL specification author'
    locator: "Appendix E"
    text: 'The JSON generic data model (implicit in [RFC8259]) is a subset of the generic data model of CBOR. So, one can use CDDL with JSON by limiting oneself to what can be represented in JSON. Roughly speaking, this means leaving out byte strings, tags, and simple values other than "false", "true", and "null", leading to the following limited prelude:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0127"
    object: 'the types "uint", "nint" and "int" applied to JSON data'
    field: 'no BCP 14 keyword backs this; the force is a re-definition under JSON — the type "becomes a predicate that the number be integral"'
    verb: none
    actor: 'validator'
    locator: "Appendix E"
    text: 'First, JSON does not distinguish between integers and floating-point numbers; there is only one kind of number (which may happen to be integral). In this context, specifying a type as "uint", "nint", or "int" then becomes a predicate that the number be integral.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The SAME CDDL type means two different things depending on the serialization the instance arrives in. An encoding-neutral schema is therefore neutral only up to this re-interpretation.'
  - id: "rfc-8610#R-0128"
    object: 'a float precision type applied to JSON data'
    field: 'no BCP 14 keyword backs this; the force is a stated reduction of effect — "only to restrict the set of permissible values to those expressible with binary16/binary32/binary64"'
    verb: none
    actor: 'validator'
    locator: "Appendix E"
    text: 'CDDL distinguishes the various CBOR number types, but there is only one number type in JSON. The effect of specifying a floating-point precision (float16/float32/float64) is only to restrict the set of permissible values to those expressible with binary16/binary32/ binary64; this is unlikely to be very useful when using CDDL for specifying JSON data structures.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0129"
    object: 'integers interchanged as I-JSON'
    field: 'no BCP 14 keyword backs this; the force is a stated interoperability limit — "integers can only be expressed with interoperable exactness when they lie in the range [-(2**53)+1, (2**53)-1]"'
    verb: none
    actor: 'CDDL specification author'
    locator: "Appendix E"
    text: 'In particular, this means that integers can only be expressed with interoperable exactness when they lie in the range [-(2**53)+1, (2**53)-1] -- a smaller range than that covered by CDDL "int".'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0130"
    object: 'the I-JSON range types of Figure 16'
    field: 'no BCP 14 keyword backs this; the force is an explicit exclusion from the prelude — "the types given here are not part of the prelude; they need to be copied into the CDDL specification if needed"'
    verb: none
    actor: 'CDDL specification author'
    locator: "Appendix E"
    text: 'Note that the types given here are not part of the prelude; they need to be copied into the CDDL specification if needed.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0131"
    object: 'a data model described in CDDL, against the serialization it is interchanged in'
    field: 'no BCP 14 keyword backs this; the force is a standing restriction stated as fact — "is always restricted by what can be expressed in the serialization"'
    verb: none
    actor: 'CDDL specification author / validator'
    locator: "Appendix E"
    text: 'Note that a data model described in CDDL is always restricted by what can be expressed in the serialization; e.g., floating-point values such as NaN (not a number) and the infinities cannot be represented in JSON even if they are allowed in the CDDL generic data model.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The converse of rfc-8610#R-0026: CDDL cannot constrain the serialization, and the serialization silently constrains CDDL. Both directions of leak are in the source. See design-notes section 2.'
  - id: "rfc-8610#R-0132"
    object: 'the status of Appendices F and H'
    field: 'no BCP 14 keyword backs this; the force is a scope declaration in the negative — "This appendix is for information only."'
    verb: none
    actor: 'reader of this specification'
    locator: "Appendix F"
    text: 'This appendix is for information only.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Appendix F (the CDDL tool) and Appendix H (examples) both open with this sentence; nothing in either binds. rfc-8610#R-0093 records the normative counterpart.'
  - id: "rfc-8610#R-0133"
    object: 'whitespace in a prefixed byte string in EDN'
    field: 'no BCP 14 keyword backs this; the force is a definitional equivalence — "In EDN, whitespace is ignored in prefixed byte strings"'
    verb: none
    actor: 'EDN tool implementer'
    locator: "Appendix G.1"
    text: 'In EDN, whitespace is ignored in prefixed byte strings; for instance, the following are equivalent:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0134"
    object: 'an unprefixed single-quoted string in EDN'
    field: 'no BCP 14 keyword backs this; the force is a definition of the notation plus an explicit exception — "Whitespace is included literally, i.e., the previous section does not apply to text-based byte strings"'
    verb: none
    actor: 'EDN tool implementer'
    locator: "Appendix G.2"
    text: 'The escaping rules of JSON strings are applied equivalently for text-based byte strings, e.g., "\" stands for a single backslash and "''" stands for a single quote. Whitespace is included literally, i.e., the previous section does not apply to text-based byte strings.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0135"
    object: 'embedded CBOR in EDN'
    field: 'no BCP 14 keyword backs this; the force is the definition of the << >> notation — "to notate the byte string resulting from encoding the data items and concatenating the result"'
    verb: none
    actor: 'EDN tool implementer'
    locator: "Appendix G.3"
    text: 'Where a byte string is to carry an embedded CBOR-encoded item, or more generally a sequence of zero or more such items, the diagnostic notation for these zero or more CBOR data items, separated by commas, can be enclosed in << and >> to notate the byte string resulting from encoding the data items and concatenating the result.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The notation for the .cbor construct (rfc-8610#R-0071); our test vectors for a bstr-wrapped payload are written in it.'
  - id: "rfc-8610#R-0136"
    object: 'concatenated string notation in EDN'
    field: 'no BCP 14 keyword backs this; the force is a definition plus a restriction — "Text strings and byte strings do not mix within such a concatenation"'
    verb: none
    actor: 'EDN tool implementer'
    locator: "Appendix G.4"
    text: 'Text strings and byte strings do not mix within such a concatenation, except that byte string notation can be used inside a sequence of concatenated text string notation to encode characters that may be better represented in an encoded way.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0137"
    object: 'numeric literals in EDN'
    field: 'no BCP 14 keyword backs this; the force is the definition of the admitted notations — "hexadecimal, octal, and binary numbers in the usual C-language notation (octal with 0o prefix present only)"'
    verb: none
    actor: 'EDN tool implementer'
    locator: "Appendix G.5"
    text: 'In addition to JSON''s decimal numbers, EDN provides hexadecimal, octal, and binary numbers in the usual C-language notation (octal with 0o prefix present only).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0138"
    object: 'comments in EDN'
    field: 'no BCP 14 keyword backs this; the force is the definition of comment syntax and its classification — "Comments are considered whitespace."'
    verb: none
    actor: 'EDN tool implementer'
    locator: "Appendix G.6"
    text: 'In EDN, comments can be included, delimited by slashes ("/"). Any text within and including a pair of slashes is considered a comment.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8610#R-0139"
    object: 'repetition of an ext-value in an RFC 7071 reputon'
    field: 'the all-capitals keyword here belongs to RFC 7071, which RFC 8610 is QUOTING in an appendix it has declared informative; RFC 8610 asserts no obligation of its own'
    verb: 'MUST NOT'
    actor: 'RFC 7071 reputon producer (not a CDDL implementation)'
    locator: "Appendix H"
    text: 'Also, this definition makes it clear that several ext-values are allowed (by definition with different member names); RFC 7071 could be read to forbid the repetition of ext-value ("A specific reputon-element MUST NOT appear more than once" is ambiguous).'
    kind: stated
    testable: 'no'
    testable_reason: 'RFC 8610 quotes the sentence in order to call it ambiguous; it constrains nothing in CDDL and nothing in this library''s scope'
    status: active
    note: 'Carried solely so that extracted_keyword_count reconciles exactly with the source count of 2. NOT an RFC 8610 requirement. Recorded under ''status: rescinded'' would be wrong too - the sentence is live in RFC 7071; it is simply not RFC 8610''s.'
