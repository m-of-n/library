# =====================================================================
# rfc-8610 test vectors -- every example RFC 8610 prints.
#
# Each `cddl:` and `instance:` block is lifted from the cached source by
# line range, by script, never retyped. The only transformation
# is removal of the common left margin (a YAML block scalar does that in
# any case); relative indentation inside a block is the source's.
#
# Source: RFC 8610, cached source sha256
#   3713f2a50e23a2bea0a6147ad6c4433605a00c3d00a868bfa86a42b204997089
# =====================================================================
record: rfc-8610
reviewed_by: ""
vectors:
  - id: 'rfc-8610#V-0001'
    locator: '§2.1 (Figure 1)'
    cddl: |
      person = {
        age: int,
        name: tstr,
        employer: tstr,
      }
    matches: 'A CBOR or JSON map with exactly the three entries age/name/employer, keys as text strings.'
    expect: 'valid'
    notes: 'The document''s first example. "the three entries of the group are written between the curly braces that create the map: here, "age", "name", and "employer" are the names that turn into the map key text strings". No instance is given.'
  - id: 'rfc-8610#V-0002'
    locator: '§2.1 (Figure 2)'
    cddl: |
      pii = (
        age: int,
        name: tstr,
        employer: tstr,
      )
    matches: 'A named GROUP of three entries -- not a type, and not a map. Usable wherever a group is.'
    expect: 'valid'
    notes: '"A group by itself (without creating a map around it) can be placed in (round) parentheses and given a name by using it in a rule". Round parentheses do NOT create a map; §2.1 is explicit that "the groups themselves are neutral as to whether they will be used in a map or an array".'
  - id: 'rfc-8610#V-0003'
    locator: '§2.1 (Figure 3)'
    cddl: |
      person = {
        pii
      }
    matches: 'Identical in meaning to Figure 1: the named group pii is spliced into the map.'
    expect: 'valid'
    notes: 'The source states the equivalence: "This separate, named group definition allows us to rephrase Figure 1 as". Paired with V-0002, which defines pii.'
  - id: 'rfc-8610#V-0004'
    locator: '§2.1 (Figure 4)'
    cddl: |
      person = {(
        age: int,
        name: tstr,
        employer: tstr,
      )}
    matches: 'Identical in meaning to Figure 1 again; the redundant round parentheses are legal.'
    expect: 'valid'
    notes: 'The source calls it "not-so-realistic, but perfectly valid". It exists to show that "the parentheses for groups are optional when there is some other set of brackets present" -- optional, not forbidden.'
  - id: 'rfc-8610#V-0005'
    locator: '§2.1 (Figure 5)'
    cddl: |
      person = {
        age: int,
        name: tstr,
        employer: tstr,
      }

      dog = {
        age: int,
        name: tstr,
        leash-length: float,
      }
    matches: 'Two maps with two entries duplicated between them; the copy/paste the next example removes.'
    expect: 'valid'
    notes: 'Presented as the anti-pattern: "instead of writing specifications in copy/paste style, such as in Figure 5, one can factor out the common subgroup".'
  - id: 'rfc-8610#V-0006'
    locator: '§2.1 (Figure 6)'
    cddl: |
      person = {
        identity,
        employer: tstr,
      }

      dog = {
        identity,
        leash-length: float,
      }

      identity = (
        age: int,
        name: tstr,
      )
    matches: 'The same two maps as V-0005, with age/name factored into the named group identity.'
    expect: 'valid'
    notes: '"the lists inside the braces in the above definitions constitute (anonymous) groups, while "identity" is a named group, which can then be included as part of other groups (anonymous as in the example, or themselves named)."'
  - id: 'rfc-8610#V-0007'
    locator: '§2.2.2'
    cddl: |
      attire = "bow tie" / "necktie" / "Internet attire"
      protocol = 6 / 17
    matches: 'attire: one of three text strings. protocol: the integer 6 or the integer 17.'
    expect: 'valid'
    notes: '"Choices of values can be used to express enumerations". Note that 6 and 17 are integer literals, so by §2.2.1 the floating-point values 6.0 and 17.0 do NOT match protocol.'
  - id: 'rfc-8610#V-0008'
    locator: '§2.2.2'
    cddl: |
      address = { delivery }

      delivery = (
      street: tstr, ? number: uint, city //
      po-box: uint, city //
      per-pickup: true )

      city = (
      name: tstr, zip-code: uint
      )
    matches: 'A map matching one of three group alternatives: street+optional number+city, or po-box+city, or per-pickup: true.'
    expect: 'valid'
    notes: 'The document''s point is the binding strength: "the "//" operator binds much more weakly than the other CDDL operators, so each line within "delivery" in the following example is its own alternative in the group choice". The city group is spliced into two of the three alternatives.'
  - id: 'rfc-8610#V-0009'
    locator: '§2.2.2'
    cddl: |
      attire /= "swimwear"
    matches: 'Extends the attire type choice of V-0007 with a fourth value.'
    expect: 'valid'
    notes: '"additional alternatives can be added to a rule later in separate rules by using "/=" and "//=", respectively, instead of "="." Appendix C adds that the choice "is populated in the order the rules are given", which matters under PEG semantics.'
  - id: 'rfc-8610#V-0010'
    locator: '§2.2.2'
    cddl: |
      delivery //= (
      lat: float, long: float, drone-type: tstr
      )
    matches: 'Extends the delivery GROUP choice of V-0008 with a fourth alternative.'
    expect: 'valid'
    notes: 'Group choices extend with "//=", type choices with "/=". The source also notes: "It is not an error if a name is first used with a "/=" or "//=" (there is no need to "create it" with "=")."'
  - id: 'rfc-8610#V-0011'
    locator: '§2.2.2.1'
    cddl: |
      device-address = byte
      max-byte = 255
      byte = 0..max-byte ; inclusive range
      first-non-byte = 256
      byte1 = 0...first-non-byte ; byte1 is equivalent to byte
    matches: 'byte: the integers 0..255 inclusive. byte1: 0..256 exclusive of 256, i.e. the same set.'
    expect: 'valid'
    notes: 'The source asserts the equivalence in its own comment: "byte1 is equivalent to byte". ".." includes both bounds; "..." includes the lower and excludes the upper. Note that a range bound may be a NAME (max-byte, first-non-byte), not only a literal.'
  - id: 'rfc-8610#V-0012'
    locator: '§2.2.2.1'
    cddl: |
      int-range = 0..10 ; only integers match
      float-range = 0.0..10.0 ; only floats match

      numeric-range = int-range / float-range
    matches: 'int-range: the integers 0..10. float-range: the floats 0.0..10.0. numeric-range: either.'
    expect: 'valid'
    notes: 'Source lines 662-663 and 666. The two lines between them, 664-665, are the NOT DEFINED cases and are held separately as the two vectors that follow. The source gives this type choice as the "(clumsily)" available workaround: "If both are needed in a type, a type choice between the two kinds of ranges can be (clumsily) used".'
  - id: 'rfc-8610#V-0013'
    locator: '§2.2.2.1'
    cddl: |
      BAD-range1 = 0..10.0 ; NOT DEFINED
    matches: 'Nothing. A range with an integer lower bound and a floating-point upper bound is not a defined type.'
    expect: 'invalid'
    violates: '§2.2.2.1: ranges are defined only between two integers or two floating-point values.'
    notes: 'THE CANONICAL DEMONSTRATION that the ABNF accepts strings the type system rejects: `type1 = type2 [S (rangeop / ctlop) S type2]` parses this line without complaint. The source marks it in its own comment, "; NOT DEFINED", and states the rule: "CDDL currently only allows ranges between integers (matching integer values) or between floating-point values (matching floating-point values)." It does not say what a tool should do about it.'
  - id: 'rfc-8610#V-0014'
    locator: '§2.2.2.1'
    cddl: |
      BAD-range2 = 0.0..10 ; NOT DEFINED
    matches: 'Nothing. The mirror image of the previous vector: float lower bound, integer upper bound.'
    expect: 'invalid'
    violates: '§2.2.2.1: ranges are defined only between two integers or two floating-point values.'
    notes: 'The source''s own comment: "; NOT DEFINED". Held separately from BAD-range1 because it is a separate line and a separate direction of the same mistake.'
  - id: 'rfc-8610#V-0015'
    locator: '§2.2.2.1'
    cddl: |
      min..max
    matches: 'A single NAME, not a range expression -- the three characters "min..max" are one identifier.'
    expect: 'valid'
    notes: 'A lexical trap, and valid CDDL meaning something other than it appears to: "Note that the dot is a valid name continuation character in CDDL, so min..max is not a range expression but a single name." It parses as `id` (`id = EALPHA *(*("-" / ".") (EALPHA / DIGIT))`), so it is a reference to an undefined rule, not a range.'
  - id: 'rfc-8610#V-0016'
    locator: '§2.2.2.1'
    cddl: |
      min .. max
    matches: 'The inclusive range between the values of the names min and max.'
    expect: 'valid'
    notes: 'The fix for the previous vector, in the source''s words: "When using a name as the left-hand side of a range operator, use spacing as in min .. max to separate off the range operator." The grammar carries the same warning as a comment on type1: "; space may be needed before the operator if type2 ends in a name".'
  - id: 'rfc-8610#V-0017'
    locator: '§2.2.2.2'
    cddl: |
      terminal-color = &basecolors
      basecolors = (
        black: 0,  red: 1,  green: 2,  yellow: 3,
        blue: 4,  magenta: 5,  cyan: 6,  white: 7,
      )
      extended-color = &(
        basecolors,
        orange: 8,  pink: 9,  purple: 10,  brown: 11,
      )
    matches: 'terminal-color: the integers 0..7. extended-color: 0..11. Both built from groups by "&".'
    expect: 'valid'
    notes: '"Instead of naming each of these integers and then accumulating them into a choice, CDDL allows building a choice from a group by prefixing it with an "&" character". The member names are documentation only: "the member names have only documentary value (in particular, they might be used by a tool when displaying integers that are taken from that choice)". Note extended-color splices basecolors and adds four more, so the two enumerations stay in step.'
  - id: 'rfc-8610#V-0018'
    locator: '§2.2.3'
    cddl: |
      my_breakfast = #6.55799(breakfast)   ; cbor-any is too general!
      breakfast = cereal / porridge
      cereal = #6.998(tstr)
      porridge = #6.999([liquid, solid])
      liquid = milk / water
      milk = 0
      water = 1
      solid = tstr
    matches: 'A data item tagged 55799 whose content is either tag 998 of a text string or tag 999 of a two-element array.'
    expect: 'valid'
    notes: 'Representation types used outside the prelude, with the source''s own comment "; cbor-any is too general!". Tags 998 and 999 are not registered; the example exists to show that "a specification could start by making use of an existing tag in a more specific way or could define a new tag not defined in the prelude".'
  - id: 'rfc-8610#V-0019'
    locator: '§3.1'
    cddl: |
      ; This is a comment
      person = { g }

      g = (
        "name": tstr,
        age: int,  ; "age" is a bareword
      )
    matches: 'A map with two entries: text key "name" to a text string, and bareword key age to an int.'
    expect: 'valid'
    notes: 'The example for comments and barewords. Its own comment labels the distinction: "; "age" is a bareword". The two member keys are written differently ("name" quoted, age bare) but both produce text string keys -- §3.1: "Rule names (types or groups) do not appear in the actual CBOR encoding, but names used as "barewords" in member keys do."'
  - id: 'rfc-8610#V-0020'
    locator: '§3.2'
    cddl: |
      apartment = {
        kitchen: size,
        * bedroom: size,
      }
      size = float ; in m2
    matches: 'A map with a mandatory kitchen entry and, nominally, any number of bedroom entries.'
    expect: 'valid'
    notes: 'Valid CDDL that describes something the target data model cannot carry: "The previous specification does not mean that CBOR is changed to allow using the key "bedroom" more than once." Held together with the vector that follows, which is the collapse the source states.'
  - id: 'rfc-8610#V-0021'
    locator: '§3.2'
    cddl: |
      ? bedroom: size,
    matches: 'What the `* bedroom: size` line of the previous vector effectively means in a map.'
    expect: 'valid'
    notes: 'The source''s own reduction: "due to the restrictions imposed by the data model, the third line pretty much turns into: ? bedroom: size,". "pretty much turns into" is as precise as the document gets -- no conformance rule is stated, and the trailing comma is the source''s.'
  - id: 'rfc-8610#V-0022'
    locator: '§3.4'
    cddl: |
      unlimited-people = [* person]
      one-or-two-people = [1*2 person]
      at-least-two-people = [2* person]
      person = (
          name: tstr,
          age: uint,
      )
    matches: 'unlimited-people: zero or more name/age pairs flattened into one array. one-or-two-people: 1 or 2. at-least-two-people: 2 or more.'
    expect: 'valid'
    notes: '"The group "person" is defined in such a way that repeating it in the array each time generates alternating names and ages" -- the group is spliced, not nested, so the array holds 2n elements, not n arrays. The four instances that follow are the source''s own.'
  - id: 'rfc-8610#V-0023'
    locator: '§3.4'
    cddl: |
      unlimited-people = [* person]

      person = (
          name: tstr,
          age: uint,
      )
    instance: |
      ["roundlet", 1047, "psychurgy", 2204, "extrarhythmical", 2231]
    matches: 'An instance of unlimited-people: three name/age pairs.'
    expect: 'valid'
    notes: 'One of the "four valid values for a data item of type "unlimited-people"" that the source prints. The cddl field holds source lines 983 and 986-989 (the unlimited-people rule and the person group); lines 984-985 define the other two array types and are omitted as irrelevant to this instance.'
  - id: 'rfc-8610#V-0024'
    locator: '§3.4'
    cddl: |
      unlimited-people = [* person]

      person = (
          name: tstr,
          age: uint,
      )
    instance: |
      []
    matches: 'An instance of unlimited-people: the empty array.'
    expect: 'valid'
    notes: 'One of the "four valid values for a data item of type "unlimited-people"" that the source prints. The cddl field holds source lines 983 and 986-989 (the unlimited-people rule and the person group); lines 984-985 define the other two array types and are omitted as irrelevant to this instance.'
  - id: 'rfc-8610#V-0025'
    locator: '§3.4'
    cddl: |
      unlimited-people = [* person]

      person = (
          name: tstr,
          age: uint,
      )
    instance: |
      ["aluminize", 212, "climograph", 4124]
    matches: 'An instance of unlimited-people: two name/age pairs.'
    expect: 'valid'
    notes: 'One of the "four valid values for a data item of type "unlimited-people"" that the source prints. The cddl field holds source lines 983 and 986-989 (the unlimited-people rule and the person group); lines 984-985 define the other two array types and are omitted as irrelevant to this instance.'
  - id: 'rfc-8610#V-0026'
    locator: '§3.4'
    cddl: |
      unlimited-people = [* person]

      person = (
          name: tstr,
          age: uint,
      )
    instance: |
      ["penintime", 1513, "endocarditis", 4084, "impermeator", 1669,
       "coextension", 865]
    matches: 'An instance of unlimited-people: four name/age pairs.'
    expect: 'valid'
    notes: 'One of the "four valid values for a data item of type "unlimited-people"" that the source prints. The cddl field holds source lines 983 and 986-989 (the unlimited-people rule and the person group); lines 984-985 define the other two array types and are omitted as irrelevant to this instance.'
  - id: 'rfc-8610#V-0027'
    locator: '§3.5.1'
    cddl: |
      Geography = [
        city           : tstr,
        gpsCoordinates : GpsCoordinates,
      ]

      GpsCoordinates = {
        longitude      : uint,            ; degrees, scaled by 10^7
        latitude       : uint,            ; degrees, scaled by 10^7
      }
    matches: 'Geography: a 2-element ARRAY (the member keys are ignored). GpsCoordinates: a map with two uint entries.'
    expect: 'valid'
    notes: 'The example that makes the array/map asymmetry concrete: "the Geography record is encoded using a CBOR array with two members (the keys for the group entries are ignored), whereas the GpsCoordinates structure is encoded as a CBOR map with two key/value pairs." The aligned colons and the "; degrees, scaled by 10^7" comments are the source''s.'
  - id: 'rfc-8610#V-0028'
    locator: '§3.5.1'
    cddl: |
      located-samples = {
        sample-point: int,
        samples: [+ float],
      }
    matches: 'A map with bareword keys "sample-point" (int) and "samples" (array of one or more floats).'
    expect: 'valid'
    notes: '"This is actually a complete example: an identifier that is followed by a colon can be directly used as the text string for a member key (we speak of a "bareword" member key), as can a double-quoted string or a number."'
  - id: 'rfc-8610#V-0029'
    locator: '§3.5.1'
    cddl: |
      located-samples = {
        "sample-point" => int,
        "samples" => [+ float],
      }
    matches: 'The same map as the previous vector, written with explicit text string keys and double arrows.'
    expect: 'valid'
    notes: 'The source gives this as "another form for this example". NOT quite equivalent in fact: by §3.5.4 the ":" shortcut implies a cut and "=>" without "^" does not, so the two forms differ in how a non-matching value is treated. The document does not flag that here; it says only "See Section 3.5.4 below for how the colon (":") shortcut described here also adds some implied semantics." OURS: the two forms are equivalent only for a map with no later wildcard entry.'
  - id: 'rfc-8610#V-0030'
    locator: '§3.5.1'
    cddl: |
      located-samples = {
        sample-point: int,
        samples: [+ float],
        * equipment-type => equipment-tolerances,
      }
      equipment-type = [name: tstr, manufacturer: tstr]
      equipment-tolerances = [+ [float, float]]
    matches: 'A map with two fixed entries plus any number of entries keyed by a 2-element array and valued by an array of float pairs.'
    expect: 'valid'
    notes: '"A better way to demonstrate the use of the double arrow" -- the double arrow is necessary here because the key type is a named ARRAY type, and a bareword followed by a colon would become a text string instead: "the double arrow is necessary if a type is named by an identifier (which, when followed by a colon, would be interpreted as a "bareword" and turned into a text string)."'
  - id: 'rfc-8610#V-0031'
    locator: '§3.5.1'
    cddl: |
      PersonalData = {
        ? displayName: tstr,
        NameComponents,
        ? age: uint,
      }

      NameComponents = (
        ? firstName: tstr,
        ? familyName: tstr,
      )
    matches: 'A map in which every one of the four possible entries is optional, including those spliced in from NameComponents.'
    expect: 'valid'
    notes: '"Note that the group definition for NameComponents does not generate another map; instead, all four keys are directly in the struct built by PersonalData. In this example, all key/value pairs are optional from the perspective of CDDL. With no occurrence indicator, an entry is mandatory." The empty map therefore matches.'
  - id: 'rfc-8610#V-0032'
    locator: '§3.5.1 (Figure 7)'
    cddl: |
      PersonalData = {
        ? displayName: tstr,
        NameComponents,
        ? age: uint,
        * tstr => any
      }

      NameComponents = (
        ? firstName: tstr,
        ? familyName: tstr,
      )
    instance: |
      {"familyName": "agust", "antiforeignism": "pretzel",
       "springbuck": "illuminatingly", "exuviae": "ephemeris",
       "kilometrage": "frogfish"}
    matches: 'The previous vector plus `* tstr => any`: any number of further text-keyed entries of any value type.'
    expect: 'valid'
    notes: 'The extensibility idiom: "If the addition of more entries not specified by the current specification is desired, one can add this possibility explicitly". Figure 7 is the same specification that §3.5.4 then attacks for admitting a wrongly-typed optional-key, and that §3.9 rewrites with a group socket.'
  - id: 'rfc-8610#V-0033'
    locator: '§3.5.1 (Figure 7)'
    cddl: |
      PersonalData = {
        ? displayName: tstr,
        NameComponents,
        ? age: uint,
        * tstr => any
      }

      NameComponents = (
        ? firstName: tstr,
        ? familyName: tstr,
      )
    instance: |
      {"familyName": "agust", "antiforeignism": "pretzel",
       "springbuck": "illuminatingly", "exuviae": "ephemeris",
       "kilometrage": "frogfish"}
    matches: 'An instance of Figure 7 generated by the reference tool: one known key, four extension keys.'
    expect: 'valid'
    notes: 'The source: "The CDDL tool described in Appendix F generated the following as one acceptable instance for this specification". Note what it demonstrates in passing -- displayName, firstName and age are all absent, and four keys not in the specification are present, all matched by the `* tstr => any` wildcard.'
  - id: 'rfc-8610#V-0034'
    locator: '§3.5.2'
    cddl: |
      square-roots = {* x => y}
      x = int
      y = float
    matches: 'A table: a map of any size from integer keys to floating-point values.'
    expect: 'valid'
    notes: '"A table can be specified by defining a map with entries where the key type allows more than just a single value". The source adds that either side may be relaxed to the prelude name "any": "If the specification does not need to restrict one of x or y (i.e., the application is free to choose per entry), it can be replaced by the predefined name "any"."'
  - id: 'rfc-8610#V-0035'
    locator: '§3.5.2'
    cddl: |
      tostring = {* mynumber => tstr}
      mynumber = int / float
    matches: 'A table from integers OR floats to text strings.'
    expect: 'valid'
    notes: '"the following could be used as a conversion table converting from an integer or float to a string". The key type is a type choice, which is what makes this a table rather than a struct.'
  - id: 'rfc-8610#V-0036'
    locator: '§3.5.3'
    cddl: |
      labeled-values = {
        ? fritz: number,
        * label => value
      }
      label = text
      value = number
    matches: 'A map with an optional fritz/number entry and any number of text/number entries.'
    expect: 'valid'
    notes: 'The well-behaved case for map matching: "if any member with the key "fritz" is present, this will be picked by the first entry of the group; all remaining text/number members will be picked by the second entry (and if anything remains unpicked, the map does not match)."'
  - id: 'rfc-8610#V-0037'
    locator: '§3.5.3'
    cddl: |
      do-not-do-this = {
        int => int,
        int => 6,
      }
    matches: 'Indeterminate. Against {3: 5, 4: 6} the first entry may pick either pair, and only one of the two choices lets the second entry match.'
    expect: 'indeterminate'
    notes: 'THE ONE VECTOR IN THIS FILE WHOSE OUTCOME THE SOURCE REFUSES TO DECIDE, and the reason `expect` carries a third value here. "the first group entry might pick off the "3: 5", leaving "4: 6" for matching the second one. Or it might pick off "4: 6", leaving nothing for the second entry." The source does not resolve it: "At the time of writing, CDDL tools cannot detect such cases automatically, and for the present version of the CDDL specification, the specification writer is simply urged to not write pathologically non-deterministic specifications." Forcing this into valid or invalid would assert something RFC 8610 does not. The instance below is quoted from the running prose at source line 1275.'
  - id: 'rfc-8610#V-0038'
    locator: '§3.5.4'
    cddl: |
      extensible-map-example = {
        ? "optional-key" => int,
        * tstr => any
      }
    matches: 'A map with an optional int-valued "optional-key" plus any number of text-keyed entries of any type.'
    expect: 'valid'
    notes: 'Stated as a problem, not a pattern: "The extensibility idiom discussed above for structs has one problem". Compare the cut version two vectors below -- the CDDL differs by one character.'
  - id: 'rfc-8610#V-0039'
    locator: '§3.5.4'
    cddl: |
      extensible-map-example = {
        ? "optional-key" => int,
        * tstr => any
      }
    instance: |
      { "optional-key": "nonsense" }
    matches: 'The instance MATCHES, which is the defect the section is about: the wildcard entry rescues a wrongly-typed optional-key.'
    expect: 'valid'
    notes: '"Unfortunately, the data item { "optional-key": "nonsense" } does match this specification: while the first entry of the group does not match, the second one (the wildcard) does. This may very well be desirable (e.g., if a future extension is to be allowed to extend the type of "optional-key"), but in many cases it isn''t." Paired with the vector two below, which is the same instance against the same map with a cut: the pair is the whole argument for cuts.'
  - id: 'rfc-8610#V-0040'
    locator: '§3.5.4'
    cddl: |
      extensible-map-example = {
        ? "optional-key" ^ => int,
        * tstr => any
      }
    matches: 'The same map with a cut on the optional-key entry: a member whose key is "optional-key" must have an int value or the whole map fails.'
    expect: 'valid'
    notes: '"In anticipation of a more general potential feature called "cuts", CDDL allows inserting a cut "^" into the definition of the map entry." The cut sits between the key type and the "=>"; `memberkey = type1 S ["^" S] "=>"` admits it only on the arrow form.'
  - id: 'rfc-8610#V-0041'
    locator: '§3.5.4'
    cddl: |
      extensible-map-example = {
        ? "optional-key" ^ => int,
        * tstr => any
      }
    instance: |
      { "optional-key": "nonsense" }
    matches: 'The instance does NOT match: the cut locks in the key and the value is a text string, not an int.'
    expect: 'invalid'
    violates: '§3.5.4: a cut locks in the member whose key matched, so the entry''s value type then applies absolutely.'
    notes: 'The source: "when a group entry would pick a key/value pair based on just a matching key, it "locks in" the pick -- this rule applies, independently of whether the value matches as well, so when it does not, the entire map fails to match. In summary, the example above no longer matches the specification as modified with the cut." Same instance bytes as the earlier vector against the cut-free map, where it DOES match; match vectors on id, never on the instance.'
  - id: 'rfc-8610#V-0042'
    locator: '§3.5.4'
    cddl: |
      extensible-map-example = {
        ? "optional-key": int,
        * tstr => any
      }
    matches: 'Identical in meaning to the explicit-cut version: ":" carries the cut.'
    expect: 'valid'
    notes: '"Since the desire for this kind of exclusive matching is so frequent, the ":" shortcut is actually defined to include the cut semantics. So, the preceding example (including the cut) can be written more simply as". A consequence the source does not spell out, OURS: there is no way to write a colon WITHOUT a cut.'
  - id: 'rfc-8610#V-0043'
    locator: '§3.5.4'
    cddl: |
      extensible-map-example = {
        ? optional-key: int,
        * tstr => any
      }
    matches: 'Identical again, with the quoted key replaced by a bareword.'
    expect: 'valid'
    notes: '"or even shorter, using a bareword for the key". Three spellings of one specification: `"optional-key" ^ =>`, `"optional-key":` and `optional-key:`.'
  - id: 'rfc-8610#V-0044'
    locator: '§3.6'
    cddl: |
      biguint = #6.2(bstr)
    matches: 'A byte string tagged 2 -- an unsigned bignum.'
    expect: 'valid'
    notes: 'Quoted from the prelude to show how a tag type is written: "the following line from the CDDL prelude (Appendix D) defines "biguint" as a type name for an unsigned bignum N". The same line appears verbatim in the prelude at source line 2890 and again in Appendix E at line 3063.'
  - id: 'rfc-8610#V-0045'
    locator: '§3.6'
    cddl: |
      buuid = #6.37(bstr)
    matches: 'A byte string tagged 37 -- a binary UUID.'
    expect: 'valid'
    notes: 'A tag registered after RFC 7049 and therefore NOT in the fixed prelude: "Additional tags registered since [RFC7049] was written need to be added to a CDDL specification as needed; e.g., a binary Universally Unique Identifier (UUID) tag could be referenced as "buuid" in a specification after defining".'
  - id: 'rfc-8610#V-0046'
    locator: '§3.6'
    cddl: |
      my_uri = #6.32(tstr) / tstr
    matches: 'Either a text string tagged 32 or a bare text string.'
    expect: 'valid'
    notes: '"In the following example, usage of tag 32 for URIs is optional." A type choice between a tagged and an untagged form is how CDDL expresses an optional tag; there is no separate syntax for it.'
  - id: 'rfc-8610#V-0047'
    locator: '§3.7'
    cddl: |
      basic-header-group = (
        field1: int,
        field2: text,
      )

      basic-header = [ basic-header-group ]

      advanced-header = [
        basic-header-group,
        field3: bytes,
        field4: number, ; as in the tagged type "time"
      ]
    matches: 'basic-header: a 2-element array. advanced-header: a 4-element array repeating the first two.'
    expect: 'valid'
    notes: 'The long way round, before unwrapping: "an application might want to define a basic header and an advanced header. Without unwrapping, this might be done as follows". The comment "; as in the tagged type "time"" is the source''s and foreshadows the ~time in the next vector.'
  - id: 'rfc-8610#V-0048'
    locator: '§3.7'
    cddl: |
      basic-header = [
        field1: int,
        field2: text,
      ]

      advanced-header = [
        ~basic-header,
        field3: bytes,
        field4: ~time,
      ]
    matches: 'The same two array types, with ~ splicing basic-header''s group and time''s tagged content.'
    expect: 'valid'
    notes: '"Unwrapping simplifies this to". The source''s warning about omitting the first "~": "leaving out the first unwrap operator in the latter example would lead to nesting the basic-header in its own array inside the advanced-header, while, with the unwrapped basic-header, the definition of the group inside basic-header is essentially repeated inside advanced-header, leading to a single array." `~time` unwraps the prelude''s `time = #6.1(number)` to `number`, which is why the previous vector could write `field4: number`.'
  - id: 'rfc-8610#V-0049'
    locator: '§3.8.1 (Figure 8)'
    cddl: |
      full-address = [[+ label], ip4, ip6]
      ip4 = bstr .size 4
      ip6 = bstr .size 16
      label = bstr .size (1..63)
    matches: 'An array of [array of 1+ labels of 1..63 bytes, a 4-byte string, a 16-byte string].'
    expect: 'valid'
    notes: '"Figure 8 shows example usage for byte strings." Note the parenthesised range as a controller: `bstr .size (1..63)`. §3.8 warns that "target or controller might need to be parenthesized"; here it does, because `..` and `.size` are both at the grammar''s single type1 operator slot.'
  - id: 'rfc-8610#V-0050'
    locator: '§3.8.1 (Figure 9)'
    cddl: |
      audio_sample = uint .size 3 ; 24-bit, equivalent to 0...16777216
    matches: 'The unsigned integers 0 through 16777215 -- 24-bit values.'
    expect: 'valid'
    notes: 'The equivalence is the source''s, in the rule''s own comment "; 24-bit, equivalent to 0...16777216" and in the prose: ""uint .size N" is equivalent to "0...BYTES_N", where BYTES_N == 256**N". 256**3 == 16777216, and "..." excludes the upper bound. VERIFIED BY US: the arithmetic checks out. The source also insists this is not an encoding constraint: "a number that fits into fewer bytes can still be represented in that form, and an inefficient implementation could use a longer form".'
  - id: 'rfc-8610#V-0051'
    locator: '§3.8.2 (Figure 10)'
    cddl: |
      tcpflagbytes = bstr .bits flags
      flags = &(
        fin: 8,
        syn: 9,
        rst: 10,
        psh: 11,
        ack: 12,
        urg: 13,
        ece: 14,
        cwr: 15,
        ns: 0,
      ) / (4..7) ; data offset bits

      rwxbits = uint .bits rwx
      rwx = &(r: 2, w: 1, x: 0)
    matches: 'tcpflagbytes: a byte string in which only bits 0 and 4..15 may be set. rwxbits: a uint in which only bits 0, 1 and 2 may be set.'
    expect: 'valid'
    notes: 'Note the controller: a type choice between a "&"-enumeration and the range (4..7) with the source''s comment "; data offset bits". OURS, by applying the section''s own bit rule: the permitted set is {0} union {4,5,6,7} union {8..15}; bits 1, 2 and 3 may never be set.'
  - id: 'rfc-8610#V-0052'
    locator: '§3.8.2'
    cddl: |
      tcpflagbytes = bstr .bits flags
      flags = &(
        fin: 8,
        syn: 9,
        rst: 10,
        psh: 11,
        ack: 12,
        urg: 13,
        ece: 14,
        cwr: 15,
        ns: 0,
      ) / (4..7) ; data offset bits
    instance: |
      h'906d' h'01fc' h'8145' h'01b7' h'013d' h'409f' h'018e' h'c05f'
      h'01fa' h'01fe'
    matches: 'Ten instances of tcpflagbytes generated by the reference tool, all valid.'
    expect: 'valid'
    notes: 'The source: "The CDDL tool described in Appendix F generates the following ten example instances for "tcpflagbytes"". CHECKED BY US against the section''s own bit rule `(str[n >> 3] & (1 << (n & 7))) != 0`: all ten set only bits in {0, 4..15}; none sets bit 1, 2 or 3. Held as one vector because the source prints them as one list; the ten hex values are on source lines 1557-1558.'
  - id: 'rfc-8610#V-0053'
    locator: '§3.8.2'
    cddl: |
      tcpflagbytes = bstr .bits flags
      flags = &(
        fin: 8,
        syn: 9,
        rst: 10,
        psh: 11,
        ack: 12,
        urg: 13,
        ece: 14,
        cwr: 15,
        ns: 0,
      ) / (4..7) ; data offset bits
    instance: 'h'''''
    matches: 'A further valid all-clear instance of tcpflagbytes: h''''. No bit is set, and no size is required.'
    expect: 'valid'
    notes: 'From the source''s own correction of its ten generated instances: "These examples do not illustrate that the above CDDL specification does not explicitly specify a size of two bytes: a valid all-clear instance of flag bytes could be "h''''" or "h''00''" or even "h''000000''" as well." The instance value is quoted from running prose (source lines 1561-1563), so it carries the document''s typewriter double quotes there and not here. THE POINT: .bits constrains which bits may be set, never the length.'
  - id: 'rfc-8610#V-0054'
    locator: '§3.8.2'
    cddl: |
      tcpflagbytes = bstr .bits flags
      flags = &(
        fin: 8,
        syn: 9,
        rst: 10,
        psh: 11,
        ack: 12,
        urg: 13,
        ece: 14,
        cwr: 15,
        ns: 0,
      ) / (4..7) ; data offset bits
    instance: 'h''00'''
    matches: 'A further valid all-clear instance of tcpflagbytes: h''00''. No bit is set, and no size is required.'
    expect: 'valid'
    notes: 'From the source''s own correction of its ten generated instances: "These examples do not illustrate that the above CDDL specification does not explicitly specify a size of two bytes: a valid all-clear instance of flag bytes could be "h''''" or "h''00''" or even "h''000000''" as well." The instance value is quoted from running prose (source lines 1561-1563), so it carries the document''s typewriter double quotes there and not here. THE POINT: .bits constrains which bits may be set, never the length.'
  - id: 'rfc-8610#V-0055'
    locator: '§3.8.2'
    cddl: |
      tcpflagbytes = bstr .bits flags
      flags = &(
        fin: 8,
        syn: 9,
        rst: 10,
        psh: 11,
        ack: 12,
        urg: 13,
        ece: 14,
        cwr: 15,
        ns: 0,
      ) / (4..7) ; data offset bits
    instance: 'h''000000'''
    matches: 'A further valid all-clear instance of tcpflagbytes: h''000000''. No bit is set, and no size is required.'
    expect: 'valid'
    notes: 'From the source''s own correction of its ten generated instances: "These examples do not illustrate that the above CDDL specification does not explicitly specify a size of two bytes: a valid all-clear instance of flag bytes could be "h''''" or "h''00''" or even "h''000000''" as well." The instance value is quoted from running prose (source lines 1561-1563), so it carries the document''s typewriter double quotes there and not here. THE POINT: .bits constrains which bits may be set, never the length.'
  - id: 'rfc-8610#V-0056'
    locator: '§3.8.3 (Figure 11)'
    cddl: |
      nai = tstr .regexp "[A-Za-z0-9]+@[A-Za-z0-9]+(\\.[A-Za-z0-9]+)+"
    matches: 'A text string matching the XSD regular expression for a network access identifier.'
    expect: 'valid'
    notes: 'The doubled backslash is the source''s: inside a CDDL text string `\\.` unescapes to `\.`, the XSD escape for a literal dot. §3.8.3.1 names this: "there is one level of string escaping before the XSD escaping rules are applied".'
  - id: 'rfc-8610#V-0057'
    locator: '§3.8.3'
    cddl: |
      nai = tstr .regexp "[A-Za-z0-9]+@[A-Za-z0-9]+(\\.[A-Za-z0-9]+)+"
    instance: |
      "N1@CH57HF.4Znqe0.dYJRN.igjf"
    matches: 'An instance matching Figure 11''s regular expression.'
    expect: 'valid'
    notes: 'The source gives it as "An example matching this regular expression". NOT CHECKED BY US against an XSD engine; it is recorded as the source states it.'
  - id: 'rfc-8610#V-0058'
    locator: '§3.8.3.1'
    cddl: |
      o  No direct support for case insensitivity.  While case
         insensitivity has gone mostly out of fashion in protocol design,
         it is sometimes needed and then needs to be expressed manually as
         in "[Cc][Aa][Ss][Ee]".
    matches: 'Not a CDDL example: an XSD regular expression fragment that matches the word "case" case-insensitively.'
    expect: 'valid'
    notes: 'Held because it is the document''s only guidance on a real gap: "No direct support for case insensitivity. While case insensitivity has gone mostly out of fashion in protocol design, it is sometimes needed and then needs to be expressed manually as in "[Cc][Aa][Ss][Ee]"." The cddl field is the bulleted prose verbatim, not a rule. The document''s convention, stated in §1.2: CDDL text in running prose is printed in double quotes. The quotes below are the source''s own bytes, not part of the CDDL.'
  - id: 'rfc-8610#V-0059'
    locator: '§3.8.4'
    cddl: |
      "bytes .cbor type1"
    matches: 'A byte string whose content, decoded as CBOR, matches type1.'
    expect: 'valid'
    notes: 'Not a rule but the document''s own illustration of the .cbor syntax. The document''s convention, stated in §1.2: CDDL text in running prose is printed in double quotes. The quotes below are the source''s own bytes, not part of the CDDL. The source leaves two things open: what happens if the bytes are not well-formed CBOR, and whether trailing bytes are permitted.'
  - id: 'rfc-8610#V-0060'
    locator: '§3.8.4'
    cddl: |
      "bytes .cborseq type2"
    matches: 'A byte string holding a CBOR SEQUENCE whose items, taken as an array, match type2.'
    expect: 'valid'
    notes: 'The document''s convention, stated in §1.2: CDDL text in running prose is printed in double quotes. The quotes below are the source''s own bytes, not part of the CDDL. The source supplies an implementation hint rather than a definition: "(The conversion of the encoded sequence to an array can be effected, for instance, by wrapping the byte string between the two bytes 0x9f and 0xff and decoding the wrapped byte string as a CBOR-encoded data item.)" -- that is, an indefinite-length array head and a break.'
  - id: 'rfc-8610#V-0061'
    locator: '§3.8.5'
    cddl: |
      "type1 .and type2"
    matches: 'The intersection of type1 and type2.'
    expect: 'valid'
    notes: 'The document''s convention, stated in §1.2: CDDL text in running prose is printed in double quotes. The quotes below are the source''s own bytes, not part of the CDDL. "(Formally, the resulting type is the intersection of the two types given.)"'
  - id: 'rfc-8610#V-0062'
    locator: '§3.8.5'
    cddl: |
      "type1 .within type2"
    matches: 'The intersection of type1 and type2 -- identical in effect to .and.'
    expect: 'valid'
    notes: 'The document''s convention, stated in §1.2: CDDL text in running prose is printed in double quotes. The quotes below are the source''s own bytes, not part of the CDDL. "While both forms have the identical formal semantics (intersection), the intention of the ".within" form is that the right-hand side gives guidance to the types allowed on the left-hand side". The difference is entirely in what a tool MAY warn about: "a tool might flag an error if type1 allows data items that are not allowed by type2."'
  - id: 'rfc-8610#V-0063'
    locator: '§3.8.5'
    cddl: |
      message = $message .within message-structure
      message-structure = [message_type, *message_option]
      message_type = 0..255
      message_option = any

      $message /= [3, dough: text, topping: [* text]]
      $message /= [4, noodles: text, sauce: text, parmesan: bool]

    matches: 'A message: an array whose first element is 0..255 followed by any number of elements, narrowed to one of the two plugged-in alternatives.'
    expect: 'valid'
    notes: 'The worked socket + .within example, and the source''s only example of a TYPE socket being plugged ("$message /=" twice). The two plugs are arrays with positional member names (dough, topping, noodles, sauce, parmesan) that are documentation only, since in an array context "the name is annotation only" (§2.1).'
  - id: 'rfc-8610#V-0064'
    locator: '§3.8.6'
    cddl: |
      speed = number .ge 0  ; unit: m/s
    matches: 'A number greater than or equal to 0; the source''s comment gives the unit.'
    expect: 'valid'
    notes: '.ge is one of the four controls "defined only for numeric types, as these have a natural ordering relationship". The target here is the prelude''s `number = int / float`, so both integer and floating-point zero and above match.'
  - id: 'rfc-8610#V-0065'
    locator: '§3.8.6'
    cddl: |
      timer = {
        time: uint,
        ? displayed-step: (number .gt 0) .default 1
      }
    matches: 'A map with a mandatory uint time and an optional displayed-step that is a number greater than 0 and never equal to 1.'
    expect: 'valid'
    notes: 'The .default example, and incidentally the source''s own proof that controls do not chain: the left-hand side has to be parenthesised, `(number .gt 0) .default 1`, because the grammar allows at most one control per type1. The default VALUE is not expressible in the data: ".default" only excludes it from the wire -- "the implied .ne control is there to prevent this value from being sent over the wire".'
  - id: 'rfc-8610#V-0066'
    locator: '§3.9'
    cddl: |
      tcp-header = {seq: uint, ack: uint, * $$tcp-option}

      ; later, in a different file

      $$tcp-option //= (
      sack: [+(left: uint, right: uint)]
      )

      ; and, maybe in another file

      $$tcp-option //= (
      sack-permitted: true
      )
    matches: 'A map with seq and ack plus any number of entries contributed later through the group socket $$tcp-option.'
    expect: 'valid'
    notes: 'The socket/plug mechanism "potentially in separate files that are concatenated to build the full specification" -- the two "; later, in a different file" comments are the source''s and are the whole point. Before either plug is seen, `* $$tcp-option` is an empty group choice and tcp-header is simply {seq, ack}: "it is not an error if there is no definition for a socket at all; this then means there is no way to satisfy the rule".'
  - id: 'rfc-8610#V-0067'
    locator: '§3.9 (Figure 12)'
    cddl: |
      PersonalData = {
        ? displayName: tstr,
        NameComponents,
        ? age: uint,
        * $$personaldata-extensions
      }

      NameComponents = (
        ? firstName: tstr,
        ? familyName: tstr,
      )

      ; The above already works as is.
      ; But then, we can add later:

      $$personaldata-extensions //= (
        favorite-salsa: tstr,
      )

      ; and again, somewhere else:

      $$personaldata-extensions //= (
        shoesize: uint,
      )
    matches: 'Figure 7''s extensible map, with the untyped `* tstr => any` wildcard replaced by a named group socket plugged twice.'
    expect: 'valid'
    notes: 'The source offers it as the disciplined alternative to Figure 7: "(See Section 3.9 for one way to explicitly identify an extension point.)" and "To pick up the example illustrated in Figure 7, the socket/plug mechanism could be used as shown in Figure 12". Unlike Figure 7, an unknown key no longer matches -- only the keys some plug declares.'
  - id: 'rfc-8610#V-0068'
    locator: '§3.10'
    cddl: |
      messages = message<"reboot", "now"> / message<"sleep", 1..100>
      message<t, v> = {type: t, value: v}
    matches: 'messages: a map {type, value} instantiated twice, once with two literal strings and once with a string and a range.'
    expect: 'valid'
    notes: 'The only generics example in the document. "the formal parameters are bound to the actual arguments supplied (also using angle brackets), within the scope of the generic rule (as if there were a rule of the form parameter = argument)." The source warns about the reference implementation: "(At this time, there are some limitations to the nesting of generics in the CDDL tool described in Appendix F.)"'
  - id: 'rfc-8610#V-0069'
    locator: '§3.11'
    cddl: |
      t = [group1]
      group1 = (a / b // c / d)
      a = 1 b = 2 c = 3 d = 4
    matches: 'An array of one element: either a-or-b, or c-or-d. "//" binds more loosely than "/".'
    expect: 'valid'
    notes: '"group1 is a group choice between the type choice of a and b and the type choice of c and d." Note source line 1882: four rules on ONE line, `a = 1 b = 2 c = 3 d = 4` -- legal because `cddl = S 1*(rule S)` needs no separator between rules.'
  - id: 'rfc-8610#V-0070'
    locator: '§3.11'
    cddl: |
      t = {group2}
      group2 = (? ab: a / b // cd: c / d)
      a = 1 b = 2 c = 3 d = 4
    matches: 'A map that is either an optional ab entry or a mandatory cd entry.'
    expect: 'valid'
    notes: '"is a group choice between the optional member "ab" of type a or b and the member "cd" of type c or d. Note that the optionality is attached to the first choice ("ab"), not to the second choice." The occurrence indicator binds inside the group alternative, not across the "//".'
  - id: 'rfc-8610#V-0071'
    locator: '§3.11'
    cddl: |
      t = [group3]
      group3 = (+ a / b / c)
      a = 1 b = 2 c = 3
    matches: 'An array of one or more elements, each of which is a, b or c.'
    expect: 'valid'
    notes: '"group3 is a repetition of a type choice between a, b, and c" -- NOT a repetition of a alone. The source concedes the reading is unhappy: "A comment has been that the semantics of group3 could be counterintuitive."'
  - id: 'rfc-8610#V-0072'
    locator: '§3.11'
    cddl: |
      t = [group4]
      group4 = (+ a // b / c)
      a = 1 b = 2 c = 3
    matches: 'An array of either one or more a, or a single b or c.'
    expect: 'valid'
    notes: '"if just a is to be repeatable, a group choice is needed to focus the occurrence [...] group4 is a group choice between a repeatable a and a single b or c."'
  - id: 'rfc-8610#V-0073'
    locator: '§3.11'
    cddl: |
      t = [group4a]
      group4a = ((+ a) // (b / c))
      a = 1 b = 2 c = 3
    matches: 'The same as group4, parenthesised so that no reader has to know the precedence table.'
    expect: 'valid'
    notes: 'The source''s own advice, applied: "the specification writer is encouraged not to rely on them, but to insert parentheses liberally to guide readers that are not familiar with CDDL precedence rules".'
  - id: 'rfc-8610#V-0074'
    locator: 'Appendix A'
    cddl: |
      A = "a" "b" / "a"    (1)
    matches: 'ABNF, not CDDL. Under PEG the first alternative is tried first and "ab" is matched before "a".'
    expect: 'valid'
    notes: 'The ordering that works. "(1)" is the source''s own label, part of the line. The pair of expressions exists to show that "The two alternatives listed are to be tested in left-to-right order, locking in the first successful match and disregarding any further potential matches within the choice (but not disabling alternatives in choices containing this choice, as a cut (Section 3.5.4) would)."'
  - id: 'rfc-8610#V-0075'
    locator: 'Appendix A'
    cddl: |
      A = "a" / "a" "b"    (2)
    matches: 'ABNF, not CDDL. The second alternative is DEAD: nothing can ever reach it.'
    expect: 'invalid'
    violates: 'Appendix A: "/" is a prioritized choice; a later alternative subsumed by an earlier one is unreachable.'
    notes: 'Equivalent to the previous vector in generative ABNF and broken in PEG: "are equivalent in ABNF''s original generative framework but are very different in PEG: in (2), the second alternative will never match, as any input string starting with an "a" will already succeed in the first alternative, locking in the match." Recorded as invalid because the expression cannot mean what it appears to; the source does not call it an error.'
  - id: 'rfc-8610#V-0076'
    locator: 'Appendix A'
    cddl: |
      Similarly, the occurrence indicators ("?", "*", "+") are "greedy" in
      PEG, i.e., they consume as much input as they match (and, as a
      consequence, "a* a" in PEG notation or "*a a" in CDDL syntax never
      can match anything, as all input matching "a" is already consumed by
      the initial "a*", leaving nothing to match the second "a").
    matches: 'Nothing. Occurrence indicators are greedy, so "*a a" is unsatisfiable.'
    expect: 'invalid'
    violates: 'Appendix A: occurrence indicators are greedy and do not backtrack to release input.'
    notes: 'The CDDL fragment appears inside running prose; the cddl field holds those prose lines verbatim rather than inventing a rule around them. "the occurrence indicators ("?", "*", "+") are "greedy" in PEG, i.e., they consume as much input as they match (and, as a consequence, "a* a" in PEG notation or "*a a" in CDDL syntax never can match anything, as all input matching "a" is already consumed by the initial "a*", leaving nothing to match the second "a")."'
  - id: 'rfc-8610#V-0077'
    locator: 'Appendix E'
    cddl: |
      uint = #0
    instance: '10'
    matches: 'As JSON, the number 10 matches "uint": JSON has one number type and uint becomes a predicate that it be integral.'
    expect: 'valid'
    notes: 'From the list the source prints on source line 3012: "the following JSON numbers are all matching "uint": 10 10.0 1e1 1.0e1 100e-1". The cddl field is the prelude''s own `uint = #0` line from Figure 15 (source line 2977). "In this context, specifying a type as "uint", "nint", or "int" then becomes a predicate that the number be integral. [...] (The fact that these are all integers may be surprising to users accustomed to the long tradition in programming languages of using decimal points or exponents in a number to indicate a floating-point literal.)" NOTE the asymmetry with CBOR: under §2.2.1 the CDDL type 1 excludes 1.0, but here 10.0 matches uint -- the same predicate reads differently against the two serializations.'
