  - id: 'rfc-8610#V-0082'
    locator: 'Appendix E (Figure 16)'
    cddl: |
      ij-uint = 0..9007199254740991
      ij-nint = -9007199254740991..-1
      ij-int = -9007199254740991..9007199254740991
    matches: 'Integer types narrowed to the range I-JSON can carry exactly: [-(2**53)+1, (2**53)-1].'
    expect: 'valid'
    notes: 'NOT PART OF THE PRELUDE -- the source is explicit: "Note that the types given here are not part of the prelude; they need to be copied into the CDDL specification if needed." CHECKED BY US: 9007199254740991 == 2**53 - 1. The reason is interchange, not CDDL: "In practice, JSON numbers are often parsed into a number type that is called "float64" here [...] this means that integers can only be expressed with interoperable exactness when they lie in the range [-(2**53)+1, (2**53)-1] -- a smaller range than that covered by CDDL "int"."'
  - id: 'rfc-8610#V-0083'
    locator: 'Appendix E'
    cddl: |
      biguint = #6.2(bstr)
      bignint = #6.3(bstr)
      bigint = biguint / bignint
      integer = int / bigint
      unsigned = uint / biguint
    matches: 'The prelude''s bignum types, offered to JSON applications that need to exceed 64-bit int.'
    expect: 'valid'
    notes: 'A verbatim repeat of five prelude lines (source lines 2890-2894 in Appendix D) at a different indentation. "JSON applications that do not need to stay compatible with I-JSON and that actually may need to go beyond the 64-bit unsigned and negative integers supported by "int" (= "uint"/"nint") may want to use the following additional types from the standard prelude, which are expressed in terms of tags but can straightforwardly be mapped into JSON (but not I-JSON) numbers". OURS: the mapping is by convention only -- a JSON document has no tags, so what "#6.2(bstr)" means in JSON is left to the application.'
  - id: 'rfc-8610#V-0084'
    locator: 'Appendix G.1'
    cddl: |
      h'48656c6c6f20776f726c64'
      h'48 65 6c 6c 6f 20 77 6f 72 6c 64'
      h'4 86 56c 6c6f
        20776 f726c64'
    matches: 'Three spellings of one 11-byte byte string, h''48656c6c6f20776f726c64'' = "Hello world".'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. "In EDN, whitespace is ignored in prefixed byte strings; for instance, the following are equivalent". DECODED BY US: 48 65 6c 6c 6f 20 77 6f 72 6c 64 is "Hello world"; the source does not say so here (it does in G.2 for the lowercase-h form of the same text). Note the third form splits hex digits mid-byte across a line break, which is legal because whitespace is simply removed before pairing.'
  - id: 'rfc-8610#V-0085'
    locator: 'Appendix G.2'
    cddl: |
      'hello world'
      h'68656c6c6f20776f726c64'
    matches: 'Two spellings of one 11-byte byte string: unprefixed single quotes carry UTF-8 text.'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. "EDN allows the use of single quotes without a prefix to express byte strings with UTF-8 text; for instance, the following are equivalent". The source also records the prefixes EDN admits -- ">h< for base16, >b32< for base32, >h32< for base32hex, or >b64< for base64 or base64url" -- which is a WIDER set than CDDL''s own `bsqual = "h" / "b64"`. Escaping: "The escaping rules of JSON strings are applied equivalently for text-based byte strings [...] Whitespace is included literally, i.e., the previous section does not apply to text-based byte strings."'
  - id: 'rfc-8610#V-0086'
    locator: 'Appendix G.3'
    cddl: |
      <<1>>              h'01'
    matches: 'A byte string carrying an embedded CBOR sequence: the single data item 1, encoded as the one byte 0x01.'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. One of the four equivalence pairs the source prints: "the diagnostic notation for these zero or more CBOR data items, separated by commas, can be enclosed in << and >> to notate the byte string resulting from encoding the data items and concatenating the result. For instance, each pair of columns in the following are equivalent". The two columns are on one source line, so the vector holds both. CHECKED BY US: 0x63 is the head for a 3-byte text string and 0xf6 is null, so h''63666F6FF6'' is indeed <<"foo", null>>. The uppercase F in the source''s hex is the source''s.'
  - id: 'rfc-8610#V-0087'
    locator: 'Appendix G.3'
    cddl: |
      <<1, 2>>           h'0102'
    matches: 'A byte string carrying an embedded CBOR sequence: the two items 1 and 2, encoded as 0x01 0x02.'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. One of the four equivalence pairs the source prints: "the diagnostic notation for these zero or more CBOR data items, separated by commas, can be enclosed in << and >> to notate the byte string resulting from encoding the data items and concatenating the result. For instance, each pair of columns in the following are equivalent". The two columns are on one source line, so the vector holds both. CHECKED BY US: 0x63 is the head for a 3-byte text string and 0xf6 is null, so h''63666F6FF6'' is indeed <<"foo", null>>. The uppercase F in the source''s hex is the source''s.'
  - id: 'rfc-8610#V-0088'
    locator: 'Appendix G.3'
    cddl: |
      <<"foo", null>>    h'63666F6FF6'
