    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. One of the four equivalence pairs the source prints: "the diagnostic notation for these zero or more CBOR data items, separated by commas, can be enclosed in << and >> to notate the byte string resulting from encoding the data items and concatenating the result. For instance, each pair of columns in the following are equivalent". The two columns are on one source line, so the vector holds both. CHECKED BY US: 0x63 is the head for a 3-byte text string and 0xf6 is null, so h''63666F6FF6'' is indeed <<"foo", null>>. The uppercase F in the source''s hex is the source''s.'
  - id: 'rfc-8610#V-0089'
    locator: 'Appendix G.3'
    cddl: |
      <<>>               h''
    matches: 'A byte string carrying an embedded CBOR sequence: the empty sequence, encoding to no bytes at all.'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. One of the four equivalence pairs the source prints: "the diagnostic notation for these zero or more CBOR data items, separated by commas, can be enclosed in << and >> to notate the byte string resulting from encoding the data items and concatenating the result. For instance, each pair of columns in the following are equivalent". The two columns are on one source line, so the vector holds both. CHECKED BY US: 0x63 is the head for a 3-byte text string and 0xf6 is null, so h''63666F6FF6'' is indeed <<"foo", null>>. The uppercase F in the source''s hex is the source''s.'
  - id: 'rfc-8610#V-0090'
    locator: 'Appendix G.4'
    cddl: |
      "Hello world"
      "Hello " "world"
      "Hello" h'20' "world"
      "" h'48656c6c6f20776f726c64' ""
    matches: 'Four spellings of the text string "Hello world".'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. "We extend the diagnostic notation by allowing multiple text strings or multiple byte strings to be notated separated by whitespace; these are then concatenated into a single text or byte string, respectively. Text strings and byte strings do not mix within such a concatenation, EXCEPT that byte string notation can be used inside a sequence of concatenated text string notation to encode characters that may be better represented in an encoded way." (emphasis ours) -- which is what the third and fourth lines do. The source: "The following four values are equivalent".'
  - id: 'rfc-8610#V-0091'
    locator: 'Appendix G.4'
    cddl: |
      'Hello world'
      'Hello ' 'world'
      'Hello ' h'776f726c64'
      'Hello' h'20' 'world'
      '' h'48656c6c6f20776f726c64' '' b64''
      h'4 86 56c 6c6f' h' 20776 f726c64'
    matches: 'Six spellings of the byte string ''Hello world''.'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. "Similarly, the following byte string values are equivalent". The fifth line slips in an empty b64'''' and the sixth splits hex mid-byte across two separate literals. The closing warning is the source''s: "(Note that the approach of separating by whitespace, while familiar from the C language, requires some attention -- a single comma makes a big difference here.)" -- a comma would make it a two-item sequence instead of one concatenated string.'
  - id: 'rfc-8610#V-0092'
    locator: 'Appendix G.5'
    cddl: |
      4711
      0x1267
      0o11147
      0b1001001100111
    matches: 'Four spellings of the integer 4711: decimal, hexadecimal, octal and binary.'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. "In addition to JSON''s decimal numbers, EDN provides hexadecimal, octal, and binary numbers in the usual C-language notation (octal with 0o prefix present only)." CHECKED BY US: 0x1267 = 0o11147 = 0b1001001100111 = 4711. DIVERGENCE WORTH NOTING, OURS: CDDL''s own `uint` production admits "0x" and "0b" but NOT "0o", so `0o11147` is EDN-only and is not legal in a CDDL specification.'
  - id: 'rfc-8610#V-0093'
    locator: 'Appendix G.5'
    cddl: |
      0x1.8p0
      0x18p-4
    matches: 'Two hexadecimal spellings of the floating-point value 1.5 (the source lists 1.5 itself just above).'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. "As are: 1.5 / 0x1.8p0 / 0x18p-4" -- source lines 3270-3272; the cddl field holds the two hexadecimal forms. CHECKED BY US: 0x1.8 = 1.5 with exponent 0; 0x18 = 24 and 24 * 2**-4 = 1.5. These match CDDL''s own `hexfloat` production, which requires the "p" exponent: `hexfloat = ["-"] "0x" 1*HEXDIG ["." 1*HEXDIG] "p" exponent`.'
  - id: 'rfc-8610#V-0094'
    locator: 'Appendix G.6'
    cddl: |
      h'68656c6c6f20776f726c64'
      h'68 65 6c /doubled l!/ 6c 6f /hello/
        20 /space/
        77 6f 72 6c 64' /world/
    matches: 'Two spellings of h''68656c6c6f20776f726c64'' -- comments count as whitespace inside a prefixed byte string.'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. "In EDN, comments can be included, delimited by slashes ("/"). Any text within and including a pair of slashes is considered a comment. Comments are considered whitespace. Hence, they are allowed in prefixed byte strings; for instance, the following are equivalent". Note that EDN comments are DELIMITED pairs of slashes, unlike CDDL comments, which run from ";" to end of line -- two different comment syntaxes in one document.'
  - id: 'rfc-8610#V-0095'
    locator: 'Appendix G.6'
    cddl: |
      /grasp-message/ [/M_DISCOVERY/ 1, /session-id/ 10584416,
                       /objective/ [/objective-name/ "opsonize",
                                    /D, N, S/ 7, /loop-count/ 105]]
    matches: 'A GRASP message annotated with EDN comments; the comments carry no data.'
    expect: 'valid'
    notes: 'EDN, not CDDL: Appendix G defines Extended Diagnostic Notation, which is how CBOR data items are written down, not how they are specified. Appendix G is NORMATIVE. "This can be used to annotate a CBOR structure as in". The source closes the appendix with an open question rather than a rule: "(There are currently no end-of-line comments. If we want to add them, "//" sounds like a reasonable delimiter given that we already use slashes for comments, but we could also go, for example, for "#".)"'
  - id: 'rfc-8610#V-0096'
    locator: 'Appendix H'
    cddl: |
      reputation-object = {
        reputation-context,
        reputon-list
      }

      reputation-context = (
        application: text
      )

      reputon-list = (
        reputons: reputon-array
      )

      reputon-array = [* reputon]

      reputon = {
        rater-value,
        assertion-value,
        rated-value,
        rating-value,
        ? conf-value,
        ? normal-value,
        ? sample-value,
        ? gen-value,
        ? expire-value,
        * ext-value,
      }

      rater-value = ( rater: text )
      assertion-value = ( assertion: text )
      rated-value = ( rated: text )
      rating-value = ( rating: float16 )
      conf-value = ( confidence: float16 )
      normal-value = ( normal-rating: float16 )
      sample-value = ( sample-size: uint )
      gen-value = ( generated: uint )
      expire-value = ( expires: uint )
      ext-value = ( text => any )
    matches: 'A JSON reputation object: an application name and an array of reputons, each with four mandatory and five optional members plus extensions.'
    expect: 'valid'
    notes: 'APPENDIX H IS FOR INFORMATION ONLY -- the appendix says so in its first line. "[RFC7071] defines the "reputon" structure for JSON using somewhat formalized English text. Here is a (somewhat verbose) equivalent definition using the same terms, but notated in CDDL". The cddl field joins source lines 3330-3356 and 3367-3376; a page frame (60->61) falls between them and is not reproduced. Held verbatim as schema/reputon-verbose.cddl.'
  - id: 'rfc-8610#V-0097'
    locator: 'Appendix H'
    cddl: |
      reputation-object = {
        application: text
        reputons: [* reputon]
      }

      reputon = {
        rater: text
        assertion: text
        rated: text
        rating: float16
        ? confidence: float16
        ? normal-rating: float16
        ? sample-size: uint
        ? generated: uint
        ? expires: uint
        * text => any
      }
    matches: 'The same reputation object, with every single-entry group inlined.'
    expect: 'valid'
    notes: '"An equivalent, more compact form of this example would be". Two things it demonstrates in passing: group entries here carry NO separating commas at all, and `* text => any` replaces the named ext-value group. The source''s claim about RFC 7071 is worth keeping with it: "this definition makes it clear that several ext-values are allowed (by definition with different member names); RFC 7071 could be read to forbid the repetition of ext-value ("A specific reputon-element MUST NOT appear more than once" is ambiguous)." That quoted MUST NOT is RFC 7071''s, not RFC 8610''s.'
  - id: 'rfc-8610#V-0098'
    locator: 'Appendix H'
    cddl: |
      reputation-object = {
        application: text
        reputons: [* reputon]
      }

      reputon = {
        rater: text
        assertion: text
        rated: text
        rating: float16
        ? confidence: float16
        ? normal-rating: float16
        ? sample-size: uint
        ? generated: uint
        ? expires: uint
        * text => any
      }
    instance: |
      {
        "application": "conchometry",
        "reputons": [
          {
            "rater": "Ephthianura",
            "assertion": "codding",
            "rated": "sphaerolitic",
            "rating": 0.34133473256800795,
            "confidence": 0.9481983064298332,
            "expires": 1568,
            "unplaster": "grassy"
          },
          {
            "rater": "nonchargeable",
            "assertion": "raglan",
            "rated": "alienage",
            "rating": 0.5724646875815566,
            "sample-size": 3514,
            "Aldebaran": "unchurched",
            "puruloid": "impersonable",
            "uninfracted": "pericarpoidal",
            "schorl": "Caro"
          },
          {
            "rater": "precollectable",
            "assertion": "Merat",
            "rated": "thermonatrite",
            "rating": 0.19164006323936977,
            "confidence": 0.6065252103391268,
            "normal-rating": 0.5187773690879303,
            "generated": 899,
            "speedy": "solidungular",
            "noviceship": "medicine",
            "checkrow": "epidictic"
          }
        ]
      }
    matches: 'An instance generated by the reference tool: one application and three reputons, each carrying extension members.'
    expect: 'valid'
    notes: 'The source: "The CDDL tool described in Appendix F generates as one example". Worth noting what it exercises: all three reputons carry extension keys matched by `* text => any`; the second omits "confidence" and the third includes "normal-rating"; the ratings are float64 literals in JSON although the schema says float16 -- which is exactly Appendix E''s point that "The effect of specifying a floating-point precision (float16/float32/float64) is only to restrict the set of permissible values to those expressible with binary16/binary32/binary64". OURS: 0.34133473256800795 is NOT representable in binary16, so under a strict reading this generated instance does not satisfy `rating: float16`. The document does not comment on it.'
