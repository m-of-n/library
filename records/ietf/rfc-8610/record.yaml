distillation:
  standard: "FX-1"
  # `full` as of the cross-check pass, 2026-10-19. It means the FX-1 ARTIFACT
  # SET is complete against the standard — NOT that this record describes
  # current CDDL. rfc-9165, rfc-9682, rfc-9741 and draft-ietf-cbor-cddl-modules
  # are still `status: fetched`; distilled/README.md and summary.md both carry
  # that gate and it survives `full` unchanged. No `reviewed_by` is signed.
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "344 verbatim statements and 4 reproduced blocks (the §3.3 primitive-keyword list, §3.11 Table 1, the §6.1 registry table, Appendix A's CDDL-to-PEG map) across 56 distinct locators. All 344 statements and all 4 blocks confirmed contiguous substrings of the whitespace-normalised source; every locator verified by section range rather than document-wide; 0 failures on both"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "139 entries R-0001 to R-0139 in source order, no gaps: 2 stated, 137 inferred. source and extracted keyword counts both 2, with a 2560-character reconciliation stating what was counted instead of BCP 14 keywords - every type- and group-matching rule, every occurrence semantic, every control-operator definition, socket/plug, the prelude's fixity, every explicit disclaimer of capability, and the lower-case force words the document does use. NEITHER stated entry is an obligation on a CDDL implementer: R-0070 is a SHOULD binding a downstream specification author, and R-0139 is RFC 8610 quoting RFC 7071 in order to call it ambiguous, inside an appendix declared 'for information only'. §1.1's boilerplate is deliberately never quoted, because bin/validate counts texts with stripping off and quoting it would add 11 phantom keywords"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "8 verbatim and 3 derived. Appendix B's complete ABNF (47 distinct productions, three regions across two page breaks, source lines 2480-2516/2527-2566/2583-2597) and Appendix D's standard prelude (40 distinct rules, 2876-2906/2919-2931) are both byte-identical to the cache with the RFC's margin intact - independently re-verified by the orchestrator, not only self-reported. Also verbatim: Appendix E's JSON-subset prelude and ijson types, Appendix H's two reputon schemas, §3.11's precedence table and Appendix A's PEG mapping. Derived: a dedented ABNF an ABNF tool can read (round-trip checked), all 14 control operators as data, and 44 side conditions the grammar cannot express"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "39 constructs, 142 fields (33 CDDL-text, 6 EDN-text from the normative Appendix G). constrained_by is OMITTED THROUGHOUT, deliberately and stated in the file header: with two keyword occurrences in the document there is no honest way to tie a construct to a requirement id, and inventing one is the failure FX-1 exists to prevent"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "98 vectors V-0001 to V-0098 covering every example the document prints: 92 valid, 5 invalid, 1 indeterminate. All five negatives are the source's own, none invented. V-0037 is indeterminate rather than valid or invalid because the source refuses to decide it - 'the specification writer is simply urged to not write pathologically non-deterministic specifications' - in the same sentence that says tools cannot detect the condition. 109 block scalars verified against the cache: 103 a single unbroken source run, 1 spanning a page frame, and 5 joining two non-adjacent ranges across an omitted line, each declaring the omitted lines in its own notes - so 104 are dedented contiguous slices and 5 are the declared compositions. 9 further instance values are one-line prose-quoted scalars, each confirmed present in the source. Pass 1 reported the single-range count (103) as the total and gave the single-range figure as 97; pass 2 re-derived the decomposition and corrected it"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "a verdict on CDDL as the schema language for D4's encoding-neutral types - competent for representation, not sufficient as D4 is currently scoped; six things we need that CDDL cannot express, each with the source's own statement of the absence; and five named cuts against MD-3, including that option 5's defining exclusion cannot be stated in CDDL at all and that DEC-002's own acceptance fixture names the one invariant CDDL cannot check"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "§5 states it outright: \"This document presents a content rules language for expressing CBOR data structures. As such, it does not bring any security issues on itself, although specifications of protocols that use CBOR naturally need security analyses when defined.\" Appendix C makes the entire semantics a matching relation between one specification and one instance - \"an instance (data item) \"matches\" a CDDL specification if it is allowed by the CDDL specification\". No roles, no messages, no error paths; §4's three uses are all single-party tool uses. The only procedural content is §6.1's IANA registration policy, which is an IANA process rather than a protocol."
    - kind: state-machine
      reason: "No states and no transitions, for the same reason the protocol artifact is absent: matching is a predicate over a specification and an instance, not a lifecycle. Nothing in the document registers, issues, rotates, revokes or expires anything."
  passes:
    - pass: extract
      by: "claude-opus-5 (2 parallel agents, one per artifact group)"
      effort: max
      date: "2026-10-18"
      note: "each agent read only .cache/rfc-8610.txt. The orchestrator independently re-verified the two load-bearing verbatim captures (Appendix B ABNF, Appendix D prelude) against the cached source by line range, and confirmed by hand that neither of the two BCP 14 occurrences is an obligation of this document on a CDDL implementer"
    - pass: verify
      by: "claude-opus-5 (independent agent; did not extract)"
      effort: max
      date: "2026-10-19"
      note: "re-derived every mechanical claim from .cache/rfc-8610.txt with checkers written from scratch, and did not read pass 1's generators. CONFIRMED: bcp14-count 2, and 13 unstripped, so the §1.1 boilerplate is indeed never quoted (the 11-phantom-keyword claim is exact); R-0070's SHOULD binds 'the specification that employs CDDL' and R-0139's MUST NOT is RFC 8610 quoting RFC 7071 inside an appendix whose opening line is 'This appendix is for information only.'; the 2560-character reconciliation is 2560 characters and every category and force-word section it claims to have counted instead is present as an inferred entry at exactly those locators, with no section missing and none extra. All 139 requirement texts and all 344 normative statements re-confirmed as contiguous substrings of the whitespace-normalised source, with BOTH the start and the end line of every span inside the locator's section range (483 spans, 0 failures), against a section map built from the source's own headings; the 4 reproduced blocks re-confirmed as dedented contiguous slices. All 12 verbatim schema regions byte-identical AND all 12 declared per-region sha256 digests verify. Completeness audit: every source line outside every claimed region is a heading, prose, page furniture, a blank or a figure caption - 0 schema lines dropped, at either Appendix B page frame or the Appendix D one. 47 ABNF productions with full closure and no duplicates; 40 prelude rules with every RHS type name resolving inside the prelude; the 19 major-type-6 names confirmed as 16 direct plus bigint/integer/unsigned, none missed. cddl-dedented.derived.abnf round-trips exactly in both directions. CORRECTED: the block-scalar census (pass 1 reported the single-range count as the total) in four places, and V-0037's notes cited an instance the vector did not carry, so the instance was added verbatim from source line 1275. STRENGTHENED: Appendix H's float16 mismatch is all six float values across three float16-typed members, not one. NOT CHANGED, both re-confirmed as correct: V-0037's indeterminacy and the source count of 2"
    - pass: cross-check
      by: "claude-opus-5 (independent agent; did not extract and did not verify)"
      effort: max
      date: "2026-10-19"
      note: "artifact against artifact. (1) REQUIREMENTS vs CONSTRUCTS, joined by section because CDDL's fields are syntactic constructs: 130 of 139 requirements land on a construct or a schema file; the 9 that do not are listed in messages.yaml's new `locator_join` block with a reason each - 4 are statements about the document rather than about CDDL (§1.2 x3, Appendix F), 1 is an explicit absence (§3.3), and 4 have a construct at a finer locator than the requirement's (§2 x3, §3.4). No requirement names a field missing from the artifact set, and no construct is unreached. `constrained_by` is still OMITTED THROUGHOUT: `locator_join` is a SECTION cross-reference and says so in its own `not_a_requirement_link` key. (2) PROTOCOL and (3) STATE-MACHINE `not_applicable` re-confirmed by vocabulary sweep over all ten artifacts: 6 exchange-word hits (the RFC's Acknowledgements, our 'acknowledged by the source', our float round-tripping, and `/session-id/` inside the GRASP data item of EDN vector V-0095) and 7 lifecycle hits (the not-applicable reason itself, and the reputon schema's `expires` MEMBER NAME) - no roles, no messages, no error paths, no transitions. §4.1/4.2/4.3 re-read: three single-party tool uses. (4) EXAMPLES vs SCHEMA, the main check: a general RFC 5234 ABNF parser and exact-ABNF recognizer written from scratch, loaded with cddl-dedented.derived.abnf, run from start rule `cddl`. ALL FIVE verbatim CDDL files parse (prelude, JSON-subset prelude, ijson-types, both reputons), comment headers and all; cddl.abnf itself is refused at its first grammar line, demonstrating the margin problem the dedented companion exists for. 75 of 98 vector texts parse as complete CDDL files; the other 23 are EDN (12, V-0084..V-0095), CDDL FRAGMENTS rather than rules (7 - V-0015/V-0016 parse as `type1`, V-0021 as `grpchoice`, V-0059..V-0062 as `type1` once §1.2's prose quotes are stripped), ABNF (2 - Appendix A calls V-0074/V-0075 'the ABNF expressions' in its own words, and the trailing figure label is part of the captured line) and running prose (2, V-0058/V-0076). 0 vectors are malformed CDDL. NEGATIVES: V-0013, V-0014 and V-0041 all PARSE and are caught only by a side condition (G-06, G-06, G-19+G-20); V-0075 and V-0076 are not CDDL text at all, so neither the grammar nor a side condition rejects them as CDDL - G-14 and G-15 name both correctly as PEG-level properties, and the bare fragment `*a a` does parse as a `grpchoice`. V-0037 parses and stays `indeterminate` (G-18). Thirteen further side conditions executed against the grammar rather than asserted (G-01, G-06, G-07, G-09, G-10, G-11, G-15, G-23, G-27, G-28, G-30, G-31, G-34, G-44) - each predicted accept accepted and each predicted reject rejected. ADVERSARIAL RE-DERIVATION of the two derived files pass 2 did not cover: the 14 control operators are §6.1's registry table entries in the registry's own order, all 14 target/controller claims check against §3.8.1-§3.8.6, and `non_associative: true` is now PROVEN (`a = 1 .size 2 .bits 3` is rejected, `(1 .size 2) .bits 3` accepted); grammar-gaps holds 44 items with no gap and its tally re-derives (S 23, I 5, S/I 1, N 12 = 41 plus 3 Table 1 disagreements carrying no verdict). COUNTS re-derived from the artifacts, all agreeing across record.yaml, distilled/README.md, summary.md, schema/README.md and examples/README.md: 109 block scalars, 20 instances of which 9 are one-liners, 98 vectors 92/5/1, 39 constructs, 142 fields, 139 requirements 137 inferred, 47 productions no duplicates, 40 prelude rules, 19 names reaching major type 6 (16 direct plus bigint/integer/unsigned), 44 gaps, 14 operators, and 3 derived files on disk with every statement of that count agreeing (pass 2's correction of the miscounted figure holds; the wrong number appears nowhere in the record). CORRECTED: nine mis-cited requirement ids in design-notes.md - the whole Appendix G citation list was off by one (R-0132 'Appendix F is for information only' was cited for G.1's whitespace rule, R-0134 for G.3's `<< >>`, R-0137 for G.6's comments), R-0133's section was cited for a G.2 sentence, and R-0093 (Appendix A's 'This appendix is normative.') was cited four times for Appendices B, C, E and G, which normative.md carries separately at their own locators. Also corrected six quote-fidelity defects in our own derived files: five truncations that substituted '.' for the source's ':' ';' ',' or ')' (.within in control-operators.derived.yaml; G-15, G-23, G-25, G-39) and G-24's join of two separate §3.1 bullets with no elision marker; after the fixes all 21 control-operator quote spans and every long grammar-gaps span verify as exact contiguous substrings of the whitespace-normalised source, with G-22's capitalised AND left alone because it is already declared '(emphasis ours)'. NOT CHANGED: `constrained_by` stayed absent, V-0037 stayed indeterminate, and every source defect - the bare-LF CRLF, the four-vs-two EDN prefixes, the stale RFC 7049 pointer, Table 1's three disagreements, Appendix H's failing instance - was re-confirmed and left unrepaired"
