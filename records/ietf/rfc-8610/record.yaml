distillation:
  standard: "FX-1"
  # NO `profile` YET. Passes 1 (extract) and 2 (verify) are complete; the
  # cross-check pass has NOT run, and an unfinished extraction is neither
  # `full` nor `partial` (docs/extraction.md).
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "344 verbatim statements and 4 reproduced blocks (the §3.3 primitive-keyword list, §3.11 Table 1, the §6.1 registry table, Appendix A's CDDL-to-PEG map) across 56 distinct locators. All 344 statements and all 4 blocks confirmed contiguous substrings of the whitespace-normalised source; every locator verified by section range rather than document-wide; 0 failures on both"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "139 entries R-0001 to R-0139 in source order, no gaps: 2 stated, 137 inferred. source and extracted keyword counts both 2, with a 2560-character reconciliation stating what was counted instead of BCP 14 keywords - every type- and group-matching rule, every occurrence semantic, every control-operator definition, socket/plug, the prelude's fixity, every explicit disclaimer of capability, and the lower-case force words the document does use. NEITHER stated entry is an obligation on a CDDL implementer: R-0070 is a SHOULD binding a downstream specification author, and R-0139 is RFC 8610 quoting RFC 7071 in order to call it ambiguous, inside an appendix declared 'for information only'. §1.1's boilerplate is deliberately never quoted, because bin/validate counts texts with stripping off and quoting it would add 11 phantom keywords"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "8 verbatim and 3 derived. Appendix B's complete ABNF (47 distinct productions, three regions across two page breaks, source lines 2480-2516/2527-2566/2583-2597) and Appendix D's standard prelude (40 distinct rules, 2876-2906/2919-2931) are both byte-identical to the cache with the RFC's margin intact - independently re-verified by the orchestrator, not only self-reported. Also verbatim: Appendix E's JSON-subset prelude and ijson types, Appendix H's two reputon schemas, §3.11's precedence table and Appendix A's PEG mapping. Derived: a dedented ABNF an ABNF tool can read (round-trip checked), all 14 control operators as data, and 44 side conditions the grammar cannot express"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "39 constructs, 142 fields (33 CDDL-text, 6 EDN-text from the normative Appendix G). constrained_by is OMITTED THROUGHOUT, deliberately and stated in the file header: with two keyword occurrences in the document there is no honest way to tie a construct to a requirement id, and inventing one is the failure FX-1 exists to prevent"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "98 vectors V-0001 to V-0098 covering every example the document prints: 92 valid, 5 invalid, 1 indeterminate. All five negatives are the source's own, none invented. V-0037 is indeterminate rather than valid or invalid because the source refuses to decide it - 'the specification writer is simply urged to not write pathologically non-deterministic specifications' - in the same sentence that says tools cannot detect the condition. 109 block scalars verified against the cache: 103 a single unbroken source run, 1 spanning a page frame, and 5 joining two non-adjacent ranges across an omitted line, each declaring the omitted lines in its own notes - so 104 are dedented contiguous slices and 5 are the declared compositions. 9 further instance values are one-line prose-quoted scalars, each confirmed present in the source. Pass 1 reported the single-range count (103) as the total and gave the single-range figure as 97; pass 2 re-derived the decomposition and corrected it"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "a verdict on CDDL as the schema language for D4's encoding-neutral types - competent for representation, not sufficient as D4 is currently scoped; six things we need that CDDL cannot express, each with the source's own statement of the absence; and five named cuts against MD-3, including that option 5's defining exclusion cannot be stated in CDDL at all and that DEC-002's own acceptance fixture names the one invariant CDDL cannot check"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "§5 states it outright: \"This document presents a content rules language for expressing CBOR data structures. As such, it does not bring any security issues on itself, although specifications of protocols that use CBOR naturally need security analyses when defined.\" Appendix C makes the entire semantics a matching relation between one specification and one instance - \"an instance (data item) \"matches\" a CDDL specification if it is allowed by the CDDL specification\". No roles, no messages, no error paths; §4's three uses are all single-party tool uses. The only procedural content is §6.1's IANA registration policy, which is an IANA process rather than a protocol."
    - kind: state-machine
      reason: "No states and no transitions, for the same reason the protocol artifact is absent: matching is a predicate over a specification and an instance, not a lifecycle. Nothing in the document registers, issues, rotates, revokes or expires anything."
  passes:
