  - item: >-
      How a CA or RA validates the binding between the subject's identity and key, and any
      legally binding rules or duties.
    locator: "§2, §8"
    quotes:
      - |-
        To this end, this standard does not prescribe legally binding rules or duties.
  - item: "Processing of the CPS Pointer qualifier: a local matter."
    locator: "§4.2.1.4"
    quotes:
      - |-
        Processing requirements for this qualifier are a local matter.
  - item: >-
      Client behaviour for CRLs that omit nextUpdate, for an empty policyConstraints, for
      empty GeneralNames in subjectAltName, and the semantics of wildcard subject
      alternative names.
    locator: "§5.1.2.5, §4.2.1.11, §4.2.1.6"
    quotes:
      - |-
        Finally, the semantics of subject alternative names that include wildcard characters (e.g., as a placeholder for a set of names) are not addressed by this specification.
  - item: "Name constraint semantics for otherName, ediPartyName and registeredID."
    locator: "§4.2.1.10"
    quotes:
      - |-
        The syntax and semantics for name constraints for otherName, ediPartyName, and registeredID are not defined by this specification, however, syntax and semantics for name constraints for other name forms may be specified in other documents.
  - item: >-
      Semantics of AIA and SIA accessLocation name forms other than those given; the
      contents of SIA for end entity services; the Time Stamp Protocol (RFC 3161).
    locator: "§4.2.2.1, §4.2.2.2"
    quotes:
      - |-
        The semantics of other id-ad-caIssuers accessLocation name forms are not defined.
  - item: "Validation with respect to a past time: permitted, with no procedure."
    locator: "§6.1"
    quotes:
      - |-
        A conforming implementation MAY also support validation with respect to some point in the past.
      - |-
        Note that mechanisms are not available for validating a certificate with respect to a time outside the certificate validity period.
  - item: "Limiting revocation checking to a subset of reason codes."
    locator: "§6.3.2"
    quotes:
      - |-
        Additional processing and state variables may be necessary to limit the checking to a subset of the reason codes.
  - item: "What 'suitably recent' means for a CRL: local policy."
    locator: "§3.3"
    quotes:
      - |-
        The meaning of "suitably recent" may vary with local policy, but it usually means the most recently issued CRL.
  - item: "Profile conformance checking during validation: recommended against."
    locator: "§6.1"
    quotes:
      - |-
        While the algorithm could be extended to include checks for conformance to the profiles in Sections 4 and 5, this profile RECOMMENDS against including such checks.
  - item: >-
      Attribute certificates and their revocation (onlyContainsAttributeCerts must be FALSE;
      6.3.3(b)(2)(iv) rejects such CRLs).
    locator: "§5.2.5, §6.3.3(b)(2)(iv)"
    quotes:
      - |-
        Conforming CRLs issuers MUST set the onlyContainsAttributeCerts boolean to FALSE.
      - |-
        Verify that the onlyContainsAttributeCerts boolean is not asserted.
outside_source_notes:
  - >-
    Not part of the extracted text. RFC 9618 replaces the §6.1 valid_policy_tree processing
    with a policy graph; RFC 9549 and RFC 9598 revise the §7 internationalized name rules;
    RFC 6818 and RFC 9608 also update RFC 5280. None of this is applied here.
pass2_notes:
  - >-
    FX-1 pass 2 (verifier VD, 2026-10-13). All 1,021 quotes were located in the source by a
    position-level checker and are verbatim. 19 locators named a lettered step that does not
    contain the quote (mostly the closing failure sentences of 6.1.3 and 6.1.4, and §6.1 text
    cited under a 6.1.4 or 6.1.5 step); each locator was extended with the section that does.
  - >-
    Defect texts reworded: min-max-not-in-algorithm (6.1.4(g) speaks of 'the value indicated
    in the extension field', not of base), revocation-undetermined-mapping (§5.2.4 counts a
    hold as a revocation), and the crl-validation fallback note (4.2.1.7 excludes issuerAltName
    from name chaining, not from path validation). The §6.1 and §6.3.3 steps, guards and
    state-variable updates were checked against the source and stand.
