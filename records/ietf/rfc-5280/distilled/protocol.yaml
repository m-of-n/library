          - "rfc-5280#R-0305"
          - "rfc-5280#R-0306"
          - "rfc-5280#R-0307"
          - "rfc-5280#R-0308"
          - "rfc-5280#R-0309"
        on_error: >-
          unspecified. The source states what a conforming CRL issuer must emit; it defines
          no issuer-side error or refusal.
        on_error_basis: "unspecified"
      - n: "4"
        from: "crl-issuer"
        to: "crl-issuer"
        message: "TBSCertList"
        action: >-
          List every certificate in scope whose status changed since the base: revoked (a);
          released from hold as removeFromCRL (b); revoked for an out-of-scope reason after
          an in-scope listing, without reason code (c); not listed otherwise (d).
        basis: "stated"
        locator: "§5.2.4"
        quotes:
          - |-
            (a) If the certificate is revoked for a reason included in the scope of the CRL, list the certificate as revoked.
          - |-
            (b) If the certificate is valid and was listed on the referenced base CRL or any subsequent CRL with reason code certificateHold, and the reason code certificateHold is included in the scope of the CRL, list the certificate with the reason code removeFromCRL.
          - |-
            (c) If the certificate is revoked for a reason outside the scope of the CRL, but the certificate was listed on the referenced base CRL or any subsequent CRL with a reason code included in the scope of this CRL, list the certificate as revoked but omit the reason code.
          - |-
            (d) If the certificate is revoked for a reason outside the scope of the CRL and the certificate was neither listed on the referenced base CRL nor any subsequent CRL with a reason code included in the scope of this CRL, do not list the certificate on this CRL.
          - |-
            The status of a certificate is considered to have changed if it is revoked (for any revocation reason, including certificateHold), if it is released from hold, or if its revocation reason changes.
          - |-
            CRL issuers MUST ensure that the combination of a delta CRL and any appropriate complete CRL accurately reflects the current revocation status.
          - |-
            The CRL issuer MUST include an entry in the delta CRL for each certificate within the scope of the delta CRL whose status has changed since the generation of the referenced base CRL: (a) If the certificate is revoked for a reason included in the scope of the CRL, list the certificate as revoked. (b) If the certificate is valid and was listed on the referenced base CRL or any subsequent CRL with reason code certificateHold, and the reason code certificateHold is included in the scope of the CRL, list the certificate with the reason code removeFromCRL. (c) If the certificate is revoked for a reason outside the scope of the CRL, but the certificate was listed on the referenced base CRL or any subsequent CRL with a reason code included in the scope of this CRL, list the certificate as revoked but omit the reason code. (d) If the certificate is revoked for a reason outside the scope of the CRL and the certificate was neither listed on the referenced base CRL nor any subsequent CRL with a reason code included in the scope of this CRL, do not list the certificate on this CRL.
          - |-
            If the certificate was placed on hold in any CRL issued after the base but before this delta CRL and then released from hold, it MUST be listed on the delta CRL with revocation reason removeFromCRL.
          - |-
            A CRL issuer MAY optionally list a certificate on a delta CRL with reason code removeFromCRL if the notAfter time specified in the certificate precedes the thisUpdate time specified in the delta CRL and the certificate was listed on the referenced base CRL or in any CRL issued after the base but before this delta CRL.
