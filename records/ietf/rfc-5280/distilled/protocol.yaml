  - name: "crl-issuance"
    title: >-
      Complete CRL issuance: revocation request, entry addition, the CRL issuer's
      obligations on every field and extension, signing and publication
    locator: "§3, §3.3, §3.5(f), §5, §5.1, §5.2, §5.3, §8"
    kind: "issuance"
    participants:
      - "requester"
      - "ca"
      - "crl-issuer"
      - "repository"
    summary: >-
      A CA indicates revocation status for what it issues and may delegate CRL issuance (§3,
      §5). This flow covers a complete CRL from one issuer; delta CRLs and indirect CRLs
      follow as their own flows. CRL issuance is not required when another status mechanism
      exists (§5).
    preconditions:
      - id: "crls-optional"
        text: "CRLs are optional when other status mechanisms are provided."
        basis: "stated"
        locator: "§5, §3.3"
        quotes:
          - |-
            Conforming CAs are not required to issue CRLs if other revocation or certificate status mechanisms are provided.
          - |-
            However, this profile does not require the issuance of CRLs.
      - id: "crl-issuer-certificate"
        text: >-
          A CRL issuer that is not the CA holds a certificate whose subject is encoded as
          its CRL issuer field, with cRLSign asserted when keyUsage is present.
        basis: "stated"
        locator: "§4.1.2.6, §4.2.1.3, §5.1.1.3"
        constrained_by:
          - "rfc-5280#R-0048"
          - "rfc-5280#R-0060"
          - "rfc-5280#R-0100"
        quotes:
          - |-
            The cRLSign bit is asserted when the subject public key is used for verifying signatures on certificate revocation lists (e.g., CRLs, delta CRLs, or ARLs).
    steps:
      - n: "1"
        from: "requester"
        to: "ca"
        message: "RevocationRequest"
        action: "An authorized person tells the CA that a certificate must be revoked."
        basis: "stated"
        locator: "§3.5(f), §3.3"
        quotes:
          - |-
            revocation request: An authorized person advises a CA of an abnormal situation requiring certificate revocation.
          - |-
            Such circumstances include change of name, change of association between subject and CA (e.g., an employee terminates employment with an organization), and compromise or suspected compromise of the corresponding private key. Under such circumstances, the CA needs to revoke the certificate.
        on_error: >-
          unspecified. The request has no defined format, authentication or response; §3.5
          defers to other PKIX specifications.
        on_error_basis: "unspecified"
        note: "RevocationRequest is not-in-source as a structure."
      - n: "2"
        from: "ca"
        to: "crl-issuer"
        message: "CertificateList"
        action: "The CA issues the CRL itself or has a CRL issuer it has authorized do it."
        basis: "stated"
        locator: "§3, §5"
        quotes:
          - |-
            In general, when revocation status information is provided using CRLs, the CA is also the CRL issuer. However, a CA may delegate the responsibility for issuing CRLs to a different entity.
          - |-
            CRL issuers issue CRLs. The CRL issuer is either the CA or an entity that has been authorized by the CA to issue CRLs.
        on_error: "unspecified. How the CA notifies or authorizes a separate CRL issuer is not defined."
        on_error_basis: "unspecified"
        note: >-
          No message passes here in the source; the arrow is the delegation, and the object
          eventually produced is the CertificateList.
      - n: "3"
        from: "crl-issuer"
        to: "crl-issuer"
        message: "TBSCertList"
        action: >-
          Add an entry at the next update after notification; keep it until it has appeared
          on one scheduled CRL issued after the certificate expires; omit the list when
          nothing is revoked.
        basis: "stated"
        locator: "§3.3, §5.1.2.6"
        quotes:
          - |-
            An entry is added to the CRL as part of the next update following notification of revocation.
          - |-
            An entry MUST NOT be removed from the CRL until it appears on one regularly scheduled CRL issued beyond the revoked certificate's validity period.
          - |-
            When there are no revoked certificates, the revoked certificates list MUST be absent.
          - |-
            The time for revocationDate MUST be expressed as described in Section 5.1.2.4.
        constrained_by:
          - "rfc-5280#R-0003"
          - "rfc-5280#R-0286"
          - "rfc-5280#R-0287"
        on_error: >-
          unspecified. The source states what a conforming CRL issuer must emit; it defines
          no issuer-side error or refusal.
        on_error_basis: "unspecified"
      - n: "4"
        from: "crl-issuer"
        to: "crl-issuer"
        message: "TBSCertList"
        action: >-
          Set version v2; signature identical to CertificateList.signatureAlgorithm; issuer
          a non-empty DN encoded as in certificates.
        basis: "stated"
        locator: "§5, §5.1, §5.1.2.1, §5.1.2.2, §5.1.2.3, §8"
        quotes:
          - |-
            When CRLs are issued, the CRLs MUST be version 2 CRLs, include the date by which the next CRL will be issued in the nextUpdate field (Section 5.1.2.5), include the CRL number extension (Section 5.2.3), and include the authority key identifier extension (Section 5.2.1).
          - |-
            if present, MUST be v2
          - |-
            if present, version MUST be v2
          - |-
            When extensions are used, as required by this profile, this field MUST be present
          - |-
            and MUST specify version 2 (the integer value is 1).
          - |-
            This field MUST contain the same algorithm identifier as the signatureAlgorithm field in the sequence CertificateList (Section 5.1.1.2).
          - |-
            This field MUST contain the same algorithm identifier as the signature field in the sequence tbsCertList (Section 5.1.2.2).
          - |-
            The issuer field MUST contain a non-empty X.500 distinguished name (DN).
          - |-
            The issuer field is defined as the X.501 type Name, and MUST follow the encoding rules for the issuer name field in the certificate (Section 4.1.2.4).
          - |-
            As a means of reducing problems and security issues related to issuer name collisions, CA and CRL issuer names SHOULD be formed in a way that reduces the likelihood of name collisions.
        constrained_by:
          - "rfc-5280#R-0259"
