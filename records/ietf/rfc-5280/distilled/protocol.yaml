# rfc-5280 protocol model, FX-1 pass 1 (protocol agent). See protocol.md for the prose and diagrams.
record: "rfc-5280"
reviewed_by: ""
extracted: "2026-10-13"
source:
  file: ".cache/rfc-5280.txt"
  sha256: "a2f2628c0a83b873fc4786abd921f9b2c02395954b655d190bf16b831633345d"
  lines: "8459"
  bcp14_keywords: "532"
applicability: >-
  PARTIAL. RFC 5280 defines no wire protocol: no transport, no request or response, no error
  signalling. Its exchanges are the management and operational functions of §3.4 and §3.5,
  which it names and leaves to other PKIX specifications; what it does define is what each
  role must emit (the §4 certificate and §5 CRL profiles, modelled here as issuance flows),
  where certificates and CRLs are found (the CDP, freshestCRL, AIA and SIA pointer
  semantics, modelled as retrieval flows), and two local algorithms bound by functional
  equivalence: basic path validation (§6.1) and CRL validation (§6.3), with the §4.2.1.10
  name constraint and §7 name comparison rules as sub-algorithms. Path discovery is out of
  scope by the source's own statement. Anything not literally in the source is marked
  inferred. protocol.md carries the prose, a Mermaid diagram per flow and per main
  algorithm, and the list of what the document does not define.
conventions:
  quoting: >-
    Each item under a key ending in quotes is one contiguous span of .cache/rfc-5280.txt
    with the page footer and header lines removed, every run of whitespace collapsed to one
    space, and a hyphen that ends a source line joined to the next word without a space (the
    RFC never hyphenates words to justify lines, so such a hyphen is part of the word). A
    span may cross a page break, which contributes nothing. Non-adjacent text is never
    joined and nothing is elided. Quotes taken from requirements.yaml entries are the same
    spans normalised the same way; every quote was checked mechanically against the source.
  basis: >-
    stated means literally in the source at the locator given. inferred means the reading an
    implementer has to adopt to make the stated text executable.
  on_error_basis: >-
    stated, inferred or unspecified. unspecified means the source names the check or implies
    a failure and says nothing about what follows.
  constrained_by: >-
    rfc-5280#R-NNNN ids from distilled/requirements.yaml. The §6 steps map one to one to the
    verb none entries R-0376 to R-0537. R-0334 and R-0359 are kind inferred there; they are
    cited but not quoted.
  kind: >-
    Flows: issuance means one role builds and signs a structure that others consume later;
    retrieval means a relying party follows a pointer to a repository or service;
    out-of-band means the source places the exchange outside its scope; local-use means the
    relying party's own sequence. Algorithm step kinds: check (can fail), update (changes
    state), compute (derives a value), control (loop, branch or exit), skip-rule, assume.
  status: >-
    normative-by-equivalence: implementations need not run the steps but must produce the
    same external result (§1, §6, §6.3). out-of-scope: the source says so.
    referenced-not-defined: the mechanism belongs to a cited document. not-defined: the
    source states the obligation but not how it reaches the other party.
  message_names: >-
    Names follow the brief shared with messages.yaml (Certificate, TBSCertificate,
    CertificateList, Extension:<name>, GeneralName, TrustAnchorInfo-as-inputs,
    PathValidationInputs, PathValidationOutputs, CRLValidationInputs). Names added beyond
    that list are flagged in message_notes for reconciliation in pass 3. Extension names are
    the source's ASN.1 identifiers without the id-ce- or id-pe- prefix.
framing:
  - id: "no-wire-protocol"
    text: >-
      RFC 5280 is a profile of two signed data structures and two local algorithms; it
      defines no exchange.
    locator: "§1, §3.4"
    basis: "stated"
    quotes:
      - |-
        This specification profiles the format and semantics of certificates and certificate revocation lists (CRLs) for the Internet PKI. Procedures are described for processing of certification paths in the Internet environment.
  - id: "untrusted-distribution"
    text: >-
      Because certificates and CRLs are signed, any distribution channel will do and the
      repository need not be trusted.
    locator: "§2.1, §3.1, §8"
    basis: "stated"
    quotes:
      - |-
        The profile does not prohibit the use of an X.500 directory or an LDAP directory; however, any means of distributing certificates and certificate revocation lists (CRLs) may be used.
      - |-
        Since certificates and CRLs are digitally signed, no additional integrity service is necessary.
  - id: "equivalence-not-procedure"
    text: "§6 binds by external behaviour: the steps are normative as a specification of results."
    locator: "§1, §6, §6.1, §6.3"
    basis: "stated"
    quotes:
      - |-
        Implementations are REQUIRED to derive the same results but are not required to use the specified procedures.
      - |-
        Conforming implementations of this specification are not required to implement this algorithm, but MUST provide functionality equivalent to the external behavior resulting from this procedure.
  - id: "x509-validity-not-profile"
    text: "Path validation checks X.509 validity, not conformance to the §4 and §5 profiles."
    locator: "§6.1"
    basis: "stated"
    quotes:
      - |-
        Therefore, the algorithm only includes checks to verify that the certification path is valid according to X.509 and does not include checks to verify that the certificates and CRLs conform to this profile.
roles:
  - name: "ca"
    kind: "party"
    also_called:
      - "certificate issuer"
      - "issuer"
      - "conforming CA"
    description: >-
      Certification authority. Signs certificates, asserting the binding between the public
      key and the subject; responsible for the revocation status of what it issues; usually
      also the CRL issuer; may delegate management functions to an RA and CRL issuance to a
      CRL issuer; cross-certifies with other CAs.
    locators:
      - "§3"
      - "§3.1"
      - "§3.5"
      - "§4"
      - "§5"
    quotes:
      - |-
        CA: certification authority;
      - |-
        The binding is asserted by having a trusted CA digitally sign each certificate.
      - |-
        CAs are responsible for indicating the revocation status of the certificates that they issue.
    basis: "stated"
  - name: "crl-issuer"
    kind: "party"
    also_called:
      - "conforming CRL issuer"
    description: >-
      Generates and signs CRLs. Either the CA or an entity the CA authorized. For an
      indirect CRL, issues revocation information about certificates issued by others.
    locators:
      - "§3"
      - "§5"
      - "§5.2.5"
      - "§5.3.3"
    quotes:
      - |-
        CRL issuer: a system that generates and signs CRLs; and
      - |-
        CRL issuers issue CRLs. The CRL issuer is either the CA or an entity that has been authorized by the CA to issue CRLs. CAs publish CRLs to provide status information about the certificates they issued. However, a CA may delegate this responsibility to another trusted authority.
    basis: "stated"
  - name: "end-entity"
    kind: "party"
    also_called:
      - "subject"
      - "user"
    description: >-
      User of certificates and/or the end user system that is the subject of a certificate.
      In the issuance flow it is the requester; it is not authorized to issue certificates.
    locators:
      - "§3"
      - "§2.3"
      - "§3.2"
    quotes:
      - |-
        end entity: user of PKI certificates and/or end user system that is the subject of a certificate;
      - |-
        End entity certificates are issued to subjects that are not authorized to issue certificates.
    basis: "stated"
  - name: "relying-party"
    kind: "party"
    also_called:
      - "certificate user"
      - "certificate-using system"
      - "certificate-using client"
      - "client"
      - "application"
      - "conforming application"
      - "path validation implementation"
      - "conforming implementation"
      - "verifier"
      - "certificate validator"
      - "CRL verifier"
      - "CRL validator"
    description: >-
      Uses certificates: specifies path validation inputs, validates paths, checks
      revocation, and uses the subject public key within its restrictions. The source uses
      several names for this party without defining their relationship; they are merged
      here.
    locators:
      - "§2"
      - "§4.1.2.2"
      - "§4.2"
      - "§6"
      - "§6.1"
      - "§6.1.1(c)"
      - "§8"
    quotes:
      - |-
        The binding is limited by constraints that are specified in the certificates that comprise the path and inputs that are specified by the relying party.
      - |-
        A certificate-using system MUST reject the certificate if it encounters a critical extension it does not recognize or a critical extension that contains information that it cannot process.
      - |-
        Note that clients MUST reject the certificate if it contains an unsupported critical extension.
      - |-
        Certificate users MUST be able to handle serialNumber values up to 20 octets.
    basis: "stated"
  - name: "registration-authority"
    kind: "party"
    also_called:
      - "RA"
    description: >-
      Optional system to which a CA delegates certain management functions; registration may
      pass through it.
    locators:
      - "§3"
      - "§3.5(a)"
      - "§8"
    quotes:
      - |-
        RA: registration authority, i.e., an optional system to which a CA delegates certain management functions;
      - |-
        registration: This is the process whereby a user first makes itself known to a CA (directly, or through an RA), prior to that CA issuing a certificate or certificates for that user.
    basis: "stated"
  - name: "repository"
    kind: "party"
    also_called:
      - "directory"
      - "directory server"
      - "public repository"
      - "HTTP server"
      - "FTP server"
    description: >-
      Stores and distributes certificates and CRLs. Untrusted: certificates and CRLs are
      signed. Reached through directoryName (a locally configured directory server) or
      through LDAP, HTTP or FTP URIs named in CDP, AIA, SIA and the CRL AIA. The HTTP and
      FTP servers at those locations are folded into this role; the source addresses them as
      HTTP server implementations.
    locators:
      - "§3"
      - "§3.3"
      - "§4.2.1.13"
      - "§4.2.2.1"
      - "§4.2.2.2"
      - "§5.2.7"
    quotes:
      - |-
        repository: a system or collection of distributed systems that stores certificates and CRLs and serves as a means of distributing these certificates and CRLs to end entities.
      - |-
        However, these methods impose new security requirements: the certificate validator needs to trust the on-line validation service while the repository does not need to be trusted.
      - |-
        HTTP server implementations accessed via the URI SHOULD specify the media type application/pkix-crl in the content-type header field of the response.
    basis: "stated"
  - name: "trust-anchor"
    kind: "input"
    also_called:
      - "trusted CA"
      - "trust anchor information"
    description: >-
      Not a party in the exchange: the CA whose name, public key algorithm, key and optional
      parameters are input to path validation, delivered out of band, optionally as a
      self-signed certificate. Valid paths begin with certificates it issued.
    locators:
      - "§6"
      - "§6.1"
      - "§6.1.1(d)"
      - "§6.2"
      - "§8"
    quotes:
      - |-
        Valid paths begin with certificates issued by a trust anchor. The algorithm requires the public key of the CA, the CA's name, and any constraints upon the set of paths that may be validated using this key.
      - |-
        The trust anchor is an input to the algorithm. There is no requirement that the same trust anchor be used to validate all certification paths.
    basis: "stated"
  - name: "requester"
    kind: "party"
    description: >-
      The authorized person who asks a CA to revoke. Our name; the source says only 'an
      authorized person'.
    locators:
      - "§3.5(f)"
    quotes:
      - |-
        revocation request: An authorized person advises a CA of an abnormal situation requiring certificate revocation.
    basis: "inferred"
  - name: "ocsp-responder"
    kind: "referenced"
    also_called:
      - "on-line validation service"
    description: >-
      The OCSP responder named by AIA id-ad-ocsp. OCSP is RFC 2560; nothing of it is defined
      here.
    locators:
      - "§3"
      - "§3.3"
      - "§4.2.2.1"
    quotes:
      - |-
        When id-ad-ocsp appears as accessMethod, the accessLocation field is the location of the OCSP responder, using the conventions defined in [RFC2560].
    basis: "stated"
  - name: "timestamping-service"
    kind: "referenced"
    description: "A subject offering RFC 3161 timestamping, located by SIA id-ad-timeStamping."
    locators:
      - "§4.2.2.2"
    quotes:
      - |-
        The id-ad-timeStamping OID is used when the subject offers timestamping services using the Time Stamp Protocol defined in [RFC3161].
    basis: "stated"
  - name: "attribute-authority"
    kind: "mentioned"
    description: >-
      Mentioned once as able to delegate CRL publication; attribute certificates are
      otherwise out of scope (onlyContainsAttributeCerts must be FALSE).
    locators:
      - "§3"
      - "§5.2.5"
    quotes:
      - |-
        Note that an Attribute Authority (AA) might also choose to delegate the publication of CRLs to a CRL issuer.
    basis: "stated"
