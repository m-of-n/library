          - "rfc-5280#R-0312"
          - "rfc-5280#R-0313"
          - "rfc-5280#R-0314"
          - "rfc-5280#R-0315"
        on_error: >-
          unspecified. The source states what a conforming CRL issuer must emit; it defines
          no issuer-side error or refusal.
        on_error_basis: "unspecified"
      - n: "5"
        from: "crl-issuer"
        to: "crl-issuer"
        message: "CertificateList"
        action: "Leave freshestCRL out of the delta CRL; removeFromCRL appears only in deltas."
        basis: "stated"
        locator: "§5.2.6, §5.3.1"
        quotes:
          - |-
            The removeFromCRL (8) reasonCode value may only appear in delta CRLs and indicates that a certificate is to be removed from a CRL because either the certificate expired or was removed from hold.
          - |-
            This extension MUST NOT appear in delta CRLs.
        constrained_by:
          - "rfc-5280#R-0336"
          - "rfc-5280#R-0359"
        on_error: >-
          unspecified. The source states what a conforming CRL issuer must emit; it defines
          no issuer-side error or refusal.
        on_error_basis: "unspecified"
      - n: "6"
        from: "crl-issuer"
        to: "repository"
        message: "CertificateList"
        action: "Publish the delta, possibly several before the indicated nextUpdate."
        basis: "stated"
        locator: "§5.2.4"
        quotes:
          - |-
            Under some circumstances, the CRL issuer may publish one or more delta CRLs before the time indicated by the nextUpdate field.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "7"
        from: "repository"
        to: "relying-party"
        message: "CertificateList"
        action: >-
          The relying party that supports deltas obtains the current delta and combines it
          with a complete CRL.
        invokes:
          - "delta-crl-combination"
        basis: "stated"
        locator: "§5.2.4, §5"
        quotes:
          - |-
            Conforming applications are not required to support processing of delta CRLs, indirect CRLs, or CRLs with a scope other than all certificates issued by one CA.
          - |-
            An application that supports delta CRLs MUST be able to construct a current complete CRL by combining a previously issued complete CRL and the most current delta CRL.
          - |-
            An application that supports delta CRLs MAY also be able to construct a current complete CRL by combining a previously locally constructed complete CRL and the current delta CRL.
          - |-
            If more than one current delta CRL for a given scope is encountered, the application SHOULD consider the one with the latest value in thisUpdate to be the most current one.
        constrained_by:
          - "rfc-5280#R-0316"
          - "rfc-5280#R-0317"
          - "rfc-5280#R-0318"
        on_error: >-
          A delta and a complete CRL that fail the four combination conditions are not
          combined (MAY combine only when satisfied). What the relying party then uses is
          unspecified.
        on_error_basis: "inferred"
  - name: "indirect-crl-issuance"
    title: "Indirect CRL: a CRL issuer covering certificates issued by another authority"
    locator: "§5, §5.2.5, §5.3.3, §4.2.1.13, §6.3.3(b)(1)"
    kind: "issuance"
    participants:
      - "ca"
      - "crl-issuer"
      - "repository"
      - "relying-party"
    summary: >-
      When the CRL's scope includes certificates issued by an entity other than the CRL
      issuer the CRL is indirect (§5). The CA names the CRL issuer in each certificate's
      cRLDistributionPoints, the CRL asserts indirectCRL, and each entry is attributed by
      the certificate issuer entry extension.
    steps:
      - n: "1"
        from: "ca"
        to: "ca"
        message: "Extension:cRLDistributionPoints"
        action: >-
          Name the CRL issuer in cRLIssuer of the DistributionPoint, encoded exactly as that
          CRL's issuer field.
        basis: "stated"
        locator: "§4.2.1.13"
        quotes:
          - |-
            If the certificate issuer is not the CRL issuer, then the cRLIssuer field MUST be present and contain the Name of the CRL issuer.
          - |-
            If present, the cRLIssuer MUST only contain the distinguished name (DN) from the issuer field of the CRL to which the DistributionPoint is pointing.
          - |-
            The encoding of the name in the cRLIssuer field MUST be exactly the same as the encoding in issuer field of the CRL.
          - |-
            If the cRLIssuer field is included and the DN in that field does not correspond to an X.500 or LDAP directory entry where CRL is located, then conforming CAs MUST include the distributionPoint field.
        constrained_by:
          - "rfc-5280#R-0206"
          - "rfc-5280#R-0221"
          - "rfc-5280#R-0222"
          - "rfc-5280#R-0223"
        on_error: >-
          unspecified. The source states what a conforming CA must emit; it defines no
          CA-side check failure, refusal or error message.
        on_error_basis: "unspecified"
      - n: "2"
        from: "crl-issuer"
        to: "crl-issuer"
        message: "Extension:issuingDistributionPoint"
        action: >-
          Set indirectCRL TRUE when any certificate in scope was issued by another
          authority; a CA issuing an indirect CRL MAY include its own certificates.
        basis: "stated"
        locator: "§5, §5.2.5"
        quotes:
          - |-
            If the scope of the CRL includes one or more certificates issued by an entity other than the CRL issuer, then it is an indirect CRL.
          - |-
            If the scope of the CRL only includes certificates issued by the CRL issuer, then the indirectCRL boolean MUST be set to FALSE.
          - |-
            Otherwise, if the scope of the CRL includes certificates issued by one or more authorities other than the CRL issuer, the indirectCRL boolean MUST be set to TRUE.
          - |-
            If the issuer of the indirect CRL is a CA, then the scope of the indirect CRL MAY also include certificates issued by the issuer of the CRL.
        constrained_by:
          - "rfc-5280#R-0326"
          - "rfc-5280#R-0327"
          - "rfc-5280#R-0256"
        on_error: >-
          unspecified. The source states what a conforming CRL issuer must emit; it defines
          no issuer-side error or refusal.
        on_error_basis: "unspecified"
      - n: "3"
        from: "crl-issuer"
        to: "crl-issuer"
        message: "Extension:certificateIssuer"
        action: >-
          Attribute entries with the critical certificate issuer entry extension holding the
          certificate's issuer DN, identically encoded; absent on an entry means the same
          issuer as the preceding entry, and the CRL issuer for the first.
        basis: "stated"
        locator: "§5.3.3"
        quotes:
          - |-
            If this extension is not present on the first entry in an indirect CRL, the certificate issuer defaults to the CRL issuer. On subsequent entries in an indirect CRL, if this extension is not present, the certificate issuer for the entry is the same as that for the preceding entry.
          - |-
            Conforming CRL issuers MUST include in this extension the distinguished name (DN) from the issuer field of the certificate that corresponds to this CRL entry.
          - |-
            The encoding of the DN MUST be identical to the encoding used in the certificate.
          - |-
            CRL issuers MUST mark this extension as critical since an implementation that ignored this extension could not correctly attribute CRL entries to certificates.
          - |-
            This specification RECOMMENDS that implementations recognize this extension.
        constrained_by:
          - "rfc-5280#R-0363"
          - "rfc-5280#R-0364"
          - "rfc-5280#R-0365"
          - "rfc-5280#R-0366"
        on_error: >-
          unspecified. The source states what a conforming CRL issuer must emit; it defines
          no issuer-side error or refusal.
        on_error_basis: "unspecified"
      - n: "4"
        from: "crl-issuer"
        to: "repository"
        message: "CertificateList"
        action: "Publish."
        basis: "stated"
        locator: "§3, Figure 1"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "5"
        from: "repository"
        to: "relying-party"
        message: "CertificateList"
        action: >-
          The relying party checks the CRL issuer against cRLIssuer and the indirectCRL
          flag, and matches entries by certificate issuer and serial number.
        invokes:
          - "crl-validation"
        basis: "stated"
        locator: "§6.3.3(b)(1), §6.3.3(i)"
        quotes:
          - |-
            If the DP includes cRLIssuer, then verify that the issuer field in the complete CRL matches cRLIssuer in the DP and that the complete CRL contains an issuing distribution point extension with the indirectCRL boolean asserted. Otherwise, verify that the CRL issuer matches the certificate issuer.
          - |-
            If use-deltas is set, then search for the certificate on the delta CRL. If an entry is found that matches the certificate issuer and serial number as described in Section 5.3.3, then set the cert_status variable to the indicated reason as follows:
        constrained_by:
          - "rfc-5280#R-0509"
          - "rfc-5280#R-0530"
        on_error: >-
          See crl-validation step 6.3.3(b)(1); the source gives no outcome for a failed
          verification.
        on_error_basis: "unspecified"
  - name: "crl-retrieval"
    title: "CRL and delta CRL retrieval through cRLDistributionPoints and freshestCRL"
    locator: "§4.2.1.13, §4.2.1.15, §5.2.6, §6.3, §6.3.3(a), §8"
    kind: "retrieval"
    participants:
      - "relying-party"
      - "repository"
    summary: >-
      A pointer semantics, not a protocol: the certificate says where CRLs are, and the
      access protocols (LDAP, HTTP, FTP, X.500 DAP) are defined elsewhere (§3.4). §6.3
      itself assumes the needed CRLs are already cached and a mechanism to fetch current
      ones.
    steps:
      - n: "1"
        from: "relying-party"
        to: "relying-party"
        message: "Extension:cRLDistributionPoints"
        message_alternatives:
          - "GeneralName"
        action: >-
          Read the DistributionPoints of the certificate; several names in one
          DistributionPointName are alternative ways to the same CRL.
        basis: "stated"
        locator: "§4.2.1.13, §6.3.3"
        quotes:
          - |-
            The CRL distribution points extension identifies how CRL information is obtained.
          - |-
            If the DistributionPointName contains multiple values, each name describes a different mechanism to obtain the same CRL. For example, the same CRL could be available for retrieval through both LDAP and HTTP.
        on_error: >-
          No cRLDistributionPoints: crl-validation falls back to CRLs not specified in a
          distribution point but issued by the certificate issuer (§6.3.3, last paragraph).
        on_error_basis: "stated"
        on_error_quotes:
          - |-
            If the revocation status has not been determined, repeat the process above with any available CRLs not specified in a distribution point but issued by the certificate issuer.
      - n: "2"
        from: "relying-party"
        to: "relying-party"
        message: "GeneralName"
        action: >-
          Resolve nameRelativeToCRLIssuer by appending it to the CRL issuer DN (cRLIssuer if
          present, else the certificate issuer).
        basis: "stated"
        locator: "§4.2.1.13"
        quotes:
          - |-
            If the DistributionPointName contains the single value nameRelativeToCRLIssuer, the value provides a distinguished name fragment. The fragment is appended to the X.500 distinguished name of the CRL issuer to obtain the distribution point name. If the cRLIssuer field in the DistributionPoint is present, then the name fragment is appended to the distinguished name that it contains; otherwise, the name fragment is appended to the certificate issuer distinguished name.
          - |-
            Conforming CAs SHOULD NOT use nameRelativeToCRLIssuer to specify distribution point names.
          - |-
            The DistributionPointName MUST NOT use the nameRelativeToCRLIssuer alternative when cRLIssuer contains more than one distinguished name.
        constrained_by:
          - "rfc-5280#R-0216"
          - "rfc-5280#R-0217"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "relying-party"
        to: "repository"
        message: "GeneralName"
        action: >-
          directoryName: fetch the certificateRevocationList or authorityRevocationList
          attribute of that entry from the locally configured directory server, by a locally
          chosen protocol.
        basis: "stated"
        locator: "§4.2.1.13"
        quotes:
          - |-
            If the distributionPoint field contains a directoryName, the entry for that directoryName contains the current CRL for the associated reasons and the CRL is issued by the associated cRLIssuer. The CRL may be stored in either the certificateRevocationList or authorityRevocationList attribute. The CRL is to be obtained by the application from whatever directory server is locally configured. The protocol the application uses to access the directory (e.g., DAP or LDAP) is a local matter.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "relying-party"
        to: "repository"
        message: "GeneralName"
        action: >-
          URI: treat it as a pointer to the current CRL; HTTP and FTP return one DER CRL
          (application/pkix-crl); LDAP URIs name the entry and the attribute, and an omitted
          host relies on a priori knowledge.
        basis: "stated"
        locator: "§4.2.1.13"
        quotes:
          - |-
            Omitting the <host> (e.g., <ldap:///cn=CA,dc=example,dc=com?authorityRevocationList;binary>) has the effect of relying on whatever a priori knowledge the client might have to contact an appropriate server.
          - |-
            If the DistributionPointName contains a general name of type URI, the following semantics MUST be assumed: the URI is a pointer to the current CRL for the associated reasons and will be issued by the associated cRLIssuer.
          - |-
            When the HTTP or FTP URI scheme is used, the URI MUST point to a single DER encoded CRL as specified in [RFC2585].
          - |-
            HTTP server implementations accessed via the URI SHOULD specify the media type application/pkix-crl in the content-type header field of the response.
          - |-
            When the LDAP URI scheme [RFC4516] is used, the URI MUST include a <dn> field containing the distinguished name of the entry holding the CRL,
          - |-
            MUST include a single <attrdesc> that contains an appropriate attribute description for the attribute that holds the CRL [RFC4523],
          - |-
            and SHOULD include a <host> (e.g., <ldap://ldap.example.com/cn=example%20CA,dc=example,dc=com? certificateRevocationList;binary>).
        constrained_by:
          - "rfc-5280#R-0209"
          - "rfc-5280#R-0210"
          - "rfc-5280#R-0211"
          - "rfc-5280#R-0212"
          - "rfc-5280#R-0213"
          - "rfc-5280#R-0214"
        on_error: >-
          unspecified. The source defines no behaviour when the location is unreachable or
          returns something else.
        on_error_basis: "unspecified"
        note: >-
          https and ldaps pointers can force a second validation; see error path
          https-unbounded-recursion.
      - n: "5"
        from: "repository"
        to: "relying-party"
        message: "CertificateList"
        action: "Receive the CRL; check that what was retrieved is properly formed."
        basis: "stated"
        locator: "§4.2.1.13, §8"
        quotes:
          - |-
            Implementers should always take the steps of validating the retrieved data to ensure that the data is properly formed.
        on_error: "Malformed data: not accepted (lowercase should, §8)."
        on_error_basis: "stated"
      - n: "6"
        from: "relying-party"
        to: "repository"
        message: "GeneralName"
        message_alternatives:
          - "Extension:freshestCRL"
        action: >-
          When use-deltas is set and the certificate or the CRL carries freshestCRL, fetch
          the delta CRL from its distribution point names; freshestCRL only locates deltas
          and plays no part in validating them.
        basis: "stated"
        locator: "§4.2.1.15, §5.2.6, §6.3.3(a)"
        quotes:
          - |-
            The contents of this CRL extension are only used to locate delta CRLs; the contents are not used to validate the CRL or the referenced delta CRLs.
          - |-
            If use-deltas is set and either the certificate or the CRL contains the freshest CRL extension, obtain a delta CRL with a next update value that is after the current time and can be used to update the locally cached CRL as specified in Section 5.2.4.
          - |-
            If the current time is before the value of the next update field, use-deltas is set, and either the certificate or the CRL contains the freshest CRL extension, then obtain the current delta CRL that can be used to update the locally cached complete CRL as specified in Section 5.2.4.
        constrained_by:
          - "rfc-5280#R-0505"
          - "rfc-5280#R-0507"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "7"
        from: "repository"
        to: "relying-party"
        message: "CertificateList"
        action: "Receive the delta CRL and place both in the local CRL cache that crl-validation reads."
        invokes:
          - "crl-validation"
        basis: "stated"
        locator: "§6.3"
        quotes:
          - |-
            This algorithm assumes that all of the needed CRLs are available in a local cache. Further, if the next update time of a CRL has passed, the algorithm assumes a mechanism to fetch a current CRL and place it in the local CRL cache.
        constrained_by:
          - "rfc-5280#R-0495"
        on_error: "unspecified."
        on_error_basis: "unspecified"
  - name: "ca-certificate-retrieval-aia"
    title: >-
      Issuer certificate retrieval through authorityInfoAccess id-ad-caIssuers, and the OCSP
      pointer
    locator: "§4.2.2.1, §8"
    kind: "retrieval"
    participants:
      - "relying-party"
      - "repository"
      - "ocsp-responder"
    summary: >-
      AIA tells the relying party where to find certificates issued to the CA that issued
      this certificate, to help it select a path. id-ad-ocsp gives the OCSP responder
      location; OCSP itself is RFC 2560 and nothing of it is defined here.
    steps:
      - n: "1"
        from: "relying-party"
        to: "relying-party"
        message: "Extension:authorityInfoAccess"
        message_alternatives:
          - "GeneralName"
        action: >-
          Read the AccessDescriptions; caIssuers entries list certificates issued to the
          issuing CA.
        basis: "stated"
        locator: "§4.2.2.1"
        quotes:
          - |-
            In a public key certificate, the id-ad-caIssuers OID is used when the additional information lists certificates that were issued to the CA that issued the certificate containing this extension. The referenced CA issuers description is intended to aid certificate users in the selection of a certification path that terminates at a point trusted by the certificate user.
          - |-
            An authorityInfoAccess extension may include multiple instances of the id-ad-caIssuers accessMethod. The different instances may specify different methods for accessing the same information or may point to different information.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "relying-party"
        to: "repository"
        message: "GeneralName"
        action: >-
          directoryName: read crossCertificatePair and/or cACertificate from the locally
          configured directory server.
        basis: "stated"
        locator: "§4.2.2.1"
        quotes:
          - |-
            When the accessLocation is a directoryName, the information is to be obtained by the application from whatever directory server is locally configured. The entry for the directoryName contains CA certificates in the crossCertificatePair and/or cACertificate attributes as specified in [RFC4523]. The protocol that application uses to access the directory (e.g., DAP or LDAP) is a local matter.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "relying-party"
        to: "repository"
        message: "GeneralName"
        action: >-
          LDAP URI (dn, attributes, optional host) or HTTP/FTP URI pointing to one DER
          certificate or a certs-only CMS message.
        basis: "stated"
        locator: "§4.2.2.1"
        quotes:
          - |-
            Where the information is available via LDAP, the accessLocation SHOULD be a uniformResourceIdentifier.
          - |-
            The LDAP URI [RFC4516] MUST include a <dn> field containing the distinguished name of the entry holding the certificates,
          - |-
            MUST include an <attributes> field that lists appropriate attribute descriptions for the attributes that hold the DER encoded certificates or cross-certificate pairs [RFC4523],
          - |-
            and SHOULD include a <host> (e.g., <ldap://ldap.example.com/cn=CA, dc=example,dc=com?cACertificate;binary,crossCertificatePair;binary>).
          - |-
            Where the information is available via HTTP or FTP, accessLocation MUST be a uniformResourceIdentifier
          - |-
            and the URI MUST point to either a single DER encoded certificate as specified in [RFC2585] or a collection of certificates in a BER or DER encoded "certs-only" CMS message as specified in [RFC2797].
        constrained_by:
          - "rfc-5280#R-0227"
          - "rfc-5280#R-0228"
          - "rfc-5280#R-0229"
          - "rfc-5280#R-0230"
          - "rfc-5280#R-0231"
          - "rfc-5280#R-0232"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "repository"
        to: "relying-party"
        message: "Certificate"
        message_alternatives:
          - "CertsOnlyCMS"
        action: >-
          Receive a DER certificate (always accepted) or a certs-only CMS message (SHOULD be
          accepted); use media type or file suffix as a hint only.
        basis: "stated"
        locator: "§4.2.2.1, §8"
        quotes:
          - |-
            Consuming clients may use the media type or file extension as a hint to the content, but should not depend solely on the presence of the correct media type or file extension in the server response.
          - |-
            Conforming applications that support HTTP or FTP for accessing certificates MUST be able to accept individual DER encoded certificates
          - |-
            and SHOULD be able to accept "certs-only" CMS messages.
          - |-
            HTTP server implementations accessed via the URI SHOULD specify the media type application/pkix-cert [RFC2585] in the content-type header field of the response for a single DER encoded certificate
          - |-
            and SHOULD specify the media type application/pkcs7-mime [RFC2797] in the content-type header field of the response for "certs-only" CMS messages.
          - |-
            For FTP, the name of a file that contains a single DER encoded certificate SHOULD have a suffix of ".cer" [RFC2585]
          - |-
            and the name of a file that contains a "certs-only" CMS message SHOULD have a suffix of ".p7c" [RFC2797].
        constrained_by:
          - "rfc-5280#R-0233"
          - "rfc-5280#R-0234"
          - "rfc-5280#R-0235"
          - "rfc-5280#R-0236"
          - "rfc-5280#R-0237"
          - "rfc-5280#R-0238"
        on_error: >-
          A certs-only CMS message may be refused by an application that does not support it
          (SHOULD accept). Otherwise unspecified.
        on_error_basis: "inferred"
      - n: "5"
        from: "relying-party"
        to: "relying-party"
        message: "GeneralName"
        action: "Other name forms of caIssuers accessLocation: no semantics."
        basis: "stated"
        locator: "§4.2.2.1"
        quotes:
          - |-
            The semantics of other id-ad-caIssuers accessLocation name forms are not defined.
        on_error: "not defined by the source."
        on_error_basis: "stated"
      - n: "6"
        from: "relying-party"
        to: "ocsp-responder"
        message: "OCSPRequest"
        action: >-
          id-ad-ocsp gives the location of the OCSP responder for this certificate's status.
          The exchange is RFC 2560's.
        status: "referenced-not-defined"
        basis: "stated"
        locator: "§4.2.2.1, §3"
        quotes:
          - |-
            The id-ad-ocsp OID is used when revocation information for the certificate containing this extension is available using the Online Certificate Status Protocol (OCSP) [RFC2560].
          - |-
            When id-ad-ocsp appears as accessMethod, the accessLocation field is the location of the OCSP responder, using the conventions defined in [RFC2560].
        on_error: "defined in RFC 2560, not here."
        on_error_basis: "unspecified"
  - name: "subject-information-retrieval-sia"
    title: >-
      Subject information access: a CA's repository of issued certificates, and timestamping
      services
    locator: "§4.2.2.2"
    kind: "retrieval"
    participants:
      - "relying-party"
      - "repository"
      - "timestamping-service"
    summary: >-
      SIA points to information and services of the certificate's subject. For a CA subject,
      id-ad-caRepository locates the certificates it issues. For an end entity subject,
      contents are defined by the protocol of the service; id-ad-timeStamping is the one the
      profile names.
    steps:
      - n: "1"
        from: "relying-party"
        to: "relying-party"
        message: "Extension:subjectInfoAccess"
        message_alternatives:
          - "GeneralName"
        action: "Read the AccessDescriptions."
        basis: "stated"
        locator: "§4.2.2.2"
        quotes:
          - |-
            The subject information access extension indicates how to access information and services for the subject of the certificate in which the extension appears.
          - |-
            When the subject is an end entity, the information describes the type of services offered and how to access them. In this case, the contents of this extension are defined in the protocol specifications for the supported services.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "relying-party"
        to: "repository"
        message: "GeneralName"
        action: >-
          id-ad-caRepository: directoryName (crossCertificatePair, cACertificate), LDAP URI,
          or HTTP/FTP URI to a DER certificate or certs-only CMS message.
        basis: "stated"
        locator: "§4.2.2.2"
        quotes:
          - |-
            The id-ad-caRepository OID is used when the subject is a CA that publishes certificates it issues in a repository.
          - |-
            Where the information is available via LDAP, the accessLocation SHOULD be a uniformResourceIdentifier.
          - |-
            The LDAP URI [RFC4516] MUST include a <dn> field containing the distinguished name of the entry holding the certificates,
          - |-
            MUST include an <attributes> field that lists appropriate attribute descriptions for the attributes that hold the DER encoded certificates or cross-certificate pairs [RFC4523],
          - |-
            and SHOULD include a <host> (e.g., <ldap://ldap.example.com/cn=CA, dc=example,dc=com?cACertificate;binary,crossCertificatePair;binary>).
          - |-
            Where the information is available via HTTP or FTP, accessLocation MUST be a uniformResourceIdentifier
          - |-
            and the URI MUST point to either a single DER encoded certificate as specified in [RFC2585] or a collection of certificates in a BER or DER encoded "certs-only" CMS message as specified in [RFC2797].
        constrained_by:
          - "rfc-5280#R-0241"
          - "rfc-5280#R-0242"
          - "rfc-5280#R-0243"
          - "rfc-5280#R-0244"
          - "rfc-5280#R-0245"
          - "rfc-5280#R-0246"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "repository"
        to: "relying-party"
        message: "Certificate"
        message_alternatives:
          - "CertsOnlyCMS"
        action: "Receive as for AIA."
        basis: "stated"
        locator: "§4.2.2.2"
        quotes:
          - |-
            The semantics of other id-ad-caRepository accessLocation name forms are not defined.
          - |-
            Conforming applications that support HTTP or FTP for accessing certificates MUST be able to accept individual DER encoded certificates
          - |-
            and SHOULD be able to accept "certs-only" CMS messages.
          - |-
            HTTP server implementations accessed via the URI SHOULD specify the media type application/pkix-cert [RFC2585] in the content-type header field of the response for a single DER encoded certificate
          - |-
            and SHOULD specify the media type application/pkcs7-mime [RFC2797] in the content-type header field of the response for "certs-only" CMS messages.
          - |-
            For FTP, the name of a file that contains a single DER encoded certificate SHOULD have a suffix of ".cer" [RFC2585]
          - |-
            and the name of a file that contains a "certs-only" CMS message SHOULD have a suffix of ".p7c" [RFC2797].
        constrained_by:
          - "rfc-5280#R-0247"
          - "rfc-5280#R-0248"
          - "rfc-5280#R-0249"
          - "rfc-5280#R-0250"
          - "rfc-5280#R-0251"
          - "rfc-5280#R-0252"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "relying-party"
        to: "timestamping-service"
        message: "GeneralName"
        action: >-
          id-ad-timeStamping: the subject offers RFC 3161 timestamping at a URI (HTTP, FTP),
          an rfc822Name (mail) or a dNSName or iPAddress (TCP/IP).
        status: "referenced-not-defined"
        basis: "stated"
        locator: "§4.2.2.2"
        quotes:
          - |-
            The id-ad-timeStamping OID is used when the subject offers timestamping services using the Time Stamp Protocol defined in [RFC3161].
          - |-
            Where timestamping services are available using TCP/IP, the dNSName or iPAddress name forms may be used. The semantics of other name forms of accessLocation (when accessMethod is id-ad-timeStamping) are not defined by this specification.
          - |-
            Where the timestamping services are available via HTTP or FTP, accessLocation MUST be a uniformResourceIdentifier.
          - |-
            Where the timestamping services are available via electronic mail, accessLocation MUST be an rfc822Name.
        constrained_by:
          - "rfc-5280#R-0254"
          - "rfc-5280#R-0255"
        on_error: "defined in RFC 3161, not here."
        on_error_basis: "unspecified"
  - name: "crl-signer-certificate-retrieval"
    title: >-
      Retrieving the certificates that verify a CRL's signature, through the CRL's
      authorityInfoAccess
    locator: "§5.2.7, §5.1.1.3"
    kind: "retrieval"
    participants:
      - "relying-party"
      - "repository"
    summary: >-
      A CRL may carry AIA with id-ad-caIssuers only, pointing to certificates whose subject
      matches the CRL issuer and whose key verifies the CRL. The relying party needs them
      for step (f) of crl-validation.
    steps:
      - n: "1"
        from: "relying-party"
        to: "relying-party"
        message: "Extension:authorityInfoAccess"
        action: "Read the CRL's AIA."
        basis: "stated"
        locator: "§5.2.7"
        quotes:
          - |-
            The id-ad-caIssuers OID is used when the information available lists certificates that can be used to verify the signature on the CRL (i.e., certificates that have a subject name that matches the issuer name on the CRL and that have a subject public key that corresponds to the private key used to sign the CRL).
          - |-
            This CRL extension MUST be marked as non-critical.
          - |-
            When present in a CRL, this extension MUST include at least one AccessDescription specifying id-ad-caIssuers as the accessMethod.
          - |-
            Access method types other than id-ad-caIssuers MUST NOT be included.
        constrained_by:
          - "rfc-5280#R-0339"
          - "rfc-5280#R-0340"
          - "rfc-5280#R-0341"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "relying-party"
        to: "repository"
        message: "GeneralName"
        action: >-
          directoryName: look in crossCertificatePair, cACertificate and userCertificate;
          LDAP and HTTP/FTP URIs as for the certificate extension.
        basis: "stated"
        locator: "§5.2.7"
        quotes:
          - |-
            When one CA public key is used to validate signatures on certificates and CRLs, the desired CA certificate is stored in the crossCertificatePair and/or cACertificate attributes as specified in [RFC4523]. When different public keys are used to validate signatures on certificates and CRLs, the desired certificate is stored in the userCertificate attribute as specified in [RFC4523].
          - |-
            Thus, implementations that support the directoryName form of accessLocation MUST be prepared to find the needed certificate in any of these three attributes.
          - |-
            Where the information is available via LDAP, the accessLocation SHOULD be a uniformResourceIdentifier.
          - |-
            The LDAP URI [RFC4516] MUST include a <dn> field containing the distinguished name of the entry holding the certificates,
          - |-
            MUST include an <attributes> field that lists appropriate attribute descriptions for the attributes that hold the DER encoded certificates or cross-certificate pairs [RFC4523],
          - |-
            and SHOULD include a <host> (e.g., <ldap://ldap.example.com/cn=CA, dc=example,dc=com?cACertificate;binary,crossCertificatePair;binary>).
          - |-
            Where the information is available via HTTP or FTP, accessLocation MUST be a uniformResourceIdentifier
          - |-
            and the URI MUST point to either a single DER encoded certificate as specified in [RFC2585] or a collection of certificates in a BER or DER encoded "certs-only" CMS message as specified in [RFC2797].
        constrained_by:
          - "rfc-5280#R-0351"
          - "rfc-5280#R-0352"
          - "rfc-5280#R-0353"
          - "rfc-5280#R-0354"
          - "rfc-5280#R-0355"
          - "rfc-5280#R-0343"
          - "rfc-5280#R-0344"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "repository"
        to: "relying-party"
        message: "Certificate"
        message_alternatives:
          - "CertsOnlyCMS"
        action: "Receive a DER certificate or certs-only CMS message."
        basis: "stated"
        locator: "§5.2.7"
        quotes:
          - |-
            Conforming applications that support HTTP or FTP for accessing certificates MUST be able to accept individual DER encoded certificates
          - |-
            and SHOULD be able to accept "certs-only" CMS messages.
          - |-
            HTTP server implementations accessed via the URI SHOULD specify the media type application/pkix-cert [RFC2585] in the content-type header field of the response for a single DER encoded certificate
          - |-
            and SHOULD specify the media type application/pkcs7-mime [RFC2797] in the content-type header field of the response for "certs-only" CMS messages.
          - |-
            For FTP, the name of a file that contains a single DER encoded certificate SHOULD have a suffix of ".cer" [RFC2585]
          - |-
            and the name of a file that contains a "certs-only" CMS message SHOULD have a suffix of ".p7c" [RFC2797].
        constrained_by:
          - "rfc-5280#R-0345"
          - "rfc-5280#R-0346"
          - "rfc-5280#R-0347"
          - "rfc-5280#R-0348"
          - "rfc-5280#R-0349"
          - "rfc-5280#R-0350"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "relying-party"
        to: "relying-party"
        message: "Certificate"
        action: >-
          Build and validate the CRL signer's path to the same trust anchor (crl-validation
          step (f)).
        invokes:
          - "basic-path-validation"
        basis: "stated"
        locator: "§5.1.1.3, §6.3.3(f), §8"
        quotes:
          - |-
            CRL checking in turn requires a separate certification path to be constructed and validated for the CA's CRL signature validation certificate.
          - |-
            Applications that perform CRL checking MUST support certification path validation when certificates and CRLs are digitally signed with the same CA private key.
          - |-
            These applications SHOULD support certification path validation when certificates and CRLs are digitally signed with different CA private keys.
          - |-
            Obtain and validate the certification path for the issuer of the complete CRL.
          - |-
            The trust anchor for the certification path MUST be the same as the trust anchor used to validate the target certificate.
          - |-
            At a minimum, implementations validating CRLs MUST ensure that the certification path of a certificate and the CRL issuer certification path used to validate the certificate terminate at the same trust anchor.
        constrained_by:
          - "rfc-5280#R-0267"
          - "rfc-5280#R-0268"
          - "rfc-5280#R-0525"
          - "rfc-5280#R-0526"
          - "rfc-5280#R-0589"
        on_error: >-
          Path invalid or different trust anchor: the CRL cannot be used (inferred from
          6.3.3(f)); the source states no outcome.
        on_error_basis: "inferred"
  - name: "trust-anchor-provisioning"
    title: "Trust anchor provisioning and withdrawal (out of band)"
    locator: "§3.5(b), §6, §6.1.1(d), §6.2, §8, §4.1.2.5"
    kind: "out-of-band"
    participants:
      - "ca"
      - "relying-party"
      - "trust-anchor"
    summary: >-
      The source treats trust anchor distribution as a security-critical out-of-band process
      beyond its scope. All it defines is what the path validation algorithm receives (trust
      anchor information, optionally as a self-signed certificate) and that a relying party
      must update it after a trusted CA's compromise or failure.
    steps:
      - n: "1"
        from: "ca"
        to: "relying-party"
        message: "TrustAnchorInfo-as-inputs"
        message_alternatives:
          - "Certificate"
        action: >-
          Install the trusted CA's public key and assured information in the client before
          it validates paths; the CA may distribute a self-signed certificate for this.
        status: "out-of-scope"
        basis: "stated"
        locator: "§3.5(b), §6.1.1(d), §8"
        quotes:
          - |-
            initialization: Before a client system can operate securely, it is necessary to install key materials that have the appropriate relationship with keys stored elsewhere in the infrastructure. For example, the client needs to be securely initialized with the public key and other assured information of the trusted CA(s), to be used in validating certificate paths.
          - |-
            The trust anchor information is trusted because it was delivered to the path processing procedure by some trustworthy out-of-band procedure.
          - |-
            The authenticated distribution of trusted CA public keys (usually in the form of a "self-signed" certificate) is a security critical out-of-band process that is beyond the scope of this specification.
        on_error: "beyond the scope of this specification."
        on_error_basis: "unspecified"
      - n: "2"
        from: "relying-party"
        to: "relying-party"
        message: "TrustAnchorInfo-as-inputs"
        action: "Choose which CAs to trust; a local decision."
        basis: "stated"
        locator: "§6, §6.2, §8"
        quotes:
          - |-
            The selection of a trust anchor is a matter of policy: it could be the top CA in a hierarchical PKI, the CA that issued the verifier's own certificate(s), or any other CA in a network PKI.
          - |-
            The selection of one or more trusted CAs is a local decision.
          - |-
            Selection of too many trusted CAs makes the trusted CA information difficult to maintain. On the other hand, selection of only one trusted CA could limit users to a closed community of users.
        on_error: "none defined."
        on_error_basis: "unspecified"
      - n: "3"
        from: "relying-party"
        to: "relying-party"
        message: "TrustAnchorInfo-as-inputs"
        action: "After key compromise or failure of a trusted CA, change the trust anchor information."
        basis: "stated"
        locator: "§8"
        quotes:
          - |-
            In addition, where a key compromise or CA failure occurs for a trusted CA, the user will need to modify the information provided to the path validation routine.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "4"
        from: "ca"
        to: "relying-party"
        message: "TrustAnchorInfo-as-inputs"
        action: >-
          An issuer that stops maintaining status information before notAfter makes every
          path to the certificate invalid, for example by ceasing use of its key as a trust
          anchor.
        status: "not-defined"
        basis: "stated"
        locator: "§4.1.2.5"
        quotes:
          - |-
            This may be accomplished by expiration or revocation of all CA certificates containing the public key used to verify the signature on the certificate and discontinuing use of the public key used to verify the signature on the certificate as a trust anchor.
          - |-
            When the issuer will not be able to maintain status information until the notAfter date (including when the notAfter date is 99991231235959Z), the issuer MUST ensure that no valid certification path exists for the certificate after maintenance of status information is terminated.
        constrained_by:
          - "rfc-5280#R-0037"
        on_error: "unspecified. How a trust anchor's withdrawal reaches relying parties is not defined."
        on_error_basis: "unspecified"
  - name: "certificate-validation-and-use"
    title: >-
      Relying party: choose a trust anchor, set the inputs, validate the path, check
      revocation, then use the key within its restrictions
    locator: "§6, §6.1, §6.2, §4.2, §4.2.1.3, §4.2.1.4, §4.2.1.9, §4.2.1.12"
    kind: "local-use"
    participants:
      - "relying-party"
      - "trust-anchor"
      - "repository"
    summary: >-
      The end-to-end use of §6. Path discovery is out of scope; validation is algorithm
      basic-path-validation; revocation is crl-validation or another mechanism. After a
      successful validation, §4 restricts what the key may be used for.
    steps:
      - n: "1"
        from: "trust-anchor"
        to: "relying-party"
        message: "TrustAnchorInfo-as-inputs"
        action: "Select one of the system's trusted CAs as the trust anchor for this path."
        basis: "stated"
        locator: "§6.2, §6.1"
        quotes:
          - |-
            A system may provide any one of its trusted CAs as the trust anchor for a particular path.
          - |-
            Different trust anchors MAY be used to validate different paths, as discussed further in Section 6.2.
        constrained_by:
          - "rfc-5280#R-0375"
        on_error: "none defined."
        on_error_basis: "unspecified"
      - n: "2"
        from: "relying-party"
        to: "repository"
        message: "Certificate"
        action: "Obtain a prospective certification path from the trust anchor to the target certificate."
        status: "out-of-scope"
        invokes:
          - "path-discovery"
        basis: "stated"
        locator: "§6.1"
        quotes:
          - |-
            The procedure performed to obtain this sequence of certificates is outside the scope of this specification.
          - |-
            A certificate MUST NOT appear more than once in a prospective certification path.
        constrained_by:
          - "rfc-5280#R-0380"
        on_error: "outside the scope of this specification."
        on_error_basis: "unspecified"
      - n: "3"
        from: "relying-party"
        to: "relying-party"
        message: "PathValidationInputs"
        action: >-
          Set the nine inputs for this path; they may differ per path and may express limits
          on the trust in this trust anchor; inputs may be taken from extensions of a
          self-signed trust anchor certificate, or ignored.
        basis: "stated"
        locator: "§6.2, §6.1.1"
        quotes:
          - |-
            The inputs to the path validation algorithm may be different for each path. The inputs used to process a path may reflect application-specific requirements or limitations in the trust accorded a particular trust anchor.
          - |-
            Implementations that use self-signed certificates to specify trust anchor information are free to process or ignore such information.
          - |-
            Conforming implementations are not required to support the setting of all of these inputs.
        constrained_by:
          - "rfc-5280#R-0397"
        on_error: "none defined."
        on_error_basis: "unspecified"
      - n: "4"
        from: "relying-party"
        to: "relying-party"
        message: "PathValidationInputs"
        action: "Run basic path validation, possibly augmented to limit the valid paths further."
        invokes:
          - "basic-path-validation"
        basis: "stated"
        locator: "§1, §6, §6.1, §6.2"
        quotes:
          - |-
            Thus, the path validation algorithm presented in Section 6.1 defines the minimum conditions for a path to be considered valid.
          - |-
            Conforming implementations of this specification are not required to implement this algorithm, but MUST provide functionality equivalent to the external behavior resulting from this procedure.
          - |-
            A conforming implementation MUST include an X.509 path processing procedure that is functionally equivalent to the external behavior of this algorithm.
          - |-
            Implementations are REQUIRED to derive the same results but are not required to use the specified procedures.
          - |-
            Therefore, an application MAY augment this algorithm to further limit the set of valid paths.
          - |-
            An implementation MAY augment the algorithm presented in Section 6.1 to further limit the set of valid certification paths that begin with a particular trust anchor.
          - |-
            For example, an implementation MAY modify the algorithm to apply a path length constraint to a specific trust anchor during the initialization phase,
          - |-
            or the application MAY require the presence of a particular alternative name form in the target certificate,
          - |-
            or the application MAY impose requirements on application-specific extensions.
        constrained_by:
          - "rfc-5280#R-0367"
          - "rfc-5280#R-0368"
          - "rfc-5280#R-0001"
          - "rfc-5280#R-0382"
          - "rfc-5280#R-0490"
          - "rfc-5280#R-0491"
          - "rfc-5280#R-0492"
          - "rfc-5280#R-0493"
        on_error: "Failure indication with a reason: the path is not valid. The reasons are not enumerated."
        on_error_basis: "stated"
        on_error_quotes:
          - |-
            If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
      - n: "5"
        from: "relying-party"
        to: "relying-party"
        message: "CRLValidationInputs"
        message_alternatives:
          - "OCSPRequest"
        action: >-
          For each certificate, establish that it is not revoked: by CRLs (crl-validation),
          by status information such as OCSP, or out of band.
        invokes:
          - "crl-validation"
        basis: "stated"
        locator: "§6.1.3(a)(3), §6.3, §4.2.2.1, §8"
        quotes:
          - |-
            Similarly, implementations of the certification path validation mechanism described in Section 6 that omit revocation checking provide less assurance than those that support it.
          - |-
            At the current time, the certificate is not revoked. This may be determined by obtaining the appropriate CRL (Section 6.3), by status information, or by out-of-band mechanisms.
        constrained_by:
          - "rfc-5280#R-0420"
        on_error: >-
          Revoked: step 6.1.3(a) fails. UNDETERMINED: unspecified (source defect
          revocation-undetermined-mapping).
        on_error_basis: "stated"
      - n: "6"
        from: "relying-party"
        to: "relying-party"
        message: "PathValidationOutputs"
        action: >-
          On success take the valid_policy_tree and the working public key, algorithm and
          parameters; display only user notices returned by validation.
        basis: "stated"
        locator: "§6.1.6, §4.2.1.4"
        quotes:
          - |-
            Only those qualifiers returned as a result of path validation are considered.
          - |-
            Only user notices returned as a result of path validation are intended for display to the user.
          - |-
            If path processing succeeds, the procedure terminates, returning a success indication together with final value of the valid_policy_tree, the working_public_key, the working_public_key_algorithm, and the working_public_key_parameters.
        constrained_by:
          - "rfc-5280#R-0489"
        on_error: "none."
        on_error_basis: "unspecified"
      - n: "7"
        from: "relying-party"
        to: "relying-party"
        message: "Certificate"
        action: >-
          Use the key only as keyUsage, basicConstraints and extKeyUsage allow; an
          application may require a particular extended key purpose.
        basis: "stated"
        locator: "§4.2.1.3, §4.2.1.9, §4.2.1.12"
        quotes:
          - |-
            If the keyUsage extension is present, then the subject public key MUST NOT be used to verify signatures on certificates or CRLs unless the corresponding keyCertSign or cRLSign bit is set.
          - |-
            If the basic constraints extension is not present in a version 3 certificate, or the extension is present but the cA boolean is not asserted, then the certified public key MUST NOT be used to verify certificate signatures.
          - |-
            If the extension is present, then the certificate MUST only be used for one of the purposes indicated.
          - |-
            Certificate using applications MAY require that the extended key usage extension be present and that a particular purpose be indicated in order for the certificate to be acceptable to that application.
          - |-
            Applications that require the presence of a particular purpose MAY reject certificates that include the anyExtendedKeyUsage OID but not the particular OID expected for the application.
          - |-
            If a certificate contains both a key usage extension and an extended key usage extension, then both extensions MUST be processed independently
          - |-
            and the certificate MUST only be used for a purpose consistent with both extensions.
          - |-
            If there is no purpose consistent with both extensions, then the certificate MUST NOT be used for any purpose.
        constrained_by:
          - "rfc-5280#R-0100"
          - "rfc-5280#R-0155"
          - "rfc-5280#R-0196"
          - "rfc-5280#R-0197"
          - "rfc-5280#R-0199"
          - "rfc-5280#R-0200"
          - "rfc-5280#R-0201"
          - "rfc-5280#R-0202"
        on_error: >-
          No purpose consistent with both keyUsage and extKeyUsage: the certificate is not
          used for any purpose.
        on_error_basis: "stated"
  - name: "path-discovery"
    title: "Path discovery (building): only what the source itself says"
    locator: "§3.2, §4.1.2.4, §4.2.1.1, §4.2.1.2, §4.2.2.1, §4.2.2.2, §5.1.1.3, §6.1, §8"
    kind: "local-use"
    status: "out-of-scope"
    participants:
      - "relying-party"
      - "repository"
      - "trust-anchor"
    summary: >-
      RFC 5280 places path discovery outside its scope (§6.1) and gives no algorithm. What
      it does give is the information a builder uses: name chaining, key identifiers, AIA
      and SIA pointers, the two paths CRL checking may need, and the rule that a certificate
      appears at most once. Every step here is a hint the source offers, not a procedure it
      specifies. There is no §8 discussion of path building beyond the https circularity and
      the name-collision and trust anchor rules.
    steps:
      - n: "1"
        from: "relying-party"
        to: "relying-party"
        message: "Certificate"
        action: "Discovery is out of scope."
        status: "out-of-scope"
        basis: "stated"
        locator: "§6.1"
        quotes:
          - |-
            Verifying the binding between the name and subject public key requires obtaining a sequence of certificates that support that binding. The procedure performed to obtain this sequence of certificates is outside the scope of this specification.
        on_error: "outside the scope of this specification."
        on_error_basis: "stated"
      - n: "2"
        from: "trust-anchor"
        to: "relying-party"
        message: "TrustAnchorInfo-as-inputs"
        action: "Paths start at a CA in the user's own domain or at the top of a hierarchy."
        basis: "stated"
        locator: "§3.2"
        quotes:
          - |-
            (a) Certification paths start with a public key of a CA in a user's own domain, or with the public key of the top of a hierarchy. Starting with the public key of a CA in a user's own domain has certain advantages. In some environments, the local domain is the most trusted.
        on_error: "none."
        on_error_basis: "unspecified"
      - n: "3"
        from: "relying-party"
        to: "relying-party"
        message: "Name"
        action: >-
          Chain by name: match each certificate's issuer DN to the subject DN of a CA
          certificate, by the §7.1 rules.
        invokes:
          - "dn-comparison"
        basis: "stated"
        locator: "§4.1.2.4"
        quotes:
          - |-
            Name chaining is performed by matching the issuer distinguished name in one certificate with the subject name in a CA certificate. Rules for comparing distinguished names are specified in Section 7.1.
          - |-
            Certificate users MUST be prepared to process the issuer distinguished name and subject distinguished name (Section 4.1.2.6) fields to perform name chaining for certification path validation (Section 6).
        constrained_by:
          - "rfc-5280#R-0032"
        on_error: "none."
        on_error_basis: "unspecified"
      - n: "4"
        from: "relying-party"
        to: "relying-party"
        message: "Extension:authorityKeyIdentifier"
        message_alternatives:
          - "Extension:subjectKeyIdentifier"
        action: >-
          Use key identifiers to pick the issuer certificate when an issuer has several
          keys; validation itself need not check them.
        basis: "stated"
        locator: "§4.2.1.1, §4.2.1.2"
        quotes:
          - |-
            In this case, the subject and authority key identifiers would be identical, but only the subject key identifier is needed for certification path building.
          - |-
            Applications are not required to verify that key identifiers match when performing certification path validation.
          - |-
            The keyIdentifier field of the authorityKeyIdentifier extension MUST be included in all certificates generated by conforming CAs to facilitate certification path construction.
          - |-
            To facilitate certification path construction, this extension MUST appear in all conforming CA certificates, that is, all certificates including the basic constraints extension (Section 4.2.1.9) where the value of cA is TRUE.
          - |-
            In conforming CA certificates, the value of the subject key identifier MUST be the value placed in the key identifier field of the authority key identifier extension (Section 4.2.1.1) of certificates issued by the subject of this certificate.
          - |-
            This profile RECOMMENDS support for the key identifier method by all certificate users.
        constrained_by:
          - "rfc-5280#R-0082"
          - "rfc-5280#R-0089"
          - "rfc-5280#R-0090"
          - "rfc-5280#R-0087"
        on_error: "none."
        on_error_basis: "unspecified"
      - n: "5"
        from: "repository"
        to: "relying-party"
        message: "Certificate"
        message_alternatives:
          - "CertsOnlyCMS"
          - "Extension:authorityInfoAccess"
          - "Extension:subjectInfoAccess"
        action: >-
          Fetch candidate issuer certificates from AIA caIssuers, and a CA's issued
          certificates from SIA caRepository.
        invokes:
          - "ca-certificate-retrieval-aia"
          - "subject-information-retrieval-sia"
        basis: "stated"
        locator: "§4.2.2.1, §4.2.2.2"
        quotes:
          - |-
            The referenced CA issuers description is intended to aid certificate users in the selection of a certification path that terminates at a point trusted by the certificate user.
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "6"
        from: "relying-party"
        to: "relying-party"
        message: "Certificate"
        action: >-
          Never put one certificate in a prospective path twice; a self-signed trust anchor
          certificate is not part of the path.
        basis: "stated"
        locator: "§6.1"
        quotes:
          - |-
            A certificate MUST NOT appear more than once in a prospective certification path.
          - |-
            When the trust anchor is provided in the form of a self-signed certificate, this self-signed certificate is not included as part of the prospective certification path.
        constrained_by:
          - "rfc-5280#R-0380"
          - "rfc-5280#R-0381"
        on_error: >-
          A path with a repeated certificate is not a prospective path; no step of 6.1
          detects it (source defect duplicate-certificate-no-step).
        on_error_basis: "inferred"
      - n: "7"
        from: "relying-party"
        to: "relying-party"
        message: "Certificate"
        action: "When CRLs are checked, build a second path for the CRL signer, to the same trust anchor."
        basis: "stated"
        locator: "§5.1.1.3, §6.3.3(f), §8"
        quotes:
          - |-
            Many applications construct a certification path, and then validate the certification path (Section 6). CRL checking in turn requires a separate certification path to be constructed and validated for the CA's CRL signature validation certificate.
          - |-
            Applications that perform CRL checking MUST support certification path validation when certificates and CRLs are digitally signed with the same CA private key.
          - |-
            These applications SHOULD support certification path validation when certificates and CRLs are digitally signed with different CA private keys.
          - |-
            The trust anchor for the certification path MUST be the same as the trust anchor used to validate the target certificate.
          - |-
            At a minimum, implementations validating CRLs MUST ensure that the certification path of a certificate and the CRL issuer certification path used to validate the certificate terminate at the same trust anchor.
        constrained_by:
          - "rfc-5280#R-0267"
          - "rfc-5280#R-0268"
          - "rfc-5280#R-0526"
          - "rfc-5280#R-0589"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "8"
        from: "relying-party"
        to: "relying-party"
        message: "Name"
        action: "Expect unrelated CAs and CRL issuers with the same name."
        basis: "stated"
        locator: "§8"
        quotes:
          - |-
            Implementers should take into account the possible existence of multiple unrelated CAs and CRL issuers with the same name.
          - |-
            As a means of reducing problems and security issues related to issuer name collisions, CA and CRL issuer names SHOULD be formed in a way that reduces the likelihood of name collisions.
          - |-
            At a minimum, implementations validating CRLs MUST ensure that the certification path of a certificate and the CRL issuer certification path used to validate the certificate terminate at the same trust anchor.
        constrained_by:
          - "rfc-5280#R-0588"
          - "rfc-5280#R-0589"
        on_error: "unspecified."
        on_error_basis: "unspecified"
  - name: "ca-key-rollover-self-issued"
    title: "CA key rollover and other operational changes signalled with self-issued certificates"
    locator: "§3.2, §6.1, §4.2.1.10, §8"
    kind: "issuance"
    participants:
      - "ca"
      - "repository"
      - "relying-party"
    summary: >-
      A CA can certify its new key with its old one and vice versa in two self-issued
      certificates; the detailed procedure is RFC 4210's. Path validation does not count
      self-issued intermediates toward path length or name constraints.
    steps:
      - n: "1"
        from: "ca"
        to: "repository"
        message: "Certificate"
        action: "Issue the two self-issued certificates linking the old and the new key."
        status: "referenced-not-defined"
        basis: "stated"
        locator: "§8, §3.2"
        quotes:
          - |-
            Detailed procedures for "CA key update" are specified in [RFC4210], where the CA protects its new public key using its previous private key and vice versa using two self-issued certificates.
          - |-
            Self-issued certificates are generated to support changes in policy or operations.
          - |-
            Self-issued certificates MAY be used to support other changes in CA operations, such as additions to the CA's policy set, using similar procedures.
        constrained_by:
          - "rfc-5280#R-0593"
        on_error: "defined in RFC 4210, not here."
        on_error_basis: "unspecified"
      - n: "2"
        from: "repository"
        to: "relying-party"
        message: "Certificate"
        action: "The relying party processes the self-issued certificate within a path."
        invokes:
          - "basic-path-validation"
        basis: "stated"
        locator: "§8, §6.1"
        quotes:
          - |-
            Conforming client implementations will process the self-issued certificate and determine whether certificates issued under the new key may be trusted.
          - |-
            However, a CA may issue a certificate to itself to support key rollover or changes in certificate policies.
          - |-
            A certificate is self-issued if the same DN appears in the subject and issuer fields (the two DNs are the same if they match according to the rules specified in Section 7.1).
          - |-
            These self-issued certificates are not counted when evaluating path length or name constraints.
        constrained_by:
          - "rfc-5280#R-0383"
          - "rfc-5280#R-0384"
        on_error: "As basic-path-validation."
        on_error_basis: "unspecified"
      - n: "3"
        from: "relying-party"
        to: "relying-party"
        message: "Extension:nameConstraints"
        action: "Skip name constraint checks on self-issued intermediates."
        basis: "stated"
        locator: "§4.2.1.10, §6.1.3(b), §6.1.3(c)"
        quotes:
          - |-
            Name constraints are not applied to self-issued certificates (unless the certificate is the final certificate in the path). (This could prevent CAs that use name constraints from employing self-issued certificates to implement key rollover.)
          - |-
            If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is within one of the permitted_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is within one of the permitted_subtrees for that name type.
          - |-
            If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is not within any of the excluded_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is not within any of the excluded_subtrees for that name type.
        constrained_by:
          - "rfc-5280#R-0422"
          - "rfc-5280#R-0423"
        on_error: "none."
        on_error_basis: "unspecified"
  - name: "ca-compromise-response"
    title: "Response to the compromise or loss of a CA signing key"
    locator: "§8"
    kind: "issuance"
    participants:
      - "ca"
      - "relying-party"
    summary: "§8's two obligations on CAs and the one action it expects of relying parties."
    steps:
      - n: "1"
        from: "ca"
        to: "ca"
        message: "CertificateList"
        action: >-
          Revoke every certificate issued to the compromised CA (through crl-issuance or
          another status mechanism).
        basis: "stated"
        locator: "§8"
        quotes:
          - |-
            If an attacker obtains the private key unnoticed, the attacker may issue bogus certificates and CRLs.
          - |-
            If such a compromise is detected, all certificates issued to the compromised CA MUST be revoked, preventing services between its users and users of other CAs.
        constrained_by:
          - "rfc-5280#R-0581"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "2"
        from: "ca"
        to: "ca"
        message: "Certificate"
        action: >-
          Keep secure backup of signing keys, without which the CA can produce neither CRLs
          nor a normal rollover.
        basis: "stated"
        locator: "§8"
        quotes:
          - |-
            Loss of a CA's private signing key may also be problematic. The CA would not be able to produce CRLs or perform normal key rollover.
          - |-
            CAs SHOULD maintain secure backup for signing keys.
        constrained_by:
          - "rfc-5280#R-0582"
        on_error: "unspecified."
        on_error_basis: "unspecified"
      - n: "3"
        from: "relying-party"
        to: "relying-party"
        message: "TrustAnchorInfo-as-inputs"
        action: "If the compromised CA is a trust anchor, modify the trust anchor information."
        basis: "stated"
        locator: "§8"
        quotes:
          - |-
            In addition, where a key compromise or CA failure occurs for a trusted CA, the user will need to modify the information provided to the path validation routine.
        on_error: "unspecified."
        on_error_basis: "unspecified"
algorithms:
  - name: "basic-path-validation"
    title: >-
      Basic path validation (§6.1): inputs, initialization, basic certificate processing,
      preparation for certificate i+1, wrap-up, outputs
    locator: "§1, §6, §6.1, §6.1.1, §6.1.2, §6.1.3, §6.1.4, §6.1.5, §6.1.6"
    performed_by:
      - "relying-party"
    status: "normative-by-equivalence"
    equivalence:
      text: >-
        Implementations need not run these steps, but must produce the same external
        behaviour. Steps for unsupported extensions may be omitted, but a certificate with
        an unsupported critical extension is rejected.
      constrained_by:
        - "rfc-5280#R-0001"
        - "rfc-5280#R-0367"
        - "rfc-5280#R-0368"
        - "rfc-5280#R-0369"
        - "rfc-5280#R-0370"
        - "rfc-5280#R-0371"
        - "rfc-5280#R-0372"
        - "rfc-5280#R-0373"
        - "rfc-5280#R-0374"
      quotes:
        - |-
          Implementations are REQUIRED to derive the same results but are not required to use the specified procedures.
        - |-
          Conforming implementations of this specification are not required to implement this algorithm, but MUST provide functionality equivalent to the external behavior resulting from this procedure.
        - |-
          A conforming implementation MUST include an X.509 path processing procedure that is functionally equivalent to the external behavior of this algorithm.
        - |-
          However, support for some of the certificate extensions processed in this algorithm are OPTIONAL for compliant implementations.
        - |-
          Clients that do not support these extensions MAY omit the corresponding steps in the path validation algorithm.
        - |-
          Clients that do not support this extension MAY omit the path validation steps where policy mappings are processed.
        - |-
          Note that clients MUST reject the certificate if it contains an unsupported critical extension.
        - |-
          While the algorithm could be extended to include checks for conformance to the profiles in Sections 4 and 5, this profile RECOMMENDS against including such checks.
        - |-
          A conforming implementation MAY also support validation with respect to some point in the past.
        - |-
          Any algorithm may be used by a particular implementation so long as it derives the correct result.
        - |-
          Therefore, the algorithm only includes checks to verify that the certification path is valid according to X.509 and does not include checks to verify that the certificates and CRLs conform to this profile.
    augmentation:
      text: >-
        An application or implementation may add conditions that further limit the valid
        paths from a trust anchor; 6.1 is the minimum.
      locator: "§6.1, §6.2"
      constrained_by:
        - "rfc-5280#R-0382"
        - "rfc-5280#R-0490"
        - "rfc-5280#R-0491"
        - "rfc-5280#R-0492"
        - "rfc-5280#R-0493"
      quotes:
        - |-
          Therefore, an application MAY augment this algorithm to further limit the set of valid paths.
        - |-
          An implementation MAY augment the algorithm presented in Section 6.1 to further limit the set of valid certification paths that begin with a particular trust anchor.
        - |-
          For example, an implementation MAY modify the algorithm to apply a path length constraint to a specific trust anchor during the initialization phase,
        - |-
          or the application MAY require the presence of a particular alternative name form in the target certificate,
        - |-
          or the application MAY impose requirements on application-specific extensions.
    path_conditions:
      text: >-
        What a prospective path must satisfy; checked by the steps below, except the
        no-repeat rule, which no step checks.
      constrained_by:
        - "rfc-5280#R-0376"
        - "rfc-5280#R-0377"
        - "rfc-5280#R-0378"
        - "rfc-5280#R-0379"
        - "rfc-5280#R-0380"
        - "rfc-5280#R-0381"
        - "rfc-5280#R-0383"
        - "rfc-5280#R-0384"
      quotes:
        - |-
          for all x in {1, ..., n-1}, the subject of certificate x is the issuer of certificate x+1;
        - |-
          certificate 1 is issued by the trust anchor;
        - |-
          certificate n is the certificate to be validated (i.e., the target certificate); and
        - |-
          for all x in {1, ..., n}, the certificate was valid at the time in question.
        - |-
          A certificate MUST NOT appear more than once in a prospective certification path.
        - |-
          When the trust anchor is provided in the form of a self-signed certificate, this self-signed certificate is not included as part of the prospective certification path.
        - |-
          A certificate is self-issued if the same DN appears in the subject and issuer fields (the two DNs are the same if they match according to the rules specified in Section 7.1).
        - |-
          These self-issued certificates are not counted when evaluating path length or name constraints.
    control:
      text: >-
        Initialization and wrap-up once; basic processing for every certificate i = 1..n;
        preparation for every certificate except n. Figure 2 is the source's flowchart.
      constrained_by:
        - "rfc-5280#R-0385"
        - "rfc-5280#R-0415"
        - "rfc-5280#R-0416"
        - "rfc-5280#R-0433"
        - "rfc-5280#R-0468"
      quotes:
        - |-
          Steps (1) and (4) are performed exactly once. Step (2) is performed for all certificates in the path. Step (3) is performed for all certificates in the path except the final certificate.
    inputs:
      - id: "6.1.1(a)"
        name: "prospective_path"
        message: "PathValidationInputs"
        description: "Certificates 1..n; certificate 1 issued by the trust anchor, n the target."
        constrained_by:
          - "rfc-5280#R-0386"
        quotes:
          - |-
            a prospective certification path of length n.
      - id: "6.1.1(b)"
        name: "current_time"
        message: "PathValidationInputs"
        description: "The time validity and revocation are judged at."
        constrained_by:
          - "rfc-5280#R-0387"
        quotes:
          - |-
            the current date/time.
      - id: "6.1.1(c)"
        name: "user-initial-policy-set"
        message: "PathValidationInputs"
        description: "Acceptable policy OIDs, or the special value any-policy."
        constrained_by:
          - "rfc-5280#R-0388"
        quotes:
          - |-
            user-initial-policy-set: A set of certificate policy identifiers naming the policies that are acceptable to the certificate user. The user-initial-policy-set contains the special value any-policy if the user is not concerned about certificate policy.
      - id: "6.1.1(d)"
        name: "trust_anchor_information"
        message: "TrustAnchorInfo-as-inputs"
        description: >-
          Trusted issuer name, public key algorithm, public key, optional parameters;
          possibly given as a self-signed certificate, whose subject and
          subjectPublicKeyInfo are then used.
        constrained_by:
          - "rfc-5280#R-0389"
          - "rfc-5280#R-0390"
        quotes:
          - |-
            trust anchor information, describing a CA that serves as a trust anchor for the certification path. The trust anchor information includes: (1) the trusted issuer name, (2) the trusted public key algorithm, (3) the trusted public key, and (4) optionally, the trusted public key parameters associated with the public key.
          - |-
            The trust anchor information may be provided to the path processing procedure in the form of a self-signed certificate. When the trust anchor information is provided in the form of a certificate, the name in the subject field is used as the trusted issuer name and the contents of the subjectPublicKeyInfo field is used as the source of the trusted public key algorithm and the trusted public key. The trust anchor information is trusted because it was delivered to the path processing procedure by some trustworthy out-of-band procedure. If the trusted public key algorithm requires parameters, then the parameters are provided along with the trusted public key.
      - id: "6.1.1(e)"
        name: "initial-policy-mapping-inhibit"
        message: "PathValidationInputs"
        description: "Boolean. Its type is not stated; the initialization treats it as set or not set."
        constrained_by:
          - "rfc-5280#R-0391"
        quotes:
          - |-
            initial-policy-mapping-inhibit, which indicates if policy mapping is allowed in the certification path.
      - id: "6.1.1(f)"
        name: "initial-explicit-policy"
        message: "PathValidationInputs"
        description: "Boolean, as (e)."
        constrained_by:
          - "rfc-5280#R-0392"
        quotes:
          - |-
            initial-explicit-policy, which indicates if the path must be valid for at least one of the certificate policies in the user-initial-policy-set.
      - id: "6.1.1(g)"
        name: "initial-any-policy-inhibit"
        message: "PathValidationInputs"
        description: "Boolean, as (e)."
        constrained_by:
          - "rfc-5280#R-0393"
        quotes:
          - |-
            initial-any-policy-inhibit, which indicates whether the anyPolicy OID should be processed if it is included in a certificate.
      - id: "6.1.1(h)"
        name: "initial-permitted-subtrees"
        message: "PathValidationInputs"
        description: >-
          One set of subtrees per name type: all names, some subtrees, or empty (no name of
          that type allowed).
        constrained_by:
          - "rfc-5280#R-0394"
          - "rfc-5280#R-0395"
        quotes:
          - |-
            initial-permitted-subtrees, which indicates for each name type (e.g., X.500 distinguished names, email addresses, or IP addresses) a set of subtrees within which all subject names in every certificate in the certification path MUST fall.
          - |-
            The initial-permitted-subtrees input includes a set for each name type. For each name type, the set may consist of a single subtree that includes all names of that name type or one or more subtrees that each specifies a subset of the names of that name type, or the set may be empty. If the set for a name type is empty, then the certification path will be considered invalid if any certificate in the certification path includes a name of that name type.
      - id: "6.1.1(i)"
        name: "initial-excluded-subtrees"
        message: "PathValidationInputs"
        description: "One set of subtrees per name type; empty means nothing excluded."
        constrained_by:
          - "rfc-5280#R-0396"
        quotes:
          - |-
            initial-excluded-subtrees, which indicates for each name type (e.g., X.500 distinguished names, email addresses, or IP addresses) a set of subtrees within which no subject name in any certificate in the certification path may fall. The initial-excluded-subtrees input includes a set for each name type. For each name type, the set may be empty or may consist of one or more subtrees that each specifies a subset of the names of that name type. If the set for a name type is empty, then no names of that name type are excluded.
    inputs_note:
      text: "Not every input has to be settable."
      constrained_by:
        - "rfc-5280#R-0397"
      quotes:
        - |-
          Conforming implementations are not required to support the setting of all of these inputs.
        - |-
          For example, a conforming implementation may be designed to validate all certification paths using a value of FALSE for initial-any-policy-inhibit.
    state_variables:
      - id: "6.1.2(a)"
        name: "valid_policy_tree"
        type: "tree of nodes {valid_policy, qualifier_set, expected_policy_set}, or NULL"
        initial_value: >-
          one node at depth 0: valid_policy anyPolicy, qualifier_set {}, expected_policy_set
          {anyPolicy}
        constrained_by:
          - "rfc-5280#R-0398"
          - "rfc-5280#R-0399"
          - "rfc-5280#R-0400"
          - "rfc-5280#R-0401"
          - "rfc-5280#R-0402"
          - "rfc-5280#R-0403"
        quotes:
          - |-
            valid_policy_tree: A tree of certificate policies with their optional qualifiers; each of the leaves of the tree represents a valid policy at this stage in the certification path validation. If valid policies exist at this stage in the certification path validation, the depth of the tree is equal to the number of certificates in the chain that have been processed. If valid policies do not exist at this stage in the certification path validation, the tree is set to NULL. Once the tree is set to NULL, policy processing ceases.
          - |-
            Each node in the valid_policy_tree includes three data objects: the valid policy, a set of associated policy qualifiers, and a set of one or more expected policy values. If the node is at depth x, the components of the node have the following semantics:
          - |-
            The valid_policy is a single policy OID representing a valid policy for the path of length x.
          - |-
            The qualifier_set is a set of policy qualifiers associated with the valid policy in certificate x.
          - |-
            The expected_policy_set contains one or more policy OIDs that would satisfy this policy in the certificate x+1.
          - |-
            The initial value of the valid_policy_tree is a single node with valid_policy anyPolicy, an empty qualifier_set, and an expected_policy_set with the single value anyPolicy. This node is considered to be at depth zero.
      - id: "6.1.2(b)"
        name: "permitted_subtrees"
        type: "per name type, a set of root names"
        initial_value: "initial-permitted-subtrees"
        constrained_by:
          - "rfc-5280#R-0404"
          - "rfc-5280#R-0405"
        quotes:
          - |-
            permitted_subtrees: a set of root names for each name type (e.g., X.500 distinguished names, email addresses, or IP addresses) defining a set of subtrees within which all subject names in subsequent certificates in the certification path MUST fall.
          - |-
            This variable includes a set for each name type, and the initial value is initial-permitted-subtrees.
      - id: "6.1.2(c)"
        name: "excluded_subtrees"
        type: "per name type, a set of root names"
        initial_value: "initial-excluded-subtrees"
        constrained_by:
          - "rfc-5280#R-0406"
        quotes:
          - |-
            excluded_subtrees: a set of root names for each name type (e.g., X.500 distinguished names, email addresses, or IP addresses) defining a set of subtrees within which no subject name in subsequent certificates in the certification path may fall. This variable includes a set for each name type, and the initial value is initial-excluded-subtrees.
      - id: "6.1.2(d)"
        name: "explicit_policy"
        type: "integer, non-increasing"
        initial_value: "0 if initial-explicit-policy is set, else n+1"
        constrained_by:
          - "rfc-5280#R-0407"
        quotes:
          - |-
            explicit_policy: an integer that indicates if a non-NULL valid_policy_tree is required. The integer indicates the number of non-self-issued certificates to be processed before this requirement is imposed. Once set, this variable may be decreased, but may not be increased. That is, if a certificate in the path requires a non-NULL valid_policy_tree, a later certificate cannot remove this requirement. If initial-explicit-policy is set, then the initial value is 0, otherwise the initial value is n+1.
      - id: "6.1.2(e)"
        name: "inhibit_anyPolicy"
        type: "integer, non-increasing"
        initial_value: "0 if initial-any-policy-inhibit is set, else n+1"
        constrained_by:
          - "rfc-5280#R-0408"
        quotes:
          - |-
            inhibit_anyPolicy: an integer that indicates whether the anyPolicy policy identifier is considered a match. The integer indicates the number of non-self-issued certificates to be processed before the anyPolicy OID, if asserted in a certificate other than an intermediate self-issued certificate, is ignored. Once set, this variable may be decreased, but may not be increased. That is, if a certificate in the path inhibits processing of anyPolicy, a later certificate cannot permit it. If initial-any-policy-inhibit is set, then the initial value is 0, otherwise the initial value is n+1.
      - id: "6.1.2(f)"
        name: "policy_mapping"
        type: "integer, non-increasing"
        initial_value: "0 if initial-policy-mapping-inhibit is set, else n+1"
        constrained_by:
          - "rfc-5280#R-0409"
        quotes:
          - |-
            policy_mapping: an integer that indicates if policy mapping is permitted. The integer indicates the number of non-self-issued certificates to be processed before policy mapping is inhibited. Once set, this variable may be decreased, but may not be increased. That is, if a certificate in the path specifies that policy mapping is not permitted, it cannot be overridden by a later certificate. If initial-policy-mapping-inhibit is set, then the initial value is 0, otherwise the initial value is n+1.
      - id: "6.1.2(g)"
        name: "working_public_key_algorithm"
        type: "algorithm"
        initial_value: "trusted public key algorithm"
        constrained_by:
          - "rfc-5280#R-0410"
        quotes:
          - |-
            working_public_key_algorithm: the digital signature algorithm used to verify the signature of a certificate. The working_public_key_algorithm is initialized from the trusted public key algorithm provided in the trust anchor information.
        note: >-
          Described as a digital signature algorithm but initialized from, and later
          assigned, a public key algorithm (defect working-key-algorithm-term).
      - id: "6.1.2(h)"
        name: "working_public_key"
        type: "public key"
        initial_value: "trusted public key"
        constrained_by:
          - "rfc-5280#R-0411"
        quotes:
          - |-
            working_public_key: the public key used to verify the signature of a certificate. The working_public_key is initialized from the trusted public key provided in the trust anchor information.
      - id: "6.1.2(i)"
        name: "working_public_key_parameters"
        type: "parameters or null"
        initial_value: "trusted public key parameters"
        constrained_by:
          - "rfc-5280#R-0412"
        quotes:
          - |-
            working_public_key_parameters: parameters associated with the current public key that may be required to verify a signature (depending upon the algorithm). The working_public_key_parameters variable is initialized from the trusted public key parameters provided in the trust anchor information.
      - id: "6.1.2(j)"
        name: "working_issuer_name"
        type: "distinguished name"
        initial_value: "trusted issuer name"
        constrained_by:
          - "rfc-5280#R-0413"
        quotes:
          - |-
            working_issuer_name: the issuer distinguished name expected in the next certificate in the chain. The working_issuer_name is initialized to the trusted issuer name provided in the trust anchor information.
      - id: "6.1.2(k)"
        name: "max_path_length"
        type: "integer"
        initial_value: "n"
        constrained_by:
          - "rfc-5280#R-0414"
        quotes:
          - |-
            max_path_length: this integer is initialized to n, is decremented for each non-self-issued certificate in the path, and may be reduced to the value in the path length constraint field within the basic constraints extension of a CA certificate.
    stages:
      - name: "initialization"
        locator: "§6.1.2"
        runs: "once"
        steps:
          - id: "6.1.2"
            kind: "update"
            action: >-
              Set the eleven state variables from the nine inputs as listed under
              state_variables, then go to basic certificate processing with i = 1.
            basis: "stated"
            locator: "§6.1.2"
            quotes:
              - |-
                This initialization phase establishes eleven state variables based upon the nine inputs:
              - |-
                Upon completion of the initialization steps, perform the basic certificate processing steps specified in 6.1.3.
            constrained_by:
              - "rfc-5280#R-0415"
            note: >-
              explicit_policy, inhibit_anyPolicy, policy_mapping and max_path_length depend
              on n, the length of input (a).
      - name: "basic-certificate-processing"
        locator: "§6.1.3"
        runs: "for each certificate i in 1..n"
        steps:
          - id: "6.1.3(a)"
            kind: "check"
            action: "The certificate must satisfy all four basic checks."
            message: "Certificate"
            basis: "stated"
            locator: "§6.1.3(a), §6.1.3"
            quotes:
              - |-
                Verify the basic certificate information. The certificate MUST satisfy each of the following:
            constrained_by:
              - "rfc-5280#R-0417"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
            on_fail_quotes:
              - |-
                If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
          - id: "6.1.3(a)(1)"
            kind: "check"
            action: >-
              Verify the signature with working_public_key_algorithm, working_public_key and
              working_public_key_parameters.
            message: "Certificate"
            basis: "stated"
            locator: "§6.1.3(a)(1)"
            quotes:
              - |-
                The signature on the certificate can be verified using working_public_key_algorithm, the working_public_key, and the working_public_key_parameters.
            constrained_by:
              - "rfc-5280#R-0418"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.3(a)(2)"
            kind: "check"
            action: "The validity period (notBefore through notAfter, inclusive) contains the current time."
            message: "TBSCertificate"
            basis: "stated"
            locator: "§6.1.3(a)(2), §4.1.2.5"
            quotes:
              - |-
                The validity period for a certificate is the period of time from notBefore through notAfter, inclusive.
              - |-
                The certificate validity period includes the current time.
            constrained_by:
              - "rfc-5280#R-0419"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.3(a)(3)"
            kind: "check"
            action: >-
              The certificate is not revoked at the current time, by CRL, by status
              information or out of band.
            message: "CRLValidationInputs"
            invokes:
              - "crl-validation"
            basis: "stated"
            locator: "§6.1.3(a)(3)"
            quotes:
              - |-
                At the current time, the certificate is not revoked. This may be determined by obtaining the appropriate CRL (Section 6.3), by status information, or by out-of-band mechanisms.
            constrained_by:
              - "rfc-5280#R-0420"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
            note: >-
              How a crl-validation result of UNDETERMINED or certificateHold maps to pass or
              fail is not stated (defect revocation-undetermined-mapping).
          - id: "6.1.3(a)(4)"
            kind: "check"
            action: "The certificate's issuer name is the working_issuer_name."
            message: "TBSCertificate"
            invokes:
              - "dn-comparison"
            basis: "stated"
            locator: "§6.1.3(a)(4), §4.1.2.4"
            quotes:
              - |-
                The certificate issuer name is the working_issuer_name.
              - |-
                Certificate users MUST be prepared to process the issuer distinguished name and subject distinguished name (Section 4.1.2.6) fields to perform name chaining for certification path validation (Section 6).
            constrained_by:
              - "rfc-5280#R-0421"
              - "rfc-5280#R-0032"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.3(b)"
            kind: "check"
            condition: "not (certificate i is self-issued and i < n)"
            action: >-
              Unless i is self-issued and not the last, every subject name (the subject DN,
              and each subjectAltName name) is within the permitted_subtrees of its name
              type.
            message: "Extension:subjectAltName"
            invokes:
              - "name-constraints-check"
            basis: "stated"
            locator: "§6.1.3(b), §4.2.1.10"
            quotes:
              - |-
                If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is within one of the permitted_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is within one of the permitted_subtrees for that name type.
            constrained_by:
              - "rfc-5280#R-0422"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.3(c)"
            kind: "check"
            condition: "not (certificate i is self-issued and i < n)"
            action: >-
              Unless i is self-issued and not the last, no subject name is within the
              excluded_subtrees of its name type.
            message: "Extension:subjectAltName"
            invokes:
              - "name-constraints-check"
            basis: "stated"
            locator: "§6.1.3(c), §4.2.1.10"
            quotes:
              - |-
                If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is not within any of the excluded_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is not within any of the excluded_subtrees for that name type.
            constrained_by:
              - "rfc-5280#R-0423"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.3(d)"
            kind: "control"
            condition: "certificatePolicies present and valid_policy_tree != NULL"
            action: >-
              Process policy information, in order, when the certificate has a certificate
              policies extension and the tree is not NULL.
            message: "Extension:certificatePolicies"
            basis: "stated"
            locator: "§6.1.3(d)"
            quotes:
              - |-
                If the certificate policies extension is present in the certificate and the valid_policy_tree is not NULL, process the policy information by performing the following steps in order:
            constrained_by:
              - "rfc-5280#R-0424"
          - id: "6.1.3(d)(1)"
            kind: "control"
            action: "For each policy P other than anyPolicy, with P-OID and qualifiers P-Q, do (i) then (ii)."
            basis: "stated"
            locator: "§6.1.3(d)(1)"
            quotes:
              - |-
                For each policy P not equal to anyPolicy in the certificate policies extension, let P-OID denote the OID for policy P and P-Q denote the qualifier set for policy P. Perform the following steps in order:
            constrained_by:
              - "rfc-5280#R-0425"
          - id: "6.1.3(d)(1)(i)"
            kind: "update"
            action: >-
              Exact match: under every depth i-1 node whose expected_policy_set holds P-OID,
              add a child {P-OID, P-Q, {P-OID}}.
            basis: "stated"
            locator: "§6.1.3(d)(1)(i)"
            quotes:
              - |-
                For each node of depth i-1 in the valid_policy_tree where P-OID is in the expected_policy_set, create a child node as follows: set the valid_policy to P-OID, set the qualifier_set to P-Q, and set the expected_policy_set to {P-OID}.
            constrained_by:
              - "rfc-5280#R-0426"
            note: "Source example: Figure 4."
          - id: "6.1.3(d)(1)(ii)"
            kind: "update"
            action: >-
              No exact match and a depth i-1 node with valid_policy anyPolicy exists: add a
              child {P-OID, P-Q, {P-OID}}.
            basis: "stated"
            locator: "§6.1.3(d)(1)(ii)"
            quotes:
              - |-
                If there was no match in step (i) and the valid_policy_tree includes a node of depth i-1 with the valid_policy anyPolicy, generate a child node with the following values: set the valid_policy to P-OID, set the qualifier_set to P-Q, and set the expected_policy_set to {P-OID}.
            constrained_by:
              - "rfc-5280#R-0427"
            note: >-
              The parent of the generated node is not named; it can only be the depth i-1
              anyPolicy node (defect policy-child-parent-unnamed). Source example: Figure 5.
          - id: "6.1.3(d)(2)"
            kind: "update"
            condition: >-
              anyPolicy in certificatePolicies and (inhibit_anyPolicy > 0 or (i < n and
              certificate i is self-issued))
            action: >-
              anyPolicy asserted with qualifiers AP-Q, and inhibit_anyPolicy > 0 or (i < n
              and self-issued): under every depth i-1 node, for each expected_policy_set
              value with no child yet, add a child {value, AP-Q, {value}}.
            basis: "stated"
            locator: "§6.1.3(d)(2)"
            quotes:
              - |-
                For each node in the valid_policy_tree of depth i-1, for each value in the expected_policy_set (including anyPolicy) that does not appear in a child node, create a child node with the following values: set the valid_policy to the value from the expected_policy_set in the parent node, set the qualifier_set to AP-Q, and set the expected_policy_set to the value in the valid_policy from this node.
              - |-
                If the certificate policies extension includes the policy anyPolicy with the qualifier set AP-Q and either (a) inhibit_anyPolicy is greater than 0 or (b) i<n and the certificate is self-issued, then: For each node in the valid_policy_tree of depth i-1, for each value in the expected_policy_set (including anyPolicy) that does not appear in a child node, create a child node with the following values: set the valid_policy to the value from the expected_policy_set in the parent node, set the qualifier_set to AP-Q, and set the expected_policy_set to the value in the valid_policy from this node.
            constrained_by:
              - "rfc-5280#R-0428"
            note: >-
              Source example: Figure 6. The inner labels (a) and (b) collide with the step
              labels of 6.1.3 (defect nested-label-collision).
          - id: "6.1.3(d)(3)"
            kind: "update"
            action: "Prune: repeatedly delete every node of depth i-1 or less that has no children."
            basis: "stated"
            locator: "§6.1.3(d)(3)"
            quotes:
              - |-
                If there is a node in the valid_policy_tree of depth i-1 or less without any child nodes, delete that node. Repeat this step until there are no nodes of depth i-1 or less without children.
            constrained_by:
              - "rfc-5280#R-0429"
            note: >-
              Source example: Figure 7. If pruning removes the root the tree is empty; that
              this is NULL is implied by 6.1.2(a), not stated here (defect
              empty-tree-vs-null).
          - id: "6.1.3(e)"
            kind: "update"
            condition: "certificatePolicies absent"
            action: "No certificate policies extension: valid_policy_tree := NULL."
            basis: "stated"
            locator: "§6.1.3(e)"
            quotes:
              - |-
                If the certificate policies extension is not present, set the valid_policy_tree to NULL.
            constrained_by:
              - "rfc-5280#R-0430"
          - id: "6.1.3(f)"
            kind: "check"
            action: "explicit_policy > 0 or valid_policy_tree != NULL."
            basis: "stated"
            locator: "§6.1.3(f)"
            quotes:
              - |-
                Verify that either explicit_policy is greater than 0 or the valid_policy_tree is not equal to NULL;
            constrained_by:
              - "rfc-5280#R-0431"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.3-exit"
            kind: "control"
            action: >-
              Any failure of (a), (b), (c) or (f) ends the procedure with failure. Else go
              to 6.1.4 if i != n, to 6.1.5 if i = n.
            basis: "stated"
            locator: "§6.1.3"
            quotes:
              - |-
                If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
              - |-
                If i is not equal to n, continue by performing the preparatory steps listed in Section 6.1.4. If i is equal to n, perform the wrap-up steps listed in Section 6.1.5.
            constrained_by:
              - "rfc-5280#R-0432"
              - "rfc-5280#R-0433"
      - name: "preparation-for-certificate-i+1"
        locator: "§6.1.4"
        runs: "for each certificate i in 1..n-1"
        steps:
          - id: "6.1.4"
            kind: "control"
            action: "Steps for certificate i to prepare for certificate i+1."
            basis: "stated"
            locator: "§6.1.4"
            quotes:
              - |-
                To prepare for processing of certificate i+1, perform the following steps for certificate i:
            constrained_by:
              - "rfc-5280#R-0434"
          - id: "6.1.4(a)"
            kind: "check"
            condition: "policyMappings present"
            action: >-
              If policyMappings is present, anyPolicy is neither an issuerDomainPolicy nor a
              subjectDomainPolicy.
            message: "Extension:policyMappings"
            basis: "stated"
            locator: "§6.1.4(a)"
            quotes:
              - |-
                If a policy mappings extension is present, verify that the special value anyPolicy does not appear as an issuerDomainPolicy or a subjectDomainPolicy.
            constrained_by:
              - "rfc-5280#R-0435"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.4(b)"
            kind: "control"
            condition: "policyMappings present"
            action: >-
              If policyMappings is present, for each issuerDomainPolicy ID-P do (1) or (2)
              on policy_mapping.
            message: "Extension:policyMappings"
            basis: "stated"
            locator: "§6.1.4(b)"
            quotes:
              - |-
                If a policy mappings extension is present, then for each issuerDomainPolicy ID-P in the policy mappings extension:
            constrained_by:
              - "rfc-5280#R-0436"
            note: "Not conditioned on valid_policy_tree != NULL (defect mapping-on-null-tree)."
          - id: "6.1.4(b)(1)"
            kind: "update"
            condition: "policy_mapping > 0"
            action: >-
              policy_mapping > 0: every depth i node with valid_policy ID-P gets
              expected_policy_set := the subjectDomainPolicy values mapped from ID-P. If
              there is none but a depth i anyPolicy node exists, add under the depth i-1
              anyPolicy node a child {ID-P, anyPolicy's qualifiers in certificate i, mapped
              set}.
            basis: "stated"
            locator: "§6.1.4(b)(1)"
            quotes:
              - |-
                If the policy_mapping variable is greater than 0, for each node in the valid_policy_tree of depth i where ID-P is the valid_policy, set expected_policy_set to the set of subjectDomainPolicy values that are specified as equivalent to ID-P by the policy mappings extension.
              - |-
                If no node of depth i in the valid_policy_tree has a valid_policy of ID-P but there is a node of depth i with a valid_policy of anyPolicy, then generate a child node of the node of depth i-1 that has a valid_policy of anyPolicy as follows:
              - |-
                set the valid_policy to ID-P;
              - |-
                set the qualifier_set to the qualifier set of the policy anyPolicy in the certificate policies extension of certificate i; and
              - |-
                set the expected_policy_set to the set of subjectDomainPolicy values that are specified as equivalent to ID-P by the policy mappings extension.
            constrained_by:
              - "rfc-5280#R-0437"
              - "rfc-5280#R-0438"
              - "rfc-5280#R-0439"
              - "rfc-5280#R-0440"
              - "rfc-5280#R-0441"
          - id: "6.1.4(b)(2)"
            kind: "update"
            condition: "policy_mapping = 0"
            action: >-
              policy_mapping = 0: delete every depth i node with valid_policy ID-P, then
              prune nodes of depth i-1 or less that have no children.
            basis: "stated"
            locator: "§6.1.4(b)(2)"
            quotes:
              - |-
                If the policy_mapping variable is equal to 0:
              - |-
                delete each node of depth i in the valid_policy_tree where ID-P is the valid_policy.
              - |-
                If there is a node in the valid_policy_tree of depth i-1 or less without any child nodes, delete that node. Repeat this step until there are no nodes of depth i-1 or less without children.
            constrained_by:
              - "rfc-5280#R-0442"
              - "rfc-5280#R-0443"
              - "rfc-5280#R-0444"
          - id: "6.1.4(c)"
            kind: "update"
            action: "working_issuer_name := subject name of certificate i."
            basis: "stated"
            locator: "§6.1.4(c)"
            quotes:
              - |-
                Assign the certificate subject name to working_issuer_name.
            constrained_by:
              - "rfc-5280#R-0445"
          - id: "6.1.4(d)"
            kind: "update"
            action: "working_public_key := subjectPublicKey of certificate i."
            basis: "stated"
            locator: "§6.1.4(d)"
            quotes:
              - |-
                Assign the certificate subjectPublicKey to working_public_key.
            constrained_by:
              - "rfc-5280#R-0446"
          - id: "6.1.4(e)"
            kind: "update"
            action: >-
              Non-null parameters in subjectPublicKeyInfo.algorithm:
              working_public_key_parameters := those parameters. Null or omitted: if the key
              algorithm differs from working_public_key_algorithm,
              working_public_key_parameters := null (otherwise the old parameters are kept).
            basis: "stated"
            locator: "§6.1.4(e)"
            quotes:
              - |-
                If the subjectPublicKeyInfo field of the certificate contains an algorithm field with non-null parameters, assign the parameters to the working_public_key_parameters variable.
              - |-
                If the subjectPublicKeyInfo field of the certificate contains an algorithm field with null parameters or parameters are omitted, compare the certificate subjectPublicKey algorithm to the working_public_key_algorithm. If the certificate subjectPublicKey algorithm and the working_public_key_algorithm are different, set the working_public_key_parameters to null.
            constrained_by:
              - "rfc-5280#R-0447"
              - "rfc-5280#R-0448"
            note: >-
              Must run before (f), which overwrites working_public_key_algorithm. Keeping
              the previous parameters when the algorithm is unchanged is the reading of the
              silence, not a stated rule.
          - id: "6.1.4(f)"
            kind: "update"
            action: "working_public_key_algorithm := subjectPublicKey algorithm of certificate i."
            basis: "stated"
            locator: "§6.1.4(f)"
            quotes:
              - |-
                Assign the certificate subjectPublicKey algorithm to the working_public_key_algorithm variable.
            constrained_by:
              - "rfc-5280#R-0449"
          - id: "6.1.4(g)"
            kind: "control"
            condition: "nameConstraints present"
            action: "If nameConstraints is present, update the subtree state variables."
            message: "Extension:nameConstraints"
            invokes:
              - "name-constraints-check"
            basis: "stated"
            locator: "§6.1.4(g)"
            quotes:
              - |-
                If a name constraints extension is included in the certificate, modify the permitted_subtrees and excluded_subtrees state variables as follows:
            constrained_by:
              - "rfc-5280#R-0450"
          - id: "6.1.4(g)(1)"
            kind: "update"
            action: >-
              permittedSubtrees present: per name type it contains, permitted_subtrees :=
              previous ∩ extension value; other name types unchanged.
            message: "GeneralName"
            basis: "stated"
            locator: "§6.1.4(g)(1)"
            quotes:
              - |-
                For example, the intersection of example.com and foo.example.com is foo.example.com. And the intersection of example.com and example.net is the empty set.
              - |-
                If permittedSubtrees is present in the certificate, set the permitted_subtrees state variable to the intersection of its previous value and the value indicated in the extension field. If permittedSubtrees does not include a particular name type, the permitted_subtrees state variable is unchanged for that name type. For example, the intersection of example.com and foo.example.com is foo.example.com. And the intersection of example.com and example.net is the empty set.
            constrained_by:
              - "rfc-5280#R-0451"
            note: >-
              An empty intersection leaves an empty set for that name type, which by
              6.1.1(h) makes any later name of that type fail 6.1.3(b). Intersection is
              defined only by DNS examples (defect subtree-intersection-undefined).
          - id: "6.1.4(g)(2)"
            kind: "update"
            action: >-
              excludedSubtrees present: per name type it contains, excluded_subtrees :=
              previous ∪ extension value; other name types unchanged.
            message: "GeneralName"
            basis: "stated"
            locator: "§6.1.4(g)(2)"
            quotes:
              - |-
                For example, the union of the name spaces example.com and foo.example.com is example.com. And the union of example.com and example.net is both name spaces.
              - |-
                If excludedSubtrees is present in the certificate, set the excluded_subtrees state variable to the union of its previous value and the value indicated in the extension field. If excludedSubtrees does not include a particular name type, the excluded_subtrees state variable is unchanged for that name type. For example, the union of the name spaces example.com and foo.example.com is example.com. And the union of example.com and example.net is both name spaces.
            constrained_by:
              - "rfc-5280#R-0452"
          - id: "6.1.4(h)"
            kind: "update"
            condition: "certificate i is not self-issued"
            action: >-
              If certificate i is not self-issued, decrement each of explicit_policy,
              policy_mapping and inhibit_anyPolicy that is not 0.
            basis: "stated"
            locator: "§6.1.4(h)"
            quotes:
              - |-
                If certificate i is not self-issued:
              - |-
                If explicit_policy is not 0, decrement explicit_policy by 1.
              - |-
                If policy_mapping is not 0, decrement policy_mapping by 1.
              - |-
                If inhibit_anyPolicy is not 0, decrement inhibit_anyPolicy by 1.
            constrained_by:
              - "rfc-5280#R-0453"
              - "rfc-5280#R-0454"
              - "rfc-5280#R-0455"
              - "rfc-5280#R-0456"
          - id: "6.1.4(i)"
            kind: "update"
            action: >-
              policyConstraints present: explicit_policy := min(explicit_policy,
              requireExplicitPolicy) and policy_mapping := min(policy_mapping,
              inhibitPolicyMapping), each when the field is present.
            message: "Extension:policyConstraints"
            basis: "stated"
            locator: "§6.1.4(i)"
            quotes:
              - |-
                If a policy constraints extension is included in the certificate, modify the explicit_policy and policy_mapping state variables as follows:
              - |-
                If requireExplicitPolicy is present and is less than explicit_policy, set explicit_policy to the value of requireExplicitPolicy.
              - |-
                If inhibitPolicyMapping is present and is less than policy_mapping, set policy_mapping to the value of inhibitPolicyMapping.
            constrained_by:
              - "rfc-5280#R-0457"
              - "rfc-5280#R-0458"
              - "rfc-5280#R-0459"
            note: >-
              Runs after (h): the decrement for certificate i comes first, so
              requireExplicitPolicy 0 takes effect from certificate i+1.
          - id: "6.1.4(j)"
            kind: "update"
            action: >-
              inhibitAnyPolicy present and less than inhibit_anyPolicy: inhibit_anyPolicy :=
              its value.
            message: "Extension:inhibitAnyPolicy"
            basis: "stated"
            locator: "§6.1.4(j)"
            quotes:
              - |-
                If the inhibitAnyPolicy extension is included in the certificate and is less than inhibit_anyPolicy, set inhibit_anyPolicy to the value of inhibitAnyPolicy.
            constrained_by:
              - "rfc-5280#R-0460"
          - id: "6.1.4(k)"
            kind: "check"
            action: >-
              v3: basicConstraints present with cA TRUE. v1 or v2: the application confirms
              out of band that it is a CA, or rejects it (it may reject all v1 and v2
              intermediates).
            message: "Extension:basicConstraints"
            basis: "stated"
            locator: "§6.1.4(k)"
            quotes:
              - |-
                Conforming implementations may choose to reject all version 1 and version 2 intermediate certificates.)
              - |-
                If certificate i is a version 3 certificate, verify that the basicConstraints extension is present and that cA is set to TRUE.
              - |-
                (If certificate i is a version 1 or version 2 certificate, then the application MUST either verify that certificate i is a CA certificate through out-of-band means or reject the certificate.
            constrained_by:
              - "rfc-5280#R-0461"
              - "rfc-5280#R-0462"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.4(l)"
            kind: "check"
            condition: "certificate i is not self-issued"
            action: >-
              If certificate i is not self-issued: max_path_length > 0, then max_path_length
              := max_path_length - 1.
            basis: "stated"
            locator: "§6.1.4(l), §4.2.1.9"
            quotes:
              - |-
                If the certificate was not self-issued, verify that max_path_length is greater than zero and decrement max_path_length by 1.
            constrained_by:
              - "rfc-5280#R-0463"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
            note: >-
              Initialized to n and decremented at most n-1 times, so it can only fail after
              some pathLenConstraint lowered it in (m).
          - id: "6.1.4(m)"
            kind: "update"
            action: >-
              pathLenConstraint present and less than max_path_length: max_path_length :=
              pathLenConstraint.
            message: "Extension:basicConstraints"
            basis: "stated"
            locator: "§6.1.4(m), §4.2.1.9"
            quotes:
              - |-
                In this case, it gives the maximum number of non-self-issued intermediate certificates that may follow this certificate in a valid certification path. (Note: The last certificate in the certification path is not an intermediate certificate, and is not included in this limit. Usually, the last certificate is an end entity certificate, but it can be a CA certificate.)
              - |-
                A pathLenConstraint of zero indicates that no non-self-issued intermediate CA certificates may follow in a valid certification path.
              - |-
                If pathLenConstraint is present in the certificate and is less than max_path_length, set max_path_length to the value of pathLenConstraint.
              - |-
                Where it appears, the pathLenConstraint field MUST be greater than or equal to zero.
            constrained_by:
              - "rfc-5280#R-0464"
              - "rfc-5280#R-0156"
            note: >-
              Applies after (l), and to self-issued certificates too. With pathLenConstraint
              p in certificate i, (l) admits exactly p further non-self-issued
              intermediates; certificate n never passes through (l). This agrees with
              4.2.1.9.
          - id: "6.1.4(n)"
            kind: "check"
            action: "keyUsage present: keyCertSign is set."
            message: "Extension:keyUsage"
            basis: "stated"
            locator: "§6.1.4(n)"
            quotes:
              - |-
                If a key usage extension is present, verify that the keyCertSign bit is set.
            constrained_by:
              - "rfc-5280#R-0465"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.4(o)"
            kind: "check"
            action: >-
              Recognize and process every other critical extension; process recognized
              non-critical extensions relevant to path processing.
            message: "Extension:*"
            invokes:
              - "extension-criticality-handling"
            basis: "stated"
            locator: "§6.1.4(o), §6.1, §4.2"
            quotes:
              - |-
                Recognize and process any other critical extension present in the certificate. Process any other recognized non-critical extension present in the certificate that is relevant to path processing.
              - |-
                A certificate-using system MUST reject the certificate if it encounters a critical extension it does not recognize or a critical extension that contains information that it cannot process.
              - |-
                A non-critical extension MAY be ignored if it is not recognized,
              - |-
                but MUST be processed if it is recognized.
              - |-
                Note that clients MUST reject the certificate if it contains an unsupported critical extension.
            constrained_by:
              - "rfc-5280#R-0466"
              - "rfc-5280#R-0071"
              - "rfc-5280#R-0072"
              - "rfc-5280#R-0073"
              - "rfc-5280#R-0372"
            on_fail: "terminate: return a failure indication and an appropriate reason"
            on_fail_basis: "stated"
          - id: "6.1.4-exit"
            kind: "control"
            action: >-
              Failure of (a), (k), (l), (n) or (o) ends the procedure with failure;
              otherwise i := i + 1 and go to 6.1.3.
            basis: "stated"
            locator: "§6.1.4"
            quotes:
              - |-
                If check (a), (k), (l), (n), or (o) fails, the procedure terminates, returning a failure indication and an appropriate reason.
              - |-
                If (a), (k), (l), (n), and (o) have completed successfully, increment i and perform the basic certificate processing specified in Section 6.1.3.
            constrained_by:
              - "rfc-5280#R-0467"
              - "rfc-5280#R-0468"
      - name: "wrap-up"
        locator: "§6.1.5"
        runs: "once, for certificate n"
        steps:
          - id: "6.1.5"
            kind: "control"
            action: "Steps for the target certificate n."
            basis: "stated"
            locator: "§6.1.5"
            quotes:
              - |-
                To complete the processing of the target certificate, perform the following steps for certificate n:
            constrained_by:
              - "rfc-5280#R-0469"
          - id: "6.1.5(a)"
            kind: "update"
            action: "explicit_policy != 0: decrement it."
            basis: "stated"
            locator: "§6.1.5(a)"
            quotes:
              - |-
                If explicit_policy is not 0, decrement explicit_policy by 1.
            constrained_by:
              - "rfc-5280#R-0470"
            note: "No self-issued condition here, unlike 6.1.4(h)."
          - id: "6.1.5(b)"
            kind: "update"
            action: "policyConstraints present with requireExplicitPolicy = 0: explicit_policy := 0."
            message: "Extension:policyConstraints"
            basis: "stated"
            locator: "§6.1.5(b)"
            quotes:
              - |-
                If a policy constraints extension is included in the certificate and requireExplicitPolicy is present and has a value of 0, set the explicit_policy state variable to 0.
            constrained_by:
              - "rfc-5280#R-0471"
          - id: "6.1.5(c)"
            kind: "update"
            action: "working_public_key := subjectPublicKey of certificate n."
            basis: "stated"
            locator: "§6.1.5(c)"
            quotes:
              - |-
                Assign the certificate subjectPublicKey to working_public_key.
            constrained_by:
              - "rfc-5280#R-0472"
          - id: "6.1.5(d)"
            kind: "update"
            action: "Parameters as in 6.1.4(e)."
            basis: "stated"
            locator: "§6.1.5(d)"
            quotes:
              - |-
                If the subjectPublicKeyInfo field of the certificate contains an algorithm field with non-null parameters, assign the parameters to the working_public_key_parameters variable.
              - |-
                If the subjectPublicKeyInfo field of the certificate contains an algorithm field with null parameters or parameters are omitted, compare the certificate subjectPublicKey algorithm to the working_public_key_algorithm. If the certificate subjectPublicKey algorithm and the working_public_key_algorithm are different, set the working_public_key_parameters to null.
            constrained_by:
              - "rfc-5280#R-0473"
              - "rfc-5280#R-0474"
          - id: "6.1.5(e)"
            kind: "update"
            action: "working_public_key_algorithm := subjectPublicKey algorithm of certificate n."
            basis: "stated"
            locator: "§6.1.5(e)"
            quotes:
              - |-
                Assign the certificate subjectPublicKey algorithm to the working_public_key_algorithm variable.
            constrained_by:
              - "rfc-5280#R-0475"
          - id: "6.1.5(f)"
            kind: "check"
            action: >-
              Recognize and process every other critical extension of certificate n; process
              recognized non-critical extensions relevant to path processing.
            message: "Extension:*"
            invokes:
              - "extension-criticality-handling"
            basis: "stated"
            locator: "§6.1.5(f), §4.2, §6.1"
            quotes:
              - |-
                Recognize and process any other critical extension present in the certificate n. Process any other recognized non-critical extension present in certificate n that is relevant to path processing.
              - |-
                A certificate-using system MUST reject the certificate if it encounters a critical extension it does not recognize or a critical extension that contains information that it cannot process.
              - |-
                Note that clients MUST reject the certificate if it contains an unsupported critical extension.
            constrained_by:
              - "rfc-5280#R-0476"
              - "rfc-5280#R-0071"
              - "rfc-5280#R-0372"
            on_fail: "not stated in 6.1.5; rejection follows from 6.1 and 4.2 (R-0372, R-0071)"
            on_fail_basis: "inferred"
            note: "6.1.5 lists no failure exit (defect wrap-up-critical-extension-no-exit)."
          - id: "6.1.5(g)"
            kind: "compute"
            action: "Intersect the valid_policy_tree with the user-initial-policy-set."
            basis: "stated"
            locator: "§6.1.5(g)"
            quotes:
              - |-
                Calculate the intersection of the valid_policy_tree and the user-initial-policy-set, as follows:
            constrained_by:
              - "rfc-5280#R-0477"
            note: >-
              Whether the result replaces valid_policy_tree for the success test and the
              output is not stated (defect intersection-result-not-assigned).
          - id: "6.1.5(g)(i)"
            kind: "compute"
            action: "Tree NULL: the intersection is NULL."
            basis: "stated"
            locator: "§6.1.5(g)(i)"
            quotes:
              - |-
                If the valid_policy_tree is NULL, the intersection is NULL.
            constrained_by:
              - "rfc-5280#R-0478"
          - id: "6.1.5(g)(ii)"
            kind: "compute"
            action: >-
              Tree not NULL and user-initial-policy-set is any-policy: the intersection is
              the whole tree.
            basis: "stated"
            locator: "§6.1.5(g)(ii)"
            quotes:
              - |-
                If the valid_policy_tree is not NULL and the user-initial-policy-set is any-policy, the intersection is the entire valid_policy_tree.
            constrained_by:
              - "rfc-5280#R-0479"
          - id: "6.1.5(g)(iii)"
            kind: "compute"
            action: "Tree not NULL and user-initial-policy-set is not any-policy: steps 1 to 4."
            basis: "stated"
            locator: "§6.1.5(g)(iii)"
            quotes:
              - |-
                If the valid_policy_tree is not NULL and the user-initial-policy-set is not any-policy, calculate the intersection of the valid_policy_tree and the user-initial-policy-set as follows:
            constrained_by:
              - "rfc-5280#R-0480"
          - id: "6.1.5(g)(iii)1"
            kind: "compute"
            action: "valid_policy_node_set := the nodes whose parent has valid_policy anyPolicy."
            basis: "stated"
            locator: "§6.1.5(g)(iii)1"
            quotes:
              - |-
                Determine the set of policy nodes whose parent nodes have a valid_policy of anyPolicy. This is the valid_policy_node_set.
            constrained_by:
              - "rfc-5280#R-0481"
          - id: "6.1.5(g)(iii)2"
            kind: "update"
            action: >-
              Delete every node of that set, with its subtree, whose valid_policy is neither
              in user-initial-policy-set nor anyPolicy.
            basis: "stated"
            locator: "§6.1.5(g)(iii)2"
            quotes:
              - |-
                If the valid_policy of any node in the valid_policy_node_set is not in the user-initial-policy-set and is not anyPolicy, delete this node and all its children.
            constrained_by:
              - "rfc-5280#R-0482"
          - id: "6.1.5(g)(iii)3"
            kind: "update"
            action: >-
              If a depth n anyPolicy node exists: take its qualifier_set P-Q; for each P-OID
              of user-initial-policy-set that is not the valid_policy of a node in
              valid_policy_node_set, add {P-OID, P-Q, {P-OID}} under the depth n-1 anyPolicy
              node; delete the depth n anyPolicy node.
            basis: "stated"
            locator: "§6.1.5(g)(iii)3"
            quotes:
              - |-
                If the valid_policy_tree includes a node of depth n with the valid_policy anyPolicy and the user-initial-policy-set is not any-policy, perform the following steps:
              - |-
                Set P-Q to the qualifier_set in the node of depth n with valid_policy anyPolicy.
              - |-
                For each P-OID in the user-initial-policy-set that is not the valid_policy of a node in the valid_policy_node_set, create a child node whose parent is the node of depth n-1 with the valid_policy anyPolicy. Set the values in the child node as follows: set the valid_policy to P-OID, set the qualifier_set to P-Q, and set the expected_policy_set to {P-OID}.
              - |-
                Delete the node of depth n with the valid_policy anyPolicy.
            constrained_by:
              - "rfc-5280#R-0483"
              - "rfc-5280#R-0484"
              - "rfc-5280#R-0485"
              - "rfc-5280#R-0486"
            note: "The test 'user-initial-policy-set is not any-policy' repeats the guard of (iii)."
          - id: "6.1.5(g)(iii)4"
            kind: "update"
            action: "Prune nodes of depth n-1 or less that have no children, repeatedly."
            basis: "stated"
            locator: "§6.1.5(g)(iii)4"
            quotes:
              - |-
                If there is a node in the valid_policy_tree of depth n-1 or less without any child nodes, delete that node. Repeat this step until there are no nodes of depth n-1 or less without children.
            constrained_by:
              - "rfc-5280#R-0487"
          - id: "6.1.5-exit"
            kind: "check"
            action: "Success if explicit_policy > 0 or valid_policy_tree != NULL."
            basis: "stated"
            locator: "§6.1.5"
            quotes:
              - |-
                If either (1) the value of explicit_policy variable is greater than zero or (2) the valid_policy_tree is not NULL, then path processing has succeeded.
            constrained_by:
              - "rfc-5280#R-0488"
            on_fail: >-
              not stated; failure when explicit_policy = 0 and the tree is NULL is the
              reading of the success condition
            on_fail_basis: "inferred"
            note: "Defect wrap-up-failure-exit-implicit."
    outputs:
      message: "PathValidationOutputs"
      success:
        - "success indication"
        - "valid_policy_tree (final value)"
        - "working_public_key"
        - "working_public_key_algorithm"
        - "working_public_key_parameters"
      failure:
        - "failure indication"
        - "an appropriate reason (not enumerated)"
      locator: "§6.1.6, §6.1.3, §6.1.4, §1"
      constrained_by:
        - "rfc-5280#R-0489"
        - "rfc-5280#R-0432"
        - "rfc-5280#R-0467"
      quotes:
        - |-
          If path processing succeeds, the procedure terminates, returning a success indication together with final value of the valid_policy_tree, the working_public_key, the working_public_key_algorithm, and the working_public_key_parameters.
        - |-
          In RFC 3280, this information was returned to a relying party.
      note: >-
        The second quote (§1) records that the criticality of the certificate policies
        extensions is no longer tracked or returned.
    failure_exits:
      - step: "6.1.3(a)"
        locator: "§6.1.3"
        basis: "stated"
      - step: "6.1.3(b)"
        locator: "§6.1.3"
        basis: "stated"
      - step: "6.1.3(c)"
        locator: "§6.1.3"
        basis: "stated"
      - step: "6.1.3(f)"
        locator: "§6.1.3"
        basis: "stated"
      - step: "6.1.4(a)"
        locator: "§6.1.4"
        basis: "stated"
      - step: "6.1.4(k)"
        locator: "§6.1.4"
        basis: "stated"
      - step: "6.1.4(l)"
        locator: "§6.1.4"
        basis: "stated"
      - step: "6.1.4(n)"
        locator: "§6.1.4"
        basis: "stated"
      - step: "6.1.4(o)"
        locator: "§6.1.4"
        basis: "stated"
      - step: "6.1.5(f)"
        locator: "§6.1.5, §6.1, §4.2"
        basis: "inferred"
      - step: "6.1.5-exit"
        locator: "§6.1.5"
        basis: "inferred"
    source_examples:
      - "Figure 2 (flowchart, §6.1)"
      - "Figure 3 (initial tree, §6.1.2)"
      - "Figure 4 (exact match, §6.1.3(d)(1)(i))"
      - "Figure 5 (unmatched under anyPolicy, §6.1.3(d)(1)(ii))"
      - "Figure 6 (anyPolicy expansion, §6.1.3(d)(2))"
      - "Figure 7 (pruning, §6.1.3(d)(3))"
  - name: "crl-validation"
    title: "CRL validation (§6.3): revocation status of one certificate from complete and delta CRLs"
    locator: "§6.3, §6.3.1, §6.3.2, §6.3.3"
    performed_by:
      - "relying-party"
    status: "normative-by-equivalence"
    equivalence:
      text: >-
        Implementations that support CRLs must be functionally equivalent for CRLs issued in
        conformance with the profile.
      constrained_by:
        - "rfc-5280#R-0494"
      quotes:
        - |-
          Conforming implementations that support CRLs are not required to implement this algorithm, but they MUST be functionally equivalent to the external behavior resulting from this procedure when processing CRLs that are issued in conformance with this profile.
    assumptions:
      text: >-
        All needed CRLs are in a local cache, and a mechanism exists to fetch a current CRL
        when nextUpdate has passed.
      constrained_by:
        - "rfc-5280#R-0495"
      quotes:
        - |-
          This algorithm assumes that all of the needed CRLs are available in a local cache. Further, if the next update time of a CRL has passed, the algorithm assumes a mechanism to fetch a current CRL and place it in the local CRL cache.
        - |-
          This algorithm defines a set of inputs, a set of state variables, and processing steps that are performed for each certificate in the path. The algorithm output is the revocation status of the certificate.
    preconditions:
      - id: "unprocessable-critical-crl-extension"
        text: >-
          A CRL with a critical CRL or CRL entry extension the application cannot process is
          not used.
        basis: "stated"
        locator: "§5.2, §5.3"
        constrained_by:
          - "rfc-5280#R-0288"
          - "rfc-5280#R-0356"
        quotes:
          - |-
            If a CRL contains a critical extension that the application cannot process, then the application MUST NOT use that CRL to determine the status of certificates.
          - |-
            If a CRL contains a critical CRL entry extension that the application cannot process, then the application MUST NOT use that CRL to determine the status of any certificates.
      - id: "idp-unsupported"
        text: "Without IDP support: treat unlisted certificates as unknown, or find another CRL."
        basis: "stated"
        locator: "§5.2.5"
        constrained_by:
          - "rfc-5280#R-0319"
        quotes:
          - |-
            However, implementations that do not support this extension MUST either treat the status of any certificate not listed on this CRL as unknown or locate another CRL that does not contain any unrecognized critical extensions.
      - id: "crl-versions"
        text: >-
          v1 and v2 complete CRLs for all certificates of one CA must be processable; delta,
          indirect and other-scope CRLs need not be.
        basis: "stated"
        locator: "§5"
        constrained_by:
          - "rfc-5280#R-0260"
        quotes:
          - |-
            Conforming applications that support CRLs are REQUIRED to process both version 1 and version 2 complete CRLs that provide revocation information for all certificates issued by one CA.
      - id: "same-trust-anchor"
        text: "The certificate's path and the CRL issuer's path end at the same trust anchor."
        basis: "stated"
        locator: "§6.3.3(f), §8"
        constrained_by:
          - "rfc-5280#R-0526"
          - "rfc-5280#R-0589"
        quotes:
          - |-
            At a minimum, implementations validating CRLs MUST ensure that the certification path of a certificate and the CRL issuer certification path used to validate the certificate terminate at the same trust anchor.
    inputs:
      - id: "6.3.1(a)"
        name: "certificate"
        message: "CRLValidationInputs"
        description: >-
          Serial number and issuer name; basicConstraints (CA or end entity);
          cRLDistributionPoints and freshestCRL if present.
        constrained_by:
          - "rfc-5280#R-0496"
        quotes:
          - |-
            certificate: The algorithm requires the certificate serial number and issuer name to determine whether a certificate is on a particular CRL. The basicConstraints extension is used to determine whether the supplied certificate is associated with a CA or an end entity. If present, the algorithm uses the cRLDistributionPoints and freshestCRL extensions to determine revocation status.
      - id: "6.3.1(b)"
        name: "use-deltas"
        message: "CRLValidationInputs"
        description: "Boolean: apply delta CRLs."
        constrained_by:
          - "rfc-5280#R-0497"
        quotes:
          - |-
            use-deltas: This boolean input determines whether delta CRLs are applied to CRLs.
    implicit_inputs:
      text: >-
        Used by the steps but not listed as inputs: the current time, the local CRL cache,
        the trust anchor and inputs used for the target certificate (step f), and, for the
        fallback, the certificate's issuerAltName.
      basis: "inferred"
      locator: "§6.3.3"
      note: "Defect crl-validation-inputs-incomplete."
    state_variables:
      - id: "6.3.2(a)"
        name: "reasons_mask"
        type: >-
          set of reasons from {keyCompromise, cACompromise, affiliationChanged, superseded,
          cessationOfOperation, certificateHold, privilegeWithdrawn, aACompromise};
          all-reasons = all of them
        initial_value: "empty set"
        constrained_by:
          - "rfc-5280#R-0498"
        quotes:
          - |-
            reasons_mask: This variable contains the set of revocation reasons supported by the CRLs and delta CRLs processed so far. The legal members of the set are the possible revocation reason values minus unspecified: keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, certificateHold, privilegeWithdrawn, and aACompromise. The special value all-reasons is used to denote the set of all legal members. This variable is initialized to the empty set.
      - id: "6.3.2(b)"
        name: "cert_status"
        type: >-
          one of unspecified, keyCompromise, cACompromise, affiliationChanged, superseded,
          cessationOfOperation, certificateHold, removeFromCRL, privilegeWithdrawn,
          aACompromise, UNREVOKED, UNDETERMINED
        initial_value: "UNREVOKED"
        constrained_by:
          - "rfc-5280#R-0499"
        quotes:
          - |-
            cert_status: This variable contains the status of the certificate. This variable may be assigned one of the following values: unspecified, keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, certificateHold, removeFromCRL, privilegeWithdrawn, aACompromise, the special value UNREVOKED, or the special value UNDETERMINED. This variable is initialized to the special value UNREVOKED.
      - id: "6.3.2(c)"
        name: "interim_reasons_mask"
        type: "set of reasons"
        initial_value: "not stated; computed by step (d) for each CRL"
        constrained_by:
          - "rfc-5280#R-0500"
        quotes:
          - |-
            interim_reasons_mask: This contains the set of revocation reasons supported by the CRL or delta CRL currently being processed.
    state_note:
      quotes:
        - |-
          Note: In some environments, it is not necessary to check all reason codes. For example, some environments are only concerned with cACompromise and keyCompromise for CA certificates. This algorithm checks all reason codes. Additional processing and state variables may be necessary to limit the checking to a subset of the reason codes.
      locator: "§6.3.2"
    stages:
      - name: "distribution-point-loop"
        locator: "§6.3.3"
        runs: >-
          for each DP in cRLDistributionPoints, for each corresponding CRL in the cache,
          while reasons_mask != all-reasons and cert_status = UNREVOKED
        steps:
          - id: "6.3.3-loop"
            kind: "control"
            action: "Iterate over distribution points and their cached CRLs while undetermined."
            message: "Extension:cRLDistributionPoints"
            basis: "stated"
            locator: "§6.3.3"
            quotes:
              - |-
                This algorithm begins by assuming that the certificate is not revoked. The algorithm checks one or more CRLs until either the certificate status is determined to be revoked or sufficient CRLs have been checked to cover all reason codes.
              - |-
                For each distribution point (DP) in the certificate's CRL distribution points extension, for each corresponding CRL in the local CRL cache, while ((reasons_mask is not all-reasons) and (cert_status is UNREVOKED)) perform the following:
            constrained_by:
              - "rfc-5280#R-0501"
              - "rfc-5280#R-0502"
            note: "'corresponding CRL' is not defined (defect corresponding-crl-undefined)."
          - id: "6.3.3(a)"
            kind: "update"
            action: "Bring the cache up to date with a complete CRL, a delta CRL, or both."
            message: "CertificateList"
            invokes:
              - "crl-retrieval"
            basis: "stated"
            locator: "§6.3.3(a)"
            quotes:
              - |-
                Update the local CRL cache by obtaining a complete CRL, a delta CRL, or both, as required:
            constrained_by:
              - "rfc-5280#R-0503"
          - id: "6.3.3(a)(1)"
            kind: "control"
            condition: "current time > CRL nextUpdate"
            action: "nextUpdate of the cached CRL has passed: do (i) or (ii)."
            basis: "stated"
            locator: "§6.3.3(a)(1)"
            quotes:
              - |-
                If the current time is after the value of the CRL next update field, then do one of the following:
            constrained_by:
              - "rfc-5280#R-0504"
            note: "No rule for choosing between (i) and (ii) (defect stale-crl-choice)."
          - id: "6.3.3(a)(1)(i)"
            kind: "update"
            action: >-
              use-deltas and freshestCRL in the certificate or the CRL: obtain a delta CRL
              whose nextUpdate is after now and that can update the cached CRL as in 5.2.4.
            message: "Extension:freshestCRL"
            invokes:
              - "delta-crl-combination"
            basis: "stated"
            locator: "§6.3.3(a)(1)(i)"
            quotes:
              - |-
                If use-deltas is set and either the certificate or the CRL contains the freshest CRL extension, obtain a delta CRL with a next update value that is after the current time and can be used to update the locally cached CRL as specified in Section 5.2.4.
            constrained_by:
              - "rfc-5280#R-0505"
          - id: "6.3.3(a)(1)(ii)"
            kind: "check"
            action: >-
              Replace with a current complete CRL, verify now < its nextUpdate, continue
              with it; with use-deltas and freshestCRL, also obtain the current delta CRL
              for it.
            message: "CertificateList"
            invokes:
              - "delta-crl-combination"
            basis: "stated"
            locator: "§6.3.3(a)(1)(ii)"
            quotes:
              - |-
                Update the local CRL cache with a current complete CRL, verify that the current time is before the next update value in the new CRL, and continue processing with the new CRL. If use-deltas is set and either the certificate or the CRL contains the freshest CRL extension, then obtain the current delta CRL that can be used to update the new locally cached complete CRL as specified in Section 5.2.4.
            constrained_by:
              - "rfc-5280#R-0506"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(a)(2)"
            kind: "update"
            action: >-
              nextUpdate not passed, use-deltas set, freshestCRL in the certificate or the
              CRL: obtain the current delta CRL.
            message: "Extension:freshestCRL"
            invokes:
              - "delta-crl-combination"
            basis: "stated"
            locator: "§6.3.3(a)(2)"
            quotes:
              - |-
                If the current time is before the value of the next update field, use-deltas is set, and either the certificate or the CRL contains the freshest CRL extension, then obtain the current delta CRL that can be used to update the locally cached complete CRL as specified in Section 5.2.4.
            constrained_by:
              - "rfc-5280#R-0507"
          - id: "6.3.3(b)"
            kind: "check"
            action: "Verify the issuer and scope of the complete CRL."
            message: "CertificateList"
            basis: "stated"
            locator: "§6.3.3(b)"
            quotes:
              - |-
                Verify the issuer and scope of the complete CRL as follows:
            constrained_by:
              - "rfc-5280#R-0508"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
            note: "No step of 6.3.3 says what follows a failed verification (defect crl-verify-no-outcome)."
          - id: "6.3.3(b)(1)"
            kind: "check"
            action: >-
              DP has cRLIssuer: CRL issuer = cRLIssuer and IDP with indirectCRL asserted.
              Otherwise CRL issuer = certificate issuer.
            message: "Extension:issuingDistributionPoint"
            invokes:
              - "dn-comparison"
            basis: "stated"
            locator: "§6.3.3(b)(1)"
            quotes:
              - |-
                If the DP includes cRLIssuer, then verify that the issuer field in the complete CRL matches cRLIssuer in the DP and that the complete CRL contains an issuing distribution point extension with the indirectCRL boolean asserted. Otherwise, verify that the CRL issuer matches the certificate issuer.
            constrained_by:
              - "rfc-5280#R-0509"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(b)(2)"
            kind: "control"
            condition: "IDP present in the complete CRL"
            action: "The complete CRL has an IDP: check (i) to (iv)."
            message: "Extension:issuingDistributionPoint"
            basis: "stated"
            locator: "§6.3.3(b)(2)"
            quotes:
              - |-
                If the complete CRL includes an issuing distribution point (IDP) CRL extension, check the following:
            constrained_by:
              - "rfc-5280#R-0510"
          - id: "6.3.3(b)(2)(i)"
            kind: "check"
            action: >-
              IDP distribution point name present: one IDP name matches a name in the DP's
              distribution field, or, if the DP has none, a name in its cRLIssuer.
            message: "GeneralName"
            basis: "stated"
            locator: "§6.3.3(b)(2)(i)"
            quotes:
              - |-
                If the distribution point name is present in the IDP CRL extension and the distribution field is present in the DP, then verify that one of the names in the IDP matches one of the names in the DP. If the distribution point name is present in the IDP CRL extension and the distribution field is omitted from the DP, then verify that one of the names in the IDP matches one of the names in the cRLIssuer field of the DP.
            constrained_by:
              - "rfc-5280#R-0511"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
            note: >-
              'distribution field' means distributionPoint; matching rule and
              nameRelativeToCRLIssuer expansion not stated (defect
              idp-name-match-underspecified).
          - id: "6.3.3(b)(2)(ii)"
            kind: "check"
            action: "onlyContainsUserCerts: the certificate does not have basicConstraints with cA asserted."
            message: "Extension:basicConstraints"
            basis: "stated"
            locator: "§6.3.3(b)(2)(ii)"
            quotes:
              - |-
                If the onlyContainsUserCerts boolean is asserted in the IDP CRL extension, verify that the certificate does not include the basic constraints extension with the cA boolean asserted.
            constrained_by:
              - "rfc-5280#R-0512"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(b)(2)(iii)"
            kind: "check"
            action: "onlyContainsCACerts: the certificate has basicConstraints with cA asserted."
            message: "Extension:basicConstraints"
            basis: "stated"
            locator: "§6.3.3(b)(2)(iii)"
            quotes:
              - |-
                If the onlyContainsCACerts boolean is asserted in the IDP CRL extension, verify that the certificate includes the basic constraints extension with the cA boolean asserted.
            constrained_by:
              - "rfc-5280#R-0513"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(b)(2)(iv)"
            kind: "check"
            action: "onlyContainsAttributeCerts is not asserted."
            basis: "stated"
            locator: "§6.3.3(b)(2)(iv)"
            quotes:
              - |-
                Verify that the onlyContainsAttributeCerts boolean is not asserted.
            constrained_by:
              - "rfc-5280#R-0514"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(c)"
            kind: "check"
            condition: "use-deltas"
            action: "use-deltas: verify the delta CRL's issuer and scope."
            message: "Extension:deltaCRLIndicator"
            basis: "stated"
            locator: "§6.3.3(c)"
            quotes:
              - |-
                If use-deltas is set, verify the issuer and scope of the delta CRL as follows:
            constrained_by:
              - "rfc-5280#R-0515"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
            note: >-
              Conditioned on use-deltas, not on a delta CRL having been obtained (defect
              use-deltas-without-delta). The 5.2.4 CRL-number conditions are reached only
              through the reference in (a) (defect delta-number-check-indirect).
          - id: "6.3.3(c)(1)"
            kind: "check"
            action: "Delta CRL issuer = complete CRL issuer."
            basis: "stated"
            locator: "§6.3.3(c)(1)"
            quotes:
              - |-
                Verify that the delta CRL issuer matches the complete CRL issuer.
            constrained_by:
              - "rfc-5280#R-0516"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(c)(2)"
            kind: "check"
            action: "IDP: present in both and matching, or absent from both."
            basis: "stated"
            locator: "§6.3.3(c)(2)"
            quotes:
              - |-
                If the complete CRL includes an issuing distribution point (IDP) CRL extension, verify that the delta CRL contains a matching IDP CRL extension. If the complete CRL omits an IDP CRL extension, verify that the delta CRL also omits an IDP CRL extension.
            constrained_by:
              - "rfc-5280#R-0517"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(c)(3)"
            kind: "check"
            action: "Delta CRL AKI matches complete CRL AKI."
            message: "Extension:authorityKeyIdentifier"
            basis: "stated"
            locator: "§6.3.3(c)(3)"
            quotes:
              - |-
                Verify that the delta CRL authority key identifier extension matches the complete CRL authority key identifier extension.
            constrained_by:
              - "rfc-5280#R-0518"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(d)"
            kind: "compute"
            action: "interim_reasons_mask for this CRL."
            basis: "stated"
            locator: "§6.3.3(d)"
            quotes:
              - |-
                Compute the interim_reasons_mask for this CRL as follows:
            constrained_by:
              - "rfc-5280#R-0519"
          - id: "6.3.3(d)(1)"
            kind: "compute"
            action: "IDP onlySomeReasons and DP reasons: interim := DP reasons ∩ onlySomeReasons."
            basis: "stated"
            locator: "§6.3.3(d)(1)"
            quotes:
              - |-
                If the issuing distribution point (IDP) CRL extension is present and includes onlySomeReasons and the DP includes reasons, then set interim_reasons_mask to the intersection of reasons in the DP and onlySomeReasons in the IDP CRL extension.
            constrained_by:
              - "rfc-5280#R-0520"
          - id: "6.3.3(d)(2)"
            kind: "compute"
            action: "IDP onlySomeReasons, DP no reasons: interim := onlySomeReasons."
            basis: "stated"
            locator: "§6.3.3(d)(2)"
            quotes:
              - |-
                If the IDP CRL extension includes onlySomeReasons but the DP omits reasons, then set interim_reasons_mask to the value of onlySomeReasons in the IDP CRL extension.
            constrained_by:
              - "rfc-5280#R-0521"
          - id: "6.3.3(d)(3)"
            kind: "compute"
            action: "No IDP or no onlySomeReasons, DP reasons: interim := DP reasons."
            basis: "stated"
            locator: "§6.3.3(d)(3)"
            quotes:
              - |-
                If the IDP CRL extension is not present or omits onlySomeReasons but the DP includes reasons, then set interim_reasons_mask to the value of DP reasons.
            constrained_by:
              - "rfc-5280#R-0522"
          - id: "6.3.3(d)(4)"
            kind: "compute"
            action: "No IDP or no onlySomeReasons, DP no reasons: interim := all-reasons."
            basis: "stated"
            locator: "§6.3.3(d)(4)"
            quotes:
              - |-
                If the IDP CRL extension is not present or omits onlySomeReasons and the DP omits reasons, then set interim_reasons_mask to the special value all-reasons.
            constrained_by:
              - "rfc-5280#R-0523"
          - id: "6.3.3(e)"
            kind: "check"
            action: "interim_reasons_mask has at least one reason not already in reasons_mask."
            basis: "stated"
            locator: "§6.3.3(e)"
            quotes:
              - |-
                Verify that interim_reasons_mask includes one or more reasons that are not included in the reasons_mask.
            constrained_by:
              - "rfc-5280#R-0524"
            on_fail: "unspecified; presumably the CRL adds nothing and is skipped"
            on_fail_basis: "unspecified"
          - id: "6.3.3(f)"
            kind: "check"
            action: >-
              Obtain and validate the CRL issuer's certification path, from the same trust
              anchor as the target; if its keyUsage is present, cRLSign is set.
            message: "Certificate"
            invokes:
              - "basic-path-validation"
              - "crl-signer-certificate-retrieval"
            basis: "stated"
            locator: "§6.3.3(f)"
            quotes:
              - |-
                Obtain and validate the certification path for the issuer of the complete CRL.
              - |-
                The trust anchor for the certification path MUST be the same as the trust anchor used to validate the target certificate.
              - |-
                If a key usage extension is present in the CRL issuer's certificate, verify that the cRLSign bit is set.
            constrained_by:
              - "rfc-5280#R-0525"
              - "rfc-5280#R-0526"
              - "rfc-5280#R-0527"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
            note: "Inputs for this nested validation are not given (defect crl-issuer-path-inputs)."
          - id: "6.3.3(g)"
            kind: "check"
            action: "Verify the complete CRL's signature with the key validated in (f)."
            message: "CertificateList"
            basis: "stated"
            locator: "§6.3.3(g)"
            quotes:
              - |-
                Validate the signature on the complete CRL using the public key validated in step (f).
            constrained_by:
              - "rfc-5280#R-0528"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(h)"
            kind: "check"
            condition: "use-deltas"
            action: "use-deltas: verify the delta CRL's signature with the key validated in (f)."
            message: "CertificateList"
            basis: "stated"
            locator: "§6.3.3(h)"
            quotes:
              - |-
                If use-deltas is set, then validate the signature on the delta CRL using the public key validated in step (f).
            constrained_by:
              - "rfc-5280#R-0529"
            on_fail: "unspecified"
            on_fail_basis: "unspecified"
          - id: "6.3.3(i)"
            kind: "update"
            condition: "use-deltas"
            action: >-
              use-deltas: look for the certificate (issuer and serial, as in 5.3.3) on the
              delta CRL; if found, cert_status := its reasonCode, or unspecified if it has
              none.
            message: "Extension:reasonCode"
            basis: "stated"
            locator: "§6.3.3(i), §5.3.3"
            quotes:
              - |-
                If use-deltas is set, then search for the certificate on the delta CRL. If an entry is found that matches the certificate issuer and serial number as described in Section 5.3.3, then set the cert_status variable to the indicated reason as follows:
              - |-
                If the reason code CRL entry extension is present, set the cert_status variable to the value of the reason code CRL entry extension.
              - |-
                If the reason code CRL entry extension is not present, set the cert_status variable to the value unspecified.
            constrained_by:
              - "rfc-5280#R-0530"
              - "rfc-5280#R-0531"
              - "rfc-5280#R-0532"
          - id: "6.3.3(j)"
            kind: "update"
            condition: "cert_status = UNREVOKED"
            action: >-
              cert_status still UNREVOKED: look for the certificate on the complete CRL and
              set cert_status the same way.
            message: "Extension:certificateIssuer"
            basis: "stated"
            locator: "§6.3.3(j)"
            quotes:
              - |-
                If (cert_status is UNREVOKED), then search for the certificate on the complete CRL. If an entry is found that matches the certificate issuer and serial number as described in Section 5.3.3, then set the cert_status variable to the indicated reason as described in step (i).
            constrained_by:
              - "rfc-5280#R-0533"
          - id: "6.3.3(k)"
            kind: "update"
            action: "cert_status = removeFromCRL: cert_status := UNREVOKED."
            basis: "stated"
            locator: "§6.3.3(k)"
            quotes:
              - |-
                If (cert_status is removeFromCRL), then set cert_status to UNREVOKED.
            constrained_by:
              - "rfc-5280#R-0534"
          - id: "6.3.3(l)"
            kind: "update"
            action: "reasons_mask := reasons_mask ∪ interim_reasons_mask."
            basis: "stated"
            locator: "§6.3.3(l)"
            quotes:
              - |-
                Set the reasons_mask state variable to the union of its previous value and the value of the interim_reasons_mask state variable.
            constrained_by:
              - "rfc-5280#R-0535"
          - id: "6.3.3-return"
            kind: "control"
            action: >-
              reasons_mask = all-reasons or cert_status != UNREVOKED: status determined,
              return cert_status.
            basis: "stated"
            locator: "§6.3.3"
            quotes:
              - |-
                If ((reasons_mask is all-reasons) OR (cert_status is not UNREVOKED)), then the revocation status has been determined, so return cert_status.
            constrained_by:
              - "rfc-5280#R-0536"
      - name: "issuer-crl-fallback"
        locator: "§6.3.3"
        runs: "once, if still undetermined"
        steps:
          - id: "6.3.3-fallback"
            kind: "control"
            action: >-
              Repeat with available CRLs issued by the certificate issuer but named in no
              DP, assuming a DP with no reasons, no cRLIssuer and a distribution point name
              made from the certificate's issuer field and issuerAltName. Still
              undetermined: return UNDETERMINED.
            basis: "stated"
            locator: "§6.3.3"
            quotes:
              - |-
                If the revocation status has not been determined, repeat the process above with any available CRLs not specified in a distribution point but issued by the certificate issuer. For the processing of such a CRL, assume a DP with both the reasons and the cRLIssuer fields omitted and a distribution point name of the certificate issuer. That is, the sequence of names in fullName is generated from the certificate issuer field as well as the certificate issuerAltName extension. After processing such CRLs, if the revocation status has still not been determined, then return the cert_status UNDETERMINED.
            constrained_by:
              - "rfc-5280#R-0537"
            note: >-
              Uses issuerAltName, which 4.2.1.7 says is not used in name chaining; here it
              builds a DP name, not a chaining name.
    outputs:
      message: "CRLValidationOutputs"
      values:
        - >-
          cert_status: a revocation reason (revoked, including certificateHold), UNREVOKED,
          or UNDETERMINED
      locator: "§6.3, §6.3.3"
      constrained_by:
        - "rfc-5280#R-0536"
        - "rfc-5280#R-0537"
      note: >-
        The source returns cert_status only. reasons_mask is a state variable that ends the
        loop; it is not returned. The caller (6.1.3(a)(3)) is not told how to treat
        certificateHold or UNDETERMINED.
  - name: "name-constraints-check"
    title: "Name constraint matching per name form, used by 6.1.3(b), 6.1.3(c) and 6.1.4(g)"
    locator: "§4.2.1.10, §6.1.3(b), §6.1.3(c), §6.1.4(g), §7, §8"
    performed_by:
      - "relying-party"
    status: "normative"
    steps:
      - id: "nc-scope"
        kind: "skip-rule"
        action: >-
          Constraints apply to the subject DN and subject alternative names, only to name
          forms present, never to self-issued certificates other than the last.
        basis: "stated"
        locator: "§4.2.1.10, §6.1"
        quotes:
          - |-
            Restrictions apply to the subject distinguished name and apply to subject alternative names. Restrictions apply only when the specified name form is present. If no name of the type is in the certificate, the certificate is acceptable.
          - |-
            Name constraints are not applied to self-issued certificates (unless the certificate is the final certificate in the path).
          - |-
            These self-issued certificates are not counted when evaluating path length or name constraints.
        constrained_by:
          - "rfc-5280#R-0384"
      - id: "nc-precedence"
        kind: "check"
        action: "A name in an excluded subtree is invalid whatever the permitted subtrees say."
        basis: "stated"
        locator: "§4.2.1.10"
        quotes:
          - |-
            Any name matching a restriction in the excludedSubtrees field is invalid regardless of information appearing in the permittedSubtrees.
        on_fail: "terminate: return a failure indication and an appropriate reason"
        on_fail_basis: "stated"
      - id: "nc-capability"
        kind: "check"
        action: >-
          directoryName constraints must be processed; rfc822Name, URI, dNSName and
          iPAddress should be; a critical constraint on an unprocessed form that occurs in a
          later certificate means reject.
        message: "Extension:nameConstraints"
        basis: "stated"
        locator: "§4.2.1.10"
        quotes:
          - |-
            Applications conforming to this profile MUST be able to process name constraints that are imposed on the directoryName name form
          - |-
            and SHOULD be able to process name constraints that are imposed on the rfc822Name, uniformResourceIdentifier, dNSName, and iPAddress name forms.
          - |-
            If a name constraints extension that is marked as critical imposes constraints on a particular name form, and an instance of that name form appears in the subject field or subjectAltName extension of a subsequent certificate, then the application MUST either process the constraint or reject the certificate.
        constrained_by:
          - "rfc-5280#R-0167"
          - "rfc-5280#R-0168"
          - "rfc-5280#R-0169"
        on_fail: "reject the certificate"
        on_fail_basis: "stated"
      - id: "nc-min-max"
        kind: "check"
        action: >-
          minimum other than 0 or maximum present in a critical extension on a form that
          occurs later: process them or reject.
        message: "GeneralName"
        basis: "stated"
        locator: "§4.2.1.10"
        quotes:
          - |-
            Within this profile, the minimum and maximum fields are not used with any name forms, thus, the minimum MUST be zero,
          - |-
            and maximum MUST be absent.
          - |-
            However, if an application encounters a critical name constraints extension that specifies other values for minimum or maximum for a name form that appears in a subsequent certificate, the application MUST either process these fields or reject the certificate.
        constrained_by:
          - "rfc-5280#R-0170"
          - "rfc-5280#R-0171"
          - "rfc-5280#R-0172"
        on_fail: "reject the certificate"
        on_fail_basis: "stated"
        note: "6.1.4(g) does not mention minimum and maximum (defect min-max-not-in-algorithm)."
      - id: "nc-directoryName"
        kind: "check"
        action: >-
          Apply directoryName constraints to a non-empty subject field and to directoryName
          names in subjectAltName; a DN is within a subtree when its leading RDNs match the
          base by the 7.1 rules.
        message: "Name"
        invokes:
          - "dn-comparison"
        basis: "stated"
        locator: "§4.2.1.10, §7.1"
        quotes:
          - |-
            Restrictions of the form directoryName MUST be applied to the subject field in the certificate (when the certificate includes a non-empty subject field) and to any names of type directoryName in the subjectAltName extension.
          - |-
            When applying restrictions of the form directoryName, an implementation MUST compare DN attributes.
          - |-
            At a minimum, implementations MUST perform the DN comparison rules specified in Section 7.1.
          - |-
            A distinguished name DN1 is within the subtree defined by the distinguished name DN2 if DN1 contains at least as many RDNs as DN2, and DN1 and DN2 are a match when trailing RDNs in DN1 are ignored.
        constrained_by:
          - "rfc-5280#R-0178"
          - "rfc-5280#R-0180"
          - "rfc-5280#R-0181"
          - "rfc-5280#R-0550"
        on_fail: "terminate: return a failure indication and an appropriate reason"
        on_fail_basis: "stated"
        note: >-
          6.1.3(b)(c) do not carry the 'non-empty subject field' condition (defect
          empty-subject-in-6-1-3).
      - id: "nc-rfc822Name"
        kind: "check"
        action: >-
          rfc822Name: the constraint is a mailbox, a host, or a domain with a leading
          period; with no subjectAltName, apply it to emailAddress attributes of the subject
          DN.
        message: "GeneralName"
        invokes:
          - "email-comparison"
        basis: "stated"
        locator: "§4.2.1.10, §7.5"
        quotes:
          - |-
            To indicate a particular mailbox, the constraint is the complete mail address. For example, "root@example.com" indicates the root mailbox on the host "example.com". To indicate all Internet mail addresses on a particular host, the constraint is specified as the host name. For example, the constraint "example.com" is satisfied by any mail address at the host "example.com". To specify any address within a domain, the constraint is specified with a leading period (as with URIs). For example, ".example.com" indicates all the Internet mail addresses in the domain "example.com", but not Internet mail addresses on the host "example.com".
          - |-
            A name constraint for Internet mail addresses MAY specify a particular mailbox, all addresses at a particular host, or all mailboxes in a domain.
          - |-
            When constraints are imposed on the rfc822Name name form, but the certificate does not include a subject alternative name, the rfc822Name constraint MUST be applied to the attribute of type emailAddress in the subject distinguished name.
        constrained_by:
          - "rfc-5280#R-0176"
          - "rfc-5280#R-0177"
        on_fail: "terminate: return a failure indication and an appropriate reason"
        on_fail_basis: "stated"
        note: >-
          6.1.3(b)(c) do not mention the emailAddress fallback (defect
          emailaddress-fallback-missing).
      - id: "nc-dNSName"
        kind: "check"
        action: >-
          dNSName: satisfied by any name formed by adding zero or more labels on the left;
          labels compared case-insensitively, one by one.
        message: "GeneralName"
        invokes:
          - "dns-name-handling"
        basis: "stated"
        locator: "§4.2.1.10, §7.2"
        quotes:
          - |-
            DNS name restrictions are expressed as host.example.com. Any DNS name that can be constructed by simply adding zero or more labels to the left-hand side of the name satisfies the name constraint. For example, www.host.example.com would satisfy the constraint but host1.example.com would not.
          - |-
            As noted in Section 4.2.1.10, any DNS name that may be constructed by adding labels to the left-hand side of the domain name given as the constraint is considered to fall within the indicated subtree.
          - |-
            When evaluating name constraints, conforming implementations MUST perform a case-insensitive exact match on a label-by-label basis.
        constrained_by:
          - "rfc-5280#R-0558"
        on_fail: "terminate: return a failure indication and an appropriate reason"
        on_fail_basis: "stated"
      - id: "nc-uniformResourceIdentifier"
        kind: "check"
        action: >-
          URI: the constraint applies to the host part; a leading period means one or more
          added labels; a URI without an FQDN host in its authority means reject.
        message: "GeneralName"
        invokes:
          - "uri-comparison"
          - "dns-name-handling"
        basis: "stated"
        locator: "§4.2.1.10"
        quotes:
          - |-
            For URIs, the constraint applies to the host part of the name.
          - |-
            That is, the constraint ".example.com" is satisfied by both host.example.com and my.host.example.com. However, the constraint ".example.com" is not satisfied by "example.com". When the constraint does not begin with a period, it specifies a host.
          - |-
            The constraint MUST be specified as a fully qualified domain name and MAY specify a host or a domain.
          - |-
            When the constraint begins with a period, it MAY be expanded with one or more labels.
          - |-
            If a constraint is applied to the uniformResourceIdentifier name form and a subsequent certificate includes a subjectAltName extension with a uniformResourceIdentifier that does not include an authority component with a host name specified as a fully qualified domain name (e.g., if the URI either does not include an authority component or includes an authority component in which the host name is specified as an IP address), then the application MUST reject the certificate.
        constrained_by:
          - "rfc-5280#R-0173"
          - "rfc-5280#R-0174"
          - "rfc-5280#R-0175"
        on_fail: "reject the certificate"
        on_fail_basis: "stated"
      - id: "nc-iPAddress"
        kind: "check"
        action: "iPAddress: the constraint is address plus mask, 8 octets for IPv4 and 32 for IPv6."
        message: "GeneralName"
        basis: "stated"
        locator: "§4.2.1.10"
        quotes:
          - |-
            For example, a name constraint for "class C" subnet 192.0.2.0 is represented as the octets C0 00 02 00 FF FF FF 00, representing the CIDR notation 192.0.2.0/24 (mask 255.255.255.0).
          - |-
            The syntax of iPAddress MUST be as described in Section 4.2.1.6 with the following additions specifically for name constraints.
          - |-
            For IPv4 addresses, the iPAddress field of GeneralName MUST contain eight (8) octets, encoded in the style of RFC 4632 (CIDR) to represent an address range [RFC4632].
          - |-
            For IPv6 addresses, the iPAddress field MUST contain 32 octets similarly encoded.
        constrained_by:
          - "rfc-5280#R-0184"
          - "rfc-5280#R-0185"
          - "rfc-5280#R-0186"
        on_fail: "terminate: return a failure indication and an appropriate reason"
        on_fail_basis: "stated"
      - id: "nc-x400Address"
        kind: "check"
        action: "x400Address constraints apply to x400Address names in subjectAltName."
        message: "GeneralName"
        basis: "stated"
        locator: "§4.2.1.10"
        quotes:
          - |-
            Restrictions of the form x400Address MUST be applied to any names of type x400Address in the subjectAltName extension.
        constrained_by:
          - "rfc-5280#R-0179"
        on_fail: "terminate: return a failure indication and an appropriate reason"
        on_fail_basis: "stated"
      - id: "nc-undefined-forms"
        kind: "assume"
        action: "otherName, ediPartyName and registeredID: no semantics defined here."
        basis: "stated"
        locator: "§4.2.1.10"
        quotes:
          - |-
            The syntax and semantics for name constraints for otherName, ediPartyName, and registeredID are not defined by this specification, however, syntax and semantics for name constraints for other name forms may be specified in other documents.
        note: >-
          6.1.3(b) still requires each subjectAltName to be within the permitted subtrees of
          its type (defect undefined-name-forms).
      - id: "nc-state-update"
        kind: "update"
        action: >-
          When a CA certificate carries nameConstraints: permitted by intersection, excluded
          by union, per name type present (6.1.4(g)).
        basis: "stated"
        locator: "§6.1.4(g)"
        quotes:
          - |-
            If permittedSubtrees is present in the certificate, set the permitted_subtrees state variable to the intersection of its previous value and the value indicated in the extension field. If permittedSubtrees does not include a particular name type, the permitted_subtrees state variable is unchanged for that name type. For example, the intersection of example.com and foo.example.com is foo.example.com. And the intersection of example.com and example.net is the empty set.
          - |-
            If excludedSubtrees is present in the certificate, set the excluded_subtrees state variable to the union of its previous value and the value indicated in the extension field. If excludedSubtrees does not include a particular name type, the excluded_subtrees state variable is unchanged for that name type. For example, the union of the name spaces example.com and foo.example.com is example.com. And the union of example.com and example.net is both name spaces.
        constrained_by:
          - "rfc-5280#R-0451"
          - "rfc-5280#R-0452"
      - id: "nc-cross-form"
        kind: "assume"
        action: "A constraint on one name form does not limit other forms."
        basis: "stated"
        locator: "§8"
        quotes:
          - |-
            In general, using the nameConstraints extension to constrain one name form (e.g., DNS names) offers no protection against use of other name forms (e.g., electronic mail addresses).
  - name: "dn-comparison"
    title: >-
      Distinguished name comparison (§7.1), used for name chaining, the self-issued test,
      6.1.3(a)(4), directoryName constraints and CRL issuer matching
    locator: "§7.1, §4.1.2.4, §4.1.2.6, §6.1, §8"
    performed_by:
      - "relying-party"
    status: "normative"
    used_by:
      - "6.1 self-issued definition"
      - "6.1.3(a)(4)"
      - "6.1.3(b) and (c) directoryName"
      - "6.3.3(b)(1)"
      - "path-discovery step 3"
    steps:
      - id: "7.1-encodings"
        kind: "assume"
        action: >-
          Support UTF8String and PrintableString; TeletexString, BMPString and
          UniversalString are optional.
        basis: "stated"
        locator: "§7.1"
        quotes:
          - |-
            Conforming implementations MUST support UTF8String and PrintableString.
          - |-
            Implementations may encounter certificates and CRLs with names encoded using TeletexString, BMPString, or UniversalString, but support for these is OPTIONAL.
        constrained_by:
          - "rfc-5280#R-0538"
          - "rfc-5280#R-0539"
      - id: "7.1-prep-basis"
        kind: "compute"
        action: >-
          Compare DirectoryString attributes in PrintableString or UTF8String on the basis
          of LDAP StringPrep (RFC 4518), with caseIgnoreMatch.
        basis: "stated"
        locator: "§7.1"
        quotes:
          - |-
            Support for attribute types that use other equality matching rules is optional.
          - |-
            Conforming implementations MUST use the LDAP StringPrep profile (including insignificant space handling), as specified in [RFC4518], as the basis for comparison of distinguished name attributes encoded in either PrintableString or UTF8String.
          - |-
            Conforming implementations MUST support name comparisons using caseIgnoreMatch.
        constrained_by:
          - "rfc-5280#R-0540"
          - "rfc-5280#R-0541"
      - id: "7.1-prep"
        kind: "compute"
        action: >-
          Run the six-step RFC 4518 preparation on each DirectoryString attribute: step 2
          includes case folding per RFC 3454 B.2; step 6 compresses white space per RFC 4518
          2.6.1; attributes are stored values.
        basis: "stated"
        locator: "§7.1"
        quotes:
          - |-
            Before comparing names using the caseIgnoreMatch matching rule, conforming implementations MUST perform the six-step string preparation algorithm described in [RFC4518] for each attribute of type DirectoryString, with the following clarifications:
          - |-
            In step 2, Map, the mapping shall include case folding as specified in Appendix B.2 of [RFC3454].
          - |-
            In step 6, Insignificant Character Removal, perform white space compression as specified in Section 2.6.1, Insignificant Space Handling, of [RFC4518].
          - |-
            When performing the string preparation algorithm, attributes MUST be treated as stored values.
        constrained_by:
          - "rfc-5280#R-0542"
          - "rfc-5280#R-0543"
          - "rfc-5280#R-0544"
          - "rfc-5280#R-0545"
        note: "The step 2 clarification is lowercase 'shall' (source-defects: shall 5353)."
      - id: "7.1-dc"
        kind: "compute"
        action: "domainComponent attributes are compared per §7.3."
        invokes:
          - "dns-name-handling"
        basis: "stated"
        locator: "§7.1"
        quotes:
          - |-
            Comparisons of domainComponent attributes MUST be performed as specified in Section 7.3.
        constrained_by:
          - "rfc-5280#R-0546"
      - id: "7.1-attribute"
        kind: "compute"
        action: "Attributes match: same type and exact match of prepared values."
        basis: "stated"
        locator: "§7.1"
        quotes:
          - |-
            Two naming attributes match if the attribute types are the same and the values of the attributes are an exact match after processing with the string preparation algorithm.
        constrained_by:
          - "rfc-5280#R-0547"
      - id: "7.1-rdn"
        kind: "compute"
        action: "RDNs match: same number of attributes, each attribute of one matched in the other."
        basis: "stated"
        locator: "§7.1"
        quotes:
          - |-
            Two relative distinguished names RDN1 and RDN2 match if they have the same number of naming attributes and for each naming attribute in RDN1 there is a matching naming attribute in RDN2.
        constrained_by:
          - "rfc-5280#R-0548"
      - id: "7.1-dn"
        kind: "compute"
        action: "DNs match: same number of RDNs, pairwise matching in the same order."
        basis: "stated"
        locator: "§7.1"
        quotes:
          - |-
            Two distinguished names DN1 and DN2 match if they have the same number of RDNs, for each RDN in DN1 there is a matching RDN in DN2, and the matching RDNs appear in the same order in both DNs.
        constrained_by:
          - "rfc-5280#R-0549"
      - id: "7.1-subtree"
        kind: "compute"
        action: >-
          DN1 is within the subtree of DN2: at least as many RDNs, and matching when DN1's
          trailing RDNs are ignored.
        basis: "stated"
        locator: "§7.1"
        quotes:
          - |-
            A distinguished name DN1 is within the subtree defined by the distinguished name DN2 if DN1 contains at least as many RDNs as DN2, and DN1 and DN2 are a match when trailing RDNs in DN1 are ignored.
        constrained_by:
          - "rfc-5280#R-0550"
      - id: "4.1.2.6-unfamiliar"
        kind: "compute"
        action: >-
          Unfamiliar attribute types: MAY use the 7.1 rules if DirectoryString-encoded;
          binary comparison otherwise.
        basis: "stated"
        locator: "§4.1.2.6"
        quotes:
          - |-
            Binary comparison should be used when unfamiliar attribute types include attribute values with encoding options other than those found in DirectoryString.
          - |-
            Implementations of this specification MAY use the comparison rules in Section 7.1 to process unfamiliar attribute types (i.e., for name chaining) whose attribute values use one of the encoding options from DirectoryString.
        constrained_by:
          - "rfc-5280#R-0056"
        note: "The binary rule is lowercase 'should' (source-defects: line 1321)."
      - id: "8-minimum"
        kind: "assume"
        action: >-
          Binary comparison is the required minimum; legacy Latin1-as-TeletexString names
          may compare wrongly.
        basis: "stated"
        locator: "§8"
        quotes:
          - |-
            This specification relaxes these requirements, requiring support for binary comparison at a minimum.
          - |-
            When comparing names encoded using the Latin1String character set, false positives and negatives are possible.
        note: >-
          §8's 'binary comparison at a minimum' sits beside §7.1's MUSTs for StringPrep and
          caseIgnoreMatch (defect dn-comparison-minimum-conflict).
  - name: "dns-name-handling"
    title: "Internationalized domain names in dNSName and in domainComponent (§7.2, §7.3)"
    locator: "§7.2, §7.3, §4.2.1.10"
    performed_by:
      - "ca"
      - "relying-party"
    status: "normative"
    steps:
      - id: "7.2-toascii"
        kind: "compute"
        action: >-
          Before storing in dNSName, convert an IDN to ACE by RFC 3490 §4: stored string
          (AllowUnassigned not set), UseSTD3ASCIIRules, ToASCII on each label, label
          separators to U+002E.
        basis: "stated"
        locator: "§7.2"
        quotes:
          - |-
            To accommodate internationalized domain names in the current structure, conforming implementations MUST convert internationalized domain names to the ASCII Compatible Encoding (ACE) format as specified in Section 4 of RFC 3490 before storage in the dNSName field.
          - |-
            Specifically, conforming implementations MUST perform the conversion operation specified in Section 4 of RFC 3490, with the following clarifications:
          - |-
            in step 1, the domain name SHALL be considered a "stored string". That is, the AllowUnassigned flag SHALL NOT be set;
          - |-
            in step 3, set the flag called "UseSTD3ASCIIRules";
          - |-
            in step 4, process each label with the "ToASCII" operation; and
          - |-
            in step 5, change all label separators to U+002E (full stop).
        constrained_by:
          - "rfc-5280#R-0551"
          - "rfc-5280#R-0552"
          - "rfc-5280#R-0553"
          - "rfc-5280#R-0554"
          - "rfc-5280#R-0555"
          - "rfc-5280#R-0556"
      - id: "7.2-equality"
        kind: "compute"
        action: "DNS name equality: case-insensitive exact match on the whole name."
        basis: "stated"
        locator: "§7.2"
        quotes:
          - |-
            When comparing DNS names for equality, conforming implementations MUST perform a case-insensitive exact match on the entire DNS name.
        constrained_by:
          - "rfc-5280#R-0557"
      - id: "7.2-constraints"
        kind: "compute"
        action: "Name constraints: case-insensitive exact match label by label."
        basis: "stated"
        locator: "§7.2"
        quotes:
          - |-
            When evaluating name constraints, conforming implementations MUST perform a case-insensitive exact match on a label-by-label basis.
        constrained_by:
          - "rfc-5280#R-0558"
      - id: "7.2-display"
        kind: "compute"
        action: "For display, convert to Unicode by RFC 3490 §4 with ToUnicode and no step 5 (should)."
        basis: "stated"
        locator: "§7.2"
        quotes:
          - |-
            Implementations should convert IDNs to Unicode before display.
          - |-
            in step 4, process each label with the "ToUnicode" operation; and
          - |-
            in step 1, the domain name SHALL be considered a "stored string". That is, the AllowUnassigned flag SHALL NOT be set;
        constrained_by:
          - "rfc-5280#R-0559"
        note: "The SHALL bullet sits under a lowercase should (source-defects: 7.2 line 5427)."
      - id: "7.2-space"
        kind: "assume"
        action: "Allow for the extra length of ACE labels."
        basis: "stated"
        locator: "§7.2"
        quotes:
          - |-
            An IDN ACE label will begin with the four additional characters "xn--" and may require as many as five ASCII characters to specify a single international character.
          - |-
            Note: Implementations MUST allow for increased space requirements for IDNs.
        constrained_by:
          - "rfc-5280#R-0560"
      - id: "7.3-dc"
        kind: "compute"
        action: >-
          domainComponent: each attribute is one label, converted with ToASCII as a stored
          string; compared case-insensitively.
        basis: "stated"
        locator: "§7.3"
        quotes:
          - |-
            To represent a label from an IDN in the distinguished name, the implementation MUST perform the "ToASCII" label conversion specified in Section 4.1 of RFC 3490.
          - |-
            The label SHALL be considered a "stored string". That is, the AllowUnassigned flag SHALL NOT be set.
          - |-
            Conforming implementations shall perform a case-insensitive exact match when comparing domainComponent attributes in distinguished names, as described in Section 7.2.
        constrained_by:
          - "rfc-5280#R-0561"
          - "rfc-5280#R-0562"
          - "rfc-5280#R-0563"
        note: "The comparison rule is lowercase 'shall' (source-defects: shall 5462)."
  - name: "uri-comparison"
    title: "IRI to URI mapping and URI comparison (§7.4)"
    locator: "§7.4"
    performed_by:
      - "ca"
      - "relying-party"
    status: "normative"
    steps:
      - id: "7.4-map"
        kind: "compute"
        action: >-
          Map an IRI to a URI by RFC 3987 §3.1: NFC in step 1, step 2 on that output,
          ireg-name not converted before step 2.
        basis: "stated"
        locator: "§7.4"
        quotes:
          - |-
            To accommodate IRIs in the current structure, conforming implementations MUST map IRIs to URIs as specified in Section 3.1 of [RFC3987], with the following clarifications:
          - |-
            in step 1, generate a UCS character sequence from the original IRI format normalizing according to the NFC as specified in Variant b (normalization according to NFC);
          - |-
            perform step 2 using the output from step 1.
          - |-
            Implementations MUST NOT convert the ireg-name component before performing step 2.
        constrained_by:
          - "rfc-5280#R-0564"
          - "rfc-5280#R-0565"
          - "rfc-5280#R-0566"
          - "rfc-5280#R-0567"
      - id: "7.4-prepare"
        kind: "compute"
        action: >-
          Before comparing: IDNs to ACE (7.2); scheme and host to lowercase;
          percent-encoding normalization; path segment normalization; scheme-based
          normalization if recognized (ldap, http, https, ftp must be).
        invokes:
          - "dns-name-handling"
        basis: "stated"
        locator: "§7.4"
        quotes:
          - |-
            Before URIs may be compared, conforming implementations MUST perform a combination of the syntax-based and scheme-based normalization techniques described in [RFC3987].
          - |-
            Specifically, conforming implementations MUST prepare URIs for comparison as follows:
          - |-
            Step 1: Where IRIs allow the usage of IDNs, those names MUST be converted to ASCII Compatible Encoding as specified in Section 7.2 above.
          - |-
            Step 2: The scheme and host are normalized to lowercase, as described in Section 5.3.2.1 of [RFC3987].
          - |-
            Step 3: Perform percent-encoding normalization, as specified in Section 5.3.2.3 of [RFC3987].
          - |-
            Step 4: Perform path segment normalization, as specified in Section 5.3.2.4 of [RFC3987].
          - |-
            Step 5: If recognized, the implementation MUST perform scheme-based normalization as specified in Section 5.3.3 of [RFC3987].
          - |-
            Conforming implementations MUST recognize and perform scheme-based normalization for the following schemes: ldap, http, https, and ftp.
          - |-
            If the scheme is not recognized, step 5 is omitted.
        constrained_by:
          - "rfc-5280#R-0568"
          - "rfc-5280#R-0569"
          - "rfc-5280#R-0570"
          - "rfc-5280#R-0571"
          - "rfc-5280#R-0572"
          - "rfc-5280#R-0573"
          - "rfc-5280#R-0574"
          - "rfc-5280#R-0575"
          - "rfc-5280#R-0576"
      - id: "7.4-compare"
        kind: "compute"
        action: "Compare prepared URIs by case-sensitive exact match."
        basis: "stated"
        locator: "§7.4"
        quotes:
          - |-
            When comparing URIs for equivalence, conforming implementations shall perform a case-sensitive exact match.
        constrained_by:
          - "rfc-5280#R-0577"
        note: "Lowercase 'shall' (source-defects: shall 5533)."
  - name: "email-comparison"
    title: "Internationalized email addresses in rfc822Name (§7.5)"
    locator: "§7.5"
    performed_by:
      - "ca"
      - "relying-party"
    status: "normative"
    steps:
      - id: "7.5-ascii"
        kind: "compute"
        action: "Convert addresses to ASCII; an IDN host-part to ACE per 7.2."
        invokes:
          - "dns-name-handling"
        basis: "stated"
        locator: "§7.5"
        quotes:
          - |-
            To accommodate email addresses with internationalized domain names using the current structure, conforming implementations MUST convert the addresses into an ASCII representation.
          - |-
            Where the host-part (the Domain of the Mailbox) contains an internationalized name, the domain name MUST be converted from an IDN to the ASCII Compatible Encoding (ACE) format as specified in Section 7.2.
        constrained_by:
          - "rfc-5280#R-0578"
          - "rfc-5280#R-0579"
      - id: "7.5-match"
        kind: "compute"
        action: >-
          Match: local-parts exactly equal and host-parts equal by case-insensitive ASCII
          comparison.
        basis: "stated"
        locator: "§7.5"
        quotes:
          - |-
            1) the local-part of each name is an exact match, AND 2) the host-part of each name matches using a case-insensitive ASCII comparison.
          - |-
            Two email addresses are considered to match if: 1) the local-part of each name is an exact match, AND 2) the host-part of each name matches using a case-insensitive ASCII comparison.
        constrained_by:
          - "rfc-5280#R-0580"
  - name: "delta-crl-combination"
    title: "Combining a delta CRL with a complete CRL (§5.2.4), invoked by 6.3.3(a)"
    locator: "§5.2.4"
    performed_by:
      - "relying-party"
    status: "normative"
    steps:
      - id: "5.2.4-conditions"
        kind: "check"
        action: >-
          Combine only if: (a) same issuer; (b) same scope (IDP absent from both, or present
          with every field equal); (c) complete CRL number >= BaseCRLNumber; (d) complete
          CRL number < delta CRL number.
        basis: "stated"
        locator: "§5.2.4"
        quotes:
          - |-
            (a) The complete CRL and delta CRL have the same issuer.
          - |-
            (c) The CRL number of the complete CRL is equal to or greater than the BaseCRLNumber specified in the delta CRL. That is, the complete CRL contains (at a minimum) all the revocation information held by the referenced base CRL.
          - |-
            (d) The CRL number of the complete CRL is less than the CRL number of the delta CRL. That is, the delta CRL follows the complete CRL in the numbering sequence.
          - |-
            A complete CRL and a delta CRL MAY be combined if the following four conditions are satisfied: (a) The complete CRL and delta CRL have the same issuer. (b) The complete CRL and delta CRL have the same scope. The two CRLs have the same scope if either of the following conditions are met: (1) The issuingDistributionPoint extension is omitted from both the complete CRL and the delta CRL. (2) The issuingDistributionPoint extension is present in both the complete CRL and the delta CRL, and the values for each of the fields in the extensions are the same in both CRLs. (c) The CRL number of the complete CRL is equal to or greater than the BaseCRLNumber specified in the delta CRL. That is, the complete CRL contains (at a minimum) all the revocation information held by the referenced base CRL. (d) The CRL number of the complete CRL is less than the CRL number of the delta CRL. That is, the delta CRL follows the complete CRL in the numbering sequence.
        constrained_by:
          - "rfc-5280#R-0310"
        on_fail: "do not combine"
        on_fail_basis: "inferred"
      - id: "5.2.4-result"
        kind: "compute"
        action: >-
          The locally constructed CRL takes the delta's CRL number, thisUpdate, nextUpdate
          and IDP.
        basis: "stated"
        locator: "§5.2.4"
        quotes:
          - |-
            When a delta CRL is combined with a complete CRL or a locally constructed CRL, the resulting locally constructed CRL has the CRL number specified in the CRL number extension found in the delta CRL used in its construction. In addition, the resulting locally constructed CRL has the thisUpdate and nextUpdate times specified in the corresponding fields of the delta CRL used in its construction. In addition, the locally constructed CRL inherits the issuing distribution point from the delta CRL.
      - id: "5.2.4-current"
        kind: "compute"
        action: >-
          The current delta is the one whose thisUpdate to nextUpdate contains now; among
          several, the latest thisUpdate.
        basis: "stated"
        locator: "§5.2.4"
        quotes:
          - |-
            A delta CRL is considered to be the current one if the current time is between the times contained in the thisUpdate and nextUpdate fields.
          - |-
            An application that supports delta CRLs MUST be able to construct a current complete CRL by combining a previously issued complete CRL and the most current delta CRL.
          - |-
            An application that supports delta CRLs MAY also be able to construct a current complete CRL by combining a previously locally constructed complete CRL and the current delta CRL.
          - |-
            If more than one current delta CRL for a given scope is encountered, the application SHOULD consider the one with the latest value in thisUpdate to be the most current one.
        constrained_by:
          - "rfc-5280#R-0316"
          - "rfc-5280#R-0317"
          - "rfc-5280#R-0318"
  - name: "extension-criticality-handling"
    title: >-
      Critical and unknown extensions in certificates (§4.2, §6.1, Appendix B), invoked by
      6.1.4(o) and 6.1.5(f)
    locator: "§4.2, §4.2.1.4, §4.2.1.10, §4.2.1.11, §6.1, Appendix B"
    performed_by:
      - "relying-party"
    status: "normative"
    steps:
      - id: "4.2-critical"
        kind: "check"
        action: >-
          Reject on an unrecognized critical extension or one with unprocessable content;
          process recognized non-critical extensions, ignore unrecognized ones.
        message: "Extension:*"
        basis: "stated"
        locator: "§4.2, §6.1"
        quotes:
          - |-
            A certificate-using system MUST reject the certificate if it encounters a critical extension it does not recognize or a critical extension that contains information that it cannot process.
          - |-
            A non-critical extension MAY be ignored if it is not recognized,
          - |-
            but MUST be processed if it is recognized.
          - |-
            Note that clients MUST reject the certificate if it contains an unsupported critical extension.
        constrained_by:
          - "rfc-5280#R-0071"
          - "rfc-5280#R-0072"
          - "rfc-5280#R-0073"
          - "rfc-5280#R-0372"
        on_fail: "reject the certificate"
        on_fail_basis: "stated"
      - id: "4.2.1.4-critical-policies"
        kind: "check"
        action: "Critical certificatePolicies: interpret it with its qualifiers or reject."
        message: "Extension:certificatePolicies"
        basis: "stated"
        locator: "§4.2.1.4"
        quotes:
          - |-
            If this extension is critical, the path validation software MUST be able to interpret this extension (including the optional qualifier), or MUST reject the certificate.
        constrained_by:
          - "rfc-5280#R-0107"
        on_fail: "reject the certificate"
        on_fail_basis: "stated"
      - id: "4.2.1.11-critical-constraints"
        kind: "check"
        action: "Critical policyConstraints with inhibitPolicyMapping and no support for it: reject."
        message: "Extension:policyConstraints"
        basis: "stated"
        locator: "§4.2.1.11"
        quotes:
          - |-
            Conforming applications MUST be able to process the requireExplicitPolicy field
          - |-
            and SHOULD be able to process the inhibitPolicyMapping field.
          - |-
            Applications that support the inhibitPolicyMapping field MUST also implement support for the policyMappings extension.
          - |-
            If the policyConstraints extension is marked as critical and the inhibitPolicyMapping field is present, applications that do not implement support for the inhibitPolicyMapping field MUST reject the certificate.
        constrained_by:
          - "rfc-5280#R-0187"
          - "rfc-5280#R-0188"
          - "rfc-5280#R-0189"
          - "rfc-5280#R-0190"
        on_fail: "reject the certificate"
        on_fail_basis: "stated"
      - id: "B-unknown-elements"
        kind: "compute"
        action: >-
          Unknown elements inside a non-critical extension: ignore unknown bits, unknown
          enumerated values in optional fields, unknown SET or trailing SEQUENCE elements
          and optional CHOICE alternatives.
        basis: "stated"
        locator: "Appendix B"
        quotes:
          - |-
            If unknown elements appear within an extension, and the extension is not marked as critical, those unknown elements ought to be ignored, as follows:
          - |-
            ignore all unknown bit name assignments within a bit string;
          - |-
            ignore all unknown named numbers in an ENUMERATED type or INTEGER type that is being used in the enumerated style, provided the number occurs as an optional element of a SET or SEQUENCE; and
          - |-
            ignore all unknown elements in SETs, at the end of SEQUENCEs, or in CHOICEs where the CHOICE is itself an optional element of a SET or SEQUENCE.
        constrained_by:
          - "rfc-5280#R-0619"
          - "rfc-5280#R-0620"
          - "rfc-5280#R-0621"
          - "rfc-5280#R-0622"
        note: "Lowercase 'ought to' (source-defects: ought to 7557)."
      - id: "B-critical-unexpected"
        kind: "check"
        action: "Unexpected values in a critical extension: reject the certificate or CRL."
        basis: "stated"
        locator: "Appendix B"
        quotes:
          - |-
            If an extension containing unexpected values is marked as critical, the implementation MUST reject the certificate or CRL containing the unrecognized extension.
        constrained_by:
          - "rfc-5280#R-0623"
        on_fail: "reject the certificate or CRL"
        on_fail_basis: "stated"
error_paths:
  - id: "signature-invalid"
    trigger: >-
      The certificate's signature does not verify under the working public key, algorithm
      and parameters.
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.3(a)(1)"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.3(a)(1), §6.1.3"
    quotes:
      - |-
        The signature on the certificate can be verified using working_public_key_algorithm, the working_public_key, and the working_public_key_parameters.
      - |-
        If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0418"
      - "rfc-5280#R-0432"
  - id: "outside-validity-period"
    trigger: "The current time is outside notBefore..notAfter."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.3(a)(2)"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.3(a)(2), §6.1.3"
    quotes:
      - |-
        The certificate validity period includes the current time.
      - |-
        If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0419"
      - "rfc-5280#R-0432"
  - id: "certificate-revoked"
    trigger: "The certificate is revoked at the current time."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.3(a)(3)"
      - "crl-validation"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.3(a)(3), §6.1.3"
    quotes:
      - |-
        At the current time, the certificate is not revoked. This may be determined by obtaining the appropriate CRL (Section 6.3), by status information, or by out-of-band mechanisms.
      - |-
        If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0420"
      - "rfc-5280#R-0432"
  - id: "revocation-undetermined"
    trigger: "crl-validation returns UNDETERMINED, or certificateHold."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.3(a)(3)"
      - "crl-validation 6.3.3-fallback"
    outcome: "unspecified. Whether 6.1.3(a)(3) passes or fails is not stated."
    basis: "unspecified"
    locator: "§6.1.3(a)(3), §6.3.3"
    quotes:
      - |-
        If the revocation status has not been determined, repeat the process above with any available CRLs not specified in a distribution point but issued by the certificate issuer. For the processing of such a CRL, assume a DP with both the reasons and the cRLIssuer fields omitted and a distribution point name of the certificate issuer. That is, the sequence of names in fullName is generated from the certificate issuer field as well as the certificate issuerAltName extension. After processing such CRLs, if the revocation status has still not been determined, then return the cert_status UNDETERMINED.
    constrained_by:
      - "rfc-5280#R-0537"
  - id: "issuer-name-mismatch"
    trigger: "The issuer name is not the working_issuer_name by the §7.1 rules."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.3(a)(4)"
      - "dn-comparison"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.3(a)(4), §6.1.3"
    quotes:
      - |-
        The certificate issuer name is the working_issuer_name.
      - |-
        If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0421"
      - "rfc-5280#R-0432"
  - id: "name-not-permitted"
    trigger: >-
      A subject DN or subjectAltName lies outside the permitted subtrees of its type (or the
      set for that type is empty).
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.3(b)"
      - "name-constraints-check"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.3(b), §6.1.3, §6.1.1(h)"
    quotes:
      - |-
        If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is within one of the permitted_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is within one of the permitted_subtrees for that name type.
      - |-
        The initial-permitted-subtrees input includes a set for each name type. For each name type, the set may consist of a single subtree that includes all names of that name type or one or more subtrees that each specifies a subset of the names of that name type, or the set may be empty. If the set for a name type is empty, then the certification path will be considered invalid if any certificate in the certification path includes a name of that name type.
      - |-
        If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0422"
      - "rfc-5280#R-0395"
      - "rfc-5280#R-0432"
  - id: "name-excluded"
    trigger: "A subject DN or subjectAltName lies inside an excluded subtree."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.3(c)"
      - "name-constraints-check"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.3(c), §6.1.3"
    quotes:
      - |-
        If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is not within any of the excluded_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is not within any of the excluded_subtrees for that name type.
      - |-
        If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0423"
      - "rfc-5280#R-0432"
  - id: "explicit-policy-required"
    trigger: "explicit_policy has reached 0 and the valid_policy_tree is NULL."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.3(f)"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.3(f)"
    quotes:
      - |-
        Verify that either explicit_policy is greater than 0 or the valid_policy_tree is not equal to NULL;
      - |-
        If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0431"
      - "rfc-5280#R-0432"
  - id: "anypolicy-in-mapping"
    trigger: "policyMappings maps to or from anyPolicy."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.4(a)"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.4(a), §6.1.4"
    quotes:
      - |-
        If a policy mappings extension is present, verify that the special value anyPolicy does not appear as an issuerDomainPolicy or a subjectDomainPolicy.
      - |-
        If check (a), (k), (l), (n), or (o) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0435"
      - "rfc-5280#R-0467"
  - id: "not-a-ca"
    trigger: "An intermediate v3 certificate lacks basicConstraints or has cA FALSE."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.4(k)"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.4(k), §6.1.4"
    quotes:
      - |-
        If certificate i is a version 3 certificate, verify that the basicConstraints extension is present and that cA is set to TRUE.
      - |-
        If check (a), (k), (l), (n), or (o) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0461"
      - "rfc-5280#R-0467"
  - id: "v1-v2-intermediate-not-confirmed"
    trigger: "An intermediate v1 or v2 certificate is not confirmed as a CA out of band."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.4(k)"
    outcome: "The application rejects the certificate."
    basis: "stated"
    locator: "§6.1.4(k)"
    quotes:
      - |-
        (If certificate i is a version 1 or version 2 certificate, then the application MUST either verify that certificate i is a CA certificate through out-of-band means or reject the certificate.
    constrained_by:
      - "rfc-5280#R-0462"
  - id: "path-length-exceeded"
    trigger: "A non-self-issued intermediate is reached with max_path_length = 0."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.4(l)"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.4(l), §6.1.4(m), §6.1.4, §4.2.1.9"
    quotes:
      - |-
        If the certificate was not self-issued, verify that max_path_length is greater than zero and decrement max_path_length by 1.
      - |-
        If pathLenConstraint is present in the certificate and is less than max_path_length, set max_path_length to the value of pathLenConstraint.
      - |-
        If check (a), (k), (l), (n), or (o) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0463"
      - "rfc-5280#R-0464"
      - "rfc-5280#R-0467"
  - id: "keycertsign-missing"
    trigger: "An intermediate has keyUsage without keyCertSign."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.4(n)"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.4(n), §6.1.4"
    quotes:
      - |-
        If a key usage extension is present, verify that the keyCertSign bit is set.
      - |-
        If check (a), (k), (l), (n), or (o) fails, the procedure terminates, returning a failure indication and an appropriate reason.
    constrained_by:
      - "rfc-5280#R-0465"
      - "rfc-5280#R-0467"
  - id: "critical-extension-unprocessed-intermediate"
    trigger: >-
      An intermediate carries a critical extension the implementation does not recognize or
      cannot process.
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.4(o)"
      - "extension-criticality-handling"
    outcome: "Path validation terminates with a failure indication and an appropriate reason."
    basis: "stated"
    locator: "§6.1.4(o), §4.2, §6.1"
    quotes:
      - |-
        Recognize and process any other critical extension present in the certificate. Process any other recognized non-critical extension present in the certificate that is relevant to path processing.
      - |-
        If check (a), (k), (l), (n), or (o) fails, the procedure terminates, returning a failure indication and an appropriate reason.
      - |-
        A certificate-using system MUST reject the certificate if it encounters a critical extension it does not recognize or a critical extension that contains information that it cannot process.
      - |-
        Note that clients MUST reject the certificate if it contains an unsupported critical extension.
    constrained_by:
      - "rfc-5280#R-0466"
      - "rfc-5280#R-0467"
      - "rfc-5280#R-0071"
      - "rfc-5280#R-0372"
  - id: "critical-extension-unprocessed-target"
    trigger: "The target certificate carries such an extension."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.5(f)"
      - "extension-criticality-handling"
    outcome: "Reject (from §4.2 and §6.1). 6.1.5 itself states no failure exit."
    basis: "inferred"
    locator: "§6.1.5(f), §4.2, §6.1"
    quotes:
      - |-
        Recognize and process any other critical extension present in the certificate n. Process any other recognized non-critical extension present in certificate n that is relevant to path processing.
      - |-
        A certificate-using system MUST reject the certificate if it encounters a critical extension it does not recognize or a critical extension that contains information that it cannot process.
      - |-
        Note that clients MUST reject the certificate if it contains an unsupported critical extension.
    constrained_by:
      - "rfc-5280#R-0476"
      - "rfc-5280#R-0071"
      - "rfc-5280#R-0372"
  - id: "wrap-up-policy-failure"
    trigger: "After wrap-up, explicit_policy = 0 and the valid_policy_tree is NULL."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.5-exit"
    outcome: "Path processing has not succeeded. The source states only the success condition."
    basis: "inferred"
    locator: "§6.1.5"
    quotes:
      - |-
        If either (1) the value of explicit_policy variable is greater than zero or (2) the valid_policy_tree is not NULL, then path processing has succeeded.
    constrained_by:
      - "rfc-5280#R-0488"
  - id: "repeated-certificate"
    trigger: "A certificate appears more than once in the prospective path."
    detected_by: "relying-party"
    in:
      - "basic-path-validation"
      - "path-discovery"
    outcome: "Not a valid prospective path. No step of 6.1 checks it, and no outcome is stated."
    basis: "unspecified"
    locator: "§6.1"
    quotes:
      - |-
        A certificate MUST NOT appear more than once in a prospective certification path.
    constrained_by:
      - "rfc-5280#R-0380"
  - id: "critical-name-constraint-unprocessable"
    trigger: >-
      A critical nameConstraints constrains a form, or sets minimum or maximum, that the
      application does not process, and a later certificate has a name of that form.
    detected_by: "relying-party"
    in:
      - "name-constraints-check"
    outcome: "Reject the certificate."
    basis: "stated"
    locator: "§4.2.1.10"
    quotes:
      - |-
        If a name constraints extension that is marked as critical imposes constraints on a particular name form, and an instance of that name form appears in the subject field or subjectAltName extension of a subsequent certificate, then the application MUST either process the constraint or reject the certificate.
      - |-
        However, if an application encounters a critical name constraints extension that specifies other values for minimum or maximum for a name form that appears in a subsequent certificate, the application MUST either process these fields or reject the certificate.
    constrained_by:
      - "rfc-5280#R-0169"
      - "rfc-5280#R-0172"
  - id: "uri-without-fqdn-host"
    trigger: >-
      A URI constraint applies and a later subjectAltName URI has no authority with an FQDN
      host.
    detected_by: "relying-party"
    in:
      - "name-constraints-check"
    outcome: "Reject the certificate."
    basis: "stated"
    locator: "§4.2.1.10"
    quotes:
      - |-
        If a constraint is applied to the uniformResourceIdentifier name form and a subsequent certificate includes a subjectAltName extension with a uniformResourceIdentifier that does not include an authority component with a host name specified as a fully qualified domain name (e.g., if the URI either does not include an authority component or includes an authority component in which the host name is specified as an IP address), then the application MUST reject the certificate.
    constrained_by:
      - "rfc-5280#R-0175"
  - id: "critical-policies-uninterpretable"
    trigger: "Critical certificatePolicies the software cannot interpret, including qualifiers."
    detected_by: "relying-party"
    in:
      - "extension-criticality-handling"
    outcome: "Reject the certificate."
    basis: "stated"
    locator: "§4.2.1.4"
    quotes:
      - |-
        If this extension is critical, the path validation software MUST be able to interpret this extension (including the optional qualifier), or MUST reject the certificate.
    constrained_by:
      - "rfc-5280#R-0107"
  - id: "inhibit-policy-mapping-unsupported"
    trigger: "Critical policyConstraints with inhibitPolicyMapping, not supported."
    detected_by: "relying-party"
    in:
      - "extension-criticality-handling"
    outcome: "Reject the certificate."
    basis: "stated"
    locator: "§4.2.1.11"
    quotes:
      - |-
        If the policyConstraints extension is marked as critical and the inhibitPolicyMapping field is present, applications that do not implement support for the inhibitPolicyMapping field MUST reject the certificate.
    constrained_by:
      - "rfc-5280#R-0190"
  - id: "critical-extension-unexpected-values"
    trigger: "A critical extension contains unexpected values."
    detected_by: "relying-party"
    in:
      - "extension-criticality-handling"
    outcome: "Reject the certificate or CRL."
    basis: "stated"
    locator: "Appendix B"
    quotes:
      - |-
        If an extension containing unexpected values is marked as critical, the implementation MUST reject the certificate or CRL containing the unrecognized extension.
    constrained_by:
      - "rfc-5280#R-0623"
  - id: "key-usage-forbids"
    trigger: >-
      keyUsage lacks keyCertSign or cRLSign for the signature to be verified, or
      basicConstraints lacks cA for a certificate signature.
    detected_by: "relying-party"
    in:
      - "certificate-validation-and-use"
    outcome: "The key must not be used to verify that signature."
    basis: "stated"
    locator: "§4.2.1.3, §4.2.1.9"
    quotes:
      - |-
        If the keyUsage extension is present, then the subject public key MUST NOT be used to verify signatures on certificates or CRLs unless the corresponding keyCertSign or cRLSign bit is set.
      - |-
        If the basic constraints extension is not present in a version 3 certificate, or the extension is present but the cA boolean is not asserted, then the certified public key MUST NOT be used to verify certificate signatures.
    constrained_by:
      - "rfc-5280#R-0100"
      - "rfc-5280#R-0155"
  - id: "no-consistent-purpose"
    trigger: "No purpose is consistent with both keyUsage and extKeyUsage."
    detected_by: "relying-party"
    in:
      - "certificate-validation-and-use"
    outcome: "The certificate must not be used for any purpose."
    basis: "stated"
    locator: "§4.2.1.12"
    quotes:
      - |-
        If there is no purpose consistent with both extensions, then the certificate MUST NOT be used for any purpose.
    constrained_by:
      - "rfc-5280#R-0202"
  - id: "crl-critical-extension-unprocessable"
    trigger: "A CRL has a critical CRL or CRL entry extension the application cannot process."
    detected_by: "relying-party"
    in:
      - "crl-validation"
    outcome: "The CRL is not used to determine status."
    basis: "stated"
    locator: "§5.2, §5.3"
    quotes:
      - |-
        If a CRL contains a critical extension that the application cannot process, then the application MUST NOT use that CRL to determine the status of certificates.
      - |-
        If a CRL contains a critical CRL entry extension that the application cannot process, then the application MUST NOT use that CRL to determine the status of any certificates.
    constrained_by:
      - "rfc-5280#R-0288"
      - "rfc-5280#R-0356"
  - id: "idp-unsupported"
    trigger: "The CRL has an IDP and the implementation does not support IDP."
    detected_by: "relying-party"
    in:
      - "crl-validation"
    outcome: >-
      Treat unlisted certificates as unknown, or find another CRL without unrecognized
      critical extensions.
    basis: "stated"
    locator: "§5.2.5"
    quotes:
      - |-
        However, implementations that do not support this extension MUST either treat the status of any certificate not listed on this CRL as unknown or locate another CRL that does not contain any unrecognized critical extensions.
    constrained_by:
      - "rfc-5280#R-0319"
  - id: "no-current-crl"
    trigger: >-
      nextUpdate has passed and no current complete CRL, or none with nextUpdate after now,
      is obtained.
    detected_by: "relying-party"
    in:
      - "crl-validation 6.3.3(a)(1)(ii)"
    outcome: "unspecified."
    basis: "unspecified"
    locator: "§6.3.3(a)(1)"
    quotes:
      - |-
        Update the local CRL cache with a current complete CRL, verify that the current time is before the next update value in the new CRL, and continue processing with the new CRL. If use-deltas is set and either the certificate or the CRL contains the freshest CRL extension, then obtain the current delta CRL that can be used to update the new locally cached complete CRL as specified in Section 5.2.4.
    constrained_by:
      - "rfc-5280#R-0506"
  - id: "crl-issuer-or-scope-mismatch"
    trigger: >-
      6.3.3(b) fails: wrong issuer, no indirectCRL, IDP name, user/CA scope or
      attribute-certificate flag.
    detected_by: "relying-party"
    in:
      - "crl-validation 6.3.3(b)"
    outcome: "unspecified; the CRL presumably cannot be used for this certificate."
    basis: "unspecified"
    locator: "§6.3.3(b)"
    quotes:
      - |-
        If the DP includes cRLIssuer, then verify that the issuer field in the complete CRL matches cRLIssuer in the DP and that the complete CRL contains an issuing distribution point extension with the indirectCRL boolean asserted. Otherwise, verify that the CRL issuer matches the certificate issuer.
      - |-
        If the distribution point name is present in the IDP CRL extension and the distribution field is present in the DP, then verify that one of the names in the IDP matches one of the names in the DP. If the distribution point name is present in the IDP CRL extension and the distribution field is omitted from the DP, then verify that one of the names in the IDP matches one of the names in the cRLIssuer field of the DP.
      - |-
        If the onlyContainsUserCerts boolean is asserted in the IDP CRL extension, verify that the certificate does not include the basic constraints extension with the cA boolean asserted.
      - |-
        If the onlyContainsCACerts boolean is asserted in the IDP CRL extension, verify that the certificate includes the basic constraints extension with the cA boolean asserted.
      - |-
        Verify that the onlyContainsAttributeCerts boolean is not asserted.
    constrained_by:
      - "rfc-5280#R-0509"
      - "rfc-5280#R-0511"
      - "rfc-5280#R-0512"
      - "rfc-5280#R-0513"
      - "rfc-5280#R-0514"
  - id: "delta-crl-mismatch"
    trigger: "6.3.3(c) fails: delta issuer, IDP or AKI differs from the complete CRL."
    detected_by: "relying-party"
    in:
      - "crl-validation 6.3.3(c)"
    outcome: "unspecified."
    basis: "unspecified"
    locator: "§6.3.3(c)"
    quotes:
      - |-
        Verify that the delta CRL issuer matches the complete CRL issuer.
      - |-
        If the complete CRL includes an issuing distribution point (IDP) CRL extension, verify that the delta CRL contains a matching IDP CRL extension. If the complete CRL omits an IDP CRL extension, verify that the delta CRL also omits an IDP CRL extension.
      - |-
        Verify that the delta CRL authority key identifier extension matches the complete CRL authority key identifier extension.
    constrained_by:
      - "rfc-5280#R-0516"
      - "rfc-5280#R-0517"
      - "rfc-5280#R-0518"
  - id: "delta-not-combinable"
    trigger: "The complete and delta CRL fail a §5.2.4 combination condition."
    detected_by: "relying-party"
    in:
      - "delta-crl-combination"
    outcome: "They are not combined. What is used instead is unspecified."
    basis: "inferred"
    locator: "§5.2.4"
    quotes:
      - |-
        A complete CRL and a delta CRL MAY be combined if the following four conditions are satisfied: (a) The complete CRL and delta CRL have the same issuer. (b) The complete CRL and delta CRL have the same scope. The two CRLs have the same scope if either of the following conditions are met: (1) The issuingDistributionPoint extension is omitted from both the complete CRL and the delta CRL. (2) The issuingDistributionPoint extension is present in both the complete CRL and the delta CRL, and the values for each of the fields in the extensions are the same in both CRLs. (c) The CRL number of the complete CRL is equal to or greater than the BaseCRLNumber specified in the delta CRL. That is, the complete CRL contains (at a minimum) all the revocation information held by the referenced base CRL. (d) The CRL number of the complete CRL is less than the CRL number of the delta CRL. That is, the delta CRL follows the complete CRL in the numbering sequence.
    constrained_by:
      - "rfc-5280#R-0310"
  - id: "no-new-reasons"
    trigger: "interim_reasons_mask adds no reason to reasons_mask."
    detected_by: "relying-party"
    in:
      - "crl-validation 6.3.3(e)"
    outcome: "unspecified."
    basis: "unspecified"
    locator: "§6.3.3(e)"
    quotes:
      - |-
        Verify that interim_reasons_mask includes one or more reasons that are not included in the reasons_mask.
    constrained_by:
      - "rfc-5280#R-0524"
  - id: "crl-issuer-path-invalid"
    trigger: >-
      The CRL issuer's path does not validate, ends at a different trust anchor, or its
      keyUsage lacks cRLSign.
    detected_by: "relying-party"
    in:
      - "crl-validation 6.3.3(f)"
      - "crl-signer-certificate-retrieval"
    outcome: "unspecified in 6.3.3; §8 requires the same trust anchor."
    basis: "unspecified"
    locator: "§6.3.3(f), §8"
    quotes:
      - |-
        Obtain and validate the certification path for the issuer of the complete CRL.
      - |-
        The trust anchor for the certification path MUST be the same as the trust anchor used to validate the target certificate.
      - |-
        If a key usage extension is present in the CRL issuer's certificate, verify that the cRLSign bit is set.
      - |-
        At a minimum, implementations validating CRLs MUST ensure that the certification path of a certificate and the CRL issuer certification path used to validate the certificate terminate at the same trust anchor.
    constrained_by:
      - "rfc-5280#R-0525"
      - "rfc-5280#R-0526"
      - "rfc-5280#R-0527"
      - "rfc-5280#R-0589"
  - id: "crl-signature-invalid"
    trigger: "The complete or delta CRL signature does not verify with the key from (f)."
    detected_by: "relying-party"
    in:
      - "crl-validation 6.3.3(g)"
      - "crl-validation 6.3.3(h)"
    outcome: "unspecified."
    basis: "unspecified"
    locator: "§6.3.3(g), §6.3.3(h)"
    quotes:
      - |-
        Validate the signature on the complete CRL using the public key validated in step (f).
      - |-
        If use-deltas is set, then validate the signature on the delta CRL using the public key validated in step (f).
    constrained_by:
      - "rfc-5280#R-0528"
      - "rfc-5280#R-0529"
  - id: "status-undetermined"
    trigger: "All DP and issuer CRLs are processed and status is still undetermined."
    detected_by: "relying-party"
    in:
      - "crl-validation 6.3.3-fallback"
    outcome: "crl-validation returns UNDETERMINED."
    basis: "stated"
    locator: "§6.3.3"
    quotes:
      - |-
        If the revocation status has not been determined, repeat the process above with any available CRLs not specified in a distribution point but issued by the certificate issuer. For the processing of such a CRL, assume a DP with both the reasons and the cRLIssuer fields omitted and a distribution point name of the certificate issuer. That is, the sequence of names in fullName is generated from the certificate issuer field as well as the certificate issuerAltName extension. After processing such CRLs, if the revocation status has still not been determined, then return the cert_status UNDETERMINED.
    constrained_by:
      - "rfc-5280#R-0537"
  - id: "https-unbounded-recursion"
    trigger: >-
      A CDP, AIA or SIA https URI requires validating the server certificate, which needs
      the pointed-to data.
    detected_by: "relying-party"
    in:
      - "crl-retrieval"
      - "ca-certificate-retrieval-aia"
      - "subject-information-retrieval-sia"
    outcome: >-
      Possible unbounded recursion or an unresolvable dependency; the relying party must be
      prepared for it.
    basis: "stated"
    locator: "§8"
    quotes:
      - |-
        The relying party is forced to perform an additional path validation in order to obtain the CRL required to complete the initial path validation! Circular conditions can also be created with an https URI (or similar scheme) in the authorityInfoAccess or subjectInfoAccess extensions. At worst, this situation can create unresolvable dependencies.
      - |-
        CAs SHOULD NOT include URIs that specify https, ldaps, or similar schemes in extensions.
      - |-
        CAs that include an https URI in one of these extensions MUST ensure that the server's certificate can be validated without using the information that is pointed to by the URI.
      - |-
        Relying parties that choose to validate the server's certificate when obtaining information pointed to by an https URI in the cRLDistributionPoints, authorityInfoAccess, or subjectInfoAccess extensions MUST be prepared for the possibility that this will result in unbounded recursion.
    constrained_by:
      - "rfc-5280#R-0590"
      - "rfc-5280#R-0591"
      - "rfc-5280#R-0592"
  - id: "retrieved-data-malformed"
    trigger: "Data fetched through CDP or AIA is malformed or malicious."
    detected_by: "relying-party"
    in:
      - "crl-retrieval"
      - "ca-certificate-retrieval-aia"
    outcome: "Not accepted (lowercase should)."
    basis: "stated"
    locator: "§8"
    quotes:
      - |-
        Implementers should always take the steps of validating the retrieved data to ensure that the data is properly formed.
  - id: "crl-without-nextupdate"
    trigger: "A CRL omits nextUpdate."
    detected_by: "relying-party"
    in:
      - "crl-validation"
    outcome: "Behaviour not specified by the profile."
    basis: "stated"
    locator: "§5.1.2.5"
    quotes:
      - |-
        The behavior of clients processing CRLs that omit nextUpdate is not specified by this profile.
  - id: "empty-policy-constraints"
    trigger: "A certificate has policyConstraints as an empty sequence."
    detected_by: "relying-party"
    in:
      - "basic-path-validation 6.1.4(i)"
    outcome: "Behaviour not addressed."
    basis: "stated"
    locator: "§4.2.1.11"
    quotes:
      - |-
        The behavior of clients that encounter an empty policy constraints field is not addressed in this profile.
  - id: "empty-generalname-in-san"
    trigger: "subjectAltName contains an empty GeneralName."
    detected_by: "relying-party"
    in:
      - "basic-path-validation"
    outcome: "Behaviour not defined."
    basis: "stated"
    locator: "§4.2.1.6"
    quotes:
      - |-
        The behavior of clients that encounter such a certificate when processing a certification path is not defined by this profile.
  - id: "nonpositive-serial"
    trigger: "A non-conforming CA issued a negative or zero serial number."
    detected_by: "relying-party"
    in:
      - "basic-path-validation"
    outcome: "Handle gracefully (SHOULD); the meaning of that is not given."
    basis: "stated"
    locator: "§4.1.2.2"
    quotes:
      - |-
        Note: Non-conforming CAs may issue certificates with serial numbers that are negative or zero. Certificate users SHOULD be prepared to gracefully handle such certificates.
    constrained_by:
      - "rfc-5280#R-0020"
source_defects_and_ambiguities:
  - id: "wrap-up-failure-exit-implicit"
    kind: "gap"
    locator: "§6.1.5, §6.1.6"
    text: >-
      6.1.5 states when path processing has succeeded and 6.1.6 gives the success outputs.
      Nothing states that the procedure fails, or what it returns, when explicit_policy is 0
      and the tree is NULL. Unlike 6.1.3 and 6.1.4, 6.1.5 has no failure sentence.
    quotes:
      - |-
        If either (1) the value of explicit_policy variable is greater than zero or (2) the valid_policy_tree is not NULL, then path processing has succeeded.
      - |-
        If path processing succeeds, the procedure terminates, returning a success indication together with final value of the valid_policy_tree, the working_public_key, the working_public_key_algorithm, and the working_public_key_parameters.
  - id: "wrap-up-critical-extension-no-exit"
    kind: "gap"
    locator: "§6.1.5(f), §6.1"
    text: >-
      6.1.5(f) requires recognizing and processing every other critical extension of
      certificate n, but no failure exit covers it; rejection rests on §6.1 and §4.2.
    quotes:
      - |-
        Recognize and process any other critical extension present in the certificate n. Process any other recognized non-critical extension present in certificate n that is relevant to path processing.
      - |-
        Note that clients MUST reject the certificate if it contains an unsupported critical extension.
  - id: "intersection-result-not-assigned"
    kind: "ambiguity"
    locator: "§6.1.5(g), §6.1.5, §6.1.6"
    text: >-
      6.1.5(g) 'calculates the intersection'; (i) and (ii) describe it as a value ('the
      intersection is NULL', 'is the entire valid_policy_tree'), while (iii) deletes and
      adds nodes in the tree. It is not stated that the intersection becomes the
      valid_policy_tree tested in the success condition and returned by 6.1.6.
    quotes:
      - |-
        Calculate the intersection of the valid_policy_tree and the user-initial-policy-set, as follows:
      - |-
        If the valid_policy_tree is NULL, the intersection is NULL.
      - |-
        If the valid_policy_tree is not NULL and the user-initial-policy-set is any-policy, the intersection is the entire valid_policy_tree.
      - |-
        If either (1) the value of explicit_policy variable is greater than zero or (2) the valid_policy_tree is not NULL, then path processing has succeeded.
  - id: "duplicate-certificate-no-step"
    kind: "gap"
    locator: "§6.1"
    text: >-
      'A certificate MUST NOT appear more than once in a prospective certification path' has
      no step and no failure exit in 6.1.3 or 6.1.4, and 'appear more than once' is not
      defined (same encoding, same issuer and serial, same key and name).
    quotes:
      - |-
        A certificate MUST NOT appear more than once in a prospective certification path.
  - id: "revocation-undetermined-mapping"
    kind: "gap"
    locator: "§6.1.3(a)(3), §6.3.2(b), §6.3.3"
    text: >-
      6.1.3(a)(3) requires that the certificate is not revoked. crl-validation can return
      UNDETERMINED, and a held certificate returns certificateHold. Which of these fail
      6.1.3(a) is not stated in §6. For certificateHold, §5.2.4 counts a hold as a
      revocation ('revoked (for any revocation reason, including certificateHold)'), which
      supports failing it; state-machine.yaml M01 takes that reading. UNDETERMINED has no
      such support.
    quotes:
      - |-
        At the current time, the certificate is not revoked. This may be determined by obtaining the appropriate CRL (Section 6.3), by status information, or by out-of-band mechanisms.
      - |-
        cert_status: This variable contains the status of the certificate. This variable may be assigned one of the following values: unspecified, keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, certificateHold, removeFromCRL, privilegeWithdrawn, aACompromise, the special value UNREVOKED, or the special value UNDETERMINED. This variable is initialized to the special value UNREVOKED.
      - |-
        If the revocation status has not been determined, repeat the process above with any available CRLs not specified in a distribution point but issued by the certificate issuer. For the processing of such a CRL, assume a DP with both the reasons and the cRLIssuer fields omitted and a distribution point name of the certificate issuer. That is, the sequence of names in fullName is generated from the certificate issuer field as well as the certificate issuerAltName extension. After processing such CRLs, if the revocation status has still not been determined, then return the cert_status UNDETERMINED.
  - id: "working-key-algorithm-term"
    kind: "inconsistency"
    locator: "§6.1.2(g), §6.1.4(e), §6.1.4(f), §6.1.3(a)(1)"
    text: >-
      working_public_key_algorithm is defined as 'the digital signature algorithm used to
      verify the signature of a certificate', but is initialized from the trusted public key
      algorithm and assigned the certificate's subjectPublicKey algorithm, a key algorithm.
      6.1.3(a)(1) verifies with it and never mentions the certificate's own signature or
      signatureAlgorithm field, so how a key algorithm and the certificate's signature
      algorithm are reconciled is not stated.
    quotes:
      - |-
        working_public_key_algorithm: the digital signature algorithm used to verify the signature of a certificate. The working_public_key_algorithm is initialized from the trusted public key algorithm provided in the trust anchor information.
      - |-
        Assign the certificate subjectPublicKey algorithm to the working_public_key_algorithm variable.
      - |-
        The signature on the certificate can be verified using working_public_key_algorithm, the working_public_key, and the working_public_key_parameters.
  - id: "empty-subject-in-6-1-3"
    kind: "inconsistency"
    locator: "§6.1.3(b), §6.1.3(c), §4.2.1.10"
    text: >-
      6.1.3(b) and (c) check 'the subject name' against the directoryName subtrees
      unconditionally; 4.2.1.10 applies directoryName restrictions only 'when the
      certificate includes a non-empty subject field'. Whether an empty subject is within a
      permitted subtree is not answered by 6.1.3.
    quotes:
      - |-
        If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is within one of the permitted_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is within one of the permitted_subtrees for that name type.
      - |-
        Restrictions of the form directoryName MUST be applied to the subject field in the certificate (when the certificate includes a non-empty subject field) and to any names of type directoryName in the subjectAltName extension.
  - id: "emailaddress-fallback-missing"
    kind: "gap"
    locator: "§6.1.3(b), §6.1.3(c), §4.2.1.10"
    text: >-
      4.2.1.10 requires rfc822Name constraints to be applied to emailAddress attributes of
      the subject DN when there is no subjectAltName. 6.1.3(b) and (c) check the subject
      name only against X.500 subtrees and subjectAltName names against their own type, so
      the algorithm as written omits this check.
    quotes:
      - |-
        When constraints are imposed on the rfc822Name name form, but the certificate does not include a subject alternative name, the rfc822Name constraint MUST be applied to the attribute of type emailAddress in the subject distinguished name.
      - |-
        If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is within one of the permitted_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is within one of the permitted_subtrees for that name type.
  - id: "undefined-name-forms"
    kind: "unimplementable-as-written"
    locator: "§6.1.3(b), §6.1.1(h), §4.2.1.10"
    text: >-
      6.1.3(b) requires every subjectAltName name to be within the permitted subtrees of its
      name type, and 6.1.1(h) lets the initial set be 'a single subtree that includes all
      names of that name type'. For otherName, ediPartyName and registeredID the source
      defines no constraint semantics, and for no name type does it say how the all-names
      subtree is represented.
    quotes:
      - |-
        The syntax and semantics for name constraints for otherName, ediPartyName, and registeredID are not defined by this specification, however, syntax and semantics for name constraints for other name forms may be specified in other documents.
      - |-
        The initial-permitted-subtrees input includes a set for each name type. For each name type, the set may consist of a single subtree that includes all names of that name type or one or more subtrees that each specifies a subset of the names of that name type, or the set may be empty. If the set for a name type is empty, then the certification path will be considered invalid if any certificate in the certification path includes a name of that name type.
  - id: "min-max-not-in-algorithm"
    kind: "gap"
    locator: "§6.1.4(g), §4.2.1.10"
    text: >-
      4.2.1.10 says an application that meets non-default minimum or maximum in a critical
      name constraint MUST process them or reject; 6.1.4(g) speaks only of 'the value
      indicated in the extension field' and does not mention them.
    quotes:
      - |-
        However, if an application encounters a critical name constraints extension that specifies other values for minimum or maximum for a name form that appears in a subsequent certificate, the application MUST either process these fields or reject the certificate.
      - |-
        If permittedSubtrees is present in the certificate, set the permitted_subtrees state variable to the intersection of its previous value and the value indicated in the extension field. If permittedSubtrees does not include a particular name type, the permitted_subtrees state variable is unchanged for that name type. For example, the intersection of example.com and foo.example.com is foo.example.com. And the intersection of example.com and example.net is the empty set.
  - id: "subtree-intersection-undefined"
