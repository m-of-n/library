message_notes:
  - name: "TBSCertList"
    in_source: "yes"
    note: "Not in the brief's list of names; added as the CRL counterpart of TBSCertificate (§5.1)."
  - name: "Name"
    in_source: "yes"
    note: >-
      Not in the brief's list; the X.501 Name of the subject and issuer fields (§4.1.2.4),
      needed because 6.1.3(a)(4), the self-issued test and §7.1 compare Names, not
      GeneralNames.
  - name: "CRLValidationOutputs"
    in_source: "yes"
    note: >-
      Not in the brief's list; the cert_status that 6.3.3 returns. reasons_mask is not part
      of it.
  - name: "Extension:*"
    in_source: "yes"
    note: >-
      Any extension: used for the general extension rules of §4.2 and the 'any other
      critical extension' steps 6.1.4(o) and 6.1.5(f).
  - name: "Extension:reasonCode"
    in_source: "yes"
    note: >-
      The source's identifier is id-ce-cRLReasons with value type CRLReason; it calls the
      extension 'reasonCode' (§5.3.1).
  - name: "Extension:authorityInfoAccess"
    in_source: "yes"
    note: >-
      Used both as the certificate extension (§4.2.2.1) and the CRL extension (§5.2.7),
      which share syntax.
  - name: "Extension:authorityKeyIdentifier"
    in_source: "yes"
    note: "Used both as a certificate extension (§4.2.1.1) and a CRL extension (§5.2.1)."
  - name: "Extension:issuerAltName"
    in_source: "yes"
    note: "Used both as a certificate extension (§4.2.1.7) and a CRL extension (§5.2.2)."
  - name: "Extension:freshestCRL"
    in_source: "yes"
    note: "Used both as a certificate extension (§4.2.1.15) and a CRL extension (§5.2.6)."
  - name: "CertificateList"
    in_source: "yes"
    note: >-
      Complete CRLs, delta CRLs (with deltaCRLIndicator) and indirect CRLs (IDP indirectCRL
      TRUE) are all CertificateList; the flows say which.
  - name: "CertsOnlyCMS"
    in_source: "external"
    note: >-
      A certs-only CMS message per RFC 2797, one of the two things an HTTP or FTP
      caIssuers/caRepository URI may return (§4.2.2.1). Not defined here.
  - name: "OCSPRequest"
    in_source: "external"
    note: "RFC 2560. The source gives only the responder location (§4.2.2.1)."
  - name: "RegistrationRequest"
    in_source: "no"
    note: >-
      not-in-source. §3.5(a) names the registration function only; the formats are 'defined
      in other PKIX specifications' (§3.4, §3.5).
  - name: "RevocationRequest"
    in_source: "no"
    note: "not-in-source. §3.5(f) names the function only."
  - name: "TrustAnchorInfo-as-inputs"
    in_source: "yes"
    note: "The four items of 6.1.1(d); may be conveyed as a self-signed Certificate."
  - name: "PathValidationInputs"
    in_source: "yes"
    note: "The nine inputs of 6.1.1(a) to (i); (d) is TrustAnchorInfo-as-inputs."
  - name: "PathValidationOutputs"
    in_source: "yes"
    note: >-
      6.1.6 on success; a failure indication and 'an appropriate reason' otherwise (6.1.3,
      6.1.4).
  - name: "CRLValidationInputs"
    in_source: "yes"
    note: "The two inputs of 6.3.1; see crl-validation implicit_inputs for what else the steps use."
flows:
  - name: "certificate-issuance"
    title: >-
      Certificate issuance: registration, the CA's profile obligations on every field and
      extension it emits, signing, return and publication
    locator: "§3, §3.1, §3.5, §4.1, §4.2, §8, Appendix B"
    kind: "issuance"
    participants:
      - "end-entity"
      - "registration-authority"
      - "ca"
      - "repository"
    summary: >-
      RFC 5280 profiles what a conforming CA puts in a certificate; it does not define the
      request, the proof of possession or the reply, which §3.5 leaves to other PKIX
      specifications. Steps 1 and 2 and 30 to 32 are the management functions §3.5 lists,
      with no format. Steps 3 to 29 are the CA's obligations, one step per TBSCertificate
      field and per extension, each wired to the requirements that bind it. The source gives
      no error handling on the CA side: a CA that cannot meet an obligation is simply not
      conforming.
    steps:
      - n: "1"
        from: "end-entity"
        to: "ca"
        message: "RegistrationRequest"
        action: >-
          The user makes itself known to the CA, directly or through an RA, before the CA
          issues certificates for it.
        basis: "stated"
        locator: "§3.5(a), §3"
        quotes:
          - |-
            registration: This is the process whereby a user first makes itself known to a CA (directly, or through an RA), prior to that CA issuing a certificate or certificates for that user.
          - |-
            RA: registration authority, i.e., an optional system to which a CA delegates certain management functions;
        on_error: >-
          unspecified. No message format, transport or refusal is defined; §3.5 assigns
          these to other PKIX specifications.
        on_error_basis: "unspecified"
        note: "RegistrationRequest is not-in-source as a structure: §3.5 names the function only."
      - n: "2"
        from: "ca"
        to: "ca"
        message: "Certificate"
        action: >-
          Establish the binding the certificate will assert, and verify every part of the
          subject alternative name. The source names the possible bases; it does not specify
          the verification.
        basis: "stated"
        locator: "§3.1, §4.2.1.6, §8"
        quotes:
          - |-
            The CA may base this assertion upon technical means (a.k.a., proof of possession through a challenge-response protocol), presentation of the private key, or on an assertion by the subject.
          - |-
            The procedures performed by CAs and RAs to validate the binding of the subject's identity to their public key greatly affect the assurance that ought to be placed in the certificate.
          - |-
            Because the subject alternative name is considered to be definitively bound to the public key, all parts of the subject alternative name MUST be verified by the CA.
          - |-
            In addition, CAs SHOULD decline to issue certificates to CAs or end entities that generate weak signatures.
        constrained_by:
          - "rfc-5280#R-0127"
          - "rfc-5280#R-0584"
        on_error: >-
          Decline to issue to a requester that generates weak signatures (R-0584, SHOULD).
          Otherwise unspecified: no refusal message exists.
        on_error_basis: "stated"
      - n: "3"
        from: "ca"
        to: "ca"
        message: "TBSCertificate"
        action: >-
          Set version: v3 when extensions are used; v2 or v1 rules otherwise; fields gated
          on version.
        basis: "stated"
        locator: "§4.1, §4.1.2.1, §4.1.2.8, §4.1.2.9"
        quotes:
          - |-
            Generation of version 2 certificates is not expected by implementations based on this profile.
          - |-
            -- If present, version MUST be v2 or v3
          - |-
            -- If present, version MUST be v3
          - |-
            When extensions are used, as expected in this profile, version MUST be 3 (value is 2).
          - |-
            If no extensions are present, but a UniqueIdentifier is present, the version SHOULD be 2 (value is 1); however, the version MAY be 3.
          - |-
            If only basic fields are present, the version SHOULD be 1 (the value is omitted from the certificate as the default value); however, the version MAY be 2 or 3.
          - |-
            These fields MUST only appear if the version is 2 or 3 (Section 4.1.2.1).
          - |-
            These fields MUST NOT appear if the version is 1.
          - |-
            This field MUST only appear if the version is 3 (Section 4.1.2.1).
        constrained_by:
          - "rfc-5280#R-0004"
          - "rfc-5280#R-0005"
          - "rfc-5280#R-0006"
          - "rfc-5280#R-0010"
          - "rfc-5280#R-0011"
          - "rfc-5280#R-0012"
          - "rfc-5280#R-0065"
          - "rfc-5280#R-0066"
          - "rfc-5280#R-0070"
        on_error: >-
          unspecified. The source states what a conforming CA must emit; it defines no
          CA-side check failure, refusal or error message.
        on_error_basis: "unspecified"
      - n: "4"
        from: "ca"
        to: "ca"
        message: "TBSCertificate"
        action: >-
          Assign serialNumber: positive, unique per issuer, non-negative in DER, at most 20
          octets.
        basis: "stated"
        locator: "§4.1.2.2, Appendix B"
        quotes:
          - |-
            The serial number MUST be a positive integer assigned by the CA to each certificate.
          - |-
            It MUST be unique for each certificate issued by a given CA (i.e., the issuer name and serial number identify a unique certificate).
          - |-
            CAs MUST force the serialNumber to be a non-negative integer.
          - |-
            Conforming CAs MUST NOT use serialNumber values longer than 20 octets.
          - |-
            CAs MUST force the serialNumber to be a non-negative integer, that is, the sign bit in the DER encoding of the INTEGER value MUST be zero.
        constrained_by:
          - "rfc-5280#R-0015"
          - "rfc-5280#R-0016"
          - "rfc-5280#R-0017"
          - "rfc-5280#R-0019"
          - "rfc-5280#R-0604"
          - "rfc-5280#R-0606"
        on_error: >-
          unspecified. The source states what a conforming CA must emit; it defines no
          CA-side check failure, refusal or error message.
        on_error_basis: "unspecified"
      - n: "5"
        from: "ca"
        to: "ca"
        message: "TBSCertificate"
        action: >-
          Set the signature field to the algorithm identifier the CA will sign with,
          identical to Certificate.signatureAlgorithm.
        basis: "stated"
        locator: "§4.1.2.3, §4.1.1.2, §1"
        quotes:
          - |-
            This field MUST contain the same algorithm identifier as the signatureAlgorithm field in the sequence Certificate (Section 4.1.1.2).
          - |-
            This field MUST contain the same algorithm identifier as the signature field in the sequence tbsCertificate (Section 4.1.2.3).
          - |-
            However, conforming implementations that use the algorithms identified in [RFC3279], [RFC4055], and [RFC4491] MUST identify and encode the public key materials and digital signatures as described in those specifications.
        constrained_by:
          - "rfc-5280#R-0021"
          - "rfc-5280#R-0008"
          - "rfc-5280#R-0002"
        on_error: >-
          unspecified. The source states what a conforming CA must emit; it defines no
          CA-side check failure, refusal or error message.
        on_error_basis: "unspecified"
      - n: "6"
        from: "ca"
        to: "ca"
        message: "TBSCertificate"
        action: >-
          Set issuer: a non-empty DN, PrintableString or UTF8String except for the
          legacy-encoding exceptions, encoded identically to the subject field of the CA's
          own certificate.
        basis: "stated"
        locator: "§4.1.2.4, §8"
        quotes:
          - |-
            The issuer field MUST contain a non-empty distinguished name (DN).
          - |-
            CAs conforming to this profile MUST use either the PrintableString or UTF8String encoding of DirectoryString, with two exceptions.
          - |-
