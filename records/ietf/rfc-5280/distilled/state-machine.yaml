          - locator: '§5.2.3'
            quote: 'That is, if the this update field (Section 5.1.2.4) in the two CRLs are not identical, the CRL numbers MUST be different.'
          - locator: '§5.1.2.5'
            quote: 'The next CRL could be issued before the indicated date, but it will not be issued any later than the indicated date.  CRL issuers SHOULD issue CRLs with a nextUpdate time equal to or later than all previous CRLs.'
        inferred: false
        constrained_by:
