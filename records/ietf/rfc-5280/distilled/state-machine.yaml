reviewed_by: ""
kind: state-machine
source: 'RFC 5280, Internet X.509 Public Key Infrastructure Certificate and Certificate Revocation List (CRL) Profile, Standards Track, May 2008'
source_digest: 'a2f2628c0a83b873fc4786abd921f9b2c02395954b655d190bf16b831633345d'
extracted: '2026-10-13'
extracted_by: 'claude, FX-1 pass 1 (extract, part 2), state-machine agent, effort max, from the source text only'
note: >-
  Every lifecycle RFC 5280 describes, as machines an implementation or a test
  harness can drive. The text is the RFC as published in May 2008; RFC 6818,
  9549, 9598, 9608 and 9618 update it and nothing here reflects their
  amendments. M01 (basic path validation, section 6.1) is the core: its state
  is the eleven-variable vector of 6.1.2, its control states follow Figure 2,
  and every lettered step of 6.1.3, 6.1.4 and 6.1.5 is a step of the state it
  runs in. M02 is the valid_policy_tree that M01 drives, M03 the CRL
  validation of 6.3. M04 to M10 are the certificate validity period, a
  certificate's revocation status at its CRL issuer, the CRL issuance sequence
  of one scope, a cached CRL at the relying party, delta CRL combination,
  indirect CRL entry attribution and CA key rollover.

  Section 6 binds by behaviour, not by procedure: 6, 6.1 and 6.3 require
  implementations to be functionally equivalent to the external behaviour of
  the algorithms (R-0367, R-0368, R-0494), and requirements.yaml extracts
  every input, state variable and lettered step as a requirement with verb
  none. A machine here is therefore one implementation of that behaviour, and
  its observable result (success or failure and the 6.1.6 outputs; the
  returned cert_status) is what binds.

  Steps. A control state that runs a lettered sequence carries steps, in
  source order. A step is a check, an action or an invoke. applies_when and
  skipped_when partition the cases in which the step runs; where a step always
  runs, applies_when is always. A check that fails takes the transition named
  in on_failure. An action's updates lists the state variables it writes. Step
  ids are the source's own letters.

  Notation in guards and actions. cert is the certificate being processed
  (certificate i in M01). t is the current date/time input of 6.1.1(b), or the
  time in question (R-0374, OQ-04). := is assignment. self_issued(cert) holds
  when issuer and subject match under the 7.1 rules (R-0383). present(cert, X)
  holds when extension X is in cert. NULL is the valid_policy_tree value of
  6.1.2(a). Sets are written in braces; the empty set is {}.

  Quotes. Every quote is one contiguous run of source characters with the RFC
  line wrapping undone: a line break and the indent that follows become one
  space, and a line-final hyphen joins the next line with no space. Spacing
  inside a line, including the two spaces the RFC puts after a full stop, is
  kept. Page furniture is removed where a quote crosses a page boundary. No
  two passages are spliced. A quote is reused where one sentence supports
  several elements.

  Flags and fields. inferred: true marks a state, step or transition the
  source does not literally state; inferred_reason says what was supplied.
  Machine, state, step-kind and event names are ours. A trigger is one of the
  four messages (Certificate, CertificateList, PathValidationInputs,
  CRLValidationInputs) or a named event; all are listed under events_used.
  completion is the UML completion event: the activity of the source state has
  finished and the guards pick the branch. error_states are states in which
  the machine yields no usable result. unspecified entries record situations
  the source leaves open; each points into open_questions and is not a
  transition. constrained_by lists the rfc-5280#R-NNNN entries whose text is
  quoted by, or governs, the element; it was checked mechanically to name only
  ids that exist in requirements.yaml.

events_used:
  - name: 'Certificate'
    kind: 'message'
    locator: '§4.1.1'
    quote: 'The Certificate is a SEQUENCE of three required fields.'
    note: 'An X.509 certificate (messages.yaml / schema Certificate). As a trigger it is the certificate handed to a machine: certificate i of the path in M01 and M02, the certificate whose status is sought in M03 (inside CRLValidationInputs), the certificate presented for evaluation at t in M04.'
  - name: 'CertificateList'
    kind: 'message'
    locator: '§5.1.1'
    quote: 'The CertificateList is a SEQUENCE of three required fields.'
    note: 'An X.509 v2 CRL. A complete CRL, or a delta CRL when it carries the delta CRL indicator extension (§5.2.4). As a trigger it is a CRL issued by the CRL issuer (M05, M06) or obtained by the relying party (M03, M07, M08, M09).'
  - name: 'PathValidationInputs'
    kind: 'message'
    locator: '§6.1.1'
    quote: 'This algorithm assumes that the following nine inputs are provided to the path processing logic:'
    inferred: true
    inferred_reason: 'The name is ours. The source defines the nine inputs (a) to (i) but no structure that carries them; they are listed as M01 inputs.'
    note: 'Fields: prospective_path (n certificates), current_time, user_initial_policy_set, trust_anchor (trusted issuer name, public key algorithm, public key, optional parameters), initial_policy_mapping_inhibit, initial_explicit_policy, initial_any_policy_inhibit, initial_permitted_subtrees, initial_excluded_subtrees.'
  - name: 'CRLValidationInputs'
    kind: 'message'
    locator: '§6.3.1'
    quote: 'To support revocation processing, the algorithm requires two inputs:'
    inferred: true
    inferred_reason: 'The name is ours. The source defines the two inputs (certificate, use-deltas); the local CRL cache, the current time and the target path''s trust anchor are used by 6.3.3 but not listed as inputs.'
    note: 'Fields: certificate (serial number, issuer, basicConstraints, cRLDistributionPoints, freshestCRL), use_deltas.'
  - name: 'completion'
    kind: 'event'
    locator: 'none'
    inferred: true
    inferred_reason: 'Modelling device, not source text: the activity of the source state has finished and the guards choose the branch.'
  - name: 'certificate_processed'
    kind: 'event'
    locator: '§6.1.3'
    quote: 'If i is not equal to n, continue by performing the preparatory steps listed in Section 6.1.4.'
    inferred: true
    inferred_reason: 'The source names the branch, not an event. Raised by M01 when 6.1.3 completes for certificate i with i < n.'
  - name: 'last_certificate_processed'
    kind: 'event'
    locator: '§6.1.3'
    quote: 'If i is equal to n, perform the wrap-up steps listed in Section 6.1.5.'
    inferred: true
    inferred_reason: 'The source names the branch, not an event. Raised by M01 when 6.1.3 completes for certificate n.'
  - name: 'next_certificate'
    kind: 'event'
    locator: '§6.1.4'
    quote: 'If (a), (k), (l), (n), and (o) have completed successfully, increment i and perform the basic certificate processing specified in Section 6.1.3.'
    inferred: true
    inferred_reason: 'The source names the step, not an event. Raised by M01 when 6.1.4 completes for certificate i < n; it carries certificate i+1.'
  - name: 'check_failed'
    kind: 'event'
    locator: '§6.1.3, §6.1.4'
    quote: 'If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.'
    inferred: true
    inferred_reason: 'Raised by M01 when a check step fails; it carries the step id as the reason. 6.1.4 states the same for (a), (k), (l), (n) and (o); 6.1.5 states no failing check (OQ-09).'
  - name: 'policy_processing_requested'
    kind: 'event'
    locator: '§6.1.3(d), §6.1.3(e)'
    quote: 'If the certificate policies extension is present in the certificate and the valid_policy_tree is not NULL, process the policy information by performing the following steps in order:'
    inferred: true
    inferred_reason: 'Internal signal from M01 steps 6.1.3(d) and (e) to M02. Carries Certificate i, i, n, inhibit_anyPolicy and self_issued(cert).'
  - name: 'policy_mapping_requested'
    kind: 'event'
    locator: '§6.1.4(b)'
    quote: 'If a policy mappings extension is present, then for each issuerDomainPolicy ID-P in the policy mappings extension:'
    inferred: true
    inferred_reason: 'Internal signal from M01 step 6.1.4(b) to M02. Carries Certificate i, i and policy_mapping.'
  - name: 'policy_wrap_up_requested'
    kind: 'event'
    locator: '§6.1.5(g)'
    quote: 'Calculate the intersection of the valid_policy_tree and the user-initial-policy-set, as follows:'
    inferred: true
    inferred_reason: 'Internal signal from M01 step 6.1.5(g) to M02. Carries n and user-initial-policy-set.'
  - name: 'crl_check_failed'
    kind: 'event'
    locator: '§6.3.3'
    quote: 'For each distribution point (DP) in the certificate''s CRL distribution points extension, for each corresponding CRL in the local CRL cache, while ((reasons_mask is not all-reasons) and (cert_status is UNREVOKED)) perform the following:'
    inferred: true
    inferred_reason: '6.3.3 says verify at (a)(1)(ii), (b), (c), (e), (f), (g) and (h) but never what a failed verification does. Raised by M03 when one fails; M03 abandons that CRL (OQ-15).'
  - name: 'clock_reaches_notBefore'
    kind: 'event'
    locator: '§4.1.2.5'
    quote: 'The validity period for a certificate is the period of time from notBefore through notAfter, inclusive.'
    inferred: true
    inferred_reason: 'The source names the dates, not the clock events.'
  - name: 'clock_passes_notAfter'
    kind: 'event'
    locator: '§4.1.2.5'
    quote: 'The validity period for a certificate is the period of time from notBefore through notAfter, inclusive.'
    inferred: true
    inferred_reason: 'The source names the dates, not the clock events. Because the period is inclusive, the event is the first instant after notAfter.'
  - name: 'clock_passes_nextUpdate'
    kind: 'event'
    locator: '§6.3'
    quote: 'Further, if the next update time of a CRL has passed, the algorithm assumes a mechanism to fetch a current CRL and place it in the local CRL cache.'
    inferred: true
    inferred_reason: 'The source names the condition, not the event.'
  - name: 'status_maintenance_terminated'
    kind: 'event'
    locator: '§4.1.2.5'
    quote: 'When the issuer will not be able to maintain status information until the notAfter date (including when the notAfter date is 99991231235959Z), the issuer MUST ensure that no valid certification path exists for the certificate after maintenance of status information is terminated.'
    inferred: true
    inferred_reason: 'The source names the situation; the event of ending maintenance before notAfter is ours.'
  - name: 'revocation_reported'
    kind: 'event'
    locator: '§3.3'
    quote: 'An entry is added to the CRL as part of the next update following notification of revocation.'
    note: 'Also the revocation request function of §3.5(f), whose protocol other PKIX specifications define.'
  - name: 'hold_released'
    kind: 'event'
    locator: '§5.2.4'
    quote: 'The status of a certificate is considered to have changed if it is revoked (for any revocation reason, including certificateHold), if it is released from hold, or if its revocation reason changes.'
  - name: 'revocation_reason_changed'
    kind: 'event'
    locator: '§5.2.4'
    quote: 'The status of a certificate is considered to have changed if it is revoked (for any revocation reason, including certificateHold), if it is released from hold, or if its revocation reason changes.'
  - name: 'next_crl_entry'
    kind: 'event'
    locator: '§5.3.3'
    quote: 'On subsequent entries in an indirect CRL, if this extension is not present, the certificate issuer for the entry is the same as that for the preceding entry.'
    inferred: true
    inferred_reason: 'The source describes the entries in order; reading the next one is ours. Carries one revokedCertificates entry of the CertificateList.'
  - name: 'new_ca_key_pair'
    kind: 'event'
    locator: '§3.5(e)'
    quote: 'All key pairs need to be updated regularly, i.e., replaced with a new key pair, and new certificates issued.'
  - name: 'old_ca_key_retired'
    kind: 'event'
    locator: '§8'
    quote: 'In particular, self-issued certificates may be used to implement a graceful change-over from one non-compromised CA key pair to the next.'
    inferred: true
    inferred_reason: 'The end of a change-over is not described; the event closing it is ours.'
  - name: 'ca_key_compromised'
    kind: 'event'
    locator: '§8'
    quote: 'If such a compromise is detected, all certificates issued to the compromised CA MUST be revoked, preventing services between its users and users of other CAs.'
  - name: 'ca_key_lost'
    kind: 'event'
    locator: '§8'
    quote: 'Loss of a CA''s private signing key may also be problematic.'

machines:
  # ======================================================================
  - id: 'M01'
    name: 'basic-path-validation'
    locator: '§6.1, §6.1.1, §6.1.2, §6.1.3, §6.1.4, §6.1.5, §6.1.6'
    actor: 'relying party: the X.509 path processing procedure of a conforming implementation'
    purpose: 'Validate one prospective certification path of n certificates against one trust anchor, at time t, to success with the 6.1.6 outputs or to failure with a reason.'
    figure: 'Figure 2 (§6.1): START, Initialization, Process Cert, IF Last Cert in Path, THEN Wrap up then STOP, ELSE Prepare for Next Cert then back to Process Cert.'
    invokes:
      - 'M02 from steps 6.1.3(d), 6.1.3(e), 6.1.4(b) and 6.1.5(g)'
      - 'M03 (or another status source) from step 6.1.3(a)(3)'
      - 'M04 as the validity test of step 6.1.3(a)(2)'
    inputs:
      - name: 'prospective_path'
        locator: '§6.1.1(a)'
        type: 'sequence of n Certificate, certificate 1 issued by the trust anchor, certificate n the target'
        source:
          - locator: '§6.1.1(a)'
            quote: 'a prospective certification path of length n.'
          - locator: '§6.1'
            quote: 'When the trust anchor is provided in the form of a self-signed certificate, this self-signed certificate is not included as part of the prospective certification path.'
        constrained_by:
          - 'rfc-5280#R-0386'
          - 'rfc-5280#R-0376'
          - 'rfc-5280#R-0377'
          - 'rfc-5280#R-0378'
          - 'rfc-5280#R-0379'
          - 'rfc-5280#R-0380'
          - 'rfc-5280#R-0381'
        note: 'Conditions (a) to (d) of 6.1 are what the algorithm verifies, not preconditions it assumes. How the sequence is obtained is out of scope (§6.1).'
      - name: 'current_time'
        locator: '§6.1.1(b)'
        type: 'date/time; written t'
        source:
          - locator: '§6.1.1(b)'
            quote: 'the current date/time.'
          - locator: '§6.1'
            quote: 'A conforming implementation MAY also support validation with respect to some point in the past.'
        constrained_by:
          - 'rfc-5280#R-0387'
          - 'rfc-5280#R-0374'
        note: 'See OQ-04 on validation at a past time.'
      - name: 'user_initial_policy_set'
        locator: '§6.1.1(c)'
        type: 'set of policy OIDs, or the special value any-policy'
        source:
          - locator: '§6.1.1(c)'
            quote: 'The user-initial-policy-set contains the special value any-policy if the user is not concerned about certificate policy.'
        constrained_by:
          - 'rfc-5280#R-0388'
      - name: 'trust_anchor'
        locator: '§6.1.1(d)'
        type: 'trusted issuer name, trusted public key algorithm, trusted public key, optional trusted public key parameters; may be given as a self-signed Certificate'
        source:
          - locator: '§6.1.1(d)'
            quote: 'When the trust anchor information is provided in the form of a certificate, the name in the subject field is used as the trusted issuer name and the contents of the subjectPublicKeyInfo field is used as the source of the trusted public key algorithm and the trusted public key.'
        constrained_by:
          - 'rfc-5280#R-0389'
          - 'rfc-5280#R-0390'
          - 'rfc-5280#R-0375'
      - name: 'initial_policy_mapping_inhibit'
        locator: '§6.1.1(e)'
        type: 'boolean'
        source:
          - locator: '§6.1.1(e)'
            quote: 'initial-policy-mapping-inhibit, which indicates if policy mapping is allowed in the certification path.'
        constrained_by:
          - 'rfc-5280#R-0391'
      - name: 'initial_explicit_policy'
        locator: '§6.1.1(f)'
        type: 'boolean'
        source:
          - locator: '§6.1.1(f)'
            quote: 'initial-explicit-policy, which indicates if the path must be valid for at least one of the certificate policies in the user-initial-policy-set.'
        constrained_by:
          - 'rfc-5280#R-0392'
      - name: 'initial_any_policy_inhibit'
        locator: '§6.1.1(g)'
        type: 'boolean'
        source:
          - locator: '§6.1.1(g)'
            quote: 'initial-any-policy-inhibit, which indicates whether the anyPolicy OID should be processed if it is included in a certificate.'
        constrained_by:
          - 'rfc-5280#R-0393'
      - name: 'initial_permitted_subtrees'
        locator: '§6.1.1(h)'
        type: 'per name type, a set of subtrees (possibly one that includes all names of the type, possibly empty)'
        source:
          - locator: '§6.1.1(h)'
            quote: 'If the set for a name type is empty, then the certification path will be considered invalid if any certificate in the certification path includes a name of that name type.'
        constrained_by:
          - 'rfc-5280#R-0394'
          - 'rfc-5280#R-0395'
      - name: 'initial_excluded_subtrees'
        locator: '§6.1.1(i)'
        type: 'per name type, a set of subtrees (possibly empty)'
        source:
          - locator: '§6.1.1(i)'
            quote: 'If the set for a name type is empty, then no names of that name type are excluded.'
        constrained_by:
          - 'rfc-5280#R-0396'
    state_variables:
      - name: 'valid_policy_tree'
        locator: '§6.1.2(a)'
        type: 'tree of nodes, each {valid_policy: one policy OID, qualifier_set: set of policy qualifiers, expected_policy_set: non-empty set of policy OIDs}; or NULL'
        initial: 'one node at depth 0: valid_policy anyPolicy, qualifier_set {}, expected_policy_set {anyPolicy}'
        initialised_from: 'constant (no input)'
        updated_by:
          - '6.1.3(d)'
          - '6.1.3(e)'
          - '6.1.4(b)'
          - '6.1.5(g)'
        invariant: 'When not NULL, its depth equals the number of certificates processed. Once NULL it stays NULL. Its full lifecycle is M02.'
        source:
          - locator: '§6.1.2(a)'
            quote: 'The initial value of the valid_policy_tree is a single node with valid_policy anyPolicy, an empty qualifier_set, and an expected_policy_set with the single value anyPolicy.'
          - locator: '§6.1.2(a)'
            quote: 'Once the tree is set to NULL, policy processing ceases.'
        constrained_by:
          - 'rfc-5280#R-0398'
          - 'rfc-5280#R-0399'
          - 'rfc-5280#R-0400'
          - 'rfc-5280#R-0401'
          - 'rfc-5280#R-0402'
          - 'rfc-5280#R-0403'
      - name: 'permitted_subtrees'
        locator: '§6.1.2(b)'
        type: 'per name type, a set of root names defining subtrees'
        initial: 'initial-permitted-subtrees'
        initialised_from: 'PathValidationInputs.initial_permitted_subtrees (6.1.1(h))'
        updated_by:
          - '6.1.4(g)'
        invariant: 'Changes only by intersection, so the permitted name space never grows (inferred from 6.1.4(g)(1)).'
        source:
          - locator: '§6.1.2(b)'
            quote: 'This variable includes a set for each name type, and the initial value is initial-permitted-subtrees.'
        constrained_by:
          - 'rfc-5280#R-0404'
          - 'rfc-5280#R-0405'
      - name: 'excluded_subtrees'
        locator: '§6.1.2(c)'
        type: 'per name type, a set of root names defining subtrees'
        initial: 'initial-excluded-subtrees'
        initialised_from: 'PathValidationInputs.initial_excluded_subtrees (6.1.1(i))'
        updated_by:
          - '6.1.4(g)'
        invariant: 'Changes only by union, so the excluded name space never shrinks (inferred from 6.1.4(g)(2)).'
        source:
          - locator: '§6.1.2(c)'
            quote: 'This variable includes a set for each name type, and the initial value is initial-excluded-subtrees.'
        constrained_by:
          - 'rfc-5280#R-0406'
      - name: 'explicit_policy'
        locator: '§6.1.2(d)'
        type: 'integer >= 0: the number of non-self-issued certificates to be processed before a non-NULL valid_policy_tree is required'
        initial: '0 if initial-explicit-policy is set, otherwise n+1'
        initialised_from: 'PathValidationInputs.initial_explicit_policy (6.1.1(f)) and n'
        updated_by:
          - '6.1.4(h)'
          - '6.1.4(i)'
          - '6.1.5(a)'
          - '6.1.5(b)'
        invariant: 'Never increases.'
        source:
          - locator: '§6.1.2(d)'
            quote: 'Once set, this variable may be decreased, but may not be increased.'
          - locator: '§6.1.2(d)'
            quote: 'If initial-explicit-policy is set, then the initial value is 0, otherwise the initial value is n+1.'
        constrained_by:
          - 'rfc-5280#R-0407'
      - name: 'inhibit_anyPolicy'
        locator: '§6.1.2(e)'
        type: 'integer >= 0: the number of non-self-issued certificates to be processed before anyPolicy is ignored (other than in an intermediate self-issued certificate)'
        initial: '0 if initial-any-policy-inhibit is set, otherwise n+1'
        initialised_from: 'PathValidationInputs.initial_any_policy_inhibit (6.1.1(g)) and n'
        updated_by:
          - '6.1.4(h)'
          - '6.1.4(j)'
        invariant: 'Never increases.'
        source:
          - locator: '§6.1.2(e)'
            quote: 'That is, if a certificate in the path inhibits processing of anyPolicy, a later certificate cannot permit it.'
          - locator: '§6.1.2(e)'
            quote: 'If initial-any-policy-inhibit is set, then the initial value is 0, otherwise the initial value is n+1.'
        constrained_by:
          - 'rfc-5280#R-0408'
      - name: 'policy_mapping'
        locator: '§6.1.2(f)'
        type: 'integer >= 0: the number of non-self-issued certificates to be processed before policy mapping is inhibited'
        initial: '0 if initial-policy-mapping-inhibit is set, otherwise n+1'
        initialised_from: 'PathValidationInputs.initial_policy_mapping_inhibit (6.1.1(e)) and n'
        updated_by:
          - '6.1.4(h)'
          - '6.1.4(i)'
        invariant: 'Never increases.'
        source:
          - locator: '§6.1.2(f)'
            quote: 'That is, if a certificate in the path specifies that policy mapping is not permitted, it cannot be overridden by a later certificate.'
          - locator: '§6.1.2(f)'
            quote: 'If initial-policy-mapping-inhibit is set, then the initial value is 0, otherwise the initial value is n+1.'
        constrained_by:
          - 'rfc-5280#R-0409'
      - name: 'working_public_key_algorithm'
        locator: '§6.1.2(g)'
        type: 'algorithm identifier'
        initial: 'the trusted public key algorithm'
        initialised_from: 'PathValidationInputs.trust_anchor (6.1.1(d)(2))'
        updated_by:
          - '6.1.4(f)'
          - '6.1.5(e)'
        source:
          - locator: '§6.1.2(g)'
            quote: 'The working_public_key_algorithm is initialized from the trusted public key algorithm provided in the trust anchor information.'
        constrained_by:
          - 'rfc-5280#R-0410'
      - name: 'working_public_key'
        locator: '§6.1.2(h)'
        type: 'public key'
        initial: 'the trusted public key'
        initialised_from: 'PathValidationInputs.trust_anchor (6.1.1(d)(3))'
        updated_by:
          - '6.1.4(d)'
          - '6.1.5(c)'
        source:
          - locator: '§6.1.2(h)'
            quote: 'The working_public_key is initialized from the trusted public key provided in the trust anchor information.'
        constrained_by:
          - 'rfc-5280#R-0411'
      - name: 'working_public_key_parameters'
        locator: '§6.1.2(i)'
        type: 'algorithm parameters, or null'
        initial: 'the trusted public key parameters (an optional input; null when absent, inferred, OQ-10)'
        initialised_from: 'PathValidationInputs.trust_anchor (6.1.1(d)(4))'
        updated_by:
          - '6.1.4(e)'
          - '6.1.5(d)'
        source:
          - locator: '§6.1.2(i)'
            quote: 'The working_public_key_parameters variable is initialized from the trusted public key parameters provided in the trust anchor information.'
        constrained_by:
          - 'rfc-5280#R-0412'
      - name: 'working_issuer_name'
        locator: '§6.1.2(j)'
        type: 'distinguished name'
        initial: 'the trusted issuer name'
        initialised_from: 'PathValidationInputs.trust_anchor (6.1.1(d)(1))'
        updated_by:
          - '6.1.4(c)'
        source:
          - locator: '§6.1.2(j)'
