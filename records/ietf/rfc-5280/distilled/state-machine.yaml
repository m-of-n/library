          - 'rfc-5280#R-0295'
          - 'rfc-5280#R-0296'
          - 'rfc-5280#R-0274'
          - 'rfc-5280#R-0275'
          - 'rfc-5280#R-0281'
          - 'rfc-5280#R-0282'
      - id: 'M06-T02'
        from: 'published'
        to: 'published'
        trigger: 'CertificateList'
        guard: 'A complete CRL; thisUpdate differs from last_this_update and its CRL number > last_crl_number; its nextUpdate SHOULD be >= every previous nextUpdate; it is issued no later than promised_next_update.'
        action: 'Record the number, thisUpdate and nextUpdate; add the number to complete_crl_numbers.'
        source:
