        from: 'processing-crl'
        to: 'crl-abandoned'
        trigger: 'crl_check_failed'
        guard: 'Step (f) failed: the CRL issuer''s path does not validate from the same trust anchor, or cRLSign is not set.'
        source:
          - locator: '§6.3.3(f)'
            quote: 'Obtain and validate the certification path for the issuer of the complete CRL.'
        inferred: true
        inferred_reason: '6.3.3 says verify but gives no failure path. Abandoning this CRL and continuing the loop is ours (OQ-15); the alternative reading, that the whole revocation check fails, is not supported by any text.'
        constrained_by:
          - 'rfc-5280#R-0525'
          - 'rfc-5280#R-0526'
          - 'rfc-5280#R-0527'
      - id: 'M03-T13'
        from: 'processing-crl'
        to: 'crl-abandoned'
        trigger: 'crl_check_failed'
        guard: 'Step (g) failed: the complete CRL''s signature does not verify.'
        source:
          - locator: '§6.3.3(g)'
            quote: 'Validate the signature on the complete CRL using the public key validated in step (f).'
        inferred: true
        inferred_reason: '6.3.3 says verify but gives no failure path. Abandoning this CRL and continuing the loop is ours (OQ-15); the alternative reading, that the whole revocation check fails, is not supported by any text.'
        constrained_by:
          - 'rfc-5280#R-0528'
      - id: 'M03-T14'
        from: 'processing-crl'
        to: 'crl-abandoned'
        trigger: 'crl_check_failed'
        guard: 'Step (h) ran and failed: the delta CRL''s signature does not verify.'
        source:
          - locator: '§6.3.3(h)'
            quote: 'If use-deltas is set, then validate the signature on the delta CRL using the public key validated in step (f).'
        inferred: true
        inferred_reason: '6.3.3 says verify but gives no failure path. Abandoning this CRL and continuing the loop is ours (OQ-15); the alternative reading, that the whole revocation check fails, is not supported by any text.'
        constrained_by:
          - 'rfc-5280#R-0529'
      - id: 'M03-T15'
        from: 'crl-abandoned'
        to: 'selecting'
        trigger: 'completion'
        guard: 'always'
        action: 'None: the failing steps precede (i) to (l), so reasons_mask and cert_status are unchanged.'
        source:
          - locator: '§6.3.3'
            quote: 'For each distribution point (DP) in the certificate''s CRL distribution points extension, for each corresponding CRL in the local CRL cache, while ((reasons_mask is not all-reasons) and (cert_status is UNREVOKED)) perform the following:'
        inferred: true
        inferred_reason: '6.3.3 says verify but gives no failure path. Abandoning this CRL and continuing the loop is ours (OQ-15); the alternative reading, that the whole revocation check fails, is not supported by any text.'
        constrained_by:
          - 'rfc-5280#R-0502'
    error_states:
      - 'crl-abandoned'
    terminal_states:
      - 'status-determined'
      - 'status-undetermined'
    guard_coverage:
      - 'selecting: T02 when determined; otherwise T03 if a pair remains, else T04 in phase distribution-points or T05 in phase issuer-crls. Exclusive and complete.'
      - 'processing-crl: T07 to T14 at the first failing check in step order, otherwise T06. Exclusive and complete over the modelled checks; the failure transitions themselves are inferred (OQ-15).'
      - 'The loop terminates: each pass consumes one pair, and the pair sets are finite (the cache content is fixed for the run; inferred).'
    unspecified:
      - from: 'processing-crl'
        trigger: 'completion'
        situation: 't equal to nextUpdate in (a): neither ''after'' nor ''before'' holds; and a CRL that omits nextUpdate.'
        open_question: 'OQ-13'
      - from: 'processing-crl'
        trigger: 'completion'
        situation: '(a)(1) when both (i) and (ii) are possible; (c), (h), (i) with use_deltas set but no delta CRL obtained.'
        open_question: 'OQ-14'
      - from: 'processing-crl'
        trigger: 'crl_check_failed'
        situation: 'Whether a failed verification abandons the CRL or fails the revocation check.'
        open_question: 'OQ-15'
      - from: 'processing-crl'
        trigger: 'completion'
        situation: 'Termination of the recursion through (f) when the CRL issuer''s certificates are themselves checked by CRL.'
        open_question: 'OQ-16'
  # ======================================================================
  - id: 'M04'
    name: 'certificate-validity-period'
    locator: '§4.1.2.5, §4.1.2.5.1, §4.1.2.5.2, §3.3, §6.1'
    actor: 'the certificate, as seen by any relying party at time t; the issuer for M04-T07'
    purpose: 'Where t lies against [notBefore, notAfter], including the no-expiry value, and the issuer''s duty when it stops maintaining status information.'
    time_rules:
      text: 'notBefore and notAfter are UTCTime through 2049 and GeneralizedTime from 2050, both in Zulu with seconds and GeneralizedTime without fractions; UTCTime YY >= 50 is 19YY and YY < 50 is 20YY. Comparisons are made on the decoded instants.'
      source:
        - locator: '§4.1.2.5'
          quote: 'CAs conforming to this profile MUST always encode certificate validity dates through the year 2049 as UTCTime; certificate validity dates in 2050 or later MUST be encoded as GeneralizedTime.'
        - locator: '§4.1.2.5.1'
          quote: 'Where YY is greater than or equal to 50, the year SHALL be interpreted as 19YY; and'
      constrained_by:
        - 'rfc-5280#R-0033'
        - 'rfc-5280#R-0034'
        - 'rfc-5280#R-0035'
        - 'rfc-5280#R-0038'
        - 'rfc-5280#R-0039'
        - 'rfc-5280#R-0040'
        - 'rfc-5280#R-0041'
        - 'rfc-5280#R-0042'
        - 'rfc-5280#R-0043'
        - 'rfc-5280#R-0044'
        - 'rfc-5280#R-0045'
    initial: 'issued'
    states:
      - name: 'issued'
        meaning: 'The certificate exists and has not yet been presented for evaluation at t.'
        inferred: true
      - name: 'not-yet-valid'
        meaning: 't < notBefore.'
        inferred: false
      - name: 'valid'
        meaning: 'notBefore <= t <= notAfter. With notAfter = 99991231235959Z the certificate has no well-defined expiration date.'
        inferred: false
      - name: 'expired'
        meaning: 't > notAfter. A path including the certificate fails 6.1.3(a)(2) at t.'
        inferred: false
      - name: 'status-unmaintained'
        meaning: 'The issuer has stopped maintaining status information before notAfter and has ensured that no valid certification path exists for the certificate.'
        inferred: false
        kind: 'error'
    transitions:
      - id: 'M04-T01'
        from: 'issued'
        to: 'not-yet-valid'
        trigger: 'Certificate'
        guard: 't < notBefore.'
        source:
          - locator: '§4.1.2.5'
            quote: 'The validity period for a certificate is the period of time from notBefore through notAfter, inclusive.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0419'
      - id: 'M04-T02'
        from: 'issued'
        to: 'valid'
        trigger: 'Certificate'
        guard: 'notBefore <= t <= notAfter.'
        source:
          - locator: '§4.1.2.5'
            quote: 'The validity period for a certificate is the period of time from notBefore through notAfter, inclusive.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0419'
      - id: 'M04-T03'
        from: 'issued'
        to: 'expired'
        trigger: 'Certificate'
        guard: 't > notAfter.'
        source:
          - locator: '§4.1.2.5'
            quote: 'The validity period for a certificate is the period of time from notBefore through notAfter, inclusive.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0419'
      - id: 'M04-T04'
        from: 'not-yet-valid'
        to: 'valid'
        trigger: 'clock_reaches_notBefore'
        guard: 'always'
        source:
          - locator: '§4.1.2.5'
            quote: 'The validity period for a certificate is the period of time from notBefore through notAfter, inclusive.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0419'
      - id: 'M04-T05'
        from: 'valid'
        to: 'expired'
        trigger: 'clock_passes_notAfter'
        guard: 'notAfter != 99991231235959Z.'
        source:
          - locator: '§4.1.2.5'
            quote: 'The validity period for a certificate is the period of time from notBefore through notAfter, inclusive.'
          - locator: '§3.3'
            quote: 'When a certificate is issued, it is expected to be in use for its entire validity period.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0419'
      - id: 'M04-T06'
        from: 'valid'
        to: 'expired'
        trigger: 'clock_passes_notAfter'
        guard: 'notAfter = 99991231235959Z.'
        source:
          - locator: '§4.1.2.5'
            quote: 'To indicate that a certificate has no well-defined expiration date, the notAfter SHOULD be assigned the GeneralizedTime value of 99991231235959Z.'
        inferred: true
        inferred_reason: 'The value is an ordinary GeneralizedTime instant, so the transition exists formally; the source intends that it is never reached in the life of the device.'
        constrained_by:
          - 'rfc-5280#R-0036'
      - id: 'M04-T07'
        from: 'valid'
        to: 'status-unmaintained'
        trigger: 'status_maintenance_terminated'
        guard: 't <= notAfter (the issuer cannot maintain status information until notAfter, including when notAfter is 99991231235959Z).'
        action: 'The issuer ensures no valid certification path exists for the certificate: for example, all CA certificates containing the public key that verifies its signature expire or are revoked, and that public key is no longer used as a trust anchor.'
        source:
          - locator: '§4.1.2.5'
            quote: 'When the issuer will not be able to maintain status information until the notAfter date (including when the notAfter date is 99991231235959Z), the issuer MUST ensure that no valid certification path exists for the certificate after maintenance of status information is terminated.'
          - locator: '§4.1.2.5'
            quote: 'This may be accomplished by expiration or revocation of all CA certificates containing the public key used to verify the signature on the certificate and discontinuing use of the public key used to verify the signature on the certificate as a trust anchor.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0037'
    error_states:
      - 'status-unmaintained'
    terminal_states:
      - 'expired'
      - 'status-unmaintained'
    guard_coverage:
      - 'T01 to T03 partition t against the closed interval: exclusive and complete. T05 and T06 partition on the no-expiry value.'
    note: 'Validation is defined only within the period: ''mechanisms are not available for validating a certificate with respect to a time outside the certificate validity period'' (§6.1). Revocation inside the period is M05.'
  # ======================================================================
  - id: 'M05'
    name: 'certificate-revocation-status'
    locator: '§3.3, §5.1.2.6, §5.2.4, §5.3.1, §5.3.2'
    actor: 'CRL issuer, for one certificate within one CRL scope'
    purpose: 'One certificate''s revocation status as its CRL issuer records it, from issuance through revocation or hold, release from hold, expiry and removal of the CRL entry.'
    reason_codes:
      - value: 'unspecified (0)'
        state: 'listed-revoked'
        note: 'SHOULD be expressed by omitting the reasonCode extension (R-0358); M03 maps an entry without the extension to unspecified.'
      - value: 'keyCompromise (1)'
        state: 'listed-revoked'
      - value: 'cACompromise (2)'
        state: 'listed-revoked'
      - value: 'affiliationChanged (3)'
        state: 'listed-revoked'
      - value: 'superseded (4)'
        state: 'listed-revoked'
      - value: 'cessationOfOperation (5)'
        state: 'listed-revoked'
      - value: 'certificateHold (6)'
        state: 'listed-on-hold'
        note: 'Considered revoked by relying parties (§5.3.1); M03 returns certificateHold and M01 fails 6.1.3(a)(3).'
      - value: '7'
        state: 'none'
        note: 'Not used (§5.3.1 ASN.1 comment).'
      - value: 'removeFromCRL (8)'
        state: 'none'
        note: 'Not a status: an instruction in a delta CRL that the certificate is removed from the CRL, because it expired or was released from hold. Only in delta CRLs (R-0359).'
      - value: 'privilegeWithdrawn (9)'
        state: 'listed-revoked'
      - value: 'aACompromise (10)'
        state: 'listed-revoked'
    reason_codes_source:
      - locator: '§5.3.1'
        quote: 'The reasonCode is a non-critical CRL entry extension that identifies the reason for the certificate revocation.'
      - locator: '§5.3.1'
        quote: 'All other reason codes may appear in any CRL and indicate that the specified certificate should be considered revoked.'
      - locator: '§5.3.1'
        quote: 'The removeFromCRL (8) reasonCode value may only appear in delta CRLs and indicates that a certificate is to be removed from a CRL because either the certificate expired or was removed from hold.'
    reason_codes_constrained_by:
      - 'rfc-5280#R-0357'
      - 'rfc-5280#R-0358'
      - 'rfc-5280#R-0359'
    initial: 'unrevoked'
    states:
      - name: 'unrevoked'
        meaning: 'Not listed on any CRL of the scope.'
        inferred: false
      - name: 'revocation-pending'
        meaning: 'Revocation notified and accepted; not yet on a CRL.'
        inferred: true
      - name: 'listed-revoked'
        meaning: 'Listed with a reason other than certificateHold (or with none).'
        inferred: false
      - name: 'listed-on-hold'
        meaning: 'Listed with reason certificateHold.'
        inferred: false
      - name: 'expired-while-listed'
        meaning: 'The validity period has ended and the entry is still listed.'
        inferred: false
      - name: 'entry-removed'
        meaning: 'The entry has been dropped after appearing on a regularly scheduled CRL issued beyond the validity period.'
        inferred: false
    transitions:
      - id: 'M05-T01'
        from: 'unrevoked'
        to: 'revocation-pending'
        trigger: 'revocation_reported'
        guard: 'The CA accepts the report as authentic and valid.'
        source:
          - locator: '§3.3'
            quote: 'An entry is added to the CRL as part of the next update following notification of revocation.'
          - locator: '§3.3'
            quote: 'Once the CA accepts a revocation report as authentic and valid, any query to the on-line service will correctly reflect the certificate validation impacts of the revocation.'
        inferred: true
        inferred_reason: 'The source names the notification and the next update, not an intermediate state.'
        constrained_by: []
      - id: 'M05-T02'
        from: 'revocation-pending'
        to: 'listed-revoked'
        trigger: 'CertificateList'
        guard: 'The next CRL (complete or delta) of the scope is issued, and the reason is not certificateHold.'
        action: 'Add an entry: serial number, revocationDate, reasonCode when meaningful (absent rather than unspecified), invalidityDate when known.'
        source:
          - locator: '§3.3'
            quote: 'An entry is added to the CRL as part of the next update following notification of revocation.'
          - locator: '§5.1.2.6'
            quote: 'Otherwise, revoked certificates are listed by their serial numbers.'
          - locator: '§5.2.4'
            quote: 'In this case, the revocation notice MUST be included in all subsequent delta CRLs until the revocation notice is included on at least one explicitly issued complete CRL for this scope.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0286'
          - 'rfc-5280#R-0287'
          - 'rfc-5280#R-0312'
          - 'rfc-5280#R-0357'
          - 'rfc-5280#R-0358'
          - 'rfc-5280#R-0360'
          - 'rfc-5280#R-0361'
          - 'rfc-5280#R-0362'
      - id: 'M05-T03'
        from: 'revocation-pending'
        to: 'listed-on-hold'
        trigger: 'CertificateList'
        guard: 'The next CRL of the scope is issued, and the reason is certificateHold.'
        action: 'As M05-T02, with reasonCode certificateHold.'
        source:
          - locator: '§3.3'
            quote: 'An entry is added to the CRL as part of the next update following notification of revocation.'
          - locator: '§5.3.1'
            quote: 'All other reason codes may appear in any CRL and indicate that the specified certificate should be considered revoked.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0286'
          - 'rfc-5280#R-0287'
          - 'rfc-5280#R-0312'
      - id: 'M05-T04'
        from: 'listed-on-hold'
        to: 'listed-revoked'
        trigger: 'revocation_reason_changed'
        guard: 'The hold becomes a revocation for another reason.'
        action: 'The next delta CRL lists the certificate with its new reason (a status change).'
        source:
          - locator: '§5.2.4'
            quote: 'The status of a certificate is considered to have changed if it is revoked (for any revocation reason, including certificateHold), if it is released from hold, or if its revocation reason changes.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0312'
      - id: 'M05-T05'
        from: 'listed-on-hold'
        to: 'unrevoked'
        trigger: 'hold_released'
        guard: 'always'
        action: 'Every later delta CRL whose referenced base or later CRL listed the hold, and whose scope includes certificateHold, lists the certificate with removeFromCRL; later complete CRLs omit it.'
        source:
          - locator: '§5.2.4'
            quote: 'If the certificate is valid and was listed on the referenced base CRL or any subsequent CRL with reason code certificateHold, and the reason code certificateHold is included in the scope of the CRL, list the certificate with the reason code removeFromCRL.'
          - locator: '§5.2.4'
            quote: 'If the certificate was placed on hold in any CRL issued after the base but before this delta CRL and then released from hold, it MUST be listed on the delta CRL with revocation reason removeFromCRL.'
          - locator: '§5.3.1'
            quote: 'The removeFromCRL (8) reasonCode value may only appear in delta CRLs and indicates that a certificate is to be removed from a CRL because either the certificate expired or was removed from hold.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0312'
          - 'rfc-5280#R-0313'
          - 'rfc-5280#R-0359'
        note: 'That complete CRLs omit a released certificate follows from removeFromCRL appearing only in delta CRLs and from §5 (a complete CRL lists revoked certificates); inferred.'
      - id: 'M05-T06'
        from: 'listed-revoked'
        to: 'listed-revoked'
        trigger: 'revocation_reason_changed'
        guard: 'always'
        action: 'The next delta CRL lists the certificate with its new reason.'
        source:
          - locator: '§5.2.4'
            quote: 'The status of a certificate is considered to have changed if it is revoked (for any revocation reason, including certificateHold), if it is released from hold, or if its revocation reason changes.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0312'
      - id: 'M05-T07'
        from: 'listed-revoked'
        to: 'expired-while-listed'
        trigger: 'clock_passes_notAfter'
        guard: 'always'
        source:
          - locator: '§3.3'
            quote: 'An entry MUST NOT be removed from the CRL until it appears on one regularly scheduled CRL issued beyond the revoked certificate''s validity period.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0003'
      - id: 'M05-T08'
        from: 'listed-on-hold'
        to: 'expired-while-listed'
        trigger: 'clock_passes_notAfter'
        guard: 'always'
        source:
          - locator: '§3.3'
            quote: 'An entry MUST NOT be removed from the CRL until it appears on one regularly scheduled CRL issued beyond the revoked certificate''s validity period.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0003'
      - id: 'M05-T09'
        from: 'expired-while-listed'
        to: 'expired-while-listed'
        trigger: 'CertificateList'
        guard: 'The entry has not yet appeared on a regularly scheduled CRL issued after notAfter.'
        action: 'The entry is kept. If the revocation notice first appeared on a delta CRL and the validity period ended before the next complete CRL for the scope, every later delta CRL repeats it until a complete CRL for the scope carries it.'
        source:
          - locator: '§3.3'
            quote: 'An entry MUST NOT be removed from the CRL until it appears on one regularly scheduled CRL issued beyond the revoked certificate''s validity period.'
          - locator: '§5.2.4'
            quote: 'If a certificate revocation notice first appears on a delta CRL, then it is possible for the certificate validity period to expire before the next complete CRL for the same scope is issued.  In this case, the revocation notice MUST be included in all subsequent delta CRLs until the revocation notice is included on at least one explicitly issued complete CRL for this scope.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0003'
          - 'rfc-5280#R-0315'
      - id: 'M05-T10'
        from: 'expired-while-listed'
        to: 'entry-removed'
        trigger: 'CertificateList'
        guard: 'The entry has appeared on at least one regularly scheduled CRL issued after notAfter, and, if its notice first appeared on a delta CRL, on at least one complete CRL for the scope.'
        action: 'The entry may be dropped. A delta CRL whose thisUpdate is after notAfter MAY list the certificate with removeFromCRL if it was on the referenced base CRL or a CRL issued after it.'
        source:
          - locator: '§3.3'
            quote: 'An entry MUST NOT be removed from the CRL until it appears on one regularly scheduled CRL issued beyond the revoked certificate''s validity period.'
          - locator: '§5.2.4'
            quote: 'A CRL issuer MAY optionally list a certificate on a delta CRL with reason code removeFromCRL if the notAfter time specified in the certificate precedes the thisUpdate time specified in the delta CRL and the certificate was listed on the referenced base CRL or in any CRL issued after the base but before this delta CRL.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0003'
          - 'rfc-5280#R-0314'
          - 'rfc-5280#R-0315'
    terminal_states:
      - 'entry-removed'
    guard_coverage:
      - 'revocation-pending: T02 and T03 partition on certificateHold. expired-while-listed: T09 and T10 partition on whether the removal conditions hold.'
    unspecified:
      - from: 'listed-revoked'
        trigger: 'hold_released'
        situation: 'Whether a revocation for a permanent reason can be undone, or turned into a hold; the source neither allows nor forbids it.'
        open_question: 'OQ-18'
      - from: 'expired-while-listed'
        trigger: 'CertificateList'
        situation: 'What makes a CRL ''regularly scheduled''.'
        open_question: 'OQ-25'
      - from: 'unrevoked'
        trigger: 'revocation_reported'
        situation: 'Revocation reported after notAfter.'
        open_question: 'OQ-18'
    note: '§8: when a CA''s private key is compromised, all certificates issued to that CA MUST be revoked (R-0581); that is M10-T05 driving M05-T01 for each of them.'
  # ======================================================================
  - id: 'M06'
    name: 'crl-issuance-sequence'
    locator: '§5, §5.1.2.4, §5.1.2.5, §5.2.3, §5.2.4'
    actor: 'CRL issuer, for one CRL scope'
    purpose: 'The sequence of complete and delta CRLs one issuer publishes for one scope: CRL numbers, thisUpdate and nextUpdate, and the delta CRL rules.'
    state_variables:
      - name: 'last_crl_number'
        type: 'integer (0..MAX), at most 20 octets'
        initial: 'none'
        source:
          - locator: '§5.2.3'
            quote: 'The CRL number is a non-critical CRL extension that conveys a monotonically increasing sequence number for a given CRL scope and CRL issuer.'
        constrained_by:
          - 'rfc-5280#R-0295'
          - 'rfc-5280#R-0302'
          - 'rfc-5280#R-0303'
          - 'rfc-5280#R-0607'
          - 'rfc-5280#R-0608'
      - name: 'last_this_update'
        type: 'time'
        initial: 'none'
        source:
          - locator: '§5.1.2.4'
            quote: 'This field indicates the issue date of this CRL.'
        constrained_by:
          - 'rfc-5280#R-0274'
          - 'rfc-5280#R-0275'
      - name: 'promised_next_update'
        type: 'time: the latest nextUpdate issued'
        initial: 'none'
        source:
          - locator: '§5.1.2.5'
            quote: 'This field indicates the date by which the next CRL will be issued.'
        constrained_by:
          - 'rfc-5280#R-0279'
          - 'rfc-5280#R-0280'
      - name: 'complete_crl_numbers'
        type: 'set of CRL numbers published as complete CRLs (possible base CRLs)'
        initial: '{}'
        source:
          - locator: '§5.2.4'
            quote: 'A conforming CRL issuer MUST publish the referenced base CRL as a complete CRL.'
        constrained_by:
          - 'rfc-5280#R-0304'
        inferred: true
        inferred_reason: 'Bookkeeping the delta rules need.'
    initial: 'no-crl-issued'
    states:
      - name: 'no-crl-issued'
        meaning: 'No CRL has been issued for the scope.'
        inferred: true
      - name: 'published'
        meaning: 'At least one CRL is published and t <= promised_next_update.'
        inferred: false
      - name: 'overdue'
        meaning: 't is after promised_next_update and no new CRL has been issued: the issuer has broken the nextUpdate promise.'
        inferred: true
        kind: 'error'
    transitions:
      - id: 'M06-T01'
        from: 'no-crl-issued'
        to: 'published'
        trigger: 'CertificateList'
        guard: 'The CRL is a complete CRL (a delta CRL needs a published base).'
        action: 'Issue a version 2 CRL with thisUpdate, nextUpdate, a CRL number and an authority key identifier (key identifier method). Record last_crl_number, last_this_update, promised_next_update; add the number to complete_crl_numbers.'
        source:
          - locator: '§5'
            quote: 'When CRLs are issued, the CRLs MUST be version 2 CRLs, include the date by which the next CRL will be issued in the nextUpdate field (Section 5.1.2.5), include the CRL number extension (Section 5.2.3), and include the authority key identifier extension (Section 5.2.1).'
