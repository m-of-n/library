          - locator: '§5.2.4'
            quote: 'When a conforming CRL issuer generates a delta CRL, the delta CRL MUST include a critical delta CRL indicator extension.'
          - locator: '§5.2.4'
            quote: 'Further, the CRL issuer MUST use the same private key to sign the delta CRL and any complete CRL that it can be used to update.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0257'
          - 'rfc-5280#R-0258'
          - 'rfc-5280#R-0297'
          - 'rfc-5280#R-0300'
          - 'rfc-5280#R-0301'
          - 'rfc-5280#R-0304'
          - 'rfc-5280#R-0305'
          - 'rfc-5280#R-0306'
          - 'rfc-5280#R-0307'
          - 'rfc-5280#R-0308'
          - 'rfc-5280#R-0309'
          - 'rfc-5280#R-0311'
          - 'rfc-5280#R-0312'
          - 'rfc-5280#R-0313'
          - 'rfc-5280#R-0315'
          - 'rfc-5280#R-0336'
          - 'rfc-5280#R-0359'
      - id: 'M06-T04'
        from: 'published'
        to: 'published'
        trigger: 'CertificateList'
        guard: 'A complete CRL and a delta CRL of the scope issued at the same time (same thisUpdate).'
        action: 'Both carry the same CRL number and the same revocation information: the delta combined with an acceptable complete CRL equals the simultaneous complete CRL.'
