      - from: 'processing-certificate'
        trigger: 'check_failed'
        situation: 'The same certificate appears twice in the path (R-0380): no step detects it.'
        open_question: 'OQ-02'
      - from: 'processing-certificate'
        trigger: 'completion'
        situation: '6.1.3(a)(3) when the revocation status is UNDETERMINED (M03-T05).'
        open_question: 'OQ-03'
  # ======================================================================
  - id: 'M02'
    name: 'valid-policy-tree'
    locator: '§6.1.2(a), §6.1.3(d), §6.1.3(e), §6.1.4(a), §6.1.4(b), §6.1.5(g)'
    actor: 'relying party (driven by M01)'
    purpose: 'The valid_policy_tree state variable of M01 through node creation, pruning, policy mapping and the final intersection with user-initial-policy-set.'
    node:
      fields:
        - 'valid_policy: one policy OID'
        - 'qualifier_set: set of policy qualifiers'
        - 'expected_policy_set: set of one or more policy OIDs'
      source:
        - locator: '§6.1.2(a)'
          quote: 'Each node in the valid_policy_tree includes three data objects: the valid policy, a set of associated policy qualifiers, and a set of one or more expected policy values.'
      constrained_by:
        - 'rfc-5280#R-0399'
        - 'rfc-5280#R-0400'
        - 'rfc-5280#R-0401'
        - 'rfc-5280#R-0402'
    initial: 'non-null'
    states:
      - name: 'non-null'
        meaning: 'The tree has at least one node; between certificates its depth equals the number of certificates processed. Initially the depth 0 node {anyPolicy, {}, {anyPolicy}} (Figure 3).'
        inferred: false
      - name: 'extending'
        meaning: '6.1.3(d) is adding depth i children for certificate i and pruning.'
        inferred: false
        steps:
          - id: '6.1.3(d)(1)(i)'
            kind: 'action'
            applies_when: 'for each policy P in certificatePolicies of cert with P != anyPolicy (P-OID its OID, P-Q its qualifier set)'
            action: 'For each node N of depth i-1 with P-OID in N.expected_policy_set: add a child of N {valid_policy: P-OID, qualifier_set: P-Q, expected_policy_set: {P-OID}}.'
            source:
              - locator: '§6.1.3(d)(1)'
                quote: 'For each policy P not equal to anyPolicy in the certificate policies extension, let P-OID denote the OID for policy P and P-Q denote the qualifier set for policy P.  Perform the following steps in order:'
              - locator: '§6.1.3(d)(1)(i)'
                quote: 'For each node of depth i-1 in the valid_policy_tree where P-OID is in the expected_policy_set, create a child node as follows: set the valid_policy to P-OID, set the qualifier_set to P-Q, and set the expected_policy_set to {P-OID}.'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0425'
              - 'rfc-5280#R-0426'
              - 'rfc-5280#R-0105'
            note: 'Figure 4 (Processing an Exact Match) is the source''s example.'
          - id: '6.1.3(d)(1)(ii)'
            kind: 'action'
            applies_when: 'for the same P, when (d)(1)(i) created no node for P, and a node of depth i-1 has valid_policy anyPolicy'
            skipped_when: '(d)(1)(i) created at least one node for P, or no depth i-1 node has valid_policy anyPolicy'
            action: 'Add a child of the depth i-1 anyPolicy node {valid_policy: P-OID, qualifier_set: P-Q, expected_policy_set: {P-OID}}.'
            source:
              - locator: '§6.1.3(d)(1)(ii)'
                quote: 'If there was no match in step (i) and the valid_policy_tree includes a node of depth i-1 with the valid_policy anyPolicy, generate a child node with the following values: set the valid_policy to P-OID, set the qualifier_set to P-Q, and set the expected_policy_set to  {P-OID}.'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0427'
            note: 'Figure 5. Reading ''no match'' as no node of depth i-1 matched P is ours (OQ-07). At most one depth i-1 node can carry valid_policy anyPolicy, because anyPolicy children come only from (d)(2) of an anyPolicy parent (inferred).'
          - id: '6.1.3(d)(2)'
            kind: 'action'
            applies_when: 'certificatePolicies of cert includes anyPolicy with qualifier set AP-Q, and (inhibit_anyPolicy > 0 or (i < n and self_issued(cert)))'
            skipped_when: 'anyPolicy not asserted, or inhibit_anyPolicy = 0 and (i = n or not self_issued(cert))'
            action: 'For each node N of depth i-1 and each value v in N.expected_policy_set (anyPolicy included) such that no child of N has valid_policy v: add a child of N {valid_policy: v, qualifier_set: AP-Q, expected_policy_set: {v}}.'
            source:
              - locator: '§6.1.3(d)(2)'
                quote: 'If the certificate policies extension includes the policy anyPolicy with the qualifier set AP-Q and either (a) inhibit_anyPolicy is greater than 0 or (b) i<n and the certificate is self-issued, then:'
              - locator: '§6.1.3(d)(2)'
                quote: 'For each node in the valid_policy_tree of depth i-1, for each value in the expected_policy_set (including anyPolicy) that does not appear in a child node, create a child node with the following values: set the valid_policy to the value from the expected_policy_set in the parent node, set the qualifier_set to AP-Q, and set the expected_policy_set to the value in the valid_policy from this node.'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0428'
              - 'rfc-5280#R-0106'
              - 'rfc-5280#R-0109'
            note: 'Figure 6. inhibit_anyPolicy is read before 6.1.4(h) decrements it for this certificate.'
          - id: '6.1.3(d)(3)'
            kind: 'action'
            applies_when: 'always'
            action: 'Repeat until none remains: delete every node of depth <= i-1 that has no child.'
            source:
              - locator: '§6.1.3(d)(3)'
                quote: 'If there is a node in the valid_policy_tree of depth i-1 or less without any child nodes, delete that node.  Repeat this step until there are no nodes of depth i-1 or less without children.'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0429'
            note: 'Figure 7 (Pruning the valid_policy_tree).'
      - name: 'mapping'
        meaning: '6.1.4(b) is applying the policy mappings of certificate i to depth i.'
        inferred: false
        steps:
          - id: '6.1.4(b)(1)'
            kind: 'action'
            applies_when: 'policy_mapping > 0; for each issuerDomainPolicy ID-P in policyMappings of cert'
            skipped_when: 'policy_mapping = 0 (then (b)(2) runs)'
            action: 'Let M(ID-P) be the set of every subjectDomainPolicy paired with ID-P. If some node of depth i has valid_policy ID-P: set expected_policy_set := M(ID-P) on each such node. Else, if a node of depth i has valid_policy anyPolicy: add a child of the depth i-1 node whose valid_policy is anyPolicy {valid_policy: ID-P, qualifier_set: the qualifier set of anyPolicy in certificatePolicies of cert, expected_policy_set: M(ID-P)}. Else: no change.'
            source:
              - locator: '§6.1.4(b)(1)'
                quote: 'If the policy_mapping variable is greater than 0, for each node in the valid_policy_tree of depth i where ID-P is the valid_policy, set expected_policy_set to the set of subjectDomainPolicy values that are specified as equivalent to ID-P by the policy mappings extension.'
              - locator: '§6.1.4(b)(1)'
                quote: 'If no node of depth i in the valid_policy_tree has a valid_policy of ID-P but there is a node of depth i with a valid_policy of anyPolicy, then generate a child node of the node of depth i-1 that has a valid_policy of anyPolicy as follows:'
              - locator: '§6.1.4(b)(1)(ii)'
                quote: 'set the qualifier_set to the qualifier set of the policy anyPolicy in the certificate policies extension of certificate i; and'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0437'
              - 'rfc-5280#R-0438'
              - 'rfc-5280#R-0439'
              - 'rfc-5280#R-0440'
              - 'rfc-5280#R-0441'
              - 'rfc-5280#R-0120'
            note: 'The new node is a sibling of the depth i anyPolicy node, at depth i, so the tree depth is unchanged.'
          - id: '6.1.4(b)(2)'
            kind: 'action'
            applies_when: 'policy_mapping = 0; for each issuerDomainPolicy ID-P in policyMappings of cert'
            skipped_when: 'policy_mapping > 0'
            action: '(i) Delete every node of depth i with valid_policy ID-P. (ii) Repeat until none remains: delete every node of depth <= i-1 that has no child.'
            source:
              - locator: '§6.1.4(b)(2)(i)'
                quote: 'delete each node of depth i in the valid_policy_tree where ID-P is the valid_policy.'
              - locator: '§6.1.4(b)(2)(ii)'
                quote: 'If there is a node in the valid_policy_tree of depth i-1 or less without any child nodes, delete that node.  Repeat this step until there are no nodes of depth i-1 or less without children.'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0442'
              - 'rfc-5280#R-0443'
              - 'rfc-5280#R-0444'
      - name: 'intersecting'
        meaning: '6.1.5(g)(iii) is intersecting the tree with a user-initial-policy-set other than any-policy.'
        inferred: false
        steps:
          - id: '6.1.5(g)(iii)1'
            kind: 'action'
            applies_when: 'always'
            action: 'valid_policy_node_set := every node whose parent has valid_policy anyPolicy.'
            source:
              - locator: '§6.1.5(g)(iii)1'
                quote: 'Determine the set of policy nodes whose parent nodes have a valid_policy of anyPolicy.  This is the valid_policy_node_set.'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0481'
          - id: '6.1.5(g)(iii)2'
            kind: 'action'
            applies_when: 'always'
            action: 'For each node N in valid_policy_node_set with N.valid_policy not in user-initial-policy-set and N.valid_policy != anyPolicy: delete N and its subtree.'
            source:
              - locator: '§6.1.5(g)(iii)2'
                quote: 'If the valid_policy of any node in the valid_policy_node_set is not in the user-initial-policy-set and is not anyPolicy, delete this node and all its children.'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0482'
          - id: '6.1.5(g)(iii)3'
            kind: 'action'
            applies_when: 'a node of depth n has valid_policy anyPolicy'
            skipped_when: 'no node of depth n has valid_policy anyPolicy'
            action: '(a) P-Q := qualifier_set of the depth n anyPolicy node. (b) For each P-OID in user-initial-policy-set that is not the valid_policy of a node in valid_policy_node_set: add a child of the depth n-1 anyPolicy node {valid_policy: P-OID, qualifier_set: P-Q, expected_policy_set: {P-OID}}. (c) Delete the depth n anyPolicy node.'
            source:
              - locator: '§6.1.5(g)(iii)3'
                quote: 'If the valid_policy_tree includes a node of depth n with the valid_policy anyPolicy and the user-initial-policy-set is not any-policy, perform the following steps:'
              - locator: '§6.1.5(g)(iii)3.b'
                quote: 'For each P-OID in the user-initial-policy-set that is not the valid_policy of a node in the valid_policy_node_set, create a child node whose parent is the node of depth n-1 with the valid_policy anyPolicy.'
              - locator: '§6.1.5(g)(iii)3.c'
                quote: 'Delete the node of depth n with the valid_policy anyPolicy.'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0483'
              - 'rfc-5280#R-0484'
              - 'rfc-5280#R-0485'
              - 'rfc-5280#R-0486'
            note: 'Whether valid_policy_node_set means the set of step 1 or what survives step 2 is OQ-11.'
          - id: '6.1.5(g)(iii)4'
            kind: 'action'
            applies_when: 'always'
            action: 'Repeat until none remains: delete every node of depth <= n-1 that has no child.'
            source:
              - locator: '§6.1.5(g)(iii)4'
                quote: 'If there is a node in the valid_policy_tree of depth n-1 or less without any child nodes, delete that node. Repeat this step until there are no nodes of depth n-1 or less without children.'
            inferred: false
            constrained_by:
              - 'rfc-5280#R-0487'
      - name: 'final'
        meaning: '6.1.5(g) is done and the tree is not NULL: the value M01 returns in 6.1.6.'
        inferred: false
      - name: 'null'
        meaning: 'The tree is NULL. Absorbing: every later request leaves it NULL.'
        inferred: false
    transitions:
      - id: 'M02-T01'
        from: 'non-null'
        to: 'extending'
        trigger: 'policy_processing_requested'
        guard: 'present(cert, certificatePolicies).'
        source:
          - locator: '§6.1.3(d)'
            quote: 'If the certificate policies extension is present in the certificate and the valid_policy_tree is not NULL, process the policy information by performing the following steps in order:'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0424'
      - id: 'M02-T02'
        from: 'non-null'
        to: 'null'
        trigger: 'policy_processing_requested'
        guard: 'not present(cert, certificatePolicies).'
        action: 'valid_policy_tree := NULL.'
        source:
          - locator: '§6.1.3(e)'
            quote: 'If the certificate policies extension is not present, set the valid_policy_tree to NULL.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0430'
      - id: 'M02-T03'
        from: 'null'
        to: 'null'
        trigger: 'policy_processing_requested'
        guard: 'always'
        action: 'None.'
        source:
          - locator: '§6.1.2(a)'
            quote: 'Once the tree is set to NULL, policy processing ceases.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0398'
          - 'rfc-5280#R-0424'
      - id: 'M02-T04'
        from: 'extending'
        to: 'non-null'
        trigger: 'completion'
        guard: 'After (d)(3), a node of depth i exists.'
        source:
          - locator: '§6.1.2(a)'
            quote: 'If valid policies exist at this stage in the certification path validation, the depth of the tree is equal to the number of certificates in the chain that have been processed.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0398'
      - id: 'M02-T05'
        from: 'extending'
        to: 'null'
        trigger: 'completion'
        guard: 'After (d)(3), no node of depth i exists (pruning then removed every node, the root included).'
        action: 'valid_policy_tree := NULL.'
        source:
          - locator: '§6.1.2(a)'
            quote: 'If valid policies do not exist at this stage in the certification path validation, the tree is set to NULL.'
        inferred: true
        inferred_reason: 'The source never says that an emptied tree is NULL; it says the tree is NULL when no valid policy exists (OQ-08).'
        constrained_by:
          - 'rfc-5280#R-0398'
      - id: 'M02-T06'
        from: 'non-null'
        to: 'mapping'
        trigger: 'policy_mapping_requested'
        guard: 'present(cert, policyMappings) (6.1.4(a) has passed in M01).'
        source:
          - locator: '§6.1.4(b)'
            quote: 'If a policy mappings extension is present, then for each issuerDomainPolicy ID-P in the policy mappings extension:'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0436'
      - id: 'M02-T07'
        from: 'mapping'
        to: 'non-null'
        trigger: 'completion'
        guard: 'After (b), a node of depth i exists.'
        source:
          - locator: '§6.1.4(b)(1)'
            quote: 'If the policy_mapping variable is greater than 0, for each node in the valid_policy_tree of depth i where ID-P is the valid_policy, set expected_policy_set to the set of subjectDomainPolicy values that are specified as equivalent to ID-P by the policy mappings extension.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0437'
      - id: 'M02-T08'
        from: 'mapping'
        to: 'null'
        trigger: 'completion'
        guard: 'After (b)(2), no node of depth i exists.'
        action: 'valid_policy_tree := NULL.'
        source:
          - locator: '§6.1.4(b)(2)(i)'
            quote: 'delete each node of depth i in the valid_policy_tree where ID-P is the valid_policy.'
          - locator: '§6.1.2(a)'
            quote: 'If valid policies do not exist at this stage in the certification path validation, the tree is set to NULL.'
        inferred: true
        inferred_reason: 'As M02-T05 (OQ-08).'
        constrained_by:
          - 'rfc-5280#R-0443'
          - 'rfc-5280#R-0444'
      - id: 'M02-T09'
        from: 'null'
        to: 'null'
        trigger: 'policy_mapping_requested'
        guard: 'always'
        action: 'None.'
        source:
          - locator: '§6.1.2(a)'
            quote: 'Once the tree is set to NULL, policy processing ceases.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0398'
      - id: 'M02-T10'
        from: 'null'
        to: 'null'
        trigger: 'policy_wrap_up_requested'
        guard: 'always'
        action: 'The intersection is NULL.'
        source:
          - locator: '§6.1.5(g)(i)'
            quote: 'If the valid_policy_tree is NULL, the intersection is NULL.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0478'
      - id: 'M02-T11'
        from: 'non-null'
        to: 'final'
        trigger: 'policy_wrap_up_requested'
        guard: 'user-initial-policy-set = any-policy.'
        action: 'The intersection is the entire tree.'
        source:
          - locator: '§6.1.5(g)(ii)'
            quote: 'If the valid_policy_tree is not NULL and the user-initial-policy-set is any-policy, the intersection is the entire valid_policy_tree.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0479'
      - id: 'M02-T12'
        from: 'non-null'
        to: 'intersecting'
        trigger: 'policy_wrap_up_requested'
        guard: 'user-initial-policy-set != any-policy.'
        source:
          - locator: '§6.1.5(g)(iii)'
            quote: 'If the valid_policy_tree is not NULL and the user-initial-policy-set is not any-policy, calculate the intersection of the valid_policy_tree and the user-initial-policy-set as follows:'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0480'
      - id: 'M02-T13'
        from: 'intersecting'
        to: 'final'
        trigger: 'completion'
        guard: 'After (iii)4, the tree has a node of depth n.'
        source:
          - locator: '§6.1.5(g)(iii)4'
            quote: 'If there is a node in the valid_policy_tree of depth n-1 or less without any child nodes, delete that node. Repeat this step until there are no nodes of depth n-1 or less without children.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0487'
      - id: 'M02-T14'
        from: 'intersecting'
        to: 'null'
        trigger: 'completion'
        guard: 'After (iii)4, the tree has no node of depth n.'
        action: 'valid_policy_tree := NULL.'
        source:
          - locator: '§6.1.2(a)'
            quote: 'If valid policies do not exist at this stage in the certification path validation, the tree is set to NULL.'
        inferred: true
        inferred_reason: 'As M02-T05 (OQ-08).'
        constrained_by:
          - 'rfc-5280#R-0487'
    terminal_states:
      - 'final'
      - 'null'
    guard_coverage:
      - 'From non-null, policy_processing_requested goes to extending or null by certificatePolicies presence: exclusive and complete.'
      - 'policy_mapping_requested reaches M02 only when policyMappings is present (M01 skips 6.1.4(b) otherwise); from null it is a no-op.'
      - 'policy_wrap_up_requested partitions on tree nullity (state) and user-initial-policy-set = any-policy: exclusive and complete.'
      - 'Each completion pair (T04/T05, T07/T08, T13/T14) partitions on whether a node at the current depth survives. T08 is reachable only through (b)(2), since (b)(1) deletes nothing.'
    unspecified:
      - from: 'extending'
        trigger: 'completion'
        situation: 'Which depth i-1 nodes ''no match in step (i)'' refers to in (d)(1)(ii).'
        open_question: 'OQ-07'
      - from: 'intersecting'
        trigger: 'completion'
        situation: 'Whether step 3b''s valid_policy_node_set is the set of step 1 or what survives step 2.'
        open_question: 'OQ-11'
  # ======================================================================
  - id: 'M03'
    name: 'crl-validation'
    locator: '§6.3, §6.3.1, §6.3.2, §6.3.3'
    actor: 'relying party (invoked by M01 step 6.1.3(a)(3) when CRLs are the issuer''s revocation mechanism)'
    purpose: 'Determine the revocation status of one certificate from CRLs and delta CRLs in the local cache: a CRLReason value, UNREVOKED, or UNDETERMINED.'
    inputs:
      - name: 'certificate'
        locator: '§6.3.1(a)'
        type: 'Certificate: serial number, issuer, basicConstraints, cRLDistributionPoints, freshestCRL'
        source:
          - locator: '§6.3.1(a)'
            quote: 'The algorithm requires the certificate serial number and issuer name to determine whether a certificate is on a particular CRL.'
        constrained_by:
          - 'rfc-5280#R-0496'
      - name: 'use_deltas'
        locator: '§6.3.1(b)'
        type: 'boolean'
        source:
          - locator: '§6.3.1(b)'
            quote: 'use-deltas:  This boolean input determines whether delta CRLs are applied to CRLs.'
        constrained_by:
          - 'rfc-5280#R-0497'
      - name: 'local_crl_cache'
        locator: '§6.3'
        type: 'CertificateList objects, refreshed as described by M07'
        source:
          - locator: '§6.3'
            quote: 'This algorithm assumes that all of the needed CRLs are available in a local cache.'
        inferred: true
        inferred_reason: 'An assumption of the algorithm, not one of its two inputs.'
        constrained_by:
          - 'rfc-5280#R-0495'
      - name: 't and the target path''s trust anchor'
        locator: '§6.3.3(a), §6.3.3(f)'
        type: 'date/time; trust anchor information'
        source:
          - locator: '§6.3.3(f)'
            quote: 'The trust anchor for the certification path MUST be the same as the trust anchor used to validate the target certificate.'
        inferred: true
        inferred_reason: 'Used by (a) and (f) but not listed as inputs in 6.3.1.'
        constrained_by:
          - 'rfc-5280#R-0526'
    state_variables:
      - name: 'reasons_mask'
        locator: '§6.3.2(a)'
        type: 'subset of {keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, certificateHold, privilegeWithdrawn, aACompromise}; all-reasons denotes the whole set'
        initial: '{}'
        initialised_from: 'constant'
        updated_by:
          - '6.3.3(l)'
        invariant: 'Only grows.'
        source:
          - locator: '§6.3.2(a)'
            quote: 'The legal members of the set are the possible revocation reason values minus unspecified: keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, certificateHold, privilegeWithdrawn, and aACompromise.'
          - locator: '§6.3.2(a)'
            quote: 'The special value all-reasons is used to denote the set of all legal members.  This variable is initialized to the empty set.'
        constrained_by:
          - 'rfc-5280#R-0498'
      - name: 'cert_status'
        locator: '§6.3.2(b)'
        type: 'one of unspecified, keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, certificateHold, removeFromCRL, privilegeWithdrawn, aACompromise, UNREVOKED, UNDETERMINED'
        initial: 'UNREVOKED'
        initialised_from: 'constant'
        updated_by:
          - '6.3.3(i)'
          - '6.3.3(j)'
          - '6.3.3(k)'
          - 'M03-T05'
        source:
          - locator: '§6.3.2(b)'
            quote: 'This variable is initialized to the special value UNREVOKED.'
        constrained_by:
          - 'rfc-5280#R-0499'
          - 'rfc-5280#R-0501'
      - name: 'interim_reasons_mask'
        locator: '§6.3.2(c)'
        type: 'subset of the reasons_mask members, or all-reasons'
        initial: 'not given by the source (OQ-24); set by 6.3.3(d) before any use'
        initialised_from: 'none'
        updated_by:
          - '6.3.3(d)'
        source:
          - locator: '§6.3.2(c)'
