      - id: 'M06-T03'
        from: 'published'
        to: 'published'
        trigger: 'CertificateList'
        guard: 'A delta CRL: it carries a critical delta CRL indicator whose BaseCRLNumber is in complete_crl_numbers; it shares the numbering sequence (number > last_crl_number when thisUpdate differs); it has the base''s scope and reasons, the same issuing distribution point (or none), the same signing key as the complete CRLs it updates, and no freshest CRL extension.'
        action: 'Include an entry for every certificate of the scope whose status changed since the base: revoked for an in-scope reason, removeFromCRL for a release from hold, revoked without reason code when revoked for an out-of-scope reason after an in-scope listing, nothing otherwise (M05).'
        source:
