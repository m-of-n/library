  # ======================================================================
  - id: 'M07'
    name: 'cached-crl'
    locator: '§6.3, §6.3.3(a), §5.1.2.5, §5.2.4'
    actor: 'relying party: one complete CRL (issued or locally constructed) in the local CRL cache'
    purpose: 'Freshness of a cached CRL: current until its nextUpdate, then stale until replaced by a current complete CRL or updated with a current delta CRL.'
    initial: 'absent'
    states:
      - name: 'absent'
        meaning: 'No CRL for this DP and scope is cached.'
        inferred: true
      - name: 'current'
        meaning: 't is before the cached CRL''s nextUpdate.'
        inferred: false
      - name: 'stale'
        meaning: 't is after the cached CRL''s nextUpdate.'
        inferred: false
    transitions:
      - id: 'M07-T01'
        from: 'absent'
        to: 'current'
        trigger: 'CertificateList'
        guard: 'A complete CRL whose nextUpdate is after t.'
        source:
          - locator: '§6.3'
            quote: 'This algorithm assumes that all of the needed CRLs are available in a local cache.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0495'
      - id: 'M07-T02'
        from: 'current'
        to: 'stale'
        trigger: 'clock_passes_nextUpdate'
        guard: 'always'
        source:
          - locator: '§6.3'
            quote: 'Further, if the next update time of a CRL has passed, the algorithm assumes a mechanism to fetch a current CRL and place it in the local CRL cache.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0495'
      - id: 'M07-T03'
        from: 'stale'
        to: 'current'
        trigger: 'CertificateList'
        guard: 'A current complete CRL whose nextUpdate is after t (6.3.3(a)(1)(ii)).'
        action: 'Replace the cached CRL.'
        source:
          - locator: '§6.3.3(a)(1)(ii)'
            quote: 'Update the local CRL cache with a current complete CRL, verify that the current time is before the next update value in the new CRL, and continue processing with the new CRL.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0506'
      - id: 'M07-T04'
        from: 'stale'
        to: 'current'
        trigger: 'CertificateList'
        guard: 'use_deltas, freshestCRL in the certificate or the CRL, and a delta CRL whose nextUpdate is after t that M08 can combine with the cached CRL (6.3.3(a)(1)(i)).'
        action: 'The cached CRL becomes the locally constructed CRL of M08, with the delta''s CRL number, thisUpdate and nextUpdate.'
        source:
          - locator: '§6.3.3(a)(1)(i)'
            quote: 'If use-deltas is set and either the certificate or the CRL contains the freshest CRL extension, obtain a delta CRL with a next update value that is after the current time and can be used to update the locally cached CRL as specified in Section 5.2.4.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0505'
          - 'rfc-5280#R-0316'
          - 'rfc-5280#R-0317'
      - id: 'M07-T05'
        from: 'current'
        to: 'current'
        trigger: 'CertificateList'
        guard: 'use_deltas, freshestCRL in the certificate or the CRL, and the current delta CRL for the cached CRL (6.3.3(a)(2)).'
        action: 'Combine through M08.'
        source:
          - locator: '§6.3.3(a)(2)'
            quote: 'If the current time is before the value of the next update field, use-deltas is set, and either the certificate or the CRL contains the freshest CRL extension, then obtain the current delta CRL that can be used to update the locally cached complete CRL as specified in Section 5.2.4.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0507'
          - 'rfc-5280#R-0316'
    guard_coverage:
      - 'stale: T03 and T04 are the two options of 6.3.3(a)(1); the source says ''do one of the following'' and does not order them (OQ-14).'
    unspecified:
      - from: 'current'
        trigger: 'clock_passes_nextUpdate'
        situation: 't equal to nextUpdate is neither before nor after; and a CRL without nextUpdate never becomes stale.'
        open_question: 'OQ-13'
    note: 'A delta CRL is itself current when t is between its thisUpdate and nextUpdate; of several current delta CRLs for a scope the one with the latest thisUpdate SHOULD be taken as most current (§5.2.4, R-0318).'
  # ======================================================================
  - id: 'M08'
    name: 'delta-crl-combination'
    locator: '§5.2.4, §6.3.3(a)'
    actor: 'relying party that supports delta CRLs'
    purpose: 'Combine a complete CRL (issued or locally constructed) with a delta CRL into a locally constructed complete CRL.'
    initial: 'holding-complete'
    states:
      - name: 'holding-complete'
        meaning: 'A complete CRL for the scope is held: issued, or locally constructed by an earlier combination.'
        inferred: false
      - name: 'evaluating-delta'
        meaning: 'A delta CRL for the scope has been obtained and the four conditions are being checked.'
        inferred: true
      - name: 'not-combinable'
        meaning: 'The delta CRL fails a condition; the held CRL is unchanged.'
        inferred: true
        kind: 'error'
    transitions:
      - id: 'M08-T01'
        from: 'holding-complete'
        to: 'evaluating-delta'
        trigger: 'CertificateList'
        guard: 'The CRL carries a delta CRL indicator; of several current delta CRLs for the scope, the one with the latest thisUpdate is taken.'
        source:
          - locator: '§5.2.4'
            quote: 'A delta CRL is considered to be the current one if the current time is between the times contained in the thisUpdate and nextUpdate fields.'
          - locator: '§5.2.4'
            quote: 'If more than one current delta CRL for a given scope is encountered, the application SHOULD consider the one with the latest value in thisUpdate to be the most current one.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0318'
          - 'rfc-5280#R-0316'
      - id: 'M08-T02'
        from: 'evaluating-delta'
        to: 'holding-complete'
        trigger: 'completion'
        guard: '(a) same issuer; (b) same scope: issuingDistributionPoint omitted from both, or present in both with every field equal; (c) complete CRL number >= delta BaseCRLNumber; (d) complete CRL number < delta CRL number.'
        action: 'Apply the delta''s entries to the held CRL (an entry with removeFromCRL removes the certificate; any other entry lists it with that entry''s reason). The result is a locally constructed complete CRL with the delta''s CRL number, thisUpdate, nextUpdate and issuing distribution point.'
        source:
          - locator: '§5.2.4'
            quote: 'A complete CRL and a delta CRL MAY be combined if the following four conditions are satisfied:'
          - locator: '§5.2.4'
            quote: 'The CRL number of the complete CRL is equal to or greater than the BaseCRLNumber specified in the delta CRL.  That is, the complete CRL contains (at a minimum) all the revocation information held by the referenced base CRL.'
          - locator: '§5.2.4'
            quote: 'The CRL number of the complete CRL is less than the CRL number of the delta CRL.  That is, the delta CRL follows the complete CRL in the numbering sequence.'
          - locator: '§5.2.4'
            quote: 'When a delta CRL is combined with a complete CRL or a locally constructed CRL, the resulting locally constructed CRL has the CRL number specified in the CRL number extension found in the delta CRL used in its construction.'
          - locator: '§5.2.4'
            quote: 'In addition, the locally constructed CRL inherits the issuing distribution point from the delta CRL.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0310'
          - 'rfc-5280#R-0316'
          - 'rfc-5280#R-0317'
        note: 'How entries merge is not spelled out beyond the meaning of removeFromCRL (§5.3.1); the action is our reading (OQ-21).'
      - id: 'M08-T03'
        from: 'evaluating-delta'
        to: 'not-combinable'
        trigger: 'completion'
        guard: 'Any of (a) to (d) fails.'
        source:
          - locator: '§5.2.4'
            quote: 'A complete CRL and a delta CRL MAY be combined if the following four conditions are satisfied:'
        inferred: true
        inferred_reason: 'The source says ''MAY be combined if'', not ''only if'' (OQ-20).'
        constrained_by:
          - 'rfc-5280#R-0310'
      - id: 'M08-T04'
        from: 'not-combinable'
        to: 'holding-complete'
        trigger: 'completion'
        guard: 'always'
        action: 'Discard the delta CRL; the held CRL is unchanged.'
        source:
          - locator: '§5.2.4'
            quote: 'A complete CRL and a delta CRL MAY be combined if the following four conditions are satisfied:'
        inferred: true
        inferred_reason: 'As M08-T03.'
        constrained_by:
          - 'rfc-5280#R-0310'
    error_states:
      - 'not-combinable'
    guard_coverage:
      - 'T02 and T03 partition on the conjunction of (a) to (d).'
    unspecified:
      - from: 'evaluating-delta'
        trigger: 'completion'
        situation: 'Whether ''between'' thisUpdate and nextUpdate is inclusive; whether failing a condition forbids combination.'
        open_question: 'OQ-20'
  # ======================================================================
  - id: 'M09'
    name: 'indirect-crl-entry-attribution'
    locator: '§5.3.3, §5.2.5, §6.3.3(i), §6.3.3(j)'
    actor: 'relying party reading the entries of one CRL in order'
    purpose: 'Which certificate issuer each CRL entry belongs to, used by 6.3.3(i) and (j) to match issuer and serial number.'
    state_variables:
      - name: 'current_issuer'
        type: 'GeneralNames'
        initial: 'the CRL issuer'
        source:
          - locator: '§5.3.3'
            quote: 'If this extension is not present on the first entry in an indirect CRL, the certificate issuer defaults to the CRL issuer.'
        constrained_by:
          - 'rfc-5280#R-0363'
          - 'rfc-5280#R-0364'
    initial: 'reading'
    states:
      - name: 'reading'
        meaning: 'Entries are being read in order; current_issuer is the issuer of the last entry read (the CRL issuer before the first).'
        inferred: false
      - name: 'done'
        meaning: 'Every entry has been attributed.'
        inferred: true
      - name: 'unusable'
        meaning: 'An entry carries a critical entry extension the application cannot process; the CRL must not be used.'
        inferred: false
        kind: 'error'
    transitions:
      - id: 'M09-T01'
        from: 'reading'
        to: 'reading'
        trigger: 'next_crl_entry'
        guard: 'The CRL is indirect (IDP indirectCRL TRUE) and the entry carries the certificate issuer extension.'
        action: 'current_issuer := the names in the extension; the entry''s issuer := current_issuer.'
        source:
          - locator: '§5.3.3'
            quote: 'When present, the certificate issuer CRL entry extension includes one or more names from the issuer field and/or issuer alternative name extension of the certificate that corresponds to the CRL entry.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0363'
          - 'rfc-5280#R-0364'
          - 'rfc-5280#R-0365'
          - 'rfc-5280#R-0366'
      - id: 'M09-T02'
        from: 'reading'
        to: 'reading'
        trigger: 'next_crl_entry'
        guard: 'The CRL is indirect and the entry has no certificate issuer extension.'
        action: 'The entry''s issuer := current_issuer (the CRL issuer for the first entry, else the preceding entry''s issuer).'
        source:
          - locator: '§5.3.3'
            quote: 'On subsequent entries in an indirect CRL, if this extension is not present, the certificate issuer for the entry is the same as that for the preceding entry.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0366'
      - id: 'M09-T03'
        from: 'reading'
        to: 'reading'
        trigger: 'next_crl_entry'
        guard: 'The CRL is not indirect.'
        action: 'The entry''s issuer := the CRL issuer.'
        source:
          - locator: '§5.2.5'
            quote: 'If the scope of the CRL only includes certificates issued by the CRL issuer, then the indirectCRL boolean MUST be set to FALSE.'
        inferred: true
        inferred_reason: '§5.3.3 defines attribution only for indirect CRLs; in any other CRL every entry is the CRL issuer''s.'
        constrained_by:
          - 'rfc-5280#R-0326'
      - id: 'M09-T04'
        from: 'reading'
        to: 'unusable'
        trigger: 'next_crl_entry'
        guard: 'The entry carries a critical CRL entry extension the application cannot process (for example a certificate issuer extension it does not recognise).'
        source:
          - locator: '§5.3'
            quote: 'If a CRL contains a critical CRL entry extension that the application cannot process, then the application MUST NOT use that CRL to determine the status of any certificates.'
          - locator: '§5.3.3'
            quote: 'CRL issuers MUST mark this extension as critical since an implementation that ignored this extension could not correctly attribute CRL entries to certificates.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0356'
          - 'rfc-5280#R-0365'
      - id: 'M09-T05'
        from: 'reading'
        to: 'done'
        trigger: 'completion'
        guard: 'No entry remains.'
        source:
          - locator: '§5.1.2.6'
            quote: 'Otherwise, revoked certificates are listed by their serial numbers.'
        inferred: true
        inferred_reason: 'The end of the entry list is not an event in the source.'
        constrained_by:
          - 'rfc-5280#R-0286'
    error_states:
      - 'unusable'
    terminal_states:
      - 'done'
      - 'unusable'
    guard_coverage:
      - 'next_crl_entry: T04 first if the entry has an unprocessable critical extension; else T01, T02 or T03 by indirectness and extension presence. Exclusive and complete.'
  # ======================================================================
  - id: 'M10'
    name: 'ca-key-rollover'
    locator: '§3.2, §3.5(e), §4.2.1.1, §4.2.1.10, §5.2.1, §6.1, §8'
    actor: 'a CA, with its signing key pairs; relying parties through M01'
    purpose: 'A CA''s change-over from one signing key pair to the next by self-issued certificates, and the loss and compromise of its key. The procedure itself is in RFC 4210, which the source cites but does not reproduce.'
    initial: 'single-key'
    states:
      - name: 'single-key'
        meaning: 'The CA signs certificates and CRLs with one key pair.'
        inferred: false
      - name: 'changeover'
        meaning: 'Old and new key pairs coexist. Two self-issued certificates link them: the new public key signed with the old private key and the old public key signed with the new private key. Authority key identifiers tell the keys apart.'
        inferred: false
      - name: 'key-lost'
        meaning: 'The CA''s private signing key is lost; it cannot produce CRLs or perform normal key rollover.'
        inferred: false
        kind: 'error'
      - name: 'key-compromised'
        meaning: 'The CA''s private signing key is compromised.'
        inferred: false
        kind: 'error'
    transitions:
      - id: 'M10-T01'
        from: 'single-key'
        to: 'changeover'
        trigger: 'new_ca_key_pair'
        guard: 'The current key pair is not compromised.'
        action: 'Issue the two self-issued certificates. Certificates and CRLs issued from now on carry an authority key identifier (key identifier method) naming the key that signed them.'
        source:
          - locator: '§8'
            quote: 'In particular, self-issued certificates may be used to implement a graceful change-over from one non-compromised CA key pair to the next.'
          - locator: '§8'
            quote: 'Detailed procedures for "CA key update" are specified in [RFC4210], where the CA protects its new public key using its previous private key and vice versa using two self-issued certificates.'
          - locator: '§4.2.1.1'
            quote: 'This extension is used where an issuer has multiple signing keys (either due to multiple concurrent key pairs or due to changeover).'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0082'
          - 'rfc-5280#R-0084'
          - 'rfc-5280#R-0086'
          - 'rfc-5280#R-0089'
          - 'rfc-5280#R-0090'
          - 'rfc-5280#R-0290'
          - 'rfc-5280#R-0291'
      - id: 'M10-T02'
        from: 'changeover'
        to: 'single-key'
        trigger: 'old_ca_key_retired'
        guard: 'always'
        action: 'The new key pair is the CA''s only signing key. Status information for certificates signed by the old key is still maintained until their notAfter, or M04-T07 applies. A delta CRL is signed with the same key as the complete CRLs it can update.'
        source:
          - locator: '§8'
            quote: 'In particular, self-issued certificates may be used to implement a graceful change-over from one non-compromised CA key pair to the next.'
          - locator: '§5.2.4'
            quote: 'Further, the CRL issuer MUST use the same private key to sign the delta CRL and any complete CRL that it can be used to update.'
        inferred: true
        inferred_reason: 'The end of the change-over is not described.'
        constrained_by:
          - 'rfc-5280#R-0309'
          - 'rfc-5280#R-0037'
      - id: 'M10-T03'
        from: 'single-key'
        to: 'key-lost'
        trigger: 'ca_key_lost'
        guard: 'always'
        source:
          - locator: '§8'
            quote: 'The CA would not be able to produce CRLs or perform normal key rollover. CAs SHOULD maintain secure backup for signing keys.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0582'
      - id: 'M10-T04'
        from: 'changeover'
        to: 'key-lost'
        trigger: 'ca_key_lost'
        guard: 'The lost key is the only one able to continue (inferred).'
        source:
          - locator: '§8'
            quote: 'Loss of a CA''s private signing key may also be problematic.'
        inferred: true
        inferred_reason: '§8 does not consider loss during a change-over.'
        constrained_by:
          - 'rfc-5280#R-0582'
      - id: 'M10-T05'
        from: 'single-key'
        to: 'key-compromised'
        trigger: 'ca_key_compromised'
        guard: 'The compromise is detected.'
        action: 'All certificates issued to the compromised CA are revoked (M05-T01 for each); relying parties that trust the CA change their trust anchor information.'
        source:
          - locator: '§8'
            quote: 'If such a compromise is detected, all certificates issued to the compromised CA MUST be revoked, preventing services between its users and users of other CAs.'
          - locator: '§8'
            quote: 'In addition, where a key compromise or CA failure occurs for a trusted CA, the user will need to modify the information provided to the path validation routine.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0581'
      - id: 'M10-T06'
        from: 'changeover'
        to: 'key-compromised'
        trigger: 'ca_key_compromised'
        guard: 'The compromise is detected.'
        action: 'As M10-T05.'
        source:
          - locator: '§8'
            quote: 'If such a compromise is detected, all certificates issued to the compromised CA MUST be revoked, preventing services between its users and users of other CAs.'
        inferred: false
        constrained_by:
          - 'rfc-5280#R-0581'
    error_states:
      - 'key-lost'
      - 'key-compromised'
    terminal_states:
      - 'key-lost'
      - 'key-compromised'
    path_validation_effect:
      text: 'M01 treats each self-issued certificate of the change-over specially: name constraints are not checked against it unless it is the target (6.1.3(b), (c)); it does not decrement explicit_policy, policy_mapping, inhibit_anyPolicy (6.1.4(h)) or max_path_length (6.1.4(l)); anyPolicy in it is honoured while i < n even when inhibit_anyPolicy = 0 (6.1.3(d)(2)). So a path through the change-over is no longer, for constraint purposes, than one without it.'
      source:
        - locator: '§6.1'
          quote: 'However, a CA may issue a certificate to itself to support key rollover or changes in certificate policies.  These self-issued certificates are not counted when evaluating path length or name constraints.'
        - locator: '§4.2.1.10'
          quote: '(This could prevent CAs that use name constraints from employing self-issued certificates to implement key rollover.)'
        - locator: '§8'
          quote: 'Conforming client implementations will process the self-issued certificate and determine whether certificates issued under the new key may be trusted.'
      constrained_by:
        - 'rfc-5280#R-0383'
        - 'rfc-5280#R-0384'
        - 'rfc-5280#R-0422'
        - 'rfc-5280#R-0423'
        - 'rfc-5280#R-0428'
        - 'rfc-5280#R-0453'
        - 'rfc-5280#R-0463'
    unspecified:
      - from: 'changeover'
        trigger: 'old_ca_key_retired'
        situation: 'The change-over procedure, its certificates'' contents and when the old key may be retired: delegated to RFC 4210.'
        open_question: 'OQ-22'

not_modelled:
  - item: 'Certification path construction'
    locator: '§6.1, §4.2.1.1, §4.2.2.1'
    reason: 'The source puts obtaining the certificate sequence out of scope; AKI, SKI and authority information access only facilitate it. M01 starts from a given path.'
    source:
      - locator: '§6.1'
        quote: 'The procedure performed to obtain this sequence of certificates is outside the scope of this specification.'
  - item: 'Management protocols (registration, initialization, certification, key pair recovery, key pair update, revocation request, cross-certification)'
    locator: '§3.5'
    reason: 'Listed as functions only; their message formats and procedures are other PKIX specifications. Key pair update and revocation request appear as the events new_ca_key_pair and revocation_reported.'
    source:
      - locator: '§3.5'
        quote: 'The set of functions that potentially need to be supported by management protocols include:'
      - locator: '§3.5'
        quote: 'Note that on-line protocols are not the only way of implementing the above functions.'
  - item: 'On-line revocation status services and other status information'
    locator: '§3.3, §6.1.3(a)(3)'
    reason: '6.1.3(a)(3) accepts status information or out-of-band means besides CRLs, but RFC 5280 defines no such mechanism.'
    source:
      - locator: '§3.3'
        quote: 'Message formats and protocols supporting on-line revocation notification are defined in other PKIX specifications.'
  - item: 'Operational protocols delivering certificates and CRLs'
    locator: '§3.4, §4.2.1.13, §4.2.2.1'
    reason: 'How a CRL or certificate is fetched (LDAP, HTTP, FTP, X.500) is not a lifecycle; M07 assumes ''a mechanism to fetch a current CRL''.'
    source:
      - locator: '§3.4'
        quote: 'Operational protocols supporting these functions are defined in other PKIX specifications.'
  - item: 'Augmentations of the path validation algorithm'
    locator: '§6.1, §6.2'
    reason: 'Permitted (R-0382, R-0490 to R-0493) but undefined: a trust-anchor path length constraint, a required name form, application-specific extensions. An augmented M01 adds checks; it cannot be modelled without the augmentation.'
    source:
      - locator: '§6.2'
        quote: 'Thus, the path validation algorithm presented in Section 6.1 defines the minimum conditions for a path to be considered valid.'
  - item: 'Processing of extensions in a trust anchor''s self-signed certificate'
    locator: '§6.2'
    reason: 'The algorithm specifies no rules; implementations are free to process or ignore them.'
    source:
      - locator: '§6.2'
        quote: 'Implementations that use self-signed certificates to specify trust anchor information are free to process or ignore such information.'
  - item: 'Trust anchor selection and distribution'
    locator: '§6, §6.2, §8'
    reason: 'A local, out-of-band decision; only its effect (a trust_anchor input to M01) is modelled.'
    source:
      - locator: '§8'
        quote: 'The authenticated distribution of trusted CA public keys (usually in the form of a "self-signed" certificate) is a security critical out-of-band process that is beyond the scope of this specification.'
  - item: 'Profile conformance checks during validation'
    locator: '§6.1'
    reason: 'The algorithm checks X.509 validity only and the profile recommends against adding conformance checks (R-0373), so no state models Sections 4 and 5 conformance.'
    source:
      - locator: '§6.1'
        quote: 'Therefore, the algorithm only includes checks to verify that the certification path is valid according to X.509 and does not include checks to verify that the certificates and CRLs conform to this profile.'
  - item: 'Checking a subset of reason codes'
    locator: '§6.3.2'
    reason: 'The source names the possibility but defines neither the processing nor the extra state.'
    source:
      - locator: '§6.3.2'
        quote: 'Additional processing and state variables may be necessary to limit the checking to a subset of the reason codes.'
  - item: 'Attribute certificates and their CRLs'
    locator: '§5.2.5, §6.3.3(b)(2)(iv)'
    reason: 'Out of the profile: conforming CRL issuers set onlyContainsAttributeCerts FALSE and M03 rejects a CRL that asserts it.'
    source:
      - locator: '§5.2.5'
        quote: 'Conforming CRLs issuers MUST set the onlyContainsAttributeCerts boolean to FALSE.'
  - item: 'Name comparison and internationalised name processing'
    locator: '§7'
    reason: 'Stateless functions used inside guards (DN match for self-issued, name chaining and subtree membership; IDN, IRI and mailbox conversion). Their rules are requirements R-0538 to R-0580, not machines.'
    source:
      - locator: '§7.1'
        quote: 'Two distinguished names DN1 and DN2 match if they have the same number of RDNs, for each RDN in DN1 there is a matching RDN in DN2, and the matching RDNs appear in the same order in both DNs.'
  - item: 'CRL issuance obligations not tied to a lifecycle'
    locator: '§5.2.5, §4.2.1.13'
    reason: 'Scope and distribution point rules (IDP contents, DP fields, partitioning by reason) constrain each CRL, not a sequence of them; they are guards in M03 step (b) and requirements, not states.'
    source:
      - locator: '§5.2.5'
        quote: 'CAs may use CRL distribution points to partition the CRL on the basis of compromise and routine revocation.'

open_questions:
  - id: 'OQ-01'
    locator: '§6.1.1(a), §6.1.3'
    question: 'M01 for n = 0. The path has ''length n'' and step 6.1.3 runs ''for all i in [1..n]'', but nothing excludes an empty path, for which Figure 2 would run Process Cert on no certificate.'
    source:
      - locator: '§6.1.3'
        quote: 'The basic path processing actions to be performed for certificate i (for all i in [1..n]) are listed below.'
    affects:
      - 'M01-T01'
  - id: 'OQ-02'
    locator: '§6.1'
    question: '''A certificate MUST NOT appear more than once in a prospective certification path'' binds the path, but no step of 6.1 checks it. Is a validator required to detect a repeated certificate, or is it the path builder''s duty?'
    source:
      - locator: '§6.1'
        quote: 'A certificate MUST NOT appear more than once in a prospective certification path.'
    affects:
      - 'M01-T01'
      - 'M01-T03'
  - id: 'OQ-03'
    locator: '§6.1.3(a)(3), §6.3.3'
    question: '6.1.3(a)(3) requires the certificate to be not revoked; M03 can return UNDETERMINED. The source does not say whether path validation then fails, succeeds, or defers to local policy.'
    source:
      - locator: '§6.1.3(a)(3)'
        quote: 'At the current time, the certificate is not revoked.'
      - locator: '§6.3.3'
        quote: 'After processing such CRLs, if the revocation status has still not been determined, then return the cert_status UNDETERMINED.'
    affects:
      - 'M01-T05'
      - 'M03-T05'
  - id: 'OQ-04'
    locator: '§6.1, §6.1.3(a)(2), §6.3.3(a)'
    question: '6.1.3(a) and 6.3.3(a) test against the current time, while R-0374 allows validation at a point in the past. Which CRLs, and which notion of ''current'' and ''next update'', apply when t is in the past is not described.'
    source:
      - locator: '§6.1'
        quote: 'The algorithm presented in this section validates the certificate with respect to the current date and time.  A conforming implementation MAY also support validation with respect to some point in the past.'
    affects:
      - 'M01-T04'
      - 'M03-T08'
      - 'M07-T02'
  - id: 'OQ-05'
    locator: '§6.1.3(b), §6.1.3(c), §4.2.1.10'
    question: '§4.2.1.10 requires rfc822Name constraints to be applied to emailAddress attributes in the subject DN when there is no subjectAltName. 6.1.3(b) and (c) check only the subject name against directoryName subtrees and the subjectAltName names. Must the emailAddress check be added to (b) and (c)?'
    source:
      - locator: '§4.2.1.10'
        quote: 'When constraints are imposed on the rfc822Name name form, but the certificate does not include a subject alternative name, the rfc822Name constraint MUST be applied to the attribute of type emailAddress in the subject distinguished name.'
    affects:
      - 'M01-T07'
      - 'M01-T08'
  - id: 'OQ-06'
    locator: '§4.2.1.11, §6.1.4(h)'
    question: '§4.2.1.11 defines inhibitPolicyMapping and requireExplicitPolicy as numbers of ''additional certificates'', with no self-issued qualifier, whereas 6.1.2(d), (f) and 6.1.4(h) count only non-self-issued certificates. §4.2.1.14 does say ''non-self-issued'' for inhibitAnyPolicy. The algorithm governs, but the definitions disagree.'
    source:
      - locator: '§4.2.1.11'
        quote: 'If the inhibitPolicyMapping field is present, the value indicates the number of additional certificates that may appear in the path before policy mapping is no longer permitted.'
      - locator: '§4.2.1.14'
        quote: 'The value indicates the number of additional non-self-issued certificates that may appear in the path before anyPolicy is no longer permitted.'
    affects:
      - 'M01 step 6.1.4(h)'
      - 'M01 step 6.1.4(i)'
  - id: 'OQ-07'
    locator: '§6.1.3(d)(1)(ii)'
    question: '''If there was no match in step (i)'': for this P, no depth i-1 node had P-OID in its expected_policy_set? M02 reads it so. The step is per policy P, but ''match'' is not defined.'
    source:
      - locator: '§6.1.3(d)(1)(ii)'
        quote: 'If there was no match in step (i) and the valid_policy_tree includes a node of depth i-1 with the valid_policy anyPolicy, generate a child node with the following values: set the valid_policy to P-OID, set the qualifier_set to P-Q, and set the expected_policy_set to  {P-OID}.'
    affects:
      - 'M02 step 6.1.3(d)(1)(ii)'
  - id: 'OQ-08'
    locator: '§6.1.2(a), §6.1.3(d)(3), §6.1.4(b)(2)(ii), §6.1.5(g)(iii)4'
    question: 'Pruning can delete every node, the depth 0 root included. The source never says the emptied tree is NULL; it says the tree is NULL when no valid policy exists. M02 equates the two, which matters for 6.1.3(f) and the 6.1.5 success test.'
    source:
      - locator: '§6.1.2(a)'
        quote: 'If valid policies do not exist at this stage in the certification path validation, the tree is set to NULL.'
    affects:
      - 'M02-T05'
      - 'M02-T08'
      - 'M02-T14'
  - id: 'OQ-09'
    locator: '§6.1.5'
    question: '6.1.3 and 6.1.4 each name the steps whose failure terminates the procedure; 6.1.5 names none. Step (f) (an unrecognised critical extension in the target) is a check by §4.2 and §6.1, and failure when the success condition is false is only the complement of the stated success. Both are inferred.'
    source:
      - locator: '§6.1.5'
        quote: 'If either (1) the value of explicit_policy variable is greater than zero or (2) the valid_policy_tree is not NULL, then path processing has succeeded.'
    affects:
      - 'M01-T19'
      - 'M01-T21'
  - id: 'OQ-10'
    locator: '§6.1.2(i), §6.1.4(e), §6.1.5(d)'
    question: 'The trust anchor''s parameters are optional, and 6.1.4(e) says nothing when a certificate''s parameters are null or omitted and its algorithm equals working_public_key_algorithm. M01 keeps the previous parameters (inheritance) and starts from null when the trust anchor has none; neither is stated.'
    source:
      - locator: '§6.1.4(e)'
        quote: 'If the certificate subjectPublicKey algorithm and the working_public_key_algorithm are different, set the working_public_key_parameters to null.'
    affects:
      - 'M01 step 6.1.4(e)'
      - 'M01 step 6.1.5(d)'
  - id: 'OQ-11'
    locator: '§6.1.5(g)(iii)'
    question: 'valid_policy_node_set holds the nodes, at every depth, whose parent has valid_policy anyPolicy. Step 3b creates a depth n child only for a P-OID that is not the valid_policy of any node in that set, whatever that node''s depth; and the set is determined in step 1, before step 2 deletes some of its members. Step 2 deletes only policies outside user-initial-policy-set, so the deletions cannot change 3b''s test; whether a match at a depth below n is meant to suppress the depth n node is not stated.'
    source:
      - locator: '§6.1.5(g)(iii)1'
        quote: 'Determine the set of policy nodes whose parent nodes have a valid_policy of anyPolicy.  This is the valid_policy_node_set.'
    affects:
      - 'M02 step 6.1.5(g)(iii)3'
  - id: 'OQ-12'
    locator: '§6.1.4(g), §6.1, §4.2.1.10'
    question: 'Self-issued certificates ''are not counted when evaluating ... name constraints'', and 6.1.3(b), (c) skip them, but 6.1.4(g) applies the name constraints a self-issued intermediate carries to the state vector with no self-issued condition. Is that intended?'
    source:
      - locator: '§6.1.4(g)'
        quote: 'If a name constraints extension is included in the certificate, modify the permitted_subtrees and excluded_subtrees state variables as follows:'
    affects:
      - 'M01 step 6.1.4(g)'
  - id: 'OQ-13'
    locator: '§6.3.3(a), §5.1.2.5'
    question: '6.3.3(a)(1) covers t after nextUpdate and (a)(2) t before it; t equal to nextUpdate is covered by neither. A CRL that omits nextUpdate is allowed by the ASN.1, and the behaviour of clients processing it is explicitly not specified.'
    source:
      - locator: '§5.1.2.5'
        quote: 'The behavior of clients processing CRLs that omit nextUpdate is not specified by this profile.'
    affects:
      - 'M03 step 6.3.3(a)'
      - 'M07-T02'
  - id: 'OQ-14'
    locator: '§6.3.3(a)(1), §6.3.3(c), §6.3.3(h), §6.3.3(i)'
    question: '(a)(1) says ''do one of the following'' without ordering (i) and (ii) when both apply. Steps (c), (h) and (i) are conditioned only on use-deltas, yet a delta CRL is obtained only when the certificate or CRL carries the freshest CRL extension; with use-deltas set and no delta CRL, those steps have no object.'
    source:
      - locator: '§6.3.3(a)(1)'
        quote: 'If the current time is after the value of the CRL next update field, then do one of the following:'
      - locator: '§6.3.3(h)'
        quote: 'If use-deltas is set, then validate the signature on the delta CRL using the public key validated in step (f).'
    affects:
      - 'M03 steps 6.3.3(a), (c), (h), (i)'
      - 'M07-T03'
      - 'M07-T04'
  - id: 'OQ-15'
    locator: '§6.3.3'
    question: 'Steps (a)(1)(ii), (b), (c), (e), (f), (g) and (h) say ''verify'' or ''validate'' but no consequence of failure is given. M03 abandons the CRL and continues; a reading in which the whole revocation check fails (or returns UNDETERMINED at once) is possible.'
    source:
      - locator: '§6.3.3(b)'
        quote: 'Verify the issuer and scope of the complete CRL as follows:'
    affects:
      - 'M03-T07'
      - 'M03-T08'
      - 'M03-T09'
      - 'M03-T10'
      - 'M03-T11'
      - 'M03-T12'
      - 'M03-T13'
      - 'M03-T14'
      - 'M03-T15'
  - id: 'OQ-16'
    locator: '§6.3.3(f), §8'
    question: '6.3.3(f) validates the CRL issuer''s path, which runs M01, whose 6.1.3(a)(3) may run M03 again. The source warns of unbounded recursion only for https URIs and gives no termination rule.'
    source:
      - locator: '§8'
        quote: 'Relying parties that choose to validate the server''s certificate when obtaining information pointed to by an https URI in the cRLDistributionPoints, authorityInfoAccess, or subjectInfoAccess extensions MUST be prepared for the possibility that this will result in unbounded recursion.'
    affects:
      - 'M03 step 6.3.3(f)'
  - id: 'OQ-17'
    locator: '§5.2.5'
    question: 'Ambiguous wording, not a wrong value. The paragraph is about onlySomeReasons, a ReasonFlags BIT STRING (§4.2.1.13), in which bit 1 is keyCompromise, bit 2 cACompromise and bit 8 aACompromise, so ''keyCompromise (1), cACompromise (2), and aACompromise (8)'' gives correct ReasonFlags bit positions. The sentence calls them ''reason code'', the term §5.3.1 uses for CRLReason values, where 1 and 2 are the same but 8 is removeFromCRL and aACompromise is 10. A reader who takes the numbers as CRLReason values gets the third one wrong.'
    source:
      - locator: '§5.2.5'
        quote: 'The reason codes associated with a distribution point MUST be specified in onlySomeReasons.'
      - locator: '§5.2.5'
        quote: 'In this case, the revocations with reason code keyCompromise (1), cACompromise (2), and aACompromise (8) appear in one distribution point, and the revocations with other reason codes appear in another distribution point.'
    affects:
      - 'M03 step 6.3.3(d)'
      - 'M05 reason_codes'
  - id: 'OQ-18'
    locator: '§5.2.4, §5.3.1, §3.3'
    question: 'Only certificateHold is described as reversible. Whether a certificate revoked for another reason can be released or put on hold, and how a revocation reported after notAfter is listed, are not addressed.'
    source:
      - locator: '§5.2.4'
        quote: 'The status of a certificate is considered to have changed if it is revoked (for any revocation reason, including certificateHold), if it is released from hold, or if its revocation reason changes.'
    affects:
      - 'M05-T06'
      - 'M05-T01'
  - id: 'OQ-19'
    locator: '§5.1.2.5'
    question: 'The promise that the next CRL ''will not be issued any later than the indicated date'' is lowercase prose with no stated consequence. What an issuer that misses it must do, and what a relying party holding only an expired CRL does when no current one can be fetched, are not specified.'
    source:
      - locator: '§5.1.2.5'
        quote: 'The next CRL could be issued before the indicated date, but it will not be issued any later than the indicated date.'
    affects:
      - 'M06-T05'
      - 'M03-T08'
  - id: 'OQ-20'
    locator: '§5.2.4'
    question: 'A delta CRL is current when t is ''between'' thisUpdate and nextUpdate: inclusive or not? And complete and delta CRLs ''MAY be combined if'' the four conditions hold: is combination forbidden when one fails?'
    source:
      - locator: '§5.2.4'
        quote: 'A delta CRL is considered to be the current one if the current time is between the times contained in the thisUpdate and nextUpdate fields.'
      - locator: '§5.2.4'
        quote: 'A complete CRL and a delta CRL MAY be combined if the following four conditions are satisfied:'
    affects:
      - 'M08-T01'
      - 'M08-T03'
  - id: 'OQ-21'
    locator: '§5.2.4, §5.3.1'
    question: 'The merge of delta entries into a complete CRL is described only by its result (equivalent to a complete CRL) and by removeFromCRL''s meaning. An entry in the delta that changes a reason, and an entry for a certificate absent from the base, are handled by M08-T02 as ''list with the delta''s reason'', which is our reading.'
    source:
      - locator: '§5.2.4'
        quote: 'The combination of a delta CRL plus the referenced base CRL is equivalent to a complete CRL, for the applicable scope, at the time of publication of the delta CRL.'
    affects:
      - 'M08-T02'
  - id: 'OQ-22'
    locator: '§8'
    question: 'The CA key update procedure is delegated to RFC 4210. RFC 5280 does not say what the two self-issued certificates contain, how long they live, or when the old key may stop being used, beyond the R-0037 duty for certificates it signed.'
    source:
      - locator: '§8'
        quote: 'Detailed procedures for "CA key update" are specified in [RFC4210], where the CA protects its new public key using its previous private key and vice versa using two self-issued certificates.'
    affects:
      - 'M10-T01'
      - 'M10-T02'
  - id: 'OQ-23'
    locator: '§6.1.5(a), §6.1.2(d)'
    question: 'explicit_policy counts non-self-issued certificates, but 6.1.5(a) decrements it for the target with no self-issued condition. A self-issued target therefore counts. Consistent with ''not counted'' applying only to intermediates, but not stated.'
    source:
      - locator: '§6.1.5(a)'
        quote: 'If explicit_policy is not 0, decrement explicit_policy by 1.'
      - locator: '§6.1.2(d)'
        quote: 'The integer indicates the number of non-self-issued certificates to be processed before this requirement is imposed.'
    affects:
      - 'M01 step 6.1.5(a)'
  - id: 'OQ-24'
    locator: '§6.3.2(c), §6.3.3(d)'
    question: 'interim_reasons_mask has no initial value, and it is computed once per CRL from the complete CRL''s IDP and the DP; the delta CRL''s reasons are not computed separately (6.3.3(c)(2) makes its IDP match).'
    source:
      - locator: '§6.3.2(c)'
        quote: 'interim_reasons_mask:  This contains the set of revocation reasons supported by the CRL or delta CRL currently being processed.'
    affects:
      - 'M03 step 6.3.3(d)'
  - id: 'OQ-25'
    locator: '§3.3'
    question: '''Regularly scheduled CRL'' is not defined, so whether an unscheduled CRL issued after notAfter lets an expired entry be dropped is open.'
    source:
      - locator: '§3.3'
        quote: 'An entry MUST NOT be removed from the CRL until it appears on one regularly scheduled CRL issued beyond the revoked certificate''s validity period.'
    affects:
      - 'M05-T09'
      - 'M05-T10'
pass2_notes:
  - >-
    FX-1 pass 2 (verifier VD, 2026-10-13). All quotes were located in the source by a
    position-level checker; all are verbatim and lie in the section their locator names. The
    M01 steps of 6.1.3 to 6.1.5 and the M03 steps of 6.3.3 were checked against the source.
  - >-
    OQ-17 reworded: 'aACompromise (8)' is a correct ReasonFlags bit number in a paragraph about
    onlySomeReasons; the defect is the term 'reason code', not the value. A quote for the
    onlySomeReasons sentence was added. The M01 processing-certificate guard coverage now
    states its one gap (UNDETERMINED at 6.1.3(a)(3), OQ-03) instead of claiming completeness.
