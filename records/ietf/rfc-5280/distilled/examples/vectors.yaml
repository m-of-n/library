  - id: PKIX-42111-01
    source:
      locator: '§4.2.1.11'
      lines: '2374-2379'
    kind: path-validation
    in_source: true
    fidelity: split
    input:
      extension: 'policyConstraints with inhibitPolicyMapping 1, in CA1'
      path:
        - 'CA1: issued by TA; policyConstraints inhibitPolicyMapping 1; certificatePolicies P1'
        - 'CA2: issued by CA1; certificatePolicies P1; policyMappings P1 -> P2'
        - 'CA3: issued by CA2; certificatePolicies P2; policyMappings P2 -> P3'
        - 'EE: issued by CA3; certificatePolicies P3'
      path_basis: 'the four certificates and the policy OIDs are chosen for this vector; the source states only what the value of one means'
    expected:
      text: 'For example, a value of one indicates that policy mapping may be processed in certificates issued by the subject of this certificate, but not in additional certificates in the path.'
    expected_basis: stated
    expected_result: 'the mapping in CA2 (issued by the subject of CA1) is processed; the mapping in CA3 is not'
    rule:
      - 'rfc-5280#N-166'
      - 'rfc-5280#R-0409'
      - 'rfc-5280#R-0437'
      - 'rfc-5280#R-0443'
      - 'rfc-5280#R-0455'
      - 'rfc-5280#R-0459'
    source_issue: 'The general sentence before the example counts "the number of additional certificates that may appear in the path"; §6.1.2(f) and §6.1.4(h)(2) count and decrement only non-self-issued certificates. A self-issued certificate between CA1 and CA2 counts under the first reading and not under §6.1. The example sentence ("certificates issued by the subject of this certificate") agrees with §6.1.'
    derived:
      in_source: false
      trace:
        - 'n = 4; policy_mapping = 5'
        - 'i=1 CA1 6.1.4(h)(2): 5 -> 4; 6.1.4(i)(2): inhibitPolicyMapping 1 < 4, so policy_mapping = 1'
        - 'i=2 CA2 6.1.3(d)(1)(i): child P1 at depth 2; 6.1.4(b)(1): policy_mapping 1 > 0, so the depth-2 P1 node''s expected_policy_set becomes {P2}; (h)(2): 1 -> 0'
        - 'i=3 CA3 6.1.3(d)(1)(i): P2 is in that expected_policy_set, child P2 at depth 3'
        - 'i=3 CA3 6.1.4(b)(2): policy_mapping = 0, so the depth-3 node with valid_policy P2 is deleted and the tree is pruned (R-0443, R-0444); the tree becomes NULL'
        - 'i=4 EE: valid_policy_tree NULL; explicit_policy (initial 5, now 2) > 0, so 6.1.3(f) passes'
      outcome: 'succeeds with a NULL valid_policy_tree; the P2 -> P3 mapping is not honoured. With initial-explicit-policy set, the path fails at 6.1.3(f) for EE.'

