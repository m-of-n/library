# ====================================================================
# Conventions used in this file
# ====================================================================
#
# ids        PKIX-<section>-NN, never reused. Appendix C.1 is C1, Section
#            4.2.1.10 is 42110, Section 6.1.4 is 614, Appendix B is B.
#            A section's source vectors come first, constructed ones after.
# source     locator: the section of RFC 5280 the vector is taken from, and
#            lines: the source line range (".cache/rfc-5280.txt") that holds
#            the example or, for a constructed vector, the governing rule.
# in_source  true: the source prints the input (bytes, value, figure).
#            false: the input was built for this file.
# fidelity   reconstructed -- Appendix C. The source prints a dumpasn1
#                             annotation (offset, length, type, value), not a
#                             raw byte column. The fixture bytes were rebuilt
#                             by DER-encoding every annotated node and checking
#                             the computed offset and length of each node
#                             against the printed ones (README, "How the
#                             fixtures were rebuilt").
#            split         -- taken out of running prose; every character of
#                             the quoted input is the source's.
#            figure        -- read off a figure (Figures 3 to 7).
#            constructed   -- built for this file from a rule the source
#                             states but gives no literal for.
# input      fixtures: fixture (path, relative to this directory), sha256 (of
#            the .hex file as committed), der_sha256 and der_length (of the
#            bytes it encodes), dump and dump_sha256 (the verbatim annotated
#            dump). Prose vectors: the printed value(s).
# expected   what the source states for this input. Quoted strings are
#            verbatim after whitespace normalisation: a line break plus the
#            next line's margin reads as one space, two spaces after a full
#            stop inside a line are kept, page header and footer are not
#            text. One quote rejoins a word hyphenated across a line end
#            ("non-" + "self-issued" -> non-self-issued); it is marked.
#            Values under `annotation` are read off the printed dump.
# expected_basis
#            stated      -- the source states this result for this input.
#            rule-quoted -- the source gives only the rule; `rule_text`
#                           quotes it and the result is under `derived`.
# expected_result
#            present at top level ONLY where the source states the result.
# derived    everything this extraction computed or checked, with
#            in_source: false. Tool results name the tool (OpenSSL 3.0.13,
#            run locally; nothing fetched).
# rule       the rfc-5280#R-NNNN entries (requirements.yaml) and N-NNN
#            entries (normative.md) that govern the expected or derived
#            result. A constructed vector without one cites the locator.
# source_issue
#            a defect, inconsistency or gap in the SOURCE, recorded and not
#            repaired; README lists them.
#
# CONSTRUCTED PATH SCENARIOS (§6.1). They are descriptions, not minted
# certificates. Read every scenario with these defaults, which are
# assumptions of this file, not statements of the source:
#   - the trust anchor TA is given as trust anchor information (name
#     cn=TA,dc=example,dc=com, a public key, its algorithm and parameters)
#     per §6.1.1(d); it is not a certificate in the path;
#   - `path` lists certificate 1 to n; certificate 1 is issued by TA and
#     certificate n is the target; the subject of each is the issuer of the
#     next (§6.1(a)) unless the vector says otherwise;
#   - every certificate is version 3, its signature verifies with the
#     working public key, it is within its validity period at the
#     validation time and it is not revoked, unless the vector says
#     otherwise;
#   - a certificate marked `ca: true` carries basicConstraints (critical,
#     cA TRUE, no pathLenConstraint) and keyUsage (critical, keyCertSign
#     and cRLSign) unless its `extensions` say otherwise; an end entity
#     carries neither;
#   - extensions not listed are absent; no certificate carries
#     certificatePolicies unless listed, so valid_policy_tree becomes NULL
#     at certificate 1 and the policy steps play no part;
#   - the §6.1.1 inputs take these values unless `inputs` says otherwise:
#     user-initial-policy-set any-policy; initial-policy-mapping-inhibit,
#     initial-explicit-policy and initial-any-policy-inhibit not set (so
#     explicit_policy, policy_mapping and inhibit_anyPolicy start at n+1);
#     initial-permitted-subtrees every name of every type;
#     initial-excluded-subtrees empty.
# `trace` gives the state-variable changes that decide the outcome; steps
# that change nothing relevant are left out. `fails_at` names the step
# whose check fails and certificate i.

