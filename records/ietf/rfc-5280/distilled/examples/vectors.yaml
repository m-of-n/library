      validation_time_basis: 'chosen for this vector; the source names no validation time'
    expected:
      text: 'The first two certificates and the CRL comprise a minimal certification path.'
    expected_basis: rule-quoted
    rule:
      - 'rfc-5280#R-0381'
      - 'rfc-5280#R-0390'
      - 'rfc-5280#R-0418'
      - 'rfc-5280#R-0419'
      - 'rfc-5280#R-0420'
      - 'rfc-5280#R-0432'
      - 'rfc-5280#R-0527'
      - 'rfc-5280#R-0528'
      - 'rfc-5280#R-0531'
      - 'rfc-5280#R-0533'
      - 'rfc-5280#R-0537'
    derived:
      in_source: false
      trace:
        - 'n = 1: the self-signed trust anchor C.1 is not part of the path (R-0381); working_public_key and working_issuer_name come from C.1'
        - '6.1.3(a)(1) C.2 signature verifies under the C.1 key: yes (openssl)'
        - '6.1.3(a)(2) 2005-02-05T18:00:00Z is within 2004-09-15T11:48:21Z..2005-03-15T11:48:21Z: yes'
        - '6.1.3(a)(3) revocation, §6.3.3: C.2 has no cRLDistributionPoints, so C.4 is processed under R-0537 (a DP with reasons and cRLIssuer omitted); C.4 has no issuingDistributionPoint, so interim_reasons_mask = all-reasons; C.4 issuer equals the C.2 issuer; C.1 keyUsage has cRLSign (R-0527); C.4 signature verifies under the C.1 key (R-0528); entry serial 18 is found with reasonCode keyCompromise, so cert_status = keyCompromise (R-0531, R-0533)'
        - '6.1.3(a)(3) fails: the certificate is revoked'
      outcome: fails
      fails_at: '§6.1.3(a)(3), certificate i=1 (C.2), revoked (keyCompromise)'
      without_revocation_check: 'every other step of 6.1.3 to 6.1.5 succeeds (no name constraints, no policies; explicit_policy starts at 2 and ends at 1, so the NULL valid_policy_tree does not fail the path)'
      openssl: 'openssl verify -attime 1107626400 -auth_level 0 -crl_check -CAfile C.1 -CRLfile C.4 C.2: "error 23 at 0 depth lookup: certificate revoked"; the same without -crl_check: "OK"'

  - id: PKIX-C-02
    source:
