      lines: '4452'
    kind: path-validation
    in_source: false
    fidelity: constructed
    input:
      trust_anchor: 'C.1 (C.1-rsa-self-signed-ca.hex), as trust anchor information'
      path:
        - 'C.2 (C.2-rsa-end-entity.hex)'
      validation_time: '2026-10-13T00:00:00Z (the extraction date)'
    rule_text: '(2)  The certificate validity period includes the current time.'
    rule:
      - 'rfc-5280#R-0419'
      - 'rfc-5280#R-0432'
    expected_basis: rule-quoted
    derived:
      in_source: false
      outcome: fails
      fails_at: '§6.1.3(a)(2), certificate i=1 (C.2): notAfter 2005-03-15T11:48:21Z has passed'
      note: 'The trust anchor is trust anchor information (§6.1.1(d): name, key, algorithm, parameters); §6.1 takes no validity period for it, so the expiry of the C.1 certificate is not itself a §6.1 failure. OpenSSL differs: openssl verify -CAfile C.1 C.2 at the current time reports "error 10 at 1 depth lookup: certificate has expired" for C.1 before C.2. Checking the anchor''s own validity is an augmentation §6.1 permits (R-0382: "an application MAY augment this algorithm to further limit the set of valid paths") but does not require, so a harness that follows §6.1 must not count it as the reason.'

