  # ======================= §4.2.1 standard certificate extensions =======================

  - name: authorityKeyIdentifier
    asn1_type: AuthorityKeyIdentifier (SEQUENCE)
    source: "§4.2.1.1, lines 1487-1539; Appendix A.2, lines 6983-6992"
    normative_status: profiled
    oid: "id-ce-authorityKeyIdentifier { id-ce 35 }"
    oid_dotted: 2.5.29.35
    criticality: >-
      MUST be non-critical: "Conforming CAs MUST mark this extension as non-critical." (§4.2.1.1,
      line 1530).
    criticality_by:
      - rfc-5280#R-0088
    presence: >-
      MUST, keyIdentifier form, in every certificate a conforming CA generates: "The keyIdentifier
      field of the authorityKeyIdentifier extension MUST be included in all certificates generated
      by conforming CAs to facilitate certification path construction." Exception: "where a CA
      distributes its public key in the form of a "self-signed" certificate, the authority key
      identifier MAY be omitted." (lines 1497-1501). Applications SHOULD recognize it (R-0080).
    encoding: DER, inside extnValue (ENC-02)
    fields:
      - name: keyIdentifier
        asn1_type: KeyIdentifier (OCTET STRING)
        tag: "IMPLICIT [0] (identifier 80, primitive)"
        required: conditional
        required_when: Present in every certificate from a conforming CA except a self-signed one (R-0082, R-0083); always present in a CRL's AKI (R-0290).
        constraints: >-
          "The value of the keyIdentifier field SHOULD be derived from the public key used to
          verify the certificate's signature or a method that generates unique values." (lines
          1509-1519, page break removed). Methods are those of subjectKeyIdentifier. "Where a key
          identifier has been previously established, the CA SHOULD use the previously
          established identifier." Equals the issuer's SKI (R-0090).
        constrained_by:
          - rfc-5280#R-0081
          - rfc-5280#R-0082
          - rfc-5280#R-0083
          - rfc-5280#R-0084
          - rfc-5280#R-0085
          - rfc-5280#R-0086
          - rfc-5280#R-0087
          - rfc-5280#R-0090
      - name: authorityCertIssuer
        asn1_type: GeneralNames
        tag: "IMPLICIT [1] (identifier A1, constructed; replaces the GeneralNames SEQUENCE tag)"
        required: conditional
        required_when: >-
          "-- authorityCertIssuer and authorityCertSerialNumber MUST both -- be present or both be
          absent" (A.2 ASN.1 comment, lines 6989-6990). The §4.2.1.1 ASN.1 has no such comment.
        constraints: The issuer-name-and-serial basis of identification (R-0081).
        constrained_by:
          - rfc-5280#R-0081
          - rfc-5280#R-0601
      - name: authorityCertSerialNumber
        asn1_type: CertificateSerialNumber (INTEGER)
        tag: "IMPLICIT [2] (identifier 82, primitive)"
        required: conditional
        required_when: Both-or-neither with authorityCertIssuer (R-0601).
        constraints: Serial of the issuer's certificate; CertificateSerialNumber rules apply.
        constrained_by:
          - rfc-5280#R-0081
          - rfc-5280#R-0601
    layout: >-
      30 L { [80 L <key id>] | [A1 L { GeneralName+ }] | [82 L <serial>] }. Derived (X.690) from
      IMPLICIT TAGS. Appendix C.2 prints "442 22: SEQUENCE {" "444 20: [0]" followed by 20 key
      identifier octets (lines 7938-7941); C.4 the same in a CRL (lines 8299-8302).
    notes: >-
      In the self-signed C.1 certificate the AKI is absent, as R-0083 permits. The same syntax is
      reused as a CRL extension (crl-authorityKeyIdentifier).

  - name: subjectKeyIdentifier
    asn1_type: SubjectKeyIdentifier ::= KeyIdentifier (OCTET STRING)
    source: "§4.2.1.2, lines 1541-1606; Appendix A.2, lines 7009-7011"
    normative_status: profiled
    oid: "id-ce-subjectKeyIdentifier { id-ce 14 }"
    oid_dotted: 2.5.29.14
    criticality: >-
      MUST be non-critical: "Conforming CAs MUST mark this extension as non-critical." (§4.2.1.2,
      line 1602).
    criticality_by:
      - rfc-5280#R-0096
    presence: >-
      MUST in every CA certificate: "this extension MUST appear in all conforming CA certificates,
      that is, all certificates including the basic constraints extension (Section 4.2.1.9) where
      the value of cA is TRUE." (lines 1546-1549). SHOULD in end entity certificates: "this
      extension SHOULD be included in all end entity certificates." (line 1590).
    encoding: DER, inside extnValue
    fields:
      - name: keyIdentifier
        asn1_type: OCTET STRING
        tag: none (universal OCTET STRING, 04)
        required: true
        constraints: >-
          In a CA certificate "the value of the subject key identifier MUST be the value placed in
          the key identifier field of the authority key identifier extension (Section 4.2.1.1) of
          certificates issued by the subject of this certificate." (lines 1549-1552).
          "Applications are not required to verify that key identifiers match when performing
          certification path validation." (lines 1552-1554). Generation methods: "(1) The keyIdentifier is composed
          of the 160-bit SHA-1 hash of the value of the BIT STRING subjectPublicKey (excluding the
          tag, length, and number of unused bits)." "(2) The keyIdentifier is composed of a
          four-bit type field with the value 0100 followed by the least significant 60 bits of the
          SHA-1 hash of the value of the BIT STRING subjectPublicKey (excluding the tag, length,
          and number of unused bits)." "Other methods of generating unique numbers are also
          acceptable." (lines 1560-1581, page break removed).
        constrained_by:
          - rfc-5280#R-0089
          - rfc-5280#R-0090
          - rfc-5280#R-0091
          - rfc-5280#R-0092
          - rfc-5280#R-0093
          - rfc-5280#R-0094
          - rfc-5280#R-0095
    layout: >-
      04 L <id>. Method (1): 04 14 <20 octets of SHA-1>. Method (2): 04 08 <8 octets>, the first
      four bits 0100 and the remaining 60 bits the low 60 bits of SHA-1. Derived (X.690) from the
      bit layout the source prints at lines 1575-1579. Appendix C.1 prints a method (1) value:
      "374 22: OCTET STRING, encapsulates {" "376 20: OCTET STRING" (lines 7747-7748).

  - name: keyUsage
    asn1_type: KeyUsage (BIT STRING, named bits)
    source: "§4.2.1.3, lines 1608-1731; Appendix A.2, lines 7015-7027"
    normative_status: profiled
    oid: "id-ce-keyUsage { id-ce 15 }"
    oid_dotted: 2.5.29.15
    criticality: >-
      SHOULD be critical: "When present, conforming CAs SHOULD mark this extension as critical."
      (§4.2.1.3, lines 1633-1634).
    criticality_by:
      - rfc-5280#R-0098
    presence: >-
      MUST where the key verifies certificate or CRL signatures: "Conforming CAs MUST include this
      extension in certificates that contain public keys that are used to validate digital
      signatures on other public key certificates or CRLs." (lines 1631-1633). Applications MUST
      recognize it (R-0079).
    encoding: DER, inside extnValue; named bit list, trailing zero bits omitted (ENC-05)
    fields:
      - name: digitalSignature
        asn1_type: named bit
        bit: 0
        required: false
        constraints: >-
          "The digitalSignature bit is asserted when the subject public key is used for verifying
          digital signatures, other than signatures on certificates (bit 5) and CRLs (bit 6), such
          as those used in an entity authentication service, a data origin authentication service,
          and/or an integrity service." (lines 1652-1656).
        constrained_by:
          - rfc-5280#R-0101
          - rfc-5280#R-0102
      - name: nonRepudiation
        asn1_type: named bit
        bit: 1
        aliases:
          - contentCommitment
        required: false
        constraints: >-
          "-- recent editions of X.509 have -- renamed this bit to contentCommitment" (ASN.1
          comment, lines 1640-1641). Asserted for signatures "used to provide a non-repudiation
          service that protects against the signing entity falsely denying some action." (lines
          1658-1662).
        constrained_by:
          - rfc-5280#R-0101
          - rfc-5280#R-0102
      - name: keyEncipherment
        asn1_type: named bit
        bit: 2
        required: false
        constraints: >-
          "The keyEncipherment bit is asserted when the subject public key is used for enciphering
          private or secret keys, i.e., for key transport. For example, this bit shall be set when
          an RSA public key is to be used for encrypting a symmetric content-decryption key or an
          asymmetric private key." (lines 1667-1671).
        constrained_by_locators:
          - "§4.2.1.3 lines 1667-1671 (lowercase shall, known defect)"
      - name: dataEncipherment
        asn1_type: named bit
        bit: 3
        required: false
        constraints: >-
          "The dataEncipherment bit is asserted when the subject public key is used for directly
          enciphering raw user data without the use of an intermediate symmetric cipher." (lines
          1673-1675).
        constrained_by_locators:
          - "§4.2.1.3 lines 1673-1677 (descriptive)"
      - name: keyAgreement
        asn1_type: named bit
        bit: 4
        required: false
        constraints: >-
          "The keyAgreement bit is asserted when the subject public key is used for key agreement."
          (lines 1687-1688).
        constrained_by_locators:
          - "§4.2.1.3 lines 1687-1689 (descriptive)"
      - name: keyCertSign
        asn1_type: named bit
        bit: 5
        required: false
        constraints: >-
          "If the keyCertSign bit is asserted, then the cA bit in the basic constraints extension
          (Section 4.2.1.9) MUST also be asserted." (lines 1692-1694). Without it the key "MUST NOT
          be used to verify signatures on certificates or CRLs unless the corresponding keyCertSign
          or cRLSign bit is set" (lines 1710-1712).
        constrained_by:
          - rfc-5280#R-0099
          - rfc-5280#R-0100
          - rfc-5280#R-0101
          - rfc-5280#R-0154
          - rfc-5280#R-0161
      - name: cRLSign
        asn1_type: named bit
        bit: 6
        required: false
        constraints: >-
          "The cRLSign bit is asserted when the subject public key is used for verifying signatures
          on certificate revocation lists (e.g., CRLs, delta CRLs, or ARLs)." (lines 1696-1698).
          A cRLSign subject's DN must match the issuer of its CRLs (R-0048).
        constrained_by:
          - rfc-5280#R-0048
          - rfc-5280#R-0100
          - rfc-5280#R-0101
      - name: encipherOnly
        asn1_type: named bit
        bit: 7
        required: false
        constraints: >-
          "The meaning of the encipherOnly bit is undefined in the absence of the keyAgreement
          bit." (lines 1700-1701).
        constrained_by_locators:
          - "§4.2.1.3 lines 1700-1703 (descriptive)"
      - name: decipherOnly
