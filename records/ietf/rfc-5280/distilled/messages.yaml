# ---------------------------------------------------------------------------
# Source defects and absences that bear on the structures. New in this pass are marked new.
source_defects:
  - id: SD-M01
    status: new
    locator: "§4.1 line 882 vs Appendix A.1 line 6487; §5.1 line 3090 vs Appendix A.1 line 6564"
    finding: >-
      The third component of Certificate and of CertificateList is signatureValue in the body and
      signature in Appendix A.1. Component names do not reach the wire, so the encodings agree,
      but the A.1 spelling gives two fields of one module the same name (TBSCertificate.signature
      is the AlgorithmIdentifier).
  - id: SD-M02
    status: new
    locator: "Appendix A.1 lines 6251, 6284, 6299, 6341, 6362, 6396, 6429"
    finding: >-
      The comments describing the parameterized attribute syntaxes write DirectoryName (SIZE
      ...) where the type is DirectoryString; X520name (line 6236) has it right. The expanded
      definitions are correct.
  - id: SD-M03
    status: new
    locator: "§4.2.1.6 line 2094 vs Appendix A.2 line 7120"
    finding: >-
      GeneralName otherName is of type OtherName in §4.2.1.6 and AnotherName in A.2. The A.2
      comment explains the renaming; the encoding is the same.
  - id: SD-M04
    status: new
    locator: "§5.2.5 lines 3597-3598; §5.3.1 lines 3841-3842; §5.3.2 lines 3890-3892; §5.2.1 lines 3338-3351"
    finding: >-
      Criticality is stated without a BCP 14 keyword for issuingDistributionPoint (critical),
      reasonCode and invalidityDate (non-critical), and is not stated at all for the CRL use of
      authorityKeyIdentifier. Contrast cRLNumber, which is described as non-critical and then
      required to be marked so with MUST (lines 3380-3386). No requirement therefore binds the
      critical flag of these four extensions.
  - id: SD-M05
    status: new
    locator: "§5.1.2.7 line 3313 vs §4.1.2.9 line 1413"
    finding: >-
      "This field may only appear if the version is 2" for crlExtensions is lowercase, where the
      certificate counterpart "This field MUST only appear if the version is 3" is keyworded. The
      ASN.1 comment at line 3106 carries the MUST.
  - id: SD-M06
    status: new
    locator: "§4.2.1.13 lines 2639-2648 vs §5.3.1 lines 3875-3886; §5.2.5 line 3620"
    finding: >-
      Hazard rather than defect: ReasonFlags bit numbers and CRLReason values diverge from 7 up
      (privilegeWithdrawn bit 7 = value 9, aACompromise bit 8 = value 10, removeFromCRL value 8 has
      no bit, value 7 unused). §5.2.5 writes "aACompromise (8)", the bit number, in a sentence
      about revocation reason codes.
  - id: SD-M07
    status: new
    locator: "§4.2.1.13 lines 2557-2561"
    finding: >-
      Absence: no FTP file-name suffix is given for a single DER CRL, although §4.2.2.1, §4.2.2.2
      and §5.2.7 give .cer and .p7c for certificates. The LDAP rule asks only for "an appropriate
      attribute description for the attribute that holds the CRL"; the CRL attributes are named
      only in the two example URIs (certificateRevocationList and authorityRevocationList, lines
      2567-2568), where §4.2.2.1 names cACertificate and crossCertificatePair in its prose (lines
      2776-2777).
  - id: SD-M08
    status: new
    locator: "§4.1.2.2 lines 1047-1050; Appendix B lines 7409-7418"
    finding: >-
      The 20-octet serialNumber ceiling does not say whether it counts the leading 00 octet that
      Appendix B requires for a positive value whose top bit is set. The same question applies to
      CRLNumber (§5.2.3).
  - id: SD-M09
    status: new
    locator: "§4.2.1.1 lines 1534-1537 vs Appendix A.2 lines 6985-6990"
    finding: >-
      The rule that authorityCertIssuer and authorityCertSerialNumber are both present or both
      absent exists only as an ASN.1 comment in A.2 (R-0601); the §4.2.1.1 ASN.1 and prose omit
      it.
  - id: SD-known-1
    status: known
    locator: "§4.1.2.2 lines 1041-1045"
    finding: Positive vs non-negative serialNumber; is zero allowed. Recorded under TBSCertificate.serialNumber.
  - id: SD-known-2
    status: known
    locator: "§4.2.1.11 line 2421, §4.2.1.14 line 2669; §4.2.2.1 lines 2734-2738, §4.2.2.2 lines 2872-2878 and 2978"
    finding: SkipCerts, AccessDescription and id-ad each defined twice. Recorded under policyConstraints and authorityInfoAccess.
  - id: SD-known-3
    status: known
    locator: "§5.2.5 lines 3635, 3669, 3672, 3688-3689"
    finding: Typos in issuingDistributionPoint text and the at-most-one rule only in a lowercase ASN.1 comment (R-0334 inferred). Recorded under issuingDistributionPoint.
  - id: SD-known-4
    status: known
    locator: "Appendix A.1 line 6895"
    finding: Upper Bounds MUST with no actor (R-0600). Recorded under naming-attribute-types and ORAddress.
  - id: SD-known-5
    status: known
    locator: "§4.2.1.3 line 1669"
    finding: >-
      Lowercase "shall be set" in the keyEncipherment paragraph. The known-defects list cites line
      1688, but the phrase is at line 1669; lines 1688-1689 (keyAgreement) read "then this bit is
      set". Recorded under keyUsage.keyEncipherment.

