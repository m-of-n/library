record: rfc-5280
reviewed_by: ""
extracted: "2026-10-13"

# ---------------------------------------------------------------------------
applicability: >-
  These are ASN.1 structures with DER (and, in one retrieval format, BER) encodings. RFC 5280
  defines no transport, no session, no request/response exchange and no framing above a single
  encoded object: it is a data-format profile. §4 profiles the X.509 v3 certificate and its
  extensions, §5 the X.509 v2 CRL and its extensions, §7 the encoding of internationalized names
  inside GeneralName and DN values, and Appendix A carries the two normative-in-practice ASN.1
  modules (PKIX1Explicit88, "DEFINITIONS EXPLICIT TAGS", line 6132; PKIX1Implicit88,
  "DEFINITIONS IMPLICIT TAGS", line 6961). What the RFC says about DER is narrow and is recorded
  per structure under encoding: "For signature calculation, the data that is to be signed is
  encoded using the ASN.1 distinguished encoding rules (DER) [X.690]" (§4.1, lines 874-876, and
  the same for CRLs, §5.1, lines 3064-3066); extnValue "contains the DER encoding of an ASN.1
  value" (§4.1, line 933); and HTTP/FTP retrieval returns "a single DER encoded certificate" or
  "a single DER encoded CRL" (§4.2.2.1, §4.2.1.13). BER appears once, for the "certs-only" CMS
  collection (§4.2.2.1, lines 2795-2797). The outer Certificate and CertificateList SEQUENCE
  wrappers are not separately given an encoding rule anywhere in §4.1 or §5.1; this file says so
  per entry rather than assuming DER. Three retrieval paths are described, not defined as
  protocols: §4.2.1.13 (CRL distribution points), §4.2.2.1 and §4.2.2.2 (AIA, SIA) and §5.2.7
  (AIA in a CRL) give the HTTP and FTP target formats, the media types, the FTP file-name
  suffixes, the LDAP URI fields and the LDAP/X.500 attribute names. Each of those is captured
  here as a structure (the messages entries prefixed retrieval-, normative_status retrieval),
  because each is a thing an implementation parses or produces and each carries BCP 14 rules. OCSP (id-ad-ocsp,
  §4.2.2.1) and the Time-Stamp Protocol (id-ad-timeStamping, §4.2.2.2) are pointed to, not
  defined: their formats are in RFC 2560 and RFC 3161 and are out of scope. Algorithm-specific
  public key and signature encodings are delegated to RFC 3279, RFC 4055 and RFC 4491 (§1,
  §4.1.2.7) and are out of scope. The ORAddress (x400Address) syntax is carried in Appendix A.1
  from X.411; it is decomposed here to its top-level fields only, and the full module text is the
  schema artifact's job. Not covered because the source does not profile them: attribute
  certificates (onlyContainsAttributeCerts is the only mention), and any extension not in §4.2
  or §5.2/§5.3 except the two Appendix A.2 definitions with no profile text
  (privateKeyUsagePeriod, holdInstructionCode), which are included and marked appendix-only.

# ---------------------------------------------------------------------------
note: >-
  Conventions. (1) Text in double quotes is verbatim from the source with the RFC line wrapping
  undone (a line break and the following indent become one space) and page furniture removed;
  nothing else is altered, the source's own typos included. Every quote was checked
  mechanically against the source. Text that is not a quote is structure or this file's own
  description. Anything that follows from the source, or from X.680/X.690 as the source invokes
  them, rather than being stated in the source, is prefixed Derived: and names its basis.
  (2) source gives the section and the source line range of the definition and of the prose
  that profiles it. (3) required is true, false or conditional. true: the ASN.1 makes the
  component mandatory. false: ASN.1 OPTIONAL or DEFAULT and the profile adds nothing.
  conditional: the profile makes presence depend on a condition, stated in required_when with
  its locator; this overrides the ASN.1, which is kept in asn1_type. A field with a DEFAULT is
  never encoded with its default value under DER (Appendix B, lines 7515-7519), so default
  appears separately. (4) tag gives the tagging the ASN.1 declares: none (universal tag of the
  type), IMPLICIT [n] or EXPLICIT [n]. Where the source writes [n] with no keyword, the tagging
  comes from the module default: the §4.2 extension syntax is repeated in PKIX1Implicit88
  ("DEFINITIONS IMPLICIT TAGS", line 6961), so [n] there is IMPLICIT, except that X.680 makes a
  tag on a CHOICE or an open type (ANY) EXPLICIT regardless of the module default. Those cases
  (GeneralName directoryName [4] Name; DistributionPoint distributionPoint [0]
  DistributionPointName; IssuingDistributionPoint distributionPoint [0]) are marked Derived
  (X.680). The identifier octets in tag (for example A0, 81) are Derived (X.690): class
  context-specific is 10xxxxxx, constructed adds 0x20, and the tag number fills the low five
  bits. (5) constrained_by lists rfc-5280#R-NNNN ids from distilled/requirements.yaml, matched
  in this order: (a) the requirement whose text this file quotes about the field; (b) failing
  a quote, the requirement at the same locator whose object and field name this field.
  constrained_by_locators lists source locators for rules that bind the field but have no
  R-id: lowercase or descriptive statements requirements.yaml does not extract. Pass 3
  reconciles. (6) oid gives the source's ASN.1 value notation verbatim; oid_dotted is Derived
  from the arc definitions (id-ce = 2.5.29, line 1485; id-pkix = 1.3.6.1.5.5.7, lines
  2712-2714; id-pe = id-pkix 1, line 2716; id-qt = id-pkix 2, line 1874; id-kp = id-pkix 3,
  line 2482; id-ad = id-pkix 48, line 2738; id-at = 2.5.4, line 6225). (7) criticality is
  given exactly as the source states it, with the BCP 14 verb or, where the source states it
  without a keyword, the descriptive wording and the label descriptive. (8) layout states the
  DER TLV structure. X.509 has no fixed byte layout beyond DER TLV; the only octet-level
  layouts the source prints are the iPAddress forms (§4.2.1.6 and §4.2.1.10), the key
  identifier method (2) bit layout (§4.2.1.2), the serialNumber sign-bit rule (Appendix B) and
  the hex dumps of Appendix C, which are cited where they evidence a tag or an encoding.
  (9) normative_status: profiled (the body of §4/§5 profiles it); appendix-only (defined in
  Appendix A with no profile text in the body); retrieval (a §4.2.1.13/§4.2.2/§5.2.7 retrieval
  format); referenced (named and delegated to another specification). (10) 444 of the 623
  requirements are wired to at least one field, entry or encoding rule. The 179 wired nowhere
  here are processing requirements that bind no field of any structure: §1 R-0001 (result
  equivalence of path validation); the whole of §6, R-0367 to R-0537 (171 entries), which
  belongs to distilled/protocol.yaml and state-machine.yaml; and the §8 operational
  requirements R-0581, R-0582, R-0583, R-0584, R-0588, R-0589 and R-0593. (11) Message-level
  constrained_by, criticality_by and presence statements bind the structure as a whole;
  field-level constrained_by binds the field.

# ---------------------------------------------------------------------------
# Encoding rules that apply across structures. Each is cited by the entries it binds.
encoding_rules:
  - id: ENC-01
    rule: DER for the to-be-signed data
    source: "§4.1, lines 874-877; §4.1.1.3, lines 990-993; §5.1, lines 3064-3066; §5.1.1.3, lines 3157-3159"
    text: >-
      "For signature calculation, the data that is to be signed is encoded using the ASN.1
      distinguished encoding rules (DER) [X.690]." "The ASN.1 DER encoded tbsCertificate is used
      as the input to the signature function." "The ASN.1 DER encoded tbsCertList is used as the
      input to the signature function."
    constrained_by_locators:
      - "§4.1 lines 874-876 (no BCP 14 keyword)"
      - "§5.1 lines 3064-3066 (no BCP 14 keyword)"
  - id: ENC-02
    rule: extnValue carries a DER encoding
    source: "§4.1, lines 932-935; §4.2, lines 1437-1440"
    text: >-
      "contains the DER encoding of an ASN.1 value -- corresponding to the extension type
      identified -- by extnID" (ASN.1 comment). "When an extension appears in a certificate, the OID appears as
      the field extnID and the corresponding ASN.1 DER encoded structure is the value of the
      octet string extnValue."
    constrained_by_locators:
      - "§4.1 line 933 (ASN.1 comment, no keyword)"
      - "§4.2 lines 1437-1440 (no keyword)"
  - id: ENC-03
    rule: DEFAULT components omitted
    source: "Appendix B, lines 7515-7519"
    text: >-
      "Implementers should note that the DER encoding of SET or SEQUENCE components whose value is
      the DEFAULT omit the component from the encoded certificate or CRL. For example, a
      BasicConstraints extension whose cA value is FALSE would omit the cA boolean from the
      encoded certificate."
    applies_to: "TBSCertificate.version, Extension.critical, BasicConstraints.cA, GeneralSubtree.minimum, IssuingDistributionPoint booleans"
    constrained_by_locators:
      - "Appendix B lines 7515-7519 (descriptive)"
  - id: ENC-04
    rule: SET OF ordering
    source: "Appendix B, lines 7511-7513"
    text: >-
      "Implementers should note that the DER encoding of the SET OF values requires ordering of
      the encodings of the values. In particular, this issue arises with respect to
      distinguished names."
    applies_to: "RelativeDistinguishedName, Attribute.values"
    constrained_by_locators:
      - "Appendix B lines 7511-7513 (descriptive)"
  - id: ENC-05
    rule: named bit lists drop trailing zero bits
    source: "Appendix B, lines 7460-7466"
    text: >-
      "When DER encoding a named bit list, trailing zeros MUST be omitted. That is, the encoded
      value ends with the last named bit that is set to one."
    applies_to: "KeyUsage, ReasonFlags (DistributionPoint.reasons, IssuingDistributionPoint.onlySomeReasons)"
    evidence: >-
      Appendix C prints three keyUsage values: "BIT STRING 1 unused bits" '0000011'B (C.1, lines
      7757-7758), "BIT STRING 6 unused bits" '11'B (C.2, lines 7949-7950) and "BIT STRING 7
      unused bits" '1'B (bit 0) (C.3, lines 8198-8199). Derived (X.690): the first contents octet
      of a BIT STRING is the unused-bit count, so keyCertSign+cRLSign encodes as 03 02 01 06.
    constrained_by:
      - rfc-5280#R-0611
  - id: ENC-06
    rule: INTEGER sign bit for serialNumber
    source: "Appendix B, lines 7409-7413"
    text: >-
      "CAs MUST force the serialNumber to be a non-negative integer, that is, the sign bit in the
      DER encoding of the INTEGER value MUST be zero. This can be done by adding a leading
      (leftmost) `00'H octet if necessary."
    constrained_by:
      - rfc-5280#R-0604
  - id: ENC-07
    rule: 20-octet ceiling on serialNumber and CRLNumber
    source: "§4.1.2.2, lines 1047-1050; §5.2.3, lines 3403-3406; Appendix B, lines 7415-7423"
    text: >-
      "Conforming CAs MUST NOT use serialNumber values longer than 20 octets." "Conforming CRL
      issuers MUST NOT use CRLNumber values longer than 20 octets."
    notes: >-
      Derived: the ceiling is on the INTEGER contents octets, which under ENC-06 include any
      leading 00 octet; the source does not say whether the 20 octets count that padding octet.
    constrained_by:
      - rfc-5280#R-0018
      - rfc-5280#R-0019
      - rfc-5280#R-0302
      - rfc-5280#R-0303
      - rfc-5280#R-0605
      - rfc-5280#R-0606
      - rfc-5280#R-0607
      - rfc-5280#R-0608
  - id: ENC-08
    rule: SIZE (1..MAX) OF
    source: "Appendix B, lines 7425-7430"
    text: >-
      "The SIZE (1..MAX) construct constrains the sequence to have at least one entry. MAX
      indicates that the upper bound is unspecified. Implementations are free to choose an upper
      bound that suits their environment."
    constrained_by_locators:
      - "Appendix B lines 7425-7430 (descriptive)"
  - id: ENC-09
    rule: OBJECT IDENTIFIER limits
    source: "Appendix B, lines 7521-7534"
    text: >-
      "This specification mandates support for OIDs that have arc elements with values that are
      less than 2^28, that is, they MUST be between 0 and 268,435,455, inclusive." "Implementations
      MUST be able to handle OIDs with up to 20 elements (inclusive)."
    constrained_by:
      - rfc-5280#R-0612
      - rfc-5280#R-0613
      - rfc-5280#R-0614
      - rfc-5280#R-0615
      - rfc-5280#R-0616
  - id: ENC-10
    rule: PrintableString repertoire excludes at sign and underscore
    source: "Appendix B, lines 7432-7444"
    text: >-
      "The character string type PrintableString supports a very basic Latin character set: the
      lowercase letters 'a' through 'z', uppercase letters 'A' through 'Z', the digits '0'
      through '9', eleven special characters ' = ( ) + , - . / : ? and space." "Conforming
      implementations MUST NOT encode strings that include either the at sign or underscore
      character as PrintableString."
    constrained_by:
      - rfc-5280#R-0609
      - rfc-5280#R-0610
  - id: ENC-11
    rule: unknown elements in non-critical extensions
    source: "Appendix B, lines 7549-7580"
    text: >-
      "If unknown elements appear within an extension, and the extension is not marked as
      critical, those unknown elements ought to be ignored, as follows:" "If an extension
      containing unexpected values is marked as critical, the implementation MUST reject the
      certificate or CRL containing the unrecognized extension."
    constrained_by:
      - rfc-5280#R-0619
      - rfc-5280#R-0620
      - rfc-5280#R-0621
      - rfc-5280#R-0622
      - rfc-5280#R-0623
  - id: ENC-12
    rule: nameConstraints GeneralName content rules differ from the underlying type
    source: "Appendix B, lines 7536-7547"
    text: >-
      "The content-specific rules for encoding GeneralName field values in the nameConstraints
      extension differ from rules that apply in other extensions. In all other certificate, CRL,
      and CRL entry extensions specified in this document the encoding rules conform to the rules
      for the underlying type."
    constrained_by:
      - rfc-5280#R-0617
      - rfc-5280#R-0618

# ---------------------------------------------------------------------------
messages:

  # ======================= §4.1 certificate core =======================

  - name: Certificate
    source: "§4.1, lines 879-882; §4.1.1, lines 941-1000; Appendix A.1, lines 6484-6487"
    normative_status: profiled
    asn1_type: SEQUENCE
    encoding: >-
      DER for tbsCertificate, which is the signed data (ENC-01). The source states no encoding
      rule for the outer SEQUENCE, signatureAlgorithm or signatureValue in §4.1. A certificate
      retrieved over HTTP or FTP is "a single DER encoded certificate" (§4.2.2.1, lines
      2794-2795), and Appendix C.1 to C.3 are DER dumps.
    fields:
      - name: tbsCertificate
        asn1_type: TBSCertificate
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: >-
          "The Certificate is a SEQUENCE of three required fields." (§4.1.1, line 943). Its DER
          encoding is the signature input (ENC-01).
        constrained_by:
          - rfc-5280#R-0013
          - rfc-5280#R-0014
      - name: signatureAlgorithm
        asn1_type: AlgorithmIdentifier
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: >-
          "This field MUST contain the same algorithm identifier as the signature field in the
          sequence tbsCertificate (Section 4.1.2.3)." (§4.1.1.2, lines 985-986).
          "[RFC3279], [RFC4055], and [RFC4491] list supported signature algorithms, but other
          signature algorithms MAY also be supported."
        constrained_by:
          - rfc-5280#R-0008
          - rfc-5280#R-0007
          - rfc-5280#R-0002
      - name: signatureValue
        asn1_type: BIT STRING
        tag: none (universal BIT STRING, 03)
        required: true
        constraints: >-
          "The signatureValue field contains a digital signature computed upon the ASN.1 DER
          encoded tbsCertificate." (§4.1.1.3, lines 990-991). Algorithm-specific encoding is in
          RFC 3279, RFC 4055 and RFC 4491.
        constrained_by:
          - rfc-5280#R-0002
        constrained_by_locators:
          - "§4.1.1.3 lines 990-995 (no keyword)"
    layout: >-
      30 L { TBSCertificate (30 L ...) | AlgorithmIdentifier (30 L ...) | 03 L 00 <signature
      octets> }. Derived (X.690): the leading 00 of the BIT STRING contents is the unused-bit
      count. Appendix C.1 (lines 7645-7795) prints a 578-octet instance: "0 574: SEQUENCE {",
      tbsCertificate at offset 4, signatureAlgorithm at offset 431, signatureValue "446 129: BIT
      STRING".
    notes: >-
      Source defect: Appendix A.1 names the third component signature ("signature BIT STRING",
      line 6487), where §4.1 names it signatureValue (line 882). Component names do not reach
      the wire, so the encodings are identical. The name signature is also the name of the
      TBSCertificate algorithm field, so the A.1 spelling makes two different fields share one
      name in one module.

  - name: TBSCertificate
    source: "§4.1, lines 884-907; §4.1.2, lines 1002-1020; §4.1.2.1-§4.1.2.9, lines 1022-1416; Appendix A.1, lines 6503-6516"
    normative_status: profiled
    asn1_type: SEQUENCE
    encoding: DER (ENC-01). This is the signature input.
    fields:
      - name: version
        asn1_type: Version
        tag: "EXPLICIT [0] (identifier A0), written [0] EXPLICIT in §4.1 line 885 and [0] in the EXPLICIT TAGS module A.1 line 6504"
        default: v1
        required: conditional
        required_when: >-
          Present with v3 whenever extensions are present: "When extensions are used, as expected
          in this profile, version MUST be 3 (value is 2)." (§4.1.2.1, lines 1024-1026). With
          only a UniqueIdentifier "the version SHOULD be 2 (value is 1); however, the version MAY
          be 3". With only basic fields "the version SHOULD be 1 (the value is omitted from the
          certificate as the default value); however, the version MAY be 2 or 3." Derived (ENC-03):
          v1 is never encoded under DER, so absence means v1.
        constraints: >-
          Values v1(0), v2(1), v3(2). "Generation of version 2 certificates is not expected by
          implementations based on this profile." (§4.1.2.1, lines 1036-1037). Receivers:
          "Implementations SHOULD be prepared to accept any version certificate. At a minimum,
          conforming implementations MUST recognize version 3 certificates."
        constrained_by:
          - rfc-5280#R-0010
          - rfc-5280#R-0011
          - rfc-5280#R-0012
          - rfc-5280#R-0013
          - rfc-5280#R-0014
        constrained_by_locators:
          - "§4.1.2.1 lines 1036-1037 (no keyword)"
      - name: serialNumber
        asn1_type: CertificateSerialNumber (INTEGER)
        tag: none (universal INTEGER, 02)
        required: true
        constraints: >-
          "The serial number MUST be a positive integer assigned by the CA to each certificate. It
          MUST be unique for each certificate issued by a given CA (i.e., the issuer name and
          serial number identify a unique certificate). CAs MUST force the serialNumber to be a
          non-negative integer." (§4.1.2.2, lines 1041-1045). At most 20 octets (ENC-07); sign bit
          zero (ENC-06). Receivers: "Certificate users MUST be able to handle serialNumber values
          up to 20 octets." (lines 1048-1049) and "Certificate users SHOULD be prepared to gracefully handle such
          certificates." (negative or zero serials, line 1053-1054).
        constrained_by:
          - rfc-5280#R-0015
          - rfc-5280#R-0016
          - rfc-5280#R-0017
          - rfc-5280#R-0018
          - rfc-5280#R-0019
          - rfc-5280#R-0020
          - rfc-5280#R-0604
          - rfc-5280#R-0605
          - rfc-5280#R-0606
        notes: >-
          Known source defect: "positive integer" (line 1041) and "non-negative integer" (lines
          1044-1045) disagree on whether zero is allowed.
      - name: signature
        asn1_type: AlgorithmIdentifier
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: >-
          "This field MUST contain the same algorithm identifier as the signatureAlgorithm field in
          the sequence Certificate (Section 4.1.1.2)." (§4.1.2.3, lines 1061-1071, page break removed).
        constrained_by:
          - rfc-5280#R-0021
          - rfc-5280#R-0022
      - name: issuer
        asn1_type: Name
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: >-
          "The issuer field MUST contain a non-empty distinguished name (DN)." (§4.1.2.4, lines
          1079-1080). DirectoryString encoding rules and the attribute types a receiver must
          accept are under DirectoryString and naming-attribute-types. Name chaining matches
          issuer against the issuing CA's subject under §7.1.
        constrained_by:
          - rfc-5280#R-0023
          - rfc-5280#R-0024
          - rfc-5280#R-0025
          - rfc-5280#R-0026
          - rfc-5280#R-0027
          - rfc-5280#R-0029
          - rfc-5280#R-0030
          - rfc-5280#R-0031
          - rfc-5280#R-0032
          - rfc-5280#R-0585
      - name: validity
        asn1_type: Validity
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: See Validity.
        constrained_by:
          - rfc-5280#R-0033
          - rfc-5280#R-0034
          - rfc-5280#R-0035
          - rfc-5280#R-0036
          - rfc-5280#R-0037
      - name: subject
        asn1_type: Name
        tag: none (universal SEQUENCE, 30)
        required: conditional
        required_when: >-
          The component is always present (ASN.1), but its RDNSequence may be empty. Non-empty
          when the subject is a CA or a CRL issuer: "the subject field MUST be populated with a
          non-empty distinguished name matching the contents of the issuer field (Section
          4.1.2.4) in all certificates issued by the subject CA" (§4.1.2.6, lines 1282-1284).
          Empty when the identity is only in subjectAltName: "then the subject name MUST be an
          empty sequence and the subjectAltName extension MUST be critical." (lines 1299-1301).
        constraints: >-
          "Where it is non-empty, the subject field MUST contain an X.500 distinguished name (DN).
          The DN MUST be unique for each subject entity certified by the one CA as defined by the
          issuer field." (§4.1.2.6, lines 1303-1305). DirectoryString encoding exceptions (a)-(c)
          are under DirectoryString. The emailAddress attribute is legacy: "Simultaneous inclusion
          of the emailAddress attribute in the subject distinguished name to support legacy
          implementations is deprecated but permitted." (lines 1373-1375).
        constrained_by:
          - rfc-5280#R-0046
          - rfc-5280#R-0047
          - rfc-5280#R-0048
          - rfc-5280#R-0049
          - rfc-5280#R-0050
          - rfc-5280#R-0051
          - rfc-5280#R-0052
          - rfc-5280#R-0053
          - rfc-5280#R-0054
          - rfc-5280#R-0055
          - rfc-5280#R-0056
          - rfc-5280#R-0057
          - rfc-5280#R-0058
          - rfc-5280#R-0059
          - rfc-5280#R-0060
          - rfc-5280#R-0064
          - rfc-5280#R-0128
          - rfc-5280#R-0585
        constrained_by_locators:
          - "§4.1.2.6 lines 1320-1323 (lowercase: Binary comparison should be used)"
          - "§4.1.2.6 lines 1373-1375 (deprecated but permitted, no keyword)"
      - name: subjectPublicKeyInfo
        asn1_type: SubjectPublicKeyInfo
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: See SubjectPublicKeyInfo.
        constrained_by:
          - rfc-5280#R-0002
      - name: issuerUniqueID
        asn1_type: UniqueIdentifier (BIT STRING)
        tag: "IMPLICIT [1] (identifier 81, primitive)"
        required: conditional
        required_when: >-
          Never generated by a conforming CA: "CAs conforming to this profile MUST NOT generate
          certificates with unique identifiers." (§4.1.2.8, lines 1395-1396). If present at all,
          "version MUST be v2 or v3" (ASN.1 comment, line 893) and "These fields MUST NOT appear if
          the version is 1." (line 1390).
        constraints: >-
          Receivers: "Applications conforming to this profile SHOULD be capable of parsing
          certificates that include unique identifiers, but there are no processing requirements
          associated with the unique identifiers." (lines 1396-1409, page break removed).
        constrained_by:
          - rfc-5280#R-0004
          - rfc-5280#R-0009
          - rfc-5280#R-0065
          - rfc-5280#R-0066
          - rfc-5280#R-0067
          - rfc-5280#R-0068
          - rfc-5280#R-0069
          - rfc-5280#R-0594
      - name: subjectUniqueID
        asn1_type: UniqueIdentifier (BIT STRING)
        tag: "IMPLICIT [2] (identifier 82, primitive)"
        required: conditional
        required_when: Same rules as issuerUniqueID (§4.1.2.8); the version rule is the ASN.1 comment at line 904.
        constraints: Same as issuerUniqueID.
        constrained_by:
          - rfc-5280#R-0005
          - rfc-5280#R-0009
          - rfc-5280#R-0065
          - rfc-5280#R-0066
          - rfc-5280#R-0067
          - rfc-5280#R-0068
          - rfc-5280#R-0069
