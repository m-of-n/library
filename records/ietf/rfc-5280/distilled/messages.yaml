  # ======================= §5 CRL =======================

  - name: CertificateList
    source: "§5.1, lines 3062-3090; §5.1.1, lines 3117-3185; Appendix A.1, lines 6561-6564"
    normative_status: profiled
    asn1_type: SEQUENCE
    encoding: >-
      DER for tbsCertList, which is the signed data: "For signature calculation, the data that is
      to be signed is ASN.1 DER encoded." (§5.1, lines 3064-3065). The source states no encoding
      rule for the outer SEQUENCE; over HTTP or FTP a CRL is "a single DER encoded CRL" (§4.2.1.13,
      line 2558), and Appendix C.4 is a DER dump.
    fields:
      - name: tbsCertList
        asn1_type: TBSCertList
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: >-
          "The CertificateList is a SEQUENCE of three required fields." (§5.1.1, lines 3119-3120).
          When CRLs are issued they MUST be v2 with nextUpdate, cRLNumber and
          authorityKeyIdentifier (§5, R-0259).
        constrained_by:
          - rfc-5280#R-0259
          - rfc-5280#R-0260
      - name: signatureAlgorithm
        asn1_type: AlgorithmIdentifier
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: >-
          "This field MUST contain the same algorithm identifier as the signature field in the
          sequence tbsCertList (Section 5.1.2.2)." (§5.1.1.2, lines 3152-3153).
        constrained_by:
          - rfc-5280#R-0264
          - rfc-5280#R-0265
      - name: signatureValue
        asn1_type: BIT STRING
        tag: none (universal BIT STRING, 03)
        required: true
        constraints: >-
          "The signatureValue field contains a digital signature computed upon the ASN.1 DER
          encoded tbsCertList." (§5.1.1.3, lines 3157-3158). Signing-key arrangements R-0266 to
          R-0268; a delta CRL is signed with the same key as the complete CRLs it updates
          (R-0309).
        constrained_by:
          - rfc-5280#R-0266
          - rfc-5280#R-0267
          - rfc-5280#R-0268
          - rfc-5280#R-0309
    layout: >-
      30 L { TBSCertList | AlgorithmIdentifier | 03 L 00 <signature> }. Appendix C.4 prints a
      352-byte instance: "0 352: SEQUENCE {", tbsCertList "4 202: SEQUENCE {", signatureAlgorithm
      at offset 209 and "224 129: BIT STRING" (lines 8239-8325).
    notes: >-
      Source defect: Appendix A.1 names the third component signature ("signature BIT STRING",
      line 6564) where §5.1 names it signatureValue (line 3090), as for Certificate.

  - name: TBSCertList
    source: "§5.1, lines 3092-3112; §5.1.2, lines 3199-3316; Appendix A.1, lines 6566-6583"
    normative_status: profiled
    asn1_type: SEQUENCE
    encoding: DER (signature input)
    fields:
      - name: version
        asn1_type: Version
        tag: none (universal INTEGER, 02; untagged, unlike TBSCertificate.version)
        required: conditional
        required_when: >-
          Always, under this profile: "When extensions are used, as required by this profile, this
          field MUST be present and MUST specify version 2 (the integer value is 1)." (§5.1.2.1,
          lines 3216-3218). ASN.1: "-- if present, MUST be v2" (line 3094).
        constraints: v2 (1) only. Applications MUST process v1 and v2 complete CRLs (R-0260).
        constrained_by:
          - rfc-5280#R-0259
          - rfc-5280#R-0260
          - rfc-5280#R-0261
          - rfc-5280#R-0269
          - rfc-5280#R-0270
          - rfc-5280#R-0597
      - name: signature
        asn1_type: AlgorithmIdentifier
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: >-
          "This field MUST contain the same algorithm identifier as the signatureAlgorithm field in
          the sequence CertificateList (Section 5.1.1.2)." (§5.1.2.2, lines 3226-3228).
        constrained_by:
          - rfc-5280#R-0271
      - name: issuer
        asn1_type: Name
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: >-
          "The issuer field MUST contain a non-empty X.500 distinguished name (DN). The issuer field
          is defined as the X.501 type Name, and MUST follow the encoding rules for the issuer name
          field in the certificate (Section 4.1.2.4)." (§5.1.2.3, lines 3235-3238). It matches the
          CRL issuer certificate's subject byte-for-byte in encoding (R-0048, R-0060) and any
          cRLIssuer pointing to it (R-0222).
        constrained_by:
          - rfc-5280#R-0048
          - rfc-5280#R-0060
          - rfc-5280#R-0222
          - rfc-5280#R-0272
          - rfc-5280#R-0273
          - rfc-5280#R-0293
      - name: thisUpdate
        asn1_type: Time
        tag: none (universal UTCTime 17 or GeneralizedTime 18)
        required: true
        constraints: >-
          "This field indicates the issue date of this CRL." UTCTime through 2049, GeneralizedTime
          from 2050, both processed, each per §4.1.2.5.1 or §4.1.2.5.2 (§5.1.2.4, lines 3240-3262).
          A different thisUpdate means a different CRL number (R-0301).
        constrained_by:
          - rfc-5280#R-0274
          - rfc-5280#R-0275
          - rfc-5280#R-0276
          - rfc-5280#R-0277
          - rfc-5280#R-0278
          - rfc-5280#R-0301
          - rfc-5280#R-0318
      - name: nextUpdate
        asn1_type: Time
        tag: none (universal UTCTime 17 or GeneralizedTime 18)
        required: conditional
        required_when: >-
          ASN.1 OPTIONAL, profile mandatory: "Conforming CRL issuers MUST include the nextUpdate
          field in all CRLs. Note that the ASN.1 syntax of TBSCertList describes this field as
          OPTIONAL, which is consistent with the ASN.1 structure defined in [X.509]. The behavior
          of clients processing CRLs that omit nextUpdate is not specified by this profile."
          (§5.1.2.5, lines 3272-3276).
        constraints: >-
          "The next CRL could be issued before the indicated date, but it will not be issued any
          later than the indicated date. CRL issuers SHOULD issue CRLs with a nextUpdate time equal
          to or later than all previous CRLs." (lines 3267-3270). Year-2050 rule and §4.1.2.5.1 /
          §4.1.2.5.2 forms as thisUpdate.
        constrained_by:
          - rfc-5280#R-0259
          - rfc-5280#R-0279
          - rfc-5280#R-0280
          - rfc-5280#R-0281
          - rfc-5280#R-0282
          - rfc-5280#R-0283
          - rfc-5280#R-0284
          - rfc-5280#R-0285
      - name: revokedCertificates
        asn1_type: SEQUENCE OF crl-entry
        tag: none (universal SEQUENCE, 30)
        required: conditional
        required_when: >-
          "When there are no revoked certificates, the revoked certificates list MUST be absent."
          (§5.1.2.6, lines 3291-3292). Derived: an empty 30 00 list is therefore non-conforming.
        constraints: See crl-entry. Entry retention R-0003; delta CRL contents R-0312 to R-0315.
        constrained_by:
          - rfc-5280#R-0003
          - rfc-5280#R-0286
          - rfc-5280#R-0312
          - rfc-5280#R-0313
          - rfc-5280#R-0314
          - rfc-5280#R-0315
      - name: crlExtensions
        asn1_type: Extensions
        tag: "EXPLICIT [0] (identifier A0), written [0] EXPLICIT in §5.1 line 3105 and [0] in the A.1 EXPLICIT TAGS module line 6579"
        required: conditional
        required_when: >-
          Always, under this profile: cRLNumber and authorityKeyIdentifier "are REQUIRED" in all
          CRLs (§5.2, lines 3334-3336). ASN.1 "-- if present, version MUST be v2" (line 3106).
          §5.1.2.7: "This field may only appear if the version is 2 (Section 5.1.2.1)." (line
          3313, lowercase).
        constraints: >-
          "If present, this field is a sequence of one or more CRL extensions." (lines 3313-3315).
          Critical extension processing R-0288. The extensions are the crl-* entries below.
        constrained_by:
          - rfc-5280#R-0263
          - rfc-5280#R-0288
          - rfc-5280#R-0289
          - rfc-5280#R-0599
        constrained_by_locators:
          - "§5.1.2.7 line 3313 (lowercase may only appear)"
    layout: >-
      30 L { 02 01 01 | 30 L AlgorithmIdentifier | 30 L issuer | 17/18 thisUpdate | 17/18
      nextUpdate | [30 L { crl-entry+ }] | A0 L { 30 L { Extension+ } } }. Appendix C.4: "7 1:
      INTEGER 1" (line 8241), "94 13: UTCTime" and "109 13: UTCTime" (lines 8269-8270), the entry
      list "124 34: SEQUENCE {" (line 8271) and "160 47: [0] {" (line 8285).

  - name: crl-entry
    aliases:
      - revokedCertificates element
    source: "§5.1, lines 3099-3104; §5.1.1.1, lines 3127-3131; §5.1.2.6, lines 3289-3298; §5.3, lines 3815-3837"
    normative_status: profiled
    asn1_type: SEQUENCE (anonymous, element of TBSCertList.revokedCertificates)
    encoding: DER
    fields:
      - name: userCertificate
        asn1_type: CertificateSerialNumber
        tag: none (universal INTEGER, 02)
        required: true
        constraints: >-
          "Certificates revoked by the CA are uniquely identified by the certificate serial
          number." (§5.1.2.6, lines 3293-3294). In an indirect CRL the issuer is given by
          certificateIssuer (§5.3.3). Its type is CertificateSerialNumber, so the INTEGER rules of
          that entry apply to its encoding; the §4.1.2.2 requirements themselves are stated of the
          certificate's serialNumber, not of the CRL entry.
        constrained_by_locators:
          - "§5.1 line 3100 (type CertificateSerialNumber)"
          - "§5.1.2.6 lines 3292-3294 (no keyword)"
      - name: revocationDate
        asn1_type: Time
        tag: none (universal UTCTime 17 or GeneralizedTime 18)
        required: true
        constraints: >-
          "The time for revocationDate MUST be expressed as described in Section 5.1.2.4." (lines
          3295-3296). "the revocation date SHOULD NOT precede the date of issue of earlier CRLs."
          (§5.3.2, lines 3896-3897).
        constrained_by:
          - rfc-5280#R-0287
          - rfc-5280#R-0360
      - name: crlEntryExtensions
        asn1_type: Extensions
        tag: none (universal SEQUENCE, 30; untagged)
        required: false
        constraints: >-
          ASN.1 "-- if present, version MUST be v2" (line 3103). "If a CRL contains a critical CRL
          entry extension that the application cannot process, then the application MUST NOT use
          that CRL to determine the status of any certificates." (§5.3, lines 3822-3825). "Support
          for the CRL entry extensions defined in this specification is optional for conforming CRL
          issuers and applications. However, CRL issuers SHOULD include reason codes (Section
          5.3.1) and invalidity dates (Section 5.3.2) whenever this information is available."
          (lines 3834-3837).
        constrained_by:
          - rfc-5280#R-0262
          - rfc-5280#R-0356
          - rfc-5280#R-0357
          - rfc-5280#R-0598
    layout: >-
      30 L { 02 L serial | 17/18 date | [30 L { Extension+ }] }. Appendix C.4: "126 32: SEQUENCE
      {" "128 1: INTEGER 18" "131 13: UTCTime" "146 12: SEQUENCE {" then the reasonCode extension
      (lines 8272-8279).
    notes: >-
      §5 says: "This profile defines one private Internet CRL extension but does not define any private CRL entry extensions." (lines 3044-3045).

