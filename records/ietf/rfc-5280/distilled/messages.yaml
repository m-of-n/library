        constraints: Receivers SHOULD accept it (R-0234, R-0248, R-0346). Its internal structure is not defined in RFC 5280.
        constrained_by:
          - rfc-5280#R-0232
          - rfc-5280#R-0234
          - rfc-5280#R-0246
          - rfc-5280#R-0248
          - rfc-5280#R-0344
          - rfc-5280#R-0346
      - name: http_content_type
        asn1_type: HTTP header field value
        value: application/pkcs7-mime
        tag: not applicable (HTTP response header)
        required: false
        constraints: >-
          "and SHOULD specify the media type application/pkcs7-mime [RFC2797] in the content-type
          header field of the response for "certs-only" CMS messages." (lines 2813-2816).
        constrained_by:
          - rfc-5280#R-0236
          - rfc-5280#R-0250
          - rfc-5280#R-0348
      - name: ftp_file_suffix
        asn1_type: file name suffix
        value: .p7c
        tag: not applicable (FTP file name)
        required: false
        constraints: >-
          "the name of a file that contains a "certs-only" CMS message SHOULD have a suffix of
          ".p7c" [RFC2797]." (lines 2817-2819).
        constrained_by:
          - rfc-5280#R-0238
          - rfc-5280#R-0252
          - rfc-5280#R-0350
    layout: Not given in this document (RFC 2797 defines the CMS SignedData certs-only form).
    notes: normative_status referenced for the inner structure; the media type and suffix rules are this document's.

  - name: retrieval-der-crl
    source: "§4.2.1.13, lines 2554-2561"
    normative_status: retrieval
    asn1_type: CertificateList
    encoding: >-
      DER, a single CRL: "When the HTTP or FTP URI scheme is used, the URI MUST point to a single
      DER encoded CRL as specified in [RFC2585]." (lines 2557-2559).
    reached_by:
      - "cRLDistributionPoints or freshestCRL DistributionPointName.fullName uniformResourceIdentifier, HTTP or FTP (§4.2.1.13, §4.2.1.15, §5.2.6)"
    fields:
      - name: body
        asn1_type: CertificateList (DER)
        tag: none (universal SEQUENCE, 30)
        required: true
        constraints: The current CRL for the distribution point's reasons, issued by its cRLIssuer (R-0209).
        constrained_by:
          - rfc-5280#R-0209
          - rfc-5280#R-0210
      - name: http_content_type
        asn1_type: HTTP header field value
        value: application/pkix-crl
        tag: not applicable (HTTP response header)
        required: false
        constraints: >-
          "HTTP server implementations accessed via the URI SHOULD specify the media type
          application/pkix-crl in the content-type header field of the response." (lines
          2559-2561).
        constrained_by:
          - rfc-5280#R-0211
      - name: ftp_file_suffix
        asn1_type: file name suffix
        value: not stated
        tag: not applicable (FTP file name)
        required: false
        constraints: >-
          RFC 5280 gives no FTP file-name suffix for a CRL, unlike the .cer and .p7c rules for
          certificates. Derived: RFC 2585, which the sentence cites, is where any such convention
          would be found; it is outside this source.
        constrained_by_locators:
          - "§4.2.1.13 lines 2557-2561 (absence)"
    layout: The bare DER CertificateList as the whole HTTP body or FTP file. Derived.

  - name: retrieval-ldap-uri-crl
    source: "§4.2.1.13, lines 2561-2571"
    normative_status: retrieval
    asn1_type: IA5String URI (LDAP URL per RFC 4516) carried in a uniformResourceIdentifier GeneralName
    encoding: IA5String inside GeneralName [6]
    fields:
      - name: host
        asn1_type: RFC 4516 <host>
        tag: not applicable (URI component)
        required: false
        constraints: >-
          SHOULD be present. "Omitting the <host> (e.g.,
          <ldap:///cn=CA,dc=example,dc=com?authorityRevocationList;binary>) has the effect of
          relying on whatever a priori knowledge the client might have to contact an appropriate
          server." (lines 2567-2570).
        constrained_by:
          - rfc-5280#R-0214
      - name: dn
        asn1_type: RFC 4516 <dn>
        tag: not applicable (URI component)
        required: true
        constraints: >-
          "the URI MUST include a <dn> field containing the distinguished name of the entry holding the CRL" (lines 2561-2563).
        constrained_by:
          - rfc-5280#R-0212
      - name: attrdesc
        asn1_type: RFC 4516 <attrdesc>, exactly one
        tag: not applicable (URI component)
        required: true
        constraints: >-
          "MUST include a single <attrdesc> that contains an appropriate attribute description for
          the attribute that holds the CRL [RFC4523]" (lines 2563-2565). The attributes the source
          names are certificateRevocationList and authorityRevocationList, both with the ;binary
          option in its examples.
        constrained_by:
          - rfc-5280#R-0213
    example: ldap://ldap.example.com/cn=example%20CA,dc=example,dc=com?certificateRevocationList;binary
    example_source: "§4.2.1.13, lines 2566-2567 (the source wraps it after the question mark)"
    layout: ldap://[host]/<dn>?<single attrdesc>. The URL grammar is RFC 4516.
    notes: "When present, DistributionPointName SHOULD include at least one LDAP or HTTP URI. (R-0215)"
    constrained_by:
      - rfc-5280#R-0215

  - name: retrieval-ldap-uri-certificates
    source: "§4.2.2.1, lines 2781-2791; §4.2.2.2, lines 2901-2921; §5.2.7, lines 3795-3805"
    normative_status: retrieval
    asn1_type: IA5String URI (LDAP URL per RFC 4516) carried in AccessDescription.accessLocation
    encoding: IA5String inside GeneralName [6]
    fields:
      - name: host
        asn1_type: RFC 4516 <host>
        tag: not applicable (URI component)
        required: false
        constraints: >-
          SHOULD be present. "Omitting the <host> (e.g., <ldap:///cn=exampleCA,dc=example,dc=com?
          cACertificate;binary>) has the effect of relying on whatever a priori knowledge the
          client might have to contact an appropriate server." (lines 2789-2791).
        constrained_by:
          - rfc-5280#R-0230
          - rfc-5280#R-0244
          - rfc-5280#R-0355
      - name: dn
        asn1_type: RFC 4516 <dn>
        tag: not applicable (URI component)
        required: true
        constraints: >-
          "The LDAP URI [RFC4516] MUST include a <dn> field containing the distinguished name of the entry holding the certificates," (lines 2782-2784).
        constrained_by:
          - rfc-5280#R-0228
          - rfc-5280#R-0242
          - rfc-5280#R-0353
      - name: attributes
        asn1_type: RFC 4516 <attributes>, one or more attribute descriptions
        tag: not applicable (URI component)
        required: true
        constraints: >-
          "MUST include an <attributes> field that lists appropriate attribute descriptions for the
          attributes that hold the DER encoded certificates or cross-certificate pairs [RFC4523],"
          (lines 2784-2786). The source's examples use cACertificate;binary and
          crossCertificatePair;binary.
        constrained_by:
          - rfc-5280#R-0229
          - rfc-5280#R-0243
          - rfc-5280#R-0354
    example: ldap://ldap.example.com/cn=CA,dc=example,dc=com?cACertificate;binary,crossCertificatePair;binary
    example_source: "§4.2.2.1, lines 2787-2788 (the source breaks the line after cn=CA, and prints a space there)"
    layout: ldap://[host]/<dn>?<attrdesc>[,<attrdesc>...]. The URL grammar is RFC 4516.
    notes: >-
      Differs from the CRL form: a CRL URI carries a single <attrdesc>, a certificate URI an
      <attributes> list. The accessLocation SHOULD be a URI where the information is available via
      LDAP (R-0227, R-0241, R-0352).
    constrained_by:
      - rfc-5280#R-0227
      - rfc-5280#R-0241
      - rfc-5280#R-0352

  - name: retrieval-directory-attributes
    source: "§4.2.1.13, lines 2545-2552; §4.2.2.1, lines 2774-2779; §4.2.2.2, lines 2893-2899; §5.2.7, lines 3782-3793"
    normative_status: retrieval
    asn1_type: X.500/LDAP directory entry attributes (RFC 4523; referenced)
    encoding: Attribute values are DER certificates, cross-certificate pairs or CRLs (RFC 4523); not defined here
    fields:
      - name: certificateRevocationList
        asn1_type: CertificateList (RFC 4523 attribute)
        tag: not applicable (directory attribute)
        required: false
        constraints: >-
          For a directoryName distribution point: "The CRL may be stored in either the
          certificateRevocationList or authorityRevocationList attribute. The CRL is to be obtained
          by the application from whatever directory server is locally configured. The protocol the
          application uses to access the directory (e.g., DAP or LDAP) is a local matter." (lines
          2547-2552).
        constrained_by_locators:
          - "§4.2.1.13 lines 2545-2552 (no keyword)"
      - name: authorityRevocationList
        asn1_type: CertificateList (RFC 4523 attribute)
        tag: not applicable (directory attribute)
        required: false
        constraints: As certificateRevocationList. Also the attribute in the source's host-less LDAP URI example (line 2568).
        constrained_by_locators:
          - "§4.2.1.13 lines 2545-2552 (no keyword)"
      - name: cACertificate
        asn1_type: Certificate (RFC 4523 attribute)
        tag: not applicable (directory attribute)
        required: false
        constraints: >-
          For AIA id-ad-caIssuers: "The entry for the directoryName contains CA certificates in the
          crossCertificatePair and/or cACertificate attributes as specified in [RFC4523]." (lines
          2776-2778). Same for SIA id-ad-caRepository (lines 2895-2898).
        constrained_by:
          - rfc-5280#R-0351
        constrained_by_locators:
          - "§4.2.2.1 lines 2774-2779 (no keyword)"
          - "§4.2.2.2 lines 2893-2899 (no keyword)"
      - name: crossCertificatePair
        asn1_type: CertificatePair (RFC 4523 attribute)
        tag: not applicable (directory attribute)
        required: false
        constraints: As cACertificate.
        constrained_by:
          - rfc-5280#R-0351
      - name: userCertificate
        asn1_type: Certificate (RFC 4523 attribute)
        tag: not applicable (directory attribute)
        required: false
        constraints: >-
          For a CRL's AIA when the CRL key differs from the certificate key: "When different public
          keys are used to validate signatures on certificates and CRLs, the desired certificate is
          stored in the userCertificate attribute as specified in [RFC4523]. Thus, implementations
          that support the directoryName form of accessLocation MUST be prepared to find the needed
          certificate in any of these three attributes." (§5.2.7, lines 3787-3792).
        constrained_by:
          - rfc-5280#R-0351
    layout: Not defined here. In LDAP URIs the source writes these with the ;binary transfer option.
    notes: >-
      The directory access protocol is "a local matter" in every one of these sections. The
      https/ldaps caution of §8 applies to all URI forms: "CAs SHOULD NOT include URIs that specify
      https, ldaps, or similar schemes in extensions." (lines 5788-5789; R-0590 to R-0592).
    constrained_by:
      - rfc-5280#R-0590
      - rfc-5280#R-0591
      - rfc-5280#R-0592

