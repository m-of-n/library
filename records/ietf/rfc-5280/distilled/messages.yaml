          - rfc-5280#R-0175
          - rfc-5280#R-0618
      - name: rfc822Name
        asn1_type: IA5String
        tag: "IMPLICIT [1] (identifier 81)"
        required: false
        constraints: >-
          "To indicate a particular mailbox, the constraint is the complete mail address. For
          example, "root@example.com" indicates the root mailbox on the host "example.com". To
          indicate all Internet mail addresses on a particular host, the constraint is specified as
          the host name. For example, the constraint "example.com" is satisfied by any mail address
          at the host "example.com". To specify any address within a domain, the constraint is
          specified with a leading period (as with URIs)." (lines 2274-2282). Applied to
