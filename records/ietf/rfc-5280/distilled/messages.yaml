    encoding: >-
      DER. The alternatives carry context tags [0] to [8] under the PKIX1Implicit88 default
      ("DEFINITIONS IMPLICIT TAGS", line 6961), so each tag replaces the underlying type's tag
      except where the underlying type is a CHOICE (Name), for which X.680 makes the tag explicit.
      Appendix C.2 and C.3 evidence the implicit form: "378 22: [1] 'end.entity@example.com'" (C.2,
      line 7922) and "725 22: [6] 'http://www.example.com'" (C.3, line 8153), with no inner
      IA5String tag.
