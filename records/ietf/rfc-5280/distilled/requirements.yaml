reconciliation: "bin/bcp14-count on .cache/rfc-5280.txt finds 532 BCP 14 keywords once the section 1 RFC 2119 boilerplate is stripped: MUST 267, MUST NOT 35, SHOULD 68, SHOULD NOT 12, MAY 54, SHALL 5, SHALL NOT 3, REQUIRED 3, OPTIONAL 85. The 623 entry texts carry 450, and they agree with the source keyword for keyword except OPTIONAL: 3 in the texts against 85 in the source. The 82 not extracted are not BCP 14 usage: 81 are the ASN.1 OPTIONAL type-notation token inside ASN.1 definitions (4 in 4.1, 16 in 4.2, 7 in 5, 34 in the Appendix A.1 module PKIX1Explicit88 and 20 in the A.2 module PKIX1Implicit88), and one is the 5.1.2.5 prose at line 3274 that names that token as the ASN.1 marker on nextUpdate. The three OPTIONALs extracted are prose (R-0077 in 4.2, R-0369 in 6.1, R-0539 in 7.1). The RFC 2119 paragraph itself is in normative.md, not here. Three further things the count does not show. (1) RECOMMENDS: the source writes this non-RFC 2119 form ten times, and bin/_bcp14.py does not match it because of the trailing letter, so those entries add 0 to the count. They are extracted as requirements (R-0028, R-0067, R-0085, R-0087, R-0094, R-0108, R-0204, R-0366 as RECOMMENDED; R-0219 and R-0373, RECOMMENDS against, as NOT RECOMMENDED) because each states a recommendation the profile makes. (2) verb none: 174 entries carry no BCP 14 keyword. 150 are the section 6 algorithm, extracted step by step because 6 requires conforming implementations to be functionally equivalent to its external behaviour, so every input, state-variable initialisation and lettered step of 6.1.1 to 6.1.6 and 6.3.1 to 6.3.3 binds; 18 are the section 7 matching and conversion rules; 6 are lowercase rules in Appendix B. (3) Keywords inside ASN.1 comments (the -- MUST comments at lines 893, 904, 906, 3094, 3103, 3106 and ten in Appendix A) are real BCP 14 usage and are extracted as requirements, although several restate prose rules. Entries R-0334 and R-0359 are kind inferred and carry no keyword. Lowercase must, should and shall in prose outside sections 6 and 7 and Appendix B are not extracted as requirements; they are in normative.md."
reviewed_by: ""
note: >
  Ids are stable and never reused. Cite as rfc-5280#R-NNNN.
  Entries are in source order. Pass 1 extracted four slices in parallel,
  lines 1-1417 (R-0001 to R-0070), 1418-2983 (R-0071 to R-0255), 2984-3944
  (R-0256 to R-0366) and 3945-8459 (R-0367 to R-0623), and the merge
  renumbered them without reordering. Every text is a verbatim run of the
  source with the RFC line wrapping undone: a source line break and the
  indent that follows it become a single space, the two spaces the RFC sets
  after a full stop inside a line are kept, and nothing else is altered.
  Texts that cross a page break have the footer, form feed, header and
  padding removed first. A word the RFC hyphenates across a line end
  (non-self-issued) is rejoined with no space. Texts taken from ASN.1
  comments keep their -- markers. Several texts are identical because the
  source repeats itself (the LDAP, HTTP and FTP access-method paragraphs of
  4.2.2.1, 4.2.2.2 and 5.2.7; the key identifier methods of 4.2.1.1 and
  4.2.1.2; the 6.1.4 and 6.1.5 working_public_key steps); each is a separate
  source position. verbs lists every keyword of a sentence that carries more
  than one; verb is the dominant one.

requirements:
  - id: "rfc-5280#R-0001"
    object: 'certification path validation implementation'
    field: 'results of path validation equal to those of the Section 6 procedures (the procedures themselves are not required)'
    verb: REQUIRED
    actor: 'implementations'
    locator: '§1'
    text: 'Implementations are REQUIRED to derive the same results but are not required to use the specified procedures.'
    kind: stated
    testable: partial
    testable_reason: 'result equivalence is testable against path-validation vectors; that no other obligation attaches to the procedure is not testable'
    status: active
  - id: "rfc-5280#R-0002"
    object: 'public key materials and digital signatures'
    field: 'identification and encoding when using the algorithms of RFC 3279, RFC 4055 and RFC 4491'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§1'
    text: 'However, conforming implementations that use the algorithms identified in [RFC3279], [RFC4055], and [RFC4491] MUST identify and encode the public key materials and digital signatures as described in those specifications.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0003"
    object: 'CRL entry'
    field: 'earliest removal: not before it appears on one regularly scheduled CRL issued beyond the revoked certificate''s validity period'
    verb: MUST NOT
    actor: 'CRL issuer'
    locator: '§3.3'
    text: 'An entry MUST NOT be removed from the CRL until it appears on one regularly scheduled CRL issued beyond the revoked certificate''s validity period.'
    kind: stated
    testable: partial
    testable_reason: 'testable by comparing a CRL sequence against the revoked certificates'' notAfter; requires observing the issuer''s CRL series over time'
    status: active
  - id: "rfc-5280#R-0004"
    object: 'tbsCertificate.issuerUniqueID'
    field: 'presence requires version v2 or v3 (ASN.1 comment)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1'
    text: '-- If present, version MUST be v2 or v3'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0005"
