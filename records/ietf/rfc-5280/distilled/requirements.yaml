    verb: MUST
    actor: 'conforming implementations that support CRLs'
    locator: '§6.3'
    text: 'Conforming implementations that support CRLs are not required to implement this algorithm, but they MUST be functionally equivalent to the external behavior resulting from this procedure when processing CRLs that are issued in conformance with this profile.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0495"
