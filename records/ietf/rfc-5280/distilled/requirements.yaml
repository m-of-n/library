    actor: 'conforming CA'
    locator: '§4.1.2.1'
    text: 'If only basic fields are present, the version SHOULD be 1 (the value is omitted from the certificate as the default value); however, the version MAY be 2 or 3.'
    kind: stated
    testable: yes
    status: active
