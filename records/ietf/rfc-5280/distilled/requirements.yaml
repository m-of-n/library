  - id: "rfc-5280#R-0049"
    object: 'tbsCertificate.subject'
    field: 'empty sequence when subject naming information is only in subjectAltName'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'If subject naming information is present only in the subjectAltName extension (e.g., a key bound only to an email address or URI), then the subject name MUST be an empty sequence'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0050"
    object: 'subjectAltName extension'
    field: 'critical when subject naming information is only in subjectAltName (condition stated in the preceding entry''s clause)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'and the subjectAltName extension MUST be critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0051"
    object: 'tbsCertificate.subject'
    field: 'when non-empty, an X.500 distinguished name'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'Where it is non-empty, the subject field MUST contain an X.500 distinguished name (DN).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0052"
    object: 'tbsCertificate.subject'
    field: 'DN unique for each subject entity certified by one CA (issuer field)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'The DN MUST be unique for each subject entity certified by the one CA as defined by the issuer field.'
    kind: stated
    testable: partial
    testable_reason: 'testable only over a corpus of the CA''s certificates with knowledge of subject entity identity'
    status: active
  - id: "rfc-5280#R-0053"
    object: 'tbsCertificate.subject'
    field: 'multiple certificates with the same DN to the same subject entity'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'A CA MAY issue more than one certificate with the same DN to the same subject entity.'
    kind: stated
    testable: no
    testable_reason: 'a permission'
    status: active
  - id: "rfc-5280#R-0054"
    object: 'tbsCertificate.subject'
    field: 'receipt of subject names containing the attribute types required for the issuer field'
    verb: MUST
    actor: 'implementations'
    locator: '§4.1.2.6'
    text: 'Implementations of this specification MUST be prepared to receive subject names containing the attribute types required for the issuer field.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0055"
    object: 'tbsCertificate.subject'
    field: 'receipt of subject names containing the attribute types recommended for the issuer field'
    verb: SHOULD
    actor: 'implementations'
    locator: '§4.1.2.6'
    text: 'Implementations of this specification SHOULD be prepared to receive subject names containing the recommended attribute types for the issuer field.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0056"
    object: 'tbsCertificate.subject'
    field: 'Section 7.1 comparison rules for unfamiliar attribute types with DirectoryString values (name chaining)'
    verb: MAY
    actor: 'implementations'
    locator: '§4.1.2.6'
    text: 'Implementations of this specification MAY use the comparison rules in Section 7.1 to process unfamiliar attribute types (i.e., for name chaining) whose attribute values use one of the encoding options from DirectoryString.'
    kind: stated
    testable: no
    testable_reason: 'a permission'
    status: active
  - id: "rfc-5280#R-0057"
    object: 'DirectoryString'
    field: 'encoding of subject attribute values: PrintableString or UTF8String, with exceptions (a)-(c)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'When encoding attribute values of type DirectoryString, conforming CAs MUST use PrintableString or UTF8String encoding, with the following exceptions:'
    kind: stated
    testable: partial
    testable_reason: 'testable on a certificate only when the exceptions (a)-(c) are known not to apply'
    status: active
  - id: "rfc-5280#R-0058"
    object: 'tbsCertificate.subject'
    field: 'exception (a): CA subject encoded the same way as the subject CA encodes the issuer field of the certificates it issues'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'When the subject of the certificate is a CA, the subject field MUST be encoded in the same way as it is encoded in the issuer field (Section 4.1.2.4) in all certificates issued by the subject CA.'
    kind: stated
    testable: partial
    testable_reason: 'testable across a parent/child certificate pair'
    status: active
  - id: "rfc-5280#R-0059"
    object: 'tbsCertificate.subject'
    field: 'exception (a): same legacy encoding (TeletexString, BMPString, UniversalString) as the subject CA uses in issuer fields'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'Thus, if the subject CA encodes attributes in the issuer fields of certificates that it issues using the TeletexString, BMPString, or UniversalString encodings, then the subject field of certificates issued to that CA MUST use the same encoding.'
    kind: stated
    testable: partial
    testable_reason: 'testable across a parent/child certificate pair'
    status: active
  - id: "rfc-5280#R-0060"
    object: 'tbsCertificate.subject'
    field: 'exception (b): CRL issuer subject encoded the same way as the issuer field of its CRLs'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'When the subject of the certificate is a CRL issuer, the subject field MUST be encoded in the same way as it is encoded in the issuer field (Section 5.1.2.3) in all CRLs issued by the subject CRL issuer.'
    kind: stated
    testable: partial
    testable_reason: 'testable across a certificate and the CRLs its subject issues'
    status: active
  - id: "rfc-5280#R-0061"
    object: 'DirectoryString'
    field: 'exception (c): TeletexString, BMPString and UniversalString not used for new subjects'
    verb: SHOULD NOT
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'TeletexString, BMPString, and UniversalString are included for backward compatibility, and SHOULD NOT be used for certificates for new subjects.'
    kind: stated
    testable: partial
    testable_reason: 'whether a subject is new is not observable from the certificate'
    status: active
  - id: "rfc-5280#R-0062"
    object: 'DirectoryString'
    field: 'exception (c): legacy types where the name was previously established'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.1.2.6'
    text: 'However, these types MAY be used in certificates where the name was previously established, including cases in which a new certificate is being issued to an existing subject or a certificate is being issued to a new subject where the attributes being encoded have been previously established in certificates issued to other subjects.'
    kind: stated
    testable: no
    testable_reason: 'a permission conditioned on naming history'
    status: active
  - id: "rfc-5280#R-0063"
    object: 'DirectoryString'
    field: 'receipt of certificates with TeletexString, BMPString or UniversalString'
    verb: SHOULD
    actor: 'certificate users'
    locator: '§4.1.2.6'
    text: 'Certificate users SHOULD be prepared to receive certificates with these types.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0064"
    object: 'subjectAltName extension'
    field: 'rfc822Name used for electronic mail addresses in new certificates'
    verb: MUST
    actor: 'conforming implementations generating new certificates'
    locator: '§4.1.2.6'
    text: 'Conforming implementations generating new certificates with electronic mail addresses MUST use the rfc822Name in the subject alternative name extension (Section 4.2.1.6) to describe such identities.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0065"
    object: 'tbsCertificate.issuerUniqueID, tbsCertificate.subjectUniqueID'
    field: 'appear only if version is 2 or 3'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.8'
    text: 'These fields MUST only appear if the version is 2 or 3 (Section 4.1.2.1).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0066"
    object: 'tbsCertificate.issuerUniqueID, tbsCertificate.subjectUniqueID'
    field: 'absent if version is 1'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.1.2.8'
    text: 'These fields MUST NOT appear if the version is 1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0067"
    object: 'names; unique identifiers'
    field: 'names not reused for different entities; Internet certificates not using unique identifiers'
    verb: RECOMMENDED
    actor: 'this profile (CAs)'
    locator: '§4.1.2.8'
    text: 'This profile RECOMMENDS that names not be reused for different entities and that Internet certificates not make use of unique identifiers.'
    kind: stated
    testable: partial
    testable_reason: 'the unique-identifier half is testable on a certificate; name reuse is testable only over time'
    note: 'Source writes RECOMMENDS, which bin/_bcp14.py does not count; included because it is a stated recommendation. Contributes 0 to the keyword count.'
    status: active
  - id: "rfc-5280#R-0068"
    object: 'tbsCertificate.issuerUniqueID, tbsCertificate.subjectUniqueID'
    field: 'never generated'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.1.2.8'
    text: 'CAs conforming to this profile MUST NOT generate certificates with unique identifiers.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0069"
    object: 'tbsCertificate.issuerUniqueID, tbsCertificate.subjectUniqueID'
    field: 'parsing of certificates that include unique identifiers (no processing requirements)'
    verb: SHOULD
    actor: 'applications conforming to this profile'
    locator: '§4.1.2.8'
    text: 'Applications conforming to this profile SHOULD be capable of parsing certificates that include unique identifiers, but there are no processing requirements associated with the unique identifiers.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0070"
    object: 'tbsCertificate.extensions'
    field: 'appear only if version is 3'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.9'
    text: 'This field MUST only appear if the version is 3 (Section 4.1.2.1).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0071"
    object: 'critical extension'
    field: 'unrecognised critical extension, or critical extension with unprocessable information'
    verb: MUST
    actor: 'certificate-using system'
    locator: '§4.2'
    text: 'A certificate-using system MUST reject the certificate if it encounters a critical extension it does not recognize or a critical extension that contains information that it cannot process.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0072"
    object: 'non-critical extension'
    field: 'unrecognised non-critical extension may be ignored'
    verb: MAY
    actor: 'certificate-using system'
    locator: '§4.2'
    text: 'A non-critical extension MAY be ignored if it is not recognized,'
    kind: stated
    testable: partial
    testable_reason: 'permission; both ignoring and processing an unrecognised non-critical extension conform'
    status: active
  - id: "rfc-5280#R-0073"
    object: 'non-critical extension'
    field: 'recognised non-critical extension must be processed'
    verb: MUST
    actor: 'certificate-using system'
    locator: '§4.2'
    text: 'but MUST be processed if it is recognized.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0074"
    object: 'extensions'
    field: 'at most one instance of each extension (extnID) per certificate'
    verb: MUST NOT
    actor: 'certificate issuer'
    locator: '§4.2'
    text: 'A certificate MUST NOT include more than one instance of a particular extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0075"
    object: 'conforming CA'
    field: 'support for key identifier, basic constraints, key usage and certificate policies extensions'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2'
    text: 'Conforming CAs MUST support key identifiers (Sections 4.2.1.1 and 4.2.1.2), basic constraints (Section 4.2.1.9), key usage (Section 4.2.1.3), and certificate policies (Section 4.2.1.4) extensions.'
    kind: stated
    testable: partial
    testable_reason: 'CA capability; observable only through the certificates a CA issues'
    status: active
  - id: "rfc-5280#R-0076"
    object: 'conforming CA'
    field: 'support for subjectAltName when issuing with an empty subject'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2'
    text: 'If the CA issues certificates with an empty sequence for the subject field, the CA MUST support the subject alternative name extension (Section 4.2.1.6).'
    kind: stated
    testable: partial
    testable_reason: 'CA capability; observable only through the certificates a CA issues'
    status: active
  - id: "rfc-5280#R-0077"
    object: 'conforming CA'
    field: 'support for the extensions not listed as mandatory'
    verb: OPTIONAL
    actor: 'conforming CA'
    locator: '§4.2'
    text: 'Support for the remaining extensions is OPTIONAL.'
    kind: stated
    testable: no
    testable_reason: 'permission; no behaviour is required'
    status: active
  - id: "rfc-5280#R-0078"
    object: 'conforming CA'
    field: 'support for extensions not identified in RFC 5280'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2'
    text: 'Conforming CAs MAY support extensions that are not identified within this specification; certificate issuers are cautioned that marking such extensions as critical may inhibit interoperability.'
    kind: stated
    testable: no
    testable_reason: 'permission; no behaviour is required'
    status: active
  - id: "rfc-5280#R-0079"
    object: 'conforming application'
    field: 'mandatory recognition of keyUsage, certificatePolicies, subjectAltName, basicConstraints, nameConstraints, policyConstraints, extKeyUsage, inhibitAnyPolicy'
    verb: MUST
    actor: 'conforming application'
    locator: '§4.2'
    text: 'At a minimum, applications conforming to this profile MUST recognize the following extensions: key usage (Section 4.2.1.3), certificate policies (Section 4.2.1.4), subject alternative name (Section 4.2.1.6), basic constraints (Section 4.2.1.9), name constraints (Section 4.2.1.10), policy constraints (Section 4.2.1.11), extended key usage (Section 4.2.1.12), and inhibit anyPolicy (Section 4.2.1.14).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0080"
    object: 'conforming application'
    field: 'recognition of authority/subject key identifier and policy mappings extensions'
    verb: SHOULD
    actor: 'conforming application'
    locator: '§4.2'
    text: 'In addition, applications conforming to this profile SHOULD recognize the authority and subject key identifier (Sections 4.2.1.1 and 4.2.1.2) and policy mappings (Section 4.2.1.5) extensions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0081"
    object: 'authorityKeyIdentifier extension'
    field: 'basis of identification: keyIdentifier or authorityCertIssuer + authorityCertSerialNumber'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2.1.1'
    text: 'The identification MAY be based on either the key identifier (the subject key identifier in the issuer''s certificate) or the issuer name and serial number.'
    kind: stated
    testable: partial
    testable_reason: 'permission between two identification forms; both conform'
    status: active
  - id: "rfc-5280#R-0082"
    object: 'authorityKeyIdentifier extension'
    field: 'keyIdentifier presence in every certificate generated by a conforming CA'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.1'
    text: 'The keyIdentifier field of the authorityKeyIdentifier extension MUST be included in all certificates generated by conforming CAs to facilitate certification path construction.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0083"
    object: 'authorityKeyIdentifier extension'
    field: 'omission permitted in a self-signed certificate'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2.1.1'
    text: 'There is one exception; where a CA distributes its public key in the form of a "self-signed" certificate, the authority key identifier MAY be omitted.'
    kind: stated
    testable: partial
    testable_reason: 'permission; presence and absence both conform for self-signed certificates'
    status: active
  - id: "rfc-5280#R-0084"
    object: 'authorityKeyIdentifier.keyIdentifier'
    field: 'derivation from the issuer public key or a uniqueness-preserving method'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.1'
    text: 'The value of the keyIdentifier field SHOULD be derived from the public key used to verify the certificate''s signature or a method that generates unique values.'
    kind: stated
    testable: partial
    testable_reason: 'the derivation can be checked only against the known methods; uniqueness of an arbitrary method is not observable'
    status: active
  - id: "rfc-5280#R-0085"
    object: 'authorityKeyIdentifier.keyIdentifier'
    field: 'generation method for a new key identifier (source wording: RECOMMENDS)'
    verb: RECOMMENDED
    actor: 'conforming CA'
    locator: '§4.2.1.1'
    text: 'Where a key identifier has not been previously established, this specification RECOMMENDS use of one of these methods for generating keyIdentifiers or use of a similar method that uses a different hash algorithm.'
    kind: stated
    testable: partial
    testable_reason: 'checkable only against the two §4.2.1.2 methods; "similar method" is open-ended'
    status: active
  - id: "rfc-5280#R-0086"
    object: 'authorityKeyIdentifier.keyIdentifier'
    field: 'reuse of a previously established key identifier'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.1'
    text: 'Where a key identifier has been previously established, the CA SHOULD use the previously established identifier.'
    kind: stated
    testable: partial
    testable_reason: 'requires knowledge of the identifier previously established for the key'
    status: active
  - id: "rfc-5280#R-0087"
    object: 'certificate user'
    field: 'support for the key identifier method (source wording: RECOMMENDS)'
    verb: RECOMMENDED
    actor: 'certificate user'
    locator: '§4.2.1.1'
    text: 'This profile RECOMMENDS support for the key identifier method by all certificate users.'
    kind: stated
    testable: partial
    testable_reason: 'implementation capability; not observable from a certificate'
    status: active
  - id: "rfc-5280#R-0088"
    object: 'authorityKeyIdentifier extension'
    field: 'criticality: non-critical'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.1'
    text: 'Conforming CAs MUST mark this extension as non-critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0089"
    object: 'subjectKeyIdentifier extension'
    field: 'presence in every CA certificate (basicConstraints cA TRUE)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.2'
    text: 'To facilitate certification path construction, this extension MUST appear in all conforming CA certificates, that is, all certificates including the basic constraints extension (Section 4.2.1.9) where the value of cA is TRUE.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0090"
    object: 'subjectKeyIdentifier extension'
    field: 'SKI of a CA certificate equals the AKI keyIdentifier in certificates it issues'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.2'
    text: 'In conforming CA certificates, the value of the subject key identifier MUST be the value placed in the key identifier field of the authority key identifier extension (Section 4.2.1.1) of certificates issued by the subject of this certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0091"
    object: 'subjectKeyIdentifier extension'
    field: 'derivation for CA certificates: from the public key or a uniqueness-preserving method'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.2'
    text: 'For CA certificates, subject key identifiers SHOULD be derived from the public key or a method that generates unique values.'
    kind: stated
    testable: partial
    testable_reason: 'the derivation can be checked only against the known methods; uniqueness of an arbitrary method is not observable'
    status: active
  - id: "rfc-5280#R-0092"
    object: 'subjectKeyIdentifier extension'
    field: 'presence in end entity certificates'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.2'
    text: 'To assist applications in identifying the appropriate end entity certificate, this extension SHOULD be included in all end entity certificates.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0093"
    object: 'subjectKeyIdentifier extension'
    field: 'derivation for end entity certificates: from the public key'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.2'
    text: 'For end entity certificates, subject key identifiers SHOULD be derived from the public key.'
    kind: stated
    testable: partial
    testable_reason: 'checkable only against the two known methods'
    status: active
  - id: "rfc-5280#R-0094"
    object: 'subjectKeyIdentifier extension'
    field: 'generation method for a new key identifier (source wording: RECOMMENDS)'
    verb: RECOMMENDED
    actor: 'conforming CA'
    locator: '§4.2.1.2'
    text: 'Where a key identifier has not been previously established, this specification RECOMMENDS use of one of these methods for generating keyIdentifiers or use of a similar method that uses a different hash algorithm.'
    kind: stated
    testable: partial
    testable_reason: 'checkable only against the two known methods; "similar method" is open-ended'
    status: active
  - id: "rfc-5280#R-0095"
    object: 'subjectKeyIdentifier extension'
    field: 'reuse of a previously established key identifier'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.2'
    text: 'Where a key identifier has been previously established, the CA SHOULD use the previously established identifier.'
    kind: stated
    testable: partial
    testable_reason: 'requires knowledge of the identifier previously established for the key'
    status: active
  - id: "rfc-5280#R-0096"
    object: 'subjectKeyIdentifier extension'
    field: 'criticality: non-critical'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.2'
    text: 'Conforming CAs MUST mark this extension as non-critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0097"
    object: 'keyUsage extension'
    field: 'presence in certificates whose key verifies certificate or CRL signatures'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.3'
    text: 'Conforming CAs MUST include this extension in certificates that contain public keys that are used to validate digital signatures on other public key certificates or CRLs.'
    kind: stated
    testable: partial
    testable_reason: 'depends on the intended use of the key, which is known to the CA but not always visible in the certificate'
    status: active
  - id: "rfc-5280#R-0098"
    object: 'keyUsage extension'
    field: 'criticality: critical'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.3'
    text: 'When present, conforming CAs SHOULD mark this extension as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0099"
    object: 'keyUsage extension'
    field: 'keyCertSign implies basicConstraints cA TRUE'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.3'
    text: 'If the keyCertSign bit is asserted, then the cA bit in the basic constraints extension (Section 4.2.1.9) MUST also be asserted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0100"
    object: 'keyUsage extension'
    field: 'certificate/CRL signature verification only when keyCertSign / cRLSign is set'
    verb: MUST NOT
    actor: 'certificate user'
    locator: '§4.2.1.3'
    text: 'If the keyUsage extension is present, then the subject public key MUST NOT be used to verify signatures on certificates or CRLs unless the corresponding keyCertSign or cRLSign bit is set.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0101"
    object: 'keyUsage extension'
    field: 'digitalSignature and nonRepudiation absent on a certificate/CRL-signing-only key'
    verb: SHOULD NOT
    actor: 'conforming CA'
    locator: '§4.2.1.3'
    text: 'If the subject public key is only to be used for verifying signatures on certificates and/or CRLs, then the digitalSignature and nonRepudiation bits SHOULD NOT be set.'
    kind: stated
    testable: partial
    testable_reason: 'depends on the intended use of the key'
    status: active
  - id: "rfc-5280#R-0102"
    object: 'keyUsage extension'
    field: 'digitalSignature / nonRepudiation alongside keyCertSign / cRLSign for a multi-purpose key'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2.1.3'
    text: 'However, the digitalSignature and/or nonRepudiation bits MAY be set in addition to the keyCertSign and/or cRLSign bits if the subject public key is to be used to verify signatures on certificates and/or CRLs as well as other objects.'
    kind: stated
    testable: partial
    testable_reason: 'permission; depends on the intended use of the key'
    status: active
  - id: "rfc-5280#R-0103"
    object: 'keyUsage extension'
    field: 'at least one bit set'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.3'
    text: 'When the keyUsage extension appears in a certificate, at least one of the bits MUST be set to 1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0104"
    object: 'certificatePolicies extension'
    field: 'policyQualifiers presence; qualifiers do not change the policy definition'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'Optional qualifiers, which MAY be present, are not expected to change the definition of the policy.'
    kind: stated
    testable: partial
    testable_reason: 'presence is a permission; the semantic expectation is not observable'
    status: active
  - id: "rfc-5280#R-0105"
    object: 'certificatePolicies extension'
    field: 'policyIdentifier uniqueness within the extension'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'A certificate policy OID MUST NOT appear more than once in a certificate policies extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0106"
    object: 'certificatePolicies extension'
    field: 'assertion of anyPolicy in a CA certificate'
    verb: MAY
    actor: 'CA'
    locator: '§4.2.1.4'
    text: 'When a CA does not wish to limit the set of policies for certification paths that include this certificate, it MAY assert the special policy anyPolicy, with a value of { 2 5 29 32 0 }.'
    kind: stated
    testable: partial
    testable_reason: 'permission; depends on the CA''s intent'
    status: active
  - id: "rfc-5280#R-0107"
    object: 'certificatePolicies extension'
    field: 'critical extension: interpret (including qualifiers) or reject'
    verb: MUST
    verbs:
      - MUST
      - MUST
    actor: 'path validation software'
    locator: '§4.2.1.4'
    text: 'If this extension is critical, the path validation software MUST be able to interpret this extension (including the optional qualifier), or MUST reject the certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0108"
    object: 'certificatePolicies extension'
    field: 'PolicyInformation carries only a policyIdentifier, no qualifiers (source wording: RECOMMENDS)'
    verb: RECOMMENDED
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'To promote interoperability, this profile RECOMMENDS that policy information terms consist of only an OID.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0109"
    object: 'certificatePolicies extension'
    field: 'qualifiers with anyPolicy limited to id-qt-cps and id-qt-unotice'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'When qualifiers are used with the special policy anyPolicy, they MUST be limited to the qualifiers identified in this section.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0110"
    object: 'userNotice qualifier'
    field: 'placement only in end entity certificates and CA certificates issued to other organizations'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'To prevent such duplication, this qualifier SHOULD only be present in end entity certificates and CA certificates issued to other organizations.'
    kind: stated
    testable: partial
    testable_reason: '"issued to other organizations" is not determinable from the certificate alone'
    status: active
  - id: "rfc-5280#R-0111"
    object: 'UserNotice'
    field: 'noticeRef absent'
    verb: SHOULD NOT
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'Conforming CAs SHOULD NOT use the noticeRef option.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0112"
    object: 'UserNotice.noticeRef'
    field: 'multilingual notice messages'
    verb: MAY
    actor: 'application software'
    locator: '§4.2.1.4'
    text: 'Messages MAY be multilingual, allowing the software to select the particular language message for its own environment.'
    kind: stated
    testable: no
    testable_reason: 'permission concerning the external notice file, which is outside the certificate'
    status: active
  - id: "rfc-5280#R-0113"
    object: 'UserNotice.explicitText'
    field: 'DisplayText choice: utf8String preferred, ia5String permitted'
    verb: SHOULD
    verbs:
      - SHOULD
      - MAY
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'Conforming CAs SHOULD use the UTF8String encoding for explicitText, but MAY use IA5String.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0114"
    object: 'UserNotice.explicitText'
    field: 'DisplayText choice: not visibleString, not bmpString'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'Conforming CAs MUST NOT encode explicitText as VisibleString or BMPString.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0115"
    object: 'UserNotice.explicitText'
    field: 'no control characters (U+0000-U+001F, U+007F-U+009F)'
    verb: SHOULD NOT
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'The explicitText string SHOULD NOT include any control characters (e.g., U+0000 to U+001F and U+007F to U+009F).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0116"
    object: 'UserNotice.explicitText'
    field: 'utf8String content normalised to NFC'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.4'
    text: 'When the UTF8String encoding is used, all character sequences SHOULD be normalized according to Unicode normalization form C (NFC) [NFC].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0117"
    object: 'UserNotice'
    field: 'display of the noticeRef text when both options present and the notice is locatable'
    verb: SHOULD
    actor: 'application software'
    locator: '§4.2.1.4'
    text: 'If both the noticeRef and explicitText options are included in the one qualifier and if the application software can locate the notice text indicated by the noticeRef option, then that text SHOULD be displayed;'
    kind: stated
    testable: partial
    testable_reason: 'display behaviour; requires an observable UI and a locatable notice file'
    status: active
  - id: "rfc-5280#R-0118"
    object: 'UserNotice'
    field: 'display of explicitText otherwise'
    verb: SHOULD
    actor: 'application software'
    locator: '§4.2.1.4'
    text: 'otherwise, the explicitText string SHOULD be displayed.'
    kind: stated
    testable: partial
    testable_reason: 'display behaviour; requires an observable UI'
    status: active
  - id: "rfc-5280#R-0119"
    object: 'UserNotice.explicitText'
    field: 'graceful handling of explicitText longer than 200 characters'
    verb: SHOULD
    actor: 'certificate user'
    locator: '§4.2.1.4'
    text: 'Therefore, certificate users SHOULD gracefully handle explicitText with more than 200 characters.'
    kind: stated
    testable: partial
    testable_reason: '"gracefully" is not defined; only non-failure is testable'
    status: active
  - id: "rfc-5280#R-0120"
    object: 'policyMappings extension'
    field: 'each issuerDomainPolicy also asserted in certificatePolicies of the same certificate'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.5'
    text: 'Each issuerDomainPolicy named in the policy mappings extension SHOULD also be asserted in a certificate policies extension in the same certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0121"
    object: 'policyMappings extension'
    field: 'neither issuerDomainPolicy nor subjectDomainPolicy is anyPolicy'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.5'
    text: 'Policies MUST NOT be mapped either to or from the special value anyPolicy (Section 4.2.1.4).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0122"
    object: 'policyMappings extension'
    field: 'support by CAs and applications'
    verb: MAY
    actor: 'CA / application'
    locator: '§4.2.1.5'
    text: 'This extension MAY be supported by CAs and/or applications.'
    kind: stated
    testable: no
    testable_reason: 'permission; no behaviour is required'
    status: active
  - id: "rfc-5280#R-0123"
    object: 'policyMappings extension'
    field: 'criticality: critical'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.5'
    text: 'Conforming CAs SHOULD mark this extension as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0124"
    object: 'subjectAltName extension'
    field: 'multiple name forms and multiple instances of each'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'Multiple name forms, and multiple instances of each name form, MAY be included.'
    kind: stated
    testable: partial
    testable_reason: 'permission; single and multiple entries both conform'
    status: active
  - id: "rfc-5280#R-0125"
    object: 'subjectAltName extension'
    field: 'identities of the §4.2.1.6 name forms bound via subjectAltName (or issuerAltName)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'Whenever such identities are to be bound into a certificate, the subject alternative name (or issuer alternative name) extension MUST be used;'
    kind: stated
    testable: partial
    testable_reason: 'whether an identity is "to be bound" is CA intent; observable only as the absence of such identities elsewhere'
    status: active
  - id: "rfc-5280#R-0126"
    object: 'subject'
    field: 'DNS name additionally represented via domainComponent attributes'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'however, a DNS name MAY also be represented in the subject field using the domainComponent attribute as described in Section 4.1.2.4.'
    kind: stated
    testable: partial
    testable_reason: 'permission; both forms conform'
    status: active
  - id: "rfc-5280#R-0127"
    object: 'subjectAltName extension'
    field: 'CA verification of every part of the subjectAltName'
    verb: MUST
    actor: 'CA'
    locator: '§4.2.1.6'
    text: 'Because the subject alternative name is considered to be definitively bound to the public key, all parts of the subject alternative name MUST be verified by the CA.'
    kind: stated
    testable: no
    testable_reason: 'CA vetting process; not observable from the certificate'
    status: active
  - id: "rfc-5280#R-0128"
    object: 'subject / subjectAltName'
    field: 'only an alternative identity: subject is an empty sequence and subjectAltName is present'
    verb: MUST
    verbs:
      - MUST
      - MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'Further, if the only subject identity included in the certificate is an alternative name form (e.g., an electronic mail address), then the subject distinguished name MUST be empty (an empty sequence), and the subjectAltName extension MUST be present.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0129"
    object: 'subjectAltName extension'
    field: 'empty subject requires a critical subjectAltName'
    verb: MUST
    actor: 'issuing CA'
    locator: '§4.2.1.6'
    text: 'If the subject field contains an empty sequence, then the issuing CA MUST include a subjectAltName extension that is marked as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0130"
    object: 'subjectAltName extension'
    field: 'criticality with a non-empty subject: non-critical'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'When including the subjectAltName extension in a certificate that has a non-empty subject distinguished name, conforming CAs SHOULD mark the subjectAltName extension as non-critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0131"
    object: 'subjectAltName extension'
    field: 'Internet mail address carried as rfc822Name'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'When the subjectAltName extension contains an Internet mail address, the address MUST be stored in the rfc822Name.'
    kind: stated
    testable: partial
    testable_reason: 'requires recognising an Internet mail address carried in another name form'
    status: active
  - id: "rfc-5280#R-0132"
    object: 'GeneralName.iPAddress'
    field: 'network byte order'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'When the subjectAltName extension contains an iPAddress, the address MUST be stored in the octet string in "network byte order", as specified in [RFC791].'
    kind: stated
    testable: partial
    testable_reason: 'byte order is not distinguishable from the octets alone without the intended address'
    status: active
  - id: "rfc-5280#R-0133"
    object: 'GeneralName.iPAddress'
    field: 'IPv4 length: exactly 4 octets'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'For IP version 4, as specified in [RFC791], the octet string MUST contain exactly four octets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0134"
    object: 'GeneralName.iPAddress'
    field: 'IPv6 length: exactly 16 octets'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'For IP version 6, as specified in [RFC2460], the octet string MUST contain exactly sixteen octets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0135"
    object: 'GeneralName.dNSName'
    field: 'domain name carried as dNSName (IA5String)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'When the subjectAltName extension contains a domain name system label, the domain name MUST be stored in the dNSName (an IA5String).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0136"
    object: 'GeneralName.dNSName'
    field: 'preferred name syntax (RFC 1034 §3.5 as modified by RFC 1123 §2.1)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'The name MUST be in the "preferred name syntax", as specified by Section 3.5 of [RFC1034] and as modified by Section 2.1 of [RFC1123].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0137"
    object: 'GeneralName.dNSName'
    field: 'dNSName of " " prohibited'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'In addition, while the string " " is a legal domain name, subjectAltName extensions with a dNSName of " " MUST NOT be used.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0138"
    object: 'GeneralName.dNSName'
    field: 'mail address not encoded as a DNS name'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'Finally, the use of the DNS representation for Internet mail addresses (subscriber.example.com instead of subscriber@example.com) MUST NOT be used; such identities are to be encoded as rfc822Name.'
    kind: stated
    testable: partial
    testable_reason: 'a DNS-style rendering of a mailbox is indistinguishable from a host name without outside knowledge'
    status: active
  - id: "rfc-5280#R-0139"
    object: 'GeneralName.uniformResourceIdentifier'
    field: 'URI carried as uniformResourceIdentifier (IA5String)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'When the subjectAltName extension contains a URI, the name MUST be stored in the uniformResourceIdentifier (an IA5String).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0140"
    object: 'GeneralName.uniformResourceIdentifier'
    field: 'no relative URI'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'The name MUST NOT be a relative URI,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0141"
    object: 'GeneralName.uniformResourceIdentifier'
    field: 'RFC 3986 syntax and encoding'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'and it MUST follow the URI syntax and encoding rules specified in [RFC3986].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0142"
    object: 'GeneralName.uniformResourceIdentifier'
    field: 'scheme and scheme-specific-part both present'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'The name MUST include both a scheme (e.g., "http" or "ftp") and a scheme-specific-part.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0143"
    object: 'GeneralName.uniformResourceIdentifier'
    field: 'host of an authority is an FQDN or IP address'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'URIs that include an authority ([RFC3986], Section 3.2) MUST include a fully qualified domain name or IP address as the host.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0144"
    object: 'GeneralName.directoryName'
    field: 'DN unique per subject entity under one issuer'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'The DN MUST be unique for each subject entity certified by the one CA as defined by the issuer field.'
    kind: stated
    testable: partial
    testable_reason: 'requires the issuer''s full set of certificates and knowledge of subject identity'
    status: active
  - id: "rfc-5280#R-0145"
    object: 'GeneralName.directoryName'
    field: 'multiple certificates with the same DN to the same subject'
    verb: MAY
    actor: 'CA'
    locator: '§4.2.1.6'
    text: 'A CA MAY issue more than one certificate with the same DN to the same subject entity.'
    kind: stated
    testable: no
    testable_reason: 'permission; no behaviour is required'
    status: active
  - id: "rfc-5280#R-0146"
    object: 'GeneralName.otherName'
    field: 'additional name types via otherName'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'The subjectAltName MAY carry additional name types through the use of the otherName field.'
    kind: stated
    testable: partial
    testable_reason: 'permission; presence and absence both conform'
    status: active
  - id: "rfc-5280#R-0147"
    object: 'subjectAltName extension'
    field: 'constrainable by nameConstraints as subject DNs are'
    verb: MAY
    actor: 'CA'
    locator: '§4.2.1.6'
    text: 'Subject alternative names MAY be constrained in the same manner as subject distinguished names using the name constraints extension as described in Section 4.2.1.10.'
    kind: stated
    testable: partial
    testable_reason: 'permission; behaviour defined in §4.2.1.10'
    status: active
  - id: "rfc-5280#R-0148"
    object: 'subjectAltName extension'
    field: 'GeneralNames non-empty'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'If the subjectAltName extension is present, the sequence MUST contain at least one entry.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0149"
    object: 'subjectAltName extension'
    field: 'no empty GeneralName values'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.6'
    text: 'Unlike the subject field, conforming CAs MUST NOT issue certificates with subjectAltNames containing empty GeneralName fields.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0150"
    object: 'subjectAltName extension'
    field: 'names with wildcard characters; semantics defined by the application (lowercase "must" in the same sentence)'
    verb: MAY
    actor: 'application'
    locator: '§4.2.1.6'
    text: 'Applications with specific requirements MAY use such names, but they must define the semantics.'
    kind: stated
    testable: no
    testable_reason: 'permission; wildcard semantics are out of scope of this profile'
    status: active
  - id: "rfc-5280#R-0151"
    object: 'issuerAltName extension'
    field: 'encoding rules of §4.2.1.6'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.7'
    text: 'Issuer alternative name MUST be encoded as in 4.2.1.6.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0152"
    object: 'issuerAltName extension'
    field: 'criticality: non-critical'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.7'
    text: 'Where present, conforming CAs SHOULD mark this extension as non- critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0153"
    object: 'subjectDirectoryAttributes extension'
    field: 'criticality: non-critical'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.8'
    text: 'Conforming CAs MUST mark this extension as non-critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0154"
    object: 'basicConstraints extension'
    field: 'cA FALSE excludes keyUsage keyCertSign'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.9'
    text: 'If the cA boolean is not asserted, then the keyCertSign bit in the key usage extension MUST NOT be asserted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0155"
    object: 'basicConstraints extension'
    field: 'no certificate signature verification with a key whose certificate lacks basicConstraints or has cA FALSE'
    verb: MUST NOT
    actor: 'certificate user'
    locator: '§4.2.1.9'
    text: 'If the basic constraints extension is not present in a version 3 certificate, or the extension is present but the cA boolean is not asserted, then the certified public key MUST NOT be used to verify certificate signatures.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0156"
    object: 'basicConstraints.pathLenConstraint'
    field: 'value >= 0'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.9'
    text: 'Where it appears, the pathLenConstraint field MUST be greater than or equal to zero.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0157"
    object: 'basicConstraints extension'
    field: 'presence in CA certificates whose key verifies certificate signatures'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.9'
    text: 'Conforming CAs MUST include this extension in all CA certificates that contain public keys used to validate digital signatures on certificates'
    kind: stated
    testable: partial
    testable_reason: 'depends on the intended use of the key'
    status: active
  - id: "rfc-5280#R-0158"
    object: 'basicConstraints extension'
    field: 'criticality in such certificates: critical'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.9'
    text: 'and MUST mark the extension as critical in such certificates.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0159"
    object: 'basicConstraints extension'
    field: 'criticality in CA certificates not used for certificate signatures: either'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2.1.9'
    text: 'This extension MAY appear as a critical or non- critical extension in CA certificates that contain public keys used exclusively for purposes other than validating digital signatures on certificates.'
    kind: stated
    testable: no
    testable_reason: 'permission; either value conforms'
    status: active
  - id: "rfc-5280#R-0160"
    object: 'basicConstraints extension'
    field: 'criticality in end entity certificates: either'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.2.1.9'
    text: 'This extension MAY appear as a critical or non-critical extension in end entity certificates.'
    kind: stated
    testable: no
    testable_reason: 'permission; either value conforms'
    status: active
  - id: "rfc-5280#R-0161"
    object: 'basicConstraints.pathLenConstraint'
    field: 'present only when cA TRUE and keyUsage keyCertSign'
    verb: MUST NOT
    actor: 'CA'
    locator: '§4.2.1.9'
    text: 'CAs MUST NOT include the pathLenConstraint field unless the cA boolean is asserted and the key usage extension asserts the keyCertSign bit.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0162"
    object: 'nameConstraints extension'
    field: 'use only in a CA certificate; subject names of subsequent certificates lie within the constrained name space'
    verb: MUST
    verbs:
      - MUST
      - MUST
    actor: 'CA / path validation'
    locator: '§4.2.1.10'
    text: 'The name constraints extension, which MUST be used only in a CA certificate, indicates a name space within which all subject names in subsequent certificates in a certification path MUST be located.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0163"
    object: 'nameConstraints extension'
    field: 'criticality: critical'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.10'
    text: 'Conforming CAs MUST mark this extension as critical'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0164"
    object: 'nameConstraints extension'
    field: 'no constraints on x400Address, ediPartyName or registeredID'
    verb: SHOULD NOT
    actor: 'conforming CA'
    locator: '§4.2.1.10'
    text: 'and SHOULD NOT impose name constraints on the x400Address, ediPartyName, or registeredID name forms.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0165"
    object: 'nameConstraints extension'
    field: 'not an empty sequence'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.10'
    text: 'Conforming CAs MUST NOT issue certificates where name constraints is an empty sequence.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0166"
    object: 'nameConstraints extension'
    field: 'permittedSubtrees or excludedSubtrees present'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.10'
    text: 'That is, either the permittedSubtrees field or the excludedSubtrees MUST be present.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0167"
    object: 'nameConstraints extension'
    field: 'processing of directoryName constraints'
    verb: MUST
    actor: 'conforming application'
    locator: '§4.2.1.10'
    text: 'Applications conforming to this profile MUST be able to process name constraints that are imposed on the directoryName name form'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0168"
    object: 'nameConstraints extension'
    field: 'processing of rfc822Name, uniformResourceIdentifier, dNSName and iPAddress constraints'
    verb: SHOULD
    actor: 'conforming application'
    locator: '§4.2.1.10'
    text: 'and SHOULD be able to process name constraints that are imposed on the rfc822Name, uniformResourceIdentifier, dNSName, and iPAddress name forms.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0169"
    object: 'nameConstraints extension'
    field: 'critical constraint on a name form present in a subsequent certificate: process or reject'
    verb: MUST
    actor: 'application'
    locator: '§4.2.1.10'
    text: 'If a name constraints extension that is marked as critical imposes constraints on a particular name form, and an instance of that name form appears in the subject field or subjectAltName extension of a subsequent certificate, then the application MUST either process the constraint or reject the certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0170"
    object: 'GeneralSubtree.minimum'
    field: 'value zero (DEFAULT, so absent in DER)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.10'
    text: 'Within this profile, the minimum and maximum fields are not used with any name forms, thus, the minimum MUST be zero,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0171"
    object: 'GeneralSubtree.maximum'
    field: 'absent'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.10'
    text: 'and maximum MUST be absent.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0172"
    object: 'GeneralSubtree'
    field: 'other minimum/maximum values in a critical extension: process or reject'
    verb: MUST
    actor: 'application'
    locator: '§4.2.1.10'
    text: 'However, if an application encounters a critical name constraints extension that specifies other values for minimum or maximum for a name form that appears in a subsequent certificate, the application MUST either process these fields or reject the certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0173"
    object: 'nameConstraints uniformResourceIdentifier'
    field: 'constraint is an FQDN naming a host or a domain'
    verb: MUST
    verbs:
      - MUST
      - MAY
    actor: 'CA'
    locator: '§4.2.1.10'
    text: 'The constraint MUST be specified as a fully qualified domain name and MAY specify a host or a domain.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0174"
    object: 'nameConstraints uniformResourceIdentifier'
    field: 'leading-period constraint matches with one or more added labels'
    verb: MAY
    actor: 'path validation'
    locator: '§4.2.1.10'
    text: 'When the constraint begins with a period, it MAY be expanded with one or more labels.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0175"
    object: 'nameConstraints uniformResourceIdentifier'
    field: 'URI without an FQDN host in a subsequent certificate: reject'
    verb: MUST
    actor: 'application'
    locator: '§4.2.1.10'
    text: 'If a constraint is applied to the uniformResourceIdentifier name form and a subsequent certificate includes a subjectAltName extension with a uniformResourceIdentifier that does not include an authority component with a host name specified as a fully qualified domain name (e.g., if the URI either does not include an authority component or includes an authority component in which the host name is specified as an IP address), then the application MUST reject the certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0176"
    object: 'nameConstraints rfc822Name'
    field: 'constraint forms: mailbox, host, or domain'
    verb: MAY
    actor: 'CA'
    locator: '§4.2.1.10'
    text: 'A name constraint for Internet mail addresses MAY specify a particular mailbox, all addresses at a particular host, or all mailboxes in a domain.'
    kind: stated
    testable: partial
    testable_reason: 'permission on the constraint forms; matching semantics follow in the same paragraph'
    status: active
  - id: "rfc-5280#R-0177"
    object: 'nameConstraints rfc822Name'
    field: 'applied to emailAddress attributes in the subject DN when no subjectAltName'
    verb: MUST
    actor: 'path validation'
    locator: '§4.2.1.10'
    text: 'When constraints are imposed on the rfc822Name name form, but the certificate does not include a subject alternative name, the rfc822Name constraint MUST be applied to the attribute of type emailAddress in the subject distinguished name.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0178"
    object: 'nameConstraints directoryName'
    field: 'applied to a non-empty subject field and to subjectAltName directoryName entries'
    verb: MUST
    actor: 'path validation'
    locator: '§4.2.1.10'
    text: 'Restrictions of the form directoryName MUST be applied to the subject field in the certificate (when the certificate includes a non-empty subject field) and to any names of type directoryName in the subjectAltName extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0179"
    object: 'nameConstraints x400Address'
    field: 'applied to subjectAltName x400Address entries'
    verb: MUST
    actor: 'path validation'
    locator: '§4.2.1.10'
    text: 'Restrictions of the form x400Address MUST be applied to any names of type x400Address in the subjectAltName extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0180"
    object: 'nameConstraints directoryName'
    field: 'comparison by DN attributes'
    verb: MUST
    actor: 'implementation'
    locator: '§4.2.1.10'
    text: 'When applying restrictions of the form directoryName, an implementation MUST compare DN attributes.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0181"
    object: 'nameConstraints directoryName'
    field: '§7.1 DN comparison rules as the minimum'
    verb: MUST
    actor: 'implementation'
    locator: '§4.2.1.10'
    text: 'At a minimum, implementations MUST perform the DN comparison rules specified in Section 7.1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0182"
    object: 'nameConstraints directoryName'
    field: 'no reliance on full ISO DN comparison'
    verb: SHOULD NOT
    actor: 'CA'
    locator: '§4.2.1.10'
    text: 'CAs issuing certificates with a restriction of the form directoryName SHOULD NOT rely on implementation of the full ISO DN name comparison algorithm.'
    kind: stated
    testable: no
    testable_reason: 'concerns CA reliance, not observable in the certificate; see the following requirement'
    status: active
  - id: "rfc-5280#R-0183"
    object: 'nameConstraints directoryName'
    field: 'restrictions encoded identically to the subject / subjectAltName encoding'
    verb: MUST
    actor: 'CA'
    locator: '§4.2.1.10'
    text: 'This implies name restrictions MUST be stated identically to the encoding used in the subject field or subjectAltName extension.'
    kind: stated
    testable: partial
    testable_reason: 'requires the certificates subordinate to the constraining CA'
    status: active
  - id: "rfc-5280#R-0184"
    object: 'nameConstraints iPAddress'
    field: '§4.2.1.6 iPAddress syntax with the name-constraint additions'
    verb: MUST
    actor: 'CA'
    locator: '§4.2.1.10'
    text: 'The syntax of iPAddress MUST be as described in Section 4.2.1.6 with the following additions specifically for name constraints.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0185"
    object: 'nameConstraints iPAddress'
    field: 'IPv4: 8 octets, address then mask (CIDR)'
    verb: MUST
    actor: 'CA'
    locator: '§4.2.1.10'
    text: 'For IPv4 addresses, the iPAddress field of GeneralName MUST contain eight (8) octets, encoded in the style of RFC 4632 (CIDR) to represent an address range [RFC4632].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0186"
    object: 'nameConstraints iPAddress'
    field: 'IPv6: 32 octets, address then mask'
    verb: MUST
    actor: 'CA'
    locator: '§4.2.1.10'
    text: 'For IPv6 addresses, the iPAddress field MUST contain 32 octets similarly encoded.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0187"
    object: 'policyConstraints extension'
    field: 'processing of requireExplicitPolicy'
    verb: MUST
    actor: 'conforming application'
    locator: '§4.2.1.11'
    text: 'Conforming applications MUST be able to process the requireExplicitPolicy field'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0188"
    object: 'policyConstraints extension'
    field: 'processing of inhibitPolicyMapping'
    verb: SHOULD
    actor: 'conforming application'
    locator: '§4.2.1.11'
    text: 'and SHOULD be able to process the inhibitPolicyMapping field.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0189"
    object: 'policyConstraints extension'
    field: 'inhibitPolicyMapping support implies policyMappings support'
    verb: MUST
    actor: 'application'
    locator: '§4.2.1.11'
    text: 'Applications that support the inhibitPolicyMapping field MUST also implement support for the policyMappings extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0190"
    object: 'policyConstraints extension'
    field: 'critical extension with inhibitPolicyMapping, unsupported: reject'
    verb: MUST
    actor: 'application'
    locator: '§4.2.1.11'
    text: 'If the policyConstraints extension is marked as critical and the inhibitPolicyMapping field is present, applications that do not implement support for the inhibitPolicyMapping field MUST reject the certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0191"
    object: 'policyConstraints extension'
    field: 'not an empty sequence'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.11'
    text: 'Conforming CAs MUST NOT issue certificates where policy constraints is an empty sequence.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0192"
    object: 'policyConstraints extension'
    field: 'inhibitPolicyMapping or requireExplicitPolicy present'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.11'
    text: 'That is, either the inhibitPolicyMapping field or the requireExplicitPolicy field MUST be present.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0193"
    object: 'policyConstraints extension'
    field: 'criticality: critical'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.11'
    text: 'Conforming CAs MUST mark this extension as critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0194"
    object: 'KeyPurposeId'
    field: 'OID assignment per IANA or ITU-T X.660'
    verb: MUST
    actor: 'organization defining a key purpose'
    locator: '§4.2.1.12'
    text: 'Object identifiers used to identify key purposes MUST be assigned in accordance with IANA or ITU-T Recommendation X.660 [X.660].'
    kind: stated
    testable: no
    testable_reason: 'OID registration provenance is not observable'
    status: active
  - id: "rfc-5280#R-0195"
    object: 'extKeyUsage extension'
    field: 'criticality: either'
    verb: MAY
    actor: 'certificate issuer'
    locator: '§4.2.1.12'
    text: 'This extension MAY, at the option of the certificate issuer, be either critical or non-critical.'
    kind: stated
    testable: no
    testable_reason: 'permission; either value conforms'
    status: active
  - id: "rfc-5280#R-0196"
    object: 'extKeyUsage extension'
    field: 'use restricted to an indicated purpose'
    verb: MUST
    actor: 'certificate user'
    locator: '§4.2.1.12'
    text: 'If the extension is present, then the certificate MUST only be used for one of the purposes indicated.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0197"
    object: 'extKeyUsage extension'
    field: 'application may require presence and a particular purpose'
    verb: MAY
    actor: 'certificate-using application'
    locator: '§4.2.1.12'
    text: 'Certificate using applications MAY require that the extended key usage extension be present and that a particular purpose be indicated in order for the certificate to be acceptable to that application.'
    kind: stated
    testable: partial
    testable_reason: 'permission; application policy'
    status: active
  - id: "rfc-5280#R-0198"
    object: 'extKeyUsage extension'
    field: 'not critical when anyExtendedKeyUsage present'
    verb: SHOULD NOT
    actor: 'conforming CA'
    locator: '§4.2.1.12'
    text: 'Conforming CAs SHOULD NOT mark this extension as critical if the anyExtendedKeyUsage KeyPurposeId is present.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0199"
    object: 'extKeyUsage extension'
    field: 'rejection of anyExtendedKeyUsage without the expected OID'
    verb: MAY
    actor: 'application'
    locator: '§4.2.1.12'
    text: 'Applications that require the presence of a particular purpose MAY reject certificates that include the anyExtendedKeyUsage OID but not the particular OID expected for the application.'
    kind: stated
    testable: partial
    testable_reason: 'permission; application policy'
    status: active
  - id: "rfc-5280#R-0200"
    object: 'keyUsage / extKeyUsage'
    field: 'both processed independently'
    verb: MUST
    actor: 'certificate user'
    locator: '§4.2.1.12'
    text: 'If a certificate contains both a key usage extension and an extended key usage extension, then both extensions MUST be processed independently'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0201"
    object: 'keyUsage / extKeyUsage'
    field: 'use restricted to purposes consistent with both'
    verb: MUST
    actor: 'certificate user'
    locator: '§4.2.1.12'
    text: 'and the certificate MUST only be used for a purpose consistent with both extensions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0202"
    object: 'keyUsage / extKeyUsage'
    field: 'no consistent purpose: certificate unusable'
    verb: MUST NOT
    actor: 'certificate user'
    locator: '§4.2.1.12'
    text: 'If there is no purpose consistent with both extensions, then the certificate MUST NOT be used for any purpose.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0203"
    object: 'cRLDistributionPoints extension'
    field: 'criticality: non-critical'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'The extension SHOULD be non-critical,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0204"
    object: 'cRLDistributionPoints extension'
    field: 'support by CAs and applications (source wording: RECOMMENDS)'
    verb: RECOMMENDED
    actor: 'CA / application'
    locator: '§4.2.1.13'
    text: 'but this profile RECOMMENDS support for this extension by CAs and applications.'
    kind: stated
    testable: partial
    testable_reason: 'implementation capability'
    status: active
  - id: "rfc-5280#R-0205"
    object: 'DistributionPoint'
    field: 'not reasons alone; distributionPoint or cRLIssuer present'
    verb: MUST NOT
    verbs:
      - MUST NOT
      - MUST
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'While each of these fields is optional, a DistributionPoint MUST NOT consist of only the reasons field; either distributionPoint or cRLIssuer MUST be present.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0206"
    object: 'DistributionPoint.cRLIssuer'
    field: 'present and naming the CRL issuer when it differs from the certificate issuer'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'If the certificate issuer is not the CRL issuer, then the cRLIssuer field MUST be present and contain the Name of the CRL issuer.'
    kind: stated
    testable: partial
    testable_reason: 'requires knowing whether the certificate issuer is the CRL issuer'
    status: active
  - id: "rfc-5280#R-0207"
    object: 'DistributionPoint.cRLIssuer'
    field: 'absent when the certificate issuer is the CRL issuer'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'If the certificate issuer is also the CRL issuer, then conforming CAs MUST omit the cRLIssuer field'
    kind: stated
    testable: partial
    testable_reason: 'requires knowing whether the certificate issuer is the CRL issuer'
    status: active
  - id: "rfc-5280#R-0208"
    object: 'DistributionPoint.distributionPoint'
    field: 'present when the certificate issuer is the CRL issuer'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'and MUST include the distributionPoint field.'
    kind: stated
    testable: partial
    testable_reason: 'requires knowing whether the certificate issuer is the CRL issuer'
    status: active
  - id: "rfc-5280#R-0209"
    object: 'DistributionPointName.fullName'
    field: 'URI semantics: pointer to the current CRL for the reasons, issued by cRLIssuer'
    verb: MUST
    actor: 'certificate user'
    locator: '§4.2.1.13'
    text: 'If the DistributionPointName contains a general name of type URI, the following semantics MUST be assumed: the URI is a pointer to the current CRL for the associated reasons and will be issued by the associated cRLIssuer.'
    kind: stated
    testable: partial
    testable_reason: 'semantic interpretation; observable only through retrieval behaviour'
    status: active
  - id: "rfc-5280#R-0210"
    object: 'DistributionPointName.fullName'
    field: 'HTTP/FTP URI resolves to a single DER encoded CRL'
    verb: MUST
    actor: 'CRL issuer / CA'
    locator: '§4.2.1.13'
    text: 'When the HTTP or FTP URI scheme is used, the URI MUST point to a single DER encoded CRL as specified in [RFC2585].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0211"
    object: 'CRL HTTP response'
    field: 'Content-Type application/pkix-crl'
    verb: SHOULD
    actor: 'HTTP server'
    locator: '§4.2.1.13'
    text: 'HTTP server implementations accessed via the URI SHOULD specify the media type application/pkix-crl in the content-type header field of the response.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0212"
    object: 'DistributionPointName.fullName'
    field: 'LDAP URI includes <dn>'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'When the LDAP URI scheme [RFC4516] is used, the URI MUST include a <dn> field containing the distinguished name of the entry holding the CRL,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0213"
    object: 'DistributionPointName.fullName'
    field: 'LDAP URI includes a single <attrdesc>'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'MUST include a single <attrdesc> that contains an appropriate attribute description for the attribute that holds the CRL [RFC4523],'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0214"
    object: 'DistributionPointName.fullName'
    field: 'LDAP URI includes <host>'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'and SHOULD include a <host> (e.g., <ldap://ldap.example.com/cn=example%20CA,dc=example,dc=com? certificateRevocationList;binary>).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0215"
    object: 'DistributionPointName'
    field: 'at least one LDAP or HTTP URI'
    verb: SHOULD
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'When present, DistributionPointName SHOULD include at least one LDAP or HTTP URI.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0216"
    object: 'DistributionPointName'
    field: 'nameRelativeToCRLIssuer not used'
    verb: SHOULD NOT
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'Conforming CAs SHOULD NOT use nameRelativeToCRLIssuer to specify distribution point names.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0217"
    object: 'DistributionPointName'
    field: 'no nameRelativeToCRLIssuer when cRLIssuer holds more than one DN'
    verb: MUST NOT
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'The DistributionPointName MUST NOT use the nameRelativeToCRLIssuer alternative when cRLIssuer contains more than one distinguished name.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0218"
    object: 'CRL'
    field: 'CRL pointed to without reasons covers all reasons'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§4.2.1.13'
    text: 'If the DistributionPoint omits the reasons field, the CRL MUST include revocation information for all reasons.'
    kind: stated
    testable: partial
    testable_reason: 'requires retrieving and inspecting the referenced CRL'
    status: active
  - id: "rfc-5280#R-0219"
    object: 'CRL'
    field: 'no segmentation by reason code (source wording: RECOMMENDS against)'
    verb: NOT RECOMMENDED
    actor: 'CRL issuer'
    locator: '§4.2.1.13'
    text: 'This profile RECOMMENDS against segmenting CRLs by reason code.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0220"
    object: 'cRLDistributionPoints extension'
    field: 'at least one DistributionPoint to a CRL covering all reasons'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'When a conforming CA includes a cRLDistributionPoints extension in a certificate, it MUST include at least one DistributionPoint that points to a CRL that covers the certificate for all reasons.'
    kind: stated
    testable: partial
    testable_reason: 'requires the referenced CRLs'' scope'
    status: active
  - id: "rfc-5280#R-0221"
    object: 'DistributionPoint.cRLIssuer'
    field: 'only the DN from the issuer field of the referenced CRL'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.13'
    text: 'If present, the cRLIssuer MUST only contain the distinguished name (DN) from the issuer field of the CRL to which the DistributionPoint is pointing.'
    kind: stated
    testable: partial
    testable_reason: 'requires the referenced CRL'
    status: active
  - id: "rfc-5280#R-0222"
    object: 'DistributionPoint.cRLIssuer'
    field: 'byte-identical encoding to the CRL issuer field'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.2.1.13'
