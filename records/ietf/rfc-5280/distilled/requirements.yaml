    field: 'presence requires version v2 or v3 (ASN.1 comment)'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1'
    text: '-- If present, version MUST be v2 or v3'
    kind: stated
    testable: yes
    status: active
