    field: 'optional unique identifier fields'
    verb: MAY
    actor: 'conforming CA'
    locator: '§4.1.2'
    text: 'Every TBSCertificate contains the names of the subject and issuer, a public key associated with the subject, a validity period, a version number, and a serial number; some MAY contain optional unique identifier fields.'
    kind: stated
    testable: partial
    testable_reason: 'the mandatory content is fixed by the ASN.1; the keyword is a permission whose exercise is further constrained by §4.1.2.8'
    status: active
  - id: "rfc-5280#R-0010"
    object: 'tbsCertificate.version'
    field: 'value 3 (encoded 2) when extensions are used'
    verb: MUST
    actor: 'conforming CA'
    locator: '§4.1.2.1'
    text: 'When extensions are used, as expected in this profile, version MUST be 3 (value is 2).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0011"
    object: 'tbsCertificate.version'
    field: 'value 2 (encoded 1) when no extensions but a UniqueIdentifier is present; 3 permitted'
    verb: SHOULD
    verbs:
      - SHOULD
      - MAY
    actor: 'conforming CA'
    locator: '§4.1.2.1'
    text: 'If no extensions are present, but a UniqueIdentifier is present, the version SHOULD be 2 (value is 1); however, the version MAY be 3.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0012"
