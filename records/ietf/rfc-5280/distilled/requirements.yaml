    field: 'presence in all CRLs'
    verb: MUST
    actor: 'conforming CRL issuers'
    locator: '§5.1.2.5'
    text: 'Conforming CRL issuers MUST include the nextUpdate field in all CRLs.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0281"
    object: 'TBSCertList.nextUpdate'
    field: 'UTCTime for dates through 2049'
    verb: MUST
    actor: 'CRL issuers conforming to this profile'
    locator: '§5.1.2.5'
    text: 'CRL issuers conforming to this profile MUST encode nextUpdate as UTCTime for dates through the year 2049.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0282"
    object: 'TBSCertList.nextUpdate'
    field: 'GeneralizedTime for dates in 2050 or later'
    verb: MUST
    actor: 'CRL issuers conforming to this profile'
    locator: '§5.1.2.5'
    text: 'CRL issuers conforming to this profile MUST encode nextUpdate as GeneralizedTime for dates in the year 2050 or later.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0283"
    object: 'TBSCertList.nextUpdate'
    field: 'processing of both UTCTime and GeneralizedTime'
    verb: MUST
    actor: 'conforming applications'
    locator: '§5.1.2.5'
    text: 'Conforming applications MUST be able to process dates that are encoded in either UTCTime or GeneralizedTime.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0284"
    object: 'TBSCertList.nextUpdate'
    field: 'UTCTime form specified and interpreted per §4.1.2.5.1'
    verb: MUST
    actor: 'CRL issuers and conforming applications'
    locator: '§5.1.2.5'
    text: 'Where encoded as UTCTime, nextUpdate MUST be specified and interpreted as defined in Section 4.1.2.5.1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0285"
    object: 'TBSCertList.nextUpdate'
    field: 'GeneralizedTime form specified and interpreted per §4.1.2.5.2'
    verb: MUST
    actor: 'CRL issuers and conforming applications'
    locator: '§5.1.2.5'
    text: 'Where encoded as GeneralizedTime, nextUpdate MUST be specified and interpreted as defined in Section 4.1.2.5.2.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0286"
    object: 'TBSCertList.revokedCertificates'
    field: 'absent when there are no revoked certificates'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.1.2.6'
    text: 'When there are no revoked certificates, the revoked certificates list MUST be absent.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0287"
    object: 'revokedCertificates.revocationDate'
    field: 'time encoding as in §5.1.2.4'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.1.2.6'
    text: 'The time for revocationDate MUST be expressed as described in Section 5.1.2.4.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0288"
    object: 'CRL extension'
    field: 'unprocessable critical extension: CRL not used for status'
    verb: MUST NOT
    actor: 'application'
    locator: '§5.2'
    text: 'If a CRL contains a critical extension that the application cannot process, then the application MUST NOT use that CRL to determine the status of certificates.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0289"
    object: 'CRL'
    field: 'authorityKeyIdentifier and cRLNumber extensions in all CRLs'
    verb: REQUIRED
    actor: 'conforming CRL issuers'
    locator: '§5.2'
    text: 'Conforming CRL issuers are REQUIRED to include the authority key identifier (Section 5.2.1) and the CRL number (Section 5.2.3) extensions in all CRLs issued.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0290"
    object: 'authorityKeyIdentifier extension'
    field: 'keyIdentifier method'
    verb: MUST
    actor: 'conforming CRL issuers'
    locator: '§5.2.1'
    text: 'Conforming CRL issuers MUST use the key identifier method,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0291"
    object: 'authorityKeyIdentifier extension'
    field: 'presence in all CRLs'
    verb: MUST
    actor: 'conforming CRL issuers'
    locator: '§5.2.1'
    text: 'and MUST include this extension in all CRLs issued.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0292"
    object: 'issuerAltName extension'
    field: 'use whenever alternative issuer identities are used'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.2'
    text: 'Whenever such identities are used, the issuer alternative name extension MUST be used;'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0293"
    object: 'TBSCertList.issuer'
    field: 'DNS name represented with domainComponent attributes'
    verb: MAY
    actor: 'CRL issuer'
    locator: '§5.2.2'
    text: 'however, a DNS name MAY be represented in the issuer field using the domainComponent attribute as described in Section 4.1.2.4.'
    kind: stated
    testable: partial
    testable_reason: 'permission; testable only as acceptance of a domainComponent-encoded issuer'
    status: active
  - id: "rfc-5280#R-0294"
    object: 'issuerAltName extension'
    field: 'criticality: non-critical'
    verb: SHOULD
    actor: 'conforming CRL issuers'
    locator: '§5.2.2'
    text: 'Conforming CRL issuers SHOULD mark the issuerAltName extension as non-critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0295"
    object: 'cRLNumber extension'
    field: 'presence in all CRLs'
    verb: MUST
    actor: 'CRL issuers conforming to this profile'
    locator: '§5.2.3'
    text: 'CRL issuers conforming to this profile MUST include this extension in all CRLs'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0296"
    object: 'cRLNumber extension'
    field: 'criticality: non-critical'
    verb: MUST
    actor: 'CRL issuers conforming to this profile'
    locator: '§5.2.3'
    text: 'and MUST mark this extension as non-critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0297"
    object: 'cRLNumber extension'
    field: 'one numbering sequence shared by complete and delta CRLs of a scope'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.3'
    text: 'If a CRL issuer generates delta CRLs in addition to complete CRLs for a given scope, the complete CRLs and delta CRLs MUST share one numbering sequence.'
    kind: stated
    testable: partial
    testable_reason: 'requires the issuer''s CRL history for the scope'
    status: active
  - id: "rfc-5280#R-0298"
    object: 'cRLNumber extension'
    field: 'simultaneously issued delta and complete CRL: same number and same revocation information'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.3'
    text: 'If a delta CRL and a complete CRL that cover the same scope are issued at the same time, they MUST have the same CRL number and provide the same revocation information.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0299"
    object: 'delta CRL'
    field: 'delta plus acceptable complete CRL equals the simultaneously issued complete CRL'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.3'
    text: 'That is, the combination of the delta CRL and an acceptable complete CRL MUST provide the same revocation information as the simultaneously issued complete CRL.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0300"
    object: 'cRLNumber extension'
    field: 'distinct numbers for CRLs of one scope issued at different times'
    verb: MUST NOT
    actor: 'CRL issuer'
    locator: '§5.2.3'
    text: 'If a CRL issuer generates two CRLs (two complete CRLs, two delta CRLs, or a complete CRL and a delta CRL) for the same scope at different times, the two CRLs MUST NOT have the same CRL number.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0301"
    object: 'cRLNumber extension'
    field: 'different thisUpdate implies different CRL number'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.3'
    text: 'That is, if the this update field (Section 5.1.2.4) in the two CRLs are not identical, the CRL numbers MUST be different.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0302"
    object: 'cRLNumber extension'
    field: 'handling of values up to 20 octets'
    verb: MUST
    actor: 'CRL verifiers'
    locator: '§5.2.3'
    text: 'CRL verifiers MUST be able to handle CRLNumber values up to 20 octets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0303"
    object: 'cRLNumber extension'
    field: 'value length at most 20 octets'
    verb: MUST NOT
    actor: 'conforming CRL issuers'
    locator: '§5.2.3'
    text: 'Conforming CRL issuers MUST NOT use CRLNumber values longer than 20 octets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0304"
    object: 'deltaCRLIndicator extension'
    field: 'referenced base CRL published as a complete CRL'
    verb: MUST
    actor: 'conforming CRL issuer'
    locator: '§5.2.4'
    text: 'A conforming CRL issuer MUST publish the referenced base CRL as a complete CRL.'
    kind: stated
    testable: partial
    testable_reason: 'publication is observable only by fetching the issuer''s repository'
    status: active
  - id: "rfc-5280#R-0305"
    object: 'deltaCRLIndicator extension'
    field: 'presence and criticality in every delta CRL'
    verb: MUST
    actor: 'conforming CRL issuer'
    locator: '§5.2.4'
    text: 'When a conforming CRL issuer generates a delta CRL, the delta CRL MUST include a critical delta CRL indicator extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0306"
    object: 'delta CRL'
    field: 'same reasons and same certificates as the referenced base CRL'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.4'
    text: 'When a delta CRL is issued, it MUST cover the same set of reasons and the same set of certificates that were covered by the base CRL it references.'
    kind: stated
    testable: partial
    testable_reason: 'the set of certificates covered depends on issuer scope policy; observable through issuingDistributionPoint'
    status: active
  - id: "rfc-5280#R-0307"
    object: 'delta CRL'
    field: 'scope equals that of the referenced complete (base) CRL'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.4'
    text: 'That is, the scope of the delta CRL MUST be the same as the scope of the complete CRL referenced as the base.'
    kind: stated
    testable: partial
    testable_reason: 'scope is partly local policy; observable through issuingDistributionPoint'
    status: active
  - id: "rfc-5280#R-0308"
    object: 'issuingDistributionPoint'
    field: 'omitted from both base and delta CRL, or identical in both'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.4'
    text: 'The referenced base CRL and the delta CRL MUST omit the issuing distribution point extension or contain identical issuing distribution point extensions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0309"
    object: 'delta CRL'
    field: 'signed with the same private key as any complete CRL it can update'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.4'
    text: 'Further, the CRL issuer MUST use the same private key to sign the delta CRL and any complete CRL that it can be used to update.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0310"
    object: 'delta CRL'
    field: 'combination with a complete CRL under conditions (a)-(d)'
    verb: MAY
    actor: 'application that supports delta CRLs'
    locator: '§5.2.4'
    text: 'A complete CRL and a delta CRL MAY be combined if the following four conditions are satisfied: (a)  The complete CRL and delta CRL have the same issuer. (b)  The complete CRL and delta CRL have the same scope.  The two CRLs have the same scope if either of the following conditions are met: (1)  The issuingDistributionPoint extension is omitted from both the complete CRL and the delta CRL. (2)  The issuingDistributionPoint extension is present in both the complete CRL and the delta CRL, and the values for each of the fields in the extensions are the same in both CRLs. (c)  The CRL number of the complete CRL is equal to or greater than the BaseCRLNumber specified in the delta CRL.  That is, the complete CRL contains (at a minimum) all the revocation information held by the referenced base CRL. (d)  The CRL number of the complete CRL is less than the CRL number of the delta CRL.  That is, the delta CRL follows the complete CRL in the numbering sequence.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0311"
    object: 'delta CRL'
    field: 'combination with an appropriate complete CRL reflects current revocation status'
    verb: MUST
    actor: 'CRL issuers'
    locator: '§5.2.4'
    text: 'CRL issuers MUST ensure that the combination of a delta CRL and any appropriate complete CRL accurately reflects the current revocation status.'
    kind: stated
    testable: partial
    testable_reason: '\"current revocation status\" is the issuer''s internal state; testable only against a reference model of it'
    status: active
  - id: "rfc-5280#R-0312"
    object: 'delta CRL'
    field: 'entries for every in-scope certificate whose status changed since the base CRL, per rules (a)-(d)'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.4'
    text: 'The CRL issuer MUST include an entry in the delta CRL for each certificate within the scope of the delta CRL whose status has changed since the generation of the referenced base CRL: (a)  If the certificate is revoked for a reason included in the scope of the CRL, list the certificate as revoked. (b)  If the certificate is valid and was listed on the referenced base CRL or any subsequent CRL with reason code certificateHold, and the reason code certificateHold is included in the scope of the CRL, list the certificate with the reason code removeFromCRL. (c)  If the certificate is revoked for a reason outside the scope of the CRL, but the certificate was listed on the referenced base CRL or any subsequent CRL with a reason code included in the scope of this CRL, list the certificate as revoked but omit the reason code. (d)  If the certificate is revoked for a reason outside the scope of the CRL and the certificate was neither listed on the referenced base CRL nor any subsequent CRL with a reason code included in the scope of this CRL, do not list the certificate on this CRL.'
    kind: stated
    testable: partial
    testable_reason: 'requires the issuer''s status history since the base CRL; testable against a scripted issuance sequence'
    status: active
  - id: "rfc-5280#R-0313"
    object: 'delta CRL'
    field: 'certificate placed on hold and released after the base: listed with removeFromCRL'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.4'
    text: 'If the certificate was placed on hold in any CRL issued after the base but before this delta CRL and then released from hold, it MUST be listed on the delta CRL with revocation reason removeFromCRL.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0314"
    object: 'delta CRL'
    field: 'removeFromCRL listing for an expired certificate previously listed'
    verb: MAY
    actor: 'CRL issuer'
    locator: '§5.2.4'
    text: 'A CRL issuer MAY optionally list a certificate on a delta CRL with reason code removeFromCRL if the notAfter time specified in the certificate precedes the thisUpdate time specified in the delta CRL and the certificate was listed on the referenced base CRL or in any CRL issued after the base but before this delta CRL.'
    kind: stated
    testable: partial
    testable_reason: 'permission; testable only as the bound on when removeFromCRL for expiry is allowed'
    status: active
  - id: "rfc-5280#R-0315"
    object: 'delta CRL'
    field: 'revocation notice first on a delta CRL repeated on all subsequent deltas until on a complete CRL'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.4'
    text: 'In this case, the revocation notice MUST be included in all subsequent delta CRLs until the revocation notice is included on at least one explicitly issued complete CRL for this scope.'
    kind: stated
    testable: partial
    testable_reason: 'requires a sequence of delta and complete CRLs for the scope'
    status: active
  - id: "rfc-5280#R-0316"
    object: 'delta CRL'
    field: 'construction of a current complete CRL from an issued complete CRL plus the most current delta'
    verb: MUST
    actor: 'application that supports delta CRLs'
    locator: '§5.2.4'
    text: 'An application that supports delta CRLs MUST be able to construct a current complete CRL by combining a previously issued complete CRL and the most current delta CRL.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0317"
    object: 'delta CRL'
    field: 'construction of a current complete CRL from a locally constructed complete CRL plus the current delta'
    verb: MAY
    actor: 'application that supports delta CRLs'
    locator: '§5.2.4'
    text: 'An application that supports delta CRLs MAY also be able to construct a current complete CRL by combining a previously locally constructed complete CRL and the current delta CRL.'
    kind: stated
    testable: partial
    testable_reason: 'optional capability; testable only where the application claims it'
    status: active
  - id: "rfc-5280#R-0318"
    object: 'delta CRL'
    field: 'selection among several current deltas: latest thisUpdate'
    verb: SHOULD
    actor: 'application'
    locator: '§5.2.4'
    text: 'If more than one current delta CRL for a given scope is encountered, the application SHOULD consider the one with the latest value in thisUpdate to be the most current one.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0319"
    object: 'issuingDistributionPoint'
    field: 'implementations not supporting the extension: status unknown or find another CRL'
    verb: MUST
    actor: 'implementations that do not support this extension'
    locator: '§5.2.5'
    text: 'However, implementations that do not support this extension MUST either treat the status of any certificate not listed on this CRL as unknown or locate another CRL that does not contain any unrecognized critical extensions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0320"
    object: 'issuingDistributionPoint.onlySomeReasons'
    field: 'reason codes of a distribution point carried in onlySomeReasons'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'The reason codes associated with a distribution point MUST be specified in onlySomeReasons.'
    kind: stated
    testable: partial
    testable_reason: 'the reasons \"associated with\" a distribution point are issuer configuration, not visible in the CRL alone'
    status: active
  - id: "rfc-5280#R-0321"
    object: 'issuingDistributionPoint.onlySomeReasons'
    field: 'absent: CRL covers all reason codes'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'If onlySomeReasons does not appear, the distribution point MUST contain revocations for all reason codes.'
    kind: stated
    testable: partial
    testable_reason: 'completeness requires the issuer''s revocation database'
    status: active
  - id: "rfc-5280#R-0322"
    object: 'issuingDistributionPoint.onlySomeReasons'
    field: 'present: every revoked in-scope certificate assigned a reason other than unspecified'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'If a CRL includes an issuingDistributionPoint extension with onlySomeReasons present, then every certificate in the scope of the CRL that is revoked MUST be assigned a revocation reason other than unspecified.'
    kind: stated
    testable: partial
    testable_reason: 'the assigned reason need not appear in the CRL entry, so it is not always observable'
    status: active
  - id: "rfc-5280#R-0323"
    object: 'issuingDistributionPoint.distributionPoint'
    field: 'includes at least one name from each in-scope certificate''s cRLDistributionPoints distributionPoint'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'If the distributionPoint field is present, then it MUST include at least one of names from the corresponding distributionPoint field of the cRLDistributionPoints extension of every certificate that is within the scope of this CRL.'
    kind: stated
    testable: partial
    testable_reason: 'requires the set of all certificates in scope'
    status: active
  - id: "rfc-5280#R-0324"
    object: 'issuingDistributionPoint.distributionPoint'
    field: 'identical encoding in certificate and CRL'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'The identical encoding MUST be used in the distributionPoint fields of the certificate and the CRL.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0325"
    object: 'issuingDistributionPoint.distributionPoint'
    field: 'absent: CRL lists all revoked unexpired certificates of the issuer within scope'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'If the distributionPoint field is absent, the CRL MUST contain entries for all revoked unexpired certificates issued by the CRL issuer, if any, within the scope of the CRL.'
    kind: stated
    testable: partial
    testable_reason: 'completeness requires the issuer''s revocation database'
    status: active
  - id: "rfc-5280#R-0326"
    object: 'issuingDistributionPoint.indirectCRL'
    field: 'FALSE when scope is only the CRL issuer''s own certificates'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'If the scope of the CRL only includes certificates issued by the CRL issuer, then the indirectCRL boolean MUST be set to FALSE.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0327"
    object: 'issuingDistributionPoint.indirectCRL'
    field: 'TRUE when scope includes certificates of other authorities'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'Otherwise, if the scope of the CRL includes certificates issued by one or more authorities other than the CRL issuer, the indirectCRL boolean MUST be set to TRUE.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0328"
    object: 'issuingDistributionPoint.onlyContainsUserCerts'
    field: 'TRUE when scope is only end entity certificates'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'If the scope of the CRL only includes end entity public key certificates, then onlyContainsUserCerts MUST be set to TRUE.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0329"
    object: 'issuingDistributionPoint.onlyContainsCACerts'
    field: 'TRUE when scope is only CA certificates'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'If the scope of the CRL only includes CA certificates, then onlyContainsCACerts MUST be set to TRUE.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0330"
    object: 'issuingDistributionPoint'
    field: 'onlyContainsUserCerts or onlyContainsCACerts TRUE excludes v1 and v2 certificates from scope'
    verb: MUST NOT
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'If either onlyContainsUserCerts or onlyContainsCACerts is set to TRUE, then the scope of the CRL MUST NOT include any version 1 or version 2 certificates.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0331"
    object: 'issuingDistributionPoint.onlyContainsAttributeCerts'
    field: 'value FALSE'
    verb: MUST
    actor: 'conforming CRL issuers'
    locator: '§5.2.5'
    text: 'Conforming CRLs issuers MUST set the onlyContainsAttributeCerts boolean to FALSE.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0332"
    object: 'issuingDistributionPoint'
    field: 'DER encoding not an empty sequence'
    verb: MUST NOT
    actor: 'conforming CRL issuers'
    locator: '§5.2.5'
    text: 'Conforming CRLs issuers MUST NOT issue CRLs where the DER encoding of the issuing distribution point extension is an empty sequence.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0333"
    object: 'issuingDistributionPoint'
    field: 'all booleans FALSE: distributionPoint or onlySomeReasons present'
    verb: MUST
    actor: 'conforming CRL issuers'
    locator: '§5.2.5'
    text: 'That is, if onlyContainsUserCerts, onlyContainsCACerts, indirectCRL, and onlyContainsAttributeCerts are all FALSE, then either the distributionPoint field or the onlySomeReasons field MUST be present.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0334"
    object: 'issuingDistributionPoint'
    field: 'at most one of onlyContainsUserCerts, onlyContainsCACerts, onlyContainsAttributeCerts TRUE'
    verb: MUST NOT
    actor: 'CRL issuer'
    locator: '§5.2.5'
    text: 'at most one of the three only-contains booleans may be true (lowercase constraint in an ASN.1 comment)'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-5280#R-0335"
    object: 'freshestCRL extension'
    field: 'criticality: non-critical'
    verb: MUST
    actor: 'conforming CRL issuers'
    locator: '§5.2.6'
    text: 'Conforming CRL issuers MUST mark this extension as non-critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0336"
    object: 'freshestCRL extension'
    field: 'absent from delta CRLs'
    verb: MUST NOT
    actor: 'CRL issuer'
    locator: '§5.2.6'
    text: 'This extension MUST NOT appear in delta CRLs.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0337"
    object: 'freshestCRL extension'
    field: 'reasons and cRLIssuer fields omitted'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.6'
    text: 'The reasons and cRLIssuer fields MUST be omitted from this CRL extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0338"
    object: 'freshestCRL extension'
    field: 'scope of referenced delta CRLs equals scope of this complete CRL'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.6'
    text: 'The scope of these delta CRLs MUST be the same as the scope of this complete CRL.'
    kind: stated
    testable: partial
    testable_reason: 'requires fetching the referenced delta CRLs; scope is partly local policy'
    status: active
  - id: "rfc-5280#R-0339"
    object: 'authorityInfoAccess CRL extension'
    field: 'criticality: non-critical'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'This CRL extension MUST be marked as non-critical.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0340"
    object: 'authorityInfoAccess CRL extension'
    field: 'at least one AccessDescription with accessMethod id-ad-caIssuers'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'When present in a CRL, this extension MUST include at least one AccessDescription specifying id-ad-caIssuers as the accessMethod.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0341"
    object: 'authorityInfoAccess CRL extension'
    field: 'access methods other than id-ad-caIssuers excluded'
    verb: MUST NOT
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'Access method types other than id-ad-caIssuers MUST NOT be included.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0342"
    object: 'authorityInfoAccess CRL extension'
    field: 'at least one accessLocation is an HTTP or LDAP URI'
    verb: SHOULD
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'At least one instance of AccessDescription SHOULD specify an accessLocation that is an HTTP [RFC2616] or LDAP [RFC4516] URI.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0343"
    object: 'AccessDescription.accessLocation'
    field: 'uniformResourceIdentifier for HTTP or FTP'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'Where the information is available via HTTP or FTP, accessLocation MUST be a uniformResourceIdentifier'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0344"
    object: 'AccessDescription.accessLocation'
    field: 'HTTP/FTP URI target: single DER certificate or certs-only CMS message'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'and the URI MUST point to either a single DER encoded certificate as specified in [RFC2585] or a collection of certificates in a BER or DER encoded "certs-only" CMS message as specified in [RFC2797].'
    kind: stated
    testable: partial
    testable_reason: 'requires dereferencing the URI'
    status: active
  - id: "rfc-5280#R-0345"
    object: 'AccessDescription.accessLocation'
    field: 'acceptance of individual DER encoded certificates over HTTP or FTP'
    verb: MUST
    actor: 'conforming applications that support HTTP or FTP for accessing certificates'
    locator: '§5.2.7'
    text: 'Conforming applications that support HTTP or FTP for accessing certificates MUST be able to accept individual DER encoded certificates'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0346"
    object: 'AccessDescription.accessLocation'
    field: 'acceptance of certs-only CMS messages over HTTP or FTP'
    verb: SHOULD
    actor: 'conforming applications that support HTTP or FTP for accessing certificates'
    locator: '§5.2.7'
    text: 'and SHOULD be able to accept "certs-only" CMS messages.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0347"
    object: 'HTTP response'
    field: 'content-type application/pkix-cert for a single DER certificate'
    verb: SHOULD
    actor: 'HTTP server implementations accessed via the URI'
    locator: '§5.2.7'
    text: 'HTTP server implementations accessed via the URI SHOULD specify the media type application/pkix-cert [RFC2585] in the content-type header field of the response for a single DER encoded certificate'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0348"
    object: 'HTTP response'
    field: 'content-type application/pkcs7-mime for a certs-only CMS message'
    verb: SHOULD
    actor: 'HTTP server implementations accessed via the URI'
    locator: '§5.2.7'
    text: 'and SHOULD specify the media type application/pkcs7-mime [RFC2797] in the content-type header field of the response for "certs-only" CMS messages.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0349"
    object: 'FTP file name'
    field: 'suffix .cer for a single DER certificate'
    verb: SHOULD
    actor: 'FTP server operator'
    locator: '§5.2.7'
    text: 'For FTP, the name of a file that contains a single DER encoded certificate SHOULD have a suffix of ".cer" [RFC2585]'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0350"
    object: 'FTP file name'
    field: 'suffix .p7c for a certs-only CMS message'
    verb: SHOULD
    actor: 'FTP server operator'
    locator: '§5.2.7'
    text: 'and the name of a file that contains a "certs-only" CMS message SHOULD have a suffix of ".p7c" [RFC2797].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0351"
    object: 'AccessDescription.accessLocation'
    field: 'directoryName: certificate looked up in crossCertificatePair, cACertificate and userCertificate'
    verb: MUST
    actor: 'implementations that support the directoryName form of accessLocation'
    locator: '§5.2.7'
    text: 'Thus, implementations that support the directoryName form of accessLocation MUST be prepared to find the needed certificate in any of these three attributes.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0352"
    object: 'AccessDescription.accessLocation'
    field: 'uniformResourceIdentifier for LDAP'
    verb: SHOULD
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'Where the information is available via LDAP, the accessLocation SHOULD be a uniformResourceIdentifier.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0353"
    object: 'LDAP URI'
    field: '<dn> field naming the entry holding the certificates'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'The LDAP URI [RFC4516] MUST include a <dn> field containing the distinguished name of the entry holding the certificates,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0354"
    object: 'LDAP URI'
    field: '<attributes> field listing the certificate-holding attributes'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'MUST include an <attributes> field that lists appropriate attribute descriptions for the attributes that hold the DER encoded certificates or cross-certificate pairs [RFC4523],'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0355"
    object: 'LDAP URI'
    field: '<host> component'
    verb: SHOULD
    actor: 'CRL issuer'
    locator: '§5.2.7'
    text: 'and SHOULD include a <host> (e.g., <ldap://ldap.example.com/cn=CA, dc=example,dc=com?cACertificate;binary,crossCertificatePair;binary>).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0356"
    object: 'CRL entry extension'
    field: 'unprocessable critical entry extension: CRL not used for status'
    verb: MUST NOT
    actor: 'application'
    locator: '§5.3'
    text: 'If a CRL contains a critical CRL entry extension that the application cannot process, then the application MUST NOT use that CRL to determine the status of any certificates.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0357"
    object: 'CRL entry extension'
    field: 'reasonCode and invalidityDate included whenever the information is available'
    verb: SHOULD
    actor: 'CRL issuers'
    locator: '§5.3'
    text: 'However, CRL issuers SHOULD include reason codes (Section 5.3.1) and invalidity dates (Section 5.3.2) whenever this information is available.'
    kind: stated
    testable: partial
    testable_reason: 'availability of the information is internal to the issuer'
    status: active
  - id: "rfc-5280#R-0358"
    object: 'reasonCode CRL entry extension'
    field: 'absent rather than unspecified (0)'
    verb: SHOULD
    actor: 'CRL issuers'
    locator: '§5.3.1'
    text: 'CRL issuers are strongly encouraged to include meaningful reason codes in CRL entries; however, the reason code CRL entry extension SHOULD be absent instead of using the unspecified (0) reasonCode value.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0359"
    object: 'reasonCode CRL entry extension'
    field: 'removeFromCRL (8) only on delta CRLs'
    verb: MUST NOT
    actor: 'CRL issuer'
    locator: '§5.3.1'
    text: 'the removeFromCRL reason code appears only in delta CRLs, never in a complete CRL (lowercase "may only appear")'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-5280#R-0360"
    object: 'revokedCertificates.revocationDate'
    field: 'not earlier than the issue date of earlier CRLs when first posted'
    verb: SHOULD NOT
    actor: 'CRL issuer'
    locator: '§5.3.2'
    text: 'When a revocation is first posted by a CRL issuer in a CRL, the invalidity date may precede the date of issue of earlier CRLs, but the revocation date SHOULD NOT precede the date of issue of earlier CRLs.'
    kind: stated
    testable: partial
    testable_reason: 'requires the issuer''s earlier CRLs'
    status: active
  - id: "rfc-5280#R-0361"
    object: 'invalidityDate CRL entry extension'
    field: 'GeneralizedTime expressed in GMT (Zulu)'
    verb: MUST
    actor: 'CRL issuer'
    locator: '§5.3.2'
    text: 'The GeneralizedTime values included in this field MUST be expressed in Greenwich Mean Time (Zulu),'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0362"
    object: 'invalidityDate CRL entry extension'
    field: 'specified and interpreted per §4.1.2.5.2'
    verb: MUST
    actor: 'CRL issuers and conforming applications'
    locator: '§5.3.2'
    text: 'and MUST be specified and interpreted as defined in Section 4.1.2.5.2.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0363"
    object: 'certificateIssuer CRL entry extension'
    field: 'includes the issuer DN of the certificate the entry corresponds to'
    verb: MUST
    actor: 'conforming CRL issuers'
    locator: '§5.3.3'
    text: 'Conforming CRL issuers MUST include in this extension the distinguished name (DN) from the issuer field of the certificate that corresponds to this CRL entry.'
    kind: stated
    testable: partial
    testable_reason: 'requires the revoked certificate to compare against'
    status: active
  - id: "rfc-5280#R-0364"
    object: 'certificateIssuer CRL entry extension'
    field: 'DN encoding identical to the certificate''s'
    verb: MUST
    actor: 'conforming CRL issuers'
    locator: '§5.3.3'
    text: 'The encoding of the DN MUST be identical to the encoding used in the certificate.'
    kind: stated
    testable: partial
    testable_reason: 'requires the revoked certificate to compare against'
    status: active
  - id: "rfc-5280#R-0365"
    object: 'certificateIssuer CRL entry extension'
    field: 'criticality: critical'
    verb: MUST
    actor: 'CRL issuers'
    locator: '§5.3.3'
    text: 'CRL issuers MUST mark this extension as critical since an implementation that ignored this extension could not correctly attribute CRL entries to certificates.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0366"
    object: 'certificateIssuer CRL entry extension'
    field: 'recognition by implementations'
    verb: RECOMMENDED
    actor: 'implementations'
    locator: '§5.3.3'
    text: 'This specification RECOMMENDS that implementations recognize this extension.'
    kind: stated
    testable: yes
    note: 'Source uses the non-RFC 2119 form RECOMMENDS; treated as RECOMMENDED. bin/_bcp14.py does not count it (trailing letter), so it adds 0 to the keyword count.'
    status: active
  - id: "rfc-5280#R-0367"
    object: 'path validation'
    field: 'functional equivalence to the external behaviour of the §6 algorithm'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§6'
    text: 'Conforming implementations of this specification are not required to implement this algorithm, but MUST provide functionality equivalent to the external behavior resulting from this procedure.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0368"
    object: 'path validation'
    field: 'inclusion of an X.509 path processing procedure functionally equivalent to the §6.1 algorithm'
    verb: MUST
    actor: 'conforming implementation'
    locator: '§6.1'
    text: 'A conforming implementation MUST include an X.509 path processing procedure that is functionally equivalent to the external behavior of this algorithm.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0369"
    object: 'path validation'
    field: 'support for some certificate extensions processed by the algorithm'
    verb: OPTIONAL
    actor: 'compliant implementations'
    locator: '§6.1'
    text: 'However, support for some of the certificate extensions processed in this algorithm are OPTIONAL for compliant implementations.'
    kind: stated
    testable: no
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-5280#R-0370"
    object: 'path validation'
    field: 'omission of steps for unsupported extensions'
    verb: MAY
    actor: 'clients'
    locator: '§6.1'
    text: 'Clients that do not support these extensions MAY omit the corresponding steps in the path validation algorithm.'
    kind: stated
    testable: no
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-5280#R-0371"
    object: 'path validation'
    field: 'omission of policy-mapping steps when policy mappings extension unsupported'
    verb: MAY
    actor: 'clients'
    locator: '§6.1'
    text: 'Clients that do not support this extension MAY omit the path validation steps where policy mappings are processed.'
    kind: stated
    testable: no
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-5280#R-0372"
    object: 'path validation'
    field: 'rejection of certificate containing an unsupported critical extension'
    verb: MUST
    actor: 'clients'
    locator: '§6.1'
    text: 'Note that clients MUST reject the certificate if it contains an unsupported critical extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0373"
    object: 'path validation'
    field: 'profile-conformance checks (Sections 4 and 5) inside path validation; stated with the non-BCP-14 form ''RECOMMENDS'''
    verb: NOT RECOMMENDED
    actor: 'path validation implementations'
    locator: '§6.1'
    text: 'While the algorithm could be extended to include checks for conformance to the profiles in Sections 4 and 5, this profile RECOMMENDS against including such checks.'
    kind: stated
    testable: partial
    testable_reason: 'advice against adding checks; an implementation that adds them is observable only by accepting fewer paths'
    status: active
  - id: "rfc-5280#R-0374"
    object: 'path validation'
    field: 'validation with respect to a point in the past'
    verb: MAY
    actor: 'conforming implementation'
    locator: '§6.1'
    text: 'A conforming implementation MAY also support validation with respect to some point in the past.'
    kind: stated
    testable: no
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-5280#R-0375"
    object: 'path validation'
    field: 'use of different trust anchors for different paths'
    verb: MAY
    actor: 'relying party'
    locator: '§6.1'
    text: 'Different trust anchors MAY be used to validate different paths, as discussed further in Section 6.2.'
    kind: stated
    testable: no
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-5280#R-0376"
    object: 'prospective certification path'
    field: 'name chaining: subject of certificate x is issuer of certificate x+1'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1(a)'
    text: 'for all x in {1, ..., n-1}, the subject of certificate x is the issuer of certificate x+1;'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0377"
    object: 'prospective certification path'
    field: 'first certificate issued by the trust anchor'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1(b)'
    text: 'certificate 1 is issued by the trust anchor;'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0378"
    object: 'prospective certification path'
    field: 'last certificate is the target certificate'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1(c)'
    text: 'certificate n is the certificate to be validated (i.e., the target certificate); and'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0379"
    object: 'prospective certification path'
    field: 'every certificate valid at the time in question'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1(d)'
    text: 'for all x in {1, ..., n}, the certificate was valid at the time in question.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0380"
    object: 'prospective certification path'
    field: 'repetition of a certificate within the path'
    verb: MUST NOT
    actor: 'conforming implementations (path construction and validation)'
    locator: '§6.1'
    text: 'A certificate MUST NOT appear more than once in a prospective certification path.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0381"
    object: 'prospective certification path'
    field: 'exclusion of a self-signed trust anchor certificate from the path'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1'
    text: 'When the trust anchor is provided in the form of a self-signed certificate, this self-signed certificate is not included as part of the prospective certification path.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0382"
    object: 'path validation'
    field: 'application-specific further limitation of valid paths'
    verb: MAY
    actor: 'application'
    locator: '§6.1'
    text: 'Therefore, an application MAY augment this algorithm to further limit the set of valid paths.'
    kind: stated
    testable: no
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-5280#R-0383"
    object: 'certificate'
    field: 'definition of self-issued (subject DN matches issuer DN per §7.1)'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1'
    text: 'A certificate is self-issued if the same DN appears in the subject and issuer fields (the two DNs are the same if they match according to the rules specified in Section 7.1).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0384"
    object: 'path validation'
    field: 'self-issued certificates excluded from path length and name constraint evaluation'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1'
    text: 'These self-issued certificates are not counted when evaluating path length or name constraints.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0385"
    object: 'path validation'
    field: 'control structure: which of the four steps run for which certificates'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1'
    text: 'Steps (1) and (4) are performed exactly once. Step (2) is performed for all certificates in the path. Step (3) is performed for all certificates in the path except the final certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0386"
    object: 'path validation input'
    field: 'prospective certification path of length n'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(a)'
    text: 'a prospective certification path of length n.'
    kind: stated
    testable: partial
    testable_reason: 'input definition; constrains the validator''s interface and is observable only through the outputs of the algorithm'
    status: active
  - id: "rfc-5280#R-0387"
    object: 'path validation input'
    field: 'current date/time'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(b)'
    text: 'the current date/time.'
    kind: stated
    testable: partial
    testable_reason: 'input definition; constrains the validator''s interface and is observable only through the outputs of the algorithm'
    status: active
  - id: "rfc-5280#R-0388"
    object: 'path validation input'
    field: 'user-initial-policy-set'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(c)'
    text: 'user-initial-policy-set: A set of certificate policy identifiers naming the policies that are acceptable to the certificate user. The user-initial-policy-set contains the special value any-policy if the user is not concerned about certificate policy.'
    kind: stated
    testable: partial
    testable_reason: 'input definition; constrains the validator''s interface and is observable only through the outputs of the algorithm'
    status: active
  - id: "rfc-5280#R-0389"
    object: 'path validation input'
    field: 'trust anchor information: name, public key algorithm, public key, optional parameters'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(d)'
    text: 'trust anchor information, describing a CA that serves as a trust anchor for the certification path. The trust anchor information includes: (1) the trusted issuer name, (2) the trusted public key algorithm, (3) the trusted public key, and (4) optionally, the trusted public key parameters associated with the public key.'
    kind: stated
    testable: partial
    testable_reason: 'input definition; constrains the validator''s interface and is observable only through the outputs of the algorithm'
    status: active
  - id: "rfc-5280#R-0390"
    object: 'path validation input'
    field: 'trust anchor supplied as a self-signed certificate: which fields supply which trust anchor items'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(d)'
    text: 'The trust anchor information may be provided to the path processing procedure in the form of a self-signed certificate. When the trust anchor information is provided in the form of a certificate, the name in the subject field is used as the trusted issuer name and the contents of the subjectPublicKeyInfo field is used as the source of the trusted public key algorithm and the trusted public key. The trust anchor information is trusted because it was delivered to the path processing procedure by some trustworthy out-of-band procedure. If the trusted public key algorithm requires parameters, then the parameters are provided along with the trusted public key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0391"
    object: 'path validation input'
    field: 'initial-policy-mapping-inhibit'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(e)'
    text: 'initial-policy-mapping-inhibit, which indicates if policy mapping is allowed in the certification path.'
    kind: stated
    testable: partial
    testable_reason: 'input definition; constrains the validator''s interface and is observable only through the outputs of the algorithm'
    status: active
  - id: "rfc-5280#R-0392"
    object: 'path validation input'
    field: 'initial-explicit-policy'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(f)'
    text: 'initial-explicit-policy, which indicates if the path must be valid for at least one of the certificate policies in the user-initial-policy-set.'
    kind: stated
    testable: partial
    testable_reason: 'input definition; constrains the validator''s interface and is observable only through the outputs of the algorithm'
    status: active
  - id: "rfc-5280#R-0393"
    object: 'path validation input'
    field: 'initial-any-policy-inhibit'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(g)'
    text: 'initial-any-policy-inhibit, which indicates whether the anyPolicy OID should be processed if it is included in a certificate.'
    kind: stated
    testable: partial
    testable_reason: 'input definition; constrains the validator''s interface and is observable only through the outputs of the algorithm'
    status: active
  - id: "rfc-5280#R-0394"
    object: 'initial-permitted-subtrees'
    field: 'every subject name in every certificate of the path falls within the permitted subtrees'
    verb: MUST
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(h)'
    text: 'initial-permitted-subtrees, which indicates for each name type (e.g., X.500 distinguished names, email addresses, or IP addresses) a set of subtrees within which all subject names in every certificate in the certification path MUST fall.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0395"
    object: 'initial-permitted-subtrees'
    field: 'per-name-type set; an empty set for a name type invalidates any path containing that name type'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(h)'
    text: 'The initial-permitted-subtrees input includes a set for each name type. For each name type, the set may consist of a single subtree that includes all names of that name type or one or more subtrees that each specifies a subset of the names of that name type, or the set may be empty. If the set for a name type is empty, then the certification path will be considered invalid if any certificate in the certification path includes a name of that name type.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0396"
    object: 'initial-excluded-subtrees'
    field: 'per-name-type excluded subtrees; empty set excludes nothing'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.1(i)'
    text: 'initial-excluded-subtrees, which indicates for each name type (e.g., X.500 distinguished names, email addresses, or IP addresses) a set of subtrees within which no subject name in any certificate in the certification path may fall. The initial-excluded-subtrees input includes a set for each name type. For each name type, the set may be empty or may consist of one or more subtrees that each specifies a subset of the names of that name type. If the set for a name type is empty, then no names of that name type are excluded.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0397"
    object: 'path validation input'
    field: 'support for setting every input is not required'
    verb: none
    actor: 'conforming implementations'
    locator: '§6.1.1'
    text: 'Conforming implementations are not required to support the setting of all of these inputs.'
    kind: stated
    testable: no
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-5280#R-0398"
    object: 'valid_policy_tree'
    field: 'definition; depth equals certificates processed; NULL once no valid policies, after which policy processing ceases'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(a)'
    text: 'valid_policy_tree: A tree of certificate policies with their optional qualifiers; each of the leaves of the tree represents a valid policy at this stage in the certification path validation. If valid policies exist at this stage in the certification path validation, the depth of the tree is equal to the number of certificates in the chain that have been processed. If valid policies do not exist at this stage in the certification path validation, the tree is set to NULL. Once the tree is set to NULL, policy processing ceases.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0399"
    object: 'valid_policy_tree'
    field: 'node structure: valid_policy, qualifier_set, expected_policy_set'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(a)'
    text: 'Each node in the valid_policy_tree includes three data objects: the valid policy, a set of associated policy qualifiers, and a set of one or more expected policy values. If the node is at depth x, the components of the node have the following semantics:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0400"
    object: 'valid_policy_tree node'
    field: 'valid_policy'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(a)(1)'
    text: 'The valid_policy is a single policy OID representing a valid policy for the path of length x.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0401"
    object: 'valid_policy_tree node'
    field: 'qualifier_set'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(a)(2)'
    text: 'The qualifier_set is a set of policy qualifiers associated with the valid policy in certificate x.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0402"
    object: 'valid_policy_tree node'
    field: 'expected_policy_set'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(a)(3)'
    text: 'The expected_policy_set contains one or more policy OIDs that would satisfy this policy in the certificate x+1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0403"
    object: 'valid_policy_tree'
    field: 'initial value: single depth-0 node {anyPolicy, {}, {anyPolicy}}'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(a)'
    text: 'The initial value of the valid_policy_tree is a single node with valid_policy anyPolicy, an empty qualifier_set, and an expected_policy_set with the single value anyPolicy. This node is considered to be at depth zero.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0404"
    object: 'permitted_subtrees'
    field: 'subject names in subsequent certificates fall within the permitted subtrees'
    verb: MUST
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(b)'
    text: 'permitted_subtrees: a set of root names for each name type (e.g., X.500 distinguished names, email addresses, or IP addresses) defining a set of subtrees within which all subject names in subsequent certificates in the certification path MUST fall.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0405"
    object: 'permitted_subtrees'
    field: 'per-name-type set; initial value initial-permitted-subtrees'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(b)'
    text: 'This variable includes a set for each name type, and the initial value is initial-permitted-subtrees.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0406"
    object: 'excluded_subtrees'
    field: 'definition; initial value initial-excluded-subtrees'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(c)'
    text: 'excluded_subtrees: a set of root names for each name type (e.g., X.500 distinguished names, email addresses, or IP addresses) defining a set of subtrees within which no subject name in subsequent certificates in the certification path may fall. This variable includes a set for each name type, and the initial value is initial-excluded-subtrees.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0407"
    object: 'explicit_policy'
    field: 'definition; monotonically non-increasing; initial 0 if initial-explicit-policy set, else n+1'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(d)'
    text: 'explicit_policy: an integer that indicates if a non-NULL valid_policy_tree is required. The integer indicates the number of non-self-issued certificates to be processed before this requirement is imposed. Once set, this variable may be decreased, but may not be increased. That is, if a certificate in the path requires a non-NULL valid_policy_tree, a later certificate cannot remove this requirement. If initial-explicit-policy is set, then the initial value is 0, otherwise the initial value is n+1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0408"
    object: 'inhibit_anyPolicy'
    field: 'definition; monotonically non-increasing; initial 0 if initial-any-policy-inhibit set, else n+1'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(e)'
    text: 'inhibit_anyPolicy: an integer that indicates whether the anyPolicy policy identifier is considered a match. The integer indicates the number of non-self-issued certificates to be processed before the anyPolicy OID, if asserted in a certificate other than an intermediate self-issued certificate, is ignored. Once set, this variable may be decreased, but may not be increased. That is, if a certificate in the path inhibits processing of anyPolicy, a later certificate cannot permit it. If initial-any-policy-inhibit is set, then the initial value is 0, otherwise the initial value is n+1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0409"
    object: 'policy_mapping'
    field: 'definition; monotonically non-increasing; initial 0 if initial-policy-mapping-inhibit set, else n+1'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(f)'
    text: 'policy_mapping: an integer that indicates if policy mapping is permitted. The integer indicates the number of non-self-issued certificates to be processed before policy mapping is inhibited. Once set, this variable may be decreased, but may not be increased. That is, if a certificate in the path specifies that policy mapping is not permitted, it cannot be overridden by a later certificate. If initial-policy-mapping-inhibit is set, then the initial value is 0, otherwise the initial value is n+1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0410"
    object: 'working_public_key_algorithm'
    field: 'definition; initialised from the trusted public key algorithm'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(g)'
    text: 'working_public_key_algorithm: the digital signature algorithm used to verify the signature of a certificate. The working_public_key_algorithm is initialized from the trusted public key algorithm provided in the trust anchor information.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0411"
    object: 'working_public_key'
    field: 'definition; initialised from the trusted public key'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(h)'
    text: 'working_public_key: the public key used to verify the signature of a certificate. The working_public_key is initialized from the trusted public key provided in the trust anchor information.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0412"
    object: 'working_public_key_parameters'
    field: 'definition; initialised from the trusted public key parameters'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(i)'
    text: 'working_public_key_parameters: parameters associated with the current public key that may be required to verify a signature (depending upon the algorithm). The working_public_key_parameters variable is initialized from the trusted public key parameters provided in the trust anchor information.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0413"
    object: 'working_issuer_name'
    field: 'definition; initialised to the trusted issuer name'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(j)'
    text: 'working_issuer_name: the issuer distinguished name expected in the next certificate in the chain. The working_issuer_name is initialized to the trusted issuer name provided in the trust anchor information.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0414"
    object: 'max_path_length'
    field: 'definition; initialised to n, decremented per non-self-issued certificate, reducible by pathLenConstraint'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2(k)'
    text: 'max_path_length: this integer is initialized to n, is decremented for each non-self-issued certificate in the path, and may be reduced to the value in the path length constraint field within the basic constraints extension of a CA certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0415"
    object: 'path validation'
    field: 'control flow: initialisation then basic certificate processing'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.2'
    text: 'Upon completion of the initialization steps, perform the basic certificate processing steps specified in 6.1.3.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0416"
    object: 'path validation'
    field: 'scope: §6.1.3 applies to every certificate i in [1..n]'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3'
    text: 'The basic path processing actions to be performed for certificate i (for all i in [1..n]) are listed below.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0417"
    object: 'basic certificate processing'
    field: 'certificate i satisfies each of §6.1.3(a)(1)-(4)'
    verb: MUST
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(a)'
    text: 'Verify the basic certificate information. The certificate MUST satisfy each of the following:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0418"
    object: 'basic certificate processing'
    field: 'signature verifies under working_public_key_algorithm, working_public_key, working_public_key_parameters'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(a)(1)'
    text: 'The signature on the certificate can be verified using working_public_key_algorithm, the working_public_key, and the working_public_key_parameters.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0419"
    object: 'basic certificate processing'
    field: 'validity period includes the current time'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(a)(2)'
    text: 'The certificate validity period includes the current time.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0420"
    object: 'basic certificate processing'
    field: 'certificate not revoked at the current time (CRL per §6.3, status information, or out-of-band)'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(a)(3)'
    text: 'At the current time, the certificate is not revoked. This may be determined by obtaining the appropriate CRL (Section 6.3), by status information, or by out-of-band mechanisms.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0421"
    object: 'basic certificate processing'
    field: 'issuer name equals working_issuer_name'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(a)(4)'
    text: 'The certificate issuer name is the working_issuer_name.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0422"
    object: 'basic certificate processing'
    field: 'subject DN and every subjectAltName within permitted_subtrees (skipped for intermediate self-issued)'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(b)'
    text: 'If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is within one of the permitted_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is within one of the permitted_subtrees for that name type.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0423"
    object: 'basic certificate processing'
    field: 'subject DN and every subjectAltName not within excluded_subtrees (skipped for intermediate self-issued)'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(c)'
    text: 'If certificate i is self-issued and it is not the final certificate in the path, skip this step for certificate i. Otherwise, verify that the subject name is not within any of the excluded_subtrees for X.500 distinguished names, and verify that each of the alternative names in the subjectAltName extension (critical or non-critical) is not within any of the excluded_subtrees for that name type.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0424"
    object: 'valid_policy_tree'
    field: 'policy processing when certificate policies present and tree not NULL'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(d)'
    text: 'If the certificate policies extension is present in the certificate and the valid_policy_tree is not NULL, process the policy information by performing the following steps in order:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0425"
    object: 'valid_policy_tree'
    field: 'iteration over each non-anyPolicy policy P with P-OID and P-Q'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(d)(1)'
    text: 'For each policy P not equal to anyPolicy in the certificate policies extension, let P-OID denote the OID for policy P and P-Q denote the qualifier set for policy P. Perform the following steps in order:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0426"
    object: 'valid_policy_tree'
    field: 'exact match: child node {P-OID, P-Q, {P-OID}} under each depth i-1 node expecting P-OID'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(d)(1)(i)'
    text: 'For each node of depth i-1 in the valid_policy_tree where P-OID is in the expected_policy_set, create a child node as follows: set the valid_policy to P-OID, set the qualifier_set to P-Q, and set the expected_policy_set to {P-OID}.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0427"
    object: 'valid_policy_tree'
    field: 'no match: child node {P-OID, P-Q, {P-OID}} under a depth i-1 anyPolicy node'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(d)(1)(ii)'
    text: 'If there was no match in step (i) and the valid_policy_tree includes a node of depth i-1 with the valid_policy anyPolicy, generate a child node with the following values: set the valid_policy to P-OID, set the qualifier_set to P-Q, and set the expected_policy_set to {P-OID}.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0428"
    object: 'valid_policy_tree'
    field: 'anyPolicy in certificate (inhibit_anyPolicy > 0, or i<n and self-issued): child per unmatched expected_policy_set value'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(d)(2)'
    text: 'If the certificate policies extension includes the policy anyPolicy with the qualifier set AP-Q and either (a) inhibit_anyPolicy is greater than 0 or (b) i<n and the certificate is self-issued, then: For each node in the valid_policy_tree of depth i-1, for each value in the expected_policy_set (including anyPolicy) that does not appear in a child node, create a child node with the following values: set the valid_policy to the value from the expected_policy_set in the parent node, set the qualifier_set to AP-Q, and set the expected_policy_set to the value in the valid_policy from this node.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0429"
    object: 'valid_policy_tree'
    field: 'pruning of childless nodes of depth i-1 or less, repeated'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(d)(3)'
    text: 'If there is a node in the valid_policy_tree of depth i-1 or less without any child nodes, delete that node. Repeat this step until there are no nodes of depth i-1 or less without children.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0430"
    object: 'valid_policy_tree'
    field: 'set to NULL when certificate policies extension absent'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(e)'
    text: 'If the certificate policies extension is not present, set the valid_policy_tree to NULL.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0431"
    object: 'explicit_policy'
    field: 'explicit_policy > 0 or valid_policy_tree non-NULL'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3(f)'
    text: 'Verify that either explicit_policy is greater than 0 or the valid_policy_tree is not equal to NULL;'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0432"
    object: 'path validation'
    field: 'termination with failure indication and reason when (a), (b), (c) or (f) fails'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3'
    text: 'If any of steps (a), (b), (c), or (f) fails, the procedure terminates, returning a failure indication and an appropriate reason.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0433"
    object: 'path validation'
    field: 'control flow: §6.1.4 if i != n, else §6.1.5'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.3'
    text: 'If i is not equal to n, continue by performing the preparatory steps listed in Section 6.1.4. If i is equal to n, perform the wrap-up steps listed in Section 6.1.5.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0434"
    object: 'path validation'
    field: 'scope: §6.1.4 steps run for certificate i before certificate i+1'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.4'
    text: 'To prepare for processing of certificate i+1, perform the following steps for certificate i:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0435"
    object: 'policy mappings'
    field: 'anyPolicy appears as neither issuerDomainPolicy nor subjectDomainPolicy'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.4(a)'
    text: 'If a policy mappings extension is present, verify that the special value anyPolicy does not appear as an issuerDomainPolicy or a subjectDomainPolicy.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0436"
    object: 'policy mappings'
    field: 'iteration over each issuerDomainPolicy ID-P'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.4(b)'
    text: 'If a policy mappings extension is present, then for each issuerDomainPolicy ID-P in the policy mappings extension:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0437"
    object: 'valid_policy_tree'
    field: 'policy_mapping > 0: expected_policy_set of each depth-i node with valid_policy ID-P set to the mapped subjectDomainPolicy values'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.4(b)(1)'
    text: 'If the policy_mapping variable is greater than 0, for each node in the valid_policy_tree of depth i where ID-P is the valid_policy, set expected_policy_set to the set of subjectDomainPolicy values that are specified as equivalent to ID-P by the policy mappings extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0438"
    object: 'valid_policy_tree'
    field: 'policy_mapping > 0, no ID-P node but an anyPolicy node at depth i: generate child of the depth i-1 anyPolicy node'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.4(b)(1)'
    text: 'If no node of depth i in the valid_policy_tree has a valid_policy of ID-P but there is a node of depth i with a valid_policy of anyPolicy, then generate a child node of the node of depth i-1 that has a valid_policy of anyPolicy as follows:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0439"
    object: 'valid_policy_tree node'
    field: 'generated node valid_policy = ID-P'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.4(b)(1)(i)'
    text: 'set the valid_policy to ID-P;'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0440"
    object: 'valid_policy_tree node'
    field: 'generated node qualifier_set = anyPolicy qualifiers of certificate i'
    verb: none
    actor: 'path validation (conforming implementations)'
    locator: '§6.1.4(b)(1)(ii)'
    text: 'set the qualifier_set to the qualifier set of the policy anyPolicy in the certificate policies extension of certificate i; and'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0441"
    object: 'valid_policy_tree node'
    field: 'generated node expected_policy_set = mapped subjectDomainPolicy values'
    verb: none
