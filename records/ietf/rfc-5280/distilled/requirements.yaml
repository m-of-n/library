    field: 'precondition: needed CRLs cached locally; mechanism to fetch a current CRL after next update'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3'
    text: 'This algorithm assumes that all of the needed CRLs are available in a local cache. Further, if the next update time of a CRL has passed, the algorithm assumes a mechanism to fetch a current CRL and place it in the local CRL cache.'
    kind: stated
    testable: no
    testable_reason: 'assumption about the environment, not an obligation'
    status: active
  - id: "rfc-5280#R-0496"
    object: 'CRL validation input'
    field: 'certificate: serial number, issuer, basicConstraints, cRLDistributionPoints, freshestCRL'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.1(a)'
    text: 'certificate: The algorithm requires the certificate serial number and issuer name to determine whether a certificate is on a particular CRL. The basicConstraints extension is used to determine whether the supplied certificate is associated with a CA or an end entity. If present, the algorithm uses the cRLDistributionPoints and freshestCRL extensions to determine revocation status.'
    kind: stated
    testable: partial
    testable_reason: 'input definition; constrains the validator''s interface and is observable only through the outputs of the algorithm'
    status: active
  - id: "rfc-5280#R-0497"
    object: 'CRL validation input'
    field: 'use-deltas'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.1(b)'
    text: 'use-deltas: This boolean input determines whether delta CRLs are applied to CRLs.'
    kind: stated
    testable: partial
    testable_reason: 'input definition; constrains the validator''s interface and is observable only through the outputs of the algorithm'
    status: active
  - id: "rfc-5280#R-0498"
    object: 'reasons_mask'
    field: 'definition; legal members; all-reasons; initial value empty set'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.2(a)'
    text: 'reasons_mask: This variable contains the set of revocation reasons supported by the CRLs and delta CRLs processed so far. The legal members of the set are the possible revocation reason values minus unspecified: keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, certificateHold, privilegeWithdrawn, and aACompromise. The special value all-reasons is used to denote the set of all legal members. This variable is initialized to the empty set.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0499"
    object: 'cert_status'
    field: 'definition; value domain incl. UNREVOKED and UNDETERMINED; initial value UNREVOKED'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.2(b)'
    text: 'cert_status: This variable contains the status of the certificate. This variable may be assigned one of the following values: unspecified, keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, certificateHold, removeFromCRL, privilegeWithdrawn, aACompromise, the special value UNREVOKED, or the special value UNDETERMINED. This variable is initialized to the special value UNREVOKED.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0500"
    object: 'interim_reasons_mask'
    field: 'definition'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.2(c)'
    text: 'interim_reasons_mask: This contains the set of revocation reasons supported by the CRL or delta CRL currently being processed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0501"
    object: 'CRL validation'
    field: 'termination: revoked status found or all reason codes covered'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3'
    text: 'This algorithm begins by assuming that the certificate is not revoked. The algorithm checks one or more CRLs until either the certificate status is determined to be revoked or sufficient CRLs have been checked to cover all reason codes.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0502"
    object: 'CRL validation'
    field: 'loop: each DP, each cached CRL, while reasons_mask != all-reasons and cert_status == UNREVOKED'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3'
    text: 'For each distribution point (DP) in the certificate''s CRL distribution points extension, for each corresponding CRL in the local CRL cache, while ((reasons_mask is not all-reasons) and (cert_status is UNREVOKED)) perform the following:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0503"
    object: 'local CRL cache'
    field: 'update with complete and/or delta CRL as required'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(a)'
    text: 'Update the local CRL cache by obtaining a complete CRL, a delta CRL, or both, as required:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0504"
    object: 'local CRL cache'
    field: 'current time after nextUpdate: do (i) or (ii)'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(a)(1)'
    text: 'If the current time is after the value of the CRL next update field, then do one of the following:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0505"
    object: 'local CRL cache'
    field: 'obtain a fresh delta CRL able to update the cached CRL'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(a)(1)(i)'
    text: 'If use-deltas is set and either the certificate or the CRL contains the freshest CRL extension, obtain a delta CRL with a next update value that is after the current time and can be used to update the locally cached CRL as specified in Section 5.2.4.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0506"
    object: 'local CRL cache'
    field: 'obtain current complete CRL, verify current time before its nextUpdate; obtain current delta when use-deltas'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(a)(1)(ii)'
    text: 'Update the local CRL cache with a current complete CRL, verify that the current time is before the next update value in the new CRL, and continue processing with the new CRL. If use-deltas is set and either the certificate or the CRL contains the freshest CRL extension, then obtain the current delta CRL that can be used to update the new locally cached complete CRL as specified in Section 5.2.4.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0507"
    object: 'local CRL cache'
    field: 'current time before nextUpdate with use-deltas and freshest CRL: obtain current delta CRL'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(a)(2)'
    text: 'If the current time is before the value of the next update field, use-deltas is set, and either the certificate or the CRL contains the freshest CRL extension, then obtain the current delta CRL that can be used to update the locally cached complete CRL as specified in Section 5.2.4.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0508"
    object: 'complete CRL'
    field: 'issuer and scope verification'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(b)'
    text: 'Verify the issuer and scope of the complete CRL as follows:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0509"
    object: 'complete CRL'
    field: 'issuer matches DP cRLIssuer with indirectCRL asserted; otherwise matches certificate issuer'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(b)(1)'
    text: 'If the DP includes cRLIssuer, then verify that the issuer field in the complete CRL matches cRLIssuer in the DP and that the complete CRL contains an issuing distribution point extension with the indirectCRL boolean asserted. Otherwise, verify that the CRL issuer matches the certificate issuer.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0510"
    object: 'issuing distribution point'
    field: 'IDP checks when complete CRL has IDP'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(b)(2)'
    text: 'If the complete CRL includes an issuing distribution point (IDP) CRL extension, check the following:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0511"
    object: 'issuing distribution point'
    field: 'IDP distributionPoint name matches a DP name, or a DP cRLIssuer name when DP distribution field omitted'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(b)(2)(i)'
    text: 'If the distribution point name is present in the IDP CRL extension and the distribution field is present in the DP, then verify that one of the names in the IDP matches one of the names in the DP. If the distribution point name is present in the IDP CRL extension and the distribution field is omitted from the DP, then verify that one of the names in the IDP matches one of the names in the cRLIssuer field of the DP.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0512"
    object: 'issuing distribution point'
    field: 'onlyContainsUserCerts: certificate is not a CA (no basicConstraints cA)'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(b)(2)(ii)'
    text: 'If the onlyContainsUserCerts boolean is asserted in the IDP CRL extension, verify that the certificate does not include the basic constraints extension with the cA boolean asserted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0513"
    object: 'issuing distribution point'
    field: 'onlyContainsCACerts: certificate has basicConstraints cA asserted'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(b)(2)(iii)'
    text: 'If the onlyContainsCACerts boolean is asserted in the IDP CRL extension, verify that the certificate includes the basic constraints extension with the cA boolean asserted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0514"
    object: 'issuing distribution point'
    field: 'onlyContainsAttributeCerts not asserted'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(b)(2)(iv)'
    text: 'Verify that the onlyContainsAttributeCerts boolean is not asserted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0515"
    object: 'delta CRL'
    field: 'issuer and scope verification when use-deltas'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(c)'
    text: 'If use-deltas is set, verify the issuer and scope of the delta CRL as follows:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0516"
    object: 'delta CRL'
    field: 'issuer matches complete CRL issuer'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(c)(1)'
    text: 'Verify that the delta CRL issuer matches the complete CRL issuer.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0517"
    object: 'delta CRL'
    field: 'IDP of delta matches IDP of complete CRL, or both omit it'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(c)(2)'
    text: 'If the complete CRL includes an issuing distribution point (IDP) CRL extension, verify that the delta CRL contains a matching IDP CRL extension. If the complete CRL omits an IDP CRL extension, verify that the delta CRL also omits an IDP CRL extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0518"
    object: 'delta CRL'
    field: 'authority key identifier matches the complete CRL''s'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(c)(3)'
    text: 'Verify that the delta CRL authority key identifier extension matches the complete CRL authority key identifier extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0519"
    object: 'interim_reasons_mask'
    field: 'computation per (d)(1)-(4)'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(d)'
    text: 'Compute the interim_reasons_mask for this CRL as follows:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0520"
    object: 'interim_reasons_mask'
    field: 'IDP onlySomeReasons and DP reasons: intersection'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(d)(1)'
    text: 'If the issuing distribution point (IDP) CRL extension is present and includes onlySomeReasons and the DP includes reasons, then set interim_reasons_mask to the intersection of reasons in the DP and onlySomeReasons in the IDP CRL extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0521"
    object: 'interim_reasons_mask'
    field: 'IDP onlySomeReasons, DP omits reasons: onlySomeReasons'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(d)(2)'
    text: 'If the IDP CRL extension includes onlySomeReasons but the DP omits reasons, then set interim_reasons_mask to the value of onlySomeReasons in the IDP CRL extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0522"
    object: 'interim_reasons_mask'
    field: 'no IDP onlySomeReasons, DP reasons: DP reasons'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(d)(3)'
    text: 'If the IDP CRL extension is not present or omits onlySomeReasons but the DP includes reasons, then set interim_reasons_mask to the value of DP reasons.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0523"
    object: 'interim_reasons_mask'
    field: 'neither: all-reasons'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(d)(4)'
    text: 'If the IDP CRL extension is not present or omits onlySomeReasons and the DP omits reasons, then set interim_reasons_mask to the special value all-reasons.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0524"
    object: 'interim_reasons_mask'
    field: 'contributes at least one reason not yet in reasons_mask'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(e)'
    text: 'Verify that interim_reasons_mask includes one or more reasons that are not included in the reasons_mask.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0525"
    object: 'CRL issuer'
    field: 'obtain and validate the CRL issuer''s certification path'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(f)'
    text: 'Obtain and validate the certification path for the issuer of the complete CRL.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0526"
    object: 'CRL issuer certification path'
    field: 'same trust anchor as the target certificate''s path'
    verb: MUST
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(f)'
    text: 'The trust anchor for the certification path MUST be the same as the trust anchor used to validate the target certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0527"
    object: 'CRL issuer certificate'
    field: 'cRLSign set when key usage present'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(f)'
    text: 'If a key usage extension is present in the CRL issuer''s certificate, verify that the cRLSign bit is set.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0528"
    object: 'complete CRL'
    field: 'signature validates under the key from step (f)'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(g)'
    text: 'Validate the signature on the complete CRL using the public key validated in step (f).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0529"
    object: 'delta CRL'
    field: 'signature validates under the key from step (f)'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(h)'
    text: 'If use-deltas is set, then validate the signature on the delta CRL using the public key validated in step (f).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0530"
    object: 'cert_status'
    field: 'delta CRL lookup by issuer and serial (§5.3.3)'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(i)'
    text: 'If use-deltas is set, then search for the certificate on the delta CRL. If an entry is found that matches the certificate issuer and serial number as described in Section 5.3.3, then set the cert_status variable to the indicated reason as follows:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0531"
    object: 'cert_status'
    field: 'set to reasonCode value when present'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(i)(1)'
    text: 'If the reason code CRL entry extension is present, set the cert_status variable to the value of the reason code CRL entry extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0532"
    object: 'cert_status'
    field: 'set to unspecified when reasonCode absent'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(i)(2)'
    text: 'If the reason code CRL entry extension is not present, set the cert_status variable to the value unspecified.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0533"
    object: 'cert_status'
    field: 'complete CRL lookup when still UNREVOKED'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(j)'
    text: 'If (cert_status is UNREVOKED), then search for the certificate on the complete CRL. If an entry is found that matches the certificate issuer and serial number as described in Section 5.3.3, then set the cert_status variable to the indicated reason as described in step (i).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0534"
    object: 'cert_status'
    field: 'removeFromCRL maps to UNREVOKED'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(k)'
    text: 'If (cert_status is removeFromCRL), then set cert_status to UNREVOKED.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0535"
    object: 'reasons_mask'
    field: 'union with interim_reasons_mask'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3(l)'
    text: 'Set the reasons_mask state variable to the union of its previous value and the value of the interim_reasons_mask state variable.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0536"
    object: 'cert_status'
    field: 'return when all reasons covered or status not UNREVOKED'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3'
    text: 'If ((reasons_mask is all-reasons) OR (cert_status is not UNREVOKED)), then the revocation status has been determined, so return cert_status.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0537"
    object: 'CRL validation'
    field: 'fallback over CRLs not in a DP (synthesised DP from issuer and issuerAltName); else UNDETERMINED'
    verb: none
    actor: 'CRL validation (conforming implementations)'
    locator: '§6.3.3'
    text: 'If the revocation status has not been determined, repeat the process above with any available CRLs not specified in a distribution point but issued by the certificate issuer. For the processing of such a CRL, assume a DP with both the reasons and the cRLIssuer fields omitted and a distribution point name of the certificate issuer. That is, the sequence of names in fullName is generated from the certificate issuer field as well as the certificate issuerAltName extension. After processing such CRLs, if the revocation status has still not been determined, then return the cert_status UNDETERMINED.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0538"
    object: 'DirectoryString'
    field: 'support for UTF8String and PrintableString'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'Conforming implementations MUST support UTF8String and PrintableString.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0539"
    object: 'DirectoryString'
    field: 'support for TeletexString, BMPString, UniversalString'
    verb: OPTIONAL
    actor: 'implementations'
    locator: '§7.1'
    text: 'Implementations may encounter certificates and CRLs with names encoded using TeletexString, BMPString, or UniversalString, but support for these is OPTIONAL.'
    kind: stated
    testable: no
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-5280#R-0540"
    object: 'distinguished name comparison'
    field: 'LDAP StringPrep (RFC 4518) incl. insignificant space handling as basis for PrintableString/UTF8String comparison'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'Conforming implementations MUST use the LDAP StringPrep profile (including insignificant space handling), as specified in [RFC4518], as the basis for comparison of distinguished name attributes encoded in either PrintableString or UTF8String.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0541"
    object: 'distinguished name comparison'
    field: 'support for caseIgnoreMatch'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'Conforming implementations MUST support name comparisons using caseIgnoreMatch.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0542"
    object: 'distinguished name comparison'
    field: 'six-step RFC 4518 string preparation for every DirectoryString attribute before caseIgnoreMatch'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'Before comparing names using the caseIgnoreMatch matching rule, conforming implementations MUST perform the six-step string preparation algorithm described in [RFC4518] for each attribute of type DirectoryString, with the following clarifications:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0543"
    object: 'string preparation'
    field: 'step 2 Map includes RFC 3454 B.2 case folding (lowercase ''shall'')'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'In step 2, Map, the mapping shall include case folding as specified in Appendix B.2 of [RFC3454].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0544"
    object: 'string preparation'
    field: 'step 6 white space compression per RFC 4518 §2.6.1'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'In step 6, Insignificant Character Removal, perform white space compression as specified in Section 2.6.1, Insignificant Space Handling, of [RFC4518].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0545"
    object: 'string preparation'
    field: 'attributes treated as stored values'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'When performing the string preparation algorithm, attributes MUST be treated as stored values.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0546"
    object: 'distinguished name comparison'
    field: 'domainComponent compared per §7.3'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'Comparisons of domainComponent attributes MUST be performed as specified in Section 7.3.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0547"
    object: 'distinguished name comparison'
    field: 'attribute match: same type, exact match after string preparation'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'Two naming attributes match if the attribute types are the same and the values of the attributes are an exact match after processing with the string preparation algorithm.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0548"
    object: 'distinguished name comparison'
    field: 'RDN match: same attribute count, each attribute matched'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'Two relative distinguished names RDN1 and RDN2 match if they have the same number of naming attributes and for each naming attribute in RDN1 there is a matching naming attribute in RDN2.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0549"
    object: 'distinguished name comparison'
    field: 'DN match: same RDN count, matching RDNs in the same order'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'Two distinguished names DN1 and DN2 match if they have the same number of RDNs, for each RDN in DN1 there is a matching RDN in DN2, and the matching RDNs appear in the same order in both DNs.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0550"
    object: 'distinguished name comparison'
    field: 'DN subtree membership (name constraints)'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.1'
    text: 'A distinguished name DN1 is within the subtree defined by the distinguished name DN2 if DN1 contains at least as many RDNs as DN2, and DN1 and DN2 are a match when trailing RDNs in DN1 are ignored.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0551"
    object: 'dNSName'
    field: 'IDN converted to ACE (RFC 3490 §4) before storage'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.2'
    text: 'To accommodate internationalized domain names in the current structure, conforming implementations MUST convert internationalized domain names to the ASCII Compatible Encoding (ACE) format as specified in Section 4 of RFC 3490 before storage in the dNSName field.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0552"
    object: 'dNSName'
    field: 'RFC 3490 §4 conversion operation with the listed clarifications'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.2'
    text: 'Specifically, conforming implementations MUST perform the conversion operation specified in Section 4 of RFC 3490, with the following clarifications:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0553"
    object: 'dNSName'
    field: 'ToASCII step 1: stored string, AllowUnassigned not set'
    verb: SHALL
    verbs:
      - SHALL
      - SHALL NOT
    actor: 'conforming implementations'
    locator: '§7.2'
    text: 'in step 1, the domain name SHALL be considered a "stored string". That is, the AllowUnassigned flag SHALL NOT be set;'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0554"
    object: 'dNSName'
    field: 'ToASCII step 3: UseSTD3ASCIIRules set'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.2'
    text: 'in step 3, set the flag called "UseSTD3ASCIIRules";'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0555"
    object: 'dNSName'
    field: 'step 4: ToASCII per label'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.2'
    text: 'in step 4, process each label with the "ToASCII" operation; and'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0556"
    object: 'dNSName'
    field: 'step 5: label separators to U+002E'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.2'
    text: 'in step 5, change all label separators to U+002E (full stop).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0557"
    object: 'dNSName comparison'
    field: 'case-insensitive exact match on the entire name'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.2'
    text: 'When comparing DNS names for equality, conforming implementations MUST perform a case-insensitive exact match on the entire DNS name.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0558"
    object: 'dNSName name constraints'
    field: 'case-insensitive exact match label by label'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.2'
    text: 'When evaluating name constraints, conforming implementations MUST perform a case-insensitive exact match on a label-by-label basis.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0559"
    object: 'IDN display'
    field: 'ToUnicode step 1: stored string, AllowUnassigned not set'
    verb: SHALL
    verbs:
      - SHALL
      - SHALL NOT
    actor: 'conforming implementations'
    locator: '§7.2'
    text: 'in step 1, the domain name SHALL be considered a "stored string". That is, the AllowUnassigned flag SHALL NOT be set;'
    kind: stated
    testable: partial
    testable_reason: 'binds only within the conversion-for-display that the source states with lowercase ''should'''
    status: active
  - id: "rfc-5280#R-0560"
    object: 'dNSName'
    field: 'storage space for ACE-encoded IDNs'
    verb: MUST
    actor: 'implementations'
    locator: '§7.2'
    text: 'Note: Implementations MUST allow for increased space requirements for IDNs.'
    kind: stated
    testable: partial
    testable_reason: 'no bound is stated; testable only as accepting long ACE labels'
    status: active
  - id: "rfc-5280#R-0561"
    object: 'domainComponent'
    field: 'ToASCII conversion of IDN labels'
    verb: MUST
    actor: 'the implementation'
    locator: '§7.3'
    text: 'To represent a label from an IDN in the distinguished name, the implementation MUST perform the "ToASCII" label conversion specified in Section 4.1 of RFC 3490.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0562"
    object: 'domainComponent'
    field: 'stored string, AllowUnassigned not set'
    verb: SHALL
    verbs:
      - SHALL
      - SHALL NOT
    actor: 'the implementation'
    locator: '§7.3'
    text: 'The label SHALL be considered a "stored string". That is, the AllowUnassigned flag SHALL NOT be set.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0563"
    object: 'domainComponent comparison'
    field: 'case-insensitive exact match (lowercase ''shall'')'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.3'
    text: 'Conforming implementations shall perform a case-insensitive exact match when comparing domainComponent attributes in distinguished names, as described in Section 7.2.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0564"
    object: 'uniformResourceIdentifier'
    field: 'IRI-to-URI mapping per RFC 3987 §3.1 with clarifications'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'To accommodate IRIs in the current structure, conforming implementations MUST map IRIs to URIs as specified in Section 3.1 of [RFC3987], with the following clarifications:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0565"
    object: 'uniformResourceIdentifier'
    field: 'step 1: NFC-normalised UCS sequence (Variant b)'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'in step 1, generate a UCS character sequence from the original IRI format normalizing according to the NFC as specified in Variant b (normalization according to NFC);'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0566"
    object: 'uniformResourceIdentifier'
    field: 'step 2 applied to step 1 output'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'perform step 2 using the output from step 1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0567"
    object: 'uniformResourceIdentifier'
    field: 'no ireg-name conversion before step 2'
    verb: MUST NOT
    actor: 'implementations'
    locator: '§7.4'
    text: 'Implementations MUST NOT convert the ireg-name component before performing step 2.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0568"
    object: 'URI comparison'
    field: 'syntax-based and scheme-based normalisation before comparison'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'Before URIs may be compared, conforming implementations MUST perform a combination of the syntax-based and scheme-based normalization techniques described in [RFC3987].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0569"
    object: 'URI comparison'
    field: 'preparation per steps 1-5'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'Specifically, conforming implementations MUST prepare URIs for comparison as follows:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0570"
    object: 'URI comparison'
    field: 'step 1: IDNs converted to ACE per §7.2'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'Step 1: Where IRIs allow the usage of IDNs, those names MUST be converted to ASCII Compatible Encoding as specified in Section 7.2 above.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0571"
    object: 'URI comparison'
    field: 'step 2: scheme and host lowercased'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'Step 2: The scheme and host are normalized to lowercase, as described in Section 5.3.2.1 of [RFC3987].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0572"
    object: 'URI comparison'
    field: 'step 3: percent-encoding normalisation'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'Step 3: Perform percent-encoding normalization, as specified in Section 5.3.2.3 of [RFC3987].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0573"
    object: 'URI comparison'
    field: 'step 4: path segment normalisation'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'Step 4: Perform path segment normalization, as specified in Section 5.3.2.4 of [RFC3987].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0574"
    object: 'URI comparison'
    field: 'step 5: scheme-based normalisation for recognised schemes'
    verb: MUST
    actor: 'the implementation'
    locator: '§7.4'
    text: 'Step 5: If recognized, the implementation MUST perform scheme-based normalization as specified in Section 5.3.3 of [RFC3987].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0575"
    object: 'URI comparison'
    field: 'scheme-based normalisation for ldap, http, https, ftp'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'Conforming implementations MUST recognize and perform scheme-based normalization for the following schemes: ldap, http, https, and ftp.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0576"
    object: 'URI comparison'
    field: 'step 5 omitted for unrecognised schemes'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'If the scheme is not recognized, step 5 is omitted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0577"
    object: 'URI comparison'
    field: 'case-sensitive exact match after preparation (lowercase ''shall'')'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.4'
    text: 'When comparing URIs for equivalence, conforming implementations shall perform a case-sensitive exact match.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0578"
    object: 'rfc822Name'
    field: 'internationalised addresses converted to ASCII'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.5'
    text: 'To accommodate email addresses with internationalized domain names using the current structure, conforming implementations MUST convert the addresses into an ASCII representation.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0579"
    object: 'rfc822Name'
    field: 'IDN host-part converted to ACE per §7.2'
    verb: MUST
    actor: 'conforming implementations'
    locator: '§7.5'
    text: 'Where the host-part (the Domain of the Mailbox) contains an internationalized name, the domain name MUST be converted from an IDN to the ASCII Compatible Encoding (ACE) format as specified in Section 7.2.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0580"
    object: 'rfc822Name comparison'
    field: 'local-part exact match and host-part case-insensitive ASCII match'
    verb: none
    actor: 'conforming implementations'
    locator: '§7.5'
    text: 'Two email addresses are considered to match if: 1) the local-part of each name is an exact match, AND 2) the host-part of each name matches using a case-insensitive ASCII comparison.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0581"
    object: 'CA key compromise'
    field: 'revocation of all certificates issued to a compromised CA'
    verb: MUST
    actor: 'CAs issuing to the compromised CA'
    locator: '§8'
    text: 'If such a compromise is detected, all certificates issued to the compromised CA MUST be revoked, preventing services between its users and users of other CAs.'
    kind: stated
    testable: partial
    testable_reason: 'observable only as revocation entries after a compromise event'
    status: active
  - id: "rfc-5280#R-0582"
    object: 'CA signing key'
    field: 'secure backup'
    verb: SHOULD
    actor: 'CAs'
    locator: '§8'
    text: 'CAs SHOULD maintain secure backup for signing keys.'
    kind: stated
    testable: no
    testable_reason: 'CA operational practice; not observable in a certificate or CRL'
    status: active
  - id: "rfc-5280#R-0583"
    object: 'revocation information'
    field: 'care with CRL-only revocation information carrying critical extensions'
    verb: SHOULD
    actor: 'CAs'
    locator: '§8'
    text: 'CAs SHOULD take extra care when making revocation information available only through CRLs that contain critical extensions, particularly if support for those extensions is not mandated by this profile.'
    kind: stated
    testable: no
    testable_reason: 'CA operational practice; not observable in a certificate or CRL'
    status: active
  - id: "rfc-5280#R-0584"
    object: 'certificate issuance'
    field: 'decline issuance to entities generating weak signatures'
    verb: SHOULD
    actor: 'CAs'
    locator: '§8'
    text: 'In addition, CAs SHOULD decline to issue certificates to CAs or end entities that generate weak signatures.'
    kind: stated
    testable: partial
    testable_reason: '''weak'' is not defined; testable only against a chosen algorithm policy'
    status: active
  - id: "rfc-5280#R-0585"
    object: 'distinguished name encoding'
    field: 'CA subject DN encoded identically to issuer DN in certificates it issues'
    verb: MUST
    actor: 'CAs'
    locator: '§8'
    text: 'CAs MUST encode the distinguished name in the subject field of a CA certificate identically to the distinguished name in the issuer field in certificates issued by that CA.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0586"
    object: 'name constraints'
    field: 'DN constraints encoded identically to subject field or subjectAltName encoding'
    verb: MUST
    actor: 'CAs'
    locator: '§8'
    text: 'In addition, name constraints for distinguished names MUST be stated identically to the encoding used in the subject field or subjectAltName extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0587"
    object: 'name constraints'
    field: 'DN constraints stated as permittedSubtrees'
    verb: SHOULD
    actor: 'CAs'
    locator: '§8'
    text: 'To avoid acceptance of invalid paths, CAs SHOULD state name constraints for distinguished names as permittedSubtrees wherever possible.'
    kind: stated
    testable: partial
    testable_reason: '''wherever possible'' is a judgement; testable only as a lint preference'
    status: active
  - id: "rfc-5280#R-0588"
    object: 'issuer name'
    field: 'CA and CRL issuer names formed to reduce collisions'
    verb: SHOULD
    actor: 'CAs and CRL issuers'
    locator: '§8'
    text: 'As a means of reducing problems and security issues related to issuer name collisions, CA and CRL issuer names SHOULD be formed in a way that reduces the likelihood of name collisions.'
    kind: stated
    testable: no
    testable_reason: 'collision likelihood is not observable from a single certificate'
    status: active
  - id: "rfc-5280#R-0589"
    object: 'CRL validation'
    field: 'certificate path and CRL issuer path terminate at the same trust anchor'
    verb: MUST
    actor: 'implementations validating CRLs'
    locator: '§8'
    text: 'At a minimum, implementations validating CRLs MUST ensure that the certification path of a certificate and the CRL issuer certification path used to validate the certificate terminate at the same trust anchor.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0590"
    object: 'certificate extensions'
    field: 'https/ldaps URIs in extensions'
    verb: SHOULD NOT
    actor: 'CAs'
    locator: '§8'
    text: 'CAs SHOULD NOT include URIs that specify https, ldaps, or similar schemes in extensions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0591"
    object: 'certificate extensions'
    field: 'server certificate for an https URI validatable without the pointed-to information'
    verb: MUST
    actor: 'CAs that include an https URI'
    locator: '§8'
    text: 'CAs that include an https URI in one of these extensions MUST ensure that the server''s certificate can be validated without using the information that is pointed to by the URI.'
    kind: stated
    testable: partial
    testable_reason: 'requires inspecting the server''s certificate path, outside the certificate itself'
    status: active
  - id: "rfc-5280#R-0592"
    object: 'path validation'
    field: 'prepared for unbounded recursion when validating https servers for CRL/AIA/SIA retrieval'
    verb: MUST
    actor: 'relying parties that choose to validate the server''s certificate'
    locator: '§8'
    text: 'Relying parties that choose to validate the server''s certificate when obtaining information pointed to by an https URI in the cRLDistributionPoints, authorityInfoAccess, or subjectInfoAccess extensions MUST be prepared for the possibility that this will result in unbounded recursion.'
    kind: stated
    testable: partial
    testable_reason: 'testable as termination under a recursive fixture; the required behaviour is not specified'
    status: active
  - id: "rfc-5280#R-0593"
    object: 'self-issued certificate'
    field: 'use for other changes in CA operations'
    verb: MAY
    actor: 'CAs'
    locator: '§8'
    text: 'Self-issued certificates MAY be used to support other changes in CA operations, such as additions to the CA''s policy set, using similar procedures.'
    kind: stated
    testable: no
    testable_reason: 'permission; both exercising and not exercising it conform'
    status: active
  - id: "rfc-5280#R-0594"
    object: 'TBSCertificate'
    field: 'version when issuerUniqueID present (ASN.1 comment)'
    verb: MUST
    actor: 'conforming CA'
    locator: 'Appendix A.1'
    text: 'If present, version MUST be v2 or v3'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0595"
    object: 'TBSCertificate'
    field: 'version when subjectUniqueID present (ASN.1 comment)'
    verb: MUST
    actor: 'conforming CA'
    locator: 'Appendix A.1'
    text: 'If present, version MUST be v2 or v3'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0596"
    object: 'TBSCertificate'
    field: 'version when extensions present (ASN.1 comment)'
    verb: MUST
    actor: 'conforming CA'
    locator: 'Appendix A.1'
    text: 'If present, version MUST be v3'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0597"
    object: 'TBSCertList'
    field: 'version value when present (ASN.1 comment)'
    verb: MUST
    actor: 'CRL issuer'
    locator: 'Appendix A.1'
    text: 'if present, MUST be v2'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0598"
    object: 'TBSCertList'
    field: 'version when crlEntryExtensions present (ASN.1 comment)'
    verb: MUST
    actor: 'CRL issuer'
    locator: 'Appendix A.1'
    text: 'if present, version MUST be v2'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0599"
    object: 'TBSCertList'
    field: 'version when crlExtensions present (ASN.1 comment)'
    verb: MUST
    actor: 'CRL issuer'
    locator: 'Appendix A.1'
    text: 'if present, version MUST be v2'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0600"
    object: 'upper bounds'
    field: 'ub-* values from X.411 Annex B are mandatory (ASN.1 comment)'
    verb: MUST
    actor: 'conforming implementations'
    locator: 'Appendix A.1'
    text: 'specifications of Upper Bounds MUST be regarded as mandatory -- from Annex B of ITU-T X.411 Reference Definition of MTS Parameter -- Upper Bounds'
    kind: stated
    testable: partial
    testable_reason: 'says the bounds are mandatory without saying whether issuers, relying parties or both enforce them'
    status: active
  - id: "rfc-5280#R-0601"
    object: 'AuthorityKeyIdentifier'
    field: 'authorityCertIssuer and authorityCertSerialNumber both present or both absent (ASN.1 comment)'
    verb: MUST
    actor: 'conforming CA'
    locator: 'Appendix A.2'
    text: 'authorityCertIssuer and authorityCertSerialNumber MUST both -- be present or both be absent'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0602"
    object: 'PrivateKeyUsagePeriod'
    field: 'at least one of notBefore, notAfter (ASN.1 comment)'
    verb: MUST
    actor: 'conforming CA'
    locator: 'Appendix A.2'
    text: 'either notBefore or notAfter MUST be present'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0603"
    object: 'PolicyQualifierId'
    field: 'augmentation of the PolicyQualifierId definition for additional qualifiers (ASN.1 comment)'
    verb: MUST
    actor: 'implementations that recognize additional policy qualifiers'
    locator: 'Appendix A.2'
    text: 'Implementations that recognize additional policy qualifiers MUST -- augment the following definition for PolicyQualifierId'
    kind: stated
    testable: no
    testable_reason: 'constrains how an implementation''s own ASN.1 module is written; no wire-observable effect'
    status: active
  - id: "rfc-5280#R-0604"
    object: 'serialNumber'
    field: 'non-negative; DER sign bit zero'
    verb: MUST
    verbs:
      - MUST
      - MUST
    actor: 'CAs'
    locator: 'Appendix B'
    text: 'CAs MUST force the serialNumber to be a non-negative integer, that is, the sign bit in the DER encoding of the INTEGER value MUST be zero.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0605"
    object: 'serialNumber'
    field: 'handling values up to 20 octets'
    verb: MUST
    actor: 'certificate users'
    locator: 'Appendix B'
    text: 'Certificate users MUST be able to handle serialNumber values up to 20 octets in length.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0606"
    object: 'serialNumber'
    field: 'values longer than 20 octets'
    verb: MUST NOT
    actor: 'conforming CAs'
    locator: 'Appendix B'
    text: 'Conforming CAs MUST NOT use serialNumber values longer than 20 octets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0607"
    object: 'cRLNumber'
    field: 'handling values up to 20 octets'
    verb: MUST
    actor: 'CRL validators'
    locator: 'Appendix B'
    text: 'CRL validators MUST be able to handle cRLNumber values up to 20 octets in length.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0608"
    object: 'cRLNumber'
    field: 'values longer than 20 octets'
    verb: MUST NOT
    actor: 'conforming CRL issuers'
    locator: 'Appendix B'
    text: 'Conforming CRL issuers MUST NOT use cRLNumber values longer than 20 octets.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0609"
    object: 'string encoding'
    field: 'Internet addresses containing ''@'' or ''_'' encoded in a type that supports them'
    verb: MUST
    actor: 'conforming implementations'
    locator: 'Appendix B'
    text: 'Such addresses MUST be encoded using an ASN.1 type that supports them.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0610"
    object: 'PrintableString'
    field: 'strings containing ''@'' or ''_'''
    verb: MUST NOT
    actor: 'conforming implementations'
    locator: 'Appendix B'
    text: 'Conforming implementations MUST NOT encode strings that include either the at sign or underscore character as PrintableString.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0611"
    object: 'named bit list'
    field: 'DER: trailing zero bits omitted'
    verb: MUST
    actor: 'encoders (DER)'
    locator: 'Appendix B'
    text: 'When DER encoding a named bit list, trailing zeros MUST be omitted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0612"
    object: 'OBJECT IDENTIFIER'
    field: 'support for arc values 0..268,435,455'
    verb: MUST
    actor: 'implementations'
    locator: 'Appendix B'
    text: 'This specification mandates support for OIDs that have arc elements with values that are less than 2^28, that is, they MUST be between 0 and 268,435,455, inclusive.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-5280#R-0613"
    object: 'OBJECT IDENTIFIER'
    field: 'support for dotted-decimal length up to 100 bytes'
    verb: MUST
    actor: 'implementations'
    locator: 'Appendix B'
    text: 'Implementations MUST also support OIDs where the length of the dotted decimal (see Section 1.4 of [RFC4512]) string representation can be up to 100 bytes (inclusive).'
