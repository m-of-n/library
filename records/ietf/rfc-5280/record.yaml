implementations:
  open_source:
    - name: OpenSSL
      url: https://www.openssl.org/
      language: c
      note: "The de facto PKIX implementation. A nameConstraints bypass was reported against it as openssl.org #3502 (openssl-dev, May 2016) — evidence about the section this record was summarised for, not a current advisory."
    - name: Go crypto/x509
      url: https://pkg.go.dev/crypto/x509
      language: go
      note: "Enforces nameConstraints in its own path builder rather than delegating to a platform verifier on most platforms."
    - name: mozilla::pkix / NSS
      url: https://firefox-source-docs.mozilla.org/security/nss/
      language: cpp
      note: "Firefox's path validator. Mozilla maintains a CA-policy page specifically for name constraints."
    - name: rustls / webpki
      url: https://github.com/rustls/webpki
      language: rust
      note: "A modern restricted-profile verifier; implements name constraints."
    - name: Bouncy Castle
      url: https://www.bouncycastle.org/
      language: java
      note: "PKIX CertPathValidator including name constraints."
    - name: GnuTLS
      url: https://www.gnutls.org/
      language: c
      note: "Ships name-constraint verification and exposes it in its API."
