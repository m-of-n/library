distillation:
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "519 verbatim entries N-001 to N-517 plus N-600 and N-601 (added by pass 2 at their source positions), in source order from §1 to Appendix C. Each entry is one contiguous run of source lines with its line range. Prose is blockquoted and ASN.1 fenced byte-exact. Flags: 197 lowercase/implied, 53 page break removed, 35 ASN.1, 3 RECOMMENDS only. Not reproduced: the §11 references, the document overview, history and the differences from RFC 3280, each omission noted in place. The Appendix A modules and Appendix C dumps are referenced, not repeated: they live verbatim in schema/ and examples/."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "625 entries R-0001 to R-0701. R-0700 (§6.1.4(k), last sentence) and R-0701 (§7.2, dNSName) were dropped by pass 1, added by pass 2, and are out of source order. Source count 532, extracted 450, reconciled keyword for keyword. The 82 OPTIONAL not extracted are 81 ASN.1 type-notation tokens and the line-3274 prose that names that token. The 10 RECOMMENDS are counted 0 and extracted as RECOMMENDED or NOT RECOMMENDED. 176 entries are verb none: 151 are §6 algorithm steps, 19 §7 rules and 6 Appendix B rules. 623 stated, 2 inferred (R-0334, R-0359, both restating lowercase source text). 474 testable, 107 partial, 44 not. The text is the RFC as published; RFC 6818, 9549, 9598, 9608 and 9618 are outside the source."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "Both Appendix A modules verbatim (A.1 PKIX1Explicit88 lines 6129–6954, A.2 PKIX1Implicit88 lines 6958–7405) and all 32 inline ASN.1 regions in 30 sections of §4.1–§5.3.3, each with its line range and sha256. Mechanical inline-to-appendix comparison: 13 findings, F-01 to F-13. Reference closure has 0 undefined references. The modules were not compiled (no ASN.1 compiler offline); pass 3 decoded all four Appendix C fixtures against them with a purpose-built DER walker. Furniture stripping removed 26 real blank lines at page joins, listed in the README."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "79 structures and 223 fields: §4.1 to §4.2.2.2, §5 to §5.3.3, §7, Appendix A.1, A.2 and B. That is 66 profiled structures, 6 retrieval formats (DER certificate and CRL, certs-only CMS, LDAP URIs, directory attributes), 5 path and CRL validation inputs and outputs, and 2 appendix-only. All 29 extension OIDs are registered with the criticality the source states. DER TLV layout per structure, with tags derived from X.680 and X.690 where the source is silent. Synthetic field names are marked name_kind synthetic. 459 requirements wired. 14 source defects. Excluded: the internals of RFC 2797 CMS and the ORAddress sub-structures below its top level."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "Partial by the source's nature: there is no wire protocol, since §3.4 and §3.5 defer it to other PKIX specs. 11 roles. 13 flows with 105 steps: certificate issuance; complete, delta and indirect CRL issuance; CDP, freshestCRL, AIA, SIA and CRL-AIA retrieval; trust anchor provisioning; validation and use; path discovery (the source's hints only); self-issued rollover; CA compromise. 9 algorithms: §6.1 with every input, state variable, lettered step and failure exit; §6.3 with every lettered step of §6.3.3; name constraints, §7.1 to §7.5 comparison, §5.2.4 delta combination and critical extensions. 40 error paths, 37 source defects and ambiguities, 20 not-defined items. 43 messages used, each defined in messages.yaml or marked external or not in source. protocol.md carries 15 Mermaid diagrams (13 sequence, 2 flowchart), not rendered."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "10 machines, 46 states, 92 transitions (25 inferred), 25 events. §6.1 path validation with the full §6.1.2 state vector and every lettered step of §6.1.3 to §6.1.5; the valid_policy_tree; §6.3.3(a) to (l) CRL validation with reasons_mask and cert_status; validity period (§4.1.2.5); revocation status and CRLReason (§3.3, §5.3.1); CRL issuance and cRLNumber (§5.2.3); cached CRLs; delta CRLs (§5.2.4); indirect-CRL attribution (§5.3.3); key rollover (§8). Every trigger is a messages.yaml entry or a named event. 25 open questions. not_modelled lists the rest."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "All 4 Appendix C examples as hex fixtures rebuilt from the dumpasn1 annotation (264 TLVs checked by offset and length). Pass 3 decoded all four against the schema with 0 schema or DER violations, and openssl asn1parse agrees. C.1, C.2 and C.4 signatures verify under the C.1 key; C.3 cannot be verified because its issuer key is not in the source. 86 vectors: 44 in-source (the fixtures, the C.1 to C.2 and C.4 path, and 39 prose or figure examples) and 42 constructed, mostly §6.1 and §6.3.3; 2 are marked ambiguous. No vector has been run through an implementation's path validator."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "A boundary survey of the format R-M-01 excludes. Eight analysis notes: R-M-01's reach, delegation control (boolean cA plus integer pathLenConstraint against R-M-10), name constraints against §6.1.4(g) (R-M-04, DEC-004), trust anchors, revocation against R-O-02, the policy machinery, DER against D-3, and the §8 security considerations. 10 adopt, 7 adapt, 15 reject. A mapping row for every bears_on id plus R-M-04, ADR-0001, ARCH-0001 §4.2, §4.3 and §6, DEC-002/D-3 (a stated non-mapping), DEC-003, DEC-004 and DEC-008. 14 open questions: five delegation-models answer claims for #64 to correct, and the source gaps passes 1 to 3 found. Our decisions were read from ARCH-0001 v0.1.1, ADR-0001, ARCH-0002 and the 2026-09-28 minute. Decides nothing."
      reviewed_by: ""
  passes:
    - pass: extract
      by: "claude-opus-5-5 (parallel agents: four by section range for normative and requirements, one per remaining artifact kind)"
      effort: high
      date: "2026-10-13"
      note: "run at high, not max, by decision of the record owner; the design-notes agent alone ran at max. Each agent read .cache/rfc-5280.txt directly, never the summary. FX-1 requires max on every pass, so this pass does not meet the bar and must be redone at max before status can become distilled."
    - pass: verify
      by: "claude-opus-5-5 (four agents independent of the extracting agents)"
      effort: high
      date: "2026-10-13"
      note: "run at high, not max. Recounted keywords, checked every quote and locator by position, walked the source for dropped statements and reproduced every fixture byte. Added R-0700, R-0701, N-600 and N-601; extended N-363 to §6.1.3(a)(4); fixed a spliced design-notes quote, hyphen joins, comment markers, header flags and 19 protocol locators."
    - pass: cross-check
      by: "claude-opus-5-5 (four agents; the design-notes agent ran at max)"
      effort: high
      date: "2026-10-13"
      note: "run at high, not max, except the design-notes agent. Every requirement field resolves in messages.yaml or the schema; every message a flow uses is defined, or marked external or not in source; every trigger is a message or a named event; all 625 requirements are cited by an artifact. Decoded C.1 to C.4 against the schema. Marked M01-T05 and M05-T10 inferred. Fixed two vector hex miscopies and the CRL size claim, and merged the source inconsistencies into design-notes open questions."
