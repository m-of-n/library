usefulness:
  verdict: useful
  reason: "R-M-01 names this document as what the native encoding SHALL NOT be, so the claim is only defensible if the record is real. Section 4.2.1.10 plus the 6.1.4 state variables are the closest thing in deployed PKI to scoped delegation, and #14 cannot be written honestly without them."
  assessed: "2026-10-08"
