# =====================================================================
# draft-ietf-cbor-cddl-modules messages -- for a LANGUAGE-STRUCTURE
# document, the messages are its syntactic constructs. Each entry below
# is one construct of the CDDL module structure, its parts, and its
# concrete syntax.
#
# `constrained_by` IS used throughout, unlike the sibling record
# rfc-8610 where it is omitted. The reason the omission does not apply
# here: this document carries 0 BCP 14 keywords but 92 requirement
# entries, every one of them a contiguous verbatim span with a precise
# locator, and every construct below has at least one. The ids are
# `kind: inferred` without exception -- they name a definition, a
# production or a lower-case force word, never an all-capitals keyword.
# `constrained_by` here therefore means "this is the text that fixes
# this field", not "this is an obligation on an implementer". Nothing is
# invented to fill the key; a construct with no requirement would carry
# an empty list, and none does.
#
# ENCODING. Every construct is PLAIN TEXT in a CDDL source file or on a
# command line. There is no CBOR, no COSE and no wire format anywhere in
# this document.
#
# Quoted sentences are the draft's own words. Anything marked OURS is
# this library's reading, not the document's.
#
# Source: draft-ietf-cbor-cddl-modules-07, cached source sha256
#   7cf825aaad43d3d4995bcd540d3865ee3f69dd3dd453be5761a02c009458a644
# =====================================================================
record: draft-ietf-cbor-cddl-modules
reviewed_by: ""

messages:

  - name: module
    locator: "§2.3"
    encoding: 'plain text; a CDDL source file'
    what_it_is: 'the unit the whole document is about: one CDDL file, read as a module'
    quote: 'A single CDDL file becomes a _module_ by processing the (zero or more) directives in it.'
    layout: >-
      A sequence of lines. Lines beginning ";#" are directives
      (potentially zero of them); every other line is basic CDDL,
      including ordinary ";" comments. There is no header, no manifest,
      no module declaration and no terminator: the file IS the module.
    fields:
      - name: directives
        type: 'zero or more `directive` lines'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0030', 'draft-ietf-cbor-cddl-modules#R-0033']
        notes: 'OURS: because zero is allowed, every basic CDDL file is already a module and module-hood is never declared. There is no construct that marks a file as intended for module use.'
      - name: rules
        type: 'basic CDDL, per RFC 8610'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0015', 'draft-ietf-cbor-cddl-modules#R-0023']
        notes: 'May be empty: §2.7 synthesises a module whose "CDDL file" is empty and therefore not provided at all (R-0069).'
      - name: name
        type: 'none -- the module has no in-file name'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0034']
        notes: 'OURS: the name is the FILENAME, assigned by whoever places the file on the search path, so it is not a property of the module''s contents.'
      - name: exports
        type: 'none -- no construct exists'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0046', 'draft-ietf-cbor-cddl-modules#R-0047']
        notes: >-
          OURS, and this is the finding library#39 wanted. "export",
          "public", "private" and "visible" occur ZERO times in the
          document. All selection is written by the consumer. A module
          cannot make a rule private, and an `include` reaches
          transitively through it into what IT imported (R-0046), so
          adding an import to a module changes what its consumers draw
          in.
      - name: version
        type: 'none -- no construct exists'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0019']
        notes: '§2 defers "unambiguous referencing into evolving specifications ("versioning")" to future work.'

  - name: directive
    locator: "Appendix A, §2.3"
    encoding: 'plain text; one line of a CDDL file, which basic CDDL reads as a comment'
    what_it_is: 'the single syntactic construct this document adds to CDDL'
    quote: 'directive = ";#" RS (%s"import" / %s"include") RS [from-clause] filename [as-clause] CRLF'
    layout: |
      ;# <keyword> [<selector>[,] ... from ] <filename> [as <id>]<CRLF>
      |  |         |                         |            |
      |  |         |                         |            `- as-clause  (optional)
      |  |         |                         `-------------- filename   (required)
      |  |         `---------------------------------------- from-clause (optional)
      |  `-------------------------------------------------- import | include, CASE-SENSITIVE
      `----------------------------------------------------- the two-character prefix, column 1
    fields:
      - name: prefix
        type: 'the literal `;#`'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0033', 'draft-ietf-cbor-cddl-modules#R-0078']
        notes: >-
          Must be at the start of the line, and the grammar admits no
          leading whitespace (grammar-gaps.derived.txt G-05). It is a
          valid basic-CDDL comment opener, which is the whole
          compatibility mechanism (R-0023).
      - name: separator after prefix
        type: '`RS` = `1*WS`, and `WS` = `SP` = `%x20`'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0078', 'draft-ietf-cbor-cddl-modules#R-0084', 'draft-ietf-cbor-cddl-modules#R-0085', 'draft-ietf-cbor-cddl-modules#R-0086']
        notes: >-
          One or more SPACES. No tab, anywhere in a directive. The
          grammar requires this separator where §2.3''s prose does not --
          grammar-gaps.derived.txt G-03.
      - name: keyword
        type: '`%s"import"` / `%s"include"`'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0045', 'draft-ietf-cbor-cddl-modules#R-0078']
        notes: 'Case-sensitive: the `%s` prefix is RFC 7405 notation, which is why Appendix A cites [RFC7405] alongside [STD68] (R-0077).'
      - name: from-clause
        type: '`1*(id-or-all [","] RS) %s"from" RS`'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0054', 'draft-ietf-cbor-cddl-modules#R-0079']
        notes: 'Its presence changes the closure behaviour of `include` from transitive (R-0046) to exactly-the-named (R-0056). The comma is OPTIONAL; the required separator is whitespace.'
      - name: filename
        type: '`1*("-" / "." / %x30-39 / %x41-5a / "_" / %x61-7a)`'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0034', 'draft-ietf-cbor-cddl-modules#R-0081']
        notes: 'The module name. No "/" is admitted, so it is flat and unqualified -- grammar-gaps.derived.txt G-08.'
      - name: as-clause
        type: '`RS %s"as" RS id`'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0028', 'draft-ietf-cbor-cddl-modules#R-0052', 'draft-ietf-cbor-cddl-modules#R-0080']
        notes: 'The namespace prefix, chosen by the IMPORTING module. A single `id`, so it cannot be hierarchical.'
      - name: terminator
        type: '`CRLF` = `%x0A / %x0D.0A`'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0078', 'draft-ietf-cbor-cddl-modules#R-0087']
        notes: >-
          Redefined against STD 68''s core rule to admit a bare LF
          (grammar-gaps.derived.txt G-02). Because it is required, a
          directive on an unterminated final line is not a directive
          (G-06), and no trailing space is admitted before it (G-07).

  - name: 'include directive, unqualified'
    locator: "§2.5"
    encoding: 'plain text'
    concrete_syntax: ';# include <module>'
    what_it_is: 'draws every rule of a module into the importing module'
    quote: 'include, which includes all the rules from a module (which includes the ones imported/included there, transitively), or specific explicitly selected rules (clause ending in "from");'
    layout: 'The directive line; the composed output carries the module''s rules under their own, unprefixed names.'
    fields:
      - name: closure
        type: 'transitive, THROUGH the module into what it itself imported or included'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0046']
        notes: 'OURS: this is the non-local effect. Adding an import to a module changes what every consumer''s unqualified include draws in.'
      - name: 'intended use'
        type: 'composing one model from parts under one author''s control'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0048']
        notes: 'Advisory; "more useful for" admits no decision procedure. It is the nearest thing the document has to a trust boundary.'
    no_example_in_source: true
    notes: 'No example in the document exercises this form. Every printed `include` carries a from-clause (source lines 375, 388).'

  - name: 'include directive, explicit selection'
    locator: "§2.6 (include)"
    encoding: 'plain text'
    concrete_syntax: ';# include <name>[, <name>...] from <module> [as <prefix>]'
    what_it_is: 'draws exactly the named rules, and nothing they reference'
    quote: 'With include, only exactly the rules mentioned are included:'
    layout: 'Shown at source lines 375 and 388; outputs at 379-381 and 399-401. examples/vectors.yaml V-0006..V-0009.'
    fields:
      - name: closure
        type: 'NOT transitive'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0056', 'draft-ietf-cbor-cddl-modules#R-0058']
        notes: 'OURS: so `include` has two different closure semantics depending on whether a from-clause is present. The document does not remark on it.'
      - name: 'selector spelling under an as clause'
        type: 'the document writes the POST-prefix spelling (`cose.label`)'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0057']
        notes: >-
          That spelling is what Appendix A''s `id` cannot match
          (grammar-gaps.derived.txt G-01). The PRE-prefix spelling with
          an `as` clause is never shown for `include`, and its behaviour
          -- in particular whether it emits an alias as the `import`
          case does -- is unknown (G-21).
      - name: alias emitted
        type: 'none, in the one example shown'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0058']
        notes: 'Output lines 399-401 carry `cose.label` and `cose.values` and no unprefixed alias.'

  - name: 'import directive, unqualified'
    locator: "§2.5"
    encoding: 'plain text'
    concrete_syntax: ';# import <module> [as <prefix>]'
    what_it_is: 'draws in only what the importing module actually references, plus its closure'
    quote: 'import, which is similar to include but includes only those rules from the module that are referenced from the importing module, implicitly or explicitly (clause ending in "from"), including the rules that are referenced from these rules, transitively.'
    layout: 'Shown at source lines 311 and 343; outputs at 315-325 and 347-357. examples/vectors.yaml V-0002..V-0005.'
    fields:
      - name: selection criterion
        type: 'reachability from the importing module'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0047']
        notes: 'OURS: the producer declares nothing. Reachability is computed over the consumer''s own rules.'
      - name: closure
        type: 'transitive over references'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0047', 'draft-ietf-cbor-cddl-modules#R-0060']
      - name: 'intended use'
        type: 'treating a module as a library'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0048', 'draft-ietf-cbor-cddl-modules#R-0051']
        notes: 'Appropriate "for using libraries that are well known to the importing specification" -- a condition with no test.'

  - name: 'import directive, explicit selection'
    locator: "§2.6 (import)"
    encoding: 'plain text'
    concrete_syntax: ';# import <name>[, <name>...] from <module> [as <prefix>]'
    what_it_is: 'draws the named rules plus the transitive closure of what they reference'
    quote: 'An import however also draws in the transitive closure of the rules referenced:'
    layout: 'Shown at source lines 414 and 441; outputs at 420-435 and 455-471. examples/vectors.yaml V-0010..V-0013.'
    fields:
      - name: closure
        type: 'transitive -- the opposite of explicit `include`'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0060', 'draft-ietf-cbor-cddl-modules#R-0061']
      - name: 'alias emission'
        type: 'one extra rule, `<name> = <prefix>.<name>`, iff the selector is written WITHOUT the prefix'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0063', 'draft-ietf-cbor-cddl-modules#R-0064']
        notes: >-
          The two directives at lines 414 and 441 differ only in the
          spelling of the selector and their outputs differ by exactly
          that alias line (456). The rule is demonstrated, never stated
          -- grammar-gaps.derived.txt G-21.

  - name: 'wild-card selector'
    locator: "§2.6, Appendix A"
    encoding: 'plain text'
    concrete_syntax: ';# <keyword> * from <module>'
    what_it_is: 'a selector standing for all rules'
    quote: 'id-or-all = id / "*"'
    layout: 'Admitted by the grammar; no example in the document uses it.'
    fields:
      - name: meaning
        type: 'not stated'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0054', 'draft-ietf-cbor-cddl-modules#R-0083']
        notes: >-
          The document offers "a wild-card "*" for all rules" and never
          says how `include * from m` differs from `include m`, nor what
          `import * from m` means given that import''s definition is
          reachability from the consumer. grammar-gaps.derived.txt G-15.
    no_example_in_source: true

  - name: 'prefixed rule name'
    locator: "§2.2, §2.5"
    encoding: 'plain text; a basic-CDDL rule name in the composed output'
    concrete_syntax: '<prefix>.<original name>'
    what_it_is: 'what the as clause produces: the imported rule, RENAMED'
    quote: 'To be able to manage names in such a way that collisions can be avoided, we introduce means to prepend a prefix to the names of rules being imported: the "as" clause.'
    layout: 'Observed in the composed outputs as `cose.COSE_Key`, `cose.label`, `cose.values`, `cose.header_map`, `cose.Generic_Headers`, `cose.empty_or_serialized_map` (source lines 348, 356, 357, 423, 427, 421).'
    fields:
      - name: separator
        type: 'the character `.`'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0028']
        notes: >-
          OURS: a legal interior character of an RFC 8610 `id`, which is
          what makes the prefixed name an ordinary basic-CDDL rule name
          and the whole scheme compatible. It is NOT legal in Appendix
          A''s own `id`, so the emitted name cannot be written back into
          a from-clause -- grammar-gaps.derived.txt G-10.
      - name: 'scope created'
        type: 'none'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0028', 'draft-ietf-cbor-cddl-modules#R-0015']
        notes: >-
          OURS, and this is the finding library#39 wanted. There is one
          flat global name space after composition, exactly as RFC 8610
          has; prefixing makes the names longer, not scoped. Two
          modules imported `as` the same prefix collide under R-0015''s
          rule with no diagnostic specified (G-11).
      - name: 'exempt names'
        type: 'the RFC 8610 Appendix D prelude'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0053']
        notes: '"such as tstr and any" -- the exempt set is 40 rules in another document, incorporated by reference. G-14.'
      - name: 'socket and plug names'
        type: 'not stated whether prefixed'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0028', 'draft-ietf-cbor-cddl-modules#R-0082']
        notes: >-
          "socket", "plug" and "$$" occur ZERO times in the document.
          Appendix A''s `id` admits "$" in every position, so a socket
          is selectable; §2.2 states the prefixing rule without
          exception; §2.5''s only exception is the prelude. Either
          answer breaks something -- grammar-gaps.derived.txt G-13.

  - name: 'alias rule'
    locator: "§2.6 (import)"
    encoding: 'plain text; a basic-CDDL rule in the composed output'
    concrete_syntax: '<original name> = <prefix>.<original name>'
    what_it_is: 'an extra rule the composer emits so the unprefixed name still resolves'
    quote: 'Note how an additional rule provides an alias for empty_or_serialized_map that does not have the namespace prefix:'
    layout: 'Exactly one line, emitted immediately after the importing module''s own rules: source line 456, `empty_or_serialized_map = cose.empty_or_serialized_map`.'
    fields:
      - name: trigger
        type: 'the selector written without the prefix, with an as clause present'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0063', 'draft-ietf-cbor-cddl-modules#R-0064']
      - name: 'effect on the name space'
        type: 'the name exists BOTH prefixed and unprefixed'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0064']
        notes: 'OURS: so the alias form reintroduces exactly the namespace pollution the as clause was introduced to prevent (R-0052), for the names it aliases.'

  - name: 'composed output'
    locator: "§2.5, §2.6, §2.7"
    encoding: 'plain text; basic CDDL, which the document calls "CDDL 1.0"'
    what_it_is: 'the result of processing a module tree: one flat basic-CDDL model'
    quote: 'This results in the following CDDL 1.0 specification:'
    layout: >-
      A flat sequence of basic-CDDL rules with no directives in it. In
      all seven printed instances the importing module's own rules come
      first, then the selected or reachable rules, then their closure --
      but the document states no emission rule, and that order is
      semantic for any model using "/=" or "//="
      (grammar-gaps.derived.txt G-12).
    fields:
      - name: directives
        type: 'none'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0050']
        notes: 'OURS: so the transformation is ONE-WAY. A composed model cannot be read back as the module structure that produced it.'
      - name: comments
        type: 'none, in any of the seven printed outputs'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0050']
        notes: >-
          OURS, checked against the document alone: not one ";"
          character appears in any output block. Since directives ARE
          comments, discarding comments is how the output becomes
          "CDDL 1.0" -- and it discards a module''s documentation with
          them. grammar-gaps.derived.txt G-17.
      - name: 'emission order'
        type: 'not specified'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0036']
        notes: 'The word "order" appears once in the document (line 181) and does not refer to output order; "precedence" appears once (line 252) and is explicitly left undefined.'
      - name: 'line wrapping'
        type: 'RFC 8792 single-backslash strategy, in two of the seven outputs'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0062']
        notes: 'Source lines 418 and 453 carry the banner; the wrap falls both times on `cose.empty_or_serialized_map`, whose unwrapped line is 72 columns. Unwrapped in schema/cose-closure-unfolded.derived.cddl.'

  - name: CDDL_INCLUDE_PATH
    locator: "§2.4"
    encoding: 'plain text; an environment variable'
    what_it_is: 'the search path a module name is resolved against -- in the Appendix B TOOL, not in the specification'
    quote: 'It is a colon-separated list of pathnames to directories, with one special feature: an empty element points to the tool''s own collection.'
    layout: '<dir>:<dir>:...  where an EMPTY element denotes the tool''s bundled collection. Default: `.:`'
    normative: false
    normative_note: 'Scoped to "the CDDL Tool described in Appendix B" (R-0038), and Appendix B opens "This appendix is for information only." (R-0088).'
    fields:
      - name: elements
        type: 'directory pathnames, colon-separated'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0039']
      - name: 'empty element'
        type: 'reserved spelling, denoting the tool''s own collection'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0039', 'draft-ietf-cbor-cddl-modules#R-0040']
        notes: 'That collection holds "fragments of extracted CDDL from published RFCs, using names such as rfc9052" -- so the de facto global namespace for module names is the RFC series.'
      - name: default
        type: 'the two characters `.:`'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0042', 'draft-ietf-cbor-cddl-modules#R-0043']
        notes: >-
          OURS: the CURRENT DIRECTORY comes first, ahead of the curated
          collection, so a local file named `rfc9052` shadows the
          bundled RFC 9052 extract silently. No diagnostic is specified.
      - name: 'precedence between directories, in general'
        type: 'undefined by the specification'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0036']
        notes: '"intentionally not fully defined in this specification", deferred to "the context of the models".'

  - name: '-i command-line argument'
    locator: "§2.7"
    encoding: 'plain text; a command-line argument'
    concrete_syntax: '-i<prefix>=<module>'
    what_it_is: 'a command-line spelling of an import directive'
    quote: 'The command line argument -icose=rfc9052 is a shortcut for'
    layout: 'Source line 481, `$ cddlc -2tcddl -icose=rfc9052 -scose.COSE_Key`; its stated equivalent is source line 485, `;# import rfc9052 as cose`.'
    fields:
      - name: equivalence
        type: 'exactly `;# import <module> as <prefix>`'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0067']
        notes: 'OURS: so a module reference, and therefore the shape of the composed model, can originate outside every file in the build.'

  - name: '-s command-line argument and the synthesized root rule'
    locator: "§2.7"
    encoding: 'plain text; a command-line argument, plus one emitted rule'
    concrete_syntax: '-s<rule name>   ->   `$.start.$ = <rule name>`'
    what_it_is: 'names the root of the module tree, emitted as a synthesized rule'
    quote: 'Together with the start (root) rule name, cose.COSE_Key, supplied by -scose.COSE_Key, this results in the following CDDL 1.0 specification:'
    layout: 'Source line 509 is the emitted rule: `$.start.$ = cose.COSE_Key`.'
    fields:
      - name: 'synthesized rule name'
        type: 'the literal `$.start.$`'
        required: true
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0068']
        notes: >-
          Occurs exactly ONCE in the document, at source line 509, and
          that one occurrence IS its definition; what the document never
          introduces is the convention behind the spelling. It is a
          valid RFC 8610 `id`, and it is spelled like an RFC 8610 §3.9
          TYPE SOCKET (leading "$") yet defined with "=" rather than
          "/=". grammar-gaps.derived.txt G-18. [correction 2026-10-20,
          cross-check pass: this read "Appears exactly ONCE in the
          document and is nowhere defined", the wording pass 2
          corrected in G-18 and left standing here.]
      - name: 'in-file spelling'
        type: 'none -- there is no directive that declares a root'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0066']
        notes: 'OURS: so the entry point of a composed model is external to every file in it. Compare RFC 9052 §1.4, which requires the initial nonterminal to come first in the file.'
      - name: 'module with no file at all'
        type: 'permitted'
        required: false
        constrained_by: ['draft-ietf-cbor-cddl-modules#R-0069']
        notes: '"the module synthesized from the command line had an empty CDDL file, which therefore was not provided".'

# ---------------------------------------------------------------------
# Constructs this document does NOT define, listed so the absence is on
# the record rather than inferred from silence. Each was searched for
# mechanically across all 784 lines.
# ---------------------------------------------------------------------
absent_constructs:
  - name: 'export declaration'
    searched_for: ['export', 'private', 'visib']
    occurrences: 0
    note: '"public" is counted separately: it occurs ONCE, inside "date of publication" in the copyright boilerplate (source line 80), and nowhere as a visibility term.'
  - name: 'socket / plug interaction'
    searched_for: ['socket', 'plug', '$$']
    occurrences: 0
    note: 'RFC 8610 §3.9''s extension mechanism is neither amended nor exempted nor mentioned.'
  - name: 'accretive choice under composition'
    searched_for: ['/=', '//=']
    occurrences: 0
    note: 'So nothing is said about RFC 8610''s order-sensitive `/=` and `//=` surviving composition.'
  - name: 'module version or digest'
    searched_for: ['version', 'versions', 'versioning']
    occurrences: 4
    note: >-
      Lines 188 ("versioning", deferred to future work), 266 ("Future
      versions" of the tool), 704 ("Ruby version") and 708 ("cddlc of at
      least version 0.2.5"). None is a version on a module reference. A
      naive search returns eight lines because "conversion" contains the
      substring (607, 652, 694, 703).
  - name: 'emission order rule'
