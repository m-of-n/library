# =====================================================================
# name-resolution.derived.yaml
#
# DERIVED - not verbatim. The STRUCTURE is this library's; every `quote`
# field is the document's own wording, with a requirement id and a
# locator. Cite ../requirements.yaml for the text; cite this file only
# as our model of it.
#
# What it is: how a module is NAMED and how that name is RESOLVED to
# bytes, as data. It exists because that question is the one this record
# was read to answer (library#39, and rfc-8610 design-notes open
# question 4), and because the answer is scattered across §2.2, §2.4,
# §3, §4 and Appendix A rather than stated in one place.
#
# Source: draft-ietf-cbor-cddl-modules-07, sha256
#   7cf825aaad43d3d4995bcd540d3865ee3f69dd3dd453be5761a02c009458a644
# =====================================================================
record: draft-ietf-cbor-cddl-modules
reviewed_by: ""

module_name:
  what_it_is: 'a bare filename, resolved against directories supplied by the environment'
  quote: 'We assume that module names are filenames taken from one of several source directories available to the CDDL module structure processor via the environment.'
  requirement: 'draft-ietf-cbor-cddl-modules#R-0034'
  locator: '§2.4'
  syntax: 'filename = 1*("-" / "." / %x30-39 / %x41-5a / "_" / %x61-7a)'
  syntax_requirement: 'draft-ietf-cbor-cddl-modules#R-0081'
  character_set: '- . 0-9 A-Z _ a-z'
  admits_path_separator: false
  hierarchical: false
  carries_a_principal: false
  carries_a_version: false
  carries_a_digest: false
  carries_a_uri: false
  uri_refused_explicitly: true
  uri_refusal_quote: 'This avoids the need to nail down brittle pathnames or (partial?) URIs into the CDDL files.'
  uri_refusal_requirement: 'draft-ietf-cbor-cddl-modules#R-0035'
  ours_note: >-
    OURS. Three of those five `false`s are what ARCH-0002 P1 asks for and
    does not get: there is no defining key, no version and no digest in a
    module reference, so the reference is not self-authenticating and two
    modules offered under one name are indistinguishable from each other.
    The fourth is refused on purpose (R-0035) and the refusal removes the
    one spelling - a URI - that could have made the reference describe its
    own origin.

authority:
  iana_actions: 'none'
  iana_quote: 'This document has no IANA actions.'
  iana_requirement: 'draft-ietf-cbor-cddl-modules#R-0076'
  registry_defined_by_this_document: false
  registry_depended_on_by_this_document: false
  de_facto_namespace: 'the RFC series, via the tool''s bundled collection'
  de_facto_quote: 'This collection contains fragments of extracted CDDL from published RFCs, using names such as rfc9052.'
  de_facto_requirement: 'draft-ietf-cbor-cddl-modules#R-0040'
  de_facto_is_normative: false
  de_facto_scope_quote: 'This appendix is for information only.'
  de_facto_scope_requirement: 'draft-ietf-cbor-cddl-modules#R-0088'
  ours_note: >-
    OURS, and it is the finding library#39 wanted. The SPECIFICATION
    creates no registry and depends on none, so adopting the module
    structure adds no fourth registry to option 5's inheritance. But the
    only resolution mechanism the document actually describes keys its
    bundled modules on RFC NUMBERS, and that mechanism sits inside an
    appendix declared informative. So the authority is not absent: it is
    unstated. Whoever populates the search path is the name authority,
    and §3 says so in its own words (R-0071, R-0072).

resolution:
  specified_by_this_document: false
  deferral_quote: 'The exact way how these source directories and possibly a precedence between them are established is intentionally not fully defined in this specification; it is expected that this will be specified in the context of the models just as the way they are intended to be used will be.'
  deferral_requirement: 'draft-ietf-cbor-cddl-modules#R-0036'
  precedence_between_directories: 'undefined by the specification'
  described_mechanism:
    scope: 'the CDDL Tool of Appendix B only, which is informative'
    variable: 'CDDL_INCLUDE_PATH'
    quote: 'In the module structure implementation that is part of the CDDL Tool described in Appendix B, the set of sources is determined from an environment variable, CDDL_INCLUDE_PATH, which is modeled after usual command-line search paths.'
    requirement: 'draft-ietf-cbor-cddl-modules#R-0038'
    syntax: 'colon-separated list of directory pathnames; an EMPTY element denotes the tool''s own bundled collection'
    syntax_quote: 'It is a colon-separated list of pathnames to directories, with one special feature: an empty element points to the tool''s own collection.'
    syntax_requirement: 'draft-ietf-cbor-cddl-modules#R-0039'
    default_value: '.:'
    default_value_locator: 'source line 273'
    default_order: 'the current directory, then the tool''s collection'
    default_order_quote: 'That is: files are found in the current directory (.) and, if not found there, cddlc’s collection.'
    default_order_requirement: 'draft-ietf-cbor-cddl-modules#R-0043'
  ours_note: >-
    OURS. The default path puts the CURRENT DIRECTORY FIRST, ahead of the
    curated collection. A file named rfc9052 in the working directory
    shadows the bundled RFC 9052 extract, silently, with no diagnostic
    specified anywhere. That is textbook dependency confusion, and it is
    the default. The document does not call it that; §3 calls the family
    "the possibility of supply-chain attacks on the modules imported"
    (R-0072).

namespacing:
  mechanism: 'textual prefixing of imported rule names'
  quote: 'To be able to manage names in such a way that collisions can be avoided, we introduce means to prepend a prefix to the names of rules being imported: the "as" clause.'
  requirement: 'draft-ietf-cbor-cddl-modules#R-0028'
  prefix_chosen_by: 'the IMPORTING module, not the module being imported'
  prefix_chosen_by_quote: 'However, if it is not acceptable that the library can pollute the namespace of the importing module, the import directive can specify a namespace prefix ("as" clause):'
  prefix_chosen_by_requirement: 'draft-ietf-cbor-cddl-modules#R-0052'
  prefix_syntax: 'as-clause = RS %s"as" RS id'
  prefix_syntax_requirement: 'draft-ietf-cbor-cddl-modules#R-0080'
  prefix_may_be_hierarchical: false
  creates_a_scope: false
  creates_longer_names_in_one_flat_space: true
  evidence: 'the emitted rules are spelled cose.COSE_Key, cose.label, cose.values, cose.Generic_Headers (source lines 348, 356, 357, 427) - ordinary basic-CDDL rule names in the one global name space RFC 8610 has'
  exempt_names: 'the RFC 8610 Appendix D prelude, by reference'
  exempt_quote: 'Note how the imported names are prefixed with cose. as specified in the import directive, but CDDL prelude (Appendix D of [RFC8610]) names such as tstr and any are not.'
  exempt_requirement: 'draft-ietf-cbor-cddl-modules#R-0053'
  socket_names_prefixed: 'not stated'
  socket_names_note: 'see grammar-gaps.derived.txt G-13: "socket", "plug" and "$$" occur zero times in the document, and either answer breaks something'
  collision_of_two_prefixes: 'not stated; falls back to RFC 8610 name collision - grammar-gaps.derived.txt G-11'
  ours_note: >-
    OURS, and this is the answer to the second question library#39 asked.
    The `as` clause does NOT introduce a namespace. It renames, into the
    same single flat space RFC 8610 already had, using a dot that is legal
    in an RFC 8610 identifier. The prefix is chosen by the consumer and
    bound to nothing, so it is ADR-0001's rejected shape exactly: escape
    from a collision, not a namespace. What it does buy is real and worth
    recording: naming becomes relative to the COMPOSING FILE rather than
    global, which is the right direction for ARCH-0002 P1. What it does
    not buy is a principal, and without one two parties still cannot name
    the same thing differently without a third party to arbitrate.

selection:
  declared_by_producer: false
  declared_by_consumer: true
  producer_side_constructs: []
  consumer_side_constructs:
    - name: 'include <module>'
      draws_in: 'every rule of the module, TRANSITIVELY through what that module itself imported or included'
      quote: 'include, which includes all the rules from a module (which includes the ones imported/included there, transitively), or specific explicitly selected rules (clause ending in "from");'
      requirement: 'draft-ietf-cbor-cddl-modules#R-0046'
    - name: 'include <names> from <module>'
      draws_in: 'exactly the named rules, NOT transitively'
      quote: 'With include, only exactly the rules mentioned are included:'
      requirement: 'draft-ietf-cbor-cddl-modules#R-0056'
    - name: 'import <module>'
      draws_in: 'only the rules the importing module references, plus their transitive closure'
      quote: 'import, which is similar to include but includes only those rules from the module that are referenced from the importing module, implicitly or explicitly (clause ending in "from"), including the rules that are referenced from these rules, transitively.'
      requirement: 'draft-ietf-cbor-cddl-modules#R-0047'
    - name: 'import <names> from <module>'
      draws_in: 'the named rules plus the transitive closure of what they reference'
      quote: 'An import however also draws in the transitive closure of the rules referenced:'
      requirement: 'draft-ietf-cbor-cddl-modules#R-0060'
    - name: '<either> * from <module>'
      draws_in: 'not stated; the wild-card is admitted by id-or-all and exercised by no example'
      quote: 'Both import and include directives can be augmented by an explicit mentioning of rule names (clause ending in "from") or a wild-card "*" for all rules.'
      requirement: 'draft-ietf-cbor-cddl-modules#R-0054'
  ours_note: >-
    OURS, and this is the answer to the first question library#39 asked.
    The producer-side column is EMPTY. A module publishes no export list,
    marks nothing private, and cannot stop a consumer reaching through it
    into its own dependencies. Every one of the five selection forms is
    written by the consumer. So the module structure gives CDDL a
    CONSUMER-SIDE import boundary and no producer-side export boundary at
    all - which means rfc-8610's finding stands unchanged: nothing in the
    language distinguishes a native schema from an export schema.

what_a_module_declares_about_itself:
  module_hood: 'nothing - every CDDL file is already a module'
  module_hood_quote: 'A single CDDL file becomes a _module_ by processing the (zero or more) directives in it.'
  module_hood_requirement: 'draft-ietf-cbor-cddl-modules#R-0030'
  its_name: 'nothing - the name is the filename, chosen by whoever puts the file on the search path'
  its_exports: 'nothing - see `selection`'
  its_version: 'nothing - §2 defers versioning to future work (R-0019)'
  its_root_rule: 'nothing - the root is a command-line concern (R-0066, R-0068)'
  what_it_does_declare: 'only what it imports, and only in comments'
  what_it_does_declare_quote: 'Directives are parsed as comments in basic CDDL, so that each module source file can at the same time be basic CDDL on its own.'
  what_it_does_declare_requirement: 'draft-ietf-cbor-cddl-modules#R-0023'
  ours_note: >-
    OURS. Read down that list: a module file declares its DEPENDENCIES and
    nothing else, and it declares them in a form every pre-existing tool
    is required to ignore. That is the whole design, and it is coherent -
    it is what "bidirectional compatibility" (R-0012) means. The cost is
    that the mechanism is invisible to exactly the tools that would
    otherwise enforce it.

one_way:
  composition_is_reversible: false
  evidence: 'the seven composed outputs the document prints contain no ";" character at all; see grammar-gaps.derived.txt G-17'
  consequence_ours: >-
    OURS. Directives are comments, the output has no comments, so the
    output has no directives: a composed model cannot be read back as the
    module structure that produced it. Any provenance you want to survive
    the build has to be recorded outside the CDDL - which is where §3
    puts it ("need to ascertain the provenance of the modules they
    combine", R-0071) without saying where "outside" is.
