# =====================================================================
# draft-ietf-cbor-cddl-modules test vectors -- EVERY block the document
# prints, in source order, with no gaps: 19 vectors, V-0001 to V-0019.
#
# Each `text:` block is lifted from the cached source BY LINE RANGE, BY
# SCRIPT, never retyped. The only transformation is removal of the
# common left margin (the Internet-Draft's three columns); relative
# indentation inside a block is the source's, including the 63-space
# continuation of the two RFC 8792 '\' wraps. Each vector names its own
# line range, and the generator asserts the round trip: what a YAML
# parser reads back out of this file is byte-identical to the dedented
# source slice.
#
# WHAT A "VECTOR" IS HERE. This document defines a notation and a
# composition, not a wire format, so there are no CBOR bytes to check.
# A vector is one printed block, with its role in the document and what
# can be checked about it. Nine are module-structured INPUTS or command
# lines, seven are composed basic-CDDL OUTPUTS, one is the ABNF grammar,
# and two are shell commands.
#
# `expect` VOCABULARY, four values:
#   valid         - well formed under the grammar named in `expect_basis`
#   invalid       - NOT derivable under the grammar named in
#                   `expect_basis`. Both occurrences are the DOCUMENT
#                   CONTRADICTING ITSELF, not our judgement: it prints
#                   the block as a working example and its own Appendix
#                   A cannot derive it.
#   incomplete    - parses, but has rule names that resolve to nothing.
#                   Every module INPUT is deliberately incomplete -- the
#                   dangling name is what the directive resolves. ONE
#                   OUTPUT is incomplete and should not be: V-0009.
#   not-applicable - a shell command line or an environment-variable
#                   value; no CDDL grammar applies.
#
# No negative was invented. The two `invalid` and the one unintended
# `incomplete` are defects of the source, reported and not repaired
# (../README.md defects 1 and 2).
#
# Source: draft-ietf-cbor-cddl-modules-07, cached source sha256
#   7cf825aaad43d3d4995bcd540d3865ee3f69dd3dd453be5761a02c009458a644
# =====================================================================
