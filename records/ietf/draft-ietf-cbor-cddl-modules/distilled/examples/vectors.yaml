  - id: 'draft-ietf-cbor-cddl-modules#V-0017'
    locator: 'Appendix A (source lines 677-688)'
    source_lines: '677-688'
    role: 'the grammar itself'
    what: 'all ten ABNF productions of the directive line'
    expect: 'valid'
    expect_basis: 'RFC 5234 / RFC 7405 ABNF, after the margin is removed'
    constrains:
      - 'draft-ietf-cbor-cddl-modules#R-0077'
      - 'draft-ietf-cbor-cddl-modules#R-0078'
      - 'draft-ietf-cbor-cddl-modules#R-0079'
      - 'draft-ietf-cbor-cddl-modules#R-0080'
      - 'draft-ietf-cbor-cddl-modules#R-0081'
      - 'draft-ietf-cbor-cddl-modules#R-0082'
      - 'draft-ietf-cbor-cddl-modules#R-0083'
      - 'draft-ietf-cbor-cddl-modules#R-0084'
      - 'draft-ietf-cbor-cddl-modules#R-0085'
      - 'draft-ietf-cbor-cddl-modules#R-0086'
      - 'draft-ietf-cbor-cddl-modules#R-0087'
    text: |
      directive = ";#" RS (%s"import" / %s"include") RS [from-clause]
                          filename [as-clause] CRLF
      from-clause = 1*(id-or-all [","] RS) %s"from" RS
      as-clause = RS %s"as" RS id
      filename = 1*("-" / "." / %x30-39 / %x41-5a / "_" / %x61-7a)
      id = ("$" / %x40-5a / "_" / %x61-7a)
           *("$" / %x30-39 / %x40-5a / "_" / %x61-7a)
      id-or-all = id / "*"
      RS = 1*WS
      WS = SP
      SP = %x20
      CRLF = %x0A / %x0D.0A
    notes: 'Carried here as a vector so the examples set is complete; the authoritative capture is ../schema/module-directives.abnf, byte-for-byte with the margin intact (region sha256 43c17148af31265a171f2e722b24d2e0063d0ab253d8b681cc1c223d5df696ab), with a margin-removed companion for tools. As printed in the draft the grammar is NOT readable by an ABNF tool: RFC 5234 reads an indented line as a continuation, so the whole thing collapses into one `directive` rule. The `expect: valid` above is against the DEDENTED form and says so in `expect_basis`.'
