  - id: "draft-ietf-cbor-cddl-modules#R-0078"
    object: 'the directive production'
    field: 'the production itself is the obligation; no BCP 14 keyword backs it. Quoted across the source''s two lines (677/678) after whitespace collapsing. Note four things the production fixes and no prose states: ";#" is followed by REQUIRED whitespace, which R-0033 does not require; the keyword is case-sensitive (%s); the from-clause precedes the filename; and a directive must be terminated by CRLF, so an unterminated last line of a file is not a directive'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix A"
    text: 'directive = ";#" RS (%s"import" / %s"include") RS [from-clause] filename [as-clause] CRLF'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "draft-ietf-cbor-cddl-modules#R-0079"
    object: 'the from-clause production'
    field: 'the production itself is the obligation; no BCP 14 keyword backs it. The comma is OPTIONAL and the separator that is required is whitespace, so ";# include label values from rfc9052" is grammatical. "from" is itself matched by `id`, so a module with a rule actually named `from` cannot be selected unambiguously - schema/grammar-gaps.derived.txt G-04'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix A"
    text: 'from-clause = 1*(id-or-all [","] RS) %s"from" RS'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "draft-ietf-cbor-cddl-modules#R-0080"
    object: 'the as-clause production'
    field: 'the production itself is the obligation; no BCP 14 keyword backs it. The prefix is a single `id`, so it cannot itself be dotted or hierarchical, and nothing in the grammar or the prose prevents two as-clauses in one module from choosing the same prefix for different modules'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix A"
    text: 'as-clause = RS %s"as" RS id'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "draft-ietf-cbor-cddl-modules#R-0081"
    object: 'the filename production - the syntax of a module name'
    field: 'the production itself is the obligation; no BCP 14 keyword backs it. THIS IS THE WHOLE SYNTAX OF A MODULE NAME. It admits "-", ".", digits, A-Z, "_" and a-z and NOTHING ELSE - so no "/", hence no path and no hierarchy; a module namespace is FLAT. It also admits "." and ".." and a bare "-" as whole filenames'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix A"
    text: 'filename = 1*("-" / "." / %x30-39 / %x41-5a / "_" / %x61-7a)'
    kind: inferred
