    field: 'the production itself is the obligation; no BCP 14 keyword backs it. Quoted across the source''s two lines (682/683) after whitespace collapsing. IT DOES NOT HOLD AS WRITTEN: it admits neither "-" nor ".", so it is strictly narrower than RFC 8610''s own `id` (EALPHA *(*("-" / ".") (EALPHA / DIGIT))) and cannot match the dotted selectors this document''s own §2.6 examples write - schema/grammar-gaps.derived.txt G-01. It does admit "$", so a socket name can be selected'
    verb: none
    actor: 'tool implementer'
    locator: "Appendix A"
    text: 'id = ("$" / %x40-5a / "_" / %x61-7a) *("$" / %x30-39 / %x40-5a / "_" / %x61-7a)'
    kind: inferred
    testable: 'yes'
    status: active
