    field: 'no BCP 14 keyword backs this; the force is that Appendix A is the specification of directive syntax, and it carries NO "for information only" line where Appendix B does (R-0088). The metalanguage is STD 68 (RFC 5234) plus RFC 7405''s case-sensitive string notation, which is why "%s" appears before each literal keyword'
