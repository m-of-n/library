reconciliation: 'draft-ietf-cbor-cddl-modules-07 contains ZERO all-capitals BCP 14 keyword occurrences in 26 KB, and bin/bcp14-count reports 0. Both counts are therefore 0 and nothing is reconciled away. This reconciliation exists for two other reasons: bin/validate makes a source count of 0 an ERROR unless the record states the document''s own normative baseline, and 92 entries against 0 keywords needs explaining. THE DOCUMENT DECLARES BCP 14 AND THEN NEVER EXERCISES IT. Section 1.1 (source lines 146-150) recites all eleven keywords in the standard boilerplate; those are the ONLY all-capitals keyword occurrences anywhere in the 784 lines, and bin/_bcp14''s filter removes exactly that paragraph. A document that imports the vocabulary and uses none of it is reporting something about its own nature, and it is this: ITS NORMATIVE BASELINE IS A GRAMMAR AND A SET OF COMPOSITION RULES, NOT OBLIGATIONS ON AN ACTOR. The whole of the mechanism is carried by (i) Appendix A''s ten ABNF productions, which say what a directive IS, and (ii) definitional sentences in Sections 2.1-2.6 that say what a module IS and what include, import and the as clause DRAW IN and DO TO A NAME. A rule about the shape of a file has almost no occasion to say that somebody MUST do something. This is the same shape as the sibling records rfc-8610 (2 keywords in 125 KB, 137 of 139 entries inferred) and draft-ietf-cbor-edn-literals (10 keywords in 168 KB, 205 of 226 inferred), and for the same reason. ALL 92 ENTRIES ARE kind: inferred. There is no stated entry, because there is no keyword to state one with. WHAT WAS COUNTED INSTEAD: (a) every ABNF PRODUCTION of Appendix A, one entry each, because for this document the productions are the obligations - R-0078 to R-0087; (b) every DEFINITION of the mechanism: what a module is (R-0030), what makes a line a directive (R-0033), what the as clause does to a name (R-0028), what include draws in (R-0046, R-0056) and what import draws in (R-0047, R-0060, R-0061); (c) the BASELINE this document measures itself against - RFC 8610''s concatenation-plus-identical-redefinition composition rule, restated here as fact (R-0015), and the observation that the knowledge of what to concatenate "lives entirely outside the CDDL snippets" (R-0017); (d) every EXPLICIT DISCLAIMER OF CAPABILITY, because what this document declines to define bears on us as much as what it does - no versioning and no variant selection (R-0019, R-0020, R-0021), source-directory establishment and precedence "intentionally not fully defined" (R-0036), no IANA action at all (R-0076), and Appendix B declaring itself "for information only" (R-0088); (e) every COMPATIBILITY claim, which is the document''s central design commitment and the thing a reviewer will most want held to the text - R-0012, R-0023, R-0024, R-0025, R-0032; (f) the ONE side condition on prefixing that no production can carry: the CDDL prelude is exempt (R-0053); and (g) the DOCUMENT-STATUS statements that bind anyone citing an Internet-Draft, R-0001 to R-0004, recorded because this library cites this draft and docs/extraction.md requires the cost of that to be stated. THE LOWER-CASE FORCE WORDS THE DOCUMENT DOES USE, reproduced in `verb`: "will" (expiry, R-0001), "may" (R-0002, R-0019, R-0037, R-0065, R-0066), "is to be" (R-0004), "is allowed" (R-0015), "assume" (R-0034), "might" (R-0041), "can" (R-0052, R-0054, R-0057, R-0063, R-0091), "is inappropriate" (R-0003), "need to" (R-0071, R-0073), "needs to" (R-0072), "should" (R-0074), "assumes" (R-0092). Only FIVE sentences in the entire document put a force word on an actor, and all five are lower case: Section 2.7''s two "may provide" (R-0065, R-0066) and Section 3''s "need to ascertain" (R-0071), "needs to undergo"/"needs to be considered" (R-0072), "need to be particularly careful" (R-0073) and "should strive" (R-0074). Every other entry''s force is definitional, and each one names its carrier in `field`. No obligation was invented and no count was inflated. SECTION 1.1''S BOILERPLATE IS DELIBERATELY NOT QUOTED IN ANY ENTRY: bin/validate counts requirement texts with boilerplate stripping OFF, so quoting it would add eleven phantom keywords to a document that uses none - the exact trap rfc-8610''s extraction documents. CONTIGUITY, and what was removed to establish it. Every `text` is a single contiguous verbatim span of the cached source, checked by script after removing exactly two classes of plain-text page decoration and nothing else: the running footer ("Bormann & Moran   Expires 6 March 2027   [Page n]") and header ("Internet-Draft   CDDL Module Structure   September 2026") and the thirteen form feeds beside them. Runs of whitespace were then collapsed to one space, which is why the source''s RFC-style double space after a sentence period, and its stray double spaces at "_Compatibility_:  bidirectional" and "(partial?)  URIs", appear here as single spaces. No interior word, clause or punctuation mark of any span was altered, dropped or reordered, and no span is spliced from two non-adjacent parts of the document. NO SPAN CROSSES A PAGE FRAME. All thirteen page breaks in this document fall in blank space, in the table of contents, in the reference list, or between a sentence and a display block, and Appendix A''s grammar sits in one unbroken region (lines 677-688). That was checked, not assumed, and it is worth saying because both sibling records had a load-bearing sentence severed by the page furniture. HYPHENATION AT A LINE BREAK severs a token in THREE of the spans quoted here, and all three carry the hyphen and the following space exactly as the normalised source renders them, with the break named in `field`: "follow- up" (R-0009, lines 137/138), "Internet- Drafts" (R-0041, lines 267/268) and "module- structured" (R-0089, lines 694/695). Not every hyphen before a space is a break: "backward- and forward-compatible" (R-0008) is a suspended hyphen the source writes on one line (line 130), and the trailing "-" on every "$ cddlc -2tcddl -" command line is the tool''s stdin argument, not a wrap. THREE NON-ASCII CODE POINTS fall inside quoted spans and are reproduced as the source bytes carry them, never normalised to ASCII: U+2019 in "cddlc’s" (R-0043), U+2013 EN DASH in "(no – was given on the command line)" (R-0069), and U+2265 in "Ruby version ≥ 3.0" (R-0091). The second of those is a rendering defect - the sense requires the ASCII "-" of a stdin argument - and is recorded as such in distilled/README.md rather than repaired here. DUPLICATE SENTENCES FOLDED TO ONE ENTRY EACH, with both locations named in `field`: "This results in the following CDDL 1.0 specification:" is stated twice (lines 313 and 345) and is R-0050; the RFC 8792 wrapping banner is stated twice (lines 418 and 453) and is R-0062. distilled/normative.md carries each of them at both of its positions, so that file has 89 bullets where this one has 92 entries - the difference is those two folds, plus five document-status bullets normative.md quotes which are metadata rather than requirements, minus the ten ABNF productions this file carries and normative.md deliberately does not re-type.'
