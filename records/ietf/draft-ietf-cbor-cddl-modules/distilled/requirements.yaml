note: |
  Ids are stable and never reused. Cite as draft-ietf-cbor-cddl-modules#R-NNNN.
  Entries are in source order: front-matter and boilerplate first, then by
  section, then by position within the section; ids run from R-0001 to R-0092
  with no gaps.
  KIND. EVERY entry is `inferred`. There is not one all-capitals BCP 14 keyword
  in this document to make a `stated` entry with, and `reconciliation` says why
  that is the document's nature rather than its deficiency. `inferred` here does
  NOT mean the text is paraphrased: every `text` in this file is a single
  contiguous verbatim span of the cached source. This follows the convention of
  records/ietf/rfc-8610/distilled/requirements.yaml and
  records/ietf/draft-ietf-cbor-edn-literals/distilled/requirements.yaml, not
  that of rfc-8785, where `inferred` marked non-verbatim text.
  VERB. Lower case throughout, reproducing the source's own force word ('may',
  'can', 'need to', 'needs to', 'should', 'might', 'assume', 'assumes', 'will',
  'is allowed', 'is to be', 'is inappropriate'); `none` means the sentence
  carries no force word at all and its normativity is definitional - which, for
  a grammar, is the usual case. There is no upper-case verb in this file.
  ACTOR. This document defines no protocol roles, so `actor` names the party a
  constraint falls on in practice. The first three are the document's own terms:
  `module structure processor` (§2.4's phrase) is whatever resolves directives
  and emits basic CDDL; `implementation` is §3's word for a program that employs
  the module structure; `tool` is §2.7's word. Added by this extraction:
  `module author` is whoever writes a module file; `basic CDDL tool` is an
  RFC 8610 tool that has NOT been updated for this specification, which matters
  because §2.1's whole compatibility claim is about what such a tool does;
  `reader of this specification` is used for statements about the document
  itself; `anyone citing this document` is used for R-0001 to R-0004.
  APPENDIX A. R-0078 to R-0087 are the ten ABNF productions, one entry each,
  quoted exactly as the source prints them after whitespace collapsing. The
  grammar is also held byte-for-byte, margin intact, at
  distilled/schema/module-directives.abnf; these entries exist so that each
  production can be cited individually and so that the three places where the
  grammar does not hold as written have a requirement id to hang off.
  WHAT THIS DOCUMENT DOES NOT CONSTRAIN, searched for mechanically and absent:
  `export`, `public`, `private`, `visible` (0 occurrences outside the copyright
  boilerplate); `socket`, `plug`, `$$` (0); `/=`, `//=` (0); any statement of
  the order in which composed rules are emitted (0). Those absences are not
  requirements and have no ids. They are recorded in distilled/normative.md
  under *What the document does not say*, and they are the subject of
  distilled/design-notes.md.
  LIST MARKERS. §2.5's two bullets are rendered `*  ` in the source. The marker
  is layout, not text, and R-0046 and R-0047 do not carry it; `field` says so.

