distillation:
  standard: "FX-1"
  # NO `profile` is declared, deliberately. Passes 1 (extract) and 2 (verify)
  # are complete and the full artifact set is on disk, but the cross-check pass
  # is not done, so there is no numerator yet — docs/extraction.md: "An
  # *unfinished* extraction is neither `full` nor `partial`: it has no profile
  # yet."
  # `status` MOVED to `summarized` in pass 2. Pass 1 wanted to move it and could
  # not: summary.md was still the ingest scaffold and bin/validate makes any
  # status at or past `read` an error while it is. The orchestrator has since
  # written summary.md, bin/validate --scaffolds no longer lists this record,
  # and every gate on a read status is met (summary.md exists, carries YAML
  # front matter, holds no scaffold marker; content.sha256 and publisher are
  # set). `summarized` and not `distilled`, because `distilled` would read as a
  # completed extraction and the cross-check pass has not run — the same shape
  # as the sibling rfc-9964, which is FX-1, profile-less and `summarized`.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "89 verbatim bullet quotes and 18 fenced block reproductions across 20 distinct locators (front matter, title block, Status of This Memo, About This Document, §1, §1.1, §2, §2.1-§2.7 including the two unnumbered sub-headings of §2.6, §3, §4, Appendix A, Appendix B). All 89 quotes confirmed contiguous substrings of the whitespace-normalised source and all 18 distinct source blocks confirmed present in it, 0 failures. The Abstract is word-for-word identical to §1's first three paragraphs and is quoted once, not twice. Carries a `What the document does not say` section with the mechanical count behind each absence: no export construct, no mention of sockets or plugs, no `/=` or `//=`, no emission-order rule, no prefix-collision rule, no wild-card example, no versioning, and no definition of `$.start.$`"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "92 entries R-0001 to R-0092 in source order, no gaps: 0 stated, 92 inferred. There is no all-capitals BCP 14 keyword in this document to make a `stated` entry with - source and extracted keyword counts are both 0, and a 7142-character reconciliation states the document's own normative baseline as bin/validate requires when the source count is 0. What was counted instead: all ten Appendix A productions as individual entries (R-0078 to R-0087), every definition of the mechanism, RFC 8610's concatenation-plus-identical-redefinition baseline the draft measures itself against, every explicit disclaimer of capability, every compatibility claim, the one prefixing side condition (the prelude exemption), and the document-status statements that bind anyone citing an Internet-Draft. Only FIVE sentences in the document put a force word on an actor and all five are lower case. §1.1's BCP 14 boilerplate is deliberately never quoted, because bin/validate counts texts with stripping off and quoting it would add 11 phantom keywords to a document that uses none"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "1 verbatim and 4 derived. Appendix A's complete grammar (ten productions, source lines 677-688) is byte-identical to the cache with the Internet-Draft's three-column margin intact, region sha256 43c17148af31265a171f2e722b24d2e0063d0ab253d8b681cc1c223d5df696ab, and it is ONE unbroken region - no page frame falls inside it. The margin-removed companion round-trips exactly in both directions. Derived: 21 enumerated gaps G-01 to G-21 (S 10, I 1, N 8, plus 2 recorded as NOT defects so nobody fixes them), the naming-and-resolution model as data, and the two RFC 8792-wrapped outputs unfolded. Three productions do not hold as written and each has an id: `id` admits neither - nor . so it cannot match the dotted selectors §2.6's own examples write (G-01); `CRLF` is redefined against STD 68 to admit a bare LF and the appendix never says so, which after pass 2's narrowing is a DOCUMENTATION defect and not a grammar one, because RFC 9165 §3 makes the identical redefinition and declares it (G-02); and `directive` requires a space after ;# where §2.3's prose requires only the prefix (G-03)"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "13 constructs, 41 fields, plus a 5-entry absent_constructs block carrying the grep count behind each absence. `constrained_by` IS used throughout, unlike the sibling record rfc-8610 where it is omitted: with 0 keywords but 92 verbatim entries each at a precise locator, every construct here has at least one, and the file header states that all such ids are `inferred` and that the key means `this is the text that fixes this field` rather than `this is an obligation on an implementer`. Nothing was invented to fill it. Every id cited anywhere under distilled/ was checked to exist: 0 dangling citations"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: "19 vectors V-0001 to V-0019 covering every block the document prints, in source order with no gaps: 9 valid, 2 invalid, 4 incomplete, 4 not-applicable. Every text block was lifted by line range BY SCRIPT and never retyped, and the generator asserts the round trip through BOTH of this library's YAML readers - 0 failures, including the 63-space continuation of the two RFC 8792 backslash wraps. No negative was invented: the two `invalid` are directives the document prints as working examples and its own Appendix A cannot derive, and the one unintended `incomplete` is V-0009, the ONLY composed output in the document with a dangling reference. Rule-name closure was tested on all seven composed outputs against the 40 RFC 8610 prelude names: six closed, V-0009 not"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the two questions library#39 sent this record to settle, answered first and with ids - a module system gives CDDL NO native/export boundary (no export construct, include reaches transitively through a module, module-hood is never declared, and §2.1's `basic CDDL on its own` is lexical: all six printed module files have dangling rule names), and module naming RELOCATES rather than fixes the socket collision (flat filenames, URIs explicitly refused, importer-chosen prefixes in one flat space, and sockets not mentioned at all with both possible answers broken). Also: whether /= ordering survives composition (the document is silent, and the silence moves the non-determinism from a build script we write into a resolver we do not); five named cuts against MD-3, ONE OF WHICH GOES IN OPTION 5'S FAVOUR because §4 allocates nothing so module names are not a fourth registry; the cost of a reference that is two Internet-Drafts deep; a checked list of what this does NOT invalidate in rfc-8610's profile: full artifacts plus the one statement it sharpens; and nine open questions"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "No roles, no messages exchanged, no error paths. §2.3 makes the whole mechanism a transformation of one file - \"A single CDDL file becomes a _module_ by processing the (zero or more) directives in it\" - whose result is \"the following CDDL 1.0 specification\". The only multi-party content is §3 and it is about provenance of source code in a build environment rather than an exchange: \"Implementations that employ the module structure defined in this document need to ascertain the provenance of the modules they combine into the CDDL models they employ operationally\". §4 is \"This document has no IANA actions\", so there is not even a registration process to model. Checked by vocabulary sweep over the source rather than asserted, and re-run in pass 2: of NINETEEN exchange words SIXTEEN do not occur at all - respon, send, receiv, client, server, peer, party, parties, endpoint, handshake, negotiat, message, PROTOCOL, transmit, reply, session. The three that hit are not exchanges: `request` x1 is \"The import statement can also request an alias\" (line 437); `sent` x7 is a substring every time, SIX inside \"present\" and the seventh inside \"Representation\" in RFC 8610's title in the normative reference list (line 592); and `acknowledg` x3 is the table-of-contents entry (line 108), the section heading (line 711) and its placeholder (line 713). The word \"protocol\" does not appear in this document. [Pass 2 corrected two things here: this reason said \"of twenty exchange words SEVENTEEN do not occur\" while naming sixteen, and said all seven `sent` hits were inside \"present\".]"
    - kind: state-machine
      reason: "No states and no transitions, for the same reason the protocol artifact is absent. Nothing in the document registers, issues, rotates, revokes or expires anything. The nearest thing to a procedure is module name resolution, and it is a name lookup over a search path - and the specification declines to define even that: \"The exact way how these source directories and possibly a precedence between them are established is intentionally not fully defined in this specification\". Its structure is held as data in distilled/schema/name-resolution.derived.yaml instead, which is the honest shape for a lookup with no lifecycle. Checked by the same sweep, re-run in pass 2 and confirmed exactly: of seventeen lifecycle words THIRTEEN do not occur - register, registr, issuanc, revoke, revocat, rotate, rotation, expiry, expiration, renew, transition, lifecycle, enroll. The four that hit are all furniture: `expire` x16 is the title block's \"Expires: 6 March 2027\" (line 8), the expiry sentence (line 71) and the running footer on all fourteen pages; `issue` x1 is the sentence introducing the GitHub issue tracker (line 43); `state` x1 is inside the word \"statement\" (line 437); and `provision` x3 is the BCP 78/79 and Trust Legal Provisions boilerplate (lines 49, 79, 84)."
  passes:
    - pass: extract
      by: "claude-opus-5 (single agent, whole artifact set)"
      effort: max
      date: "2026-10-19"
      note: "read only .cache/draft-ietf-cbor-cddl-modules.txt, all 784 lines, never a summary and never another agent's output. Every quote span and every requirement text verified by script as a contiguous substring of the whitespace-normalised source (89 + 92 spans, 0 failures); the Appendix A capture verified by region digest and its dedented companion round-tripped; all 19 example blocks generated from the source by line range with the round trip asserted through both of this library's YAML readers. THREE hyphenation breaks are declared and reproduced rather than healed (follow- up, Internet- Drafts, module- structured) and two look-alikes were checked and ruled out (the suspended hyphen in `backward- and forward-compatible`, and the trailing - of `$ cddlc -2tcddl -`). NO span crosses a page frame, which was checked rather than assumed: all 13 page breaks fall in blank space, the table of contents, the reference list, or between a sentence and a display block. TWO SOURCE DEFECTS FOUND MECHANICALLY AND NOT REPAIRED: (1) Appendix A's `id` admits neither - nor . so two of the seven directive instances the document prints are not derivable from its own grammar; (2) the document's only demonstration of `include` with an `as` clause emits a model whose `mydata` references `label` and `values`, which are defined nowhere in the block and are not among the 40 RFC 8610 prelude names - the only composed output of the seven that does not resolve. Also reproduced: RFC 8610 defect 7, the CRLF redefinition, which now stands in two current CDDL documents. The Acknowledgments placeholder token is described rather than quoted, because bin/validate rejects that literal string inside distilled/. Pass 2 (verify) and pass 3 (cross-check) are NOT done and no profile is claimed"
    - pass: verify
      by: "claude-opus-5 (single agent, adversarial; did not extract)"
      effort: max
      date: "2026-10-20"
      note: "read only .cache/draft-ietf-cbor-cddl-modules.txt and this library's own captures, and wrote its own scripts rather than re-running pass 1's. THE TWO SHARPEST FINDINGS BOTH HOLD, re-derived from scratch. (1) G-01: the `id` character classes were rebuilt from the hex ranges - first set $ @ A-Z _ a-z, repeat set $ 0-9 @ A-Z _ a-z, neither containing 0x2E or 0x2D - and a backtracking recogniser transcribed from Appendix A was run over all seven printed directive instances: EXACTLY TWO are not derivable, source lines 388 and 414, carrying three dotted selectors. Strengthened in two ways: RFC 9682 leaves `id` UNCHANGED (one of its forty-one carried productions, per the rfc-9682 record that landed between pass 1 and pass 2), so the comparison is against the grammar in force today and the record's one declared open question is now CLOSED; and five of the forty prelude names are hyphenated, so even the prelude holds names this grammar cannot spell in a selector. (2) V-0009: the 40 prelude names were lifted from the VERBATIM regions of records/ietf/rfc-8610/distilled/schema/prelude.cddl - `label` and `values` are not among them, and the list printed in examples/README.md is set-equal to the capture - and closure was recomputed for all seven composed outputs after unfolding both RFC 8792 wraps, discarding control operators and bareword member keys: SIX CLOSED, V-0009 NOT. The cause was confirmed byte-exactly: source line 387 is byte-identical to line 374, the un-prefixed input of the previous example. NEW HALF FOUND: V-0009 is also the only block in the document with a DEAD DEFINITION - `cose.label` and `cose.values` are defined and never referenced - and those two dead definitions are precisely the two names that would have closed the two dangling references. It is wrong in both directions at once, which is the signature of one un-updated line rather than an under-specification. ALSO CONFIRMED: no span anywhere in this record crosses a page frame, tested properly by matching every span against the source both with and without the page furniture (92/92 requirement texts, 89/89 normative.md bullets, 18/18 fenced blocks, 19/19 vector texts matched BOTH; 0 crossings); 13 page breaks, all in blank space, the ToC, the reference list or before a display block; Appendix A one unbroken region with region sha256 43c17148...96ab recomputed and matching; dedent and re-indent exact inverses; all 19 vector texts re-lifted byte-identically from their own source_lines; 9/2/4/4 expect tally; 0 semicolons in all seven composed outputs; BCP 14 = 0 stripped and 11 unstripped with all eleven inside §1.1 lines 146-150, so the zero is exact; every R-/V-/G- id cited anywhere resolves, 0 dangling. SIX THINGS CORRECTED, all of them pointers or counts and none a finding: examples/README.md's `incomplete` list named V-0008 where V-0009 belongs and called all four module inputs, which is false for the one that matters; normative.md pointed at R-0073-R-0082 for the ten productions instead of R-0078-R-0087; G-01 cited line numbers in rfc-8610's cddl.abnf that had drifted; G-18's headline said a name was never defined when source line 509 defines it; the protocol vocabulary sweep said twenty words and seventeen absent while naming sixteen, and mis-attributed the seventh `sent` hit, which is inside \"Representation\" at line 592; and the CDDL_INCLUDE_PATH resolver was placed inside Appendix B when it is in §2.4, scoped to the tool Appendix B describes. ONE FRAMING NARROWED on instruction: the `CRLF` redefinition is a DOCUMENTATION defect, not a grammar one - RFC 9165 §3 makes the byte-identical redefinition, declares it and calls it customary for ABNF, so the substance is deliberate practice and only the silence is defective. Pass 3 (cross-check) is NOT done, no profile is claimed, and no reviewed_by is signed"
