distillation:
  standard: "FX-1"
  # NO `profile` is declared, deliberately. Pass 1 (extract) is complete and the
  # full artifact set is on disk, but the verify and cross-check passes are not
  # done, so there is no numerator yet — docs/extraction.md: "An *unfinished*
  # extraction is neither `full` nor `partial`: it has no profile yet."
  # `status` also stays `fetched`: summary.md is still the ingest scaffold and
  # rewriting it was not this pass's scope.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "89 verbatim bullet quotes and 18 fenced block reproductions across 20 distinct locators (front matter, title block, Status of This Memo, About This Document, §1, §1.1, §2, §2.1-§2.7 including the two unnumbered sub-headings of §2.6, §3, §4, Appendix A, Appendix B). All 89 quotes confirmed contiguous substrings of the whitespace-normalised source and all 18 distinct source blocks confirmed present in it, 0 failures. The Abstract is word-for-word identical to §1's first three paragraphs and is quoted once, not twice. Carries a `What the document does not say` section with the mechanical count behind each absence: no export construct, no mention of sockets or plugs, no `/=` or `//=`, no emission-order rule, no prefix-collision rule, no wild-card example, no versioning, and no definition of `$.start.$`"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "92 entries R-0001 to R-0092 in source order, no gaps: 0 stated, 92 inferred. There is no all-capitals BCP 14 keyword in this document to make a `stated` entry with - source and extracted keyword counts are both 0, and a 7142-character reconciliation states the document's own normative baseline as bin/validate requires when the source count is 0. What was counted instead: all ten Appendix A productions as individual entries (R-0078 to R-0087), every definition of the mechanism, RFC 8610's concatenation-plus-identical-redefinition baseline the draft measures itself against, every explicit disclaimer of capability, every compatibility claim, the one prefixing side condition (the prelude exemption), and the document-status statements that bind anyone citing an Internet-Draft. Only FIVE sentences in the document put a force word on an actor and all five are lower case. §1.1's BCP 14 boilerplate is deliberately never quoted, because bin/validate counts texts with stripping off and quoting it would add 11 phantom keywords to a document that uses none"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "1 verbatim and 4 derived. Appendix A's complete grammar (ten productions, source lines 677-688) is byte-identical to the cache with the Internet-Draft's three-column margin intact, region sha256 43c17148af31265a171f2e722b24d2e0063d0ab253d8b681cc1c223d5df696ab, and it is ONE unbroken region - no page frame falls inside it. The margin-removed companion round-trips exactly in both directions. Derived: 21 enumerated gaps G-01 to G-21 (S 10, I 1, N 8, plus 2 recorded as NOT defects so nobody fixes them), the naming-and-resolution model as data, and the two RFC 8792-wrapped outputs unfolded. Three productions do not hold as written and each has an id: `id` admits neither - nor . so it cannot match the dotted selectors §2.6's own examples write (G-01); `CRLF` is redefined against STD 68 to admit a bare LF (G-02); and `directive` requires a space after ;# where §2.3's prose requires only the prefix (G-03)"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "13 constructs, 41 fields, plus a 5-entry absent_constructs block carrying the grep count behind each absence. `constrained_by` IS used throughout, unlike the sibling record rfc-8610 where it is omitted: with 0 keywords but 92 verbatim entries each at a precise locator, every construct here has at least one, and the file header states that all such ids are `inferred` and that the key means `this is the text that fixes this field` rather than `this is an obligation on an implementer`. Nothing was invented to fill it. Every id cited anywhere under distilled/ was checked to exist: 0 dangling citations"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: "19 vectors V-0001 to V-0019 covering every block the document prints, in source order with no gaps: 9 valid, 2 invalid, 4 incomplete, 4 not-applicable. Every text block was lifted by line range BY SCRIPT and never retyped, and the generator asserts the round trip through BOTH of this library's YAML readers - 0 failures, including the 63-space continuation of the two RFC 8792 backslash wraps. No negative was invented: the two `invalid` are directives the document prints as working examples and its own Appendix A cannot derive, and the one unintended `incomplete` is V-0009, the ONLY composed output in the document with a dangling reference. Rule-name closure was tested on all seven composed outputs against the 40 RFC 8610 prelude names: six closed, V-0009 not"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the two questions library#39 sent this record to settle, answered first and with ids - a module system gives CDDL NO native/export boundary (no export construct, include reaches transitively through a module, module-hood is never declared, and §2.1's `basic CDDL on its own` is lexical: all six printed module files have dangling rule names), and module naming RELOCATES rather than fixes the socket collision (flat filenames, URIs explicitly refused, importer-chosen prefixes in one flat space, and sockets not mentioned at all with both possible answers broken). Also: whether /= ordering survives composition (the document is silent, and the silence moves the non-determinism from a build script we write into a resolver we do not); five named cuts against MD-3, ONE OF WHICH GOES IN OPTION 5'S FAVOUR because §4 allocates nothing so module names are not a fourth registry; the cost of a reference that is two Internet-Drafts deep; a checked list of what this does NOT invalidate in rfc-8610's profile: full artifacts plus the one statement it sharpens; and nine open questions"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "No roles, no messages exchanged, no error paths. §2.3 makes the whole mechanism a transformation of one file - \"A single CDDL file becomes a _module_ by processing the (zero or more) directives in it\" - whose result is \"the following CDDL 1.0 specification\". The only multi-party content is §3 and it is about provenance of source code in a build environment rather than an exchange: \"Implementations that employ the module structure defined in this document need to ascertain the provenance of the modules they combine into the CDDL models they employ operationally\". §4 is \"This document has no IANA actions\", so there is not even a registration process to model. Checked by vocabulary sweep over the source rather than asserted: of twenty exchange words SEVENTEEN do not occur at all - respon, send, receiv, client, server, peer, party, parties, endpoint, handshake, negotiat, message, PROTOCOL, transmit, reply, session. The three that hit are not exchanges: `request` x1 is \"The import statement can also request an alias\", `sent` x7 is every occurrence inside the word \"present\", and `acknowledg` x3 is the Acknowledgments heading and its placeholder. The word \"protocol\" does not appear in this document."
    - kind: state-machine
      reason: "No states and no transitions, for the same reason the protocol artifact is absent. Nothing in the document registers, issues, rotates, revokes or expires anything. The nearest thing to a procedure is module name resolution, and it is a name lookup over a search path - and the specification declines to define even that: \"The exact way how these source directories and possibly a precedence between them are established is intentionally not fully defined in this specification\". Its structure is held as data in distilled/schema/name-resolution.derived.yaml instead, which is the honest shape for a lookup with no lifecycle. Checked by the same sweep: of seventeen lifecycle words THIRTEEN do not occur - register, registr, issuanc, revoke, revocat, rotate, rotation, expiry, expiration, renew, transition, lifecycle, enroll. The four that hit are all furniture: `expire` x16 is the Internet-Draft expiry sentence plus the running footer on all fourteen pages, `issue` x1 is the GitHub issue-tracker URL, `state` x1 is inside the word \"statement\", and `provision` x3 is the BCP 78/79 and Trust Legal Provisions boilerplate."
  passes:
    - pass: extract
      by: "claude-opus-5 (single agent, whole artifact set)"
      effort: max
      date: "2026-10-19"
      note: "read only .cache/draft-ietf-cbor-cddl-modules.txt, all 784 lines, never a summary and never another agent's output. Every quote span and every requirement text verified by script as a contiguous substring of the whitespace-normalised source (89 + 92 spans, 0 failures); the Appendix A capture verified by region digest and its dedented companion round-tripped; all 19 example blocks generated from the source by line range with the round trip asserted through both of this library's YAML readers. THREE hyphenation breaks are declared and reproduced rather than healed (follow- up, Internet- Drafts, module- structured) and two look-alikes were checked and ruled out (the suspended hyphen in `backward- and forward-compatible`, and the trailing - of `$ cddlc -2tcddl -`). NO span crosses a page frame, which was checked rather than assumed: all 13 page breaks fall in blank space, the table of contents, the reference list, or between a sentence and a display block. TWO SOURCE DEFECTS FOUND MECHANICALLY AND NOT REPAIRED: (1) Appendix A's `id` admits neither - nor . so two of the seven directive instances the document prints are not derivable from its own grammar; (2) the document's only demonstration of `include` with an `as` clause emits a model whose `mydata` references `label` and `values`, which are defined nowhere in the block and are not among the 40 RFC 8610 prelude names - the only composed output of the seven that does not resolve. Also reproduced: RFC 8610 defect 7, the CRLF redefinition, which now stands in two current CDDL documents. The Acknowledgments placeholder token is described rather than quoted, because bin/validate rejects that literal string inside distilled/. Pass 2 (verify) and pass 3 (cross-check) are NOT done and no profile is claimed"
