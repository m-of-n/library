# =====================================================================
# byte-string-prefixes.derived.yaml
#
# DERIVED -- NOT verbatim. The TABLE and the VERDICTS are this library's.
# Every `quote:` field is the draft's own words, copied by script and
# checked as a contiguous span of the cached source; everything else
# (`verdict`, `consequence`, the `finding` block) is our reading.
#
# WHY THIS FILE EXISTS. library#39 assigns CDN/EDN the role of "the
# format for our test vectors". This library's rfc-8610 extraction found
# an unreconciled conflict inside RFC 8610 about how many byte-string
# prefixes EDN has -- four by Appendix G.2, two by the CDDL grammar's
# `bsqual = "h" / "b64"` -- which would make a vector written b32'...'
# valid EDN and not a valid CDDL literal. This file records what
# draft-ietf-cbor-edn-literals-27 does with that conflict.
#
# ANSWER IN ONE LINE: it RESOLVES it, by narrowing to the two-prefix set
# and retiring the normative text that said four.
#
# Source: "Concise Diagnostic Notation (CDN)",
#         draft-ietf-cbor-edn-literals-27, C. Bormann, 20 July 2026.
#         cached source sha256
#         43cfb1236435a9de62d3c202b7ee653b0f5adbd40d3800bbb9379379dbdbf7e9
# =====================================================================
record: draft-ietf-cbor-edn-literals
kind: derived
reviewed_by: ""

finding:
  question: >
    RFC 8610 Appendix G.2 (normative) names four EDN byte-string prefixes --
    h, b32, h32, b64 -- while RFC 8610 Section 3.1 (normative) and the
    Appendix B grammar's `bsqual = "h" / "b64"` admit two. Does
    draft-ietf-cbor-edn-literals-27 resolve, inherit, widen or ignore that?
  verdict: RESOLVES
  how: >
    By two moves at once. (1) It OBSOLETES the text that said four. The draft
    updates RFC 8610 by obsoleting Appendix G in its entirety, and updates
    RFC 8949 by obsoleting Section 8 -- the two documents that between them
    carried the four-prefix list. After this draft, Appendix G.2 is no longer
    the definition of anything. (2) It DEFINES exactly two base-encoding
    prefixes, h and b64 -- the same two that `bsqual` admits -- and says in
    its own words that b32 and h32 are "not directly included in this
    specification". The notation converges on the CDDL side of the old
    conflict rather than the EDN side.
  it_does_not_widen: >
    No new base-encoding prefix is added. The seven other prefixes this draft
    defines (dt, ip, hash, b1, t1, cri, float, plus ilbs/ilts) are not base
    encodings and do not denote byte strings by base-decoding them.
  residual_mismatch_for_the_vector_role: >
    The PREFIX SET now agrees; the LITERAL SYNTAX still does not. CDDL's byte
    string literal is `bytes = [bsqual] %x27 *BCHAR %x27` -- a prefix and a
    SINGLE-QUOTED string, nothing else. CDN admits three carriers for the same
    prefix: a single-quoted string, a RAW string (h`12345678`), and a SEQUENCE
    literal (h<<"...">>), and says the app-extension "cannot distinguish"
    between them. So h'12345678' is both valid CDN and a valid CDDL literal,
    while h`12345678` is valid CDN and is NOT. A vector generator aimed at
    CDDL must emit the single-quoted form; see
    'draft-ietf-cbor-edn-literals#R-0075' and
    'draft-ietf-cbor-edn-literals#R-0087'. The same applies, more sharply, to
    every non-base-encoding prefix: dt'...', ip'...', hash<<...>>, cri'...'
    and float'...' are all valid CDN and none is a CDDL byte-string literal.
  what_is_not_verified_here: >
    RFC 8610 and RFC 8949 were NOT read for this file. The four-prefix claim
    and `bsqual = "h" / "b64"` are cited from this library's own rfc-8610
    record -- records/ietf/rfc-8610/distilled/normative.md line 770,
    distilled/messages.yaml (the `bsqual` field and the `bytes` layout) and
    distilled/schema/cddl.abnf line 130 -- not from the RFCs themselves.
    Everything attributed to draft-ietf-cbor-edn-literals-27 below is quoted
    from the cached source and mechanically checked.
  status_caveat: >
    This is an Internet-Draft, "Updates: 8610, 8949 (if approved)". The
    resolution is a PROPOSAL until the draft is published. Until then RFC 8610
    Appendix G.2 is still in force and the conflict rfc-8610 recorded is still
    live. Build to the two-prefix set, which is the intersection and is safe
    under both readings.

# ---------------------------------------------------------------------
# What the draft says it does to the documents that carried the conflict
supersession:
  - locator: "header"
    quote: 'Updates: 8610, 8949 (if approved)'
    note: OURS -- the draft's own header line.
  - locator: "Abstract"
    quote: >-
      Replacing CDN's previous informal descriptions, it updates RFC 8949,
      obsoleting its Section 8, and RFC 8610, obsoleting its Appendix G.
  - locator: "Section 1"
    quote: >-
      It updates RFC8949 by obsoleting Section 8 of RFC 8949 [STD94], and
      [RFC8610] by obsoleting Appendix G of [RFC8610]. It is intended to serve
      as the single reference target that can be used in specifications that
      use CDN.
  - locator: "Section 1"
    quote: >-
      Appendix G of [RFC8610] extended this into what also became known as
      Extended Diagnostic Notation (EDN), often including Section 4.2 of
      [RFC8742] and draft revisions of the present document. Diagnostic
      notation is now specified by this document, obsoleting all these
      previous descriptions, and is known as Concise Diagnostic Notation
      (CDN).
    note: >-
      OURS: this is the sentence that ends the conflict. The four-prefix list
      lived in Appendix G.2. Obsoleting Appendix G removes it; it is not
      re-stated anywhere in this draft except as history.

# ---------------------------------------------------------------------
# Every byte-string prefix, and this draft's disposition of it
prefixes:
  - prefix: h
    status: DEFINED, mandatory to implement
    encoding: base16 (RFC 4648), without padding
    value_type: byte string
    carriers: ["h'...'", "h`...`", "h<<...>>"]
    locators: ["Section 3", "Section 3.1", "Section 6.2 Table 7", "Section 6.2.1 Figure 3", "Section 7.1 Table 8"]
    registry_entry: 'h | Reserved | RFC8949'
    quote: >-
      Most often, the base encoding is enclosed in a single-quoted or raw
      string literal, prefixed by >>h<< for base16 or >>b64<< for base64 or
      base64url (the actual encodings of the latter two have the same meaning
      where they overlap, so the string remains unambiguous).
    quote_note: >-
      OURS: the source writes the guillemets as the characters U+00BB and
      U+00AB; they are rendered >> and << here only so this file stays ASCII.
      The verbatim bytes are in ../normative.md and in requirements.yaml.
    requirement: "draft-ietf-cbor-edn-literals#R-0090"
    consequence: >-
      OURS: agrees with CDDL `bsqual`. Safe for vectors in the single-quoted
      carrier. Note that CDN's h content grammar (Figure 3) admits blank space
      AND comments between hex digits, and admits ellipses (3*".") inside the
      literal; the ellipsis form is CDN-only.
  - prefix: b64
    status: DEFINED, mandatory to implement
    encoding: base64 classic OR base64url (RFC 4648 Sections 4 and 5), without padding required
    value_type: byte string
    carriers: ["b64'...'", "b64`...`", "b64<<...>>"]
    locators: ["Section 3", "Section 3.1", "Section 6.2 Table 7", "Section 6.2.2 Figure 4", "Section 7.1 Table 8"]
    registry_entry: 'b64 | Reserved | RFC8949'
    quote: >-
      This syntax allows both the classic (Section 4 of [RFC4648]) and the
      URL-safe (Section 5 of [RFC4648]) alphabet to be used. It accommodates,
      but does not require base64 padding.
    requirement: "draft-ietf-cbor-edn-literals#R-0182"
    consequence: >-
      OURS: agrees with CDDL `bsqual`. One trap for a vector writer: a slash
      is a base64-classic alphabet character, so slash-delimited comments do
      NOT work inside b64'' -- only "#" end-of-line comments do. The draft
      gives a deliberately confusing worked example of this in Section 3.1.
  - prefix: b32
    status: NOT DEFINED -- name reserved in the registry, no meaning in the notation
    encoding: base32 (would have been)
    value_type: n/a
    carriers: []
    locators: ["Section 3", "Section 3.1", "Section 7.1 Table 8"]
    registry_entry: 'b32 | Reserved | RFC8949'
    quote: >-
      (Note that Section 8 of RFC 8949 [STD94] also mentions >>b32<< for
      base32 and >>h32<< for base32hex. This has not been implemented widely
      and therefore is not directly included in this specification. These and
      further byte string formats now can easily be added back as prefixed
      literals.)
    requirement: "draft-ietf-cbor-edn-literals#R-0091"
    consequence: >-
      OURS: b32'MZXW6===' PARSES but does not RESOLVE. The Figure 1 grammar
      admits it lexically -- `app-prefix = lcalpha *lcldh` accepts any
      [a-z][a-z0-9-]* string, so "b32" is a well-formed app-prefix and
      b32'...' is a well-formed `app-string`. The failure happens one layer
      up, at resolution: Section 5.1 says an app-extension that "is not known
      or not implemented by the ingesting process" is "usually an error and
      processing has to stop"
      ('draft-ietf-cbor-edn-literals#R-0151'). So a conforming CDN tool
      rejects it, but a SYNTAX-ONLY check against the ABNF will not. Do not
      rely on the grammar to catch an unregistered prefix.
  - prefix: h32
    status: NOT DEFINED -- name reserved in the registry, no meaning in the notation
    encoding: base32hex (would have been)
    value_type: n/a
    carriers: []
    locators: ["Section 3", "Section 3.1", "Section 7.1 Table 8"]
    registry_entry: 'h32 | Reserved | RFC8949'
    quote: >-
      (Note that Section 8 of RFC 8949 [STD94] also mentions >>b32<< for
      base32 and >>h32<< for base32hex. This has not been implemented widely
      and therefore is not directly included in this specification. These and
      further byte string formats now can easily be added back as prefixed
      literals.)
    requirement: "draft-ietf-cbor-edn-literals#R-0091"
    consequence: OURS -- identical to b32 above.
  - prefix: "(unprefixed single quotes)"
    status: DEFINED -- base CDN, not an app-extension
    encoding: none; the literal's UTF-8 text IS the byte string
    value_type: byte string
    carriers: ["'...'"]
    locators: ["Section 2.3.2"]
    registry_entry: n/a
    quote: >-
      Single-quoted string literals can occur unprefixed and stand for the
      byte string that encodes its text string value (the "content"), or be
      prefixed by what looks like an app-extension prefix (see Section 3).
    requirement: "draft-ietf-cbor-edn-literals#R-0045"
    consequence: >-
      OURS: `bytes = [bsqual] %x27 *BCHAR %x27` makes bsqual OPTIONAL, so the
      unprefixed form exists on both sides. But CDN restricts the escapes
      available here relative to its own double-quoted strings -- no \/ and no
      \u escape for U+0020..U+007E -- and those restrictions are CDN's, not
      necessarily CDDL's.

# ---------------------------------------------------------------------
# The reserved-but-undefined state, which is the subtle part
registry_reservation:
  locator: "Section 7.1, Table 8"
  what_the_table_says:
    - 'h         | Reserved            | RFC8949'
    - 'b32       | Reserved            | RFC8949'
    - 'h32       | Reserved            | RFC8949'
    - 'b64       | Reserved            | RFC8949'
    - 'false     | Reserved            | RFC-XXXX'
    - 'true      | Reserved            | RFC-XXXX'
    - 'null      | Reserved            | RFC-XXXX'
    - 'undefined | Reserved            | RFC-XXXX'
    - 'pragma    | Reserved for future use | RFC-XXXX'
  reading: >-
    OURS, and it is easy to get wrong. "Reserved" in Table 8 is a REGISTRY
    state, not a notation state. All four base-encoding names are listed the
    same way, including h and b64 which this draft fully defines -- so the row
    tells you the name is taken, not that the prefix works. What gives a
    prefix meaning is an app-extension definition, and Table 7 (Section 6.2),
    which is the list of prefixes "Defined in this Document", contains h, H,
    b64, B64, dt, DT, ip, IP, hash, HASH, t1, T1, b1, B1, cri, CRI, float and
    FLOAT -- and NOT b32 or h32.
  effect: >-
    OURS: the reservation is what makes the resolution stable. Because b32 and
    h32 are held in the registry against RFC8949, nobody can register those
    names for an unrelated extension, and if base32 is ever wanted back it
    comes back meaning base32. Section 7.1's uniqueness rule -- "No other
    entry in the registry can have the same app-extension identifier"
    ('draft-ietf-cbor-edn-literals#R-0194') -- is what enforces it.
  how_they_could_return:
    locator: "Section 3.1, Section 7.1"
    quote: >-
      These and further byte string formats now can easily be added back as
      prefixed literals.
    policy_quote: >-
      IANA is requested to create an "App-Extension Identifiers" registry in a
      new "Concise Diagnostic Notation" registry group [IANA.concise-
      diagnostic-notation], with the policy "expert review" (Section 4.5 of
      RFC 8126 [BCP26]).
    policy_quote_note: >-
      OURS: the registry-group reference is hyphenated across a line break in
      the source (lines 3265-3266); the quote keeps the hyphen and the space
      exactly as the source renders them.
    note: >-
      OURS: expert review, not first-come-first-served. Re-adding b32 needs a
      designated expert to agree, and the experts are instructed to be frugal
      with short generic identifiers.

# ---------------------------------------------------------------------
# The conformance floor, which decides what a vector may assume
mandatory_to_implement:
  locator: "Section 3"
  quote: >-
    Of these, the app-extensions h, b64, t1, b1, dt and ip are mandatory to
    implement.
  requirement: "draft-ietf-cbor-edn-literals#R-0088"
  set: [h, b64, t1, b1, dt, ip]
  not_in_the_set: [hash, cri, float, ilbs, ilts]
  reading: >-
    OURS. Three things follow for the vector role. (1) h and b64 are the only
    byte-string prefixes a vector may assume a CDN tool understands, which is
    the same two CDDL admits -- a second, independent reason to write vectors
    with h'' and nothing else. (2) hash, cri and float are DEFINED by this
    draft but NOT mandatory, so a vector using them may be rejected by a
    conforming implementation. float is the sharp case: it is the only way to
    write a NaN payload other than the single one CDN calls NaN, and it is
    optional. (3) ilbs/ilts are not in the list either, so the replacement for
    the deprecated indefinite-length string syntax is itself optional.
  also:
    locator: "Section 1.3.3"
    quote: >-
      uses hexadecimal representation (h'') for byte strings, not b64'' or
      embedded CBOR (<<>>);
    note: >-
      OURS: the draft's own "basic output format" picks h'' over b64'' and
      over embedded CBOR. Our vector generator should do the same, and then
      the CDN side and the CDDL side agree on one carrier and one prefix.
