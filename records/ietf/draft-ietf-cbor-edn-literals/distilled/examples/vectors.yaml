    edn: |-
      ""_
    hex: '7fff'
    decoded: 'indefinite-length TEXT string with no chunks'
    expect: 'valid'
    notes: 'SOURCE HEX. Section 4.3 prints these bytes too — "or a text string (encoded 7f ff)" — and this extraction decoded them and confirms they denote the EDN. RECLASSIFIED BY THE VERIFY PASS, with ''draft-ietf-cbor-edn-literals#V-0212''. Section 4.1 names the literal in the same sentence as ''''_. Checked by us: 0x7f is major type 3, ai=31. These two spellings exist only because `(_ )` cannot say which major type is meant (Section 4.3).'
  - id: "draft-ietf-cbor-edn-literals#V-0214"
    locator: '§4.2'
    edn: |-
      [_ 1, 2]
    hex: '9f0102ff'
    decoded: 'indefinite-length array [1, 2]'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 4.2: "A single underscore can be written after the opening brace of a map or the opening bracket of an array to indicate that the data item was represented in indefinite-length format. For example, [_ 1, 2] contains an indicator that an indefinite-length representation was used to represent the data item [1, 2]." CAUTION for CDDL: `_` is a legal CDDL id (`EALPHA` includes "_"), so `[_ 1, 2]` is also valid CDDL — as a THREE-entry group. It does not error; it silently means something else.'
  - id: "draft-ietf-cbor-edn-literals#V-0215"
    locator: '§4.2'
    edn: |-
