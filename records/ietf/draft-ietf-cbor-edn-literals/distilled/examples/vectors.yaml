    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. "or the equivalent epoch-based time". Checked by us: 1363896240 is 2013-03-21T20:04:00Z.'
  - id: "draft-ietf-cbor-edn-literals#V-0105"
    locator: '§2.5'
    edn: |-
      1_1(1363896240)
    hex: 'd900011a514b67b0'
    decoded: 'tag 1 whose HEAD is encoded with ai=25 (two-byte argument), content in Preferred Serialization'
    expect: 'valid'
    notes: 'SOURCE HEX. The document prints both the EDN and these bytes; this extraction decoded the bytes and confirms they denote the EDN. The source prints the encoding as an annotated hexdump: "d9 0001        # tag(1)" / "   1a 514b67b0 # unsigned(1363896240)". Checked by us: 0xd9 is major type 6 ai=25, argument 0x0001 = tag 1; 0x514b67b0 = 1363896240. The encoding indicator sits on the TAG HEAD, not on the content — "...(assuming Preferred Serialization for the tag content)".'
