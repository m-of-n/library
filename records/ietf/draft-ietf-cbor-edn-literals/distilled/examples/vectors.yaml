    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 2.3.1: the three forms are equivalent; "CDN keeps [JSON''s escape scheme], but also adds the syntax \u{NNN} where NNN is the Unicode scalar value as a hexadecimal number." Section 1.3.5 says a CDN generator may be configured to emit either this or the fully escaped form. PARSE NOTE (cross-check pass): as for V-0059, the trailing `#` comment needs the line terminator the `|-` scalar strips — schema/grammar-gaps.derived.txt G-31.'
