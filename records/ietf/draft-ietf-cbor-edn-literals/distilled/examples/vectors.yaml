  - id: "draft-ietf-cbor-edn-literals#V-0059"
    locator: '§2.3.1'
    edn: |-
      "D\u{6f}mino's \u{1F073} + \u{2318}"   # \u{}-escape 3 chars
    hex: '73446f6d696e6f277320f09f81b3202b20e28c98'
    decoded: 'text string "Domino''s U+1F073 + U+2318" (19 UTF-8 bytes)'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 2.3.1: the three forms are equivalent; "CDN keeps [JSON''s escape scheme], but also adds the syntax \u{NNN} where NNN is the Unicode scalar value as a hexadecimal number." RFC 9682 added exactly this `\u{...}` form to CDDL''s SESC, so this escape is one of the few places where CDN and CDDL were deliberately converged rather than left to drift. PARSE NOTE (cross-check pass): this `edn` ends in a trailing `#` comment, and Section 6.1 spells one `eol-comment *non-lf %x0A` — it REQUIRES the terminating newline that this `|-` block scalar strips. The literal is valid CDN on the document''s own line, and parses against schema/cdn.abnf as soon as that line terminator is restored. See schema/grammar-gaps.derived.txt G-31; it is true of V-0059, V-0060 and V-0061 and of no other vector here.'
