  - id: "draft-ietf-cbor-edn-literals#V-0238"
    locator: '§6.1 item 5'
    edn: |-
      987654321098765432310
    hex: 'c249358a750438f380f5f6'
    decoded: 'an integer too large for major type 0; represented with tag 2'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 6.1 item 5: "For hexint, octint, binint, and when decnumber stands for an integer, the corresponding CBOR data item is represented using major type 0 or 1 if possible, or using tag 2 or 3 if not. In the latter case, this specification does not define any encoding indicators that apply." CHECKED BY US: the value needs 70 bits, so it cannot be a major type 0 argument (max 64 bits), and int.from_bytes(358a750438f380f5f6) is 987654321098765432310 exactly, with no leading zero byte, so tag 2 over that nine-byte string is its Preferred Serialization. CROSS-CHECK PASS (2026-10-19) GAVE THIS VECTOR ITS BYTES. It was NO HEX. until then, on the ground that "the encoding REQUIRES major type 6 (tag 2), which is exactly what a no-IANA-tags profile forbids" — but that is a statement about OUR tag profile, not about the document declining to fix the value, and it contradicted V-0239, which prints exactly these bytes for exactly this value from the next clause of the same sentence: "E.g., 987654321098765432310, which is equivalent to 2(h''35 8a 75 04 38 f3 80 f5 f6'') in its Preferred Serialization". The profile caveat is real and belongs here rather than in a withheld `hex`: a profile that forbids IANA tags cannot carry this literal at all, whichever way it is written.'
  - id: "draft-ietf-cbor-edn-literals#V-0239"
    locator: '§6.1 item 5'
    edn: |-
      2(h'35 8a 75 04 38 f3 80 f5 f6')
    hex: 'c249358a750438f380f5f6'
    decoded: 'tag 2 (unsigned bignum) over a nine-byte big-endian byte string'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. "E.g., 987654321098765432310, which is equivalent to 2(h''35 8a 75 04 38 f3 80 f5 f6'') in its Preferred Serialization". CHECKED BY US: int.from_bytes(358a750438f380f5f6) = 987654321098765432310 exactly. The document''s arithmetic is correct.'
  - id: "draft-ietf-cbor-edn-literals#V-0240"
    locator: '§6.1 item 5'
    edn: |-
      2_3(h'00 00 00 35 8a 75 04 38 f3 80 f5 f6'_1)
    hex: 'db000000000000000259000c000000358a750438f380f5f6'
    decoded: 'the same value with a padded bignum: eight-byte tag head, two-byte byte-string length, three leading zero bytes'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. "might be written as 2_3(h''00 00 00 35 8a 75 04 38 f3 80 f5 f6''_1) if leading zeros need to be added during serialization to obtain specific sizes for tag head, byte string head, and the overall byte string." This is the only example in the document where TWO encoding indicators apply to one nested structure. Computed by us; the document prints no bytes. Note that leading zeros make the bignum non-preferred under RFC 8949 Section 3.4.3.'
  - id: "draft-ietf-cbor-edn-literals#V-0241"
    locator: '§6.2.1'
