  - id: "draft-ietf-cbor-edn-literals#V-0130"
    locator: '§3.2 Table 3'
    edn: |-
      dt'1969-07-21T02:56:16Z'
    hex: '3a00d80caf'
    decoded: 'equivalent plain CDN: -14159024'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 3.2: "The value of the literal is a number representing the result of a conversion of the given Standard Date/Time String to an Epoch-Based Date/Time. If fractional seconds are given in the text (production time-secfrac in Figure 5), the value is a floating-point number; the value is an integer number otherwise. In the all-uppercase variant of the app-prefix, the value is enclosed in a tag number 1." Checked by us: 1969-07-21T02:56:16Z is epoch -14159024. hex is the Preferred Serialization of the plain-CDN value; the document prints only the plain CDN, not bytes. The `.0` fractional second is what turns the integer into a float, so `dt''...16Z''` and `dt''...16.0Z''` are DIFFERENT data items.'
  - id: "draft-ietf-cbor-edn-literals#V-0131"
    locator: '§3.2 Table 3'
    edn: |-
      dt'1969-07-21T02:56:16.0Z'
    hex: 'facb580cb0'
    decoded: 'equivalent plain CDN: -14159024.0, as a binary32 float'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 3.2: "The value of the literal is a number representing the result of a conversion of the given Standard Date/Time String to an Epoch-Based Date/Time. If fractional seconds are given in the text (production time-secfrac in Figure 5), the value is a floating-point number; the value is an integer number otherwise. In the all-uppercase variant of the app-prefix, the value is enclosed in a tag number 1." Checked by us: 1969-07-21T02:56:16Z is epoch -14159024. hex is the Preferred Serialization of the plain-CDN value; the document prints only the plain CDN, not bytes. The `.0` fractional second is what turns the integer into a float, so `dt''...16Z''` and `dt''...16.0Z''` are DIFFERENT data items. CORRECTED BY THE VERIFY PASS: pass 1 gave fbc16b019600000000, the binary64 form. -14159024 is 0xD80CB0, which needs 20 significant bits, so binary32 represents -14159024.0 EXACTLY and RFC 8949 Preferred Serialization requires the shortest form that preserves the value (this library''s rfc-8949 record: "Floating-point values also MUST use the shortest form that preserves the value"). The authority inside this document is ''draft-ietf-cbor-edn-literals#R-0222'' (Section 4.1): with no encoding indicator, Preferred Serialization is what is implied. Contrast ''draft-ietf-cbor-edn-literals#V-0132'' — -14159023.5 needs 25 significant bits, so there binary64 IS the preferred form.'
