  - id: "draft-ietf-cbor-edn-literals#V-0009"
    locator: '§2.1'
    edn: |-
      /grasp-message/ [/M_DISCOVERY/ 1, /session-id/ 10584416,
                       /objective/ [/objective-name/ "opsonize",
                                    /D, N, S/ 7, /loop-count/ 105]]
    hex: '83011a00a1816083686f70736f6e697a65071869'
    decoded: 'array [1, 10584416, ["opsonize", 7, 105]] with six inline slash-delimited comments'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. "Comments can be used to annotate a CBOR structure as in: ... This reduces to [1, 10584416, ["opsonize", 7, 105]]." Note `/D, N, S/`: an inline comment may contain commas, so a comment is not a separator; Section 2.4.1 requires a comma OR blank space, and the comment supplies blank space.'
  - id: "draft-ietf-cbor-edn-literals#V-0010"
    locator: '§2.1'
    edn: |-
      [1, 10584416, ["opsonize", 7, 105]]
    hex: '83011a00a1816083686f70736f6e697a65071869'
    decoded: 'the same array with the comments removed'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. The source prints this as the reduction of the commented form. Comments are blank space (Section 2.1) and leave no trace in the data item.'
  - id: "draft-ietf-cbor-edn-literals#V-0011"
    locator: '§2.1'
    edn: |-
      {
       /kty/ 1 : 4, # Symmetric
       /alg/ 3 : 5, # HMAC 256-256
        /k/ -1 : h'6684523ab17337f173500e5728c628547cb37df
                   e68449c65f885d1b73b49eae1'
      }
    hex: 'a3010403052058206684523ab17337f173500e5728c628547cb37dfe68449c65f885d1b73b49eae1'
    decoded: 'map {1: 4, 3: 5, -1: h''6684...eae1''} — a COSE symmetric key, kty/alg/k with HMAC 256-256'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Combines inline `/.../` comments with `#` end-of-line comments, and splits a 32-byte hex literal across two source lines: "In the base-encoded byte string literals, blank space is ignored in the input" (Section 3.1). This is the document''s only COSE example outside Appendix A.'
  - id: "draft-ietf-cbor-edn-literals#V-0012"
    locator: '§2.1'
    edn: |-
      {1: 4, 3: 5, -1: h'6684523AB17337F173500E5728C628547CB37DFE68449C65F885D1B73B49EAE1'}
    hex: 'a3010403052058206684523ab17337f173500e5728c628547cb37dfe68449c65f885d1b73b49eae1'
    decoded: 'the same map, comments removed and the hex joined onto one line'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. The source prints the reduced form in UPPERCASE hex and the commented form in lowercase; Section 6.2.1 says the h grammar "accommodates both lowercase and uppercase hex digits", so the two denote the same 32 bytes. A useful case-insensitivity vector.'
  - id: "draft-ietf-cbor-edn-literals#V-0013"
    locator: '§2.1'
    edn: |-
      /* ### MyApp Configuration
       * John Example, 2026-06-09
       */
      {
        // Top-level config for the app
        "appName": "MyApp", // short name shown in UI
        "version": "1.2.0",
        ...: ...
      }
    decoded: 'map with "appName": "MyApp", "version": "1.2.0" and one elided key/value pair; under Section 5.2 the elided pair ingests as CPA888(null): CPA888(null)'
    expect: 'valid'
    notes: 'NO HEX. The tag number for the Diagnostic Notation Ellipsis Tag is still CPA888 (Section 7.5 requests 888), so no encoding can be given: "For each usage of the term "CPA", please remove the prefix "CPA" from the indicated value and replace the residue with the value assigned by IANA". Exercises all three of the C-style, `//` end-of-line and trailing-comma features at once. Ingestion is an error unless ellipsis handling is enabled (Section 5.2).'
  - id: "draft-ietf-cbor-edn-literals#V-0014"
    locator: '§2.1.1'
    edn: |-
      //
    decoded: 'not a data item; an end-of-line comment introducer'
    expect: 'invalid'
    violates: '§2.1.1 — the backwards-incompatible change: "Inline comments no longer can be empty: The construct "//" that was an empty comment in Appendix G.6 of [RFC8610] is now used instead to introduce an end-of-line comment." Also §6.1: `comment = ... / eol-comment *non-lf %x0A` needs a terminating LF, and `one-item = S item S` needs an item.'
    notes: 'NO HEX. `//` was a complete (empty) comment under RFC 8610 Appendix G.6 and is now a comment INTRODUCER. This is one of the two changes Section 1.3.4 calls "not entirely backward compatible". A CDN document consisting of `//` alone denotes nothing.'
  - id: "draft-ietf-cbor-edn-literals#V-0015"
    locator: '§2.1.1'
    edn: |-
      /*foo/
    decoded: 'not a data item; the opening of an unterminated C-style comment'
    expect: 'invalid'
    violates: '§2.1.1 — "Enabling the use of C-style inline comments can extend the scope of what previously were parsed as slash-delimited comments: for instance, "/*foo/" was a complete comment in Appendix G.6 of [RFC8610] and now is the beginning of a C-style comment that goes on up to a "*/"."'
    notes: 'NO HEX. The second of the two backward-incompatible changes. Under RFC 8610 Appendix G.6 this was a complete comment; under this document it opens a C-style comment that is never closed, so any text following it is swallowed. The sharpest re-parse hazard in the document for any corpus of existing EDN.'
  - id: "draft-ietf-cbor-edn-literals#V-0016"
    locator: '§2.1.1'
    edn: |-
      4 /* HMAC 256/64 */
    hex: '04'
    decoded: 'unsigned integer 4, annotated'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. The motivating example for C-style comments: a COSE algorithm identifier whose name contains a slash. The algorithm named is "HMAC 256/64" (COSE alg 4).'
  - id: "draft-ietf-cbor-edn-literals#V-0017"
    locator: '§2.1.1'
    edn: |-
      4 / HMAC 256//64 /
    hex: '04'
    decoded: 'unsigned integer 4; TWO adjacent slash-delimited comments, not one'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. "the previously conventional, but often less familiar" form. Section 2.1.1: "(Note that "//" still can be used in what is visually "within" a slash-delimited comment like in the second example below; its first slash actually ends the current comment and the second slash starts a new one.)" So this is `/ HMAC 256/` + `/64 /`, which is why it reads badly.'
  - id: "draft-ietf-cbor-edn-literals#V-0018"
    locator: '§2.2'
    edn: |-
      0
    hex: '00'
    decoded: 'unsigned integer zero'
    expect: 'valid'
    notes: 'SOURCE HEX. The document prints both the EDN and these bytes; this extraction decoded the bytes and confirms they denote the EDN. Section 2.2: "A leading "+" sign is a no-op, and a leading "-" sign inverts the sign of the number. So 0, 000, +0 all represent the same integer zero, as does -0." Table 1 prints the row `0, +0, -0 | 00`; `000` comes from the prose. Leading zeros and a leading `+` are CDN-only: RFC 8610 has `uint = DIGIT1 *DIGIT / "0x" ... / "0"` and `int = ["-"] uint`.'
