  - id: "draft-ietf-cbor-edn-literals#V-0101"
    locator: '§2.4.1'
    edn: |-
      [[][]]
    decoded: 'not a CDN document'
    expect: 'invalid'
    violates: '§2.4.1 — "As a comma and/or blank/comment is mandatory in a separator position ... »[[] []]« or »[[],[]]« are well-formed CDN, while »[[][]]« is not." §6.1: `array = "[" (specms S item *(MSC item) SOC / spec S) "]"` and `MSC = ("," S) / (MS ["," S])` — MSC cannot be empty.'
    notes: 'NO HEX. The one place where CDN is STRICTER than CDDL. The aside immediately below records it: "CDDL''s comma separators in the equivalent contexts (CDDL groups) are entirely optional ... (CDDL does allow the stylistically questionable »a = [[][]]«, though.)" So this exact text is a CDN error and a CDDL success.'
  - id: "draft-ietf-cbor-edn-literals#V-0102"
    locator: '§2.4.2'
    edn: |-
      {1: "to", 1: "from"}
    hex: 'a20162746f016466726f6d'
    decoded: 'map with the key 1 twice: well-formed CBOR, not valid CBOR'
    expect: 'invalid'
    violates: '§2.4.2 — "For maps, this is relevant for map keys that occur more than once, as in this CDN that is not representing a valid CBOR data item". The underlying rule is RFC 8949 Section 5.3.1 (basic validity).'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. The CDN parses; the item it denotes is invalid. Section 2: "its implementations MAY support generation and possibly ingestion of CDN for CBOR data items that are well-formed but not valid. It is RECOMMENDED that an implementation enables such usage only explicitly by configuration (such as an API or CLI flag)." Note the direction: CDN makes the invalid item WRITABLE by default and makes rejecting it a configuration choice.'
  - id: "draft-ietf-cbor-edn-literals#V-0103"
    locator: '§2.5'
