    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. The document''s contrast case: "Note that the use of elisions is different from "commenting out" CDN text" and "The consumer of this CDN will ignore the comments and therefore will have no idea after ingestion that some information has been elided; validation steps may then simply fail instead of being informed about the elisions." Checked by us: `/.../` matches `comment = "/" non-slash-star *non-slash "/"` inside `app-string-h`, so the bytes are 47 11 08 15 — four bytes, not an elision. Compare h''4711...0815'' in Section 3.5, which is the SAME shape with one character changed and a completely different meaning.'
