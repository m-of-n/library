    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 2.5: "A tag is written as a decimal unsigned integer (no leading zeros except for the actual tag number zero, i.e., 0|[1-9][0-9]*) for the tag number, followed by the tag content in parentheses". CDDL writes the same tag `#6.0(tstr)`.'
