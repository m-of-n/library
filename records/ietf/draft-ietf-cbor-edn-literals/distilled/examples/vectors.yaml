      h''
    hex: '40'
    decoded: 'empty byte string'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 6.2.1 lists h'''' as the empty case of `app-string-h = S *(HEXDIG S HEXDIG S / ellipsis S) [eol-comment *non-lf]` — the star allows zero repetitions. Same literal as the one named in Section 1.3.2; kept because this is where the grammar covers it.'
  - id: "draft-ietf-cbor-edn-literals#V-0242"
