    hex: '820102'
    decoded: 'definite-length array [1, 2] — the same data item'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. The item `[_ 1, 2]` says was encoded with an indefinite length. Encoding indicators carry serialization, never data-model, information.'
  - id: "draft-ietf-cbor-edn-literals#V-0216"
