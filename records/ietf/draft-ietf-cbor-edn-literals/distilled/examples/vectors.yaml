    notes: 'SOURCE HEX CORRECTED. DEFECT IN THE SOURCE, FOUND BY THIS EXTRACTION''S ROUND-TRIP. Table 6''s major-type-3 row prints `| 3 | "A"_1 | 79000161 | 6161 |`. Those bytes do not encode "A". 0x79 is major type 3, ai=25, so the two-byte length 0x0001 must be followed by the ONE content byte of the string, and "A" is U+0041 = 0x41. The correct encodings are 79000141 and, ignoring the encoding indicator, 6141. The printed 79000161 and 6161 are the encodings of "a" (U+0061), not "A". The error is almost certainly a copy of the row above it: for the major-type-2 row `''A''_1 | 59000141 | 4141`, the byte-string head for a one-byte string is 0x41 and the content byte is also 0x41, so head and content coincide; for major type 3 the head is 0x61 and the content is still 0x41, and the row was written as though they coincided too. The `hex` field here carries OUR corrected bytes, not the document''s, so that this vector is usable; the document''s printed bytes are quoted above and must not be used. Every other cell of Table 6 was decoded and confirmed correct.'
