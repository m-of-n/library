    decoded: 'a general ellipsis; under Section 5.2 it ingests as CPA888(null)'
    expect: 'valid'
    notes: 'NO HEX. "A single ... is a general ellipsis, which by itself can stand for any data item, but when used as argument to t1/b1 must stand in for a string value." Section 6.1: `ellipsis = 3*"." ; "..." or more dots` — THREE OR MORE dots, so `....` is also an ellipsis. CAUTION for CDDL: `...` is CDDL''s exclusive range operator (`rangeop = "..." / ".."`, RFC 8610 Appendix B).'
