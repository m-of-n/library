      .3
    hex: 'fb3fd3333333333333'
    decoded: 'floating-point 0.3'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Checked by us: 0.3 is not exactly representable in binary16 or binary32, so Preferred Serialization is binary64.'
  - id: "draft-ietf-cbor-edn-literals#V-0237"
    locator: '§6.1 item 3'
    edn: |-
