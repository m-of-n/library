    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Named in prose as a notation: "the << >> notation as opposed to, say, hexadecimal h'''' notation". Blank space between the brackets is permitted by `embedded = "<<" seq ">>"` with `seq = S [...]` (Section 6.1).'
