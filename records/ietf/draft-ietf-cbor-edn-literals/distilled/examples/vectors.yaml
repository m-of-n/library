    expect: 'valid'
    notes: 'NO HEX. "Subtree elisions can be represented in a CBOR data item by using /CPA/888(null) as the placeholder CBOR data item". The source writes 888 bare here; it is still the CPA placeholder (Section 7.5). No encoding until IANA assigns.'
  - id: "draft-ietf-cbor-edn-literals#V-0230"
    locator: '§5.2'
    edn: |-
