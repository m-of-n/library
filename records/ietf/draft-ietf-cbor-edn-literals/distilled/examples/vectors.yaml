    hex: '73446f6d696e6f277320f09f81b3202b20e28c98'
    decoded: 'the same text string, using JSON''s BMP escapes and a surrogate pair for U+1F073'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 2.3.1: the three forms are equivalent; "CDN keeps [JSON''s escape scheme], but also adds the syntax \u{NNN} where NNN is the Unicode scalar value as a hexadecimal number." The surrogate-pair form is the one Section 2.3.1 calls "cumbersome". PARSE NOTE (cross-check pass): as for V-0059, the trailing `#` comment needs the line terminator the `|-` scalar strips — schema/grammar-gaps.derived.txt G-31.'
  - id: "draft-ietf-cbor-edn-literals#V-0061"
