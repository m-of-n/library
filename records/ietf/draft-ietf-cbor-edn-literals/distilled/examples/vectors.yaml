  - id: "draft-ietf-cbor-edn-literals#V-0194"
    locator: '§3.8'
    edn: |-
      [float'fe00', float'fe00'_2, float'47110815']
    hex: '83f9fe00faffc00000fa47110815'
    decoded: 'array of three major-type-7 items: a binary16 negative quiet NaN, the same NaN re-encoded as binary32, and the binary32 value 37128.08203125'
    expect: 'valid'
    notes: 'SOURCE HEX. The document prints both the EDN and these bytes; this extraction decoded the bytes and confirms they denote the EDN. Section 3.8: "The "float" app-extension enables the notation of 2-byte, 4-byte, and 8-byte byte strings to express floating point values (mt=7, ai=25/26/27 respectively) by giving their IEEE 754 representation. A text string used as an argument is interpreted exactly as a hex literal (like the h prefix); the result is used as the byte string." The source prints the encoding as an annotated hexdump: "83 # array(3) / F9 FE00 # primitive(65024) / FA FFC00000 # primitive(4290772992) / FA 47110815 # primitive(1192298517)". Checked by us: 0xFE00 = 65024, 0xFFC00000 = 4290772992, 0x47110815 = 1192298517, and 0x47110815 as binary32 is 37128.08203125. NOTE the tool prints the raw ARGUMENT, not the float value, which is why the NaN rows read as large integers.'
  - id: "draft-ietf-cbor-edn-literals#V-0195"
    locator: '§3.8'
    edn: |-
      float'fe00'
    hex: 'f9fe00'
    decoded: 'binary16 NaN with the sign bit set (0xFE00)'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 3.8: "The "float" app-extension enables the notation of 2-byte, 4-byte, and 8-byte byte strings to express floating point values (mt=7, ai=25/26/27 respectively) by giving their IEEE 754 representation. A text string used as an argument is interpreted exactly as a hex literal (like the h prefix); the result is used as the byte string." Checked by us: exponent field all ones with a non-zero significand is a NaN; the sign bit is 1. This is a NaN that base CDN cannot write, which is the whole point of the extension: "Without this (or a similar) extension there is no way to represent NaN values different from the one called out at the end of Section 4.1 of RFC 8949 [STD94]" — which continues by quoting 8949''s own "(for many applications, the single NaN encoding 0xf97e00 will suffice)".'
  - id: "draft-ietf-cbor-edn-literals#V-0196"
