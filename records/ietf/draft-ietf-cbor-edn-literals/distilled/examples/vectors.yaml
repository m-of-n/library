    edn: |-
      h'0815'
    hex: '420815'
    decoded: 'two-byte byte string 08 15'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 6.2.1 example.'
  - id: "draft-ietf-cbor-edn-literals#V-0243"
    locator: '§6.2.1'
    edn: |-
      h'/head/ 63 /contents/ 66 6f 6f'
    hex: '4463666f6f'
    decoded: 'four-byte byte string 63 66 6f 6f, which is itself the CBOR encoding of the text string "foo"'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 6.2.1: the source calls this "another representation of << \"foo\" >>". CHECKED BY US: 0x63 is major type 3 ai=3 and 66 6f 6f is "foo", so the byte string''s CONTENT is a valid encoded CBOR item — the same bytes `<<"foo">>` produces. The comments inside the literal annotate the head and the contents.'
  - id: "draft-ietf-cbor-edn-literals#V-0244"
    locator: '§6.2.1'
    edn: |-
      << "foo" >>
    hex: '4463666f6f'
    decoded: 'embedded CBOR: the byte string holding the encoding of "foo"'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. The equivalence Section 6.2.1 asserts. Verified against the h'''' form above.'
  - id: "draft-ietf-cbor-edn-literals#V-0245"
    locator: 'Appendix A'
    edn: |-
      { / alg / 1: -7 / ECDSA 256 / }
    hex: 'a10126'
    decoded: 'map {1: -7} — a COSE header map naming ECDSA with SHA-256'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Appendix A (informative) compares CDN with CDDL: "For engineers that are using both CDN and CDDL, it is easy to write "CDDLisms" or "CDNisms" into their drafts that are meant to be in the other language. (This is one more of the many motivations to always validate formal language instances with tools.)" The CDDL shown beside it is `? 1 => int / tstr, ; algorithm identifier`. CHECKED BY US against RFC 8610 Appendix B: fed to a CDDL parser this CDN line IS a syntax error, which is the outcome we want. CDDL''s `/` is the infix type-choice operator (`type = type1 *(S "/" S type1)`) and no `type2` alternative begins with `/`, so a leading slash-delimited comment cannot start a group entry. Contrast the `#`-comment form in the next vector, which parses silently as something else.'
  - id: "draft-ietf-cbor-edn-literals#V-0246"
    locator: 'Appendix A'
    edn: |-
      { 1:   # alg
          -7 # ECDSA 256
      }
    hex: 'a10126'
    decoded: 'the same map {1: -7}, annotated with end-of-line comments'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Appendix A (informative) compares CDN with CDDL: "For engineers that are using both CDN and CDDL, it is easy to write "CDDLisms" or "CDNisms" into their drafts that are meant to be in the other language. (This is one more of the many motivations to always validate formal language instances with tools.)" CAUTION, ours: this is the sharpest CDN/CDDL collision in the document. In CDDL, `#` alone is `type2 = ... / "#" ; any` (RFC 8610 Appendix B), so a CDDL parser reads `1: #` as "key 1 mapped to any data item" and then takes `alg`, `-7`, `ECDSA`, `256` as further group entries. It does not error — it silently means something else.'
  - id: "draft-ietf-cbor-edn-literals#V-0247"
    locator: 'Appendix A'
    edn: |-
      98([h'', # empty encoded protected header
          {},  # empty unprotected header
          ...  # rest elided here
         ])
    decoded: 'tag 98 (COSE_Sign) over an array whose first two elements are an empty byte string and an empty map, with the rest elided'
    expect: 'valid'
    notes: 'NO HEX. Appendix A (informative) compares CDN with CDDL: "For engineers that are using both CDN and CDDL, it is easy to write "CDDLisms" or "CDNisms" into their drafts that are meant to be in the other language. (This is one more of the many motivations to always validate formal language instances with tools.)" NO HEX: the elision needs tag CPA888. This is the document''s own idiom for writing a COSE object in CDN, and it opens with a REGISTERED CBOR TAG (98 = COSE_Sign, RFC 9052 Table 1). The CDDL shown beside it is `COSE_Sign_Tagged = #6.98(COSE_Sign)`.'
  - id: "draft-ietf-cbor-edn-literals#V-0248"
    locator: 'Appendix A'
    edn: |-
      98([<< {/alg/ 1: -7 /ECDSA 256/} >>, # == h'a10126'
          ...                              # rest elided here
         ])
    decoded: 'tag 98 over an array whose first element is the protected header serialized as embedded CBOR, with the rest elided'
