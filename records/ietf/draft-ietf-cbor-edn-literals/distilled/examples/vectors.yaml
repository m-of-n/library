    edn: |-
      float'fe00'_2
    hex: 'faffc00000'
    decoded: 'the same NaN value re-encoded as binary32'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 3.8: "The "float" app-extension enables the notation of 2-byte, 4-byte, and 8-byte byte strings to express floating point values (mt=7, ai=25/26/27 respectively) by giving their IEEE 754 representation. A text string used as an argument is interpreted exactly as a hex literal (like the h prefix); the result is used as the byte string." "Note that the interpretation as an encoded data item does not create or imply an encoding indicator; that can be added separately." So the byte string''s LENGTH chooses the initial byte, and `_2` then widens the result. Checked by us: the binary32 image of the binary16 NaN 0xFE00 is 0xFFC00000.'
  - id: "draft-ietf-cbor-edn-literals#V-0197"
