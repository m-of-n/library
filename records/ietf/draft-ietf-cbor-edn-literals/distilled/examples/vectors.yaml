    decoded: 'an elided byte string: under Section 5.2 it ingests as CPA888([''Hello'', CPA888(null), ''world''])'
    expect: 'valid'
    notes: 'NO HEX. The ellipsis tag number is unassigned (CPA888), so no encoding can be given. "Arguments with nested ellipses are flattened and the above equivalences applied, so that, for instance, these values are equivalent". Note the first form: the ellipsis appears INSIDE an h'''' literal, which `app-string-h = S *(HEXDIG S HEXDIG S / ellipsis S)` permits (Section 6.2.1).'
  - id: "draft-ietf-cbor-edn-literals#V-0183"
