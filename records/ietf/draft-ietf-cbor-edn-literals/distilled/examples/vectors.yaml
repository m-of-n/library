  - id: "draft-ietf-cbor-edn-literals#V-0028"
    locator: '§2.2 Table 1'
    edn: |-
      4711
    hex: '191267'
    decoded: 'unsigned integer 4711, encoded with a two-byte argument'
    expect: 'valid'
    notes: 'SOURCE HEX. The document prints both the EDN and these bytes; this extraction decoded the bytes and confirms they denote the EDN. Table 1 row: "all the items on a row are the same number (also shown in CBOR, hexadecimally), but they are distinct from items in a different row." Checked by us: 0x1267 = 0o11147 = 0b1001001100111 = 4711, and 19 1267 is major type 0, ai=25, argument 0x1267. NOTE for CDDL users: `0o` octal is CDN-only; RFC 8610 `uint` admits 0x and 0b and no octal.'
