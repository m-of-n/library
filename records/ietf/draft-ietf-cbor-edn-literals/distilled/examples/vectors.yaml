    locator: '§2.2 Table 1'
    edn: |-
      1.5
    hex: 'f93e00'
    decoded: 'binary16 floating-point 1.5'
    expect: 'valid'
    notes: 'SOURCE HEX. The document prints both the EDN and these bytes; this extraction decoded the bytes and confirms they denote the EDN. Table 1 row: "all the items on a row are the same number (also shown in CBOR, hexadecimally), but they are distinct from items in a different row." Checked by us: 0x3E00 as binary16 is 1.5; 0x1.8p0 = 0x18p-4 = 0.15e1 = 15e-1 = 1.5. `p` is the hexadecimal exponent marker and `e` the decimal one (Section 2.2).'
