    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Section 1.2: "ASCII quotes, however, are already taken: true, "true", ''true'', and `true` are all different literals in CDN and should not be confused."'
