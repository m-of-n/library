    expect: 'valid'
    notes: 'NO HEX. "(Note that the tag-based representation form defined here does not allow multiple key/value pairs with an ellipsis as a key: the CBOR data item would not be valid.)" So at most ONE `...: ...` entry per map — an elision limit that follows from map-key uniqueness.'
