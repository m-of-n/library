    hex: '84f9fe00faffc00000fa47110815fa47110815'
    decoded: 'the four-element input the second tool invocation is given'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. The source prints this only as a tool INPUT, with the tool''s CDN output on the next line; it prints no bytes for it. Checked by us: 0x1.22102ap+15 = 37128.08203125, exactly representable in binary32, so the last two elements have identical encodings.'
  - id: "draft-ietf-cbor-edn-literals#V-0199"
    locator: '§3.8'
    edn: |-
      [float'fe00', float'fe00'_2, 37128.08203125, 37128.08203125]
    hex: '84f9fe00faffc00000fa47110815fa47110815'
    decoded: 'the tool''s CDN OUTPUT for the line above'
    expect: 'valid'
    notes: 'COMPUTED HEX. The round-trip the document is demonstrating: the two NaN items cannot be written as decimal floats so they come back as float'''' literals, while both finite spellings come back as the same decimal. "For finite floating point numbers, the decimal or hex floating point representations are preferred." This is the document''s own demonstration that CDN -> CBOR -> CDN is NOT the identity (Section 1.3.2).'
  - id: "draft-ietf-cbor-edn-literals#V-0200"
    locator: '§3.8'
    edn: |-
      0x1.22102ap+15
    hex: 'fa47110815'
    decoded: 'hexadecimal floating-point literal for 37128.08203125'
    expect: 'valid'
    notes: 'COMPUTED HEX. The document prints only the EDN; the bytes are this extraction''s encoding of it. Checked by us: (1 + 0x22102a/2^24) * 2^15 = 37128.08203125, and binary32 represents it exactly, so Preferred Serialization is four bytes. CDDL has a hexfloat too (`hexfloat = ["-"] "0x" 1*HEXDIG ["." 1*HEXDIG] "p" exponent`) but no leading `+` sign and no empty fraction, so `+0x1.p0` and `0x.8p0` are CDN-only.'
