  - id: "draft-ietf-cbor-edn-literals#V-0226"
    locator: '§5.1'
    edn: |-
      /CPA/ 999(["hash", ["data", -44]])
    decoded: 'the unresolved form of hash<<"data", -44>>'
    expect: 'valid'
    notes: 'NO HEX. "For app-sequences, the second array contains zero or more items, which represent each item in the sequence contained in the app- sequence." (the source breaks "app- sequence" at a line end, source lines 2174-2175, as ''draft-ietf-cbor-edn-literals#R-0154'' records.) Tag number unassigned. Section 5.1 closes with a sentence that cannot be quoted whole without carrying TWO line-break hyphenations, so it is carried here exactly as the source renders it: "If a stage of ingestion is not prepared to handle the Unresolved App- Extension Tag, this is an error and processing has to stop, as if this stage had been ingesting an unknown or unimplemented app- extension literal itself." ''draft-ietf-cbor-edn-literals#R-0155'' quotes only its obligation-bearing half.'
  - id: "draft-ietf-cbor-edn-literals#V-0227"
    locator: '§5.2'
    edn: |-
      [1, 2, ..., 3]
    decoded: 'array whose third element is elided; ingests as [1, 2, CPA888(null), 3]'
