    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0060"
    object: 'sources of non-UTF-8 byte sequences'
    field: 'no BCP 14 keyword; definitional and exhaustive — ''Only app-extensions ... can'''
    verb: 'none'
    actor: 'implementation'
    locator: '§2.3.5'
    text: 'Double-quoted, single-quoted, and raw string literals have been defined such that they lead to byte sequences that are UTF-8: the source language of CDN is UTF-8, and all escaping mechanisms lead only to adding further UTF-8 characters.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0061"
    object: 'generation/ingestion of invalid CBOR, restated for text strings'
    field: 'permission; restates the §2 permission in the text-string context'
    verb: 'MAY'
    actor: 'implementation'
    locator: '§2.3.5'
    text: 'As discussed at the start of Section 2, CDN implementations MAY support generation and possibly ingestion of CDN for CBOR data items that are well-formed but not valid;'
    kind: stated
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0062"
    object: 'relaxing the UTF-8 requirement on text strings'
    field: 'permission, conditional on the permission above being exercised'
    verb: 'MAY'
    actor: 'implementation'
    locator: '§2.3.5'
    text: 'when this is enabled, such implementations MAY relax the requirement on text strings to be valid UTF-8.'
    kind: stated
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0063"
    object: 'Unicode processing beyond UTF-8 conformance'
    field: 'no BCP 14 keyword; an explicit DISCLAIMER — no normalisation, no assigned-codepoint check, no Unicode-version dependence'
    verb: 'none'
    actor: 'implementation'
    locator: '§2.3.5'
    text: 'No additional Unicode processing or validation such as normalization or checking whether a scalar value is actually assigned is foreseen by CDN, particularly not any processing that is dependent on a specific Unicode version.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0064"
    object: 'optional Unicode processing, if an implementation offers it'
    field: 'the document''s only prohibition, and it bounds an optional feature rather than a required one'
    verb: 'MUST NOT'
    actor: 'implementation'
    locator: '§2.3.5'
    text: 'Such processing, if offered, MUST NOT get in the way of processing the data item represented in CDN (i.e., it may be appropriate to issue warnings but not to error out or to generate output that does not match the input at the UTF-8 level).'
    kind: stated
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0065"
    object: 'map key position'
    field: 'no BCP 14 keyword; definitional, and the chief syntactic difference from JSON objects'
    verb: 'none'
    actor: 'writer'
    locator: '§2.4'
    text: 'For maps, CDN extends the JSON syntax by allowing any data item in the map key position (before the colon).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0066"
    object: 'separator between array elements and map members'
    field: 'a lower-case ''must'', not a BCP 14 keyword. NOTE: the sentence is SEVERED BY A PAGE FRAME between ''there must'' (source line 1228) and ''be blank space'' (line 1237); the quote is contiguous only after the running header/footer is removed'
    verb: 'must'
    actor: 'writer'
    locator: '§2.4.1'
    text: 'The separator commas are now optional in the places where CDN syntax allows commas; however, where no comma is used in a separator position, there must be blank space (composed of at least one space, newline, and/or comment) instead.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0067"
    object: 'trailing comma'
    field: 'no BCP 14 keyword; an explicit permission with an explicit non-obligation'
    verb: 'none'
    actor: 'writer'
    locator: '§2.4.1'
    text: 'In addition, CDN also allows, but does not require, a trailing comma before the closing bracket/brace, enabling an easier to maintain "terminator" style of their use.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0068"
    object: 'a separator position with neither comma nor blank space'
    field: 'no BCP 14 keyword; the force is ''is mandatory'' plus a worked well-formedness verdict. This is the rule that makes [[][]] ill-formed'
    verb: 'mandatory'
    actor: 'parser'
    locator: '§2.4.1'
    text: 'As a comma and/or blank/comment is mandatory in a separator position, »[11]« is unambiguously an array with a single element (the integer 11), different from »[1 1]« or »[1,1]«.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0069"
    object: 'adjacent bracketed items with no separator'
    field: 'no BCP 14 keyword; a well-formedness verdict stated as a general rule'
    verb: 'none'
    actor: 'parser'
    locator: '§2.4.1'
    text: 'As this is a general rule, »[[] []]« or »[[],[]]« are well-formed CDN, while »[[][]]« is not.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0070"
    object: 'duplicate map keys'
    field: 'permission; restates the §2 permission in the map context'
    verb: 'MAY'
    actor: 'implementation'
    locator: '§2.4.2'
    text: 'As discussed at the start of Section 2, CDN implementations MAY support generation and possibly ingestion of CDN for CBOR data items that are well-formed but not valid (Section 5.3 of RFC 8949 [STD94]).'
    kind: stated
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0071"
    object: 'tag literal'
    field: 'no BCP 14 keyword; definitional, and it pins the tag-number lexis to 0|[1-9][0-9]*'
    verb: 'none'
    actor: 'writer'
    locator: '§2.5'
    text: 'A tag is written as a decimal unsigned integer (no leading zeros except for the actual tag number zero, i.e., 0|[1-9][0-9]*) for the tag number, followed by the tag content in parentheses;'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0072"
    object: 'encoding indicator on a tag'
    field: 'no BCP 14 keyword; definitional — the indicator binds to the TAG HEAD, not the content'
    verb: 'none'
    actor: 'parser'
    locator: '§2.5'
    text: 'The tag number can be followed by an encoding indicator giving the encoding of the tag head.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0073"
    object: 'true, false, null, undefined'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'writer'
    locator: '§2.6'
    text: 'CDN uses JSON syntax for the simple values True (»true«), False (»false«), and Null (»null«). Undefined is written »undefined« as in JavaScript.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0074"
    object: 'the simple() form'
    field: 'no BCP 14 keyword; definitional. NOTE: the prose admits 0|[1-9][0-9]* without limit, which is WIDER than the grammar''s simple-number (see schema/README.md)'
    verb: 'none'
    actor: 'writer'
    locator: '§2.6'
    text: 'These and all other simple values can be given as "simple()" with the appropriate decimal unsigned integer (0|[1-9][0-9]*) in the parentheses.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0075"
    object: 'prefixed literal, overall shape'
    field: 'no BCP 14 keyword; definitional. NOTE: ''app-extension'' is BROKEN BY HYPHENATION at a line break (source lines 1336-1337), so the quote carries ''app- extension'' as the whitespace-normalised source renders it'
    verb: 'none'
    actor: 'parser'
    locator: '§3'
    text: 'Prefixed literals start with a _prefix_ that identifies the app- extension and possibly a specific variant of that, immediately followed by a sequence literal (Section 2.3.4) or a single-quoted or raw string literal (Section 2.3).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0076"
    object: 'string-based prefixed literal'
    field: 'no BCP 14 keyword; definitional - the string form is SUGAR for a one-element sequence literal, which is why an app-extension cannot tell the two apart'
    verb: 'none'
    actor: 'parser'
    locator: '§3'
    text: 'The string-based forms use their string literal as a shorthand form for a sequence literal representing a sequence with exactly that one text string data item, e.g., b64`Zm9v` is a shorthand for b64<<"Zm9v">> or b64<<`Zm9v`>>'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0077"
    object: 'the four byte-string prefixes of RFC 8949 Section 8'
    field: 'no BCP 14 keyword; the document''s own statement of the INHERITED namespace, and the first half of the answer to whether b32/h32 survive. Quoted from an aside block (the plain-text gutter is removed, as the page header/footer is)'
    verb: 'none'
    actor: 'implementation'
    locator: '§3'
    text: 'This notation is generalized from Section 8 of RFC 8949 [STD94], which provides for notating byte strings in a number of [RFC4648] base encodings, where the encoded text is enclosed in single quotes, prefixed by a prefix (»h« for base16, »b32« for base32, »h32« for base32hex, »b64« for base64 or base64url).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0078"
    object: 'the prefix namespace'
    field: 'no BCP 14 keyword; definitional. It says h, b32, h32 and b64 are TAKEN in the namespace - which is why b32 and h32 appear as Reserved in Table 8 and cannot be re-registered for anything else. NOTE: ''app-extension'' is broken by hyphenation at a line break (source lines 1366-1367). Quoted from an aside block'
    verb: 'none'
    actor: 'implementation'
    locator: '§3'
    text: 'This syntax can be thought to establish a name space, with the names "h", "b32", "h32", and "b64" taken, but other names being unallocated. The present specification allows registering additional names for this namespace, which it calls _app- extension identifiers_.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0079"
    object: 'app-extension identifier lexis'
    field: 'no BCP 14 keyword; definitional. This is the ONLY lexical constraint on a prefix: any [a-z][a-z0-9-]* string is syntactically a prefix, registered or not'
    verb: 'none'
    actor: 'parser'
    locator: '§3'
    text: 'More precisely, an _app-extension identifier_ is a registered name consisting of a lowercase ASCII letter ([a-z]) and zero or more additional ASCII characters that are either lowercase letters, digits, or hyphens ([a-z0-9-]).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0080"
    object: 'the four reserved words'
    field: 'no BCP 14 keyword; the force is ''cannot be used ... and are reserved''. Needed because the grammar would otherwise let a bare keyword begin a prefixed literal'
    verb: 'cannot'
    actor: 'implementation'
    locator: '§3'
    text: '»false«, »true«, »null«, and »undefined« cannot be used as such identifiers and are reserved.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0081"
    object: 'registration of app-extension identifiers'
    field: 'no BCP 14 keyword; definitional pointer to the IANA registry of Section 7.1'
    verb: 'none'
    actor: 'implementation'
    locator: '§3'
    text: 'app-extension identifiers are registered in the "App-Extension Identifiers" registry (Section 7.1).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0082"
    object: 'the all-uppercase prefix variant'
    field: 'permission granted to an app-extension''s definition, not to an implementation'
    verb: 'MAY'
    actor: 'implementation'
    locator: '§3'
    text: 'An app-extension (such as dt) MAY also define the meaning of one additional prefix derived from its app-extension identifier by replacing each lowercase character by its uppercase counterpart (such as DT).'
    kind: stated
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0083"
    object: 'semantics of the uppercase variant'
    field: 'no BCP 14 keyword; the force is ''As a convention ... implies''. It is a convention, not a rule, so a reader cannot infer the tag from the case alone'
    verb: 'none'
    actor: 'implementation'
    locator: '§3'
    text: 'As a convention, using the all-uppercase variant implies making use of a CBOR tag appropriate for this app-extension (such as tag number 1 for DT, where in contrast the prefix dt stands for the unwrapped tag content).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0084"
    object: 'number of prefixes an identifier yields'
    field: 'no BCP 14 keyword; definitional and exhaustive - one or two, never more'
    verb: 'none'
    actor: 'implementation'
    locator: '§3'
    text: 'In summary, an app-extension identifier gives rise to one or two prefixes, one that is lexically identical to the identifier (i.e., all lowercase), and potentially another one that is an all-uppercase variation of it.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0085"
    object: 'input to an app-extension from a string literal'
    field: 'no BCP 14 keyword; definitional - it fixes the calling convention for every extension'
    verb: 'none'
    actor: 'parser'
    locator: '§3'
    text: 'When the prefix is used immediately in front of a single-quoted or a raw string, the input takes the form of a single text string CBOR data item (this is useful only if the app-extension is designed to receive a text string as input).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0086"
    object: 'input to an app-extension from a sequence literal'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§3'
    text: 'When used immediately in front of a sequence literal, the input is a CBOR sequence of elements of the sequence literal as input.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0087"
    object: 'what an app-extension can and cannot observe'
    field: 'no BCP 14 keyword; an explicit LIMIT on extension semantics (''it cannot distinguish''). It is why the three forms in Tables 3, 4 and 5 must give identical results'
    verb: 'cannot'
    actor: 'implementation'
    locator: '§3'
    text: 'The app-extension can provide behavior that depends on the number of items supplied as input to it and their data types; it cannot distinguish between its prefix being used with a single-quoted string, a raw string, or a CBOR sequence composed of a single text string data item (as illustrated for instance in Tables 3, 4, and 5).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0088"
    object: 'mandatory-to-implement app-extensions'
    field: 'no BCP 14 keyword; the force is the lower-case ''are mandatory to implement''. This is the document''s conformance floor and the ONLY place it is stated. Note which prefixes are in it and which are not'
    verb: 'mandatory to implement'
    actor: 'implementation'
    locator: '§3'
    text: 'Of these, the app-extensions h, b64, t1, b1, dt and ip are mandatory to implement.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0089"
    object: 'base-encoded byte string literal'
    field: 'no BCP 14 keyword; definitional, and it pins NO PADDING'
    verb: 'none'
    actor: 'parser'
    locator: '§3.1'
    text: 'The app-extension identifier selects one of the base encodings [RFC4648], without padding.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0090"
    object: 'the prefixes h and b64'
    field: 'no BCP 14 keyword; definitional. THE OPERATIVE SENTENCE for the byte-string-prefix question: this document names exactly TWO base-encoding prefixes. the sentence quoted here carries no line-break hyphenation; the ''single- quoted'' break at source lines 1435-1436 falls in the NEXT sentence and is not part of this span'
    verb: 'none'
    actor: 'writer'
    locator: '§3.1'
    text: 'Most often, the base encoding is enclosed in a single-quoted or raw string literal, prefixed by »h« for base16 or »b64« for base64 or base64url (the actual encodings of the latter two have the same meaning where they overlap, so the string remains unambiguous).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0091"
    object: 'the prefixes b32 and h32'
    field: 'no BCP 14 keyword; an explicit, reasoned EXCLUSION. This is the document''s disposition of RFC 8949 Section 8''s other two byte-string prefixes. Quoted from an aside block'
    verb: 'not directly included'
    actor: 'implementation'
    locator: '§3.1'
    text: '(Note that Section 8 of RFC 8949 [STD94] also mentions »b32« for base32 and »h32« for base32hex. This has not been implemented widely and therefore is not directly included in this specification. These and further byte string formats now can easily be added back as prefixed literals.)'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0092"
    object: 'blank space inside a base-encoded literal'
    field: 'no BCP 14 keyword; definitional - it is why the three h literals in this section denote the same bytes'
    verb: 'none'
    actor: 'parser'
    locator: '§3.1'
    text: 'In the base-encoded byte string literals, blank space is ignored in the input;'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0093"
    object: 'comments inside h and b64 literals'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§3.1'
    text: 'The internal syntax of prefixed single-quote literals such as h'''' and b64'''' also allow comments as blank space (see Section 2.1).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0094"
    object: 'comments inside a b64 literal'
    field: 'no BCP 14 keyword; the force is ''need to be'' plus ''only ... are available''. A slash inside a b64 literal is DATA, not a comment'
    verb: 'need to be'
    actor: 'parser'
    locator: '§3.1'
    text: 'Slash characters are part of the base64 classic alphabet (see Table 1 in Section 4 of [RFC4648]), and they therefore need to be in the b64'''' set of characters that contribute to the byte string. Therefore, only end-of-line comments starting with # are available inside b64 byte string literals.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0095"
    object: 'dt literal content'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§3.2'
    text: 'The content of the literal is a single Standard Date/Time String as per Section 3.4.1 of RFC 8949 [STD94], as a text or byte string.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0096"
    object: 'dt literal value'
    field: 'no BCP 14 keyword; definitional, and the integer/float choice is driven by SYNTAX (presence of time-secfrac), not by value'
    verb: 'none'
    actor: 'parser'
    locator: '§3.2'
    text: 'The value of the literal is a number representing the result of a conversion of the given Standard Date/Time String to an Epoch-Based Date/Time. If fractional seconds are given in the text (production time-secfrac in Figure 5), the value is a floating-point number; the value is an integer number otherwise.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0097"
    object: 'DT literal value'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§3.2'
    text: 'In the all-uppercase variant of the app-prefix, the value is enclosed in a tag number 1.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0098"
    object: 'ip literal input'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§3.3'
    text: 'The input of the literal is a single text string representing an IPv4address or IPv6address as per Section 3.2.2 of [RFC3986].'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0099"
    object: 'ip and IP literal values'
    field: 'no BCP 14 keyword; definitional - the tag number depends on the ADDRESS FAMILY, so a tool must parse the address to know it'
    verb: 'none'
    actor: 'parser'
    locator: '§3.3'
    text: 'With the lowercase app-string prefix ip, the value of the literal is a byte string representing the binary IP address. With the uppercase app-string prefix IP, the literal is such a byte string tagged with tag number 54, if an IPv6address is used, or tag number 52, if an IPv4address is used.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0100"
    object: 'IP literal with a prefix length'
    field: 'no BCP 14 keyword; the force is ''need to implement'' - a cross-reference obligation to RFC 9164 Section 4.2 truncation'
    verb: 'need to implement'
    actor: 'parser'
    locator: '§3.3'
    text: 'As an additional case, the uppercase app-string prefix IP can be used with an IP address prefix such as 2001:db8::/56 or 192.0.2.0/24, with the equivalent tag as its value.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0101"
    object: 'lowercase ip with a prefix length'
    field: 'no BCP 14 keyword; definitional, with an explicit warning that the untagged form is AMBIGUOUS as to address family'
    verb: 'none'
    actor: 'parser'
    locator: '§3.3'
    text: 'For completeness, the lowercase variant ip''2001:db8::/56'' or ip''192.0.2.0/24'' stands for an unwrapped [56,h''20010db8''] or [24,h''c00002'']; however, in this case the information on whether an address is IPv4 or IPv6 often needs to come from the context.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0102"
    object: 'RFC 9164 Interface format and zone identifiers'
    field: 'no BCP 14 keyword; an explicit GAP in the extension'
    verb: 'none'
    actor: 'writer'
    locator: '§3.3'
    text: 'Note that this app-extension provides no direct representation of the "Interface format" defined in Section 3.1.3 of [RFC9164], an address combined with an optional prefix length and an optional zone identifier, and therefore no way to reference a zone identifier at all.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0103"
    object: 'hash literal'
    field: 'no BCP 14 keyword; definitional. The VALUE is the hash OUTPUT, so a CDN consumer has to be able to compute the digest'
    verb: 'none'
    actor: 'parser'
    locator: '§3.4'
    text: 'The app-extension identifier "hash" is used to notate the input to a cryptographic hash function as well as to identify such a hash function. Its value is a byte string that represents the output of that hash function.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0104"
    object: 'hash literal input and algorithm selection'
    field: 'no BCP 14 keyword; definitional, and it binds CDN to the IANA COSE Algorithms registry'
    verb: 'none'
    actor: 'parser'
    locator: '§3.4'
    text: 'The input of the literal is a (text or byte) string, optionally followed by either an integer or a text string that identifies the hash function in the COSE Algorithms registry of the CBOR Object Signing and Encryption (COSE) registry group [IANA.cose], either by the identifier (value: integer or string), or, if no algorithm is registered with this value, by its name used in the registry.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0105"
    object: 'hash default algorithm'
    field: 'no BCP 14 keyword; definitional. NOTE: the string "SHA-256" is BROKEN BY HYPHENATION at a line break (source lines 1642-1643), so the quote carries "SHA- 256"'
    verb: 'none'
    actor: 'parser'
    locator: '§3.4'
    text: 'If the second item is not given, the default algorithm used is -16 ("SHA- 256").'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0106"
    object: 'uppercase variant of hash'
    field: 'no BCP 14 keyword; an explicit NON-definition'
    verb: 'none'
    actor: 'parser'
    locator: '§3.4'
    text: 'No uppercase variant prefix is defined for the app-extension identifier "hash".'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0107"
    object: 'b1 and t1'
    field: 'no BCP 14 keyword; definitional. NOTE: Section 3.5 opens with a cref marked for removal before publication saying t1 and b1 are PROVISIONAL names, still being decided by the WG'
    verb: 'none'
    actor: 'parser'
    locator: '§3.5'
    text: 'The "b1" and "t1" app-extensions allow a (byte or text) string to be built up from multiple (byte or text) string literals; these are then concatenated into a single string.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0108"
    object: 'mixing text and byte string arguments'
    field: 'no BCP 14 keyword; definitional - concatenation is at the BYTE level, so the argument types need not match'
    verb: 'none'
    actor: 'parser'
    locator: '§3.5'
    text: 'As the examples show, text strings and byte strings can mix within such a concatenation, so that, for instance, byte string literal notation can be used inside a sequence of concatenated text string notation literals, to encode characters that may be better represented in an encoded way.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0109"
    object: 'the joining operation'
    field: 'no BCP 14 keyword; definitional and fully determinate'
    verb: 'none'
    actor: 'parser'
    locator: '§3.5'
    text: 'This is realized by simply joining together the bytes in the sequence of string arguments to the b1/t1 app-extension, proceeding from left to right.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0110"
    object: 'result type of b1 and t1'
    field: 'no BCP 14 keyword; the force is ''needs to be valid UTF-8 except for'''
    verb: 'needs to'
    actor: 'parser'
    locator: '§3.5'
    text: 'For "b1", the joining operation results in a byte string. For "t1", the joining operation results in a text string, and the result therefore needs to be valid UTF-8 except for "diagnostic" implementations that support and are enabled for generation/ingestion of CDN for CBOR data items that are well-formed but not valid; see also Section 2.3.5.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0111"
    object: 'a single ellipsis as a t1/b1 argument'
    field: 'no BCP 14 keyword; the force is the lower-case ''must stand in for''. Quoted without its list marker'
    verb: 'must'
    actor: 'parser'
    locator: '§3.5'
    text: 'A single ... is a general ellipsis, which by itself can stand for any data item, but when used as argument to t1/b1 must stand in for a string value.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0112"
    object: 'adjacent ellipses'
    field: 'no BCP 14 keyword; a normalisation rule. Quoted without its list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§3.5'
    text: 'Multiple adjacent ellipses are equivalent to a single ellipsis.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0113"
    object: 'ellipsis concatenated with strings'
    field: 'no BCP 14 keyword; definitional - the result is a TAG, not a string. CPA888 is a placeholder for an unassigned code point. Quoted without its list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§3.5'
    text: 'When an ellipsis is concatenated (on one or both sides) with strings, the result is a CBOR tag number CPA888 that contains an array with joined together spans of such strings plus the ellipses represented by /CPA/888(null).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0114"
    object: 'nested ellipses'
    field: 'no BCP 14 keyword; a flattening rule. Quoted without its list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§3.5'
    text: 'Arguments with nested ellipses are flattened and the above equivalences applied, so that, for instance, these values are equivalent:'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0115"
    object: 'concatenation with no ellipsis'
    field: 'no BCP 14 keyword; closes the ellipsis case analysis. Quoted without its list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§3.5'
    text: 'If there is no ellipsis in the concatenated list, the result of processing the list will always be a single string data item.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0116"
    object: 'ilbs and ilts'
    field: 'no BCP 14 keyword; definitional. These REPLACE the deprecated streamstring syntax of Section 4.3'
    verb: 'none'
    actor: 'parser'
    locator: '§3.6'
    text: 'The ilbs and ilts app-extensions are semantically identical to t1 and b1 at the data model level, but instead of concatenating the arguments to a single (byte/text) string data item, they build an indefinite length string out of the arguments, with one chunk of the correct major type (byte string/text string for ilbs/ilts, respectively) created per argument.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0117"
    object: 'encoding indicators on ilbs/ilts arguments'
    field: 'no BCP 14 keyword; the force is ''would honor''. The one app-extension in this document that defines special handling of encoding variants, as Section 2.3.4 anticipates'
    verb: 'none'
    actor: 'implementation'
    locator: '§3.6'
    text: 'A diagnostic implementation would honor encoding indicators on each of the arguments, creating a chunk with the same encoding. As the app-extension is already implying indefinite length encoding, there is no point in applying an encoding indicator to the entire prefixed literal.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0118"
    object: 'ellipses inside an indefinite-length string'
    field: 'no BCP 14 keyword; an absolute EXCLUSION (''There is no way'')'
    verb: 'none'
    actor: 'writer'
    locator: '§3.6'
    text: 'There is no way to include ellipses in an indefinite length string.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0119"
    object: 'cri literal input'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§3.7'
    text: 'The input of the literal is a URI Reference as per [RFC3986] or an IRI Reference as per [RFC3987].'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0120"
    object: 'cri literal value'
    field: 'no BCP 14 keyword; definitional, and explicitly NOT a function - more than one CRI may convert to the same URI, and the choice is left to the implementation'
    verb: 'none'
    actor: 'parser'
    locator: '§3.7'
    text: 'The value of the literal is a CRI reference that can be converted to the text of the literal using the procedure of Section 6.1 of [I-D.ietf-core-href]. Note that there may be more than one CRI reference that can be converted to the URI/IRI reference given; implementations are expected to favor the simplest variant available and make non-surprising choices otherwise.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0121"
    object: 'CRI literal value'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§3.7'
    text: 'In the all-uppercase variant of the app-prefix, the value is enclosed in a tag number 99.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0122"
    object: 'float literal'
    field: 'no BCP 14 keyword; definitional. Its argument is read EXACTLY as a hex literal, so the h grammar governs it'
    verb: 'none'
    actor: 'parser'
    locator: '§3.8'
    text: 'The "float" app-extension enables the notation of 2-byte, 4-byte, and 8-byte byte strings to express floating point values (mt=7, ai=25/26/27 respectively) by giving their IEEE 754 representation. A text string used as an argument is interpreted exactly as a hex literal (like the h prefix); the result is used as the byte string.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0123"
    object: 'float literal interpretation and error case'
    field: 'no BCP 14 keyword; definitional, with a stated ERROR for any other length, and an explicit disclaimer that no encoding indicator is implied'
    verb: 'none'
    actor: 'parser'
    locator: '§3.8'
    text: 'The prefixed literal is interpreted as an encoded data item would be that prefixes the byte string by a single byte 0xF9 (2 bytes, i.e., binary16), 0xFA (4 bytes, i.e., binary32), and 0xFB (8 bytes, i.e., binary64), respectively. Byte strings of a different length than 2, 4, or 8 raise an error. Note that the interpretation as an encoded data item does not create or imply an encoding indicator; that can be added separately.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0124"
    object: 'purpose of the float app-extension'
    field: 'no BCP 14 keyword; states the GAP it closes - without it, CDN cannot write any NaN but the one called NaN'
    verb: 'none'
    actor: 'writer'
    locator: '§3.8'
    text: 'The purpose of this app-extension is to close a gap in CDN''s [IEEE754] binary64 support: Without this (or a similar) extension there is no way to represent NaN values different from the one called out at the end of Section 4.1 of RFC 8949 [STD94]'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0125"
    object: 'encoding indicators, optionality'
    field: 'no BCP 14 keyword; definitional. CDN describes the DATA MODEL by default; serialisation detail is opt-in'
    verb: 'none'
    actor: 'writer'
    locator: '§4'
    text: 'Encoding indicators are always optional: CDN is usually used to describe CBOR data items at the data model level.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0126"
    object: 'the term ''diagnostic implementation'''
    field: 'no BCP 14 keyword; definitional. It names the conformance class that the rest of Section 4 addresses'
    verb: 'none'
    actor: 'implementation'
    locator: '§4'
    text: 'Implementations of CDN generally do not need to provide this functionality in full; if they do, they can be called "diagnostic implementations".'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0127"
    object: 'accepting encoding indicators'
    field: 'the document''s only MUST on a consuming implementation. Note how weak it is: ''accept'' is defined in the same breath as ''process OR IGNORE'''
    verb: 'MUST'
    actor: 'implementation'
    locator: '§4'
    text: 'To be able to process CDN that contains encoding indicators, a CDN-consuming implementation MUST accept them (i.e., process or ignore the presence or absence of each encoding indicator).'
    kind: stated
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0128"
    object: 'unprocessed encoding indicators'
    field: 'recommendation attached to the MUST above'
    verb: 'RECOMMENDED'
    actor: 'implementation'
    locator: '§4'
    text: 'It is RECOMMENDED to provide a warning for each encoding indicator value that is encountered but not further processed.'
    kind: stated
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0129"
    object: 'encoding chosen where no indicator is present'
    field: 'no BCP 14 keyword; the force is ''is expected to generate''. This is the DEFAULT SERIALISATION rule and the one a test vector depends on'
    verb: 'none'
    actor: 'implementation'
    locator: '§4'
    text: 'Where no encoding indicator is placed, a diagnostic CBOR encoder is expected to generate Preferred Serialization (Section 4.1 of RFC 8949 [STD94]) with definite-length encoding only.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0130"
    object: 'indicators emitted by a decoder in a basic configuration'
    field: 'no BCP 14 keyword; the force is ''is expected to provide''. The inverse of the rule above, and together they make CDN output comparable'
    verb: 'none'
    actor: 'implementation'
    locator: '§4'
    text: 'Similarly, when using CDN as output for a diagnostic CBOR decoder, a basic diagnostic configuration of the tool is expected to provide encoding indicators only in places where the CBOR input did not use Preferred Serialization with definite-length encoding (see also Section 1.3.3).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0131"
    object: 'documenting diagnostic behaviour'
    field: 'no BCP 14 keyword; the force is ''are expected to document'''
    verb: 'none'
    actor: 'implementation'
    locator: '§4'
    text: 'Diagnostic implementations of CDN that process encoding indicators as discussed here are expected to document their diagnostic behavior and the processing options that can be selected.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0132"
    object: 'encoding indicator lexis'
    field: 'no BCP 14 keyword; definitional and maximal-munch - it decides where an indicator ends'
    verb: 'none'
    actor: 'parser'
    locator: '§4.1'
    text: 'Encoding indicators start with an underscore and comprise all immediately following characters that are alphanumeric or underscore.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0133"
    object: 'encoding indicator placement'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'writer'
    locator: '§4.1'
    text: 'Encoding indicators are placed immediately to the right of the data item or of a syntactic feature that can stand for the data item the encoding of which the encoding indicator is controlling.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0134"
    object: '_n for a decimal digit n'
    field: 'no BCP 14 keyword; definitional - the arithmetic that maps notation to the CBOR additional-information field'
    verb: 'none'
    actor: 'parser'
    locator: '§4.1'
    text: 'An underscore followed by a decimal digit n indicates that the item was or is to be encoded with an additional information value of ai=24+n.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0135"
    object: 'an encoding indicator too small for the data item'
    field: 'no BCP 14 keyword; a stated ERROR, with an explicit refusal of the lenient alternative. Decisive for test vectors: an indicator never changes the value'
    verb: 'is an error'
    actor: 'tool'
    locator: '§4.1'
    text: 'For a tool consuming CDN in a diagnostic mode, encountering an encoding indicator that does not provide enough space to correctly encode the unchanged data item given is an error; there is no truncation or rounding that would change the data item encoded.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0136"
    object: 'truncation and rounding'
    field: 'no BCP 14 keyword; an explicit SCOPE EXCLUSION with the escape hatch named. Quoted from an aside block'
    verb: 'none'
    actor: 'tool'
    locator: '§4.1'
    text: 'Truncation or rounding semantics imply performing changes at the data model level, which is outside the scope of encoding indicators. Such operations can be provided by app-extensions.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0137"
    object: 'the bare underscore indicator'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§4.1'
    text: 'The encoding indicator _ (an underscore on its own) is used to indicate indefinite-length encoding.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0138"
    object: 'the reserved indicators _4 _5 _6 _7'
    field: 'no BCP 14 keyword; a RESERVATION with its reason. _7 would duplicate _, and _4.._6 name ai values CBOR does not use'
    verb: 'reserved'
    actor: 'parser'
    locator: '§4.1'
    text: 'Indefinite-length encoding uses ai=31, which could have been indicated by _7, which is therefore not used and marked as reserved (as are _4, _5, and _6, which would stand for ai=28 to ai=30, values currently not in use in CBOR; these encoding indicators will be available if and when CBOR is extended to make use of them).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0139"
    object: 'where the bare underscore may appear'
    field: 'no BCP 14 keyword; a POSITIONAL RESTRICTION. The two forms '''' _ and "" _ are the only string exceptions'
    verb: 'only available'
    actor: 'parser'
    locator: '§4.1'
    text: 'Note that the encoding indicator _ is only available behind the opening brace/bracket for map and array (Section 4.2): strings originally had a now deprecated special syntax streamstring for indefinite-length encoding except for the special cases'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0140"
    object: 'the indicators _0 to _3'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§4.1'
    text: 'The encoding indicators _0 to _3 indicate ai=24 to ai=27, respectively; they therefore stand for 1, 2, 4, and 8 bytes of additional information (ai) following the initial byte in the head of the data item.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0141"
    object: 'the indicator _i'
    field: 'no BCP 14 keyword; definitional. _i is the ONE encoding indicator this document adds that RFC 8949 Section 8.1 did not have'
    verb: 'none'
    actor: 'parser'
    locator: '§4.1'
    text: '_i ("immediate") stands for encoding with ai=0 to ai=23, i.e., it indicates that the argument is encoded directly in the initial byte of the CBOR item.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0142"
    object: 'encoding indicators as an extension point'
    field: 'no BCP 14 keyword; definitional - the second of the document''s two registries'
    verb: 'none'
    actor: 'implementation'
    locator: '§4.1'
    text: 'Encoding indicators are an extension point for CDN; Section 7.2 defines a registry for additional values.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0143"
    object: 'indefinite-length indicator on an array or map'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§4.2'
    text: 'A single underscore can be written after the opening brace of a map or the opening bracket of an array to indicate that the data item was represented in indefinite-length format.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0144"
    object: 'definite-length head size on an array or map'
    field: 'no BCP 14 keyword; definitional - the same position takes either kind of indicator'
    verb: 'none'
    actor: 'parser'
    locator: '§4.2'
    text: 'At the same position, encoding indicators for specifying the size of the array or map head for definite-length format can be used instead, specifically _i or _0 to _3.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0145"
    object: 'the streamstring syntax'
    field: 'no BCP 14 keyword; definitional, for a syntax this document DEPRECATES but still defines'
    verb: 'none'
    actor: 'parser'
    locator: '§4.3'
    text: 'This syntax represents the individual chunks in sequence within parentheses, each optionally followed by a comma, with an encoding indicator _ immediately after the opening parenthesis:'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0146"
    object: 'chunk types within a streamstring'
    field: 'no BCP 14 keyword; the force is ''all need to be of the same type''. It is also the SEMANTIC side condition the ABNF cannot express, and the grammar says so in a comment'
    verb: 'need to'
    actor: 'parser'
    locator: '§4.3'
    text: 'The overall type (byte string or text string) of the string is provided by the types of the individual chunks, which all need to be of the same type (Section 3.2.3 of RFC 8949 [STD94]).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0147"
    object: 'an empty streamstring'
    field: 'no BCP 14 keyword; an AMBIGUITY resolved by exclusion, plus the two reserved substitutes and an explicit statement of what they do NOT mean'
    verb: 'is therefore not used'
    actor: 'parser'
    locator: '§4.3'
    text: 'In this syntax, an indefinite-length string with no chunks inside, (_ ) would be ambiguous as to whether a byte string (encoded 5f ff) or a text string (encoded 7f ff) is meant and is therefore not used.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0148"
    object: 'deprecation of streamstring'
    field: 'no BCP 14 keyword; the force is ''is now deprecated'' plus a lower-case ''should''. A migration instruction for anything written in the older notation'
    verb: 'should'
    actor: 'writer'
    locator: '§4.3'
    text: 'With this document, the streamstring syntax is now deprecated; new CDN documents should instead use the ilbs/ilts app-extensions (Section 3.6) to build indefinite-length encoded strings.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0149"
    object: 'the two cases needing a tag-based representation'
    field: 'no BCP 14 keyword; definitional - it scopes Sections 5.1 and 5.2'
    verb: 'none'
    actor: 'implementation'
    locator: '§5'
    text: 'In some cases, a CDN consumer cannot construct actual CBOR items that represent the CBOR data intended for eventual interchange. This document defines a CBOR tags-based representation for two such cases:'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0150"
    object: 'downstream failure on the tags defined here'
    field: 'no BCP 14 keyword; an IMPLEMENTATION NOTE, but it is the document''s own warning that these tags are not safe to emit by default. Quoted from an aside block'
    verb: 'none'
    actor: 'tool'
    locator: '§5'
    text: 'Implementation note: Typically, the ultimate applications will fail if they encounter tags unknown to them, which the ones defined in this section likely are.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0151"
    object: 'an unknown or unimplemented app-extension'
    field: 'no BCP 14 keyword; the force is ''is usually an error and processing has to stop''. THIS is what makes an unregistered prefix such as b32 fail, even though the grammar admits it lexically'
    verb: 'has to stop'
    actor: 'parser'
    locator: '§5.1'
    text: 'During ingestion of CDN, prefixed literals are usually decoded and transformed into the corresponding data item. If an app-extension is not known or not implemented by the ingesting process, this is usually an error and processing has to stop.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0152"
    object: 'the Unresolved App-Extension Tag'
    field: 'no BCP 14 keyword; definitional. CPA999 is a placeholder for an unassigned code point'
    verb: 'none'
    actor: 'parser'
    locator: '§5.1'
    text: 'This specification defines a CBOR Tag for this purpose: The Diagnostic Notation Unresolved App-Extension Tag, tag number CPA999 (Section 7.5). The content of this tag is an array of a text string for the app-extension prefix, and another array:'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0153"
    object: 'CPA999 content for an app-string'
    field: 'no BCP 14 keyword; definitional. Quoted without its list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§5.1'
    text: 'For app-strings, the second array contains a single item, a text string containing the text notated by the single-quoted string in the app-string.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0154"
    object: 'CPA999 content for an app-sequence'
    field: 'no BCP 14 keyword; definitional. NOTE: ''app-sequence'' is broken by hyphenation at a line break (source lines 2174-2175). Quoted without its list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§5.1'
    text: 'For app-sequences, the second array contains zero or more items, which represent each item in the sequence contained in the app- sequence.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0155"
    object: 'a stage not prepared to handle CPA999'
    field: 'no BCP 14 keyword; the force is ''this is an error and processing has to stop''. Unconditional, unlike the ''usually'' of the entry above. The sentence CANNOT BE QUOTED WHOLE: it is broken by hyphenation at a line break twice, at ''App-'' / ''Extension'' (source lines 2189-2190) and at ''app-'' / ''extension'' (2191-2192). Quoted here is the half carrying the obligation; the opening half reads ''If a stage of ingestion is not prepared to handle the Unresolved App-'''
    verb: 'has to stop'
    actor: 'parser'
    locator: '§5.1'
    text: 'Extension Tag, this is an error and processing has to stop,'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0156"
    object: 'the ellipsis'
    field: 'no BCP 14 keyword; definitional. THREE OR MORE dots, and the elided material is irrecoverable by construction'
    verb: 'none'
    actor: 'writer'
    locator: '§5.2'
    text: 'To facilitate this, this specification supports the use of an _ellipsis_ (notated as three or more dots in a row, as in ...) to indicate parts of a CDN document that have been elided (and therefore cannot be reconstructed).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0157"
    object: 'ingesting an ellipsis'
    field: 'no BCP 14 keyword; the force is ''usually is an error and processing has to stop'''
    verb: 'has to stop'
    actor: 'parser'
    locator: '§5.2'
    text: 'Upon ingesting CDN as a representation of a CBOR data item for further processing, the occurrence of an ellipsis usually is an error and processing has to stop.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0158"
    object: 'the Ellipsis Tag'
    field: 'no BCP 14 keyword; definitional, with a two-case numbered content list. CPA888 is a placeholder for an unassigned code point'
    verb: 'none'
    actor: 'parser'
    locator: '§5.2'
    text: 'The Diagnostic Notation Ellipsis Tag, tag number CPA888 (Section 7.5). The content of this tag is one of:'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0159"
    object: 'CPA888 content, case 1'
    field: 'no BCP 14 keyword; definitional. Quoted without its ''1.'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§5.2'
    text: 'null (indicating a data item entirely replaced by an ellipsis);'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0160"
    object: 'CPA888 content, case 2'
    field: 'no BCP 14 keyword; definitional. Quoted without its ''2.'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§5.2'
    text: 'an array, the elements of which are alternating between parts of a string and the actual elisions, represented as ellipses carrying a null as content.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0161"
    object: 'an ellipsis standing for several elements'
    field: 'no BCP 14 keyword; definitional, and it hands finer control to CDDL rather than to CDN'
    verb: 'none'
    actor: 'writer'
    locator: '§5.2'
    text: 'A single ellipsis (or key/value pair of ellipses) can imply eliding multiple elements in an array (members in a map). If more detailed control is required, a data definition language such as CDDL can be employed.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0162"
    object: 'multiple elided map members in the tag-based form'
    field: 'no BCP 14 keyword; an EXCLUSION, with its reason: the resulting CBOR map would have duplicate keys'
    verb: 'does not allow'
    actor: 'parser'
    locator: '§5.2'
    text: '(Note that the tag-based representation form defined here does not allow multiple key/value pairs with an ellipsis as a key: the CBOR data item would not be valid.)'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0163"
    object: 'string elisions in the tag-based form'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§5.2'
    text: 'String elisions can be represented in a CBOR data item by a tag CPA888 that wraps an array containing string parts alternating with ellipsis indicators:'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0164"
    object: 'elision versus commenting out'
    field: 'no BCP 14 keyword; a stated CONSEQUENCE that distinguishes two things a writer might think equivalent. It matters for any validator fed a partially specified vector'
    verb: 'none'
    actor: 'writer'
    locator: '§5.2'
    text: 'The consumer of this CDN will ignore the comments and therefore will have no idea after ingestion that some information has been elided; validation steps may then simply fail instead of being informed about the elisions.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0165"
    object: 'the ABNF dialect used'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§6'
    text: 'This section collects grammars in ABNF form ([STD68] as extended in [RFC7405]) that serve to define the syntax of CDN and some prefixed literals.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0166"
    object: 'PEG interpretation of the grammars'
    field: 'no BCP 14 keyword; an IMPLEMENTATION NOTE, but it is decisive: ordered choice, not ambiguous alternation, is what makes several rules in Figure 1 work. Quoted from an aside block'
    verb: 'none'
    actor: 'parser'
    locator: '§6'
    text: 'Implementation note: The ABNF definitions in this section are intended to be useful in a Parsing Expression Grammar (PEG) parser interpretation (see Appendix A of [RFC8610] for an introduction into PEG).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0167"
    object: 'scope of the overall grammar'
    field: 'no BCP 14 keyword; definitional, and it states the LAYERING: Figure 1 parses CDN source and knows nothing of what a prefix means. Quoted from an aside block'
    verb: 'none'
    actor: 'parser'
    locator: '§6.1'
    text: 'This ABNF definition treats all single-quoted string literals the same, whether they are unprefixed and constitute byte string literals, or prefixed and their content subject to further processing.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0168"
    object: 'naming convention for app-string grammars'
    field: 'no BCP 14 keyword; a stated CONVENTION that a registration is expected to follow. Quoted from an aside block'
    verb: 'as a convention'
    actor: 'writer'
    locator: '§6.1'
    text: 'as a convention, the grammar for the content of an app-string with prefix, say, p, is described by an ABNF definition with the rule name app-string-p.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0169"
    object: 'the grammar and the CBOR data model'
    field: 'no BCP 14 keyword; an explicit admission that the grammar UNDER-DETERMINES the mapping. It is why items 1-7 follow'
    verb: 'none'
    actor: 'parser'
    locator: '§6.1'
    text: 'While an ABNF grammar defines the set of character strings that are considered to be valid CDN by this ABNF, the mapping of these character strings into the generic data model of CBOR is not always obvious.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0170"
    object: 'ABNF terminal values, item 1'
    field: 'no BCP 14 keyword; numbered interpretation item 1. Quoted without its ''1.'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§6.1'
    text: 'As mentioned in the terminology (Section 1.2), the ABNF terminal values in this document define Unicode scalar values (characters) rather than their UTF-8 encoding.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0171"
    object: 'decnumber, item 3'
    field: 'no BCP 14 keyword; numbered interpretation item 3, including an explicit warning that the grammar admits ''3.'' and ''.3'' which some platform parsers reject. Quoted without its ''3.'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§6.1'
    text: 'decnumber stands for an integer in the usual decimal notation, unless at least one of the optional parts starting with "." and "e" are present, in which case it stands for a floating point value in the usual decimal notation. Note that the grammar allows 3. for 3.0 and .3 for 0.3 (also for hexadecimal floating point below); implementers are advised that some platform numeric parsers accept only a subset of the floating point syntax in this document and may require some preprocessing to use here.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0172"
    object: 'hexint, octint, binint, hexfloat, item 4'
    field: 'no BCP 14 keyword; numbered interpretation item 4. Quoted without its ''4.'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§6.1'
    text: 'hexint, octint, and binint stand for an integer in the usual base 16/hexadecimal ("0x"), base 8/octal ("0o"), or base 2/binary ("0b") notation.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0173"
    object: 'integer literal to CBOR, item 5'
    field: 'no BCP 14 keyword; numbered interpretation item 5. It also states the GAP: for the bignum case no encoding indicator applies. Quoted without its ''5.'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§6.1'
    text: 'For hexint, octint, binint, and when decnumber stands for an integer, the corresponding CBOR data item is represented using major type 0 or 1 if possible, or using tag 2 or 3 if not. In the latter case, this specification does not define any encoding indicators that apply.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0174"
    object: 'floating-point literal to CBOR, item 5'
    field: 'no BCP 14 keyword; numbered interpretation item 5 continued. Note the three constraints: only _1/_2/_3 are admissible, precision is adjusted to binary64 FIRST, and tag 4/5 is never generated'
    verb: 'needs to'
    actor: 'parser'
    locator: '§6.1'
    text: 'When decnumber stands for a floating point value, and for hexfloat and nonfin, a floating point data item with major type 7 is used; diagnostic implementations employ Preferred Serialization unless the item was modified by an encoding indicator, which then needs to be _1, _2, or _3.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0175"
    object: 'precision adjustment and tag 4/5'
    field: 'no BCP 14 keyword; the remainder of item 5. A test-vector trap: a decimal literal is rounded to binary64 BEFORE Preferred Serialization chooses a width'
    verb: 'none'
    actor: 'parser'
    locator: '§6.1'
    text: 'For this, the number range needs to fit into an [IEEE754] binary64 (or the size corresponding to the encoding indicator), and the precision will be adjusted to binary64 before further applying Preferred Serialization (or to the size corresponding to the encoding indicator). Tag 4/5 representations are not generated in these cases.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0176"
    object: 'the raw-string rules, item 7'
    field: 'no BCP 14 keyword; the force is ''a parser needs to implement the ABNF comments''. This is the document''s own statement that the grammar is NOT self-contained. Quoted without its ''7.'' list marker'
    verb: 'needs to'
    actor: 'parser'
    locator: '§6.1'
    text: 'The ABNF grammar for raw strings is lenient; a parser needs to implement the ABNF comments on alikerawdelim and shortrawdelim as well. shortrawdelim only matches sequences of backquotes that are shorter than startrawdelim. alikerawdelim only matches sequences of backquotes that are exactly as long as startrawdelim.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0177"
    object: 'what the app-extension grammars describe'
    field: 'no BCP 14 keyword; definitional, and easy to get wrong: these grammars run on the DECODED string, after escape processing, not on the source text'
    verb: 'none'
    actor: 'parser'
    locator: '§6.2'
    text: 'These grammars describe the _decoded_ content of the single-quoted or raw string components that combine with prefixes to form prefixed literals.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0178"
    object: 'rules shared with Figure 1'
    field: 'no BCP 14 keyword; definitional - a per-extension grammar is NOT self-contained'
    verb: 'none'
    actor: 'parser'
    locator: '§6.2'
    text: 'Each of these may integrate ABNF rules defined in Figure 1, which are not always repeated here.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0179"
    object: 'the common rules of Figure 2'
    field: 'no BCP 14 keyword; definitional - it states the second dependency every Section 6.2 grammar carries'
    verb: 'none'
    actor: 'parser'
    locator: '§6.2'
    text: 'For convenience, the common definitions in Figure 2 are not repeated in the below ABNF grammars.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0180"
    object: 'platform implementations of the referenced grammars'
    field: 'no BCP 14 keyword; an explicit permission to use a library rather than the printed grammar'
    verb: 'none'
    actor: 'implementation'
    locator: '§6.2'
    text: 'Note that implementation platforms may already provide implementations of grammars used in app-extensions, such as of RFC 3339 for dt'''' and of IP address syntax for ip''''. CDN-based tools may want to use these implementation libraries instead of using the grammars that are provided here as a reference.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0181"
    object: 'the h content grammar'
    field: 'no BCP 14 keyword; definitional - it is what makes blank space and comments legal between hex digits'
    verb: 'none'
    actor: 'parser'
    locator: '§6.2.1'
    text: 'This syntax accommodates both lowercase and uppercase hex digits, as well as blank space (including comments) around each hex digit.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0182"
    object: 'the b64 content grammar'
    field: 'no BCP 14 keyword; definitional. Both RFC 4648 alphabets, padding tolerated but not required'
    verb: 'none'
    actor: 'parser'
    locator: '§6.2.2'
    text: 'This syntax allows both the classic (Section 4 of [RFC4648]) and the URL-safe (Section 5 of [RFC4648]) alphabet to be used. It accommodates, but does not require base64 padding.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0183"
    object: 'slash-based comments in b64'
    field: 'no BCP 14 keyword; restates the exclusion of Section 3.1 as a property of the grammar'
    verb: 'impossible'
    actor: 'parser'
    locator: '§6.2.2'
    text: 'Note that inclusion of classic base64 makes it impossible to have comments based on slash characters in b64, as "/" is valid base64-classic.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0184"
    object: 'the dt content grammar'
    field: 'no BCP 14 keyword; definitional, and it names the provenance of Figure 5'
    verb: 'none'
    actor: 'parser'
    locator: '§6.2.3'
    text: 'The syntax of the content of dt literals can be described by the ABNF for date-time in Figure 5. This is derived from [RFC3339] as summarized in Section 3 of [RFC9165].'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0185"
    object: 'the ip content grammar'
    field: 'no BCP 14 keyword; definitional. The RFC 3986 rules are REARRANGED for PEG compatibility, which is a real difference from the originals'
    verb: 'none'
    actor: 'parser'
    locator: '§6.2.4'
    text: 'The syntax of the content of ip literals can be described by the ABNF for IPv4address and IPv6address in Section 3.2.2 of [RFC3986], as included in slightly updated form in Figure 6.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0186"
    object: 'the cri content grammar'
    field: 'no BCP 14 keyword; definitional, with a mandatory PRE-STEP for non-ASCII input'
    verb: 'first apply'
    actor: 'parser'
    locator: '§6.2.5'
    text: 'In case such a URI parser is not available or inconvenient to integrate, a grammar of the content of cri literals is provided by the ABNF for URI-reference in Section 4.1 of RFC 3986 [RFC3986] with certain re-arrangements taken from Section 6.2.4; these are reproduced in Figure 7. If the content is not ASCII only (i.e., for IRIs), first apply Section 3.1 of [RFC3987] and apply this grammar to the result.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0187"
    object: 'integrated extension parsers'
    field: 'no BCP 14 keyword; definitional - an OPTIMISATION, not a requirement'
    verb: 'none'
    actor: 'implementation'
    locator: '§6.3'
    text: 'For some applications of CDN, it is an optimization to integrate parsers for the content of some prefixed string literals into the main parser, handling both the string literal syntax (e.g., escapes such as \'' and \\) and the syntax of the extension content in one go.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0188"
    object: 'when a Section 6.2 grammar can be reused directly'
    field: 'no BCP 14 keyword; definitional - it states the exact character-repertoire condition under which a Section 6.2 grammar needs no rewriting'
    verb: 'none'
    actor: 'implementation'
    locator: '§6.3'
    text: 'For app-extensions that only use printable ASCII characters (from U+0020 to U+007E) minus single-quote '' and backslash \, the ABNF such as that given in Section 6.2 can be directly used as an integrated parser, after adding some glue ABNF.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0189"
    object: 'ABNF obligations on a new app-extension'
    field: 'no BCP 14 keyword; an explicit NON-obligation, stated emphatically. A registration need supply no grammar at all'
    verb: 'no expectation'
    actor: 'writer'
    locator: '§6.3'
    text: 'There is no expectation for a new app-extension to supply ABNF for an integrated parser (or any ABNF at all!), in particular if the parsing function is likely to be fulfilled by a platform library.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0190"
    object: 'the App-Extension Identifiers registry'
    field: 'no BCP 14 keyword; an IANA instruction. Expert review, not first-come-first-served: a new byte-string prefix needs an expert to agree. NOTE: the registry-group reference is BROKEN BY HYPHENATION at a line break (source lines 3265-3266), rendered here as ''[IANA.concise- diagnostic-notation]'''
    verb: 'none'
    actor: 'implementation'
    locator: '§7.1'
    text: 'IANA is requested to create an "App-Extension Identifiers" registry in a new "Concise Diagnostic Notation" registry group [IANA.concise- diagnostic-notation], with the policy "expert review" (Section 4.5 of RFC 8126 [BCP26]).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0191"
    object: 'guidance to the designated experts'
    field: 'no BCP 14 keyword; the force is ''The experts are instructed''. Short, generic identifiers are to be husbanded. NOTE: ''app-extension'' is broken by hyphenation at a line break (source lines 3269-3270)'
    verb: 'are instructed'
    actor: 'implementation'
    locator: '§7.1'
    text: 'The experts are instructed to be frugal in the allocation of app- extension identifiers that are suggestive of generally applicable semantics, keeping them in reserve for app-extensions that are likely to enjoy wide use and can make good use of their conciseness.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0192"
    object: 'specification requirement for a registration'
    field: 'no BCP 14 keyword; the force is ''are also instructed to direct'', with a stated exception'
    verb: 'are instructed'
    actor: 'implementation'
    locator: '§7.1'
    text: 'The experts are also instructed to direct the registrant to provide a specification (Section 4.6 of RFC 8126 [BCP26]), but can make exceptions, for instance when a specification is not available at the time of registration but is likely forthcoming.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0193"
    object: 'registry entry fields'
    field: 'no BCP 14 keyword; the force is the lower-case ''must include'''
    verb: 'must'
    actor: 'implementation'
    locator: '§7.1'
    text: 'Each entry in the registry must include:'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0194"
    object: 'the App-Extension Identifier field'
    field: 'no BCP 14 keyword; definitional, and it states the UNIQUENESS constraint that locks b32 and h32 out of reuse'
    verb: 'cannot'
    actor: 'implementation'
    locator: '§7.1'
    text: 'a lowercase ASCII [STD80] string that starts with a letter and can contain letters, digits, and hyphens after that ([a-z][a-z0-9-]*). No other entry in the registry can have the same app-extension identifier.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0195"
    object: 'initial registry content'
    field: 'no BCP 14 keyword; definitional. Table 8 is where b32 and h32 appear, as Reserved'
    verb: 'none'
    actor: 'implementation'
    locator: '§7.1'
    text: 'The initial content of the registry is shown in Table 8; all initial entries have the Change Controller "IETF".'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0196"
    object: 'the Encoding Indicators registry'
    field: 'no BCP 14 keyword; an IANA instruction. Note the DIFFERENT policy from Section 7.1: specification required, not expert review'
    verb: 'none'
    actor: 'implementation'
    locator: '§7.2'
    text: 'IANA is requested to create an "Encoding Indicators" registry in the newly created "Concise Diagnostic Notation" registry group [IANA.concise-diagnostic-notation], with the policy "specification required" (Section 4.6 of RFC 8126 [BCP26]).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0197"
    object: 'the Encoding Indicator field'
    field: 'no BCP 14 keyword; definitional and lexical, with a uniqueness constraint'
    verb: 'cannot'
    actor: 'implementation'
    locator: '§7.2'
    text: 'an ASCII [STD80] string that starts with an underscore letter and can contain zero or more underscores, letters and digits after that (_[_A-Za-z0-9]*). No other entry in the registry can have the same Encoding Indicator.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0198"
    object: 'provenance of the initial encoding indicators'
    field: 'no BCP 14 keyword; definitional - all but _i are already in RFC 8949 Section 8.1. Quoted from an aside block'
    verb: 'none'
    actor: 'implementation'
    locator: '§7.2'
    text: 'As the "Reference" column reflects, all the encoding indicators initially registered are already defined in Section 8.1 of RFC 8949 [STD94], with the exception of _i, which is defined in Section 6.1 of the present document.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0199"
    object: 'the application/cdn media type'
    field: 'no BCP 14 keyword; an IANA registration. Encoding considerations are ''binary (UTF-8)'''
    verb: 'none'
    actor: 'implementation'
    locator: '§7.3'
    text: 'IANA is requested to add the following Media-Type to the "Media Types" registry [IANA.media-types].'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0200"
    object: 'restrictions on use of application/cdn'
    field: 'no BCP 14 keyword; a stated SCOPE for the media type. It says plainly that CDN is not the interchange format'
    verb: 'none'
    actor: 'implementation'
    locator: '§7.3'
    text: 'Restrictions on usage: Concise diagnostic notation represents CBOR data items, which are the format intended for actual interchange. The media type application/cdn is intended to be used within documents about CBOR data items, in diagnostics for human consumption, and in other representations of CBOR data items that are necessarily text-based such as in configuration files or other data edited by humans, often under source-code control.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0201"
    object: 'fragment identifiers for application/cdn'
    field: 'no BCP 14 keyword; definitional by deferral, and the deferral target is itself empty'
    verb: 'none'
    actor: 'implementation'
    locator: '§7.3'
    text: 'Fragment identifier considerations: The syntax and semantics of fragment identifiers is as specified for "application/cbor". (At publication of RFC XXXX, there is no fragment identification syntax defined for "application/cbor".)'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0202"
    object: 'the CoAP Content-Format for application/cdn'
    field: 'no BCP 14 keyword; an IANA registration with an unassigned value'
    verb: 'none'
    actor: 'implementation'
    locator: '§7.4'
    text: 'TBD1 is to be assigned from the space 256..9999, according to the procedure "IETF Review or IESG Approval", preferably a number less than 1000.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0203"
    object: 'the two CBOR tags'
    field: 'no BCP 14 keyword; an IANA request. The numbers 888 and 999 are SUGGESTIONS, not assignments'
    verb: 'none'
    actor: 'implementation'
    locator: '§7.5'
    text: 'In the "CBOR Tags" registry [IANA.cbor-tags], IANA is requested to assign the tags in Table 12 from the "specification required" space (suggested assignments: 888 and 999), with the present document as the specification reference.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0204"
    object: 'inherited security considerations'
    field: 'no BCP 14 keyword; a stated INHERITANCE from STD 94 and RFC 8610'
    verb: 'none'
    actor: 'implementation'
    locator: '§8'
    text: 'The security considerations of [STD94] apply, including by applying the considerations about the CBOR format to the CDN format in an analogous sense. Security considerations documented in [RFC8610] for the CDDL language often are also applicable to the CDN language in an analogous sense.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0205"
    object: 'security considerations of extensions'
    field: 'no BCP 14 keyword; the force is ''need to be considered''. Each extension carries its own risk, and CDN itself cannot bound it. NOTE: ''app-extension'' is BROKEN BY HYPHENATION at a line break (source lines 3597-3598)'
    verb: 'need to be'
    actor: 'writer'
    locator: '§8'
    text: 'The CDN specification defines two explicit extension points: app- extension identifiers (Section 7.1) and encoding indicators (Section 7.2). Extensions introduced through these can have their own security considerations, which need to be considered in the specification for the extension (see, e.g., Section 5 of [I-D.ietf-cbor-edn-e-ref]).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0206"
    object: 'attacker-invoked extensions'
    field: 'no BCP 14 keyword; the force is ''need to avoid''. The threat is that CDN input selects which code runs'
    verb: 'need to avoid'
    actor: 'implementation'
    locator: '§8'
    text: 'Implementers of tools that support the use of CDN extensions need to avoid inadvertently introducing a vector that allows attackers to invoke extensions not planned for by the tool operator, who might not have considered security considerations of specific extensions such as those posed by their use of dereferenceable identifiers'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0207"
    object: 'allowlisting extensions'
    field: 'no BCP 14 keyword; the force is the weak ''might require''. The document suggests, it does not oblige'
    verb: 'might'
    actor: 'tool'
    locator: '§8'
    text: 'Tools might require explicitly enabling the use of each extension that is not on an allowlist.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0208"
    object: 'out-of-band configuration for app-extensions'
    field: 'no BCP 14 keyword; the force is ''need to be configured out of band''. It is the closest thing in the document to a secure default, and it names the one permissible exception. The em dashes are the source''s own'
    verb: 'need to be'
    actor: 'tool'
    locator: '§8'
    text: 'Tools that process app-extensions — directly from their use in CDN or later via Tag CPA999 (Section 5.1) — need to be configured out of band to enable processing each specific app-extension only if that is desired. An allowlist built out of the mandatory-to-implement application extensions may be an exception.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0209"
    object: 'validators and partially specified inputs'
    field: 'no BCP 14 keyword; the force is ''need to require explicit configuration''. Directly relevant to validating a vector that carries an ellipsis'
    verb: 'need to'
    actor: 'tool'
    locator: '§8'
    text: 'Similarly, inputs to validators may be prepared with partially specified subtrees by representing ellipses via Tag CPA888 (Section 5.2). Validators that want to accept such partially specified CBOR data items need to require explicit configuration to do so.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0210"
    object: 'status of Appendix A'
    field: 'no BCP 14 keyword; the appendix''s own statement that it is NOT normative. Recorded so a later reader does not cite it as such'
    verb: 'none'
    actor: 'writer'
    locator: 'App-A'
    text: 'This appendix is for information.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0211"
    object: 'CDN and CDDL are different languages'
    field: 'no BCP 14 keyword; definitional, and it is the sentence that bears on using CDN for vectors validated by CDDL: they are an instance language and a schema language, with separate syntaxes'
    verb: 'none'
    actor: 'writer'
    locator: 'App-A'
    text: 'CDN was designed as a language to provide a human-readable representation of an instance, i.e., a single CBOR data item or CBOR sequence. CDDL was designed as a language to describe an (often large) set of such instances (which itself constitutes a language), in the form of a _data definition_ or _grammar_ (or sometimes called _schema_).'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0212"
    object: 'mixing CDN and CDDL syntax'
    field: 'no BCP 14 keyword; a stated HAZARD with a stated mitigation. Quoted without its list marker'
    verb: 'none'
    actor: 'writer'
    locator: 'App-A'
    text: 'For engineers that are using both CDN and CDDL, it is easy to write "CDDLisms" or "CDNisms" into their drafts that are meant to be in the other language. (This is one more of the many motivations to always validate formal language instances with tools.)'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0213"
    object: 'comment syntax, CDN versus CDDL'
    field: 'no BCP 14 keyword; an enumerated DIFFERENCE. Quoted without its list marker'
    verb: 'none'
    actor: 'writer'
    locator: 'App-A'
    text: 'Comment syntax. CDDL inherits ABNF''s semicolon-delimited end of line characters, while CDN finds nothing in JSON that could be inherited here.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0214"
    object: 'tag syntax, CDN versus CDDL'
    field: 'no BCP 14 keyword; an enumerated DIFFERENCE'
    verb: 'none'
    actor: 'writer'
    locator: 'App-A'
    text: 'Syntax for tags. CDDL''s tag syntax is part of the system for referring to CBOR''s fundamentals (the major type 6, in this case) and (with [RFC9682]) allows specifying the actual tag number separately, while CDN''s tag syntax is a simple decimal number and a pair of parentheses.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0215"
    object: 'embedded CBOR, CDN versus CDDL'
    field: 'no BCP 14 keyword; an enumerated DIFFERENCE. The CDN << >> literal and the CDDL .cbor control operator do the same job and look nothing alike'
    verb: 'none'
    actor: 'writer'
    locator: 'App-A'
    text: 'Embedded CBOR. CDN has a special syntax to describe the content of byte strings that are encoded CBOR data items. CDDL can specify these with a control operator, which looks very different.'
    kind: inferred
    testable: yes
    status: active
