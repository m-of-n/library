    verb: 'none'
    actor: 'writer'
    locator: '§2.3'
    text: '(UTF-8) text strings can be directly represented (unprefixed) in CDN either as double-quoted (Section 2.3.1) or as raw strings (Section 2.3.3), while byte strings can be represented as single- quoted strings (Section 2.3.2).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0038"
    object: 'RFC 8610 Appendix G.4 string juxtaposition'
    field: 'no BCP 14 keyword; a REMOVAL. Any vector written in RFC 8610 EDN that concatenates strings by juxtaposition is no longer CDN'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3'
    text: 'Before prefixed literals were turned into a general extension point for diagnostic notation, Appendix G.4 of [RFC8610] added a syntax for concatenating strings by just juxtaposing them. This syntax was not widely implemented and is problematic in the presence of optional commas; it is now entirely removed from CDN and replaced by app-extensions such as Section 3.5.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0039"
    object: 'escaping in a double-quoted string literal'
    field: 'no BCP 14 keyword; definitional, and states the SINGLE divergence from JSON'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.1'
    text: 'This also applies to CDN, and all escaping rules apply as in JSON, with a single exception: In CDN, string literals additionally can contain newlines (LINEFEED U+000A), which are copied into the resulting string like other characters in the string literal.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0040"
    object: 'the \u{NNN} escape'
    field: 'no BCP 14 keyword; definitional — an addition to JSON''s escape set'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.1'
    text: 'CDN keeps it, but also adds the syntax \u{NNN} where NNN is the Unicode scalar value as a hexadecimal number.'
