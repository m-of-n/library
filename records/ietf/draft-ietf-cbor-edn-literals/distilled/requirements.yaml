    field: 'no BCP 14 keyword; ''Specifically, ... are not copied'' states a parsing consequence'
    verb: 'none'
    actor: 'parser'
    locator: '§1.3.5'
    text: 'Specifically, any carriage return characters that may be present in a CDN (text or byte) string literal are not copied into the resulting string.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0014"
    object: 'a carriage return wanted in a CBOR string'
    field: 'no BCP 14 keyword; states the only remaining route'
    verb: 'none'
    actor: 'writer'
    locator: '§1.3.5'
    text: 'If a carriage return is needed in a CBOR string data item, it can be added explicitly, for instance by using the escaped form \r in single-quoted or double-quoted strings.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0015"
    object: 'relationship of CDN to JSON'
    field: 'no BCP 14 keyword; a definitional ''is a true superset''. This is a conformance claim a test can check'
    verb: 'none'
    actor: 'implementation'
    locator: '§2'
    text: 'CDN is a true superset of JSON as it is defined in [STD90] in conjunction with [RFC7493] (that is, any interoperable [RFC7493] JSON text also is a CDN text), extending it both to cover the greater expressiveness of CBOR and to increase its usability.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0016"
    object: 'map keys'
    field: 'no BCP 14 keyword; definitional ''extends JSON here by allowing'''
    verb: 'none'
    actor: 'writer'
    locator: '§2'
    text: 'CDN borrows the JSON syntax for numbers (integer and floating-point, Section 2.2), certain simple values (Section 2.6), UTF-8 [STD63] text strings, arrays, and maps (maps are called objects in JSON; the diagnostic notation extends JSON here by allowing any data item in the map key position).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0017"
    object: 'prefixed literals as an extension point'
    field: 'no BCP 14 keyword; definitional. Establishes that ALL literal forms beyond base CDN arrive through one mechanism'
    verb: 'none'
    actor: 'implementation'
    locator: '§2'
    text: 'Many of the forms of literals provided are predefined by this document, but it also defines an extension point that enables defining additional _application-oriented extension literals_.'
    kind: inferred
    testable: no
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0018"
    object: 'generation/ingestion of well-formed-but-invalid CBOR'
    field: 'permission, not obligation'
    verb: 'MAY'
    actor: 'implementation'
    locator: '§2'
    text: 'As CDN is used for truly diagnostic purposes, its implementations MAY support generation and possibly ingestion of CDN for CBOR data items that are well-formed but not valid.'
    kind: stated
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0019"
