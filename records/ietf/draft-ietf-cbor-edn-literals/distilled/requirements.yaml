  - id: "draft-ietf-cbor-edn-literals#R-0036"
    object: 'the two CBOR string kinds'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'implementation'
    locator: '§2.3'
    text: 'CBOR distinguishes two kinds of strings: text strings (the bytes in the string constitute UTF-8 [STD63] text, major type 3), and byte strings (CBOR does not further characterize the bytes that constitute the string, major type 2).'
