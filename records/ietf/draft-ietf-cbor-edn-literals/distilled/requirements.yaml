note: |
  Ids are stable and never reused. Cite as draft-ietf-cbor-edn-literals#R-NNNN.
  Entries are in source order by section, then by position within the section; ids
  run from R-0001 with no gaps.
  KIND. `stated` means an all-capitals BCP 14 keyword backs the entry; there are ten
  such keywords in ten entries, and `reconciliation` names every one. `inferred` means no
  BCP 14 keyword backs it - the force is a definition of what a literal denotes, a
  grammar side condition, a stated consequence, an explicit absence, or a lower-case
  force-word - and every inferred entry names that carrier in `field`. `inferred` here
  does NOT mean the text is paraphrased: every `text` in this file is a single
  contiguous verbatim span of the cached source. This follows the convention of
  records/ietf/rfc-8610/distilled/requirements.yaml.
  THE BYTE-STRING PREFIX QUESTION (library#39) is settled by four entries read together:
  'draft-ietf-cbor-edn-literals#R-0077' and 'draft-ietf-cbor-edn-literals#R-0078'
  (Section 3) state the namespace CDN inherits from RFC 8949 Section 8, in which h, b32,
  h32 and b64 are taken; 'draft-ietf-cbor-edn-literals#R-0090' (Section 3.1) names the two
  base-encoding prefixes this document defines; and
  'draft-ietf-cbor-edn-literals#R-0091' (Section 3.1) says in the document's own words
  that b32 and h32 are "not directly included in this specification". See
  distilled/schema/byte-string-prefixes.derived.yaml for the full disposition.
  VERB. Upper case only for the ten stated entries. Lower case reproduces the source's
  own force-word ('must', 'mandatory to implement', 'needs to', 'has to stop', 'cannot',
  'should', 'reserved', 'might', ...); `none` means the sentence carries no force-word at
  all and its normativity is definitional - which, for a notation, is the usual case.
  ACTOR. `writer` is whoever authors CDN text; `parser` is a CDN-consuming
  implementation; `tool` is a program in a processing chain; `implementation` is either
  side, or the specification of an app-extension.
  LIST MARKERS. Where the source renders a statement as a bullet or a numbered item, the
  '*', '-' or 'n.' marker is not part of the quote and `field` says so. The marker is
  layout, not text.
  CPA888 and CPA999 are PLACEHOLDERS for code points IANA has not assigned; Section 7.5
  and an RFC-Editor note say so. Do not hard-code 888/999.

