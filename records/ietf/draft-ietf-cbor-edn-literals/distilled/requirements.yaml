    verb: 'RECOMMENDED'
    actor: 'implementation'
    locator: '§2'
    text: 'It is RECOMMENDED that an implementation enables such usage only explicitly by configuration (such as an API or CLI flag).'
    kind: stated
    testable: yes
    status: active
