    field: 'no BCP 14 keyword; the force is the design statement ''is designed to enable'''
    verb: 'none'
    actor: 'writer'
    locator: '§1.3.5'
    text: 'Similar to JSON, CDN is designed to enable representing all CBOR data items using a source character repertoire just containing printable ASCII characters (%x20-7e in ABNF) and newlines.'
