    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0010"
    object: 'bare-CR line endings'
    field: 'no BCP 14 keyword; an explicit SCOPE EXCLUSION (''are out of scope for this document'')'
    verb: 'none'
    actor: 'implementation'
    locator: '§1.3.5'
    text: '(Platforms that use just a CARRIAGE RETURN by itself to signify an end of line are no longer relevant and the files they produce are out of scope for this document.)'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0011"
    object: 'CDN processing of newline representations'
    field: 'the only MUST the document asserts about processing. NOTE: the sentence is SEVERED BY A PAGE FRAME between ''there'' ... no — between ''CDN MUST'' (source line 519) and ''create'' (line 520) there is only a line break; the quote is contiguous once the running header/footer is removed'
    verb: 'MUST'
    actor: 'implementation'
    locator: '§1.3.5'
    text: 'To ensure that platforms will generate the same bytes in the CBOR data items created from input in either conversion state, CDN MUST create the same processing result independent of which newline representation is used by its input.'
    kind: stated
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0012"
    object: 'unescaped CARRIAGE RETURN in CDN input'
    field: 'no BCP 14 keyword; this is the MECHANISM that discharges the MUST above — ''are ignored as if they were not in the input'''
    verb: 'none'
    actor: 'parser'
    locator: '§1.3.5'
    text: 'To deal with this variability in platform presentation of newlines, Unicode CARRIAGE RETURN characters that exist in the input unescaped are ignored as if they were not in the input wherever they appear.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0013"
