    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0053"
    object: 'single leading and trailing space of the inner string'
    field: 'no BCP 14 keyword; the second POST-PROCESSING RULE, conditional on the first not applying. Quoted without its ''*'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.3'
    text: 'if the first rule does not apply, but the inner string starts with a space character as well as ends with one, exactly one single space character starting the inner string together with exactly one single space character ending the inner string are removed to yield the string content.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0054"
    object: 'inner string when neither rule applies'
    field: 'no BCP 14 keyword; closes the post-processing procedure'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.3'
    text: 'If neither of these rules apply, the inner string between the raw delimiters is used as the raw string unchanged.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0055"
    object: 'sequence literal'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'writer'
    locator: '§2.3.4'
    text: 'In diagnostic notation, a sequence of zero or more CBOR data item literals can be enclosed in << and >> and separated by comma or blank space, optionally prefixed by an app-extension prefix; this specification speaks of _sequence literals_.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0056"
    object: 'prefixed sequence literal'
    field: 'no BCP 14 keyword; definitional — the result is always ONE data item'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.4'
    text: 'Prefixed sequence literals refer to the app-extension (see Section 3) identified by the prefix and apply the extension to its sequence content, resulting in a single data item.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0057"
    object: 'unprefixed sequence literal (embedded CBOR)'
    field: 'no BCP 14 keyword; definitional — this is the << >> form and it yields a BYTE STRING'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.4'
    text: 'An unprefixed sequence literal applies CBOR encoding to the data items in its content, taken as a CBOR sequence. The value of the literal thus is a byte string with the encoded content; this is commonly referred to as _embedded CBOR_.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0058"
    object: 'encoding indicators inside an unprefixed sequence literal'
    field: 'no BCP 14 keyword; the force is ''is expected to honor'''
    verb: 'none'
    actor: 'implementation'
    locator: '§2.3.4'
    text: 'A diagnostic implementation is expected to honor encoding indicators (please see Section 4) on the individual items in the supplied sequence before assembling them into an encoded CBOR sequence.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0059"
    object: 'encoding indicators inside a prefixed sequence literal'
    field: 'no BCP 14 keyword; a DEFAULT rule (''are ignored if'')'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.4'
    text: 'Encoding indicators on the arguments are ignored if the app-extension does not define special handling of encoding variants.'
