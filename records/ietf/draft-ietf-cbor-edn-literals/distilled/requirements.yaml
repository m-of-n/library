    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0047"
    object: 'status of h and b64 relative to registered prefixes'
    field: 'no BCP 14 keyword; definitional and DECISIVE for the byte-string-prefix question: the two built-ins are not privileged, they are simply the two that exist'
    verb: 'none'
    actor: 'implementation'
    locator: '§2.3.2'
    text: '(Additional kinds of base-encoded string literals can be defined as prefixed literals by registering their prefixes; there is no fundamental difference between the original two predefined base-encoded string literal prefixes (Section 3.1: h, b64) and any such potential future extension literal prefixes; for simplicity of expression, both cases are referred to as "prefixed literals".)'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0048"
    object: 'raw string literal'
    field: 'no BCP 14 keyword; definitional — backslash is NOT an escape inside a raw string'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.3'
    text: 'CDN therefore also allows text strings to be notated as raw string literals, which do not perform any special processing on backslashes, i.e., treat them as raw string content like any other characters.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0049"
    object: 'raw string delimiters'
    field: 'no BCP 14 keyword; definitional'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.3'
    text: 'Instead, data transparency is provided by enclosing the entire string content in starting and ending delimiters built as a sequence of one or more backquote (»`«, U+0060 GRAVE ACCENT) characters.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0050"
    object: 'choosing the delimiter width'
    field: 'no BCP 14 keyword; definitional, and it is the rule a parser must implement outside the ABNF'
    verb: 'none'
    actor: 'writer'
    locator: '§2.3.3'
    text: 'By using more backquotes for each of the outer delimiters than the longest sequence of backquotes that can be found in the string, internal backquotes do not prematurely end the string literal.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0051"
    object: 'the empty string as a raw string'
    field: 'no BCP 14 keyword; an EXCLUSION. Quoted without its ''*'' list marker'
    verb: 'none'
    actor: 'writer'
    locator: '§2.3.3'
    text: 'raw strings could not be used for empty string data items, which therefore need to be notated using double- or single-quoted strings.'
