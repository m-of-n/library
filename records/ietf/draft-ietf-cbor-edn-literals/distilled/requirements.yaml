    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0052"
    object: 'leading newline of the inner string'
    field: 'no BCP 14 keyword; a numbered POST-PROCESSING RULE applied after delimiter matching. Quoted without its ''*'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.3'
    text: 'any single newline (LF or CRLF, see Section 1.3.5) at the start of the inner string is removed to yield the string content.'
