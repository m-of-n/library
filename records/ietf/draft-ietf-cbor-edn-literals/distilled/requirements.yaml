reconciliation: 'draft-ietf-cbor-edn-literals-27 contains exactly TEN all-capitals BCP 14 keyword occurrences in 168 KB (MAY 5, MUST 2, RECOMMENDED 2, MUST NOT 1), and bin/bcp14-count reports 10. All ten are extracted here as kind: stated, so source and extraction agree at 10 and nothing is reconciled away. The reconciliation is needed for the OTHER number: 215 entries against 10 keywords. THE DOCUMENT''S REAL NORMATIVE BASELINE IS A GRAMMAR AND A SET OF LITERAL MEANINGS, NOT OBLIGATIONS ON AN ACTOR. CDN is a NOTATION: it says what a sequence of characters DENOTES and which CBOR data item it maps to, and a notation has almost no occasion to say that somebody MUST do something. Section 6 is 340 lines of ABNF in 14 figures and carries no keyword at all. This is the same shape as the sibling record rfc-8610 (2 keywords in 125 KB, 137 of 139 entries inferred), and for the same reason. WHAT THE TEN KEYWORDS ACTUALLY BIND. They fall in ten entries, one keyword each. Only two are obligations, and both are narrow: ''draft-ietf-cbor-edn-literals#R-0011'' (Section 1.3.5) requires that CDN processing not depend on whether the input uses LF or CRLF, and ''draft-ietf-cbor-edn-literals#R-0127'' (Section 4) requires a CDN-consuming implementation to ACCEPT encoding indicators - where the same sentence defines accept as ''process or ignore''. The single MUST NOT (''draft-ietf-cbor-edn-literals#R-0064'', Section 2.3.5) bounds an OPTIONAL feature: if an implementation offers Unicode processing beyond UTF-8 conformance, that processing must not get in the way. Four of the five MAYs (''draft-ietf-cbor-edn-literals#R-0018'', ''draft-ietf-cbor-edn-literals#R-0061'', ''draft-ietf-cbor-edn-literals#R-0062'', ''draft-ietf-cbor-edn-literals#R-0070'') are one permission restated in four contexts - that a diagnostic implementation may handle CBOR that is well-formed but not valid; the fifth (''draft-ietf-cbor-edn-literals#R-0082'') permits an app-extension''s own definition to add an uppercase prefix variant. Both RECOMMENDEDs (''draft-ietf-cbor-edn-literals#R-0019'', ''draft-ietf-cbor-edn-literals#R-0128'') are advisory. No keyword in this document constrains the notation itself. WHAT WAS COUNTED INSTEAD, and extracted as kind: inferred: (a) every LITERAL FORM''s concrete syntax, denotation and CBOR mapping (Sections 2.2-2.6, 3.1-3.8, 4.1-4.3); (b) every GRAMMAR SIDE CONDITION the ABNF cannot carry - the raw-string delimiter-width rules of Section 2.3.3 and Section 6.1 item 7, the same-chunk-type rule of Section 4.3, the post-processing rules on a raw string''s inner text; (c) every EXPLICIT DISCLAIMER OF CAPABILITY, because what CDN declines to define bears on us as much as what it does - no deterministic representation and no round-tripping (Section 1.3.2), no Unicode normalization (Section 2.3.5), no zone identifiers (Section 3.3), no ellipses inside an indefinite-length string (Section 3.6), no truncation or rounding from an encoding indicator (Section 4.1); (d) every REMOVAL or DEPRECATION relative to RFC 8610 Appendix G and RFC 8949 Section 8 - string juxtaposition entirely removed (Section 2.3), the empty slash comment repurposed (Section 2.1.1), streamstring deprecated (Section 4.3), b32 and h32 not carried forward (Section 3.1); (e) every REGISTRY rule and policy (Sections 7.1, 7.2, 7.5); and (f) the lower-case force-words the document does use in place of keywords: ''must'' (Sections 2.4.1, 3.5), ''mandatory to implement'' (Section 3), ''needs to'' / ''need to'' (Sections 3.1, 3.3, 3.5, 4.3, 6.1, 6.2.5, 8), ''has to stop'' (Sections 5.1, 5.2), ''is an error'' (Sections 4.1, 3.8), ''cannot'' (Sections 3, 7.1, 7.2), ''should'' (Section 4.3), ''is expected to'' (Sections 2.3.4, 3.7, 4), ''are instructed'' (Section 7.1), ''reserved'' (Sections 3, 4.1), ''might'' (Section 8). Each inferred entry names in its `field` the phrase or definitional form that carries the force and states that no BCP 14 keyword backs it. No obligation was invented, and no entry is a paraphrase: every `text` in this file is a single contiguous verbatim span of the cached source. CONTIGUITY, and what was removed to establish it. Each span was checked by script against the cached source after removing exactly two classes of plain-text page decoration and nothing else: (i) the running header and footer (''Bormann  Expires 21 January 2027  [Page n]'', ''Internet-Draft  Concise Diagnostic Notation (CDN)  July 2026'') and the form feeds beside them; (ii) the aside gutter, which the RFC renderer draws as three or more spaces, a vertical bar and exactly two spaces at the start of a line - table rows use one space after the bar and so are untouched. Runs of whitespace were then collapsed. No interior word, clause or punctuation mark of any span was altered, dropped or reordered, and no span is spliced from two non-adjacent parts of the document. TWO HAZARDS THAT BIT, both recorded in the `field` of every entry they touch. A PAGE FRAME cuts the mandatory-separator sentence of Section 2.4.1 between ''there must'' (source line 1228) and ''be blank space'' (line 1237); that span is contiguous only after the header and footer are removed, which is why removing them is part of the method rather than a convenience. HYPHENATION AT A LINE BREAK severs a token in NINE of the spans quoted here - ''app- extension'', ''byte- string'', ''single- quoted'', ''SHA- 256'', ''[IANA.concise- diagnostic-notation]'' and others - and those nine carry the hyphen and the space exactly as the normalised source renders them, with the break named in `field`. TWO further sentences could not be quoted whole for this reason, so only their obligation-bearing half is quoted and `field` gives the other half: ''draft-ietf-cbor-edn-literals#R-0025'' (Section 2.1.1, broken at ''slash-'' / ''delimited'') and ''draft-ietf-cbor-edn-literals#R-0155'' (Section 5.1, broken TWICE, at ''App-'' / ''Extension'' and again at ''app-'' / ''extension''). Not every hyphen followed by a space is a break: ''using double- or single-quoted strings'' in ''draft-ietf-cbor-edn-literals#R-0051'' is a suspended hyphen the source writes on one line (source line 1070). The Section 1.2 BCP 14 boilerplate is deliberately NOT quoted in any entry: bin/validate counts requirement texts with boilerplate stripping OFF, so quoting it would add eleven phantom keywords.'
