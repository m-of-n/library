    object: 'comment placement'
    field: 'no BCP 14 keyword; definitional — comments are blank space, and only where blank space is allowed'
    verb: 'none'
    actor: 'parser'
    locator: '§2.1'
    text: 'CDN provides two comment syntaxes, which can be used where the syntax allows blank space (outside of constructs such as numbers, string literals, etc.):'
