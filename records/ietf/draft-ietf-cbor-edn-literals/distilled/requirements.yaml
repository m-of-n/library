    verb: 'none'
    actor: 'parser'
    locator: '§2.3.2'
    text: 'All other escaping mechanisms that are available in double-quoted string literals are available in single-quoted string literals.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0045"
    object: 'value of an unprefixed vs a prefixed single-quoted literal'
    field: 'no BCP 14 keyword; definitional, and it is the hinge of the whole prefix mechanism'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.2'
    text: 'Single-quoted string literals can occur unprefixed and stand for the byte string that encodes its text string value (the "content"), or be prefixed by what looks like an app-extension prefix (see Section 3).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0046"
    object: 'result type of a prefixed string literal'
    field: 'no BCP 14 keyword; definitional — a prefixed literal need not denote a byte string at all'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.2'
    text: 'In a prefixed string literal, the text content of the single-quoted string literal is not used directly as a byte string, but is further processed in a way that is defined by the meaning given to the prefix. Depending on the prefix, the result of that processing can, but often is not, a byte string value.'
