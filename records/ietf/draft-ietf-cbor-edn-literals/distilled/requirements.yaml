    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0041"
    object: 'single-quoted string literal'
    field: 'no BCP 14 keyword; definitional. NOTE: ''byte-string'' is BROKEN BY HYPHENATION at a line break (source lines 964-965), rendered here as ''byte- string'''
    verb: 'none'
    actor: 'writer'
    locator: '§2.3.2'
    text: 'Analogously to text-string literals delimited by double quotes, CDN allows the use of single quotes (without a prefix) to express byte- string literals with UTF-8 text; for instance, the following are equivalent:'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0042"
    object: 'the \/ escape in a single-quoted literal'
    field: 'no BCP 14 keyword; an EXCLUSION, stated as ''is not available''. Quoted without its ''*'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.2'
    text: '\/ is an escape in JSON that is available for double-quoted CDN text strings as well to ensure all JSON texts are CDN literals. Since CDN''s single-quoted strings do not occur in JSON, this legacy compatibility feature is not available for them.'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0043"
    object: '\u escapes for printable ASCII in a single-quoted literal'
    field: 'no BCP 14 keyword; an EXCLUSION (''are not available''). Quoted without its ''*'' list marker'
    verb: 'none'
    actor: 'parser'
    locator: '§2.3.2'
    text: '\u-based escapes are not available for characters in the range from U+0020 through U+007E (essentially, printable ASCII).'
    kind: inferred
    testable: yes
    status: active
  - id: "draft-ietf-cbor-edn-literals#R-0044"
    object: 'all other escapes in a single-quoted literal'
