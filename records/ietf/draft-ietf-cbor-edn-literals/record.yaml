  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "226 verbatim bullets and 37 fenced blocks in 43 exact source line runs - 14 ABNF figures, 12 tables, §6.1's numbered items, both registry field blocks, the media-type template and the six editorial crefs marked for removal before publication. 43/43 fences byte-identical by per-fence sha256 and 0 overlapping runs; 226/226 bullets contiguous substrings of the normalised source; 0 locator failures by section range with both ends inside the claimed section; and every bullet reconciled one-to-one against requirements.yaml for text, locator and completeness. Bullet order follows the SOURCE rather than the id number, because R-0216 to R-0226 were appended by the verify pass rather than renumbered"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "226 entries R-0001 to R-0226, no gaps: 10 stated, 216 inferred. source and extracted keyword counts both 10, and the verify pass matched each of the ten source occurrences (lines 519, 575, 577, 1197, 1200, 1208, 1279, 1378, 1884, 1886) to exactly one entry by normalised offset - a bijection onto the ten stated entries, not a tally. R-0001 to R-0215 are in source order; R-0216 to R-0226 were appended by the verify pass for statements the extract pass dropped, since ids are never reused. The reconciliation states the real baseline - this is a NOTATION, so §6's 340 lines of ABNF across 14 figures carry no BCP 14 keyword at all, only two of the ten are obligations and both are narrow, the single MUST NOT bounds an optional feature, and three of the five MAYs are one permission restated while a fourth is a separate permission conditional on it. No keyword constrains the notation itself, with one qualification the reconciliation now records about R-0011"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "13 verbatim across 23 regions and 3 derived. All 23 regions re-read in the verify pass and compared byte-for-byte against the line range and sha256 in their own headers: 23/23 exact. Figure 1's closure re-derived independently at 85 productions, 0 duplicates, 0 incremental =/, 82 distinct referenced names all resolving - and it holds ACROSS all three page frames, with exactly one rule (hexscalar-s) straddling one, which is what proves nothing was lost at a break. cdn-dedented.derived.abnf round-trips exactly in both directions. Includes byte-string-prefixes.derived.yaml, the full disposition of the RFC 8610 four-versus-two conflict with 13/13 quotes verified contiguous"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "35 literal forms, 84 fields, 290 requirement references (154 distinct) with 0 dangling, recounted in the verify pass. Carries the §5.1 three-outcome resolution behaviour, which is where it belongs rather than in a state machine"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "251 vectors V-0001 to V-0251: 242 valid, 9 invalid, every invalid one carrying a violates with quoted text and a section. Provenance is explicit per vector: 52 hex sequences the document printed were decoded and confirmed, 1 printed sequence is WRONG and is corrected with the document's own bytes quoted in notes, 172 are ours and marked COMPUTED HEX., and 26 carry no hex with a stated reason. 63 printed byte sequences were independently re-encoded from the EDN and compared - 61 matched, 2 did not, and both are cells of one Table 6 row. The verify pass re-encoded all 223 hex-carrying vectors from their EDN with its own CBOR codec and CDN parser, built without a CBOR library, and found two of OURS wrong: V-0131 and V-0139 gave -14159024.0 as binary64 where binary32 holds it exactly, so Preferred Serialization requires facb580cb0"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the byte-string prefix disposition; ten further EDN/CDDL divergences beyond the two rfc-8610 recorded, four of which parse SILENTLY in both languages with different meanings; the verdict on EDN as our test-vector format (hex is normative, edn is commentary); and the MD-3 section, including that CDN answers the two largest objections to YAML as the human form"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "A pure notation. §1: \"CDN is not designed or intended for general-purpose use in protocol elements exchanged between systems engaged in processes outside those listed here.\" §1.3 and §2 both quote STD 94's \"All actual interchange always happens in the binary format\", and §7.3 registers the media type with Intended usage LIMITED USE and \"Restrictions on usage: Concise diagnostic notation represents CBOR data items, which are the format intended for actual interchange.\" No roles, no peers, no request/response, no error paths between parties."
    - kind: state-machine
      reason: "A genuine call rather than an absence, so the reasoning is recorded, and the verify pass attacked it rather than accepting it. §5.1 DOES define a three-outcome resolution rule for a prefixed literal - resolve it, defer it into CPA999, or \"this is usually an error and processing has to stop\" - and §5 does speak of a pipeline, \"chains of tools are involved in processing CDN\" (though that phrase is in an aside marked \"Implementation note\", not in normative prose). But that is a per-item decision procedure, not a lifecycle: nothing persists between items and no item is in a state. Three places were checked for persistence and none provides any. (1) The raw-string delimiter width IS carried state - \"alikerawdelim only matches sequences of backquotes that are exactly as long as a previous startrawdelim\" - but it lives and dies inside one literal. (2) What varies between stages of the §5 chain is CONFIGURATION, not state: the same aside says it depends on \"specific processing options (e.g., command line flags)\". (3) There is no document-level declaration that could carry state forward: §7.3 registers the media type with \"Required parameters: N/A\" and \"Optional parameters: N/A\", and pragma - the one construct that would introduce document-level state - is listed in Table 8 as \"Reserved for future\" use and is defined nowhere in draft-27. It is modelled as resolution behaviour in messages.yaml and schema/byte-string-prefixes.derived.yaml instead. Contrast rfc-9053, which DOES carry a state machine, because its key-usage counters persist across messages."
