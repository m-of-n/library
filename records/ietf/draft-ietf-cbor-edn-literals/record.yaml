distillation:
  standard: "FX-1"
  # NO `profile` YET. Pass 1 (extract) is complete across the artifact set;
  # verify and cross-check have NOT run, and an unfinished extraction is
  # neither `full` nor `partial` (docs/extraction.md).
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "215 verbatim bullets and 31 fenced blocks in 37 exact source line runs - 14 ABNF figures, 12 tables, §6.1's numbered items, both registry field blocks and the media-type template. 37/37 fences byte-identical by per-fence sha256; 215/215 bullets contiguous substrings; 0 locator failures by section range; and every bullet reconciled one-to-one against requirements.yaml for text, locator, order and completeness"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "215 entries R-0001 to R-0215 in source order, no gaps: 10 stated, 205 inferred. source and extracted keyword counts both 10. A 5.8 KB reconciliation states the real baseline - this is a NOTATION, so §6's 340 lines of ABNF across 14 figures carry no BCP 14 keyword at all, only two of the ten are obligations and both are narrow, the single MUST NOT bounds an optional feature, and four of the five MAYs are one permission restated in four contexts. No keyword in this document constrains the notation itself"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "13 verbatim across 23 regions and 3 derived. Every verbatim region re-read and compared byte-for-byte, each carrying its source line range and a sha256 in its header. Figure 1's closure verified at 85 productions, 0 duplicates, 82 referenced names all resolving - and it holds ACROSS all three page frames, which is what proves nothing was lost at a break. cdn-dedented.derived.abnf round-trips exactly in both directions. Includes byte-string-prefixes.derived.yaml, the full disposition of the RFC 8610 four-versus-two conflict with 13/13 quotes verified contiguous"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "35 literal forms, 84 fields, 290 requirement references with 0 dangling. Carries the §5.1 three-outcome resolution behaviour, which is where it belongs rather than in a state machine"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "251 vectors V-0001 to V-0251: 242 valid, 9 invalid, every invalid one carrying a violates with quoted text and a section. Provenance is explicit per vector: 50 hex sequences the document printed were decoded and confirmed, 1 printed sequence is WRONG and is corrected with the document's own bytes quoted in notes, 174 are ours and marked COMPUTED HEX., and 26 carry no hex with a stated reason. 61 printed byte sequences were independently re-encoded from the EDN and compared - 59 matched, 2 did not"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the byte-string prefix disposition; ten further EDN/CDDL divergences beyond the two rfc-8610 recorded, four of which parse SILENTLY in both languages with different meanings; the verdict on EDN as our test-vector format (hex is normative, edn is commentary); and the MD-3 section, including that CDN answers the two largest objections to YAML as the human form"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "A pure notation. §1: \"CDN is not designed or intended for general-purpose use in protocol elements exchanged between systems engaged in processes outside those listed here.\" §1.3 and §2 both quote STD 94's \"All actual interchange always happens in the binary format\", and §7.3 registers the media type with Intended usage LIMITED USE and \"Restrictions on usage: Concise diagnostic notation represents CBOR data items, which are the format intended for actual interchange.\" No roles, no peers, no request/response, no error paths between parties."
    - kind: state-machine
      reason: "A genuine call rather than an absence, so the reasoning is recorded. §5.1 DOES define a three-outcome resolution rule for a prefixed literal - resolve it, defer it into CPA999, or \"this is usually an error and processing has to stop\" - and §5 describes a pipeline where \"chains of tools are involved in processing CDN\". But that is a per-item decision procedure, not a lifecycle: nothing persists between items, no item is in a state, and the pipeline's stages belong to the toolchain rather than to the notation. It is modelled as resolution behaviour in messages.yaml and schema/byte-string-prefixes.derived.yaml instead. Contrast rfc-9053, which DOES carry a state machine, because its key-usage counters persist across messages."
  passes:
    - pass: extract
      by: "claude-opus-5 (2 parallel agents, one per artifact group)"
      effort: max
      date: "2026-10-19"
      note: "each agent read only .cache/draft-ietf-cbor-edn-literals.txt. Both independently reached the same disposition of the RFC 8610 byte-string prefix conflict from different evidence. The round-trip of printed byte sequences found a wrong row in the source's own §4.1 Table 6, which the orchestrator re-derived before accepting"
