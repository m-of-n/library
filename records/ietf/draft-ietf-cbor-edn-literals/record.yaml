distillation:
  standard: "FX-1"
  profile: full
  # All three FX-1 passes complete at effort max: extract (2 parallel agents),
  # verify (independent), cross-check (artifact against artifact, and the pass
  # that first ran the grammar). Every `reviewed_by` below is still empty: no
  # human has signed anything off.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "226 verbatim bullets and 43 fenced blocks in 43 exact source line runs - 14 ABNF figures, 12 tables, §6.1's numbered items, both registry field blocks, the media-type template and the six editorial crefs marked for removal before publication. 43/43 fences byte-identical by per-fence sha256 and 0 overlapping runs, re-read against the cached source again by the cross-check pass; 226/226 bullets contiguous substrings of the normalised source; 0 locator failures by section range with both ends inside the claimed section; and the 226 bullet ids are the 226 requirements.yaml ids exactly, as sets. The count of fenced blocks was 37 in pass 1 and pass 2, which counted only the 37 whose run comment sits directly above the fence; the six editorial crefs put the comment above a bold label and are fenced like the rest, so it is 43 in 43. Bullet order follows the SOURCE rather than the id number, because R-0216 to R-0226 were appended by the verify pass rather than renumbered"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "226 entries R-0001 to R-0226, no gaps: 10 stated, 216 inferred. source and extracted keyword counts both 10, and the verify pass matched each of the ten source occurrences (lines 519, 575, 577, 1197, 1200, 1208, 1279, 1378, 1884, 1886) to exactly one entry by normalised offset - a bijection onto the ten stated entries, not a tally. R-0001 to R-0215 are in source order; R-0216 to R-0226 were appended by the verify pass for statements the extract pass dropped, since ids are never reused. The reconciliation states the real baseline - this is a NOTATION, so §6's 340 lines of ABNF across 14 figures carry no BCP 14 keyword at all, only two of the ten are obligations and both are narrow, the single MUST NOT bounds an optional feature, and three of the five MAYs are one permission restated while a fourth is a separate permission conditional on it. No keyword constrains the notation itself, with one qualification the reconciliation now records about R-0011"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "13 verbatim across 23 regions and 3 derived. All 23 regions re-read in the verify pass and compared byte-for-byte against the line range and sha256 in their own headers: 23/23 exact. Figure 1's closure re-derived independently at 85 productions, 0 duplicates, 0 incremental =/, 82 distinct referenced names all resolving - and it holds ACROSS all three page frames, with exactly one rule (hexscalar-s) straddling one, which is what proves nothing was lost at a break. cdn-dedented.derived.abnf round-trips exactly in both directions. Includes byte-string-prefixes.derived.yaml, the full disposition of the RFC 8610 four-versus-two conflict with 13/13 quotes verified contiguous. THE CROSS-CHECK PASS RAN THE GRAMMAR, which no earlier pass had: an RFC 5234 ABNF reader and a memoised set-of-end-positions recogniser, reading cdn.abnf's own bytes. It reproduced the closure a third time (85 productions, 82 names referenced, 0 unresolved, exactly three unreferenced - lblank, newline, one-item), confirmed cdn-dedented.derived.abnf yields the same 85 rules with identical right-hand sides, re-derived the per-figure counts figure by figure (204 productions across 14 figures, all eight published subtotals agreeing), and re-derived G-18's split as 24 names redefined / 16 identically / 8 differently and G-17's as EIGHT names needed from Figure 1 - the numbers pass 2 had corrected in grammar-gaps.derived.txt's body but not in schema/README.md or in its own trailing checklist, both now fixed. 56 parse claims this directory makes were run as tests and all 56 held, so G-10, G-11, G-13, G-15, G-20 and G-21 are now observed rather than reasoned. Two new source defects were found and recorded, never repaired, as G-31 (an eol-comment requires a terminating newline, so a CDN text cannot END with one) and G-32 (§7.2's Reference field describes the app-extension identifier inside the Encoding Indicators registry)"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "35 literal forms, 84 fields, 311 requirement references (167 distinct) with 0 dangling. Carries the §5.1 three-outcome resolution behaviour, which is where it belongs rather than in a state machine. The cross-check pass walked all 226 requirements the OTHER way, which no earlier pass had: 173 are named by messages.yaml or schema/, and the 53 that name no construct fall in eleven classes the file's header enumerates - generator configuration, pre-parse input transformation, removals, capability disclaimers, statements about the language as a whole, statements about tools, statements ABOUT the ABNF, registry process, security advice, and Appendix A's informative comparison. It added the thirteen links that were missing: the eight of R-0216..R-0223 that name a construct (the eleven entries pass 2 appended had never been reconciled here at all; the other three are expert-review policy and correctly have none), plus R-0037, R-0046, R-0047, R-0056 and R-0059 from pass 1. R-0222 is now linked from both forms whose `cbor` invokes Preferred Serialization, because it is the authority every COMPUTED HEX. byte rests on"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "251 vectors V-0001 to V-0251: 242 valid, 9 invalid, every invalid one carrying a violates with quoted text and a section. Provenance is explicit per vector: 52 hex sequences the document printed were decoded and confirmed, 1 printed sequence is WRONG and is corrected with the document's own bytes quoted in notes, 173 are ours and marked COMPUTED HEX., and 25 carry no hex with a stated reason - 17 of those 25 being the deliberate non-encodables and the other 8 being eight of the nine invalid vectors. 63 printed byte sequences were independently re-encoded from the EDN and compared - 61 matched, 2 did not, and both are cells of one Table 6 row. The verify pass re-encoded all 223 hex-carrying vectors from their EDN with its own CBOR codec and CDN parser, built without a CBOR library, and found two of OURS wrong: V-0131 and V-0139 gave -14159024.0 as binary64 where binary32 holds it exactly, so Preferred Serialization requires facb580cb0. THE CROSS-CHECK PASS PARSED ALL 251 against schema/cdn.abnf with an ABNF-driven recogniser, which is what 'every example validates against the schema' means for a record whose schema IS the notation's grammar: 242 parse as held and 246 with the document's own line terminator restored, identically from both candidate start symbols (seq and one-item) and under both readings of the raw-string delimiter widths. SIX of the nine invalid vectors fail the GRAMMAR rather than the semantics - unlike the sibling rfc-8610 set - and each already carried a violates naming the §6.1 production, so artifact and parser agree; only V-0044, V-0045 and V-0102 parse and then fail on meaning. All 17 deliberate non-encodables parse. The three valid vectors that do not parse as held are V-0059, V-0060 and V-0061, which end in a trailing # comment and need the newline the block scalar strips (G-31). The start symbol changes no verdict: seq and one-item diverge on exactly one input in the corpus, V-0014's `//` once its newline is restored, which is the practical size of G-19's defect. It also RESOLVED V-0238, which was refusing the bytes V-0239 prints for the same value from the same sentence of §6.1 item 5; V-0238 now carries c249358a750438f380f5f6 and the no-IANA-tags caveat stays in notes. And it corrected V-0174's notes, which offered `b1<\"Hello world\">>` as a reading of the bracket defect - that does not parse either"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the byte-string prefix disposition; ten further EDN/CDDL divergences beyond the two rfc-8610 recorded, four of which parse SILENTLY in both languages with different meanings; the verdict on EDN as our test-vector format (hex is normative, edn is commentary); and the MD-3 section, including that CDN answers the two largest objections to YAML as the human form"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "A pure notation. §1: \"CDN is not designed or intended for general-purpose use in protocol elements exchanged between systems engaged in processes outside those listed here.\" §1.3 and §2 both quote STD 94's \"All actual interchange always happens in the binary format\", and §7.3 registers the media type with Intended usage LIMITED USE and \"Restrictions on usage: Concise diagnostic notation represents CBOR data items, which are the format intended for actual interchange.\" No roles, no peers, no request/response, no error paths between parties. The cross-check pass swept the artifact set for exchange vocabulary: all 35 forms in messages.yaml carry `encoding: CDN-text`, and the only hits anywhere are IANA REGISTRATION requests, the document's own DISCLAIMER of round-tripping, and a `/session-id/` comment inside V-0009 - a GRASP message WRITTEN IN CDN, which is CDN describing an exchange, not participating in one."
    - kind: state-machine
      reason: "A genuine call rather than an absence, so the reasoning is recorded, and the verify pass attacked it rather than accepting it. §5.1 DOES define a three-outcome resolution rule for a prefixed literal - resolve it, defer it into CPA999, or \"this is usually an error and processing has to stop\" - and §5 does speak of a pipeline, \"chains of tools are involved in processing CDN\" (though that phrase is in an aside marked \"Implementation note\", not in normative prose). But that is a per-item decision procedure, not a lifecycle: nothing persists between items and no item is in a state. Three places were checked for persistence and none provides any. (1) The raw-string delimiter width IS carried state - \"alikerawdelim only matches sequences of backquotes that are exactly as long as a previous startrawdelim\" - but it lives and dies inside one literal. (2) What varies between stages of the §5 chain is CONFIGURATION, not state: the same aside says it depends on \"specific processing options (e.g., command line flags)\". (3) There is no document-level declaration that could carry state forward: §7.3 registers the media type with \"Required parameters: N/A\" and \"Optional parameters: N/A\", and pragma - the one construct that would introduce document-level state - is listed in Table 8 as \"Reserved for future\" use and is defined nowhere in draft-27. It is modelled as resolution behaviour in messages.yaml and schema/byte-string-prefixes.derived.yaml instead. Contrast rfc-9053, which DOES carry a state machine, because its key-usage counters persist across messages. The cross-check pass tested this against the ARTIFACT SET rather than the source and it held: no state table, transition or lifecycle appears in any artifact, the three outcomes are modelled exactly where this reason says they are, and the first persistence candidate stopped being an argument and became evidence - a recogniser built from cdn.abnf has to carry the raw-string delimiter width as a PARAMETER OF ONE LITERAL'S MATCH, and nothing survives the literal."
  passes:
    - pass: extract
      by: "claude-opus-5 (2 parallel agents, one per artifact group)"
      effort: max
      date: "2026-10-19"
      note: "each agent read only .cache/draft-ietf-cbor-edn-literals.txt. Both independently reached the same disposition of the RFC 8610 byte-string prefix conflict from different evidence. The round-trip of printed byte sequences found a wrong row in the source's own §4.1 Table 6, which the orchestrator re-derived before accepting"
    - pass: verify
      by: "claude-opus-5 (single agent, independent of the extract pass)"
      effort: max
      date: "2026-10-19"
      note: "re-derived rather than reviewed: its own normaliser, section map from the source's own headings, ABNF analyser, and a CBOR encoder/decoder plus CDN parser written without a CBOR library. Everything structural held - the ten keywords as a bijection onto ten entries, Figure 1's 85-production closure across three page frames, 23/23 schema regions, 43/43 fence sha256s, the Table 6 mt3 defect, Figure 8's two dropped bstr alternatives and the resulting silent loss of raw strings from a still-closed grammar, the byte-string prefix disposition, and the verdict that EDN cannot carry our vectors. What it changed: eleven dropped normative statements added as R-0216 to R-0226 (the load-bearing one being R-0222, §4.1's own statement that an absent encoding indicator implies Preferred Serialization); two of OUR OWN vectors corrected (V-0131, V-0139, binary64 where binary32 is exact); fifteen quotations in vectors.yaml that had silently healed a line-break hyphenation restored to the source's bytes, with nine of them also restoring the source's own // cref markers; nine further quotations unclipped and one unspliced; V-0212 and V-0213 reclassified SOURCE HEX because §4.3 prints their bytes; a mid-edit editorial trace removed from R-0011's field; the four-MAYs claim corrected to three-plus-one; and four counts corrected (37 fenced blocks in 43 runs, not 31 in 37; eight differing rule redefinitions, not nine; eight undeclared Figure 1 dependencies, not six; and cdn.abnf's header said 97 productions where there are 85)"
    - pass: cross-check
      by: "claude-opus-5 (single agent, artifact against artifact)"
      effort: max
      date: "2026-10-19"
      note: "the pass that FIRST RAN THE GRAMMAR. It wrote an RFC 5234 ABNF reader and a memoised set-of-end-positions recogniser and pointed it at distilled/schema/cdn.abnf itself - stripping the ';' headers and the draft's three-column margin in the reader, so the grammar under test is the verbatim artifact rather than a transcription - then ran all 251 vectors through it from both candidate start symbols. 242 parse as held, 246 with the document's own line terminator; the start symbol changes no verdict. It walked all 226 requirements against the 35 literal forms, the 84 fields and the 16 schema files, confirmed protocol and state-machine not_applicable against the artifact set rather than the source, and re-derived every count pass 2 had moved. What it changed: V-0238 given the bytes V-0239 was already printing for the same value (provenance 172/26 -> 173/25); thirteen missing constrained_by links added, the eight of R-0216..R-0223 that name a construct plus five pass-1 omissions (290 references -> 311); 'nine' differing rule redefinitions -> eight and 'six' Figure 1 dependencies -> eight in schema/README.md, and 15/9 -> 16/8 in grammar-gaps.derived.txt's own checklist; '37 fenced blocks in 43 runs' -> 43 in 43; V-0174's notes, which offered a repair that does not parse; R-0193's field, to record that its text is the one requirement occurring twice in the document; and two NEW source defects recorded as G-31 and G-32. Nothing structural moved"
status: distilled
usefulness:
