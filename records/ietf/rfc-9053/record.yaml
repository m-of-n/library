distillation:
  standard: "FX-1"
  # NO `profile` YET. Passes 1 (extract) and 2 (verify) are complete;
  # cross-check has NOT run, and an unfinished extraction is neither `full`
  # nor `partial` (docs/extraction.md).
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "323 verbatim statements and 31 fenced blocks, §1-§11 in source order, with all 23 tables reproduced in full plus 8 further fences. All quotes and fences verified contiguous/byte-exact after YAML round-trip; locators verified by section range. Boilerplate, the changes-from-8152 history, Acknowledgments and Author's Address dropped and declared"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "222 entries R-0001 to R-0222 in source order, no gaps: 101 stated, 121 inferred. source and extracted keyword counts both 101 and reconciliation is EMPTY because there is nothing to reconcile - every one of the 101 source occurrences was mapped to exactly one stated entry by raw byte offset (101 covered, 0 missed, 0 double-counted), with a per-section tally summing to 101. The 121 inferred texts carry zero uppercase keywords. 212 testable: yes, 10 no. Pass 2 re-derived the bijection independently as a maximum bipartite matching under a both-ends section constraint and it is perfect: 98 of the 101 entries admit exactly one candidate occurrence and the other 3 are genuine duplicate sentences in the source (§5.2 twice, §7.1.1 x and y)"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "1 verbatim (kdf-context.cddl, §5.2's PartyInfo/COSE_KDF_Context, byte-exact at source lines 1168-1184 including the three-space margin, verified by diff) and 4 derived covering all 43 algorithm code points, the key structures per key type, the nine algorithm-specific header parameters and the §8 capability arrays. That one fragment is the ONLY CDDL in 2443 lines, and §1.4 makes it non-normative, so four of five files here are ours by necessity. No JSON Schema: every structure is a CBOR array or negative-integer-labelled map and a JSON projection would be invented"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "56 structures and 300 fields: 12 non-algorithm structures, all 43 algorithm code points with no gaps, and the 4-entry HKDF family. constrained_by omitted throughout because the ids belonged to a concurrently written file; locators are exact and are the join key for the cross-check pass"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "6 vectors V-0001 to V-0006 - and the smallness IS the finding. The document prints NO cryptographic test vectors for any of its 43 algorithm code points: no key, signature, MAC, ciphertext, nonce, derived key, COSE_Key or COSE_KDF_Context. The only bytes anywhere are three §8.3 capability byte strings totalling 10 bytes, §9's 0x01/0x1801 pair and §11's YES/NO illustration. Pass 2 verified the absence across all 2443 lines: four 0x literals in the whole document, zero h'' byte strings, zero base64, no run of eight or more hex characters. §1.5 points instead at github.com/cose-wg/Examples commit 3221310 of 3 June 2020 - informative, pinned 26 months before publication, digest unrecorded"
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "two machines, both marked derived: true. A key-usage lifecycle (fresh to in-use to threshold-exceeded or ceiling-exceeded to retired, with an unrekeyable error state from §11's group hazard) and a key-trust promotion (untrusted to trusted on proof of possession, §6.3.1.1). RFC 9053 names no state as a state - pass 2 confirmed the word 'state' occurs exactly once in 2443 lines, at §11's 'state of the application', which is not one - so the states, their ordering and their names are ours; the only two BCP 14 statements in the machine are §4.1.1's 2^32 message ceiling and §4.2.1's 2^61 operation ceiling. Gaps recorded: no period, counter or responsible party is named for rotation, and COSE carries no field in which to track a usage counter at all - pass 2 tested that last gap against §6.3.1's Static-Static global counter and §11's nonce counter, and neither is bound to a ceiling"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the export path under MD-3 with concrete code points and the minimum verifiable COSE_Sign1; the pre-hash refusal assessed as a standing COSE position across nine years; standing (Informational against RFC 9052's STD 96, and the finding that this document allocated only IV-GENERATION = 34 while being the citation of record for 42 code points it did not allocate); and five named cuts against MD-3"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "The document says so itself, twice. §6.3.1: \"COSE does not have an Ephemeral-Ephemeral version defined.  The reason for this is that COSE is not an online protocol by itself and thus does not have a method of establishing ephemeral secrets on both sides.\" §6.3.1.1: \"This was not done, because COSE is used in a store-and-forward format rather than in online key exchange.\" §5.2 gives only a one-way relation - PartyU creates the message, PartyV receives it - with no exchange, no ordering and no error path between them. NOTE that state-machine is NOT not_applicable for this record: the document does define a key-usage lifecycle, and it is extracted."
  passes:
    - pass: extract
      by: "claude-opus-5 (2 parallel agents, one per artifact group)"
      effort: max
      date: "2026-10-19"
      note: "each agent read only .cache/rfc-9053.txt. A mechanical audit of this extraction's OWN quotations found and fixed 12 real splices, all Description-column text from Tables 10/12/15/19/23 reassembled down a wrapped cell and presented as quotation; those are now glossed rather than quoted. Every computed value is marked (OURS), because the source prints no bytes and no sizes. The orchestrator's brief misnumbered Security Considerations as §9; it is §11, and the agent corrected it rather than following it"
    - pass: verify
      by: "claude-opus-5 (1 agent, adversarial; read only .cache/rfc-9053.txt and the artifacts)"
      effort: max
      date: "2026-10-19"
      note: "the bijection survives independent re-derivation as a maximum bipartite matching with a both-ends section constraint - 101 source occurrences to 101 stated entries, 0 missed, 0 double-counted, per-section tally reproduced exactly, reconciliation rightly empty. All 222 requirement texts, all 323 normative statements and all 31 fences re-checked after YAML round-trip: 0 verbatim failures, 0 locator failures with both start and end line inside the claimed section. All 23 tables byte-exact row by row. No spliced quotation and no recased quotation remains anywhere. The seven lowercase-prose constraints are genuinely lowercase and genuinely captured as inferred entries. Four findings fixed: the hyphenation defect was understated at three sites when six quoted sites exist and ten quotations healed the break silently (rule now stated in distilled/README.md); defect 5's Table comparison range was wrong (Table 15 is a parameter table); the §8 byte count said five for ten; state-machine.yaml cited R-0066 where the MUST NOT is R-0065; and the testable tally said 214/8 where the file holds 212/10. No artifact content was rewritten"
