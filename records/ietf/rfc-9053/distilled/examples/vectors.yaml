record: rfc-9053
reviewed_by: ""
vectors:
  - id: 'rfc-9053#V-0001'
    locator: '§8.3 (first example)'
    kind: 'capability structure'
    caption: 'Algorithm ES256'
    bytes: '0x8102'
    diagnostic: '/ [2 \ EC2 \ ] /'
    decodes_to: '[2] -- a one-element CBOR array holding the key type EC2. (OURS: decoded under RFC 8949 §3.1; 0x81 is array(1), 0x02 is the unsigned integer 2.)'
    expect: 'valid'
    notes: 'The §8.1 one-element algorithm capability: "the capabilities list is an array with one element, the key type". §8.3 explains the case it serves -- "Only an algorithm capability: This is useful if the protocol wants to require a specific algorithm, such as ES256, but it is agnostic about which curve is being used. This requires that the algorithm identifier be specified in the protocol." Note that the ES256 code point -7 does NOT appear in the bytes; §8 says "The algorithm identifier is not included in the capabilities data, as it should be encoded elsewhere in the message." The annotation delimiter is the document''s own `\ ... \` inside an outer `/ ... /`; RFC 8949 §8 diagnostic notation uses `/ ... /` for comments, so the inner backslash form is not standard notation. (OURS: the reading that the backslashes avoid closing the outer comment early.)'

  - id: 'rfc-9053#V-0002'
    locator: '§8.3 (second example)'
    kind: 'capability structure'
    caption: 'Key type EC2 with P-256 curve:'
    bytes: '0x820201'
    diagnostic: '/ [2 \ EC2 \, 1 \ P-256 \] /'
    decodes_to: '[2, 1] -- key type EC2 (2) and curve P-256 (1). (OURS: 0x82 is array(2), then 0x02 and 0x01.)'
    expect: 'valid'
    notes: 'The §10.1 Table 22 key-type capability for EC2, "[kty(2), crv]". §8.3: "Only a key type capability: This is useful if the protocol wants to require a specific key type and curve, such as P-256, but will accept any algorithm using that curve (e.g., both ECDSA and ECDH)." The positional encoding is the whole of the structure -- nothing in the bytes says that 2 is a key type and 1 a curve; §8 states the convention: "For a key, the first element should be the key type value. ... the key type is needed in order to understand the rest of the values."'

  - id: 'rfc-9053#V-0003'
    locator: '§8.3 (third example)'
    kind: 'capability structure'
    caption: 'ECDH-ES + A256KW with an X25519 curve:'
    bytes: '0x8101820104'
    diagnostic: '/ [1 \ OKP \],[1 \ OKP \, 4 \ X25519 \] /'
    decodes_to: 'TWO CBOR data items, not one: 0x8101 is [1] (the algorithm capability, OKP key type) and 0x820104 is [1, 4] (the key type capability, OKP with X25519). (OURS: decoded under RFC 8949 §3.1.)'
    expect: 'valid'
    notes: 'THE ONE EXAMPLE IN THIS DOCUMENT THAT CAN BREAK AN IMPLEMENTATION. §8.3 describes it as "the third example, which just concatenates the two capabilities together", and §8 as the case "where this is done by allowing for a cross product to be specified between an array of algorithm capabilities and key type capabilities (see the ECDH-ES+A25KW element)". The concatenation is a CBOR SEQUENCE: a decoder asked for one data item consumes 0x8101, returns [1], and leaves three bytes unread with no error. RFC 9053 never says the capability pair is a sequence, never gives it a containing array, and the comma in the annotation is the only sign that two items are present. §8 also misspells the algorithm as "ECDH-ES+A25KW" where Table 16 has ECDH-ES+A256KW (-31).'

  - id: 'rfc-9053#V-0004'
    locator: '§8.3 (fourth example)'
    kind: 'capability advertisement'
    caption: 'The decoded example below is one of many encodings that could be used for that purpose.'
    bytes: 'NONE PRINTED. The document gives this example in CBOR diagnostic notation only; there is no hex form, and this extraction does not supply one.'
    diagnostic: |
      [
       [-8 / EdDSA /,
         [1 / OKP key type /],
         [
           [1 / OKP /, 6 / Ed25519 / ],
           [1 /OKP/, 7 /Ed448 /]
         ]
       ],
       [-7 / ECDSA with SHA-256/,
         [2 /EC2 key type/],
         [
           [2 /EC2/, 1 /P-256/],
           [2 /EC2/, 3 /P-521/]
         ]
       ],
       [ -31 / ECDH-ES+A256KW/,
         [
           [ 2 /EC2/],
           [1 /OKP/ ]
         ],
         [
           [2 /EC2/, 1 /P-256/],
           [1 /OKP/, 4 / X25519/ ]
         ]
       ],
       [ 1 / A128GCM /,
         [ 4 / Symmetric / ],
         [ 4 / Symmetric /]
       ]
      ]
    decodes_to: 'A four-element array; each element is [alg, algorithm_capabilities, key_type_capabilities]. §8.3 reads it back itself: "The first element indicates that the entity supports EdDSA with curves Ed25519 and Ed448. ... The second element indicates that the entity supports ECDSA with SHA-256 with curves P-256 and P-521. ... The third element indicates that the entity supports Ephemeral-Static ECDH using AES256 key wrap. The entity can support the P-256 curve with an EC2 key type and the X25519 curve with an OKP key type. ... The last element indicates that the entity supports AES-GCM of 128 bits for content encryption." And: "The entity does not advertise that it supports any MAC algorithms."'
    expect: 'valid'
    notes: 'Lifted from the cached source, lines 1919-1948, by line range; the irregular spacing inside the comments (`[1 /OKP/, 7 /Ed448 /]`) is the document''s own. Explicitly NOT a registered structure: §8.3 calls it "one of many encodings that could be used for that purpose", and §8 describes its shape only as "Each array element includes three fields: the algorithm identifier, one or more algorithm capabilities, and one or more key type capabilities." Note the inconsistency with V-0001..V-0003: those three use `\ ... \` for the inner annotation and this one uses `/ ... /`, because here the whole item is diagnostic notation rather than a comment on a hex string. Note too that the third element''s algorithm capability is a nested array of arrays while the first two elements'' are flat -- the "one or more" of §8 appearing in two different shapes within one example, with no rule given for telling them apart.'

  - id: 'rfc-9053#V-0005'
    locator: '§9'
    kind: 'CBOR encoding'
    caption: 'the minimum possible length rule'
    bytes: '0x01'
    diagnostic: 'the integer 1'
    decodes_to: '1'
    expect: 'valid'
    counter_example_bytes: '0x1801'
    counter_example_expect: 'invalid'
    notes: 'The document''s own words: "Encoding MUST be done using definite lengths, and the length of the (encoded) argument MUST be the minimum possible length. This means that the integer 1 is encoded as "0x01" and not "0x1801"." Both byte strings are printed by the document, one as correct and one as incorrect -- the only valid/invalid pair in RFC 9053. SCOPE, which decides what this vector actually tests: §9''s first bullet is "The restriction applies to the encoding of the COSE_KDF_Context", so on the plain reading this rule binds COSE_KDF_Context and nothing else in this document. The identical §9 of RFC 9052 scopes the identical rule to "the Sig_structure, the Enc_structure, and the MAC_structure". (OURS: the inference that each document scopes the rule to its own structures.)'

  - id: 'rfc-9053#V-0006'
    locator: '§11'
    kind: 'padding illustration'
    caption: 'traffic analysis by message length'
    bytes: 'NONE. Text strings only.'
    diagnostic: '"YES" and "NO " -- against the unpadded "YES" and "NO"'
    decodes_to: 'Two text strings of equal length, 3 bytes each before CBOR framing. (OURS: the length count; the document states only that the padded pair is indistinguishable by length.)'
    expect: 'valid'
    notes: 'The document''s words: "An observer can distinguish between two different messages (for example, "YES" and "NO") based on the length for all of the content encryption algorithms that are defined in this document. This means that it is up to the applications to document how content padding is to be done in order to prevent or discourage such analysis. (For example, the text strings could be defined as "YES" and "NO ".)" Included because it is a concrete printed example, not because it is a test vector: it bears only on the content encryption algorithms, which an export-only signing profile never uses. The substantive point for any profile is the preceding sentence -- "This specification does not provide a uniform method for providing padding as part of the message structure."'
