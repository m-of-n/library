  # -------------------------------------------------------------------
  # Shared ECDH key checks, §6.3.1 and §6.4.1, identical in both:
  #   kty MUST be present and MUST be "EC2" or "OKP";
  #   alg, if present, MUST match the key agreement algorithm;
  #   key_ops, if present, MUST include "derive key" or "derive bits"
  #     for the private key;
  #   key_ops, if present, MUST BE EMPTY for the public key.
  # §6.3.1 also: "This document defines these algorithms to be used with
  # the curves P-256, P-384, P-521, X25519, and X448. Implementations
  # MUST verify that the key type and curve are correct. Different
  # curves are restricted to different key types. Implementations MUST
  # verify that the curve and algorithm are appropriate for the entities
  # involved."
  # -------------------------------------------------------------------

  - name: alg-ecdh-es-hkdf-256
    locator: "§6.3.1 (Table 14)"
    encoding: CBOR
    fields:
      - name: alg
