# =====================================================================
# rfc-9053 structures and algorithms.
#
# RFC 9053 defines no messages. Its messages are RFC 9052's. What it
# defines is (a) a handful of CBOR structures and (b) 43 algorithm code
# points with the key type, curve, sizes and header parameters each one
# requires. Both are captured here: the twelve structures first, in
# source order, then every algorithm, in source order.
#
# An algorithm is treated as a structure whose `fields` are the things
# an implementation must get right to use it: the `alg` value itself,
# the key type and curve it demands, key / nonce / tag sizes, and the
# header parameters it uses. `required` is read against the document's
# own "When using a COSE key for this algorithm, the following checks
# are made" bullets, which differ between algorithms in ways the
# summary tables hide -- EdDSA requires `crv`, ECDSA does not.
#
# CBOR head bytes marked (OURS) are computed by this library under
# RFC 8949 section 3.1. RFC 9053 prints decimal code points only and
# prints no byte encoding of any algorithm identifier anywhere.
#
# QUOTATION RULE. Text inside double quotes is contiguous in the source
# and copied exactly; an ellipsis (...) marks elided text between two
# contiguous spans. Table DESCRIPTION-column text is NOT quoted: those
# cells wrap down three or four physical lines, so reassembling one
# reads as a quotation while being a splice. Such text is marked
# "glossed not quoted" and given in lower case.
#
# ONE EXCEPTION, added by pass 2 because pass 1 took it silently. The
# plain-text rendering breaks 14 lines at a hyphen that belongs to the
# token. Five quotations in this file cross such a break and HEAL it,
# joining the halves with no space: "recipient-specific" (section 4.2.1,
# source L656), "IV-GENERATION" (section 6.1.2, L1263, twice; and
# section 8.1, L1835) and "Leading-zero" (section 7.1.1, L1690). They
# are verbatim against the RFC and NOT contiguous substrings of the
# cached plain text. requirements.yaml takes the opposite choice and
# cuts the quote at the break; see distilled/README.md defect 3 for the
# rule and the full list of sites.
#
# `constrained_by`: COMPLETED, cross-check pass, 2026-10-19. All 300
# fields of the 56 structures below now carry the key. 279 of them hold
# 709 links to 170 of the 222 entries in ../requirements.yaml; the other
# 21 hold an explicit empty list and a `constrained_by_note` saying why.
# Pass 1 omitted the key everywhere, because requirements.yaml was being
# written in parallel by another agent and the ids could not be known
# without inventing them; pass 1 left the section locators exact and
# named them the join key, and that is the key this pass joined on.
#
# THE LINKING RULE, stated so a reviewer can disagree with one link
# rather than with the whole table. A requirement R is linked to a field
# F of structure S iff either
#
#   (i)  R DECIDES F - R's own text fixes F's value, its presence, its
#        length or its encoding; or
#   (ii) R NAMES F'S SUBJECT - F models exactly the thing R governs: a
#        named COSE member, a header parameter label, a positional
#        element of an array, or an algorithm property (key, nonce, tag,
#        IV, KDF, key wrap) that the tables and prose fix per code point.
#
# Five corollaries decide the hard cases:
#
#  (a) A SECTION'S KEY-CHECK BULLETS REACH EVERY CODE POINT THAT SECTION
#      DEFINES. RFC 9053 writes "When using a COSE key for this
#      algorithm, the following checks are made" once per section and
#      then tabulates two to eight algorithms under it. So R-0011..R-0015
#      are linked on all three ES* structures, R-0037..R-0042 on all four
#      HMAC structures, R-0071..R-0076 on all eight AES-CCM structures,
#      and so on. This is why the link count is large: the document
#      repeats itself 43 times and so must the join.
#
#  (b) A TABLE CELL WITH NO SENTENCE BEHIND IT GETS NO LINK. Tag lengths
#      for untruncated HMAC, for AES-MAC and for ChaCha20/Poly1305 are
#      Description-column values that no prose sentence restates; their
#      fields carry `[]` and say so. Contrast AES-GCM, where R-0056
#      fixes the tag in prose and is linked.
#
#  (c) A RULE ON THE ENCODING OF A NAMED STRUCTURE IS LINKED TO THAT
#      STRUCTURE'S FIELDS AND NOWHERE ELSE. Section 9's three entries
#      (R-0206 scope, R-0207 definite lengths, R-0208 minimum argument)
#      name COSE_KDF_Context, so they sit on all five `cose-kdf-context`
#      fields. They are NOT repeated on `party-info`, which reaches them
#      only by being spliced in, and not on any message structure, since
#      Section 9 scopes itself away from those (see ../README.md).
#
#  (d) A STATEMENT THAT REACHES EVERY ALGORITHM ALIKE IS LINKED NOWHERE.
#      R-0214 ("keys be restricted to a single algorithm"), R-0216 and
#      R-0218 are Section 11 policy that would otherwise add 86 links
#      saying nothing. R-0217 is the exception and IS linked, because it
#      names two key types by name - "Do not use an "EC2" key where an
#      "OKP" key is expected" - so it lands on cose-key-ec2.kty and
#      cose-key-okp.kty.
#
#  (e) A CEILING WITH NO CARRIER IS NOT A FIELD. The 2^32 / 2^61 limits
#      and every advisory threshold constrain a counter that no COSE
#      structure carries; they are linked to nothing on purpose. See
#      group 1 below, and ../state-machine.yaml, which is where they do
#      their work.
#
# THE 52 UNLINKED REQUIREMENTS, enumerated so the absence is checkable
# rather than assumed. Every field any of them names exists either in
# this file or in ../schema/ - cross-check 1 found no requirement naming
# a field that exists nowhere.
#
#   1. KEY-USAGE CEILINGS AND THRESHOLDS, no carrier field (11): R-0065,
#      R-0066, R-0067, R-0068, R-0079, R-0080, R-0081, R-0082, R-0083,
#      R-0094, R-0095. COSE carries no sequence number and no usage
#      counter, so an implementation told not to exceed 2^32 messages has
#      no field in which to track it. This is the gap recorded in
#      ../state-machine.yaml.
#
#   2. KEY LIFECYCLE DUTIES (8): R-0119, R-0120, R-0130, R-0131, R-0142
#      (rotation of keys and shared secrets, with no period, counter or
#      responsible party named), R-0132 (no perfect forward secrecy),
#      R-0169 (proof of possession on untrusted -> trusted), R-0222 (in a
#      group, no single entity can trigger the rekey). Also
#      ../state-machine.yaml.
#
#   3. CONSTRAIN `key_ops` OR THE IV, WHICH RFC 9052 OWNS (15): R-0040,
#      R-0041, R-0049, R-0050, R-0061, R-0062, R-0075, R-0076, R-0090,
#      R-0091, R-0164, R-0165, R-0175, R-0176 (key_ops, label 4) and
#      R-0124 (a new IV per message, label 5). The boundary stated at the
#      top of this file keeps labels 1-6 and the COSE_Key common
#      parameters out, so this file models `key_ops` only on the six
#      structures where the per-algorithm bullet was carried as a field.
#      The field itself is NOT missing from the extraction: it is
#      ../schema/key-structures.derived.cddl's
#      COSE_Key_Common_Parameters_9052, `? 4 => [+ (int / tstr)]`. An
#      asymmetry in this file worth fixing the next time it is extended -
#      it is not a hole in the record.
#
#   4. COMPUTATION STEPS WHOSE VALUES NEVER REACH A COSE STRUCTURE (8):
#      R-0002 (random number quality when creating a private key),
#      R-0033 (HMAC inner and outer padding), R-0051, R-0052, R-0053
#      (one AES-CBC-MAC key per message length, and no key shared with
#      CBC encryption), R-0143, R-0144, R-0145 (turning the ECDH computed
#      secret into the shared secret). Nothing in these sentences is
#      transmitted; they constrain what an implementation does, not what
#      it encodes.
#
#   5. ENCODING POLICY BINDING EVERY MAP, NOT ONE FIELD (3): R-0209,
#      R-0210, R-0211 - the duplicate-label MUST NOTs of Section 9. No
#      single field is "the label", and linking them to all 300 fields
#      would say nothing.
#
#   6. POLICY, RATIONALE AND REFUSALS THAT NAME NO STRUCTURE (6):
#      R-0168 (why both parties' public keys are not fed to the KDF),
#      R-0214, R-0216, R-0218 (key/algorithm binding and the trust
#      decision), R-0220, R-0221 (padding is the application's job).
#
#   7. ABOUT THE REGISTRY PROCESS, NOT ABOUT A MESSAGE (1): R-0213
#      (Standards Action needs a Standards Track or BCP RFC).
#
# Boundary: labels 1 (alg), 2 (crit), 3 (content type), 4 (kid),
# 5 (IV), 6 (Partial IV) and the generic COSE_Key common parameters are
# RFC 9052 section 3.1 and section 7, NOT RFC 9053. Where an algorithm
# needs one, it is named as RFC 9052's.
#
# Source: RFC 9053, cached source sha256
#   3d470615875620375f8453ba25b8dce7e4d0271e76b0b79a46df34ccb2d56ab0
# =====================================================================
record: rfc-9053
reviewed_by: ""
messages:

  # ===================================================================
  # Part 1 -- structures
  # ===================================================================

  - name: ecdsa-signature-value
    locator: "§2.1"
    encoding: CBOR
    fields:
      - name: r
        type: 'byte string (unsigned integer, big-endian)'
        required: true
        constrained_by:
          - "rfc-9053#R-0008"
          - "rfc-9053#R-0009"
          - "rfc-9053#R-0010"
        layout: 'I2OSP(R, n) where n = ceiling(key_length / 8). "The length is rounded up to the nearest byte and is left padded with zero bits to get to the correct length."'
      - name: s
        type: 'byte string (unsigned integer, big-endian)'
        required: true
        constrained_by:
          - "rfc-9053#R-0008"
          - "rfc-9053#R-0009"
          - "rfc-9053#R-0010"
        layout: 'I2OSP(S, n), same n as r.'
    layout: 'A single CBOR bstr holding r || s, no separator, no ASN.1, no DER. The RFC prints the formula "Signature = I2OSP(R, n) | I2OSP(S, n)" / "where n = ceiling(key_length / 8)" and prints NO sizes. Applying the formula to the three curves the section admits gives n = 32 / 48 / 66 and total signature lengths of 64 / 96 / 132 bytes for P-256 / P-384 / P-521 (OURS -- arithmetic, not printed by the document).'
    notes: 'The 132-byte P-521 case is the one implementations get wrong: ceiling(521/8) = 66, not 64 and not 65. The document does not warn about it. Nothing here is a CBOR tag or an ASN.1 SEQUENCE -- an exporter that hands COSE a DER-encoded ECDSA signature from a general-purpose crypto library produces an invalid COSE signature that most verifiers will reject with no diagnostic.'

  - name: eddsa-signature-value
    locator: "§2.2"
    encoding: CBOR
    fields:
      - name: signature
        type: 'byte string'
        required: true
        constrained_by: []
        constrained_by_note: >-
          Nothing. Section 2.2 delegates the entire encoding: "[RFC8032]
          describes the method of encoding the signature value." No sentence
          in RFC 9053 constrains these bytes, which is the asymmetry against
          ecdsa-signature-value, where Section 2.1 gives the formula. The
          EdDSA statements that DO exist constrain the variant
          (R-0019..R-0022) and the signing/verifying operation (R-0031,
          R-0032), and are linked there.
        layout: 'Per RFC 8032. RFC 9053 states no length and no internal layout.'
    layout: 'A single CBOR bstr. The whole of what RFC 9053 says is: "[RFC8032] describes the method of encoding the signature value."'
    notes: 'DEFECT for an extraction that wants self-contained fixtures: unlike ECDSA, where section 2.1 gives the encoding in full, the EdDSA signature encoding is entirely by reference. Any byte length stated for Ed25519 or Ed448 is quoted from RFC 8032 and must not be attributed to RFC 9053. Also from section 2.2: "For EdDSA, the content to be signed (either the message or the prehash value) is processed twice inside of the signature algorithm" -- two passes over the payload, which matters for large payloads.'

  - name: party-info
    locator: "§5.2"
    encoding: CBOR
    fields:
      - name: identity
        type: 'bstr / nil'
        required: true
        constrained_by:
          - "rfc-9053#R-0106"
          - "rfc-9053#R-0107"
          - "rfc-9053#R-0108"
        layout: 'Position 0. "The identity information does not need to be specified and is set to nil in that case." Carried in the message, if at all, by the PartyU/PartyV identity header parameters (-21 / -24).'
      - name: nonce
        type: 'bstr / int / nil'
        required: true
        constrained_by:
          - "rfc-9053#R-0106"
          - "rfc-9053#R-0109"
        layout: 'Position 1. "This option does not need to be specified; if not needed, it is set to nil." Carried by the PartyU/PartyV nonce header parameters (-22 / -25).'
      - name: other
        type: 'bstr / nil'
        required: true
        constrained_by:
          - "rfc-9053#R-0106"
          - "rfc-9053#R-0110"
        layout: 'Position 2. "This contains other information that is defined by the protocol. This option does not need to be specified; if not needed, it is set to nil."'
    layout: 'A CDDL group of three positional entries, spliced into COSE_KDF_Context inside its own array: "PartyUInfo : [ PartyInfo ]". All three are PRESENT ALWAYS -- unused elements are nil, not absent. The document is explicit that order is fixed: "The elements of PartyUInfo are encoded in the order presented below."'
    notes: 'The only structure in RFC 9053 that ships as CDDL (schema/kdf-context.cddl, verbatim). Note that the CDDL alone does not say the unused elements are nil rather than omitted; that is the section 5.2 prose, and a CDDL-only reading admits a shorter array.'

  - name: cose-kdf-context
    locator: "§5.2"
    encoding: CBOR
    fields:
      - name: algorithm_id
        type: 'int / tstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0105"
          - "rfc-9053#R-0125"
          - "rfc-9053#R-0206"
          - "rfc-9053#R-0207"
          - "rfc-9053#R-0208"
        layout: 'Position 0. "The values are from the "COSE Algorithms" registry. This field is required to be present." Normally a key wrap or content encryption algorithm identifier; also 34 (IV-GENERATION) when the KDF is generating an IV (§6.1.2).'
      - name: party_u_info
        type: '[ PartyInfo ]'
        required: true
        constrained_by:
          - "rfc-9053#R-0103"
          - "rfc-9053#R-0106"
          - "rfc-9053#R-0206"
          - "rfc-9053#R-0207"
          - "rfc-9053#R-0208"
        layout: 'Position 1. A 3-element array. "Unless the application protocol defines differently, we assign PartyU to the entity that is creating the message".'
      - name: party_v_info
        type: '[ PartyInfo ]'
        required: true
        constrained_by:
          - "rfc-9053#R-0103"
          - "rfc-9053#R-0111"
          - "rfc-9053#R-0206"
          - "rfc-9053#R-0207"
          - "rfc-9053#R-0208"
        layout: 'Position 2. A 3-element array. PartyV is "the entity that is receiving the message". "By defining this association, different keys will be derived for each direction".'
      - name: supp_pub_info
        type: '[ keyDataLength: uint, protected: empty_or_serialized_map, ? other: bstr ]'
        required: true
        constrained_by:
          - "rfc-9053#R-0112"
          - "rfc-9053#R-0113"
          - "rfc-9053#R-0114"
          - "rfc-9053#R-0155"
          - "rfc-9053#R-0171"
          - "rfc-9053#R-0206"
          - "rfc-9053#R-0207"
          - "rfc-9053#R-0208"
        layout: 'Position 3. keyDataLength "is set to the number of bits of the desired output value". protected "contains the protected parameter field. If there are no elements in the "protected" field, then use a zero-length bstr." other is "free-form data defined by the application", optional.'
      - name: supp_priv_info
        type: 'bstr'
        required: false
        constrained_by:
          - "rfc-9053#R-0115"
          - "rfc-9053#R-0206"
          - "rfc-9053#R-0207"
          - "rfc-9053#R-0208"
        layout: 'Position 4, optional. "mutually known private information. An example of this information would be a pre-existing shared secret."'
    layout: 'CBOR array of 4 or 5 elements. This is the ONE structure in COSE that RFC 9053 §9 requires to be deterministically encoded: "The restriction applies to the encoding of the COSE_KDF_Context." It is never transmitted -- it is the input to HKDF, built independently by both parties, which is why byte agreement is load-bearing here and nowhere else in this document.'
    notes: 'Based on SP 800-56A. §5.2 argues the CBOR advantage over JOSE explicitly: "By using CBOR for the encoding of the context information structure, we automatically get the same type and length separation of fields that is obtained by the use of ASN.1. This means that there is no need to encode the lengths for the base elements, as it is done by the encoding used in JSON Object Signing and Encryption (JOSE) (Section 4.6.2 of [RFC7518])." AMBIGUITY: `empty_or_serialized_map` is used and never defined in RFC 9053; it is RFC 9052 §3.'

  - name: cose-key-ec2
    locator: "§7.1.1 (Table 19)"
    encoding: CBOR
    fields:
      - name: kty
        type: 'int / tstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0177"
          - "rfc-9053#R-0178"
          - "rfc-9053#R-0179"
          - "rfc-9053#R-0217"
        layout: 'Label 1 (RFC 9052 §7). Value 2 for EC2 (§7 Table 17). CBOR 0x01 => 0x02 (OURS).'
      - name: crv
        type: 'int / tstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0178"
          - "rfc-9053#R-0180"
        layout: 'Label -1 (CBOR 0x20, OURS). Table 19 Description column, glossed not quoted (the cell wraps): EC identifier, taken from the "COSE Elliptic Curves" registry. P-256 = 1, P-384 = 2, P-521 = 3 (Table 18). REQUIRED in both the public and private forms.'
      - name: x
        type: 'bstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0166"
          - "rfc-9053#R-0181"
          - "rfc-9053#R-0182"
          - "rfc-9053#R-0187"
          - "rfc-9053#R-0189"
        layout: 'Label -2 (CBOR 0x21, OURS). "This contains the x-coordinate for the EC point. The integer is converted to a byte string as defined in [SEC1]. Leading-zero octets MUST be preserved." REQUIRED for public keys; RECOMMENDED but omittable for private keys.'
      - name: y
        type: 'bstr / bool'
        required: true
        constrained_by:
          - "rfc-9053#R-0166"
          - "rfc-9053#R-0183"
          - "rfc-9053#R-0184"
          - "rfc-9053#R-0185"
          - "rfc-9053#R-0186"
          - "rfc-9053#R-0187"
          - "rfc-9053#R-0189"
        layout: 'Label -3 (CBOR 0x22, OURS). Two encodings in one label: the full y-coordinate as a SEC1 bstr with leading zeros preserved, OR point compression as a CBOR bool -- "If the sign bit is zero, then encode y as a CBOR false value; otherwise, encode y as a CBOR true value." "The encoding of the infinity point is not supported." REQUIRED for public keys; RECOMMENDED but omittable for private keys.'
      - name: d
        type: 'bstr'
        required: false
        constrained_by:
          - "rfc-9053#R-0188"
        layout: 'Label -4 (CBOR 0x23, OURS). "This contains the private key." REQUIRED for private keys, absent from public keys.'
    layout: 'A COSE_Key map (RFC 9052 §7) with kty = 2. Public form: crv, x, y REQUIRED. Private form: crv, d REQUIRED, with x and y RECOMMENDED "but they can be recomputed from the required elements, and omitting them saves on space". A bool at label -3 is NOT a type error -- it is compressed point encoding, and a validator that types -3 as bstr alone rejects conforming keys.'
    notes: '§7.1: "Applications MUST check that the curve and the key type are consistent and reject a key if they are not." §7.1.1 notes the IPR history behind compressed points: "The latter encoding has not been recommended by the IETF due to potential IPR issues. However, for operations in constrained environments, the ability to shrink a message by not sending the y-coordinate is potentially useful." Point validation IS possible for EC2 -- §6.3.1.1: "For the "EC2" key format, this can be done by checking that the x and y values form a point on the curve."'

  - name: cose-key-okp
    locator: "§7.2 (Table 20)"
    encoding: CBOR
    fields:
      - name: kty
        type: 'int / tstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0177"
          - "rfc-9053#R-0178"
          - "rfc-9053#R-0190"
          - "rfc-9053#R-0217"
        layout: 'Label 1 (RFC 9052 §7). Value 1 for OKP (§7 Table 17). CBOR 0x01 => 0x01 (OURS).'
      - name: crv
        type: 'int / tstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0178"
          - "rfc-9053#R-0191"
        layout: 'Label -1. X25519 = 4, X448 = 5, Ed25519 = 6, Ed448 = 7 (Table 18). REQUIRED in both forms.'
      - name: x
        type: 'bstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0030"
          - "rfc-9053#R-0167"
          - "rfc-9053#R-0192"
          - "rfc-9053#R-0193"
          - "rfc-9053#R-0195"
        layout: 'Label -2. "This contains the public key. The byte string contains the public key as defined by the algorithm. (For X25519, internally it is a little-endian integer.)" REQUIRED for public keys; RECOMMENDED but omittable for private keys. §10.3: IANA changed this row''s registry description to "Public Key".'
      - name: d
        type: 'bstr'
        required: false
        constrained_by:
          - "rfc-9053#R-0194"
        layout: 'Label -4. "This contains the private key." REQUIRED for private keys.'
    layout: 'A COSE_Key map with kty = 1. THERE IS NO y AND NO LABEL -3. Public form: crv, x. Private form: crv, d (+ optional x). Label -3 in an OKP key is undefined by this document.'
    notes: '§7.2 warns against reading the name: "Do not assume that keys using this type are elliptic curves. This key type could be used for other curve types (for example, mathematics based on hyper-elliptic surfaces)." Two hazards the document states and does not solve: (1) §6.3.1.1 -- "For the "OKP" format, there is no simple way to perform point validation." (2) §2.2.1 -- "Public values are computed differently in EdDSA and Elliptic Curve Diffie-Hellman (ECDH); for this reason, the public key from one should not be used with the other algorithm." Nothing in the key structure enforces (2) except `crv`: Table 18 binds 4/5 to ECDH and 6/7 to EdDSA, and `crv` is the only field that distinguishes an Ed25519 key from an X25519 key of the same length.'

  - name: cose-key-symmetric
    locator: "§7.3 (Table 21)"
    encoding: CBOR
    fields:
      - name: kty
        type: 'int / tstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0177"
          - "rfc-9053#R-0196"
        layout: 'Label 1 (RFC 9052 §7). Value 4 for Symmetric (§7 Table 17). CBOR 0x01 => 0x04 (OURS).'
      - name: k
        type: 'bstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0197"
          - "rfc-9053#R-0198"
        layout: 'Label -1 (CBOR 0x20, OURS). "This contains the value of the key." REQUIRED.'
    layout: 'A COSE_Key map with kty = 4 and exactly one key-type member. Note the label collision: -1 is `k` here and `crv` in both other key types.'
    notes: '§7.3: "This key structure does not have a form that contains only public members. As it is expected that this key structure is going to be transmitted, care must be taken that it is never transmitted accidentally or insecurely." No key length is constrained by the structure -- length is constrained per algorithm (Tables 4, 5, 6, 7, 13) and by §3.1''s rule that a derived HMAC key MUST match the hash output size.'

  - name: hkdf-header-parameters
    locator: "§5.1 (Table 9)"
    encoding: CBOR
    fields:
      - name: salt
        type: 'bstr'
        required: false
        constrained_by:
          - "rfc-9053#R-0096"
          - "rfc-9053#R-0097"
          - "rfc-9053#R-0102"
          - "rfc-9053#R-0122"
          - "rfc-9053#R-0123"
          - "rfc-9053#R-0149"
          - "rfc-9053#R-0150"
          - "rfc-9053#R-0151"
        layout: 'Label -20 (CBOR 0x33, OURS). "Random salt". Applies to exactly fourteen algorithms, which Table 9 lists: direct+HKDF-SHA-256, direct+HKDF-SHA-512, direct+HKDF-AES-128, direct+HKDF-AES-256, ECDH-ES+HKDF-256, ECDH-ES+HKDF-512, ECDH-SS+HKDF-256, ECDH-SS+HKDF-512, ECDH-ES+A128KW, ECDH-ES+A192KW, ECDH-ES+A256KW, ECDH-SS+A128KW, ECDH-SS+A192KW, ECDH-SS+A256KW.'
    layout: 'One entry in a recipient structure header map. §5.1: "This parameter is protected by being included in the key computation and does not need to be separately authenticated. The salt value does not need to be unique for every message sent."'
    notes: 'Optional in the table, but §6.1.2 and §6.3.1 both make it conditionally mandatory: "Either the "salt" parameter for HKDF (Table 9) or the "PartyU nonce" parameter for the context structure (Table 10) MUST be present (both can be present if desired)." §5.1 on length: "While [RFC5869] suggests that the length of the salt be the same as the length of the underlying hash value, any positive salt length will improve the security".'

  - name: context-header-parameters
    locator: "§5.2 (Table 10)"
    encoding: CBOR
    fields:
      - name: partyu_identity
        type: 'bstr'
        required: false
        constrained_by:
          - "rfc-9053#R-0104"
          - "rfc-9053#R-0107"
        layout: 'Label -21 (CBOR 0x34, OURS). Table 10 Description column, glossed not quoted (the cell wraps): PartyU identity information.'
      - name: partyu_nonce
        type: 'bstr / int'
        required: false
        constrained_by:
          - "rfc-9053#R-0104"
          - "rfc-9053#R-0122"
          - "rfc-9053#R-0123"
          - "rfc-9053#R-0149"
          - "rfc-9053#R-0150"
          - "rfc-9053#R-0151"
        layout: 'Label -22 (CBOR 0x35, OURS). Table 10 Description column, glossed: PartyU provided nonce. The only parameter in this table with a two-type union.'
      - name: partyu_other
        type: 'bstr'
        required: false
        constrained_by:
          - "rfc-9053#R-0104"
        layout: 'Label -23 (CBOR 0x36, OURS). Table 10 Description column, glossed: PartyU other provided information.'
      - name: partyv_identity
        type: 'bstr'
        required: false
        constrained_by:
          - "rfc-9053#R-0104"
          - "rfc-9053#R-0107"
        layout: 'Label -24 (CBOR 0x37, OURS). Table 10 Description column, glossed: PartyV identity information.'
      - name: partyv_nonce
        type: 'bstr / int'
        required: false
        constrained_by:
          - "rfc-9053#R-0104"
        layout: 'Label -25 (CBOR 0x3818, OURS). Table 10 Description column, glossed: PartyV provided nonce. NOTE: -25 is also the `alg` VALUE ECDH-ES+HKDF-256 (Table 14).'
      - name: partyv_other
        type: 'bstr'
        required: false
        constrained_by:
          - "rfc-9053#R-0104"
        layout: 'Label -26 (CBOR 0x3819, OURS). Table 10 Description column, glossed: PartyV other provided information. NOTE: -26 is also the `alg` VALUE ECDH-ES+HKDF-512 (Table 14).'
    layout: 'Six entries in a recipient structure header map; the same fourteen algorithms as Table 9. Each one feeds the corresponding positional slot of PartyUInfo / PartyVInfo in COSE_KDF_Context.'
    notes: '§5.2 places them deliberately: "These header parameters are designed to be placed in the unprotected bucket of the recipient structure; they do not need to be in the protected bucket, since they are already included in the cryptographic computation by virtue of being included in the context structure." §5.2 also asks for validation the structure cannot enforce: "If identity information is carried in the message, applications SHOULD have a way of validating the supplied identity information."'

  - name: ecdh-header-parameters
    locator: "§6.3.1 (Table 15)"
    encoding: CBOR
    fields:
      - name: ephemeral_key
        type: 'COSE_Key'
        required: true
        constrained_by:
          - "rfc-9053#R-0146"
          - "rfc-9053#R-0147"
          - "rfc-9053#R-0166"
          - "rfc-9053#R-0167"
        layout: 'Label -1 (CBOR 0x20, OURS). Table 15 Description column, glossed not quoted (the cell wraps): ephemeral public key for the sender. Table 15 scopes it to ECDH-ES+HKDF-256, ECDH-ES+HKDF-512, ECDH-ES+A128KW, ECDH-ES+A192KW, ECDH-ES+A256KW. §6.3.1: it "MUST be present for all algorithm identifiers that use ephemeral keys". NOTE: -1 is also `crv` / `k` in a COSE_Key map.'
      - name: static_key
        type: 'COSE_Key'
        required: false
        constrained_by:
          - "rfc-9053#R-0152"
          - "rfc-9053#R-0166"
          - "rfc-9053#R-0167"
        layout: 'Label -2 (CBOR 0x21, OURS). Table 15 Description column, glossed: static public key for the sender. Scoped to the five ECDH-SS identifiers. NOTE: -2 is also `x` in a COSE_Key map.'
      - name: static_key_id
        type: 'bstr'
        required: false
        constrained_by:
          - "rfc-9053#R-0152"
        layout: 'Label -3 (CBOR 0x22, OURS). Table 15 Description column, glossed: static public key identifier for the sender. Scoped to the five ECDH-SS identifiers. NOTE: -3 is also `y` in an EC2 COSE_Key map.'
    layout: 'Up to three entries in a recipient structure header map. A nested COSE_Key as a header VALUE -- the only place in RFC 9053 where a header parameter carries a whole key structure.'
    notes: '§6.3.1 on static keys: "the static key should be identified to the recipient. The static key can be identified by providing either the key ("static key") or a key identifier for the static key ("static key id")." Lowercase "should", and the document never says the identifier is RFC 9052''s `kid`, nor how it is computed. DEFECT: a `bstr` identifier with no stated derivation is unverifiable -- see rfc-9679 (COSE Key Thumbprint) in this lane for the mechanism COSE later gave it.'

  - name: algorithm-capabilities
    locator: "§8, §8.1, §10.2"
    encoding: CBOR
    fields:
      - name: kty
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0199"
          - "rfc-9053#R-0200"
          - "rfc-9053#R-0201"
          - "rfc-9053#R-0202"
          - "rfc-9053#R-0203"
          - "rfc-9053#R-0205"
        layout: 'Position 0, the only element for every algorithm registered at the time of writing. §8.1: "the capabilities list is an array with one element, the key type (from the "COSE Key Types" Registry)."'
    layout: 'A CBOR array. §8.1 scopes the one-element form to "the current set of algorithms in the registry other than IV-GENERATION (those in this document as well as those in [RFC8230], [RFC8778], and [RFC9021])", and §10.2 confirms the registry column "has been populated with "[kty]" for all current, nonprovisional registrations". IV-GENERATION''s column "is to be empty". Future registrations "could have zero, one, or multiple elements".'
    notes: '§8 excludes the algorithm identifier itself: "The algorithm identifier is not included in the capabilities data, as it should be encoded elsewhere in the message." And it excludes key-specific items: "the items that are specific to a key (for example, a curve) should not be included in the algorithm capabilities. This means that if one wishes to enumerate all of the capabilities for a device that implements ECDH, it requires that all of the combinations of algorithms and key pairs be specified."'

  - name: key-type-capabilities
    locator: "§8.2, §10.1 (Table 22)"
    encoding: CBOR
    fields:
      - name: kty
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0200"
          - "rfc-9053#R-0201"
          - "rfc-9053#R-0202"
          - "rfc-9053#R-0204"
        layout: 'Position 0 always. §8: "For a key, the first element should be the key type value. While this means that the key type value will be duplicated if both an algorithm and key capability are used, the key type is needed in order to understand the rest of the values."'
      - name: crv
        type: 'int'
        required: false
        constrained_by:
          - "rfc-9053#R-0201"
          - "rfc-9053#R-0202"
          - "rfc-9053#R-0203"
        layout: 'Position 1 for kty 1 (OKP) and 2 (EC2) only. §8.2: "One curve for that key type from the "COSE Elliptic Curves" registry." ONE curve, not a list -- enumerating a device''s curves means one capability array per curve.'
      - name: hash_algorithm
        type: 'int'
        required: false
        constrained_by:
          - "rfc-9053#R-0201"
          - "rfc-9053#R-0202"
        layout: 'Position 1 for kty 5 (HSS-LMS) only. §8.2: "Algorithm identifier for the underlying hash function from the "COSE Algorithms" registry."'
      - name: n_value
        type: 'uint'
        required: false
        constrained_by:
          - "rfc-9053#R-0201"
          - "rfc-9053#R-0202"
        layout: 'Position 1 for kty 6 (WalnutDSA) only. §8.2: "The N value (group and matrix size) for the key, a uint."'
      - name: q_value
        type: 'uint'
        required: false
        constrained_by:
          - "rfc-9053#R-0201"
          - "rfc-9053#R-0202"
        layout: 'Position 2 for kty 6 (WalnutDSA) only. §8.2: "The q value (finite field order) for the key, a uint."'
    layout: 'Six shapes, per §10.1 Table 22 as printed: 1 OKP [kty(1), crv]; 2 EC2 [kty(2), crv]; 3 RSA [kty(3)]; 4 Symmetric [kty(4)]; 5 HSS-LMS [kty(5), hash algorithm]; 6 WalnutDSA [kty(6), N value, q value]. Positional, with no discriminator other than position 0.'
    notes: '§8 makes the list immutable on registration: "Once defined by registration with IANA, the list of capabilities for an algorithm or key type is immutable. If it is later found that a new capability is needed for a key type or algorithm, it will require that a new code point be assigned to deal with that." Table 22 covers kty 3, 5 and 6, which RFC 9053 itself does not define -- they come from RFC 8230, RFC 8778 and RFC 9021. The S/MIME ancestor is named in §8: SMIMECapabilities, RFC 8551 §2.5.2.'

  # ===================================================================
  # Part 2 -- signature algorithms (§2)
  #
  # Shared key checks, §2.1, for all three ECDSA identifiers:
  #   "The "kty" field MUST be present, and it MUST be "EC2"."
  #   "If the "alg" field is present, it MUST match the ECDSA signature
  #    algorithm being used."
  #   "If the "key_ops" field is present, it MUST include "sign" when
  #    creating an ECDSA signature."
  #   "If the "key_ops" field is present, it MUST include "verify" when
  #    verifying an ECDSA signature."
  # Note what is NOT among them: no requirement that `crv` be present.
  # ===================================================================

  - name: alg-es256
    locator: "§2.1 (Table 1)"
    encoding: CBOR
    fields:
      - name: alg
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0013"
          - "rfc-9053#R-0018"
        layout: 'Value -7. CBOR 0x26 (OURS). Carried in the `alg` header parameter, RFC 9052 §3.1 label 1. Protected bucket, per §2.1.1.'
      - name: kty
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0005"
          - "rfc-9053#R-0006"
          - "rfc-9053#R-0011"
          - "rfc-9053#R-0012"
        layout: 'MUST be 2 (EC2). "This document requires that the curves be encoded using the "EC2" (two coordinate elliptic curve) key type."'
      - name: crv
        type: 'int'
        required: false
        constrained_by:
          - "rfc-9053#R-0004"
          - "rfc-9053#R-0006"
          - "rfc-9053#R-0007"
          - "rfc-9053#R-0017"
        layout: 'One of 1 (P-256), 2 (P-384), 3 (P-521) -- the document "defines ECDSA as working only with the curves P-256, P-384, and P-521". P-256 is SUGGESTED, lowercase, not required: "In order to promote interoperability, it is suggested that SHA-256 be used only with curve P-256". §2.1''s key-check bullets do not require `crv` to be present at all; §7.1.1 does, for the key structure.'
      - name: hash
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0003"
          - "rfc-9053#R-0007"
          - "rfc-9053#R-0016"
          - "rfc-9053#R-0018"
        layout: 'SHA-256, fixed by the identifier. "In the event that the length of the hash function output is greater than the group of the key, the leftmost bytes of the hash output are used."'
      - name: signature
        type: 'bstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0001"
          - "rfc-9053#R-0008"
          - "rfc-9053#R-0009"
          - "rfc-9053#R-0010"
        layout: 'I2OSP(R, n) | I2OSP(S, n). With P-256, n = 32 and the signature is 64 bytes (OURS -- from the §2.1 formula; no size is printed).'
      - name: key_ops
        type: '[+ int / tstr]'
        required: false
        constrained_by:
          - "rfc-9053#R-0014"
          - "rfc-9053#R-0015"
        layout: 'If present MUST include "sign" when signing, "verify" when verifying.'
      - name: algorithm_header_parameters
        type: 'none'
        required: false
        constrained_by: []
        constrained_by_note: >-
          RFC 9053 defines no algorithm-specific header parameter for this
          algorithm. Tables 9, 10 and 15 scope every parameter they define
          to the fourteen KDF and ECDH identifiers, and no sentence in the
          document states the absence for this family, so there is nothing
          to link -- unlike alg-direct, whose absence IS stated (R-0116).
        layout: 'NONE. RFC 9053 defines no algorithm-specific header parameter for any signature algorithm.'
    layout: 'Protected header {1: -7} = 0xa10126, wrapped as the COSE_Sign1 protected bstr 0x43a10126 (OURS -- computed under RFC 8949 §3.1; RFC 9053 prints no bytes).'
    notes: '§2.1: "Implementations SHOULD use a deterministic version of ECDSA such as the one defined in [RFC6979]" -- SHOULD, not MUST, so byte-reproducible ES256 fixtures are not guaranteed by conformance. §2.1.1 names the mitigation for hash substitution: "As the hash algorithm is part of the signature algorithm identifier, this attack is mitigated by including a signature algorithm identifier in the protected-header bucket." Curve substitution has no mitigation: "We currently do not have any way to deal with this version of the attack except to restrict the overall set of curves that can be used."'

  - name: alg-es384
    locator: "§2.1 (Table 1)"
    encoding: CBOR
    fields:
      - name: alg
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0013"
          - "rfc-9053#R-0018"
        layout: 'Value -35. CBOR 0x3822 (OURS) -- two bytes, because -25 is the first negative value needing a one-byte argument.'
      - name: kty
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0005"
          - "rfc-9053#R-0006"
          - "rfc-9053#R-0011"
          - "rfc-9053#R-0012"
        layout: 'MUST be 2 (EC2).'
      - name: crv
        type: 'int'
        required: false
        constrained_by:
          - "rfc-9053#R-0004"
          - "rfc-9053#R-0006"
          - "rfc-9053#R-0007"
          - "rfc-9053#R-0017"
        layout: 'P-384 (2) suggested; P-256 (1) and P-521 (3) are not forbidden.'
      - name: hash
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0003"
          - "rfc-9053#R-0007"
          - "rfc-9053#R-0016"
          - "rfc-9053#R-0018"
        layout: 'SHA-384.'
      - name: signature
        type: 'bstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0001"
          - "rfc-9053#R-0008"
          - "rfc-9053#R-0009"
          - "rfc-9053#R-0010"
        layout: 'With P-384, n = 48 and the signature is 96 bytes (OURS).'
      - name: key_ops
        type: '[+ int / tstr]'
        required: false
        constrained_by:
          - "rfc-9053#R-0014"
          - "rfc-9053#R-0015"
        layout: 'sign / verify as for ES256.'
      - name: algorithm_header_parameters
        type: 'none'
        required: false
        constrained_by: []
        constrained_by_note: >-
          RFC 9053 defines no algorithm-specific header parameter for this
          algorithm. Tables 9, 10 and 15 scope every parameter they define
          to the fourteen KDF and ECDH identifiers, and no sentence in the
          document states the absence for this family, so there is nothing
          to link -- unlike alg-direct, whose absence IS stated (R-0116).
        layout: 'NONE.'
    layout: 'Protected header {1: -35} = 0xa1013822, as a bstr 0x44a1013822 (OURS).'
    notes: 'Same §2.1 and §2.1.1 considerations as ES256. The code point -35 is numerically distant from -7 because ES384 and ES512 were allocated after the first COSE algorithm block.'

  - name: alg-es512
    locator: "§2.1 (Table 1)"
    encoding: CBOR
    fields:
      - name: alg
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0013"
          - "rfc-9053#R-0018"
        layout: 'Value -36. CBOR 0x3823 (OURS).'
      - name: kty
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0005"
          - "rfc-9053#R-0006"
          - "rfc-9053#R-0011"
          - "rfc-9053#R-0012"
        layout: 'MUST be 2 (EC2).'
      - name: crv
        type: 'int'
        required: false
        constrained_by:
          - "rfc-9053#R-0004"
          - "rfc-9053#R-0006"
          - "rfc-9053#R-0007"
          - "rfc-9053#R-0017"
        layout: 'P-521 (3) suggested.'
      - name: hash
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0003"
          - "rfc-9053#R-0007"
          - "rfc-9053#R-0016"
          - "rfc-9053#R-0018"
        layout: 'SHA-512. The §2.1 truncation rule bites here: P-521''s group is smaller than SHA-512''s output in bits, so "the leftmost bytes of the hash output are used".'
      - name: signature
        type: 'bstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0001"
          - "rfc-9053#R-0008"
          - "rfc-9053#R-0009"
          - "rfc-9053#R-0010"
        layout: 'With P-521, n = ceiling(521/8) = 66 and the signature is 132 bytes (OURS). Not 128, not 130.'
      - name: key_ops
        type: '[+ int / tstr]'
        required: false
        constrained_by:
          - "rfc-9053#R-0014"
          - "rfc-9053#R-0015"
        layout: 'sign / verify as for ES256.'
      - name: algorithm_header_parameters
        type: 'none'
        required: false
        constrained_by: []
        constrained_by_note: >-
          RFC 9053 defines no algorithm-specific header parameter for this
          algorithm. Tables 9, 10 and 15 scope every parameter they define
          to the fourteen KDF and ECDH identifiers, and no sentence in the
          document states the absence for this family, so there is nothing
          to link -- unlike alg-direct, whose absence IS stated (R-0116).
        layout: 'NONE.'
    layout: 'Protected header {1: -36} = 0xa1013823, as a bstr 0x44a1013823 (OURS).'
    notes: 'The 521-bit curve with a 512-bit hash is the one place where §2.1''s "the leftmost bytes of the hash output are used" and its 132-byte signature both apply, and the document states neither consequence numerically.'

  - name: alg-eddsa
    locator: "§2.2 (Table 2)"
    encoding: CBOR
    fields:
      - name: alg
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0027"
        layout: 'Value -8. CBOR 0x27 (OURS). ONE identifier for all curves: "A single signature algorithm is defined, which can be used for multiple curves."'
      - name: kty
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0023"
          - "rfc-9053#R-0024"
        layout: 'MUST be 1 (OKP). "The "kty" field MUST be present, and it MUST be "OKP" (Octet Key Pair)."'
      - name: crv
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0025"
          - "rfc-9053#R-0026"
          - "rfc-9053#R-0030"
        layout: 'MUST BE PRESENT -- this is the asymmetry against ECDSA. "The "crv" field MUST be present, and it MUST be a curve defined for this signature algorithm." Table 18 defines Ed25519 (6) and Ed448 (7) as "for use w/ EdDSA only". Because one `alg` value covers every curve, `crv` is the ONLY thing that says which curve signed; it is not in the `alg` header, so a verifier must get it from the key.'
      - name: variant
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0019"
          - "rfc-9053#R-0020"
          - "rfc-9053#R-0021"
          - "rfc-9053#R-0022"
        layout: 'Pure EdDSA only. "For use with COSE, only the pure EdDSA version is used." HashEdDSA is excluded; there is no code point for it.'
      - name: signature
        type: 'bstr'
        required: true
        constrained_by:
          - "rfc-9053#R-0031"
          - "rfc-9053#R-0032"
        layout: 'Per RFC 8032; RFC 9053 states no length.'
      - name: key_ops
        type: '[+ int / tstr]'
        required: false
        constrained_by:
          - "rfc-9053#R-0028"
          - "rfc-9053#R-0029"
        layout: 'If present MUST include "sign" when signing, "verify" when verifying.'
      - name: algorithm_header_parameters
        type: 'none'
        required: false
        constrained_by: []
        constrained_by_note: >-
          RFC 9053 defines no algorithm-specific header parameter for this
          algorithm. Tables 9, 10 and 15 scope every parameter they define
          to the fourteen KDF and ECDH identifiers, and no sentence in the
          document states the absence for this family, so there is nothing
          to link -- unlike alg-direct, whose absence IS stated (R-0116).
        layout: 'NONE.'
    layout: 'Protected header {1: -8} = 0xa10127, as a bstr 0x43a10127 (OURS). The smallest conforming protected bucket for a signed COSE object in this document: 3 bytes of map, 4 bytes wrapped.'
    notes: 'The pre-hash refusal, in full: "For use with COSE, only the pure EdDSA version is used. This is because it is not expected that extremely large contents are going to be needed and, based on the arrangement of the message structure, the entire message is going to need to be held in memory in order to create or verify a signature. Therefore, there does not appear to be a need to be able to do block updates of the hash, followed by eliminating the message from memory. Applications can provide the same features by defining the content of the message as a hash value and transporting the COSE object (with the hash value) and the content as separate items." §2.2.1: batch verification needs a well-seeded RNG, "Signing and nonbatch signature verification are deterministic operations and do not need random numbers of any kind" -- so EdDSA fixtures are byte-reproducible with no extra machinery, unlike ES256.'

  # ===================================================================
  # Part 3 -- MAC algorithms (§3)
  #
  # Shared key checks, §3.1 (HMAC) and §3.2 (AES-MAC):
  #   kty MUST be present and MUST be "Symmetric";
  #   alg, if present, MUST match;
  #   key_ops, if present, MUST include "MAC create" / "MAC verify".
  # Both sections add: "Implementations creating and validating MAC
  # values MUST validate that the key type, key length, and algorithm
  # are correct and appropriate for the entities involved."
  # No algorithm-specific header parameters are defined for any of them.
  # ===================================================================

  - name: alg-hmac-256-64
    locator: "§3.1 (Table 3)"
    encoding: CBOR
    fields:
      - name: alg
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0039"
          - "rfc-9053#R-0042"
        layout: 'Value 4. CBOR 0x04 (OURS).'
      - name: kty
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0037"
          - "rfc-9053#R-0038"
          - "rfc-9053#R-0042"
        layout: 'MUST be 4 (Symmetric).'
      - name: hash
        type: 'fixed'
        required: true
        constrained_by: []
        constrained_by_note: >-
          Nothing. The hash is fixed by the code point (Table 3) and no
          sentence in Section 3.1 constrains which hash an identifier uses.
          The two statements that name the hash output constrain the KEY
          length, not the hash, and are linked on key_length (R-0035,
          R-0036); R-0016's min(key, hash) strength statement is Section
          2.1.1 and is scoped to ECDSA.
        layout: 'SHA-256.'
      - name: tag_length
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0034"
