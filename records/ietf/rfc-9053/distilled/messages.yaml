          - "rfc-9053#R-0102"
        layout: 'PRF: AES-CBC-MAC-128. NO CODE POINT. "For the AES algorithm versions, the extract step is always skipped."'
      - name: hkdf_aes_mac_256
        type: 'name only'
        required: false
        constrained_by:
          - "rfc-9053#R-0098"
          - "rfc-9053#R-0099"
          - "rfc-9053#R-0101"
          - "rfc-9053#R-0102"
        layout: 'PRF: AES-CBC-MAC-256. NO CODE POINT.'
    layout: 'DEFECT, recorded as the structure itself: Table 8 is the only algorithm table in RFC 9053 with no Value column. Its four entries have Name, PRF and Description and no code point. They are not independently addressable; they reach the wire only inside the compound identifiers -10..-13 (Table 12) and -25..-34 (Tables 14, 16). §1.3 says the algorithm tables carry "The value used on the wire for the algorithm" -- Table 8 does not.'
    notes: 'HKDF inputs, per §5.1: secret, salt, length, context information, PRF -- "The PRF is encoded into the HKDF algorithm selection." The AES/ECDH incompatibility is stated and is a real constraint on which compound identifiers can exist: "The extract step cannot be skipped if the secret is not uniformly random -- for example, if it is the result of an ECDH key agreement step. This implies that the AES HKDF version cannot be used with ECDH. If the extract step is skipped, the "salt" value is not used as part of the HKDF functionality." That is why Tables 14 and 16 contain only SHA-256/SHA-512 HKDF variants and no AES ones.'

