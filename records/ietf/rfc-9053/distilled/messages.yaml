        layout: 'MUST be 4 (Symmetric).'
      - name: key_length
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0057"
        layout: '128 bits.'
      - name: nonce
        type: 'fixed length'
        required: true
        constrained_by:
          - "rfc-9053#R-0055"
          - "rfc-9053#R-0063"
          - "rfc-9053#R-0064"
          - "rfc-9053#R-0219"
        layout: '96 bits. "This document fixes the size of the nonce at 96 bits."'
      - name: tag_length
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0056"
          - "rfc-9053#R-0069"
        layout: '128 bits. "The size of the authentication tag is limited to a small set of values. For this document, however, the size of the authentication tag is fixed at 128 bits."'
    layout: 'AEAD. Both GCM parameters are fixed by the document rather than by the code point, so all three AES-GCM identifiers differ only in key length.'
    notes: '§4.1.1 MUSTs: "The key and nonce pair MUST be unique for every message encrypted" and "The total number of messages encrypted for a single key MUST NOT exceed 2^32 [SP800-38D]". Advisory limits: 2^24.5 messages per RFC 8446, 2^36 failed decryptions per RFC 9147 §4.5.3. §4.1.1 also records a rejected option: "Consideration was given to supporting smaller tag values; the constrained community would desire tag sizes in the 64-bit range. ... Given that Counter with CBC-MAC (CCM) is the usual mode for constrained environments, restricted modes are not supported."'

