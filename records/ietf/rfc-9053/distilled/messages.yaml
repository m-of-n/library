          - "rfc-9053#R-0158"
          - "rfc-9053#R-0159"
          - "rfc-9053#R-0160"
        layout: 'One of P-256 (1), P-384 (2), P-521 (3) with EC2, or X25519 (4), X448 (5) with OKP. Ed25519 and Ed448 are "for use w/ EdDSA only" (Table 18) and §2.2.1 forbids reuse across the two.'
      - name: kdf
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0100"
          - "rfc-9053#R-0101"
          - "rfc-9053#R-0153"
          - "rfc-9053#R-0154"
        layout: 'HKDF -- SHA-256 (Table 14 "KDF" column).'
      - name: ephemeral_static
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0146"
          - "rfc-9053#R-0156"
        layout: 'yes (Ephemeral-Static). "When using ephemeral keys, the sender MUST generate a new ephemeral key for every key agreement operation."'
      - name: key_wrap
        type: 'fixed'
        required: true
        constrained_by:
          - "rfc-9053#R-0155"
        layout: 'none. "No key wrap algorithm is used. This is represented in Table 14 as "none". The key size for the context structure is the content layer encryption algorithm size."'
      - name: ephemeral_key
        type: 'COSE_Key'
        required: true
        constrained_by:
          - "rfc-9053#R-0146"
          - "rfc-9053#R-0147"
        layout: 'Label -1, MUST be present: "The ephemeral key is placed in the "ephemeral key" parameter and MUST be present for all algorithm identifiers that use ephemeral keys."'
      - name: algorithm_header_parameters
        type: 'labels'
        required: false
        constrained_by:
          - "rfc-9053#R-0096"
          - "rfc-9053#R-0104"
          - "rfc-9053#R-0147"
        layout: 'Table 15 (-1 ephemeral key, mandatory here) plus Tables 9 and 10.'
    layout: 'Direct Key Agreement. The shared secret is converted to bytes before the KDF: "The x-coordinate is used for all of the curves defined in this document. For curves X25519 and X448, the resulting value is used directly, as it is a byte string of a known length. For the P-256, P-384, and P-521 curves, the x-coordinate is run through the Integer-to-Octet-String primitive (I2OSP) function defined in [RFC8017], using the same computation for n as is defined in Section 2.1."'
    notes: 'Why the curve, not the algorithm, carries the mathematics: "The math used to obtain the computed secret is based on the curve selected and not on the ECDH algorithm. For this reason, a new algorithm does not need to be defined for each of the curves." Why a KDF is mandatory: "The result of an ECDH key agreement process does not provide a uniformly random secret. As such, it needs to be run through a KDF in order to produce a usable key." Why there is no Ephemeral-Ephemeral: "COSE is not an online protocol by itself and thus does not have a method of establishing ephemeral secrets on both sides." §6.3.1.1 records a deliberate omission: requiring both public keys in the derivation, per RFC 7748 §6.1, "was not done, because COSE is used in a store-and-forward format rather than in online key exchange."'

