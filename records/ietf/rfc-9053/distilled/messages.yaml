  # ===================================================================
  # Part 7 -- the one new registration (§10.2)
  # ===================================================================

  - name: alg-iv-generation
    locator: "§6.1.2, §10.2 (Table 23)"
    encoding: CBOR
    fields:
      - name: value
        type: 'int'
        required: true
        constrained_by:
          - "rfc-9053#R-0125"
        layout: 'Value 34. CBOR 0x1822 (OURS). NOT an `alg` header value: §6.1.2 says "If HKDF is used for generating the IV, the algorithm identifier is set to 34 ("IV-GENERATION")", meaning the AlgorithmID field of COSE_KDF_Context.'
      - name: capabilities
        type: 'array'
        required: true
        constrained_by:
          - "rfc-9053#R-0205"
          - "rfc-9053#R-0212"
        layout: 'EMPTY. §10.2: "The Capabilities column for this registration is to be empty." The only registration in the document with no capability list -- §8.1 explicitly carves it out of the one-element rule.'
      - name: recommended
        type: 'fixed'
        required: true
        constrained_by: []
        constrained_by_note: >-
          Nothing. "Recommended: No" is a Table 23 column value and the IANA
          registry's own field; RFC 9053 states no sentence about it, here
          or in Section 10.4's expert-review guidance.
        layout: 'No (Table 23).'
    layout: 'A "COSE Algorithms" registry row whose Description column reads, glossed not quoted (the cell wraps): for doing IV generation for symmetric algorithms; Reference RFC 9053. The only code point RFC 9053 newly allocates; §10 says every other registry change was IANA re-pointing existing rows from RFC 8152 to this document.'
    notes: 'FINDING: the "COSE Algorithms" registry holds two different namespaces in one column. 34 can never appear in an `alg` header parameter, and nothing in the registry says so -- the constraint lives only in §6.1.2''s sentence. An implementation that treats the registry as the domain of `alg` will accept `{1: 34}`. The empty Capabilities column is the only machine-readable hint, and §8.1''s rule gives it a different stated reason.'
