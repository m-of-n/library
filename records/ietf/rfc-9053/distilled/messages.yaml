  # ===================================================================
  # Part 4 -- content encryption algorithms (§4)
  #
  # Shared key checks, §4.1, §4.2, §4.3, identical in all three:
  #   kty MUST be present and MUST be "Symmetric";
  #   alg, if present, MUST match;
  #   key_ops, if present, MUST include "encrypt" or "wrap key" when
  #   encrypting, "decrypt" or "unwrap key" when decrypting.
  # All three also state: "Keys may be obtained from either a key
  # structure or a recipient structure. Implementations that are
  # encrypting or decrypting MUST validate that the key type, key
  # length, and algorithm are correct and appropriate for the entities
  # involved."
  # The nonce travels in RFC 9052's IV (label 5) / Partial IV (label 6)
  # header parameters; RFC 9053 defines no nonce parameter of its own.
  # ===================================================================

  - name: alg-a128gcm
    locator: "§4.1 (Table 5)"
