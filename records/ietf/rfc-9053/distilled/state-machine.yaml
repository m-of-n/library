record: rfc-9053
reviewed_by: ""
note: >
  RFC 9053 defines NO message lifecycle — see distillation.not_applicable for
  protocol, and §6.3.1's own "COSE is not an online protocol by itself". What it
  does define is a KEY-USAGE lifecycle: counter-driven limits that oblige a
  rekey, plus one trust transition. That is why this artifact exists rather
  than being declared not applicable, and it is the only record in library#39's
  Tier 1 set for which that is true.

  Every state and transition below is drawn from a statement captured in
  normative.md and requirements.yaml. Nothing here is a state the document
  names as such: RFC 9053 states obligations about counters and thresholds, and
  this rendering of them as a machine is OURS. Treat it as derived.

  CROSS-CHECK PASS, 2026-10-19. Every transition and the error state now carry
  `constrained_by`; five of the six hold ids and the sixth holds an explicit
  empty list with its reason. Three claims were falsified and fixed: the
  in-use -> threshold-exceeded transition asserted `constrained_by: []` while
  all seven of its thresholds are recorded entries; the ChaCha20/Poly1305
  thresholds were printed in the wrong order against the convention the
  AES-CCM pair sets; and the AES-GCM pair read as though 2^24.5 were a
  failed-decryption limit. Everything else survived, including both
  `derived: true` claims (the word "state" occurs exactly once in 2443 lines,
  at §11's "state of the application"), the two BCP 14 ceilings R-0065 and
  R-0079, and all three gaps.

machines:
  - name: key-usage-lifecycle
    scope: "a single symmetric key, or a single key-wrapping/derivation key"
    locator: "§4.1.1, §4.2.1, §4.3.1, §6.1.1.1, §6.1.2.1, §6.2.1.1, §11"
    derived: true
    derivation_note: >
      RFC 9053 never draws this machine. It states per-algorithm ceilings and
      thresholds as obligations on an implementation; the states, the ordering
      between them and the names are this extraction's rendering.
    states:
      - name: fresh
        meaning: "key established, usage counters at zero"
      - name: in-use
        meaning: "below every advisory threshold and every hard ceiling"
      - name: threshold-exceeded
        meaning: >
          an advisory threshold is crossed. The document recommends rekeying
          but does not forbid continued use, so this state is distinct from
          ceiling-exceeded.
      - name: ceiling-exceeded
        meaning: >
          a hard BCP 14 limit is crossed. Encryption under this key is
          forbidden from here on, so a conforming implementation cannot
          remain in this state and keep encrypting.
      - name: retired
        meaning: "key withdrawn from use; successor established out of band"
    transitions:
      - from: fresh
        to: in-use
        trigger: "the first message encrypted under this key"
        guard: none
        constrained_by: []
        note: >-
          No sentence in RFC 9053 marks this transition; the document never
          says when a key starts being used. It is here only so the counters
          the ceilings below depend on have a zero point. The trigger is the
          document's own unit of count -- "the total number of messages
          encrypted for a single key" (§4.1.1).
      - from: in-use
        to: threshold-exceeded
        trigger: "message or failed-decryption counter crosses an advisory threshold"
        guard: >
          AES-GCM (§4.1.1): 2^24.5 messages encrypted, 2^36 failed
          decryptions. AES-CCM (§4.2.1): 2^23 messages encrypted, 2^23.5
          failed decryptions, and -- at a 64-bit tag only -- a rekey as often
          as every 2^7 messages. ChaCha20/Poly1305 (§4.3.1): 2^36 failed
          decryptions, 2^64 messages encrypted.
        locator: "§4.1.1, §4.2.1, §4.3.1"
        constrained_by:
          - "rfc-9053#R-0067"
          - "rfc-9053#R-0068"
          - "rfc-9053#R-0081"
          - "rfc-9053#R-0082"
          - "rfc-9053#R-0083"
          - "rfc-9053#R-0094"
          - "rfc-9053#R-0095"
        note: >
          Advisory in the source's own lowercase prose, not BCP 14: all seven
          are "should", "should not" or "needs to". Pass 3 (cross-check) fixed
          two things here. The list carried `constrained_by: []`, which asserts
          that no requirement constrains the transition, while all seven
          thresholds are recorded entries. And two of the pairs were misread:
          the ChaCha20/Poly1305 pair was printed "2^36 / 2^64" under the
          messages-then-failures order the AES-CCM pair sets, but 2^36 is the
          FAILED-DECRYPTION limit (R-0094) and 2^64 the message limit (R-0095);
          and "AES-GCM: 2^24.5 and 2^36 failed decryptions" read as though both
          numbers were failed decryptions, when 2^24.5 is a message limit
          (R-0067). Every number now names which counter it bounds.
      - from: in-use
        to: ceiling-exceeded
        trigger: "message or operation counter crosses a hard limit"
        guard: >
          §4.1.1 — the total number of messages encrypted for a single key
          MUST NOT exceed 2^32. §4.2.1 — MUST NOT exceed 2^61 block-cipher
          operations.
        locator: "§4.1.1, §4.2.1"
        constrained_by:
          - "rfc-9053#R-0065"
          - "rfc-9053#R-0079"
        note: >
          These are the only two BCP 14 statements in the machine. Everything
          else here is lowercase prose. (Pass 2 corrected the first id: pass 1
          cited R-0066, which is the inferred follow-on sentence "An explicit
          check is required only in environments where it is expected that this
          limit might be exceeded." The MUST NOT is R-0065.)
      - from: threshold-exceeded
        to: retired
        trigger: "rekey"
        guard: "recommended, not required"
        locator: "§6.1.1.1, §6.1.2.1, §6.2.1.1"
        constrained_by:
          - "rfc-9053#R-0119"
          - "rfc-9053#R-0130"
          - "rfc-9053#R-0131"
          - "rfc-9053#R-0142"
        note: >
          Four rotation duties, one per security-considerations subsection,
          and not one of them names a period, a counter or a responsible
          party -- see the second gap below. R-0131 is the sharpest: a shared
          secret "not used directly ... should still be subject to scheduled
          rotation".
      - from: ceiling-exceeded
        to: retired
        trigger: "rekey"
        guard: "required — further encryption under this key is forbidden"
        locator: "§4.1.1, §4.2.1"
        constrained_by:
          - "rfc-9053#R-0065"
          - "rfc-9053#R-0079"
        note: >
          The same two MUST NOTs, read as an obligation to stop rather than as
          a limit on a counter. RFC 9053 never names the remedy at a hard
          ceiling: it forbids exceeding 2^32 and 2^61 and says nothing about
          what to do next. The only place it uses the word "rekey" at all is
          §4.2.1's advisory 2^7-message case and §11's "trigger the rekey
          operation", so the word in this trigger is OURS.
    error_states:
      - name: unrekeyable
        meaning: >
          A ceiling is crossed and no party can trigger the rekey. §11: "it may
          be that no one single entity will see all of the messages that are
          encrypted, and therefore no single entity can trigger the rekey
          operation." The document names this hazard for group keys and offers
          no mechanism, so it is a terminal error state of the source's own
          making, not of this rendering.
        locator: "§11"
        constrained_by:
          - "rfc-9053#R-0222"

  - name: key-trust-promotion
    scope: "a key moving between trust levels"
    locator: "§6.3.1.1"
    derived: true
    derivation_note: >
      One sentence in the source, rendered as a two-state transition. The
      document defines no trust model, no actor and no verification procedure
      for this — only that proof of possession is recommended at the boundary.
    states:
      - name: untrusted
        meaning: "key held but not relied on"
      - name: trusted
        meaning: "key relied on"
    transitions:
      - from: untrusted
        to: trusted
        trigger: "proof of possession of the private key"
        guard: "recommended"
        locator: "§6.3.1.1"
        constrained_by:
          - "rfc-9053#R-0169"
        note: >
          Verbatim: a proof of possession of the private key is recommended
          "when a key is moved from untrusted to trusted". This is the only
          genuine state transition the document names in those words.

gaps:
  - note: "No state is named as a state anywhere in RFC 9053; both machines are ours."
  - note: >
      The rotation statements (§6.1.1.1, §6.1.2.1, §6.2.1.1) say keys and shared
      secrets "need to have some method of being regularly updated over time"
      and that an unused secret "should still be subject to scheduled rotation"
      — without naming a period, a counter or a responsible party. So the
      threshold-exceeded -> retired transition has no trigger the document
      defines; only a duty it asserts.
  - note: >
      Nothing connects the counters to a carrier. COSE messages carry no
      sequence number and no key-usage counter, so an implementation obliged
      not to exceed 2^32 messages has no field in which to track it. That is
      the mechanism gap behind the `unrekeyable` error state.

      Pass 2 checked this against the one counter RFC 9053 does name, and it
      does not close the gap. §6.3.1 permits "a global counter that is
      incremented for every Static-Static operation" and warns that "Care must
      be taken that the counter is saved to permanent storage in a way that
      avoids reuse of that counter value." That counter exists to make a KDF
      input unique, not to enforce a usage ceiling; it lives in the sender's
      local storage, and its value reaches the wire only as a "salt" or
      "PartyU nonce" (Tables 9 and 10), which no receiver is told to read as a
      count. §11 likewise says only that "it's reasonable to use a counter for
      creation of the nonce". So the document names a counter twice and binds
      neither to the 2^32 and 2^61 ceilings.
