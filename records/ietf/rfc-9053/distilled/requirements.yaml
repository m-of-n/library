    actor: 'IANA / implementation'
    locator: "§8.1"
    text: 'GENERATION (those in this document as well as those in [RFC8230], [RFC8778], and [RFC9021]), the capabilities list is an array with one element, the key type (from the "COSE Key Types" Registry).'
    kind: inferred
    testable: yes
    status: active
