  - id: "rfc-9053#R-0051"
    object: 'AES-CBC-MAC key'
    field: 'one key per fixed or known message length; no BCP 14 keyword backs it — lowercase "must only"'
    verb: 'must only'
    actor: 'implementation'
    locator: "§3.2.1"
    text: 'A single key must only be used for messages of a fixed or known length.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0052"
    object: 'AES-CBC-MAC key'
    field: 'key separation by message length; no BCP 14 keyword backs it'
    verb: 'can be addressed by'
    actor: 'implementation'
    locator: "§3.2.1"
    text: 'This can be addressed by using different keys for messages of different lengths.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0053"
    object: 'AES-CBC-MAC key'
    field: 'no key sharing between CBC encryption and CBC-MAC; no BCP 14 keyword backs it'
    verb: 'can'
    actor: 'implementation'
    locator: "§3.2.1"
    text: 'In Cipher Block Chaining (CBC) mode, if the same key is used for both encryption and authentication operations, an attacker can produce messages with a valid authentication code.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0054"
    object: 'AES-CBC-MAC IV'
    field: 'a modifiable IV permits forgery; fixing it to zero is the mitigation; no BCP 14 keyword backs it'
    verb: 'is addressed by'
    actor: 'implementation'
    locator: "§3.2.1"
    text: 'If the IV can be modified, then messages can be forged.  This is addressed by fixing the IV to all zeros.'
    kind: inferred
    testable: yes
    status: active
