requirements:
  - id: "rfc-9053#R-0001"
    object: 'ECDSA signature generation'
    field: 'use of a deterministic nonce k'
    verb: 'SHOULD'
    actor: 'implementation'
    locator: "§2.1"
    text: 'Implementations SHOULD use a deterministic version of ECDSA such as the one defined in [RFC6979].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0002"
    object: 'ECDSA private key generation'
    field: 'random number quality for key generation; no BCP 14 keyword backs it'
    verb: 'needs'
    actor: 'implementation'
    locator: "§2.1"
    text: 'The use of deterministic ECDSA does not lessen the need to have good random number generation when creating the private key.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0003"
    object: 'ECDSA hash input'
    field: 'truncation of an over-long hash; no BCP 14 keyword backs it'
    verb: 'is'
    actor: 'signer'
    locator: "§2.1"
    text: 'In the event that the length of the hash function output is greater than the group of the key, the leftmost bytes of the hash output are used.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0004"
    object: 'ECDSA curve set'
    field: 'admissible curves; no BCP 14 keyword backs it — stated as a definitional restriction'
    verb: 'only'
    actor: 'implementation'
    locator: "§2.1"
    text: 'This document defines ECDSA as working only with the curves P-256, P-384, and P-521.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0005"
    object: 'ECDSA key encoding'
    field: 'required key type; no BCP 14 keyword backs it — the document says "requires" in lowercase'
    verb: 'requires'
    actor: 'implementation'
    locator: "§2.1"
    text: 'This document requires that the curves be encoded using the "EC2" (two coordinate elliptic curve) key type.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0006"
    object: 'ECDSA key'
    field: 'key type and curve agreement check; no BCP 14 keyword backs it'
    verb: 'needs to'
    actor: 'signer / verifier'
    locator: "§2.1"
    text: 'Implementations need to check that the key type and curve are correct when creating and verifying a signature.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0007"
    object: 'ECDSA hash/curve pairing'
    field: 'interoperability pairing of hash to curve; no BCP 14 keyword backs it — "it is suggested"'
    verb: 'suggested'
    actor: 'implementation'
    locator: "§2.1"
    text: 'In order to promote interoperability, it is suggested that SHA-256 be used only with curve P-256, SHA-384 be used only with curve P-384, and SHA-512 be used only with curve P-521.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0008"
    object: 'ECDSA signature value'
    field: 'integer-to-byte-string conversion; no BCP 14 keyword backs it'
    verb: 'is'
    actor: 'signer'
    locator: "§2.1"
    text: 'The signature is encoded by converting the integers into byte strings of the same length as the key size.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0009"
    object: 'ECDSA signature value'
    field: 'left zero padding of each integer; no BCP 14 keyword backs it'
    verb: 'is'
    actor: 'signer'
    locator: "§2.1"
    text: 'The length is rounded up to the nearest byte and is left padded with zero bits to get to the correct length.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0010"
    object: 'ECDSA signature value'
    field: 'concatenation order R then S; no BCP 14 keyword backs it'
    verb: 'is'
    actor: 'signer'
    locator: "§2.1"
    text: 'The two integers are then concatenated together to form a byte string that is the resulting signature.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0011"
    object: 'COSE key for ECDSA'
    field: '"kty" presence'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§2.1"
    text: 'The "kty" field MUST be present'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0012"
    object: 'COSE key for ECDSA'
    field: '"kty" value'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§2.1"
    text: 'it MUST be "EC2"'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0013"
    object: 'COSE key for ECDSA'
    field: '"alg" agreement with the signature algorithm in use'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§2.1"
    text: 'If the "alg" field is present, it MUST match the ECDSA signature algorithm being used.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0014"
    object: 'COSE key for ECDSA'
    field: '"key_ops" must permit signing'
    verb: 'MUST'
    actor: 'signer'
    locator: "§2.1"
    text: 'If the "key_ops" field is present, it MUST include "sign" when creating an ECDSA signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0015"
    object: 'COSE key for ECDSA'
    field: '"key_ops" must permit verification'
    verb: 'MUST'
    actor: 'verifier'
    locator: "§2.1"
    text: 'If the "key_ops" field is present, it MUST include "verify" when verifying an ECDSA signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0016"
    object: 'ECDSA security strength'
    field: 'strength is min(key, hash); no BCP 14 keyword backs it — an analytic statement, not an obligation'
    verb: 'is'
    actor: 'implementation'
    locator: "§2.1.1"
    text: 'The security strength of the signature is no greater than the minimum of the security strength associated with the bit length of the key and the security strength of the hash function.'
    kind: inferred
    testable: no
    status: active
  - id: "rfc-9053#R-0017"
    object: 'ECDSA curve substitution attack'
    field: 'only mitigation is restricting the curve set; no BCP 14 keyword backs it'
    verb: 'except to'
    actor: 'implementation'
    locator: "§2.1.1"
    text: 'We currently do not have any way to deal with this version of the attack except to restrict the overall set of curves that can be used.'
    kind: inferred
    testable: no
    status: active
  - id: "rfc-9053#R-0018"
    object: 'ECDSA hash substitution attack'
    field: 'mitigation by placing alg in the protected bucket; no BCP 14 keyword backs it'
    verb: 'is mitigated by'
    actor: 'signer'
    locator: "§2.1.1"
    text: 'As the hash algorithm is part of the signature algorithm identifier, this attack is mitigated by including a signature algorithm identifier in the protected-header bucket.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0019"
    object: 'EdDSA variant'
    field: 'PRE-HASH REFUSAL — HashEdDSA excluded, only Pure EdDSA admitted; no BCP 14 keyword backs it'
    verb: 'only'
    actor: 'signer / verifier'
    locator: "§2.2"
    text: 'For use with COSE, only the pure EdDSA version is used.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0020"
    object: 'EdDSA pre-hash rationale'
    field: 'why HashEdDSA is refused: COSE holds the whole message in memory anyway, so streaming the hash buys nothing; no BCP 14 keyword backs it'
    verb: 'is because'
    actor: 'signer / verifier'
    locator: "§2.2"
    text: 'This is because it is not expected that extremely large contents are going to be needed and, based on the arrangement of the message structure, the entire message is going to need to be held in memory in order to create or verify a signature.'
    kind: inferred
    testable: no
    status: active
  - id: "rfc-9053#R-0021"
    object: 'EdDSA pre-hash rationale'
    field: 'consequence of the above: no block-update-then-discard hashing is needed; no BCP 14 keyword backs it'
    verb: 'does not appear to be a need'
    actor: 'signer / verifier'
    locator: "§2.2"
    text: 'Therefore, there does not appear to be a need to be able to do block updates of the hash, followed by eliminating the message from memory.'
    kind: inferred
    testable: no
    status: active
  - id: "rfc-9053#R-0022"
    object: 'EdDSA large-content workaround'
    field: 'the sanctioned alternative to pre-hashing: hash as content, detached payload; no BCP 14 keyword backs it'
    verb: 'can'
    actor: 'application'
    locator: "§2.2"
    text: 'Applications can provide the same features by defining the content of the message as a hash value and transporting the COSE object (with the hash value) and the content as separate items.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0023"
    object: 'COSE key for EdDSA'
    field: '"kty" presence'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§2.2"
    text: 'The "kty" field MUST be present'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0024"
    object: 'COSE key for EdDSA'
    field: '"kty" value'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§2.2"
    text: 'it MUST be "OKP" (Octet Key Pair)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0025"
    object: 'COSE key for EdDSA'
    field: '"crv" presence'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§2.2"
    text: 'The "crv" field MUST be present'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0026"
    object: 'COSE key for EdDSA'
    field: '"crv" value restricted to curves defined for EdDSA'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§2.2"
    text: 'it MUST be a curve defined for this signature algorithm'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0027"
    object: 'COSE key for EdDSA'
    field: '"alg" agreement'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§2.2"
    text: 'If the "alg" field is present, it MUST match "EdDSA".'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0028"
    object: 'COSE key for EdDSA'
    field: '"key_ops" must permit signing'
    verb: 'MUST'
    actor: 'signer'
    locator: "§2.2"
    text: 'If the "key_ops" field is present, it MUST include "sign" when creating an EdDSA signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0029"
    object: 'COSE key for EdDSA'
    field: '"key_ops" must permit verification'
    verb: 'MUST'
    actor: 'verifier'
    locator: "§2.2"
    text: 'If the "key_ops" field is present, it MUST include "verify" when verifying an EdDSA signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0030"
    object: 'EdDSA / ECDH public key'
    field: 'no cross-algorithm reuse of a public key; no BCP 14 keyword backs it — lowercase "should not"'
    verb: 'should not'
    actor: 'implementation'
    locator: "§2.2.1"
    text: 'Public values are computed differently in EdDSA and Elliptic Curve Diffie-Hellman (ECDH); for this reason, the public key from one should not be used with the other algorithm.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0031"
    object: 'EdDSA batch verification'
    field: 'RNG quality when batch verifying'
    verb: 'REQUIRED'
    actor: 'verifier'
    locator: "§2.2.1"
    text: 'If batch signature verification is performed, a well-seeded cryptographic random number generator is REQUIRED (Section 8.2 of [RFC8032]).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0032"
    object: 'EdDSA signing and nonbatch verification'
    field: 'no randomness needed; no BCP 14 keyword backs it'
    verb: 'do not need'
    actor: 'signer / verifier'
    locator: "§2.2.1"
    text: 'Signing and nonbatch signature verification are deterministic operations and do not need random numbers of any kind.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0033"
    object: 'HMAC padding'
    field: 'inner/outer padding fixed to RFC 2104; no BCP 14 keyword backs it'
    verb: 'are fixed to'
    actor: 'implementation'
    locator: "§3.1"
    text: 'For this specification, the inner and outer padding are fixed to the values set in [RFC2104].'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0034"
    object: 'HMAC truncated tag'
    field: 'which bits survive truncation; no BCP 14 keyword backs it'
    verb: 'are kept'
    actor: 'implementation'
    locator: "§3.1"
    text: 'When truncating, the leftmost tag-length bits are kept and transmitted.'
    kind: inferred
    testable: yes
    status: active
  - id: "rfc-9053#R-0035"
    object: 'HMAC key (transported)'
    field: 'key size for key-transporting recipient algorithms'
    verb: 'SHOULD'
    actor: 'implementation'
    locator: "§3.1"
    text: 'For those algorithms that transport the key (such as AES Key Wrap), the size of the HMAC key SHOULD be the same size as the output of the underlying hash function.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0036"
    object: 'HMAC key (derived)'
    field: 'key size for key-deriving recipient algorithms'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§3.1"
    text: 'For those algorithms that derive the key (such as ECDH), the derived key MUST be the same size as the output of the underlying hash function.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0037"
    object: 'COSE key for HMAC'
    field: '"kty" presence'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§3.1"
    text: 'The "kty" field MUST be present'
    kind: stated
