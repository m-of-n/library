    object: 'HMAC key material'
    field: 'key type, key length and algorithm validation'
    verb: 'MUST'
    actor: 'implementation'
    locator: "§3.1"
    text: 'Implementations creating and validating MAC values MUST validate that the key type, key length, and algorithm are correct and appropriate for the entities involved.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9053#R-0043"
    object: 'HMAC key size'
    field: 'brute force of the key is the best known attack; no BCP 14 keyword backs it'
    verb: 'is'
    actor: 'implementation'
    locator: "§3.1.1"
    text: 'This means that key size is going to be directly related to the security of an HMAC operation.'
    kind: inferred
