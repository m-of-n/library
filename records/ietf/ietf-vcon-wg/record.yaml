usefulness:
  verdict: unassessed
  reason: >
    The WG record and the charter are one record by this library's convention
    (cf. ietf-cbor-wg, ietf-cose-wg): content.url is /wg/<acronym>/about/,
    which is where the charter lives. Members link here with part_of.
    Two things in the charter text worth checking when this is summarised,
    both bearing on library#9's extraction of the core draft. It charters
    "the use of an EXISTING mechanism for proving integrity and optionally
    authenticity" - which is the layering question the core record's design
    notes tested and rejected, and the charter's wording cuts both ways,
    since "define/specify the use of" still leaves the WG owing the placement
    rules that section 5.2 attempts. And it charters encryption "such that
    some parts of the vCon may be disclosed to different parties" - selective
    disclosure - which the extraction found the core draft cannot do: JWS
    signs the whole payload as opaque octets, so there is no partial
    verification and every change mints a new signed document.
