distillation:
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "245 verbatim statements and 82 verbatim blocks across 47 headings, §1.4-§12 plus Appendices A and B; all 30 CDDL rules and Tables 1-5; excludes Appendix C, whose examples are held as fixtures"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "99 entries: 53 stated, one per BCP 14 occurrence, bijective onto the source count; 46 inferred from lowercase-normative prose and the numbered procedures, each declaring that no BCP 14 keyword backs it"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "cose.cddl holds all 24 fragments and 30 rules verbatim, byte-for-byte; structures.derived.cddl closes COSE_Sign1, Sig_structure and COSE_Key standalone and cites a requirement id inline for every constraint. §1.4 makes the source CDDL informative and the prose normative, so these schemas are under-constrained by design"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "25 structures, 74 fields; includes ToBeSigned, ToBeMaced and AAD, added in pass 3 because 14 protocol steps named them. constrained_by populated: 63 fields linked, no dangling ids"
      generated_from: "distilled/normative.md + distilled/requirements.yaml"
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "11 local procedures, 81 steps, 5 roles, one Mermaid sequence diagram each. Not a wire protocol: §1.4's Internal_Types are not emitted for transport. 51 of 81 steps carry on_error 'unspecified in this document' - verified against all 99 requirements, and that is the source's gap, not ours"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: "17 complete tagged messages from §B and §C.1-C.7 as RFC 8610 diagnostic-notation fixtures, each re-encoding to the byte count the RFC declares, plus 6 fragments. hex is empty throughout because the source publishes no hex dumps. No populated Sig_structure and no ToBeSigned byte string exists anywhere in the source, so the signing input is untestable from this document"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "adopt / adapt / reject against ARCH-0001, ARCH-0002 P1/P5/P6, ADR-0001 and D-3 option 5, with a field-by-field COSE_Sign1 export mapping, 12 determinism items pinned for the Oct 28 D5 package, 11 open questions and 3 recorded source defects"
      reviewed_by: ""
  not_applicable:
    - kind: state-machine
      reason: "COSE is a single-shot object format, not a role-based protocol with a lifecycle. No state persists between messages; the only ordered processes are the per-message procedures, held in distilled/protocol.yaml. §7 key objects are structure plus rules with no ordered steps."
