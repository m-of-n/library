  - id: "rfc-9052#V-0001"
    locator: "§B"
    kind: "complete"
    title: "Triple-layer COSE_Encrypt (decomposed ECDH-ES+A128KW)"
    file: "fixtures/V-0001-triple-layer-encrypt.diag"
    diagnostic: "96( [ / COSE_Encrypt / / protected h'a10101' / << { / alg / 1:1 / AES-GCM 128 / } >>, / unprotected / { / iv / 5:h'02d1f7e6f26c43d4868d87ce' }, / ciphertext / h'64f84d913ba60a76070a9a48f26e97e863e2852948658f0811139868826e89218a75715b', / recipients / [ [ / COSE_Recipient / / protected / h'', / unprotected / { / alg / 1:-3 / A128KW / }, / ciphertext / h'dbd43c4e9d719c27c6275c67d628d493f090593db8218f11', / recipients / [ [ / COSE_Recipient / / protected h'a1013818' / << { / alg / 1:-25 / ECDH-ES + HKDF-256 / } >> , / unprotected / { / ephemeral / -1:{ / kty / 1:2, / crv / -1:1, / x / -2:h'b2add44368ea6d641f9ca9af308b4079aeb519f11e9b8a55a600b21233e86e68', / y / -3:false }, / kid / 4:'meriadoc.brandybuck@buckland.example' }, / ciphertext / h'' ] ] ] ] ] )"
    hex: ""
    derived_hex: ""
    declared_size_bytes: 183
    size_check: "match"
    expect: "decode"
    inputs: "Layer 0: Has content encrypted with AES-GCM using a 128-bit key. Layer 1: Uses the AES Key Wrap algorithm with a 128-bit key. Layer 2: Uses ECDH Ephemeral-Static direct to generate the Layer 1 key. In effect, this example is a decomposed version of using the ECDH-ES+A128KW algorithm."
    notes: "Informative illustration in Appendix B, not part of Appendix C. Three COSE layers; no hex dump and no key material for this example is given in this document."
