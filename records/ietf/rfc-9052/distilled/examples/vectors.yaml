    notes: "Verbatim source text: Senders SHOULD encode a zero-length map as a zero-length byte string rather than as a zero-length map (encoded as h'a0'). Recipients MUST accept both a zero-length byte string and a zero-length map encoded in a byte string. h'a0' is the only literal byte value the source spells out here; the preferred zero-length byte string is described in words only. Related CDDL in the same section: empty_or_serialized_map = bstr .cbor header_map / bstr .size 0."
