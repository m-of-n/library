record: rfc-9052
reviewed_by: ""
source_has_complete_vectors: true
source_vector_count: 17
source_fragment_count: 6
defers_to: "§C (Appendix C introduction) cites [GitHub-Examples] in §13.2 -- https://github.com/cose-wg/Examples, commit 3221310, 3 June 2020 -- for hex dumps, intermediate/debug values and failure-test cases; algorithm specifics are in RFC 9053."
completeness_note: "The source carries 17 complete, tagged COSE messages in extended CBOR diagnostic notation (RFC 8610), each with a declared binary size, plus full public and private key sets in C.7. It carries no hex dumps, no populated Sig_structure/Enc_structure/MAC_structure instances, no KDF context byte strings and no algorithm definitions."
derived_hex_method: "derived_hex is NOT in the source. It was produced by encoding the diagnostic notation in the sibling fixtures/ file to deterministic CBOR (RFC 8949 §4.2.1, source map order preserved), then checked two ways: the encoded length equals the declared_size_bytes the source states, for all 17 messages; and all 22 inline 'protected h'...'' annotations in the source reproduce byte for byte. Re-derive canonically with 'gem install cbor-diag' then 'diag2cbor.rb < fixture.diag'. Treat the .diag file as authoritative and derived_hex as a convenience."
fixtures_note: "fixtures/*.diag hold each example exactly as the source prints it, except that hex literals the RFC text formatter hard-wrapped across lines were rejoined onto one line, and the 3-space block indent was removed. No token was otherwise altered, added or reordered."
expect_vocabulary: "decode = the fixture must decode to this structure and re-encode to declared_size_bytes; encode = a byte-level encoding assertion stated by the source; informative = a shape or note with no executable assertion. No fixture here supports cryptographic verification on its own, because the algorithms are defined in RFC 9053."
