    layout: "CBOR map, not an array and never carrying the protected/unprotected buckets; media type application/cose-key, CoAP Content-Format 101"
    notes: "No CBOR tag is defined for COSE_Key in this document; labels 1 to 5 are the common parameters and key-type-specific labels are defined elsewhere, so a parser must dispatch on kty before reading them"
