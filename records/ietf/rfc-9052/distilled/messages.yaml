    layout: "5-element CBOR array for the Signature context, 4-element for Signature1 with sign_protected absent; never transported, never tagged"
    notes: "ToBeSigned is the Sig_structure encoded to a byte string using the §9 restrictions (definite lengths, minimum-length arguments), and the resulting signature goes into the signature field of COSE_Signature or COSE_Sign1"
