record: rfc-9052
reviewed_by: ""
messages:
  - name: COSE_Messages
    locator: "§2"
    encoding: CBOR
    cbor_tag: none
    structure: choice
    fields: []
    layout: "COSE_Messages = COSE_Untagged_Message / COSE_Tagged_Message; untagged set is COSE_Sign / COSE_Sign1 / COSE_Encrypt / COSE_Encrypt0 / COSE_Mac / COSE_Mac0, and the tagged set is each of those wrapped in its own CBOR tag"
    notes: "Every message type is a CBOR array whose first three elements are always protected (bstr), unprotected (map), then the content (bstr when present, nil when detached); later elements are type-specific"
  - name: COSE_message_identification
    locator: "§2 Table 1, Table 2"
    encoding: CBOR
    cbor_tag: none
    structure: table
    fields:
      - name: by context
        index: 0
        type: none
        required: false
        constrained_by: []
        layout: "the message type is known from the context, e.g. a marker in the containing structure or a restriction in the application protocol"
      - name: by CBOR tag
        index: 1
        type: uint
        required: false
        constrained_by: []
        layout: "COSE_Sign 98, COSE_Sign1 18, COSE_Encrypt 96, COSE_Encrypt0 16, COSE_Mac 97, COSE_Mac0 17; a message carrying the tag is a tagged message, one without it is an untagged message"
      - name: cose-type media type parameter
        index: 2
        type: tstr
        required: false
        constrained_by:
          - "rfc-9052#R-0004"
          - "rfc-9052#R-0005"
        layout: "for media type application/cose the optional cose-type parameter is cose-sign, cose-sign1, cose-encrypt, cose-encrypt0, cose-mac or cose-mac0; OPTIONAL when the tagged structure is used, REQUIRED when the untagged structure is used"
      - name: CoAP Content-Format
        index: 3
        type: uint
        required: false
        constrained_by: []
        layout: "Table 2 IDs: cose-sign 98, cose-sign1 18, cose-encrypt 96, cose-encrypt0 16, cose-mac 97, cose-mac0 17, application/cose-key 101, application/cose-key-set 102; the CBOR tag is then not required"
    layout: "not a wire structure; the four ways an implementation may learn which COSE structure it is holding"
    notes: "Tag numbers and CoAP Content-Format IDs coincide for the six security messages, but they are separate registries and a Content-Format is not a tag"
  - name: Headers
    locator: "§3"
    encoding: CBOR
    cbor_tag: none
    structure: group
    fields:
      - name: protected
        index: 0
        type: empty_or_serialized_map
        required: true
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
        layout: "CBOR bstr holding the encoded protected header_map; presence of the element is required even when the map is empty"
      - name: unprotected
        index: 1
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0014"
        layout: "bare CBOR map, not wrapped in a bstr"
    layout: "CDDL group spliced into every security structure as its first two array elements, in this order: protected then unprotected; the presence of both buckets is required"
    notes: "Both buckets are present in every security object in this document but not in keys; labels MUST be unique within each map, a repeated label means the message MUST be rejected as malformed, and an attribute found in the protected bucket takes precedence over the unprotected bucket"
  - name: protected header bucket
    locator: "§3"
    encoding: CBOR
    cbor_tag: none
    structure: bstr
    fields:
      - name: wrapped header_map
        index: 0
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
        layout: "the header_map is CBOR-encoded first, then that encoding is placed inside a bstr; the bstr contents are transported verbatim and are the exact bytes fed to the cryptographic computation"
    layout: "one CBOR byte string; its contents are an encoded header_map, or nothing at all when there are no protected attributes"
    notes: "MUST be empty if it is not going to be included in a cryptographic computation; wrapping in a bstr avoids every party needing a common canonical map encoding, and a decode-and-re-encode by an intermediate breaks verification unless the bytes are identical"
  - name: unprotected header bucket
    locator: "§3"
    encoding: CBOR
    cbor_tag: none
    structure: map
    fields:
      - name: header_map
        index: 1
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0014"
        layout: "a bare CBOR map at the array position, with no bstr wrapper and no inclusion in any to-be-signed, to-be-MACed or to-be-encrypted byte string"
    layout: "one CBOR map; an empty unprotected bucket is the empty map, written h A0 in the examples as {}"
    notes: "Holds parameters about the current layer that are not cryptographically protected; only parameters that deal with the current layer belong at that layer"
  - name: header_map
    locator: "§3"
    encoding: CBOR
    cbor_tag: none
    structure: map
    fields:
      - name: Generic_Headers
        index: 0
        type: group
        required: false
        constrained_by:
          - "rfc-9052#R-0010"
        layout: "the six common header parameters of §3.1, each optional, spliced into the map"
      - name: label => values
        index: wildcard
        type: "label => any"
        required: false
        constrained_by:
          - "rfc-9052#R-0002"
          - "rfc-9052#R-0003"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0011"
          - "rfc-9052#R-0012"
          - "rfc-9052#R-0091"
          - "rfc-9052#R-0092"
        layout: "zero or more further entries; label = int / tstr and values = any CBOR value"
    layout: "header_map = { Generic_Headers, * label => values }; the same map type is used for both the protected and the unprotected bucket"
    notes: "A label that is neither a text string nor an integer is an error: applications may fail processing or ignore the incorrect label, but MUST NOT create messages with incorrect labels"
  - name: empty_or_serialized_map
    locator: "§3"
    encoding: CBOR
    cbor_tag: none
    structure: bstr
    fields:
      - name: serialized map form
        index: 0
        type: "bstr .cbor header_map"
        required: false
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
        layout: "a byte string whose contents are one encoded header_map data item"
      - name: empty form
        index: 0
        type: "bstr .size 0"
        required: false
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
        layout: "a zero-length byte string, written h in CBOR diagnostic notation as the empty byte string"
    layout: "empty_or_serialized_map = bstr .cbor header_map / bstr .size 0; exactly one of the two forms occupies the protected element"
    notes: "Empty-protected special case: senders SHOULD encode a zero-length map as a zero-length byte string rather than as a byte string holding the zero-length map h A0; recipients MUST accept both, and the zero-length byte string is shorter and is the form the Sig_structure, Enc_structure and MAC_structure use"
  - name: Generic_Headers
    locator: "§3.1 Table 3"
    encoding: CBOR
    cbor_tag: none
    structure: map
    fields:
      - name: alg
        index: 1
        type: "int / tstr"
        required: false
        constrained_by:
          - "rfc-9052#R-0015"
        layout: "map label 1, not an array index; value taken from the COSE Algorithms registry; may be in either bucket, but MUST be authenticated where the ability to do so exists, either by placing it in the protected bucket or by carrying it in the externally supplied data"
      - name: crit
        index: 2
        type: "[+ label]"
        required: false
        constrained_by:
          - "rfc-9052#R-0016"
          - "rfc-9052#R-0017"
          - "rfc-9052#R-0018"
          - "rfc-9052#R-0019"
          - "rfc-9052#R-0020"
          - "rfc-9052#R-0021"
          - "rfc-9052#R-0022"
          - "rfc-9052#R-0023"
        layout: "map label 2; array of one or more labels that MUST have at least one value; when present it MUST be placed in the protected bucket; integer labels 0 to 7 SHOULD be omitted, -1 to -128 can be omitted, -129 to -65536 SHOULD be included; naming a label whose parameter is not in the protected bucket is a fatal processing error"
      - name: content type
        index: 3
        type: "tstr / uint"
        required: false
        constrained_by:
          - "rfc-9052#R-0024"
          - "rfc-9052#R-0025"
        layout: "map label 3; uint values come from the CoAP Content-Formats registry, tstr values are type-name/subtype-name per §4.2 of RFC 6838 with no leading or trailing whitespace; belongs only in the content layer, never in a recipient or signature layer"
      - name: kid
        index: 4
        type: bstr
        required: false
        constrained_by:
          - "rfc-9052#R-0026"
        layout: "map label 4; matched against the kid member of a COSE_Key; internal structure undefined, values not assumed unique, not security critical, so it can be placed in the unprotected bucket"
      - name: IV
        index: 5
        type: bstr
        required: false
        constrained_by:
          - "rfc-9052#R-0027"
        layout: "map label 5; the full Initialization Vector, also called a nonce for some algorithms; can be placed in the unprotected bucket because modifying it makes AE and AEAD decryption fail"
      - name: Partial IV
        index: 6
        type: bstr
        required: false
        constrained_by:
          - "rfc-9052#R-0027"
          - "rfc-9052#R-0028"
          - "rfc-9052#R-0029"
        layout: "map label 6; message IV is built by left-padding the Partial IV with zeros to the algorithm IV length and XORing it with the Context IV (the Base IV of the key); can be placed in the unprotected bucket"
    layout: "Generic_Headers = ( ? 1 => int / tstr, ? 2 => [+label], ? 3 => tstr / int, ? 4 => bstr, ? ( 5 => bstr // 6 => bstr ) ); every parameter is optional in the map itself"
    notes: "IV (label 5) and Partial IV (label 6) MUST NOT both be present in the same security layer; parameter labels come from the IANA COSE Header Parameters registry, and counter signature label 7 from RFC 8152 must still be understood by new implementations"
  - name: COSE_Sign
    locator: "§4.1"
    encoding: CBOR
    cbor_tag: 98
    structure: array
    fields:
      - name: protected
        index: 0
        type: empty_or_serialized_map
        required: true
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
        layout: "bstr wrapping the CBOR-encoded protected header_map for the body; zero-length bstr when there are no protected body attributes"
      - name: unprotected
        index: 1
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0014"
        layout: "bare CBOR map, not wrapped"
      - name: payload
        index: 2
        type: "bstr / nil"
        required: true
        constrained_by:
          - "rfc-9052#R-0031"
        layout: "the serialized content wrapped in a bstr so it travels unchanged, or the CBOR nil value when the content is detached and supplied separately by the application"
      - name: signatures
        index: 3
        type: "[+ COSE_Signature]"
        required: true
        constrained_by:
          - "rfc-9052#R-0065"
        layout: "CBOR array of one or more COSE_Signature arrays; the element itself is a plain array, not wrapped in a bstr"
    layout: "4-element CBOR array, optionally tagged 98 as COSE_Sign_Tagged = #6.98(COSE_Sign); cose-type cose-sign, CoAP Content-Format 98"
    notes: "Content-level and signature-level header parameters are separated: body parameters live here, per-signature parameters live in each COSE_Signature; with a message-recovery signature algorithm the transmitted payload is a zero-length byte string rather than absent when all original bytes are recovered"
  - name: COSE_Signature
    locator: "§4.1"
    encoding: CBOR
    cbor_tag: none
    structure: array
    fields:
      - name: protected
        index: 0
        type: empty_or_serialized_map
        required: true
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
        layout: "bstr wrapping the CBOR-encoded protected header_map for this signer; zero-length bstr when empty; these are the bytes that become sign_protected in the Sig_structure"
      - name: unprotected
        index: 1
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0014"
        layout: "bare CBOR map, not wrapped"
      - name: signature
        index: 2
        type: bstr
        required: true
        constrained_by:
          - "rfc-9052#R-0030"
          - "rfc-9052#R-0032"
          - "rfc-9052#R-0043"
        layout: "the computed signature value as a byte string; algorithms MUST specify padding if the signature value is not a multiple of 8 bits"
    layout: "3-element CBOR array, never tagged; appears only as an element of the COSE_Sign signatures array"
    notes: "Signature algorithms are used with COSE_Signature and COSE_Sign1; the internal encoding of the signature bytes is defined by the algorithm document, not here"
  - name: COSE_Sign1
    locator: "§4.2"
    encoding: CBOR
    cbor_tag: 18
    structure: array
    fields:
      - name: protected
        index: 0
        type: empty_or_serialized_map
        required: true
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
        layout: "bstr wrapping the CBOR-encoded protected header_map; zero-length bstr when the map is empty; carries both content and signature parameters since there is only one pair of buckets"
      - name: unprotected
        index: 1
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0014"
        layout: "bare CBOR map, not wrapped"
      - name: payload
        index: 2
        type: "bstr / nil"
        required: true
        constrained_by:
          - "rfc-9052#R-0031"
        layout: "as in COSE_Sign: content wrapped in a bstr, or CBOR nil for detached content"
      - name: signature
        index: 3
        type: bstr
        required: true
        constrained_by:
          - "rfc-9052#R-0030"
          - "rfc-9052#R-0032"
          - "rfc-9052#R-0043"
        layout: "the computed signature value as a byte string"
    layout: "4-element CBOR array, optionally tagged 18 as COSE_Sign1_Tagged = #6.18(COSE_Sign1); cose-type cose-sign1, CoAP Content-Format 18"
    notes: "Not convertible to or from COSE_Sign: the Sig_structure context string differs (Signature1 versus Signature) so a converted structure fails verification; RFC 9052 removed all countersignature text, which moved to COSE-COUNTERSIGN"
  - name: COSE_Encrypt
    locator: "§5.1"
    encoding: CBOR
    cbor_tag: 96
    structure: array
    fields:
      - name: protected
        index: 0
        type: empty_or_serialized_map
        required: true
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
        layout: "bstr wrapping the CBOR-encoded protected header_map for the content layer; zero-length bstr when empty; authenticated by the content encryption algorithm through the Enc_structure"
      - name: unprotected
        index: 1
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0014"
        layout: "bare CBOR map, not wrapped; typically carries the IV"
      - name: ciphertext
        index: 2
        type: "bstr / nil"
        required: true
        constrained_by:
          - "rfc-9052#R-0047"
          - "rfc-9052#R-0066"
        layout: "the ciphertext encoded as a bstr with the authentication tag combined into it, or CBOR nil when the content is detached"
      - name: recipients
        index: 3
        type: "[+ COSE_recipient]"
        required: true
        constrained_by:
          - "rfc-9052#R-0048"
          - "rfc-9052#R-0067"
          - "rfc-9052#R-0074"
          - "rfc-9052#R-0080"
          - "rfc-9052#R-0099"
        layout: "CBOR array of one or more COSE_recipient arrays; a plain array, not wrapped in a bstr"
    layout: "4-element CBOR array, optionally tagged 96 as COSE_Encrypt_Tagged = #6.96(COSE_Encrypt); cose-type cose-encrypt, CoAP Content-Format 96"
    notes: "Two layers: the content layer here and the recipient layer in COSE_recipient, which carries the encrypted CEK; the five content key distribution methods are direct, symmetric KEK (key wrap), key agreement, key transport and passwords"
  - name: COSE_recipient
    locator: "§5.1"
    encoding: CBOR
    cbor_tag: none
    structure: array
    fields:
      - name: protected
        index: 0
        type: empty_or_serialized_map
        required: true
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0050"
          - "rfc-9052#R-0068"
          - "rfc-9052#R-0073"
          - "rfc-9052#R-0077"
        layout: "bstr wrapping the encoded protected header_map for this recipient; MUST be a zero-length bstr when the recipient algorithm provides no authenticated data, and AE key wrap requires verifying that it is zero-length"
      - name: unprotected
        index: 1
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0014"
          - "rfc-9052#R-0069"
          - "rfc-9052#R-0070"
          - "rfc-9052#R-0075"
          - "rfc-9052#R-0076"
          - "rfc-9052#R-0078"
          - "rfc-9052#R-0079"
          - "rfc-9052#R-0081"
          - "rfc-9052#R-0082"
          - "rfc-9052#R-0083"
          - "rfc-9052#R-0084"
          - "rfc-9052#R-0085"
          - "rfc-9052#R-0086"
          - "rfc-9052#R-0087"
        layout: "bare CBOR map, not wrapped; typically carries the recipient alg, kid and any ephemeral key"
      - name: ciphertext
        index: 2
        type: "bstr / nil"
        required: true
        constrained_by:
          - "rfc-9052#R-0048"
          - "rfc-9052#R-0054"
          - "rfc-9052#R-0071"
        layout: "the encrypted key as a bstr; all encoded keys are symmetric keys and the binary value of the key is the content; CBOR nil when there is no encrypted key, and the examples show a zero-length bstr for direct key agreement"
      - name: recipients
        index: 3
        type: "[+ COSE_recipient]"
        required: false
        constrained_by:
          - "rfc-9052#R-0067"
          - "rfc-9052#R-0072"
          - "rfc-9052#R-0074"
          - "rfc-9052#R-0080"
          - "rfc-9052#R-0099"
        layout: "nested array of one or more further COSE_recipient structures; the whole element is ABSENT, not nil, when there are no nested recipient structures"
    layout: "3-element CBOR array, or 4 elements when the optional nested recipients array is present; never tagged; used as an element of COSE_Encrypt recipients and COSE_Mac recipients"
    notes: "Recursive: Appendix B shows a three-layer message (content, key wrap of the CEK, then ECDH-ES to derive the KEK) where the nested element is a COSE_recipient inside a COSE_recipient. Naming trap carried over from the source: §8.5.1-§8.5.5 call this same structure COSE_Recipient with a capital R, and that is the spelling the §8.5 requirements quote verbatim; there is only one structure, and the CDDL rule name is COSE_recipient"
  - name: COSE_Encrypt0
    locator: "§5.2"
    encoding: CBOR
    cbor_tag: 16
    structure: array
    fields:
      - name: protected
        index: 0
        type: empty_or_serialized_map
        required: true
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0050"
        layout: "bstr wrapping the encoded protected header_map; zero-length bstr when empty, and AE algorithms require verifying that it is a zero-length byte string"
      - name: unprotected
        index: 1
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0014"
        layout: "bare CBOR map, not wrapped; the usual place for IV or Partial IV"
      - name: ciphertext
        index: 2
        type: "bstr / nil"
        required: true
        constrained_by:
          - "rfc-9052#R-0047"
          - "rfc-9052#R-0066"
        layout: "as in COSE_Encrypt: ciphertext with combined authentication tag as a bstr, or CBOR nil when detached"
    layout: "3-element CBOR array, optionally tagged 16 as COSE_Encrypt0_Tagged = #6.16(COSE_Encrypt0); cose-type cose-encrypt0, CoAP Content-Format 16"
    notes: "No recipient element at all: the key is known implicitly, so if a key must be identified to the recipient the enveloped COSE_Encrypt structure ought to be used instead; the CDDL in §5.2 prints a trailing comma after the ciphertext element"
  - name: COSE_Mac
    locator: "§6.1"
    encoding: CBOR
    cbor_tag: 97
    structure: array
    fields:
      - name: protected
        index: 0
        type: empty_or_serialized_map
        required: true
        constrained_by:
          - "rfc-9052#R-0006"
          - "rfc-9052#R-0007"
          - "rfc-9052#R-0008"
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
        layout: "bstr wrapping the encoded protected header_map; zero-length bstr when empty; these bytes become the protected element of the MAC_structure"
      - name: unprotected
        index: 1
        type: header_map
        required: true
        constrained_by:
          - "rfc-9052#R-0009"
          - "rfc-9052#R-0010"
          - "rfc-9052#R-0013"
          - "rfc-9052#R-0014"
        layout: "bare CBOR map, not wrapped"
      - name: payload
        index: 2
        type: "bstr / nil"
        required: true
        constrained_by: []
        layout: "the serialized content to be MACed wrapped in a bstr, or CBOR nil for detached content supplied separately by the application"
      - name: tag
        index: 3
        type: bstr
        required: true
        constrained_by:
          - "rfc-9052#R-0053"
          - "rfc-9052#R-0055"
        layout: "the MAC value as a byte string, placed here after computing it over ToBeMaced"
      - name: recipients
        index: 4
        type: "[+ COSE_recipient]"
        required: true
        constrained_by:
          - "rfc-9052#R-0054"
          - "rfc-9052#R-0067"
          - "rfc-9052#R-0074"
          - "rfc-9052#R-0080"
          - "rfc-9052#R-0099"
        layout: "CBOR array of one or more COSE_recipient arrays holding the MAC key, same structure as for COSE_Encrypt; a plain array, not wrapped"
    layout: "5-element CBOR array, optionally tagged 97 as COSE_Mac_Tagged = #6.97(COSE_Mac); cose-type cose-mac, CoAP Content-Format 97; note that tag precedes recipients"
    notes: "Uses the same recipient algorithm classes as encryption; the recipient context string for a recipient inside a MACed message is Mac_Recipient in the Enc_structure"
