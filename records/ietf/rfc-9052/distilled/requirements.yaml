note: >
  Ids are stable and never reused. Cite as rfc-9052#R-NNNN.
  All 53 BCP 14 occurrences in the source are carried verbatim across the text
  fields below, each exactly once. Quotes are de-wrapped from the RFC line
  layout, so a hyphenated word broken over a line reads as "zero- length"
  here, exactly as the de-wrapped source reads.
  A compound sentence that carries two keywords is split into two entries and
  the sentence is split with it, so no keyword is counted twice.
  Entries marked kind inferred carry no BCP 14 keyword in the source. The
  obligation is stated in lowercase prose or as a numbered procedure step, and
  the field value says which.
  Sections 10, 11 and 12 contain no BCP 14 keywords at all; their normative
  content appears here only as inferred entries.
  Appendix A deliberately does not use BCP 14 keywords (it states that the
  specification can provide recommendations, but cannot enforce them), so it
  is informative and no requirements are extracted from it.

