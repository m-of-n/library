distillation:
  standard: "FX-1"
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "185 verbatim entries N-001 to N-185, in source order, each with its section/¶ locator and source line range: §1 12 (BCP 14 conventions, SHOULD+/SHOULD-/MUST- definitions, §1.2 definitions, keyword-bearing §1.5–1.6 changelog items flagged changelog), §2 54, §3 70 (including the file-extension, smime-type, micalg and S/MIME-identification tables), §4 10 (key-size tables), §5 6 (both media-type templates and the smime-type registration), §6 19 (every paragraph), §7.1 1, Appendix A 2 (the ASN.1 module whole), Appendix B 11. BCP 14 reconciled 190 = 190 (MUST 82, SHOULD 84, MAY 12, MUST NOT 5, SHOULD NOT 4, RECOMMENDED 2, OPTIONAL 1) with no keyword line outside an entry; 22 entries flagged lowercase, and 46 of the 54 lowercase modals are in entries, the other 8 being front matter and two excluded paragraphs. Twelve entries cross a page break and are flagged. Excluded: front matter, overview, history and motivation paragraphs, changelog bullets with no keyword, sample messages (examples artifact), reference lists, Appendix C, Acknowledgements and Authors' Addresses. Source defects are recorded, not repaired."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "151 entries R-0001 to R-0151, one per BCP 14 statement from §1.1 to Appendix B.2, including all 8 in §6 Security Considerations, the 12 key-size table rows of §4.2–§4.5 and the Appendix A ASN.1 comment. Source count 190, extracted 152; the 38 left out are the §1.3 SHOULD+/SHOULD-/MUST- definitions (14), the §1.5/§1.6 change logs (23) and the ASN.1 OPTIONAL (1), each named by line in reconciliation and mechanically checked as the only keywords outside an entry. 151 stated, 0 inferred; 107 testable yes, 41 partial, 3 no. Nine sentences split; R-0046 is the only entry with two keywords. Source tensions are recorded at R-0037, R-0049, R-0108 and R-0125."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema/
      coverage: "Verbatim: the Appendix A ASN.1 module SecureMimeMessageV3dot1 (lines 3152-3243, page break and 3-space margin removed), the only ASN.1 in the source, plus inline.verbatim.txt with 13 formal displays (§1.3 levels, §2.5.1 year rule, §3.2.1, §3.2.2, §3.5.3.2 and §3.10 tables, §4.2-§4.5 key-size tables, §5.1-§5.3 IANA templates). Derived: smime-media-types JSON Schema (MUST rules, SHOULD rules as #should, §3.10 classifier as #identifies), multipart/signed Content-Type ABNF (the only place R-0117 is checkable), algorithm-requirements YAML for §2.1-§2.3, §2.7, §4.1-§4.5 and §B.2 (R-0151). 13 source defects recorded in README.md. JSON Schema valid against the 2020-12 metaschema and run against the source samples and negatives; ABNF parsed. Module structurally checked, not compiled (no ASN.1 compiler available); imported CMS modules not carried."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "44 messages, 199 fields (nested fields counted): the five CMS content types as profiled, SignerInfo and its attributes, all five smime-types, multipart/signed and application/pkcs7-signature, the canonical inner entity, message/rfc822 wrapping, §3.9, the §3.10 identification table, the §5 registrations, the Appendix A module and the Appendix B historic algorithms. 256 verbatim quotes, 6 encoding rules (BER vs DER unstated, ENC-01), 14 tensions. 144 of 151 R-ids wired; R-0001, R-0124 to R-0128 and R-0145 constrain no field."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "Store-and-forward: no exchange of its own. 13 roles, 22 flows, 126 steps, 36 error paths, 25 inferred; one Mermaid sequence diagram per flow and 6 decision flowcharts (plus the RSA key-size table) in protocol.md. Covers creation per operation, nesting, certs-only and registration, capability caching, §2.7.1 algorithm selection, §2.5.3.1 certificate selection, §4 certificate processing, §3.10 identification, gateway damage and trusted-gateway unwrap. 169 quotes verbatim, 143 R-ids wired, 17 source defects and tensions recorded. message_names_used lists 39 names, each resolved to a messages.yaml entry or field."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "11 machines, 90 states, 131 transitions (39 states and 43 transitions inferred), terminal states marked: message creation, multipart/signed in transport, receipt and unwrapping, SignerInfo verification, decryption, encryption-algorithm choice, multiple recipients, SMIMECapabilities and key-preference caches, recipient certificate selection, and the §1.3 requirement-level lifecycle across versions (M11, a document lifecycle, said so). 39 triggers (15 messages, 24 events), each message trigger resolved to a messages.yaml entry. 10 lifecycles with no source basis under not_modelled; 13 source tensions."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/
      coverage: "47 vectors: 16 from the source, 31 constructed from stated rules. 7 verbatim fixtures (§3.1.4, §3.3, §3.4, §3.5.2, §3.5.3.3 message and digested hex, §3.6), LF as printed, CRLF required by §3.1.1 noted; 10 derived decodes and asn1parse dumps. §3.5.2 verifies under its embedded certificate; §3.5.3.3 cannot be verified (no signer certificate printed) and its signed digest is not the SHA-256 of the printed content (S-02); §3.6 is a bare zlib stream, not CompressedData (S-01). 10 source defects recorded."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "An audit in both directions, mapped to ARCH, ADR, DEC, MD and R ids: 11 adopt, 8 adapt, 7 reject, each mapped to an ARCH, ADR, DEC or MD id or stating that none at 643fba2 fits (adopt 4, adopt 9); a mapping table with a row for each bears_on id (R-I-01, R-I-05) plus R-I-02, R-I-03, R-M-01, R-M-02, R-M-05, R-M-07, R-O-01 to R-O-03, R-O-05 (proposed), R-M-12, ARCH-0002 P1, P2, P5, P6, G1, NG5, DEC-002, DEC-003, DEC-005, DEC-008, ADR-0003 D2, SPEC-0001 to SPEC-0004, UC-5, MD-1 and ARCH-0003 §7, and a draft R-I-01 import table for S/MIME signed messages. MD-3 addressed: a structure-by-structure CMS mapping (a non-mapping; import is translation), DEC-002 options scored, and three places RFC 8551 cuts against option 5, all toward option 2 (algorithm registry upkeep, installed-base interop, parallel signatures for the post-quantum transition), with one weak cut toward option 3 and where it favours option 5. The usefulness verdict is tested: no delegation and no trust model holds, but 'deferring certificates entirely' overstates (R-0124). 18 open questions; CMS rows marked as outside this source, pending an rfc-5652 record; source defects recorded, not repaired; bears_on corrections proposed, record.yaml not edited. Our decisions read from m-of-n 643fba2; 278 quotes checked mechanically (120 RFC 8551, 146 m-of-n at 643fba2, 12 library artifacts). Decides nothing."
      reviewed_by: ""
