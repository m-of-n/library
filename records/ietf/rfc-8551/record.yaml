usefulness:
  verdict: useful
  reason: "It is a column in #14's table and the honest finding is a negative one: S/MIME 4.0 specifies no delegation and no trust model, deferring certificates entirely. Recording that is what stops the report inventing an S/MIME delegation story."
  assessed: "2026-10-08"
