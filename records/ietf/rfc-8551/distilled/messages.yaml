        constrained_by:
          - rfc-8551#R-0109
          - rfc-8551#R-0110
          - rfc-8551#R-0111
    layout: "Content-Type: application/pkcs7-mime; smime-type=<token>"
    constrained_by:
      - rfc-8551#R-0101
      - rfc-8551#R-0109

