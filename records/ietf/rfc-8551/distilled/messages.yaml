  - name: SMIMECapability
    id: MSG-11
    kind: asn1-type
    locator: "Appendix A"
    source: "Appendix A (lines 3183-3185); §2.5.2 (lines 860-937)"
    normative_status: defined
    asn1_type: SEQUENCE
    encoding: Fixed per algorithm and compared by octets (ENC-06).
    quotes:
      - at: "Appendix A"
        text: 'SMIMECapability ::= SEQUENCE { capabilityID OBJECT IDENTIFIER, parameters ANY DEFINED BY capabilityID OPTIONAL }'
      - at: "§2.5.2"
        text: 'The presence of an SMIMECapability attribute containing an algorithm implies that the sender can deal with the algorithm as well as understand the ASN.1 structures associated with that algorithm.'
    fields:
      - name: capabilityID
        type: OBJECT IDENTIFIER
        required: true
        constraints: >-
          The algorithm's own OID where unambiguous (R-0043); where one OID names several
          algorithms, one algorithm keeps it and the others get new OIDs under smimeCapabilities,
          assigned by the maintainer of the registered list (R-0044, R-0045).
        values:
          - {value: sha256WithRSAEncryption, category: signature algorithm, source: "§2.5.2 example"}
          - {value: AES-128 CBC, category: symmetric algorithm, source: "§2.5.2 example"}
          - {value: AES-128 GCM, category: authenticated symmetric algorithm, source: "§2.5.2 example"}
          - {value: rsaEncryption, category: key encipherment algorithm, source: "§2.5.2 example"}
          - {value: id-cap-preferBinaryInside, category: feature, source: "Appendix A, MSG-12"}
          - {value: "the CompressedData capability", category: feature, source: "§3.6 points to RFC 3274; not defined here"}
        quotes:
          - at: "§2.5.2"
            text: 'There are also several identifiers that indicate support for other optional features such as binary encoding and compression.'
          - at: "§2.5.2"
            text: 'For instance, in an earlier specification, rsaEncryption was ambiguous because it could refer to either a signature algorithm or a key encipherment algorithm.'
        constrained_by:
          - rfc-8551#R-0043
          - rfc-8551#R-0044
          - rfc-8551#R-0045
      - name: parameters
        type: ANY DEFINED BY capabilityID
        required: conditional
        required_when: >-
          ASN.1 OPTIONAL. Present with every parameter needed to tell two instances of the same
          algorithm apart (R-0042), for example key lengths of variable-length ciphers; omitted,
          never NULL, when there is nothing to differentiate (R-0046); but see TEN-01.
        quotes:
          - at: "§2.5.2"
            text: 'The registered SMIMECapabilities list specifies the parameters for OIDs that need them, most notably key lengths in the case of variable-length symmetric ciphers.'
        constrained_by:
          - rfc-8551#R-0042
          - rfc-8551#R-0046
          - rfc-8551#R-0041
    layout: "30 L { 06 L <capabilityID> [ <parameters TLV> ] }; the tag octets are inferred from X.690 (SEQUENCE 30, OBJECT IDENTIFIER 06)."
    constrained_by:
      - rfc-8551#R-0041
      - rfc-8551#R-0042
      - rfc-8551#R-0046

