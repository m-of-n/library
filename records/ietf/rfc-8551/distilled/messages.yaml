      - rfc-8551#R-0060

  - name: EnvelopedData
    id: MSG-15
    kind: cms-content-type
    locator: "§2.4.3"
    source: "§2.4.3 (lines 760-763); §2.4.1 (lines 744-748); §3.3 (lines 1578-1621); §6 (lines 2540-2546)"
    normative_status: profiled
    asn1_type: not-stated (RFC 5652 §6)
    encoding: Source silent (ENC-01).
    quotes:
      - at: "§2.4.3"
        text: 'This content type is used to apply data confidentiality to a message.'
      - at: "§2.4.3"
        text: 'In order to distribute the symmetric key, a sender needs to have access to a public key for each intended message recipient to use this service.'
      - at: "§3.3"
        text: 'The "enveloped-only" structure does not support authenticated symmetric algorithms.'
      - at: "§6"
        text: 'Modification of the ciphertext in EnvelopedData can go undetected if authentication is not also used, which is the case when sending EnvelopedData without wrapping it in SignedData or enclosing SignedData within it.'
    fields:
      - name: recipientInfos
        type: not-stated (RFC 5652 §6.1, a SET OF RecipientInfo; pointer); each carries a KeyEncryptionAlgorithmIdentifier (MSG-18)
        required: true
        constraints: >-
          One encrypted copy of the CEK per recipient, and a copy for the originator (R-0112).
          Recipient key-management certificate chosen per §2.5.3.1 (R-0058 to R-0060).
        quotes:
          - at: "§3.3"
            text: 'In addition to encrypting a copy of the content-encryption key (CEK) for each recipient, a copy of the CEK SHOULD be encrypted for the originator and included in the EnvelopedData (see [RFC5652], Section 6).'
        inferred: true
        inferred_reason: the source speaks of a copy of the CEK for each recipient and never names the component; recipientInfos is RFC 5652's name.
        constrained_by:
          - rfc-8551#R-0112
          - rfc-8551#R-0058
          - rfc-8551#R-0060
      - name: encryptedContentInfo
        type: EncryptedContentInfo (MSG-19)
        required: true
        constrained_by:
          - rfc-8551#R-0023
          - rfc-8551#R-0024
    components_not_profiled: Source silent on every other EnvelopedData component (RFC 5652 §6.1).
    layout: >-
      ContentInfo { id-envelopedData | [0] EnvelopedData { ... recipientInfos { one per recipient,
      plus the originator } | encryptedContentInfo { id-data | contentEncryptionAlgorithm |
      encryptedContent } } }.
    sample_evidence:
      inferred: true
      inferred_reason: >-
        Decoded §3.3 sample: one recipient (issuer CN CarlRSA) with key-encryption algorithm
        1.2.840.113549.1.1.1 with NULL parameters and a 128-octet encrypted key (a 1024-bit
        modulus, below §4.4); encryptedContentInfo contentType 1.2.840.113549.1.7.1,
        contentEncryptionAlgorithm 1.2.840.113549.3.7 (DES EDE3 CBC, dropped per §B.3) with an
        8-octet IV. TEN-12.
    constrained_by:
      - rfc-8551#R-0023
      - rfc-8551#R-0024
      - rfc-8551#R-0112

