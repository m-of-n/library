        constraints: >-
          A partial list; listed in order of preference; SHOULD be grouped by category (R-0040,
          R-0150). Unrecognized values are handled gracefully (R-0047).
        quotes:
          - at: "§2.5.2"
            text: 'The semantics of the SMIMECapabilities attribute specify a partial list as to what the client announcing the SMIMECapabilities can support.'
          - at: "§2.5.2"
            text: 'In an SMIMECapabilities attribute, the OIDs are listed in order of their preference but SHOULD be separated logically along the lines of their categories (signature algorithms, symmetric algorithms, key encipherment algorithms, etc.).'
          - at: "Appendix A"
            text: 'Algorithms SHOULD be ordered -- by preference and grouped by type.'
        constrained_by:
          - rfc-8551#R-0040
          - rfc-8551#R-0047
          - rfc-8551#R-0150
    uses: >-
      Receivers build and update a capabilities list for each sender's public key from it (R-0067 to R-0072); senders
      choose the content-encryption algorithm from it (R-0077, R-0078) and may learn binary
      handling from id-cap-preferBinaryInside (R-0095).
    layout: "Attribute { 1.2.840.113549.1.9.15 | SET { SEQUENCE OF SMIMECapability { capabilityID | [parameters] } } }"
    notes: The source calls it an SMIMECapability attribute once (§2.5.2, line 864) and SMIME capabilities in the §2.5 list.
    constrained_by:
