          - at: "§3.5.3.3"
            text: 'Content-Type: application/pkcs7-signature; name=smime.p7s'
        notes: TEN-07 (name parameter while the registration lists none).
        constrained_by:
          - rfc-8551#R-0107
      - name: Content-Transfer-Encoding
        type: MIME header field
        required: not-stated
        literal: base64
      - name: Content-Disposition
        type: MIME header field
        required: false
        literal: "attachment; filename=smime.p7s"
        quotes:
          - at: "§3.5.3.3"
            text: 'Content-Disposition: attachment; filename=smime.p7s'
        constrained_by:
          - rfc-8551#R-0104
      - name: body
        name_kind: synthetic
        type: base64(ContentInfo { SignedData (MSG-03) with eContent absent })
        required: true
        quotes:
          - at: "§3.5.3.1"
            text: 'The SignedData encapContentInfo eContent field MUST be absent.'
        constrained_by:
          - rfc-8551#R-0115
          - rfc-8551#R-0022
    layout: "MIME header CRLF CRLF base64 → ContentInfo → SignedData { encapContentInfo { id-data } (no eContent) | certificates | signerInfos { SignerInfo over the first part } }"
    constrained_by:
      - rfc-8551#R-0115

  - name: multipart/signed (S/MIME clear-signed message)
    id: MSG-36
    kind: smime-message
    locator: "§3.5.3"
    source: "§3.5.3 (lines 1826-1834); §3.5.3.2 (lines 1855-1938); §3.5.3.3 (lines 1967-1998); §3.1.3 (lines 1356-1388); §3.5.1 (lines 1751-1757)"
    normative_status: defined
    encoding: >-
      RFC 1847 multipart/signed with two body parts. The entity is transfer-encoded to 7-bit when
      carried over SMTP or another 7-bit transport (R-0097); RFC 1847 prohibits changing the
      transfer encoding of the first part (§3.1.3).
    quotes:
      - at: "§3.5.3"
        text: 'The multipart/signed media type has two parts.'
      - at: "§3.5.3"
        text: 'The first part contains the MIME entity that is signed; the second part contains the "detached signature" CMS SignedData object in which the encapContentInfo eContent field is absent.'
      - at: "§3.5.3.2"
        text: 'The multipart/signed Content-Type has two required parameters: the protocol parameter and the micalg parameter.'
      - at: "§3.5"
        text: 'In general, the multipart/signed form is preferred for sending, and receiving agents MUST be able to handle both.'
    fields:
      - name: Content-Type
        type: MIME header field
        required: true
        literal: multipart/signed
        quotes:
          - at: "§3.5.3.3"
            text: 'Content-Type: multipart/signed; micalg=sha-256; boundary="----=_NextBoundary____Fri,_06_Sep_2002_00:25:21"; protocol="application/pkcs7-signature"'
        fields:
          - name: protocol
            type: MIME parameter, quoted-string
            required: true
            literal: '"application/pkcs7-signature"'
            constraints: the value is exactly application/pkcs7-signature (R-0116) and is quoted because it contains / (R-0117).
            quotes:
              - at: "§3.5.3.2"
                text: 'The protocol parameter MUST be "application/pkcs7-signature".'
            constrained_by:
              - rfc-8551#R-0116
              - rfc-8551#R-0117
          - name: micalg
            type: MIME parameter, comma-separated tokens (MSG-37)
            required: true
            constraints: one value per message digest algorithm used, comma-separated (R-0118), from the table (R-0119); receivers recover gracefully from unknown values (R-0120).
            constrained_by:
              - rfc-8551#R-0118
              - rfc-8551#R-0119
              - rfc-8551#R-0120
          - name: boundary
            type: MIME parameter
            required: true
            inferred: true
            inferred_reason: the source never mentions the boundary parameter; it appears only in the §3.5.3.3 sample, and multipart syntax is MIME's (RFC 2046, pointer).
      - name: first body part
        name_kind: synthetic
        type: the signed MIME entity (MSG-25)
        required: true
        constraints: >-
          Prepared per §3.1 with special care for clear-signing and inserted with no further
          processing; 7-bit transfer-encoded for a 7-bit transport (R-0097). Its octets are the
          signed content (no eContent in the SignedData).
        quotes:
          - at: "§3.5.3.2"
            text: 'The MIME entity is inserted into the first part of a multipart/signed message with no processing other than that described in Section 3.1.'
          - at: "§3.5.3.3"
            text: 'The content that is digested (the first part of the multipart/signed) consists of the bytes:'
          - at: "§3.5.3.3"
            text: '54 68 69 73 20 69 73 20 73 6f 6d 65 20 73 61 6d 70 6c 65 20 63 6f 6e 74 65 6e 74 2e 0d 0a'
        constrained_by:
          - rfc-8551#R-0097
          - rfc-8551#R-0085
          - rfc-8551#R-0093
      - name: second body part
        name_kind: synthetic
        type: application/pkcs7-signature entity (MSG-35)
        required: true
        quotes:
          - at: "§3.5.3.2"
            text: 'The MIME entity of the application/pkcs7-signature is inserted into the second part of the multipart/signed entity.'
        constrained_by:
          - rfc-8551#R-0115
    layout: >-
      Content-Type: multipart/signed; protocol="application/pkcs7-signature"; micalg=<tokens>;
      boundary=<b> CRLF CRLF [preamble] --<b> CRLF <first part: signed MIME entity> CRLF --<b> CRLF
      <second part: application/pkcs7-signature entity> CRLF --<b>-- . The delimiter syntax is
      RFC 2046's (pointer); the sample carries a one-line preamble.
    sample_notes: >-
      The §3.5.3.3 first part has an empty header section; the printed digested octets are the
      28 octets of the body line followed by 0D 0A (30 octets). Which CRLF belongs to the delimiter
      is RFC 2046's rule and the source does not state it.
    sample_evidence:
      inferred: true
      inferred_reason: computed in the scratchpad, the messageDigest attribute of the decoded §3.5.3.3 signature does not equal the SHA-256 of the printed 30 octets (TEN-13).
    constrained_by:
      - rfc-8551#R-0114
      - rfc-8551#R-0116
      - rfc-8551#R-0117
      - rfc-8551#R-0118
      - rfc-8551#R-0119
      - rfc-8551#R-0097

  - name: micalg parameter values
    id: MSG-37
    kind: mime-parameter
    locator: "§3.5.3.2"
    source: "§3.5.3.2 (lines 1911-1938)"
    normative_status: defined
    encoding: token, or comma-separated tokens when several digest algorithms are used.
    quotes:
      - at: "§3.5.3.2"
        text: 'The value of the micalg parameter is dependent on the message digest algorithm(s) used in the calculation of the Message Integrity Check.'
      - at: "§3.5.3.2"
        text: 'The values to be placed in the micalg parameter SHOULD be from the following:'
      - at: "§3.5.3.2"
        text: 'Future values for this parameter will be taken from the IANA "Hash Function Textual Names" registry.'
    fields:
      - {name: md5, name_kind: synthetic, type: token, algorithm: "MD5 (historical)", constrained_by: [rfc-8551#R-0119]}
      - {name: sha-1, name_kind: synthetic, type: token, algorithm: "SHA-1 (historical)", constrained_by: [rfc-8551#R-0119]}
      - {name: sha-224, name_kind: synthetic, type: token, algorithm: SHA-224, constrained_by: [rfc-8551#R-0119]}
      - {name: sha-256, name_kind: synthetic, type: token, algorithm: SHA-256, constrained_by: [rfc-8551#R-0119]}
      - {name: sha-384, name_kind: synthetic, type: token, algorithm: SHA-384, constrained_by: [rfc-8551#R-0119]}
      - {name: sha-512, name_kind: synthetic, type: token, algorithm: SHA-512, constrained_by: [rfc-8551#R-0119]}
      - name: any other
        name_kind: synthetic
        type: token
        algorithm: defined separately in the algorithm profile, or unknown if not defined
        constrained_by:
          - rfc-8551#R-0119
          - rfc-8551#R-0120
      - name: unknown
        name_kind: synthetic
        type: token
        literal: unknown
        algorithm: any other algorithm when no value is defined separately in the algorithm profile (table row Any other, lines 1927-1928)
        constrained_by:
          - rfc-8551#R-0119
          - rfc-8551#R-0120
    table_lines: "§3.5.3.2, lines 1919-1931"
    notes: >-
      The table lists sha-224 and sha-384, which §2.1 does not list as digest algorithms. The
      historical values rsa-md5, rsa-sha1 and sha1 are under MSG-20.
    layout: "micalg=<token>[,<token>...]"
    constrained_by:
      - rfc-8551#R-0118
      - rfc-8551#R-0119
      - rfc-8551#R-0120

  - name: Nested S/MIME (multiple operations)
    id: MSG-38
    kind: composition
    locator: "§3.7"
    source: "§3.7 (lines 2042-2087); §3 (lines 1169-1173)"
    normative_status: profiled
    encoding: each layer is one of the S/MIME formats above, used as the inner MIME entity of the next.
    quotes:
      - at: "§3.7"
        text: 'The signed-only, enveloped-only, and compressed-only MIME formats can be nested.'
      - at: "§3.7"
        text: 'It is possible to apply any of the signing, encrypting, and compressing operations in any order.'
      - at: "§3"
        text: 'ESS provides a description of how a triple-wrapped S/MIME message is formatted using multipart/signed and application/pkcs7-mime for the signatures.'
    fields:
      - name: inner layer
        name_kind: synthetic
        type: an S/MIME MIME entity (MSG-29 to MSG-33, MSG-36) used as the inner MIME entity of the outer layer
        required: true
        constraints: receivers process arbitrarily nested S/MIME within reasonable resource limits (R-0121); each encrypted or signed piece is a separate origin (R-0149).
        constrained_by:
          - rfc-8551#R-0121
          - rfc-8551#R-0149
    layout: "outer S/MIME entity → CMS → inner S/MIME entity → CMS → ... → innermost canonical MIME entity"
    constrained_by:
      - rfc-8551#R-0121

