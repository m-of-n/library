# ---------------------------------------------------------------------------
applicability: >-
  RFC 8551 is a profile, not a definition, of its two encoding layers. The CMS layer (ContentInfo,
  SignedData, EnvelopedData, AuthEnvelopedData, CompressedData, SignerInfo, the attribute syntax) is
  defined in RFC 5652, RFC 5083 and RFC 3274, and this document only constrains which content types
  are used (§2.4), which algorithm identifiers are supported (§2.1, §2.2, §2.3, §2.7), which signed
  attributes are generated and how many instances are allowed (§2.5), and which components are
  present or absent in each S/MIME format (§2.4.1, §3.5.3.1, §3.8). The MIME layer
  (application/pkcs7-mime, application/pkcs7-signature, multipart/signed, the smime-type, name,
  protocol and micalg parameters) is defined here, with multipart/signed itself taken from RFC 1847
  and MIME from the [MIME-SPEC] set. The only ASN.1 this document defines is the Appendix A module
  SecureMimeMessageV3dot1 (DEFINITIONS IMPLICIT TAGS, 1988 ASN.1): SMIMECapability,
  SMIMECapabilities, SMIMEEncryptionKeyPreference, SMIMECapabilitiesParametersForRC2CBC and the
  OIDs id-aa, smimeCapabilities, id-aa-encrypKeyPref, id-smime, id-cap and
  id-cap-preferBinaryInside. Every other CMS component named below is named because the source
  names it; where the source names a structure but none of its components, the entry says so and
  points to the defining RFC by number instead of importing its content. The source never states
  whether a CMS object is encoded in BER or DER (§1.2 defines both terms and nothing else uses
  them); that silence is recorded per entry. Out of scope because the source does not define
  them: certificate formats and certificate handling (RFC 8550, pointed to from §4), the ESS
  attributes and signed receipts (RFC 2634, RFC 5035), and the per-algorithm parameter encodings
  (RFC 3370, RFC 3565, RFC 4056, RFC 3560, RFC 5084, RFC 5753, RFC 5754, RFC 8418, RFC 8419).
  §3.9 registration requests are recorded as an entry because the source names the
  application/pkcs10 body part, but S/MIME v4.0 defines no request format.

# ---------------------------------------------------------------------------
note: >-
  Conventions. (1) Every quotes item is {at, text}: text is verbatim from the source with the RFC
  line wrapping undone (a line break and the following indent become one space) and page furniture
  removed; the two spaces the RFC sets after a full stop inside a line are kept; nothing else is
  altered, the source's own spellings included. No quote crosses a blank line or a page break. at is
  the section whose text contains the quote, written as requirements.yaml writes locators (§2.5.2,
  §B.2, Appendix A). Every quote was checked mechanically against the source and against its at
  section. (2) Text outside quotes (description, constraints, notes, layout) is this file's own
  wording and contains no quotation. Bare protocol tokens in values, literal and oid (media types,
  parameter values, file extensions, ASN.1 value notation) are copied from the source as tokens.
  (3) inferred: true marks anything not literally stated in the source, with inferred_reason. Three
  kinds occur: a CMS component identifier the source does not print, named only as a pointer to
  the RFC that defines it so that requirements can be wired to it; a dotted OID derived from the
  arcs the source prints in Appendix A (oid_dotted_inferred: true); and a value read off the
  source's own base64 samples (§3.3, §3.4, §3.5.2, §3.5.3.3, §3.6) by decoding them in the
  scratchpad, never from another document. (4) required is true, false, conditional or
  not-stated. For CMS components the ASN.1 optionality lives in RFC 5652 and is not printed here,
  so required says what this profile says and is not-stated when the source is silent; presence
  carries the BCP 14 level where the profile states one. For MIME header fields and parameters,
  required follows the §5 registrations and the §3 text. (5) constrained_by lists
  rfc-8551#R-NNNN ids from distilled/requirements.yaml whose text binds the field or the entry:
  first a requirement whose text this file quotes about the field, then a requirement at the same
  locator whose object names the field. constrained_by_locators lists rules that bind the field
  but carry no BCP 14 keyword. Message-level constrained_by binds the structure as a whole.
  (6) oid gives the source's ASN.1 value notation where Appendix A prints one (comment markers
  removed where the source prints the notation inside an ASN.1 comment, which the entry says);
  oid_dotted is inferred from the printed arcs. (7) normative_status: profiled (this document
  constrains a structure defined elsewhere); defined (defined here, in Appendix A or in §3);
  referenced (named and delegated, nothing profiled); historic (Appendix B); registration (§5);
  not-defined (named but deliberately not specified). (8) layout gives the structural nesting from
  the outermost MIME header to the innermost content. CMS gives no fixed byte layout beyond ASN.1
  TLV; the only octet-level material the source prints is the base64 of its samples and the hex of
  the §3.5.3.3 digested content, cited where they evidence a structure. (9) name_kind: synthetic
  marks a field whose name labels a value, an algorithm or a MIME part and is not an ASN.1
  component identifier or a MIME header or parameter name. (10) Coverage of requirements.yaml is
  stated in coverage below.

# ---------------------------------------------------------------------------
# Encoding rules that apply across structures. Each is cited by the entries it binds.
encoding_rules:
  - id: ENC-01
    rule: ASN.1 encoding of the CMS objects is not stated
    locator: "§1.2"
    quotes:
      - at: "§1.2"
        text: 'Basic Encoding Rules for ASN.1, as defined in ITU-T Recommendation X.690 [X.690].'
      - at: "§1.2"
        text: 'Distinguished Encoding Rules for ASN.1, as defined in ITU-T Recommendation X.690 [X.690].'
      - at: "§3.2"
        text: 'Since CMS content types are binary data, in most cases base64 transfer encoding is appropriate -- in particular, when used with SMTP transport.'
    description: >-
      Source silent. §1.2 defines BER and DER; outside §1.2 the terms occur only in the §1.6
      change note (line 511, references updated to X.690) and the [X.690] reference title
      (lines 2884-2886), so the document never says which rules a ContentInfo or any structure
      inside it is encoded with. The rule is RFC 5652's (pointer only). The SMIMECapability rule (ENC-06) is the
      one place the source requires a specific octet sequence. Appendix A is a 1988-syntax module
      with DEFINITIONS IMPLICIT TAGS.
    inferred_observation:
      inferred: true
      inferred_reason: >-
        Decoding the base64 samples of §3.3, §3.4, §3.5.2 and §3.5.3.3 shows definite-length
        encodings (each ContentInfo begins 30 82); that is consistent with DER and with
        definite-length BER, and the source states neither.
  - id: ENC-02
    rule: outer transfer encoding of the CMS object
    locator: "§3.2"
    quotes:
      - at: "§3.2"
        text: 'Note that this discussion refers to the transfer encoding of the CMS object or "outside" MIME entity.'
      - at: "§3.2"
        text: 'It is completely distinct from, and unrelated to, the transfer encoding of the MIME entity secured by the CMS object -- the "inside" object, which is described in Section 3.1.'
    description: >-
      base64 in most cases, and with SMTP in particular (ENC-01 quote). §3.2 also says the
      transfer encoding depends on the transport and is not a characteristic of the media type
      (that sentence crosses a page break, lines 1454-1464, so it is not quoted). Every sample in
      §3.3 to §3.6 carries Content-Transfer-Encoding: base64.
    constrained_by_locators:
      - "§3.2 lines 1452-1464 (no BCP 14 keyword)"
  - id: ENC-03
    rule: transfer encoding of the inner (secured) MIME entity
    locator: "§3.1.2"
    quotes:
      - at: "§3.1.2"
        text: 'When generating any of the secured MIME entities below, except the signing using the multipart/signed format, no transfer encoding is required at all.'
      - at: "§3.1.2"
        text: 'If no Content-Transfer-Encoding header field is present, the transfer encoding is presumed to be 7BIT.'
      - at: "§3.1.3"
        text: 'MIME entities that are already 7-bit data need no transfer encoding.'
      - at: "§3.1.3"
        text: 'Entities such as 8-bit text and binary data can be encoded with quoted-printable or base64 transfer encoding.'
      - at: "§3.1.3"
        text: '[RFC1847] prohibits an agent from changing the transfer encoding of the first part of a multipart/signed message.'
    description: >-
      Every S/MIME implementation, sending and receiving agents alike, deals with binary MIME
      objects (R-0092). Senders use 7-bit-safe transfer encoding as
      a rule (R-0093) and whenever any recipient cannot handle, or is not known to handle, inner
      binary (R-0096); binary inside when all recipients are known to handle it (R-0094), known by
      id-cap-preferBinaryInside, prior agreement or other means (R-0095). A multipart/signed sent
      over a 7-bit transport is transfer-encoded to 7-bit (R-0097).
    constrained_by:
      - rfc-8551#R-0092
      - rfc-8551#R-0093
      - rfc-8551#R-0094
      - rfc-8551#R-0095
      - rfc-8551#R-0096
      - rfc-8551#R-0097
  - id: ENC-04
    rule: canonical form of the inner MIME entity
    locator: "§3.1.1"
    quotes:
      - at: "§3.1.1"
        text: 'The exact details of canonicalization depend on the actual media type and subtype of an entity and are not described here.'
      - at: "§3.1.1"
        text: 'The line ending MUST be the pair of characters <CR><LF>, and the charset SHOULD be a registered charset [CHARSETS].'
      - at: "§3.1.4"
        text: 'The line ending of the MIME headers, the text, and the transfer-encoded parts all MUST be <CR><LF>.'
    description: >-
      Canonicalization applies to signing, enveloping and compressing alike. Only text has a rule
      stated here: CRLF line endings and a canonicalized, registered charset; every other media
      type defers to its own standard (R-0087).
    constrained_by:
      - rfc-8551#R-0085
      - rfc-8551#R-0086
      - rfc-8551#R-0087
      - rfc-8551#R-0088
      - rfc-8551#R-0089
      - rfc-8551#R-0090
      - rfc-8551#R-0091
      - rfc-8551#R-0098
  - id: ENC-05
    rule: data classes that decide the transfer encoding
    locator: "§1.2"
    quotes:
      - at: "§1.2"
        text: 'Text data with lines less than 998 characters long, where none of the characters have the 8th bit set, and there are no NULL characters.  <CR> and <LF> occur only as part of a <CR><LF> end-of-line delimiter.'
      - at: "§1.2"
        text: 'Text data with lines less than 998 characters, and where none of the characters are NULL characters.  <CR> and <LF> occur only as part of a <CR><LF> end-of-line delimiter.'
      - at: "§1.2"
        text: 'Arbitrary data.'
      - at: "§1.2"
        text: 'A reversible transformation made on data so 8-bit or binary data can be sent via a channel that only transmits 7-bit data.'
    description: >-
      The §1.2 definitions of 7-bit data, 8-bit data, binary data and transfer encoding, in that
      order. ENC-03 and the multipart/signed entry apply them.
  - id: ENC-06
    rule: SMIMECapability values are compared by their encoding
    locator: "§2.5.2"
    quotes:
      - at: "§2.5.2"
        text: 'The structure of the SMIMECapabilities attribute is to facilitate simple table lookups and binary comparisons in order to determine matches.'
      - at: "§2.5.2"
        text: 'For instance, the encoding for the SMIMECapability for sha256WithRSAEncryption includes rather than omits the NULL parameter.'
      - at: "§2.5.2"
        text: 'In the event that there are no differentiating parameters for a particular OID, the parameters MUST be omitted and MUST NOT be encoded as NULL.'
    description: >-
      Capabilities match by binary comparison, so the encoding of each SMIMECapability is fixed per
      algorithm and algorithm specifications should print it (R-0041). Parameters with no
      differentiating content are omitted, never NULL (R-0046).
    notes: >-
      Source tension TEN-01: the sha256WithRSAEncryption example includes a NULL parameter, while
      the MUST of the same section says a capability with no differentiating parameters omits them
      and never encodes NULL. The source does not say that the NULL of sha256WithRSAEncryption
      differentiates anything. Kept as printed.
    constrained_by:
      - rfc-8551#R-0041
      - rfc-8551#R-0042
      - rfc-8551#R-0046

# ---------------------------------------------------------------------------
# Source defects and tensions found while extracting the structures. Never repaired here.
source_tensions:
  - id: TEN-01
    where: "§2.5.2"
    what: >-
      The sha256WithRSAEncryption capability example includes a NULL parameter; R-0046 requires
      parameters with no differentiating content to be omitted and never encoded as NULL. See
      ENC-06.
  - id: TEN-02
    where: "§2.5.2, §2.5.3"
    what: >-
      The sentences behind R-0037 and R-0049, read literally, make the SMIMECapabilities and the
      SMIMEEncryptionKeyPreference attribute mandatory in every signerInfo, against the If present
      that opens each paragraph and the SHOULD of §2.5. Already recorded on R-0037 and R-0049; this
      file models presence as optional with at most one instance and says so on each entry.
  - id: TEN-03
    where: "§2.4.1"
    what: >-
      The sentence behind R-0022 says the media type is stored in the eContent OCTET STRING; every
      other sentence (§2.4.1 for EnvelopedData, §3.2, §3.5.2) has the MIME entity there. This file
      models eContent as carrying the MIME entity and keeps the quote as printed.
  - id: TEN-04
    where: "§3.2.2"
    what: >-
      Guideline 1 assigns the triple signed-*, authEnv-* and enveloped-*, but the value the
      document itself defines and registers (§3.2.2 table, §5.3) is authEnveloped-data, which does
      not have the authEnv- prefix.
  - id: TEN-05
    where: "§3.2.2"
    what: >-
      Guideline 3 is about a common string for a content OID, but its example,
      OID.2.16.840.1.101.3.4.1.2, is the AES-128 CBC content-encryption algorithm OID, not a
      content type OID.
  - id: TEN-06
    where: "§3.2, §3.1"
    what: >-
      §3.2 lists the CMS types application/pkcs7-mime carries as EnvelopedData, SignedData and
      CompressedData (introduced by including, so not exhaustive), omitting AuthEnvelopedData,
      which §3.4 and the §3.2.2 table carry in it. §3.1 says processing into EnvelopedData,
      CompressedData and AuthEnvelopedData is described in Sections 3.2 and 3.5; the formats are
      in §3.3, §3.4 and §3.6, and §3.5 is signing.
  - id: TEN-07
    where: "§5.2, §3.5.3.3, §3.2.1"
    what: >-
      The application/pkcs7-signature registration lists Optional Parameters: N/A, yet the
      §3.5.3.3 sample sends name=smime.p7s with it and the §3.2.1 extension table lists .p7s for
      it. The §3.2.1 SHOULD that asks for the name parameter (R-0102) is scoped to
      application/pkcs7-mime only.
  - id: TEN-08
    where: "§3.6"
    what: >-
      The compressed-data sample body is not a ContentInfo: decoded, its first octets are 78 DA, a
      zlib stream header, where every other sample begins with 30 82 (a ContentInfo SEQUENCE).
      §3.6 Steps 3 and 4 say the CompressedData is wrapped in a ContentInfo and that is what the
      application/pkcs7-mime entity carries. Inflated, the 34 octets are the 28 octets of This is
      some sample content. with no MIME header and no CMS structure.
    inferred: true
    inferred_reason: decoded from the source's own base64 (line 2040) in the scratchpad; the source says nothing about the sample's bytes.
  - id: TEN-09
    where: "Appendix A, §7.1, §1.4"
    what: >-
      The Appendix A note calls RFC 5751 [SMIMEv2]; §1.4 places RFC 5751 in S/MIME 3.2. §7.1 also
      gives [SMIMEv3.1] the RFC set §1.4 gives S/MIME 3.2 (RFC 2634, 5035, 5652, 5750, 5751) and
      [SMIMEv3.2] the set §1.4 gives S/MIME 3.1 (RFC 2634, 3850, 3851, 3852, 5035). Appendix A also
      spells the second arc of id-aa usa(840) where every other OID in the module has us(840); the
      number is the same.
  - id: TEN-10
    where: "Appendix A"
    what: >-
      The comment on id-cap-preferBinaryInside calls it an attribute and speaks of the
      attribute's value field, and §3.1.2 calls it the id-cap-preferBinaryInside
      SMIMECapabilities attribute; structurally it is a capabilityID inside an SMIMECapability, with
      the parameters component absent. Appendix A also introduces a list of OIDs to be used with
      S/MIME v3 whose two entries (md2WithRSAEncryption, signingTime) are inside ASN.1 comments,
      so the module defines neither.
  - id: TEN-11
    where: "§B.2"
    what: >-
      S/MIME v3 clients might also use id-dsa as an AlgorithmIdentifier in this field: the
      sentence names no field. The signature algorithm identifier of a SignerInfo is the evident
      referent (inferred).
  - id: TEN-12
    where: "§3.3, §3.4, §3.5.2, §3.5.3.3 samples"
    what: >-
      Decoded, the samples use algorithms and key sizes the document marks historic or below its
      floors. The acknowledgements say some examples were copied from RFC 4134. The decoded
      values are given under sample_evidence on MSG-03, MSG-05, MSG-15 and MSG-22; pass 2
      (examples) should confirm them.
    inferred: true
    inferred_reason: decoded from the source's own base64 in the scratchpad; the source does not describe the samples' algorithms.
  - id: TEN-13
    where: "§3.5.3.3"
    what: >-
      The messageDigest attribute in the decoded detached signature (32 octets, b1c29646...890aaa)
      is not the SHA-256 of the 30 octets the section prints as the digested content, nor of the
      body line with the CRLF removed, prefixed, or both, nor their SHA-1. The printed bytes and
      the signature do not belong together as printed. The SignerInfo also has version 2 with an
      issuerAndSerialNumber sid; the version rule is RFC 5652's (pointer). For the examples pass.
    inferred: true
    inferred_reason: computed in the scratchpad from the source's own base64 (lines 1984-1990) and hex (lines 1997-1998).
  - id: TEN-14
    where: "§3.2, §3.2.2, §2.4.1"
    what: >-
      The sentence behind R-0099 conditions what the carried CMS object contains on the
      eContentType, for every application/pkcs7-mime object. eContentType is a component of
      EncapsulatedContentInfo (MSG-04), which SignedData and CompressedData carry; the
      EnvelopedData and AuthEnvelopedData that the same media type carries (§3.2.2 table, inner
      content id-data) have no eContentType, and §2.4.1 names the EnvelopedData field
      encryptedContentInfo contentType (MSG-19). This file reads R-0099's eContentType as
      MSG-19/contentType for EnvelopedData and as the inner content type of MSG-22 for
      AuthEnvelopedData, and wires R-0099 only where the source's own field name exists (MSG-04).
    inferred: true
    inferred_reason: the reading for EnvelopedData and AuthEnvelopedData is this file's; the source names no field of those structures in §3.2.

# ---------------------------------------------------------------------------
coverage: >-
  44 messages, 199 fields (nested fields counted), 256 verbatim quotes (252 under quotes, 4 under
  quotes_selection, quotes_ordering and quotes_example). 144 of the 151
  requirements are wired to at least one field or entry. The seven wired nowhere bind no field of
  any structure: R-0001 (umbrella conformance to this document and to five other
  specifications), R-0124 (a signing agent must hold a certificate; possession, not inclusion in a
  message), R-0125 and R-0126 (a certificate retrieval mechanism and a certificate store), R-0127
  and R-0128 (randomness of key generation and protection of the private key), and R-0145
  (implementer awareness that one individual can hold several key pairs). They belong to
  protocol.yaml, state-machine.yaml or design-notes.md.

