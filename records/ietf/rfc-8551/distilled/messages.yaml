          - at: "§3.2.2"
            text: 'certs-only             SignedData            id-data'
        notes: the inner content column gives id-data although a certs-only SignedData has no eContent (R-0122); read as naming the eContentType.
        constrained_by:
          - rfc-8551#R-0101
      - name: compressed-data
        name_kind: synthetic
