  # ======================= MIME layer (§3, §5) =======================

  - name: Inner MIME entity (the canonical secured entity)
    id: MSG-25
    kind: mime-entity
    locator: "§3.1"
    source: "§3 (lines 1160-1173); §3.1 (lines 1192-1270); §3.1.1-§3.1.4 (lines 1272-1437); §6 (lines 2658-2665)"
    normative_status: profiled
    encoding: >-
      MIME header fields and body, canonicalized (ENC-04), with the leaves transfer-encoded per
      ENC-03. Line endings CRLF throughout (R-0098).
    quotes:
      - at: "§3"
        text: 'The data to be secured is always a canonical MIME entity.'
      - at: "§3.1"
        text: 'The MIME entity that is secured and described in this section can be thought of as the "inside" MIME entity.'
      - at: "§3.1"
        text: 'A MIME entity that is the whole message includes only the MIME message headers and MIME body and does not include the rfc822 header.'
      - at: "§3.1"
        text: 'A body can consist of a single MIME entity or a tree of MIME entities (rooted with a multipart).'
    preparation: >-
      Step 1 local conventions; Step 2 leaf parts to canonical form; Step 3 transfer encoding on the
      leaves (§3.1, descriptive rather than prescriptive).
    fields:
      - name: MIME header fields
        name_kind: synthetic
        type: MIME header section (MIME-SPEC)
        required: not-stated
        constraints: >-
          Content-Type and Content-Transfer-Encoding as MIME defines them; absence of
          Content-Transfer-Encoding means 7BIT (ENC-03). Line endings CRLF (R-0098). The rfc822
          header of a whole message is not part of the entity unless wrapped (MSG-26).
        constrained_by:
          - rfc-8551#R-0098
      - name: body
        name_kind: synthetic
        type: MIME body, single entity or multipart tree
        required: true
        constraints: >-
          Canonical form for signing, enveloping and compressing (R-0085, R-0086), per media type
          (R-0087). Text: CRLF line endings and a canonical, registered charset (R-0088 to R-0091).
          Transfer encoding per ENC-03 (R-0092 to R-0097).
        quotes:
          - at: "§3.1.1"
            text: 'MIME entities of major type "text" MUST have both their line endings and character set canonicalized.'
          - at: "§3.1.1"
            text: 'When preparing such text for signing, the canonical representation specified for the charset MUST be used.'
        constrained_by:
          - rfc-8551#R-0085
          - rfc-8551#R-0086
          - rfc-8551#R-0087
          - rfc-8551#R-0088
          - rfc-8551#R-0089
          - rfc-8551#R-0090
          - rfc-8551#R-0091
          - rfc-8551#R-0092
          - rfc-8551#R-0093
          - rfc-8551#R-0094
          - rfc-8551#R-0096
      - name: text/html part
        name_kind: synthetic
        type: MIME entity of type text/html
        required: false
        constraints: >-
          Receiving clients require a complete HTML document (R-0147) and treat each part of a
          multipart/mixed, and each encrypted or signed piece, as a separate origin (R-0148,
          R-0149).
        quotes:
          - at: "§6"
            text: 'Clients MUST require that a text/html content type be a complete HTML document (per [RFC1866]).'
        constrained_by:
          - rfc-8551#R-0147
          - rfc-8551#R-0148
          - rfc-8551#R-0149
    example: >-
      §3.1.4 (lines 1409-1437) prints a multipart/mixed entity with a quoted-printable text/plain
      part and a base64 image/jpeg part, and says it is not an example of an S/MIME message.
    quotes_example:
      - at: "§3.1.4"
        text: 'This example shows a multipart/mixed message with full transfer encoding.'
      - at: "§3.1.4"
        text: 'Note that this example is not an example of an S/MIME message.'
    layout: "header-field CRLF ... header-field CRLF CRLF body (CRLF line endings; the body a single entity or a multipart tree)"
    sample_evidence:
      inferred: true
      inferred_reason: >-
        The decoded §3.5.2 eContent is 0D 0A followed by the 28 octets of the sample sentence:
        an entity with an empty header section and a one-line body with no final line ending.
    constrained_by:
      - rfc-8551#R-0085
      - rfc-8551#R-0098
      - rfc-8551#R-0099

  - name: message/rfc822 header-protection wrapper
    id: MSG-26
    kind: mime-entity
    locator: "§3.1"
    source: "§3.1 (lines 1202-1205, 1256-1270); §1.5 (lines 479-480)"
    normative_status: profiled
    encoding: A MIME entity of type message/rfc822 used as the inner MIME entity (MSG-25); its encoding is MIME's.
    quotes:
      - at: "§3.1"
        text: 'In order to protect outer, non-content-related message header fields (for instance, the "Subject", "To", "From", and "Cc" fields), the sending client MAY wrap a full MIME message in a message/rfc822 wrapper in order to apply S/MIME security services to these header fields.'
      - at: "§3.1"
        text: 'When an S/MIME message is received, if the top-level protected MIME entity has a Content-Type of message/rfc822, it can be assumed that the intent was to provide header protection.'
    fields:
      - name: Content-Type
        type: MIME header field
        required: true
        literal: message/rfc822
        constrained_by:
          - rfc-8551#R-0082
          - rfc-8551#R-0084
      - name: inner header fields
        name_kind: synthetic
        type: message header fields of the wrapped message
        required: true
        values: [Subject, To, From, Cc]
        constraints: the protected copies; receivers distinguish them from the unprotected outer header (R-0083) and present the entity as the top-level message (R-0084).
        constrained_by:
          - rfc-8551#R-0083
          - rfc-8551#R-0084
      - name: wrapped message body
        name_kind: synthetic
        type: full MIME message
        required: true
        constrained_by:
          - rfc-8551#R-0082
    layout: "outer header (unprotected) → S/MIME entity → CMS → Content-Type: message/rfc822 → inner header (Subject, To, From, Cc ...) → MIME body"
    constrained_by:
      - rfc-8551#R-0082
      - rfc-8551#R-0083
      - rfc-8551#R-0084

  - name: application/pkcs7-mime
    id: MSG-27
    kind: mime-entity
    locator: "§3.2"
    source: "§3.2 (lines 1439-1477); §3.2.1 (lines 1479-1525); §3.2.2 (lines 1527-1576); §5.1 (lines 2303-2342)"
    normative_status: defined
    encoding: >-
      MIME entity whose body is a CMS ContentInfo (MSG-01); base64 Content-Transfer-Encoding in
      most cases (ENC-02).
    quotes:
      - at: "§3.2"
        text: 'The application/pkcs7-mime media type is used to carry CMS content types, including EnvelopedData, SignedData, and CompressedData.'
      - at: "§3.2"
        text: 'The Content-Type header field of all application/pkcs7-mime objects SHOULD include the optional "smime-type" parameter, as described in the following sections.'
    fields:
      - name: Content-Type
        type: MIME header field
        required: true
        literal: application/pkcs7-mime
        constraints: identification is by media type, not file extension (R-0107, R-0108).
        quotes:
          - at: "§3.2.1"
            text: 'A proper S/MIME implementation MUST use the media types and MUST NOT rely on the file extensions.'
        constrained_by:
          - rfc-8551#R-0107
          - rfc-8551#R-0108
        fields:
          - name: smime-type
            type: MIME parameter (MSG-28)
            required: false
            presence: SHOULD (R-0101)
            values: [enveloped-data, authEnveloped-data, signed-data, certs-only, compressed-data]
            constrained_by:
              - rfc-8551#R-0100
              - rfc-8551#R-0101
          - name: name
            type: MIME parameter, a filename
            required: false
            presence: SHOULD, for compatibility with older systems (R-0102)
            values: [smime.p7m, smime.p7c, smime.p7z]
            constraints: appropriate extension (R-0104), eight-character base and three-letter extension (R-0105), base smime (R-0106).
            quotes:
              - at: "§3.2.1"
                text: 'For application/pkcs7-mime, sending agents SHOULD emit the optional "name" parameter to the Content-Type field for compatibility with older systems.'
            constrained_by:
              - rfc-8551#R-0102
              - rfc-8551#R-0104
              - rfc-8551#R-0105
              - rfc-8551#R-0106
      - name: Content-Disposition
        type: MIME header field (RFC 2183)
        required: false
        presence: SHOULD, with the filename parameter (R-0103)
        quotes:
          - at: "§3.2.1"
            text: 'Sending agents SHOULD also emit the optional Content-Disposition field [RFC2183] with the "filename" parameter.'
        constrained_by:
          - rfc-8551#R-0103
        fields:
          - name: filename
            type: MIME parameter, a filename
            required: false
            values: [smime.p7m, smime.p7c, smime.p7z]
            constraints: same value rules as name (R-0104 to R-0106).
            constrained_by:
              - rfc-8551#R-0104
              - rfc-8551#R-0105
              - rfc-8551#R-0106
      - name: Content-Transfer-Encoding
        type: MIME header field
        required: not-stated
        values: [base64]
        constraints: base64 in most cases, in particular with SMTP (ENC-02); not a characteristic of the media type. Every sample uses base64.
      - name: body
        name_kind: synthetic
        type: CMS ContentInfo (MSG-01), transfer-encoded
        required: true
        constraints: when the eContentType is id-data the CMS object carries a §3.1 MIME entity; other contents MAY be carried for other eContentType values (R-0099). EnvelopedData and AuthEnvelopedData have no eContentType (TEN-14).
        constrained_by:
          - rfc-8551#R-0099
    file_extensions:
      quotes:
        - at: "§3.2.1"
          text: 'If a sending agent emits the above parameters, the value of the parameters SHOULD be a filename with the appropriate extension:'
      table:
        - {media_type: "application/pkcs7-mime", cms: "SignedData, EnvelopedData, AuthEnvelopedData", extension: ".p7m"}
        - {media_type: "application/pkcs7-mime", cms: "degenerate SignedData certificate management message", extension: ".p7c"}
        - {media_type: "application/pkcs7-mime", cms: "CompressedData", extension: ".p7z"}
        - {media_type: "application/pkcs7-signature", cms: "SignedData", extension: ".p7s"}
      table_lines: "§3.2.1, lines 1488-1496"
      constrained_by:
        - rfc-8551#R-0104
    layout: >-
      Content-Type: application/pkcs7-mime; smime-type=<value>; name=smime.<ext> CRLF
      Content-Transfer-Encoding: base64 CRLF Content-Disposition: attachment; filename=smime.<ext>
      CRLF CRLF base64(ContentInfo; BER or DER not stated).
    notes: TEN-06 (AuthEnvelopedData omitted from the §3.2 list).
    constrained_by:
      - rfc-8551#R-0100
      - rfc-8551#R-0101
      - rfc-8551#R-0107
      - rfc-8551#R-0108

  - name: smime-type parameter
    id: MSG-28
    kind: mime-parameter
    locator: "§3.2.2"
    source: "§3.2.2 (lines 1527-1576); §5.1 (line 2311); §5.3 (lines 2415-2422)"
