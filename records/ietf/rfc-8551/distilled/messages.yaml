      - rfc-8551#R-0099

  - name: SignedData
    id: MSG-03
    kind: cms-content-type
    locator: "§2.4.2"
    source: "§2.4.2 (lines 752-756); §2.4.1 (lines 739-744); §2.5 (lines 793-830); §3.5.2 (lines 1765-1783); §3.5.3 (lines 1831-1834); §3.5.3.1 (lines 1838-1841); §3.8 (lines 2091-2107)"
    normative_status: profiled
    asn1_type: not-stated (RFC 5652 §5)
    encoding: Source silent (ENC-01).
    quotes:
      - at: "§2.4.2"
        text: 'Sending agents MUST use the SignedData content type to apply a digital signature to a message or, in a degenerate case where there is no signature information, to convey certificates.'
      - at: "§2.4.2"
        text: 'Applying a signature to a message provides authentication, message integrity, and non-repudiation of origin.'
    profiles:
      - {format: "application/pkcs7-mime; smime-type=signed-data (MSG-30)", eContent: present, signerInfos: "the signatures (no count stated)"}
      - {format: "application/pkcs7-signature in multipart/signed (MSG-35, MSG-36)", eContent: absent, signerInfos: "the signatures"}
      - {format: "application/pkcs7-mime; smime-type=certs-only (MSG-33)", eContent: absent, signerInfos: empty}
    fields:
      - name: digestAlgorithms
        type: "SET OF DigestAlgorithmIdentifier"
        required: not-stated
