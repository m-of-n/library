messages:

  # ======================= CMS layer (§2, §3) =======================

  - name: ContentInfo
    id: MSG-01
    kind: cms-structure
    locator: "§3.3"
    source: "§3.3 Step 3 (line 1599); §3.4 Step 3 (line 1654); §3.5.2 Step 3 (line 1775); §3.5.3.1 (lines 1838-1839); §3.6 Step 3 (line 2023); §3.8 Step 2 (line 2100)"
    normative_status: referenced
    asn1_type: not-stated (RFC 5652 §3)
    encoding: >-
      Source silent (ENC-01). Carried as the body of application/pkcs7-mime or
      application/pkcs7-signature, base64 transfer-encoded in most cases (ENC-02).
    quotes:
      - at: "§3.3"
        text: 'The EnvelopedData object is wrapped in a CMS ContentInfo object.'
      - at: "§3.4"
        text: 'The AuthEnvelopedData object is wrapped in a CMS ContentInfo object.'
      - at: "§3.5.2"
        text: 'The SignedData object is wrapped in a CMS ContentInfo object.'
      - at: "§3.5.3.1"
        text: 'This media type always contains a CMS ContentInfo containing a single CMS object of type SignedData.'
      - at: "§3.6"
        text: 'The CompressedData object is wrapped in a CMS ContentInfo object.'
      - at: "§3.8"
        text: 'The SignedData object is wrapped in a CMS ContentInfo object.'
    fields:
      - name: contentType
        type: OBJECT IDENTIFIER
        required: not-stated
        inferred: true
        inferred_reason: >-
          The source names ContentInfo and never its components. The component and its presence
          are RFC 5652's, named as a pointer. The values are read off the samples, not printed.
        values:
          - {value: "1.2.840.113549.1.7.3", meaning: "EnvelopedData (decoded, §3.3 sample)"}
          - {value: "1.2.840.113549.1.9.16.1.23", meaning: "AuthEnvelopedData (decoded, §3.4 sample)"}
          - {value: "1.2.840.113549.1.7.2", meaning: "SignedData (decoded, §3.5.2 and §3.5.3.3 samples)"}
        constrained_by:
          - rfc-8551#R-0025
      - name: content
        type: the content type's structure (SignedData, EnvelopedData, AuthEnvelopedData or CompressedData)
        required: true
        inferred: true
        inferred_reason: >-
          As for contentType. The decoded samples carry it under an A0 (context-specific 0,
          constructed) tag.
    layout: >-
      ContentInfo { contentType OID | [0] content }. Inferred from the decoded samples:
      30 82 LL LL 06 <len> <content type OID> A0 82 LL LL <content structure>.
    constrained_by:
      - rfc-8551#R-0025

  - name: Data (id-data)
    id: MSG-02
    kind: cms-content-type
    locator: "§2.4.1"
    source: "§2.4 (lines 724-726); §2.4.1 (lines 737-748); §3.2 (lines 1447-1450); §3.2.2 table (lines 1535-1541)"
    normative_status: profiled
    encoding: >-
      The content is the octets of the canonical inner MIME entity (MSG-25), carried in the eContent
      or encryptedContent OCTET STRING of the enclosing structure. No S/MIME format in the document
      sends a Data ContentInfo on its own.
    quotes:
      - at: "§2.4"
        text: 'Of these, only the Data, SignedData, EnvelopedData, AuthEnvelopedData, and CompressedData content types are currently used for S/MIME.'
      - at: "§2.4.1"
        text: 'Sending agents MUST use the id-data content type identifier to identify the "inner" MIME message content.'
      - at: "§3.2"
        text: 'The carried CMS object always contains a MIME entity that is prepared as described in Section 3.1 if the eContentType is id-data.  Other contents MAY be carried when the eContentType contains different values.'
    fields:
      - name: content type identifier
        name_kind: synthetic
        type: OBJECT IDENTIFIER
        required: true
        literal: id-data
        oid_dotted: "1.2.840.113549.1.7.1"
        inferred: true
        inferred_reason: the source prints the name id-data and no value; the dotted value is decoded from the §3.3 and §3.4 samples (encryptedContentInfo contentType) and the §3.5.2 sample (eContentType).
        constrained_by:
          - rfc-8551#R-0020
          - rfc-8551#R-0021
          - rfc-8551#R-0023
      - name: content octets
        name_kind: synthetic
