            text: 'smime-type value: authEnveloped-data'
        constrained_by:
          - rfc-8551#R-0101
      - name: future values
        name_kind: synthetic
        type: token
        constraints: >-
          New values follow the three guidelines (R-0109 to R-0111): signed-*, authEnv-* and
          enveloped-* when both signing and encryption apply; a common string per content OID
          (data for id-data); otherwise OID.<oid>. Registered under RFC 7114.
