        inferred: true
        inferred_reason: the source speaks of the set of certificates included in the signed message and never names the component; certificates is RFC 5652's name.
        constrained_by:
          - rfc-8551#R-0025
          - rfc-8551#R-0052
          - rfc-8551#R-0053
      - name: crls
        type: not-stated (RFC 5652 §5.1)
