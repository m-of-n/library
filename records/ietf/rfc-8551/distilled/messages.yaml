  - name: SMIMEEncryptionKeyPreference attribute
    id: MSG-14
    kind: cms-attribute
    locator: "§2.5.3"
    source: "§2.5.3 (lines 941-1019); Appendix A (lines 3170-3208)"
    normative_status: defined
    oid: "id-aa-encrypKeyPref OBJECT IDENTIFIER ::= {id-aa 11}"
    oid_arcs:
      - "id-aa OBJECT IDENTIFIER ::= {iso(1) member-body(2) usa(840) rsadsi(113549) pkcs(1) pkcs-9(9) smime(16) attributes(2)}"
    oid_dotted: "1.2.840.113549.1.9.16.2.11"
    oid_dotted_inferred: true
    asn1_type: CHOICE
    encoding: Source silent (ENC-01). Module tagging is DEFINITIONS IMPLICIT TAGS (Appendix A).
    quotes:
      - at: "§2.5.3"
        text: 'The encryption key preference attribute allows the signer to unambiguously describe which of the signer''s certificates has the signer''s preferred encryption key.'
      - at: "§2.5.3"
        text: 'If present, the SMIMEEncryptionKeyPreference attribute MUST be a SignedAttribute.'
      - at: "§2.5.3"
        text: 'The SignedAttributes in a signerInfo MUST include a single instance of the SMIMEEncryptionKeyPreference attribute.'
      - at: "§2.5.3"
        text: 'An SMIMEEncryptionKeyPreference attribute MUST only include a single instance of AttributeValue.'
      - at: "Appendix A"
        text: 'id-aa-encrypKeyPref OBJECT IDENTIFIER ::= {id-aa 11}'
      - at: "Appendix A"
        text: 'SMIMEEncryptionKeyPreference ::= CHOICE { issuerAndSerialNumber   [0] IssuerAndSerialNumber, receipentKeyId          [1] RecipientKeyIdentifier, subjectAltKeyIdentifier [2] SubjectKeyIdentifier }'
      - at: "Appendix A"
        text: 'id-aa OBJECT IDENTIFIER ::= {iso(1) member-body(2) usa(840) rsadsi(113549) pkcs(1) pkcs-9(9) smime(16) attributes(2)}'
    fields:
      - name: placement
        name_kind: synthetic
        type: signed attribute
        required: conditional
        required_when: >-
          When present it is a signed attribute (R-0048), one instance per signerInfo (R-0049, read
          as at most one: TEN-02). SHOULD be used when the preferred encryption certificate is not
          the signing certificate (R-0054).
        constrained_by:
          - rfc-8551#R-0048
          - rfc-8551#R-0049
          - rfc-8551#R-0054
      - name: attrValues
        type: SET OF AttributeValue with exactly one value
        required: true
        constrained_by:
          - rfc-8551#R-0050
          - rfc-8551#R-0051
      - name: issuerAndSerialNumber
        type: "[0] IssuerAndSerialNumber"
        tag: "[0], IMPLICIT by the module default"
        required: conditional
        required_when: one of the three CHOICE alternatives.
        inferred: true
        inferred_reason: the tagging mode follows from DEFINITIONS IMPLICIT TAGS; whether X.680 forces EXPLICIT depends on the imported type, which RFC 5652 defines.
        constrained_by:
          - rfc-8551#R-0059
      - name: receipentKeyId
        type: "[1] RecipientKeyIdentifier"
        tag: "[1], IMPLICIT by the module default"
        required: conditional
        required_when: one of the three CHOICE alternatives.
        quotes:
          - at: "Appendix A"
            text: '"receipentKeyId" is spelled incorrectly but is kept for'
        inferred: true
        inferred_reason: as for issuerAndSerialNumber.
        constrained_by:
          - rfc-8551#R-0059
      - name: subjectAltKeyIdentifier
        type: "[2] SubjectKeyIdentifier"
        tag: "[2], IMPLICIT by the module default"
        required: conditional
        required_when: one of the three CHOICE alternatives.
        inferred: true
        inferred_reason: as for issuerAndSerialNumber.
        constrained_by:
          - rfc-8551#R-0059
    certificate_rules: >-
      The referenced certificate SHOULD be in the message's certificates (R-0052) and MAY be
      omitted if the receiver already has it (R-0053). Receivers store the preference when the
      signature is valid and the signing time is newer (R-0055), check clock skew (R-0056), and
      respect it if possible (R-0057). It is the first step of recipient key-management
      certificate selection (R-0058 to R-0060).
    quotes_selection:
      - at: "§2.5.3.1"
        text: 'If an SMIMEEncryptionKeyPreference attribute is found in a SignedData object received from the desired recipient, this identifies the X.509 certificate that SHOULD be used as the X.509 key management certificate for the recipient.'
    layout: "Attribute { 1.2.840.113549.1.9.16.2.11 | SET { CHOICE [0] | [1] | [2] } }"
    constrained_by:
      - rfc-8551#R-0048
      - rfc-8551#R-0049
      - rfc-8551#R-0050
      - rfc-8551#R-0051
      - rfc-8551#R-0052
