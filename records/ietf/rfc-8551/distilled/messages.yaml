          - rfc-8551#R-0022
          - rfc-8551#R-0115
          - rfc-8551#R-0122
      - name: certificates
        type: not-stated (RFC 5652 §5.1)
        required: conditional
        required_when: >-
          Carries the certificates of a certs-only message (§3.8). In a signed message it should
