source_defects_and_tensions:
  - id: "if-present-vs-must-include"
    kind: "tension"
    locator: "§2.5, §2.5.2, §2.5.3"
    text: >-
      Each attribute section opens "If present" and §2.5 makes generation a SHOULD, yet
      the next sentence reads "The SignedAttributes in a signerInfo MUST include a single
      instance". Read literally, every signerInfo must carry both attributes. The evident
      intent is "at most one instance"; the receiving rule (step 5 of
      signature-verification) depends on which reading is taken.
    quotes:
      - |-
        If present, the SMIMECapabilities attribute MUST be a SignedAttribute.
      - |-
        The SignedAttributes in a signerInfo MUST include a single instance of the SMIMECapabilities attribute.
  - id: "extensions-vs-identification"
    kind: "tension"
    locator: "§3.2.1, §3.10"
    text: >-
      §3.2.1 forbids relying on file extensions; §3.10 identifies application/octet-stream
      as S/MIME by file suffix. Reconcilable (identification is a heuristic, processing
      uses the CMS type), but the source does not say so.
    quotes:
      - |-
        A proper S/MIME implementation MUST use the media types and MUST NOT rely on the file extensions.
  - id: "rule-gap-known-version"
    kind: "gap"
    locator: "§2.7.1.1, §2.7.1.2"
    text: >-
      Rule 1 needs known capabilities; Rule 2 needs both capabilities and version
      unknown. A sender that knows the version but not the capabilities (or whose list
      has nothing it can encrypt with) is covered by neither, and the list §2.7.1 stores
      holds no version.
  - id: "rule2-fallback-reasoning"
    kind: "ambiguity"
    locator: "§2.7.1.2, §6"
    text: >-
      The fallback from AES-256 GCM is AES-128 CBC, justified by a presumption about
      AES-GCM implementations that would support AES-128 GCM, not CBC. The CBC fallback
      is the mode §6 (Efail) urges mail systems to migrate away from.
    quotes:
      - |-
        If the sending agent chooses not to use AES-256 GCM in this step, given the presumption is that a client implementing AES-GCM would do both AES-256 and AES-128, it SHOULD use AES-128 CBC.
  - id: "rule2-structure-unstated"
    kind: "gap"
    locator: "§2.7.1.2, §3.3, §3.4"
    text: >-
      The rules pick an algorithm, not a structure; the switch between EnvelopedData (CBC)
      and AuthEnvelopedData (GCM) follows only from §3.3 saying enveloped-only does not
      support authenticated algorithms.
  - id: "timestamp-undefined"
    kind: "ambiguity"
    locator: "§2.7.1"
    text: >-
      "checking the timestamp" is not defined; signingTime is the evident referent. The
      behaviour when signingTime is absent (it is a SHOULD) is not given for either the
      capability list or the preference data.
  - id: "no-reasonable-skew-value"
    kind: "gap"
    locator: "§2.5.3, §2.7.1"
    text: "Neither 'reasonable clock skew' nor 'too great' is quantified."
  - id: "cross-reference-3.1"
    kind: "defect"
    locator: "§3.1"
    text: >-
      Processing into EnvelopedData, CompressedData and AuthEnvelopedData is said to be in
      Sections 3.2 and 3.5; it is in §3.3, §3.4 and §3.6 (§3.5 is signing).
    quotes:
      - |-
        Processing "outside" MIME entities into CMS EnvelopedData, CompressedData, and AuthEnvelopedData content types is described in Sections 3.2 and 3.5.
  - id: "retrieval-actor"
    kind: "ambiguity"
    locator: "§4"
    text: >-
      The certificate retrieval duty is put on the receiving agent, for certificates of
      "recipients of digital envelopes": a sending-side need.
    quotes:
      - |-
        A receiving agent MUST provide some certificate retrieval mechanism in order to gain access to certificates for recipients of digital envelopes.
  - id: "key-selection-wording"
    kind: "ambiguity"
    locator: "§2.5.3.1"
    text: >-
      "the same subject name as the signer of an X.509 certificate" reads as the issuer;
      the intent is the signer of the received message.
  - id: "error-condition-undefined"
    kind: "gap"
    locator: "§2.6, §2.5.2, §2.5.3"
    text: >-
      "indicating an error condition" and "treated as failing" have no defined effect:
      S/MIME has no error signalling and the source does not say what the user sees.
  - id: "multiple-signers-undefined"
    kind: "gap"
    locator: "§3.5.3.1, §3.5.3.2, §1.6"
    text: "Several signatures and digest algorithms are allowed; combining their results is not defined here."
  - id: "decryption-failure-guidance-absent"
    kind: "gap"
    locator: "§6"
    text: >-
      There is no requirement on decryption-failure handling, uniform errors or timing. The
      only oracle material is the RFC 3218 pointer and the compression-oracle paragraph.
  - id: "verify-band-1024-2047"
    kind: "tension"
    locator: "§4.3, §6, Appendix B.2"
    text: >-
      Verification of RSA keys of 2047 bits or less is SHOULD NOT, yet the warning duty
      starts below 1024 and Appendix B wants historic mail verified; keys of 1024 to 2047
      bits have no stated user-facing treatment.
  - id: "compression-of-encrypted"
    kind: "ambiguity"
    locator: "§3.7"
    text: >-
      "could benefit as well" after "discouraged" leaves unclear whether compressing
      base64 ciphertext is recommended; §6 adds the compression-oracle caution.
    quotes:
      - |-
        Encrypted data that is transferred as base64-encoded data could benefit as well.
  - id: "transfer-encoding-three-rules"
    kind: "tension"
    locator: "§3.1.2"
    text: >-
      "no transfer encoding is required at all", "As a rule ... SHOULD use transfer
      encoding" and "SHOULD use binary encoding" for inner entities in one section;
      consistent only once the conditions are applied in order (transfer-encoding-choice).
  - id: "reference-label-swap"
    kind: "defect"
    locator: "§1.4, §7.1, Appendix A"
    text: >-
      §7.1 gives [SMIMEv3.1] the RFC set §1.4 gives v3.2 and vice versa; Appendix A labels
      RFC 5751 as [SMIMEv2]. Editorial; no protocol effect.
not_defined:
  - "Any reply, acknowledgement, delivery report or error message from receiver to sender."
  - "The format of a certificate request message (§4) or registration request (§3.9)."
  - "Certificate validation, path building and revocation checking (RFC 5750)."
  - "How several SignerInfos combine into one verification result."
  - "What a user or application is shown when a signature fails or decryption fails."
  - "Decryption-failure handling: uniform errors, timing, oracle resistance."
  - "A limit for 'reasonable resource limits' on nesting or for oversized keys."
  - "A value for reasonable clock skew."
  - "Triple wrapping, signed receipts and other ESS structures (RFC 2634, RFC 5035)."
  - "The algorithm rule when the recipient's version is known but its capabilities are not."
