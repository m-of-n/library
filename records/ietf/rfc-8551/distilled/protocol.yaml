    constrained_by: ["rfc-8551#R-0130", "rfc-8551#R-0133", "rfc-8551#R-0136", "rfc-8551#R-0139", "rfc-8551#R-0143", "rfc-8551#R-0144"]
  - id: "oversized-key-dos"
    trigger: "Certificates with keys larger than mandated."
    detected_by: "receiving-agent, sending-agent"
