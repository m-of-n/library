# rfc-8551 protocol model, FX-1 pass 1 (protocol agent). See protocol.md for the prose and diagrams.
record: rfc-8551
reviewed_by: ""
extracted: "2026-10-19"
extracted_by: "FX-1 pass 1 (extract), protocol agent, effort max, from the source text only"
source:
  file: ".cache/rfc-8551.txt"
  sha256: "dac39f749a08d3422bd78d4e492195067e7bc03f5fc2d0dac515f0d7ed884ae2"
  lines: "3531"
  bcp14_keywords: "190"
applicability: >-
  S/MIME is store-and-forward. RFC 8551 defines no interactive exchange, no session, no
  request and response pairing, no acknowledgement and no error signalling from receiver
  to sender: a sending agent builds a self-contained MIME entity (§3), hands it to any
  transport that carries MIME (SMTP, HTTP, SIP, §1), and a receiving agent later processes
  it on its own. Every flow here is therefore one sender's construction, the transport
  and its intermediaries, and one receiver's local processing. Every on_error is local to
  the role that detects it; the only failure the source says travels back to a sender is
  a transport-level return by a message transfer agent (§3.1.3), which is not an S/MIME
  message. The two places the source comes close to an exchange, a certificate request
  answered by a signed return message (§4) and a certs-only message sent in response to a
  registration request (§3.8, §3.9), name the exchange and define neither the request nor
  the correlation. Certificate handling itself is out of scope by the source's own words
  (§4, deferring to RFC 5750). The local decision procedures the source does give (the
  encryption-algorithm rules of §2.7.1, the capability-list update of §2.7.1, the
  key-management certificate selection of §2.5.3.1, S/MIME identification in §3.10, the
  transfer-encoding choice of §3.1.2 and §3.1.3, and the RSA key-size tables of §4.2 to
  §4.5) are modelled as flows of kind local-decision and drawn as flowcharts in
  protocol.md. Anything not literally in the source is marked inferred with a reason.
conventions:
  quoting: >-
    Each item under a quotes key is one contiguous run of .cache/rfc-8551.txt with the RFC
    line wrapping undone: a source line break and the indent that follows it become one
    space, page footer and header lines are dropped, and nothing else is altered (the two
    spaces the RFC sets after a full stop inside a line are kept). No quote joins
    non-adjacent text and nothing is elided. Every quote was checked mechanically against
    the source. This is the convention requirements.yaml uses.
  basis: >-
    A step's action and message are stated unless the step carries inferred: true, in
    which case inferred_reason says what the source does and does not say. on_error_basis
    is stated, inferred or unspecified; unspecified means the source names the operation
    or implies a failure and says nothing about what follows; inferred carries
    on_error_inferred: true and the reason inside on_error.
  constrained_by: >-
    rfc-8551#R-NNNN ids from distilled/requirements.yaml. Requirements the step obeys or
    that bind the structure it emits.
  kind: >-
    Flows: creation-and-delivery means a sender builds an S/MIME entity, a transport
    carries it and a receiver processes it; receive-processing is the receiver's local
    sequence; local-decision is a procedure one role runs on its own state; exchange is
    the nearest the source comes to a request and a reply; out-of-scope means the source
    places the mechanism elsewhere; intermediary means the flow is about what a transport
    party does to an entity in transit.
  message_names: >-
    The messages agent writes messages.yaml concurrently, so every message names the
    source's own term for the structure, media type or attribute. message_names_used lists
    every name a step uses, with where the source defines or uses it. Names the source does
    not define as a structure carry in_source: no and the reason. used_as is message when
    the name is some step's message, action when a step's action names it and no step
    carries it. messages_yaml is the distilled/messages.yaml entry that defines it, and
    field the field of that entry where the name is a field, reconciled in pass 3
    (cross-check); null where messages.yaml has no entry, with the reason in note.
framing:
  - id: "store-and-forward"
    text: >-
      S/MIME secures MIME entities that any MIME transport carries; there is no exchange
      protocol of its own.
    locator: "§1, §1.1"
    basis: "stated"
    quotes:
      - |-
        However, S/MIME is not restricted to mail; it can be used with any transport mechanism that transports MIME data, such as HTTP or SIP.
      - |-
        This document describes a protocol for adding cryptographic signature and encryption services to MIME data.
  - id: "sender-receiver-separation"
    text: >-
      Requirements are split by role; receivers are bound to accept, senders are
      recommended to be conservative.
    locator: "§1.1"
    basis: "stated"
    quotes:
      - |-
        In general, the best strategy is to follow the Robustness Principle (be liberal in what you receive and conservative in what you send).
      - |-
        An automated process that sends an encrypted message might not be able to receive an encrypted message at all, for example.
  - id: "one-preparation-procedure"
    text: "Every secured entity is built the same way: canonical MIME, CMS processing, MIME wrapping."
    locator: "§3"
    basis: "stated"
    quotes:
      - |-
        The data to be secured is always a canonical MIME entity.  The MIME entity and other data, such as certificates and algorithm identifiers, are given to CMS processing facilities that produce a CMS object.  Finally, the CMS object is wrapped in MIME.
  - id: "steps-descriptive"
    text: "The numbered steps bind by result, not by procedure."
    locator: "§3.1"
    basis: "stated"
    quotes:
      - |-
        These steps are descriptive rather than prescriptive.  The implementer is free to use any procedure as long as the result is the same.
  - id: "certificates-out-of-scope"
    text: "How agents handle certificates is outside this document."
    locator: "§4"
    basis: "stated"
    quotes:
      - |-
        This specification does not cover how S/MIME agents handle certificates -- only what they do after a certificate has been validated or rejected.
roles:
  - name: "sending-agent"
    kind: "party"
    also_called:
      - "sending agent"
      - "sender"
      - "sending client"
      - "originator"
      - "S/MIME agent"
      - "S/MIME implementation"
      - "interactive sending agent"
      - "sending agent that is controlled by a human"
    description: >-
      Creates S/MIME entities: prepares the MIME entity, chooses algorithms and formats,
      drives CMS processing and wraps the result in MIME. Includes the non-security part
      of the agent that canonicalizes (§3.1.1).
    locators: ["§1.2", "§1.1", "§2.7.1", "§3", "§3.1.1"]
    quotes:
      - |-
        Software that creates S/MIME CMS content types, MIME body parts that contain CMS content types, or both.
      - |-
        In general, canonicalization will be performed by the non-security part of the sending agent rather than the S/MIME implementation.
  - name: "receiving-agent"
    kind: "party"
    also_called:
      - "receiving agent"
      - "recipient"
      - "receiver"
      - "receiving client"
      - "client"
      - "recipient computer"
      - "S/MIME agent"
      - "S/MIME implementation"
    description: >-
      Interprets and processes S/MIME entities: identifies them, decrypts, verifies,
      decompresses, unwraps nested layers, caches the sender's capabilities and key
      preference, and hands the resulting MIME entity on for presentation.
    locators: ["§1.2", "§1.1", "§3.1", "§3.7"]
    quotes:
      - |-
        Software that interprets and processes S/MIME CMS objects, MIME body parts that contain CMS content types, or both.
  - name: "user"
    kind: "party"
    also_called:
      - "user"
      - "human sender"
      - "human"
    description: >-
      The person behind an interactive agent: shown signed attributes, allowed to judge
      weak encryption, warned about weak signatures, and the owner of the certificate
      store.
    locators: ["§2.5", "§2.7.2", "§4", "§6"]
    quotes:
      - |-
        Interactive sending agents that include signed attributes that are not listed here SHOULD display those attributes to the user, so that the user is aware of all of the data being signed.
      - |-
        If an implementation supports verification of digital signatures generated with RSA and DSA keys of less than 1024 bits, it MUST warn the user.
  - name: "cms-processing"
    kind: "component"
    also_called:
      - "CMS processing facilities"
      - "CMS generating process"
      - "CMS processing"
    description: >-
      The facility inside an agent that turns a MIME entity plus certificates and
      algorithm identifiers into a CMS object, and back. Its behaviour is defined by [CMS],
      not here.
    locators: ["§3", "§3.5.3.2", "§3.8"]
    quotes:
      - |-
        The MIME entity and other data, such as certificates and algorithm identifiers, are given to CMS processing facilities that produce a CMS object.
  - name: "mime-user-agent"
    kind: "component"
    also_called:
      - "MIME-capable user agent"
      - "receiving application"
    description: "Receives the MIME entity the S/MIME layer produces and presents it."
    locators: ["§3.1"]
    quotes:
      - |-
        That MIME entity is typically passed to a MIME-capable user agent where it is further decoded and presented to the user or receiving application.
  - name: "transport"
    kind: "channel"
    also_called:
      - "standard Internet SMTP infrastructure"
      - "Internet mail transport infrastructure"
      - "transport mechanism"
      - "communications channel"
      - "transport path"
    description: "Whatever carries the MIME entity; may not be 8-bit clean; may be observed."
    locators: ["§1", "§3.1.3", "§3.2", "§2.7.3"]
    quotes:
      - |-
        The primary reason for the 7-bit requirement is that the Internet mail transport infrastructure cannot guarantee transport of 8-bit or binary data.
  - name: "message-transfer-agent"
    kind: "intermediary"
    also_called:
      - "message transfer agent"
      - "mail transport agents"
      - "compliant agent"
    description: >-
      A relay on the transport path. One that cannot carry 8-bit or binary data has three
      options, all of which defeat a clear-signed message.
    locators: ["§3.1.3", "§3.1.4"]
    quotes:
      - |-
        If a mail message with 8-bit data were to encounter a message transfer agent that cannot transmit 8-bit or binary data, the agent has three options, none of which are acceptable for a clear-signed message:
  - name: "gateway"
    kind: "intermediary"
    also_called:
      - "gateway that has no special knowledge of S/MIME"
      - "benign intermediate agents"
      - "gateway that modifies such whitespace (like BITNET)"
    description: >-
      A non-S/MIME intermediary that translates or rewrites messages: defaults unknown
      media types to application/octet-stream, wraps lines, changes transfer encoding.
    locators: ["§3.2.1", "§3.5.1", "§3.1.4"]
    quotes:
      - |-
        When a MIME entity of type application/pkcs7-mime (for example) arrives at a gateway that has no special knowledge of S/MIME, it will default the entity's media type to application/octet-stream and treat it as a generic attachment, thus losing the type information.
      - |-
        However, the SignedData format protects the message content from being changed by benign intermediate agents.  Such agents might do line wrapping or content-transfer encoding changes that would break the signature.
  - name: "trusted-gateway"
    kind: "intermediary"
    also_called:
      - "trusted gateway"
      - "a single mail gateway"
    description: >-
      A site gateway that holds the decryption key, removes the envelope and forwards the
      still-signed message inside the site.
    locators: ["§3.1.2"]
    quotes:
      - |-
        For example, a trusted gateway might remove the envelope, but not the signature, of a message, and then forward the signed message on to the end recipient so that they can verify the signatures directly.
  - name: "certification-authority"
    kind: "party"
    also_called:
      - "certification authority"
      - "certificate authorities"
    description: >-
      Issues the sending agent's certificate. The request mechanism is not defined by
      S/MIME v4.0; a hardware token or diskette are named alternatives.
    locators: ["§3.9", "§3.8", "Appendix B.2"]
    quotes:
      - |-
        There are many ways of getting certificates, such as through an exchange with a certification authority, through a hardware token or diskette, and so on.
  - name: "server-implementation"
    kind: "party"
    also_called:
      - "Server implementations"
      - "secure mail list servers"
    description: "A receiving agent with no user to warn; rejects instead."
    locators: ["§6"]
    quotes:
      - |-
        Server implementations (e.g., secure mail list servers) where user warnings are not appropriate SHOULD reject messages with weak signatures.
  - name: "attacker"
    kind: "adversary"
    also_called:
      - "someone watching the communications channel"
      - "an attacker watching the communications channel"
      - "a careful attacker"
      - "passive observers"
      - "third party"
    description: >-
      Observes or modifies messages in transit, sends oversized keys, or drives a
      compression oracle. Named in §2.7.3, §3.4, §3.7 and §6.
    locators: ["§2.7.3", "§3.4", "§3.7", "§6"]
    quotes:
      - |-
        An attacker could send certificates with keys that would result in excessive cryptographic processing -- for example, keys larger than those mandated in this specification, as such keys could swamp the processing element.
  - name: "capabilities-list-maintainer"
    kind: "mentioned"
    also_called:
      - "the maintainer of the registered SMIMECapabilities list"
    description: "Arbitrates ambiguous capability OIDs. Not a party to any message flow."
    locators: ["§2.5.2"]
    quotes:
      - |-
        In the event that an OID is ambiguous, it needs to be arbitrated by the maintainer of the registered SMIMECapabilities list as to which type of algorithm will use the OID, and a new OID MUST be allocated under the smimeCapabilities OID to satisfy the other use of the OID.
