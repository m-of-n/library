      - {input: "smimemail.p7m", expected: "departs from R-0105 (SHOULD; 9-character base)"}
      - {input: "smime.p7", expected: "departs from R-0105 (SHOULD; 2-letter extension)"}
      - {input: "letter.p7m", expected: "conforms to R-0105; does not use the 'smime' base of R-0106"}
    constrained_by: ["rfc-8551#R-0105", "rfc-8551#R-0106"]

  - id: EX-3.2.1-C03
    title: "media type decides, not the extension"
    locator: "§3.2.1"
    source_lines: 1522-1525
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'A proper S/MIME implementation MUST use the media types and MUST NOT rely on the file extensions.'
    cases:
      - {input: 'Content-Type: application/pkcs7-mime; smime-type=enveloped-data; name=smime.p7s', expected: "processed as application/pkcs7-mime (enveloped), not as a detached signature"}
      - {input: 'Content-Type: application/pkcs7-signature; name=smime.p7m', expected: "processed as application/pkcs7-signature"}
    note: "§3.10 is the one place the source does use the suffix, for application/octet-stream (EX-3.10-C01)."
    constrained_by: ["rfc-8551#R-0107", "rfc-8551#R-0108"]

  - id: EX-3.2.2-C01
    title: "smime-type table"
    locator: "§3.2 (rule); §3.2.2 (table)"
    source_lines: 1474-1476, 1535-1541
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'The Content-Type header field of all application/pkcs7-mime objects SHOULD include the optional "smime-type" parameter, as described in the following sections.'
    cases:
      - {input: "enveloped-data", expected: {cms_type: EnvelopedData, inner: id-data}}
      - {input: "signed-data", expected: {cms_type: SignedData, inner: id-data}}
      - {input: "certs-only", expected: {cms_type: SignedData, inner: id-data}}
      - {input: "compressed-data", expected: {cms_type: CompressedData, inner: id-data}}
      - {input: "authEnveloped-data", expected: {cms_type: AuthEnvelopedData, inner: id-data}}
      - {input: "application/pkcs7-mime carrying EnvelopedData with no smime-type parameter", expected: "departs from R-0101 (SHOULD)"}
    note: "Matching of smime-type values is shown in the source's case only; the source states no case rule for parameter values or names, so no case-folding vector is made."
    constrained_by: ["rfc-8551#R-0101"]

  - id: EX-3.5.3.1-C01
    title: "detached signature has no eContent"
    locator: "§3.5.3.1"
    source_lines: 1838-1841
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'The SignedData encapContentInfo eContent field MUST be absent.'
    cases:
      - {input: "application/pkcs7-signature, SignedData, encapContentInfo { id-data }", expected: "conforms (as in 3.5.3.3-signature.derived.hex)"}
      - {input: "application/pkcs7-signature, SignedData, encapContentInfo { id-data, [0] eContent }", expected: "violates R-0115"}
    constrained_by: ["rfc-8551#R-0115"]

  - id: EX-3.5.3.2-C01
    title: "multipart/signed protocol parameter"
    locator: "§3.5.3.2"
    source_lines: 1876-1882
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'The protocol parameter MUST be "application/pkcs7-signature".'
    rule_text_2: 'Note that quotation marks are required around the protocol parameter because MIME requires that the "/" character in the parameter value MUST be quoted.'
    cases:
      - {input: 'protocol="application/pkcs7-signature"', expected: "conforms"}
      - {input: 'protocol=application/pkcs7-signature', expected: "violates R-0117 (unquoted '/')"}
      - {input: 'protocol="application/pkcs7-mime"', expected: "violates R-0116"}
      - {input: "no protocol parameter", expected: "violates: protocol is one of the two required parameters (lines 1876-1877)"}
    constrained_by: ["rfc-8551#R-0116", "rfc-8551#R-0117"]

  - id: EX-3.5.3.2-C02
    title: "micalg values"
    locator: "§3.5.3.2"
    source_lines: 1911-1931
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'If multiple message digest algorithms are used, they MUST be separated by commas per [RFC1847].'
    rule_text_2: 'The values to be placed in the micalg parameter SHOULD be from the following:'
    cases:
      - {input: ["SHA-256"], expected: "micalg=sha-256"}
      - {input: ["SHA-512"], expected: "micalg=sha-512"}
      - {input: ["SHA-384"], expected: "micalg=sha-384"}
      - {input: ["SHA-224"], expected: "micalg=sha-224"}
      - {input: ["SHA-256", "SHA-512"], expected: "micalg=\"sha-256,sha-512\" (comma-separated; the quoting is MIME's, external: RFC 2045 §5.1)"}
      - {input: ["an algorithm with no value defined in its algorithm profile"], expected: "micalg=unknown"}
      - {input: ["SHA-1"], expected: "micalg=sha-1 (table value, marked historical and no longer secure)"}
    constrained_by: ["rfc-8551#R-0118", "rfc-8551#R-0119"]

  - id: EX-3.8-C01
    title: "certificate management (certs-only) structure"
    locator: "§3.8"
    source_lines: 2095-2107
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'The SignedData encapContentInfo eContent field MUST be absent, and the signerInfos field MUST be empty.'
    cases:
      - {input: "application/pkcs7-mime; smime-type=certs-only; name=smime.p7c; SignedData with certificates, no eContent, signerInfos {}", expected: "conforms"}
      - {input: "certs-only SignedData with eContent present", expected: "violates R-0122"}
      - {input: "certs-only SignedData with one SignerInfo", expected: "violates R-0123"}
      - {input: "certs-only SignedData carrying CRLs only, no certificates", expected: "conforms (certificates and/or CRLs, line 2095)"}
    note: "The source prints no certs-only sample message; these are all constructed."
    constrained_by: ["rfc-8551#R-0025", "rfc-8551#R-0122", "rfc-8551#R-0123"]

  - id: EX-3.10-C01
    title: "identifying an S/MIME message"
    locator: "§3.10"
    source_lines: 2137-2157
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'A message is considered an S/MIME message if it matches any of the criteria listed below.'
    cases:
      - {input: "application/pkcs7-mime (any parameters)", expected: "S/MIME"}
      - {input: 'multipart/signed; protocol="application/pkcs7-signature"', expected: "S/MIME"}
      - {input: 'multipart/signed; protocol="application/pgp-signature"', expected: "not S/MIME by this table"}
      - {input: "application/octet-stream; name=smime.p7m", expected: "S/MIME"}
      - {input: "application/octet-stream with Content-Disposition filename=smime.p7z", expected: "S/MIME"}
      - {input: "application/octet-stream; name=report.p7c", expected: "S/MIME (suffix p7c)"}
      - {input: "application/octet-stream; name=smime.bin", expected: "not S/MIME by this table"}
      - {input: "3.1.4-canonical-mime-entity.eml", expected: "not S/MIME (agrees with line 1407)"}
      - {input: "application/pkcs7-signature on its own", expected: "not listed in the table"}
    note: "A table rule with no BCP 14 keyword; hence no constrained_by. The suffix comes from name or filename (lines 2144-2146)."
    constrained_by: []

  - id: EX-4.1-C01
    title: "RSA signing key generation floor"
    locator: "§4.1"
    source_lines: 2197-2198
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'An S/MIME user agent MUST NOT generate asymmetric keys less than 2048 bits for use with an RSA signature algorithm.'
    cases:
      - {input: {rsa_bits: 1024, use: signature}, expected: "MUST NOT generate"}
      - {input: {rsa_bits: 2047, use: signature}, expected: "MUST NOT generate"}
      - {input: {rsa_bits: 2048, use: signature}, expected: "permitted"}
      - {input: {rsa_bits: 1024, use: "key transport only"}, expected: "not covered by R-0129 (signature use only); see EX-4.4-C01"}
    constrained_by: ["rfc-8551#R-0129"]

  - id: EX-4.2-C01
    title: "key size when generating RSA / RSASSA-PSS signatures"
    locator: "§4.2"
    source_lines: 2209-2217
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: |2
              key size <= 2047 : SHOULD NOT (Note 2)
      2048 <= key size <= 4096 : SHOULD     (Note 1)
      4096 <  key size         : MAY        (Note 1)
    cases:
      - {input: 1024, expected: "SHOULD NOT"}
      - {input: 2047, expected: "SHOULD NOT"}
      - {input: 2048, expected: "SHOULD"}
      - {input: 4096, expected: "SHOULD"}
      - {input: 4097, expected: "MAY"}
      - {input: 8192, expected: "MAY"}
    constrained_by: ["rfc-8551#R-0130", "rfc-8551#R-0131", "rfc-8551#R-0132"]

  - id: EX-4.3-C01
    title: "key size when verifying RSA / RSASSA-PSS signatures"
    locator: "§4.3"
    source_lines: 2223-2231
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: |2
              key size <= 2047 : SHOULD NOT (Note 2)
      2048 <= key size <= 4096 : MUST       (Note 1)
      4096 <  key size         : MAY        (Note 1)
    cases:
      - {input: 1024, expected: "SHOULD NOT (EX-3.5.3.3-01's 1024-bit key falls here)"}
      - {input: 2047, expected: "SHOULD NOT"}
      - {input: 2048, expected: "MUST"}
      - {input: 4096, expected: "MUST"}
      - {input: 4097, expected: "MAY"}
    constrained_by: ["rfc-8551#R-0133", "rfc-8551#R-0134", "rfc-8551#R-0135"]

  - id: EX-4.4-C01
    title: "key size when encrypting with RSA / RSA-OAEP"
    locator: "§4.4"
    source_lines: 2249-2258
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: |2
              key size <= 2047 : SHOULD NOT (Note 2)
      2048 <= key size <= 4096 : SHOULD     (Note 1)
      4096 <  key size         : MAY        (Note 1)
    cases:
      - {input: 1024, expected: "SHOULD NOT (EX-3.3-01 and EX-3.4-01 fall here)"}
      - {input: 2048, expected: "SHOULD"}
      - {input: 4096, expected: "SHOULD"}
      - {input: 4097, expected: "MAY"}
    constrained_by: ["rfc-8551#R-0136", "rfc-8551#R-0137", "rfc-8551#R-0138"]

  - id: EX-4.5-C01
    title: "key size when decrypting with RSA / RSAES-OAEP"
    locator: "§4.5"
    source_lines: 2264-2273
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: |2
              key size <= 2047 : MAY        (Note 2)
      2048 <= key size <= 4096 : MUST       (Note 1)
      4096 <  key size         : MAY        (Note 1)
    cases:
      - {input: 1024, expected: "MAY"}
      - {input: 2047, expected: "MAY"}
      - {input: 2048, expected: "MUST"}
      - {input: 4096, expected: "MUST"}
      - {input: 4097, expected: "MAY"}
    constrained_by: ["rfc-8551#R-0139", "rfc-8551#R-0140", "rfc-8551#R-0141"]

  - id: EX-6-C01
    title: "weak signature keys: warn or reject"
    locator: "§6"
    source_lines: 2510-2516
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'If an implementation supports verification of digital signatures generated with RSA and DSA keys of less than 1024 bits, it MUST warn the user.'
    rule_text_2: 'Server implementations (e.g., secure mail list servers) where user warnings are not appropriate SHOULD reject messages with weak signatures.'
    cases:
      - {input: {agent: "interactive client", algorithm: RSA, bits: 512}, expected: "MUST warn the user"}
      - {input: {agent: "interactive client", algorithm: DSA, bits: 1023}, expected: "MUST warn the user"}
      - {input: {agent: "interactive client", algorithm: RSA, bits: 1024}, expected: "R-0143 does not fire (not less than 1024); §4.3 SHOULD NOT still applies"}
      - {input: {agent: "mail list server", algorithm: RSA, bits: 512}, expected: "SHOULD reject the message"}
    note: "The source does not define 'weak signatures' for R-0144 beyond this paragraph; the 512-bit case is taken as weak under R-0143's bound."
    constrained_by: ["rfc-8551#R-0143", "rfc-8551#R-0144"]

  - id: EX-B.2-C01
    title: "id-dsa recognised as id-dsa-with-sha1"
    locator: "Appendix B.2"
    source_lines: 3375-3383
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'Receiving clients SHOULD recognize id-dsa as equivalent to id-dsa-with-sha1.'
    cases:
      - {input: "SignerInfo signatureAlgorithm id-dsa", expected: "SHOULD be treated as id-dsa-with-sha1"}
      - {input: "SignerInfo signatureAlgorithm id-dsa-with-sha1 (as in EX-3.5.2-01)", expected: "id-dsa-with-sha1"}
    note: "The OID values (1.2.840.10040.4.1, 1.2.840.10040.4.3) are not printed in RFC 8551 (external: RFC 3279 / RFC 3370)."
    constrained_by: ["rfc-8551#R-0151"]

source_issues:
  - id: S-01
    where: "§3.6, line 2040"
    issue: "The sample body is a bare zlib stream (78 da ...), not a DER ContentInfo holding CompressedData as Steps 2-4 (lines 2011-2027) require. It inflates to 'This is some sample content.' with no CRLF and no header block, so it is not a canonical MIME entity either."
  - id: S-02
    where: "§3.5.3.3, lines 1984-1990 and 1997-1998"
    issue: "The messageDigest signed attribute (b1c29646...) equals SHA-256 of neither the printed digested bytes (17a0cf82...) nor nine other readings of the first part. The detached signature does not belong to the printed content."
  - id: S-03
    where: "§3.5.3.3, lines 1976-1979 and 1994-1998"
    issue: "The printed digested bytes (text + CRLF) are not the first part of the printed message as RFC 2046 delimits it (CRLF + text: empty header block, and the CRLF before the boundary belongs to the boundary). External rule; recorded as ambiguous."
  - id: S-04
    where: "§3.5.3.3 signature"
    issue: "SignerInfo version 2 with an issuerAndSerialNumber sid; RFC 5652 §5.3 requires version 1 for that choice. External rule."
  - id: S-05
    where: "§3.5.3.3 signature"
    issue: "signedAttrs carries only messageDigest; RFC 5652 §5.3 requires content-type as well whenever signedAttrs is present (external rule). It also departs from this source's own §2.5 (lines 800-812, 820-822): sending agents SHOULD generate signing time, SMIME capabilities, encryption key preference, message digest and content type (R-0027) and signingCertificate or signingCertificateV2 (R-0029). The §3.5.2 sample carries no signed attributes at all."
  - id: S-06
    where: "§3.4 sample"
    issue: "GCMParameters omits aes-ICVlen (DEFAULT 12) but the mac is 16 octets. External rule: RFC 5084 §3.2."
  - id: S-07
    where: "§3.4 sample"
    issue: "rsaEncryption keyEncryptionAlgorithm has no parameters, while the §3.3 sample encodes NULL; RFC 3370 §4.2.1 requires NULL. External rule."
  - id: S-08
    where: "§3.3, §3.4, §3.5.2, §3.5.3.3 samples"
    issue: "The samples use algorithms and key sizes this document no longer requires or has dropped: 1024-bit RSA (§3.3, §3.4, §3.5.3.3), DES-EDE3-CBC (§3.3), SHA-1 and DSA with SHA-1, 1024-bit DSA (§3.5.2). Lines 3455-3457 say some examples were copied from RFC 4134. Not a parse defect: a conformance gap between the examples and §2 and §4."
  - id: S-09
    where: "§3.1.4, lines 1429-1435"
    issue: "The part labelled image/jpeg decodes to an OpenPGP v3 signature packet (RSA, MD5), not a JPEG. Illustrative filler; it does not affect what the example shows."
  - id: S-10
    where: "§2.5.2, lines 905-907 vs 932-934"
    issue: "The sha256WithRSAEncryption capability example keeps a NULL parameter that differentiates nothing, while R-0046 says such parameters MUST be omitted and MUST NOT be NULL. The source does not reconcile the two."
