count_reconciliation: >-
  47 = 16 vectors whose input the source prints + 31 constructed. The 16:
  7 displays printed as message text (3.1.4 canonical MIME entity; the
  sample messages of 3.3, 3.4, 3.5.2, 3.5.3.3 and 3.6; the 3.5.3.3
  digested-content hex), which are the 7 verbatim fixtures, and 9 values
  printed in running prose with a stated meaning (2.3: 1, 2.5.2: 3,
  2.7.2: 1, 3.2.2: 3, 3.5.3.2: 1). The 31 constructed: 2.3: 1, 2.4.1: 1,
  2.5.1: 3, 2.5.2: 2, 2.5.3: 1, 2.7.1: 2, 2.7.1.1: 1, 2.7.1.2: 1, 3.1.1: 1,
  3.1.2: 1, 3.1.3: 1, 3.2.1: 3, 3.2.2: 1, 3.5.3.1: 1, 3.5.3.2: 2, 3.8: 1,
  3.10: 1, 4.1: 1, 4.2: 1, 4.3: 1, 4.4: 1, 4.5: 1, 6: 1, B.2: 1. Each tests
  a rule the source states and gives no literal for, with a yes/no answer
  that needs no cryptography. The 10 derived fixtures (6 base64 bodies
  decoded to hex, 4 OpenSSL ASN.1 dumps of the DER ones) belong to source
  vectors and add no vector. Examples considered and
  not made into vectors, and sections with no example, are listed in
  README.md.

# ====================================================================
# Conventions used in this file
# ====================================================================
#
# ids        EX-<section>-NN for source examples, EX-<section>-CNN for
#            constructed ones. <section> is the RFC section number as
#            printed (3.5.3.3, B.2). Never reused.
# locator    the section of RFC 8551 that holds the example or rule.
# source_lines  line range(s) of .cache/rfc-8551.txt.
# in_source  true: the source prints the input. false: built for this file.
# fidelity   verbatim    -- a fixture file re-extracted byte for byte from
#                           the source lines after the stated stripping.
#            split       -- a value taken out of running prose; every
#                           quoted character is the source's.
#            constructed -- built for this file from a rule the source
#                           states but gives no literal for.
# quotes     Strings under quote, rule_text and expected.text are verbatim
#            after the normalisation requirements.yaml uses: a source line
#            break and the indent that follows it read as one space; two
#            spaces after a full stop inside a line are kept; no quote
#            crosses a page break. ONE EXCEPTION, as in requirements.yaml:
#            in EX-2.3-C01 rule_text, "content-" at the end of line 709 and
#            "encryption" at the start of line 710 are rejoined with NO
#            space. The key-size rule_text blocks (EX-4.2-C01 to EX-4.5-C01)
#            keep the rows' column padding and drop the leading indent.
# MIME line ends  Every .eml fixture is the display AS PRINTED: LF line
#            ends, one LF after the last line. The source says the real
#            entity uses <CR><LF> (3.1.4, lines 1395-1397; R-0089, R-0098).
#            A harness MUST convert every LF to CRLF before MIME parsing or
#            digesting; no CRLF copy is kept, so that every fixture
#            reproduces from the source by one stated rule.
# derived    everything this extraction computed, with in_source: false.
#            DER outlines were worked by hand from the decoded octets and
#            then checked by a DER walker (Python 3, scratch, not committed:
#            definite minimal lengths, children exactly fill each parent)
#            and by OpenSSL 3.0.13 asn1parse, which agree node for node
#            (25, 26, 78, 28 TLVs). Other tools, all run locally, nothing
#            fetched: Python 3 base64, zlib, hashlib; OpenSSL 3.0.13 cms
#            -verify, pkcs7 -print_certs, x509 -text; GnuPG --list-packets;
#            GNU coreutils.
# expected_basis
#            stated      -- the source states the result for this input.
#            rule-quoted -- only the rule is stated; rule_text quotes it
#                           and expected_result is what the rule yields.
# checks     what a harness can test; result is pass / fail / not-run as
#            observed in pass 1. "fail" on a source example is a FINDING
#            about the source, recorded and not repaired. MIME header,
#            parameter, part and decode checks were run with Python's email
#            package (policy compat32) on each .eml after LF -> CRLF; it
#            reported no defects on any fixture.
# constrained_by   rfc-8551#R-NNNN ids from requirements.yaml. Empty where
#            the governing rule is lowercase prose or a table with no BCP 14
#            keyword; the locator then names it.
# external   a check that rests on a document other than RFC 8551 (RFC 5652
#            CMS, RFC 2046 MIME, RFC 5084, RFC 3370, RFC 1950, RFC 9580) is
#            marked external: <document>. It is context for the harness, not
#            a statement of this source.
# source_issue   a defect or inconsistency in the SOURCE; README lists them.

