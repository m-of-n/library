  - id: EX-2.3-C01
    title: "key wrap and content-encryption key sizes must match"
    locator: "§2.3"
    source_lines: 707-717
    in_source: false
    fidelity: constructed
    expected_basis: rule-quoted
    rule_text: 'The underlying encryption functions for the key wrap and content-encryption algorithms [RFC3370] [RFC3565] and the key sizes for the two algorithms MUST be the same (e.g., AES-128 key wrap algorithm with AES-128 content-encryption algorithm).'
    rule_text_2: 'Recipients MAY enforce this but MUST use the weaker of the two as part of any cryptographic strength computations they might do.'
    cases:
      - {input: {key_agreement: "ECDH ephemeral-static", key_wrap: "AES-256 key wrap", content: "AES-256 GCM"}, expected: "conforms"}
      - {input: {key_agreement: "ECDH ephemeral-static", key_wrap: "AES-128 key wrap", content: "AES-128 CBC"}, expected: "conforms"}
      - {input: {key_agreement: "ECDH ephemeral-static", key_wrap: "AES-128 key wrap", content: "AES-256 GCM"}, expected: "sender violates R-0016; recipient MAY reject (R-0018); in any cryptographic strength computation it does, it MUST use the weaker of the two, 128 bits (R-0019)"}
    constrained_by: ["rfc-8551#R-0016", "rfc-8551#R-0017", "rfc-8551#R-0018", "rfc-8551#R-0019"]

