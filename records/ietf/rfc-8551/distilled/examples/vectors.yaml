    fidelity: verbatim
    files:
      - {file: 3.5.3.3-digested-content.hex, sha256: a2fda31cbccf2c796f8fdf003d733a9521a2e3b5b928dbe31a61d1db813d492d}
    quote: 'The content that is digested (the first part of the multipart/signed) consists of the bytes:'
    illustrates: "the octets over which the micalg digest is computed for the first part."
    expected_basis: stated
    expected_result: "30 octets: 'This is some sample content.' followed by CR LF; SHA-256 17a0cf82494286441935f153230103e740eeeef4a5af648a4439212486162fc8."
    checks:
      - {check: "hex decodes to 30 octets", expected: 30, result: pass}
      - {check: "octets end in CR LF (R-0089)", expected: "0d 0a", result: pass}
      - {check: "octets equal the first part of EX-3.5.3.3-01 as RFC 2046 delimits it (external: RFC 2046 §5.1.1, the CRLF before a boundary belongs to the boundary)", expected: "0d0a + 'This is some sample content.'", result: fail}
      - {check: "SHA-256 equals the messageDigest of EX-3.5.3.3-01", expected: "b1c29646...", result: fail}
    constrained_by: ["rfc-8551#R-0085", "rfc-8551#R-0089"]
    ambiguous: true
    ambiguous_reason: >-
      The printed message gives part 1 an empty header block (a blank line
      after the boundary, line 1977) and no blank line before the next
      boundary (lines 1978-1979). Read by RFC 2046, part 1 is CRLF + text
      with no trailing CRLF; the printed bytes are text + CRLF. The source
      does not say how it delimited the part. Source issue S-03.
    source_issue: [S-02, S-03]

  - id: EX-3.6-01
    title: "Sample compressed-only message (compressed-data)"
    locator: "§3.6"
    source_lines: 2008-2040
    in_source: true
    fidelity: verbatim
    files:
      - {file: 3.6-compressed-data.eml, sha256: e7fd8879c85de39468a21cc8e98ddfdd574f271e09105a259b177680ec4466de}
      - {file: 3.6-compressed-data.derived.hex, sha256: ad3b3a86b8355efd09c9afe49422be2a5a87287f46ccedae1b56fb7d5e797440}
    quote: 'The smime-type parameter for compressed-only messages is "compressed-data".  The file extension for this type of message is ".p7z".'
    quote_2: 'Step 4.  The ContentInfo object is inserted into an application/pkcs7-mime MIME entity.'
    illustrates: "the MIME wrapping of a CompressedData ContentInfo (§3.6 Steps 1-4)."
    expected_basis: stated
    expected_result: >-
      MIME parse: application/pkcs7-mime with smime-type=compressed-data and
      name=smime.p7z; base64; attachment, filename=smime.p7z. Per Steps 2-4
      the body should be a DER ContentInfo holding CompressedData. It is
      not: it decodes to 34 octets that begin 78 da (a zlib stream), not 30
      (a DER SEQUENCE).
    checks:
      - {check: "Content-Type media type", expected: "application/pkcs7-mime", result: pass}
      - {check: "smime-type parameter (R-0101)", expected: "compressed-data", result: pass}
      - {check: "name parameter and filename (R-0102, R-0103, R-0104)", expected: "smime.p7z / smime.p7z", result: pass}
      - {check: "base64 decodes", expected: "34 octets", result: pass}
      - {check: "decoded body is a DER ContentInfo (first octet 0x30)", expected: true, result: fail}
      - {check: "zlib header valid (external: RFC 1950: CM 8, (0x78da mod 31) == 0)", expected: true, result: pass}
      - {check: "zlib Adler-32 trailer == Adler-32('This is some sample content.')", expected: "0x94290a54", result: pass}
      - {check: "zlib inflate (Python zlib.decompress)", expected: "'This is some sample content.' (28 octets)", result: pass}
      - {check: "decompressed content is a canonical MIME entity with CRLF line ends (R-0086, R-0089)", expected: true, result: fail}
    derived:
      in_source: false
      decoded_hex: 78da0bc9c82c5600a2e2fcdc5485e2c4dc829c5485e4fcbc92d4bc123d0094290a54
      note: >-
        78 da is a zlib header (deflate, 32K window, check bits valid). The
        first deflate block is BFINAL=1, fixed Huffman. The final four
        octets 94 29 0a 54 are the Adler-32 of the 28 octets 'This is some
        sample content.' (A = 2644 = 0x0a54, B = 37929 = 0x9429), and
        zlib.decompress returns exactly those 28 octets. So the body is the
        zlib compression of that string with no CRLF and no header block,
        not a CMS object: there is no ContentInfo, no CompressedData and no
        compressionAlgorithm identifier. A DER walk fails at octet 0
        (0x78 is not a SEQUENCE and its length octet 0xda is an invalid
        long form). Source issue S-01.
    constrained_by: ["rfc-8551#R-0086", "rfc-8551#R-0089", "rfc-8551#R-0101", "rfc-8551#R-0102", "rfc-8551#R-0103", "rfc-8551#R-0104", "rfc-8551#R-0105", "rfc-8551#R-0106"]
    source_issue: S-01

