  - id: EX-3.5.2-01
    title: "Sample signed-only message, application/pkcs7-mime with SignedData"
    locator: "§3.5.2"
    source_lines: 1781-1824
    in_source: true
    fidelity: verbatim
    files:
      - {file: 3.5.2-signed-data.eml, sha256: 281383988f403b91346ffb7d64c82464cc92e2efb7dfdfbf502daf88d7457997}
      - {file: 3.5.2-signed-data.derived.hex, sha256: 386ccd71e5d84a0af3b5fe84742d03082f2c9dcab438b68dcc612cd34e4bf2bc}
      - {file: 3.5.2-signed-data.derived.dump.txt, sha256: 19dcc644b08428036fced39c9194ba6ae0f8a12ee2c4e32fc3b70e5ef2eff268}
    quote: 'The smime-type parameter for messages using application/pkcs7-mime with SignedData is "signed-data".  The file extension for this type of message is ".p7m".'
    illustrates: "an encapsulated (opaque) signature: the signed MIME entity travels inside eContent."
    expected_basis: stated
    expected_result: >-
      MIME parse: application/pkcs7-mime with smime-type=signed-data and
      name=smime.p7m; base64; attachment, filename=smime.p7m. The body
      decodes to a complete 925-octet DER ContentInfo (signedData) whose
      eContent is the 30 octets CRLF "This is some sample content." (a MIME
      entity with an empty header), with the signer's certificate
      (CN=AliceDSS, DSA) and one SignerInfo with no signed attributes
      (DSA with SHA-1). The signature verifies under the included AliceDSS
      key; the chain to CN=CarlDSS cannot be checked.
    checks:
      - {check: "Content-Type media type", expected: "application/pkcs7-mime", result: pass}
      - {check: "smime-type parameter (R-0101)", expected: "signed-data", result: pass}
      - {check: "name parameter and filename (R-0102, R-0103, R-0104)", expected: "smime.p7m / smime.p7m", result: pass}
      - {check: "base64 decodes; outer DER length + header == decoded length", expected: "4 + 921 == 925", result: pass}
      - {check: "every nested TLV length sums to its parent", expected: true, result: pass}
      - {check: "eContentType == id-data (R-0021)", expected: "1.2.840.113549.1.7.1", result: pass}
      - {check: "eContent present and holds the MIME entity (R-0022)", expected: "0d0a + 'This is some sample content.' (30 octets)", result: pass}
      - {check: "SignerInfo sid is issuerAndSerialNumber and version 1 (R-0061; external: RFC 5652 §5.3)", expected: "CN=CarlDSS, serial 200, version 1", result: pass}
      - {check: "sid matches the included certificate (issuer CN=CarlDSS, serial 200)", expected: true, result: pass}
      - {check: "signedAttrs hold one each of signing time, SMIME capabilities, encryption key preference, message digest, content type (R-0027, SHOULD) and signingCertificate or signingCertificateV2 (R-0029, SHOULD); this sample has no signedAttrs at all", expected: "all six", result: fail}
      - {check: "digest algorithm is SHA-256 or SHA-512 (§2.1)", expected: "sha-256 / sha-512", result: fail}
      - {check: "signature algorithm is one §2.2 lists", expected: "ECDSA P-256, EdDSA, RSA PKCS#1 v1.5 or RSASSA-PSS with SHA-256", result: fail}
      - {check: "signature verifies: DSA-SHA1 over the eContent octets under the AliceDSS key in the certificate (openssl cms -verify -noverify)", expected: "CMS Verification successful; eContent output = the 30 octets", result: pass}
      - {check: "negative control: same object with eContent octet 56 ('T') XOR 0x20", expected: "CMS Verification failure", result: pass}
      - {check: "certificate chain to CN=CarlDSS", expected: "not possible: CarlDSS certificate not in the source", result: not-run}
    derived:
      in_source: false
      der_outline: |
        0    ContentInfo SEQUENCE (921)
        4      contentType OID 1.2.840.113549.1.7.2 signedData
        15     [0] (906)
        19       SignedData SEQUENCE (902)
        23         version INTEGER 1
        26         digestAlgorithms SET { 1.3.14.3.2.26 sha1 }
        37         encapContentInfo SEQUENCE (45): eContentType id-data,
                     [0] eContent OCTET STRING (30) 0d0a "This is some sample content."
        84         certificates [0] (736)
        88           Certificate SEQUENCE (732): v3, serial 200,
                       signature 1.2.840.10040.4.3 dsa-with-sha1,
                       issuer CN=CarlDSS, validity 990817011049Z - 391231235959Z,
                       subject CN=AliceDSS, SPKI id-dsa 1.2.840.10040.4.1
                       (p 1024 bits, q 160 bits, g, y),
                       extensions: basicConstraints critical cA FALSE;
                       keyUsage critical digitalSignature nonRepudiation;
                       authorityKeyIdentifier 70443e822e6f87de4ad375e33d20bc432b93f11f;
                       subjectKeyIdentifier be6ca1b3e3c1f7ed4370a4ce1301e2fde397fecd;
                       subjectAltName rfc822Name AliceDSS@example.com;
                       signatureValue BIT STRING (Dss-Sig-Value r 20, s 21 octets)
        824        signerInfos SET (99)
        826          SignerInfo SEQUENCE (97): version 1,
                       sid IssuerAndSerialNumber CN=CarlDSS / 200,
                       digestAlgorithm sha1, no signedAttrs,
                       signatureAlgorithm 1.2.840.10040.4.3 dsa-with-sha1,
                       signature OCTET STRING (46) Dss-Sig-Value r 20, s 20 octets
        925  end
      econtent_sha1: fa830bb3ece0b67efc5b58505ec9e2cbbeb7df1e
      note: >-
        With no signed attributes the DSA signature is over SHA-1 of the 30
        eContent octets (external: RFC 5652 §5.4); econtent_sha1 is that
        digest. OpenSSL 3.0.13 `cms -verify -noverify -inform DER` accepts
        the signature (-noverify skips only the certificate chain, which
        cannot be built: CarlDSS is not in the source), and rejects a copy
        with one eContent bit flipped. `x509 -text` on the extracted
        certificate shows a 1024-bit DSA key. SHA-1 and DSA with SHA-1 were
        dropped in this version (Appendix B.1, B.2). This is the only
        source example whose signature can be checked. Source issue S-08.
    constrained_by: ["rfc-8551#R-0003", "rfc-8551#R-0004", "rfc-8551#R-0021", "rfc-8551#R-0022", "rfc-8551#R-0025", "rfc-8551#R-0027", "rfc-8551#R-0029", "rfc-8551#R-0061", "rfc-8551#R-0099", "rfc-8551#R-0101", "rfc-8551#R-0102", "rfc-8551#R-0103", "rfc-8551#R-0104", "rfc-8551#R-0114"]
    source_issue: S-08

