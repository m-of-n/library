# ====================================================================
# Source vectors (in_source: true)
# ====================================================================
vectors:
  - id: EX-2.3-01
    title: "key wrap and content-encryption pairing named by the e.g."
    locator: "§2.3"
    source_lines: 707-715
    in_source: true
    fidelity: split
    input:
      key_wrap: "AES-128 key wrap algorithm"
      content_encryption: "AES-128 content-encryption algorithm"
    quote: '(e.g., AES-128 key wrap algorithm with AES-128 content-encryption algorithm)'
    illustrates: "a key wrap algorithm and a content-encryption algorithm whose underlying encryption function (AES) and key size (128) are the same, as R-0016 requires when ECDH ephemeral-static is used."
    expected_basis: stated
    expected_result: "conforming pair: same underlying function, same key size."
    checks:
      - {check: "underlying function of key wrap == underlying function of content encryption", expected: "AES == AES", result: pass}
      - {check: "key size of key wrap == key size of content encryption", expected: "128 == 128", result: pass}
    constrained_by: ["rfc-8551#R-0016", "rfc-8551#R-0017"]

  - id: EX-2.5.2-01
    title: "SMIMECapability for sha256WithRSAEncryption keeps its NULL parameter"
    locator: "§2.5.2"
    source_lines: 903-910
    in_source: true
    fidelity: split
    input: {capabilityID: "sha256WithRSAEncryption", parameters: "NULL"}
    quote: 'For instance, the encoding for the SMIMECapability for sha256WithRSAEncryption includes rather than omits the NULL parameter.'
    illustrates: "identical encoding for table lookup and binary comparison of capabilities."
    expected_basis: stated
    expected_result: "the SMIMECapability encodes parameters as NULL (present), not omitted."
    derived:
      in_source: false
      der_hex: "300d06092a864886f70d01010b0500"
      note: >-
        SEQUENCE { OBJECT IDENTIFIER 1.2.840.113549.1.1.11, NULL }. The OID
        value is not printed in RFC 8551 (external: RFC 4055 / RFC 5754);
        the DER is given only so a harness can compare bytes.
    checks:
      - {check: "parameters field present and equal to NULL (05 00)", expected: "present", result: not-run}
    constrained_by: ["rfc-8551#R-0041", "rfc-8551#R-0042", "rfc-8551#R-0046"]
    ambiguous: true
    ambiguous_reason: >-
      R-0046 (lines 932-934) says 'In the event that there are no
      differentiating parameters for a particular OID, the parameters MUST
      be omitted and MUST NOT be encoded as NULL.' sha256WithRSAEncryption
      has no parameter that differentiates two instances, yet this example
      encodes NULL. The source does not say whether the registered list
      overrides R-0046 for this OID. Source issue S-10.
    source_issue: S-10

  - id: EX-2.5.2-02
    title: "algorithm names as examples of the SMIMECapabilities categories"
    locator: "§2.5.2"
    source_lines: 860-863
    in_source: true
    fidelity: split
    quote: 'The SMIMECapabilities attribute includes signature algorithms (such as "sha256WithRSAEncryption"), symmetric algorithms (such as "AES-128 CBC"), authenticated symmetric algorithms (such as "AES-128 GCM"), and key encipherment algorithms (such as "rsaEncryption").'
    illustrates: "the categories along which R-0040 says the capability list SHOULD be separated."
    expected_basis: stated
    cases:
      - {input: "sha256WithRSAEncryption", expected: "signature algorithm"}
      - {input: "AES-128 CBC", expected: "symmetric algorithm"}
      - {input: "AES-128 GCM", expected: "authenticated symmetric algorithm"}
      - {input: "rsaEncryption", expected: "key encipherment algorithm"}
    expected_result: "each name falls in the category stated; a list grouping them per R-0040 keeps each category contiguous."
    constrained_by: ["rfc-8551#R-0040"]

  - id: EX-2.5.2-03
    title: "rsaEncryption as the example of an ambiguous capability OID"
    locator: "§2.5.2"
    source_lines: 916-928
    in_source: true
    fidelity: split
    input: {oid_name: "rsaEncryption"}
    quote: 'For instance, in an earlier specification, rsaEncryption was ambiguous because it could refer to either a signature algorithm or a key encipherment algorithm.'
    illustrates: "an OID that names two algorithm usages; R-0044 and R-0045 require one usage to keep the OID and a new smimeCapabilities OID for the other."
    expected_basis: stated
    expected_result: "ambiguous: one OID, two usages (signature, key encipherment)."
    constrained_by: ["rfc-8551#R-0044", "rfc-8551#R-0045"]

  - id: EX-2.7.2-01
    title: "RC2 and TripleDES as the examples of weak and weaker algorithms"
    locator: "§2.7.2"
    source_lines: 1139-1141
    in_source: true
    fidelity: split
    quote: 'Algorithms such as RC2 are considered to be weak encryption algorithms.  Algorithms such as TripleDES are not state of the art and are considered to be weaker algorithms than AES.'
    illustrates: "the classification the weak-encryption decision of §2.7.1 (R-0073, R-0074) and §2.7.2 (R-0081) acts on."
    expected_basis: stated
    cases:
      - {input: "RC2", expected: "weak"}
      - {input: "TripleDES", expected: "weaker than AES (not state of the art)"}
    constrained_by: ["rfc-8551#R-0073", "rfc-8551#R-0074", "rfc-8551#R-0081"]

  - id: EX-3.1.4-01
    title: "Sample Canonical MIME Entity (multipart/mixed, not an S/MIME message)"
    locator: "§3.1.4"
    source_lines: 1390-1437
    in_source: true
    fidelity: verbatim
    files:
      - {file: 3.1.4-canonical-mime-entity.eml, sha256: 5c2ec06396ce3d27d524d87c58e485883fcf684c272ab8e96ff117282c35725a}
      - {file: 3.1.4-image-jpeg-part.derived.hex, sha256: cf3a8ee97790114c5f56b85e6a1fb637ef64ac24e36970339fb99276c7fbc11e}
    quote: 'This example shows a multipart/mixed message with full transfer encoding.  This message contains a text part and an attachment.  The sample message text includes characters that are not ASCII and thus need to be transfer encoded.  Though not shown here, the end of each line is <CR><LF>.  The line ending of the MIME headers, the text, and the transfer-encoded parts all MUST be <CR><LF>.'
    quote_2: 'Note that this example is not an example of an S/MIME message.'
    illustrates: "a MIME entity prepared per §3.1 (Steps 1-3): canonical CRLF line ends, transfer encoding on every leaf so the whole entity is 7-bit, ready to be signed, enveloped or compressed."
    expected_basis: stated
    expected_result: >-
      After LF -> CRLF: MIME parse gives multipart/mixed, boundary "bar",
      two parts: (1) text/plain; charset=iso-8859-1, quoted-printable, whose
      decoded text begins with octet 0xA1 (iso-8859-1 inverted exclamation
      mark) and contains a line beginning "From " and four lines ending in a
      space; (2) image/jpeg, base64, 152 octets. Every line of the entity is
      7-bit. Not an S/MIME message: no application/pkcs7-* part.
    checks:
      - {check: "top-level Content-Type", expected: "multipart/mixed; boundary=bar", result: pass}
      - {check: "part count", expected: 2, result: pass}
      - {check: "part 1 Content-Type / Content-Transfer-Encoding", expected: "text/plain; charset=iso-8859-1 / quoted-printable", result: pass}
      - {check: "part 2 Content-Type / Content-Transfer-Encoding", expected: "image/jpeg / base64", result: pass}
      - {check: "every octet of the fixture is < 0x80 (7-bit, R-0097 / R-0093)", expected: true, result: pass}
      - {check: "no line of the fixture has trailing whitespace (the trailing spaces are carried as =20)", expected: true, result: pass}
      - {check: "part 2 base64 decodes", expected: "152 octets, sha256 9fd1947d…", result: pass}
      - {check: "is S/MIME per §3.10", expected: false, result: pass}
    derived:
      in_source: false
      qp_decoding: >-
        '=A1' decodes to octet 0xA1; 'From=20because' decodes to 'From
        because' (a line that no longer begins with 'From ' on the wire);
        each 'any =20' style line end decodes to a literal space plus the
        encoded space, i.e. two trailing spaces (external: RFC 2045 §6.7).
      image_jpeg_part: >-
        The 152 decoded octets are not a JPEG (a JPEG begins ff d8). They
        parse as one OpenPGP packet in the old format: tag octet 0x89
        (packet type 2, Signature; two-octet length 0x0095 = 149), version
        3, hashed length 5, signature type 0x01 (canonical text), creation
        time 0x309ad117, key ID 637da1606084f0c9, public-key algorithm 1
        (RSA), hash algorithm 1 (MD5), left 16 bits 3d51, one MPI of 1024
        bits (128 octets). 3+1+1+1+4+8+1+1+2+2+128 = 152 (external: RFC
        9580 §5.2.2). GnuPG `--list-packets` agrees: "ctb=89 tag=2 hlen=3
        plen=149 ... signature packet: algo 1, keyid 637DA1606084F0C9 ...
        version 3, created 815452439 ... sigclass 0x01 ... digest algo 1,
        begin of digest 3d 51 ... data: [1024 bits]". The part is
        illustrative filler; it does not affect the example. Source issue
        S-09.
    constrained_by: ["rfc-8551#R-0085", "rfc-8551#R-0088", "rfc-8551#R-0089", "rfc-8551#R-0093", "rfc-8551#R-0097", "rfc-8551#R-0098"]
    source_issue: S-09

  - id: EX-3.2.2-01
    title: "OID.<oid> smime-type string, AES-128 CBC"
    locator: "§3.2.2, guideline 3"
    source_lines: 1557-1559
    in_source: true
    fidelity: split
    input: {common_string_assigned: false, oid: "2.16.840.1.101.3.4.1.2"}
    quote: 'If no common string is assigned, then the common string of "OID.<oid>" is recommended (for example, "OID.2.16.840.1.101.3.4.1.2" would be AES-128 CBC).'
    illustrates: "the fallback name for a content OID with no assigned common string."
    expected_basis: stated
    expected_result: 'common string "OID.2.16.840.1.101.3.4.1.2", which names AES-128 CBC.'
    checks:
      - {check: "string == 'OID.' + dotted OID", expected: "OID.2.16.840.1.101.3.4.1.2", result: pass}
    derived:
      in_source: false
      note: "2.16.840.1.101.3.4.1.2 is id-aes128-CBC (external: RFC 3565). The example's pairing of OID and name holds. §1.6 (line 551) records that this example was updated to the AES-128 CBC OID."
    constrained_by: ["rfc-8551#R-0109", "rfc-8551#R-0111"]

  - id: EX-3.2.2-02
    title: "certs-only takes no signed- prefix"
    locator: "§3.2.2, guideline 1"
    source_lines: 1547-1551
    in_source: true
    fidelity: split
    input: {smime_type: "certs-only", operations_applicable: ["signing"]}
    quote: 'If both signing and encryption can be applied to the content, then three values for smime-type SHOULD be assigned: "signed-*", "authEnv-*", and "enveloped-*".  If one operation can be assigned, then this can be omitted.  Thus, since "certs-only" can only be signed, "signed-" is omitted.'
    expected_basis: stated
    expected_result: 'one value, "certs-only"; no "signed-", "authEnv-" or "enveloped-" variants.'
    constrained_by: ["rfc-8551#R-0110"]

