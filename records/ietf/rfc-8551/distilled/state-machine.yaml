        constrained_by: ['rfc-8551#R-0100', 'rfc-8551#R-0101', 'rfc-8551#R-0102', 'rfc-8551#R-0103', 'rfc-8551#R-0104', 'rfc-8551#R-0105', 'rfc-8551#R-0106']
        inferred: false
      - id: 'M01-T21'
        from: 'contentinfo-wrapped'
        to: 'pkcs7-mime-entity'
        trigger: 'completion'
        guard: 'The ContentInfo carries the degenerate SignedData of §3.8. smime-type is certs-only; extension .p7c.'
        quote: 'The ContentInfo object is enclosed in an application/pkcs7-mime MIME entity.'
        locator: '§3.8, Step 3'
        constrained_by: ['rfc-8551#R-0101', 'rfc-8551#R-0102', 'rfc-8551#R-0103', 'rfc-8551#R-0104']
        inferred: false
      - id: 'M01-T22'
        from: 'detached-signeddata-built'
        to: 'multipart-signed-first-part'
        trigger: 'completion'
        guard: 'always'
        quote: 'The MIME entity is inserted into the first part of a multipart/signed message with no processing other than that described in Section 3.1.'
        locator: '§3.5.3.2, Step 3'
        constrained_by: []
        inferred: false
      - id: 'M01-T23'
        from: 'multipart-signed-first-part'
        to: 'pkcs7-signature-entity'
        trigger: 'completion'
        guard: 'always. File extension .p7s.'
        quote: 'Transfer encoding is applied to the "detached signature" CMS SignedData object, and it is inserted into a MIME entity of type application/pkcs7-signature.'
        locator: '§3.5.3.2, Step 4'
        constrained_by: ['rfc-8551#R-0115']
        inferred: false
        note: 'No step wraps the SignedData in ContentInfo, although §3.5.3.1 says the media type always contains one (ST-08).'
      - id: 'M01-T24'
        from: 'pkcs7-signature-entity'
        to: 'multipart-signed-entity'
        trigger: 'completion'
        guard: 'always. Content-Type multipart/signed with protocol="application/pkcs7-signature" (quoted) and micalg listing the digest algorithms used, comma-separated.'
        quote: 'The MIME entity of the application/pkcs7-signature is inserted into the second part of the multipart/signed entity.'
        locator: '§3.5.3.2, Step 5'
        constrained_by: ['rfc-8551#R-0116', 'rfc-8551#R-0117', 'rfc-8551#R-0118', 'rfc-8551#R-0119']
        inferred: false
      - id: 'M01-T25'
        from: 'pkcs7-mime-entity'
        to: 'prepared'
        trigger: 'further_operation_requested'
        guard: 'Another operation is applied with the S/MIME entity just built as the MIME entity to secure. With lossy compression and signing, compression comes first.'
        quote: 'The signed-only, enveloped-only, and compressed-only MIME formats can be nested.'
        locator: '§3.7'
        constrained_by: ['rfc-8551#R-0121']
        inferred: true
        inferred_reason: 'Re-entry into §3.1 Step 1 for the outer layer is ours; the source says only that the formats nest because each is a MIME entity encapsulating another.'
      - id: 'M01-T26'
        from: 'multipart-signed-entity'
        to: 'prepared'
        trigger: 'further_operation_requested'
        guard: 'As M01-T25 (e.g. the signed message is then enveloped).'
        quote: 'The signed-only, enveloped-only, and compressed-only MIME formats can be nested.'
        locator: '§3.7'
        constrained_by: ['rfc-8551#R-0121']
        inferred: true
        inferred_reason: 'As M01-T25.'
      - id: 'M01-T27'
        from: 'pkcs7-mime-entity'
