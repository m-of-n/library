        constrained_by: []
        inferred: false
      - id: 'M01-T20'
        from: 'contentinfo-wrapped'
        to: 'pkcs7-mime-entity'
        trigger: 'completion'
        guard: 'The ContentInfo carries EnvelopedData, AuthEnvelopedData, SignedData with signers, or CompressedData. smime-type is enveloped-data, authEnveloped-data, signed-data or compressed-data; name and filename smime.p7m (.p7z for compressed-data).'
