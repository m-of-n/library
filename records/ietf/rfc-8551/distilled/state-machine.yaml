record: rfc-8551
reviewed_by: ""
kind: state-machine
source: 'RFC 8551, Secure/Multipurpose Internet Mail Extensions (S/MIME) Version 4.0 Message Specification, Standards Track, April 2019'
source_digest: 'dac39f749a08d3422bd78d4e492195067e7bc03f5fc2d0dac515f0d7ed884ae2'
extracted: '2026-10-19'
extracted_by: 'FX-1 pass 1 (extract), state-machine agent, effort high, from the source text only'
verified: '2026-10-19'
verified_by: 'FX-1 pass 2 (verify), independent state-machine verifier, from the source text only: every quote an exact run of the unwrapped source (spacing kept, no blank-line or page-break crossing), every locator naming the section that holds its quote, every constrained_by id resolving, reachability and exits checked per machine. 11 machines, 89 states, 129 transitions (38 states and 41 transitions inferred), 38 triggers (15 messages, 23 events), 13 source tensions, 10 not_modelled. Pass 2 added terminal_states, M04-T17, M11-T11 to M11-T13 and ST-13, made M03-T12 inferred, made the guards out of M04 checking-key-size, M04 checking-attributes and M06 rule-1-applies mutually exclusive, and fixed the ST-03 locator.'
cross_checked: '2026-10-19'
cross_checked_by: 'FX-1 pass 3 (cross-check), state machine against messages.yaml, protocol.yaml and requirements.yaml, checked mechanically and then by reading: every transition trigger is declared in triggers_used, every message trigger resolves to a messages.yaml entry (resolves_to, added in pass 3), every event trigger has a definition, no declared trigger is unused, every from, to, initial, error and terminal state exists in its machine, every state is reachable, and every constrained_by id exists in requirements.yaml. 11 machines, 90 states, 131 transitions (39 states and 43 transitions inferred), 39 triggers (15 messages, 24 events), 13 source tensions, 10 not_modelled. Pass 3 added M02-T05 with the state signature-invalidated-modified and the event intermediate_agent_modifies (protocol.yaml multipart-signed-in-transit step 4 and signed-only-multipart-signed step 8 had a gateway breaking the signature, M02 did not), added M06-T14 (protocol.yaml encryption-algorithm-selection step 3 offers the human risk review for any weaker algorithm, M06 only after Rule 1), wired the §4.2 and §4.4 key-size tables into the M01 build guards (protocol.yaml signed-only-pkcs7-mime step 1 and enveloped-only step 2 check them), recorded the smime-type hint against content-type disagreement with protocol.yaml smime-identification step 4 (M03 unspecified), an unusable preferred certificate (M10 unspecified), the Rule 1 exhausted-list reading against protocol.yaml (ST-03), and the one state with no exit that is not terminal (M11 MAY, in this note).'
note: >-
  Every lifecycle RFC 8551 describes or implies, as machines an
  implementation or a test harness can drive. RFC 8551 is mostly a format
  profile of CMS and MIME, so most of its machines are procedures (the
  numbered Step lists of sections 3.1 to 3.8), decisions (2.5.3.1, 2.7.1)
  and caches (2.5.3, 2.7.1); the one true transport lifecycle is the
  clear-signed message of 3.1.3. M01 is message creation, M02 a
  multipart/signed message in transport, M03 receipt and unwrapping, M04
  verification of one SignerInfo, M05 decryption of one EnvelopedData or
  AuthEnvelopedData layer, M06 content-encryption algorithm selection, M07
  the multiple-recipient split of 2.7.3, M08 the SMIMECapabilities cache, M09
  the encryption key preference cache, M10 recipient key management
  certificate selection, and M11 the requirement-level lifecycle of section
  1.3 across revisions of the specification. M03 invokes M04 and M05; M01
  invokes M06 and M10; M04 feeds M08 and M09.

  Section 3.1 binds by result, not by procedure: the steps are descriptive
  rather than prescriptive and any procedure is allowed as long as the result
  is the same. A machine here is one implementation of the behaviour, and the
  observable result (the MIME entity produced, the verification or decryption
  outcome, the stored list) is what binds.

  Quotes. Every quote is one contiguous run of source characters with the RFC
  line wrapping undone: a line break and the indent that follows become one
  space. Spacing inside a line, including the two spaces the RFC puts after a
  full stop and the column padding of the section 4.2 to 4.5 key-size rows,
  is kept. No quote crosses a blank line or a page break, and no two passages
  are spliced. A quote is reused where one sentence supports several
  elements. Lowercase should, must and may are not BCP 14 here (section 1.3
  adopts RFC 8174); where a quote carries them, the transition is guidance,
  and constrained_by is empty or names only the capitalised requirement.

  Flags and fields. Machine, state and event names are ours; ids are M01 to
  M11 and Mnn-Tnn. inferred: true marks a state or transition the source does
  not literally state; inferred_reason says what was supplied. A trigger is a
  message named as the source names it (a media type with its smime-type, a
  CMS content type, a signed attribute) or a named event; every trigger is
  listed once under triggers_used, tagged message or event, for the
  cross-check pass to reconcile against messages.yaml; resolves_to, on every
  message trigger, names the messages.yaml entry (MSG-nn), field or variant
  it reconciles to (pass 3). completion is the UML
  completion event: the activity of the source state has finished and the
  guards pick the branch. error_states are states in which the machine yields
  no usable result. terminal_states are the states with no exit, where one run
  of the machine ends (pass 2: they were marked nowhere); an empty list means
  the machine has none. The one state with no exit that is not listed is M11
  MAY: the source gives it no exit, and the M11 note records it as open, not
  terminal (pass 3). A guard of always means the transition is taken whenever
  its trigger occurs. constrained_by lists rfc-8551#R-NNNN entries of
  requirements.yaml whose text is quoted by, or governs, the transition; it
  was checked mechanically to name only ids that exist. unspecified entries
  record situations the source leaves open and are not transitions. Source
  tensions are recorded under source_tensions and are never repaired here.

triggers_used:
  # ---------------------------------------------------------------- messages
  - name: 'MIME entity'
    kind: 'message'
    resolves_to: 'MSG-25 (Inner MIME entity). For M03-T05 the entity may be a top-level message that matches no §3.10 criterion; messages.yaml profiles only the S/MIME criteria (MSG-39), so such an entity is any MIME message.'
    locator: '§3.1'
    quote: 'A MIME message is composed of a MIME header and a MIME body.'
    note: 'The canonical MIME entity to be secured (sending) or the entity found after a layer is removed (receiving). Not a CMS type.'
  - name: 'message/rfc822'
    kind: 'message'
    resolves_to: 'MSG-26 (message/rfc822 header-protection wrapper)'
    locator: '§3.1'
    quote: 'In order to protect outer, non-content-related message header fields (for instance, the "Subject", "To", "From", and "Cc" fields), the sending client MAY wrap a full MIME message in a message/rfc822 wrapper in order to apply S/MIME security services to these header fields.'
  - name: 'application/pkcs7-mime'
    kind: 'message'
    resolves_to: 'MSG-27 (application/pkcs7-mime); MSG-39 field application/octet-stream is the other route into identified-pkcs7-mime'
    locator: '§3.2, §3.10'
    quote: 'The application/pkcs7-mime media type is used to carry CMS content types, including EnvelopedData, SignedData, and CompressedData.'
    note: 'Without, or before reading, the smime-type parameter (§3.10 table row 1 matches on the media type alone).'
  - name: 'application/pkcs7-mime; smime-type=enveloped-data'
    kind: 'message'
    resolves_to: 'MSG-29; MSG-28 field enveloped-data; when smime-type is absent (a SHOULD, R-0101, and not a parameter of the application/octet-stream entity that M03-T03 identifies by suffix), M03 raises this trigger from the ContentInfo (MSG-01) contentType instead, MSG-27 carrying EnvelopedData (MSG-15)'
    locator: '§3.3'
    quote: 'The smime-type parameter for enveloped-only messages is "enveloped-data".'
  - name: 'application/pkcs7-mime; smime-type=authEnveloped-data'
    kind: 'message'
    resolves_to: 'MSG-31; MSG-28 field authEnveloped-data; when smime-type is absent (a SHOULD, R-0101, and not a parameter of the application/octet-stream entity that M03-T03 identifies by suffix), M03 raises this trigger from the ContentInfo (MSG-01) contentType instead, MSG-27 carrying AuthEnvelopedData (MSG-22)'
    locator: '§3.4'
    quote: 'The smime-type parameter for authenticated enveloped-only messages is "authEnveloped-data".'
  - name: 'application/pkcs7-mime; smime-type=signed-data'
    kind: 'message'
    resolves_to: 'MSG-30; MSG-28 field signed-data; when smime-type is absent (a SHOULD, R-0101, and not a parameter of the application/octet-stream entity that M03-T03 identifies by suffix), M03 raises this trigger from the ContentInfo (MSG-01) contentType instead, MSG-27 carrying SignedData (MSG-03) with signerInfos present'
    locator: '§3.5.2'
    quote: 'The smime-type parameter for messages using application/pkcs7-mime with SignedData is "signed-data".'
  - name: 'application/pkcs7-mime; smime-type=compressed-data'
    kind: 'message'
    resolves_to: 'MSG-32; MSG-28 field compressed-data; when smime-type is absent (a SHOULD, R-0101, and not a parameter of the application/octet-stream entity that M03-T03 identifies by suffix), M03 raises this trigger from the ContentInfo (MSG-01) contentType instead, MSG-27 carrying CompressedData (MSG-24)'
    locator: '§3.6'
    quote: 'The smime-type parameter for compressed-only messages is "compressed-data".'
  - name: 'application/pkcs7-mime; smime-type=certs-only'
    kind: 'message'
    resolves_to: 'MSG-33 (certificate management message); MSG-28 field certs-only; when smime-type is absent (a SHOULD, R-0101, and not a parameter of the application/octet-stream entity that M03-T03 identifies by suffix), M03 raises this trigger from the ContentInfo (MSG-01) contentType instead, MSG-27 carrying the degenerate SignedData of §3.8 (MSG-03, MSG-33)'
    locator: '§3.8'
    quote: 'The smime-type parameter for a certificate management message is "certs-only".'
  - name: 'multipart/signed'
    kind: 'message'
    resolves_to: 'MSG-36 (multipart/signed); MSG-39 field multipart/signed'
    locator: '§3.5.3, §3.10'
    quote: 'The multipart/signed media type has two parts.  The first part contains the MIME entity that is signed; the second part contains the "detached signature" CMS SignedData object in which the encapContentInfo eContent field is absent.'
    note: 'With protocol="application/pkcs7-signature" (§3.10 table row 2, R-0116).'
  - name: 'application/octet-stream'
    kind: 'message'
    resolves_to: 'MSG-39 field application/octet-stream (identification by file suffix)'
    locator: '§3.10'
    quote: 'The file suffix in the table below comes from the "name" parameter in the Content-Type header field or the "filename" parameter in the Content-Disposition header field.'
    note: 'An S/MIME object whose media type a gateway defaulted to application/octet-stream (§3.2.1); identified only by file suffix p7m, p7s, p7c or p7z. See ST-01.'
  - name: 'SignerInfo'
    kind: 'message'
    resolves_to: 'MSG-05 (SignerInfo)'
    locator: '§2.5'
    quote: 'The SignerInfo type allows the inclusion of unsigned and signed attributes along with a signature.'
    note: 'One SignerInfo of a received SignedData, whether carried in application/pkcs7-mime; smime-type=signed-data or in the application/pkcs7-signature part of multipart/signed.'
  - name: 'EnvelopedData'
    kind: 'message'
    resolves_to: 'MSG-15 (EnvelopedData)'
    locator: '§2.4.3'
    quote: 'This content type is used to apply data confidentiality to a message.'
  - name: 'AuthEnvelopedData'
    kind: 'message'
    resolves_to: 'MSG-22 (AuthEnvelopedData)'
    locator: '§2.4.4'
    quote: 'This content type is used to apply data confidentiality and message integrity to a message.'
  - name: 'SMIMECapabilities'
    kind: 'message'
    resolves_to: 'MSG-10 (SMIMECapabilities attribute); MSG-07 field smimeCapabilities'
    locator: '§2.5.2'
    quote: 'If present, the SMIMECapabilities attribute MUST be a SignedAttribute.'
    note: 'A signed attribute, received inside a SignerInfo of an incoming signed message.'
  - name: 'SMIMEEncryptionKeyPreference'
    kind: 'message'
    resolves_to: 'MSG-14 (SMIMEEncryptionKeyPreference attribute); MSG-07 field encrypKeyPref'
    locator: '§2.5.3'
    quote: 'If present, the SMIMEEncryptionKeyPreference attribute MUST be a SignedAttribute.'
    note: 'A signed attribute, received inside a SignerInfo of an incoming signed message.'
  # ------------------------------------------------------------------ events
  - name: 'completion'
    kind: 'event'
    locator: 'none'
    inferred: true
    inferred_reason: 'Modelling device, not source text: the activity of the source state has finished and the guards choose the branch.'
  - name: 'secure_requested'
    kind: 'event'
    locator: '§3.1'
    quote: 'A single procedure is used for creating MIME entities that are to have any combination of signing, enveloping, and compressing applied.'
    inferred: true
    inferred_reason: 'The source names the procedure, not the request that starts it. Carries the content and the operation (sign in one of the two formats, envelope, authenticated envelope, compress).'
  - name: 'header_protection_requested'
    kind: 'event'
    locator: '§3.1'
    quote: 'In order to protect outer, non-content-related message header fields (for instance, the "Subject", "To", "From", and "Cc" fields), the sending client MAY wrap a full MIME message in a message/rfc822 wrapper in order to apply S/MIME security services to these header fields.'
    inferred: true
    inferred_reason: 'The source names the option (MAY), not an event.'
  - name: 'certs_only_requested'
    kind: 'event'
    locator: '§3.8'
    quote: 'The certificate management message or MIME entity is used to transport certificates and/or Certificate Revocation Lists (CRLs), such as in response to a registration request.'
    inferred: true
    inferred_reason: 'The source names the message, not the request to build one.'
  - name: 'further_operation_requested'
    kind: 'event'
    locator: '§3.7'
    quote: 'It is possible to apply any of the signing, encrypting, and compressing operations in any order.'
    inferred: true
    inferred_reason: 'The source allows nesting; the event that starts the next layer is ours.'
  - name: 'no_further_operation'
    kind: 'event'
    locator: '§3.7'
    quote: 'It is up to the implementer and the user to choose.'
    inferred: true
    inferred_reason: 'Counterpart of further_operation_requested; ours.'
  - name: 'mta_cannot_transmit_8bit'
    kind: 'event'
    locator: '§3.1.3'
    quote: 'If a mail message with 8-bit data were to encounter a message transfer agent that cannot transmit 8-bit or binary data, the agent has three options, none of which are acceptable for a clear-signed message:'
  - name: 'intermediate_agent_modifies'
    kind: 'event'
    locator: '§3.5.1'
    quote: 'Such agents might do line wrapping or content-transfer encoding changes that would break the signature.'
    inferred: true
    inferred_reason: 'The source names the benign intermediate agents and what they might do, not an event. Added in pass 3 for M02-T05.'
  - name: 'verification_completed'
    kind: 'event'
    locator: '§3.1'
    quote: 'When an S/MIME message is received, the security services on the message are processed, and the result is the MIME entity.'
    inferred: true
    inferred_reason: 'Raised by M03 when every invoked M04 instance has ended in signature-valid or signature-valid-flagged. How several SignerInfo outcomes combine is not modelled (NM-02).'
  - name: 'verification_failed'
    kind: 'event'
    locator: '§6'
    quote: 'If messaging environments make use of the fact that a message is signed to change the behavior of message processing (examples would be running rules or UI display hints), without first verifying that the message is actually signed and knowing the state of the signature, this can lead to incorrect handling of the message.'
    inferred: true
    inferred_reason: 'Raised by M03 when an invoked M04 instance ends in an error state.'
  - name: 'decryption_completed'
    kind: 'event'
    locator: '§3.1'
    quote: 'When an S/MIME message is received, the security services on the message are processed, and the result is the MIME entity.'
    inferred: true
    inferred_reason: 'Raised by M03 when the invoked M05 ends in plaintext-authenticated or plaintext-unauthenticated.'
  - name: 'decryption_failed'
    kind: 'event'
    locator: '§6'
    quote: 'It is therefore recommended that mail systems migrate to using AES-GCM as quickly as possible and that the decrypted content not be acted on prior to finishing the integrity check.'
    inferred: true
    inferred_reason: 'Raised by M03 when the invoked M05 ends in an error state.'
  - name: 'decompression_completed'
    kind: 'event'
    locator: '§2.4.5'
    quote: 'This content type is used to apply data compression to a message.'
    inferred: true
    inferred_reason: 'The source defines no decompression procedure; the event is ours.'
  - name: 'candidate_verified'
    kind: 'event'
    locator: '§2.6'
    quote: 'MUST be prepared to try each matching certificate during signature verification before indicating an error condition.'
    inferred: true
    inferred_reason: 'The signature value of the SignerInfo verifies under the candidate certificate''s public key (the CMS check, RFC 5652); the event name is ours.'
  - name: 'candidate_failed'
    kind: 'event'
    locator: '§2.6'
    quote: 'MUST be prepared to try each matching certificate during signature verification before indicating an error condition.'
    inferred: true
    inferred_reason: 'The signature value does not verify under the candidate certificate; the event name is ours.'
  - name: 'status_indicator_refresh'
    kind: 'event'
    locator: '§6'
    quote: 'Visual indicators on messages may need to have the signature validation code checked periodically if the indicator is supposed to give information on the current status of a message.'
    inferred: true
    inferred_reason: 'The source suggests periodic re-checking; the event is ours.'
  - name: 'integrity_check_passed'
    kind: 'event'
    locator: '§6'
    quote: 'It is therefore recommended that mail systems migrate to using AES-GCM as quickly as possible and that the decrypted content not be acted on prior to finishing the integrity check.'
    inferred: true
    inferred_reason: 'The authentication tag of the AEAD algorithm verifies (RFC 5083, RFC 5084); the event name is ours.'
  - name: 'integrity_check_failed'
    kind: 'event'
    locator: '§6'
    quote: 'It is therefore recommended that mail systems migrate to using AES-GCM as quickly as possible and that the decrypted content not be acted on prior to finishing the integrity check.'
    inferred: true
    inferred_reason: 'The source never states the failing branch; the event is ours.'
  - name: 'encryption_requested'
    kind: 'event'
    locator: '§2.7.1'
    quote: 'When a sending agent creates an encrypted message, it has to decide which type of encryption to use.'
  - name: 'sender_accepts_risk'
    kind: 'event'
    locator: '§2.7.2'
    quote: 'A sending agent that is controlled by a human SHOULD allow a human sender to determine the risks of sending data using a weaker encryption algorithm before sending the data, and possibly allow the human to use a stronger encryption algorithm such as AES GCM or AES CBC even if there is a possibility that the recipient will not be able to process that algorithm.'
    inferred: true
    inferred_reason: 'The source names the human determination, not its outcomes; the three outcome events are ours.'
  - name: 'sender_selects_stronger'
    kind: 'event'
    locator: '§2.7.2'
    quote: 'A sending agent that is controlled by a human SHOULD allow a human sender to determine the risks of sending data using a weaker encryption algorithm before sending the data, and possibly allow the human to use a stronger encryption algorithm such as AES GCM or AES CBC even if there is a possibility that the recipient will not be able to process that algorithm.'
    inferred: true
    inferred_reason: 'As sender_accepts_risk.'
  - name: 'sender_declines'
    kind: 'event'
    locator: '§2.7.2'
    quote: 'A sending agent that is controlled by a human SHOULD allow a human sender to determine the risks of sending data using a weaker encryption algorithm before sending the data, and possibly allow the human to use a stronger encryption algorithm such as AES GCM or AES CBC even if there is a possibility that the recipient will not be able to process that algorithm.'
    inferred: true
    inferred_reason: 'As sender_accepts_risk; the source does not say the sender may abandon sending.'
  - name: 'enveloping_for_recipient'
    kind: 'event'
    locator: '§2.5.3.1'
    quote: 'In order to determine the key management certificate to be used when sending a future CMS EnvelopedData message for a particular recipient, the following steps SHOULD be followed:'
    inferred: true
    inferred_reason: 'The source names the purpose, not an event.'
  - name: 'specification_revision'
    kind: 'event'
    locator: '§1.3, Appendix B'
    quote: 'Over the course of updating the S/MIME specifications, the set of recommended algorithms has been modified each time the documents have been updated.'
    note: 'A new version of the S/MIME Message Specification is published. Used only by M11.'

machines:
  # ======================================================================
  - id: 'M01'
    name: 'message-creation'
    locator: '§3, §3.1, §3.1.1, §3.1.2, §3.1.3, §3.2, §3.3, §3.4, §3.5.2, §3.5.3.2, §3.6, §3.7, §3.8'
    actor: 'sending agent'
    purpose: 'Turn content into a ready-to-send S/MIME MIME entity: prepare, canonicalize and transfer-encode the inner MIME entity (§3.1), process it into a CMS object, wrap it in ContentInfo and MIME (§3.3 to §3.6), or build multipart/signed (§3.5.3.2), or build a certs-only message (§3.8); optionally repeat for nested operations (§3.7).'
    invokes:
      - 'M06 before M01-T09 and M01-T10, to choose the content-encryption algorithm'
      - 'M10 before M01-T09 and M01-T10, once per recipient, to choose the key management certificate'
      - 'M07 when the recipients of one encrypted message do not share a capability'
    initial: 'content-to-secure'
    states:
      - name: 'content-to-secure'
        meaning: 'The sending agent holds content to secure and an operation to apply: a MIME entity for sign, envelope, authenticated envelope or compress; certificates and/or CRLs for certs-only.'
        inferred: true
      - name: 'rfc822-wrapped'
        meaning: 'A full MIME message has been wrapped in message/rfc822 so that its outer header fields are protected.'
        inferred: false
      - name: 'prepared'
        meaning: '§3.1 Step 1 done: the MIME entity is prepared according to local conventions.'
        inferred: false
      - name: 'canonicalized'
        meaning: '§3.1 Step 2 done: the leaf parts are in canonical form; text has <CR><LF> line endings and a canonicalized charset.'
        inferred: false
      - name: 'transfer-encoded'
        meaning: '§3.1 Step 3 done: transfer encoding is applied to the leaves (7-bit-safe, or binary for inner entities when every recipient handles inner binary). The inner MIME entity is ready for CMS processing.'
        inferred: false
      - name: 'signeddata-built'
        meaning: 'A CMS SignedData with eContentType id-data and the MIME entity in eContent (§3.5.2 Step 2).'
        inferred: false
      - name: 'detached-signeddata-built'
        meaning: 'A CMS SignedData in which encapContentInfo eContent is absent (§3.5.3.2 Step 2).'
        inferred: false
      - name: 'envelopeddata-built'
        meaning: 'A CMS EnvelopedData carrying the encrypted MIME entity, with a copy of the CEK for each recipient and, normally, for the originator (§3.3 Step 2).'
        inferred: false
      - name: 'authenvelopeddata-built'
        meaning: 'A CMS AuthEnvelopedData, likewise (§3.4 Step 2).'
        inferred: false
      - name: 'compresseddata-built'
        meaning: 'A CMS CompressedData (§3.6 Step 2).'
        inferred: false
      - name: 'certs-only-signeddata-built'
        meaning: 'A degenerate SignedData: eContent absent, signerInfos empty, certificates and/or CRLs present (§3.8 Step 1).'
        inferred: false
      - name: 'contentinfo-wrapped'
        meaning: 'The CMS object is wrapped in a CMS ContentInfo (Step 3 of §3.3, §3.4, §3.5.2, §3.6; Step 2 of §3.8).'
        inferred: false
      - name: 'pkcs7-mime-entity'
        meaning: 'The ContentInfo is inside an application/pkcs7-mime MIME entity whose smime-type names the CMS type (enveloped-data, authEnveloped-data, signed-data, compressed-data, certs-only).'
        inferred: false
      - name: 'multipart-signed-first-part'
        meaning: 'The signed MIME entity is the first part of a multipart/signed (§3.5.3.2 Step 3).'
        inferred: false
      - name: 'pkcs7-signature-entity'
        meaning: 'The transfer-encoded detached SignedData is inside an application/pkcs7-signature MIME entity (§3.5.3.2 Step 4).'
        inferred: false
      - name: 'multipart-signed-entity'
        meaning: 'The application/pkcs7-signature entity is the second part; the multipart/signed carries protocol="application/pkcs7-signature" and micalg (§3.5.3.2 Step 5).'
        inferred: false
      - name: 'ready-to-send'
        meaning: 'The outermost S/MIME entity is complete and handed to the transport.'
        inferred: true
      - name: 'not-creatable'
        meaning: 'The requested operation cannot be completed: no certificate to sign with, no public key for some recipient, or no acceptable content-encryption algorithm.'
        inferred: true
        kind: 'error'
    transitions:
      - id: 'M01-T01'
        from: 'content-to-secure'
        to: 'rfc822-wrapped'
        trigger: 'header_protection_requested'
        guard: 'The content is a full MIME message and the sending client chooses to protect its outer header fields.'
        quote: 'In order to protect outer, non-content-related message header fields (for instance, the "Subject", "To", "From", and "Cc" fields), the sending client MAY wrap a full MIME message in a message/rfc822 wrapper in order to apply S/MIME security services to these header fields.'
        locator: '§3.1'
        constrained_by: ['rfc-8551#R-0082']
        inferred: false
      - id: 'M01-T02'
        from: 'content-to-secure'
        to: 'prepared'
        trigger: 'secure_requested'
        guard: 'The operation is sign (either format), envelope, authenticated envelope or compress, and header protection is not requested.'
        quote: 'The MIME entity is prepared according to local conventions.'
        locator: '§3.1, Step 1'
        constrained_by: ['rfc-8551#R-0001']
        inferred: false
      - id: 'M01-T03'
        from: 'rfc822-wrapped'
        to: 'prepared'
        trigger: 'completion'
        guard: 'always'
        quote: 'The MIME entity is prepared according to local conventions.'
