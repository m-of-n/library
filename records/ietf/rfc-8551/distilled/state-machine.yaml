        guard: 'The operation is sign in the application/pkcs7-mime format (§3.5.1 leaves the choice to the sender), the sending agent has a certificate for the signature, and for RSA or RSASSA-PSS the agent accepts its key size under the §4.2 table (2048 to 4096 SHOULD, above 4096 MAY, 2047 or less SHOULD NOT; pass 3).'
