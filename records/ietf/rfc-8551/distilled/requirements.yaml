note: >
  Ids are stable and never reused. Cite as rfc-8551#R-NNNN.
  Entries are in source order, with no exception.
  One entry per BCP 14 statement; the split sentences are listed in the
  reconciliation. Every text is a verbatim run of the source with the RFC
  line wrapping undone: a source line break and the indent that follows it
  become a single space, and nothing else is altered. So the two spaces the
  RFC sets after a full stop inside a line are kept, while a full stop at a
  line end is followed by one space, and the column padding inside the
  section 4.2 to 4.5 key-size rows is kept as printed. No text crosses a
  page break or a blank line. ONE EXCEPTION: the RFC breaks the
  hyphenated word content-encryption across lines 709 and 710, printing
  content- at the end of one line and encryption at the start of the next;
  it is rejoined with NO space (R-0016), because inserting one would yield
  a word the source does not contain. A list bullet marker, a Step N label
  and the NOTE: label of Appendix B.2 are not part of any text, so a list
  item that opens with its keyword (MUST support SHA-256.) is quoted from
  the keyword and its actor comes from the list's lead-in (Sending and
  receiving agents:, Receiving agents:, Sending agents:), which the actor
  field names. R-0150 is a comment inside the Appendix A ASN.1 module; the
  comment marker -- that opens its second line is source text and is kept,
  joined with a space like any other line start.
  VERBS. verb is the keyword as written. Section 1.3 defines three extra
  levels, which appear as verbs here: SHOULD+ means the same as SHOULD, and
  the authors expect it to be promoted to a MUST; SHOULD- means the same as
  SHOULD and is expected to be demoted to a MAY (no entry uses it); MUST-
  means the same as MUST, and the authors expect it to remain at least a
  SHOULD or a SHOULD-. A test treats SHOULD+ as SHOULD and MUST- as MUST.
  A key-size row of sections 4.2 to 4.5 has the keyword of its row as verb.
  ACTORS. Section 1.2 defines receiving agent, sending agent and S/MIME agent
  (either or both), and the actor uses those words wherever the source does.
  Where the source names another party (client, implementation, server
  implementation, implementer, interactive sending agent, the maintainer of
  the registered SMIMECapabilities list, authors of specifications that
  assign smime-type values or document capabilities), the actor says which
  agent role it falls on when the source makes that clear.
  LOCATORS. A locator is the section number as printed, after a section
  sign (§2.5.3.1; §B.2 for Appendix B.2; Appendix A for the ASN.1 module),
  then, where the section holds more than one list or display, the item:
  list item N counts the bullets of the section's only list; Receiving
  agents list and Sending agents list name the two lists of section 2.2;
  step N is the N-th bullet of section 2.5.3.1; guideline N is the
  numbered guideline of section 3.2.2; Step N is the printed step of
  sections 3.3, 3.4 and 3.8; key-size table, row N counts the rows of the
  key-size display in sections 4.2 to 4.5 from the top. Section 2.5.3.1 is
  printed in the body but missing from the Table of Contents. Every locator
  was checked mechanically to name the section that contains its text.
  testable is yes when a conformance test can observe the behaviour on the
  wire or at an interface; partial or no carries a testable_reason. Source
  tensions found while extracting are recorded in the testable_reason of the
  entry they affect (R-0022, R-0037, R-0049, R-0080, R-0108, R-0125).

requirements:
  - id: "rfc-8551#R-0001"
    object: 'S/MIME message creation'
    field: 'conformance to this document and to the specifications listed in CMS, RFC 3370, RFC 4056, RFC 3560 and RFC 5754'
    verb: MUST
    actor: 'S/MIME agent (creating messages)'
    locator: "§1.1"
    text: 'In order to create S/MIME messages, an S/MIME agent MUST follow the specifications in this document, as well as the specifications listed in [CMS], [RFC3370], [RFC4056], [RFC3560], and [RFC5754].'
    kind: stated
    testable: partial
    testable_reason: 'an umbrella conformance statement; it is tested through the individual requirements of this document and of the five referenced specifications, not as one check.'
    status: active
  - id: "rfc-8551#R-0002"
    object: 'message digest algorithm (DigestAlgorithmIdentifier)'
    field: 'strength of the body digest algorithm relative to the signature algorithm: similar or greater'
    verb: RECOMMENDED
    actor: 'sending agent (signer)'
    locator: "§2.1"
    text: 'It is RECOMMENDED that the algorithm used for digesting the body of the message be of similar strength to, or greater strength than, the signature algorithm.'
    kind: stated
    testable: partial
    testable_reason: 'the source defines no strength scale; a test can compare security levels (for example SHA-256 with P-256, both 128-bit) only under a chosen equivalence table.'
    status: active
  - id: "rfc-8551#R-0003"
    object: 'digest algorithm support'
    field: 'SHA-256'
    verb: MUST
    actor: 'sending and receiving agents'
    locator: "§2.1, list item 1"
    text: 'MUST support SHA-256.'
    kind: stated
    testable: yes
    status: active
