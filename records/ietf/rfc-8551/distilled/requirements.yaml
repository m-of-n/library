reconciliation: "bin/bcp14-count on .cache/rfc-8551.txt finds 190 BCP 14 keywords once the section 1.3 RFC 2119 / RFC 8174 paragraph (lines 383-387) is stripped: SHOULD 84, MUST 82, MAY 12, MUST NOT 5, SHOULD NOT 4, RECOMMENDED 2, OPTIONAL 1. The counter's pattern forbids only a letter after a keyword, so SHOULD+, SHOULD- and MUST- (section 1.3) count as SHOULD and MUST in the source and in the entry texts alike. The 151 entry texts carry 152: MUST 68, SHOULD 62, MAY 11, MUST NOT 5, SHOULD NOT 4, RECOMMENDED 2. The 38 not extracted are not requirements of this document, each listed by line. (a) 14 in the section 1.3 definitions of the extra requirement levels SHOULD+, SHOULD- and MUST- (lines 401-414: SHOULD 8, MUST 5, MAY 1). They define vocabulary and constrain nothing, as the stripped boilerplate does; their effect is carried by the verb of every entry that uses them, read as the note says. (b) 23 in the change logs, which report what earlier versions changed and bind nothing: section 1.5, 6 (line 459 MUST and SHOULD quoted as examples of capitalized key words, line 462 MUST implement, line 464 SHOULD implement, line 467 SHOULD implement, line 469 MUST implement); section 1.6, 17 (line 489 MUST and SHOULD quoted, line 497 SHOULD+, SHOULD- and MUST- as term names, lines 516-517 MUST and SHOULD-, lines 520-522 MUST, SHOULD+, SHOULD- and SHOULD+, lines 525-526 SHOULD- and SHOULD+, line 529 MUST, which restates section 2.5.1 and is extracted there as R-0035, lines 542-543 MUST, SHOULD+ and SHOULD-). Section 1.7 has none. (c) 1 OPTIONAL at line 3185 in Appendix A, the ASN.1 keyword in parameters ANY DEFINED BY capabilityID OPTIONAL, which is ASN.1 syntax and not BCP 14. 190 - 14 - 23 - 1 = 152, and every keyword is otherwise inside exactly one entry text; this was checked mechanically by mapping every keyword match in the source, outside the boilerplate, to the entry text that covers it. The Appendix A SHOULD at line 3177, in an ASN.1 comment, is a requirement and is R-0150. Lowercase should, must, may, recommended and required are not BCP 14 here, because section 1.3 adopts RFC 8174 (only when they appear in all capitals), so no entry has verb none. Named for the verify pass, as normative-sounding lowercase left out: section 1.4 ought to attempt the greatest interoperability (line 424); section 3.1 it is recommended that these additional steps be performed (line 1228); section 3.2.2 guideline 3, OID.<oid> is recommended (line 1558; the guideline is governed by the SHOULD of its lead-in, R-0109); section 6 the key sizes that must be supported (line 2473), should no longer be used to protect messages (line 2504), Implementers should consider providing different warnings (line 2513), the preconditions The starting key must be bound to a single entity and The message must have exactly one sender and one recipient (lines 2567, 2583), which state when authenticated encryption authenticates the sender and bind no agent, and It is therefore recommended that mail systems migrate to using AES-GCM (line 2654); Appendix B.3 should only be used to decrypt existing email (line 3407) and should be supported only to decrypt existing email; it should not be used to encrypt new emails (lines 3413-3414); Appendix B.4 new mail should use the updated key sizes (lines 3432-3433). The copyright notice's must and may are boilerplate. Nine sentences are split so that each part is separately testable: R-0018/R-0019 (section 2.3, MAY enforce but MUST use the weaker; the but belongs to neither), R-0021/R-0022 and R-0023/R-0024 (section 2.4.1, the two examples, each a content type OID and a storage location), R-0032/R-0033 (section 2.5.1, at the semicolon), R-0062/R-0063 (section 2.6), R-0089/R-0090 (section 3.1.1, line ending and charset), R-0107/R-0108 (section 3.2.1, use media types and not rely on extensions), R-0122/R-0123 (section 3.8 Step 1) and R-0127/R-0128 (section 4.1). In each the connecting and or but, with its comma or semicolon where it has one, belongs to neither part. Not split, because the parts are one check: R-0046 (MUST be omitted and MUST NOT be encoded as NULL; the only entry with two keywords, verb MUST) and R-0071 (two kinds of value under one MUST NOT, joined in the subject so that no verbatim split exists). Three entries keep two sentences because the keyword sentence points back to the first: R-0084, R-0091, R-0099. No entry is kind inferred."
