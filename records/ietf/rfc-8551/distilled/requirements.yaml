    status: active
  - id: "rfc-8551#R-0124"
    object: 'signing certificate'
    field: 'a signing agent holds a certificate for its signature key'
    verb: MUST
    actor: 'sending agent that signs messages'
    locator: "§3.9"
    text: 'A sending agent that signs messages MUST have a certificate for the signature so that a receiving agent can verify the signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0125"
    object: 'certificate retrieval'
    field: 'some mechanism to obtain certificates of the recipients of digital envelopes'
    verb: MUST
    actor: 'receiving agent (as printed)'
    locator: "§4"
    text: 'A receiving agent MUST provide some certificate retrieval mechanism in order to gain access to certificates for recipients of digital envelopes.'
    kind: stated
    testable: partial
    testable_reason: 'some mechanism is unspecified. Source oddity: the agent that needs the certificates of the recipients of a digital envelope is the one that creates it, a sending agent in the §1.2 sense; the sentence names a receiving agent. Kept as printed.'
    status: active
  - id: "rfc-8551#R-0126"
    object: 'correspondent certificate store'
    field: 'user can store and protect correspondents'' certificates for later retrieval'
    verb: SHOULD
    actor: 'receiving and sending agents'
    locator: "§4"
    text: 'Receiving and sending agents SHOULD also provide a mechanism to allow a user to "store and protect" certificates for correspondents in such a way as to guarantee their later retrieval.'
    kind: stated
    testable: partial
    testable_reason: 'checkable as a feature; protect and guarantee are not specified.'
    status: active
  - id: "rfc-8551#R-0127"
    object: 'key pair generation'
    field: 'from a good source of non-deterministic random input (RFC 4086)'
    verb: MUST
    actor: 'S/MIME agent (generating key pairs)'
    locator: "§4.1"
    text: 'All key pairs MUST be generated from a good source of non-deterministic random input [RFC4086]'
    kind: stated
    testable: partial
    testable_reason: 'randomness quality cannot be shown by testing outputs; checkable by review of the entropy source against RFC 4086.'
    status: active
  - id: "rfc-8551#R-0128"
    object: 'private key'
    field: 'protected in a secure fashion'
    verb: MUST
    actor: 'S/MIME agent (holding private keys)'
    locator: "§4.1"
    text: 'the private key MUST be protected in a secure fashion.'
    kind: stated
    testable: no
    testable_reason: 'secure fashion is not defined; only a security review against a chosen key-protection profile can assess it.'
    status: active
