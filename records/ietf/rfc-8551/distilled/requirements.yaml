  - id: "rfc-8551#R-0143"
    object: 'verification with RSA or DSA keys below 1024 bits'
    field: 'user warned when such a signature is verified'
    verb: MUST
    actor: 'S/MIME implementation (receiving agent that supports such verification)'
    locator: "§6"
    text: 'If an implementation supports verification of digital signatures generated with RSA and DSA keys of less than 1024 bits, it MUST warn the user.'
