    status: active
  - id: "rfc-8551#R-0041"
    object: 'SMIMECapability encodings in algorithm specifications'
    field: 'document the exact byte sequence for the common cases'
    verb: SHOULD
    actor: 'specification authors (individuals documenting algorithms for the SMIMECapabilities attribute)'
    locator: "§2.5.2"
    text: 'Because of the requirement for identical encoding, individuals documenting algorithms to be used in the SMIMECapabilities attribute SHOULD explicitly document the correct byte sequence for the common cases.'
    kind: stated
    testable: partial
    testable_reason: 'binds documents, not agents; a reviewer can check that a given algorithm specification prints the encoded SMIMECapability, but common cases is not defined.'
    status: active
  - id: "rfc-8551#R-0042"
    object: 'SMIMECapability parameters'
    field: 'parameters suffice to distinguish two instances of the same algorithm'
    verb: MUST
    actor: 'definer of a capability (and sending agent encoding it)'
    locator: "§2.5.2"
    text: 'For any capability, the associated parameters for the OID MUST specify all of the parameters necessary to differentiate between two instances of the same algorithm.'
    kind: stated
    testable: partial
    testable_reason: 'checkable per capability against its definition (for example key length for a variable-length cipher); what is necessary to differentiate is fixed by each algorithm, not here.'
    status: active
  - id: "rfc-8551#R-0043"
    object: 'SMIMECapability OID'
    field: 'same OID as identifies the algorithm'
    verb: SHOULD
    actor: 'definer of a capability (and sending agent encoding it)'
    locator: "§2.5.2"
    text: 'The same OID that is used to identify an algorithm SHOULD also be used in the SMIMECapability for that algorithm.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0044"
    object: 'SMIMECapability OID shared by several algorithms'
    field: 'a single algorithm assigned to the capability using that OID'
    verb: MUST
    actor: 'maintainer of the registered SMIMECapabilities list'
    locator: "§2.5.2"
    text: 'In these cases, a single algorithm MUST be assigned to the SMIMECapability using that OID.'
    kind: stated
    testable: partial
    testable_reason: 'a registry rule; checkable by inspecting the registered SMIMECapabilities list, not by testing an agent.'
    status: active
  - id: "rfc-8551#R-0045"
    object: 'ambiguous SMIMECapability OID'
    field: 'new OID allocated under smimeCapabilities for the other use'
    verb: MUST
    actor: 'maintainer of the registered SMIMECapabilities list'
    locator: "§2.5.2"
    text: 'In the event that an OID is ambiguous, it needs to be arbitrated by the maintainer of the registered SMIMECapabilities list as to which type of algorithm will use the OID, and a new OID MUST be allocated under the smimeCapabilities OID to satisfy the other use of the OID.'
    kind: stated
    testable: partial
    testable_reason: 'a registry rule; checkable by inspecting the registered SMIMECapabilities list, not by testing an agent.'
    status: active
  - id: "rfc-8551#R-0046"
    object: 'SMIMECapability parameters'
    field: 'omitted, never encoded as NULL, when the OID has no differentiating parameters'
    verb: MUST
    actor: 'sending agent'
    locator: "§2.5.2"
    text: 'In the event that there are no differentiating parameters for a particular OID, the parameters MUST be omitted and MUST NOT be encoded as NULL.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0047"
    object: 'SMIMECapabilities object with unrecognized values'
    field: 'graceful handling'
    verb: MUST
    actor: 'receiving agent'
    locator: "§2.5.2"
    text: 'Receiving agents MUST handle an SMIMECapabilities object that has values that it does not recognize in a graceful manner.'
    kind: stated
    testable: partial
    testable_reason: 'graceful is not defined; a test can check that unknown capability OIDs are ignored without failing the message or the signature.'
    status: active
  - id: "rfc-8551#R-0048"
    object: 'SMIMEEncryptionKeyPreference attribute'
    field: 'carried as a signed attribute when present'
    verb: MUST
    actor: 'sending agent'
    locator: "§2.5.3"
    text: 'If present, the SMIMEEncryptionKeyPreference attribute MUST be a SignedAttribute.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0049"
    object: 'SMIMEEncryptionKeyPreference attribute'
    field: 'a single instance in the SignedAttributes of a signerInfo'
    verb: MUST
    actor: 'sending agent'
    locator: "§2.5.3"
    text: 'The SignedAttributes in a signerInfo MUST include a single instance of the SMIMEEncryptionKeyPreference attribute.'
    kind: stated
    testable: partial
    testable_reason: 'source tension, as in R-0037: read literally the attribute is mandatory in every signerInfo, against If present (R-0048) and the conditional SHOULD of R-0054. At most one instance is testable; whether absence violates this sentence is not decidable from the text.'
    status: active
  - id: "rfc-8551#R-0050"
    object: 'SMIMEEncryptionKeyPreference attribute'
    field: 'attrValues holds exactly one AttributeValue'
    verb: MUST
    actor: 'sending agent'
    locator: "§2.5.3"
    text: 'An SMIMEEncryptionKeyPreference attribute MUST only include a single instance of AttributeValue.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0051"
    object: 'signature carrying a malformed SMIMEEncryptionKeyPreference attribute'
    field: 'treated as failing when R-0048 to R-0050 are violated'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§2.5.3"
    text: 'If a signature is detected as violating these requirements, the signature SHOULD be treated as failing.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0052"
    object: 'certificate referenced by SMIMEEncryptionKeyPreference'
    field: 'included in the certificates of the signed message when the attribute is used'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.5.3"
    text: 'The sending agent SHOULD include the referenced certificate in the set of certificates included in the signed message if this attribute is used.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0053"
    object: 'certificate referenced by SMIMEEncryptionKeyPreference'
    field: 'may be omitted if previously made available to the receiving agent'
    verb: MAY
    actor: 'sending agent'
    locator: "§2.5.3"
    text: 'The certificate MAY be omitted if it has been previously made available to the receiving agent.'
    kind: stated
    testable: partial
    testable_reason: 'whether the certificate was previously made available is the sender''s knowledge, not observable in the message.'
    status: active
  - id: "rfc-8551#R-0054"
    object: 'SMIMEEncryptionKeyPreference attribute'
    field: 'used when the preferred encryption certificate differs from the signing certificate'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.5.3"
    text: 'Sending agents SHOULD use this attribute if the commonly used or preferred encryption certificate is not the same as the certificate used to sign the message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0055"
    object: 'stored encryption key preference'
    field: 'stored when the signature is valid and the signing time is later than the stored one'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§2.5.3"
    text: 'Receiving agents SHOULD store the preference data if the signature on the message is valid and the signing time is greater than the currently stored value.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0056"
    object: 'stored encryption key preference'
    field: 'clock skew checked; data not used if the skew is too great'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§2.5.3"
    text: '(As with the SMIMECapabilities, the clock skew SHOULD be checked and the data not used if the skew is too great.)'
    kind: stated
    testable: partial
    testable_reason: 'too great is not quantified; a test can check that a signing time far in the future is rejected, not where the threshold lies.'
    status: active
  - id: "rfc-8551#R-0057"
    object: 'sender''s encryption key preference'
    field: 'respected when replying, if possible'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§2.5.3"
    text: 'Receiving agents SHOULD respect the sender''s encryption key preference attribute if possible.'
    kind: stated
    testable: partial
    testable_reason: 'if possible leaves the agent to judge; a test can check that the preferred certificate is used when it is valid and available.'
    status: active
  - id: "rfc-8551#R-0058"
    object: 'recipient key management certificate selection'
    field: 'the three steps of §2.5.3.1: preference attribute, then same-subject search, then another method'
    verb: SHOULD
    actor: 'sending agent (preparing EnvelopedData for a recipient)'
    locator: "§2.5.3.1"
    text: 'In order to determine the key management certificate to be used when sending a future CMS EnvelopedData message for a particular recipient, the following steps SHOULD be followed:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0059"
    object: 'recipient key management certificate selection'
    field: 'certificate identified by a received SMIMEEncryptionKeyPreference is used'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.5.3.1, step 1"
    text: 'If an SMIMEEncryptionKeyPreference attribute is found in a SignedData object received from the desired recipient, this identifies the X.509 certificate that SHOULD be used as the X.509 key management certificate for the recipient.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0060"
    object: 'recipient key management certificate selection'
    field: 'without the attribute, search for a key-management certificate with the signer''s subject name'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.5.3.1, step 2"
    text: 'If an SMIMEEncryptionKeyPreference attribute is not found in a SignedData object received from the desired recipient, the set of X.509 certificates SHOULD be searched for an X.509 certificate with the same subject name as the signer of an X.509 certificate that can be used for key management.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0061"
    object: 'SignerIdentifier'
    field: 'both issuerAndSerialNumber and subjectKeyIdentifier choices supported'
    verb: MUST
    actor: 'S/MIME implementation (sending and receiving agents)'
    locator: "§2.6"
    text: 'S/MIME v4.0 implementations MUST support both issuerAndSerialNumber and subjectKeyIdentifier.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0062"
    object: 'subjectKeyIdentifier matching'
    field: 'several certificates, possibly of different entities, may share one subjectKeyIdentifier'
    verb: MUST
    actor: 'S/MIME implementation'
    locator: "§2.6"
    text: 'Implementations MUST be prepared for multiple certificates for potentially different entities to have the same value for subjectKeyIdentifier'
    kind: stated
    testable: partial
    testable_reason: 'be prepared is a design property; a test can present colliding certificates and check that lookup returns all of them, which R-0063 then exercises in verification.'
    status: active
  - id: "rfc-8551#R-0063"
    object: 'signature verification with subjectKeyIdentifier'
    field: 'try each matching certificate before reporting an error'
    verb: MUST
    actor: 'receiving agent (S/MIME implementation verifying)'
    locator: "§2.6"
    text: 'MUST be prepared to try each matching certificate during signature verification before indicating an error condition.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0064"
    object: 'content encryption algorithm support (ContentEncryptionAlgorithmIdentifier)'
    field: 'AES-128 GCM and AES-256 GCM, encryption and decryption (RFC 5084)'
    verb: MUST
    actor: 'sending and receiving agents'
    locator: "§2.7, list item 1"
    text: 'MUST support encryption and decryption with AES-128 GCM and AES-256 GCM [RFC5084].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0065"
    object: 'content encryption algorithm support (ContentEncryptionAlgorithmIdentifier)'
    field: 'AES-128 CBC, encryption and decryption (RFC 3565)'
    verb: MUST-
    actor: 'sending and receiving agents'
    locator: "§2.7, list item 2"
    text: 'MUST- support encryption and decryption with AES-128 CBC [RFC3565].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0066"
    object: 'content encryption algorithm support (ContentEncryptionAlgorithmIdentifier)'
    field: 'ChaCha20-Poly1305, encryption and decryption (RFC 7905)'
    verb: SHOULD+
    actor: 'sending and receiving agents'
    locator: "§2.7, list item 3"
    text: 'SHOULD+ support encryption and decryption with ChaCha20-Poly1305 [RFC7905].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0067"
    object: 'capabilities processing'
    field: 'the §2.7.1 method for processing and remembering capabilities from incoming signed messages'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§2.7.1"
    text: 'The following method for processing and remembering the encryption capabilities attribute in incoming signed messages SHOULD be used.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0068"
    object: 'capabilities list'
    field: 'created, after signature and timestamp checks, with at least signing time and symmetric capabilities'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§2.7.1, list item 1"
    text: 'If the receiving agent has not yet created a list of capabilities for the sender''s public key, then, after verifying the signature on the incoming message and checking the timestamp, the receiving agent SHOULD create a new list containing at least the signing time and the symmetric capabilities.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0069"
    object: 'capabilities list'
    field: 'incoming signing time later than stored, and signature valid, before update'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§2.7.1, list item 2"
    text: 'If such a list already exists, the receiving agent SHOULD verify that the signing time in the incoming message is greater than the signing time stored in the list and that the signature is valid.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0070"
    object: 'capabilities list'
    field: 'signing time and capabilities updated when R-0069 holds'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§2.7.1, list item 2"
    text: 'If so, the receiving agent SHOULD update both the signing time and capabilities in the list.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0071"
    object: 'capabilities list'
    field: 'reject far-future signing times and capabilities from messages whose signature could not be verified'
    verb: MUST NOT
    actor: 'receiving agent'
    locator: "§2.7.1, list item 2"
    text: 'Values of the signing time that lie far in the future (that is, a greater discrepancy than any reasonable clock skew), or a capabilities list in messages whose signature could not be verified, MUST NOT be accepted.'
    kind: stated
    testable: partial
    testable_reason: 'the unverified-signature half is testable; far in the future is bounded only by any reasonable clock skew, which the source does not quantify.'
    status: active
  - id: "rfc-8551#R-0072"
    object: 'capabilities list'
    field: 'stored for future message creation'
    verb: SHOULD
    actor: 'receiving agent (for later use as sending agent)'
    locator: "§2.7.1"
    text: 'The list of capabilities SHOULD be stored for future use in creating messages.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0073"
    object: 'weak encryption decision'
    field: 'decide before sending whether weak encryption is acceptable for the data'
    verb: MUST
    actor: 'sending agent'
    locator: "§2.7.1"
    text: 'Before sending a message, the sending agent MUST decide whether it is willing to use weak encryption for the particular data in the message.'
    kind: stated
    testable: partial
    testable_reason: 'the decision is internal; it is observable only through R-0074 (no weak algorithm when weak encryption is refused) and through configuration that expresses it.'
    status: active
  - id: "rfc-8551#R-0074"
    object: 'weak encryption decision'
    field: 'no weak algorithm when weak encryption is unacceptable; overrides the other §2.7.1 rules'
    verb: MUST NOT
    actor: 'sending agent'
    locator: "§2.7.1"
    text: 'If the sending agent decides that weak encryption is unacceptable for this data, then the sending agent MUST NOT use a weak algorithm.'
    kind: stated
    testable: partial
    testable_reason: 'weak is illustrated (RC2 in §2.7.2, TripleDES as weaker) but not defined as a list; a test can check that a configured refusal of weak encryption blocks RC2 and TripleDES.'
    status: active
  - id: "rfc-8551#R-0075"
    object: 'encryption algorithm choice'
    field: 'the decisions of §2.7.1.1 and §2.7.1.2 are used'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.7.1"
    text: 'Sections 2.7.1.1 and 2.7.1.2 describe the decisions a sending agent SHOULD use when choosing which type of encryption will be applied to a message.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0076"
    object: 'encryption algorithm choice'
    field: 'rules applied in the order given (Rule 1 before Rule 2)'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.7.1"
    text: 'These rules are ordered, so the sending agent SHOULD make its decision in the order given.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0077"
    object: 'encryption algorithm choice, known capabilities'
    field: 'first capability in the recipient''s list that the sender can encrypt with'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.7.1.1"
    text: 'If the sending agent has received a set of capabilities from the recipient for the message the agent is about to encrypt, then the sending agent SHOULD use that information by selecting the first capability in the list (that is, the capability most preferred by the intended recipient) that the sending agent knows how to encrypt.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0078"
    object: 'encryption algorithm choice, known capabilities'
    field: 'use a listed capability when the recipient is reasonably expected to decrypt'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.7.1.1"
    text: 'The sending agent SHOULD use one of the capabilities in the list if the agent reasonably expects the recipient to be able to decrypt the message.'
    kind: stated
    testable: partial
    testable_reason: 'reasonably expects is the sender''s judgement; a test can check only that a listed capability is chosen when one is available.'
    status: active
  - id: "rfc-8551#R-0079"
    object: 'encryption algorithm choice, unknown capabilities and version'
    field: 'AES-256 GCM when both capabilities and S/MIME version of the recipient are unknown'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.7.1.2"
    text: 'If the following two conditions are met, the sending agent SHOULD use AES-256 GCM, as AES-256 GCM is a stronger algorithm and is required by S/MIME v4.0:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0080"
    object: 'encryption algorithm choice, unknown capabilities and version'
    field: 'AES-128 CBC as the fallback when AES-256 GCM is not chosen'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§2.7.1.2"
    text: 'If the sending agent chooses not to use AES-256 GCM in this step, given the presumption is that a client implementing AES-GCM would do both AES-256 and AES-128, it SHOULD use AES-128 CBC.'
    kind: stated
    testable: partial
    testable_reason: 'the choice is testable, but the sentence is internally inconsistent: its premise (a client implementing AES-GCM would do both AES-256 and AES-128) argues for AES-128 GCM, while its conclusion names AES-128 CBC. The extraction keeps the conclusion as printed; the verify pass should check errata.'
    status: active
  - id: "rfc-8551#R-0081"
    object: 'weak encryption, human-controlled sender'
    field: 'let the human weigh the risk of a weaker algorithm, and possibly choose a stronger one'
    verb: SHOULD
    actor: 'sending agent controlled by a human'
    locator: "§2.7.2"
    text: 'A sending agent that is controlled by a human SHOULD allow a human sender to determine the risks of sending data using a weaker encryption algorithm before sending the data, and possibly allow the human to use a stronger encryption algorithm such as AES GCM or AES CBC even if there is a possibility that the recipient will not be able to process that algorithm.'
    kind: stated
    testable: partial
    testable_reason: 'a user-interface behaviour checkable by inspection; the second half is softened by possibly.'
    status: active
  - id: "rfc-8551#R-0082"
    object: 'header protection'
    field: 'wrap a full MIME message in message/rfc822 to protect outer header fields'
    verb: MAY
    actor: 'sending agent (sending client)'
    locator: "§3.1"
    text: 'In order to protect outer, non-content-related message header fields (for instance, the "Subject", "To", "From", and "Cc" fields), the sending client MAY wrap a full MIME message in a message/rfc822 wrapper in order to apply S/MIME security services to these header fields.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0083"
    object: 'header protection, presentation'
    field: 'distinguish protected inner header fields from unprotected outer ones'
    verb: RECOMMENDED
    actor: 'receiving agent (receiving client)'
    locator: "§3.1"
    text: 'Given the security difference between headers, it is RECOMMENDED that the receiving client provide a distinction between header fields, depending on where they are located.'
    kind: stated
    testable: partial
    testable_reason: 'a user-interface behaviour; the form of the distinction is not specified.'
    status: active
  - id: "rfc-8551#R-0084"
    object: 'header protection, presentation'
    field: 'a protected top-level message/rfc822 entity is presented as the top-level message'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§3.1"
    text: 'When an S/MIME message is received, if the top-level protected MIME entity has a Content-Type of message/rfc822, it can be assumed that the intent was to provide header protection.  This entity SHOULD be presented as the top-level message, taking into account header-merging issues as previously discussed.'
    kind: stated
    testable: partial
    testable_reason: 'presentation is checkable by inspection; how header merging is resolved is left to the receiving client (R-0083).'
    status: active
  - id: "rfc-8551#R-0085"
    object: 'MIME entity canonical form'
    field: 'converted to a form uniquely representable where the signature is created and where it is verified'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.1.1"
    text: 'Each MIME entity MUST be converted to a canonical form that is uniquely and unambiguously representable in the environment where the signature is created and the environment where the signature will be verified.'
    kind: stated
    testable: partial
    testable_reason: 'canonical form depends on each media type (R-0087); testable for text (R-0088 to R-0091), not in general.'
    status: active
  - id: "rfc-8551#R-0086"
    object: 'MIME entity canonical form'
    field: 'canonicalization applies to enveloping and compressing as well as signing'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.1.1"
    text: 'MIME entities MUST be canonicalized for enveloping and compressing as well as signing.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0087"
    object: 'canonicalization rules per media type'
    field: 'the standard for the particular media type is consulted'
    verb: SHOULD
    actor: 'implementer (sending agent)'
    locator: "§3.1.1"
    text: 'Instead, the standard for the particular media type SHOULD be consulted.'
    kind: stated
    testable: no
    testable_reason: 'a process instruction to the implementer; its result is tested through the media type''s own canonical form, not through this sentence.'
    status: active
  - id: "rfc-8551#R-0088"
    object: 'text MIME entity canonical form'
    field: 'both line endings and character set canonicalized'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.1.1"
    text: 'MIME entities of major type "text" MUST have both their line endings and character set canonicalized.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0089"
    object: 'text MIME entity canonical form'
    field: 'line ending is CRLF'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.1.1"
    text: 'The line ending MUST be the pair of characters <CR><LF>'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0090"
    object: 'text MIME entity canonical form'
    field: 'charset is an IANA-registered charset'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.1.1"
    text: 'the charset SHOULD be a registered charset [CHARSETS].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0091"
    object: 'text MIME entity canonical form'
    field: 'charsets with several representations (e.g. ISO-2022) use the charset''s canonical representation when signing'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.1.1"
    text: 'Note that some charsets such as ISO-2022 have multiple representations for the same characters.  When preparing such text for signing, the canonical representation specified for the charset MUST be used.'
    kind: stated
    testable: partial
    testable_reason: 'testable only for charsets whose specification defines a canonical representation.'
    status: active
  - id: "rfc-8551#R-0092"
    object: 'binary MIME objects'
    field: 'able to process binary (non-transfer-encoded) MIME objects'
    verb: MUST
    actor: 'S/MIME implementation (receiving agent)'
    locator: "§3.1.2"
    text: 'S/MIME implementations MUST be able to deal with binary MIME objects.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0093"
    object: 'transfer encoding of secured MIME entities'
    field: 'the 7-bit transfer encoding of §3.1.3 for all secured entities, as a rule'
    verb: SHOULD
    actor: 'S/MIME implementation (sending agent)'
    locator: "§3.1.2"
    text: 'As a rule, S/MIME implementations SHOULD use transfer encoding as described in Section 3.1.3 for all MIME entities they secure.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0094"
    object: 'transfer encoding of inner MIME entities'
    field: 'binary encoding for inner entities when all recipients are known to handle it'
    verb: SHOULD
    actor: 'S/MIME implementation (sending agent)'
    locator: "§3.1.2"
    text: 'In the case where S/MIME implementations can determine that all intended recipients are capable of handling inner (all but the outermost) binary MIME objects, implementations SHOULD use binary encoding as opposed to a 7-bit-safe transfer encoding for the inner entities.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0095"
    object: 'recipient binary capability'
    field: 'determined by id-cap-preferBinaryInside, prior agreement or other means'
    verb: MAY
    actor: 'S/MIME implementation (sending agent)'
    locator: "§3.1.2"
    text: 'Implementations MAY determine that recipient implementations are capable of handling inner binary MIME entities by (1) interpreting the id-cap-preferBinaryInside SMIMECapabilities attribute, (2) prior agreement, or (3) other means.'
    kind: stated
    testable: partial
    testable_reason: 'the preferBinaryInside route is testable; prior agreement and other means are not observable.'
    status: active
  - id: "rfc-8551#R-0096"
    object: 'transfer encoding of secured MIME entities'
    field: '7-bit transfer encoding when any recipient cannot handle, or is not known to handle, inner binary'
    verb: SHOULD
    actor: 'S/MIME implementation (sending agent)'
    locator: "§3.1.2"
    text: 'If one or more intended recipients are unable to handle inner binary MIME objects or if this capability is unknown for any of the intended recipients, S/MIME implementations SHOULD use transfer encoding as described in Section 3.1.3 for all MIME entities they secure.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0097"
    object: 'multipart/signed entity'
    field: 'transfer-encoded to 7-bit text when carried over SMTP or another 7-bit transport'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.1.3"
    text: 'If a multipart/signed entity is ever to be transmitted over the standard Internet SMTP infrastructure or other transport that is constrained to 7-bit text, it MUST have transfer encoding applied so that it is represented as 7-bit text.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0098"
    object: 'canonical MIME entity'
    field: 'CRLF line endings in MIME headers, text and transfer-encoded parts'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.1.4"
    text: 'The line ending of the MIME headers, the text, and the transfer-encoded parts all MUST be <CR><LF>.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0099"
    object: 'application/pkcs7-mime content'
    field: 'a §3.1 MIME entity when eContentType is id-data; other contents permitted for other eContentType values'
    verb: MAY
    actor: 'sending agent'
    locator: "§3.2"
    text: 'The carried CMS object always contains a MIME entity that is prepared as described in Section 3.1 if the eContentType is id-data.  Other contents MAY be carried when the eContentType contains different values.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0100"
    object: 'application/pkcs7-mime object'
    field: 'help the receiver know the contents without decoding the ASN.1'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.2"
    text: 'Because there are several types of application/pkcs7-mime objects, a sending agent SHOULD do as much as possible to help a receiving agent know about the contents of the object without forcing the receiving agent to decode the ASN.1 for the object.'
    kind: stated
    testable: partial
    testable_reason: 'as much as possible is open-ended; the concrete measures are R-0101 to R-0106.'
    status: active
  - id: "rfc-8551#R-0101"
    object: 'application/pkcs7-mime Content-Type'
    field: 'smime-type parameter included'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.2"
    text: 'The Content-Type header field of all application/pkcs7-mime objects SHOULD include the optional "smime-type" parameter, as described in the following sections.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0102"
    object: 'application/pkcs7-mime Content-Type'
    field: 'name parameter emitted'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.2.1"
    text: 'For application/pkcs7-mime, sending agents SHOULD emit the optional "name" parameter to the Content-Type field for compatibility with older systems.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0103"
    object: 'application/pkcs7-mime Content-Disposition'
    field: 'Content-Disposition with filename parameter emitted'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.2.1"
    text: 'Sending agents SHOULD also emit the optional Content-Disposition field [RFC2183] with the "filename" parameter.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0104"
    object: 'name and filename parameter values'
    field: 'file extension per the §3.2.1 table: .p7m (SignedData, EnvelopedData, AuthEnvelopedData), .p7c (certs-only), .p7z (CompressedData), .p7s (application/pkcs7-signature)'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.2.1"
    text: 'If a sending agent emits the above parameters, the value of the parameters SHOULD be a filename with the appropriate extension:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0105"
    object: 'name and filename parameter values'
    field: 'eight-character base and three-letter extension'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.2.1"
    text: 'In addition, the filename SHOULD be limited to eight characters followed by a three-letter extension.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0106"
    object: 'name and filename parameter values'
    field: 'filename base smime'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.2.1"
    text: 'The eight-character filename base can be any distinct name; the use of the filename base "smime" SHOULD be used to indicate that the MIME entity is associated with S/MIME.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0107"
    object: 'S/MIME object identification'
    field: 'by media type'
    verb: MUST
    actor: 'S/MIME implementation (receiving agent)'
    locator: "§3.2.1"
    text: 'A proper S/MIME implementation MUST use the media types'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0108"
    object: 'S/MIME object identification'
    field: 'not by file extension'
    verb: MUST NOT
    actor: 'S/MIME implementation (receiving agent)'
    locator: "§3.2.1"
    text: 'MUST NOT rely on the file extensions.'
    kind: stated
    testable: partial
    testable_reason: 'source tension: the §3.10 table counts application/octet-stream with a p7m, p7s, p7c or p7z file suffix as an S/MIME message, which is identification by extension. The two read together as: identify by media type, and use the suffix only as a hint for an octet-stream entity. A test can check that a mismatched extension does not override the media type.'
    status: active
  - id: "rfc-8551#R-0109"
    object: 'new smime-type values'
    field: 'the three §3.2.2 guidelines (signed-/authEnv-/enveloped- triple, common content string, OID.<oid> fallback)'
    verb: SHOULD
    actor: 'authors of specifications that assign smime-type values'
    locator: "§3.2.2"
    text: 'In order for consistency to be obtained with future specifications, the following guidelines SHOULD be followed when assigning a new smime-type parameter.'
    kind: stated
    testable: partial
    testable_reason: 'binds future specifications and the RFC 7114 registry, not agents; checkable by inspecting a proposed value.'
    status: active
  - id: "rfc-8551#R-0110"
    object: 'new smime-type values'
    field: 'three values signed-*, authEnv-* and enveloped-* when both signing and encryption apply'
    verb: SHOULD
    actor: 'authors of specifications that assign smime-type values'
    locator: "§3.2.2, guideline 1"
    text: 'If both signing and encryption can be applied to the content, then three values for smime-type SHOULD be assigned: "signed-*", "authEnv-*", and "enveloped-*".'
    kind: stated
    testable: partial
    testable_reason: 'binds future specifications and the RFC 7114 registry, not agents; checkable by inspecting a proposed value.'
    status: active
  - id: "rfc-8551#R-0111"
    object: 'new smime-type values'
    field: 'a common string assigned for the content OID'
    verb: SHOULD
    actor: 'authors of specifications that assign smime-type values'
    locator: "§3.2.2, guideline 2"
    text: 'A common string for a content OID SHOULD be assigned.'
    kind: stated
    testable: partial
    testable_reason: 'binds future specifications and the RFC 7114 registry, not agents; checkable by inspecting a proposed value.'
    status: active
  - id: "rfc-8551#R-0112"
    object: 'EnvelopedData'
    field: 'CEK also encrypted for the originator'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.3, Step 2"
    text: 'In addition to encrypting a copy of the content-encryption key (CEK) for each recipient, a copy of the CEK SHOULD be encrypted for the originator and included in the EnvelopedData (see [RFC5652], Section 6).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0113"
    object: 'AuthEnvelopedData'
    field: 'CEK also encrypted for the originator'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.4, Step 2"
    text: 'In addition to encrypting a copy of the CEK for each recipient, a copy of the CEK SHOULD be encrypted for the originator and included in the AuthEnvelopedData (see [RFC5083]).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0114"
    object: 'signed-only formats'
    field: 'both application/pkcs7-mime SignedData and multipart/signed handled'
    verb: MUST
    actor: 'receiving agent'
    locator: "§3.5"
    text: 'In general, the multipart/signed form is preferred for sending, and receiving agents MUST be able to handle both.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0115"
    object: 'application/pkcs7-signature SignedData'
    field: 'encapContentInfo eContent absent (detached signature)'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.5.3.1"
    text: 'The SignedData encapContentInfo eContent field MUST be absent.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0116"
    object: 'multipart/signed protocol parameter'
    field: 'value application/pkcs7-signature'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.5.3.2"
    text: 'The protocol parameter MUST be "application/pkcs7-signature".'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0117"
    object: 'multipart/signed protocol parameter'
    field: 'value quoted, because it contains /'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.5.3.2"
    text: 'Note that quotation marks are required around the protocol parameter because MIME requires that the "/" character in the parameter value MUST be quoted.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0118"
    object: 'multipart/signed micalg parameter'
    field: 'several digest algorithms separated by commas (RFC 1847)'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.5.3.2"
    text: 'If multiple message digest algorithms are used, they MUST be separated by commas per [RFC1847].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0119"
    object: 'multipart/signed micalg parameter'
    field: 'values from the §3.5.3.2 table: md5, sha-1, sha-224, sha-256, sha-384, sha-512, else the algorithm profile''s value or unknown'
    verb: SHOULD
    actor: 'sending agent'
    locator: "§3.5.3.2"
    text: 'The values to be placed in the micalg parameter SHOULD be from the following:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0120"
    object: 'multipart/signed micalg parameter'
    field: 'graceful recovery from an unrecognized value'
    verb: SHOULD
    actor: 'receiving agent'
    locator: "§3.5.3.2"
    text: 'Receiving agents SHOULD be able to recover gracefully from a micalg parameter value that they do not recognize.'
    kind: stated
    testable: partial
    testable_reason: 'gracefully is not defined; a test can check that an unknown micalg value does not prevent verification from the SignedData digest algorithm.'
    status: active
  - id: "rfc-8551#R-0121"
    object: 'nested S/MIME'
    field: 'arbitrarily nested S/MIME received and processed within reasonable resource limits'
    verb: MUST
    actor: 'S/MIME implementation (receiving agent)'
    locator: "§3.7"
    text: 'An S/MIME implementation MUST be able to receive and process arbitrarily nested S/MIME within reasonable resource limits of the recipient computer.'
    kind: stated
    testable: partial
    testable_reason: 'reasonable resource limits is not quantified; a test can check nesting of each format pair to a modest depth.'
    status: active
  - id: "rfc-8551#R-0122"
    object: 'certificate management message (certs-only SignedData)'
    field: 'encapContentInfo eContent absent'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.8, Step 1"
    text: 'The SignedData encapContentInfo eContent field MUST be absent'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8551#R-0123"
    object: 'certificate management message (certs-only SignedData)'
    field: 'signerInfos empty'
    verb: MUST
    actor: 'sending agent'
    locator: "§3.8, Step 1"
    text: 'the signerInfos field MUST be empty.'
    kind: stated
