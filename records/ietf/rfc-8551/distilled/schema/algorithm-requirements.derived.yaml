# DERIVED, not verbatim. Written by this library as a machine-readable table
# of the algorithm and key-size requirements of RFC 8551 sections 2.1-2.3,
# 2.7, 2.7.1.2, 4.1-4.5 and 6 (source .cache/rfc-8551.txt, sha256
# dac39f749a08d3422bd78d4e492195067e7bc03f5fc2d0dac515f0d7ed884ae2).
# The RFC states these as bulleted prose lists and key-size tables, not as a
# grammar. Each entry's `text` is the source's own words, verbatim, with the
# RFC line wrapping undone (a line break and the indent after it read as one
# space), and is the text of the requirement named by `req`. `label`, `set`,
# `role`, `test_as` and every key not otherwise noted are this library's.
# The verbatim key-size tables are inline.verbatim.txt I-07..I-10.
# Not covered: Appendix B historic algorithms (informative); algorithm OIDs,
# which RFC 8551 does not print except one (see content_encryption).
schema: "library-derived-table/v0"   # label of this file's own shape; inferred, no external schema
record: rfc-8551
source_digest: "dac39f749a08d3422bd78d4e492195067e7bc03f5fc2d0dac515f0d7ed884ae2"

levels:
  # Section 1.3 (inline.verbatim.txt I-01, lines 401-414). test_as is the
  # BCP 14 level a conformance test applies, from "This term means the same
  # as ..." in each definition. expectation is a paraphrase-free pointer to
  # the rest of each definition, by line.
  MUST:        {test_as: MUST}
  "MUST-":     {test_as: MUST,   expectation: "lines 409-414"}
  "SHOULD+":   {test_as: SHOULD, expectation: "lines 401-403"}
  SHOULD:      {test_as: SHOULD}
  "SHOULD-":   {test_as: SHOULD, expectation: "lines 405-407"}   # used by no requirement of RFC 8551 outside the change logs
  MAY:         {test_as: MAY}
  "SHOULD NOT": {test_as: "SHOULD NOT"}
  "MUST NOT":  {test_as: "MUST NOT"}

roles:
  # Section 1.2 definitions (lines 361-370). "both" = the lead-in names
  # sending and receiving agents together.
  sending: "Sending agent"
  receiving: "Receiving agent"

sets:
  - set: digest
    section: "§2.1"
    cms_field: DigestAlgorithmIdentifier
    lead_in: "Sending and receiving agents:"        # line 643
    role: [sending, receiving]
    entries:
      - {label: SHA-256, level: MUST, req: "rfc-8551#R-0003", lines: "645",
         text: "MUST support SHA-256."}
      - {label: SHA-512, level: MUST, req: "rfc-8551#R-0004", lines: "647",
         text: "MUST support SHA-512."}
    related:
      - {req: "rfc-8551#R-0002", level: RECOMMENDED, lines: "638-641",
         text: "It is RECOMMENDED that the algorithm used for digesting the body of the message be of similar strength to, or greater strength than, the signature algorithm."}

  - set: signature
    section: "§2.2"
    cms_field: SignatureAlgorithmIdentifier
    lead_in: "Receiving agents:"                    # line 659
    role: [receiving]
    entries:
      - {label: ECDSA-P256-SHA256, level: MUST, req: "rfc-8551#R-0005", lines: "661",
         text: "MUST support ECDSA with curve P-256 and SHA-256."}
      - {label: EdDSA-curve25519-PureEdDSA, level: MUST, req: "rfc-8551#R-0006", lines: "663",
         text: "MUST support EdDSA with curve25519 using PureEdDSA mode [RFC8419]."}
      - {label: RSA-PKCS1v15-SHA256, level: "MUST-", req: "rfc-8551#R-0007", lines: "665",
         text: "MUST- support RSA PKCS #1 v1.5 with SHA-256."}
      - {label: RSASSA-PSS-SHA256, level: SHOULD, req: "rfc-8551#R-0008", lines: "667-668",
         text: "SHOULD support the RSA Probabilistic Signature Scheme (RSASSA-PSS) with SHA-256."}

  - set: signature
    section: "§2.2"
    cms_field: SignatureAlgorithmIdentifier
    lead_in: "Sending agents:"                      # line 679
    role: [sending]
    entries:
      - {label: "one-of(ECDSA-P256-SHA256, EdDSA-curve25519-PureEdDSA)", level: MUST,
         req: "rfc-8551#R-0009", lines: "681-683",
         at_least_one_of: [ECDSA-P256-SHA256, EdDSA-curve25519-PureEdDSA],
         text: "MUST support at least one of the following algorithms: ECDSA with curve P-256 and SHA-256, or EdDSA with curve25519 using PureEdDSA mode."}
      - {label: RSA-PKCS1v15-SHA256, level: "MUST-", req: "rfc-8551#R-0010", lines: "685",
         text: "MUST- support RSA PKCS #1 v1.5 with SHA-256."}
      - {label: RSASSA-PSS-SHA256, level: SHOULD, req: "rfc-8551#R-0011", lines: "687",
         text: "SHOULD support RSASSA-PSS with SHA-256."}
    see: "§4.1 for key size (line 689)"

  - set: key_encryption
    section: "§2.3"
    cms_field: KeyEncryptionAlgorithmIdentifier
    lead_in: "Receiving and sending agents:"        # line 693
    role: [sending, receiving]
    entries:
      - {label: ECDH-ES-P256, level: MUST, req: "rfc-8551#R-0012", lines: "695-696",
         text: "MUST support Elliptic Curve Diffie-Hellman (ECDH) ephemeral-static mode for P-256, as specified in [RFC5753]."}
      - {label: ECDH-ES-X25519-HKDF256, level: MUST, req: "rfc-8551#R-0013", lines: "698-700",
         text: "MUST support ECDH ephemeral-static mode for X25519 using HKDF-256 (\"HKDF\" stands for \"HMAC-based Key Derivation Function\") for the KDF, as specified in [RFC8418]."}
      - {label: RSA-encryption, level: "MUST-", req: "rfc-8551#R-0014", lines: "702",
         text: "MUST- support RSA encryption, as specified in [RFC3370]."}
      - {label: RSAES-OAEP, level: "SHOULD+", req: "rfc-8551#R-0015", lines: "704-705",
         text: "SHOULD+ support RSA Encryption Scheme - Optimal Asymmetric Encryption Padding (RSAES-OAEP), as specified in [RFC3560]."}
    constraints:
      # Machine reading (inferred): when the key encryption is ECDH-ES, the
      # key-wrap algorithm and the content-encryption algorithm share their
      # underlying cipher and key size, and both AES-128 and AES-256 key
      # wrap are supported.
      - {req: "rfc-8551#R-0016", level: MUST, lines: "709-712",
         check: {when: "ECDH ephemeral-static", equal: [key_wrap.cipher, content_encryption.cipher], equal_size: [key_wrap.key_bits, content_encryption.key_bits]},
         text: "The underlying encryption functions for the key wrap and content-encryption algorithms [RFC3370] [RFC3565] and the key sizes for the two algorithms MUST be the same (e.g., AES-128 key wrap algorithm with AES-128 content-encryption algorithm)."}
      - {req: "rfc-8551#R-0017", level: MUST, lines: "712-715",
         check: {when: "ECDH ephemeral-static", supported: [AES-128-key-wrap, AES-256-key-wrap]},
         text: "As both 128-bit and 256-bit AES modes are mandatory to implement as content-encryption algorithms (Section 2.7), both the AES-128 and AES-256 key wrap algorithms MUST be supported when ECDH ephemeral-static is used."}
      - {req: "rfc-8551#R-0018", level: MAY, lines: "716", actor: recipient,
         text: "Recipients MAY enforce this"}
      - {req: "rfc-8551#R-0019", level: MUST, lines: "716-717", actor: recipient,
         check: {strength: "min(key_wrap, content_encryption)"},
         text: "MUST use the weaker of the two as part of any cryptographic strength computations they might do."}

  - set: content_encryption
    section: "§2.7"
    cms_field: ContentEncryptionAlgorithmIdentifier
    lead_in: "Sending and receiving agents:"        # line 1037
    role: [sending, receiving]
    operations: [encryption, decryption]            # each entry says "encryption and decryption"
    entries:
      - {label: "AES-128-GCM+AES-256-GCM", level: MUST, req: "rfc-8551#R-0064", lines: "1039-1040",
         algorithms: [AES-128-GCM, AES-256-GCM],
         text: "MUST support encryption and decryption with AES-128 GCM and AES-256 GCM [RFC5084]."}
      - {label: AES-128-CBC, level: "MUST-", req: "rfc-8551#R-0065", lines: "1042-1043",
         oid_in_source: {oid: "2.16.840.1.101.3.4.1.2", lines: "1558-1559", context: "§3.2.2 guideline 3 example: \"OID.2.16.840.1.101.3.4.1.2\" would be AES-128 CBC"},
         text: "MUST- support encryption and decryption with AES-128 CBC [RFC3565]."}
      - {label: ChaCha20-Poly1305, level: "SHOULD+", req: "rfc-8551#R-0066", lines: "1045-1046",
         text: "SHOULD+ support encryption and decryption with ChaCha20-Poly1305 [RFC7905]."}
    selection:
      # Section 2.7.1.2, applied only when both conditions of lines 1127-1131
      # hold (no knowledge of the recipient's capabilities, nor of its S/MIME
      # version). Ordering of rule 1 before rule 2: R-0076.
      - {order: 1, choose: AES-256-GCM, level: SHOULD, req: "rfc-8551#R-0079", lines: "1115-1117",
         text: "If the following two conditions are met, the sending agent SHOULD use AES-256 GCM, as AES-256 GCM is a stronger algorithm and is required by S/MIME v4.0:"}
      - {order: 2, choose: AES-128-CBC, level: SHOULD, req: "rfc-8551#R-0080", lines: "1133-1135",
         text: "If the sending agent chooses not to use AES-256 GCM in this step, given the presumption is that a client implementing AES-GCM would do both AES-256 and AES-128, it SHOULD use AES-128 CBC."}

key_sizes:
  # RSA modulus size in bits. Ranges are inclusive [min, max]; null = unbounded.
  # The three rows of each table are verbatim in inline.verbatim.txt; the
  # numeric bounds are read off the row text (e.g. "4096 <  key size" is
  # min 4097). Notes 1 and 2 of every table point to section 6 and to
  # Appendix B respectively.
  - section: "§4.1"
    applies_to: "asymmetric keys for use with an RSA signature algorithm (generation)"
    actor: "S/MIME user agent"
    rows:
      - {min: null, max: 2047, level: "MUST NOT", req: "rfc-8551#R-0129", lines: "2197-2198",
         text: "An S/MIME user agent MUST NOT generate asymmetric keys less than 2048 bits for use with an RSA signature algorithm."}
  - section: "§4.2"
    applies_to: "generating RSA and RSASSA-PSS signatures"       # lines 2209-2210
    region: I-07
    rows:
      - {min: null, max: 2047, level: "SHOULD NOT", note: 2, req: "rfc-8551#R-0130", line: 2212}
      - {min: 2048, max: 4096, level: SHOULD,       note: 1, req: "rfc-8551#R-0131", line: 2213}
      - {min: 4097, max: null, level: MAY,          note: 1, req: "rfc-8551#R-0132", line: 2214}
    fixed_by_curve: {algorithms: [ECDSA, EdDSA], line: 2219}
  - section: "§4.3"
    applies_to: "verification of RSA and RSASSA-PSS signatures (receiving agents)"   # lines 2223-2224
    region: I-08
    rows:
      - {min: null, max: 2047, level: "SHOULD NOT", note: 2, req: "rfc-8551#R-0133", line: 2226}
      - {min: 2048, max: 4096, level: MUST,         note: 1, req: "rfc-8551#R-0134", line: 2227}
      - {min: 4097, max: null, level: MAY,          note: 1, req: "rfc-8551#R-0135", line: 2228}
    fixed_by_curve: {algorithms: [ECDSA, EdDSA], line: 2233}
  - section: "§4.4"
    applies_to: "establishing keys for content encryption using the RSA and RSA-OAEP algorithms"   # lines 2249-2251
    region: I-09
    rows:
      - {min: null, max: 2047, level: "SHOULD NOT", note: 2, req: "rfc-8551#R-0136", line: 2253}
      - {min: 2048, max: 4096, level: SHOULD,       note: 1, req: "rfc-8551#R-0137", line: 2254}
      - {min: 4097, max: null, level: MAY,          note: 1, req: "rfc-8551#R-0138", line: 2255}
    fixed_by_curve: {algorithms: [ECDH], line: 2260}
  - section: "§4.5"
    applies_to: "establishing keys for content decryption using the RSA and RSAES-OAEP algorithms"   # lines 2264-2266
    region: I-10
    rows:
      - {min: null, max: 2047, level: MAY,          note: 2, req: "rfc-8551#R-0139", line: 2268}
      - {min: 2048, max: 4096, level: MUST,         note: 1, req: "rfc-8551#R-0140", line: 2269}
      - {min: 4097, max: null, level: MAY,          note: 1, req: "rfc-8551#R-0141", line: 2270}
    fixed_by_curve: {algorithms: [ECDH], line: 2275}
  - section: "§6"
    applies_to: "verification of digital signatures generated with RSA and DSA keys"
    rows:
      - {min: null, max: 1023, level: MUST, action: "warn the user", req: "rfc-8551#R-0143", lines: "2510-2512",
         text: "If an implementation supports verification of digital signatures generated with RSA and DSA keys of less than 1024 bits, it MUST warn the user."}
      - {min: 4097, max: null, level: MAY, req: "rfc-8551#R-0142", lines: "2477-2478",
         note_inferred: "R-0142 says 'key sizes beyond those recommended'; reading 'beyond' as above 4096 is inferred",
         text: "For this reason, an implementation MAY support key sizes beyond those recommended in this specification."}

source_findings:
  # Recorded, not repaired. See README.md.
  - "§4.4 lead-in names 'RSA and RSA-OAEP' (line 2250); §4.5 names 'RSA and RSAES-OAEP' (line 2265) and §2.3 names 'RSAES-OAEP' (line 705). Same algorithm, two spellings."
  - "§4.2 row 1 and §4.3 row 1 SHOULD NOT for <= 2047 coexist with §4.1 MUST NOT generate < 2048 (R-0129): §4.1 binds key generation by an S/MIME user agent, §4.2 signature generation by an S/MIME agent; a signer holding a pre-existing short key is governed by §4.2 only (inferred)."
  - "§4.5 row 1 is MAY for <= 2047 while §4.4 row 1 is SHOULD NOT: decrypting old mail with short keys is permitted, encrypting new mail with them is not recommended (inferred reading; compare Appendix B.4 lines 3431-3433)."
