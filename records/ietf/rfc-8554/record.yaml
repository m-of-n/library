      note: "LMS/HSS with a secret-key-state API; signing behind a 'hazardous experimental' flag."
    - name: wolfSSL / wolfCrypt, wolfBoot
      url: https://www.wolfssl.com/
      license: GPL-3.0 or commercial
      language: c
      note: "LMS/HSS including a verify-only build; RFC 9802 X.509 verification path reported merged."
