usefulness:
  verdict: useful
  reason: "The stateful hash-based family with the widest deployment (OpenSSL verification, single-tree LMS for CNSA 2.0 firmware signing, COSE via rfc-8778). It is explicit about what state costs in practice (section 9.2) and supplies the normative definitions that rfc-8778 cross-check found it could not verify from a stub."
