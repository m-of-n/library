  note: "Digest is of the .txt rendering (3419 lines), the rendering FX-1 needs and the one rfc-8778's cross-check said this record lacked. Informational, IRTF stream (CFRG), confirmed against the RFC Editor metadata (rfc8554.json) 2026-11-03: no obsoletes, obsoleted_by, updates or updated_by. The errata page (checked 2026-11-03) lists 3: 7409 Verified (Table 3 HSS signature sizes 48 bytes too large), 7994 Held for Document Update (n32 vs m32 naming in section 3.3), 8907 Reported (claims section 3.3 lms_key_n32 omits the LMS type). RFC 9858 (additional LMS parameter sets) cites this RFC normatively per the datatracker but is not an `updates`; it is not held and was not read."
