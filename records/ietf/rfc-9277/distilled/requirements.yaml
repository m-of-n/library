reconciliation: 'RFC 9277 CONTAINS ZERO ALL-CAPITALS BCP 14 KEYWORDS. bin/bcp14-count returns 0, the extraction carries 0, and the two counts agree at 0. docs/extraction.md requires that a measured zero state the document''s own normative baseline instead, and bin/validate enforces that this field be non-empty when source_keyword_count is 0. THE BASELINE IS: THERE IS NONE. This is not a document that omitted the boilerplate while using the keywords; it is a Standards Track RFC with no requirements language of any kind. Measured over the whole 960-line source at this pass: the strings "BCP 14", "RFC 2119", "RFC 8174" and "key words" DO NOT APPEAR, so there is no requirements-language section for the keywords to have been omitted from. The all-capitals forms MUST, MUST NOT, SHALL, SHALL NOT, SHOULD, SHOULD NOT, REQUIRED, RECOMMENDED, NOT RECOMMENDED, MAY and OPTIONAL occur zero times each. What the document uses instead, counted at this pass: "may" 24 times, "should" 5 plus one sentence-initial "Should", "must" TWICE, "required" twice, "optional" twice, "encouraged" and "suggested" and "needs to" throughout. THE TWO LOWER-CASE "must"s ARE WORTH NAMING because one of them is the record''s headline finding: Appendix A.2''s "care must be taken when concatenating Labeled CBOR Sequences to remove the label from all but the first part" (rfc-9277#R-0123), and the BSD licence text in the boilerplate. Neither carries BCP 14 force, and the document has no clause that could give it any. CONSEQUENCE, STATED HERE BECAUSE IT IS THE POINT OF READING THIS RECORD AT ALL: "we conform to RFC 9277" is not a testable claim. Under docs/requirements.md section 1''s four-part test NOTHING IN RFC 9277 QUALIFIES AS A REQUIREMENT. When two implementations disagree about whether a label may appear mid-file - the question Appendix A.2 leaves open - there is no clause to point at, and a reader that REJECTS a labelled file and a reader that rejects an UNLABELLED one are both conformant and not interoperable. The record''s tags say `evidence` rather than `normative` for this reason. WHAT WAS COUNTED INSTEAD, and extracted here with every entry kind: inferred: (a) every STRUCTURAL RULE of the three enveloping methods - which tag is outer, which is inner, what the tag content is, how many bytes; (b) every ALLOCATION and every registry FIELD VALUE in section 4, including the TN formula that is the semantics field of 65,279 entries; (c) every PERMISSIVE STATEMENT ABOUT STRIPPING, of which there are four, because together they establish that the envelope is storage-only and strippable by design - and the ONE explicit warning that runs the other way, Appendix A''s lower-case "requires that all programs that expect to examine that file be able to skip" the label; (d) every DISCLAIMER OF NORMATIVITY, of which "This advice is informative." and "encouraged, but not required" are the sharpest; (e) the four worked TN values and the two worked fingerprints, every one of which was recomputed at this pass and holds; and (f) the lower-case force words the document does use. Each entry names in its `field` the phrase or structural rule that carries the force and states that no BCP 14 keyword backs it; no obligation was invented. NO BOILERPLATE EXCLUSION WAS NEEDED here, unlike rfc-8742 and rfc-9741: there is no BCP 14 boilerplate paragraph in this document to accidentally quote.'
