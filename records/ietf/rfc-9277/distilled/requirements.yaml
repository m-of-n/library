note: |
  Ids are stable and never reused. Cite as rfc-9277#R-NNNN.
  Entries are in source order by section, then by position within the section;
  ids run from R-0001 with no gaps.
  KIND. EVERY entry is `inferred`, because the source contains NO all-capitals
  BCP 14 keyword at all - see `reconciliation`. `inferred` does NOT mean the text
  is paraphrased: every `text` in this file is a single contiguous verbatim span
  of RFC 9277. Each entry names in `field` the structural rule, allocation,
  registry field value, permission, disclaimer or lower-case force word that
  carries the force, and says that no BCP 14 keyword backs it. The precedent is
  rfc-9682, also a zero-keyword Standards Track RFC.
  VERB. Lower case throughout, reproducing the source's own force word
  ('need to obtain', 'needs to be', 'is encouraged, but not required',
  'may wish to remove', 'care must be taken', 'should not solely rely',
  'is informative', 'requires', 'allows', 'cannot rely on'); `none` means the
  sentence carries no force word at all and its normativity is definitional.
  CONTIGUITY, and the TWO classes of declared exception. Contiguity is asserted
  after collapsing runs of whitespace. The source has NO form feeds and NO page
  footers (RFC 9277 is an unpaginated v3 rendering), so there is no page
  decoration to remove. Exactly four lines carry trailing whitespace (724, 767,
  770, 772) and all four are blank aside lines. Nothing else was transformed,
  EXCEPT:
    (1) THE ASIDE BARS. Two RFC v3 asides exist, at source lines 715-727
        (Appendix A.2's PEM example) and 765-777 (Appendix B's note on the
        formula). Every line in them begins `      |  `. EIGHT entries are drawn from those ranges and SEVEN of the eight are contiguous only after that leading `|` bar is removed, and after nothing else; the eighth, rfc-9277#R-0146, begins at the start of its line and is contiguous either way. The split was COMPUTED rather than assumed - an entry depends on the strip iff its text is contiguous in the bar-stripped source and not in the raw one - and ../normative.md marks the two cases apart. The removal is confined to those two
        ranges; no other line of the document is touched. Each of the nine says
        so in its `field`.
    (2) HYPHENATION. TWELVE sentences are severed by a line break inside a
        hyphenated token and NONE is healed. Each is quoted as TWO entries, cut
        where the source cuts it, and each half says so in its `field`:
        lines 233/234 (`Content-Format`), 257/258 (`Content-Format`),
        293/294 (`application/senml+cbor`), 329/330 (`CBOR-encoded`),
        373/374 (`application/missing-blocks+cbor-seq`), 657/658
        (`self-delimiting`), 722/723 (`CBOR-encoded`, INSIDE an aside),
        726/727 (`PEM-encoded`, INSIDE an aside), 784/785 (`byte-string`),
        795/796 (`content-format`), 807/808 (`application/senml+cbor`),
        816/817 (`application/missing-blocks+cbor-seq`) and 821/822
        (`application/missing-blocks+cbor-seq` again). Two of the twelve are the
        SAME SENTENCE appearing twice in the document, in section 2.3 and again
        in Appendix D, broken at the same token both times; and the two
        Appendix B.1 snippet sentences have BYTE-IDENTICAL first halves, so
        rfc-9277#R-0152 and rfc-9277#R-0155 carry the same `text` and are told
        apart only by their second halves.
  No span in this file is spliced from two non-adjacent parts of the document.
  The cached rendering begins with a UTF-8 BOM (U+FEFF) alone on line 1, and
  source line 771 contains two U+2264 characters inside an aside; both are part
  of the hashed bytes and are preserved where quoted.
  ACTOR. RFC 9277 defines no protocol roles - a "CBOR Protocol" is "a
  specification that uses CBOR as its encoding" (rfc-9277#R-0009), not a party -
  so `actor` names who a statement falls on in practice: `CBOR Protocol
  designer` (the document's own term for the party who chooses a method and
  obtains a tag), `implementer` (a reader or writer of the bytes),
  `IANA / registrant`, `specification author` for the CDDL snippets,
  `fixture author` for the diagnostic-notation examples, and
  `reader of this specification` for a statement about the document itself.

requirements:
  - id: "rfc-9277#R-0001"
    object: 'the deliverable of this document'
    field: 'no BCP 14 keyword backs this - THE DOCUMENT HAS NONE AT ALL - and the force is the statement of what it defines. Note the consumer it names: file(1). The document contains no magic(5) pattern for anyone to install'
    verb: 'defines'
    actor: 'CBOR Protocol designer'
    locator: "Abstract"
    text: 'This document defines a stored ("file") format for Concise Binary Object Representation (CBOR) data items that is friendly to common systems that recognize file types, such as the Unix file(1) command.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'decidable against the two byte layouts; "friendly to" is not a criterion'
    status: active
  - id: "rfc-9277#R-0002"
    object: 'a magic number'
    field: 'no BCP 14 keyword backs this; the force is a statement of the general mechanism this document instantiates'
    verb: 'none'
    actor: 'reader of this specification'
    locator: "§1"
    text: 'A common way to identify the type of a file from its contents is to place a "magic number" at the start of the file contents [MAGIC].'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement about practice'
    status: active
  - id: "rfc-9277#R-0003"
    object: 'the RFC 6838 media type registration template'
    field: 'no BCP 14 keyword backs this; the force is a fact about another registry, AND IT IS THE HINGE BETWEEN THIS RECORD AND rfc-8742: RFC 8742 section 6.1 answers both fields "N/A" for application/cbor-seq, and this document makes one of them constructible for exactly that media type'
    verb: 'is asked for'
    actor: 'IANA / registrant'
    locator: "§1"
    text: 'In the media type registration template [RFC6838], a magic number is asked for, if available, as is a file extension.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'decidable against RFC 6838, which is an informative reference of this document'
    status: active
  - id: "rfc-9277#R-0004"
    object: 'the limit of encoding-level identification'
    field: 'no BCP 14 keyword backs this; the force is the problem statement - recognising the ENCODING is not recognising the CONTENT'
    verb: 'can be confused'
    actor: 'reader of this specification'
    locator: "§1"
    text: 'A challenge for the file(1) command is often that it can be confused by recognizing the overall encoding but not the content being encoded.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement about a tool''s behaviour'
    status: active
  - id: "rfc-9277#R-0005"
    object: 'the APK-is-a-ZIP argument'
    field: 'no BCP 14 keyword backs this; the force is the document’s central analogy, and the reason a magic number must name the PROTOCOL rather than the encoding'
    verb: 'may be identified as'
    actor: 'reader of this specification'
    locator: "§1"
    text: 'For instance, an Android Package Kit APK (as used to transfer and store an application) may be identified as a ZIP file.'
    kind: inferred
    testable: 'no'
    testable_reason: 'an illustration'
    status: active
  - id: "rfc-9277#R-0006"
    object: 'identifying an artifact as CBOR'
    field: 'no BCP 14 keyword backs this; the force is the conclusion of the analogy - "probably not sufficient", hedged, and it is the whole motivation for the document'
    verb: 'is probably not sufficient'
    actor: 'CBOR Protocol designer'
    locator: "§1"
    text: 'As CBOR becomes a more and more common encoding for a wide variety of artifacts, identifying them as just "CBOR" is probably not sufficient.'
    kind: inferred
    testable: 'no'
    testable_reason: '"probably not sufficient" has no decision procedure'
    status: active
  - id: "rfc-9277#R-0007"
    object: 'the scope of this document'
    field: 'no BCP 14 keyword backs this; the force is the statement of deliverable - a magic number ENCODED INTO THE BEGINNING of the file, i.e. in band'
    verb: 'provides a way'
    actor: 'CBOR Protocol designer'
    locator: "§1"
    text: 'This document provides a way to encode a magic number into the beginning of a CBOR format file.'
