# =====================================================================
# rfc-9277 state machine -- DERIVED. RFC 9277 DEFINES NO STATE MACHINE.
#
# READ THIS BEFORE THE MACHINE. The words "state", "transition",
# "lifecycle", "phase", "step", "event", "verify", "revoke", "expire"
# and "rotate" occur ZERO times in RFC 9277; measured over the whole
# 960-line source at this pass. No element of this file may be quoted as
# the source's own model.
#
# WHY IT IS HERE RATHER THAN DECLARED not_applicable, which was the
# expected verdict and is the alternative pass 2 should weigh. The test
# applied: does the document distinguish two or more conditions of a
# thing over time, and name at least one transition between them? It
# does, FIVE TIMES OVER, and all five are the same transition -- STRIP:
#
#   section 1   "there is no requirement that either type of envelope be
#               transferred on the wire"                 (R-0018)
#   section 2.2 "may wish to remove the two tags if the type is
#               understood from the protocol context"    (R-0052)
#   section 2.3 "allows the application to trivially remove the first
#               item with the two tags"                  (R-0075)
#   Appendix A  "can be trivially removed by an application before
#               sending the CBOR content out on the wire" (R-0116)
#   Appendix A  "Removing the CBOR Tag Wrapped format requires knowledge
#               of the two tags involved."               (R-0129)
#
# AND THE RECORD'S HEADLINE FINDING IS A SECOND TRANSITION -- CONCATENATE
# -- whose target state the document creates and then declines to
# define. Appendix A.2: "If each object is preceded by a Labeled CBOR
# Sequence label, then there may be multiple such labels in the file."
# A state machine is the only artifact that holds that honestly: the
# transition exists, the state exists, and THERE IS NO RULE FOR IT.
#
# SO THE PAYLOAD OF THIS FILE IS ITS ASYMMETRIES, not its states:
# `undefined_transitions` and `the_asymmetry`. An N/A verdict would have
# been defensible and would have lost both.
#
# The contrast is deliberate. ../protocol.yaml IS absent and the record
# declares protocol not_applicable with its own measurement: a "CBOR
# Protocol" is "a specification that uses CBOR as its encoding"
# (rfc-9277#R-0009), not a party, and the document defines no exchange.
#
# Every `quote` is RFC 9277's own words, contiguous and mechanically
# checked. Everything marked OURS is this library's reading.
#
# Source: RFC 9277, cached source sha256
#   bd637eafad9ef940c8f5d029076f70c58af7bde6beb38efee5ba7af3690289f7
# =====================================================================
record: rfc-9277
reviewed_by: ""
derived: true
derived_from: "§1, §2.2, §2.3, §3, Appendix A and Appendix A.1-A.3. §4 contributes nothing: it is four completed allocations."

machines:
  - name: 'stored-artifact-labelling'
    locator: "§2.2, §2.3, Appendix A, Appendix A.2"
    derived: true
    subject: 'ONE stored representation, over its life from authoring through storage to the wire and back'
    initial: 'unlabelled'
    states:
      - name: 'unlabelled'
        meaning: 'the bytes are the protocol''s own data, with no envelope. This is the wire form and, before this document, the only form'
        quote: 'While the envelopes defined in this specification add information to how data conforming to CBOR Protocols are stored in files, there is no requirement that either type of envelope be transferred on the wire.'
        requirement: 'rfc-9277#R-0018'
        note_ours: >-
          OURS: the INITIAL state, because the document is retrofitting a label
          onto formats that already exist. Appendix A.1 is explicit that the
          other order is also possible, in two sentences quoted separately
          rather than elided into one: "If the on-wire format is new, then it
          could be specified with the CBOR Tag Wrapped format if the extra 8
          bytes are not a problem." and "The stored format is then identical to
          the on-wire format." That is the one configuration in which this
          machine has a single state -- and Appendix A.1 immediately concedes
          that it is the unlikely one: "If the 8 bytes are a problem on the wire
          (and they often are if CBOR is being considered), then the Labeled
          CBOR Sequence format should be adopted for the stored format."
      - name: 'labelled-once'
        meaning: 'exactly one envelope at offset 0, and the protocol''s data after it'
        quote: 'Both use CBOR tags in a way that results in a deterministic first 8 to 12 bytes.'
        requirement: 'rfc-9277#R-0031'
        accepting: true
        note_ours: >-
          OURS: the state the whole document exists to produce, and the claim
          quoted above is FALSE IN GENERAL for it. Nothing in RFC 9277 requires
          preferred serialisation, so this state has at least 30 well-formed
          byte spellings for one label, of which 1 is 12 bytes long and 5 match
          the 8-byte fingerprint §2.3.1 states. See
          schema/prefix-spellings.derived.txt.
      - name: 'labelled-many'
        meaning: 'more than one label in the file, one before each concatenated object'
        quote: 'If each object is preceded by a Labeled CBOR Sequence label, then there may be multiple such labels in the file.'
        requirement: 'rfc-9277#R-0140'
        accepting: 'UNDECIDED BY THE DOCUMENT'
        note_ours: >-
          OURS, AND THIS IS THE FINDING. The document creates this state in one
          sentence and then gives TWO INCOMPATIBLE READINGS of it in the next
          two, and chooses neither. A FEATURE: "A protocol based on CBOR
          Sequences may specify that Labeled CBOR Sequence labels can occur
          within a CBOR Sequence, possibly even to switch to data items
          following in the sequence that are of a different type."
          (rfc-9277#R-0141) A HAZARD: "If the CBOR-Sequence-based protocol does
          not define the semantics for or at least tolerate embedded labels,
          care must be taken when concatenating Labeled CBOR Sequences to remove
          the label from all but the first part." (rfc-9277#R-0142) So whether
          this state is accepting is a per-protocol question with NO DEFAULT,
          and "care must be taken" is lower case in a document with no BCP 14
          clause.
      - name: 'labelled-and-rejected'
        meaning: 'a reader that was not updated meets the label and fails or warns'
        quote: 'The programs involved may throw errors or warnings on the Labeled CBOR Sequence if they have not yet been updated, but this may not be a problem.'
        requirement: 'rfc-9277#R-0138'
        accepting: false
        note_ours: >-
          OURS: the document admits this state, discounts it in the same
          sentence ("but this may not be a problem"), and warns about its cause
          in Appendix A -- "having the Labeled CBOR Sequence in the file requires
          that all programs that expect to examine that file be able to skip
          what appears to be a CBOR item with two tags nested around a 3-byte
          byte string.  The 3-byte entry is not of the format the program would
          normally have processed, so it may be a surprise."
          (rfc-9277#R-0118) With ZERO BCP 14 keywords in the document, a reader
          that rejects a labelled file is CONFORMANT -- and so is a reader that
          rejects an unlabelled one. The two are not interoperable and no clause
          decides between them.
      - name: 'labelled-with-unknown-inner-tag'
        meaning: 'the outer tag is recognised, the inner tag names a protocol the reader does not know'
        quote: 'The inner tag in the label identifies which CBOR Protocol is used, as described above.'
        requirement: 'rfc-9277#R-0071'
        accepting: 'UNDEFINED BY THE DOCUMENT'
        note_ours: >-
          OURS. 55800 announces only "indicates that the file contains CBOR
          Sequences" (the registry''s own words, verified in-library); the inner
          tag names the protocol. NOTHING IN RFC 9277 SAYS WHAT A READER DOES
          WITH A KNOWN OUTER TAG AND AN UNKNOWN INNER ONE. The file parses
          cleanly either way, so a reader can successfully read a file it cannot
          interpret, and the magic number''s whole purpose -- selecting the right
          application -- FAILS OPEN AND SILENTLY. RFC 8949 §5.4 gives a
          validity-checking decoder meeting an unrecognised tag two choices and
          discourages the rejecting one; that is RFC 8949''s rule and not this
          document''s. §3 approaches this from the security side and states no
          rule.

    transitions:
      - from: 'unlabelled'
        to: 'labelled-once'
        trigger: 'the artifact is committed to storage'
        guard: 'the CBOR Protocol specification says which method to use'
        quote: 'The Protocol designer determines which one to use; see Appendix A for some guidance.'
        requirement: 'rfc-9277#R-0032'
        note_ours: >-
          OURS AND THIS TRANSITION IS NEVER DESCRIBED AS AN OPERATION. The
          document describes STRIPPING four separate times and APPLYING never --
          there is no sentence about adding a label to an existing unlabelled
          file, no sentence about what a writer does, and no sentence about
          whether a reader should expect one. See `the_asymmetry` below.
      - from: 'labelled-once'
        to: 'unlabelled'
        trigger: 'the artifact is about to be sent on the wire'
        guard: 'the type is understood from the protocol context'
        quote: 'Both the Labeled CBOR Sequence and the wrapped tag can be trivially removed by an application before sending the CBOR content out on the wire.'
        requirement: 'rfc-9277#R-0116'
        cost: >-
          Asymmetric between the two methods, and the document says so. The
          label comes off as a unit: "The use of a CBOR Sequence allows the
          application to trivially remove the first item with the two tags."
          (rfc-9277#R-0075) The wrapped form does not: "Removing the CBOR Tag
          Wrapped format requires knowledge of the two tags involved.  Other
          tags present might be needed." (rfc-9277#R-0129, rfc-9277#R-0130)
      - from: 'labelled-once'
        to: 'labelled-many'
        trigger: 'two labelled files are concatenated'
        guard: 'none -- the operation is in spec under RFC 8742'
        quote: 'There are situations where multiple objects may be concatenated into a single file.'
        requirement: 'rfc-9277#R-0139'
        note_ours: >-
          OURS, AND THE TWO DOCUMENTS OF THIS LANE MEET HERE. RFC 8742 §2:
          "(Consequently, concatenating zero or more CBOR Sequences also results
          in a CBOR Sequence.)" -- a SELF-LOOP in
          records/ietf/rfc-8742/distilled/state-machine.yaml, changing no state,
          and the whole reason to pick a sequence over an array. Here the same
          operation leaves the machine in a state the document declines to
          define. Both documents are right on their own ground: RFC 8742's claim
          is about WELL-FORMEDNESS and this one's about INTERPRETATION. Neither
          record asserts `contradicts`. A MAGIC NUMBER DESIGNED FOR AN APPENDABLE
          FORMAT IS UNSAFE UNDER APPEND.
      - from: 'labelled-many'
        to: 'labelled-once'
        trigger: 'the producer strips all but the first label'
        guard: 'the protocol does not define or tolerate embedded labels'
        quote: 'If the CBOR-Sequence-based protocol does not define the semantics for or at least tolerate embedded labels, care must be taken when concatenating Labeled CBOR Sequences to remove the label from all but the first part.'
        requirement: 'rfc-9277#R-0142'
        note_ours: >-
          OURS: LOWER-CASE "must", in a document with no BCP 14 clause, so it
          carries no force. And note what the guard means: the rule applies only
          when the protocol has NOT made a decision, so the document''s one
          mitigation is conditional on the absence of a specification it also
          does not require anyone to write.
      - from: 'labelled-once'
        to: 'labelled-and-rejected'
        trigger: 'an un-updated reader opens the file'
        guard: 'the reader cannot skip a CBOR item with two tags around a 3-byte byte string'
        quote: 'The 3-byte entry is not of the format the program would normally have processed, so it may be a surprise.'
        requirement: 'rfc-9277#R-0119'
      - from: 'labelled-and-rejected'
        to: 'labelled-once'
        trigger: 'the reader is updated, or happens to be tolerant already'
        guard: 'none'
        quote: 'On the other hand, CBOR parsers are generally tolerant of tags that appear: many of them will process extra tags, making unknown tags available as meta information.'
        requirement: 'rfc-9277#R-0120'
        note_ours: 'OURS: "generally tolerant" and "many of them" are unquantified and uncited. This transition is an empirical hope, not a rule.'
      - from: 'labelled-once'
        to: 'labelled-with-unknown-inner-tag'
        trigger: 'a reader that knows the outer tag but not the inner one opens the file'
        guard: 'none'
        quote: 'The outer tag in the label identifies the file as being a CBOR Sequence and does so with all the desirable properties explained in Section 3.4.6 of [STD94].'
        requirement: 'rfc-9277#R-0069'
      - from: 'labelled-once'
        to: 'labelled-once'
        trigger: 'the inner tag is swapped for a different protocol''s tag'
        guard: 'none, and NO SIGNATURE DETECTS IT'
        quote: 'Protective applications (that check data) cannot rely on the applications they try to protect (that use the data) to make exactly the same decisions in recognizing file formats.'
        requirement: 'rfc-9277#R-0086'
        note_ours: >-
          OURS, and this is the condition-(4) finding as a transition. RELABELLING
          IS A SELF-LOOP THAT NO INTEGRITY CHECK SEES. Under the Tag Wrapped
          method the two tag heads ENCLOSE the payload; under the Labeled CBOR
          Sequence method the label is a SEPARATE DATA ITEM in front of it.
          Either way the indicator is outside every signature over the content,
          so swapping the inner tag breaks nothing and can route the same bytes
          to a different parser. §3 names the class -- "(This is an instance of a
          check versus use issue.)" (rfc-9277#R-0087) -- and states no rule.
          `topics/canonical-encoding.yaml` condition (4) reads "The encoding
          profile is named by an authenticated type indicator carried inside the
          signed bytes." NEITHER METHOD DELIVERS IT.

    error_states: ['labelled-and-rejected']

    # ------------------------------------------------------------------
    # THE PART OF THIS FILE THAT IS WORTH HAVING
    # ------------------------------------------------------------------
    the_asymmetry:
      finding_ours: >-
        OURS, and it is measured rather than argued. The document contains FOUR
        permissive statements about REMOVING the envelope (rfc-9277#R-0018,
        #R-0052, #R-0075, #R-0116) and ZERO statements about adding one to an
        existing file. It contains ONE explicit warning, and it is about the
        cost of the envelope BEING THERE: "having the Labeled CBOR Sequence in
        the file requires that all programs that expect to examine that file be
        able to skip what appears to be a CBOR item with two tags nested around
        a 3-byte byte string." (rfc-9277#R-0118) So TOLERATING ABSENCE IS
        ASSUMED EVERYWHERE AND REQUIRED NOWHERE, while tolerating PRESENCE is
        the only thing the document actually asks of anyone.
      consequence_ours: >-
        OURS. With zero BCP 14 keywords there is no conformance statement in
        either direction, so a reader that REJECTS a labelled file and a reader
        that REJECTS an unlabelled one are BOTH conformant and the two are not
        interoperable. "We conform to RFC 9277" distinguishes neither.
      what_it_means_for_us: >-
        OURS. The envelope is storage-only and strippable BY DESIGN, which
        weakens the cut against MD-3 in one direction: a tag-free WIRE format is
        exactly what RFC 9277 expects, so MD-3's export posture conflicts with
        nothing here. It does not weaken the cut for STORAGE, which is §1's
        stated motivation: "When files become disconnected from their type
        information, such as when attempting to do forensics on a damaged
        system, being able to identify the type of information stored in a file
        can become very important." (rfc-9277#R-0017's neighbour, rfc-9277 §1)

    undefined_transitions:
      - name: 'apply a label to an existing unlabelled file'
        defined: false
        note: 'OURS: never described as an operation anywhere in the document. Only the designer-time choice of method is (rfc-9277#R-0032).'
      - name: 'a reader meets a known outer tag and an unknown inner tag'
        defined: false
        note: 'OURS: no rule. The file parses, so the reader succeeds at reading and fails at interpreting, silently. RFC 8949 §5.4 governs unrecognised tags in general and discourages rejection; nothing here narrows it.'
      - name: 'a reader meets an unlabelled file where it expected a label'
        defined: false
        note: 'OURS: no rule, and this is the half the asymmetry leaves out entirely.'
      - name: 'a reader meets a label mid-file'
        defined: 'PER-PROTOCOL, WITH NO DEFAULT'
        note: 'Appendix A.2 gives the two readings and chooses neither (rfc-9277#R-0141 against rfc-9277#R-0142). This is the record''s headline finding.'
      - name: 'a reader meets a label whose bytes are a non-preferred spelling'
        defined: false
        note: 'OURS: no rule, and the document does not acknowledge that other spellings exist. schema/prefix-spellings.derived.txt enumerates 30.'
      - name: 'a protective application and a consuming application disagree'
        defined: false
        note: '§3 names the class and states no rule (rfc-9277#R-0086, rfc-9277#R-0087).'

    guards_the_source_does_not_supply:
      - guard: 'how many labels are too many'
        note: 'absent. `labelled-many` has no bound.'
      - guard: 'whether the inner tag must be registered before use'
        note: 'absent as an obligation. §2.1 says designers "need to obtain" a tag (lower case) and that the policy is First Come First Served; nothing forbids using an unregistered number.'
      - guard: 'a preferred-serialisation requirement on the envelope'
        note: 'absent, and it is the defect. §2.1 pins the tag VALUE into 0x01000000..0xFFFFFFFF and says nothing about its ENCODING.'

counts:
  machines: 1
  states: 5
  transitions: 8
  error_states: 1
  self_loops: 1
  undefined_transitions: 6
  states_named_by_the_source: 0
  occurrences_of_the_word_state_in_the_source: 0
  permissive_statements_about_stripping: 4
  statements_about_applying_a_label: 0
  explicit_warnings: 1
