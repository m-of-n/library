function:
  name: 'TN'
  locator: "Appendix B (definition), section 4.3 (as registered), section 1.1 (forward reference)"
  formula_verbatim: 'TN(ct) = 0x63740101 + (ct / 255) * 256 + ct % 255.'
  arithmetic_quote: '(where +, *, / and % stand for integer addition, multiplication, division, and remainder as in the programming language C [C].)'
  arithmetic_defined_where: 'Appendix B ONLY. The section 4.3 registry entry -- the text IANA publishes -- does not cite [C], and [C] is ISO/IEC 9899:2018, a PAYWALLED normative reference of this document. OURS: an implementer reading only the registry has no definition of `/` or `%` for negative or non-integer input, and no statement that the operands are integers at all.'
  domain: 'ct in 0..65024, i.e. ct < 65025 = 255*255'
  requirement: 'rfc-9277#R-0135'

