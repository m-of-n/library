  range_as_printed: '65025 <= ct <= 65535'
  range_as_printed_note: 'the source writes this with two U+2264 characters on line 771; schema/tn-formula.txt preserves them'
  count: 511
  justification_quote: '(This range is in the range reserved for Experimental Use [RFC8126] by Section 12.3 of [RFC7252].  The overlap of 25 code points between this experimental range with the range this appendix defines tag numbers for can be used for experiments that want to employ a tag number.)'
  inference_ours: >-
    OURS AND UNVERIFIED. If the overlap between the experimental Content-Format
    range and TN's domain (0..65024) is 25 code points, then the experimental
    range begins at 65000, since 65000..65024 is 25 values. RFC 7252 IS NOT HELD
