# =====================================================================
# content-format-tag.derived.yaml
#
# DERIVED -- not verbatim. RFC 9277 states the TN function in prose and
# in a single line of C-like arithmetic (schema/tn-formula.txt,
# verbatim) and works FOUR values of it. Everything below that is not a
# direct quotation is THIS EXTRACTION'S arithmetic, computed at pass 1,
# and must not be quoted as the source's own.
#
# WHY IT IS THE CENTRAL DERIVED ARTIFACT OF THIS RECORD. Section 4.3
# allocates 65,279 CBOR tag code points whose semantics is a formula
# over the CoAP Content-Formats registry. That makes the two registries
# one governance domain, which is the strongest evidence in this library
# for R-M-12's registry-dependence claim -- and it is the fact that
# closes the "identify by media type, not by tag" escape route. This
# file is that claim as data a tool can check.
#
# Source: RFC 9277, cached source sha256
#   bd637eafad9ef940c8f5d029076f70c58af7bde6beb38efee5ba7af3690289f7
# =====================================================================
