  ct: 63
  media_type: 'application/cbor-seq'
  tn: 1668546880
  tn_hex: '0x63740140'
  source_of_ct: 'RFC 8742 section 6.2, Table 1 -- held verbatim at records/ietf/rfc-8742/distilled/schema/registrations.txt region T01'
  printed_in_rfc_9277: false
  label_bytes: 'd9d9f8 da63740140 43 424f52'
  fingerprint: 'd9d9f8da63740140'
  note_ours: >-
    OURS, and it is the corollary that makes the two records in this lane one
    finding. application/cbor-seq ALREADY HOLDS a CoAP Content-Format number,
    so a labelled CBOR-sequence file needs NO NEW IANA ALLOCATION AT ALL: the
    tag number is a function of a number RFC 8742 already obtained in 2020. It
    costs nothing. And it says only "a CBOR sequence follows", which is exactly
    section 1's APK-is-a-ZIP complaint one level up -- saying "an m-of-n
    statement log follows" is the part that needs the First Come First Served
    allocation, and that is the part a no-tags rule forbids.
    Note also that RFC 8742 section 6.1 still registers "Magic number(s): N/A"
    for this media type, and RFC 9277 carries no `Updates: 8742`.

