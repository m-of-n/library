    and not a citation. A later pass could close it by ingesting RFC 7252.

registry_dependence:
  claim: >-
    OURS. 65025 of the CBOR Tags registry's code points are a MECHANICAL FUNCTION
    of the CoAP Content-Formats registry's numbers. Not a cross-reference, not a
    convention: a formula, published as the semantics field of the allocation.
  consequence_for_r_m_12: >-
    OURS. "Use a media type, not a tag" leads BACK to a tag number whenever the
    media type has a content-format number, and application/cbor-seq has one.
    So the CBOR tag space and the media-type space are not independent
    governance domains, and an argument that avoids one registry by naming the
    other has not reduced the number of registries it depends on.
  checkable_against: 'records/iso/iana-cbor-tags/distilled/tables.yaml, row "1668546817-1668612095", verified present at this pass with reference "RFC 9277"'
  registry_text_differs_from_the_rfc: >-
    The in-library registry row reads "byte string or any CBOR data item (see
    Appendix B of RFC 9277)" where section 4.3's text reads "(see Appendix B)".
    IANA qualified the dangling cross-reference; the RFC did not.

tag_content_is_not_determined_by_the_tag_number:
  finding_ours: >-
    OURS, and it is a structural defect rather than an editorial one. Section
    4.3's Data Item field is a DISJUNCTION -- "byte string or any CBOR data
    item" -- because Appendix B adds an exception: "Exceptionally, when used
    immediately as tag content of one of the tags 55799, 55800, or 55801, the
    tag content is as follows". So the SAME tag number TN(ct) has one content
    type in general (a byte string) and a different one when it sits
    immediately inside 55799 (the bare data item, or the sequence's items
    wrapped in a CBOR array). Which reading applies is decided by whether the
    content-format's representation is a single item or a sequence, and by
    whether the content coding is identity -- facts the tag number does not
    carry and the CoAP Content-Formats registry does not state as a field. A
    generic decoder therefore cannot parse the tag content without an external
    lookup.
  gap_ours: >-
    OURS. Both of Appendix B's options for tag 55799 are limited to IDENTITY
    content-coding ("This only works for Content-Formats that are represented
    by a single CBOR data item in identity content-coding", "This works for
    Content-Formats that are represented by a CBOR sequence in identity
    content-coding"). So TN(ct) immediately inside 55799, where ct names a
    non-identity coding or a non-CBOR format, has NO DEFINED TAG CONTENT. The
    document's own D.1 example TN(11050) is application/json in DEFLATE coding,
    and it is routed through 55801 (Appendix D) rather than 55799 -- which is
    consistent, and the document never says that 55799 is unavailable for it.
  and_b1_contradicts_it: >-
    Appendix B.1's `senml-cbor = #6.1668546929(bstr)` asserts a byte-string tag
    content for TN(112), justified by "Note that a byte string is used as the
    type of the tag content because a media type representation in general can
    be any byte string." But B.1 is introduced by a cross-reference to section
    2.2.1, whose envelope is 55799(1668546929([{...}])) -- tag content an ARRAY,
    per the "Exceptionally" rule. THE DOCUMENT'S OWN CDDL DOES NOT MATCH THE
    DOCUMENT'S OWN EXAMPLE. Reported, not repaired.

