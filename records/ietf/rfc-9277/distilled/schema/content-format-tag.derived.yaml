structure_of_the_image: >-
  OURS. Write ct = 255*q + r with 0 <= r < 255; then q is in 0..254 and
  TN(ct) = 0x6374 (0x01+q) (0x01+r) as four big-endian bytes. So the image is
  EXACTLY the 65,025 values 0x6374XXYY with XX in 0x01..0xFF and YY in
  0x01..0xFF -- every tag number in the block whose low two bytes are both
  non-zero, and no other. Two consequences the document does not state:
  (1) the aside's claim is stronger than it says. It says the formula "avoids
  the use of zero bytes in the representation of the tag number"; in fact NO
  value in the image contains a zero byte in ANY of its four bytes, because the
  high half-word is 0x6374. Verified: 0 of 65025 image values contain a zero byte.
  (2) the 254 allocated code points the formula cannot reach are exactly those
  with a zero LOW byte (0x63740200, 0x63740300, ... 0x6374ff00). They are
  allocated and unassignable, and the document does not mention them.
  (0x63740100 would be the 255th such point and it lies one below the block.)

mnemonic_ours: >-
  OURS, and the document does not say it: 0x6374 is the ASCII pair "ct", for
  content type. So the whole block satisfies section 2.1's own suggestion that
  "The use of a sequence of four ASCII [RFC20] codes which are mnemonic to the
  protocol is encouraged" -- in its high half, for every one of the 65,025
  values at once. That is also why section 2.1 adds "(there may be reasons to
  encode other information into the tag; see Appendix B for an example)".

