  # tool in bin/. schema/content-format-tag.derived.yaml carries the full
  # analysis.
  - ct: 112
    locator: "§2.2.1, Appendix B.1"
    document_says: 1668546929
    recomputed: 1668546929
    hex: '0x63740171'
    agrees: true
  - ct: 272
    locator: "§2.3.1, Appendix B.1"
    document_says: 1668547090
    recomputed: 1668547090
    hex: '0x63740212'
    agrees: true
  - ct: 432
    locator: "Appendix D.1"
    document_says: 1668547250
    recomputed: 1668547250
    hex: '0x637402b2'
    agrees: true
  - ct: 11050
    locator: "Appendix D.1"
    document_says: 1668557910
    recomputed: 1668557910
    hex: '0x63742c56'
    agrees: true
  - ct: 63
