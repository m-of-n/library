# =====================================================================
# rfc-9277 test vectors.
#
# UNUSUALLY FOR THIS LANE, THE SOURCE HAS REAL ONES. RFC 9277 prints
# complete annotated hex for both of its CBOR envelopes and for the
# Openswan label, and four worked TN values. Its sibling rfc-8742 prints
# ZERO hex octets. So the V- entries here are the document's own bytes,
# lifted by line range and EXECUTED, and the D- entries are ours.
#
#   V-NNNN  the source's own worked examples, lifted from the cache by
#           line range, by script, never retyped. THREE of them, plus
#           four CDDL snippets and four TN values.
#   D-NNNN  DERIVED -- OURS. Fixtures this extraction computed for the
#           cases the document does not print: non-preferred spellings
#           of its own prefixes, the concatenation case Appendix A.2
#           leaves open, and the TN(63) label for application/cbor-seq.
#
# EVERY hex string below was run through a CBOR decoder written for this
# pass and each entry carries the result the decoder actually returned,
# not a predicted one. The three V- vectors all reproduce the
# document's own diagnostic notation exactly.
#
# Source: RFC 9277, cached source sha256
#   bd637eafad9ef940c8f5d029076f70c58af7bde6beb38efee5ba7af3690289f7
# =====================================================================
record: rfc-9277
reviewed_by: ""

vectors:

  # --------------------------------------------- the source's own three
  - id: 'rfc-9277#V-0001'
    origin: 'source'
    locator: '§2.2.1'
    method: 'CBOR Tag Wrapped'
    source_lines: "277-295"
    hex_source_lines: "281-291"
    hex_region_sha256: 'd4cfa81e9f9c5a81ed2fa034cf598a62b8b646fcebc0688867d1c99844f9d016'
    diagnostic: '55799(1668546929([{0: "current", 6: 3, 2: 1.5}]))'
    annotated_hex: |
         d9 d9f7                       # tag(55799)
            da 63740171                # tag(1668546929)
               81                      # array(1)
                  a3                   # map(3)
                     00                # unsigned(0)
                     67                # text(7)
                        63757272656e74 # "current"
                     06                # unsigned(6)
                     03                # unsigned(3)
                     02                # unsigned(2)
                     f9 3e00           # primitive(15872)
    hex: 'd9d9f7da6374017181a3006763757272656e74060302f93e00'
    length_bytes: 25
    fingerprint: 'd9d9f7da63740171'
    expect: 'valid'
    observed: >-
      decodes to 1 item: tag 55799 ( tag 1668546929 ( [ {0: "current", 6: 3,
      2: 1.5} ] ) ). The float f9 3e00 decodes to 1.5 exactly, and the text
      63757272656e74 to "current". The decode reproduces the document's own
      diagnostic notation line for line.
    verified_at_this_pass:
      - 'the first 8 bytes ARE d9d9f7da63740171, which is what §2.2.1 states'
      - 'TN(112) = 1668546929 = 0x63740171, recomputed from the Appendix B formula'
      - 'the whole item is well formed and nothing is left over'
    notes: >-
      THREE THINGS THE DOCUMENT DOES NOT SAY ABOUT ITS OWN EXAMPLE, all OURS.
      (1) THE MAP KEYS ARE NOT IN DETERMINISTIC ORDER. They are printed 0, 6, 2
      and RFC 8949 §4.2.1's bytewise rule would give 0, 2, 6 (00 < 02 < 06). The
      document claims determinism only of "the first 8 to 12 bytes", so this is
      not a contradiction -- but the only CBOR Tag Wrapped example in the
      document has a non-deterministically encoded payload, which is the same
      gap one layer in. (2) THE TAG CONTENT IS AN ARRAY, NOT A BYTE STRING,
      following Appendix B's "Exceptionally" rule -- and Appendix B.1's own
      `senml-cbor = #6.1668546929(bstr)` therefore DOES NOT MATCH THIS VECTOR,
      although B.1 is introduced by a cross-reference to this very section.
      (3) THE 8-BYTE PREFIX HAS SIX WELL-FORMED SPELLINGS and this is one;
      see rfc-9277#D-0001 and schema/prefix-spellings.derived.txt.
      The source's own parenthesis in the lead-in sentence is unbalanced and is
      carried verbatim at rfc-9277#R-0056.

  - id: 'rfc-9277#V-0002'
    origin: 'source'
    locator: '§2.3.1'
    method: 'Labeled CBOR Sequence'
    source_lines: "357-376"
    hex_source_lines: "364-371"
    hex_region_sha256: '8828e7f12dee99b4c4b8e32634cce0ccaec8ac3632cc3804eaded7255ef297f8'
    diagnostic: |
      55800(1668547090('BOR')),
      0,
      8,
      15
    annotated_hex: |
         # CBOR sequence with 4 elements
         d9 d9f8         # tag(55800)
            da 63740212  # tag(1668547090)
               43        # bytes(3)
                  424f52 # "BOR"
         00 # unsigned(0)
         08 # unsigned(8)
         0f # unsigned(15)
    hex: 'd9d9f8da6374021243424f5200080f'
    length_bytes: 15
    label_bytes: 'd9d9f8da6374021243424f52'
    label_length_bytes: 12
    fingerprint: 'd9d9f8da63740212'
    expect: 'valid'
    observed: >-
      decodes to 4 items: tag 55800 ( tag 1668547090 ( h'424F52' ) ), then 0,
      then 8, then 15. A CBOR Sequence of four elements, exactly as the
      document's "# CBOR sequence with 4 elements" comment says.
    verified_at_this_pass:
      - 'the label is exactly 12 bytes: 3 + 5 + 1 + 3'
      - 'the first 8 bytes ARE d9d9f8da63740212, which is what §2.3.1 states'
      - 'the ASCII "CBOR" occupies offsets 8 to 11, OUTSIDE the fingerprint'
      - 'TN(272) = 1668547090 = 0x63740212, recomputed'
      - '0x43 is a byte-string head of length 3, and it is also ASCII "C" -- which is why the four bytes 43 42 4f 52 read as "CBOR"'
    notes: >-
      THE DIAGNOSTIC NOTATION IS RFC 8742 §4.2'S BRACKET-FREE FORM, which RFC
      8742 permits only "In a more informal setting, where the boundaries within
      which the notation is used are obvious" -- and the document supplies the
      missing boundary as a COMMENT LINE, "# CBOR sequence with 4 elements".
      OURS: so the normative example of a stored format is written in a notation
      its own normative reference calls informal. (RFC 8742 is a NORMATIVE
      reference of RFC 9277.) Note also §2.3.1's own concession:
      "This is a somewhat contrived example, as this is not a media type that is
      likely to be committed to storage." NEITHER of the document's two worked
      examples is a file anyone would store.

  - id: 'rfc-9277#V-0003'
    origin: 'source'
    locator: 'Appendix C'
    method: 'Labeled CBOR Sequence'
    source_lines: "857-864"
    hex_source_lines: "861-864"
    hex_region_sha256: 'e8ef28c1ecc6de44ee0adb803ed272193ffd6a727563b1917cb665c15c2b4fbb'
    diagnostic: "55800(1330664270(h'424F52'))"
    annotated_hex: |
         d9 d9f8         # tag(55800)
            da 4f50534e  # tag(1330664270)
               43        # bytes(3)
                  424f52 # "BOR"
    hex: 'd9d9f8da4f50534e43424f52'
    length_bytes: 12
    fingerprint: 'd9d9f8da4f50534e'
    expect: 'valid'
    observed: "decodes to 1 item: tag 55800 ( tag 1330664270 ( h'424F52' ) ). 12 bytes, the label alone with no payload."
    verified_at_this_pass:
      - '0x4f50534e = 1330664270, and its four bytes are the ASCII codes for OPSN'
      - 'the label is 12 bytes, same arithmetic as V-0002'
      - 'the in-library IANA CBOR Tags row for 1330664270 exists, with semantics "A CBOR encoded Openswan configuration file, as stored on disk for unit test cases."'
    notes: >-
      THE ONLY REAL DEPLOYMENT IN THE DOCUMENT, and the only vector that uses a
      tag obtained for a real protocol rather than borrowed from the
      content-format block. It is also the only one written with `h'424F52'`
      rather than `'BOR'` -- the document uses two diagnostic notations for the
      same three bytes, in §2.3 and here. OURS, and worth recording: the
      in-library registry row for this tag carries the reference "Michael
      Richardson; Samir Hussain" and NOT RFC 9277, so the document's own worked
      deployment did not take §2.1's suggestion that "a reference to this
      specification (RFC 9277) alongside the Description of semantics is
      suggested."

  # ------------------------------------------- the four CDDL snippets
  - id: 'rfc-9277#V-0004'
    origin: 'source'
    locator: 'Appendix B.1'
    source_lines: "810-810"
    kind: 'cddl'
    cddl: |
      senml-cbor = #6.1668546929(bstr)
    matches: 'a byte string tagged with TN(112), i.e. a stored application/senml+cbor representation'
    expect: 'valid as CDDL'
    notes: >-
      AND IT DOES NOT MATCH rfc-9277#V-0001. The rule asserts a `bstr` tag
      content; V-0001's tag content is an array, per Appendix B's exception.
      B.1's own justification is "Note that a byte string is used as the type of
      the tag content because a media type representation in general can be any
      byte string." -- true in general and false for the example B.1 points at.
      Reported, not repaired. There is NO outer 55799 in this rule either, so it
      does not describe a §2.2 envelope at all.

  - id: 'rfc-9277#V-0005'
    origin: 'source'
    locator: 'Appendix B.1'
    source_lines: "825-825"
    kind: 'cddl'
    cddl: |
      missing-blocks = #6.1668547090(bstr)
    matches: 'a byte string tagged with TN(272), i.e. an application/missing-blocks+cbor-seq representation embedded in a CBOR byte string'
    expect: 'valid as CDDL'
    notes: >-
      This one carries the qualifier the senml snippet lacks -- "as embedded in a
      CBOR byte string" -- so it is self-consistent. No outer tag here either.

  - id: 'rfc-9277#V-0006'
    origin: 'source'
    locator: 'Appendix D.1'
    source_lines: "923-923"
    kind: 'cddl'
    cddl: |
      td-json-header = #6.55801(#6.1668547250('BOR'))
    matches: 'the 12-byte CBOR-Labeled Non-CBOR header for application/td+json'
    expect: 'valid as CDDL'
    notes: >-
      THE ONLY TWO RULES IN THE DOCUMENT THAT CARRY THEIR OUTER TAG are this one
      and V-0007. The asymmetry with B.1 is unexplained. Note also that td+json
      is NOT CBOR, which is Appendix D's whole point -- so this rule describes
      the header and nothing can describe the file.

  - id: 'rfc-9277#V-0007'
    origin: 'source'
    locator: 'Appendix D.1'
    source_lines: "934-934"
    kind: 'cddl'
    cddl: |
      json-deflate-header = #6.55801(#6.1668557910('BOR'))
    matches: 'the 12-byte header for application/json in deflate content-coding'
    expect: 'valid as CDDL'
    notes: >-
      OURS: content-format 11050 is the one NON-IDENTITY content-coding the
      document works, and it is the case Appendix B's "Exceptionally" rule does
      NOT cover for tag 55799 -- both of its options are limited to identity
      content-coding. Routing it through 55801 is consistent, and the document
      never says that 55799 is unavailable for it. See
      schema/content-format-tag.derived.yaml -> gap_ours.

  # ------------------------------ DERIVED -- OURS, not the document's
  - id: 'rfc-9277#D-0001'
    origin: 'ours (DERIVED)'
    derived: true
    bears_on: ['rfc-9277#R-0031', 'rfc-9277#R-0039']
    kind: 'bytes'
    hex: 'd9d9f7db000000006374017181a3006763757272656e74060302f93e00'
    length_bytes: 29
    expect: 'valid'
    observed: 'decodes to the SAME value as rfc-9277#V-0001 -- tag 55799 ( tag 1668546929 ( [...] ) ) -- in 29 bytes instead of 25'
    notes: >-
      V-0001 WITH THE INNER TAG WRITTEN IN AN 8-BYTE HEAD. `db` is major type 6
      with additional information 27, so the same tag number 1668546929 is
      encoded in 8 argument bytes instead of 4. It is well formed, it is
      semantically identical, and its first 8 bytes are d9d9f7db00000000 --
      so a file(1) rule written from §2.2.1's "8 bytes d9d9f7da63740171 hex"
      MISSES IT. §2.1 pins the tag VALUE into 0x01000000..0xFFFFFFFF and says
      nothing about its ENCODING, and nothing in RFC 9277 requires preferred
      serialisation, because the document has ZERO BCP 14 keywords. All six
      spellings of this prefix are enumerated in
      schema/prefix-spellings.derived.txt.

  - id: 'rfc-9277#D-0002'
    origin: 'ours (DERIVED)'
    derived: true
    bears_on: ['rfc-9277#R-0031', 'rfc-9277#R-0064']
    kind: 'bytes'
    hex: 'da0000d9f8da637402125803424f5200080f'
    length_bytes: 18
    expect: 'valid'
    observed: >-
      decodes to 4 items, the same four as rfc-9277#V-0002 -- tag 55800 ( tag
      1668547090 ( h'424F52' ) ), 0, 8, 15 -- with a 15-byte label instead of
      12
    notes: >-
      V-0002 WITH TWO NON-PREFERRED HEADS: the outer tag 55800 in a 4-byte head
      (`da 0000d9f8`) and the byte-string length 3 in a 1-byte head (`58 03`).
      Well formed, semantically identical, and it breaks BOTH of the document's
      stated invariants at once: the label is 15 bytes, not 12, and the first 8
      bytes are da0000d9f8da6374, not d9d9f8da63740212. WORSE, AND OURS: those
      first 8 bytes CONTAIN TWO ZERO BYTES, which is exactly what §2.1 asks
      registrants to avoid "as these may confuse implementations that treat the
      magic number as a C string" -- so a non-preferred encoding defeats that
      advice even when the registrant followed it. 25 of the 30 enumerated
      spellings have this property. ([correction] 2026-10-20, pass 2: this note
      said 20; schema/prefix-spellings.derived.txt has always marked 25 rows and
      said 25 in its own summary, and 25 re-derives independently from
      RFC 8949 section 3. Four other files carried the same wrong figure.)

  - id: 'rfc-9277#D-0003'
    origin: 'ours (DERIVED)'
    derived: true
    bears_on: ['rfc-9277#R-0062', 'rfc-9277#R-0086']
    kind: 'bytes'
    hex: 'd9d9f8da4f50534e43424f5200080f'
    length_bytes: 15
    expect: 'valid'
    observed: "decodes to 4 items: tag 55800 ( tag 1330664270 ( h'424F52' ) ), 0, 8, 15"
    notes: >-
      RELABELLING, IN BYTES. This is rfc-9277#V-0002's payload -- the missing
      blocks list 0, 8, 15 -- behind the OPENSWAN label from V-0003. The inner
      tag has been swapped, so the file now claims to be an Openswan
      configuration and is not one. IT IS WELL FORMED, IT BREAKS NO SIGNATURE
      over the payload, and nothing in RFC 9277 detects it: under both methods
      the indicator is outside everything a signature over the content could
      cover. §3 names the class and states no rule: "Protective applications
      (that check data) cannot rely on the applications they try to protect
      (that use the data) to make exactly the same decisions in recognizing file
      formats.  (This is an instance of a check versus use issue.)" THIS IS THE
      condition-(4) FIXTURE, and it is the reason the record concludes that the
      mechanism MD-3 forbids would not have satisfied our own condition (4)
      anyway.

  - id: 'rfc-9277#D-0004'
    origin: 'ours (DERIVED)'
    derived: true
    bears_on: ['rfc-9277#R-0139', 'rfc-9277#R-0140', 'rfc-9277#R-0142']
    kind: 'bytes'
    hex: 'd9d9f8da6374021243424f5200080fd9d9f8da6374021243424f5200080f'
    length_bytes: 30
    expect: 'valid as CBOR; UNDEFINED as a protocol artifact'
    observed: >-
      decodes to 8 items: tag 55800 ( tag 1668547090 ( h'424F52' ) ), 0, 8, 15,
      tag 55800 ( tag 1668547090 ( h'424F52' ) ), 0, 8, 15 -- A LABEL IN THE
      MIDDLE OF THE FILE, at offset 15
    notes: >-
      THE HEADLINE FINDING AS A FIXTURE. `cat a.seq b.seq > c.seq` applied to two
      copies of rfc-9277#V-0002. RFC 8742 §2 makes this in spec:
      "(Consequently, concatenating zero or more CBOR Sequences also results in a
      CBOR Sequence.)" -- verified against .cache/rfc-8742.txt at this pass. RFC
      9277 Appendix A.2 then says "If each object is preceded by a Labeled CBOR
      Sequence label, then there may be multiple such labels in the file." and
      leaves the rule to each protocol: "If the CBOR-Sequence-based protocol does
      not define the semantics for or at least tolerate embedded labels, care
      must be taken when concatenating Labeled CBOR Sequences to remove the label
      from all but the first part." LOWER-CASE "must", no default, and no
      conformance clause anywhere in the document. SO THERE IS NO EXPECTED RESULT
      FOR THIS FIXTURE, and that absence is what a test suite should assert: a
      reader that rejects it and a reader that accepts it are both conformant.

  - id: 'rfc-9277#D-0005'
    origin: 'ours (DERIVED)'
    derived: true
    bears_on: ['rfc-9277#R-0142']
    kind: 'bytes'
    hex: 'd9d9f8da6374021243424f5200080f00080f'
    length_bytes: 18
    expect: 'valid'
    observed: "decodes to 7 items: the label, then 0, 8, 15, 0, 8, 15"
    notes: >-
      THE SAME CONCATENATION WITH THE SECOND LABEL STRIPPED -- the fix Appendix
      A.2 names. It is 12 bytes shorter than rfc-9277#D-0004 and it is the only
      one of the two whose interpretation is not in question. OURS: note what it
      costs semantically. The two source files are now indistinguishable from one
      six-element file; the boundary between them is gone, which is RFC 8742's
      completeness hole arriving from the other direction. If the boundary
      matters, stripping is wrong; if it does not, the label was never needed
      per-object. The document poses neither half.

  - id: 'rfc-9277#D-0006'
    origin: 'ours (DERIVED)'
    derived: true
    bears_on: ['rfc-9277#R-0045', 'rfc-9277#R-0110']
    kind: 'bytes'
    hex: 'd9d9f8da6374014043424f52'
    length_bytes: 12
    expect: 'valid'
    observed: "decodes to 1 item: tag 55800 ( tag 1668546880 ( h'424F52' ) )"
    notes: >-
      THE LABEL THIS LANE WAS READ FOR, AND THE DOCUMENT DOES NOT PRINT IT.
      application/cbor-seq holds CoAP Content-Format 63 (RFC 8742 §6.2, Table 1,
      held verbatim at records/ietf/rfc-8742/distilled/schema/registrations.txt
      region T01), so TN(63) = 0x63740101 + 0 + 63 = 1668546880 = 0x63740140 --
      recomputed at this pass. Fingerprint d9d9f8da63740140. IT NEEDS NO NEW IANA
      ALLOCATION AT ALL: the tag number is a function of a number RFC 8742 already
      obtained in 2020. It costs nothing, and it says only "a CBOR sequence
      follows", which is §1's APK-is-a-ZIP complaint one level up. Saying "an
      m-of-n statement log follows" is the part that needs the First Come First
      Served allocation -- and that is the part a no-tags rule forbids. Note that
      RFC 8742 §6.1 still registers "Magic number(s): N/A" for this media type
      and RFC 9277 carries no `Updates: 8742`.

  - id: 'rfc-9277#D-0007'
    origin: 'ours (DERIVED)'
    derived: true
    bears_on: ['rfc-9277#R-0071', 'rfc-9277#R-0069']
    kind: 'bytes'
    hex: 'd9d9f8da4141414143424f5200080f'
    length_bytes: 15
    expect: 'valid'
    observed: "decodes to 4 items: tag 55800 ( tag 1094795585 ( h'424F52' ) ), 0, 8, 15 -- and 1094795585 = 0x41414141, ASCII \"AAAA\", which is in no registry"
    notes: >-
      A KNOWN OUTER TAG WITH AN UNREGISTERED INNER ONE. 0x41414141 satisfies every
      constraint §2.1 states -- it is in 0x01000000..0xFFFFFFFF, it has no zero
      byte, and it is four ASCII codes -- and it is allocated to nothing. THE FILE
      PARSES CLEANLY. Nothing in RFC 9277 says what a reader does here: 55800
      announces only "indicates that the file contains CBOR Sequences", the inner
      tag names a protocol the reader cannot know, and the magic number's entire
      purpose (selecting the right application) FAILS OPEN AND SILENTLY. RFC 8949
      §5.4 governs unrecognised tags in general and discourages rejecting them;
      that is RFC 8949's rule, not this document's. §3 approaches it from the
      security side and states no rule. See ../state-machine.yaml ->
      undefined_transitions.

