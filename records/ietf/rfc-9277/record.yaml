status: summarized
usefulness:
  verdict: useful
  reason: >
    Defines the CBOR file magic / labelled-content convention — how a stored
    statement file identifies itself — and prices it. It does NOT define tag
    55799 (RFC 8949 §3.4.6 does); it allocates 55800, 55801 and 65,279
    content-format tag numbers. Both of its envelopes are two nested tags, and
    the inner one — the tag that actually says which protocol — needs an IANA
    FCFS allocation, so under MD-3's no-tags rule in-band identification is
    unavailable at any price. Two findings beyond that: the label is
    unauthenticated under both methods, so it never discharges the
    `canonical-encoding` topic's condition (4); and Appendix A.2 makes
    concatenating labelled sequences a per-protocol question, which is the first
    rule an append-only log's export profile has to write.
  assessed: "2026-10-20"
