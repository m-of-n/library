      coverage: "195 verbatim spans across 24 locators (Abstract, §1, §1.1, §1.2, §2, §2.1, §2.2, §2.2.1, §2.3, §2.3.1, §3, §4, §4.1-§4.3, Appendices A, A.1-A.3, B, B.1, C, D, D.1), plus both hex examples, the Openswan hex, all 4 CDDL snippets, the 3 registry entries and the TN formula with its aside reproduced in fenced blocks with their source line ranges. All 195 confirmed contiguous substrings of the whitespace-normalised source AND confirmed to start and end inside their locator's section, 0 failures. TWO DECLARED CLASSES OF EXCEPTION, neither healed: (1) the two RFC v3 aside bars, stripped on source lines 715-727 and 765-777 and NOWHERE else, with the 7 affected spans marked individually - the fenced blocks reproduce the same ranges WITH the bars intact, so the file carries both forms; (2) TWELVE hyphenation breaks (233/234, 257/258, 293/294, 329/330, 373/374, 657/658, 722/723 and 726/727 both inside an aside, 784/785, 795/796, 807/808, 816/817, 821/822), each sentence quoted as TWO halves cut where the source cuts it, the second beginning mid-token. Two of the twelve are the SAME SENTENCE appearing twice, in §2.3 and again in Appendix D, broken at the same token both times. The source has 0 form feeds and 0 page footers; 4 lines carry trailing whitespace (724, 767, 770, 772, all blank aside lines) and line 771 carries two U+2264 characters, all preserved where quoted. §5, the Acknowledgements, the Contributors list and the Authors' Addresses are dropped per the skill, with the reference-classification facts moved to design-notes.md"
