# RFC 8392 PRINTS FIVE COMPLETE CWTs, AND ALL FIVE VERIFY CRYPTOGRAPHICALLY.
#
# That is the headline of this file and it was not a foregone conclusion: the
# summary this record carries warned that two of the five "are not reproducible
# from the printed key". They are. See V-0006 and V-0009, the two MACed CWTs,
# and the correction note in V-0003 below - [correction 2026-10-21, pass 3:
# this read "See V-0005", which is A.3's SIGNED CWT and carries none of the
# evidence; the two vectors that demonstrate the claim are V-0006 and V-0009] -
# what fails is a CONFORMANCE CHECK on the key's metadata, not the key material,
# and the distinction is worth having because it decides whether A.4 and A.7 can
# be used as fixtures. They can.
#
# WHAT WAS DONE, AND WITH WHAT. A CBOR decoder/encoder (RFC 8949 §3 and §4.2.1),
# ECDSA P-256 verification (RFC 9053 §2.1), HMAC-SHA-256 and AES-128-CCM with
# L=2 and an 8-octet tag (RFC 9053 §3.1 and §4.2), ALL WRITTEN FOR THIS PASS
# over `hashlib` alone. NO CBOR, COSE, CWT, EC OR AES LIBRARY WAS USED, so a
# shared library bug cannot hide here. The AES core was gated on FIPS 197 C.1
# (69c4e0d86a7b0430d8cdb78070b4c55a) before it was used for anything.
#
# PROVENANCE CONVENTION, as rfc-9964's vectors use it:
#   source: printed   - every byte of every value in the vector appears in
#                       RFC 8392 itself. `reproduced` says what this extraction
#                       recomputed from those bytes and whether it matched.
#   source: derived   - every byte is printed by the source, but the ASSERTION
#                       the vector makes is this extraction's.
# NOTHING IN THIS FILE IS COMPUTED-AND-PRESENTED-AS-PRINTED. There are no
# invented keys and no invented CWTs: the document supplies enough that none
# was needed.
#
# `locator` gives the section AND the exact line range in .cache/rfc-8392.txt,
# plus the sha256 of that run of lines, so any value here can be re-cut from the
# source without trusting this file. The RFC hard-wraps its hex blocks for
# display - "Line breaks are for display purposes only" (A.2, R-0110) - and the
# only transformation applied is joining those lines; nothing else is altered.
#
# PAGE DECORATION is never inside a quoted range, so no hex run here contains a
# running footer. Checked by the region machinery, which refuses such a range.

