  - id: V-0009
    name: "A.7 MACed CWT with a floating-point iat - MAC TAG REPRODUCED"
    locator: "Appendix A.7, Figures 18 and 19; source lines 1271-1272"
    region_sha256: "1b8d58da8255b6515eff6050336551253ef4fd82abc2a4a169c70429de5494ac"
    source: printed
    octets: 42
    hex: "d18443a10104a1044c53796d6d65747269633235364ba106fb41d584367c20000048b8816f34c0542892"
    key: "V-0003 (A.2.2)"
    decoded:
      tag: 17
      protected: "h'a10104' = << {1: 4} >>"
      unprotected: "{4: h'53796d6d6574726963323536'}"
      payload: "h'a106fb41d584367c200000' = << {6: 1443944944.5} >>"
      tag_value: "h'b8816f34c0542892'"
    expected:
      mac_reproduces: true
      mac_structure_hex: "84644d41433043a10104404ba106fb41d584367c200000"
      full_hmac: "b8816f34c05428920ede68e312865170baefc1cd7153864335ee857555a78bc0"
      iat_encoding: "0xfb + 8 octets = float64"
      float32_is_lossy: true
    reproduced: >-
      HMAC-SHA-256 over ["MAC0", h'a10104', h'', h'a106fb41d584367c200000']
      gives b8816f34c05428920ede68e312865170baefc1cd7153864335ee857555a78bc0; its first 8 octets are b8816f34c0542892, the
      printed tag. The iat value decodes as exactly 1443944944.5.
    finding: >-
      THE WIDTH IS LOAD-BEARING AND THE DOCUMENT NEVER SAYS SO. Measured here:
      round-tripping 1443944944.5 through binary32 gives 1443944960.0, so
      float64 is the ONLY IEEE width that holds this value and the RFC 8949
      §4.2.2 "shortest floating-point" rule happens to agree. But §4's Table 1
      says only "integer or floating-point number" and §9.1.2 says the same, so
      a re-encoder that narrows a float claim is conformant to RFC 8392 and
      destroys the MAC. This is the claim shape most likely to re-encode
      differently, and it is the one the document chose to exhibit.
    constrains:
      - "rfc-8392#R-0006"
      - "rfc-8392#R-0028"
      - "rfc-8392#R-0037"
      - "rfc-8392#R-0053"

