  - id: V-0012
    name: "DERIVED - the nine diagnostic-notation renderings as fixture inputs, and their three syntax defects"
    # [correction 2026-10-21, pass 3 - cross-check] This name said "five". The
    # appendix prints NINE diagnostic figures (3, 5, 7, 9, 11, 13, 15, 17, 19),
    # as this vector's own `locator`, `assertion` ("three of the nine") and
    # `measured` block (3 defective + 6 clean) all say, and as
    # examples/README.md says ("3 of 9 figures do not parse"). Only the name
    # was wrong; "five" is the number of printed CWTs, not of figures.
    locator: "Appendix A, Figures 3, 5, 7, 9, 11, 13, 15, 17, 19"
    source: derived
    assertion: >-
      THE HEX IS THE AUTHORITY AND THE DIAGNOSTIC NOTATION IS NOT MACHINE-SAFE.
      Three of the nine diagnostic figures cannot be parsed as CBOR diagnostic
      notation as printed.
    measured:
      figure_5: "MISSING COMMA after the `k` entry (source lines 967-968): the `-1` value is followed by a newline and then `/ kty /  1: 4` with no separator"
      figure_7: "MISSING COMMA after the `k` entry (source lines 983-985), same shape"
      figure_19: "TRAILING COMMA inside a one-entry map (source lines 1301-1302): `/ kid / 4: h'...' / 'Symmetric256' /,` immediately before the closing brace"
      figures_3_9_11_13_15_17: "parse cleanly"
    method: >-
      Read off the cached source by line number. The appendix figures are NOT
      in schema/source-renderings.txt - that file captures §4's table, §6's
      figure and the IANA entries - so these are cited by line range here
      instead, which is where the appendix belongs.
    finding: >-
      Cosmetic, and worth recording for one practical reason: anyone building
      fixtures by parsing the RFC's diagnostic notation rather than its hex
      hits three parse errors in a nine-figure appendix. Use the hex. This
      extraction did, which is why it found them - the hex of all nine figures
      decodes cleanly and reproduces every cryptographic expectation above.
      ../design-notes.md defect D-7.
    constrains:
      - "rfc-8392#R-0107"
      - "rfc-8392#R-0110"
