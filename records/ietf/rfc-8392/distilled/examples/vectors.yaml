  - id: V-0011
    name: "DERIVED - the deterministic-map-order census, and where it splits"
    locator: "Appendix A.1 to A.7"
    source: derived
    assertion: >-
      ALL FIVE PRINTED CWTs AND THE PRINTED CLAIMS SET ARE IN RFC 8949 §4.2.1
      DETERMINISTIC MAP ORDER. ALL THREE PRINTED COSE_KEYS ARE NOT.
    measured:
      claims_set_A_1: "byte-identical after re-encoding"
      signed_A_3: "byte-identical"
      maced_A_4: "byte-identical"
      encrypted_A_5: "byte-identical"
      nested_A_6: "byte-identical"
      float_A_7: "byte-identical"
      key_A_2_1: "DIFFERS - keys printed -1, 1, 2, 3; §4.2.1 requires 1, 2, 3, -1"
      key_A_2_2: "DIFFERS - same reason"
      key_A_2_3: "DIFFERS - keys printed -4, -3, -2, -1, 1, 2, 3"
    method: >-
      Each figure was decoded and re-encoded with an RFC 8949 §4.2.1 encoder
      written for this pass (shortest argument, definite lengths, map keys
      sorted by the bytewise lexicographic order of their encoded forms) and the
      result compared octet for octet with the source bytes. 6 of 6 CWT-side
      structures identical, 0 of 3 keys.
    finding: >-
      RFC 8392 PREDATES RFC 8949 AND MENTIONS NO CANONICAL FORM AT ALL -
      `canonical` and `deterministic` occur zero times - so this is a property
      of the examples rather than a rule the document states, and the split is
      not a defect. It matters for two reasons. FIRST, the structures we would
      sign are already deterministic in the one worked set the standard
      supplies, so a §4.2.1 profile costs nothing against these vectors.
      SECOND, the keys are not, so a COSE Key Thumbprint computed over the
      printed bytes of A.2.1, A.2.2 or A.2.3 differs from one computed over
      their §4.2.1 re-encoding - which is a DEC-003 trap, and the reason
      rfc-9679's "canonical key bytes before hashing" clause is not pedantry.
      Note that RFC 7049 §3.9's canonical order, which is what RFC 8392 could
      have cited, sorts these keys the same way, so the split does not come
      from the vintage of the rule.
    constrains: []

