  - id: V-0010
    name: "DERIVED - the tag census over all five printed CWTs"
    locator: "Appendix A.3 to A.7; source lines 1051-1272"
    source: derived
    assertion: >-
      FOUR OF THE FIVE PRINTED CWTs CARRY A COSE TAG AND NO TAG 61; ONE CARRIES
      BOTH; NOT ONE IS UNTAGGED.
    measured:
      A_3_signed: "18(...)"
      A_4_maced: "61(17(...))"
      A_5_encrypted: "16(...)"
      A_6_nested: "16(...)"
      A_7_float: "17(...)"
      untagged_examples: 0
      tag_61_examples: 1
    method: >-
      The first octets of each figure's joined hex, decoded by this pass: d2 =
      tag 18, d83dd1 = tag 61 over tag 17, d0 = tag 16, d0 = tag 16, d1 = tag
      17.
    finding: >-
      THE FULLY UNTAGGED FORM MD-3 OPTION 5 REQUIRES IS PERMITTED BY §7.2 STEP
      3 AND DEMONSTRATED NOWHERE IN THE DEFINING DOCUMENT. So an option-5
      fixture package has no reference bytes in RFC 8392 to check itself
      against, and the first untagged CWT any of us produces is unvalidated
      against the standard's own examples. That is a real cost of option 5 and
      it is a tooling cost rather than a security one.
    constrains:
      - "rfc-8392#R-0045"
      - "rfc-8392#R-0046"
      - "rfc-8392#R-0061"

