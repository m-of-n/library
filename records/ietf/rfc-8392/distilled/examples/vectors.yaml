    hex: "a4205820403697de87af64611c1d32a05dab0fe1fcb715a86ab435f1ec99192d795693880104024c53796d6d6574726963323536030a"
    decoded_from_the_hex:
      "-1 (k)": "h'403697de87af64611c1d32a05dab0fe1fcb715a86ab435f1ec99192d79569388' (32 octets)"
      "1 (kty)": "4 (Symmetric)"
      "2 (kid)": "h'53796d6d6574726963323536' = 'Symmetric256'"
      "3 (alg)": "10 (AES-CCM-16-64-128)"
    printed_in_figure_7:
      kid_label: 4
      alg: "4 / HMAC 256/64 /"
    expected:
      hex_and_diagnostic_disagree_twice: true
      errata: >-
        7982 says the kid label should be 2 (believe the hex); 8655 says the alg
        value should be 4 (believe the diagnostic). BOTH ARE STATUS 'Reported'
        and they point in OPPOSITE DIRECTIONS about which rendering is
        authoritative.
      conformance: >-
        As the hex prints it, this key declares alg 10 and is then used to MAC
        V-0006 and V-0009, whose protected headers both declare alg 4. RFC 9053
        §3.1: "If the "alg" field is present, it MUST match the HMAC algorithm
        being used." So the key as printed FAILS that check.
        [correction 2026-10-21, pass 3 - cross-check] This read "V-0005 and
        V-0008". Both ids resolve to real vectors and neither is MACed at all:
        V-0005 is A.3's COSE_Sign1 and V-0008 is A.6's COSE_Encrypt0, and their
        protected headers are {1: -7} and {1: 10}, so the sentence was false of
        the pair it named. Re-derived by decoding: V-0006 and V-0009 are the
        only two printed CWTs that carry COSE tag 17 (COSE_Mac0), the only two
        whose protected bucket is h'a10104' = {1: 4}, and the only two whose
        `key` field names this vector. design-notes.md D-2 and summary.md both
        had it right (Figures 12 and 18; V-0003, V-0006, V-0009), so this was
        the only artifact carrying the wrong pair.
      usable_as_a_fixture: true
    reproduced: >-
      Decoded here with this pass's own decoder, confirming both discrepancies
      mechanically rather than by eye: the bytes 0104024c53796d6d65747269633235
      36030a place kty=4 at 01, kid at 02 and alg=10 at 03, while Figure 7
      prints "/ kid / 4:" and "/ alg / 3: 4". Figures 5 and 9 both print kid at
      label 2, so Figure 7 is the outlier among the three.
    constrains: []
    note: >-
      [CORRECTION TO THIS RECORD'S OWN summary.md] That summary says "two of the
      five Appendix A CWTs are not reproducible from the printed key without
      applying two unverified errata". THEY ARE REPRODUCIBLE. Both MAC tags
      reproduce from THIS key's own `k` bytes - see V-0006 and V-0009, where
      HMAC-SHA-256(k, MAC_structure)[:8] equals the printed tag exactly. The two
      errata concern the key's METADATA (the kid label and the alg value), not
      its key material, and nothing in the MAC computation reads either. So the
      finding is narrower and sharper than the summary made it: A.2.2 is a
      WORKING fixture that fails a conformance check on its own `alg`
      declaration. The summary's practical advice - prefer A.2.3 + Figure 10 -
      still holds, because that one is self-consistent as well as working.

