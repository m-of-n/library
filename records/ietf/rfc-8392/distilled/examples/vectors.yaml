      hex. Re-encodes byte-identically under RFC 8949 §4.2.1.
    finding: >-
      THE KEY IDENTIFIER IS OUTSIDE THE SIGNATURE, and this vector is the proof
      rather than the claim: Sig_structure takes body_protected and the payload
