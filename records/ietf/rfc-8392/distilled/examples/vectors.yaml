  - id: V-0003
    name: "A.2.2 256-bit symmetric COSE_Key - THE KEY WITH TWO DEFECTS"
    locator: "Appendix A.2.2, Figures 6 and 7; source lines 977-978"
    region_sha256: "ef4fa0994382e9156914838ea4329399c9e77fc88542582420eaf99d7ce8445a"
    source: printed
