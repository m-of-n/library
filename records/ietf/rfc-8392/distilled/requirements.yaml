  - id: 'rfc-8392#R-0086'
    object: 'claim key range -65536..-257 / 256..65535 and strings of length 2'
    field: 'allocation policy tier 2: Specification Required. CBOR cost 3 octets'
    verb: 'none'
    actor: 'registrant'
    locator: '§9.1.1'
    text: 'Integer values from -65536 to -257 and from 256 to 65535 along with strings of length 2 are designated as Specification Required.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0087'
    object: 'claim key > 65535 and strings longer than 2'
    field: 'allocation policy tier 3: Expert Review. CBOR cost 5 octets for an integer up to 2^32-1 (9 beyond), 4 and up for a string'
    verb: 'none'
    actor: 'registrant'
    locator: '§9.1.1'
    text: 'Integer values greater than 65535 and strings of length greater than 2 are designated as Expert Review.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0088'
    object: 'claim key < -65536'
    field: 'allocation policy tier 4: PRIVATE USE - the only policy-free range, and the most expensive at 5 octets'
    verb: 'none'
    actor: 'anyone'
    locator: '§9.1.1'
    text: 'Integer values less than -65536 are marked as Private Use.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Five times the cheapest key. No scoping mechanism: two issuers that both reach for a Private Use key collide, and §3 makes the collision silent. design-notes.md, R-M-12.'
  - id: 'rfc-8392#R-0089'
