record: rfc-8392
source_version: "RFC 8392 (May 2018)"
source_digest: "9021ff7c4d274cf34873fe4f4fb17c4fe323247dd0f96bfcab54909bfcdc5f13"
source_keyword_count: 9        # bin/bcp14-count .cache/rfc-8392.txt --by-keyword: 8 MUST, 1 MUST NOT
extracted_keyword_count: 9     # recomputed and checked by bin/validate
reconciliation: >-
  THE COUNTS AGREE AT 9, and a reconciliation is written anyway because 110
  entries against 9 keywords needs explaining, and because 9 keywords in a
  25-page Standards Track format document is itself the finding.

  WHERE THE 9 ARE, by source line: L237 (MUST, §2 - the leading tag 1 of a
  NumericDate must be omitted), L258 (MUST, §3 - unknown claims must be
  ignored), L361 (MUST NOT, §5 - claim values must not be prefixed with any
  CBOR tag), L399 (MUST, §6 - the CWT tag must prefix a COSE-tagged object),
  L425 (MUST, §7.1 step 3 - the COSE Header must be valid per RFC 8152), L434
  / L439 / L445 (MUST x3, §7.1 step 4 - all RFC 8152 steps must be followed,
  once per protection case), L470 (MUST, §7.2 - a failing CWT must be
  rejected). NOT ONE OF THE NINE IS IN §4, §8, §9 OR APPENDIX A.

  AND EIGHT OF THE NINE DELEGATE OR FORBID RATHER THAN REQUIRE. Three are
  "all steps specified in [RFC8152] ... MUST be followed"; two are
  prohibitions (the tag-1 omission and the no-CBOR-tag rule); one is a
  validity reference to RFC 8152; one is the ignore-unknown rule; one is the
  rejection rule. NOT ONE of the nine fixes a claim key, a claim value type,
  or a claim that has to be present.

  SO THE REAL NORMATIVE BASELINE IS PROSE, A TABLE AND A REGISTRY, NOT BCP 14.
  What an implementer must obey lives in (i) §3.1.1-§3.1.7's seven claim
  definitions, each of which fixes a value type and a claim key in two
  keyword-free sentences; (ii) §4's Table 1, whose seven data rows are the
  document's whole collected type model and are reproduced here one row per
  entry; (iii) §9.1.1's registration template, whose `Claim Key` field is
  where the FOUR ALLOCATION POLICY TIERS actually live - not in a table, and
  with no keyword among them; (iv) §9.1.2's eight completed registry entries,
  reproduced whole; and (v) §7.1 and §7.2's two numbered procedures, which are
  the only ordered content in the document.

  WHAT WAS COUNTED INSTEAD, therefore: every claim definition split into its
  type fact and its claim-key fact separately, because each is separately
  testable; every Table 1 data row; every §9.1.1 template field, with the four
  policy tiers as four entries; every §9.1.2 registry entry; every numbered
  step of §7.1 and §7.2, with §7.1 step 4's and §7.2 step 5's three bullets as
  three entries each; all four IANA registrations; §8's four security
  statements; and Appendix A's four presentation rules, which are rules a
  fixture builder must obey.

  WHAT WAS DELIBERATELY NOT COUNTED: §2's BCP 14 recital at source lines
  208-212. It recites all eleven keywords and constrains nothing;
  bin/validate recounts these texts with boilerplate stripping OFF, so
  quoting it would add 11 phantom keywords and make the extraction read 20
  against a source of 9. It is quoted in normative.md, which nothing counts.

  LOWER-CASE FORCE WORDS, each recorded as `kind: inferred` with the phrase
  named in `field` rather than silently promoted: §3's "a CWT must contain",
  §3.1's "should define", §6's "Its use is optional", §8's "producers
  normally should sign the message and then encrypt the result", §9.1's "IANA
  must only accept" and "should direct", "should be applied", "It is
  suggested", "should defer", and §9.1.1's "should normally have". §8's
  sign-then-encrypt sentence is the strongest piece of security advice in the
  document and it is lower case, so under §2's "when, and only when, they
  appear in all capitals" it binds nobody. That is a finding, not a counting
  artefact.

  COMPOUND SENTENCES SPLIT, AND NOTHING SPLICED. §7.1 step 4 and §7.2 step 5
  are each one numbered step carrying three parallel bullets; each bullet is
  its own entry, which is where three of the nine keywords sit. §3.1.1 to
  §3.1.7 are each one paragraph of two sentences, split into a type entry and
  a claim-key entry; the split is a CONTIGUOUS character span inside one
  flowed line range, never two non-adjacent quotes welded together. §3.1.3 is
  split three ways for the same reason - scalar type, array element type,
  claim key.

  TEXT NORMALISATION, DECLARED: `text` is the source's own wording with
  whitespace normalised - line breaks and the RFC's double sentence spacing
  become single spaces. Every one of the 110 texts was cut from
  .cache/rfc-8392.txt by line range by script, never retyped, and every one
  was then VERIFIED mechanically as a contiguous substring of the
  whitespace-normalised source: 110 of 110, zero failures. normative.md carries
  the byte-exact renderings as fenced runs of source lines with per-region
  sha256 digests.

  PAGE DECORATION: the source is paginated, with 25 form feeds and 25
  five-line page breaks. No entry's line range touches one. Four sections are
  therefore quoted in normative.md as two or three adjacent regions, declared
  in place. Note for a later pass: Python's splitlines() splits on form feeds
  and would shift every line number in this file by up to 25; it was built
  with split("\n").
reviewed_by: ""
note: >-
  Ids are stable and never reused. Cite as rfc-8392#R-NNNN.

  Pass 1 of the FX-1 extraction (extract), effort max, 2026-10-20. Read only
  .cache/rfc-8392.txt - never summary.md and never another record's
  artifacts.

  `verb: none` marks an entry whose source sentence carries no capitalised BCP
  14 keyword; `field` then names the phrase that carries the force instead.
  `actor` is who must comply, in the document's own vocabulary where it has
  one ("implementations", "applications", "producers", "recipient", "IANA",
  "Designated Experts") and the nearest role otherwise.

  THIS DOCUMENT HAS TWO PROCEDURES AND NO EXCHANGE. §7.1 and §7.2 are
  one-party procedures with a loop each and one failure action between them,
  so `protocol.yaml` and `state-machine.yaml` are APPLICABLE for this record
  and model exactly those - see their own notes for what is and is not there.
  The words `verifier`, `sender`, `exchange`, `handshake` and `negotiate`
  occur ZERO times in the 1403-line source; `protocol` occurs once, at line
  378, in "by a transport protocol".

  AND IT SHIPS NO GRAMMAR. `CDDL`, `ABNF`, `ASN.1`, `JSON Schema`, `schema`
  and `grammar` each occur ZERO times. Everything in distilled/schema/ is
  either a verbatim capture of §4's table, §6's figure and the IANA entries,
  or carries `.derived.` in its filename.

