    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0045'
    object: 'CWT CBOR tag'
    field: 'optionality and intended use'
    verb: 'none'
    actor: 'application'
    locator: '§6'
    text: 'Its use is optional and is intended for use in cases in which this information would not otherwise be known.'
    kind: inferred
    testable: 'no'
    status: active
  - id: 'rfc-8392#R-0046'
    object: 'CWT CBOR tag'
    field: 'pairing rule: the CWT tag must sit outside a COSE CBOR tag'
    verb: 'MUST'
    actor: 'producer'
    locator: '§6'
    text: 'If present, the CWT tag MUST prefix a tagged object using one of the COSE CBOR tags.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'So CWT tagging and COSE tagging come as a pair. Four of the five Appendix A CWTs carry no tag 61; not one of the five is untagged.'
  - id: 'rfc-8392#R-0047'
    object: 'the creation procedure'
    field: 'step ordering is not significant where there are no input/output dependencies'
    verb: 'none'
    actor: 'producer'
    locator: '§7.1'
    text: 'The order of the steps is not significant in cases where there are no dependencies between the inputs and outputs of the steps.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0048'
    object: 'creation step 1'
    field: 'create the claims set'
    verb: 'none'
    actor: 'producer'
    locator: '§7.1 step 1'
    text: 'Create a CWT Claims Set containing the desired claims.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0049'
    object: 'creation step 2'
    field: 'the Message is the binary representation of the claims set. NAMES NO CANONICAL FORM: determinism is sidestepped, not solved'
    verb: 'none'
    actor: 'producer'
    locator: '§7.1 step 2'
    text: 'Let the Message be the binary representation of the CWT Claims Set.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0050'
    object: 'creation step 3'
    field: 'COSE Header validity'
    verb: 'MUST'
    actor: 'producer'
    locator: '§7.1 step 3'
    text: 'The COSE Header MUST be valid per the [RFC8152] specification.'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0051'
    object: 'creation step 4'
    field: 'the three protection cases'
    verb: 'none'
    actor: 'producer'
    locator: '§7.1 step 4'
    text: 'Depending upon whether the CWT is signed, MACed, or encrypted, there are three cases:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0052'
    object: 'creation step 4, signed branch'
    field: 'all RFC 8152 signing steps must be followed'
    verb: 'MUST'
    actor: 'producer'
    locator: '§7.1 step 4'
    text: '* If the CWT is signed, create a COSE_Sign/COSE_Sign1 object using the Message as the COSE_Sign/COSE_Sign1 Payload; all steps specified in [RFC8152] for creating a COSE_Sign/ COSE_Sign1 object MUST be followed.'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0053'
    object: 'creation step 4, MACed branch'
    field: 'all RFC 8152 MAC steps must be followed'
    verb: 'MUST'
    actor: 'producer'
    locator: '§7.1 step 4'
    text: '* Else, if the CWT is MACed, create a COSE_Mac/COSE_Mac0 object using the Message as the COSE_Mac/COSE_Mac0 Payload; all steps specified in [RFC8152] for creating a COSE_Mac/COSE_Mac0 object MUST be followed.'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0054'
    object: 'creation step 4, encrypted branch'
    field: 'all RFC 8152 encryption steps must be followed'
    verb: 'MUST'
    actor: 'producer'
    locator: '§7.1 step 4'
    text: '* Else, if the CWT is a COSE_Encrypt/COSE_Encrypt0 object, create a COSE_Encrypt/COSE_Encrypt0 using the Message as the plaintext for the COSE_Encrypt/COSE_Encrypt0 object; all steps specified in [RFC8152] for creating a COSE_Encrypt/ COSE_Encrypt0 object MUST be followed.'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0055'
    object: 'creation step 5'
    field: 'the nesting loop: re-enter at step 3 with the tagged COSE object as the Message'
    verb: 'none'
    actor: 'producer'
    locator: '§7.1 step 5'
    text: 'If a nested signing, MACing, or encryption operation will be performed, let the Message be the tagged COSE_Sign/COSE_Sign1, COSE_Mac/COSE_Mac0, or COSE_Encrypt/COSE_Encrypt0, and return to Step 3.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'One of the document''s two loops. Modelled in state-machine.yaml.'
  - id: 'rfc-8392#R-0056'
    object: 'creation step 6'
    field: 'TAGS ARE PREPENDED AFTER THE SIGNATURE EXISTS, and only if the application needs them'
    verb: 'none'
    actor: 'producer'
    locator: '§7.1 step 6'
    text: 'If needed by the application, prepend the COSE object with the appropriate COSE CBOR tag to indicate the type of the COSE object. If needed by the application, prepend the COSE object with the CWT CBOR tag to indicate that the COSE object is a CWT.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'With §7.2 step 2 this is the proof that neither the COSE tag nor the CWT tag is authenticated: one is added after signing, the other removed before validating.'
  - id: 'rfc-8392#R-0057'
    object: 'the validation procedure'
    field: 'step ordering is not significant where there are no input/output dependencies'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2'
    text: 'The order of the steps is not significant in cases where there are no dependencies between the inputs and outputs of the steps.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0058'
    object: 'the validation procedure'
    field: 'THE ONLY FAILURE ACTION IN THE DOCUMENT: reject, and treat as invalid input'
    verb: 'MUST'
    actor: 'recipient'
    locator: '§7.2'
    text: 'If any of the listed steps fail, then the CWT MUST be rejected -- that is, treated by the application as invalid input.'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0059'
    object: 'validation step 1'
    field: 'the CWT is a valid CBOR object'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 1'
    text: 'Verify that the CWT is a valid CBOR object.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0060'
    object: 'validation step 2'
    field: 'remove the CWT tag if present and verify a COSE tag follows'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 2'
    text: 'If the object begins with the CWT CBOR tag, remove it and verify that one of the COSE CBOR tags follows it.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0061'
    object: 'validation step 3'
    field: 'remove a COSE tag and use it to determine the CWT type; if absent, the type comes from the application context'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 3'
    text: 'If the object is tagged with one of the COSE CBOR tags, remove it and use it to determine the type of the CWT, COSE_Sign/ COSE_Sign1, COSE_Mac/COSE_Mac0, or COSE_Encrypt/COSE_Encrypt0. If the object does not have a COSE CBOR tag, the COSE message type is determined from the application context.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0062'
    object: 'validation step 4'
    field: 'the resulting COSE Header carries only understood and supported parameters, or ones specified as ignorable'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 4'
    text: 'Verify that the resulting COSE Header includes only parameters and values whose syntax and semantics are both understood and supported or that are specified as being ignored when not understood.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0063'
    object: 'validation step 5'
    field: 'the three protection cases'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 5'
    text: 'Depending upon whether the CWT is a signed, MACed, or encrypted, there are three cases:'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The source reads ''whether the CWT is a signed, MACed, or encrypted'' - a grammatical slip, quoted as printed. design-notes.md defect D-6.'
  - id: 'rfc-8392#R-0064'
    object: 'validation step 5, signed branch'
    field: 'follow RFC 8152 §4 and let the Message be the payload'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 5'
    text: '* If the CWT is a COSE_Sign/COSE_Sign1, follow the steps specified in Section 4 of [RFC8152] ("Signing Objects") for validating a COSE_Sign/COSE_Sign1 object. Let the Message be the COSE_Sign/COSE_Sign1 payload.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0065'
    object: 'validation step 5, MACed branch'
    field: 'follow RFC 8152 §6 and let the Message be the payload'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 5'
    text: '* Else, if the CWT is a COSE_Mac/COSE_Mac0, follow the steps specified in Section 6 of [RFC8152] ("MAC Objects") for validating a COSE_Mac/COSE_Mac0 object. Let the Message be the COSE_Mac/COSE_Mac0 payload.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0066'
    object: 'validation step 5, encrypted branch'
    field: 'follow RFC 8152 §5 and let the Message be the resulting plaintext'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 5'
    text: '* Else, if the CWT is a COSE_Encrypt/COSE_Encrypt0 object, follow the steps specified in Section 5 of [RFC8152] ("Encryption Objects") for validating a COSE_Encrypt/ COSE_Encrypt0 object. Let the Message be the resulting plaintext.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0067'
    object: 'validation step 6'
    field: 'the nesting loop: a Message that begins with a COSE CBOR tag is itself a CWT; re-enter at step 1'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 6'
    text: 'If the Message begins with a COSE CBOR tag, then the Message is a CWT that was the subject of nested signing, MACing, or encryption operations. In this case, return to Step 1, using the Message as the CWT.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The second loop. NOTE THE ASYMMETRY WITH §7.1 step 5: creation re-enters at step 3, validation at step 1, so validation re-checks the CBOR validity and the tag layers of every inner layer and creation does not re-create the claims set.'
  - id: 'rfc-8392#R-0068'
    object: 'validation step 7'
    field: 'the Message is a valid CBOR map, and that map IS the CWT Claims Set'
    verb: 'none'
    actor: 'recipient'
    locator: '§7.2 step 7'
    text: 'Verify that the Message is a valid CBOR map; let the CWT Claims Set be this CBOR map.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0069'
    object: 'CWT security'
    field: 'where the security comes from: entirely from COSE'
    verb: 'none'
    actor: 'reader'
    locator: '§8'
    text: 'The security of the CWT relies upon on the protections offered by COSE.'
    kind: inferred
    testable: 'no'
    status: active
    note: 'Quoted as printed, including the source''s own ''relies upon on''. design-notes.md defect D-5.'
  - id: 'rfc-8392#R-0070'
    object: 'unprotected claims'
    field: 'threat: an adversary can modify, add or remove claims'
    verb: 'none'
    actor: 'reader'
    locator: '§8'
    text: 'Unless the claims in a CWT are protected, an adversary can modify, add, or remove claims.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0071'
    object: 'the party that created the CWT'
    field: 'the recipient must be able to authenticate it, and the creator must evaluate each claim value before including it'
    verb: 'none'
    actor: 'recipient and producer'
    locator: '§8'
    text: 'Since the claims conveyed in a CWT may be used to make authorization decisions, it is not only important to protect the CWT in transit but also to ensure that the recipient can authenticate the party that assembled the claims and created the CWT. Without trust of the recipient in the party that created the CWT, no sensible authorization decision can be made. Furthermore, the creator of the CWT needs to carefully evaluate each claim value prior to including it in the CWT so that the recipient can be assured of the validity of the information provided.'
    kind: inferred
    testable: 'no'
    status: active
  - id: 'rfc-8392#R-0072'
    object: 'Nested CWT'
    field: 'operation order: sign then encrypt, to prevent signature stripping. LOWERCASE ''normally should'' - the strongest advice in the document binds nobody'
    verb: 'none'
    actor: 'producer'
    locator: '§8'
    text: 'Syntactically, the signing and encryption operations for Nested CWTs may be applied in any order; however, if both signing and encryption are necessary, producers normally should sign the message and then encrypt the result (thus encrypting the signature). This prevents attacks in which the signature is stripped, leaving just an encrypted message, as well as providing privacy for the signer. Furthermore, signatures over encrypted text are not considered valid in many jurisdictions.'
    kind: inferred
    testable: 'no'
    status: active
    note: 'Under §2''s ''when, and only when, they appear in all capitals'' this carries no normative force. The attack it names - stripping the signature to leave an encrypted message - is real.'
  - id: 'rfc-8392#R-0073'
    object: 'CWT Claims registry'
    field: 'the registry exists and IANA created it'
    verb: 'none'
    actor: 'IANA'
    locator: '§9.1'
    text: 'IANA has created the "CBOR Web Token (CWT) Claims" registry [IANA.CWT.Claims].'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0074'
    object: 'registration request'
    field: 'evaluation procedure: Designated Expert review after a three-week period on cwt-reg-review@ietf.org, with pre-publication allocation permitted'
    verb: 'none'
    actor: 'Designated Expert'
    locator: '§9.1'
    text: 'Registration requests are evaluated using the criteria described in the Claim Key instructions in the registration template below after a three-week review period on the cwt-reg-review@ietf.org mailing list, on the advice of one or more Designated Experts [RFC8126]. However, to allow for the allocation of values prior to publication, the Designated Experts may approve registration once they are satisfied that such a specification will be published.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0075'
    object: 'registration request'
    field: 'mailing-list subject convention and the 21-day escalation to the IESG'
    verb: 'none'
    actor: 'registrant'
    locator: '§9.1'
    text: 'Registration requests sent to the mailing list for review should use an appropriate subject (e.g., "Request to register claim: example"). Registration requests that are undetermined for a period longer than 21 days can be brought to the IESG''s attention (using the iesg@ietf.org mailing list) for resolution.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0076'
    object: 'registration request'
    field: 'the criteria: duplication, general applicability, clarity'
    verb: 'none'
    actor: 'Designated Expert'
    locator: '§9.1'
    text: 'Criteria that should be applied by the Designated Experts includes determining whether the proposed registration duplicates existing functionality, whether it is likely to be of general applicability or whether it is useful only for a single application, and whether the registration description is clear.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0077'
    object: 'claim keys -256..255 and strings of length 1'
    field: 'RESTRICTED TO CLAIMS WITH GENERAL APPLICABILITY - the cheap range is governed, not merely policied'
    verb: 'none'
    actor: 'Designated Expert'
    locator: '§9.1'
    text: 'Registrations for the limited set of values between -256 and 255 and strings of length 1 are to be restricted to claims with general applicability.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0078'
    object: 'IANA'
    field: 'may act only on Designated Expert instruction; lowercase ''must only accept'''
    verb: 'none'
    actor: 'IANA'
    locator: '§9.1'
    text: 'IANA must only accept registry updates from the Designated Experts and should direct all requests for registration to the review mailing list.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Lowercase. Not one of the document''s nine capitalised keywords is anywhere in §9.'
  - id: 'rfc-8392#R-0079'
    object: 'Designated Experts'
    field: 'composition: multiple experts representing different applications, with conflict-of-interest deferral'
    verb: 'none'
    actor: 'IESG'
    locator: '§9.1'
    text: 'It is suggested that multiple Designated Experts be appointed who are able to represent the perspectives of different applications using this specification in order to enable broadly informed review of registration decisions. In cases where a registration decision could be perceived as creating a conflict of interest for a particular Expert, that Expert should defer to the judgment of the other Experts.'
    kind: inferred
    testable: 'no'
    status: active
  - id: 'rfc-8392#R-0080'
    object: 'CWT Claims registry and JSON Web Token Claims registry'
    field: 'coordination: overlapping pools of Designated Experts would be useful'
    verb: 'none'
    actor: 'IESG'
    locator: '§9.1'
    text: 'Since a high degree of overlap is expected between the contents of the "CBOR Web Token (CWT) Claims" registry and the "JSON Web Token Claims" registry, overlap in the corresponding pools of Designated Experts would be useful to help ensure that an appropriate level of coordination between the registries is maintained.'
    kind: inferred
    testable: 'no'
    status: active
  - id: 'rfc-8392#R-0081'
    object: 'registration template'
    field: 'field: Claim Name'
    verb: 'none'
    actor: 'registrant'
    locator: '§9.1.1'
    text: 'Claim Name: The human-readable name requested (e.g., "iss").'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0082'
    object: 'registration template'
    field: 'field: Claim Description'
    verb: 'none'
    actor: 'registrant'
    locator: '§9.1.1'
    text: 'Claim Description: Brief description of the claim (e.g., "Issuer").'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0083'
    object: 'registration template'
    field: 'field: JWT Claim Name, including the N/A escape'
    verb: 'none'
    actor: 'registrant'
    locator: '§9.1.1'
    text: 'JWT Claim Name: Claim Name of the equivalent JWT claim, as registered in [IANA.JWT.Claims]. CWT claims should normally have a corresponding JWT claim. If a corresponding JWT claim would not make sense, the Designated Experts can choose to accept registrations for which the JWT Claim Name is listed as "N/A".'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0084'
    object: 'registration template'
    field: 'field: Claim Key, and that ranges carry DIFFERENT registration policies'
    verb: 'none'
    actor: 'registrant'
    locator: '§9.1.1'
    text: 'Claim Key: CBOR map key for the claim. Different ranges of values use different registration policies [RFC8126].'
    kind: inferred
    testable: 'yes'
    status: active
  - id: 'rfc-8392#R-0085'
    object: 'claim key range -256..255 and strings of length 1'
    field: 'allocation policy tier 1: Standards Action. CBOR cost 1-2 octets for an integer, 2 for a 1-character string'
    verb: 'none'
    actor: 'registrant'
    locator: '§9.1.1'
    text: 'Integer values from -256 to 255 and strings of length 1 are designated as Standards Action.'
    kind: inferred
    testable: 'yes'
    status: active
