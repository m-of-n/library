distillation:
  standard: "FX-1"
  # `profile: full` DECLARED by the cross-check pass on 2026-10-21, the third
  # and last of FX-1's passes. All eight artifact kinds are present and
  # `not_applicable` is EMPTY - this is the only record in the CWT envelope
  # lane that owes every kind, because it is the only one with a real protocol,
  # a real state machine and real test vectors. Read `passes` for what each
  # pass did; it is the normative record, not this comment.
  #
  # What `full` means here, and what it does not: the FX-1 ARTIFACT SET is
  # complete and every count the artifacts assert has been recomputed. It does
  # NOT mean a human has countersigned anything - `reviewed_by` is empty on all
  # eight artifacts, so pass 4 (human review) is outstanding and nothing may be
  # BUILT on these artifacts yet (docs/requirements.md). They may be read.
  #
  # One residue is stated rather than hidden: 3 of the 12 test vectors are the
  # Appendix A.2 COSE_Keys, and `distilled/schema/` holds no key schema to
  # validate them against. That is correct - RFC 8392 defines no key structure
  # and inventing RFC 9052's would breach FX-1 - so closure (d) is complete for
  # everything this document actually defines, and the gap is the source's.
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "37 verbatim regions covering every normative statement of §1-§9 plus Appendix A's four presentation rules, in source order, each an exact run of source lines with its line range and its own sha256 (the region's lines joined by \\n, no trailing newline). Includes §4's Table 1 whole, §6's Figure 1, §9.1.1's registration template and all five registry-contents blocks. FIVE HEADINGS ARE QUOTED AS TWO OR THREE ADJACENT REGIONS - §6, §7.1, §7.2, §9.1.2 (twice) and §9.3/§9.3.1 - because a page break falls inside the passage; all SIX breaks are declared in place (394-398, 450-454, 506-510, 674-678, 730-734, 786-790) and NOTHING IS WELDED ACROSS A GAP - pass 3 re-verified that no region contains a form-feed line, a running footer or a running header and that all 37 fenced blocks are byte-identical to their declared ranges. [correction 2026-10-21, pass 3 - cross-check] THIS SAID FOUR SECTIONS and named only §6, §7.1, §7.2 and §9.1.2, although normative.md's own body declares the fifth at its §9.3/§9.3.1 heading; and it described the source as having 25 FIVE-LINE page breaks, where 24 are five lines and the 25th is the document's last two lines (footer and form feed, no running header after it). The region machinery refuses a range that touches page decoration, so no fence here can contain a footer. Built with split(\"\\n\") and never splitlines(), which splits on the 25 form feeds and would shift every line number by up to 25. Also carries three observations about the document's normative shape: eight of the nine keywords delegate or forbid rather than require, the strongest security sentence in the document is lower case, and the only ordered content is two procedures that each loop"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "110 entries R-0001 to R-0110 in source order with no gaps: 9 stated, 101 inferred. source_keyword_count and extracted_keyword_count both 9 and AGREEING, with a 4.4 kB reconciliation written anyway because 110 entries against 9 keywords needs explaining. All 110 texts verified MECHANICALLY as contiguous substrings of the whitespace-normalised source, 0 failures, and a terminator check caught three hand-chosen spans that stopped mid-sentence. Where the nine are: §2 (tag-1 omission), §3 (ignore unknown claims), §5 (MUST NOT prefix a claim value with any CBOR tag), §6 (the tag-pairing rule), §7.1 step 3 (COSE Header validity), §7.1 step 4 x3 (all RFC 8152 steps MUST be followed, once per case), §7.2 (reject on any failure). NOT ONE is in §4, §8, §9 or Appendix A, and not one fixes a claim key, a value type or a mandatory claim. What was counted instead: each claim definition split into its type fact and its claim-key fact, all seven Table 1 data rows, every §9.1.1 template field with the four allocation tiers as four entries, all eight §9.1.2 registry entries, every numbered step of both procedures with §7.1 step 4's and §7.2 step 5's three bullets as three entries each, all four IANA registrations, §8's four security statements and Appendix A's four presentation rules. The §2 BCP 14 recital is deliberately NEVER quoted - bin/validate counts these texts with stripping off, so it would add 11 phantom keywords"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "1 verbatim file and 4 derived, plus a README. RFC 8392 SHIPS NO GRAMMAR OF ANY KIND - CDDL, ABNF, ASN.1, JSON Schema, schema and grammar each occur ZERO times in its 1403 lines, and `syntax` occurs once, in §7.2 step 4's validation rule. source-renderings.txt is therefore the only unmarked file and carries the four places the document renders a structure itself as 9 regions with per-region line ranges and digests: §4's Table 1, §6's Figure 1, §9.1.1's template and the five registry-contents blocks. Derived: cwt-claims-set.derived.cddl (the seven claims with keys and types, the reserved key 0, the open extension socket §3 requires, and the aud disagreement left visible rather than resolved); cwt-envelope.derived.cddl (§6's pairing rule, §7.2 step 3's untagged form, the §7.1/§7.2 nesting, with the COSE structures NAMED not redefined); cwt-claims-set.derived.schema.json with $id urn:library:rfc-8392:cwt-claims-set.derived, over a JSON projection that is OURS since RFC 8392 defines none; and claim-key-policy.derived.yaml, which is the artifact that earns its place - §9.1.1's four allocation tiers as data, each PRICED IN OCTETS from RFC 8949 §3 head encodings over the boundary values of every range. Header markers and filenames agree on all five files, checked as bin/validate reads them"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "5 structures and 23 fields with the actual code points and octet-level layouts: the CWT Claims Set, the tag-61 envelope, the six COSE envelope variants as Appendix A instantiates them, the three Appendix A COSE_Keys, and the Sig_structure / MAC_structure / Enc_structure that RFC 8392 never defines and whose contents decide the whole tag argument. EVERY LAYOUT WAS PRODUCED BY DECODING THE APPENDIX A HEX with a CBOR decoder written for this pass, not by reading the prose, and every octet count in the file is re-derived by the generator at write time and asserted, so a stale number cannot survive. `constrained_by` IS WIRED - 55 of the 110 requirements cited, 0 dangling - which this pass could do because one agent wrote both files; the 8 empty lists are a finding and every one belongs to RFC 9052 or RFC 9053. A `coverage` block names all 55 unwired requirements by locator with a reason for each, and the shape of that list is the point: only 55 of 110 requirements touch a byte"
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "APPLICABLE, and the only record in this lane for which it is. Three flows: §7.1's six creation steps, §7.2's seven validation steps and §9.1's claim-key registration procedure, each with its guards, its external dependencies on RFC 8152, its loop and its error paths, and 38 distinct requirement ids wired (40 citations) with 0 dangling - 10 in create-a-cwt, 12 in validate-a-cwt, 17 in register-a-claim-key, R-0046 shared. [correction 2026-10-21, pass 3 - cross-check] THIS SAID 24. It was true only of the reader: pass 1 measured it with the pre-fix bin/_yaml.py, which truncated this file's wrapped flow sequences and so could see only 24 of the 38. Pass 2 fixed the reader and the file and did not come back for the number. Recomputed with both readers, which now agree. protocol.md carries a Mermaid sequence diagram per flow, each drawn as ONE LANE with its external dependencies rather than as two parties pretending to converse, because the boundary was measured: `verifier`, `sender`, `receiver`, `exchange`, `handshake`, `negotiate` and `response` each occur ZERO times, `protocol` occurs once and names a transport that is somebody else's, and all 8 occurrences of `recipient` are in §8's prose or a figure caption. Every `message:` names a structure defined in messages.yaml. The `absent` list records seven things no diagram can show, of which the sharpest is that NOTHING IN RFC 8392 READS exp OR nbf, so a conformant validator accepts an expired CWT"
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "APPLICABLE and deliberately small. No lifecycle exists - `state`, `states`, `lifecycle`, `revoke`, `revocation`, `rotate`, `rotation`, `expire` and `expiry` each occur ZERO times, and all 4 occurrences of `expiration` name the exp CLAIM rather than an event - but §7.2 step 6 says \"return to Step 1\" and §7.1 step 5 says \"return to Step 3\", so there are two real unbounded loops and one terminal failure. Both machines are written out with states, guards, triggers and the 19 distinct requirements that constrain them (21 citations; 12 in cwt-validation, 8 in cwt-creation, R-0046 shared). [correction 2026-10-21, pass 3 - cross-check] THIS SAID 15, for the same reason the protocol count said 24: pass 1 counted through the pre-fix bin/_yaml.py, which lost this file's wrapped flow sequences, and pass 2's repair of the file was never carried back into this number. Recomputed with both readers. THE FINDING THE FILE EXISTS TO MAKE LEGIBLE: the two loops re-enter at DIFFERENT points, so validation re-runs both tag-stripping steps on every inner layer (an inner layer may legally carry its own tag 61) while creation never rebuilds the claims set; and the accept state is \"a valid CBOR map\", so no transition anywhere reads exp"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "12 vectors V-0001 to V-0012, covering all nine hex/diagnostic figure PAIRS the appendix prints - Figures 2 to 19, eighteen figures in nine pairs - plus three derived censuses. [corrected 2026-10-21, pass 3: this read 'all nine figures the appendix prints'; the appendix prints eighteen, in nine pairs, and Figure 1 is in §6.] THE HEADLINE: ALL FIVE OF THE DOCUMENT'S CWTs VERIFY CRYPTOGRAPHICALLY - A.3's ECDSA P-256 signature verifies over a 99-octet Sig_structure, A.4's and A.7's HMAC-256/64 tags reproduce exactly, A.5 and A.6 decrypt with valid AES-CCM-16-64-128 tags, and A.6's plaintext is the 175-octet A.3 object byte for byte with its inner signature verifying. A.2.3's private key was also checked to be THE private key for its printed public point (d*G == (x,y)) and that point to be on P-256. ECDSA, HMAC and AES-128-CCM were all IMPLEMENTED FOR THIS PASS over hashlib alone - no CBOR, COSE, CWT, EC or AES library was used - and the AES core was gated on FIPS 197 C.1 before use. Two derived censuses bear on DEC-002: four of the five printed CWTs carry a COSE tag and no tag 61 and NOT ONE IS UNTAGGED, so option 5's export form has no reference bytes; and all six CWT-side structures are in RFC 8949 §4.2.1 deterministic map order while ZERO of the three COSE_Keys are. The third census records three diagnostic-notation figures that do not parse. Every vector carries its section, its exact source line range and that region's sha256, and nothing computed is presented as printed"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "The DEC-003 decision this record forces, with the type evidence quoted verbatim: §2's StringOrURI is a CBOR text string, a COSE Key Thumbprint is a bare byte string, cti is the only bstr claim and §9.1.2 records its JWT name as jti - so the CWT envelope forces rfc-9679 §5.7's URN form and pins the hash in the wire format. The R-O-01 finding PROVED rather than argued. 5 adopts, 5 adaptations, 5 rejections. MD-3 MAPPED HEADER BY HEADER over 12 of our fields, each with its carrier, label, registry and option-5 verdict, plus the export mapping in one line and what we deliberately do not carry. THEN FIVE CUTS AGAINST MD-3, each naming the DEC-002 option it costs and the option that does not pay it: (1) the untagged export has no reference bytes, costs option 5, option 3 pays nothing; (2) option 5 trades one tag number for a governed namespace, costs option 5, options 1 and 3 are registry-free; (3) §5's escape hatch makes no-tags OUR decoder rule and it must cover future claim definitions; (4) the one claim shape the document chose to exhibit is a float64 that binary32 destroys, which costs every option and option 5 most cheaply - stated in option 5's favour; (5) option 5's type identity is (defining key, label) and nothing in CWT can express it. DEC-005 answered (no algorithm in any normative sentence, and the record's contribution is three verified algorithm witnesses instead). All six canonical-encoding conditions scored, with (6) named as the one that bites because iss is free-form text and `Unicode` occurs zero times. The summary's six findings tested one by one: three confirmed, two narrowed, one corrected. 8 source defects reported and never repaired, one of them NEW and uncovered by any erratum. 6 open questions. 27 quotations of RFC 8392, every one cut from the cache by line range by script and verified as a contiguous substring of the whitespace-normalised source; every quotation of a mofn document is marked UNVERIFIABLE FROM THIS REPOSITORY, following rfc-9741"
      reviewed_by: ""
  not_applicable: []
  passes:
    - pass: extract
      by: "claude-opus-5 (pass 1 of library#39 Tier 2, CWT envelope lane; single agent, whole artifact set, three records)"
      effort: max
      date: "2026-10-20"
      note: "Read only .cache/rfc-8392.txt - never summary.md and never another record's artifacts. EVERY VERBATIM BLOCK AND EVERY QUOTATION WAS LIFTED FROM THE CACHE BY LINE RANGE BY SCRIPT, never retyped, and verified mechanically rather than by eye: 110 of 110 requirement texts and 27 of 27 design-note quotations are contiguous substrings of the whitespace-normalised source, 0 failures; 37 normative.md regions and 9 schema regions carry their own sha256 over the region's lines joined by \\n with no trailing newline. Page decoration is structurally excluded - the region machinery refuses a range that touches one of the 25 five-line page breaks - so no fence can contain a running footer. THE CRYPTOGRAPHY WAS CLOSED IN THIS PASS rather than deferred: ECDSA P-256 verification, HMAC-SHA-256 and AES-128-CCM were implemented over hashlib alone with no CBOR, COSE, CWT, EC or AES library, the AES core was gated on FIPS 197 C.1 first, and all five Appendix A CWTs verify. Cross-artifact consistency was checked at write time: every requirement id cited by messages.yaml, protocol.yaml, state-machine.yaml and vectors.yaml resolves (0 dangling), every `message:` in a protocol flow names a structure in messages.yaml, and both of the library's YAML readers parse every file written here. TWO CLAIMS IN THIS RECORD'S OWN summary.md ARE NARROWED by the result and the falsified wording is recorded in place rather than edited away. [correction 2026-10-20, pass 2 - verify] THE CLAIM 'both of the library's YAML readers parse every file written here' WAS FALSE FOR THIS RECORD. bin/_record_yaml.py rejected distilled/protocol.yaml ('unexpected indent 9, wanted 0') and distilled/state-machine.yaml ('unexpected indent 5, wanted 0'), so two of the eight artifacts were unreadable by the reader bin/check-locators imports, and nothing reported it because bin/validate checks only that an artifact's PATH exists. Eight wrapped double-quoted sequence items and three unescaped inner double quotes were the cause; pass 2 fixed all of them and all 17 YAML artifacts in the lane now parse with both readers, 2918 leaf paths compared value by value with 0 key-set mismatches"
    - pass: verify
      by: "claude-opus-5 (pass 2 of 3, independent; did not extract; three records in one lane)"
      effort: max
      date: "2026-10-20"
      note: "THE HEADLINE RESULT IS INDEPENDENTLY REPRODUCED. All five Appendix A CWTs re-verified with a crypto stack written for pass 2 and sharing no code with pass 1's: SHA-256 from FIPS 180-4, HMAC from RFC 2104, AES-128 from FIPS 197 with the S-box derived from its GF(2^8) definition rather than tabulated, CCM from RFC 3610, P-256 and ECDSA from the curve equation, and a CBOR codec. 23 primitive gates pass first, including FIPS 180-4 B.1, RFC 4231 TC1/TC2, FIPS 197 C.1 and A.1, RFC 3610 packet vector #1 (an external CCM known-answer test pass 1 did not report using - FIPS 197 C.1 gates the block cipher but not the mode), RFC 8949 Appendix A, and two independent scalar-multiplication routines required to agree. 52 CWT checks run, 50 pass; the 2 'failures' are pass 2's own assertions written from Figure 7's diagnostic notation and they re-confirm defect D-1 from the hex side. Sig_structure, MAC_structure and Enc_structure were RE-DERIVED FROM records/ietf/rfc-9052's own cose.cddl and normative.md (sections 4.4, 6.3 and 5.3), NOT from this record's files, and the structure is printed beside every outcome because a wrong structure that still verifies is the failure mode. ELEVEN NEGATIVE CONTROLS were added and all eleven correctly FAIL: a 'Signature' context for 'Signature1', a wrongly included sign_protected field, external_aad and payload transposed, the unprotected map folded in as a fifth field, the payload signed bare, and the analogous wrong MAC_structures and Enc_structure AADs. So the A.3 result is not a false positive and the unprotected bucket is PROVABLY not a signature input, which is the mechanical proof of rfc-9597's headline. AES-CCM-16-64-128's parameters were re-derived from RFC 9053 section 4.2's own L/M prose and Table 6 rather than from the algorithm name: L=16 bits (2 octets), M=64 bits (8-octet tag), 13-byte nonce, 128-bit key - confirmed. 110 of 110 requirement texts re-verified verbatim; a tightened terminator check over all 110 found NO FOURTH OVER-RUN - the 3 remaining suspects are R-0022 (a declared deliberate overlap) and R-0101/R-0105 (complete IANA registry templates ending at their last field). All 110 locators verified under a STRICTER rule than bin/check-locators applies, comparing the INNERMOST containing section rather than allowing an ancestor: 0 misfiled, 0 imprecise, 0 unresolvable. All 37 normative.md regions and all 9 schema regions re-verified - digest AND printed block byte-identical to the cache. Source-line coverage computed for the whole body: the only uncovered lines are the section headings themselves, so no statement is dropped. The claim-key cost table was recomputed from RFC 8949 section 3 by encoding the boundary values; 10 of 11 cells confirmed and ONE CORRECTED - the Expert Review text row said '1 + length thereafter' without bound, but a text head is 1 octet only to length 23, so a 24-character key costs 26 and not 25. Keyword count re-derived: 9 = 9"
    - pass: cross-check
      by: "claude-opus-5 (pass 3 of 3, independent; did not extract and did not verify; plus a lane-wide quote and cross-record audit spanning rfc-8392, rfc-9596 and rfc-9597)"
      effort: max
      date: "2026-10-21"
      note: 'ALL FOUR FX-1 CLOSURES RUN EXHAUSTIVELY AND ALL FOUR PASS, and this is the only record in the lane where none of them is vacuous. (a) FIELDS: 110 requirements, 79 distinct `object` values, ALL 79 CLASSIFIED - 44 values / 65 requirements name a wire element, 35 / 45 are procedure, registry process or presentation rules; 98 anchor checks, 0 MISSING, each claim resolved THREE ways (as a claim, as a Table 1 row, as a registry entry) to both messages.yaml and the CDDL rules. (b) PROTOCOL: 3 flows, 16 steps, 13 carrying a message, 4 distinct names, all 4 defined; the 3 steps with no message are the register-a-claim-key email procedure, correctly absent rather than missing. (c) STATE MACHINE: 2 machines, 14 transitions, 14 triggers, 0 UNRESOLVED - 13 resolve to a named procedure step and 1 to the generic failure event; 0 undeclared from/to states, 0 unreachable. (d) EXAMPLES: 12 vectors, 9 carrying hex, ALL 9 DECODED with an independent RFC 8949 decoder gated on 17 Appendix A known answers - all 9 octet counts, all 9 region digests and all 9 hex strings re-cut from their declared line ranges agree; 6 structurally validated against a derived schema, 0 FAILURES. The two COSE_Encrypt0 forms were closed TRANSITIVELY without the key, by validating the envelope grammar and then the stated plaintexts. 17 DEFECTS FOUND AND FIXED ACROSS 10 FILES. THE PROPAGATION TARGET CONFIRMED, AND IT IS THE FIVE-FOR-SIX PATTERN AGAIN: pass 2 corrected the claim-key text-head bound and it had reached 3 of 6 sites - summary.md, design-notes.md and messages.yaml still carried an UNBOUNDED `1 + length`, which is wrong from length 24. Re-encoded rather than read, with a head encoder gated on 19 known answers: a 24-character key costs 26 octets (head 7818) and not 25, and `2 + length` holds to 255. Now 6 of 6. FOUR WRONG CROSS-VECTOR REFERENCES IN vectors.yaml, a class bin/check-id-joins CANNOT see because it resolves R-ids and not V-ids: V-0002 usable_for named V-0006/V-0007 for what are V-0007/V-0008 (ids one low, appendix labels right), and THREE NEW ONES naming V-0005/V-0008 as the MACed pair when it is V-0006/V-0009 - and NEITHER named vector is MACed at all, V-0005 being COSE_Sign1 with alg -7 and V-0008 COSE_Encrypt0 with alg 10, so the sentence was false of the pair it named. Proved by decoding: V-0006 and V-0009 are the only two vectors carrying COSE tag 17, the only two whose protected bucket is h-a10104, and the only two keyed on V-0003. TWO ASSERTED COUNTS WERE FOSSILS OF A READER BUG, which is the finding worth carrying out of this lane: record.yaml said 24 protocol ids wired (actual 38) and 15 state-machine requirements (actual 19). Proved by running the PASS-1-ERA bin/_yaml.py over the PASS-1 artifacts - it returns exactly 24 and 15, because it truncated those files wrapped flow sequences. Pass 2 fixed the reader and the artifacts and never carried the numbers back, so they were true measurements through a broken reader that fixing the reader silently falsified. bin/validate will never catch that class. Also corrected: FOUR adjacent-region sections where normative.md own body declares FIVE; 25 five-line page breaks where 24 are five lines and the 25th is the documents last two, there being no line 1404; nine figures where Appendix A prints 18 in nine PAIRS; and V-0012 naming five diagnostic renderings where its own locator, assertion and measured block all say nine. THE ESCAPE HAZARD STRUCK INSIDE THE SENTENCE ABOUT THE ESCAPE HAZARD, as it did in rfc-9682: R-0022 note held six and four raw apostrophes where both readers render three and two, so the note claimed a count it did not display, while distilled/README.md stated the pair correctly - the two-artifact disagreement hazards.md tells you to read as escape resolution rather than judgement. Rewritten via a script using chr(39), with both counts IN WORDS and no displayed token at all. A CONFLATION PRESENTED AS A QUOTATION, in protocol.yaml and state-machine.yaml identically: `for creating the object` occurs ZERO times in the source, each of the three bullets naming its own structure; replaced with the elided form the record already used in four other places. Verified unchanged: 110 requirements contiguous R-0001 to R-0110; keyword counts 9 = 9 = 9 landing in exactly the nine entries the reconciliation names; 37 normative regions digest-matched AND byte-identical to their ranges with 0 containing page decoration; 1403 newline-delimited lines and 25 form feeds; all 22 occurs-zero-times claims measured 0; 268 citations with 0 dangling and, all 67 sites read in context, 0 mis-joins; both readers parse all 7 YAML artifacts at 2054 leaf paths with identical key sets and 0 genuine value disagreements. The one duplicate-text group, R-0047 and R-0057, is cited from nowhere, so the one place a wrong id could still match the words is unexercised. bin/check-locators 110 of 110 contained; bin/validate 0 errors and no warning naming this record.'
