bears_on:
  # Widened 2026-10-20 by the FX-1 extraction (pass 1). Each addition is
  # evidenced in distilled/design-notes.md, not assumed:
  #   DEC-002 — five named cuts, each naming the option it costs. The hardest:
  #     option 5 trades the CBOR Tags registry (one number) for the CWT Claims
  #     registry (a governed namespace with four allocation tiers, a mailing
  #     list and a 21-day escalation path), and the only policy-free range
  #     costs 5 octets against 1 for the cheapest. This is the cost
  #     rfc-9052's design notes deferred by name to this record.
  #   R-M-12 — requires an extension point to be a (key, local label) pair.
  #     A CWT claim key is a flat global integer or text label with no key
  #     component, and §3's ignore-the-unknown rule makes a Private Use
  #     collision SILENT.
  #   R-O-01 — "Every signed object SHALL have an issuer key that can be
  #     specified as KeyId." PROVED in this pass rather than argued: the
  #     document's only signed CWT carries kid in the UNPROTECTED bucket, and
  #     A.3's signature verifies from Sig_structure's four fields alone, so the
  #     key identifier is provably not an input.
  #   R-O-03 — no canonicalization is cited because RFC 8392 defines none
  #     (`canonical` and `deterministic` occur zero times), which is a trap
  #     rather than a violation; and putting a KeyId in `cti` would be the
  #     silent reinterpretation R-O-03 exists to prevent.
  #   R-O-05 — the §7.2 validation path never re-encodes, so it is R-O-05
  #     compatible BY SILENCE. Recorded because silence is permission, not a
  #     rule.
  - DEC-002
  - DEC-003
  - DEC-005
  - R-M-12
  - R-O-01
  - R-O-03
  - R-O-05
