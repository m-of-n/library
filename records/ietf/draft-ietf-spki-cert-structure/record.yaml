usefulness:
  verdict: useful
  reason: "The only place SPKI's to-be-signed construction is written down. Answers R-0006's two SPKI ∅ cells: the signed bytes are the canonical S-expression of the whole (cert ...) object, carried beside a detached (signature (hash ...) principal sig-val); every cert field incl. display/comment is inside the hash, the signature object and sequence are not. -06 §3.1 also makes canonical form the transmitted form, which is RFC 2692's 'signed exactly as it is transmitted' kept rather than reversed."
  assessed: "2026-10-23"
