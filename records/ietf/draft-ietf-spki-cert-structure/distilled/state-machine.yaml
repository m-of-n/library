  - id: "SM-06"
    name: "instrument-series"
    title: "The responder's series of CRLs, deltas and revals"
    locator: "§7, §7.1, §7.2"
    owner: "online-test-responder"
    renders_flow: "F-11"
    initial: "instrument-current"
    states:
      - name: "instrument-current"
        kind: "stated"
        role: "initial"
        description: "A full CRL or a reval is current for its interval."
      - name: "interval-ended"
        kind: "stated"
        role: "intermediate"
        description: "Its interval has passed."
      - name: "delta-current"
        kind: "stated"
        role: "intermediate"
        description: "A delta-CRL naming its predecessor by hash is current."
    transitions:
      - id: "SM-06-T01"
        from: "instrument-current"
        to: "interval-ended"
        trigger: "interval-ended"
        guard: "none"
        actions: "none"
        kind: "stated"
        quotes:
          - at: "§7"
            source_lines: "1908-1910"
            quote: |-
              The instrument is valid only during that interval and a sequence of instruments must be issued for non-overlapping intervals, so that the user of the instrument knows when it has the current one.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0269"
          - "draft-ietf-spki-cert-structure#R-0270"
        protocol_steps:
          - "F-11 1"
