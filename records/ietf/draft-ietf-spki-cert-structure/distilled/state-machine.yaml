note: >-
  The verifier-side processing of the draft as machines a test harness can drive, plus the two
  machines the online-test responder runs. SM-01 reads a <sequence>; SM-02 checks one <signature>;
  SM-03 takes one certificate from read to 5-tuple; SM-04 checks a CRL, delta-CRL or reval against
  one certificate's test; SM-05 is the one-time revalidation; SM-06 and SM-15 are the responder's
  series of instruments and a certificate's standing in them; SM-07 is name reduction; SM-08 is one
  application of the top-level rule of §8.2, modelled exactly as written (its four conditions are
  the guards, quoted in guard_source); SM-09 repeats it; SM-10 is tag intersection by the rules of
  §8.2 and §8.3; SM-11 is validity intersection; SM-12 the threshold reduction of §8.4; SM-13 an ACL
  entry; SM-14 a certificate result certificate. The draft defines no issuer lifecycle beyond
  writing and signing, which protocol.yaml models as flows (F-03, F-04), and no prover lifecycle at
  all.
conventions:
  fields: >-
    Each state has kind (stated or inferred, inferred carrying inferred_reason) and role (initial,
    intermediate, terminal, error, error-terminal); error_states and terminal_states repeat them per
    machine. Each transition has a trigger, which is a draft object by its exact name in angle
    brackets (kind message in triggers_used) or a named event defined in triggers_used;
    also_triggers lists further objects that fire the same transition. completion is the UML
    completion event. guard and actions are this file's wording; where the source states the guard,
    guard_source quotes it. quotes carry the source text the transition rests on. protocol_steps
    names the protocol.yaml steps (flow id and step n) the transition renders, and renders_flow the
    flow a machine renders.
  quoting: >-
    As protocol.yaml: every quotation is {at, source_lines, quote}, cut by script from the .txt and
    verified by bin/check-quotes; no quotation crosses a page break, and prose carries no double
    quote mark.
  basis: >-
    A transition is stated when the source states both the step and its outcome; inferred when the
    source states the input, the check or the duty and this file supplies the transition, with
    inferred_reason saying which part. Error outcomes the source never names are inferred error
    states, so that a harness can tell a stated failure from a reading.
  constrained_by: >-
    As protocol.yaml: requirement ids joined by script on overlapping lines and contained text; see
    requirements_join.
