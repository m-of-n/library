          - "draft-ietf-spki-cert-structure#R-0276"
          - "draft-ietf-spki-cert-structure#R-0280"
        protocol_steps:
          - "F-07 1"
          - "F-07 2"
      - id: "SM-06-T04"
        from: "delta-current"
        to: "delta-current"
        trigger: "delta-chosen"
        guard: "none"
        actions: "Issue a delta naming the current delta by hash."
        kind: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "1925-1926"
            quote: |-
              The <hash-of-pred> is the hash of the predecessor CRL or delta-CRL, that this one is modifying.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0276"
        protocol_steps:
          - "F-07 2"
      - id: "SM-06-T05"
        from: "delta-current"
        to: "instrument-current"
        trigger: "full-crl-chosen"
        guard: "none"
