  - id: "SM-12"
    name: "threshold-reduction"
    title: "Reducing a k-of-n subject"
    locator: "§2, §4.5.3, §8.4"
    owner: "verifier"
    renders_flow: "F-20"
    initial: "threshold"
    states:
      - name: "threshold"
        kind: "stated"
        role: "initial"
        description: "A 5-tuple has a k-of-n subject."
      - name: "copies-made"
        kind: "stated"
        role: "intermediate"
        description: "Copies exist, each marked with one subject."
      - name: "copies-reducing"
        kind: "stated"
        role: "intermediate"
        description: "Each copy reduces on its own."
      - name: "converged"
        kind: "stated"
        role: "intermediate"
        description: "K copies have the same subject."
      - name: "merged"
        kind: "stated"
        role: "terminal"
        description: "The K copies are a single 5-tuple."
      - name: "insufficient"
        kind: "stated"
        role: "error-terminal"
        description: "Fewer than K paths; nothing delegated."
    transitions:
      - id: "SM-12-T01"
        from: "threshold"
        to: "copies-made"
        trigger: "completion"
        guard: "none"
        actions: "Make copies, each marked with the listed subject it handles."
        kind: "stated"
        quotes:
          - at: "§8.4"
            source_lines: "2129-2131"
            quote: |-
              One general procedure is to make K copies of of the 5-tuple containing the K-of-N subject and indicate which of those subjects is being handled by that copy.
          - at: "§4.5.3"
            source_lines: "1287"
            quote: |-
              <subj-thresh>:: "(" "k-of-n" <k-val> <n-val> <subj-obj>* ")" ;
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0142"
          - "draft-ietf-spki-cert-structure#R-0333"
        protocol_steps:
          - "F-20 1"
        note: "K copies or N (D-13)."
      - id: "SM-12-T02"
        from: "copies-made"
        to: "copies-reducing"
        trigger: "completion"
        guard: "none"
        actions: "Reduce each copy on its own."
        kind: "stated"
        quotes:
          - at: "§8.4"
            source_lines: "2131-2132"
            quote: |-
              One then reduces that copy as if it had a single subject.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0334"
        protocol_steps:
          - "F-20 2"
      - id: "SM-12-T03"
        from: "copies-reducing"
        to: "converged"
        trigger: "reduction-step"
        guard: "K reduced copies have the same subject"
        actions: "Stop the separate reductions."
        kind: "stated"
        quotes:
          - at: "§8.4"
            source_lines: "2132-2133"
            quote: |-
              One can stop the separate reductions when all K of the reduced values have the same subject.
          - at: "§4.5.3"
            source_lines: "1306-1308"
            quote: |-
              Only if at least K of the N subjects show certificate paths which converge on a single target Subject during reduction, is that permission
          - at: "§4.5.3"
            source_lines: "1316"
            quote: |-
              transmitted to the target.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0147"
          - "draft-ietf-spki-cert-structure#R-0150"
          - "draft-ietf-spki-cert-structure#R-0335"
          - "draft-ietf-spki-cert-structure#R-0404"
        protocol_steps:
          - "F-20 3"
      - id: "SM-12-T04"
        from: "converged"
        to: "merged"
        trigger: "completion"
        guard: "none"
        actions: "Make the K copies a single 5-tuple."
        kind: "stated"
        quotes:
          - at: "§8.4"
            source_lines: "2133-2134"
            quote: |-
              At that point, the K reduced 5-tuples become a single 5-tuple.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0335"
          - "draft-ietf-spki-cert-structure#R-0435"
        protocol_steps:
          - "F-20 3"
          - "F-20 5"
        note: "Its fields are not stated (D-28)."
      - id: "SM-12-T05"
        from: "copies-reducing"
        to: "insufficient"
        trigger: "completion"
        guard: "no copy reduces further and fewer than K converge"
        actions: "none"
        kind: "stated"
        quotes:
          - at: "§4.5.3"
            source_lines: "1316-1317"
            quote: |-
              If fewer than K such paths can be shown, then the permission is not delegated.
          - at: "§4.5.3"
            source_lines: "1304-1306"
            quote: |-
              A certificate or ACL with a k-of-n Subject does not delegate permission to any of those subjects, alone. Rather, each of these subjects receives a share of the delegated permission.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0148"
          - "draft-ietf-spki-cert-structure#R-0149"
          - "draft-ietf-spki-cert-structure#R-0151"
        protocol_steps:
          - "F-20 4"
    error_states:
      - "insufficient"
    terminal_states:
      - "merged"
      - "insufficient"
    unspecified:
      - id: "SM-12-U1"
        text: "Which K copies (D-13)."
      - id: "SM-12-U2"
        text: "The merged tuple's fields (D-28)."
      - id: "SM-12-U3"
        text: "K < N against example 4 (D-12)."
