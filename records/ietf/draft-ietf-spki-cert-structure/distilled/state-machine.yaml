machines:
  - id: "SM-01"
    name: "sequence-reader"
    title: "Reading a <sequence>: holding items, hashing, signatures"
    locator: "§3.8.3, §6.2, §9.2"
    owner: "verifier"
    renders_flow: "F-12"
    initial: "idle"
    states:
      - name: "idle"
        kind: "inferred"
        role: "initial"
        description: "No sequence is being read."
        inferred_reason: "A start state is needed to receive the sequence; the source names none."
      - name: "reading"
        kind: "stated"
        role: "intermediate"
        description: "Entries are read in order; nothing is held."
      - name: "item-held"
        kind: "inferred"
        role: "intermediate"
        description: >-
          An object has been read and is the item last read, the operand of a hash opcode or a
          signature.
        inferred_reason: >-
          The source names the item last read as that operand; holding it is the least that allows
          either.
      - name: "signature-pending"
        kind: "stated"
        role: "intermediate"
        description: "A <signature> has called for the hash of the held item; SM-02 is checking it."
      - name: "sequence-read"
        kind: "stated"
        role: "terminal"
        description: "The last entry has been read; the certificates go to reduction (SM-09)."
      - name: "unknown-op"
        kind: "inferred"
        role: "error"
        description: "An opcode other than hash was read."
        inferred_reason: "Only hash is defined; what an unknown opcode does is not said."
      - name: "nothing-to-hash"
        kind: "inferred"
        role: "error"
        description: "A hash opcode or a signature arrived with no item held."
        inferred_reason: "The source assumes a preceding item and never says what happens without one."
    transitions:
      - id: "SM-01-T01"
        from: "idle"
        to: "reading"
        trigger: "<sequence>"
        guard: "none"
        actions: "Start at the first entry."
        kind: "stated"
        quotes:
          - at: "§6.2"
            source_lines: "1841-1842"
            quote: |-
              A <sequence> is an ordered sequence of objects that the verifier is to consider when deciding to grant access.
          - at: "§6.2"
            source_lines: "1831"
            quote: |-
              <sequence>:: "(" "sequence" <seq-ent>* ")" ;
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0248"
          - "draft-ietf-spki-cert-structure#R-0254"
        protocol_steps:
          - "F-12 1"
      - id: "SM-01-T02"
        from: "reading"
        to: "item-held"
        trigger: "<cert>"
        also_triggers:
          - "<name-cert>"
          - "<pub-key>"
          - "<crl>"
          - "<delta-crl>"
          - "<reval>"
        guard: "none"
        actions: "Hold the object as the item last read."
        kind: "inferred"
        inferred_reason: "§6.2 names the item last read as the operand; the act of holding it is this file's."
        quotes:
          - at: "§6.2"
            source_lines: "1848-1851"
            quote: |-
              At present the only opcode defined is "hash" -- meaning, that the previous item in the sequence (the last one read in) is to be hashed by the given algorithm and saved, indexed by that hash value.
          - at: "§6.2"
            source_lines: "1832-1833"
            quote: |-
              <seq-ent>:: <cert> | <pub-key> | <signature> | <crl> | <delta-crl> | <reval> | <op> ;
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0249"
          - "draft-ietf-spki-cert-structure#R-0257"
          - "draft-ietf-spki-cert-structure#R-0369"
          - "draft-ietf-spki-cert-structure#R-0419"
        protocol_steps:
          - "F-12 2"
        note: "§9.2 admits <name-cert> in a sequence, §6.2 does not (D-01)."
      - id: "SM-01-T03"
        from: "item-held"
        to: "item-held"
        trigger: "<cert>"
        also_triggers:
          - "<name-cert>"
          - "<pub-key>"
          - "<crl>"
          - "<delta-crl>"
          - "<reval>"
        guard: "none"
        actions: "Replace the held item with the new object."
        kind: "inferred"
        inferred_reason: "Follows from the item last read being the operand."
        quotes:
          - at: "§6.2"
            source_lines: "1848-1851"
            quote: |-
