  - id: "SM-02"
    name: "signature-check"
    title: "Checking one <signature> over the item before it"
    locator: "§2, §3.1, §3.5, §3.8, §3.8.1, §3.8.2, §3.8.3, §3.8.3.1, §4.3, §5.1, §6.2"
    owner: "verifier"
    renders_flow: "F-13"
    initial: "received"
    states:
      - name: "received"
        kind: "stated"
        role: "initial"
        description: "A signature has been read after an item."
      - name: "hashed"
        kind: "stated"
        role: "intermediate"
        description: "The canonical bytes of the item have been hashed."
      - name: "hash-matched"
        kind: "inferred"
        role: "intermediate"
        description: "The hash equals the signature's hash value."
        inferred_reason: "The comparison is implied, never written."
      - name: "key-resolved"
        kind: "inferred"
        role: "intermediate"
        description: "The signing principal's public key is in hand."
        inferred_reason: "Resolving a hash of a key is implied by the alternative of §4.3."
      - name: "value-verified"
        kind: "inferred"
        role: "intermediate"
        description: "The signature value verifies under that key."
        inferred_reason: "The verification itself is not described beyond its parameters."
      - name: "accepted"
        kind: "stated"
        role: "terminal"
        description: "The item is a statement made by the principal."
      - name: "hash-mismatch"
        kind: "inferred"
        role: "error"
        description: "The hashes differ."
        inferred_reason: "Consequence not stated."
      - name: "key-unresolved"
        kind: "inferred"
        role: "error"
        description: "A hash of a key resolves to no key."
        inferred_reason: "Consequence not stated."
      - name: "algorithm-unsupported"
        kind: "inferred"
        role: "error"
        description: "The key or hash algorithm is unknown (including elliptic-curve DSA)."
        inferred_reason: "Consequence not stated."
      - name: "value-invalid"
        kind: "inferred"
        role: "error"
        description: "The signature value does not verify."
        inferred_reason: "Consequence not stated."
      - name: "signer-not-issuer"
        kind: "inferred"
        role: "error"
        description: "The item is a certificate whose issuer is not the signing principal."
        inferred_reason: "The check is this file's reading of §2 ISSUER."
    transitions:
      - id: "SM-02-T01"
        from: "received"
        to: "hashed"
        trigger: "<signature>"
        guard: "none"
        actions: >-
          Hash the canonical bytes of the item as received, with the algorithm named in the
          signature's <hash>.
        kind: "stated"
        quotes:
          - at: "§3.1"
            source_lines: "553-555"
            quote: |-
              The canonical form is a unique representation of an S-expression and is used as the input to all hash and signature functions.
          - at: "§3.5"
            source_lines: "675-678"
            quote: |-
              The canonical S-expression is the form which is hashed for both generating and verifying signatures. These two processes can be thought of as the start and end of an SPKI object's useful life and both require canonical form.
          - at: "§6.2"
            source_lines: "1854-1855"
            quote: |-
              At this time, we assume that <signature> does double duty, calling for the hash of the preceding item.
          - at: "§3.8.3"
            source_lines: "1014"
            quote: |-
              <signature>:: "(" "signature" <hash> <principal> <sig-val> ")" ;
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0039"
          - "draft-ietf-spki-cert-structure#R-0040"
          - "draft-ietf-spki-cert-structure#R-0064"
          - "draft-ietf-spki-cert-structure#R-0101"
          - "draft-ietf-spki-cert-structure#R-0259"
          - "draft-ietf-spki-cert-structure#R-0392"
          - "draft-ietf-spki-cert-structure#R-0402"
        protocol_steps:
          - "F-13 1"
        note: >-
          As received, because a re-serialised certificate need not reproduce the signed bytes
          (D-19).
      - id: "SM-02-T02"
        from: "hashed"
        to: "hash-matched"
        trigger: "completion"
        guard: "the computed hash equals the signature's hash value"
        actions: "none"
        kind: "inferred"
        inferred_reason: "The equality test is not written."
        quotes:
          - at: "§3.8.2"
            source_lines: "1001"
            quote: |-
              A <hash> object gives the hash of some other object.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0100"
          - "draft-ietf-spki-cert-structure#R-0397"
          - "draft-ietf-spki-cert-structure#R-0420"
        protocol_steps:
          - "F-13 2"
      - id: "SM-02-T03"
        from: "hashed"
        to: "hash-mismatch"
        trigger: "completion"
        guard: "the hashes differ"
        actions: "Stop."
        kind: "inferred"
        inferred_reason: "As SM-02-T02."
        quotes:
          - at: "§3.8.2"
            source_lines: "1001"
            quote: |-
              A <hash> object gives the hash of some other object.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0100"
          - "draft-ietf-spki-cert-structure#R-0397"
          - "draft-ietf-spki-cert-structure#R-0420"
        protocol_steps:
          - "F-13 2"
      - id: "SM-02-T04"
        from: "hash-matched"
        to: "key-resolved"
        trigger: "completion"
        guard: >-
          the principal is a public key, or a hash of a key found in the sequence's index or
          elsewhere
        actions: "Take that key."
        kind: "inferred"
        inferred_reason: "§4.3 allows either form; finding the key is implied."
        quotes:
          - at: "§4.3"
            source_lines: "1206"
            quote: |-
              <principal>:: <pub-key> | <hash-of-key> ;
          - at: "§6.2"
            source_lines: "1851-1852"
            quote: |-
              Presumably, that item (certificate body or public key, for example) is referred to by hash in some subsequent object.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0125"
          - "draft-ietf-spki-cert-structure#R-0258"
          - "draft-ietf-spki-cert-structure#R-0396"
          - "draft-ietf-spki-cert-structure#R-0418"
        protocol_steps:
          - "F-13 3"
      - id: "SM-02-T05"
        from: "hash-matched"
        to: "key-unresolved"
        trigger: "completion"
        guard: "the principal is a hash that resolves to no key"
        actions: "Stop."
        kind: "inferred"
        inferred_reason: "Consequence not stated."
        quotes:
          - at: "§4.3"
            source_lines: "1208-1210"
            quote: |-
              <hash-of-key> might be the preferred <principal>, not merely for size but also in case one is using small RSA keys and protecting them from cryptanalysis by keeping them secret.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0126"
          - "draft-ietf-spki-cert-structure#R-0418"
        protocol_steps:
          - "F-13 3"
      - id: "SM-02-T06"
        from: "key-resolved"
        to: "algorithm-unsupported"
        trigger: "completion"
        guard: "the key's algorithm is not one the verifier implements, or has no defined format"
        actions: "Stop."
        kind: "inferred"
        inferred_reason: "Consequence not stated; algorithm names are case sensitive."
        quotes:
          - at: "§3.8.3.1"
            source_lines: "1045-1046"
            quote: |-
              For other algorithms, the signature parameter structure will have to be defined when the algorithm is defined.
          - at: "§3.8.1.3"
            source_lines: "989-991"
            quote: |-
              Invent a scheme here and pass it by Certicom and Burt -- to define S-expressions for field element, compressed EC point, basis choice, EC curve, .... Show S-expressions for curve over both fields.
          - at: "§3.8"
            source_lines: "761-762"
            quote: |-
              SPKI/SDSI is case-sensitive, so the byte-string "RSA" is not the same as "rsa".
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0078"
          - "draft-ietf-spki-cert-structure#R-0093"
          - "draft-ietf-spki-cert-structure#R-0109"
          - "draft-ietf-spki-cert-structure#R-0397"
          - "draft-ietf-spki-cert-structure#R-0459"
        protocol_steps:
          - "F-13 4"
      - id: "SM-02-T07"
        from: "key-resolved"
        to: "value-verified"
        trigger: "completion"
        guard: "the signature value verifies under the key (one integer for RSA, r and s for DSA)"
        actions: "none"
        kind: "inferred"
        inferred_reason: "The parameters are stated; the verification procedure is not."
        quotes:
          - at: "§3.8.3.1"
            source_lines: "1036-1037"
            quote: |-
              <sig-params> depends on the <pub-sig-alg-id>, the verification algorithm of the public key being used to verify this signature.
          - at: "§3.8.3.1"
            source_lines: "1039"
            quote: |-
              For the RSA algorithm, <sig-params> is a single <integer>.
          - at: "§3.8.3.1"
            source_lines: "1041"
            quote: |-
              For DSA, <sig-params> is two S-expressions:
          - at: "§3.8.1"
            source_lines: "791-792"
            quote: |-
              A public key definition gives everything the user needs to employ the key for checking signatures.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0091"
          - "draft-ietf-spki-cert-structure#R-0106"
          - "draft-ietf-spki-cert-structure#R-0107"
          - "draft-ietf-spki-cert-structure#R-0108"
          - "draft-ietf-spki-cert-structure#R-0397"
          - "draft-ietf-spki-cert-structure#R-0398"
          - "draft-ietf-spki-cert-structure#R-0399"
        protocol_steps:
          - "F-13 4"
      - id: "SM-02-T08"
        from: "key-resolved"
        to: "value-invalid"
        trigger: "completion"
        guard: "the signature value does not verify"
        actions: "Stop."
        kind: "inferred"
        inferred_reason: "Consequence not stated."
        quotes:
          - at: "§3.8.3.1"
            source_lines: "1036-1037"
            quote: |-
              <sig-params> depends on the <pub-sig-alg-id>, the verification algorithm of the public key being used to verify this signature.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0106"
          - "draft-ietf-spki-cert-structure#R-0397"
        protocol_steps:
          - "F-13 4"
      - id: "SM-02-T09"
        from: "value-verified"
        to: "accepted"
