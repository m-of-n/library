        quotes:
          - at: "§4.9.3"
            source_lines: "1533-1536"
            quote: |-
              That one-time test must include a nonce provided by the verifier, to prevent replay attacks, but it will probably also include transaction data (such as an amount of money being debited from a bank account) and therefore be
          - at: "§7"
            source_lines: "1901-1902"
            quote: |-
              A one-time test result must contain a nonce generated by the verifier.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0201"
          - "draft-ietf-spki-cert-structure#R-0265"
          - "draft-ietf-spki-cert-structure#R-0409"
        protocol_steps:
          - "F-09 4"
      - id: "SM-05-T07"
        from: "reply-received"
        to: "wrong-certificate"
        trigger: "completion"
        guard: "(cert <hash>) does not name the certificate in question"
        actions: "none"
        kind: "inferred"
        inferred_reason: "The comparison is not written."
        quotes:
          - at: "§7.3"
            source_lines: "1973"
            quote: |-
              <reval>:: "(" "reval" <version>? <subj-hash> <one-valid> ")" ;
          - at: "§9.2"
            source_lines: "2348"
            quote: |-
              <subj-hash>:: "(" "cert" <hash> ")" ;
        constrained_by:
