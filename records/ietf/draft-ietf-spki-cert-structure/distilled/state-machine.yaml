              This reply should be signed by the <principal> indicated in the (online..) field which directed it to be fetched.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0291"
          - "draft-ietf-spki-cert-structure#R-0409"
        protocol_steps:
