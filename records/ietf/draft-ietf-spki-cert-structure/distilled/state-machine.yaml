            source_lines: "2070-2071"
            quote: |-
              "now" intersects with any date range to yield either "now" or "null".
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0316"
          - "draft-ietf-spki-cert-structure#R-0427"
        protocol_steps:
