        kind: "stated"
        quotes:
          - at: "§7"
            source_lines: "1908-1910"
            quote: |-
              The instrument is valid only during that interval and a sequence of instruments must be issued for non-overlapping intervals, so that the user of the instrument knows when it has the current one.
          - at: "§7"
            source_lines: "1907"
            quote: |-
              Each of these instruments contains a <valid-basic> time interval.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0267"
          - "draft-ietf-spki-cert-structure#R-0269"
          - "draft-ietf-spki-cert-structure#R-0270"
        protocol_steps:
          - "F-11 1"
      - id: "SM-06-T03"
        from: "instrument-current"
        to: "delta-current"
        trigger: "delta-chosen"
        guard: "the current instrument is a CRL"
        actions: "Issue a delta-CRL naming it by hash."
        kind: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "1916-1917"
            quote: |-
              If one wants to provide CRLs, and that CRL grows, then one may prefer to send only a delta CRL.
          - at: "§7.1"
            source_lines: "1925-1926"
            quote: |-
              The <hash-of-pred> is the hash of the predecessor CRL or delta-CRL, that this one is modifying.
          - at: "§7.1"
            source_lines: "1943-1944"
            quote: |-
