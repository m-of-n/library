  - id: "SM-05"
    name: "one-time-revalidation"
    title: "The verifier's one-time revalidation, nonce to `now`"
    locator: "§4.9.2, §4.9.3, §7, §7.3, §8.2, §9.2"
    owner: "verifier"
    renders_flow: "F-09"
    initial: "idle"
    states:
      - name: "idle"
