        quotes:
          - at: "§7.1"
            source_lines: "1943-1944"
            quote: |-
              The algorithm for choosing between computation and delivery of delta versus full CRL is left open.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0280"
        protocol_steps:
          - "F-11 4"
    error_states: []
    terminal_states: []
    unspecified:
      - id: "SM-06-U1"
        text: >-
          Whether deltas also follow the non-overlapping rule, and how their intervals relate to
          their predecessors'.
      - id: "SM-06-U2"
        text: "One-time replies are issued per request and are not part of the series."
  - id: "SM-07"
    name: "name-reduction"
    title: "Reducing a name to a principal"
    locator: "§5.1, §5.2, §5.3"
    owner: "verifier"
    renders_flow: "F-17"
    initial: "name"
    states:
      - name: "name"
        kind: "stated"
        role: "initial"
