  - id: "SM-03"
    name: "certificate-acceptance"
    title: "One certificate from read to 5-tuple: version, signature, dates, online tests"
    locator: "§2, §4.1, §4.2, §4.9, §4.9.1, §4.9.2, §4.10, §8.1, §3.8.3"
    owner: "verifier"
    renders_flow: "F-14"
    initial: "read"
    states:
      - name: "read"
        kind: "stated"
        role: "initial"
        description: "A <cert> or <name-cert> has been read from the sequence."
      - name: "ignored"
        kind: "stated"
        role: "error-terminal"
        description: "Its version is not recognised; it is ignored."
      - name: "version-ok"
        kind: "stated"
        role: "intermediate"
        description: "No version (version 0) or a recognised one."
      - name: "signed"
        kind: "inferred"
        role: "intermediate"
        description: "A signature over it has been accepted (SM-02)."
        inferred_reason: "A certificate is a signed instrument; no step says the verifier requires the signature."
      - name: "unsigned"
        kind: "inferred"
        role: "error"
        description: "The sequence ended without an accepted signature for it."
        inferred_reason: "Consequence not stated."
      - name: "in-date"
        kind: "stated"
        role: "intermediate"
        description: "The present lies inside its dates."
      - name: "out-of-date"
        kind: "stated"
        role: "error"
        description: "The present lies outside its dates."
      - name: "expired-renewable"
        kind: "stated"
        role: "intermediate"
        description: "It is past not-after and carries a new-cert test."
      - name: "tests-pending"
        kind: "stated"
        role: "intermediate"
        description: "One or more online tests are still to succeed."
      - name: "valid"
        kind: "stated"
        role: "intermediate"
        description: "Dates and all online tests hold."
      - name: "test-failed"
        kind: "stated"
        role: "error"
        description: "An online test did not succeed."
      - name: "tuple-formed"
        kind: "inferred"
        role: "terminal"
        description: "Its 5-tuple (or 4-tuple) is formed."
        inferred_reason: "The field mapping is this file's (F-15 step 3)."
    transitions:
      - id: "SM-03-T01"
        from: "read"
        to: "ignored"
        trigger: "completion"
        guard: "its version is not recognised"
        actions: "Ignore it."
        kind: "stated"
        quotes:
          - at: "§4.1"
            source_lines: "1176-1177"
            quote: |-
              A certificate containing an unrecognized version number must be ignored.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0118"
          - "draft-ietf-spki-cert-structure#R-0400"
          - "draft-ietf-spki-cert-structure#R-0401"
        protocol_steps:
          - "F-15 1"
        note: "Version 0 as a quoted string against the integer 0x00 (D-16, E-02)."
