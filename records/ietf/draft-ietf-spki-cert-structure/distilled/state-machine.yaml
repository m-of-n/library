  - id: "SM-11"
    name: "validity-intersection"
    title: "Intersecting two validities, v1 and v2"
    locator: "§8.1, §8.2, §4.9, §7.3"
    owner: "verifier"
    renders_flow: "F-18"
    initial: "inputs"
    states:
      - name: "inputs"
        kind: "stated"
        role: "initial"
        description: "v1 and v2: date ranges, `now`, `null`, online tests."
      - name: "range"
        kind: "stated"
        role: "terminal"
        description: "The result is a date range."
      - name: "now"
        kind: "stated"
        role: "terminal"
        description: "The result is `now`."
      - name: "null"
        kind: "stated"
        role: "error-terminal"
        description: "The result is `null`."
    transitions:
      - id: "SM-11-T01"
        from: "inputs"
        to: "range"
        trigger: "completion"
        guard: "both are date ranges and they overlap"
        actions: "Intersect them; a missing bound is open."
        kind: "stated"
        quotes:
          - at: "§8.2"
            source_lines: "2065-2067"
            quote: |-
              Validity intersection involves normal intersection of date ranges, if there are not-before or not-after fields in v1 or v2, and union of online tests, if those are present in v1 or v2.
          - at: "§4.9"
            source_lines: "1432-1434"
            quote: |-
              The not-after and not-before options are self-explanatory. If either is missing, then the certificate is assumed valid for all time in that direction.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0170"
          - "draft-ietf-spki-cert-structure#R-0313"
          - "draft-ietf-spki-cert-structure#R-0407"
        protocol_steps:
          - "F-18 4"
      - id: "SM-11-T02"
        from: "inputs"
        to: "null"
        trigger: "completion"
        guard: "both are date ranges and they do not overlap"
        actions: "none"
        kind: "inferred"
        inferred_reason: "An empty intersection is not named; `null` is the only valid5 value for it."
        quotes:
          - at: "§8.2"
            source_lines: "2065-2067"
            quote: |-
              Validity intersection involves normal intersection of date ranges, if there are not-before or not-after fields in v1 or v2, and union of online tests, if those are present in v1 or v2.
          - at: "§8.1"
            source_lines: "2037"
            quote: |-
              <valid5>:: <valid-basic> | "null" | "now" ;
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0304"
          - "draft-ietf-spki-cert-structure#R-0313"
          - "draft-ietf-spki-cert-structure#R-0428"
      - id: "SM-11-T03"
        from: "inputs"
        to: "range"
        trigger: "completion"
        guard: "either carries online tests"
        actions: "Unite the tests and fold each reply's validity period into the dates."
        kind: "stated"
        quotes:
          - at: "§8.2"
            source_lines: "2065-2067"
            quote: |-
              Validity intersection involves normal intersection of date ranges, if there are not-before or not-after fields in v1 or v2, and union of online tests, if those are present in v1 or v2.
          - at: "§8.2"
            source_lines: "2067-2069"
            quote: |-
              Each online test includes a validity period, so there is a resulting validity interval in terms of dates.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0313"
          - "draft-ietf-spki-cert-structure#R-0314"
          - "draft-ietf-spki-cert-structure#R-0426"
        protocol_steps:
          - "F-18 4"
        note: "valid5 cannot hold a test (D-07); read as resolved before the result is stored."
      - id: "SM-11-T04"
        from: "inputs"
