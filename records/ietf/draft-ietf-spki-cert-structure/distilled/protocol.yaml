  - id: "F-03"
    name: "authorization-certificate-issuance"
    title: "An issuer creates and signs an authorization certificate (<cert> and its <signature>)"
    locator: "§2, §3.1, §3.5, §3.8, §3.8.3, §3.8.3.1, §4, §4.1 to §4.10"
    kind: "creation-and-delivery"
