  - id: "F-16"
    name: "acl-maintenance"
    title: "The verifier's ACL: local, unsigned, the root of every chain"
    locator: "Abstract, §2, §4, §6, §6.1, §9.1"
    kind: "local"
    participants:
      - "acl-owner"
      - "verifier"
    summary: >-
      The ACL never leaves the verifier, so its format is free; the draft's <acl> is an example. Its
      entries are certificate bodies without issuer or signature, and they are where every chain
      starts and ends. The lifecycle is SM-13.
    steps:
      - n: "1"
        from: "acl-owner"
        to: "verifier"
        message: "<acl>"
        also_objects:
          - "<acl-entry>"
        action: >-
          Write entries (entry <subj-obj> <deleg>? <tag> <valid>? <comment>?) with no issuer and no
          signature, in any format the implementation chooses.
        locator: "Abstract, §2, §6.1, §5.2"
        kind: "stated"
        quotes:
          - at: "§6.1"
            source_lines: "1782"
            quote: |-
              <acl>:: "(" "acl" <version>? <acl-entry>* ")" ;
          - at: "§6.1"
            source_lines: "1784-1785"
            quote: |-
              <acl-entry>:: "(" "entry" <subj-obj> <deleg>? <tag> <valid>? <comment>? ")" ;
          - at: "§6.1"
