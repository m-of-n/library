  - id: "F-22"
    name: "object-and-keyholder-subjects"
    title: "Authorizing an object by its hash, signing documents, and keyholder statements"
    locator: "§2, §3.8.3, §4.5.1, §4.5.2, §6.2"
    kind: "receive-processing"
    participants:
      - "issuer"
      - "prover"
      - "verifier"
    summary: >-
      A chain may end at an object (a file, a program) named by its hash rather than at a key, and a
      prover may be the signer of a document rather than the opener of a channel. Keyholder subjects
      carry statements for people.
    steps:
      - n: "1"
        from: "issuer"
        to: "issuer"
        message: "<cert>"
        field: "subject"
        also_objects:
          - "<obj-hash>"
        action: "Grant to an object: (subject (object-hash <hash>))."
        locator: "§4.5.1"
        kind: "stated"
        quotes:
          - at: "§4.5.1"
            source_lines: "1263-1265"
            quote: |-
              This option for a (subject ) refers to an object other than a <principal>. One might use this form to assign attributes to an object (a file, a web page, an executable program, ...).
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0137"
          - "draft-ietf-spki-cert-structure#R-0138"
