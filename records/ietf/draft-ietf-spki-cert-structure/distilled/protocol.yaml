        on_error_basis: "unspecified"
      - n: "2"
        from: "prover"
        to: "verifier"
        message: "<signature>"
        also_objects:
          - "<sequence>"
        action: "Sign a document or file and send it with the signature and the chain."
        locator: "§2 (PROVER), §3.8.3"
        kind: "stated"
        quotes:
          - at: "§3.8.3"
