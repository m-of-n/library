          How a 5-tuple is represented and stored is up to the developer.
  - name: "iana"
    kind: "mentioned"
    description: "Preferred registrar of single-word algorithm names; no registration procedure is given."
    locators:
      - "§3.7"
    quotes:
      - at: "§3.7"
        source_lines: "729-733"
        quote: |-
          For the definition of new algorithm names, it is our preference that this be taken on by IANA [RFC1780] for single-word standard names. In the interest of maximum flexibility we also permit users to define their own algorithm names via a normal URIs (which presumably point to descriptions of the algorithms or even to code).
  - name: "certification-authority"
    kind: "mentioned"
    description: "A commercial CA whose name certificates may be mapped into SDSI names."
    locators:
      - "§5"
    quotes:
      - at: "§5"
        source_lines: "1620-1622"
        quote: |-
          That said, it is possible to map name certificates generated by a commercial Certification Authority into SDSI names and thus refer to keys defined under that process from within SPKI/SDSI certificates.
  - name: "limited-device"
    kind: "mentioned"
    description: >-
      A computationally limited device (a smart card) that may use a result certificate in place of
      complex formats.
    locators:
      - "§8.7"
    quotes:
      - at: "§8.7"
        source_lines: "2175-2181"
        quote: |-
          If the verifier, Self, were to be trusted to delegate the resulting authorization, its certificate result certificate then becomes a mapping of these other forms. This may prove especially useful if a given certificate chain includes multiple forms or if the result certificate is to be used by a computationally limited device (such as a Smart-Card) which can not afford the code space to process some of the more complex certificate formats.
