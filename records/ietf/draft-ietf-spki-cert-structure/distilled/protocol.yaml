  - id: "F-20"
    name: "threshold-subject-reduction"
    title: "Reducing a k-of-n subject"
    locator: "§2, §4.5.3, §8.4"
    kind: "receive-processing"
    participants:
      - "verifier"
    summary: >-
      A threshold subject passes a share to each listed subject; the permission reaches a target
      only when K of them show paths that converge on it. §8.4 sketches one procedure and defers the
      algorithms to another document. The machine is SM-12.
    note: "K < N is required by §4.5.3, against example 4's two-of-two (D-12)."
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        also_objects:
          - "<subj-thresh>"
        action: >-
          Make copies of the tuple holding the k-of-n subject, each marked with the listed subject
          it handles.
        locator: "§8.4, §4.5.3"
        kind: "stated"
        quotes:
          - at: "§8.4"
            source_lines: "2129-2131"
            quote: |-
              One general procedure is to make K copies of of the 5-tuple containing the K-of-N subject and indicate which of those subjects is being handled by that copy.
          - at: "§4.5.3"
            source_lines: "1287"
            quote: |-
              <subj-thresh>:: "(" "k-of-n" <k-val> <n-val> <subj-obj>* ")" ;
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0142"
          - "draft-ietf-spki-cert-structure#R-0146"
          - "draft-ietf-spki-cert-structure#R-0333"
        on_error: "unspecified by source (§8.4)"
        on_error_basis: "unspecified"
        note: "§8.4 says K copies, of a subject that lists N; which K is not said (D-13)."
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        action: "Reduce each copy on its own, treating its marked subject as the only one."
        locator: "§8.4"
        kind: "stated"
        quotes:
          - at: "§8.4"
            source_lines: "2131-2132"
            quote: |-
              One then reduces that copy as if it had a single subject.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0334"
        on_error: "unspecified by source (§8.4)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        action: "Stop when all K reduced copies have the same subject; they then become a single 5-tuple."
        locator: "§2, §4.5.3, §8.4"
        kind: "stated"
        quotes:
          - at: "§8.4"
            source_lines: "2132-2133"
            quote: |-
              One can stop the separate reductions when all K of the reduced values have the same subject.
          - at: "§8.4"
            source_lines: "2133-2134"
            quote: |-
              At that point, the K reduced 5-tuples become a single 5-tuple.
          - at: "§4.5.3"
            source_lines: "1306-1308"
            quote: |-
              Only if at least K of the N subjects show certificate paths which converge on a single target Subject during reduction, is that permission
          - at: "§4.5.3"
            source_lines: "1316"
            quote: |-
              transmitted to the target.
          - at: "§2"
            source_lines: "439-444"
            quote: |-
              THRESHOLD SUBJECT: a Subject for an ACL entry or certificate that specifies K of N other Subjects. Conceptually, the power being transmitted to the Subject by the ACL entry or certificate is transmitted in (1/K) amount to each listed subordinate Subject. K of those subordinate Subjects must agree (by delegating their shares along to the same object or key) for that power to be passed along.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0020"
          - "draft-ietf-spki-cert-structure#R-0021"
          - "draft-ietf-spki-cert-structure#R-0147"
          - "draft-ietf-spki-cert-structure#R-0150"
          - "draft-ietf-spki-cert-structure#R-0335"
          - "draft-ietf-spki-cert-structure#R-0404"
          - "draft-ietf-spki-cert-structure#R-0446"
        on_error: "unspecified by source (§2, §4.5.3, §8.4)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        action: "If fewer than K paths converge, the permission is not delegated."
        locator: "§4.5.3"
        kind: "stated"
        quotes:
          - at: "§4.5.3"
            source_lines: "1316-1317"
            quote: |-
              If fewer than K such paths can be shown, then the permission is not delegated.
          - at: "§4.5.3"
            source_lines: "1304-1306"
            quote: |-
              A certificate or ACL with a k-of-n Subject does not delegate permission to any of those subjects, alone. Rather, each of these subjects receives a share of the delegated permission.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0148"
          - "draft-ietf-spki-cert-structure#R-0149"
          - "draft-ietf-spki-cert-structure#R-0151"
        on_error: "Stated: the permission is not delegated."
        on_error_basis: "stated"
        error_paths:
          - "E-24"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        action: "Give the merged tuple its delegation, authorization and validity."
        locator: "§8.4"
        kind: "inferred"
        inferred_reason: >-
          The fields of the single 5-tuple the K copies become are not stated; intersecting the
          copies' tags and validities is this file's reading (D-28).
        quotes:
          - at: "§8.4"
            source_lines: "2128-2129"
            quote: |-
              A separate document will give full algorithms for reduction of K-of-N threshold subjects.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0332"
          - "draft-ietf-spki-cert-structure#R-0435"
        on_error: "unspecified by source (§8.4)"
        on_error_basis: "unspecified"
  - id: "F-21"
    name: "certificate-result-certificate"
    title: "The verifier signs its reduction result and returns it for later use"
    locator: "§8.7"
    kind: "exchange"
    participants:
      - "verifier"
      - "prover"
