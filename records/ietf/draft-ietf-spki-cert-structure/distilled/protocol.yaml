  - id: "F-13"
    name: "signature-verification"
    title: "Verifying a <signature> over the object before it"
    locator: "§2, §3.1, §3.5, §3.8, §3.8.1, §3.8.1.3, §3.8.2, §3.8.3, §3.8.3.1, §6.2"
    kind: "receive-processing"
    participants:
      - "verifier"
    summary: >-
      The canonical form is what is hashed and signed. Everything after the hash (comparing it,
      finding the key, binding the signer to the issuer) is this file's reading of a document that
      names the pieces but not the procedure. The machine is SM-02.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "<signature>"
        action: "Take the canonical bytes of the signed object exactly as received."
        locator: "§3.1, §3.5, §3.8"
        kind: "stated"
        quotes:
          - at: "§3.1"
            source_lines: "553-555"
            quote: |-
              The canonical form is a unique representation of an S-expression and is used as the input to all hash and signature functions.
          - at: "§3.5"
            source_lines: "675-678"
            quote: |-
              The canonical S-expression is the form which is hashed for both generating and verifying signatures. These two processes can be thought of as the start and end of an SPKI object's useful life and both require canonical form.
          - at: "§3.8"
            source_lines: "776-778"
            quote: |-
              Note that the main object, <cert>, is sub-type based so the parameter fields may be in any order, but the BNF suggests a fixed order.
          - at: "§3.8"
            source_lines: "779-780"
            quote: |-
              there may not be more than one of each of the listed fields
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0039"
          - "draft-ietf-spki-cert-structure#R-0040"
          - "draft-ietf-spki-cert-structure#R-0064"
          - "draft-ietf-spki-cert-structure#R-0085"
          - "draft-ietf-spki-cert-structure#R-0086"
          - "draft-ietf-spki-cert-structure#R-0088"
          - "draft-ietf-spki-cert-structure#R-0392"
          - "draft-ietf-spki-cert-structure#R-0402"
        on_error: "unspecified by source (§3.1, §3.5, §3.8)"
        on_error_basis: "unspecified"
        error_paths:
          - "E-29"
        note: >-
          Stated: canonical form is the input to every hash and signature. Read here: the bytes as
          received, because certificate fields may stand in any order and a parsed certificate
          written out again in BNF order need not reproduce what was signed (D-19).
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "<hash>"
        action: >-
          Hash them with the algorithm the signature's <hash> names (md5, sha1, or a URI) and
          compare with its hash value.
        locator: "§3.8.2, §6.2"
        kind: "inferred"
        inferred_reason: >-
          The signature carries the hash of the signed object and §6.2 makes the signature hash the
          preceding item; that the two must be equal is never written.
        quotes:
          - at: "§3.8.2"
            source_lines: "1001"
            quote: |-
              A <hash> object gives the hash of some other object.
          - at: "§6.2"
            source_lines: "1854-1855"
            quote: |-
              At this time, we assume that <signature> does double duty, calling for the hash of the preceding item.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0100"
          - "draft-ietf-spki-cert-structure#R-0259"
          - "draft-ietf-spki-cert-structure#R-0397"
          - "draft-ietf-spki-cert-structure#R-0420"
          - "draft-ietf-spki-cert-structure#R-0459"
        on_error: "Inferred: a mismatch means the signature is not over this object."
        on_error_basis: "inferred"
        error_paths:
          - "E-03"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "<principal>"
        action: >-
          Find the public key: the signature's principal is a key or the hash of one, a hash being
          resolved from the sequence's index or from elsewhere.
        locator: "§4.3, §6.2"
        kind: "inferred"
        inferred_reason: >-
          That a hash-of-key must be resolved to a key before verifying is implied by the
          alternative; where it comes from beyond the sequence is not said.
        quotes:
          - at: "§4.3"
            source_lines: "1206"
            quote: |-
              <principal>:: <pub-key> | <hash-of-key> ;
          - at: "§4.3"
            source_lines: "1208-1210"
            quote: |-
              <hash-of-key> might be the preferred <principal>, not merely for size but also in case one is using small RSA keys and protecting them from cryptanalysis by keeping them secret.
          - at: "§6.2"
            source_lines: "1851-1852"
            quote: |-
              Presumably, that item (certificate body or public key, for example) is referred to by hash in some subsequent object.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0125"
          - "draft-ietf-spki-cert-structure#R-0126"
          - "draft-ietf-spki-cert-structure#R-0258"
          - "draft-ietf-spki-cert-structure#R-0396"
          - "draft-ietf-spki-cert-structure#R-0418"
        on_error: "unspecified by source (§4.3, §6.2)"
        on_error_basis: "unspecified"
        error_paths:
          - "E-07"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "<sig-val>"
        also_objects:
          - "<pub-key>"
        action: >-
          Verify the signature value with that key under its algorithm: one integer for RSA, an r
          and an s for DSA; other algorithms define their own parameters. Algorithm names are case
          sensitive.
        locator: "§3.8.1, §3.8.3.1, §3.8"
        kind: "stated"
