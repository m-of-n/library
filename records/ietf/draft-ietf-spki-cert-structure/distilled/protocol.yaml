  - id: "F-11"
    name: "online-instrument-issuance"
    title: "The online-test responder issues CRLs, delta-CRLs and revalidations over time"
    locator: "§7, §7.1, §7.2, §7.3"
    kind: "creation"
    participants:
      - "online-test-responder"
    summary: >-
      Instruments are issued for consecutive, non-overlapping intervals so that a user can tell
      which is current, each signed by the principal that certificates name in their online tests.
    note: >-
      The draft carries an open editorial question at the head of §7 (L1888-1889) about identifying
      a CRL or reval thread (D-22).
