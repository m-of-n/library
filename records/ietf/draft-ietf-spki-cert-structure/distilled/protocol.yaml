        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0300"
          - "draft-ietf-spki-cert-structure#R-0306"
          - "draft-ietf-spki-cert-structure#R-0425"
        on_error: "unspecified by source (§8.1, §6.1)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "<name-cert>"
        action: >-
          Form a 4-tuple <Issuer, Name, Subject, Validity> from each name certificate, for name
          reduction.
        locator: "§2 (TUPLE)"
        kind: "stated"
        quotes:
          - at: "§2"
            source_lines: "448-453"
            quote: |-
              TUPLE: The security-relevant fields from a certificate or ACL entry. We speak of 4-tuples for name certificates and 5-tuples for authorizations. The 4-tuple has fields: <Issuer, Name, Subject, Validity> while the 5-tuple has fields: <Issuer, Subject, Delegation, Authorization, Validity>.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0022"
          - "draft-ietf-spki-cert-structure#R-0412"
          - "draft-ietf-spki-cert-structure#R-0447"
        on_error: "unspecified by source (§2 (TUPLE))"
        on_error_basis: "unspecified"
        note: "The 4-tuple has no BNF and its validity is never used again in the source (D-27)."
      - n: "6"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        action: >-
          Translate certificates of other kinds into 5-tuples (X.509, SET, DNSSEC, PGP); no
          translation is given.
        locator: "§8, §8.7"
        kind: "stated"
        quotes:
          - at: "§8"
            source_lines: "2004-2007"
            quote: |-
              The inputs to that trust engine are 5-tuples and any kind of certificate, not just SPKI, as well as Access Control List (ACL) entries can be translated to 5-tuples so that they can all participate in the trust computation.
          - at: "§8.7"
            source_lines: "2171-2175"
            quote: |-
              The certificates which made up the loop forming this result 5-tuple could have been of any variety, including X.509v1, X.509v3, SET or DNSSEC. They could also be PGP signed keys processed by an enriched trust engine (one capable of dealing with the PGP web of trust rules).
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0294"
        on_error: "unspecified by source (§8, §8.7)"
        on_error_basis: "unspecified"
      - n: "7"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        action: >-
          Reduce names in subjects first (F-17), so that issuers and subjects are principals, and
          treat principals as public keys whichever way they are stored.
        locator: "§8, §5"
        kind: "stated"
        quotes:
