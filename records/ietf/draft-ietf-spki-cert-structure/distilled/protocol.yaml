flows:
  - id: "F-01"
    name: "authorization-request"
    title: >-
      A prover asks a verifier to satisfy a request and carries its authorization in a <sequence>
    locator: "Abstract, §2, §3.8, §6.2, §8.1, §9.1"
    kind: "exchange"
    participants:
      - "prover"
      - "verifier"
    summary: >-
      The exchange the whole document serves. The source defines what the prover delivers (a
      <sequence> of certificates, keys, signatures, online-test results and opcodes) and what the
      verifier concludes (a 5-tuple whose issuer is `self`). It defines neither the request, nor the
      channel, nor the rule that compares a request with the authorization reached, nor any reply.
    steps:
      - n: "1"
        from: "prover"
        to: "prover"
        message: "<sequence>"
        also_objects:
          - "<cert>"
          - "<pub-key>"
          - "<signature>"
          - "<crl>"
          - "<delta-crl>"
          - "<reval>"
        action: >-
          Collect the certificates that carry authority from the verifier's ACL to the prover, the
          keys and signatures they need, and every online-test result the prover may fetch (F-05,
          F-06 to F-08, F-10). One-time results are left to the verifier (F-09).
        locator: "§4.4, §4.9.3, §7"
        kind: "stated"
        quotes:
          - at: "§4.4"
            source_lines: "1220-1224"
            quote: |-
              We expect the prover (the calling client) to track down such other certificates and provide them to the verifier (the called server), but we allow this information in the certificate to simplify that process for the prover.
          - at: "§4.9.3"
            source_lines: "1530-1533"
            quote: |-
              The fetch of a one-time test result must be done by the verifying code, while all other tests fetches can be done by the prover, prior to submitting a (sequence...) to the verifier.
          - at: "§7"
            source_lines: "1899-1901"
            quote: |-
              It is assumed that, except for the one-time test, the prover and not the verifier will fetch any online-test results and then provide those results in the <sequence> being handed to the verifier.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0129"
          - "draft-ietf-spki-cert-structure#R-0198"
          - "draft-ietf-spki-cert-structure#R-0199"
          - "draft-ietf-spki-cert-structure#R-0264"
        on_error: >-
          If no chain can be assembled the request cannot succeed; the source names no failure and
          no message for it.
        on_error_basis: "inferred"
      - n: "2"
        from: "prover"
        to: "verifier"
        message: "none"
        message_note: >-
          The request has no object in the draft: no syntax, no field, and no rule binding it to a
          <tag>.
        action: >-
          Make the request the prover wants satisfied, by a message or over a channel, in a way the
          verifier can attribute to the prover's key (it checks signatures and credentials sent by
          the prover).
        locator: "Abstract, §2 (PROVER)"
        kind: "stated"
        quotes:
          - at: "Abstract"
            source_lines: "86-90"
            quote: |-
              This document defines the structure of SPKI certificates, CRLs, other fine-grain validity instruments and sequences of those objects to be delivered from a prover to a verifier. The purpose of such objects is to establish the prover's authorization to have a request satisfied by the verifier.
          - at: "§2"
            source_lines: "420-423"
            quote: |-
              PROVER: the entity that wishes access or that digitally signs a document. The Prover typically sends a message or opens a channel to the Verifier that then checks signatures and credentials sent by the Prover.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0016"
        on_error: "unspecified by source (§2 PROVER names the check, not its failure)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "prover"
        to: "verifier"
        message: "<sequence>"
        action: >-
          Hand over the <sequence> in canonical form, or in its base64 transport form over a 7-bit
          channel (F-02).
        locator: "§3.1, §3.8, §6.2, §9.1"
        kind: "stated"
        quotes:
          - at: "§9.1"
            source_lines: "2250-2251"
            quote: |-
              <sequence>: the object carrying keys, certificates and online test results from prover to verifier.
          - at: "§3.8"
            source_lines: "753-755"
            quote: |-
              In a communication from prover to verifier, one might encounter only a small number of different objects: usually a <sequence> of <cert>, <pub-key>, <signature> and <op>.
          - at: "§3.1"
            source_lines: "545-548"
            quote: |-
              All SPKI structures communicated from one machine to another must be in canonical form. If canonical S-expressions need to be transmitted over a 7-bit channel, there is a form defined for base64 encoding them.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0034"
          - "draft-ietf-spki-cert-structure#R-0035"
          - "draft-ietf-spki-cert-structure#R-0348"
        on_error: "unspecified by source (§3.1, §3.8, §6.2, §9.1)"
        on_error_basis: "unspecified"
        note: "Steps 2 and 3 may be one message; the source orders neither."
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "<sequence>"
        also_objects:
          - "<acl>"
          - "<5-tuple>"
        action: >-
          Process the sequence (F-12), verify each signature (F-13), check validity (F-14) and
          obtain the one-time results itself (F-09), turn certificates and its own ACL entries into
          5-tuples (F-15, F-16), reduce names (F-17) and reduce the 5-tuples (F-18, F-19, F-20).
        locator: "§2 (VERIFIER), §3.8, §8"
        kind: "stated"
        quotes:
          - at: "§2"
            source_lines: "465-469"
            quote: |-
              VERIFIER: the entity that processes requests from a prover, including certificates. The verifier uses its own ACL entries plus certificates provided by the prover to perform "5-tuple reduction", to arrive at a 5-tuple it believes about the prover: <self,prover,D,A,V>.
          - at: "§3.8"
            source_lines: "755-756"
            quote: |-
              The verifier will also need to refer to its own <acl>.
          - at: "§8"
            source_lines: "2002-2004"
            quote: |-
              This section describes the operation of the trust evaluation machinery assumed to be part of every verifier which accepts SPKI certificates.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0026"
          - "draft-ietf-spki-cert-structure#R-0076"
          - "draft-ietf-spki-cert-structure#R-0293"
          - "draft-ietf-spki-cert-structure#R-0448"
        on_error: "unspecified by source (§2 (VERIFIER), §3.8, §8)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        action: >-
          Decide. Only a result whose issuer is `self` means anything; its subject must be the
          prover (or the object asked about), its validity must hold now, and the request must fall
          inside its authorization A.
        locator: "§2 (VERIFIER), §6.2, §8.1"
        kind: "inferred"
        inferred_reason: >-
          Stated: only self-issued 5-tuples mean anything, and the verifier arrives at
          <self,prover,D,A,V> and decides whether to grant access. Not stated: how a request is
          compared with A, that V must contain the moment of decision, or how the prover's key is
          matched to the request's sender.
        quotes:
          - at: "§8.1"
            source_lines: "2045-2046"
            quote: |-
              The only 5-tuples that can mean anything to the verifier, after reduction is done, are those with "self" as issuer.
          - at: "§6.2"
            source_lines: "1841-1842"
            quote: |-
              A <sequence> is an ordered sequence of objects that the verifier is to consider when deciding to grant access.
          - at: "§6.2"
            source_lines: "1842-1844"
            quote: |-
              By reducing certificates in the sequence, the verifier will establish that the final subject (key or object) has been granted authority through the sequence.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0254"
          - "draft-ietf-spki-cert-structure#R-0255"
          - "draft-ietf-spki-cert-structure#R-0307"
          - "draft-ietf-spki-cert-structure#R-0453"
        on_error: "Inferred: no self-issued result covering the request means the request is not satisfied."
        on_error_basis: "inferred"
        error_paths:
          - "E-23"
      - n: "6"
        from: "verifier"
        to: "prover"
        message: "none"
        also_objects:
          - "<cert>"
          - "<signature>"
        message_note: >-
          No reply object is defined; a result certificate is a <cert> with its <signature> (F-21).
        action: >-
          Answer: satisfy or refuse the request; optionally return a signed result certificate for
          later use (F-21).
        locator: "§8.7"
        kind: "inferred"
        inferred_reason: >-
          No reply, status or error message is defined. §8.7 names returning a signed result 5-tuple
          as one option and says nothing else about what the prover receives.
        quotes:
          - at: "§8.7"
            source_lines: "2155-2157"
            quote: |-
              Therefore, one option by the verifier is to sign and return the result 5-tuple to the caller for this later use.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0342"
        on_error: "unspecified by source (§8.7)"
        on_error_basis: "unspecified"
  - id: "F-02"
    name: "transport-encoding"
    title: >-
      Moving SPKI objects between machines: canonical form, base64 transport, advanced form for
      people
    locator: "§3, §3.1, §3.4, §3.5, §3.6, §9"
    kind: "encoding"
    participants:
      - "sender"
      - "receiver"
      - "7-bit-channel"
    summary: >-
      Every structure that leaves a machine is a canonical S-expression; over a 7-bit channel it may
      travel base64-encoded in braces. The advanced form exists for people and for this document's
      examples and is never what is hashed or signed. Sender and receiver are whichever roles a flow
      names (prover, verifier, issuer, online-test responder).
    steps:
      - n: "1"
        from: "sender"
        to: "sender"
        message: "<s-expr>"
        also_objects:
          - "<byte-string>"
        action: >-
          Serialise the object canonically: each byte string prefixed by its decimal length and a
          colon, display types in brackets, lists in parentheses, no white space, no redundant
          leading zero in a length.
        locator: "§3.1, §3.2, §9"
        kind: "stated"
        quotes:
          - at: "§3.1"
            source_lines: "550-553"
            quote: |-
              A canonical S-expression is formed from binary byte strings, each prefixed by its length, plus the punctuation characters "()[]". The length of a byte string is a non-negative ASCII decimal number, with no unnecessary leading "0" digits, terminated by ":".
          - at: "§9"
            source_lines: "2230-2232"
            quote: |-
              The following is the BNF of canonical forms and includes lengths for each explicit byte string. So, for example, "cert" is expressed as "4:cert".
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0036"
          - "draft-ietf-spki-cert-structure#R-0037"
          - "draft-ietf-spki-cert-structure#R-0047"
          - "draft-ietf-spki-cert-structure#R-0048"
          - "draft-ietf-spki-cert-structure#R-0049"
          - "draft-ietf-spki-cert-structure#R-0052"
          - "draft-ietf-spki-cert-structure#R-0059"
          - "draft-ietf-spki-cert-structure#R-0344"
          - "draft-ietf-spki-cert-structure#R-0387"
        on_error: "unspecified by source (§3.1, §3.2, §9)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "sender"
        to: "receiver"
        message: "<s-expr>"
        action: >-
          Transmit the canonical form; over a 7-bit channel, its base64 encoding enclosed in braces.
        locator: "§3.1, §3.4"
        kind: "stated"
        quotes:
          - at: "§3.1"
            source_lines: "545-548"
            quote: |-
              All SPKI structures communicated from one machine to another must be in canonical form. If canonical S-expressions need to be transmitted over a 7-bit channel, there is a form defined for base64 encoding them.
          - at: "§3.4"
            source_lines: "652-654"
            quote: |-
              For transmission of true 8-bit forms, we permit base64 encodings according to [RFC2045], with the base64 characters enclosed in braces "{}".
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0034"
          - "draft-ietf-spki-cert-structure#R-0035"
          - "draft-ietf-spki-cert-structure#R-0063"
          - "draft-ietf-spki-cert-structure#R-0391"
        on_error: "unspecified by source (§3.1, §3.4)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "receiver"
        to: "receiver"
        message: "<s-expr>"
        action: "If the object arrived in braces, base64-decode it to recover the canonical bytes."
        locator: "§3.4"
        kind: "inferred"
        inferred_reason: "The source defines the encoding direction only; decoding on receipt is its inverse."
        quotes:
          - at: "§3.4"
            source_lines: "652-654"
            quote: |-
              For transmission of true 8-bit forms, we permit base64 encodings according to [RFC2045], with the base64 characters enclosed in braces "{}".
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0063"
          - "draft-ietf-spki-cert-structure#R-0386"
          - "draft-ietf-spki-cert-structure#R-0387"
          - "draft-ietf-spki-cert-structure#R-0391"
        on_error: >-
          unspecified by source (§3.4): a brace form that does not decode, or decodes to a
          non-canonical form, has no stated handling
        on_error_basis: "unspecified"
        error_paths:
          - "E-33"
      - n: "4"
        from: "receiver"
        to: "receiver"
        message: "<s-expr>"
        action: >-
          Keep the received canonical bytes beside the parsed object, because hashing and signature
          checking operate on them (F-13).
        locator: "§3.5"
        kind: "stated"
        quotes:
          - at: "§3.5"
            source_lines: "675-678"
            quote: |-
              The canonical S-expression is the form which is hashed for both generating and verifying signatures. These two processes can be thought of as the start and end of an SPKI object's useful life and both require canonical form.
          - at: "§3.5"
            source_lines: "678-680"
            quote: |-
