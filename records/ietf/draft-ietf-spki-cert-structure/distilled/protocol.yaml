  - id: "F-12"
    name: "sequence-processing"
    title: "The verifier reads a <sequence> in order"
    locator: "§3.8.3, §6.2, §9.2"
    kind: "receive-processing"
    participants:
      - "verifier"
    summary: >-
      A <sequence> is ordered. Objects are read one at a time; the hash opcode and every signature
      act on the item read before them and index it by hash, so that later objects can refer to it
      by hash. The machine is SM-01.
