    title: "Intersecting two tags: §8.2's basic cases and §8.3's six rules"
    locator: "§3.2, §4.8, §8.2, §8.3, §9.2"
    kind: "local-decision"
    participants:
      - "verifier"
    summary: >-
      In the usual case one tag has no *-forms. Equal tags intersect to themselves, (tag (*)) to the
      other tag, a set is expanded, a range or prefix is tested against the explicit string, and
      anything else is `null`. The machine is SM-10.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "<tag>"
        action: "If either tag is (tag (*)), the result is the other."
        locator: "§4.8, §8.2, §8.3"
        kind: "stated"
        quotes:
