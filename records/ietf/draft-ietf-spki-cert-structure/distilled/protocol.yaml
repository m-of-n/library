applicability: >-
  Applicable. The draft defines structures delivered from a prover to a verifier (certificates,
  CRLs, revalidations, sequences) and the processing a verifier applies to them: sequence reading,
  signature checking, validity and online tests, tuple formation, name reduction, 5-tuple reduction,
  tag intersection, threshold subjects and result certificates. It also describes four online tests
  that involve a third party, the online-test responder. It does not define the request, any
  transport, any online-test protocol, or any reply to the prover; where a flow needs one, the step
  is marked inferred or names no message. There are no BCP 14 keywords in the draft (its boilerplate
  cites RFC 2119 and the body never uses an uppercase keyword); its obligations are lowercase must,
  should and may, and the requirements those sentences became are joined below by script.
conventions:
  quoting: >-
    Every quotation is a mapping {at, source_lines, quote}. quote is cut by script from
    .cache/draft-ietf-spki-cert-structure.txt as bin/_source_text reads it (page footers dropped,
    white space collapsed, a line-end hyphen joined) and never typed; source_lines is the tightest
    range that holds it and at is the section those lines lie in, both checked by the same script,
    and bin/check-quotes verifies every one. This draft's running header (INTERNET-DRAFT, the title
    and the date) is not removed by bin/_source_text, whose header pattern is written for RFCs, so
    no quotation crosses a page break: a sentence broken by one is quoted as two items, the first
    ending and the second starting at the page boundary (L1306-1308 with L1316, L1479 with L1487,
    L1533-1536 with L1544). Nothing is elided; a quotation that starts or ends mid-sentence does so
    at the line range given.
  basis: >-
    kind is stated or inferred on every step; an inferred step also carries inferred_reason, saying
    what the source does and does not say. on_error_basis is stated (the source says what follows a
    failure), unspecified (the source names the operation and not its failure; on_error then says
    unspecified by source with the locator), or inferred (this file's reading, said so in on_error).
    action, condition, note and every other prose field are this file's wording, and carry no double
    quote mark: a literal token is written in backticks, and every source word is in a quote item.
  messages: >-
    message is the draft's own object name in angle brackets (<sequence>, <cert>, <name-cert>,
    <signature>, <crl>, <delta-crl>, <reval>, <5-tuple>, <acl>, ...), the name messages.yaml uses;
    also_objects lists further objects the step reads or writes, and field names a part of the
    message. A step whose exchange the draft does not define has message none and a message_note;
    nothing is invented to fill it. Two objects have no BNF and are named in prose only: the 4-tuple
    of a name certificate (§2) and the request (Abstract). <reval> has three grammars (D-03); a step
    says which form it means.
  roles: >-
    from and to name a role in roles. A step that a role performs alone has from equal to to. sender
    and receiver in F-02 stand for whichever role transmits.
  locators: >-
    A locator is a section sign with the .txt heading number (the draft's own numbering), Abstract,
    or a glossary entry as §2 (TERM). A step's n is this file's order within its flow; the draft
    numbers no procedure except the six rules of §8.3, which F-19 follows.
  constrained_by: >-
    draft-ietf-spki-cert-structure#R-NNNN ids from requirements.yaml, joined by script: a
    requirement is cited where its text and one of the step's quotations contain one another and
    their source_lines overlap, or where an explicit selector (section plus text fragment, refusing
    zero or several matches) names it. requirements_join records when the join ran, against how many
    requirements, and which steps stayed unwired and why.
  kind_of_flow: >-
    exchange: two or more parties, at least one message. creation-and-delivery: a party builds an
    object for others. creation: the responder's issuing over time. receive-processing: a party's
    own processing of what it received. local, local-with-fetch, local-decision: one party alone,
    possibly fetching. encoding: the transfer form of any structure.
framing:
  - id: "FR-01"
    text: >-
      The objects exist to show a prover's authorization to a verifier; identity is optional and
      often unnecessary.
    locator: "Abstract"
    basis: "stated"
    quotes:
      - at: "Abstract"
        source_lines: "86-90"
        quote: |-
          This document defines the structure of SPKI certificates, CRLs, other fine-grain validity instruments and sequences of those objects to be delivered from a prover to a verifier. The purpose of such objects is to establish the prover's authorization to have a request satisfied by the verifier.
      - at: "Abstract"
        source_lines: "90-93"
        quote: |-
          Establishing identity, sometimes thought to be the only purpose of a certificate, is considered to be an optional step in this process but not the goal of the effort and often unnecessary.
  - id: "FR-02"
    text: >-
      Authority flows in a circuit from the verifier's ACL, through certificates, back to the
      verifier; the verifier is the only root.
    locator: "§2, §4"
    basis: "stated"
    quotes:
      - at: "§2"
        source_lines: "352-353"
        quote: |-
          ACL: an Access Control List: a list of entries that anchors a certificate chain.
      - at: "§4"
        source_lines: "1158-1162"
        quote: |-
          An ACL entry lives on the machine of the verifier, leading to the observation that all authorization flow is in a circuit -- from the verifying machine's ACL, possibly through certificates and then back to the verifying machine.
      - at: "§4"
        source_lines: "1162-1163"
        quote: |-
          Alternatively, one might say that the only root of an authorization certificate chain is the verifier.
  - id: "FR-03"
    text: "The ACL is never communicated, so its format is not standardized."
    locator: "Abstract, §6.1, §9.1"
    basis: "stated"
    quotes:
      - at: "Abstract"
        source_lines: "95-99"
        quote: |-
          The authorization computation also involves an ACL [Access Control List], by necessity. Since the ACL is never communicated from one party to another, there is no reason to standardize its format. That is left to the implementer, although this document does give an example format for an ACL.
      - at: "§9.1"
        source_lines: "2244-2246"
        quote: |-
          <acl>: an object for local use which might be implementation dependent. An ACL is not expected to be communicated from machine to machine.
  - id: "FR-04"
    text: >-
      What travels between machines is canonical S-expressions; canonical form is what is hashed and
      signed.
    locator: "§3.1, §3.5"
    basis: "stated"
    quotes:
      - at: "§3.1"
        source_lines: "545-548"
        quote: |-
          All SPKI structures communicated from one machine to another must be in canonical form. If canonical S-expressions need to be transmitted over a 7-bit channel, there is a form defined for base64 encoding them.
      - at: "§3.1"
        source_lines: "553-555"
        quote: |-
          The canonical form is a unique representation of an S-expression and is used as the input to all hash and signature functions.
  - id: "FR-05"
    text: "Online-test protocols, and online protocols generally, are not specified."
    locator: "§4.9.3, §7, §7.1"
    basis: "stated"
    quotes:
      - at: "§4.9.3"
        source_lines: "1517"
        quote: |-
          The protocol used for these online tests is not fully specified here.
      - at: "§7"
        source_lines: "1896-1897"
        quote: |-
          This section does not give details of protocols for connecting to online servers or transmitting messages between them.
      - at: "§7.1"
        source_lines: "1932-1934"
        quote: |-
          The CRL request can be a straight HTTP transaction, using the URI provided in the certificate, but we do not specify online protocols in this draft.
  - id: "FR-06"
    text: >-
      The reduction is defined, but any computationally equivalent algorithm is allowed; 5-tuples
      are internal and their representation is free.
    locator: "Abstract, §8, §8.1, §9.1"
    basis: "stated"
    quotes:
      - at: "Abstract"
        source_lines: "108-111"
        quote: |-
          The process of reducing SPKI sequences and an ACL to determine an authorization result is spelled out here, but an individual implementer is free to design new reduction algorithms as long as they are computationally equivalent to the one defined here.
      - at: "§8"
        source_lines: "2009-2011"
        quote: |-
          A 5-tuple is an internal construct and therefore best described by a programming language data structure. A separate document will give the 5-tuple reduction code and those data structures.
      - at: "§9.1"
        source_lines: "2241-2242"
        quote: |-
          <5-tuple>: an object defined for documentation purposes only. The actual contents of a 5-tuple are implementation dependent.
  - id: "FR-07"
    text: "Sequences are the one structure that is part of a protocol; ACLs are private."
    locator: "§6"
    basis: "stated"
    quotes:
      - at: "§6"
        source_lines: "1774-1776"
        quote: |-
          ACL and sequence structures are in the grey area. ACLs are private to one developer or application. Sequences can be thought of as part of the protocol using certificates.
