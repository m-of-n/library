  - id: "F-14"
    name: "validity-checking"
    title: "Is a certificate valid now? Dates, then online tests"
    locator: "§2, §4.9, §4.9.1, §4.9.2, §7, §8.1"
    kind: "receive-processing"
    participants:
      - "verifier"
    summary: >-
      Validity is a date range that must include the present and a set of online tests that must all
      succeed. Each test reply narrows the range; a one-time reply narrows it to `now`. The machine
      is SM-03.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "<valid>"
        also_objects:
          - "<valid-basic>"
        action: "Read not-before and not-after; a missing bound leaves that direction open."
        locator: "§4.9"
        kind: "stated"
        quotes:
          - at: "§4.9"
            source_lines: "1417-1418"
            quote: |-
              The <valid> field gives validity dates and/or online test information for the certificate.
          - at: "§4.9"
            source_lines: "1420"
            quote: |-
              <valid>:: "(" "valid" <not-before>? <not-after>? <online-test>* ")" ;
          - at: "§4.9"
            source_lines: "1432-1434"
            quote: |-
              The not-after and not-before options are self-explanatory. If either is missing, then the certificate is assumed valid for all time in that direction.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0166"
          - "draft-ietf-spki-cert-structure#R-0167"
          - "draft-ietf-spki-cert-structure#R-0168"
          - "draft-ietf-spki-cert-structure#R-0169"
          - "draft-ietf-spki-cert-structure#R-0170"
          - "draft-ietf-spki-cert-structure#R-0406"
        on_error: "unspecified by source (§4.9)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "<date>"
        action: >-
          Compare the present UTC time, written in the same form, with the bounds as ASCII byte
          strings.
        locator: "§4.9.1"
        kind: "stated"
        quotes:
          - at: "§4.9.1"
            source_lines: "1445-1449"
            quote: |-
              A date field is an ASCII byte string of the form: YYYY-MM-DD_HH:MM:SS always UTC.
          - at: "§4.9.1"
            source_lines: "1451-1454"
            quote: |-
              <date> fields are compared as normal ASCII byte strings since one never needs to compute the size of a time interval to test validity -- only determine greater-than, less-than or equal.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0171"
          - "draft-ietf-spki-cert-structure#R-0172"
          - "draft-ietf-spki-cert-structure#R-0173"
          - "draft-ietf-spki-cert-structure#R-0174"
          - "draft-ietf-spki-cert-structure#R-0407"
          - "draft-ietf-spki-cert-structure#R-0408"
        on_error: >-
          Stated by the definition of validity conditions: outside the range the certificate is not
          valid.
        on_error_basis: "stated"
        error_paths:
          - "E-08"
        note: >-
          That the verifier writes its own clock in the date form is this file's reading; the
          comparison is stated.
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "<online-test>"
        action: "For each online test, obtain and check its reply (F-06 to F-10)."
        locator: "§2 (VALIDITY CONDITIONS), §4.9.2"
        kind: "stated"
        quotes:
          - at: "§2"
            source_lines: "462-463"
            quote: |-
              a set of online tests that must succeed before a certificate is to be considered valid.
          - at: "§4.9.2"
            source_lines: "1465-1468"
            quote: |-
              The online test option allows a certificate to be backed up by finer grain validity testing. The online test specification, above, is present in a certificate and shows that the certificate has a finer-grain validity mechanism.
          - at: "§2"
            source_lines: "410-414"
            quote: |-
              ONLINE TEST: one of three forms of validity test: (1) CRL; (2) revalidation; or (3) one-time revalidation. Each refines the date range during which a given certificate or ACL entry is considered valid, although the last defines a validity interval of effectively zero length.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0014"
          - "draft-ietf-spki-cert-structure#R-0015"
          - "draft-ietf-spki-cert-structure#R-0025"
          - "draft-ietf-spki-cert-structure#R-0178"
          - "draft-ietf-spki-cert-structure#R-0409"
          - "draft-ietf-spki-cert-structure#R-0426"
        on_error: "Stated by the definition of validity conditions: every online test must succeed."
        on_error_basis: "stated"
        error_paths:
          - "E-09"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "<valid>"
        action: "Intersect each reply's dates with the certificate's to get the current working validity."
        locator: "§4.9.2"
        kind: "stated"
        quotes:
          - at: "§4.9.2"
            source_lines: "1471-1475"
            quote: |-
              That object includes validity dates, so that once one has the online test response, its validity dates can be intersected with the parent certificate's validity dates to yield the current working validity dates for the certificate.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0180"
          - "draft-ietf-spki-cert-structure#R-0426"
        on_error: "unspecified by source (§4.9.2)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "<cert>"
        action: >-
          The certificate is valid only if the range includes the present and every online test has
          succeeded.
        locator: "§2 (VALIDITY CONDITIONS)"
        kind: "stated"
        quotes:
          - at: "§2"
            source_lines: "461-463"
            quote: |-
              VALIDITY CONDITIONS: a date range that must include the current date and time and/or a set of online tests that must succeed before a certificate is to be considered valid.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0024"
          - "draft-ietf-spki-cert-structure#R-0025"
          - "draft-ietf-spki-cert-structure#R-0426"
        on_error: "Stated: otherwise the certificate is not to be considered valid."
        on_error_basis: "stated"
        error_paths:
          - "E-08"
          - "E-09"
      - n: "6"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        field: "valid5"
        action: "Carry the result into the 5-tuple's valid5: a date range, `now`, or `null`."
        locator: "§8.1"
        kind: "inferred"
        inferred_reason: >-
          §8.1 gives the forms of valid5; no rule maps a <valid> with online tests onto them, and
          valid5 has no place for an unresolved test (D-07).
        quotes:
          - at: "§8.1"
            source_lines: "2037"
            quote: |-
              <valid5>:: <valid-basic> | "null" | "now" ;
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0304"
          - "draft-ietf-spki-cert-structure#R-0424"
        on_error: "unspecified by source (§8.1)"
        on_error_basis: "unspecified"
  - id: "F-15"
    name: "tuple-formation"
    title: "Turning certificates and ACL entries into 5-tuples, and name certificates into 4-tuples"
    locator: "§2, §4.1, §4.2, §4.5, §4.7, §4.10, §6.1, §8, §8.1, §8.7"
    kind: "receive-processing"
    participants:
      - "verifier"
    summary: >-
      The trust engine reduces 5-tuples, whatever certificate they came from. The source gives the
      5-tuple's grammar and the fields of both tuples; the field-by-field mapping is this file's.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "<cert>"
        action: "Ignore a certificate whose version is not recognised; an absent version means version 0."
        locator: "§4.1"
        kind: "stated"
        quotes:
          - at: "§4.1"
            source_lines: "1176-1177"
            quote: |-
              A certificate containing an unrecognized version number must be ignored.
          - at: "§4.1"
            source_lines: "1171-1173"
            quote: |-
              If the <version> field is missing from an object, it is assumed to be (version "0"), which is the version of all objects in this draft.
          - at: "§4.1"
            source_lines: "1169"
            quote: |-
              <version>:: "(" "version" <integer> ")" ;
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0115"
