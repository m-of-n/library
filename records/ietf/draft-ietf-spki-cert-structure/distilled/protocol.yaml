not_defined:
  - id: "ND-01"
    text: >-
      The prover's request, the channel it uses, and any reply, grant, refusal or error message.
  - id: "ND-02"
    text: "How the verifier compares a request with the authorization A it has reached."
  - id: "ND-03"
    text: "Any protocol for online tests beyond remarks on HTTP, passive web pages and CGI."
  - id: "ND-04"
    text: "The one-time request: how the nonce, the certificate and any transaction data are sent."
  - id: "ND-05"
    text: "A reply format for the new-cert test."
  - id: "ND-06"
    text: >-
      How certificates and keys are published or retrieved at the URIs certificates and keys name.
  - id: "ND-07"
    text: "How a delta-CRL combines with its predecessor."
  - id: "ND-08"
    text: "Which bytes, and which algorithm, a CRL or reval hash covers."
  - id: "ND-09"
    text: "How a CRL or reval in a sequence is matched to the certificate test it answers."
  - id: "ND-10"
    text: "The meaning of <online-id>."
  - id: "ND-11"
    text: "Equality of principals held in different forms."
  - id: "ND-12"
    text: >-
      The mapping from certificate fields to 5-tuple fields, and from valid5 back to <valid> in a
      result certificate.
  - id: "ND-13"
    text: >-
      The algorithms for threshold subjects and the name-reduction rules that bound recursion (both
      deferred to other documents).
  - id: "ND-14"
    text: "The 5-tuple data structures and reduction code (deferred to a separate document)."
  - id: "ND-15"
    text: "Translation of X.509, SET, DNSSEC or PGP certificates into 5-tuples."
  - id: "ND-16"
    text: "The signature computations themselves, and any elliptic-curve key or signature format."
  - id: "ND-17"
    text: "Symmetric (HMAC) keys for result certificates."
  - id: "ND-18"
    text: "A registration procedure for algorithm names."
  - id: "ND-19"
    text: "Key lifecycle: rotation, compromise or revocation of keys, as opposed to certificates."
  - id: "ND-20"
    text: "Who may edit an ACL, and what happens to results already derived from a removed entry."
