          - "draft-ietf-spki-cert-structure#R-0118"
          - "draft-ietf-spki-cert-structure#R-0400"
          - "draft-ietf-spki-cert-structure#R-0401"
        on_error: "Stated: the certificate is ignored."
        on_error_basis: "stated"
        error_paths:
          - "E-01"
          - "E-02"
        note: >-
          §4.1 says version numbers are alphanumeric strings and writes the default as a quoted
          string, while the BNF makes the version an integer (D-16).
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "<cert>"
        also_objects:
          - "<cert-display>"
          - "<comment>"
        action: "Set aside the display hint and the comment; neither takes part in reduction."
        locator: "§4.2, §4.10"
        kind: "stated"
        quotes:
          - at: "§4.2"
            source_lines: "1185-1188"
            quote: |-
              This optional field gives a display hint for the entire certificate. This display parameter does not affect certificate chain reduction, but is provided to aid user-interface software in certificate display.
          - at: "§4.2"
            source_lines: "1191-1192"
            quote: |-
              For verifiers of certificates, this field is treated as a comment.
          - at: "§4.10"
            source_lines: "1552-1553"
            quote: |-
              This optional field allows the issuer to attach comments meant to be ignored by any processing code but presumably to be read by a human.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0120"
          - "draft-ietf-spki-cert-structure#R-0121"
          - "draft-ietf-spki-cert-structure#R-0123"
          - "draft-ietf-spki-cert-structure#R-0203"
          - "draft-ietf-spki-cert-structure#R-0402"
        on_error: "unspecified by source (§4.2, §4.10)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        also_objects:
          - "<cert>"
        action: >-
          Form <issuer5, subject5, deleg5, tag-body5, valid5>: the issuer's key, the subject, `t`
          when (propagate) is present and `f` otherwise, the tag body, and the validity from F-14.
        locator: "§2 (TUPLE), §4.7, §6.1, §8.1"
        kind: "inferred"
        inferred_reason: >-
          §8.1 gives the grammar and §2 the field names; the mapping of (propagate) to `t` follows
          §4.7 and §6.1's default of no delegation, and is not written as a rule.
        quotes:
          - at: "§8.1"
            source_lines: "2027"
            quote: |-
              <5-tuple>:: <issuer5> <subject5> <deleg5> <tag-body5> <valid5> ;
          - at: "§2"
            source_lines: "448-453"
            quote: |-
              TUPLE: The security-relevant fields from a certificate or ACL entry. We speak of 4-tuples for name certificates and 5-tuples for authorizations. The 4-tuple has fields: <Issuer, Name, Subject, Validity> while the 5-tuple has fields: <Issuer, Subject, Delegation, Authorization, Validity>.
          - at: "§8.1"
            source_lines: "2033"
            quote: |-
              <deleg5>:: "t" | "f" ;
          - at: "§4.7"
            source_lines: "1381-1383"
            quote: |-
              This optional field, if present, notes that the <subject> has not only the permission given in the <cert>'s <tag> field but also the permission to delegate that (or some portion of it) to others.
          - at: "§6.1"
            source_lines: "1794-1797"
            quote: |-
              If all the optional fields are left out, the subject is given the permission specified in <tag>, without permission to delegate it, with no expiration date or condition (until the ACL is edited to remove the permission).
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0022"
          - "draft-ietf-spki-cert-structure#R-0155"
          - "draft-ietf-spki-cert-structure#R-0247"
          - "draft-ietf-spki-cert-structure#R-0298"
          - "draft-ietf-spki-cert-structure#R-0299"
          - "draft-ietf-spki-cert-structure#R-0302"
          - "draft-ietf-spki-cert-structure#R-0345"
          - "draft-ietf-spki-cert-structure#R-0424"
          - "draft-ietf-spki-cert-structure#R-0447"
        on_error: "unspecified by source (§2 (TUPLE), §4.7, §6.1, §8.1)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "<5-tuple>"
        also_objects:
          - "<acl-entry>"
        action: "Form a 5-tuple from each ACL entry with `self` as its issuer."
        locator: "§8.1, §6.1"
