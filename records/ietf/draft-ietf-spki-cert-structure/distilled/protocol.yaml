        message: "<signature>"
        action: "Canonicalise and sign as in F-03 steps 6 and 7."
        locator: "§3.8.3, §5, §2"
        kind: "inferred"
        inferred_reason: >-
          §5 does not restate signing. §2 defines a certificate as a signed instrument and §3.8.3
          signs any object, so the same procedure is assumed.
        quotes:
          - at: "§3.8.3"
            source_lines: "1017-1019"
            quote: |-
              One can also sign objects other than certificate bodies, of course. For example, one can form the signature of a file.
          - at: "§2"
            source_lines: "362-363"
            quote: |-
              CERTIFICATE: a signed instrument that empowers the Subject. It contains at least an Issuer and a Subject.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0004"
          - "draft-ietf-spki-cert-structure#R-0064"
          - "draft-ietf-spki-cert-structure#R-0101"
          - "draft-ietf-spki-cert-structure#R-0103"
        on_error: "unspecified by source (§3.8.3, §5)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "issuer"
        to: "prover"
        message: "<name-cert>"
        action: >-
          Deliver it, or publish it where a subject-info field may point (a name certificate
          server).
        locator: "§4.6, §5"
        kind: "inferred"
        inferred_reason: >-
          §4.6 says subject-info might locate a SDSI name certificate server; how certificates reach
          such a server, or anyone else, is not described.
        quotes:
          - at: "§4.6"
            source_lines: "1364-1365"
            quote: |-
              If the subject is a SDSI name, it might give the location of a SDSI name certificate
          - at: "§5"
            source_lines: "1613-1614"
            quote: |-
              Nothing is implied by a name certificate about the principal(s) being named.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0153"
          - "draft-ietf-spki-cert-structure#R-0207"
        on_error: "unspecified by source (§4.6)"
        on_error_basis: "unspecified"
        note: "Nothing is implied about the principal named (§5, quoted)."
  - id: "F-05"
    name: "certificate-discovery"
    title: "The prover tracks down the certificates that empower it and orders them in a <sequence>"
    locator: "§3.8.1, §3.8.3, §4.4, §4.6, §6.2, §8.4"
    kind: "local-with-fetch"
    participants:
      - "prover"
      - "certificate-source"
    summary: >-
      The burden of finding the chain is the prover's. Certificates and keys may carry locations
      that help; no retrieval protocol and no ordering rule for the chain are given.
    steps:
      - n: "1"
        from: "prover"
        to: "prover"
        message: "<cert>"
        field: "issuer-loc"
        action: >-
          Follow issuer-info to the certificates by which each issuer holds the authority it passes
          on.
        locator: "§4.4"
        kind: "stated"
        quotes:
          - at: "§4.4"
            source_lines: "1218-1220"
            quote: |-
              The (issuer-info ) object provides the location of the certificate(s) by which the issuer derives the authority to pass along the authorization in the present <cert>.
          - at: "§4.4"
            source_lines: "1220-1224"
            quote: |-
              We expect the prover (the calling client) to track down such other certificates and provide them to the verifier (the called server), but we allow this information in the certificate to simplify that process for the prover.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0128"
          - "draft-ietf-spki-cert-structure#R-0129"
        on_error: "unspecified by source (§4.4)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "prover"
        to: "prover"
        message: "<cert>"
        field: "subject-loc"
        action: "Follow subject-info to information about a subject, such as the key behind a key hash."
        locator: "§4.6"
        kind: "stated"
        quotes:
          - at: "§4.6"
            source_lines: "1362-1364"
            quote: |-
              This optional field provides the location of information about the subject. For example, if the subject is a hash of a key, this might provide the location of the key being hashed.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0153"
        on_error: "unspecified by source (§4.6)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "prover"
        to: "prover"
        message: "<pub-key>"
        field: "uris"
        action: "Follow a public key's URIs to certificates that empower that key."
        locator: "§3.8.1"
        kind: "stated"
        quotes:
          - at: "§3.8.1"
            source_lines: "792-793"
            quote: |-
              The <uri>s, if present, give locations where one might find certificates empowering that public key.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0092"
        on_error: "unspecified by source (§3.8.1)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "prover"
        to: "certificate-source"
        message: "none"
        message_note: "Retrieval of certificates is not defined."
        action: "Fetch what the URIs name."
        locator: "§3.8.1, §4.4, §4.6"
        kind: "inferred"
        inferred_reason: >-
          No retrieval protocol is defined for certificates or keys; the HTTP remarks of §4.9.3 are
          about online tests.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0457"
        on_error: "Inferred: a chain with a missing link cannot reduce to `self` (E-23)."
        on_error_basis: "inferred"
      - n: "5"
        from: "prover"
        to: "prover"
        message: "<sequence>"
        also_objects:
          - "<hash-op>"
          - "<signature>"
        action: >-
          Order the objects: each signature after the body it signs, and a hash opcode after any
          object a later object refers to by hash (several opcodes when several hashes are needed).
        locator: "§3.8.3, §6.2"
        kind: "stated"
        quotes:
          - at: "§3.8.3"
            source_lines: "1016-1017"
            quote: |-
              A signature object is typically used for a certificate body and typically follows that <cert> object in a <sequence>.
          - at: "§6.2"
            source_lines: "1851-1852"
            quote: |-
              Presumably, that item (certificate body or public key, for example) is referred to by hash in some subsequent object.
          - at: "§6.2"
            source_lines: "1855-1856"
            quote: |-
              However, it would not hurt to use an explicit <hash-op> prior to a <signature>.
          - at: "§6.2"
            source_lines: "1858-1859"
            quote: |-
              If an object will be referenced by different hashes, it can be followed by multiple <hash-op>s.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0102"
          - "draft-ietf-spki-cert-structure#R-0258"
          - "draft-ietf-spki-cert-structure#R-0259"
          - "draft-ietf-spki-cert-structure#R-0260"
          - "draft-ietf-spki-cert-structure#R-0261"
          - "draft-ietf-spki-cert-structure#R-0420"
        on_error: "unspecified by source (§3.8.3, §6.2)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "prover"
        to: "prover"
        message: "<sequence>"
        action: >-
          Order the certificates along the chain. No order is required; a verifier may reduce left
          to right or right to left.
        locator: "§8.4"
        kind: "inferred"
        inferred_reason: >-
          The only remark on direction is §8.4's, about the verifier's algorithm choice; nothing
          binds the prover to an order.
        quotes:
          - at: "§8.4"
            source_lines: "2136-2138"
            quote: |-
              The actual algorithm choices for doing this reduction depend on whether one wants to reduce left-to-right or right-to-left and how much storage a verifier has.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0336"
          - "draft-ietf-spki-cert-structure#R-0429"
        on_error: "unspecified by source (§8.4)"
        on_error_basis: "unspecified"
  - id: "F-06"
    name: "online-test-crl"
    title: "CRL online test: fetch, carry in the sequence, check"
    locator: "§2, §4.9.2, §4.9.3, §7, §7.1"
    kind: "exchange"
    participants:
      - "prover"
      - "online-test-responder"
      - "verifier"
    summary: >-
      In the standard model the prover fetches the CRL and hands it over in the <sequence>; the
      verifier checks its signer, its interval and whether the certificate is listed. The request is
      not specified.
    steps:
      - n: "1"
        from: "prover"
        to: "prover"
        message: "<online-test>"
        also_objects:
          - "<cert>"
        action: "Read the certificate's test: (online crl <uris> <principal> <online-id> <s-part>*)."
        locator: "§4.9.2"
        kind: "stated"
        quotes:
          - at: "§4.9.2"
            source_lines: "1460-1461"
            quote: |-
              <online-test>:: "(" "online" <online-type> <uris> <principal> <online-id> <s-part>* ")" | "(" "online" "new-cert" <uris> ")" ;
          - at: "§4.9.2"
            source_lines: "1462"
            quote: |-
              <online-type>:: "crl" | "reval" | "one-time" ;
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0175"
          - "draft-ietf-spki-cert-structure#R-0176"
          - "draft-ietf-spki-cert-structure#R-0177"
          - "draft-ietf-spki-cert-structure#R-0411"
        on_error: "unspecified by source (§4.9.2)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "prover"
        to: "online-test-responder"
        message: "none"
        message_note: "The CRL request is not defined; it can be a plain HTTP transaction."
        action: >-
          Ask for the CRL at any one of the URIs: a passive web page, a CGI fetch whose parameters
          ride in the URI, or parameters in the test's <s-part>s.
        locator: "§4.9.2, §4.9.3, §7.1"
        kind: "stated"
        quotes:
          - at: "§4.9.2"
            source_lines: "1504"
            quote: |-
              If there are multiple URIs specified, any one of them can be used.
          - at: "§4.9.2"
            source_lines: "1506-1509"
            quote: |-
              If the URI specifies an HTTP connection to the online test, then that URI can provide all parameters needed (e.g., a hash of the certificate in question), but in other cases, one might need to list such parameters in the optional <s-part>s.
          - at: "§4.9.3"
            source_lines: "1518-1520"
            quote: |-
              One can use passive web pages and have the URI fetch the online test result directly. This works for everything but one-time revalidations.
          - at: "§4.9.3"
            source_lines: "1522-1526"
            quote: |-
              One can use CGI-driven HTTP fetches, and allow the CGI code to generate or fetch the online test result specifically for the certificate in question. The URI given in <uris> would include the parameters to that CGI code, so that again the user of the certificate would see just a web page to fetch by HTTP.
          - at: "§7.1"
            source_lines: "1932-1934"
            quote: |-
              The CRL request can be a straight HTTP transaction, using the URI provided in the certificate, but we do not specify online protocols in this draft.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0190"
          - "draft-ietf-spki-cert-structure#R-0191"
          - "draft-ietf-spki-cert-structure#R-0192"
          - "draft-ietf-spki-cert-structure#R-0193"
          - "draft-ietf-spki-cert-structure#R-0194"
          - "draft-ietf-spki-cert-structure#R-0195"
          - "draft-ietf-spki-cert-structure#R-0263"
          - "draft-ietf-spki-cert-structure#R-0279"
        on_error: >-
          unspecified by source (§4.9.2): with several URIs any one may be used; nothing says what
          follows when none answers
        on_error_basis: "unspecified"
        error_paths:
          - "E-09"
      - n: "3"
        from: "online-test-responder"
        to: "prover"
        message: "<crl>"
        also_objects:
          - "<signature>"
        action: >-
          Reply with (crl <version>? (canceled <hash>*) <valid-basic>), signed by the principal the
          test names.
        locator: "§7, §7.1"
        kind: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "1919"
            quote: |-
              <crl>:: "(" "crl" <version>? <cancel-list> <valid-basic> ")" ;
          - at: "§7.1"
            source_lines: "1920"
            quote: |-
              <cancel-list>:: "(" "canceled" <hash>* ")" ;
          - at: "§7.1"
            source_lines: "1929-1930"
            quote: |-
              The <crl> or <delta-crl> must be signed by the principal indicated in the <online-test> field that directed the CRL to be fetched.
          - at: "§7"
            source_lines: "1891-1892"
            quote: |-
              An online test results in a digitally signed object carrying its own date range, explicitly or implicitly.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0262"
          - "draft-ietf-spki-cert-structure#R-0272"
          - "draft-ietf-spki-cert-structure#R-0273"
          - "draft-ietf-spki-cert-structure#R-0278"
        on_error: "unspecified by source (§7, §7.1)"
        on_error_basis: "unspecified"
        note: >-
          How the reply is signed is not shown; this file reads it as a <signature> beside the
          <crl>, as for a certificate.
      - n: "4"
        from: "prover"
        to: "verifier"
        message: "<sequence>"
        also_objects:
          - "<crl>"
        action: "Include the CRL, with its signature, in the <sequence>."
        locator: "§6.2, §7, §4.9.2"
        kind: "stated"
        quotes:
          - at: "§7"
            source_lines: "1899-1901"
            quote: |-
              It is assumed that, except for the one-time test, the prover and not the verifier will fetch any online-test results and then provide those results in the <sequence> being handed to the verifier.
          - at: "§6.2"
            source_lines: "1832-1833"
            quote: |-
              <seq-ent>:: <cert> | <pub-key> | <signature> | <crl> | <delta-crl> | <reval> | <op> ;
          - at: "§4.9.2"
            source_lines: "1477-1479"
            quote: |-
              The crl form tells the verifier (or prover, who fetches this information for the verifier, in our standard model), the current list of invalid certificates.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0181"
          - "draft-ietf-spki-cert-structure#R-0249"
          - "draft-ietf-spki-cert-structure#R-0264"
        on_error: "unspecified by source (§6.2, §7)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "<crl>"
        action: >-
          Check that the CRL is signed by the principal named in the online test of the certificate
          being checked.
        locator: "§4.9.2, §7.1"
        kind: "stated"
        quotes:
          - at: "§4.9.2"
            source_lines: "1470-1471"
            quote: |-
              The reply from an online test is a digitally signed object, validated by the <principal> given in the test specification.
          - at: "§7.1"
            source_lines: "1929-1930"
            quote: |-
              The <crl> or <delta-crl> must be signed by the principal indicated in the <online-test> field that directed the CRL to be fetched.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0179"
          - "draft-ietf-spki-cert-structure#R-0278"
          - "draft-ietf-spki-cert-structure#R-0409"
        on_error: "Inferred: a CRL signed by any other principal cannot satisfy the test."
        on_error_basis: "inferred"
        error_paths:
          - "E-12"
      - n: "6"
        from: "verifier"
        to: "verifier"
        message: "<crl>"
        action: "Check that the CRL is current: the present time lies inside its interval."
        locator: "§7"
        kind: "stated"
        quotes:
          - at: "§7"
            source_lines: "1907"
            quote: |-
              Each of these instruments contains a <valid-basic> time interval.
          - at: "§7"
            source_lines: "1908"
            quote: |-
              The instrument is valid only during that interval
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0267"
          - "draft-ietf-spki-cert-structure#R-0269"
          - "draft-ietf-spki-cert-structure#R-0409"
          - "draft-ietf-spki-cert-structure#R-0421"
        on_error: >-
          Stated: the instrument is valid only during its interval; outside it the test is not
          satisfied by this CRL.
        on_error_basis: "stated"
        error_paths:
          - "E-13"
      - n: "7"
        from: "verifier"
        to: "verifier"
        message: "<crl>"
        action: >-
          Look for the certificate's hash in the canceled list. If it is not there, the certificate
          is presumed valid.
        locator: "§4.9.2, §7.1"
        kind: "stated"
        quotes:
          - at: "§4.9.2"
            source_lines: "1477-1479"
            quote: |-
              The crl form tells the verifier (or prover, who fetches this information for the verifier, in our standard model), the current list of invalid certificates.
          - at: "§4.9.2"
            source_lines: "1479"
            quote: |-
              If the present certificate is not on
          - at: "§4.9.2"
            source_lines: "1487"
            quote: |-
              that list, then the certificate is presumed valid.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0181"
          - "draft-ietf-spki-cert-structure#R-0182"
          - "draft-ietf-spki-cert-structure#R-0409"
          - "draft-ietf-spki-cert-structure#R-0422"
          - "draft-ietf-spki-cert-structure#R-0459"
        on_error: >-
          Inferred from the list being a list of invalid certificates: a listed certificate is
          invalid.
        on_error_basis: "inferred"
        error_paths:
          - "E-10"
        note: >-
          Which bytes are hashed for the list is never said; this file reads it as the canonical
          certificate body as signed (D-19, D-32).
      - n: "8"
        from: "verifier"
        to: "verifier"
        message: "<valid>"
        also_objects:
          - "<valid-basic>"
        action: >-
          Intersect the CRL's validity dates with the certificate's to obtain its current working
          validity.
        locator: "§4.9.2"
        kind: "stated"
        quotes:
          - at: "§4.9.2"
            source_lines: "1471-1475"
            quote: |-
              That object includes validity dates, so that once one has the online test response, its validity dates can be intersected with the parent certificate's validity dates to yield the current working validity dates for the certificate.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0180"
        on_error: "unspecified by source (§4.9.2)"
        on_error_basis: "unspecified"
  - id: "F-07"
    name: "online-test-delta-crl"
    title: "Delta-CRL: a CRL that modifies its predecessor"
    locator: "§7, §7.1, §9.2"
    kind: "exchange"
    participants:
      - "online-test-responder"
      - "prover"
      - "verifier"
    summary: >-
      A responder whose CRL grows may send only a delta naming its predecessor by hash. The source
      gives the object, the signer and the link; it does not say how the predecessor reaches the
      verifier or how the two lists combine.
    steps:
      - n: "1"
        from: "online-test-responder"
        to: "online-test-responder"
        message: "<delta-crl>"
        action: "Decide between a full CRL and a delta; the decision procedure is left open."
        locator: "§7.1"
        kind: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "1916-1917"
            quote: |-
              If one wants to provide CRLs, and that CRL grows, then one may prefer to send only a delta CRL.
          - at: "§7.1"
            source_lines: "1943-1944"
            quote: |-
              The algorithm for choosing between computation and delivery of delta versus full CRL is left open.
          - at: "§7.1"
            source_lines: "1944-1946"
            quote: |-
              This will depend heavily on performance analysis of actual experience for a given validity center.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0271"
          - "draft-ietf-spki-cert-structure#R-0280"
        on_error: "unspecified by source (§7.1)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "online-test-responder"
        to: "prover"
        message: "<delta-crl>"
        also_objects:
          - "<hash>"
          - "<signature>"
        action: >-
          Send (delta-crl <version>? <hash-of-pred> <cancel-list> <valid-basic>), naming the
          predecessor CRL or delta-CRL by hash, preferably with a URI for it, signed by the test's
          principal.
        locator: "§7.1"
        kind: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "1921-1922"
            quote: |-
              <delta-crl>:: "(" "delta-crl" <version>? <hash-of-pred> <cancel-list> <valid-basic> ")" ;
          - at: "§7.1"
            source_lines: "1923"
            quote: |-
              <hash-of-pred>:: <hash> ;
          - at: "§7.1"
            source_lines: "1925-1926"
            quote: |-
              The <hash-of-pred> is the hash of the predecessor CRL or delta-CRL, that this one is modifying.
          - at: "§7.1"
            source_lines: "1926-1927"
            quote: |-
              For convenience, that <hash> should probably also have a URI pointing the user to that predecessor.
          - at: "§7.1"
            source_lines: "1929-1930"
            quote: |-
              The <crl> or <delta-crl> must be signed by the principal indicated in the <online-test> field that directed the CRL to be fetched.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0274"
          - "draft-ietf-spki-cert-structure#R-0275"
          - "draft-ietf-spki-cert-structure#R-0276"
          - "draft-ietf-spki-cert-structure#R-0277"
          - "draft-ietf-spki-cert-structure#R-0278"
        on_error: "unspecified by source (§7.1)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "prover"
        to: "online-test-responder"
        message: "none"
        message_note: "The predecessor fetch is not defined."
        action: "Fetch any predecessor the prover does not hold, back to a full CRL."
        locator: "§7.1"
        kind: "inferred"
        inferred_reason: >-
          The source suggests a URI to the predecessor; it never says who fetches the predecessor or
          that it must be delivered.
        quotes:
          - at: "§7.1"
            source_lines: "1926-1927"
            quote: |-
              For convenience, that <hash> should probably also have a URI pointing the user to that predecessor.
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0263"
          - "draft-ietf-spki-cert-structure#R-0277"
        on_error: "unspecified by source (§7.1)"
        on_error_basis: "unspecified"
        error_paths:
          - "E-14"
      - n: "4"
        from: "prover"
        to: "verifier"
        message: "<sequence>"
        also_objects:
          - "<crl>"
          - "<delta-crl>"
        action: "Include the delta and its predecessors in the <sequence>."
        locator: "§6.2, §7"
        kind: "inferred"
        inferred_reason: >-
          §7 says the prover provides online-test results in the sequence; that predecessors travel
          with a delta is this file's reading.
        quotes:
          - at: "§7"
            source_lines: "1899-1901"
