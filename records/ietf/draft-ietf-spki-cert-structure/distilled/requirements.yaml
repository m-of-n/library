extraction_notes:
  - 'RUNNING HEADER INSIDE TEXTS: bin/_source_text removes each page footer but not this draft''s running header (its HEADER pattern matches an RFC header only), so a text crossing a page holds the header line''s words between the two halves of the sentence. They are the source''s own bytes and bin/check-quotes verifies them; running_header_line names the line on each such entry (R-0093, R-0150, R-0182, R-0200, R-0235, R-0329, R-0352, R-0369, R-0441). If bin/_source_text learns the Internet-Draft header, re-cut exactly these entries.'
  - 'SKELETON SENTENCE SPLITTING: bin/fx1-skeleton''s abbreviation guard matches any word ending in al followed by a full stop (interval, principal, delta-reval), so C-0107, C-0118 and C-0124 each weld two sentences; C-0024 welds at an etc., C-0087 because its second sentence begins with <date>, not a capital, and C-0131 at a section number (5.3). The requirements cut them apart where the sentences bind separately.'
  - 'SKELETON CANDIDATES CUT AT A PAGE: C-0046, C-0065, C-0094 and C-0141 stop at the running header because the blank lines after it read as a paragraph break; their requirements carry the whole sentence (C-0095 holds the stranded last word of C-0094''s sentence).'
  - 'SKELETON LOCATORS: C-0149 and C-0150 (References) and C-0151 (Acknowledgments) are filed under §9.2 because those unnumbered headings are not section boundaries for bin/_source_text.section_of_line; all three are rejected and their texts left as the skeleton wrote them.'
  - 'ABSTRACT: two requirements (R-0001, R-0002) are located in the Abstract (locator Abstract), which bin/check-locators reports as unresolvable (no numbered section), not as misfiled. With the inferred entries they are the whole of its unresolvable list.'
  - 'GLOSSARY: each of the 19 entries of section 2 has its defining sentence carried by a stated entry. Left out, each for a stated reason: lines 359-360 (an expectation: most likely one ACL per resource owner), 404-408 (an example of a local and a fully qualified name), 445-446 (rationale for thresholds), and the rejected candidates C-0003, C-0009 and C-0010.'
  - 'ID ORDER: ids are never renumbered, so the stated entries the completion audit added (R-0438..R-0452) follow the inferred block (R-0386..R-0437) and precede the inferred entries it added (R-0453..R-0459); two more stated entries found by a character-level coverage sweep (R-0460, R-0461) come last. File order is id order, not source order; locator and source_lines give the place.'
  - 'INFERRED ENTRIES carry basis (source lines) instead of source_lines, so bin/check-quotes does not read their own-words text as a quotation; bin/check-locators reports each as unresolvable (not a contiguous span), by design.'
requirements:
  - id: 'draft-ietf-spki-cert-structure#R-0001'
    locator: 'Abstract'
    source_lines: '101-105'
    text: 'The authorization field carried by SPKI certificates and ACLs is left to be defined, to suit each particular application or protocol. SPKI defines rules for combination of authorization fields, constraining the construction of these, but leaves specific details up to the implementer.'
    verb: none
    kind: stated
    actor: 'application-developer'
    object: '<tag>'
    field: 'authorization field content'
    testable: 'no'
    testable_reason: 'assigns the meaning of tags to each application; the combination rules it mentions are tested through §8.2 and §8.3'
  - id: 'draft-ietf-spki-cert-structure#R-0002'
    locator: 'Abstract'
    source_lines: '108-111'
    text: 'The process of reducing SPKI sequences and an ACL to determine an authorization result is spelled out here, but an individual implementer is free to design new reduction algorithms as long as they are computationally equivalent to the one defined here.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '5-tuple reduction'
    field: 'reduction algorithm'
    testable: 'partial'
    testable_reason: 'equivalence is testable only differentially: a new algorithm and the §8.2/§8.3 rules must agree on the same ACL and sequence inputs; it cannot be proved by testing'
  - id: 'draft-ietf-spki-cert-structure#R-0003'
    locator: '§2'
    source_lines: '357-359'
    text: 'An ACL entry has potentially the same content as a certificate body, but has no Issuer (and is not signed).'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<acl-entry>'
    field: 'issuer, signature'
    testable: 'yes'
  - id: 'draft-ietf-spki-cert-structure#R-0004'
    locator: '§2'
    source_lines: '362-363'
    text: 'CERTIFICATE: a signed instrument that empowers the Subject. It contains at least an Issuer and a Subject.'
    verb: none
    kind: stated
    actor: 'issuer'
    object: '<cert>'
    field: '<issuer>, <subject>'
    testable: 'yes'
    candidate: 'C-0002'
  - id: 'draft-ietf-spki-cert-structure#R-0005'
    locator: '§2'
    source_lines: '367-369'
    text: 'An SPKI authorization or attribute certificate can pass along all the empowerment it has received from the Issuer or it can pass along only a portion of that empowerment.'
    verb: none
    kind: stated
    actor: 'issuer'
    object: '<cert>'
    field: '<tag> (the empowerment passed on)'
    testable: 'partial'
    testable_reason: 'passing on a portion is the tag intersection of §8.2/§8.3, tested through those entries'
    candidate: 'C-0004'
  - id: 'draft-ietf-spki-cert-structure#R-0006'
    locator: '§2'
    source_lines: '371-372'
    text: 'CANONICAL S-EXPRESSION: an encoding of an S-expression that does not permit equivalent representations and is designed for easy parsing.'
    verb: none
    kind: stated
    actor: 'encoder'
    object: 'canonical S-expression'
    field: 'encoding'
    testable: 'partial'
    testable_reason: 'uniqueness is a property of the whole encoding; tested by parse-then-re-encode reproducing the input bytes (see R-0386)'
    candidate: 'C-0005'
  - id: 'draft-ietf-spki-cert-structure#R-0007'
    locator: '§2'
    source_lines: '374-375'
    text: 'FULLY QUALIFIED NAME: a local name together with a global identifier defining the name space in which that local name is defined.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<fq-name>'
    field: 'global identifier + local name'
    testable: 'partial'
    testable_reason: 'a definition; tested through the <fq-name> production and name reduction'
  - id: 'draft-ietf-spki-cert-structure#R-0008'
    locator: '§2'
    source_lines: '377-379'
    text: 'GLOBAL IDENTIFIER: a globally unique byte string, associated with the keyholder. In SPKI this is the public key itself, a collision-free hash of the public key or a Fully Qualified Name.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<principal>, <fq-name>'
    field: 'global identifier'
    testable: 'no'
    testable_reason: 'global uniqueness of an identifier is a property of key generation and hashing, not of any one implementation'
  - id: 'draft-ietf-spki-cert-structure#R-0009'
    locator: '§2'
    source_lines: '381-384'
    text: 'HASH: a cryptographically strong hash function, assumed to be collision resistant. In general, the hash of an object can be used wherever the object can appear. The hash serves as a name for the object from which it was computed.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<hash>'
    field: 'hash substitution'
    testable: 'partial'
    testable_reason: 'the grammar admits a hash only where a production names one (<hash-of-key>, <obj-hash>, <hash-of-pred>, CRL and reval lists), which is narrower than wherever'
  - id: 'draft-ietf-spki-cert-structure#R-0010'
    locator: '§2'
    source_lines: '382-383'
    text: 'In general, the hash of an object can be used wherever the object can appear.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<hash>'
    field: 'hash in place of the object'
    testable: 'partial'
    testable_reason: 'the grammar admits a hash only where a production names one (<hash-of-key>, <obj-hash>, <hash-of-pred>, CRL and reval lists), which is narrower than wherever'
    split_of: 'draft-ietf-spki-cert-structure#R-0009'
    candidate: 'C-0006'
  - id: 'draft-ietf-spki-cert-structure#R-0011'
    locator: '§2'
    source_lines: '383-384'
    text: 'The hash serves as a name for the object from which it was computed.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<hash>'
    field: 'hash as a name'
    testable: 'partial'
    testable_reason: 'the grammar admits a hash only where a production names one (<hash-of-key>, <obj-hash>, <hash-of-pred>, CRL and reval lists), which is narrower than wherever'
    split_of: 'draft-ietf-spki-cert-structure#R-0009'
  - id: 'draft-ietf-spki-cert-structure#R-0012'
    locator: '§2'
    source_lines: '386-387'
    text: 'ISSUER: the signer of a certificate and the source of empowerment that the certificate is communicating to the Subject.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<issuer>'
    field: 'signer'
    testable: 'partial'
    testable_reason: 'that the signer is the issuer is never stated as a check; see R-0397'
  - id: 'draft-ietf-spki-cert-structure#R-0013'
    locator: '§2'
    source_lines: '394'
    text: 'NAME: a SDSI name always relative to the definer of some name space.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<name>'
    field: 'name space'
    testable: 'partial'
    testable_reason: 'a definition; tested through the <name> productions and name reduction'
    candidate: 'C-0007'
  - id: 'draft-ietf-spki-cert-structure#R-0014'
    locator: '§2'
    source_lines: '410-414'
    text: 'ONLINE TEST: one of three forms of validity test: (1) CRL; (2) revalidation; or (3) one-time revalidation. Each refines the date range during which a given certificate or ACL entry is considered valid, although the last defines a validity interval of effectively zero length.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<online-test>'
    field: 'online test forms'
    testable: 'partial'
    testable_reason: 'the glossary lists three forms where §4.9.2 defines four (SD-24)'
  - id: 'draft-ietf-spki-cert-structure#R-0015'
    locator: '§2'
    source_lines: '411-414'
    text: 'Each refines the date range during which a given certificate or ACL entry is considered valid, although the last defines a validity interval of effectively zero length.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<online-test>'
    field: 'effect on validity'
    testable: 'partial'
    testable_reason: 'the glossary lists three forms where §4.9.2 defines four (SD-24)'
    split_of: 'draft-ietf-spki-cert-structure#R-0014'
    candidate: 'C-0008'
  - id: 'draft-ietf-spki-cert-structure#R-0016'
    locator: '§2'
    source_lines: '420-423'
    text: 'PROVER: the entity that wishes access or that digitally signs a document. The Prover typically sends a message or opens a channel to the Verifier that then checks signatures and credentials sent by the Prover.'
    verb: none
    kind: stated
    actor: 'verifier'
    object: '<sequence>'
    field: 'signatures and credentials'
    testable: 'partial'
    testable_reason: 'the verifier''s duty to check signatures is carried here and made explicit in R-0397'
