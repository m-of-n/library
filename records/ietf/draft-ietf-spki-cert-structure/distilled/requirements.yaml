    text: 'The draft never says how the prover''s request is checked against the reduced <self,prover,D,A,V>. The reading consistent with sections 8.2 and 8.3: the verifier writes the request as a tag with no *-forms and grants it only when that tag intersected with A is the request tag itself, the tuple''s subject is the key that made the request, and V holds at the time of the decision (or is now). Any other outcome, null included, is a denial.'
