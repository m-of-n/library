  - id: 'draft-ietf-spki-cert-structure#R-0386'
    locator: '§3.1'
    basis: '552-555, 371-372'
    text: 'A canonical-form parser rejects a length prefix with a leading 0 digit (other than the lone 0 of an empty string), a length not followed by a colon, and a length that runs past the end of the input. Accepting any of them admits a second encoding of the same S-expression, which defeats the uniqueness that hashing and signing rely on.'
    verb: none
    kind: inferred
    actor: 'parser'
    object: 'canonical S-expression'
    field: 'length prefix'
    testable: 'yes'
    notes: 'inferred: the draft does not state this; own words, grounded in lines 552-555, 371-372'
  - id: 'draft-ietf-spki-cert-structure#R-0387'
    locator: '§3.1'
    basis: '545-546, 702-704, 711-715'
    text: 'Canonical form carries no white space, no length-less tokens, no quoted, #hex# or |base64| strings and no {...} wrapper. A canonical parser rejects all of them; a party that accepts advanced or transport input converts it to canonical form before it hashes or verifies anything.'
    verb: none
    kind: inferred
    actor: 'parser'
    object: 'canonical S-expression'
    field: 'excluded advanced features'
    testable: 'yes'
    notes: 'inferred: the draft does not state this; own words, grounded in lines 545-546, 702-704, 711-715'
  - id: 'draft-ietf-spki-cert-structure#R-0388'
    locator: '§3.2'
    basis: '581-585, 1451-1454, 2116-2117'
    text: 'Two byte strings are equal only when their bytes are equal and their display types are equal, where no display type equals only no display type. The rule applies to every comparison the draft makes: tag intersection, name matching in reduction, date comparison and hash values.'
    verb: none
    kind: inferred
    actor: 'implementation'
    object: '<byte-string>'
    field: 'equality'
