ion, 103 entries: the 66 productions of sections 3-8 once each (one, the basic-form <subj-obj> of 4.5, is R-0133, a split child of R-0132), and the 37 of section 9.2 that exist only there or differ from the section text; the other 51 of section 9.2''s 88 productions are identical to a section production and are carried by that entry, which names their full 9.2 line range in repeated_in; (c) the canonical-encoding rules of 3.1-3.6 (length prefix, byte strings, display types, integers, advanced and transport forms); (d) the reduction rules: name reduction 5.3, the 5-tuple rule and intersections of 8.2-8.4, result certificates 8.7; (e) the validity and online-test rules of 4.9 and section 7; (f) definitions that bind interpretation (the defining sentence of each of the 19 glossary entries of section 2, and 9.1) and explicit disclaimers of scope; (g) inferred rules an implementer needs and the draft never states, kind: inferred, each with its basis lines. CANDIDATES: 151, every one with a verdict: 110 stated, carried verbatim through 111 candidate links (C-0118 welds two sentences, carried by R-0267 and R-0268; R-0200 carries C-0094 and C-0095), and 41 rejected with a reason; none is inferred. The recital itself is quoted by no entry: bin/validate counts entry texts with the boilerplate filter off, so quoting it would add 10 phantom keywords. 9 entry texts cross a page and carry the running header''s words (R-0093, R-0150, R-0182, R-0200, R-0235, R-0329, R-0352, R-0369, R-0441); see extraction_notes.'
