lowercase_modals:
  policy: 'Lines 39-41 declare RFC 2119 and quote its 10 keywords in capitals; no capitalised keyword occurs anywhere else, and every obligation is written in lower case. RFC 2119 (1997), the only BCP 14 document when this draft was written (26 July 1999), says the words are often capitalised but does not make capitals a condition of their force; RFC 8174 (2017), now part of BCP 14, gives the special meaning to capitalised words only, and docs/requirements.md section 2 follows RFC 8174. Read by its own declaration a lowercase must here may carry RFC 2119 force; read under today''s BCP 14 it has its ordinary English sense. This file does not choose. DECISION: (1) verb is none on every entry: there is no capitalised keyword to state, and promoting a lowercase word to a keyword would invent one (bin/validate also rejects a verb that is not in its text). (2) Every binding sentence is extracted all the same, kind: stated, verbatim, so completeness does not depend on the choice. (3) The lowercase BCP 14 word or words a stated text carries are recorded as printed in modal (in order of first appearance), and how they are used in modal_sense: deontic (an obligation, permission or prohibition on an actor or a structure), descriptive (a grammar element said to be optional), epistemic (possibility or expectation, no force), or meta (the BNF metalanguage). A reader taking the 1999 reading selects modal_sense deontic and reads modal as the RFC 2119 keyword it spells; a reader under RFC 8174 treats every entry as unkeyworded. The same treatment governs normative.md. Both fields are additions: bin/validate checks kind, verb, source_lines and candidate links on a skeleton-generated file and leaves other keys alone.'
