    locator: '§8.2'
    basis: '381-384, 1206, 1854-1855, 2014-2017, 2059-2060'
    text: 'In s1 = i2 two principals are equal when they designate the same public key, whatever form each is written in: the key itself, or a <hash-of-key> under any algorithm. Equal hash values under one algorithm match directly; a key matches a hash of it once the key''s canonical form is hashed; hashes under two different algorithms match only through the key they resolve to. Comparing the two encodings as byte strings would split one principal into several.'
