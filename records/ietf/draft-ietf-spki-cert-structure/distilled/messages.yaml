        source_lines: "L545-548"
        quote: "All SPKI structures communicated from one machine to another must be in canonical form. If canonical S-expressions need to be transmitted over a 7-bit channel, there is a form defined for base64 encoding them."
      - locator: "§3.1"
        source_lines: "L550-555"
        quote: "A canonical S-expression is formed from binary byte strings, each prefixed by its length, plus the punctuation characters \"()[]\". The length of a byte string is a non-negative ASCII decimal number, with no unnecessary leading \"0\" digits, terminated by \":\". The canonical form is a unique representation of an S-expression and is used as the input to all hash and signature functions."
    fields:
      - name: "length"
        type: "ASCII decimal"
        required: true
        encoding: "non-negative decimal digits, no unnecessary leading 0, then the byte 0x3A (:)"
        note: "A string of length 0 is the single digit 0; a longer length may not start with 0 (BNF <decimal>)."
        constrained_by:
          - "draft-ietf-spki-cert-structure#R-0037"
          - "draft-ietf-spki-cert-structure#R-0386"
