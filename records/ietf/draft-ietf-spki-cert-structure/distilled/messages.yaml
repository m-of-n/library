source: "draft-ietf-spki-cert-structure-06 (Ellison et al., 26 July 1999), source of record .cache/draft-ietf-spki-cert-structure.source.txt. Quotes and line numbers are from .cache/draft-ietf-spki-cert-structure.txt (sha256 7542050ffd8658c90b22564b34e8ad1b452b125e396423b1e77b2af7f19f33de), the same file with only its section headings normalised by distilled/render-source.py: same line numbers, same body lines."
extracted: "2026-11-09"
extracted_by: "FX-1 pass 1 (extract), schema+examples+messages agent, claude-sonnet-5-5, from the source only"
applicability: "A pure data format. The draft defines the wire shape of SPKI objects as S-expressions: the canonical, advanced and base64 transport forms (section 3), keys, hashes and signatures (3.8), the authorization certificate and its fields (4), the name certificate (5), the ACL and the sequence (6), the online-test replies CRL, delta-CRL and revalidation (7), and the internal 5-tuple (8.1). Section 9 collects the BNF. Key parameter lists (RSA, DSA) are defined only by example, the elliptic-curve key format is an unfinished author note, and private-key has no BNF. The 5-tuple is not a wire object. Out of scope: reduction rules (8.2 onward), online-test fetch protocols (4.9.3) and the companion theory document."
note: "Conventions. (1) One entry per section 9.2 production (88), then entries this file adds for things the draft prints outside 9.2 or defines only by example. (2) Structure (fields, required, repetition, canonical layout, used_by) is derived by script from the verbatim section 9.2 grammar (schema/bnf-s9-2-alphabetical.verbatim.bnf); where a section 3-8 fragment disagrees with 9.2 the entry carries source_defect and the fragment is quoted in bnf or bnf_restated. (3) quote beside source_lines is cut from the source by script, never typed; locator names the section the lines fall in. A quote that crosses a page break includes the running header line, because bin/_source_text keeps it. (4) canonical_layout renders each quoted string as <length>:<bytes>, per the section 9 intro; spaces are notation only, canonical form has none. The five lexical rules (bytes, decimal, ddigit, nzddigit, display-type) are the exception: their literals are the canonical form's own raw characters (digits, colon, brackets), not byte strings (section 3.1, L550-553). (5) minimal_instance is the smallest object the section 9.2 grammar accepts, built and checked by script with schema/spki_bnf.derived.py; it is derived and illustrates, it does not exercise every optional part. (6) required and repeat describe the BNF, not prose; where prose adds a constraint it is in note or prose. (7) inferred: true marks anything read off an example or not stated. (8) constrained_by lists draft-ietf-spki-cert-structure#R-NNNN ids from requirements.yaml. The draft has zero BCP 14 keywords, so ids come from stated or inferred requirements about lower-case must, may and should binding text. A production requirement (text beginning <name>::) constrains the message it defines and each field named on its right-hand side; prose and inferred requirements are wired where they are the rule for that message or field. Every message, field and encoding rule carries at least one id; the counts are in coverage.constrained_by_status. (9) Examples are E-ids from examples/README.md."
encoding_rules:
  - id: "ENC-01"
    rule: "Canonical form: each byte string is its decimal length, a colon, then the raw octets; the length has no unnecessary leading 0."
    locator: "§3.1"
    source_lines: "L550-553"
    quote: "A canonical S-expression is formed from binary byte strings, each prefixed by its length, plus the punctuation characters \"()[]\". The length of a byte string is a non-negative ASCII decimal number, with no unnecessary leading \"0\" digits, terminated by \":\"."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0036"
      - "draft-ietf-spki-cert-structure#R-0037"
      - "draft-ietf-spki-cert-structure#R-0386"
  - id: "ENC-02"
    rule: "Byte strings are binary and carry explicit lengths; any character set encoding may be used."
    locator: "§3.2"
    source_lines: "L564-566"
    quote: "All byte strings carry explicit lengths and are therefore not 0-terminated as in the C language. They are treated as binary even when they are ASCII, and can use any character set encoding desired."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0042"
      - "draft-ietf-spki-cert-structure#R-0043"
  - id: "ENC-03"
    rule: "A display type belongs to the string for equality and hashing."
    locator: "§3.2"
    source_lines: "L581-585"
    quote: "Although the display type of a byte string is optional, it is considered part of the string for any equality comparisons or hashing. That is, two strings with the same bytes will not be considered equal (or otherwise comparable) if they have unequal display types."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0045"
      - "draft-ietf-spki-cert-structure#R-0046"
      - "draft-ietf-spki-cert-structure#R-0388"
  - id: "ENC-04"
    rule: "Integers are signed two's complement, most significant byte first; a leading 0x00 or 0xFF may be needed, redundant sign bytes need not be."
    locator: "§3.2.1"
    source_lines: "L609-612"
    quote: "The bytes of a binary integer are twos-complement, in network standard order (most significant byte first). On the assumption that they are signed, a leading 0x00 or 0xFF byte may need to be present, but redundant bytes of sign need not be."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0056"
      - "draft-ietf-spki-cert-structure#R-0057"
      - "draft-ietf-spki-cert-structure#R-0389"
  - id: "ENC-11"
    rule: "The integer 0 is one 0x00 byte, not the empty string."
    locator: "§3.2.1"
    source_lines: "L614-615"
    quote: "The integer value 0 is expressed as a 1-byte string holding the 0 byte, not as the empty string \"\"."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0058"
  - id: "ENC-05"
    rule: "No empty lists; the first element of every list is a byte string."
    locator: "§3"
    source_lines: "L523-524"
    quote: "with the restrictions that no empty lists are allowed and that each list must have a byte string as its first element."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0018"
      - "draft-ietf-spki-cert-structure#R-0019"
      - "draft-ietf-spki-cert-structure#R-0028"
      - "draft-ietf-spki-cert-structure#R-0029"
      - "draft-ietf-spki-cert-structure#R-0030"
  - id: "ENC-06"
    rule: "Parts are positional; only trailing parts may be dropped, except in cert and acl."
    locator: "§3.8"
    source_lines: "L770-773"
    quote: "That is, their parts are listed in some fixed order with meaning of the part depending on its position. Parts can be omitted only by omitting a contiguous set of trailing parts. Exceptions to this are found in the top level <cert> and <acl> constructs."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0081"
      - "draft-ietf-spki-cert-structure#R-0082"
      - "draft-ietf-spki-cert-structure#R-0083"
  - id: "ENC-07"
    rule: "The canonical form is what is hashed and signed."
    locator: "§3.5"
    source_lines: "L675-678"
    quote: "The canonical S-expression is the form which is hashed for both generating and verifying signatures. These two processes can be thought of as the start and end of an SPKI object's useful life and both require canonical form."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0038"
      - "draft-ietf-spki-cert-structure#R-0039"
      - "draft-ietf-spki-cert-structure#R-0040"
      - "draft-ietf-spki-cert-structure#R-0064"
  - id: "ENC-08"
    rule: "Object type names are case-sensitive; the usual shape is lower case letters, digits and hyphens."
    locator: "§3.8"
    source_lines: "L759-762"
    quote: "It is standard SPKI/SDSI practice to use names starting with a lower case letter, followed by lower case letters, digits and hyphens for object types. SPKI/SDSI is case-sensitive, so the byte-string \"RSA\" is not the same as \"rsa\"."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0077"
      - "draft-ietf-spki-cert-structure#R-0078"
      - "draft-ietf-spki-cert-structure#R-0393"
  - id: "ENC-09"
    rule: "Dates are 19-octet ASCII strings YYYY-MM-DD_HH:MM:SS in UTC, compared as byte strings."
    locator: "§4.9.1"
    source_lines: "L1445-1449"
    quote: "A date field is an ASCII byte string of the form: YYYY-MM-DD_HH:MM:SS always UTC. For internal use, it is treated as a normal byte string."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0172"
      - "draft-ietf-spki-cert-structure#R-0174"
      - "draft-ietf-spki-cert-structure#R-0408"
  - id: "ENC-10"
    rule: "Section 9's BNF is described as canonical with explicit lengths, but is printed with unprefixed quoted strings."
    locator: "§9"
    source_lines: "L2230-2232"
    quote: "The following is the BNF of canonical forms and includes lengths for each explicit byte string. So, for example, \"cert\" is expressed as \"4:cert\"."
    constrained_by:
      - "draft-ietf-spki-cert-structure#R-0344"
source_defects:
  - id: "SD-01"
    title: "Version: prose says alphanumeric string, BNF says <integer>, and the default is the string \"0\""
    evidence:
      - locator: "§4.1"
        source_lines: "L1171-1174"
        quote: "Version numbers are alphanumeric strings. If the <version> field is missing from an object, it is assumed to be (version \"0\"), which is the version of all objects in this draft. Elaboration of version numbers, possibly with multiple fields, are left for later to define."
      - locator: "§4.1"
        source_lines: "L1169"
        quote: "<version>:: \"(\" \"version\" <integer> \")\" ;"
    effect: "(version \"0\") has the byte string 0x30 as its value. Read as <integer> (two's complement) that is 48, not 0. Checked by spki_sexp.derived.py decode_integer. A reader must choose: compare the bytes, or the integer."
  - id: "SD-02"
    title: "<dsa-sig-val> names dsa-sha1-sig; the DSA sample signature and the general <sig-val> use dsa-sha1; <dsa-sig-val> is unreferenced"
    evidence:
      - locator: "§9.2"
        source_lines: "L2277-2285"
        quote: "<dsa-sig-val>:: \"(\" \"dsa-sha1-sig\" \"(\" \"r\" <byte-string> \")\" \"(\" \"s\" INTERNET-DRAFT Simple Public Key Certificate 26 July 1999 <byte-string> \")\" \")\" ;"
      - locator: "§3.8.3.2"
        source_lines: "L1095-1096"
        quote: "(dsa-sha1 (r"
    effect: "A signature built from <dsa-sig-val> would not match <sig-val> with <pub-sig-alg-id> dsa-sha1. Sample E18 follows <sig-val>."
  - id: "SD-03"
    title: "<online-test>: section 4.9.2 and section 9.2 differ (online-id, new-cert)"
    evidence:
      - locator: "§4.9.2"
        source_lines: "L1460-1461"
        quote: "<online-test>:: \"(\" \"online\" <online-type> <uris> <principal> <online-id> <s-part>* \")\" | \"(\" \"online\" \"new-cert\" <uris> \")\" ;"
      - locator: "§9.2"
        source_lines: "L2318-2319"
        quote: "<online-test>:: \"(\" \"online\" <online-type> <uris> <principal> <s-part>* \")\" ;"
    effect: "4.9.2 requires (id ...) after the principal and defines a second form (online new-cert <uris>); 9.2 has neither, and <online-id> is not defined in 9.2. Under 9.2 an (id ...) is just another <s-part>, and the new-cert form is rejected. See schema/bnf-comparison.derived.txt."
  - id: "SD-04"
    title: "<seq-ent>: section 6.2 omits <name-cert> and lists alternatives in another order"
    evidence:
      - locator: "§6.2"
        source_lines: "L1832-1833"
        quote: "<seq-ent>:: <cert> | <pub-key> | <signature> | <crl> | <delta-crl> | <reval> | <op> ;"
      - locator: "§9.2"
        source_lines: "L2334-2342"
        quote: "<seq-ent>:: <cert> | <name-cert> | <pub-key> | <signature> | <op> | INTERNET-DRAFT Simple Public Key Certificate 26 July 1999 <reval> | <crl> | <delta-crl> ;"
    effect: "Under 6.2 a name certificate cannot appear in a sequence; under 9.2 it can. A name certificate such as sample E25 cannot be placed in a sequence under 6.2."
  - id: "SD-05"
    title: "<reval> has three right-hand sides; <subj-hash> is defined in 9.2 and used only by the 7.3 <reval>"
    evidence:
      - locator: "§7.2"
        source_lines: "L1952"
        quote: "<reval>:: \"(\" \"reval\" <version>? <reval-list> <valid-basic> \")\" ;"
      - locator: "§7.3"
        source_lines: "L1973"
        quote: "<reval>:: \"(\" \"reval\" <version>? <subj-hash> <one-valid> \")\" ;"
      - locator: "§9.2"
        source_lines: "L2331"
        quote: "<reval>:: \"(\" \"reval\" <version>? <reval-hash-list> <reval-body> \")\" ;"
      - locator: "§9.2"
        source_lines: "L2348"
        quote: "<subj-hash>:: \"(\" \"cert\" <hash> \")\" ;"
    effect: "7.2 gives reval-list + valid-basic, 7.3 gives subj-hash + one-valid, 9.2 gives reval-hash-list + reval-body (one-valid or valid-basic). Under 9.2 the one-time reply must still carry a non-empty hash list and has no (cert <hash>) form."
  - id: "SD-06"
    title: "<subject5>: <fq-name5> undefined; threshold named <threshold-subj> in 8.1 and <subj-thresh> in 4.5.3 and 9.2"
    evidence:
      - locator: "§8.1"
        source_lines: "L2031"
        quote: "<subject5>:: <key5> | <obj-hash> | <keyholder> | <threshold-subj> ;"
      - locator: "§9.2"
        source_lines: "L2353-2354"
        quote: "<subject5>:: <key5> | <fq-name5> | <obj-hash> | <keyholder> | <subj-thresh> ;"
    effect: "Section 8.1 lists no name alternative; 9.2 lists an undefined <fq-name5>. The 8.4 heading calls the construct (subject (threshold ..)) while the BNF object is k-of-n."
  - id: "SD-07"
    title: "<tag-body5> uses <tag-body>, which no section defines; 9.2 uses <tag-expr>"
    evidence:
      - locator: "§8.1"
        source_lines: "L2039"
        quote: "<tag-body5>:: <tag-body> | \"null\" ;"
      - locator: "§9.2"
        source_lines: "L2356"
        quote: "<tag-body5>:: <tag-expr> | \"null\" ;"
    effect: "Read 8.1's <tag-body> as 9.2's <tag-expr> (the draft's own pointer, 4.8: see the full BNF section for the full tag body BNF). That is an inference."
  - id: "SD-08"
    title: "The section 5.3 name certificate samples put (not-after ...) directly in the certificate, not inside (valid ...)"
    evidence:
      - locator: "§5.3"
        source_lines: "L1698-1702"
        quote: "(cert (issuer (name (hash md5 |Txoz1GxK/uBvJbx3prIhEw==|) fred)) (subject (hash md5 |Z5pxCD64YwgS1IY4Rh61oA==|)) (not-after \"2001-01-01_00:00:00\"))"
      - locator: "§5.1"
        source_lines: "L1636-1637"
        quote: "<name-cert>:: \"(\" \"cert\" <version>? <cert-display>? <issuer-name> <subject> <valid>? <comment>? \")\" ;"
    effect: "<name-cert> allows <valid>? and <valid> wraps its bounds in (valid ...). Samples E25, E26 (same object, base64) and E29 do not parse as <name-cert>; the parser stops at token 23 of 27. They parse as S-expressions."
  - id: "SD-09"
    title: "<cert> field order: the BNF fixes it, the prose says any order is fine"
    evidence:
      - locator: "§3.8"
        source_lines: "L771-773"
        quote: "Parts can be omitted only by omitting a contiguous set of trailing parts. Exceptions to this are found in the top level <cert> and <acl> constructs."
      - locator: "§3.8"
        source_lines: "L776-782"
        quote: "Note that the main object, <cert>, is sub-type based so the parameter fields may be in any order, but the BNF suggests a fixed order. We use the BNF definition to indicate that there may not be more than one of each of the listed fields, and also to suggest (for readability) that the certificate parts be presented in the order given. This document will use that order."
    effect: "A reader must pick: reject other orders (the BNF) or accept them (sub-type based parameters). The derived checker follows the BNF."
  - id: "SD-10"
    title: "<subj-thresh>: K < N and exactly N subjects listed are prose-only; the BNF takes any number"
    evidence:
      - locator: "§4.5.3"
        source_lines: "L1289"
        quote: "where K < N, and there are N <subj-obj> subjects listed."
      - locator: "§4.5.3"
        source_lines: "L1287"
        quote: "<subj-thresh>:: \"(\" \"k-of-n\" <k-val> <n-val> <subj-obj>* \")\" ;"
    effect: "<subj-obj>* accepts zero subjects and any K. spki_bnf.derived.py semantic_issues checks both constraints."
  - id: "SD-11"
    title: "Section 9.2 defines <dsa-sig-val>, <hash-list> and <subj-hash>, which no 9.2 production uses (7.3 uses <subj-hash>)"
    evidence:
      - locator: "§9.2"
        source_lines: "L2290"
        quote: "<hash-list>:: \"(\" \"canceled\" <hash>* \")\" ;"
      - locator: "§9.2"
        source_lines: "L2268"
        quote: "<crl-hash-list>:: \"(\" \"canceled\" <hash>* \")\" ;"
    effect: "<hash-list> and <crl-hash-list> have the same right-hand side; only <crl-hash-list> is used."
  - id: "SD-12"
    title: "<subj-obj> is defined twice in section 4.5 with different right-hand sides"
    evidence:
      - locator: "§4.5"
        source_lines: "L1232-1233"
        quote: "<subj-obj>:: <principal> | <name> | <obj-hash> | <keyholder> | <subj-thresh> ;"
      - locator: "§4.5"
        source_lines: "L1237"
        quote: "<subj-obj>:: <principal> ;"
    effect: "The second is the stated 'most basic form' for implementations that skip names. Two productions with one name; 9.2 keeps only the full one."
  - id: "SD-13"
    title: "(tag (*)) and (tag (* set ...)) match two productions each"
    evidence:
      - locator: "§9.2"
        source_lines: "L2362"
        quote: "<tag-star>:: \"(\" \"tag\" \"(*)\" \")\" ;"
      - locator: "§9.2"
        source_lines: "L2347"
        quote: "<simple-tag>:: \"(\" <byte-string> <tag-expr>* \")\" ;"
      - locator: "§9.2"
        source_lines: "L2361"
        quote: "<tag-set>:: \"(\" \"*\" \"set\" <tag-expr>* \")\" ;"
    effect: "<tag-star> and <simple-tag> (type *) both derive (tag (*)); <tag-set> and <simple-tag> both derive (tag (* set a b)). Counted by script: two derivations each (schema test AMBIG). Malformed star forms such as (* prefix) with no string also parse as <simple-tag>."
  - id: "SD-14"
    title: "Sample RSA signature E17 does not verify as PKCS#1 v1.5"
    evidence:
      - locator: "§3.8.3.2"
        source_lines: "L1062-1063"
        quote: "(rsa-pkcs1-sha1 |UN0g7"
    effect: "Raising the signature to the printed exponent modulo the printed modulus gives a 128-octet block that does not start 00 01 ff... ; it holds 003021300906052b0e03021a05004014 followed by the printed hash, where a SHA-1 DigestInfo has 05000414. The block ends with the printed hash. Sample E18 (DSA) verifies. See examples/README.md."
  - id: "SD-15"
    title: "Section 9 says its BNF is canonical with lengths, but prints plain quoted strings"
    evidence:
      - locator: "§9"
        source_lines: "L2230-2232"
        quote: "The following is the BNF of canonical forms and includes lengths for each explicit byte string. So, for example, \"cert\" is expressed as \"4:cert\"."
    effect: "Strings in 9.2 are not length-prefixed and (*) is written as one literal. A canonical-form reader must derive the layout (canonical_layout here does) and must read (*) as the list (1:*)."
  - id: "SD-16"
    title: "Section numbers jump from 8.4 to 8.7"
    evidence:
      - locator: "§8.4"
        source_lines: "L2126"
        quote: "8.4. Reduction of (subject (threshold ..))"
      - locator: "§8.7"
        source_lines: "L2142"
        quote: "8.7. Certificate Result Certificates"
    effect: "Sections 8.5 and 8.6 do not exist."
  - id: "SD-17"
    title: "Section 3.8.1.3 (elliptic-curve DSA keys) is an unfinished author note"
    evidence:
      - locator: "§3.8.1.3"
        source_lines: "L989-991"
        quote: "Invent a scheme here and pass it by Certicom and Burt -- to define S-expressions for field element, compressed EC point, basis choice, EC curve, ...."
    effect: "No ECDSA public-key, private-key or signature format is defined."
  - id: "SD-18"
    title: "Section 7 opens with an unresolved author question"
    evidence:
      - locator: "§7"
        source_lines: "L1888-1889"
        quote: "should I have an ID for a CRL or reval thread or let the public key signing the instrument be the ID for it?"
    effect: "Whether a CRL or revalidation thread has an identifier is open; no object carries one."
