        source_lines: "L697-704"
        quote: "[SEXP] includes a general purpose utility program for converting between canonical and advanced S-expression form. In the advanced form, individual byte strings may be expressed without length fields (if they are what most languages consider text tokens), may be written as quoted strings (under normal C string rules), or may be individually hex or base64 encoded. Also in the advanced form, white space between list elements is allowed for readability and ignored on conversion to canonical form."
      - locator: "§3.6"
        source_lines: "L711-715"
        quote: "In these examples, we will use keywords without preceding length fields, quoted strings, hex values (delimited by \"#\") and base64 values (delimited by \"|\"). Those are features of the advanced transport form of an S-expression, and are not part of the canonical form."
