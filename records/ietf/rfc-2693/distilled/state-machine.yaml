      - id: M04-T10
        from: no-current-crl
        to: revoked
        trigger: clock-passes-crl-not-before
        guard: "As M04-T09, but the CRL lists the certificate."
        action: "Emit online-test-fails."
        source:
          - locator: "§5.2"
            quote: "That is, one may not issue a new CRL to take effect before the expiration of the CRL currently deployed."
        inferred: true
        inferred_reason: "As M04-T09."
        constrained_by:
