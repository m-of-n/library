record: rfc-2693
reviewed_by: ""
kind: state-machine
source: "RFC 2693, SPKI Certificate Theory, Experimental, September 1999"
source_digest: "6822d668195c3d9b391f0c4f2b023341ba0e5a72e59d63c366a520de42c99098"
extracted: "2026-10-11"
extracted_by: "claude, FX-1 pass 1 (extract), state-machine agent, effort max, from the source text only"
note: >-
  Every lifecycle RFC 2693 describes, as machines an implementation or a test
  harness can drive. RFC 2693 is the theory document of SPKI and contains no
  BCP 14 keywords; a lowercase "must" inside a quote below is not one. Each
  transition's constrained_by lists the rfc-2693#R-NNNN entries at the same
  locator whose text contains one of its source quotes, is contained in one,
  or (for the split entries R-0157 and R-0237) holds its opening part; it was
  wired in the cross-check pass. A transition whose constrained_by is empty
  quotes only text requirements.yaml excludes: the §5.1 anti-matter
  background (M04-T06, M10-T01 to M10-T05) and the §7.6 revocation-service
  account (M14-T02, M14-T05, M14-T07, M14-T08).
  §6 calls its own processing plan "an example that may be followed"; M01,
  M02, M11, M12 and M13 model that plan, which is also the only statement in
  the source of how an authorization result is computed.

  Quotes. Every quote is one contiguous run of source characters with the RFC
  line wrapping undone: a line break, the blank lines inside a displayed
  formula, and the indent that follows become one space, and a line-final
  hyphen joins the next line with no space (so "one-" then "time" reads
  "one-time"). Spacing within a line, including the two spaces the RFC puts
  after a full stop, is kept as in the source. No quote crosses a page break
  and no two passages are spliced.
  A quote is reused where one sentence supports several transitions.

  Flags and fields. inferred: true marks a state or transition the source does
  not literally state. On a transition, inferred_reason says what was supplied
  and the quote is the text it rests on; a state's meaning carries its own
  justification. Machine, state and event names are ours. A trigger
  is a message (a structure the source defines, transmitted or held locally)
  or a named event; all are listed under triggers. completion is the UML
  completion event: the activity of the source state has finished and the
  guards pick the branch. error_states are states in which the object yields
  no usable result. terminal_states is omitted for machines that cycle, and
  error_states for machines that have none. unspecified entries record
  situations the source leaves open; each points into open_questions and is
  not a transition.

  Notation. t is the instant of evaluation (OQ-07). An interval is written
  as [not-before, not-after] and treated as closed, which is inferred from
  §6.3.2, where VIntersect fails only when Vmin > Vmax (OQ-01). A missing
  not-before is minus infinity and a missing not-after plus infinity (§6.1).
  acc is the accumulated 5-tuple <I, S, D, A, V> of M12.

triggers:
  # ---- messages: structures the source defines ----
  - name: acl-entry
    kind: message
    transmitted: false
    locator: "§1.1, §3.4"
    quote: "An ACL entry has potentially the same content as a certificate body, but has no Issuer (and is not signed)."
    note: "Held locally by the verifier and, per §3.4, never communicated. A defined input structure, so classed as a message."
  - name: authorization-certificate
    kind: message
    transmitted: true
    locator: "§6, §3.3"
    quote: "<authorization,key> (as an authorization certificate or ACL entry)"
    note: "An SPKI one maps to one 5-tuple (§6.5.6); other formats map by the rules of §6.5."
  - name: name-certificate
    kind: message
    transmitted: true
    aliases:
      - id-certificate
    locator: "§6, §6.2"
    quote: "A <name,key> certificate (such as X.509v1 or SDSI 1.0) carries no authorization field but does carry a name."
    note: "Maps to name 4-tuples: one for SPKI, SDSI 1.0 and X.509v1, one per signature for PGP (§6.5.1, §6.5.2, §6.5.5, §6.5.6)."
  - name: attribute-certificate
    kind: message
    transmitted: true
    locator: "§6, §3.1"
    quote: "<authorization,name> (as an attribute certificate or ACL entry)"
    note: "For example an X9.57 attribute certificate; yields 5-tuples with names as subject (§6.5.4)."
  - name: 5-tuple
    kind: message
    transmitted: false
    locator: "§6.1"
    quote: "The 5-tuple is an intermediate form, assumed to be held in trusted memory so that it doesn't need a digital signature for integrity."
    note: "Intermediate structure <Issuer, Subject, Delegation, Authorization, Validity>; consumed one at a time by M12 and M13."
  - name: name-4-tuple
    kind: message
    transmitted: false
    locator: "§6.2"
    quote: "Since it is qualitatively different from an authorization certificate, a separate intermediate form is defined for it."
    note: "Intermediate structure <Issuer, Name, Subject, Validity>; consumed by M11 and M13."
  - name: timed-crl
    kind: message
    transmitted: true
    aliases:
      - crl
    locator: "§5.2"
    quote: "SPKI permits use of timed CRLs."
    note: "A CRL that carries validity dates, signed by the key the certificate lists. The only CRL form SPKI permits."
  - name: delta-crl
    kind: message
    transmitted: true
    locator: "§5.2"
    quote: "That is, a CRL might be a full CRL followed by a sequence of delta-CRLs."
    note: "One delta-CRL (messages.yaml delta-crl). The full CRL with its deltas is messages.yaml current-crl, which M05 assembles and which is not a trigger."
  - name: anti-matter-crl
    kind: message
    transmitted: true
    locator: "§5.1"
    quote: "SPKI has ruled out the use of wandering anti-matter CRLs for its certificates."
    note: "Used only by M10, the negative model of the ruled-out design."
  - name: revalidation
    kind: message
    transmitted: true
    aliases:
      - timed-revalidation
    locator: "§5.3"
    quote: "The positive version of a CRL is what we call a revalidation."
  - name: one-time-revalidation-request
    kind: message
    transmitted: true
    locator: "§5.5"
    quote: "One applies for this on-line, one-time revalidation by submitting a request containing a nonce."
  - name: one-time-revalidation
    kind: message
    transmitted: true
    locator: "§5.5"
    quote: "That nonce gets returned in the signed revalidation instrument, in order to prevent replay attacks."
  - name: short-lived-certificate
    kind: message
    transmitted: true
    locator: "§5.6"
    quote: "If one wants to issue short-lived certificates, SPKI defines a kind of online test statement to tell the user of the certificate where a replacement short-lived certificate might be fetched."
    note: "As a trigger it is the replacement certificate fetched from the location the online test statement names."
  - name: certificate-result-certificate
    kind: message
    transmitted: true
    locator: "§6.6"
    quote: "The answer to the second computation can be put into a new certificate issued by the entity doing the computation."
  - name: authorization-question
    kind: message
    transmitted: false
    locator: "§6.6"
    quote: "Typically, one will reduce a chain of certificates to answer an authorization question in one of two forms:"
    note: "Put to the verifier's own computation; sent to a CRC service only in protocol.yaml certificate-result-certificate-issuance step 1 (inferred there). Carries what the M01 guards test (messages.yaml authorization-question): form-1 or form-2, subject S, requested_authorization A (form 1), acl, certificates."
  # ---- events ----
  - name: completion
    kind: event
    locator: "none"
    inferred: true
    inferred_reason: "Modelling device, not source text: the activity of the source state has finished and the guards choose the branch."
  - name: authorization-computation-completes
    kind: event
    locator: "§5.5"
    quote: "This protocol takes the place of a validity date range and represents a validity interval of zero, starting and ending at the time the authorization computation completes."
    inferred: true
    inferred_reason: "The source names the instant (§5.5), not an event or who raises it. The verifier raises it once M01 is in result-tuple or no-result; M01-T11 to M01-T14, M01-T17 and M01-T18 take it, and M08-T06 fixes tc at the same instant (OQ-07)."
  - name: sequence-exhausted
    kind: event
    locator: "§6.3.4"
    quote: "All reduction operations are in the order provided by the prover."
    inferred: true
    inferred_reason: "The end of the prover's sequence is never named as an event."
  - name: clock-passes-not-before
    kind: event
    locator: "§5"
    quote: "The traditional ones are validity dates: not-before and not-after."
    inferred: true
    inferred_reason: "The source names the dates, not the clock events."
  - name: clock-passes-not-after
    kind: event
    locator: "§5"
    quote: "The traditional ones are validity dates: not-before and not-after."
    inferred: true
    inferred_reason: "The source names the dates, not the clock events."
  - name: clock-passes-crl-not-before
    kind: event
    locator: "§5.2"
    quote: "The CRL must carry validity dates."
    inferred: true
    inferred_reason: "The source requires CRL validity dates; the clock events on them are ours."
  - name: clock-passes-crl-not-after
    kind: event
    locator: "§5.2"
    quote: "The CRL must carry validity dates."
    inferred: true
    inferred_reason: "The source requires CRL validity dates; the clock events on them are ours."
  - name: clock-passes-revalidation-not-before
    kind: event
    locator: "§5.3"
    quote: "As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2)."
    inferred: true
    inferred_reason: "Revalidation validity dates follow from the §5.2 rules by §5.3; the clock events are ours."
  - name: clock-passes-revalidation-not-after
    kind: event
    locator: "§5.3"
    quote: "As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2)."
    inferred: true
    inferred_reason: "Revalidation validity dates follow from the §5.2 rules by §5.3; the clock events are ours."
  - name: online-test-passes
    kind: event
    locator: "§6"
    quote: "The other work for SPKI or SDSI certificates might include processing of on-line test results (CRL, re-validation or one-time validation)."
    inferred: true
    inferred_reason: "Internal signal from M04, M07 or M08 to M02 (or to M01 for deferred tests), carrying the test's validity interval."
  - name: online-test-fails
    kind: event
    locator: "§6"
    quote: "The other work for SPKI or SDSI certificates might include processing of on-line test results (CRL, re-validation or one-time validation)."
    inferred: true
    inferred_reason: "Internal signal from M04, M07 or M08 to M02 (or to M01 for deferred tests). M14-T08 also takes it, for a one-time revalidation the revocation service stops confirming after a loss report."
  - name: online-test-unavailable
    kind: event
    locator: "§5.2"
    quote: "Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier."
    inferred: true
    inferred_reason: "The source names the condition (no valid CRL), not the event of failing to obtain one, nor the equivalent for revalidations and one-time tests. M09-T03 takes it for a short-lived replacement that cannot be fetched."
  - name: threshold-reduced
    kind: event
    locator: "§6.3.3"
    quote: "At that point, those K tuples are validity-, authorization- and delegation- intersected to yield the single tuple that will replace the list of tuples."
    inferred: true
    inferred_reason: "Internal signal from M13 to M12."
  - name: threshold-unsatisfiable
    kind: event
    locator: "§6.3.3"
    quote: "A threshold subject is reduced to a single subject by selecting K of the N subjects and reducing each of those K to the same subject, through a sequence of certificates."
    inferred: true
    inferred_reason: "Internal signal from M13 to M12; the failure case is not described by the source."
  - name: prover-nulls-subordinate
    kind: event
    locator: "§6.3.3"
    quote: "The (N-K) unselected subordinate subjects are set to (null)."
    inferred: true
    inferred_reason: "The source does not say who sets an entry to (null); since reductions follow the prover's order (§6.3.4), we attribute the selection to the prover."
  - name: issuer-learns-certificate-false
    kind: event
    locator: "§5.4"
    quote: "That is the earliest one can revoke a certificate one learns to be false."
  - name: key-loss-reported
    kind: event
    locator: "§7.6"
    quote: "That service could run a 24x7 manned desk, to receive phone calls reporting loss of a key."
  - name: master-key-lost
    kind: event
    locator: "§7.6"
    quote: "If, in the worst case, a user loses his master key, then the same process that occurs today with lost wallets would apply."
  - name: master-key-stolen
    kind: event
    locator: "§7.6"
    quote: "All issuers of authorizations through that master key would need to issue new authorizations through the new master key and, if the old master key had been stolen, cancel all old authorizations through that key."
  - name: component-fails-or-compromised
    kind: event
    locator: "§7.7"
    quote: "As soon as a component fails (or a key is assumed compromised), it must be replaced."
  - name: acl-edit-authorized
    kind: event
    locator: "§7.7"
    quote: "This use of threshold subject would allow the set of root keys to elect new members to that set and retire old members."
    inferred: true
    inferred_reason: "The edit operation itself is not defined; the event is a successful reduction of an (acl-edit) authorization from the ACL entry that grants it."

machines:
  # =====================================================================
  - id: M01
    name: authorization-computation
    locator: "§6, §6.3.4, §6.6, §4.1.4, §6.3.2"
    actor: "verifier: the entity that performs the authorization computation"
    purpose: "One authorization question through the three processing stages of §6 to a decision (form 1) or an answer (form 2)."
    invokes:
      - "M02 for each credential (stage 1)"
      - "M11 for each name used in a subject (stage 2)"
      - "M12 for the 5-tuple reduction (stage 3)"
    initial: idle
    states:
      - name: idle
        meaning: "No question is being computed."
        inferred: true
      - name: stage-1-tupling
        meaning: "Each credential the prover supplies, and each ACL entry used, is verified and mapped to tuples (M02)."
        inferred: false
      - name: stage-2-name-reduction
        meaning: "Uses of names in tuple subjects are replaced by keys or hashes using name 4-tuples (M11)."
        inferred: false
      - name: stage-3-tuple-reduction
        meaning: "The prover-ordered 5-tuples are reduced to one result tuple (M12)."
        inferred: false
      - name: deferred-online-tests
        meaning: "Entered only when online tests were carried in the tuples instead of evaluated in stage 1; they are evaluated now, at the end."
        inferred: false
      - name: result-tuple
        meaning: "One 5-tuple <I, S, D, A, V> has resulted."
        inferred: false
      - name: granted
        meaning: "Form 1 answered yes."
        inferred: true
      - name: denied
        meaning: "Form 1 answered no."
        inferred: true
      - name: answered
        meaning: "Form 2 answer computed: the authorization and validity of the result tuple are what S is allowed to do."
        inferred: true
      - name: answer-returned
        meaning: "The form 2 answer has been given to the asker without a CRC; after a failed reduction, or a result that is not the ACL's own or not about S, it is that nothing is allowed."
        inferred: true
      - name: crc-issued
        meaning: "The form 2 answer has been issued as a Certificate Result Certificate by the entity that computed it."
        inferred: false
      - name: no-result
        meaning: "A stage failed and no result tuple exists. Form 1 continues to denied, form 2 to answer-returned with nothing allowed."
        inferred: true
    transitions:
      - id: M01-T01
        from: idle
        to: stage-1-tupling
        trigger: authorization-question
        guard: "The question is form 1 (is S allowed to do A) or form 2 (what is S allowed to do); the prover's certificate-sequence and the verifier's ACL are at hand."
        action: "Start M02 for every credential and every ACL entry used."
        consumes:
          - name: certificate-sequence
            kind: message
            locator: "§6.3.4"
            quote: "Each keyholder who is granted some authority should receive a sequence of certificates delegating that authority."
            note: "The ordered certificates the prover presents with the question. An input, not a trigger; RFC 2693 defines no wire form for the sequence itself."
        source:
          - locator: "§6.6"
            quote: "Is this Subject, S, allowed to do A, under this ACL and with this set of certificates?"
          - locator: "§6.6"
            quote: "What is Subject S allowed to do, under this ACL and with this set of certificates?"
          - locator: "§6"
            quote: "These entities are processed in three stages."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0108"
          - "rfc-2693#R-0214"
      - id: M01-T02
        from: stage-1-tupling
        to: stage-2-name-reduction
        trigger: completion
        guard: "Every credential the prover's sequence relies on reached tupled in M02."
        source:
          - locator: "§6"
            quote: "Uses of names are replaced with simple definitions (keys or hashes), based on the name definitions available from reducing name 4-tuples."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0116"
      - id: M01-T03
        from: stage-1-tupling
        to: no-result
        trigger: completion
        guard: "A credential the prover's sequence relies on was rejected in M02 and yielded no tuple."
        source:
          - locator: "§6"
            quote: "Individual certificates are verified by checking their signatures and possibly performing other work."
          - locator: "§6.3.4"
            quote: "All reduction operations are in the order provided by the prover."
        inferred: true
        inferred_reason: "The source says how credentials are verified, not what a failed verification does to the computation. Because reductions follow the prover's order, a missing tuple breaks the chain."
        constrained_by:
          - "rfc-2693#R-0109"
          - "rfc-2693#R-0171"
      - id: M01-T04
        from: stage-2-name-reduction
        to: stage-3-tuple-reduction
        trigger: completion
        guard: "Every name used in a subject reached resolved in M11. Names inside threshold subjects may instead be reduced during M13 (M13-T04); whether that interleaving is allowed is OQ-23."
        source:
          - locator: "§6"
            quote: "Authorization 5-tuples are then reduced to a final authorization result."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0117"
      - id: M01-T05
        from: stage-2-name-reduction
        to: no-result
        trigger: completion
        guard: "A name the reduction needs reached an error state in M11."
        source:
          - locator: "§6"
            quote: "Uses of names are replaced with simple definitions (keys or hashes), based on the name definitions available from reducing name 4-tuples."
        inferred: true
        inferred_reason: "The failure path of stage 2 is not described."
        constrained_by:
          - "rfc-2693#R-0116"
      - id: M01-T06
        from: stage-3-tuple-reduction
        to: result-tuple
        trigger: completion
        guard: "M12 reached reduced and no online tests were deferred."
        source:
          - locator: "§6"
            quote: "Authorization 5-tuples are then reduced to a final authorization result."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0117"
      - id: M01-T07
        from: stage-3-tuple-reduction
        to: deferred-online-tests
        trigger: completion
        guard: "M12 reached reduced and the result tuple carries deferred online tests."
        source:
          - locator: "§6.3.2"
            quote: "It is possible for an implementation of VIntersect() to gather up online tests that are present in each certificate and include the union of all those tests in the accumulating tuples."
          - locator: "§6.3.2"
            quote: "In this case, the evaluation of those online tests is deferred until the end of the process."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0163"
      - id: M01-T08
        from: stage-3-tuple-reduction
        to: no-result
        trigger: completion
        guard: "M12 reached an error state."
        source:
          - locator: "§6.3"
            quote: "The two 5-tuples: <I1,S1,D1,A1,V1> + <I2,S2,D2,A2,V2> yield <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)> provided the two intersections succeed, S1 = I2 and D1 = TRUE"
        inferred: true
        inferred_reason: "The source gives the provisos of a reduction step, not what their failure does to the computation."
        constrained_by:
          - "rfc-2693#R-0136"
          - "rfc-2693#R-0137"
          - "rfc-2693#R-0138"
          - "rfc-2693#R-0139"
      - id: M01-T09
        from: deferred-online-tests
        to: result-tuple
        trigger: online-test-passes
        guard: "Every carried online test passes."
        action: "V := VIntersect(V, the validity interval of each test)."
        source:
          - locator: "§6.3.2"
            quote: "That validity interval is intersected with any present in the certificate, to yield a new, current validity interval."
        inferred: true
        inferred_reason: "The source defers the evaluation to the end; that a deferred test then narrows V exactly as an immediate one would is our reading."
        constrained_by:
          - "rfc-2693#R-0162"
      - id: M01-T10
        from: deferred-online-tests
        to: no-result
        trigger: online-test-fails
        guard: "Any carried online test fails."
        source:
          - locator: "§6.3.2"
            quote: "In this case, the evaluation of those online tests is deferred until the end of the process."
        inferred: true
        inferred_reason: "The outcome of a failed deferred test is not described."
        constrained_by:
          - "rfc-2693#R-0163"
      - id: M01-T11
        from: result-tuple
        to: granted
        trigger: authorization-computation-completes
        guard: "Form 1, and all of: the result's issuer is the ACL's own (Self, OQ-20); the result's subject is S; AIntersect(A, result A) = A, so the requested A lies within the granted authorization (OQ-14); t lies within the result V (OQ-07). The result's delegation flag is not consulted."
        source:
          - locator: "§4.1.4"
            quote: "The subject of a certificate or ACL entry may exercise any permission granted and, if delegation is TRUE, may also delegate that permission or some subset of it to others."
          - locator: "§6.6"
            quote: "Is this Subject, S, allowed to do A, under this ACL and with this set of certificates?"
        inferred: true
        inferred_reason: "The source poses the question but states no test on the result tuple; this decision test is our reading. That delegation does not gate exercise is stated (§4.1.4)."
        constrained_by:
          - "rfc-2693#R-0061"
          - "rfc-2693#R-0062"
          - "rfc-2693#R-0214"
      - id: M01-T12
        from: result-tuple
        to: denied
        trigger: authorization-computation-completes
        guard: "Form 1, and any condition of M01-T11 fails."
        source:
          - locator: "§6.6"
            quote: "Is this Subject, S, allowed to do A, under this ACL and with this set of certificates?"
        inferred: true
        inferred_reason: "Complement of M01-T11."
        constrained_by:
          - "rfc-2693#R-0214"
      - id: M01-T13
        from: no-result
        to: denied
        trigger: authorization-computation-completes
        guard: "Form 1."
        source:
          - locator: "§1.1"
            quote: "the ACL is the source of empowerment for certificates."
        inferred: true
        inferred_reason: "With no reducible chain back to the ACL the permission is unproven. The source never says so in terms."
        constrained_by:
          - "rfc-2693#R-0002"
      - id: M01-T14
        from: result-tuple
        to: answered
        trigger: authorization-computation-completes
        guard: "Form 2, and the result's issuer is the ACL's own and its subject is S."
        action: "Answer := the authorization and validity of the result tuple."
        source:
          - locator: "§6.6"
            quote: "What is Subject S allowed to do, under this ACL and with this set of certificates?"
        inferred: true
        inferred_reason: "That the answer is the A and V of the result tuple is our reading of the question."
        constrained_by:
          - "rfc-2693#R-0214"
      - id: M01-T15
        from: answered
        to: crc-issued
        trigger: certificate-result-certificate
        guard: "The computing entity chooses to issue one (it is optional), signed by itself and carrying the answer."
        source:
          - locator: "§6.6"
            quote: "The answer to the second computation can be put into a new certificate issued by the entity doing the computation."
          - locator: "§6.6"
            quote: "That one certificate corresponds to the semantics of the underlying certificates and online test results."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0215"
          - "rfc-2693#R-0216"
      - id: M01-T16
        from: answered
        to: answer-returned
        trigger: completion
        guard: "No CRC is wanted."
        source:
          - locator: "§6.6"
            quote: "The answer to the second computation can be put into a new certificate issued by the entity doing the computation."
        inferred: true
        inferred_reason: "The CRC is optional; a final state for the plain answer is ours."
        constrained_by:
          - "rfc-2693#R-0215"
      - id: M01-T17
        from: no-result
        to: answer-returned
        trigger: authorization-computation-completes
        guard: "Form 2."
        action: "Answer := nothing is allowed."
        source:
          - locator: "§6.6"
