      - id: M04-T03
        from: no-current-crl
        to: no-current-crl
        trigger: timed-crl
        guard: "Signer is not the key the certificate lists, or the CRL carries no validity dates, or it is not valid at t."
        action: "Do not use the CRL. One not yet valid may be kept for M04-T09 and M04-T10."
        source:
          - locator: "§5.2"
            quote: "The certificate must list the key (or its hash) that will sign the CRL and may give one or more locations where that CRL might be fetched."
          - locator: "§5.2"
            quote: "The CRL must carry validity dates."
        inferred: true
        inferred_reason: "The source states the conditions, not the handling of a CRL that fails them."
        constrained_by:
          - "rfc-2693#R-0077"
          - "rfc-2693#R-0078"
          - "rfc-2693#R-0079"
      - id: M04-T04
        from: no-current-crl
        to: unprocessable
        trigger: online-test-unavailable
        guard: "A computation needs the certificate now."
        action: "Emit online-test-fails."
        source:
          - locator: "§5.2"
            quote: "Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier."
        inferred: true
        inferred_reason: "That the certificate cannot be processed is stated; separating needed-now-and-unobtainable from merely holding no current CRL is ours."
        constrained_by:
          - "rfc-2693#R-0082"
          - "rfc-2693#R-0083"
      - id: M04-T05
        from: unprocessable
        to: cleared
        trigger: timed-crl
        guard: "As M04-T01."
        action: "Emit online-test-passes with the CRL's validity interval."
        source:
          - locator: "§5.2"
            quote: "Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier."
        inferred: true
        inferred_reason: "Recovery once a valid CRL arrives is not discussed."
        constrained_by:
          - "rfc-2693#R-0082"
          - "rfc-2693#R-0083"
      - id: M04-T06
        from: unprocessable
        to: revoked
        trigger: timed-crl
        guard: "As M04-T02."
        action: "Emit online-test-fails."
        source:
          - locator: "§5.1"
            quote: "It had a list of revoked certificate identifiers."
