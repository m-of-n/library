  # =====================================================================
  - id: M02
    name: credential-intake
    locator: "§6 (stage 1), §6.1, §6.3.2, §6.5, §5, §1.1"
    actor: verifier
    purpose: "One credential through stage 1: signature check and other work, online tests, validity intersection, mapping to tuples."
    invokes:
      - "M04, M07 or M08 for each online test the credential names"
    initial: awaiting-credential
    states:
      - name: awaiting-credential
        meaning: "No credential in hand."
        inferred: true
      - name: received
        meaning: "A signed credential is in hand, not yet checked."
        inferred: false
      - name: verified
        meaning: "Signature checked and any format-specific other work done (web-of-trust for PGP, root-specific chain rules for X.509)."
        inferred: false
      - name: online-tests-pending
        meaning: "The credential names online tests and they are evaluated now; each runs in its own machine (M04 timed CRL, M07 revalidation, M08 one-time)."
        inferred: false
      - name: validity-intersected
        meaning: "Every online test passed; the credential's dates have been intersected with each test's validity interval."
        inferred: false
      - name: tupled
        meaning: "Mapped to its tuples: a 5-tuple when it carries an authorization (or is an ACL entry), a name 4-tuple when it is a name certificate."
        inferred: false
      - name: rejected-verification
        meaning: "The signature does not verify, or the format-specific other work fails. No tuple."
        inferred: true
      - name: rejected-online-test
        meaning: "An online test failed. No tuple."
        inferred: true
      - name: rejected-empty-validity
        meaning: "The intersection of the credential's dates with the test intervals is empty. No tuple."
        inferred: true
    transitions:
      - id: M02-T01
        from: awaiting-credential
        to: received
        trigger: authorization-certificate
        guard: "none"
        source:
          - locator: "§6"
            quote: "There are three kinds of entity that might be input to the computation that yields an authorization result:"
        inferred: false
        constrained_by:
          - "rfc-2693#R-0107"
      - id: M02-T02
        from: awaiting-credential
        to: received
        trigger: name-certificate
        guard: "none"
        source:
          - locator: "§6"
            quote: "There are three kinds of entity that might be input to the computation that yields an authorization result:"
        inferred: false
        constrained_by:
          - "rfc-2693#R-0107"
      - id: M02-T03
        from: awaiting-credential
        to: received
        trigger: attribute-certificate
        guard: "none"
        source:
          - locator: "§6"
            quote: "There are three kinds of entity that might be input to the computation that yields an authorization result:"
        inferred: false
        constrained_by:
          - "rfc-2693#R-0107"
      - id: M02-T04
        from: awaiting-credential
        to: verified
        trigger: acl-entry
        guard: "none: an ACL entry has no issuer and no signature to check."
        source:
          - locator: "§1.1"
            quote: "An ACL entry has potentially the same content as a certificate body, but has no Issuer (and is not signed)."
        inferred: true
        inferred_reason: "Skipping signature verification follows from the entry being unsigned; the source does not say it."
        constrained_by:
          - "rfc-2693#R-0003"
      - id: M02-T05
        from: received
        to: verified
        trigger: completion
        guard: "The signature verifies under the key named as issuer, and any format-specific other work succeeds."
        source:
          - locator: "§6"
            quote: "Individual certificates are verified by checking their signatures and possibly performing other work."
          - locator: "§6"
            quote: "The other work for PGP certificates may include a web-of-trust computation."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0109"
          - "rfc-2693#R-0112"
      - id: M02-T06
        from: received
        to: rejected-verification
        trigger: completion
        guard: "The signature does not verify, or the format-specific other work fails."
        source:
          - locator: "§6"
            quote: "Individual certificates are verified by checking their signatures and possibly performing other work."
        inferred: true
        inferred_reason: "The failure branch of verification is not described."
        constrained_by:
          - "rfc-2693#R-0109"
      - id: M02-T07
        from: verified
        to: online-tests-pending
        trigger: completion
        guard: "The credential names one or more CRL, revalidation or one-time tests (the three kinds of §5) and they are evaluated immediately. A §5.6 replacement statement is not evaluated here: it tells the user where to fetch a replacement (M09; schema/README.md D-05)."
        action: "Start one M04, M07 or M08 instance per test."
        source:
          - locator: "§6"
            quote: "The other work for SPKI or SDSI certificates might include processing of on-line test results (CRL, re-validation or one-time validation)."
          - locator: "§6.3.2"
            quote: "In the most straight-forward implementation, each online test to which a certificate is subject is evaluated."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0111"
          - "rfc-2693#R-0160"
      - id: M02-T08
        from: verified
        to: tupled
        trigger: completion
        guard: "The credential names no CRL, revalidation or one-time test (a §5.6 replacement statement alone does not count), or its tests are deferred."
        action: "Map to tuples by the §6.5 rule for its format. V := the credential's dates, a missing not-before as minus infinity and a missing not-after as plus infinity. Deferred tests are copied into the tuple's validity as its online_tests list (messages.yaml 5-tuple.validity and name-4-tuple.validity, type tuple-validity; schema tuple-validity online-tests) and evaluated in M01 deferred-online-tests."
        source:
          - locator: "§6.1"
            quote: "If the not-before date is missing from the source credential then minus infinity is assumed."
          - locator: "§6.1"
            quote: "If the not-after date is missing then plus infinity is assumed."
          - locator: "§6.3.2"
            quote: "It is possible for an implementation of VIntersect() to gather up online tests that are present in each certificate and include the union of all those tests in the accumulating tuples."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0127"
          - "rfc-2693#R-0128"
          - "rfc-2693#R-0163"
      - id: M02-T09
        from: online-tests-pending
        to: validity-intersected
        trigger: online-test-passes
        guard: "Every CRL, revalidation or one-time test the credential names has passed: M04 cleared, M07 revalidated, M08 confirmed."
        action: "V := VIntersect(the credential's dates, the validity interval of each test)."
        source:
          - locator: "§6"
            quote: "If on-line tests are involved in the certificate processing, then the validity dates of those on-line test results are intersected by VIntersect() [defined in 6.3.2, below] with the validity dates of the certificate to yield the dates in the certificate's tuple(s)."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0115"
      - id: M02-T10
        from: online-tests-pending
        to: rejected-online-test
        trigger: online-test-fails
        guard: "Any test fails: the current CRL lists the certificate, no valid CRL or revalidation can be had, no current revalidation lists it, or a one-time revalidation does not confirm it."
        source:
          - locator: "§5.2"
            quote: "Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier."
        inferred: true
        inferred_reason: "Only the no-valid-CRL case is stated; the other failing outcomes are carried over from the semantics of each test."
        constrained_by:
          - "rfc-2693#R-0082"
          - "rfc-2693#R-0083"
      - id: M02-T11
        from: validity-intersected
        to: tupled
        trigger: completion
        guard: "Vmin <= Vmax."
        action: "Map to tuples by the §6.5 rule for its format, with the intersected V."
        source:
          - locator: "§6"
            quote: 'They are then mapped to intermediate forms, called "tuples" here.'
          - locator: "§6.5.6"
            quote: "An SPKI certificate maps directly to one 4- or 5- tuple, depending respectively on whether it is a name certificate or carries an authorization."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0110"
          - "rfc-2693#R-0207"
      - id: M02-T12
        from: validity-intersected
        to: rejected-empty-validity
        trigger: completion
        guard: "Vmin > Vmax."
        source:
          - locator: "§6.3.2"
            quote: "and if Vmin > Vmax, then the intersection failed."
        inferred: true
        inferred_reason: "The source states the failure for VIntersect in general, not for this step."
        constrained_by:
          - "rfc-2693#R-0158"
    error_states:
      - rejected-verification
      - rejected-online-test
      - rejected-empty-validity
    terminal_states:
      - tupled
      - rejected-verification
      - rejected-online-test
      - rejected-empty-validity
    translation:
      note: "The mapping action of M02-T08 and M02-T11, per format. These are data mappings, not states."
      rules:
        - format: "SPKI"
          yields: "one name 4-tuple (name certificate) or one 5-tuple (carries an authorization)"
          locator: "§6.5.6"
        - format: "SDSI 1.0"
          yields: "one name 4-tuple"
          locator: "§6.5.5"
        - format: "X.509v1"
          yields: "one name 4-tuple [Kroot, (name <leaf-name>), K1, validity], or with the CA names in the name when leaf names are unique only per CA; after verifying the chain by its own rules"
          locator: "§6.5.1"
        - format: "PGP"
          yields: "one name 4-tuple [Ki, name, K1, validity] per signature Ki on the key K1, after web-of-trust verification"
          locator: "§6.5.2"
        - format: "X.509v3"
          yields: "whatever tuples the root-specific chain validation code generates from the documentation of that line of certificates"
          locator: "§6.5.3"
        - format: "X9.57 attribute certificate"
          yields: "one or more 5-tuples with a fully qualified name as subject, or the key of an explicitly referenced ID certificate"
          locator: "§6.5.4"
        - format: "SSL"
          yields: "5-tuples whose tag carries the implicit (ssl) authorization and, in the encodings the source suggests, (dns <domain-name>) and (us-crypto)"
          locator: "§6.5.7"
        - format: "ACL entry"
          yields: "one 5-tuple, whose subject may be a key or a name; issuer Self (OQ-20)"
          locator: "§6.1, §1.1, §3.4"

  # =====================================================================
  - id: M03
    name: validity-interval
    locator: "§5, §6.1, §6.2, §6.3.2"
    actor: verifier
    applies_to: "Any dated object: certificate, ACL entry, 5-tuple, name 4-tuple, and with their own dates a timed CRL or revalidation."
    purpose: "Where a dated object stands at instant t against its not-before and not-after."
    initial: dated
    states:
      - name: dated
        meaning: "Held, with interval [not-before, not-after] not yet compared with t; a missing not-before is minus infinity, a missing not-after plus infinity."
        inferred: true
      - name: not-yet-valid
        meaning: "t < not-before, and the interval is not empty."
        inferred: true
      - name: valid
        meaning: "not-before <= t <= not-after."
        inferred: true
      - name: expired
        meaning: "t > not-after, and the interval is not empty."
        inferred: true
      - name: empty-interval
        meaning: "not-before > not-after: valid at no instant."
        inferred: true
    transitions:
      - id: M03-T01
        from: dated
        to: not-yet-valid
        trigger: completion
        guard: "not-before <= not-after, and t < not-before."
        source:
          - locator: "§5"
            quote: "A certificate, or an ACL entry, has optional validity conditions."
          - locator: "§5"
            quote: "The traditional ones are validity dates: not-before and not-after."
        inferred: true
        inferred_reason: "The source names the dates; partitioning time into these states is ours. The not-before <= not-after conjunct here and in M03-T03 keeps the four completion guards mutually exclusive, so an inverted interval reaches only empty-interval (M03-T04) and is never stranded in not-yet-valid, where M03-T05 could not fire."
        constrained_by:
          - "rfc-2693#R-0066"
          - "rfc-2693#R-0067"
      - id: M03-T02
        from: dated
        to: valid
        trigger: completion
        guard: "not-before <= t <= not-after; a missing not-before always satisfies the left side and a missing not-after the right."
        source:
          - locator: "§6.1"
            quote: 'Validity dates: a not-before date and a not-after date, where "date" means date and time.'
          - locator: "§6.1"
            quote: "If the not-before date is missing from the source credential then minus infinity is assumed."
          - locator: "§6.1"
            quote: "If the not-after date is missing then plus infinity is assumed."
        inferred: true
        inferred_reason: "Inclusive bounds are inferred (OQ-01)."
        constrained_by:
          - "rfc-2693#R-0126"
          - "rfc-2693#R-0127"
          - "rfc-2693#R-0128"
      - id: M03-T03
        from: dated
        to: expired
        trigger: completion
        guard: "not-before <= not-after, and t > not-after."
        source:
          - locator: "§5"
            quote: "The traditional ones are validity dates: not-before and not-after."
        inferred: true
        inferred_reason: "As M03-T01."
        constrained_by:
          - "rfc-2693#R-0067"
      - id: M03-T04
        from: dated
        to: empty-interval
        trigger: completion
        guard: "not-before > not-after."
        source:
          - locator: "§6.3.2"
            quote: "and if Vmin > Vmax, then the intersection failed."
        inferred: true
        inferred_reason: "The source states this failure only for an intersection. A credential whose own dates are inverted is the same empty interval; whether to reject it as malformed is OQ-22."
        constrained_by:
          - "rfc-2693#R-0158"
      - id: M03-T05
        from: not-yet-valid
        to: valid
        trigger: clock-passes-not-before
        guard: "t >= not-before and t <= not-after."
        source:
          - locator: "§5"
            quote: "The traditional ones are validity dates: not-before and not-after."
        inferred: true
        inferred_reason: "As M03-T01."
        constrained_by:
          - "rfc-2693#R-0067"
      - id: M03-T06
        from: valid
        to: expired
        trigger: clock-passes-not-after
        guard: "t > not-after; never fires when not-after is missing."
        source:
          - locator: "§5"
            quote: "The traditional ones are validity dates: not-before and not-after."
          - locator: "§6.1"
            quote: "If the not-after date is missing then plus infinity is assumed."
        inferred: true
        inferred_reason: "As M03-T01."
        constrained_by:
          - "rfc-2693#R-0067"
          - "rfc-2693#R-0128"
    error_states:
      - empty-interval
    terminal_states:
      - expired
      - empty-interval
    notes:
      - text: "Online tests narrow this interval and never widen it: each test's interval is intersected with the dates (M02-T09). Expired is terminal only if the verifier's clock never runs backwards (OQ-08)."
        source:
          - locator: "§5"
            quote: "That is, they further refine the valid date range of a certificate."
          - locator: "§6.3.2"
            quote: "These rules assume that daytimes are expressed in a monotonic form, as they are in SPKI."
        inferred: true
        inferred_reason: "The monotonic-form sentence is about how dates are encoded, not about the clock; terminality of expired is our reading."
    unspecified:
      - from: valid
        trigger: clock-passes-not-after
        situation: "Whether t equal to not-after (or not-before) is inside the interval."
        open_question: OQ-01

  # =====================================================================
  - id: M04
    name: timed-crl-status
    locator: "§5.2, §5, §5.1, §6 (stage 1)"
    actor: verifier
    applies_to: "One certificate that lists a CRL-signing key, that is, a certificate that might use a CRL."
    purpose: "The online-test status of that certificate under the only CRL form SPKI permits."
    initial: no-current-crl
    states:
      - name: no-current-crl
        meaning: "No CRL that is valid at t and signed by the key the certificate lists is held. The certificate cannot be processed."
        inferred: false
      - name: cleared
        meaning: "The current CRL is valid at t and does not list the certificate. The certificate's tuple validity is VIntersect(certificate dates, CRL dates)."
        inferred: true
      - name: revoked
        meaning: "The current CRL is valid at t and lists the certificate."
        inferred: true
      - name: unprocessable
        meaning: "A computation needs the certificate now and no valid CRL can be had."
        inferred: true
    transitions:
      - id: M04-T01
        from: no-current-crl
        to: cleared
        trigger: timed-crl
        guard: "Signed by the key (or hash) the certificate lists; carries validity dates; valid at t; does not list the certificate."
        action: "Emit online-test-passes with the CRL's validity interval."
        source:
          - locator: "§5.2"
            quote: "The certificate must list the key (or its hash) that will sign the CRL and may give one or more locations where that CRL might be fetched."
          - locator: "§5.2"
            quote: "The CRL must carry validity dates."
          - locator: "§5"
            quote: "However, in SPKI, the certificate issuer must specify the issuer of validity confirmations."
          - locator: "§5.1"
            quote: "It had a list of revoked certificate identifiers."
        inferred: true
        inferred_reason: "§5.2 never restates what a timed CRL contains; that it lists revoked certificates, and that an unlisted certificate passes, is carried over from the CRL described in §5.1."
        constrained_by:
