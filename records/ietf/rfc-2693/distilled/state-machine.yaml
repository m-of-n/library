          - "rfc-2693#R-0077"
          - "rfc-2693#R-0078"
          - "rfc-2693#R-0079"
      - id: M04-T02
        from: no-current-crl
        to: revoked
        trigger: timed-crl
        guard: "The checks of M04-T01 pass and the CRL lists the certificate."
        action: "Emit online-test-fails."
        source:
          - locator: "§5.2"
