  # =====================================================================
  - id: M16
    name: threshold-root-key-set
    locator: "§7.7, §6.3.3"
    actor: "the ACL owner's root key set, acting through an (acl-edit) ACL entry whose subject is a higher threshold of the same keys"
    applies_to: "One key position in a threshold root-key set. The source's example: normal authorizations go to (k-of-n #03# #07# K1 ... K7) and (acl-edit) to (k-of-n #05# #07# K1 ... K7)."
    purpose: "Long root-key lifetimes by redundancy and replacement: the set elects new members and retires old ones."
    initial: candidate
    states:
      - name: candidate
        meaning: "A key not in the set."
        inferred: true
      - name: member
        meaning: "Listed among the N subordinate subjects of the ACL's threshold subjects."
        inferred: false
      - name: failed-or-compromised
        meaning: "The member has failed or is assumed compromised, and must be replaced."
        inferred: false
      - name: retired
        meaning: "Removed from the set by an authorized (acl-edit)."
        inferred: false
    transitions:
      - id: M16-T01
        from: candidate
        to: member
        trigger: acl-edit-authorized
        guard: "An (acl-edit) authorization reduces from the ACL entry whose subject is the higher threshold: in the example, 5 of the 7 current members agree."
        source:
          - locator: "§7.7"
            quote: "That same ACL could have the subject of an (acl-edit) entry be (k-of-n #05# #07# K1 K2 K3 K4 K5 K6 K7)"
          - locator: "§7.7"
            quote: "This use of threshold subject would allow the set of root keys to elect new members to that set and retire old members."
        inferred: true
        inferred_reason: "The edit operation is not defined (OQ-19)."
        constrained_by:
          - "rfc-2693#R-0243"
      - id: M16-T02
        from: member
        to: failed-or-compromised
        trigger: component-fails-or-compromised
        guard: "none"
        source:
          - locator: "§7.7"
            quote: "As soon as a component fails (or a key is assumed compromised), it must be replaced."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0241"
      - id: M16-T03
        from: failed-or-compromised
        to: retired
        trigger: acl-edit-authorized
        guard: "As M16-T01. A replacement candidate is elected by M16-T01 in its own instance."
        source:
          - locator: "§7.7"
            quote: "As soon as a component fails (or a key is assumed compromised), it must be replaced."
          - locator: "§7.7"
            quote: "This use of threshold subject would allow the set of root keys to elect new members to that set and retire old members."
        inferred: true
        inferred_reason: "As M16-T01."
        constrained_by:
          - "rfc-2693#R-0241"
          - "rfc-2693#R-0243"
      - id: M16-T04
        from: member
        to: retired
        trigger: acl-edit-authorized
        guard: "As M16-T01, retiring a member that has not failed."
        source:
          - locator: "§7.7"
            quote: "This use of threshold subject would allow the set of root keys to elect new members to that set and retire old members."
        inferred: true
        inferred_reason: "As M16-T01."
        constrained_by:
          - "rfc-2693#R-0243"
      - id: M16-T05
        from: candidate
        to: member
        trigger: acl-entry
        guard: "The ACL owner installs the ACL's threshold entries with this key among their N subordinate subjects: the founding set, which M16-T01 cannot admit because no members yet exist to agree."
        source:
          - locator: "§7.7"
            quote: "If we use a threshold subject in place of a single key subject, in an ACL (or a certificate), then we achieve redundancy immediately."
        inferred: true
        inferred_reason: "§7.7 shows the founding entries, not their installation; installation by the ACL owner is protocol.yaml threshold-acl-membership-change step 1."
        constrained_by:
          - "rfc-2693#R-0240"
    terminal_states:
      - retired
    notes:
      - text: "Redundancy comes at once from a threshold subject, across keys and algorithms; long life needs replacement as well."
        source:
          - locator: "§7.7"
            quote: "If we use a threshold subject in place of a single key subject, in an ACL (or a certificate), then we achieve redundancy immediately."
          - locator: "§7.7"
            quote: "This can be redundancy not only of keys but also of algorithms."
          - locator: "§7.7"
            quote: "Truly long lifetimes come from replacement, not just redundancy."
          - locator: "§7.7"
            quote: "In this manner, replacement is achieved alongside redundancy and the proper choice of K and N should allow threshold subject key lifetimes approaching infinity."
        inferred: false
      - text: "Until an (acl-edit) retires it, a failed or compromised member is still listed in the threshold subjects and still counts towards K."
        source:
          - locator: "§7.7"
            quote: "As soon as a component fails (or a key is assumed compromised), it must be replaced."
        inferred: true
        inferred_reason: "The source says the member must be replaced, not what holds until it is."
      - text: "With the example thresholds, fewer than 3 compromised members can authorize nothing, and fewer than 5 cannot change the set."
        source:
          - locator: "§7.7"
            quote: "(k-of-n #03# #07# K1 K2 K3 K4 K5 K6 K7)"
          - locator: "§7.7"
            quote: "(k-of-n #05# #07# K1 K2 K3 K4 K5 K6 K7)"
        inferred: true
        inferred_reason: "Arithmetic consequence of the example; the source does not state it."
    unspecified:
      - from: member
        trigger: acl-edit-authorized
        situation: "How an (acl-edit) is expressed and applied: the request format, who applies it, whether the 3 of 7 and 5 of 7 entries change together, and atomicity."
        open_question: OQ-19

not_modelled:
  - item: "Micali's hash-chain revalidation"
    locator: "§5.7.1"
    reason: "Named and cited only. RFC 2693 gives no hash-chain construction, period or release rule, so a machine would be built from [ECR], not from this source."
    source:
      - locator: "§5.7.1"
        quote: "Silvio Micali has patented a mechanism for using hash chains to revalidate or revoke a certificate inexpensively."
  - item: "Rivest's reversal of the CRL logic"
    locator: "§5.7.2"
    reason: "Explicitly outside SPKI, and no mechanism is defined: the verifier deciding the assurance it needs is a direction for further work."
    source:
      - locator: "§5.7.2"
        quote: "This line of thought deserves further consideration, but is not reflected in the SPKI structure definition."
  - item: "Delegation as a machine of its own"
    locator: "§4.1, §4.1.4, §6.1"
    reason: "The boolean is fixed when a certificate or ACL entry is made and has no lifecycle. It is modelled where it acts: the D1 = TRUE guard of M12-T02 and M12-T04, the per-entry guard of M13-T03, and the rule that delegation does not gate exercise in M01-T11."
    source:
      - locator: "§4.1.4"
        quote: "Of these three, the group chose boolean control."
  - item: "Integer depth control and no control"
    locator: "§4.1.1, §4.1.3, §4.1.4"
    reason: "Alternatives the working group rejected; nothing in SPKI carries a depth counter."
    source:
      - locator: "§4.1.4"
        quote: "The integer control option was the original design and has appeal, but was defeated by the inability to predict the proper depth of delegation."
  - item: "Separating delegators from those who exercise"
    locator: "§4.2"
    reason: "A decision not to restrict, so no state exists. Reflected in M01-T11, which ignores the delegation flag, and in M14-T01."
    source:
      - locator: "§4.2"
        quote: "Therefore, there was no benefit from attempting to restrict the exercise of a permission by someone permitted to delegate it."
  - item: "Certificate translation rules"
    locator: "§6.5, §6.5.1 to §6.5.7"
    reason: "Format-to-tuple mappings are data transforms, not lifecycles. They are listed as the mapping action of M02 under translation; their field-level detail belongs to messages and schema."
    source:
      - locator: "§6.5"
        quote: "Any certificate currently defined, as well as ACL entries and possibly other instruments, can be translated to 5-tuples (or name tuples) and therefore take part in an authorization computation."
  - item: "PGP web of trust and X.509 chain validation"
    locator: "§6.5.1, §6.5.2, §6.5.3"
    reason: "Defined by other documents and by root-specific code. M02 treats them as the other work inside the guard of M02-T05."
    source:
      - locator: "§6.5.2"
        quote: "It is verified by web-of-trust rules (as specified in the PGP documentation)."
  - item: "Certificate path discovery"
    locator: "§6.3.4"
    reason: "The search algorithm is in [ELIEN], outside this document. The verifier's machines consume the prover's order and never search."
    source:
      - locator: "§6.3.4"
        quote: "The general algorithm for finding the right certificate paths from a large set of unordered certificates has been solved[ELIEN], but might be used only rarely."
  - item: "Combining several reductions in application code"
    locator: "§6.5.7"
    reason: "Treating separately reduced permissions as ANDed is application logic outside the certificate: several independent runs of M01, not a machine of their own."
    source:
      - locator: "§6.5.7"
        quote: "The fact that these three kinds of permission are treated as if ANDed is derived from the logic of the code that interprets the permissions and is not expressed in the certificate."
  - item: "ACL entry lifecycle"
    locator: "§3.4, §1.1"
    reason: "ACL entries are local and implementation-defined. Their dates follow M03 and their editing under a threshold is M16; no other lifecycle is described."
    source:
      - locator: "§3.4"
        quote: "In SPKI, an ACL entry is free to be implemented in any way the developer chooses, since it is never communicated and therefore does not need to be standardized."
  - item: "Inescapable names and a single naming authority"
    locator: "§2.5, §7.1, §7.2"
    reason: "Hypothetical schemes the document argues do not and will not exist; no lifecycle."
    source:
      - locator: "§7.1"
        quote: "However, there are no inescapable names for keyholders."
  - item: "Key protection guidance"
    locator: "§7.4"
    reason: "Operational advice on how to keep a long-lived key; it defines no states or transitions."
    source:
      - locator: "§7.4"
        quote: "It should be used only on a trusted machine, running trusted software."
  - item: "Choosing the length of a validity interval"
    locator: "§5.4"
    reason: "A risk-management parameter, not a transition. Recorded as M06 parameters; its consequence, the locked slot, is M06."
    source:
      - locator: "§5.4"
        quote: "The answer to that question comes from risk management."
  - item: "History of name certification"
    locator: "§2, §2.1 to §2.4, §2.6, §2.7, §2.9"
    reason: "Narrative and naming theory. The name rules that act at run time (§2.8 qualification, §2.10 groups) are used in M11."
    source:
      - locator: "§2"
        quote: "Certificates were originally viewed as having one function: binding names to keys or keys to names."
  - item: "Security considerations"
    locator: "§8"
    reason: "A comparison of two certificate constructions; no lifecycle."
    source:
      - locator: "§8"
        quote: "There are at least two ways in which the former is more secure than the latter."
  - item: "S-expression encoding"
    locator: "§1.1"
    reason: "Data format, defined in the companion structure document; no lifecycle."
    source:
      - locator: "§1.1"
        quote: "S-EXPRESSION: the data format chosen for SPKI/SDSI."

open_questions:
  - id: OQ-01
    locator: "§6.3.2, §5.2, §6.1"
    question: "Is an instant equal to not-before or not-after inside the interval? VIntersect fails only when Vmin > Vmax, so a one-instant interval is non-empty, which reads as closed intervals. But with closed intervals two CRLs [a, b] and [b, c] intersect at b, which condition 3 forbids, so an issuer could not run CRLs back to back without a gap."
    matters_because: "Boundary test vectors; whether issuers must leave gaps (OQ-02); how a verifier treats t equal to a not-after."
    source:
      - locator: "§6.3.2"
        quote: "and if Vmin > Vmax, then the intersection failed."
      - locator: "§5.2"
        quote: "CRL validity date ranges must not intersect."
    affects:
      - M03-T02
      - M03-T06
      - M04-T07
      - M06-T04
      - M06-T05
  - id: OQ-02
    locator: "§5.2"
    question: "Condition 3 forbids overlap but not gaps. Between one CRL's not-after and the next CRL's not-before no valid CRL exists, so every certificate relying on that key's CRLs is unprocessable. Must issuers avoid gaps, and is a gap a failure or a wait for the verifier?"
    matters_because: "Availability: a gap silently disables every dependent certificate."
    source:
      - locator: "§5.2"
        quote: "Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier."
      - locator: "§5.2"
        quote: "That is, one may not issue a new CRL to take effect before the expiration of the CRL currently deployed."
    affects:
      - M04-T04
      - M06-T06
  - id: OQ-03
    locator: "§5.2, §5.3, §5.1"
    question: "Condition 3 binds the issuer. What does a verifier do on holding two CRLs, or two revalidations, from the same key whose validity ranges intersect: reject both, prefer one (by what rule, since a timed CRL carries no sequence number in the text), or treat the certificate as unprocessable?"
    matters_because: "Determinism is promised only under the rules; a violating issuer leaves the result undefined, and a verifier needs a defined reaction."
    source:
      - locator: "§5.2"
        quote: "CRL validity date ranges must not intersect."
      - locator: "§5.1"
        quote: "Every authorization computation is deterministic, under SPKI rules."
    affects:
      - M04
      - M06-T05
      - M07
  - id: OQ-04
    locator: "§5.2"
    question: "May a later timed CRL omit a certificate an earlier CRL listed? A verifier that reads only the current CRL (M04-T08) would accept the certificate again. That CRLs tend to grow monotonically is a description, not a rule."
    matters_because: "Whether revocation is permanent, and whether a verifier must remember past listings."
    source:
      - locator: "§5.2"
        quote: "Since CRLs might get very large and since they tend to grow monotonically, one might want to issue changes to CRLs rather than full ones."
      - locator: "§5.2"
        quote: "The CRL in this case is a completion of the certificate, rather than a message to the world announcing a change of mind."
    affects:
      - M04-T08
  - id: OQ-05
    locator: "§5.2"
    question: "For a full CRL followed by delta-CRLs: how are the validity dates of the combined CRL derived from its parts, does each delta carry its own, how is a delta tied to its full CRL and ordered among other deltas, may a delta remove an entry, and when does a new full CRL replace the sequence?"
    matters_because: "M05 cannot compute the current CRL's interval, which M04 and M06 need, without these rules."
    source:
      - locator: "§5.2"
        quote: "That sequence of instruments is then treated as a current CRL and the combined CRL must follow the conditions listed above."
    affects:
      - M05
  - id: OQ-06
    locator: "§5.2"
    question: "When no valid CRL or revalidation can be had, the certificate cannot be processed. Does that fail the computation at once, or may the verifier wait for or fetch one from the locations the certificate gives? Fetch failure, retry and timeouts are not described."
    matters_because: "Liveness and error reporting of M02 and M01."
    source:
      - locator: "§5.2"
        quote: "The certificate must list the key (or its hash) that will sign the CRL and may give one or more locations where that CRL might be fetched."
      - locator: "§5.2"
        quote: "Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier."
    affects:
      - M02-T10
      - M04-T04
      - M07-T03
  - id: OQ-07
    locator: "§5.5, §6.6"
    question: "At what instant are validity intervals tested for an immediate question: when the computation starts, when it completes, or at the access itself? The source fixes only the one-time revalidation, at completion; a long computation can straddle a not-after."
    matters_because: "Every validity guard and every time-dependent test vector depends on t."
    source:
      - locator: "§5.5"
        quote: "This protocol takes the place of a validity date range and represents a validity interval of zero, starting and ending at the time the authorization computation completes."
    affects:
      - M01-T11
      - M03
      - M04
      - M07
      - M08-T06
  - id: OQ-08
    locator: "§5.2, §5.5, §6.3.2"
    question: "No clock source, skew allowance, or behaviour for a clock that runs backwards is given; the source only warns that verifier clock error can produce results the issuer did not intend."
    matters_because: "Whether expired is terminal (M03), and how much margin verifiers allow."
    source:
      - locator: "§5.2"
        quote: "This yields a deterministic validity computation, independent of clock skew, although clock inaccuracies in the verifier may produce a result not desired by the issuer."
      - locator: "§5.5"
        quote: "If clock skew is taken into consideration, validity intervals need to be that much larger to be meaningful."
    affects:
      - M03
      - M04
      - M07
  - id: OQ-09
    locator: "§5.5"
    question: "Who generates the nonce and who submits the one-time request: the verifier, or the prover on its behalf? If the prover fetches the answer, how does the verifier know the nonce is fresh and its own? What does a negative answer look like, and what happens when none comes?"
    matters_because: "The replay protection only works if the nonce comes from the party running the computation."
    source:
      - locator: "§5.5"
        quote: "One applies for this on-line, one-time revalidation by submitting a request containing a nonce."
      - locator: "§5.5"
        quote: "That nonce gets returned in the signed revalidation instrument, in order to prevent replay attacks."
    affects:
      - M08
  - id: OQ-10
    locator: "§6.3.2, §6.6, §5.5"
    question: "A reduction may carry the union of online tests to the end, for example to produce a long-lived CRC. How does a CRC represent tests not yet evaluated, what are its validity dates, and how can a one-time revalidation, which has no lifetime beyond one computation, be carried at all?"
    matters_because: "Without an answer a CRC built in deferred mode has no defined validity."
    source:
      - locator: "§6.3.2"
        quote: "This might be appropriate if the tuple reduction is being performed not for answering an immediate authorization question but rather for generation of a summary certificate (Certificate Result Certificate) that one might hope would be useful for a long time."
      - locator: "§5.5"
        quote: "This form of revalidation has no lifetime beyond the current authorization computation."
    affects:
      - M01-T07
      - M01-T15
      - M08
  - id: OQ-11
    locator: "§6.3"
    question: "When more than one proviso of the reduction rule fails at once, which error is reported? The provisos are a plain conjunction with no order."
    matters_because: "Error-reporting tests; the authorization outcome is the same either way."
    source:
      - locator: "§6.3"
        quote: "The two 5-tuples: <I1,S1,D1,A1,V1> + <I2,S2,D2,A2,V2> yield <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)> provided the two intersections succeed, S1 = I2 and D1 = TRUE"
    affects:
      - M12-T03
      - M12-T04
      - M12-T05
      - M12-T06
  - id: OQ-12
    locator: "§6.3.3"
    question: "Delegation-intersection is undefined for booleans; AND is the natural reading. Nor is it said that the parent tuple must carry delegation TRUE for subordinate keys to pass their shares on, though applying the §6.3 rule per entry requires it."
    matters_because: "Decides whether a merged threshold tuple can be delegated further."
    source:
      - locator: "§6.3.3"
        quote: "At that point, those K tuples are validity-, authorization- and delegation- intersected to yield the single tuple that will replace the list of tuples."
    affects:
      - M13-T07
  - id: OQ-13
    locator: "§6.3.3, §6.3.4, §6.1"
    question: "(a) How does a linear prover-ordered sequence say which subordinate entry each tuple extends, especially when two entries have the same key? (b) What if a tuple extends no entry? (c) If more than K entries reduce to the same subject, must the prover null the extras? (d) May the N subordinate subjects repeat a key, and does a repeat count twice? (e) May a subordinate subject itself be a threshold subject? (f) Who sets the N-K unselected entries to (null): the prover, as M13-T05 reads it, or the verifier once K entries share a subject?"
    matters_because: "A verifier cannot implement M13 deterministically without (a), and (d) bears on the security of K."
    source:
      - locator: "§6.3.3"
        quote: "Those subordinate tuples are reduced individually until the list of subordinate tuples has (N-K) (null) entries and K entries with the same subject."
      - locator: "§6.3.4"
        quote: "All reduction operations are in the order provided by the prover."
    affects:
      - M13
  - id: OQ-14
    locator: "§6.6, §6.3.1"
    question: "Form 1 asks whether S may do A, but no test on the result tuple is stated. Our reading: the result's issuer is the ACL's own, its subject is S, AIntersect(A, result A) equals A, and t lies inside the result V. Whether doing A requires the request to lie within the granted set, as read here, or only to intersect it, is not said."
    matters_because: "This is the final decision every authorization test asserts."
    source:
      - locator: "§6.6"
        quote: "Is this Subject, S, allowed to do A, under this ACL and with this set of certificates?"
      - locator: "§6.3.1"
        quote: "This means that additional elements of a list must restrict the permission granted."
    affects:
      - M01-T11
  - id: OQ-15
    locator: "§6.4.1"
    question: "§6.4.1 refers to [see 6.7] for Certificate Result Certificates, but the document has no §6.7; CRCs are §6.6. Read here as a reference to §6.6."
    matters_because: "A source defect, recorded rather than silently corrected."
    source:
      - locator: "§6.4.1"
        quote: "This might be used by a service that produces Certificate Result Certificates [see 6.7]."
    affects:
      - M12-T11
      - M13-T10
  - id: OQ-16
    locator: "§5.3"
    question: "§5.3 applies the §5.2 rules, non-intersection included, to revalidations, and one revalidation may list several certificates. Does non-intersection bind per certificate, per signing key, or per series? Per key would forbid a single-certificate revalidation while a multi-certificate one is current."
    matters_because: "Decides which revalidations M06 may issue and which M07 may accept."
    source:
      - locator: "§5.3"
        quote: "Typically a revalidation would list only one certificate (the one of interest), although it might list a set of certificates (to save digital signature effort)."
      - locator: "§5.3"
        quote: "As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2)."
    affects:
      - M06
      - M07
  - id: OQ-17
    locator: "§5.6"
    question: "Who is the user of the certificate who fetches the replacement, its holder or the verifier? Must the replacement come from the same issuer key? What happens when none can be fetched?"
    matters_because: "Decides which party runs M09 and what M09-T02 checks."
    source:
      - locator: "§5.6"
        quote: "If one wants to issue short-lived certificates, SPKI defines a kind of online test statement to tell the user of the certificate where a replacement short-lived certificate might be fetched."
    affects:
      - M09
  - id: OQ-18
    locator: "§7.6, §7"
    question: "With no key revocation in SPKI, cancelling all old authorizations after a master key is stolen must mean CRL listing, withheld revalidation, or waiting for expiry; an old authorization naming no online test cannot be cancelled before its not-after. The source does not say how cancellation is done, nor that issuers should make such certificates revocable."
    matters_because: "The theft case is only recoverable for certificates that carry an online test."
    source:
      - locator: "§7.6"
        quote: "All issuers of authorizations through that master key would need to issue new authorizations through the new master key and, if the old master key had been stolen, cancel all old authorizations through that key."
      - locator: "§7"
        quote: "Rather than define a mechanism for declaring a key to be bad or replaced, SPKI defines a mechanism for giving certificates limited lifetimes so that they can be replaced."
    affects:
      - M15-T06
      - M15-T08
  - id: OQ-19
    locator: "§7.7"
    question: "The (acl-edit) authorization is named but the edit is not: its request format, who applies it to the ACL, whether the 3 of 7 and 5 of 7 entries change together, atomicity, and whether a retired member's past certificates are affected."
    matters_because: "M16 cannot be implemented beyond its states without these."
    source:
      - locator: "§7.7"
        quote: "This use of threshold subject would allow the set of root keys to elect new members to that set and retire old members."
    affects:
      - M16
  - id: OQ-20
    locator: "§6.1, §1.1"
    question: "Self is a legal 5-tuple issuer and the ACL has the resource owner as its implicit issuer, but the source never says in one place that an ACL entry's tuple carries issuer Self, nor that a result must have issuer Self to authorize."
    matters_because: "The anchor test in M01-T11 and the start of M12 rest on it."
    source:
      - locator: "§6.1"
        quote: 'Issuer: a public key (or its hash), or the reserved word "Self".'
      - locator: "§1.1"
        quote: "the ACL is the source of that power (since it theoretically has the owner of the resource it controls as its implicit issuer)."
    affects:
      - M01-T11
      - M12-T01
      - M02
  - id: OQ-21
    locator: "§7, §7.6"
    question: "Nothing forbids empowering a key again after it was disempowered, including a key reported lost. The revocation service cannot issue certificates, but other issuers can."
    matters_because: "Without a rule, a lost key can be revived by any issuer that has not heard of the loss."
    source:
      - locator: "§7"
        quote: "That is, under SPKI one does not declare a key to be bad but rather stops empowering it and instead empowers some other key."
    affects:
      - M14
  - id: OQ-22
    locator: "§6.3.2, §6.1"
    question: "A credential whose own not-before is later than its not-after is valid at no instant. Should intake reject it as malformed, or accept it and let VIntersect fail later?"
    matters_because: "Decides which error a test should expect."
    source:
      - locator: "§6.3.2"
        quote: "and if Vmin > Vmax, then the intersection failed."
    affects:
      - M03-T04
      - M02
  - id: OQ-23
    locator: "§6, §6.4, §6.4.1"
    question: "§6 processes inputs in three stages, names before 5-tuples, but §6.4 has name 4-tuples delivered in the order the prover needs, and §6.4.1 reduces names inside threshold subjects as part of threshold reduction. Is name reduction a separate pass before any 5-tuple reduction, or may 4-tuples be interleaved with 5-tuples in the prover's one sequence?"
    matters_because: "Decides whether M11 runs to completion before M12 starts, and therefore what order a prover must use. protocol.yaml takes the interleaved reading; this file takes the separate pass."
    source:
      - locator: "§6"
        quote: "These entities are processed in three stages."
      - locator: "§6.4"
        quote: "As with the 5-tuples discussed in the previous section, name definition 4-tuples should be delivered in the order needed by the prover."
      - locator: "§6.4.1"
        quote: "The name reduction process proceeds independently on each name in the subordinate subject as indicated in 6.3.3 above."
    affects:
      - M01-T04
      - M11
      - M12
      - M13-T04
  - id: OQ-24
    locator: "§2.8, §3.4, §1.1"
    question: "A relative name inside a certificate is defined in the name space of the issuer's key, but an ACL entry has no issuer and may have a name as subject. In whose name space is such a name defined: the resource owner's, and under which key?"
    matters_because: "M11-T01 cannot qualify the name without it, and ACL entries naming groups are the SDSI 1.0 use case."
    source:
      - locator: "§2.8"
        quote: "It is SDSI 1.0 convention, preserved in SPKI, that if a (local) SDSI name occurs within a certificate, then the public key of the issuer is the identifier of the name space in which that name is defined."
      - locator: "§3.4"
        quote: "The ACL entry can have a name as a subject, as in SDSI 1.0, or it can have a key as a subject."
    affects:
      - M11-T01
      - M02
  - id: OQ-25
    locator: "§6.2, §6.4"
    question: "Does a threshold-valued name definition apply in name reduction, and to what, when names follow the one it defines?"
    matters_because: "M11 has no transition for it; design-notes.md open question 8 asks the same of our design."
    source:
      - locator: "§6.2"
        quote: "Subject: a public key (or its hash), a name, or a threshold function of subordinate subjects."
      - locator: "§6.4"
        quote: "There will be name 4-tuples in two different classes, those that define the name as a key and those that define the name as another name."
    affects:
      - M11
  - id: OQ-26
    locator: "§6.3, §6.1, §2.7"
    question: "Does a key equal its own hash in S1 = I2 and in name reduction's K1 = K?"
    matters_because: "Whether a chain mixing a key and its hash reduces; design-notes.md open question 5."
    source:
      - locator: "§6.3"
        quote: "The two 5-tuples: <I1,S1,D1,A1,V1> + <I2,S2,D2,A2,V2> yield <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)> provided the two intersections succeed, S1 = I2 and D1 = TRUE"
      - locator: "§6.1"
        quote: 'Issuer: a public key (or its hash), or the reserved word "Self".'
      - locator: "§2.7"
        quote: "If there exists a collision-free hash function, then a collision-free hash of the public key is also a globally unique identifier for the keyholder, and probably a shorter one than the public key."
    affects:
      - M11-T03
      - M11-T04
      - M11-T05
      - M11-T07
      - M12-T02
      - M12-T03
      - M13-T03
      - M13-T06

