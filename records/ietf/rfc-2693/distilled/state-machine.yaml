          - locator: "§5.2"
            quote: "CRL validity date ranges must not intersect."
          - locator: "§5.2"
            quote: "This yields a deterministic validity computation, independent of clock skew, although clock inaccuracies in the verifier may produce a result not desired by the issuer."
        inferred: true
        inferred_reason: "The at-most-one-current consequence is derived from condition 3."
    unspecified:
      - from: cleared
        trigger: timed-crl
        situation: "A second CRL from the same key whose validity range intersects the current CRL's. Condition 3 forbids the issuer to make one but says nothing of what the verifier does on receiving one."
        open_question: OQ-03
      - from: revoked
        trigger: timed-crl
        situation: "As above, while the current CRL lists the certificate."
        open_question: OQ-03
      - from: no-current-crl
        trigger: online-test-unavailable
        situation: "A gap between one CRL's not-after and the next CRL's not-before, which condition 3 does not forbid."
        open_question: OQ-02
      - from: no-current-crl
        trigger: online-test-unavailable
        situation: "Whether unprocessable fails the computation at once, or the verifier may wait and retry."
        open_question: OQ-06

  # =====================================================================
  - id: M05
    name: current-crl-assembly
    locator: "§5.2 (final paragraph)"
    actor: verifier
    purpose: "How the current CRL that M04 consults is built when the issuer sends a full CRL followed by delta-CRLs."
    initial: no-full-crl
    states:
      - name: no-full-crl
        meaning: "No full CRL is held."
        inferred: true
      - name: full-crl-current
        meaning: "A full CRL is held and is the current CRL."
        inferred: false
      - name: full-plus-deltas-current
        meaning: "A full CRL and the delta-CRLs received after it are held; the sequence is treated as one current CRL."
        inferred: false
      - name: combined-crl-nonconforming
        meaning: "The combined CRL violates one of the three §5.2 conditions."
        inferred: true
    transitions:
      - id: M05-T01
        from: no-full-crl
        to: full-crl-current
        trigger: timed-crl
        guard: "A full CRL that meets the three §5.2 conditions."
        source:
          - locator: "§5.2"
            quote: "That is, a CRL might be a full CRL followed by a sequence of delta-CRLs."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0086"
      - id: M05-T02
        from: full-crl-current
        to: full-plus-deltas-current
        trigger: delta-crl
        guard: "The combined CRL (the full CRL plus every delta so far) meets the three §5.2 conditions."
        source:
          - locator: "§5.2"
            quote: "That sequence of instruments is then treated as a current CRL and the combined CRL must follow the conditions listed above."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0087"
      - id: M05-T03
        from: full-plus-deltas-current
        to: full-plus-deltas-current
        trigger: delta-crl
        guard: "As M05-T02."
        source:
          - locator: "§5.2"
            quote: "That sequence of instruments is then treated as a current CRL and the combined CRL must follow the conditions listed above."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0087"
      - id: M05-T04
        from: full-crl-current
        to: combined-crl-nonconforming
        trigger: delta-crl
        guard: "The combined CRL fails one of the three §5.2 conditions."
        source:
          - locator: "§5.2"
            quote: "That sequence of instruments is then treated as a current CRL and the combined CRL must follow the conditions listed above."
        inferred: true
        inferred_reason: "The source states the obligation, not the handling of a combined CRL that breaks it."
        constrained_by:
          - "rfc-2693#R-0087"
      - id: M05-T05
        from: full-plus-deltas-current
        to: combined-crl-nonconforming
        trigger: delta-crl
        guard: "As M05-T04."
        source:
          - locator: "§5.2"
            quote: "That sequence of instruments is then treated as a current CRL and the combined CRL must follow the conditions listed above."
        inferred: true
        inferred_reason: "As M05-T04."
        constrained_by:
          - "rfc-2693#R-0087"
    error_states:
      - combined-crl-nonconforming
    unspecified:
      - from: combined-crl-nonconforming
        trigger: completion
        situation: "What a verifier does with a nonconforming combined CRL: discard the offending delta, discard the whole sequence, or treat every dependent certificate as unprocessable."
        open_question: OQ-05
      - from: no-full-crl
        trigger: delta-crl
        situation: "A delta-CRL with no full CRL to apply to."
        open_question: OQ-05
      - from: full-plus-deltas-current
        trigger: delta-crl
        situation: "How the combined CRL's validity dates derive from those of its parts, how a delta is tied to its full CRL and ordered among other deltas, and whether a delta may remove an entry."
        open_question: OQ-05
      - from: full-plus-deltas-current
        trigger: timed-crl
        situation: "A new full CRL arriving while deltas are held: whether it replaces the whole sequence, and from when."
        open_question: OQ-05

  # =====================================================================
  - id: M06
    name: validity-instrument-issuer-slots
    locator: "§5.2 (condition 3), §5.3, §5.4, §5"
    actor: "issuer of validity confirmations: the key the certificate lists to sign its CRLs or revalidations, who need not be the certificate's issuer"
    applies_to: "One series of timed CRLs, or of timed revalidations (§5.3 applies the §5.2 rules to revalidations)."
    purpose: "The issuer's side of condition 3: each instrument locks a time slot, and a revocation can take effect no earlier than the next slot."
    initial: no-instrument-deployed
    parameters:
      - name: validity-interval-length
        meaning: "Length of each slot. Non-zero for timed CRLs and revalidations; set by risk management."
        source:
          - locator: "§5.4"
            quote: 'To set this validity interval, one must answer the question: "How long are you willing to let the world believe and act on a statement you know to be false?"'
          - locator: "§5.4"
            quote: "The answer to that question comes from risk management."
    states:
      - name: no-instrument-deployed
        meaning: "No instrument of this series is deployed: none issued yet, or the last one's interval has ended with no successor issued."
        inferred: true
      - name: slot-locked
        meaning: "An instrument has been signed and sent to at least one consumer. Its validity interval is a locked slot, and no new instrument may take effect before it ends."
        inferred: false
      - name: revocation-pending
        meaning: "The issuer has learned a certificate is false while a slot is locked. The revocation cannot take effect before the locked slots end."
        inferred: false
      - name: overlap-violation
        meaning: "The issuer has issued an instrument whose validity range intersects the deployed one."
        inferred: true
    transitions:
      - id: M06-T01
        from: no-instrument-deployed
        to: slot-locked
        trigger: timed-crl
        guard: "The issuer signs a CRL that carries validity dates with a non-zero interval and transmits it to at least one consumer."
        source:
          - locator: "§5.4"
            quote: "Both timed CRLs and timed revalidations have non-0 validity intervals."
          - locator: "§5.4"
            quote: "That is, one must assume that the previous CRL or revalidation has just been signed and transmitted to at least one consumer, locking up a time slot."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0091"
          - "rfc-2693#R-0093"
      - id: M06-T02
        from: no-instrument-deployed
        to: slot-locked
        trigger: revalidation
        guard: "As M06-T01, for a revalidation."
        source:
          - locator: "§5.4"
            quote: "That is, one must assume that the previous CRL or revalidation has just been signed and transmitted to at least one consumer, locking up a time slot."
          - locator: "§5.3"
            quote: "As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2)."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0090"
          - "rfc-2693#R-0093"
      - id: M06-T03
        from: slot-locked
        to: revocation-pending
        trigger: issuer-learns-certificate-false
        guard: "none"
        source:
          - locator: "§5.4"
            quote: "The next available time slot starts after this validity interval ends."
          - locator: "§5.4"
            quote: "That is the earliest one can revoke a certificate one learns to be false."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0094"
      - id: M06-T04
        from: slot-locked
        to: slot-locked
        trigger: timed-crl
        guard: "The new CRL's not-before is after the deployed CRL's not-after, so the ranges do not intersect: the next slot is locked in advance."
        source:
          - locator: "§5.2"
            quote: "That is, one may not issue a new CRL to take effect before the expiration of the CRL currently deployed."
        inferred: true
        inferred_reason: "Issuing ahead is permitted by the letter of condition 3, not described. Each slot locked ahead pushes the earliest possible revocation later."
        constrained_by:
          - "rfc-2693#R-0081"
      - id: M06-T05
        from: slot-locked
        to: overlap-violation
        trigger: timed-crl
        guard: "The new CRL's validity range intersects the deployed CRL's."
        source:
          - locator: "§5.2"
            quote: "CRL validity date ranges must not intersect."
          - locator: "§5.2"
            quote: "That is, one may not issue a new CRL to take effect before the expiration of the CRL currently deployed."
        inferred: true
        inferred_reason: "The prohibition is stated; modelling its breach as a state is ours."
        constrained_by:
          - "rfc-2693#R-0080"
          - "rfc-2693#R-0081"
      - id: M06-T06
        from: slot-locked
        to: no-instrument-deployed
        trigger: clock-passes-crl-not-after
        guard: "No successor has been issued (a CRL series; a revalidation series lapses by M06-T10)."
        source:
          - locator: "§5.4"
            quote: "The next available time slot starts after this validity interval ends."
        inferred: true
        inferred_reason: "Lapse with no successor is not described; verifiers are then left without a current CRL (M04 no-current-crl)."
        constrained_by:
          - "rfc-2693#R-0094"
      - id: M06-T07
        from: revocation-pending
        to: slot-locked
        trigger: timed-crl
        guard: "The new CRL does not intersect any deployed range and lists every certificate learned false."
        source:
          - locator: "§5.4"
            quote: "That is the earliest one can revoke a certificate one learns to be false."
        inferred: true
        inferred_reason: "Issuing the revoking CRL in the next slot is the reading of the earliest-revocation sentence; the step is not described."
        constrained_by:
          - "rfc-2693#R-0094"
      - id: M06-T08
        from: revocation-pending
        to: slot-locked
        trigger: revalidation
        guard: "The next revalidation does not intersect any deployed range and omits every certificate learned false."
        source:
          - locator: "§5.3"
            quote: "CRLs are negative statements."
          - locator: "§5.4"
            quote: "That is the earliest one can revoke a certificate one learns to be false."
        inferred: true
        inferred_reason: "A revalidation is a positive statement, so revoking means not revalidating; the source does not say so."
        constrained_by:
          - "rfc-2693#R-0088"
          - "rfc-2693#R-0094"
      - id: M06-T09
        from: revocation-pending
        to: revocation-pending
        trigger: issuer-learns-certificate-false
        guard: "none"
        action: "Add the certificate to those awaiting the next slot."
        source:
          - locator: "§5.4"
            quote: "That is the earliest one can revoke a certificate one learns to be false."
        inferred: true
        inferred_reason: "Accumulating several pending revocations is ours."
        constrained_by:
          - "rfc-2693#R-0094"
      - id: M06-T10
        from: slot-locked
        to: no-instrument-deployed
        trigger: clock-passes-revalidation-not-after
        guard: "No successor has been issued (a revalidation series)."
        source:
          - locator: "§5.4"
            quote: "The next available time slot starts after this validity interval ends."
          - locator: "§5.3"
            quote: "As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2)."
        inferred: true
        inferred_reason: "As M06-T06, for a revalidation series through §5.3."
        constrained_by:
          - "rfc-2693#R-0090"
          - "rfc-2693#R-0094"
    error_states:
      - overlap-violation
    unspecified:
      - from: overlap-violation
        trigger: completion
        situation: "What follows an issuer's violation of condition 3, and how verifiers detect or treat it."
        open_question: OQ-03
      - from: slot-locked
        trigger: revalidation
        situation: "Whether non-intersection binds per certificate, per signing key, or per series when one revalidation lists several certificates."
        open_question: OQ-16
      - from: slot-locked
        trigger: timed-crl
        situation: "A new CRL whose not-before equals the deployed CRL's not-after: whether it locks the next slot (M06-T04) or intersects the deployed one (M06-T05). Whether consecutive intervals may abut. Closed intervals [a, b] and [b, c] intersect at b, which condition 3 forbids, so contiguity needs half-open intervals or a gap."
        open_question: OQ-01

  # =====================================================================
  - id: M07
    name: timed-revalidation-status
    locator: "§5.3, §5.2, §5.4, §5"
    actor: verifier
    applies_to: "One certificate whose validity confirmation is a timed revalidation."
    purpose: "The positive counterpart of M04: the certificate is good only while a current revalidation lists it."
    initial: no-current-revalidation
    states:
      - name: no-current-revalidation
        meaning: "No revalidation valid at t, signed by the key the certificate names, lists the certificate. The certificate cannot be processed."
        inferred: true
      - name: revalidated
        meaning: "A revalidation valid at t lists the certificate. The certificate's tuple validity is VIntersect(certificate dates, revalidation dates)."
        inferred: false
      - name: unprocessable
        meaning: "A computation needs the certificate now and no current revalidation listing it can be had."
        inferred: true
    transitions:
      - id: M07-T01
        from: no-current-revalidation
        to: revalidated
        trigger: revalidation
        guard: "Signed by the issuer of validity confirmations the certificate specifies; carries validity dates; valid at t; lists this certificate."
        action: "Emit online-test-passes with the revalidation's validity interval."
        source:
          - locator: "§5.3"
            quote: "Typically a revalidation would list only one certificate (the one of interest), although it might list a set of certificates (to save digital signature effort)."
          - locator: "§5.3"
            quote: "As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2)."
          - locator: "§5"
            quote: "However, in SPKI, the certificate issuer must specify the issuer of validity confirmations."
        inferred: true
        inferred_reason: "The signer, dates and validity checks are the §5.2 rules carried over by §5.3."
        constrained_by:
          - "rfc-2693#R-0072"
          - "rfc-2693#R-0089"
          - "rfc-2693#R-0090"
      - id: M07-T02
        from: no-current-revalidation
        to: no-current-revalidation
        trigger: revalidation
        guard: "It does not list this certificate, or its signer is not the specified issuer, or it carries no validity dates, or it is not valid at t."
        action: "Do not use it. One not yet valid may be kept for M07-T06."
        source:
          - locator: "§5.3"
            quote: "Typically a revalidation would list only one certificate (the one of interest), although it might list a set of certificates (to save digital signature effort)."
        inferred: true
        inferred_reason: "Handling of a non-qualifying revalidation is not described."
        constrained_by:
          - "rfc-2693#R-0089"
      - id: M07-T03
        from: no-current-revalidation
        to: unprocessable
        trigger: online-test-unavailable
        guard: "A computation needs the certificate now."
        action: "Emit online-test-fails."
        source:
          - locator: "§5.3"
            quote: "As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2)."
          - locator: "§5.2"
            quote: "Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier."
        inferred: true
        inferred_reason: "The cannot-be-processed rule is stated for CRLs and applies to revalidations only through the same-rules clause of §5.3."
        constrained_by:
          - "rfc-2693#R-0082"
          - "rfc-2693#R-0083"
          - "rfc-2693#R-0090"
      - id: M07-T04
        from: unprocessable
        to: revalidated
        trigger: revalidation
        guard: "As M07-T01."
        action: "Emit online-test-passes with the revalidation's validity interval."
        source:
          - locator: "§5.3"
            quote: "The positive version of a CRL is what we call a revalidation."
        inferred: true
        inferred_reason: "Recovery is not discussed."
        constrained_by:
          - "rfc-2693#R-0088"
      - id: M07-T05
        from: revalidated
        to: no-current-revalidation
        trigger: clock-passes-revalidation-not-after
        guard: "none"
        source:
          - locator: "§5.3"
            quote: "CRLs are negative statements."
          - locator: "§5.4"
            quote: "That is the earliest one can revoke a certificate one learns to be false."
        inferred: true
        inferred_reason: "A positive statement lapses when its interval ends; this is also how an issuer revokes under revalidation, by issuing no successor that lists the certificate."
        constrained_by:
          - "rfc-2693#R-0088"
          - "rfc-2693#R-0094"
      - id: M07-T06
        from: no-current-revalidation
        to: revalidated
        trigger: clock-passes-revalidation-not-before
        guard: "A held revalidation that passed every other check of M07-T01 becomes valid."
        action: "Emit online-test-passes with its validity interval."
        source:
          - locator: "§5.3"
            quote: "As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2)."
        inferred: true
        inferred_reason: "As M04-T09."
        constrained_by:
          - "rfc-2693#R-0090"
    error_states:
      - unprocessable
    unspecified:
      - from: revalidated
        trigger: revalidation
        situation: "A second revalidation whose validity range intersects the current one."
        open_question: OQ-03
      - from: no-current-revalidation
        trigger: online-test-unavailable
        situation: "Whether unprocessable fails the computation at once, or the verifier may wait and retry."
        open_question: OQ-06

  # =====================================================================
  - id: M08
    name: one-time-revalidation
    locator: "§5.5, §5"
    actor: "the party running the authorization computation, which requests (OQ-09), and the issuer of validity confirmations the certificate names, which answers"
    applies_to: "One certificate whose validity confirmation is a one-time revalidation, within one authorization computation."
    purpose: "A validity confirmation with a zero-length interval, bound to one computation by a nonce."
    initial: not-requested
    states:
      - name: not-requested
        meaning: "No request made in this computation."
        inferred: true
      - name: awaiting-response
        meaning: "A request containing a nonce has been submitted on-line."
        inferred: false
      - name: confirmed
        meaning: "A signed revalidation instrument carrying the request's nonce has arrived. It is good for the current computation only."
        inferred: false
      - name: consumed
        meaning: "The computation completed. The instrument's interval was the single instant of completion and it has no further lifetime."
        inferred: false
      - name: replay-rejected
        meaning: "A correctly signed instrument arrived, but the returned nonce is not the one this computation sent."
        inferred: true
      - name: wrong-signer
        meaning: "The instrument is not signed by the issuer of validity confirmations the certificate specifies."
        inferred: true
      - name: no-confirmation
        meaning: "No instrument arrives in this computation."
        inferred: true
    transitions:
      - id: M08-T01
        from: not-requested
        to: awaiting-response
        trigger: one-time-revalidation-request
        guard: "The request contains a fresh nonce and is submitted on-line during the current computation."
        source:
          - locator: "§5.5"
            quote: "One applies for this on-line, one-time revalidation by submitting a request containing a nonce."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0099"
      - id: M08-T02
        from: awaiting-response
        to: confirmed
        trigger: one-time-revalidation
        guard: "Signed by the issuer of validity confirmations the certificate specifies; the returned nonce equals the request's nonce."
        action: "Emit online-test-passes with interval [tc, tc], where tc is the instant the computation completes, fixed at M08-T06."
        source:
          - locator: "§5.5"
            quote: "That nonce gets returned in the signed revalidation instrument, in order to prevent replay attacks."
          - locator: "§5"
            quote: "However, in SPKI, the certificate issuer must specify the issuer of validity confirmations."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0072"
          - "rfc-2693#R-0100"
      - id: M08-T03
        from: awaiting-response
        to: replay-rejected
        trigger: one-time-revalidation
        guard: "Signed by the issuer of validity confirmations the certificate specifies, and the returned nonce differs from the request's nonce."
        action: "Emit online-test-fails."
        source:
          - locator: "§5.5"
            quote: "That nonce gets returned in the signed revalidation instrument, in order to prevent replay attacks."
        inferred: true
        inferred_reason: "The nonce's stated purpose is replay prevention; rejecting a mismatch is the only reading that achieves it, but the step is not written. The signer conjunct is ours: it makes this guard and M08-T04's mutually exclusive, so a replay is a genuine instrument answering another request and anything wrongly signed is wrong-signer, whatever nonce it carries."
        constrained_by:
          - "rfc-2693#R-0100"
      - id: M08-T04
        from: awaiting-response
        to: wrong-signer
        trigger: one-time-revalidation
        guard: "Not signed by the specified issuer of validity confirmations, whatever nonce it returns."
        action: "Emit online-test-fails."
        source:
          - locator: "§5"
            quote: "However, in SPKI, the certificate issuer must specify the issuer of validity confirmations."
        inferred: true
        inferred_reason: "Rejection of an unspecified signer is our reading of the specify-the-issuer rule."
        constrained_by:
          - "rfc-2693#R-0072"
      - id: M08-T05
        from: awaiting-response
        to: no-confirmation
        trigger: online-test-unavailable
        guard: "No instrument arrives."
        action: "Emit online-test-fails."
        source:
          - locator: "§5.5"
            quote: "For those who want to set the validity interval to zero, SPKI defines a one-time revalidation."
        inferred: true
        inferred_reason: "The source describes no failure or negative response for a one-time revalidation (OQ-09)."
        constrained_by:
          - "rfc-2693#R-0097"
      - id: M08-T06
        from: confirmed
        to: consumed
        trigger: authorization-computation-completes
        guard: "none"
        action: "Fix tc := the completion instant; the test's validity interval is [tc, tc]."
        source:
          - locator: "§5.5"
            quote: "This form of revalidation has no lifetime beyond the current authorization computation."
          - locator: "§5.5"
            quote: "This protocol takes the place of a validity date range and represents a validity interval of zero, starting and ending at the time the authorization computation completes."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0098"
          - "rfc-2693#R-0101"
    error_states:
      - replay-rejected
      - wrong-signer
      - no-confirmation
    terminal_states:
      - consumed
      - replay-rejected
      - wrong-signer
      - no-confirmation
    notes:
      - text: "A consumed instrument presented to a later computation fails M08-T03 there, because that computation sent a different nonce."
        source:
          - locator: "§5.5"
            quote: "This form of revalidation has no lifetime beyond the current authorization computation."
        inferred: true
        inferred_reason: "Derived from the nonce binding."
      - text: "Why the interval is zero rather than short: a timed confirmation with a zero interval would be stale on arrival, and clock skew forces timed intervals to be larger still."
        source:
          - locator: "§5.5"
            quote: "Validity intervals of length zero are not possible."
          - locator: "§5.5"
            quote: "Since transmission takes time, by the time a CRL was received by the verifier, it would be out of date and unusable."
          - locator: "§5.5"
            quote: "If clock skew is taken into consideration, validity intervals need to be that much larger to be meaningful."
        inferred: false
    unspecified:
      - from: not-requested
        trigger: one-time-revalidation-request
        situation: "Who generates the nonce and who submits the request, verifier or prover, and how the verifier knows the nonce is fresh if the prover fetched the answer."
        open_question: OQ-09
      - from: confirmed
        trigger: authorization-computation-completes
        situation: "How a one-time test deferred into a CRC (§6.3.2) can ever be evaluated, given it has no lifetime beyond one computation."
        open_question: OQ-10
      - from: awaiting-response
        trigger: one-time-revalidation
        situation: "A correctly signed instrument with the right nonce that declines to confirm. messages.yaml one-time-revalidation names no verdict field, so M08-T02 cannot tell a refusal from a confirmation."
        open_question: OQ-09

  # =====================================================================
  - id: M09
    name: short-lived-certificate-renewal
    locator: "§5.6, §7"
    actor: "the user of the certificate (OQ-17)"
    applies_to: "A short-lived certificate whose online test statement names where a replacement might be fetched."
    purpose: "Fine-grained validity control by short lifetimes and replacement instead of an online test result."
    initial: current
    states:
      - name: current
        meaning: "The short-lived certificate is valid at t."
        inferred: false
      - name: lapsed
        meaning: "Its not-after has passed; the online test statement names where a replacement might be fetched."
        inferred: true
      - name: no-replacement
        meaning: "No valid replacement can be fetched: the issuer has stopped issuing, or the location cannot be reached."
        inferred: true
    transitions:
      - id: M09-T01
        from: current
        to: lapsed
        trigger: clock-passes-not-after
        guard: "none"
        source:
          - locator: "§5.6"
            quote: "A performance analysis of the various methods of achieving fine-grain control over the validity interval of a certificate should consider the possibility of just making the original certificate short-lived, especially if the online test result is issued by the same key that issued the certificate."
        inferred: true
        inferred_reason: "Expiry of a short-lived certificate follows from M03; the source does not walk through it."
        constrained_by:
          - "rfc-2693#R-0102"
      - id: M09-T02
        from: lapsed
        to: current
        trigger: short-lived-certificate
        guard: "A replacement, fetched from a location the online test statement gives, that is valid at t."
        source:
          - locator: "§5.6"
            quote: "If one wants to issue short-lived certificates, SPKI defines a kind of online test statement to tell the user of the certificate where a replacement short-lived certificate might be fetched."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0103"
      - id: M09-T03
        from: lapsed
        to: no-replacement
        trigger: online-test-unavailable
        guard: "none"
        source:
          - locator: "§7"
            quote: "That is, under SPKI one does not declare a key to be bad but rather stops empowering it and instead empowers some other key."
        inferred: true
        inferred_reason: "Revoking a short-lived certificate means issuing no replacement. The source does not describe the case."
        constrained_by:
          - "rfc-2693#R-0220"
      - id: M09-T04
        from: no-replacement
        to: current
        trigger: short-lived-certificate
        guard: "As M09-T02."
        source:
          - locator: "§5.6"
            quote: "If one wants to issue short-lived certificates, SPKI defines a kind of online test statement to tell the user of the certificate where a replacement short-lived certificate might be fetched."
        inferred: true
        inferred_reason: "Recovery is not discussed."
        constrained_by:
          - "rfc-2693#R-0103"
      - id: M09-T05
        from: current
        to: current
        trigger: short-lived-certificate
        guard: "A replacement, fetched from a location the online test statement gives, arrives before the current certificate's not-after."
        action: "The replacement becomes the current certificate; M09-T01 now waits for its not-after."
        source:
          - locator: "§5.6"
            quote: "If one wants to issue short-lived certificates, SPKI defines a kind of online test statement to tell the user of the certificate where a replacement short-lived certificate might be fetched."
        inferred: true
        inferred_reason: "Timing before expiry is what protocol.yaml short-lived-certificate-renewal step 4 infers; the source says only where a replacement might be fetched."
        constrained_by:
          - "rfc-2693#R-0103"
    error_states:
      - no-replacement
    notes:
      - text: "Rationale the source gives for this regime over certificate plus online test."
        source:
          - locator: "§5.6"
            quote: "There are cases in which the short-lived certificate requires fewer signatures and less network traffic than the various online test options."
          - locator: "§5.6"
            quote: "The use of a short-lived certificate always requires fewer signature verifications than the use of certificate plus online test result."
        inferred: false
    unspecified:
      - from: lapsed
        trigger: short-lived-certificate
        situation: "Who the user of the certificate is (holder or verifier), and whether a replacement must come from the same issuer key."
        open_question: OQ-17

  # =====================================================================
  - id: M10
    name: anti-matter-crl
    locator: "§5.1"
    status: ruled-out
    status_quote: "SPKI has ruled out the use of wandering anti-matter CRLs for its certificates."
    actor: "verifier under the early CRL design that SPKI rejects"
    purpose: "Negative model. It records the behaviour §5.1 describes so that a test can show an SPKI verifier (M04) does not behave this way."
    initial: no-crl-held
    states:
      - name: no-crl-held
        meaning: "No CRL has arrived; the certificate is treated as good."
        inferred: true
      - name: good
        meaning: "The newest CRL held does not list the certificate."
        inferred: true
      - name: annihilated
        meaning: "A CRL that lists the certificate has reached this verifier."
        inferred: false
    transitions:
      - id: M10-T01
        from: no-crl-held
        to: good
        trigger: anti-matter-crl
        guard: "Does not list the certificate."
        source:
          - locator: "§5.1"
            quote: "If one's payment instrument wasn't listed in the book, then that instrument was considered good."
        inferred: true
        inferred_reason: "Stated of the supermarket book the design was modelled on, not of the CRL itself."
        constrained_by: []
      - id: M10-T02
        from: no-crl-held
        to: annihilated
        trigger: anti-matter-crl
        guard: "Lists the certificate."
        source:
          - locator: "§5.1"
            quote: "If the CRL encounters a certificate it has listed, it effectively annihilates that certificate."
        inferred: false
        constrained_by: []
      - id: M10-T03
        from: good
        to: annihilated
        trigger: anti-matter-crl
        guard: "Its sequence number is newer than the held CRL's, and it lists the certificate."
        source:
          - locator: "§5.1"
            quote: "It also had a sequence number, so that one could tell which of two CRLs was more recent."
          - locator: "§5.1"
            quote: "If the CRL encounters a certificate it has listed, it effectively annihilates that certificate."
        inferred: false
        constrained_by: []
      - id: M10-T04
        from: good
        to: good
        trigger: anti-matter-crl
        guard: "Its sequence number is newer and it does not list the certificate."
        action: "Replace the held CRL."
        source:
          - locator: "§5.1"
            quote: "A newer CRL would replace an older one."
          - locator: "§5.1"
            quote: "If it encounters an older CRL, it annihilates that CRL also, leaving a copies of itself at the verifiers it encounters."
        inferred: true
        inferred_reason: "Replacement is stated; that an unlisted certificate stays good is the book analogy of M10-T01."
        constrained_by: []
      - id: M10-T05
        from: good
        to: good
        trigger: anti-matter-crl
        guard: "Its sequence number is older than the held CRL's."
        action: "Ignore it."
        source:
          - locator: "§5.1"
            quote: "It also had a sequence number, so that one could tell which of two CRLs was more recent."
        inferred: true
        inferred_reason: "The source describes a newer CRL meeting an older one, not an older one arriving late."
        constrained_by: []
    error_states:
      - annihilated
    terminal_states:
      - annihilated
    defects:
      - text: "Revocation can be released at any moment and arrives by an uncontrolled route."
        source:
          - locator: "§5.1"
            quote: "If the revocation is urgent, then that CRL can be released immediately."
          - locator: "§5.1"
            quote: "The CRL then follows some dissemination process unrelated to the needs of the consumers of the CRL."
      - text: "The result depends on arrival timing."
        source:
          - locator: "§5.1"
            quote: "However, this process is non-deterministic."
          - locator: "§5.1"
            quote: "The result of the authorization computation is at least timing dependent."
      - text: "Suppressing delivery suppresses revocation."
        source:
          - locator: "§5.1"
            quote: "That is, an adversary can prevent revocation of a given certificate by preventing the delivery of new CRLs."
    conformance_contrast:
      note: "Behaviours in which an SPKI verifier (M04) must differ from this machine. Each is our derivation, as a negative test."
      source:
        - locator: "§5.1"
          quote: "Every authorization computation is deterministic, under SPKI rules."
      inferred: true
      inferred_reason: "The source states the rejection and the defects; the test cases are derived from M04."
      cases:
        - "No CRL held: this machine passes the certificate (no-crl-held counts as good); M04 cannot process it (M04-T04)."
        - "A CRL without validity dates: this machine uses it; M04 does not (M04-T03)."
        - "A CRL intended to take effect before the current one expires: this machine applies it on arrival; under SPKI the issuer may not issue it (M06-T05) and the verifier's handling is OQ-03."

  # =====================================================================
  - id: M11
    name: name-reduction
    locator: "§6.4, §6.4.2, §6.2, §2.8, §6 (stage 2), §7.5, §2.10"
    actor: verifier
    applies_to: "A name used as the subject of a 5-tuple or a name 4-tuple, or as one subordinate subject of a threshold subject."
    purpose: "Stage 2: replace a name by its definition, one name 4-tuple at a time, until a key or hash remains."
    modes:
      - name: prover-ordered
        meaning: "The default. 4-tuples are applied in the order the prover delivers them; both classes apply."
        source:
          - locator: "§6.4"
            quote: "As with the 5-tuples discussed in the previous section, name definition 4-tuples should be delivered in the order needed by the prover."
      - name: unordered-pool
        meaning: "The verifier works from an unordered pool and applies only 4-tuples that define a name as a key (class 1)."
        source:
          - locator: "§6.4"
            quote: "If the verifier is operating from an unordered pool of tuples, then a safe rule for name reduction is to apply only those 4-tuples that define a name as a key."
    state_variable: "The subject name (name K N1 ... Nm), m >= 1, and the validity V of the tuple that holds it. A 4-tuple is class 1, [(name K1 N) -> K2], or class 2, [(name K1 N) -> (name K2 N1 ... Nk)]."
    initial: local-name
    states:
      - name: local-name
        meaning: "A name as written inside a credential, which may be relative to the credential's issuer."
        inferred: true
      - name: qualified
        meaning: "A fully qualified name (name K N1 ... Nm): the key or hash K identifies the name space."
        inferred: false
      - name: resolved
        meaning: "All names consumed: the subject is a key or hash."
        inferred: false
      - name: definition-mismatch
        meaning: "Prover-ordered mode: the next 4-tuple does not define the leading name of the subject."
        inferred: true
      - name: validity-intersection-failed
        meaning: "The 4-tuple matches but its validity does not intersect that of the tuple holding the subject."
        inferred: true
      - name: unresolved
        meaning: "The available 4-tuples ran out with names left."
        inferred: true
    transitions:
      - id: M11-T01
        from: local-name
        to: qualified
        trigger: completion
        guard: "The name is relative, not yet anchored by a key or hash."
        action: "K := the public key of the issuer of the credential the name occurs in."
        source:
          - locator: "§2.8"
            quote: "It is SDSI 1.0 convention, preserved in SPKI, that if a (local) SDSI name occurs within a certificate, then the public key of the issuer is the identifier of the name space in which that name is defined."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0033"
      - id: M11-T02
        from: local-name
        to: qualified
        trigger: completion
        guard: "The name is already fully qualified: a key or hash followed by names."
        source:
          - locator: "§2.8"
            quote: "That name is a public key followed by one or more names relative to that key."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0035"
      - id: M11-T03
        from: qualified
        to: qualified
        trigger: name-4-tuple
        guard: "Either mode. Class 1 [(name K1 N) -> K2] with K1 = K and N = N1; m > 1; VIntersect(V, 4-tuple V) succeeds."
        action: "Subject := (name K2 N2 ... Nm). V := VIntersect(V, 4-tuple V). D and A of the holding tuple unchanged."
        source:
          - locator: "§6.4"
            quote: "In that case, the rule for name reduction is to replace the name just defined by its definition."
          - locator: "§6.4"
            quote: "(name K1 N N1 N2 N3) + [(name K1 N) -> K2] -> (name K2 N1 N2 N3)"
          - locator: "§6.4.2"
            quote: "Whenever a 4-tuple is used to reduce the subject (or part of the subject) of another tuple, its validity interval is intersected with that of the tuple holding the subject being reduced and the intersection is used in the resulting tuple."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0177"
          - "rfc-2693#R-0178"
          - "rfc-2693#R-0190"
      - id: M11-T04
        from: qualified
        to: resolved
        trigger: name-4-tuple
        guard: "Either mode. Class 1 with K1 = K and N = N1; m = 1; VIntersect succeeds."
        action: "Subject := K2. V := VIntersect(V, 4-tuple V). D and A unchanged."
        source:
          - locator: "§6.4"
            quote: "Such applications should bring 4-tuples that started out in class (2) into class (1), and eventually reduce all names to keys."
        inferred: true
        inferred_reason: "That (name K2) with no names left is simply the key K2 is implied by reducing all names to keys, never written out."
        constrained_by:
          - "rfc-2693#R-0183"
      - id: M11-T05
        from: qualified
        to: qualified
        trigger: name-4-tuple
        guard: "Prover-ordered mode. Class 2 [(name K1 N) -> (name K2 N1' ... Nk')] with K1 = K and N = N1; VIntersect succeeds."
        action: "Subject := (name K2 N1' ... Nk' N2 ... Nm), so the name may grow. V := VIntersect(V, 4-tuple V). D and A unchanged."
        source:
          - locator: "§6.4"
            quote: "(name K1 N Na Nb Nc) + [(name K1 N) -> (name K2 N1 N2 ... Nk)] -> (name K2 N1 N2 ... Nk Na Nb Nc)"
          - locator: "§6.4"
            quote: "With the second form of name definition, one might have names that temporarily grow."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0179"
          - "rfc-2693#R-0180"
      - id: M11-T06
        from: qualified
        to: qualified
        trigger: name-4-tuple
        guard: "Unordered-pool mode and the 4-tuple is class 2."
        action: "Do not apply it. Its own subject is a name, reduced by its own instance of this machine; when that resolves, the 4-tuple has become class 1 and is usable by M11-T03 or M11-T04."
        source:
          - locator: "§6.4"
            quote: "If the verifier is operating from an unordered pool of tuples, then a safe rule for name reduction is to apply only those 4-tuples that define a name as a key."
          - locator: "§6.4"
            quote: "Such applications should bring 4-tuples that started out in class (2) into class (1), and eventually reduce all names to keys."
          - locator: "§6.4"
            quote: "Any naming loops are avoided by this process."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0182"
          - "rfc-2693#R-0183"
          - "rfc-2693#R-0184"
      - id: M11-T07
        from: qualified
        to: definition-mismatch
        trigger: name-4-tuple
        guard: "Prover-ordered mode and K1 differs from K or N differs from N1."
        source:
          - locator: "§6.4"
            quote: "If the prover is providing certificates in order, then the verifier need only do as it is told."
        inferred: true
        inferred_reason: "The source does not consider a prover whose order is wrong."
        constrained_by:
          - "rfc-2693#R-0181"
      - id: M11-T08
        from: qualified
        to: validity-intersection-failed
        trigger: name-4-tuple
        guard: "The 4-tuple matches, but VIntersect(V, 4-tuple V) has Vmin > Vmax."
        source:
          - locator: "§6.4.2"
            quote: "Whenever a 4-tuple is used to reduce the subject (or part of the subject) of another tuple, its validity interval is intersected with that of the tuple holding the subject being reduced and the intersection is used in the resulting tuple."
          - locator: "§6.3.2"
            quote: "and if Vmin > Vmax, then the intersection failed."
        inferred: true
        inferred_reason: "The failure of this intersection is not discussed for names."
        constrained_by:
          - "rfc-2693#R-0158"
          - "rfc-2693#R-0190"
      - id: M11-T09
        from: qualified
        to: unresolved
        trigger: sequence-exhausted
        guard: "Names remain in the subject."
        source:
          - locator: "§6"
            quote: "Uses of names are replaced with simple definitions (keys or hashes), based on the name definitions available from reducing name 4-tuples."
        inferred: true
        inferred_reason: "The failure path is not described."
        constrained_by:
          - "rfc-2693#R-0116"
    error_states:
      - definition-mismatch
      - validity-intersection-failed
      - unresolved
    terminal_states:
      - resolved
      - definition-mismatch
      - validity-intersection-failed
      - unresolved
    notes:
      - text: "Applying a 4-tuple never consults the delegation flag. So a key granted an authorization through a name it defines, without permission to delegate, can still pass it on by issuing name certificates; granted directly to the key it cannot. Tests should cover both."
        source:
          - locator: "§6.4.2"
            quote: "Since a 4-tuple contains no delegation or authorization fields, the delegation permission and authorization of the tuple being acted upon does not change."
          - locator: "§7.5"
            quote: "If one delegates some authorization to (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) carl) and a different authorization to (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) directly, both without granting the permission to delegate, that key can delegate at will through <name,key> certificates in the former case and not delegate at all in the latter case."
        inferred: false
      - text: "A name may have several definitions (a group), so several class 1 4-tuples can match one leading name. Which applies is the prover's choice, made by the order it supplies."
        source:
          - locator: "§2.10"
            quote: "Therefore, a named group can be defined by issuing multiple (name,key) certificates with the same name -- one for each group member."
        inferred: true
        inferred_reason: "Attributing the choice to the prover follows from the prover-ordered rule; the source does not connect the two."
    unspecified:
      - from: local-name
        trigger: completion
        situation: "A relative name in the subject of an ACL entry, which has no issuer key to anchor the name space."
        open_question: OQ-24
      - from: qualified
        trigger: name-4-tuple
        situation: "Whether 4-tuples may be applied interleaved with 5-tuple reduction in the prover's one sequence, or only in a separate pass before it."
        open_question: OQ-23
      - from: qualified
        trigger: name-4-tuple
        situation: "A 4-tuple defining the leading name as a threshold subject, which §6.2 allows and neither §6.4 class covers; protocol.yaml four-tuple-name-reduction step 4 applies it only when no names follow (inferred)."
        open_question: OQ-25

  # =====================================================================
  - id: M12
    name: five-tuple-chain-reduction
    locator: "§6.3, §6.3.1, §6.3.2, §6.3.4, §6.1, §4.1.4"
    actor: verifier
    purpose: "Stage 3 as a left fold over the prover-ordered 5-tuples. The state is the accumulated tuple acc."
    state_variable: "acc = <I, S, D, A, V>: issuer of the first tuple; subject and delegation of the last; intersection of all authorizations and of all validities so far."
    invokes:
      - "M13 when acc's subject is a threshold subject"
    initial: empty
    states:
      - name: empty
        meaning: "No tuple consumed yet."
        inferred: true
      - name: accumulating
        meaning: "acc holds the reduction of the tuples consumed so far."
        inferred: false
      - name: threshold-pending
        meaning: "acc's subject is a threshold subject; M13 runs on the tuples that follow."
        inferred: false
      - name: reduced
        meaning: "The prover's sequence is exhausted; acc is the result tuple handed to M01."
        inferred: false
      - name: subject-issuer-mismatch
        meaning: "The next tuple's issuer is not acc's subject."
        inferred: true
      - name: delegation-not-permitted
        meaning: "acc's delegation flag is FALSE, so nothing may be chained after it."
        inferred: true
      - name: authorization-intersection-failed
        meaning: "AIntersect of acc's authorization and the next tuple's is empty."
        inferred: true
      - name: validity-intersection-failed
        meaning: "VIntersect of acc's validity and the next tuple's is empty."
        inferred: true
      - name: threshold-not-satisfied
        meaning: "M13 could not reduce the threshold subject."
        inferred: true
      - name: empty-sequence
        meaning: "The prover supplied no tuple."
        inferred: true
    transitions:
      - id: M12-T01
        from: empty
        to: accumulating
        trigger: 5-tuple
        guard: "none"
        action: "acc := the tuple. For a question asked under an ACL it is the tuple of an ACL entry; the check that the result's issuer is the ACL's own is made in M01-T11."
        source:
          - locator: "§6.6"
            quote: "Is this Subject, S, allowed to do A, under this ACL and with this set of certificates?"
          - locator: "§1.1"
            quote: "the ACL is the source of empowerment for certificates."
        inferred: true
        inferred_reason: "That the fold starts from an ACL entry is our reading of under this ACL (OQ-20)."
        constrained_by:
          - "rfc-2693#R-0002"
          - "rfc-2693#R-0214"
      - id: M12-T02
        from: accumulating
        to: accumulating
        trigger: 5-tuple
        guard: "acc.S is not a threshold subject, and acc.S = next.I, and acc.D = TRUE, and AIntersect(acc.A, next.A) succeeds, and VIntersect(acc.V, next.V) succeeds."
        action: "acc := <acc.I, next.S, next.D, AIntersect(acc.A, next.A), VIntersect(acc.V, next.V)>. The result keeps the next tuple's delegation flag; it is not an AND, because acc.D is already TRUE."
        source:
          - locator: "§6.3"
            quote: "The two 5-tuples: <I1,S1,D1,A1,V1> + <I2,S2,D2,A2,V2> yield <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)> provided the two intersections succeed, S1 = I2 and D1 = TRUE"
          - locator: "§6.3.4"
            quote: "All reduction operations are in the order provided by the prover."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0136"
          - "rfc-2693#R-0137"
          - "rfc-2693#R-0138"
          - "rfc-2693#R-0139"
          - "rfc-2693#R-0171"
      - id: M12-T03
        from: accumulating
        to: subject-issuer-mismatch
        trigger: 5-tuple
        guard: "acc.S differs from next.I."
        source:
          - locator: "§6.3"
            quote: "The two 5-tuples: <I1,S1,D1,A1,V1> + <I2,S2,D2,A2,V2> yield <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)> provided the two intersections succeed, S1 = I2 and D1 = TRUE"
        inferred: true
        inferred_reason: "The source gives the provisos, not the failure behaviour. With the order fixed by the prover, a step whose proviso fails ends the reduction; the verifier does not search for another order."
        constrained_by:
          - "rfc-2693#R-0136"
          - "rfc-2693#R-0137"
          - "rfc-2693#R-0138"
          - "rfc-2693#R-0139"
      - id: M12-T04
        from: accumulating
        to: delegation-not-permitted
        trigger: 5-tuple
        guard: "acc.D is not TRUE."
        source:
          - locator: "§6.1"
            quote: "Delegation: a boolean.  If TRUE, then the Subject is permitted by the Issuer to further propagate the authorization in this intermediate result."
          - locator: "§4.1.4"
            quote: "The subject of a certificate or ACL entry may exercise any permission granted and, if delegation is TRUE, may also delegate that permission or some subset of it to others."
        inferred: true
        inferred_reason: "As M12-T03."
        constrained_by:
          - "rfc-2693#R-0061"
          - "rfc-2693#R-0062"
          - "rfc-2693#R-0124"
      - id: M12-T05
        from: accumulating
        to: authorization-intersection-failed
        trigger: 5-tuple
        guard: "AIntersect(acc.A, next.A) fails."
        source:
          - locator: "§6.3.1"
            quote: "AIntersect() is normal set intersection, when *-forms are defined as they are above and a normal list is taken to mean all lists that start with those elements."
          - locator: "§6.3.1"
            quote: "AIntersect( (tag (* range numeric ge #30# le #39# )), (tag #26#) ) fails to intersect."
        inferred: true
        inferred_reason: "As M12-T03."
        constrained_by:
          - "rfc-2693#R-0156"
      - id: M12-T06
        from: accumulating
        to: validity-intersection-failed
        trigger: 5-tuple
        guard: "max(acc.Vmin, next.Vmin) > min(acc.Vmax, next.Vmax)."
        source:
          - locator: "§6.3.2"
            quote: "Vmin = max( Xmin, Ymin ) Vmax = min( Xmax, Ymax ) and if Vmin > Vmax, then the intersection failed."
        inferred: true
        inferred_reason: "As M12-T03."
        constrained_by:
          - "rfc-2693#R-0157"
          - "rfc-2693#R-0158"
      - id: M12-T07
        from: accumulating
        to: threshold-pending
        trigger: completion
        guard: "acc.S is a threshold subject."
        action: "Start M13 with acc as its threshold tuple."
        source:
          - locator: "§6.3"
            quote: "If S1 is a threshold subject, there is a slight modification to this rule, as described below in section 6.3.3."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0140"
      - id: M12-T08
        from: threshold-pending
        to: accumulating
        trigger: threshold-reduced
        guard: "none"
        action: "acc := the single tuple M13 produced."
        source:
          - locator: "§6.3.3"
            quote: "At that point, those K tuples are validity-, authorization- and delegation- intersected to yield the single tuple that will replace the list of tuples."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0170"
      - id: M12-T09
        from: threshold-pending
        to: threshold-not-satisfied
        trigger: threshold-unsatisfiable
        guard: "none"
        source:
          - locator: "§6.3.3"
            quote: "A threshold subject is reduced to a single subject by selecting K of the N subjects and reducing each of those K to the same subject, through a sequence of certificates."
        inferred: true
        inferred_reason: "The failure case is not described."
        constrained_by:
          - "rfc-2693#R-0166"
      - id: M12-T10
        from: accumulating
        to: reduced
        trigger: sequence-exhausted
        guard: "acc.S is not a threshold subject."
        source:
          - locator: "§6"
            quote: "Authorization 5-tuples are then reduced to a final authorization result."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0117"
      - id: M12-T11
        from: threshold-pending
        to: reduced
        trigger: sequence-exhausted
        guard: "M13 reached left-in-threshold-form: the result is wanted with its subject still in threshold form, as for a CRC."
        source:
          - locator: "§6.4.1"
            quote: "This might be used by a service that produces Certificate Result Certificates [see 6.7]."
        inferred: true
        inferred_reason: "§6.4.1 allows leaving a subject in threshold form for a CRC service; ending the fold there is our reading. Its cross-reference to §6.7 is dangling (OQ-15)."
        constrained_by:
          - "rfc-2693#R-0189"
      - id: M12-T12
        from: empty
        to: empty-sequence
        trigger: sequence-exhausted
        guard: "none"
        source:
          - locator: "§6.3.4"
            quote: "All reduction operations are in the order provided by the prover."
        inferred: true
        inferred_reason: "The empty case is not discussed."
        constrained_by:
          - "rfc-2693#R-0171"
    error_states:
      - subject-issuer-mismatch
      - delegation-not-permitted
      - authorization-intersection-failed
      - validity-intersection-failed
      - threshold-not-satisfied
      - empty-sequence
    terminal_states:
      - reduced
      - subject-issuer-mismatch
      - delegation-not-permitted
      - authorization-intersection-failed
      - validity-intersection-failed
      - threshold-not-satisfied
      - empty-sequence
    guard_functions:
      - name: AIntersect
        meaning: "Set intersection of two authorizations. Lists match element for element, a shorter list behaves as if padded with (*), and the *-forms denote sets. Failure is an empty intersection. §6.3.1 gives five evaluations to use as guard test vectors (examples/)."
        source:
          - locator: "§6.3.1"
            quote: "Two authorizations intersect by matching, element for element."
          - locator: "§6.3.1"
            quote: "If one list is longer than the other but match at all elements where both lists have elements, then the longer list is the result of the intersection."
          - locator: "§6.3.1"
            quote: "(*) stands for the set of all S-expressions and byte-strings."
          - locator: "§6.3.1"
            quote: "(* set <tag-expr>*) stands for the set of elements listed in the *-form."
          - locator: "§6.3.1"
            quote: "(* prefix <byte-string>) stands for the set of all byte strings that start with the one given in the *-form."
          - locator: "§6.3.1"
            quote: "(* range <ordering> <lower-limit>? <upper-limit>?) stands for the set of all byte strings lexically (or numerically) between the two limits."
          - locator: "§6.3.1"
            quote: "The ordering parameter (alpha, numeric, time, binary, date) specifies the kind of strings allowed."
          - locator: "§6.3.1"
            quote: "Special semantics would require special reduction software."
      - name: VIntersect
        meaning: "Vmin is the later of the two not-befores, Vmax the earlier of the two not-afters; it fails when Vmin > Vmax. The full form also intersects the validity interval of each online test (M02-T09, M01-T09). In the deferred mode of §6.3.2 it also takes the union of the operands' deferred online tests (the online_tests list of each tuple's validity; schema tuple-validity online-tests), which is how the tests every tuple carries (M02-T08) reach the result tuple M01-T07 tests; M11-T03 to M11-T05, M13-T04 and M13-T07 carry them the same way."
        source:
          - locator: "§6.3.2"
            quote: "Vmin = max( Xmin, Ymin ) Vmax = min( Xmax, Ymax ) and if Vmin > Vmax, then the intersection failed."
          - locator: "§6.3.2"
            quote: "The full SPKI VIntersect() also deals with online tests."
          - locator: "§6.3.2"
            quote: "It is possible for an implementation of VIntersect() to gather up online tests that are present in each certificate and include the union of all those tests in the accumulating tuples."
    notes:
      - text: "The verifier does not search. Finding a reducible order is the prover's job, and a keyholder extends its own sequence by appending one certificate when it delegates."
        source:
          - locator: "§6.3.4"
            quote: "That simplifies the job of the verifier, but leaves the job of finding the correct list of reductions to the prover."
          - locator: "§6.3.4"
            quote: "To do that, a single additional certificate is generated and appended to the sequence already available, yielding a sequence that can be used by the delegatee to prove access permission."
        inferred: false
      - text: "The step is associative: (t1+t2)+t3 and t1+(t2+t3) impose the same provisos and give the same tuple, because set intersection and max or min are associative. Grouping within the prover's order does not change the result."
        source:
          - locator: "§6.3.1"
            quote: "AIntersect() is normal set intersection, when *-forms are defined as they are above and a normal list is taken to mean all lists that start with those elements."
        inferred: true
        inferred_reason: "Derived property; the source does not state it."
      - text: "When several provisos fail at once, the source gives no precedence among the error states (OQ-11)."
        source:
          - locator: "§6.3"
            quote: "The two 5-tuples: <I1,S1,D1,A1,V1> + <I2,S2,D2,A2,V2> yield <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)> provided the two intersections succeed, S1 = I2 and D1 = TRUE"
        inferred: true
        inferred_reason: "Absence noted, nothing inferred beyond it."
    unspecified:
      - from: accumulating
        trigger: 5-tuple
        situation: "acc.S and next.I name the same key, one as the key and one as its hash: whether S1 = I2 holds (M12-T02) or fails (M12-T03). The same comparison decides K1 = K in M11 and entry.S = next.I in M13."
        open_question: OQ-26
      - from: accumulating
        trigger: name-4-tuple
        situation: "A name 4-tuple met during the fold: protocol.yaml five-tuple-chain-reduction step 2 reduces a name subject of acc in place, while M01-T04 finishes stage 2 first, so M12 consumes no name 4-tuple."
        open_question: OQ-23

  # =====================================================================
  - id: M13
    name: threshold-subject-reduction
    locator: "§6.3.3, §6.4.1, §1.1 (THRESHOLD SUBJECT), §7.7"
    actor: verifier
    purpose: "Reduce a tuple whose subject is K of N subordinate subjects to one tuple with a single subject, or deliberately keep the threshold form."
    state_variable: "K, N, and a list of N subordinate entries. Each entry starts as a copy of the parent tuple with one subordinate subject, and is then either live (its own accumulated tuple) or (null)."
    invokes:
      - "M11 for each subordinate subject that is a name"
    initial: threshold-tuple
    states:
      - name: threshold-tuple
        meaning: "A tuple whose subject is a threshold subject, handed over by M12-T07."
        inferred: true
      - name: invalid-parameters
        meaning: "K and N do not satisfy 0 < K <= N, or the subject does not list exactly N subordinate subjects."
        inferred: true
      - name: reducing
        meaning: "The N entries exist and are reduced one by one; unselected entries are set to (null)."
        inferred: false
      - name: converged
        meaning: "Exactly N-K entries are (null) and the other K have the same subject."
        inferred: false
      - name: merged
        meaning: "The K entries have been intersected into one tuple, which replaces the list."
        inferred: false
      - name: left-in-threshold-form
        meaning: "Named subordinate subjects have been reduced and the subject is kept as a threshold subject, as a CRC service may want. The source points to §6.7 for CRCs, which does not exist; §6.6 is meant (OQ-15)."
        inferred: false
      - name: merge-failed
        meaning: "An intersection across the K entries is empty."
        inferred: true
      - name: unsatisfiable
        meaning: "The prover's sequence ended with fewer than K live entries sharing one subject."
        inferred: true
    transitions:
      - id: M13-T01
        from: threshold-tuple
        to: reducing
        trigger: completion
        guard: "0 < K <= N, and exactly N subordinate subjects are listed."
        action: "Make N entries, each a copy of the parent tuple carrying one subordinate subject."
        source:
          - locator: "§6.3.3"
            quote: "A threshold subject is specified by two numbers, K and N [0<K<=N], and N subordinate subjects."
          - locator: "§6.3.3"
            quote: "The intermediate form for a threshold subject is a copy of the tuple in which the threshold subject appears, but with only one of the subordinate subjects."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0165"
          - "rfc-2693#R-0168"
      - id: M13-T02
        from: threshold-tuple
        to: invalid-parameters
        trigger: completion
        guard: "K <= 0, or K > N, or the number of subordinate subjects listed is not N."
        action: "Emit threshold-unsatisfiable."
        source:
          - locator: "§6.3.3"
            quote: "A threshold subject is specified by two numbers, K and N [0<K<=N], and N subordinate subjects."
        inferred: true
        inferred_reason: "The source states the constraint, not the handling of a subject that breaks it."
        constrained_by:
          - "rfc-2693#R-0165"
      - id: M13-T03
        from: reducing
        to: reducing
        trigger: 5-tuple
        guard: "The tuple extends one live entry by the §6.3 rule: entry.S = next.I, entry.D = TRUE, and both intersections succeed."
        action: "That entry := its §6.3 reduction with the tuple. Its issuer stays the parent's issuer."
        source:
          - locator: "§6.3.3"
            quote: "A threshold subject is reduced to a single subject by selecting K of the N subjects and reducing each of those K to the same subject, through a sequence of certificates."
          - locator: "§6.3.3"
            quote: "Those subordinate tuples are reduced individually until the list of subordinate tuples has (N-K) (null) entries and K entries with the same subject."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0166"
          - "rfc-2693#R-0169"
      - id: M13-T04
        from: reducing
        to: reducing
        trigger: name-4-tuple
        guard: "The 4-tuple reduces a named subordinate subject (M11-T03 to M11-T05)."
        action: "That entry's subject := the M11 result. That entry's V := VIntersect(V, 4-tuple V). Its D and A are unchanged."
        source:
          - locator: "§6.4.1"
            quote: "Those names must be reduced by application of 4-tuples."
          - locator: "§6.4.1"
            quote: "The name reduction process proceeds independently on each name in the subordinate subject as indicated in 6.3.3 above."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0185"
          - "rfc-2693#R-0186"
      - id: M13-T05
        from: reducing
        to: reducing
        trigger: prover-nulls-subordinate
        guard: "none"
        action: "That entry := (null)."
        source:
          - locator: "§6.3.3"
            quote: "The (N-K) unselected subordinate subjects are set to (null)."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0167"
      - id: M13-T06
        from: reducing
        to: converged
        trigger: completion
        guard: "Exactly N-K entries are (null) and the K live entries have the same subject."
        source:
          - locator: "§6.3.3"
            quote: "Those subordinate tuples are reduced individually until the list of subordinate tuples has (N-K) (null) entries and K entries with the same subject."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0169"
      - id: M13-T07
        from: converged
        to: merged
        trigger: completion
        guard: "AIntersect and VIntersect across the K entries succeed."
        action: "Replace the list by one tuple: the parent's issuer; the common subject; D := TRUE only if all K delegation flags are TRUE (OQ-12); A := AIntersect of the K; V := VIntersect of the K. Emit threshold-reduced."
        source:
          - locator: "§6.3.3"
            quote: "At that point, those K tuples are validity-, authorization- and delegation- intersected to yield the single tuple that will replace the list of tuples."
        inferred: true
        inferred_reason: "Delegation-intersection of booleans is not defined; AND is our reading."
        constrained_by:
          - "rfc-2693#R-0170"
      - id: M13-T08
        from: converged
        to: merge-failed
        trigger: completion
        guard: "AIntersect or VIntersect across the K entries fails."
        action: "Emit threshold-unsatisfiable."
        source:
          - locator: "§6.3.3"
            quote: "At that point, those K tuples are validity-, authorization- and delegation- intersected to yield the single tuple that will replace the list of tuples."
        inferred: true
        inferred_reason: "The failure case is not described."
        constrained_by:
          - "rfc-2693#R-0170"
      - id: M13-T09
        from: reducing
        to: unsatisfiable
        trigger: sequence-exhausted
        guard: "The list has not converged: fewer than K live entries share one subject, or K do and some other entry was never set to (null). More than K live entries sharing one subject is under unspecified (OQ-13 (c))."
        action: "Emit threshold-unsatisfiable."
        source:
          - locator: "§6.3.3"
            quote: "A threshold subject is reduced to a single subject by selecting K of the N subjects and reducing each of those K to the same subject, through a sequence of certificates."
        inferred: true
        inferred_reason: "The failure case is not described. Treating an un-nulled entry as failure follows from attributing nulling to the prover (prover-nulls-subordinate); a verifier that nulls the unselected entries itself is the other reading, OQ-13 (f)."
        constrained_by:
          - "rfc-2693#R-0166"
      - id: M13-T10
        from: reducing
        to: left-in-threshold-form
        trigger: completion
        guard: "The named subordinate subjects have been reduced and the caller keeps the threshold form."
        action: "Only validity is intersected; the subject stays a threshold subject."
        source:
          - locator: "§6.4.1"
            quote: "One can reduce individual named subjects in a threshold subject and leave the subject in threshold form, if one desires."
          - locator: "§6.4.1"
            quote: "There is no delegation- or authorization-intersection involved, only a validity-intersection during name reduction."
          - locator: "§6.4.1"
            quote: "This might be used by a service that produces Certificate Result Certificates [see 6.7]."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0187"
          - "rfc-2693#R-0188"
          - "rfc-2693#R-0189"
    error_states:
      - invalid-parameters
      - merge-failed
      - unsatisfiable
    terminal_states:
      - merged
      - left-in-threshold-form
      - invalid-parameters
      - merge-failed
      - unsatisfiable
    notes:
      - text: "Meaning: each subordinate subject holds a 1/K share of the power, and K of them must pass their shares to the same key or object."
        source:
          - locator: "§1.1"
            quote: "Conceptually, the power being transmitted to the Subject by the ACL entry or certificate is transmitted in (1/K) amount to each listed subordinate Subject."
          - locator: "§1.1"
            quote: "K of those subordinate Subjects must agree (by delegating their shares along to the same object or key) for that power to be passed along."
        inferred: false
      - text: "Every entry is a copy of the parent tuple, so the parent's delegation flag must be TRUE for a subordinate key to pass its share on through a certificate it issues (the D1 = TRUE proviso of §6.3, applied per entry)."
        source:
          - locator: "§6.3"
            quote: "The two 5-tuples: <I1,S1,D1,A1,V1> + <I2,S2,D2,A2,V2> yield <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)> provided the two intersections succeed, S1 = I2 and D1 = TRUE"
        inferred: true
        inferred_reason: "Follows from applying the §6.3 rule to each entry; the source does not say it of thresholds."
      - text: "The source's example threshold subjects, written with hex-encoded K and N: 3 of 7 for normal authorizations and 5 of 7 for editing the ACL (M16)."
        source:
          - locator: "§7.7"
            quote: "(k-of-n #03# #07# K1 K2 K3 K4 K5 K6 K7)"
          - locator: "§7.7"
            quote: "(k-of-n #05# #07# K1 K2 K3 K4 K5 K6 K7)"
        inferred: false
    unspecified:
      - from: reducing
        trigger: 5-tuple
        situation: "How a linear prover-ordered sequence designates which entry a tuple extends, notably when two entries have the same key; and what happens when a tuple extends no entry."
        open_question: OQ-13
      - from: reducing
        trigger: completion
        situation: "More than K entries reducing to the same subject; duplicate keys among the N subordinate subjects; nested threshold subjects."
        open_question: OQ-13
      - from: converged
        trigger: completion
        situation: "The meaning of delegation-intersection for boolean flags."
        open_question: OQ-12
      - from: reducing
        trigger: sequence-exhausted
        situation: "More than K live entries share one subject when the prover's sequence ends."
        open_question: OQ-13

  # =====================================================================
  - id: M14
    name: key-empowerment
    locator: "§7, §7.4, §7.5, §7.6, §4.2"
    actor: "keyholder, the issuers who empower the key, and an optional key revocation service"
    applies_to: "A working key empowered through a certificate from a longer-lived key, as in the two models of §7.5."
    purpose: "SPKI defines no way to declare a key bad. A key is usable exactly while some valid certificate empowers it, so its lifecycle is the lifecycle of those certificates."
    initial: created
    states:
      - name: created
        meaning: "The key pair exists; no certificate or ACL entry empowers it."
        inferred: true
      - name: empowered
        meaning: "At least one certificate or ACL entry valid at t empowers the key."
        inferred: false
      - name: loss-reported
        meaning: "The keyholder has reported the key lost to the revocation service; the revocation waits for the next online-test slot (M06)."
        inferred: false
      - name: disempowered
        meaning: "No certificate valid at t empowers the key: its certificates expired without replacement, or were revoked through their online tests."
        inferred: false
    transitions:
      - id: M14-T01
        from: created
        to: empowered
        trigger: authorization-certificate
        guard: "An authorization certificate to the key, valid at t; for example from the keyholder's long-lived key, delegating all rights."
        source:
          - locator: "§7.6"
            quote: "In the second, it will be an authorization certificate delegating all rights through to the more temporary key."
          - locator: "§4.2"
            quote: "We decided that a delegator is free to create a new key pair, also controlled by it, and delegate the rights to that key to exercise the delegated permission."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0065"
      - id: M14-T02
        from: created
        to: empowered
        trigger: name-certificate
        guard: "A <name,key> certificate binding a name under the long-lived key to this key, valid at t."
        source:
          - locator: "§7.6"
            quote: "In the first model, it will be a <name,key> certificate."
        inferred: false
        constrained_by: []
      - id: M14-T03
        from: empowered
        to: empowered
        trigger: authorization-certificate
        guard: "Model 2: a replacement authorization certificate issued before the current one expires (model 1 is M14-T09)."
        source:
          - locator: "§7"
            quote: "Rather than define a mechanism for declaring a key to be bad or replaced, SPKI defines a mechanism for giving certificates limited lifetimes so that they can be replaced."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0219"
      - id: M14-T04
        from: empowered
        to: disempowered
        trigger: clock-passes-not-after
        guard: "The last certificate empowering the key expires and nothing replaces it."
        source:
          - locator: "§7"
            quote: "That is, under SPKI one does not declare a key to be bad but rather stops empowering it and instead empowers some other key."
          - locator: "§7"
            quote: "Therefore, all key lifetime control becomes certificate lifetime control."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0220"
          - "rfc-2693#R-0222"
      - id: M14-T05
        from: empowered
        to: loss-reported
        trigger: key-loss-reported
        guard: "The empowering certificate names an online test that the service supplies."
        source:
          - locator: "§7.6"
            quote: "Either of those certificates might want an on-line validity test."
          - locator: "§7.6"
            quote: "That service could run a 24x7 manned desk, to receive phone calls reporting loss of a key."
        inferred: false
        constrained_by: []
      - id: M14-T06
        from: loss-reported
        to: disempowered
        trigger: timed-crl
        guard: "The next CRL, in the next free slot (M06-T07), lists the empowering certificate."
        source:
          - locator: "§7.6"
            quote: "That authority would not have the power to generate a new key for the user, only to revoke a current one."
        inferred: true
        inferred_reason: "The source says the service can revoke; that it does so through the certificate's CRL, at the next slot, is the application of §5.2 and §5.4."
        constrained_by:
          - "rfc-2693#R-0236"
      - id: M14-T07
        from: loss-reported
        to: disempowered
        trigger: clock-passes-revalidation-not-after
        guard: "The service issues no further revalidation listing the empowering certificate."
        source:
          - locator: "§7.6"
            quote: "Whether this test is in the form of a CRL, a re-validation or a one-time test, it will be supplied by some entity that is on-line."
        inferred: true
        inferred_reason: "As M14-T06, through revalidation (M06-T08)."
        constrained_by: []
      - id: M14-T08
        from: loss-reported
        to: disempowered
        trigger: online-test-fails
        guard: "The empowering certificate relies on one-time revalidation and the service stops confirming it."
        source:
          - locator: "§7.6"
            quote: "Whether this test is in the form of a CRL, a re-validation or a one-time test, it will be supplied by some entity that is on-line."
        inferred: true
        inferred_reason: "As M14-T06, through one-time revalidation (M08-T05). Takes effect at the next computation, with no slot to wait for."
        constrained_by: []
      - id: M14-T09
        from: empowered
        to: empowered
        trigger: name-certificate
        guard: "Model 1: a replacement <name,key> certificate issued before the current one expires."
        source:
          - locator: "§7.6"
            quote: "In the first model, it will be a <name,key> certificate."
          - locator: "§7"
            quote: "Rather than define a mechanism for declaring a key to be bad or replaced, SPKI defines a mechanism for giving certificates limited lifetimes so that they can be replaced."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0219"
    terminal_states:
      - disempowered
    constraints:
      - text: "The revocation service can revoke but cannot generate or empower a replacement key."
        source:
          - locator: "§7.6"
            quote: "That authority would not have the power to generate a new key for the user, only to revoke a current one."
        inferred: false
      - text: "A certificate that names no online test cannot be stopped early: it ends only at its not-after."
        source:
          - locator: "§7"
            quote: "This limitation of a certificate's lifetime might be by limited lifetime at time of issuance or might be via the lifetime acquired through an on-line test (CRL, revalidation or one-time)."
        inferred: true
        inferred_reason: "Derived: these are the only two limits the source names."
    notes:
      - text: "Why keys are replaced routinely rather than only on noticed theft."
        source:
          - locator: "§7"
            quote: "More likely, the theft will not be noticed."
          - locator: "§7"
            quote: "To cover this case, keys are replaced routinely."
        inferred: false
      - text: "Long-lived keys in succession can cover a keyholder indefinitely, and delegating from a long-lived key to a working key through a SDSI name leaves more freedom than delegating to the key directly (see the M11 delegation note)."
        source:
          - locator: "§7.4"
            quote: "Once a key lifetime exceeds the expected lifetime of any authorization granted through it, then a succession of new, long-lifetime keys can cover a keyholder forever."
          - locator: "§7.5"
            quote: "In the case of key management, we desire the ability to delegate from a long lived, rarely used key to a shorter lived, often used key -- so in this case, the former mechanism (through a SDSI name) gives more freedom."
        inferred: false
    unspecified:
      - from: disempowered
        trigger: authorization-certificate
        situation: "Re-empowering a disempowered key. Nothing forbids it, which for a key reported lost would undo the revocation."
        open_question: OQ-21

  # =====================================================================
  - id: M15
    name: master-key-loss
    locator: "§7.6"
    actor: "keyholder and every issuer of authorizations through the master key"
    purpose: "Recovery from loss of the master key itself, which no revocation service can perform."
    initial: master-in-use
    states:
      - name: master-in-use
        meaning: "The master key is held and uncompromised."
        inferred: true
      - name: lost-reissuing
        meaning: "The master key is lost but not known to be stolen. Every issuer of authorizations through it re-issues them through the new master key."
        inferred: false
      - name: stolen-reissuing-and-cancelling
        meaning: "The master key was stolen. Issuers re-issue through the new master key and cancel every old authorization through the old one."
        inferred: false
      - name: recovered
        meaning: "Every needed authorization has been re-issued through the new master key and, if the old key was stolen, every old one cancelled or expired."
        inferred: true
    transitions:
      - id: M15-T01
        from: master-in-use
        to: lost-reissuing
        trigger: master-key-lost
        guard: "none"
        source:
          - locator: "§7.6"
            quote: "If, in the worst case, a user loses his master key, then the same process that occurs today with lost wallets would apply."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0237"
      - id: M15-T02
        from: master-in-use
        to: stolen-reissuing-and-cancelling
        trigger: master-key-stolen
        guard: "none"
        source:
          - locator: "§7.6"
            quote: "All issuers of authorizations through that master key would need to issue new authorizations through the new master key and, if the old master key had been stolen, cancel all old authorizations through that key."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0237"
          - "rfc-2693#R-0238"
      - id: M15-T03
        from: lost-reissuing
        to: stolen-reissuing-and-cancelling
        trigger: master-key-stolen
        guard: "The lost key is found to have been stolen."
        source:
          - locator: "§7.6"
            quote: "All issuers of authorizations through that master key would need to issue new authorizations through the new master key and, if the old master key had been stolen, cancel all old authorizations through that key."
        inferred: true
        inferred_reason: "Discovering theft after loss is not discussed."
        constrained_by:
          - "rfc-2693#R-0237"
          - "rfc-2693#R-0238"
      - id: M15-T04
        from: lost-reissuing
        to: lost-reissuing
        trigger: authorization-certificate
        guard: "An issuer of an authorization through the old master key issues its replacement through the new master key."
        source:
          - locator: "§7.6"
            quote: "All issuers of authorizations through that master key would need to issue new authorizations through the new master key and, if the old master key had been stolen, cancel all old authorizations through that key."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0237"
          - "rfc-2693#R-0238"
      - id: M15-T05
        from: stolen-reissuing-and-cancelling
        to: stolen-reissuing-and-cancelling
        trigger: authorization-certificate
        guard: "As M15-T04."
        source:
          - locator: "§7.6"
            quote: "All issuers of authorizations through that master key would need to issue new authorizations through the new master key and, if the old master key had been stolen, cancel all old authorizations through that key."
        inferred: false
        constrained_by:
          - "rfc-2693#R-0237"
          - "rfc-2693#R-0238"
      - id: M15-T06
        from: stolen-reissuing-and-cancelling
        to: stolen-reissuing-and-cancelling
        trigger: timed-crl
        guard: "A CRL lists an old authorization through the old master key."
        source:
          - locator: "§7"
            quote: "This limitation of a certificate's lifetime might be by limited lifetime at time of issuance or might be via the lifetime acquired through an on-line test (CRL, revalidation or one-time)."
        inferred: true
        inferred_reason: "The source says cancel without saying how; in SPKI only an online test or expiry ends a certificate (OQ-18)."
        constrained_by:
