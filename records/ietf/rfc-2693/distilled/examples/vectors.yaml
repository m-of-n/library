      - SPKI-631-02
    notes: 'The longer-list rule. Elements 1 and 2 match, and the extra element (dir /pub/cme) survives. The operands are two separate displays (SPKI-631-01, SPKI-631-02) and the source states their intersection in prose, hence fidelity split. These are bare authorization bodies: the five AIntersect calls below wrap theirs in (tag ...).'

  - id: SPKI-631-04
    locator: "RFC 2693 Section 6.3.1"
    kind: authorization-sexp
    notation: sexp
    fidelity: verbatim
    input: '(ftp ftp.clark.net /pub/cme)'
