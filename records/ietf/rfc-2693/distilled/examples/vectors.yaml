    notation: sexp
    fidelity: split
    input_lines:
      - '(ftp (host ftp.clark.net))'
      - '(ftp (host ftp.clark.net) (dir /pub/cme))'
    operands:
      - '(ftp (host ftp.clark.net))'
      - '(ftp (host ftp.clark.net) (dir /pub/cme))'
    result: '(ftp (host ftp.clark.net) (dir /pub/cme))'
    outcome: succeeds
    expected: 'The intersection of the two would be the second.'
    expected_basis: stated
    source_text:
      - 'If one list is longer than the other but match at all elements where both lists have elements, then the longer list is the result of the intersection. This means that additional elements of a list must restrict the permission granted.'
