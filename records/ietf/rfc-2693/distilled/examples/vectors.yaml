      - SPKI-77-04
    derived:
      in_source: false
      K: 5
      N: 7
      subordinate_count: 7
      checks: 'subordinate count equals N, and 0 < K <= N'

  - id: SPKI-77-04
    locator: "RFC 2693 Section 7.7"
    kind: threshold-reduction
    notation: tuple-notation
    fidelity: constructed
    input_lines:
      - '<Self,(k-of-n #03# #07# K1 K2 K3 K4 K5 K6 K7),TRUE,Anormal,V0>'
      - '<Self,(k-of-n #05# #07# K1 K2 K3 K4 K5 K6 K7),TRUE,(tag (acl-edit)),V0>'
      - '<K1,Kop,FALSE,(tag (*)),V0>'
      - '<K2,Kop,FALSE,(tag (*)),V0>'
      - '<K3,Kop,FALSE,(tag (*)),V0>'
      - '<K4,Kop,FALSE,(tag (*)),V0>'
    bindings:
      Anormal: 'the "normal authorization" of the first ACL entry'
      Kop: 'the key four of the seven root keys agree to empower'
      V0: 'any validity interval'
    query: 'does Kop hold Anormal, and does it hold (tag (acl-edit))?'
    expected: 'A threshold subject is reduced to a single subject by selecting K of the N subjects and reducing each of those K to the same subject, through a sequence of certificates.'
    expected_basis: rule-quoted
    expected_locator: "RFC 2693 Section 6.3.3"
    related:
      - SPKI-77-02
      - SPKI-77-03
    notes: 'The same four keys, two thresholds: enough to use the ACL, not enough to edit it. This is the asymmetry the two Section 7.7 subjects are printed to show.'
    derived:
      in_source: false
      normal_entry: 'K = 3 is met by four agreeing keys; select any three and set the fourth and K5 to K7 to (null). Result <Self,Kop,FALSE,Anormal,V0>; succeeds.'
      acl_edit_entry: 'K = 5 is not met by four; fails.'

