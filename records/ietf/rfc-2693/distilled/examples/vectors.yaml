  # ===================================================================
  # Section 5 -- Validity conditions (constructed)
  # ===================================================================
  #
  # Times are abstract monotonic integers; see TIME at the head of this file.

  - id: SPKI-51-01
    locator: "RFC 2693 Section 5.1"
    kind: revocation-scenario
    notation: prose
    fidelity: constructed
    input_lines:
      - 'certificate C, revocable by CRL'
      - 'CRL1: sequence number 1; does not list C; held by the verifier'
      - 'CRL2: sequence number 2; lists C; its delivery is blocked by an adversary'
    expected: 'That is, an adversary can prevent revocation of a given certificate by preventing the delivery of new CRLs.'
    expected_basis: stated
    source_text:
      - 'SPKI has ruled out the use of wandering anti-matter CRLs for its certificates. Every authorization computation is deterministic, under SPKI rules.'
      - 'It also had a sequence number, so that one could tell which of two CRLs was more recent.'
    related:
      - SPKI-52-02
      - SPKI-52-03
    notes: 'A NEGATIVE DESIGN VECTOR. The anti-matter model is described so that it can be rejected. A sequence number orders the CRLs a verifier has; it cannot tell the verifier that a newer one exists.'
    derived:
      in_source: false
      outcome_anti_matter: 'the verifier accepts C on the strength of CRL1, and the revocation is silently defeated'
      outcome_spki: 'SPKI forbids the model. Under Section 5.2 a CRL carries validity dates and CRLs may not overlap, so CRL2 cannot take effect while CRL1 is current; once CRL1 expires, C cannot be processed until a valid CRL is in hand (SPKI-52-02).'

  - id: SPKI-52-01
    locator: "RFC 2693 Section 5.2"
    kind: crl-validity
    notation: prose
    fidelity: constructed
    input_lines:
      - 'certificate C: validity [0, 1000]; lists Kcrl as the key that signs its CRL'
      - 'CRL1: signed by Kcrl; validity [100, 200]; does not list C'
      - 'verification time: 150'
    expected: '1. The certificate must list the key (or its hash) that will sign the CRL and may give one or more locations where that CRL might be fetched. 2. The CRL must carry validity dates. 3. CRL validity date ranges must not intersect.'
    expected_basis: rule-quoted
    source_text:
      - 'The CRL in this case is a completion of the certificate, rather than a message to the world announcing a change of mind.'
      - 'That sequence of instruments is then treated as a current CRL and the combined CRL must follow the conditions listed above.'
    notes: 'The positive baseline for Section 5.2. The second quote extends the conditions to a full CRL followed by delta-CRLs.'
    derived:
      in_source: false
      rule: 'Section 6, stage 1: the validity dates of on-line test results are intersected by VIntersect() with the validity dates of the certificate to yield the dates in the certificate''s tuple'
      tuple_validity: '[100, 200]'
      outcome: 'succeeds; C is processed, and its tuple carries validity [100, 200], not [0, 1000]'

  - id: SPKI-52-02
    locator: "RFC 2693 Section 5.2"
    kind: crl-validity
    notation: prose
    fidelity: constructed
    input_lines:
