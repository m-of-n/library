  - id: SPKI-633-02
    locator: "RFC 2693 Section 6.3.3"
    kind: threshold-reduction
    notation: tuple-notation
    fidelity: constructed
    input_lines:
      - '<Self,(k-of-n #03# #07# K1 K2 K3 K4 K5 K6 K7),TRUE,(tag (*)),V0>'
      - '<K1,Kx,FALSE,(tag (* set (ssl) (dns))),V1>'
      - '<K2,Kx,FALSE,(tag (ssl)),V2>'
      - '<K3,Kx,FALSE,(tag (*)),V3>'
    bindings:
      subject: 'the threshold subject of SPKI-77-02, printed in Section 7.7'
      V0: '[0, 1000]'
      V1: '[100, 900]'
      V2: '[200, 800]'
      V3: '[300, 700]'
    expected: 'Those subordinate tuples are reduced individually until the list of subordinate tuples has (N-K) (null) entries and K entries with the same subject. At that point, those K tuples are validity-, authorization- and delegation- intersected to yield the single tuple that will replace the list of tuples.'
    expected_basis: rule-quoted
    source_text:
      - 'A threshold subject is reduced to a single subject by selecting K of the N subjects and reducing each of those K to the same subject, through a sequence of certificates.'
      - 'The intermediate form for a threshold subject is a copy of the tuple in which the threshold subject appears, but with only one of the subordinate subjects.'
    related:
      - SPKI-77-02
    notes: '"delegation- intersected" is not defined. All three D here are FALSE, so the result does not depend on how it is read; the natural reading is logical AND.'
    derived:
      in_source: false
      intermediate_form:
        - '<Self,K1,TRUE,(tag (*)),V0>'
        - '<Self,K2,TRUE,(tag (*)),V0>'
        - '<Self,K3,TRUE,(tag (*)),V0>'
        - '<Self,K4,TRUE,(tag (*)),V0>'
        - '<Self,K5,TRUE,(tag (*)),V0>'
        - '<Self,K6,TRUE,(tag (*)),V0>'
        - '<Self,K7,TRUE,(tag (*)),V0>'
      steps:
        - 'copy 1 + <K1,Kx,FALSE,(tag (* set (ssl) (dns))),V1> -> <Self,Kx,FALSE,(tag (* set (ssl) (dns))),[100, 900]>'
        - 'copy 2 + <K2,Kx,FALSE,(tag (ssl)),V2> -> <Self,Kx,FALSE,(tag (ssl)),[200, 800]>'
        - 'copy 3 + <K3,Kx,FALSE,(tag (*)),V3> -> <Self,Kx,FALSE,(tag (*)),[300, 700]>'
        - 'copies 4 to 7 are unselected and set to (null): N-K = 4'
        - 'intersect the three: A = (tag (ssl)); V = [300, 700]; D = FALSE'
      result: '<Self,Kx,FALSE,(tag (ssl)),[300, 700]>'
      outcome: succeeds

