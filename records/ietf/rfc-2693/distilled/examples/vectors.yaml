    query: 'reduce (name K1 Na) to a key, the two 4-tuples arriving as an unordered pool'
    expected: 'If the verifier is operating from an unordered pool of tuples, then a safe rule for name reduction is to apply only those 4-tuples that define a name as a key. Such applications should bring 4-tuples that started out in class (2) into class (1), and eventually reduce all names to keys. Any naming loops are avoided by this process.'
