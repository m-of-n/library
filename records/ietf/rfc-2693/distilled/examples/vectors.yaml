count_reconciliation: "94 = 58 vectors whose input the source prints + 36 constructed vectors. The 58 by section: 2.6.1: 1, 2.6.2: 2, 2.8: 1, 2.9: 2, 3.1: 1, 3.2: 2, 3.3: 4, 6.3: 1, 6.3.1: 13, 6.3.2: 1, 6.3.3: 1, 6.4: 4, 6.5.1: 2, 6.5.2: 1, 6.5.3: 1, 6.5.7: 11, 7.3: 3, 7.5: 2, 7.7: 3, 8: 2. They cover all 34 body display lines that begin with an open parenthesis (the other 4 of the 38 source lines matching that pattern are running prose, at lines 481, 1087, 1167 and 1502), every other example display (3 SDSI names, 9 mapping chains, the 5-tuple rule, 5 AIntersect calls and their 4 printed results, the VIntersect definition, 2 name-tuple classes, 2 name reductions, 3 translation tuples, 2 quoted names), and 2 S-expressions printed inline in prose: (null) in 6.3.3 and (tag (*)) in 6.5.3. Two displays yield more than one vector: line 1764 prints two S-expressions (SPKI-657-10, SPKI-657-11), and the ftp pair at lines 1373 and 1379 yields a third vector, SPKI-631-03, for the intersection the source states between them. The 36 constructed vectors by section: 1.1: 2, 2.10: 1, 4.1.2: 1, 4.2: 1, 4.3: 1, 5.1: 1, 5.2: 6, 5.3: 1, 5.4: 1, 5.5: 3, 6.3: 5, 6.3.2: 4, 6.3.3: 3, 6.3.4: 1, 6.4: 1, 6.4.1: 1, 6.4.2: 1, 6.5.7: 1, 7.7: 1. Each tests a rule or a scenario outcome the source states and prints no literal for. Sections with no vector of either kind, and why, are listed in README.md."

# ====================================================================
# Conventions used in this file
# ====================================================================
#
# Every vector carries:
#   id              SPKI-<section digits>-NN, never reused. Section 2.10 is
#                   210, Section 6.3.1 is 631, Section 8 is 8.
#   locator         the section of RFC 2693 the vector is taken from
#   kind            what the vector tests
#   notation        how to read `input` (below)
#   fidelity        describes `input` / `input_lines`:
#                     verbatim     -- character-for-character the whole of
#                                     the source display, margin removed
#                     split        -- taken out of a larger display or out of
#                                     running prose; every character is still
#                                     the source's, but the vector does not
#                                     reproduce the whole line (list numbers,
#                                     trailing full stops, connectives and a
#                                     second S-expression on the same line
#                                     are left out)
#                     constructed  -- built for this file from a rule or a
#                                     scenario the source states but prints no
#                                     literal for
#   input / input_lines   the example. One line -> `input`. More than one
#                   line -> `input_lines`, a YAML sequence in source order, and
#                   NO `input` key (block scalars are not used, following the
#                   rfc-9804 convention).
#   expected        what the source says, or the rule that governs it
#   expected_basis  how far `expected` can be trusted:
#                     stated       -- the source states this result for this
#                                     input; `expected` is a verbatim quote
#                     rule-quoted  -- the source states no result for this
#                                     input; `expected` quotes, verbatim, the
#                                     rule that governs it, and the computed
#                                     result is under `derived`
#                     rule-prose   -- as rule-quoted, but `expected` is a
#                                     prose statement of the rule, not a quote
#                   Quotes are verbatim after whitespace normalisation: a line
#                   break plus the next line's margin reads as one space, and
#                   the page header and footer lines are not text.
#   notes           commentary; never a value an implementation consumes
#
# Optional fields:
#   result, outcome     present at top level ONLY when the source states them.
#                       `result` is the printed value, split from its display;
#                       `outcome` is succeeds | fails for the operation named
#                       by `kind`. Anything computed sits under `derived`.
#   operands            for intersections and reductions: each operand, split
#                       verbatim from the input
#   conditions          the guard lines of the 5-tuple rule, verbatim
#   sexp                the S-expression inside an input that also carries
#                       notation (an SDSI name-space label, prose quotes)
#   namespace_label     the "owner:" label written before an SDSI name
#   bindings            what each symbol in a constructed input stands for
#   query               for constructed vectors: what is being asked
#   source_text         further verbatim quotes that ground the vector;
#                       checked exactly like `expected`
#   expected_locator    when the quoted rule is in another section
#   source_annotation   connective text the source prints with the example
#   same_as / related   cross-links: same input text / bears on
#   equivalent_to       the source states the two inputs are equivalent
#   issuers_trusted     for mapping chains: how many issuers the source says
#                       must be trusted
#   source_issue        a defect, inconsistency or ambiguity in the SOURCE,
#                       recorded and not repaired; see README
#
# NOTATION.
#   sexp             a concrete S-expression in the advanced (human-readable)
#                    form. Lexes under RFC 9804 rules and obeys the Section
#                    1.1 restrictions (no empty list; every list starts with a
#                    string) -- both checked mechanically
#   sexp-schematic   lexically an S-expression, but its atoms are
#                    metavariables (K1, N, N1 ... Nk) standing for keys and
#                    names
#   sexp-template    an S-expression shape holding <placeholders>, "..." or
#                    a trailing "*" or "?" -- balanced, but not lexically
#                    valid; never feed it to a parser
#   sexp-labelled    an SDSI name written as "owner:  (name ...)"; the label
#                    is notation for the name space, not part of the value
#   function-call    AIntersect( x, y ) as printed in Section 6.3.1
#   tuple-notation   the source's own <I,S,D,A,V> 5-tuples and [...] 4-tuples
#   mapping-notation arrow chains such as authorization -> key
#   quoted-text      a value written inside prose quotation marks
#   prose            a constructed scenario stated in words
#
# INDENTATION. Every example sits inside the RFC's text margin. That margin
# is page layout and has been removed. Indentation RELATIVE to the first line
# of a multi-line example is preserved exactly: the second operand of each
# AIntersect call is aligned under the first, twelve columns in, as printed.
#
# QUOTING. Every string is a YAML quoted scalar. The source contains no
# backslash, so no value does either. Double quotes are used where a value
# contains an apostrophe and no double quote; otherwise single quotes, with
# an apostrophe doubled in the few values that contain both kinds of quote.
#
# TIME. RFC 2693 prescribes no date format ("These rules assume that
# daytimes are expressed in a monotonic form"). Constructed vectors use
# abstract monotonic integers; -inf and +inf are the values Sections 6.1
# and 6.2 assume for a missing not-before and not-after.
#
# REQUIREMENTS. RFC 2693 contains no BCP 14 keyword. No vector carries a
# `constrains` link, and none cites a requirement id.
#
# DERIVED MATERIAL is never mixed into `input`, `expected`, `result` or
# `outcome`. It appears under `derived:` with `in_source: false`, together
# with the rule applied.

vectors:

  # ===================================================================
  # Section 1.1 -- Glossary (S-EXPRESSION)
  # ===================================================================
  #
  # The glossary narrows the S-expression format: no empty lists, and the
  # first element of every list is a string. The source prints no
  # counter-example, so both vectors are constructed.

  - id: SPKI-11-01
    locator: "RFC 2693 Section 1.1"
    kind: sexp-profile-restriction
    notation: sexp
    fidelity: constructed
    input: '()'
    expected: 'S-EXPRESSION: the data format chosen for SPKI/SDSI. This is a LISP-like parenthesized expression with the limitations that empty lists are not allowed and the first element in any S-expression must be a string, called the "type" of the expression.'
    expected_basis: rule-quoted
    notes: 'The SPKI profile is narrower than the general format: RFC 9804 accepts the empty list (rfc-9804 vector SEXP-5-05), RFC 2693 forbids it. A general S-expression parser accepts this input; an SPKI consumer must reject it.'
    derived:
      in_source: false
      rule: 'Section 1.1: "empty lists are not allowed"'
      outcome: fails

  - id: SPKI-11-02
    locator: "RFC 2693 Section 1.1"
    kind: sexp-profile-restriction
    notation: sexp
    fidelity: constructed
    input: '((ftp) (host ftp.clark.net))'
    expected: 'S-EXPRESSION: the data format chosen for SPKI/SDSI. This is a LISP-like parenthesized expression with the limitations that empty lists are not allowed and the first element in any S-expression must be a string, called the "type" of the expression.'
    expected_basis: rule-quoted
    notes: 'Built from atoms the source prints in Section 6.3.1. Every concrete S-expression the source itself prints meets both restrictions; that is checked mechanically and recorded in README.'
    derived:
      in_source: false
      rule: 'Section 1.1: "the first element in any S-expression must be a string"'
      why: 'the first element of the outer list is the list (ftp), not a string'
      outcome: fails

  # ===================================================================
  # Section 2.6.1 / 2.6.2 -- Basic and Compound SDSI Names
  # ===================================================================

  - id: SPKI-261-01
    locator: "RFC 2693 Section 2.6.1"
    kind: sdsi-basic-name
    notation: sexp-labelled
    fidelity: verbatim
    input: 'george:  (name fred)'
    sexp: '(name fred)'
    namespace_label: 'george'
    expected: 'represents a basic SDSI name "fred" in the name space defined by george.'
    expected_basis: stated
    source_text:
      - 'A basic SDSI 2.0 name is an S-expression with two elements: the word "name" and the chosen name.'
    related:
      - SPKI-262-02
    notes: 'The label "george:" names the name space; it is not part of the S-expression. Inside a certificate the name space is the issuer key (Section 2.8). The two spaces after the colon are as printed.'

  - id: SPKI-262-01
    locator: "RFC 2693 Section 2.6.2"
    kind: sdsi-basic-name
    notation: sexp-labelled
    fidelity: verbatim
    input: 'fred:  (name sam)'
    sexp: '(name sam)'
    namespace_label: 'fred'
    expected: 'If fred in turn defines a name, for example, fred: (name sam)'
    expected_basis: stated
    related:
      - SPKI-262-02
    notes: 'The same notation as SPKI-261-01: a basic name sam in the name space of fred, where fred is itself the entity george calls fred.'

  - id: SPKI-262-02
    locator: "RFC 2693 Section 2.6.2"
    kind: sdsi-compound-name
    notation: sexp-labelled
    fidelity: verbatim
    input: 'george:  (name fred sam)'
    sexp: '(name fred sam)'
    namespace_label: 'george'
    expected: 'then george can refer to this same entity as george: (name fred sam)'
    expected_basis: stated
    related:
      - SPKI-261-01
      - SPKI-262-01
      - SPKI-64-03
    notes: 'The document''s only compound-name example, and the case Section 2.8 points back to as "an example of SDSI name chaining". "This same entity" is the one fred calls sam.'
    derived:
      in_source: false
      rule: 'Section 6.4: "the rule for name reduction is to replace the name just defined by its definition."'
      bindings:
        Kgeorge: 'the key of george, owner of the name space the label names'
        Kfred: 'the key george''s name fred is bound to'
        Ksam: 'the key fred''s name sam is bound to'
      steps:
        - '(name Kgeorge fred sam) + [(name Kgeorge fred) -> Kfred] -> (name Kfred sam)'
        - '(name Kfred sam) + [(name Kfred sam) -> Ksam] -> Ksam'
      result: 'Ksam'
      outcome: succeeds
      note: 'george''s (name fred sam) and fred''s (name sam) reduce to the same key, which is what "this same entity" asserts. The source prints no reduction in which nothing remains after the replacement; the bare key follows from the same replacement rule.'

  # ===================================================================
  # Section 2.8 -- Fully Qualified SDSI Names
  # ===================================================================

  - id: SPKI-28-01
    locator: "RFC 2693 Section 2.8"
    kind: sdsi-fully-qualified-name
    notation: sexp
    fidelity: verbatim
    input: '(name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) jim therese)'
    expected: 'is a fully qualified SDSI name, using the SHA-1 hash of a public key as the global identifier defining the name space and anchoring this name string.'
    expected_basis: stated
    source_text:
      - 'That name is a public key followed by one or more names relative to that key. If there are two or more names, then the string of names is a SDSI name chain.'
    related:
      - SPKI-73-01
      - SPKI-75-01
      - SPKI-75-02
    notes: 'The document uses ONE key hash throughout: the same base-64 value recurs in Sections 7.3, 7.5 and 7.6. The public key it hashes is never printed, so the digest cannot be recomputed -- only its shape can be checked.'
    derived:
      in_source: false
      hash_octets: 20
      hash_hex: '4cb0a03cb165193ce051b71a60b5bc9064c49d49'
      hash_check: 'The base-64 decodes to 20 octets, the length of a SHA-1 digest. One "=" pad, as 20 mod 3 = 2 requires. The unused low bits of the last character (k) are zero and re-encoding gives the same text, so this is the canonical base-64 spelling.'
      name_count: 2
      name_chain: 'two names follow the key (jim, therese), so by the source''s own definition this is a SDSI name chain'

  # ===================================================================
  # Section 2.9 -- Fully Qualified X.509 Names
  # ===================================================================

  - id: SPKI-29-01
    locator: "RFC 2693 Section 2.9"
    kind: x509-fully-qualified-name
    notation: sexp-template
    fidelity: verbatim
    input: '(name <root key> <leaf name>)'
    expected: 'Therefore, every X.509 name should be expressed as the pair (name <root key> <leaf name>) if all leaf names descending from that root are unique.'
    expected_basis: stated
    related:
      - SPKI-651-01
    notes: '<root key> and <leaf name> are placeholders. Section 6.5.1 gives the matching name 4-tuple (SPKI-651-01), with the root key moved to the issuer slot and the placeholder spelled <leaf-name>.'

  - id: SPKI-29-02
    locator: "RFC 2693 Section 2.9"
    kind: x509-fully-qualified-name
    notation: sexp-template
    fidelity: split
    input: '(name <root key> <CA(1)> <CA(2)> ... <CA(k)> <leaf name>)'
    expected: 'If uniqueness is enforced only within each individual CA, then one would build a Fully Qualified Name chain from an X.509 certificate chain, yielding the form (name <root key> <CA(1)> <CA(2)> ... <CA(k)> <leaf name>).'
    expected_basis: stated
    related:
      - SPKI-651-02
    notes: 'Printed with a trailing full stop, which is sentence punctuation and is left out (fidelity: split). The placeholders CA(1), CA(2) and CA(k) contain parentheses inside the angle brackets: a bare parenthesis counter still balances, but a template reader must treat <...> as opaque. Section 6.5.1 spells the same chain CA1 CA2 ... CAk.'

  # ===================================================================
  # Section 2.10 -- Group Names
  # ===================================================================

  - id: SPKI-210-01
    locator: "RFC 2693 Section 2.10"
    kind: group-name
    notation: tuple-notation
    fidelity: constructed
    input_lines:
      - '[(name K0 N) -> Ka]'
      - '[(name K0 N) -> Kb]'
      - '<Self,(name K0 N),FALSE,A,V0>'
    bindings:
      Ka: 'the first group member'
      Kb: 'the second group member'
      A: 'any authorization'
      V0: 'any validity interval that intersects both 4-tuples'
    expected: 'SPKI/SDSI does not claim to enforce one key per name. Therefore, a named group can be defined by issuing multiple (name,key) certificates with the same name -- one for each group member.'
    expected_basis: stated
    source_text:
      - 'Each local name maps to one or more public keys and therefore to the corresponding keyholder(s).'
    notes: 'A reducer must treat the second definition of (name K0 N) as a second member, not as a conflict and not as an overwrite. The 4-tuples are written in the Section 6.4 notation, validity elided.'
    derived:
      in_source: false
      rule: 'Section 6.4 name reduction, applied once with each 4-tuple'
      result_tuples:
        - '<Self,Ka,FALSE,A,VIntersect(V0,Va)>'
        - '<Self,Kb,FALSE,A,VIntersect(V0,Vb)>'
      outcome: succeeds
      note: 'Va and Vb are the validity intervals of the two 4-tuples. Both members hold A.'

  # ===================================================================
  # Section 3 -- Authorization: mapping chains
  # ===================================================================
  #
  # Displays in arrow notation. Not S-expressions. Each carries what the
  # source says about how many issuers must be trusted, which is the one
  # testable claim attached to them.

  - id: SPKI-31-01
    locator: "RFC 2693 Section 3.1"
    kind: mapping-chain
    notation: mapping-notation
    fidelity: verbatim
    input: 'authorization -> name -> key'
    expected: 'However, if either of these issuers were subverted, then an attacker could obtain an authorization improperly. Therefore, both the issuers need to be trusted with the authorization decision.'
    expected_basis: stated
    issuers_trusted: 2
    source_text:
      - 'For an application to use this information, it must combine an attribute certificate with an ID certificate, in order to get the full mapping:'
    related:
      - SPKI-8-02

  - id: SPKI-32-01
    locator: "RFC 2693 Section 3.2"
    kind: mapping-chain
    notation: mapping-notation
    fidelity: verbatim
    input: 'authorization -> key'
    expected: 'In this case, there is only one issuer, who must be an authority on both the authorization and the name.'
    expected_basis: stated
    issuers_trusted: 1
    source_text:
      - 'This makes the certificate an instrument mapping both:'
    same_as:
      - SPKI-33-01
      - SPKI-33-03
    related:
      - SPKI-32-02
    notes: 'One X.509v3 certificate mapping both authorization -> key and name -> key (SPKI-32-02).'

  - id: SPKI-32-02
    locator: "RFC 2693 Section 3.2"
    kind: mapping-chain
    notation: mapping-notation
    fidelity: verbatim
    input: 'name -> key'
    expected: 'In this case, there is only one issuer, who must be an authority on both the authorization and the name.'
    expected_basis: stated
    issuers_trusted: 1
    related:
      - SPKI-32-01

  - id: SPKI-33-01
    locator: "RFC 2693 Section 3.3"
    kind: mapping-chain
    notation: mapping-notation
    fidelity: verbatim
    input: 'authorization -> key'
    expected: 'A basic SPKI certificate defines a straight authorization mapping:'
    expected_basis: stated
    same_as:
      - SPKI-32-01
      - SPKI-33-03
    related:
      - SPKI-8-01

  - id: SPKI-33-02
    locator: "RFC 2693 Section 3.3"
    kind: mapping-chain
    notation: mapping-notation
    fidelity: verbatim
    input: 'authorization -> key -> name'
    expected: 'This mapping has an apparent security advantage over the attribute certificate mapping.'
    expected_basis: stated
    source_text:
      - "If someone wants access to a keyholder's name, for logging purposes or even for punishment after wrong-doing, then one can map from key to location information (name, address, phone, ...) to get:"
    related:
      - SPKI-31-01
      - SPKI-33-03
      - SPKI-33-04
    notes: 'The reverse of SPKI-31-01 in the second link: key -> name instead of name -> key, so the name is no longer on the authorization path.'

  - id: SPKI-33-03
    locator: "RFC 2693 Section 3.3"
    kind: mapping-chain
    notation: mapping-notation
    fidelity: verbatim
    input: 'authorization -> key'
    expected: 'In the mapping above, only the authorization -> key mapping needs to be secure at the level required for the access control mechanism.'
    expected_basis: stated
    same_as:
      - SPKI-32-01
      - SPKI-33-01
    notes: 'A display set inside a sentence; it names the first link of SPKI-33-02.'

  - id: SPKI-33-04
    locator: "RFC 2693 Section 3.3"
    kind: mapping-chain
    notation: mapping-notation
    fidelity: verbatim
    input: 'key -> name'
    expected: 'The key -> name mapping (and the issuer of any certificates involved) needs to be secure enough to satisfy lawyers or private investigators, but a subversion of this mapping does not permit the attacker to defeat the access control.'
    expected_basis: stated
    notes: 'The second link of SPKI-33-02. Its issuer is off the access-control path entirely.'

  # ===================================================================
  # Section 4 -- Delegation scenarios (constructed)
  # ===================================================================
  #
  # The source argues these cases in prose and prints no tuple. Each vector
  # restates the scenario in the Section 6.3 tuple notation and reduces it.

  - id: SPKI-412-01
    locator: "RFC 2693 Section 4.1.2"
    kind: delegation-scenario
    notation: tuple-notation
    fidelity: constructed
    input_lines:
      - '<Self,Kcommerce,TRUE,Aexport,V0>'
      - '<Kcommerce,Kmfr,FALSE,Aexport,V1>'
      - '<Kmfr,Kother,FALSE,Aexport,V2>'
    bindings:
      Kcommerce: 'the US Commerce Department key'
      Kmfr: 'a manufacturer key'
      Kother: 'a party the manufacturer tries to empower'
      Aexport: 'the authority "to declare a cryptographic software module exportable"; the source prints no tag for it'
      validity: 'V0, V1 and V2 mutually intersect'
    expected: 'It is reasonable to assume the Commerce Department would not issue permission to delegate this further.'
    expected_basis: stated
    source_text:
      - 'For example, one could imagine the US Commerce Department having a key that is authorized to declare a cryptographic software module exportable and also to delegate that authorization to others (e.g., manufacturers).'
    notes: 'Boolean control: the manufacturer certificate carries delegation FALSE, so the chain ends at the manufacturer. The first tuple stands for the grant the source describes as the key being "authorized"; the third is the attempt Commerce wants ruled out. Both are constructed.'
    derived:
      in_source: false
      rule: 'Section 6.3: two 5-tuples reduce only "provided ... D1 = TRUE"'
      steps:
        - '<Self,Kcommerce,TRUE,Aexport,V0> + <Kcommerce,Kmfr,FALSE,Aexport,V1> -> <Self,Kmfr,FALSE,Aexport,VIntersect(V0,V1)>'
        - '<Self,Kmfr,FALSE,Aexport,VIntersect(V0,V1)> + <Kmfr,Kother,FALSE,Aexport,V2> -> fails: D1 = FALSE'
      outcome: 'Kmfr holds Aexport and may exercise it; no certificate Kmfr issues reduces'

  - id: SPKI-42-01
    locator: "RFC 2693 Section 4.2"
    kind: delegation-scenario
    notation: tuple-notation
    fidelity: constructed
    input_lines:
      - '<Self,Ka,TRUE,A,V0>'
      - '<Ka,Ka2,FALSE,A,V1>'
    bindings:
      Ka: 'a key permitted to delegate A'
      Ka2: '"a new key pair, also controlled by it"'
      A: 'any authorization'
      validity: 'V0 and V1 intersect'
    expected: 'Therefore, there was no benefit from attempting to restrict the exercise of a permission by someone permitted to delegate it.'
    expected_basis: stated
    source_text:
      - 'We decided that a delegator is free to create a new key pair, also controlled by it, and delegate the rights to that key to exercise the delegated permission.'
      - 'One can always need to go one more level down, by creating a temporary signing key (e.g., for use in a laptop).'
    notes: 'The second quote is Section 4.1.4''s argument against integer depth control, which rests on the same move: a keyholder can always add a key of its own to the chain.'
    derived:
      in_source: false
      rule: 'Section 6.3 reduction'
      steps:
        - '<Self,Ka,TRUE,A,V0> + <Ka,Ka2,FALSE,A,V1> -> <Self,Ka2,FALSE,A,VIntersect(V0,V1)>'
      outcome: 'succeeds; the keyholder of Ka exercises A through Ka2. Reduction sees keys, not keyholders, so it cannot tell that Ka and Ka2 share one, and a delegate-only restriction would be unenforceable.'

  - id: SPKI-43-01
    locator: "RFC 2693 Section 4.3"
    kind: delegation-scenario
    notation: tuple-notation
    fidelity: constructed
    input_lines:
      - '<Self,Ksecdef,TRUE,(tag (*)),V0>'
      - '<Ksecdef,Ksub,TRUE,(tag (*)),V1>'
      - '<Ksub,Kenlisted,FALSE,(tag (telnet)),V2>'
    bindings:
      Ksecdef: 'a key belonging to the Secretary of Defense'
      Ksub: 'a subordinate; the source says the process "would iterate", and one intermediate level stands for all of them'
      Kenlisted: 'the enlisted man'
      tags: '(tag (*)) stands for all access through the firewall and (tag (telnet)) for "some specific one protocol". The source prints neither tag; telnet is one of the two protocols the scenario names.'
      validity: 'V0, V1 and V2 mutually intersect'
    expected: 'This process would iterate, until some enlisted man would receive permission to penetrate that firewall for some specific one protocol, but not have permission to delegate that permission.'
    expected_basis: stated
    source_text:
      - 'The firewall would have an ACL with one entry, granting a key belonging to the Secretary of Defense the right to delegate all access through the firewall.'
      - 'The Secretary would, in turn, issue certificates delegating this permission to delegate to each of his or her subordinates.'
    notes: 'The source''s case for delegation over ACLs: the firewall stores one ACL entry, and the organisation structure lives in the certificates. No depth limit exists to reach; the chain may be any length while every intermediate D is TRUE.'
    derived:
      in_source: false
      rule: 'Section 6.3 reduction; AIntersect((tag (*)), (tag (telnet))) = (tag (telnet)) by the (*) rule of Section 6.3.1'
      steps:
        - '<Self,Ksecdef,TRUE,(tag (*)),V0> + <Ksecdef,Ksub,TRUE,(tag (*)),V1> -> <Self,Ksub,TRUE,(tag (*)),VIntersect(V0,V1)>'
        - '<Self,Ksub,TRUE,(tag (*)),VIntersect(V0,V1)> + <Ksub,Kenlisted,FALSE,(tag (telnet)),V2> -> <Self,Kenlisted,FALSE,(tag (telnet)),VIntersect(V0,V1,V2)>'
