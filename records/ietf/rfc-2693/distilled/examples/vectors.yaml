  - id: SPKI-633-01
    locator: "RFC 2693 Section 6.3.3"
    kind: threshold-null-marker
    notation: sexp
    fidelity: split
    input: '(null)'
    expected: 'The (N-K) unselected subordinate subjects are set to (null).'
    expected_basis: stated
