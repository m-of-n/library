    expected: 'Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier.'
    expected_basis: stated
    outcome: fails
    notes: 'FAIL CLOSED. CRL1 has expired and nothing has replaced it, so C cannot be processed -- even though C itself is in date and was never listed. The opposite of the anti-matter model (SPKI-51-01), where absence of news is good news.'
    related:
