  # ===================================================================
  # Section 7.5 -- One Root Per Individual
  # ===================================================================

  - id: SPKI-75-01
    locator: "RFC 2693 Section 7.5"
    kind: delegation-via-name
    notation: sexp
    fidelity: verbatim
    input: '(name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) carl)'
    expected: 'If one delegates some authorization to (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) carl) and a different authorization to (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) directly, both without granting the permission to delegate, that key can delegate at will through <name,key> certificates in the former case and not delegate at all in the latter case.'
    expected_basis: stated
    related:
      - SPKI-75-02
      - SPKI-642-01
    notes: 'SECURITY-RELEVANT. A name subject gives the name''s definer a power to re-bind that the delegation bit does not control. The source presents this as the key-management feature: "the former mechanism (through a SDSI name) gives more freedom". A harness should pin it as expected behaviour, so no implementation removes it by accident; a design that needs the delegation bit to bind must not grant to name subjects.'
    source_text:
      - 'In the case of key management, we desire the ability to delegate from a long lived, rarely used key to a shorter lived, often used key -- so in this case, the former mechanism (through a SDSI name) gives more freedom.'
    derived:
      in_source: false
      rule: 'Section 6.4.2: a 4-tuple has no delegation field, so name reduction never consults D'
      bindings:
        H: 'the key whose SHA-1 hash is the base-64 value printed'
        Kgrantor: 'whoever delegates the authorization'
        Klaptop: 'a shorter-lived key of the same keyholder'
      tuples:
        - '<Kgrantor,(name H carl),FALSE,A1,V1>'
        - '[(name H carl) -> Klaptop], issued by H'
      steps:
        - 'name reduction: <Kgrantor,Klaptop,FALSE,A1,VIntersect(V1,Vn)>'
      outcome: 'succeeds; Klaptop holds A1 though no tuple in the chain has delegation TRUE'

  - id: SPKI-75-02
    locator: "RFC 2693 Section 7.5"
    kind: key-hash-subject
    notation: sexp
    fidelity: verbatim
    input: '(hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|)'
    expected: 'If one delegates some authorization to (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) carl) and a different authorization to (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) directly, both without granting the permission to delegate, that key can delegate at will through <name,key> certificates in the former case and not delegate at all in the latter case.'
    expected_basis: stated
    related:
      - SPKI-75-01
      - SPKI-28-01
    notes: 'Section 7.6 then refers to this key as "key |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|", by the base-64 of its hash alone. Its "second model", an authorization certificate "delegating all rights through to the more temporary key", presupposes that this grant carried delegation TRUE -- the permission this vector withholds.'
    derived:
      in_source: false
      rule: 'Section 6.3: reduction requires D1 = TRUE'
      tuples:
        - '<Kgrantor,H,FALSE,A2,V1>'
        - '<H,Klaptop,FALSE,A2,V2>'
      steps:
        - '<Kgrantor,H,FALSE,A2,V1> + <H,Klaptop,FALSE,A2,V2> -> fails: D1 = FALSE'
      outcome: fails

