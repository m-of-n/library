  - id: SPKI-77-02
    locator: "RFC 2693 Section 7.7"
    kind: threshold-subject
    notation: sexp-schematic
    fidelity: verbatim
    input: '(k-of-n #03# #07# K1 K2 K3 K4 K5 K6 K7)'
    expected: 'Assume also that what might have been a single root authorization key, K1, is actually a threshold subject (k-of-n #03# #07# K1 K2 K3 K4 K5 K6 K7) used in any ACL entry granting a normal authorization.'
    expected_basis: stated
    related:
      - SPKI-633-02
      - SPKI-77-03
    notes: 'K and N are one-octet hex byte strings: #03# is the octet 0x03, binary 3, not the ASCII digit 3 (that would be #33#). The source never defines how K and N are encoded; Section 6.3.3 says only "two numbers". K1 to K7 are metavariables for keys.'
    derived:
      in_source: false
      K: 3
      N: 7
      subordinate_count: 7
      checks: 'subordinate count equals N, and 0 < K <= N as Section 6.3.3 requires'

  - id: SPKI-77-03
    locator: "RFC 2693 Section 7.7"
    kind: threshold-subject
    notation: sexp-schematic
    fidelity: verbatim
    input: '(k-of-n #05# #07# K1 K2 K3 K4 K5 K6 K7)'
    expected: 'That same ACL could have the subject of an (acl-edit) entry be (k-of-n #05# #07# K1 K2 K3 K4 K5 K6 K7)'
    expected_basis: stated
    source_text:
      - 'This use of threshold subject would allow the set of root keys to elect new members to that set and retire old members.'
    related:
