reconciliation: "Counts agree at 0, and the zero is measured: bin/bcp14-count finds no capitalised BCP 14 keyword anywhere in the 2411-line source, and no entry text carries one. RFC 2693 is an Experimental RFC of September 1999. It never cites RFC 2119 and never uses its capitalised keywords, and the RFC 8174 rule that only capitalised keywords are normative came nearly eighteen years later, so the source was never written to that convention and its silence on BCP 14 says nothing about how much of it binds. The document's own normative baseline is lowercase: glossary definitions, the 5-tuple and 4-tuple definitions, the displayed reduction rules, the AIntersect and VIntersect rules, the timed-CRL conditions (must list, must carry, must not intersect), decisions announced by the working group (boolean delegation, no wandering anti-matter CRLs, every computation deterministic), and lowercase must, need and should addressed to issuers, keyholders, provers and verifiers. Extracting only keyword-bearing sentences would have extracted nothing, so all 251 entries carry verb none, and the inclusion rule is this. An entry is made for (a) every definition of a construct an implementation must represent; (b) every computation rule: tuple reduction, AIntersect and the *-forms, VIntersect, threshold and name reduction, validity intersection, certificate translation; (c) every SPKI decision binding an issuer, verifier, prover, ACL owner or keyholder; (d) every lowercase must, need, should, is not allowed or may not that the authors address to such a role in their own voice; (e) the security observations of section 8 and the security and privacy caveats stated elsewhere (3.1, 3.2, 3.3, 4.1.4, 5.1, 5.2, 7). Excluded: the Abstract and the section 1 overview, which summarise and navigate; the history and the argument about human naming in 2.1 to 2.5 and the opening of 2.6 (only the identifier recommendation of 2.4 and the decision of 2.6 to adopt SDSI names are extracted); quotations (Diffie and Hellman, Kohnfelder); background the document describes but does not carry forward, namely the SDSI 1.0 ACL of 3.4, the anti-matter CRL that 5.1 rules out (only its flaws and the ruling are extracted), Micali's mechanism of 5.7.1, the [R98] critique of 5.7.2 (only the statement that SPKI does not reflect it is extracted, R-0104) and the path-discovery result of 6.3.4; the camp arguments of 4.1.1 to 4.1.3 and the paragraph of 4.1.4 on why integer control was defeated (the closing paragraph of 4.1.4, which answers the proliferation argument of 4.1.3, is kept as R-0064 because it states a property of the adopted design: nothing bounds the width of the delegation tree); the firewall example of 4.3; the counterfactual authorities of 7.1 and 7.2; hedged asides and restated consequences (the most likely one ACL per resource owner of 1.1, the opening paragraph of 3, which restates that fully qualified SDSI names are globally unique and hedges that each local name in them is presumably meaningful to its issuer, the presumably sentences of 3.1 and 3.3, the it is also possible sentence of 3.3, the no loss of lifetime of 7.5); rationale and commentary that add no rule, among them why a fully qualified X.509 name is needed (2.9), risk management as the source of the validity interval (5.4), why that interval cannot be zero (5.5), the performance comparison of 5.6, the remark closing 7.4 that a private individual's naming root key is too small to invite a well funded attack, and the account in 7.6 of which certificate the long-lived key issues and how a revocation service might be run (only the limit on that service's power is extracted, R-0236); lead-ins, pointers, references, acknowledgements and boilerplate; and worked examples (the george name of 2.6.1, the SSL and .ssh ACLs of 3.4, the ftp example and the AIntersect evaluations of 6.3.1, the Datafellows tags and the future-enhancement discussion of 6.5.7, the (acl-edit) entry and k-of-n instances of 7.7), except where the example is the only statement of a rule: the compound name of 2.6.2, the hashed fully qualified name of 2.8, the positional ftp form of 6.3.1 (the only statement that AIntersect is position dependent), the schematic name reductions of 6.4, the SSL tags of 6.5.7 (the implicit (ssl), the dns and us-crypto encodings, the root-key ACL tags with their equivalence by intersection, and the CA tag), the whole-construct name of 7.3 and the name-versus-key delegation of 7.5. Where one point is made twice, only the operative statement is extracted: the authorization computation that accepts certificates in any format is announced in 3 and stated in 6.5 (R-0192); the delegation power introduced in 4 is stated operationally in 4.1.4 and 6.1 (R-0061, R-0062, R-0124); the boolean-delegation decision is announced in 4.1 and stated in 4.1.4; the three uses of X.509 listed in stage 1 of 6 are stated as translation rules in 6.5.1, 6.5.3 and 6.5.7; and the fault-tolerance purpose of threshold subjects is noted in the 1.1 glossary and given as guidance in 7.7. Four further things a reader of this file alone cannot see. (1) The validity-dates item and its two default rules are word for word the same in 6.1 (5-tuple) and 6.2 (name 4-tuple) and are extracted in both places, R-0126 to R-0128 and R-0133 to R-0135, because they bind different intermediate forms. (2) Five sentences are split so that each part is separately testable, R-0015/R-0016, R-0061/R-0062, R-0077/R-0078, R-0082/R-0083 and R-0237/R-0238, and two displayed rules are split the same way: the 6.3 rule into its result R-0136 and its three provisos R-0137 to R-0139, and the 6.3.2 definition of VIntersect into the definition R-0157 and its failure condition R-0158. In all seven the connecting and at the split, with its comma where it has one, belongs to neither part. One displayed example is split as well: the 6.4 sentence that gives the two schematic name reductions becomes R-0178 (case 1) and R-0179 (case 2), and its lead-in (For example) and its connector (or, in case 2 above) belong to neither part. (3) One entry, R-0122, is kind inferred: the source makes Self a reserved Issuer value and lets tuples derive from ACL entries, but never joins the two. (4) R-0251 was added by the verify pass. The 6.5.7 statement that the other key usage attributes of an SSL certificate would also be encoded as tag fields had been dropped, although it carries a translation rule as the extracted pointer R-0140 carries one. It is appended rather than numbered into place, so it is the one entry out of source order; it belongs between R-0210 and R-0211."
reviewed_by: ""
note: >
  Ids are stable and never reused. Cite as rfc-2693#R-NNNN.
  Entries are in source order, with one exception: R-0251, added by the
  verify pass, belongs between R-0210 and R-0211 and is appended at the
  end so that no id is renumbered. Every text is a verbatim run of the source
  with the RFC line wrapping undone: a source line break and the indent
  that follows it become a single space, and nothing else is altered. So
  the two spaces the RFC sets after a full stop inside a line are kept,
  while a full stop at a line end is followed by one space. Where a text
  crosses a page break (R-0113, R-0151, R-0195, R-0248) the page footer
  and header lines, and the blank lines around them, are removed first,
  and the break is then undone like any other line break.
  TWO EXCEPTIONS, and neither is cosmetic. (1) The RFC breaks
  already-hyphenated words across lines, printing "LISP-" at the end of
  one line and "like" at the start of the next. Those are rejoined with NO
  space, because inserting one would yield "LISP- like", which is not a
  word the source contains. The one arrow the RFC breaks the same way,
  "authorization-" then ">key" in section 8, is rejoined likewise, as the
  five other arrows of that sentence are printed. Six entries, R-0015,
  R-0111, R-0148, R-0188, R-0239 and R-0244, are verbatim only under that
  rule, and all six were confirmed against the source by rejoining rather
  than by eye. A dash of punctuation at a line end ("key --" in 7.5,
  R-0235) is not a hyphenated word and is joined with a space. (2) The RFC
  sets its rules as displays: one sentence whose formulas, forms or
  numbered items stand on their own indented lines with blank lines
  between them, as in the 6.3 reduction rule and the 6.3.2 definition of
  VIntersect. Inside a display a blank line is part of the line break, so
  the whole run of whitespace becomes one space. 30 entries are verbatim
  only under that rule: R-0024, R-0037, R-0039, R-0040, R-0046, R-0048,
  R-0052, R-0053, R-0054, R-0055, R-0107, R-0136, R-0137, R-0147, R-0157,
  R-0175, R-0178, R-0179, R-0194, R-0195, R-0197, R-0208, R-0209, R-0210,
  R-0211, R-0212, R-0214, R-0224, R-0234 and R-0245. No text crosses a
  blank line outside a display.
  Each text is one contiguous run of source characters; no two
  non-adjacent passages are ever spliced into one entry, and no two
  entries share a source character.
  Every entry carries verb none: the source has no BCP 14 keyword.
  Exactly one entry is kind inferred (R-0122); its text is not verbatim
  source text and it carries no keyword.

requirements:
  - id: "rfc-2693#R-0001"
    object: 'ACL (Access Control List)'
    field: 'what an ACL is: the list of entries that anchors a certificate chain'
    verb: none
    actor: 'verifier (authorization computation)'
    locator: "§1.1"
    text: 'ACL: an Access Control List: a list of entries that anchors a certificate chain.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0002"
    object: 'ACL (Access Control List)'
    field: 'the ACL, not the certificate, as the source of the power a chain conveys'
    verb: none
    actor: 'verifier (authorization computation)'
    locator: "§1.1"
    text: 'Sometimes called a "list of root keys", the ACL is the source of empowerment for certificates.  That is, a certificate communicates power from its issuer to its subject, but the ACL is the source of that power (since it theoretically has the owner of the resource it controls as its implicit issuer).'
    kind: stated
    testable: partial
    testable_reason: 'what a test can check is the consequence, that no certificate chain yields an authorization the ACL entry at its head did not grant; the implicit issuer is stated as theory and has no representation of its own in a certificate (the inferred R-0122 records how it surfaces as Self).'
    status: active
  - id: "rfc-2693#R-0003"
    object: 'ACL entry'
    field: 'absence of an Issuer field and of a signature'
    verb: none
    actor: 'ACL owner'
    locator: "§1.1"
    text: 'An ACL entry has potentially the same content as a certificate body, but has no Issuer (and is not signed).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0004"
    object: 'certificate'
    field: 'what a certificate is: a signed instrument that empowers its Subject'
    verb: none
    actor: 'issuer'
    locator: "§1.1"
    text: 'CERTIFICATE: a signed instrument that empowers the Subject.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0005"
    object: 'certificate'
    field: 'the two fields every certificate carries'
    verb: none
    actor: 'issuer'
    locator: "§1.1"
    text: 'It contains at least an Issuer and a Subject.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0006"
    object: 'certificate'
    field: 'the optional validity, authorization and delegation fields'
    verb: none
    actor: 'issuer and verifier'
    locator: "§1.1"
    text: 'It can contain validity conditions, authorization and delegation information.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0007"
    object: 'certificate'
    field: 'the three categories and the binding each one maps'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§1.1"
    text: 'Certificates come in three categories: ID (mapping <name,key>), Attribute (mapping <authorization,name>), and Authorization (mapping <authorization,key>).'
    kind: stated
    testable: partial
    testable_reason: 'a taxonomy; it is checked through the 6.2 and 6.5 translation rules, which send an ID certificate to a name 4-tuple and the other two categories to 5-tuples, not as a property of any one certificate.'
    status: active
  - id: "rfc-2693#R-0008"
    object: 'SPKI authorization or attribute certificate'
    field: 'passing on all, or only part, of the empowerment received'
    verb: none
    actor: 'issuer'
    locator: "§1.1"
    text: 'An SPKI authorization or attribute certificate can pass along all the empowerment it has received from the Issuer or it can pass along only a portion of that empowerment.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0009"
    object: 'Issuer'
    field: 'the Issuer is the signer of the certificate'
    verb: none
    actor: 'verifier'
    locator: "§1.1"
    text: 'ISSUER: the signer of a certificate and the source of empowerment that the certificate is communicating to the Subject.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0010"
    object: 'keyholder'
    field: 'what a keyholder is: the entity that controls the private key, control being assumed in all cases'
    verb: none
    actor: 'verifier'
    locator: "§1.1"
    text: 'KEYHOLDER: the person or other entity that owns and controls a given private key.  This entity is said to be the keyholder of the keypair or just the public key, but control of the private key is assumed in all cases.'
    kind: stated
    testable: no
    testable_reason: 'control of a private key is assumed, never shown: the only evidence a verifier has is a signature made with the key (R-0009), and the assumption is what lets that signature stand for the keyholder. R-0063 records the case in which it fails, a key lent out or used as a signing oracle.'
    status: active
  - id: "rfc-2693#R-0011"
    object: 'principal'
    field: 'a principal is a key, not a person'
    verb: none
    actor: 'implementation'
    locator: "§1.1"
    text: 'PRINCIPAL: a cryptographic key, capable of generating a digital signature.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0012"
    object: 'digital signature method'
    field: 'independence of the theory from the public-key signature method'
    verb: none
    actor: 'implementation'
    locator: "§1.1"
    text: 'We deal with public-key signatures in this document but any digital signature method should apply.'
    kind: stated
    testable: no
    testable_reason: 'a statement of scope: the theory names no algorithm and claims to hold for any signature method, so there is no behaviour to check; it is consistent with 7.7, which lets the keys of one threshold subject use different algorithms (R-0240).'
    status: active
  - id: "rfc-2693#R-0013"
    object: 'speaking (signed statement)'
    field: 'a principal speaks by signing; the statement is the signed object; the principal speaks for its keyholder'
    verb: none
    actor: 'verifier'
    locator: "§1.1"
    text: 'SPEAKING: A Principal is said to "speak" by means of a digital signature.  The statement made is the signed object (often a certificate).  The Principal is said to "speak for" the Keyholder.'
    kind: stated
    testable: partial
    testable_reason: 'that a statement is attributed to a principal only through a signature that verifies under its key is testable (R-0109); speaks for is the conceptual relation the theory builds on and has no test of its own.'
    status: active
  - id: "rfc-2693#R-0014"
    object: 'Subject'
    field: 'the four forms a Subject may take'
    verb: none
    actor: 'issuer and verifier'
    locator: "§1.1"
    text: 'SUBJECT: the thing empowered by a certificate or ACL entry.  This can be in the form of a key, a name (with the understanding that the name is mapped by certificate to some key or other object), a hash of some object, or a set of keys arranged in a threshold function.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0015"
    object: 'S-expression'
    field: 'the data format of SPKI/SDSI, and the prohibition of empty lists'
    verb: none
    actor: 'implementation (parser and generator)'
    locator: "§1.1"
    text: 'S-EXPRESSION: the data format chosen for SPKI/SDSI.  This is a LISP-like parenthesized expression with the limitations that empty lists are not allowed'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0016"
    object: 'S-expression'
    field: 'the first element: a string, called the type of the expression'
    verb: none
    actor: 'implementation (parser and generator)'
    locator: "§1.1"
    text: 'the first element in any S-expression must be a string, called the "type" of the expression.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0017"
    object: 'threshold subject'
    field: 'what a threshold subject is: K of N subordinate Subjects'
    verb: none
    actor: 'issuer and verifier'
    locator: "§1.1"
    text: 'THRESHOLD SUBJECT: a Subject for an ACL entry or certificate that specifies K of N other Subjects.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0018"
    object: 'threshold subject'
    field: 'the share of the power each subordinate Subject receives'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§1.1"
    text: 'Conceptually, the power being transmitted to the Subject by the ACL entry or certificate is transmitted in (1/K) amount to each listed subordinate Subject.'
    kind: stated
    testable: partial
    testable_reason: 'stated as a conceptual model; no fractional share is ever represented, and the operational rule a test can check is R-0019 with the 6.3.3 reduction (R-0165 to R-0170): fewer than K subordinates agreeing conveys nothing.'
    status: active
  - id: "rfc-2693#R-0019"
    object: 'threshold subject'
    field: 'the K subordinate Subjects that must agree before the power passes on'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§1.1"
    text: 'K of those subordinate Subjects must agree (by delegating their shares along to the same object or key) for that power to be passed along.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0020"
    object: 'globally unique identifier'
    field: 'uniform appearance with no recognizable sub-field'
    verb: none
    actor: 'identifier designer'
    locator: "§2.4"
    text: 'Where globally unique identifiers need to be used, perhaps the best ID is one that is uniform in appearance (such as a long number or random looking text string) so that it has no recognizable sub-field.'
    kind: stated
    testable: partial
    testable_reason: 'hedged advice ("perhaps the best ID"); whether an identifier format has a recognizable sub-field can be judged for a given format, but the source makes it a recommendation, not a condition. A public key or its hash (R-0028, R-0029) meets it.'
    status: active
  - id: "rfc-2693#R-0021"
    object: 'globally unique identifier'
    field: 'size of the identifier space, so that a typing error yields no other valid identifier'
    verb: none
    actor: 'identifier designer'
    locator: "§2.4"
    text: 'It should also be large enough (from a sparse enough name space) that typographical errors would not yield another valid identifier.'
    kind: stated
    testable: partial
    testable_reason: 'checkable for a given identifier format by estimating the density of valid identifiers, but the source sets no threshold for large enough or sparse enough.'
    status: active
  - id: "rfc-2693#R-0022"
    object: 'SDSI names'
    field: 'adoption of SDSI names into SPKI'
    verb: none
    actor: 'implementation'
    locator: "§2.6"
    text: 'The clear security advantage and operational simplicity of SDSI names caused us in the SPKI group to adopt SDSI names as part of the SPKI standard.'
    kind: stated
    testable: partial
    testable_reason: 'a decision, not a behaviour; it is honoured by implementing the name rules that follow (R-0023, R-0024, R-0030 to R-0037) and the name 4-tuple and its reduction (6.2, 6.4).'
    status: active
  - id: "rfc-2693#R-0023"
    object: 'basic SDSI name'
    field: 'its form: the word name followed by the chosen name'
    verb: none
    actor: 'implementation (parser and generator)'
    locator: "§2.6.1"
    text: 'A basic SDSI 2.0 name is an S-expression with two elements: the word "name" and the chosen name.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0024"
    object: 'compound SDSI name'
    field: 'chaining a name through the name space of the entity it names (stated only by this example)'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§2.6.2"
    text: 'If fred in turn defines a name, for example, fred:  (name sam) then george can refer to this same entity as george:  (name fred sam)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0025"
    object: 'compromised private key'
    field: 'safeguarding of the private key, and a key whose private half has escaped its owner'
    verb: none
    actor: 'keyholder, issuer and verifier'
    locator: "§2.7"
    text: 'When one creates a key pair, for use in public key cryptography, the private key is bound to its owner by good key safeguarding practice. If that private key gets loose from its owner, then a basic premise of public key cryptography has been violated and that key is no longer of interest.'
    kind: stated
    testable: no
    testable_reason: 'safeguarding is the keyholder''s practice, and escape of a private key is not observable from the key or its certificates; SPKI acts on it only through certificate lifetimes and online tests (R-0219 to R-0222), never by marking the key itself.'
    status: active
  - id: "rfc-2693#R-0026"
    object: 'key generation'
    field: 'global uniqueness of generated private keys'
    verb: none
    actor: 'implementation (key generator)'
    locator: "§2.7"
    text: 'The private key is also globally unique.  If it were not, then the key generation process would be seriously flawed and we would have to abandon this public key system implementation.'
    kind: stated
    testable: partial
    testable_reason: 'uniqueness across all keys ever generated cannot be shown; a test can only detect duplicates within a sample, which is evidence of a flawed generator, never proof of a sound one.'
    status: active
  - id: "rfc-2693#R-0027"
    object: 'private key'
    field: 'secrecy of the private key, and why it cannot serve as an identifier'
    verb: none
    actor: 'keyholder'
    locator: "§2.7"
    text: 'The private key must be kept secret, so it is not a possible identifier, but each public key corresponds to one private key and therefore to one keyholder.'
    kind: stated
    testable: no
    testable_reason: 'secrecy is a property of the keyholder''s practice, invisible to any verifier; the testable consequence, that identifiers are public keys or their hashes, is R-0028 and R-0029.'
    status: active
  - id: "rfc-2693#R-0028"
    object: 'public key'
    field: 'the public key, as a byte string, is the identifier of its keyholder'
    verb: none
    actor: 'verifier'
    locator: "§2.7"
    text: 'The public key, viewed as a byte string, is therefore an identifier for the keyholder.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0029"
    object: 'hash of a public key'
    field: 'a collision-free hash of the public key as an equivalent identifier'
    verb: none
    actor: 'verifier'
    locator: "§2.7"
    text: 'If there exists a collision-free hash function, then a collision-free hash of the public key is also a globally unique identifier for the keyholder, and probably a shorter one than the public key.'
    kind: stated
    testable: partial
    testable_reason: 'conditional on a collision-free hash, which can be assumed but not tested. The source allows a public key (or its hash) in 6.1 and 6.2 but never says whether a key and its hash compare equal in the S1 = I2 proviso (R-0138), so a test that a verifier treats the two as one principal rests on that reading.'
    status: active
  - id: "rfc-2693#R-0030"
    object: 'SDSI local name'
    field: 'a local name maps to one or more keys'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§2.8"
    text: 'Each local name maps to one or more public keys and therefore to the corresponding keyholder(s).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0031"
    object: 'SDSI name in use by a computer system'
    field: 'the name space must be identified, not just the name string'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§2.8"
    text: 'To a computer system making use of these names, the name string is not enough.  One must identify the name space in which that byte string is defined.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0032"
    object: 'SDSI name space'
    field: 'identification of a name space by a public key'
    verb: none
    actor: 'implementation'
    locator: "§2.8"
    text: 'That name space can be identified globally by a public key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0033"
    object: 'SDSI name inside a certificate'
    field: 'the issuer key as the name space of an unqualified name'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§2.8"
    text: 'It is SDSI 1.0 convention, preserved in SPKI, that if a (local) SDSI name occurs within a certificate, then the public key of the issuer is the identifier of the name space in which that name is defined.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0034"
    object: 'SDSI name outside a certificate'
    field: 'explicit identification of the name space'
    verb: none
    actor: 'implementation'
    locator: "§2.8"
    text: 'However, if a SDSI name is ever to occur outside of a certificate, the name space within which it is defined must be identified.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0035"
    object: 'Fully Qualified SDSI Name'
    field: 'its form: a public key followed by one or more names'
    verb: none
    actor: 'implementation (parser and generator)'
    locator: "§2.8"
    text: 'This gives rise to the Fully Qualified SDSI Name.  That name is a public key followed by one or more names relative to that key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0036"
    object: 'SDSI name chain'
    field: 'what a name chain is: two or more names after the key'
    verb: none
    actor: 'implementation'
    locator: "§2.8"
    text: 'If there are two or more names, then the string of names is a SDSI name chain.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0037"
    object: 'Fully Qualified SDSI Name'
    field: 'the hash of a public key standing for the key that anchors the name (stated only by this example)'
    verb: none
    actor: 'implementation (parser and generator)'
    locator: "§2.8"
    text: 'For example, (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) jim therese) is a fully qualified SDSI name, using the SHA-1 hash of a public key as the global identifier defining the name space and anchoring this name string.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0038"
    object: 'X.509 Distinguished Name'
    field: 'expression as a Fully Qualified Name'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§2.9"
    text: 'An X.509 Distinguished Name can and sometimes must be expressed as a Fully Qualified Name.'
    kind: stated
    testable: partial
    testable_reason: 'the sentence says sometimes without saying when; the cases are given by R-0039 and R-0040, and by the 6.5.1 translation rules R-0194 and R-0195.'
    status: active
  - id: "rfc-2693#R-0039"
    object: 'X.509 name under a root whose leaf names are unique'
    field: 'the fully qualified form (name <root key> <leaf name>)'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§2.9"
    text: 'Therefore, every X.509 name should be expressed as the pair (name <root key> <leaf name>) if all leaf names descending from that root are unique.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0040"
    object: 'X.509 name under a root whose names are unique only per CA'
    field: 'the fully qualified name chain built from the certificate chain'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§2.9"
    text: 'If uniqueness is enforced only within each individual CA, then one would build a Fully Qualified Name chain from an X.509 certificate chain, yielding the form (name <root key> <CA(1)> <CA(2)> ... <CA(k)> <leaf name>).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0041"
    object: 'SDSI name binding'
    field: 'no enforcement of one key per name'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§2.10"
    text: 'SPKI/SDSI does not claim to enforce one key per name.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0042"
    object: 'group name'
    field: 'definition of a group by several (name,key) certificates for one name'
    verb: none
    actor: 'issuer (of name certificates)'
    locator: "§2.10"
    text: 'Therefore, a named group can be defined by issuing multiple (name,key) certificates with the same name -- one for each group member.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0043"
    object: 'authorization decision'
    field: 'the question the application must decide: whether the remote keyholder is permitted some access'
    verb: none
    actor: 'verifier (application)'
    locator: "§3"
    text: 'However, what an application needs to do, when given a public key certificate or a set of them, is answer the question of whether the remote keyholder is permitted some access.  That application must make a decision.  The data needed for that decision is almost never the spelling of a keyholder''s name.'
    kind: stated
    testable: no
    testable_reason: 'states the task of the verifying application, not a check on any artefact: the next paragraph draws the consequence for certificates (R-0044), and 6.6 gives the question its two operational forms (R-0214).'
    status: active
  - id: "rfc-2693#R-0044"
    object: 'certificate'
    field: 'its primary job: telling the application whether the keyholder is authorized'
    verb: none
    actor: 'verifier (application)'
    locator: "§3"
    text: 'Instead, the application needs to know if the keyholder is authorized for some access.  This is the primary job of a certificate, according to the members of the SPKI WG, and the SPKI certificate was designed to meet this need as simply and directly as possible.'
    kind: stated
    testable: no
    testable_reason: 'a statement of design purpose; it is why the SPKI certificate maps authorization to key directly (R-0052), and section 8 restates it as a working-group conclusion.'
    status: active
  - id: "rfc-2693#R-0045"
    object: 'attribute certificate (X9.57)'
    field: 'what it binds: an attribute, possibly an authorization, to a Distinguished Name'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§3.1"
    text: 'An Attribute Certificate, as defined in X9.57, binds an attribute that could be an authorization to a Distinguished Name.'
    kind: stated
    testable: partial
    testable_reason: 'the structure is defined by X9.57, not by this RFC; the binding is exercised through the 6.5.4 translation, which yields 5-tuples whose Subject is a fully-qualified name built from the Distinguished Name (R-0203, R-0204).'
    status: active
  - id: "rfc-2693#R-0046"
    object: 'attribute certificate'
    field: 'combination with an ID certificate to reach a key'
    verb: none
    actor: 'verifier (application)'
    locator: "§3.1"
    text: 'For an application to use this information, it must combine an attribute certificate with an ID certificate, in order to get the full mapping: authorization -> name -> key'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0047"
    object: 'attribute certificate with an ID certificate'
    field: 'subversion of either issuer, and the trust required in both'
    verb: none
    actor: 'verifier (application)'
    locator: "§3.1"
    text: 'However, if either of these issuers were subverted, then an attacker could obtain an authorization improperly.  Therefore, both the issuers need to be trusted with the authorization decision.'
    kind: stated
    testable: no
    testable_reason: 'a statement about whom the relying party must trust, a policy property with no check of its own; section 8 restates it as the first reason the two-certificate construct is weaker (R-0247).'
    status: active
  - id: "rfc-2693#R-0048"
    object: 'X.509v3 certificate carrying authorizations in extensions'
    field: 'one instrument carrying two mappings: authorization -> key and name -> key'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§3.2"
    text: 'X.509v3 permits general extensions.  These extensions can be used to carry authorization information.  This makes the certificate an instrument mapping both: authorization -> key and name -> key'
    kind: stated
    testable: partial
    testable_reason: 'whether the extensions of a given certificate carry authorizations is fixed by the documentation for its line of certificates (R-0199, R-0200); where they do, the root-specific code can be checked for producing both a name tuple and a 5-tuple from the one certificate (R-0202).'
    status: active
  - id: "rfc-2693#R-0049"
    object: 'X.509v3 certificate carrying authorizations in extensions'
    field: 'the single issuer must be an authority on both the authorization and the name'
    verb: none
    actor: 'issuer'
    locator: "§3.2"
    text: 'In this case, there is only one issuer, who must be an authority on both the authorization and the name.'
    kind: stated
    testable: no
    testable_reason: 'whether an issuer is an authority on a name or an authorization is a fact about the world, not about the certificate; nothing in the certificate lets a verifier check it.'
    status: active
  - id: "rfc-2693#R-0050"
    object: 'master certificate aggregating many authorizations'
    field: 'its three costs: the issuer must be an authority on every authorization, the certificate lifetime shrinks to fit the attributes, and the aggregate is a dossier'
    verb: none
    actor: 'issuer'
    locator: "§3.2"
    text: 'Some propose issuing a master X.509v3 certificate to an individual and letting extensions hold all the attributes or authorizations the individual would need.  This would require the issuer to be an authority on all of those authorizations.  In addition, this aggregation of attributes would result in shortening the lifetime of the certificate, since each attribute would have its own lifetime. Finally, aggregation of attributes amounts to the building of a dossier and represents a potential privacy violation.'
    kind: stated
    testable: no
    testable_reason: 'the reasons behind R-0051 (one authorization per certificate), each an argument. The privacy cost, building a dossier, is one of the two privacy considerations the RFC raises about its own design; the other is the option in 7.5 of several naming root keys per person, to frustrate the building of dossiers (R-0232).'
    status: active
  - id: "rfc-2693#R-0051"
    object: 'certificate'
    field: 'number of authorizations per certificate'
    verb: none
    actor: 'issuer'
    locator: "§3.2"
    text: 'For all of these reasons, it is desirable that authorizations be limited to one per certificate.'
    kind: stated
    testable: partial
    testable_reason: 'countable in any issued certificate, but stated as desirable rather than required, so a certificate carrying several authorizations is discouraged, not invalid; the reasons given are issuer authority, certificate lifetime and privacy (dossier building).'
    status: active
  - id: "rfc-2693#R-0052"
    object: 'basic SPKI certificate'
    field: 'the mapping it defines: authorization to key'
    verb: none
    actor: 'issuer and verifier'
    locator: "§3.3"
    text: 'A basic SPKI certificate defines a straight authorization mapping: authorization -> key'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0053"
    object: 'key -> name mapping'
    field: 'names reached from the key only when wanted, for logging or punishment, giving authorization -> key -> name'
    verb: none
    actor: 'verifier (application)'
    locator: "§3.3"
    text: 'If someone wants access to a keyholder''s name, for logging purposes or even for punishment after wrong-doing, then one can map from key to location information (name, address, phone, ...) to get: authorization -> key -> name'
    kind: stated
    testable: no
    testable_reason: 'a permitted pattern rather than a check: the name lies outside the authorization path. What a test can check follows in R-0054 and R-0055: only the authorization -> key part needs access-control-grade security, and a subversion of the key -> name mapping cannot defeat the access control.'
    status: active
  - id: "rfc-2693#R-0054"
    object: 'authorization -> key -> name mapping'
    field: 'its apparent security advantage over the attribute-certificate mapping: only its authorization -> key part needs access-control-grade security'
    verb: none
    actor: 'issuer'
    locator: "§3.3"
    text: 'This mapping has an apparent security advantage over the attribute certificate mapping.  In the mapping above, only the authorization -> key mapping needs to be secure at the level required for the access control mechanism.'
    kind: stated
    testable: no
    testable_reason: 'a statement of required assurance, set by the access-control mechanism it protects; there is no artefact against which to measure it.'
    status: active
  - id: "rfc-2693#R-0055"
    object: 'key -> name mapping'
    field: 'the security level it requires, and the effect of its subversion on access control'
    verb: none
    actor: 'issuer and verifier'
    locator: "§3.3"
    text: 'The key -> name mapping (and the issuer of any certificates involved) needs to be secure enough to satisfy lawyers or private investigators, but a subversion of this mapping does not permit the attacker to defeat the access control.'
    kind: stated
    testable: partial
    testable_reason: 'the assurance level is not measurable, but the second half is: a verifier that decides on authorization -> key certificates must reach the same decision whatever key -> name certificates say.'
    status: active
  - id: "rfc-2693#R-0056"
    object: 'ACL entry'
    field: 'freedom of format, because the entry is never communicated'
    verb: none
    actor: 'implementation'
    locator: "§3.4"
    text: 'In SPKI, an ACL entry is free to be implemented in any way the developer chooses, since it is never communicated and therefore does not need to be standardized.'
    kind: stated
    testable: partial
    testable_reason: 'imposes no format, so there is nothing to conform to; the one checkable consequence is that an ACL entry never appears on the wire, which can be tested only of a whole system.'
    status: active
  - id: "rfc-2693#R-0057"
    object: 'ACL entry'
    field: 'the sample format: a certificate body minus the issuer field'
    verb: none
    actor: 'implementation'
    locator: "§3.4"
    text: 'However, a sample implementation is documented, as a certificate body minus the issuer field.'
    kind: stated
    testable: partial
    testable_reason: 'a sample, not a requirement (R-0056 leaves the format free), and this RFC does not reproduce it; only a structure that claims the sample format can be checked against it.'
    status: active
  - id: "rfc-2693#R-0058"
    object: 'ACL entry'
    field: 'the Subject: a name or a key'
    verb: none
    actor: 'ACL owner'
    locator: "§3.4"
    text: 'The ACL entry can have a name as a subject, as in SDSI 1.0, or it can have a key as a subject.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0059"
    object: 'ACL entry'
    field: 'explicit authorizations carried by SPKI ACL entries'
    verb: none
    actor: 'ACL owner'
    locator: "§3.4"
    text: 'Those ACLs are single-purpose, so the individual entries do not carry explicit authorizations, but SPKI uses explicit authorizations so that one can use common authorization computation code to deal with multiple applications.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0060"
    object: 'delegation control'
    field: 'boolean control chosen over no control and integer depth'
    verb: none
    actor: 'issuer and verifier'
    locator: "§4.1.4"
    text: 'Of these three, the group chose boolean control.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0061"
    object: 'Subject of a certificate or ACL entry'
    field: 'exercise of any permission granted, whatever the delegation flag'
    verb: none
    actor: 'verifier'
    locator: "§4.1.4"
    text: 'The subject of a certificate or ACL entry may exercise any permission granted'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0062"
    object: 'Subject of a certificate or ACL entry'
    field: 'further delegation of the permission, or a subset of it, only when delegation is TRUE'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§4.1.4"
    text: 'if delegation is TRUE, may also delegate that permission or some subset of it to others.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0063"
    object: 'delegation flag set to FALSE'
    field: 'the assumption it rests on, and the signing-oracle limit'
    verb: none
    actor: 'keyholder'
    locator: "§4.1.4"
    text: 'The no control argument has logical appeal, but there remains the assumption that a user will value his or her private key enough not to loan it out or that the key will be locked in hardware where it can''t be copied to any other user.  This doesn''t prevent the user from setting up a signing oracle, but lack of network connectivity might inhibit that mechanism.'
    kind: stated
    testable: no
    testable_reason: 'an assumption about keyholder behaviour and a stated limit: a FALSE delegation flag cannot stop a keyholder lending the key or acting as a signing oracle, and no verifier can detect either.'
    status: active
  - id: "rfc-2693#R-0064"
    object: 'delegation tree'
    field: 'no control on its width, so control on its depth would not bound proliferation'
    verb: none
    actor: 'issuer and verifier'
    locator: "§4.1.4"
    text: 'As for controlling the proliferation of permissions, there is no control on the width of the delegation tree, so control on its depth is not a tight control on proliferation.'
    kind: stated
    testable: partial
    testable_reason: 'testable as an absence: no field of a certificate or 5-tuple limits how many delegations a subject with Delegation TRUE may issue; the conclusion about proliferation is part of the argument for rejecting integer depth control (R-0060).'
    status: active
  - id: "rfc-2693#R-0065"
    object: 'delegator'
    field: 'no separation between permission to delegate and permission to exercise'
    verb: none
    actor: 'verifier'
    locator: "§4.2"
    text: 'We decided that a delegator is free to create a new key pair, also controlled by it, and delegate the rights to that key to exercise the delegated permission.  Therefore, there was no benefit from attempting to restrict the exercise of a permission by someone permitted to delegate it.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0066"
    object: 'certificate or ACL entry'
    field: 'validity conditions are optional'
    verb: none
    actor: 'issuer and verifier'
    locator: "§5"
    text: 'A certificate, or an ACL entry, has optional validity conditions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0067"
    object: 'validity conditions'
    field: 'the date conditions: not-before and not-after'
    verb: none
    actor: 'issuer and verifier'
    locator: "§5"
    text: 'The traditional ones are validity dates: not-before and not-after.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0068"
    object: 'online test'
    field: 'online tests are validity conditions'
    verb: none
    actor: 'verifier'
    locator: "§5"
    text: 'The SPKI group resolved, in discussion, that on-line tests of various kinds are also validity conditions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0069"
    object: 'online test'
    field: 'an online test refines (narrows) the valid date range'
    verb: none
    actor: 'verifier'
    locator: "§5"
    text: 'That is, they further refine the valid date range of a certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0070"
    object: 'online test'
    field: 'the three kinds: CRL, revalidation, one-time'
    verb: none
    actor: 'verifier'
    locator: "§5"
    text: 'Three kinds of on-line tests are envisioned: CRL, re-validation and one-time.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0071"
    object: 'online test result'
    field: 'its issuer may differ from the certificate issuer'
    verb: none
    actor: 'verifier'
    locator: "§5"
    text: 'When validity confirmation is provided by some online test, then the issuer of those refinements need not be the issuer of the original certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0072"
    object: 'certificate subject to an online test'
    field: 'naming of the issuer of validity confirmations'
    verb: none
    actor: 'issuer'
    locator: "§5"
    text: 'However, in SPKI, the certificate issuer must specify the issuer of validity confirmations.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0073"
    object: 'wandering anti-matter CRL'
    field: 'non-determinism, and suppression of revocation by blocking CRL delivery'
    verb: none
    actor: 'verifier'
    locator: "§5.1"
    text: 'However, this process is non-deterministic.  The result of the authorization computation is at least timing dependent.  Given an active adversary, it can also be a security hole.  That is, an adversary can prevent revocation of a given certificate by preventing the delivery of new CRLs.  This does not require cryptographic level effort, merely network tampering.'
    kind: stated
    testable: partial
    testable_reason: 'a threat statement: the reason anti-matter CRLs are ruled out (R-0074) and SPKI makes every computation deterministic (R-0075); the defence a test can check is R-0082, that a certificate which might use a CRL is not processed without a valid one.'
    status: active
  - id: "rfc-2693#R-0074"
    object: 'wandering anti-matter CRL'
    field: 'exclusion from SPKI'
    verb: none
    actor: 'verifier'
    locator: "§5.1"
    text: 'SPKI has ruled out the use of wandering anti-matter CRLs for its certificates.'
    kind: stated
    testable: partial
    testable_reason: 'a ban stated by name; it is made operational by the timed-CRL conditions of 5.2 (R-0077 to R-0083), and a verifier is tested against those, not against this sentence.'
    status: active
  - id: "rfc-2693#R-0075"
    object: 'authorization computation'
    field: 'determinism'
    verb: none
    actor: 'verifier'
    locator: "§5.1"
    text: 'Every authorization computation is deterministic, under SPKI rules.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0076"
    object: 'timed CRL'
    field: 'permission to use timed CRLs, and the three conditions that then apply'
    verb: none
    actor: 'issuer, CRL issuer and verifier'
    locator: "§5.2"
    text: 'SPKI permits use of timed CRLs.  That is, if a certificate can be referenced in a CRL, then the CRL process is subject to three conditions.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0077"
    object: 'certificate that can be referenced in a CRL'
    field: 'the key (or its hash) that will sign the CRL'
    verb: none
    actor: 'issuer'
    locator: "§5.2"
    text: 'The certificate must list the key (or its hash) that will sign the CRL'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0078"
    object: 'certificate that can be referenced in a CRL'
    field: 'locations from which the CRL may be fetched'
    verb: none
    actor: 'issuer'
    locator: "§5.2"
    text: 'may give one or more locations where that CRL might be fetched.'
    kind: stated
    testable: partial
    testable_reason: 'a pure permission, so neither giving nor omitting locations can fail conformance; a verifier must cope with a certificate that names no location.'
    status: active
  - id: "rfc-2693#R-0079"
    object: 'timed CRL'
    field: 'validity dates'
    verb: none
    actor: 'CRL issuer'
    locator: "§5.2"
    text: 'The CRL must carry validity dates.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0080"
    object: 'successive timed CRLs'
    field: 'non-intersection of their validity date ranges'
    verb: none
    actor: 'CRL issuer and verifier'
    locator: "§5.2"
    text: 'CRL validity date ranges must not intersect.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0081"
    object: 'successive timed CRLs'
    field: 'no new CRL taking effect before the current one expires'
    verb: none
    actor: 'CRL issuer'
    locator: "§5.2"
    text: 'That is, one may not issue a new CRL to take effect before the expiration of the CRL currently deployed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0082"
    object: 'certificate that might use a CRL'
    field: 'no processing without a valid CRL'
    verb: none
    actor: 'verifier'
    locator: "§5.2"
    text: 'Under these rules, no certificate that might use a CRL can be processed without a valid CRL'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0083"
    object: 'timed CRL'
    field: 'no CRL appearing unannounced at the verifier'
    verb: none
    actor: 'CRL issuer'
    locator: "§5.2"
    text: 'no CRL can be issued to show up as a surprise at the verifier.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0084"
    object: 'validity computation under timed CRLs'
    field: 'determinism independent of clock skew, and the effect of verifier clock error'
    verb: none
    actor: 'verifier'
    locator: "§5.2"
    text: 'This yields a deterministic validity computation, independent of clock skew, although clock inaccuracies in the verifier may produce a result not desired by the issuer.'
    kind: stated
    testable: partial
    testable_reason: 'determinism for a fixed verifier time is testable; the caveat is not a requirement but a warning that the result is only as good as the verifier clock, and the source sets no bound on clock error.'
    status: active
  - id: "rfc-2693#R-0085"
    object: 'timed CRL'
    field: 'what a timed CRL is: a completion of the certificate'
    verb: none
    actor: 'verifier'
    locator: "§5.2"
    text: 'The CRL in this case is a completion of the certificate, rather than a message to the world announcing a change of mind.'
    kind: stated
    testable: no
    testable_reason: 'a statement of meaning, not of behaviour; its operational content is R-0082, that the certificate is incomplete, and so unusable, without a current CRL.'
    status: active
  - id: "rfc-2693#R-0086"
    object: 'timed CRL'
    field: 'a full CRL followed by delta-CRLs, because CRLs grow'
    verb: none
    actor: 'CRL issuer and verifier'
    locator: "§5.2"
    text: 'Since CRLs might get very large and since they tend to grow monotonically, one might want to issue changes to CRLs rather than full ones.  That is, a CRL might be a full CRL followed by a sequence of delta-CRLs.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0087"
    object: 'full CRL with delta-CRLs'
    field: 'treatment as one current CRL bound by the three conditions'
    verb: none
    actor: 'CRL issuer and verifier'
    locator: "§5.2"
    text: 'That sequence of instruments is then treated as a current CRL and the combined CRL must follow the conditions listed above.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0088"
    object: 'revalidation'
    field: 'what a revalidation is: the positive form of a CRL'
    verb: none
    actor: 'revalidation issuer and verifier'
    locator: "§5.3"
    text: 'CRLs are negative statements.  The positive version of a CRL is what we call a revalidation.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0089"
    object: 'revalidation'
    field: 'number of certificates one revalidation may list'
    verb: none
    actor: 'verifier'
    locator: "§5.3"
    text: 'Typically a revalidation would list only one certificate (the one of interest), although it might list a set of certificates (to save digital signature effort).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0090"
    object: 'timed revalidation'
    field: 'determinism, by following the 5.2 conditions (R-0077 to R-0081) with revalidation in place of CRL'
    verb: none
    actor: 'issuer, revalidation issuer and verifier'
    locator: "§5.3"
    text: 'As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0091"
    object: 'timed CRL and timed revalidation'
    field: 'non-zero validity interval'
    verb: none
    actor: 'CRL issuer and revalidation issuer'
    locator: "§5.4"
    text: 'Both timed CRLs and timed revalidations have non-0 validity intervals.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0092"
    object: 'validity interval of a timed CRL or revalidation'
    field: 'the question that sets its length'
    verb: none
    actor: 'CRL issuer and revalidation issuer'
    locator: "§5.4"
    text: 'To set this validity interval, one must answer the question: "How long are you willing to let the world believe and act on a statement you know to be false?"'
    kind: stated
    testable: no
    testable_reason: 'a policy decision for the issuer (5.4 says the answer comes from risk management); any length passes, so there is nothing to test.'
    status: active
  - id: "rfc-2693#R-0093"
    object: 'validity interval of a timed CRL or revalidation'
    field: 'the assumption to make when setting it'
    verb: none
    actor: 'CRL issuer and revalidation issuer'
    locator: "§5.4"
    text: 'That is, one must assume that the previous CRL or revalidation has just been signed and transmitted to at least one consumer, locking up a time slot.'
    kind: stated
    testable: no
    testable_reason: 'a planning assumption for the issuer, not an observable behaviour; its consequence for revocation latency is R-0094.'
    status: active
  - id: "rfc-2693#R-0094"
    object: 'timed CRL or revalidation'
    field: 'the next time slot, and the earliest possible revocation'
    verb: none
    actor: 'CRL issuer and revalidation issuer'
    locator: "§5.4"
    text: 'The next available time slot starts after this validity interval ends.  That is the earliest one can revoke a certificate one learns to be false.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0095"
    object: 'timed CRL and timed revalidation'
    field: 'zero-length validity interval'
    verb: none
    actor: 'CRL issuer and revalidation issuer'
    locator: "§5.5"
    text: 'Validity intervals of length zero are not possible.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0096"
    object: 'validity interval of a timed CRL or revalidation'
    field: 'allowance for clock skew'
    verb: none
    actor: 'CRL issuer and revalidation issuer'
    locator: "§5.5"
    text: 'If clock skew is taken into consideration, validity intervals need to be that much larger to be meaningful.'
    kind: stated
    testable: partial
    testable_reason: 'the source names no skew bound, so whether an interval is large enough is testable only against a skew figure the deployment supplies.'
    status: active
  - id: "rfc-2693#R-0097"
    object: 'one-time revalidation'
    field: 'its purpose: a validity interval of zero'
    verb: none
    actor: 'revalidation issuer and verifier'
    locator: "§5.5"
    text: 'For those who want to set the validity interval to zero, SPKI defines a one-time revalidation.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0098"
    object: 'one-time revalidation'
    field: 'no lifetime beyond the current authorization computation'
    verb: none
    actor: 'verifier'
    locator: "§5.5"
    text: 'This form of revalidation has no lifetime beyond the current authorization computation.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0099"
    object: 'one-time revalidation request'
    field: 'the nonce it carries'
    verb: none
    actor: 'verifier'
    locator: "§5.5"
    text: 'One applies for this on-line, one-time revalidation by submitting a request containing a nonce.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0100"
    object: 'one-time revalidation instrument'
    field: 'return of the request nonce inside the signed instrument'
    verb: none
    actor: 'revalidation issuer and verifier'
    locator: "§5.5"
    text: 'That nonce gets returned in the signed revalidation instrument, in order to prevent replay attacks.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0101"
    object: 'one-time revalidation'
    field: 'the validity interval it stands for: zero length, at the moment the computation completes'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§5.5"
    text: 'This protocol takes the place of a validity date range and represents a validity interval of zero, starting and ending at the time the authorization computation completes.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0102"
    object: 'choice of validity mechanism'
    field: 'short-lived certificates as an alternative to online tests'
    verb: none
    actor: 'system designer'
    locator: "§5.6"
    text: 'A performance analysis of the various methods of achieving fine-grain control over the validity interval of a certificate should consider the possibility of just making the original certificate short-lived, especially if the online test result is issued by the same key that issued the certificate.'
    kind: stated
    testable: no
    testable_reason: 'advice on how to conduct a design analysis; it constrains no artefact.'
    status: active
  - id: "rfc-2693#R-0103"
    object: 'online test statement for short-lived certificates'
    field: 'where a replacement short-lived certificate may be fetched'
    verb: none
    actor: 'issuer and verifier'
    locator: "§5.6"
    text: 'If one wants to issue short-lived certificates, SPKI defines a kind of online test statement to tell the user of the certificate where a replacement short-lived certificate might be fetched.'
    kind: stated
    testable: partial
    testable_reason: 'this RFC says only that SPKI defines such a statement and what it is for; its format is not given here.'
    status: active
  - id: "rfc-2693#R-0104"
    object: 'verifier-decided validity model'
    field: 'its absence from the SPKI structure definition'
    verb: none
    actor: 'implementation'
    locator: "§5.7.2"
    text: 'This line of thought deserves further consideration, but is not reflected in the SPKI structure definition.'
    kind: stated
    testable: no
    testable_reason: 'a statement of scope: SPKI validity conditions are set by the issuer and the online-test issuers it names, and the verifier-decides alternative of [R98] is left out; there is no behaviour to check.'
    status: active
  - id: "rfc-2693#R-0105"
    object: 'authorization computation'
    field: 'ownership of the processing by the application developer'
    verb: none
    actor: 'implementation'
    locator: "§6"
    text: 'The processing of certificates and related objects to yield an authorization result is the province of the developer of the application or system.'
    kind: stated
    testable: no
    testable_reason: 'assigns responsibility rather than behaviour; read with R-0106 it means the section 6 algorithm is not mandated, only its results.'
    status: active
  - id: "rfc-2693#R-0106"
    object: 'tuple reduction (section 6)'
    field: 'status of the processing plan: an example that defines semantics'
    verb: none
    actor: 'implementation'
    locator: "§6"
    text: 'The processing plan presented here is an example that may be followed, but its primary purpose is to clarify the semantics of an SPKI certificate and the way it and various other kinds of certificate might be used to yield an authorization result.'
    kind: stated
    testable: partial
    testable_reason: 'the plan itself is optional, so an implementation that computes differently is not non-conforming; what binds is the semantics, which a test checks by comparing authorization results against the section 6 rules (R-0136 to R-0191), never by inspecting the algorithm.'
    status: active
  - id: "rfc-2693#R-0107"
    object: 'input to the authorization computation'
    field: 'the three kinds of entity it takes'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6"
    text: 'There are three kinds of entity that might be input to the computation that yields an authorization result: 1.  <name,key> (as a certificate) 2.  <authorization,name> (as an attribute certificate or ACL entry) 3.  <authorization,key> (as an authorization certificate or ACL entry)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0108"
    object: 'authorization computation'
    field: 'the three stages and their order'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6"
    text: 'These entities are processed in three stages.'
    kind: stated
    testable: partial
    testable_reason: 'the stage order (verify and map, then reduce names, then reduce authorizations; R-0109 to R-0117) belongs to a plan R-0106 calls an example, so only results that differ from it are testable, not the staging itself.'
    status: active
  - id: "rfc-2693#R-0109"
    object: 'stage 1: certificate verification'
    field: 'signature checking, and other work'
    verb: none
    actor: 'verifier'
    locator: "§6"
    text: 'Individual certificates are verified by checking their signatures and possibly performing other work.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0110"
    object: 'stage 1: certificate verification'
    field: 'mapping each verified certificate to tuples'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6"
    text: 'They are then mapped to intermediate forms, called "tuples" here.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0111"
    object: 'stage 1 for SPKI and SDSI certificates'
    field: 'processing of online test results'
    verb: none
    actor: 'verifier'
    locator: "§6"
    text: 'The other work for SPKI or SDSI certificates might include processing of on-line test results (CRL, re-validation or one-time validation).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0112"
    object: 'stage 1 for PGP certificates'
    field: 'web-of-trust computation'
    verb: none
    actor: 'verifier'
    locator: "§6"
    text: 'The other work for PGP certificates may include a web-of-trust computation.'
    kind: stated
    testable: partial
    testable_reason: 'the web-of-trust rules belong to PGP and are not given in this RFC (see R-0196).'
    status: active
  - id: "rfc-2693#R-0113"
    object: 'stage 1 for X.509 certificates'
    field: 'work defined by the documentation for that use of X.509'
    verb: none
    actor: 'verifier'
    locator: "§6"
    text: 'The other work for X.509 certificates depends on the written documentation for that particular use of X.509 (typically tied to the root key from which the certificate descended) and could involve checking information in the parent certificate as well as additional information in extensions of the certificate in question.'
    kind: stated
    testable: partial
    testable_reason: 'what must be checked is set per root key by documentation outside this RFC; testable only against that documentation.'
    status: active
  - id: "rfc-2693#R-0114"
    object: 'interpretation of an X.509 certificate chain'
    field: 'where the interpretation is specified: documentation tied to the root'
    verb: none
    actor: 'verifier'
    locator: "§6"
    text: 'All of these interpretations are specified in written documentation associated with the certificate chain and therefore with the root from which the chain descends.'
    kind: stated
    testable: partial
    testable_reason: 'locates the rules outside this RFC; a verifier is testable only against the documentation for the root in question.'
    status: active
  - id: "rfc-2693#R-0115"
    object: 'tuple produced from a certificate with online tests'
    field: 'its validity dates: VIntersect of the test results with the certificate dates'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6"
    text: 'If on-line tests are involved in the certificate processing, then the validity dates of those on-line test results are intersected by VIntersect() [defined in 6.3.2, below] with the validity dates of the certificate to yield the dates in the certificate''s tuple(s).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0116"
    object: 'stage 2: name reduction'
    field: 'replacement of names by keys or hashes from name 4-tuples'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6"
    text: 'Uses of names are replaced with simple definitions (keys or hashes), based on the name definitions available from reducing name 4-tuples.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0117"
    object: 'stage 3: authorization reduction'
    field: 'reduction of 5-tuples to a final result'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6"
    text: 'Authorization 5-tuples are then reduced to a final authorization result.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0118"
    object: '5-tuple'
    field: 'held in trusted memory, carrying no signature'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.1"
    text: 'The 5-tuple is an intermediate form, assumed to be held in trusted memory so that it doesn''t need a digital signature for integrity.'
    kind: stated
    testable: partial
    testable_reason: 'that a 5-tuple carries no signature is checkable; that the memory holding it is trusted is a deployment assumption no test of the reducer can establish.'
    status: active
  - id: "rfc-2693#R-0119"
    object: '5-tuple'
    field: 'production by trusted software'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.1"
    text: 'It is produced from certificates or other credentials via trusted software.'
    kind: stated
    testable: no
    testable_reason: 'trust in the translating software is an assumption about the platform, not a property of its output.'
    status: active
  - id: "rfc-2693#R-0120"
    object: '5-tuple'
    field: 'the contents of an SPKI certificate body, whatever its source'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.1"
    text: 'Its contents are the same as the contents of an SPKI certificate body, but it might be derived from another form of certificate or from an ACL entry.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0121"
    object: '5-tuple Issuer'
    field: 'type and meaning: a key, its hash, or the reserved word Self'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.1"
    text: 'Issuer: a public key (or its hash), or the reserved word "Self". This identifies the entity speaking this intermediate result.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0122"
    object: '5-tuple derived from an ACL entry'
    field: 'its Issuer: the reserved word Self'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.1"
    text: 'A 5-tuple derived from an ACL entry takes as its Issuer the reserved word "Self", which stands for the owner of the resource the ACL controls.'
    kind: inferred
    testable: yes
    testable_reason: 'NOT VERBATIM. Composed from statements the source never joins. 6.1 makes "Self" a reserved value of the Issuer (R-0121) and says a 5-tuple may be derived from an ACL entry (R-0120); 1.1 says an ACL entry has no Issuer (R-0003) and that the ACL has the resource owner as its implicit issuer (R-0002), and 3.4 says the SDSI 1.0 ACL "was assumed issued by the owner of the computer and therefore of the resource being controlled". The source never says what "Self" denotes. Without this reading a tuple derived from an ACL entry has no Issuer, so it cannot be the first tuple of the 6.3 rule (R-0136), and no chain could be anchored as 1.1 requires (R-0001).'
    status: active
  - id: "rfc-2693#R-0123"
    object: '5-tuple Subject'
    field: 'type and meaning: key or hash, name, hash of an object, or threshold function'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.1"
    text: 'Subject: a public key (or its hash), a name used to identify a public key, the hash of an object or a threshold function of subordinate subjects.  This identifies the entity being spoken about in this intermediate result.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0124"
    object: '5-tuple Delegation'
    field: 'type and meaning: a boolean that, when TRUE, permits further propagation'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.1"
    text: 'Delegation: a boolean.  If TRUE, then the Subject is permitted by the Issuer to further propagate the authorization in this intermediate result.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0125"
    object: '5-tuple Authorization'
    field: 'type: an S-expression'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.1"
    text: 'Authorization: an S-expression.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0126"
    object: '5-tuple validity dates'
    field: 'a not-before and a not-after date, each a date and time'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.1"
    text: 'Validity dates: a not-before date and a not-after date, where "date" means date and time.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0127"
    object: '5-tuple validity dates'
    field: 'default when the not-before date is missing: minus infinity'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.1"
    text: 'If the not-before date is missing from the source credential then minus infinity is assumed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0128"
    object: '5-tuple validity dates'
    field: 'default when the not-after date is missing: plus infinity'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.1"
    text: 'If the not-after date is missing then plus infinity is assumed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0129"
    object: 'name 4-tuple'
    field: 'why a <name,key> certificate gets its own intermediate form'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.2"
    text: 'A <name,key> certificate (such as X.509v1 or SDSI 1.0) carries no authorization field but does carry a name.  Since it is qualitatively different from an authorization certificate, a separate intermediate form is defined for it.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0130"
    object: 'name 4-tuple Issuer'
    field: 'type and meaning: a key or its hash (no Self, unlike the 5-tuple), defining the name in its own name space'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.2"
    text: 'Issuer: a public key (or its hash).  This identifies the entity defining this name in its private name space.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0131"
    object: 'name 4-tuple Name'
    field: 'type: a byte string'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.2"
    text: 'Name: a byte string'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0132"
    object: 'name 4-tuple Subject'
    field: 'type and meaning: key or hash, name, or threshold function (no hash of an object, unlike the 5-tuple); it defines the name'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.2"
    text: 'Subject: a public key (or its hash), a name, or a threshold function of subordinate subjects.  This defines the name.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0133"
    object: 'name 4-tuple validity dates'
    field: 'a not-before and a not-after date, each a date and time'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.2"
    text: 'Validity dates: a not-before date and a not-after date, where "date" means date and time.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0134"
    object: 'name 4-tuple validity dates'
    field: 'default when the not-before date is missing: minus infinity'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.2"
    text: 'If the not-before date is missing from the source credential then minus infinity is assumed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0135"
    object: 'name 4-tuple validity dates'
    field: 'default when the not-after date is missing: plus infinity'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.2"
    text: 'If the not-after date is missing then plus infinity is assumed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0136"
    object: '5-tuple reduction'
    field: 'the result of combining two 5-tuples'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3"
    text: 'The two 5-tuples: <I1,S1,D1,A1,V1> + <I2,S2,D2,A2,V2> yield <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)>'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0137"
    object: '5-tuple reduction'
    field: 'proviso: AIntersect and VIntersect both succeed'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3"
    text: 'provided the two intersections succeed,'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0138"
    object: '5-tuple reduction'
    field: 'proviso: the Subject of the first tuple equals the Issuer of the second'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3"
    text: 'S1 = I2'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0139"
    object: '5-tuple reduction'
    field: 'proviso: the Delegation of the first tuple is TRUE'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3"
    text: 'D1 = TRUE'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0140"
    object: '5-tuple reduction whose first Subject is a threshold subject'
    field: 'modification of the rule when S1 is a threshold subject'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3"
    text: 'If S1 is a threshold subject, there is a slight modification to this rule, as described below in section 6.3.3.'
    kind: stated
    testable: partial
    testable_reason: 'a pointer; the modification itself is R-0165 to R-0170, and a test of this sentence is a test of those.'
    status: active
  - id: "rfc-2693#R-0141"
    object: 'authorization (tag)'
    field: 'structure: a list of strings or sub-lists with application-defined meaning'
    verb: none
    actor: 'application (tag designer)'
    locator: "§6.3.1"
    text: 'An authorization is a list of strings or sub-lists, of meaning to and probably defined by the application that will use this authorization for access control.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0142"
    object: 'AIntersect'
    field: 'element-by-element matching'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: 'Two authorizations intersect by matching, element for element.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0143"
    object: 'AIntersect'
    field: 'lists of different length: the longer list is the result'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: 'If one list is longer than the other but match at all elements where both lists have elements, then the longer list is the result of the intersection.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0144"
    object: 'authorization (tag)'
    field: 'each added list element narrows the permission'
    verb: none
    actor: 'application (tag designer)'
    locator: "§6.3.1"
    text: 'This means that additional elements of a list must restrict the permission granted.'
    kind: stated
    testable: partial
    testable_reason: 'a constraint on how an application gives meaning to its tags; the reducer cannot check it, and only an application profile can be reviewed for a tag whose longer form grants more.'
    status: active
  - id: "rfc-2693#R-0145"
    object: 'AIntersect'
    field: 'application-independent intersection rules'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: 'Although actual authorization string definitions are application dependent, AIntersect provides rules for automatic intersection of these strings so that application developers can know the semantics of the strings they use.'
    kind: stated
    testable: partial
    testable_reason: 'a design property, that the reducer applies the same rules to every application tag set; testable as the absence of application-specific behaviour across tag sets, not by any single case.'
    status: active
  - id: "rfc-2693#R-0146"
    object: 'tags needing non-standard semantics'
    field: 'need for special reduction software'
    verb: none
    actor: 'application (tag designer)'
    locator: "§6.3.1"
    text: 'Special semantics would require special reduction software.'
    kind: stated
    testable: no
    testable_reason: 'a warning that tags whose meaning the AIntersect rules cannot express fall outside the generic reducer; it names no behaviour to test.'
    status: active
  - id: "rfc-2693#R-0147"
    object: 'AIntersect'
    field: 'position dependency of list elements'
    verb: none
    actor: 'verifier (tuple reducer) and application (tag designer)'
    locator: "§6.3.1"
    text: 'Since the AIntersect rules imply position dependency, one could also define the previous authorization string as: (ftp ftp.clark.net /pub/cme) to keep the form compact.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0148"
    object: '*-form'
    field: 'the special S-expressions, named *, that give wild cards'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: 'To allow for wild cards, there are a small number of special S-expressions defined, using "*" as the expression name.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0149"
    object: '(*)'
    field: 'meaning: the set of all S-expressions and byte strings'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: '(*) stands for the set of all S-expressions and byte-strings. In other words, it will match anything.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0150"
    object: '(*)'
    field: 'intersection with anything yields that other thing'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: 'When intersected with anything, the result is that other thing.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0151"
    object: 'AIntersect'
    field: 'implicit (*) padding of the shorter list'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: 'The AIntersect rule about lists of different length treats a list as if it had enough (*) entries implicitly appended to it to match the length of another list with which it was being intersected.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0152"
    object: '(* set <tag-expr>*)'
    field: 'meaning: the set of the listed elements'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: '(* set <tag-expr>*) stands for the set of elements listed in the *-form.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0153"
    object: '(* prefix <byte-string>)'
    field: 'meaning: all byte strings that start with the given one'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: '(* prefix <byte-string>) stands for the set of all byte strings that start with the one given in the *-form.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0154"
    object: '(* range <ordering> <lower-limit>? <upper-limit>?)'
    field: 'meaning: all byte strings between the limits'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: '(* range <ordering> <lower-limit>? <upper-limit>?) stands for the set of all byte strings lexically (or numerically) between the two limits.'
    kind: stated
    testable: partial
    testable_reason: 'the prose says only between the two limits; the one worked example in 6.3.1 writes each limit with an operator (ge, le) that the syntax line does not show, so whether a limit is inclusive, and what an omitted limit means, must come from that example or from the SPKI structure definition, which this RFC does not reproduce.'
    status: active
  - id: "rfc-2693#R-0155"
    object: '(* range ...) ordering parameter'
    field: 'the five orderings: alpha, numeric, time, binary, date'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: 'The ordering parameter (alpha, numeric, time, binary, date) specifies the kind of strings allowed.'
    kind: stated
    testable: partial
    testable_reason: 'the five names are fixed, but the comparison each denotes (what alpha or binary order is, the time and date formats) is not defined in this RFC.'
    status: active
  - id: "rfc-2693#R-0156"
    object: 'AIntersect'
    field: 'set-intersection semantics, a list standing for all lists that start with its elements'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.1"
    text: 'AIntersect() is normal set intersection, when *-forms are defined as they are above and a normal list is taken to mean all lists that start with those elements.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0157"
    object: 'VIntersect'
    field: 'definition: the later start and the earlier end'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.2"
    text: 'V = VIntersect( X, Y ) is defined as Vmin = max( Xmin, Ymin ) Vmax = min( Xmax, Ymax )'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0158"
    object: 'VIntersect'
    field: 'failure when the start falls after the end (strictly: Vmin = Vmax is a valid interval)'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.2"
    text: 'if Vmin > Vmax, then the intersection failed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0159"
    object: 'validity times'
    field: 'monotonic representation of daytimes'
    verb: none
    actor: 'implementation'
    locator: "§6.3.2"
    text: 'These rules assume that daytimes are expressed in a monotonic form, as they are in SPKI.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0160"
    object: 'VIntersect over online tests'
    field: 'evaluation of each online test a certificate is subject to'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.2"
    text: 'The full SPKI VIntersect() also deals with online tests.  In the most straight-forward implementation, each online test to which a certificate is subject is evaluated.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0161"
    object: 'online test result'
    field: 'the validity interval it carries'
    verb: none
    actor: 'online test issuer'
    locator: "§6.3.2"
    text: 'Each such test carries with it a validity interval, in terms of dates.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0162"
    object: 'VIntersect over online tests'
    field: 'intersection of the test interval with the certificate interval'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.2"
    text: 'That validity interval is intersected with any present in the certificate, to yield a new, current validity interval.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0163"
    object: 'VIntersect over online tests'
    field: 'deferred evaluation: carrying the union of the tests in the tuples'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.2"
    text: 'It is possible for an implementation of VIntersect() to gather up online tests that are present in each certificate and include the union of all those tests in the accumulating tuples.  In this case, the evaluation of those online tests is deferred until the end of the process.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0164"
    object: 'VIntersect over online tests'
    field: 'when deferred evaluation is appropriate'
    verb: none
    actor: 'CRC issuer (reducing service)'
    locator: "§6.3.2"
    text: 'This might be appropriate if the tuple reduction is being performed not for answering an immediate authorization question but rather for generation of a summary certificate (Certificate Result Certificate) that one might hope would be useful for a long time.'
    kind: stated
    testable: no
    testable_reason: 'guidance on when to choose deferred evaluation (R-0163); either choice conforms.'
    status: active
  - id: "rfc-2693#R-0165"
    object: 'threshold subject'
    field: 'parameters K and N with 0 < K <= N, and N subordinate subjects'
    verb: none
    actor: 'issuer and verifier'
    locator: "§6.3.3"
    text: 'A threshold subject is specified by two numbers, K and N [0<K<=N], and N subordinate subjects.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0166"
    object: 'threshold subject reduction'
    field: 'selection of K subordinates, each reduced to the same subject'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.3"
    text: 'A threshold subject is reduced to a single subject by selecting K of the N subjects and reducing each of those K to the same subject, through a sequence of certificates.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0167"
    object: 'threshold subject reduction'
    field: 'the N-K unselected subordinates set to (null)'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.3"
    text: 'The (N-K) unselected subordinate subjects are set to (null).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0168"
    object: 'threshold subject reduction'
    field: 'the intermediate form: one copy of the tuple per subordinate subject'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.3"
    text: 'The intermediate form for a threshold subject is a copy of the tuple in which the threshold subject appears, but with only one of the subordinate subjects.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0169"
    object: 'threshold subject reduction'
    field: 'the stopping condition: N-K (null) entries and K entries with the same subject'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.3"
    text: 'Those subordinate tuples are reduced individually until the list of subordinate tuples has (N-K) (null) entries and K entries with the same subject.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0170"
    object: 'threshold subject reduction'
    field: 'the K tuples intersected in validity, authorization and delegation into one tuple'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.3"
    text: 'At that point, those K tuples are validity-, authorization- and delegation- intersected to yield the single tuple that will replace the list of tuples.'
    kind: stated
    testable: partial
    testable_reason: 'validity and authorization intersection are VIntersect and AIntersect (R-0157, R-0156), but delegation-intersection is defined nowhere in the RFC; the natural reading is the boolean AND of the K Delegation values, but that is not stated, so a test of the Delegation of the merged tuple rests on that reading.'
    status: active
  - id: "rfc-2693#R-0171"
    object: 'reduction order'
    field: 'reductions applied in the order the prover supplies'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.3.4"
    text: 'All reduction operations are in the order provided by the prover.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0172"
    object: 'certificate path discovery'
    field: 'path finding assigned to the prover, not the verifier'
    verb: none
    actor: 'prover'
    locator: "§6.3.4"
    text: 'That simplifies the job of the verifier, but leaves the job of finding the correct list of reductions to the prover.'
    kind: stated
    testable: no
    testable_reason: 'allocates work between roles rather than constraining behaviour: a verifier need not search for a path, but 6.4 (R-0182) contemplates a verifier working from an unordered pool, so searching is not forbidden either.'
    status: active
  - id: "rfc-2693#R-0173"
    object: 'grantee of authority'
    field: 'receipt of the certificate sequence that delegates the authority'
    verb: none
    actor: 'issuer (delegator)'
    locator: "§6.3.4"
    text: 'Each keyholder who is granted some authority should receive a sequence of certificates delegating that authority.'
    kind: stated
    testable: partial
    testable_reason: 'checkable in a system test (the grantee holds the chain from the ACL down to its key), but it is lowercase advice in a paragraph explaining why path discovery is rarely needed, not a condition on any certificate.'
    status: active
  - id: "rfc-2693#R-0174"
    object: 'further delegation'
    field: 'extension of the chain by appending one certificate'
    verb: none
    actor: 'keyholder (delegator)'
    locator: "§6.3.4"
    text: 'That keyholder may then want to delegate part of this authority on to some other keyholder.  To do that, a single additional certificate is generated and appended to the sequence already available, yielding a sequence that can be used by the delegatee to prove access permission.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0175"
    object: 'name 4-tuple'
    field: 'the two classes: name defined as a key, name defined as another name'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4"
    text: 'There will be name 4-tuples in two different classes, those that define the name as a key and those that define the name as another name. 1.  [(name K1 N) -> K2] 2.  [(name K1 N) -> (name K2 N1 N2 ... Nk)]'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0176"
    object: 'name 4-tuples presented for reduction'
    field: 'delivery in the order the reduction needs'
    verb: none
    actor: 'prover'
    locator: "§6.4"
    text: 'As with the 5-tuples discussed in the previous section, name definition 4-tuples should be delivered in the order needed by the prover.'
    kind: stated
    testable: partial
    testable_reason: 'lowercase should; a prover can be checked for delivering an order that reduces, but the sentence says the order needed by the prover where the parallel 6.3.4 rule (R-0171) has the verifier applying the order the prover provides, so which party the order serves is ambiguous as printed.'
    status: active
  - id: "rfc-2693#R-0177"
    object: 'name reduction'
    field: 'the rule: replace the name just defined by its definition'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4"
    text: 'In that case, the rule for name reduction is to replace the name just defined by its definition.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0178"
    object: 'name reduction'
    field: 'case 1, a name defined as a key: the defined prefix is replaced by the key (given for example, but schematic in K and N)'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4"
    text: '(name K1 N N1 N2 N3) + [(name K1 N) -> K2] -> (name K2 N1 N2 N3)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0179"
    object: 'name reduction'
    field: 'case 2, a name defined as a name: the definition replaces the prefix and the remaining names follow it'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4"
    text: '(name K1 N Na Nb Nc) + [(name K1 N) -> (name K2 N1 N2 ... Nk)] -> (name K2 N1 N2 ... Nk Na Nb Nc)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0180"
    object: 'name reduction'
    field: 'names may grow during reduction'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4"
    text: 'With the second form of name definition, one might have names that temporarily grow.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0181"
    object: 'verifier given an ordered presentation'
    field: 'applying the reductions as presented'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4"
    text: 'If the prover is providing certificates in order, then the verifier need only do as it is told.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0182"
    object: 'name reduction from an unordered pool'
    field: 'the safe rule: apply only 4-tuples that define a name as a key'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4"
    text: 'If the verifier is operating from an unordered pool of tuples, then a safe rule for name reduction is to apply only those 4-tuples that define a name as a key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0183"
    object: 'name reduction from an unordered pool'
    field: 'bringing class (2) 4-tuples into class (1), and reducing every name to a key'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4"
    text: 'Such applications should bring 4-tuples that started out in class (2) into class (1), and eventually reduce all names to keys.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0184"
    object: 'name reduction from an unordered pool'
    field: 'termination: naming loops avoided'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4"
    text: 'Any naming loops are avoided by this process.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0185"
    object: 'threshold subject with named subordinates'
    field: 'reduction of the names by 4-tuples'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4.1"
    text: 'Some of a threshold subject''s subordinate subjects might be names. Those names must be reduced by application of 4-tuples.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0186"
    object: 'threshold subject with named subordinates'
    field: 'independent reduction of each subordinate name'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4.1"
    text: 'The name reduction process proceeds independently on each name in the subordinate subject as indicated in 6.3.3 above.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0187"
    object: 'threshold subject with named subordinates'
    field: 'reducing the names while keeping the threshold form'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4.1"
    text: 'One can reduce individual named subjects in a threshold subject and leave the subject in threshold form, if one desires.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0188"
    object: 'threshold subject with named subordinates'
    field: 'only validity is intersected during name reduction'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4.1"
    text: 'There is no delegation- or authorization-intersection involved, only a validity-intersection during name reduction.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0189"
    object: 'threshold subject left in threshold form'
    field: 'its use by a service that produces Certificate Result Certificates'
    verb: none
    actor: 'CRC issuer (reducing service)'
    locator: "§6.4.1"
    text: 'This might be used by a service that produces Certificate Result Certificates [see 6.7].'
    kind: stated
    testable: no
    testable_reason: 'guidance on use, and permissive. The cross-reference is a defect in the source: RFC 2693 has no section 6.7, and Certificate Result Certificates are defined in 6.6 (R-0215, R-0216).'
    status: active
  - id: "rfc-2693#R-0190"
    object: 'tuple whose subject is reduced by a 4-tuple'
    field: 'validity of the result: the intersection of the two intervals'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4.2"
    text: 'Whenever a 4-tuple is used to reduce the subject (or part of the subject) of another tuple, its validity interval is intersected with that of the tuple holding the subject being reduced and the intersection is used in the resulting tuple.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0191"
    object: 'tuple whose subject is reduced by a 4-tuple'
    field: 'delegation and authorization unchanged'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§6.4.2"
    text: 'Since a 4-tuple contains no delegation or authorization fields, the delegation permission and authorization of the tuple being acted upon does not change.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0192"
    object: 'certificate translation'
    field: 'every certificate format and ACL entry is translatable to tuples'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5"
    text: 'Any certificate currently defined, as well as ACL entries and possibly other instruments, can be translated to 5-tuples (or name tuples) and therefore take part in an authorization computation.'
    kind: stated
    testable: partial
    testable_reason: 'a claim of coverage over every format current in 1999; it is testable format by format through 6.5.1 to 6.5.7, never as a whole.'
    status: active
  - id: "rfc-2693#R-0193"
    object: 'X.509v1 certificate'
    field: 'translation to a name tuple'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.1"
    text: 'The original X.509 certificate is a <name,key> certificate.  It translates directly to a name tuple.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0194"
    object: 'X.509v1 certificate under a root whose leaf names are unique'
    field: 'the name tuple [Kroot, (name <leaf-name>), K1, validity]'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.1"
    text: 'The form [Kroot, (name <leaf-name>), K1, validity] is used if the rules for that particular X.509 hierarchy is that all leaf names are unique, under that root.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0195"
    object: 'X.509v1 certificate under a root whose names are unique only per CA'
    field: 'the name tuple carrying the CA names, generated after chain verification'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.1"
    text: 'If uniqueness of names applies only to individual CAs in the X.509 hierarchy, then one must generate [Kroot, (name CA1 CA2 ... CAk <leaf-name>), K1, validity] after verifying the certificate chain by the rules appropriate to that particular chain.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0196"
    object: 'PGP certificate'
    field: 'a <name,key> certificate, verified by web-of-trust rules'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.2"
    text: 'A PGP certificate is a <name,key> certificate.  It is verified by web-of-trust rules (as specified in the PGP documentation).'
    kind: stated
    testable: partial
    testable_reason: 'the classification is testable, but the verification rules are PGP''s and are not given in this RFC.'
    status: active
  - id: "rfc-2693#R-0197"
    object: 'PGP certificate'
    field: 'the name tuple [Ki, name, K1, validity], Ki being a signer'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.2"
    text: 'Once verified, it yields name tuples of the form [Ki, name, K1, validity] where Ki is a key that signed that PGP (UserID,key) pair.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0198"
    object: 'PGP certificate'
    field: 'one name tuple per signature on the key'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.2"
    text: 'There would be one tuple produced for each signature on the key, K1.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0199"
    object: 'X.509v3 certificate'
    field: 'what it may declare: a name, explicit authorizations in extensions, an implicit (tag (*))'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.3"
    text: 'An X.509v3 certificate may be used to declare a name.  It might also declare explicit authorizations, by way of extensions.  It might also declare an implicit authorization of the form (tag (*)).'
    kind: stated
    testable: partial
    testable_reason: 'which of the three a given certificate declares is fixed by the documentation for its line of certificates (R-0200), not by the certificate.'
    status: active
  - id: "rfc-2693#R-0200"
    object: 'X.509v3 certificate'
    field: 'the tuples it yields: set by the documentation for its line, tied to the root key'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.3"
    text: 'The actual set of tuples it yields depends on the documentation associated with that line of certificates.  That documentation could conceptually be considered associated with the root key of the certificate chain.'
    kind: stated
    testable: partial
    testable_reason: 'testable only against the external documentation for the root in question.'
    status: active
  - id: "rfc-2693#R-0201"
    object: 'X.509v3 certificate chain'
    field: 'validation by chain validation code specific to each root key'
    verb: none
    actor: 'verifier'
    locator: "§6.5.3"
    text: 'In addition, some X.509v3 certificates (such as those used for SET), have defined extra validity tests for certificate chains depending on custom extensions.  As a result, it is likely that X.509v3 chains will have to be validated independently, by chain validation code specific to each root key.'
    kind: stated
    testable: partial
    testable_reason: 'stated as likely, and the extra tests belong to each root (SET is the example given); testable only per root.'
    status: active
  - id: "rfc-2693#R-0202"
    object: 'X.509v3 certificate chain'
    field: 'generation of the tuples by the root-specific code after validation'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.3"
    text: 'After that validation, that root-specific code can then generate the appropriate multiple tuples from the one certificate.'
    kind: stated
    testable: partial
    testable_reason: 'what is appropriate is fixed per root by external documentation (R-0200).'
    status: active
  - id: "rfc-2693#R-0203"
    object: 'X9.57 attribute certificate'
    field: 'translation to one or more 5-tuples with names as Subject'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.4"
    text: 'An X9.57 attribute certificate should yield one or more 5-tuples, with names as Subject.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0204"
    object: 'X9.57 attribute certificate'
    field: 'a fully-qualified name for the Distinguished Name in the Subject'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.4"
    text: 'The code translating the attribute certificate will have to build a fully-qualified name to represent the Distinguished Name in the Subject.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0205"
    object: 'X9.57 attribute certificate that refers to an ID certificate'
    field: 'the key of that ID certificate as the 5-tuple Subject'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.4"
    text: 'For any attribute certificates that refer to an ID certificate explicitly, the Subject of the 5-tuple can be the key in that ID certificate, bypassing the construction of name 4-tuples.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0206"
    object: 'SDSI 1.0 certificate'
    field: 'translation to one 4-tuple'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.5"
    text: 'A SDSI 1.0 certificate maps directly to one 4-tuple.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0207"
    object: 'SPKI certificate'
    field: 'translation to one 4-tuple (name certificate) or one 5-tuple (authorization)'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.6"
    text: 'An SPKI certificate maps directly to one 4- or 5- tuple, depending respectively on whether it is a name certificate or carries an authorization.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0208"
    object: 'SSL certificate'
    field: 'the implicit authorization (tag (ssl))'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.7"
    text: 'An SSL certificate carries a number of authorizations, some implicitly.  The authorization: (tag (ssl)) is implicit.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0209"
    object: 'SSL server certificate'
    field: 'the DNS name parameter, and its encoding as (tag (dns <domain-name>))'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.7"
    text: 'In addition, the server certificate carries a DNS name parameter to be matched against the DNS name of the web page to which the connection is being made.  That might be encoded as: (tag (dns <domain-name>))'
    kind: stated
    testable: partial
    testable_reason: 'the matching of the DNS name is testable, but the encoding is offered as one that might be used, not fixed.'
    status: active
  - id: "rfc-2693#R-0210"
    object: 'SSL certificate'
    field: 'the global cert permission, and its encoding as (tag (us-crypto))'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.7"
    text: 'Meanwhile, there is the "global cert" permission -- the permission for a US-supplied browser to connect using full strength symmetric cryptography even though the server is outside the USA.  This might be encoded as: (tag (us-crypto))'
    kind: stated
    testable: partial
    testable_reason: 'an encoding offered as possible, not fixed, for a permission tied to the US export rules of 1999.'
    status: active
  - id: "rfc-2693#R-0211"
    object: 'ACL entry for an SSL root key'
    field: 'its tag, with (dns (*)) equivalent to (dns) under the rules of intersection, and the added (us-crypto) of a root key the US Commerce Department has empowered'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.5.7"
    text: 'An ACL entry for an SSL root key would have the tag: (tag (* set (ssl) (dns (*)))) which by the rules of intersection is equivalent to: (tag (* set (ssl) (dns))) unless that root key also had the permission from the US Commerce Department to grant us-crypto permission, in which case the root key would have: (tag (* set (ssl) (dns) (us-crypto)))'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0212"
    object: 'SSL CA certificate'
    field: 'carrying (tag (*)), the limits being left to the ACL'
    verb: none
    actor: 'implementation (certificate translator)'
    locator: "§6.5.7"
    text: 'A CA certificate, used for SSL, would then need only to communicate down its certificate chain those permissions allocated in the ACL. Its tag might then translate to: (tag (*))'
    kind: stated
    testable: partial
    testable_reason: 'offered as a possible translation; what makes it safe is testable, that AIntersect with the ACL entry at the head of the chain bounds whatever a CA certificate carrying (tag (*)) passes on.'
    status: active
  - id: "rfc-2693#R-0213"
    object: 'combination of separate permissions (ssl, dns, us-crypto)'
    field: 'the AND lives in the verifier code, not in the certificate'
    verb: none
    actor: 'verifier (application)'
    locator: "§6.5.7"
    text: 'The fact that these three kinds of permission are treated as if ANDed is derived from the logic of the code that interprets the permissions and is not expressed in the certificate.  That decision is embodied in the authorization code executed by the verifying application.'
    kind: stated
    testable: partial
    testable_reason: 'nothing in a certificate can be checked for it, by design; it is testable only as behaviour of a particular verifying application.'
    status: active
  - id: "rfc-2693#R-0214"
    object: 'authorization question'
    field: 'the two forms: is S allowed A, and what is S allowed'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§6.6"
    text: 'Typically, one will reduce a chain of certificates to answer an authorization question in one of two forms: 1.  Is this Subject, S, allowed to do A, under this ACL and with this set of certificates? 2.  What is Subject S allowed to do, under this ACL and with this set of certificates?'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0215"
    object: 'Certificate Result Certificate'
    field: 'issuance of the answer to the second question as a new certificate by the computing entity'
    verb: none
    actor: 'CRC issuer (reducing service)'
    locator: "§6.6"
    text: 'The answer to the second computation can be put into a new certificate issued by the entity doing the computation.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0216"
    object: 'Certificate Result Certificate'
    field: 'equivalence to the underlying certificates and online test results'
    verb: none
    actor: 'CRC issuer (reducing service)'
    locator: "§6.6"
    text: 'That one certificate corresponds to the semantics of the underlying certificates and online test results.  We call it a Certificate Result Certificate.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0217"
    object: 'key replacement'
    field: 'limited key lifetimes, theft and cryptanalysis, and routine replacement against unnoticed theft'
    verb: none
    actor: 'keyholder'
    locator: "§7"
    text: 'Cryptographic keys have limited lifetimes.  Keys can be stolen.  Keys might also be discovered through cryptanalysis.  If the theft is noticed, then the key can be replaced as one would replace a credit card.  More likely, the theft will not be noticed.  To cover this case, keys are replaced routinely.'
    kind: stated
    testable: no
    testable_reason: 'a key-management practice with no stated period; nothing in the certificate structure enforces it, though limited certificate lifetimes (R-0219) are what make it workable.'
    status: active
  - id: "rfc-2693#R-0218"
    object: 'key replacement'
    field: 'announcement to those who would use the new key, and smooth rollover'
    verb: none
    actor: 'keyholder'
    locator: "§7"
    text: 'The replacement of a key needs to be announced to those who would use the new key.  It also needs to be accomplished smoothly, with a minimum of hassle.'
    kind: stated
    testable: no
    testable_reason: 'desiderata; SPKI meets them indirectly, by empowering the new key through new certificates rather than by announcing anything (R-0219, R-0220).'
    status: active
  - id: "rfc-2693#R-0219"
    object: 'key revocation'
    field: 'limited certificate lifetimes instead of a mechanism for declaring keys bad'
    verb: none
    actor: 'issuer and verifier'
    locator: "§7"
    text: 'Rather than define a mechanism for declaring a key to be bad or replaced, SPKI defines a mechanism for giving certificates limited lifetimes so that they can be replaced.'
    kind: stated
    testable: partial
    testable_reason: 'testable only as an absence: SPKI defines no statement that declares a key bad; the lifetime mechanism itself is tested through validity dates and online tests (R-0067 to R-0101).'
    status: active
  - id: "rfc-2693#R-0220"
    object: 'key replacement'
    field: 'stop empowering the old key and empower another'
    verb: none
    actor: 'issuer'
    locator: "§7"
    text: 'That is, under SPKI one does not declare a key to be bad but rather stops empowering it and instead empowers some other key.'
    kind: stated
    testable: partial
    testable_reason: 'testable in a system (once its certificates lapse, the old key reduces to nothing), but it describes issuer practice, not a check a verifier makes.'
    status: active
  - id: "rfc-2693#R-0221"
    object: 'certificate lifetime'
    field: 'the two ways it is limited: at issuance, or through an online test'
    verb: none
    actor: 'issuer'
    locator: "§7"
    text: 'This limitation of a certificate''s lifetime might be by limited lifetime at time of issuance or might be via the lifetime acquired through an on-line test (CRL, revalidation or one-time).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0222"
    object: 'key lifetime'
    field: 'key lifetime control reduced to certificate lifetime control'
    verb: none
    actor: 'issuer and verifier'
    locator: "§7"
    text: 'Therefore, all key lifetime control becomes certificate lifetime control.'
    kind: stated
    testable: partial
    testable_reason: 'a consequence of R-0219 to R-0221 rather than a further rule; it is tested through them.'
    status: active
  - id: "rfc-2693#R-0223"
    object: 'name assigned by a <name,key> certificate'
    field: 'names assigned by a <name,key> issuer have meaning only when fully qualified'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§7.3"
    text: 'Instead of inescapable names or single-root naming authorities, we have names assigned by some entity that issues a <name,key> certificate.  As noted in sections 2.8 and 2.9, above, such names have no meaning by themselves.  They must be fully qualified to have meaning.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0224"
    object: 'fully qualified name'
    field: 'the name is the whole construct, key included, not its final string'
    verb: none
    actor: 'verifier (name reducer)'
    locator: "§7.3"
    text: 'Therefore, in the construct: (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) jim) the name is not "jim" but rather "(name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) jim)"'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0225"
    object: 'fully qualified name'
    field: 'the name inherits the lifetime of the key it contains'
    verb: none
    actor: 'issuer and verifier'
    locator: "§7.3"
    text: 'This name includes a public key (through its hash, in the example above).  That key has a lifetime like any other key, so this name has not achieved the kind of permanence (free from key lifetimes) that an inescapable name has.'
    kind: stated
    testable: no
    testable_reason: 'a property of names in general, stated to explain why key lifetimes matter (7.4); it constrains no artefact.'
    status: active
  - id: "rfc-2693#R-0226"
    object: 'self-issued name certificate'
    field: 'a keyholder naming itself for key management, with no third-party naming authority'
    verb: none
    actor: 'keyholder'
    locator: "§7.3"
    text: 'This name could easily be issued by the named keyholder, for the purpose of key management only.  In that case, there is no concern about access control being subverted by some third-party naming authority.'
    kind: stated
    testable: partial
    testable_reason: 'a verifier can be checked for accepting a name certificate whose issuer key is the keyholder''s own root; the security claim, no third-party subversion, is an argument, not a test.'
    status: active
  - id: "rfc-2693#R-0227"
    object: 'naming root key lifetime'
    field: 'every name hangs off a key, so the key lifetime must exceed that of any authorization granted through it'
    verb: none
    actor: 'keyholder'
    locator: "§7.4"
    text: 'By the logic above, any name will hang off some public key.  The job is then to increase the lifetime of that public key.  Once a key lifetime exceeds the expected lifetime of any authorization granted through it, then a succession of new, long-lifetime keys can cover a keyholder forever.'
    kind: stated
    testable: no
    testable_reason: 'expected lifetimes are planning figures, not values carried in any structure.'
    status: active
  - id: "rfc-2693#R-0228"
    object: 'long-lived key'
    field: 'strength against cryptanalysis and against theft'
    verb: none
    actor: 'keyholder'
    locator: "§7.4"
    text: 'For a key to have a long lifetime, it needs to be strong against cryptanalytic attack and against theft.'
    kind: stated
    testable: no
    testable_reason: 'no strength level is named, and theft resistance is a property of how the key is held.'
    status: active
  - id: "rfc-2693#R-0229"
    object: 'long-lived key'
    field: 'use only on a trusted machine running trusted software'
    verb: none
    actor: 'keyholder'
    locator: "§7.4"
    text: 'It should be used only on a trusted machine, running trusted software.'
    kind: stated
    testable: no
    testable_reason: 'operational practice of the keyholder, invisible to any verifier.'
    status: active
  - id: "rfc-2693#R-0230"
    object: 'long-lived key'
    field: 'no use on an on-line machine'
    verb: none
    actor: 'keyholder'
    locator: "§7.4"
    text: 'It should not be used on an on-line machine.'
    kind: stated
    testable: no
    testable_reason: 'operational practice of the keyholder, invisible to any verifier (as R-0229).'
    status: active
  - id: "rfc-2693#R-0231"
    object: 'long-lived key'
    field: 'rare use, to limit exposure'
    verb: none
    actor: 'keyholder'
    locator: "§7.4"
    text: 'It should be used very rarely, so that the attacker has few opportunities to find the key in the clear where it can be stolen.'
    kind: stated
    testable: no
    testable_reason: 'operational practice of the keyholder (as R-0229), and no frequency is named.'
    status: active
  - id: "rfc-2693#R-0232"
    object: 'naming root key'
    field: 'one highly protected naming root key per individual, or several to frustrate the building of dossiers'
    verb: none
    actor: 'keyholder'
    locator: "§7.5"
    text: 'In the limit, one can have one highly protected naming root key for each individual.  One might have more than one such key per individual, in order to frustrate attempts to build dossiers, but let us assume only one key for the immediate discussion.'
    kind: stated
    testable: no
    testable_reason: 'a key-management model with a privacy option; nothing in a certificate or tuple records how many naming root keys one person holds, so neither choice can be checked. With 3.2 (R-0050) it is one of the two places the RFC weighs the building of dossiers against its own design.'
    status: active
  - id: "rfc-2693#R-0233"
    object: 'naming root key with a single name'
    field: 'dropping the name and authorizing the key directly'
    verb: none
    actor: 'issuer'
    locator: "§7.5"
    text: 'If there is only one name descending from such a key, then one can dispense with the name.  Authorizations can be assigned to the key itself, in raw SPKI style, rather than to some name defined under that key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0234"
    object: 'non-delegable authorization granted to a name versus to a key'
    field: 'the holder of the name can still delegate through <name,key> certificates; the holder of the key cannot'
    verb: none
    actor: 'issuer and verifier'
    locator: "§7.5"
    text: 'However, there is one significant difference, under the SPKI structure.  If one delegates some authorization to (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) carl) and a different authorization to (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) directly, both without granting the permission to delegate, that key can delegate at will through <name,key> certificates in the former case and not delegate at all in the latter case.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0235"
    object: 'key management through a naming root'
    field: 'delegation from a long-lived key to a short-lived one through a SDSI name'
    verb: none
    actor: 'keyholder'
    locator: "§7.5"
    text: 'In the case of key management, we desire the ability to delegate from a long lived, rarely used key to a shorter lived, often used key -- so in this case, the former mechanism (through a SDSI name) gives more freedom.'
    kind: stated
    testable: no
    testable_reason: 'a recommendation of one mechanism over another for key management; its testable basis is R-0234.'
    status: active
  - id: "rfc-2693#R-0236"
    object: 'key revocation service'
    field: 'power to revoke a key, not to generate one'
    verb: none
    actor: 'key revocation service'
    locator: "§7.6"
    text: 'That authority would not have the power to generate a new key for the user, only to revoke a current one.'
    kind: stated
    testable: partial
    testable_reason: 'the service acts by supplying the online tests (CRL, revalidation or one-time) of certificates that name it as their validity-confirmation issuer (R-0072); that it has no power to generate keys is a property of the deployment, not of any structure.'
    status: active
  - id: "rfc-2693#R-0237"
    object: 'loss of a master key'
    field: 'on loss of a master key, reissue of every authorization through the new master key'
    verb: none
    actor: 'issuer'
    locator: "§7.6"
    text: 'If, in the worst case, a user loses his master key, then the same process that occurs today with lost wallets would apply.  All issuers of authorizations through that master key would need to issue new authorizations through the new master key'
    kind: stated
    testable: partial
    testable_reason: 'an organisational procedure across many issuers, so no single artefact shows that every issuer acted; a system test can check the consequence, that once the master key is replaced an authorization reaches the new key only through a certificate issued through it, since SPKI carries nothing over from the lost key but stops empowering it and empowers another (R-0219, R-0220). R-0238 is the matching check for a stolen key.'
    status: active
  - id: "rfc-2693#R-0238"
    object: 'theft of a master key'
    field: 'cancellation of every old authorization through it'
    verb: none
    actor: 'issuer'
    locator: "§7.6"
    text: 'if the old master key had been stolen, cancel all old authorizations through that key.'
    kind: stated
    testable: partial
    testable_reason: 'cancellation is possible only through the online tests the old certificates name (R-0072, R-0077) or by letting them lapse, since SPKI defines no key revocation (R-0219); a system test can check that the old authorizations stop reducing, but not that every issuer acted.'
    status: active
  - id: "rfc-2693#R-0239"
    object: 'threshold subject'
    field: 'redundancy and replacement, through threshold subjects, for long-lived root keys, especially in ACL entries'
    verb: none
    actor: 'ACL owner'
    locator: "§7.7"
    text: 'One can take extraordinary measures to protect root keys and thus increase the lifetimes of those keys.  The study of computer fault-tolerance teaches us that truly long lifetimes can be achieved only by redundancy and replacement.  Both can be achieved by the use of threshold subjects [section 6.3.3], especially in ACL entries.'
    kind: stated
    testable: no
    testable_reason: 'design guidance; it recommends where to use threshold subjects and constrains no single artefact.'
    status: active
  - id: "rfc-2693#R-0240"
    object: 'threshold subject'
    field: 'redundancy through a threshold subject, whose subordinate keys need not share an algorithm'
    verb: none
    actor: 'verifier (tuple reducer)'
    locator: "§7.7"
    text: 'If we use a threshold subject in place of a single key subject, in an ACL (or a certificate), then we achieve redundancy immediately.  This can be redundancy not only of keys but also of algorithms.  That is, the keys in a threshold subject do not need to have the same algorithm.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2693#R-0241"
    object: 'component of a threshold subject'
    field: 'replacement of a failed or compromised component'
    verb: none
    actor: 'ACL owner'
    locator: "§7.7"
    text: 'Truly long lifetimes come from replacement, not just redundancy.  As soon as a component fails (or a key is assumed compromised), it must be replaced.'
    kind: stated
    testable: no
    testable_reason: 'failure and assumed compromise are judgements made outside the structures, and as soon as sets no time bound.'
    status: active
  - id: "rfc-2693#R-0242"
    object: 'ACL'
    field: 'access control over the ACL itself'
    verb: none
    actor: 'ACL owner'
    locator: "§7.7"
    text: 'An ACL needs to be access-controlled itself.'
    kind: stated
    testable: partial
    testable_reason: 'the source illustrates it with an (acl-edit) authorization held by a stricter threshold subject but fixes no mechanism, so a test can check only a deployment that adopts one.'
    status: active
  - id: "rfc-2693#R-0243"
    object: 'threshold subject holding an (acl-edit) ACL entry'
    field: 'root keys electing new members and retiring old ones'
    verb: none
    actor: 'ACL owner'
    locator: "§7.7"
    text: 'This use of threshold subject would allow the set of root keys to elect new members to that set and retire old members.  In this manner, replacement is achieved alongside redundancy and the proper choice of K and N should allow threshold subject key lifetimes approaching infinity.'
    kind: stated
    testable: partial
    testable_reason: 'refers to the 7.7 example, a 3-of-7 subject on normal entries and a 5-of-7 subject on the (acl-edit) entry; no election mechanism is specified beyond that example, and no rule is given for choosing K and N.'
    status: active
  - id: "rfc-2693#R-0244"
    object: 'certificate classes'
    field: 'three kinds of information (key, name, authorization), three pairings, six directed mappings'
    verb: none
    actor: 'issuer and verifier'
    locator: "§8"
    text: 'There are three classes of information that can be bound together by public key certificates: key, name and authorization.  There are therefore three general kinds of certificate, depending on what pair of items the certificate ties together.  If one considers the direction of mapping between items, there are six classes: name->key, key->name, authorization->name, name->authorization, authorization->key, key->authorization.'
    kind: stated
    testable: no
    testable_reason: 'a taxonomy that frames the comparison in the rest of section 8. The tuples of section 6 carry three of the six directed classes: name->key as the name 4-tuple, and authorization->name and authorization->key as the 5-tuple (R-0107). key->name appears only as the logging mapping of 3.3 (R-0053), outside the authorization computation, and the RFC gives the other two no use.'
    status: active
  - id: "rfc-2693#R-0245"
    object: 'access control through certificates'
    field: 'the working-group conclusion that access control is the main use, and the two constructs for it'
    verb: none
    actor: 'issuer and verifier'
    locator: "§8"
    text: 'The SPKI working group concluded that the most important use for certificates was access control.  Given the various kinds of mapping possible, there are at least two ways to implement access control. One can use a straight authorization certificate: (authorization->key) or one can use an attribute certificate and an ID certificate: (authorization->name) + (name->key)'
    kind: stated
    testable: no
    testable_reason: 'a conclusion and an enumeration; the two constructs are compared in R-0246 to R-0250 (the former is the direct authorization certificate, the latter the attribute plus ID pair). Both reduce under section 6: the former by the 5-tuple rule (R-0136), the latter only after name reduction (R-0116, R-0177) has joined its two certificates as R-0046 requires.'
    status: active
  - id: "rfc-2693#R-0246"
    object: 'direct authorization certificate versus attribute plus ID certificate'
    field: 'the direct construct (authorization->key) is the more secure'
    verb: none
    actor: 'issuer and verifier'
    locator: "§8"
    text: 'There are at least two ways in which the former is more secure than the latter.'
    kind: stated
    testable: no
    testable_reason: 'a comparative security judgement; its two grounds are R-0247, and R-0248 with R-0249.'
    status: active
  - id: "rfc-2693#R-0247"
    object: 'attribute certificate plus ID certificate'
    field: 'two issuers to trust instead of one'
    verb: none
    actor: 'verifier'
    locator: "§8"
    text: 'Each certificate has an issuer.  If that issuer is subverted, then the attacker can gain access.  In the former case, there is only one issuer to trust.  In the latter case, there are two.'
    kind: stated
    testable: no
    testable_reason: 'a statement about attack surface, not behaviour.'
    status: active
  - id: "rfc-2693#R-0248"
    object: 'attribute certificate plus ID certificate'
    field: 'linkage by name, forcing one issuer to use a foreign name space'
    verb: none
    actor: 'issuer'
    locator: "§8"
    text: 'In the second case, linkage between the certificates is by name. If the name space of the issuer of the ID certificate is different from the name space of the issuer of the attribute certificate, then one of the two issuers must use a foreign name space.'
    kind: stated
    testable: partial
    testable_reason: 'whether the two certificates share a name space is checkable from their issuers (R-0033); that one issuer must then use a foreign name space is an argument.'
    status: active
  - id: "rfc-2693#R-0249"
    object: 'name chosen from a foreign name space'
    field: 'an error-prone mapping, open to accident and to attack'
    verb: none
    actor: 'issuer'
    locator: "§8"
    text: 'The process of choosing the appropriate name from a foreign name space is more complex than string matching and might even involve a human guess.  It is subject to mistakes. Such a mistake can be made by accident or be guided by an attacker.'
    kind: stated
    testable: no
    testable_reason: 'a warning about a human process; no implementation can be tested against it.'
    status: active
  - id: "rfc-2693#R-0250"
    object: 'attribute certificate plus ID certificate'
    field: 'not forbidden; both weaknesses cancelled when one issuer issues both'
    verb: none
    actor: 'issuer and verifier'
    locator: "§8"
    text: 'This is not to say that one must never use the second construct.  If the two certificates come from the same issuer, and therefore with the same name space, then both of the security differentiators above are canceled.'
    kind: stated
    testable: partial
    testable_reason: 'that the construct is allowed is testable (a verifier must still reduce it, through the name reduction of 6.4); that same-issuer use cancels both weaknesses is a security argument.'
    status: active
  - id: "rfc-2693#R-0251"
    object: 'SSL certificate'
    field: 'its other key usage attributes: encoded as tag fields too, their encodings deferred to an examples document'
    verb: none
    actor: 'implementation (certificate translator)'
