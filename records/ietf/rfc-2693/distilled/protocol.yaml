record: rfc-2693
reviewed_by: ""
extracted: "2026-10-11"
source:
  file: ".cache/rfc-2693.txt"
  sha256: "6822d668195c3d9b391f0c4f2b023341ba0e5a72e59d63c366a520de42c99098"
  lines: "2411"
  bcp14_keywords: "0"
applicability: >-
  PARTIAL. RFC 2693 defines no wire protocol: no transport, no framing, no
  encoding for anything exchanged, and no error signalling. Its procedural
  content is the section 6 tuple-reduction processing plan, which the source
  itself calls an example; the section 5 validity conditions, of which only the
  one-time revalidation is described as a request and a response; and the
  section 7 key-management patterns. The document contains no BCP 14 keyword,
  so every guard here rests on the source's own lowercase wording, quoted.
  Anything the source does not literally say is marked inferred. protocol.md
  carries the prose, one Mermaid diagram per flow and per algorithm, and the
  list of what the document does not define.
conventions:
  quoting: >-
    Each item under a key ending in quotes is one contiguous span of
    .cache/rfc-2693.txt, verbatim except that every run of whitespace (a line
    break, the indentation of a continuation line, the RFC double space after a
    full stop) is collapsed to one space. A word the source hyphenates across a
    line break therefore appears as the hyphen, a space and the rest of the
    word. No span crosses a page footer and header: text on the two sides of a
    page break is two items. Non-adjacent text is never joined and nothing is
    elided.
  basis: >-
    stated means literally in the source at the locator given. inferred means
    not literally stated: it is the reading an implementer has to adopt to make
    the stated text executable, flagged so that a test can be written against
    either reading.
  on_error_basis: >-
    stated, inferred or unspecified. unspecified means the source names the
    check, or implies a failure, and says nothing about what happens next.
  status: >-
    example-processing-plan means section 6 offers the processing plan as an
    example that may be followed. permitted-with-conditions means SPKI permits
    or demands the mechanism under conditions the source states.
    defined-by-spki-not-here means the source says SPKI defines the mechanism
    but gives no format and cites no document that does. ruled-out means SPKI
    has excluded it. described-pattern means a way of using the mechanisms that
    the source argues for without specifying it as a protocol.
  kind: >-
    exchange means two or more parties pass messages. issuance means one party
    signs an instrument that others consume later. Computations local to one
    role are listed under algorithms, not flows.
  message_names: >-
    Message names are messages.yaml identifiers, reconciled in the
    cross-check pass (2026-10-12), and are listed in messages_referenced.
    Names in message_notes marked not-in-source have no counterpart in RFC
    2693; messages.yaml carries them as placeholders with normative_status
    not-in-source.
framing:
  - id: example-not-mandate
    text: "The tuple-reduction plan is an example; its main purpose is to fix what a certificate means."
    locator: "§6"
    basis: stated
    quotes:
      - |-
        The processing of certificates and related objects to yield an authorization result is the province of the developer of the application or system. The processing plan presented here is an example that may be followed, but its primary purpose is to clarify the semantics of an SPKI certificate and the way it and various other kinds of certificate might be used to yield an authorization result.
  - id: theory-only
    text: "The document gives theory only and leaves the structures to other documents, which it does not cite."
    locator: "Abstract"
    basis: stated
    quotes:
      - |-
        This document gives the theory behind SPKI certificates and ACLs without going into technical detail about those structures or their uses.
  - id: acl-never-communicated
    text: "ACL entries never leave the verifier, so they need no standard form."
    locator: "§3.4"
    basis: stated
    quotes:
      - |-
        In SPKI, an ACL entry is free to be implemented in any way the developer chooses, since it is never communicated and therefore does not need to be standardized. However, a sample implementation is documented, as a certificate body minus the issuer field.
  - id: determinism
    text: "Determinism is the property every validity mechanism is judged against."
    locator: "§5.1"
    basis: stated
    quotes:
      - |-
        SPKI has ruled out the use of wandering anti-matter CRLs for its certificates. Every authorization computation is deterministic, under SPKI rules.
  - id: any-format
    text: "The computation is meant to accept certificates of any format, translated first into tuples."
    locator: "§3, §6.5"
    basis: stated
    quotes:
      - |-
        Therefore, we developed an authorization computation process that can use certificates in any format.
      - |-
        Any certificate currently defined, as well as ACL entries and possibly other instruments, can be translated to 5-tuples (or name tuples) and therefore take part in an authorization computation.
roles:
  - name: issuer
    kind: party
    also_called:
      - delegator
    description: >-
      Signs a certificate and is the source of the empowerment the certificate
      carries to its Subject. When it passes on authority it was itself granted
      with delegation TRUE it acts as a delegator. It must name the issuer of
      validity confirmations for its certificate.
    locators:
      - "§1.1"
      - "§4.2"
      - "§5"
    quotes:
      - |-
        ISSUER: the signer of a certificate and the source of empowerment that the certificate is communicating to the Subject.
      - |-
        We decided that a delegator is free to create a new key pair, also controlled by it, and delegate the rights to that key to exercise the delegated permission.
      - |-
        However, in SPKI, the certificate issuer must specify the issuer of validity confirmations.
    basis: stated
  - name: keyholder
    kind: party
    also_called:
      - subject
      - delegatee
    description: >-
      Owns and controls a private key. The Subject of a certificate or ACL entry
      is a thing (a key, a name, an object hash or a threshold set), not a
      party; the party it empowers is the keyholder of the key the Subject is or
      resolves to. A delegatee is the keyholder at the receiving end of a
      delegation.
    locators:
      - "§1.1"
      - "§6.3.4"
    quotes:
      - |-
        KEYHOLDER: the person or other entity that owns and controls a given private key.
      - |-
        SUBJECT: the thing empowered by a certificate or ACL entry. This can be in the form of a key, a name (with the understanding that the name is mapped by certificate to some key or other object), a hash of some object, or a set of keys arranged in a threshold function.
      - |-
        yielding a sequence that can be used by the delegatee to prove access permission.
    basis: stated
  - name: prover
    kind: party
    description: >-
      Finds the correct list of reductions and gives the verifier the
      certificates in the order the reductions are to be performed. The source
      never says who the prover is. It is normally the keyholder seeking access
      (inferred from section 6.3.4, where the delegatee uses its sequence to
      prove access permission).
    locators:
      - "§6.3.4"
      - "§6.4"
    quotes:
      - |-
        All reduction operations are in the order provided by the prover. That simplifies the job of the verifier, but leaves the job of finding the correct list of reductions to the prover.
    basis: stated
  - name: verifier
    kind: party
    description: >-
      Holds the ACL, verifies certificates and on-line test results, performs
      the tuple reductions in the order the prover gives, and decides. The
      source places the risk of accepting a certificate on the verifier.
    locators:
      - "§5.2"
      - "§5.7.2"
      - "§6.3.4"
      - "§6.4"
      - "§6.5.7"
    quotes:
      - |-
        If the prover is providing certificates in order, then the verifier need only do as it is told.
      - |-
        However, in the commercial space, it is the verifier and not the issuer who is taking a risk by accepting a certificate.
      - |-
        The three separate tests in the verifying code (e.g., the browser) would then involve separate 5-tuple reductions from separate root key ACL entries.
    basis: stated
  - name: acl-owner
    kind: party
    also_called:
      - resource owner
      - Self
    description: >-
      Owns the controlled resource and is the implicit issuer of every ACL
      entry. ACL entries are unsigned and held locally by the verifier; in a
      5-tuple their issuer is the reserved word Self. One ACL per resource
      owner is the expected case, if not one per resource. Usually co-located
      with the verifier, but the source keeps the two ideas apart.
    locators:
      - "§1.1"
      - "§3.4"
      - "§6.1"
    quotes:
      - |-
        That is, a certificate communicates power from its issuer to its subject, but the ACL is the source of that power (since it theoretically has the owner of the resource it controls as its implicit issuer).
      - |-
        An ACL entry has potentially the same content as a certificate body, but has no Issuer (and is not signed). There is most likely one ACL for each resource owner, if not for each controlled resource.
      - |-
        Issuer: a public key (or its hash), or the reserved word "Self".
    basis: stated
  - name: name-definer
    kind: party
    also_called:
      - name-space owner
    description: >-
      Issues name certificates defining local names in the name space its
      public key identifies. A local name inside a certificate is in the
      issuer's name space. Defines a group by issuing several certificates for
      one name.
    locators:
      - "§2.6.1"
      - "§2.8"
      - "§2.10"
      - "§6.2"
    quotes:
      - |-
        It is SDSI 1.0 convention, preserved in SPKI, that if a (local) SDSI name occurs within a certificate, then the public key of the issuer is the identifier of the name space in which that name is defined.
      - |-
        Issuer: a public key (or its hash). This identifies the entity defining this name in its private name space.
    basis: stated
  - name: validity-confirmation-issuer
    kind: party
    also_called:
      - CRL issuer
      - revalidation issuer
      - one-time revalidation issuer
    description: >-
      Issues the on-line test results that refine a certificate's validity:
      timed CRLs, timed revalidations and one-time revalidations. Need not be
      the certificate issuer, but the certificate issuer must name it; for a
      timed CRL the certificate lists the key, or its hash, that signs the CRL.
    locators:
      - "§5"
      - "§5.2"
      - "§5.3"
      - "§5.5"
    quotes:
      - |-
        When validity confirmation is provided by some online test, then the issuer of those refinements need not be the issuer of the original certificate. In many cases, the business or security model for the two issuers is different. However, in SPKI, the certificate issuer must specify the issuer of validity confirmations.
    basis: stated
  - name: fetch-location
    kind: party
    description: >-
      A place a certificate names from which a timed CRL, or a replacement
      short-lived certificate, might be fetched. The role name is ours; the
      source speaks only of locations.
    locators:
      - "§5.2"
      - "§5.6"
    quotes:
      - |-
        The certificate must list the key (or its hash) that will sign the CRL and may give one or more locations where that CRL might be fetched.
      - |-
        If one wants to issue short-lived certificates, SPKI defines a kind of online test statement to tell the user of the certificate where a replacement short-lived certificate might be fetched.
    basis: inferred
  - name: requester
    kind: party
    description: >-
      Whoever puts a question to an on-line service: the applicant for a
      one-time revalidation (the source says only that one applies), the user
      of a certificate fetching its short-lived replacement, and the client of
      a Certificate Result Certificate computation. The source names none of
      these parties; the role is ours.
    locators:
      - "§5.5"
      - "§5.6"
      - "§6.6"
    quotes:
      - |-
        One applies for this on-line, one-time revalidation by submitting a request containing a nonce.
    basis: inferred
  - name: crc-issuer
    kind: party
    also_called:
      - Certificate Result Certificate service
    description: >-
      Performs a reduction and puts the answer to the question of what Subject
      S is allowed to do into a new certificate that it signs.
    locators:
      - "§6.6"
      - "§6.4.1"
      - "§6.3.2"
    quotes:
      - |-
        The answer to the second computation can be put into a new certificate issued by the entity doing the computation. That one certificate corresponds to the semantics of the underlying certificates and online test results. We call it a Certificate Result Certificate.
      - |-
        This might be used by a service that produces Certificate Result Certificates [see 6.7].
    basis: stated
  - name: key-revocation-service
    kind: party
    description: >-
      An on-line entity a keyholder hires to supply the on-line validity test
      for the certificate empowering its more temporary key, and to revoke that
      key on a report of loss. It cannot generate keys.
    locators:
      - "§7.6"
    quotes:
      - |-
        However, until then -- and maybe even after then -- the user might want to hire some service to perform this function. That service could run a 24x7 manned desk, to receive phone calls reporting loss of a key. That authority would not have the power to generate a new key for the user, only to revoke a current one.
    basis: stated
  - name: threshold-subordinate
    kind: party
    description: >-
      The keyholder of one of the N subordinate subjects of a K-of-N threshold
      subject. K of them must agree, by delegating their shares to the same
      object or key, for the power to pass.
    locators:
      - "§1.1"
      - "§6.3.3"
      - "§7.7"
    quotes:
      - |-
        K of those subordinate Subjects must agree (by delegating their shares along to the same object or key) for that power to be passed along.
    basis: stated
  - name: attribute-certificate-issuer
    kind: party
    description: >-
      Issues an attribute certificate binding an authorization to a name: the
      authority on the authorization in the authorization, name, key path.
    locators:
      - "§3.1"
    quotes:
      - |-
        Presumably the two certificates involved came from different issuers, one an authority on the authorization and the other an authority on names.
    basis: stated
  - name: id-certificate-issuer
    kind: party
    description: >-
      Issues an ID (name, key) certificate: the authority on names in the
      authorization, name, key path.
    locators:
      - "§3.1"
      - "§8"
    quotes:
      - |-
        Presumably the two certificates involved came from different issuers, one an authority on the authorization and the other an authority on names.
    basis: stated
  - name: translator
    kind: local-component
    description: >-
      The trusted software, inside the verifier or a CRC service, that turns a
      verified certificate or an ACL entry into 5-tuples or name 4-tuples. For
      X.509v3 it is chain validation code specific to the root key.
    locators:
      - "§6.1"
      - "§6.5.3"
      - "§6.5.4"
    quotes:
      - |-
        It is produced from certificates or other credentials via trusted software.
      - |-
        After that validation, that root-specific code can then generate the appropriate multiple tuples from the one certificate.
    basis: stated
  - name: application
    kind: local-component
    description: >-
      Gives authorization strings their meaning and decides how separate
      permissions combine; the reduction code knows only the AIntersect rules.
      Where it needs several permissions it runs separate reductions and ANDs
      the results in its own code.
    locators:
      - "§6.3.1"
      - "§6.5.7"
    quotes:
      - |-
        An authorization is a list of strings or sub-lists, of meaning to and probably defined by the application that will use this authorization for access control.
      - |-
        The fact that these three kinds of permission are treated as if ANDed is derived from the logic of the code that interprets the permissions and is not expressed in the certificate. That decision is embodied in the authorization code executed by the verifying application.
    basis: stated
  - name: adversary
    kind: threat
    description: >-
      Tampers with the network to stop CRL delivery, subverts an issuer, or
      guides a mistake in matching names across name spaces.
    locators:
      - "§5.1"
      - "§3.1"
      - "§8"
    quotes:
      - |-
        That is, an adversary can prevent revocation of a given certificate by preventing the delivery of new CRLs. This does not require cryptographic level effort, merely network tampering.
      - |-
        However, if either of these issuers were subverted, then an attacker could obtain an authorization improperly.
    basis: stated
  - name: naming-authority
    kind: design-option
    description: >-
      A single global body issuing names to keyholders strictly for key
      management. Rejected because it could mint keys and certificates as
      anyone. Appears only under design_options.
    locators:
      - "§7.2"
    quotes:
      - |-
        One could conceivably have a governmental body or other entity that would issue names voluntarily to a keyholder, strictly for the purpose of key management.
    basis: stated
