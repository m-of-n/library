message_notes:
  - name: access-request
    in_source: "no"
    note: "not-in-source. The source says only that an application must decide whether the remote keyholder is permitted some access (§3) and that a keyholder can sign challenges or requests (§4.1.1). No request, challenge or proof-of-possession exchange is defined."
  - name: access-decision
    in_source: "no"
    note: "not-in-source. No grant, refusal or error message exists in the document."
  - name: acl-edit-request
    in_source: "no"
    note: "not-in-source. §7.7 describes the (acl-edit) authorization and its threshold subject, not how an edit is submitted or applied."
  - name: authorization-question
    in_source: "partly"
    note: "The two question forms of §6.6. The source does not say the question is sent to anyone; sending it to a CRC service is inferred."
  - name: key-loss-report
    in_source: "partly"
    note: "Out of band: phone calls to a 24x7 manned desk (§7.6). No content is given."
  - name: certificate-sequence
    in_source: "yes"
    note: "The ordered certificates the prover supplies (§6.3.4, §6.4). No container format is defined."
  - name: online-test-specification
    in_source: "yes"
    note: "The validity condition by which a certificate names its on-line test, the key (or hash) that signs the confirmations, and optional fetch locations (§5, §5.2); messages.yaml fields kind, issuer, locations."
  - name: short-lived-certificate
    in_source: "yes"
    note: "§5.6 short-lived certificate. The 'kind of online test statement' that tells its user where a replacement might be fetched is its online-test-specification of the kind §5 does not count (messages.yaml short-lived-certificate.replacement_location; source_defects online-test-kinds-count). No format given."
  - name: one-time-revalidation-request
    in_source: "yes"
    note: "§5.5 'a request containing a nonce'. No other content given."
  - name: anti-matter-crl
    in_source: "yes"
    note: "The wandering anti-matter CRL of §5.1, which SPKI rules out: a list of revoked certificate identifiers plus a sequence number (messages.yaml fields revoked_certificates, sequence_number). Not the bare name crl, which messages.yaml and state-machine.yaml use as an alias of timed-crl."
  - name: '5-tuple'
    in_source: "yes"
    note: "Intermediate form held in trusted memory and never transmitted (§6.1); appears in flows only as the content of a local step."
  - name: name-4-tuple
    in_source: "yes"
    note: "Name 4-tuple (§6.2); intermediate form, never transmitted."
flows:
  - name: authorization-decision
    title: "Authorization decision: the prover presents ordered certificates and the verifier reduces them from its ACL"
    locator: "§3, §6, §6.3.4, §6.6, §4.1.4, §6.5.7"
    kind: exchange
    status: example-processing-plan
    participants:
      - keyholder
      - prover
      - verifier
      - validity-confirmation-issuer
      - translator
      - application
    summary: >-
      The end-to-end use of everything else in this file. A keyholder wants
      some access; the prover (normally the same keyholder) supplies the
      certificates in reduction order; the verifier verifies them, folds in
      on-line test results, translates everything into tuples, resolves names,
      reduces 5-tuples left to right from one of its own ACL entries, and
      answers whether this Subject may do this under this ACL. Only the three
      processing stages and the prover's ordering duty are in the source. The
      request, the proof that the requester holds the subject key, the final
      comparison and the reply are not, and are marked inferred.
    preconditions:
      - id: acl-present
        text: "The verifier holds an ACL; each entry is unsigned, has the resource owner as implicit issuer and the content of a certificate body."
        basis: stated
        locator: "§1.1"
        quotes:
          - |-
            ACL: an Access Control List: a list of entries that anchors a certificate chain.
          - |-
            An ACL entry has potentially the same content as a certificate body, but has no Issuer (and is not signed).
      - id: three-input-kinds
        text: "Inputs are <name,key> certificates, <authorization,name> attribute certificates or ACL entries, and <authorization,key> authorization certificates or ACL entries."
        basis: stated
        locator: "§6"
        quotes:
          - |-
            There are three kinds of entity that might be input to the computation that yields an authorization result:
          - |-
            <authorization,key> (as an authorization certificate or ACL entry)
    steps:
      - n: 1
        from: keyholder
        to: verifier
        message: access-request
        action: "The remote keyholder asks for some access. To be the Subject it has to speak with the subject key, that is, sign the request or a challenge."
        basis: inferred
        locator: "§3, §1.1, §4.1.1"
        quotes:
          - |-
            However, what an application needs to do, when given a public key certificate or a set of them, is answer the question of whether the remote keyholder is permitted some access.
          - |-
            SPEAKING: A Principal is said to "speak" by means of a digital signature.
          - |-
            signing challenges or requests for the intended delegate.
        on_error: "unspecified in this document. The source defines no request, no challenge and no check that the requester holds the private key of the final Subject."
        on_error_basis: unspecified
      - n: 2
        from: prover
        to: verifier
        message: certificate-sequence
        action: "Deliver the authorization certificates and the name certificates in the order the reductions are to be applied."
        basis: stated
        locator: "§6.3.4, §6.4"
        quotes:
          - |-
            All reduction operations are in the order provided by the prover. That simplifies the job of the verifier, but leaves the job of finding the correct list of reductions to the prover.
          - |-
            As with the 5-tuples discussed in the previous section, name definition 4-tuples should be delivered in the order needed by the prover.
        on_error: "A missing certificate or a wrong order leaves some reduction inapplicable, so the chain does not reduce and no authorization results. The verifier is not required to search."
        on_error_basis: inferred
      - n: 3
        from: verifier
        to: verifier
        message: online-test-specification
        action: "Read each certificate's validity conditions; where one names an on-line test, note the test and the issuer (key or hash) the certificate names for it."
        basis: stated
        locator: "§5, §5.2"
        quotes:
          - |-
            The SPKI group resolved, in discussion, that on-line tests of various kinds are also validity conditions. That is, they further refine the valid date range of a certificate.
          - |-
            However, in SPKI, the certificate issuer must specify the issuer of validity confirmations.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 4
        from: validity-confirmation-issuer
        to: verifier
        message: timed-crl
        message_alternatives:
          - revalidation
          - one-time-revalidation
        action: "Obtain each on-line test result from the issuer the certificate names: a timed CRL, a timed revalidation or a one-time revalidation."
        invokes:
          - timed-crl-check
          - timed-revalidation-check
          - one-time-revalidation
        basis: stated
        locator: "§6, §5"
        quotes:
          - |-
            The other work for SPKI or SDSI certificates might include processing of on-line test results
        on_error: "No certificate that might use a CRL can be processed without a valid CRL; revalidations follow the same rules."
        on_error_basis: stated
        on_error_quotes:
          - |-
            Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier.
          - |-
            As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2).
      - n: 5
        from: translator
        to: verifier
        message: '5-tuple'
        message_alternatives:
          - name-4-tuple
        action: "Stage 1. Verify each certificate's signature and do its format-specific work, then map it to 5-tuples or name 4-tuples. Where on-line tests apply, VIntersect their validity with the certificate's to give the tuple's dates."
        invokes:
          - certificate-to-tuple-translation
          - vintersect
        basis: stated
        locator: "§6"
        quotes:
          - |-
            Individual certificates are verified by checking their signatures and possibly performing other work. They are then mapped to intermediate forms, called "tuples" here.
          - |-
            If on-line tests are involved in the certificate processing, then the validity dates of those on-line test results are intersected by VIntersect() [defined in 6.3.2, below] with the validity dates of the certificate to yield the dates in the certificate's tuple(s).
        on_error: "unspecified in this document. A certificate whose signature fails, or whose on-line test fails, yields no tuple and so cannot take part in any reduction."
        on_error_basis: inferred
      - n: 6
        from: verifier
        to: verifier
        message: acl-entry
        action: "Take the ACL entry that is to anchor the chain and form its 5-tuple, with Issuer Self."
        basis: stated
        locator: "§6.1, §1.1"
        quotes:
          - |-
            Its contents are the same as the contents of an SPKI certificate body, but it might be derived from another form of certificate or from an ACL entry.
          - |-
            Issuer: a public key (or its hash), or the reserved word "Self".
        on_error: "No ACL entry from which the presented chain starts: nothing to reduce from, so no authorization."
        on_error_basis: inferred
      - n: 7
        from: verifier
        to: verifier
        message: name-4-tuple
        action: "Stage 2. Replace every use of a name with its definition (a key or a hash), using the name 4-tuples."
        invokes:
          - four-tuple-name-reduction
          - unordered-pool-name-reduction
        basis: stated
        locator: "§6"
        quotes:
          - |-
            Uses of names are replaced with simple definitions (keys or hashes), based on the name definitions available from reducing name 4-tuples.
        on_error: "A name no 4-tuple defines stays a name, and a 5-tuple whose subject is an unresolved name cannot satisfy S1 = I2 for any following tuple."
        on_error_basis: inferred
      - n: 8
        from: verifier
        to: verifier
        message: '5-tuple'
        action: "Stage 3. Reduce the 5-tuples to a final authorization result, starting from the ACL entry's tuple and applying the prover's tuples in order."
        invokes:
          - five-tuple-chain-reduction
        basis: stated
        locator: "§6, §6.3"
        quotes:
          - |-
            Authorization 5-tuples are then reduced to a final authorization result.
        on_error: "Any failed reduction (S1 not equal to I2, D1 not TRUE, an empty authorization or validity intersection, an unmet threshold) ends the chain without a result."
        on_error_basis: inferred
      - n: 9
        from: verifier
        to: application
        message: '5-tuple'
        action: "Answer form 1 of the authorization question. The final tuple is <Self, S, D, A, V>. Grant when S is the requester's key, the requested access lies inside A (AIntersect(A, request) equals the request), and the time of the computation lies inside V. D does not matter for exercising the permission."
        basis: inferred
        locator: "§6.6, §4.1.4"
        quotes:
          - |-
            Is this Subject, S, allowed to do A, under this ACL and with this set of certificates?
          - |-
            The subject of a certificate or ACL entry may exercise any permission granted and, if delegation is TRUE, may also delegate that permission or some subset of it to others.
        on_error: "unspecified in this document; refuse."
        on_error_basis: inferred
      - n: 10
        from: application
        to: application
        message: '5-tuple'
        action: "Where the decision needs several kinds of permission rooted in different ACL entries, run a separate reduction for each and AND the results in application code; the certificate does not express the AND."
        basis: stated
        locator: "§6.5.7"
        quotes:
          - |-
            The three separate tests in the verifying code (e.g., the browser) would then involve separate 5-tuple reductions from separate root key ACL entries.
          - |-
            The fact that these three kinds of permission are treated as if ANDed is derived from the logic of the code that interprets the permissions and is not expressed in the certificate.
        on_error: "Any one reduction failing fails the conjunction."
        on_error_basis: inferred
      - n: 11
        from: verifier
        to: keyholder
        message: access-decision
        action: "Grant or refuse the access."
        basis: inferred
        locator: "§3"
        quotes:
          - |-
            That application must make a decision.
        on_error: "unspecified in this document; no refusal message or error code is defined."
        on_error_basis: unspecified
    guards:
      - id: deterministic-computation
        text: "The result must not depend on timing or on what happened to arrive; every validity input must be deterministic."
        basis: stated
        locator: "§5.1"
        quotes:
          - |-
            Every authorization computation is deterministic, under SPKI rules.
      - id: exercise-independent-of-delegation
        text: "A subject may exercise what it was granted whatever its delegation bit; a delegator can always delegate to a second key of its own, so restricting exercise buys nothing."
        basis: stated
        locator: "§4.1.4, §4.2"
        quotes:
          - |-
            Therefore, there was no benefit from attempting to restrict the exercise of a permission by someone permitted to delegate it.
      - id: tuples-in-trusted-memory
        text: "Tuples carry no signature, so they must stay in trusted memory and be produced only by trusted translation software; a tuple accepted from outside that boundary is unauthenticated."
        basis: stated
        locator: "§6.1"
        quotes:
          - |-
            The 5-tuple is an intermediate form, assumed to be held in trusted memory so that it doesn't need a digital signature for integrity. It is produced from certificates or other credentials via trusted software.
    error_path_ids:
      - signature-invalid
      - chain-validation-failed
      - no-valid-crl
      - no-valid-revalidation
      - certificate-listed-in-crl
      - validity-intersection-empty
      - non-monotonic-time
      - authorization-intersection-empty
      - subject-issuer-mismatch
      - delegation-not-permitted
      - threshold-not-satisfied
      - threshold-parameters-invalid
      - name-unresolved
      - name-definition-mismatch
      - misordered-or-incomplete-sequence
  - name: delegation-by-certificate-issuance
    title: "Delegation: an issuer holding delegation TRUE passes all or part of its authority on in a certificate"
    locator: "§1.1, §4, §4.1.4, §4.2, §4.3, §6.3.4"
    kind: issuance
    status: described-pattern
    participants:
      - acl-owner
      - issuer
      - keyholder
      - verifier
    summary: >-
      Authority enters at an ACL entry and flows down by certificates. Each
      issuer may pass on all of what it holds or a subset, and decides with one
      boolean whether its subject may pass it on again. Nothing is checked at
      issuance: the D1 = TRUE condition of section 6.3 is applied by the
      verifier when it reduces the chain, and over-broad grants are cut back by
      AIntersect rather than rejected.
    steps:
      - n: 1
        from: acl-owner
        to: verifier
        message: acl-entry
        action: "Place one ACL entry at the verifier granting a root key the authorization with delegation TRUE (the firewall example: one entry for the Secretary of Defense's key)."
        basis: stated
        locator: "§4.3"
        quotes:
          - |-
            By contrast, let the access be controlled by authorization certificates. The firewall would have an ACL with one entry, granting a key belonging to the Secretary of Defense the right to delegate all access through the firewall.
        on_error: "unspecified in this document; §7.7 adds that an ACL must itself be access-controlled."
        on_error_basis: unspecified
      - n: 2
        from: issuer
        to: keyholder
        message: authorization-certificate
        action: "Issue <issuer key, delegatee key, D, A', V'> where A' is all of the authority held or a part of it, and D says whether the delegatee may delegate further."
        basis: stated
        locator: "§1.1, §4, §4.1.4"
        quotes:
          - |-
            An SPKI authorization or attribute certificate can pass along all the empowerment it has received from the Issuer or it can pass along only a portion of that empowerment.
          - |-
            One might issue a simple permission (e.g., to read some file) or issue the permission to delegate that permission further.
        on_error: "Nothing stops an issuer signing a certificate it has no authority for. The check happens at the verifier, where the reduction fails unless the issuer's own incoming tuple has D = TRUE (§6.3); authority beyond what the issuer holds is narrowed by AIntersect, not rejected."
        on_error_basis: inferred
      - n: 3
        from: issuer
        to: keyholder
        message: certificate-sequence
        action: "Hand over the sequence of certificates already delegating the authority to the issuer, with the new certificate appended."
        basis: stated
        locator: "§6.3.4"
        quotes:
          - |-
            Each keyholder who is granted some authority should receive a sequence of certificates delegating that authority. That keyholder may then want to delegate part of this authority on to some other keyholder. To do that, a single additional certificate is generated and appended to the sequence already available, yielding a sequence that can be used by the delegatee to prove access permission.
        on_error: "unspecified in this document; without the upstream sequence the delegatee must find the path itself (certificate-path-discovery)."
        on_error_basis: inferred
      - n: 4
        from: issuer
        to: keyholder
        message: authorization-certificate
        action: "Repeat at each level of the organization. At the leaf the delegatee receives the permission without permission to delegate (D = FALSE)."
        basis: stated
        locator: "§4.3"
        quotes:
          - |-
            The Secretary would, in
          - |-
            turn, issue certificates delegating this permission to delegate to each of his or her subordinates. This process would iterate, until some enlisted man would receive permission to penetrate that firewall for some specific one protocol, but not have permission to delegate that permission.
        on_error: "A leaf holder that delegates anyway produces a certificate whose reduction fails the D1 = TRUE condition."
        on_error_basis: inferred
      - n: 5
        from: keyholder
        to: verifier
        message: certificate-sequence
        action: "The delegatee, acting as prover, presents the sequence; the verifier runs authorization-decision."
        invokes:
          - authorization-decision
        basis: stated
        locator: "§6.3.4"
        quotes:
          - |-
            yielding a sequence that can be used by the delegatee to prove access permission.
        on_error: "As in authorization-decision."
        on_error_basis: inferred
    guards:
      - id: boolean-depth-control
        text: "Delegation is controlled by one boolean per certificate or ACL entry; there is no depth integer and no control of width."
        basis: stated
        locator: "§4.1.4"
        quotes:
          - |-
            Of these three, the group chose boolean control.
          - |-
            As for controlling the proliferation of permissions, there is no control on the width of the delegation tree, so control on its depth is not a tight control on proliferation.
      - id: delegator-may-exercise
        text: "A delegator may create a key pair of its own and delegate to it, so a delegator is never barred from exercising."
        basis: stated
        locator: "§4.2"
        quotes:
          - |-
            We decided that a delegator is free to create a new key pair, also controlled by it, and delegate the rights to that key to exercise the delegated permission.
      - id: name-subject-bypasses-delegation-bit
        text: "Authority granted to a name rather than a key, even with delegation FALSE, can be passed on at will by whoever controls the name, through <name,key> certificates."
        basis: stated
        locator: "§7.5"
        quotes:
          - |-
            directly, both without granting the permission to delegate, that key can delegate at will through <name,key> certificates in the former case and not delegate at all in the latter case.
      - id: control-is-distributed
        text: "Issuance and revocation of the delegation certificates is distributed and need not appear at the verifier."
        basis: stated
        locator: "§4.3"
        quotes:
          - |-
            The certificate structure generated would reflect the organization structure of the entire Defense Department, just as the nested ACLs would have, but the control of these certificates (via their issuance and revocation) is distributed and need not show up in that one firewall or be replicated in all firewalls.
    error_path_ids:
      - delegation-not-permitted
      - authorization-intersection-empty
      - key-lent-or-proxied
      - delegation-through-name-subject
  - name: certificate-path-discovery
    title: "Certificate path discovery: the prover, not the verifier, finds and orders the reductions"
    locator: "§6.3.4, §6.4"
    kind: exchange
    status: example-processing-plan
    participants:
      - issuer
      - prover
      - verifier
    summary: >-
      Path finding is the prover's job. Normally the prover already holds the
      sequence it was handed when it was delegated to; the general algorithm
      for an unordered set exists (cited as ELIEN) but is not given here. The
      verifier applies the reductions in the order received. Only for names
      does the source give a rule for a verifier holding an unordered pool.
    steps:
      - n: 1
        from: issuer
        to: prover
        message: certificate-sequence
        action: "At delegation time the prover receives the ready-made sequence ending in its own certificate."
        basis: stated
        locator: "§6.3.4"
        quotes:
          - |-
            Each keyholder who is granted some authority should receive a sequence of certificates delegating that authority.
        on_error: "If no sequence was handed over, go to step 2."
        on_error_basis: inferred
      - n: 2
        from: prover
        to: prover
        message: certificate-sequence
        action: "Otherwise find the path through a large unordered set of certificates with the general algorithm. The source says it is solved and cites ELIEN, does not give it, and expects it to be needed rarely."
        basis: stated
        locator: "§6.3.4"
        quotes:
          - |-
            The general algorithm for finding the right certificate paths from a large set of unordered certificates has been solved[ELIEN], but might be used only rarely.
        on_error: "unspecified in this document; no path found means nothing to present."
        on_error_basis: unspecified
      - n: 3
        from: prover
        to: verifier
        message: certificate-sequence
        action: "Present the certificates, name certificates included, in reduction order."
        basis: stated
        locator: "§6.3.4, §6.4"
        quotes:
          - |-
            All reduction operations are in the order provided by the prover.
          - |-
            With the second form of name definition, one might have names that temporarily grow. If the prover is providing certificates in order, then the verifier need only do as it is told.
        on_error: "A misordered or incomplete sequence fails to reduce; the verifier owes no search."
        on_error_basis: inferred
      - n: 4
        from: verifier
        to: verifier
        message: name-4-tuple
        action: "A verifier that works from an unordered pool instead applies only those name 4-tuples that define a name as a key (unordered-pool-name-reduction)."
        invokes:
          - unordered-pool-name-reduction
        basis: stated
        locator: "§6.4"
        quotes:
          - |-
            If the verifier is operating from an unordered pool of tuples, then a safe rule for name reduction is to apply only those 4-tuples that define a name as a key.
        on_error: "unspecified in this document for 5-tuples: the source gives no procedure for reducing authorization 5-tuples from an unordered pool."
        on_error_basis: unspecified
    error_path_ids:
      - misordered-or-incomplete-sequence
      - no-path-found
      - naming-loop
  - name: timed-crl-check
    title: "Timed CRL: a certificate that names its CRL key cannot be used without a current, valid CRL"
    locator: "§5, §5.2, §5.4, §5.5, §6, §6.3.2"
    kind: exchange
    status: permitted-with-conditions
    participants:
      - issuer
      - validity-confirmation-issuer
      - fetch-location
      - verifier
    summary: >-
      SPKI permits CRLs only in timed form. The certificate names the
      CRL-signing key; every CRL carries validity dates; successive CRLs never
      overlap. The CRL becomes a completion of the certificate rather than news,
      so the result is deterministic: without a valid CRL the certificate
      cannot be processed, and no CRL can arrive as a surprise.
    steps:
      - n: 1
        from: issuer
        to: verifier
        message: online-test-specification
        action: "The certificate lists the key, or its hash, that will sign the CRL, and may list locations to fetch it from (condition 1). This is how the certificate issuer names the issuer of validity confirmations."
        basis: stated
        locator: "§5.2, §5"
        quotes:
          - |-
            SPKI permits use of timed CRLs. That is, if a certificate can be referenced in a CRL, then the CRL process is subject to three conditions.
          - |-
            The certificate must list the key (or its hash) that will sign the CRL and may give one or more locations where that CRL might be fetched.
        on_error: "A CRL signed by any other key is not the CRL the certificate names and does not count as a valid CRL."
        on_error_basis: inferred
      - n: 2
        from: validity-confirmation-issuer
        to: validity-confirmation-issuer
        message: timed-crl
        action: "Choose the validity interval by risk management. It is how long the world may act on a statement the issuer knows to be false; a revocation learned of now can take effect no earlier than the end of the interval already issued."
        basis: stated
        locator: "§5.4, §5.5"
        quotes:
          - |-
            Both timed CRLs and timed revalidations have non-0 validity intervals. To set this validity interval, one must answer the question: "How long are you willing to let the world believe and act on a statement you know to be false?"
          - |-
            That is, one must assume that the previous CRL or revalidation has just been signed and transmitted to at least one consumer, locking up a time slot. The next available time slot starts after this validity interval ends. That is the earliest one can revoke a certificate one learns to be false.
          - |-
            The answer to that question comes from risk management. It will probably be based on expected monetary losses, at least in commercial cases.
        on_error: "A zero-length interval is not possible for a CRL: it would be out of date on arrival, and more so with clock skew."
        on_error_basis: stated
        on_error_quotes:
          - |-
            Validity intervals of length zero are not possible. Since transmission takes time, by the time a CRL was received by the verifier, it would be out of date and unusable. That assumes perfect clock synchronization. If clock skew is taken into consideration, validity intervals need to be that much larger to be meaningful.
      - n: 3
        from: validity-confirmation-issuer
        to: fetch-location
        message: timed-crl
        action: "Issue each CRL with validity dates (condition 2), and never issue one whose range intersects the range of the CRL currently deployed (condition 3)."
        basis: stated
        locator: "§5.2"
        quotes:
          - |-
            The CRL must carry validity dates.
          - |-
            CRL validity date ranges must not intersect. That is, one may not issue a new CRL to take effect before the expiration of the CRL currently deployed.
        on_error: "unspecified in this document; nothing says what a verifier does on seeing two CRLs whose ranges intersect."
        on_error_basis: unspecified
      - n: 4
        from: validity-confirmation-issuer
        to: fetch-location
        message: delta-crl
        action: "Optionally follow the full CRL with delta-CRLs, each one a delta-crl. The full CRL with its deltas is treated as the current CRL (current-crl), and the combination must meet the same three conditions."
        basis: stated
        locator: "§5.2"
        quotes:
          - |-
            Since CRLs might get very large and since they tend to grow monotonically, one might want to issue changes to CRLs rather than full ones. That is, a CRL might be a full CRL followed by a sequence of delta-CRLs. That sequence of instruments is then treated as a current CRL and the combined CRL must follow the conditions listed above.
        on_error: "A combined CRL that breaks a condition is not a valid CRL."
        on_error_basis: inferred
      - n: 5
        from: fetch-location
        to: verifier
        message: timed-crl
        message_alternatives:
          - delta-crl
        action: "The verifier fetches the current CRL, and any deltas, from a location the certificate lists."
        basis: inferred
        locator: "§5.2"
        quotes:
          - |-
            may give one or more locations where that CRL might be fetched.
        on_error: "No CRL obtainable means no valid CRL, so the certificate cannot be processed."
        on_error_basis: stated
        on_error_quotes:
          - |-
            Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier.
      - n: 6
        from: verifier
        to: verifier
        message: timed-crl
        message_alternatives:
          - current-crl
        action: "Accept the CRL, or the full CRL with its deltas taken together as the current CRL (current-crl), only if it is signed by the key the certificate lists and its validity range covers the time of the computation."
        basis: inferred
        locator: "§5.2"
        quotes:
          - |-
            The certificate must list the key (or its hash) that will sign the CRL
        on_error: "No valid CRL: the certificate cannot be processed."
        on_error_basis: stated
        on_error_quotes:
          - |-
            Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier.
      - n: 7
        from: verifier
        to: verifier
        message: timed-crl
        message_alternatives:
          - current-crl
        action: "Check that the certificate is not listed in it."
        basis: inferred
        locator: "§5.1, §5.2"
        quotes:
          - |-
            It had a list of revoked certificate identifiers.
        on_error: "Listed: the certificate is revoked and yields no tuple. The source gives listing semantics only for the anti-matter CRL it rules out, where the CRL annihilates the certificate it lists."
        on_error_basis: inferred
      - n: 8
        from: verifier
        to: verifier
        message: validity-conditions
        action: "VIntersect the CRL's validity dates with the certificate's to give the dates of the certificate's tuple."
        invokes:
          - vintersect
        basis: stated
        locator: "§6, §6.3.2"
        quotes:
          - |-
            Each such test carries with it a validity interval, in terms of dates. That validity interval is intersected with any present in the certificate, to yield a new, current validity interval.
        on_error: "Empty intersection: VIntersect fails and the certificate yields no tuple."
        on_error_basis: stated
        on_error_quotes:
          - |-
            and if Vmin > Vmax, then the intersection failed.
    guards:
      - id: crl-completes-certificate
        text: "A timed CRL is part of the certificate it covers. The computation is deterministic and independent of clock skew, though an inaccurate verifier clock can still give a result the issuer did not intend."
        basis: stated
        locator: "§5.2"
        quotes:
          - |-
            This yields a deterministic validity computation, independent of clock skew, although clock inaccuracies in the verifier may produce a result not desired by the issuer. The CRL in this case is a completion of the certificate, rather than a message to the world announcing a change of mind.
    error_path_ids:
      - no-valid-crl
      - crl-signed-by-wrong-key
      - certificate-listed-in-crl
      - crl-ranges-intersect
      - zero-length-crl-interval
      - verifier-clock-inaccurate
      - validity-intersection-empty
      - revocation-latency
  - name: timed-revalidation-check
    title: "Timed revalidation: the positive counterpart of a timed CRL, under the same three conditions"
    locator: "§5.3, §5.2, §5.4, §5.5, §6.3.2"
    kind: exchange
    status: permitted-with-conditions
    participants:
      - issuer
      - validity-confirmation-issuer
      - verifier
    summary: >-
      A revalidation says a certificate is still good rather than that it is
      bad. It usually lists one certificate and may list several to save
      signatures. Section 5.3 imposes the section 5.2 rules wholesale; their
      application to revalidations (the certificate naming the revalidation
      key, non-overlapping ranges) is by that cross-reference.
    steps:
      - n: 1
        from: issuer
        to: verifier
        message: online-test-specification
        action: "The certificate names the revalidation issuer; by the cross-reference to §5.2, it lists that issuer's key or hash and may give locations."
        basis: inferred
        locator: "§5, §5.3"
        quotes:
          - |-
            However, in SPKI, the certificate issuer must specify the issuer of validity confirmations.
          - |-
            As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2).
        on_error: "A revalidation from any other issuer does not count."
        on_error_basis: inferred
      - n: 2
        from: validity-confirmation-issuer
        to: validity-confirmation-issuer
        message: revalidation
        action: "Choose the non-zero validity interval by risk management, as for timed CRLs."
        basis: stated
        locator: "§5.4, §5.5"
        quotes:
          - |-
            Both timed CRLs and timed revalidations have non-0 validity intervals.
        on_error: "A zero-length interval is not possible; use a one-time revalidation instead."
        on_error_basis: stated
        on_error_quotes:
          - |-
            For those who want to set the validity interval to zero, SPKI defines a one-time revalidation.
      - n: 3
        from: validity-confirmation-issuer
        to: verifier
        message: revalidation
        action: "Issue a revalidation listing the certificate of interest, or a set of certificates to save signature effort, with validity dates; successive revalidation ranges do not intersect."
        basis: stated
        locator: "§5.3"
        quotes:
          - |-
            CRLs are negative statements. The positive version of a CRL is what we call a revalidation. Typically a revalidation would list only one certificate (the one of interest), although it might list a set of certificates (to save digital signature effort).
          - |-
            As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2).
        on_error: "unspecified in this document; the source does not say who fetches or carries the revalidation."
        on_error_basis: unspecified
      - n: 4
        from: verifier
        to: verifier
        message: revalidation
        action: "Accept the revalidation only if it is signed by the issuer the certificate names, its range covers the time of the computation, and it lists the certificate."
        basis: inferred
        locator: "§5.3, §5.2"
        quotes:
          - |-
            Typically a revalidation would list only one certificate (the one of interest)
        on_error: "No valid revalidation listing the certificate: by the §5.2 rules, the certificate cannot be processed."
        on_error_basis: inferred
      - n: 5
        from: verifier
        to: verifier
        message: validity-conditions
        action: "VIntersect the revalidation's validity with the certificate's."
        invokes:
          - vintersect
        basis: stated
        locator: "§6, §6.3.2"
        quotes:
          - |-
            That validity interval is intersected with any present in the certificate, to yield a new, current validity interval.
        on_error: "Empty intersection: VIntersect fails."
        on_error_basis: stated
        on_error_quotes:
          - |-
            and if Vmin > Vmax, then the intersection failed.
    error_path_ids:
      - no-valid-revalidation
      - certificate-not-in-revalidation
      - zero-length-crl-interval
      - validity-intersection-empty
      - revocation-latency
  - name: one-time-revalidation
    title: "One-time revalidation: a nonce-bound, zero-length validity good for one authorization computation"
    locator: "§5.5, §5"
    kind: exchange
    status: defined-by-spki-not-here
    participants:
      - requester
      - validity-confirmation-issuer
      - verifier
    summary: >-
      The only request and response the document describes. The applicant
      sends a request containing a nonce; the signed answer returns the nonce;
      the answer counts as a zero-length validity interval at the moment the
      authorization computation completes and is worthless afterwards. Who
      applies is not said.
    steps:
      - n: 1
        from: requester
        to: validity-confirmation-issuer
        message: one-time-revalidation-request
        action: "Apply on line by submitting a request that contains a nonce."
        basis: stated
        locator: "§5.5"
        quotes:
          - |-
            One applies for this on-line, one-time revalidation by submitting a request containing a nonce.
        note: "Requester identity is inferred: the result is good only inside the current computation and the nonce exists to stop replay, so the verifier, or a party using a nonce the verifier chose, is the natural applicant."
        on_error: "unspecified in this document; no answer means no validity for the certificate."
        on_error_basis: inferred
      - n: 2
        from: validity-confirmation-issuer
        to: requester
        message: one-time-revalidation
        action: "Return a signed revalidation instrument carrying the same nonce."
        basis: stated
        locator: "§5.5"
        quotes:
          - |-
            That nonce gets returned in the signed revalidation instrument, in order to prevent replay attacks.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 3
        from: requester
        to: verifier
        message: one-time-revalidation
        action: "Hand the signed instrument to the verifier. There is nothing to hand over when the requester is the verifier."
        basis: inferred
        locator: "§5.5"
        quotes:
          - |-
            One applies for this on-line, one-time revalidation by submitting a request containing a nonce.
        note: "The source never names the applicant (source_defects_and_ambiguities: one-time-applicant), so this step exists only when the requester is not the verifier."
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 4
        from: verifier
        to: verifier
        message: one-time-revalidation
        action: "Accept only if the signature is by the issuer the certificate names and the returned nonce equals the one submitted."
        basis: inferred
        locator: "§5.5, §5"
        quotes:
          - |-
            in order to prevent replay attacks.
          - |-
            However, in SPKI, the certificate issuer must specify the issuer of validity confirmations.
        on_error: "Nonce mismatch or wrong signer: treat as a replay and do not use the instrument."
        on_error_basis: inferred
      - n: 5
        from: verifier
        to: verifier
        message: validity-conditions
        action: "Use it in place of a validity date range: a zero-length interval that starts and ends when the authorization computation completes; VIntersect it with the certificate's dates."
        invokes:
          - vintersect
        basis: stated
        locator: "§5.5, §6"
        quotes:
          - |-
            This protocol takes the place of a validity date range and represents a validity interval of zero, starting and ending at the time the authorization computation completes.
          - |-
            If on-line tests are involved in the certificate processing, then the validity dates of those on-line test results are intersected by VIntersect() [defined in 6.3.2, below] with the validity dates of the certificate to yield the dates in the certificate's tuple(s).
        on_error: "Completion time outside the certificate's own dates: VIntersect fails (Vmin > Vmax)."
        on_error_basis: inferred
      - n: 6
        from: verifier
        to: verifier
        message: one-time-revalidation
        action: "Discard the instrument once this computation completes."
        basis: stated
        locator: "§5.5"
        quotes:
          - |-
            This form of revalidation has no lifetime beyond the current authorization computation.
        on_error: "Re-use in a later computation is invalid."
        on_error_basis: stated
    error_path_ids:
      - one-time-nonce-mismatch
      - one-time-revalidation-reused
      - validity-intersection-empty
  - name: short-lived-certificate-renewal
    title: "Short-lived certificate renewal: an on-line test statement says where the replacement can be fetched"
    locator: "§5.6, §7"
    kind: exchange
    status: defined-by-spki-not-here
    participants:
      - issuer
      - fetch-location
      - requester
      - verifier
    summary: >-
      Instead of a long-lived certificate plus an on-line test, the issuer
      issues certificates that expire soon and are replaced continually. A
      kind of on-line test statement in the certificate tells its user where to
      fetch the replacement. The source offers it as the cheaper option when
      the same key would sign both the certificate and the test result.
    steps:
      - n: 1
        from: issuer
        to: requester
        message: short-lived-certificate
        action: "Issue the certificate with a short validity interval instead of a long one plus an on-line test."
        basis: stated
        locator: "§5.6"
        quotes:
          - |-
            A performance analysis of the various methods of achieving fine-grain control over the validity interval of a certificate should consider the possibility of just making the original certificate short-lived, especially if the online test result is issued by the same key that issued the certificate.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 2
        from: issuer
        to: requester
        message: online-test-specification
        action: "Carry in the certificate the on-line test statement naming where a replacement short-lived certificate might be fetched."
        basis: stated
        locator: "§5.6"
        quotes:
          - |-
            If one wants to issue short-lived certificates, SPKI defines a kind of online test statement to tell the user of the certificate where a replacement short-lived certificate might be fetched.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 3
        from: issuer
        to: fetch-location
        message: short-lived-certificate
        action: "Make each replacement available at the named location, normally signed by the same key."
        basis: inferred
        locator: "§5.6"
        quotes:
          - |-
            especially if the online test result is issued by the same key that issued the certificate.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 4
        from: requester
        to: fetch-location
        message: online-test-specification
        action: "The user of the certificate fetches the replacement from the location the statement gives, before the current certificate expires."
        basis: stated
        locator: "§5.6"
        quotes:
          - |-
            to tell the user of the certificate where a replacement short-lived certificate might be fetched.
        note: "Timing before expiry is inferred. Whether the user of the certificate is its keyholder or a verifier is not said. The fetch request itself is not defined; the message named is the online-test-specification whose location the requester uses."
        on_error: "No replacement available before expiry: once the not-after date passes, the certificate's validity no longer covers the computation and the keyholder is no longer empowered."
        on_error_basis: inferred
      - n: 5
        from: fetch-location
        to: requester
        message: short-lived-certificate
        action: "Return the replacement short-lived certificate."
        basis: stated
        locator: "§5.6"
        quotes:
          - |-
            where a replacement short-lived certificate might be fetched.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 6
        from: requester
        to: verifier
        message: certificate-sequence
        action: "Present the chain with the current short-lived certificate in it."
        basis: inferred
        locator: "§6.3.4"
        quotes:
          - |-
            All reduction operations are in the order provided by the prover.
        on_error: "As in authorization-decision."
        on_error_basis: inferred
    guards:
      - id: fewer-verifications
        text: "A short-lived certificate always costs fewer signature verifications than a certificate plus an on-line test result."
        basis: stated
        locator: "§5.6"
        quotes:
          - |-
            The use of a short-lived certificate always requires fewer signature verifications than the use of certificate plus online test result.
      - id: key-lifetime-is-certificate-lifetime
        text: "Under SPKI a key is never declared bad; it stops being empowered when its certificates lapse."
        basis: stated
        locator: "§7"
        quotes:
          - |-
            This limitation of a certificate's lifetime might be by limited lifetime at time of issuance or might be via the lifetime acquired through an on-line test (CRL, revalidation or one-time). Therefore, all key lifetime control becomes certificate lifetime control.
    error_path_ids:
      - short-lived-replacement-unavailable
      - validity-intersection-empty
  - name: anti-matter-crl-dissemination
    title: "Wandering anti-matter CRL, ruled out by SPKI and kept here for its failure mode"
    locator: "§5.1"
    kind: exchange
    status: ruled-out
    participants:
      - issuer
      - adversary
      - verifier
    summary: >-
      The early CRL design modelled on the bad-cheque book at a checkout: a
      sequence-numbered list of revoked certificates, released whenever the
      issuer likes and spread by any route. Its result depends on timing and an
      adversary who blocks delivery prevents revocation, so SPKI rules it out.
      It is the negative example that the timed CRL rules are built against.
    steps:
      - n: 1
        from: issuer
        to: issuer
        message: anti-matter-crl
        action: "List the certificate to be revoked in the next CRL, which carries a sequence number; if urgent, release it at once."
        basis: stated
        locator: "§5.1"
        quotes:
          - |-
            An early CRL design followed this model. It had a list of revoked certificate identifiers. It also had a sequence number, so that one could tell which of two CRLs was more recent. A newer CRL would replace an older one.
          - |-
            When the issuer wants to revoke a certificate, it is listed in the next CRL to go out. If the revocation is urgent, then that CRL can be released immediately.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 2
        from: issuer
        to: verifier
        message: anti-matter-crl
        action: "The CRL travels by some dissemination process unrelated to the consumers' needs."
        basis: stated
        locator: "§5.1"
        quotes:
          - |-
            The CRL then follows some dissemination process unrelated to the needs of the consumers of the CRL.
        on_error: "Delivery is not guaranteed in time or at all."
        on_error_basis: stated
        on_error_quotes:
          - |-
            However, this process is non-deterministic. The result of the authorization computation is at least timing dependent.
      - n: 3
        from: verifier
        to: verifier
        message: anti-matter-crl
        action: "On meeting a certificate it lists, the CRL annihilates it; on meeting an older CRL it annihilates that too, leaving a copy of itself at each verifier."
        basis: stated
        locator: "§5.1"
        quotes:
          - |-
            If the CRL encounters a certificate it has listed, it effectively annihilates that certificate. If it encounters an older CRL, it annihilates that CRL also, leaving a copies of itself at the verifiers it encounters.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 4
        from: adversary
        to: verifier
        message: anti-matter-crl
        action: "Block delivery of the new CRL by tampering with the network, so the revoked certificate keeps working."
        basis: stated
        locator: "§5.1"
        quotes:
          - |-
            That is, an adversary can prevent revocation of a given certificate by preventing the delivery of new CRLs. This does not require cryptographic level effort, merely network tampering.
        on_error: "Revocation is silently prevented, which is why SPKI ruled the mechanism out."
        on_error_basis: stated
        on_error_quotes:
          - |-
            SPKI has ruled out the use of wandering anti-matter CRLs for its certificates.
    error_path_ids:
      - anti-matter-crl-suppressed
  - name: certificate-result-certificate-issuance
    title: "Certificate Result Certificate: the answer to a reduction re-issued as one certificate"
    locator: "§6.6, §6.3.2, §6.4.1"
    kind: exchange
    status: example-processing-plan
    participants:
      - requester
      - crc-issuer
      - validity-confirmation-issuer
      - verifier
    summary: >-
      An entity runs the reduction to answer what Subject S may do under an ACL
      with a set of certificates, and signs the answer as a new certificate.
      For a long-lived CRC, VIntersect may carry the union of the chain's
      on-line tests forward instead of evaluating them. A CRC service may also
      resolve the names inside a threshold subject and leave it in threshold
      form. Who asks, and how a later verifier comes to trust the CRC's issuer,
      is not said.
    steps:
      - n: 1
        from: requester
        to: crc-issuer
        message: authorization-question
        message_alternatives:
          - certificate-sequence
        action: "Ask form 2 of the authorization question and supply the certificates."
        basis: inferred
        locator: "§6.6"
        quotes:
          - |-
            What is Subject S allowed to do, under this ACL and with this set of certificates?
        note: "The question form is stated; that it is sent to a service is not."
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 2
        from: crc-issuer
        to: crc-issuer
        message: '5-tuple'
        action: "Run stages 1 to 3. VIntersect may gather the on-line tests present in each certificate and carry their union in the accumulating tuples, deferring their evaluation to the end."
        invokes:
          - five-tuple-chain-reduction
          - vintersect
        basis: stated
        locator: "§6.3.2"
        quotes:
          - |-
            It is possible for an implementation of VIntersect() to gather up online tests that are present in each certificate and include the union of all those tests in the accumulating tuples. In this case, the evaluation of those online tests is deferred until the end of the process. This might be appropriate if the tuple reduction is being performed not for answering an immediate authorization question but rather for generation of a summary certificate (Certificate Result Certificate) that one might hope would be useful for a long time.
        on_error: "The reduction fails: no CRC can be issued."
        on_error_basis: inferred
      - n: 3
        from: crc-issuer
        to: crc-issuer
        message: threshold-subject
        action: "Optionally reduce the named subordinate subjects of a threshold subject to keys and leave the subject in threshold form, with validity intersection only."
        invokes:
          - four-tuple-threshold-subject-reduction
        basis: stated
        locator: "§6.4.1"
        quotes:
          - |-
            One can reduce individual named subjects in a threshold subject and leave the subject in threshold form, if one desires.
          - |-
            This might be used by a service that produces Certificate Result Certificates [see 6.7].
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 4
        from: crc-issuer
        to: crc-issuer
        message: certificate-result-certificate
        action: "Sign a new certificate carrying the answer; it corresponds to the semantics of the underlying certificates and on-line test results."
        basis: stated
        locator: "§6.6"
        quotes:
          - |-
            The answer to the second computation can be put into a new certificate issued by the entity doing the computation. That one certificate corresponds to the semantics of the underlying certificates and online test results. We call it a Certificate Result Certificate.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 5
        from: crc-issuer
        to: requester
        message: certificate-result-certificate
        action: "Return the CRC."
        basis: inferred
        locator: "§6.6"
        quotes:
          - |-
            We call it a Certificate Result Certificate.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 6
        from: requester
        to: verifier
        message: certificate-result-certificate
        action: "Present the one certificate in place of the chain it summarises."
        basis: inferred
        locator: "§6.6"
        quotes:
          - |-
            That one certificate corresponds to the semantics of the underlying certificates and online test results.
        on_error: "unspecified in this document. The CRC is signed by the computing entity, not by the ACL's Self, so a verifier can reduce it only if its own ACL empowers that entity's key; the source does not say how that is arranged."
        on_error_basis: unspecified
      - n: 7
        from: verifier
        to: validity-confirmation-issuer
        message: online-test-specification
        action: "Evaluate any on-line tests the CRC carries forward."
        basis: inferred
        locator: "§6.3.2"
        quotes:
          - |-
            In this case, the evaluation of those online tests is deferred until the end of the process.
        on_error: "A deferred test that fails makes the CRC unusable for this computation."
        on_error_basis: inferred
    error_path_ids:
      - crc-issuer-not-empowered
      - deferred-online-test-fails
  - name: attribute-plus-id-authorization
    title: "Authorization through an attribute certificate and an ID certificate (authorization to name to key)"
    locator: "§3.1, §6, §6.5.4, §8"
    kind: exchange
    status: described-pattern
    participants:
      - attribute-certificate-issuer
      - id-certificate-issuer
      - keyholder
      - verifier
      - translator
    summary: >-
      The X9.57 path: an attribute certificate grants an authorization to a
      name, an ID certificate binds the name to a key. The verifier has to
      combine them, which means trusting two issuers and matching a name across
      their name spaces. Section 8 gives both as reasons the direct
      authorization certificate is more secure; both reasons vanish when one
      issuer issues both certificates.
    steps:
      - n: 1
        from: attribute-certificate-issuer
        to: keyholder
        message: attribute-certificate
        action: "Issue an attribute certificate binding an authorization to a Distinguished Name."
        basis: stated
        locator: "§3.1"
        quotes:
          - |-
            An Attribute Certificate, as defined in X9.57, binds an attribute that could be an authorization to a Distinguished Name.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 2
        from: id-certificate-issuer
        to: keyholder
        message: name-certificate
        action: "Issue an ID certificate binding the name to the keyholder's key."
        basis: stated
        locator: "§3.1"
        quotes:
          - |-
            For an application to use this information, it must combine an attribute certificate with an ID certificate, in order to get the full mapping:
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 3
        from: keyholder
        to: verifier
        message: certificate-sequence
        action: "Present both certificates."
        basis: inferred
        locator: "§3.1"
        quotes:
          - |-
            it must combine an attribute certificate with an ID certificate
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 4
        from: translator
        to: verifier
        message: '5-tuple'
        action: "Translate the attribute certificate into one or more 5-tuples with a name as Subject, building a fully qualified name for the Distinguished Name; if it refers to an ID certificate explicitly, use that certificate's key as Subject and skip the name 4-tuples."
        invokes:
          - certificate-to-tuple-translation
          - name-qualification
        basis: stated
        locator: "§6.5.4"
        quotes:
          - |-
            An X9.57 attribute certificate should yield one or more 5-tuples, with names as Subject. The code translating the attribute certificate will have to build a fully-qualified name to represent the Distinguished Name in the Subject. For any attribute certificates that refer to an ID certificate explicitly, the Subject of the 5-tuple can be the key in that ID certificate, bypassing the construction of name 4-tuples.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 5
        from: verifier
        to: verifier
        message: name-4-tuple
        action: "Resolve the name to the key with the 4-tuple from the ID certificate."
        invokes:
          - four-tuple-name-reduction
        basis: stated
        locator: "§6, §8"
        quotes:
          - |-
            Uses of names are replaced with simple definitions (keys or hashes), based on the name definitions available from reducing name 4-tuples.
        on_error: "The name in the attribute certificate and the name the ID certificate defines are in different name spaces: matching them is more than string comparison and may involve a human guess, which can be wrong or attacker-guided."
        on_error_basis: stated
        on_error_quotes:
          - |-
            certificate, then one of the two issuers must use a foreign name space. The process of choosing the appropriate name from a foreign name space is more complex than string matching and might even involve a human guess. It is subject to mistakes. Such a mistake can be made by accident or be guided by an attacker.
      - n: 6
        from: verifier
        to: verifier
        message: '5-tuple'
        action: "Reduce the resulting 5-tuple chain as in authorization-decision."
        invokes:
          - five-tuple-chain-reduction
        basis: stated
        locator: "§6, §3.1"
        quotes:
          - |-
            Authorization 5-tuples are then reduced to a final authorization result.
        on_error: "Either issuer subverted: the attacker obtains the authorization. Both issuers have to be trusted with the decision."
        on_error_basis: stated
        on_error_quotes:
          - |-
            However, if either of these issuers were subverted, then an attacker could obtain an authorization improperly. Therefore, both the issuers need to be trusted with the authorization decision.
    guards:
      - id: same-issuer-cancels
        text: "When the two certificates come from the same issuer, and so the same name space, both security disadvantages disappear."
        basis: stated
        locator: "§8"
        quotes:
          - |-
            This is not to say that one must never use the second construct. If the two certificates come from the same issuer, and therefore with the same name space, then both of the security differentiators above are canceled.
    error_path_ids:
      - subverted-issuer
      - foreign-name-space
      - name-unresolved
  - name: name-definition
    title: "Name definition: local, compound, group and fully qualified SDSI names"
    locator: "§2.6.1, §2.6.2, §2.8, §2.10, §6.2, §7.3"
    kind: issuance
    status: described-pattern
    participants:
      - name-definer
      - keyholder
      - issuer
      - verifier
    summary: >-
      Every name is local to the key that defines it. A name certificate binds
      a name in the issuer's name space to a key, another name or a threshold
      subject; several certificates for one name define a group; names chain
      through other definers' names. Inside a certificate a local name belongs
      to the issuer's name space; outside one it has to carry its key.
    steps:
      - n: 1
        from: name-definer
        to: keyholder
        message: name-certificate
        action: "Define a basic name in the definer's own name space, george: (name fred)."
        basis: stated
        locator: "§2.6.1"
        quotes:
          - |-
            A basic SDSI 2.0 name is an S-expression with two elements: the word "name" and the chosen name. For example, george: (name fred) represents a basic SDSI name "fred" in the name space defined by george.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 2
        from: name-definer
        to: keyholder
        message: name-certificate
        action: "Define a group by issuing one certificate per member under the same name."
        basis: stated
        locator: "§2.10"
        quotes:
          - |-
            SPKI/SDSI does not claim to enforce one key per name. Therefore, a named group can be defined by issuing multiple (name,key) certificates with the same name -- one for each group member.
        on_error: "unspecified in this document; each member's key resolves the name, so name reduction can branch."
        on_error_basis: inferred
      - n: 3
        from: name-definer
        to: keyholder
        message: name-certificate
        action: "A second definer, fred, defines a name in its own name space: fred: (name sam)."
        basis: stated
        locator: "§2.6.2"
        quotes:
          - |-
            If fred in turn defines a name, for example, fred: (name sam) then george can refer to this same entity as george: (name fred sam)
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 4
        from: name-definer
        to: name-definer
        message: sdsi-compound-name
        action: "Refer to a name another key defines, by chaining: fred: (name sam) lets george say (name fred sam)."
        basis: stated
        locator: "§2.6.2"
        quotes:
          - |-
            If fred in turn defines a name, for example, fred: (name sam) then george can refer to this same entity as george: (name fred sam)
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 5
        from: issuer
        to: keyholder
        message: authorization-certificate
        action: "Grant authority to a name. Inside a certificate a local name is in the issuer's name space; outside one it must be fully qualified with the key of its name space, for example (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) jim therese)."
        invokes:
          - name-qualification
        basis: stated
        locator: "§2.8"
        quotes:
          - |-
            It is SDSI 1.0 convention, preserved in SPKI, that if a (local) SDSI name occurs within a certificate, then the public key of the issuer is the identifier of the name space in which that name is defined.
          - |-
            However, if a SDSI name is ever to occur outside of a certificate, the name space within which it is defined must be identified. This gives rise to the Fully Qualified SDSI Name. That name is a public key followed by one or more names relative to that key. If there are two or more names, then the string of names is a SDSI name chain.
        on_error: "A name used outside a certificate without its name-space key has no defined meaning."
        on_error_basis: stated
        on_error_quotes:
          - |-
            the name space within which it is defined must be identified.
      - n: 6
        from: verifier
        to: verifier
        message: name-4-tuple
        action: "Resolve the name by 4-tuple reduction when the authority is used."
        invokes:
          - four-tuple-name-reduction
        basis: stated
        locator: "§6, §6.4"
        quotes:
          - |-
            Uses of names are replaced with simple definitions (keys or hashes), based on the name definitions available from reducing name 4-tuples.
        on_error: "A name with no definition stays unresolved."
        on_error_basis: inferred
    guards:
      - id: identifier-hygiene
        text: "Where global identifiers are unavoidable, use one with no recognisable sub-field, from a sparse space, so a person cannot fix on a familiar part and a typing error does not yield another valid identifier."
        basis: stated
        locator: "§2.4"
        quotes:
          - |-
            Where globally unique identifiers need to be used, perhaps the best ID is one that is uniform in appearance (such as a long number or random looking text string) so that it has no recognizable sub-field. It should also be large enough (from a sparse enough name space) that typographical errors would not yield another valid identifier.
    error_path_ids:
      - unqualified-name-outside-certificate
      - common-name-confusion
      - name-unresolved
  - name: key-management-via-name-certificates
    title: "Key replacement as certificate lifetime control, through a long-lived naming root key"
    locator: "§7, §7.3, §7.4, §7.5"
    kind: issuance
    status: described-pattern
    participants:
      - keyholder
      - issuer
      - verifier
    summary: >-
      SPKI has no way to declare a key bad. A key stops being empowered when
      its certificates lapse, and another key is empowered instead. To make
      that painless, authorizers grant to a fully qualified name that hangs off
      a long-lived, rarely used naming root key, and the keyholder re-points
      the name at a fresh working key whenever it likes. Granting to the root
      key directly also works but changes what can be delegated.
    steps:
      - n: 1
        from: keyholder
        to: keyholder
        message: name-certificate
        action: "With a long-lived naming root key, kept strong and off line and used rarely, issue a <name,key> certificate mapping the fully qualified name (name Kroot jim) to the current, shorter-lived key."
        basis: stated
        locator: "§7.3, §7.4"
        quotes:
          - |-
            This name could easily be issued by the named keyholder, for the purpose of key management only. In that case, there is no concern about access control being subverted by some third-party naming authority.
          - |-
            For a key to have a long lifetime, it needs to be strong against cryptanalytic attack and against theft. It should be used only on a trusted machine, running trusted software. It should not be used on an on-line machine. It should be used very rarely, so that the attacker has few opportunities to find the key in the clear where it can be stolen.
        on_error: "The name inherits the root key's lifetime: it is not permanent the way an inescapable name would be."
        on_error_basis: stated
        on_error_quotes:
          - |-
            That key has a lifetime like any other key, so this name has not achieved the kind of permanence (free from key lifetimes) that an inescapable name has. However, it appears to be our only alternative.
      - n: 2
        from: issuer
        to: keyholder
        message: authorization-certificate
        action: "Authorizers grant to the fully qualified name (model 1). With only one name under the root key, they may grant to the root key itself instead (model 2)."
        basis: stated
        locator: "§7.3, §7.5"
        quotes:
          - |-
            Therefore, in the construct: (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) jim) the name is not "jim" but rather "(name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) jim)"
          - |-
            If there is only one name descending from such a key, then one can dispense with the name. Authorizations can be assigned to the key itself, in raw SPKI style, rather than to some name defined under that key.
        on_error: "Model 2 without delegation TRUE leaves the root key unable to pass authority to a working key at all; model 1 lets it delegate at will through <name,key> certificates."
        on_error_basis: stated
        on_error_quotes:
          - |-
            directly, both without granting the permission to delegate, that key can delegate at will through <name,key> certificates in the former case and not delegate at all in the latter case.
      - n: 3
        from: keyholder
        to: keyholder
        message: name-certificate
        message_alternatives:
          - authorization-certificate
        action: "Roll the key over: the root key issues a new certificate to a new working key and lets the old one lapse. The old key is not declared bad; it just stops being empowered."
        basis: stated
        locator: "§7"
        quotes:
          - |-
            Rather than define a mechanism for declaring a key to be bad or replaced, SPKI defines a mechanism for giving certificates limited lifetimes so that they can be replaced. That is, under SPKI one does not declare a key to be bad but rather stops empowering it and instead empowers some other key.
          - |-
            The replacement of a key needs to be announced to those who would use the new key. It also needs to be accomplished smoothly, with a minimum of hassle.
        on_error: "unspecified in this document: the announcement the source calls for has no mechanism beyond the new certificate itself."
        on_error_basis: unspecified
      - n: 4
        from: verifier
        to: verifier
        message: name-4-tuple
        action: "Resolve (name Kroot jim) to the current key by name reduction, intersecting validity, then reduce the authorization."
        invokes:
          - four-tuple-name-reduction
          - four-tuple-validity-intersection
        basis: stated
        locator: "§6.4, §6.4.2"
        quotes:
          - |-
            Whenever a 4-tuple is used to reduce the subject (or part of the subject) of another tuple, its validity interval is intersected with that of the tuple holding the subject being reduced and the intersection is used in the resulting tuple.
        on_error: "Old name certificate expired and no new one presented: the name does not resolve."
        on_error_basis: inferred
    guards:
      - id: root-outlives-authorizations
        text: "Once the root key's lifetime exceeds that of any authorization granted through it, a succession of long-lived keys covers the keyholder indefinitely."
        basis: stated
        locator: "§7.4"
        quotes:
          - |-
            By the logic above, any name will hang off some public key. The job is then to increase the lifetime of that public key. Once a key lifetime exceeds the expected lifetime of any authorization granted through it, then a succession of new, long-lifetime keys can cover a keyholder forever.
      - id: routine-replacement
        text: "Keys are replaced routinely because theft is usually not noticed."
        basis: stated
        locator: "§7"
        quotes:
          - |-
            If the theft is noticed, then the key can be replaced as one would replace a credit card. More likely, the theft will not be noticed. To cover this case, keys are replaced routinely.
    error_path_ids:
      - unnoticed-key-theft
      - delegation-through-name-subject
      - name-unresolved
      - naming-authority-forgery
  - name: key-revocation-service
    title: "Key revocation service: an on-line party revokes a lost working key; master-key loss means re-issuance"
    locator: "§7.6, §5, §5.4"
    kind: exchange
    status: described-pattern
    participants:
      - keyholder
      - key-revocation-service
      - verifier
      - issuer
    summary: >-
      The certificate from the master key to the more temporary key carries an
      on-line validity test. Someone on line has to supply it; the user may
      hire a service with a staffed desk that takes reports of lost keys. The
      service can revoke the current key, never create one. Losing the master
      key itself is handled like a lost wallet: every upstream issuer
      re-issues.
    steps:
      - n: 1
        from: keyholder
        to: keyholder
        message: name-certificate
        message_alternatives:
          - authorization-certificate
        action: "The master key issues a certificate to the more temporary key: a <name,key> certificate in model 1, an authorization certificate delegating all rights in model 2."
        basis: stated
        locator: "§7.6"
        quotes:
          - |-
            In either of the models above, key |TLCgPLFlGTzgUbcaYLW8kGTEnUk=| will issue a certificate. In the first model, it will be a <name,key> certificate. In the second, it will be an authorization certificate delegating all rights through to the more temporary key.
        note: "Model 2 needs the master key's own incoming authorizations to carry delegation TRUE (§6.3, §7.5); inferred."
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 2
        from: keyholder
        to: keyholder
        message: online-test-specification
        action: "That certificate carries an on-line validity test (CRL, revalidation or one-time) and, as every SPKI certificate must, names who issues the confirmations: the hired service."
        basis: inferred
        locator: "§7.6, §5"
        quotes:
          - |-
            Either of those certificates might want an on-line validity test. Whether this test is in the form of a CRL, a re-validation or a one- time test, it will be supplied by some entity that is on-line.
          - |-
            However, in SPKI, the certificate issuer must specify the issuer of validity confirmations.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 3
        from: key-revocation-service
        to: verifier
        message: revalidation
        message_alternatives:
          - timed-crl
          - one-time-revalidation
        action: "Supply the on-line test results while the key stands."
        invokes:
          - timed-revalidation-check
          - timed-crl-check
          - one-time-revalidation
        basis: stated
        locator: "§7.6"
        quotes:
          - |-
            As the world moves to having all machines on-line all the time, this might be the user's machine.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 4
        from: keyholder
        to: key-revocation-service
        message: key-loss-report
        action: "Report the loss of the key, by phone to a desk staffed around the clock."
        basis: stated
        locator: "§7.6"
        quotes:
          - |-
            That service could run a 24x7 manned desk, to receive phone calls reporting loss of a key.
        on_error: "unspecified in this document; how the service authenticates the caller is not said."
        on_error_basis: unspecified
      - n: 5
        from: key-revocation-service
        to: verifier
        message: timed-crl
        message_alternatives:
          - revalidation
        action: "Revoke the current key: stop revalidating its certificate, or list it in the next timed CRL. The service cannot generate a replacement key."
        basis: stated
        locator: "§7.6, §5.4"
        quotes:
          - |-
            That authority would not have the power to generate a new key for the user, only to revoke a current one.
        note: "That revocation takes the form of withholding revalidations or listing in a CRL is inferred from §5. That a one-time test would reflect the revocation at once is inferred from §5.5, and is not part of the stated on_error."
        on_error: "Revocation takes effect only when the CRL or revalidation interval already issued expires."
        on_error_basis: stated
        on_error_quotes:
          - |-
            The next available time slot starts after this validity interval ends. That is the earliest one can revoke a certificate one learns to be false.
      - n: 6
        from: verifier
        to: verifier
        message: validity-conditions
        action: "The certificate's on-line test now fails (no valid revalidation, or a CRL listing it), so the temporary key yields no tuple."
        basis: inferred
        locator: "§5.2, §5.3"
        quotes:
          - |-
            no certificate that might use a CRL can be processed without a valid CRL
        on_error: "As in timed-crl-check and timed-revalidation-check."
        on_error_basis: inferred
      - n: 7
        from: keyholder
        to: keyholder
        message: name-certificate
        message_alternatives:
          - authorization-certificate
        action: "The master key empowers a new temporary key."
        basis: inferred
        locator: "§7"
        quotes:
          - |-
            under SPKI one does not declare a key to be bad but rather stops empowering it and instead empowers some other key.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 8
        from: issuer
        to: keyholder
        message: authorization-certificate
        action: "Worst case, the master key is lost: every issuer of authorizations through it issues new authorizations through the new master key and, if the old one was stolen, cancels all old authorizations through it."
        basis: stated
        locator: "§7.6"
        quotes:
          - |-
            If, in the worst case, a user loses his master key, then the same process that occurs today with lost wallets would apply. All issuers of authorizations through that master key would need to issue new authorizations through the new master key and, if the old master key had been stolen, cancel all old authorizations through that key.
        on_error: "unspecified in this document: no cancellation mechanism is given beyond certificate lifetimes and on-line tests."
        on_error_basis: unspecified
    error_path_ids:
      - temporary-key-lost
      - master-key-lost
      - revocation-latency
      - no-valid-revalidation
      - certificate-listed-in-crl
  - name: threshold-acl-membership-change
    title: "Threshold ACL subjects: K of N root keys for normal access, a larger K to edit the ACL itself"
    locator: "§7.7, §6.3.3, §1.1"
    kind: exchange
    status: described-pattern
    participants:
      - acl-owner
      - threshold-subordinate
      - prover
      - verifier
    summary: >-
      Long life needs redundancy and replacement. A threshold subject in place
      of a single root key gives redundancy, across algorithms as well as keys.
      Giving the ACL's own edit right to a larger threshold of the same keys
      gives replacement: a quorum of root keys can elect new members and
      retire failed or compromised ones. How the edit is requested and checked
      is not described.
    steps:
      - n: 1
        from: acl-owner
        to: verifier
        message: acl-entry
        action: "Put a threshold subject wherever a single root key would be: (k-of-n #03# #07# K1 ... K7) on normal entries, and (k-of-n #05# #07# K1 ... K7) on the entry granting (tag (acl-edit))."
        basis: stated
        locator: "§7.7"
        quotes:
          - |-
            An ACL needs to be access-controlled itself. Assume that the ACL includes an entry with authorization (tag (acl-edit))
          - |-
            Assume also that what might have been a single root authorization key, K1, is actually a threshold subject (k-of-n #03# #07# K1 K2 K3 K4 K5 K6 K7) used in any ACL entry granting a normal authorization.
          - |-
            That same ACL could have the subject of an (acl-edit) entry be (k-of-n #05# #07# K1 K2 K3 K4 K5 K6 K7)
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 2
        from: threshold-subordinate
        to: prover
        message: authorization-certificate
        action: "When a component fails or a key is assumed compromised, at least five of the seven root keyholders delegate their shares of the acl-edit authority to the same key."
        basis: inferred
        locator: "§7.7, §1.1"
        quotes:
          - |-
            Truly long lifetimes come from replacement, not just redundancy. As soon as a component fails (or a key is assumed compromised), it must be replaced.
          - |-
            K of those subordinate Subjects must agree (by delegating their shares along to the same object or key) for that power to be passed along.
        note: "For the shares to converge by delegation, the (acl-edit) entry must carry delegation TRUE (§6.3); inferred."
        on_error: "Fewer than five agree: the threshold is not met and the edit is not authorized."
        on_error_basis: inferred
      - n: 3
        from: prover
        to: verifier
        message: acl-edit-request
        message_alternatives:
          - certificate-sequence
        action: "Submit the edit with the certificates proving the acl-edit authority."
        basis: inferred
        locator: "§7.7"
        quotes:
          - |-
            This use of threshold subject would allow the set of root keys to elect new members to that set and retire old members.
        on_error: "unspecified in this document; the edit request is not defined."
        on_error_basis: unspecified
      - n: 4
        from: verifier
        to: verifier
        message: '5-tuple'
        action: "Reduce from the (acl-edit) entry; threshold-subject-reduction with K = 5 must leave a single tuple whose subject is the submitting key and whose authorization covers acl-edit."
        invokes:
          - threshold-subject-reduction
          - five-tuple-chain-reduction
        basis: inferred
        locator: "§6.3.3, §7.7"
        quotes:
          - |-
            A threshold subject is reduced to a single subject by selecting K of the N subjects and reducing each of those K to the same subject, through a sequence of certificates.
        on_error: "Threshold not met or an intersection fails: refuse the edit."
        on_error_basis: inferred
      - n: 5
        from: verifier
        to: verifier
        message: acl-entry
        action: "Rewrite the threshold subjects: add the elected member, remove the retired one."
        basis: stated
        locator: "§7.7"
        quotes:
          - |-
            In this manner, replacement is achieved alongside redundancy and the proper choice of K and N should allow threshold subject key lifetimes approaching infinity.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
    guards:
      - id: algorithm-redundancy
        text: "The keys of a threshold subject need not share an algorithm, so the redundancy covers algorithms as well as keys."
        basis: stated
        locator: "§7.7"
        quotes:
          - |-
            If we use a threshold subject in place of a single key subject, in an ACL (or a certificate), then we achieve redundancy immediately. This can be redundancy not only of keys but also of algorithms. That is, the keys in a threshold subject do not need to have the same algorithm.
    error_path_ids:
      - root-key-compromised
      - threshold-not-satisfied
      - validity-intersection-empty
      - authorization-intersection-empty
algorithms:
  - name: certificate-to-tuple-translation
    title: "Stage 1: verify a credential and translate it into 5-tuples or name 4-tuples"
    locator: "§6, §6.1, §6.2, §6.5, §3.4"
    status: example-processing-plan
    performed_by:
      - translator
    inputs:
      - name: credential
        messages:
          - authorization-certificate
          - name-certificate
          - attribute-certificate
          - acl-entry
          - translation-x509v1
          - translation-x509v3
          - translation-pgp
          - translation-sdsi-1-0
          - translation-ssl
        description: "One certificate or ACL entry."
      - name: online-test-results
        messages:
          - timed-crl
          - revalidation
          - one-time-revalidation
        description: "Results for the on-line tests the credential names, if any."
    outputs:
      - name: tuples
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "Zero or more tuples. Zero when verification fails."
    steps:
      - n: 1
        message: certificate
        action: "Verify the credential's signature."
        basis: stated
        locator: "§6"
        quotes:
          - |-
            Individual certificates are verified by checking their signatures and possibly performing other work.
        on_error: "No tuple. The source does not state the outcome."
        on_error_basis: inferred
      - n: 2
        message: certificate
        action: "Do the format's other work: on-line test results for SPKI and SDSI, a web-of-trust computation for PGP, and for X.509 whatever the documentation tied to the root key requires, possibly including the parent certificate and extensions."
        basis: stated
        locator: "§6"
        quotes:
          - |-
            The other work for SPKI or SDSI certificates might include processing of on-line test results
          - |-
            The other work for PGP certificates may include a web-of-trust computation.
          - |-
            The other work for X.509 certificates depends on the written documentation for that particular use of X.509 (typically tied to the root key from which the certificate descended) and could
          - |-
            involve checking information in the parent certificate as well as additional information in extensions of the certificate in question.
        on_error: "Failed chain validation or web-of-trust computation: no tuple."
        on_error_basis: inferred
      - n: 3
        message: validity-conditions
        action: "Give missing dates their defaults: a missing not-before is minus infinity, a missing not-after is plus infinity."
        basis: stated
        locator: "§6.1, §6.2"
        quotes:
          - |-
            Validity dates: a not-before date and a not-after date, where "date" means date and time. If the not-before date is missing from the source credential then minus infinity is assumed. If the not-after date is missing then plus infinity is assumed.
        on_error: "none; a missing date is not an error."
        on_error_basis: stated
      - n: 4
        message: validity-conditions
        action: "If on-line tests are involved, VIntersect the validity dates of their results with the credential's dates; the result is the tuple's dates."
        invokes:
          - vintersect
        basis: stated
        locator: "§6"
        quotes:
          - |-
            If on-line tests are involved in the certificate processing, then the validity dates of those on-line test results are intersected by VIntersect() [defined in 6.3.2, below] with the validity dates of the certificate to yield the dates in the certificate's tuple(s).
        on_error: "Empty intersection: no tuple."
        on_error_basis: inferred
      - n: 5
        message: sdsi-basic-name
        message_alternatives:
          - sdsi-compound-name
        action: "Qualify every local SDSI name in the credential with the issuer's key."
        invokes:
          - name-qualification
        basis: stated
        locator: "§2.8"
        quotes:
          - |-
            It is SDSI 1.0 convention, preserved in SPKI, that if a (local) SDSI name occurs within a certificate, then the public key of the issuer is the identifier of the name space in which that name is defined.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
      - n: 6
        message: '5-tuple'
        action: "Map the credential to tuples by the format rules in translation_rules."
        basis: stated
        locator: "§6.5"
        quotes:
          - |-
            The specific rules for those are given below.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
    translation_rules:
      - input: acl-entry
        output: "one 5-tuple <Self, subject, delegation, authorization, validity>"
        locator: "§1.1, §3.4, §6.1"
        basis: stated
        quotes:
          - |-
            However, a sample implementation is documented, as a certificate body minus the issuer field.
          - |-
            Issuer: a public key (or its hash), or the reserved word "Self".
      - input: authorization-certificate
        output: "one 5-tuple"
        locator: "§6.5.6"
        basis: stated
        quotes:
          - |-
            An SPKI certificate maps directly to one 4- or 5- tuple, depending respectively on whether it is a name certificate or carries an authorization.
      - input: name-certificate
        output: "one 4-tuple"
        locator: "§6.5.6"
        basis: stated
        quotes:
          - |-
            An SPKI certificate maps directly to one 4- or 5- tuple, depending respectively on whether it is a name certificate or carries an authorization.
      - input: translation-sdsi-1-0
        output: "one 4-tuple"
        locator: "§6.5.5"
        basis: stated
        quotes:
          - |-
            A SDSI 1.0 certificate maps directly to one 4-tuple.
      - input: translation-x509v1
        output: "4-tuple [Kroot, (name <leaf-name>), K1, validity] when the hierarchy's leaf names are unique under the root; otherwise [Kroot, (name CA1 CA2 ... CAk <leaf-name>), K1, validity], after verifying the chain by that chain's own rules"
        locator: "§6.5.1, §2.9"
        basis: stated
        quotes:
          - |-
            The original X.509 certificate is a <name,key> certificate. It translates directly to a name tuple. The form [Kroot, (name <leaf-name>), K1, validity] is used if the rules for that particular X.509 hierarchy is that all leaf names are unique, under that root. If uniqueness of names applies only to individual CAs in the X.509 hierarchy, then one must generate
          - |-
            [Kroot, (name CA1 CA2 ... CAk <leaf-name>), K1, validity] after verifying the certificate chain by the rules appropriate to that particular chain.
      - input: translation-pgp
        output: "after web-of-trust verification, one 4-tuple [Ki, name, K1, validity] per key Ki that signed the (UserID, key) pair"
        locator: "§6.5.2"
        basis: stated
        quotes:
          - |-
            A PGP certificate is a <name,key> certificate. It is verified by web-of-trust rules (as specified in the PGP documentation). Once verified, it yields name tuples of the form [Ki, name, K1, validity] where Ki is a key that signed that PGP (UserID,key) pair. There would be one tuple produced for each signature on the key, K1.
      - input: translation-x509v3
        output: "a name 4-tuple, explicit authorizations from extensions, or the implicit authorization (tag (*)); the actual set is fixed by the documentation for that line of certificates and produced by root-specific chain validation code"
        locator: "§6.5.3"
        basis: stated
        quotes:
          - |-
            An X.509v3 certificate may be used to declare a name. It might also declare explicit authorizations, by way of extensions. It might also declare an implicit authorization of the form (tag (*)). The actual set of tuples it yields depends on the documentation associated with that line of certificates.
          - |-
            As a result, it is likely that X.509v3 chains will have to be validated independently, by chain validation code specific to each root key. After that validation, that root-specific code can then generate the appropriate multiple tuples from the one certificate.
      - input: attribute-certificate
        output: "one or more 5-tuples with a fully qualified name (built from the Distinguished Name) as Subject, or with the key of an explicitly referenced ID certificate as Subject"
        locator: "§6.5.4"
        basis: stated
        quotes:
          - |-
            An X9.57 attribute certificate should yield one or more 5-tuples, with names as Subject. The code translating the attribute certificate will have to build a fully-qualified name to represent the Distinguished Name in the Subject. For any attribute certificates that refer to an ID certificate explicitly, the Subject of the 5-tuple can be the key in that ID certificate, bypassing the construction of name 4-tuples.
      - input: translation-ssl
        output: "5-tuples carrying implicit (tag (ssl)), (tag (dns <domain-name>)) for the server's DNS name, and (tag (us-crypto)) for the global-cert permission; a CA certificate translates to (tag (*)); a leaf server certificate to, for example, (tag (* set (ssl) (dns www.datafellows.com)))"
        locator: "§6.5.7"
        basis: stated
        quotes:
          - |-
            An SSL certificate carries a number of authorizations, some implicitly. The authorization: (tag (ssl)) is implicit. In addition, the server certificate carries a DNS name parameter to be matched against the DNS name of the web page to which the connection is being made. That might be encoded as: (tag (dns <domain-name>))
          - |-
            A CA certificate, used for SSL, would then need only to communicate down its certificate chain those permissions allocated in the ACL. Its tag might then translate to: (tag (*))
          - |-
            A leaf server certificate for the Datafellows server might, for example, have a tag field of the form: (tag (* set (ssl) (dns www.datafellows.com))) showing that it was empowered to do SSL and to operate from the given domain name, but not to use US crypto with a US browser.
      - input: acl-entry
        output: "SSL root key ACL entry (tag (* set (ssl) (dns (*)))), equivalent to (tag (* set (ssl) (dns))); with Commerce Department permission, (tag (* set (ssl) (dns) (us-crypto)))"
        locator: "§6.5.7"
        basis: stated
        quotes:
          - |-
            An ACL entry for an SSL root key would have the tag: (tag (* set (ssl) (dns (*)))) which by the rules of intersection is equivalent to: (tag (* set (ssl) (dns)))
          - |-
            unless that root key also had the permission from the US Commerce Department to grant us-crypto permission, in which case the root key would have: (tag (* set (ssl) (dns) (us-crypto)))
    failure_conditions:
      - id: signature-invalid
        condition: "signature does not verify"
        outcome: "no tuple"
        basis: inferred
        locator: "§6"
      - id: chain-validation-failed
        condition: "X.509 chain validation or PGP web-of-trust computation fails"
        outcome: "no tuple"
        basis: inferred
        locator: "§6.5.1, §6.5.2, §6.5.3"
      - id: no-valid-crl
        condition: "an on-line test the credential depends on has no valid result"
        outcome: "the credential cannot be processed"
        basis: stated
        locator: "§5.2"
        quotes:
          - |-
            no certificate that might use a CRL can be processed without a valid CRL
      - id: validity-intersection-empty
        condition: "on-line test validity and credential validity do not intersect"
        outcome: "no tuple"
        basis: inferred
        locator: "§6, §6.3.2"
  - name: name-qualification
    title: "Fully qualify a local name with the key of its name space"
    locator: "§2.8, §2.9, §6.5.4"
    status: example-processing-plan
    performed_by:
      - translator
    inputs:
      - name: name
        messages:
          - sdsi-basic-name
          - sdsi-compound-name
        description: "(name n1 ... nk), k at least 1, as it occurs in a credential or elsewhere."
      - name: issuer_key
        messages:
          - principal
          - hash
        description: "The public key (or its hash) of the credential's issuer, when the name occurs inside a credential."
    outputs:
      - name: fully_qualified_name
        messages:
          - sdsi-fully-qualified-name
          - x509-fully-qualified-name
        description: "(name K n1 ... nk): a public key followed by one or more names relative to it."
    steps:
      - n: 1
        message: sdsi-basic-name
        message_alternatives:
          - sdsi-compound-name
          - sdsi-fully-qualified-name
        action: "If the first element after the word name is already a key or a hash, the name is already fully qualified; keep it."
        basis: inferred
        locator: "§2.8"
        quotes:
          - |-
            That name is a public key followed by one or more names relative to that key.
        on_error: "none"
        on_error_basis: inferred
      - n: 2
        message: sdsi-fully-qualified-name
        action: "If the name occurs inside a credential, prefix the issuer's key: (name n1 ... nk) becomes (name K_issuer n1 ... nk)."
        basis: stated
        locator: "§2.8"
        quotes:
          - |-
            It is SDSI 1.0 convention, preserved in SPKI, that if a (local) SDSI name occurs within a certificate, then the public key of the issuer is the identifier of the name space in which that name is defined.
        on_error: "none"
        on_error_basis: inferred
      - n: 3
        message: sdsi-fully-qualified-name
        action: "If the name occurs outside any credential, it must already identify its name space."
        basis: stated
        locator: "§2.8"
        quotes:
          - |-
            However, if a SDSI name is ever to occur outside of a certificate, the name space within which it is defined must be identified.
        on_error: "An unqualified name outside a credential has no defined name space and cannot be used."
        on_error_basis: inferred
      - n: 4
        message: x509-fully-qualified-name
        action: "For an X.509 Distinguished Name, produce (name <root key> <leaf name>) when leaf names are unique under the root, otherwise (name <root key> <CA(1)> ... <CA(k)> <leaf name>) built from the certificate chain; for an X9.57 attribute certificate, build such a name for the Distinguished Name in the Subject."
        basis: stated
        locator: "§2.9, §6.5.4"
        quotes:
          - |-
            Therefore, every X.509 name should be expressed as the pair (name <root key> <leaf name>) if all leaf names descending from that root are unique. If uniqueness is enforced only within each individual CA, then one would build a Fully Qualified Name chain from an X.509 certificate chain, yielding the form (name <root key> <CA(1)> <CA(2)> ... <CA(k)> <leaf name>).
        on_error: "unspecified in this document."
        on_error_basis: unspecified
    source_examples:
      - id: fully-qualified-sdsi-name
        locator: "§2.8"
        expected: |-
          (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) jim therese)
        quotes:
          - |-
            (name (hash sha1 |TLCgPLFlGTzgUbcaYLW8kGTEnUk=|) jim therese) is a fully qualified SDSI name, using the SHA-1 hash of a public key as the global identifier defining the name space and anchoring this name string.
    failure_conditions:
      - id: unqualified-name-outside-certificate
        condition: "a local name occurs outside a credential with no name-space key"
        outcome: "unusable"
        basis: inferred
        locator: "§2.8"
  - name: four-tuple-name-reduction
    title: "Name reduction with prover-ordered 4-tuples: replace the name just defined by its definition"
    locator: "§6.4, §6.4.2"
    status: example-processing-plan
    performed_by:
      - verifier
      - crc-issuer
    inputs:
      - name: T
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "The tuple whose subject (or a subordinate subject of it) is the fully qualified name (name K1 N R1 ... Rm), m at least 0."
      - name: F
        messages:
          - name-4-tuple
        description: "The next name 4-tuple in the prover's order: issuer K1', name N', subject Def, validity VF."
    outputs:
      - name: T_prime
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "T with the name replaced, validity intersected, delegation and authorization unchanged."
    steps:
      - n: 1
        message: name-4-tuple
        action: "Check that F defines the head of the name: K1' equals K1 and N' equals N."
        basis: inferred
        locator: "§6.4"
        quotes:
          - |-
            In that case, the rule for name reduction is to replace the name just defined by its definition.
        on_error: "F does not apply to this name."
        on_error_basis: inferred
      - n: 2
        message: name-4-tuple
        action: "Class 1, Def is a key K2: the subject becomes (name K2 R1 ... Rm), or K2 itself when m is 0."
        basis: stated
        locator: "§6.4"
        quotes:
          - |-
            (name K1 N N1 N2 N3) + [(name K1 N) -> K2] -> (name K2 N1 N2 N3)
        note: "The m = 0 case, where the result is the bare key K2, is inferred from section 6 stage 2 (names are replaced by keys or hashes)."
        on_error: "none"
        on_error_basis: inferred
      - n: 3
        message: name-4-tuple
        action: "Class 2, Def is a name (name K2 N1 ... Nk): the subject becomes (name K2 N1 ... Nk R1 ... Rm). The name can temporarily grow."
        basis: stated
        locator: "§6.4"
        quotes:
          - |-
            (name K1 N Na Nb Nc) + [(name K1 N) -> (name K2 N1 N2 ... Nk)] -> (name K2 N1 N2 ... Nk Na Nb Nc)
          - |-
            With the second form of name definition, one might have names that temporarily grow.
        on_error: "none"
        on_error_basis: inferred
      - n: 4
        message: threshold-subject
        action: "Def is a threshold subject (allowed by §6.2, covered by neither class): replace the name by the threshold subject when m is 0."
        basis: inferred
        locator: "§6.2, §6.4"
        quotes:
          - |-
            Subject: a public key (or its hash), a name, or a threshold function of subordinate subjects. This defines the name.
          - |-
            There will be name 4-tuples in two different classes, those that define the name as a key and those that define the name as another name.
        on_error: "With m greater than 0 there is no defined result."
        on_error_basis: inferred
      - n: 5
        message: validity-conditions
        action: "Intersect F's validity with T's and use the result in T_prime; delegation and authorization of T do not change."
        invokes:
          - four-tuple-validity-intersection
        basis: stated
        locator: "§6.4.2"
        quotes:
          - |-
            Whenever a 4-tuple is used to reduce the subject (or part of the subject) of another tuple, its validity interval is intersected with that of the tuple holding the subject being reduced and the intersection is used in the resulting tuple. Since a 4-tuple contains no delegation or authorization fields, the delegation permission and authorization of the tuple being acted upon does not change.
        on_error: "Empty intersection: no T_prime."
        on_error_basis: inferred
      - n: 6
        message: name-4-tuple
        action: "Repeat with the next 4-tuple until the subject is a key or a hash. The verifier just follows the given order."
        basis: stated
        locator: "§6.4, §6"
        quotes:
          - |-
            If the prover is providing certificates in order, then the verifier need only do as it is told.
          - |-
            Uses of names are replaced with simple definitions (keys or hashes), based on the name definitions available from reducing name 4-tuples.
        on_error: "Sequence exhausted with the subject still a name: unresolved."
        on_error_basis: inferred
    source_examples:
      - id: name-reduction-class-1
        locator: "§6.4"
        expression: |-
          (name K1 N N1 N2 N3) + [(name K1 N) -> K2]
        expected: |-
          (name K2 N1 N2 N3)
        quotes:
          - |-
            (name K1 N N1 N2 N3) + [(name K1 N) -> K2] -> (name K2 N1 N2 N3)
      - id: name-reduction-class-2
        locator: "§6.4"
        expression: |-
          (name K1 N Na Nb Nc) + [(name K1 N) -> (name K2 N1 N2 ... Nk)]
        expected: |-
          (name K2 N1 N2 ... Nk Na Nb Nc)
        quotes:
          - |-
            (name K1 N Na Nb Nc) + [(name K1 N) -> (name K2 N1 N2 ... Nk)] -> (name K2 N1 N2 ... Nk Na Nb Nc)
    failure_conditions:
      - id: name-definition-mismatch
        condition: "the next 4-tuple does not define the head (K1, N) of the name"
        outcome: "the 4-tuple does not apply; under prover order the chain fails"
        basis: inferred
        locator: "§6.4"
      - id: validity-intersection-empty
        condition: "VIntersect of the 4-tuple's and the tuple's validity is empty"
        outcome: "no resulting tuple"
        basis: inferred
        locator: "§6.4.2"
      - id: name-unresolved
        condition: "the ordered 4-tuples run out before the subject is a key"
        outcome: "the subject stays a name and no following 5-tuple can satisfy S1 = I2"
        basis: inferred
        locator: "§6"
  - name: unordered-pool-name-reduction
    title: "Name reduction from an unordered pool: apply only 4-tuples that define a name as a key"
    locator: "§6.4"
    status: example-processing-plan
    performed_by:
      - verifier
      - crc-issuer
    inputs:
      - name: pool
        messages:
          - name-4-tuple
        description: "An unordered set of name 4-tuples."
      - name: subjects
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "Tuples whose subjects are names to reduce."
    outputs:
      - name: reduced
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "The tuples with names reduced to keys wherever the pool defines them."
    steps:
      - n: 1
        message: name-4-tuple
        action: "Classify the pool: class 1 defines a name as a key, class 2 defines a name as another name."
        basis: stated
        locator: "§6.4"
        quotes:
          - |-
            There will be name 4-tuples in two different classes, those that define the name as a key and those that define the name as another name.
        on_error: "A 4-tuple whose subject is a threshold subject fits neither class; this procedure says nothing about it."
        on_error_basis: inferred
      - n: 2
        message: name-4-tuple
        action: "Apply only class 1 4-tuples to names."
        basis: stated
        locator: "§6.4"
        quotes:
          - |-
            If the verifier is operating from an unordered pool of tuples, then a safe rule for name reduction is to apply only those 4-tuples that define a name as a key.
        on_error: "none"
        on_error_basis: inferred
      - n: 3
        message: name-4-tuple
        action: "Bring class 2 4-tuples into class 1: reduce the subject name of each with class 1 4-tuples (intersecting validity each time) until it is a key; the result is a new class 1 4-tuple for the same (K1, N)."
        invokes:
          - four-tuple-validity-intersection
        basis: stated
        locator: "§6.4"
        quotes:
          - |-
            Such applications should bring 4-tuples that started out in class (2) into class (1), and eventually reduce all names to keys.
        note: "The mechanics (reduce the class 2 subject with class 1 tuples, intersect validity, add the result to the pool) are inferred."
        on_error: "A class 2 4-tuple whose subject cannot be reduced stays class 2 and is never applied."
        on_error_basis: inferred
      - n: 4
        message: name-4-tuple
        action: "Repeat steps 2 and 3 until no new class 1 4-tuple appears."
        basis: inferred
        locator: "§6.4"
        quotes:
          - |-
            Any naming loops are avoided by this process.
        on_error: "none; loops cannot form because only names-to-keys definitions are ever applied."
        on_error_basis: stated
    failure_conditions:
      - id: name-unresolved
        condition: "no chain of class 1 definitions reaches a key"
        outcome: "the name stays unresolved"
        basis: inferred
        locator: "§6.4"
      - id: naming-loop
        condition: "class 2 definitions refer to each other in a cycle"
        outcome: "avoided: such definitions are never applied directly"
        basis: stated
        locator: "§6.4"
        quotes:
          - |-
            Any naming loops are avoided by this process.
    notes:
      - "A name defined by several class 1 4-tuples (a group, §2.10) reduces to several keys; each is a separate result (inferred)."
  - name: four-tuple-validity-intersection
    title: "4-tuple validity intersection: name reduction narrows validity and nothing else"
    locator: "§6.4.2"
    status: example-processing-plan
    performed_by:
      - verifier
      - crc-issuer
    inputs:
      - name: T
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "The tuple holding the subject being reduced, with validity VT, delegation D (5-tuple only) and authorization A (5-tuple only)."
      - name: F
        messages:
          - name-4-tuple
        description: "The 4-tuple used for the reduction, with validity VF."
    outputs:
      - name: T_prime
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "Validity VIntersect(VT, VF); D and A exactly as in T."
    steps:
      - n: 1
        message: validity-conditions
        action: "Set the resulting tuple's validity to VIntersect(VT, VF)."
        invokes:
          - vintersect
        basis: stated
        locator: "§6.4.2"
        quotes:
          - |-
            its validity interval is intersected with that of the tuple holding the subject being reduced and the intersection is used in the resulting tuple.
        on_error: "Empty intersection: no resulting tuple."
        on_error_basis: inferred
      - n: 2
        message: '5-tuple'
        action: "Leave delegation and authorization unchanged."
        basis: stated
        locator: "§6.4.2"
        quotes:
          - |-
            Since a 4-tuple contains no delegation or authorization fields, the delegation permission and authorization of the tuple being acted upon does not change.
        on_error: "none"
        on_error_basis: stated
    failure_conditions:
      - id: validity-intersection-empty
        condition: "VIntersect(VT, VF) fails"
        outcome: "no resulting tuple"
        basis: inferred
        locator: "§6.4.2, §6.3.2"
    notes:
      - "Because delegation passes through unchanged, a key reached by name resolution inherits the delegation bit of the tuple that named it; this is the mechanism behind the §7.5 observation that a name subject can be re-pointed at will (inferred)."
  - name: four-tuple-threshold-subject-reduction
    title: "Reduce the names inside a threshold subject, optionally leaving it in threshold form"
    locator: "§6.4.1"
    status: example-processing-plan
    performed_by:
      - verifier
      - crc-issuer
    inputs:
      - name: T
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "A tuple whose subject is a threshold subject with some subordinate subjects that are names."
      - name: four_tuples
        messages:
          - name-4-tuple
        description: "Name 4-tuples."
      - name: mode
        description: "full (continue into threshold-subject-reduction) or partial (stop with the subject still in threshold form)."
    outputs:
      - name: T_prime
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "Mode partial: T with named subordinates replaced by keys, validity intersected, still a threshold subject. Mode full: the single tuple of threshold-subject-reduction."
    steps:
      - n: 1
        message: name-4-tuple
        action: "Reduce each named subordinate subject independently with 4-tuples, as each subordinate is handled separately in §6.3.3."
        invokes:
          - four-tuple-name-reduction
        basis: stated
        locator: "§6.4.1"
        quotes:
          - |-
            Some of a threshold subject's subordinate subjects might be names. Those names must be reduced by application of 4-tuples. The name reduction process proceeds independently on each name in the subordinate subject as indicated in 6.3.3 above.
        on_error: "A subordinate name that cannot be resolved cannot count toward K."
        on_error_basis: inferred
      - n: 2
        message: validity-conditions
        action: "Intersect validity for every 4-tuple applied; do not intersect delegation or authorization."
        invokes:
          - four-tuple-validity-intersection
        basis: stated
        locator: "§6.4.1"
        quotes:
          - |-
            There is no delegation- or authorization-intersection involved, only a validity- intersection during name reduction.
        on_error: "Empty validity intersection: no resulting tuple."
        on_error_basis: inferred
      - n: 3
        message: threshold-subject
        action: "Mode partial: stop here and leave the subject in threshold form; a CRC service might do this."
        basis: stated
        locator: "§6.4.1"
        quotes:
          - |-
            One can reduce individual named subjects in a threshold subject and leave the subject in threshold form, if one desires.
          - |-
            This might be used by a service that produces Certificate Result Certificates [see 6.7].
        on_error: "none"
        on_error_basis: inferred
      - n: 4
        message: threshold-subject
        action: "Mode full: continue with threshold-subject-reduction."
        invokes:
          - threshold-subject-reduction
        basis: stated
        locator: "§6.4.1"
        quotes:
          - |-
            as indicated in 6.3.3 above.
        on_error: "As in threshold-subject-reduction."
        on_error_basis: inferred
    failure_conditions:
      - id: name-unresolved
        condition: "a named subordinate subject has no definition"
        outcome: "that subordinate cannot count toward K"
        basis: inferred
        locator: "§6.4.1"
  - name: five-tuple-reduction
    title: "The 5-tuple reduction rule"
    locator: "§6.3"
    status: example-processing-plan
    performed_by:
      - verifier
      - crc-issuer
    inputs:
      - name: T1
        messages:
          - '5-tuple'
        description: "<I1,S1,D1,A1,V1>, the tuple nearer the ACL."
      - name: T2
        messages:
          - '5-tuple'
        description: "<I2,S2,D2,A2,V2>, the next tuple in the prover's order. The rule is not commutative."
    outputs:
      - name: T
        messages:
          - '5-tuple'
        description: "<I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)>"
    steps:
      - n: 1
        message: threshold-subject
        action: "If S1 is a threshold subject, use threshold-subject-reduction instead."
        invokes:
          - threshold-subject-reduction
        basis: stated
        locator: "§6.3"
        quotes:
          - |-
            If S1 is a threshold subject, there is a slight modification to this rule, as described below in section 6.3.3.
        on_error: "As in threshold-subject-reduction."
        on_error_basis: inferred
      - n: 2
        message: '5-tuple'
        action: "Require S1 = I2."
        basis: stated
        locator: "§6.3"
        quotes:
          - |-
            The two 5-tuples: <I1,S1,D1,A1,V1> + <I2,S2,D2,A2,V2> yield <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)> provided the two intersections succeed, S1 = I2 and D1 = TRUE
        note: "How a key compares with a hash of a key is not defined; comparing them as the same principal, by hashing the key with the hash's algorithm, is inferred. S1 still a name, or the hash of an object, can never equal an issuer, which is always a key, a key hash or Self."
        on_error: "The rule does not apply; no tuple."
        on_error_basis: inferred
      - n: 3
        message: '5-tuple'
        action: "Require D1 = TRUE."
        basis: stated
        locator: "§6.3"
        quotes:
          - |-
            D1 = TRUE
        on_error: "The rule does not apply; no tuple."
        on_error_basis: inferred
      - n: 4
        message: authorization-tag
        action: "Compute A = AIntersect(A1, A2)."
        invokes:
          - aintersect
        basis: stated
        locator: "§6.3"
        quotes:
          - |-
            the two intersections succeed,
        on_error: "AIntersect fails: no tuple."
        on_error_basis: stated
        on_error_quotes:
          - |-
            the two intersections succeed,
      - n: 5
        message: validity-conditions
        action: "Compute V = VIntersect(V1, V2)."
        invokes:
          - vintersect
        basis: stated
        locator: "§6.3"
        quotes:
          - |-
            the two intersections succeed,
        on_error: "VIntersect fails: no tuple."
        on_error_basis: stated
        on_error_quotes:
          - |-
            the two intersections succeed,
      - n: 6
        message: '5-tuple'
        action: "Return <I1, S2, D2, A, V>."
        basis: stated
        locator: "§6.3"
        quotes:
          - |-
            <I1,S2,D2,AIntersect(A1,A2),VIntersect(V1,V2)>
        on_error: "none"
        on_error_basis: inferred
    failure_conditions:
      - id: subject-issuer-mismatch
        condition: "S1 is not I2"
        outcome: "no tuple"
        basis: stated
        locator: "§6.3"
        quotes:
          - |-
            S1 = I2
      - id: delegation-not-permitted
        condition: "D1 is not TRUE"
        outcome: "no tuple"
        basis: stated
        locator: "§6.3"
        quotes:
          - |-
            D1 = TRUE
      - id: authorization-intersection-empty
        condition: "AIntersect(A1, A2) fails"
        outcome: "no tuple"
        basis: stated
        locator: "§6.3, §6.3.1"
        quotes:
          - |-
            the two intersections succeed,
      - id: validity-intersection-empty
        condition: "VIntersect(V1, V2) fails"
        outcome: "no tuple"
        basis: stated
        locator: "§6.3, §6.3.2"
        quotes:
          - |-
            the two intersections succeed,
    notes:
      - "The result keeps D2, the second tuple's bit. Since D1 must be TRUE, this equals D1 AND D2 (inferred)."
      - "The issuer of the result is always I1, so a chain started from an ACL entry keeps Issuer Self to the end (inferred)."
  - name: five-tuple-chain-reduction
    title: "Fold the prover's 5-tuples into the ACL entry's tuple, left to right"
    locator: "§6, §6.3, §6.3.4"
    status: example-processing-plan
    performed_by:
      - verifier
      - crc-issuer
    inputs:
      - name: T0
        messages:
          - '5-tuple'
        description: "The 5-tuple of the anchoring ACL entry, <Self, S0, D0, A0, V0>."
      - name: chain
        messages:
          - '5-tuple'
        description: "T1 ... Tn in the prover's order, names already reduced or reduced as they are met."
    outputs:
      - name: result
        messages:
          - '5-tuple'
        description: "The final authorization result <Self, Sn, Dn, A, V>, or failure."
    steps:
      - n: 1
        message: '5-tuple'
        action: "Start the accumulator at T0."
        basis: inferred
        locator: "§1.1"
        quotes:
          - |-
            ACL: an Access Control List: a list of entries that anchors a certificate chain.
        on_error: "none"
        on_error_basis: inferred
      - n: 2
        message: '5-tuple'
        action: "For each Ti in order: if the accumulator's subject is a name, reduce it first; if it is a threshold subject, apply threshold-subject-reduction; otherwise apply five-tuple-reduction(accumulator, Ti)."
        invokes:
          - five-tuple-reduction
          - threshold-subject-reduction
          - four-tuple-name-reduction
        basis: stated
        locator: "§6.3, §6.3.4"
        quotes:
          - |-
            All reduction operations are in the order provided by the prover.
        note: "The fold structure is inferred from the binary rule plus the prover's ordering."
        on_error: "Any step fails: stop; there is no result."
        on_error_basis: inferred
      - n: 3
        message: '5-tuple'
        action: "Return the accumulator as the final authorization result."
        basis: stated
        locator: "§6"
        quotes:
          - |-
            Authorization 5-tuples are then reduced to a final authorization result.
        on_error: "none"
        on_error_basis: inferred
    failure_conditions:
      - id: misordered-or-incomplete-sequence
        condition: "the next tuple does not chain from the accumulator"
        outcome: "no result; the verifier does not search for another order"
        basis: inferred
        locator: "§6.3.4"
    notes:
      - "The final delegation bit does not limit exercise (§4.1.4); it matters only to a later issuer."
      - "Several kinds of permission from different root keys need several folds, combined by the application (§6.5.7)."
  - name: aintersect
    title: "AIntersect: intersection of authorization S-expressions"
    locator: "§6.3.1"
    status: example-processing-plan
    performed_by:
      - verifier
      - crc-issuer
    inputs:
      - name: A1
        messages:
          - authorization-tag
        description: "An authorization S-expression, in the examples wrapped as (tag ...)."
      - name: A2
        messages:
          - authorization-tag
        description: "A second authorization S-expression."
    outputs:
      - name: A
        messages:
          - authorization-tag
        description: "The intersection, or failure."
    definitions:
      - form: "list (x1 ... xn)"
        meaning: "all lists that start with those elements; additional elements restrict"
        basis: stated
        quotes:
          - |-
            AIntersect() is normal set intersection, when *-forms are defined as they are above and a normal list is taken to mean all lists that start with those elements.
          - |-
            This means that additional elements of a list must restrict the permission granted.
      - form: "(*)"
        meaning: "every S-expression and byte string"
        basis: stated
        quotes:
          - |-
            stands for the set of all S-expressions and byte-strings. In other words, it will match anything. When intersected with anything, the result is that other thing. [The AIntersect rule about lists of different length treats a
          - |-
            list as if it had enough (*) entries implicitly appended to it to match the length of another list with which it was being intersected.]
      - form: "(* set <tag-expr>*)"
        meaning: "the elements listed"
        basis: stated
        quotes:
          - |-
            stands for the set of elements listed in the *-form.
      - form: "(* prefix <byte-string>)"
        meaning: "every byte string that starts with the one given"
        basis: stated
        quotes:
          - |-
            stands for the set of all byte strings that start with the one given in the *-form.
      - form: "(* range <ordering> <lower-limit>? <upper-limit>?)"
        meaning: "every byte string between the limits under the ordering alpha, numeric, time, binary or date"
        basis: stated
        quotes:
          - |-
            stands for the set of all byte strings lexically (or numerically) between the two limits. The ordering parameter (alpha, numeric, time, binary, date) specifies the kind of strings allowed.
    steps:
      - n: 1
        message: authorization-tag
        action: "If either operand is (*), return the other."
        basis: stated
        locator: "§6.3.1"
        quotes:
          - |-
            When intersected with anything, the result is that other thing.
        on_error: "none"
        on_error_basis: inferred
      - n: 2
        message: authorization-tag
        action: "Two byte strings: equal gives that string, otherwise fail."
        basis: inferred
        locator: "§6.3.1"
        quotes:
          - |-
            Two authorizations intersect by matching, element for element.
        on_error: "Fail."
        on_error_basis: inferred
      - n: 3
        message: authorization-tag
        action: "Two lists (neither a *-form): pad the shorter with (*) to the longer's length, intersect element by element (recursively, the type element included), fail if any element fails, and return the list of element results, as long as the longer list."
        basis: stated
        locator: "§6.3.1"
        quotes:
          - |-
            If one list is longer than the other but match at all elements where both lists have elements, then the longer list is the result of the intersection.
          - |-
            list as if it had enough (*) entries implicitly appended to it to match the length of another list with which it was being intersected.]
        note: "Recursion into sub-lists and *-forms is inferred from the examples."
        on_error: "Fail."
        on_error_basis: inferred
      - n: 4
        message: authorization-tag
        action: "(* set e1 ... en) with X: intersect each ei with X (each fj, when X is also a set) and keep the successes in the first operand's order, without duplicates. None gives failure; one gives that result alone; several give (* set results)."
        basis: inferred
        locator: "§6.3.1"
        quotes:
          - |-
            AIntersect( (tag (* set read write (foo bla) delete)), (tag (* set write read) ) ) evaluates to (tag (* set read write))
          - |-
            AIntersect( (tag (* set read write (foo bla) delete)), (tag read ) ) evaluates to (tag read)
        note: "Whether a set with one surviving member is written as that member or as a one-element set is not stated; the two are the same set."
        on_error: "Fail when no member survives."
        on_error_basis: inferred
      - n: 5
        message: authorization-tag
        action: "(* prefix p) with (* prefix q): if q starts with p return (* prefix q); if p starts with q return (* prefix p); otherwise fail."
        basis: inferred
        locator: "§6.3.1"
        quotes:
          - |-
            AIntersect( (tag (* prefix http://www.clark.net/pub/)), (tag (* prefix http://www.clark.net/pub/cme/html/)) ) evaluates to (tag (* prefix http://www.clark.net/pub/cme/html/))
        on_error: "Fail."
        on_error_basis: inferred
      - n: 6
        message: authorization-tag
        action: "(* prefix p) with a byte string s: s if s starts with p, otherwise fail."
        basis: inferred
        locator: "§6.3.1"
        quotes:
          - |-
            stands for the set of all byte strings that start with the one given in the *-form.
        on_error: "Fail."
        on_error_basis: inferred
      - n: 7
        message: authorization-tag
        action: "(* range ord lo hi) with a byte string s: s if s lies within the given limits under ord, otherwise fail."
        basis: inferred
        locator: "§6.3.1"
        quotes:
          - |-
            AIntersect( (tag (* range numeric ge #30# le #39# )), (tag #26#) ) fails to intersect.
        note: "The example uses limit operators ge and le that the form's own syntax line does not show; the full operator set and how numeric order applies to byte strings are not given."
        on_error: "Fail."
        on_error_basis: stated
      - n: 8
        message: authorization-tag
        action: "A prefix or range form, or a byte string, with a list: fail, since those forms denote byte strings and a byte string is not a list."
        basis: inferred
        locator: "§6.3.1"
        quotes:
          - |-
            stands for the set of all byte strings lexically (or numerically) between the two limits.
        on_error: "Fail."
        on_error_basis: inferred
      - n: 9
        message: authorization-tag
        action: "Any other pair of *-forms (range with range, range with prefix): the result is the set intersection, but the source gives no way to write it."
        basis: stated
        locator: "§6.3.1"
        quotes:
          - |-
            AIntersect() is normal set intersection, when *-forms are defined as they are above and a normal list is taken to mean all lists that start with those elements.
        on_error: "unspecified in this document."
        on_error_basis: unspecified
    source_examples:
      - id: aintersect-ftp-narrowing
        locator: "§6.3.1"
        expression: |-
          (ftp (host ftp.clark.net)) with (ftp (host ftp.clark.net) (dir /pub/cme))
        expected: |-
          (ftp (host ftp.clark.net) (dir /pub/cme))
        quotes:
          - |-
            (ftp (host ftp.clark.net)) might imply that the keyholder would be allowed ftp access to all directories on ftp.clark.net, with all kinds of access (read, write, delete, ...). This is more general (allows more access) than (ftp (host ftp.clark.net) (dir /pub/cme)) which would allow all kinds of access but only in the directory specified. The intersection of the two would be the second.
      - id: aintersect-star
        locator: "§6.3.1"
        expression: |-
          AIntersect( (tag (ftp ftp.clark.net cme (* set read write))), (tag (*)) )
        expected: |-
          (tag (ftp ftp.clark.net cme (* set read write)))
        quotes:
          - |-
            AIntersect( (tag (ftp ftp.clark.net cme (* set read write))), (tag (*)) ) evaluates to (tag (ftp ftp.clark.net cme (* set read write)))
      - id: aintersect-set-set
        locator: "§6.3.1"
        expression: |-
          AIntersect( (tag (* set read write (foo bla) delete)), (tag (* set write read) ) )
        expected: |-
          (tag (* set read write))
        quotes:
          - |-
            AIntersect( (tag (* set read write (foo bla) delete)), (tag (* set write read) ) ) evaluates to (tag (* set read write))
      - id: aintersect-set-string
        locator: "§6.3.1"
        expression: |-
          AIntersect( (tag (* set read write (foo bla) delete)), (tag read ) )
        expected: |-
          (tag read)
        quotes:
          - |-
            AIntersect( (tag (* set read write (foo bla) delete)), (tag read ) ) evaluates to (tag read)
      - id: aintersect-prefix-prefix
        locator: "§6.3.1"
        expression: |-
          AIntersect( (tag (* prefix http://www.clark.net/pub/)), (tag (* prefix http://www.clark.net/pub/cme/html/)) )
        expected: |-
          (tag (* prefix http://www.clark.net/pub/cme/html/))
        quotes:
          - |-
            AIntersect( (tag (* prefix http://www.clark.net/pub/)), (tag (* prefix http://www.clark.net/pub/cme/html/)) ) evaluates to (tag (* prefix http://www.clark.net/pub/cme/html/))
      - id: aintersect-range-fails
        locator: "§6.3.1"
        expression: |-
          AIntersect( (tag (* range numeric ge #30# le #39# )), (tag #26#) )
        expected: |-
          failure
        quotes:
          - |-
            AIntersect( (tag (* range numeric ge #30# le #39# )), (tag #26#) ) fails to intersect.
      - id: aintersect-trailing-star-equivalence
        locator: "§6.5.7"
        expression: |-
          (tag (* set (ssl) (dns (*))))
        expected: |-
          equivalent to (tag (* set (ssl) (dns)))
        quotes:
          - |-
            An ACL entry for an SSL root key would have the tag: (tag (* set (ssl) (dns (*)))) which by the rules of intersection is equivalent to: (tag (* set (ssl) (dns)))
    failure_conditions:
      - id: authorization-intersection-empty
        condition: "the two operands share no element"
        outcome: "fails to intersect; the enclosing reduction yields nothing"
        basis: stated
        locator: "§6.3.1"
        quotes:
          - |-
            fails to intersect.
    notes:
      - "Application-specific meanings need application-specific reduction code; AIntersect is the shared semantics."
  - name: vintersect
    title: "VIntersect: validity intersection, with on-line tests evaluated now or deferred"
    locator: "§6.3.2, §6.1, §6"
    status: example-processing-plan
    performed_by:
      - verifier
      - crc-issuer
    inputs:
      - name: X
        messages:
          - validity-conditions
        description: "(Xmin, Xmax)"
      - name: Y
        messages:
          - validity-conditions
        description: "(Ymin, Ymax)"
      - name: online_tests
        messages:
          - online-test-specification
        description: "The on-line tests the certificate is subject to, if any."
      - name: mode
        description: "immediate (evaluate each test now) or deferred (carry the union forward), the latter for a Certificate Result Certificate."
    outputs:
      - name: V
        messages:
          - validity-conditions
        description: "(Vmin, Vmax), plus in deferred mode the union of pending on-line tests; or failure."
    steps:
      - n: 1
        message: validity-conditions
        action: "Read a missing not-before as minus infinity and a missing not-after as plus infinity."
        basis: stated
        locator: "§6.1"
        quotes:
          - |-
            If the not-before date is missing from the source credential then minus infinity is assumed. If the not-after date is missing then plus infinity is assumed.
        on_error: "none"
        on_error_basis: stated
      - n: 2
        message: validity-conditions
        action: "Vmin = max(Xmin, Ymin); Vmax = min(Xmax, Ymax)."
        basis: stated
        locator: "§6.3.2"
        quotes:
          - |-
            V = VIntersect( X, Y ) is defined as Vmin = max( Xmin, Ymin ) Vmax = min( Xmax, Ymax ) and if Vmin > Vmax, then the intersection failed.
        on_error: "none"
        on_error_basis: stated
      - n: 3
        message: validity-conditions
        action: "If Vmin > Vmax the intersection fails. Vmin = Vmax is not a failure."
        basis: stated
        locator: "§6.3.2"
        quotes:
          - |-
            and if Vmin > Vmax, then the intersection failed.
        note: "That equal bounds succeed follows from the strict comparison; it is what lets a one-time revalidation's zero-length interval (§5.5) pass."
        on_error: "The intersection failed."
        on_error_basis: stated
      - n: 4
        message: online-test-specification
        action: "Immediate mode: evaluate each on-line test the certificate is subject to and intersect the validity interval it carries with the certificate's."
        basis: stated
        locator: "§6.3.2"
        quotes:
          - |-
            The full SPKI VIntersect() also deals with online tests. In the most straight-forward implementation, each online test to which a certificate is subject is evaluated. Each such test carries with it a validity interval, in terms of dates. That validity interval is intersected with any present in the certificate, to yield a new, current validity interval.
        on_error: "A test that fails, or whose interval does not intersect, leaves no valid interval."
        on_error_basis: inferred
      - n: 5
        message: online-test-specification
        action: "Deferred mode: gather the on-line tests present in each certificate, carry their union in the accumulating tuples, and evaluate them at the end of the process."
        basis: stated
        locator: "§6.3.2"
        quotes:
          - |-
            It is possible for an implementation of VIntersect() to gather up online tests that are present in each certificate and include the union of all those tests in the accumulating tuples. In this case, the evaluation of those online tests is deferred until the end of the process.
        on_error: "A deferred test that fails at the end invalidates the result."
        on_error_basis: inferred
    source_examples:
      - id: vintersect-definition
        locator: "§6.3.2"
        expression: |-
          V = VIntersect( X, Y )
        expected: |-
          Vmin = max( Xmin, Ymin ), Vmax = min( Xmax, Ymax ), failure if Vmin > Vmax
        quotes:
          - |-
            V = VIntersect( X, Y ) is defined as Vmin = max( Xmin, Ymin ) Vmax = min( Xmax, Ymax ) and if Vmin > Vmax, then the intersection failed.
    failure_conditions:
      - id: validity-intersection-empty
        condition: "Vmin > Vmax"
        outcome: "the intersection failed"
        basis: stated
        locator: "§6.3.2"
        quotes:
          - |-
            and if Vmin > Vmax, then the intersection failed.
      - id: non-monotonic-time
        condition: "dates not expressed in a monotonic form"
        outcome: "the rules do not hold"
        basis: stated
        locator: "§6.3.2"
        quotes:
          - |-
            These rules assume that daytimes are expressed in a monotonic form, as they are in SPKI.
  - name: threshold-subject-reduction
    title: "Threshold subject reduction: K of N subordinate subjects must reach the same subject"
    locator: "§6.3.3, §6.3, §1.1"
    status: example-processing-plan
    performed_by:
      - verifier
      - crc-issuer
    inputs:
      - name: T
        messages:
          - '5-tuple'
        description: "<I, (k-of-n K N S1 ... SN), D, A, V> with 0 < K <= N; the source's own notation is (k-of-n #03# #07# K1 ... K7)."
      - name: chains
        messages:
          - '5-tuple'
          - name-4-tuple
        description: "For each selected subordinate, the tuples that reduce it, in the prover's order."
    outputs:
      - name: T_prime
        messages:
          - '5-tuple'
        description: "One tuple <I, S, D', A', V'> replacing the list of subordinate tuples, S being the subject the K branches share."
    steps:
      - n: 1
        message: threshold-subject
        action: "Check 0 < K <= N and that exactly N subordinate subjects are given."
        basis: stated
        locator: "§6.3.3"
        quotes:
          - |-
            A threshold subject is specified by two numbers, K and N [0<K<=N], and N subordinate subjects.
        on_error: "Malformed threshold subject: no reduction."
        on_error_basis: inferred
      - n: 2
        message: threshold-intermediate-form
        action: "Form N subordinate tuples, each a copy of T with only one subordinate subject: Ti = <I, Si, D, A, V>."
        basis: stated
        locator: "§6.3.3"
        quotes:
          - |-
            The intermediate form for a threshold subject is a copy of the tuple in which the threshold subject appears, but with only one of the subordinate subjects.
        on_error: "none"
        on_error_basis: inferred
      - n: 3
        message: threshold-intermediate-form
        action: "Select K of the N; set the N-K unselected subordinate tuples to (null)."
        basis: stated
        locator: "§6.3.3"
        quotes:
          - |-
            A threshold subject is reduced to a single subject by selecting K of the N subjects and reducing each of those K to the same subject, through a sequence of certificates. The (N-K) unselected subordinate subjects are set to (null).
        on_error: "none"
        on_error_basis: inferred
      - n: 4
        message: '5-tuple'
        action: "Reduce each selected subordinate tuple individually through its sequence of certificates (5-tuple reduction; names by 4-tuple reduction)."
        invokes:
          - five-tuple-reduction
          - four-tuple-threshold-subject-reduction
        basis: stated
        locator: "§6.3.3, §6.4.1"
        quotes:
          - |-
            Those subordinate tuples are reduced individually until the list of subordinate tuples has (N-K) (null) entries and K entries with the same subject.
        note: "Each delegation step in a branch is a 5-tuple reduction and so needs D = TRUE on the tuple before it, the threshold tuple's own D included; convergence through name resolution needs no delegation (inferred from §6.3 and §6.4.2)."
        on_error: "A branch that cannot be reduced cannot count toward K."
        on_error_basis: inferred
      - n: 5
        message: threshold-intermediate-form
        action: "Stop when the list holds N-K (null) entries and K entries with the same subject."
        basis: stated
        locator: "§6.3.3"
        quotes:
          - |-
            Those subordinate tuples are reduced individually until the list of subordinate tuples has (N-K) (null) entries and K entries with the same subject.
        on_error: "Fewer than K branches reach a common subject: the threshold is not met and there is no tuple."
        on_error_basis: inferred
      - n: 6
        message: '5-tuple'
        action: "Intersect the K tuples: VIntersect their validities, AIntersect their authorizations, and intersect their delegation bits (logical AND); the result replaces the list."
        invokes:
          - vintersect
          - aintersect
        basis: stated
        locator: "§6.3.3"
        quotes:
          - |-
            At that point, those K tuples are validity-, authorization- and delegation- intersected to yield the single tuple that will replace the list of tuples.
        note: "Delegation intersection is not defined in the source; logical AND is inferred."
        on_error: "An empty validity or authorization intersection: no tuple."
        on_error_basis: inferred
    failure_conditions:
      - id: threshold-parameters-invalid
        condition: "K or N outside 0 < K <= N, or the count of subordinate subjects is not N"
        outcome: "no reduction"
        basis: inferred
        locator: "§6.3.3"
      - id: threshold-not-satisfied
        condition: "fewer than K subordinate tuples reduce to one common subject"
        outcome: "no tuple"
        basis: inferred
        locator: "§6.3.3"
      - id: validity-intersection-empty
        condition: "the K branches' validities do not intersect"
        outcome: "no tuple"
        basis: inferred
        locator: "§6.3.3"
      - id: authorization-intersection-empty
        condition: "the K branches' authorizations do not intersect"
        outcome: "no tuple"
        basis: inferred
        locator: "§6.3.3"
    notes:
      - "Conceptually each subordinate subject receives 1/K of the power (§1.1)."
      - "The source gives a prover order for chains but not for the K branches of a threshold proof (inferred gap)."
design_options:
  - name: micali-hash-chain-validation
    locator: "§5.7.1"
    status: mentioned-not-defined
    protocol_defined: "no"
    summary: "Hash chains used to revalidate or revoke a certificate cheaply; patented. Mentioned only for its effect on the performance comparison of validity models."
    quotes:
      - |-
        Silvio Micali has patented a mechanism for using hash chains to revalidate or revoke a certificate inexpensively. This mechanism changes the performance requirements of those models and might therefore change the conclusion from a performance analysis [ECR].
  - name: verifier-decided-validity
    locator: "§5.7.2"
    status: not-adopted
    protocol_defined: "no"
    summary: "Rivest's reversal: the verifier, who bears the risk, decides how recent the issuer's information must be. Not reflected in the SPKI structure; any replacement may need inputs from both sides."
    quotes:
      - |-
        It should therefore be the verifier who decides what level of assurance he needs before accepting a credential. That verifier needs information from the issuer, and the more recent that information the better, but the decision is the verifier's in the end.
      - |-
        This line of thought deserves further consideration, but is not reflected in the SPKI structure definition. It might even be that both the issuer and the verifier have stakes in this decision, so that any replacement validity logic would have to include inputs from both.
  - name: inescapable-names
    locator: "§7.1, §2.5"
    status: rejected
    protocol_defined: "no"
    summary: "A certificate from an inescapable name to the current key, issuable by any CA, would make key management trivial; there are no inescapable names."
    quotes:
      - |-
        If keyholders had inescapable names [see section 2.5, above], then one could refer to them by those names and define a certificate to map from an inescapable name to the person's current key.
      - |-
        However, there are no inescapable names for keyholders.
  - name: single-naming-authority
    locator: "§7.2"
    status: rejected
    protocol_defined: "no"
    roles:
      - naming-authority
    error_path_ids:
      - naming-authority-forgery
    summary: "One global authority issuing names for key management could mint keys and certificates as anyone and take anyone's access; not likely to be tolerated."
    quotes:
      - |-
        One could conceivably have a governmental body or other entity that would issue names voluntarily to a keyholder, strictly for the purpose of key management. One would then receive all authorizations through that name. There would have to be only one such authority,
      - |-
        That authority then becomes able to create keys of its own and certificates to empower them as any individual, and through those false certificates acquire access rights of any individual in the world. Such power is not likely to be tolerated. Therefore, such a central authority is not likely to come to pass.
  - name: integer-delegation-depth
    locator: "§4.1.3, §4.1.4"
    status: rejected
    protocol_defined: "no"
    summary: "The original design; defeated because the right depth cannot be predicted and depth does not bound width."
    quotes:
      - |-
        The integer control option was the original design and has appeal, but was defeated by the inability to predict the proper depth of delegation. One can always need to go one more level down, by creating a temporary signing key (e.g., for use in a laptop). Therefore, the initially predicted depth could be significantly off.
  - name: no-delegation-control
    locator: "§4.1.1, §4.1.4"
    status: rejected
    protocol_defined: "no"
    summary: "Argued that a holder can lend its key or run a signing proxy anyway. Rejected on the assumption that users value their keys or hold them in hardware; the signing-oracle risk remains."
    quotes:
      - |-
        The argument in favor of no control is that if a keyholder is given permission to do something but not the permission to delegate it, then it is possible for that keyholder to loan out the empowered private key or to set up a proxy service, signing challenges or requests for the intended delegate.
      - |-
        The no control argument has logical appeal, but there remains the assumption that a user will value his or her private key enough not to loan it out or that the key will be locked in hardware where it can't be copied to any other user. This doesn't prevent the user from setting up a signing oracle, but lack of network connectivity might inhibit that mechanism.
  - name: restrict-delegator-exercise
    locator: "§4.2"
    status: rejected
    protocol_defined: "no"
    summary: "Barring a delegator from exercising buys nothing: it can delegate to a fresh key of its own."
    quotes:
      - |-
        Therefore, there was no benefit from attempting to restrict the exercise of a permission by someone permitted to delegate it.
  - name: aggregated-master-certificate
    locator: "§3.2"
    status: rejected
    protocol_defined: "no"
    summary: "One X.509v3 certificate holding all of an individual's attributes needs an issuer authoritative for all of them, shortens the certificate's life to its shortest attribute and builds a dossier; authorizations should be one per certificate."
    quotes:
      - |-
        Some propose issuing a master X.509v3 certificate to an individual and letting extensions hold all the attributes or authorizations the individual would need. This would require the issuer to be an authority on all of those authorizations.
      - |-
        For all of these reasons, it is desirable that authorizations be limited to one per certificate.
  - name: acl-with-group-certificates
    locator: "§4.3"
    status: argued-against
    protocol_defined: "no"
    summary: "SDSI 1.0 style ACLs naming groups defined by ID certificates can do the job, but the ACL grows huge and needs nested ACLs of its own; delegated authorization certificates keep the verifier's ACL to one entry."
    quotes:
      - |-
        One concern with defining an authorization certificate is that the function can be performed by traditional <authorization,name> ACLs and <name,key> ID certificates defining groups. Such a mechanism was described in SDSI 1.0. A new mechanism needs to add value or it just complicates life for the developer.
      - |-
        Consider the ACL itself. Not only would it be potentially huge, demanding far more storage than the firewall would otherwise require, but it would also need its own ACL.
error_paths:
  - id: signature-invalid
    trigger: "A certificate's signature does not verify."
    detected_by: verifier
    flows:
      - authorization-decision
    outcome: "The certificate is not mapped to a tuple and takes no part in the computation."
    basis: inferred
    locator: "§6"
    quotes:
      - |-
        Individual certificates are verified by checking their signatures and possibly performing other work.
  - id: chain-validation-failed
    trigger: "An X.509 chain fails the rules for its root, or a PGP certificate fails the web-of-trust computation."
    detected_by: translator
    flows:
      - authorization-decision
    outcome: "No tuples from that certificate."
    basis: inferred
    locator: "§6.5.1, §6.5.2, §6.5.3"
    quotes:
      - |-
        As a result, it is likely that X.509v3 chains will have to be validated independently, by chain validation code specific to each root key.
  - id: no-valid-crl
    trigger: "A certificate that might use a CRL has no valid CRL (missing, expired, or not signed by the listed key)."
    detected_by: verifier
    flows:
      - timed-crl-check
      - authorization-decision
    outcome: "The certificate cannot be processed."
    basis: stated
    locator: "§5.2"
    quotes:
      - |-
        Under these rules, no certificate that might use a CRL can be processed without a valid CRL and no CRL can be issued to show up as a surprise at the verifier.
  - id: crl-signed-by-wrong-key
    trigger: "A CRL is signed by a key other than the one the certificate lists."
    detected_by: verifier
    flows:
      - timed-crl-check
    outcome: "Not a valid CRL for this certificate; treated as no valid CRL."
    basis: inferred
    locator: "§5.2"
    quotes:
      - |-
        The certificate must list the key (or its hash) that will sign the CRL and may give one or more locations where that CRL might be fetched.
  - id: certificate-listed-in-crl
    trigger: "The certificate appears in the valid current CRL."
    detected_by: verifier
    flows:
      - timed-crl-check
      - authorization-decision
      - key-revocation-service
    outcome: "Revoked; no tuple. Stated only for the ruled-out anti-matter CRL (annihilation); inferred for timed CRLs."
    basis: inferred
    locator: "§5.1, §5.2"
    quotes:
      - |-
        If the CRL encounters a certificate it has listed, it effectively annihilates that certificate.
  - id: crl-ranges-intersect
    trigger: "The issuer releases a CRL to take effect before the current CRL expires."
    detected_by: verifier
    flows:
      - timed-crl-check
    outcome: "The issuer has broken condition 3. What a verifier does about it is unspecified."
    basis: stated
    locator: "§5.2"
    quotes:
      - |-
        CRL validity date ranges must not intersect. That is, one may not issue a new CRL to take effect before the expiration of the CRL currently deployed.
  - id: zero-length-crl-interval
    trigger: "An issuer tries to give a CRL or revalidation a zero-length validity interval."
    detected_by: validity-confirmation-issuer
    flows:
      - timed-crl-check
      - timed-revalidation-check
    outcome: "Not possible: it would be out of date on arrival. Use a one-time revalidation."
    basis: stated
    locator: "§5.5"
    quotes:
      - |-
        Validity intervals of length zero are not possible. Since transmission takes time, by the time a CRL was received by the verifier, it would be out of date and unusable.
  - id: verifier-clock-inaccurate
    trigger: "The verifier's clock is wrong."
    detected_by: verifier
    flows:
      - timed-crl-check
    outcome: "The computation stays deterministic but may give a result the issuer did not intend."
    basis: stated
    locator: "§5.2"
    quotes:
      - |-
        This yields a deterministic validity computation, independent of clock skew, although clock inaccuracies in the verifier may produce a result not desired by the issuer.
  - id: no-valid-revalidation
    trigger: "A certificate subject to timed revalidation has no current revalidation from the named issuer."
    detected_by: verifier
    flows:
      - timed-revalidation-check
      - authorization-decision
      - key-revocation-service
    outcome: "The certificate cannot be processed, by the §5.2 rules §5.3 adopts."
    basis: inferred
    locator: "§5.3"
    quotes:
      - |-
        As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2).
  - id: certificate-not-in-revalidation
    trigger: "The current revalidation does not list the certificate."
    detected_by: verifier
    flows:
      - timed-revalidation-check
    outcome: "Not revalidated; no tuple."
    basis: inferred
    locator: "§5.3"
    quotes:
      - |-
        Typically a revalidation would list only one certificate (the one of interest), although it might list a set of certificates (to save digital signature effort).
  - id: one-time-nonce-mismatch
    trigger: "The nonce in a one-time revalidation differs from the one submitted."
    detected_by: verifier
    flows:
      - one-time-revalidation
    outcome: "Treated as a replay; the instrument is not used."
    basis: inferred
    locator: "§5.5"
    quotes:
      - |-
        That nonce gets returned in the signed revalidation instrument, in order to prevent replay attacks.
  - id: one-time-revalidation-reused
    trigger: "A one-time revalidation is offered in a later authorization computation."
    detected_by: verifier
    flows:
      - one-time-revalidation
    outcome: "Invalid: it has no lifetime beyond the computation it was obtained for."
    basis: stated
    locator: "§5.5"
    quotes:
      - |-
        This form of revalidation has no lifetime beyond the current authorization computation.
  - id: short-lived-replacement-unavailable
    trigger: "No replacement short-lived certificate can be fetched before the current one expires."
    detected_by: requester
    flows:
      - short-lived-certificate-renewal
    outcome: "The keyholder is no longer empowered once the not-after date passes."
    basis: inferred
    locator: "§5.6"
    quotes:
      - |-
        If one wants to issue short-lived certificates, SPKI defines a kind of online test statement to tell the user of the certificate where a replacement short-lived certificate might be fetched.
  - id: anti-matter-crl-suppressed
    trigger: "An adversary blocks delivery of a new anti-matter CRL."
    detected_by: adversary
    flows:
      - anti-matter-crl-dissemination
    outcome: "Revocation is prevented without detection; the reason SPKI rules the mechanism out."
    basis: stated
    locator: "§5.1"
    quotes:
      - |-
        Given an active adversary, it can also be a security hole. That is, an adversary can prevent revocation of a given certificate by preventing the delivery of new CRLs.
  - id: validity-intersection-empty
    trigger: "VIntersect gives Vmin > Vmax."
    detected_by: verifier
    flows:
      - authorization-decision
      - timed-crl-check
      - timed-revalidation-check
      - one-time-revalidation
      - short-lived-certificate-renewal
      - threshold-acl-membership-change
    outcome: "The intersection failed; the reduction that needed it yields nothing."
    basis: stated
    locator: "§6.3.2"
    quotes:
      - |-
        and if Vmin > Vmax, then the intersection failed.
  - id: authorization-intersection-empty
    trigger: "AIntersect finds no common element."
    detected_by: verifier
    flows:
      - authorization-decision
      - delegation-by-certificate-issuance
      - threshold-acl-membership-change
    outcome: "Fails to intersect; the reduction yields nothing."
    basis: stated
    locator: "§6.3.1"
    quotes:
      - |-
        fails to intersect.
  - id: subject-issuer-mismatch
    trigger: "The subject of one tuple is not the issuer of the next."
    detected_by: verifier
    flows:
      - authorization-decision
    outcome: "The reduction rule does not apply."
    basis: stated
    locator: "§6.3"
    quotes:
      - |-
        S1 = I2
  - id: delegation-not-permitted
    trigger: "A tuple with delegation FALSE is followed by a tuple its subject issued."
    detected_by: verifier
    flows:
      - authorization-decision
      - delegation-by-certificate-issuance
    outcome: "The reduction rule does not apply."
    basis: stated
    locator: "§6.3"
    quotes:
      - |-
        D1 = TRUE
  - id: threshold-not-satisfied
    trigger: "Fewer than K subordinate subjects reduce to one common subject."
    detected_by: verifier
    flows:
      - authorization-decision
      - threshold-acl-membership-change
    outcome: "No tuple from the threshold subject."
    basis: inferred
    locator: "§6.3.3"
    quotes:
      - |-
        Those subordinate tuples are reduced individually until the list of subordinate tuples has (N-K) (null) entries and K entries with the same subject.
  - id: threshold-parameters-invalid
    trigger: "A threshold subject with K or N outside 0 < K <= N, or with a number of subordinate subjects other than N."
    detected_by: verifier
    flows:
      - authorization-decision
    outcome: "Malformed; no reduction."
    basis: inferred
    locator: "§6.3.3"
    quotes:
      - |-
        A threshold subject is specified by two numbers, K and N [0<K<=N], and N subordinate subjects.
  - id: name-unresolved
    trigger: "A subject name has no defining 4-tuple."
    detected_by: verifier
    flows:
      - authorization-decision
      - attribute-plus-id-authorization
      - name-definition
      - key-management-via-name-certificates
    outcome: "The name is not replaced by a key, so no later 5-tuple can chain from it."
    basis: inferred
    locator: "§6, §6.4"
    quotes:
      - |-
        Uses of names are replaced with simple definitions (keys or hashes), based on the name definitions available from reducing name 4-tuples.
  - id: name-definition-mismatch
    trigger: "The next ordered 4-tuple does not define the head of the name being reduced."
    detected_by: verifier
    flows:
      - authorization-decision
    outcome: "The 4-tuple does not apply."
    basis: inferred
    locator: "§6.4"
    quotes:
      - |-
        In that case, the rule for name reduction is to replace the name just defined by its definition.
  - id: naming-loop
    trigger: "Name definitions refer to each other in a cycle."
    detected_by: verifier
    flows:
      - certificate-path-discovery
    outcome: "Avoided by applying only names-to-keys 4-tuples when working from an unordered pool."
    basis: stated
    locator: "§6.4"
    quotes:
      - |-
        Any naming loops are avoided by this process.
  - id: misordered-or-incomplete-sequence
    trigger: "The prover's sequence is out of order or missing a certificate."
    detected_by: verifier
    flows:
      - authorization-decision
      - certificate-path-discovery
    outcome: "A reduction does not apply and no authorization results; the verifier owes no search."
    basis: inferred
    locator: "§6.3.4"
    quotes:
      - |-
        That simplifies the job of the verifier, but leaves the job of finding the correct list of reductions to the prover.
  - id: no-path-found
    trigger: "The prover holds no ready sequence and finds no path."
    detected_by: prover
    flows:
      - certificate-path-discovery
    outcome: "unspecified; nothing to present."
    basis: inferred
    locator: "§6.3.4"
    quotes:
      - |-
        The general algorithm for finding the right certificate paths from a large set of unordered certificates has been solved[ELIEN], but might be used only rarely.
  - id: crc-issuer-not-empowered
    trigger: "A verifier is shown a Certificate Result Certificate whose issuer its ACL does not empower."
    detected_by: verifier
    flows:
      - certificate-result-certificate-issuance
    outcome: "unspecified; the CRC cannot chain from the verifier's ACL."
    basis: inferred
    locator: "§6.6"
    quotes:
      - |-
        The answer to the second computation can be put into a new certificate issued by the entity doing the computation.
  - id: deferred-online-test-fails
    trigger: "An on-line test carried forward in deferred mode fails when finally evaluated."
    detected_by: verifier
    flows:
      - certificate-result-certificate-issuance
    outcome: "The result depending on it is invalid."
    basis: inferred
    locator: "§6.3.2"
    quotes:
      - |-
        In this case, the evaluation of those online tests is deferred until the end of the process.
  - id: subverted-issuer
    trigger: "One issuer in an attribute-plus-ID path is subverted."
    detected_by: adversary
    flows:
      - attribute-plus-id-authorization
    outcome: "The attacker obtains the authorization; two issuers must be trusted instead of one."
    basis: stated
    locator: "§3.1, §8"
    quotes:
      - |-
        Each certificate has an issuer. If that issuer is subverted, then the attacker can gain access. In the former case, there is only one issuer to trust. In the latter case, there are two.
  - id: foreign-name-space
    trigger: "The attribute certificate and the ID certificate come from different name spaces."
    detected_by: verifier
    flows:
      - attribute-plus-id-authorization
    outcome: "Matching the name needs more than string comparison and may involve a human guess, open to accident or attack."
    basis: stated
    locator: "§8"
    quotes:
      - |-
        In the second case, linkage between the certificates is by name. If the name space of the issuer of the ID certificate is different from the name space of the issuer of the attribute
      - |-
        certificate, then one of the two issuers must use a foreign name space. The process of choosing the appropriate name from a foreign name space is more complex than string matching and might even involve a human guess. It is subject to mistakes. Such a mistake can be made by accident or be guided by an attacker.
  - id: common-name-confusion
    trigger: "A human picks a global ID by its familiar common-name part."
    detected_by: adversary
    flows:
      - name-definition
    outcome: "Mistakes, and with them an avenue for attack."
    basis: stated
    locator: "§2.4"
    quotes:
      - |-
        If a human being is part of the process (e.g., scanning a database of global IDs in order to find the ID of a specific person for the purpose of issuing an attribute certificate), then it is likely that the human operator would pay attention to the familiar portion of the ID (the common name) and pay less attention to the rest. Since the common name is not an adequate ID, this can lead to mistakes. Where there can be mistakes, there is an avenue for attack.
  - id: unqualified-name-outside-certificate
    trigger: "A local SDSI name is used outside a certificate without its name-space key."
    detected_by: verifier
    flows:
      - name-definition
    outcome: "The name space is unidentified; the name cannot be used."
    basis: stated
    locator: "§2.8"
    quotes:
      - |-
        However, if a SDSI name is ever to occur outside of a certificate, the name space within which it is defined must be identified.
  - id: key-lent-or-proxied
    trigger: "A keyholder without delegation lends its private key or signs on another's behalf."
    detected_by: adversary
    flows:
      - delegation-by-certificate-issuance
    outcome: "Undetectable by the protocol; accepted as a residual risk of boolean control."
    basis: stated
    locator: "§4.1.1, §4.1.4"
    quotes:
      - |-
        This doesn't prevent the user from setting up a signing oracle, but lack of network connectivity might inhibit that mechanism.
  - id: delegation-through-name-subject
    trigger: "Authority is granted with delegation FALSE to a name rather than a key."
    detected_by: verifier
    flows:
      - delegation-by-certificate-issuance
      - key-management-via-name-certificates
    outcome: "The name's definer can still pass the authority to any key by issuing <name,key> certificates; the delegation bit does not stop it."
    basis: stated
    locator: "§7.5"
    quotes:
      - |-
        directly, both without granting the permission to delegate, that key can delegate at will through <name,key> certificates in the former case and not delegate at all in the latter case.
  - id: temporary-key-lost
    trigger: "A keyholder loses its working key."
    detected_by: keyholder
    flows:
      - key-revocation-service
    outcome: "Reported to the revocation service, which revokes the current key; it cannot issue a new one."
    basis: stated
    locator: "§7.6"
    quotes:
      - |-
        That service could run a 24x7 manned desk, to receive phone calls reporting loss of a key. That authority would not have the power to generate a new key for the user, only to revoke a current one.
  - id: master-key-lost
    trigger: "A keyholder loses its master key."
    detected_by: keyholder
    flows:
      - key-revocation-service
    outcome: "Every issuer of authorizations through it re-issues through the new master key and, if it was stolen, cancels the old ones."
    basis: stated
    locator: "§7.6"
    quotes:
      - |-
        All issuers of authorizations through that master key would need to issue new authorizations through the new master key and, if the old master key had been stolen, cancel all old authorizations through that key.
  - id: revocation-latency
    trigger: "An issuer learns a certificate should be revoked while a timed CRL or revalidation is current."
    detected_by: validity-confirmation-issuer
    flows:
      - timed-crl-check
      - timed-revalidation-check
      - key-revocation-service
    outcome: "The revocation can take effect only when the current interval ends."
    basis: stated
    locator: "§5.4"
    quotes:
      - |-
        The next available time slot starts after this validity interval ends. That is the earliest one can revoke a certificate one learns to be false.
  - id: root-key-compromised
    trigger: "A root key in a threshold ACL subject fails or is assumed compromised."
    detected_by: acl-owner
    flows:
      - threshold-acl-membership-change
    outcome: "It must be replaced; a quorum of the remaining keys elects a replacement through the acl-edit entry."
    basis: stated
    locator: "§7.7"
    quotes:
      - |-
        As soon as a component fails (or a key is assumed compromised), it must be replaced.
  - id: unnoticed-key-theft
    trigger: "A key is stolen and nobody notices."
    detected_by: keyholder
    flows:
      - key-management-via-name-certificates
    outcome: "Covered only by routine replacement."
    basis: stated
    locator: "§7"
    quotes:
      - |-
        More likely, the theft will not be noticed. To cover this case, keys are replaced routinely.
  - id: non-monotonic-time
    trigger: "Dates are not expressed in a monotonic form."
    detected_by: verifier
    flows:
      - authorization-decision
    outcome: "The VIntersect rules no longer hold."
    basis: stated
    locator: "§6.3.2"
    quotes:
      - |-
        These rules assume that daytimes are expressed in a monotonic form, as they are in SPKI.
  - id: naming-authority-forgery
    trigger: "A single naming authority for key management turns on its users."
    detected_by: adversary
    flows:
      - key-management-via-name-certificates
    outcome: "It could empower its own keys as anyone; the design is rejected for that reason."
    basis: stated
    locator: "§7.2"
    quotes:
      - |-
        That authority then becomes able to create keys of its own and certificates to empower them as any individual, and through those false certificates acquire access rights of any individual in the world.
source_defects_and_ambiguities:
  - id: dangling-reference-6-7
    kind: defect
    locator: "§6.4.1"
    text: "Cites section 6.7 for Certificate Result Certificates; there is no section 6.7. CRCs are §6.6."
    quotes:
      - |-
        This might be used by a service that produces Certificate Result Certificates [see 6.7].
  - id: four-tuple-notation
    kind: inconsistency
    locator: "§6.2, §6.4, §6.5.1, §6.5.2"
    text: "The name 4-tuple is written three ways: as an element list with Name a byte string (§6.2), as [(name K1 N) -> K2] with issuer and name merged and no validity (§6.4), and as [Kroot, (name <leaf-name>), K1, validity] (§6.5). The X.509v1 chain form puts the compound name (name CA1 CA2 ... CAk <leaf-name>) where §6.2 says a byte string."
    quotes:
      - |-
        Name: a byte string
      - |-
        [(name K1 N) -> K2]
      - |-
        [Kroot, (name CA1 CA2 ... CAk <leaf-name>), K1, validity] after verifying the certificate chain by the rules appropriate to that particular chain.
  - id: threshold-four-tuples-unclassified
    kind: gap
    locator: "§6.2, §6.4"
    text: "A 4-tuple's subject may be a threshold function (§6.2), but §6.4 says there are two classes, key and name, and gives rules for those only."
    quotes:
      - |-
        Subject: a public key (or its hash), a name, or a threshold function of subordinate subjects. This defines the name.
      - |-
        There will be name 4-tuples in two different classes, those that define the name as a key and those that define the name as another name.
  - id: key-versus-hash-equality
    kind: ambiguity
    locator: "§6.3, §6.1, §2.7"
    text: "S1 = I2 is required, and either side may be a public key or its hash. Whether a key equals a hash of that key is not defined. §2.7 treats both as identifiers of the same keyholder, which supports comparing them as one principal."
    quotes:
      - |-
        Issuer: a public key (or its hash), or the reserved word "Self".
      - |-
        S1 = I2
      - |-
        If there exists a collision-free hash function, then a collision-free hash of the public key is also a globally unique identifier for the keyholder, and probably a shorter one than the public key.
  - id: delegation-intersection-undefined
    kind: gap
    locator: "§6.3.3"
    text: "The K branches are delegation-intersected, an operation defined nowhere. Logical AND is the evident reading."
    quotes:
      - |-
        At that point, those K tuples are validity-, authorization- and delegation- intersected to yield the single tuple that will replace the list of tuples.
  - id: threshold-delegation-bit
    kind: ambiguity
    locator: "§1.1, §6.3, §6.3.3"
    text: "Subordinate subjects agree by delegating their shares to a common key, which under §6.3 needs D = TRUE on the threshold tuple. §6.3.3 does not say so, and §7.7's acl-edit example never states its delegation bit."
    quotes:
      - |-
        K of those subordinate Subjects must agree (by delegating their shares along to the same object or key) for that power to be passed along.
  - id: threshold-proof-order
    kind: gap
    locator: "§6.3.4, §6.3.3"
    text: "Reductions follow the order the prover gives, a sequence; a threshold proof is a tree of K branches. No order or packaging is defined for the branches."
    quotes:
      - |-
        All reduction operations are in the order provided by the prover.
  - id: aintersect-cross-forms
    kind: gap
    locator: "§6.3.1"
    text: "No rule, and no way to write the result, for range with range, range with prefix, or prefix with set; no rule for whether a one-member set result is written bare. The range syntax shows optional limits but the example uses operators ge and le that are never defined, and numeric order over byte strings such as #30# is not explained."
    quotes:
      - |-
        (* range <ordering> <lower-limit>? <upper-limit>?)
      - |-
        AIntersect( (tag (* range numeric ge #30# le #39# )), (tag #26#) )
  - id: online-test-kinds-count
    kind: inconsistency
    locator: "§5, §5.6"
    text: "Section 5 says three kinds of on-line test are envisioned; §5.6 adds a fourth, the statement naming where a short-lived replacement can be fetched."
    quotes:
      - |-
        Three kinds of on-line tests are envisioned: CRL, re-validation and one-time.
      - |-
        SPKI defines a kind of online test statement
  - id: one-time-applicant
    kind: ambiguity
    locator: "§5.5"
    text: "Who applies for a one-time revalidation, and who chooses the nonce, is not said."
    quotes:
      - |-
        One applies for this on-line, one-time revalidation by submitting a request containing a nonce.
  - id: user-of-the-certificate
    kind: ambiguity
    locator: "§5.6"
    text: "The user of the certificate who fetches the replacement could be its keyholder or a verifier."
    quotes:
      - |-
        to tell the user of the certificate where a replacement short-lived certificate might be fetched.
  - id: timed-crl-listing-semantics
    kind: gap
    locator: "§5.1, §5.2"
    text: "The timed CRL rules never say that a listed certificate is rejected; only the ruled-out anti-matter design describes what a listing does. Nothing says what a verifier does on seeing two CRLs whose ranges intersect."
    quotes:
      - |-
        If the CRL encounters a certificate it has listed, it effectively annihilates that certificate.
      - |-
        CRL validity date ranges must not intersect.
  - id: revalidation-rules-by-reference
    kind: gap
    locator: "§5.3"
    text: "Revalidations follow the same rules as CRLs, but condition 1 speaks of the key that signs the CRL; the revalidation equivalent is left to the reader."
    quotes:
      - |-
        As with the CRL, SPKI demands that this process be deterministic and therefore that the revalidation follow the same rules listed above (in section 5.2).
  - id: deferred-tests-have-no-slot
    kind: gap
    locator: "§6.3.2, §6.1"
    text: "Deferred VIntersect carries a union of on-line tests in the accumulating tuples, but the 5-tuple of §6.1 has no element to hold them."
    quotes:
      - |-
        include the union of all those tests in the accumulating tuples.
  - id: crc-trust
    kind: gap
    locator: "§6.6"
    text: "A CRC answers under this ACL yet is signed by the computing entity. How a later verifier comes to accept that issuer, and what validity the CRC carries, is not said."
    quotes:
      - |-
        What is Subject S allowed to do, under this ACL and with this set of certificates?
      - |-
        The answer to the second computation can be put into a new certificate issued by the entity doing the computation.
  - id: order-needed-by-the-prover
    kind: ambiguity
    locator: "§6.4"
