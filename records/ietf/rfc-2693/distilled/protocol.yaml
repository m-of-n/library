    text: "(tag (* set (ssl) (dns www.datafellows.com))) could have been abbreviated as (tag (ssl www.datafellows.com)), the source says, but under §6.3.1 these are different sets: the second is one list in which the domain narrows ssl, and it would not reduce against an ACL entry for (dns) alone. The source concedes that separating them keeps the separate-root-key option open."
    quotes:
