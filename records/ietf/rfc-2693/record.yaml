distillation:
  standard: "FX-1"
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "146 verbatim entries N-001 to N-146, in source order, from 54 of the 68 headed sections (the Abstract and 67 numbered sections); the other 14 yield no entry and each says why in place. Every entry carries _[lowercase/implied]_ because the source has no BCP 14 keyword; a mechanical census of the lowercase modals (must 25 times in 22 entries, should 14 times in 12) is given for reconciliation with requirements.yaml. Five entries cross a page break and are flagged. Not reproduced: the References section that the bracketed citations resolve to, history, quotations and boilerplate."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "251 entries R-0001 to R-0251, all verb none: the source count and the extracted count are both 0, and the zero is measured and reconciled. RFC 2693 is a 1999 Experimental RFC that never cites RFC 2119, so the entries are its lowercase rules, definitions, computation rules and working-group decisions, under an inclusion rule written out in reconciliation. 250 stated, 1 inferred (R-0122); 152 testable yes, 58 partial, 41 no. R-0251, dropped by pass 1 and added by pass 2, is the one entry out of source order. Excluded by stated rule: overview, history, the camp arguments of 4.1.1 to 4.1.3, background mechanisms the source rules out or does not carry forward, and worked examples that state no rule of their own."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "RFC 2693 prints no formal grammar (no ABNF, ASN.1, CDDL, JSON Schema or BNF), so the directory holds 5 verbatim files of its informal definitions (names, subjects, tags, tuples, validity; 57 regions, each with its line range and sha256, none crossing a page break) plus spki-theory.derived.schema.json, a JSON Schema 2020-12 rendering of 63 productions tied to the sentences they encode. Source defects D-01 to D-13 are recorded, not repaired. The derived file is ours and must not be quoted as the RFC's schema; the concrete S-expression encoding is in draft-ietf-spki-cert-structure, not here."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "54 structures. Applicability is abstract and stated in-file: the source defines no wire format, no octet layout, no media type and no transport. Captured are the abstract structures decomposed to the fields the source names (5-tuple, name 4-tuple, certificate categories, ACL and ACL entry, validity conditions and every online-test instrument, threshold intermediate form, certificate sequence, Certificate Result Certificate), the S-expression shapes the examples print, and the field mappings of the eight 6.5 translations. constrained_by wired on every field. Absent because the source does not define them: field order, date syntax, key and signature representations, CRL and revalidation formats beyond 5, and any ACL entry format."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "Partial by the source's own framing: 6 calls its processing plan an example. 14 flows (authorization decision, delegation, path discovery, the 5 validity checks including the ruled-out anti-matter CRL, CRC issuance, attribute-plus-ID authorization, name definition and 3 key-management patterns), 11 algorithms (certificate translation, name qualification, the 4-tuple name, validity and threshold reductions, 5-tuple and chain reduction, AIntersect, VIntersect, threshold subject reduction), 9 design options the source weighs or rules out (among them integer delegation depth and the Micali and verifier-decided validity variants), 40 error paths and 21 source defects and ambiguities; protocol.md carries the prose and 25 Mermaid diagrams. Everything not literally in the source, including the access request, proof of possession and the reply, is marked inferred; not_defined lists what the document leaves out."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "16 machines and 136 transitions covering every lifecycle the source describes: the authorization computation and credential intake, validity intervals, timed and current CRLs, revalidation and one-time revalidation, short-lived renewal, the ruled-out anti-matter CRL, name, chain and threshold reduction, key empowerment, master-key loss and threshold root-key sets. Guards in M03, M08 and M13 made mutually exclusive and complete in pass 2; constrained_by wired in pass 3, with the transitions that quote only excluded text (5.1 anti-matter background, 7.6 revocation-service account) named. not_modelled and 26 open questions record what the source leaves unspecified."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "94 vectors: 58 whose input the source prints (all 34 S-expression display lines, every other example display, and 2 inline S-expressions) and 36 constructed from rules and scenarios the source states without a literal; count_reconciliation enumerates both by section, and examples/README.md lists the sections with no vector and why. Computed results sit under derived with in_source false. 4 source defects recorded on their vectors, among them 6.5.1 contradicting 6.2 on the name element and the dangling [see 6.7]. No vector has been run through an implementation."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "An audit of the inheritance from RFC 2693: 12 adopt, 8 adapt, 9 reject; a mapping row for every bears_on id plus DEC-002, DEC-003, ADR-0001 and ARCH-0001 4.1, with D-3 addressed (no header mapping, since the RFC defines no headers); 15 open questions, 13 to 15 being source defects found in pass 3. Main finding: DEC-004 option 1 cannot be implemented from 6.3.1 alone, and the notes list six rules a profile must add. R-M-10 boolean delegation adopted against rfc-9580's integer control. Glosses of our decisions are as the library restates them; ARCH-0001 itself was not reread, so a reviewer should check each row against its current text. Decides nothing."
      reviewed_by: ""
