usefulness:
  verdict: useful
  reason: "The direct ancestor of this architecture. Its 5-tuple and AIntersect are what R-M-05 and R-M-08 restate, its ACL is R-M-02's unsigned local root, and its boolean-delegation decision is R-M-10. DEC-004 option 1 IS this document's tag language."
  assessed: "2026-10-08"
