        source: "§List of Certificate Uses, p.11"
        quote: 'the people generating the keys (e.g., administrators) will change, and you will no longer want them to be able to certify'
        inferred: true
        inferred_reason: The departing certifier's key is what the certificate is about; the field is ours.
      - name: effect
        type: constraint
        required: unspecified
        required_reason: Brainstorm item; no structure given.
        constrained_by:
          - "rfc-2692#R-0143"
          - "rfc-2692#R-0144"
        source: "§List of Certificate Uses, p.11"
        quote: 'On the other hand, you will usually also not want all keys they have generated to expire.'
        inferred: false
        layout: Ends the right to certify from now on, without invalidating what was certified before.
      - name: notary-timestamp
        type: unspecified
        required: unspecified
        required_reason: '"probably to be implemented together with notary services"; not required.'
        constrained_by:
          - "rfc-2692#R-0145"
        source: "§List of Certificate Uses, p.11"
        quote: 'probably to be implemented together with notary services'
        inferred: true
        inferred_reason: >-
          A notary service would let a verifier tell certificates made before the expiration from
          those made after; the source does not say how notary services are involved.
    layout: None given.
    notes: Related to certification-right-cessation; the source does not say they are the same instrument.

