# --- Validity and CRLs ---------------------------------------------------------------------------

  - name: crl
    aliases:
      - certificate-revocation-list
      - minimal-crl
      - negative-online-validation
    locator: "§Validity and CRLs ¶1-¶5, p.4"
    encoding: 'abstract; "Its method of transmission is not specified."'
    normative_status: requirement
    source: "§Validity and CRLs ¶2, p.4"
    quote:
      - 'A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.  Its method of transmission is not specified.'
      - locator: "§Validity and CRLs ¶1, p.4"
        text: 'It may also be necessary to have on-line refinement of validity.  This is frequently achieved via a Certificate Revocation List (CRL) in previous certificate designs.'
      - locator: "§Validity and CRLs ¶3, p.4"
        text: 'A CRL is a negative statement.'
    fields:
      - name: revoked-certificates
        type: list-of-certificate-identifier
        required: true
        constrained_by:
          - "rfc-2692#R-0029"
          - "rfc-2692#R-0030"
        source: "§Validity and CRLs ¶2, p.4"
        quote: 'A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.'
        inferred: false
        layout: How a certificate is "identified uniquely" is not stated. Whether the list may be empty is not stated.
      - name: sequence-number
        type: sequence-number
        required: true
        constrained_by:
          - "rfc-2692#R-0024"
          - "rfc-2692#R-0027"
        source: "§Validity and CRLs ¶2, p.4"
        quote:
          - 'A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.'
          - 'If it encounters a previous CRL, as indicated by sequence number, then it annihilates that previous CRL.'
        inferred: false
        layout: Orders CRLs within a crl-sequence; a lower number is "previous". Representation and starting value not stated.
      - name: signature
        type: signature
        required: true
        constrained_by: []
        constrained_by_reason: 'A CRL''s signature is stated only in the minimal-CRL description (§Validity and CRLs ¶2, first sentence), which requirements.yaml excludes as describing the design the section rules out. No requirement names it.'
        source: "§Validity and CRLs ¶2, p.4"
        quote: 'A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.'
        inferred: false
        layout: >-
          Who signs the CRL is not stated, nor whether the certificate names the CRL signer (it must
          name where to find the CRL; see spki-certificate.crl-location).
      - name: validity-dates
        type: date-interval
        required: true
        condition: SPKI CRL (variant spki); absent from the minimal CRL
        constrained_by:
          - "rfc-2692#R-0026"
          - "rfc-2692#R-0031"
          - "rfc-2692#R-0032"
        source: "§Validity and CRLs ¶2, ¶5, p.4"
        strength: must
        quote:
          - 'the CRL must carry explicit validity dates'
          - 'Any CRL or revalidation instrument must have its own lifetime.  A lifetime of 0 is not possible because of communication delays and clock skews'
        inferred: true
        inferred_reason: >-
          The source states both "explicit validity dates" (¶2) and "its own lifetime" (¶5) for a
          CRL; that they are the same field is our reading. Non-zero length follows from "A
          lifetime of 0 is not possible".
    variants:
      - name: minimal
        fields: [revoked-certificates, sequence-number, signature]
        normative_status: descriptive
        constrained_by:
          - "rfc-2692#R-0024"
        source: "§Validity and CRLs ¶2, p.4"
        quote: 'Such a CRL leads to non-deterministic program behavior.'
        inferred: false
        layout: >-
          The CRL as first described. The source rejects it as it stands because its processing is
          non-deterministic.
      - name: spki
        fields: [revoked-certificates, sequence-number, signature, validity-dates]
        normative_status: requirement
        condition: if SPKI uses CRLs
        constrained_by:
          - "rfc-2692#R-0025"
          - "rfc-2692#R-0026"
          - "rfc-2692#R-0027"
          - "rfc-2692#R-0028"
        source: "§Validity and CRLs ¶2, p.4"
        quote: 'Under this set of requirements, behavior of certificate validation is deterministic (aside from the question of clock skew).'
        inferred: true
        inferred_reason: >-
          That the SPKI CRL keeps the three minimal fields and adds validity dates is our reading of
          "Therefore, we take as a requirement that" following the minimal-CRL description. The
          same requirement adds two rules outside the CRL itself: the certificate names where to
          find it (spki-certificate.crl-location) and successive CRLs do not overlap (crl-sequence).
    layout: >-
      No layout and no transmission method. A signed list of revoked certificate identifiers with a
      sequence number, and in SPKI explicit validity dates.
    notes: >-
      Processing, quoted for protocol.yaml and state-machine.yaml: "If it encounters some
      certificate that it lists, then it annihilates that certificate.  If it encounters a previous
      CRL, as indicated by sequence number, then it annihilates that previous CRL." Ambiguity: "it"
      has no clear antecedent; the sentences read as if the CRL were the actor. Read as: a verifier
      holding the CRL treats a listed certificate as invalid, and a higher-numbered CRL supersedes
      a lower one (inferred). The memo calls the CRL "a negative statement" and SPKI "should
      support both positive and negative on-line validations" (¶4); this file takes the CRL as the
      negative on-line validation (alias negative-online-validation), which the source does not
      state in one sentence. "SPKI uses CRLs" is conditional: the memo does not require CRLs.

  - name: crl-sequence
    locator: "§Validity and CRLs ¶2, p.4"
    encoding: 'abstract'
    normative_status: requirement
    source: "§Validity and CRLs ¶2, p.4"
    quote: 'the dates of a sequence of CRLs must not overlap'
    fields:
      - name: crls
        type: list-of-crl
        required: true
        constrained_by:
          - "rfc-2692#R-0027"
        source: "§Validity and CRLs ¶2, p.4"
        quote: 'If it encounters a previous CRL, as indicated by sequence number, then it annihilates that previous CRL.'
        inferred: true
        inferred_reason: >-
          The source speaks of "a sequence of CRLs" and of a "previous CRL, as indicated by
          sequence number"; ordering the list by sequence-number is our reading.
      - name: non-overlap
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0027"
          - "rfc-2692#R-0028"
        source: "§Validity and CRLs ¶2, p.4"
        strength: must
        quote: 'the dates of a sequence of CRLs must not overlap'
        inferred: false
    layout: >-
      Not a transmitted structure: the series of CRLs one issuer produces for one certificate's CRL
      location (inferred scope; the source does not say whose sequence).
    notes: >-
      Not stated: whether the sequence may have gaps between one CRL's end and the next CRL's start,
      and what validity a certificate has during such a gap. Not stated: whether sequence-number
      order must agree with date order. Determinism is the stated aim: "Under this set of
      requirements, behavior of certificate validation is deterministic (aside from the question of
      clock skew)."

  - name: revalidation-instrument
    aliases:
      - positive-online-validation
      - revalidation
    locator: "§Validity and CRLs ¶3-¶5, p.4"
    encoding: 'abstract; not defined in this document'
    normative_status: should
    source: "§Validity and CRLs ¶4, p.4"
    quote:
      - 'SPKI should support both positive and negative on-line validations.'
      - locator: "§Validity and CRLs ¶3, p.4"
        text: 'These have been replaced in the retail world by positive statements -- on-line validation of a single check, ATM card or credit card.'
      - locator: "§Validity and CRLs ¶5, p.4"
        text: 'Any CRL or revalidation instrument must have its own lifetime.'
    fields:
      - name: validated-certificate
        type: certificate-identifier
        required: unspecified
        required_reason: The source gives no fields for a revalidation instrument. The derived schema makes revalidation-instrument.validates required (inferred, gap G-05).
        constrained_by:
          - "rfc-2692#R-0030"
        source: "§Validity and CRLs ¶3, p.4"
        quote: 'on-line validation of a single check, ATM card or credit card'
        inferred: true
        inferred_reason: >-
          The retail analogy validates "a single" instrument; that an SPKI revalidation names the
          one certificate it validates is our reading.
      - name: lifetime
        type: lifetime
        required: true
        constrained_by:
          - "rfc-2692#R-0031"
          - "rfc-2692#R-0032"
        source: "§Validity and CRLs ¶5, p.4"
        strength: must
        quote: 'Any CRL or revalidation instrument must have its own lifetime.  A lifetime of 0 is not possible because of communication delays and clock skews, although one can consider an instrument whose lifetime is "one use" and which is delivered only as part of a challenge/response protocol.'
        inferred: false
        layout: Non-zero; or "one use" (one-use-instrument).
      - name: signature
        type: signature
        required: unspecified
        required_reason: The source does not say a revalidation instrument is signed. The derived schema makes revalidation-instrument.signature required (inferred, gap G-05).
        constrained_by: []
        constrained_by_reason: 'No requirement names a signature on a revalidation instrument; the field is inferred by analogy with the CRL. R-0031, whose sentence the quote gives, constrains lifetime.'
        source: "§Validity and CRLs ¶5, p.4"
        quote: 'Any CRL or revalidation instrument must have its own lifetime.'
        inferred: true
        inferred_reason: >-
          An "instrument" a verifier relies on, by analogy with the CRL's signature; not stated.
    layout: >-
      None given. A positive statement that a certificate is currently valid, with its own lifetime.
    notes: >-
      Not stated: who issues it, how the verifier obtains it, whether the certificate names the
      revalidation service (the source requires a location only for CRLs; see
      spki-certificate.revalidation-location, inferred), and whether the verifier or the
      keyholder fetches it.

  - name: one-use-instrument
    locator: "§Validity and CRLs ¶5, p.4"
    encoding: 'abstract; delivered inside a challenge/response protocol the source does not define'
    normative_status: may
    source: "§Validity and CRLs ¶5, p.4"
    quote: 'A lifetime of 0 is not possible because of communication delays and clock skews, although one can consider an instrument whose lifetime is "one use" and which is delivered only as part of a challenge/response protocol.'
    fields:
      - name: lifetime
        type: literal
        value: one use
        required: true
        constrained_by:
          - "rfc-2692#R-0032"
        source: "§Validity and CRLs ¶5, p.4"
        quote: 'one can consider an instrument whose lifetime is "one use"'
        inferred: false
      - name: delivery
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0032"
        source: "§Validity and CRLs ¶5, p.4"
        quote: 'which is delivered only as part of a challenge/response protocol'
        inferred: false
      - name: challenge-binding
        type: unspecified
        required: unspecified
        required_reason: The source does not say how the instrument relates to the challenge.
        constrained_by:
          - "rfc-2692#R-0032"
        source: "§Validity and CRLs ¶5, p.4"
        quote: 'which is delivered only as part of a challenge/response protocol'
        inferred: true
        inferred_reason: >-
          A response in a challenge/response protocol answers a specific challenge; that the
          instrument carries or covers the challenge is our reading.
    layout: None given.
    notes: >-
      Ambiguity: "an instrument" follows "Any CRL or revalidation instrument", so the source does
      not say whether a one-use instrument is a CRL, a revalidation, or either. Inferred: a
      revalidation (a CRL answering one challenge would be a single-use negative statement, which
      the memo nowhere suggests). Tension: "A lifetime of 0 is not possible", yet "one use" is a
      lifetime with no duration; the source resolves this by tying it to delivery inside a
      challenge/response exchange.

  - name: one-use-challenge
    locator: "§Validity and CRLs ¶5, p.4"
    encoding: 'none given'
    normative_status: mentioned-only
    source: "§Validity and CRLs ¶5, p.4"
    quote: 'which is delivered only as part of a challenge/response protocol'
    inferred: true
    inferred_reason: >-
      The source names a challenge/response protocol, so a challenge exists; it names no challenge
      message, sender or content.
    constrained_by:
      - "rfc-2692#R-0032"
    fields_note: No fields. Listed so protocol.yaml can name the request that one-use-instrument answers.
    fields: []
    layout: None given.

  - name: online-validation-request
    locator: "§Validity and CRLs ¶4, p.4"
    encoding: 'none given'
    normative_status: mentioned-only
    source: "§Validity and CRLs ¶3-¶4, p.4"
    quote: 'SPKI should support both positive and negative on-line validations.'
