record: rfc-2692
reviewed_by: ""

# ---------------------------------------------------------------------------
applicability:
  summary: >-
    ABSTRACT, and that is a finding about the source, not a gap in this extraction. RFC 2692 is a
    requirements memo. It defines no wire format: no octet layout, no field order, no field tags,
    no grammar, no ASN.1, no S-expression, no media type, no transport and no IANA action, for the
    certificate or for any other instrument it names. Its Abstract says what it is: the WG
    "summarized that list of desires into requirements" and "This document presents that summary
    of requirements." What it does say about encoding is a set of constraints on a certificate
    format that it does not itself give, all in Implementation of Certificates: no library code for
    packing or parsing, and ASN.1 "is not to be used"; signed exactly as transmitted, with no
    reformatting before signature checking, although white space may be canonicalized on input if
    the format is text; an LR(0) grammar "if possible"; packing and parsing without recursion "if
    possible"; described as the structures a C or PASCAL programmer would write; a bare minimum of
    fields and an absolute minimum of optional fields. The quotes are below and in entry
    certificate-encoding-profile. For CRLs the source states outright that "Its method of
    transmission is not specified." POINTERS ONLY, no content imported from them: the charter
    deliverables ("public key certificate format, associated signature and other formats, and key
    acquisition protocols") are not in this memo. The certificate theory is RFC 2693 (library record
    rfc-2693). The concrete certificate, name, CRL and revalidation structures are in
    draft-ietf-spki-cert-structure (library record draft-ietf-spki-cert-structure), whose
    S-expression representation is RFC 9804 (library record rfc-9804). The SDSI name construct the
    memo asks SPKI to support is SDSI (library record sdsi-1-1). Whether those later documents meet
    the constraints captured here is a question for design-notes and for the cross-check pass; this
    file does not judge it. What this file captures: (a) the abstract SPKI certificate and the
    parts General Requirements and Validity and CRLs name (spki-certificate, keyholder-identifier,
    name-binding-certificate, sdsi-name); (b) the encoding and layout constraints, as one profile
    entry (certificate-encoding-profile); (c) the exchanges the memo names: keyholder to verifier
    (certificate-presentation) and the optional repository (repository-publication); (d) the
    validity instruments (crl, crl-sequence, revalidation-instrument, one-use-instrument,
    one-use-challenge); (e) every certificate kind or instrument the List of Certificate Uses and
    Open Questions name, at the level they name it, with the long card list as one catalogue
    entry; (f) two historical structures from Background.
  quotes:
    - locator: "§Abstract ¶2, p.1"
      text: 'The SPKI Working Group first established a list of things one might want to do with certificates (attached at the end of this document), and then summarized that list of desires into requirements.  This document presents that summary of requirements.'
    - locator: "§Abstract ¶1, p.1"
      text: 'The IETF Simple Public Key Infrastructure [SPKI] Working Group is tasked with producing a certificate structure and operating procedure to meet the needs of the Internet community for trust management in as easy, simple and extensible a way as possible.'
    - locator: "§Charter of the SPKI working group ¶2, p.2"
      text: 'The task of the working group will be to develop Internet standards for an IETF sponsored public key certificate format, associated signature and other formats, and key acquisition protocols.  The key certificate format and associated protocols are to be simple to understand, implement, and use.'
    - locator: "§Implementation of Certificates ¶4, p.5"
      text: 'No library code should be required for the packing or parsing of SPKI certificates.  In particular, ASN.1 is not to be used.'
    - locator: "§Implementation of Certificates ¶5, p.5"
      text: 'A certificate should be signed exactly as it is transmitted.  There should be no reformatting called for in the process of checking a certificate''s signature (although one might canonicalize white space during certificate input, for example, if the format is text).'
    - locator: "§Implementation of Certificates ¶6, p.5"
      text: 'For efficiency, if possible, an SPKI certificate should be encoded in an LR(0) grammar.'
    - locator: "§Implementation of Certificates ¶7, p.5"
      text: 'For efficiency, if possible, an SPKI certificate should be packed and parsed without any recursion.'
    - locator: "§Implementation of Certificates ¶3, p.5"
      text: 'An SPKI certificate should be described in as simple a method as possible, relating directly to the kind of structures a C or PASCAL programmer would normally write.'
    - locator: "§Validity and CRLs ¶2, p.4"
      text: 'Its method of transmission is not specified.'

# ---------------------------------------------------------------------------
note: >-
  Conventions. (1) BCP 14. RFC 2692 contains no BCP 14 keyword; the uppercase count is 0. Its
  prescriptive sentences use lowercase verbs: must, should, should not, may, "is not to be", "is
  necessary", "we assume", "will need". No field here is therefore constrained by a BCP 14
  requirement. Each entry's normative_status, and each field's strength, records the force the
  source actually gives, using the source's own verb. (2) constrained_by is wired in pass 3 (the
  cross-check) on every field and every variant, as rfc-2692#R-NNNN ids that resolve in
  requirements.yaml. The seven entries with no fields (sdsi-name, one-use-challenge,
  house-purchase-certificate, digital-marriage-license, certification-right-cessation,
  signed-e-mail-message, online-validation-request) carry it at entry level instead. Matching rule, applied in order: (a)
  the requirements whose text the field's quote is drawn from, or which quote the field's own
  words; (b) failing that, the requirement whose object is the field, or which the field's
  layout, inferred_reason or entry notes rely on. Seven fields keep an empty list, each with a
  constrained_by_reason: crl.signature and revalidation-instrument.signature, which no
  requirement names (a CRL's contents are stated only in the minimal-CRL sentence of §Validity
  and CRLs ¶2, which requirements.yaml excludes), and the five fields of public-key-directory
  and kohnfelder-certificate, whose Background history requirements.yaml excludes. Seven
  requirements constrain no structure here and are cited nowhere in this file: R-0001 (the
  charter's deliverables; the derived schema cites it at gap G-01), R-0003 (application
  neutrality), R-0034 (who writes the code, the premise of the Implementation constraints),
  R-0140 (highly trusted keys), R-0141 and R-0142 (light bureaucracy, a property of issuance,
  not of a structure) and R-0151 (the scope of Open Questions). Pass 3 added two fields, both
  marked as added: spki-certificate.revalidation-location (inferred, to match the derived
  schema's revalidation-pointer) and personal-binding-certificate.no-binding-evidence (R-0068).
  (3) Names. Every entry name and field name is this library's,
  in kebab-case, so that distilled/protocol.yaml and distilled/state-machine.yaml can refer to
  them. The source names almost nothing: its only coined structure names are KEYHOLDER, CRL,
  "revalidation instrument", "reputation voucher", "traditional certificate", "direct
  certificate", "personal binding", "delegation-allowed" bit, "audit identity" and "certification
  right expiration" certificate. aliases lists other names a sibling artifact may use. (4) Quotes.
  Every quote, quotes and values item is one contiguous run of source characters with the RFC
  line wrapping undone (a line break and the next line's indent become one space; the hyphenated
  compound split as "collision-" / "free" rejoins with no space). In-line spacing is kept,
  including two spaces after a full stop. No quote splices two non-adjacent passages; several
  separate quotes are given as a list. A quote that runs across a page break carries
  crosses_page_break: true, and the page footer and header lines inside it are left out. Prose
  in layout and notes is ours; short phrases in double quotes there are verbatim too. (5) source:
  is the locator, "§<section title> ¶<paragraph>" (sections are unnumbered), or "§List of
  Certificate Uses, item '<opening words>'", with the page. (6) inferred. A field or entry that the
  source does not literally state carries inferred: true and an inferred_reason naming what it
  follows from. A field the source states carries inferred: false. (7) required is true, false or
  unspecified, never guessed. unspecified always carries required_reason. In a use-case-only
  entry the brainstorm item names an element but the source defines no structure for it, so most
  fields there are unspecified for that reason. A requirement that applies only in some case
  carries condition:. For a field of type constraint, required: true means the rule applies to
  every instance of the entry. (8) Types, at the abstraction the source gives. keyholder: "the
  person or other entity that controls the corresponding private key" (§General Requirements ¶1),
  appearing in a certificate as a keyholder-identifier where it appears at all.
  keyholder-identifier: the entry of that name (public key, hash of the key, name, or blinded
  signature key). public-key: a public key, representation not defined here. name: a name
  "later to be resolved into a key", syntax not defined here; sdsi-name where the SDSI
  construct is meant. authorization-or-attribute: application-defined content, "up to the author
  of code which uses the certificate"; no syntax. date-interval: "dates within which it is valid";
  date syntax not defined here. lifetime: an instrument's own validity, a date-interval or the
  value one use. signature: a digital signature, format not defined here. certificate-identifier:
  how a CRL names a certificate ("identified uniquely"), not defined here. location: "where to
  find the CRL", syntax not defined here. sequence-number: an ordering value, representation not
  defined here. boolean: a "bit". object: a non-key thing a certificate is about (downloaded
  software). text: a statement whose words the source gives. constraint: a rule on the entry,
  not a stored value. literal: a fixed value, given in value:. list-of-X. unspecified: named, type
  not given. A type equal to another entry's name refers to that entry. (9) normative_status
  vocabulary. requirement: the entry is required by a lowercase must, "is necessary" or "is not to
  be". should: required by should only. may: offered as a possibility ("may", "one can
  consider"). assumption: stated as "we assume". out-of-scope: named and left to others.
  descriptive: described, not required. use-case-only: an item in the List of Certificate Uses,
  "a brainstorming list"; the Abstract says the WG "summarized that list of desires into
  requirements", which are the earlier sections. The items are inputs to those requirements, not
  requirements themselves; the one exception here is trusted-root-set, whose item says "must"
  and which this file marks requirement. open-question: from Open
  Questions, or posed as a question in the list. historical: described as history (Background).
  mentioned-only: named with no structure. (10) layout. Every entry's layout says what structure
  the source gives. No entry has an octet layout, because the source defines none. (11) The
  source's lowercase "may" in "It may also be necessary" (§Validity and CRLs ¶1) and "some
  indirection (delayed binding) may be employed" (§General Requirements ¶3) is kept as strength
  may. 48 entries (online-validation-request added in pass 3).

# ---------------------------------------------------------------------------
messages:

# --- The SPKI certificate (General Requirements, Validity and CRLs, Implementation) -----------

  - name: spki-certificate
    aliases:
      - certificate
      - authorization-certificate
      - attribute-certificate
    locator: "§General Requirements ¶2-¶9, pp.3-4; §Validity and CRLs ¶1-¶2, p.4; §Implementation of Certificates ¶1-¶7, pp.4-5"
    encoding: 'abstract; no format given in this document. Encoding constraints: certificate-encoding-profile. Concrete form: draft-ietf-spki-cert-structure (pointer only)'
    normative_status: requirement
    source: "§General Requirements ¶2, p.3"
    quote:
      - 'The main purpose of an SPKI certificate is to authorize some action, give permission, grant a capability, etc. to or for a keyholder.'
      - locator: "§Background ¶2, p.2"
        text: 'A user of a certificate needs to know whether a given keyholder has been granted some specific authorization.'
    fields:
      - name: issuer
        type: keyholder
        required: unspecified
        required_reason: >-
          The source says who generates a certificate, not whether the generating keyholder is a
          field of it or is known only through the signature. The derived schema makes
          certificate.issuer required and limits it to a key or key hash (its x-inferred-reason).
        constrained_by:
          - "rfc-2692#R-0033"
        source: "§Implementation of Certificates ¶1, p.4"
        strength: should
        quote: 'The authorization certificates that are envisioned for SPKI (and needed to meet the demands of the list given at the end of this document) should be generated by any keyholder empowered to grant or delegate the authorization in question.'
        inferred: true
        inferred_reason: >-
          The source names an issuing role ("any keyholder empowered to grant or delegate the
          authorization in question") but no issuer field. The field is ours.
      - name: subject
        type: keyholder-identifier
        required: true
        constrained_by:
          - "rfc-2692#R-0007"
          - "rfc-2692#R-0008"
          - "rfc-2692#R-0009"
          - "rfc-2692#R-0063"
        source: "§General Requirements ¶2-¶3, p.3"
        quote:
          - 'The main purpose of an SPKI certificate is to authorize some action, give permission, grant a capability, etc. to or for a keyholder.'
          - 'The keyholder is most directly identified by the public key itself, although for convenience or other purposes some indirection (delayed binding) may be employed.  That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key.'
        inferred: true
        inferred_reason: >-
          A certificate that authorizes "to or for a keyholder" must identify that keyholder, and
          ¶3 says how a keyholder is identified. The source does not call it a field or name it
          subject; the name is ours. The software-certificate use case has a non-key subject; see
          that entry.
      - name: authorization-or-attribute
        type: authorization-or-attribute
        required: true
        constrained_by:
          - "rfc-2692#R-0005"
          - "rfc-2692#R-0007"
          - "rfc-2692#R-0010"
          - "rfc-2692#R-0011"
          - "rfc-2692#R-0019"
        source: "§General Requirements ¶2, ¶4, ¶9, p.3; §Background ¶2, p.2"
        strength: should
        quote:
          - 'The definition of attributes or authorizations in a certificate is up to the author of code which uses the certificate.  The creation of new authorizations should not require interaction with any other person or organization but rather be under the total control of the author of the code using the certificate.'
          - 'One attribute of a keyholder is a name.'
          - locator: "§Background ¶2, p.2"
            text: 'A keyholder''s name is one attribute of the keyholder, but as can be seen in the list of needs in this document, a person''s name is rarely of security interest.'
        inferred: true
        inferred_reason: >-
          "The definition of attributes or authorizations in a certificate" places them in the
          certificate; required: true follows from ¶2 ("The main purpose of an SPKI certificate is to authorize some action").
          Treating a name as one value of this field follows from "One attribute of a keyholder is
          a name"; the source does not say whether a name binding uses this field or a separate
          one (see name-binding-certificate).
        layout: >-
          Content is application-defined and needs no registry: the second sentence of the first
          quote rules out any external authority over new authorization values. Every value the
          List of Certificate Uses suggests is in the use-case entries below and in
          wallet-card-catalogue.
      - name: validity-period
        type: date-interval
        required: false
        constrained_by:
          - "rfc-2692#R-0022"
        source: "§Validity and CRLs ¶1, p.4"
        strength: should
        quote: 'An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid.'
        inferred: false
        layout: >-
          "should be able to carry" makes the field available, not mandatory; hence required:
          false. Date syntax, time zone and the inclusive or exclusive ends are not defined here.
      - name: crl-location
        type: location
        required: true
        condition: only when the certificate uses a CRL
        constrained_by:
          - "rfc-2692#R-0023"
          - "rfc-2692#R-0025"
        source: "§Validity and CRLs ¶2, p.4"
        strength: must
        quote: 'Therefore, we take as a requirement that if SPKI uses CRLs, then the certificate that uses it must explicitly tell the verifier where to find the CRL, the CRL must carry explicit validity dates and the dates of a sequence of CRLs must not overlap.'
        inferred: true
        inferred_reason: >-
          The source requires the certificate to "explicitly tell the verifier where to find the
          CRL". That this is carried as a field of the certificate, and that it is a location, is
          the natural reading; the source names no field and no location syntax. It does not say
          whether the certificate also names the key that signs the CRL.
      - name: revalidation-location
        type: location
        required: unspecified
        required_reason: >-
          The source requires a certificate to say where to find its CRL and states no such rule
          for positive validation. The derived schema renders the member optional
          (revalidation-pointer.location, gap G-04).
        constrained_by:
          - "rfc-2692#R-0023"
          - "rfc-2692#R-0030"
        source: "§Validity and CRLs ¶4, p.4"
        strength: should (support)
        quote: 'SPKI should support both positive and negative on-line validations.'
        inferred: true
        inferred_reason: >-
          Added in the pass-3 cross-check so that this file and the derived schema carry the same
          members: the schema's certificate.online-validation admits a revalidation-pointer beside
          the crl-pointer. That a certificate names where to obtain its positive validation is the
          library's analogy with crl-location; the source states it for CRLs only. See
          revalidation-instrument.
      - name: signature
        type: signature
        required: true
        constrained_by:
          - "rfc-2692#R-0044"
          - "rfc-2692#R-0045"
        source: "§Implementation of Certificates ¶5, p.5"
        strength: should
        quote: 'A certificate should be signed exactly as it is transmitted.  There should be no reformatting called for in the process of checking a certificate''s signature (although one might canonicalize white space during certificate input, for example, if the format is text).'
        inferred: true
        inferred_reason: >-
          The "should" governs how a certificate is signed (exactly as transmitted). That a
          certificate is signed at all is presupposed here and by "is a signed certificate" in the
          personal-binding item; the source never states it as a requirement. Signer: the issuer.
          Signature algorithm and format: not defined here.
      - name: delegation-allowed
        type: boolean
        required: false
        constrained_by:
          - "rfc-2692#R-0124"
          - "rfc-2692#R-0125"
        source: "§List of Certificate Uses, item '\"This signed-key should be considered equivalent ...', p.10"
        strength: open ("Maybe we need")
        quote: 'I''ll note here that this flies in the face of attempts to prevent delegation of certain rights.  Maybe we need a "delegation-allowed" bit -- but there''s nothing to stop someone who wishes to delegate against the rules from also loaning out their private key.].'
        inferred: true
        inferred_reason: >-
          The source floats the bit inside the delegation-certificate item and does not say which
          certificate would carry it. Placing it on the certificate that grants a right (so that
          the right's holder may or may not delegate it) is our reading. The source itself doubts
          the bit's force (key loaning defeats it). The trailing "]." closes a bracket opened on
          p.9; the quote keeps it because it is contiguous.
      - name: minimum-information
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0014"
          - "rfc-2692#R-0015"
        source: "§General Requirements ¶6, p.3"
        strength: should
        quote: 'Because SPKI certificates will carry information that, taken together over all certificates, might constitute a dossier and therefore a privacy violation, each SPKI certificate should carry the minimum information necessary to get a job done.  The SPKI certificate is then to be like a single key rather than a key ring or a single credit card rather than a whole wallet.'
        inferred: false
      - name: anonymity
        type: constraint
        required: false
        constrained_by:
          - "rfc-2692#R-0017"
        source: "§General Requirements ¶7, p.3"
        strength: '"It is necessary" (for some certificates)'
        quote: 'It is necessary for at least some certificates to be anonymous.'
        inferred: false
        layout: >-
          Applies to "at least some certificates", not every one; hence required: false. The source
          does not define anonymous. Derived (inferred): a certificate whose subject is a public key
          or key-hash and which carries no name of the keyholder meets the purchasing-agent case
          ("I don't want the suppliers to know my name"); the source does not say so.
    layout: >-
      No layout, no field order and no encoding are given. The fields above are the parts the
      source names or presupposes, except revalidation-location, which is the library's analogy
      with crl-location (added in pass 3 to match the derived schema); every one except
      validity-period, minimum-information and anonymity is our reading of prose. Encoding constraints: certificate-encoding-profile. The
      number of fields is itself constrained ("a bare minimum of fields", "an absolute minimum of
      optional fields", §Implementation of Certificates ¶2).
    notes: >-
      Distribution of a certificate is certificate-presentation; its CRL is crl. A certificate may
      be about a name (name-binding-certificate, three use-case forms). A certificate subject may be
      a blinded signature key (keyholder-identifier variant blinded-signature-key). Open Questions
      sets limits on what any certificate can do: "certificate format, contents or issuing
      machinery can not ensure the protection of a user's private key or prove whether or not a
      private key has been stolen or misused" (see signed-e-mail-message); and a certificate cannot
      by itself prove an absence (see negative-fact-attribute-certificate). Generators are many and
      small: "The code to generate certificates should be written by many different developers,
      frequently persons acting alone, operating out of garages or dorm rooms." (§Implementation of
      Certificates ¶1)

  - name: keyholder-identifier
    aliases:
      - keyholder-reference
    locator: "§General Requirements ¶1, ¶3, ¶8, p.3"
    encoding: 'abstract; none of the four representations is defined in this document'
    normative_status: requirement
    source: "§General Requirements ¶1, p.3"
    quote: 'We define the term KEYHOLDER of a public key to refer to the person or other entity that controls the corresponding private key.'
    fields_note: >-
      A union, not a record: one of the variants below fills a keyholder position (the subject of
      spki-certificate, and the key of name-binding-certificate).
    fields: []
    variants:
      - name: public-key
        type: public-key
        constrained_by:
          - "rfc-2692#R-0006"
          - "rfc-2692#R-0008"
        source: "§General Requirements ¶3, p.3"
        strength: none (descriptive; the default)
        quote: 'The keyholder is most directly identified by the public key itself, although for convenience or other purposes some indirection (delayed binding) may be employed.'
        inferred: false
      - name: key-hash
        type: unspecified
        constrained_by:
          - "rfc-2692#R-0009"
          - "rfc-2692#R-0061"
        source: "§General Requirements ¶3, p.3"
        strength: may (delayed binding)
        quote: 'That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key.'
        inferred: false
        layout: >-
          The only property stated is "collision-free". Algorithm, encoding and which octets of the
          key are hashed are not stated. The direct-certificate item uses the same alternative: "from
          the key itself or a cryptographic hash of the key".
      - name: name
        type: name
        constrained_by:
          - "rfc-2692#R-0009"
        source: "§General Requirements ¶3, p.3"
        strength: may (delayed binding)
        quote: 'That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key.'
        inferred: false
        layout: >-
          A name is resolved into a key later. How it is resolved is not stated. Inferred: by
          name-binding certificates (name-binding-certificate), since the source requires that a
          certificate "must be able to bind a key to such names"; the source does not connect the
          two paragraphs.
      - name: blinded-signature-key
        type: unspecified
        constrained_by:
          - "rfc-2692#R-0018"
        source: "§General Requirements ¶8, p.3"
        strength: must
        quote: 'Because one use of SPKI certificates is in secret balloting and similar applications, an SPKI certificate must be able to assign an attribute to a blinded signature key.'
        inferred: true
        inferred_reason: >-
          The source requires that an attribute can be assigned to a blinded signature key; that
          the blinded key therefore fills the subject position is our reading. The blinding scheme
          and the key's representation are not stated.
    layout: >-
      No representation of any variant is given. The source does not say how a verifier tells the
      variants apart.
    notes: >-
      "delayed binding" is the source's own term for the hash and name variants. The source's
      definition of KEYHOLDER is by control of the private key, so a keyholder is whoever controls
      it; the delegation-certificate item and Open Questions both note that a key can be loaned.

  - name: certificate-encoding-profile
    aliases:
      - encoding-constraints
    locator: "§Implementation of Certificates ¶1-¶7, pp.4-5"
    encoding: 'constraints on an encoding this document does not give'
    normative_status: requirement
    source: "§Implementation of Certificates ¶1, p.4"
    quote: 'This leads to a number of constraints on the structure and encoding of certificates.'
    fields:
      - name: small-footprint
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0035"
          - "rfc-2692#R-0036"
        source: "§Implementation of Certificates ¶1, pp.4-5"
        strength: should
        quote:
          - text: 'In addition, SPKI certificates should be usable in very constrained environments, such as smart cards or small embedded systems.  The code to process them and the memory to store them should both be as small as possible.'
            crosses_page_break: true
        inferred: false
      - name: simplicity
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0002"
          - "rfc-2692#R-0037"
        source: "§Implementation of Certificates ¶2, p.5"
        strength: should
        quote: 'An SPKI certificate should be as simple as possible.'
        inferred: false
      - name: field-minimality
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0038"
        source: "§Implementation of Certificates ¶2, p.5"
        strength: should
        quote: 'There should be a bare minimum of fields necessary to get the job done'
        inferred: false
        layout: >-
          The first clause of the sentence; its second clause is optional-field-minimality.
      - name: optional-field-minimality
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0039"
        source: "§Implementation of Certificates ¶2, p.5"
        strength: should
        quote: 'there should be an absolute minimum of optional fields'
        inferred: false
        layout: >-
          The second clause of the sentence whose first clause is field-minimality, given
          separately because it bears on every required: false field in this file.
      - name: structure-specificity
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0040"
        source: "§Implementation of Certificates ¶2, p.5"
        strength: should
        quote: 'In particular, the structure should be specific enough that the creator of a certificate is constrained by the structure definition, not by complaints (or error messages) from the reader of a certificate.'
        inferred: false
      - name: c-pascal-description
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0041"
        source: "§Implementation of Certificates ¶3, p.5"
        strength: should
        quote: 'An SPKI certificate should be described in as simple a method as possible, relating directly to the kind of structures a C or PASCAL programmer would normally write.'
        inferred: false
      - name: no-library-code
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0042"
        source: "§Implementation of Certificates ¶4, p.5"
        strength: should
        quote: 'No library code should be required for the packing or parsing of SPKI certificates.'
        inferred: false
      - name: no-asn1
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0043"
        source: "§Implementation of Certificates ¶4, p.5"
        strength: is not to be
        quote: 'In particular, ASN.1 is not to be used.'
        inferred: false
        layout: >-
          The one categorical encoding rule in the memo: "is not to be", not "should". The source
          gives it as a particular case of no-library-code.
      - name: signed-as-transmitted
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0044"
        source: "§Implementation of Certificates ¶5, p.5"
        strength: should
        quote: 'A certificate should be signed exactly as it is transmitted.'
        inferred: false
      - name: no-reformatting-before-verification
        type: constraint
        required: true
        constrained_by:
          - "rfc-2692#R-0045"
        source: "§Implementation of Certificates ¶5, p.5"
        strength: should (no reformatting); may (white space)
        quote: 'There should be no reformatting called for in the process of checking a certificate''s signature (although one might canonicalize white space during certificate input, for example, if the format is text).'
        inferred: false
        layout: >-
          The one permitted transformation is white-space canonicalization at input, offered as an
          example for a text format. The source does not define the canonical white space, nor say
          whether the signature then covers the canonicalized or the received bytes.
      - name: lr0-grammar
        type: constraint
        required: true
        condition: if possible
        constrained_by:
          - "rfc-2692#R-0046"
          - "rfc-2692#R-0047"
        source: "§Implementation of Certificates ¶6, p.5"
        strength: should, "if possible"
        quote: 'For efficiency, if possible, an SPKI certificate should be encoded in an LR(0) grammar.  That is, neither packing nor parsing of the structure should require a scan of the data.'
        inferred: false
      - name: single-pass-read
        type: constraint
        required: true
        condition: if possible
        constrained_by:
          - "rfc-2692#R-0048"
        source: "§Implementation of Certificates ¶6, p.5"
        strength: should
        quote: 'Data should be read into the kind of structure a programmer would want to use without touching the incoming bytes more than once.'
        inferred: false
      - name: no-recursion
        type: constraint
        required: true
        condition: if possible
        constrained_by:
          - "rfc-2692#R-0049"
        source: "§Implementation of Certificates ¶7, p.5"
        strength: should, "if possible"
        quote: 'For efficiency, if possible, an SPKI certificate should be packed and parsed without any recursion.'
        inferred: false
    layout: >-
      No layout. These rules constrain a layout defined elsewhere. Inferred, our reading only: taken
      together they point to a flat, fixed-shape, self-delimiting record (C or PASCAL structures,
      one pass, no lookahead, no recursion) whose signed bytes are its transmitted bytes. The source
      does not say self-delimiting, length-prefixed or fixed-shape.
    notes: >-
      Ambiguity: "LR(0) grammar" names a parser class, but the source's own gloss ("neither packing
      nor parsing of the structure should require a scan of the data"; "without touching the
      incoming bytes more than once") describes something else, single-pass reading with no
      lookahead. The two are not the same property; this file takes the gloss as what the source
      means, and records the mismatch. Tension (inferred): any nested structure needs recursion or
      an explicit stack to parse, so no-recursion constrains nesting depth or shape; the source does
      not say which. Whether the later SPKI encoding meets lr0-grammar, no-recursion and
      no-library-code is not settled here (pointer: draft-ietf-spki-cert-structure, rfc-9804).

  - name: name-binding-certificate
    aliases:
      - name-certificate
    locator: "§General Requirements ¶9, pp.3-4; §List of Certificate Uses, item 'I need certificates to bind names to public keys:', pp.6-7"
    encoding: 'abstract; not defined in this document'
    normative_status: requirement
    source: "§General Requirements ¶9, p.3"
    quote: 'One attribute of a keyholder is a name.  There are names the keyholder prefers to be called and there are names by which the keyholder is known to various other keyholders.  An SPKI certificate must be able to bind a key to such names.'
    fields:
      - name: key
        type: keyholder-identifier
        required: true
        constrained_by:
          - "rfc-2692#R-0020"
          - "rfc-2692#R-0056"
        source: "§General Requirements ¶9, p.3"
        strength: must
        quote: 'An SPKI certificate must be able to bind a key to such names.'
        inferred: false
      - name: name
        type: name
        required: true
        constrained_by:
          - "rfc-2692#R-0019"
          - "rfc-2692#R-0020"
          - "rfc-2692#R-0056"
        source: "§General Requirements ¶9, p.3"
        strength: must
        quote: 'There are names the keyholder prefers to be called and there are names by which the keyholder is known to various other keyholders.'
        inferred: false
        layout: >-
          Two kinds of name: one the keyholder chooses for itself, one another keyholder knows it
          by. The source does not say whether a field distinguishes them. Inferred: the kind follows
          from who issues the certificate (self, for the first kind: direct-certificate; another
          keyholder, for the second: personal-binding-certificate).
      - name: issuer
        type: keyholder
        required: unspecified
        required_reason: The source names no issuer for a name binding in General Requirements.
        constrained_by:
          - "rfc-2692#R-0058"
          - "rfc-2692#R-0062"
          - "rfc-2692#R-0066"
        source: "§List of Certificate Uses, items '[traditional certificate]', '[direct certificate]', '[personal binding]', pp.6-7"
        quote: 'The binding is done by the key itself -- in a self-signed certificate.'
        inferred: true
        inferred_reason: >-
          The three list variants differ in who binds: "someone trustworthy" (traditional), the key
          itself (direct, quoted), "me" (personal binding). The field is ours.
      - name: name-space
        type: sdsi-name
        required: false
        condition: if possible
        constrained_by:
          - "rfc-2692#R-0021"
        source: "§General Requirements ¶9, pp.3-4"
        strength: should, "if possible"
        quote:
          - text: 'The SDSI work of Rivest and Lampson has done an especially good job of defining and using local name spaces, therefore if possible SPKI should support the SDSI name construct.'
            crosses_page_break: true
        inferred: true
        inferred_reason: >-
          The source asks SPKI to support the SDSI name construct and its local name spaces; that a
          name-binding certificate carries a name space is our reading.
    variants:
      - name: traditional
        type: traditional-certificate
        constrained_by:
          - "rfc-2692#R-0057"
        source: "§List of Certificate Uses, item '[traditional certificate]', p.6"
      - name: direct
        type: direct-certificate
        constrained_by:
          - "rfc-2692#R-0060"
        source: "§List of Certificate Uses, item '[direct certificate]', p.6"
      - name: personal-binding
        type: personal-binding-certificate
        constrained_by:
          - "rfc-2692#R-0065"
        source: "§List of Certificate Uses, item '[personal binding]', pp.6-7"
    layout: >-
      No layout. A pair (key, name) plus whoever binds them. The source gives the binding's
      direction differently in the three items: "binding a key to a name" (traditional), "binding
      a name to a key" (direct), "binding a key to a nickname" (personal binding), and the
      direction carries meaning there (attributes flow name-to-key in the traditional model).
    notes: >-
      Background downgrades the classic name certificate: "The SPKI team directly addressed the
      issue of <name,key> bindings and realized that such certificates are of extremely limited
      use for trust management." The requirement nevertheless stands. The use-list heading is "I
      need certificates to bind names to public keys:".

  - name: sdsi-name
    aliases:
      - sdsi-name-construct
      - local-name
    locator: "§General Requirements ¶9, pp.3-4"
    encoding: 'none given; SDSI (library record sdsi-1-1) and RFC 2693 §2 hold the construct (pointer only)'
    normative_status: should
    source: "§General Requirements ¶9, pp.3-4"
    quote:
      - text: 'The SDSI work of Rivest and Lampson has done an especially good job of defining and using local name spaces, therefore if possible SPKI should support the SDSI name construct.  [Note: SPKI and SDSI have merged.]'
        crosses_page_break: true
    constrained_by:
      - "rfc-2692#R-0021"
    fields_note: >-
      No fields. The source names the construct and its property (local name spaces) and nothing
      of its structure.
    fields: []
    layout: >-
      None given. The bracketed note records that the request was overtaken: SPKI and SDSI merged.
    notes: >-
      Listed so that the name variant of keyholder-identifier and the name-space field of
      name-binding-certificate have a type to point at.

# --- Distribution (General Requirements ¶5-¶6) --------------------------------------------------

  - name: certificate-presentation
    aliases:
      - certificate-distribution
    locator: "§General Requirements ¶5-¶6, p.3"
    encoding: 'none; transport not specified'
    normative_status: assumption
    source: "§General Requirements ¶5, p.3"
    quote: 'Because SPKI certificates might carry information that the keyholder might not want to publish, we assume that certificates will be distributed directly by the keyholder to the verifier.'
    fields:
      - name: sender
        type: keyholder
        required: true
        constrained_by:
          - "rfc-2692#R-0012"
        source: "§General Requirements ¶5, p.3"
        strength: we assume
        quote: 'we assume that certificates will be distributed directly by the keyholder to the verifier'
        inferred: false
      - name: receiver
        type: unspecified
        required: true
        constrained_by:
          - "rfc-2692#R-0012"
        source: "§General Requirements ¶5, p.3"
        strength: we assume
        quote: 'we assume that certificates will be distributed directly by the keyholder to the verifier'
        inferred: false
        layout: >-
          The verifier. The source uses "verifier" here and "A user of a certificate" in
          Background; it does not define either.
      - name: certificates
        type: list-of-spki-certificate
        required: true
        constrained_by:
          - "rfc-2692#R-0012"
          - "rfc-2692#R-0016"
        source: "§General Requirements ¶5-¶6, p.3"
        strength: should (minimum release)
        quote:
          - 'The keyholder should be able to release a minimum of information in order to prove his or her permission to act.'
        inferred: true
        inferred_reason: >-
          "certificates will be distributed" gives the content; that it may be several
          certificates (for example a chain, as in bank-certificate-chain) is our reading. The
          minimum-release sentence constrains which certificates are sent, not their format.
    layout: >-
      No message format, framing or transport. Named only as a direction: keyholder to verifier.
    notes: >-
      Exceptions in the source: a personal-binding certificate is "never given out", so it is
      never presented. Tension (inferred): key revocations need "Reliable distribution" (key-revocation),
      which a keyholder-to-verifier channel does not give; the source does not reconcile the two.
      Whether a request from verifier to keyholder precedes the presentation is not stated.

  - name: repository-publication
    aliases:
      - global-repository
    locator: "§General Requirements ¶5, p.3"
    encoding: 'none; left to the keyholder'
    normative_status: out-of-scope
    source: "§General Requirements ¶5, p.3"
    quote: 'If the keyholder wishes to use a global repository, such as LDAP, the global PGP key server or the DNS database, that is up to the keyholder and not for the SPKI WG to specify.'
    fields:
      - name: publisher
        type: keyholder
        required: true
        constrained_by:
