    source: "§List of Certificate Uses, p.11"
    quote: 'Especially in lower-end applications (e.g. host authentication) the people generating the keys (e.g., administrators) will change, and you will no longer want them to be able to certify.  On the other hand, you will usually also not want all keys they have generated to expire.  This may imply a "certification right expiration" certificate requirement, probably to be implemented together with notary services.'
