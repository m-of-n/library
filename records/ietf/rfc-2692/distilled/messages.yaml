  - name: signed-e-mail-message
    locator: "§Open Questions, item 'Someone digitally signs a threatening e-mail message with my private key ...', p.11"
    encoding: 'none given; not an SPKI structure'
    normative_status: open-question
    source: "§Open Questions, p.11"
    quote:
      - 'Someone digitally signs a threatening e-mail message with my private key and sends it to president@whitehouse.gov.  How do I prove that I didn''t compose and send the message?  What kind of certificate characteristic might help me in this?'
      - 'This is an issue of (non-)repudiation and therefore a matter of private key protection.  Although this is of interest to the user of certificates, certificate format, contents or issuing machinery can not ensure the protection of a user''s private key or prove whether or not a private key has been stolen or misused.'
    constrained_by:
      - "rfc-2692#R-0152"
    fields_note: >-
      No fields. A signed message, not a certificate; the source answers that no certificate
      characteristic helps.
    fields: []
    layout: None given.
    notes: >-
      Listed because it is an exchanged item the source names, and because its answer is a limit on
      every certificate: no certificate field can attest to key compromise.

  - name: negative-fact-attribute-certificate
    aliases:
      - not-married-certificate
    locator: "§Open Questions, item 'Can a certificate be issued to guarantee that I am not already married ...', p.12"
    encoding: 'none given'
    normative_status: open-question
    source: "§Open Questions, p.12"
    quote:
      - 'Can a certificate be issued to guarantee that I am not already married, so that I can then get a digital marriage license?'
      - 'The absence of attributes can be determined only if all relevant records are digitized and all parties have inescapable IDs.  The former is not likely to happen in our lifetimes and the latter receives political resistance.'
      - 'A certificate can communicate the ''positive'' attribute "not already married" or "not registered as a voter in any other district".  That assumes that some organization is capable of determining that fact for a given keyholder.  The method of determining such a negative fact is not part of the certificate definition.'
    fields:
      - name: attribute
        type: authorization-or-attribute
        required: unspecified
        required_reason: Open question; no structure given.
        constrained_by:
          - "rfc-2692#R-0154"
          - "rfc-2692#R-0155"
          - "rfc-2692#R-0157"
        source: "§Open Questions, p.12"
        quote: 'A certificate can communicate the ''positive'' attribute "not already married" or "not registered as a voter in any other district".'
        values:
          - 'not already married'
          - 'not registered as a voter in any other district'
        inferred: false
        layout: A negative fact stated as an ordinary ("positive") attribute.
      - name: issuer
        type: keyholder
        required: unspecified
        required_reason: Open question; no structure given.
        constrained_by:
          - "rfc-2692#R-0156"
        source: "§Open Questions, p.12"
        quote: 'That assumes that some organization is capable of determining that fact for a given keyholder.'
        inferred: true
        inferred_reason: >-
          The source names an organization that determines the fact; that the same organization
          issues the certificate is our reading. It does not say who issues it.
      - name: subject
        type: keyholder-identifier
        required: unspecified
        required_reason: Open question; no structure given.
        constrained_by:
          - "rfc-2692#R-0156"
        source: "§Open Questions, p.12"
        quote: 'for a given keyholder'
        inferred: false
    layout: None given.
    notes: >-
      How the issuer determines the fact is outside the certificate ("not part of the certificate
      definition"). Leads to digital-marriage-license; the voter value connects to the voter
      registration card in other-certificate-uses (inferred).

  - name: monetary-value-certificate
    locator: "§Open Questions, item 'The assumption in most certificates is that the proper user will protect his private key ...', p.12"
    encoding: 'none given'
    normative_status: open-question
    source: "§Open Questions, p.12"
    quote:
      - 'The assumption in most certificates is that the proper user will protect his private key very well, to prevent anyone else from accessing his funds.  However, in some cases the certificate itself might have monetary value [permission to prescribe drugs, permission to buy alcohol, ...].  What is to prevent the holder of such a certificate from loaning out his private key?'
      - 'This is a potential flaw in any system providing authorization and an interesting topic for study.  What prevents a doctor or dentist from selling prescriptions for controlled substances to drug abusers?'
    fields:
      - name: authorization
        type: authorization-or-attribute
        required: unspecified
        required_reason: Open question; no structure given.
        constrained_by:
          - "rfc-2692#R-0158"
        source: "§Open Questions, p.12"
        quote: '[permission to prescribe drugs, permission to buy alcohol, ...]'
        values:
          - 'permission to prescribe drugs'
          - 'permission to buy alcohol'
        inferred: false
    layout: None given.
    notes: >-
      Not a new kind of certificate: a property (the certificate is worth something to others) that
      gives the holder a reason to loan the private key. Left open by the source. Same point as the
      delegation-allowed note in delegation-certificate.
