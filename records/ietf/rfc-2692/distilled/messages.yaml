        quote: 'If the keyholder wishes to use a global repository'
        inferred: false
      - name: repository
        type: unspecified
        required: true
        constrained_by:
          - "rfc-2692#R-0013"
        source: "§General Requirements ¶5, p.3"
        quote: 'such as LDAP, the global PGP key server or the DNS database'
        values:
          - 'LDAP'
          - 'the global PGP key server'
          - 'the DNS database'
        inferred: false
        layout: Examples, not a closed list ("such as").
    layout: >-
