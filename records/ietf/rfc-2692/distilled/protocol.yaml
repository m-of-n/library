record: rfc-2692
reviewed_by: ""
extracted: "2026-10-18"
source:
  file: ".cache/rfc-2692.txt"
  sha256: "6a88c1563590e8094bb37cda5c5d29ef70f8384e5a3a0528bce29c501826976d"
  lines: "787"
  bcp14_keywords: "0"
applicability: >-
  PARTIAL. RFC 2692 is a requirements document. It specifies no protocol: no
  transport, no framing, no encoding, no request or response format and no
  error signalling. It says outright that the CRL's method of transmission is
  not specified and that a global repository is not for the SPKI WG to
  specify. It does name roles (keyholder, verifier, a keyholder empowered to
  grant or delegate, the author of code that defines authorizations, on-line
  validation, global repositories, smart cards, a central administrator,
  notary services) and it names or implies exchanges between them. Every one
  is modelled here at the level the source gives it, which is usually one
  sentence. Steps the source does not literally state are marked inferred with
  a reason. Much of the material sits in the "List of Certificate Uses", which
  the source itself calls a brainstorming list, and in "Open Questions", which
  records what certificates cannot do. Those are modelled as flows only where
  the item describes an exchange. Every other item is mapped under use_cases,
  and the questions are recorded under non_flows.
applicability_quotes:
  - locator: "§Validity and CRLs ¶2 (p.4)"
    text: |-
      Its method of transmission is not specified.
  - locator: "§General Requirements ¶5 (p.3)"
    text: |-
      If the keyholder wishes to use a global repository, such as LDAP, the global PGP key server or the DNS database, that is up to the keyholder and not for the SPKI WG to specify.
  - locator: "Abstract (p.1)"
    text: |-
      The SPKI Working Group first established a list of things one might want to do with certificates (attached at the end of this document), and then summarized that list of desires into requirements.  This document presents that summary of requirements.
  - locator: "§List of Certificate Uses ¶1 (p.5)"
    text: |-
      The list below is a brainstorming list, accumulated on the SPKI mailing list, of uses of such certificates.
  - locator: "§Open Questions ¶1 (p.11)"
    text: |-
      These do not have answers provided by certificate definition or issuing alone.
conventions:
  quoting: >-
    Each quote is one contiguous run of .cache/rfc-2692.txt with RFC line
    wrapping undone: a line break and the indentation of the next line become
    one space, and a line-final hyphen inside a hyphenated compound
    ("collision-" then "free") joins with no space. In-line spacing is kept,
    including the two spaces the source puts after a full stop. No quote
    crosses a page footer and header and none crosses a blank line. Where the
    source sentence continues past a page break the quote stops at the break
    and says so in a note. Non-adjacent text is never joined and nothing is
    elided. A quote may be a substring of a sentence.
  locators: >-
    The sections of RFC 2692 are unnumbered. A locator is the section title, a
    paragraph number counted from the first paragraph under that title, and
    the page, e.g. "§Validity and CRLs ¶2 (p.4)". Items of the List of
    Certificate Uses are located by their opening words, e.g. "§List of
    Certificate Uses, item 'My bank would issue a certificate' (p.6)". The
    nested list headed "Other requirements:" is located as "§List of
    Certificate Uses, Other requirements, item '...'". Open Questions are
    numbered Q1 to Q4 in source order.
  inferred: >-
    inferred false means the step, role or outcome is literally in the source
    at the locator given. inferred true means it is not, and carries an
    inferred_reason: the reading an implementer would have to adopt to make
    the stated text executable, flagged so that a test can be written against
    either reading.
  on_error_basis: >-
    stated, inferred or unspecified. unspecified means the source names the
    check or implies a failure and says nothing about what happens next.
  prescriptive_wording: >-
    The source has no BCP 14 keyword. Its prescriptive sentences use lowercase
    must, should, may and "is not to be". Guards quote them as written and
    never upgrade them.
  status: >-
    assumed means the source says "we assume". required-capability means the
    source says SPKI must or should be able to do it, without saying how.
    considered means the source says "one can consider" or "may" and does not
    require it. described-and-rejected means the source describes the
    mechanism to justify a requirement against it. brainstorm-use means the
    flow comes from the List of Certificate Uses, which the source calls a
    brainstorming list. tentative means the source hedges ("Maybe", "may
    imply", "or something like that"). historical means Background narrative.
  kind: >-
    exchange means two or more parties pass something. issuance means one
    party signs an instrument that others consume later. local means one role
    acts alone; it is listed because the source names it as a step another
    flow depends on.
  message_names: >-
    Message names are kebab-case after the source's own noun and are not yet
    reconciled with messages.yaml, which pass 1 did not see. Every name used is
    listed in messages_referenced. Names in message_notes marked in_source "no"
    have no counterpart in RFC 2692 and stand for inferred steps.
  constrained_by: >-
    Every flow carries constrained_by as an empty list. Requirement ids are
    wired in pass 3 by a different agent; pass 1 leaves them empty on purpose.
  external_pointers: >-
    RFC 2692 cites only [DH] and [KOHN]. Where this file says a thing is
    defined elsewhere (RFC 2693, draft-ietf-spki-cert-structure) that is a
    library pointer, not a claim made by the source, and no content is taken
    from those documents.
framing:
  - id: requirements-not-protocol
    text: "The document summarizes requirements distilled from a list of desired uses; it does not define the certificate structure or any procedure."
    locator: "Abstract (p.1)"
    inferred: false
    quotes:
      - |-
        The SPKI Working Group first established a list of things one might want to do with certificates (attached at the end of this document), and then summarized that list of desires into requirements.  This document presents that summary of requirements.
  - id: charter-promises-protocols
    text: "The charter tasks the working group with key acquisition protocols, which this document does not give."
    locator: "§Charter of the SPKI working group ¶2 (p.2)"
    inferred: false
    quotes:
      - |-
        The task of the working group will be to develop Internet standards for an IETF sponsored public key certificate format, associated signature and other formats, and key acquisition protocols.
  - id: authorization-not-identity
    text: "What a verifier needs from a certificate is whether a keyholder has been granted an authorization, not who the keyholder is."
    locator: "§Background ¶2 (p.2); §General Requirements ¶2 (p.3)"
    inferred: false
    quotes:
      - |-
        A user of a certificate needs to know whether a given keyholder has been granted some specific authorization.
      - |-
        The main purpose of an SPKI certificate is to authorize some action, give permission, grant a capability, etc. to or for a keyholder.
  - id: determinism
    text: "Deterministic certificate validation is the property the CRL requirements are written to obtain."
    locator: "§Validity and CRLs ¶2 (p.4)"
    inferred: false
    quotes:
      - |-
        Under this set of requirements, behavior of certificate validation is deterministic (aside from the question of clock skew).
  - id: no-reader-error-channel
    text: "Conformance is to come from the structure definition, not from a reader rejecting what a creator produced. No error-reporting exchange from reader to creator is contemplated."
    locator: "§Implementation of Certificates ¶2 (p.5)"
    inferred: false
    quotes:
      - |-
        In particular, the structure should be specific enough that the creator of a certificate is constrained by the structure definition, not by complaints (or error messages) from the reader of a certificate.
roles:
  - name: keyholder
    kind: party
    also_called:
      - "the person or other entity that controls the corresponding private key"
      - "I / me (first-person speaker of most List of Certificate Uses items)"
    description: >-
      Controls the private key corresponding to a public key. Receives
      authorizations, holds its own certificates, distributes them directly to
      verifiers, and should be able to release the minimum information needed
      to prove permission to act.
    locators:
      - "§General Requirements ¶1 (p.3)"
      - "§General Requirements ¶5 (p.3)"
      - "§General Requirements ¶6 (p.3)"
    quotes:
      - |-
        We define the term KEYHOLDER of a public key to refer to the person or other entity that controls the corresponding private key.
      - |-
        The keyholder should be able to release a minimum of information in order to prove his or her permission to act.
    inferred: false
  - name: verifier
    kind: party
    also_called:
      - "user of a certificate"
      - "reader of a certificate"
    description: >-
      Receives certificates, is told by a certificate where to find its CRL,
      and needs to know whether a keyholder has been granted some specific
      authorization.
    locators:
      - "§General Requirements ¶5 (p.3)"
      - "§Validity and CRLs ¶2 (p.4)"
      - "§Background ¶2 (p.2)"
      - "§Implementation of Certificates ¶2 (p.5)"
    quotes:
      - |-
        we assume that certificates will be distributed directly by the keyholder to the verifier.
      - |-
        the certificate that uses it must explicitly tell the verifier where to find the CRL
      - |-
        A user of a certificate needs to know whether a given keyholder has been granted some specific authorization.
    inferred: false
    note: "The reader of a certificate (§Implementation of Certificates ¶2) is taken to be the verifier; the source does not equate them in so many words."
  - name: issuer
    kind: party
    also_called:
      - "keyholder empowered to grant or delegate the authorization in question"
      - "creator of a certificate"
      - "certifying-key (holder)"
      - "governmental issuing authority (example)"
    description: >-
      Any keyholder empowered to grant or delegate an authorization. Generates
      and signs certificates. The word issuer is the library's; the source
      says "keyholder empowered to grant or delegate" and "creator of a
      certificate".
    locators:
      - "§Implementation of Certificates ¶1 (p.4)"
      - "§Implementation of Certificates ¶2 (p.5)"
      - "§List of Certificate Uses, item 'This signed-key should be considered equivalent' (p.9)"
    quotes:
      - |-
        The authorization certificates that are envisioned for SPKI (and needed to meet the demands of the list given at the end of this document) should be generated by any keyholder empowered to grant or delegate the authorization in question.
      - |-
        the creator of a certificate is constrained by the structure definition, not by complaints (or error messages) from the reader of a certificate.
    inferred: false
  - name: code-author
    kind: party
    also_called:
      - "author of code which uses the certificate"
    description: >-
      Defines the attributes or authorizations a certificate carries, with
      total control and without interaction with any other person or
      organization.
    locators:
      - "§General Requirements ¶4 (p.3)"
    quotes:
      - |-
        The definition of attributes or authorizations in a certificate is up to the author of code which uses the certificate.  The creation of new authorizations should not require interaction with any other person or organization but rather be under the total control of the author of the code using the certificate.
    inferred: false
  - name: certificate-code-developer
    kind: implementer
    description: >-
      Writes the code that generates certificates. Takes part in no exchange.
      Listed because the source derives its structure and encoding constraints
      from who this role is.
    locators:
      - "§Implementation of Certificates ¶1 (p.4)"
    quotes:
      - |-
        The code to generate certificates should be written by many different developers, frequently persons acting alone, operating out of garages or dorm rooms.  This leads to a number of constraints on the structure and encoding of certificates.
    inferred: false
  - name: crl-issuer
    kind: party
    description: >-
      Signs CRLs. The source says a CRL carries a signature and that a
      certificate must tell the verifier where to find it. It never names who
      signs it, or how a verifier learns which key must have signed it.
    locators:
      - "§Validity and CRLs ¶2 (p.4)"
    quotes:
      - |-
        A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.
    inferred: true
    inferred_reason: "A signature implies a signer. The role is not named in RFC 2692."
  - name: online-validator
    kind: party
    description: >-
      Provides positive or negative on-line validation, the "on-line refinement
      of validity", and issues revalidation instruments and possibly one-use
      instruments. The source names the service (on-line validation) but no
      party that provides it.
    locators:
      - "§Validity and CRLs ¶1 (p.4)"
      - "§Validity and CRLs ¶3 (p.4)"
      - "§Validity and CRLs ¶4 (p.4)"
      - "§Validity and CRLs ¶5 (p.4)"
    quotes:
      - |-
        It may also be necessary to have on-line refinement of validity.
      - |-
        These have been replaced in the retail world by positive statements -- on-line validation of a single check, ATM card or credit card.
      - |-
        SPKI should support both positive and negative on-line validations.
    inferred: true
    inferred_reason: "On-line validation is stated. A party that performs it is implied and not named."
  - name: global-repository
    kind: party
    examples:
      - "LDAP"
      - "the global PGP key server"
      - "the DNS database"
    description: >-
      An optional place a keyholder may publish certificates to. Use is at the
      keyholder's option, and the protocol is expressly not for the SPKI WG to
      specify.
    locators:
      - "§General Requirements ¶5 (p.3)"
    quotes:
      - |-
        If the keyholder wishes to use a global repository, such as LDAP, the global PGP key server or the DNS database, that is up to the keyholder and not for the SPKI WG to specify.
    inferred: false
  - name: smart-card
    kind: party
    description: >-
      Holds a long-term key and, at login time, certifies a short-term key
      pair so that the long-term key's exposure is reduced. It is slow and
      connected through low-bandwidth links. The source also requires that
      certificates be usable in constrained environments such as smart cards.
    locators:
      - "§List of Certificate Uses, item 'This signed-key should be considered equivalent' (p.9)"
      - "§Implementation of Certificates ¶1 (p.4)"
    quotes:
      - |-
        One way to do this is to use smart cards, but those typically have slow processors and are connected through low-bandwidth links; however, if you only use the smart card at "login" time to certify a short-term key pair, you get high performance and low exposure of the long term key.
      - |-
        In addition, SPKI certificates should be usable in very constrained environments, such as smart cards or small
    quote_notes:
      - "The second quote stops at the p.4/p.5 page break; the sentence continues 'embedded systems.' on p.5."
    inferred: false
  - name: central-administrator
    kind: party
    description: >-
      Named only as something some applications cannot depend on: host
      authentication needs extremely light or no bureaucracy, and even
      communicating with the central administrator may be a problem.
    locators:
      - "§List of Certificate Uses, Other requirements, item 'Some applications (e.g., host authentication)' (p.10)"
    quotes:
      - |-
        Some applications (e.g., host authentication) require extremely light (or no) bureaucracy.  Even communication with the central administrator may be a problem.
    inferred: false
  - name: notary-service
    kind: party
    also_called:
      - "Timestamping / notary services"
    description: >-
      Timestamping or notary services. They need highly trusted keys, and the
      source suggests the certification right expiration certificate is
      probably to be implemented together with them.
    locators:
      - "§List of Certificate Uses, item 'Timestamping / notary services' (p.10)"
      - "§List of Certificate Uses, Other requirements, item 'Some applications (e.g., notary services)' (p.10)"
      - "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications' (p.11)"
    quotes:
      - |-
        Timestamping / notary services
      - |-
        Some applications (e.g., notary services) require highly trusted keys; generation complexity is not an issue here.
      - |-
        This may imply a "certification right expiration" certificate requirement, probably to be implemented together with notary services.
    inferred: false
  - name: key-cache
    kind: local-component
    description: >-
      A local cache of frequently used keys, compared to name servers. It
      interacts with the distribution of revocations.
    locators:
      - "§List of Certificate Uses, Other requirements, item 'Keys will need to be cached locally' (p.11)"
      - "§List of Certificate Uses, Other requirements, item 'Reliable distribution of key revocations' (p.11)"
    quotes:
      - |-
        Keys will need to be cached locally to avoid long delays fetching frequently used keys.  Cf. current name servers.
      - |-
        This interacts with caching.
    inferred: false
  - name: revoker
    kind: party
    description: >-
      Whoever issues key revocations and the certificates that end someone's
      right to make new certificates. The source asks for reliable
      distribution of these and never names who issues them.
    locators:
      - "§List of Certificate Uses, Other requirements, item 'Reliable distribution of key revocations' (p.11)"
    quotes:
      - |-
        Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates).
    inferred: true
    inferred_reason: "Revocations are distributed, so someone issues them. The role is not named in RFC 2692."
  - name: key-generating-administrator
    kind: party
    description: >-
      The people who generate keys and certify in lower-end applications such
      as host authentication. They will change, and the right to certify has
      to end without every key they generated expiring.
    locators:
      - "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications' (p.11)"
    quotes:
      - |-
        Especially in lower-end applications (e.g. host authentication) the people generating the keys (e.g., administrators) will change, and you will no longer want them to be able to certify.
    inferred: false
  - name: name-binder
    kind: party
    description: >-
      The "someone trustworthy" who binds a uniquely identified person's name
      to a key in a traditional certificate.
    locators:
      - "§List of Certificate Uses, item '[traditional certificate]' (p.6)"
    quotes:
      - |-
        This requires unique identification of a person (which is difficult in non-digital space, as it is) and someone trustworthy binding that unique name to the key in question.
    inferred: false
  - name: negative-fact-organization
    kind: party
    description: >-
      An organization able to determine a negative fact about a keyholder,
      such as "not already married", and so able to issue a certificate that
      states it as a positive attribute.
    locators:
      - "§Open Questions Q3 (p.12)"
    quotes:
      - |-
        That assumes that some organization is capable of determining that fact for a given keyholder.
    inferred: false
  - name: bank
    kind: example-party
    description: >-
      "My bank" in the electronic-check items. It needs a certificate proving
      that it is a bank, gives people permission to write electronic checks,
      and signs the key of a master bank certifier.
    locators:
      - "§List of Certificate Uses, item 'My bank would need a certificate' (p.5)"
      - "§List of Certificate Uses, item 'My bank would issue a certificate' (p.6)"
    quotes:
      - |-
        My bank would need a certificate, proving to others that it is a bank capable of cashing electronic checks and permitted to give permission to people to write electronic checks.
    inferred: false
  - name: master-bank-certifier
    kind: example-party
    also_called:
      - "NACHA (perhaps)"
    description: >-
      A master bank certifier whose key my bank signs, so that a chain runs
      from my bank's key to the key of any other bank.
    locators:
      - "§List of Certificate Uses, item 'My bank would issue a certificate' (p.6)"
    quotes:
      - |-
        My bank would issue a certificate signing the key of a master bank certifier -- perhaps NACHA -- so that I could follow a certificate chain from a key I know (my bank's) to the key of any other bank in the US and, similarly, to any other bank in the world.
    inferred: false
  - name: other-bank
    kind: example-party
    description: "Any other bank whose key is reached at the end of the chain."
    locators:
      - "§List of Certificate Uses, item 'My bank would issue a certificate' (p.6)"
    quotes:
      - |-
        to the key of any other bank in the US and, similarly, to any other bank in the world.
    inferred: false
  - name: dns-name-owner
    kind: example-party
    description: >-
      The owner of a DNS name. A "DNS name owner" certificate certifies a key
      that might in turn sign an rfc822 mail-receiver certificate.
    locators:
      - "§List of Certificate Uses, item 'I am the legitimate receiver of mail' (p.10)"
    quotes:
      - |-
        [this might need to be signed by a key which itself had been certified by the appropriate "DNS name owner" certificate]
    inferred: false
  - name: software-vouchee
    kind: example-party
    also_called:
      - "some reputable company or person"
    description: "Stands behind downloaded software by means of a certificate."
    locators:
      - "§List of Certificate Uses, item 'I want a certificate for some software' (p.6)"
    quotes:
      - |-
        I want a certificate for some software I have downloaded and am considering running on my computer -- to make sure it hasn't changed and that some reputable company or person stands behind it.
    inferred: false
  - name: application
    kind: local-component
    description: >-
      The application that consumes certificates. Where auditing is wanted,
      the audit identity belongs to the application's domain.
    locators:
      - "§List of Certificate Uses, item 'I'm that same sysadmin' (p.9)"
    quotes:
      - |-
        Certain applications *will* want some form of auditing, but the audit identity should be in the domain of the particular application...
    inferred: false
  - name: key-thief
    kind: threat
    description: >-
      Someone who signs with my private key. The source says certificates
      cannot prove that this happened.
    locators:
      - "§Open Questions Q1 (p.11)"
    quotes:
      - |-
        Someone digitally signs a threatening e-mail message with my private key and sends it to president@whitehouse.gov.
    inferred: false
  - name: key-loaner
    kind: threat
    description: >-
      A certificate holder who lends out the private key and so delegates
      against the rules. The source calls this a potential flaw in any
      authorization system.
    locators:
      - "§Open Questions Q4 (p.12)"
      - "§List of Certificate Uses, item 'This signed-key should be considered equivalent' (p.10)"
    quotes:
      - |-
        What is to prevent the holder of such a certificate from loaning out his private key?
      - |-
        there's nothing to stop someone who wishes to delegate against the rules from also loaning out their private key.
    inferred: false
  - name: online-directory
    kind: historical
    description: >-
      The Diffie-Hellman public-key "telephone book" consulted on-line, which
      Kohnfelder called a performance bottleneck and replaced with signed
      directory entries.
    locators:
      - "§Background ¶1 (p.2)"
    quotes:
      - |-
        Kohnfelder took that suggestion and noted that an on-line service has the disadvantage of being a performance bottleneck.
    inferred: false
  - name: communicant
    kind: historical
    description: "The party in Background who looks up a partner's public key in order to open a secure channel."
    locators:
      - "§Background ¶1 (p.2)"
    quotes:
      - |-
        One could then look up his or her desired communication partner in the directory, find that person's public key and open a secure channel to that person.
    inferred: false
