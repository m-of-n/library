          - |-
            Can a certificate be issued to guarantee that I am not already married, so that I can then get a digital marriage license?
        on_error: "unspecified."
        on_error_basis: unspecified
    guards: []
    error_path_ids:
      - negative-fact-undeterminable
  - name: blinded-key-attribute
    title: "Secret balloting: a certificate assigns an attribute to a blinded signature key"
    locator: "§General Requirements ¶8 (p.3)"
    kind: issuance
    status: required-capability
    participants:
      - issuer
      - keyholder
    summary: >-
      A stated capability, "must be able to", with no mechanism. Nothing about
      blinding, unblinding or later use is described.
    constrained_by: []
    steps:
      - n: 1
        from: keyholder
        to: issuer
        message: blinded-signature-key
        action: "Submit a blinded signature key."
        inferred: true
        inferred_reason: "The issuer can only assign an attribute to a blinded key it has been given; submission is not described."
        locator: "§General Requirements ¶8 (p.3)"
        quotes:
          - |-
            an SPKI certificate must be able to assign an attribute to a blinded signature key.
        on_error: "unspecified."
        on_error_basis: unspecified
      - n: 2
        from: issuer
        to: keyholder
        message: spki-certificate
        action: "Issue a certificate assigning the attribute to the blinded signature key."
        inferred: false
        locator: "§General Requirements ¶8 (p.3)"
        quotes:
          - |-
            Because one use of SPKI certificates is in secret balloting and similar applications, an SPKI certificate must be able to assign an attribute to a blinded signature key.
        on_error: "unspecified."
        on_error_basis: unspecified
    guards: []
    error_path_ids: []
  - name: online-directory-lookup
    title: "Historical: look the partner's public key up in an on-line directory, then open a secure channel"
    locator: "§Background ¶1 (p.2)"
    kind: exchange
    status: historical
    participants:
      - communicant
      - online-directory
    summary: >-
      Diffie and Hellman's published "telephone book" of public keys.
      Kohnfelder noted that an on-line service is a performance bottleneck.
      Recorded because it is the design certificates were introduced to
      replace.
    constrained_by: []
    steps:
      - n: 1
        from: communicant
        to: online-directory
        message: directory-lookup
        action: "Look up the desired communication partner in the directory."
        inferred: false
        locator: "§Background ¶1 (p.2)"
        quotes:
          - |-
            One could then look up his or her desired communication partner in the directory, find that person's public key and open a secure channel to that person.
        on_error: "The on-line service is a performance bottleneck."
        on_error_basis: stated
        on_error_quotes:
          - |-
            Kohnfelder took that suggestion and noted that an on-line service has the disadvantage of being a performance bottleneck.
      - n: 2
        from: online-directory
        to: communicant
        message: public-key
        action: "Find the partner's public key."
        inferred: false
        locator: "§Background ¶1 (p.2)"
        quotes:
          - |-
            find that person's public key
        on_error: "unspecified."
        on_error_basis: unspecified
      - n: 3
        from: communicant
        to: communicant
        message: public-key
        action: "Open a secure channel to the partner, with no prior secret channel needed."
        inferred: false
        locator: "§Background ¶1 (p.2)"
        quotes:
          - |-
            Diffie and Hellman noted that with public key cryptography, one no longer needs a secure channel over which to transmit secret keys between communicants.
        on_error: "unspecified."
        on_error_basis: unspecified
    guards: []
    error_path_ids:
      - online-service-bottleneck
  - name: signed-directory-entry
    title: "Historical: Kohnfelder's replacement, digitally signed directory entries called certificates"
    locator: "§Background ¶1 (p.2)"
    kind: issuance
    status: historical
    participants:
      - online-directory
      - communicant
    summary: >-
      To remove the on-line bottleneck, directory entries are signed so that
      they can be used without consulting the on-line service. The source gives
      only the idea; the off-line use of the entry is inferred.
    constrained_by: []
    steps:
      - n: 1
        from: online-directory
        to: communicant
        message: signed-directory-entry
        action: "Directory entries are digitally signed; these are certificates."
        inferred: false
        locator: "§Background ¶1 (p.2)"
        quotes:
          - |-
            To replace it, he proposed creation of digitally signed directory entries which he called certificates.
        on_error: "unspecified."
        on_error_basis: unspecified
      - n: 2
        from: communicant
        to: communicant
        message: signed-directory-entry
        action: "Verify the entry's signature and use the key without contacting the on-line service."
        inferred: true
        inferred_reason: "Replacing the on-line service implies off-line use; the verification is not described."
        locator: "§Background ¶1 (p.2)"
        quotes:
          - |-
            To replace it,
        on_error: "unspecified."
        on_error_basis: unspecified
    guards:
      - id: name-key-assumption
        text: "Since 1978 'certificate' has often been taken to mean a name-to-key binding, which SPKI rejects as the main purpose."
        inferred: false
        locator: "§Background ¶1 (p.2)"
        quotes:
          - |-
            In the time since 1978, the term certificate has frequently been assumed to mean a binding between name and key.
    error_path_ids: []
use_cases:
  note: >-
    Every item of the List of Certificate Uses: 35 entries, being the 29
    items at the list's top level (the wallet-card lead-in counted once, with
    its 33 cards kept verbatim under it) and the 6 "Other requirements"
    items; the three name-binding sub-items share their parent's entry. 32
    entries map to the flows they instantiate. 3 map to no flow and say why
    in a note: the house-contract and "80-year-old man" questions, which give
    no mechanism, and "Digital signatures (unforgeability)", a property
    rather than an exchange. Most mapped items are instances of
    certificate-issuance followed by direct-certificate-distribution, varying
    only in who issues and what the authorization says. None gives an
    exchange beyond that.
  items:
    - item: "I need a certificate to give me permission to write electronic checks."
      locator: "§List of Certificate Uses (p.5)"
      maps_to: [certificate-chain-following, certificate-issuance]
    - item: "My bank would need a certificate, proving to others that it is a bank capable of cashing electronic checks and permitted to give permission to people to write electronic checks."
      locator: "§List of Certificate Uses (p.5)"
      maps_to: [certificate-chain-following]
    - item: "My bank would issue a certificate signing the key of a master bank certifier"
      locator: "§List of Certificate Uses (p.6)"
      maps_to: [certificate-chain-following]
    - item: "I might generate a certificate (a \"reputation voucher\") for a friend to introduce him to another friend"
      locator: "§List of Certificate Uses (p.6)"
      maps_to: [reputation-voucher-introduction]
    - item: "I might have a certificate giving my security clearance, signed by a governmental issuing authority."
      locator: "§List of Certificate Uses (p.6)"
      maps_to: [certificate-issuance]
      note: "Issuer named: a governmental issuing authority."
    - item: "I want a certificate for some software I have downloaded and am considering running on my computer"
      locator: "§List of Certificate Uses (p.6)"
      maps_to: [software-certification]
    - item: "I need certificates to bind names to public keys:"
      locator: "§List of Certificate Uses (p.6-7)"
      maps_to: [traditional-certificate-issuance, direct-certificate-self-signing, personal-binding]
    - item: "I might be doing genealogy and be collecting what amounts to 3x5 cards with facts to be linked together."
      locator: "§List of Certificate Uses (p.7)"
      maps_to: [certificate-issuance]
      note: "The signer is the researcher who collected the fact; the subject is a fact, not a key. No exchange beyond signing."
    - item: "I want to sign a contract to buy a house.  What kind of certificate do I need?"
      locator: "§List of Certificate Uses (p.7)"
      maps_to: []
      note: "An unanswered question. See non_flows title-scan for the related Open Question."
    - item: "How do I make sure she's not really some 80-year-old man in a nursing home?"
      locator: "§List of Certificate Uses (p.7)"
      maps_to: []
      note: "An unanswered question; no mechanism given."
    - item: "I have met someone on the net and would like a picture of her and her height, weight and other measurements from a trustworthy source."
      locator: "§List of Certificate Uses (p.7)"
      maps_to: [certificate-issuance]
      note: "Issuer: 'a trustworthy source', otherwise unspecified."
    - item: "Can I have a digital marriage license?"
      locator: "§List of Certificate Uses (p.7)"
      maps_to: [certificate-issuance, negative-fact-as-positive-attribute]
    - item: "Can I have a digital divorce decree?"
      locator: "§List of Certificate Uses (p.7)"
      maps_to: [certificate-issuance]
    - item: "..a digital Voter Registration Card?"
      locator: "§List of Certificate Uses (p.7)"
      maps_to: [certificate-issuance, negative-fact-as-positive-attribute]
    - item: "There are a number of cards one carries in a typical wallet which could become certificates attached to a public key:"
      locator: "§List of Certificate Uses (p.7-9)"
      maps_to: [certificate-issuance, minimal-information-proof]
      cards:
        - "health insurance card"
        - "prescription drug card"
        - "driver's license (for permission to drive)"
        - "driver's license (for permission to buy alcohol)"
        - "supermarket discount card"
        - "supermarket check-cashing card [I know -- anachronism]"
        - "Blockbuster Video rental card"
        - "ATM card"
        - "Credit card"
        - "membership card in the ACLU, NRA, Republican party, Operation Rescue, NARAL, ACM, IEEE, ICAR...."
        - "Red Cross blood donor card"
        - "Starbuck's Coffee buy-10-get-1-free card"
        - "DC Metro fare card"
        - "Phone calling card"
        - "Alumni Association card"
        - "REI Membership card"
        - "Car insurance card"
        - "claim check for a suitcase"
        - "claim check for a pawned radio"
        - "authorization for followup visits to a doctor, after surgery"
        - "Better Business Bureau [BBB] style reputation certificates [testimonies from satisfied customers]"
        - "BBB-style certificate that no complaints exist against a business or doctor or dentist, etc."
        - "LDS Temple Recommend"
        - "Stock certificate"
        - "Stock option"
        - "Car title"
        - "deed to land"
        - "proof of ownership of electronic equipment with an ID number"
        - "time card certificate [activating a digital time clock]"
        - "proof of degree earned [PhD, LLD, MD, ...]"
        - "permission to write digitally signed prescriptions for drugs"
        - "permission to spend up to $X of a company's money"
        - "permission to issue nuclear launch codes"
      note: >-
        The source indents these at the same level as the parent item, so where
        the wallet list ends is ambiguous (source_defects wallet-list-flat).
        'BBB-style certificate that no complaints exist' is a negative fact
        (negative-fact-as-positive-attribute). The alcohol and prescription
        items are the Q4 examples of certificates with monetary value
        (non_flows prevent-key-loaning).
    - item: "I'm a sysadmin, I want to carry a certificate, signed by SAGE, that says I'm good at the things sysadmins are good at."
      locator: "§List of Certificate Uses (p.9)"
      maps_to: [certificate-issuance]
    - item: "I'm that same sysadmin, I want an ephemeral certificate that grants me root access to certain systems for the day, or the week, or..."
      locator: "§List of Certificate Uses (p.9)"
      maps_to: [certificate-issuance]
      note: "A short validity period. Auditing: 'the audit identity should be in the domain of the particular application', and an 'is a system administrator of this host' certificate 'would probably want to include an audit identity'."
    - item: "I'm an amateur radio operator.  I want a signed certificate that says I'm allowed to engage in amateur radio, issued by the DOC."
      locator: "§List of Certificate Uses (p.9)"
      maps_to: [certificate-issuance]
      note: "Uses stated: enforcing access policies to the spectrum and tracking abuse."
    - item: "I'm the a purchasing agent for a large corporation."
      locator: "§List of Certificate Uses (p.9)"
      maps_to: [minimal-information-proof]
    - item: "\"This signed-key should be considered equivalent to the certifying-key until this certificate expires for the following purposes ...\""
      locator: "§List of Certificate Uses (p.9-10)"
      maps_to: [smart-card-short-term-key]
    - item: "\"I am the current legitimate owner of a particular chunk of Internet address space.\""
      locator: "§List of Certificate Uses (p.10)"
      maps_to: [certificate-issuance]
      note: "Signer not stated. The motive is IPSEC coexisting with ip-address-based firewalls without prior arrangement between sites."
    - item: "\"I am the current legitimate owner of a this DNS name or subtree.\""
      locator: "§List of Certificate Uses (p.10)"
      maps_to: [mail-receiver-certification-chain]
    - item: "\"I am the legitimate receiver of mail sent to this rfc822 email address."
      locator: "§List of Certificate Uses (p.10)"
      maps_to: [mail-receiver-certification-chain]
    - item: "Encryption keys for E-mail and file encryption"
      locator: "§List of Certificate Uses (p.10)"
      maps_to: [certificate-issuance]
    - item: "Authentication of people or other entities"
      locator: "§List of Certificate Uses (p.10)"
      maps_to: [minimal-information-proof]
    - item: "Digital signatures (unforgeability)"
      locator: "§List of Certificate Uses (p.10)"
      maps_to: []
      note: "A property, not an exchange. See non_flows prove-non-composition for its limit."
    - item: "Timestamping / notary services"
      locator: "§List of Certificate Uses (p.10)"
      maps_to: [certification-right-expiration]
    - item: "Host authentication"
      locator: "§List of Certificate Uses (p.10)"
      maps_to: [certificate-issuance, certification-right-expiration]
      note: "Guard light-bureaucracy."
    - item: "Service authentication"
      locator: "§List of Certificate Uses (p.10)"
      maps_to: [certificate-issuance]
    - item: "Trust model must be a web (people want to choose whom they trust)."
      locator: "§List of Certificate Uses, Other requirements (p.10)"
      maps_to: [certificate-chain-following]
    - item: "Some applications (e.g., notary services) require highly trusted keys; generation complexity is not an issue here."
      locator: "§List of Certificate Uses, Other requirements (p.10)"
      maps_to: [certificate-issuance]
    - item: "Some applications (e.g., host authentication) require extremely light (or no) bureaucracy."
      locator: "§List of Certificate Uses, Other requirements (p.10)"
      maps_to: [certificate-issuance]
    - item: "Especially in lower-end applications (e.g. host authentication) the people generating the keys (e.g., administrators) will change"
      locator: "§List of Certificate Uses, Other requirements (p.11)"
      maps_to: [certification-right-expiration]
    - item: "Keys will need to be cached locally to avoid long delays fetching frequently used keys."
      locator: "§List of Certificate Uses, Other requirements (p.11)"
      maps_to: [key-caching]
    - item: "Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates)."
      locator: "§List of Certificate Uses, Other requirements (p.11)"
      maps_to: [revocation-distribution]
non_flows:
  - id: prove-non-composition
    question: "Proving that I did not compose a message someone signed with my stolen private key."
    locator: "§Open Questions Q1 (p.11)"
    finding: "Certificates cannot do it. It is a matter of private key protection, which no certificate format, content or issuing machinery can ensure or prove."
    quotes:
      - |-
        How do I prove that I didn't compose and send the message?  What kind of certificate characteristic might help me in this?
      - |-
        This is an issue of (non-)repudiation and therefore a matter of private key protection.  Although this is of interest to the user of certificates, certificate format, contents or issuing machinery can not ensure the protection of a user's private key or prove whether or not a private key has been stolen or misused.
  - id: title-scan
    question: "Using certificates to do a title scan for a house purchase."
    locator: "§Open Questions Q2 (p.11)"
    finding: "Certificates can carry the information tamper-proof, but the database of titles and liens is unrelated to certificate structure."
    quotes:
      - |-
        Can certificates help do a title scan for purchase of a house?
      - |-
        Certificates might be employed to carry information in a tamper-proof way, but building the database necessary to record all house titles and all liens is a project not related to certificate structure.
  - id: prove-a-negative
    question: "A certificate guaranteeing that I am not already married."
    locator: "§Open Questions Q3 (p.12)"
    finding: "Absence of attributes cannot in general be determined. A certificate can carry the negative as a positive attribute issued by an organization that can determine it (flow negative-fact-as-positive-attribute), but the determination is not part of the certificate definition."
    quotes:
      - |-
        The absence of attributes can be determined only if all relevant records are digitized and all parties have inescapable IDs.  The former is not likely to happen in our lifetimes and the latter receives political resistance.
      - |-
        The method of determining such a negative fact is not part of the certificate definition.
  - id: prevent-key-loaning
    question: "Preventing a holder of a valuable certificate from loaning out the private key."
    locator: "§Open Questions Q4 (p.12); §List of Certificate Uses, item 'This signed-key should be considered equivalent' (p.10)"
    finding: "Nothing in the certificate prevents it. The source calls it a potential flaw in any authorization system and observes that a delegation-allowed bit would not help."
    quotes:
      - |-
        However, in some cases the certificate itself might have monetary value [permission to prescribe drugs, permission to buy alcohol, ...].  What is to prevent the holder of such a certificate from loaning out his private key?
      - |-
        This is a potential flaw in any system providing authorization and an interesting topic for study.
      - |-
        but there's nothing to stop someone who wishes to delegate against the rules from also loaning out their private key.
  - id: reader-to-creator-errors
    question: "An error channel from the reader of a certificate back to its creator."
    locator: "§Implementation of Certificates ¶2 (p.5)"
    finding: "Deliberately absent. The creator is to be constrained by the structure definition, not by complaints or error messages from readers."
    quotes:
      - |-
        the creator of a certificate is constrained by the structure definition, not by complaints (or error messages) from the reader of a certificate.
  - id: repository-protocol
    question: "A protocol for publishing to or fetching from a global repository."
    locator: "§General Requirements ¶5 (p.3)"
    finding: "Expressly not for the SPKI WG to specify."
    quotes:
      - |-
        that is up to the keyholder and not for the SPKI WG to specify.
  - id: crl-transport
    question: "How a CRL is transmitted."
    locator: "§Validity and CRLs ¶2 (p.4)"
    finding: "Not specified."
    quotes:
      - |-
        Its method of transmission is not specified.
error_paths:
  - id: certificate-signature-invalid
    trigger: "A certificate's signature does not verify."
    detected_by: verifier
    flows: [direct-certificate-distribution]
    outcome: "Not accepted. No outcome is stated."
    inferred: true
    inferred_reason: "Signatures are stated; the failure outcome is not."
    locator: "§Implementation of Certificates ¶5 (p.5)"
    quotes:
      - |-
        A certificate should be signed exactly as it is transmitted.
  - id: signature-check-needs-reformatting
    trigger: "Checking the signature would need the certificate reformatted."
    detected_by: verifier
    flows: [direct-certificate-distribution, certificate-issuance]
    outcome: "The certificate design breaks the requirement. Canonicalizing white space on input, if the format is text, is allowed."
    inferred: false
    locator: "§Implementation of Certificates ¶5 (p.5)"
    quotes:
      - |-
        There should be no reformatting called for in the process of checking a certificate's signature (although one might canonicalize white space during certificate input, for example, if the format is text).
  - id: reader-complaints-not-a-constraint
    trigger: "A creator produces a certificate a reader would complain about."
    detected_by: issuer
    flows: [certificate-issuance]
    outcome: "This should be prevented by the structure definition. No reader-to-creator error message exists."
    inferred: false
    locator: "§Implementation of Certificates ¶2 (p.5)"
    quotes:
      - |-
        In particular, the structure should be specific enough that the creator of a certificate is constrained by the structure definition, not by complaints (or error messages) from the reader of a certificate.
  - id: certificate-outside-validity-period
    trigger: "The current date is outside the certificate's validity period."
    detected_by: verifier
    flows: [direct-certificate-distribution]
    outcome: "Not valid."
    inferred: true
    inferred_reason: "'dates within which it is valid' implies the outcome; no handling is stated."
    locator: "§Validity and CRLs ¶1 (p.4)"
    quotes:
      - |-
        a validity period: dates within which it is valid.
  - id: crl-location-not-given
    trigger: "A certificate that uses a CRL does not say where to find it."
    detected_by: verifier
    flows: [crl-validation]
    outcome: "The certificate breaks the requirement. The verifier's action is unspecified."
    inferred: true
    inferred_reason: "Only the requirement is stated."
    locator: "§Validity and CRLs ¶2 (p.4)"
    quotes:
      - |-
        the certificate that uses it must explicitly tell the verifier where to find the CRL,
  - id: crl-dates-missing-or-overlap
    trigger: "A CRL lacks explicit validity dates, or its dates overlap those of another CRL in the sequence."
    detected_by: verifier
    flows: [crl-validation]
    outcome: "The requirement is broken and behavior falls back to the non-determinism of the minimal CRL."
    inferred: false
    locator: "§Validity and CRLs ¶2 (p.4)"
    quotes:
      - |-
        the CRL must carry explicit validity dates and the dates of a sequence of CRLs must not overlap.
  - id: crl-nondeterminism
    trigger: "Minimal CRLs (no location, no dates) travel by unspecified means and annihilate what they meet."
    detected_by: verifier
    flows: [minimal-crl-propagation]
    outcome: "Non-deterministic program behavior."
    inferred: false
    locator: "§Validity and CRLs ¶2 (p.4)"
    quotes:
      - |-
        Such a CRL leads to non-deterministic program behavior.
  - id: crl-unobtainable
    trigger: "The verifier cannot obtain the CRL."
    detected_by: verifier
    flows: [crl-validation]
    outcome: "unspecified. RFC 2692 does not say whether the certificate is then unusable."
    inferred: true
    inferred_reason: "Not discussed; transmission is unspecified."
    locator: "§Validity and CRLs ¶2 (p.4)"
    quotes:
      - |-
        Its method of transmission is not specified.
  - id: crl-signature-invalid
    trigger: "A CRL's signature does not verify, or is by the wrong key."
    detected_by: verifier
    flows: [crl-validation]
    outcome: "unspecified. Which key must sign the CRL is not stated."
    inferred: true
    inferred_reason: "A signature is a stated component; its check and failure are not."
    locator: "§Validity and CRLs ¶2 (p.4)"
    quotes:
      - |-
        a sequence number and a signature.
  - id: instrument-expired
    trigger: "A CRL or revalidation instrument is past its lifetime."
    detected_by: verifier
    flows: [crl-validation, positive-online-validation, negative-online-validation]
    outcome: "Not usable."
    inferred: true
    inferred_reason: "'must have its own lifetime' is stated; the consequence of expiry is not."
    locator: "§Validity and CRLs ¶5 (p.4)"
    quotes:
      - |-
        Any CRL or revalidation instrument must have its own lifetime.
  - id: zero-lifetime-impossible
    trigger: "An issuer tries to give a CRL or revalidation instrument a lifetime of 0."
    detected_by: crl-issuer
    flows: [crl-validation, positive-online-validation, one-use-instrument-challenge-response]
    outcome: "Not possible, because of communication delays and clock skews. The one-use instrument is the alternative offered."
    inferred: false
    locator: "§Validity and CRLs ¶5 (p.4)"
    quotes:
      - |-
        A lifetime of 0 is not possible because of communication delays and clock skews, although one can consider an instrument whose lifetime is "one use" and which is delivered only as part of a challenge/response protocol.
  - id: clock-skew
    trigger: "Verifier and issuer clocks disagree."
    detected_by: verifier
    flows: [crl-validation, positive-online-validation]
    outcome: "Validation stays deterministic only aside from clock skew. Skew is one reason a 0 lifetime is impossible. No tolerance is given."
    inferred: false
    locator: "§Validity and CRLs ¶2, ¶5 (p.4)"
    quotes:
      - |-
        behavior of certificate validation is deterministic (aside from the question of clock skew).
      - |-
        because of communication delays and clock skews,
  - id: crl-superseded
    trigger: "A CRL meets an earlier CRL in its sequence."
    detected_by: verifier
    flows: [crl-validation, minimal-crl-propagation]
    outcome: "The earlier CRL is annihilated."
    inferred: false
    locator: "§Validity and CRLs ¶2 (p.4)"
    quotes:
      - |-
        If it encounters a previous CRL, as indicated by sequence number, then it annihilates that previous CRL.
    note: "Stated for the minimal CRL."
  - id: certificate-listed-in-crl
    trigger: "The certificate is listed in the CRL."
    detected_by: verifier
    flows: [crl-validation, minimal-crl-propagation, negative-online-validation]
    outcome: "The certificate is annihilated."
    inferred: false
    locator: "§Validity and CRLs ¶2 (p.4)"
    quotes:
      - |-
        If it encounters some certificate that it lists, then it annihilates that certificate.
    note: "Stated for the minimal CRL; applying it to conforming CRLs and to negative on-line validation is inferred."
  - id: one-use-instrument-reused
    trigger: "A one-use instrument is presented a second time."
    detected_by: verifier
    flows: [one-use-instrument-challenge-response]
    outcome: "Outside its lifetime."
    inferred: true
    inferred_reason: "Reuse is not discussed; 'one use' implies it."
    locator: "§Validity and CRLs ¶5 (p.4)"
    quotes:
      - |-
        an instrument whose lifetime is "one use"
  - id: one-use-instrument-outside-challenge-response
    trigger: "A one-use instrument arrives other than as part of a challenge/response."
    detected_by: verifier
    flows: [one-use-instrument-challenge-response]
    outcome: "Not acceptable as a one-use instrument."
    inferred: true
    inferred_reason: "'delivered only as part of' is stated; the consequence is not."
    locator: "§Validity and CRLs ¶5 (p.4)"
    quotes:
      - |-
        which is delivered only as part of a challenge/response protocol.
  - id: name-unresolved
    trigger: "A name used for delayed binding cannot be resolved into a key."
    detected_by: verifier
    flows: [delayed-binding-resolution]
    outcome: "unspecified."
    inferred: true
    inferred_reason: "Resolution is stated; failure is not."
    locator: "§General Requirements ¶3 (p.3)"
    quotes:
      - |-
        via a name, later to be resolved into a key.
  - id: key-hash-mismatch
    trigger: "The presented public key does not hash to the hash in the certificate."
    detected_by: verifier
    flows: [delayed-binding-resolution]
    outcome: "The key is not the subject."
    inferred: true
    inferred_reason: "Hash indirection is stated; the comparison is not."
    locator: "§General Requirements ¶3 (p.3)"
    quotes:
      - |-
        That indirection can be via a collision-free hash of the public key
  - id: unique-identification-difficult
    trigger: "A person cannot be uniquely identified for a traditional certificate."
    detected_by: name-binder
    flows: [traditional-certificate-issuance]
    outcome: "unspecified. The source notes only that unique identification is difficult."
    inferred: false
    locator: "§List of Certificate Uses, item '[traditional certificate]' (p.6)"
    quotes:
      - |-
        This requires unique identification of a person (which is difficult in non-digital space, as it is)
  - id: personal-binding-tampered
    trigger: "An entry in my private directory of keys has been altered."
    detected_by: keyholder
    flows: [personal-binding]
    outcome: "Its signature fails, which reveals the tampering."
    inferred: true
    inferred_reason: "Tamper prevention is the stated purpose; detection is inferred."
    locator: "§List of Certificate Uses, item '[personal binding]' (p.6)"
    quotes:
      - |-
        is a signed certificate to prevent tampering with my own private
  - id: chain-broken
    trigger: "A link in a certificate chain is missing or fails."
    detected_by: verifier
    flows: [certificate-chain-following, mail-receiver-certification-chain]
    outcome: "unspecified."
    inferred: true
    inferred_reason: "Chains are stated; failure is not discussed."
    locator: "§List of Certificate Uses, item 'My bank would issue a certificate' (p.6)"
    quotes:
      - |-
        so that I could follow a certificate chain from a key I know (my bank's)
  - id: untrusted-root
    trigger: "A chain starts from a key the verifier has not chosen to trust."
    detected_by: verifier
    flows: [certificate-chain-following]
    outcome: "Not trusted. People choose whom they trust or treat as roots."
    inferred: true
    inferred_reason: "The web trust model is stated; rejection of an unchosen root is inferred."
    locator: "§List of Certificate Uses, Other requirements, item 'Trust model must be a web' (p.10)"
    quotes:
      - |-
        People must be able to choose whom they trust or consider reliable roots (maybe with varying reliabilities).
  - id: short-term-certificate-expired
    trigger: "The short-term key certificate has expired."
    detected_by: verifier
    flows: [smart-card-short-term-key]
    outcome: "The signed key is no longer equivalent to the certifying key."
    inferred: false
    locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent' (p.9)"
    quotes:
      - |-
        This signed-key should be considered equivalent to the certifying-key until this certificate expires
  - id: purpose-not-listed
    trigger: "The short-term key is used for a purpose its certificate does not list."
    detected_by: verifier
    flows: [smart-card-short-term-key]
    outcome: "Not equivalent for that purpose."
    inferred: true
    inferred_reason: "'for the following purposes' implies the limit; no handling is stated."
    locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent' (p.9)"
    quotes:
      - |-
        for the following purposes ...
  - id: delegation-against-rules-by-key-loaning
    trigger: "A holder who may not delegate lends out the private key instead."
    detected_by: none
    flows: [certificate-issuance, smart-card-short-term-key]
    outcome: "Unpreventable by any certificate bit: nothing stops the holder lending out the private key."
    non_flow: prevent-key-loaning
    inferred: false
    locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent' (p.10); §Open Questions Q4 (p.12)"
    quotes:
      - |-
        there's nothing to stop someone who wishes to delegate against the rules from also loaning out their private key.
      - |-
        This is a potential flaw in any system providing authorization and an interesting topic for study.
  - id: key-stolen-signature
    trigger: "Someone signs with my stolen private key."
    detected_by: none
    flows: []
    outcome: "Certificates cannot prove whether the key was stolen or misused."
    non_flow: prove-non-composition
    inferred: false
    locator: "§Open Questions Q1 (p.11)"
    quotes:
      - |-
        certificate format, contents or issuing machinery can not ensure the protection of a user's private key or prove whether or not a private key has been stolen or misused.
  - id: revocation-not-yet-propagated
    trigger: "A verifier acts before a revocation or a ceased right has reached it."
    detected_by: none
    flows: [revocation-distribution, certification-right-expiration]
    outcome: "It may accept what has been revoked. The goal of the order of '24 hours' bounds the window only loosely."
    inferred: true
    inferred_reason: "The propagation goal is stated; the exposure is inferred."
    locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution of key revocations' (p.11)"
    quotes:
      - |-
        May involve goals like "will have spread everywhere in 24 hours" or something like that.
  - id: stale-cache
    trigger: "A cached key has been revoked since it was cached."
    detected_by: key-cache
    flows: [key-caching, revocation-distribution]
    outcome: "The cache serves a revoked key unless it accounts for revocations."
    inferred: true
    inferred_reason: "Only 'This interacts with caching' is stated."
    locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution of key revocations' (p.11)"
    quotes:
      - |-
        This interacts with caching.
  - id: certifier-right-ceased
    trigger: "An administrator whose right to certify has ended certifies again."
    detected_by: verifier
    flows: [certification-right-expiration]
    outcome: "Not accepted, while keys certified before the end stay valid."
    inferred: true
    inferred_reason: "The intent is stated; the verifier rule is inferred."
    locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications' (p.11)"
    quotes:
      - |-
        you will no longer want them to be able to certify.  On the other hand, you will usually also not want all keys they have generated to expire.
  - id: central-administrator-unreachable
    trigger: "An application such as host authentication cannot reach a central administrator."
    detected_by: issuer
    flows: [certificate-issuance]
    outcome: "This must not block the application, which needs extremely light or no bureaucracy."
    inferred: true
    inferred_reason: "The source says only that such applications require extremely light (or no) bureaucracy and that communication with the central administrator may be a problem. That issuance must then proceed without the administrator is inferred."
    locator: "§List of Certificate Uses, Other requirements, item 'Some applications (e.g., host authentication)' (p.10)"
    quotes:
      - |-
        Even communication with the central administrator may be a problem.
  - id: dossier-aggregation
    trigger: "Information across many certificates is gathered together."
    detected_by: none
    flows: [direct-certificate-distribution, minimal-information-proof]
    outcome: "A dossier, a privacy violation. The mitigation is minimum information per certificate."
    inferred: false
    locator: "§General Requirements ¶6 (p.3)"
    quotes:
      - |-
        Because SPKI certificates will carry information that, taken together over all certificates, might constitute a dossier and therefore a privacy violation,
  - id: shared-private-key
    trigger: "Several people share a departmental certificate."
    detected_by: none
    flows: [minimal-information-proof, certificate-issuance]
    outcome: "The private key would have to be shared, which the source rejects."
    inferred: false
    locator: "§List of Certificate Uses, item 'I'm the a purchasing agent' (p.9)"
    quotes:
      - |-
        [the private key would need to be shared--yuck!]
  - id: negative-fact-undeterminable
    trigger: "A negative fact is asked for where records are not all digitized or IDs are escapable."
    detected_by: negative-fact-organization
    flows: [negative-fact-as-positive-attribute]
    outcome: "Absence cannot be determined."
    inferred: false
    locator: "§Open Questions Q3 (p.12)"
    quotes:
      - |-
        The absence of attributes can be determined only if all relevant records are digitized and all parties have inescapable IDs.
  - id: online-service-bottleneck
    trigger: "Every lookup goes to an on-line directory."
    detected_by: none
    flows: [online-directory-lookup]
    outcome: "A performance bottleneck, which is why certificates were introduced."
    inferred: false
    locator: "§Background ¶1 (p.2)"
    quotes:
      - |-
        an on-line service has the disadvantage of being a performance bottleneck.
source_defects_and_ambiguities:
  - id: experimental-protocol-boilerplate
    kind: inconsistency
    locator: "Status of this Memo (p.1)"
    text: "The status boilerplate says the memo defines an Experimental Protocol. The document defines no protocol; it is a requirements summary."
    quotes:
      - |-
        This memo defines an Experimental Protocol for the Internet community.
  - id: charter-vs-scope
    kind: inconsistency
    locator: "§Charter of the SPKI working group ¶2 (p.2); §General Requirements ¶5 (p.3)"
    text: "The charter tasks the WG with key acquisition protocols, but the requirements leave certificate distribution to the keyholder and put repositories out of the WG's scope. No acquisition protocol is required anywhere in the document."
    quotes:
      - |-
        and key acquisition protocols.
      - |-
        that is up to the keyholder and not for the SPKI WG to specify.
  - id: crl-grammatical-actor
    kind: ambiguity
    locator: "§Validity and CRLs ¶2 (p.4)"
    text: "The CRL is the grammatical subject of 'encounters' and 'annihilates'. The party that applies the CRL (the verifier, presumably) is never named."
    quotes:
      - |-
        If it encounters some certificate that it lists, then it annihilates that certificate.
  - id: annihilation-scope
    kind: gap
    locator: "§Validity and CRLs ¶2 (p.4)"
    text: "Annihilation of listed certificates and of previous CRLs is stated for the minimal CRL. The source then adds requirements but never restates the listing semantics for a CRL that meets them. It is also unclear whether sequence-number supersession still applies once dates may not overlap."
    quotes:
      - |-
        A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.
  - id: crl-signer-unnamed
    kind: gap
    locator: "§Validity and CRLs ¶2 (p.4)"
    text: "A CRL carries a signature, and the certificate must say where the CRL is. Nothing says whose signature it must be or how the verifier knows the right CRL key, so a CRL signed by anyone at the stated location is not ruled out."
    quotes:
      - |-
        the certificate that uses it must explicitly tell the verifier where to find the CRL,
  - id: certificate-identifier-undefined
    kind: gap
    locator: "§Validity and CRLs ¶2 (p.4)"
    text: "Revoked certificates are 'identified uniquely'; the identifier is not defined."
    quotes:
      - |-
        a list of revoked certificates, identified uniquely,
  - id: negative-online-validation-undefined
    kind: gap
    locator: "§Validity and CRLs ¶4 (p.4)"
    text: "'negative on-line validations' is used once and never described. Whether it is an on-line CRL fetch or a per-certificate negative answer is open."
    quotes:
      - |-
        SPKI should support both positive and negative on-line validations.
  - id: revalidation-instrument-undefined
    kind: gap
    locator: "§Validity and CRLs ¶5 (p.4)"
    text: "'revalidation instrument' appears only in the lifetime sentence. Its relation to the positive on-line validation of ¶3 and ¶4 is not stated."
    quotes:
      - |-
        Any CRL or revalidation instrument must have its own lifetime.
  - id: one-use-parties
    kind: gap
    locator: "§Validity and CRLs ¶5 (p.4)"
    text: "The challenge/response for the one-use instrument names neither challenger nor responder, nor what binds the instrument to the challenge."
    quotes:
      - |-
        which is delivered only as part of a challenge/response protocol.
  - id: clock-skew-unquantified
    kind: gap
    locator: "§Validity and CRLs ¶2, ¶5 (p.4)"
    text: "Clock skew is named twice as a limit on determinism and on lifetimes, with no tolerance."
    quotes:
      - |-
        (aside from the question of clock skew)
  - id: typo-singing
    kind: defect
    locator: "§List of Certificate Uses, item '[personal binding]' (p.6)"
    text: "'singing someone else's key' is evidently 'signing'."
    quotes:
      - |-
        This kind of certificate is signed by me, singing someone else's key
  - id: typo-purchasing-agent
    kind: defect
    locator: "§List of Certificate Uses, item 'I'm the a purchasing agent' (p.9)"
    text: "'I'm the a purchasing agent' and 'posses' are typos."
    quotes:
      - |-
        I'm the a purchasing agent for a large corporation.  I want to posses a certificate
  - id: typo-a-this
    kind: defect
    locator: "§List of Certificate Uses, item 'I am the current legitimate owner of a this DNS name' (p.10)"
    text: "'a this DNS name' is a typo."
    quotes:
      - |-
        "I am the current legitimate owner of a this DNS name or subtree."
  - id: rfc822-quote-bracket
    kind: ambiguity
    locator: "§List of Certificate Uses, item 'I am the legitimate receiver of mail' (p.10)"
    text: "The editorial bracket about DNS-name-owner signing sits inside the quotation marks of the certificate statement, unlike every other item, where commentary follows the closing quote."
    quotes:
      - |-
        "I am the legitimate receiver of mail sent to this rfc822 email address.  [this might need to be signed by a key which itself had been certified by the appropriate "DNS name owner" certificate]."
  - id: first-person-claims
    kind: ambiguity
    locator: "§List of Certificate Uses, items 'I am the current legitimate owner' (p.10)"
    text: "Ownership statements are worded in the first person ('I am the current legitimate owner'), as if self-signed, but self-assertion cannot establish ownership. Except for the mail-receiver bracket, the signer is never named."
    quotes:
      - |-
        "I am the current legitimate owner of a particular chunk of Internet address space."
  - id: dangling-spki-citation
    kind: defect
    locator: "Abstract (p.1); References (p.12)"
    text: "[SPKI] is written as a citation but the References list only [DH] and [KOHN]. SDSI, NACHA, LDAP and PGP are named without references."
    quotes:
      - |-
        The IETF Simple Public Key Infrastructure [SPKI] Working Group
  - id: wallet-list-flat
    kind: ambiguity
    locator: "§List of Certificate Uses, item 'There are a number of cards' (p.7-9)"
    text: "The wallet cards are indented at the same level as the parent item, so where the card list ends (before 'permission to spend up to $X'? before 'I'm a sysadmin'?) is not marked."
    quotes:
      - |-
        There are a number of cards one carries in a typical wallet which could become certificates attached to a public key:
  - id: other-requirements-status
    kind: ambiguity
    locator: "§List of Certificate Uses, Other requirements (p.10-11)"
    text: "'Other requirements:' is a sub-heading nested inside the brainstorming list, under 'Service authentication', at the indent of a sub-item. Its items use 'must' ('Trust model must be a web'), but they sit in the list the Abstract says was summarized into requirements, not in the summary itself. Their force is unclear."
    quotes:
      - |-
        Other requirements:
      - |-
        Trust model must be a web (people want to choose whom they trust).
  - id: web-vs-master-certifier
    kind: ambiguity
    locator: "§List of Certificate Uses (p.6, p.10)"
    text: "The trust model 'must be a web', yet the chain example routes through a master bank certifier. The two are compatible if the master certifier is a root I chose, but the source does not reconcile them."
    quotes:
      - |-
        My bank would issue a certificate signing the key of a master bank certifier -- perhaps NACHA --
  - id: tentative-mechanisms
    kind: ambiguity
    locator: "§List of Certificate Uses (p.10-11)"
    text: "The delegation-allowed bit ('Maybe'), the certification right expiration certificate ('may imply', 'probably'), and the 24-hour goal ('or something like that') are all hedged. None is a requirement."
    quotes:
      - |-
        Maybe we need a "delegation-allowed" bit
      - |-
        This may imply a "certification right expiration" certificate requirement,
  - id: blinded-key-undefined
    kind: gap
    locator: "§General Requirements ¶8 (p.3)"
    text: "'blinded signature key' is not explained. Whether it means a key blinded for a blind signature, or a key whose certificate was blind-signed, is open."
    quotes:
      - |-
        an SPKI certificate must be able to assign an attribute to a blinded signature key.
  - id: page-break-sentences
    kind: note
    locator: "§General Requirements ¶9 (p.3-4); §Implementation of Certificates ¶1 (p.4-5); §List of Certificate Uses, items '[personal binding]' (p.6-7), 'This signed-key should be considered equivalent' (p.9-10)"
    text: "Three sentences and one bracketed comment cross page breaks: the SDSI sentence, the smart-card sentence of §Implementation of Certificates ¶1, the personal-binding sentence, and the bracketed comment of the signed-key item, whose last sentence before the break ends at 'long term key.'. Quotes here stop at the break and say so."
    quotes:
      - |-
        therefore if possible SPKI should support the SDSI
not_defined:
  - "Any transport, framing or encoding for anything exchanged. Certificate structure is left to the SPKI WG's structure work, which this document does not cite. Library pointer, not from the source: RFC 2693 and draft-ietf-spki-cert-structure."
  - "CRL transmission ('not specified'), CRL format beyond the minimal components, the certificate identifier, the CRL signer and the verifier's response to a missing, expired or overlapping CRL."
  - "Any request or response for positive or negative on-line validation, and the party that provides it."
  - "The challenge/response protocol for one-use instruments: parties, challenge content and binding."
  - "Protocols for global repositories (LDAP, PGP key server, DNS): 'not for the SPKI WG to specify'."
  - "Proof that a presenter controls the private key (proof of possession)."
  - "Name resolution for delayed binding. The SDSI name construct is named, 'if possible', and not defined."
  - "How certificate chains are discovered, assembled or delivered."
  - "Delegation control. A 'delegation-allowed' bit is floated and not adopted."
  - "Key cache behavior: lifetimes, invalidation, interaction with revocations."
  - "The revocation distribution mechanism, its issuer and its relation to CRLs. The 24-hour figure is a hedged example."
  - "The certification right expiration certificate and the notary/timestamp service it would use."
  - "Blinding for secret-ballot keys."
  - "Audit identity format. It belongs to 'the domain of the particular application'."
  - "Error signalling of any kind. The structure, not reader error messages, is to constrain creators."
  - "Clock synchronization tolerances."
