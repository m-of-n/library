    summary: >-
      The baseline the requirements are written against. A minimal CRL
      annihilates any certificate it lists and any earlier CRL it meets. Its
      transmission is not specified, so what a verifier holds depends on what
      happens to have reached it, and program behavior is non-deterministic.
      The source does not reject CRLs. It takes the three requirements of
      crl-validation as the fix.
    constrained_by: []
    steps:
      - n: 1
        from: crl-issuer
        to: verifier
        message: crl
        action: "A minimal CRL (list of revoked certificates, sequence number, signature) arrives by an unspecified method."
        inferred: false
        locator: "§Validity and CRLs ¶2 (p.4)"
        quotes:
          - |-
            A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.  Its method of transmission is not specified.
        on_error: "unspecified."
        on_error_basis: unspecified
      - n: 2
        from: verifier
        to: verifier
        message: crl
        action: "Meeting a certificate it lists, the CRL annihilates the certificate. Meeting a previous CRL, as shown by sequence number, it annihilates that CRL."
        inferred: false
        locator: "§Validity and CRLs ¶2 (p.4)"
        quotes:
          - |-
            If it encounters some certificate that it lists, then it annihilates that certificate.  If it encounters a previous CRL, as indicated by sequence number, then it annihilates that previous CRL.
        on_error: "Program behavior is non-deterministic."
        on_error_basis: stated
        on_error_quotes:
          - |-
            Such a CRL leads to non-deterministic program behavior.
    guards: []
    error_path_ids:
      - crl-nondeterminism
      - crl-superseded
      - certificate-listed-in-crl
