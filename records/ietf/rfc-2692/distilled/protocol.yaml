message_notes:
  - name: spki-certificate
    in_source: "yes"
    note: "'SPKI certificate' throughout. Purpose: 'to authorize some action, give permission, grant a capability, etc. to or for a keyholder' (§General Requirements ¶2). No structure is given."
  - name: authorization
    in_source: "yes"
    note: "'attributes or authorizations in a certificate' (§General Requirements ¶4). Defined by the code author. A component of spki-certificate, not sent alone."
  - name: validity-period
    in_source: "yes"
    note: "'a validity period: dates within which it is valid' (§Validity and CRLs ¶1). A component of spki-certificate."
  - name: public-key
    in_source: "yes"
    note: "'The keyholder is most directly identified by the public key itself' (§General Requirements ¶3); also what the key-cache stores ('fetching frequently used keys')."
  - name: public-key-hash
    in_source: "yes"
    note: "'a collision-free hash of the public key' (§General Requirements ¶3), one form of delayed binding."
  - name: name
    in_source: "yes"
    note: "'a name, later to be resolved into a key' (§General Requirements ¶3); names a keyholder prefers or is known by (¶9). SDSI name construct named, not defined."
  - name: crl
    in_source: "yes"
    note: "Minimal CRL: 'a list of revoked certificates, identified uniquely, a sequence number and a signature' (§Validity and CRLs ¶2); a conforming CRL adds 'explicit validity dates' and has its own lifetime (¶5)."
  - name: crl-location
    in_source: "yes"
    note: "What 'the certificate that uses it must explicitly tell the verifier', namely 'where to find the CRL' (§Validity and CRLs ¶2). Carried in spki-certificate. Form not given."
  - name: online-validation-request
    in_source: "no"
    note: "not-in-source. No request for on-line validation is defined; the step that sends one is inferred."
  - name: positive-online-validation
    in_source: "yes"
    note: "'positive statements -- on-line validation of a single check, ATM card or credit card' (§Validity and CRLs ¶3); 'positive and negative on-line validations' (¶4). Taken to be a revalidation-instrument (inferred)."
  - name: negative-online-validation
    in_source: "yes"
    note: "Named only in 'SPKI should support both positive and negative on-line validations' (§Validity and CRLs ¶4). The only negative statement the source describes is the CRL; equating the two is inferred."
  - name: revalidation-instrument
    in_source: "yes"
    note: "'Any CRL or revalidation instrument must have its own lifetime' (§Validity and CRLs ¶5). Not otherwise described."
  - name: challenge
    in_source: "yes"
    note: "Implied by 'challenge/response protocol' (§Validity and CRLs ¶5). Content and sender not given."
  - name: response
    in_source: "yes"
    note: "Implied by 'challenge/response protocol' (§Validity and CRLs ¶5); carries the one-use-instrument."
  - name: one-use-instrument
    in_source: "yes"
    note: "'an instrument whose lifetime is \"one use\" and which is delivered only as part of a challenge/response protocol' (§Validity and CRLs ¶5)."
  - name: signed-request
    in_source: "no"
    note: "not-in-source. The source defines the keyholder as whoever controls the private key and says the keyholder proves permission to act, but defines no proof-of-possession exchange."
  - name: traditional-certificate
    in_source: "yes"
    note: "'[traditional certificate] binding a key to a name' (§List of Certificate Uses, p.6)."
  - name: direct-certificate
    in_source: "yes"
    note: "'[direct certificate] binding a name to a key', a self-signed certificate (§List of Certificate Uses, p.6)."
  - name: personal-binding
    in_source: "yes"
    note: "'[personal binding] binding a key to a nickname', for my use only and never given out (§List of Certificate Uses, p.6-7)."
  - name: reputation-voucher
    in_source: "yes"
    note: "'a certificate (a \"reputation voucher\")' (§List of Certificate Uses, p.6)."
  - name: certificate-chain
    in_source: "yes"
    note: "'follow a certificate chain from a key I know (my bank's)' (§List of Certificate Uses, p.6). How a chain is assembled or delivered is not given."
  - name: short-term-key-certificate
    in_source: "yes"
    note: "The certificate stating 'This signed-key should be considered equivalent to the certifying-key until this certificate expires for the following purposes ...', issued by a smart card 'to certify a short-term key pair' (§List of Certificate Uses, p.9). The name is ours; the noun is the source's."
  - name: key-revocation
    in_source: "yes"
    note: "'Reliable distribution of key revocations' (§List of Certificate Uses, Other requirements, p.11). Whether a key revocation is a CRL is not said."
  - name: certification-right-expiration-certificate
    in_source: "yes"
    note: "'a \"certification right expiration\" certificate requirement' (§List of Certificate Uses, Other requirements, p.11); also 'the ceasing of the right to make new certificates'. Tentative ('may imply')."
  - name: timestamp
    in_source: "partly"
    note: "'Timestamping / notary services' (§List of Certificate Uses, p.10). No timestamp object is described; its use in certification-right-expiration is inferred."
  - name: dns-name-owner-certificate
    in_source: "yes"
    note: "'the appropriate \"DNS name owner\" certificate' (§List of Certificate Uses, p.10); also the item 'I am the current legitimate owner of a this DNS name or subtree.'"
  - name: mail-receiver-certificate
    in_source: "partly"
    note: "The certificate stating 'I am the legitimate receiver of mail sent to this rfc822 email address.' (§List of Certificate Uses, p.10). The name is ours."
  - name: blinded-signature-key
    in_source: "yes"
    note: "'an SPKI certificate must be able to assign an attribute to a blinded signature key' (§General Requirements ¶8). Blinding is not described."
  - name: signed-directory-entry
    in_source: "yes"
    note: "Historical: Kohnfelder's 'digitally signed directory entries which he called certificates' (§Background ¶1)."
  - name: directory-lookup
    in_source: "partly"
    note: "Historical: looking up a partner 'in the directory' to find the public key (§Background ¶1). No message is described."
flows:
  - name: direct-certificate-distribution
    title: "The keyholder hands certificates straight to the verifier"
    locator: "§General Requirements ¶5, ¶6 (p.3); §Implementation of Certificates ¶5 (p.5); §Validity and CRLs ¶1 (p.4); §Background ¶2 (p.2)"
    kind: exchange
    status: assumed
    participants:
      - keyholder
      - verifier
    summary: >-
      The default distribution model. Certificates may carry information the
      keyholder does not want published, so the source assumes the keyholder
      gives them directly to the verifier. Everything after the hand-over (the
      signature check, the validity dates, the authorization decision) rests on
      requirements the source states about certificates, not on a procedure it
      gives.
    constrained_by: []
    steps:
      - n: 1
        from: keyholder
        to: keyholder
        message: spki-certificate
        action: "Release no more than is needed: present the certificate that grants the permission in question, carrying the minimum information."
        inferred: false
        locator: "§General Requirements ¶6 (p.3)"
        quotes:
          - |-
            The keyholder should be able to release a minimum of information in order to prove his or her permission to act.
        on_error: "Releasing more than needed lets certificates be gathered into a dossier, which the source calls a privacy violation. This is a harm, not a protocol error."
        on_error_basis: stated
        on_error_quotes:
          - |-
            Because SPKI certificates will carry information that, taken together over all certificates, might constitute a dossier and therefore a privacy violation, each SPKI certificate should carry the minimum information necessary to get a job done.
      - n: 2
        from: keyholder
        to: verifier
        message: spki-certificate
        action: "Give the certificate directly to the verifier."
        inferred: false
        locator: "§General Requirements ¶5 (p.3)"
        quotes:
          - |-
            Because SPKI certificates might carry information that the keyholder might not want to publish, we assume that certificates will be distributed directly by the keyholder to the verifier.
        on_error: "unspecified; no transport, framing or delivery failure is described."
        on_error_basis: unspecified
      - n: 3
        from: verifier
        to: verifier
        message: spki-certificate
        action: "Check the signature over the certificate exactly as it was transmitted, without reformatting it. White space may be canonicalized on input if the format is text."
        inferred: false
        locator: "§Implementation of Certificates ¶5 (p.5)"
        quotes:
          - |-
            A certificate should be signed exactly as it is transmitted.  There should be no reformatting called for in the process of checking a certificate's signature (although one might canonicalize white space during certificate input, for example, if the format is text).
        on_error: "A signature that does not verify means the certificate is not accepted. The source states no outcome."
        on_error_basis: inferred
        on_error_inferred_reason: "The consequence of a failed signature check is never stated in RFC 2692."
      - n: 4
        from: verifier
        to: verifier
        message: validity-period
        action: "Check that the current date is within the certificate's validity period."
        inferred: true
        inferred_reason: "The source requires that a certificate can carry 'dates within which it is valid'. That the verifier checks them is implied, not stated."
        locator: "§Validity and CRLs ¶1 (p.4)"
        quotes:
          - |-
            An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid.
        on_error: "Outside the dates the certificate is not valid."
        on_error_basis: inferred
        on_error_inferred_reason: "'dates within which it is valid' implies invalidity outside them. No handling is stated."
      - n: 5
        from: verifier
        to: verifier
        message: crl
        action: "If the certificate uses a CRL or on-line validation, refine its validity on-line (flows crl-validation, positive-online-validation, negative-online-validation, one-use-instrument-challenge-response)."
        inferred: false
        locator: "§Validity and CRLs ¶1 (p.4)"
        quotes:
          - |-
            It may also be necessary to have on-line refinement of validity.
        on_error: "As in the referenced flows."
        on_error_basis: inferred
        on_error_inferred_reason: "The source states on-line refinement of validity but not how its result bears on this certificate; the referenced flows carry what detail there is."
      - n: 6
        from: verifier
        to: verifier
        message: authorization
        action: "Decide whether the keyholder has been granted the specific authorization, interpreting it as defined by the code author."
        inferred: false
        locator: "§Background ¶2 (p.2); §General Requirements ¶4 (p.3)"
        quotes:
          - |-
            A user of a certificate needs to know whether a given keyholder has been granted some specific authorization.
          - |-
            The definition of attributes or authorizations in a certificate is up to the author of code which uses the certificate.
        on_error: "Not granted: the action is not permitted. No refusal message is defined."
        on_error_basis: inferred
        on_error_inferred_reason: "No decision procedure or refusal is described."
    guards:
      - id: keyholder-controls-private-key
        text: "The party proving permission is the keyholder, defined by control of the private key. How control is shown to the verifier is not given (see minimal-information-proof)."
        inferred: false
        locator: "§General Requirements ¶1 (p.3)"
        quotes:
          - |-
            We define the term KEYHOLDER of a public key to refer to the person or other entity that controls the corresponding private key.
    error_path_ids:
      - certificate-signature-invalid
      - signature-check-needs-reformatting
      - certificate-outside-validity-period
      - dossier-aggregation
  - name: repository-publication
    title: "Optional: the keyholder publishes certificates to a global repository of its choosing"
    locator: "§General Requirements ¶5 (p.3)"
    kind: exchange
    status: considered
    participants:
      - keyholder
      - global-repository
      - verifier
    summary: >-
      The keyholder may publish to a global repository (LDAP, the global PGP
      key server, the DNS database). That is the keyholder's choice and "not
      for the SPKI WG to specify", so no protocol exists for either publication
      or retrieval.
    constrained_by: []
    steps:
      - n: 1
        from: keyholder
        to: global-repository
        message: spki-certificate
        action: "Publish the certificate to a global repository, if the keyholder so wishes."
        inferred: false
        locator: "§General Requirements ¶5 (p.3)"
        quotes:
          - |-
            If the keyholder wishes to use a global repository, such as LDAP, the global PGP key server or the DNS database, that is up to the keyholder and not for the SPKI WG to specify.
        on_error: "unspecified; the repository protocol is out of scope."
        on_error_basis: unspecified
      - n: 2
        from: global-repository
        to: verifier
        message: spki-certificate
        action: "The verifier obtains the certificate from the repository."
        inferred: true
        inferred_reason: "Publishing is pointless without retrieval, but the source says nothing about how a verifier would fetch from a repository."
        locator: "§General Requirements ¶5 (p.3)"
        quotes:
          - |-
            that is up to the keyholder and not for the SPKI WG to specify.
        on_error: "unspecified."
        on_error_basis: unspecified
    guards:
      - id: privacy-default
        text: "Publication is not the default because certificates may carry what the keyholder does not want published."
        inferred: false
        locator: "§General Requirements ¶5 (p.3)"
        quotes:
          - |-
            Because SPKI certificates might carry information that the keyholder might not want to publish, we assume that certificates will be distributed directly by the keyholder to the verifier.
    error_path_ids: []
  - name: certificate-issuance
    title: "A keyholder empowered to grant or delegate an authorization generates and signs a certificate for another keyholder"
    locator: "§Implementation of Certificates ¶1-¶7 (p.4-5); §General Requirements ¶2, ¶3, ¶6, ¶7, ¶8 (p.3); §Validity and CRLs ¶1 (p.4)"
    kind: issuance
    status: required-capability
    participants:
      - issuer
      - keyholder
    summary: >-
      Any keyholder empowered to grant or delegate an authorization may
      generate a certificate for it. The subject keyholder is identified by
      its public key, or indirectly by a hash of the key or a name. The
      certificate carries the minimum information needed, may carry a validity
      period, is signed exactly as it will be transmitted, and is built so that
      its structure, not a reader's complaints, constrains its creator. Most of
      the List of Certificate Uses instantiates this flow (see use_cases).
    constrained_by: []
    steps:
      - n: 1
        from: issuer
        to: issuer
        message: authorization
        action: "Hold the power to grant or delegate the authorization in question."
        inferred: false
        locator: "§Implementation of Certificates ¶1 (p.4)"
        quotes:
          - |-
            should be generated by any keyholder empowered to grant or delegate the authorization in question.
        on_error: "A keyholder not so empowered should not generate the certificate. What a verifier does with one is not stated."
        on_error_basis: inferred
        on_error_inferred_reason: "Empowerment is a stated precondition; its absence has no stated consequence."
      - n: 2
        from: issuer
        to: issuer
        message: public-key
        message_alternatives:
          - public-key-hash
          - name
          - blinded-signature-key
        action: "Identify the subject keyholder: by the public key itself, or indirectly by a collision-free hash of it or by a name to be resolved later. For secret balloting and similar uses, the subject may be a blinded signature key."
        inferred: false
        locator: "§General Requirements ¶3, ¶8 (p.3)"
        quotes:
          - |-
            The keyholder is most directly identified by the public key itself, although for convenience or other purposes some indirection (delayed binding) may be employed.  That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key.
          - |-
            an SPKI certificate must be able to assign an attribute to a blinded signature key.
        on_error: "An indirection that cannot later be resolved fails at the verifier (flow delayed-binding-resolution)."
        on_error_basis: inferred
        on_error_inferred_reason: "Resolution failure is not discussed."
      - n: 3
        from: issuer
        to: issuer
        message: spki-certificate
        action: "Compose the certificate with the bare minimum of fields, an absolute minimum of optional fields, the minimum information to get the job done, and optionally a validity period. Some certificates are anonymous."
        inferred: false
        locator: "§Implementation of Certificates ¶2 (p.5); §General Requirements ¶6, ¶7 (p.3); §Validity and CRLs ¶1 (p.4)"
        quotes:
          - |-
            An SPKI certificate should be as simple as possible.  There should be a bare minimum of fields necessary to get the job done and there should be an absolute minimum of optional fields.
          - |-
            each SPKI certificate should carry the minimum information necessary to get a job done.
          - |-
            It is necessary for at least some certificates to be anonymous.
          - |-
            An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid.
        on_error: "The structure itself is to constrain the creator. There is no error channel from the reader back to the creator."
        on_error_basis: stated
        on_error_quotes:
          - |-
            In particular, the structure should be specific enough that the creator of a certificate is constrained by the structure definition, not by complaints (or error messages) from the reader of a certificate.
      - n: 4
        from: issuer
        to: issuer
        message: spki-certificate
        action: "Encode the certificate without library code and without ASN.1. If possible, use an LR(0) grammar and no recursion."
        inferred: false
        locator: "§Implementation of Certificates ¶4, ¶6, ¶7 (p.5)"
        quotes:
          - |-
            No library code should be required for the packing or parsing of SPKI certificates.  In particular, ASN.1 is not to be used.
          - |-
            For efficiency, if possible, an SPKI certificate should be encoded in an LR(0) grammar.
          - |-
            For efficiency, if possible, an SPKI certificate should be packed and parsed without any recursion.
        on_error: "unspecified; non-conforming encodings have no stated outcome."
        on_error_basis: unspecified
      - n: 5
        from: issuer
        to: issuer
        message: spki-certificate
        action: "Sign the certificate exactly as it will be transmitted."
        inferred: false
        locator: "§Implementation of Certificates ¶5 (p.5)"
        quotes:
          - |-
            A certificate should be signed exactly as it is transmitted.
        on_error: "If checking the signature would need reformatting, the certificate breaks the requirement (white-space canonicalization of text input excepted)."
        on_error_basis: stated
        on_error_quotes:
          - |-
            There should be no reformatting called for in the process of checking a certificate's signature (although one might canonicalize white space during certificate input, for example, if the format is text).
      - n: 6
        from: issuer
        to: keyholder
        message: spki-certificate
        action: "Deliver the certificate to the subject keyholder, who later distributes it directly to verifiers."
        inferred: true
        inferred_reason: "The source assumes the keyholder distributes its certificates (§General Requirements ¶5) but never says how the keyholder receives them from the issuer."
        locator: "§General Requirements ¶5 (p.3)"
        quotes:
          - |-
            we assume that certificates will be distributed directly by the keyholder to the verifier.
        on_error: "unspecified."
        on_error_basis: unspecified
      - n: 7
        from: keyholder
        to: keyholder
        message: spki-certificate
        action: "A keyholder that has been empowered to delegate may in turn act as issuer for the same authorization, forming a chain (flow certificate-chain-following)."
        inferred: true
        inferred_reason: "'grant or delegate' implies that a delegatee can issue onward. The source gives no delegation control. A 'delegation-allowed' bit is only floated ('Maybe')."
        locator: "§Implementation of Certificates ¶1 (p.4); §List of Certificate Uses, item 'This signed-key should be considered equivalent' (p.10)"
        quotes:
          - |-
            any keyholder empowered to grant or delegate the authorization in question.
          - |-
            Maybe we need a "delegation-allowed" bit -- but there's nothing to stop someone who wishes to delegate against the rules from also loaning out their private key.
        on_error: "Delegation against the rules cannot be prevented by any bit, because the delegator can lend out the private key instead."
        on_error_basis: stated
        on_error_quotes:
          - |-
            there's nothing to stop someone who wishes to delegate against the rules from also loaning out their private key.
    guards:
      - id: constrained-environments
        text: "Certificates should be usable on smart cards and small embedded systems, with processing code and storage as small as possible."
        inferred: false
        locator: "§Implementation of Certificates ¶1 (p.4-5)"
        quotes:
          - |-
            In addition, SPKI certificates should be usable in very constrained environments, such as smart cards or small
          - |-
            The code to process them and the memory to store them should both be as small as possible.
        quote_notes:
          - "The first quote stops at the p.4/p.5 page break; the second begins after 'embedded systems.' on p.5."
      - id: light-bureaucracy
        text: "For host authentication the issuance path must need little or no bureaucracy; even reaching a central administrator may be a problem."
        inferred: false
        locator: "§List of Certificate Uses, Other requirements, item 'Some applications (e.g., host authentication)' (p.10)"
        quotes:
          - |-
            Some applications (e.g., host authentication) require extremely light (or no) bureaucracy.  Even communication with the central administrator may be a problem.
      - id: highly-trusted-notary-keys
        text: "Notary services need highly trusted keys; generation complexity is no issue there."
        inferred: false
        locator: "§List of Certificate Uses, Other requirements, item 'Some applications (e.g., notary services)' (p.10)"
        quotes:
          - |-
            Some applications (e.g., notary services) require highly trusted keys; generation complexity is not an issue here.
      - id: no-shared-keys
        text: "Each holder should have a certificate on its own key rather than share a departmental key, which would require sharing the private key."
        inferred: true
        inferred_reason: "Drawn from the purchasing-agent wish, which rejects sharing; it is not stated as a rule."
        locator: "§List of Certificate Uses, item 'I'm the a purchasing agent' (p.9)"
        quotes:
          - |-
            I don't want to have to share a single "Megacorp Purchasing Department Certificate" with others doing the same job [the private key would need to be shared--yuck!].
    error_path_ids:
      - reader-complaints-not-a-constraint
      - signature-check-needs-reformatting
      - delegation-against-rules-by-key-loaning
      - central-administrator-unreachable
      - shared-private-key
  - name: authorization-definition
    title: "The code author defines a new authorization with no interaction with anyone else"
    locator: "§General Requirements ¶4 (p.3)"
    kind: local
    status: required-capability
    participants:
      - code-author
      - issuer
      - verifier
    summary: >-
      Authorizations are defined by whoever writes the code that uses the
      certificate. Creating a new one involves no registry, no other person
      and no organization. Issuers then use it and the verifier's code
      interprets it.
    constrained_by: []
    steps:
      - n: 1
        from: code-author
        to: code-author
        message: authorization
        action: "Define the attribute or authorization, under total control and with no interaction with any other person or organization."
        inferred: false
        locator: "§General Requirements ¶4 (p.3)"
        quotes:
          - |-
            The creation of new authorizations should not require interaction with any other person or organization but rather be under the total control of the author of the code using the certificate.
        on_error: "A definition step that needed registration or approval would break the requirement."
        on_error_basis: inferred
        on_error_inferred_reason: "Restates the requirement as a failure condition."
      - n: 2
        from: code-author
        to: issuer
        message: authorization
        action: "Issuers use the defined authorization in certificates."
        inferred: true
        inferred_reason: "How a defined authorization becomes known to issuers is not stated."
        locator: "§General Requirements ¶4 (p.3)"
        quotes:
          - |-
            The definition of attributes or authorizations in a certificate is up to the author of code which uses the certificate.
        on_error: "unspecified."
        on_error_basis: unspecified
      - n: 3
        from: code-author
        to: verifier
        message: authorization
        action: "The code the author wrote, running at the verifier, interprets the authorization."
        inferred: true
        inferred_reason: "'author of code which uses the certificate' places the definition in the consuming code; that it runs at the verifier is inferred."
        locator: "§General Requirements ¶4 (p.3)"
        quotes:
          - |-
            under the total control of the author of the code using the certificate.
        on_error: "An authorization the code does not know grants nothing."
        on_error_basis: inferred
        on_error_inferred_reason: "Not stated."
    guards: []
    error_path_ids: []
  - name: delayed-binding-resolution
    title: "A certificate that names its keyholder by hash or by name is resolved to a key later"
    locator: "§General Requirements ¶3, ¶9 (p.3-4)"
    kind: local
    status: required-capability
    participants:
      - verifier
      - keyholder
    summary: >-
      Indirection ("delayed binding") identifies the keyholder by a
      collision-free hash of its public key or by a name later resolved into a
      key. The source does not say who resolves, when, or how. For names it
      points at the SDSI name construct, "if possible".
    constrained_by: []
    steps:
      - n: 1
        from: keyholder
        to: verifier
        message: public-key
        action: "Where the certificate carries a hash, the verifier needs the public key itself and checks that it hashes to the value in the certificate."
        inferred: true
        inferred_reason: "Hash indirection is stated; supplying the key and comparing hashes is the only way to use it, and is not described."
        locator: "§General Requirements ¶3 (p.3)"
        quotes:
          - |-
            That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key.
        on_error: "Hash mismatch: the key is not the subject."
        on_error_basis: inferred
        on_error_inferred_reason: "Not stated."
      - n: 2
        from: verifier
        to: verifier
        message: name
        action: "Where the certificate carries a name, resolve the name into a key."
        inferred: false
        locator: "§General Requirements ¶3 (p.3)"
        quotes:
          - |-
            via a name, later to be resolved into a key.
        on_error: "unspecified; no resolution procedure or failure is described."
        on_error_basis: unspecified
    guards:
      - id: sdsi-names
        text: "SPKI should, if possible, support the SDSI name construct for local names. The note says SPKI and SDSI have merged. No construct is defined here."
        inferred: false
        locator: "§General Requirements ¶9 (p.3-4)"
        quotes:
          - |-
            The SDSI work of Rivest and Lampson has done an especially good job of defining and using local name spaces, therefore if possible SPKI should support the SDSI
          - |-
            name construct.  [Note: SPKI and SDSI have merged.]
        quote_notes:
          - "Two quotes because the sentence crosses the p.3/p.4 page break."
    error_path_ids:
      - name-unresolved
      - key-hash-mismatch
  - name: traditional-certificate-issuance
    title: "Someone trustworthy binds a uniquely identified person's name to a key"
    locator: "§List of Certificate Uses, item '[traditional certificate]' (p.6)"
    kind: issuance
    status: brainstorm-use
    participants:
      - name-binder
      - keyholder
      - verifier
    summary: >-
      The traditional model. A key starts out naked and acquires everything
      the named person has. It requires unique identification of a person and
      someone trustworthy to bind the name to the key. The Background explains
      why SPKI regards such bindings as of limited use for trust management.
    constrained_by: []
    steps:
      - n: 1
        from: keyholder
        to: name-binder
        message: name
        action: "Be uniquely identified as a person to the name-binder."
        inferred: true
        inferred_reason: "Unique identification is stated as required; that the keyholder submits to it, and how, is not."
        locator: "§List of Certificate Uses, item '[traditional certificate]' (p.6)"
        quotes:
          - |-
            This requires unique identification of a person (which is difficult in non-digital space, as it is)
        on_error: "Unique identification is difficult, as the source notes. No outcome for failure is given."
        on_error_basis: unspecified
      - n: 2
        from: name-binder
        to: keyholder
        message: traditional-certificate
        action: "Bind the unique name to the key."
        inferred: false
        locator: "§List of Certificate Uses, item '[traditional certificate]' (p.6)"
        quotes:
          - |-
            [traditional certificate] binding a key to a name, implying "all the attributes of the real person having this name are transferred to this key by this certificate".
          - |-
            and someone trustworthy binding that unique name to the key in question.
        on_error: "unspecified."
        on_error_basis: unspecified
      - n: 3
        from: verifier
        to: verifier
        message: traditional-certificate
        action: "Attribute to the key the attributes, permissions and authority of the person bound to it."
        inferred: false
        locator: "§List of Certificate Uses, item '[traditional certificate]' (p.6)"
        quotes:
          - |-
            In this model, a key starts out naked and acquires attributes, permissions and authority from the person bound to it.
        on_error: "unspecified."
        on_error_basis: unspecified
    guards:
      - id: names-rarely-matter
