  - name: crl-validation
    title: "Deterministic CRL check: the certificate says where the CRL is, CRLs carry validity dates, and successive CRLs do not overlap"
    locator: "§Validity and CRLs ¶1, ¶2, ¶5 (p.4)"
    kind: exchange
    status: required-capability
    participants:
      - issuer
      - crl-issuer
      - verifier
    summary: >-
      If SPKI uses CRLs, three requirements make validation deterministic,
      apart from clock skew. The certificate must say where its CRL is, the
      CRL must carry explicit validity dates, and the dates of successive CRLs
      must not overlap. A CRL must have its own lifetime, and a lifetime of 0
      is impossible. The method of transmission is not specified, and the
      source never says who signs the CRL or how the verifier knows the right
      signer. The listing semantics (annihilation) are stated for the minimal
      CRL that the requirements constrain.
    constrained_by: []
    steps:
      - n: 1
        from: issuer
        to: verifier
        message: crl-location
        action: "The certificate explicitly tells the verifier where to find its CRL. It reaches the verifier inside the certificate (flow direct-certificate-distribution)."
        inferred: false
        locator: "§Validity and CRLs ¶2 (p.4)"
        quotes:
          - |-
            Therefore, we take as a requirement that if SPKI uses CRLs, then the certificate that uses it must explicitly tell the verifier where to find the CRL,
        on_error: "A certificate that uses a CRL without saying where it is breaks the requirement; the verifier cannot find the CRL deterministically."
        on_error_basis: inferred
        on_error_inferred_reason: "The requirement is stated; the verifier's response to a missing location is not."
      - n: 2
        from: crl-issuer
        to: crl-issuer
        message: crl
        action: "Issue a CRL: a list of uniquely identified revoked certificates, a sequence number, a signature, and explicit validity dates that do not overlap those of the previous CRL in the sequence. Its lifetime is non-zero."
        inferred: false
        locator: "§Validity and CRLs ¶2, ¶5 (p.4)"
        quotes:
          - |-
            A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.
          - |-
            the CRL must carry explicit validity dates and the dates of a sequence of CRLs must not overlap.
          - |-
            Any CRL or revalidation instrument must have its own lifetime.  A lifetime of 0 is not possible because of communication delays and clock skews,
        on_error: "Overlapping dates, or a CRL with no dates, bring back the non-determinism of the minimal CRL."
        on_error_basis: stated
        on_error_quotes:
          - |-
            Such a CRL leads to non-deterministic program behavior.
      - n: 3
        from: crl-issuer
        to: verifier
        message: crl
        action: "The verifier obtains the CRL from where the certificate said it would be."
        inferred: true
        inferred_reason: "That the verifier fetches from the stated location follows from the requirement. The transport is expressly unspecified."
        locator: "§Validity and CRLs ¶2 (p.4)"
        quotes:
          - |-
            Its method of transmission is not specified.
        on_error: "CRL unobtainable: unspecified. RFC 2692 does not say the certificate then cannot be used."
        on_error_basis: unspecified
      - n: 4
        from: verifier
        to: verifier
        message: crl
        action: "Verify the CRL's signature."
        inferred: true
        inferred_reason: "A signature is a stated component. Which key must have made it, and that the verifier checks it, are not stated."
        locator: "§Validity and CRLs ¶2 (p.4)"
        quotes:
          - |-
            a sequence number and a signature.
        on_error: "unspecified."
        on_error_basis: unspecified
      - n: 5
        from: verifier
        to: verifier
        message: crl
        action: "Check that the time of validation falls within the CRL's validity dates."
        inferred: true
        inferred_reason: "The CRL must carry explicit validity dates and its own lifetime; using them this way is implied."
        locator: "§Validity and CRLs ¶2, ¶5 (p.4)"
        quotes:
          - |-
            the CRL must carry explicit validity dates
          - |-
            Any CRL or revalidation instrument must have its own lifetime.
        on_error: "An expired CRL is not current. Validation remains deterministic only up to clock skew."
        on_error_basis: inferred
        on_error_inferred_reason: "Expiry handling is not stated; the clock-skew caveat is."
      - n: 6
        from: verifier
        to: verifier
        message: crl
        action: "A CRL later in the sequence supersedes an earlier one, as shown by sequence number. With non-overlapping dates at most one CRL in the sequence is current at any time."
        inferred: true
        inferred_reason: "Supersession by sequence number is stated for the minimal CRL only. Applying it to a CRL that meets the three requirements, and the consequence that non-overlap leaves at most one CRL current, are inferred."
        locator: "§Validity and CRLs ¶2 (p.4)"
        quotes:
          - |-
            If it encounters a previous CRL, as indicated by sequence number, then it annihilates that previous CRL.
        on_error: "Superseded CRL: annihilated."
        on_error_basis: stated
        on_error_quotes:
          - |-
            then it annihilates that previous CRL.
        note: "Stated for the minimal CRL. Carrying the same rule over to a CRL that meets the three requirements is inferred, as is the consequence that non-overlap leaves at most one CRL current."
      - n: 7
        from: verifier
        to: verifier
        message: spki-certificate
        action: "If the current CRL lists the certificate, the certificate is annihilated."
        inferred: true
        inferred_reason: "Annihilation is stated for the minimal CRL, with the CRL as the grammatical actor. That the verifier applies it, and that it holds for a conforming CRL, are inferred."
        locator: "§Validity and CRLs ¶2 (p.4)"
        quotes:
          - |-
            If it encounters some certificate that it lists, then it annihilates that certificate.
        on_error: "Listed: the certificate is annihilated (revoked)."
        on_error_basis: stated
        on_error_quotes:
          - |-
            then it annihilates that certificate.
        note: "Stated for the minimal CRL, with the CRL itself as the grammatical actor ('it encounters'). That the verifier applies the rule, and that it holds for a conforming CRL, are inferred."
      - n: 8
        from: verifier
        to: verifier
        message: spki-certificate
        action: "Under the three requirements the result is deterministic, apart from clock skew."
        inferred: false
        locator: "§Validity and CRLs ¶2 (p.4)"
        quotes:
          - |-
            Under this set of requirements, behavior of certificate validation is deterministic (aside from the question of clock skew).
        on_error: "Clock skew can still change the result; the source leaves it unquantified."
        on_error_basis: stated
        on_error_quotes:
          - |-
            (aside from the question of clock skew)
    guards:
      - id: crls-optional
        text: "CRLs are conditional ('if SPKI uses CRLs'); on-line refinement of validity 'may' be necessary."
        inferred: false
        locator: "§Validity and CRLs ¶1, ¶2 (p.4)"
        quotes:
          - |-
            It may also be necessary to have on-line refinement of validity.  This is frequently achieved via a Certificate Revocation List (CRL) in previous certificate designs.
      - id: crl-is-negative
        text: "A CRL is a negative statement, like the paper books of bad checks given to cashiers."
        inferred: false
        locator: "§Validity and CRLs ¶3 (p.4)"
        quotes:
          - |-
            A CRL is a negative statement.  It is the digital equivalent of the little paper books of bad checks or bad credit cards that were distributed to cashiers in the 1970's and before.
    error_path_ids:
      - crl-location-not-given
      - crl-dates-missing-or-overlap
      - crl-unobtainable
      - crl-signature-invalid
      - instrument-expired
      - zero-lifetime-impossible
      - crl-superseded
      - certificate-listed-in-crl
      - clock-skew
  - name: minimal-crl-propagation
    title: "The minimal CRL: transmitted somehow, annihilating what it meets, and therefore non-deterministic"
    locator: "§Validity and CRLs ¶2 (p.4)"
    kind: exchange
    status: described-and-rejected
    participants:
