  - id: "rfc-2692#R-0123"
    object: 'use: key equivalence for stated purposes'
    field: 'purpose: reduce exposure of long-term keys by certifying a short-term key pair from a smart card at login'
    verb: none
    actor: 'keyholder; issuer (long-term key)'
    locator: "§List of Certificate Uses, item 53"
    text: 'This is desirable when you wish to reduce the exposure of long-term keys.  One way to do this is to use smart cards, but those typically have slow processors and are connected through low-bandwidth links; however, if you only use the smart card at "login" time to certify a short-term key pair, you get high performance and low exposure of the long term key.'
    kind: stated
    testable: partial
    testable_reason: 'the pattern, a long-term key used once to certify a short-lived key that then does the work, is testable; "high performance and low exposure" are claimed benefits without measures.'
    status: active
  - id: "rfc-2692#R-0124"
