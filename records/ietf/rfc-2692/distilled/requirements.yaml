    field: 'conflict: certifying a short-term key is delegation, against attempts to prevent delegation of certain rights'
    verb: none
    actor: 'protocol designer'
    locator: "§List of Certificate Uses, item 53"
    text: 'I''ll note here that this flies in the face of attempts to prevent delegation of certain rights.'
    kind: stated
    testable: no
    testable_reason: 'an observation of a design tension, resolved (or not) by R-0125; it states no property of a certificate.'
    status: active
  - id: "rfc-2692#R-0125"
