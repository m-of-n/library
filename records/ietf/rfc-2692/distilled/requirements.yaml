note: >
  Ids are stable and never reused. Cite as rfc-2692#R-NNNN.
  Entries are in source order, with no exception.
  Every text is a verbatim run of the source with the RFC line wrapping
  undone: a source line break and the indent that follows it become a
  single space, and nothing else is altered. So the two spaces the RFC sets
  after a full stop inside a line are kept, while a full stop at a line end
  is followed by one space. Where a text crosses a page break (R-0021,
  R-0035, R-0067) the page footer and header lines, and the blank lines
  around them, are removed first, and the break is then undone like any
  other line break. ONE EXCEPTION: the RFC breaks an already-hyphenated
  word across lines, printing collision- at the end of one line and free at
  the start of the next. It is rejoined with NO space, because inserting one
  would yield a word the source does not contain; R-0009 is verbatim only
  under that rule. A dash of punctuation at a line start (-- from, in item
  7.2, R-0061) is not a hyphenated word and is joined with a space. The
  source sets no displays, and no text crosses a blank line. A list bullet
  marker is not part of any text. The source's typos are kept as printed:
  singing for signing (R-0066), the a and posses (R-0119), a this (R-0128).
  Each text is one contiguous run of source characters; no two
  non-adjacent passages are ever spliced into one entry, and no two entries
  share a source character. The three split sentences and the brackets left
  out of entries are listed in the reconciliation.
  LOCATORS. The source's headings are unnumbered, so a locator is the
  section title as printed, after a section sign: §General Requirements,
  §Validity and CRLs, and so on (§Charter of the SPKI working group keeps
  the source's lower case). The List of Certificate Uses is pinned by item:
  §List of Certificate Uses, item N counts, in source order from 1 to 62,
  every bullet set at the list's outer indent. The wallet cards (items 16 to
  48) are numbered there because the source sets them at that indent; it
  does not mark where the card list ends. Item N.M is the M-th bullet nested
  under item N (only item 7 has them, 7.1 to 7.3). A continuation paragraph
  belongs to the item it follows (the auditing paragraph of item 50, the
  bracketed paragraphs of items 53, 54 and 56). The six bullets that follow
  the line Other requirements:, which the source sets inside the indent of
  item 62, are a sub-list of their own and are pinned as §List of
  Certificate Uses, Other requirements, item 1 to 6. In Open Questions,
  question N is the N-th question with the answer paragraphs that follow it,
  and §Open Questions alone is the section's lead paragraph. Every locator
  was checked mechanically to contain its text.
  Every entry carries verb none: the source has no BCP 14 keyword. No entry
  is kind inferred. An entry of the uses list has actor certificate format
  (design must serve this use) when the use names no role of its own, and
  is testable partial when what a test can check is only that the format
  expresses the use; its testable_reason says so.

requirements:
  - id: "rfc-2692#R-0001"
    object: 'SPKI deliverables'
    field: 'what SPKI is to define: a certificate format, associated signature and other formats, and key acquisition protocols'
    verb: none
    actor: 'protocol designer (SPKI working group)'
    locator: "§Charter of the SPKI working group"
    text: 'The task of the working group will be to develop Internet standards for an IETF sponsored public key certificate format, associated signature and other formats, and key acquisition protocols.'
    kind: stated
    testable: partial
    testable_reason: 'a scope statement about the working group''s output; a reviewer can check that a specification claiming to be SPKI defines a certificate format, its signature format and a key acquisition protocol, but not that it is IETF sponsored or what the other formats are.'
    status: active
  - id: "rfc-2692#R-0002"
    object: 'certificate format and associated protocols'
    field: 'simple to understand, implement and use'
    verb: none
    actor: 'protocol designer'
    locator: "§Charter of the SPKI working group"
    text: 'The key certificate format and associated protocols are to be simple to understand, implement, and use.'
    kind: stated
    testable: no
    testable_reason: 'the charter gives no measure of simplicity; the measurable proxies are the Implementation of Certificates entries (R-0038, R-0039, R-0042 to R-0049).'
    status: active
  - id: "rfc-2692#R-0003"
    object: 'SPKI scope'
    field: 'application neutrality: mechanisms for IPSEC, encrypted mail and WWW documents, payment protocols and any application that needs certificates'
    verb: none
    actor: 'protocol designer'
    locator: "§Charter of the SPKI working group"
    text: 'The SPKI is intended to provide mechanisms to support security in a wide range of Internet applications, including IPSEC protocols, encrypted electronic mail and WWW documents, payment protocols, and any other application which will require the use of public key certificates and the ability to access them.'
    kind: stated
    testable: partial
    testable_reason: 'checkable only per named application, by showing that its authorizations can be carried in an SPKI certificate; "any other application" cannot be exhausted.'
    status: active
  - id: "rfc-2692#R-0004"
    object: 'SPKI trust model'
    field: 'support for a range of trust models, not one'
    verb: none
    actor: 'protocol designer'
    locator: "§Charter of the SPKI working group"
    text: 'It is intended that the Simple Public Key Infrastructure will support a range of trust models.'
    kind: stated
    testable: partial
    testable_reason: 'the range is not enumerated; a test can show that a given model (a single root, verifier-chosen roots as in R-0139, a web as in R-0138) can be expressed, not that every model can.'
    status: active
  - id: "rfc-2692#R-0005"
    object: 'certificate'
    field: 'what a certificate must tell its user: whether a keyholder has been granted a specific authorization'
    verb: none
    actor: 'certificate format (serves the verifier, the user of a certificate)'
    locator: "§Background"
    text: 'A user of a certificate needs to know whether a given keyholder has been granted some specific authorization.'
    kind: stated
    testable: partial
    testable_reason: 'checkable as a property of the format, that a verifier can decide from certificates alone whether a key holds a named authorization; which authorizations are "specific" enough is not defined.'
    status: active
  - id: "rfc-2692#R-0006"
    object: 'keyholder'
    field: 'definition: the person or other entity that controls the private key'
    verb: none
    actor: 'all roles (definition)'
    locator: "§General Requirements"
    text: 'We define the term KEYHOLDER of a public key to refer to the person or other entity that controls the corresponding private key.'
    kind: stated
    testable: no
    testable_reason: 'control of a private key is not observable; a verifier sees only signatures made with it, and the definition is what lets a signature stand for the keyholder. Question 4 of Open Questions (R-0158) is the case in which that fails.'
    status: active
  - id: "rfc-2692#R-0007"
    object: 'SPKI certificate'
    field: 'main purpose: authorizing an action, permission or capability to or for a keyholder'
    verb: none
    actor: 'certificate format'
    locator: "§General Requirements"
    text: 'The main purpose of an SPKI certificate is to authorize some action, give permission, grant a capability, etc. to or for a keyholder.'
    kind: stated
    testable: partial
    testable_reason: 'a statement of purpose; what a test can check is that the format can carry an authorization bound to a key without an intervening name. "etc." leaves the class open.'
    status: active
  - id: "rfc-2692#R-0008"
    object: 'certificate subject'
    field: 'the keyholder identified by the public key itself, with indirection (delayed binding) permitted'
    verb: none
    actor: 'certificate format'
    locator: "§General Requirements"
    text: 'The keyholder is most directly identified by the public key itself, although for convenience or other purposes some indirection (delayed binding) may be employed.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0009"
    object: 'certificate subject'
    field: 'the two permitted indirections: a collision-free hash of the key, or a name later resolved to a key'
    verb: none
    actor: 'certificate format and verifier'
    locator: "§General Requirements"
    text: 'That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0010"
    object: 'attributes and authorizations'
    field: 'their definition belongs to the author of the code that uses the certificate'
    verb: none
    actor: 'application developer (author of code using the certificate)'
    locator: "§General Requirements"
    text: 'The definition of attributes or authorizations in a certificate is up to the author of code which uses the certificate.'
    kind: stated
    testable: partial
    testable_reason: 'checkable as an absence: the format defines no fixed vocabulary or registry of authorizations that an application must draw from. Whether a given application author in fact controls the definition is outside the format.'
    status: active
  - id: "rfc-2692#R-0011"
    object: 'new authorizations'
    field: 'created without interaction with any other person or organization'
    verb: none
    actor: 'application developer (author of code using the certificate)'
    locator: "§General Requirements"
    text: 'The creation of new authorizations should not require interaction with any other person or organization but rather be under the total control of the author of the code using the certificate.'
    kind: stated
    testable: partial
    testable_reason: 'checkable as an absence in the specification: no registration, allocation or approval step stands between an application author and a new authorization. "Total control" is not otherwise measurable.'
    status: active
  - id: "rfc-2692#R-0012"
    object: 'certificate distribution'
    field: 'assumed model: certificates delivered directly by the keyholder to the verifier'
    verb: none
    actor: 'keyholder and verifier'
    locator: "§General Requirements"
    text: 'Because SPKI certificates might carry information that the keyholder might not want to publish, we assume that certificates will be distributed directly by the keyholder to the verifier.'
    kind: stated
    testable: partial
    testable_reason: 'an assumption, not an obligation; its testable consequence is that verification needs no repository lookup when the keyholder presents the certificates.'
    status: active
  - id: "rfc-2692#R-0013"
    object: 'global repositories'
    field: 'out of scope: use of LDAP, a PGP key server or the DNS is the keyholder''s choice and not specified by SPKI'
    verb: none
    actor: 'keyholder; protocol designer (scope)'
    locator: "§General Requirements"
    text: 'If the keyholder wishes to use a global repository, such as LDAP, the global PGP key server or the DNS database, that is up to the keyholder and not for the SPKI WG to specify.'
    kind: stated
    testable: partial
    testable_reason: 'checkable only as an absence: an SPKI specification mandates no repository. The keyholder''s choice is not observable.'
    status: active
  - id: "rfc-2692#R-0014"
    object: 'SPKI certificate content'
    field: 'data minimisation: the minimum information necessary to get a job done, against dossier building'
    verb: none
    actor: 'issuer; certificate format'
    locator: "§General Requirements"
    text: 'Because SPKI certificates will carry information that, taken together over all certificates, might constitute a dossier and therefore a privacy violation, each SPKI certificate should carry the minimum information necessary to get a job done.'
    kind: stated
    testable: partial
    testable_reason: 'what is necessary depends on the job, which only the issuer knows; a reviewer can check that the format forces no field (a name, for instance) that a given authorization does not need.'
    status: active
  - id: "rfc-2692#R-0015"
    object: 'SPKI certificate granularity'
    field: 'one certificate per grant: a single key, not a key ring; a single card, not a wallet'
    verb: none
    actor: 'issuer; certificate format'
    locator: "§General Requirements"
    text: 'The SPKI certificate is then to be like a single key rather than a key ring or a single credit card rather than a whole wallet.'
    kind: stated
    testable: partial
    testable_reason: 'an analogy; its checkable reading is that a keyholder can hold separate certificates for separate authorizations and present one without the others.'
    status: active
  - id: "rfc-2692#R-0016"
    object: 'proof of permission'
    field: 'the keyholder can prove a permission while releasing a minimum of information'
    verb: none
    actor: 'keyholder (prover)'
    locator: "§General Requirements"
    text: 'The keyholder should be able to release a minimum of information in order to prove his or her permission to act.'
    kind: stated
    testable: partial
    testable_reason: 'a test can check that a proof of one permission needs only the certificates of its chain and no unrelated certificate or identity; "minimum" is not defined.'
    status: active
  - id: "rfc-2692#R-0017"
    object: 'anonymous certificates'
    field: 'at least some certificates carry no identity of the keyholder'
    verb: none
    actor: 'certificate format'
    locator: "§General Requirements"
    text: 'It is necessary for at least some certificates to be anonymous.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0018"
    object: 'blinded signature key'
    field: 'an attribute can be assigned to a blinded signature key (secret balloting)'
    verb: none
    actor: 'certificate format; issuer'
    locator: "§General Requirements"
    text: 'Because one use of SPKI certificates is in secret balloting and similar applications, an SPKI certificate must be able to assign an attribute to a blinded signature key.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0019"
    object: 'names'
    field: 'a name is an attribute of a keyholder, of two kinds: names it prefers and names others know it by'
    verb: none
    actor: 'certificate format'
    locator: "§General Requirements"
    text: 'One attribute of a keyholder is a name.  There are names the keyholder prefers to be called and there are names by which the keyholder is known to various other keyholders.'
    kind: stated
    testable: partial
    testable_reason: 'definitional; it is tested through R-0020, which requires both kinds to be bindable, and the uses of item 7 (R-0060 for a self-chosen name, R-0065 and R-0066 for a name another keyholder assigns).'
    status: active
  - id: "rfc-2692#R-0020"
    object: 'name certificate'
    field: 'binding a key to either kind of name'
    verb: none
    actor: 'certificate format; issuer'
    locator: "§General Requirements"
    text: 'An SPKI certificate must be able to bind a key to such names.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0021"
    object: 'SDSI name construct'
    field: 'support for SDSI local name spaces, if possible'
    verb: none
    actor: 'certificate format'
    locator: "§General Requirements"
    text: 'The SDSI work of Rivest and Lampson has done an especially good job of defining and using local name spaces, therefore if possible SPKI should support the SDSI name construct.'
    kind: stated
    testable: partial
    testable_reason: 'whether a format supports SDSI names is checkable, but the requirement is conditional ("if possible") and names no particular SDSI version; the bracketed note that follows records that SPKI and SDSI merged.'
    status: active
  - id: "rfc-2692#R-0022"
    object: 'validity period'
    field: 'a certificate can carry the dates within which it is valid'
    verb: none
    actor: 'certificate format; issuer'
    locator: "§Validity and CRLs"
    text: 'An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0023"
    object: 'on-line validity refinement'
    field: 'a possible need to refine validity on line, beyond the dates'
    verb: none
    actor: 'protocol designer'
    locator: "§Validity and CRLs"
    text: 'It may also be necessary to have on-line refinement of validity.'
    kind: stated
    testable: partial
    testable_reason: 'stated as possibly necessary; the mechanisms it opens are the CRL conditions R-0025 to R-0027 and the positive and negative validations of R-0030, which are testable.'
    status: active
  - id: "rfc-2692#R-0024"
    object: 'minimal CRL (rejected design)'
    field: 'flaw: a CRL that annihilates the certificates and earlier CRLs it meets makes program behavior non-deterministic'
    verb: none
    actor: 'protocol designer'
    locator: "§Validity and CRLs"
    text: 'Such a CRL leads to non-deterministic program behavior.'
    kind: stated
    testable: partial
    testable_reason: 'a finding about the rejected minimal CRL described just before it; demonstrable by showing that the validation outcome depends on the order in which certificates and CRLs are met, but it binds no role except as the reason for R-0025 to R-0027.'
    status: active
  - id: "rfc-2692#R-0025"
    object: 'CRL location'
    field: 'a certificate that uses a CRL tells the verifier explicitly where to find it'
    verb: none
    actor: 'issuer; certificate format'
    locator: "§Validity and CRLs"
    text: 'Therefore, we take as a requirement that if SPKI uses CRLs, then the certificate that uses it must explicitly tell the verifier where to find the CRL'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0026"
    object: 'CRL validity dates'
    field: 'a CRL carries explicit validity dates'
    verb: none
    actor: 'CRL issuer; CRL format'
    locator: "§Validity and CRLs"
    text: 'the CRL must carry explicit validity dates'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0027"
    object: 'CRL sequence'
    field: 'the validity dates of successive CRLs do not overlap'
    verb: none
    actor: 'CRL issuer'
    locator: "§Validity and CRLs"
    text: 'the dates of a sequence of CRLs must not overlap.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0028"
    object: 'certificate validation'
    field: 'deterministic outcome under R-0025 to R-0027, clock skew aside'
    verb: none
    actor: 'verifier'
    locator: "§Validity and CRLs"
    text: 'Under this set of requirements, behavior of certificate validation is deterministic (aside from the question of clock skew).'
    kind: stated
    testable: partial
    testable_reason: 'a test can check that, for fixed inputs and a fixed clock, validation gives the same result whatever the order of arrival; the source exempts clock skew and sets no bound on it.'
    status: active
  - id: "rfc-2692#R-0029"
    object: 'CRL'
    field: 'classification: a CRL is a negative statement'
    verb: none
    actor: 'protocol designer'
    locator: "§Validity and CRLs"
    text: 'A CRL is a negative statement.'
    kind: stated
    testable: partial
    testable_reason: 'a classification that gives R-0030 its meaning; the positive counterpart is defined only by the retail examples that follow it (on-line validation of a single check or card).'
    status: active
  - id: "rfc-2692#R-0030"
    object: 'on-line validation'
    field: 'both positive (revalidation) and negative (revocation) on-line validation'
    verb: none
    actor: 'protocol designer; verifier'
    locator: "§Validity and CRLs"
    text: 'SPKI should support both positive and negative on-line validations.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0031"
    object: 'CRL or revalidation instrument'
    field: 'its own lifetime'
    verb: none
    actor: 'issuer of the instrument; instrument format'
    locator: "§Validity and CRLs"
    text: 'Any CRL or revalidation instrument must have its own lifetime.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0032"
    object: 'CRL or revalidation instrument'
    field: 'no zero lifetime; a one-use instrument delivered inside a challenge/response protocol is the limiting case'
    verb: none
    actor: 'issuer of the instrument; protocol designer'
    locator: "§Validity and CRLs"
    text: 'A lifetime of 0 is not possible because of communication delays and clock skews, although one can consider an instrument whose lifetime is "one use" and which is delivered only as part of a challenge/response protocol.'
    kind: stated
    testable: partial
    testable_reason: 'that no instrument has a zero-length lifetime is checkable; the one-use instrument is something one "can consider", not a defined form, so there is nothing yet to test it against.'
    status: active
  - id: "rfc-2692#R-0033"
    object: 'authorization certificate issuance'
    field: 'any keyholder empowered to grant or delegate an authorization can generate the certificate for it'
    verb: none
    actor: 'issuer (empowered keyholder)'
    locator: "§Implementation of Certificates"
    text: 'The authorization certificates that are envisioned for SPKI (and needed to meet the demands of the list given at the end of this document) should be generated by any keyholder empowered to grant or delegate the authorization in question.'
    kind: stated
    testable: partial
    testable_reason: 'a test can show that a key which is not a certification authority, but holds the authorization, can issue a valid certificate for it; how a keyholder comes to be empowered is not defined here.'
    status: active
  - id: "rfc-2692#R-0034"
    object: 'certificate generation code'
    field: 'written by many independent developers, often working alone'
    verb: none
    actor: 'implementation (developer population)'
    locator: "§Implementation of Certificates"
    text: 'The code to generate certificates should be written by many different developers, frequently persons acting alone, operating out of garages or dorm rooms.'
    kind: stated
    testable: no
