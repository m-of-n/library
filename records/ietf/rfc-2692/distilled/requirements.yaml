reconciliation: "Counts agree at 0, and the zero is measured: bin/bcp14-count finds no capitalised BCP 14 keyword anywhere in the 787-line source, and no entry text carries one. RFC 2692 is an Experimental RFC of September 1999. It never cites RFC 2119, then two and a half years old, and never uses its capitalised keywords, and the RFC 8174 rule that only capitalised keywords are normative came nearly eighteen years later, so the source was never written to that convention and its silence on BCP 14 says nothing about how much of it binds. It is a requirements document, and its own normative baseline is lowercase: should, must and may addressed to the certificate format, the issuer, the keyholder and the verifier; the equivalent forms are to be, is not to be, is intended, it is necessary, needs, we assume and we take as a requirement; scope rulings (is up to the keyholder, not for the SPKI WG to specify, not part of the certificate definition); and the brainstormed list of certificate uses that the Abstract says those requirements summarise. Extracting only keyword-bearing sentences would have extracted nothing, so all 158 entries carry verb none, and the inclusion rule is this. An entry is made for (a) every statement in the Charter, General Requirements, Validity and CRLs and Implementation of Certificates sections, and the one statement in Background, that a format, a protocol or a role must, should, may, is to or needs to satisfy, together with the definitions and adopted assumptions those statements rest on (KEYHOLDER, the main purpose of a certificate, the two kinds of name, the distribution assumption, the CRL as a negative statement); (b) every use in the List of Certificate Uses. Each use is a requirement the design must serve, because the Abstract says the requirements were summarised from this list and R-0033 says the authorization certificates are needed to meet the demands of the list; so every bullet is an entry, every further sentence of a bullet that states a property of the certificate the use calls for, its issuer or its purpose is an entry of its own, and the six bullets under Other requirements are entries like any other; (c) in Open Questions, the answers, wherever they state a scope boundary, a capability of a certificate or a security limitation. The questions themselves are not requirements: the section says they have no answer from certificate definition or issuing alone (R-0151), and each one is posed, not decided. Every lowercase must, should, may, shall, required, recommended and optional in the source is accounted for: 47 occurrences, 41 inside entry texts and 6 excluded, namely the May of May, 1978 in the [KOHN] reference, which is a month, and the may, may, may not, must and required of the Full Copyright Statement, which is boilerplate. Excluded, named so that nothing is dropped silently: the front matter (Status of this Memo, Copyright Notice, the Abstract, whose as easy, simple and extensible a way as possible restates the charter goal R-0002 except for the word extensible, which the Abstract alone uses and no section states as a requirement, and the Table of Contents); in the Charter, the opening paragraph on why protocols require a public key infrastructure (motivation) and the sentence that names the result the Simple Public Key Infrastructure, or SPKI (naming); in Background, the history of Kohnfelder and Diffie and Hellman, and the first two sentences of its second paragraph, the finding that name-key certificates are of extremely limited use for trust management and that a person's name is rarely of security interest, which is the argument whose operative consequence is R-0005 and R-0007; in General Requirements, the editorial bracket Note: SPKI and SDSI have merged, after R-0021; in Validity and CRLs, the history that on-line refinement is frequently achieved by a CRL in previous designs, the four sentences describing the minimal CRL that the section rules out (its contents, its unspecified transmission, and its annihilation of certificates and of earlier CRLs: only its flaw R-0024 and the ruling R-0025 to R-0027 are extracted, as the rfc-2693 extraction treats the anti-matter CRL of its section 5.1), and the two sentences after R-0029 likening a CRL to the paper books of bad checks and naming retail on-line validation as the positive kind; in Implementation of Certificates, the lead-in This leads to a number of constraints on the structure and encoding of certificates; in the List of Certificate Uses, the lead-in calling it a brainstorming list, the aside I currently have a paper version of one in item 51, the line Other requirements: that heads the sub-list, and the pointer Cf. current name servers in its item 5; in Open Questions, the lead-in sentence that the questions mostly concern proofs of the opposite of what a certificate is designed to do, all four questions as posed (including, in question 4, the assumption that a user protects his private key and the remark that a certificate may itself have monetary value, which set up the answer R-0158), the comment in question 3 that digitised records will not come in our lifetimes and that inescapable IDs meet political resistance, and the rhetorical question in question 4 about doctors selling prescriptions; the References; the single sentence of Security Considerations, Security issues are discussed throughout this memo, which is a pointer with no rule of its own (the security-bearing statements it points to are extracted where they stand: R-0012 to R-0018 on privacy, anonymity and blinded keys, R-0024 to R-0032 on CRL determinism and instrument lifetimes, R-0044 and R-0045 on signing the transmitted bytes, R-0121 on shared private keys, R-0122 to R-0125 on short-term keys and delegation, R-0148 to R-0150 on revocation distribution, R-0152 on private key protection and R-0158 on key lending); and the Author's Address, the Full Copyright Statement and the Acknowledgement. Within extracted passages, a bracket or quotation mark that opens in one entry's sentence and closes in another's, or encloses an aside, is left out of both: the [ before R-0123 and the ]. after R-0125, the brackets around R-0127 and R-0131, the opening quotation mark of item 56 before R-0129 and its closing quotation mark after the ]. that ends R-0130, and the [ and ]. around R-0130. Three sentences are split so that each part is separately testable: the CRL requirement of Validity and CRLs into R-0025, R-0026 and R-0027 (the comma after the CRL and the and before the dates belong to no part); the field-count sentence of Implementation of Certificates into R-0038 and R-0039; and the last sentence of item 7.2 into R-0063 and R-0064. In the last two the connecting and, with its comma where it has one, belongs to neither part. Nine entries keep two or three sentences together because they make one point and no sentence is separately testable: R-0019, R-0069, R-0072, R-0073, R-0116, R-0119, R-0123, R-0147 and R-0152. R-0118 is not among them: its Heck! is an interjection run into the sentence it opens, which continues in lower case. No entry is kind inferred."
