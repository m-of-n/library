    testable_reason: 'testable as expressibility only; R-0141 and R-0143 add its light-bureaucracy and administrator-change conditions.'
    status: active
  - id: "rfc-2692#R-0137"
    object: 'use: service authentication'
    field: 'authentication of services'
    verb: none
    actor: 'certificate format (design must serve this use)'
    locator: "§List of Certificate Uses, item 62"
    text: 'Service authentication'
    kind: stated
    testable: partial
    testable_reason: 'testable as expressibility only; the source names the use and nothing of its content.'
    status: active
  - id: "rfc-2692#R-0138"
    object: 'trust model'
    field: 'a web of trust, since people want to choose whom they trust'
    verb: none
    actor: 'protocol designer; verifier'
    locator: "§List of Certificate Uses, Other requirements, item 1"
    text: 'Trust model must be a web (people want to choose whom they trust).'
    kind: stated
    testable: partial
    testable_reason: 'checkable as the absence of any mandated root and the ability of any key to certify any other; "a web" is not further defined.'
    status: active
  - id: "rfc-2692#R-0139"
    object: 'trust roots'
    field: 'each person chooses whom to trust and which roots to rely on, possibly with varying reliabilities'
    verb: none
    actor: 'verifier'
    locator: "§List of Certificate Uses, Other requirements, item 1"
    text: 'People must be able to choose whom they trust or consider reliable roots (maybe with varying reliabilities).'
    kind: stated
    testable: partial
    testable_reason: 'that a verifier configures its own roots is testable; graded reliabilities are only "maybe" and have no defined form.'
    status: active
  - id: "rfc-2692#R-0140"
    object: 'high-assurance keys'
    field: 'some applications (notary services) need highly trusted keys; generation cost does not matter there'
    verb: none
    actor: 'keyholder (key generation); application'
    locator: "§List of Certificate Uses, Other requirements, item 2"
    text: 'Some applications (e.g., notary services) require highly trusted keys; generation complexity is not an issue here.'
    kind: stated
    testable: no
    testable_reason: '"highly trusted" is not defined and is a property of how a key was generated and is kept, which no certificate shows.'
    status: active
  - id: "rfc-2692#R-0141"
    object: 'low-bureaucracy applications'
    field: 'some applications (host authentication) need extremely light or no bureaucracy'
    verb: none
    actor: 'protocol designer; issuer'
    locator: "§List of Certificate Uses, Other requirements, item 3"
    text: 'Some applications (e.g., host authentication) require extremely light (or no) bureaucracy.'
    kind: stated
    testable: partial
    testable_reason: 'checkable as the absence of any mandatory registration or third-party step in issuing a certificate; "bureaucracy" is not otherwise measurable.'
    status: active
  - id: "rfc-2692#R-0142"
    object: 'low-bureaucracy applications'
    field: 'even contacting a central administrator may be a problem'
    verb: none
    actor: 'protocol designer; issuer'
    locator: "§List of Certificate Uses, Other requirements, item 3"
    text: 'Even communication with the central administrator may be a problem.'
    kind: stated
    testable: partial
    testable_reason: 'testable as the property that certificates can be issued and verified with no contact with a central party; stated as a possible problem, not a rule.'
    status: active
  - id: "rfc-2692#R-0143"
    object: 'certification right'
    field: 'withdrawal of a departing key generator''s right to certify'
    verb: none
    actor: 'issuer; verifier'
    locator: "§List of Certificate Uses, Other requirements, item 4"
    text: 'Especially in lower-end applications (e.g. host authentication) the people generating the keys (e.g., administrators) will change, and you will no longer want them to be able to certify.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0144"
    object: 'certification right'
    field: 'keys certified by a departing administrator usually stay valid when that administrator''s right ends'
    verb: none
    actor: 'verifier; certificate format'
    locator: "§List of Certificate Uses, Other requirements, item 4"
    text: 'On the other hand, you will usually also not want all keys they have generated to expire.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0145"
    object: 'certification right expiration'
    field: 'possibly a certificate that expires a certification right, implemented with notary services'
    verb: none
    actor: 'protocol designer; notary service'
    locator: "§List of Certificate Uses, Other requirements, item 4"
    text: 'This may imply a "certification right expiration" certificate requirement, probably to be implemented together with notary services.'
    kind: stated
    testable: partial
    testable_reason: 'tentative ("may imply", "probably"); if adopted it is testable as R-0143 and R-0144 together, the notary showing that a certificate was made before the right expired.'
    status: active
  - id: "rfc-2692#R-0146"
    object: 'key caching'
    field: 'keys cached locally to avoid delays fetching frequently used keys'
    verb: none
    actor: 'verifier; implementation'
    locator: "§List of Certificate Uses, Other requirements, item 5"
    text: 'Keys will need to be cached locally to avoid long delays fetching frequently used keys.'
    kind: stated
    testable: partial
    testable_reason: 'caching is observable; no delay bound is given, and R-0150 notes it interacts with revocation.'
    status: active
  - id: "rfc-2692#R-0147"
    object: 'key infrastructure load'
    field: 'expected use nearly as often as the name server; caching and performance requirements similar'
    verb: none
    actor: 'protocol designer; implementation'
    locator: "§List of Certificate Uses, Other requirements, item 5"
    text: 'The key infrastructure may in future get used almost as often as the name server.  The caching and performance requirements are similar.'
    kind: stated
    testable: no
    testable_reason: 'a forecast and an analogy to name service; no figure is given.'
    status: active
  - id: "rfc-2692#R-0148"
    object: 'revocation distribution'
    field: 'reliable distribution of key revocations and other certificates, including the end of a right to make new certificates'
    verb: none
    actor: 'protocol designer; issuer'
    locator: "§List of Certificate Uses, Other requirements, item 6"
    text: 'Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates).'
    kind: stated
    testable: partial
    testable_reason: '"reliable" is not defined; the measurable form is the propagation bound of R-0149, itself only a possible goal.'
    status: active
  - id: "rfc-2692#R-0149"
    object: 'revocation distribution'
    field: 'possible propagation goal, such as spread everywhere within 24 hours'
    verb: none
    actor: 'protocol designer; distribution service'
    locator: "§List of Certificate Uses, Other requirements, item 6"
    text: 'May involve goals like "will have spread everywhere in 24 hours" or something like that.'
    kind: stated
    testable: partial
    testable_reason: 'a time bound is testable once one is chosen; the source gives 24 hours only as an example of the kind of goal.'
    status: active
  - id: "rfc-2692#R-0150"
    object: 'revocation distribution'
    field: 'interaction with caching'
    verb: none
    actor: 'protocol designer; verifier'
    locator: "§List of Certificate Uses, Other requirements, item 6"
    text: 'This interacts with caching.'
    kind: stated
    testable: partial
    testable_reason: 'an observation that a cached key (R-0146) may outlive its revocation; testable once the cache lifetime and the propagation bound are fixed, which the source leaves open (compare the instrument lifetimes of R-0031).'
    status: active
  - id: "rfc-2692#R-0151"
    object: 'open questions'
    field: 'scope: the open questions are not answered by certificate definition or issuing alone'
    verb: none
    actor: 'protocol designer (scope)'
    locator: "§Open Questions"
    text: 'These do not have answers provided by certificate definition or issuing alone.'
    kind: stated
    testable: no
    testable_reason: 'a scope statement; it says what a certificate specification will not settle, and there is nothing in a certificate to test.'
    status: active
  - id: "rfc-2692#R-0152"
    object: 'private key protection'
    field: 'scope: repudiation of a signature made with a stolen key is a matter of key protection, which no certificate format, content or issuing machinery can ensure or prove'
    verb: none
    actor: 'keyholder; protocol designer (scope)'
    locator: "§Open Questions, question 1"
    text: 'This is an issue of (non-)repudiation and therefore a matter of private key protection.  Although this is of interest to the user of certificates, certificate format, contents or issuing machinery can not ensure the protection of a user''s private key or prove whether or not a private key has been stolen or misused.'
    kind: stated
    testable: no
    testable_reason: 'a statement of what certificates cannot do; theft or misuse of a private key is not observable from certificates, which is the point.'
    status: active
  - id: "rfc-2692#R-0153"
    object: 'title records'
    field: 'scope: certificates can carry information tamper-proof, but a title and lien database is not part of certificate structure'
    verb: none
    actor: 'protocol designer (scope)'
    locator: "§Open Questions, question 2"
    text: 'Certificates might be employed to carry information in a tamper-proof way, but building the database necessary to record all house titles and all liens is a project not related to certificate structure.'
    kind: stated
    testable: partial
    testable_reason: 'tamper evidence of a signed record is testable; the rest is a scope exclusion with nothing to test.'
    status: active
  - id: "rfc-2692#R-0154"
    object: 'negative facts'
    field: 'the absence of an attribute is determinable only if all records are digitised and all parties have inescapable IDs'
    verb: none
    actor: 'issuer (of negative-fact attributes)'
    locator: "§Open Questions, question 3"
    text: 'The absence of attributes can be determined only if all relevant records are digitized and all parties have inescapable IDs.'
    kind: stated
    testable: no
    testable_reason: 'a precondition on the world outside the certificate system; no certificate can show it holds.'
    status: active
  - id: "rfc-2692#R-0155"
    object: 'positive attribute of a negative fact'
    field: 'a certificate can carry a negative fact stated positively, e.g. "not already married"'
    verb: none
    actor: 'certificate format; issuer'
    locator: "§Open Questions, question 3"
    text: 'A certificate can communicate the ''positive'' attribute "not already married" or "not registered as a voter in any other district".'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-2692#R-0156"
    object: 'positive attribute of a negative fact'
    field: 'trust assumption: some organisation can determine the fact for the keyholder'
    verb: none
    actor: 'issuer (determining organisation); verifier (trust in it)'
    locator: "§Open Questions, question 3"
    text: 'That assumes that some organization is capable of determining that fact for a given keyholder.'
    kind: stated
    testable: no
    testable_reason: 'the issuer''s capability is a trust assumption the verifier makes; a certificate records the assertion, not the capability.'
    status: active
  - id: "rfc-2692#R-0157"
    object: 'positive attribute of a negative fact'
    field: 'scope: the method of determining the negative fact is not part of the certificate definition'
    verb: none
    actor: 'protocol designer (scope)'
    locator: "§Open Questions, question 3"
    text: 'The method of determining such a negative fact is not part of the certificate definition.'
    kind: stated
    testable: partial
    testable_reason: 'checkable only as an absence: the certificate definition carries no field or procedure for how the issuer established the fact.'
    status: active
  - id: "rfc-2692#R-0158"
    object: 'key lending'
    field: 'security limitation: nothing prevents the holder of a valuable authorization from lending the private key; a potential flaw in any authorization system'
    verb: none
    actor: 'keyholder; protocol designer'
    locator: "§Open Questions, question 4"
    text: 'This is a potential flaw in any system providing authorization and an interesting topic for study.'
    kind: stated
    testable: no
    testable_reason: 'lending a private key is indistinguishable, to any verifier, from the keyholder using it; the source leaves the flaw open, as R-0125 does for delegation.'
    status: active
