    source_lines: '185-190'
    kind: 'crl-counter-example'
    notation: 'prose'
    fidelity: 'split'
    input: 'A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.  Its method of transmission is not specified.  If it encounters some certificate that it lists, then it annihilates that certificate.  If it encounters a previous CRL, as indicated by sequence number, then it annihilates that previous CRL.'
    expected: 'Such a CRL leads to non-deterministic program behavior.'
    expected_basis: 'stated'
    exercises:
      - 'VAL-2b'
      - 'VAL-2c'
      - 'VAL-2d'
    constrained_by: []
    related:
      - 'SR-VAL-C01'
      - 'SR-VAL-C06'
    notes: 'The source''s own negative example. The three conditions that follow it (CRL location in the certificate, explicit CRL validity dates, no overlap in a CRL sequence) are what make validation deterministic "(aside from the question of clock skew)". The pronoun "it" in "If it encounters some certificate that it lists" refers to the CRL as processed by a verifier; the source does not say who encounters.'

