  - key: 'GEN-9a'
    body: true
    locator: 'RFC 2692 §General Requirements ¶9, p. 3'
    source_lines: '161-164'
    text: 'There are names the keyholder prefers to be called and there are names by which the keyholder is known to various other keyholders.  An SPKI certificate must be able to bind a key to such names.'
