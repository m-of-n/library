  - key: 'VAL-5b'
    body: true
    locator: 'RFC 2692 §Validity and CRLs ¶5, p. 4'
    source_lines: '206-210'
    text: 'A lifetime of 0 is not possible because of communication delays and clock skews, although one can consider an instrument whose lifetime is "one use" and which is delivered only as part of a challenge/response protocol.'
