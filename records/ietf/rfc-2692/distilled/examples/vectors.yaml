  - key: 'IMP-1a'
    body: true
    locator: 'RFC 2692 §Implementation of Certificates ¶1, p. 4'
    source_lines: '214-217'
    text: 'The authorization certificates that are envisioned for SPKI (and needed to meet the demands of the list given at the end of this document) should be generated by any keyholder empowered to grant or delegate the authorization in question.'
