  - key: 'BG-2a'
    body: true
    locator: 'RFC 2692 §Background ¶2, p. 2'
    source_lines: '103-105'
    text: 'The SPKI team directly addressed the issue of <name,key> bindings and realized that such certificates are of extremely limited use for trust management.'
    crosses_page_break: false
  - key: 'BG-2b'
    body: true
    locator: 'RFC 2692 §Background ¶2, p. 2'
    source_lines: '105-107'
    text: 'A keyholder''s name is one attribute of the keyholder, but as can be seen in the list of needs in this document, a person''s name is rarely of security interest.'
    crosses_page_break: false
  - key: 'BG-2c'
    body: true
    locator: 'RFC 2692 §Background ¶2, p. 2'
    source_lines: '107-109'
    text: 'A user of a certificate needs to know whether a given keyholder has been granted some specific authorization.'
