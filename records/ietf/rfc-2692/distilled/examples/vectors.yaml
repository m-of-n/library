  - key: 'CH-3a'
    body: true
    locator: 'RFC 2692 §Charter of the SPKI working group ¶3, p. 2'
    source_lines: '77-81'
    text: 'The SPKI is intended to provide mechanisms to support security in a wide range of Internet applications, including IPSEC protocols, encrypted electronic mail and WWW documents, payment protocols, and any other application which will require the use of public key certificates and the ability to access them.'
