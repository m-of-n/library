count_reconciliation: "140 = 95 source examples + 45 constructed vectors. The 95 source examples by section: Charter 1, Background 1, General Requirements 4, Validity and CRLs 4, Implementation of Certificates 4 (14 body illustrations); List of Certificate Uses 75; Open Questions 6. The 75 List vectors are: 62 top-level items (every line in lines 262-587 that begins with six spaces and a hyphen: 14 items from 'I need a certificate to give me permission' to '..a digital Voter Registration Card?', the wallet-card item, the 33-item run after it from 'health insurance card' to 'permission to issue nuclear launch codes', 8 items from 'I'm a sysadmin' to the rfc822 template, and 6 items from 'Encryption keys' to 'Service authentication'); 3 sub-items of 'I need certificates to bind names to public keys' ([traditional certificate], [direct certificate], [personal binding]); 6 sub-items of 'Other requirements'; 1 indented paragraph that prints its own example certificate (the audit-identity paragraph under the ephemeral-root item); and 3 vectors split from bracketed commentary (the smart-card login case and the 'delegation-allowed' bit from the delegation template's commentary, and the 'I own this address' certificate from the address-space template's commentary). The 6 Open Questions vectors are the 4 questions, each with its answer, and the 2 quoted attributes printed in the answer to question 3 ('not already married', 'not registered as a voter in any other district'). The 45 constructed vectors by the section of the rule they rest on: Validity and CRLs 17, General Requirements 11, Implementation of Certificates 10, List of Certificate Uses 7. Sections with no vector of either kind are listed, with reasons, in README.md."

# ====================================================================
# What this file is
# ====================================================================
#
# RFC 2692 prints NO test vector: no byte string, no hex, no S-expression,
# no encoded certificate, and it specifies no encoding. Its examples are in
# prose: a brainstorming List of Certificate Uses, four Open Questions with
# answers, and illustrative cases in the body. PART 1 carries every one of
# them. PART 2 is constructed: deterministic tests a harness can run against
# a design claiming to meet RFC 2692, built only from rules the source states.
#
# ====================================================================
# Conventions
# ====================================================================
#
# IDS. SR-<section>-NN for source examples, SR-<section>-CNN for
# constructed vectors, never reused. Sections: CH Charter, BG Background,
# GEN General Requirements, VAL Validity and CRLs, IMP Implementation of
# Certificates, USE List of Certificate Uses, OQ Open Questions.
#
# LOCATORS. RFC 2692 has unnumbered sections. A locator names the section
# title, then a paragraph (counted from 1 within the section), item or
# question, then the printed page. Items are named by their first six words,
# a verbatim prefix. source_lines gives the line span in .cache/rfc-2692.txt.
#
# body_rules. The requirement sentences of the body that vectors cite, each
# quoted verbatim once, plus three that no vector can test (CH-2, IMP-2b,
# IMP-2c: no criterion or threshold), kept so the gap is visible. Key: <section>-<paragraph>[letter]. LIST-* entries
# are statements from the List of Certificate Uses (body: false) that
# constructed vectors rest on; the List is "a brainstorming list" and is not
# a body requirement.
#
# Every vector carries:
#   id, locator, source_lines (source examples only), kind
#   group           list sub-structure, where there is one: name-binding,
#                   wallet-card-run, other-requirements
#   notation        prose          -- the example is running prose
#                   quoted-text    -- the example is a sentence or phrase
#                                     the source prints in quotation marks;
#                                     the marks are part of the input
#                   abstract-model -- constructed input: a YAML mapping in
#                                     the notation below
#   fidelity        verbatim    -- the whole item, sub-item or paragraph,
#                                  bullet marker and margin removed. Where an
#                                  item ends in bracketed commentary, the
#                                  input is the item before the commentary
#                                  and the commentary is carried verbatim
#                                  in source_annotation_lines
#                   split       -- a contiguous run taken out of a larger
#                                  item or paragraph; every character is the
#                                  source's
#                   constructed -- built for this file
#   input           the example
#   crosses_page_break  true when the input runs across a page break
#   expected / expected_paragraphs
#                   SOURCE EXAMPLES: what a conforming SPKI certificate design
#                   must be able to express for the example. For an Open
#                   Question, the source's own answer. expected_paragraphs
#                   replaces expected when the answer is more than one
#                   paragraph (one string per paragraph, source order).
#                   CONSTRUCTED: the result, in words.
#   expected_basis  (source examples)
#                   stated      -- the source states the outcome for this
#                                  example; expected is a verbatim quote
#                   rule-quoted -- expected is this extraction's statement;
#                                  the body rules it rests on are listed in
#                                  `exercises` and quoted in body_rules
#                   uncovered   -- no body requirement covers the example;
#                                  expected says so, and why, and no rule is
#                                  invented for it
#   exercises       body_rules keys the example exercises (source examples)
#   rests_on        (constructed) the rules the vector rests on, each with
#                   key, locator and a verbatim quote, which may be a
#                   narrower run of the body_rules entry
#   outcome         (constructed) accept | reject | conforms | violation |
#                   permitted | expressible | undetermined
#                     accept/reject  -- a verifier's decision on the input
#                     conforms/violation -- the input (a design, a CRL
#                                        sequence, a certificate) meets or
#                                        breaks the rule
#                     permitted      -- the source allows it; a conforming
#                                        implementation may do it
#                     expressible    -- a conforming design must be able to
#                                        express the input
#                     undetermined   -- the source does not decide the case
#   modal           (constructed) the source's own modal wording for the rule
#                   ("must", "should", "if possible, ... should", ...; "..."
#                   marks omitted words). RFC 2692 has no BCP 14 keywords;
#                   all are lower case and carry their ordinary meaning.
#   soft            (constructed) true when the source qualifies the rule
#                   ("if possible", "may imply", "usually", "we assume"): a
#                   violation is a finding, not a hard failure
#   inferred        (constructed) true when the outcome is not literally
#                   stated by the source; `inference` says what was read in
#   outcome_quote   (Open Questions) the decisive clause of the answer, split
#                   verbatim from it
#   source_text     further verbatim quotes that ground the vector
#   source_annotation_lines  bracketed commentary printed with an item, one
#                   contiguous run per entry, with its own line span
#   source_issue    a defect or ambiguity in the SOURCE, recorded and not
#                   repaired
#   related, notes  cross-links and commentary; never consumed as values
#   constrained_by  requirement ids (rfc-2692#R-NNNN). EMPTY IN THIS PASS:
#                   requirement ids are wired by pass 3 (cross-check).
#
# QUOTING. Every verbatim string is one contiguous run of source characters
# with RFC line wrapping undone: a line break and the next line's margin read
# as one space, page header and footer lines are not text, and a line-final
# hyphen in a hyphenated compound joins with no space ("collision-" +
# "free" reads collision-free, the only such case quoted). In-line spacing is
# kept, including two spaces after a full stop. Nothing is spliced or
# paraphrased. Every string in this file is a YAML single-quoted scalar (an
# apostrophe is written twice); the source contains no backslash.
#
# ABSTRACT-MODEL NOTATION (constructed inputs). Synthetic, obviously not real
# values; never bytes or S-expression syntax, since RFC 2692 defines no
# encoding:
#   key-A, key-B, ...       public keys (key-blinded-1: a blinded signature
#                           key); hash(key-B) is a hash of key-B
#   cert-1, crl-1, reval-1  certificate, CRL, revalidation instrument ids
#   auth-X, purpose-1, attr-*  opaque authorization, purpose, attribute labels
#   name-1, crl-loc-1       opaque names and CRL locations
#   form-T(...), form-S(...), text-T(...)  two different byte layouts of the
#                           same certificate, and a text-format layout
#   times                   ISO 8601 UTC timestamps; validity periods are
#                           not_before / not_after pairs. RFC 2692 does not
#                           say whether an end date is inclusive; vectors
#                           avoid shared endpoints except SR-VAL-C03, which
#                           tests exactly that ambiguity
#   certificate fields      id, issuer, subject, grants, validity, uses_crl,
#                           crl_location (null = absent); optional attributes,
#                           names, subject_form, resolves_to, issued
#   crl fields              id, signer, location, sequence, validity (null =
#                           absent), lists (certificate ids)
#   design                  properties of a certificate design under test

body_rules:
  - key: 'CH-2'
    body: true
    locator: 'RFC 2692 §Charter of the SPKI working group ¶2, p. 2'
    source_lines: '71-73'
    text: 'The key certificate format and associated protocols are to be simple to understand, implement, and use.'
