  - key: 'GEN-1'
    body: true
    locator: 'RFC 2692 §General Requirements ¶1, p. 3'
    source_lines: '121-122'
    text: 'We define the term KEYHOLDER of a public key to refer to the person or other entity that controls the corresponding private key.'
    crosses_page_break: false
  - key: 'GEN-2'
    body: true
    locator: 'RFC 2692 §General Requirements ¶2, p. 3'
    source_lines: '124-125'
    text: 'The main purpose of an SPKI certificate is to authorize some action, give permission, grant a capability, etc. to or for a keyholder.'
    crosses_page_break: false
  - key: 'GEN-3'
    body: true
    locator: 'RFC 2692 §General Requirements ¶3, p. 3'
    source_lines: '127-131'
    text: 'The keyholder is most directly identified by the public key itself, although for convenience or other purposes some indirection (delayed binding) may be employed.  That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key.'
    crosses_page_break: false
  - key: 'GEN-4a'
    body: true
    locator: 'RFC 2692 §General Requirements ¶4, p. 3'
    source_lines: '133-134'
    text: 'The definition of attributes or authorizations in a certificate is up to the author of code which uses the certificate.'
    crosses_page_break: false
  - key: 'GEN-4b'
    body: true
    locator: 'RFC 2692 §General Requirements ¶4, p. 3'
    source_lines: '134-137'
    text: 'The creation of new authorizations should not require interaction with any other person or organization but rather be under the total control of the author of the code using the certificate.'
    crosses_page_break: false
  - key: 'GEN-5a'
    body: true
    locator: 'RFC 2692 §General Requirements ¶5, p. 3'
    source_lines: '139-141'
    text: 'Because SPKI certificates might carry information that the keyholder might not want to publish, we assume that certificates will be distributed directly by the keyholder to the verifier.'
    crosses_page_break: false
  - key: 'GEN-5b'
    body: true
    locator: 'RFC 2692 §General Requirements ¶5, p. 3'
    source_lines: '141-144'
    text: 'If the keyholder wishes to use a global repository, such as LDAP, the global PGP key server or the DNS database, that is up to the keyholder and not for the SPKI WG to specify.'
    crosses_page_break: false
  - key: 'GEN-6a'
    body: true
    locator: 'RFC 2692 §General Requirements ¶6, p. 3'
    source_lines: '146-149'
    text: 'Because SPKI certificates will carry information that, taken together over all certificates, might constitute a dossier and therefore a privacy violation, each SPKI certificate should carry the minimum information necessary to get a job done.'
    crosses_page_break: false
  - key: 'GEN-6b'
    body: true
    locator: 'RFC 2692 §General Requirements ¶6, p. 3'
    source_lines: '151-153'
    text: 'The keyholder should be able to release a minimum of information in order to prove his or her permission to act.'
    crosses_page_break: false
