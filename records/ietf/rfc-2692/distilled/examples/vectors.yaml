vectors:

  # ====================================================================
  # PART 1 -- SOURCE EXAMPLES
  # Charter of the SPKI working group (p. 2)
  # ====================================================================

  - id: 'SR-CH-01'
    locator: 'RFC 2692 §Charter of the SPKI working group ¶3, p. 2'
    source_lines: '77-81'
    kind: 'application-scope'
    notation: 'prose'
    fidelity: 'split'
    input: 'The SPKI is intended to provide mechanisms to support security in a wide range of Internet applications, including IPSEC protocols, encrypted electronic mail and WWW documents, payment protocols, and any other application which will require the use of public key certificates and the ability to access them.'
    expected: 'The certificate design must be usable by each application the sentence names: IPSEC protocols, encrypted electronic mail and WWW documents, and payment protocols. The source states no application-specific requirement, so the list scopes the design and is not itself a test.'
    expected_basis: 'rule-quoted'
    exercises:
      - 'CH-3a'
    constrained_by: []
    related:
      - 'SR-USE-60'
      - 'SR-USE-64'
    notes: 'Split: the paragraph''s other two sentences are the opening clause of the charter paragraph''s argument and CH-3b (trust models).'

  # ====================================================================
  # Background (p. 2)
  # ====================================================================

  - id: 'SR-BG-01'
    locator: 'RFC 2692 §Background ¶1, p. 2'
    source_lines: '92-99'
    kind: 'historical-example'
    notation: 'prose'
    fidelity: 'split'
    input: 'Instead, they suggested, one can publish a modified telephone book -- one with public keys in place of telephone numbers. One could then look up his or her desired communication partner in the directory, find that person''s public key and open a secure channel to that person.  Kohnfelder took that suggestion and noted that an on-line service has the disadvantage of being a performance bottleneck.  To replace it, he proposed creation of digitally signed directory entries which he called certificates.'
    expected: 'A design can express a binding between a name and a key (GEN-9a), but the paragraph that follows judges such <name,key> certificates of extremely limited use for trust management (BG-2a): what a verifier needs is whether a keyholder has been granted a specific authorization (BG-2c).'
    expected_basis: 'rule-quoted'
    exercises:
      - 'BG-2a'
      - 'BG-2c'
      - 'GEN-9a'
    constrained_by: []
    related:
      - 'SR-USE-08'
    notes: 'The telephone book with public keys in place of numbers (Diffie and Hellman) and the digitally signed directory entry (Kohnfelder) are the origin of the <name,key> certificate the document argues against.'

  # ====================================================================
  # General Requirements (p. 3)
  # ====================================================================

  - id: 'SR-GEN-01'
    locator: 'RFC 2692 §General Requirements ¶3, p. 3'
    source_lines: '129-131'
    kind: 'subject-identification'
    notation: 'prose'
    fidelity: 'split'
