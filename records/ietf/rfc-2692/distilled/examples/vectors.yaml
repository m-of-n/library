        crosses_page_break: false
      - text: 'I''ll note here that this flies in the face of attempts to prevent delegation of certain rights.  Maybe we need a "delegation-allowed" bit -- but there''s nothing to stop someone who wishes to delegate against the rules from also loaning out their private key.].'
        source_lines: '511-515'
        page: 'p. 10'
        crosses_page_break: false
    expected: 'A delegation certificate: the certifying key makes the signed key equivalent to itself, for listed purposes, until the certificate expires. It needs a delegating issuer (IMP-1a, "empowered to grant or delegate"), a purpose list (GEN-2) and a validity period (VAL-1a).'
    expected_basis: 'rule-quoted'
    exercises:
