  - id: 'SR-USE-54'
    locator: 'RFC 2692 §List of Certificate Uses, paragraph following item "I''m that same sysadmin", p. 9'
    source_lines: '466-471'
    kind: 'certificate-use-commentary'
    notation: 'prose'
    fidelity: 'verbatim'
    input: 'Certain applications *will* want some form of auditing, but the audit identity should be in the domain of the particular application...  For instance an "is a system administrator of this host" certificate would probably want to include an audit identity, so you can figure out which of your multiple admins screwed something up.'
    expected: 'An application-defined audit identity carried in an authorization certificate (here the "is a system administrator of this host" certificate). That the audit identity belongs to the application''s domain matches GEN-4a: what a certificate carries is defined by the code that uses it.'
    expected_basis: 'rule-quoted'
    exercises:
      - 'GEN-4a'
    constrained_by: []
    related:
      - 'SR-USE-53'
    notes: 'Not a bullet: an indented paragraph under the ephemeral-root item, carried as its own vector because it prints its own example certificate. The source does not reconcile an audit identity with GEN-7 (some certificates anonymous); there is no conflict as written, since GEN-7 says only "at least some". The "..." after "application" is printed.'

