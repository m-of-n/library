  # ====================================================================
  # PART 2 -- CONSTRUCTED VECTORS
  # Validity and CRLs
  # ====================================================================

  - id: 'SR-VAL-C01'
    locator: 'RFC 2692 §Validity and CRLs ¶2, p. 4'
    kind: 'crl-sequence-overlap'
    notation: 'abstract-model'
    fidelity: 'constructed'
    input:
      certificate:
        id: 'cert-1'
        issuer: 'key-A'
        subject: 'key-B'
        grants: 'auth-X'
        validity:
          not_before: '2026-01-01T00:00:00Z'
          not_after: '2026-12-31T23:59:59Z'
        uses_crl: true
        crl_location: 'crl-loc-1'
      crl_sequence:
        - id: 'crl-1'
          signer: 'key-R'
          location: 'crl-loc-1'
          sequence: 1
          validity:
            not_before: '2026-03-01T00:00:00Z'
            not_after: '2026-03-08T00:00:00Z'
          lists: []
        - id: 'crl-2'
          signer: 'key-R'
          location: 'crl-loc-1'
          sequence: 2
          validity:
            not_before: '2026-03-05T00:00:00Z'
            not_after: '2026-03-12T00:00:00Z'
          lists:
            - 'cert-1'
      check_time: '2026-03-06T12:00:00Z'
    outcome: 'violation'
    expected: 'The CRL sequence violates the requirement: crl-1 and crl-2 are both within their dates from 2026-03-05T00:00:00Z to 2026-03-08T00:00:00Z. At the check time one lists cert-1 and the other does not, so the result would depend on which CRL the verifier holds: the non-determinism the requirement exists to remove.'
    rests_on:
      - rule: 'VAL-2c'
        locator: 'RFC 2692 §Validity and CRLs ¶2, p. 4'
        text: 'the dates of a sequence of CRLs must not overlap.'
      - rule: 'VAL-2d'
        locator: 'RFC 2692 §Validity and CRLs ¶2, p. 4'
        text: 'Under this set of requirements, behavior of certificate validation is deterministic (aside from the question of clock skew).'
    modal: 'must not'
    soft: false
    inferred: false
    constrained_by: []
    related:
      - 'SR-VAL-01'
      - 'SR-VAL-C02'
      - 'SR-VAL-C03'

  - id: 'SR-VAL-C02'
    locator: 'RFC 2692 §Validity and CRLs ¶2, p. 4'
    kind: 'crl-sequence-adjacent'
    notation: 'abstract-model'
    fidelity: 'constructed'
    input:
