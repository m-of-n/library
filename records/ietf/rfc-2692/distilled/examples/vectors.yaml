    body: true
    locator: 'RFC 2692 §General Requirements ¶9, pp. 3-4'
    source_lines: '164-175'
    text: 'The SDSI work of Rivest and Lampson has done an especially good job of defining and using local name spaces, therefore if possible SPKI should support the SDSI name construct.'
    crosses_page_break: true
  - key: 'VAL-1a'
    body: true
    locator: 'RFC 2692 §Validity and CRLs ¶1, p. 4'
    source_lines: '179-180'
    text: 'An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid.'
    crosses_page_break: false
  - key: 'VAL-1b'
    body: true
    locator: 'RFC 2692 §Validity and CRLs ¶1, p. 4'
    source_lines: '180-181'
    text: 'It may also be necessary to have on-line refinement of validity.'
    crosses_page_break: false
  - key: 'VAL-2a'
    body: true
    locator: 'RFC 2692 §Validity and CRLs ¶2, p. 4'
    source_lines: '185-190'
    text: 'A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature.  Its method of transmission is not specified.  If it encounters some certificate that it lists, then it annihilates that certificate.  If it encounters a previous CRL, as indicated by sequence number, then it annihilates that previous CRL.'
    crosses_page_break: false
  - key: 'VAL-2b'
    body: true
    locator: 'RFC 2692 §Validity and CRLs ¶2, p. 4'
    source_lines: '190-191'
    text: 'Such a CRL leads to non-deterministic program behavior.'
    crosses_page_break: false
  - key: 'VAL-2c'
    body: true
    locator: 'RFC 2692 §Validity and CRLs ¶2, p. 4'
    source_lines: '191-194'
