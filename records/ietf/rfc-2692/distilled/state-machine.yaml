record: rfc-2692
reviewed_by: ""
kind: state-machine
source: "RFC 2692, SPKI Requirements, C. Ellison, Experimental, September 1999"
source_digest: "6a88c1563590e8094bb37cda5c5d29ef70f8384e5a3a0528bce29c501826976d"
extracted: "2026-10-18"
extracted_by: "claude, FX-1 pass 1 (extract), state-machine agent, effort high, from the source text only"
note: >-
  Every lifecycle RFC 2692 describes or requires, as machines an
  implementation or a test harness can drive, and nothing the source does not
  give. RFC 2692 is a requirements document: it states what an SPKI design
  must achieve, not a protocol, so most machines below model the behaviour a
  requirement constrains, and many states and transitions are inferred. Each
  is flagged. The source has no BCP 14 keywords; a lowercase "must",
  "should" or "may" inside a quote below is not one. Requirement ids are
  wired in pass 3 (cross-check) by a different agent, so every
  constrained_by list is empty here.

  Status of each machine. required: the source states it as a requirement
  (§Validity and CRLs, §Implementation of Certificates, §General
  Requirements). permitted: the source allows it ("may be employed", M10).
  rejected: a design the source describes and turns down,
  modelled so that a harness can show an implementation is not it (M06,
  M07). considered: the source says "one can consider" (M09). brainstorm:
  taken from §List of Certificate Uses, which the source itself calls "a
  brainstorming list" (p.5); these record a desired use, not a requirement
  (M11 to M16).

  Locators. The sections of RFC 2692 are unnumbered, so a locator is the
  section title, then a paragraph number (¶n, counted from the first
  paragraph under the title) or a list item named by its opening words, then
  the page (p.n) from the RFC page footers.

  Quotes. Every quote is one contiguous run of source characters with the RFC
  line wrapping undone: a line break and the indent that follows become one
  space, and a line-final hyphen inside a hyphenated compound joins the next
  line with no space (so "collision-" then "free" reads "collision-free").
  Spacing within a line, including the two spaces the RFC puts after a full
  stop, is kept. No quote crosses a page break and no two passages are
  spliced; where a transition rests on two passages they are two quotes. A
  quote is reused where one sentence supports several transitions.

  Flags and fields. inferred: true marks a state or transition the source
  does not literally state; on a transition, inferred_reason says what was
  supplied and the quote is the text it rests on, and a state's meaning
  carries its own justification. Machine, state and event names are ours,
  taken where possible from the source's own nouns. A trigger is a message
  (a structure the source names, transmitted or held) or a named event; all
  are listed under triggers so pass 3 can reconcile them with messages.yaml.
  completion is the UML completion event: the activity of the source state
  has finished and the guards pick the branch. error_states are states in
  which the object yields no usable result or a stated requirement has been
  violated; an empty list means the machine has none. terminal_states is
  omitted for a machine that cycles. unspecified entries record situations
  the source leaves open; each points into open_questions and is not a
  transition. prohibited entries record behaviour the source rules out, for
  negative tests. invokes and hands_off name the other machines a machine
  starts or continues into. status_quote and status_locator give the text a
  machine's status rests on. determinism and nondeterminism record what the
  source says about the predictability of a machine's outcome;
  harness_contrast lists tests that tell a conforming implementation from a
  rejected design; specializes names the machine one is an instance of.

  Notation. t is the instant at which the verifier evaluates, by its own
  clock. A validity period is written [not-before, not-after]; whether its
  ends are inside the period is not stated (OQ-01), and every guard below
  that compares t with a date inherits that question.

triggers:
  # ---- messages: structures the source names ----
  - name: spki-certificate
    kind: message
    transmitted: true
    locator: "§General Requirements ¶2, p.3"
    quote: "The main purpose of an SPKI certificate is to authorize some action, give permission, grant a capability, etc. to or for a keyholder."
    note: "Distributed by the keyholder to the verifier (§General Requirements ¶5). Specialised by delegation-certificate, root-access-certificate and certification-right-expiration-certificate."
  - name: crl
    kind: message
    transmitted: true
    aliases:
      - deterministic-crl
    locator: "§Validity and CRLs ¶2, p.4"
    quote: "the CRL must carry explicit validity dates"
    note: "The CRL the source requires: found where the certificate says, carrying explicit validity dates, one of a sequence whose dates do not overlap. The source does not restate its other contents; that it still lists revoked certificates and is signed is carried over from the minimal CRL of the same paragraph (inferred)."
  - name: minimal-crl
    kind: message
    transmitted: true
    locator: "§Validity and CRLs ¶2, p.4"
    quote: "A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature."
    note: "The rejected form. Used only by M06 and M07, the negative models."
  - name: revalidation-instrument
    kind: message
    transmitted: true
    locator: "§Validity and CRLs ¶5, p.4"
    quote: "Any CRL or revalidation instrument must have its own lifetime."
    note: "Not defined further. Read as the instrument a positive on-line validation delivers (inferred; see positive-online-validation)."
  - name: one-use-instrument
    kind: message
    transmitted: true
    locator: "§Validity and CRLs ¶5, p.4"
    quote: "one can consider an instrument whose lifetime is \"one use\" and which is delivered only as part of a challenge/response protocol."
  - name: challenge
    kind: message
    transmitted: true
    locator: "§Validity and CRLs ¶5, p.4"
    quote: "one can consider an instrument whose lifetime is \"one use\" and which is delivered only as part of a challenge/response protocol."
    inferred: true
    inferred_reason: "The source names a challenge/response protocol but none of its messages. A challenge from the verifier is the least that protocol needs; its content is not given."
  - name: online-validation-request
    kind: message
    transmitted: true
    locator: "§Validity and CRLs ¶3, p.4"
    quote: "These have been replaced in the retail world by positive statements -- on-line validation of a single check, ATM card or credit card."
    inferred: true
    inferred_reason: "On-line validation of a single item implies the verifier asks about that item. The request is not named or defined."
  - name: positive-online-validation
    kind: message
    transmitted: true
    locator: "§Validity and CRLs ¶4, p.4"
    quote: "SPKI should support both positive and negative on-line validations."
    note: "A positive statement about a single certificate (¶3). Whether it is the revalidation instrument of ¶5 is not stated; read as one (inferred)."
  - name: negative-online-validation
    kind: message
    transmitted: true
    locator: "§Validity and CRLs ¶4, p.4"
    quote: "SPKI should support both positive and negative on-line validations."
    note: "A negative statement about a single certificate. The CRL is the source's example of a negative statement (¶3); this trigger is the per-certificate on-line form."
  - name: delegation-certificate
    kind: message
    transmitted: true
    aliases:
      - signed-key-certificate
    locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent', p.9"
    quote: "This signed-key should be considered equivalent to the certifying-key until this certificate expires for the following purposes ..."
    note: "Issued at smart-card login over a short-term key pair (M11)."
  - name: root-access-certificate
    kind: message
    transmitted: true
    locator: "§List of Certificate Uses, item 'I'm that same sysadmin', p.9"
    quote: "I'm that same sysadmin, I want an ephemeral certificate that grants me root access to certain systems for the day, or the week, or..."
  - name: certification-right-expiration-certificate
    kind: message
    transmitted: true
    locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
    quote: "This may imply a \"certification right expiration\" certificate requirement, probably to be implemented together with notary services."
    note: "The source says \"may imply\"; its content and issuer are not given. Also distributed as one of the certificates of §Other requirements item 'Reliable distribution' (M15)."
  - name: key-revocation
    kind: message
    transmitted: true
    locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
    quote: "Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates)."
    note: "Content not given."

  # ---- events ----
  - name: completion
    kind: event
    note: "UML completion event; see the header note."
  - name: clock-reaches-not-before
    kind: event
    locator: "§Validity and CRLs ¶1, p.4"
    quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
    inferred: true
    inferred_reason: "The verifier's clock reaching the first date of a validity period (of a certificate or of a CRL). The source gives the period, not the event."
  - name: clock-passes-not-after
    kind: event
    locator: "§Validity and CRLs ¶1, p.4"
    quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
    inferred: true
    inferred_reason: "The verifier's clock passing the last date of a validity period (of a certificate or of a CRL). The source gives the period, not the event."
  - name: lifetime-ends
    kind: event
    locator: "§Validity and CRLs ¶5, p.4"
    quote: "Any CRL or revalidation instrument must have its own lifetime."
    inferred: true
    inferred_reason: "The end of an instrument's lifetime by the verifier's clock. For a CRL it coincides with clock-passes-not-after of its validity dates; for a revalidation instrument the source does not say how the lifetime is expressed."
  - name: one-use-instrument-used
    kind: event
    locator: "§Validity and CRLs ¶5, p.4"
    quote: "one can consider an instrument whose lifetime is \"one use\" and which is delivered only as part of a challenge/response protocol."
    inferred: true
    inferred_reason: "What counts as the one use is not stated."
  - name: smart-card-login
    kind: event
    locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent', p.9"
    quote: "One way to do this is to use smart cards, but those typically have slow processors and are connected through low-bandwidth links; however, if you only use the smart card at \"login\" time to certify a short-term key pair, you get high performance and low exposure of the long term key."
  - name: signed-key-used
    kind: event
    locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent', p.9"
    quote: "This signed-key should be considered equivalent to the certifying-key until this certificate expires for the following purposes ..."
    inferred: true
    inferred_reason: "A verifier is asked to accept the signed-key for some purpose. The source names the purposes clause, not the use."
  - name: key-generator-changes
    kind: event
    aliases:
      - key-holder-leaves
    locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
    quote: "Especially in lower-end applications (e.g. host authentication) the people generating the keys (e.g., administrators) will change, and you will no longer want them to be able to certify."
  - name: name-resolved
    kind: event
    locator: "§General Requirements ¶3, p.3"
    quote: "That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key."
    inferred: true
    inferred_reason: "The source says a name is later resolved into a key; how, and by whom, is not stated."
  - name: matching-key-obtained
    kind: event
    locator: "§General Requirements ¶3, p.3"
    quote: "That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key."
    inferred: true
    inferred_reason: "A hash subject is bound to a key by obtaining a key whose hash it is. The source names the hash, not the step."
  - name: key-lookup
    kind: event
    locator: "§List of Certificate Uses, Other requirements, item 'Keys will need to be cached locally', p.11"
    quote: "Keys will need to be cached locally to avoid long delays fetching frequently used keys."
    inferred: true
    inferred_reason: "A verifier needs a key. Named from the source's 'fetching frequently used keys'."
  - name: key-fetched
    kind: event
    locator: "§List of Certificate Uses, Other requirements, item 'Keys will need to be cached locally', p.11"
    quote: "Keys will need to be cached locally to avoid long delays fetching frequently used keys."
    inferred: true
    inferred_reason: "The fetch completes. From where, and by what protocol, is not stated."
  - name: key-revoked-at-source
    kind: event
    locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
    quote: "This interacts with caching."
    inferred: true
    inferred_reason: "A revocation is issued while a verifier still holds the key in its cache. Observable to a harness, not to the verifier."
  - name: revocation-reached-all-verifiers
    kind: event
    locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
    quote: "May involve goals like \"will have spread everywhere in 24 hours\" or something like that."
    inferred: true
    inferred_reason: "The point at which the revocation has spread everywhere. Observable to a harness only."
  - name: distribution-goal-elapses
    kind: event
    locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
    quote: "May involve goals like \"will have spread everywhere in 24 hours\" or something like that."
    inferred: true
    inferred_reason: "The time goal (24 hours in the source's example) runs out. The goal itself is tentative in the source."

machines:
  # =====================================================================
  - id: M01
    name: certificate-input
    status: required
    locator: "§Implementation of Certificates ¶2, ¶5, ¶6, p.5; §General Requirements ¶5, p.3"
    actor: "verifier: receives a certificate and checks its signature"
    purpose: "One certificate from arrival to a checked signature. The core requirement is that the signature is checked over the certificate exactly as transmitted, with white-space canonicalization of a text format the only change allowed."
    hands_off: "signature-verified continues in M03."
    initial: awaiting-certificate
    states:
      - name: awaiting-certificate
        meaning: "No certificate has arrived."
        inferred: true
      - name: received
        meaning: "The certificate's bytes are held exactly as transmitted."
        inferred: false
      - name: white-space-canonicalized
        meaning: "A text-format certificate whose white space was canonicalized on input. The only permitted change before the signature check."
        inferred: false
      - name: parsed
        meaning: "The bytes have been read into the in-memory structure, touching each incoming byte once."
        inferred: false
      - name: signature-verified
        meaning: "The signature checks over the certificate as transmitted. The source names the check, not its outcomes."
        inferred: true
      - name: rejected-malformed
        meaning: "The bytes do not form a certificate of the defined structure. The source names no failure path."
        inferred: true
      - name: rejected-bad-signature
        meaning: "The signature does not check. The source names no failure path."
        inferred: true
    transitions:
      - id: M01-T01
        from: awaiting-certificate
        to: received
        trigger: spki-certificate
        guard: "None. The certificate may come from the keyholder directly or from a repository the keyholder chose; the machine does not depend on which."
        source:
          - locator: "§General Requirements ¶5, p.3"
            quote: "Because SPKI certificates might carry information that the keyholder might not want to publish, we assume that certificates will be distributed directly by the keyholder to the verifier."
          - locator: "§General Requirements ¶5, p.3"
            quote: "If the keyholder wishes to use a global repository, such as LDAP, the global PGP key server or the DNS database, that is up to the keyholder and not for the SPKI WG to specify."
        inferred: false
        constrained_by: []
      - id: M01-T02
        from: received
        to: white-space-canonicalized
        trigger: completion
        guard: "The format is text and the implementation canonicalizes white space on input. Optional: the source says \"might\"."
        source:
          - locator: "§Implementation of Certificates ¶5, p.5"
            quote: "although one might canonicalize white space during certificate input, for example, if the format is text"
        inferred: false
        constrained_by: []
      - id: M01-T03
        from: received
        to: parsed
        trigger: completion
        guard: "No white-space canonicalization applies, and the bytes are read into the structure in one pass, without a scan of the data and without recursion."
        source:
          - locator: "§Implementation of Certificates ¶6, p.5"
            quote: "That is, neither packing nor parsing of the structure should require a scan of the data."
          - locator: "§Implementation of Certificates ¶6, p.5"
            quote: "Data should be read into the kind of structure a programmer would want to use without touching the incoming bytes more than once."
          - locator: "§Implementation of Certificates ¶7, p.5"
            quote: "For efficiency, if possible, an SPKI certificate should be packed and parsed without any recursion."
        inferred: false
        note: "One pass and no recursion are qualified \"if possible\" in the source (¶6, ¶7)."
        constrained_by: []
      - id: M01-T04
        from: white-space-canonicalized
        to: parsed
        trigger: completion
        guard: "As M01-T03, on the canonicalized input."
        source:
          - locator: "§Implementation of Certificates ¶6, p.5"
            quote: "Data should be read into the kind of structure a programmer would want to use without touching the incoming bytes more than once."
        inferred: false
        constrained_by: []
      - id: M01-T05
        from: received
        to: rejected-malformed
        trigger: completion
        guard: "The bytes do not parse against the structure definition."
        source:
          - locator: "§Implementation of Certificates ¶2, p.5"
            quote: "In particular, the structure should be specific enough that the creator of a certificate is constrained by the structure definition, not by complaints (or error messages) from the reader of a certificate."
        inferred: true
        inferred_reason: "The source makes the structure definition the constraint on a certificate; that a reader rejects input outside it is supplied. The sentence prefers that creators never meet such errors, not that readers never raise them."
        constrained_by: []
      - id: M01-T06
        from: white-space-canonicalized
        to: rejected-malformed
        trigger: completion
        guard: "As M01-T05, on the canonicalized input."
        source:
          - locator: "§Implementation of Certificates ¶2, p.5"
            quote: "In particular, the structure should be specific enough that the creator of a certificate is constrained by the structure definition, not by complaints (or error messages) from the reader of a certificate."
        inferred: true
        inferred_reason: "As M01-T05."
        constrained_by: []
      - id: M01-T07
        from: parsed
        to: signature-verified
        trigger: completion
        guard: "The signature verifies over the certificate exactly as it was transmitted, with no reformatting other than the white-space canonicalization of M01-T02."
        source:
          - locator: "§Implementation of Certificates ¶5, p.5"
            quote: "A certificate should be signed exactly as it is transmitted."
          - locator: "§Implementation of Certificates ¶5, p.5"
            quote: "There should be no reformatting called for in the process of checking a certificate's signature (although one might canonicalize white space during certificate input, for example, if the format is text)."
        inferred: false
        constrained_by: []
      - id: M01-T08
        from: parsed
        to: rejected-bad-signature
        trigger: completion
        guard: "The signature does not verify over the certificate as transmitted."
        source:
          - locator: "§Implementation of Certificates ¶5, p.5"
            quote: "A certificate should be signed exactly as it is transmitted."
        inferred: true
        inferred_reason: "The failure branch of the signature check is not described."
        constrained_by: []
    error_states:
      - rejected-malformed
      - rejected-bad-signature
    terminal_states:
      - signature-verified
      - rejected-malformed
      - rejected-bad-signature
    prohibited:
      - behaviour: "Re-encoding, re-ordering, or otherwise reformatting the certificate (beyond white-space canonicalization of a text format) to obtain the bytes over which the signature is checked."
        locator: "§Implementation of Certificates ¶5, p.5"
        quote: "There should be no reformatting called for in the process of checking a certificate's signature (although one might canonicalize white space during certificate input, for example, if the format is text)."
      - behaviour: "Requiring library code, or ASN.1, to pack or parse the certificate."
        locator: "§Implementation of Certificates ¶4, p.5"
        quote: "No library code should be required for the packing or parsing of SPKI certificates."
    unspecified:
      - from: white-space-canonicalized
        trigger: completion
        situation: "Whether the signature of a canonicalized text certificate is checked over the canonical form or over the bytes as transmitted."
        open_question: OQ-02

  # =====================================================================
  - id: M02
    name: certificate-validity-period
    status: required
    locator: "§Validity and CRLs ¶1, p.4"
    actor: "verifier: places one certificate's validity period against its own clock"
    purpose: "The dated life of a certificate. On-line refinement (CRL or on-line validation) is not here; it is in M03."
    initial: issued
    states:
      - name: issued
        meaning: "The certificate exists and is being evaluated at t."
        inferred: true
      - name: not-yet-valid
        meaning: "t is before the dates within which the certificate is valid."
        inferred: true
      - name: within-validity-period
        meaning: "t is within the dates within which the certificate is valid, or the certificate carries no validity period."
        inferred: false
      - name: expired
        meaning: "t is after the dates within which the certificate is valid."
        inferred: true
    transitions:
      - id: M02-T01
        from: issued
        to: not-yet-valid
        trigger: completion
        guard: "t < not-before."
        source:
          - locator: "§Validity and CRLs ¶1, p.4"
            quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
        inferred: true
        inferred_reason: "The source states the period; the state before it is supplied."
        constrained_by: []
      - id: M02-T02
        from: issued
        to: within-validity-period
        trigger: completion
        guard: "not-before <= t <= not-after (ends: OQ-01)."
        source:
          - locator: "§Validity and CRLs ¶1, p.4"
            quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
        inferred: false
        constrained_by: []
      - id: M02-T03
        from: issued
        to: within-validity-period
        trigger: completion
        guard: "The certificate carries no validity period."
        source:
          - locator: "§Validity and CRLs ¶1, p.4"
            quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
        inferred: true
        inferred_reason: "The source makes a validity period something a certificate should be able to carry, so it may be absent; what an absent period means is not stated (OQ-03). Treated here as unbounded."
        constrained_by: []
      - id: M02-T04
        from: issued
        to: expired
        trigger: completion
        guard: "t > not-after."
        source:
          - locator: "§Validity and CRLs ¶1, p.4"
            quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
        inferred: true
        inferred_reason: "The source states the period; the state after it is supplied."
        constrained_by: []
      - id: M02-T05
        from: not-yet-valid
        to: within-validity-period
        trigger: clock-reaches-not-before
        guard: "None."
        source:
          - locator: "§Validity and CRLs ¶1, p.4"
            quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
        inferred: true
        inferred_reason: "Entry into the period as the clock advances is supplied."
        constrained_by: []
      - id: M02-T06
        from: within-validity-period
        to: expired
        trigger: clock-passes-not-after
        guard: "The certificate carries a not-after."
        source:
          - locator: "§Validity and CRLs ¶1, p.4"
            quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
          - locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent', p.9"
            quote: "This signed-key should be considered equivalent to the certifying-key until this certificate expires for the following purposes ..."
        inferred: true
        inferred_reason: "Leaving the period as the clock advances is supplied. The second quote shows the source using \"expires\" for a certificate passing its end."
        constrained_by: []
    error_states: []
    terminal_states:
      - expired
    unspecified:
      - from: within-validity-period
        trigger: clock-passes-not-after
        situation: "Tolerance for clock skew between issuer and verifier at either end of the period."
        open_question: OQ-04

  # =====================================================================
  - id: M03
    name: certificate-validation
    status: required
    locator: "§Validity and CRLs ¶1, ¶2, ¶4, p.4"
    actor: "verifier: decides whether one certificate is valid at t"
    purpose: "The required, deterministic validation: validity period, then on-line refinement, where a certificate that uses a CRL tells the verifier where to find it and the CRL's explicit validity dates select the one CRL that applies at t. Contrast M06, the rejected minimal CRL."
    determinism:
      claim: "With the three CRL requirements met, the outcome is a function of the certificate, the CRL sequence at the location the certificate names, and t, apart from clock skew."
      source:
        - locator: "§Validity and CRLs ¶2, p.4"
          quote: "Under this set of requirements, behavior of certificate validation is deterministic (aside from the question of clock skew)."
    invokes:
      - "M02 for the validity period (M03-T02, M03-T03)"
      - "M04 for the lifetime of the CRL or revalidation instrument used"
      - "M08 for an on-line validation (M03-T10)"
    initial: signature-verified
    states:
      - name: signature-verified
        meaning: "Entered from M01. The certificate is structurally sound and its signature checks."
        inferred: true
      - name: checking-validity-period
        meaning: "M02 is evaluated at t."
        inferred: true
      - name: outside-validity-period
        meaning: "M02 reached not-yet-valid or expired."
        inferred: true
      - name: refinement-check
        meaning: "Within its validity period; the verifier determines what on-line refinement of validity the certificate uses."
        inferred: false
      - name: fetching-crl
        meaning: "Obtaining the CRL from where the certificate tells the verifier to find it."
        inferred: false
      - name: crl-held
        meaning: "A CRL from that location is held; its explicit validity dates are compared with t."
        inferred: false
      - name: no-current-crl
