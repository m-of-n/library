        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
            quote: "This may imply a \"certification right expiration\" certificate requirement, probably to be implemented together with notary services."
        inferred: true
        inferred_reason: "The source ties the expiration to the change of person; ending the right without one is supplied."
        constrained_by: []
      - id: M13-T05
        from: holder-changed
        to: holder-changed
        trigger: spki-certificate
        guard: "Issued by this key."
        action: "The certificate is issued before the right is ended and will pass M14 as issued-before; this is the exposure the expiration certificate exists to close."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
            quote: "Especially in lower-end applications (e.g. host authentication) the people generating the keys (e.g., administrators) will change, and you will no longer want them to be able to certify."
        inferred: true
        inferred_reason: "Consequence of the supplied holder-changed window."
