  - id: M14
    name: certificate-from-retired-certifier
    status: brainstorm
    status_quote: "The list below is a brainstorming list, accumulated on the SPKI mailing list, of uses of such certificates."
    status_locator: "§List of Certificate Uses ¶1, p.5"
    locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11; item 'Timestamping / notary services', p.10"
    actor: "verifier: holds a certificate issued by a key whose certification right may have expired"
    purpose: "Separates certificates issued before a certification right expired, which stay valid on their own terms, from those issued after, which do not. The source pairs this with notary services, read here as the means of fixing when a certificate was issued."
    hands_off: "accepted-issued-before continues in M03 as if the right had never expired."
    initial: received
    states:
      - name: received
        meaning: "A certificate whose issuer's certification right is to be checked."
        inferred: true
      - name: right-in-force
        meaning: "No certification right expiration certificate for the issuer is known."
        inferred: true
      - name: checking-issuance-time
        meaning: "A certification right expiration certificate for the issuer is known; the time the certificate was made is compared with the expiration."
        inferred: true
      - name: accepted-issued-before
        meaning: "The certificate was made before the issuer's right expired; it stays valid on its own terms."
        inferred: false
      - name: rejected-issued-after
        meaning: "The certificate was made after the issuer's right expired."
        inferred: false
      - name: issuance-time-unknown
        meaning: "No notarized or otherwise trustworthy issuance time is available, so before and after cannot be told apart."
        inferred: true
    transitions:
      - id: M14-T01
        from: received
        to: right-in-force
        trigger: completion
        guard: "No certification right expiration certificate for the issuer is held."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
            quote: "This may imply a \"certification right expiration\" certificate requirement, probably to be implemented together with notary services."
        inferred: true
        inferred_reason: "The verifier's check is supplied; the source names only the certificate kind."
        constrained_by: []
      - id: M14-T02
        from: received
        to: checking-issuance-time
        trigger: certification-right-expiration-certificate
        guard: "Names the issuer of the certificate under test."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
            quote: "This may imply a \"certification right expiration\" certificate requirement, probably to be implemented together with notary services."
        inferred: true
        inferred_reason: "As M14-T01."
        constrained_by: []
      - id: M14-T03
        from: right-in-force
        to: checking-issuance-time
        trigger: certification-right-expiration-certificate
        guard: "Names the issuer; arrives while the verifier still holds the certificate."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates)."
        inferred: true
        inferred_reason: "Late arrival through distribution (M15) is supplied."
        constrained_by: []
      - id: M14-T04
        from: checking-issuance-time
        to: accepted-issued-before
        trigger: completion
        guard: "A trustworthy (e.g. notarized) issuance time precedes the expiration."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
            quote: "On the other hand, you will usually also not want all keys they have generated to expire."
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
            quote: "This may imply a \"certification right expiration\" certificate requirement, probably to be implemented together with notary services."
        inferred: true
        inferred_reason: "The source states two wishes: the keys already generated should usually not expire, and the person should no longer be able to certify. Turning them into a comparison of issuance time against the expiration, and using a notarized time for it, is supplied from \"together with notary services\"."
        constrained_by: []
      - id: M14-T05
        from: checking-issuance-time
        to: rejected-issued-after
        trigger: completion
        guard: "A trustworthy issuance time follows the expiration."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
            quote: "Especially in lower-end applications (e.g. host authentication) the people generating the keys (e.g., administrators) will change, and you will no longer want them to be able to certify."
        inferred: true
        inferred_reason: "As M14-T04."
        constrained_by: []
      - id: M14-T06
        from: checking-issuance-time
        to: issuance-time-unknown
        trigger: completion
        guard: "No trustworthy issuance time is available."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
            quote: "This may imply a \"certification right expiration\" certificate requirement, probably to be implemented together with notary services."
        inferred: true
        inferred_reason: "Why notary services are needed: a certificate's own dates are chosen by its issuer, so without a third-party time a retired issuer could backdate. Supplied; the source gives no reason."
        constrained_by: []
    error_states:
      - rejected-issued-after
      - issuance-time-unknown
    terminal_states:
      - accepted-issued-before
      - rejected-issued-after
      - issuance-time-unknown
    unspecified:
      - from: issuance-time-unknown
        trigger: completion
        situation: "Whether a certificate with no trustworthy issuance time is rejected or accepted."
        open_question: OQ-14
      - from: right-in-force
        trigger: completion
        situation: "Whether the verifier must look for an expiration certificate before accepting, and where."
        open_question: OQ-14

