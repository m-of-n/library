  - id: M06
    name: minimal-crl-certificate
    status: rejected
    status_quote: "Such a CRL leads to non-deterministic program behavior."
    status_locator: "§Validity and CRLs ¶2, p.4"
    locator: "§Validity and CRLs ¶2, p.4"
    actor: "wherever a minimal CRL meets the certificate: a verifier, or any holder; the source makes the CRL the actor (\"it encounters\")"
    purpose: "Negative model. The fate of one certificate under the minimal CRL the source rejects, so that a test can show a conforming verifier (M03) does not behave this way."
    nondeterminism:
      claim: "Whether, and when, a given place holds a certificate as annihilated depends on whether a minimal CRL listing it has reached that place. Transmission is unspecified and the CRL carries no dates, so two verifiers evaluating the same certificate at the same instant can disagree, and one verifier's answer can depend on arrival order. A certificate listed in one CRL and not in its successor survives only where the successor annihilated the earlier CRL before that CRL met the certificate."
      inferred: true
      inferred_reason: "The source states only that such a CRL leads to non-deterministic behaviour and lists the three fixes; this mechanism is read from those fixes (location, dates, non-overlap) and from \"Its method of transmission is not specified.\""
      source:
        - locator: "§Validity and CRLs ¶2, p.4"
          quote: "Its method of transmission is not specified."
        - locator: "§Validity and CRLs ¶2, p.4"
          quote: "Such a CRL leads to non-deterministic program behavior."
    initial: not-encountered
    states:
      - name: not-encountered
        meaning: "No minimal CRL that lists the certificate has encountered it here."
        inferred: true
      - name: annihilated
        meaning: "A minimal CRL that lists the certificate has encountered it."
        inferred: false
    transitions:
      - id: M06-T01
        from: not-encountered
        to: annihilated
        trigger: minimal-crl
        guard: "The CRL lists the certificate (identified uniquely), and the CRL has not itself been annihilated here (M07)."
        source:
          - locator: "§Validity and CRLs ¶2, p.4"
            quote: "If it encounters some certificate that it lists, then it annihilates that certificate."
        inferred: false
        note: "The second clause of the guard (the CRL not itself annihilated) is inferred from M07."
        constrained_by: []
      - id: M06-T02
        from: not-encountered
        to: not-encountered
        trigger: minimal-crl
        guard: "The CRL does not list the certificate."
        source:
          - locator: "§Validity and CRLs ¶2, p.4"
            quote: "If it encounters some certificate that it lists, then it annihilates that certificate."
        inferred: true
        inferred_reason: "The source states only the listing case."
        constrained_by: []
    error_states: []
    terminal_states:
      - annihilated
    harness_contrast:
      - "Present the same certificate to two M03 verifiers at the same t, where only one has received a minimal CRL listing it. A conforming verifier gives both the same answer; an M06 verifier does not."
      - "Deliver to an M03 verifier a CRL that lists the certificate but is not at the location the certificate names, or carries no validity dates. A conforming verifier does not revoke because of it (M03 prohibited)."

