  - id: M13
    name: certification-right
    status: brainstorm
    status_quote: "The list below is a brainstorming list, accumulated on the SPKI mailing list, of uses of such certificates."
    status_locator: "§List of Certificate Uses ¶1, p.5"
    locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11; §Implementation of Certificates ¶1, p.4"
    actor: "a key held by one of the people generating keys (e.g. an administrator)"
    purpose: "The issuer's right to certify ends while the keys it already generated stay valid: the people generating keys change, the right is ended by a certification right expiration certificate, and certificates issued before that are unaffected (M14)."
    initial: may-certify
    states:
      - name: may-certify
        meaning: "The keyholder is empowered to grant or delegate the authorization in question and generates and certifies keys."
        inferred: false
      - name: holder-changed
        meaning: "The person has changed (e.g. the administrator left) but the right has not yet been ended; certificates issued now would still appear valid."
        inferred: true
      - name: certification-right-expired
        meaning: "The right to certify has ended. Keys this key generated and certified before then are not thereby expired."
        inferred: false
    transitions:
      - id: M13-T01
        from: may-certify
        to: may-certify
        trigger: spki-certificate
        guard: "Issued by this key, which is empowered to grant or delegate the authorization in question."
        source:
          - locator: "§Implementation of Certificates ¶1, p.4"
            quote: "The authorization certificates that are envisioned for SPKI (and needed to meet the demands of the list given at the end of this document) should be generated by any keyholder empowered to grant or delegate the authorization in question."
        inferred: false
        note: "The trigger is the key issuing a certificate."
        constrained_by: []
      - id: M13-T02
        from: may-certify
        to: holder-changed
        trigger: key-generator-changes
        guard: "None."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
            quote: "Especially in lower-end applications (e.g. host authentication) the people generating the keys (e.g., administrators) will change, and you will no longer want them to be able to certify."
        inferred: true
        inferred_reason: "The interval between the change of person and the end of the right is supplied; it is the window M15 shortens."
        constrained_by: []
      - id: M13-T03
        from: holder-changed
        to: certification-right-expired
        trigger: certification-right-expiration-certificate
        guard: "Names this key's right to certify."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
