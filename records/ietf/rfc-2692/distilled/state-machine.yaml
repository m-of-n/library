        meaning: "Every verifier has it."
        inferred: false
      - name: goal-missed
        meaning: "The time goal elapsed before the revocation spread everywhere."
        inferred: true
    transitions:
      - id: M15-T01
        from: not-issued
        to: spreading
        trigger: key-revocation
        guard: "None."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates)."
        inferred: false
        constrained_by: []
      - id: M15-T02
        from: not-issued
        to: spreading
        trigger: certification-right-expiration-certificate
        guard: "None."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates)."
        inferred: false
        note: "Identifying the ceasing-of-the-right certificate here with M13's certification right expiration certificate is inferred."
        constrained_by: []
      - id: M15-T03
        from: spreading
        to: spread-everywhere
        trigger: revocation-reached-all-verifiers
        guard: "Before the time goal elapses."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "May involve goals like \"will have spread everywhere in 24 hours\" or something like that."
        inferred: false
        constrained_by: []
      - id: M15-T04
        from: spreading
        to: goal-missed
        trigger: distribution-goal-elapses
        guard: "Some verifier has not received it."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "May involve goals like \"will have spread everywhere in 24 hours\" or something like that."
        inferred: true
        inferred_reason: "The failure state is supplied; the goal itself is tentative (\"may involve\", \"or something like that\")."
        constrained_by: []
      - id: M15-T05
        from: goal-missed
        to: spread-everywhere
        trigger: revocation-reached-all-verifiers
        guard: "None."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates)."
        inferred: true
        inferred_reason: "Late completion is supplied."
        constrained_by: []
    error_states:
      - goal-missed
    terminal_states:
      - spread-everywhere

  # =====================================================================
  - id: M16
    name: local-key-cache
    status: brainstorm
    status_quote: "The list below is a brainstorming list, accumulated on the SPKI mailing list, of uses of such certificates."
    status_locator: "§List of Certificate Uses ¶1, p.5"
    locator: "§List of Certificate Uses, Other requirements, items 'Keys will need to be cached locally' and 'Reliable distribution', p.11"
    actor: "verifier: one entry of its local key cache"
    purpose: "A frequently used key cached locally to avoid fetching it, and the hazard the source flags: a revocation interacts with caching, so a cached key can be used after it is revoked until the revocation arrives."
    initial: not-cached
    states:
      - name: not-cached
        meaning: "The key is not held locally."
        inferred: false
      - name: fetching
        meaning: "The key is being fetched; the long delay caching avoids."
        inferred: false
      - name: cached
        meaning: "The key is held locally and served without a fetch."
        inferred: false
      - name: cached-revoked-unaware
        meaning: "The key has been revoked at its source but the revocation has not reached this cache; the cache still serves it. A harness can see this state; the verifier cannot."
        inferred: true
      - name: purged
        meaning: "A revocation for the key reached this cache and the entry is no longer served."
        inferred: true
    transitions:
      - id: M16-T01
        from: not-cached
        to: fetching
        trigger: key-lookup
        guard: "None."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Keys will need to be cached locally', p.11"
            quote: "Keys will need to be cached locally to avoid long delays fetching frequently used keys."
        inferred: false
        constrained_by: []
      - id: M16-T02
        from: fetching
        to: cached
        trigger: key-fetched
        guard: "None."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Keys will need to be cached locally', p.11"
            quote: "Keys will need to be cached locally to avoid long delays fetching frequently used keys."
        inferred: false
        constrained_by: []
      - id: M16-T03
        from: cached
        to: cached
        trigger: key-lookup
        guard: "None."
        action: "Serve the key locally, without a fetch."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Keys will need to be cached locally', p.11"
            quote: "Keys will need to be cached locally to avoid long delays fetching frequently used keys."
        inferred: false
        constrained_by: []
      - id: M16-T04
        from: cached
        to: cached-revoked-unaware
        trigger: key-revoked-at-source
        guard: "None."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "This interacts with caching."
        inferred: true
        inferred_reason: "The source says only that distribution interacts with caching; this state is our reading of that interaction."
        constrained_by: []
      - id: M16-T05
        from: cached-revoked-unaware
        to: cached-revoked-unaware
        trigger: key-lookup
        guard: "None."
        action: "The revoked key is served from the cache."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "This interacts with caching."
        inferred: true
        inferred_reason: "As M16-T04."
        constrained_by: []
      - id: M16-T06
        from: cached-revoked-unaware
        to: purged
        trigger: key-revocation
        guard: "Names this key."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates)."
        inferred: true
        inferred_reason: "That a cache drops a key on receiving its revocation is supplied."
        constrained_by: []
      - id: M16-T07
        from: cached
        to: purged
        trigger: key-revocation
        guard: "Names this key."
        source:
          - locator: "§List of Certificate Uses, Other requirements, item 'Reliable distribution', p.11"
            quote: "Reliable distribution of key revocations and other certificates (e.g., the ceasing of the right to make new certificates)."
        inferred: true
        inferred_reason: "As M16-T06; the revocation arrives at the same time it is issued, as seen by this cache."
        constrained_by: []
    error_states:
      - cached-revoked-unaware
    terminal_states:
      - purged
    unspecified:
      - from: cached
        trigger: completion
        situation: "How long a cached key may be served without a fresh fetch. The source points at name servers (\"Cf. current name servers.\") but states no rule."
        open_question: OQ-15
      - from: purged
        trigger: key-lookup
        situation: "What a lookup of a purged key returns."
        open_question: OQ-15

not_modelled:
  - item: "Certificate distribution from keyholder to verifier"
    locator: "§General Requirements ¶5, p.3"
    reason: "A flow, not a lifecycle; it is the arrival trigger of M01 and belongs to protocol.yaml."
    source:
      - locator: "§General Requirements ¶5, p.3"
        quote: "Because SPKI certificates might carry information that the keyholder might not want to publish, we assume that certificates will be distributed directly by the keyholder to the verifier."
  - item: "Creation of new authorizations"
    locator: "§General Requirements ¶4, p.3"
    reason: "A rule about who defines authorizations (the code author, with no outside interaction); no states."
    source:
      - locator: "§General Requirements ¶4, p.3"
        quote: "The creation of new authorizations should not require interaction with any other person or organization but rather be under the total control of the author of the code using the certificate."
  - item: "Minimal disclosure, anonymity, blinded signature keys, names"
    locator: "§General Requirements ¶6 to ¶9, p.3"
    reason: "Properties a certificate must be able to carry; no lifecycle is described."
    source:
      - locator: "§General Requirements ¶8, p.3"
        quote: "Because one use of SPKI certificates is in secret balloting and similar applications, an SPKI certificate must be able to assign an attribute to a blinded signature key."
  - item: "Key attribute acquisition under the three name-binding models"
    locator: "§List of Certificate Uses, item 'I need certificates to bind names to public keys', p.6"
    reason: "Describes where a key's attributes come from (a naked key acquiring them from a named person, or loaded directly by other certificates), not states with triggers and failures. Left to design notes."
    source:
      - locator: "§List of Certificate Uses, item 'I need certificates to bind names to public keys', p.6"
        quote: "In this model, a key starts out naked and acquires attributes, permissions and authority from the person bound to it."
  - item: "Certificate chain following"
    locator: "§List of Certificate Uses, item 'My bank would issue a certificate signing the key of a master bank certifier', p.6"
    reason: "A path search from a known key to another; the source gives no steps or failure cases. M03 is per certificate; chain order is a protocol matter."
    source:
      - locator: "§List of Certificate Uses, item 'My bank would issue a certificate signing the key of a master bank certifier', p.6"
        quote: "My bank would issue a certificate signing the key of a master bank certifier -- perhaps NACHA -- so that I could follow a certificate chain from a key I know (my bank's) to the key of any other bank in the US and, similarly, to any other bank in the world."
  - item: "The delegation-allowed bit"
    locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent', p.10"
    reason: "Floated and doubted in the same sentence; no semantics given. Recorded as unspecified in M11 (OQ-13)."
    source:
      - locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent', p.10"
        quote: "Maybe we need a \"delegation-allowed\" bit -- but there's nothing to stop someone who wishes to delegate against the rules from also loaning out their private key."
  - item: "Wallet-card and other listed uses with an implied lifecycle"
    locator: "§List of Certificate Uses, p.7-8"
    reason: "Items such as claim checks, a buy-10-get-1-free card, a fare card, a stock option, followup visits after surgery, a time card, marriage license and divorce decree imply counters, redemption or dissolution, but the source only names them. A machine would be invented, not extracted."
    source:
      - locator: "§List of Certificate Uses, p.7"
        quote: "There are a number of cards one carries in a typical wallet which could become certificates attached to a public key:"
  - item: "Spending limits"
    locator: "§List of Certificate Uses, items 'permission to spend up to $X' (p.9) and 'purchasing agent' (p.9)"
    reason: "A limit is named; whether it is per transaction or cumulative, and so whether it has state, is not stated."
    source:
      - locator: "§List of Certificate Uses, p.9"
        quote: "I want to posses a certificate that tells our suppliers that I'm authorized to make purchases up to $15,000."
  - item: "Current ownership of address space, DNS names, mail addresses"
    locator: "§List of Certificate Uses, items 'I am the current legitimate owner', p.10"
    reason: "\"current\" implies ownership changes, but no transfer or lapse is described."
    source:
      - locator: "§List of Certificate Uses, p.10"
        quote: "I am the current legitimate owner of a particular chunk of Internet address space."
  - item: "Private key theft, loan and repudiation"
    locator: "§Open Questions, p.11-12"
    reason: "The source says certificate machinery cannot detect or prove these, so there is no state to enter. Revocation that would follow a theft is modelled only as distribution (M15, M16)."
    source:
      - locator: "§Open Questions, p.11"
        quote: "Although this is of interest to the user of certificates, certificate format, contents or issuing machinery can not ensure the protection of a user's private key or prove whether or not a private key has been stolen or misused."
  - item: "Trust roots and the web trust model"
    locator: "§List of Certificate Uses, Other requirements, item 'Trust model must be a web', p.10"
    reason: "A choice the verifier makes, with no lifecycle given."
    source:
      - locator: "§List of Certificate Uses, Other requirements, item 'Trust model must be a web', p.10"
        quote: "People must be able to choose whom they trust or consider reliable roots (maybe with varying reliabilities)."
  - item: "Key acquisition protocols"
    locator: "§Charter of the SPKI working group ¶2, p.2"
    reason: "Named as work the group will do; not described here."
    source:
      - locator: "§Charter of the SPKI working group ¶2, p.2"
        quote: "The task of the working group will be to develop Internet standards for an IETF sponsored public key certificate format, associated signature and other formats, and key acquisition protocols."

open_questions:
  - id: OQ-01
    locator: "§Validity and CRLs ¶1, ¶2, p.4"
    question: "Are the end dates of a validity period (certificate or CRL) inside it? With inclusive ends, two CRLs that meet at one instant overlap, which the non-overlap rule forbids."
    affects:
      - M02
      - M03
      - M04
      - M05
    source:
      - locator: "§Validity and CRLs ¶1, p.4"
        quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
  - id: OQ-02
    locator: "§Implementation of Certificates ¶5, p.5"
    question: "If a text certificate's white space is canonicalized on input, is the signature checked over the canonical form or over the transmitted bytes? \"signed exactly as it is transmitted\" and canonicalizing on input agree only if the signer signed the canonical form and transmitted that."
    affects:
      - M01-T02
      - M01-T07
    source:
      - locator: "§Implementation of Certificates ¶5, p.5"
        quote: "A certificate should be signed exactly as it is transmitted."
  - id: OQ-03
    locator: "§Validity and CRLs ¶1, p.4"
    question: "What does a certificate with no validity period mean: valid without limit, or invalid? The source says only that a certificate should be able to carry one."
    affects:
      - M02-T03
    source:
      - locator: "§Validity and CRLs ¶1, p.4"
        quote: "An SPKI certificate, like any other, should be able to carry a validity period: dates within which it is valid."
  - id: OQ-04
    locator: "§Validity and CRLs ¶2, ¶5, p.4"
    question: "How much clock skew is tolerated, and how? The source excepts skew from its determinism claim and cites it against a zero lifetime, but gives no rule."
    affects:
      - M02
      - M03
      - M04-T04
    source:
      - locator: "§Validity and CRLs ¶2, p.4"
        quote: "Under this set of requirements, behavior of certificate validation is deterministic (aside from the question of clock skew)."
  - id: OQ-05
    locator: "§Validity and CRLs ¶2, ¶5, p.4"
    question: "What does a verifier do with a CRL that carries no validity dates, or an instrument with no lifetime: ignore it, or fail the certificate? The requirements bind the issuer."
    affects:
      - M03-T06
      - M04-T03
    source:
      - locator: "§Validity and CRLs ¶2, p.4"
        quote: "the CRL must carry explicit validity dates"
  - id: OQ-06
    locator: "§Validity and CRLs ¶2, ¶4, p.4"
    question: "What does the verifier do when no current CRL or on-line answer can be had: fetch again, wait, or reject?"
    affects:
      - M03-T07
      - M08
    source:
      - locator: "§Validity and CRLs ¶2, p.4"
        quote: "the certificate that uses it must explicitly tell the verifier where to find the CRL"
  - id: OQ-07
    locator: "§Validity and CRLs ¶2, p.4"
    question: "What does a verifier do on holding two CRLs of one sequence whose dates overlap, which the issuer must not produce?"
    affects:
      - M03
      - M05-T03
    source:
      - locator: "§Validity and CRLs ¶2, p.4"
        quote: "the dates of a sequence of CRLs must not overlap"
  - id: OQ-08
    locator: "§Validity and CRLs ¶2, p.4"
    question: "May a sequence of CRLs have gaps? In a gap no CRL is current and every certificate that uses the sequence reaches no-current-crl."
    affects:
      - M05
      - M03-T07
    source:
      - locator: "§Validity and CRLs ¶2, p.4"
        quote: "the dates of a sequence of CRLs must not overlap"
  - id: OQ-09
    locator: "§Validity and CRLs ¶2, p.4"
    question: "Does the required CRL keep the minimal CRL's sequence number? With non-overlapping dates the number no longer selects the current CRL; and for minimal CRLs, equal numbers or different issuers are not addressed."
    affects:
      - M05
      - M07
    source:
      - locator: "§Validity and CRLs ¶2, p.4"
        quote: "A minimal CRL contains a list of revoked certificates, identified uniquely, a sequence number and a signature."
  - id: OQ-10
    locator: "§Validity and CRLs ¶1, ¶5, p.4"
    question: "How does a positive on-line validation's lifetime combine with the certificate's validity period: does it narrow it only, or can it extend it?"
    affects:
      - M03-T11
      - M08-T02
    source:
      - locator: "§Validity and CRLs ¶1, p.4"
        quote: "It may also be necessary to have on-line refinement of validity."
  - id: OQ-11
    locator: "§Validity and CRLs ¶5, p.4"
    question: "For the one-use instrument: what is the use, how is the instrument bound to its challenge, and does an unused instrument also expire with time?"
    affects:
      - M09
    source:
      - locator: "§Validity and CRLs ¶5, p.4"
        quote: "one can consider an instrument whose lifetime is \"one use\" and which is delivered only as part of a challenge/response protocol."
  - id: OQ-12
    locator: "§General Requirements ¶3, p.3"
    question: "What happens when a name cannot be resolved into a key, or no key matching a hash is found? Who resolves names, and when?"
    affects:
      - M10
    source:
      - locator: "§General Requirements ¶3, p.3"
        quote: "That indirection can be via a collision-free hash of the public key or via a name, later to be resolved into a key."
  - id: OQ-13
    locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent', p.10"
    question: "Does a delegation-allowed bit exist, and if so does it gate the short-term-key delegation of M11? The source floats it and notes that key loaning defeats it."
    affects:
      - M11-T02
    source:
      - locator: "§List of Certificate Uses, item 'This signed-key should be considered equivalent', p.10"
        quote: "I'll note here that this flies in the face of attempts to prevent delegation of certain rights."
  - id: OQ-14
    locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
    question: "Who issues a certification right expiration certificate, how does a verifier learn of one, and how is a certificate's issuance time fixed (the source says only \"probably ... together with notary services\")? What happens to a certificate whose issuance time cannot be established?"
    affects:
      - M13-T03
      - M14
    source:
      - locator: "§List of Certificate Uses, Other requirements, item 'Especially in lower-end applications', p.11"
        quote: "This may imply a \"certification right expiration\" certificate requirement, probably to be implemented together with notary services."
  - id: OQ-15
    locator: "§List of Certificate Uses, Other requirements, items 'Keys will need to be cached locally' and 'Reliable distribution', p.11"
    question: "How long may a cached key be served, and how does the cache learn of a revocation? The source names the interaction and points at name servers without a rule."
    affects:
      - M16
    source:
      - locator: "§List of Certificate Uses, Other requirements, item 'Keys will need to be cached locally', p.11"
        quote: "The caching and performance requirements are similar."
