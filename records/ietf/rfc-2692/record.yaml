usefulness:
  verdict: useful
  reason: "The requirements document explaining WHY SPKI looks as it does. It is also the only place R-M-01 is argued from first principles rather than asserted: ASN.1 is ruled out, and sign-as-transmitted is stated as a requirement, which is R-O-03's problem posed before any canonical form existed."
