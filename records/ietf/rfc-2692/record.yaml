distillation:
  standard: "FX-1"
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "104 verbatim entries N-001 to N-104, in source order: Abstract 2, Charter 2, Background 1, General Requirements 9, Validity and CRLs 5, Implementation of Certificates 7, List of Certificate Uses 72 (intro, #1 to #62, #7a to #7c, OR-1 to OR-6), Open Questions 5 (each question kept with its answer), Security Considerations 1. Every entry carries _[lowercase/implied]_ because the source has no BCP 14 keyword. Of the 45 lowercase modals, 40 are covered; the 5 left out are all in the Full Copyright Statement. Four entries cross a page break and are flagged. Excluded: front and back matter, Charter paragraph 1 (motivation) and Background paragraph 1 (history). Source defects are recorded, not repaired."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "158 entries R-0001 to R-0158, all verb none: the source count and the extracted count are both 0, and the zero is measured and reconciled under an inclusion rule written out in reconciliation. 158 stated, 0 inferred; 34 testable yes, 109 partial, 15 no. Every certificate use is an entry (R-0050 to R-0150, including Other requirements R-0138 to R-0150). In Open Questions only the answers are entries; Security Considerations is a pointer and yields none. Three sentences split: R-0025 to R-0027, R-0038/R-0039, R-0063/R-0064. Of 47 modals (capitalised May included), 41 are inside texts; the other 6 are the References month and copyright boilerplate."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema/
      coverage: "No verbatim schema: the source prints no grammar, template or encoded example, and rules ASN.1 out. One derived JSON Schema 2020-12, spki-requirements.derived.schema.json, $id urn:library:rfc-2692:spki-requirements.derived: 33 $defs rooted at certificate (issuer, subject by key / hash / name, attributes, signature, optional validity, delegation-allowed, online-validation), crl, revalidation-instrument, and five certificate profiles (traditional, direct, personal-binding, anonymous, key-equivalence). 21 rules JSON Schema cannot express (date order, CRL non-overlap, signed as transmitted, LR(0), no recursion, no ASN.1) and 15 gaps, each with its quote, in README.md. 24 entries and properties flagged x-inferred. constrained_by left empty for pass 3."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "47 structures at the abstraction the source names; no wire format exists and the applicability header quotes why. Certificate, keyholder identifier, encoding profile (13 constraint fields from Implementation of Certificates), name binding, SDSI name, presentation and repository publication, CRL, CRL sequence, revalidation and one-use instruments, every List of Certificate Uses item (all 33 wallet cards verbatim in one catalogue), and the Open Questions. 281 quoted strings checked contiguous against the source; four cross page breaks and are flagged. Inferred fields flagged with reasons. constrained_by left empty for pass 3."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "Applicability PARTIAL: CRL transmission and repositories are left unspecified by the source. 26 roles (3 inferred), 26 flows with 88 steps (36 inferred, 52 with unspecified on_error), 34 error paths, 7 non-flows from the Open Questions and the source's exclusions, and every use-list item mapped to a flow. protocol.md carries one Mermaid sequence diagram per flow. 327 YAML and 140 prose quotes checked against the source. messages_referenced (30 names) not yet reconciled with messages.yaml; constrained_by left empty for pass 3."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "16 machines, each with a source status (required / permitted / rejected / considered / brainstorm): certificate input, validity period, certificate validation, instrument lifetime, CRL sequence issuance, the rejected minimal CRL as two anti-pattern machines, on-line validation, one-use instrument, delayed binding, short-term-key delegation, ephemeral root access, certification right and certificates from a retired certifier, revocation distribution, local key cache. 175 quotes checked against the source. Many states and transitions are inferred and flagged with reasons; 12 not_modelled items and 15 open questions. Triggers not yet reconciled with messages.yaml; constrained_by left empty for pass 3."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/
      coverage: "140 vectors in vectors.yaml, no byte-level vectors because the source prints none. 95 source vectors: 14 body illustrations, 75 List of Certificate Uses (62 top-level items, 3 name-binding sub-items, 6 Other requirements, the audit-identity paragraph, 3 split from bracketed commentary), 6 Open Questions with the source's own answer as expected. 45 constructed vectors over the CRL, lifetime, signing, encoding, delegation and certification-right rules, in an abstract YAML notation; 18 inferred and 6 soft. 225 verbatim strings checked. constrained_by left empty for pass 3."
      reviewed_by: ""
