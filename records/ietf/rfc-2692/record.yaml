distillation:
  standard: "FX-1"
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "104 verbatim entries N-001 to N-104, in source order: Abstract 2, Charter 2, Background 1, General Requirements 9, Validity and CRLs 5, Implementation of Certificates 7, List of Certificate Uses 72 (intro, #1 to #62, #7a to #7c, OR-1 to OR-6), Open Questions 5 (each question kept with its answer), Security Considerations 1. Every entry carries _[lowercase/implied]_ because the source has no BCP 14 keyword. Of the 45 lowercase modals, 40 are covered; the 5 left out are all in the Full Copyright Statement. Four entries cross a page break and are flagged. Excluded: front and back matter, Charter paragraph 1 (motivation) and Background paragraph 1 (history). Source defects are recorded, not repaired."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "158 entries R-0001 to R-0158, all verb none: the source count and the extracted count are both 0, and the zero is measured and reconciled under an inclusion rule written out in reconciliation. 158 stated, 0 inferred; 34 testable yes, 109 partial, 15 no. Every certificate use is an entry (R-0050 to R-0150, including Other requirements R-0138 to R-0150). In Open Questions only the answers are entries; Security Considerations is a pointer and yields none. Three sentences split: R-0025 to R-0027, R-0038/R-0039, R-0063/R-0064. Of 47 modals (capitalised May included), 41 are inside texts; the other 6 are the References month and copyright boilerplate."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema/
      coverage: "No verbatim schema: the source prints no grammar, template or encoded example, and rules ASN.1 out. One derived JSON Schema 2020-12, spki-requirements.derived.schema.json, $id urn:library:rfc-2692:spki-requirements.derived: 33 $defs rooted at certificate (issuer, subject by key / hash / name, attributes, signature, optional validity, delegation-allowed, online-validation), crl, revalidation-instrument, and five certificate profiles (traditional, direct, personal-binding, anonymous, key-equivalence). 21 rules JSON Schema cannot express (date order, CRL non-overlap, signed as transmitted, LR(0), no recursion, no ASN.1) and 15 gaps, each with its quote, in README.md. 25 entries and properties flagged x-inferred. Pass 3 wired 64 requirement links into $defs and NOT-EXPRESSIBLE, and applied four fixes the examples check found: validity-period takes either bound alone (a CRL and a dated instrument still need both), RC-01 skips a missing bound, RC-03 returns undetermined on a shared endpoint, same_key compares the keys identifiers denote."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "48 structures at the abstraction the source names; no wire format exists and the applicability header quotes why. Certificate, keyholder identifier, encoding profile (13 constraint fields from Implementation of Certificates), name binding, SDSI name, presentation and repository publication, CRL, CRL sequence, revalidation and one-use instruments, every List of Certificate Uses item (all 33 wallet cards verbatim in one catalogue), and the Open Questions. 281 quoted strings checked contiguous against the source; four cross page breaks and are flagged. Inferred fields flagged with reasons. Pass 3 wired constrained_by on every field and variant (254 links, 151 ids; the few left empty say why) and added spki-certificate.revalidation-location, personal-binding-certificate.no-binding-evidence and the inferred online-validation-request that protocol and state machine name."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "Applicability PARTIAL: CRL transmission and repositories are left unspecified by the source. 26 roles (3 inferred), 26 flows with 88 steps (37 inferred, 52 with unspecified on_error), 34 error paths, 7 non-flows from the Open Questions and the source's exclusions, and every use-list item mapped (35 entries: 32 to flows, 3 with the reason none applies). protocol.md carries one Mermaid sequence diagram per flow. 327 YAML and 150 prose quotes checked against the source. Pass 3 reconciled every message name with messages.yaml (42 names: 26 entries, 10 fields, 5 variants, 1 marked not in messages.yaml) and wired constrained_by on flows and steps (275 links, 92 ids; empties say why)."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "16 machines, each with a source status (required / permitted / rejected / considered / brainstorm): certificate input, validity period, certificate validation, instrument lifetime, CRL sequence issuance, the rejected minimal CRL as two anti-pattern machines, on-line validation, one-use instrument, delayed binding, short-term-key delegation, ephemeral root access, certification right and certificates from a retired certifier, revocation distribution, local key cache. 177 quotes checked against the source. Many states and transitions are inferred and flagged with reasons; 12 not_modelled items and 15 open questions. Pass 3 made every trigger a messages.yaml entry (32) or a declared event (60), wired constrained_by (99 links, 30 ids; four transitions on the rejected minimal CRL stay empty, with reasons) and added open questions OQ-16 to OQ-18."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/
      coverage: "140 vectors in vectors.yaml, no byte-level vectors because the source prints none. 95 source vectors: 14 body illustrations, 75 List of Certificate Uses (62 top-level items, 3 name-binding sub-items, 6 Other requirements, the audit-identity paragraph, 3 split from bracketed commentary), 6 Open Questions with the source's own answer as expected. 45 constructed vectors over the CRL, lifetime, signing, encoding, delegation and certification-right rules, in an abstract YAML notation; 18 inferred and 6 soft. 225 verbatim strings checked. Pass 3 validated 135 instances from 101 vectors against the derived schema with jsonschema (127 of 127 valid, 8 of 8 invalid rejected), named what decides each of the 28 negative outcomes, and wired constrained_by on all 140 vectors."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "An audit in both directions, every item tagged by source layer ([WG] / [list] / [OQ]) and mapped to ARCH, ADR, DEC or MD ids: 15 adopt, 11 adapt, 8 reject; a mapping table with a row for every bears_on id plus R-M-03, R-M-04, R-M-06 to R-M-08, R-M-10, R-M-12, R-I, R-O-04, R-O-05, DEC-003, DEC-004, DEC-008, DEC-009, G3, ARCH-0003, ADR-0003 D3 to D5, SPEC-0002 to SPEC-0005 and MD-1. MD-3 addressed: no header mapping, since the RFC defines no headers, and a DEC-002 options table scoring options 1, 2 and 5 (3 and 4 for completeness) against the Implementation of Certificates constraints, with where RFC 2692 cuts against option 5. 22 open questions, 18 to 22 added by pass 3 for places the source is silent or inconsistent; source typos recorded, not repaired; bears_on corrections proposed, record.yaml not edited. Main finding: a KSA revoke fails R-0024 to R-0028's determinism test (ADR-0003 D5). Our decisions read from m-of-n 643fba2. Decides nothing."
      reviewed_by: ""
