usefulness:
  verdict: useful
  reason: "One of the two standardised stateful hash-based signature families (with rfc-8554), whose security rests on hash-function properties alone (section 9.2), and the clearest statement of what that safety costs: a secret key that changes on every signature, an API that must return the new state (section 1.1), and no security left at all if a state is reused."
