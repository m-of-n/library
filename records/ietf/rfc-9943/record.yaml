  not_applicable:
    - kind: state-machine
      reason: "RFC 9943 defines no lifecycle for a Signed Statement, a Registration or a Receipt. It names no states at all - no submitted/pending/registered/rejected vocabulary exists - and its only ordering constraints are four imperative sentences: a TS MUST register a Signed Statement before releasing its Receipt and Receipt production MAY be asynchronous (6.3); the Verifiable Data Structure MUST be append-only, non-equivocating and replayable (5.1.3); and a Client authenticates before registering (6.3 step 1). Section 9.4.2 even permits a compromised TS to roll its Statement Sequence back. There is no state machine to extract."
    - kind: examples
      reason: "The source contains no reproducible example. All 14 hex byte strings are elided in the truncated form h'a4012603...6d706c65', and the source holds zero complete 32-hex runs, no base64 and no key material. The six EDN figures are structurally informative - they are where labels 395, 396 and the inclusion-proof tuple appear at all, since none of them is in the normative CDDL - and that content is carried in messages.yaml marked example-derived. What cannot be carried is bytes: not one signature, proof or digest in this RFC can be recomputed, so there is no fixture to write."
