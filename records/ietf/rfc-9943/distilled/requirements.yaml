note: >
  Ids are stable and never reused. Cite as rfc-9943#R-NNNN.
  Every text is a contiguous verbatim span of RFC 9943 - never a splice of two
  non-adjacent quotes. Two line-joining conventions apply where a span wraps.
  A wrap between two separate words is joined with a single space. A wrap at an
  end-of-line hyphen inside one hyphenated word is joined with no space, because
  the RFC text formatter breaks only at hyphens the word already contains: so
  source lines 1073-1074 "domain-" / "specific" are joined as "domain-specific"
  in R-0042, which is the word the document reads. R-0022 and R-0062 quote a
  lead sentence together with the enumerated options it governs, since the
  obligation is meaningless without them; line-joining renders those bullets as
  "MUST: * item * item", which is normalisation of the source layout and not
  corruption. Entries with kind inferred quote real source text whose obligation
  is not carried by a BCP 14 keyword - either ordinary lowercase
  "must"/"expected"/"responsible" prose, or a sub-property that inherits an
  enclosing MUST (R-0024 to R-0026 under R-0023). In the first case the verb is
  written in lowercase to mark that it contributes nothing to the keyword count.
  In the second case - R-0024, R-0025 and R-0026 only - the verb is written
  uppercase MUST, because the obligation those three carry is the uppercase MUST
  of R-0023 distributed over the three named sub-properties; their own text
  contains no keyword, so they still contribute nothing to the count. No keyword
  is counted from any verb field: extracted_keyword_count is computed over text
  only. The section 1.1 BCP 14 boilerplate sentence is deliberately not quoted.
  Tiling convention. Where one source sentence carries two separately testable
  obligations joined by a conjunction, the sentence is tiled across consecutive
  entries, each quoting its own contiguous span; the conjunction itself is
  quoted by neither, so the second span may begin with its verb and carry its
  subject in actor instead. R-0039 and R-0040 are the only pair tiled this way:
  R-0039 + " and " + R-0040 reconstructs the source sentence exactly, and
  R-0040 therefore reads "MUST verify the signature..." with "The TS" in actor.
  Quoting the whole sentence in R-0040 would double-count its two MUSTs, and
  quoting the conjunction would start the span with "and", so the split stands
  and the convention is recorded here rather than worked around.
  Promotion threshold for keyword-free text. A sentence carrying no BCP 14
  keyword is promoted to kind inferred when all three hold: it is quoted
  contiguously and verbatim; it names, or unambiguously fixes, the actor bound
  by it; and it states an obligation, a prohibition or an ordering that a
  conforming implementation could violate. The obligation may be carried by a
  lowercase modal (R-0002, R-0004, R-0006, R-0027, R-0028, R-0029, R-0059), by
  an obligational locution such as "are expected to" (R-0057), "are responsible
  for" (R-0058), "cannot assume" (R-0060), "It is important for ... not to"
  (R-0061) or "are unsuitable for" (R-0063), or by a procedural indicative that
  fixes an order (R-0064, section 6.3 step 1). Not promoted, and deliberately
  so: definitions and descriptions that constrain nothing (section 3 on the
  Envelope and the Issuer, section 4 "A Receipt is a signature over one or more
  VDP"); scope and delegation statements (section 1, and section 5.1.1 "leaves
  implementation, encoding, and documentation ... to the operator of the TS");
  bare permissions carrying no BCP 14 keyword, which grant latitude and cannot
  be failed (section 6.2 "a Statement can be made over the hash of a payload",
  section 7 "can produce a Transparent Statement", section 6.3 "The last two
  steps may be shared between a batch"); actorless prose (section 6 "Profiles
  and implementation-specific choices should be used to determine admissibility
  of conforming messages"); and indicative description that fixes neither an
  order nor a check (section 7 "The Registration time is recorded as the
  timestamp when the TS added the Signed Statement to its VDS", which is
  recorded instead in messages.yaml under referenced_but_not_defined, since no
  field is defined for it). A declaration that the mechanism is out of scope
  does not defeat promotion when the obligation survives it: R-0004 (key
  discovery out of scope), R-0061 (discovery out of scope) and R-0064
  (authentication out of scope) all stand on that footing, and all three are
  testable no or partial for exactly that reason.
  Ordering of entries. Entries run in source order. R-0064 was added in pass 3
  and sits at its section 6.3 step 1 position, between R-0038 and R-0039, so
  source order is preserved and the numbering is not: ids are stable and are
  never renumbered, so a late addition takes the next free number wherever it
  belongs in the document. R-0006 quotes its section 5 sentence in full, to the
  end of "the signed proofs", because the retained fragment alone read as if
  this document specified only the format of Signed Statements, which is the
  opposite of what the sentence says; the extension is contiguous and adds no
  BCP 14 keyword.

requirements:
  - id: rfc-9943#R-0001
    object: Receipt Profile
    field: supported proof types
    verb: MUST
    actor: Transparency Service
    locator: "§3"
    text: "Receipt Profiles implemented by a TS MUST support inclusion proofs and MAY support other Proof Types (see Section 3 of [RFC9942]), such as consistency proofs."
    kind: stated
    testable: partial       # the MUST half is checkable against a profile; the MAY half is a permission that cannot be failed, and the two are one sentence so they are not split
    status: active

  - id: rfc-9943#R-0002
    object: Statement
    field: media type tagging
    verb: must
    actor: Issuer
    locator: "§3"
    text: "To help interpret Statements, they must be tagged with a relevant media type (as specified in [RFC6838])."
    kind: inferred
    testable: yes
    status: active

  - id: rfc-9943#R-0003
    object: Statement payload
    field: confidentiality
    verb: MAY
    actor: Issuer
    locator: "§3"
    text: "The Statement is considered opaque to TS and MAY be encrypted."
    kind: stated
    testable: no       # a permission; an implementation cannot fail to be allowed to encrypt
    status: active

  - id: rfc-9943#R-0004
    object: Transparency Service identity
    field: public key distribution
    verb: must
    actor: Relying Party
    locator: "§3"
    text: "The identity of a TS is captured by a public key that must be known by Relying Parties in order to validate Receipts."
    kind: inferred
    testable: partial       # key discovery is out of scope of this document, so known-by is not locally checkable
    status: active

  - id: rfc-9943#R-0005
    object: Receipt
    field: verification key, algorithm, validity period, header parameters
    verb: MAY
    actor: Transparency Service
    locator: "§4"
    text: "A Receipt's verification key, signing algorithm, validity period, header parameters or other claims MAY change each time a Receipt is produced."
    kind: stated
    testable: no       # a permission; it bars Relying Parties from assuming stability rather than imposing a check
    status: active

  - id: rfc-9943#R-0006
    object: Signed Statement format
    field: universality
    verb: must
    actor: Issuer
    locator: "§5"
    text: "In order to accommodate as many TS implementations as possible, this document only specifies the format of Signed Statements (which must be used by all Issuers) and a very thin wrapper format for Receipts, which specifies the TS identity and the agility parameters for the signed proofs."
    kind: inferred
    testable: yes
    status: active

  - id: rfc-9943#R-0007
    object: Signed Statement
    field: registration multiplicity
    verb: MAY
    actor: Issuer
    locator: "§5"
    text: "In addition, Figure 2 illustrates multiple TSs and multiple Receipts as a single Signed Statement MAY be registered with one or more TS."
    kind: stated
    testable: no       # a permission; nothing fails if only one TS is used
    status: active

  - id: rfc-9943#R-0008
    object: Transparency Service
    field: Receipt format
    verb: MUST
    actor: Transparency Service
    locator: "§5.1"
    text: "TSs MUST produce COSE Receipts [RFC9942]."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0009
    object: Transparency Service
    field: Registration Policy
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.1"
    text: "To enable auditability, TSs MUST maintain Registration Policies."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0010
    object: Signed Statement
    field: COSE signature
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.1.1"
    text: "During Registration, a TS MUST syntactically check the Issuer of the Signed Statement by cryptographically verifying the COSE signature according to [STD96]."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0011
    object: Signed Statement protected header
    field: Issuer identifier
    verb: MUST
    actor: Issuer
    locator: "§5.1.1.1"
    text: "The Issuer identity MUST be bound to the Signed Statement by including an identifier in the protected header."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0012
    object: Signed Statement protected header
    field: multiple Issuer identifiers
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.1.1"
    text: "If the protected header includes multiple identifiers, all those that are registered by the TS MUST be checked."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0013
    object: Transparency Service
    field: trust anchor list
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.1.1"
    text: "TSs MUST maintain a list of trust anchors (see definition of trust anchor in [RFC4949]) in order to check the signatures of Signed Statements either separately or inside Registration Policies."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0014
    object: Signed Statement
    field: authentication
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.1.1"
    text: "TSs MUST authenticate Signed Statements as part of a Registration Policy."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0015
    object: X.509 Signed Statement
    field: certification path validation
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.1.1"
    text: "When using X.509 Signed Statements, the TS MUST build and validate a complete certification path from an Issuer's certificate to one of the root certificates currently registered as a trust anchor by the TS."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0016
    object: COSE_Sign1 protected header
    field: x5t or x5chain
    verb: MUST
    actor: Issuer
    locator: "§5.1.1.1"
    text: "The protected header of the COSE_Sign1 Envelope MUST include either the Issuer's certificate as x5t or the chain including the Issuer's certificate as x5chain, as defined in [RFC9360]."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0017
    object: COSE_Sign1 unprotected header
    field: x5chain
    verb: MAY
    actor: Issuer
    locator: "§5.1.1.1"
    text: "If x5t is included in the protected header, an x5chain with a leaf certificate corresponding to the x5t value MAY be included in the unprotected header."
    kind: stated
    testable: partial       # the permission itself cannot be failed, but the correspondence between the leaf certificate and the x5t value is checkable when the x5chain is present
    status: active

  - id: rfc-9943#R-0018
    object: Registration Policies and trust anchors
    field: transparency
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.1.1"
    text: "Registration Policies and trust anchors MUST be made Transparent and available to all Relying Parties of the TS by Registering them as Signed Statements on the VDS."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0019
    object: Registration Policy
    field: version selection
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.1.1"
    text: "The TS MUST apply the Registration Policy that was most recently committed to the VDS at the time of Registration."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0020
    object: Registration Policy and trust anchors
    field: update
    verb: MAY
    actor: Transparency Service operator
    locator: "§5.1.1.2"
    text: "The operator of a TS MAY update the Registration Policy or the trust anchors of a TS at any time."
    kind: stated
    testable: no       # a permission granted to the operator; nothing to fail
    status: active

  - id: rfc-9943#R-0021
    object: Registration record
    field: auditor reproducibility
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.1.2"
    text: "TSs MUST ensure that for any Signed Statement they register, enough information is made available to Auditors to reproduce the Registration checks that were defined by the Registration Policies at the time of Registration."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0022
    object: Transparency Service
    field: bootstrapping mechanism
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.2"
    text: "Since the mandatory Registration checks rely on having registered Signed Statements for the Registration Policy and trust anchors, TSs MUST support at least one of the three following bootstrapping mechanisms: * Preconfigured Registration Policy and trust anchors; * Acceptance of a first Signed Statement whose payload is a valid Registration Policy, without performing Registration checks; or * An out-of-band authenticated management interface."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0023
    object: Verifiable Data Structure
    field: security properties (Append-only, Non-equivocation, Replayability)
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.3"
    text: "This VDS MUST support the following security requirements:"
    kind: stated
    testable: partial       # the three named properties are enumerated in R-0024 to R-0026; review of specific VDSs against them is out of scope of this document
    status: active

  - id: rfc-9943#R-0024
    object: Verifiable Data Structure
    field: append-only
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.3"
    text: "Append-only:  a property required for a VDS to be applicable to SCITT, ensuring that the Statement Sequence cannot be modified, deleted, or reordered."
    kind: inferred
    testable: yes
    status: active

  - id: rfc-9943#R-0025
    object: Verifiable Data Structure
    field: non-equivocation
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.3"
    text: "Non-equivocation:  there is no fork in the registered sequence of Signed Statements accepted by the TS and committed to the VDS.  Everyone with access to its content sees the same ordered collection of Signed Statements and can check that it is consistent with any Receipts they have verified."
    kind: inferred
    testable: yes
    status: active

  - id: rfc-9943#R-0026
    object: Verifiable Data Structure
    field: replayability
    verb: MUST
    actor: Transparency Service
    locator: "§5.1.3"
    text: "Replayability:  the VDS includes sufficient information to enable authorized actors with access to its content to check that each data structure representing each Signed Statement has been correctly registered."
    kind: inferred
    testable: yes
    status: active

  - id: rfc-9943#R-0027
    object: Signed Statement
    field: COSE structure
    verb: must
    actor: Issuer
    locator: "§6"
    text: "Signed Statements produced by Issuers must be COSE_Sign1 messages, as defined by [STD96]."
    kind: inferred
    testable: yes
    status: active

  - id: rfc-9943#R-0028
    object: Statement payload
    field: payload type (label 3)
    verb: must
    actor: Issuer
    locator: "§6"
    text: "An Issuer must first decide on a suitable format (3: payload type) to serialize the Statement payload."
    kind: inferred
    testable: yes
    status: active

  - id: rfc-9943#R-0029
    object: Signed Statement
    field: Artifact identification
    verb: must
    actor: Issuer
    locator: "§6"
    text: "Issuers and Relying Parties must be able to recognize the Artifact to which the Statements pertain by looking at the Signed Statement."
    kind: inferred
    testable: yes
    status: active

  - id: rfc-9943#R-0030
    object: Issuer signing key
    field: kid and per-Artifact keying
    verb: MAY
    actor: Issuer
    locator: "§6"
    text: "Issuers MAY use different signing keys (identified by kid in the protected header from [STD96]) for different Artifacts or sign all Signed Statements under the same key."
    kind: stated
    testable: no       # a permission; both keying strategies conform
    status: active

  - id: rfc-9943#R-0031
    object: COSE Envelope unprotected header
    field: x5chain
    verb: MAY
    actor: Issuer
    locator: "§6"
    text: "Additionally, an x5chain that corresponds to either x5t or kid identifying the leaf certificate in the included certification path MAY be included in the unprotected header of the COSE Envelope."
    kind: stated
    testable: partial       # the permission cannot be failed, but the correspondence to x5t or kid is checkable when the x5chain is present
    status: active

  - id: rfc-9943#R-0032
    object: implementation
    field: x5t or x5chain in the protected header
    verb: REQUIRED
    actor: implementation
    locator: "§6"
    text: "When using X.509 certificates, support for either x5t or x5chain in the protected header is REQUIRED to implement."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0033
    object: implementation
    field: kid in the protected header and x5chain in the unprotected header
    verb: OPTIONAL
    actor: implementation
    locator: "§6"
    text: "Support for kid in the protected header and x5chain in the unprotected header is OPTIONAL to implement."
    kind: stated
    testable: no       # optional to implement; absence of support is conforming
    status: active

  - id: rfc-9943#R-0034
    object: CWT Claims
    field: iss (Claim label 1)
    verb: MUST
    actor: Issuer
    locator: "§6"
    text: "When x5t or x5chain is present in the protected header, the iss Claim value MUST be a string that meets URI requirements defined in [RFC8392]."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0035
    object: CWT Claims
    field: iss length
    verb: MUST
    actor: Issuer
    locator: "§6"
    text: "The iss Claim value's length MUST be between 1 and 8192 characters in length."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0036
    object: protected header
    field: kid (label 4)
    verb: MUST
    actor: Issuer
    locator: "§6"
    text: "The kid header parameter MUST be present when neither x5t nor x5chain is present in the protected header."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0037
    object: Signed Statement and Receipt protected header
    field: CWT Claims header parameter (label 15)
    verb: MUST
    actor: Issuer
    locator: "§6"
    text: "The protected header of a Signed Statement and a Receipt MUST include the CWT Claims header parameter as specified in Section 2 of [RFC9597]."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0038
    object: CWT Claims
    field: iss (label 1) and sub (label 2)
    verb: MUST
    actor: Issuer
    locator: "§6"
    text: "The CWT Claims value MUST include the Issuer Claim (Claim label 1) and the Subject Claim (Claim label 2) [IANA.cwt]."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0064
    object: Registration
    field: ordering of Client authentication and Registration
    verb: authenticates
    actor: Client
    locator: "§6.3 step 1"
    text: "A Client authenticates with the TS before registering Signed Statements on behalf of one or more Issuers."
    kind: inferred
    testable: no       # the ordering is real, but the sentence that follows it puts the mechanism out of scope - "Authentication and authorization are implementation specific and out of scope of the SCITT architecture" - so no credential, challenge or token exists to observe the order against
    status: active

  - id: rfc-9943#R-0039
    object: Signed Statement
    field: COSE signature verification
    verb: MUST
    actor: Transparency Service
    locator: "§6.3"
    text: "The TS MUST perform signature verification per Section 4.4 of RFC 9052 [STD96]"
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0040
    object: Signed Statement
    field: signature algorithm and Issuer verification key
    verb: MUST
    actor: Transparency Service
    locator: "§6.3"
    text: "MUST verify the signature of the Signed Statement with the signature algorithm and verification key of the Issuer per [RFC9360]."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0041
    object: Signed Statement
    field: required protected headers
    verb: MUST
    actor: Transparency Service
    locator: "§6.3"
    text: "The TS MUST also check that the Signed Statement includes the required protected headers."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0042
    object: Signed Statement payload
    field: content-type-specific validation
    verb: MAY
    actor: Transparency Service
    locator: "§6.3"
    text: "The TS MAY validate the Signed Statement payload in order to enforce domain-specific registration policies that apply to specific content types."
    kind: stated
    testable: no       # a permission, and the policies it enables are implementation specific
    status: active

  - id: rfc-9943#R-0043
    object: Registration Policy attributes
    field: presence in the protected headers
    verb: MUST
    actor: Transparency Service
    locator: "§6.3"
    text: "The TS MUST check the attributes required by a Registration Policy are present in the protected headers."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0044
    object: Receipt return
    field: synchrony
    verb: MAY
    actor: Transparency Service
    locator: "§6.3"
    text: "This MAY be asynchronous from Registration."
    kind: stated
    testable: no       # a permission about timing; both synchronous and asynchronous return conform
    status: active

  - id: rfc-9943#R-0045
    object: Receipt
    field: availability for registered Signed Statements
    verb: MUST
    actor: Transparency Service
    locator: "§6.3"
    text: "The TS MUST be able to provide a Receipt for all registered Signed Statements."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0046
    object: Registration
    field: ordering of registration and Receipt release
    verb: MUST
    actor: Transparency Service
    locator: "§6.3"
    text: "A TS MUST ensure that a Signed Statement is registered before releasing its Receipt."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0047
    object: Signed Statement unprotected header
    field: acceptance and use during registration
    verb: MAY
    actor: Transparency Service
    locator: "§6.3"
    text: "A TS MAY accept a Signed Statement with content in its unprotected header and MAY use values from that unprotected header during verification and registration policy evaluation."
    kind: stated
    testable: no       # two permissions in one sentence, neither separately failable, so they are not split
    status: active

  - id: rfc-9943#R-0048
    object: Signed Statement unprotected header
    field: value written into the Statement Sequence
    verb: MUST
    actor: Transparency Service
    locator: "§6.3"
    text: "However, the unprotected header of a Signed Statement MUST be set to an empty map before the Signed Statement can be included in a Statement Sequence."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0049
    object: Signed Statement
    field: amendment using the same iss and sub
    verb: SHOULD
    actor: Issuer
    locator: "§6.3"
    text: "An Issuer that knows of a changed state of quality for an Artifact SHOULD Register a new Signed Statement using the same 15 CWT iss and sub Claims."
    kind: stated
    testable: partial       # reuse of iss and sub is checkable once a new Signed Statement exists, but knowing of a changed state of quality is not observable from the wire
    status: active

  - id: rfc-9943#R-0050
    object: Client application
    field: registration on behalf of Issuers
    verb: MAY
    actor: Client
    locator: "§7"
    text: "Client applications MAY register Signed Statements on behalf of one or more Issuers."
    kind: stated
    testable: no       # a permission; the Client need not be the Issuer
    status: active

  - id: rfc-9943#R-0051
    object: Client application
    field: Receipt requests
    verb: MAY
    actor: Client
    locator: "§7"
    text: "Client applications MAY request Receipts regardless of the identity of the Issuer of the associated Signed Statement."
    kind: stated
    testable: no       # a permission; it bars the TS from tying Receipt requests to Issuer identity rather than imposing a Client-side check
    status: active

  - id: rfc-9943#R-0052
    object: Signed Statement and Receipt signatures
    field: COSE verification process
    verb: MUST
    actor: Relying Party
    locator: "§7.1"
    text: "Relying Parties MUST apply the verification process as described in Section 4.4 of RFC 9052 [STD96] when checking the signature of Signed Statements and Receipts."
    kind: stated
    testable: yes
    status: active

  - id: rfc-9943#R-0053
    object: Receipt Issuer
    field: trusted verification key or certificate
    verb: MUST
    actor: Relying Party
    locator: "§7.1"
    text: "A Relying Party MUST trust the verification key or certificate and the associated identity of at least one Issuer of a Receipt."
    kind: stated
    testable: partial       # the presence of a configured trust anchor is checkable, but trust itself is a local policy decision
    status: active

  - id: rfc-9943#R-0054
    object: Transparent Statement validation
    field: scope of checks
    verb: MAY
    actor: Relying Party
    locator: "§7.1"
    text: "A Relying Party MAY decide to verify only a single Receipt that is acceptable to them and not check the signature on the Signed Statement or Receipts that rely on VDSs they do not understand."
    kind: stated
    testable: no       # a permission to check less; nothing to fail
    status: active

