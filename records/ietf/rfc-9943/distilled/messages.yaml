media_type_semantics_note:
  locator: "§9.5"
  quote: >-
    "The Statement (scitt-statement+cose) and Receipt (scitt-receipt+cose)
    media types describe the expected content of COSE envelope headers. The
    payload media type (content type) is included in the COSE envelope header.
    [STD96] describes the security implications of reliance on this header
    parameter. Both media types describe COSE_Sign1 messages, which include a
    signature and therefore provide integrity protection."
media_type_gap_note: >-
  No media type is registered for a Transparent Statement. A Transparent
  Statement travels as application/scitt-statement+cose, since it "remains a
  valid Signed Statement" (§3).

coap_content_formats:
