# ====================================================================
# Things the document names or relies on but does not define. Each is either
# explicitly delegated or simply absent - none is an invented gap.
referenced_but_not_defined:
  - item: "Receipt internals (VDS algorithm, proofs, proof encodings)"
    delegated_to: rfc-9942
    evidence: >-
      §5: "The remaining details of the Receipt's contents are specified in
      [RFC9942]."
  - item: "COSE_CertHash (label 34 value) and COSE_X509 (label 33 value)"
    delegated_to: rfc-9360
    evidence: >-
      Figure 3 references both rule names without defining them; §5.1.1.1
      (R-0016) and §6 (R-0031) cite [RFC9360].
  - item: "COSE_Sign1 signing and verification, Sig_structure, to-be-signed bytes"
    delegated_to: "STD96 (RFC 9052 §4.2 and §4.4)"
    evidence: "R-0039 (§6.3), R-0052 (§7.1)."
  - item: "CWT Claims Set semantics; the iss/sub URI requirements"
    delegated_to: "RFC 8392, carried into COSE headers by RFC 9597"
    evidence: "R-0034 defers the URI rule to [RFC8392]."
  - item: "The label-15 CWT Claims header parameter mechanism itself"
    delegated_to: "RFC 9597 §2"
    evidence: "R-0037."
  - item: "Registration Policy syntax, encoding, vocabulary, documentation format"
    delegated_to: "the TS operator"
    evidence: "§5.1.1, quoted in full in the Registration_Policy message entry."
  - item: "Client authentication and authorization for registration"
    status: "explicitly out of scope"
    evidence: >-
      §6.3 step 1: "Authentication and authorization are implementation specific
      and out of scope of the SCITT architecture."
  - item: "Key discovery for a bare kid"
    status: "explicitly out of scope"
    evidence: >-
      §6: "Key discovery protocols are out of scope of this document." R-0036
      makes kid mandatory in that case but nothing says how to resolve it.
  - item: "The Transparency Service's own verification key, and how a Relying Party learns it"
    status: "named, no field defined"
    requirements: [rfc-9943#R-0004, rfc-9943#R-0053]
    evidence: >-
      §3: "The identity of a TS is captured by a public key that must be known
      by Relying Parties in order to validate Receipts." (R-0004), and §7.1
      "A Relying Party MUST trust the verification key or certificate and the
      associated identity of at least one Issuer of a Receipt." (R-0053). The
      key reaches a Relying Party only through the Receipt's own protected
      header - kid (4), x5t (34) or x5chain (33), all CDDL-optional - and §6
      puts discovery out of scope, so no field, registry or endpoint carries a
      TS key in this RFC. These are the only two requirements that name a
      structure for which no artifact can show a defining field, and the reason
      is the document's, not the extraction's.
  - item: "Registration timestamp"
    status: "named, no field defined"
    evidence: >-
      §7: "The Registration time is recorded as the timestamp when the TS added
      the Signed Statement to its VDS." No CWT claim, COSE label or encoding is
      given for it anywhere in this RFC.
  - item: "Receipt validity period claims"
    status: "alluded to, no claim defined"
    evidence: >-
      §7.1: an API "may indicate ... if Claims related to the validity period
      are valid." R-0005 (§4) lists validity period among the things that MAY
      change per Receipt. No exp/nbf/iat claim is named or required.
  - item: "Any wire protocol, endpoint, or API for registration and receipt retrieval"
    status: "absent"
    evidence: >-
      §6.3 describes five abstract steps with no transport. §1: "How these
      statements are managed or stored as well as how participating entities
      discover and notify each other of changes is out of scope of this
      document." §5.1.4 mentions Adjacent Services only informatively. The CoAP
      content-format registrations in §10.3 are the only transport hint.
  - item: "Hash algorithm and hash-envelope structure for §6.2's hash-of-payload pattern"
    status: "absent"
    evidence: >-
      §6.2 and Figure 6 give the flow but no algorithm identifier and no
      declaring header parameter.
  - item: "Mandatory-to-implement signature algorithm"
    status: "absent"
    evidence: >-
      §9.6 defers entirely to STD96's cryptographic agility. The examples use
      alg -7 (ES256) illustratively only.
  - item: "VDS leaf encoding / tree shape / registration ordering guarantee"
    status: "explicitly out of scope"
    evidence: >-
      §5.1.3: "Specific VDSs ... are out of scope for this document." R-0060
      (§9.1) bars Relying Parties from assuming issuance order.
  - item: "Revocation strategy for compromised keys"
    status: "explicitly out of scope"
    evidence: >-
      §9.4.2: "Revocation strategies for compromised keys are out of scope for
      this document." R-0062 covers protection, single-purpose use and rotation
      only.
  - item: "Media type for a Transparent Statement"
    status: "absent"
    evidence: "§10 registers only scitt-statement+cose and scitt-receipt+cose."
  - item: "Batching semantics for registration"
    status: "named, not specified"
    evidence: >-
      §6.3: "The last two steps may be shared between a batch of Signed
      Statements registered in the VDS." No batch message or encoding is given.

# ====================================================================
internal_inconsistencies_observed:
  - id: INC-1
    locator: "Figure 3 (§6.1) vs Figure 7 (§7), source lines 1143-1145"
    issue: >-
      The CDDL rule name Unprotected_Header is defined twice with different
      bodies. CDDL has no scoping mechanism that would make both legal in a
      single schema, so the two figures must be read as two profiles. The
      divergence is larger than it first appears: Figure 7 does not merely make
      394 mandatory, it also drops "? &(x5chain: 33) => COSE_X509" and drops
      "* label => any", leaving a CLOSED one-member map. Taken literally that
      forbids a Transparent Statement from carrying the unprotected x5chain that
      R-0017 and R-0031 both permit, and leaves no socket through which a
      Registration Policy could add a mandatory label there, contradicting
      §6.1. See Unprotected_Header.figure_7_closure.
    affects: [Unprotected_Header, Transparent_Statement]
  - id: INC-2
    locator: "§7, prose introducing Figure 10"
    issue: >-
      The prose says "Figure 10 illustrates the decoded protected header of the
      Transparent Statement in Figure 8", but the figure's own caption reads
      "Figure 10: CBOR-Extended Diagnostic Notation Example of a Receipt's
      Protected Header", and its contents (iss = transparency.vendor.example,
      label 395 VDS) are a Receipt's, not the Transparent Statement's. The
      caption is correct and the prose sentence is not. Figure 8's protected
      bytes h'a4012603...' also differ from the Receipt's h'a4012604...' in
      Figure 9, which confirms they are two different headers.
    affects: [Receipt, Transparent_Statement]
  - id: INC-3
    locator: "Figure 8 (§7)"
    issue: >-
      Receipt 1 begins h'd284...' = CBOR tag(18) + array(4), matching
      Receipt = #6.18(COSE_Sign1). Receipt 2 begins h'c624...', and 0xc6 is
      tag(6), not tag(18). Within elided illustrative bytes this reads as a typo
      rather than a second admissible encoding; the CDDL admits only #6.18.
    affects: [Transparent_Statement]
  - id: INC-4
    locator: "§6 and §5.1.1.1 vs Figure 3 (§6.1)"
    issue: >-
      The prose makes identity binding mandatory - R-0011 ("The Issuer identity
      MUST be bound to the Signed Statement by including an identifier in the
      protected header"), R-0016 (x5t or x5chain MUST be present for X.509) and
      R-0036 (kid MUST be present when neither is) - while Figure 3's CDDL marks
      kid, x5t and x5chain all optional with "?". A validator built from the
      CDDL alone would accept a protected header carrying only CWT Claims and no
      identity binding at all, which the prose forbids. The prose is the binding
      constraint; the CDDL is strictly weaker.
    affects: [Protected_Header, Signed_Statement]
