record: rfc-9943
reviewed_by: ""

# NOT APPLICABLE — recorded in record.yaml under distillation.not_applicable.
# This file exists to hold the finding, not a machine.
applicable: false
reason: >
  RFC 9943 defines no lifecycle for a Signed Statement, a Registration or a
  Receipt. It names no states at all, and its ordering constraints are all
  plain sentences rather than transitions - a Client authenticates before
  registering (§6.3 step 1); a TS MUST register a Signed Statement before
  releasing its Receipt and Receipt production MAY be asynchronous (§6.3); and
  the Verifiable Data Structure MUST be append-only, non-equivocating and
  replayable (§5.1.3). All four are listed under ordering_constraints_in_lieu_of_states below with
  the requirement id that carries each. There is no state machine to extract.

evidence:
  searched_and_absent:
    # occurrence counts over the full 1772-line source
    lifecycle: 0            # the solid spelling only; see lifecycle_spellings below
    transition: 0
    "state machine": 0
    "initial state": 0
    pending: 0
    submitted_as_status: 0
    registered_as_status: 0
    rejected_as_status: 0
    revoked: 0
    invalid: 0
  lifecycle_spellings:
    note: >-
      The absence claim above is about a concept, not a spelling, so every form
      of the word was searched. The solid "lifecycle" occurs 0 times. The
      hyphenated form occurs 3 times - "life-cycle" at line 183 (§2.1,
      "an SSC attack may leverage one or more life-cycle stages"), "Life-Cycle"
      at line 231 (the Figure 1 caption, "Example SSC Life-Cycle Threats") and
      "life-cycle" at line 350 (§2.2.2, "complex distribution and promotion
      life-cycle scenarios"). The open form "life cycle" occurs once, at line
      236 (§2.1, "checking provenance and traceability throughout their life
      cycle is difficult"). All four are in the motivational software supply
      chain narrative of §2, which normative.md excludes as motivation. Not one
      of them names a stage, state or status of a Signed Statement, a
      Registration or a Receipt - the life-cycle in question is the software
      component's, not the protocol's. The absence of a protocol lifecycle is
      therefore a fact about the document and not an artifact of spelling.
  present_but_not_statuses:
    - 'accepted / committed occur only at §5.1.1.1 and §5.1.3 as descriptions of
      the VDS property, never as a status a statement is in'
    - '"state" occurs only in non-protocol senses: "a state where a TS provides
      inconsistent proofs" (§3, Equivocation), "the current TS state" (§6.3
      step 3), "a changed state of quality for an Artifact" (§6.3), "any local
      state" (§7.1)'

# Each entry names the requirement that carries it, so the absence of a state
# machine does not mean the orderings go unrecorded anywhere citable.
ordering_constraints_in_lieu_of_states:
  - locator: "§6.3 step 1"
    requirement: rfc-9943#R-0064
    text: "A Client authenticates with the TS before registering Signed Statements on behalf of one or more Issuers."
    note: >-
      Carries no BCP 14 keyword; the ordering is in the indicative "before".
      The mechanism is put out of scope by the next sentence, so nothing
      observable marks the order.
  - locator: "§6.3"
    requirement: rfc-9943#R-0046
    text: "A TS MUST ensure that a Signed Statement is registered before releasing its Receipt."
  - locator: "§6.3 step 5"
    requirement: rfc-9943#R-0044
    text: "This MAY be asynchronous from Registration."
  - locator: "§5.1.3"
    requirement: rfc-9943#R-0024
    text: "ensuring that the Statement Sequence cannot be modified, deleted, or reordered"
    note: >-
      A contiguous sub-span of R-0024, whose full text is the Append-only
      bullet. Quoted short here because only the ordering clause bears on a
      lifecycle; R-0024 is where the whole bullet lives.

# The finding that matters most here, and the reason this absence is not benign.
sanctioned_rollback:
  locator: "§9.4.2"
  text: >
    TSs whose receipt signing keys have been compromised can roll back their
    Statement Sequence to a point before compromise, establish new credentials,
    and use the new credentials to issue fresh Receipts going forward.
  note: >
    The RFC permits a Transparency Service to undo its append-only Statement
    Sequence and defines no notification channel for it — §1 scopes discovery
    and notification out, and §9.4.2 scopes revocation out. A Relying Party
    holding a Receipt from before the rollback has no defined way to learn it is
    now worthless, and a consistency proof cannot distinguish a sanctioned
    rollback from a fork. Append-only is therefore a property of the data
    structure, not of the service.
