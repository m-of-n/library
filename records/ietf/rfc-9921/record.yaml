distillation:
  standard: "FX-1"
  # NO `profile` IS DECLARED. Pass 1 (extract) is complete and the artifact set
  # is complete; pass 2 (verify) and pass 3 (cross-check) have NOT run and no
  # `reviewed_by` is signed. Under docs/extraction.md an unfinished extraction
  # has no profile at all, and that is the state of this record. `status` stays
  # `summarized` for the same reason, following records/ietf/rfc-8392, which is
  # in the same lane and the same pass-1 state.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: >-
        29 verbatim regions covering the Abstract and §1-§7 and both
        appendices, in source order, each an exact run of source lines with its
        line range and its own sha256 (the region's lines joined by \n, no
        trailing newline). Includes §1.2's BCP 14 recital, BOTH FIGURES WHOLE,
        §6's Table 1 whole and the whole reference list. COVERAGE IS MEASURED,
        NOT ASSERTED: every statement-bearing line of source lines 17-23 and
        79-1014 is inside a region except section headings, blank lines and the
        two 159-line hex blocks, which are DECLARED with their digests rather
        than reproduced because each is 5453 octets of DER printed as hex - 0
        uncovered. All 29 regions re-verified after writing: digest AND printed
        block byte-identical to the cache. The only statement-bearing lines
        outside that span are 25-77 (Status of This Memo, Copyright Notice,
        Table of Contents), excluded deliberately and recorded as excluded. The
        two sentences that a displayed byte block INTERRUPTS (§3.1.1, §3.1.2)
        are quoted as whole regions so the interruption is visible, and nothing
        is welded across a gap. No pagination to guard against: this rendering
        has ZERO form feeds and no running headers, unlike the paginated RFCs
        elsewhere in this library.
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: >-
        109 entries R-0001 to R-0109 in source order, no gaps, no duplicate
        ids: 11 stated and 98 inferred. source_keyword_count and
        extracted_keyword_count BOTH 8 AND AGREEING (6 MUST, 2 SHOULD), with a
        reconciliation written anyway. THE FINDING IS WHERE THE EIGHT ARE NOT:
        six of them are in §3.1 and §3.2 and they bind three things only -
        which bucket each label lives in, what each mode hashes, and that the
        two hash algorithms should agree; one binds the receiver (§4) and one
        binds a human (§5.1, "Implementers MUST clearly differentiate"). NOT
        ONE is in §6, so neither IANA registration is normatively stated
        anywhere but a table; not one constrains the CONTENTS of the byte
        string either parameter carries; and not one requires deterministic
        encoding, a value schema, TSA trust establishment or integrity
        protection of the unprotected bucket. NINE LOWER-CASE FORCE WORDS are
        entries with `verb: none` and the carrier phrase named in `field`, and
        TWO OF THEM ARE THE DOCUMENT'S ANSWERS TO ITS OWN STATED ATTACKS (§5's
        "should be integrity protected during transit and at rest" and §1.1's
        "the TST must be included in the signed statement"). All 109 texts were
        CUT FROM THE CACHE BY SCRIPT, located by anchor in the
        whitespace-normalised source, and `source_lines` was READ BACK off a
        per-character line map rather than typed; all 109 then verified as
        contiguous substrings of the whitespace-normalised source - 109 of 109,
        and ZERO needed any relaxation (the audit retries every non-resolving
        fragment under terminal-punctuation swap, hyphenation heal, line-break
        heal and case fold). §1.2's BCP 14 recital is deliberately NOT an entry
        - bin/validate recounts these texts with stripping OFF, so quoting it
        would add 11 phantom keywords.
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: >-
        1 verbatim file and 4 derived, plus a README. RFC 9921 SHIPS NO GRAMMAR
        OF ANY KIND - `CDDL`, `ABNF`, `ASN.1`, `JSON Schema`, `schema` and
        `grammar` each occur ZERO times in its 1056 lines, and so do `canonical`
        and `deterministic`. source-renderings.txt is therefore the only
        unmarked file and carries the twelve places the document renders a
        structure by printing it - §6's Table 1, four ASN.1 value dumps, three
        CBOR diagnostic objects and four byte listings - as 12 regions with
        per-region line ranges and digests. Derived:
        cose-headers.derived.cddl (the two labels, the opaque value, both
        bucket constraints, and ALL THREE IMPRINT PREIMAGES WRITTEN OUT OCTET BY
        OCTET with the digest each reproduces);
        header-parameters.derived.yaml (§6's two registrations as data,
        REASSEMBLED and declared as such, because Table 1's rows are
        column-wrapped across five source lines each so NO CELL - not even
        `3161-ttc` - is a contiguous span of the source);
        timestamp-token.derived.outline.txt (what the 5453 octets actually
        contain, produced by DECODING Appendix A.1's hex with a DER parser
        written for this pass, with four internal consistency checks); and
        cose-headers.derived.schema.json with $id
        urn:library:rfc-9921:cose-headers.derived, over a JSON projection that
        is OURS since RFC 9921 defines none. Header markers and filenames agree
        on all five files. WHAT NO SCHEMA HERE CAN CHECK is stated in the
        README: the 5453 octets inside the byte string, because §6 gives Value
        Registry "-" and not even CDDL's `.cbor` operator could reach a payload
        that is not CBOR.
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: >-
        13 structures and 48 fields with octet-level layouts: both header
        parameters, the three COSE instantiations the document prints
        (COSE_Sign1 TTC, COSE_Sign1 CTT, COSE_Sign CTT), MessageImprint,
        TimeStampReq, TimeStampResp, TimeStampToken, TSTInfo, and ALL THREE
        MESSAGEIMPRINT PREIMAGES AS BYTE SEQUENCES with the digest each one
        reproduces. EVERY LAYOUT WAS PRODUCED BY DECODING - the CBOR with a
        codec and the DER with a parser, both written for this pass over
        hashlib alone, no CBOR/COSE/ASN.1/CMS/X.509/crypto library - and every
        octet count was re-derived by the generator at write time. The headline
        numbers live here: the 5453-octet token is 5456 octets as a header
        field and 98.09 per cent of a 5559-octet object whose payload is 20
        octets. `constrained_by` IS WIRED and NO ID WAS TYPED: each was
        resolved by script from a fragment of the requirement's own text, and
        a join audit printed every id beside the full text it resolved to. 29
        empty lists across 48 fields, and every one belongs to RFC 9052, RFC
        5652 or RFC 3161 - RFC 9921 constrains exactly four things about the
        wire. TWO FINDINGS THE FILE EXISTS TO MAKE LEGIBLE: the COSE_Sign CTT
        preimage is 77 octets for a 64-octet signature, 5 of the 13 extra being
        the per-signature UNPROTECTED map; and of the two maps the document
        prints with more than one key, A.1's protected map IS in RFC 8949
        §4.2.1 order and A.2's unprotected map is NOT.
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: >-
        APPLICABLE, and the boundary measured. 4 roles, 4 flows (CTT assembly,
        TTC assembly, CTT verification, TTC verification), 20 steps, and a
        Mermaid sequence diagram per flow in protocol.md. The verdict is
        measured rather than assumed: `TSA` occurs 24 times, `TimeStampReq` and
        `TimeStampResp` 2 each, `relying party` 3, `receiver` 1, `nonce` 3, and
        BOTH FIGURES DRAW A REQUEST CROSSING TO THE TSA AND A TIMESTAMP COMING
        BACK, while §4 puts a normative obligation on the receiving end. Every
        `message:` names a structure defined in messages.yaml. THE TWO
        VERIFICATION FLOWS ARE MARKED STEP BY STEP as `stated` or
        `reconstructed`, because §5.1 asserts that "each mode has its own
        separate verification algorithm" and THE DOCUMENT WRITES NEITHER DOWN -
        §4 is one sentence covering both. `error_paths` separates the 3 the
        document states from the 6 it leaves `undefined_by_source`, of which
        the sharpest is the failure branch of its own only machine-facing MUST:
        `reject`, `rejected`, `invalid`, `discard`, `abort` and `accept` each
        occur ZERO times in the source, so §4 requires the imprint to match and
        never says what happens when it does not. `absent` records seven things
        no diagram can show, including that the whole TSA side - transport,
        endpoint, discovery, requester authentication, trust distribution -
        belongs to RFC 3161, which this library does not hold.
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: >-
        APPLICABLE, and the lifecycle is the one the document never names. 5
        machines, 28 states, 23 transitions, 10 error states. The vocabulary is
        absent - `state`, `states`, `lifecycle`, `revoke`, `revoked`, `expire`,
        `expiry`, `expiration`, `rotate` and `step` each occur ZERO times -
        while `expired` occurs twice and `revocation` twice, and the document's
        stated purpose is "long-term signatures, i.e., signatures that can
        still be verified even after the signing certificate has expired". So
        M1 and M2 are the two ASSEMBLY ORDERS, which are the document's entire
        subject matter (§2: "two different modes of composing COSE protection
        and timestamping") and whose only difference is which of signature and
        token exists first; M3 and M4 are the two verification algorithms,
        every state and guard marked `reconstructed`; and M5 is the
        long-term-validity lifecycle inferred from §1.1 and §5.1, driven by the
        passage of time rather than by messages. THE FINDING THE FILE EXISTS TO
        MAKE LEGIBLE: in M3 the transition that CHOOSES THE MACHINE is guarded
        on an unauthenticated byte, and NO STATE ANYWHERE RECORDS THAT A
        TIMESTAMP WAS EXPECTED - so §5's conceded stripping attack leaves a
        well-formed object that verifies as an untimestamped one and nothing
        detects the deletion. M5 also carries a state the document has no
        vocabulary for and this pass measured: the fixture's own TSA signing
        certificate expired 2026-03-11, one month after publication.
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: >-
        15 vectors V-0001 to V-0015 (11 printed, 4 derived) plus two
        5453-octet .hex fixture files, each one line of lower-case hex that
        `xxd -r -p` turns back into DER. THE HEADLINE: THE DOCUMENT PRINTS FOUR
        DIGESTS, THREE REPRODUCE BYTE FOR BYTE AND ONE DOES NOT. §3.1.1's
        imprint reproduces from sha256(0x5840 || signature); §3.1.2's from
        sha256 of the 77-octet signatures array; Appendix A.1's from
        sha256('This is the content.'), matching both the printed request and
        the imprint embedded in the token. APPENDIX A.2's DOES NOT, and 207
        candidate preimages assembled from the document's own printed bytes
        were tried before saying so - including the head written
        non-canonically as 59 0040, 5a 00000040, 5b and indefinite-length.
        Also verified, needing no key: both tokens' CMS messageDigest attribute
        equals sha512 of their eContent, both signingCertificate ESSCertID
        hashes equal sha1 of the embedded signing certificate, and every length
        and offset in both tokens is consistent. WHAT COULD NOT BE VERIFIED IS
        STATED: neither COSE signature (the signer's public key is nowhere in
        the document and `kid` is the two octets '11') and neither token's RSA
        signature (the chain needs a trust anchor and RFC 5652's rules, and
        neither is here). Two derived censuses: where a CBOR head sits inside a
        third party's digest, and what the fixture's TSA actually is - Free
        TSA, www.freetsa.org, TSAPolicyId 1.2.3.4.1 (a placeholder arc), 75.26
        per cent of each token being its two-certificate chain, and a signing
        certificate that EXPIRED 2026-03-11. examples/README.md says plainly
        that these are not conformance vectors and which tests they are still
        good for.
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: >-
        The DEC-002 cut measured BOTH WAYS. The cost leg: 5453 octets of DER,
        75.26 per cent of it certificates, inside one `bstr` with Value
        Registry "-", and §4 making the COSE receiver run an ASN.1/CMS/X.509
        stack and a clock - scored as EVASION rather than violation, costing
        every DEC-002 option identically, which makes it a SCOPE question for
        DEC-003 rather than a point against option 5, following
        records/ietf/rfc-9360 §7.2 and adding that this record NESTS that cut
        (a CMS message carrying a certificate chain). The leg that cuts the
        other way: §3.1.1 puts the CBOR head 0x5840 inside a third party's
        digest preimage, which the COSE signature does not cover, so a legal
        re-encode destroys an external attestation silently - AN ARGUMENT FOR
        REQUIRING RFC 8949 §4.2.1 DETERMINISM ON THE EXPORT PATH, a clause no
        DEC-002 option states. R-M-12 argued from the VALUE side: the whole
        capability is two centrally allocated labels, and the 25 distinct OIDs
        inside the value are ITU-T's, NIST's, RSA's and IANA's, so relabelling
        changes nothing. R-O-05 with one adopt (two digests, two written
        answers to "does the wrapper count", and a verifier that hashes what it
        received) and one hazard (an UNAUTHENTICATED TYPE INDICATOR SELECTING A
        VERIFICATION ALGORITHM), plus a third leg the summary did not name: §4
        runs the DER parser on unauthenticated bytes BEFORE the signature
        result. All six canonical-encoding conditions scored, with (4) SPLIT
        DOWN THE MIDDLE BY ONE MECHANISM - the TTC indicator is inside the
        signed bytes and the CTT indicator is not - and the new finding that
        condition (4) and R-M-12 are in TENSION, because the only authenticated
        indicator COSE offers is one the registry owns. MD-3 MAPPED HEADER BY
        HEADER over nine carriers, then FIVE CUTS AGAINST IT, each naming the
        option it affects: (1) export-only costs option 5 a capability options
        2 and 4 have natively; (2) option 5's determinism clause does not reach
        the export path, a missing clause rather than another option's win; (3)
        the only authenticated type indicator is registry-owned, costing every
        option; (4) the DER payload evades every option equally, so the
        decision belongs to DEC-003 - and stated in option 5's favour, it is
        the option where the evasion is easiest to SEE; (5) the mode that
        proves the useful thing is the one the mapping must reject, which costs
        the FEATURE and points at rfc-9338. The inverted modes VERIFIED LEG BY
        LEG (8 legs, all confirmed, and shown to be FORCED by the dependency
        order rather than chosen), §1.1's uncited SCITT vocabulary with counts,
        11 source defects, 7 open questions and an adopt/adapt/reject table.
        25 quotations of RFC 9921, every one cut from the cache by script and
        verified contiguous with ZERO relaxations; 10 quotations of `mofn`
        documents, EVERY ONE MARKED UNVERIFIABLE FROM THIS REPOSITORY with the
        document named, following records/ietf/rfc-9741.
      reviewed_by: ""
  # NONE. All eight artifact kinds are present. The two that are commonly
