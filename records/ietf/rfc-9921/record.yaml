usefulness:
  verdict: useful
  reason: "Upgraded from marginal 2026-10-20. Read for the encoding question rather than for timestamps: §3.1/§3.2 put 5453 octets of ASN.1 DER (Appendix A.1) inside a bstr in a COSE header with no value registry (§6), which is the measured demonstration that a reduced-CBOR profile does not reduce what is inside a byte string. Also §3.1.1's imprint over the CBOR head bytes of the `signature` field, and §5/§5.1's unprotected mode discriminator."
  assessed: "2026-10-20"
