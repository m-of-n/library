  #     (`reject` 0, `invalid` 0, `accept` 0), which is recorded as
  #     `undefined_by_source` rather than smoothed over.
  #   state-machine - APPLICABLE. No lifecycle VOCABULARY (`state`, `states`,
  #     `lifecycle`, `expire`, `expiry`, `expiration`, `revoke`, `rotate` all
  #     0) and a real lifecycle: `expired` 2, `revocation` 2, and a document
  #     whose stated purpose is signatures that outlive their certificates. The
  #     two assembly ORDERS are the document's subject matter and the two
  #     verification algorithms are asserted by §5.1 and written down nowhere.
  not_applicable: []
