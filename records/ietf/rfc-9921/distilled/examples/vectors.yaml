record: rfc-9921
reviewed_by: ""
vector_count: 15
source_version: "RFC 9921 (February 2026), Standards Track"
source_digest: "ba1c4dbb7b4ea83f517418a9b8963085c0a8b5e5bea0c992089d215579b78f39"

# RFC 9921 PRINTS FOUR DIGESTS AND THREE OF THEM REPRODUCE.
#
# That is the headline of this file, and the fourth is the one in the mode the
# document's own Security Considerations warn about. §3.1.1, §3.1.2 and
# Appendix A.1 reproduce BYTE FOR BYTE from the document's own printed inputs.
# APPENDIX A.2's DOES NOT, and 207 candidate preimages assembled from the
# document's printed bytes were tried before saying so. See V-0011 and
# ../design-notes.md D-1.
#
# WHAT WAS DONE, AND WITH WHAT. A CBOR encoder/decoder (RFC 8949 §3 and
# §4.2.1) and a DER parser, both written for this pass over `hashlib` alone.
# NO CBOR, COSE, ASN.1, CMS, X.509 OR CRYPTOGRAPHY LIBRARY WAS USED, so a
# shared library bug cannot hide here. SHA-256 and SHA-512 are hashlib's.
#
# WHAT COULD NOT BE DONE, STATED PLAINLY. Neither COSE signature can be
# verified and neither timestamp token's RSA signature can be verified from
# this document:
#   - the COSE signer's public key appears NOWHERE in RFC 9921. `kid` is the
#     two ASCII octets '11' and no COSE_Key is printed. The two signature
#     values (A.1's f5f0f279..., A.2's 8eb33e4c...) are not in the COSE
#     example corpus this library holds either.
#   - the TSA's public key IS in the token (certificates[0]), but verifying
#     the chain needs a trust anchor and RFC 5652's rules, and RFC 5652 and
#     RFC 3161 are NOT IN THIS LIBRARY.
# What WAS verified cryptographically is everything that needs no key: four
# message digests, two CMS messageDigest attributes, two ESSCertID cert
# hashes, and every length and offset in both tokens.
#
# PROVENANCE CONVENTION, as rfc-9964's and rfc-8392's vectors use it:
#   source: printed - every byte of every value in the vector appears in RFC
#                     9921 itself. `reproduced` says what this pass recomputed
#                     from those bytes and whether it matched.
#   source: derived - every byte is printed by the source, but the ASSERTION
#                     the vector makes is this extraction's.
# NOTHING HERE IS COMPUTED AND PRESENTED AS PRINTED.
#
# `locator` gives the section AND the exact line range in .cache/rfc-9921.txt,
# plus `region_sha256`, the sha256 of that run of lines joined by "\n" with no
# trailing newline, so any value here can be re-cut from the source without
# trusting this file. The RFC hard-wraps its hex for display and the only
# transformation applied is joining those lines; nothing else is altered.
#
# THE TWO 5453-OCTET TOKENS ARE IN SEPARATE FILES so this YAML stays readable
# and so a harness can use them directly:
#   a1-ttc-timestamp-token.hex  sha256(file) = a512c078ccfb7a42bf101e9cec863bbd1a15a80ec4ff32635188ce1e0cd2f274
#                               sha256(bytes) = 025648cf7ed706fcc312baba119d3394ace8f80eb7eaaf6f58e1cb29653fd555
#   a2-ctt-timestamp-token.hex  sha256(file) = 3bac4bf824fb94cd037b76eb2957376026cd7c7d1d4ba2cf32c4228cd4874ae6
#                               sha256(bytes) = 5e1e0ade11fb869f1e9358c7b5b972edf31e3a9741d769c0fbe99936485f92bd
# Each file is one line of lower-case hex plus a newline: `xxd -r -p` gives
# the DER.
#
# NOT A CONFORMANCE FIXTURE. Both tokens come from a public demonstration TSA
# and the signing certificate expired on 2026-03-11. V-0015 measures it; the
# README says what it means.

vectors:

  - id: V-0001
    name: "§3.1.1 sample COSE_Sign1 - the CTT input object"
    locator: "§3.1.1, source lines 283-298"
    region_sha256: "ffb0fa72a45568e35cd53c9525494e46b1c8fa569da8efb0d7948714af8ef733"
    source: printed
    notation: "CBOR diagnostic notation (RFC 8949 Appendix G)"
    fields:
      protected: "h'a10126' = {1: -7}, alg ECDSA 256"
      unprotected: "{4: '11'}, kid"
      payload: "'This is the content.' - 20 octets"
      signature: "h'8eb33e4c...45cacb36' - 64 octets"
    reproduced:
      signature_octets: 64
      payload_octets: 20
      note: >-
        The same 64-octet signature value is printed three times in the
        document - §3.1.1 (lines 294-296), A.2's starting object (778-780) and
        A.2's final object (1009-1011) - AND THE THREE PRINTINGS WRAP AT
        DIFFERENT COLUMNS. All three were cut and compared: identical.
    constrained_by:
      - rfc-9921#R-0047

  - id: V-0002
    name: "§3.1.1 CTT MessageImprint - REPRODUCED, head included"
