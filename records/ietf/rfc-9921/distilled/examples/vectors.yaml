      key bytes, where 04 precedes 19010e. Nothing in RFC 9921 requires either
      order; `canonical` and `deterministic` occur zero times. The CTT object
      also grows by 5459 octets over the object it starts from, all of it in a
      bucket nothing signs.
    constrained_by:
      - rfc-9921#R-0109

  - id: V-0014
    name: "Derived census: where a CBOR head sits inside a third party's digest"
    locator: "§3.1.1, §3.1.2, §3.2 (compared)"
    source: derived
    assertion: "which octets each of the three MessageImprint preimages commits to"
    measured:
      ctt_cose_sign1:
        preimage_octets: 66
        cbor_head_octets: 2
        head_in_preimage: true
        covered_by_the_cose_signature: false
      ctt_cose_sign:
        preimage_octets: 77
        cbor_head_octets: 7
        unprotected_header_octets: 5
        head_in_preimage: true
        covered_by_the_cose_signature: false
      ttc:
        preimage_octets: 20
        cbor_head_octets: 0
        head_in_preimage: false
        covered_by_the_cose_signature: true
    note: >-
      THREE PREIMAGES, THREE DIFFERENT ANSWERS TO "DOES THE WRAPPER COUNT". In
      the two CTT cases a CBOR head is inside a digest that a third party
      signs, and in neither case does the COSE signature cover that head: a
      COSE signature is computed over a Sig_structure built from the protected
      bucket, external_aad and the payload (RFC 9052 §4.4), so the encoding of
      the `signature` field itself and of the per-signature unprotected bucket
      are outside it. CONSEQUENCE, derived: re-encode the object with a legal
      but non-smallest head - 59 0040 instead of 58 40 - and the COSE signature
      still verifies while the CTT timestamp no longer matches. The TTC
      preimage has no such exposure: payload content octets do not move when
      the envelope is re-encoded.
