  - id: V-0011
    name: "Appendix A.2 TimeStampReq - NOT REPRODUCIBLE. The defect."
    locator: "Appendix A.2, source lines 784-799"
    region_sha256: "d753f79acecb58379a98f6f546277765a29ffa26a8e2c7bee8ebbce4cf0a0660"
    source: printed
    structure: "SEQUENCE { INTEGER 1, MessageImprint, BOOLEAN TRUE }"
    printed_imprint: "DD9471EFE743C4051335DF8F6D2882F3BADC387700F7ED3F7091672A3EEAF7C8"
    expected_under_the_document_own_rule: "44c2419d131d53d55584b5dd33b788c24e551c6d44b1afc8b2b85e6954763b4e"
    reproduced:
      match: false
      candidate_preimages_tried: 207
      candidates_matching: 0
      note: >-
        THE APPENDIX A.2 FIXTURE IS NOT REPRODUCIBLE AND THE §3.1.1 WORKED
        EXAMPLE ON THE SAME SIGNATURE IS. A.2 says "the CBOR-encoded signature
        field is hashed using SHA-256 to create the following TimeStampReq
        object"; §3.1.1 settles what that means ("including the heading bytes
        0x5840") and its own printed imprint reproduces exactly. For A.2's
        signature - verified identical to §3.1.1's - the rule gives
        44C2419D..., and the document prints DD9471EF... 207 candidate
        preimages assembled from the document's own printed bytes were tried:
        the bare signature, the head-prefixed signature, both other printed
        signatures, the payload with and without its head, the protected
        bucket, the unprotected map in both key orders, the whole object tagged
        and untagged, a Sig_structure in three context strings, every pairwise
        concatenation of the small values, and the head written
        non-canonically as 59 0040, 5a 00000040, 5b and indefinite-length.
        NONE produces DD9471EF.... The imprint is also what the TSTInfo inside
        A.2's own token commits to (V-0012), so the token was obtained for an
        input this document does not print.
      errata: >-
        UNVERIFIABLE FROM THIS REPOSITORY, flagged by pass 2 (2026-10-21), and
        separable from everything else in this vector. The errata record below
        was read from the network by pass 1 and nothing in this worktree can
        re-check it: `errata.rfc-editor.org` is not reachable from a validation
        run, no errata listing is cached beside the source, and the identifier,
        status, reporter, date, proposed value and the RFC 3161 control counts
        are all second-hand here. Treat it as a citation to re-check, the same
        way `design-notes.md` §0 treats quotations of `mofn` documents. WHAT IS
        VERIFIED INDEPENDENTLY, AND NEEDS NO NETWORK, is the mismatch itself:
        the printed imprint does not reproduce from any of 207 candidate
        preimages, and `44C2419D...` does reproduce under §3.1.1's own rule.
        The claim recorded by pass 1:
        RFC Errata ID 9177, status REPORTED (not verified), type Technical,
        section A.2, reported by Florent Morselli on 2026-09-13, says the same
        thing and proposes 44 C2 41 9D ... as the correct value; the errata
        notes attribute the printed value to a generator script hashing an
        error message after a folded line truncated the signature. FETCHED
        2026-10-20 from errata.rfc-editor.org/rfc9921. POSITIVE CONTROL for
        that lookup: the same endpoint returns 5 errata for RFC 3161 (1879,
        2931, 2932 Verified; 844 Held for Document Update; 4042 Rejected), so
        an empty result would have been a result and not a silent failure. The
        erratum's CAUSE is reported, not verified here; what this pass verifies
        independently is only that the printed imprint does not match and that
        44C2419D... does.
    constrained_by:
      - rfc-9921#R-0106
      - rfc-9921#R-0042

