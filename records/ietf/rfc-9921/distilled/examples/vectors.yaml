  - id: V-0013
    name: "Appendix A.2 final COSE_Sign1 - and the document's only non-deterministic map"
    locator: "Appendix A.2, source lines 841-1014"
    region_sha256: "344994626eab08ed5a6beed69ad9474a17ec2ef1a430e4995a3804bc92b38b6d"
    source: derived
    assertion: "the octet budget and the map order of the CTT object"
    measured:
      tst_octets: 5453
      unprotected_map_octets: 5464
      whole_tagged_object_octets: 5557
      protected_field_octets: 4
      payload_field_octets: 21
      signature_field_octets: 66
      printed_key_order: [270, 4]
      rfc8949_4_2_1_key_order: [4, 270]
      unprotected_map_in_rfc8949_4_2_1_order: false
      growth_over_the_starting_object: 5459
    note: >-
      THE DOCUMENT PRINTS TWO MAPS WITH MORE THAN ONE KEY AND ONLY ONE IS IN
      §4.2.1 ORDER. A.1's protected map is (01, 19010d) - sorted. A.2's
