    region_sha256: "d42e7a585db207cf9a4bd0a44117ad7eeae19b3e11532d35857d4e57362667cf"
    source: printed
    preimage_hex: "58408eb33e4ca31d1c465ab05aac34cc6b23d58fef5c083106c4d25a91aef0b0117e2af9a291aa32e14ab834dc56ed2a223444547e01f11d3b0916e5a4c345cacb36"
    preimage_octets: 66
    expected_sha256: "44c2419d131d53d55584b5dd33b788c24e551c6d44b1afc8b2b85e6954763b4e"
    printed_imprint: "44C2419D131D53D55584B5DD33B788C24E551C6D44B1AFC8B2B85E6954763B4E"
    reproduced:
      match: true
      note: >-
        sha256(0x58 0x40 || signature) EQUALS the printed MessageImprint byte
        for byte. This is the document's own claim and it holds: the CBOR HEAD
        IS IN THE PREIMAGE. For contrast, sha256 of the bare 64 octets is
        14da253852f84a2baaca99e4e8975c0c9af2ab617c01a636efe8d056832337e7,
        which appears nowhere in the document.
    constrained_by:
