reconciliation: >-
  THE COUNTS AGREE AT 8, and a reconciliation is written anyway, because 109
  entries against 8 keywords needs explaining and because the places the 8 are
  NOT are the finding.

  WHERE THE 8 ARE, by source line. L256 (MUST, 3.1 - the 3161-ctt parameter is
  an UNPROTECTED header parameter and must be used for CTT), L262 (MUST, 3.1 -
  the CTT MessageImprint is the hash of the CBOR-encoded signature or
  signatures field), L270 (SHOULD, 3.1 - imprint algorithm should equal the
  COSE signing algorithm), L383 (MUST, 3.2 - the 3161-ttc parameter is a
  PROTECTED header parameter and must be used for TTC), L389 (MUST, 3.2 - the
  TTC MessageImprint is the hash of the payload), L394 (SHOULD, 3.2 - the same
  algorithm rule stated in the opposite direction), L411 (MUST, 4 - the
  receiver must check that the embedded MessageImprint matches a hash of the
  payload or the signature field(s)), L468 (MUST, 5.1 - implementers must
  differentiate the two timestamp semantics).

  SO SIX OF THE EIGHT ARE IN 3.1 AND 3.2 AND THEY BIND THREE THINGS ONLY: which
  bucket each label lives in, what each mode hashes, and that the two hash
  algorithms should agree. One binds the receiver (4) and one binds a human
  (5.1, "Implementers MUST clearly differentiate"). NOT ONE is in 6, so neither
  registration is normatively stated anywhere but a table; not one constrains
  the CONTENTS of the byte string either parameter carries; and not one requires
  deterministic encoding, a value schema, TSA trust establishment, or integrity
  protection of the unprotected bucket.

  NINE LOWER-CASE FORCE WORDS, each an entry of its own with the phrase named in
  `field` and `verb: none`, never promoted: 1.1 "care must be taken" (R-0006),
  1.1 "the TST must be included in the signed statement" (R-0017), 5 "must be
  able to report compromised keys promptly" (R-0071), 5 "should be integrity
  protected during transit and at rest" (R-0078), 5 "would need to be armored"
  (R-0080), 5 "must be taken into account" (R-0082), 5.1 "An implementation must
  ensure" (R-0084), 5.1 "Validators must not interpret" (R-0088) and 5.1 "should
  rely exclusively" (R-0089). Under 1.2's "when, and only when, they appear in
  all capitals" not one of them binds anybody. TWO OF THEM ARE THE DOCUMENT'S
  ANSWERS TO ITS OWN STATED ATTACKS: R-0078 answers the conceded CTT stripping
  attack and R-0017 is the entire reason the TTC mode exists.

  WHAT WAS COUNTED INSTEAD: every sentence of the Abstract and 1-5.1 that
  states a fact an implementer must act on; both 2.2 construction bullets
  separately from their lead-in; the two 3.1 imprint alternatives separately
  from the MUST that carries them; the four halves of the two sentences that a
  displayed byte block interrupts in 3.1.1 and 3.1.2, as four entries that are
  never welded; the 6 Table 1 column header and both registration rows as the
  table's own column-wrapped lines; the table caption; all six normative
  references; the two figure lines that name the result object; and every
  Appendix A step that states what was hashed, what was returned and which
  bucket the token went into.

  WHAT WAS DELIBERATELY NOT COUNTED: 1.2's BCP 14 recital at source lines
  143-147. It recites eleven keywords and constrains nothing, and bin/validate
  recounts these texts with boilerplate stripping OFF, so quoting it would add
  11 phantom keywords and make this extraction read 19 against a source of 8.
  It is quoted in normative.md, which nothing counts. Also not counted: the
  Acknowledgments and Contributors sections (attribution, not obligation - the
  one fact worth keeping from them is in design-notes.md), and the running
  prose of Appendix A's ASN.1 dumps, which are reproduced as fixtures in
  examples/vectors.yaml rather than as requirements.

  TEXT PROVENANCE AND NORMALISATION, DECLARED. `text` is the source's own
  wording with whitespace normalised: line breaks and the RFC's double sentence
  spacing become single spaces. NOTHING WAS RETYPED - every one of the 109
  texts was cut from .cache/rfc-9921.txt by script, located by anchor in the
  whitespace-normalised source, and `source_lines` was then READ BACK off a
  per-character line map rather than typed, so a hand-written line number
  cannot put a wrong range in this file. All 109 were then verified as
  contiguous substrings of the whitespace-normalised source: 109 of 109, zero
  failures, and ZERO under any relaxation - the audit retries every
  non-resolving fragment under terminal-punctuation swap, hyphenation heal,
  line-break heal and case fold, and none was needed.

  NOTHING IS SPLICED. Two sentences in this document are interrupted by a
  displayed byte block (3.1.1 at source lines 300-309 and 3.1.2 at 351-367).
  Each is quoted as TWO entries, one per side of the block - R-0048/R-0049 and
  R-0052/R-0053 - with the interruption declared in the `note` of each. The
  block itself is in normative.md with its own digest. 5.1's last sentence
  carries two lower-case obligations and is quoted as two adjacent spans
  (R-0088, R-0089), both contiguous.

  PAGINATION: none. This rendering of RFC 9921 has 1056 newline-delimited
  lines, ZERO form feeds and no running headers or footers, so no quoted range
  can contain page decoration. Line 1 carries a UTF-8 BOM. Built with
  split("\n"); splitlines() would be safe here but is not used, for consistency
  with the rest of the library.
reviewed_by: ""
note: >-
  Ids are stable and never reused. Cite as rfc-9921#R-NNNN.

  Pass 1 of the FX-1 extraction (extract), effort max, 2026-10-20. Read only
  .cache/rfc-9921.txt - never summary.md, never record.yaml and never another
  record's artifacts.

  `verb: none` marks an entry whose source sentence carries no capitalised BCP
  14 keyword; `field` then names the phrase that carries the force instead.
  `actor` is who must comply, in the document's own vocabulary where it has one
  ("implementers", "implementation", "receiver", "relying party", "validators",
  "the document signer", "the issuer", "IANA") and the nearest role otherwise.
  `kind: stated` is used for the 8 BCP 14 statements and for the three
  non-keyword spans whose force comes directly from an adjacent keyword in the
  same sentence (R-0042, R-0043, R-0058); everything else is `inferred` and
  flagged as such.

  THIS DOCUMENT DEFINES A TWO-PARTY EXCHANGE AND NO NUMBERED PROCEDURE.
  Whole-word and case-insensitive over all 1056 lines: `step` 0, `steps` 0,
  `error` 0, `fail` 0, `state` 0, `lifecycle` 0, `exchange` 0, `handshake` 0,
  `negotiate` 0, `verifier` 0, `validator` 0 (`validators` 1). But `TSA` occurs
  24 times, `relying party` 3, `receiver` 1, `nonce` 3, and both figures draw a
  request crossing from the Signer to the TSA and a timestamp crossing back. So
  `protocol.yaml` IS applicable and models that exchange; see its own note for
  what is and is not there.

  AND IT SHIPS NO GRAMMAR AT ALL. `CDDL`, `ABNF`, `ASN.1`, `JSON Schema`,
  `schema` and `grammar` each occur ZERO times in the 1056-line source, and so
  do `canonical` and `deterministic`. Everything in distilled/schema/ is either
  a verbatim capture of the document's own printed renderings or carries
  `.derived.` in its filename.

