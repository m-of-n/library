  doi: 10.17487/RFC9679
  url: https://www.rfc-editor.org/rfc/rfc9679.html
content:
  url: https://www.rfc-editor.org/rfc/rfc9679.txt
  sha256: "f6b460e38ba1496bbba7d1430175f6398af104d6b8803f7a4ea059af5d3fa29d"
  retrieved: "2026-09-22"
