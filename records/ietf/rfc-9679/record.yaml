distillation:
  standard: "FX-1"
  # NO `profile` YET. Pass 1 (extract) is complete across the artifact set;
  # verify and cross-check have NOT run, and an unfinished extraction is
  # neither `full` nor `partial` (docs/extraction.md).
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "93 verbatim prose runs and 19 fenced blocks (byte-exact source line runs, three-space RFC margin retained), §2-§8 in source order; §1, §9, Acknowledgements, Authors' Addresses and front matter dropped and stated as dropped. 180 mechanical checks over texts and locators, 0 failures; a dropped-statement sweep over 123 sentence units in §3-§8 found 0 genuinely dropped"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "68 entries R-0001 to R-0068 in source order, no gaps: 66 stated, 2 inferred (the exclusion rule and the map-key order, both declaring that no BCP 14 keyword backs them). Only 13 entries carry a BCP 14 verb and 55 are verb: none, because the binding content is stated in lowercase - the three procedure steps, all five required-parameter lists, the exclusion rule, the ordering statements and the registration values. source and extracted keyword counts both 13; the §2 BCP 14 boilerplate is deliberately not an entry, since quoting it would have inflated the extracted count to 24 for no obligation gained. 11 entries are testable: no, each with a reason"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "3 derived and 0 verbatim - a 6-rule CDDL of the thumbprint input, the §3 procedure and §4 label table as JSON data, and a JSON Schema 2020-12 with five oneOf branches for §4.1-§4.5. The source ships NO formal grammar of any kind, so every formal artifact here is ours. CDDL checked for closure and for collision with RFC 8610 prelude names (the RFC 8785 defect); no cddl or jsonschema tool is installed here, so this is closure and collision checking, not a parse"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "9 structures, 29 fields, every field carrying a non-empty constrained_by; 47 of the 68 requirements wired. The 21 left unwired are enumerated with a reason each so an adversarial reader can falsify the claim cheaply"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "13 vectors V-0001 to V-0013. EVERY printed value in the document reproduces, recomputed with a CBOR encoder written by hand against RFC 8949 §4.2.1 plus hashlib and no CBOR or COSE library: both §6 encodings, the SHA-256 thumbprint, the §6 kid, the §5.6 ckt, the §5.7 base64url form and the full URN. 7 of the 13 are marked source: constructed with a constructed_why, because RFC 9679 prints exactly one complete computation and every other printed value descends from it"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the complete hashed set per key type; an ADAPT verdict on RFC 9679 as ARCH-0001 KeyId with three blockers, two of them ours rather than the RFC's; the alg-inside-the-digest hazard adjudicated to §4.6 -> RFC 9964 §3 -> §5.1 with the string alg verified absent from the whole document; and nine named cuts against MD-3, including §5.5 eliminating DEC-002 option 4 on a ground DEC-002 never listed"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "RFC 9679 defines a computation, a value, one CWT claim member and one URI. §5.6 NAMES three roles - issuer, presenter, recipient - but defines no message, no ordering and no error path; that flow is RFC 8747's, and the key-resolution step is expressly assumed away: \"This approach assumes that the recipient is able to obtain the identified COSE Key using the thumbprint contained in the \"ckt\" member.\" Modelling it here would be extracting a different document. The only other multi-party sentence is a precondition rather than an exchange: \"it is crucial that they know and use the same hash function to ensure consistent results.\""
    - kind: state-machine
      reason: "No lifecycle. A thumbprint is a pure function of a key: \"Including only the required parameters ensures that the COSE Key Thumbprint remains consistent for a given key, regardless of any additional attributes.\" No registration, issuance, rotation, revocation or expiry appears anywhere in the document, and there is no state a thumbprint can be in. The nearest thing is a one-shot validity predicate on the URI form - unknown hash identifiers \"are not considered valid, and applications MUST detect and handle this error\" - which is an accept/reject test, not a lifecycle."
  passes:
    - pass: extract
      by: "claude-opus-5 (2 parallel agents, one per artifact group)"
      effort: max
      date: "2026-10-18"
      note: "each agent read only .cache/rfc-9679.txt. The two disagreed about whether RFC 9679 itself places `alg` in the digest; the orchestrator settled it against the source (the string `alg` occurs zero times in the document, as does `AKP`) rather than between the agents, and the finding is recorded in design-notes.md"
