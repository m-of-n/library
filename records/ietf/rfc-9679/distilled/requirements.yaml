schema: "library-requirements/v1"
record: rfc-9679
source_version: "RFC 9679"
source_digest: "f6b460e38ba1496bbba7d1430175f6398af104d6b8803f7a4ea059af5d3fa29d"
source_keyword_count: 13        # bin/bcp14-count .cache/rfc-9679.txt
extracted_keyword_count: 13     # recomputed and checked by bin/validate
reconciliation: "Counts agree: all 13 BCP 14 occurrences in the source body (10 MUST, 2 MUST NOT, 1 MAY) are carried by the entries below, and no entry carries a keyword the source does not. Four things a reader of this file alone cannot see. (1) Three source sentences carry two keywords each and are split so that each half is separately testable: R-0005/R-0006 (SHA-256 supported; other algorithms), R-0008/R-0009 (kty present; kty as the registry integer) and - not a split but the same shape - R-0050/R-0051, which the source already prints as two sentences. Each half keeps its own keyword, so splitting does not change the total. (2) The 13 occurrences sit in just 11 source sentences across 5 sections, while 55 of the 68 entries here carry verb none: this document states almost all of what an implementer must obey - which parameters enter the hash, their labels, their data types, their order, the exclusion of everything optional - in lowercase, and extracting only the keyword-bearing sentences would have captured none of the byte-level content. (3) The Section 2 BCP 14 boilerplate, which quotes all eleven keywords, is deliberately not an entry: bin/validate counts keywords across entry texts without stripping boilerplate, so quoting it here would have inflated the extracted count to 24 for no obligation gained. It is reproduced verbatim in distilled/normative.md instead. (4) Two entries are kind inferred (R-0011 and R-0056) and one more statement in Section 5.7 is verbatim only after the removal of the source's own | quote-margin markers (R-0053); all three say so in their own fields, and none carries a BCP 14 keyword."
reviewed_by: ""
note: >
  Ids are stable and never reused. Cite as rfc-9679#R-NNNN.
  Entries are in source order by locator. Every text of kind stated is one
  contiguous run of the source with the RFC line wrapping undone: a line break
  and the indentation that follows it become a single space, and the RFC two
  spaces after a sentence-ending period are kept where a quoted run spans one.
  No two non-adjacent passages are ever spliced into one entry.
  Three exceptions, each deliberate and each named on the entry that uses it.
  (a) Where the RFC breaks an already-hyphenated word across lines it is
  rejoined with NO space, because "low- entropy" is not a word the source
  contains (R-0062). (b) In Section 4.1 to 4.5 the leading "*  " bullet marker
  is not reproduced; the quoted run is the bullet content. (c) In the one block
  the RFC prints behind a left margin of "|" quote markers - the RFC 7515
  definition of base64url at Section 5.7 - the markers and the two spaces after
  each are removed as margin (R-0053). The block appears with its markers in
  distilled/normative.md.
  Entries with verb none carry binding content in lowercase and no BCP 14
  keyword. Entries with kind inferred are NOT verbatim source text, carry no
  keyword, and say in their own fields what they are derived from; they exist
  because the two facts a key identifier depends on - which labels are excluded,
  and in what order the admitted ones are encoded - are the two this document
  never states outright.

requirements:
  - id: "rfc-9679#R-0001"
    object: "COSE Key Thumbprint"
    field: "that the computation is the three-step procedure that follows, and no other"
    verb: MUST
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§3"
    text: "The thumbprint of a COSE Key MUST be computed as follows:"
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0002"
    object: "thumbprint input"
    field: "step 1 - what is constructed before anything is hashed"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§3"
    text: "Construct a COSE_Key structure (see Section 7 of [RFC9052]) containing only the required parameters representing the key as described in Section 4 of this document."
    kind: stated
    testable: yes
    note: "Step 1 of the procedure R-0001 makes mandatory. Carries no keyword of its own; the MUST is on the procedure as a whole."
    status: active
  - id: "rfc-9679#R-0003"
    object: "thumbprint input"
    field: "step 2 - the encoding applied to the structure from step 1"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§3"
    text: "Apply the deterministic encoding described in Section 4.2.1 of [RFC8949] to the representation constructed in step 1."
    kind: stated
    testable: yes
    note: "Step 2. The whole of the byte-level behaviour is delegated to RFC 8949 4.2.1 and is not restated here: preferred serialization of every integer and length, definite-length encoding, and map keys sorted bytewise-lexicographically by their encoded form."
    status: active
  - id: "rfc-9679#R-0004"
    object: "COSE Key Thumbprint"
    field: "step 3 - what is hashed and with what"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§3"
    text: "Hash the bytes produced in step 2 with a cryptographic hash function H."
    kind: stated
    testable: yes
    note: "Step 3. H is a parameter of the procedure; this document never fixes it, and the thumbprint value carries no identifier of it - see R-0039, R-0040 and R-0049."
    status: active
  - id: "rfc-9679#R-0005"
    object: "hash function H"
    field: "the one algorithm every implementation has to have"
    verb: MUST
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§3"
    text: "The SHA-256 hash algorithm MUST be supported"
    kind: stated
    testable: yes
    note: "First clause of a two-clause sentence; R-0006 is the second. Split so each half is separately testable. Each half keeps its own keyword, so the split does not change the keyword total."
    status: active
  - id: "rfc-9679#R-0006"
    object: "hash function H"
    field: "whether an implementation may offer algorithms besides SHA-256"
    verb: MAY
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§3"
    text: "other algorithms MAY be supported."
    kind: stated
    testable: yes
    note: "Second clause of the sentence split at R-0005."
    status: active
  - id: "rfc-9679#R-0007"
    object: "thumbprint input"
    field: "the admission rule for every key parameter"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4"
    text: "Only the required parameters of a key's representation are used when computing its COSE Key Thumbprint value."
    kind: stated
    testable: yes
    note: "The exclusion rule. Everything optional - kid, alg, key_ops, Base IV, and any parameter a profile adds - is outside the hash input by this sentence alone."
    status: active
  - id: "rfc-9679#R-0008"
    object: "kty parameter"
    field: "presence, for every key type without exception"
    verb: MUST
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4"
    text: 'The "kty" (label: 1) element MUST be present for all key types'
    kind: stated
    testable: yes
    note: "First clause of a two-clause sentence; R-0009 is the second. Split so each half is separately testable."
    status: active
  - id: "rfc-9679#R-0009"
    object: "kty parameter"
    field: "which encoding of the key type goes in"
    verb: MUST
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4"
    text: 'the integer value specified in the IANA "COSE Key Types" registry MUST be used.'
    kind: stated
    testable: yes
    note: "Second clause of the sentence split at R-0008."
    status: active
  - id: "rfc-9679#R-0010"
    object: "kty parameter"
    field: "the data type that is excluded"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4"
    text: 'The tstr data type is not used with the "kty" element.'
    kind: stated
    testable: yes
    note: "RFC 9052 7.1 admits tstr for kty; for thumbprint purposes this sentence removes it. Stated in lowercase, and it is an interoperability-critical exclusion: a tstr kty would hash to different bytes than the int form of the same key type."
    status: active
  - id: "rfc-9679#R-0011"
    object: "thumbprint input"
    field: "the labels this document never admits into the hash input"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4"
    text: "The parameters alg (label 3), key_ops (label 4) and Base IV (label 5) of RFC 9052 7.1 appear in no required-parameter list in Section 4 of this document and therefore never enter a thumbprint input; kid (label 2) is excluded by the same rule and is named as excluded at Section 7."
    kind: inferred
    testable: yes
    note: "NOT VERBATIM - composed by this extraction. No BCP 14 keyword backs it, and the document never writes the word alg at all. It follows from R-0007 (only required parameters are used) together with the five lists at 4.1-4.5, none of which names labels 2, 3, 4 or 5. Recorded because it is the whole of the stability question for a key identifier: see distilled/design-notes.md."
    status: active
  - id: "rfc-9679#R-0012"
    object: "OKP thumbprint input"
    field: "the required-parameter set for key type OKP"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.1"
    text: "The required parameters for elliptic curve public keys that use the Octet Key Pair (OKP) key type, such as X25519, are:"
    kind: stated
    testable: yes
    note: "Lead-in to the list reproduced at R-0013 to R-0015. The list is three items: no d (label -4), so an OKP private key and its public key have the same thumbprint."
    status: active
  - id: "rfc-9679#R-0013"
    object: "OKP thumbprint input"
    field: "the kty entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.1"
    text: '"kty" (label: 1, data type: int, value: 1)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0014"
    object: "OKP thumbprint input"
    field: "the crv entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.1"
    text: '"crv" (label: -1, value: int)'
    kind: stated
    testable: yes
    note: "The source writes value: int here where 4.2 to 4.5 write data type: int. Reproduced as printed; see the defect note in distilled/schema/README.md."
    status: active
  - id: "rfc-9679#R-0015"
    object: "OKP thumbprint input"
    field: "the x entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.1"
    text: '"x" (label: -2, value: bstr)'
    kind: stated
    testable: yes
    note: "Again value: where data type: is meant."
    status: active
  - id: "rfc-9679#R-0016"
    object: "EC2 thumbprint input"
    field: "the required-parameter set for key type EC2"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.2"
    text: "The required parameters for elliptic curve public keys that use the EC2 key type, such as NIST P-256, are:"
    kind: stated
    testable: yes
    note: "Lead-in to the list reproduced at R-0017 to R-0020. No d (label -4), so an EC2 private key and its public key have the same thumbprint."
    status: active
  - id: "rfc-9679#R-0017"
    object: "EC2 thumbprint input"
    field: "the kty entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.2"
    text: '"kty" (label: 1, data type: int, value: 2)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0018"
    object: "EC2 thumbprint input"
    field: "the crv entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.2"
    text: '"crv" (label: -1, data type: int)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0019"
    object: "EC2 thumbprint input"
    field: "the x entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.2"
    text: '"x" (label: -2, data type: bstr)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0020"
    object: "EC2 thumbprint input"
    field: "the y entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.2"
    text: '"y" (label: -3, data type: bstr)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0021"
    object: "EC2 point representation"
    field: "what RFC 9052 permits, as background to the constraint that follows"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.2"
    text: "Note: [RFC9052] supports both compressed and uncompressed point representations."
    kind: stated
    testable: no
    testable_reason: "A statement about another document, not an obligation on an implementation. It is the premise of R-0022 and R-0024."
    status: active
  - id: "rfc-9679#R-0022"
    object: "EC2 point representation"
    field: "the one representation admitted for interoperability"
    verb: MUST
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.2"
    text: "For interoperability, implementations adhering to this specification MUST use the uncompressed point representation."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0023"
    object: "y parameter"
    field: "the resulting data type of the y-coordinate"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.2"
    text: "Therefore, the y-coordinate is expressed as a bstr."
    kind: stated
    testable: yes
    note: "Consequence of R-0022. RFC 9053 7.1 also admits bool for y (sign bit of a compressed point); that form cannot appear in a thumbprint input."
    status: active
  - id: "rfc-9679#R-0024"
    object: "EC2 point representation"
    field: "what a holder of a compressed point has to do first"
    verb: MUST
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.2"
    text: "If an implementation uses the compressed point representation, it MUST first convert it to the uncompressed form for the purpose of thumbprint calculation."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0025"
    object: "RSA thumbprint input"
    field: "the required-parameter set for key type RSA"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.3"
    text: "The required parameters for an RSA public key are:"
    kind: stated
    testable: yes
    note: "Lead-in to the list reproduced at R-0026 to R-0028. Public parameters only: none of d, p, q, dP, dQ, qInv or other (labels -3 to -9 of RFC 8230) enters."
    status: active
  - id: "rfc-9679#R-0026"
    object: "RSA thumbprint input"
    field: "the kty entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.3"
    text: '"kty" (label: 1, data type: int, value: 3)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0027"
    object: "RSA thumbprint input"
    field: "the n entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.3"
    text: '"n" (label: -1, data type: bstr)'
    kind: stated
    testable: yes
    note: "This document states no normalisation for the modulus bytes - no leading-zero rule, no fixed width. Two encodings of one modulus therefore give two thumbprints. See the defect note in distilled/schema/README.md."
    status: active
  - id: "rfc-9679#R-0028"
    object: "RSA thumbprint input"
    field: "the e entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.3"
    text: '"e" (label: -2, data type: bstr)'
    kind: stated
    testable: yes
    note: "Same gap as R-0027: the exponent 65537 as h61 01 00 01 and as h00 01 00 01 are different bstrs and hash differently."
    status: active
  - id: "rfc-9679#R-0029"
    object: "symmetric thumbprint input"
    field: "the required-parameter set for key type Symmetric"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.4"
    text: "The required parameters for a symmetric key are:"
    kind: stated
    testable: yes
    note: "Lead-in to the list reproduced at R-0030 and R-0031. The one required parameter besides kty is the secret itself, which is why Section 7 constrains this case so heavily."
    status: active
  - id: "rfc-9679#R-0030"
    object: "symmetric thumbprint input"
    field: "the kty entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.4"
    text: '"kty" (label: 1, data type: int, value: 4)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0031"
    object: "symmetric thumbprint input"
    field: "the k entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.4"
    text: '"k" (label: -1, data type: bstr)'
    kind: stated
    testable: yes
    note: "k is the key material. A thumbprint of a Symmetric key is a digest of the secret, and R-0060 to R-0064 are the consequences."
    status: active
  - id: "rfc-9679#R-0032"
    object: "HSS-LMS thumbprint input"
    field: "the required-parameter set for key type HSS-LMS"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.5"
    text: "The required parameters for HSS-LMS keys are:"
    kind: stated
    testable: yes
    note: "Lead-in to the list reproduced at R-0033 and R-0034."
    status: active
  - id: "rfc-9679#R-0033"
    object: "HSS-LMS thumbprint input"
    field: "the kty entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.5"
    text: '"kty" (label: 1, data type: int, value: 5)'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0034"
    object: "HSS-LMS thumbprint input"
    field: "the pub entry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.5"
    text: '"pub" (label: -1, data type: bstr)'
    kind: stated
    testable: yes
    note: "RFC 8778 defines pub as the LMS public key, which itself carries the LMS and LM-OTS typecodes, so the algorithm parameters are inside the hashed bytes for this key type and for no other."
    status: active
  - id: "rfc-9679#R-0035"
    object: "thumbprint input for an unlisted key type"
    field: "where the required-parameter set comes from when it is not in this document"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§4.6"
    text: 'As other key type values are defined, their defining specifications should be similarly consulted to determine which parameters, in addition to the "kty" element, are required.'
    kind: stated
    testable: no
    testable_reason: "Lowercase should, and the obligation is on a reader rather than on a byte sequence: there is nothing to test until a particular key type is named."
    note: "This is the open end of the format. A thumbprint over a key type not listed in 4.1 to 4.5 is computed against another document, and this one gives no rule for resolving a disagreement between the two."
    status: active
  - id: "rfc-9679#R-0036"
    object: "COSE Key Thumbprint"
    field: "invariance under the presence or absence of optional parameters"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.1"
    text: "Optional parameters of COSE Keys are intentionally not included in the COSE Key Thumbprint computation so that their absence or presence in the COSE Key does not alter the resulting value."
    kind: stated
    testable: yes
    note: "The stability property, stated as the reason for R-0007. Directly testable: hash the same key with and without kid, alg and key_ops and the two thumbprints have to be equal."
    status: active
  - id: "rfc-9679#R-0037"
    object: "COSE Key Thumbprint"
    field: "what the digest is taken over"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.1"
    text: "The COSE Key Thumbprint is a digest of the ordered essential parameters needed to represent a COSE Key, with all other parameters excluded."
    kind: stated
    testable: yes
    note: "The word ordered is load-bearing and this document never defines the order. It is fixed only by R-0003 (RFC 8949 4.2.1), illustrated by R-0055, and spelled out by R-0056."
    status: active
  - id: "rfc-9679#R-0038"
    object: "COSE Key Thumbprint"
    field: "stability of the value for one key across application contexts"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.1"
    text: "Including only the required parameters ensures that the COSE Key Thumbprint remains consistent for a given key, regardless of any additional attributes."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0039"
    object: "hash function H"
    field: "who chooses it"
    verb: none
    actor: "application"
    locator: "§5.2"
    text: "A specific hash function must be chosen by an application to compute the hash value of the hash input."
    kind: stated
    testable: no
    testable_reason: "Lowercase must, and the obligation falls on an application profile rather than on an implementation: there is no byte sequence that violates it."
    note: "The choice of H is pushed out of this specification entirely. Nothing in a thumbprint records which H produced it."
    status: active
  - id: "rfc-9679#R-0040"
    object: "hash function H"
    field: "agreement between parties that compare thumbprints"
    verb: none
    actor: "application"
    locator: "§5.2"
    text: "However, when multiple parties are involved in reproducing and comparing the COSE Key Thumbprint, it is crucial that they know and use the same hash function to ensure consistent results."
    kind: stated
    testable: yes
    note: "The cost of R-0039. Testable only as a negative: two parties on different H never match on any key."
    status: active
  - id: "rfc-9679#R-0041"
    object: "key in a non-COSE format"
    field: "what has to hold before its thumbprint can be computed"
    verb: none
    actor: "thumbprint producer"
    locator: "§5.3"
    text: "The only prerequisites are that the COSE_Key representation of the key be defined and the party creating the COSE Key Thumbprint be in possession of the necessary key material."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0042"
    object: "COSE Key Thumbprint"
    field: "the object the digest is computed on"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.4"
    text: "COSE Key Thumbprint values are computed on the COSE Key object containing only essential parameters in a specific order."
    kind: stated
    testable: yes
    note: "Second statement that an order exists (with R-0037) and second that does not say what it is."
    status: active
  - id: "rfc-9679#R-0043"
    object: "ckt and jkt"
    field: "whether a COSE and a JOSE thumbprint of one key agree"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.5"
    text: "The ckt of a COSE Key, as described in Section 7 of [RFC9052], and the jkt of a JSON Web Key, as described in Section 4 of [RFC7517], are different even when the underlying cryptographic key material is the same."
    kind: stated
    testable: yes
    note: "Both cross-references are wrong as printed: RFC 9052 Section 7 defines the COSE_Key structure and never mentions ckt, which this document itself defines at 5.6 and 8; RFC 7517 Section 4 lists JWK parameters, and jkt is RFC 7638 (with the confirmation member in RFC 9449 Section 6). Reported, not repaired."
    status: active
  - id: "rfc-9679#R-0044"
    object: "confirmation methods"
    field: "the cross-registrations this document does not make"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.5"
    text: 'This document does not register a JWT confirmation method [RFC7800] for using "ckt" as a confirmation method for a JWT or a CWT confirmation method [RFC8747] for using "jkt" as a confirmation method for a CWT.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0045"
    object: "cnf claim"
    field: "the member that names the proof-of-possession key"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.6"
    text: 'The proof-of-possession key is identified using the "ckt" member of the CWT confirmation claim "cnf".'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0046"
    object: "ckt member"
    field: "its value and encoding"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.6"
    text: "This member contains the value of the COSE Key Thumbprint encoded as a binary string."
    kind: stated
    testable: yes
    note: "Binary string means a CBOR bstr of the raw digest - the 5.7 base64url form is for URIs only (R-0052). The 5.6 example confirms it: h-prefixed bytes, not a text string."
    status: active
  - id: "rfc-9679#R-0047"
    object: "ckt member"
    field: "the claim it sits in"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.6"
    text: 'The "ckt" member is used in the "cnf" claim.'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0048"
    object: "COSE Key Thumbprint URI"
    field: "that a prefix is defined and what follows it"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.7"
    text: "This specification defines a URI prefix indicating that the portion of the URI following the prefix is a COSE Key Thumbprint."
    kind: stated
    testable: yes
    note: "The prefix itself is urn:ietf:params:oauth:ckt, printed as a block at source line 341 and registered by R-0068."
    status: active
  - id: "rfc-9679#R-0049"
    object: "COSE Key Thumbprint URI"
    field: "the whole shape of the URI"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.7"
    text: "To make the hash algorithm being used explicit in a URI, the prefix is followed by a hash algorithm identifier and a COSE Key Thumbprint value, each separated by a colon character to form a URI representing a COSE Key Thumbprint."
    kind: stated
    testable: yes
    note: "This is the only form in which a thumbprint carries its hash algorithm. The bare ckt member of R-0046 does not."
    status: active
  - id: "rfc-9679#R-0050"
    object: "COSE Key Thumbprint URI"
    field: "the vocabulary the hash algorithm identifier is drawn from"
    verb: MUST
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.7"
    text: 'Hash algorithm identifiers used in COSE Key Thumbprint URIs MUST be values from the "Hash Name String" column in the IANA "Named Information Hash Algorithm Registry" [IANA.Hash.Algorithms].'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0051"
    object: "COSE Key Thumbprint URI"
    field: "what a consumer does with an unregistered identifier"
    verb: MUST
    actor: "application"
    locator: "§5.7"
    text: "COSE Key Thumbprint URIs with hash algorithm identifiers not found in this registry are not considered valid, and applications MUST detect and handle this error, should it occur."
    kind: stated
    testable: yes
    note: "Note the lowercase should it occur inside a MUST sentence: the obligation is to detect and handle, and the document does not say what handling has to do beyond not treating the URI as valid."
    status: active
  - id: "rfc-9679#R-0052"
    object: "COSE Key Thumbprint URI"
    field: "the text encoding of the digest inside the URI"
    verb: MUST
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.7"
    text: "Since the URN is encoded as a string, the output of the COSE Key Thumbprint computation described in Section 3 MUST be base64url encoded without padding."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0053"
    object: "base64url encoding"
    field: "the definition this document adopts for it"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§5.7"
    text: "Base64 encoding using the URL- and filename-safe character set defined in Section 5 of RFC 4648 [RFC4648], with all trailing '=' characters omitted (as permitted by Section 3.2 of [RFC7515]) and without the inclusion of any line breaks, whitespace, or other additional characters."
    kind: stated
    testable: yes
    note: "The source prints this as a quotation of RFC 7515 behind a left margin of | markers. The markers and the two spaces following each are removed here as margin, which is the one normalisation beyond line-unwrapping applied to any text in this file; nothing else is altered. The block is reproduced with its markers in distilled/normative.md."
    status: active
  - id: "rfc-9679#R-0054"
    object: "worked example"
    field: "which of the example parameters are used"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§6"
    text: 'Not all of the parameters from the example above are used in the COSE Key Thumbprint computation because the required parameters of an elliptic curve public key are (as listed in Section 4.2) "kty", "crv", "x", and "y".'
    kind: stated
    testable: yes
    note: "The example key also carries kid (label 2), which is dropped."
    status: active
  - id: "rfc-9679#R-0055"
    object: "thumbprint input"
    field: "that the reduced structure has a correct order"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§6"
    text: "The resulting COSE Key structure, in CBOR diagnostic format with line breaks added for better readability, with the minimum parameters in the correct order are:"
    kind: stated
    testable: yes
    note: "The third and last statement that an order exists (R-0037, R-0042) and the only one tied to concrete bytes. The phrase the correct order is never expanded; R-0056 states the rule those bytes actually follow."
    status: active
  - id: "rfc-9679#R-0056"
    object: "thumbprint input"
    field: "the map key order the deterministic encoding produces"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§6"
    text: "The entries of a thumbprint input are ordered by the bytewise lexicographic order of their encoded labels, so kty (label 1, encoded 0x01) comes first and the type-specific labels -1, -2, -3 (encoded 0x20, 0x21, 0x22) follow in that order."
    kind: inferred
    testable: yes
    testable_reason: "NOT VERBATIM - composed by this extraction. No BCP 14 keyword backs it and this document nowhere states it; it is RFC 8949 4.2.1 applied to the labels of Section 4, and it is confirmed byte-for-byte by the A4 01 02 20 01 21 ... 22 ... encoding printed at source lines 442 to 444."
    note: "Recorded because every reader of this record will need it and the source supplies only the phrase the correct order. Under 4.2.1 a positive label sorts before every negative one, which is why kty leads."
    status: active
  - id: "rfc-9679#R-0057"
    object: "COSE Key Thumbprint"
    field: "the condition under which it identifies a key uniquely"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§7"
    text: "A COSE Key Thumbprint will only uniquely identify a particular key if a single unambiguous COSE Key representation for that key is defined and used when computing the COSE Key Thumbprint."
    kind: stated
    testable: yes
    note: "The hinge of the whole document, stated in lowercase in Security Considerations. It is also where R-0027 and R-0028 bite: RSA modulus and exponent bytes have no defined normalisation here, so a single unambiguous representation does not in fact follow from Section 4 for that key type."
    status: active
  - id: "rfc-9679#R-0058"
    object: "key identifiers"
    field: "their exclusion from the calculation"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§7"
    text: "Key identifiers are not included in the thumbprint calculation (similarly to other optional parameters in the COSE_Key structure)."
    kind: stated
    testable: yes
    note: "The only place the document says in so many words that kid is out. Section 4 excludes it by silence."
    status: active
  - id: "rfc-9679#R-0059"
    object: "thumbprint comparison"
    field: "what comparing thumbprints cannot be relied on to do"
    verb: none
    actor: "application"
    locator: "§7"
    text: "While thumbprint values are useful for identifying legitimate keys, comparing thumbprint values is not a reliable means of excluding the use of particular keys (or transformations thereof)."
    kind: stated
    testable: no
    testable_reason: "A property claim about the construction, not an obligation: nothing an implementation does can satisfy or violate it."
    note: "The worked attack is in the next two sentences: an RSA key with modulus 3*N has a different thumbprint and still works about a third of the time. A deny-list keyed on thumbprints is therefore not a deny-list on keys."
    status: active
  - id: "rfc-9679#R-0060"
    object: "symmetric key"
    field: "the entropy the key has to have before it is hashed"
    verb: MUST
    actor: "developer"
    locator: "§7"
    text: "Developers MUST ensure that the symmetric key has sufficient entropy to prevent attackers from precomputing tables of symmetric keys with their corresponding hash values."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0061"
    object: "symmetric key"
    field: "what counts as sufficient entropy"
    verb: none
    actor: "developer"
    locator: "§7"
    text: "This can be prevented if the symmetric key is a randomly selected key of at least a 128-bit length."
    kind: stated
    testable: yes
    note: "The only quantified threshold in the document, and it is stated in lowercase as a sufficient condition, not as a floor."
    status: active
  - id: "rfc-9679#R-0062"
    object: "thumbprint of a low-entropy secret"
    field: "the prohibited inputs"
    verb: MUST NOT
    actor: "developer"
    locator: "§7"
    text: "Thumbprints MUST NOT be used with passwords or other low-entropy secrets."
    kind: stated
    testable: yes
    note: "Verbatim only under the hyphen rule in the header: the source breaks low-entropy across lines as low- / entropy."
    status: active
  - id: "rfc-9679#R-0063"
    object: "thumbprint of a symmetric key"
    field: "what to do when entropy cannot be established"
    verb: MUST NOT
    actor: "developer"
    locator: "§7"
    text: "If a developer is unable to determine whether all symmetric keys used in an application have sufficient entropy, then thumbprints of symmetric keys MUST NOT be used."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-9679#R-0064"
    object: "thumbprint of a symmetric key"
    field: "the scope in which the practice is acceptable at all"
    verb: none
    actor: "developer"
    locator: "§7"
    text: "In general, using thumbprints of symmetric keys should only be used in special applications."
    kind: stated
    testable: no
    testable_reason: "Lowercase should, and special applications is not defined, so no test distinguishes a conforming deployment from a non-conforming one."
    status: active
  - id: "rfc-9679#R-0065"
    object: "CWT Confirmation Methods registry"
    field: "the registration this document makes"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§8"
    text: 'IANA has added the following entry to the "CWT Confirmation Methods" registry [IANA-CWT] established by [RFC8747]:'
    kind: stated
    testable: yes
    note: "The seven-field registration template is reproduced verbatim in distilled/normative.md; its two load-bearing values are R-0066 and R-0067."
    status: active
  - id: "rfc-9679#R-0066"
    object: "ckt member"
    field: "its CBOR label inside cnf"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§8"
    text: "Confirmation Key:  5"
    kind: stated
    testable: yes
    note: "Two spaces after the colon are the source template. This is the number an encoder writes: cnf is claim 8 of RFC 8747 and ckt is key 5 within it."
    status: active
  - id: "rfc-9679#R-0067"
    object: "ckt member"
    field: "its value type in the registry"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§8"
    text: "Confirmation Value Type(s):  binary string"
    kind: stated
    testable: yes
    note: "The same registration also gives Confirmation Method Description: COSE Key SHA-256 Thumbprint, which pins SHA-256 for this member although Section 3 admits other algorithms and the member carries no algorithm identifier. Reported, not repaired."
    status: active
  - id: "rfc-9679#R-0068"
    object: "OAuth URI registry"
    field: "the URN this document registers"
    verb: none
    actor: "implementation (thumbprint producer and verifier)"
    locator: "§8"
    text: "URN:  urn:ietf:params:oauth:ckt"
    kind: stated
    testable: yes
    note: "Two spaces after the colon are the source template."
    status: active
