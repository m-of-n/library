    notes: >-
      THE RECORD'S HEADLINE VECTOR - the only complete, reproducible COSE Key
      Thumbprint RFC 9679 prints. The source gives it as "the resulting COSE Key
      structure ... with the minimum parameters in the correct order", its CBOR
      encoding, and "Using SHA-256, the resulting thumbprint is". REPRODUCED
      THREE WAYS, all exact - (a) re-encoding the diagnostic in map-entry order
      gives the printed hex; (b) re-encoding it under RFC 8949 §4.2.1 bytewise
      key sorting gives the SAME hex, so §6's "correct order" is §4.2.1's order;
      (c) SHA-256 over those 75 octets gives the printed digest, which also
      equals V-0011's `kid` and V-0008's `ckt`. Every printed value in RFC 9679
      descends from this one key.

  - id: "rfc-9679#V-0013"
    locator: "§7"
    source: constructed
    kind: cose-key
    key_type: "RSA (kty 3), modulus 3N"
    key_diagnostic: "{1:3, -1:h'024e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4c', -2:h'010001'}"
    key_hex: "A30103205821024E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4C2143010001"
    thumbprint_input_hex: "A30103205821024E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4E4C2143010001"
    digest_alg: "SHA-256"
    thumbprint_hex: "e630c466e2f518b89d8e5e699dc8120810da2b843811b4827e5be3c8408c0b4b"
    expect: valid
    reproduced: n/a
    pair_with: "rfc-9679#V-0002"
    constructed_why: >-
      §7 describes a transformation and prints no key - "if a legitimate RSA key
      uses a modulus value N and an attacker supplies a key with modulus 3*N, the
      modified key would still work about 1/3 of the time, but it would appear to
      be a different key." This is V-0002's modulus multiplied by three (and one
      octet longer for the carry), so the pair makes the §7 claim mechanical: two
      thumbprints, one usable key relationship, nothing in the digest that
      relates them.
    notes: >-
      CONSTRUCTED BY THIS EXTRACTION, and the "works 1/3 of the time" claim is
      NOT verified here - no RSA operation was performed, and V-0002's modulus is
      not a real one. What is verified is the thumbprint half - the transformed
      key is a different key to every thumbprint comparison. §7's own conclusion
      is the testable one: "comparing thumbprint values is not a reliable means
      of excluding the use of particular keys (or transformations thereof)".
