    expect: valid
    reproduced: n/a
    pair_with: "rfc-9679#V-0004"
    constructed_why: >-
      The control for V-0004..V-0006. The §6 key with `alg` (label 3, value -7 =
      ES256) added. For EC2, §4.2 does not list `alg` among the required
      parameters, so §3 step 1 drops it and the thumbprint is unchanged. Same
      parameter, same label, same document - included for one key type, excluded
      for another. The parameter set is per-key-type, not fixed.
