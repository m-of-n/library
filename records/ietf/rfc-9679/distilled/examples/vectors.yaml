    pair_with: "rfc-9679#V-0012"
    notes: >-
      The §6 example as the source first gives it, with the comment "/ kid is
      bstr, not used in COSE Key Thumbprint /". REPRODUCED: `key_hex` is the
      printed hex and this extraction re-encoded the diagnostic notation to
      exactly those bytes; the `kid` value equals the thumbprint, so the example
      names itself. DEFECT FOUND - `key_hex` is NOT in RFC 8949 §4.2.1
      deterministic order. It encodes the diagnostic faithfully (kty, crv, x, y,
      kid) but §4.2.1 sorts `kid` (label 2, 0x02) second, giving
      "A50102025820496BD8AF...200121582065EDA5...". That alternative is this
      extraction's computation, not the document's. The defect is harmless for
      the thumbprint, because §3 step 2 applies to the step-1 reduction and not
      to this key - but an implementer who takes "the following CBOR encoding"
      as canonical has been shown a non-deterministic encoding by a
      determinism-dependent specification.

