implementations:
  open_source:
    - name: fxamacker/cbor
      url: https://github.com/fxamacker/cbor
      license: MIT
      language: go
      note: "v2.9.2 (2026-05-03). RFC 8949 + RFC 8742; ships both Core Deterministic and CTAP2-canonical presets; NCC Group public assessment; configurable decode limits."
    - name: agronholm/cbor2
      url: https://github.com/agronholm/cbor2
      license: MIT
      language: python
      note: "v6.1.4 (2026-08-01). De facto Python default. Native backend moved C -> Rust, so building from source now needs a Rust toolchain. CVE-2026-26209 and CVE-2025-68131 both fixed."
    - name: ciborium
      url: https://crates.io/crates/ciborium
      license: Apache-2.0
      language: rust
      note: "RustSec-recommended replacement for the deprecated serde_cbor. Deterministic smallest-size output; basis for google/coset."
    - name: minicbor
      url: https://github.com/twittner/minicbor
      license: BlueOak-1.0.0
      language: rust
      note: "The other RustSec-recommended serde_cbor replacement. no_std-first, no serde dependency."
    - name: QCBOR
      url: https://github.com/laurencelundblade/QCBOR
      license: permissive
      language: c
      note: "Constrained targets, <4KB object code. v1.x does NOT sort map keys on encode, so it is not canonical out of the box; v2 dev branch adds dCBOR. Companion t_cose supplies COSE."
    - name: libcbor
      url: https://github.com/PJK/libcbor
      license: MIT
      language: c
      note: "C99, RFC 8949 compliant, CBOR Sequences. Runs the CBOR WG test vectors in CI."
    - name: zcbor
      url: https://github.com/NordicSemiconductor/zcbor
      license: Apache-2.0
      language: c
      note: "The most production-grade CDDL tool found: generates C encode/decode from a CDDL schema. Ships as a Zephyr module. Embedded-C scope only."
    - name: NanoCBOR
      url: https://github.com/bergzand/NanoCBOR
      license: CC0-1.0
      language: c
      note: "Decoder ~600-800 bytes on Cortex-M0+. Packaged in RIOT-OS; libcose builds on it."
    - name: TinyCBOR
      url: https://github.com/intel/tinycbor
      license: MIT
      language: c
      note: "Widely embedded (incl. Qt). CVE-2025-24302 and CVE-2025-20025, uncontrolled recursion, fixed in 0.6.1+."
    - name: System.Formats.Cbor
      url: https://www.nuget.org/packages/System.Formats.Cbor/
      license: MIT
      language: dotnet
      note: "In the .NET BCL since .NET 5. Low-level CborReader/CborWriter with built-in conformance modes; no object mapping layer."
    - name: jackson-dataformat-cbor
      url: https://github.com/FasterXML/jackson-dataformats-binary
      license: Apache-2.0
      language: java
      note: "The standard JVM route, via Jackson. Not CDDL- or COSE-aware."
    - name: cbor-x
      url: https://github.com/kriszyp/cbor-x
      license: MIT
      language: javascript
      note: "Performance-focused; one of the only implementations engaging with Packed CBOR. Its optional cbor-extract addon had a heap over-read (GHSA-g3qj-j598-cxmq) reachable via fido2-lib; fixed 1.6.3."
