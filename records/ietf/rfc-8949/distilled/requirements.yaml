requirements:
  - id: "rfc-8949#R-0001"
    object: map
    field: "generic data model — distinctness of numerically equal integer and floating-point keys; partial: stated as a data-model permission, testable only as non-rejection by a generic decoder"
    verb: MAY
    actor: generic decoder
    locator: "§2.2"
    text: 'For example, in the generic data model, a valid map MAY have both "0" and "0.0" as keys,'
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0002"
    object: encoder
    field: choice of major type for an integral floating-point value in the generic data model
    verb: MUST NOT
    actor: encoder
    locator: "§2.2"
    text: 'and an encoder MUST NOT encode "0.0" as an integer (major type 0, Section 3.1).'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0003"
    object: encoder
    field: well-formedness of output
    verb: MUST
    actor: encoder
    locator: "§3"
    text: "An encoder MUST produce only well-formed encoded data items."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0004"
    object: decoder
    field: return behavior on input that is not well-formed
    verb: MUST NOT
    actor: decoder
    locator: "§3"
    text: "A decoder MUST NOT return a decoded data item when it encounters input that is not a well-formed encoded CBOR data item (this does not detract from the usefulness of diagnostic and recovery tools that might make available some information from a damaged encoded CBOR data item)."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0005"
    object: simple value
    field: "two-byte simple value encoding (0xf8 followed by a byte below 0x20, major type 7 additional information 24)"
    verb: MUST NOT
    actor: encoder
    locator: "§3.3"
    text: "An encoder MUST NOT issue two-byte sequences that start with 0xf8 (major type 7, additional information 24) and continue with a byte less than 0x20 (32 decimal)."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0006"
    object: tag
    field: "definition of new tags that require processing at (de-)serialization time; partial: constrains future tag specifications, checked by document review"
    verb: NOT RECOMMENDED
    actor: protocol designer
    locator: "§3.4"
    text: "The definition of new tags with this property is NOT RECOMMENDED."
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0007"
    object: tag
    field: "occurrence of the all-ones tag numbers 65535, 4294967295 and 18446744073709551615 in actual data; partial: optional behavior, both flagging and not flagging conform"
    verb: MAY
    actor: decoder
    locator: "§3.4"
    text: "These tags are not intended to occur in actual CBOR data items; implementations MAY flag such an occurrence as an error."
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0008"
    object: tag number 1
    field: admissible type of the tag content for epoch-based date/time
    verb: MUST
    actor: encoder
    locator: "§3.4.2"
    text: "The tag content MUST be an unsigned or negative integer (major types 0 and 1) or a floating-point number (major type 7 with additional information 25, 26, or 27)."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0009"
    object: "tag numbers 2 and 3 (bignums)"
    field: acceptance of a bignum byte string that carries leading zeroes
    verb: MUST
    actor: decoder
    locator: "§3.4.3"
    text: "Decoders that understand these tags MUST be able to decode bignums that do have leading zeroes."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0010"
    object: "tag numbers 4 and 5 (decimal fractions and bigfloats)"
    field: representation of the exponent element
    verb: MUST
    actor: encoder
    locator: "§3.4.4"
    text: "The exponent e MUST be represented in an integer of major type 0 or 1, while the mantissa can also be a bignum (Section 3.4.3)."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0011"
    object: core deterministic encoding requirements
    field: use of preferred serialization
    verb: MUST
    actor: deterministic encoder
    locator: "§4.2.1"
    text: "Preferred serialization MUST be used."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0012"
    object: core deterministic encoding requirements
    field: "shortest argument for integers, for lengths in major types 2 through 5, and for tags"
    verb: MUST
    actor: deterministic encoder
    locator: "§4.2.1"
    text: "In particular, this means that arguments (see Section 3) for integers, lengths in major types 2 through 5, and tags MUST be as short as possible, for instance:"
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0013"
    object: core deterministic encoding requirements
    field: argument encoding for values 0 to 23 and -1 to -24
    verb: MUST
    actor: deterministic encoder
    locator: "§4.2.1"
    text: "0 to 23 and -1 to -24 MUST be expressed in the same byte as the major type;"
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0014"
    object: core deterministic encoding requirements
    field: argument encoding for values 24 to 255 and -25 to -256
    verb: MUST
    actor: deterministic encoder
    locator: "§4.2.1"
    text: "24 to 255 and -25 to -256 MUST be expressed only with an additional uint8_t;"
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0015"
    object: core deterministic encoding requirements
    field: argument encoding for values 256 to 65535 and -257 to -65536
    verb: MUST
    actor: deterministic encoder
    locator: "§4.2.1"
    text: "256 to 65535 and -257 to -65536 MUST be expressed only with an additional uint16_t;"
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0016"
    object: core deterministic encoding requirements
    field: argument encoding for values 65536 to 4294967295 and -65537 to -4294967296
    verb: MUST
    actor: deterministic encoder
    locator: "§4.2.1"
    text: "65536 to 4294967295 and -65537 to -4294967296 MUST be expressed only with an additional uint32_t."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0017"
    object: floating-point value
    field: shortest floating-point form that preserves the value
    verb: MUST
    actor: deterministic encoder
    locator: "§4.2.1"
    text: "Floating-point values also MUST use the shortest form that preserves the value, e.g., 1.5 is encoded as 0xf93e00 (binary16) and 1000000.5 as 0xfa49742408 (binary32)."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0018"
    object: indefinite-length item
    field: presence of indefinite-length items in a deterministic encoding
    verb: MUST NOT
    actor: deterministic encoder
    locator: "§4.2.1"
    text: "Indefinite-length items MUST NOT appear."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0019"
    object: map
    field: bytewise lexicographic ordering of map keys by their deterministic encodings
    verb: MUST
    actor: deterministic encoder
    locator: "§4.2.1"
    text: "The keys in every map MUST be sorted in the bytewise lexicographic order of their deterministic encodings."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0020"
    object: map
    field: length-first map key ordering (shorter key first, then bytewise lexical order within equal lengths)
    verb: MUST
    actor: deterministic encoder
    locator: "§4.2.3"
    text: 'A CBOR encoding satisfies the "length-first core deterministic encoding requirements" if it satisfies the core deterministic encoding requirements except that the keys in every map MUST be sorted such that:'
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0021"
    object: CBOR-based protocol
    field: "specification of decoder handling for invalid and unexpected data; partial: requirement on the protocol specification document, not on code"
    verb: MUST
    actor: protocol designer
    locator: "§5"
    text: "CBOR-based protocols MUST specify how their decoders handle invalid and other unexpected data."
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0022"
    object: CBOR-based protocol
    field: "permission to treat arbitrary valid data as unexpected; no: permission granted to specification authors, both choices conform"
    verb: MAY
    actor: protocol designer
    locator: "§5"
    text: "CBOR-based protocols MAY specify that they treat arbitrary valid data as unexpected."
    kind: stated
    testable: no
    status: active
  - id: "rfc-8949#R-0023"
    object: encoder
    field: validity of emitted items in a CBOR-based protocol
    verb: MUST
    actor: encoder
    locator: "§5"
    text: "Encoders for CBOR-based protocols MUST produce only valid items, that is, the protocol cannot be designed to make use of invalid items."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0024"
    object: Section 5 of this document
    field: "normative-language scoping statement; no: meta-statement about the document itself, the quoted keyword constrains no implementation behavior"
    verb: MAY
    actor: protocol designer
    locator: "§5"
    text: 'With few exceptions, it is advisory only and explicitly excludes any language from BCP 14 [RFC2119] [RFC8174] other than words that could be interpreted as "MAY" in the sense of BCP 14.'
    kind: stated
    testable: no
    status: active
  - id: "rfc-8949#R-0025"
    object: streaming application
    field: "matching streaming security mechanism for incrementally presented data; partial: property of the application security design, not observable in the encoding"
    verb: MUST
    actor: application
    locator: "§5.1"
    text: "Such an application also MUST have a matching streaming security mechanism, where the desired protection is available for incremental data presented to the application."
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0026"
    object: protocol layer that does not process the semantics of forwarded data
    field: forwarding of data whose validity it cannot check
    verb: MUST
    actor: decoder
    locator: "§5.3"
    text: "These layers can't notice any validity errors in data they don't process and MUST forward that data as-is."
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0027"
    object: first layer that processes the semantics of an invalid item
    field: choice between replacing the item with an error marker and stopping processing
    verb: MUST
    actor: decoder
    locator: "§5.3"
    text: "The first layer that does process the semantics of an invalid CBOR item MUST pick one of two choices:"
    kind: stated
    testable: yes
    status: active
  - id: "rfc-8949#R-0028"
    object: CBOR-based protocol
    field: "specification of which invalid-item option its decoders take for each kind of invalid item; partial: requirement on the protocol specification document, not on code"
    verb: MUST
    actor: protocol designer
    locator: "§5.3"
    text: "A CBOR-based protocol MUST specify which of these options its decoders take for each kind of invalid item they might encounter."
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0029"
    object: CBOR-based protocol
    field: "definition of behavior when a receiving application sees duplicate map keys; partial: requirement on the protocol specification document, not on code"
    verb: MUST
    actor: protocol designer
    locator: "§5.6"
    text: "A CBOR-based protocol MUST define what to do when a receiving application sees multiple identical keys in a map."
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0030"
    object: duplicate-key rule in a CBOR-based protocol
    field: "conformance of that rule to the CBOR data model; partial: requirement on the protocol specification document, not on code"
    verb: MUST
    actor: protocol designer
    locator: "§5.6"
    text: "The resulting rule in the protocol MUST respect the CBOR data model: it cannot prescribe a specific handling of the entries with the identical keys, except that it might have a rule that having identical keys in a map indicates a malformed map and that the decoder has to stop with an error."
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0031"
    object: map
    field: "ascribing semantics to the order of key/value pairs in the map representation; partial: requirement on the protocol specification document, not on code"
    verb: MUST NOT
    actor: protocol designer
    locator: "§5.6"
    text: "Thus, a CBOR-based protocol MUST NOT specify that changing the key/value pair order in a map changes the semantics, except to specify that some orders are disallowed, for example, where they would not meet the requirements of a deterministic encoding (Section 4.2)."
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0032"
    object: CBOR-to-JSON and JSON-to-CBOR converter
    field: "freedom to follow or ignore the non-normative conversion advice in Section 6; no: permission with no observable conformance consequence"
    verb: MAY
    actor: converter implementer
    locator: "§6"
    text: "Implementations of converters MAY use whichever advice here they want."
    kind: stated
    testable: no
    status: active
  - id: "rfc-8949#R-0033"
    object: "+cbor structured syntax suffix registration"
    field: "fragment identifier syntax and semantics for +cbor; partial: constrains a registry entry and future media type specifications"
    verb: SHOULD
    actor: protocol designer
    locator: "§9.5"
    text: 'The syntax and semantics of fragment identifiers specified for +cbor SHOULD be as specified for "application/cbor".'
    kind: stated
    testable: partial
    status: active
  - id: "rfc-8949#R-0034"
    object: "media type of the form xxx/yyy+cbor"
    field: "processing of fragment identifiers for a specific +cbor media type; partial: constrains a registry entry and future media type specifications"
    verb: SHOULD
    actor: protocol designer
    locator: "§9.5"
    text: 'The syntax and semantics for fragment identifiers for a specific "xxx/yyy+cbor" SHOULD be processed as follows:'
    kind: stated
    testable: partial
    status: active
