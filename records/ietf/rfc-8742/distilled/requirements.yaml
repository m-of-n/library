reconciliation: 'RFC 8742 contains exactly FOUR all-capitals BCP 14 keyword occurrences in 18 KB, and bin/bcp14-count agrees at 4 (MUST 1, SHOULD 3). The extraction carries all four, so the two counts agree at 4 and nothing needs reconciling in the arithmetic sense. This field is written anyway, because 4 is a misleading number for this document in TWO directions and a reader who sees it would otherwise draw the wrong conclusion in both. FIRST, WHERE THE FOUR ARE: none of them constrains the format. R-0026 (SHOULD) tells a SPECIFICATION AUTHOR when a media type takes the +cbor-seq suffix. R-0044 (MUST) tells a decoder to fail gracefully on malicious input, which is about not crashing. R-0055 and R-0057 (SHOULD) are about FRAGMENT IDENTIFIERS in the structured-syntax-suffix registration. R-0055 is DEFERRED rather than vacuous: section 6.1 registers application/cbor-seq with "Fragment identifier considerations: N/A" and section 6.3 then states "(At the time of publication of this document, there is no fragment identification syntax defined for "application/cbor-seq".)" - note the temporal qualifier, which makes it a rule that binds if and when such a syntax is registered. R-0057 is NOT vacuous at all: its three cases collapse onto R-0060, "For cases not defined in +cbor-seq, process as specified in "xxx/yyy+cbor-seq"", which with no +cbor-seq rules is UNIVERSAL AND DETERMINATE at publication - the one keyword of the four with an applicable effect on the day the RFC shipped. [correction] 2026-10-20, pass 2: this field used to read "both are vacuous at publication by the document''s own admission ... So HALF the document''s normative content points at a referent the same document declares not to exist." Overturned; the replacement defect is that sections 6.1 and 6.3 register CONTRADICTORY fragment-identifier dispositions for the same format and 6.3 does not reconcile them. See ../design-notes.md section 7 defect 1 for the argument, and note that "vacuous" needed a premise about what an RFC 6838 registration may legitimately defer to, which is unverifiable here: RFC 6838 is not a record in this library and is not cached. SECTION 2 - the entire format - CONTAINS NO BCP 14 KEYWORD AT ALL: nothing says a producer MUST NOT put anything between items, nothing says a consumer MUST read to end of input, and nothing about the container is testable. "We use RFC 8742" cites a definition, not a conformance target. SECOND, THE DOCUMENT USES LOWER-CASE force words where an uppercase keyword would be expected, and section 1.1 binds keywords "when, and only when, they appear in all capitals", so those sentences carry no force and are NOT counted here: R-0019, the ONE sentence that states how to decode the format ("one must decode a single CBOR data item"); R-0043 ("decoders must operate on input that is assumed to be untrusted"), which sits in the sentence immediately before the one uppercase MUST; and R-0027''s lower-case "should continue to use the "+cbor" structured syntax suffix". Two of the three substantive "must"s in RFC 8742 are therefore non-normative by its own convention. WHAT WAS COUNTED INSTEAD, and extracted here as kind: inferred: (a) every DEFINITIONAL CASE of section 2''s recursive definition and every step of its decoding rule; (b) every EXPLICIT ABSENCE OR DISCLAIMER OF CAPABILITY, because what this document declines to provide is the whole reason we hold it - no end-of-sequence indicator, no marker between items, no detection of entirely missing items at the end, no cryptographic integrity, no CDDL top-level subject, no diagnostic notation for an unadorned sequence, no notation for the zero-length case, no magic number and no file extension; (c) every REGISTRATION FIELD VALUE in sections 6.1 and 6.3 that carries a claim, which is where "Magic number(s): N/A" lives; and (d) the lower-case force words the document does use (must, may, should, recommends, can, cannot, is of the utmost importance, outside the scope, apply). Each inferred entry names in its `field` the phrase or definitional case that carries the force and states that no BCP 14 keyword backs it; no obligation was invented and no count was inflated. Section 1.1''s BCP 14 boilerplate is deliberately NOT quoted in any entry: bin/validate counts requirement texts with boilerplate stripping OFF, so quoting it would add 11 phantom keywords and the extraction would read 15 against a source of 4. It IS quoted in normative.md, which nothing counts.'
reviewed_by: ""
note: |
  Ids are stable and never reused. Cite as rfc-8742#R-NNNN.
  Entries are in source order by section, then by position within the section;
  ids run from R-0001 with no gaps.
  KIND. `stated` means an all-capitals BCP 14 keyword backs the entry; there are
  FOUR - rfc-8742#R-0026 (SHOULD, the suffix test), rfc-8742#R-0044 (MUST, fail
  gracefully) and rfc-8742#R-0055 and rfc-8742#R-0057 (SHOULD, fragment
  identifiers). `inferred` means no BCP 14 keyword backs it: the force is a
  definitional case, a decoding rule, an explicit absence of capability, a
  registration field value, or a lower-case force word - and every inferred
  entry names that carrier in `field`. `inferred` here does NOT mean the text is
  paraphrased: every `text` in this file is a single contiguous verbatim span of
  RFC 8742. This follows rfc-8610, rfc-9741 and rfc-9682.
  VERB. Upper case only for the four stated entries. Lower case reproduces the
  source's own force word, and where the source uses a LOWER-CASE `must`, `may`
  or `should` the verb says so explicitly - section 1.1 binds keywords "when,
  and only when, they appear in all capitals", so those three sentences carry no
  BCP 14 force and are not counted. `none` means the sentence carries no force
  word at all and its normativity is definitional.
  CONTIGUITY. Asserted after collapsing runs of whitespace. The source has NO
  form feeds, NO page footers and NO trailing whitespace on any line (RFC 8742 is
  an unpaginated v3 text rendering), so there is no page decoration to remove and
  NO transformation of any kind was applied - no aside bars, no dedent, no
  healed hyphenation. Every text in this file is a contiguous span of the
  document as published. Three hyphenation breaks exist in the source (lines
  16/17, 373/374, 393/394) and NONE falls inside a span quoted here, so no
  sentence needed splitting; the one that would have mattered, line 373's
  "IESG-"/"designated", is inside the section 6.3 registration template and is
  carried verbatim by line range in schema/registrations.txt instead.
  The cached rendering begins with a UTF-8 BOM (U+FEFF) on line 1; it is part of
  the hashed bytes and part of no quoted span.
  No span in this file is spliced from two non-adjacent parts of the document.
  ACTOR. RFC 8742 defines no protocol roles, so `actor` names the party a
  constraint falls on in practice: `decoder`, `producer`, `implementer`,
  `specification author` (for a drafting rule or an absence an author must work
  around), `fixture author` (for section 4.2's notation), `CDDL maintainer`,
  `IANA / registrant` for section 6, and `reader of this specification` for a
  statement about the document itself.

