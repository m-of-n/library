    field: 'no BCP 14 keyword backs this; the force is a lower-case permission, immediately withdrawn by the next sentence'
    verb: 'may (lower case)'
    actor: 'decoder'
    locator: "§2"
    text: '(An implementation may be able to recover from some errors in a sequence of bytes that is almost, but not entirely, a well-formed encoded CBOR data item.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a permission with no criterion; the sentence is also a FRAGMENT - the parenthesis closes on the next sentence, so the span is quoted as the source punctuates it'
    status: active
  - id: "rfc-8742#R-0023"
    object: 'malformed data'
    field: 'no BCP 14 keyword backs this; the force is an explicit scope exclusion. Whatever an implementation does with a corrupt entry, this document does not govern it'
    verb: 'outside the scope'
    actor: 'implementer'
    locator: "§2"
    text: 'Handling malformed data is outside the scope of this specification.)'
    kind: inferred
    testable: 'no'
    testable_reason: 'a scope exclusion'
    status: active
  - id: "rfc-8742#R-0024"
    object: 'truncation detection'
    field: 'no BCP 14 keyword backs this; the force is a capability claim AND its limit in one sentence: truncation of the LAST ITEM''S BYTES is detectable, ENTIRELY MISSING ITEMS AT THE END are not. Truncating an append-only log at an item boundary is therefore in spec and undetectable'
    verb: 'can / cannot'
    actor: 'decoder'
    locator: "§2"
    text: 'This also means that the CBOR Sequence format can reliably detect truncation of the bytes making up the last CBOR data item in the sequence, but it cannot detect entirely missing CBOR data items at the end.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0025"
    object: 'a streaming decoder meeting a truncated final item'
    field: 'no BCP 14 keyword backs this; the force is a lower-case permission. It is the ONLY sentence in the document that describes a decoder having a condition over time - pause, suspend, later resume - and it is the whole basis of state-machine.yaml, which is derived and says so'
    verb: 'may (lower case)'
    actor: 'decoder'
    locator: "§2"
    text: 'A CBOR Sequence decoder that is used for consuming streaming CBOR Sequence data may simply pause for more data (e.g., by suspending and later resuming decoding) in case a truncated final item is being received.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'the permission is testable only as the absence of a failure; the document gives no rule for when to stop waiting'
    status: active
  - id: "rfc-8742#R-0026"
    object: 'the "+cbor-seq" structured syntax suffix'
    field: 'BCP 14 SHOULD. The only keyword in the document aimed at a specification author, and ITS TEST IS NOT DECIDABLE: qualification turns on an unquantified "at least sometimes"'
    verb: 'SHOULD'
    actor: 'specification author'
    locator: "§3"
    text: 'The use case for the "+cbor-seq" structured syntax suffix is analogous to that for "+cbor": it SHOULD be used by a media type when the result of parsing the bytes of the media type object as a CBOR Sequence is meaningful and is at least sometimes not just a single CBOR data item.'
    kind: stated
    testable: 'partial'
    testable_reason: '"at least sometimes not just a single CBOR data item" has no decision procedure; the document supplies no threshold and no example'
    status: active
  - id: "rfc-8742#R-0027"
    object: 'the "+cbor" suffix, for formats that do not qualify'
    field: 'no BCP 14 keyword backs this; the force is a LOWER-CASE should inside the parenthesis that explains why the qualification is there. The document therefore states the fallback rule non-normatively and the rule it falls back from normatively'
    verb: 'should (lower case)'
    actor: 'specification author'
    locator: "§3"
    text: '(Without the qualification at the end, this sentence is trivially true for any +cbor media type, which of course should continue to use the "+cbor" structured syntax suffix.)'
    kind: inferred
    testable: 'no'
    testable_reason: 'a lower-case recommendation, excluded from BCP 14 force by section 1.1'
    status: active
  - id: "rfc-8742#R-0028"
    object: 'an application meeting a "+cbor-seq" media type'
    field: 'no BCP 14 keyword backs this; the force is a permission: generic processing, or generic parsing plus specific processing on top'
    verb: 'can'
    actor: 'implementer'
    locator: "§3"
    text: 'Applications encountering a "+cbor-seq" media type can then either simply use generic processing if all they need is a generic view of the CBOR Sequence or use generic CBOR Sequence tools for initial parsing and then implement their own specific processing on top of that generic parsing tool.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a permission with two alternatives and no obligation'
    status: active
  - id: "rfc-8742#R-0029"
    object: 'CDDL''s .cborseq control operator'
    field: 'no BCP 14 keyword backs this; the force is a fact about RFC 8610 section 3.8.4 plus the rule for using it - the controller type is an ARRAY. Note that RFC 8610 is an INFORMATIVE reference of this document (section 7.2) although section 4.1 and section 4.3 both depend on it'
    verb: 'none'
    actor: 'specification author'
    locator: "§4.1"
    text: 'In Concise Data Definition Language (CDDL) [RFC8610], CBOR Sequences are already supported as contents of byte strings using the ".cborseq" control operator (Section 3.8.4 of [RFC8610]) by employing an array as the controller type:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0030"
    object: 'a CDDL specification whose top-level subject is a CBOR Sequence'
    field: 'no BCP 14 keyword backs this; the force is an explicit ABSENCE OF CAPABILITY in the schema language. It is the reason a multi-statement file''s container cannot be schema-checked, and the reason schema/cbor-seq-toplevel.derived.cddl exists and is derived'
    verb: 'does not provide'
    actor: 'specification author'
    locator: "§4.1"
    text: 'Currently, CDDL does not provide for unadorned CBOR Sequences as a top-level subject of a specification.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0031"
    object: 'the workaround for the missing top-level rule'
    field: 'no BCP 14 keyword backs this; the force is a suggestion, and the suggestion is PROSE: an array rule plus English text saying it is really a sequence. Under R-O-03''s discipline - cited, not invented silently - an English-prose container is the weakest citation available'
    verb: 'the suggestion is'
    actor: 'specification author'
    locator: "§4.1"
    text: 'For now, the suggestion is to use an array for the top-level rule, as is used for the ".cborseq" control operator, and add English text that explains that the specification is really about a CBOR Sequence with the elements of the array:'
    kind: inferred
    testable: 'no'
    testable_reason: 'an English-text convention; no lint rule can target it'
    status: active
  - id: "rfc-8742#R-0032"
    object: 'future versions of CDDL'
    field: 'no BCP 14 keyword backs this; the force is a forward-looking permission about a document that is not this one. Six years on, no record in this library closes it, and CDDL''s live extension point is the control-operator registry, which is not where a top-level SUBJECT could be added'
    verb: 'may provide'
    actor: 'CDDL maintainer'
    locator: "§4.1"
    text: '(Future versions of CDDL may provide a notation for top-level CBOR Sequences, e.g., by using a group as the top-level rule in a CDDL specification.)'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement about possible future work'
    status: active
  - id: "rfc-8742#R-0033"
    object: 'CBOR diagnostic notation and extended diagnostic notation'
    field: 'no BCP 14 keyword backs this; the force is a second explicit ABSENCE OF CAPABILITY, parallel to section 4.1''s: the notation cannot write an unadorned sequence either, so the FIXTURES cannot be written honestly in it'
    verb: 'does not provide'
    actor: 'fixture author'
    locator: "§4.2"
    text: 'CBOR diagnostic notation (see Section 6 of [RFC7049]) or extended diagnostic notation (Appendix G of [RFC8610]) also does not provide for unadorned CBOR Sequences at this time (the latter does provide for CBOR Sequences embedded in a byte string as per Appendix G.3 of [RFC8610]).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0034"
    object: 'notation for a CBOR Sequence'
    field: 'no BCP 14 keyword backs this; the force is a LOWER-CASE recommendation of the document''s own: enclose the items in an array'
    verb: 'recommends'
    actor: 'fixture author'
    locator: "§4.2"
    text: 'In a similar spirit to the recommendation for CDDL above, this specification recommends enclosing the CBOR data items in an array.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a notational recommendation, not a property of any encoding'
    status: active
  - id: "rfc-8742#R-0035"
    object: 'the bracket-free notation'
    field: 'no BCP 14 keyword backs this; the force is a permission, fenced by a condition that is itself unquantified - "where the boundaries within which the notation is used are obvious". RFC 9277 section 2.3.1 uses exactly this form for its worked example'
    verb: 'it is also possible'
    actor: 'fixture author'
    locator: "§4.2"
    text: 'In a more informal setting, where the boundaries within which the notation is used are obvious, it is also possible to leave off the outer brackets for this array, as shown in these two examples:'
    kind: inferred
    testable: 'no'
    testable_reason: '"obvious" has no decision procedure'
    status: active
  - id: "rfc-8742#R-0036"
    object: 'the zero-length CBOR Sequence in notation'
    field: 'no BCP 14 keyword backs this; the force is an admission of a notational gap, and it is the fourth statement bearing on the empty sequence: it is valid, it has no notation, and it is indistinguishable from an empty file, a fully truncated file and a file never written'
    verb: 'somewhat difficult'
    actor: 'fixture author'
    locator: "§4.2"
    text: 'Note that it is somewhat difficult to discuss zero-length CBOR Sequences in the latter form.'
    kind: inferred
    testable: 'no'
    testable_reason: 'an admission about the notation, with no rule'
    status: active
  - id: "rfc-8742#R-0037"
    object: 'skipping and fan-out'
    field: 'no BCP 14 keyword backs this; the force is a statement of the applications the next sentence''s mitigation is for'
    verb: 'is of the utmost importance'
    actor: 'implementer'
    locator: "§4.3"
    text: 'In certain applications, being able to efficiently skip an element without the need for decoding its substructure, or efficiently fanning out elements to multi-threaded decoding processes, is of the utmost importance.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a motivation statement'
    status: active
  - id: "rfc-8742#R-0038"
    object: 'a byte-string-wrapped element'
    field: 'no BCP 14 keyword backs this; the force is a permission that is THE MITIGATION for the tail loss of R-0021: wrap each element in a byte string, which carries its length in bytes. It is tag 24''s pattern with the tag removed, and it costs one byte-string head per entry'
    verb: 'can be used'
    actor: 'producer'
    locator: "§4.3"
    text: 'For these applications, byte strings (which carry length information in bytes) containing embedded CBOR can be used as the elements of a CBOR Sequence:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0039"
    object: 'partial recovery from a malformed element'
    field: 'no BCP 14 keyword backs this; the force is a bounded capability claim with its own limit stated: the SEQUENCE OF BYTE STRINGS must still be well formed. So the mitigation moves the failure boundary in by one level; it does not remove it'
    verb: 'may also enable'
    actor: 'decoder'
    locator: "§4.3"
    text: 'Within limits, this may also enable recovering from elements that internally are not well formed; the limitation is that the sequence of byte strings does need to be well formed as such.'
    kind: inferred
    testable: 'partial'
    testable_reason: '"within limits" is not quantified; the stated limit is testable'
    status: active
  - id: "rfc-8742#R-0040"
    object: 'the security considerations of CBOR'
    field: 'no BCP 14 keyword backs this; the force is incorporation by reference - and the reference is to [RFC7049], superseded by RFC 8949'
    verb: 'apply'
    actor: 'implementer'
    locator: "§5"
    text: 'The security considerations of CBOR [RFC7049] apply.'
    kind: inferred
    testable: 'no'
    testable_reason: 'an incorporation by reference, with no criterion of its own'
    status: active
  - id: "rfc-8742#R-0041"
    object: 'cryptographic integrity of a CBOR Sequence'
    field: 'no BCP 14 keyword backs this; the force is a flat statement of what the format does NOT provide, plus a pointer to COSE. The COSE reference is [RFC8152], obsoleted by RFC 9052'
    verb: 'provides no'
    actor: 'implementer'
    locator: "§5"
    text: 'This format provides no cryptographic integrity protection of any kind but can be combined with security specifications such as CBOR Object Signing and Encryption (COSE) [RFC8152] to do so.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0042"
    object: 'per-element versus whole-sequence COSE protection'
    field: 'no BCP 14 keyword backs this; the force is the only statement in this library''s reference set about what PER-ELEMENT COSE DOES NOT BIND. "the relationship of the elements in the sequence" is exactly the count and the order, and "additional effort may be required" is the whole of the guidance given'
    verb: 'may be required'
    actor: 'specification author'
    locator: "§5"
    text: '(COSE protections can be applied to an entire CBOR Sequence or to each of the elements of the sequence independently; in the latter case, additional effort may be required if there is a need to protect the relationship of the elements in the sequence.)'
    kind: inferred
    testable: 'no'
    testable_reason: 'names a need and no mechanism; "additional effort" is not a requirement an implementation can be tested against'
    status: active
  - id: "rfc-8742#R-0043"
    object: 'the trust model for decoder input'
    field: 'LOWERCASE "must" - the second of two in the document, and it sits in the sentence immediately before the one uppercase MUST. By section 1.1''s own clause it carries no BCP 14 force'
    verb: 'must (lower case)'
    actor: 'decoder'
    locator: "§5"
    text: 'As usual, decoders must operate on input that is assumed to be untrusted.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a framing assumption, not a testable behaviour'
    status: active
  - id: "rfc-8742#R-0044"
    object: 'decoder behaviour on malicious input'
    field: 'BCP 14 MUST - the only one in the document. It is about not crashing, and it says nothing about the format: "gracefully" is undefined here and no failure mode is enumerated'
    verb: 'MUST'
    actor: 'decoder'
    locator: "§5"
    text: 'This means that decoders MUST fail gracefully in the face of malicious inputs.'
    kind: stated
    testable: 'partial'
    testable_reason: '"fail gracefully" is not defined in this document; a crash is a clear failure, anything short of it is a judgement'
    status: active
  - id: "rfc-8742#R-0045"
    object: 'the application/cbor-seq media type'
    field: 'no BCP 14 keyword backs this; the force is a completed registration, in the past tense'
    verb: 'has registered'
    actor: 'IANA / registrant'
    locator: "§6.1"
    text: 'IANA has registered the media type for CBOR Sequence, application/cbor-seq, as follows:'
    kind: inferred
    testable: 'partial'
    testable_reason: 'decidable against the IANA Media Types registry'
    status: active
  - id: "rfc-8742#R-0046"
    object: 'the magic number of application/cbor-seq'
    field: 'no BCP 14 keyword backs this; the force is a registration FIELD VALUE, and it is the datum this record was read for: THE FORMAT HAS NO IN-BAND SELF-IDENTIFICATION. RFC 9277 Appendix B plus content-format 63 makes one constructible for exactly this media type, and neither document points at the other on this point'
    verb: 'N/A'
    actor: 'IANA / registrant'
    locator: "§6.1"
    text: 'Magic number(s): N/A'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0047"
    object: 'the file extension of application/cbor-seq'
    field: 'no BCP 14 keyword backs this; the force is a registration FIELD VALUE. With no magic number and no extension, two of the three out-of-band substitutes rfc-8949''s design notes list are unavailable for this media type by its own registration'
    verb: 'N/A'
    actor: 'IANA / registrant'
    locator: "§6.1"
    text: 'File extension(s): N/A'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0048"
    object: 'fragment identifiers for application/cbor-seq'
    field: 'no BCP 14 keyword backs this; the force is a registration FIELD VALUE - and it is what makes two of the document''s four BCP 14 keywords vacuous. Section 6.3''s two SHOULDs are about fragment identifiers for +cbor-seq, defined by reference to this field'
    verb: 'N/A'
    actor: 'IANA / registrant'
    locator: "§6.1"
    text: 'Fragment identifier considerations: N/A'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0049"
    object: 'interoperability considerations for application/cbor-seq'
    field: 'no BCP 14 keyword backs this; the force is a registration FIELD VALUE, and it CITES A SECTION THAT DOES NOT EXIST: no part of RFC 8742 is headed interoperability. The nearest content is section 2''s truncation paragraph and section 4.3''s skipping advice'
    verb: 'Described herein'
    actor: 'IANA / registrant'
    locator: "§6.1"
    text: 'Interoperability considerations: Described herein.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a dangling internal reference; nothing to test'
    status: active
  - id: "rfc-8742#R-0050"
    object: 'encoding considerations for application/cbor-seq'
    field: 'no BCP 14 keyword backs this; the force is a registration FIELD VALUE - binary, so no transfer encoding is implied and no text form is registered'
    verb: 'binary'
    actor: 'IANA / registrant'
    locator: "§6.1"
    text: 'Encoding considerations: binary'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0051"
    object: 'intended usage of application/cbor-seq'
    field: 'no BCP 14 keyword backs this; the force is a registration FIELD VALUE under RFC 6838 - COMMON rather than LIMITED USE or OBSOLETE'
    verb: 'COMMON'
    actor: 'IANA / registrant'
    locator: "§6.1"
    text: 'Intended usage: COMMON'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0052"
    object: 'CoAP Content-Format ID for application/cbor-seq'
    field: 'no BCP 14 keyword backs this; the force is a completed assignment, from the Expert Review (0-255) range. [RFC8126], which names that policy, is an INFORMATIVE reference of this document (section 7.2)'
    verb: 'has assigned'
    actor: 'IANA / registrant'
    locator: "§6.2"
    text: 'IANA has assigned a CoAP Content-Format ID for the media type "application/cbor-seq", within the "CoAP Content-Formats" subregistry of the "Constrained RESTful Environments (CoRE) Parameters" registry [IANA-CORE-PARAMETERS], from the "Expert Review" (0-255) range ([RFC8126]).'
    kind: inferred
    testable: 'partial'
    testable_reason: 'decidable against the CoRE Parameters registry'
    status: active
  - id: "rfc-8742#R-0053"
    object: 'Table 1, the assigned ID'
    field: 'no BCP 14 keyword backs this; the force is the pointer to the table. The assigned ID is 63 - and CBOR TAG 63 IS A DIFFERENT NAMESPACE, carrying the semantics "Encoded CBOR Sequence RFC 8742" from draft-bormann-cbor-notable-tags-02 section 2.1, an allocation this RFC never requested. The matching numeral is a coincidence across two registries'
    verb: 'is shown in'
    actor: 'reader of this specification'
    locator: "§6.2"
    text: 'The assigned ID is shown in Table 1.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0054"
    object: 'the +cbor-seq structured syntax suffix registration'
    field: 'no BCP 14 keyword backs this; the force is a completed registration PERFORMED "in accordance with" [RFC6838] - which this document classifies as an INFORMATIVE reference (section 7.2). The procedure the registration conforms to is cited informatively'
    verb: 'has registered'
    actor: 'IANA / registrant'
    locator: "§6.3"
    text: 'IANA has registered the "+cbor-seq" structured syntax suffix in accordance with [RFC6838] as follows:'
    kind: inferred
    testable: 'partial'
    testable_reason: 'decidable against the Structured Syntax Suffix registry'
    status: active
  - id: "rfc-8742#R-0055"
    object: 'fragment identifiers for +cbor-seq'
    field: 'BCP 14 SHOULD, and VACUOUS AT PUBLICATION BY THE DOCUMENT''S OWN ADMISSION: the referent is the syntax specified for "application/cbor-seq", which section 6.1 registers as "Fragment identifier considerations: N/A" and the next sentence confirms is undefined'
    verb: 'SHOULD'
    actor: 'specification author'
    locator: "§6.3"
    text: 'Fragment identifier considerations: The syntax and semantics of fragment identifiers specified for +cbor-seq SHOULD be the same as that specified for "application/cbor-seq".'
    kind: stated
    testable: 'no'
    testable_reason: 'the referent does not exist: section 6.1 registers fragment identifier considerations as N/A, and the following sentence says no syntax is defined'
    status: active
  - id: "rfc-8742#R-0056"
    object: 'the absence of a fragment identification syntax'
    field: 'no BCP 14 keyword backs this; the force is the document''s own admission that the thing the preceding SHOULD points at is not defined'
    verb: 'there is no'
    actor: 'reader of this specification'
    locator: "§6.3"
    text: '(At the time of publication of this document, there is no fragment identification syntax defined for "application/cbor-seq".)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0057"
    object: 'fragment identifier processing for a specific xxx/yyy+cbor-seq'
    field: 'BCP 14 SHOULD, and MISCATEGORISED: what gets processed is a fragment identifier, not its "syntax and semantics". The subject of the verb cannot be processed. It is the second of the two vacuous SHOULDs, since the +cbor-seq rules it defers to do not exist'
    verb: 'SHOULD'
    actor: 'implementer'
    locator: "§6.3"
    text: 'The syntax and semantics for fragment identifiers for a specific "xxx/yyy+cbor-seq" SHOULD be processed as follows:'
    kind: stated
    testable: 'no'
    testable_reason: 'the "+cbor-seq rules" the three cases branch on are not defined by this or any document'
    status: active
  - id: "rfc-8742#R-0058"
    object: 'case 1: resolves per the +cbor-seq rules'
    field: 'no BCP 14 keyword backs this; the force is a case of the preceding SHOULD. The branch condition refers to rules that do not exist'
    verb: 'process as specified'
    actor: 'implementer'
    locator: "§6.3"
    text: 'For cases defined in +cbor-seq, if the fragment identifier resolves per the +cbor-seq rules, then process as specified in +cbor-seq.'
    kind: inferred
    testable: 'no'
    testable_reason: 'depends on undefined +cbor-seq rules'
    status: active
  - id: "rfc-8742#R-0059"
    object: 'case 2: does not resolve per the +cbor-seq rules'
    field: 'no BCP 14 keyword backs this; the force is a case of the preceding SHOULD'
    verb: 'process as specified'
    actor: 'implementer'
    locator: "§6.3"
    text: 'For cases defined in +cbor-seq, if the fragment identifier does not resolve per the +cbor-seq rules, then process as specified in "xxx/yyy+cbor-seq".'
    kind: inferred
    testable: 'no'
    testable_reason: 'depends on undefined +cbor-seq rules'
    status: active
  - id: "rfc-8742#R-0060"
    object: 'case 3: cases not defined in +cbor-seq'
    field: 'no BCP 14 keyword backs this; the force is a case of the preceding SHOULD. With the +cbor-seq rules undefined, every case falls here, so the three-way branch collapses to one arm'
    verb: 'process as specified'
    actor: 'implementer'
    locator: "§6.3"
    text: 'For cases not defined in +cbor-seq, process as specified in "xxx/yyy+cbor-seq".'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0061"
    object: 'interoperability considerations for the +cbor-seq suffix'
    field: 'no BCP 14 keyword backs this; the force is a registration FIELD VALUE - and it reads "n/a" where section 6.1''s corresponding field reads "Described herein." for the same format. The two registrations disagree about whether this document has interoperability considerations'
    verb: 'n/a'
    actor: 'IANA / registrant'
    locator: "§6.3"
    text: 'Interoperability considerations: n/a'
    kind: inferred
    testable: 'yes'
    status: active
