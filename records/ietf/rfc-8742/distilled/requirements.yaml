  mechanical_results: |
    RE-DERIVED, not taken from pass 1.
    bin/bcp14-count .cache/rfc-8742.txt --by-keyword -> 4 (MUST 1, SHOULD 3).
    AGREES. And the boilerplate claim checks too: a raw grep of the all-capitals
    keyword forms over the whole source gives 15 (MUST 3, SHOULD 5, SHALL 2,
    REQUIRED 1, RECOMMENDED 2, MAY 1, OPTIONAL 1), so section 1.1's boilerplate
    holds exactly the 11 phantom keywords the `reconciliation` field says it
    does.
    sha256, 462 lines, 18421 bytes. AGREES.
    ALL 61 `text` values are contiguous verbatim spans of the RAW
    whitespace-normalised source -- none needs any transformation at all, which
    is what this record claims and what distinguishes it from its sibling.
    bin/check-locators: 61 of 61 contained, 0 misfiled, 0 unresolvable.
    Word-break census: 3 in the source, 2 in the body (16/17, 373/374) and 1 in
    the references; NONE falls inside a quoted span, as claimed.
    Lane-wide quote audit, both records at once: ZERO healed word breaks, ZERO
    bad elisions, and ONE altered capital -- "At least sometimes" for the
    source's lower-case "at least sometimes", in design-notes.md, corrected
    there.
  id_join_audit: |
    THE AUDIT PASS 1 ASKED FOR, RE-RUN INDEPENDENTLY. Every R-id reference in
    every artifact of this record, in all four spellings, emitted by script and
    resolved back to its own entry's locator and text, and the pairs read.
    243 citations. ZERO WRONG.
    THREE STRUCTURAL REASONS IT IS CLEAN, worth recording because the sibling
    record was not:
      (a) no two of the 61 requirements share a `text`, so there is nowhere for
          a wrong id to hide from a text comparison -- rfc-9277 has two such
          groups and BOTH were mis-joined;
      (b) all 61 ids are labelled exactly once in ../normative.md and the
          primary-id sequence down that file is strictly ascending, with no
          exceptions;
      (c) every locator's id range is contiguous, 11 for 11.
    The only arithmetic defect found was in ../messages.yaml's top-of-file
    comment, which said "44 of the 61 ... the 17 that are not" against its own
    `requirements_no_field_cites` block and its own `counts` block, both of
    which say 31 and 30. Recomputed: 37 cite sites, 31 cited, 30 not, and the
    listed set is set-equal to the computed one. Corrected in place.
  statements_with_no_entry: |
    Two, found by a sentence-level coverage sweep of the whole source rather
    than by re-reading the extraction. Both are now bullets in ../normative.md
    marked "no id". No id was minted: ids are append-only and this file asserts
    source order with no gaps.
      section 1, source 96/98    "Media type structured syntax suffixes
                                 [RFC6838] were introduced as a way for a media
                                 type to signal that it is based on another
                                 media type as its foundation." - the premise of
                                 section 3's SHOULD test and of section 6.3's
                                 registration
      section 2, source 136/138  "(Note that, while the early object/array-only
                                 form of JSON was self delimiting as well, this
                                 stopped being the case when simple values such
                                 as single numbers were made valid JSON
                                 documents.)" - THE ONLY SENTENCE OF SECTION 2
                                 THE EXTRACTION MISSED, and the only statement
                                 in either lane record about the JSON side's
                                 self-delimitation, which bears on
                                 ../design-notes.md section 8's refutation of
                                 the JSON whole-file-grammar claim
    Everything else the sweep surfaced is declared: section 1.1's boilerplate,
    the CDDL fragments and registration templates held by line range in
    schema/, Table 1, the references, the author's address, and the Abstract.
    THE ABSTRACT IS A LANE INCONSISTENCY rather than a defect: this record gives
    it no entry and records/ietf/rfc-9277 gives its Abstract an entry of its own
    (that record's first, at locator `Abstract`; its id is not spelled here
    because its bare form collides with this record's own first id and
    bin/validate warns on exactly that).
  own_text_corrected: |
    Five corrections to this record's own text, each marked [correction] in
    place with the date and what it used to claim:
      ../messages.yaml's header comment said 44/17 against its own 31/30;
      ../design-notes.md re-quoted "at least sometimes" with a capital the
        source does not have;
      the VACUITY CLAIM is overturned in four places -- this field,
        ../normative.md's header item 1 and its two section 6.3 bullet
        annotations, and ../design-notes.md section 7 defect 1 plus its two
        restatements. Pass 1 held that two of the four BCP 14 keywords are
        vacuous and therefore that half the document's normative content points
        at a non-existent referent. R-0055 is DEFERRED, not vacuous, and R-0057
        is not vacuous at all: its three cases collapse onto R-0060, which is
        universal at publication. Pass 1's own text contained the premise that
        defeats its conclusion -- it noted the collapse in the same sentence;
      ../state-machine.yaml's headline claim that "TWO OF ITS STATES ARE
        INDISTINGUISHABLE FROM THE BYTES" is withdrawn: the two load-bearing
        pairs are pairs of ARTIFACTS, not of states, and ../messages.yaml
        `completeness` already holds them;
      and ../design-notes.md Cut 3's ground 1 is narrowed from "fails the
        grammar" to "fails RFC 9804's definition of `verbatim`", because
        `verbatim = decimal ":" *OCTET` is unbounded as ABNF and the length
        semantics live in the rule's inline comment.

requirements:
  - id: "rfc-8742#R-0001"
    object: 'the normative base of the format'
    field: 'no BCP 14 keyword backs this; the force is the choice of normative anchor - the format is defined over [RFC7049], which RFC 8949 (STD 94) obsoleted ten months after publication. RFC 8949 is named nowhere in this document, and the header carries no Updates: or Obsoleted by: line'
    verb: 'none'
    actor: 'reader of this specification'
    locator: "§1"
    text: 'The Concise Binary Object Representation (CBOR) [RFC7049] can be used for serialization of data in the JSON [RFC8259] data model or in its own, somewhat expanded, data model.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement about CBOR, not a property of a sequence or of an implementation'
    status: active
  - id: "rfc-8742#R-0002"
    object: 'CBOR Sequence (the term)'
    field: 'no BCP 14 keyword backs this; the force is the document''s own statement of what it defines - zero or more, so the empty sequence is in scope from the first sentence'
    verb: 'none'
    actor: 'reader of this specification'
    locator: "§1"
    text: 'This document describes the concept and format of "CBOR Sequences", which are composed of zero or more encoded CBOR data items.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a scope statement about the document'
    status: active
  - id: "rfc-8742#R-0003"
    object: 'a CBOR Sequence consumer or producer'
    field: 'no BCP 14 keyword backs this; the force is a capability claim - the format is incrementally consumable and producible WITHOUT a streaming parser that delivers substructures. It is the only benefit the document claims for the format over an array, and it is the benefit that costs the count'
    verb: 'none'
    actor: 'implementer'
    locator: "§1"
    text: 'CBOR Sequences can be consumed (and produced) incrementally without requiring a streaming CBOR parser that is able to deliver substructures of a data item incrementally (or a streaming encoder able to encode from substructures incrementally).'
    kind: inferred
    testable: 'partial'
    testable_reason: 'testable as a property of an implementation, not of a sequence; the document defines no conformance test'
    status: active
  - id: "rfc-8742#R-0004"
    object: 'the "Media Types" registry and the "CoAP Content-Formats" subregistry'
    field: 'no BCP 14 keyword backs this; the force is a completed registration, stated in the present tense of the document and in the past tense in section 6'
    verb: 'none'
    actor: 'IANA / registrant'
    locator: "§1"
    text: 'This document defines and registers the "application/cbor-seq" media type in the "Media Types" registry along with a Constrained Application Protocol (CoAP) Content-Format identifier.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'decidable against the IANA registries, not against a sequence'
    status: active
  - id: "rfc-8742#R-0005"
    object: 'the "+cbor" structured syntax suffix'
    field: 'no BCP 14 keyword backs this; the force is a fact about another document, and it is the fact section 3''s SHOULD is analogised FROM'
    verb: 'none'
    actor: 'specification author'
    locator: "§1"
    text: 'CBOR [RFC7049] defines the "+cbor" structured syntax suffix.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'decidable against RFC 7049 / RFC 8949, not against anything here'
    status: active
  - id: "rfc-8742#R-0006"
    object: 'the "Structured Syntax Suffix Registry"'
    field: 'no BCP 14 keyword backs this; the force is a completed registration'
    verb: 'none'
    actor: 'IANA / registrant'
    locator: "§1"
    text: 'This document defines and registers the "+cbor-seq" structured syntax suffix in the "Structured Syntax Suffix Registry".'
    kind: inferred
    testable: 'partial'
    testable_reason: 'decidable against the IANA registry'
    status: active
  - id: "rfc-8742#R-0007"
    object: 'the word "byte" as this document uses it'
    field: 'no BCP 14 keyword backs this; the force is a definition. Load-bearing for a byte-layout specification: every length in the document is in octets'
    verb: 'none'
    actor: 'reader of this specification'
    locator: "§1.1"
    text: 'In this specification, the term "byte" is used in its now-customary sense as a synonym for "octet".'
    kind: inferred
    testable: 'no'
    testable_reason: 'a definition of vocabulary'
    status: active
  - id: "rfc-8742#R-0008"
    object: 'the CBOR Sequence format'
    field: 'no BCP 14 keyword backs this; the force is THE definition of the format, and it is recursive with exactly two cases. The whole of section 2 - the entire format - contains no BCP 14 keyword at all'
    verb: 'none'
    actor: 'implementer'
    locator: "§2"
    text: 'Formally, a CBOR Sequence is a sequence of bytes that is recursively defined as either of the following:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0009"
    object: 'base case of the recursive definition'
    field: 'no BCP 14 keyword backs this; the force is a definitional case. THE EMPTY BYTE STRING IS A VALID CBOR SEQUENCE - one of the three places section 2 states that a sequence cannot report its own completeness'
    verb: 'none'
    actor: 'implementer'
    locator: "§2"
    text: 'an empty (zero-length) sequence of bytes'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0010"
    object: 'inductive case of the recursive definition'
    field: 'no BCP 14 keyword backs this; the force is a definitional case. No separator, no length prefix and no terminator is admitted between the item and the rest, because anything between them would have to be part of an encoded data item'
    verb: 'none'
    actor: 'implementer'
    locator: "§2"
    text: 'the sequence of bytes making up an encoded CBOR data item [RFC7049] followed by a CBOR Sequence.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0011"
    object: 'production of a CBOR Sequence'
    field: 'no BCP 14 keyword backs this; the force is a restatement of the definition as a construction rule - concatenation IS the encoder'
    verb: 'none'
    actor: 'producer'
    locator: "§2"
    text: 'In short, concatenating zero or more encoded CBOR data items generates a CBOR Sequence.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0012"
    object: 'concatenation of sequences'
    field: 'no BCP 14 keyword backs this; the force is a closure property, and it is the sentence RFC 9277 Appendix A.2 then qualifies for LABELLED sequences. This is the well-formedness claim; RFC 9277''s is about interpretation, and both are right on their own ground'
    verb: 'none'
    actor: 'producer'
    locator: "§2"
    text: '(Consequently, concatenating zero or more CBOR Sequences also results in a CBOR Sequence.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0013"
    object: 'end-of-sequence indication'
    field: 'no BCP 14 keyword backs this; the force is an explicit ABSENCE of a mechanism, stated flatly in five words. Second of the three places section 2 states that a sequence cannot report its own completeness'
    verb: 'none'
    actor: 'implementer'
    locator: "§2"
    text: 'There is no end-of-sequence indicator.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0014"
    object: 'the alternative to a sequence'
    field: 'no BCP 14 keyword backs this; the force is the document''s own recommendation of a DIFFERENT representation, in a parenthesis - a single definite- or indefinite-length array. The definite-length head states n and uses no tag, so it is as tag-free as the sequence is'
    verb: 'may actually be'
    actor: 'specification author'
    locator: "§2"
    text: '(If one is desired, CBOR encoding an array of the CBOR data model values being encoded, employing either a definite or an indefinite length encoding, as a single CBOR data item may actually be the more appropriate representation.)'
    kind: inferred
    testable: 'no'
    testable_reason: 'a drafting recommendation addressed to a specification author, with no decision procedure'
    status: active
  - id: "rfc-8742#R-0015"
    object: 'inter-item bytes'
    field: 'no BCP 14 keyword backs this; the force is a contrast with RFC 7464 that doubles as a prohibition by construction: no marker. It is also what RFC 7464''s marker buys and this format does not - RESYNCHRONISATION after a malformed item'
    verb: 'none'
    actor: 'producer'
    locator: "§2"
    text: 'CBOR Sequences, unlike JSON Text Sequences [RFC7464], do not use a marker between items.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0016"
    object: 'self-delimitation of an encoded item'
    field: 'no BCP 14 keyword backs this; the force is the justification for the absence of a marker. It holds only for WELL-FORMED items, which the next paragraph concedes - the claim and its counterexample are two paragraphs apart'
    verb: 'can always be'
    actor: 'implementer'
    locator: "§2"
    text: 'This is possible because CBOR-encoded data items are self delimiting and the end can always be calculated.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'true of well-formed items only; the document states the exception itself'
    status: active
  - id: "rfc-8742#R-0017"
    object: 'the decoding procedure'
    field: 'no BCP 14 keyword backs this; the force is the head of the only decoding rule the document gives'
    verb: 'none'
    actor: 'decoder'
    locator: "§2"
    text: 'Decoding a CBOR Sequence works as follows:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0018"
    object: 'decoding the empty sequence'
    field: 'no BCP 14 keyword backs this; the force is a decoding case. Third of the three places section 2 states that a sequence cannot report its own completeness: an empty file decodes successfully to zero values, and is indistinguishable from a fully truncated one and from one never written'
    verb: 'none'
    actor: 'decoder'
    locator: "§2"
    text: 'If the CBOR Sequence is an empty sequence of bytes, the result is an empty sequence of CBOR data model values.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0019"
    object: 'decoding a non-empty sequence'
    field: 'LOWERCASE "must", and deliberately so under section 1.1''s BCP 14 clause: keywords bind "when, and only when, they appear in all capitals". So the ONE sentence that states how to decode the format is NOT a normative requirement. bin/bcp14-count does not count it and neither does this entry'
    verb: 'must (lower case)'
    actor: 'decoder'
    locator: "§2"
    text: 'Otherwise, one must decode a single CBOR data item from the bytes of the CBOR Sequence and insert the resulting CBOR data model value at the start of the result of repeating this decoding process recursively with the remaining bytes.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0020"
    object: 'a streaming decoder'
    field: 'no BCP 14 keyword backs this; the force is a consequence of the recursive rule, in a parenthesis - emit each value as soon as its bytes are available'
    verb: 'would'
    actor: 'decoder'
    locator: "§2"
    text: '(A streaming decoder would therefore simply deliver zero or more CBOR data model values, each as soon as the bytes making it up are available.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-8742#R-0021"
    object: 'the cost of one malformed item'
    field: 'no BCP 14 keyword backs this; the force is a consequence of there being no marker: ONE CORRUPT ENTRY COSTS THE TAIL, not just the entry. This is the durability cost a marker-separated format does not pay'
    verb: 'is not possible'
    actor: 'decoder'
    locator: "§2"
    text: 'This means that if any data item in the sequence is not well formed, it is not possible to reliably decode the rest of the sequence.'
    kind: inferred
