      note: "read only .cache/rfc-8742.txt for every claim about RFC 8742 - never summary.md, never another agent's output. The two summaries in this lane were read ONLY to know what had already been found, and §8 of design-notes.md re-tests each of their claims against the source and records three REFUTATIONS. Every verbatim block was lifted from the cache by line range by script, never retyped, and every prose span was verified mechanically rather than by eye: 61 of 61 requirement texts and 63 of 63 normative spans contiguous in the whitespace-normalised source with BOTH ENDS inside their locator's section (0 failures); 6 of 6 schema regions byte-identical with all 6 declared digests verifying under the convention sha256-of-lines-joined-by-newline-with-no-trailing-newline AND under none of the alternatives; 3 of 3 dedent round-trips; 5 of 5 source vectors exact dedented slices; 11 of 11 derived fixtures executed through a CBOR checker written for this pass; 112 quoted spans across the YAML artifacts and 142 across the markdown artifacts checked verbatim. THE QUOTE CHECKS CAUGHT FOUR ELISIONS AND TWO INEXACT QUOTES IN THIS EXTRACTION'S OWN PROSE, every one of them corrected in place rather than left: an elided §4.1 quote in examples/vectors.yaml, an elided §3 quote in distilled/README.md, two elided quotes and one inexact quote in messages.yaml, and one elided §4.2 quote in requirements.yaml. One further defect of our own was found and fixed mechanically: the messages.yaml locator join was first written by eye as 44/17 and recomputed from the constrained_by lists as 31/30, the first count having included prose mentions of an id. The source itself needed no transformation: 0 form feeds, 0 page footers, 0 lines with trailing whitespace, 0 asides, 0 healed hyphenations. No profile is declared and every reviewed_by is left empty: passes 2 (verify) and 3 (cross-check) have not run."
    - pass: verify
