      coverage: "[cross-check] 2026-10-21, pass 3: 63 -> 65 and 11 -> 12 below; pass 1 wrote 63 across 11, then pass 2 added the two `no id` bullets and did not carry the arithmetic. 65 verbatim spans across 12 locator labels - the 11 sections (§1, §1.1, §2, §3, §4.1-§4.3, §5, §6.1-§6.3) plus the Abstract's first half, with all 3 CDDL fragments, both §4.2 instances, Table 1 and both IANA registration templates reproduced in fenced blocks with their source line ranges. All 65 re-confirmed at pass 3 as contiguous substrings of the RAW whitespace-normalised source AND as starting and ending inside their locator's section, 0 failures; 61 carry a primary R- id, each labelled exactly once and strictly ascending, and the other 4 are the Abstract fragment, §1.1's boilerplate and the two `no id` bullets. NO TRANSFORMATION OF ANY KIND was applied and the file says so: the source has 0 form feeds, 0 page footers, 0 lines with trailing whitespace and 0 asides, so there is no page decoration to remove and no aside bar to strip. Three hyphenation breaks exist in the source (lines 16/17, 373/374, 393/394) and NONE falls inside a quoted span, so no sentence needed splitting; the two inside §6.3 and §7.1 are carried verbatim by line range in schema/registrations.txt instead. The cached rendering begins with a UTF-8 BOM alone on line 1, which is part of the hashed bytes and part of no span. §7, the Acknowledgements and the Author's Address are dropped per the skill, with the reference-classification facts moved to design-notes.md because they bear on citation rather than conformance"
