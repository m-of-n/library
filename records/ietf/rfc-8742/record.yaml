  not_applicable:
    - kind: protocol
      reason: "RFC 8742 defines no exchange, no role and no message - it defines one byte layout whose entire content is the absence of a layout, plus three out-of-band registrations. Measured over the whole 462-line source at this pass: `role` 0 occurrences, `party` 0, `client` 0, `server` 0, `sender` 0, `receiver` 0, `recipient` 0, `peer` 0, `endpoint` 0, `handshake` 0, `exchange` 0, `message` 0, `negotiat*` 0, `session` 0, `connection` 0 - all re-derived whole-word and case-insensitive at pass 3, and 0 as substrings too. `protocol` occurs ONCE, inside \"Constrained Application Protocol (CoAP)\" in §1, and `request` occurs ONCE, at SOURCE LINE 6 - \"Request for Comments: 8742\", the RFC's own masthead. [cross-check] 2026-10-21, pass 3: this reason said the two occurred \"both inside \"Constrained Application Protocol (CoAP)\" in §1\"; the counts were right and the attribution wrong for `request`, which is not in §1 at all. The N/A verdict is unaffected and strengthened - the document's one `request` is bibliographic. distilled/README.md carried the same sentence and is corrected too. The only parties the document names are a decoder, a producer, an application and a specification author, and §3's one sentence about an application - \"Applications encountering a \"+cbor-seq\" media type can then either simply use generic processing if all they need is a generic view of the CBOR Sequence or use generic CBOR Sequence tools for initial parsing and then implement their own specific processing on top of that generic parsing tool.\" - is a permission about local processing, not a step in an exchange. §6's three registrations are COMPLETED and in the past tense (\"IANA has registered\", \"IANA has assigned\"); they are registry records, not procedures, and RFC 6838's and RFC 8126's policies govern and are not restated. distilled/protocol.yaml and protocol.md are therefore absent rather than stubbed. NOTE that state-machine is deliberately NOT declared not_applicable, on a test stated in that file's header; the two verdicts were reached separately and differ."
