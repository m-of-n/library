    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "61 entries R-0001 to R-0061 in source order, no gaps: 4 stated, 57 inferred. source and extracted keyword counts both 4 and AGREEING (MUST 1, SHOULD 3), with a 4462-character reconciliation written anyway (pass 1 measured 3536; pass 2 appended its vacuity correction to the field and the figure was not carried - recounted from the parsed scalar at pass 3) because 4 is misleading in TWO directions. Where the four are: none constrains the format - R-0026 (SHOULD) binds a specification author choosing a media-type suffix on a test that has no decision procedure, R-0044 (MUST) is about not crashing, and R-0055 (SHOULD) is DEFERRED - §6.1 registers application/cbor-seq with \"Fragment identifier considerations: N/A\" and §6.3 calls it absent with a temporal qualifier (R-0056 holds that sentence verbatim, capital and all), so it binds if and when a syntax is registered - while R-0057 (SHOULD) is not vacuous at all, its three cases collapsing onto R-0060, which is universal and determinate at publication and is the only one of the four with an applicable effect on the day the RFC shipped. [cross-check] 2026-10-21, pass 3: this sentence read \"R-0055 and R-0057 (SHOULD) are VACUOUS AT PUBLICATION by the document's own admission\". Pass 2 overturned the vacuity claim in four places and this was one of six sites it missed; the others were three `field` values in distilled/requirements.yaml and two notes in distilled/messages.yaml, all corrected at pass 3. §2 - the entire format - carries no BCP 14 keyword at all. What the document says in LOWER CASE instead: the one sentence that states how to decode the format (R-0019, \"one must decode a single CBOR data item\") and \"decoders must operate on input that is assumed to be untrusted\" (R-0043), the sentence immediately before the only uppercase MUST; §1.1 binds keywords \"when, and only when, they appear in all capitals\", so neither is counted. What was counted instead: every definitional case of §2's recursive definition and every step of its decoding rule, every explicit absence or disclaimer of capability, every registration field value in §6.1 and §6.3 that carries a claim, and the lower-case force words the document does use. §1.1's BCP 14 boilerplate is deliberately never quoted here - bin/validate counts texts with stripping off, so quoting it would add 11 phantom keywords and the extraction would read 15 against a source of 4; it is quoted in normative.md, which nothing counts"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "3 verbatim and 3 derived. RFC 8742 SHIPS NO GRAMMAR FOR THE FORMAT IT SPECIFIES and says so in §4.1 - \"Currently, CDDL does not provide for unadorned CBOR Sequences as a top-level subject of a specification\" - so the verbatim captures are the document's own CDDL and its registrations rather than a grammar: all 3 CDDL fragments (cddl-fragments.cddl, §4.1 twice and §4.3) and the three registrations complete (registrations.txt: the §6.1 media type template, §6.2's Table 1, the §6.3 suffix template), lifted by line range with the RFC's three-space margin intact, each of the 6 regions carrying its source line range and its own sha256. Derived: cbor-seq.derived.abnf, the format as a grammar in TWO PRODUCTIONS of which one is a declared placeholder, because an encoded CBOR data item is length-prefixed and no ABNF can state that - the one-line first production `cbor-sequence = *encoded-cbor-data-item` is the honest statement of everything a grammar can say about this format, with the three consequences that follow; cbor-seq-container.derived.cddl, THE CENTRAL ARTIFACT, which is the top-level rule §4.1 says cannot be written, written four ways (the document's own array-plus-comment, §4.3's byte-string wrapper, §2's own definite-length array, and the indefinite-length variant excluded with reasons) each with its byte cost and what it does not bind; and a dedented CDDL companion that round-trips. No *.schema.json, and schema/README.md says why. 15 mechanical checks pass: 6 of 6 regions byte-identical to their declared ranges, 6 of 6 declared digests verifying under the stated convention AND under none of the alternatives, 3 of 3 dedent round-trips, and a completeness sweep finding 0 uncaptured CDDL rules, table rows or registration fields"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "6 structures and 37 field entries: the CBOR Sequence itself, its element, §4.3's byte-string-wrapped element, and the three IANA registration records (§6.1, §6.2's Table 1, §6.3). THE FINDING THE FILE EXISTS TO MAKE MECHANICAL: framing_bytes_contributed_by_this_document is 0, and the `framing` pseudo-field enumerates that absence clause by clause with a requirement id on each - no magic number, no file extension, no version, no length prefix, no separator or marker, no terminator, no element count, no integrity check. `constrained_by` IS used: 31 of the 61 requirements are cited by a named field and the 30 that are not are listed in requirements_no_field_cites with a reason each, the list computed mechanically and set-equal to the computed set. The split is lopsided deliberately and is itself a finding - 11 of the 30 are carried by state-machine.yaml because half of §2 is a DECODING PROCEDURE rather than a set of fields, and 9 are carried by schema/ because they are statements about a specification language. A first draft of the join counted prose mentions of an id as cites and was wrong by 12; it was recomputed from the constrained_by lists alone"
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "DERIVED. The expected not_applicable verdict was weighed and REJECTED at pass 1; pass 2 KEPT the artifact and WITHDREW the reason, and the file's header carries both - read it before citing this file, because FIVE sibling CBOR records (rfc-8949, rfc-9804, rfc-8610, rfc-9741, rfc-9682) declare this artifact not_applicable for the same class of document, all five for the same CLASS of document but on THREE DIFFERENT GROUNDS - only rfc-9804 names parsing, rfc-8949 names the decode of a single data item, rfc-8610 and rfc-9741 that matching is a predicate rather than a lifecycle, and rfc-9682 a transition period in the installed-tool population [corrected 2026-10-21, pass 3: this read 'all five on the ground that their only stateful process is PARSING', which is false of four of the five and was the ground the keep decision was argued against] - and §2 of RFC 8742 is a loop over the decode rfc-8949's record calls stateless. 1 machine, 5 states, 7 transitions, 1 absorbing error state, 0 of the states named by the source, and 0 occurrences of the word \"state\" anywhere in the 462-line source. Every state and every transition is anchored to a quoted sentence of §2. [correction] 2026-10-20, pass 2: this field used to say the artifact exists because the record's headline finding IS a state indistinguishability. It is not: of the three `indistinguishable_pairs`, only the first is a pair of STATES of this machine and it is marked distinguishable: true; the two that carry the finding are pairs of ARTIFACTS - two files, one state - and distilled/messages.yaml cbor-sequence.completeness already holds them with the same three quotations and the same three ids, with distilled/examples/vectors.yaml D-0001, D-0004 and D-0005 holding them executably. What has no other home, and is the whole reason the file stays, is `guards_the_source_does_not_supply`: no element-size bound, no element-count bound, and NO TIMEOUT ON A SUSPENDED DECODER, which is a denial of service the document's only BCP 14 MUST does not reach and which is only stateable if the pause is modelled. Plus the concatenation self-loop that joins this record to records/ietf/rfc-9277. The payload is `indistinguishable_pairs`, which records that a complete log and a log truncated at an item boundary are the same state, and that a sequence never written and one fully truncated are the same bytes. Also carries what the machine cannot decide (5 items) and the guards the source does not supply (no element-size bound, no element-count bound, no timeout on a paused decoder - so an unbounded pause on a never-completed element is the obvious denial of service and the document does not address it), plus what §4.3's wrapper changes about the machine and what it does not"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: "16 vectors in TWO CLASSES, and the classes are load-bearing. V-0001 to V-0005 are the source's own, lifted from the cache by line range by script and all five re-verified as exact dedented contiguous slices at their declared ranges - and FIVE IS EVERY EXAMPLE RFC 8742 PRINTS: three CDDL fragments and two lines of diagnostic notation. D-0001 to D-0011 are DERIVED - OURS, each executed through a CBOR well-formedness checker written for this pass and each carrying the result the checker actually returned, not a predicted one. THE FINDING: for a specification whose entire content is a claim about byte concatenation, THE DOCUMENT PRINTS ZERO HEX OCTETS, so every conformance test for RFC 8742 is ours and under R-O-03 must be marked so - which is what the D- prefix is for. The pair to read first is D-0004 (sequence with the tail removed: VALID, no error) against D-0006 (array with the tail removed: MALFORMED): the same deletion is silent in a sequence and loud in a definite-length array, and the difference is one byte of head. The pair to read second is D-0007 against D-0009: one corrupted byte destroys the tail of a bare sequence and costs one element of a byte-string-wrapped one, with D-0010 showing where that stops. D-0001 and D-0005 are deliberately the same bytes, because that duplication is the finding"
      reviewed_by: ""
