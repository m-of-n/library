      effort: max
      date: "2026-10-20"
      note: "RE-DERIVED rather than taken from pass 1. bin/bcp14-count -> 4 (MUST 1, SHOULD 3), AGREES; and the boilerplate claim checks independently, since a raw grep of the all-capitals keyword forms gives 15, so section 1.1 holds exactly the 11 phantom keywords reconciliation says it does. ALL 61 requirement texts are contiguous verbatim spans of the RAW whitespace-normalised source - none needs any transformation, which is this record's distinguishing claim. bin/check-locators clean (61 of 61 contained, 0 unresolvable). Word-break census reproduces at 3, with none inside a quoted span. THE ID-JOIN AUDIT PASS 1 ASKED FOR, RE-RUN INDEPENDENTLY: 243 citations in all four spellings resolved back to their own entries and the pairs read - ZERO WRONG, against six wrong ids and five wrong ranges in the sibling record. Three structural reasons it is clean, and they are the sibling's missing properties: no two of the 61 requirements share a text, so a wrong id cannot match the quoted words; all 61 ids are labelled exactly once in normative.md and the primary-id sequence down that file is strictly ascending; and every locator's id range is contiguous. FIVE CORRECTIONS TO THIS RECORD'S OWN TEXT, each marked [correction] in place: (1) messages.yaml's top-of-file comment still said '44 of the 61 ... the 17 that are not' - pass 1's OWN note records recomputing that join to 31/30, so the fix had landed in the locator_join and counts blocks and not in the header a reader sees first; (2) design-notes.md re-quoted 'at least sometimes' with a capital the source does not have, which the whole-lane case-insensitive audit found as its ONLY hit across 1628 quoted runs; (3) THE VACUITY CLAIM IS OVERTURNED in four places - R-0055 is DEFERRED, not vacuous ('at the time of publication of this document' is a temporal qualifier), and R-0057 is not vacuous at all, since its three cases collapse onto R-0060, which is universal and determinate at publication; pass 1 noted that collapse in the same sentence as the claim it defeats, and calling R-0055 vacuous needed a premise about RFC 6838 that is unverifiable here because RFC 6838 is neither a record nor cached. The replacement defect is that sections 6.1 and 6.3 register CONTRADICTORY fragment-identifier dispositions for the same format; (4) state-machine.yaml's headline 'TWO OF ITS STATES ARE INDISTINGUISHABLE FROM THE BYTES' is withdrawn - two of the three pairs are pairs of ARTIFACTS, not of states, and messages.yaml completeness plus vectors D-0001/D-0004/D-0005 already hold the finding, so the claim that an N/A 'would have lost it' is withdrawn too; (5) Cut 3's ground 1 is narrowed from 'fails the grammar' to 'fails RFC 9804's definition of verbatim', because verbatim = decimal ':' *OCTET is unbounded as ABNF. TWO STATEMENTS WITH NO REQUIREMENT ENTRY, found by a sentence-level coverage sweep: section 1's characterisation of what a structured syntax suffix is for, and section 2's parenthesis about JSON's self-delimitation - THE ONLY SENTENCE OF SECTION 2 THE EXTRACTION MISSED, and the only statement in this lane about the JSON side, which bears on design-notes.md section 8's refutation. Both now bullets in normative.md marked 'no id'; no id minted, because ids are append-only and the file asserts source order with no gaps. VERDICTS: the state machine KEPT but as the lane's outlier, for one guard (no timeout on a suspended decoder) and one self-loop, against FIVE sibling CBOR records that declare the artifact N/A because their only stateful process is parsing; Cut 3's option-1 claim UPHELD and strengthened, since RFC 9804 section 7.1's start production sexp = *whitespace value *whitespace admits exactly one value, so neither transport is appendable; the vacuity claim OVERTURNED; and all three of pass 1's refutations CONFIRMED. Still no profile and every reviewed_by empty: pass 3 (cross-check) has not run."
status: summarized
usefulness:
  verdict: useful
  reason: >
    Framing for concatenated items: how a log or stream of statements is carried
    without an outer array — and, read closely, why it should often be the outer
    array instead. §2 states three times over that a CBOR Sequence cannot report
    its own completeness (no end-of-sequence indicator; a dropped tail is
    undetectable; the empty byte string is a valid sequence), and §5 states that
    per-element COSE does not bind the relationship between elements. Those two
    facts together are what option 5's export profile has to answer, and §2's own
    parenthetical names the fix: a definite-length array, which is equally
    tag-free. §4.1 adds that CDDL cannot express the container at top level, so
    whichever we choose is specified in prose until someone derives the schema.
  assessed: "2026-10-20"
confidence: high
owner: S1
