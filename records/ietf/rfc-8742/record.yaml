  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "63 verbatim spans across 11 locators (§1, §1.1, §2, §3, §4.1-§4.3, §5, §6.1-§6.3) plus the Abstract's first half, with all 3 CDDL fragments, both §4.2 instances, Table 1 and both IANA registration templates reproduced in fenced blocks with their source line ranges. All 63 confirmed contiguous substrings of the whitespace-normalised source AND confirmed to start and end inside their locator's section, 0 failures. NO TRANSFORMATION OF ANY KIND was applied and the file says so: the source has 0 form feeds, 0 page footers, 0 lines with trailing whitespace and 0 asides, so there is no page decoration to remove and no aside bar to strip. Three hyphenation breaks exist in the source (lines 16/17, 373/374, 393/394) and NONE falls inside a quoted span, so no sentence needed splitting; the two inside §6.3 and §7.1 are carried verbatim by line range in schema/registrations.txt instead. The cached rendering begins with a UTF-8 BOM alone on line 1, which is part of the hashed bytes and part of no span. §7, the Acknowledgements and the Author's Address are dropped per the skill, with the reference-classification facts moved to design-notes.md because they bear on citation rather than conformance"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "61 entries R-0001 to R-0061 in source order, no gaps: 4 stated, 57 inferred. source and extracted keyword counts both 4 and AGREEING (MUST 1, SHOULD 3), with a 3536-character reconciliation written anyway because 4 is misleading in TWO directions. Where the four are: none constrains the format - R-0026 (SHOULD) binds a specification author choosing a media-type suffix on a test that has no decision procedure, R-0044 (MUST) is about not crashing, and R-0055 and R-0057 (SHOULD) are VACUOUS AT PUBLICATION by the document's own admission, because §6.1 registers application/cbor-seq with \"Fragment identifier considerations: N/A\" and §6.3 then states that no fragment identification syntax is defined. §2 - the entire format - carries no BCP 14 keyword at all. What the document says in LOWER CASE instead: the one sentence that states how to decode the format (R-0019, \"one must decode a single CBOR data item\") and \"decoders must operate on input that is assumed to be untrusted\" (R-0043), the sentence immediately before the only uppercase MUST; §1.1 binds keywords \"when, and only when, they appear in all capitals\", so neither is counted. What was counted instead: every definitional case of §2's recursive definition and every step of its decoding rule, every explicit absence or disclaimer of capability, every registration field value in §6.1 and §6.3 that carries a claim, and the lower-case force words the document does use. §1.1's BCP 14 boilerplate is deliberately never quoted here - bin/validate counts texts with stripping off, so quoting it would add 11 phantom keywords and the extraction would read 15 against a source of 4; it is quoted in normative.md, which nothing counts"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "3 verbatim and 3 derived. RFC 8742 SHIPS NO GRAMMAR FOR THE FORMAT IT SPECIFIES and says so in §4.1 - \"Currently, CDDL does not provide for unadorned CBOR Sequences as a top-level subject of a specification\" - so the verbatim captures are the document's own CDDL and its registrations rather than a grammar: all 3 CDDL fragments (cddl-fragments.cddl, §4.1 twice and §4.3) and the three registrations complete (registrations.txt: the §6.1 media type template, §6.2's Table 1, the §6.3 suffix template), lifted by line range with the RFC's three-space margin intact, each of the 6 regions carrying its source line range and its own sha256. Derived: cbor-seq.derived.abnf, the format as a grammar in TWO PRODUCTIONS of which one is a declared placeholder, because an encoded CBOR data item is length-prefixed and no ABNF can state that - the one-line first production `cbor-sequence = *encoded-cbor-data-item` is the honest statement of everything a grammar can say about this format, with the three consequences that follow; cbor-seq-container.derived.cddl, THE CENTRAL ARTIFACT, which is the top-level rule §4.1 says cannot be written, written four ways (the document's own array-plus-comment, §4.3's byte-string wrapper, §2's own definite-length array, and the indefinite-length variant excluded with reasons) each with its byte cost and what it does not bind; and a dedented CDDL companion that round-trips. No *.schema.json, and schema/README.md says why. 15 mechanical checks pass: 6 of 6 regions byte-identical to their declared ranges, 6 of 6 declared digests verifying under the stated convention AND under none of the alternatives, 3 of 3 dedent round-trips, and a completeness sweep finding 0 uncaptured CDDL rules, table rows or registration fields"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "6 structures and 37 field entries: the CBOR Sequence itself, its element, §4.3's byte-string-wrapped element, and the three IANA registration records (§6.1, §6.2's Table 1, §6.3). THE FINDING THE FILE EXISTS TO MAKE MECHANICAL: framing_bytes_contributed_by_this_document is 0, and the `framing` pseudo-field enumerates that absence clause by clause with a requirement id on each - no magic number, no file extension, no version, no length prefix, no separator or marker, no terminator, no element count, no integrity check. `constrained_by` IS used: 31 of the 61 requirements are cited by a named field and the 30 that are not are listed in requirements_no_field_cites with a reason each, the list computed mechanically and set-equal to the computed set. The split is lopsided deliberately and is itself a finding - 11 of the 30 are carried by state-machine.yaml because half of §2 is a DECODING PROCEDURE rather than a set of fields, and 9 are carried by schema/ because they are statements about a specification language. A first draft of the join counted prose mentions of an id as cites and was wrong by 12; it was recomputed from the constrained_by lists alone"
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "DERIVED. The expected not_applicable verdict was weighed and REJECTED at pass 1; pass 2 KEPT the artifact and WITHDREW the reason, and the file's header carries both - read it before citing this file, because FIVE sibling CBOR records (rfc-8949, rfc-9804, rfc-8610, rfc-9741, rfc-9682) declare this artifact not_applicable for the same class of document, all five on the ground that their only stateful process is PARSING, and §2 of RFC 8742 is a loop over the decode rfc-8949's record calls stateless. 1 machine, 5 states, 7 transitions, 1 absorbing error state, 0 of the states named by the source, and 0 occurrences of the word \"state\" anywhere in the 462-line source. Every state and every transition is anchored to a quoted sentence of §2. [correction] 2026-10-20, pass 2: this field used to say the artifact exists because the record's headline finding IS a state indistinguishability. It is not: of the three `indistinguishable_pairs`, only the first is a pair of STATES of this machine and it is marked distinguishable: true; the two that carry the finding are pairs of ARTIFACTS - two files, one state - and distilled/messages.yaml cbor-sequence.completeness already holds them with the same three quotations and the same three ids, with distilled/examples/vectors.yaml D-0001, D-0004 and D-0005 holding them executably. What has no other home, and is the whole reason the file stays, is `guards_the_source_does_not_supply`: no element-size bound, no element-count bound, and NO TIMEOUT ON A SUSPENDED DECODER, which is a denial of service the document's only BCP 14 MUST does not reach and which is only stateable if the pause is modelled. Plus the concatenation self-loop that joins this record to records/ietf/rfc-9277. The payload is `indistinguishable_pairs`, which records that a complete log and a log truncated at an item boundary are the same state, and that a sequence never written and one fully truncated are the same bytes. Also carries what the machine cannot decide (5 items) and the guards the source does not supply (no element-size bound, no element-count bound, no timeout on a paused decoder - so an unbounded pause on a never-completed element is the obvious denial of service and the document does not address it), plus what §4.3's wrapper changes about the machine and what it does not"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: "16 vectors in TWO CLASSES, and the classes are load-bearing. V-0001 to V-0005 are the source's own, lifted from the cache by line range by script and all five re-verified as exact dedented contiguous slices at their declared ranges - and FIVE IS EVERY EXAMPLE RFC 8742 PRINTS: three CDDL fragments and two lines of diagnostic notation. D-0001 to D-0011 are DERIVED - OURS, each executed through a CBOR well-formedness checker written for this pass and each carrying the result the checker actually returned, not a predicted one. THE FINDING: for a specification whose entire content is a claim about byte concatenation, THE DOCUMENT PRINTS ZERO HEX OCTETS, so every conformance test for RFC 8742 is ours and under R-O-03 must be marked so - which is what the D- prefix is for. The pair to read first is D-0004 (sequence with the tail removed: VALID, no error) against D-0006 (array with the tail removed: MALFORMED): the same deletion is silent in a sequence and loud in a definite-length array, and the difference is one byte of head. The pair to read second is D-0007 against D-0009: one corrupted byte destroys the tail of a bare sequence and costs one element of a byte-string-wrapped one, with D-0010 showing where that stops. D-0001 and D-0005 are deliberately the same bytes, because that duplication is the finding"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the completeness answer with its three source statements and three fixtures; the one-sentence fix it implies for the export profile; an artifact-to-container mapping over all of ARCH-0001 §4.1 whose shape is that everything of ours except the append-only log wants an ARRAY and the log wants the sequence for exactly one reason; MD-3 clause by clause, where the header-by-header mapping is MEASURABLY EMPTY (tag 0 occurrences, header 0, YAML 0, canonical 0, determinis* 0, normaliz* 0) and the measurement is the datum; all six canonical-encoding conditions, including the new claim that the empty-sequence ambiguity is a condition-(1) failure at the FILE level that no condition covers; FIVE named cuts against MD-3, four naming the DEC-002 option they favour and one stated in option 5's favour, with Cut 3 resting on two productions of rfc-9804's verbatim canonical ABNF that this library already holds (`c-sexp = c-string / (\"(\" *c-sexp \")\")` detects the truncation, and `verbatim = decimal \":\" *OCTET` makes §4.3's wrapper mandatory by grammar); 6 source defects; and an explicit confirmed / narrowed / REFUTED audit of summary.md in which three claims are refuted - that the extraction would be a four-row file (it is 61), that there was nothing to make a fixture from (eleven were derivable), and that option 3 has a grammar for the whole file (RFC 7464 is not held in this library, so that half of the summary's Cut 2 is an assertion about an unread document). Every quotation of ARCH-*, DEC-*, MD-3, ADR-*, PLAN-*, DECISIONS-* and R-M-* / R-O-* / R-I-* is marked [unverifiable-here]: this library is standalone by design and holds none of those files"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "RFC 8742 defines no exchange, no role and no message - it defines one byte layout whose entire content is the absence of a layout, plus three out-of-band registrations. Measured over the whole 462-line source at this pass: `role` 0 occurrences, `party` 0, `client` 0, `server` 0, `sender` 0, `receiver` 0, `recipient` 0, `peer` 0, `endpoint` 0, `handshake` 0, `exchange` 0, `message` 0, `negotiat*` 0, `session` 0, `connection` 0; `request` occurs ONCE and `protocol` ONCE, both inside \"Constrained Application Protocol (CoAP)\" in §1. The only parties the document names are a decoder, a producer, an application and a specification author, and §3's one sentence about an application - \"Applications encountering a \"+cbor-seq\" media type can then either simply use generic processing if all they need is a generic view of the CBOR Sequence or use generic CBOR Sequence tools for initial parsing and then implement their own specific processing on top of that generic parsing tool.\" - is a permission about local processing, not a step in an exchange. §6's three registrations are COMPLETED and in the past tense (\"IANA has registered\", \"IANA has assigned\"); they are registry records, not procedures, and RFC 6838's and RFC 8126's policies govern and are not restated. distilled/protocol.yaml and protocol.md are therefore absent rather than stubbed. NOTE that state-machine is deliberately NOT declared not_applicable, on a test stated in that file's header; the two verdicts were reached separately and differ."
