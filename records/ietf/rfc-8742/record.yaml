usefulness:
  verdict: useful
  reason: >
    Framing for concatenated items: how a log or stream of statements is carried
    without an outer array — and, read closely, why it should often be the outer
    array instead. §2 states three times over that a CBOR Sequence cannot report
    its own completeness (no end-of-sequence indicator; a dropped tail is
    undetectable; the empty byte string is a valid sequence), and §5 states that
    per-element COSE does not bind the relationship between elements. Those two
    facts together are what option 5's export profile has to answer, and §2's own
    parenthetical names the fix: a definite-length array, which is equally
    tag-free. §4.1 adds that CDDL cannot express the container at top level, so
    whichever we choose is specified in prose until someone derives the schema.
  assessed: "2026-10-20"
