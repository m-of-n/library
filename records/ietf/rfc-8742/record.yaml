relations:
  # Added 2026-10-20 by the summary pass (library#39 Tier 2, CBOR-structure lane).
  # Four of the five edges exist because this document does NOT cite the thing a
  # reader needs — the rfc-9679/rfc-8230 pattern, where the library supplies the
  # reachability the source withholds.
  see_also:
    # RFC 8742 §6.1's own media-type template says "Magic number(s): N/A".
    # RFC 9277 §2.3 defines one for exactly this format (tag 55800) and carries
    # no `Updates: 8742`. Neither document points at the other on this point.
    - rfc-9277
    # §2 and §5 define the sequence and its security considerations in terms of
    # [RFC7049], which RFC 8949 obsoleted nine months after publication. RFC 8949
    # is named nowhere in this document; `rfc-8949 supersedes rfc-7049` already
    # exists, and this edge is what makes the current spec reachable from here.
    - rfc-8949
    # §5's COSE reference is [RFC8152], obsoleted by RFC 9052. That sentence —
    # per-element protection does not bind "the relationship of the elements in
    # the sequence" — is the most load-bearing one in the document for MD-3's
    # "COSE export only", so the current COSE spec has to be reachable from it.
    - rfc-9052
    # §4.1 and §4.3 use `.cborseq` and `.cbor` (RFC 8610 §3.8.4), and §4.1 is
    # where CDDL's inability to state a top-level CBOR Sequence is recorded.
    - rfc-8610
    # The IANA CBOR Tags registry carries tag 63, "Encoded CBOR Sequence
    # RFC 8742", referenced to draft-bormann-cbor-notable-tags-02 §2.1 — a code
    # point this RFC never requested. The media-type-versus-tag finding rests on
    # that row, which `iana-cbor-tags` holds verbatim.
    - iana-cbor-tags
  part_of:
    - ietf-cbor-wg
bears_on:
  - DEC-002
  # Widened 2026-10-20: §6 makes three registrations and none is a CBOR tag,
  # while the tag registry minted one for the concept anyway from outside the
  # RFC process. That asymmetry is R-M-12's governance argument, not DEC-002's
  # encoding argument, and the summary separates the two.
  - R-M-12
applicability:
  security: adjacent
  cryptography: adjacent
  this_project: core
topic: cbor-implementation
