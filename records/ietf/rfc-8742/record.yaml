      date: "2026-10-20"
      note: "read only .cache/rfc-8742.txt for every claim about RFC 8742 - never summary.md, never another agent's output. The two summaries in this lane were read ONLY to know what had already been found, and §8 of design-notes.md re-tests each of their claims against the source and records three REFUTATIONS. Every verbatim block was lifted from the cache by line range by script, never retyped, and every prose span was verified mechanically rather than by eye: 61 of 61 requirement texts and 63 of 63 normative spans contiguous in the whitespace-normalised source with BOTH ENDS inside their locator's section (0 failures); 6 of 6 schema regions byte-identical with all 6 declared digests verifying under the convention sha256-of-lines-joined-by-newline-with-no-trailing-newline AND under none of the alternatives; 3 of 3 dedent round-trips; 5 of 5 source vectors exact dedented slices; 11 of 11 derived fixtures executed through a CBOR checker written for this pass; 112 quoted spans across the YAML artifacts and 142 across the markdown artifacts checked verbatim. THE QUOTE CHECKS CAUGHT FOUR ELISIONS AND TWO INEXACT QUOTES IN THIS EXTRACTION'S OWN PROSE, every one of them corrected in place rather than left: an elided §4.1 quote in examples/vectors.yaml, an elided §3 quote in distilled/README.md, two elided quotes and one inexact quote in messages.yaml, and one elided §4.2 quote in requirements.yaml. One further defect of our own was found and fixed mechanically: the messages.yaml locator join was first written by eye as 44/17 and recomputed from the constrained_by lists as 31/30, the first count having included prose mentions of an id. The source itself needed no transformation: 0 form feeds, 0 page footers, 0 lines with trailing whitespace, 0 asides, 0 healed hyphenations. No profile is declared and every reviewed_by is left empty: passes 2 (verify) and 3 (cross-check) have not run."
    - pass: verify
      by: "claude-opus-5 (pass 2 of library#39 Tier 2, CBOR-structure lane; adversarial, did not extract; both lane records audited together)"
      effort: max
      date: "2026-10-20"
      note: "RE-DERIVED rather than taken from pass 1. bin/bcp14-count -> 4 (MUST 1, SHOULD 3), AGREES; and the boilerplate claim checks independently, since a raw grep of the all-capitals keyword forms gives 15, so section 1.1 holds exactly the 11 phantom keywords reconciliation says it does. ALL 61 requirement texts are contiguous verbatim spans of the RAW whitespace-normalised source - none needs any transformation, which is this record's distinguishing claim. bin/check-locators clean (61 of 61 contained, 0 unresolvable). Word-break census reproduces at 3, with none inside a quoted span. THE ID-JOIN AUDIT PASS 1 ASKED FOR, RE-RUN INDEPENDENTLY: citations in all four spellings resolved back to their own entries and the pairs read - ZERO WRONG (pass 2 put the count at 243; [cross-check] 2026-10-21, pass 3 measured 344 with `bin/check-id-joins --resolve` on the record as it received it, 0 dangling, 260 distinct (file, id) pairs, and 555 including the bare and D- spellings the tool does not scan; the tool reads 352 once pass 3's own notes are counted - no counting rule reaches 243, and the bare-V- blind spot is where pass 3 found two wrong ids in schema/), against six wrong ids and five wrong ranges in the sibling record. Three structural reasons it is clean, and they are the sibling's missing properties: no two of the 61 requirements share a text, so a wrong id cannot match the quoted words; all 61 ids are labelled exactly once in normative.md and the primary-id sequence down that file is strictly ascending; and every locator's id range is contiguous. FIVE CORRECTIONS TO THIS RECORD'S OWN TEXT, each marked [correction] in place: (1) messages.yaml's top-of-file comment still said '44 of the 61 ... the 17 that are not' - pass 1's OWN note records recomputing that join to 31/30, so the fix had landed in the locator_join and counts blocks and not in the header a reader sees first; (2) design-notes.md re-quoted 'at least sometimes' with a capital the source does not have, which the whole-lane case-insensitive audit found as its ONLY hit across 1628 quoted runs [corrected 2026-10-21, pass 3: NOT the only hit, and this record's own design-notes already recorded that. The whole-span lane audit found three more altered capitals or terminal stops, one of them in this record's summary.md; and the 1628 figure states no method and is not reproducible]; (3) THE VACUITY CLAIM IS OVERTURNED in four places - R-0055 is DEFERRED, not vacuous (R-0056's temporal qualifier, held verbatim there), and R-0057 is not vacuous at all, since its three cases collapse onto R-0060, which is universal and determinate at publication; pass 1 noted that collapse in the same sentence as the claim it defeats, and calling R-0055 vacuous needed a premise about RFC 6838 that is unverifiable here because RFC 6838 is neither a record nor cached. The replacement defect is that sections 6.1 and 6.3 register CONTRADICTORY fragment-identifier dispositions for the same format; (4) state-machine.yaml's headline 'TWO OF ITS STATES ARE INDISTINGUISHABLE FROM THE BYTES' is withdrawn - two of the three pairs are pairs of ARTIFACTS, not of states, and messages.yaml completeness plus vectors D-0001/D-0004/D-0005 already hold the finding, so the claim that an N/A 'would have lost it' is withdrawn too; (5) Cut 3's ground 1 is narrowed from 'fails the grammar' to 'fails RFC 9804's definition of verbatim', because verbatim = decimal ':' *OCTET is unbounded as ABNF. TWO STATEMENTS WITH NO REQUIREMENT ENTRY, found by a sentence-level coverage sweep: section 1's characterisation of what a structured syntax suffix is for, and section 2's parenthesis about JSON's self-delimitation - THE ONLY SENTENCE OF SECTION 2 THE EXTRACTION MISSED, and the only statement in this lane about the JSON side, which bears on design-notes.md section 8's refutation. Both now bullets in normative.md marked 'no id'; no id minted, because ids are append-only and the file asserts source order with no gaps. VERDICTS: the state machine KEPT but as the lane's outlier, for one guard (no timeout on a suspended decoder) and one self-loop, against FIVE sibling CBOR records that declare the artifact N/A for the same class of document, on three different grounds of which only rfc-9804's is parsing [corrected 2026-10-21, pass 3]; Cut 3's option-1 claim UPHELD and strengthened, since RFC 9804 section 7.1's start production sexp = *whitespace value *whitespace admits exactly one value, so neither transport is appendable; the vacuity claim OVERTURNED; and all three of pass 1's refutations CONFIRMED. Still no profile and every reviewed_by empty: pass 3 (cross-check) has not run."
    - pass: cross-check
      by: "claude-opus-5 (pass 3 of 3, independent; did not extract and did not verify; plus a lane-wide whole-span quote and cross-record audit spanning rfc-8742 and rfc-9277)"
      effort: max
