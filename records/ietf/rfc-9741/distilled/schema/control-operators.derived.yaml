# =====================================================================
# control-operators.derived.yaml
#
# DERIVED -- NOT verbatim. This table is this library's rendering, not
# RFC 9741's. Do not cite it as the standard's text. Every `quote` field
# below IS the source's own wording, marked as such; everything else --
# the predicate forms, the `text_identity` verdicts, the `kind` field, the
# notes -- is ours, written from the prose of Sections 2 and 3.
#
# Companion to records/ietf/rfc-8610/distilled/schema/control-operators.derived.yaml,
# which holds RFC 8610's fourteen. THE TWO SETS ARE DISJOINT: all fourteen
# operators below are NEW. See `registry_state` for what that does to the
# rfc-8610 file's claim that all other names are Unassigned.
#
# Source: RFC 9741, Sections 2 and 3 (and Section 4 for the registration),
#   cached source sha256
#   3234aeea39d01b7c1c8e9c70d4d7dc8745852e0b6edbea167a3e55b91e7a9ee3
# =====================================================================
record: rfc-9741
artifact: control-operators
claim: derived
reviewed_by: ""

# ---------------------------------------------------------------------
# What a reader of this file most likely came for.
# ---------------------------------------------------------------------
headline:
  new_operators: 14
  already_in_rfc_8610: 0
  overlap_with_rfc_8610: "none. RFC 8610 registers .size .bits .regexp .cbor .cborseq .within .and .lt .le .gt .ge .eq .ne .default; this document registers fourteen disjoint names"
  all_are_type_controls: true
  type_control_note: >-
    OURS, and the document never says it. A control operator can only occur
    inside RFC 8610's `type1 = type2 [S (rangeop / ctlop) S type2]`, so there
    is no such thing as a GROUP control in CDDL, and none of these fourteen
    is one. Two of them (.printf, .join) take a controller that is an ARRAY
    type, which is a different thing: the array is a type on the right-hand
    side, not a group being controlled. A control reached through a group
    entry (`grpent = [occur S] [memberkey S] type`) is still a type control
    on that entry's type.
  can_a_cddl_schema_now_state_a_unicode_normalisation_constraint: "no"
  can_it_state_a_canonical_TEXT_FORM: "yes, but only for text that is a transcoding of a byte string or of an integer"
  normalisation_evidence:
    - 'OURS, mechanical: the strings "normaliz", "normalis", "NFC", "NFD", "NFKC" and "NFKD" do not occur anywhere in the cached source. "Unicode" occurs once, in Section 2.3''s definition of %c. So do "canonical", "identity", "hash" and "digest" - zero occurrences each - which is why every `text_identity` verdict in this file is OURS and must be cited as ours.'
    - 'The document''s own statement of the absence, Section 2.4: "This control operator provides no way to constrain the use of blank space or other serialization variants in the JSON representation of the data items; restrictions on the serialization to specific variants (e.g., not providing for the addition of any insignificant blank space and prescribing an order in which map entries are serialized) could be defined in future control operators."'
    - 'The only text-identity property any operator here imposes on a text result, Section 3.1: "If the result of the concatenation is a text string, the resulting sequence of bytes only matches the target data item if that result is a valid text string (i.e., valid UTF-8)." UTF-8 VALIDITY, not a normalisation form.'
    - 'OURS, pass 2 -- the statement of the negative that survives attack. These operators DO constrain the form of their text target, and Section 2.1 says so in the document''s own words: ".b64u and .b64c only match text strings composed of the set of characters defined for each of them, respectively." .base10 likewise fixes a text form (no leading zeros, no "+", no "-0"), and .hexlc/.hexuc fix case. So the negative is NOT "no operator constrains text form". It is this: EVERY form constraint in this document arrives as a side effect of fixing a conversion to a byte string or to an integer, and therefore confines the text to an ASCII subset of 16, 32, 45 or 64 characters, or to the ten digits and a minus sign. Not one is a predicate over GENERAL text, and not one says anything about a text string''s normalisation form, its combining marks, or its equality with another text. That is why condition (6) is answerable for a hex digest -- the repertoire is ASCII, so all four normalisation forms coincide and the question is vacuous -- and unanswerable for a label.'

syntax:
  form: "target .control-operator controller"
  locator: "RFC 8610 §3.8; this document adds no syntax"
  quote: >-
    In Table 1, the column marked t is for "target type" (left-hand side),
    and the column marked c is for "controller type" (right-hand side).
  terminology_quote_first_half: >-
    In particular, with respect to control operators, "target" refers to the
    left-hand-
  terminology_quote_second_half: >-
    side operand and "controller" to the right-hand-side operand.
  terminology_quote_note: >-
    The sentence is given in two halves because the token "left-hand-side" is
    severed by the line break at source lines 133/134, so the whole sentence
    is not a contiguous span of the document. It is not healed here.
  composition:
    chaining: "still impossible -- RFC 8610's grammar admits at most one ctlop per type1"
    by_rule_name: >-
      OURS. Both of this document's worked compositions go through a RULE
      NAME, not through chaining: §2.1's `signature-for-json = text .b64u
      signature` / `signature = bytes .cbor COSE_Sign1` stacks .b64u over
      .cbor, and Figure 1 stacks .join over .base10 over a range. This
      refines rfc-8610's gap G-44 (Table 1 implies controls compose; the
      grammar forbids it): controls do not compose, they NEST through named
      rules, and the two array-controller operators here make that nesting
      the normal idiom rather than a trick.

# ---------------------------------------------------------------------
# The fourteen, in the order of Table 7 (the IANA registration).
# Tables 1, 2 and 7 give the same fourteen names in THREE different
# orders; Table 7's is used here because it is the registry's.
# ---------------------------------------------------------------------
operators:
  - name: ".b64u"
    locator: "§2.1"
    iana_entry: {name: ".b64u", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control (as all fourteen are)"
    target: "text"
    controller: "bytes"
    table2_meaning: "Base64url, no padding"
    table2_reference: "Section 5 of [RFC4648]"
    padding: "forbidden"
    strict: true
    predicate: >-
      OURS. The target is a text string drawn only from the base64url
      alphabet of RFC 4648 §5, carries no padding, and has every bit beyond
      the encoded byte string's length set to zero; the byte string it
      decodes to is a member of the controller type.
    text_identity: "injective -- exactly one text per byte string"
    quote: >-
      These control operators are "strict" in their matching, i.e., they only
      match base encodings that conform to the mandates of their defining
      documents.
    alphabet_quote: >-
      Note that this also means that .b64u and .b64c only match text strings
      composed of the set of characters defined for each of them,
      respectively.

  - name: ".b64u-sloppy"
    locator: "§2.1"
    iana_entry: {name: ".b64u-sloppy", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "bytes"
    table2_meaning: "Base64url, no padding, sloppy"
    table2_reference: "Section 5 of [RFC4648]"
    padding: "forbidden"
    strict: false
    predicate: >-
      OURS. As .b64u, except that the trailing bits beyond the encoded
      length are NOT required to be zero.
    text_identity: >-
      NOT injective, by design. Several distinct text strings decode to the
      same byte string, so a digest taken over the TEXT is not a digest of
      the value. Do not use where text is load-bearing for identity.
    quote: >-
      The additional designation "sloppy" indicates that the text string is
      not validated for any additional bits being zero, in variance to what
      is specified in the paragraph that follows Table 1 in Section 4 of
      [RFC4648].
    reading_hazard: >-
      OURS. "Table 1 in Section 4 of [RFC4648]" is RFC 4648's Table 1, not
      this document's Table 1. The document has a Table 1 of its own two
      pages earlier.

  - name: ".b64c"
    locator: "§2.1"
    iana_entry: {name: ".b64c", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "bytes"
    table2_meaning: "Base64 classic, padding"
    table2_reference: "Section 4 of [RFC4648]"
    padding: "required"
    strict: true
    predicate: >-
      OURS. The target is a text string drawn only from the base64 classic
      alphabet of RFC 4648 §4, padded to a multiple of four characters with
      "=", with trailing bits zero; it decodes to a member of the controller
      type.
    text_identity: "injective"
    naming_quote: >-
      Also, adding "c" makes sure that any decision for classic base64 is
      actively taken.

  - name: ".b64c-sloppy"
    locator: "§2.1"
    iana_entry: {name: ".b64c-sloppy", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "bytes"
    table2_meaning: "Base64 classic, padding, sloppy"
    table2_reference: "Section 4 of [RFC4648]"
    padding: "required"
    strict: false
    predicate: "OURS. As .b64c, without the trailing-bits-zero condition."
    text_identity: "NOT injective, by design -- see .b64u-sloppy"

  - name: ".b45"
    locator: "§2.1"
    iana_entry: {name: ".b45", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "bytes"
    table2_meaning: "Base45"
    table2_reference: "[RFC9285]"
    padding: "n/a"
    strict: true
    sloppy_variant: "none, and none is possible"
    predicate: >-
      OURS. The target is a base45 encoding per RFC 9285 of a byte string
      that is a member of the controller type.
    text_identity: "injective"
    quote: >-
      Base45 [RFC9285] is known to be suboptimal for use in environments with
      limited data transparency (such as URLs) but is included because of its
      close relationship to QR codes and its wide use in health informatics
      (note that base45 is strongly specified not to allow sloppy forms of
      encoding).

  - name: ".b32"
    locator: "§2.1"
    iana_entry: {name: ".b32", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "bytes"
    table2_meaning: "Base32, no padding"
    table2_reference: "Section 6 of [RFC4648]"
    padding: "forbidden"
    strict: true
    sloppy_variant: "none -- deliberately absent"
    predicate: >-
      OURS. The target is an unpadded base32 encoding (RFC 4648 §6) of a byte
      string that is a member of the controller type, with trailing bits
      zero.
    text_identity: "injective"
    absence_quote: >-
      Note that the present specification is opinionated again in not
      specifying a sloppy variant of base32 or base32hex, as no legacy use of
      sloppy base32(hex) was known at the time of writing.

  - name: ".h32"
    locator: "§2.1"
    iana_entry: {name: ".h32", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "bytes"
    table2_meaning: 'Base32 with "Extended Hex" alphabet, no padding'
    table2_reference: "Section 7 of [RFC4648]"
    padding: "forbidden"
    strict: true
    predicate: "OURS. As .b32 but over RFC 4648 §7's extended-hex alphabet."
    text_identity: "injective"
    note: >-
      OURS. The name does not contain "32hex" or "b32h"; a reader looking for
      base32hex will not find it by name. Table 2 is the only place the
      alphabet is identified.

  - name: ".hex"
    locator: "§2.1"
    iana_entry: {name: ".hex", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "bytes"
    table2_meaning: "Base16 (hex), either case"
    table2_reference: "Section 8 of [RFC4648]"
    padding: "n/a"
    strict: true
    predicate: >-
      OURS. The target is a base16 encoding (RFC 4648 §8) of a byte string
      that is a member of the controller type, in either case, and may mix
      cases within one string -- nothing in the document forbids "aB".
    source_ambiguity: >-
      OURS, pass 2. Table 2's "either case" is ambiguous and the document never
      resolves it. Reading A (taken above, and the natural one once .hexlc and
      .hexuc exist for the uniform cases): .hex is CASE-INSENSITIVE, each digit
      independently, so "aB" matches. Reading B: .hex admits exactly the two
      UNIFORM forms, all-lower or all-upper. The readings disagree about the
      size of the match set -- 2**k under A, exactly 2 under B -- and so about
      how badly .hex fails injectivity. Both make it non-injective, so nothing
      downstream in this record turns on the choice, but the fork is the
      source's and is recorded rather than hidden.
    text_identity: >-
      NOT injective. [correction, pass 2] This read "2**n distinct texts for an
      n-hex-digit value", which is wrong: only the digits a-f have case, so an
      n-digit encoding with k of its digits in a-f has 2**k matching texts
      under reading A, and 2**n only in the all-letters worst case. For a
      SHA-256 digest (64 hex digits) k is 24 on average, not 64. The conclusion
      is unchanged and the arithmetic now is not: THIS IS THE DEFAULT-LOOKING
      NAME AND IT IS THE WRONG ONE where text is load-bearing for identity;
      use .hexlc or .hexuc.

  - name: ".hexlc"
    locator: "§2.1"
    iana_entry: {name: ".hexlc", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "bytes"
    table2_meaning: "Base16 (hex), lower case"
    table2_reference: "Section 8 of [RFC4648]"
    predicate: >-
      OURS. As .hex, with every alphabetic hex digit lower case.
    text_identity: "injective -- one text per byte string"

  - name: ".hexuc"
    locator: "§2.1"
    iana_entry: {name: ".hexuc", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "bytes"
    table2_meaning: "Base16 (hex), upper case"
    table2_reference: "Section 8 of [RFC4648]"
    predicate: "OURS. As .hex, with every alphabetic hex digit upper case."
    text_identity: "injective"
    note: >-
      OURS. RFC 4648 §8's own Table 5 is upper case, so .hexuc is RFC 4648's
      base16 proper and .hexlc is the common deviation. The document does not
      say which it considers the default; there is no plain .hex16.

  - name: ".base10"
    locator: "§2.2"
    iana_entry: {name: ".base10", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "int"
    table3_meaning: "Base-ten (decimal) integer"
    table3_reference: "---"
    predicate: >-
      OURS. The target matches the I-Regexp `0|-?[1-9][0-9]*` as a whole
      string, and the integer it denotes is a member of the controller type.
    text_identity: >-
      injective. No leading zeros, no "+", and no "-0": the regexp admits
      zero only as the bare "0". This is a CANONICAL FORM for integer-valued
      text, and it is citable (§2.2) rather than invented.
    quote: >-
      Again, the specification is opinionated by only providing for integer
      numbers represented without leading zeros, i.e., the decimal integer
      numerals match the regular expression 0|-?[1-9][0-9]* (of course, this
      is further restricted by the control type).
    dialect: >-
      I-Regexp (RFC 9485), per §1.1 -- "Regular expressions mentioned in the
      text are as defined in [RFC9485]". NOT the XSD dialect RFC 8610 §3.8.3
      gives .regexp. The two dialects differ; this expression is valid in
      both.
    other_bases: >-
      none. §2.2 redirects octal, hexadecimal and binary to .printf: "See
      Section 2.3 for more flexibility and for other numeric bases such as
      octal, hexadecimal, or binary conversions."
    confusion_warning_quote: >-
      Note that this control operator governs text representations of integers
      and should not be confused with the control operators governing text
      representations of byte strings (such as .b64u).
    grammar_gap: >-
      OURS. The controller is an INT type, and nothing in the grammar enforces
      that: `text .base10 "x"` parses. Nor does anything say what happens for
      a controller admitting non-integers -- `text .base10 float` is
      syntactically fine and semantically undefined.

  - name: ".printf"
    locator: "§2.3"
    iana_entry: {name: ".printf", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "array -- `[format-string, *data-item]`"
    table4_meaning: "Printf-style formatting of data item(s)"
    table4_reference: "---"
    predicate: >-
      OURS. The controller array's first element is a printf format string;
      the remaining zero or more elements are data items fitting its
      conversion specifications in order. The target matches iff it equals
      the output of an equivalent C printf call on those arguments, under
      ISO/IEC 9899:2024 §7.23.6.1 as profiled in printf-profile.derived.txt.
    text_identity: >-
      CONDITIONAL, and under-specified. Injective only if the format string
      is; and the output of %f, %e, %g and %a is not determined at all,
      because the document fixes no locale and C's decimal-point character is
      locale-dependent. See printf-profile.derived.txt.
    controller_quote: >-
      The controller (right-hand side) of the .printf control is an array of
      one printf-style format string and zero or more data items that fit the
      individual conversion specifications in the format string.
    matching_quote: >-
      The construct matches a text string representing the textual output of
      an equivalent C-language printf function call that receives as
      arguments the format string and the data items following it in the
      array.
    excluded_stated: >-
      Out of the functionality described for printf formatting in Section
      7.23.6.1 of the C language specification [C], length modifiers
      (paragraph 7) are not used and MUST NOT be included in the format
      string.
    excluded_stated_2: >-
      The "p" and "n" conversion specifiers (paragraph 8) are not used and
      MUST NOT be included in the format string.
    redefined_s: >-
      The "s" conversion specifier (paragraph 8) is used to interpolate a
      text string in UTF-8 form.
    redefined_c: >-
      The "c" conversion specifier (paragraph 8) represents a single Unicode
      scalar value as a UTF-8 character.
    new_capability: >-
      THE ONE GENUINELY NEW EXPRESSIVE POWER IN THIS DOCUMENT, in the
      source's words: "The data items in the controller array do not need to
      be literals, as in the following example:". A text field's CONTENT can
      now be tied to a CDDL TYPE rather than to a constant -- `any_alg =
      hexlabel<1..20>` matches "0x0013" and "0x0001" but not "0x1234". Before
      this, a text string could be constrained only by .regexp against a
      literal pattern.
    grammar_gap: >-
      OURS. Nothing in the grammar requires the controller to be an array, nor
      its first element to be a text string, nor the arity of the remaining
      elements to match the format string's conversion count. All three are
      prose conditions a tool must carry.

  - name: ".json"
    locator: "§2.4"
    iana_entry: {name: ".json", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text"
    controller: "any"
    table5_meaning: "JSON"
    table5_reference: "[STD90]"
    predicate: >-
      OURS. The target is a JSON text (STD 90 / RFC 8259); its conversion to
      the CBOR generic data model by the default rules of RFC 8949 §6.2
      matches the controller type. The document says nothing about what
      happens when the target is not well-formed JSON, nor about trailing
      content -- the same silence RFC 8610's .cbor has.
    text_identity: >-
      NOT a canonical form, and the document says so outright. Blank space
      and map-entry order are unconstrained, so unboundedly many distinct
      text strings match one `.json` rule.
    semantics_quote: >-
      The JSON value of these can easily be defined in CDDL by using the
      default JSON-to-CBOR conversion rules provided in Section 6.2 of RFC
      8949 [STD94].
    analogy_quote: >-
      This is supported by a control operator similar to .cbor as defined in
      Section 3.8.4 of [RFC8610].
    absence_quote: >-
      This control operator provides no way to constrain the use of blank
      space or other serialization variants in the JSON representation of the
      data items; restrictions on the serialization to specific variants
      (e.g., not providing for the addition of any insignificant blank space
      and prescribing an order in which map entries are serialized) could be
      defined in future control operators.
    ijson_condition_quote: >-
      While Section 4 of [RFC7493] probably is not relevant to this
      specification, Section 2 of [RFC7493] provides requirements that need
      to be followed to make use of the generic data model underlying CDDL.
    big_number_rule_quote: >-
      The recommendation to use text strings for representing numbers outside
      JSON's interoperable range is a requirement on the application data
      model and therefore needs to be reflected on the right-hand side of the
      .json control operator.
    sibling_not_provided: >-
      A .jsonseq is not provided in this document for JSON text sequences
      [RFC7464], as no use case for inclusion in CDDL is known at the time of
      writing; again, future control operators could address this use case.

  - name: ".join"
    locator: "§3.1"
    iana_entry: {name: ".join", reference: "RFC 9741", registry: "CDDL Control Operators"}
    kind: "type control"
    target: "text or bytes"
    controller: "array of strings (text or byte strings)"
    table6_meaning: "Concatenate elements of an array"
    table6_reference: "---"
    predicate: >-
      OURS, as five separate conditions, because the source states them as
      five sentences: (1) every element of the controller array is a string,
      of either kind; (2) the target is a string equal to the concatenation
      of those strings; (3) the concatenation is performed on the BYTE
      SEQUENCES, not on characters or code points; (4) the kind (text or
      bytes) of the result is that of the FIRST element, and an empty array
      matches either kind of empty string; (5) if the result is a text
      string, the concatenated bytes match only if they are valid UTF-8.
    text_identity: >-
      CONDITIONAL on the elements, and NON-COMPOSITIONAL for anything
      stronger than UTF-8 validity. Because concatenation is byte-level and
      the parts need not individually be valid text, a text string may be
      assembled from fragments that split a UTF-8 sequence -- a fortiori one
      that splits a combining-character sequence. A per-element normalisation
      property therefore does not survive the join. See ../design-notes.md
      §1.3.
    elements_quote: >-
      The elements of the controller array need to be strings (text or byte
      strings).
    match_quote: >-
      The control operator matches a data item if that data item is also a
      string, built by concatenating the strings in the array.
    kind_quote: >-
      The result of this concatenation is of the same kind of string (text or
      bytes) as the first element of the array.
    empty_quote: >-
      (If there is no element in the array, the .join construct matches either
      kind of empty string, obviously further constrained by the control
      operator target.)
    byte_level_quote: >-
      The concatenation is performed on the sequences of bytes in the strings.
    utf8_quote: >-
      If the result of the concatenation is a text string, the resulting
      sequence of bytes only matches the target data item if that result is a
      valid text string (i.e., valid UTF-8).
    contrast_quote: >-
      Note that in contrast to the algorithm used in Section 3.2.3 of RFC 8949
      [STD94], there is no need for all individual byte sequences going into
      the concatenation to constitute valid text strings.
    validation_disclaimer_quote: >-
      Note that this control operator is hard to validate in the most general
      case, as this would require full parser functionality.
    drafting_rule_quote: >-
      Therefore, it is recommended to limit the use of .join to simple
      arrangements where the array elements are laid out explicitly and there
      are no adjacent variable elements without intervening constant values,
      and where these constant values do not occur within the text described
      by the variable elements.
    implementation_recommendation_quote: >-
      In the most general case, these implementation strategies can exhibit
      false negatives, where the implementation cannot find the structure that
      would be successfully validated using the controller; it is RECOMMENDED
      that implementations provide full coverage at least for the
      marker-based subset outlined in the previous paragraph.
    versus_abnf_quote: >-
      If more complex parsing functionality is required, the ABNF control
      operators (see Section 3 of [RFC9165]) may be useful; however, these
      cannot reach back into CDDL-specified elements like .join can.
    grammar_gap: >-
      OURS. `.join` is the first CDDL control whose correct validation the
      document itself admits is undecidable in general, and the only one in
      either registry batch that concedes FALSE NEGATIVES in a conforming
      implementation. Two validators can therefore disagree about a valid
      instance and both conform.

# ---------------------------------------------------------------------
# Registry state -- and the correction this record owes rfc-8610.
# ---------------------------------------------------------------------
registry_state:
  registry: "CDDL Control Operators (within the IANA Concise Data Definition Language (CDDL) registry, [IANA.cddl])"
  this_document_registers: 14
  registration_quote: >-
    IANA has registered the contents of Table 7 into the "CDDL Control
    Operators" registry of [IANA.cddl]:
  policy: "none of its own. RFC 8610 §6.1 governs; this document states no policy and creates no new registry."
  other_registrants_named_by_this_document:
    quote: >-
      RFCs have added to this extension point in both an
      application-specific [RFC9090] and a more general [RFC9165] way.
    note: >-
      The document names RFC 9090 and RFC 9165 as having added operators but
      does not enumerate them, so this file does not either. This extraction
      read only RFC 9741.
  correction_made_to_rfc_8610:
    status: "APPLIED (commit 9adcb8d), not owed. Re-verified at pass 2."
    file: "records/ietf/rfc-8610/distilled/schema/control-operators.derived.yaml"
    wrong_claim: >-
      That file (OURS, not RFC 8610's) SAID under `extension_point.policy_note`
      that "All names other than the fourteen below are Unassigned", and its
      `counts.operators: 14` read as a count of REGISTERED operators. The
      sentence is gone and `registry_state_is_not_rfc_8610` replaces it; pass 2
      confirmed the replacement is accurate and that the fourteen there remain
      exactly right as a statement about RFC 8610 (the two operator sets are
      disjoint -- checked set-wise, overlap empty).
    why_it_is_wrong: >-
      RFC 9741 §4 registers fourteen further names, and RFC 9741 §1 states
      that RFC 9090 and RFC 9165 had already added others. The registry
      therefore holds at least 28 and strictly more. The 14 is correct as
      "the fourteen RFC 8610 itself defines" and false as a statement of
      registry state.
    also_affected: >-
      rfc-8610's grammar-gaps.derived.txt item G-11 is headed "§3.8 (all
      fourteen operators)". The gap itself is unchanged and uncloseable -- see
      `gap_effects` below -- but its scope line must read as RFC 8610's
      fourteen, not as the registry's.

# ---------------------------------------------------------------------
# Effect on the 44 side conditions in
# records/ietf/rfc-8610/distilled/schema/grammar-gaps.derived.txt.
# ALL VERDICTS OURS.
# ---------------------------------------------------------------------
gap_effects:
  closed_by_this_document: 0
  closed_note: >-
    Not one of the 44 is closed BY RFC 9741. A grammar extension that adds
    operators cannot close a gap between the grammar and the type system; it
    widens it. SCOPE, added at pass 2: this is a verdict on RFC 9741 and on
    nothing else. G-35 is partially closed by rfc-9165, whose `.abnf`
    controllers are case-insensitive by default; that record owns the finding
    and this file must not be read as denying it.
  per_gap:
    - gap: "G-11"
      verdict: "EXTENDED, not closed"
      detail: >-
        G-11 says each control operator admits only certain targets and
        controllers and that `ctlop = "." id` constrains none of it, and
        does not even require the operator to exist. Fourteen more operators
        now need fourteen more admissibility conditions, plus three of a shape
        G-11 did not anticipate: an ARRAY-shaped controller (.printf, .join),
        an element-kind condition over that array's members (.join), and a
        result-kind rule read off the array's FIRST element (.join).
    - gap: "G-12"
      verdict: "CONFIRMED by a second, newer normative source; not closed"
      detail: >-
        G-12 observes that `bsqual = "h" / "b64"` says nothing about
        whether a prefixed byte-string literal's body is valid base16 or
        base64. RFC 9741 §2.1 states the same thing in its own words -- the
        "b64" literal prefix "simply accepts characters from either
        alphabet" -- and adds that this "behavior is different from the
        matching behavior of the four base64 control operators defined here".
        So the new operators do NOT fix G-12: they constrain INSTANCE DATA,
        while G-12 is about CDDL SOURCE literals. The two mechanisms share
        the name "b64" and disagree.
    - gap: "G-35"
      verdict: "partially relieved for one case; not closed"
      detail: >-
        G-35 records §3.1's "there is no support in CDDL for the concept of
        case insensitivity in text strings; if necessary, regular expressions
        can be used". Hex case can now be pinned BY NAME (.hexlc, .hexuc)
        instead of by an XSD character-class regexp. RELIEVED IN BOTH
        DIRECTIONS, which pass 1 missed: .hex deliberately admits either case,
        so .hex is the first CDDL control operator whose MATCHING RELATION is
        intrinsically case-insensitive, rather than case-insensitive because an
        author wrote out "[Cc]". That is a G-35 data point and not only a trap.
        It is still not closed, because the relief reaches only the 16-character
        hex alphabet. [correction, pass 2] This entry previously ended "Case-
        insensitive MATCHING of arbitrary text remains impossible." That is
        FALSE: rfc-9165's .abnf matches case-insensitively by default (RFC 9165
        §1.1 brings RFC 7405 into scope; in RFC 5234 a quoted string is
        case-insensitive unless marked %s), and rfc-9165's extraction records
        G-35 as the one of the 44 it partially closes. RFC 9741 is not the only
        document bearing on G-35 and this file may not speak for the others.
    - gap: "G-44"
      verdict: "REFINED; not closed"
      detail: >-
        G-44 says Table 1's precedence 7 for `.ctrl` implies a chaining the
        grammar forbids. Still true. What this document adds is the idiom
        that replaces chaining: both of its worked compositions nest through a
        RULE NAME (§2.1's .b64u over .cbor, Figure 1's .join over .base10),
        and its two array-controller operators make that the normal way to
        stack controls.
    - gap: "G-36"
      verdict: "REINFORCED one layer up"
      detail: >-
        G-36 is RFC 8610's "CDDL does not provide any language means to
        restrict the choice of serialization variants" at the CBOR layer.
        §2.4 says the same at the TEXT layer for JSON, in almost the same
        words, and defers the fix to "future control operators".
    - gap: "G-38"
      verdict: "REINFORCED"
      detail: >-
        G-38 is "key order cannot be fixed". §2.4 names "prescribing an
        order in which map entries are serialized" as something a future
        control operator could do -- i.e. it is still not doable.
    - gap: "G-39"
      verdict: "WORSENED"
      detail: >-
        G-39 is "there is no conformance level for a checker". §3.1 is the
        first place a CDDL document states a PARTIAL coverage target and
        concedes false negatives in a conforming implementation: "it is
        RECOMMENDED that implementations provide full coverage at least for
        the marker-based subset". Two conforming validators can now disagree
        about a valid instance.
  new_side_conditions:
    note: >-
      OURS. Conditions a tool must carry that no grammar can state, added by
      this document. Numbered N-nn so they cannot be confused with rfc-8610's
      G-nn. `checkable` uses rfc-8610's scale: S statically from the
      specification, I only against an instance, N not at all.
    items:
      - {id: "N-01", locator: "§2.3", checkable: "S", text: 'A .printf controller must be an array whose first element is a text string and whose remaining elements fit, in order, the conversion specifications of that format string. Arity is a prose condition; the grammar admits any type2 on the right.'}
      - {id: "N-02", locator: "§2.3", checkable: "S", text: "A .printf format string must contain no length modifier and no "p" or "n" conversion specifier. The only new side condition backed by a BCP 14 keyword -- two MUST NOTs."}
      - {id: "N-03", locator: "§2.3", checkable: "N", text: "The matching relation is "the textual output of an equivalent C-language printf function call" and no locale is fixed. For %f, %e, %g and %a the output is therefore not determined by this document."}
      - {id: "N-04", locator: "§2.3", checkable: "N", text: 'With length modifiers forbidden, each conversion carries C''s default argument type. The document gives no rule for a CDDL integer outside that range, and §2.2''s own example reaches 2**63-1.'}
      - {id: "N-05", locator: "§3.1", checkable: "S/I", text: 'Every element of a .join controller array must be a string. Decidable statically where the elements are literals or string-typed, not where an element is an open type choice.'}
      - {id: "N-06", locator: "§3.1", checkable: "S", text: 'A .join result''s kind is the FIRST element''s kind, so `bytes .join [text-element, ...]` is a type error the grammar accepts. The empty array is the one case with no first element and matches either kind.'}
      - {id: "N-07", locator: "§3.1", checkable: "N", text: 'A conforming .join validator may return false negatives; full coverage is RECOMMENDED only for the marker-based subset. Validator disagreement is permitted.'}
      - {id: "N-08", locator: "§2.1", checkable: "S", text: 'Each of the ten base-encoding operators requires a text target and a bytes controller. `bytes .b64u text` parses and means nothing.'}
      - {id: "N-09", locator: "§2.2", checkable: "S", text: '.base10 requires an int controller; `text .base10 float` parses and is undefined.'}
      - {id: "N-10", locator: "§2.1", checkable: "N", text: 'Base64url-with-padding, classic-base64-without-padding and base32(hex)-with-padding cannot be stated at all. An author meeting one on the wire must fall back to .regexp or .printf, or leave the field as bare text.'}

# ---------------------------------------------------------------------
# The condition (6) view: for which operators is the TEXT a canonical
# form of the value? This is the table to read if you came here from
# library/topics/canonical-encoding.yaml. ALL VERDICTS OURS.
# ---------------------------------------------------------------------
text_identity_summary:
  injective_text_form:
    - ".b64u"
    - ".b64c"
    - ".b45"
    - ".b32"
    - ".h32"
    - ".hexlc"
    - ".hexuc"
    - ".base10"
  not_injective_by_design:
    - {name: ".hex", why: "either case"}
    - {name: ".b64u-sloppy", why: "trailing bits unconstrained"}
    - {name: ".b64c-sloppy", why: "trailing bits unconstrained"}
    - {name: ".json", why: "blank space and map-entry order unconstrained, stated in §2.4"}
  conditional:
    - {name: ".printf", why: "injective only if the format string is, and undetermined for the locale-dependent conversions"}
    - {name: ".join", why: "inherits from its elements, and no property stronger than UTF-8 validity survives a byte-level concatenation"}
  unicode_normalisation: >-
    NONE OF THE FOURTEEN. Eight of them pin a canonical text form for text
    that is a TRANSCODING of a byte string or of an integer, over alphabets of
    16, 32, 45 or 64 ASCII characters plus the ten digits and a minus sign.
    Not one says anything about the normalisation form of a text string that
    is simply text. A CDDL schema still cannot state "this label is NFC",
    nor "this label is rejected if not NFC", which are the two branches of
    the canonical-encoding topic's condition (6).

counts:
  operators: 14
  already_in_rfc_8610: 0
  iana_entries_added: 14
  target_text: 13          # all but .join
  target_text_or_bytes: 1  # .join
  controller_bytes: 10     # the base encodings
  controller_int: 1        # .base10
  controller_array: 2      # .printf .join
  controller_any: 1        # .json
  type_controls: 14
  group_controls: 0
  # [correction, pass 2] `strict_variants: 10` sat next to `sloppy_variants: 2`
  # and read as 12 base-encoding operators. There are TEN, of which 8 are
  # strict-only and 2 are the sloppy variants. §2.1's "These control operators
  # are "strict" in their matching" covers all ten; "sloppy" then relaxes the
  # trailing-bit rule for two of them, and only that rule.
  base_encoding_operators: 10
  strict_only_variants: 8
  sloppy_variants: 2
  carry_a_bcp14_keyword: 2  # .printf (two MUST NOTs), .join (one RECOMMENDED)
  injective_text_form: 8
  new_side_conditions: 10
  rfc_8610_gaps_closed_by_this_document: 0   # G-35 is partially closed by rfc-9165, not here
