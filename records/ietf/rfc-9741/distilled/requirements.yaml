    object: 'a sloppy variant of base32 or base32hex'
    field: 'no BCP 14 keyword backs this; the force is an explicit ABSENCE with its reason — "not specifying a sloppy variant of base32 or base32hex"'
    verb: 'not specifying'
    actor: 'CDDL specification author'
    locator: "§2.1"
    text: 'Note that the present specification is opinionated again in not specifying a sloppy variant of base32 or base32hex, as no legacy use of sloppy base32(hex) was known at the time of writing.'
    kind: inferred
    testable: 'yes'
