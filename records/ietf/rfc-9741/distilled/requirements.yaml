    field: 'no BCP 14 keyword backs this; the force is an ABSENCE with a redirect — .base10 is the only numeral operator registered, and every other base has to be reached through .printf'
    verb: 'none'
    actor: 'CDDL specification author'
    locator: "§2.2"
    text: 'See Section 2.3 for more flexibility and for other numeric bases such as octal, hexadecimal, or binary conversions.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0026"
    object: '.base10 as against .b64u, .hex, .b32, .h32 and .b45'
    field: 'no BCP 14 keyword backs this; the force is a disambiguation rule — .base10 governs text representations OF INTEGERS and the others text representations OF BYTE STRINGS; "should not be confused" is lower case and is drafting advice, not a BCP 14 SHOULD'
    verb: 'should not be confused'
    actor: 'CDDL specification author'
    locator: "§2.2"
    text: 'Note that this control operator governs text representations of integers and should not be confused with the control operators governing text representations of byte strings (such as .b64u).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0027"
    object: '.printf'
    field: 'no BCP 14 keyword backs this; the force is the operator’s definition, and with it a NORMATIVE DEPENDENCE on ISO/IEC 9899:2024 §7.23.6.1 — a paywalled document (see rfc-9741#R-0060)'
    verb: 'allows the modeling of'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'The control operator .printf allows the modeling of text strings that carry various formatted information, as long as the format can be represented in printf-style formatting strings as they are used in the C language (see Section 7.23.6.1 of [C]; note that the "C23" standard includes %b and %B for formatting into binary digits).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0028"
    object: 'the controller of .printf'
    field: 'no BCP 14 keyword backs this; the force is the controller’s structural definition — an array of exactly one format string followed by zero or more data items that "fit the individual conversion specifications"'
    verb: 'is'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'The controller (right-hand side) of the .printf control is an array of one printf-style format string and zero or more data items that fit the individual conversion specifications in the format string.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0029"
    object: 'the text string a .printf construct matches'
    field: 'no BCP 14 keyword backs this; the force is the matching rule itself — the target must equal "the textual output of an equivalent C-language printf function call". The matching relation is defined by reference to a C library function and no locale is fixed'
    verb: 'matches'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'The construct matches a text string representing the textual output of an equivalent C-language printf function call that receives as arguments the format string and the data items following it in the array.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'decidable only once the C printf behaviour is pinned; the document fixes no locale, so %f, %e, %g and %a outputs are not determined (see design-notes.md, source defect 1)'
    status: active
  - id: "rfc-9741#R-0030"
    object: 'length modifiers (C §7.23.6.1 paragraph 7) in a .printf format string'
    field: 'stated: MUST NOT. One of the three all-capitals BCP 14 occurrences in the document'
    verb: 'MUST NOT'
    actor: 'CDDL specification author'
    locator: "§2.3"
    text: 'Out of the functionality described for printf formatting in Section 7.23.6.1 of the C language specification [C], length modifiers (paragraph 7) are not used and MUST NOT be included in the format string.'
    kind: stated
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0031"
    object: 'the "s" conversion specifier in a .printf format string'
    field: 'no BCP 14 keyword backs this; the force is a definition of the specifier’s meaning in CDDL — it interpolates "a text string in UTF-8 form". Nothing is said about width or precision, which in C count bytes'
    verb: 'is used to interpolate'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'The "s" conversion specifier (paragraph 8) is used to interpolate a text string in UTF-8 form.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0032"
    object: 'the "c" conversion specifier in a .printf format string'
    field: 'no BCP 14 keyword backs this; the force is a REDEFINITION of C semantics stated as a definition — in C, %c converts an int to unsigned char, i.e. one byte; here it "represents a single Unicode scalar value as a UTF-8 character". The deviation is not labelled as one'
    verb: 'represents'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'The "c" conversion specifier (paragraph 8) represents a single Unicode scalar value as a UTF-8 character.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0033"
    object: 'the "p" and "n" conversion specifiers in a .printf format string'
    field: 'stated: MUST NOT. The second of the three all-capitals BCP 14 occurrences in the document'
    verb: 'MUST NOT'
    actor: 'CDDL specification author'
    locator: "§2.3"
    text: 'The "p" and "n" conversion specifiers (paragraph 8) are not used and MUST NOT be included in the format string.'
    kind: stated
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0034"
    object: 'the data items in a .printf controller array'
    field: 'no BCP 14 keyword backs this; the force is a stated capability — the controller’s data items "do not need to be literals", so a text field’s content can be tied to a CDDL TYPE rather than to a constant. This is the document’s one genuinely new expressive power'
    verb: 'do not need to be'
    actor: 'CDDL tool implementer'
    locator: "§2.3"
    text: 'The data items in the controller array do not need to be literals, as in the following example:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0035"
    object: 'the JSON value a .json controller describes'
    field: 'no BCP 14 keyword backs this; the force is the operator’s semantics by reference — "the default JSON-to-CBOR conversion rules provided in Section 6.2 of RFC 8949 [STD94]"'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.4"
    text: 'The JSON value of these can easily be defined in CDDL by using the default JSON-to-CBOR conversion rules provided in Section 6.2 of RFC 8949 [STD94].'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0036"
    object: '.json'
    field: 'no BCP 14 keyword backs this; the force is a definition by analogy — .json is "similar to .cbor as defined in Section 3.8.4 of [RFC8610]", i.e. a decode-then-match control, but over a TEXT target rather than a byte-string one'
    verb: 'is supported by'
    actor: 'CDDL tool implementer'
    locator: "§2.4"
    text: 'This is supported by a control operator similar to .cbor as defined in Section 3.8.4 of [RFC8610].'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0037"
    object: 'a CDDL specification that uses .json'
    field: 'no BCP 14 keyword backs this; the force is the lower-case "need to be followed" — Section 2 of RFC 7493 (I-JSON) is imported as a condition of using the CDDL data model through .json'
    verb: 'need to be followed'
    actor: 'CDDL specification author'
    locator: "§2.4"
    text: 'While Section 4 of [RFC7493] probably is not relevant to this specification, Section 2 of [RFC7493] provides requirements that need to be followed to make use of the generic data model underlying CDDL.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'the imported conditions are RFC 7493’s, and the sentence does not say which of them bite on which construct'
    status: active
  - id: "rfc-9741#R-0038"
    object: 'the intention of Section 2.2 of RFC 7493'
    field: 'no BCP 14 keyword backs this; the force is a statement that one imported condition is already discharged — "directly supported by Section 6.2 of RFC 8949"'
    verb: 'is directly supported'
    actor: 'CDDL tool implementer'
    locator: "§2.4"
    text: 'Note that the intention of Section 2.2 of [RFC7493] is directly supported by Section 6.2 of RFC 8949 [STD94].'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0039"
    object: 'numbers outside JSON’s interoperable range inside a .json controller'
    field: 'no BCP 14 keyword backs this; the force is the lower-case "needs to be reflected" — the I-JSON recommendation is reclassified as "a requirement on the application data model" and therefore has to appear on the right-hand side of .json, not in the operator'
    verb: 'needs to be reflected'
    actor: 'CDDL specification author'
    locator: "§2.4"
    text: 'The recommendation to use text strings for representing numbers outside JSON''s interoperable range is a requirement on the application data model and therefore needs to be reflected on the right-hand side of the .json control operator.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0040"
    object: 'blank space and other serialization variants in the JSON text .json matches'
    field: 'no BCP 14 keyword backs this; the force is an explicit DISCLAIMER OF CAPABILITY — "provides no way to constrain" — naming insignificant blank space and map-entry order as the two variants it cannot fix, and deferring them to "future control operators". This is the document’s own statement that it adds no canonical-text-form operator'
    verb: 'provides no way'
    actor: 'CDDL specification author'
    locator: "§2.4"
    text: 'This control operator provides no way to constrain the use of blank space or other serialization variants in the JSON representation of the data items; restrictions on the serialization to specific variants (e.g., not providing for the addition of any insignificant blank space and prescribing an order in which map entries are serialized) could be defined in future control operators.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0041"
    object: 'JSON text sequences [RFC7464] in CDDL'
    field: 'no BCP 14 keyword backs this; the force is an explicit ABSENCE with its reason — "A .jsonseq is not provided in this document"'
    verb: 'is not provided'
    actor: 'CDDL specification author'
    locator: "§2.4"
    text: 'A .jsonseq is not provided in this document for JSON text sequences [RFC7464], as no use case for inclusion in CDDL is known at the time of writing; again, future control operators could address this use case.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0042"
    object: 'the elements of a .join controller array'
    field: 'no BCP 14 keyword backs this; the force is the lower-case "need to be" — every element has to be a string, of either kind'
    verb: 'need to be'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'The elements of the controller array need to be strings (text or byte strings).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0043"
    object: 'the data item a .join construct matches'
    field: 'no BCP 14 keyword backs this; the force is the matching rule itself — the item must be a string and must equal the concatenation of the array’s strings'
    verb: 'matches'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'The control operator matches a data item if that data item is also a string, built by concatenating the strings in the array.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0044"
    object: 'the kind (text or bytes) of a .join result'
    field: 'no BCP 14 keyword backs this; the force is a determination rule — the kind is taken from THE FIRST ELEMENT of the array, so element order decides the result type'
    verb: 'is'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'The result of this concatenation is of the same kind of string (text or bytes) as the first element of the array.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0045"
    object: 'a .join whose controller array is empty'
    field: 'no BCP 14 keyword backs this; the force is a boundary rule — an empty array matches EITHER kind of empty string, with the target left to narrow it. It is the one case where the first-element rule cannot apply'
    verb: 'matches'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: '(If there is no element in the array, the .join construct matches either kind of empty string, obviously further constrained by the control operator target.)'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0046"
    object: 'the concatenation .join performs'
    field: 'no BCP 14 keyword backs this; the force is a definition of the operation’s level — it is performed "on the sequences of bytes in the strings", not on characters or code points'
    verb: 'is performed'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'The concatenation is performed on the sequences of bytes in the strings.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0047"
    object: 'a .join whose result is a text string'
    field: 'no BCP 14 keyword backs this; the force is the matching rule — the concatenated bytes match the target "only" if the result "is a valid text string (i.e., valid UTF-8)". UTF-8 validity is the ONLY text-identity property this document imposes on a text result'
    verb: 'only matches'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'If the result of the concatenation is a text string, the resulting sequence of bytes only matches the target data item if that result is a valid text string (i.e., valid UTF-8).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0048"
    object: 'the individual byte sequences going into a .join concatenation'
    field: 'no BCP 14 keyword backs this; the force is a stated contrast with RFC 8949 §3.2.3 — "there is no need for all individual byte sequences [...] to constitute valid text strings", so an element may end mid-UTF-8-sequence'
    verb: 'there is no need'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'Note that in contrast to the algorithm used in Section 3.2.3 of RFC 8949 [STD94], there is no need for all individual byte sequences going into the concatenation to constitute valid text strings.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0049"
    object: 'validation of a .join construct'
    field: 'no BCP 14 keyword backs this; the force is an explicit DISCLAIMER OF CAPABILITY — general-case validation "would require full parser functionality"'
    verb: 'is hard to validate'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'Note that this control operator is hard to validate in the most general case, as this would require full parser functionality.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0050"
    object: 'a simple .join validator'
    field: 'no BCP 14 keyword backs this; the force is a stated implementation strategy — constant array elements act as "markers" that isolate the variable elements'
    verb: 'will use'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'Simple implementation strategies will use array elements with constant values as guideposts ("markers", such as the "." in Figure 1) for isolating the variable elements that need further validation at the CDDL data model level.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0051"
    object: 'the arrangements a CDDL specification should use .join for'
    field: 'no BCP 14 keyword backs this; the force is the lower-case "it is recommended to limit the use of .join" — three drafting conditions: elements laid out explicitly, no adjacent variable elements, and constant values that do not occur inside the variable elements'
    verb: 'recommended'
    actor: 'CDDL specification author'
    locator: "§3.1"
    text: 'Therefore, it is recommended to limit the use of .join to simple arrangements where the array elements are laid out explicitly and there are no adjacent variable elements without intervening constant values, and where these constant values do not occur within the text described by the variable elements.'
    kind: inferred
    testable: 'partial'
    testable_reason: 'the first two conditions are decidable from the specification; the third ("these constant values do not occur within the text described by the variable elements") is undecidable in general, since the variable elements are types'
    status: active
  - id: "rfc-9741#R-0052"
    object: '.join versus the ABNF control operators of RFC 9165 §3'
    field: 'no BCP 14 keyword backs this; the force is a stated division of labour, and a stated LIMIT of the alternative — the ABNF operators "cannot reach back into CDDL-specified elements like .join can"'
    verb: 'may be useful'
    actor: 'CDDL specification author'
    locator: "§3.1"
    text: 'If more complex parsing functionality is required, the ABNF control operators (see Section 3 of [RFC9165]) may be useful; however, these cannot reach back into CDDL-specified elements like .join can.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0053"
    object: 'a .join validator implementation'
    field: 'no BCP 14 keyword backs this; the force is a stated implementation technique inside the §3.1 implementation-note aside. QUOTED WITH THE ASIDE’S LEADING "|" BAR REMOVED — the only such transformation in this record, declared in the file header'
    verb: 'can use'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'Implementation note: A validator implementation can use the marker elements to scan the text and isolate the variable elements.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0054"
    object: 'a .join validator implementation'
    field: 'no BCP 14 keyword backs this; the force is a second stated technique — build a parsing regexp with one capture group per element and validate each capture against its element. Aside; the leading "|" bar is removed'
    verb: 'can build'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'It also can build a parsing regexp from the elements of the controller array, with capture groups for each element, and validate the captures against the elements of the array.'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0055"
    object: 'the regexps a .join validator builds'
    field: 'no BCP 14 keyword backs this; the force is a pointer to the governing dialect (RFC 9485 §6, parsing regexps) and to its security considerations (§8). Aside; the leading "|" bar is removed'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: '(For more about parsing regexps, see Section 6 of [RFC9485]; see also Section 8 of [RFC9485] for security considerations related to regexps.)'
    kind: inferred
    testable: 'no'
    testable_reason: 'a cross-reference; the criteria are RFC 9485’s'
    status: active
  - id: "rfc-9741#R-0056"
    object: 'a .join validator’s coverage'
    field: 'stated: RECOMMENDED. The third and last all-capitals BCP 14 occurrence in the document, and the only one that binds an implementation rather than a format string. It concedes FALSE NEGATIVES in the general case. Aside; the leading "|" bar is removed'
    verb: 'RECOMMENDED'
    actor: 'CDDL tool implementer'
    locator: "§3.1"
    text: 'In the most general case, these implementation strategies can exhibit false negatives, where the implementation cannot find the structure that would be successfully validated using the controller; it is RECOMMENDED that implementations provide full coverage at least for the marker-based subset outlined in the previous paragraph.'
    kind: stated
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0057"
    object: 'the 14 names of Table 7'
    field: 'no BCP 14 keyword backs this; the force is a completed IANA action stated in the past tense — "IANA has registered". The document states no registration policy of its own; RFC 8610 §6.1 governs'
    verb: 'has registered'
    actor: 'IANA / registrant'
    locator: "§4"
    text: 'IANA has registered the contents of Table 7 into the "CDDL Control Operators" registry of [IANA.cddl]:'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0058"
    object: 'the security considerations for this document'
    field: 'no BCP 14 keyword backs this; the force is incorporation by reference — RFC 8610 §5 "apply"'
    verb: 'apply'
    actor: 'CDDL specification author'
    locator: "§5"
    text: 'The security considerations in Section 5 of [RFC8610] apply.'
