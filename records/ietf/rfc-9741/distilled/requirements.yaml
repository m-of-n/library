extracted_keyword_count: 3     # recomputed and checked by bin/validate
reconciliation: 'RFC 9741 contains exactly THREE all-capitals BCP 14 keyword occurrences in 28 KB, and bin/bcp14-count reports 3: MUST NOT twice and RECOMMENDED once. The extraction carries all three, so the two counts agree at 3 and nothing needs reconciling in the arithmetic sense. This field is written anyway, because a reader who sees 3 would otherwise have to guess what the real normative baseline is. IT IS THIS: a CDDL control operator is normative by its DEFINITION AND ITS MATCHING RULE - what its target may be, what its controller must look like, and which text strings it matches - not by an obligation laid on an actor. Fourteen operators are defined here and not one of them is defined with a keyword. The three keywords that do appear are, revealingly, about something else entirely: two forbid C printf features inside a .printf FORMAT STRING (length modifiers, and the "p" and "n" specifiers), and the third asks a VALIDATOR IMPLEMENTATION to cover at least the marker-based subset of .join. Both MUST NOTs bind a CDDL specification author writing a format string; the RECOMMENDED is the only keyword in the document that binds an implementation, and it sits inside an aside, in the same sentence that concedes false negatives in the general case. WHAT WAS COUNTED INSTEAD, and extracted here as kind: inferred: (a) every OPERATOR DEFINITION and its target/controller admissibility (14 operators, Tables 1-6); (b) every MATCHING RULE - .join''s byte-level concatenation, its first-element kind rule, its empty-array case and its UTF-8 validity condition; .printf''s equivalence to a C printf call; the "strict" matching of the ten base encodings and the "sloppy" relaxation; .base10''s no-leading-zeros canonical form; .json''s decode-by-RFC-8949-6.2 semantics; (c) every EXPLICIT ABSENCE OR DISCLAIMER OF CAPABILITY, because what this document declines to provide is as load-bearing for us as what it does: no base64url-with-padding, no classic-base64-without-padding, no base32(hex) with padding, no sloppy base32, no .jsonseq, no way to constrain blank space or map-entry order inside a .json text, no numeral base but ten, no general-case .join validation without full parser functionality, and the ABNF operators of RFC 9165 "cannot reach back into CDDL-specified elements like .join can"; (d) the REGISTRY FACTS of §1 and §4, which is where this record corrects an rfc-8610 artifact of our own; and (e) the lower-case force words the document does use: "need to be" (§3.1), "need to be followed" and "needs to be reflected" (§2.4), "recommended" (§3.1 - a lower-case recommendation, deliberately not a BCP 14 SHOULD), "should not be confused" (§2.2), "cannot" (§2.1, §3.1), "may be useful" (§3.1), "will use" (§3.1) and "apply" (§5). Each inferred entry names in its `field` the phrase or matching rule that carries the force and states that no BCP 14 keyword backs it; no obligation was invented and no count was inflated. §1.1''s BCP 14 boilerplate is deliberately NOT quoted in any entry: bin/validate counts requirement texts with boilerplate stripping OFF, so quoting it would add 11 phantom keywords and the extraction would read 14 against a source of 3. It IS quoted in normative.md, which nothing counts.'
