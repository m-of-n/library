    actor: 'CDDL tool implementer'
    locator: "§2.1"
    text: 'The additional designation "sloppy" indicates that the text string is not validated for any additional bits being zero, in variance to what is specified in the paragraph that follows Table 1 in Section 4 of [RFC4648].'
