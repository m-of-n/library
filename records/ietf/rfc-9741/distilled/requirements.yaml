  - id: "rfc-9741#R-0060"
    object: 'the normative reference that defines .printf’s matching relation'
    field: 'no BCP 14 keyword backs this; the force is the reference entry itself, in the NORMATIVE reference list. It is a paid ISO standard, so after this document a CDDL validator’s matching relation depends on a document that cannot be freely cited'
    verb: 'none'
