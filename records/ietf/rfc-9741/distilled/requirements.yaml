    object: 'the freely available substitute for [C]'
    field: 'no BCP 14 keyword backs this; the force is the reference’s own note that an equivalent text exists. QUOTED AS PRINTED: the URL is broken across source lines 485/486 and so contains a space between "docs/" and "n3220.pdf" — a rendering defect in the exact bytes content.sha256 pins, reported and not repaired'
    verb: 'is available'
