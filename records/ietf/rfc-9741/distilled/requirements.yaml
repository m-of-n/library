  - id: "rfc-9741#R-0059"
    object: 'the ten base-encoding operators of §2.1'
    field: 'no BCP 14 keyword backs this; the force is incorporation by reference — RFC 4648 §12 "apply". Note the scope: §2.2, §2.3, §2.4 and §3.1 get no security considerations of their own, and §3.1’s aside points at RFC 9485 §8 instead'
    verb: 'apply'
    actor: 'CDDL tool implementer'
    locator: "§5"
    text: 'In addition, for the control operators defined in Section 2.1, the security considerations in Section 12 of [RFC4648] apply.'
