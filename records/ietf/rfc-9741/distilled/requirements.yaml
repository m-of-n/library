note: |
  Ids are stable and never reused. Cite as rfc-9741#R-NNNN.
  Entries are in source order by section, then by position within the section;
  ids run from R-0001 with no gaps.
  KIND. `stated` means an all-capitals BCP 14 keyword backs the entry; there are
  three, rfc-9741#R-0030, rfc-9741#R-0033 and rfc-9741#R-0056. `inferred` means no BCP 14 keyword
  backs it - the force is an operator definition, a matching rule, an explicit
  absence, a disclaimer of capability, or a lower-case force word - and every
  inferred entry names that carrier in `field`. `inferred` here does NOT mean the
  text is paraphrased: every `text` in this file is a single contiguous verbatim
  span of RFC 9741. This follows rfc-8610 and rfc-9942, not rfc-8785, where
  `inferred` marked non-verbatim text.
  VERB. Upper case only for the three stated entries. Lower case reproduces the
  source's own force-word ('need to be', 'needs to be reflected', 'recommended',
  'should not be confused', 'cannot', 'may be useful', 'will use', 'apply');
  `none` means the sentence carries no force-word at all and its normativity is
  definitional.
  CONTIGUITY, and the TWO declared exceptions. Contiguity is asserted after
  collapsing runs of whitespace. The source has NO form feeds and NO page footers
  (RFC 9741 is an unpaginated v3 rendering), so there is no page decoration to
  remove. Nothing else was transformed, EXCEPT:
    (1) HYPHENATION. The token `left-hand-side` is severed by the line break at
        source lines 133/134. The sentence is therefore not a contiguous span of
        the document, and it is NOT healed: rfc-9741#R-0007 carries the half that ends
        `the left-hand-` and rfc-9741#R-0008 the half that begins `side operand`. Each
        says so in its `field`.
    (2) THE ASIDE BAR. §3.1's implementation note (source lines 416-428) is an
        RFC v3 aside, so every one of its lines begins `      |  `. The four
        entries rfc-9741#R-0053 to rfc-9741#R-0056 are contiguous only after that leading `|`
        bar is removed, and after nothing else. The removal is confined to lines
        416-428; no other line of the document is touched. Each of the four says
        so in its `field`.
  No span in this file is spliced from two non-adjacent parts of the document.
  ACTOR. RFC 9741 defines no protocol roles, so `actor` names the party a
  constraint falls on in practice: `CDDL tool implementer` for a matching rule or
  a validator technique, `CDDL specification author` for a drafting rule or an
  absence an author must work around, `IANA / registrant` for §4, and
  `reader of this specification` for a statement about the document itself.

