    field: 'no BCP 14 keyword backs this; the force is the inclusion decision plus a property of base45 asserted as fact — base45 "is strongly specified not to allow sloppy forms of encoding", which is why no .b45-sloppy exists'
    verb: 'is strongly specified'
    actor: 'CDDL tool implementer'
    locator: "§2.1"
    text: 'Base45 [RFC9285] is known to be suboptimal for use in environments with limited data transparency (such as URLs) but is included because of its close relationship to QR codes and its wide use in health informatics (note that base45 is strongly specified not to allow sloppy forms of encoding).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0023"
    object: '.base10'
    field: 'no BCP 14 keyword backs this; the force is the operator’s definition — a text string carrying "an integer number in decimal form"'
    verb: 'allows the modeling of'
    actor: 'CDDL tool implementer'
    locator: "§2.2"
    text: 'The control operator .base10 allows the modeling of text strings that carry an integer number in decimal form (as a text string with digits in the usual base-ten positional numeral system), such as in the uint64/int64 formats of YANG-JSON [RFC7951].'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0024"
    object: 'the text form .base10 admits'
    field: 'no BCP 14 keyword backs this; the force is a CANONICAL-FORM rule stated as a regular expression — no leading zeros, "0|-?[1-9][0-9]*", further restricted by the controller type. Per rfc-9741#R-0005 the dialect is I-Regexp (RFC 9485), not the XSD dialect of RFC 8610 §3.8.3'
    verb: 'match'
    actor: 'CDDL tool implementer'
    locator: "§2.2"
    text: 'Again, the specification is opinionated by only providing for integer numbers represented without leading zeros, i.e., the decimal integer numerals match the regular expression 0|-?[1-9][0-9]* (of course, this is further restricted by the control type).'
    kind: inferred
    testable: 'yes'
    status: active
  - id: "rfc-9741#R-0025"
