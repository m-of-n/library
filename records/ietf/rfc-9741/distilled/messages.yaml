# =====================================================================
# rfc-9741 messages -- this document defines no message, no envelope and
# no header. It defines fourteen CDDL CONSTRUCTS, so, as in
# records/ietf/rfc-8610/distilled/messages.yaml, the "messages" here are
# the syntactic constructs: each control construct, its parts, the type
# of each part, and the concrete syntax.
#
# `constrained_by` IS USED HERE, unlike in the rfc-8610 file. It can be:
# this document has 61 requirement entries at ten locators, every
# construct sits at exactly one of those locators, and the sentence that
# defines each part is identifiable. Where a part is constrained by a
# sentence that is motivation rather than rule, the key is omitted rather
# than filled with the nearest id.
#
# Quoted sentences are RFC 9741's own words. Anything marked OURS is this
# library's reading, not the document's.
#
# Source: RFC 9741, cached source sha256
#   3234aeea39d01b7c1c8e9c70d4d7dc8745852e0b6edbea167a3e55b91e7a9ee3
# =====================================================================
record: rfc-9741
reviewed_by: ""

# ---------------------------------------------------------------------
# The shape every construct below shares. It is RFC 8610's, not this
# document's; it is recorded once here so each entry need not repeat it.
# ---------------------------------------------------------------------
shared_shape:
  name: 'control-construct'
  locator: "§1 (and RFC 8610 §3.8 for the syntax)"
  encoding: 'CDDL source text; the construct is a type, and what it constrains is a data item in the CBOR/JSON generic data model'
  concrete_syntax: 'target .operator controller'
  quote: >-
    In Table 1, the column marked t is for "target type" (left-hand side), and
    the column marked c is for "controller type" (right-hand side).
  fields:
    - name: 'target'
      type: 'a CDDL type (type2)'
      required: true
      position: 'left-hand side'
      constrained_by: ['rfc-9741#R-0004', 'rfc-9741#R-0007']
    - name: 'operator'
      type: 'a dot followed by an id -- one of the fourteen registered names below'
      required: true
      constrained_by: ['rfc-9741#R-0057']
    - name: 'controller'
      type: 'a CDDL type (type2)'
      required: true
      position: 'right-hand side'
      constrained_by: ['rfc-9741#R-0004', 'rfc-9741#R-0008']
  layout: >-
    OURS. There is no byte-level layout: a control construct is source text,
    not a wire format. The only byte-level statement in the document is
    §3.1's, that .join concatenates "the sequences of bytes in the strings".
  all_type_controls: >-
    OURS. All fourteen are TYPE controls. CDDL has no group controls at all --
    `ctlop` occurs only inside `type1` -- and the document neither says so nor
    needs to.

messages:
  # -------------------------------------------------- §2.1, ten operators
  - name: 'base-encoding-construct'
    locator: "§2.1"
    encoding: 'CDDL source text; constrains a text string in the data model'
    instances: ['.b64u', '.b64u-sloppy', '.b64c', '.b64c-sloppy', '.b45', '.b32', '.h32', '.hex', '.hexlc', '.hexuc']
    concrete_syntax: 'text .b64u bytes'
    example_from_source: 'signature-for-json = text .b64u signature'
    fields:
      - name: 'target'
        type: 'text'
        required: true
        note: 'Table 1 column t = text for all ten'
        constrained_by: ['rfc-9741#R-0004']
      - name: 'controller'
        type: 'bytes'
        required: true
        note: 'Table 1 column c = bytes for all ten. The byte string the text decodes to must match this type'
        constrained_by: ['rfc-9741#R-0004']
      - name: 'alphabet'
        type: 'fixed per operator by Table 2'
        required: true
        note: 'base64url §5 / base64 classic §4 / base32 §6 / base32-extended-hex §7 / base16 §8 of RFC 4648, or RFC 9285 for base45. The operator names are "as inspired by Section 8 of RFC 8949". A text string outside its operator''s alphabet does not match, and the "b64" SOURCE-CODE literal prefix behaves differently -- it accepts either base64 alphabet'
        constrained_by: ['rfc-9741#R-0013', 'rfc-9741#R-0014', 'rfc-9741#R-0017', 'rfc-9741#R-0018', 'rfc-9741#R-0019']
      - name: 'padding'
        type: 'fixed per operator'
        required: true
        note: 'forbidden for .b64u/.b64u-sloppy/.b32/.h32, required for .b64c/.b64c-sloppy, not applicable to the hex and base45 operators (Table 2). The three combinations the document declines to provide are unstateable in CDDL'
        constrained_by: ['rfc-9741#R-0013', 'rfc-9741#R-0015']
      - name: 'trailing-bit strictness'
        type: 'fixed per operator'
        required: true
        note: 'strict for eight of the ten; the two "-sloppy" operators do not validate that additional bits are zero. No sloppy base32/base32hex exists, and base45 forbids sloppy forms outright, so no .b45-sloppy is possible'
        constrained_by: ['rfc-9741#R-0016', 'rfc-9741#R-0020', 'rfc-9741#R-0021', 'rfc-9741#R-0022']
      - name: 'case'
        type: 'fixed per operator, base16 only'
        required: false
        note: '.hex either case, .hexlc lower, .hexuc upper, per Table 2. OURS: .hex is therefore not injective as a text form'
        constrained_by: ['rfc-9741#R-0013']
    layout: 'no byte-level layout; the operator names a transformation defined elsewhere'
    quote: >-
      These control operators are "strict" in their matching, i.e., they only
      match base encodings that conform to the mandates of their defining
      documents.

  # -------------------------------------------------- §2.2
  - name: 'base10-construct'
    locator: "§2.2"
    encoding: 'CDDL source text; constrains a text string'
    concrete_syntax: 'text .base10 int'
    example_from_source: 'yang-json-sid = text .base10 (0..9223372036854775807)'
    fields:
      - name: 'target'
        type: 'text'
        required: true
        constrained_by: ['rfc-9741#R-0023']
      - name: 'controller'
        type: 'int (a single value or a range)'
        required: true
        note: 'bounds the VALUE; the text form is bounded separately'
        constrained_by: ['rfc-9741#R-0023', 'rfc-9741#R-0024']
      - name: 'text form'
        type: 'I-Regexp, fixed by the operator'
        required: true
        note: '`0|-?[1-9][0-9]*` -- no leading zeros, no plus sign, no "-0". Held as schema/base10-numeral.iregexp'
        constrained_by: ['rfc-9741#R-0024', 'rfc-9741#R-0005']
    layout: 'none'
    quote: >-
      The control operator .base10 allows the modeling of text strings that
      carry an integer number in decimal form (as a text string with digits in
      the usual base-ten positional numeral system), such as in the
      uint64/int64 formats of YANG-JSON [RFC7951].

  # -------------------------------------------------- §2.3
  - name: 'printf-construct'
    locator: "§2.3"
    encoding: 'CDDL source text; constrains a text string'
    concrete_syntax: 'text .printf ([format-string, *data-item])'
    example_from_source: 'hexlabel<K> = text .printf (["0x%04x", K])'
    fields:
      - name: 'target'
        type: 'text'
        required: true
        constrained_by: ['rfc-9741#R-0004', 'rfc-9741#R-0027']
      - name: 'controller'
        type: 'array'
        required: true
        note: 'exactly one format string, then zero or more data items'
        constrained_by: ['rfc-9741#R-0004', 'rfc-9741#R-0028']
      - name: 'controller[0] -- format string'
        type: 'text (a C printf format string)'
        required: true
        note: 'must contain no length modifier and no "p" or "n" conversion specifier. This is also the only route to a numeral base other than ten: §2.2 redirects octal, hexadecimal and binary here'
        constrained_by: ['rfc-9741#R-0025', 'rfc-9741#R-0028', 'rfc-9741#R-0030', 'rfc-9741#R-0033']
      - name: 'controller[1..] -- data items'
        type: 'any CDDL type, one per conversion specification, in order'
        required: false
        note: 'need not be literals -- a type or a range is admitted, which is this document''s one new expressive power'
        constrained_by: ['rfc-9741#R-0028', 'rfc-9741#R-0034']
      - name: 'matching relation'
        type: 'equality with a C printf output'
        required: true
        note: 'ISO/IEC 9899:2024 §7.23.6.1, as profiled in schema/printf-profile.derived.txt. %s interpolates UTF-8 text; %c is a Unicode scalar value as UTF-8'
        constrained_by: ['rfc-9741#R-0029', 'rfc-9741#R-0031', 'rfc-9741#R-0032', 'rfc-9741#R-0060']
    layout: >-
      OURS. The output is a sequence of bytes only once the format string and
      the data items are fixed, and the document pins no locale, so for the
      floating-point conversions there is no determined layout at all. See
      schema/printf-profile.derived.txt, U-1.
    quote: >-
      The controller (right-hand side) of the .printf control is an array of
      one printf-style format string and zero or more data items that fit the
      individual conversion specifications in the format string.

  # -------------------------------------------------- §2.4
  - name: 'json-construct'
    locator: "§2.4"
    encoding: 'CDDL source text; constrains a text string that holds a JSON text'
    concrete_syntax: 'text .json any'
    example_from_source: 'embedded-claims = text .json claims'
    fields:
      - name: 'target'
        type: 'text'
        required: true
        note: 'the text is a complete JSON text (STD 90)'
        constrained_by: ['rfc-9741#R-0035']
      - name: 'controller'
        type: 'any'
        required: true
        note: 'matched against the RFC 8949 §6.2 conversion of the JSON value into the CBOR generic data model'
        constrained_by: ['rfc-9741#R-0035', 'rfc-9741#R-0036']
      - name: 'serialization variants'
        type: 'UNCONSTRAINED'
        required: false
        note: 'blank space and map-entry order cannot be constrained; the document names both and defers them to future operators'
        constrained_by: ['rfc-9741#R-0040']
      - name: 'large numbers'
        type: 'a condition on the controller, not on the operator'
        required: false
        note: 'numbers outside JSON''s interoperable range have to be carried as text strings, stated on the right-hand side'
        constrained_by: ['rfc-9741#R-0037', 'rfc-9741#R-0039']
    layout: 'none, and that is the point: §2.4 is explicit that the JSON serialization is not constrained'
    quote: >-
      This control operator provides no way to constrain the use of blank space
      or other serialization variants in the JSON representation of the data
      items; restrictions on the serialization to specific variants (e.g., not
      providing for the addition of any insignificant blank space and
      prescribing an order in which map entries are serialized) could be
      defined in future control operators.

  # -------------------------------------------------- §3.1
  - name: 'join-construct'
    locator: "§3.1"
    encoding: 'CDDL source text; constrains a text string OR a byte string'
    concrete_syntax: 'text .join [string-element, *string-element]'
    example_from_source: 'legacy-ip-address = text .join legacy-ip-address-elements'
    fields:
      - name: 'target'
        type: 'text or bytes'
        required: true
        note: 'the only operator in this document whose target may be either kind of string'
        constrained_by: ['rfc-9741#R-0004', 'rfc-9741#R-0043']
      - name: 'controller'
        type: 'array'
        required: true
        constrained_by: ['rfc-9741#R-0004', 'rfc-9741#R-0042']
      - name: 'controller[*] -- elements'
        type: 'string (text or bytes), literal or typed'
        required: false
        note: 'an empty array is admitted and matches either kind of empty string. "string" covers both kinds because §1.1 defines it that way for this document'
        constrained_by: ['rfc-9741#R-0010', 'rfc-9741#R-0042', 'rfc-9741#R-0045']
      - name: 'validation coverage'
        type: 'a property of the validator, not of the construct'
        required: false
        note: 'general-case validation would need full parser functionality, so it is not required; the ABNF control operators of RFC 9165 §3 are offered as the alternative, with the limit that they cannot reach back into CDDL-specified elements'
        constrained_by: ['rfc-9741#R-0049', 'rfc-9741#R-0052', 'rfc-9741#R-0056']
      - name: 'result kind'
        type: 'text or bytes, determined by controller[0]'
        required: true
        note: 'read off the FIRST element, so element order is semantic'
        constrained_by: ['rfc-9741#R-0044']
      - name: 'concatenation level'
        type: 'byte sequences'
        required: true
        note: 'NOT characters and NOT code points. Individual elements need not be valid text'
        constrained_by: ['rfc-9741#R-0046', 'rfc-9741#R-0048']
      - name: 'text validity condition'
        type: 'valid UTF-8, on the RESULT only'
        required: true
        note: 'the only text-identity property this document imposes on a text result'
        constrained_by: ['rfc-9741#R-0047']
      - name: 'marker elements'
        type: 'constant-valued array elements'
        required: false
        note: 'the implementation strategy and the recommended drafting discipline both turn on these. A validator may scan for the markers directly, or build a parsing regexp (RFC 9485 §6) with one capture group per element'
        constrained_by: ['rfc-9741#R-0050', 'rfc-9741#R-0051', 'rfc-9741#R-0053', 'rfc-9741#R-0054', 'rfc-9741#R-0055', 'rfc-9741#R-0056']
    layout: >-
      The one place the document is byte-level: "The concatenation is performed
      on the sequences of bytes in the strings." OURS: so a .join element may
      end in the middle of a multi-byte UTF-8 sequence, and a fortiori in the
      middle of a combining-character sequence. See design-notes.md §1.3.
    quote: >-
      The control operator matches a data item if that data item is also a
      string, built by concatenating the strings in the array.

# ---------------------------------------------------------------------
# What this file does NOT contain, and why.
# ---------------------------------------------------------------------
not_present:
  messages: >-
    none. RFC 9741 defines no message, request, response, envelope, header or
    header parameter. Its §5 is two sentences, both of them incorporations by
    reference, and neither mentions a party.
  envelopes: >-
    one is NAMED but not defined: §2.1's example writes `signature = bytes
    .cbor COSE_Sign1`, and `COSE_Sign1` appears nowhere else in the document
    and is never defined. It is an illustration borrowed from RFC 9052, and
    this record carries it as examples/vectors.yaml V-0001 without resolving
    it. OURS: that example is, almost exactly, our own R-I-03 export path --
    see design-notes.md §2.1.
  registry_entries_as_fields: >-
    §4's Table 7 is captured in schema/tables.txt and as `iana_entry` on each
    of the fourteen operators in schema/control-operators.derived.yaml. It is
    not repeated here, because a registry row is not a field of a construct.

# ---------------------------------------------------------------------
# Cross-check: every requirement id this file cites, and every
# requirement locator no construct reaches.
# ---------------------------------------------------------------------
locator_join:
  basis: >-
    Each construct above sits at one of the document's ten requirement
    locators. `constrained_by` names the requirement that DEFINES the field,
    not every requirement in the same section. [correction, pass 2] Pass 1
    wrote "50 of the 61 requirements are cited by a field above or in
    `shared_shape`; 11 are not". RECOUNTED MECHANICALLY over every
    `constrained_by` in this file: 48 are cited and 13 are not, and the list
    below ran to 11 because rfc-9741#R-0001 and rfc-9741#R-0058 were omitted
    from it altogether. Both are added. The split is 48 cited / 13 uncited,
    and all 13 now carry a reason.
  requirements_no_field_cites:
    - 'rfc-9741#R-0001 (§1) -- ADDED AT PASS 2. States where CDDL may be extended at all ("control operators" are "its main language extension point"). A fact about the language, not about any construct in it; it is the premise of this whole record rather than a constraint on a field, and design-notes.md §6 cut 1 is where it does its work'
    - 'rfc-9741#R-0002 (§1) -- a fact about the IANA registry before this document. Carried instead in schema/control-operators.derived.yaml -> registry_state, where it does its work'
    - 'rfc-9741#R-0003 (§1) -- the document''s own scope statement'
    - 'rfc-9741#R-0006 (§1.1) -- an incorporation of RFC 8610''s vocabulary'
    - 'rfc-9741#R-0009 (§1.1) -- defines the word "Tool"; no construct has a tool as a part'
    - 'rfc-9741#R-0011 (§1.1) -- defines the word "opinionated", an editorial stance'
    - 'rfc-9741#R-0012 (§1.1) -- what an absence in this document does and does not mean'
    - 'rfc-9741#R-0026 (§2.2) -- drafting advice not to confuse .base10 with the byte-string operators. It constrains a reader, not a field'
    - 'rfc-9741#R-0038 (§2.4) -- states that one imported I-JSON condition is already discharged by RFC 8949 §6.2. A fact about two other documents'
    - 'rfc-9741#R-0041 (§2.4) -- an explicit ABSENCE (no .jsonseq), so no construct can carry it. Same treatment as rfc-8610#R-0043'
    - 'rfc-9741#R-0058 (§5) -- ADDED AT PASS 2, and the clearer omission of the two: it is the FIRST of §5''s two sentences ("The security considerations in Section 5 of [RFC8610] apply."), pairing with R-0059 below, which pass 1 did list. An incorporation by reference that names no party and constrains no field; it is also the basis of this record''s `protocol` not_applicable'
    - 'rfc-9741#R-0059 (§5) -- incorporates RFC 4648 §12''s security considerations; constrains no field'
    - 'rfc-9741#R-0061 (§6.1) -- the open-std substitute for the paywalled [C]. R-0060, the [C] entry itself, IS cited, because it is the normative definition of .printf''s matching relation'
  verdict: >-
    OURS. No requirement names a field that is missing from this file or from
    schema/, and no field is left without a requirement. Five constructs cover
    all fourteen operators, because the ten base encodings differ only in the
    per-operator values of four fields (alphabet, padding, trailing-bit
    strictness, case) and share one construct; those per-operator values are
    in schema/control-operators.derived.yaml, operator by operator.
