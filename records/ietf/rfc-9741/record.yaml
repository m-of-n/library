distillation:
  standard: "FX-1"
  profile: full
  # DECLARED AT PASS 3 (cross-check), 2026-10-20. All three FX-1 passes are
  # complete at effort max, the artifact set is complete with protocol and
  # state-machine declared not_applicable with written reasons, and the four
  # cross-check deliverables of .claude/skills/extract §3 were re-derived
  # independently and all hold. `reviewed_by` is deliberately left EMPTY on
  # every artifact: a human signs per artifact, and until then these artifacts
  # are readable and citable but not buildable-on.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "74 verbatim spans across 10 locators (§1, §1.1, §2.1-§2.4, §3.1, §4, §5, §6.1), plus all 7 tables, the 1 figure and all 6 CDDL fragments reproduced in fenced blocks with their source line ranges. All 74 confirmed contiguous substrings of the whitespace-normalised source AND confirmed to start and end inside their locator's section range, 0 failures. The source has no form feeds and no page footers (unpaginated RFC v3 rendering), so no page decoration is removed. TWO declared exceptions, neither healed: the hyphenation break at source lines 133/134 severs `left-hand-side`, so that sentence is quoted as two halves; and §3.1's implementation-note aside (lines 416-428) is quoted with its leading `|` bar removed and nothing else, a transformation confined to those 13 lines"
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "61 entries R-0001 to R-0061 in source order, no gaps: 3 stated, 58 inferred. source and extracted keyword counts both 3 and AGREEING, with a 3217-character reconciliation written anyway, because a reader who sees 3 would otherwise have to guess the real normative baseline. The three keywords are revealing rather than thin: two MUST NOTs forbid C printf features inside a .printf FORMAT STRING (R-0030 length modifiers, R-0033 the \"p\" and \"n\" specifiers) and bind a specification author; the one RECOMMENDED (R-0056) is the only keyword that binds an implementation, it sits inside an RFC v3 aside, and it concedes false negatives in the same sentence. What was counted instead: every operator definition and target/controller admissibility, every matching rule, every explicit absence or disclaimer of capability, the §1/§4 registry facts, and the lower-case force words the document does use (need to be, needs to be reflected, recommended, should not be confused, cannot, may be useful, will use, apply). §1.1's BCP 14 boilerplate is deliberately never quoted here - bin/validate counts texts with stripping off, so quoting it would add 11 phantom keywords and the extraction would read 14 against a source of 3; it is quoted in normative.md, which nothing counts"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "3 verbatim and 3 derived. RFC 9741 ships NO grammar - it adds nothing to RFC 8610's ABNF and defines no syntax - so the verbatim captures are the document's own CDDL and tables rather than a grammar: all 6 CDDL fragments (cddl-fragments.cddl) and all 7 tables (tables.txt), lifted by line range with the RFC's three-space margin intact, each of the 13 regions carrying its source line range and its own sha256; plus the single I-Regexp the document prints (base10-numeral.iregexp, `0|-?[1-9][0-9]*`, quoted from inline §2.2 prose). Derived: a dedented tool-readable CDDL companion that round-trips in both directions; control-operators.derived.yaml, which is the central artifact - all 14 operators as data with target, controller, predicate, IANA entry, text-form injectivity, 10 new side conditions N-01..N-10 and a verdict on each affected rfc-8610 gap; and printf-profile.derived.txt, the exact C printf profile §2.3 adopts with four under-specifications. 52 mechanical checks pass: every region byte-identical to its declared range, every declared digest verifying, the dedent round-tripping, and a completeness sweep finding no uncaptured table row or CDDL rule anywhere in the source"
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "5 constructs covering all 14 operators plus a shared_shape entry, 29 fields. The ten base encodings share one construct because they differ only in the per-operator values of four fields (alphabet, padding, trailing-bit strictness, case), which are held operator by operator in schema/control-operators.derived.yaml. `constrained_by` IS used, unlike the rfc-8610 file that omits it throughout: 48 of the 61 requirements are cited by a field, and the 13 that are not are listed in `locator_join` with a reason each - 7 are statements about CDDL or about the document, 2 are facts about other documents, 1 is an explicit absence (no .jsonseq), and 3 are incorporated security considerations or a reference entry. Pass 1 recorded this split as 50/11 and its list omitted R-0001 and R-0058; pass 2 recounted every constrained_by mechanically, found 48 cited and 13 uncited, and added the two missing reasons, so the listed set and the uncited set are now identical"
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "8 vectors V-0001 to V-0008 in source order with no gaps, covering every example the document prints: 6 CDDL fragments and 4 instances, 3 valid and 1 invalid. The single negative (\"0x1234\" against `hexlabel<1..20>`) is the source's own; none is invented. V-0004 to V-0006 share one fragment because the source gives it three instances in one sentence. Every `cddl` block re-verified as a dedented contiguous slice of the cache at its declared source_lines, and every instance confirmed present in the source. THE FINDING: this document prints not one instance of any base encoding it defines - no base64, base32, base16 or base45 fixture exists anywhere in RFC 9741, so every fixture for the ten operators we are most likely to use would be ours under R-O-03"
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "the answer this record was extracted for, with four pieces of evidence: a CDDL schema CANNOT state a Unicode normalisation or text-identity constraint after this document, and §2.4 says the missing operator class is future work in the document's own words. Eight of the fourteen operators do pin an injective text form, but only for text that transcodes a byte string or an integer, so condition (6) is answerable for a hex digest and unanswerable for a label under EVERY DEC-002 option. Also: the .join non-compositionality finding and the one-line rule it produces for SDSI name chains (normalise after joining, never per label), which no document of ours states; an operator-to-field mapping over all of ARCH-0001 §4.1; SIX named cuts against MD-3, five naming the DEC-002 option they favour and one stated in option 5's favour; 9 source defects; and the correction rfc-8610's control-operators.derived.yaml is owed"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "RFC 9741 defines no exchange, no role and no message - it defines fourteen predicates over a data item. Its entire §5 is two sentences, both incorporations by reference: \"The security considerations in Section 5 of [RFC8610] apply.\" and \"In addition, for the control operators defined in Section 2.1, the security considerations in Section 12 of [RFC4648] apply.\" Neither names a party. The only procedural content is §4, and it is a COMPLETED registration in the past tense - \"IANA has registered the contents of Table 7 into the \"CDDL Control Operators\" registry of [IANA.cddl]\" - not even a policy, since RFC 8610 §6.1 governs and is not restated. The word \"tool\" appears, defined in §1.1 as \"tools along the lines of that described in Appendix F of [RFC8610]\", and a tool is a single-party validator, not a role in an exchange."
    - kind: state-machine
      reason: "No states and no transitions, for the same reason the protocol artifact is absent: matching is a predicate over a specification and an instance. Nothing in the document registers, issues, rotates, revokes or expires anything, and no sentence describes a sequence of events. The nearest thing to a process is §3.1's implementation note, which describes a validator scanning a text once with marker elements - an algorithm, not a lifecycle."
  passes:
    - pass: extract
      by: "claude-opus-5 (pass 1 of library#39 Tier 2; single agent, whole artifact set)"
      effort: max
      date: "2026-10-19"
      note: "read only .cache/rfc-9741.txt - never a summary and never another agent's output. Every verbatim block was lifted from the cache by line range by script, never retyped, and every prose span was verified mechanically rather than by eye: 74 of 74 contiguous inside their locator's section (0 failures), 13 of 13 schema regions byte-identical with their declared per-region digests verifying, 8 of 8 vector blocks dedented contiguous slices, 60 paired quoted spans in the prose artifacts audited of which 34 are RFC 9741's own and verbatim and 26 are quotations of OTHER documents (our ARCH/ADR/PLAN/topic files, rfc-8610's and dCBOR's artifacts) or declared glosses of ours, each re-verified against its own source. [correction, pass 3, 2026-10-20] That last clause overclaims and is withdrawn for one class: the ARCH-0001 / ARCH-0002 / ADR-0001 / MD-3 / PLAN-0001 / DECISIONS-0001 / R-O-* / R-I-* quotations CANNOT be re-verified against their own source from this repository, because this library is standalone by design and holds none of those files - a find over the worktree returns nothing. Pass 2 flagged them rather than passing them; pass 3 marks them as unverifiable-here in distilled/design-notes.md's provenance block rather than inheriting the claim. The in-library quotations in that set (topics/canonical-encoding.yaml, rfc-8610's cache and derived artifacts, rfc-9165's abnf-in-cddl.cddl, records/community/draft-mcnally-deterministic-cbor) WERE re-verified mechanically at pass 3 and all are present. The two text transformations the extraction relies on are DECLARED in every file that depends on them rather than applied silently: the hyphenation break at lines 133/134 is left broken and quoted as two halves, and the §3.1 aside's leading `|` bar is removed only on lines 416-428. 61 requirements parse identically under both bin/ YAML readers with 61 distinct ids, and the recomputed extracted_keyword_count is 3 against a source count of 3"
    - pass: verify
      by: "claude-opus-5 (pass 2 of library#39 Tier 2; adversarial, independent re-derivation, read only .cache/rfc-9741.txt)"
      effort: max
      date: "2026-10-20"
      note: "BRIEFED TO BREAK THE CENTRAL NEGATIVE AND DID NOT. Re-derived independently: normaliz/normalis/NFC/NFD/NFKC/NFKD/canonical/identity/hash/digest all 0 occurrences, Unicode 1, UTF-8 3, locale 0, overflow 0, round 0; Table 1 re-read as 14 operators in 10 text<->bytes, 1 text<->int, 1 text<->array, 1 text<->any, 1 concatenating. Probed every indirect route the brief named - .printf (vacuous for %s, pins only closed sets), .join over constrained parts (compositional only, adds byte-level structure but no atomic text predicate) - and the negative holds. MECHANICAL, ALL RE-RUN FROM THE CACHE: 61/61 requirement texts and 74/74 normative spans contiguous in the whitespace-normalised source with BOTH ENDS inside their locator's section (0 failures, 0 ambiguous); exactly 4 artifacts (R-0053..R-0056 and the 4 §3.1 aside spans) depend on the aside-bar strip and nothing else does; the hyphenation break confirmed real (the healed token `left-hand-side` occurs nowhere in the source); 0 form feeds, 0 `[Page N]` footers, 0 running headers, so the no-page-decoration claim holds; 13/13 regions byte-identical with all 13 declared sha256 verifying (convention: sha256 of '\\n'.join(lines), no trailing newline); 6/6 dedent round-trips; 8/8 vector cddl blocks dedented contiguous slices with 4/4 instances present; completeness sweep finds 0 uncaptured table rows or CDDL rules; both YAML readers agree on every file with ids distinct. SIX FALSIFICATIONS, each corrected in place with the falsification recorded and none repaired silently: (1) the §3.3 / open-question-5 conclusion that `Validity` has no usable text form in CDDL and that .printf is the only other route - FALSE, .regexp (RFC 8610 §3.8.3) and .abnf (RFC 9165 §3) both constrain text shape and RFC 9165's own Figure 5 IS an RFC 3339 date-time, held in this library; the surviving finding is narrower and sharper, that no operator ties the text to an INTEGER VALUE; (2) 'case-insensitive matching of arbitrary text remains impossible' in two places - FALSE, rfc-9165's .abnf is case-insensitive by default and .hex here is itself an intrinsically case-insensitive matching relation, which pass 1 logged only as a trap; (3) the sentence pass 1 wrote INTO rfc-8610 asserting none of the 44 side conditions is closed by any of rfc-9741/rfc-9165/rfc-9090 - FALSE and about two documents pass 1 had not read; rfc-9165 partially closes G-35; (4) messages.yaml's join, recounted as 48 cited / 13 uncited rather than 50/11, with R-0001 and R-0058 missing from locator_join entirely and now added; (5) .hex's '2**n texts per value' - only a-f have case, so it is 2**k for k letter-digits; (6) the source byte count, 28559 not 28550. TWO OVERSTATEMENTS NARROWED: the central negative's evidence 2 ('not one imposes a predicate about the text's own form as text') is contradicted by §2.1 in the document's own words and is restated as the claim that survives; and defect 7's 'the same fourteen names in three different orders' - Table 2 holds only TEN, and '(hex last)' is wrong since .b45 is last in both. THREE CONSEQUENTIAL DEFECTS ALL CONFIRMED, one strengthened: §2.2 itself routes its 2**63-1 example to §2.3 'for other numeric bases', an operator that cannot accept it. ONE SOURCE AMBIGUITY ADDED: Table 2's 'either case' is undecided between case-insensitive-mixing and the two uniform forms, which changes .hex's match-set size though not its non-injectivity. No profile declared and reviewed_by left empty: pass 3 (cross-check) has not run"
    - pass: cross-check
      by: "claude-opus-5 (pass 3 of library#39 Tier 2; did neither the extract nor the verify pass; own scripts, read only .cache/rfc-9741.txt)"
      effort: max
      date: "2026-10-20"
      note: "ALL FOUR CROSS-CHECK DELIVERABLES OF .claude/skills/extract §3 CONFIRMED, each re-derived rather than inherited. (1) EVERY FIELD A REQUIREMENT NAMES EXISTS. Walked every constrained_by in messages.yaml mechanically under BOTH readers: 64 occurrences, 48 distinct requirement ids cited by a named field, 13 uncited - exactly pass 2's 48/13, with the declared requirements_no_field_cites list set-equal to the computed uncited set and ZERO dangling ids. 5 constructs + shared_shape, 26 + 3 = 29 fields, no duplicate field name in any construct. The 13 uncited partition exactly as record.yaml claims (7 about CDDL or about the document: R-0001 R-0003 R-0006 R-0009 R-0011 R-0012 R-0026; 2 facts about other documents: R-0002 R-0038; 1 explicit absence: R-0041; 3 incorporated security considerations or a reference entry: R-0058 R-0059 R-0061). Every operator, alphabet, padding, strictness, case, dialect and matching-relation a requirement names resolves to a field here or to a key in schema/control-operators.derived.yaml; all 14 registered names are defined there. (2) and (3) protocol and state-machine remain correctly not_applicable and the verdicts are consistent with every other artifact: §5 is two incorporations by reference naming no party, §4 is past-tense completed registration, no `actor` value anywhere is a protocol role (the four are CDDL tool implementer, CDDL specification author, IANA / registrant, reader of this specification), and §3.1's implementation note is held everywhere as an algorithm, never a lifecycle. (4) EVERY EXAMPLE VALIDATES. 8/8 vector cddl blocks are dedented contiguous slices of the cache at their declared source_lines; 6/6 dedent round-trips (F06's caption correctly kept in the verbatim file and dropped from the derived one); the three positive .printf instances EXECUTED - printf(\"0x%04x\", 19) == \"0x0013\" and printf(\"0x%04x\", 1) == \"0x0001\" - and V-0006 confirmed negative for the stated reason only (0x1234 is the well-formed rendering of 4660, which is outside 1..20); the .base10 I-Regexp taken from base10-numeral.iregexp and run over 0 / 007 / 19 / -0 / +7 / 01 / 2**63-1, all 7 as claimed; Figure 1's .join over .base10 over 0..255 executed over 192.0.2.1 / 192.000.2.1 / 192.0.2.256 / 192.0.2, all 4 as claimed. ALSO RE-DERIVED FROM THE CACHE WITH PASS 3'S OWN SCRIPTS: 74/74 normative spans contiguous in the whitespace-normalised source and inside their locator's section across exactly 10 locators, 4 aside-dependent, 0 failures; 61/61 requirement texts likewise, 0 failures, 4 aside-dependent; the healed token left-hand-side absent from the source; BCP 14 recounted as 3 in the source and 3 across the requirement texts, 3 stated / 58 inferred; 13/13 regions byte-identical with all 13 digests verifying under the convention schema/README.md now states AND under none of the alternatives (no region's digest matches the same lines with a trailing newline), so the documented convention is the one every file uses; the derived/verbatim convention holds on all 6 schema files; no TODO marker anywhere under distilled/; every path cited by an artifact resolves except four contextual shorthands. FIVE CORRECTIONS, ALL TO OUR OWN TEXT, none to a source defect: (a) schema/control-operators.derived.yaml .printf.new_capability still ended 'Before this, a text string could be constrained only by .regexp against a literal pattern' - the identical claim pass 2 falsified and corrected in summary.md, which survived unchanged here; (b) N-02 and N-03 were double-quoted YAML scalars with unescaped interior double quotes, strictly invalid YAML that both library readers happen to tolerate, now single-quoted with no wording change; (c) .hexlc and .hexuc carried no `padding` or `strict` key while the other eight base-encoding operators carried both, so the table was unanswerable for 2 of its 10 - added as n/a and true, which is what §2.1 and counts.strict_only_variants: 8 already assert; (d) NOTHING in the record marked the ARCH-0001 / ARCH-0002 / ADR-0001 / MD-3 / PLAN-0001 / DECISIONS-0001 / R-O-* / R-I-* quotations as unverifiable in this standalone repository - a find over the worktree returns none of those files - and pass 1's own note claimed they had each been 're-verified against its own source'; design-notes.md's provenance block now marks the class and lists what pass 3 DID verify in-library, and pass 1's claim is withdrawn in place; (e) summary.md asserted C printf behaviour (locale decimal point, %c writing one byte) as fact where schema/printf-profile.derived.txt marks every such claim [unverified], no C standard being cached - both bullets now inherit that status. ONE CONSISTENCY GAP LEFT OPEN DELIBERATELY: no record in this library marks its mofn quotations as unverifiable-here, so the convention this record now follows is ahead of the lane rather than a defect peculiar to it. The three consequential source defects stand confirmed and unrepaired, the central negative and the .join non-compositionality finding survived this pass unchanged, and every reviewed_by is left empty"
