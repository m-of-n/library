distillation:
  standard: "FX-1"
  # NO `profile` IS DECLARED. Pass 1 (extract) is complete and the artifact set
  # is complete, but an unfinished extraction has neither `full` nor `partial`
  # (docs/extraction.md), and passes 2 (verify) and 3 (cross-check) have not
  # run. `distillation.passes` below is the ONLY authority for which passes
  # have run; no artifact restates the count, because such a restatement goes
  # stale the moment the next pass lands and nothing reports it - found stale
  # in four files at once in rfc-9338, four in rfc-8778 and one in rfc-9921.
  # `status` stays `summarized` and no `reviewed_by` is signed.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "Every normative statement of the Abstract and sections 1-7 verbatim with its locator, plus Table 1 whole and the section 7.1.1 and 7.2.2 registration templates. Regions carry a line range and a sha256 of the region's lines joined by newline with no trailing newline. The source has ZERO form feeds in 683 lines, so no region can contain page decoration and none was excluded for that reason."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "118 entries, R-0001 to R-0118, in source order with no gaps: 111 stated, 7 inferred. source_keyword_count and extracted_keyword_count both 8 and AGREEING. THE EIGHT, by line and section: MUST at 172 (section 3.1, unrecognised members ignored), MUST at 180 (section 3.1, one key only), MUST at 227 and MAY at 228 (section 3.2, required members / other members), MAY at 231 (section 3.2, symmetric in COSE_Key), MUST at 235 (section 3.2, encrypt if the CWT is not), SHOULD at 357 (section 4, audience restriction), MUST NOT at 391 (section 4, keys failing trust criteria). The 11 other all-caps occurrences are the section 1.1 BCP 14 recital at lines 101-103, deliberately not an entry. Verified: all 118 texts are contiguous substrings of the whitespace-normalised source, and a census of all 118 texts finds exactly 8 keywords, so none is smuggled in from a quoted reference or a registry template. TWO TEXTS OCCUR TWICE IN THE SOURCE - R-0038 and R-0052 - which is a duplicate-text group and the one place a wrong id still matches the quoted words; neither is cited from any artifact yet."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "1 verbatim rendering and 3 derived files, plus a README. THE DOCUMENT SHIPS NO GRAMMAR: CDDL occurs ONCE in 683 lines, at line 630, and that is a reference entry rather than a block; ABNF, ASN.1 and JSON Schema occur zero times. So source-renderings.txt captures the structural statements the document does make - Table 1, the two registration templates - and the derived CDDL and JSON Schema render the `cnf` claim and its three confirmation methods as a shape, with $id urn:library:rfc-8747:cnf-claim.derived. confirmation-methods.derived.yaml carries the three methods as data with their JWT equivalents."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "4 structures and 8 field entries, counted from the parsed file. Only `cnf` and its three confirmation methods are this document's own; COSE_Key, Encrypted_COSE_Key and CWT_Claims_Set are RFC 8152's and RFC 8392's and are NAMED, never redefined, each with its empty constrained_by explained per structure rather than left to inference. 17 distinct requirement ids wired, and the 101 not wired are enumerated BY LOCATOR rather than described - section 1's paradigm prose, section 3.4's and section 6's Key ID analysis (which is about what a kid IS, not about a wire field), section 3.5's intentionally-unspecified nonce, sections 4 and 5, and section 7's registry procedure. Three fields a requirement names and this file does not define - the nonce, the signed nonce, and audience restriction - are listed with why, which is the closure (a) direction a cross-check will test."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "PRODUCED RATHER THAN DECLARED not_applicable, and the reason is the finding. This is the only record in library#39's CBOR/COSE set whose source names parties and still has no flow: measured whole-word and case-insensitively over all 683 lines, `presenter` 18, `recipient` 14, `issuer` 8, `party` 8, `parties` 7 - three roles with distinct obligations, and the most-named of them carries NONE of the document's eight keywords. What it lacks is the exchange, and that absence is the document's own declaration rather than our inference: section 3.5 is titled Specifics Intentionally Not Specified and withholds both the nonce (R-0064) and the signed nonce (R-0065). So 3 roles, 0 flows, 0 error paths and 2 declared absences, each with its requirement id and its quotation. NO MERMAID DIAGRAM, deliberately: there is no sequence to draw and a plausible one would be ours. Corroborating thinness: `response`, `handshake`, `negotiate`, `sender`, `verifier` and `round` are each ZERO, `protocol` is 2 - one of them inside section 3.5's own disclaimer - and `request` is 4, one being the masthead."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "6 vectors over the three worked examples (sections 3.2, 3.3, 3.4), gated on 2 external known-answer tests - FIPS 197 C.1 for the block cipher and RFC 3610 test vector 1 for AES-CCM with an 8-octet tag and a 13-octet nonce - so the codec is checked before the document is. The document prints no hex dumps and no figures: `figure`, `hex` and `vector` each occur ZERO times, and the examples are CBOR diagnostic notation. ONE SOURCE DEFECT FOUND AND NOT REPAIRED, D-0001, which is the sharpest thing in the record after the Key ID finding - see distillation.passes."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "The finding this record exists for, which is a DEFINITION BY CONTRAST rather than anything adopted: section 3.4 says the Key ID for a specific key is not necessarily the same for different parties and may differ on both sides of the conversation, so a kid is a (party, local label) pair resolved by TABLE LOOKUP where ARCH-0002 P1 makes an extension point a (defining key, local label) pair resolved by DERIVATION - same shape, different first element, and that difference is the whole of P1. With the other three limbs of what a Key ID is NOT: not derived (the content is application specific, with a hash of the public key named as one option and no key encoding, parameter subset or digest algorithm specified), not unique (implementers should expect collisions - lower case, and the failure is predicted in the text with nothing mandated against it), and uniqueness relocated to the issuer's discipline over time with impersonation as the stated consequence. 3 adopts, 2 adaptations, 2 rejections. MD-3 addressed with THREE CUTS AND ONE CONVERGENCE, each naming the DEC-002 option it affects: the OPTIONAL tag on Encrypted_COSE_Key gives two conforming encodings of one value and costs option 5; the extension point for the missing half of the protocol is a REGISTRY FOR A PROTOCOL STEP, which option 5's no-IANA-tags does not reach, so option 5 is narrower than it sounds; and the party-relative kid costs every option equally, recorded so the cut list is not read as uniformly favouring option 5. The canonical-encoding conditions are answered as a NEGATIVE - this document supplies the mechanism for none of the six, and `canonical`, `deterministic` and `normaliz*` each occur zero times. 4 open questions. 0 source defects in the prose, reported as a negative because not-found and not-looked-for must be distinguishable."
      reviewed_by: ""
  not_applicable:
    - kind: state-machine
      reason: "RFC 8747 defines no lifecycle, and the verdict is DERIVED rather than asserted. Measured whole-word and case-insensitively over all 683 lines: `state` 0, `states` 0, `lifecycle` 0, `transition` 0, `revoke` 0, `revocation` 0, `rotate` 0, `expire` 0, `expiry` 0, `expiration` 0, `issuance` 0, `step` 0, `steps` 0 - thirteen words at zero. The four near misses were each checked rather than counted: `issue` once at line 415, inside section 6's advice that an issuer not issue another CWT with the same Key ID, which constrains the issuer's behaviour ACROSS CWTs and is not a transition of any object; `register` 4 and `registration` 12, all section 7's IANA procedure and the reference list, which is a process for the registry rather than for a CWT; `order` twice, both `in order to`; and `freshness` once, inside section 3.5's declaration that the means of demonstrating it are NOT specified. AND THERE IS A SHARPER REASON THAN THE COUNTS: a confirmation key is fixed when the CWT is issued and nothing in these 683 lines changes it afterwards. The `exp` claim that would give a CWT a lifetime is RFC 8392's and is never constrained here; section 6 does reason about the lifetime of the CWTs, but only as the WINDOW within which an issuer must not reuse a Key ID - a constraint relating two CWTs to each other rather than sequencing one. The one place a reader might expect a machine is Key ID collision handling, and section 3.4's recipients should be prepared to handle such situations names no state, no trigger, no guard and no recovery, in lower case. FIVE SIBLING CBOR/COSE RECORDS AT profile: full DECLARE THIS ARTIFACT N/A ON THREE DIFFERENT GROUNDS - rfc-9804 names parsing, rfc-8949 the decode of a single data item, rfc-8610 and rfc-9741 that matching is a predicate and not a lifecycle, and rfc-9682 a transition period in the installed-tool population. THIS RECORD'S GROUND IS A FOURTH and is none of those: it has a lifecycle-shaped SUBJECT - a key bound to a token and held by parties over time - and the document declines to give it states. Kept distinct rather than folded into the others, because a reader looking for prior art on key rotation will come here and should find the absence rather than an oversight. Written out in distilled/state-machine.yaml."
  passes:
    - pass: extract
      by: "claude-opus-5 (pass 1 of 3; single agent, whole artifact set; resumed three times after interruption, the last stretch completed in the coordinating session)"
      effort: max
      date: "2026-10-21"
      note: 'Read only .cache/rfc-8747.txt - never summary.md and never another record artifacts as a source of fact about this document. EVERY VERBATIM BLOCK AND EVERY QUOTATION WAS CUT FROM THE CACHE BY LINE RANGE BY SCRIPT and verified mechanically: 118 of 118 requirement texts are contiguous substrings of the whitespace-normalised source, and the keyword census over those 118 texts returns exactly 8, matching bin/bcp14-count, so nothing is smuggled in from a quoted reference or a registry template. The source has 683 newline-delimited lines and ZERO form feeds. THE CENTRAL FINDING IS A DEFINITION BY CONTRAST, not an adoption: section 3.4 says a Key ID "may be different on both sides of the conversation", so a kid is a (party, local label) pair resolved by table lookup against ARCH-0002 P1 (defining key, local label) resolved by derivation. The contrast was re-derived at source rather than inherited from the record bears_on block, and all four limbs of what a Key ID is NOT are the document own words. ONE SOURCE DEFECT, D-0001, AND IT BEARS DIRECTLY ON CANONICAL ENCODING: section 3.3 states that the COSE_Key representation is used as the plaintext when encrypting the key, and the COSE_Key it PRINTS is not, byte for byte, the plaintext of the ciphertext it prints. Both are 40 octets and the same three pairs with the same values - verified identical as byte multisets and NOT identical as sequences - but the printed map is ordered 1, 3, -1 (kty, alg, k) and the encrypted one 3, 1, -1 (alg, kty, k). The printed order IS RFC 8949 section 4.2.1 deterministic, since the encoded keys 01, 03, 20 are ascending; the encrypted order is NOT. So a reproduction check against the document own worked example fails on MAP ORDER ALONE, which is exactly the cost of leaving order unpinned - and RFC 8747 never uses the word canonical or the word deterministic. The document is internally consistent as cryptography and inconsistent as presentation. Recorded, not repaired: V-0004 carries the bytes that reproduce and V-0005 the control that does not. The CCM authentication behind it is this pass claim and is pass 2 to re-derive; the CBOR arithmetic, the byte lengths, the 48 = 40 + 8 and the determinism of each order were verified independently. THE PROTOCOL ARTIFACT IS PRODUCED RATHER THAN DECLARED N/A, which no other record in this lane does: three roles are named 18, 14 and 8 times while section 3.5 withholds both halves of the exchange by its own declaration, so recording three roles and two declared absences says more than an N/A verdict would. The state machine IS N/A, on a ground none of the five sibling records shares. TWO DEFECTS IN THIS PASS OWN PROSE, found by the pass and recorded rather than quietly fixed: a HEALED HYPHENATION BREAK in design-notes section 2, which quoted section 3.1 MUST as "a single proof-of-possession key" where source lines 180-181 cut it AT THE HYPHEN, so the normalised source reads proof-of- possession and the quoted token would have occurred nowhere in RFC 8747 - it is the only hyphenation break among the eight keyword-bearing sentences, and requirements.yaml R-0028 had it right throughout; and a VERBATIM SENTENCE UNMARKED IN A WHOLE-SCALAR VALUE in messages.yaml `cnf` purpose field, invisible to a delimited quote audit, which is the blind spot hazards.md names. Plus one count the pass got wrong about itself: messages.yaml coverage first said 21 ids and 11 fields where the parsed file has 17 and 8. All three corrected in place. Both YAML readers parse every artifact. Left for pass 2: the unusually high 111 stated / 7 inferred split, since contiguous and literally stated are different claims; R-0038 and R-0052, which each occur twice in the source and are cited from nowhere yet; R-0040, which begins with a conjunction after a mid-sentence split off R-0039; and the inference behind producing protocol rather than declaring it N/A.'
status: summarized
usefulness:
  verdict: useful
  reason: "Upgraded from marginal 2026-10-20. Not for the `cnf` claim, which we may never need: for §3.4 and §6, which are the standards-track statement of what a bare `kid` is NOT — not derived, not unique, collisions foreseen, and different for different parties. That is DEC-003's subject, R-O-01's literal subject, and the clearest available contrast with ARCH-0002 P1's key-relative naming. Also the registry RFC 9679's `ckt` lands in (RFC 9679 §8)."
  assessed: "2026-10-20"
confidence: medium
owner: S1
