  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: '28 fenced regions covering 389 of the source''s 683 lines, in document order: the masthead (so `maturity: standard` is quoted from line 7 rather than inferred), the Abstract, and sections 1 to 7.2.2 entire, including Table 1 and all THREE IANA registration blocks - 7.1.1, 7.2.1 and 7.2.2 - plus section 7''s procedure and the one-sentence registry-creation statements at 7.1 and 7.2, which is six regions in section 7. [Corrected by pass 3 from "all four IANA blocks", a figure matching neither the three registration blocks nor the six regions; source-renderings.txt carries the three.] Each region carries its line range and a sha256 of its lines joined by a newline with no trailing newline; all 28 were verified byte-exact AND digest-exact against their declared ranges at write time. Dropped and stated as dropped: Status of This Memo (32-44), Copyright (46-59), the ToC (61-85), both reference lists (556-633), Acknowledgements (635-644), Authors'' Addresses (646-683). The five printed examples live in distilled/examples/README.md, fenced and digested there, so they are not double-counted here. THE SOURCE HAS ZERO FORM FEEDS, so no region can contain page decoration and none is excluded anywhere; built with split on a newline, never splitlines.'
