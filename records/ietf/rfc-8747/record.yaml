distillation:
  standard: 'FX-1'
  # NO `profile` KEY, DELIBERATELY. Pass 1 of 3 has run; passes 2 (verify) and
  # 3 (cross-check) have not. An unfinished extraction has no profile, and
  # every `reviewed_by` below is empty because no human has read any of it.
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: '28 fenced regions covering 389 of the source''s 683 lines, in document order: the masthead (so `maturity: standard` is quoted from line 7 rather than inferred), the Abstract, and sections 1 to 7.2.2 entire, including Table 1 and all four IANA blocks. Each region carries its line range and a sha256 of its lines joined by a newline with no trailing newline; all 28 were verified byte-exact AND digest-exact against their declared ranges at write time. Dropped and stated as dropped: Status of This Memo (32-44), Copyright (46-59), the ToC (61-85), both reference lists (556-633), Acknowledgements (635-644), Authors'' Addresses (646-683). The five printed examples live in distilled/examples/README.md, fenced and digested there, so they are not double-counted here. THE SOURCE HAS ZERO FORM FEEDS, so no region can contain page decoration and none is excluded anywhere; built with split on a newline, never splitlines.'
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: '118 entries R-0001 to R-0118 in source order with no gaps: 110 stated, 8 inferred under the criterion requirements.yaml now DECLARES - an asserted obligation or a binding definition against description, analogy, equivalence or framing - which pass 2 found had been applied two ways and left undeclared, and which moved R-0009 to inferred; 35 testable: yes, 12 partial, 71 no. NO ENTRY TEXT RUNS INTO THE NEXT ENTRY''S OPENING: pass 2 found FIVE that did - R-0016, R-0018, R-0031, R-0062 and R-0070 each ended with the first words of its successor, a line-range slicing artifact that every verbatim, locator and citation check passes because the text IS contiguous and correctly filed. All five trimmed to their own sentence boundary, 0 of 118 remaining, and each still verbatim and inside its declared line range. KEYWORD COUNTS RECONCILE AT 8 = 8 as a bijection by source line - L172 and L180 (MUST, section 3.1), L227 (MUST) and L228 (MAY) split from one sentence at a contiguous character boundary, L231 (MAY) and L235 (MUST) in section 3.2, L357 (SHOULD) and L391 (MUST NOT) in section 4 - matching bin/bcp14-count --by-keyword exactly, and NO text smuggles a keyword in from a quoted reference or a registry template. Not one of the eight is in section 3.4 or section 6, which is the whole of what this record is held for. Every text was cut from the cache by line range by script and verified as a contiguous substring of the whitespace-normalised source: 118 of 118, zero relaxations. Three texts cross a line-end hyphen (R-0001, R-0027, R-0028) and NONE IS HEALED - they read ''proof- of-possession'' and ''proof-of- possession'' with the space the break leaves. The section 2 BCP 14 recital is deliberately not an entry: quoting it would add 11 phantom keywords and make the extraction read 19 against a source of 8.'
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: '1 verbatim and 3 derived. RFC 8747 SHIPS NO FORMAL GRAMMAR - measured, the strings schema, grammar, ABNF and ASN.1 occur zero times, JSON Schema zero, and CDDL exactly once, at line 630 inside the RFC 8610 reference entry, which this document cites for Appendix G alone. So every formal artifact here except source-renderings.txt is ours and carries .derived. in its name. AND THE CDDL IS SHOWN TO BIND, NOT MERELY TO PARSE: no cddl tool is installed, so a checker was transcribed from the grammar rule by rule and run over 10 instances - 6 accepted including all three of the document''s own cnf examples, and 4 rejected including the one the grammar exists to reject, a cnf carrying BOTH key representations. 10 of 10 behave as the grammar claims. The vacuity probe is recorded beside it: a naive rendering with an unrestricted wildcard in the same map ACCEPTS ALL FOUR rejected instances, which is the rfc-9360 defect, so every named entry carries the cut operator and other-label excludes 1, 2 and 3 by construction. Stated plainly in schema/README.md: the cut is INERT on Confirmation Keys 1 and 2, because this document defines no COSE_Key or COSE_Encrypt0 grammar and those rules are sockets typed any - the whole constraint on those two labels is carried by other-label''s exclusion, and the cut does real work on Confirmation Key 3 alone. The derived JSON Schema takes $id urn:library:rfc-8747:cnf-claim.derived and declares its own JSON projection lossy, since CBOR distinguishes integer key 1 from text key ''1'' and JSON cannot.'
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: '5 structures and 20 fields: the cnf claim with all four of its member classes, COSE_Key, Encrypted_COSE_Key, kid, and the CWT Claims Set fragment this document registers claim key 8 into. This said 22 fields, as did README.md and messages.yaml''s own coverage block - the file holds 20, counted from the parsed file as 4 + 3 + 4 + 3 + 6. It is the same field that pass 1 had already corrected once, from 21 to 17, so it has now been wrong in three different ways and is the first number a later pass should recount. 38 of the 118 requirements are wired by constrained_by; THREE of the five RFC 8392 claims in the fragment - aud, exp and iat - carry constrained_by: [] with an unwired_reason each, so an adversarial reader can falsify the claim cheaply. The other two, iss and sub, ARE wired, to R-0016 and R-0015, which is why this no longer says all five are unwired. EVERY OCTET COUNT WAS RE-DERIVED AT WRITE TIME with a CBOR codec, AES-128 and CCM written for this pass and gated on FIPS 197 C.1 and RFC 3610 vector 1 BEFORE use - no cbor, cose or cryptography library was used, so a shared library bug cannot hide behind the numbers. 13 quoted_evidence pairs carry the cited requirement''s OWN text in double quotes with the id immediately after the closing quote, so bin/check-id-joins --quote-join can examine the pair instead of collecting nothing.'
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml + distilled/protocol.md
      coverage: '3 roles, 6 steps, 0 error paths, 27 requirement ids cited, and a Mermaid sequence diagram with EVERY ARROW DASHED. PRODUCED RATHER THAN DECLARED N/A, and the reason is the opposite of a shortcut: rfc-9679''s extraction declared ITS protocol not_applicable on the ground that the flow belongs to RFC 8747. This is RFC 8747. Section 2 defines Issuer, Presenter and Recipient outright - they are named 8, 18 and 14 times - and section 3 states their relation, but of the six steps exactly ONE is even partly specified here, and only as to the structure the issuer builds. Two of the five unspecified legs are withheld by explicit refusal in section 3.5 and a third by section 4''s scope exclusion; all three refusals are quoted in place. THE WORD SWEEP: error 0, step 0, response 0, flow 0, handshake 0, negotiate 0, sender 0, verifier 0, round-trip 0. Counts stated as OCCURRENCES, not lines, which matters for message - 7 occurrences on 6 lines, because line 325 carries it twice. Three of the four nonce occurrences and the single challenge sit inside section 3.5, the section titled Specifics Intentionally Not Specified; the fourth nonce is section 4''s ''nonces and timestamps''. Recording three roles and three declared absences says more than an N/A verdict would.'
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: '6 vectors V-0001 to V-0006 over the source''s 4 printed examples and 1 printed scalar value, plus 5 byte-exact fenced regions in examples/README.md. THE ONE CRYPTOGRAPHIC COMPUTATION THE DOCUMENT CONTAINS REPRODUCES: the section 3.3 COSE_Encrypt0 decrypts under the key printed at line 279 with the section 3.3 IV and AAD 8368456e63727970743043a1010a40, the 8-octet CCM tag VERIFIES, and re-encrypting the recovered plaintext reproduces all 48 printed octets. V-0005 is the control that does not reproduce. Also measured: the section 3.2 point IS on P-256; all five printed maps are in RFC 8949 section 4.2.1 deterministic order while the map actually ENCRYPTED is not; the cnf value is 77 octets with a COSE_Key, 73 with an untagged Encrypted_COSE_Key and 19 with a kid, a ratio of 4.05; the tag costs exactly 1 octet; and the section 3.4 kid is NOT the SHA-256 of the section 3.2 COSE_Key encoding, truncated or whole, so the document does not follow its own suggestion.'
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: 'all four bears_on identifiers against the source rather than inherited, the MD-3 structure-by-structure mapping and the export mapping, 6 NAMED CUTS A-F against MD-3 each naming the DEC-002 option it affects, 6 source defects and 6 open questions, the six canonical-encoding conditions recorded as a measured negative, and a pass-2/3 attention map. THE CUTS DO NOT ALL RUN ONE WAY, which is what docs/extraction.md asks for - six cuts A-F plus an explicit convergence note. Cut A corroborates rfc-8392''s cut 3 from a second mechanism (the tag is optional, so no-tags is OUR decoder rule, not the format''s); cut B is the extraction''s strongest finding and ranks option 1 ahead of option 3 ahead of option 5 on detectability of an order-only divergence, the REVERSE of MD-3''s narrowing and on a ground DEC-002 does not list; cut C is that this document contributes nothing to determinism (canonical 0, deterministic 0); cut D is that carrying cnf would import a second IANA registry with NO allocation tiers, where RFC 8392 section 9.1.1 tiers its Claim Key space - and its actionable conclusion is not about DEC-002 at all, it is ''do not carry cnf''; and cut E is a point FOR option 5, recorded because four cuts against and none for would misrepresent the document; and cut F records that the party-relative kid costs EVERY option equally, so the list is not read as a ranking on every ground. Quotations of m-of-n documents are flagged as unverifiable from this repository, per rfc-9741''s convention.'
      reviewed_by: ""
  not_applicable:
    - kind: state-machine
      reason: 'RFC 8747 defines no lifecycle, and the verdict is DERIVED rather than asserted. Measured whole-word and case-insensitively over all 683 lines: `state` 0, `states` 0, `lifecycle` 0, `transition` 0, `revoke` 0, `revocation` 0, `rotate` 0, `expire` 0, `expiry` 0, `expiration` 0, `issuance` 0, `step` 0, `steps` 0 - thirteen words at zero, each re-verified by this pass. The near misses were checked rather than counted: `issue` once at line 415, inside section 6''s advice that an issuer not issue another CWT with the same Key ID, which constrains the issuer''s behaviour ACROSS CWTs and is not a transition of any object; `register` 4 (L176, L346, L444, L452) and `registration` 13 OCCURRENCES ON 12 LINES (L459 carries it twice), all of them section 7''s IANA procedure, the ToC or the reference list, which is a process for the registry rather than for a CWT; `order` twice (L404, L458), both `in order to`; and `freshness` once at L333, inside section 3.5''s declaration that the means of demonstrating it are NOT specified. [The `registration` figure is corrected here from 12: 12 is the LINE count and 13 the occurrence count, the same lines-versus-occurrences slip this pass also found and fixed in its own protocol word sweep.] AND THERE IS A SHARPER REASON THAN THE COUNTS: a confirmation key is fixed when the CWT is issued and nothing in these 683 lines changes it afterwards. The `exp` claim that would give a CWT a lifetime is RFC 8392''s and is never constrained here; section 6 does reason about the lifetime of the CWTs, but only as the WINDOW within which an issuer must not reuse a Key ID - a constraint relating two CWTs to each other rather than sequencing one. The one place a reader might expect a machine is Key ID collision handling, and section 3.4''s `Recipients of a CWT with a PoP key linked through only a Key ID should be prepared to handle such situations.` names no state, no trigger, no guard and no recovery, in lower case. The nearest thing to a transition is section 3.3''s `could subsequently be encrypted`, which is a derivation of one representation from another, not a state change. FIVE SIBLING CBOR/COSE RECORDS AT profile: full DECLARE THIS ARTIFACT N/A ON THREE DIFFERENT GROUNDS - rfc-9804 names parsing, rfc-8949 the decode of a single data item, rfc-8610 and rfc-9741 that matching is a predicate and not a lifecycle, and rfc-9682 a transition period in the installed-tool population. THIS RECORD''S GROUND IS A FOURTH and is none of those: it has a lifecycle-shaped SUBJECT - a key bound to a token and held by parties over time - and the document declines to give it states. Kept distinct rather than folded into the others, because a reader looking for prior art on key rotation will come here and should find the absence rather than an oversight. No distilled/state-machine.yaml is kept: the sibling records at profile: full that declare this artifact N/A keep no file, but this record keeps distilled/state-machine.yaml anyway: it writes the sweep and the four checked near misses out in full, which is what a reader looking for prior art on key rotation will open. Two of that file''s own measurements were corrected by this stretch - `registration` from 12 to 13 occurrences on 12 lines, and `order` from ''in order to and in order that'' to both being ''in order to''.'
  passes:
    - pass: extract
      by: 'claude-opus-5 (pass 1 of 3; single agent, whole artifact set; resumed three times after interruption)'
      effort: max
      date: '2026-10-21'
      note: 'Read only .cache/rfc-8747.txt - never summary.md, and never another record''s artifacts as a source of fact about this document (siblings were read for SHAPE, and docs/ plus topics/canonical-encoding.yaml for our own decision vocabulary). EVERY VERBATIM BLOCK AND EVERY QUOTATION WAS CUT FROM THE CACHE BY LINE RANGE BY SCRIPT, never retyped, and verified mechanically: 118 of 118 requirement texts are contiguous substrings of the whitespace-normalised source with zero relaxations; 33 of 33 fenced regions are byte-exact AND digest-exact against their declared line ranges; bin/check-locators reports 118 of 118 contained, 0 misfiled, 0 unresolvable; both YAML readers were compared across 2076 leaf paths - and this claimed 0 real value divergences with only int-versus-str differences, which pass 2 REVERSED: there are 46 int-versus-str plus ONE real divergence, content.local, which _yaml.py returns as the string ''false'' and _record_yaml.py as the boolean False. Not load-bearing, because bin/validate normalises it with str(...).lower() == ''true'' before testing, but it is a bool-versus-str difference and not zero. And "agree on every artifact" overstated the coverage: _record_yaml.py cannot parse distilled/schema/cnf-claim.derived.schema.json at all, failing with ''expected key: {''. Every cited id was emitted FROM THE ID TABLE BY A SELECTOR THAT RAISES on zero or multiple matches, so none was typed. Citation closure over distilled/: 118 distinct requirement ids cited, 0 dangling. THE CENTRAL FINDING IS A DEFINITION BY CONTRAST, not an adoption, and it was re-derived at source rather than inherited from bears_on: section 3.4 says a Key ID `may be different on both sides of the conversation, with the appropriate one being included in the message based on the recipient of the message.` - resolved EXACT as a contiguous substring, no relaxation - so a kid is a (party, local label) pair resolved by table lookup against ARCH-0002 P1''s (defining key, local label) resolved by derivation. All four limbs of what a Key ID is NOT are the document''s own words, and section 3.4 carries ZERO BCP 14 keywords, so a reader who takes it for a prohibition has misread it. A SECOND, INDEPENDENT ROOTLESSNESS was found that bears_on did not name: section 3.2''s MAY permits a kid INSIDE the COSE_Key while Confirmation Key 3 sits beside it in the same cnf map, with no stated precedence and no requirement that the two agree - two places for one identifier, which is P1''s failure mode twice over. SIX SOURCE DEFECTS, and D-0001 bears directly on canonical encoding: section 3.3 states that the COSE_Key representation is used as the plaintext when encrypting the key, and the COSE_Key it PRINTS is not, byte for byte, the plaintext of the ciphertext it prints. The ciphertext DECRYPTS AND AUTHENTICATES under the stated key and IV and re-encrypts to all 48 printed octets, so the cryptography is sound; but the recovered plaintext is ordered 3, 1, -1 (alg, kty, k) where the document prints 1, 3, -1 (kty, alg, k). Same three pairs, same values, 40 octets either way, first differing octet at index 1. The printed order IS RFC 8949 section 4.2.1 deterministic; the encrypted order is NOT. So a reproduction check against the document''s own worked example fails on MAP ORDER ALONE - and RFC 8747 never uses the word canonical or the word deterministic. Recorded, not repaired: V-0004 carries the bytes that reproduce and V-0005 the control that does not. The AES and CCM were written for this pass from FIPS 197 and the CCM construction and GATED ON PUBLISHED VECTORS BEFORE USE (FIPS 197 C.1 and RFC 3610 vector 1, both pass), with no cbor, cose or cryptography library anywhere, so a shared library bug cannot hide behind the result; pass 2 should still re-derive it independently. DEFECTS IN THIS PASS''S OWN PROSE, found by the pass and corrected rather than quietly left: a protocol word sweep that stated LINE counts as OCCURRENCE counts for `message` (6 for 7) and `nonce` (3 for 4), caught by a self-check that re-measured every number the prose asserts; a requirements.yaml testability line that said 46/12/60 where the file holds 35/12/71, fixed by computing it in the generator instead of writing it by hand; a protocol.yaml coverage figure of 24 cited ids where the file cites 27, fixed the same way; duplicate `quoted_evidence` keys in one mapping in messages.yaml, which is YAML data loss, converted to a block sequence; and a stray distilled/vectors.yaml written to the wrong directory by a generator whose output path had been overwritten, removed. AN EARLIER STRETCH OF THIS PASS LEFT A distillation BLOCK DESCRIBING A DIFFERENT ARTIFACT SET, and this block replaces it: the previous one cited messages.yaml as 17 ids and 8 fields where this file holds 38 and 20, referred to a healed hyphenation in design-notes section 2 that the current design-notes.md does not contain, and pointed at a distilled/state-machine.yaml that is deliberately not kept. Those figures were true of files that are no longer on disk and are fossils relative to these, which is hazards.md section 6 exactly; the state-machine N/A verdict and its word sweep were independently re-verified at source before being carried forward, and the one number in it that was wrong - `registration` 12 - is corrected to 13 occurrences on 12 lines in the reason above. ONE DEFECT IN THIS REPOSITORY LEFT UNTOUCHED, deliberately: summary.md quotes section 3.1''s single-key MUST as `proof-of-possession` where source lines 180-181 cut it AT THE HYPHEN. The whole-span quote audit resolved it only under a source-side hyphen heal. The claim that all SEVEN bears_on quotations in record.yaml resolved EXACT is WITHDRAWN, as not reproducible: the comment block holds NINE quotations of 25 characters or more, four of them m-of-n and unverifiable from this repository, and of the five bearing on RFC 8747 three are exact and two resolve only as declared ellipses - one of them the section 6 elision distilled/README.md documents in its own known gap 4, so the blanket claim contradicted a gap stated on the same page. All eight load-bearing section 3.4, 5 and 6 quotations spot-checked are exact, so the findings stand; only the wording was wrong. AND PASS 2 FOUND A SECOND SUMMARY.MD DEFECT of the same family: it writes that collisions are to be "expected" where section 3.4 reads "implementers should expect collisions", an inflection placed inside quote marks, and "expected" occurs ZERO times in the document. Found by a 6-to-24-character span pass that the 25-and-over whole-span audit cannot see. Both left for one decision together; requirements.yaml R-0028 and R-0056 carry both sentences unaltered. LEFT FOR PASS 2, AND EVERY ITEM NOW ADJUDICATED: the 111 stated / 7 inferred split, since `contiguous` and `literally stated` are different claims and this pass leaned toward stated - pass 2 found the criterion undeclared AND applied two ways, requirements.yaml now declares it, and the split is 110 / 8; the inference behind producing protocol.yaml rather than declaring it N/A, which is the one artifact-level judgement here that a reasonable verifier could reverse - SUSTAINED, with every word count independently re-derived and all nine zero-counts reproducing, though the stated METHOD was wrong (see the protocol coverage note); R-0038 and R-0052, the record''s only duplicate-text group and therefore the whole attack surface for an id that resolves to a real but wrong statement - SUSTAINED and the surface is EMPTY, since neither is cited as a constraint anywhere and all three mentions name both ids as the pair; R-0040, which begins with a conjunction because it is the second half of a mid-sentence split off R-0039 - DEFENSIBLE, it is the only way to give the MUST and the MAY separate entries, and the verb-to-keyword bijection holds 0 mismatches across all 118; and bin/check-id-joins --quote-join''s coverage, which examined 25 pairs where this pass''s own exhaustive audit finds and carries 38 - its window pairs quote marks from an arbitrary byte offset, so a zero finding there is not coverage. THAT GAP IS NOW CLOSED AND THIS FIGURE IS A FOSSIL: the check was fixed and the record re-measured at 31 examined, 31 carried, 0 to read. The window was real but not the binding constraint here - the dominant cause was that the single quote was missing from the opener set, which made THIS RECORD''S COMMONEST ATTRIBUTED SHAPE unreadable, a quoted_evidence entry being a YAML single-quoted scalar that opens on the quotation itself; the second was a quotation carrying more than one interior mark pair, which section 7.2 does twice in one sentence. The seven pairs still outside the 38 are excluded by design and each class is named in distilled/README.md known gap 1 - an id: line defines an entry rather than citing one, a backticked span is code rather than a quotation, and the section 7.2.2 registration block is a template rather than prose.'
    - pass: verify
      by: 'claude-opus-5 (pass 2 of 3; single adversarial agent, extracted nothing)'
