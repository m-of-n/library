    - kind: requirements
      path: distilled/requirements.yaml
      coverage: '118 entries R-0001 to R-0118 in source order with no gaps: 110 stated, 8 inferred under the criterion requirements.yaml now DECLARES - an asserted obligation or a binding definition against description, analogy, equivalence or framing - which pass 2 found had been applied two ways and left undeclared, and which moved R-0009 to inferred; 35 testable: yes, 12 partial, 71 no. NO ENTRY TEXT RUNS INTO THE NEXT ENTRY''S OPENING: pass 2 found FIVE that did - R-0016, R-0018, R-0031, R-0062 and R-0070 each ended with the first words of its successor, a line-range slicing artifact that every verbatim, locator and citation check passes because the text IS contiguous and correctly filed. All five trimmed to their own sentence boundary, 0 of 118 remaining, and each still verbatim and inside its declared line range. KEYWORD COUNTS RECONCILE AT 8 = 8 as a bijection by source line - L172 and L180 (MUST, section 3.1), L227 (MUST) and L228 (MAY) split from one sentence at a contiguous character boundary, L231 (MAY) and L235 (MUST) in section 3.2, L357 (SHOULD) and L391 (MUST NOT) in section 4 - matching bin/bcp14-count --by-keyword exactly, and NO text smuggles a keyword in from a quoted reference or a registry template. Not one of the eight is in section 3.4 or section 6, which is the whole of what this record is held for. Every text was cut from the cache by line range by script and verified as a contiguous substring of the whitespace-normalised source: 118 of 118, zero relaxations. Three texts cross a line-end hyphen (R-0001, R-0027, R-0028) and NONE IS HEALED - they read ''proof- of-possession'' and ''proof-of- possession'' with the space the break leaves. The section 2 BCP 14 recital is deliberately not an entry: quoting it would add 11 phantom keywords and make the extraction read 19 against a source of 8.'
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: '1 verbatim and 3 derived. RFC 8747 SHIPS NO FORMAL GRAMMAR - measured, the strings schema, grammar, ABNF and ASN.1 occur zero times, JSON Schema zero, and CDDL exactly once, at line 630 inside the RFC 8610 reference entry, which this document cites for Appendix G alone. So every formal artifact here except source-renderings.txt is ours and carries .derived. in its name. AND THE CDDL IS SHOWN TO BIND, NOT MERELY TO PARSE: no cddl tool is installed, so a checker was transcribed from the grammar rule by rule - independently by each of the three passes - and run over the instance table in schema/README.md. CURRENT FIGURE, measured by pass 3 by expanding every table row into its individual instances: 36 of 36 behave as the grammar claims, 26 accept-expected and 10 reject-expected, 0 mismatches. THIS FIELD SAID "10 instances ... 10 of 10" and "ACCEPTS ALL FOUR rejected instances", which were pass 1''s figures: pass 2 re-ran at 30 and pass 3 at 36, and neither re-run reached this field or distilled/README.md, which is the propagation failure hazards.md opens with. The 30 was itself wrong against its own table, which already enumerated 31 instances and 9 rejects where the prose said 30 and 8. The vacuity probe is recorded beside the table: a naive rendering with an unrestricted wildcard in the same map wrongly accepts 10 of the 10 rejects - all of them - where this field said four and schema/README.md said 7 of 8. PASS 3 ALSO FOUND THE MIRROR-IMAGE OVER-BINDING ONE RULE PAST WHERE PASS 2 STOPPED: cwt-claims-set-fragment wrote claim key 8 with no ?, so it REJECTED a CWT Claims Set carrying no cnf at all - {1: ''iss''} and {} - which nothing in RFC 8747 licenses, since section 3 is conditional and section 7.1.1 merely registers the claim. messages.yaml had claim key 8 required: false all along, so the grammar and the message model disagreed and the grammar was wrong; key 8 is now optional and the cut still binds the TYPE of its value, so {8: 5} and {8: {1: ..., 2: ...}} are still rejected. Stated plainly in schema/README.md: the cut is INERT on Confirmation Keys 1 and 2, because this document defines no COSE_Key or COSE_Encrypt0 grammar and those rules are sockets typed any - the whole constraint on those two labels is carried by other-label''s exclusion, and the cut does real work on Confirmation Key 3 alone. Pass 3 added the instances that prove the inertness, {1: 42} and {2: ''nonsense''}, both accepted, because a concession with no instance behind it is not testable. The derived JSON Schema takes $id urn:library:rfc-8747:cnf-claim.derived and declares its own JSON projection lossy, since CBOR distinguishes integer key 1 from text key ''1'' and JSON cannot.'
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: '5 structures and 20 fields: the cnf claim with all four of its member classes, COSE_Key, Encrypted_COSE_Key, kid, and the CWT Claims Set fragment this document registers claim key 8 into. This said 22 fields, as did README.md and messages.yaml''s own coverage block - the file holds 20, counted from the parsed file as 4 + 3 + 4 + 3 + 6. It is the same field that pass 1 had already corrected once, from 21 to 17, so it has now been wrong in three different ways and is the first number a later pass should recount. 38 of the 118 requirements are wired by constrained_by; THREE of the five RFC 8392 claims in the fragment - aud, exp and iat - carry constrained_by: [] with an unwired_reason each, so an adversarial reader can falsify the claim cheaply. The other two, iss and sub, ARE wired, to R-0016 and R-0015, which is why this no longer says all five are unwired. EVERY OCTET COUNT WAS RE-DERIVED AT WRITE TIME with a CBOR codec, AES-128 and CCM written for this pass and gated on FIPS 197 C.1 and RFC 3610 vector 1 BEFORE use - no cbor, cose or cryptography library was used, so a shared library bug cannot hide behind the numbers. 13 quoted_evidence pairs carry the cited requirement''s OWN text in double quotes with the id immediately after the closing quote, so bin/check-id-joins --quote-join can examine the pair instead of collecting nothing.'
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml + distilled/protocol.md
      coverage: '3 roles, 6 steps, 0 error paths, 27 requirement ids cited, and a Mermaid sequence diagram with EVERY ARROW DASHED. PRODUCED RATHER THAN DECLARED N/A, and the reason is the opposite of a shortcut: rfc-9679''s extraction declared ITS protocol not_applicable on the ground that the flow belongs to RFC 8747. This is RFC 8747. Section 2 defines Issuer, Presenter and Recipient outright - they are named 8, 18 and 14 times - and section 3 states their relation, but of the six steps exactly ONE is even partly specified here, and only as to the structure the issuer builds. Two of the five unspecified legs are withheld by explicit refusal in section 3.5 and a third by section 4''s scope exclusion; all three refusals are quoted in place. THE WORD SWEEP: error 0, step 0, response 0, flow 0, handshake 0, negotiate 0, sender 0, verifier 0, round-trip 0. Counts stated as OCCURRENCES, not lines, which matters for message - 7 occurrences on 6 lines, because line 325 carries it twice. Three of the four nonce occurrences and the single challenge sit inside section 3.5, the section titled Specifics Intentionally Not Specified; the fourth nonce is section 4''s ''nonces and timestamps''. Recording three roles and three declared absences says more than an N/A verdict would.'
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: '6 vectors V-0001 to V-0006 over the source''s 4 printed examples and 1 printed scalar value, plus 5 byte-exact fenced regions in examples/README.md. THE ONE CRYPTOGRAPHIC COMPUTATION THE DOCUMENT CONTAINS REPRODUCES: the section 3.3 COSE_Encrypt0 decrypts under the key printed at line 279 with the section 3.3 IV and AAD 8368456e63727970743043a1010a40, the 8-octet CCM tag VERIFIES, and re-encrypting the recovered plaintext reproduces all 48 printed octets. V-0005 is the control that does not reproduce. Also measured: the section 3.2 point IS on P-256; all five printed maps are in RFC 8949 section 4.2.1 deterministic order while the map actually ENCRYPTED is not; the cnf value is 77 octets with a COSE_Key, 73 with an untagged Encrypted_COSE_Key and 19 with a kid, a ratio of 4.05; the tag costs exactly 1 octet; and the section 3.4 kid is NOT the SHA-256 of the section 3.2 COSE_Key encoding, truncated or whole, so the document does not follow its own suggestion.'
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: 'all four bears_on identifiers against the source rather than inherited, the MD-3 structure-by-structure mapping and the export mapping, 6 NAMED CUTS A-F against MD-3 each naming the DEC-002 option it affects, 6 source defects and 6 open questions, the six canonical-encoding conditions recorded as a measured negative, and a pass-2/3 attention map. THE CUTS DO NOT ALL RUN ONE WAY, which is what docs/extraction.md asks for - six cuts A-F plus an explicit convergence note. Cut A corroborates rfc-8392''s cut 3 from a second mechanism (the tag is optional, so no-tags is OUR decoder rule, not the format''s); cut B is the extraction''s strongest finding and ranks option 1 ahead of option 3 ahead of option 5 on detectability of an order-only divergence, the REVERSE of MD-3''s narrowing and on a ground DEC-002 does not list; cut C is that this document contributes nothing to determinism (canonical 0, deterministic 0); cut D is that carrying cnf would import a second IANA registry with NO allocation tiers, where RFC 8392 section 9.1.1 tiers its Claim Key space - and its actionable conclusion is not about DEC-002 at all, it is ''do not carry cnf''; and cut E is a point FOR option 5, recorded because four cuts against and none for would misrepresent the document; and cut F records that the party-relative kid costs EVERY option equally, so the list is not read as a ranking on every ground. Quotations of m-of-n documents are flagged as unverifiable from this repository, per rfc-9741''s convention.'
      reviewed_by: ""
  not_applicable:
    - kind: state-machine
      reason: 'THE STRONGEST CASE AGAINST THIS VERDICT, raised and answered by pass 3: docs/extraction.md names REGISTRATION first among the lifecycles this artifact is for, and section 7 is 30 source lines and nine requirements (R-0096 to R-0104) describing four outcomes and two clocks - submit, three-week review, register; undetermined beyond 21 days, escalate to IANA; incomplete or duplicate, corrections or rejection; and pre-publication allocation. The wording below answered that only with "a process for the registry rather than for a CWT", which silently narrows the artifact to the document''s primary data object, and FX-1 does not narrow it that way. STILL N/A, for four reasons now on the record so a later pass attacks these rather than the word counts: the document names no state, so every state would be this library''s invention; every verb is lower case (should determine, should ask, may approve, can be brought, It is suggested) and section 7 carries ZERO of the document''s 8 BCP 14 keywords, so the machine would have no normative edge in it; the procedure is RFC 8126''s Specification Required policy, which this document parameterises with one mailing-list address and a 21-day escalation and nothing else, so modelling it would model RFC 8126 and would recur in every record that registers anything; and it sequences nothing this document defines, the three confirmation methods being fixed at publication by section 7.2.2. All nine requirements are in requirements.yaml with their locators and the registry is modelled as fields, with its registration_policy, in schema/confirmation-methods.derived.yaml. AND THE REST OF THE VERDICT: RFC 8747 defines no lifecycle, DERIVED rather than asserted. Measured whole-word and case-insensitively over all 683 lines: `state` 0, `states` 0, `lifecycle` 0, `transition` 0, `revoke` 0, `revocation` 0, `rotate` 0, `expire` 0, `expiry` 0, `expiration` 0, `issuance` 0, `step` 0, `steps` 0 - thirteen words at zero, each re-verified by this pass. The near misses were checked rather than counted: `issue` once at line 415, inside section 6''s advice that an issuer not issue another CWT with the same Key ID, which constrains the issuer''s behaviour ACROSS CWTs and is not a transition of any object; `register` 4 (L176, L346, L444, L452) and `registration` 13 OCCURRENCES ON 12 LINES (L459 carries it twice), all of them section 7''s IANA procedure, the ToC or the reference list, which is a process for the registry rather than for a CWT; `order` twice (L404, L458), both `in order to`; and `freshness` once at L333, inside section 3.5''s declaration that the means of demonstrating it are NOT specified. [The `registration` figure is corrected here from 12: 12 is the LINE count and 13 the occurrence count, the same lines-versus-occurrences slip this pass also found and fixed in its own protocol word sweep.] AND THERE IS A SHARPER REASON THAN THE COUNTS: a confirmation key is fixed when the CWT is issued and nothing in these 683 lines changes it afterwards. The `exp` claim that would give a CWT a lifetime is RFC 8392''s and is never constrained here; section 6 does reason about the lifetime of the CWTs, but only as the WINDOW within which an issuer must not reuse a Key ID - a constraint relating two CWTs to each other rather than sequencing one. The one place a reader might expect a machine is Key ID collision handling, and section 3.4''s `Recipients of a CWT with a PoP key linked through only a Key ID should be prepared to handle such situations.` names no state, no trigger, no guard and no recovery, in lower case. The nearest thing to a transition is section 3.3''s `could subsequently be encrypted`, which is a derivation of one representation from another, not a state change. SIXTEEN OF THE LANE''S 25 FX-1 RECORDS DECLARE THIS ARTIFACT N/A, counted from distillation.not_applicable across records/*/*/record.yaml for topics cbor-implementation and canonical-encoding. FIVE of those sixteen were read for their grounds, and those five fall into FOUR distinct kinds - rfc-9804 names parsing, rfc-8949 the decode of a single data item, rfc-8610 and rfc-9741 that matching is a predicate and not a lifecycle, and rfc-9682 a transition period in the installed-tool population. The four kinds are a property of the five that were READ, not of the other fifteen. [Corrected by pass 3 from "FIVE SIBLING ... RECORDS ... ON THREE DIFFERENT GROUNDS ... A FOURTH", which named four grounds while saying three and read as though five were the whole set when they are under a third of it. state-machine.yaml''s own sibling_precedent field was corrected by pass 2 and the correction never reached this field - one record, one claim, two sets of numbers, which is hazards.md section 6.] THIS RECORD''S GROUND IS A FIFTH and is none of those four: it has a lifecycle-shaped SUBJECT - a key bound to a token and held by parties over time - and the document declines to give it states. Kept distinct rather than folded into the others, because a reader looking for prior art on key rotation will come here and should find the absence rather than an oversight. No distilled/state-machine.yaml is kept: the sibling records at profile: full that declare this artifact N/A keep no file, but this record keeps distilled/state-machine.yaml anyway: it writes the sweep and the four checked near misses out in full, which is what a reader looking for prior art on key rotation will open. Two of that file''s own measurements were corrected by this stretch - `registration` from 12 to 13 occurrences on 12 lines, and `order` from ''in order to and in order that'' to both being ''in order to''.'
  passes:
    - pass: extract
      by: 'claude-opus-5 (pass 1 of 3; single agent, whole artifact set; resumed three times after interruption)'
      effort: max
      date: '2026-10-21'
