bears_on:
  # Resolved 2026-10-20 (library#39 Tier 2), from `bears_on: []` + verdict
  # `marginal`. The old reason — "prior art for binding a token to a key; not
  # required by the current envelope options" — judged the `cnf` claim, which
  # is right and is not what this document is worth to us. §3.4 and §6 are
  # about what a Key ID IS, which is DEC-003's subject and R-O-01's literal
  # one. Each identifier below is evidenced by locator, not assumed:
  #   DEC-003 — §3.1's Table 1 enumerates the only three ways a CWT may
  #     identify a proof-of-possession key: a `COSE_Key` (1), an
  #     `Encrypted_COSE_Key` (2), or a `kid` (3). That is DEC-003's own option
  #     list — "raw COSE key" against "text KeyId" — already drawn on the
  #     standards track. And §3.4 is the precedent for declining DEC-003's
  #     mandatory clause: "The content of the "kid" value is application
  #     specific. For instance, some applications may choose to use a
  #     cryptographic hash of the public key value as the "kid" value." It
  #     names the construction and specifies no key encoding, no parameter
  #     subset and no digest algorithm. DEC-003 must "specify: canonical key
  #     bytes before hashing"; this is the document that shows what is left
  #     when you do not.
  #   R-O-01 — "Every signed object SHALL have an issuer key that can be
  #     specified as KeyId." §3.4 prices the underived alternative: "In cases
  #     where the Key ID is not a cryptographic value derived from the key or
  #     where not all of the parties involved are validating the cryptographic
  #     derivation, implementers should expect collisions where different keys
  #     are assigned the same Key ID." Lowercase "should expect" — advice, and
  #     that is itself the finding: the collision is foreseen and nothing is
  #     mandated against it. §6 then makes uniqueness the issuer's operational
  #     discipline rather than a property of the identifier, with impersonation
  #     as the failure: an issuer "needs to make sure that it does not issue
  #     another CWT with different claims containing the same Key ID within
  #     the lifetime of the CWTs... Failure to do so may allow one party to
  #     impersonate another party, with the potential to gain additional
  #     privileges." Prior art we do not follow, with the reason in the text.
  #   ARCH-0002 P1 — the sharpest thing in this lane, and it is a definition
  #     by contrast. §3.4: "Note that the value of a Key ID for a specific key
  #     is not necessarily the same for different parties... the Key ID may be
  #     different on both sides of the conversation, with the appropriate one
  #     being included in the message based on the recipient of the message."
  #     A `kid` is therefore a (party, local label) pair resolved by table
  #     lookup. P1 makes an extension point a (defining key, local label) pair
  #     resolved by derivation. Same shape, different first element, and the
  #     difference is the whole of P1: a party-relative alias has an owner but
  #     no cryptographic root, which is "escape from a registry, not a
  #     namespace" reached from the other side. ADR-0001 rejected private-use
  #     ranges because no principal is attached; here a principal of sorts IS
  #     attached and still nothing in the bytes disambiguates, because the
  #     principal is a lookup table rather than a key.
  #   DEC-002 — narrow, and it BOUNDS a live finding rather than adding one.
  #     §7.2.2 registers `Encrypted_COSE_Key` as "COSE_Encrypt or COSE_Encrypt0
  #     structure (with an optional corresponding COSE_Encrypt or COSE_Encrypt0
  #     tag)" and §3.3's worked example carries the COSE_Encrypt0 UNTAGGED, as
  #     a bare three-element array. rfc-9964's Cut A found every COSE example
  #     in RFC 9964 tagged 18 with the untagged form never printed. Both hold:
  #     the tag is customary at top level and explicitly optional when nested,
  #     which is where an export mapping would put one. Second-order but real:
  #     an OPTIONAL tag means two encodings of one `cnf`, so a deterministic
  #     profile has to pick, and this registry entry does not pick for it.
  - DEC-002
  - DEC-003
  - R-O-01
  - ARCH-0002 P1
topic: cbor-implementation
