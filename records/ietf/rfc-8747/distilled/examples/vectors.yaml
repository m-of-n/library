record: rfc-8747
reviewed_by: ""
# Every example and every printed value in RFC 8747, as a fixture with its
# expected result. Source lines are lifted from .cache/rfc-8747.txt by line
# range by script and carry a per-region sha256 (the region's lines joined by
# a newline, with no trailing newline).
#
# PROVENANCE OF EVERY OCTET COUNT AND EVERY CIPHERTEXT BELOW. Decoded and
# re-encoded with a CBOR codec written for this pass from RFC 8949 section 3,
# and with AES-128 and CCM written from FIPS 197 and the CCM construction.
# NO cbor, cose, cryptography or pycryptodome library was used, so a shared
# library bug cannot hide behind these numbers. Both primitives were gated on
# a published vector BEFORE use, and every number in this file is asserted
# against its re-derivation at write time, so a stale count cannot survive.
gates:
  - name: 'FIPS 197 C.1 AES-128 single block'
    input_key: '000102030405060708090a0b0c0d0e0f'
    input_block: '00112233445566778899aabbccddeeff'
    expected: '69c4e0d86a7b0430d8cdb78070b4c55a'
    got: '69c4e0d86a7b0430d8cdb78070b4c55a'
    result: pass
  - name: 'RFC 3610 test vector 1, AES-CCM with an 8-octet tag and a 13-octet nonce'
    expected: '588c979a61c663d2f066d0c2c0f989806d5f6b61dac38417e8d12cfdf926e0'
    got: '588c979a61c663d2f066d0c2c0f989806d5f6b61dac38417e8d12cfdf926e0'
    result: pass
    note: 'gates the exact CCM parameterisation COSE names AES-CCM-16-64-128: 128-bit key, 64-bit tag, 13-octet nonce, 2-octet length field. RFC 8747 never names the algorithm in prose; it is read off the section 3.3 protected header, which decodes to a one-entry map, 1 => 10.'

vectors:

  - id: 'rfc-8747#V-0001'
    name: 'section 3.2 CWT Claims Set carrying an asymmetric COSE_Key'
    locator: 'section 3.2'
    source: 'printed'
    printed_source: '.cache/rfc-8747.txt lines 211-225'
    printed_sha256: '1bfad338032427de80a8441ed86481c76d0d8b440e2e03b9239ff9d7d7932c5f'
    printed_octets_of_source_text: 445
    printed_verbatim_at: 'examples/README.md, fenced, byte-exact. NOT reproduced here: a YAML block scalar is read with and without its trailing newline by the library''s two readers, so the byte-exact copy lives where a fence preserves it.'
    notation: 'CBOR extended diagnostic notation, as section 2 declares. The two hex literals are printed across two lines each, with the break INSIDE the hex string (lines 219-220 and 221-222). A fixture builder must remove those breaks: section 2 says the examples include line breaks for readability.'
    cose_key_hex: 'a401022001215820d7cc072de2205bdc1537a543d53c60a6acb62eccd890c7fa27c9e354089bbe13225820f95e1d4b851a2cc80fff87d8e23f22afb725d535e515d020731e79a3b4e47120'
    cose_key_octets: '75'
    cose_key_entry_order: '1, -1, -2, -3 (kty, crv, x, y)'
    cose_key_deterministic: 'yes - RFC 8949 section 4.2.1 sorts the four encoded keys 01, 20, 21, 22 into exactly the printed order'
    cnf_octets: '77'
    claims_set_octets: '143'
    claims_set_deterministic: 'yes - claim keys 1, 3, 4, 8 ascending'
    expected_result: 'x and y are 32 octets each and the point (x, y) SATISFIES the P-256 curve equation. Checked, not assumed: this is a real public key, not filler.'
    expected_x: 'd7cc072de2205bdc1537a543d53c60a6acb62eccd890c7fa27c9e354089bbe13'
    expected_y: 'f95e1d4b851a2cc80fff87d8e23f22afb725d535e515d020731e79a3b4e47120'
    constrains:
      - 'rfc-8747#R-0037'
      - 'rfc-8747#R-0039'
      - 'rfc-8747#R-0010'

  - id: 'rfc-8747#V-0002'
    name: 'section 3.3 symmetric COSE_Key, as printed'
    locator: 'section 3.3'
    source: 'printed'
    printed_source: '.cache/rfc-8747.txt lines 248-253'
    printed_sha256: '29dae4b7e8e0360e534fd2ce8b6d6f5bd43c26ce93372661688609f958fc4408'
    printed_octets_of_source_text: 167
    printed_verbatim_at: 'examples/README.md, fenced, byte-exact. NOT reproduced here: a YAML block scalar is read with and without its trailing newline by the library''s two readers, so the byte-exact copy lives where a fence preserves it.'
    cose_key_hex: 'a3010403052058206684523ab17337f173500e5728c628547cb37dfe68449c65f885d1b73b49eae1'
    cose_key_octets: '40'
    cose_key_entry_order: '1, 3, -1 (kty, alg, k)'
    cose_key_deterministic: 'yes - RFC 8949 section 4.2.1 sorts 01, 03, 20 into exactly the printed order'
    k_octets: '32'
    expected_result: 'encodes to the 40 octets above. This is the structure the document calls the plaintext; V-0004 and V-0005 record that it is not the plaintext of the printed ciphertext.'
    constrains:
      - 'rfc-8747#R-0047'
      - 'rfc-8747#R-0046'

  - id: 'rfc-8747#V-0003'
    name: 'section 3.3 CWT Claims Set carrying an Encrypted_COSE_Key'
    locator: 'section 3.3'
    source: 'printed'
    printed_source: '.cache/rfc-8747.txt lines 261-275'
    printed_sha256: '3f71d9d396475c26b4da7d11193a44e35002f525a15c2d0cecae134f25552bc1'
    printed_octets_of_source_text: 510
    printed_verbatim_at: 'examples/README.md, fenced, byte-exact. NOT reproduced here: a YAML block scalar is read with and without its trailing newline by the library''s two readers, so the byte-exact copy lives where a fence preserves it.'
    encrypt0_shape: 'a bare three-element CBOR array - protected, unprotected, ciphertext. UNTAGGED: no tag precedes it, in a document whose own registry entry at section 7.2.2 allows one.'
    encrypt0_octets: '71'
    encrypt0_octets_if_tagged: '72'
    tag_cost_octets: '1'
    protected_header_hex: 'a1010a'
    protected_header_decodes: 'a one-entry map, 1 => 10'
    unprotected_header: 'a one-entry map, 5 => a 13-octet byte string, the IV'
    iv_hex: '636898994ff0ec7bfcf6d3f95b'
    iv_octets: '13'
    ciphertext_octets: '48'
    cnf_octets: '73'
    claims_set_octets: '138'
    claims_set_deterministic: 'yes - claim keys 1, 2, 3, 4, 5, 8 ascending'
    expected_result: 'decodes as a 6-entry CWT Claims Set whose cnf member holds a single entry, 2 => a three-element array. The array is not tagged, so an implementation that requires the tag rejects this example and an implementation that forbids it rejects a tagged peer. See design-notes.md on DEC-002.'
    constrains:
      - 'rfc-8747#R-0045'
      - 'rfc-8747#R-0034'
      - 'rfc-8747#R-0117'

  - id: 'rfc-8747#V-0004'
    name: 'section 3.3 COSE_Encrypt0 decryption - REPRODUCES, and exposes a source defect'
    locator: 'section 3.3'
    source: 'printed'
    generating_key_source: '.cache/rfc-8747.txt lines 277-279'
    generating_key_sha256: 'e013429ac4a68103f8bcb33a2ab1560165471ac773b54b9c3c4470ee73fd5ac1'
    generating_key_octets_of_source_text: 88
    generating_key_verbatim_at: 'examples/README.md, fenced, byte-exact. NOT reproduced here: a YAML block scalar is read with and without its trailing newline by the library''s two readers, so the byte-exact copy lives where a fence preserves it.'
    key_hex: '6162630405060708090a0b0c0d0e0f10'
    key_octets: '16'
    algorithm: 'AES-CCM-16-64-128, read off the protected header (1 => 10), not from prose: the document names no algorithm anywhere in its text.'
    aad_construction: 'Enc_structure = [ "Encrypt0", protected, external_aad ], with external_aad the empty byte string'
    aad_hex: '8368456e63727970743043a1010a40'
    aad_octets: '15'
    authentication: 'PASS - the 8-octet CCM tag verifies under the stated key and IV. The key, the IV, the protected header and the ciphertext printed in the document are mutually consistent and correct.'
    recovered_plaintext_hex: 'a3030501042058206684523ab17337f173500e5728c628547cb37dfe68449c65f885d1b73b49eae1'
    recovered_plaintext_octets: '40'
    recovered_decodes_cleanly: 'yes - a 3-entry CBOR map consuming all 40 octets, 0 trailing'
    recovered_entry_order: '3, 1, -1 (alg, kty, k)'
    recovered_deterministic: 'NO - RFC 8949 section 4.2.1 would order these 1, 3, -1'
    round_trip: 're-encrypting the recovered plaintext under the same key, IV and AAD reproduces the printed ciphertext EXACTLY, all 48 octets.'
    expected_result: 'the ciphertext decrypts and authenticates, and the recovered plaintext carries exactly the three key-value pairs the section 3.3 COSE_Key prints, with identical values - in a different entry order.'
    constrains:
      - 'rfc-8747#R-0049'
    violates:
      - 'rfc-8747#R-0047'
    link_rationale: 'R-0047 is the sentence that says the COSE_Key representation is used as the plaintext when encrypting the key. The printed COSE_Key is not, byte for byte, the plaintext of the printed ciphertext. See source_defects rfc-8747#D-0001.'

  - id: 'rfc-8747#V-0005'
    name: 'section 3.3 printed COSE_Key encrypted in PRINTED order - does NOT reproduce'
    locator: 'section 3.3'
    source: 'constructed'
    constructed_why: 'the counterfactual that pins V-0004''s defect down. Encrypt the section 3.3 COSE_Key as printed, under the document''s own key, IV and AAD, and compare with the printed ciphertext.'
    plaintext_hex: 'a3010403052058206684523ab17337f173500e5728c628547cb37dfe68449c65f885d1b73b49eae1'
    plaintext_entry_order: '1, 3, -1, as printed at lines 248-253'
    resulting_ciphertext_hex: '057130883473eb983e55a7c2f06cadd0796c9e584f1d0e3ea8c5b052592a8b2694be9654f0431f3826e7ab1a5c9e5e27'
    printed_ciphertext_hex: '0573318a3573eb983e55a7c2f06cadd0796c9e584f1d0e3ea8c5b052592a8b2694be9654f0431f38d5bbc8049fa7f13f'
    first_differing_plaintext_octet_index: '1'
    expected_result: 'DOES NOT MATCH. The two ciphertexts differ from octet 1 onward and the CCM tag differs, because the plaintexts differ from octet 1 onward: 0305010420 against 0104030520.'
    note: 'the control, so a reader can check that V-0004''s finding is about entry order and nothing else. Both plaintexts are 40 octets and carry the same three pairs.'

  - id: 'rfc-8747#V-0006'
    name: 'section 3.4 CWT Claims Set carrying a bare kid'
    locator: 'section 3.4'
    source: 'printed'
    printed_source: '.cache/rfc-8747.txt lines 295-302'
    printed_sha256: 'a21740431a81b2ba13e6af47bcd876185cf1f364f78148f115174e3fea6b5785'
    printed_octets_of_source_text: 196
    printed_verbatim_at: 'examples/README.md, fenced, byte-exact. NOT reproduced here: a YAML block scalar is read with and without its trailing newline by the library''s two readers, so the byte-exact copy lives where a fence preserves it.'
    kid_hex: 'dfd1aa976d8d4575a0fe34b96de2bfad'
    kid_octets: '16'
    cnf_octets: '19'
    claims_set_octets: '82'
    claims_set_deterministic: 'yes - claim keys 1, 3, 4, 8 ascending'
    expected_result: 'a 19-octet cnf against V-0001''s 77 for the same job. The document offers no way to check this kid against any key: section 3.4 says the content is application specific and states no derivation, so the value is unfalsifiable from the token alone. That is what this record is held for - see design-notes.md on DEC-003 and ARCH-0002 P1.'
    derivation_checked: 'the kid is NOT the SHA-256 of V-0001''s COSE_Key encoding truncated to 16 octets, and no derivation is claimed by the document. Tested because section 3.4 offers a hash of the public key as one thing an application MAY do; the document''s own example does not do it.'
    constrains:
      - 'rfc-8747#R-0053'
      - 'rfc-8747#R-0054'
      - 'rfc-8747#R-0035'
      - 'rfc-8747#R-0058'

size_comparison:
  note: 'the three confirmation methods carrying one key each, measured as the encoded cnf claim VALUE (the inner map), from the document''s own examples'
  cose_key_cnf_octets: 77
  encrypted_cose_key_cnf_octets: 73
  kid_cnf_octets: 19
  ratio_cose_key_to_kid: '4.05'
  bearing: 'section 3.4 says there is frequently a restriction on the size of Key IDs in constrained IoT devices; these are the numbers behind that sentence, measured rather than asserted.'

source_defects:
  - id: 'rfc-8747#D-0001'
    locator: 'section 3.3 - source lines 248-253 and 255-256 against lines 261-275 and 277-279'
    claim: 'The COSE_Key representation is used as the plaintext when encrypting the key.'
    claim_locator: 'section 3.3, source lines 255-256; rfc-8747#R-0047'
    what_it_prints: 'a symmetric COSE_Key with entries in the order 1, 3, -1 (kty, alg, k), encoding to 40 octets: a3010403052058206684523ab17337f173500e5728c628547cb37dfe68449c65f885d1b73b49eae1'
    what_the_ciphertext_holds: 'the same three pairs with the same values, in the order 3, 1, -1 (alg, kty, k), encoding to 40 octets: a3030501042058206684523ab17337f173500e5728c628547cb37dfe68449c65f885d1b73b49eae1'
    arithmetic: 'the printed ciphertext is 48 octets = 40 plaintext + 8 CCM tag. Decrypting it under the stated generating key 6162630405060708090a0b0c0d0e0f10, the stated IV 636898994ff0ec7bfcf6d3f95b and AAD 8368456e63727970743043a1010a40 AUTHENTICATES, and re-encrypting the recovered plaintext reproduces all 48 printed octets. Encrypting the PRINTED order instead yields 057130883473eb983e55a7c2f06cadd0796c9e584f1d0e3ea8c5b052592a8b2694be9654f0431f3826e7ab1a5c9e5e27, which differs from the printed ciphertext at octet 1 and in the tag.'
    statement: 'the document''s one fully worked encryption is internally consistent as cryptography and inconsistent as presentation: the COSE_Key it prints is not, byte for byte, the plaintext of the ciphertext it prints. They are the same map with its entries in a different order.'
    bearing: 'the printed order IS RFC 8949 section 4.2.1 deterministic; the encrypted order is NOT. A reproduction check on the document''s own example therefore fails on map order alone, which is precisely the cost of leaving order unpinned. RFC 8747 never uses the word canonical or the word deterministic - measured, zero occurrences each.'
    not_repaired: 'recorded, not fixed. V-0004 carries the bytes that reproduce and V-0005 the control that does not.'

coverage:
  printed_examples_in_source: 4
  printed_scalar_values_in_source: 1
  vectors: 6
  reproduced: 'every printed value in the document is accounted for - the section 3.2 claims set and its P-256 point, the section 3.3 symmetric key, the section 3.3 claims set and its ciphertext, the section 3.3 generating key, and the section 3.4 claims set. The one cryptographic computation the document contains REPRODUCES byte for byte, in the entry order the ciphertext actually carries.'
