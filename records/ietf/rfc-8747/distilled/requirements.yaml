    locator: '§4'
    source_lines: '372-375'
    text: 'Note that a discussion of the architecture or specific protocols that CWTs with proof-of-possession keys are used with is beyond the scope of this specification.'
    kind: stated
    testable: 'no'
    status: active
    note: 'the third refusal, and the one that bounds protocol.yaml.'
  - id: 'rfc-8747#R-0078'
    object: 'CWT'
    field: 'data origin authentication and integrity protection'
    verb: 'none'
    actor: 'implementation'
    locator: '§4'
    source_lines: '377-379'
    text: 'As is the case with other information included in a CWT, it is necessary to apply data origin authentication and integrity protection (via a keyed message digest or a digital signature).'
    kind: stated
    testable: 'partial'
    status: active
    note: '''it is necessary to'' - force without a keyword. The mechanism is COSE''s, not this document''s.'
  - id: 'rfc-8747#R-0079'
    object: 'CWT'
    field: 'what origin authentication buys'
    verb: 'none'
    actor: 'reader'
    locator: '§4'
    source_lines: '379-382'
    text: 'Data origin authentication ensures that the recipient of the CWT learns about the entity that created the CWT, since this will be important for any policy decisions.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0080'
    object: 'CWT'
    field: 'what integrity protection buys'
    verb: 'none'
    actor: 'reader'
    locator: '§4'
    source_lines: '382-383'
    text: 'Integrity protection prevents an adversary from changing any elements conveyed within the CWT payload.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0081'
    object: 'symmetric key'
    field: 'symmetric keys need confidentiality as well as integrity'
    verb: 'none'
    actor: 'implementation'
    locator: '§4'
    source_lines: '383-386'
    text: 'Special care has to be applied when carrying symmetric keys inside the CWT since those not only require integrity protection but also confidentiality protection.'
    kind: stated
    testable: 'partial'
    status: active
    note: '''has to be applied'' - force without a keyword. This is the security reasoning behind §3.2''s symmetric-must-be-encrypted MUST.'
  - id: 'rfc-8747#R-0082'
    object: 'key'
    field: 'explicit trust decisions'
    verb: 'none'
    actor: 'implementation'
    locator: '§4'
    source_lines: '388-390'
    text: 'As described in Section 6 (Key Identification) and Appendix D (Notes on Key Selection) of [JWS], it is important to make explicit trust decisions about the keys.'
    kind: stated
    testable: 'no'
    status: active
    note: 'cites [JWS] - RFC 7515 - for key identification and key selection, an INFORMATIVE reference carrying the document''s only guidance on trust.'
  - id: 'rfc-8747#R-0083'
    object: 'proof-of-possession signature'
    field: 'signatures under untrusted keys'
    verb: 'MUST NOT'
    actor: 'implementation'
    locator: '§4'
    source_lines: '390-392'
    text: 'Proof-of-possession signatures made with keys not meeting the application''s trust criteria MUST NOT be relied upon.'
    kind: stated
    testable: 'partial'
    status: active
    note: 'BCP 14 keyword 8 of 8, source line 391. The only prohibition in the document. Testable only once ''the application''s trust criteria'' are defined, which this document does not do.'
  - id: 'rfc-8747#R-0084'
    object: 'proof-of-possession key'
    field: 'privacy: linkability'
    verb: 'none'
    actor: 'implementation'
    locator: '§5'
    source_lines: '396-397'
    text: 'A proof-of-possession key can be used as a correlation handle if the same key is used on multiple occasions.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'directly relevant to a kid as well: a stable Key ID is a correlation handle whether or not it is derived.'
  - id: 'rfc-8747#R-0085'
    object: 'proof-of-possession key'
    field: 'privacy mitigation; lowercase ''it is recommended'''
    verb: 'none'
    actor: 'implementation'
    locator: '§5'
    source_lines: '397-399'
    text: 'Thus, for privacy reasons, it is recommended that different proof-of-possession keys be used when interacting with different parties.'
    kind: stated
    testable: 'no'
    status: active
    note: 'LOWERCASE ''recommended''. Not a BCP 14 RECOMMENDED. Note the tension with §6''s intentional-reuse case, which wants one key across CWTs.'
  - id: 'rfc-8747#R-0086'
    object: 'deployment'
    field: 'out-of-band agreement is required'
    verb: 'none'
    actor: 'issuer and recipient'
    locator: '§6'
    source_lines: '403-405'
    text: 'The use of CWTs with proof-of-possession keys requires additional information to be shared between the involved parties in order to ensure correct processing.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0087'
    object: 'Recipient'
    field: 'verification precondition'
    verb: 'none'
    actor: 'recipient'
    locator: '§6'
    source_lines: '405-406'
    text: 'The recipient needs to be able to use credentials to verify the authenticity and integrity of the CWT.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0088'
    object: 'Recipient'
    field: 'decryption precondition; lowercase ''may need'''
    verb: 'none'
    actor: 'recipient'
    locator: '§6'
    source_lines: '406-408'
    text: 'Furthermore, the recipient may need to be able to decrypt either the whole CWT or the encrypted parts thereof (see Section 3.3).'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0089'
    object: 'Recipient'
    field: 'what the recipient must know'
    verb: 'none'
    actor: 'recipient'
    locator: '§6'
    source_lines: '408-409'
    text: 'This requires the recipient to know information about the issuer.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0090'
    object: 'deployment'
    field: 'agreement on claims'
    verb: 'none'
    actor: 'issuer and recipient'
    locator: '§6'
    source_lines: '409-412'
    text: 'Likewise, there needs to be agreement between the issuer and the recipient about the claims being used (which is also true of CWTs in general).'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0091'
    object: 'cnf member kid'
    field: 'Key ID uniqueness is the ISSUER''S operational discipline; lowercase ''needs to make sure'''
    verb: 'none'
    actor: 'issuer'
    locator: '§6'
    source_lines: '414-417'
    text: 'When an issuer creates a CWT containing a Key ID claim, it needs to make sure that it does not issue another CWT with different claims containing the same Key ID within the lifetime of the CWTs, unless intentionally desired.'
    kind: stated
    testable: 'partial'
    status: active
    note: 'THE R-O-01 SITE. Uniqueness is an operational practice, not a property of the identifier, and the qualifier ''unless intentionally desired'' is part of the sentence - record.yaml''s bears_on quotation elides exactly that clause behind an ellipsis. The full sentence is carried here verbatim.'
  - id: 'rfc-8747#R-0092'
    object: 'cnf member kid'
    field: 'the failure mode: impersonation and privilege gain'
    verb: 'none'
    actor: 'issuer'
    locator: '§6'
    source_lines: '417-419'
    text: 'Failure to do so may allow one party to impersonate another party, with the potential to gain additional privileges.'
    kind: stated
    testable: 'no'
    status: active
    note: 'lowercase ''may''.'
  - id: 'rfc-8747#R-0093'
    object: 'cnf member kid'
    field: 'when reuse is wanted'
    verb: 'none'
    actor: 'issuer'
    locator: '§6'
    source_lines: '419-423'
    text: 'A case where such reuse of a Key ID would be intentional is when a presenter obtains a CWT with different claims (e.g., extended scope) for the same recipient but wants to continue using an existing security association (e.g., a DTLS session) bound to the key identified by the Key ID.'
    kind: stated
    testable: 'no'
    status: active
    note: 'the counter-case to §5''s different-keys-recommended: here continuity of a DTLS session is the reason to keep one Key ID across CWTs.'
  - id: 'rfc-8747#R-0094'
    object: 'cnf member kid'
    field: 'segregation across CWT kinds; lowercase ''care must be taken'''
    verb: 'none'
    actor: 'application'
    locator: '§6'
    source_lines: '423-428'
    text: 'Likewise, if PoP keys are used for multiple different kinds of CWTs in an application and the PoP keys are identified by Key IDs, care must be taken to keep the keys for the different kinds of CWTs segregated so that an attacker cannot cause the wrong PoP key to be used by using a valid Key ID for the wrong kind of CWT.'
    kind: stated
    testable: 'partial'
    status: active
    note: 'LOWERCASE ''must''. A cross-protocol confusion attack described in full, with no normative keyword anywhere in it.'
  - id: 'rfc-8747#R-0095'
    object: 'aud claim'
    field: 'mitigation'
    verb: 'none'
    actor: 'application'
    locator: '§6'
    source_lines: '428-429'
    text: 'Using an audience restriction for the CWT would be one strategy to mitigate this risk.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0096'
    object: 'IANA registries'
    field: 'one procedure for all registries here'
    verb: 'none'
    actor: 'IANA'
    locator: '§7'
    source_lines: '433-434'
    text: 'The following registration procedure is used for all the registries established by this specification.'
    kind: stated
    testable: 'no'
    status: active
    note: '''all the registries'' is one registry: §7.2''s. §7.1 registers into RFC 8392''s registry rather than establishing one.'
  - id: 'rfc-8747#R-0097'
    object: 'IANA registries'
    field: 'registration policy and review period'
    verb: 'none'
    actor: 'IANA'
    locator: '§7'
    source_lines: '436-438'
    text: 'Values are registered on a Specification Required [RFC8126] basis after a three-week review period on the <cwt-reg-review@ietf.org> mailing list, on the advice of one or more designated experts.'
    kind: stated
    testable: 'yes'
    status: active
    note: '''Specification Required'' is an RFC 8126 policy name, not a BCP 14 REQUIRED - it is mixed case and is not counted.'
  - id: 'rfc-8747#R-0098'
    object: 'IANA registries'
    field: 'pre-publication allocation; lowercase ''may approve'''
    verb: 'none'
    actor: 'designated experts'
    locator: '§7'
    source_lines: '439-441'
    text: 'However, to allow for the allocation of values prior to publication, the designated experts may approve registration once they are satisfied that such a specification will be published.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0099'
    object: 'IANA registries'
    field: 'review request form; lowercase ''should use'''
    verb: 'none'
    actor: 'registrant'
    locator: '§7'
    source_lines: '443-445'
    text: 'Registration requests sent to the mailing list for review should use an appropriate subject (e.g., "Request to Register CWT Confirmation Method: example").'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0100'
    object: 'IANA registries'
    field: 'escalation after 21 days'
    verb: 'none'
    actor: 'registrant'
    locator: '§7'
    source_lines: '445-447'
    text: 'Registration requests that are undetermined for a period longer than 21 days can be brought directly to IANA''s attention (using the iana@iana.org mailing list) for resolution.'
    kind: stated
    testable: 'yes'
    status: active
    note: '21 days and §7''s ''three-week review period'' are the same interval stated twice in two units; they agree.'
  - id: 'rfc-8747#R-0101'
    object: 'IANA registries'
    field: 'expert review criteria; lowercase ''should determine'''
    verb: 'none'
    actor: 'designated experts'
    locator: '§7'
    source_lines: '449-451'
    text: 'Designated experts should determine whether a registration request contains enough information for the registry to be populated with the new values and whether the proposed new functionality already exists.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0102'
    object: 'IANA registries'
    field: 'handling bad registrations; lowercase ''should ask'''
    verb: 'none'
    actor: 'designated experts'
    locator: '§7'
    source_lines: '452-454'
    text: 'In the case of an incomplete registration or an attempt to register already existing functionality, the designated experts should ask for corrections or reject the registration.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0103'
    object: 'IANA registries'
    field: 'how many experts; lowercase ''It is suggested'''
    verb: 'none'
    actor: 'IESG'
    locator: '§7'
    source_lines: '456-459'
    text: 'It is suggested that multiple designated experts be appointed who are able to represent the perspectives of different applications using this specification in order to enable broadly informed review of registration decisions.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0104'
    object: 'IANA registries'
    field: 'conflict of interest; lowercase ''should defer'''
    verb: 'none'
    actor: 'designated experts'
    locator: '§7'
    source_lines: '459-462'
    text: 'In cases where a registration decision could be perceived as creating a conflict of interest for a particular expert, that expert should defer to the judgment of the other experts.'
    kind: stated
    testable: 'no'
    status: active
  - id: 'rfc-8747#R-0105'
    object: 'cnf claim'
    field: 'registration into RFC 8392''s claims registry'
    verb: 'none'
    actor: 'IANA'
    locator: '§7.1'
    source_lines: '466-468'
    text: 'This specification registers the "cnf" claim in the IANA "CBOR Web Token (CWT) Claims" registry [IANA.CWT.Claims], established by [RFC8392].'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8747#R-0106'
    object: 'cnf claim'
    field: 'the complete registration: all seven fields'
    verb: 'none'
    actor: 'IANA'
    locator: '§7.1.1'
    source_lines: '472-484'
    text: '* Claim Name: "cnf" * Claim Description: Confirmation * JWT Claim Name: "cnf" * Claim Key: 8 * Claim Value Type(s): map * Change Controller: IESG * Specification Document(s): Section 3.1 of RFC 8747'
    kind: stated
    testable: 'yes'
    status: active
    note: 'reproduced across the section''s blank lines, which the whitespace normalisation collapses; the source''s own ''* '' bullet markers are kept. Claim Key 8 and value type ''map'' are the two facts an implementer needs.'
  - id: 'rfc-8747#R-0107'
    object: 'CWT Confirmation Methods registry'
    field: 'registry creation'
    verb: 'none'
    actor: 'IANA'
    locator: '§7.2'
    source_lines: '488-489'
    text: 'This specification establishes the IANA "CWT Confirmation Methods" registry for CWT "cnf" member values.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'the authoritative spelling of the registry name, agreeing with §3.1 and not with §3.5.'
  - id: 'rfc-8747#R-0108'
    object: 'CWT Confirmation Methods registry'
    field: 'what the registry stores'
    verb: 'none'
    actor: 'IANA'
    locator: '§7.2'
    source_lines: '489-491'
    text: 'The registry records the confirmation method member and a reference to the specification that defines it.'
    kind: stated
    testable: 'no'
    status: active
    note: 'says the registry records the member and a reference. The template at §7.2.1 asks for seven fields, so the registry stores more than this sentence says.'
  - id: 'rfc-8747#R-0109'
    object: 'registration template'
    field: 'field: Confirmation Method Name'
    verb: 'none'
    actor: 'registrant'
    locator: '§7.2.1'
    source_lines: '495-496'
    text: 'Confirmation Method Name: The human-readable name requested (e.g., "kid").'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8747#R-0110'
    object: 'registration template'
    field: 'field: Confirmation Method Description'
    verb: 'none'
    actor: 'registrant'
    locator: '§7.2.1'
    source_lines: '498-500'
    text: 'Confirmation Method Description: Brief description of the confirmation method (e.g., "Key Identifier").'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8747#R-0111'
    object: 'registration template'
    field: 'field: JWT Confirmation Method Name, and the N/A escape'
    verb: 'none'
    actor: 'registrant'
    locator: '§7.2.1'
    source_lines: '502-508'
    text: 'JWT Confirmation Method Name: Claim Name of the equivalent JWT confirmation method value, as registered in the "JSON Web Token Claims" subregistry in the "JSON Web Token (JWT)" registry [IANA.JWT]. CWT claims should normally have a corresponding JWT claim. If a corresponding JWT claim would not make sense, the designated experts can choose to accept registrations for which the JWT Claim Name is listed as "N/A".'
    kind: stated
    testable: 'yes'
    status: active
    note: 'the template field carrying a real rule: a CWT confirmation method normally has a JWT twin, and the experts may accept ''N/A'' where it would not make sense. Lowercase ''should normally have''.'
  - id: 'rfc-8747#R-0112'
    object: 'registration template'
    field: 'field: Confirmation Key'
    verb: 'none'
    actor: 'registrant'
    locator: '§7.2.1'
    source_lines: '510-511'
    text: 'Confirmation Key: CBOR map key value for the confirmation method.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'a CBOR map key value, with no stated range, no integer/text split and no allocation tiers - contrast RFC 8392 §9.1.1, which tiers its Claim Key space.'
  - id: 'rfc-8747#R-0113'
    object: 'registration template'
    field: 'field: Confirmation Value Type(s)'
    verb: 'none'
    actor: 'registrant'
    locator: '§7.2.1'
    source_lines: '513-514'
    text: 'Confirmation Value Type(s): CBOR types that can be used for the confirmation method value.'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8747#R-0114'
    object: 'registration template'
    field: 'field: Change Controller'
    verb: 'none'
    actor: 'registrant'
    locator: '§7.2.1'
    source_lines: '516-518'
    text: 'Change Controller: For Standards Track RFCs, list the "IESG". For others, give the name of the responsible party.'
    kind: stated
    testable: 'yes'
    status: active
  - id: 'rfc-8747#R-0115'
    object: 'registration template'
    field: 'field: Specification Document(s)'
    verb: 'none'
    actor: 'registrant'
    locator: '§7.2.1'
    source_lines: '520-526'
    text: 'Specification Document(s): Reference to the document or documents that specify the parameter, preferably including URIs that can be used to retrieve copies of the documents. An indication of the relevant sections may also be included but is not required. Note that the designated experts and IANA must be able to obtain copies of the specification document(s) to perform their work.'
    kind: stated
    testable: 'yes'
    status: active
    note: 'carries a lowercase ''must be able to obtain copies'' addressed to the experts and IANA, and ''is not required'' for section indications.'
  - id: 'rfc-8747#R-0116'
    object: 'cnf member COSE_Key'
    field: 'complete initial registration, all seven fields'
    verb: 'none'
    actor: 'IANA'
    locator: '§7.2.2'
    source_lines: '530-536'
    text: '* Confirmation Method Name: "COSE_Key" * Confirmation Method Description: COSE_Key Representing Public Key * JWT Confirmation Method Name: "jwk" * Confirmation Key: 1 * Confirmation Value Type(s): COSE_Key structure * Change Controller: IESG * Specification Document(s): Section 3.2 of RFC 8747'
    kind: stated
    testable: 'yes'
    status: active
    note: 'Confirmation Key 1, value type ''COSE_Key structure'', JWT twin ''jwk''. Table 1 says ''COSE_Key'' where this says ''COSE_Key structure''.'
  - id: 'rfc-8747#R-0117'
    object: 'cnf member Encrypted_COSE_Key'
    field: 'complete initial registration, all seven fields'
    verb: 'none'
    actor: 'IANA'
    locator: '§7.2.2'
    source_lines: '538-546'
    text: '* Confirmation Method Name: "Encrypted_COSE_Key" * Confirmation Method Description: Encrypted COSE_Key * JWT Confirmation Method Name: "jwe" * Confirmation Key: 2 * Confirmation Value Type(s): COSE_Encrypt or COSE_Encrypt0 structure (with an optional corresponding COSE_Encrypt or COSE_Encrypt0 tag) * Change Controller: IESG * Specification Document(s): Section 3.3 of RFC 8747'
    kind: stated
    testable: 'yes'
    status: active
    note: 'THE DEC-002 SITE. Confirmation Key 2, JWT twin ''jwe'', and the value type is ''COSE_Encrypt or COSE_Encrypt0 structure (with an optional corresponding COSE_Encrypt or COSE_Encrypt0 tag)''. ''optional'' is LOWERCASE - it is not a BCP 14 OPTIONAL. This is the document''s only occurrence of the word ''tag''.'
  - id: 'rfc-8747#R-0118'
    object: 'cnf member kid'
    field: 'complete initial registration, all seven fields'
    verb: 'none'
    actor: 'IANA'
    locator: '§7.2.2'
    source_lines: '548-554'
    text: '* Confirmation Method Name: "kid" * Confirmation Method Description: Key Identifier * JWT Confirmation Method Name: "kid" * Confirmation Key: 3 * Confirmation Value Type(s): binary string * Change Controller: IESG * Specification Document(s): Section 3.4 of RFC 8747'
    kind: stated
    testable: 'yes'
    status: active
    note: 'Confirmation Key 3, value type ''binary string'', JWT twin ''kid''. RFC 9679 later adds ''ckt'' at Confirmation Key 5 in this registry.'
