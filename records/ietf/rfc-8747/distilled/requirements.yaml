reconciliation: >-
  THE COUNTS AGREE AT 8, and a reconciliation is written anyway, because 118
  entries against 8 keywords needs explaining and because 8 keywords in a
  Standards Track format document is itself the finding.

  WHERE THE 8 ARE, by source line and section, each matched to exactly one entry
  (a bijection, checked by script): L172 (MUST, 3.1 - confirmation members that
  are not understood must be ignored), L180 (MUST, 3.1 - a cnf value must
  represent only a single key), L227 (MUST, 3.2 - a COSE_Key must contain the
  required members for its key type), L228 (MAY, 3.2 - and may contain others,
  including kid), L231 (MAY, 3.2 - COSE_Key may carry a symmetric key if the CWT
  is encrypted), L235 (MUST, 3.2 - otherwise the symmetric key must be
  encrypted), L357 (SHOULD, 4 - applications should also use audience
  restriction), L391 (MUST NOT, 4 - signatures under keys failing trust criteria
  must not be relied upon). FOUR MUST, TWO MAY, ONE SHOULD, ONE MUST NOT,
  matching bin/bcp14-count --by-keyword exactly. NOT ONE OF THE EIGHT IS IN 1,
  2, 3, 3.3, 3.4, 3.5, 5, 6, 7, 7.1 OR 7.2 - the whole of what this record is
  held for carries no BCP 14 keyword at all.

  AND SIX OF THE EIGHT ARE ABOUT A KEY REPRESENTATION, NOT ABOUT A KEY ID. Four
  of them (L227, L228, L231, L235) are in 3.2 alone and constrain the COSE_Key
  member; one is the ignore-unknown rule and one the single-key rule. The two
  sections this library holds the document for - 3.4 on what a Key ID is and 6
  on Key ID uniqueness - contain ZERO.

  SO THE REAL NORMATIVE BASELINE IS PROSE, A TABLE AND A REGISTRY. What an
  implementer must obey lives in (i) 3.1's Table 1, whose three data rows are
  the complete set of ways this document lets a CWT identify a
  proof-of-possession key, reproduced here one row per entry with the table's
  own pipes; (ii) 7.1.1's completed claim registration, whose Claim Key 8 and
  value type map are the two facts a decoder needs; (iii) 7.2.1's seven-field
  registration template, which is where the rules for future registrants
  actually live; and (iv) 7.2.2's three completed registrations, reproduced
  whole, which is where the optional tag on Encrypted_COSE_Key is stated and
  nowhere else.

  WHAT WAS COUNTED INSTEAD, therefore: every sentence of 1 to 7.2.2 that states
  a fact an implementer or a test could act on, split where each part is
  separately testable; all three Table 1 data rows and its caption; the complete
  7.1.1 registration; all seven 7.2.1 template fields; and all three 7.2.2
  registrations. 118 entries, R-0001 to R-0118, in source order with no gaps.

  WHAT WAS DELIBERATELY NOT COUNTED: 2's BCP 14 recital at source lines 101-105.
  It recites all eleven keywords and constrains nothing; bin/validate recounts
  these texts with boilerplate stripping OFF, so quoting it would add 11 phantom
  keywords and make the extraction read 19 against a source of 8. It is quoted
  in normative.md, which nothing counts. Also not counted: the front matter, the
  table of contents, the Abstract, 8's two reference lists, the
  Acknowledgements and the Authors' Addresses.

  TWENTY-FIVE NON-UPPERCASE FORCE WORDS IN THE BODY, each recorded as kind:
  stated with verb: none and the phrase named in `field` rather than silently
  promoted. Measured by a case-sensitive word-boundary sweep of the whole
  source: 25 occurrences on 25 distinct lines of sections 1 to 7.2.2 - may 9,
  should 7, must 4, required 2, Required 1, recommended 1, optional 1 - at L147,
  L148, L166, L182, L227, L305, L312, L315, L323, L354, L398, L407, L417, L425,
  L436, L440, L443, L449, L453, L461, L505, L523, L524, L525 and L543. Six more
  fall outside the body and are not requirement material: L43 and L56 are IETF
  front-matter boilerplate, and L584, L588, L605 and L609 are the month May in
  reference entries.

  THE SHARPEST OF THE TWENTY-FIVE: L182's "may be present", which is the
  at-most-one-key rule and the exclusion an implementer most needs; L354's
  "Appropriate means must be used", the document's central secrecy obligation;
  L312's "implementers should expect collisions"; L323's "the Key ID may be
  different on both sides of the conversation"; L425's "care must be taken",
  which carries a complete cross-protocol confusion attack; and L543's
  "optional", which is the tag clause on Encrypted_COSE_Key and the document's
  only occurrence of the word tag. Under 2's own rule - "when, and only when,
  they appear in all capitals" - none of these binds anybody. That is a finding,
  not a counting artefact. Note also L227 and L436: L227's lowercase "required"
  sits in the same sentence as a MUST, and L436's mixed-case "Required" is the
  RFC 8126 policy name "Specification Required"; bin/bcp14-count is
  case-sensitive, so neither is counted and neither should be.

  COMPOUND SENTENCES SPLIT, AND NOTHING SPLICED. L227-229 is one sentence
  carrying two of the eight keywords and is split into R-0039 (MUST contain the
  required members) and R-0040 (and MAY contain other members): the split is a
  CONTIGUOUS character span inside one flowed line range, never two non-adjacent
  quotes welded together. 3's cnf-value sentence is split the same way into a
  type fact and a member-semantics fact. Every one of the 118 texts was then
  VERIFIED mechanically as a contiguous substring of the whitespace-normalised
  source: 118 of 118, zero failures, zero relaxations.

  TEXT NORMALISATION, DECLARED. `text` is the source's own wording with
  whitespace normalised - line breaks and the RFC's double sentence spacing
  become single spaces. Every text was cut from .cache/rfc-8747.txt by line
  range by script and never retyped. NOTHING IS HEALED AT A HYPHEN: the source
  has eight line-end hyphens, at L25, L90, L177, L180, L598, L615, L616 and
  L619, and three of them fall inside a requirement text. Those three read
  "proof- of-possession" (R-0001, L90-91), "proof-of- possession" (R-0027,
  L177-178) and "proof-of- possession" (R-0028, L180-181) - with the space the
  break leaves, because joining them would make the quoted token occur nowhere
  in the source. R-0028 is the single-key MUST, so the document's second-most
  cited sentence is one of the three. Breaks at a SPACE are collapsed to a
  single space, which is ordinary normalisation and not a heal.

  PAGE DECORATION: NONE. The source has ZERO form feeds, so no entry's line
  range can touch a page break and there are no running headers or footers to
  exclude - unusual for an RFC .txt and worth stating, since the sibling records
  in this lane each had 25 or more. Built with split on a newline, never
  splitlines.

  TESTABILITY, counted from this file at write time: 35 entries are
  testable: yes, 12 partial and 71 no; 110 are kind: stated
  and 8 kind: inferred. The `no` entries are role definitions,
  analogies, motivation and the non-uppercase advisory sentences, each of which
  states something true about the document without giving a predicate a harness
  could evaluate.

  THE kind CRITERION, DECLARED, because pass 2 found it was being applied two
  ways and SKILL.md's wording does not fit this file. SKILL.md says
  `kind: inferred` marks anything NOT LITERALLY STATED - but all 118 texts here
  are verbatim contiguous substrings of the source, so under that reading the
  split would be 118/0 and the field would carry no information. What this file
  means by it: `stated` is a sentence the document asserts as an OBLIGATION or
  as a DEFINITION that binds; `inferred` is one it presents as DESCRIPTION,
  ANALOGY, EQUIVALENCE or FRAMING, where the entry exists because this
  extraction judged the sentence to bear on an obligation, not because the
  document asserted one. The eight: R-0001 (scope), R-0002 and R-0044
  (equivalence to RFC 7800), R-0003 (inherited vocabulary), R-0009 (the
  notation the examples are written in), R-0019 and R-0022 (the SAML
  analogies), R-0069 (framing).

  Applying it consistently moved ONE entry. R-0009 - "This specification
  provides examples in CBOR extended diagnostic notation, as defined in
  Appendix G of [RFC8610]" - was `stated` while R-0003, the neighbouring
  inherited-vocabulary sentence, was `inferred` on the same ground; it is now
  `inferred`, which is why the split is 110/8 and not 111/7. R-0011 and R-0076
  carry the same `force carried by` marker in their `field` and REMAIN
  `stated`, deliberately: R-0011 defines what including `cnf` asserts and
  R-0076 states a condition on obtaining the security gain, and both bind.

  READ THE `inferred` CLAUSE AS A CONJUNCTION, which pass 3 checked across all
  118 and is the only reading under which the split is 110/8. Its two halves
  must BOTH hold: the sentence is presented as description, analogy,
  equivalence or framing, AND the entry exists because this extraction judged
  the sentence to bear on an obligation rather than because the document
  asserted one. Read with DESCRIPTION as a sufficient ground on its own the
  split would be nothing like 110/8, because many entries record a fact the
  document plainly asserts about CWTs without placing an obligation - R-0021
  ("Some of them use proof-of-possession keys, while others do not"), R-0063,
  R-0066, R-0073, R-0079, R-0080, R-0084 among them. Those stay `stated`
  because the document asserts them; the eight `inferred` entries are the ones
  where it is only this extraction that thought the sentence mattered. Where
  the register is sharp the application IS consistent and pass 3 checked each
  pair: both analogies (R-0019, R-0022) are `inferred`, both equivalence
  claims (R-0002, R-0044) are `inferred`, and both "only ... if/when" sentences
  (R-0070, R-0076) are `stated`, the second deliberately so.

  DUPLICATE TEXT, the only place a wrong id can still match the quoted words:
  exactly ONE group of two. R-0038 (3.2) and R-0052 (3.4) are BYTE-IDENTICAL -
  both read "The following example demonstrates such a declaration in the CWT
  Claims Set of a CWT:". bin/check-id-joins --surface finds this group and no
  other. Every citation in this extraction was emitted from the id table by a
  selector that raises on zero or multiple matches, so neither can have been
  typed.
reviewed_by: ""
note: >-
  Ids are stable and never reused. Cite as rfc-8747#R-NNNN.

  Pass 1 of the FX-1 extraction (extract), effort max, 2026-10-21. Read only
  .cache/rfc-8747.txt - never summary.md and never another record's artifacts.

  `verb: none` marks an entry whose source sentence carries no capitalised BCP
  14 keyword; `field` then names the phrase that carries the force instead.
  `actor` is who must comply, in the document's own vocabulary where it has one
  ("implementations", "applications", "implementers", "issuer", "presenter",
  "recipient", "designated experts", "IANA", "IESG") and the nearest role
  otherwise.

  THIS DOCUMENT NAMES THREE ROLES AND DEFINES NO MESSAGE. 2 defines Issuer,
  Presenter and Recipient; 3 states the relation between them; 3.5 then refuses
  twice to specify how anything is communicated and 4 puts the architecture out
  of scope. protocol.yaml therefore models the ROLE TRIANGLE and marks every leg
  the document declines to specify, quoting the refusal in place. state-machine
  is declared not_applicable - the words state, states, lifecycle, transition,
  phase, revoke, expire, rotate and issuance occur ZERO times in the source.

  AND IT SHIPS NO GRAMMAR. schema, grammar, ABNF, ASN.1 and JSON Schema each
  occur ZERO times; CDDL occurs once, at L630, inside the reference entry for
  RFC 8610, which is cited for its Appendix G diagnostic notation and nothing
  else. Everything in distilled/schema/ therefore carries `.derived.` in its
  filename except the verbatim capture of Table 1 and the IANA templates.

