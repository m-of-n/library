record: rfc-8747
reviewed_by: ""
# ------------------------------------------------------------------------
# WHY THIS FILE EXISTS AND WHAT IT IS NOT
# ------------------------------------------------------------------------
# RFC 8747 DEFINES THREE ROLES AND NOT ONE MESSAGE. section 2 defines Issuer,
# Presenter and Recipient outright - they are not merely named - and section 3
# states the relation between them in one sentence. Then section 3.5 refuses
# TWICE to specify how anything is communicated, and section 4 puts the
# surrounding architecture out of scope. So this file models the ROLE
# TRIANGLE, with every leg marked for whether the document specifies it and
# the refusal quoted in place. It is not a message flow, and no step below
# should be read as one.
#
# NOT DECLARED not_applicable, and the reason is the opposite of a shortcut:
# rfc-9679's extraction declared ITS protocol not_applicable on the ground
# that the flow belongs to RFC 8747. This is RFC 8747. The role model is the
# thing that was pointed at, so it is extracted here rather than deferred
# again - and the finding is that the arrows are missing from this end too.
#
# THE WORD SWEEP BEHIND THAT JUDGEMENT, over all 683 source lines,
# case-insensitive, whole words:
#   error        0      step        0      response    0
#   flow         0      handshake   0      negotiate   0
#   sender       0      verifier    0      round-trip  0
#   request      7      message     7      protocol    7
#   exchange     2      nonce       4      challenge   1
# Counts are OCCURRENCES, not lines - the two differ for 'message', which
# appears 7 times on 6 lines because line 325 carries it twice.
# ZERO errors, ZERO steps, ZERO responses. The 7 'request' hits are the
# masthead 'Request for Comments' (L6), section 4's 'used by a presenter to
# request these tokens' (L367), four in section 7's registration-request
# procedure (L443, L444, L445, L449) and 'requested' in section 7.2.1's
# template (L496). THREE of the four 'nonce' hits and the single 'challenge'
# are inside section 3.5, the section titled Specifics Intentionally Not
# Specified; the fourth is section 4's 'nonces and timestamps' at L371. Both
# 'exchange' hits are in section 3.5. That is a role model with the arrows
# deliberately left out, not a protocol.

roles:
  - name: 'Issuer'
    locator: 'section 2'
    definition: 'Party that creates the CWT and binds the claims about the subject to the proof-of-possession key.'
    requirement: 'rfc-8747#R-0004'
  - name: 'Presenter'
    locator: 'section 2'
    definition: 'Party that proves possession of a private key (for asymmetric key cryptography) or secret key (for symmetric key cryptography) to a recipient of a CWT.'
    requirement: 'rfc-8747#R-0005'
    oauth_alias: 'OAuth Client'
    oauth_alias_requirement: 'rfc-8747#R-0006'
  - name: 'Recipient'
    locator: 'section 2'
    definition: 'Party that receives the CWT containing the proof-of-possession key information from the presenter.'
    requirement: 'rfc-8747#R-0007'
    oauth_alias: 'OAuth Resource Server'
    oauth_alias_requirement: 'rfc-8747#R-0008'

flows:
  - name: 'declare and confirm a proof-of-possession key'
    locator: 'section 3, section 3.4, section 3.5, section 6'
    specified_by_this_document: 'partly - the structure only. The CWT and its cnf claim are fully specified; every transmission and every check is not.'
    steps:
      - step: 1
        from: 'Issuer'
        to: 'Issuer'
        message: 'none - an internal act'
        what_happens: 'the issuer binds claims about the subject to a proof-of-possession key and chooses one of the three confirmation methods'
        specified_here: 'YES for the structure, NO for the choice: nothing states when to prefer COSE_Key, Encrypted_COSE_Key or kid'
        locator: 'section 2 (role), section 3, section 3.1, Table 1'
        requirements:
          - 'rfc-8747#R-0004'
          - 'rfc-8747#R-0011'
          - 'rfc-8747#R-0028'
          - 'rfc-8747#R-0029'
          - 'rfc-8747#R-0036'
        note: 'the issuer must also satisfy section 6''s uniqueness discipline before issuing, which is a precondition on this step and not a message: "When an issuer creates a CWT containing a Key ID claim, it needs to make sure that it does not issue another CWT with different claims containing the same Key ID within the lifetime of the CWTs, unless intentionally desired." (rfc-8747#R-0091)'
      - step: 2
        from: 'Issuer'
        to: 'Presenter'
        message: 'CWT carrying a cnf claim'
        what_happens: 'the CWT reaches the presenter'
        specified_here: 'NO - the document never says how a CWT gets from issuer to presenter'
        locator: 'section 4 (by reference to the ACE OAuth Framework, explicitly out of scope)'
        requirements:
          - 'rfc-8747#R-0075'
          - 'rfc-8747#R-0077'
        note: 'section 4 names an architecture in which this happens and then excludes it: "Note that a discussion of the architecture or specific protocols that CWTs with proof-of-possession keys are used with is beyond the scope of this specification." (rfc-8747#R-0077)'
      - step: 3
        from: 'Presenter'
        to: 'Recipient'
        message: 'CWT carrying a cnf claim'
        what_happens: 'the presenter presents the CWT to a recipient'
        specified_here: 'NO - no transport, no encoding beyond the CWT itself, no ordering'
        locator: 'section 2 (roles), section 4'
        requirements:
          - 'rfc-8747#R-0005'
          - 'rfc-8747#R-0007'
          - 'rfc-8747#R-0075'
      - step: 4
        from: 'Recipient'
        to: 'Presenter'
        message: 'a nonce or challenge - NOT SPECIFIED'
        what_happens: 'the recipient determines a value for the presenter to sign'
        specified_here: 'NO, and the refusal is explicit'
        locator: 'section 3.5'
        requirements:
          - 'rfc-8747#R-0061'
          - 'rfc-8747#R-0062'
          - 'rfc-8747#R-0064'
        note: 'the shape is described - "Proof of possession is often demonstrated by having the presenter sign a value determined by the recipient using the key possessed by the presenter." (rfc-8747#R-0061) - and then withheld: "The means of communicating the nonce and the nature of its contents are intentionally not described in this specification, as different protocols will communicate this information in different ways." (rfc-8747#R-0064)'
      - step: 5
        from: 'Presenter'
        to: 'Recipient'
        message: 'the signed nonce - NOT SPECIFIED'
        what_happens: 'the presenter proves possession of the confirmation key'
        specified_here: 'NO, and the refusal is explicit'
        locator: 'section 3.5'
        requirements:
          - 'rfc-8747#R-0065'
          - 'rfc-8747#R-0066'
          - 'rfc-8747#R-0063'
        note: '"Likewise, the means of communicating the signed nonce is also not specified, as this is also protocol specific." (rfc-8747#R-0065)'
      - step: 6
        from: 'Recipient'
        to: 'Recipient'
        message: 'none - an internal act'
        what_happens: 'the recipient resolves the confirmation key and checks the proof'
        specified_here: 'NO. For COSE_Key the key is in the token; for Encrypted_COSE_Key the recipient must already hold the decryption key; for kid the resolution is ASSUMED to be possible and no mechanism is given'
        locator: 'section 3.2, section 3.3, section 3.4, section 6'
        requirements:
          - 'rfc-8747#R-0050'
          - 'rfc-8747#R-0087'
          - 'rfc-8747#R-0088'
          - 'rfc-8747#R-0089'
          - 'rfc-8747#R-0086'
          - 'rfc-8747#R-0090'
        note: 'the key-resolution step is the hole in the middle of this document: "The proof-of-possession key can also be identified using a Key ID instead of communicating the actual key, provided the recipient is able to obtain the identified key using the Key ID." (rfc-8747#R-0050) - ''provided'' is the whole of it.'

error_paths:
  count: 0
  statement: 'the word ''error'' occurs ZERO times in the 683-line source, and no sentence defines a failure response, a rejection message, a retry or a recovery. Three sentences come closest and none is an error path.'
  nearest_candidates:
    - requirement: 'rfc-8747#R-0025'
      text: 'However, in the absence of such requirements, all confirmation members that are not understood by implementations MUST be ignored.'
      why_not_an_error_path: 'a local accept-and-drop rule on a map member, with no peer, no message and no response. It is a decoding rule, captured in messages.yaml on the cnf extension socket.'
    - requirement: 'rfc-8747#R-0083'
      text: 'Proof-of-possession signatures made with keys not meeting the application''s trust criteria MUST NOT be relied upon.'
      why_not_an_error_path: 'a prohibition on relying on a signature, not a response to send. The document never says what a recipient does instead.'
    - requirement: 'rfc-8747#R-0057'
      text: 'Recipients of a CWT with a PoP key linked through only a Key ID should be prepared to handle such situations.'
      why_not_an_error_path: 'lowercase ''should be prepared to handle such situations'' - no behaviour is specified, so there is nothing to model and nothing to test.'

scope_limits:
  note: 'the three places RFC 8747 declines to specify something a protocol model would need. Quoted rather than summarised, because the refusals are the finding.'
  refusals:
    - requirement: 'rfc-8747#R-0064'
      locator: '§3.5'
      text: 'The means of communicating the nonce and the nature of its contents are intentionally not described in this specification, as different protocols will communicate this information in different ways.'
    - requirement: 'rfc-8747#R-0065'
      locator: '§3.5'
      text: 'Likewise, the means of communicating the signed nonce is also not specified, as this is also protocol specific.'
    - requirement: 'rfc-8747#R-0077'
      locator: '§4'
      text: 'Note that a discussion of the architecture or specific protocols that CWTs with proof-of-possession keys are used with is beyond the scope of this specification.'

coverage:
  roles: 3
  steps: 6
  steps_the_document_specifies: 0
  steps_partly_specified: 1
  error_paths: 0
  requirements_cited: 27
  statement: 'of the six steps, exactly ONE is even partly specified by this document - step 1, and only as to the structure the issuer builds. Steps 2 to 6 are named by the role definitions and left unspecified, two of them by explicit refusal. That ratio is the model''s actual content.'
