record: rfc-8747
source_version: "RFC 8747 (March 2020), Category: Standards Track"
source_digest: "9b695379f119f9675828d054f1b0e76014c06c9a59dccef8bb417e0420272dda"
reviewed_by: ""

# THIS ARTIFACT IS PRODUCED, NOT DECLARED not_applicable, AND THE REASON IS
# THE POINT. Every other CBOR/COSE record in this lane that lacks a protocol
# lacks one because the document has no word for any party. This one does:
# measured whole-word and case-insensitively over all 683 lines,
# `presenter` 18, `recipient` 14, `issuer` 8, `party` 8, `parties` 7. Three
# roles, named and given distinct obligations.
#
# What it does NOT have is a specified exchange - and that absence is the
# document's own declaration rather than our inference. §3.5 is titled
# "Specifics Intentionally Not Specified" and says of the nonce: "The means of
# communicating the nonce and the nature of its contents are intentionally not
# described in this specification, as different protocols will communicate
# this information in different ways" (R-0064), and of the reply: "Likewise,
# the means of communicating the signed nonce is also not specified, as this
# is also protocol specific" (R-0065).
#
# So: roles YES, flows NO BY CONSTRUCTION. Recording the roles and the declared
# gap is more informative than an N/A verdict, because the gap is a finding -
# an application that adopts `cnf` must supply the whole exchange itself, and
# nothing in this document constrains how.
#
# The thin exchange vocabulary corroborates it: `protocol` 2 (lines 341, 614 -
# one in §3.5's own disclaimer, one in a reference title), `exchange` 2 (333,
# 335), `message` 4, `nonce` 3, `challenge` 1, `request` 4 (one at line 6, the
# masthead), and `response`, `handshake`, `negotiate`, `sender`, `verifier`,
# `round` all ZERO.

coverage: >-
  3 roles, 0 flows, 0 error paths, and 2 declared absences. No Mermaid diagram:
  there is no sequence to draw, and drawing a plausible one would invent the
  exchange §3.5 declines to specify.

roles:

  - name: issuer
    occurrences: 8
    locator: "§1, §3.4, §6"
    does: >-
      Creates the CWT and declares in it that the presenter possesses a
      particular key, by including a `cnf` claim.
    obligations:
      - rfc-8747#R-0051
      - rfc-8747#R-0091
    note: >-
      §6 places the one operational obligation in the document on this role,
      and it is lower case: when an issuer creates a CWT containing a Key ID
      claim, it "needs to make sure" it does not issue another CWT with
      different claims carrying the same Key ID within the CWTs' lifetime.
      Uniqueness is therefore the issuer's discipline, not a property of the
      identifier - which is the whole of this record's bearing on R-O-01.

  - name: presenter
    occurrences: 18
    locator: "§1, §3.4, §3.5"
    does: >-
      Possesses the proof-of-possession key and demonstrates that possession
      to the recipient.
    obligations: []
    obligations_why: >-
      The document states NO obligation on the presenter. §3.5 describes how
      possession is "often demonstrated" - signing a value determined by the
      recipient - and then declines to specify it. The most-named party in the
      document carries none of its eight BCP 14 keywords.
    note: >-
      §1 identifies the presenter in several ways depending on the application
      (`sub`, `iss`, or a subject identifier relative to the issuer) and says
      "The actual mechanism used is dependent upon the application."

  - name: recipient
    occurrences: 14
    locator: "§1, §3.1, §3.3, §3.4, §6"
    does: >-
      Receives the CWT, obtains or decrypts the proof-of-possession key, and
      cryptographically confirms the presenter's possession of it.
    obligations:
      - rfc-8747#R-0025
      - rfc-8747#R-0057
      - rfc-8747#R-0087
      - rfc-8747#R-0088
      - rfc-8747#R-0089
    note: >-
      Carries the only MUST in the document that binds a consumer rather than
      a producer - unrecognised confirmation members MUST be ignored - and the
      lower-case advice that recipients of a CWT whose PoP key is linked only
      through a Key ID "should be prepared to handle" collisions.

flows: []
flows_why: >-
  The document specifies no exchange. Not for want of a subject - it names
  three roles and describes the proof-of-possession paradigm in §1 - but
  because §3.5 withholds the two messages that would constitute the flow. See
  `declared_absences` below. Writing a flow here would mean inventing the
  nonce exchange, which R-0064 and R-0065 forbid by declaring it out of scope.

error_paths: []
error_paths_why: >-
  No flow, so no error path. The nearest thing to a failure the document
  describes is a Key ID collision (§3.4, §6), and its consequence is stated as
  a risk - "may allow one party to impersonate another party" - with no
  detection step, no actor obliged to act and no recovery.

declared_absences:

  - what: "the nonce, and the means of communicating it"
    locator: "§3.5"
    requirement: rfc-8747#R-0064
    quote: >-
      The means of communicating the nonce and the nature of its contents are
      intentionally not described in this specification, as different protocols
      will communicate this information in different ways.
    consequence: >-
      An application adopting `cnf` supplies the challenge mechanism itself,
      and nothing here constrains its freshness, its encoding or its binding
      to the key.

  - what: "the signed nonce, and the means of communicating it"
    locator: "§3.5"
    requirement: rfc-8747#R-0065
    quote: >-
      Likewise, the means of communicating the signed nonce is also not
      specified, as this is also protocol specific.
    consequence: >-
      The reply half is unspecified too, so the document defines a key
      REPRESENTATION and leaves the proof itself entirely to the application.

# Alternatives to signing a nonce are acknowledged and pushed to the registry:
# R-0066 notes other means of proving possession exist and R-0067 encourages
# registering them in the registry §7.2 establishes. So the extension point
# for the missing half is a registry, which is itself the shape ARCH-0002 P1
# rejects - see design-notes.md.
