schema: "library-messages/v1"
record: rfc-8747
source_version: "RFC 8747 (March 2020), Category: Standards Track"
source_digest: "9b695379f119f9675828d054f1b0e76014c06c9a59dccef8bb417e0420272dda"
reviewed_by: ""

# WHAT THIS DOCUMENT DEFINES, AND WHAT IT ONLY NAMES. RFC 8747 defines exactly
# one claim - `cnf`, CWT claim key 8 - and three confirmation methods inside
# it. Everything else here (COSE_Key, COSE_Encrypt, COSE_Encrypt0, the CWT
# itself) belongs to RFC 8152/9052 or RFC 8392 and is NAMED, never redefined.
# Those entries carry an empty `constrained_by` for that reason, and the
# reason is stated per field rather than left to be inferred.

coverage: >-
  4 structures and 8 field entries, counted from the parsed file rather than
  from the prose. The `cnf` claim and its three confirmation methods are this
  document's own; `CWT_Claims_Set` is RFC 8392's and appears because `cnf` is a
  member of it.

  constrained_by cites 17 distinct requirement ids out of 118. The 101 not
  cited here are, by locator: §1's paradigm and party-identification prose
  (R-0001..R-0019), §2's terminology (none wired), §3.4's and §6's Key ID
  ANALYSIS (R-0050..R-0060, R-0086..R-0096 - the record's central finding,
  which is about what a `kid` IS rather than about a wire field, and which
  design-notes.md carries), §3.5's intentionally-unspecified nonce
  (R-0061..R-0067), §4's and §5's considerations, and §7's registry
  procedure. None of them constrains a field of a structure defined here.
  Measured by locator, not estimated.

structures:

  - name: cnf
    kind: claim
    defined_by: this document
    locator: "§3.1, §7.1.1"
    encoding: CBOR
    claim_key: 8
    value_type: map
    jwt_equivalent: "cnf (RFC 7800)"
    cbor_tag: none
    purpose: >-
      Carries confirmation methods — §3.1: "Some of them use proof-of-possession
      keys, while others do not." [The quoted sentence is the source's; the
      lead-in is ours. It is marked because an unmarked verbatim span inside a
      whole-scalar value is invisible to a delimited quote audit, which is the
      blind spot hazards.md §2 names.]
    constrained_by:
      - rfc-8747#R-0020
      - rfc-8747#R-0025
      - rfc-8747#R-0028
      - rfc-8747#R-0029
    fields:
      - name: COSE_Key
        index: 1
        type: COSE_Key
        required: false
        note: >-
          Confirmation key 1. The value type is RFC 8152's COSE_Key structure,
          which this document does not define.
        constrained_by:
          - rfc-8747#R-0033
          - rfc-8747#R-0039
          - rfc-8747#R-0040
          - rfc-8747#R-0041
          - rfc-8747#R-0043
      - name: Encrypted_COSE_Key
        index: 2
        type: "COSE_Encrypt or COSE_Encrypt0"
        required: false
        note: >-
          Confirmation key 2. THE TAG IS OPTIONAL, and that is a finding
          rather than a detail: §7.2.2 registers the value type as "COSE_Encrypt
          or COSE_Encrypt0 structure (with an optional corresponding
          COSE_Encrypt or COSE_Encrypt0 tag)", while §3.3's worked example
          prints the COSE_Encrypt0 UNTAGGED. So one `cnf` value has two
          conforming encodings and the registry entry does not choose between
          them. See design-notes.md, the DEC-002 cut.
        constrained_by:
          - rfc-8747#R-0034
      - name: kid
        index: 3
        type: "binary string"
        required: false
        note: >-
          Confirmation key 3. The field this record is held for. Its CONTENT is
          application specific (R-0053) and the document specifies no key
          encoding, no parameter subset and no digest algorithm, while naming a
          hash of the public key as one thing an application MAY do (R-0054).
          What a `kid` is NOT - derived, unique, or the same for both parties -
          is the subject of design-notes.md.
        constrained_by:
          - rfc-8747#R-0035
          - rfc-8747#R-0050
          - rfc-8747#R-0053
      - name: "(unrecognised members)"
        index: null
        type: any
        required: false
        note: >-
          Not a field the document names, but a field RULE it states: in the
          absence of application requirements, all confirmation members that
          are not understood MUST be ignored. The only MUST in §3.1 that binds
          a RECIPIENT rather than a producer.
        constrained_by:
          - rfc-8747#R-0025

  - name: COSE_Key
    kind: structure
    defined_by: "RFC 8152 (now RFC 9052)"
    locator: "§3.2"
    encoding: CBOR
    cbor_tag: none
    purpose: >-
      Carries an asymmetric proof-of-possession key, or a symmetric one when
      the CWT itself is encrypted.
    constrained_by: []
    constrained_by_why: >-
      Defined by RFC 8152, not here. This document constrains its USE - which
      members it must carry and when a symmetric key may travel in it - and
      those constraints are wired to the `COSE_Key` field above rather than
      duplicated on the structure.
    fields:
      - name: "(required members for the key type)"
        index: null
        type: "per key type"
        required: true
        note: >-
          The document states the obligation and delegates the content: the
          COSE_Key MUST contain the required key members for a COSE_Key of that
          key type. Which members those are is RFC 8152's.
        constrained_by:
          - rfc-8747#R-0039
      - name: kid
        index: 2
        type: bstr
        required: false
        note: >-
          RFC 8152's `kid` label INSIDE the COSE_Key, distinct from the `kid`
          confirmation method at `cnf` key 3. The document says the COSE_Key MAY
          contain it. Two different `kid`s one nesting level apart is a real
          ambiguity for a reader and is named here deliberately.
        constrained_by:
          - rfc-8747#R-0040

  - name: Encrypted_COSE_Key
    kind: structure
    defined_by: "RFC 8152 (now RFC 9052)"
    locator: "§3.3, §7.2.2"
    encoding: CBOR
    cbor_tag: "optional - 96 (COSE_Encrypt) or 16 (COSE_Encrypt0), per §7.2.2"
    purpose: >-
      Carries a symmetric proof-of-possession key encrypted to the recipient,
      for use when the CWT itself is not encrypted.
    constrained_by: []
    constrained_by_why: >-
      Defined by RFC 8152. This document's own constraint on it - that an
      unencrypted CWT's symmetric key MUST be encrypted as described in §3.3 -
      is wired to the `COSE_Key` field, which is where the obligation arises.
    fields:
      - name: "(COSE_Encrypt / COSE_Encrypt0 contents)"
        index: null
        type: "per RFC 8152"
        required: true
        note: >-
          Not restated here. §3.3's example is captured in examples/ and the
          encryption procedure is RFC 8152's.
        constrained_by:
          - rfc-8747#R-0043

  - name: CWT_Claims_Set
    kind: structure
    defined_by: "RFC 8392"
    locator: "§3.1, §3.4"
    encoding: CBOR
    cbor_tag: none
    purpose: >-
      The map `cnf` is a member of. Present because every example in this
      document is a CWT Claims Set carrying `cnf` beside `iss`, `aud` and `exp`.
    constrained_by: []
    constrained_by_why: >-
      Defined by RFC 8392. This document adds one member to it and constrains
      nothing else about it.
    fields:
      - name: cnf
        index: 8
        type: map
        required: false
        note: >-
          The claim registered by §7.1.1. Claim key 8, value type map, change
          controller IESG.
        constrained_by:
          - rfc-8747#R-0020

# Fields a requirement names and this file does NOT define, with why - the
# closure (a) direction a cross-check pass will test.
named_but_not_defined_here:
  - name: nonce
    named_by: [rfc-8747#R-0062, rfc-8747#R-0064]
    why: >-
      §3.5 names it and then declines to specify it: "The means of
      communicating the nonce and the nature of its contents are intentionally
      not described in this specification". There is no field to define, and
      inventing one would breach FX-1. Recorded in protocol.yaml as a declared
      absence rather than modelled.
  - name: "signed nonce"
    named_by: [rfc-8747#R-0065]
    why: >-
      Same declared absence: "the means of communicating the signed nonce is
      also not specified, as this is also protocol specific."
  - name: "audience restriction"
    named_by: [rfc-8747#R-0072]
    why: >-
      §4's SHOULD points at RFC 8392's `aud` claim, which this document does not
      define or constrain.
