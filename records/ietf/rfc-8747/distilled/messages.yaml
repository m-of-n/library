coverage:
  structures: 5
  fields: 20
  requirements_wired: 38
  quoted_evidence_pairs: 13
  quoted_evidence_note: 'each is the cited requirement''s OWN text, emitted from the id table, with the id immediately after the closing quote so bin/check-id-joins --quote-join can examine the pair rather than reporting zero coverage.'
  requirements_total: 118
  wiring_rule: 'a requirement is wired to a field only where it constrains that field''s PRESENCE, VALUE, TYPE, LENGTH, ENCODING or CARDINALITY - never where it merely mentions it. Every id was emitted from requirements.yaml by a selector that raises on zero or multiple matches, so no citation here was typed.'
  unwired_note: 'the requirements NOT wired here are the ones that constrain no structure: the role definitions, the two SAML analogies, section 3.5''s refusals, section 4''s security reasoning, section 5''s privacy advice, section 7''s registration procedure and section 7.2.1''s template fields. The template fields are wired in schema/confirmation-methods.derived.yaml instead, which is the artifact that models them.'
