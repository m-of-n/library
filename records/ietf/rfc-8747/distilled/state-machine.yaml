# NOT APPLICABLE, and the verdict is DERIVED rather than asserted. Measured
# whole-word and case-insensitively over all 683 lines:
#
#   state 0   states 0   lifecycle 0   transition 0   revoke 0
#   revocation 0   rotate 0   expire 0   expiry 0   expiration 0
#   issuance 0   step 0   steps 0
#
# Thirteen words at zero, each re-verified. The near misses, each checked:
#   `issue`        1  (line 415, "it does not issue another CWT" - §6's
#                      uniqueness advice, a constraint on the ISSUER's
#                      behaviour across CWTs, not a transition of any object)
#   `register`     4  and `registration` 13 OCCURRENCES ON 12 LINES (line 459
#                      carries it twice) - all §7's IANA procedure, the table of
#                      contents and the reference list, which is a process for
#                      the registry and not for a CWT
#   `order`        2  (lines 404, 458) - BOTH are "in order to"; not
#                      sequencing
#   `freshness`    1  (line 333) - inside §3.5's declaration that the means of
#                      demonstrating it are NOT specified
#
# AND THE DOCUMENT HAS NO LIFECYCLE TO MODEL FOR A SHARPER REASON than the
# word counts: the `exp` claim is RFC 8392's, and this document never
# constrains it. §6 does reason about "the lifetime of the CWTs", but it uses
# that lifetime as the WINDOW inside which an issuer must not reuse a Key ID -
# a constraint relating two CWTs to each other, not a sequence of states one
# CWT passes through. A confirmation key is fixed when the CWT is issued and
# nothing in these 683 lines changes it afterwards.
#
# The one place a reader might expect a machine is key-ID collision handling:
# §3.4 says recipients "should be prepared to handle such situations" and §6
# names impersonation as the consequence. Neither names a state, a trigger, a
# guard or a recovery, and the force words are lower case throughout - so
# there is nothing to model, and modelling it would be inventing the half of
# the document that is missing. Recorded in protocol.yaml's error_paths
# and in design-notes.md instead.
#
# THE STRONGEST CASE AGAINST THIS VERDICT, confronted rather than dismissed -
# raised by the cross-check pass, because the earlier wording rested on a scope
# restriction it never declared. docs/extraction.md's artifact table says the
# state machine is "for anything with lifecycle (REGISTRATION, receipt,
# verification)" - naming registration first. This file's near-miss note
# dismissed `register` 4 and `registration` 13 as "a process for the registry
# rather than for a CWT", which silently narrows the artifact to the document's
# primary data object; FX-1 does not narrow it that way. And §7 is 30 source
# lines and NINE requirements, R-0096 to R-0104, which between them describe
# something lifecycle-shaped: a request is submitted, reviewed for three weeks
# on cwt-reg-review@ietf.org on the advice of designated experts, and
# registered; a request undetermined beyond 21 days can be brought to IANA for
# resolution; an incomplete request or one duplicating existing functionality
# draws a request for corrections or a rejection; and values may be allocated
# before publication once the experts are satisfied the specification will be
# published. Four outcomes and two clocks.
#
# IT IS STILL NOT MODELLED, and the reason is now on the record so a later pass
# can attack THIS instead of the word counts:
#   1. no state is named. The document gives outcomes, not states, so every
#      state in such a machine would be this library's invention - which is
#      exactly what the paragraph above refuses to do for collision handling.
#   2. every verb is lower case: `should determine`, `should ask`, `may
#      approve`, `can be brought`, `It is suggested`. Under §2's "when, and
#      only when, they appear in all capitals" not one transition is mandated,
#      so the machine would have no normative edge in it at all. §7 carries
#      ZERO of the document's 8 BCP 14 keywords - measured.
#   3. it is not this document's procedure. It is RFC 8126's `Specification
#      Required` policy, which RFC 8747 parameterises with one mailing list
#      address and a 21-day escalation and nothing else (R-0097, R-0100).
#      Modelling it would model RFC 8126, which this library does not hold, and
#      would be copied verbatim into every record that registers anything.
#   4. it sequences nothing this document defines. The three confirmation
#      methods are fixed at publication by §7.2.2; a CWT, a `cnf` claim and a
#      confirmation key have no states in it.
# A reader who wants the registration procedure finds all nine requirements in
# requirements.yaml with their locators, and the registry itself as fields in
# schema/confirmation-methods.derived.yaml, including its `registration_policy`.

machines: []
states: []
transitions: []
error_states: []

not_applicable:
  reason: >-
    RFC 8747 defines no lifecycle. Thirteen lifecycle words occur zero times
    across all 683 lines, and the four near misses are an issuer-side
    uniqueness constraint, the IANA registry procedure, two uses of "in order
    to", and §3.5's refusal to specify freshness. A confirmation key is fixed
    at issuance and nothing in the document changes it. The `exp` claim that
    would give a CWT a lifetime belongs to RFC 8392 and is never constrained
    here; §6 uses "the lifetime of the CWTs" only as the window within which an
    issuer must not reuse a Key ID, which relates two CWTs rather than
    sequencing one.

    THE STRONGEST CASE AGAINST THIS VERDICT IS §7, and it is confronted in the
    comment above rather than dismissed, because docs/extraction.md names
    REGISTRATION first among the lifecycles this artifact is for and the
    earlier wording answered it only with "a process for the registry rather
    than for a CWT" - a scope restriction FX-1 does not make. §7 is 30 source
    lines and nine requirements (R-0096 to R-0104) describing four outcomes and
    two clocks. It is still not modelled, for four stated reasons: the document
    names no state, so every state would be ours; every verb is lower case and
    §7 carries ZERO of the document's 8 BCP 14 keywords, so no transition is
    mandated; the procedure is RFC 8126's `Specification Required` policy,
    which this document parameterises with one mailing list and a 21-day
    escalation and nothing else; and it sequences nothing this document
    defines, the three confirmation methods being fixed at publication by
    §7.2.2. Attack those four, not the word counts.
  measured: "whole-word, case-insensitive, over 683 lines, 0 form feeds"
  sibling_precedent: >-
    Sixteen of the 25 FX-1 records on this lane (topics cbor-implementation and
    canonical-encoding) declare this artifact not_applicable, counted from
    distillation.not_applicable across records/*/*/record.yaml. FIVE of them
    were read for their grounds, which fall into four distinct kinds -
    rfc-9804 names parsing, rfc-8949 the decode of a single data item, rfc-8610
    and rfc-9741 that matching is a predicate rather than a lifecycle, and
    rfc-9682 a transition period in the installed-tool population. The earlier
    wording of this field said "five records ... on three different grounds"
    while naming four, and read as though five were the whole set when they are
    a third of it. THIS record's ground is
    a fifth and is not any of those: it has a lifecycle-shaped SUBJECT - a key
    bound to a token, held by parties over time - and the document declines to
    give it states. The distinction is worth keeping rather than folding into
    the others, because a reader looking for prior art on key rotation will
    come here and find the absence, not an oversight.
