# NOT APPLICABLE, and the verdict is DERIVED rather than asserted. Measured
# whole-word and case-insensitively over all 683 lines:
#
#   state 0   states 0   lifecycle 0   transition 0   revoke 0
#   revocation 0   rotate 0   expire 0   expiry 0   expiration 0
#   issuance 0   step 0   steps 0
#
# Thirteen words at zero, each re-verified. The near misses, each checked:
#   `issue`        1  (line 415, "it does not issue another CWT" - §6's
#                      uniqueness advice, a constraint on the ISSUER's
#                      behaviour across CWTs, not a transition of any object)
#   `register`     4  and `registration` 13 OCCURRENCES ON 12 LINES (line 459
#                      carries it twice) - all §7's IANA procedure, the table of
#                      contents and the reference list, which is a process for
#                      the registry and not for a CWT
#   `order`        2  (lines 404, 458) - BOTH are "in order to"; not
#                      sequencing
#   `freshness`    1  (line 333) - inside §3.5's declaration that the means of
#                      demonstrating it are NOT specified
#
# AND THE DOCUMENT HAS NO LIFECYCLE TO MODEL FOR A SHARPER REASON than the
# word counts: the `exp` claim is RFC 8392's, and this document never
# constrains it. §6 does reason about "the lifetime of the CWTs", but it uses
# that lifetime as the WINDOW inside which an issuer must not reuse a Key ID -
# a constraint relating two CWTs to each other, not a sequence of states one
# CWT passes through. A confirmation key is fixed when the CWT is issued and
# nothing in these 683 lines changes it afterwards.
#
# The one place a reader might expect a machine is key-ID collision handling:
# §3.4 says recipients "should be prepared to handle such situations" and §6
# names impersonation as the consequence. Neither names a state, a trigger, a
# guard or a recovery, and the force words are lower case throughout - so
# there is nothing to model, and modelling it would be inventing the half of
# the document that is missing. Recorded in protocol.yaml's error_paths_why
# and in design-notes.md instead.

machines: []
states: []
transitions: []
error_states: []

not_applicable:
  reason: >-
    RFC 8747 defines no lifecycle. Thirteen lifecycle words occur zero times
    across all 683 lines, and the four near misses are an issuer-side
    uniqueness constraint, the IANA registry procedure, two uses of "in order
    to", and §3.5's refusal to specify freshness. A confirmation key is fixed
    at issuance and nothing in the document changes it. The `exp` claim that
    would give a CWT a lifetime belongs to RFC 8392 and is never constrained
    here; §6 uses "the lifetime of the CWTs" only as the window within which an
    issuer must not reuse a Key ID, which relates two CWTs rather than
    sequencing one.
  measured: "whole-word, case-insensitive, over 683 lines, 0 form feeds"
  sibling_precedent: >-
    Five CBOR/COSE records in this library at profile: full declare this
    artifact not_applicable, on three different grounds - rfc-9804 names
    parsing, rfc-8949 the decode of a single data item, rfc-8610 and rfc-9741
    that matching is a predicate rather than a lifecycle, and rfc-9682 a
    transition period in the installed-tool population. THIS record's ground is
    a fourth and is not any of those: it has a lifecycle-shaped SUBJECT - a key
    bound to a token, held by parties over time - and the document declines to
    give it states. The distinction is worth keeping rather than folding into
    the others, because a reader looking for prior art on key rotation will
    come here and find the absence, not an oversight.
