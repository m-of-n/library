usefulness:
  verdict: useful
  reason: "Upgraded from marginal 2026-10-20. Not read for the suite choice NG3 defers, but for what it says about keys: §2.1/§2.2 specify the HSS-LMS public-key octets that RFC 9679 §4.5 requires and does not cite; §3 offers a `kid` that is a field of the key (`I`); and §5 describes a namespace root with a counted lifetime and, deliberately, no private-key serialisation at all. It is also the second document to put an IANA allocation inside a post-quantum KeyId preimage, and it bounds rfc-9964's claim that DEC-003 option 1 escapes that — the HSS/LMS public key begins with two IANA parameter-set code points."
  assessed: "2026-10-20"
