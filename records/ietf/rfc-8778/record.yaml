relations:
  # Added 2026-10-20 while settling `bears_on` (library#39 Tier 2).
  #   rfc-9679 — the load-bearing edge, and it is the RFC 8230 situation
  #     again. RFC 9679 §4.5 requires `pub` (label -1, bstr) for an HSS-LMS
  #     thumbprint and cites NEITHER RFC 8778 NOR RFC 8554 — 0 occurrences of
  #     each in the document. RFC 8778 §6.3 is the registry entry that defines
  #     that label, and §2.1/§2.2 are the only specification of what the
  #     octets are. rfc-9679's open question 4 settled HSS-LMS by calling
  #     `pub` an opaque byte string "with no numeric interpretation, so there
  #     is nothing to normalise". That conclusion is right and the reason is
  #     not: `pub` is not opaque, it is a fixed-width structure, and THAT is
  #     why it needs no normalisation. This edge is what makes the citation
  #     reachable.
  #   rfc-8554 — [HASHSIG], the normative reference. Every parameter, registry
  #     and state rule this document relies on is defined there; the record is
  #     a stub.
  #   rfc-9964 — the other post-quantum COSE signature binding. See `bears_on`
  #     below: this document supplies a second independent instance of
  #     rfc-9964's Cut B and refutes that cut's escape clause.
  see_also:
    - rfc-8554
    - rfc-9679
    - rfc-9964
  part_of:
    - ietf-cose-wg
bears_on:
  # Resolved 2026-10-20 (library#39 Tier 2), from `bears_on: []` + verdict
  # `marginal`. The old reason — "algorithm suite is deferred by NG3; relevant
  # if post-quantum signing is admitted" — is true about the SUITE and is the
  # wrong axis. NG3 defers which algorithm we pick; it does not defer what a
  # key IS or how long a principal lives, and this document constrains both.
  # Each identifier is evidenced by locator:
  #   DEC-002 — a SECOND, INDEPENDENT instance of rfc-9964's Cut B, by a
  #     different mechanism, and it refutes that cut's escape clause. rfc-9964
  #     found that a post-quantum KeyId contains an IANA allocation (COSE `alg`
  #     -48/-49/-50) inside the digest preimage, and concluded that "An AKP
  #     `pub` is `alg`-independent" and therefore "for AKP keys `DEC-003`
  #     option 1 is immune to this hazard and option 2 ("COSE key thumbprint")
  #     is not". [corrected 2026-10-21, FX-1 pass 2: this quotation read "a raw
  #     `pub` is `alg`-independent, so DEC-003 option 1 is immune to this
  #     hazard and option 2 ('COSE key thumbprint') is not" — a sentence that
  #     occurs in NEITHER rfc-9964's current text NOR its own record of the
  #     superseded wording. It welded that record's retracted opening ("A raw
  #     `pub` is `alg`-independent, so", which its distilled/README.md
  #     preserves as superseded) to the corrected tail with "for AKP keys"
  #     removed, so it restored the over-general claim rfc-9964's correction
  #     block exists to retract. distilled/README.md and
  #     distilled/design-notes.md had it right throughout.] **For HSS/LMS the
  #     raw `pub` is not parameter-independent.** §2.2: the LMS public key is
  #     "u32str(lms_algorithm_type) || u32str(otstype) || I || T[1]", and §2.1
  #     makes that the HSS public key — "The public key for the topmost LMS
  #     tree is the public key of the HSS system." Both leading u32 values are
  #     IANA code points: §2.2 and §2.3 say [HASHSIG] "establishes an IANA
  #     registry to permit the registration of additional hash functions and
  #     additional tree sizes" and of "additional parameter sets". So the
  #     allocation sits in the KEY MATERIAL, where no choice of digest input
  #     can remove it — option 1 carries it, option 2 (RFC 9679 §4.5's
  #     `{kty: 5, pub}`) digests it, and rfc-9964's "digest (kty, pub) alone"
  #     escape digests it too. Registry-independence is unavailable for this
  #     principal under EVERY option, and for a harder reason than for ML-DSA.
  #     And the BOUND, which matters as much: the mechanism rfc-9964 named does
  #     NOT occur here. §3 makes `alg` conditional — "If the 'alg' field is
  #     present, it MUST be 'HSS-LMS'" — and RFC 9679 §4.5 requires only `kty`
  #     and `pub`, so the COSE Algorithms value -46 is not in the preimage. The
  #     dependence arrives from the LMS and LM-OTS parameter registries through
  #     the key octets, not from the COSE Algorithms registry through a map
  #     entry. rfc-9964's general proposition reproduces; its stated mechanism
  #     is AKP-specific.
  #     [Not byte-verifiable from this source: the document prints NO COSE_Key
  #     and no `pub` value — `kty` occurs exactly once, in §3's checklist. The
  #     layout is from §2.1/§2.2; the u32str type-code convention is confirmed
  #     in the printed signatures, whose octets 8..11 are `00000003` in both
  #     Appendix A examples. [corrected 2026-10-21, FX-1 pass 2] This sentence
  #     continued "= LMOTS_SHA256_N32_W8", which is wrong and which summary.md,
  #     distilled/examples/README.md and distilled/examples/vectors.yaml all
  #     already refuted while this comment kept it: the structural arithmetic
  #     fixes p = 67 for both signatures, and 67 is the w = 4 parameter count,
  #     so `00000003` cannot be the W8 code point. RFC 8778 prints no code
  #     point for any of its nine named parameter sets, so it supports NEITHER
  #     reading — what the printed octets confirm is the WIDTH, not the name.]
  #     Separately NOT claimed under DEC-002: both examples are tagged (98 and
  #     18) with the untagged form never printed. That is a third instance of
  #     rfc-9964's Cut A, not a new finding.
  #   DEC-003 — §3's fifth bullet is a sixth answer to "what is a KeyId", and
  #     the only one in the library where the identifier is a FIELD OF the key
  #     rather than a function of it: "If the 'kid' field is present, it MAY be
  #     used to identify the top of the HSS tree. In [HASHSIG], this identifier
  #     is called 'I', and it is the 16-byte identifier of the LMS public key
  #     for the tree." §2.2 puts `I` inside the public key and says "the same I
  #     value is used for all computations with the same LMS tree. The value I
  #     is also available in the public key." No digest, no canonicalisation,
  #     no agreement needed — and no binding either, since nothing proves the
  #     `kid` is this key's `I`. DEC-003's mandatory clause is "Must specify:
  #     canonical key bytes before hashing"; §2.1 + §2.2 ARE that
  #     specification for HSS/LMS — "u32str(lms_algorithm_type) ||
  #     u32str(otstype) || I || T[1]", with "The public key for the topmost LMS
  #     tree is the public key of the HSS system" — and RFC 9679 §4.5 requires
  #     those bytes without citing them (see `relations`).
  #   R-M-02 — "A principal MAY be identified solely by key or key digest."
  #     rfc-9964 made this a size trade: 1312-2592 octets to carry an ML-DSA
  #     key against 32 for its thumbprint. **For HSS/LMS the trade collapses.**
  #     §2.2's layout with m=32 ("supports only SHA-256 with m=32") and §3's
  #     16-byte `I` give a 56-octet public key (4 + 4 + 16 + 32) — 24 octets
  #     more than its own SHA-256 thumbprint. §1 says it in words: "The
  #     HSS/LMS signature algorithm uses small public keys, and it has low
  #     computational cost; however, the signatures are quite large", and
  #     Appendix A.2 measures the other side at 2512 octets of signature for a
  #     20-octet payload. So rfc-9964's "carry the Key, not the KeyId" is
  #     nearly free for this key type and the expense moves to the signature.
  #     [derived: the 56 is computed from §2.1/§2.2/§3, not printed — the
  #     document contains no COSE_Key example at all; `kty` occurs exactly
  #     once, in §3's checklist.]
  #   ARCH-0002 P1 — the finding no other record in this lane supplies, and
  #     the one that matters most. P1 roots every name in a key. §5 gives that
  #     root a COUNTED lifetime: "the number of signatures that can be
  #     generated is bounded by the size of the overall HSS set of trees. When
  #     all of the LM-OTS signatures have been used to produce a signature,
  #     then the establishment of a new trust anchor is required" — and the
  #     budget is not even exactly knowable, because "nodes are sacrificed to
  #     ensure that none are used more than once. As a result, the total number
  #     of signatures that can be generated might be less than the overall HSS
  #     set of trees." §5 then refuses to define a serialisation for the
  #     private key and its state, on purpose: "A COSE Key Type Parameter for
  #     encoding the HSS/LMS private key and the state about which tree nodes
  #     have been used is deliberately not defined. It was not defined to avoid
  #     creating the ability to save the private key and state, generate one or
  #     more signatures, and then restore the private key and state. Such a
  #     restoration operation provides disastrous opportunities for tree node
  #     reuse." A namespace root that cannot be backed up, replicated or
  #     migrated, and that retires by exhaustion rather than by policy.
  #     rfc-9964's open question — whether `KeyId` means "this key, now" or
  #     "this principal, across changes" — is deferrable for ML-DSA and is
  #     FORCED here.
  #   R-O-01 — "Every signed object SHALL have an issuer key that can be
  #     specified as KeyId." Under this algorithm that SHALL has a per-object
  #     price that no other candidate carries: §4, "An implementation MUST
  #     ensure that an LM-OTS private key is used to generate a signature only
  #     one time and ensure that it cannot be used for any other purpose", and
  #     "Along with the private key, the implementation MUST keep track of
  #     which leaf nodes in the tree have been used. Loss of integrity of this
  #     tracking data can cause a one-time key to be used more than once" —
  #     with "failed writes, virtual machine snapshotting or cloning" named as
  #     the ways it is lost. Every signed object consumes one leaf,
  #     irreversibly, and a crash between signing and state commit is a
  #     forgery risk rather than a retry.
  #   DEC-005 — §6.1 registers HSS-LMS as COSE `alg` -46 with "Recommended:
  #     Yes", so a stateful one-time-signature scheme is a RECOMMENDED COSE
  #     algorithm, and §3 states the COSE integration in five key checks and
  #     nothing more. Appendix A gives both a COSE_Sign (tag 98) and a
  #     COSE_Sign1 (tag 18) example, so both envelope shapes are exercised.
  #     The cost side is operational rather than cryptographic and is in §5:
  #     admitting this algorithm means a signer that cannot be backed up,
  #     replicated or migrated, and a finite signature budget per key.
  - DEC-002
  - DEC-003
  - DEC-005
  - R-M-02
  - R-O-01
  - ARCH-0002 P1
topic: cbor-implementation
tags:
  - signatures
  - key-management
  - ietf
  - evidence
distillation:
  # FX-1 PASS 1 OF 3 ONLY. `standard` is required whenever `distillation` is
  # present (docs/extraction.md, #73); `profile` is deliberately ABSENT, because
  # an unfinished extraction is neither `full` nor `partial` and the gate says
  # so. Pass 1 (extract) ran 2026-10-20 at effort max; verify and cross-check
  # have NOT run, no reviewed_by is signed, and `status` stays `summarized`.
  #
  # WHAT PASS 1 PRODUCED: 135 requirements with the keyword counts reconciled
  # exactly (9 = 9), 20 byte-exact verbatim source renderings, 7 schema files
  # (1 verbatim + 6 derived), 11 message structures with 35 fields and
  # `constrained_by` wired on 30 of them, 11 example vectors and 4 byte
  # fixtures with both of the document's stated sizes reproduced, an APPLICABLE
  # two-machine state model, and design notes carrying six cuts against MD-3.
  # distilled/README.md is the index and states what pass 2 should attack.
  #
  # ON THE UNVERIFIABLE-HERE IDENTIFIERS: DEC-002, DEC-003, DEC-005, R-M-02,
  # R-O-01 and ARCH-0002 P1 are defined in `mofn` documents this library does
  # not hold - it is standalone by design (CLAUDE.md) - so their quotations
  # cannot be checked from this repository. distilled/design-notes.md states
  # that rather than implying it, following records/ietf/rfc-9741 and
  # records/ietf/rfc-9964. Every FINDING here is measured against
  # .cache/rfc-8778.txt.
  standard: "FX-1"
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: >-
        Every normative sentence of the Abstract, §1-§6 and Appendix A with its
        locator, INCLUDING §1.1's motivation, which the file now carries with the
        judgement visible: four of its eight sentences are entries R-0010 to
        R-0013 and four have no entry, like the Abstract and the §1.2 recital,
        and all eight are quoted. (Pass 2, 2026-10-21, found §1.1 absent from
        normative.md altogether with nothing saying so, while this sentence
        claimed every normative sentence of §1-§6; its sentence-level sweep
        resolved 137 of 143 units before the fix and 141 of 143 after, the two
        residuals being the Appendix A diagnostic blocks this record carries in
        pieces.) Plus 25 FENCED BLOCKS that are byte-exact runs of source lines -
        every bullet list, all five `can be summarized as` concatenation
        renderings, §3's five COSE-key checks, §4's state paragraph, the whole of
        §5 and all three IANA registration templates - each with its line range
        and the sha256 of the region's lines joined by "\n". FOUR LINE-BREAK
        SEVERANCES DECLARED AND NOT HEALED (source lines 84-85 hash-based, 85-86
        and 117-118 HSS/LMS, 373-374 brute-force), quoted exactly as the
        normalised source renders them so nothing is truncated either. The
        Abstract and the §1.2 BCP 14 recital appear here with NO requirements
        entry and the file says why. Nine source observations, three of which
        cost a reader something.
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: >-
        135 entries R-0001 to R-0135 in source order, no gaps: 9 `stated` (8
        MUST, 1 MAY) and 126 `inferred` with the carrying phrase named in
        `field`. source_keyword_count and extracted_keyword_count both 9 and
        reconciled at length. THE FINDING IS WHERE THE NINE ARE: all of them in
        §3 (5) and §4 (4), and NOT ONE in §2, §5 or §6 - the data model, the
        whole lifecycle and all three registrations. 135/135 texts are
        contiguous substrings of the whitespace-normalised source and 135/135
        locators resolve inside their stated section (bin/check-locators: 0
        misfiled, 0 unresolvable). NO ENTRY'S TEXT IS OUR OWN WORDING: the
        derived quantities this record is read for - the 56-octet public key,
        the 4-octet u32str width, p=67 and h=10, the 2512-octet signature - are
        in messages.yaml, schema/ and examples/ instead, each citing the R-ids
        it was derived from. Four lowercase near-misses are entries with the
        lowercase form named, two of them (§4's `must` and §5's `required`)
        carrying more weight than some of the nine.
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: >-
        1 verbatim + 6 derived. RFC 8778 SHIPS NO GRAMMAR OF ANY KIND - `ABNF`,
        `ASN.1` and `JSON Schema` each occur zero times and `CDDL` once, in the
        title of the RFC 8610 entry in the INFORMATIVE references - so
        source-renderings.txt is not a grammar: it is the document's 20
        structural renderings, cut by line range and never retyped, each with
        its own sha256. The six derived files carry `.derived.` and agree with
        their headers: three CDDL (the 56-octet public key, the kty 5 COSE_Key
        with RFC 9679 §4.5's thumbprint input over it, both Appendix A envelope
        shapes), one ABNF byte grammar for the four flat octet layouts, one
        JSON Schema (`$id: urn:library:rfc-8778:hss-lms-public-key.derived`) and
        one parameter-set table. 14 CDDL rules across three files, 13 distinct,
        every referenced rule defined and no prelude collision; 21 ABNF rules,
        closed. schema/README.md carries the full width derivation INCLUDING THE
        ONE WIDTH NO DOCUMENT IN THIS LIBRARY HOLDS STATES: `u32str` = 4
        octets, measured in two legs - the only width in {1, 2, 8} that makes
        the printed 2512-octet signature an integer number of 32-octet
        elements, and the only width consistent with the printed octets
        (u32str(0) at offset 0, the leaf number q at offset 4). Pass 2
        (2026-10-21) corrected "the only width" here: the divisibility test
        alone holds for every u = 4 mod 8. Records the three gaps the
        renderings leave: no width, no code point for any of the nine named
        parameter sets, and no value of p.
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: >-
        11 structures, 35 fields, with octet offsets for the flat layouts and
        encoded sizes plus CBOR head bytes for the five CBOR ones, every one
        computed with an RFC 8949 encoder written for this pass: the 56-octet
        public key, the subordinate key, all three signature layers, both HSS
        signature forms, the kty 5 COSE_Key, RFC 9679 §4.5's thumbprint input,
        and both Appendix A envelopes. `constrained_by` IS WIRED: 30 of 35
        fields carry at least one rfc-8778#R-NNNN, 43 distinct ids cited, 0
        dangling. THE FIVE EMPTY LISTS ARE A FINDING - every one is an RFC 8152
        field this document does not constrain, so the binding adds three
        registry entries, constrains five fields of a key, and contributes
        nothing to the envelope. Also records what cannot be constrained: the
        private key (no format exists), a `kid`'s relation to I (nothing binds
        it), and leaf-usage state (required and unformatted).
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: >-
        APPLICABLE, and declared so against a word count that points the other
        way. `lifecycle`, `revoke`, `rotate`, `expire` and `exhaust` each occur
        ZERO times, and eight requirements in six groups define a lifecycle anyway: R-0097
        (keep track of which leaf nodes have been used), R-0101 (one-time use),
        R-0098 (loss of tracking integrity causes reuse), R-0111 (the signer
        maintains state across invocations), R-0109/R-0110 (a counted budget
        with a terminal condition) and R-0115/R-0116 (the deliberately undefined
        private-key-and-state encoding). TWO MACHINES: one LM-OTS leaf, 4 states
        and 4 transitions, and the HSS key / trust anchor, 5 states and 6
        transitions, with 2 error states that have NO WAY OUT, 2
        `forbidden_transitions` and 5 explicitly `unspecified` behaviours. The
        sharpest of the five is the one a protocol model would have carried: the
        ORDERING between emitting a signature and committing the state change,
        which R-0112 defers to [HASHSIG] §9.2 and which fails differently each
        way round.
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: >-
        11 vectors V-0001 to V-0011 and 4 byte fixtures, under a THREE-WAY
        provenance convention: `printed`, `derived`, and `template` - new here,
        for a structure the source specifies with no value anywhere in it. BOTH
        STATED SIZES REPRODUCE EXACTLY: re-encoding the printed diagnostic
        notation under RFC 8949 gives 2560 and 2552 octets, matching R-0133 and
        R-0135, and both re-encoded messages decode fully to tag 98 and tag 18
        with a 2512-octet signature byte-identical to a fresh cut from the
        source. Both signatures parse against the document's own renderings with
        nothing left over. THE u32str WIDTH IS MEASURED HERE. One POSITIVE TEST
        of R-0061 that passes - A.1 is leaf 1 and A.2 leaf 0 of one tree, so
        their authentication paths must agree above the leaf, and 9 of 10 nodes
        are byte-identical - and two NEGATIVE observations: both signatures
        carry the same C, and both use a six-octet `kid` where §3 suggests the
        16-octet I. NOTHING WAS SYNTHESISED: no cryptographic verification is
        possible because the document prints no key, and V-0009 and V-0010 are
        templates rather than vectors with elided values.
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: >-
        The three-leg reproduces / refutes / bounds result against rfc-9964,
        re-derived from the source rather than inherited; DEC-003's sixth answer
        to "what is a KeyId" and the only one where the identifier is a FIELD OF
        the key; R-M-02's inverted size trade with both halves measured;
        ARCH-0002 P1's namespace root with a counted lifetime and no backup
        format, and the NameCert regress that follows; R-O-01's per-object
        price; DEC-005's recommended stateful algorithm; R-M-12, R-O-03 and
        topics/canonical-encoding's conditions (1)-(6) plus rfc-9679's own
        condition (0), one by one, with (0) DISCHARGED for kty 5 and (5) and (6)
        inert; SIX CUTS AGAINST MD-3, each naming the DEC-002 option it moves,
        of which two support the narrowing and are labelled as such; one
        [inference] about replicated and threshold signers with no R-id
        asserted; seven open questions; the sibling records re-derived and not
        edited; and the nine source defects. Marks every `mofn` quotation as
        unverifiable from this standalone repository.
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: >-
        RFC 8778 defines a byte string and five conditions on a key. It defines
        no protocol, and the measurement is written out in protocol.yaml rather
        than the conclusion asserted: `protocol`, `exchange`, `handshake`,
        `negotiate`, `verifier`, `sender`, `recipient`, `party`, `parties`,
        `role`, `flow`, `step`, `procedure`, `response`, `client`, `server` and
        `issuer` each occur ZERO times in its 772 lines; `signer` occurs 3 times
        (lines 91, 159, 394) and none is a role in a flow; `request` once (line
        6, the masthead). §3's five checks are preconditions in the PASSIVE
        VOICE with no actor and no failure action ("the following checks are
        made", R-0085). NEITHER SIGNING NOR VERIFICATION IS SPECIFIED: both are
        cited to [HASHSIG] by section (§3.3, §4.4, §4.5, Appendix B, §9.2), and
        `validation` occurs once while `validate` occurs zero times. And the
        document NEVER SAYS WHERE THE SIGNATURE OCTETS GO: `Sig_structure` 0,
        `tag` 0, `header` 0, with §3 R-0081 saying only that it "makes use of
        the signature with appendix scheme for hash-based signatures". The
        envelope is RFC 8152's and only the non-normative Appendix A shows it.
        THE ORDERING A SEQUENCE DIAGRAM WOULD HAVE CARRIED IS RECORDED UNDER
        `unspecified` IN state-machine.yaml, which is APPLICABLE, rather than
        invented as a flow here.
  passes:
    - pass: extract
      by: "claude-opus-5 (single agent, run alone: HSS-LMS shares no dependency chain with the other unstarted records)"
      effort: max
      date: "2026-10-20"
      note: >-
        135 requirements (9 stated / 126 inferred, 9 = 9 reconciled), 25 fenced
        source regions in normative.md and 20 in schema/source-renderings.txt,
        every one cut programmatically by line range, 7 schema files, 11
        message structures with 35 fields, 11 vectors with 4 byte fixtures, a
        two-machine state model, six MD-3 cuts. MECHANICAL RESULTS:
        bin/check-locators 135 checked / 0 misfiled / 0 unresolvable; a quote
        audit over every artifact, 225 quotations against ten corpora with 0 not
        verbatim in any of them; an id join audit resolving every cited id to
        its requirement's text, 127 of 135 cited outside requirements.yaml with
        0 dangling and 0 foreign-id collisions; bin/check-id-joins --resolve 468
        citations / 0 dangling and --surface 0 duplicate-text groups, so no two
        requirements share identical text and a wrong id cannot match the quoted
        words; every YAML artifact round-trips through BOTH library readers,
        which agree on every nested value and not merely on the top-level keys -
        re-checked after the five bin/_yaml.py truncation fixes landed mid-pass,
        with no wrapped flow sequence, no wrapped quoted scalar outside a block
        scalar, no inline flow map and no column-zero sequence item anywhere in
        this record's YAML. VERIFIED BY COMPUTATION
        rather than by reading: both of the document's stated example sizes
        reproduce exactly (2560 and 2552 octets) with a CBOR encoder written for
        this pass and no CBOR, COSE or HSS/LMS library; both signatures parse to
        2512 octets against the document's own concatenation renderings; and THE
        u32str WIDTH, WHICH NO DOCUMENT THIS LIBRARY HOLDS STATES, IS PINNED AT
        4 OCTETS - as the only width in {1, 2, 8} making the printed signature
        an integer number of 32-octet elements, and as the only width
        consistent with the printed octets. (Pass 2, 2026-10-21, corrected the
        original "the only width": the divisibility leg alone holds for every
        u = 4 mod 8 and was stated as uniqueness in six places.)
        THREE DEFECTS IN THIS PASS'S OWN WORK,
        found by those checks and not by eye: an artifact bin/_record_yaml.py
        could not parse (caught by bin/validate), a quotation SPLICED ACROSS TWO
        DIFFERENT DOCUMENTS (docs/extraction.md and the extract skill, caught by
        the quote audit's longest-prefix test), and two elided quotations marked
        with "...". All three are recorded in distilled/README.md.
        RE-DERIVED AND NOT EDITED: the 2026-10-20 narrowings in
        records/ietf/rfc-9964 and records/ietf/rfc-9679, both of which stand,
        with one addition this record can make and they could not - the two
        u32str widths they treat as given from the notation's name are now
        pinned by measurement.
    - pass: verify
      by: "claude-opus-5 (independent of pass 1; did not extract)"
      effort: max
      date: "2026-10-21"
      note: >-
        ADVERSARIAL, reading only .cache/rfc-8778.txt and the artifacts, with
