note: >-
  RFC 8778 DEFINES NO PROTOCOL, and this file records the measurement rather than
  asserting the conclusion. It registers one algorithm identifier, one key type
  and one key type parameter, restates enough of [HASHSIG] to make a byte string
  parseable, and states five conditions on a COSE key. Nothing is exchanged
  between anybody.

  WORD COUNTS OVER ALL 772 LINES, as whole words, case-insensitively, with the
  lines where they occur. `protocol` 0, `exchange` 0, `handshake` 0, `negotiate` 0,
  `verifier` 0, `sender` 0, `recipient` 0, `party` 0, `parties` 0, `role` 0,
  `flow` 0, `step` 0, `procedure` 0, `response` 0, `client` 0, `server` 0,
  `issuer` 0. THREE NEAR-MISSES AND NONE OF THEM IS A ROLE IN A FLOW: `signer`
  occurs 3 times - line 91 ("when the signer is willing to perform additional
  computation at signing time"), line 159 ("when needed by the signer") and line
  394 ("the signer maintains state across different invocations"), the last of
  which is an operational rule and not a flow; `request` occurs ONCE, at line 6,
  in the RFC masthead ("Request for Comments: 8778"); and `subject` occurs once,
  at line 41, in the copyright boilerplate.

  THERE IS NOT EVEN A ONE-SIDED PROCEDURE TO MODEL, AND THE DOCUMENT IS CAREFUL
  ABOUT IT. §3 rfc-8778#R-0085 says "When using a COSE key for this algorithm,
  the following checks are made:" - PASSIVE, no actor, and no failure action for
  any of the five. §3 rfc-8778#R-0084 says the type codes "indirectly provide all
  of the information that is needed to parse the byte string during signature
  validation", which names validation without specifying it; `validation` occurs
  exactly once in the document, in that sentence, and `validate` 0 times. No
  signing algorithm and no verification algorithm is given: both are [HASHSIG]'s,
  cited by section (§2.1 rfc-8778#R-0030 cites [HASHSIG] §3.3, §2.3
  rfc-8778#R-0071 cites §4.4 and rfc-8778#R-0079 cites §4.5, §2.3 rfc-8778#R-0072
  cites Appendix B, §5 rfc-8778#R-0112 cites §9.2).

  AND IT NEVER SAYS WHERE THE SIGNATURE GOES. `Sig_structure` occurs 0 times, the
  word `tag` 0 times and `header` 0 times. §3 rfc-8778#R-0081 says only that the
  specification "makes use of the signature with appendix scheme for hash-based
  signatures". The COSE envelope is RFC 8152's, and the only place RFC 8778 shows
  the signature inside one is the non-normative Appendix A (messages.yaml S-0009
  to S-0011, examples/vectors.yaml V-0001 and V-0002). See
  records/ietf/rfc-9052 for the envelope this document predates and
  records/ietf/rfc-9964, whose extraction reached the same conclusion about a
  sibling binding.

  WHAT THIS RECORD CARRIES INSTEAD, and where. THE ORDERING THAT WOULD HAVE BEEN
  THIS FILE'S CONTENT IS IN state-machine.yaml, WHICH IS *APPLICABLE*: §4 and §5
  specify a lifecycle for a leaf and for the trust anchor, with a terminal
  condition and an error condition. What they do NOT specify is the ordering
  between emitting a signature and committing the state change -
  rfc-8778#R-0112 defers it to "Section 9.2 of [HASHSIG]" - and that unspecified
  ordering is exactly the thing a sequence diagram would have shown. It is
  recorded under `unspecified` in state-machine.yaml rather than invented here.

