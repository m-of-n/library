source_digest: "2d43646b974c76b9e13565af9b96432ac2b7ba39b66a61820d97f94f3cf1c398"
source_keyword_count: 9         # bin/bcp14-count .cache/rfc-8778.txt --by-keyword: 8 MUST, 1 MAY
extracted_keyword_count: 9      # recomputed and checked by bin/validate
reconciliation: >-
  THE COUNTS AGREE EXACTLY, AND A RECONCILIATION IS WRITTEN ANYWAY because 135 entries
  against 9 keywords needs explaining, and because 9 keywords in a Standards Track algorithm
  binding is itself a finding. bin/bcp14-count reports 9 all-capitals BCP 14 occurrences in
  the 772-line source (8 MUST, 1 MAY) and the 135 entries below carry exactly those 9, each
  exactly once. Verified mechanically over the entry texts with boilerplate=False, which is
  what bin/validate recomputes.

  WHERE THE 9 ARE: IN TWO SECTIONS, AND NOWHERE ELSE. §3 carries 5 - four MUSTs and the
  single MAY, one per bullet of the COSE-key checklist: R-0086 (kty MUST be HSS-LMS), R-0087
  (alg MUST be HSS-LMS IF PRESENT), R-0088 (key_ops MUST include sign when signing), R-0089
  (key_ops MUST include verify when verifying), R-0090 (kid MAY identify the top of the HSS
  tree). §4 carries the other 4 MUSTs: R-0095 (protect the private keys), R-0097 (keep track
  of which leaf nodes have been used), R-0100 (generate each LMS key pair independently),
  R-0101 (an LM-OTS private key is used only once and for nothing else). NOT ONE KEYWORD IS
  IN §2 - the whole data model - OR §5 - the whole lifecycle - OR §6 - all three
  registrations.

  THE DOCUMENT'S REAL NORMATIVE BASELINE IS FIVE CONCATENATION FORMULAS AND THREE
  REGISTRATION TEMPLATES, AND NONE OF THEM CARRIES A KEYWORD. What an implementer must obey
  lives in (i) §2.1/§2.2/§2.3's `can be summarized as` renderings - R-0027, R-0029, R-0053,
  R-0062, R-0079 - which are the only specification of the HSS-LMS public key and signature
  octets anywhere in COSE, R-0053 above all; (ii) §6.1-§6.3's three registration templates,
  R-0119 to R-0128, which are where alg -46, kty 5 and pub at label -1 are actually fixed,
  and not a keyword among them; (iii) §5's ten sentences on the counted lifetime and the
  deliberately undefined private-key encoding, R-0108 to R-0117; and (iv) §3's own
  non-keyword sentences, R-0080 to R-0085, fixing the scheme and the parse model. 126 of 135
  entries are therefore kind: inferred, and each names in `field` the phrase that carries
  the force instead. This is the shape rfc-9964 and rfc-9053 both found: the hardest
  constraints in a COSE algorithm binding are not BCP 14.

  ONE MUST GOVERNS TWO OBLIGATIONS AND IS DELIBERATELY NOT SPLIT. R-0101 (§4) states
  single-use AND no-other-use under one keyword. Splitting it would have produced a second
  entry with verb MUST and no keyword in its text, breaking the 1:1 keyword map; both
  obligations are named in `field` and modelled as separate transitions in
  state-machine.yaml. THREE OTHER SENTENCES ARE SPLIT, into their two contiguous clauses,
  because each half is separately testable and neither half is spliced: R-0047/R-0048 (§2.2,
  I is the private key identifier / the same I is used for all computations with the same
  tree), R-0050/R-0051 (§2.2, the T[r] definition / the node indexing), and R-0091/R-0092
  (§3, the identifier is called I / it is the 16-byte identifier of the LMS public key).
  Each whole sentence appears in normative.md.

  FOUR LOWERCASE NEAR-MISSES, NOT COUNTED, AND TWO OF THEM MATTER MORE THAN SOME OF THE
  NINE. R-0099 (§4) says "failed writes, virtual machine snapshotting or cloning, and other
  operational concerns must be considered" with LOWERCASE `must` at source line 360 - the
  document's sharpest operational hazard is in a non-normative voice inside a paragraph
  whose other two sentences carry MUSTs. R-0110 (§5) says "the establishment of a new trust
  anchor is required" with LOWERCASE `required` at line 391 - the only terminal lifecycle
  condition in the document carries no keyword. R-0096 and R-0104 use lowercase `may`. Each
  entry's note names the lowercase form.

  THE §1.2 BCP 14 BOILERPLATE IS DELIBERATELY NOT AN ENTRY. Source lines 126-130 recite all
  eleven keywords and constrain nothing; bin/validate counts entry texts with
  boilerplate=False, so including it would have added 11 phantom keywords and broken this
  reconciliation. It is quoted in normative.md instead. The Abstract, lines 16-20, is
  likewise in normative.md with no entry: its scope sentence restates §1's, which R-0001
  carries, and quoting both would double-count the scope.

  FOUR DECLARED LINE-BREAK SEVERANCES, NOT HEALED. The plain-text wrap cuts a token in two
  at source lines 84-85 (`hash-based`), 85-86 (`HSS/LMS`), 117-118 (`HSS/LMS`) and 373-374
  (`brute-force`). Each affected sentence is quoted EXACTLY as the whitespace-normalised
  source renders it - `hash- based`, `HSS/ LMS`, `brute- force` - so nothing is healed and
  nothing is truncated, and each entry's note declares the severance: R-0004, R-0005,
  R-0013, R-0104. The 85-86 severance falls inside the document's first statement of the
  finite signature budget.

  NO ENTRY'S TEXT IS OUR OWN WORDING. All 135 texts are contiguous spans of the
  whitespace-normalised source, verified by script against .cache/rfc-8778.txt, and all 135
  locators resolve inside the section they claim (bin/check-locators: 135 checked, 0
  misfiled, 0 unresolvable).

  RE-MEASURED BY PASS 2 (VERIFY), 2026-10-21, INDEPENDENTLY AND AT EFFORT MAX. 135/135 texts
  are contiguous spans of the normalised source AND each occurs in it EXACTLY ONCE, so no
  entry's text can be satisfied by a different sentence. 135/135 locators now name the
  INNERMOST section containing the text: pass 1 filed R-0132 to R-0135 at `Appendix A` when
  they live in A.1 and A.2, which bin/check-locators passes because A contains A.1, and
  pass 2 moved them. 9 = 9 recomputed with bin/_bcp14 the way bin/validate does; the nine are
  at source lines 330, 332, 334, 337, 340 (§3) and 352, 354, 362, 365 (§4) and nowhere else -
  the only other all-capitals occurrences in the source are the eleven in the §1.2 recital at
  lines 126-128, which strip_boilerplate removes and which is deliberately not an entry. No
  keyword reaches an entry from a quoted reference: this document names [HASHSIG] 27 times
  and quotes no normative text from it. The four declared severances are the ONLY four
  mid-token wraps in the source body (the other two are URLs in §7.2), and each is
  characterised correctly - the wrap cuts after the hyphen or slash, which stays, and a space
  is inserted. Every bare R-/V-/S- reference in this record resolves - the form
  bin/check-id-joins does not collect - with 0 DANGLING. No total is recorded for them: the
  count includes references in prose that cites ids, so it moves with any edit; the 0 does
  not.

  THE QUANTITIES THIS RECORD IS READ FOR ARE DERIVED AND ARE
  THEREFORE NOT IN THIS FILE: the 56-octet public key, the 4-octet width of a u32str field,
  p=67 and h=10 for the Appendix A parameter set, and the 2512-octet signature. They live in
  messages.yaml (byte layouts), schema/ (the derived grammars) and examples/vectors.yaml
  (the measurements), each marked derived and each citing the R-ids it was derived from.
  Putting a derived sentence in `text` would have made it unverifiable against the source,
  which is the one property this file exists to guarantee.
reviewed_by: ""
note: >-
  Ids are stable and never reused. Cite as rfc-8778#R-NNNN.

  PASS 1 of the FX-1 extraction (extract), run alone at effort max on 2026-10-20. No pass 2
  and no pass 3 have run; every reviewed_by in this directory is empty and no profile is
  claimed.

  `text` is the source's own wording with whitespace normalised: line breaks and the RFC's
  double sentence spacing become single spaces, and inside the §6 registration templates the
  field lines do too. Every `text` is a contiguous substring of the whitespace-normalised
  source, verified by script and never by eye. distilled/normative.md carries byte-exact
  fenced runs of source lines for every bullet list, concatenation rendering and
  registration template, each with its line range and its own sha256.

  `kind: stated` marks the 9 entries whose text carries a BCP 14 keyword. `kind: inferred`
  marks the other 126: the text is verbatim, but the obligation is not literally stated AS
  an obligation, so `verb` is `none` and `field` names the phrase that carries the force.
  This is rfc-9964's convention, followed deliberately - that record is the closest analogue
  in this library and is at profile: full.

  THIS DOCUMENT DEFINES NO PROTOCOL AND PRINTS NO KEY. Measured as whole words,
  case-insensitively, over all 772 lines: `protocol`, `exchange`, `verifier`, `sender`,
  `recipient`, `handshake`, `negotiate`, `lifecycle`, `revoke`, `rotate`, `expire`,
  `exhaust`, `thumbprint`, `canonical`, `deterministic`, `COSE_Key`, `Sig_structure`,
  `header` and `tag` each occur ZERO times. `kty` occurs exactly once (R-0086, §3's
  checklist) and `pub` exactly once as a word (R-0127, §6.3's registration). THERE IS NO
  COSE_Key AND NO `pub` VALUE ANYWHERE IN THE DOCUMENT, so no HSS-LMS COSE Key Thumbprint is
  computable from it - see examples/README.md and design-notes.md.

  WHAT IS STATEFUL IS NOT NOT-APPLICABLE. `state` occurs four times as a word plus
  `statefulness` once, all inside §4-§5, and R-0097 (keep track of which leaf nodes have
  been used), R-0101 (one-time use), R-0109/R-0110 (the counted budget and its terminal
  condition), R-0111 (the signer maintains state across invocations) and R-0115/R-0116 (the
  deliberately undefined private-key-and-state encoding) are between them a lifecycle.
  state-machine.yaml models it; it is not declared not_applicable.

  DISPOSITIVE FOR records/ietf/rfc-9679, which is at profile: full and whose §4.5 requires
  `kty` and `pub` for an HSS-LMS COSE Key Thumbprint while citing NEITHER RFC 8778 NOR RFC
  8554. R-0024 (§2.1, the HSS public key IS the topmost LMS public key), R-0053 (§2.2, the
  LMS public-key layout), R-0039 (§2.2, m=32), R-0049 (§2.2, I is in the public key), R-0092
  (§3, I is 16 bytes), R-0124/R-0125 (§6.2, kty 5) and R-0127/R-0128 (§6.3, pub at label -1,
  CBOR type bstr) are between them the entire specification of the octets RFC 9679 §4.5
  digests. R-0087 (§3, alg is CONDITIONAL on presence) is why COSE alg -46 is NOT in that
  preimage. R-0046 and R-0077 - the LMS and LM-OTS parameter registries - are why two IANA
  code points are.

  ALSO DISPOSITIVE FOR records/ietf/rfc-9964, which is at profile: full. Its design notes
  were narrowed on 2026-10-20 on the strength of R-0053 and R-0087; this extraction does not
  edit that record and reports its re-derivation in design-notes.md.

