# rfc-8778 - parameter sets, and what RFC 8778 does and does not fix about them
# DERIVED - not verbatim. RFC 8778 prints the ten names below and NOT ONE
# numeric code point, and no value of p. This table separates what the document
# states from what this extraction measured, and leaves the rest open.
#
# Source: RFC 8778, sha256 2d43646b974c76b9e13565af9b96432ac2b7ba39b66a61820d97f94f3cf1c398
# Derived 2026-10-20, FX-1 pass 1 (extract).
record: rfc-8778
reviewed_by: ""

the_gap: >-
  RFC 8778 §2.2 lists five LMS tree sizes by name (rfc-8778#R-0041 to #R-0045)
  and §2.3 lists four LM-OTS variants by name (#R-0073 to #R-0076), and it
  prints NO code point for any of the nine. Its own Appendix A then prints two
  signatures containing the code points 00000003 (otstype) and 00000006
  (lms_algorithm_type). SO THE DOCUMENT CANNOT RESOLVE ITS OWN EXAMPLES: there
  is no mapping in RFC 8778 from either number to any of the nine names. §3
  (#R-0083, #R-0084) nonetheless says the byte string "is designed for easy
  parsing" and that it includes "counters and type codes that indirectly provide
  all of the information that is needed to parse the byte string during signature
  validation". True of [HASHSIG]; not true of this document. Recorded as a source finding in normative.md observation 8.

what_this_extraction_recovered_instead: >-
  The PARAMETERS are recoverable from RFC 8778 alone even though the NAMES are
  not. §2.2 #R-0062, §2.3 #R-0079 and §2.1 #R-0027 give the exact concatenation;
  §2.2 #R-0039 fixes m=32 and §2.3 #R-0066 fixes n=32; so a printed signature of
  L octets satisfies L = 4u + 32 + 32(p + h) with u the u32str width. For
  L = 2512 only u = 4 yields an integer, giving p + h = 77, and only h = 10
  (p = 67) puts a small integer at the resulting u32str(type) offset - 00000006
  at offset 2188 - with a trailing 320 octets = exactly h = 10 path nodes
  (#R-0060). So the Appendix A parameter set is h = 10, p = 67, w = 4 by
  [HASHSIG]'s Appendix B table, and the NAME of neither code point is knowable
  from RFC 8778.

# h and m are read off each name and confirmed by §2.2 #R-0036 (the five h
# values) and #R-0039 (m=32); `leaves` is 2^h per §2.2 #R-0037.
lms_tree_sizes:        # §2.2, rfc-8778#R-0041..#R-0045. Code points NOT printed.
  - name: LMS_SHA256_M32_H5
    h: 5
    m: 32
    leaves: 32
    code_point: "not printed by RFC 8778"
  - name: LMS_SHA256_M32_H10
    h: 10
    m: 32
    leaves: 1024
    code_point: "not printed by RFC 8778"
  - name: LMS_SHA256_M32_H15
    h: 15
    m: 32
    leaves: 32768
    code_point: "not printed by RFC 8778"
  - name: LMS_SHA256_M32_H20
    h: 20
    m: 32
    leaves: 1048576
    code_point: "not printed by RFC 8778"
  - name: LMS_SHA256_M32_H25
    h: 25
    m: 32
    leaves: 33554432
    code_point: "not printed by RFC 8778"

# w and n are read off each name and confirmed by §2.3 #R-0069 (the four w
# values) and #R-0066 (n=32). §2.3 #R-0072 defers every p to Appendix B of
# [HASHSIG], so only the one this extraction could measure is filled in.
lm_ots_variants:       # §2.3, rfc-8778#R-0073..#R-0076. Code points and p NOT printed.
  - name: LMOTS_SHA256_N32_W1
    w: 1
    n: 32
    p: "not given by RFC 8778"
    code_point: "not printed by RFC 8778"
  - name: LMOTS_SHA256_N32_W2
    w: 2
    n: 32
    p: "not given by RFC 8778"
    code_point: "not printed by RFC 8778"
  - name: LMOTS_SHA256_N32_W4
    w: 4
    n: 32
    p: 67
    p_provenance: "MEASURED from Appendix A, not cited - see what_this_extraction_recovered_instead"
    code_point: "not printed by RFC 8778"
  - name: LMOTS_SHA256_N32_W8
    w: 8
    n: 32
    p: "not given by RFC 8778"
    code_point: "not printed by RFC 8778"

public_key_length:
  octets: 56
  invariant_over: "all 5 x 4 = 20 combinations RFC 8778 admits"
  derivation: "4 (u32str lms_algorithm_type) + 4 (u32str otstype) + 16 (I) + 32 (T[1])"
  cites:
    - rfc-8778#R-0053
    - rfc-8778#R-0024
    - rfc-8778#R-0039
    - rfc-8778#R-0052
    - rfc-8778#R-0092
    - rfc-8778#R-0049
    - rfc-8778#R-0028
  not_future_proof: >-
    §2.2 #R-0046 and §2.3 #R-0077 both say [HASHSIG] establishes an IANA
    registry for additional hash functions, tree sizes and parameter sets. A
    registered m other than 32 changes T[1] and therefore the total.

signature_length:
  formula: "4*u32str_count + n + n*p + m*h, with u32str_count = 4, n = m = 32"
  appendix_a:
    octets: 2512
    p: 67
    h: 10
    nspk: 0
    both_examples: true
    provenance: "measured, examples/vectors.yaml"
  range_over_admitted_sets: >-
    Not computable from RFC 8778, because p is not given for three of the four
    LM-OTS variants (#R-0072). What IS computable: for any fixed p the length
    grows by 32 octets per unit of h, and the five admitted h values span
    5..25, so a 640-octet spread exists within one LM-OTS variant.
