# RFC 8778 PRINTS TWO COMPLETE COSE MESSAGES AND NOT ONE KEY, AND BOTH MESSAGES
# REPRODUCE TO THE BYTE.
#
# That is the headline. The document states only the SIZE of each example - "The
# size of binary file is 2560 bytes" (rfc-8778#R-0133) and "2552 bytes"
# (rfc-8778#R-0135) - and prints the rest as extended CBOR diagnostic notation
# (rfc-8778#R-0130). Re-encoding that notation under RFC 8949 gives exactly 2560
# and 2552 octets. Both signatures are 2512 octets and both parse cleanly against
# the document's own concatenation renderings.
#
# AND THE LIMIT, STATED FIRST BECAUSE IT BOUNDS EVERYTHING BELOW. RFC 8778 prints
# NO COSE_Key and no `pub` value anywhere: `COSE_Key` occurs 0 times in its 772
# lines, `kty` exactly once (§3's checklist) and `pub` exactly once as a word
# (§6.3's registration template). SO NO HSS-LMS PUBLIC KEY AND NO HSS-LMS COSE
# KEY THUMBPRINT IS COMPUTABLE FROM ANY DOCUMENT THIS LIBRARY HOLDS. V-0009 and
# V-0010 are therefore TEMPLATES with their value fields empty, not vectors with
# values elided - the difference matters and is spelled out in README.md. NOTHING
# IN THIS FILE IS SYNTHESISED: no key was invented to fill the gap.
#
# WHAT WAS DONE, AND WITH WHAT. A CBOR encoder and decoder (RFC 8949 §3 and
# §4.2.1) written for this pass over the standard library alone. NO CBOR, COSE,
# CWT OR HSS/LMS LIBRARY WAS USED. Both printed protected buckets were decoded
# and re-encoded byte-identically, and both whole messages were assembled from
# the diagnostic notation and measured against the document's stated sizes.
#
# WHAT WAS NOT DONE, AND CANNOT BE. No signature here is cryptographically
# verified. Verifying an LMS signature requires the public key - specifically I
# and T[1] - and the document prints neither. An LMS verifier recomputes a
# candidate root from the signature and the message, which needs I as a hash
# input; without it there is nothing to compare against. This is a hard limit of
# the source, not of the pass. Contrast records/ietf/rfc-9964, whose six
# signatures the verify pass could check because it prints the keys.
#
# PROVENANCE CONVENTION, as rfc-9964's and rfc-8392's vectors use it:
#   source: printed   - every byte of the value appears in RFC 8778 itself.
#                       `reproduced` says what this pass recomputed and whether
#                       it matched.
#   source: derived   - every byte is printed by the source, but the ASSERTION
#                       the vector makes is this extraction's (a parse, a
#                       measurement, a re-encoding).
#   source: template  - the STRUCTURE is specified by the source and NO VALUE
#                       EXISTS in it. Not a fixture; a statement of what a
#                       fixture would have to contain.
#
# `locator` gives the section, the exact line range in .cache/rfc-8778.txt and
# the sha256 of that run of lines joined by "\n" with no trailing newline, so any
# value here can be re-cut from the source without trusting this file. The RFC
# hard-wraps its hex blocks for display; the only transformation applied is
# joining those lines. Page decoration falls inside none of these ranges.
#
# WHY THE HEX IS HERE AT ALL. FX-1's examples artifact is "every example in the
# source as a fixture file, plus expected results; this is what drives our tests"
# (docs/extraction.md), and the skill asks for "hex for binary"
# (.claude/skills/extract/SKILL.md). records/ietf/rfc-9964 and
# records/ietf/rfc-8392 both carry their sources' printed vectors the same way. Two 2512-octet values carried as fixtures with
# expected results is not a copy of a 772-line document: the document is not in
# this repository and .cache/ is gitignored.

