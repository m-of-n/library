  - id: V-0008
    name: "NEGATIVE OBSERVATION - the document's own kid ignores the document's own suggestion"
    locator: "§3 (rfc-8778#R-0090, #R-0092) against Appendix A; source lines 340-342, 582, 676"
    source: printed
    values:
      kid_in_both_examples: "'ItsBig'"
      kid_hex: "497473426967"
      kid_octets: 6
      encoded_entry: "04 46 497473426967"
    expected:
      rfc_8778_says: "it is the 16-byte identifier of the LMS public key for the tree. (rfc-8778#R-0092)"
      required_octets_if_suggestion_taken: 16
      measured_octets: 6
      is_the_suggestion_taken: false
      conformance: "conforming - rfc-8778#R-0090 is a MAY, and nothing binds a kid to I"
    reproduced: >-
      Measured: six ASCII octets in both examples, against §3's 16. So §3's `kid`
      suggestion - the sixth answer to "what is a KeyId" that this record
      contributes - has NO worked instance anywhere in RFC 8778. Anyone adopting
      it is the first.
    note: >-
      And nothing in the document binds a `kid` to the key's actual I, so a
      mismatch is unconstrained and unobservable: there is no check to write. See
      design-notes.md under DEC-003.

