  # =========================================================================
  - id: V-0003
    name: "A.1 signature - 2512 octets, parsed against the document's own renderings"
    locator: "Appendix A, §A.1; source lines 584-658"
    region_sha256: "3c35e4702d0106d04d3aecfbb0c2a9b06c5fa40246e69a9ee5a4ef327163cc89"
    source: printed
    octets: 2512
    structure: S-0005
    parsed:
      Nspk: 0
      q: 1
      otstype: 3
      otstype_name: "NOT RESOLVABLE FROM RFC 8778 - no code point is printed for any of its four LM-OTS variants"
      C: "91291de76ce6e24d1e2a9b60266519bc8ce889f814deb0fc00edd3129de3ab9b"
      y_count: 67
      lms_algorithm_type_offset: 2188
      lms_algorithm_type: 6
      lms_algorithm_type_name: "NOT RESOLVABLE FROM RFC 8778 - no code point is printed for any of its five tree sizes"
      path_nodes: 10
      path_offset: 2192
    expected:
      total_octets: 2512
      structure_closes: true
      derivation: >-
        RFC 8778's own formulas (rfc-8778#R-0027, #R-0062, #R-0079) give the
        length as 4u + n + n*p + m*h with four u32str fields, and rfc-8778#R-0039
        and #R-0066 fix m = n = 32. 2512 - 4u - 32 is divisible by 32 for u = 4
        and for no other u in {1, 2, 8} - the test alone holds for every
        u = 4 mod 8, so it bounds the width without pinning it, and what pins
        u = 4 is the printed octets: octets 0..3 of BOTH signatures are
        00000000, which is rfc-8778#R-0027's u32str(0) for a stand-alone tree,
        and the two first differ at octet 7, the leaf number q (1 against 0).
        Corrected 2026-10-21, FX-1 pass 2. That gives p + h = 77; of the five h values
        rfc-8778#R-0036 admits, only h = 10 (p = 67) puts a small integer at the
        resulting type-code offset - 00000006 at offset 2188 - with exactly 320
        trailing octets = 10 path nodes as rfc-8778#R-0060 requires.
      u32str_width_octets: 4
      p: 67
      h: 10
      lm_ots_signature_octets: 2180
      lms_signature_octets: 2508
    reproduced: >-
      THE u32str WIDTH IS MEASURED HERE, NOT CITED. RFC 8778 never defines
      `u32str` (rfc-8778#R-0028 defers the notation to [HASHSIG]), and this
      vector is the only place in the document from which the width can be
      recovered. 4 octets - see `derivation` above for both legs; the
      divisibility leg alone does not give uniqueness.
    note: >-
      THIS RECORD'S OWN EARLIER CLAIM IS REFUTED BY THIS VECTOR, and it was
      still live in record.yaml until FX-1 pass 2 (2026-10-21) removed it; no
      other record in the library ever carried it, so the words "a sibling
      lane's" here and in examples/README.md were wrong. The claim read octets
      8..11 - 00000003 - as LMOTS_SHA256_N32_W8. The structural arithmetic says p = 67,
      and 67 is the parameter count of the w = 4 variant, not w = 8 (which has
      p = 34 and would make the signature 1136 + 32h octets, never 2512). So
      00000003 cannot be the W8 code point.
      [FLAGGED 2026-10-21, FX-1 pass 3: that last step rests on RFC 8554 Appendix
      B's table - "67 is the w = 4 count" and "w = 8 has p = 34" are its figures,
      not this document's, and records/ietf/rfc-8554 is a STUB WITH NO
      content.sha256 AND NO CACHED BYTES. Neither figure is checkable from this
      repository, and bin/fetch-source cannot make it so: with an empty digest it
      has nothing to verify fetched bytes against, and that record's content.url
      is the HTML page rather than the .txt rendering FX-1 needs. The 67 ITSELF is
      measured here from the printed bytes - 67 thirty-two-octet y elements
      between C and the type code - so only the w-NAMING of it is unverifiable.]
      What RFC 8778 itself supports is
      weaker still and is the real finding, and it needs no second document: the
      document prints NO code point for
      any of its nine named parameter sets, so neither 00000003 nor 00000006 is
      resolvable to a NAME from this document at all - not to W8, and not to W4
      either. The PARAMETERS are
      recoverable; the names are not.

