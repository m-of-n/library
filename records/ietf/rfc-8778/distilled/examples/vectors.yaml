      a2_path_0: "7b95de445abf89161dff4b91a4a9e3bf156a39a4660f98f06bf3f017686d9dfc"
      shared_path_1: "362c948646b3c9848803e6d9ba1f7d3967f709cddd35dc77d60356f0c3680890"
      shared_path_9: "a415e291fd107d21dc1f084b1158208249f28f4f7c7e931ba7b3bd0d824a4570"
    reproduced: >-
      All ten nodes of each path cut at offset 2192 and compared pairwise. 9 of
