  # =========================================================================
  - id: V-0010
    name: "TEMPLATE - RFC 9679 §4.5's thumbprint input, 62 octets, digest not computable"
    locator: "§6.2 (rfc-8778#R-0124) and §6.3 (rfc-8778#R-0127); RFC 9679 §4.5 selects the parameters"
    source: template
    octets: 62
    structure: S-0008
    template:
      prefix_hex: "a20105205838"
      prefix_decoded: "map(2) || 1 || 5 || -1 || bstr(56)"
      then: "<56 octets of pub, per V-0009>"
      total: 62
      entry_order: "1 (0x01) then -1 (0x20), bytewise per RFC 8949 §4.2.1 as RFC 9679 §3 step 2 requires"
    expected:
      keyid_octets: 32
      keyid_algorithm: "SHA-256 (RFC 9679 §3 step 3; §8 registers `ckt` as COSE Key SHA-256 Thumbprint)"
      byte_identical_to_minimal_cose_key: true
      digest_computable_from_any_document_this_library_holds: false
      key_minus_thumbprint_octets: 24
      minimal_cose_key_minus_thumbprint_octets: 30
    reproduced: >-
      THE TEMPLATE IS EXACT AND THE DIGEST IS UNAVAILABLE. The six prefix octets
      were produced by an RFC 8949 §4.2.1 encoder written for this pass, and the
      62 is arithmetic on them plus V-0009's 56. Measured alongside it: the
      MINIMAL HSS-LMS COSE_Key - kty and pub and nothing else - is BYTE-IDENTICAL
      to this thumbprint input, which is the same property rfc-9964 found for
      AKP. A thumbprint input is not a reduced form of an HSS-LMS key; it is the
      whole public key plus two octets of map framing.
    note: >-
      CROSS-RECORD. RFC 9679 §4.5 requires exactly `kty` (label 1, int, value 5)
      and `pub` (label -1, bstr) and cites NEITHER RFC 8778 NOR RFC 8554 for what
      the `pub` octets are; §2.1 and §2.2 of RFC 8778 are the only specification
      of them anywhere. COSE `alg` -46 is NOT in this preimage, because §3 makes
      `alg` conditional on presence (rfc-8778#R-0087) and RFC 9679 §4.5 does not
      require it. See records/ietf/rfc-9679 (profile: full) and design-notes.md.

