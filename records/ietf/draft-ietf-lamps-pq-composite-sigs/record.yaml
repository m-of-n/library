usefulness:
  verdict: useful
  reason: "The PKIX world's answer to the post-quantum transition for X.509: one OID per ML-DSA+traditional pair, verified with AND semantics, so the PQ path for certificates is 'replace the algorithm', not 'change the protocol'. That is the shape any X.509 import (R-I-05) will meet, and its key-reuse and revocation-by-hash caveats (section 9.3) bear on what a KeyId over a composite key means."
