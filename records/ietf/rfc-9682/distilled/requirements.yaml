    verb: 'none'
    actor: 'reader of this specification'
    locator: "Acknowledgments"
    text: 'In one of the ensuing discussions, Doug Ewell proposed defining an ABNF rule "NONASCII", of which we have included the essence.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The one rule that carries the entire surrogate and C1 fix for SCHAR, BCHAR and PCHAR came from outside the authorship, and the document says so. Not normative; extracted because provenance of a load-bearing rule is exactly what R-O-03 is about.'
