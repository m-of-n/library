reconciliation: 'RFC 9682 contains ZERO all-capitals BCP 14 keyword occurrences in 28 KB, and bin/bcp14-count reports 0. That is not a measurement error, not a stripping artifact and not a thin document: RFC 9682 IS A GRAMMAR-CORRECTING DOCUMENT, so its normativity is carried by THE ABNF IT REPLACES and by THE PROSE THAT SAYS WHAT IT REPLACES. The document says as much structurally. It has exactly one normative appendix; that appendix''s entire prose is two sentences, "This appendix is normative." and "It provides the full ABNF from [RFC8610] as updated by the present document." (rfc-9682#R-0068, rfc-9682#R-0069); and its force comes from one sentence in Section 1 - "the updated collected ABNF syntax in Figure 11 in Appendix A replaces the collected ABNF syntax in Appendix B of [RFC8610]." (rfc-9682#R-0005). There is no BCP 14 boilerplate paragraph anywhere: Section 1.1, "Conventions and Definitions", is TWO SENTENCES long and both are extracted here (rfc-9682#R-0006, rfc-9682#R-0007). THE ZERO IS A TRUE ZERO AND NOT AN ARTIFACT: bin/bcp14-count reports 0 with boilerplate stripping both ON and OFF. THE FULL CENSUS OF BCP-14-SHAPED WORDS IN THE SOURCE IS EIGHT OCCURRENCES, ALL LOWER CASE, and each was inspected: ''must'' once (source line 48, the Copyright Notice''s "Code Components extracted from this document must include Revised BSD License text" - boilerplate, and not a rule about CDDL); ''recommended'' once (line 114, extracted as rfc-9682#R-0013); ''should'' three times (line 133 as rfc-9682#R-0015, line 187 as rfc-9682#R-0024, line 191 as rfc-9682#R-0027); ''required'' once (line 169 as rfc-9682#R-0021); ''optional'' once (line 353, an ADJECTIVE describing the dot in "the number given after the optional dot", inside an aside, carrying no force); and ''should'' a fourth time (line 360, a COUNTERFACTUAL REGRET inside the same aside, which opens "maybe a different character" on line 359 and closes "than the dot should have been chosen for this special" on line 360, so it crosses the aside prefix and is quoted here only in halves - and which carries no force either and falls outside every quoted span in this file). ''shall'' does not appear. WHAT WAS COUNTED INSTEAD, and extracted here as kind: inferred, every entry naming in its `field` the phrase, figure or production that carries the force and stating that no BCP 14 keyword backs it: (a) THE REPLACEMENT ITSELF - Section 1''s replacement clause (rfc-9682#R-0005), which is the whole of this document''s normative effect, together with Appendix A''s two self-declaring sentences; (b) EVERY FIGURE THAT STATES A CHANGE, as the sentence that introduces it - Figure 2 (rfc-9682#R-0019), Figure 4 (rfc-9682#R-0028), Figure 8 (rfc-9682#R-0042) and Figure 10 (rfc-9682#R-0049); (c) BOTH FIGURE CAPTIONS THAT CLAIM AN EFFECT ON RFC 8610 APPENDIX C (rfc-9682#R-0043, rfc-9682#R-0050) - this document reproduces RFC 8610''s Appendix B and none of its Appendix C, so that half of two updates is stated in a caption and NOWHERE ELSE, which is why two captions are extracted as requirements; (d) EVERY DEFINITION OF WHAT A CONSTRUCT DENOTES - the three head-number ranges (rfc-9682#R-0051, rfc-9682#R-0052, rfc-9682#R-0053), the \u{hex} form''s meaning as a Unicode scalar value (rfc-9682#R-0018), and the byte-wise identity of the six Figure 5 literals (rfc-9682#R-0034), which is the document''s own acceptance criterion for Section 2; (e) EVERY EXPLICIT DISCLAIMER OF CAPABILITY, because what the document declines to constrain is as load-bearing for us as what it does - "there is no attempt to further exclude non-printable characters from the ABNF" (rfc-9682#R-0029), "CDDL text strings do not use UTF-16 or surrogates" (rfc-9682#R-0016), "This cannot currently be expressed in CDDL" (rfc-9682#R-0047) and "This document has no IANA actions." (rfc-9682#R-0067); (f) THE LOWER-CASE FORCE WORDS THE DOCUMENT DOES USE, ELEVEN DISTINCT ONES ACROSS FOURTEEN ENTRIES - ''need to be applied'' (Section 2), ''recommended'' (Section 2), ''should'' (Section 2.1.1 once, Section 2.1.2 twice), ''is also required'' (Section 2.1.1), ''needs to'' (Section 2.1.1, Section 3.1), ''requires'' (Section 3.1), ''has to'' (Section 3.1), ''may'' (Section 2.2), ''need to'' (Section 4), ''are advised to'' (Section 4), ''need to be'' (Appendix B.2); and (g) FOUR PRODUCTIONS OF THE NORMATIVE APPENDIX A THAT THE DOCUMENT CARRIES OVER UNCHANGED AND NEVER MENTIONS - `CRLF = %x0A / %x0D.0A` (rfc-9682#R-0070), `bsqual = "h" / "b64"` (rfc-9682#R-0071), `memberkey`''s cut (rfc-9682#R-0072) and `grpent`''s own "; preempted by above" comment (rfc-9682#R-0073). Each is extracted with the production line itself as its verbatim `text`, because for a grammar document a production IS a normative statement, and because these four are the ones this record exists to answer: they are the bare-LF CRLF, the two-prefix bsqual, the cut that RFC 8610''s Table 1 omits, and the dead alternative the grammar documents about itself. THE OTHER FIFTY-ONE PRODUCTIONS OF FIGURE 11 ARE DELIBERATELY NOT INDIVIDUAL ENTRIES: they are held byte-exact as the schema artifact distilled/schema/cddl-updated.abnf, one unbroken region with a per-region sha256, and listing each as a requirement would inflate the count without adding a fact. NO OBLIGATION WAS INVENTED AND NO COUNT WAS INFLATED. source_keyword_count and extracted_keyword_count are both 0 and therefore agree. The precedents are the sibling records rfc-8610 (2 keywords in 125 KB, 137 of 139 entries inferred) and draft-ietf-cbor-edn-literals (10 keywords in 168 KB, 205 of 215 inferred), and for the same reason: CDDL''s normativity is a grammar, not a set of obligations laid on an actor. TWO QUOTATION HAZARDS, BOTH FOUND MECHANICALLY AND NEITHER HEALED. First, source lines 162-165 and 342-362 are set as ASIDES with every line prefixed "      |", so normalising whitespace across one interleaves "|" into the text and no sentence spanning two of its lines is a contiguous span of this document; the three entries that quote an aside (rfc-9682#R-0020, rfc-9682#R-0056, rfc-9682#R-0057) REPRODUCE THE "|" PREFIXES in their `text` and say so in their `field`, rather than remove them. Second, TWO END-OF-LINE WORD BREAKS fall inside prose: line 329 ends "the head-" with line 330 beginning "number", and line 669 ends "copying-" with line 670 beginning "and-pasting". The two entries affected (rfc-9682#R-0052, rfc-9682#R-0084) carry the OBLIGATION-BEARING HALF as `text`, open their `field` with "SEVERED QUOTE." and quote the severed half there verbatim. No span in this file is spliced from two non-adjacent parts of the document and no break is silently repaired. ONE SOURCE DEFECT FALLS INSIDE A QUOTED SPAN AND IS REPRODUCED UNREPAIRED: source line 355, inside rfc-9682#R-0057, closes the phrase "additional information" with U+201D although it opens it with U+0022. It is the only non-U+0022 quotation mark in the 699 lines of the source, and the same phrase at line 333 (rfc-9682#R-0053) is correctly paired.'
