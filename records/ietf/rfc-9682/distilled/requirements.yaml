  - id: "rfc-9682#R-0011"
    object: 'the relationship between these changes and deployed CDDL tools'
    field: 'no BCP 14 keyword backs this; this document contains none. the force is an intent claim about IMPLEMENTATIONS, not about the language - the changes "are intended to mirror the way existing implementations have dealt with the errata reports"'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2"
    text: 'These changes are intended to mirror the way existing implementations have dealt with the errata reports.'
    kind: inferred
