    note: 'VERIFIED VERBATIM AND IT IS THE WHOLE OF IT. `bsqual = "h" / "b64"` is carried into Figure 11 unchanged, so CDDL has exactly two byte-string prefixes after this document. [EDN-LITERALS] is cited as "Work in Progress, Internet-Draft, draft-ietf-cbor-edn-" with "literals-13" on the next line: the draft name is itself severed by an end-of-line hyphen at source line 430/431, so the quotable half stops there and the full name is given unquoted as draft-ietf-cbor-edn-literals-13. For us this means a test vector written with any prefix other than h or b64 is valid EDN and is NOT a CDDL literal - the conclusion the rfc-8610 record reached from the other direction when it found Appendix G.2 naming four prefixes against §3.1''s two.'
