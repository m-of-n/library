    field: 'no BCP 14 keyword backs this; this document contains none. the force is the defect verdict "rather permissive", attached to the figure that follows; Figure 1''s own caption calls the old SESC the one "(Which Did Not Allow Hex Escapes)"'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.1.1"
    text: 'The ABNF used in [RFC8610] for the content of text string literals is rather permissive:'
    kind: inferred
