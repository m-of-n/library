    object: 'the relationship between CDDL''s and EDN''s string-literal processing'
    field: 'no BCP 14 keyword backs this; this document contains none. the force is a statement of near-identity with one named difference - the processing "is quite similar for both", "except that CDDL has end-of-line comments that are ";" based and EDN has two comment syntaxes"'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "Appendix B.2"
    text: '(Note that, at the time of writing, the processing of string literals is quite similar for both CDDL and Extended Diagnostic Notation (EDN), except that CDDL has end-of-line comments that are ";" based and EDN has two comment syntaxes: one in-line "/" based and one end-of-line "#" based.)'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The one sentence in this document that compares CDDL and EDN directly, and it is the reason a shared lexer for both is nearly but not quite possible. Bears on #39''s assignment of the test-vector role to EDN.'
  - id: "rfc-9682#R-0087"
    object: 'the provenance of the `NONASCII` rule'
