note: |
  Ids are stable and never reused. Cite as rfc-9682#R-NNNN.
  Entries are in source order by section, then by position within the section;
  ids run from R-0001 with no gaps.
  KIND. Every entry is `inferred`. There are no `stated` entries because the
  document contains no all-capitals BCP 14 keyword at all - see `reconciliation`.
  `inferred` here does NOT mean the text is paraphrased: every `text` in this
  file is a single contiguous verbatim span of RFC 9682, mechanically checked.
  This follows the convention of records/ietf/rfc-8610/distilled/requirements.yaml
  and records/ietf/draft-ietf-cbor-edn-literals/distilled/requirements.yaml.
  VERB. There is no upper case anywhere. A lower-case verb reproduces the
  source's own force-word ('requires', 'needs to', 'has to', 'should',
  'recommended', 'need to', 'need to be', 'need to be applied',
  'is also required', 'are advised to', 'may'); `none` means the sentence
  carries no force-word at all and its normativity is definitional - a
  replacement, a figure, a definition of what a construct denotes, or an
  explicit absence.
  CONTIGUITY. Every `text` was checked as a contiguous substring of the
  whitespace-normalised source, and every locator was checked by SECTION RANGE
  rather than document-wide: both the first and the last line of every span lie
  inside the line range of the section the locator names. 87 of 87 pass. This
  document has NO page frames - no form feed, no running head, no '[Page n]'
  footer in 699 lines - so no span crosses one and none needed repair. The two
  genuine hazards are the aside prefixes and the two word breaks, both declared
  in `reconciliation` and in the affected entries' own `field`.
  ACTOR. RFC 9682 has no protocol roles, so `actor` names the party a
  constraint falls on in practice: `CDDL tool implementer` for a grammar or
  process rule, `CDDL parser` for a rule about what a construct denotes or what
  the grammar admits, `CDDL specification author` for a drafting rule,
  `reader of this specification` for a statement about the document, and `IANA`
  for the one sentence of Section 5.
  CONSTRAINED CONSTRUCTS. distilled/messages.yaml carries no `constrained_by`
  key, for the same reason the sibling rfc-8610 record omits it: with zero
  keyword occurrences there is no honest way to tie a construct to an id, and
  inventing one is the failure FX-1 exists to prevent. The join that IS honest
  is by section, and it is stated in messages.yaml's own `locator_join` block.

requirements:
  - id: "rfc-9682#R-0001"
    object: 'the definition of CDDL as of this document'
    field: 'no BCP 14 keyword backs this; this document contains none. the force is a composite definition stated as fact - CDDL is "as defined in RFCs 8610 and 9165", so neither document alone defines it'
    verb: 'none'
    actor: 'reader of this specification'
    locator: "Abstract"
    text: 'The Concise Data Definition Language (CDDL), as defined in RFCs 8610 and 9165, provides an easy and unambiguous way to express structures for protocol messages and data formats that are represented in Concise Binary Object Representation (CBOR) or JSON.'
    kind: inferred
    testable: 'no'
    testable_reason: 'a statement of what CDDL is for; no mechanical criterion'
    status: active
    note: 'The Abstract names RFC 9165 as co-definitional with RFC 8610. This record''s `relations.updates` names rfc-8610 only, because that is the Updates: header; rfc-9165 is a sibling in library#39 Tier 2.'
