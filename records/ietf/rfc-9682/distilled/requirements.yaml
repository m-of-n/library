  - id: "rfc-9682#R-0015"
    object: 'a backslash escape in a text string literal under RFC 8610'
    field: 'no BCP 14 keyword backs this; this document contains none. the force is a stated omission plus a lower-case "should" borrowed from RFC 8610 - the sentence says the old grammar "critically misses out on" them, and the JSON hex forms "should apply here according to item 6 of Section 3.1 of [RFC8610]"'
    verb: 'should'
    actor: 'CDDL tool implementer'
    locator: "§2.1.1"
    text: 'This allows almost any non-C0 character to be escaped by a backslash, but critically misses out on the \uXXXX and \uHHHH\uLLLL forms that JSON allows to specify characters in hex (which should apply here according to item 6 of Section 3.1 of [RFC8610]).'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Two defects in one sentence: too permissive, and missing the two JSON hex forms. Both are fixed by the one replacement of SESC.'
  - id: "rfc-9682#R-0016"
    object: 'the \uHHHH\uLLLL escape form and the CDDL text string data model'
    field: 'no BCP 14 keyword backs this; this document contains none. the force is an explicit DISCLAIMER - "CDDL text strings do not use UTF-16 or surrogates" - which fixes that the pair form is a spelling, not a representation'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.1.1"
    text: '(Note that CDDL imports from JSON the unwieldy \uHHHH\uLLLL syntax, which represents Unicode code points beyond U+FFFF by making them look like UTF-16 surrogate pairs; CDDL text strings do not use UTF-16 or surrogates.)'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Load-bearing for the surrogate fix: high-surrogate and low-surrogate exist in the new grammar ONLY as a pair inside hexchar, and denote a code point above U+FFFF. A LONE surrogate is unreachable by any path - checked against all four hexscalar branches in distilled/schema/grammar-gaps-status.derived.txt, G-32.'
  - id: "rfc-9682#R-0017"
    object: 'the SESC rule'
