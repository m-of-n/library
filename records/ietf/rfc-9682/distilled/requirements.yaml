  - id: "rfc-9682#R-0018"
    object: 'the escape syntax of a CDDL string literal'
    field: 'no BCP 14 keyword backs this; this document contains none. the force is a definition of the new form''s meaning - "\u{hex}, where hex is the hexadecimal representation of the Unicode scalar value"'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.1.1"
    text: 'This document uses the opportunity to add a popular form of directly specifying characters in strings using hexadecimal escape sequences of the form \u{hex}, where hex is the hexadecimal representation of the Unicode scalar value.'
    kind: inferred
    testable: 'yes'
    status: active
    note: '"Unicode scalar value" is the term that excludes surrogates by definition, and the new hexscalar/non-surrogate rules implement exactly that. The grammar caps at 10FFFF; `\u{110000}` is refused.'
  - id: "rfc-9682#R-0019"
    object: 'the SESC rule of RFC 8610 Appendix B'
    field: 'no BCP 14 keyword backs this; this document contains none. the force is the figure itself, which this sentence introduces and whose caption is "Update to String ABNF in Appendix B of [RFC8610]: Allow Hex Escapes", operating through §1''s replacement clause'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.1.1"
    text: 'The result is the new set of rules defining SESC in Figure 2.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'FIGURE 2, source lines 145-157, held verbatim at distilled/schema/updates.abnf. SIX of the eight new productions are defined here: SESC (replaced), hexchar, non-surrogate, high-surrogate, low-surrogate, hexscalar, HEXDIG1. The new SESC is a CLOSED set of exactly eight single-character escapes plus the mandatory \u family, against the 1,114,077 single-character escapes RFC 8610 admitted.'
  - id: "rfc-9682#R-0020"
    object: 'the case sensitivity of the quoted strings in the new rules'
    field: 'no BCP 14 keyword backs this; this document contains none. the force is a statement of fact about ABNF, that its quoted strings are case "insensitive, as is intended here" (the asides own words, quotable only from line 163 because the clause opens on line 162), plus the stated reason for using %x62 rather than %s"b". THE "|" CHARACTERS ARE THE RFC''S OWN ASIDE PREFIX, reproduced rather than removed: every line of source lines 162-165 begins "      |", so no sentence spanning two of its lines is a contiguous span of this document and the aside cannot be flowed into prose'
    verb: 'none'
    actor: 'CDDL tool implementer'
    locator: "§2.1.1"
    text: '| Notes: In ABNF, strings such as "A", "B", etc., are case | insensitive, as is intended here.  The rules above could have | also used %s"b", etc., instead of %x62, but didn''t, in order to | maximize compatibility with ABNF tools.'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'The consequence the aside does not draw: inside SESC the escape LETTER is case-SENSITIVE (%x62, %x6E, %x75 are numeric, so \B, \N, \U are errors) while the hex DIGITS of a payload are quoted and stay case-INSENSITIVE. Figure 5 exercises both in one file (\u{1F073} and \u{6f}). [RFC7405] is a normative reference of this document and is named here only to say it was not used.'
  - id: "rfc-9682#R-0021"
    object: 'the BCHAR rule (Figure 3: bytes, BCHAR, bsqual as RFC 8610 had them)'
    field: 'no BCP 14 keyword backs this; this document contains none. the force is the lower-case "is also required", made necessary by the SESC restriction'
    verb: 'is also required'
    actor: 'CDDL tool implementer'
    locator: "§2.1.1"
    text: 'Now that SESC is more restrictively formulated, an update to the BCHAR rule used in the ABNF syntax for byte string literals is also required:'
    kind: inferred
    testable: 'yes'
    status: active
    note: 'Figure 3 (source lines 171-174) is the superseded text, held verbatim at distilled/schema/rfc8610-originals.abnf. It is also where this document prints `bsqual = "h" / "b64"` for the first time - the rule it then carries into Figure 11 UNCHANGED.'
  - id: "rfc-9682#R-0022"
