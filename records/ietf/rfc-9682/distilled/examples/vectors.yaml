# =====================================================================
# rfc-9682 test vectors -- every example RFC 9682 prints.
#
# Each `cddl:` and `instance:` block is lifted from the cached source by
# LINE RANGE, by script, never retyped. The only transformation is
# removal of the common left margin (a YAML block scalar does that in
# any case) and re-indentation for YAML; relative indentation inside a
# block, the source's own comments, its blank lines and its trailing
# comment column are the source's.
#
# THIS DOCUMENT HAS NO PAGE FRAMES - no form feed, no running head, no
# '[Page n]' footer in 699 lines - so EVERY block below is a SINGLE
# UNBROKEN SOURCE LINE RUN. None joins two non-adjacent ranges and none
# needed repair. The complete audit trail of ranges lifted is at the
# foot of this file under `source_ranges`.
#
# EXPECTATIONS ARE AGAINST THE GRAMMAR IN FORCE (Figure 11), i.e.
# ../schema/cddl-updated.abnf. Where a vector's status under RFC 8610's
# grammar differs, the vector's `notes` says so and marks the reading
# OURS. One vector is `invalid` and it is THE SOURCE'S OWN NEGATIVE -
# no negative here is invented.
#
# WHAT IS VERBATIM AND WHAT IS OURS, stated exactly, because the two
# are mixed inside single entries:
#
#   `cddl`      ALWAYS VERBATIM. 6 are multi-line blocks lifted by line
#               range (V-0001, V-0002, V-0010, V-0013, V-0014, V-0015);
#               9 are single source lines lifted the same way (V-0003
#               to V-0009, V-0011) and 1 is a fragment quoted from
#               running prose (V-0012, `#7.25`). All 16 re-verified as
#               exact source content by an independent checker.
#   `instance`  MIXED, AND THE DIFFERENCE IS DECLARED HERE. V-0002's is
#               a verbatim block - Figure 6 entire. THE SIX ONE-LINE
#               `instance` VALUES OF V-0003 TO V-0008 ARE OURS, NOT
#               THE SOURCE'S: each composes Figure 6's two columns into
#               one line, taking the CBOR head from the source's comment
#               column ("# text(19)", "# bytes(19)") and the payload
#               from the source's hex column. Every byte in them is the
#               source's; the LINE is not. V-0012's `instance`
#               ("a float16") is a two-word fragment of §3.2's prose.
#   `matches`   ALWAYS OURS - a reading, never a quotation.
#   `notes`     MIXED, inline: double-quoted spans are the source's own
#               words and contiguous verbatim; anything marked OURS is
#               this library's reading.
#
# Source: RFC 9682, cached source sha256
#   d35602e7f784e509a5984283ea8d998adfee23f086ad0d77bd22f98c6cdea89c
# =====================================================================
record: rfc-9682
reviewed_by: ""
vectors:
  - id: 'rfc-9682#V-0001'
    locator: '§2.2 (Figure 5)'
    cddl: |
      start = [a, b, c, x, y, z]

      ; "🁳", DOMINO TILE VERTICAL-02-02, and
      ; "⌘", PLACE OF INTEREST SIGN, in a text string:
      a = "D\u{6f}mino's \u{1F073} + \u{2318}"      ; \u{}-escape 3 chars
      b = "Domino's \uD83C\uDC73 + \u2318"          ; escape JSON-like
      c = "Domino's 🁳 + ⌘"                          ; unescaped

      ; in a byte string given as text, the ' needs to be escaped:
      x = 'D\u{6f}mino\u{27}s \u{1F073} + \u{2318}' ; \u{}-escape 4 chars
      y = 'Domino\'s \uD83C\uDC73 + \u2318'         ; escape JSON-like
      z = 'Domino\'s 🁳 + ⌘'                         ; escape ' only
    matches: 'A complete CDDL file, valid under RFC 9682 and NOT under RFC 8610: the rules a, b, x and y use escape forms the old SESC does not define.'
    expect: 'valid'
    notes: 'THE DOCUMENT''S PRIMARY EXAMPLE, lifted whole. "The CDDL example in Figure 5 demonstrates various escaping techniques now available for (byte and text) strings in CDDL." Six rules plus start. Rules a-c are text strings, x-z byte strings, and all six produce the same 19 bytes. The blank lines and comments are the source''s. OURS: under RFC 8610''s grammar this file PARSES TOO, with different meanings for a, b, x and y - see rfc-9682#V-0003 and rfc-9682#V-0004.'
  - id: 'rfc-9682#V-0002'
    locator: '§2.2 (Figure 6)'
    instance: |
      86                                      # array(6)
         73                                   # text(19)
            446f6d696e6f277320f09f81b3202b20e28c98 # "Domino's 🁳 + ⌘"
         73                                   # text(19)
            446f6d696e6f277320f09f81b3202b20e28c98 # "Domino's 🁳 + ⌘"
         73                                   # text(19)
            446f6d696e6f277320f09f81b3202b20e28c98 # "Domino's 🁳 + ⌘"
         53                                   # bytes(19)
            446f6d696e6f277320f09f81b3202b20e28c98 # "Domino's 🁳 + ⌘"
         53                                   # bytes(19)
            446f6d696e6f277320f09f81b3202b20e28c98 # "Domino's 🁳 + ⌘"
         53                                   # bytes(19)
            446f6d696e6f277320f09f81b3202b20e28c98 # "Domino's 🁳 + ⌘"
    matches: 'The CBOR generated from the start rule of Figure 5, as the document prints it.'
    expect: 'valid'
    notes: 'THE ONLY BYTE-LEVEL OUTPUT IN THE DOCUMENT and the whole of this record''s byte-level basis. "Figure 6 illustrates this by showing the output generated from the start rule in Figure 5, using pretty-printed hexadecimal." An array(6) of three text(19) and three bytes(19), every payload 446f6d696e6f277320f09f81b3202b20e28c98. The comment column, including the two non-ASCII characters, is the source''s.'
  - id: 'rfc-9682#V-0003'
    locator: '§2.2 (Figure 5, rule a)'
    cddl: |
      a = "D\u{6f}mino's \u{1F073} + \u{2318}"      ; \u{}-escape 3 chars
    instance: 'text(19) 446f6d696e6f277320f09f81b3202b20e28c98'
    matches: 'A text string of 19 bytes: Domino''s, U+1F073, " + ", U+2318.'
    expect: 'valid'
    notes: 'THE \u{hex} FORM, three characters escaped. The source says the first escape is gratuitous: "Obviously, in the literals for a and x, there is no need to escape the second character, an o, as \u{6f}; this is just for demonstration." SILENT-DIVERGENCE VECTOR, OURS. This line PARSES UNDER RFC 8610 TOO and means something else: RFC 8610''s SESC = "\" (%x20-7E / %x80-10FFFD) consumes \u, and {, 6, f, } are each ordinary SCHARs (U+007B and U+007D in %x5D-7E, 6 in %x23-5B, f in %x5D-7E), so the old reading of \u{6f} is the six characters u { 6 f } preceded by an escape rather than one character U+006F. NO DIAGNOSTIC IS PRODUCED ON EITHER SIDE. This is the concrete instance of the class §4 names: "Attackers may want to exploit such potential confusion by crafting CDDL models that are interpreted differently by different parts of a system." Note also that the hex digits here are upper case (\u{1F073}) while rule a''s first escape is lower case (\u{6f}) - both legal, because the hex digits are ABNF quoted strings.'
  - id: 'rfc-9682#V-0004'
    locator: '§2.2 (Figure 5, rule b)'
    cddl: |
      b = "Domino's \uD83C\uDC73 + \u2318"          ; escape JSON-like
    instance: 'text(19) 446f6d696e6f277320f09f81b3202b20e28c98'
    matches: 'The same 19 bytes as rule a, by the JSON escape forms.'
    expect: 'valid'
    notes: 'THE JSON FORMS: \uD83C\uDC73 is the surrogate-pair spelling of U+1F073 and \u2318 the plain four-digit form. The source is explicit that no surrogate enters the data model: "(Note that CDDL imports from JSON the unwieldy \uHHHH\uLLLL syntax, which represents Unicode code points beyond U+FFFF by making them look like UTF-16 surrogate pairs; CDDL text strings do not use UTF-16 or surrogates.)" SECOND SILENT-DIVERGENCE VECTOR, OURS: under RFC 8610 this parses as \u followed by the literal SCHARs D 8 3 C, then \u followed by D C 7 3, and so on. Again no diagnostic on either side. Under RFC 9682 a LONE surrogate is unreachable: hexchar''s pair branch needs both halves, and neither non-surrogate nor hexscalar admits D800-DFFF.'
  - id: 'rfc-9682#V-0005'
    locator: '§2.2 (Figure 5, rule c)'
    cddl: |
      c = "Domino's 🁳 + ⌘"                          ; unescaped
    instance: 'text(19) 446f6d696e6f277320f09f81b3202b20e28c98'
    matches: 'The same 19 bytes as rules a and b, with no escapes at all.'
    expect: 'valid'
    notes: 'THE UNESCAPED FORM, and the only one of the three that is valid RFC 8610 CDDL with the same meaning. The two characters are admitted directly by the new NONASCII (U+2318 and U+1F073 both lie in %xE000-10FFFD). The source notes the choice is about the file''s own repertoire, not about expressiveness: "escaping them may be convenient in order to limit the character repertoire of a CDDL file itself to ASCII [STD80]".'
  - id: 'rfc-9682#V-0006'
    locator: '§2.2 (Figure 5, rule x)'
    cddl: |
      x = 'D\u{6f}mino\u{27}s \u{1F073} + \u{2318}' ; \u{}-escape 4 chars
    instance: 'bytes(19) 446f6d696e6f277320f09f81b3202b20e28c98'
    matches: 'A byte string of the same 19 bytes, four characters escaped.'
    expect: 'valid'
    notes: 'FOUR escapes rather than three, because the apostrophe must go too: the source''s own comment line above the block reads "; in a byte string given as text, the '' needs to be escaped:". Here it is escaped as \u{27} rather than \'', which is the form rules y and z use. Both are legal under RFC 9682; only \'' was legal under RFC 8610, and only because its SESC admitted a backslash before any printable character.'
  - id: 'rfc-9682#V-0007'
    locator: '§2.2 (Figure 5, rule y)'
    cddl: |
      y = 'Domino\'s \uD83C\uDC73 + \u2318'         ; escape JSON-like
    instance: 'bytes(19) 446f6d696e6f277320f09f81b3202b20e28c98'
    matches: 'The same 19 bytes, JSON escape forms, apostrophe escaped as \''.'
    expect: 'valid'
    notes: 'THE VECTOR THAT EXERCISES BCHAR''S NEW "\''" ALTERNATIVE. Under RFC 9682 \'' is reachable in a byte string only because Figure 4 adds it explicitly - "With the SESC updated as above, \'' is no longer allowed in BCHAR and now needs to be explicitly included there". OURS: the same escape in a TEXT string is now a syntax error, and no sentence of the document says so.'
  - id: 'rfc-9682#V-0008'
    locator: '§2.2 (Figure 5, rule z)'
    cddl: |
      z = 'Domino\'s 🁳 + ⌘'                         ; escape ' only
    instance: 'bytes(19) 446f6d696e6f277320f09f81b3202b20e28c98'
    matches: 'The same 19 bytes, nothing escaped but the apostrophe.'
    expect: 'valid'
    notes: 'The minimal spelling, and the source''s own comment says so: "; escape '' only". Valid under RFC 8610 as well, with the same meaning, because \'' was reachable through the old SESC.'
  - id: 'rfc-9682#V-0009'
    locator: '§2.2 (Figure 5, rule start)'
    cddl: |
      start = [a, b, c, x, y, z]
    matches: 'A six-element array of the six literals above, in the order a b c x y z.'
    expect: 'valid'
    notes: 'The entry point. Figure 6''s first byte, 86, is array(6) and its six payloads are in this order: three text(19) then three bytes(19). This is what makes the document''s identity claim checkable: "In this example, the rules a to c and x to z all produce strings with byte-wise identical content: a to c are text strings and x to z are byte strings." Same 19 bytes, different CBOR major type - 3 for the first three, 2 for the last three.'
  - id: 'rfc-9682#V-0010'
    locator: '§3.2'
    cddl: |
      ct-tag<content> = #6.<ct-tag-number>(content)
      ct-tag-number = 1668546817..1668612095
      ; or use 0x63740101..0x6374FFFF
    matches: 'A generic tag type whose tag number is a RANGE rather than a literal - RFC 9277''s content-format tag range.'
    expect: 'valid'
    notes: 'THE WHOLE POINT OF §3.2, and invalid under RFC 8610, which admits only ["." uint]: "This means tag numbers can only be given as literal numbers (uints)." and "This cannot currently be expressed in CDDL." The range is RFC 9277''s: "[RFC9277] has a range of tag numbers 1668546817 (0x63740101) to 1668612095 (0x6374FFFF) to tag specific content formats." The third line of the block is the source''s own comment giving the hexadecimal spelling, and it is part of the lifted range; it is also rfc-9682#V-0011. OURS: 65279 tag numbers wide, inclusive at both ends per "(All ranges mentioned here are inclusive.)". The fragment deliberately uses generics as well as the new angle-bracket form, which the §3.2 aside remarks on.'
  - id: 'rfc-9682#V-0011'
    locator: '§3.2'
    cddl: |
      ; or use 0x63740101..0x6374FFFF
    matches: 'The hexadecimal spelling of the same tag-number range, as the source''s own comment gives it.'
    expect: 'valid'
    notes: 'A COMMENT IN THE SOURCE, carried as a vector because it is the document''s own second spelling of the range and because `0x` literals exercise `uint = ... / "0x" 1*HEXDIG`, which is unchanged by this document. As printed it is a CDDL comment, so on its own it is a COMMENT and not a rule; a tool must strip the leading "; or use " to get the range. Recorded as the source prints it, unaltered. Note that `0x63740101..0x6374FFFF` relies on `COMMENT = ";" *PCHAR CRLF`, which REQUIRES a line terminator - so this line does not parse as a complete CDDL file unless it ends in a newline (G-34, unchanged).'
  - id: 'rfc-9682#V-0012'
    locator: '§3.2'
    cddl: '#7.25'
    instance: 'a float16'
    matches: 'A major-type-7 head with additional information 25.'
    expect: 'valid'
    notes: 'QUOTED FROM PROSE, not from a figure: "For 24..31, the head-number stands for the "additional information", e.g., #7.25 or #7.<25> is a float16, etc." VALID UNDER BOTH GRAMMARS AND WITH THE SAME MEANING - RFC 8610 reaches it through `"#" DIGIT ["." uint]  ; major/ai` and RFC 9682 through the new `"#" "7" ["." head-number]`. OURS: that overlap is the new dead alternative. The angle-bracket spelling #7.<25> is the same vector in the form RFC 8610 refuses, and both appear in the one quoted sentence.'
  - id: 'rfc-9682#V-0013'
    locator: 'Appendix B.1'
    cddl: |
      foo = h'
         43424F52 ; 'CBOR'
         0A       ; LF, but don't use CR!
      '
    matches: 'NOTHING, under either grammar. The bare apostrophe on the second line closes the byte string literal, and what follows is not a CDDL rule.'
    expect: 'invalid'
    notes: 'THE SOURCE''S OWN NEGATIVE, and the reason Erratum ID 6543''s proposal was declined. The document''s words are "This allows any non-C0 character in a comment, so this fragment becomes possible" - BECOMES POSSIBLE UNDER THE PROPOSAL (Figure 13), where a prefixed byte string''s content runs through QCHAR -> WS -> NL -> COMMENT -> PCHAR and PCHAR admits an apostrophe. expect: invalid IS OURS, against the grammar in force: U+0027 appears in no BCHAR alternative (the ranges are %x20-26 and %x28-5B, which skip it), so the first bare apostrophe terminates the literal. It was invalid under RFC 8610 for exactly the same reason. The three apostrophes the next paragraph counts are the two in ''CBOR'' and the one in don''t.'
  - id: 'rfc-9682#V-0014'
    locator: 'Appendix B.1'
    cddl: |
      foo = h'
         43424F52 ; \'CBOR\'
         0A       ; LF, but don\'t use CR!
      '
    matches: 'A byte string literal, prefix h, whose content after the semantic step is 43424F52 0A with two comments.'
    expect: 'valid'
    notes: 'THE ESCAPED FORM, and valid under BOTH grammars - the source says so for the old one, "... which would be supported by the existing ABNF in [RFC8610].", and RFC 9682''s BCHAR admits "\''" explicitly. THE ONE CASE IN THIS DOCUMENT WHERE OLD AND NEW AGREE ABOUT A DISPUTED CONSTRUCT. It is also the vector that exercises the two-stage model: the comments are not comments at the syntax stage (every character is a BCHAR, and the newlines are BCHAR''s CRLF), and become comments only at the semantic stage - "Therefore, the rules in Figure 14 (as updated by Figure 4) are applied to the result of this processing where bsqual is given as h or b64." Appendix B.2 states the rule for anyone pasting ABNF into CDDL, in a sentence severed at source line 669/670 whose quotable half reads "and-pasting into CDDL models from ABNF that contains single quotes (which may also hide as apostrophes in comments); these need to be escaped or possibly replaced by %x27."'
  - id: 'rfc-9682#V-0015'
    locator: '§2.1.1 (Figure 2)'
    cddl: |
      SESC = "\" ( %x22 / "/" / "\" /                 ; \" \/ \\
                   %x62 / %x66 / %x6E / %x72 / %x74 / ; \b \f \n \r \t
                   (%x75 hexchar) )                   ; \uXXXX
    matches: 'The complete escape set after this document: eight single-character escapes and the \u family.'
    expect: 'valid'
    notes: 'THE SOURCE''S OWN ESCAPE TABLE, lifted as the three lines of Figure 2 that define SESC. The trailing comment column is the document''s own annotation of what each numeric value spells: `; \" \/ \\`, `; \b \f \n \r \t`, `; \uXXXX`. EXHAUSTIVE - everything outside this set is now a syntax error. OURS, by arithmetic: RFC 8610''s SESC admitted a backslash before any of 1,114,077 code points (95 in %x20-7E plus 1,113,982 in %x80-10FFFD), of which eight survive as single-character escapes; \u survives only with a mandatory payload; the rest are gone. And the escape LETTER is now case-exact because %x62..%x75 are numeric, while the hex DIGITS stay case-insensitive because they are quoted - which is why Figure 5 can carry \u{1F073} and \u{6f} in one file.'
