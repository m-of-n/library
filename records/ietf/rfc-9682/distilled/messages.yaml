# =====================================================================
# rfc-9682 messages -- for a grammar-correcting document, the messages
# are the SYNTACTIC CONSTRUCTS it changes. Each entry below is one
# construct of CDDL, its parts, its concrete syntax after this document,
# and what a parser built from RFC 8610's grammar does with it.
#
# `constrained_by` is OMITTED THROUGHOUT and deliberately so. RFC 9682
# carries ZERO BCP 14 keyword occurrences in 28 KB, so NOTHING here is
# constrained by a keyword-backed requirement; inventing ids to fill the
# key would be worse than leaving it out (docs/extraction.md, R-O-03).
# The same decision, for the same reason, as the sibling rfc-8610 record.
# The join that IS honest is by SECTION, and it is in `locator_join`.
#
# Quoted sentences are RFC 9682's own words and are contiguous verbatim
# spans of the source, mechanically checked. Anything marked OURS is
# this library's reading, not the document's.
#
# SCOPE. This file covers the 6 changed productions, the 8 new ones and
# the 4 unchanged ones this record exists to answer. The other 51
# productions of Figure 11 are held byte-exact at
# schema/cddl-updated.abnf and are not restated here -- see `coverage`.
#
# Source: RFC 9682, cached source sha256
#   d35602e7f784e509a5984283ea8d998adfee23f086ad0d77bd22f98c6cdea89c
# =====================================================================
record: rfc-9682
reviewed_by: ""

coverage:
  productions_in_rfc_8610_appendix_b: 47
  productions_in_rfc_9682_figure_11: 55
  note: >-
    55 rule definitions in Figure 11 against 47 in RFC 8610 Appendix B.
    18 are described here as constructs: 6 changed, 8 new, and 4 carried
    over unchanged but load-bearing for this record (CRLF, bsqual,
    memberkey, grpent). The remaining 37 are unchanged and unremarkable
    and are held byte-exact at schema/cddl-updated.abnf rather than
    restated as data. The arithmetic: 55 = 41 carried + 6 changed + 8
    new, and 41 carried = 4 described here + 37 not.

# ---------------------------------------------------------------------
# locator_join -- the only honest join between requirements.yaml and
# this file. NOT a requirement link. Each construct's `locator` and each
# requirement's `locator` name sections of RFC 9682; joining them by
# section says which requirements have a construct and which do not.
# ---------------------------------------------------------------------
locator_join:
  basis: >-
    A requirement at section X meets any construct whose locator is X or
    a descendant of X. The join is mechanical and carries no claim that
    the requirement constrains the construct.
  not_a_requirement_link: >-
    `constrained_by` remains absent throughout, for the reason in the
    header. A shared section number is evidence of subject, not of
    obligation.
  sections_with_no_construct:
    - 'Abstract, §1, §1.1 -- statements about this document and its relationship to RFC 8610 and RFC 9165, not about any CDDL construct'
    - '§2.1.3 -- one sentence, a coverage claim about two errata'
    - '§4 -- security considerations. Nine requirements, no construct. The one that bears on us (rfc-9682#R-0064, which says implementations "already need to ascertain the provenance (and thus authenticity and integrity) and applicability of models they employ") is about a CDDL FILE as an artifact, not about a construct inside one'
    - '§5 -- "This document has no IANA actions."'
    - 'Appendix B, Appendix B.1 -- the declined proposal. Its QCHAR construct is deliberately NOT listed below, because it was never in force; it is held verbatim at schema/errata-6543-proposal.abnf'
    - 'Acknowledgments -- the provenance of the NONASCII rule'
  verdict: >-
    OURS. No requirement names a construct that is missing from this
    file or from schema/, and no construct listed here is unreached by
    a requirement. The 4 unchanged productions described below are each
    reached by their own requirement (rfc-9682#R-0070 .. rfc-9682#R-0073),
    which is why they were extracted as requirements at all.

messages:

  # ================================================= CHANGED (6) =====
  - name: cddl
    kind: production
    status: changed
    locator: '§3.1 (Figure 8); Appendix A (Figure 11)'
    change: relaxation
    was: 'cddl = S 1*(rule S)'
    now: 'cddl = S *(rule S)'
    role: 'the start symbol: a whole CDDL file'
    fields:
      - name: S
        type: 'whitespace, comments and newlines (S = *WS)'
        cardinality: 'one, possibly empty, before and after every rule'
      - name: rule
        type: 'rule'
        cardinality: 'ZERO OR MORE after this document; one or more before it'
    semantics_outside_the_grammar: >-
      "at least one rule" survives as a semantic constraint. The source:
      "Therefore, the present update extends the grammar as in Figure 8
      and turns the existence of at least one rule into a semantic
      constraint, to be fulfilled after processing of all directives."
    old_parser_behaviour: >-
      OVER-REJECTS. An empty file, and a file holding only whitespace
      and comments, both match the updated rule and are refused by the
      old one. Nothing that parsed before stops parsing.
    ours: >-
      The phase "after processing of all directives" is defined in
      [CDDL-MODULES], not here. A tool with no module support has no
      directives to process, so for it the condition collapses back to
      RFC 8610's and it rejects exactly the files §3.1 was written to
      allow. See schema/grammar-gaps-status.derived.txt, NEW-1.

  - name: type2
    kind: production
    status: changed
    locator: '§3.2 (Figure 10); Appendix A (Figure 11)'
    change: relaxation
    was: 'type2 =/ "#" "6" ["." uint] "(" S type S ")"'
    now: 'type2 =/ "#" "6" ["." head-number] "(" S type S ")" / "#" "7" ["." head-number]'
    role: 'a tagged type (#6) or a simple value / major-type-7 head (#7)'
    fields:
      - name: '"#" "6"'
        type: literal
        cardinality: one
        note: 'major type 6, a tag'
      - name: '["." head-number]'
        type: head-number
        cardinality: 'optional; was [". " uint]'
        note: 'for #6 this is the TAG NUMBER. Source: "For #6, the head-number stands for the tag number."'
      - name: '"(" S type S ")"'
        type: type
        cardinality: 'one, required for the #6 form only'
      - name: '"#" "7"'
        type: literal
        cardinality: one
        note: 'NEW ALTERNATIVE. major type 7'
      - name: '["." head-number] after #7'
        type: head-number
        cardinality: optional
        note: >-
          THREE DISJOINT RANGES WITH TWO MEANINGS. 0..23 and 32..255 are
          the simple value; 24..31 is the additional information. The
          source sentence is severed by an end-of-line word break at
          line 329/330 and the obligation-bearing half reads "number
          stands for the simple value if it is in the ranges 0..23 or
          32..255 (as per Section 3.3 of RFC 8949 [STD94], the simple
          values 24..31 are not used)."; the next sentence is whole:
          "For 24..31, the head-number stands for the "additional
          information", e.g., #7.25 or #7.<25> is a float16, etc."
    old_parser_behaviour: >-
      OVER-REJECTS the angle-bracket form and nothing else. `#6.<n>(t)`
      and `#7.<n>` are refused. `#7.25` is ACCEPTED by both, via the
      old `"#" DIGIT ["." uint]` alternative, with the same meaning.
    ours: >-
      A SECOND DEAD ALTERNATIVE. In Figure 11 the two new alternatives
      precede the pre-existing `/ "#" DIGIT ["." uint]  ; major/ai`, so
      under prioritized choice that older alternative is unreachable for
      DIGIT = "7" and partly unreachable for DIGIT = "6". Read as plain
      ABNF, `#7.n` now has two parses; they agree for n in 0..31 and
      only the new one is defined for 32..255, because a CBOR additional
      information is five bits. NEW-OBS-1.
      AND A CASE THE DOCUMENT DOES NOT NAME: a head-number given as
      `<type>` whose type straddles 24..31 (say `0..255`) selects both
      readings at once. The grammar permits it; §3.2 is silent.

  - name: SCHAR
    kind: production
    status: changed
    locator: '§2.1.2 (Figure 4); Appendix A (Figure 11)'
    change: 'restriction (correction, Erratum ID 6278 + completeness)'
    was: 'SCHAR = %x20-21 / %x23-5B / %x5D-7E / %x80-10FFFD / SESC'
    now: 'SCHAR = %x20-21 / %x23-5B / %x5D-7E / NONASCII / SESC'
    role: 'one character inside a text string literal (`text = %x22 *SCHAR %x22`)'
    fields:
      - name: '%x20-21'
        type: 'code point range'
        note: 'SP and "!"; U+0022 is excluded because it closes the literal'
      - name: '%x23-5B'
        type: 'code point range'
        note: '"#" to "["; U+005C is excluded because it opens a SESC'
      - name: '%x5D-7E'
        type: 'code point range'
        note: '"]" to "~"; U+007F (DEL) was already excluded here under RFC 8610'
      - name: NONASCII
        type: NONASCII
        note: 'REPLACES %x80-10FFFD. Removes U+0080-U+009F (32) and U+D800-U+DFFF (2048)'
      - name: SESC
        type: SESC
        note: 'now a closed set of escapes, see below'
    old_parser_behaviour: >-
      OVER-ACCEPTS a raw C1 control or a surrogate-range code point
      inside a text string.

  - name: SESC
    kind: production
    status: changed
    locator: '§2.1.1 (Figure 2); Appendix A (Figure 11)'
    change: 'restriction AND relaxation (correction, Erratum ID 6527) -- the only construct carrying both directions'
    was: 'SESC = "\" (%x20-7E / %x80-10FFFD)'
    now: 'SESC = "\" ( %x22 / "/" / "\" / %x62 / %x66 / %x6E / %x72 / %x74 / (%x75 hexchar) )'
    role: 'a backslash escape inside a text or byte string literal'
    fields:
      - name: '%x22 / "/" / "\"'
        type: 'the three punctuation escapes'
        note: 'the source annotates them in the figure itself: `; \" \/ \\`'
      - name: '%x62 / %x66 / %x6E / %x72 / %x74'
        type: 'the five control-character escapes'
        note: >-
          annotated `; \b \f \n \r \t`. NUMERIC, therefore CASE-EXACT:
          \B, \F, \N, \R, \T are syntax errors. The §2.1.1 aside states
          the mechanism and says the choice was made "in order to
          maximize compatibility with ABNF tools".
      - name: '%x75 hexchar'
        type: hexchar
        note: >-
          annotated `; \uXXXX`. The payload is MANDATORY, so bare `\u`
          is now a syntax error. `%x75` is numeric, so `\U` is too.
    exhaustive: >-
      EIGHT single-character escapes plus the \u family. RFC 8610
      admitted a backslash before any of 1,114,077 code points (95 in
      %x20-7E plus 1,113,982 in %x80-10FFFD). OURS, by arithmetic.
    old_parser_behaviour: >-
      THE DANGEROUS ONE: it does not fail, it SILENTLY DISAGREES.
      `"D\u{6f}mino"` parses under RFC 8610 as `\u` followed by the
      ordinary SCHARs `{`, `6`, `f`, `}`, and under RFC 9682 as one
      escape for U+006F. `"🁳"` likewise. NO DIAGNOSTIC IS
      PRODUCED ON EITHER SIDE. The source names the class in §4:
      "Attackers may want to exploit such potential confusion by
      crafting CDDL models that are interpreted differently by different
      parts of a system."
      It also OVER-ACCEPTS every escape outside the eight -- `\a`, `\q`,
      a backslash before a non-ASCII character -- and `"\'"`, which was
      valid RFC 8610 CDDL and is not valid RFC 9682 CDDL.

  - name: BCHAR
    kind: production
    status: changed
    locator: '§2.1.2 (Figure 4); Appendix A (Figure 11)'
    change: 'restriction (correction, Erratum ID 6278), with one compensating re-admission'
    was: 'BCHAR = %x20-26 / %x28-5B / %x5D-10FFFD / SESC / CRLF'
    now: 'BCHAR = %x20-26 / %x28-5B / %x5D-7E / NONASCII / SESC / "\''" / CRLF'
    role: 'one character inside a byte string literal (`bytes = [bsqual] %x27 *BCHAR %x27`)'
    fields:
      - name: '%x20-26'
        type: 'code point range'
        note: 'U+0027 is excluded because it closes the literal'
      - name: '%x28-5B'
        type: 'code point range'
        note: 'U+005C excluded, as in SCHAR'
      - name: '%x5D-7E'
        type: 'code point range'
        note: 'NEW UPPER BOUND. Removes U+007F (DEL), which RFC 8610 admitted here and not in SCHAR -- the subject of Erratum ID 6278'
      - name: NONASCII
        type: NONASCII
        note: 'removes U+0080-U+009F and U+D800-U+DFFF'
      - name: SESC
        type: SESC
      - name: '"\''"'
        type: 'explicit two-character literal'
        note: >-
          NEW ALTERNATIVE, and not a net addition: RFC 8610 reached `\''`
          through its permissive SESC. The source: "With the SESC updated
          as above, \'' is no longer allowed in BCHAR and now needs to be
          explicitly included there; see Figure 4."
      - name: CRLF
        type: CRLF
        note: >-
          UNCHANGED, and this is the half of the SCHAR/BCHAR asymmetry
          the document does NOT address: a byte string literal may span
          lines and a text string literal may not, and no sentence of
          either document says so. G-31 limb 2.
    code_points_removed: 2081
    old_parser_behaviour: >-
      OVER-ACCEPTS DEL, the C1 range and the surrogate range inside a
      byte string literal, and reads `\u{...}` as described under SESC.
      `\''` parses under both.

  - name: PCHAR
    kind: production
    status: changed
    locator: '§2.1.2 (Figure 4); Appendix A (Figure 11)'
    change: 'restriction (correction, by extension of the Erratum ID 6278 reasoning)'
    was: 'PCHAR = %x20-7E / %x80-10FFFD'
    now: 'PCHAR = %x20-7E / NONASCII'
    role: 'one character inside a CDDL comment (`COMMENT = ";" *PCHAR CRLF`)'
    fields:
      - name: '%x20-7E'
        type: 'code point range'
        note: 'unchanged; note that U+007F was already excluded here'
      - name: NONASCII
        type: NONASCII
    justified_by: 'one sentence: "The same reasoning also applies to text in comments (PCHAR)."'
    old_parser_behaviour: >-
      OVER-ACCEPTS a C1 control or a surrogate-range code point inside a
      comment. OURS: because COMMENT is NL is whitespace, this is a
      WHOLE-FILE property and not a string-literal one -- one stray C1
      byte in a comment makes a file an updated tool refuses and an old
      tool accepts, anywhere in the file.

  # ===================================================== NEW (8) =====
  - name: head-number
    kind: production
    status: new
    locator: '§3.2 (Figure 10); Appendix A (Figure 11)'
    definition: 'head-number = uint / ("<" type ">")'
    role: 'the number after the dot in a #6 or #7 expression'
    fields:
      - name: uint
        type: uint
        note: 'the RFC 8610 case, unchanged in effect'
      - name: '"<" type ">"'
        type: type
        note: >-
          THE WHOLE OF THE RELAXATION. Any CDDL type, hence a range.
          The §3.2 aside argues the reuse of the generics brackets is
          unambiguous because a generic argument follows a rule name
          while this follows the dot.
    worked_example: 'ct-tag<content> = #6.<ct-tag-number>(content) with ct-tag-number = 1668546817..1668612095 (RFC 9277''s content-format tag range)'

  - name: hexchar
    kind: production
    status: new
    locator: '§2.1.1 (Figure 2); Appendix A (Figure 11)'
    definition: 'hexchar = "{" (1*"0" [ hexscalar ] / hexscalar) "}" / non-surrogate / (high-surrogate "\" %x75 low-surrogate)'
    role: 'the payload of a \u escape'
    fields:
      - name: '"{" (1*"0" [ hexscalar ] / hexscalar) "}"'
        type: 'braced form'
        note: >-
          the NEW \u{hex} form. The `1*"0" [ hexscalar ]` branch admits
          leading zeros, and on its own -- optional payload absent -- it
          is what makes `\u{0}`, `\u{00}` and `\u{000}` legal spellings
          of U+0000.
      - name: non-surrogate
        type: non-surrogate
        note: 'the bare four-digit JSON form, `⌘`'
      - name: 'high-surrogate "\" %x75 low-surrogate'
        type: 'surrogate pair'
        note: >-
          the JSON `\uHHHH\uLLLL` form. Usable ONLY as a pair. The
          source: "CDDL text strings do not use UTF-16 or surrogates."

  - name: non-surrogate
    kind: production
    status: new
    locator: '§2.1.1 (Figure 2); Appendix A (Figure 11)'
    definition: 'non-surrogate = ((DIGIT / "A"/"B"/"C" / "E"/"F") 3HEXDIG) / ("D" %x30-37 2HEXDIG )'
    role: 'exactly four hex digits, D800-DFFF excluded by construction'
    ours: >-
      The first branch''s alternation list omits "D", which is why the
      second branch exists: a leading "D" forces the second digit into
      %x30-37, i.e. 0-7, so D800-DFFF is unreachable. The quoted letters
      are case-insensitive, so `\ud800` is refused as well as `\uD800`.

  - name: high-surrogate
    kind: production
    status: new
    locator: '§2.1.1 (Figure 2); Appendix A (Figure 11)'
    definition: 'high-surrogate = "D" ("8"/"9"/"A"/"B") 2HEXDIG'
    role: 'the first half of a JSON surrogate pair; U+D800-U+DBFF'

  - name: low-surrogate
    kind: production
    status: new
    locator: '§2.1.1 (Figure 2); Appendix A (Figure 11)'
    definition: 'low-surrogate = "D" ("C"/"D"/"E"/"F") 2HEXDIG'
    role: 'the second half of a JSON surrogate pair; U+DC00-U+DFFF'

  - name: hexscalar
    kind: production
    status: new
    locator: '§2.1.1 (Figure 2); Appendix A (Figure 11)'
    definition: 'hexscalar = "10" 4HEXDIG / HEXDIG1 4HEXDIG / non-surrogate / 1*3HEXDIG'
    role: 'the braced form''s payload: a Unicode scalar value in hex, 1 to 6 digits, no leading zero'
    fields:
      - name: '"10" 4HEXDIG'
        type: 'plane 16'
        note: 'U+100000 to U+10FFFF. This branch is what caps the grammar: `\u{110000}` is refused'
      - name: 'HEXDIG1 4HEXDIG'
        type: 'five digits, no leading zero'
        note: 'U+10000 to U+FFFFF'
      - name: non-surrogate
        type: non-surrogate
        note: 'four digits, surrogates excluded'
      - name: '1*3HEXDIG'
        type: 'one to three digits'
        note: >-
          U+0000 to U+0FFF. OURS: this is the branch that makes
          `\u{0}` .. `\u{1F}`, `\u{7F}` and `\u{9F}` well-formed escapes
          for exactly the code points §2.1.2 has just removed from the
          direct ranges, and `\u{9}` the first way to put U+0009 inside
          a CDDL text string. The exclusion is lexical only. The source
          declines the semantic half: "there is no attempt to further
          exclude non-printable characters from the ABNF".
    ours: >-
      ONE SOURCE DEFECT. `hexscalar` reaches U+10FFFF while `NONASCII`
      stops at U+10FFFD, so `\u{10FFFE}` and `\u{10FFFF}` are
      well-formed escapes for characters that cannot appear directly in
      any CDDL string. New with this document; no sentence addresses it.

  - name: HEXDIG1
    kind: production
    status: new
    locator: '§2.1.1 (Figure 2); Appendix A (Figure 11)'
    definition: 'HEXDIG1 = DIGIT1 / "A" / "B" / "C" / "D" / "E" / "F"'
    role: '`HEXDIG` without "0"; forbids a leading zero in hexscalar''s five-digit branch'
    ours: >-
      Parallel to the pre-existing `DIGIT1`. It is also the rule that
      makes the CRLF defect one notch harder to see: Figure 11''s
      character-class block now holds six rules that look like
      restatements of RFC 5234 core rules (ALPHA, DIGIT, HEXDIG, SP,
      and now HEXDIG1 and DIGIT1) and one that contradicts one.

  - name: NONASCII
    kind: production
    status: new
    locator: '§2.1.2 (Figure 4); Appendix A (Figure 11)'
    definition: 'NONASCII = %xA0-D7FF / %xE000-10FFFD'
    role: 'the non-ASCII characters SCHAR, BCHAR and PCHAR admit'
    carries: >-
      THE WHOLE SURROGATE AND C1 FIX, for all three character classes at
      once. It excludes U+0080-U+009F by starting at %xA0 and
      U+D800-U+DFFF by splitting the range. The Acknowledgments give its
      provenance: "In one of the ensuing discussions, Doug Ewell
      proposed defining an ABNF rule "NONASCII", of which we have
      included the essence."

  # ============== UNCHANGED, BUT THE POINT OF THIS RECORD (4) =====
  - name: CRLF
    kind: production
    status: unchanged
    locator: 'Appendix A (Figure 11), source line 591'
    definition: 'CRLF = %x0A / %x0D.0A'
    role: 'a line terminator, in COMMENT and in BCHAR'
    ours: >-
      STILL A REDEFINED RFC 5234 CORE RULE, STILL ADMITTING A BARE LF.
      RFC 5234''s CRLF is `%x0D %x0A`. This document is titled Updates
      to the CDDL Grammar, lists [STD68] (RFC 5234) as a NORMATIVE
      reference, says in §1.1 that the grammar "is based on ABNF, which
      is defined in [STD68] and [RFC7405]", rewrites PCHAR two lines
      above this one in the same block of Figure 11 -- and says nothing.
      G-29 stands. Extracted as rfc-9682#R-0070.

  - name: bsqual
    kind: production
    status: unchanged
    locator: 'Appendix A (Figure 11), source line 573'
    definition: 'bsqual = "h" / "b64"'
    role: 'the prefix that says how a byte string literal''s content is encoded'
    fields:
      - name: '"h"'
        type: literal
        note: 'base16; case-insensitive, so `H''...''` is admitted too'
      - name: '"b64"'
        type: literal
        note: 'base64 or base64url; case-insensitive'
    semantics_outside_the_grammar: >-
      what may be IN a prefixed byte string is not a grammatical
      question. Appendix B.2 states the two-stage model and does so
      INFORMATIVELY: "Therefore, the rules in Figure 14 (as updated by
      Figure 4) are applied to the result of this processing where
      bsqual is given as h or b64."
    ours: >-
      TWO PREFIXES, UNCHANGED -- and the extension was DECLINED in
      terms: "Finally, the approach taken lends support to extending
      bsqual in CDDL similar to the way this is done for CBOR diagnostic
      notation in [EDN-LITERALS]." Support lent, not taken. The sibling
      record draft-ietf-cbor-edn-literals carries more prefixes, so a
      test vector written with any other prefix is valid EDN and is NOT
      a CDDL literal. Extracted as rfc-9682#R-0071.

  - name: memberkey
    kind: production
    status: unchanged
    locator: 'Appendix A (Figure 11), source line 526'
    definition: 'memberkey = type1 S ["^" S] "=>" / bareword S ":" / value S ":"'
    role: 'the key half of a map entry'
    fields:
      - name: '["^" S]'
        type: 'the cut operator'
        note: >-
          UNCHANGED and still absent from RFC 8610''s Table 1 (G-43).
          This document does not touch Table 1 and cannot: its scope is
          "the collected ABNF syntax in Appendix B of [RFC8610]" and
          Table 1 is in RFC 8610 §3.11.
    ours: 'Extracted as rfc-9682#R-0072. G-42 and G-44 stand for the same reason.'

  - name: grpent
    kind: production
    status: unchanged
    locator: 'Appendix A (Figure 11), source lines 522-524'
    definition: 'grpent = [occur S] [memberkey S] type / [occur S] groupname [genericarg]  ; preempted by above / [occur S] "(" S group S ")"'
    role: 'one entry of a group'
    ours: >-
      The comment `; preempted by above` is carried into the normative
      appendix VERBATIM, so the grammar still documents its own dead
      alternative (G-02) -- and this document adds a second instance of
      the same defect in `type2`. Extracted as rfc-9682#R-0073.

# ---------------------------------------------------------------------
# NOT A CONSTRUCT OF CDDL -- listed so that its absence is deliberate.
# ---------------------------------------------------------------------
not_constructs:
  - name: QCHAR
    locator: 'Appendix B.1 (Figure 13)'
    reason: >-
      `QCHAR = DIGIT / ALPHA / "+" / "/" / "-" / "_" / "=" / WS` belongs
      to the change Erratum ID 6543 PROPOSED and this document DECLINED.
      It was never in force. Held verbatim at
      schema/errata-6543-proposal.abnf so that the alternative is on
      record, and excluded from `messages` so that nothing reads it as
      part of CDDL.
  - name: 'the Figure 14 WS block as printed in Appendix B.1'
    locator: 'Appendix B.1 (Figure 14)'
    reason: >-
      Figure 14 is RFC 8610''s WS/SP/NL/COMMENT/PCHAR/CRLF block quoted
      as the SUPERSEDED text, printed to explain why the proposal was
      declined. Its PCHAR is the old one. The versions in force are in
      Figure 11; PCHAR appears above as a changed construct and CRLF as
      an unchanged one.
