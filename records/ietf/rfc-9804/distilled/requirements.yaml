reconciliation: "Counts agree: all 12 BCP 14 occurrences in the source body (7 MUST, 2 MAY, 2 RECOMMENDED, 1 OPTIONAL) are carried by 12 entries, and no entry carries a keyword the source does not. Three things a reader of this file alone cannot see. (1) The source states only 12 keyword occurrences across 1141 lines, so 54 of the 66 entries carry verb none: this document states almost all of its binding content in lowercase, and extracting only the keyword-bearing sentences would have captured under a fifth of what an implementer must obey. (2) Two source sentences are identical in two different sections and are therefore extracted twice: the equals-sign pair R-0028/R-0029 (from 4.5, base-64 of an octet-string) and R-0047/R-0048 (from 6.1, base-64 of a whole S-expression), and the error sentence R-0031 (4.5) and R-0050 (6.1). Both copies are real obligations on different constructs and both are counted, which is why MUST totals 7 and MAY totals 2 rather than 6 and 1. (3) Three source sentences carry two keywords each and are split so each half is separately testable: R-0028/R-0029, R-0045/R-0046 and R-0047/R-0048. Each half keeps its own keyword, so splitting does not change the total."
reviewed_by: ""
note: >
  Ids are stable and never reused. Cite as rfc-9804#R-NNNN.
  Entries are in source order. Every text is a verbatim run of the source
  with the RFC line wrapping undone: a source line break and the indent
  that follows it become a single space, and nothing else is altered.
  ONE EXCEPTION, and it is not cosmetic. The RFC breaks already-hyphenated
  words across lines, printing "octet-" at the end of one line and
  "strings" at the start of the next. Those are rejoined with NO space,
  because inserting one would yield "octet- string", which is not a word
  the source contains. Two entries, R-0002 and R-0065, are verbatim only
  under that rule, and both were confirmed against the source by rejoining
  rather than by eye.
  Each text is one contiguous run of source characters; no two
  non-adjacent passages are ever spliced into one entry.
  Entries with verb none are lowercase obligations carrying no BCP 14
  keyword. Exactly one entry is kind inferred (R-0054); its text is not
  verbatim source text and it carries no keyword.

