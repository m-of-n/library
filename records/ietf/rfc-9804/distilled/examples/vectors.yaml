    expected: 'a display-hint whose octet-string is the token "audio/basic"'

  - id: SEXP-46-08
    locator: "RFC 9804 Section 4.6 (examples)"
    kind: display-hint
    fidelity: verbatim
    input: '["http://example.com/display-types/funky.html"]'
    expected: 'a display-hint whose octet-string is "http://example.com/display-types/funky.html"'
    notes: 'A URL as a display-hint. Quoted rather than written as a token because the colon-slash-slash sequence is fine but the source quotes it anyway; as a token it would also be legal, since colon, slash, period and hyphen are all pseudo-alphabetic. Another place where a global identifier appears with no resolution semantics attached.'

  - id: SEXP-46-09
    locator: "RFC 9804 Section 4.6 (default)"
    kind: display-hint-default
    fidelity: verbatim
    input: '[application/octet-stream]'
    expected: 'the default display-hint, applied to an octet-string that carries none, in the absence of an application-specified default'
    constrains: rfc-9804#R-0037
    notes: 'THE CONDITION-1 VECTOR. This default is never written into any representation: rfc-9804#R-0039 says a display-hint equal to the default "is not suppressed nor is the default display-hint included in the representation for an octet-string without a display-hint". Combined with rfc-9804#R-0040, which makes the hint part of octet-string equality, an octet-string written WITH an explicit [24:application/octet-stream] and the same octet-string written with NO hint have different canonical forms and therefore different digests, while an application applying the default treats them as the same value. That is the injectivity crack recorded in design-notes.md condition 1, and Section 10 names the same mechanism as the one real security consideration in the document.'
    derived:
      in_source: false
      explicit_canonical_form: '[24:application/octet-stream]'
      implicit_canonical_form: 'no hint written at all'
      hint_length_check: 'application/octet-stream is 24 octets'

  # ===================================================================
  # Section 5 -- Lists
  # ===================================================================

  - id: SEXP-5-01
    locator: "RFC 9804 Section 5 (examples)"
    kind: list
    fidelity: verbatim
    input: '(a bob c)'
    expected: 'a list of three octet-strings: "a", "bob", "c"'
    notes: 'Three tokens separated by the whitespace rfc-9804#R-0043 makes mandatory. Without the spaces this would be the single token "abobc".'
    derived:
      in_source: false
      canonical_form: '(1:a3:bob1:c)'

  - id: SEXP-5-02
    locator: "RFC 9804 Section 5 (examples)"
    kind: list-nested
    fidelity: verbatim
    input: '( a ( bob c ) ( ( d e ) ( e f ) )  )'
    expected: 'a list of three elements: the octet-string "a"; the list ("bob" "c"); and the list of two lists (("d" "e") ("e" "f"))'
    notes: 'Whitespace everywhere it is permitted -- after the opening parenthesis, before the closing one, and between every element (rfc-9804#R-0044). Note the two spaces before the final parenthesis. Canonicalizing deletes all of it, which is the clearest demonstration in the document that the canonical form is reached by subtraction.'
    derived:
      in_source: false
      canonical_form: '(1:a(3:bob1:c)((1:d1:e)(1:e1:f)))'

  - id: SEXP-5-03
    locator: "RFC 9804 Section 5 (examples)"
    kind: list-nested
    fidelity: verbatim
    input: '(11:certificate(6:issuer3:bob)(7:subject5:alice))'
    expected: 'a list of three elements: the octet-string "certificate"; the list ("issuer" "bob"); and the list ("subject" "alice")'
    is_canonical_form: true
    notes: 'ALREADY CANONICAL as printed -- every octet-string verbatim, no whitespace anywhere. The nearest thing in the document to a worked SPKI certificate, and the closest analogue to an ARCH-0001 NameCert. Note what it does NOT have: no version, no type tag, no envelope, no algorithm identifier. The leading octet-string "certificate" is doing the work of a type indicator by convention only -- which is exactly the pattern design-notes.md condition 4 proposes building deliberately.'

  - id: SEXP-5-04
    locator: "RFC 9804 Section 5 (examples)"
    kind: list-mixed-representations
    fidelity: verbatim
    input: '(|ODpFeGFtcGxlIQ==| "1997" murphy 3:XC+)'
    expected: 'a list of four octet-strings, written in four different representations: base-64, quoted-string, token and verbatim'
    notes: 'All four non-hexadecimal representations in one list. The base-64 element decodes to the nine octets "8:Example!" -- note that this is itself a verbatim encoding of the octet-string "Example!", so the example contains an S-expression encoded inside an octet-string, though the source does not say so. The final element 3:XC+ is the three octets X, C, +.'
    derived:
      in_source: false
      base_64_decodes_to: '8:Example!'
      base_64_decode_note: 'Decoded here, not in the source. The source prints no decoding for this example.'
      canonical_form: '(9:8:Example!4:19976:murphy3:XC+)'
      canonical_form_note: 'The first element is the nine-octet string 8:Example! so its canonical form is 9:8:Example! -- a verbatim length prefix applied to something that itself looks like one. A good parser test: the inner "8:" is payload, not framing.'

  - id: SEXP-5-05
    locator: "RFC 9804 Section 5 (examples)"
    kind: list-empty
    fidelity: verbatim
    input: '()'
    expected: 'the empty list'
    is_canonical_form: true
    notes: 'Zero elements, legal by rfc-9804#R-0003. Already canonical. Section 8 lists "no empty lists" as a restriction an application may adopt, so a profile may exclude it.'

  # ===================================================================
  # Section 6.2 -- Canonical Representation
  # ===================================================================
  #
  # Every vector in this section is canonical by construction -- these are the
  # source's own examples of the form DEC-002 option 1 would sign.

  - id: SEXP-62-01
    locator: "RFC 9804 Section 6.2 (examples)"
    kind: canonical-sexp
    fidelity: verbatim
    input: '(6:issuer3:bob)'
    expected: 'the list of two octet-strings "issuer" and "bob", in canonical form'
    is_canonical_form: true
    notes: 'The minimal canonical list. Also appears as a sub-list of SEXP-5-03.'

  - id: SEXP-62-02
    locator: "RFC 9804 Section 6.2 (examples)"
    kind: canonical-sexp-with-display-hint
    fidelity: verbatim
    input: '(4:icon[12:image/bitmap]9:xxxxxxxxx)'
    expected: 'the list of two octet-strings: "icon", and a nine-octet string "xxxxxxxxx" carrying the display-hint "image/bitmap"'
    is_canonical_form: true
    notes: 'The only canonical example in the document carrying a display-hint, and therefore the vector that fixes the canonical hint syntax: Section 7.2 c-string = [ "[" verbatim "]" ] verbatim, with the hint itself verbatim (12:image/bitmap) and no whitespace at any of the three positions Section 4.6 would permit. Confirms the hint sits INSIDE the signed bytes (rfc-9804#R-0038).'
    derived:
      in_source: false
      hint_length_check: 'image/bitmap is 12 octets, matching the printed 12:'
      payload_length_check: 'xxxxxxxxx is 9 octets, matching the printed 9:'

  - id: SEXP-62-03
    locator: "RFC 9804 Section 6.2 (examples)"
    kind: canonical-sexp-nested
    fidelity: verbatim
    input: '(7:subject(3:ref5:alice6:mother))'
    expected: 'the list of two elements: the octet-string "subject", and the list ("ref" "alice" "mother")'
    is_canonical_form: true
    notes: 'A nested canonical list with no whitespace at any level. The inner list is an SDSI compound name -- alice''s mother -- which is the direct ancestor of ARCH-0001 Name = { issuer: Principal, labels: [...] }. This is the vector to cite when explaining what key-relative naming looked like in 1997.'

  - id: SEXP-62-04
    locator: "RFC 9804 Section 6.2 (examples)"
    kind: canonical-octet-string
    fidelity: verbatim
    input: '10:foo)]}>bar'
    expected: 'the ten-octet octet-string "foo)]}>bar"'
    is_canonical_form: true
    notes: 'THE FRAMING VECTOR, and the one design-notes.md section 2 item 3 cites. The payload contains a close parenthesis, a close bracket, a close brace and a greater-than sign -- every closing delimiter the format uses, plus one that it does not. None needs escaping and none terminates anything early, because the length prefix was read first. A parser that scans for a matching delimiter rather than counting octets produces garbage here. Ten octets: f o o ) ] } > b a r.'
    derived:
      in_source: false
      length_check: 'foo)]}>bar is 10 octets, matching the printed 10:'

  - id: SEXP-62-05
    locator: "RFC 9804 Section 6.2 (examples)"
    kind: canonical-octet-string
    fidelity: verbatim
    input: '0:'
    expected: 'the zero-length octet-string, in canonical form'
    is_canonical_form: true
    equiv_group: empty-octet-string
    linkage: inferred
    same_sexp_as:
      - SEXP-41-06
    notes: 'The source lists the empty octet-string among its canonical examples, confirming that a bare octet-string -- not only a list -- is a complete S-expression and has a canonical form.'

  # ===================================================================
  # Section 6.3 -- Basic Transport Representation
  # ===================================================================

  - id: SEXP-63-01
    locator: "RFC 9804 Section 6.3 (examples)"
    kind: basic-transport-canonical
    fidelity: verbatim
    input: '(1:a1:b1:c)'
    expected: 'the list of three one-octet octet-strings "a", "b", "c", as basic transport form 1 -- which IS the canonical representation'
    is_canonical_form: true
    equiv_group: abc-list
    linkage: stated
    same_sexp_as:
      - SEXP-63-02
    notes: 'Basic transport form 1 is the canonical representation unchanged (rfc-9804#R-0054). So this vector is simultaneously canonical and basic-transport, which is the point design-notes.md section 4 item 3 turns on: "basic transport" is a SUPERSET of the canonical form, not an alternative to it.'

  - id: SEXP-63-02
    locator: "RFC 9804 Section 6.3 (examples)"
    kind: basic-transport-base-64
    fidelity: verbatim
    input_lines:
      - '{KDE6YTE6YjE'
      - '   6Yyk= }'
    expected: 'the same S-expression as SEXP-63-01, in basic transport form 2 -- the base-64 of the canonical octets, surrounded by braces'
    equiv_group: abc-list
    linkage: stated
    same_sexp_as:
      - SEXP-63-01
    constrains: rfc-9804#R-0054
    notes: 'The source states the equivalence outright: "The second example above is the same S-expression as the first encoded in base-64." THE CONDITION-2 VECTOR: one S-expression, two octet sequences, and rfc-9804#R-0045 obliges a conforming implementation to accept both. Nothing in the document says a verifier should prefer or require one. A profile that wants condition (2) must reject this form explicitly -- see design-notes.md section 3 item 1. Note also the ignorable whitespace: a line break and three spaces inside the braces, and a space before the closing brace (rfc-9804#R-0049). Printed across two lines in the source; indentation is relative to the first line.'
    derived:
      in_source: false
      whitespace_stripped: '{KDE6YTE6YjE6Yyk=}'
      base_64_decodes_to: '(1:a1:b1:c)'
      decode_note: 'Verified by decoding: base64 of the eleven octets (1:a1:b1:c) is KDE6YTE6YjE6Yyk=, matching the source exactly once whitespace is removed. Eleven octets, remainder two when divided by three, so one equals sign -- consistent with rfc-9804#R-0027.'

