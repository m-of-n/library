  # ===================================================================
  # Section 4.6 -- Display-Hints and Internationalization
  # ===================================================================

  - id: SEXP-46-01
    locator: "RFC 9804 Section 4.6"
    kind: display-hint-with-string
    fidelity: verbatim
    input: '["text/plain; charset=utf-8"]"b\xC3\xB7b\xE2\x98\xBA"'
    expected: 'per the source prose: the octet-string representing "böb☺", that is "bob" with an umlaut over the "o", followed by the Unicode character WHITE SMILING FACE (U+263A), carried with a UTF-8 text/plain display-hint'
    source_defect: true
    notes: 'SOURCE DEFECT -- the printed octets do not decode to the string the prose names. The escape \xC3\xB7 is the two octets 0xC3 0xB7, which in UTF-8 is U+00F7 DIVISION SIGN, so the example decodes to "b÷b☺" and not to "böb☺". The letter o with umlaut is U+00F6, whose UTF-8 encoding is 0xC3 0xB6; the example has B7 where it needs B6, a single-digit error. The second escape pair is correct: \xE2\x98\xBA is 0xE2 0x98 0xBA, which is U+263A WHITE SMILING FACE, exactly as the prose says. Verified by decoding the octets, not by reading. Not previously recorded in this library. This is the same class of defect as the U+FB33 corruption found in the rfc-8785 record, and the same lesson: a test vector in a canonicalization document that does not decode to what its prose claims will propagate silently into every implementation that copies it.'
    derived:
      in_source: false
      printed_octets_decode_to: 'b÷b☺'
      prose_says: 'böb☺'
      corrected_escape: '\xC3\xB6'

  - id: SEXP-46-02
    locator: "RFC 9804 Section 4.6 (examples)"
    kind: display-hint
    fidelity: verbatim
    input: '[image/gif]'
    expected: 'a display-hint whose octet-string is the token "image/gif"'
    notes: 'The hint is written as a token here -- slash is pseudo-alphabetic, so a media type needs no quoting unless it contains a space or a semicolon.'

  - id: SEXP-46-03
    locator: "RFC 9804 Section 4.6 (examples)"
    kind: display-hint
    fidelity: verbatim
    input: '[charset=unicode-1-1]'
    expected: 'a display-hint whose octet-string is the token "charset=unicode-1-1"'
    notes: 'Not a media type at all, but a bare parameter. The source places no constraint on what a display-hint octet-string contains; rfc-9804#R-0034 constrains only its representation.'

  - id: SEXP-46-04
    locator: "RFC 9804 Section 4.6 (examples)"
    kind: display-hint
    fidelity: verbatim
    input: '[  text/richtext  ]'
    expected: 'a display-hint whose octet-string is the token "text/richtext"'
    notes: 'Whitespace between the brackets and the hint string, permitted by rfc-9804#R-0036. The canonical production Section 7.2 c-string = [ "[" verbatim "]" ] verbatim admits none of it, so this form has no canonical spelling of its own -- it canonicalizes to [13:text/richtext].'
    derived:
      in_source: false
      canonical_form_of_hint: '[13:text/richtext]'

  - id: SEXP-46-05
    locator: "RFC 9804 Section 4.6 (examples)"
