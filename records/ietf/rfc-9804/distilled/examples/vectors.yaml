# ====================================================================
# Conventions used in this file
# ====================================================================
#
# Every vector carries:
#   id            stable identifier, never reused
#   locator       the section of RFC 9804 the vector is taken from
#   kind          what the vector tests
#   input         the thing as the source prints it, verbatim
#   expected      what it denotes, verbatim from the source where the
#                 source states it; otherwise a prose statement of the
#                 rule the source gives
#   fidelity      describes `input`:
#                   verbatim     -- character-for-character from the source
#                   split        -- taken out of a larger verbatim example;
#                                   the characters are still the source's
#                   constructed  -- built from the source's prose, which
#                                   states the rule but prints no literal
#   notes         commentary; never a value an implementation consumes
#
# MULTI-LINE INPUTS. `bin/_yaml.py` has no block-scalar support (library#43),
# so no value in this file is a YAML block scalar. Where the source prints an
# example across two or more lines, the lines appear as a YAML sequence under
# `input_lines`, verbatim and in order, and there is NO `input` key. The
# single-line form, where it is not printed in the source, appears under
# `derived:` with `in_source: false`.
#
# QUOTING. Every value is a YAML quoted scalar. Single quotes are used
# wherever the value contains a backslash, because a single-quoted YAML
# scalar applies no escape processing: a backslash in a value is a backslash
# in the data. Double quotes are used for values that contain an apostrophe
# but no backslash. Exactly one value contains BOTH -- SEXP-42-E09, the
# escape-table row for the escaped apostrophe -- and it is written
# single-quoted with YAML's doubled-apostrophe convention. A conforming YAML
# parser reads it correctly; `bin/_yaml.py` does not undo the doubling and
# will hand back one extra apostrophe for that one value. See README.
#
# INDENTATION. Every example in the source sits inside the RFC's text margin
# (5 or 7 spaces). That uniform margin is page layout, not content, and has
# been removed. Indentation RELATIVE to the first line of an example is
# preserved exactly -- this matters for SEXP-44-03, SEXP-45-02, SEXP-42-07,
# SEXP-63-02 and the Section 9.2 memory layouts.
#
# CROSS-FORM LINKS. Where two or more vectors are the same S-expression in
# different representations they carry `equiv_group` and `same_sexp_as`.
# `linkage` says how that equivalence is known:
#   stated    -- the source prints the equivalence ("-- also represents",
#                "is the same S-expression as")
#   inferred  -- it follows from the encoding rules the source gives, but
#                the source does not print these two forms as a pair
#
# DERIVED MATERIAL is never mixed into `input` or `expected`. It appears
# under `derived:` with `in_source: false`.

vectors:

  # ===================================================================
  # Section 1 -- Introduction
  # ===================================================================

  - id: SEXP-1-01
    locator: "RFC 9804 Section 1"
    kind: sample-sexp-mixed-representations
    fidelity: verbatim
    input: '(snicker "abc" (#03# |YWJj|))'
    expected: 'a list of length three: the octet-string "snicker"; the octet-string "abc"; a sub-list containing two elements: the hexadecimal constant #03# (which represents a one-octet-long octet-string with the value of that octet being 0x03) and the base-64 constant |YWJj| (which represents the same octet-string as "abc")'
    notes: "The source's own first example. Four of the five octet-string representation types appear in one expression: token (snicker), quoted-string, hexadecimal and base-64. The source states that |YWJj| and the quoted-string form are the same octet-string, so two forms of one value occur side by side inside a single example."
    derived:
      in_source: false
      canonical_shape: '(7:snicker3:abc(1:<0x03>3:abc))'
      canonical_shape_note: 'The 0x03 octet is not printable, so the canonical form cannot be written out as text here. Shown only to record that the sub-list canonicalizes to two verbatim octet-strings of lengths 1 and 3.'

  # ===================================================================
  # Section 2 -- S-expressions -- Informal Introduction
  # ===================================================================
  #
  # The source prints five representations of the octet-string "abc" in one
  # block and then states: "The above encodings are all equivalent in that
  # they all denote the same octet-string." That sentence is the source's own
  # cross-form assertion, so SEXP-2-01..05 carry linkage: stated. The same
  # equivalence group is extended by the Section 4.1, 4.4 and 4.5 vectors.

  - id: SEXP-2-01
    locator: "RFC 9804 Section 2"
    kind: octet-string-token
    fidelity: verbatim
    input: 'abc'
    expected: 'the octet-string "abc"'
    source_annotation: '-- as a token'
    equiv_group: abc
    linkage: stated
    same_sexp_as:
      - SEXP-2-02
      - SEXP-2-03
      - SEXP-2-04
      - SEXP-2-05
      - SEXP-41-01
      - SEXP-44-01
      - SEXP-44-02
      - SEXP-44-03
      - SEXP-45-01
      - SEXP-45-02
      - SEXP-45-03

  - id: SEXP-2-02
    locator: "RFC 9804 Section 2"
    kind: octet-string-quoted-string
    fidelity: verbatim
    input: '"abc"'
    expected: 'the octet-string "abc"'
    source_annotation: '-- as a quoted string'
    equiv_group: abc
    linkage: stated
    same_sexp_as:
      - SEXP-2-01
      - SEXP-2-03
      - SEXP-2-04
      - SEXP-2-05
      - SEXP-41-01
      - SEXP-44-01
      - SEXP-44-02
      - SEXP-44-03
      - SEXP-45-01
      - SEXP-45-02
      - SEXP-45-03

  - id: SEXP-2-03
    locator: "RFC 9804 Section 2"
    kind: octet-string-hexadecimal
    fidelity: verbatim
    input: '#616263#'
    expected: 'the octet-string "abc"'
    source_annotation: '-- as a hexadecimal string'
    equiv_group: abc
    linkage: stated
    same_sexp_as:
      - SEXP-2-01
      - SEXP-2-02
      - SEXP-2-04
      - SEXP-2-05
      - SEXP-41-01
      - SEXP-44-01
      - SEXP-44-02
      - SEXP-44-03
      - SEXP-45-01
      - SEXP-45-02
      - SEXP-45-03

  - id: SEXP-2-04
    locator: "RFC 9804 Section 2"
    kind: octet-string-verbatim
    fidelity: verbatim
    input: '3:abc'
    expected: 'the octet-string "abc"'
    source_annotation: '-- as a length-prefixed "verbatim" encoding'
    equiv_group: abc
    linkage: stated
    is_canonical_form: true
    notes: 'This is also the canonical representation of the octet-string "abc": Section 6.2 says the canonical form represents each octet-string in verbatim mode. Of the five Section 2 forms exactly one is canonical -- that is the whole content of canonicalization for a bare octet-string.'
    same_sexp_as:
      - SEXP-2-01
      - SEXP-2-02
      - SEXP-2-03
      - SEXP-2-05
      - SEXP-41-01
      - SEXP-44-01
      - SEXP-44-02
      - SEXP-44-03
      - SEXP-45-01
      - SEXP-45-02
      - SEXP-45-03

  - id: SEXP-2-05
    locator: "RFC 9804 Section 2"
    kind: octet-string-base-64
    fidelity: verbatim
    input: '|YWJj|'
    expected: 'the octet-string "abc"'
    source_annotation: '-- as a base-64 encoding of the octet-string "abc"'
    equiv_group: abc
    linkage: stated
    same_sexp_as:
      - SEXP-2-01
      - SEXP-2-02
      - SEXP-2-03
      - SEXP-2-04
      - SEXP-41-01
      - SEXP-44-01
      - SEXP-44-02
      - SEXP-44-03
      - SEXP-45-01
      - SEXP-45-02
      - SEXP-45-03

  - id: SEXP-2-06
    locator: "RFC 9804 Section 2"
    kind: list-mixed-representations
    fidelity: verbatim
    input: '(abc (de #6667#) "ghi jkl")'
    expected: 'a list of three elements: the octet-string "abc"; a sub-list holding the octet-string "de" and the hexadecimal constant #6667#; and the octet-string "ghi jkl"'
    notes: 'The source gives this as the illustration that "A list is represented by using parentheses to surround the sequence of encodings of its elements". The source prints no decoding of #6667# and no canonical form for this example. Note the embedded space in "ghi jkl", which is why that element must be a quoted-string and not a token.'
    derived:
      in_source: false
      hex_6667_decodes_to: 'fg'
      canonical_form: '(3:abc(2:de2:fg)7:ghi jkl)'
      canonical_form_note: 'Derived by applying Section 6.2 -- every octet-string verbatim, no blanks separating elements from each other or from the surrounding parentheses.'

  # ===================================================================
  # Section 4.1 -- Verbatim Representation
  # ===================================================================

  - id: SEXP-41-01
    locator: "RFC 9804 Section 4.1"
    kind: octet-string-verbatim
    fidelity: verbatim
    input: '3:abc'
    expected: 'the octet-string "abc"'
    equiv_group: abc
    linkage: inferred
    is_canonical_form: true
    same_sexp_as:
      - SEXP-2-01
      - SEXP-2-02
      - SEXP-2-03
      - SEXP-2-04
      - SEXP-2-05
    notes: 'The same literal as SEXP-2-04. Repeated in the source as the first sample verbatim encoding; kept as its own vector because its locator differs and a reader of Section 4.1 alone must still find it.'

  - id: SEXP-41-02
    locator: "RFC 9804 Section 4.1"
    kind: octet-string-verbatim
    fidelity: verbatim
    input: '7:subject'
    expected: 'the octet-string "subject"'
    is_canonical_form: true
    equiv_group: subject
    linkage: inferred
    same_sexp_as:
      - SEXP-42-01
      - SEXP-42-03
      - SEXP-43-01

  - id: SEXP-41-03
    locator: "RFC 9804 Section 4.1"
    kind: octet-string-verbatim
    fidelity: verbatim
    input: '4:::":'
    expected: 'the four-octet octet-string colon, colon, double-quote, colon'
    is_canonical_form: true
    notes: 'THE vector to keep for framing. Every one of its four payload octets is punctuation that would need escaping, or would terminate the token, in some other representation: two colons, a double-quote and a colon. The verbatim length prefix means none of them is special. A parser that stops at the first colon after the length, or that treats the double-quote as a delimiter, fails here and nowhere else in Section 4.1.'

  - id: SEXP-41-04
    locator: "RFC 9804 Section 4.1"
    kind: octet-string-verbatim
    fidelity: verbatim
    input: '12:hello world!'
    expected: 'the octet-string "hello world!"'
    is_canonical_form: true
    notes: 'Contains a space and an exclamation point. The exclamation point is in the Section 3 "unused and unavailable" set, legal here precisely because Section 3 exempts verbatim encodings; the space would end a token. Neither can be written as a token.'

  - id: SEXP-41-05
    locator: "RFC 9804 Section 4.1"
    kind: octet-string-verbatim
    fidelity: verbatim
    input: '10:abcdefghij'
    expected: 'the octet-string "abcdefghij"'
    is_canonical_form: true
    notes: 'The only Section 4.1 example with a two-digit length. Checks that the parser reads digits up to the colon rather than exactly one digit.'

  - id: SEXP-41-06
    locator: "RFC 9804 Section 4.1"
    kind: octet-string-verbatim
    fidelity: verbatim
    input: '0:'
    expected: 'the zero-length octet-string'
    is_canonical_form: true
    equiv_group: empty-octet-string
    linkage: inferred
    same_sexp_as:
      - SEXP-44-04
      - SEXP-45-06
      - SEXP-62-05
    notes: 'The canonical form of the empty octet-string, and the one case where the Section 7.1 decimal rule matters: decimal = %x30 / (%x31-39 *DIGIT) admits a bare "0" but forbids "00" or "007", so there is exactly one verbatim spelling of the empty string.'

  # ===================================================================
  # Section 4.2 -- Quoted-String Representation
  # ===================================================================
  #
  # SEXP-42-E01..E17 are the seventeen rows of the escape-convention table,
  # in source order. They are rows of a normative table, not standalone
  # S-expressions, so `input` is the row as printed and `expected` is what
  # the row says the escape denotes. E12 and E13 are the two rows carrying a
  # BCP 14 keyword (rfc-9804#R-0014, rfc-9804#R-0015).
  #
  # E09 is the one value in this file containing BOTH a backslash and an
  # apostrophe. Per the quoting rules at the head of this file it is written
  # single-quoted with YAML's doubled-apostrophe convention: a conforming YAML
  # parser reads one apostrophe, bin/_yaml.py hands back two.

  - id: SEXP-42-E01
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\a     -- audible alert (bell)'
    expected: 'the octet 0x07'
    derived:
      in_source: false
      octet: '0x07'
      octet_note: 'The source names the character but prints no octet value. BEL is 0x07 in ASCII [RFC0020]; the same holds for E02-E07.'

  - id: SEXP-42-E02
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\b     -- backspace'
    expected: 'the octet 0x08'
    derived:
      in_source: false
      octet: '0x08'

  - id: SEXP-42-E03
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\t     -- horizontal tab'
    expected: 'the octet 0x09'
    derived:
      in_source: false
      octet: '0x09'

  - id: SEXP-42-E04
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\v     -- vertical tab'
    expected: 'the octet 0x0B'
    derived:
      in_source: false
      octet: '0x0B'
      octet_note: 'Section 7.1 defines vtab = %x0B as a local rule, because RFC 5234 has no core rule for it. Same for ff = %x0C at E06.'

  - id: SEXP-42-E05
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\n     -- new-line'
    expected: 'the octet 0x0A'
    derived:
      in_source: false
      octet: '0x0A'

  - id: SEXP-42-E06
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\f     -- form-feed'
    expected: 'the octet 0x0C'
    derived:
      in_source: false
      octet: '0x0C'

  - id: SEXP-42-E07
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\r     -- carriage-return'
    expected: 'the octet 0x0D'
    derived:
      in_source: false
      octet: '0x0D'

  - id: SEXP-42-E08
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\"     -- double-quote'
    expected: 'the octet 0x22'
    notes: 'One of the two characters Section 7.1 printable excludes (%x20-21 / %x23-5B / %x5D-7E), so inside a quoted-string it can only appear escaped. The other is the backslash, E11.'

  - id: SEXP-42-E09
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\''     -- single-quote'
    expected: 'the octet 0x27'
    notes: 'Section 7.1 defines quote = %x27 as a local rule. Note the asymmetry with E08: the single-quote is NOT excluded from printable, so it may appear escaped or bare inside a quoted-string, and both spellings denote the same octet. That is one more way for two representations to denote one value, and the canonical form removes it by admitting no quoted-strings at all.'
    yaml_note: 'The only value in this file containing both a backslash and an apostrophe. Written single-quoted with the apostrophe doubled; bin/_yaml.py does not undo the doubling and returns one extra apostrophe for this value alone.'

  - id: SEXP-42-E10
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\?     -- question mark'
    expected: 'the octet 0x3F'
    notes: 'The question mark is in the Section 3 "unused and unavailable" set, which Section 3 exempts inside quoted-strings. Like E09 it is also in printable, so it may appear bare as well.'

  - id: SEXP-42-E11
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\\     -- back-slash'
    expected: 'the octet 0x5C'
    notes: 'Section 7.1 backslash = %x5C. Excluded from printable, so inside a quoted-string it can only appear escaped.'

  - id: SEXP-42-E12
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\ooo   -- character with octal value ooo (all three digits MUST be present)'
    expected: 'the octet whose value is the three octal digits ooo'
    constrains: rfc-9804#R-0014
    notes: 'Carries a BCP 14 keyword. Section 7.1 encodes the fixed width as 3(%x30-37), so grammar and prose agree. This is the "more restrictive" octal format the Section 4.2 preamble refers to: C itself admits one, two or three digits. The source prints the row across two lines; rejoined here with the line break and following indent as a single space, per the convention in requirements.yaml.'

  - id: SEXP-42-E13
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\xhh   -- character with hexadecimal value hh (both digits MUST be present)'
    expected: 'the octet whose value is the two hexadecimal digits hh'
    constrains: rfc-9804#R-0015
    notes: 'Carries a BCP 14 keyword. Section 7.1 encodes it as (%x78 2HEXDIG). The "more restrictive" hexadecimal format: C admits any number of hex digits. Rejoined from two source lines as E12 was.'

  - id: SEXP-42-E14
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\<carriage-return>   -- causes carriage-return to be ignored.'
    expected: 'no octet at all; the line terminator is removed from the decoded string'
    notes: 'E14-E17 are the extension to C that the Section 4.2 preamble names. They produce NO octet, which is what makes them different in kind from E01-E13: they are the only escapes whose effect is deletion. SEXP-42-07 is the worked example.'

  - id: SEXP-42-E15
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\<line-feed>         -- causes line-feed to be ignored.'
    expected: 'no octet at all; the line terminator is removed from the decoded string'

  - id: SEXP-42-E16
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\<carriage-return><line-feed>   -- causes CRLF to be ignored.'
    expected: 'no octet at all; the CRLF pair is removed from the decoded string'
    notes: 'Rejoined from two source lines.'

  - id: SEXP-42-E17
    locator: "RFC 9804 Section 4.2 (escape conventions)"
    kind: escape-table-row
    fidelity: verbatim
    input: '\<line-feed><carriage-return>   -- causes LFCR to be ignored.'
    expected: 'no octet at all; the LFCR pair is removed from the decoded string'
    notes: 'Rejoined from two source lines. LFCR as well as CRLF -- Section 7.1 escaped includes both orders, (CR LF) / (LF CR).'

  - id: SEXP-42-01
    locator: "RFC 9804 Section 4.2 (examples)"
    kind: octet-string-quoted-string
    fidelity: verbatim
    input: '"subject"'
    expected: 'the octet-string "subject"'
    equiv_group: subject
    linkage: inferred
    same_sexp_as:
      - SEXP-41-02
      - SEXP-42-03
      - SEXP-43-01

  - id: SEXP-42-02
    locator: "RFC 9804 Section 4.2 (examples)"
    kind: octet-string-quoted-string
    fidelity: verbatim
    input: '"hi there"'
    expected: 'the octet-string "hi there"'
    notes: 'Contains a space, so it cannot be a token.'

  - id: SEXP-42-03
    locator: "RFC 9804 Section 4.2 (examples)"
    kind: octet-string-quoted-string
    fidelity: verbatim
    input: '7"subject"'
    expected: 'the octet-string "subject"'
    equiv_group: subject
    linkage: inferred
    same_sexp_as:
      - SEXP-41-02
      - SEXP-42-01
      - SEXP-43-01
    notes: 'The optional decimal length in use (rfc-9804#R-0013). Same value as SEXP-42-01 with a length prefix added, which is the Section 4.2 pair demonstrating that the length changes nothing about what is denoted.'

  - id: SEXP-42-04
    locator: "RFC 9804 Section 4.2 (examples)"
    kind: octet-string-quoted-string
    fidelity: verbatim
    input: '"\xFE is the same octet as \376"'
    expected: 'a 30-octet octet-string in which the first and last octets are both 0xFE'
    notes: 'KEEP THIS ONE. The source writes the SAME octet two ways inside a single string: \xFE is hexadecimal 0xFE and \376 is octal 376, and octal 376 = 254 = 0xFE. The string is self-describing and self-demonstrating. It is the clearest example in the document of why a canonical form is needed at all -- one value, two spellings, inside one literal.'
    derived:
      in_source: false
      octal_376_decimal: 254
      octal_376_hex: '0xFE'
      decoded_length: 30
      decoded_length_note: 'Counted from the decoded form: 0xFE + " is the same octet as " (22 octets) + 0xFE = 24. The source prints no length for this example and asserts no length; 30 is the count of characters as PRINTED, 24 is the count of octets after escape conversion. Recorded because the difference between the two is exactly what rfc-9804#R-0011 defines the optional length to mean.'

  - id: SEXP-42-05
    locator: "RFC 9804 Section 4.2 (examples)"
    kind: octet-string-quoted-string
    fidelity: verbatim
    input: '3"\n\n\n"'
    expected: 'the three-octet octet-string 0x0A 0x0A 0x0A'
    notes: 'The length 3 counts DECODED octets, not the six characters printed between the quotes. This is the worked demonstration of rfc-9804#R-0011 and the vector that catches a parser counting raw characters.'

  - id: SEXP-42-06
    locator: "RFC 9804 Section 4.2 (examples)"
    kind: octet-string-quoted-string
    fidelity: verbatim
    input: '"This has\n two lines."'
    expected: 'the octet-string "This has" + 0x0A + " two lines."'
    notes: 'A \n escape that DOES produce an octet. Contrast SEXP-42-07, where a backslash immediately before a real line break produces none. The two examples sit adjacent in the source for exactly that contrast.'

  - id: SEXP-42-07
    locator: "RFC 9804 Section 4.2 (examples)"
    kind: octet-string-quoted-string
    fidelity: verbatim
    input_lines:
      - '"This has \'
      - ' one line."'
    expected: 'the octet-string "This has  one line." on a single line, with the line terminator removed and both surrounding spaces kept'
    notes: 'The worked example of escape rows E14-E17. The backslash is immediately followed by the physical line break, which is therefore ignored. Two spaces survive in the decoded value: the one before the backslash and the one at the start of the continuation line. Printed across two lines in the source, so it is carried here as input_lines with no single-line input key, per the convention at the head of this file.'

  - id: SEXP-42-08
    locator: "RFC 9804 Section 4.2 (examples)"
    kind: octet-string-quoted-string
    fidelity: verbatim
