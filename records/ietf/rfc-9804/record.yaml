usefulness:
  verdict: useful
  reason: "DEC-002 option 1, and the only candidate whose canonical form states uniqueness as an explicit design goal (§6.2). Its §6.2/§6.4 canonical-for-signing versus advanced-for-display split is the architectural ancestor of R-O-05, and §10 imposes no verification ordering, so unlike RFC 8785 it does not conflict with R-O-05."
  assessed: "2026-10-04"
distillation:
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "91 verbatim statements and blocks, Abstract through Appendix A, in source order; 8 carry a BCP 14 keyword (12 occurrences), 79 are flagged lowercase/implied, and 4 carry no keyword and are deliberately unflagged (the §1.4 boilerplate, the §11 IANA non-action, and the two §12 reference lists). The flag density is itself the finding: 12 keyword occurrences across 1141 lines means almost all binding content in this document is stated in lowercase."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "66 entries R-0001 to R-0066 in source order; 12 carry a BCP 14 verb and match the source count exactly (7 MUST, 2 MAY, 2 RECOMMENDED, 1 OPTIONAL), 54 are lowercase obligations with verb none, 1 (R-0054) is kind inferred and declared non-verbatim; reconciliation is non-empty and records the lowercase ratio, the two sentences the source states identically in two sections and which are therefore extracted twice, and the three two-keyword sentences that are split so each half is separately testable"
      reviewed_by: ""
    - kind: schema
      path: distilled/schema
      coverage: "3 files, ALL VERBATIM — §7.1 advanced transport (23 rules), §7.2 canonical (2 rules), §7.3 basic transport (2 rules) — each carrying its verbatim-region sha256 and source line range. Nothing derived: RFC 9804 ships its own RFC 5234 ABNF, which is the single most useful thing about this record, because the canonical form of DEC-002 option 1 is published as a GRAMMAR rather than as a list of encoder obligations. Pass 3 re-verified all three region digests, confirmed each region is byte-exact against its claimed source lines, and checked closure: 27 rules, no undefined references remaining, and no rule name colliding with an RFC 5234 core rule — the defect class that bit RFC 8785 is absent here. One source defect recorded, not repaired: §7.2 and §7.3 are not self-contained, importing verbatim, decimal, c-sexp, whitespace, base-64-chars and base-64-end from §7.1."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "15 structures. Applicability is partial and stated in-file, since the source defines no wire messages, headers, envelopes, media type or framing and §11 has no IANA actions. What is captured is each representation decomposed: the five octet-string forms of §4, the display-hint, the list, the three §6 representation types, the §6.1 brace wrapper as its own structure, and the three §9.2 in-memory records marked normative_status suggestive because §9 calls them only sketched. constrained_by wired on every field with none left empty; the five requirements wired to no field are named in-file with the reason."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/vectors.yaml
      coverage: "78 vectors, every example the source prints, across 14 section groups; §3, §7 and §9.1 print none and are the only example-free sections of the body. Pass 1 was interrupted after 7 vectors while already referring forward to ids it had not written; pass 3 added the remaining 71 and corrected the stale vector_count from 99 to 78, recording the enumeration in count_reconciliation. Includes one SOURCE DEFECT (SEXP-46-01): the §4.6 UTF-8 display-hint example prints \\xC3\\xB7, which is U+00F7 DIVISION SIGN, where its prose says o-with-umlaut (U+00F6, \\xC3\\xB6), so the example decodes to b-divide-b-smiley and not to the string named. Found by decoding the octets, not by reading them."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "DEC-002 option 1 scored against all six canonical-encoding conditions, which the topic answer named as the one remaining blocker; 3 adopt, 4 adapt, 5 reject; decision mapping across DEC-002, DEC-003, R-M-02, R-O-03, R-O-05, R-M-12/ADR-0001, ARCH-0002 P4 and P5, and D-3; 6 open questions. Headline evidence, recorded as evidence and deciding nothing: option 1 sits on the right side of all four grounds the topic gives for withdrawing option 3, and also wins the namespace-governance criterion the topic records as option 3's outright win. Two counterweights are recorded with equal prominence — the data model is far poorer than CBOR's or JSON's, so every ARCH-0001 §4 type needs a hand-built mapping where injectivity must be re-established field by field, and library availability, which DEC-002 names as a driver, is thin."
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "RFC 9804 defines no exchange. There are no roles, no messages between parties, no error signalling and no processing order anywhere in the document; it prints no numbered procedure of any kind, and §6.3's two numbered items are a pair of forms, not steps. The absence is load-bearing rather than incidental and is argued in distilled/design-notes.md condition 3 instead of being buried in this reason: §10 is the whole of the security considerations and imposes NO verification ordering, which is exactly why — unlike RFC 8785 §5, whose mandated ordering is what R-O-05 forbids — this record does not conflict with R-O-05. The scaffold stubs were removed rather than left as files of TODOs, as the rfc-8949 record did for the same two kinds."
    - kind: state-machine
      reason: "No lifecycle is defined. Nothing in the document registers, issues, rolls over, expires or revokes anything; the one stateful process is parsing a single S-expression, which has no persistent states, triggers or guards."
