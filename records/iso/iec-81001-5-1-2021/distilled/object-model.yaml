gaps:
  - "Support-responsibility class per Component (MAINTAINED / SUPPORTED / REQUIRED) with nested clause applicability and downgrade transitions — tmodel Component has no such attribute."
  - "Risk transfer from manufacturer to operator as a governed, documented edge (documentation mitigation with a recipient)."
  - "Conformance route facet on Product (full vs transitional/legacy)."
  - "Partial-strength mapping (81001-5-1 derived from but not sufficient for 62443-4-1) — R-044 maps_to needs a strength/direction attribute."
  - "Alternative terminology mapping in a declaration of conformance (ISH1 4.3 b) — the same 'canonical + local name' need DL-0009 identified for gates."
