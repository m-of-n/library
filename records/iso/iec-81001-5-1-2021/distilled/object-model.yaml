schema: "library-object-model/v1"
record: iec-81001-5-1-2021
source_version: "IEC 81001-5-1:2021 Ed.1.0, corrected version 2025-12 incl. ISH1:2025 — FREE PREVIEW ONLY"
note: >
  Object-model pass over the free IEC webstore preview (30 pp: ISH1 full text, Foreword, Introduction 0.1-0.3,
  Scope, Clause 2, ToC, Figure 2, Bibliography). Clause 3 definitions and Clauses 4-9 were NOT readable, so
  attributes are limited to what the preview states; objects named only by a ToC title are kind: inferred.
  Small-caps defined terms are kept in UPPER CASE as in the source.
objects:
  - {name: MANUFACTURER, definition: "the party responsible for the ACTIVITIES specified in the normative clauses", attributes: [], locator: "0.1 ('Normative clauses of this document specify ACTIVITIES that are the responsibility of the MANUFACTURER')", kind: stated, tmodel_mapping: "Party (manufactured_by role)"}
  - {name: HEALTH_SOFTWARE, definition: "software as part of a medical device; software as part of hardware specifically intended for health use; SaMD; software-only PRODUCT for other health use", attributes: [conformance_route (full|transitional)], locator: "0.2", kind: stated, tmodel_mapping: "Product"}
  - {name: TRANSITIONAL_HEALTH_SOFTWARE, definition: "HEALTH SOFTWARE developed before IEC 81001-5-1 existed; an attribute of the whole product, not a SOFTWARE ITEM category", attributes: [], locator: "0.3; ISH1 4.3 NOTE 3; Annex F (title)", kind: stated, tmodel_mapping: "new — legacy-product conformance facet"}
  - {name: SOFTWARE_ITEM, definition: "a logical part of the HEALTH SOFTWARE supplied by others", attributes: [category (MAINTAINED|SUPPORTED|REQUIRED)], locator: "ISH1 4.3 NOTE 2", kind: stated, tmodel_mapping: "Component"}
