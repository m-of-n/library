schema: "library-state-machine/v1"
record: iec-81001-5-1-2021
machines:
  - id: software-item-classification
    entity: "SOFTWARE ITEM (of a HEALTH SOFTWARE product)"
    kind: stated
    source: "IEC 81001-5-1:2021/ISH1:2025, Interpretation of 4.3, Table 1 and NOTE 2 (preview ISH1 pp.2-3)"
    states:
      - {id: MAINTAINED, definition: "manufacturer provides security updates (6.3.2 delivery, 6.3.3 integrity) and notifies users (6.3.1); risks managed (5.2.3)", locator: "ISH1 Table 1"}
      - {id: SUPPORTED, definition: "includes MAINTAINED; operator may control updates; manufacturer documents updates (6.3.1) and manages risks (5.2.3)", locator: "ISH1 Table 1; NOTE 2"}
      - {id: REQUIRED, definition: "includes SUPPORTED; manufacturer cannot obtain security notifications/updates (e.g. end-of-support); risks managed (5.2.3) by other means", locator: "ISH1 Table 1; NOTE 2"}
    transitions:
      - {from: MAINTAINED, to: SUPPORTED, trigger: "manufacturer re-categorises (downgrade)", guard: "requirements from associated clauses evaluated to ensure appropriate risk transfer to operators", locator: "ISH1 4.3 NOTE 2"}
      - {from: MAINTAINED, to: REQUIRED, trigger: "manufacturer re-categorises (downgrade)", guard: "same", locator: "ISH1 4.3 NOTE 2"}
      - {from: SUPPORTED, to: REQUIRED, trigger: "manufacturer re-categorises (downgrade)", guard: "same", locator: "ISH1 4.3 NOTE 2"}
    notes: "Upgrades are not discussed ('typically done by downgrading'). Category nesting is for clause applicability only (ISH1 a)). TRANSITIONAL is a product-level attribute, not a fourth category (NOTE 3)."
  - id: health-software-conformance-route
    entity: "HEALTH SOFTWARE product"
    kind: stated
    source: "Introduction 0.3; ISH1 NOTE 3"
    states:
      - {id: transitional, definition: "developed before IEC 81001-5-1 existed; conformance via Annex F activities only", locator: "0.3; ISH1 NOTE 3"}
      - {id: full, definition: "conformance by implementing Clauses 4-9", locator: "0.3"}
    transitions: []
    notes: "Two alternative conformance claims, not a progression; Annex F content (F.2 gap closure, F.4 post-release) not read."
