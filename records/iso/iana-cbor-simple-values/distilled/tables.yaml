# Defects in the SOURCE PAGE, not in this transcription. Every row above is
# byte-for-byte what the snapshot prints, in page order; the page's own
# statement of its value space is what does not cohere. Recorded rather than
# repaired because repairing it would invent assignments IANA has not made.
# Checked by computing coverage over the parsed rows: the CBOR Tags registry
# snapshot beside this one has NO gap and NO overlap across all 358 of its
# rows, so this is specific to this page.
source_defects:
  - id: D-1
    kind: gap
    what: "Simple values 32-57 are covered by NO row of the assignment table."
    evidence: "The rows run 0-19, 20, 21, 22, 23, 24-31, 58-255, 59, 60-255. After `24-31 Reserved` the next row begins at 58, so 26 values in the middle of the space are neither assigned, Reserved nor Unassigned. The Registration Procedures table does place them: `32-255 Specification Required`, so the page asserts a procedure for values its assignment table omits."
    matters_because: "A reader cannot take `Unassigned` off this table as the complement of the assigned values. Any claim of the form `simple value N is unassigned` for N in 32-57 is unsupported by the registry as snapshotted. library#39 holds these registries because option 5 of DEC-002 is defined by what it EXCLUDES, which makes the unassigned space load-bearing."
  - id: D-2
    kind: overlap
    what: "The row `58-255 Unassigned` overlaps the two rows that follow it."
    evidence: "Value 59 is separately registered (TEMPORARY, expires 2026-12-16) and 60-255 is separately Unassigned, yet both fall inside the span 58-255. So 59 is simultaneously Unassigned and assigned, and 60-255 is stated twice."
    matters_because: "Read in page order the last row wins for 60-255 and the 59 row wins for 59, which is almost certainly the intent — but the table does not say so, and a tool that reads rows into a map keyed by value gets a different answer depending on iteration order."
    likely_cause: "[analysis, not stated by the page] When 59 was registered on 2025-12-16 a pre-existing `32-255 Unassigned` row needed splitting into 32-58, 59 and 60-255. The upper two parts exist; the lower bound of the first was written 58 instead of 32, which produces D-1 and D-2 together as one edit."
  - id: D-3
    kind: gap
    what: "The Registration Procedures table covers 0-19 and 32-255, so values 20-31 are in no procedure range."
    evidence: "Its two rows are `0-19 Standards Action` and `32-255 Specification Required`. Values 20-23 are assigned (False, True, Null, Undefined) and 24-31 are Reserved, so the omission is of the already-allocated block rather than of free space."
    matters_because: "Milder than D-1: nothing is unallocated here, so no assignment claim rests on it. It does mean the page states no procedure by which 24-31 could ever be un-Reserved."
