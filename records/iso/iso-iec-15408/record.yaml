  note: "The ISO text was not obtained. What was read is the CCRA's free publication of Common Criteria CC:2022 Revision 1 (November 2022, CCMB-2022-11-001 for Part 1), whose Foreword says the ISO version of CC:2022 is ISO/IEC 15408-1:2022 through 15408-5:2022. The digest is of Part 1. Part 2 sha256 16c853ad1ccf6eb10120726b15fe9ecfa95ac381f85d8edb84c12b0d0ecf1b01, Part 3 96d471dec3b1d79da2429dd71cbde379b31d6d866be8ae3e5b2b081d6846a5b8, Part 4 fd57a19ef0f623fc8376c23a583fde47547c05ab634228269cebd3243af75e96, Part 5 c64f45dd82cfc6f8e4c289d4faad79f75e759f14e17c27b4c8cb2b69ff96daf6. The 2022 ISO parts are withdrawn: Internet Archive captures of the ISO catalogue (www.iso.org returned 403 to our client) show ISO/IEC 15408-1:2026 Edition 5 of 2026-05, 15408-3:2026 Edition 5 of 2026-05 and 15408-5:2026 Edition 2 of 2026-04 as Published, and the captured price for 15408-1, -3 and -5 is CHF 0. Parts 2 and 4 of 2026 were not checked. The 2026 text was not read, and the CC portal page fetched 2026-11-01 lists no CC release later than CC:2022."
