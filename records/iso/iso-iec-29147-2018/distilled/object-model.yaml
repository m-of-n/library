schema: "library-object-model/v1"
record: iso-iec-29147-2018
source_scope: "free preview only (Clauses 1-5.3.2, Figure 1, Contents)"
reviewed_by: ""
note: >
  Object-model pass: "what entity types and relationship edges does ISO/IEC 29147 assume or define?"
  `stated` = defined in Clause 3 or drawn in Figure 1 / stated in visible text; `inferred` = our reading,
  most often from a clause HEADING whose body is paywalled (locator says so). tmodel_mapping names the
  ARCH-0001 v0.2.0 class (or DL-0009 proposal) it lands on.

objects:
  - name: Vulnerability
    definition: "functional behaviour of a product or service that violates an implicit or explicit security policy"
    attributes: [identifier (CVE, §4/§7.4.2), description, impact, severity (CVSS), affected_products]
    locator: "§3.1; Introduction; §5.4.5 heading; §7.4 headings"
    kind: stated
    tmodel_mapping: "Finding/Vulnerability (ARCH-0001 §1 layer 3)"
    notes: "Narrower than the ISO/IEC 27000 risk sense (Note 1 to 3.1: 27002's 'technical vulnerability'). The Introduction widens the bearer set to 'system, product, component, or service'."
  - name: PotentialVulnerability
    definition: "a reported but not yet verified vulnerability (the object of a report; 'potential vulnerability' in §3.5)"
    attributes: [verification_status]
    locator: "§3.5; Figure 1 'Vulnerability verified?'"
    kind: inferred
    tmodel_mapping: "Finding (status: unverified) — or an Assertion about a Vulnerability awaiting Review"
    notes: "The standards treat verification as the gate from potential to actual; in tmodel this is exactly the Assertion → Review acceptance pattern (ARCH-0001 §4)."
  - name: Disclosure
    definition: "act of initially providing vulnerability (3.1) information to a party that was not believed to be previously aware"
    attributes: [from_party, to_party, time]
    locator: "§3.2"
    kind: stated
    tmodel_mapping: "new (an Activity in PROV-O terms, ARCH-0001 §4)"
    notes: "An EVENT, not a document. The same word is used broadly for the whole capability (Introduction)."
  - name: Coordination
    definition: "set of activities including identifying and engaging stakeholders, mediating, communicating, and other planning in support of vulnerability (3.1) disclosure (3.2)"
    locator: "§3.3"
    kind: stated
    tmodel_mapping: "new (Activity)"
  - name: Vendor
    definition: "individual or organization that is responsible for remediating vulnerabilities"
    attributes: [psirt_contact]
    locator: "§3.4 (Note 1: developer, maintainer, producer, manufacturer, supplier, installer, or provider)"
    kind: stated
    tmodel_mapping: "Party (ARCH-0001 §2b) — 'vendor' is a RELATIONAL role there (vendor-of edge), which matches: 29147 defines vendor by responsibility for remediation, not by organization type"
  - name: Reporter
    definition: "individual or organization that notifies a vendor (3.4) or coordinator (3.6) of a potential vulnerability (3.1)"
    locator: "§3.5 (Notes 1-3: anyone; not necessarily the discoverer; aka researcher, finder)"
    kind: stated
    tmodel_mapping: "Party role (edge reported_by, ARCH-0001 §2b)"
  - name: Coordinator
    definition: "individual or organization that performs coordination (3.3)"
    locator: "§3.6; §5.5.5 heading"
    kind: stated
    tmodel_mapping: "Party role (e.g. a CERT/CSIRT or CNA; ARCH-0001 §2b lists 'cna' as an intrinsic classification)"
  - name: User
    definition: "(definition in §5.5.2 not visible) the party at risk that consumes advisories and deploys remediations"
    locator: "§5.5.2 heading; Scope"
    kind: inferred
    tmodel_mapping: "Party role (operator / owner / consumer edge)"
  - name: Remediation
    definition: "change made to a product or service to remove or mitigate a vulnerability (3.1)"
    attributes: [form (binary replacement | configuration change | source patch and recompile), authenticity (§7.8.2), deployment (§7.8.3)]
    locator: "§3.7; §7.8 headings"
    kind: stated
    tmodel_mapping: "MitigationInstance with kind=technical (R-040); 'remove' vs 'mitigate' maps to effectiveness"
  - name: Mitigation
    definition: "workaround or countermeasure ('Mitigations are also called workarounds or countermeasures')"
    locator: "§3.7 Note 1"
    kind: stated
    tmodel_mapping: "MitigationInstance (kind technical or process, R-040)"
    notes: "29147 makes mitigation a sub-case of remediation ('remove or mitigate'). tmodel's MitigationInstance is the broader class; treat 29147 Remediation as MitigationInstance with a 'removes' vs 'mitigates' flag."
  - name: Advisory
    definition: "document or message that provides vulnerability (3.1) information intended to reduce risk"
    attributes: [identifiers, date_and_time, title, overview, affected_products, intended_audience, localization, description, impact, severity, remediation, references, credit, contact_information, revision_history, terms_of_use]
    locator: "§3.8; §7.4.2-§7.4.17 headings"
    kind: stated
    tmodel_mapping: "new — a published, versioned document (R-043 governed view) that also realises MitigationInstance kind=documentation (R-040) for users"
  - name: VulnerabilityReport
    definition: "the notification a reporter sends (content per §9.3.2 / Annex B, not visible)"
    attributes: [tracking_id (§6.2.4), acknowledged (§6.2.5)]
    locator: "§3.5; §6.2 headings; Figure 1"
    kind: inferred
    tmodel_mapping: "Assertion (proposed, unreviewed) about a Vulnerability, with PROV Agent = Reporter (ARCH-0001 §4)"
  - name: VulnerabilityDisclosurePolicy
    definition: "the vendor's published policy; required element: preferred contact mechanism; recommended and optional elements per §9.3/§9.4"
    attributes: [preferred_contact_mechanism, report_contents, secure_communication_options, communication_expectations, scope, publication, recognition, legal_considerations, disclosure_timeline]
    locator: "Figure 1; Clause 9 headings; Annex A"
    kind: stated
    tmodel_mapping: "WorkProduct / governed document (R-043); evidence for a Requirement (R-042)"
  - name: DisclosureCapability
    definition: "'capability to receive and publish vulnerability information'"
    locator: "Figure 1; Introduction; §6.2.2 heading"
    kind: stated
    tmodel_mapping: "new — an organisational capability (process-kind mitigation, R-040)"
  - name: Product
    definition: "(§5.4.3 body not visible)"
    locator: "§5.4.3 heading"
    kind: inferred
    tmodel_mapping: "Product (ARCH-0001 §1 layer 1)"
  - name: Service
    definition: "(§5.4.4 body not visible) — online services are in scope (Scope; 30111 §6.2.2 'product or online service')"
    locator: "§5.4.4 heading"
    kind: inferred
    tmodel_mapping: "Product (service variant) — tmodel has no distinct online-service class"
  - name: System
    locator: "§5.4.1 heading"
    kind: inferred
    tmodel_mapping: "ProductInstance / Deployment"
  - name: Component
    locator: "§5.4.2 heading"
    kind: inferred
    tmodel_mapping: "Component (CPE/purl)"
  - name: Embargo
    definition: "(§5.6.8 body not visible) a period during which vulnerability information is withheld pending coordinated release"
    locator: "§5.6.8 heading"
    kind: inferred
    tmodel_mapping: "new (time-boxed constraint on a Disclosure)"
  - name: Phase
    definition: "Preparation, Receipt, Verification, Remediation development, Release, Post-release"
    locator: "§5.6.2-§5.6.7 headings"
    kind: inferred
    tmodel_mapping: "not LifecyclePhase (product lifecycle) — these are phases of a VULNERABILITY's handling; closer to DEC-009 mitigation lifecycle states"

edges:
  - {name: notifies, from: Reporter, to: [Vendor, Coordinator], cardinality: "N:M", definition: "reporter notifies a vendor or coordinator of a potential vulnerability", locator: "§3.5", kind: stated, tmodel_mapping: "reported_by (inverse) on Finding/Vulnerability"}
  - {name: concerns, from: VulnerabilityReport, to: PotentialVulnerability, cardinality: "N:1", locator: "§3.5", kind: inferred, tmodel_mapping: "Assertion subject"}
  - {name: responsible_for_remediating, from: Vendor, to: Vulnerability, cardinality: "N:M", definition: "vendor = 'responsible for remediating vulnerabilities'", locator: "§3.4", kind: stated, tmodel_mapping: "affects/vendor-of (Product manufactured_by Party)"}
  - {name: performs, from: Coordinator, to: Coordination, cardinality: "1:N", locator: "§3.6", kind: stated, tmodel_mapping: "PROV wasAssociatedWith"}
  - {name: supports, from: Coordination, to: Disclosure, cardinality: "N:M", locator: "§3.3", kind: stated, tmodel_mapping: "none"}
  - {name: provides_information_to, from: Disclosure, to: "Party (not previously aware)", cardinality: "N:1", locator: "§3.2", kind: stated, tmodel_mapping: "none"}
  - {name: present_in, from: Vulnerability, to: [Product, Service, System, Component], cardinality: "N:M", definition: "'present in a system, product, component, or service'", locator: "Introduction; §3.1", kind: stated, tmodel_mapping: "affects / uses_component propagation (ARCH-0001 §5)"}
  - {name: removes_or_mitigates, from: Remediation, to: Vulnerability, cardinality: "N:M", locator: "§3.7", kind: stated, tmodel_mapping: "MitigationInstance mitigates ThreatInstance/Vulnerability"}
  - {name: changes, from: Remediation, to: [Product, Service], cardinality: "N:1", locator: "§3.7", kind: stated, tmodel_mapping: "produces a new ProductInstance version"}
  - {name: provides_information_about, from: Advisory, to: Vulnerability, cardinality: "1:N", locator: "§3.8", kind: stated, tmodel_mapping: "new"}
  - {name: identifies_affected, from: Advisory, to: [Product, Service], cardinality: "N:M", locator: "§7.4.6 heading", kind: inferred, tmodel_mapping: "affects"}
  - {name: references_remediation, from: Advisory, to: Remediation, cardinality: "N:M", locator: "§7.4.12 heading; Figure 1 dashed arrow", kind: inferred, tmodel_mapping: "new"}
  - {name: intended_for, from: Advisory, to: User, cardinality: "N:M", locator: "§3.8 Note 1; §7.4.7 heading", kind: stated, tmodel_mapping: "none"}
  - {name: publishes, from: Vendor, to: [Advisory, VulnerabilityDisclosurePolicy], cardinality: "1:N", locator: "Figure 1", kind: stated, tmodel_mapping: "published_by (Party)"}
  - {name: acknowledges, from: Vendor, to: VulnerabilityReport, cardinality: "1:N", locator: "Figure 1; §6.2.5 heading", kind: stated, tmodel_mapping: "Review (status: received)"}
  - {name: verifies, from: Vendor, to: PotentialVulnerability, cardinality: "1:N", locator: "Figure 1 (30111 lane)", kind: stated, tmodel_mapping: "Review (verdict) on the Assertion"}
  - {name: depends_on, from: Product, to: [Product, Component], cardinality: "N:M", locator: "§5.4.6 Product interdependency heading", kind: inferred, tmodel_mapping: "composed_of / uses_component"}
  - {name: reports_to, from: Vendor, to: Vendor, cardinality: "N:M", definition: "vendor reports vulnerability information to other vendors", locator: "§8.2.3 heading", kind: inferred, tmodel_mapping: "none (multi-vendor coordination)"}
  - {name: used_in_conjunction_with, from: "ISO/IEC 29147 disclosure process", to: "ISO/IEC 30111 handling process", cardinality: "1:1", locator: "§5.3.1 (shall)", kind: stated, tmodel_mapping: "R-044 crosswalk edge between library records"}

gaps:
  - "tmodel has no Advisory / published-notice object; an advisory is both a governed document (R-043) and a user-facing mitigation of kind documentation (R-040)."
  - "tmodel has no Disclosure/Coordination EVENT objects; PROV-O Activity could carry them but nothing names them."
  - "Verification of a PotentialVulnerability is the Assertion→Review acceptance pattern; ARCH-0001 §4 should name 'vulnerability report' as one of its Assertion sources."
  - "Embargo (time-boxed withholding) has no counterpart; it is a guard on publishing a governed view."
  - "Vulnerability handling phases (Receipt…Post-release) are a per-vulnerability lifecycle, distinct from the product LifecyclePhase axis (ARCH-0001 §3b) — DEC-009's mitigation lifecycle is the nearest home."
  - "Service (online service) is not distinguished from Product in ARCH-0001."
