schema: "library-messages/v1"
record: iso-iec-29147-2018
source_scope: "free preview only"
reviewed_by: ""
note: >
  STRUCTURE ONLY. The field lists below are the subclause HEADINGS of the paywalled clauses, read from the
  Contents of the free preview (printed pp. iii-v). Each field is `kind: inferred-from-heading`: we know the
  standard has a subclause about it, not what it requires (mandatory/optional, type, encoding). No type,
  cardinality or encoding is asserted because none is visible. Definitions that ARE visible (Clause 3)
  are quoted. The standard does not define a wire format; §4 cites CVRF [12][13], whose successor is
  OASIS CSAF 2.0/2.1 — the machine-readable rendering to map these fields onto (no library record yet).

messages:
  - id: advisory
    definition: "document or message that provides vulnerability (3.1) information intended to reduce risk"
    locator: "§3.8 (definition, stated); §7.4 Advisory elements (headings)"
    kind: stated
    fields:   # §7.4.2-§7.4.17, in the standard's order
      - {name: identifiers, locator: "§7.4.2", kind: inferred-from-heading, related: "CVE (§4 [9]); CSAF document.tracking.id / vulnerabilities[].cve"}
      - {name: date_and_time, locator: "§7.4.3", kind: inferred-from-heading, related: "CSAF document.tracking.initial_release_date / current_release_date"}
      - {name: title, locator: "§7.4.4", kind: inferred-from-heading, related: "CSAF document.title"}
      - {name: overview, locator: "§7.4.5", kind: inferred-from-heading, related: "CSAF document.notes (category summary)"}
      - {name: affected_products, locator: "§7.4.6", kind: inferred-from-heading, related: "CSAF product_tree + product_status"}
      - {name: intended_audience, locator: "§7.4.7", kind: inferred-from-heading, related: "CSAF document.notes (category general) / distribution"}
      - {name: localization, locator: "§7.4.8", kind: inferred-from-heading, related: "CSAF document.lang / source_lang"}
      - {name: description, locator: "§7.4.9", kind: inferred-from-heading, related: "CSAF vulnerabilities[].notes (category description)"}
      - {name: impact, locator: "§7.4.10", kind: inferred-from-heading, related: "CSAF vulnerabilities[].threats (category impact)"}
      - {name: severity, locator: "§7.4.11", kind: inferred-from-heading, related: "CVSS (§4 [10]); CSAF vulnerabilities[].scores"}
      - {name: remediation, locator: "§7.4.12", kind: inferred-from-heading, related: "CSAF vulnerabilities[].remediations"}
      - {name: references, locator: "§7.4.13", kind: inferred-from-heading, related: "CSAF document.references / vulnerabilities[].references"}
      - {name: credit, locator: "§7.4.14", kind: inferred-from-heading, related: "CSAF document.acknowledgments"}
      - {name: contact_information, locator: "§7.4.15", kind: inferred-from-heading, related: "CSAF document.publisher.contact_details"}
      - {name: revision_history, locator: "§7.4.16", kind: inferred-from-heading, related: "CSAF document.tracking.revision_history"}
      - {name: terms_of_use, locator: "§7.4.17", kind: inferred-from-heading, related: "CSAF document.distribution / notes (category legal_disclaimer)"}
    properties:   # §7.5-§7.7 headings: properties of the advisory as a whole
      - {name: communication, locator: "§7.5 Advisory communication", kind: inferred-from-heading}
      - {name: format, locator: "§7.6 Advisory format", kind: inferred-from-heading}
      - {name: authenticity, locator: "§7.7 Advisory authenticity", kind: inferred-from-heading, note: "OpenPGP / S/MIME are in the §4 abbreviation list"}
    timing: {locator: "§7.3 Advisory publication timing", kind: inferred-from-heading}
    examples: {locator: "Annex C (informative) Example advisories", available: false}

  - id: vulnerability-report
    definition: "(no Clause 3 definition of 'report'); a reporter 'notifies a vendor (3.4) or coordinator (3.6) of a potential vulnerability (3.1)' (§3.5)"
    locator: "§6.2; §9.3.2 Vulnerability report contents; Annex B Information to request in a report"
    kind: stated
    fields: []    # Annex B and §9.3.2 are not in the preview; no field list is asserted
    handling:
      - {name: capability_to_receive, locator: "§6.2.2", kind: inferred-from-heading}
      - {name: monitoring, locator: "§6.2.3", kind: inferred-from-heading}
      - {name: tracking, locator: "§6.2.4 Report tracking", kind: inferred-from-heading, note: "implies a vendor-assigned tracking identifier"}
      - {name: acknowledgement, locator: "§6.2.5 Report acknowledgement", kind: inferred-from-heading}

  - id: receipt-acknowledgement
    locator: "Figure 1 'Acknowledge receipt'; §6.2.5"
    kind: stated
    fields: []    # content not visible

  - id: not-verified-notice
    locator: "Figure 1 'Vulnerability verified?' No → 'Inform reporter'"
    kind: stated
    fields: []

  - id: remediation
    definition: "change made to a product or service to remove or mitigate a vulnerability (3.1)"
    locator: "§3.7; §7.8"
    kind: stated
    forms: ["binary file replacement", "configuration change", "source code patch and recompile"]   # §3.7 Note 1, stated
    synonyms: [patch, fix, update, hotfix, upgrade]                                                    # §3.7 Note 1, stated
    mitigation_synonyms: [workarounds, countermeasures]                                                # §3.7 Note 1, stated
    properties:
      - {name: authenticity, locator: "§7.8.2 Remediation authenticity", kind: inferred-from-heading}
      - {name: deployment, locator: "§7.8.3 Remediation deployment", kind: inferred-from-heading}

  - id: disclosure-policy
    locator: "Clause 9; Annex A (examples)"
    kind: stated
    fields:
      - {name: preferred_contact_mechanism, obligation: "required (§9.2 'Required policy elements')", locator: "§9.2.2", kind: inferred-from-heading}
      - {name: vulnerability_report_contents, obligation: "recommended (§9.3)", locator: "§9.3.2", kind: inferred-from-heading}
      - {name: secure_communication_options, obligation: "recommended (§9.3)", locator: "§9.3.3", kind: inferred-from-heading}
      - {name: communication_expectations, obligation: "recommended (§9.3)", locator: "§9.3.4 Setting communication expectations", kind: inferred-from-heading}
      - {name: scope, obligation: "recommended (§9.3)", locator: "§9.3.5", kind: inferred-from-heading}
      - {name: publication, obligation: "recommended (§9.3)", locator: "§9.3.6", kind: inferred-from-heading}
      - {name: recognition, obligation: "recommended (§9.3)", locator: "§9.3.7", kind: inferred-from-heading}
      - {name: legal_considerations, obligation: "optional (§9.4)", locator: "§9.4.2", kind: inferred-from-heading}
      - {name: disclosure_timeline, obligation: "optional (§9.4)", locator: "§9.4.3", kind: inferred-from-heading}
    note: >
      The obligation tier (required / recommended / optional) comes from the parent HEADINGS §9.2/§9.3/§9.4,
      which is the one piece of normative strength visible for any message field. The RFC 9116 security.txt
      'Contact'/'Policy'/'Encryption' fields are a common machine rendering of 9.2.2/9.3.3 (our observation).
