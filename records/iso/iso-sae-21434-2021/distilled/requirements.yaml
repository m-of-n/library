    short_title: "A The notations are defined as follows"
    text: "a The notations are defined as follows: —: no suggestion regarding testing parameters for this activity; T1: testing parameter set 1: — functional testing based on requirements; — vulnerability scanning for known vulnerabilities; — fuzz testing with random of selection of inputs; — penetration testing assuming moderate attacker expertise, knowledge of the item or component and/or resources; T2: testing parameters set 2: — functional testing based on requirements and interactions between components; — vulnerability scanning for known vulnerabilities; — fuzz testing with an increased number of test case iterations and/or adaptive selection of inputs; — penetration testing assuming higher attacker expertise, knowledge of the item or component and/or resources. Annex F (informative) Guidelines for impact rating F.1 General This annex gives examples of criteria for impact rating (see 15.5) for damage scenarios involving safety, financial, operational and privacy damage. The tables (see Table F.1 through Table F.4) in this annex can be used for impact rating. Considerations on how the scalability of damage (i.e. impact to multiple road users in a single damage scenario) modify the impact rating have not been included in the examples given, but can be added to the organization‑specific rating criteria as appropriate (e.g. Reference [20], C.1.2, Table 4). F.2 Impact rating for safety damage Table F.1 — Example safety impact rating criteria Impact rating Criteria for safety impact rating Severe S3: Life-threatening injuries (survival uncertain), fatal injuries Major S2: Severe and life-threatening injuries (survival probable) Moderate S1: Light and moderate injuries Negligible S0: No injuries a a Rating for S0 can be based on ISO 26262-3:2018, Table B.1. Safety impact rating criteria are taken from ISO 26262-3:2018. Controllability and exposure in accordance with ISO 26262-3:2018 can also be considered for rating impact on safety, if a rationale is provided. F.3 Impact rating for financial damage Table F.2 — Example financial impact rating criteria Impact rating Criteria for financial impact rating The financial damage leads to catastrophic consequences which the affected road user might Severe not overcome. The financial damage leads to substantial consequences which the affected road user will be Major able to overcome. The financial damage leads to inconvenient consequences which the affected road user will Moderate be able to overcome with limited resources. Negligible The financial damage leads to no effect, negligible consequences or is irrelevant to the road user. F.4 Impact rating for operational damage Table F.3 — Example operational impact rating criteria Impact rating Criteria for operational impact rating The operational damage leads to the loss or impairment of a core vehicle function. Severe EXAMPLE 1 Vehicle not working or showing unexpected behaviour of core functions such as enabling of limp home mode or autonomous driving to an unintended location. The operational damage leads to the loss or impairment of an important vehicle function. Major"
    expects_deliverables: [WP-11-01]
    verification: "inspect required deliverable(s): WP-11-01"
    tailorable: true
