    text: "also calls risk determination for each threat scenario in accordance with 15.8. Risk values can be determined utilizing risk matrices defined by the organization for mapping combinations of ratings of impact (see 15.5) and attack feasibility (see 15.7) to risk values. Table H.8 shows an example risk matrix and Table H.9 shows example results of risk determination using Table H.8. Table H.8 — Risk matrix example Attack feasibility rating Very Low Low Medium High Severe 2 3 4 5 Major 1 2 3 4 Impact rating Moderate 1 2 2 3 Negligible 1 1 1 1 Table H.9 — Examples of determined risk values Threat scenario Aggregated Impact rating Risk value attack feasibility rating Spoofing of a signal leads to loss High Severe S: 5 of integrity of the data communi- cation of “Lamp Request” signal for power switch actuator ECU Denial of service of oncoming Low Moderate O: 2 car information Risk values may also be determined by a risk formula defined by the organization. An example is shown in the below formula and Table H.10. R =1+ I ×F Table H.10 — Example translation of impact and attack feasibility to numerical values Impact Numerical value I Attack feasibility Numerical value F for rating for impact rating attack feasibility Negligible 0 Very low 0 Moderate 1 Low 1 Major 1,5 Medium 1,5 Severe 2 High 2 For the specific threat scenarios displayed in Table H.9 the calculation using the example given in Table H.8 and the above formula would lead to the same risk values. H.2.8 Risk treatment decision"
