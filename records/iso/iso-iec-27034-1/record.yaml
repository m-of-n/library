usefulness:
  verdict: useful
  reason: "The most object-model-like SDL standard: ONF/ANF (catalogue vs per-application instantiation), the self-verifying ASC (activity + verification measurement + levels of trust, free official XSD), and Targeted vs Actual Level of Trust as the audit-gated 'declared secure' rule — direct input to R-041/R-042/R-043. Only the preview of Part 1 could be read."
