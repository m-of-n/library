    actor: organization
    nature: process
    phase: governance
    locator: "§0.1 (informative)"
    text: "Applications should be protected against vulnerabilities which might be inherent to the application itself (e.g. software defects), appear in the course of the application's life cycle (e.g. through changes to the application), or arise due to the use of the application in a context for which it was not intended."
    expects_deliverables: []
    verification: "indirect — via ASC verification measurements (body, not read)"
    kind: stated
    testable: "partial — three vulnerability origins named; no acceptance criterion"
