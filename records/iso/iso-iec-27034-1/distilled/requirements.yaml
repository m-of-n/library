reconciliation: >
  BCP 14 count is 0 in both source and extraction (ISO/IEC drafting uses lowercase shall/should;
  ISO/IEC Directives Part 2). Against the document's own verbs, over the PREVIEW ONLY: 17 "should"
  occurrences -> 14 entries (R-0001..R-0014, excluding the ToC line, the 0.4.4 heading which is
  carried by R-0015, and the quoted counter-example in 0.4.1, which is an example of a BAD
  requirement, not a recommendation). The single "shall" is ISO's patent boilerplate in the
  Foreword and is excluded. R-0015 is the 0.4.4 "cannot ... unless" prohibition. All 15 come from
  Clause 0 (Introduction), which is INFORMATIVE in ISO drafting, so every entry is a recommendation or
  a stated principle, not a conformance requirement. The normative body (Clauses 3.3-8) was NOT read;
  the real requirement baseline of ISO/IEC 27034-1 is unknown to this extraction and is NOT
  claimed to be zero.
