gaps:
  - "A self-verifying control: tmodel splits Mitigation, Requirement and verification; 27034's ASC binds requirement-justification + activity + verification-measurement + level(s) of trust into one versioned, signed object. tmodel needs at least a VerificationProcedure attached to MitigationInstance."
  - "LevelOfTrust / TargetedLevelOfTrust / ActualLevelOfTrust: tmodel has no assurance-tier object; R-041 gate exit criteria could be expressed as 'reach Targeted LoT N', and R-042 conformance as Actual LoT ≥ Targeted LoT."
  - "ONF vs ANF: tmodel lacks the org-level governed catalogue (ONF) distinct from its per-product instantiation (ANF). DEC-009 generic→product mapping is the closest analogue and should be extended from threats/mitigations to the SDL itself."
  - "Two-dimensional life cycle: ASLCRM is layer (management/supply/infrastructure/audit) × stage (provisioning/operation) × activity area; tmodel's LifecyclePhase is one ordered enum. Audit and infrastructure are first-class layers in 27034."
  - "Control placement precision: ExecutionMoment (BEFORE/DURING/AFTER an ASLC activity, ONCE/PERIODIC/ON_EVENT) is finer than applies_in_phase."
  - "Control lifecycle with per-stage signed approvals (life-cycle-stage enum + approval-stage) — tmodel's Review covers a single verdict, not a staged approval chain."
  - "RACI/RASCI responsibility on role allocations — tmodel Party roles carry no responsibility qualifier."
  - "Evidence reuse across versions (Part 7 PASR / Expected Level of Trust) — tmodel has no rule for carrying conformance from one ProductInstance version to the next."
  - "ASC exchange package with e-signatures — tmodel has no signed export of controls/requirements."

