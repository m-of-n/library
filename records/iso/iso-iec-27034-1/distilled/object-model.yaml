schema: "library-object-model/v1"
record: iso-iec-27034-1
source_version: "ISO/IEC 27034-1:2011 preview + series previews + the free TS 27034-5-1 XSD"
note: >
  ISO/IEC 27034 is the most object-model-like SDL standard: it names its objects (ONF, ANF, ASC,
  ASLC Reference Model, Targeted/Actual Level of Trust) and Part 5 / TS 5-1 give the ASC a data
  structure. 27034-1 itself was read ONLY through its preview (front matter, Clause 1, 3.1-3.2),
  so most objects are located from OTHER parts of the series, each through its own free preview,
  plus the free official XSD that ISO publishes as an electronic insert to TS 27034-5-1.
  Locator prefixes say which document a fact came from:
    "27034-1 §x"   = ISO/IEC 27034-1:2011 preview (sha256 8e3d0f99…)
    "27034-1 ToC"  = clause/figure TITLE only, from the 27034-1 table of contents (content not read)
    "27034-2 §x"   = ISO/IEC 27034-2:2015 preview, pp. i–9 (sha256 446dd709…)
    "27034-3 §x"   = ISO/IEC 27034-3:2018 preview, pp. i–4 (sha256 662e9bf3…)
    "DIS 27034-4 §x" = ISO/IEC DIS 27034-4 (2020 draft, project later cancelled) preview (sha256 9515f011…)
    "27034-5 §x"   = ISO/IEC 27034-5:2017 preview, pp. i–5 (sha256 67fa982a…)
    "27034-7 §x"   = ISO/IEC 27034-7:2018 preview, pp. i–3 (sha256 2a44c6c9…)
    "XSD:<path>"   = ISO27034-ASC_Structure_v1.0.0.xsd (TS 27034-5-1 electronic insert, sha256 c9068e6d…)
  kind: stated = the source names the object/edge; inferred = we derived it (flagged in notes).
  tmodel_mapping names the ARCH-0001 v0.2.0 / DL-0009 class, or 'new', or 'none'.

objects:
  # ── Organization level ─────────────────────────────────────────────────────────────
  - name: Organization
    definition: "The adopting organization; owns the ONF and runs the ONF Management Process (27034-2 §5.1, §5.4.1)."
    attributes: ["business context", "regulatory context", "technological context"]
    locator: "27034-1 §0.4.2; 27034-2 §5.1"
    kind: stated
    tmodel_mapping: "Party (ARCH-0001 §2b), intrinsic class organization"
    notes: ""
  - name: OrganizationNormativeFramework
    short: ONF
    definition: "27034-2 Introduction: 'The ONF is an organization-wide framework where all application security best practices recognized by the organization are stored. It comprises essential components, processes that utilize these components, and processes for managing the ONF itself.' 27034-2 §5.1: 'an organization-wide framework containing a subset of the organization's processes and components that are relevant to application security and are normative inside the organization.' 'The ONF is the authoritative source for all components and processes related to application security in the organization.'"
    attributes: ["elements (components", "roles", "processes)", "owner = ONF Committee", "iteration scope", "repository"]
    locator: "27034-2 Introduction, §5.1; 27034-1 ToC §8.1 (definition in 27034-1 not read)"
    kind: stated
    tmodel_mapping: "new — a governed, versioned library of org-approved Requirements/Controls/Processes; closest is the SDL/SecurityProgram (R-041) plus a requirement catalogue (R-044)"
    notes: "27034-2 §5.3 b): 'any element defined in the ONF should be approved by the ONF committee' — every ONF element carries an approval."
  - name: ONFElement
    definition: "A component, role or process held in the ONF (27034-2 §5.2 b) 'all elements (components, roles and processes)')."
    attributes: ["owner", "management objectives and direction", "training", "approval"]
    locator: "27034-2 §5.2 b), §5.4.5.5 (auditor criteria a)-e) per element), ToC §5.5"
    kind: stated
    tmodel_mapping: "new (abstract supertype)"
    notes: "27034-2 ToC §5.5 lists the element kinds: business, regulatory and technological context components; application specifications repository; roles, responsibilities and qualifications repository; Organization ASC Library; ASC; ASLC Reference Model; ASLC Model; ASMP; Application Security Risk Analysis Process; Application Security Verification Process."
  - name: BusinessContext
    definition: "27034-1 §0.4.2 a): 'specific risks arising from the organization's business domain'."
    attributes: []
    locator: "27034-1 §0.4.2 a); ToC 6.3.2; 27034-2 ToC 5.5.2"
    kind: stated
    tmodel_mapping: "none (closest: Environment/Deployment context, ARCH-0001 §3)"
    notes: ""
  - name: RegulatoryContext
    definition: "27034-1 §0.4.2 b): 'specific risks arising from the geographical location where the organization is doing business'."
    attributes: []
    locator: "27034-1 §0.4.2 b); ToC 6.3.3, 8.1.2.2 (via §0.3.2 c)); 27034-2 ToC 5.5.3"
    kind: stated
    tmodel_mapping: "new — applicability scope of regulatory Requirements (e.g. CRA)"
    notes: ""
  - name: TechnologicalContext
    definition: "27034-1 §0.4.2 c): 'specific risks from the technologies used by the organization in the course of business' — encompasses the application's technical specifications."
    attributes: []
    locator: "27034-1 §0.4.2 c); ToC 6.3.6; 27034-2 ToC 5.5.4"
    kind: stated
    tmodel_mapping: "Environment / Component technology facets (ARCH-0001 §1, §3)"
    notes: ""
  - name: ApplicationSpecificationsRepository
    definition: "ONF element holding application specifications (title only)."
    attributes: []
    locator: "27034-1 ToC A.6; 27034-2 ToC 5.5.5"
    kind: stated
    tmodel_mapping: "none"
    notes: "Content not read."
  - name: RolesResponsibilitiesQualificationsRepository
    definition: "ONF element recording roles, responsibilities and qualifications (title only)."
    attributes: []
    locator: "27034-1 ToC A.8; 27034-2 ToC 5.5.6"
    kind: stated
    tmodel_mapping: "Party roles (ARCH-0001 §2b, relational roles as edges)"
    notes: "The XSD's ASLCRM_role-nameLabel enumeration gives 22 named roles + CUSTOM (see Role)."
  - name: OrganizationASCLibrary
    definition: "The ONF's library of approved ASCs; 27034-5 Introduction: the ONF Committee 'implements the ASC Library' and 'approves ASCs that correctly mitigate application security risks'."
    attributes: ["ASCs", "tree/graph structure"]
    locator: "27034-5 Introduction (ONF Committee a)-b)); 27034-1 ToC Fig. 5, A.9; 27034-2 ToC 5.5.7"
    kind: stated
    tmodel_mapping: "new — catalogue of generic controls; aligns with ARCH-0001 generic Mitigation (D3FEND) layer"
    notes: "27034-1 Annex A.9 (ToC) groups the example library by Microsoft SDL phase: Training, Requirements, Design, Implementation, Verification, Release."
  - name: ONFCommittee
    definition: "27034-5 Introduction: 'responsible for managing the implementation and maintenance of the application-security-related components and processes in the Organization Normative Framework.'"
    attributes: ["members", "roles", "mandate", "resources", "authority"]
    locator: "27034-2 §5.4.3 (outcomes a)-f)); 27034-5 Introduction; 27034-3 §5.1"
    kind: stated
    tmodel_mapping: "Party (organizational unit) + governance role; approver of governed views (R-043)"
    notes: ""
  - name: ApplicationSecurityLifeCycleReferenceModel
    short: ASLCRM
    definition: "27034-1 Fig. 8 'Top-level view of the Application Security Life Cycle Reference Model' (not read). Structure from the XSD: 4 layers (Application Management, Application Supply, Application Infrastructure, Application Audit) × 2 stages (Provisioning, Operation) × activity areas × sub-areas × enumerated activity labels."
    attributes: ["layers", "stages", "activity areas", "sub-areas", "activity labels"]
    locator: "27034-1 ToC Fig. 8, A.12; 27034-5 Scope, ToC §6; XSD:complexType ASLCRM_activity-name"
    kind: stated
    tmodel_mapping: "LifecyclePhase axis (ARCH-0001 §3b) — but 27034's model is 2-D (layer × stage), richer than tmodel's 1-D enum"
    notes: "27034-5 §5.1: 'provide a list of possible activities enabling the ONF Committee to attach ASCs into the Application Security Life Cycle Reference Model'."
  - name: ASLCLayer
    definition: "Top-level partition of the ASLCRM."
    attributes: ["value ∈ {ApplicationManagementLayer, ApplicationSupplyLayer, ApplicationInfrastructureLayer, ApplicationAuditLayer}"]
    locator: "XSD:ASLCRM_activity-name/choice"
    kind: stated
    tmodel_mapping: "new"
    notes: "Corresponds to 27034-5 ToC §6.2 Application Management Layer, §6.3 Application provisioning and operation layer, §6.4 Infrastructure management, §6.5 Application audit."
  - name: ASLCStage
    definition: "Within each layer: ProvisioningStage or OperationStage."
    attributes: ["value ∈ {ProvisioningStage, OperationStage}"]
    locator: "XSD:ASLCRM_activity-name/*/ProvisioningStage|OperationStage; 27034-1 §0.3.2 ('provisioning stages and the production stages')"
    kind: stated
    tmodel_mapping: "LifecyclePhase (coarse)"
    notes: ""
  - name: ASLCActivityArea
    definition: "Named area within a stage, e.g. Preparation, Outsourcing, Development, Acquisition, Transition (supply/provisioning); Utilization, Archival, Destruction (supply/operation); audit areas."
    attributes: ["name", "sub-areas"]
    locator: "XSD:ASLCRM_activity-name; 27034-5 ToC §6.3.2–6.3.17"
    kind: stated
    tmodel_mapping: "LifecyclePhase (fine) — 27034 Archival/Destruction ≈ tmodel end-of-support/decommission"
    notes: ""
  - name: ASLCActivity
    definition: "27034-5 §3.1: 'set of actions or tasks carried out by an actor during the application's life cycle'. The XSD enumerates labels per sub-area (e.g. 'PERFORM AN INITIAL HIGH LEVEL APPLICATION RISK ANALYSIS', 'DEFINE SECURITY NEEDS AND THE APPLICATION TARGETED LEVEL OF TRUST', 'SELECT ASCS ACCORDINGLY TO THIS LEVEL')."
    attributes: ["label (enum or CUSTOM)"]
    locator: "27034-5 §3.1; TS 27034-5-1 §3.1; XSD:*_SubAreaActivityLabel"
    kind: stated
    tmodel_mapping: "new — the anchor point (\"when\") an ASC's activity attaches to"
    notes: ""
  - name: ApplicationSecurityLifeCycleModel
    definition: "The organization's own life-cycle model (e.g. Microsoft SDL) mapped onto the ASLCRM."
    attributes: []
    locator: "27034-2 ToC 5.5.10; 27034-1 ToC A.11, A.12, Fig. A.6–A.7; XSD initiating label 'MAP APPLICATION LIFE CYCLES USED IN THE ORGANIZATION TO THE REFERENCE MODEL'"
    kind: stated
    tmodel_mapping: "SDL (R-041) — the local phase/gate names; ASLCRM is the canonical axis. Exactly DL-0009's 'canonical phase + local name'"
    notes: ""
  - name: ONFManagementProcess
    definition: "27034-2 §5.4.1: organization-level process for the management of its ONF; six sub-processes: Establishing the ONF committee; Designing / Implementing / Monitoring and reviewing / Improving the ONF (PDCA); Auditing the ONF."
    attributes: ["iteration", "scope"]
    locator: "27034-2 §5.4.1, Table 1; 27034-1 ToC §7.2, Fig. 9"
    kind: stated
    tmodel_mapping: "new — governance process over the SDL/library (R-043 change tracking + approval)"
    notes: "Iterative: 'The organization should perform the ONF Management Process iteratively in order to incrementally implement the ONF.'"
  # ── Application level ─────────────────────────────────────────────────────────────
  - name: Application
    definition: "Unit of protection; 27034-1 §0.1 examples: 'human resource systems, finance systems, word-processing systems, customer management systems, firewalls, anti-virus systems and intrusion detection systems.' Applicable to in-house, third-party-acquired and outsourced applications (§1)."
    attributes: ["owner", "Targeted Level of Trust", "Actual Level of Trust", "contexts", "specifications", "data", "roles and permissions"]
    locator: "27034-1 §0.1, §1; ToC §6.3 (application security scope)"
    kind: stated
    tmodel_mapping: "Product / ProductInstance (ARCH-0001 §1, versioned)"
    notes: "27034-7 §3.3–3.4 add version lineage: original application → subsequent application."
  - name: ApplicationOwner
    definition: "Manager who authorizes the Targeted Level of Trust and accepts risk (27034-1 §0.3.2 e), ToC §8.2.5 'Application owner acceptation')."
    attributes: []
    locator: "27034-1 §0.3.2 f) list, §0.4.3; 27034-3 §5.1 ('accountable for ensuring an ASMP is in place')"
    kind: stated
    tmodel_mapping: "Party role owned_by (ARCH-0001 §2b)"
    notes: ""
  - name: ApplicationNormativeFramework
    short: ANF
    definition: "27034-3 §5.3.3: 'The ASMP uses this context [the ONF] to create and maintain the Application Normative Framework (ANF) for each application project.' Per-application subset of the ONF with the ASCs selected by the Targeted Level of Trust."
    attributes: ["application", "selected ASCs", "evidence consolidated by verification"]
    locator: "27034-3 §5.3.3, §5.1 c); DIS 27034-4 §3.10 Note 3 ('consolidate evidence in the ANF'); 27034-1 ToC §8.3, Fig. 10"
    kind: stated
    tmodel_mapping: "new — per-product instantiation of the SDL: the applicable Requirements + chosen MitigationInstances + Evidence (R-041/R-042)"
    notes: "Definition text of ANF in 27034-1 (§3, §8.3) not read; this composite is from Parts 3 and DIS 4."
  - name: ApplicationSecurityManagementProcess
    short: ASMP
    definition: "27034-3 §5.1: 'the overall process for managing security on each specific application used or developed by an organization', performed in five steps."
    attributes: ["steps (5)"]
    locator: "27034-3 §5.1; 27034-1 ToC §7.3.2–7.3.6"
    kind: stated
    tmodel_mapping: "SDL program instance per Product (R-041)"
    notes: "Steps (27034-3 §5.1 a)-e), same titles as 27034-1 ToC 7.3.2-7.3.6): identifying the application requirements and environment; assessing application security risks; creating and maintaining the ANF; provisioning and operating the application; auditing the security of the application."
  - name: ApplicationSecurityRisk
    definition: "Risk to the application (27034-1 ToC 6.5.1); assessed by the Application Security Risk Analysis Process (27034-2 ToC 5.5.12)."
    attributes: ["vulnerability", "threat", "impact"]
    locator: "27034-1 ToC §6.5, §8.2; 27034-2 ToC 5.5.12"
    kind: stated
    tmodel_mapping: "ThreatInstance + RiskScore (ARCH-0001 §1.3, §3)"
    notes: "Inner structure not read; attributes from the ToC sub-clause titles 6.5.2-6.5.4."
  - name: LevelOfTrust
    definition: "An ONF-defined level an application can be required to reach; each ASC names the level(s) for which it is mandatory. XSD: level-of-trust {level-of-trust-uid, level (integer), label, description} inside levels-of-trust-range."
    attributes: ["uid", "level (integer)", "label", "description"]
    locator: "27034-5 §5.2.1 b) 3); XSD:asc/content/objective/levels-of-trust-range/level-of-trust; TS 27034-5-1 §5.2 c)"
    kind: stated
    tmodel_mapping: "new — a named, ordered assurance tier; ≈ gate exit-criterion profile"
    notes: "TS 5-1 §5.2 c): 'Each ASC should refer to one or more levels of trust. In order to keep the ASC self-contained the data model is designed to also include the actual definition of the levels of trust.'"
  - name: TargetedLevelOfTrust
    definition: "The LevelOfTrust management assigns to an application (27034-1 §0.2 b), §0.3.2 e) 'authorize the Targeted Level of Trust'); selects the ASCs that must be implemented and verified."
    attributes: ["level-of-trust ref", "authorized by application owner"]
    locator: "27034-1 §0.2 b), §0.3.2 b) e), §0.4.3, §0.4.4; ToC §8.2.4 (body §8.1.2.6.4, not read); 27034-3 §5.3.1 a)"
    kind: stated
    tmodel_mapping: "new — the exit criterion of the release Gate (R-041): 'reach Targeted LoT'"
    notes: "27034-3 §5.3.1 a): 'every application should be assigned a Targeted Level of Trust'."
  - name: ActualLevelOfTrust
    definition: "27034-1 §3.2: 'result of an audit process that provides supporting evidence that all Application Security Controls required by the application's Targeted Level of Trust were correctly implemented and verified, and produced the expected results'."
    attributes: ["audit result", "evidence"]
    locator: "27034-1 §3.2"
    kind: stated
    tmodel_mapping: "new — the conformance verdict (R-042) recorded as a Review on the Product/ANF"
    notes: "The one 27034-1 object definition read verbatim besides 'actor'."
  - name: ExpectedLevelOfTrust
    definition: "27034-7 §3.8: 'level of trust, defined in the Organization Normative Framework, where the activities of some of the Application Security Controls are satisfied through the creation of a PASR'."
    attributes: ["PASRs", "original application"]
    locator: "27034-7 §3.8"
    kind: stated
    tmodel_mapping: "new — conformance carried forward across versions (version-to-version evidence reuse)"
    notes: "Part 7, not Part 1; recorded because it is the series' answer to evidence reuse between releases."
  - name: PredictionApplicationSecurityRationale
    short: PASR
    definition: "27034-7 §3.7: 'rationale for a prediction, supported by risk analysis documents, approved by the application owner, explaining that performing the verification activities of a specific Application Security Control is not necessary'."
    attributes: ["ASC ref", "risk analysis", "approval"]
    locator: "27034-7 §3.7"
    kind: stated
    tmodel_mapping: "Assertion + Review (ARCH-0001 §4) — a reviewed claim that substitutes for fresh evidence"
    notes: ""
  # ── The control ───────────────────────────────────────────────────────────────────
  - name: ApplicationSecurityControl
    short: ASC
    definition: "27034-5 §5.1: 'Each Application Security Control (ASC) defines a security-related activity performed at a specific point in an application's life cycle to mitigate a risk or to satisfy a requirement. The security activity is supplemented by a verification measurement (activity) that specifies the necessary steps to verify its successful application. For both the security activity and verification measurement, an ASC specifies how, where, when and by whom the activity should be implemented. Information about the required effort is also captured.'"
    attributes: ["identification (M)", "objective (M)", "security activity (M)", "verification measurement (M)", "approval e-signatures (O)"]
    locator: "27034-5 §5.1, §5.2.1 a)-d) (which cites 27034-1:2011 §8.1.2.6.5); 27034-1 ToC Fig. 6; XSD:element asc"
    kind: stated
    tmodel_mapping: "MitigationInstance (control) + Requirement link + verification (R-040/R-042) — 27034 fuses into ONE object what tmodel splits into three"
    notes: "Key finding: the ASC is a (requirement-justification, activity, verification-measurement, level-of-trust) bundle — a self-verifying control."
  - name: ASCIdentification
    definition: "27034-5 §5.2.1 a): id, name; description of scope and intent; version (creation date, current lifecycle stage, revision notes, author, owner); references to super- and sub-ordinate ASCs."
    attributes: ["uid (M)", "name (M)", "description (M)", "version{number, date, life-cycle-stage, maturity-approval-note, revision-note}", "author[]", "owner[]", "parents[]", "children[]"]
    locator: "27034-5 §5.2.1 a), §5.2.4.1; XSD:asc/content/identification"
    kind: stated
    tmodel_mapping: "stable id + version (ADR-0004); owner = Party"
    notes: ""
  - name: ASCObjective
    definition: "27034-5 §5.2.1 b): intent and security objective; security requirements that justify 'why' with their context; levels of trust for which the ASC is mandatory; preconditions, threat assumptions, operating environment."
    attributes: ["description", "requirements-addressed[]", "assigned-levels-of-trust[]", "contexts-of-use[]", "levels-of-trust-range", "conditions[]", "prediction-allowed"]
    locator: "27034-5 §5.2.1 b); XSD:asc/content/objective"
    kind: stated
    tmodel_mapping: "Requirement (R-044) + ThreatInstance assumptions"
    notes: "prediction-allowed links to Part 7 PASR."
  - name: SecurityRequirement
    definition: "Requirement an ASC addresses. XSD: requirement {context ∈ REGULATORY_CONTEXT|BUSINESS_CONTEXT|TECHNOLOGICAL_CONTEXT|APPLICATION_FUNCTIONNALITY|CUSTOM, type ∈ 13 values, name, description, source}."
    attributes: ["context", "type", "name", "description", "source"]
    locator: "27034-5 §5.2.1 b) 2); XSD:objective/requirements-addressed/requirement; 27034-1 ToC §6.4"
    kind: stated
    tmodel_mapping: "Requirement (DL-0009 R-044) — `source` is the hook for the crosswalk"
    notes: ""
  - name: SecurityActivity
    definition: "27034-5 §5.2.1 c): what / where (asset protected) / who (roles, qualifications) / how much (complexity, cost) / how (tasks, actions, outcomes, preconditions) / when (relative to the ASLCRM)."
    attributes: ["synopsis{name, description, target-information[], outcome-description, supporting-expert-ressources[]}", "activity-complexity", "activity-specification{task[]}"]
    locator: "27034-5 §5.2.1 c); XSD:complexType activity (security-activity)"
    kind: stated
    tmodel_mapping: "MitigationInstance (kind technical|process|documentation, R-040)"
    notes: ""
  - name: VerificationMeasurement
    definition: "27034-7 §3.13: 'activity provided by an Application Security Control to verify if its security activity was correctly implemented and works as expected by producing required evidence/outcomes'. Same six facets as the security activity (27034-5 §5.2.1 d))."
    attributes: ["same structure as SecurityActivity"]
    locator: "27034-7 §3.13; 27034-5 §5.2.1 d); XSD:asc/content/verification-measurement (type activity)"
    kind: stated
    tmodel_mapping: "new — a verification procedure bound to a mitigation; produces Evidence (R-042)"
    notes: "27034-1 §0.5.8 b): 'evidence is provided by Application Security Controls' built-in verification measurements'."
  - name: Task
    definition: "Unit of an activity specification: description, pre-conditions, required resources (role allocations with RACI/RASCI), execution moments, action list, outcome (produced artefacts), estimated effort, note."
    attributes: ["seq", "description", "pre-conditions", "required-resources", "execution-moments", "action-list", "outcome", "task-estimated-effort", "note"]
    locator: "XSD:complexType activity/activity-specification/task"
    kind: stated
    tmodel_mapping: "new (work item; ARCH-0001 §5 'linked work item')"
    notes: ""
  - name: ExecutionMoment
    definition: "When a task runs: execution-order {BEFORE, DURING, AFTER, CUSTOM} relative to an ASLCRM activity (life-cycle-reference), with interval {ONCE, PERIODIC, ON_EVENT, CUSTOM} and time unit."
    attributes: ["execution-order", "life-cycle-reference", "name", "description", "interval-value{frequence, time-unit}"]
    locator: "XSD:task/execution-moments/moment"
    kind: stated
    tmodel_mapping: "new — binds a control to a LifecyclePhase point; enables gate scheduling (R-041)"
    notes: ""
  - name: Artefact
    definition: "Produced output of a task. artefact-type ∈ {REPORT, DOCUMENT, SOURCE_CODE, COMPILED_CODE, EXECUTABLE_CODE, SCRIPT, LIBRARY, DIAGRAM, PARAMETERS_FILE, LINK, CUSTOM}."
    attributes: ["artefact-type", "content"]
    locator: "XSD:task/outcome/produced-artefact; simpleType artefact-type"
    kind: stated
    tmodel_mapping: "WorkProduct / Evidence (DL-0009)"
    notes: ""
  - name: InformationItem
    definition: "Asset targeted by an activity: name, information-group-type (9 values + CUSTOM), description, classification, owner. 27034-5 §3.2–3.3 define information group record and information element."
    attributes: ["name", "information-group-type", "description", "information-classification", "information-owner"]
    locator: "27034-5 §3.2, §3.3; XSD:activity/synopsis/target-information/infomation-item"
    kind: stated
    tmodel_mapping: "Asset / DataStore classification (ARCH-0001 §1.2 data classification)"
    notes: "XSD spells the element 'infomation-item' (sic)."
  - name: Role
    definition: "Named ASLCRM role: ACQUIRER, ANY ROLE, APPLICATION ADMINISTRATOR, APPLICATION ARCHITECT, APPLICATION OPERATOR, APPLICATION OWNER, APPROPRIATE ACCOUNTABLE MANAGEMENT, AUDITOR, CHIEF (INFORMATION) SECURITY OFFICER (CSO / CISO), DEVELOPER, DOMAIN EXPERT, IT INFRASTRUCTURE ARCHITECT, IT INFRASTRUCTURE EXPERT, LAWS AND REGULATIONS EXPERT, MANAGER, OWNER, PROJECT MANAGER, SECURITY ARCHITECT, SUPPLIER, TESTER, TRAINER, USER, CUSTOM ROLE."
    attributes: ["ASLCRM_role-name", "role-name", "responsibility (RACI/RASCI)", "required-qualifications"]
    locator: "XSD:simpleType ASLCRM_role-nameLabel; task/required-resources/resource-allocation; 27034-5 ToC §6.6 Roles"
    kind: stated
    tmodel_mapping: "Party relational role edge (ARCH-0001 §2b, critic M2)"
    notes: ""
  - name: Actor
    definition: "27034-1 §3.1: 'person or process that performs an activity during an application's life cycle or initiates interaction with any process provided by or impacted on by an application'. XSD actor = {name, coordinate[] (organization, department, emails, phones, address…)}."
    attributes: ["name", "coordinates"]
    locator: "27034-1 §3.1; XSD:complexType actor"
    kind: stated
    tmodel_mapping: "Party / PROV-O Agent (ARCH-0001 §2b, §4) — note 27034 admits a process as actor"
    notes: ""
  - name: ASCApproval
    definition: "approval-stage {date, approval-stage-type (a life-cycle-stage), approver (actor), approver-note, maturity-level-note, approver-e-signature}."
    attributes: ["date", "approval-stage-type", "approver", "approver-note", "maturity-level-note", "approver-e-signature"]
    locator: "XSD:asc/approval-e-signatures/approval-stage; 27034-5 §5.2.2 (signable, cascading and multiple e-signatures, timestamps)"
    kind: stated
    tmodel_mapping: "Review (ARCH-0001 §4/§5) — per-stage approval, signed"
    notes: ""
  - name: ASCPackage
    definition: "TS 27034-5-1 §5.4.2.1: top-level element 'for grouping and bundling one or many related ASCs in form of an ASC package', with package-identification and optional editors' e-signatures."
    attributes: ["uid", "date", "version-number", "name", "objective", "description", "editor[]", "asc[]", "package-editors-e-signatures"]
    locator: "TS 27034-5-1 §5.2 b), §5.4.2; XSD:element asc-package"
    kind: stated
    tmodel_mapping: "new — exchange bundle; analogous to a signed library export"
    notes: ""
