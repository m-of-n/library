  - id: "iec-62443-4-1-2018#SVV-3.a"
    native_id: "SVV-3"
    practice: "SVV"
    title: "Vulnerability testing"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: verification
    locator: "IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.17"
    text: "Testing shall include: a) abuse case or malformed or unexpected input testing focused on uncovering security issues. This shall include manual or automated abuse case testing and specialized types of abuse case testing on all external interfaces and protocols for which tools exist. Examples include fuzz testing and network traffic load testing and capacity testing."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["vulnerability test results (fuzz/abuse, attack surface, known-vuln scan, SCA, dynamic resource tests)"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SVV-3A1, SDLA-SVV-3A2, SDLA-SVV-3A3, SDLA-SVV-3A4, SDLA-SVV-3A5"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SVV-3.b"
    native_id: "SVV-3"
    practice: "SVV"
    title: "Vulnerability testing"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
