    text: "Each of the following representative disciplines shall participate in this process. Personnel may be assigned to more than one discipline except for testers, who shall remain independent. a) Architects/developers (those who will implement the requirements); b) testers (those who will validate that the requirements have been met); c) customer advocate (such as sales, marketing, product management or customer support); and d) Security Advisor"
