    expects_deliverables: ["security requirements test plan and results"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SVV-1A1, SDLA-SVV-1A2, SDLA-SVV-1A3, SDLA-SVV-1B, SDLA-SVV-1C"
