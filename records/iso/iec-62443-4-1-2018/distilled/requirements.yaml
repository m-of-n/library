    phase: verification
    locator: "IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.17"
    text: "b) attack surface analysis to determine all avenues of ingress and egress to and from the system, common vulnerabilities including but not limited to week ACLs, exposed ports and services running with elevated privileges."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["vulnerability test results (fuzz/abuse, attack surface, known-vuln scan, SCA, dynamic resource tests)"]
