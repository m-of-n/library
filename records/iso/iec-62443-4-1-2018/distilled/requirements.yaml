  - id: "iec-62443-4-1-2018#SD-1"
    native_id: "SD-1"
    practice: "SD"
    title: "Secure design principles"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: design
    locator: "IEC 62443-4-1:2018 §7.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.12"
    text: "A process shall be employed for developing and documenting a secure design that identifies and characterizes each interface of the product, including physical and logical interfaces, to include: a) an indication of whether the interface is externally accessible (by other products), or internally accessible (by other components of the product), or both; b) security implications of the product security context (see Clause 6, Practice 2 – Specification of security requirements) on the external interface; c) potential users of the interface and the assets that can be accessed through it (directly or indirectly); d) a determination of whether access to the interface crosses a trust boundary; e) security considerations, assumptions and/or constraints associated with the use of the interface within the product security context, including applicable threats; f) the security roles, privileges/rights and access control permissions needed to use the interface and to access the assets defined in c) above; g) the security capabilities and/or compensating mechanisms used to safeguard the interface and the assets defined in c) above, including input validation as well as output and error handling. h) the use of third-party products to implement the interface and their security capabilities; and i) documentation that describes how to use the interface if it is externally accessible. j) description of how the design mitigates the threats identified in the threat model"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["secure design document characterising each interface"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SD-1"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SD-2"
    native_id: "SD-2"
    practice: "SD"
    title: "Defense in depth design"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: design
    locator: "IEC 62443-4-1:2018 §7.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.12"
    text: "A process shall be employed to implement multiple layers of defence using a risk based approach based on the threat model."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["defense-in-depth design with responsibilities per layer"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SD-2"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SD-2.2"
    native_id: "SD-2"
    practice: "SD"
    title: "Defense in depth design"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: design
    locator: "IEC 62443-4-1:2018 §7.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.12"
    text: "This process shall be employed for assigning responsibilities to each layer of defence. NOTE 1 Each layer provides additional defence mechanisms NOTE 2 Each layer may be compromised; therefore, secure design principles are applied to each layer. NOTE 3 The objective is to reduce the attack surface of the subsequent layers"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["defense-in-depth design with responsibilities per layer"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SD-2"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SD-3"
    native_id: "SD-3"
    practice: "SD"
    title: "Security design review"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: design
    locator: "IEC 62443-4-1:2018 §7.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.13"
    text: "A process shall be employed for conducting design reviews to identify, characterize, and track to closure security-related issues associated with each significant revision of the secure design including but not limited to: a) security requirements (Practice 2) that were not adequately addressed by the design, NOTE 1 Requirements allocation, including security requirements, is part of typical design processes. b) threats and their ability to exploit product interfaces, trust boundaries, and assets (SD-1 – Secure design principles), c) identification of design best practices (SD-4 – Secure design industry recommended practices) that were not followed (for example, failure to apply principle of least privilege) NOTE 2 Characterizing threats and their ability to exploit interfaces is often referred to as threat modeling."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security design review records with tracked issues"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SD-3"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SD-4"
    native_id: "SD-4"
    practice: "SD"
    title: "Secure design best practices"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: design
    locator: "IEC 62443-4-1:2018 §7.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.13"
    text: "A process shall be employed to ensure that secure design best practices are documented and applied to the design process."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["documented secure design best practices"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SD-4"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SD-4.2"
    native_id: "SD-4"
    practice: "SD"
    title: "Secure design best practices"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: design
    locator: "IEC 62443-4-1:2018 §7.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.13"
    text: "These practices shall be periodically reviewed and updated. Secure design practices include but are not be limited to: a) least privilege (granting only the privileges to users/software necessary to perform intended operations); b) using proven secure components/designs where possible; c) economy of mechanism (striving for simple designs); d) using secure design patterns; f) all trust boundaries are documented as part of the design; and g) removing debug ports, headers and traces from circuit boards used during development from production hardware or documenting their presence and the need to protect them from unauthorized access."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["documented secure design best practices"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SD-4"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SD-4.e"
    native_id: "SD-4"
    practice: "SD"
    title: "Secure design best practices"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: design
    locator: "IEC 62443-4-1:2018 §7.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.13"
    text: "e) attack surface reduction;"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["documented secure design best practices"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SD-4E"
    kind: stated
    testable: yes
    status: active
