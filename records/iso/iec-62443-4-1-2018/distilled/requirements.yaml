    text: "c) black box known vulnerability scanning focused on detecting known vulnerabilities in the product hardware, host or software components. For example, this could be a network based known vulnerability scan."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["vulnerability test results (fuzz/abuse, attack surface, known-vuln scan, SCA, dynamic resource tests)"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SVV-3C1, SDLA-SVV-3C2"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SVV-3.d"
    native_id: "SVV-3"
    practice: "SVV"
    title: "Vulnerability testing"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: verification
    locator: "IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.17"
    text: "d) for compiled software, software composition analysis on all binary executable files, including embedded firmware, delivered by the supplier to be installed for a product. This analysis shall detect the following types of problems at a minimum: 1) known vulnerabilities in the product software components; 2) linking to vulnerable libraries; 3) security rule violations; and 4) compiler settings that can lead to vulnerabilities."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["vulnerability test results (fuzz/abuse, attack surface, known-vuln scan, SCA, dynamic resource tests)"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SVV-3D"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SVV-3.e"
    native_id: "SVV-3"
    practice: "SVV"
    title: "Vulnerability testing"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: verification
    locator: "IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.17"
    text: "e) dynamic runtime resource management testing that detects flaws not visible under static code analysis, including but not limited to denial of service conditions due to failing to release runtime handles, memory leaks and accesses made to shared memory without authentication. This testing shall be applied if such tools are available."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["vulnerability test results (fuzz/abuse, attack surface, known-vuln scan, SCA, dynamic resource tests)"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SVV-3E"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SVV-4"
    native_id: "SVV-4"
    practice: "SVV"
