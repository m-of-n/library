    native_id: "SM-1"
    practice: "SM"
    title: "Development process"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: governance
    locator: "IEC 62443-4-1:2018 §5.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.5"
    text: "A general product development/maintenance/support process shall be documented and enforced that is consistent and integrated with commonly accepted product development processes (for example, ISO 9001 [13] certified processes) that include but are not limited to: a) configuration management with change permission controls and audit record logging, b) product description and requirements definition with requirements traceability, c) software or hardware design and implementation practices, such as modular design; d) repeatable testing verification and validation process; e) review and approval of all development process records; and f) life-cycle support."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["documented development/maintenance/support process"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SM-1A, SDLA-SM-1B-1, SDLA-SM-1B-2, SDLA-SM-1C, SDLA-SM-1D, SDLA-SM-1E, SDLA-SM-1F"
