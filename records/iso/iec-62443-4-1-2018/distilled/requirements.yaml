practices:
  - id: "iec-62443-4-1-2018#SM"
    number: 1
    title: "Practice 1 – Security management"
    clause: "5"
    sdla_312_name: "Practice 1 Security Management (SM)"
    purpose_sdla_312: "The purpose of the security management practice is to ensure that the security-related activities are adequately planned, documented and executed throughout the product’s lifecycle"
    purpose_locator: "SDLA-312 v6.3 p.4 (Practices-SDLA); IEC purpose subclause 5.1 not read"
    requirement_ids: ["SM-1", "SM-2", "SM-3", "SM-4", "SM-5", "SM-6", "SM-7", "SM-8", "SM-9", "SM-10", "SM-11", "SM-12", "SM-13"]
  - id: "iec-62443-4-1-2018#SR"
    number: 2
    title: "Practice 2 – Specification of security requirements"
    clause: "6"
    sdla_312_name: "Practice 2 Specification of Security Requirements (SR)"
    purpose_sdla_312: "The processes specified by this practice are used to document the security capabilities that are required for a product along with the expected product security context"
    purpose_locator: "SDLA-312 v6.3 p.4 (Practices-SDLA); IEC purpose subclause 6.1 not read"
    requirement_ids: ["SR-1", "SR-2", "SR-3", "SR-4", "SR-5"]
  - id: "iec-62443-4-1-2018#SD"
    number: 3
    title: "Practice 3 – Secure by design"
    clause: "7"
    sdla_312_name: "Practice 3 Secure by Design (SD)"
    purpose_sdla_312: "The processes specified by this practice are used to ensure that the product is secure by design including defence in depth"
    purpose_locator: "SDLA-312 v6.3 p.4 (Practices-SDLA); IEC purpose subclause 7.1 not read"
    requirement_ids: ["SD-1", "SD-2", "SD-3", "SD-4"]
  - id: "iec-62443-4-1-2018#SI"
    number: 4
    title: "Practice 4 – Secure implementation"
    clause: "8"
    sdla_312_name: "Practice 4 Secure Implementation (SI)"
    purpose_sdla_312: "The processes specified by this practice are used to ensure that the product features are implemented securely"
    purpose_locator: "SDLA-312 v6.3 p.4 (Practices-SDLA); IEC purpose subclause 8.1 not read"
    requirement_ids: ["SI-1", "SI-2"]
  - id: "iec-62443-4-1-2018#SVV"
    number: 5
    title: "Practice 5 – Security verification and validation testing"
    clause: "9"
    sdla_312_name: "Practice 5 Security Verification and Validation Testing (SVV)"
    purpose_sdla_312: "The processes specified by this practice are used to document the security testing required to ensure that all of the security requirements have been met for the product and that the security of the product is maintained when it is used in its product security context"
    purpose_locator: "SDLA-312 v6.3 p.4 (Practices-SDLA); IEC purpose subclause 9.1 not read"
    requirement_ids: ["SVV-1", "SVV-2", "SVV-3", "SVV-4", "SVV-5"]
  - id: "iec-62443-4-1-2018#DM"
    number: 6
    title: "Practice 6 – Management of security-related issues"
    clause: "10"
    sdla_312_name: "Practice 6 Security Defect Management (DM)"
    purpose_sdla_312: "The processes specified by this practice are used for handling security-related issues of a product that has been configured to employ its defence in depth strategy (Practice 3) within the product security context (Practice 2)"
    purpose_locator: "SDLA-312 v6.3 p.4 (Practices-SDLA); IEC purpose subclause 10.1 not read"
    requirement_ids: ["DM-1", "DM-2", "DM-3", "DM-4", "DM-5", "DM-6"]
  - id: "iec-62443-4-1-2018#SUM"
    number: 7
    title: "Practice 7 – Security update management"
    clause: "11"
    sdla_312_name: "Practice 7 Security Update Management (SUM)"
    purpose_sdla_312: "The processes specified by this practice are used to ensure security updates associated with the product are tested for regressions and made available to product users in a timely manner"
    purpose_locator: "SDLA-312 v6.3 p.4 (Practices-SDLA); IEC purpose subclause 11.1 not read"
    requirement_ids: ["SUM-1", "SUM-2", "SUM-3", "SUM-4", "SUM-5"]
  - id: "iec-62443-4-1-2018#SG"
    number: 8
    title: "Practice 8 – Security guidelines"
    clause: "12"
    sdla_312_name: "Practice 8 Security Guidelines (SG)"
    purpose_sdla_312: "The processes specified by this practice are used to provide documentation that describes how to integrate, configure, and maintain the defence in depth strategy of the product in accordance with its product security context"
    purpose_locator: "SDLA-312 v6.3 p.4 (Practices-SDLA); IEC purpose subclause 12.1 not read"
    requirement_ids: ["SG-1", "SG-2", "SG-3", "SG-4", "SG-5", "SG-6", "SG-7"]

