  - id: "iec-62443-4-1-2018#SI-1"
    native_id: "SI-1"
    practice: "SI"
    title: "Security implementation review"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: implementation
    locator: "IEC 62443-4-1:2018 §8.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.14"
    text: "A process shall be employed to ensure that implementation reviews are performed for identifying, characterizing and tracking to closure security-related issues associated with the implementation of the secure design including: a) identification of security requirements (see Clause 6, Practice 2 – Specification of security requirements) that were not adequately addressed by the implementation; NOTE Requirements allocation, including security requirements, is part of typical design processes. b) identification of secure coding standards (see 8.4, SI-2 – Secure coding standards ) that were not followed (for example, use of banned functions or failure to apply principle of least privilege); c) Static Code Analysis (SCA) for source code to determine security coding errors such as buffer overflows, null pointer dereferencing, etc. using the secure coding standard for the supported programming language."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["implementation review records", "static code analysis results"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SI-1, SDLA-SI-1A, SDLA-SI-1C-1, SDLA-SI-1C-2, SDLA-SI-1C-3"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SI-1.sca-tool"
    native_id: "SI-1"
    practice: "SI"
    title: "Security implementation review"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: implementation
    locator: "IEC 62443-4-1:2018 §8.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.14"
    text: "SCA shall be done using a tool if one is available for the language used."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["implementation review records", "static code analysis results"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SI-1C-1, SDLA-SI-1C-2, SDLA-SI-1C-3"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SI-1.sca-changes"
    native_id: "SI-1"
    practice: "SI"
    title: "Security implementation review"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: implementation
    locator: "IEC 62443-4-1:2018 §8.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.14"
    text: "In addition, static code analysis shall be done on all source code changes including new source code. d) review of the implementation and its traceability to the security capabilities defined to support the security design (see Clause 7, Practice 3 – Secure by design); and e) examination of threats and their ability to exploit implementation interfaces, trust boundaries and assets (see 7.2, SD-1 – Secure design principles, and 7.3, SD-2 – defence in depth design)."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["implementation review records", "static code analysis results"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SI-1C-1, SDLA-SI-1C-2, SDLA-SI-1C-3"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SI-2"
    native_id: "SI-2"
    practice: "SI"
    title: "Secure coding standards"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: implementation
    locator: "IEC 62443-4-1:2018 §8.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.15"
    text: "The implementation processes shall incorporate security coding standards that are periodically reviewed and updated and include at a minimum: a) avoidance of potentially exploitable implementation constructs – implementation design patterns that are known to have security weaknesses; b) avoidance of banned functions and coding constructs/design patterns – software functions and design patterns that should not be used because they have known security weaknesses; c) automated tool use and settings (for example, for static analysis tools); d) secure coding practices; e) validation of all inputs that cross trust boundary. f) error handling"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["secure coding standard(s)"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SI-2, SDLA-SI-2A, SDLA-SI-2B, SDLA-SI-2D, SDLA-SI-2E, SDLA-SI-2F, SDLA-SI-2G"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SVV-1"
    native_id: "SVV-1"
    practice: "SVV"
    title: "Security requirements testing"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
