  - id: "iec-62443-4-1-2018#SVV-5"
    native_id: "SVV-5"
    practice: "SVV"
    title: "Independence of testers"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: verification
    locator: "IEC 62443-4-1:2018 §9.6.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.18"
    text: "A process shall be employed to ensure that individuals performing testing are independent from the developers who designed and implemented the product according to the following table (see next row)."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["tester independence evidence"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SVV-5"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SVV-5.levels"
    native_id: "SVV-5"
    practice: "SVV"
    title: "Independence of testers"
    normativity: definition
    verb: none
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: verification
    locator: "IEC 62443-4-1:2018 §9.6.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.18"
    text: "The levels of independence are defined as follows: • None – no independence required. Developer can perform the testing. • Independent person – the person who performs the testing cannot be one of the developers of the product. • Independent department – the person who performs the testing cannot report to the same first line manager as any developers of the product. Alternatively, they could be a member of a quality assurance (QA) department."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["tester independence evidence"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SVV-5"
    kind: stated
    testable: no
    testable_note: "defines tester independence levels used by SVV-5 Table 3"
    status: active
  - id: "iec-62443-4-1-2018#DM-1"
    native_id: "DM-1"
    practice: "DM"
    title: "Receiving notifications of security-related issues"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "A process shall exist for receiving and tracking to closure security-related issues in the product reported by internal and external sources including at a minimum: a) security verification and validation testers, b) suppliers of third-party components used in the product, c) product developers and testers, and d) product users including integrators, asset owners, end users and maintenance personnel NOTE External security verification and validation testers include researchers"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security-related issue intake and tracking records"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-1A, SDLA-DM-1B"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#DM-2"
    native_id: "DM-2"
    practice: "DM"
    title: "Reviewing security-related issues"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "A process shall exist for ensuring that reported security-related issues are investigated in a timely manner to determine their: a) applicability to the product, b) verifiability, and c) threats that trigger the issue. NOTE Timeliness is driven by market forces."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["issue investigation records"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-2"
    kind: stated
    testable: partial
    testable_note: "\"timely\" is not quantified in the requirement text"
    status: active
  - id: "iec-62443-4-1-2018#DM-3"
    native_id: "DM-3"
    practice: "DM"
    title: "Assessing security-related issues"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "A process shall be employed for analyzing valid security-related issues in the product to include: a) assessing their impact with respect to: 1) the actual security context in which they were discovered, 2) the product’s security context (Practice 2), and 3) the product’s defence in depth strategy (Practice 3), b) severity as defined by a vulnerability scoring system (for example, CVSS) c) identifying all other products/product versions containing the security-related issue (if any), d) identifying the root cause of the issue, and e) identifying related security issues."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["impact/severity/root-cause assessment records"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-3, SDLA-DM-3A, SDLA-DM-3C, SDLA-DM-3D"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#DM-3.rca"
    native_id: "DM-3"
    practice: "DM"
    title: "Assessing security-related issues"
    normativity: permission
    verb: may
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "For root cause analysis, a methodical approach such as that described in IEC 62740 [25] may be employed"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["impact/severity/root-cause assessment records"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-3D"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#DM-4"
    native_id: "DM-4"
    practice: "DM"
    title: "Addressing security-related issues"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "A process shall be employed for addressing security-related issues and determining whether to report them based on the results of the impact assessment (DM-3 – Assessing security-related issues)."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["issue disposition records", "acceptable residual risk level"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-4"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#DM-4.residual"
    native_id: "DM-4"
    practice: "DM"
    title: "Addressing security-related issues"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "The supplier shall establish an acceptable level of residual risk that shall be applied when determining appropriate way to address each issue. Options include one or more of the following: a) fixing the issue through one or more of the following: 1) defence in depth strategy or design change; 2) addition of one or more security requirements and/or capabilities; 3) use of compensating mechanisms; and/or 4) disabling or removing features b) creating a remediation plan to fix the problem, c) deferring the problem for future resolution (reapply this requirement at some time in the future) and specifying the reason(s) and associated risk(s), d) not fixing the problem if the residual risk is below the established acceptable level of residual risk"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["issue disposition records", "acceptable residual risk level"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-4"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#DM-4.all-cases"
    native_id: "DM-4"
    practice: "DM"
    title: "Addressing security-related issues"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "In all cases the following shall be done as well: e) informing other processes of the issue or related issue(s), including processes for other products/product revisions, and f) inform third parties if problems found in included third-party source code"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["issue disposition records", "acceptable residual risk level"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-4"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#DM-4.prevent"
    native_id: "DM-4"
    practice: "DM"
    title: "Addressing security-related issues"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "When security related issues are resolved recommendations to prevent similar errors from occurring in the future shall be evaluated."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["issue disposition records", "acceptable residual risk level"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-4"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#DM-4.periodic"
    native_id: "DM-4"
    practice: "DM"
    title: "Addressing security-related issues"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "This process shall include a periodic review of open security-related issues to ensure that issues are being addressed appropriately. This periodic review shall at a minimum occur during each release or iteration cycle. NOTE When the resolution decision is to fix the security-related issue in the product implementation, the timing of the release of the fix can result in a patch (see Practice 8) or the fix may be deferred until the next release."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["issue disposition records", "acceptable residual risk level"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-4"
    kind: stated
    testable: partial
    testable_note: "periodicity/\"continuous\" checkable only from records over time"
    status: active
  - id: "iec-62443-4-1-2018#DM-5"
    native_id: "DM-5"
    practice: "DM"
    title: "Disclosing security-related issues"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §10.6.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.20"
    text: "A process shall be employed for informing product users about reportable security- related issues (see 10.5, DM-4 – Addressing security-related issues) in supported products in a timely manner with content that includes but is not limited to the following information: a) issue description, vulnerability score as per CVSS or a similar system for ranking vulnerabilities, and affected product version(s); and b) description of the resolution."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security advisory / user notification"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-5"
    kind: stated
    testable: partial
    testable_note: "\"timely\" is not quantified in the requirement text"
    status: active
  - id: "iec-62443-4-1-2018#DM-6"
    native_id: "DM-6"
    practice: "DM"
    title: "Periodic review of security defect management practice"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: governance
    locator: "IEC 62443-4-1:2018 §10.7.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.21"
    text: "A process shall be employed for conducting periodic reviews of the security- related issue management process. Periodic reviews of the process shall, at a minimum, examine security-related issues managed through the process since the last periodic review to determine if the management process was complete, efficient, and led to the resolution of each security-related issue."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["periodic DM process review records"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-6"
    kind: stated
    testable: partial
    testable_note: "periodicity/\"continuous\" checkable only from records over time"
    status: active
  - id: "iec-62443-4-1-2018#DM-6.annual"
    native_id: "DM-6"
    practice: "DM"
    title: "Periodic review of security defect management practice"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: governance
    locator: "IEC 62443-4-1:2018 §10.7.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.21"
    text: "Periodic reviews of the security-related issue management process shall be conducted at least annually."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["periodic DM process review records"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-DM-6"
    kind: stated
    testable: partial
    testable_note: "periodicity/\"continuous\" checkable only from records over time"
    status: active
  - id: "iec-62443-4-1-2018#SUM-1"
    native_id: "SUM-1"
    practice: "SUM"
    title: "Security update qualification"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §11.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.22"
    text: "A process shall be employed for verifying (1) security updates created by the product developer address the intended security vulnerabilities (2) security updates do not introduce regressions, including but not limited to patches created by: a) the product developer; b) suppliers of components used in the product; and c) suppliers of components or platforms on which the product depends."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security update qualification (verification + regression) records"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SUM-1"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SUM-1.constraints"
    native_id: "SUM-1"
    practice: "SUM"
    title: "Security update qualification"
    normativity: recommendation
    verb: should
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §11.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.22"
    text: "The Process should include a verification that update is not contradicting other operational, safety or legal constraints"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security update qualification (verification + regression) records"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SUM-1"
    kind: stated
    testable: yes
    note: "Lower-case 'should' in a sentence capitalised 'The Process'; may be an ISCI/ANSI addition (SDLA-312 v5.7 'Modify ... SUM-...'); cannot be checked against IEC text (paywalled)."
    status: active
  - id: "iec-62443-4-1-2018#SUM-2"
    native_id: "SUM-2"
    practice: "SUM"
    title: "Security update documentation"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §11.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.22"
    text: "A process shall be employed to ensure that documentation about product security updates is made available to product users that includes but is not limited to: a) the product version number(s) to which the security patch applies; b) instructions on how to apply approved patches manually and via an automated process; c) description of any impacts that applying the patch to the product, including reboot; d) instructions on how to verify that an approved patch has been applied; and e) risks of not applying the patch and mediations that can be used for patches that are not approved or deployed by the asset owner."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security update documentation"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SUM-2"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SUM-3"
    native_id: "SUM-3"
    practice: "SUM"
    title: "Dependent component or operating system security update documentation"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §11.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.22"
    text: "A process shall be employed to ensure that documentation about dependent component or operating system security updates is made available to product users that includes but is not limited to: a) stating whether the product is compatible with the dependent component or operating system security update b) for security updates that are unapproved by the product vendor, the mitigations that can be used to in lieu of not applying the update."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["dependent component / OS update compatibility documentation"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SUM-3"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SUM-4"
    native_id: "SUM-4"
    practice: "SUM"
    title: "Security update delivery"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §11.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.22"
    text: "A process shall be employed to ensure that security updates for all supported products and product versions are made available to product users in a manner that facilitates verification that the security patch is authentic."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["authenticatable security update packages"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SUM-4"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SUM-5"
    native_id: "SUM-5"
    practice: "SUM"
    title: "Timely delivery of security patches"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §11.6.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.22"
    text: "A process shall be employed to define a policy that specifies the timeframes for delivering and qualifying (See SUM-1 – Security update qualification) security updates to product users and to ensure that this policy is followed."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security update timeframe policy"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SUM-5"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SUM-5.factors"
    native_id: "SUM-5"
    practice: "SUM"
    title: "Timely delivery of security patches"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: operations/response
    locator: "IEC 62443-4-1:2018 §11.6.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.22"
    text: "At a minimum, this policy shall consider the following factors: a) The potential impact of the vulnerability; b) Public knowledge of the vulnerability; c) Whether published exploits exist for the vulnerability; d) The volume of deployed products that are affected; and e) The availability of an effective mitigation in lieu of the patch."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security update timeframe policy"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SUM-5"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SG-1"
    native_id: "SG-1"
    practice: "SG"
    title: "Product defense in depth"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: release
    locator: "IEC 62443-4-1:2018 §12.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.23"
    text: "A process shall exist to create product user documentation that describes the security defence in depth strategy for the product to support installation, operation and maintenance that includes: a) security capabilities implemented by the product and their role in the defence in depth strategy; b) threats addressed by the defence in depth strategy; and c) product user mitigation strategies for known security risks associated with the product, including risks associated with legacy code."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["user documentation: product defense-in-depth strategy"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SG-1A, SDLA-SG-1B, SDLA-SG-1C"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SG-2"
    native_id: "SG-2"
    practice: "SG"
    title: "Defense in depth measures expected in the environment"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: release
    locator: "IEC 62443-4-1:2018 §12.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.23"
    text: "A process shall be employed to create product user documentation that describes the security defence in depth measures expected to be provided by the external environment in which the product is to be used (see Clause 6, Practice 2 – Specification of security requirements). NOTE These measures can also come from DM-4 – Addressing security-related issues"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["user documentation: defense-in-depth measures expected in the environment"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SG-2"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SG-3"
    native_id: "SG-3"
    practice: "SG"
    title: "Security hardening guidelines"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: release
    locator: "IEC 62443-4-1:2018 §12.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.23"
    text: "A process shall be employed to create product user documentation that includes guidelines for hardening the product when installing and maintaining the product."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security hardening guidelines"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SG-3A, SDLA-SG-3B, SDLA-SG-3C, SDLA-SG-3D, SDLA-SG-3E, SDLA-SG-3G, SDLA-SG-3H"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SG-3.content"
    native_id: "SG-3"
    practice: "SG"
    title: "Security hardening guidelines"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: release
    locator: "IEC 62443-4-1:2018 §12.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.23"
    text: "The guidelines shall include, but are not limited to, instructions, rationale and recommendations for the following: a) integration of the product, including third-party components, with its product security context (see Clause 6, Practice 2 – Specification of security requirements); b) integration of the product’s application programming interfaces/protocols with user applications; c) applying and maintaining the product’s defence in depth strategy (see Clause 7, Practice 3 – Secure by design); d) configuration and use of security options/capabilities in support of local security policies, and for each security option/capability: 1) its contribution to the product’s defence in depth strategy (see Clause 7, Practice 3 – Secure by design); 2) descriptions of configurable and default values that includes how each affects security along with any potential impact each has on work practices; and 3) setting/changing/deleting its value; e) instructions and recommendations for the use of all security-related tools and utilities that support administration, monitoring, incident handling and evaluation of the security of the product; f) instructions and recommendations for periodic security maintenance activities; g) instructions for reporting security incidents for the product to the product supplier; and h) description of the security best practices for maintenance and administration of the product."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["security hardening guidelines"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SG-3A, SDLA-SG-3B, SDLA-SG-3C, SDLA-SG-3D, SDLA-SG-3E, SDLA-SG-3G, SDLA-SG-3H"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SG-4"
    native_id: "SG-4"
    practice: "SG"
    title: "Secure disposal guidelines"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: release
    locator: "IEC 62443-4-1:2018 §12.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.24"
    text: "A process shall be employed to create product user documentation that includes guidelines for removing the product from use."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["secure disposal guidelines"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SG-4"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SG-4.content"
    native_id: "SG-4"
    practice: "SG"
    title: "Secure disposal guidelines"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: release
    locator: "IEC 62443-4-1:2018 §12.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.24"
    text: "The guidelines shall include, but is not limited to instructions and recommendations for the following: a) removing the product from its intended environment (Practice 2), b) including recommendations for removing references and configuration data stored within the environment, c) secure removal of data stored in the product, d) secure disposal of the product to prevent potential disclosure of data contained in the product that could not be removed as described in c) above"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["secure disposal guidelines"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SG-4"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SG-5"
    native_id: "SG-5"
    practice: "SG"
    title: "Secure operation guidelines"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: release
    locator: "IEC 62443-4-1:2018 §12.6.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.24"
    text: "A process shall be employed to create product user documentation that describes: a) responsibilities and actions necessary for users, including administrators, to securely operate the product; and b) assumptions regarding the behavior of the user/administrator and their relationship to the secure operation of the product."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["secure operation guidelines"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SG-5"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SG-6"
    native_id: "SG-6"
    practice: "SG"
    title: "Account management guidelines"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: deliverable
    phase: release
    locator: "IEC 62443-4-1:2018 §12.7.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.24"
    text: "A process shall be employed to create product user documentation that defines user account requirements and recommendations associated with the use of the product that includes, but is not limited to: a) user account permissions (access control) and privileges (user rights) needed to use the product, including, but not limited to operating system accounts, control system accounts and data base accounts; and b) default accounts used by the product (for example, service accounts) and instructions for changing default account names and passwords."
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["account management guidelines"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SG-6"
    kind: stated
    testable: yes
    status: active
  - id: "iec-62443-4-1-2018#SG-7"
    native_id: "SG-7"
    practice: "SG"
    title: "Documentation review"
    normativity: requirement
    verb: shall
    actor: "supplier (product developer/maintainer)"
    nature: process
    phase: release
    locator: "IEC 62443-4-1:2018 §12.8.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3 p.25"
    text: "A process shall be employed to identify, characterize, and track to closure errors and omissions in all user manuals including the security guidelines to include: a) coverage of the product’s security capabilities, b) integration of the product with its intended environment (Practice 2), and c) assurance that all documented practices are secure"
    text_kind: verbatim-via-sdla-312
    expects_deliverables: ["documentation review records"]
    verification: "ISASecure SDLA-312 v6.3 validation rows: SDLA-SG-7A, SDLA-SG-7B, SDLA-SG-7C"
    kind: stated
    testable: yes
    status: active
