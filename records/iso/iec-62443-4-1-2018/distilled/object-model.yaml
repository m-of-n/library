schema: "library-object-model/v1"
record: iec-62443-4-1-2018
source_note: >
  Read from the free material only: IEC preview (Scope, Introduction, Figure 2, ToC), iTeh sample (terms
  3.1.1-3.1.17), SDLA-312 v6.3 (requirement text + Table 3), SDLA-300 v1.9 (certification). Locators:
  'Fig 2' / '§3.1.x' = IEC preview/sample; 'SM-1' etc. = requirement text via SDLA-312; 'SDLA-300 R5' = ISCI.
  ARCH-0001 = tmodel spec/ARCH-0001-PROPOSAL-v0.2.0.md; DL-0009 = design-log/0009 (R-040..R-044).
objects:
  - {name: ProductSupplier, definition: "organization that develops/maintains the product using a 62443-4-1-compliant process; the 'supplier' of every requirement", attributes: [name], locator: "Fig 2; Scope; SM-8 'The supplier shall'", kind: stated, tmodel_mapping: "Party (§2b) with manufactured_by/supplied_by edge role", notes: "Scope: applies to developer and maintainer, NOT integrator or user"}
  - {name: DevelopmentOrganization, definition: "part of a supplier's organization that develops products and defines and employs a secure development process encompassing all 62443-4-1 practices", attributes: [name, sdl_process_ref, scope_components_or_systems], locator: "SDLA-300 §3.1.7", kind: stated, tmodel_mapping: "Party (org unit facet)", notes: "ISCI definition; the unit that is certified"}
  - {name: SystemIntegrator, definition: "integrates products into an Automation Solution (IEC 62443-2-4/3-2)", attributes: [], locator: "Fig 2; Introduction", kind: stated, tmodel_mapping: "Party role (edge)", notes: "out of 4-1 scope"}
  - {name: AssetOwner, definition: "individual or organization responsible for one or more IACSs", attributes: [], locator: "§3.1.6; Fig 2", kind: stated, tmodel_mapping: "Party role owner (owned_by edge)", notes: ""}
  - {name: ProductUser, definition: "integrators, asset owners, end users and maintenance personnel receiving documentation/notifications", attributes: [], locator: "DM-1 d); DM-5; SUM-2; SG-*", kind: stated, tmodel_mapping: "Party role (consumer)", notes: ""}
  - {name: Product, definition: "system, subsystem or component (applications, embedded devices, network components, host devices) developed independent of the intended environment", attributes: [version, supported, capability_security_level_SL_C], locator: "Fig 2; SR-4 b); SDLA-300 §3.1.17", kind: stated, tmodel_mapping: "Product / ProductInstance(versioned)", notes: "SL-C links to 62443-4-2/3-3 technical requirements"}
  - {name: Component, definition: "one of the parts that make up a product or system (hardware or software, may be subdivided)", attributes: [], locator: "§3.1.13", kind: stated, tmodel_mapping: "Component (CPE/purl)", notes: ""}
  - {name: ExternallyProvidedComponent, definition: "component not developed by the supplier used within the product (third-party / open-source)", attributes: [supplier, risk_assessment], locator: "SM-9", kind: stated, tmodel_mapping: "Component + supplied_by Party", notes: "SBOM-adjacent; SVV-3 d) SCA on binaries"}
  - {name: CustomThirdPartyComponent, definition: "component developed specifically for a single supplier for a specific purpose that can impact security", attributes: [], locator: "SM-10", kind: stated, tmodel_mapping: "Component (subtype) — new flag", notes: "its supplier's lifecycle must conform to 62443-4-1"}
  - {name: DependentComponent, definition: "component external to the product on which the product depends (e.g. JRE, driver, OS)", attributes: [], locator: "§3.1.16; SUM-3", kind: stated, tmodel_mapping: "Component + depends_on edge", notes: ""}
  - {name: AutomationSolution, definition: "control system and complementary hw/sw installed and configured to operate in an IACS", attributes: [], locator: "§3.1.10; Fig 2", kind: stated, tmodel_mapping: "Deployment / Environment", notes: "out of 4-1 scope"}
  - {name: SDLProcess, definition: "the documented, enforced product development/maintenance/support process implementing the practices", attributes: [version, scope_products], locator: "SM-1; SM-3; SDLA-300 R1", kind: stated, tmodel_mapping: "SDL / SecurityProgram (R-041)", notes: "SDLA-300 requires it to be named and under version control"}
  - {name: Practice, definition: "one of 8 groupings of requirements (SM, SR, SD, SI, SVV, DM, SUM, SG)", attributes: [code, number, purpose], locator: "ToC Clauses 5-12; SDLA-312 p.4", kind: stated, tmodel_mapping: "new (Practice) or Requirement grouping", notes: ""}
  - {name: Requirement, definition: "a numbered process requirement (SM-1..SG-7, 47 ids)", attributes: [id, title, text, clause], locator: "Clauses 5-12; Annex B", kind: stated, tmodel_mapping: "Requirement (R-042/R-044)", notes: "each has a 'Rationale and supplemental guidance' subclause (not read)"}
  - {name: MaturityLevel, definition: "ML1..ML4 rating of how well a practice is implemented", attributes: [level, label], locator: "§4.2, Table 1 (ToC only); secondary sources", kind: inferred, tmodel_mapping: "new (MaturityLevel) — conformance grade on a Requirement/Practice assessment", notes: "see state-machine.yaml sdl-maturity-level"}
  - {name: Role, definition: "organizational role responsible for a required process", attributes: [name, required_training], locator: "SM-2; SM-4", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: Personnel, definition: "individuals assigned to roles, with demonstrated security expertise", attributes: [training_records], locator: "SM-2; SM-4; SVV-5", kind: stated, tmodel_mapping: "Party (person)", notes: ""}
  - {name: TrainingProgram, definition: "security training and assessment programme", attributes: [], locator: "SM-4", kind: stated, tmodel_mapping: "new / none", notes: ""}
  - {name: ProductSecurityContext, definition: "the intended security context of the product (environment, assumptions)", attributes: [], locator: "SR-1; SD-1 b); DM-3 a) 2)", kind: stated, tmodel_mapping: "Environment + assumptions (partial)", notes: "62443 keeps product-side context separate from the actual deployment context (DM-3 a) 1))"}
  - {name: ThreatModel, definition: "product-specific threat model for the current development scope, reviewed at least yearly for released products", attributes: [scope, last_reviewed, reviewed_by_team], locator: "SR-2 (all rows)", kind: stated, tmodel_mapping: "the tmodel model instance itself (governed view R-043)", notes: "characteristics a)-m) are DFD elements: information flow, trust boundaries, processes, data stores, external entities, protocols, physical ports, JTAG/debug, attack vectors, threats+severity, issues, mitigations/dispositions, external dependencies"}
  - {name: InformationFlow, definition: "flow of categorized information throughout the system", attributes: [classification], locator: "SR-2 a)", kind: stated, tmodel_mapping: "DataFlow + data classification", notes: ""}
  - {name: TrustBoundary, definition: "trust boundary", attributes: [], locator: "SR-2 b); SD-1 d); SD-4 f)", kind: stated, tmodel_mapping: "TrustBoundary (zone)", notes: ""}
  - {name: Process, definition: "process (DFD element)", attributes: [], locator: "SR-2 c)", kind: stated, tmodel_mapping: "Process (DFD)", notes: ""}
  - {name: DataStore, definition: "data store", attributes: [], locator: "SR-2 d)", kind: stated, tmodel_mapping: "DataStore", notes: ""}
  - {name: ExternalEntity, definition: "interacting external entity", attributes: [], locator: "SR-2 e)", kind: stated, tmodel_mapping: "ExternalEntity", notes: ""}
  - {name: CommunicationProtocol, definition: "internal and external communication protocols implemented", attributes: [], locator: "SR-2 f)", kind: stated, tmodel_mapping: "Interconnect / DataFlow protocol attribute", notes: ""}
  - {name: PhysicalPort, definition: "externally accessible physical ports incl. debug ports; circuit-board JTAG/debug headers", attributes: [externally_accessible], locator: "SR-2 g) h); SD-4 g)", kind: stated, tmodel_mapping: "AttackSurface (hardware) — partial", notes: "hardware attack surface is first-class in 62443"}
  - {name: Interface, definition: "physical or logical interface of the product, characterised in the secure design", attributes: [externally_accessible, crosses_trust_boundary, users, assets_reachable, roles_privileges, safeguards, third_party_impl, usage_doc], locator: "SD-1 a)-j)", kind: stated, tmodel_mapping: "AttackSurface / entry point on Component", notes: "SD-1 is effectively an interface schema"}
  - {name: Asset, definition: "physical or logical object with value to the organization (here: part of an IACS)", attributes: [], locator: "§3.1.5; SD-1 c)", kind: stated, tmodel_mapping: "Asset", notes: ""}
  - {name: AttackVector, definition: "potential attack vector incl. hardware attacks", attributes: [], locator: "SR-2 i)", kind: stated, tmodel_mapping: "AttackPattern / AttackPath", notes: ""}
  - {name: Threat, definition: "potential threat with severity per a vulnerability scoring system (e.g. CVSS)", attributes: [severity, scoring_system], locator: "SR-2 j)", kind: stated, tmodel_mapping: "ThreatInstance + RiskScore", notes: "severity via CVSS — conflicts with tmodel's DEC-003 risk metric only in scale choice"}
  - {name: MitigationOrDisposition, definition: "mitigation and/or disposition for each threat", attributes: [kind, tested], locator: "SR-2 k); SVV-2", kind: stated, tmodel_mapping: "MitigationInstance (R-040; DEC-009)", notes: "'disposition' = accepted/transferred, not only mitigated"}
  - {name: SecurityRequirement, definition: "documented product security requirement incl. installation, operation, maintenance, decommissioning capabilities; scope/boundaries; SL-C", attributes: [scope_boundaries, SL_C], locator: "SR-3; SR-4", kind: stated, tmodel_mapping: "product-level requirement (distinct from spec Requirement) — new", notes: "two Requirement kinds: SDL process requirement vs product security requirement"}
  - {name: SecureDesign, definition: "documented secure design characterising every interface and how the design mitigates threats", attributes: [revision], locator: "SD-1; SD-3", kind: stated, tmodel_mapping: "WorkProduct", notes: ""}
  - {name: DefenseInDepthLayer, definition: "one of multiple layers of defence with assigned responsibilities, risk-based on the threat model", attributes: [responsibility], locator: "SD-2; §3.1.15; SG-1; SG-2", kind: stated, tmodel_mapping: "MitigationInstance grouping / RedundancyGroup? — new", notes: ""}
  - {name: Review, definition: "design review, implementation review, requirements review, threat-model review, documentation review — each identifies, characterises and tracks issues to closure", attributes: [subject, revision, participants, issues], locator: "SR-5; SR-2.review; SD-3; SI-1; SG-7", kind: stated, tmodel_mapping: "Review (§5)", notes: "SR-5 fixes reviewer disciplines (architects/developers, testers, customer advocate, Security Advisor)"}
  - {name: CodingStandard, definition: "security coding standard periodically reviewed and updated (banned functions, tool settings, input validation, error handling)", attributes: [language, version], locator: "SI-2; §3.1.11; §3.1.17", kind: stated, tmodel_mapping: "WorkProduct / Mitigation(kind=process)", notes: ""}
  - {name: SecurityTest, definition: "a test activity of a type in Table 3 (requirements, threat mitigation, abuse case/fuzz, SCA, attack surface analysis, known-vuln scan, software composition analysis, penetration)", attributes: [type, plan, results, independence_level], locator: "SVV-1..SVV-5; SI-1 c); Table 3", kind: stated, tmodel_mapping: "Evidence (R-042) — new", notes: ""}
  - {name: IndependenceLevel, definition: "None | Independent person | Independent department | (organization, for penetration testing)", attributes: [], locator: "SVV-5.levels; Table 3", kind: stated, tmodel_mapping: "enum on Evidence/Review — new", notes: ""}
  - {name: SecurityRelatedIssue, definition: "issue in the product reported by internal/external sources, tracked to closure", attributes: [source, applicability, verifiability, severity_cvss, affected_versions, root_cause, related_issues, disposition, reportable], locator: "DM-1..DM-5", kind: stated, tmodel_mapping: "Finding / Vulnerability", notes: "lifecycle in state-machine.yaml"}
  - {name: Reporter, definition: "source of issue reports: V&V testers (incl. researchers), third-party component suppliers, developers/testers, product users", attributes: [kind], locator: "DM-1 a)-d)", kind: stated, tmodel_mapping: "Party (reported_by)", notes: ""}
  - {name: ResidualRiskThreshold, definition: "supplier-established acceptable level of residual risk applied to issue dispositions", attributes: [level], locator: "DM-4.residual", kind: stated, tmodel_mapping: "new (risk acceptance criterion) — relates to DEC-003", notes: ""}
  - {name: SecurityAdvisory, definition: "notification to product users of a reportable issue: description, CVSS-or-similar score, affected versions, resolution", attributes: [description, score, affected_versions, resolution], locator: "DM-5", kind: stated, tmodel_mapping: "VEX/advisory statement — new/external", notes: ""}
  - {name: SecurityUpdate, definition: "patch/update addressing vulnerabilities; qualified (verification + no regression), documented, authenticatable, delivered within policy timeframes", attributes: [applies_to_versions, authentic, qualified], locator: "SUM-1..SUM-5; SM-7", kind: stated, tmodel_mapping: "ProductInstance version transition (§3b maintenance/update)", notes: ""}
  - {name: UpdateTimeframePolicy, definition: "policy specifying delivery/qualification timeframes considering impact, public knowledge, exploits, deployed volume, mitigation availability", attributes: [factors], locator: "SUM-5", kind: stated, tmodel_mapping: "new", notes: ""}
  - {name: UserDocumentation, definition: "security guidelines: defense-in-depth strategy, expected environment measures, hardening, disposal, secure operation, account management", attributes: [kind], locator: "SG-1..SG-6; SUM-2; SUM-3", kind: stated, tmodel_mapping: "Mitigation(kind=documentation) (R-040)", notes: "SG makes documentation a first-class mitigation, exactly R-040's documentation kind"}
  - {name: CodeSigningKey, definition: "private key used for code signing, protected by procedural and technical controls", attributes: [], locator: "SM-8", kind: stated, tmodel_mapping: "key (supply-chain provenance, ADR-0001)", notes: ""}
  - {name: IntegrityMechanism, definition: "integrity verification mechanism for scripts, executables and important files", attributes: [], locator: "SM-6; SUM-4", kind: stated, tmodel_mapping: "supply-chain provenance (deferred to radar contract)", notes: ""}
  - {name: Release, definition: "product or patch release gated on closed issues and completed processes", attributes: [], locator: "SM-11; SM-12", kind: stated, tmodel_mapping: "Gate (R-041)", notes: "SM-11 + SM-12 are the release gate exit criteria"}
  - {name: ProcessCompletionRecord, definition: "record documenting completion of each applicable security-related process prior to release", attributes: [process, completed_at], locator: "SM-12", kind: stated, tmodel_mapping: "Evidence (R-042)", notes: ""}
  - {name: ScopingJustification, definition: "documented security analysis justifying which parts of the standard apply to a project, approved by expert personnel", attributes: [approved_by], locator: "SM-5", kind: stated, tmodel_mapping: "tailoring record — new", notes: "the 62443 tailoring mechanism"}
  - {name: SDLACertification, definition: "ISASecure certification of a named development organization + named, version-controlled SDL", attributes: [expiry, isasecure_version, evaluation_method], locator: "SDLA-300 R1, R2, R8", kind: stated, tmodel_mapping: "Attestation / Review (external) — new", notes: "ISCI scheme, not IEC"}
  - {name: Certifier, definition: "chartered laboratory accredited by ASCI", attributes: [], locator: "SDLA-300 §3.1.3-3.1.4", kind: stated, tmodel_mapping: "Party (standards/assessment body)", notes: ""}
  - {name: Nonconformity, definition: "major or minor nonconformity found in recertification audit", attributes: [severity], locator: "SDLA-300 §3.1.13, §3.1.15; Table 1", kind: stated, tmodel_mapping: "Finding (audit) — new", notes: ""}
