gaps:
  - "Practice and MaturityLevel: tmodel has Requirement (R-044) and Gate (R-041) but no per-practice maturity grade; 62443-4-1 conformance is graded (ML1-4), not boolean — R-042 conformance needs a level, not just pass/fail."
  - "Two kinds of requirement: SDL process requirement (SM-1..SG-7) vs product security requirement (SR-3/SR-4 with SL-C). tmodel's Requirement object conflates them."
  - "Threat disposition beyond mitigation (SR-2 k), DM-4 c)/d)): deferral with reason and risk, and acceptance below a residual-risk threshold — MitigationInstance needs a disposition enum + ResidualRiskThreshold."
  - "Interface as an object with SD-1 attributes (externally accessible, crosses trust boundary, reachable assets, roles/privileges, safeguards) — tmodel's AttackSurface is thinner."
  - "Hardware attack surface (physical/debug ports, JTAG headers) — SR-2 g) h), SD-4 g)."
  - "Tester independence level on Evidence (SVV-5 Table 3)."
  - "Scoping/tailoring justification approved by expert personnel (SM-5)."
  - "SecurityRelatedIssue lifecycle (DM-1..DM-5) is a state machine tmodel's Finding lacks."
  - "SecurityUpdate qualification/documentation/delivery-policy objects (SUM-1..5)."
  - "External certification (SDLACertification, Certifier, Nonconformity) — an attestation object distinct from an internal Review."
