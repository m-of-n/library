  note: "NOT READ. Summary written 2026-11-03 from the ISO catalogue abstract of Part 1 only; the normative text was not read and no part was obtained. Only the catalogue page for Part 1 was seen, through one Internet Archive capture (20261020175509), because www.iso.org returned 403 to our client on 2026-11-01. That capture shows ISO/IEC 11889-1:2015, Edition 2, 2015-08, English corrected version 2016-03, 257 pages, committee ISO/IEC JTC 1, status Published, last reviewed and confirmed 2021, stage 90.92 (to be revised) since 2026-05-29, to be replaced by ISO/IEC DIS 11889-1 (under development). It lists Part 1 at CHF 0, so this is not paywalled: as for iso-iec-19790, a CHF 0 download still goes through the ISO Customer Licence Agreement, whose AI-use clause stopped iso-iec-5962-2021; whether the same text applies here was not checked, and obtaining it is a human decision. The TCG library page (fetched 2026-11-05) says JTC 1 approved the TCG TPM Library Specification 2.0 as ISO/IEC 11889:2015, Parts 1-4. The Part-to-TCG-revision mapping was not established. Do not summarise from memory: tcg-tpm-2-0-library-184 and tcg-tpm-2-0-library-185 are the readable TCG text."
