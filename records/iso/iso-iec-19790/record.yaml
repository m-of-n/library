  note: "NOT READ, NOT FETCHED (2026-11-05). Bibliographic facts only. Licence: the user accepted ISO's free-download licence for the 2025 edition on their behalf, but it forbids AI processing, so the text must not be read. The CHF 0 download goes through the ISO End Customer Licence Agreement (Publicly Available Standards licence page, fetched 2026-11-05, which incorporates it), whose clause 7(b) reads: 'The Licensee is not permitted to access, use, or process the ISO Publication for or related to any machine learning, artificial intelligence (AI), or analogous computational purposes, unless such use is expressly authorized under a separate licence agreement issued by ISO, an ISO Member Body, or an authorized distributor.' (https://www.iso.org/terms-conditions-licence-agreement.html#Customer-Licence, section B, clause 7(b); Internet Archive capture 20261023130946, because www.iso.org returned 403). No bytes were obtained either: standards.iso.org/ittf/PubliclyAvailableStandards/ says the site is closed and returns the licence page for any path, also after 'I accept'; the ISO webstore (www.iso.org) returned 403 to our client and needs a customer account. No sha256. Catalogue facts (Internet Archive captures 20261017090619 and 20261017010159, www.iso.org 403): ISO/IEC 19790:2012 Edition 2, 2012-08, corrected 2015-11, 72 pages, ISO/IEC JTC 1/SC 27, Withdrawn (stage 95.99, 2025-02-26), revised by ISO/IEC 19790:2025, Edition 3, 2025-02, 80 pages, Published, price CHF 0 (https://www.iso.org/standard/82423.html). Catalogue prose was removed 2026-11-05: the iso.org footer forbids using ISO content for machine learning. The title and id stay on the 2012 edition because fips-140-3 refers to this record; fips-140-3 is the readable related text. Earlier bears_on value DEC-009 removed: it came from Threat-Radar's numbering and does not mean the same on mofn."
