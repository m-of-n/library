  note: "NOT READ. Summary written 2026-11-03 from the ISO catalogue abstract of the 2012 edition only; the normative text of neither edition was read. The 2012 catalogue capture (20261017090619) also shows 72 pages and committee ISO/IEC JTC 1/SC 27. The 2025 edition was not downloaded: a CHF 0 download still goes through the ISO Customer Licence Agreement, whose AI-use clause stopped iso-iec-5962-2021 (see that record); whether the same text applies here was not checked. Neither edition was obtained. Only catalogue pages were seen, through Internet Archive captures dated 2026-10-17, because www.iso.org returned 403 to our client on 2026-11-01. They show ISO/IEC 19790:2012 Edition 2, 2012-08, corrected 2015-11, status Withdrawn, revised by ISO/IEC 19790:2025, Edition 3, 2025-02, 80 pages, status Published (https://www.iso.org/standard/82423.html). The captured price of the 2025 edition is CHF 0, struck through from CHF 607, so a person can probably obtain it through the ISO store; a store checkout was not attempted. The title and id stay on the 2012 edition because fips-140-3 refers to this record; fips-140-3 is the readable related text. Do not summarise the normative content from memory or from the catalogue page; summary.md reports only what the catalogue states, labelled as such. Earlier bears_on value DEC-009 removed: it came from Threat-Radar's numbering and does not mean the same on mofn."
