  note: "NOT READ. Summary written 2026-11-03 from the ISO catalogue abstract of the 2017 edition only; the normative text of neither edition was read. The 2017 catalogue capture shows committee ISO/IEC JTC 1/SC 27. The 2025 edition was not downloaded: a CHF 0 download still goes through the ISO Customer Licence Agreement, whose AI-use clause stopped iso-iec-5962-2021 (see that record); whether the same text applies here was not checked. Neither edition was obtained. Only catalogue pages were seen, through Internet Archive captures dated 2026-05-19 and 2026-10-01, because www.iso.org returned 403 to our client on 2026-11-01. They show ISO/IEC 24759:2017 Edition 3, 2017-03, 135 pages, status Withdrawn 2025-02-26, revised by ISO/IEC 24759:2025, Edition 4, 2025-02, 182 pages, status Published (https://www.iso.org/standard/82424.html). The captured price of the 2025 edition is CHF 0, so a person can probably obtain it through the ISO store; a store checkout was not attempted. The title and id stay on the 2017 edition because fips-140-3 refers to this record. Do not summarise the normative content from memory or from the catalogue page; summary.md reports only what the catalogue states, labelled as such. Earlier bears_on value DEC-009 removed: it came from Threat-Radar's numbering and does not mean the same on mofn."
