  - id: "iso-iec-30111-2019#6.1-R03"
    normativity: recommendation
    verb: should
    actor: vendor
    nature: deliverable
    phase: governance
    locator: "§6.1"
    text: "Vendors should document their vulnerability handling processes in order to ensure that they are repeatable."
    expects_deliverables: ["vulnerability handling process documentation"]
    verification: "documented procedure exists"
    kind: stated
    testable: yes
  - id: "iso-iec-30111-2019#6.1-R04"
    normativity: recommendation
    verb: should
    actor: vendor
    nature: deliverable
    phase: governance
    locator: "§6.1"
    text: "The documentation should describe the procedures and methods used to track all reported vulnerabilities."
    expects_deliverables: ["vulnerability handling process documentation (tracking procedures)"]
    verification: "documentation covers tracking of all reported vulnerabilities"
    kind: stated
    testable: yes
  - id: "iso-iec-30111-2019#6.2.1-R01"
    normativity: recommendation
    verb: should
    actor: "top management"
    nature: process
    phase: governance
    locator: "§6.2.1 a)-h)"
    text: "Top management should demonstrate leadership and commitment with respect to vulnerability handling by: a) ensuring the policy and the objectives of vulnerability handling are established and are compatible with the strategic direction of the organization; b) ensuring the integration of the vulnerability handling into the organization’s processes; c) ensuring that the resources needed for the vulnerability handling are available; d) communicating the importance of effective vulnerability handling; e) ensuring that the vulnerability handling process achieves its intended outcome(s); f) directing and supporting persons to contribute to the effectiveness of the vulnerability handling process; g) promoting continual improvement; and h) supporting other relevant management roles to demonstrate their leadership as it applies to their areas of responsibility."
    expects_deliverables: []
    verification: "management review / interview; resourcing and objectives evidence"
    kind: stated
    testable: partial
    testable_reason: "leadership behaviours a)-h) are judged by audit, not mechanically"
  - id: "iso-iec-30111-2019#6.2.2-R01"
    normativity: recommendation
    verb: should
    actor: "top management"
    nature: deliverable
    phase: governance
    locator: "§6.2.2 a)-c)"
    text: "Top management should establish vulnerability handling policy that: a) is appropriate to the purpose of the organization; b) includes a best-effort commitment to satisfy user’s requirements related to its product or online service security; and c) includes a commitment to continual improvement of the vulnerability handling process."
    expects_deliverables: ["vulnerability handling policy (management-level)"]
    verification: "policy exists and contains commitments b) and c)"
    kind: stated
    testable: yes
  - id: "iso-iec-30111-2019#6.2.3-R01"
    normativity: recommendation
    verb: should
    actor: "top management"
    nature: process
    phase: governance
    locator: "§6.2.3"
    text: "Top management should ensure that the responsibilities and authorities for roles relevant to vulnerability handling are assigned and communicated."
    expects_deliverables: ["role/responsibility assignment (RACI or equivalent)"]
    verification: "assignment exists and was communicated"
    kind: stated
    testable: yes
  - id: "iso-iec-30111-2019#6.2.3-R02"
    normativity: recommendation
    verb: should
    actor: "top management"
    nature: process
    phase: governance
    locator: "§6.2.3 a)-b)"
    text: "Top management should assign the responsibility and authority for: a) ensuring that the vulnerability handling process conforms to the requirements of this document; and b) reporting on the performance of the vulnerability handling to top management."
    expects_deliverables: ["named conformance owner", "performance reports to top management"]
    verification: "named owner; periodic performance reporting evidence"
    kind: stated
    testable: yes
