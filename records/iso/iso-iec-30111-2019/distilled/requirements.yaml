reconciliation: >
  No BCP 14 keywords: ISO/IEC Directives Part 2 uses lowercase "shall" (requirement), "should"
  (recommendation) and "may" (permission); these are the normative forms counted. Of the 28 "should"
  in the preview capture, 26 are extracted. The two not extracted are descriptive, not recommendations:
  §6.1 "Clause 6 describes the organizational elements that vendors should consider" (a statement about
  the clause) and §6.3 "defines who is responsible ... and how they should handle reports" (describes the
  content of the policy, whose required items follow in the next sentence, extracted as #6.3-R03).
  The ISO foreword boilerplate ("should be noted", "should be directed", "shall not be held responsible",
  "may be the subject of patent rights") and the copyright page were removed from the capture and are not
  counted. Two inferred requirements (kind: inferred) carry no normative verb: §6.5.1 and §6.5.3.3
  "A PSIRT is responsible for ...". The FULL STANDARD's count is unknown: Clauses 6.5.4-8 (incl. the
  7.1 phase requirements) were not readable; Annex A of the full text summarizes every normative provision.
