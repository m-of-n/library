schema: "library-object-model/v1"
record: iso-iec-30111-2019
source_scope: "free preview only (Clauses 1-6.5.3.4, Figure 1, Contents)"
reviewed_by: ""
note: >
  Object-model pass over ISO/IEC 30111:2019. 30111 imports its vocabulary from ISO/IEC 29147 (Clause 3),
  so Vulnerability, Vendor, Reporter, Coordinator, Remediation and Advisory are NOT repeated here — see
  records/iso/iso-iec-29147-2018/distilled/object-model.yaml. This file adds the organisational objects of
  Clause 6 (fully visible) and the process objects of Clause 7 (headings only).

objects:
  - name: TopManagement
    definition: "the management that demonstrates leadership, establishes policy and assigns responsibility for vulnerability handling"
    locator: "§6.2.1-§6.2.3"
    kind: stated
    tmodel_mapping: "Party role (approver) — DL-0009 'document-owner/approver is a Party role'"
  - name: VulnerabilityHandlingPolicy
    definition: "internal policy 'to define and clarify its intentions for investigating and remediating vulnerabilities as part of a vulnerability handling process'"
    attributes: [guidance_principles_responsibilities, responsible_departments_and_roles, premature_disclosure_safeguards, target_remediation_schedule, commitment_best_effort, commitment_continual_improvement]
    locator: "§6.2.2 a)-c); §6.3 a)-d)"
    kind: stated
    tmodel_mapping: "WorkProduct / governed document (R-043) — evidence for Requirement 6.3-R01 (R-042)"
    notes: "The only 'shall' deliverable visible in 30111. Item d) 'a target schedule for remediation development' is the hook for remediation SLAs (cf. EU CRA Annex I Part II)."
  - name: VulnerabilityDisclosurePolicy
    definition: "the external policy required by ISO/IEC 29147; audience internal and external stakeholders"
    locator: "§6.3 (last paragraph)"
    kind: stated
    tmodel_mapping: "see iso-iec-29147-2018 object-model"
  - name: VulnerabilityHandlingProcess
    definition: "the vendor's process for investigating and remediating potential vulnerabilities; documented, repeatable, periodically assessed"
    attributes: [documentation, tracking_procedures, assessment_history]
    locator: "§6.1; Clause 7 headings"
    kind: stated
    tmodel_mapping: "SDL/SecurityProgram sub-process (R-041); MitigationInstance kind=process (R-040)"
  - name: ProcessAssessment
    definition: "periodic assessment that the process 'performs as expected' and supports improvement"
    locator: "§6.1; §7.2 Process monitoring heading"
    kind: stated
    tmodel_mapping: "Review (ARCH-0001 §5) on the process"
  - name: OrganizationalFramework
    definition: "framework 'designed, recognized, and supported by the stakeholder divisions of the vendor responsible for each area' (engineering, customer service, public relations)"
    locator: "§6.4"
    kind: stated
    tmodel_mapping: "new (organisational structure; Party-to-Party edges)"
  - name: DecisionRole
    definition: "role or capability responsible for and with authority to make decisions on vulnerability handling, preferably at management level"
    locator: "§6.4"
    kind: stated
    tmodel_mapping: "Party role (approver of Gate / Review)"
  - name: PointOfContact
    definition: "internal per-division point of contact, and an external point of contact for external parties"
    attributes: [scope (internal-division | external), channel]
    locator: "§6.4; §6.5.3.3 (single entry-point: e-mail address or web form)"
    kind: stated
    tmodel_mapping: "Party contact attribute; external PoC is a published endpoint (cf. security.txt)"
  - name: PSIRT
    definition: "Product Security Incident Response Team (or CSIRT): coordinates external vulnerability reports and internal handling; single point of contact for reporters, coordinators and other vendors"
    attributes: [placement (central | business-unit), coverage (all products and services)]
    locator: "§4; §6.5.1-§6.5.3"
    kind: stated
    tmodel_mapping: "Party (organisational unit) with role coordinator-of-handling"
  - name: ProductBusinessDivision
    definition: "division responsible for a product; receives dispatched reports through its contact person"
    locator: "§6.5.3.4; §6.6 heading"
    kind: stated
    tmodel_mapping: "Party (owner of Product: Product manufactured_by/owned_by)"
  - name: CustomerSupportDivision
    definition: "may receive vulnerability reports from customers with support contracts; needs processes and training; partners with the PSIRT"
    locator: "§6.5.3.3; §6.7 heading"
    kind: stated
    tmodel_mapping: "Party role"
  - name: PublicRelationsDivision
    definition: "divisions responsible for customer and public relations, prepared to respond after disclosure"
    locator: "§6.4; §6.7 heading"
    kind: stated
    tmodel_mapping: "Party role"
  - name: ProductContactDatabase
    definition: "'a database of contacts for each product' built by the PSIRT with product and services divisions"
    locator: "§6.5.3.4"
    kind: stated
    tmodel_mapping: "derivable from Product → owned_by → Party edges (no new object needed)"
  - name: PublicVulnerabilitySource
    definition: "known public sources of vulnerability information: mailing lists, social media, discussion forums, vulnerability databases"
    locator: "§6.5.3.2"
    kind: stated
    tmodel_mapping: "external ref / radar feed (ADR-0001 radar→tmodel contract)"
  - name: StaffCapability
    locator: "§6.5.4 heading"
    kind: inferred
    tmodel_mapping: "none (training/competence; canonical phase 'training')"
  - name: HandlingPhase
    definition: "Preparation, Receipt, Verification, Remediation development, Release, Post-release"
    locator: "§7.1.2-§7.1.7 headings; Figure 1"
    kind: stated
    tmodel_mapping: "states of the per-vulnerability lifecycle — see state-machine.yaml; nearest tmodel home is the DEC-009 mitigation lifecycle, NOT LifecyclePhase"
  - name: RemediationSchedule
    definition: "'a target schedule for remediation development' (policy item)"
    locator: "§6.3 d)"
    kind: stated
    tmodel_mapping: "attribute of MitigationInstance (planned vs actual dates — same shape as R-041 Gate dates)"
  - name: SupplyChainConsideration
    locator: "Clause 8 heading; §5.3 (27036-3)"
    kind: inferred
    tmodel_mapping: "uses_component propagation (ARCH-0001 §5); upstream/downstream vendor edges"

edges:
  - {name: used_in_conjunction_with, from: "ISO/IEC 30111 handling process", to: "ISO/IEC 29147 disclosure process", cardinality: "1:1", locator: "§5.1 (shall)", kind: stated, tmodel_mapping: "R-044 crosswalk"}
  - {name: establishes, from: TopManagement, to: VulnerabilityHandlingPolicy, cardinality: "1:1", locator: "§6.2.2", kind: stated, tmodel_mapping: "Review/approval of governed document (R-043)"}
  - {name: assigns_responsibility, from: TopManagement, to: DecisionRole, cardinality: "1:N", locator: "§6.2.3", kind: stated, tmodel_mapping: "Party role assignment"}
  - {name: reports_performance_to, from: DecisionRole, to: TopManagement, cardinality: "N:1", locator: "§6.2.3 b)", kind: stated, tmodel_mapping: "none"}
  - {name: maintains, from: Vendor, to: VulnerabilityHandlingPolicy, cardinality: "1:1", locator: "§6.3 (shall)", kind: stated, tmodel_mapping: "document owner (R-043)"}
  - {name: compatible_with, from: VulnerabilityHandlingPolicy, to: VulnerabilityDisclosurePolicy, cardinality: "1:1", locator: "§6.3", kind: stated, tmodel_mapping: "consistency constraint between two governed views"}
  - {name: governs, from: VulnerabilityHandlingPolicy, to: VulnerabilityHandlingProcess, cardinality: "1:1", locator: "§6.3 ('as part of a vulnerability handling process')", kind: stated, tmodel_mapping: "R-041 SDL program ↔ policy"}
  - {name: assesses, from: ProcessAssessment, to: VulnerabilityHandlingProcess, cardinality: "N:1", locator: "§6.1", kind: stated, tmodel_mapping: "Review targets"}
  - {name: covers, from: VulnerabilityHandlingProcess, to: "Product/Service (all)", cardinality: "1:N", definition: "'include all of their products and services'", locator: "§6.5.2", kind: stated, tmodel_mapping: "SDL program attached to Product/ProductFamily (R-041)"}
  - {name: part_of, from: PSIRT, to: Vendor, cardinality: "N:1", locator: "§6.5.2 (centrally, or within a business unit)", kind: stated, tmodel_mapping: "Party member_of Party"}
  - {name: receives_reports_via, from: PSIRT, to: PointOfContact, cardinality: "1:1", definition: "single entry-point", locator: "§6.5.3.3", kind: stated, tmodel_mapping: "none"}
  - {name: monitors, from: PSIRT, to: PublicVulnerabilitySource, cardinality: "1:N", locator: "§6.5.3.2", kind: stated, tmodel_mapping: "radar feed"}
  - {name: dispatches_report_to, from: PSIRT, to: ProductBusinessDivision, cardinality: "1:N", definition: "identify the responsible product business division and dispatch the report through the contact person", locator: "§6.5.3.4", kind: stated, tmodel_mapping: "Finding assigned_to Party (owner)"}
  - {name: contact_for, from: PointOfContact, to: ProductBusinessDivision, cardinality: "N:1", locator: "§6.4; §6.5.3.4", kind: stated, tmodel_mapping: "Party contact"}
  - {name: routes_reports_via, from: PSIRT, to: CustomerSupportDivision, cardinality: "0..1", locator: "§6.5.3.3 (may)", kind: stated, tmodel_mapping: "none"}
  - {name: partners_with, from: CustomerSupportDivision, to: PSIRT, cardinality: "N:1", locator: "§6.5.3.3", kind: stated, tmodel_mapping: "none"}
  - {name: communicates_with, from: PSIRT, to: Reporter, cardinality: "1:N", locator: "§6.5.3.3 (inferred responsibility)", kind: inferred, tmodel_mapping: "none"}
  - {name: identifies_root_cause_for, from: VulnerabilityHandlingProcess, to: "secure development lifecycle (ISO/IEC 27034)", cardinality: "N:1", definition: "root-cause identification 'can help improve secure software development lifecycles'", locator: "§6.1 (informative pointer to 27034)", kind: stated, tmodel_mapping: "R-041 feedback edge: response phase → design/implementation phases"}
  - {name: in_phase, from: "potential vulnerability", to: HandlingPhase, cardinality: "N:1 (time-varying)", locator: "Figure 1; §7.1 headings", kind: stated, tmodel_mapping: "state attribute with valid_from/valid_to"}

gaps:
  - "Organisational sub-structure (PSIRT within vendor, divisions, per-product contacts) — ARCH-0001 §2b Party has no part_of/member_of edge between Parties."
  - "Policy-to-policy consistency (internal handling policy compatible with external disclosure policy) — a constraint between two governed views (R-043) that tmodel cannot yet express."
  - "Target remediation schedule (planned vs actual) belongs on MitigationInstance; ARCH-0001 §5 lists owner/work item/evidence/status but no dates."
  - "Root-cause feedback from response into the SDL (§6.1 → 27034) is an edge from the response phase back into design/implementation that R-041's ordered gates do not model (gates are a line, this is a loop)."
  - "Process-as-object: VulnerabilityHandlingProcess is assessed, documented and covers products — R-040 kind=process is an attribute, but here the process itself carries Reviews and coverage."
