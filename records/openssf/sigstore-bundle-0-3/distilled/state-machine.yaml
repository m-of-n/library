          - "2"
          - "3"
        meaning: "The key-material form: public_key, x509_certificate_chain, certificate."
      - name: "ver"
        domain:
          - "0.1"
          - "0.2"
          - "0.3"
        meaning: "The version M02 accepted."
    initial: "received"
    states:
      - name: "received"
        meaning: >-
          A bundle is in hand; nothing is checked.
        kind: "inferred"
        inferred_reason: >-
          An entry state; receipt is not described.
