        kind: "stated"
      - name: "evidence-checked"
        meaning: >-
          The timestamps and log entries the verifier relies on have passed the checks that apply.
        kind: "inferred"
        inferred_reason: >-
          Which checks bind depends on M03 Q1 and on duties the source leaves unstated (F06.9).
      - name: "time-checked"
        meaning: >-
          Forms (2) and (3): a trusted signing time lies inside the leaf's validity; form (1): not
