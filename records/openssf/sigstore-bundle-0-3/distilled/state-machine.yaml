applicability: >-
  APPLICABLE in part. The bundle is a data format and defines no stateful protocol: nothing is
  registered, issued, renewed or revoked by it, and its lifecycle vocabulary is nearly absent
  (census below). Four candidates were weighed. (a) A verifier's processing of one bundle is a
  lifecycle in FX-1's sense, with guards (version, form, content) and one stated error state: M01,
  its order this model's. (b) Version acceptance is a decision over three inputs: M02, with a
  conflict on v0.1. (c) The choice of signing-time evidence is three decisions over seven inputs:
  M03. (d) The certificate's validity against the signing time is a decision over five positions:
  M04; the certificate's own lifecycle, driven only by the clock, is M04's input rather than a
  machine. Every guard set was evaluated over all its inputs by script (guard_evaluation;
  reproduced from this file by distilled/state-machine-eval.derived.py).
