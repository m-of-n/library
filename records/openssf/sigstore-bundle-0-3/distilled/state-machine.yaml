        guard_expr: "content == 'dsse_envelope' and form == 1"
        kind: "inferred"
        inferred_reason: >-
          EP-16.
        constrained_by:
          - "sigstore-bundle-0-3#R-0086"
      - id: "M01.T19"
        from: "time-checked"
        to: "content-checked"
        trigger_kind: "event"
        trigger: "artifact-present"
        guard: >-
          content is message_signature
        guard_expr: "content == 'message_signature'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0180"
          - "sigstore-bundle-0-3#R-0038"
      - id: "M01.T20"
        from: "time-checked"
        to: "artifact-missing"
        trigger_kind: "event"
        trigger: "artifact-missing"
        guard: >-
          content is message_signature
        guard_expr: "content == 'message_signature'"
        kind: "inferred"
        inferred_reason: >-
          EP-18.
        constrained_by:
          - "sigstore-bundle-0-3#R-0038"
      - id: "M01.T21"
        from: "content-checked"
        to: "accepted"
        trigger_kind: "event"
        trigger: "signature-valid"
        kind: "inferred"
        inferred_reason: >-
          No acceptance is stated; the content's signature is the last check the source names.
        constrained_by:
          - "sigstore-bundle-0-3#R-0095"
          - "sigstore-bundle-0-3#R-0189"
          - "sigstore-bundle-0-3#R-0112"
      - id: "M01.T22"
        from: "content-checked"
        to: "signature-invalid"
        trigger_kind: "event"
        trigger: "signature-invalid"
        kind: "inferred"
        inferred_reason: >-
          EP-17.
        constrained_by:
          - "sigstore-bundle-0-3#R-0095"
    error_states:
      - "version-refused"
      - "media-type-unrecognized"
      - "malformed"
      - "key-unresolved"
      - "chain-untrusted"
      - "evidence-failed"
      - "no-valid-signing-time"
      - "envelope-rejected"
      - "payload-type-rejected"
      - "key-hint-mismatch"
      - "artifact-missing"
      - "signature-invalid"
  - id: "M02"
    name: "version-acceptance"
    title: "Which version a verifier takes a bundle to be, from its media type"
    locator: "§1, §1.2, §1.3"
    actor: "verifier"
    protocol_flow: "F06.2, F07.1, F07.2"
    verdict: >-
      Modelled as a decision with no lifecycle of its own: one decision state over three inputs. The
      guards come from the media-type and v0.1 sentences (L44-45, L125-130, L145-151); evaluating
      them over every input shows a conflict (SD-P-1) and inputs no stated rule covers.
    purpose: >-
      The candidate (b) of the brief: the four media types, v0.1's optional support and its
      ecosystem rule, and the two spellings of v0.3. The binary-encoding gap (SD-P-2) is a producer
      rule and changes no acceptance here, so the encoding is not an input.
    inputs:
      - name: "mt"
        domain:
          - "current03"
          - "legacy03"
          - "legacy02"
          - "legacy01"
          - "other"
        meaning: >-
          current03 is application/vnd.dev.sigstore.bundle.v0.3+json; legacy0N is
          application/vnd.dev.sigstore.bundle+json;version=0.N; other is anything else, a v0.1 or
          v0.2 value in the current spelling included.
      - name: "opt01"
        domain:
          - "true"
          - "false"
        meaning: "The verification library offers v0.1 support and it is in effect (L125-127)."
      - name: "eco01"
        domain:
          - "true"
          - "false"
        meaning: "The verifier's ecosystem has produced v0.1 bundles (L129-130)."
    initial: "media-type-read"
    states:
      - name: "media-type-read"
        meaning: >-
          media_type is read; the version is not yet fixed.
        kind: "inferred"
        inferred_reason: >-
          An entry state.
        decision: "yes"
      - name: "version-0.3"
        meaning: >-
          Taken as v0.3; F06 applies.
        kind: "stated"
        terminal: "yes"
      - name: "version-0.2"
        meaning: >-
          Taken as v0.2; F06 applies.
        kind: "stated"
        terminal: "yes"
      - name: "version-0.1"
        meaning: >-
          Taken as v0.1; F07 applies.
        kind: "stated"
        terminal: "yes"
      - name: "v0.1-refused"
        meaning: >-
          A v0.1 bundle the verifier does not allow.
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "media-type-unrecognized"
        meaning: >-
          No version: the source has no rule for this media type.
        kind: "inferred"
        inferred_reason: >-
          sigstore-bundle-0-3#R-0191; nothing says what a verifier does.
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M02.T01"
        from: "media-type-read"
        to: "version-0.3"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the legacy v0.3 media type
        guard_expr: "mt == 'legacy03'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0081"
          - "sigstore-bundle-0-3#R-0084"
      - id: "M02.T02"
        from: "media-type-read"
        to: "version-0.3"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the current v0.3 media type
        guard_expr: "mt == 'current03'"
        kind: "inferred"
        inferred_reason: >-
          The file names it as the version it specifies (L44-45) and producers must use it in JSON
          (L145-146); L147-148 lists only the previously defined formats as what clients must
          accept. That clients accept the current one is implied by previously, not stated.
        constrained_by:
          - "sigstore-bundle-0-3#R-0068"
          - "sigstore-bundle-0-3#R-0021"
          - "sigstore-bundle-0-3#R-0081"
      - id: "M02.T03"
        from: "media-type-read"
        to: "version-0.2"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the legacy v0.2 media type
        guard_expr: "mt == 'legacy02'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0081"
          - "sigstore-bundle-0-3#R-0083"
      - id: "M02.T04"
        from: "media-type-read"
        to: "version-0.1"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the legacy v0.1 media type
        guard_expr: "mt == 'legacy01'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0081"
          - "sigstore-bundle-0-3#R-0082"
        conflict: >-
          SD-P-1, with M02.T05 when opt01 is false and with M02.T06 when eco01 is false
      - id: "M02.T05"
        from: "media-type-read"
        to: "v0.1-refused"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the legacy v0.1 media type, and the library offers no v0.1 support
        guard_expr: "mt == 'legacy01' and not opt01"
        kind: "inferred"
        inferred_reason: >-
          v0.1 support is an option a library may provide (L125-127); without it the library does
          not support v0.1. The consequence is not stated.
        constrained_by:
          - "sigstore-bundle-0-3#R-0018"
        conflict: >-
          SD-P-1, with M02.T04
      - id: "M02.T06"
        from: "media-type-read"
        to: "v0.1-refused"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the legacy v0.1 media type, in an ecosystem that never produced v0.1
        guard_expr: "mt == 'legacy01' and not eco01"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0020"
        conflict: >-
          SD-P-1, with M02.T04
      - id: "M02.T07"
        from: "media-type-read"
        to: "media-type-unrecognized"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          any other media type
        guard_expr: "mt == 'other'"
        kind: "inferred"
        inferred_reason: >-
          No rule (sigstore-bundle-0-3#R-0191); the transition makes the machine total.
        constrained_by:
          - "sigstore-bundle-0-3#R-0191"
    error_states:
      - "v0.1-refused"
      - "media-type-unrecognized"
  - id: "M03"
    name: "signing-time-evidence"
    title: "Which evidence of signing time a verifier must check and may trust"
    locator: "§1.1, §1.2, §1.3, §4.4, §4.5, §5.1.1"
    actor: "verifier"
    protocol_flow: "F04.9, F06.7, F06.8, F06.11, F07.4"
    verdict: >-
      Modelled as three decisions in sequence, without a lifecycle of its own: Q1 what the promise
      obligation is, Q2 whether the integrated time may be trusted, Q3 which time the signing time
      is taken from. Stated guards follow the source's sentences as written; the one reading they
      need is what another suitable source of time is (the two examples of L833-835, below). The
      inferred transitions make each decision total and are marked.
    purpose: >-
      The candidate (c) of the brief, for one log entry and the bundle's timestamps. Another
      suitable source of time is read as a verified RFC 3161 timestamp, or the current time inside
      the leaf's validity for a long-lived certificate: the examples of L833-835, since the source
      gives no definition (SD-P-7). Another entry's verified promise would also be signed time; one
      entry is modelled. long or short is an input because the source gives no threshold.
    inputs:
      - name: "cert"
        domain:
          - "true"
          - "false"
        meaning: "The signer is identified by a certificate (forms 2 and 3)."
      - name: "ver"
        domain:
          - "0.1"
          - "0.2"
          - "0.3"
        meaning: "The bundle's version (M02)."
      - name: "tsa"
        domain:
          - "none"
          - "verified"
          - "failed"
        meaning: >-
          An RFC 3161 timestamp: none, one that verified (imprint and its own signature), or one
          that failed.
      - name: "entry"
        domain:
          - "true"
          - "false"
        meaning: "A log entry is present."
      - name: "prom"
        domain:
          - "absent"
          - "verified"
          - "unverified"
          - "failed"
        meaning: >-
          The entry's inclusion promise: absent, present and verified, present and not checked,
          present and failing.
      - name: "life"
        domain:
          - "short"
          - "long"
        meaning: "The leaf is short-lived or long-lived; the source defines neither."
      - name: "now_valid"
        domain:
          - "true"
          - "false"
        meaning: "The current time lies inside the leaf's validity."
    input_constraints:
      - "entry or prom == 'absent'"
    initial: "evidence-in-hand"
    states:
      - name: "evidence-in-hand"
        meaning: >-
          The bundle's timestamps and log entry are read; Q1.
        kind: "inferred"
        inferred_reason: >-
          An entry state.
        decision: "yes"
      - name: "promise-must-verify"
        meaning: >-
          The promise must be verified.
        kind: "stated"
      - name: "promise-should-verify"
        meaning: >-
          The promise should be verified.
        kind: "stated"
      - name: "promise-may-be-absent"
        meaning: >-
          No promise, and none is needed: v0.2 or later with another suitable time source.
        kind: "stated"
      - name: "promise-missing-v01"
        meaning: >-
          A v0.1 entry without its required promise.
        kind: "stated"
        error: "yes"
        terminal: "yes"
      - name: "promise-missing-needed"
        meaning: >-
          No promise, v0.2 or later, and no other suitable time source.
        kind: "inferred"
        inferred_reason: >-
          L833-835 makes the promise optional only if another source is present; what follows when
          none is, is not said.
        error: "yes"
        terminal: "yes"
      - name: "no-entry"
        meaning: >-
          No log entry; Q1 does not apply.
        kind: "inferred"
        inferred_reason: >-
          Follows from entry absent.
      - name: "promise-assessed"
        meaning: >-
          Q1 done; Q2.
        kind: "inferred"
        inferred_reason: >-
          A merge state.
        decision: "yes"
      - name: "integrated-time-trusted"
        meaning: >-
          The integrated time is trusted: its promise verified.
        kind: "stated"
      - name: "integrated-time-untrusted"
        meaning: >-
          The integrated time must not be trusted.
        kind: "stated"
      - name: "integrated-time-undetermined"
        meaning: >-
          A present, unverified promise: the source does not say whether the integrated time may be
          used.
        kind: "inferred"
        inferred_reason: >-
          SD-P-8: neither the trust rule nor the distrust rule applies.
      - name: "no-integrated-time"
        meaning: >-
          No log entry, so no integrated time.
        kind: "inferred"
        inferred_reason: >-
          Follows from entry absent.
      - name: "log-time-assessed"
        meaning: >-
          Q2 done; Q3.
        kind: "inferred"
        inferred_reason: >-
          A merge state.
        decision: "yes"
      - name: "time-from-timestamp"
        meaning: >-
          Signing time from a verified RFC 3161 timestamp's genTime.
        kind: "stated"
        terminal: "yes"
      - name: "time-from-log"
        meaning: >-
          Signing time from the integrated time of an entry whose promise verified.
        kind: "stated"
        terminal: "yes"
      - name: "time-from-clock"
        meaning: >-
          The current time, for a long-lived certificate still valid.
        kind: "stated"
        terminal: "yes"
      - name: "no-trusted-time"
        meaning: >-
          A certificate-signed bundle with no trusted signing time.
        kind: "inferred"
        inferred_reason: >-
          sigstore-bundle-0-3#R-0193: such a bundle cannot meet sigstore-bundle-0-3#R-0085; no
          outcome is stated.
        error: "yes"
        terminal: "yes"
      - name: "time-not-checked"
        meaning: >-
          Form (1): the time rule does not apply.
        kind: "inferred"
        inferred_reason: >-
          sigstore-bundle-0-3#R-0085 is stated for a signer identified by a certificate.
        terminal: "yes"
    transitions:
      - id: "M03.T01"
        from: "evidence-in-hand"
        to: "promise-must-verify"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          a promise, in a v0.1 bundle
        guard_expr: "entry and prom != 'absent' and ver == '0.1'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0154"
          - "sigstore-bundle-0-3#R-0155"
          - "sigstore-bundle-0-3#R-0019"
        conflict: >-
          overlaps M03.T03 for v0.1 with another suitable time source: must and should, the stronger
          subsuming the weaker
      - id: "M03.T02"
        from: "evidence-in-hand"
        to: "promise-must-verify"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          a promise, and no other suitable source of time
        guard_expr: >-
          entry and prom != 'absent' and not (tsa == 'verified' or (cert and life == 'long' and
          now_valid))
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0157"
        note: >-
          Written without a version condition (L836), so it also covers v0.1.
      - id: "M03.T03"
        from: "evidence-in-hand"
        to: "promise-should-verify"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          a promise, and another suitable source of time
        guard_expr: >-
          entry and prom != 'absent' and (tsa == 'verified' or (cert and life == 'long' and
          now_valid))
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0158"
        note: >-
          Otherwise (L837) carries no version condition either.
        conflict: >-
          overlaps M03.T01 for v0.1
      - id: "M03.T04"
        from: "evidence-in-hand"
        to: "promise-missing-v01"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          no promise, in a v0.1 bundle
        guard_expr: "entry and prom == 'absent' and ver == '0.1'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0154"
      - id: "M03.T05"
        from: "evidence-in-hand"
        to: "promise-may-be-absent"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          no promise, v0.2 or later, and another suitable source of time
        guard_expr: >-
          entry and prom == 'absent' and ver != '0.1' and (tsa == 'verified' or (cert and life ==
          'long' and now_valid))
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0156"
      - id: "M03.T06"
        from: "evidence-in-hand"
        to: "promise-missing-needed"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          no promise, v0.2 or later, and no other suitable source of time
        guard_expr: >-
          entry and prom == 'absent' and ver != '0.1' and not (tsa == 'verified' or (cert and life
          == 'long' and now_valid))
        kind: "inferred"
        inferred_reason: >-
          The condition of L833-835 fails; the consequence is not stated.
        constrained_by:
          - "sigstore-bundle-0-3#R-0156"
          - "sigstore-bundle-0-3#R-0168"
      - id: "M03.T07"
        from: "evidence-in-hand"
        to: "no-entry"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          no log entry
        guard_expr: "not entry"
        kind: "inferred"
        inferred_reason: >-
          Nothing to decide.
        constrained_by:
          - "sigstore-bundle-0-3#R-0173"
      - id: "M03.T08"
        from: "promise-must-verify"
        to: "promise-assessed"
        trigger_kind: "event"
        trigger: "advance"
        kind: "inferred"
        inferred_reason: >-
          Sequencing.
      - id: "M03.T09"
        from: "promise-should-verify"
        to: "promise-assessed"
        trigger_kind: "event"
        trigger: "advance"
        kind: "inferred"
        inferred_reason: >-
          Sequencing.
      - id: "M03.T10"
        from: "promise-may-be-absent"
        to: "promise-assessed"
        trigger_kind: "event"
        trigger: "advance"
        kind: "inferred"
        inferred_reason: >-
          Sequencing.
      - id: "M03.T11"
        from: "no-entry"
        to: "promise-assessed"
        trigger_kind: "event"
        trigger: "advance"
        kind: "inferred"
        inferred_reason: >-
          Sequencing.
      - id: "M03.T12"
        from: "promise-assessed"
        to: "integrated-time-trusted"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the promise verified
        guard_expr: "entry and prom == 'verified'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0150"
          - "sigstore-bundle-0-3#R-0080"
          - "sigstore-bundle-0-3#R-0174"
      - id: "M03.T13"
        from: "promise-assessed"
        to: "integrated-time-untrusted"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the promise is omitted
        guard_expr: "entry and prom == 'absent'"
        kind: "stated"
        quotes:
          - source_lines: "826-827"
            quote: |-
              The integration time MUST NOT be trusted if inclusion_promise is omitted.
        constrained_by:
          - "sigstore-bundle-0-3#R-0062"
      - id: "M03.T14"
        from: "promise-assessed"
        to: "integrated-time-untrusted"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the promise failed
        guard_expr: "entry and prom == 'failed'"
        kind: "inferred"
        inferred_reason: >-
          A failing promise verifies nothing (L789-790 says what verifying it establishes); not
          stated.
        constrained_by:
          - "sigstore-bundle-0-3#R-0150"
      - id: "M03.T15"
        from: "promise-assessed"
        to: "integrated-time-undetermined"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          the promise is present and was not checked
        guard_expr: "entry and prom == 'unverified'"
        kind: "inferred"
        inferred_reason: >-
          SD-P-8: L826-827 distrusts only an omitted promise; the transition makes the machine
          total.
        constrained_by:
          - "sigstore-bundle-0-3#R-0062"
          - "sigstore-bundle-0-3#R-0158"
      - id: "M03.T16"
        from: "promise-assessed"
        to: "no-integrated-time"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          no log entry
        guard_expr: "not entry"
        kind: "inferred"
        inferred_reason: >-
          Nothing to decide.
      - id: "M03.T17"
        from: "integrated-time-trusted"
        to: "log-time-assessed"
        trigger_kind: "event"
        trigger: "advance"
        kind: "inferred"
        inferred_reason: >-
          Sequencing.
      - id: "M03.T18"
        from: "integrated-time-untrusted"
        to: "log-time-assessed"
        trigger_kind: "event"
        trigger: "advance"
        kind: "inferred"
        inferred_reason: >-
          Sequencing.
      - id: "M03.T19"
        from: "integrated-time-undetermined"
        to: "log-time-assessed"
        trigger_kind: "event"
        trigger: "advance"
        kind: "inferred"
        inferred_reason: >-
          Sequencing; Q3 then takes no time from this entry (M03.T21 needs a verified promise).
      - id: "M03.T20"
        from: "no-integrated-time"
        to: "log-time-assessed"
        trigger_kind: "event"
        trigger: "advance"
        kind: "inferred"
        inferred_reason: >-
          Sequencing.
      - id: "M03.T21"
        from: "log-time-assessed"
        to: "time-from-log"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          certificate, and a verified promise
        guard_expr: "cert and entry and prom == 'verified'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0080"
          - "sigstore-bundle-0-3#R-0174"
          - "sigstore-bundle-0-3#R-0150"
        conflict: >-
          several fire when other sources exist too: the source ranks none (SD-P-7)
      - id: "M03.T22"
        from: "log-time-assessed"
        to: "time-from-timestamp"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          certificate, and a verified timestamp
        guard_expr: "cert and tsa == 'verified'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0071"
          - "sigstore-bundle-0-3#R-0175"
          - "sigstore-bundle-0-3#R-0156"
        conflict: >-
          several fire when other sources exist too (SD-P-7)
      - id: "M03.T23"
        from: "log-time-assessed"
        to: "time-from-clock"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          certificate, long-lived, and still valid now
        guard_expr: "cert and life == 'long' and now_valid"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0156"
        conflict: >-
          several fire when other sources exist too (SD-P-7)
      - id: "M03.T24"
        from: "log-time-assessed"
