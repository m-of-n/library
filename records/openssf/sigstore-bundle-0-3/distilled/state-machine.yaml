conventions:
  states: >-
    States have name, meaning and kind; error states carry error yes and are listed in error_states,
    terminal states terminal yes, decision states decision yes. kind stated: the source states the
    state, transition or rule; inferred: this model's, with inferred_reason.
  triggers: >-
    Every trigger is an event under events (trigger_kind event). M01's events are the outcomes of
    F06's checks, some summarizing M02 to M04; M02 to M04 move by evaluate (a decision over the
    inputs) and advance. No trigger is a message: the source defines no message whose arrival drives
    a transition.
  guard_expr: >-
    guard is this file's wording; guard_expr is the same guard as a Python boolean expression over
    the machine's inputs (names, single-quoted strings, integers, true and false, and, or, not, ==,
    !=, in, not in, tuples). input_constraints drop impossible combinations. guard_evaluation was
    computed (and is re-checked by distilled/state-machine-eval.derived.py, stdlib only, exit 1 on
    any difference) by evaluating each guard_expr, read back from this file, over every combination of the
    input domains: for each decision state, how many combinations reach exactly one target, several,
    or none, counting the stated transitions alone and then all of them; for M01's event-driven
    states, the most transitions one event enables and the combinations left without an exit.
  quoting: >-
    A quotation is a quotes item {source_lines, quote} cut from .cache/sigstore-bundle-0-3.txt by
    script and checked by bin/check-quotes.
  constrained_by: >-
    sigstore-bundle-0-3#R-NNNN ids, emitted by script from requirements.yaml by source_lines and a
    phrase of the text (refusing zero or several matches); every resolved pair was read. Ids in
    prose are emitted the same way.
  conflict: >-
    Names a transition whose guard overlaps another's on some input, and the source defect behind
    it.
events:
  - name: "version-accepted"
    meaning: "M02 ended in version-0.1 (with F07 supporting it), version-0.2 or version-0.3."
  - name: "version-refused"
    meaning: "M02 ended in v0.1-refused."
  - name: "version-unrecognized"
    meaning: "M02 ended in media-type-unrecognized."
  - name: "structure-ok"
    meaning: >-
      Key material and content each hold exactly one member and the fields the verifier needs are
      present.
  - name: "structure-bad"
    meaning: "Key material or content is missing or ambiguous, or a needed field is absent."
  - name: "key-resolved"
    meaning: "Form (1): the hint selected an out-of-band key."
  - name: "key-unresolved"
    meaning: "Form (1): no held key matches the hint."
  - name: "chain-valid"
    meaning: "Forms (2) and (3): the leaf chains to an independently trusted CA certificate."
  - name: "chain-invalid"
    meaning: "Forms (2) and (3): it does not."
  - name: "evidence-ok"
    meaning: >-
      Every timestamp and log entry the verifier relies on passed the checks of F06 steps 7-10 that
      apply (M03 Q1 decides which promises must pass).
  - name: "evidence-bad"
    meaning: "A check of F06 steps 7-10 that the verifier treats as binding failed."
  - name: "time-ok"
    meaning: "M03 found a trusted signing time and M04 placed it in signed-while-valid."
  - name: "time-bad"
    meaning: >-
      M03 ended in no-trusted-time, or M04 in signed-before-validity or signed-after-expiry.
  - name: "advance"
    meaning: "The machine moves on; no input is consumed."
  - name: "evaluate"
    meaning: >-
      The decision state's guards are evaluated over the machine's inputs; no input is consumed.
  - name: "envelope-ok"
    meaning: >-
      DSSE: payloadType supported and expected, exactly one signature, and the hint equal to keyid
      where form (1) is used.
  - name: "signature-count-not-one"
    meaning: "DSSE: the envelope holds zero signatures or more than one."
  - name: "payload-type-bad"
    meaning: "DSSE: payloadType is not a supported and expected type."
  - name: "key-hint-mismatch"
    meaning: "DSSE with form (1): the hint and keyid differ."
  - name: "artifact-present"
    meaning: "Message signature: the artifact (or its digest computed from it) is at hand."
  - name: "artifact-missing"
    meaning: "Message signature: it is not."
  - name: "signature-valid"
    meaning: >-
      The content's signature verifies with the resolved key (over PAE, or over the artifact).
  - name: "signature-invalid"
    meaning: "It does not."
