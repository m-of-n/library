        meaning: >-
          M02 accepted the media type (v0.1 only where F07 supports it).
        kind: "stated"
      - name: "structure-checked"
        meaning: >-
          Exactly one key-material form and one content member; needed fields present.
        kind: "inferred"
        inferred_reason: >-
