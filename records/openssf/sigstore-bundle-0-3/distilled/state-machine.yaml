        kind: "stated"
        note: >-
          Stated for certificates (L155-158); passing through it with form (1) is inferred
          (M01.T14).
      - name: "content-checked"
        meaning: >-
          DSSE: payload type, one signature, hint and keyid; message signature: the artifact is at
          hand.
        kind: "stated"
      - name: "accepted"
        meaning: >-
          The content's signature verified. The source has no word for acceptance; this is the end
          of what it checks.
        kind: "inferred"
        inferred_reason: >-
          No acceptance vocabulary or verdict is stated; identity policy (F06.17) is outside the
