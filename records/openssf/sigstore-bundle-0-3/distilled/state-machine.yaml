  - id: "M04"
    name: "signing-time-vs-validity"
    title: "Where the signing time falls in the leaf certificate's validity"
    locator: "§1.3, §3.7, §3.16, §5.1.1, §5.1.3.2"
    actor: "verifier"
    protocol_flow: "F06.11"
    verdict: >-
      Modelled as a decision. The certificate has a lifecycle the source states: valid at signing
      (L155-158) and possibly expired at verification (L898), the reason the bundle carries time
      evidence. That lifecycle has no trigger but the clock and no transition the source describes,
      so it is not a machine of its own; it is the input pos, the place of the trusted signing time
      against notBefore and notAfter.
    purpose: >-
      The candidate (d) of the brief. The input has five values because the source does not say
      whether the window includes its ends, and its own DSSE example signs exactly at notBefore
      (E7).
    lifecycle: >-
      not-yet-valid before notBefore, valid inside the window, expired after notAfter; in both
      examples the window is 600 seconds (E7). M03's now_valid is the verification time's place in
      the same lifecycle, which is why a short-lived leaf needs signed time once it has expired.
    inputs:
      - name: "pos"
        domain:
          - "before"
          - "at-notBefore"
          - "inside"
          - "at-notAfter"
          - "after"
        meaning: "Where the trusted signing time from M03 falls against the leaf's notBefore and notAfter."
    initial: "signing-time-placed"
    states:
      - name: "signing-time-placed"
        meaning: >-
          M03 produced a trusted signing time; it is compared with the window.
        kind: "inferred"
        inferred_reason: >-
          An entry state.
        decision: "yes"
      - name: "signed-while-valid"
        meaning: >-
          The signature was computed while the leaf was valid.
        kind: "stated"
        terminal: "yes"
      - name: "signed-before-validity"
        meaning: >-
          Signed before notBefore.
        kind: "stated"
        error: "yes"
        terminal: "yes"
        note: >-
          The classification is stated; the outcome (rejection) is not.
      - name: "signed-after-expiry"
        meaning: >-
          Signed after notAfter.
        kind: "stated"
        error: "yes"
        terminal: "yes"
        note: >-
          The classification is stated; the outcome (rejection) is not.
    transitions:
      - id: "M04.T01"
        from: "signing-time-placed"
        to: "signed-while-valid"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          strictly inside the window
        guard_expr: "pos == 'inside'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0085"
      - id: "M04.T02"
        from: "signing-time-placed"
        to: "signed-before-validity"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          before notBefore
        guard_expr: "pos == 'before'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0085"
      - id: "M04.T03"
        from: "signing-time-placed"
        to: "signed-after-expiry"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          after notAfter
        guard_expr: "pos == 'after'"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0085"
          - "sigstore-bundle-0-3#R-0168"
      - id: "M04.T04"
        from: "signing-time-placed"
        to: "signed-while-valid"
        trigger_kind: "event"
        trigger: "evaluate"
        guard: >-
          exactly at notBefore or at notAfter
        guard_expr: "pos in ('at-notBefore', 'at-notAfter')"
        kind: "inferred"
        inferred_reason: >-
          The source does not settle the ends (SD-P-5). The model takes RFC 5280's inclusive period
          (library record rfc-5280, outside this source), the only reading under which the source's
          DSSE example passes.
        quotes:
          - source_lines: "661-662"
            quote: |-
              The time range is closed and includes both the start and end times, (i.e., [start, end]).
        constrained_by:
          - "sigstore-bundle-0-3#R-0085"
    error_states:
      - "signed-before-validity"
      - "signed-after-expiry"
