      (version, form, content) and one stated error state (envelope-rejected, L182-183). The order
      is this model's: the source orders none of its checks (OF-01). States are checks passed so
      far, not states the source names; each stated check is a transition, and every error state
      except envelope-rejected and version-refused is this model's reading of a must with no stated
      outcome.
    purpose: >-
      The document-level sequence of F06, with M02 to M04 as the decisions some events summarize.
      Inputs are what selects the rules: content, form and version.
    inputs:
