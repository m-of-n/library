      ecosystem that never produced them. protocol.yaml SD-P-1.
  - id: "SD-P-5"
    unified: "SD-27"
    where: "M04.T04"
    text: >-
      No stated transition decides a signing time exactly at notBefore or notAfter; the source's
      DSSE example is at notBefore. protocol.yaml SD-P-5.
  - id: "SD-P-7"
    unified: "SD-28"
    where: "M03.T02, M03.T03, M03.T05, M03.T06, M03.T21 to M03.T23"
    text: >-
      Another suitable source of time is undefined; this file uses the two examples of L833-835.
      Several time sources fire together and none is ranked. protocol.yaml SD-P-7.
  - id: "SD-P-8"
    unified: "SD-29"
    where: "M03.T15"
    text: >-
      A present, unverified promise: neither the trust nor the distrust rule fires. protocol.yaml
      SD-P-8.
not_modelled:
  - id: "SC-1"
    what: "Key rotation, revocation and renewal"
    why_not: >-
      No vocabulary: rotate, rotation, revoke, revoked, revocation, renew, update, supersede,
      replace and rollover occur 0 times. A key or certificate appears only as material at one
      moment.
  - id: "SC-2"
    what: "The log's growth and its checkpoints over time"
    why_not: >-
      A proof and its checkpoint describe the tree as it stood when the proof was made (L755-756,
      L760, L772-773): one snapshot. No consistency proof, no history of tree heads and no
      comparison between checkpoints is described; RFC 9162 has them, outside this source.
    quotes:
      - source_lines: "755-756"
        quote: |-
          The hash digest stored at the root of the merkle tree at the time the proof was generated.
  - id: "SC-3"
    what: "The format's versions over time (0.1, 0.2, 0.3)"
    why_not: >-
      Versions of the schema, not states of a bundle: previously (L147), backwards compatibility
      (L126), Future iterations (L803), Reserved for future additions (L189, L446). What a verifier
      does with each version is M02.
  - id: "SC-4"
    what: "Algorithm deprecation"
    why_not: >-
      deprecated occurs 13 times (L326 to L422), each a flag on an enum value, with no date, no
      removal rule and no transition. The ML-DSA warning will be removed in future (L434-435): a
      change to the document, not to a key or a bundle.
  - id: "SC-5"
    what: "A bundle itself"
    why_not: >-
      Assembled once (F05) and verified (F06); nothing changes a bundle afterwards. updated occurs
      once, the docs page's own date (L880).
  - id: "SC-6"
    what: "The DSSE signature extension"
    why_not: >-
      One rule (sigstore-bundle-0-3#R-0004) on one structure, with no states; F08.
  - id: "SC-7"
    what: "The certificate's validity as a machine of its own"
    why_not: >-
      Its only trigger is the clock and the source describes no transition; it enters as M04's input
      pos and M03's now_valid (M04 lifecycle).
coverage: >-
  4 machines, 48 states (26 kind inferred, 19 error, 28 terminal), 58 transitions (32 kind
  inferred), 23 events, counted by script with bin/_yaml.py. By script: every transition's from and
  to is a state of its machine, every state is reachable from its machine's initial state, every
  non-terminal state has an exit and no terminal state has one, error_states equals the states
  marked error, and every trigger is a defined event. Guards evaluated over all inputs
  (guard_evaluation): M01 18 combinations, M02 20, M03 360, M04 5. constrained_by: 88 links to 45
  distinct ids, emitted by script and read. 4 quotations, checked by bin/check-quotes.
