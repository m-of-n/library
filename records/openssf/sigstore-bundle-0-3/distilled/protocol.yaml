conventions:
  quoting: >-
    Every quotation is a quotes item {source_lines, quote}, cut from .cache/sigstore-bundle-0-3.txt
    by script through bin/_source_text (whitespace collapsed; this rendering has no page breaks,
    aside bars or line-end hyphens), never typed, and each range the tightest that holds it;
    bin/check-quotes verifies every one. Text in action, guard, note and on_error is this file's
    wording; where it repeats source words, the step's quotes or constrained_by carry them.
  step_kind: >-
    kind stated: the source says the step happens or binds it; inferred: this model's step, with
    inferred_reason. An order the source does not fix is called out in the flow's order_note.
  on_error_basis: >-
    stated: the source says what follows. inferred: this file's reading, and on_error says so.
    unspecified: the source names the step and says nothing of its failure. none: the step has no
    failure of its own.
  constrained_by: >-
    sigstore-bundle-0-3#R-NNNN ids whose text the step obeys or that bind what it emits, each
    emitted by script from requirements.yaml by its source_lines and a phrase of its text (inferred
    entries by phrase), refusing zero or several matches; every resolved pair was read.
    Identical-text groups (sigstore-bundle-0-3#R-0028, sigstore-bundle-0-3#R-0029 and
    sigstore-bundle-0-3#R-0031; sigstore-bundle-0-3#R-0053 and sigstore-bundle-0-3#R-0059;
    sigstore-bundle-0-3#R-0078 and sigstore-bundle-0-3#R-0087; sigstore-bundle-0-3#R-0093 and
    sigstore-bundle-0-3#R-0097) were told apart by source_lines. Ids in prose are emitted the same
    way.
