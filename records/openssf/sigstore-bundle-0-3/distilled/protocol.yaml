  - id: "F06"
    name: "verify-bundle"
    title: "Verifying a bundle (v0.2 and v0.3; the v0.1 differences are F07)"
    locator: >-
      §1.1, §1.2, §1.3, §2.1, §2.2, §3.4, §3.8, §4.2, §4.3, §4.4, §4.5, §5.1.1, §5.1.2.1, §5.1.2.2
    kind_of_flow: "local procedure over a received bundle"
    participants:
      - "signer"
      - "verifier"
      - "trust-material"
    summary: >-
      The verifier reads the version, checks the structure, resolves the key (out of band for form
      (1), the leaf's for forms (2) and (3), validated to an independently trusted CA), checks the
      timestamps and log entries, establishes a trusted signing time inside the leaf's validity, and
      then checks the content: for a DSSE envelope the payload type, the single signature and the
      key hint, then the signature over PAE; for a message signature, the signature over the
      artifact, which the verifier digests itself. The source states one rejection only (F06.13);
      every other failure outcome is the model's reading or unspecified. Identity policy is outside
      the source.
    order_note: >-
      The source fixes no order among these checks (OF-01). Counted over all 1189 lines as whole
      words, case-insensitively: before 0, then 0, step and steps 0; after once (L898, a certificate
      that has expired); first 3 times (L87 the chain's first member, L311 an enum's first value,
      L731 a checkpoint's first signature); order 4 times (L89, L652, L653, L765: certificate and
      hash order). The model orders by data dependency: the version selects rules (2), the structure
      and the key material select the key (3-6), the timestamps and log entries yield the trusted
      times (7-10), the time check needs them (11), and the content checks come last (12-17). Steps
      7-10 may run in any order among themselves, as may 12-14; any order that respects the
      dependencies is consistent with the source. Whether the signature is verified before the
      payload is parsed is not addressed anywhere in this source.
    steps:
      - n: "1"
        from: "signer"
        to: "verifier"
        message: "Bundle"
        action: >-
          Receive the bundle and, when its content is a message signature, the artifact itself (or
          its digest computed from it at verification time); the bundle's own message_digest is not
          a substitute.
        locator: "§3.4, §5.1.2.1"
        kind: "inferred"
        inferred_reason: >-
          Receipt is never described; that the artifact is provided at verification time is stated
          (L995-996).
        constrained_by:
          - "sigstore-bundle-0-3#R-0180"
          - "sigstore-bundle-0-3#R-0038"
        on_error: >-
          stated in part: without the artifact the message signature cannot be checked, since the
          bundle's digest must not be used to verify (L475-476); the outcome is unspecified (EP-18)
        on_error_basis: "stated"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "Bundle"
        field: "media_type"
        action: >-
          Parse the bundle (JSON per the proto3 mapping as the examples print it) and read
          media_type to fix the version before applying any version-dependent rule. Accept the
          current v0.3 form and the three legacy forms (version=0.1, 0.2, 0.3); the two v0.3
          spellings are one version. v0.1 continues in F07 (state machine M02).
        locator: "§1, §1.3"
        kind: "stated"
        note: >-
          Acceptance of the current spelling is implied, not stated: L147-148 lists the previously
          defined formats (M02.T02 is inferred).
        constrained_by:
          - "sigstore-bundle-0-3#R-0081"
          - "sigstore-bundle-0-3#R-0082"
          - "sigstore-bundle-0-3#R-0083"
          - "sigstore-bundle-0-3#R-0084"
          - "sigstore-bundle-0-3#R-0021"
          - "sigstore-bundle-0-3#R-0068"
          - "sigstore-bundle-0-3#R-0001"
          - "sigstore-bundle-0-3#R-0191"
          - "sigstore-bundle-0-3#R-0186"
          - "sigstore-bundle-0-3#R-0187"
          - "sigstore-bundle-0-3#R-0188"
          - "sigstore-bundle-0-3#R-0185"
        on_error: >-
          unspecified by source: a media type other than the four has no rule (EP-01, M02); a legacy
          v0.1 bundle meets two rules with opposite outcomes (SD-P-1)
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "Bundle"
        field: "verification_material, content"
        action: >-
          Check the structure: verification_material present; exactly one key-material form; exactly
          one content member; each REQUIRED field present where presence is observable (a message
          field), or non-empty where it is a bytes or string field.
        locator: "§1.2, §1.3"
        kind: "inferred"
        inferred_reason: >-
          The REQUIRED annotations bind the producer and protobuf does not enforce them
          (sigstore-bundle-0-3#R-0184's reading); no verifier duty to check structure is stated. A
          verifier without key material or content has nothing to verify, so the check is implied.
        constrained_by:
          - "sigstore-bundle-0-3#R-0023"
          - "sigstore-bundle-0-3#R-0078"
          - "sigstore-bundle-0-3#R-0087"
          - "sigstore-bundle-0-3#R-0183"
          - "sigstore-bundle-0-3#R-0184"
          - "sigstore-bundle-0-3#R-0015"
          - "sigstore-bundle-0-3#R-0016"
          - "sigstore-bundle-0-3#R-0017"
          - "sigstore-bundle-0-3#R-0024"
          - "sigstore-bundle-0-3#R-0027"
        on_error: "unspecified by source (EP-03)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "VerificationMaterial"
        field: "content"
        action: >-
          Check the key-material form against version and instance: keyless on the PGI never form
          (1), in v0.1 and v0.2 form (2), in v0.3 form (3).
        guard: "the bundle comes from keyless signing on the PGI"
        locator: "§1.2"
        kind: "inferred"
        inferred_reason: >-
