        on_error_basis: "unspecified"
  - id: "F02"
    name: "produce-message-signature-bundle"
    title: "Producing a bundle whose content is a message signature"
    locator: "§1.3, §3.1, §3.3, §3.4, §5.1.2, §5.1.2.1, §5.1.3.1"
    kind_of_flow: "local procedure, then the F04 and F05 sub-flows"
    participants:
      - "signer"
    summary: >-
      The signer may digest the artifact (for identification only), signs the artifact with its key,
      has the signature logged and timestamped (F04) and assembles the bundle with message_signature
      as its content (F05). The artifact never enters the bundle. In the docs page's example the
      signature is ECDSA P-256 with SHA-256 over the artifact itself: it verifies with the printed
      digest as the prehash, and does not verify as a signature over the 32 digest bytes (E1).
    order_note: >-
      Steps 1 and 2 both read the artifact and may run in either order; step 3 needs step 2's
      signature, F04 takes the signature as input, and F05 needs everything.
    steps:
      - n: "1"
        from: "signer"
        to: "signer"
        message: "HashOutput"
        field: "algorithm, digest"
        action: >-
          Optionally digest the artifact with a supported algorithm (SHA2_256, SHA2_384, SHA2_512;
          UNSPECIFIED should not be used; the two SHA3 values are deprecated), as raw digest octets.
          It serves identification only.
        locator: "§3.1, §3.3, §3.4, §5.1.2.1"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0099"
          - "sigstore-bundle-0-3#R-0033"
          - "sigstore-bundle-0-3#R-0108"
          - "sigstore-bundle-0-3#R-0197"
          - "sigstore-bundle-0-3#R-0110"
          - "sigstore-bundle-0-3#R-0179"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "signer"
        to: "signer"
        message: "MessageSignature"
        field: "signature"
        action: >-
          Sign the artifact with the signing key. The signature algorithm, and so the format of the
          signature bytes, is fixed by the key material: the certificate names it, or for a key pair
          it is part of the out-of-band public key. The result is the raw signature bytes.
        locator: "§3.4, §5.1.2, §5.1.2.1"
        kind: "stated"
        note: >-
          What is signed: the source says a message (L470), typically an artifact hash (L994), and
          Message Signature over an artifact hash (L990). The example's signature is over the
          artifact, with the digest only as the ECDSA prehash (E1): a signer that signs the digest
          bytes as a message produces a signature that does not verify the way the example's does.
          Whether the algorithm hashes the data first is the algorithm's: the ML-DSA values are the
          pure variants, which take the data rather than a digest (sigstore-bundle-0-3#R-0103). The
          requirements lane records the wording as SD-R-15.
        evidence:
          - "E1"
        constrained_by:
          - "sigstore-bundle-0-3#R-0109"
          - "sigstore-bundle-0-3#R-0111"
          - "sigstore-bundle-0-3#R-0112"
          - "sigstore-bundle-0-3#R-0113"
          - "sigstore-bundle-0-3#R-0114"
          - "sigstore-bundle-0-3#R-0115"
          - "sigstore-bundle-0-3#R-0177"
          - "sigstore-bundle-0-3#R-0176"
          - "sigstore-bundle-0-3#R-0103"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "signer"
        to: "signer"
        message: "MessageSignature"
        field: "signature, message_digest"
        action: >-
          Set the message signature: signature (required) and, optionally, message_digest from step
          1.
        locator: "§3.4, §5.1.2.1"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0040"
          - "sigstore-bundle-0-3#R-0179"
          - "sigstore-bundle-0-3#R-0110"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "signer"
        to: "signer"
        message: "MessageSignature"
        field: "signature"
        subflow: "F04"
        action: "Obtain a log entry and timestamps for the signature bytes (sub-flow F04)."
        locator: "§1.1, §4.5"
        kind: "stated"
        note: >-
          The timestamps are over the signature (L50) and the log entry references it (L860-862).
        constrained_by:
          - "sigstore-bundle-0-3#R-0070"
          - "sigstore-bundle-0-3#R-0067"
        on_error: "see F04"
        on_error_basis: "unspecified"
      - n: "5"
        from: "signer"
        to: "signer"
        message: "Bundle"
        field: "message_signature"
        subflow: "F05"
        action: "Assemble the bundle with message_signature as its content (sub-flow F05)."
        locator: "§1.3"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0024"
          - "sigstore-bundle-0-3#R-0176"
        on_error: "see F05"
        on_error_basis: "unspecified"
  - id: "F03"
    name: "produce-dsse-bundle"
    title: "Producing a bundle whose content is a DSSE envelope with one signature"
    locator: "§1.3, §2.1, §2.2, §5.1.2.2, §5.1.3.2"
    kind_of_flow: "local procedure, then the F04 and F05 sub-flows"
    participants:
      - "signer"
    summary: >-
      The signer serializes the payload (for the Public Instance an in-toto Statement with
      payloadType application/vnd.in-toto+json), signs PAE(payloadType, payload) once, builds an
      Envelope with exactly that one signature (keyid optional, and equal to the hint when the key
      material is a public key identifier), has the signature logged and timestamped (F04) and
      assembles the bundle with dsse_envelope as its content (F05). In the docs page's example the
      signature verifies over PAE of the decoded payload bytes, not over the base64 text and not
      over the bare payload (E2).
    order_note: >-
      Steps 1 and 2 come before step 3 because PAE covers both; step 5 applies only when the key
      material will be form (1), which F05.1 decides, so the form is chosen before signing in
      effect. F04 takes the one signature's bytes.
    steps:
      - n: "1"
        from: "signer"
        to: "signer"
        message: "in-toto Statement"
        field: "payload"
        action: >-
          Serialize the payload. DSSE allows any payload; for the Public Instance it is an in-toto
          Statement.
        locator: "§1.3, §5.1.2.2"
        kind: "stated"
        quotes:
          - source_lines: "171"
            quote: |-
              A DSSE envelope can contain arbitrary payloads.
        constrained_by:
          - "sigstore-bundle-0-3#R-0181"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "signer"
        to: "signer"
        message: "Envelope"
        field: "payloadType"
        action: >-
          Set payloadType, the string that says how to interpret the payload:
          application/vnd.in-toto+json for the Public Instance.
        locator: "§2.1, §5.1.2.2"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0094"
          - "sigstore-bundle-0-3#R-0029"
          - "sigstore-bundle-0-3#R-0181"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "signer"
        to: "signer"
        message: "Envelope"
        field: "payloadType, payload"
        action: >-
          Build PAE(payloadType, payload): DSSEv1, SP, the type's byte length in ASCII decimal, SP,
          the type, SP, the payload's byte length, SP, the payload bytes (decoded, not base64).
        locator: "§2.1"
        kind: "stated"
        evidence:
          - "E2"
        constrained_by:
          - "sigstore-bundle-0-3#R-0095"
          - "sigstore-bundle-0-3#R-0189"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "signer"
        to: "signer"
        message: "Signature"
        field: "sig, keyid"
        action: >-
          Sign the PAE once with the signing key: sig (required); keyid optional, an unauthenticated
          hint at the key used.
        locator: "§2.1, §2.2"
        kind: "stated"
        evidence:
          - "E2"
        constrained_by:
          - "sigstore-bundle-0-3#R-0031"
          - "sigstore-bundle-0-3#R-0032"
          - "sigstore-bundle-0-3#R-0098"
          - "sigstore-bundle-0-3#R-0189"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "signer"
        to: "signer"
        message: "Signature"
        field: "keyid"
        action: >-
          If the key material will be a public key identifier, set keyid to exactly the hint.
        guard: "the bundle's key material is form (1)"
        locator: "§1.3, §2.2"
        kind: "stated"
        note: >-
          keyid is OPTIONAL in DSSE (L261), so with form (1) this rule makes it mandatory in effect
          (SD-P-12).
        constrained_by:
          - "sigstore-bundle-0-3#R-0086"
          - "sigstore-bundle-0-3#R-0032"
        on_error: "unspecified for the producer; the verifier's side is F06.14 (EP-16)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "signer"
        to: "signer"
        message: "Envelope"
        field: "payload, payloadType, signatures"
        action: >-
          Assemble the Envelope: payload (base64 in JSON), payloadType, and signatures holding
          exactly one Signature (DSSE allows several; a bundle allows one).
        locator: "§1.3, §2.1, §5.1.2.2"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0028"
          - "sigstore-bundle-0-3#R-0093"
          - "sigstore-bundle-0-3#R-0029"
          - "sigstore-bundle-0-3#R-0096"
          - "sigstore-bundle-0-3#R-0097"
          - "sigstore-bundle-0-3#R-0089"
          - "sigstore-bundle-0-3#R-0182"
        on_error: >-
          stated: an envelope with more or fewer than one signature is rejected by the verifier
          (F06.13, EP-15)
        on_error_basis: "stated"
      - n: "7"
        from: "signer"
        to: "signer"
        message: "Signature"
        field: "sig"
        subflow: "F04"
        action: "Obtain a log entry and timestamps for the one signature's bytes (sub-flow F04)."
        locator: "§1.1, §4.5"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0070"
          - "sigstore-bundle-0-3#R-0067"
        on_error: "see F04"
        on_error_basis: "unspecified"
      - n: "8"
        from: "signer"
        to: "signer"
        message: "Bundle"
        field: "dsse_envelope"
        subflow: "F05"
        action: "Assemble the bundle with dsse_envelope as its content (sub-flow F05)."
        locator: "§1.3"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0027"
          - "sigstore-bundle-0-3#R-0176"
        on_error: "see F05"
        on_error_basis: "unspecified"
  - id: "F04"
    name: "log-and-timestamp"
    title: "Obtaining a transparency-log entry and RFC 3161 timestamps for the signature"
    locator: "§1.1, §1.2, §3.5, §3.6, §4.1, §4.2, §4.3, §4.4, §4.5, §5.1.1, §5.1.1.2, §5.1.1.3"
    kind_of_flow: "exchange with the log and the timestamp authority (sub-flow of F02 and F03)"
    participants:
      - "signer"
      - "transparency-log"
      - "timestamp-authority"
    summary: >-
      Two sources of evidence, both over the signature bytes. The log appends an entry and returns
      the fields of a TransparencyLogEntry: indexes, log ID, kind and version, integrated time, the
      inclusion promise (SET), the inclusion proof with its checkpoint, and the entry body. The
      timestamp authority returns a DER TimeStampResponse whose message imprint hashes the
      signature. Neither is required by the format, but time evidence is required in practice (step
      9). In the examples the imprint is SHA-256 of the raw signature bytes (E3), and each inclusion
      proof verifies with SHA-256(0x00 || canonicalized_body) as the leaf at the proof's own index
      (E4).
    order_note: >-
      The source fixes no order between the log (steps 1-4) and the timestamp authority (steps 5-6);
      both take the signature as input, and either may be omitted subject to step 9. Steps 1, 5 and
      the hand-back in 6 are the model's: the source describes what comes back, not the exchanges.
    steps:
      - n: "1"
        from: "signer"
        to: "transparency-log"
        message: "Rekor entry body (canonicalized_body content)"
        action: >-
          Submit an entry for the signature: for a message signature the digest, the signature and
          the certificate (hashedrekord in the example); for a DSSE envelope the envelope and the
          certificate (intoto in the example).
        locator: "§4.1, §4.5"
        kind: "inferred"
        inferred_reason: >-
          The source never describes submission: it builds the entry from Rekor's response
          (L801-802) and points at a list of entry kinds (L714-715). What the examples' bodies hold
          is evidence of what was submitted: digest, signature and certificate (E6a-E6c), and
          envelope and certificate (E6e-E6g).
        evidence:
          - "E6"
        quotes:
          - source_lines: "800-801"
            quote: |-
              TransparencyLogEntry captures all the details required from Rekor to reconstruct an entry, given that the payload is provided via other means.
        constrained_by:
          - "sigstore-bundle-0-3#R-0132"
        on_error: "unspecified by source (Rekor's API, outside)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "transparency-log"
        to: "transparency-log"
        message: "InclusionPromise"
        field: "signed_entry_timestamp"
        action: >-
          Append and integrate the entry: give it a global index and an integrated time, and sign
          the inclusion promise over the canonical JSON of the stored entry together with its log
          ID, index and integrated time.
        locator: "§4.4, §4.5"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0147"
          - "sigstore-bundle-0-3#R-0148"
          - "sigstore-bundle-0-3#R-0153"
          - "sigstore-bundle-0-3#R-0151"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "transparency-log"
        to: "signer"
        message: "TransparencyLogEntry"
        action: >-
          Return the response the TransparencyLogEntry is built from: log_index (global), log_id
          (the log's key ID), kind_version, integrated_time, inclusion_promise, inclusion_proof (the
          entry's index in the tree, root hash and tree size when the proof was made, and the hashes
          from leaf to root without the leaf and the root) and canonicalized_body (the response's
          body: the entry without index, ID and time).
        locator: "§3.5, §4.1, §4.3, §4.4, §4.5"
        kind: "stated"
        note: >-
          Two indexes: TransparencyLogEntry.log_index is the global index used to query the log
          (L811); InclusionProof.log_index is the entry's index in the tree it was written to
          (L751). The example's proof verifies only at the tree index (E4).
        evidence:
          - "E4"
        quotes:
          - source_lines: "802"
            quote: |-
              This type can easily be created from the existing response from Rekor.
        constrained_by:
          - "sigstore-bundle-0-3#R-0059"
          - "sigstore-bundle-0-3#R-0151"
          - "sigstore-bundle-0-3#R-0060"
          - "sigstore-bundle-0-3#R-0041"
          - "sigstore-bundle-0-3#R-0116"
          - "sigstore-bundle-0-3#R-0061"
          - "sigstore-bundle-0-3#R-0046"
          - "sigstore-bundle-0-3#R-0047"
          - "sigstore-bundle-0-3#R-0132"
          - "sigstore-bundle-0-3#R-0133"
          - "sigstore-bundle-0-3#R-0063"
          - "sigstore-bundle-0-3#R-0153"
          - "sigstore-bundle-0-3#R-0058"
          - "sigstore-bundle-0-3#R-0066"
          - "sigstore-bundle-0-3#R-0140"
          - "sigstore-bundle-0-3#R-0053"
          - "sigstore-bundle-0-3#R-0141"
          - "sigstore-bundle-0-3#R-0054"
          - "sigstore-bundle-0-3#R-0142"
          - "sigstore-bundle-0-3#R-0055"
          - "sigstore-bundle-0-3#R-0143"
          - "sigstore-bundle-0-3#R-0144"
          - "sigstore-bundle-0-3#R-0056"
          - "sigstore-bundle-0-3#R-0160"
          - "sigstore-bundle-0-3#R-0161"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "transparency-log"
        to: "signer"
        message: "Checkpoint"
        field: "envelope"
        action: >-
          Return with the proof a checkpoint: an origin line naming the log uniquely, the tree size,
          the root hash, optional further data, and a signature over the root hash; further
          signatures may follow, the first being the log's; the parts are joined by newlines (C2SP
          signed note).
        locator: "§4.2, §4.3"
        kind: "stated"
        note: >-
          In both examples the checkpoint's tree size and root hash equal the proof's; the DSSE
          example's checkpoint carries one optional line, a Timestamp (E5).
        evidence:
          - "E5"
        constrained_by:
          - "sigstore-bundle-0-3#R-0057"
          - "sigstore-bundle-0-3#R-0146"
          - "sigstore-bundle-0-3#R-0052"
          - "sigstore-bundle-0-3#R-0048"
          - "sigstore-bundle-0-3#R-0134"
          - "sigstore-bundle-0-3#R-0050"
          - "sigstore-bundle-0-3#R-0136"
          - "sigstore-bundle-0-3#R-0137"
          - "sigstore-bundle-0-3#R-0138"
          - "sigstore-bundle-0-3#R-0139"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "signer"
        to: "timestamp-authority"
        message: "none"
        object: "RFC 3161 TimeStampReq (outside this source)"
        action: >-
          Request an RFC 3161 timestamp whose message imprint is a hash of the signature bytes.
        locator: "§1.1"
        kind: "inferred"
        inferred_reason: >-
          The timestamps are counter signatures over the signature (L50) and a verifier checks the
          imprint against it (L59-60); the request is RFC 3161's and is not described. In the DSSE
          example the imprint is SHA-256 of the raw signature bytes, and not of its base64 text, of
          the PAE or of the payload (E3).
        evidence:
          - "E3"
        constrained_by:
          - "sigstore-bundle-0-3#R-0070"
          - "sigstore-bundle-0-3#R-0003"
          - "sigstore-bundle-0-3#R-0190"
        on_error: "unspecified by source (RFC 3161, outside)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "timestamp-authority"
        to: "signer"
        message: "RFC3161SignedTimestamp"
        field: "signed_timestamp"
        action: "Return the DER-encoded TimeStampResponse, carried as signed_timestamp."
        locator: "§3.6"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0117"
          - "sigstore-bundle-0-3#R-0042"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "7"
        from: "signer"
        to: "signer"
        message: "TransparencyLogEntry"
        action: >-
          Keep the entry as returned: the body, indexes and time are what the SET and the proof were
          computed over, so the bundle carries them unchanged.
        locator: "§4.5"
        kind: "inferred"
        inferred_reason: >-
          Implied by the verifier's duty to rebuild the SET's payload from canonicalized_body,
