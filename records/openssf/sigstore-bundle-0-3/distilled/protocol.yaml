          - "sigstore-bundle-0-3#R-0145"
          - "sigstore-bundle-0-3#R-0143"
          - "sigstore-bundle-0-3#R-0144"
          - "sigstore-bundle-0-3#R-0140"
          - "sigstore-bundle-0-3#R-0141"
          - "sigstore-bundle-0-3#R-0142"
          - "sigstore-bundle-0-3#R-0146"
          - "sigstore-bundle-0-3#R-0048"
          - "sigstore-bundle-0-3#R-0050"
          - "sigstore-bundle-0-3#R-0135"
          - "sigstore-bundle-0-3#R-0137"
          - "sigstore-bundle-0-3#R-0139"
        on_error: >-
          unspecified by source: a proof or checkpoint that fails proves no inclusion, and nothing
          says whether the bundle then fails (EP-11)
        on_error_basis: "unspecified"
      - n: "10"
        from: "verifier"
        to: "verifier"
        message: "TransparencyLogEntry"
        field: "canonicalized_body"
        action: >-
          For each log entry with canonicalized_body, verify that the signature the body references
          matches the bundle content's signature. Where the signature sits in the body, and how it
          is encoded there, depend on the entry kind: the same base64 string for hashedrekord, the
          base64 of that base64 text for intoto 0.0.2 (E6).
        locator: "§4.5"
        kind: "stated"
        note: "Matches is not defined across entry kinds (SD-P-4)."
        evidence:
          - "E6"
        constrained_by:
          - "sigstore-bundle-0-3#R-0067"
          - "sigstore-bundle-0-3#R-0161"
          - "sigstore-bundle-0-3#R-0152"
          - "sigstore-bundle-0-3#R-0164"
        on_error: >-
          inferred: a mismatch means the entry logs another signature; rejecting the bundle is this
          model's reading of a MUST verify with no stated outcome (EP-12)
        on_error_basis: "inferred"
      - n: "11"
        from: "verifier"
        to: "verifier"
        message: "VerificationMaterial"
        action: >-
          Forms (2) and (3): establish a trusted signing time and check that the signature was
          computed while the leaf was valid. Trusted times: a verified RFC 3161 timestamp; the
          integrated time of an entry whose promise verified; for a long-lived certificate the
          current time. An integrated time without a promise is not trusted. The procedure is the
          client spec's (a Google Doc outside this source).
        guard: "forms (2) and (3)"
        locator: "§1.1, §1.2, §1.3, §4.5, §5.1.1"
        kind: "stated"
        note: >-
          State machines M03 (which time) and M04 (inside the window). The DSSE example's two times
          both equal the leaf's notBefore, a boundary the source does not settle (SD-P-5).
        evidence:
          - "E7"
        quotes:
          - source_lines: "159"
            quote: |-
              <https://docs.google.com/document/d/1kbhK2qyPPk8SLavHzYSDM8-Ueul9_oxIMVFuWMWKz0E/edit#heading=h.x8bduppe89ln>
        constrained_by:
          - "sigstore-bundle-0-3#R-0085"
          - "sigstore-bundle-0-3#R-0193"
          - "sigstore-bundle-0-3#R-0062"
          - "sigstore-bundle-0-3#R-0080"
          - "sigstore-bundle-0-3#R-0156"
          - "sigstore-bundle-0-3#R-0174"
          - "sigstore-bundle-0-3#R-0175"
          - "sigstore-bundle-0-3#R-0168"
          - "sigstore-bundle-0-3#R-0071"
        on_error: >-
          inferred: no trusted time, or a time outside the window, fails sigstore-bundle-0-3#R-0085;
          the source states no outcome (EP-13)
        on_error_basis: "inferred"
      - n: "12"
        from: "verifier"
        to: "verifier"
        message: "Envelope"
        field: "payloadType"
        action: >-
          DSSE: check that payloadType is a supported and expected type (for the Public Instance,
          application/vnd.in-toto+json).
        guard: "content is dsse_envelope"
        locator: "§1.3, §5.1.2.2"
        kind: "stated"
        note: >-
          The source calls this part of the DSSE protocol, which it links at master and does not
          include; expected is not defined (OI-01).
        quotes:
          - source_lines: "173-175"
            quote: |-
              This is part of the DSSE protocol which is defined here: <https://github.com/secure-systems-lab/dsse/blob/master/protocol.md>
        constrained_by:
          - "sigstore-bundle-0-3#R-0088"
          - "sigstore-bundle-0-3#R-0181"
        on_error: >-
          inferred: an unsupported or unexpected type is not accepted; no outcome is stated (EP-14)
        on_error_basis: "inferred"
      - n: "13"
        from: "verifier"
        to: "verifier"
        message: "Envelope"
        field: "signatures"
        action: "DSSE: reject the envelope if it does not hold exactly one signature."
        guard: "content is dsse_envelope"
        locator: "§1.3, §5.1.2.2"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0090"
          - "sigstore-bundle-0-3#R-0089"
          - "sigstore-bundle-0-3#R-0182"
        on_error: "stated: reject the envelope (EP-15), the only rejection the source states"
        on_error_basis: "stated"
      - n: "14"
        from: "verifier"
        to: "verifier"
        message: "Signature"
        field: "keyid"
        action: >-
          DSSE with form (1): check that the hint and the signature's keyid are exactly the same.
        guard: "content is dsse_envelope and the key material is form (1)"
        locator: "§1.3, §2.2"
        kind: "stated"
        note: >-
          Both values are unauthenticated hints (L260, L544); the equality ties them together but
          authenticates neither.
        constrained_by:
          - "sigstore-bundle-0-3#R-0086"
          - "sigstore-bundle-0-3#R-0098"
        on_error: "inferred: a bundle that breaks a MUST; no outcome is stated (EP-16)"
        on_error_basis: "inferred"
      - n: "15"
        from: "verifier"
        to: "verifier"
        message: "Signature"
        field: "sig"
        action: >-
          DSSE: verify the one signature over PAE(payloadType, payload), the payload taken as its
          decoded bytes, with the key from step 5.
        guard: "content is dsse_envelope"
        locator: "§2.1"
        kind: "stated"
        note: >-
          The signature covers PAE only: not keyid, not the verification material, not the log
          entries or timestamps, which stand on their own signatures (sigstore-bundle-0-3#R-0189).
        evidence:
          - "E2"
        constrained_by:
          - "sigstore-bundle-0-3#R-0095"
          - "sigstore-bundle-0-3#R-0189"
          - "sigstore-bundle-0-3#R-0098"
        on_error: >-
          inferred: a signature that does not verify fails the bundle; no outcome is stated (EP-17)
        on_error_basis: "inferred"
      - n: "16"
        from: "verifier"
        to: "verifier"
        message: "MessageSignature"
        field: "signature, message_digest"
        action: >-
          Message signature: digest the artifact itself and verify the signature over the artifact
          with the key from step 5; never verify against message_digest, which identifies the
          artifact only.
        guard: "content is message_signature"
        locator: "§3.4, §5.1.2.1"
        kind: "stated"
        evidence:
          - "E1"
        constrained_by:
          - "sigstore-bundle-0-3#R-0038"
          - "sigstore-bundle-0-3#R-0180"
          - "sigstore-bundle-0-3#R-0110"
          - "sigstore-bundle-0-3#R-0112"
          - "sigstore-bundle-0-3#R-0113"
          - "sigstore-bundle-0-3#R-0114"
        on_error: >-
          inferred: a signature that does not verify fails the bundle; no outcome is stated (EP-17)
        on_error_basis: "inferred"
      - n: "17"
        from: "verifier"
        to: "verifier"
        message: "X509Certificate"
        field: "raw_bytes"
        action: >-
          Forms (2) and (3): check the identity the leaf's Fulcio extensions carry against the
          verifier's policy. Not defined here.
        guard: "forms (2) and (3)"
        locator: "§5.1.1.1.1"
        kind: "inferred"
        inferred_reason: >-
          The docs page says the leaf carries identities consumed at verification time (L904-905);
          what a verifier compares them with is the client spec's. SubjectAlternativeName (§3.14)
          describes an expected SAN but is not reachable from Bundle.
        constrained_by:
          - "sigstore-bundle-0-3#R-0169"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
  - id: "F07"
    name: "verify-v0.1-bundle"
    title: "The v0.1 compatibility path"
    locator: "§1.2, §1.3, §4.5"
    kind_of_flow: "local procedure (variant of F06)"
    participants:
      - "verifier"
      - "trust-material"
    summary: >-
      A legacy v0.1 media type must be accepted, yet supporting v0.1 is an option a verification
      library may offer, and a verifier should not allow v0.1 bundles in an ecosystem that never
      produced them (SD-P-1). Where v0.1 is supported, an entry may carry an inclusion promise
      without an inclusion proof, the promise is required and must be verified, and keyless PGI
      bundles carry form (2). Otherwise F06 applies.
    order_note: >-
      Step 2 decides whether the rest runs. Steps 3-5 replace F06 steps 4, 8 and 9 for v0.1; F06
      steps 5-7 and 10-17 apply unchanged.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "Bundle"
        field: "media_type"
        action: >-
          Recognize the legacy media type application/vnd.dev.sigstore.bundle+json;version=0.1,
          which clients must be able to accept.
        locator: "§1.3"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0081"
          - "sigstore-bundle-0-3#R-0082"
        on_error: "none: the media type is recognized; acceptance is step 2's"
        on_error_basis: "none"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "Bundle"
        field: "media_type"
        action: >-
          Decide whether to support v0.1 at all: an option a client verification library may provide
          for backwards compatibility; a verifier whose ecosystem never produced v0.1 bundles is
          told not to allow them.
        guard: "the library offers v0.1 support and the ecosystem produced v0.1 bundles"
        locator: "§1.2"
        kind: "stated"
        note: >-
          Step 1's must and this step's option and should not can both apply to one bundle (SD-P-1,
          M02).
        constrained_by:
          - "sigstore-bundle-0-3#R-0018"
          - "sigstore-bundle-0-3#R-0020"
        on_error: >-
          stated in part: refusal is what sigstore-bundle-0-3#R-0020 recommends where the ecosystem
          never produced v0.1; what a refusal looks like is not said (EP-02)
        on_error_basis: "stated"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "TransparencyLogEntry"
        field: "inclusion_proof, inclusion_promise"
        action: >-
          Accept an entry carrying an inclusion promise and no inclusion proof, setting aside the
          REQUIRED annotation on inclusion_proof.
        guard: "v0.1 supported"
        locator: "§1.2, §4.5"
        kind: "stated"
        note: "A parser that enforces the annotation rejects such an entry (sigstore-bundle-0-3#R-0192)."
        constrained_by:
          - "sigstore-bundle-0-3#R-0018"
          - "sigstore-bundle-0-3#R-0192"
          - "sigstore-bundle-0-3#R-0066"
        on_error: "none: a relaxation"
        on_error_basis: "none"
      - n: "4"
        from: "verifier"
        to: "trust-material"
        message: "InclusionPromise"
        field: "signed_entry_timestamp"
        action: >-
          Validate the inclusion promise, which a v0.1 bundle must carry; as in F06.8 but without
          the time-source exemption.
        guard: "v0.1 supported"
        locator: "§1.2, §4.4, §4.5"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0019"
          - "sigstore-bundle-0-3#R-0154"
          - "sigstore-bundle-0-3#R-0155"
          - "sigstore-bundle-0-3#R-0147"
          - "sigstore-bundle-0-3#R-0162"
          - "sigstore-bundle-0-3#R-0164"
        on_error: >-
          inferred: a missing or failing promise fails a MUST; no outcome is stated (EP-09, EP-10)
        on_error_basis: "inferred"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "VerificationMaterial"
        field: "content"
        action: "Keyless PGI v0.1 bundles carry form (2)."
        guard: "v0.1 supported, keyless on the PGI"
        locator: "§1.2"
        kind: "inferred"
        inferred_reason: "A producer rule (L108-109); as in F06.4, a verifier check is not stated."
        constrained_by:
          - "sigstore-bundle-0-3#R-0013"
        on_error: "unspecified by source (EP-04)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "verifier"
        to: "verifier"
        message: "TransparencyLogEntry"
        field: "integrated_time"
        subflow: "F06"
        action: >-
          Trust the integrated time only through the verified promise; continue with F06 steps 5-7
          and 10-17 (step 9 only where the entry carries a proof).
        guard: "v0.1 supported"
        locator: "§1.2, §4.5"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0062"
          - "sigstore-bundle-0-3#R-0080"
        on_error: "see F06"
        on_error_basis: "unspecified"
  - id: "F08"
    name: "dsse-signature-extension"
    title: "VerificationMaterial as a DSSE signature extension, outside a bundle"
    locator: "§1.2"
    kind_of_flow: "local procedure on a DSSE envelope"
    participants:
      - "signer"
      - "verifier"
    summary: >-
      A DSSE signature may carry a VerificationMaterial as an extension: the extension's kind
      identifies Sigstore by application/vnd.dev.sigstore.verificationmaterial;version=0.1 and its
      ext field carries the message. Where public_key is the form, its hint has to equal the keyid
      of the signature carrying the extension. The envelope.proto of this source gives Signature
      only sig and keyid (L253-263), so these protos cannot express the extension; DSSE's extension
      container is outside the source (the requirements lane's SD-R-7).
    order_note: "Step 1 before 2; step 3 constrains 2; step 4 is the verifier's."
    steps:
      - n: "1"
        from: "signer"
        to: "signer"
        message: "VerificationMaterial"
        action: "Build a VerificationMaterial for the signature."
        locator: "§1.2"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0072"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "signer"
        to: "signer"
        message: "Signature"
        object: "DSSE signature extension (outside this source)"
        action: >-
          Attach it to the DSSE signature as an extension whose kind is the Sigstore value and whose
          ext field carries the VerificationMaterial.
        locator: "§1.2"
        kind: "stated"
        note: >-
          The value is the messages.yaml entry DSSE signature-extension kind for
          VerificationMaterial; the extension's container is DSSE's, and Signature here has no field
          for it.
        quotes:
          - source_lines: "70-71"
            quote: |-
              Specifically, the `ext` field of the extension will expect this message when the signature extension is for Sigstore.
        constrained_by:
          - "sigstore-bundle-0-3#R-0072"
          - "sigstore-bundle-0-3#R-0073"
        on_error: "unspecified by source: these protos cannot carry the extension (EP-20)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "signer"
        to: "signer"
        message: "PublicKeyIdentifier"
        field: "hint"
        action: >-
          Where public_key is the form used, its hint has to equal the keyid of the signature that
          carries the extension.
        guard: "the extension's key material is form (1)"
        locator: "§1.2"
        kind: "stated"
        note: "The in-bundle counterpart is F06.14."
        constrained_by:
          - "sigstore-bundle-0-3#R-0004"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "PublicKeyIdentifier"
        field: "hint"
        action: "Read the extension and compare the hint with the signature's keyid."
        guard: "the extension's key material is form (1)"
        locator: "§1.2"
        kind: "inferred"
        inferred_reason: "The source binds the match and names no one who checks it."
        constrained_by:
          - "sigstore-bundle-0-3#R-0004"
        on_error: "unspecified by source (EP-16)"
        on_error_basis: "unspecified"
error_paths:
  - id: "EP-01"
    condition: >-
      media_type is none of the four values the source names (empty, misspelt, or a v0.1 or v0.2
      value in the current spelling, which the source never defines).
    steps:
      - "F06.2"
    basis: "unspecified"
    see:
      - "SD-P-2"
      - "M02"
    outcome: >-
      No rule. M02 shows no stated transition fires for it.
  - id: "EP-02"
    condition: >-
      A legacy v0.1 bundle reaches a verifier whose library offers no v0.1 support, or whose
      ecosystem never produced v0.1 bundles.
    steps:
      - "F07.2"
    basis: "stated"
    see:
      - "SD-P-1"
      - "M02"
    outcome: >-
      Refusal is recommended (should not allow) where the ecosystem never produced v0.1, and follows
      from the option being absent; but clients must be able to accept the v0.1 media type, so two
      outcomes apply (M02: two transitions fire).
  - id: "EP-03"
    condition: >-
      verification_material is missing, the key material or the content holds no member (or a JSON
      bundle names two), or another REQUIRED field is unset.
    steps:
      - "F05.7"
      - "F06.3"
    basis: "unspecified"
    outcome: >-
      The annotations bind the producer and protobuf does not enforce them; no verifier outcome is
      stated. A verifier that lacks key material or content has nothing to verify.
  - id: "EP-04"
    condition: >-
      The key-material form does not match version and instance (a keyless PGI v0.3 bundle with form
      (2), for one).
    steps:
      - "F05.1"
      - "F06.4"
      - "F07.5"
    basis: "unspecified"
    see:
      - "SD-P-6"
      - "OI-02"
    outcome: >-
      Producer rules only; no verifier outcome is stated, and a verifier is not told how to
      recognize a keyless PGI bundle.
  - id: "EP-05"
    condition: >-
      Form (1): no held key matches the hint.
    steps:
      - "F01.9"
      - "F06.5"
    basis: "unspecified"
    outcome: >-
      No outcome stated; the hint is unauthenticated and its format agreed out of band.
  - id: "EP-06"
    condition: >-
      Forms (2) and (3): the leaf does not chain to a CA certificate the verifier independently
      trusts.
    steps:
      - "F06.6"
    basis: "inferred"
    outcome: >-
      The chain rule's purpose is not met; no outcome is stated.
  - id: "EP-07"
    condition: >-
      Form (2): the chain carries root or redundant intermediate CA certificates (an old or
      non-complying bundle).
    steps:
      - "F05.3"
      - "F06.6"
    basis: "stated"
    outcome: >-
      Not an error for the verifier: it should ignore them or treat them as untrusted for path
      building.
  - id: "EP-08"
    condition: >-
      An RFC 3161 timestamp's imprint does not match the signature, or its own signature or
      authority cannot be trusted.
    steps:
      - "F06.7"
    basis: "unspecified"
    see:
      - "SD-P-7"
      - "SD-P-10"
    outcome: >-
      No outcome stated, nor whether the bundle fails or the timestamp only stops counting as a time
      source.
  - id: "EP-09"
    condition: >-
      An inclusion promise does not verify.
    steps:
      - "F06.8"
      - "F07.4"
    basis: "inferred"
    see:
      - "M03"
    outcome: >-
      Where it had to be verified (v0.1, or no other suitable time source) a MUST fails and the
      integrated time cannot be trusted; where it only should be verified, no outcome is stated.
  - id: "EP-10"
    condition: >-
      An entry carries no inclusion promise.
    steps:
      - "F04.9"
      - "F06.8"
      - "F07.4"
    basis: "stated"
    see:
      - "M03"
    outcome: >-
      Its integrated time must not be trusted (L826-827). In a v0.1 bundle the promise is required,
      so the bundle breaks sigstore-bundle-0-3#R-0154; in a v0.2 or later bundle it is allowed if
      another suitable time source exists.
  - id: "EP-11"
    condition: >-
      An inclusion proof does not verify, or its checkpoint's signature fails, or the checkpoint's
      size or root differs from the proof's.
    steps:
      - "F06.9"
    basis: "unspecified"
    see:
      - "SD-P-3"
      - "SD-P-11"
    outcome: >-
      No verifier duty to check the proof is stated, so no outcome either; the entry proves no
      inclusion.
  - id: "EP-12"
    condition: >-
      The signature canonicalized_body references does not match the bundle content's signature.
    steps:
      - "F06.10"
    basis: "inferred"
    see:
      - "SD-P-4"
    outcome: >-
      A MUST verify fails; no outcome is stated. What matches means differs by entry kind.
  - id: "EP-13"
    condition: >-
      Forms (2) and (3): no trusted signing time exists, or the trusted time lies outside the leaf's
      validity.
    steps:
      - "F04.9"
      - "F06.11"
    basis: "inferred"
    see:
      - "SD-P-5"
      - "SD-P-7"
      - "SD-P-8"
      - "SD-P-9"
      - "M03"
      - "M04"
    outcome: >-
      sigstore-bundle-0-3#R-0085 is not met; no outcome is stated and the procedure is deferred to
      the client spec. At the window's ends the source does not say whether the time is inside.
  - id: "EP-14"
    condition: >-
      DSSE: payloadType is not a supported and expected type.
    steps:
      - "F06.12"
    basis: "inferred"
    see:
      - "OI-01"
    outcome: >-
      Not accepted; the source states no outcome and calls the check part of the DSSE protocol.
  - id: "EP-15"
    condition: >-
      DSSE: the envelope holds zero signatures, or more than one.
    steps:
      - "F03.6"
      - "F06.13"
    basis: "stated"
    outcome: >-
      The client must reject the envelope (L182-183): the only rejection in the source.
  - id: "EP-16"
    condition: >-
      DSSE with form (1): the hint and the signature's keyid differ, or keyid is empty or absent.
    steps:
      - "F03.5"
      - "F06.14"
      - "F08.4"
    basis: "inferred"
    see:
      - "SD-P-12"
    outcome: >-
      A MUST is broken; no outcome is stated. An absent keyid is allowed by DSSE (OPTIONAL) and
      breaks the bundle rule all the same.
  - id: "EP-17"
    condition: >-
      The content's signature does not verify with the resolved key.
    steps:
      - "F06.15"
      - "F06.16"
    basis: "inferred"
    outcome: >-
      Not accepted; no outcome is stated. The source has no word for a failed verification: error,
      fail, failure and invalid occur 0 times.
  - id: "EP-18"
    condition: >-
      Message signature: the artifact is not provided at verification time.
    steps:
      - "F06.1"
      - "F06.16"
    basis: "stated"
    outcome: >-
      The signature cannot be checked: the bundle's digest must not be used to verify it (L475-476).
      The outcome is unspecified.
  - id: "EP-19"
    condition: >-
      The signer has no suitable time evidence for a short-lived certificate (no promise, no
      timestamp).
    steps:
      - "F04.9"
    basis: "inferred"
    outcome: >-
      The bundle breaks the docs page's must (L898) and fails at F06.11 once the certificate has
      expired.
  - id: "EP-20"
    condition: >-
      VerificationMaterial is to be carried as a DSSE signature extension.
    steps:
      - "F08.2"
    basis: "unspecified"
    outcome: >-
      Signature in this source's envelope.proto has no extension field; nothing is said of what
      happens to an envelope carrying one.
findings:
  - id: "OF-01"
    title: "No order of checks, and nothing on verifying the signature before parsing the payload"
    locators:
      - "whole source"
      - "§1.3 (L171-185)"
    finding: >-
      The source fixes no order among a verifier's checks and never says that the signature is to be
      verified before the payload is parsed. Census over all 1189 lines (F06 order_note): before 0,
      then 0, step and steps 0; the one after, three firsts and four orders are about certificate
      expiry, list positions and hash order, never about checks. What the source does fix, by data
      rather than by sentence: the DSSE signature covers PAE(payloadType, payload) over the decoded
      payload bytes (E2), so verifying it needs the payload base64-decoded out of the JSON but not
      parsed; the payload-type check reads payloadType only; and a message signature has no payload
      in the bundle at all, the artifact being digested by the verifier (L995-996) and the bundle's
      digest barred from verification (L475-476). For DSSE the source defers to the DSSE protocol
      (L173-175), linked at master and not included; the library holds DSSE as
      secure-systems-lab-dsse (pinned at 1d3370f), whose protocol lists verification before parsing
      (that record's normative.md, P8). That order is DSSE's, not this source's. For the bundle's
      own checks, chain, timestamps, log entries and time, no order exists anywhere in the source.
    bears_on: >-
      mofn R-O-05 (ARCH-0001 v0.2.0 §5.3) asks a verifier to verify the signature before decoding
      and not to canonicalize input as part of verification. This source neither requires nor
      forbids verify-before-parse for the content, and its log-entry checks require decoding
      canonicalized_body (F06.10) and building canonical JSON (OF-02). Recorded, not decided:
      whether that matters is a design-notes and mofn question.
    quotes:
      - source_lines: "173-175"
        quote: |-
          This is part of the DSSE protocol which is defined here: <https://github.com/secure-systems-lab/dsse/blob/master/protocol.md>
      - source_lines: "182-183"
        quote: |-
          During verification a client MUST reject an envelope if the number of signatures is not equal to one.
    constrained_by:
      - "sigstore-bundle-0-3#R-0088"
      - "sigstore-bundle-0-3#R-0090"
      - "sigstore-bundle-0-3#R-0095"
      - "sigstore-bundle-0-3#R-0189"
      - "sigstore-bundle-0-3#R-0038"
      - "sigstore-bundle-0-3#R-0180"
  - id: "OF-02"
    title: "The verifier canonicalizes to verify an inclusion promise"
    locators:
      - "§4.4 (L781-790)"
      - "§4.5 (L847-864)"
    finding: >-
      The inclusion promise signs the canonical JSON of the entry with its log ID, log index and
      integrated time, and it is the verifier that joins canonicalized_body and the other three into
      those bytes. Without canonicalized_body it must construct an equivalent payload from other
      sources; canonicalized_body itself exists because the signed bytes cannot always be produced
      deterministically (field order, whitespace). So verifying a promise means the verifier builds
      canonical bytes; it is not handed the signed bytes. The canonical form is Rekor's (L784,
      outside this source) and could not be exercised here: the source holds no log key, so no
      promise is verifiable from it.
    quotes:
      - source_lines: "852-855"
        quote: |-
          The verifier is responsible for combining the `canonicalized_body`, `log_index`, `log_id`, and `integrated_time` into the payload that the SET's signature is generated over.
      - source_lines: "856-858"
        quote: |-
          This field is intended to be used in cases where the SET cannot be produced determinisitically (e.g. inconsistent JSON field ordering, differing whitespace, etc).
      - source_lines: "863-864"
        quote: |-
          If not set, clients are responsible for constructing an equivalent payload from other sources to verify the signature.
    constrained_by:
      - "sigstore-bundle-0-3#R-0147"
      - "sigstore-bundle-0-3#R-0162"
      - "sigstore-bundle-0-3#R-0164"
      - "sigstore-bundle-0-3#R-0163"
      - "sigstore-bundle-0-3#R-0160"
evidence_method: >-
  Reproduced by distilled/protocol-evidence.derived.py, which reads the original bytes of bundle.md
  (.cache/sigstore-bundle-0-3.include/bundle.md, sha256 8d1127003af7...dd4746df0 checked, as pinned
  in render-source.py and record.yaml), cuts its nine json fences, takes the three that parse as
  JSON (fences at rendering L1035, L1081 and L1141), recomputes every check below and exits 1 if a
  result differs from this file. Python standard library and the openssl command: openssl for ECDSA
  and the certificates' names, hashlib for SHA-256, a minimal DER walker for validity times and the
  RFC 3161 response; the inclusion proofs by the algorithm of RFC 9162 §2.1.3.2 (library record
  rfc-9162). Pass 1 ran the same checks with the cryptography package in a scratch directory; the
  verify pass ported them and all 30 results agree. Nothing outside the source was used: no log,
  timestamp-authority or Fulcio key and no trust root. Each check is listed with its result, false
  results included, so that what was examined is visible beside what was found.
evidence:
  - id: "E1"
    title: "What a message signature covers"
    inputs: >-
      The message-signature example: certificate.rawBytes (L1064), messageDigest (L1068-1071),
      signature (L1072).
    checks:
      - check: >-
          ECDSA P-256 with SHA-256, the printed digest given as the prehash (a signature over an
          artifact whose SHA-256 is that digest), under the leaf's public key
        result: "true"
      - check: >-
          ECDSA P-256 with SHA-256 over the 32 digest bytes as the message
        result: "false"
    conclusion: >-
      The signature is over the artifact; the digest is only its prehash. Read as a signature over
      the 32 digest bytes, which over an artifact hash (L990) allows, it does not verify.
    limits: >-
      The artifact itself is not in the source; its SHA-256 is taken from the bundle, which F06.16
      forbids a verifier to do, and which serves here only to show what the signer signed.
  - id: "E2"
    title: "What a DSSE signature covers"
    inputs: >-
      The DSSE example: x509CertificateChain certificates[0] (L1088), payload (L1127), payloadType
      (L1128), the one signature (L1130-1133), and the attestation printed after it (L1141-1189).
    checks:
      - check: >-
          signature over PAE(payloadType, decoded payload bytes)
        result: "true"
      - check: >-
          signature over PAE(payloadType, base64 text of the payload)
        result: "false"
      - check: >-
          signature over the decoded payload without PAE
        result: "false"
      - check: >-
          decoded payload equals the printed attestation as JSON data
        result: "true"
      - check: >-
          the envelope holds exactly one signature (its keyid is the empty string)
        result: "true"
    conclusion: >-
      PAE over the decoded payload bytes, as sigstore-bundle-0-3#R-0189 infers; the bundle's DSSE
      rule of one signature holds.
  - id: "E3"
    title: "What an RFC 3161 imprint hashes"
    inputs: >-
      The DSSE example's rfc3161Timestamps[0].signedTimestamp (L1121) and its signature (L1131).
    checks:
      - check: >-
          hashedMessage equals SHA-256 of the raw signature bytes (hash OID 2.16.840.1.101.3.4.2.1)
        result: "true"
      - check: >-
          hashedMessage equals SHA-256 of the PAE
        result: "false"
      - check: >-
          hashedMessage equals SHA-256 of the decoded payload
        result: "false"
      - check: >-
          hashedMessage equals SHA-256 of the signature's base64 text
        result: "false"
    conclusion: >-
      The imprint hashes the raw signature bytes, as sigstore-bundle-0-3#R-0190 infers. genTime is
      2023-02-01T00:00:00Z.
    limits: >-
      The response's own signature and the authority's certificate were not verified: the source
      carries no trust anchor for them.
  - id: "E4"
    title: "What the inclusion proof's leaf is, and which index it uses"
    inputs: >-
      Each example's inclusionProof (L1052-1060, L1106-1114) and canonicalizedBody (L1061, L1115).
    checks:
      - check: >-
          message-signature example: leaf SHA-256(0x00 || canonicalizedBody), tree index 3775938 of
          3775939, 12 path hashes, reaches rootHash
        result: "true"
      - check: >-
          the same proof computed at the global logIndex 125680200
        result: "false"
      - check: >-
          DSSE example: leaf SHA-256(0x00 || canonicalizedBody), tree index 0 of 1, no path hashes,
          equals rootHash
        result: "true"
      - check: >-
          the same proof at the global logIndex 4288993 (not below the tree size)
        result: "false"
    conclusion: >-
      The leaf is the RFC 6962 leaf hash of canonicalized_body, at InclusionProof.log_index, the
      index in the tree. The source says neither (SD-P-3).
  - id: "E5"
    title: "Checkpoints against their proofs"
    inputs: >-
      Each example's checkpoint.envelope (L1058, L1112).
    checks:
      - check: >-
          message-signature example: checkpoint tree size and root hash equal the proof's (origin
          rekor.sigstore.dev, no optional lines)
        result: "true"
      - check: >-
          message-signature example: one signature line, naming rekor.sigstore.dev
        result: "true"
      - check: >-
          DSSE example: tree size and root hash equal the proof's (origin localhost:8000, one
          optional line Timestamp: 1675209600000000000)
        result: "true"
      - check: >-
          DSSE example: one signature line, naming localhost:8000
        result: "true"
    conclusion: >-
      Size and root agree with the proof in both, as sigstore-bundle-0-3#R-0196 infers; the DSSE
      checkpoint shows optional data that a client must not assume (L729).
    limits: >-
      The checkpoint signatures were not verified: no log key is in the source.
  - id: "E6"
    title: "What canonicalized_body references, against the bundle content"
    inputs: >-
      The decoded bodies (L1061, L1115) against messageSignature (L1067-1073) and dsseEnvelope
      (L1126-1135).
    checks:
      - check: >-
          hashedrekord 0.0.1: spec.signature.content equals messageSignature.signature as strings
        result: "true"
      - check: >-
          hashedrekord: spec.data.hash.value (hex) equals messageDigest.digest
        result: "true"
      - check: >-
          hashedrekord: spec.signature.publicKey.content is the bundle's certificate (base64 of PEM)
        result: "true"
      - check: >-
          intoto 0.0.2: envelope.signatures[0].sig equals the bundle's sig as strings
        result: "false"
      - check: >-
          intoto 0.0.2: the body's sig base64-decodes to the bundle's base64 sig text
        result: "true"
      - check: >-
          intoto 0.0.2: the body's payload base64-decodes to the bundle's base64 payload text
        result: "true"
      - check: >-
          intoto 0.0.2: the body's publicKey is chain[0] (base64 of PEM)
        result: "true"
      - check: >-
          intoto 0.0.2: payloadHash is SHA-256 of the decoded payload
        result: "true"
    conclusion: >-
      For hashedrekord the referenced signature is the same string; for intoto 0.0.2 it is encoded
      one more time, so a string comparison fails where a decoded one matches (SD-P-4).
  - id: "E7"
    title: "Signing times against the leaves' validity"
    inputs: >-
      The leaves (L1064, L1088), integratedTime (L1048, L1102) and the DSSE example's genTime (E3).
    checks:
      - check: >-
          message-signature example: notBefore 2024-08-28T18:44:34Z < integratedTime 18:44:36Z <
          notAfter 18:54:34Z
        result: "true"
      - check: >-
          DSSE example: integratedTime 2023-02-01T00:00:00Z equals notBefore
        result: "true"
      - check: >-
          DSSE example: genTime 2023-02-01T00:00:00Z equals notBefore
        result: "true"
    conclusion: >-
      Both leaves are valid for 600 seconds. The message-signature example signs 2 seconds into the
      window; both of the DSSE example's times sit exactly on notBefore, so a verifier that reads
      the window as open at its start rejects the source's own example (SD-P-5). The DSSE leaf's
      issuer is O=sigstore.mock, CN=sigstore, and the message-signature leaf's
      CN=sigstore-intermediate, O=sigstore.dev; neither leaf has a basicConstraints extension and
      both have keyUsage digitalSignature.
source_defects_note: >-
  SD-P-n are this lane's. The verify pass unified them with the other lanes' SD-R, SD-S and SD-D in
  normative.md (Source defects); each entry's unified key names its SD-n there (SD-P-1, -2, -3, -6
  and -9 merged into SD-4, SD-5, SD-18, SD-13 and SD-21; SD-P-10 merged with SD-D-7 as SD-30). Each
  has a class, locators, the source words it rests on, and where the model shows it.
source_defects:
  - id: "SD-P-1"
    unified: "SD-4"
    class: "contradiction"
    title: >-
      v0.1: clients must accept the media type, but v0.1 support is optional and should not be
      allowed where it was never produced
    locators:
      - "§1.2 (L125-130)"
      - "§1.3 (L147-149)"
    quotes:
      - source_lines: "147-148"
        quote: |-
          Clients must to be able to accept media type using the previously defined formats:
      - source_lines: "149"
        quote: |-
          * application/vnd.dev.sigstore.bundle+json;version=0.1
      - source_lines: "129-130"
        quote: |-
          Verifiers SHOULD NOT allow v0.1 bundles if they're used in an ecosystem which never produced them.
    requirements:
      - "sigstore-bundle-0-3#R-0081"
      - "sigstore-bundle-0-3#R-0082"
      - "sigstore-bundle-0-3#R-0018"
      - "sigstore-bundle-0-3#R-0020"
    description: >-
      Bundle's media_type comment says clients must be able to accept the previously defined
      formats, version=0.1 first among them. VerificationMaterial's tlog_entries comment says
      supporting v0.1 is an option a client verification library may provide, and that verifiers in
      an ecosystem that never produced v0.1 bundles are not to allow them. For a v0.1 bundle the
      first rule accepts and the other two refuse whenever the option is absent or the ecosystem
      never produced v0.1.
    consequence: >-
      Evaluated over all 20 inputs of M02 (media type by option by ecosystem): with the stated
      transitions alone, an accepting and a refusing transition both fire on 2 of the 4 v0.1 inputs
      (eco01 false); reading the absent option as no support (M02.T05, inferred), on 3 of 4. A
      reading that reconciles them takes accept to mean recognize the media type, and allow to mean
      verify the bundle; the source says neither.
    modelled_as: >-
      M02.T04 against M02.T05 and M02.T06; F07 steps 1 and 2; EP-02.
  - id: "SD-P-2"
    unified: "SD-5"
    class: "gap"
    title: >-
      The media type of a bundle in the protobuf binary encoding is not given
    locators:
      - "§1 (L41-46)"
      - "§1.3 (L145-146)"
    quotes:
      - source_lines: "145-146"
        quote: |-
          MUST be application/vnd.dev.sigstore.bundle.v0.3+json when when encoded as JSON.
    requirements:
      - "sigstore-bundle-0-3#R-0021"
      - "sigstore-bundle-0-3#R-0001"
    description: >-
      media_type's value is fixed only when encoded as JSON; the versioning note says the bundle
      must be versioned by populating media_type, in every encoding. For a binary bundle no value is
      given, and a +json media type on a binary encoding is neither allowed nor forbidden. The
      doubled when is a typo and does not change the reading.
    consequence: >-
      A producer of binary bundles has no conforming value to write, and a verifier no way to tell a
      right value from a wrong one.
    modelled_as: >-
      F05.8 on_error; EP-01.
  - id: "SD-P-3"
    unified: "SD-18"
    class: "gap"
    title: >-
      What the inclusion proof's leaf hash is computed over is not said, and the field it needs is
      optional
    locators:
      - "§4.3 (L764-768)"
      - "§4.5 (L847-848)"
    quotes:
      - source_lines: "767-768"
        quote: |-
          The root hash is available separately in this message, and the leaf hash should be calculated by the client.
      - source_lines: "847-848"
        quote: |-
          Optional. The canonicalized transparency log entry, used to reconstruct the Signed Entry Timestamp (SET) during verification.
    requirements:
      - "sigstore-bundle-0-3#R-0145"
      - "sigstore-bundle-0-3#R-0160"
      - "sigstore-bundle-0-3#R-0164"
      - "sigstore-bundle-0-3#R-0195"
    description: >-
      The client calculates the leaf hash, but from what is not stated. In both examples it is
      SHA-256 of 0x00 and canonicalized_body, and the proof verifies only at
      InclusionProof.log_index (E4). canonicalized_body is optional; the fallback when it is absent,
      building an equivalent payload from elsewhere (L863-864), is stated for the SET's signature,
      not for the leaf.
    consequence: >-
      Without canonicalized_body a verifier has no stated way to compute the leaf, so the required
      inclusion proof cannot be checked from the bundle.
    modelled_as: >-
      F06.9 inferred_reason; EP-11.
  - id: "SD-P-4"
    unified: "SD-25"
    class: "gap"
    title: >-
      matches, between the body's signature and the content's, is not defined across entry kinds
    locators:
      - "§4.5 (L860-862)"
    quotes:
      - source_lines: "860-862"
        quote: |-
          If set, clients MUST verify that the signature referenced in the `canonicalized_body` matches the signature provided in the `Bundle.content`.
    requirements:
      - "sigstore-bundle-0-3#R-0067"
      - "sigstore-bundle-0-3#R-0152"
    description: >-
      Where the referenced signature sits in canonicalized_body and how it is encoded there depend
      on the Rekor entry kind, defined outside the source. In the examples a hashedrekord body
      carries the same base64 string as the bundle, and an intoto 0.0.2 body carries the base64 of
      that base64 text, so a string comparison fails on the source's own DSSE example while a
      comparison after decoding matches (E6d, E6e). The examples lane reports the same double
      encoding of the payload.
    consequence: >-
      A verifier comparing strings rejects the DSSE example; one decoding once rejects the
      message-signature example. Each kind needs its own rule and the source gives none.
    modelled_as: >-
      F06.10 note; EP-12.
  - id: "SD-P-5"
    unified: "SD-27"
    class: "gap"
    title: >-
      Whether the certificate's validity window includes its ends is not said, and the source's own
      example signs at its start
    locators:
      - "§1.3 (L155-158)"
      - "§3.7 (L531)"
      - "§3.16 (L661-662)"
      - "§5.1.3.2 (L1088, L1102, L1121)"
    quotes:
      - source_lines: "661-662"
        quote: |-
          The time range is closed and includes both the start and end times, (i.e., [start, end]).
      - source_lines: "531"
        quote: |-
          Optional validity period for this key, *inclusive* of the endpoints.
    requirements:
      - "sigstore-bundle-0-3#R-0085"
    description: >-
      A verifier must check that signing happened while the certificate was valid; the source never
      says whether notBefore and notAfter themselves are inside. Its only interval conventions,
      TimeRange closed at both ends and PublicKey.valid_for inclusive, are for keys and ranges, not
      certificates. The DSSE example's integrated time and genTime both equal the leaf's notBefore
      (E7a, E7b). RFC 5280 (library record rfc-5280), outside this source, makes the period
      inclusive.
    consequence: >-
      A verifier that reads the window as half-open rejects the source's DSSE example. M04 evaluated
      over the five positions of a signing time: no stated transition decides the two ends.
    modelled_as: >-
      M04.T04 (and the evaluation of M04); F06.11 note; EP-13.
  - id: "SD-P-6"
    unified: "SD-13"
    class: "contradiction"
    title: >-
      The DSSE example is introduced as from the public infrastructure but is a mock, and carries
      form (2) in a v0.3 bundle
    locators:
      - "§5.1.3 (L1027)"
      - "§5.1.3.2 (L1079-1137)"
      - "§1.2 (L111-112)"
    quotes:
      - source_lines: "1027"
        quote: |-
          Here are some example bundles from the Sigstore public infrastructure.
      - source_lines: "1085"
        quote: |-
          "x509CertificateChain": {
      - source_lines: "1112"
        quote: |-
          "envelope": "localhost:8000 - 124190645164477
    requirements:
      - "sigstore-bundle-0-3#R-0014"
      - "sigstore-bundle-0-3#R-0013"
    description: >-
      The examples are said to come from the Sigstore public infrastructure. The DSSE example's leaf
      is issued by O=sigstore.mock, CN=sigstore (E7), its log's origin is localhost:8000 (E5), and
      its key material is x509CertificateChain, form (2), in a v0.3 bundle. If it were keyless
      signing on the PGI, form (3) would be required; since it is not, the introduction is wrong for
      it.
    consequence: >-
      A reader who takes the introduction at its word finds a v0.3 PGI bundle breaking
      sigstore-bundle-0-3#R-0014; a verifier that checked sigstore-bundle-0-3#R-0014 by issuer would
      treat this example differently from the description.
    modelled_as: >-
      F05.1 note; EP-04.
  - id: "SD-P-7"
    unified: "SD-28"
    class: "gap"
    title: >-
      Suitable and long-lived are undefined, and several time sources are not ranked
    locators:
      - "§4.5 (L833-837)"
      - "§5.1.1 (L898)"
    quotes:
      - source_lines: "833-835"
        quote: |-
          Optional for >= v0.2 bundles if another suitable source of time is present (such as another source of signed time, or the current system time for long-lived certificates).
    requirements:
      - "sigstore-bundle-0-3#R-0156"
      - "sigstore-bundle-0-3#R-0157"
      - "sigstore-bundle-0-3#R-0158"
      - "sigstore-bundle-0-3#R-0168"
    description: >-
      The promise may be left out of v0.2 and later bundles if some other suitable time source
      exists, with two examples and no definition; long-lived certificates may use the current
      system time, with no threshold. Nothing ranks a timestamp against a verified integrated time
      when both are present, says what happens when one lies inside the window and the other
      outside, or says how many timestamps or entries must verify.
    consequence: >-
      The promise obligation (must or should) and the choice of signing time cannot be computed from
      the source for every bundle. M03's evaluation counts where no transition or several fire.
    modelled_as: >-
      M03 Q1 and Q3; F04.9 note; EP-13; OI-03.
  - id: "SD-P-8"
    unified: "SD-29"
    class: "gap"
    title: >-
      Distrust of the integrated time is tied to omitting the promise, not to failing to verify it
    locators:
      - "§4.5 (L826-827, L836-837)"
    quotes:
      - source_lines: "826-827"
        quote: |-
          The integration time MUST NOT be trusted if inclusion_promise is omitted.
      - source_lines: "837"
        quote: |-
          and SHOULD be verified otherwise.
    requirements:
      - "sigstore-bundle-0-3#R-0062"
      - "sigstore-bundle-0-3#R-0158"
      - "sigstore-bundle-0-3#R-0150"
    description: >-
      Trust in the integrated time is barred when inclusion_promise is omitted, and a present
      promise only should be verified when another time source exists. Read literally, a present
      promise that was not verified leaves the integrated time not distrusted; the source does not
      say it may be used.
    consequence: >-
      M03's Q2, over the 72 inputs with a present, unverified promise: neither the trust transition
      (promise verified) nor the distrust transition (promise omitted) fires.
    modelled_as: >-
      M03.Q2; EP-09; EP-10.
  - id: "SD-P-9"
    unified: "SD-21"
    class: "external dependency"
    title: >-
      The time check is deferred to an unpinned Google Doc
    locators:
      - "§1.3 (L155-159)"
    quotes:
      - source_lines: "159"
        quote: |-
          <https://docs.google.com/document/d/1kbhK2qyPPk8SLavHzYSDM8-Ueul9_oxIMVFuWMWKz0E/edit#heading=h.x8bduppe89ln>
    requirements:
      - "sigstore-bundle-0-3#R-0085"
    description: >-
      The one stated time rule defers its procedure to the Sigstore client spec's section
      Verification using a Bundle, a Google Doc named by URL with no version, date or digest.
    consequence: >-
      The verification procedure for the time check is not part of the pinned source and can change
      without this record seeing it. record.yaml cites it; the library does not hold it.
    modelled_as: >-
      F06.11; out_of_scope.
  - id: "SD-P-10"
    unified: "SD-30"
    class: "gap"
    title: >-
      No trust anchor for timestamps or checkpoints, and no trust root in the protos
    locators:
      - "§1.1 (L59-60)"
      - "§1.2 (L92-93)"
      - "§3.15 (L643-645)"
      - "§4.2 (L730-731)"
    quotes:
      - source_lines: "730-731"
        quote: |-
          The checkpoint MAY contain additional signatures, but the first SHOULD be the signature from the log.
    requirements:
      - "sigstore-bundle-0-3#R-0003"
      - "sigstore-bundle-0-3#R-0137"
      - "sigstore-bundle-0-3#R-0008"
    description: >-
      The imprint check is stated, but nothing says how a timestamp's own signature or authority is
      trusted. The SET's key comes from the log's operators (L787-788); a checkpoint's signature is
      only said to be the log's first, with no key named. The independent root of trust is named by
      example (the PGI's trusted root) and a TUF root of trust as one context of
      X509CertificateChain, but no imported proto defines a trust root.
    consequence: >-
      Three of a verifier's trust decisions rest on material the source neither defines nor points
      to.
    modelled_as: >-
      F01.6 to F01.8; F06.7; EP-08.
  - id: "SD-P-11"
    unified: "SD-31"
    class: "gap"
    title: >-
      Failure outcomes are almost never stated
    locators:
      - "whole source"
    quotes:
      - source_lines: "182-183"
        quote: |-
          During verification a client MUST reject an envelope if the number of signatures is not equal to one.
    requirements:
      - "sigstore-bundle-0-3#R-0090"
      - "sigstore-bundle-0-3#R-0195"
      - "sigstore-bundle-0-3#R-0196"
    description: >-
      Counted over all 1189 lines as whole words: reject once (L182), error, fail, failure and
      invalid 0 times. Every other verifier rule is a must verify, must validate or must not trust
      with no stated consequence; the producer rules on form and chain have no verifier counterpart;
      and no sentence obliges a verifier to check the inclusion proof at all
      (sigstore-bundle-0-3#R-0195 and sigstore-bundle-0-3#R-0196 are inferences).
    consequence: >-
      Of the model's 20 error paths, 5 have a stated outcome (EP-02, EP-07, EP-10, EP-15, EP-18), 8
      an inferred one and 7 none.
    modelled_as: >-
      error_paths basis; F06 on_error.
  - id: "SD-P-12"
    unified: "SD-32"
    class: "tension"
    title: >-
      The key-hint equality makes DSSE's optional keyid mandatory whenever a form (1) hint is set
    locators:
      - "§1.3 (L160-163)"
      - "§2.2 (L260-261)"
    quotes:
      - source_lines: "160-163"
        quote: |-
          If the verification material contains a public key identifier (key hint) and the `content` is a DSSE envelope, the key hints MUST be exactly the same in the verification material and in the DSSE envelope.
      - source_lines: "260-261"
        quote: |-
          *Unauthenticated* hint identifying which public key was used. OPTIONAL.
    requirements:
      - "sigstore-bundle-0-3#R-0086"
      - "sigstore-bundle-0-3#R-0032"
    description: >-
      With a public key identifier and a DSSE envelope the hints must be exactly the same; keyid is
      OPTIONAL in DSSE and, empty, may be omitted from JSON. An envelope without keyid and a form (1)
      bundle whose hint is non-empty breaks the bundle rule while meeting DSSE's; an empty hint agrees.
    consequence: >-
      A producer following DSSE alone can emit a bundle that breaks sigstore-bundle-0-3#R-0086; a
      verifier must decide whether an absent keyid equals a non-empty hint (it does not, under
      exactly the same).
    modelled_as: >-
      F03.5 note; F06.14; EP-16.
open_issues:
  - id: "OI-01"
    locator: "§1.3"
    text: >-
      What makes a payload type expected: the verifier's policy, never described. For the Public
      Instance the docs page fixes application/vnd.in-toto+json.
  - id: "OI-02"
    locator: "§1.2"
    text: >-
      How a verifier knows a bundle is keyless PGI, which the form rules depend on; presumably by
      the leaf chaining to the PGI's Fulcio root, which the source does not say.
  - id: "OI-03"
    locator: "§1.1, §1.2, §4.5"
    text: >-
      How many log entries and timestamps must verify, and whether one that fails fails the bundle
      or is only discarded. Both are repeated fields; no threshold appears. Source defect SD-P-7.
  - id: "OI-04"
    locator: "§4.4, §4.5"
    text: >-
      Which log index the inclusion promise signs. L852-855 names log_index among
      TransparencyLogEntry's fields, the global index; the promise's description says only log index
      (L783). Not checkable here: no log key.
  - id: "OI-05"
    locator: "§4.5"
    text: >-
      What the current system time proves for a long-lived certificate: that the certificate is
      valid at verification, not that the signature was made inside the window, if the key existed
      before the certificate. The source offers it as a suitable time source without saying what it
      shows.
  - id: "OI-06"
    locator: "§5.1.1.1.1"
    text: >-
      The identity policy a verifier applies to the leaf's Fulcio extensions; the client spec's,
      outside this source.
  - id: "OI-07"
    locator: "§1.2"
    text: >-
      The DSSE signature-extension container: DSSE's, outside this source, and absent from the
      envelope.proto this source copies.
  - id: "OI-08"
    locator: "whole source"
    text: >-
      Revocation of a leaf or an intermediate: never mentioned (revoke, revoked and revocation occur
      0 times).
