roles:
  - name: "signer"
    locator: "§1.1, §1.2, §5"
    definition: >-
      Holds the signing key, signs the artifact (message signature) or the DSSE PAE, obtains the log
      entry and timestamps for that signature, and assembles the bundle. The source never separates
      the signer from whoever assembles the bundle: its Signers put certificates in bundles (L91),
      the RFC 3161 timestamps are provided by the user (L56), and the docs page speaks of signatures
      generated by tooling (L884-885). This model reads all three as one role.
    kind: "stated"
    quotes:
      - source_lines: "91"
        quote: |-
          Signers MUST NOT include root CA certificates in bundles
      - source_lines: "56"
        quote: |-
          A list of RFC3161 signed timestamps provided by the user.
      - source_lines: "884-885"
        quote: |-
          Sigstore signatures generated by tooling working in the context of the Sigstore Public Instance
  - name: "fulcio"
    locator: "§1.2, §5.1.1, §5.1.1.1.1"
    definition: >-
      The certificate authority of keyless signing on the Public Good Instance: issues the
      short-lived X.509 leaf that conveys the signing key and carries identity extensions
      (L904-905). The source names it and describes what it yields, never the issuance exchange (F01
      steps 4 and 5 are inferred).
    kind: "stated"
    quotes:
      - source_lines: "104-105"
        quote: |-
          When used with the Public Good Instance (PGI) of Sigstore for "keyless" signing via Fulcio
      - source_lines: "898"
        quote: |-
          When using short lived Fulcio certificates where verification may occur after the certificate has expired
  - name: "transparency-log"
    locator: "§4.3, §4.4, §4.5"
    definition: >-
      Rekor: appends an entry for the signature, signs the inclusion promise (SET) over the entry,
      its log ID, index and integrated time, and returns the fields a TransparencyLogEntry is built
      from, the inclusion proof and its checkpoint among them. Its public key, and any hash function
      or signature scheme the key needs, reach verifiers out of band from the log's operators
      (L786-788).
    kind: "stated"
    quotes:
      - source_lines: "746"
        quote: |-
          InclusionProof is the proof returned from the transparency log.
      - source_lines: "781"
        quote: |-
          The inclusion promise is calculated by Rekor.
      - source_lines: "802"
        quote: |-
          This type can easily be created from the existing response from Rekor.
  - name: "timestamp-authority"
    locator: "§1.1, §3.6"
    definition: >-
      Issues the RFC 3161 timestamps a bundle carries: counter signatures over the bundle's
      signature, each a DER TimeStampResponse.
    kind: "inferred"
    inferred_reason: >-
      The source names RFC 3161 timestamps and the TimeStampResponse but never the authority that
      issues them; RFC 3161 (outside this source) calls it a TSA. Who requests a timestamp is the
      user of L56, read here as the signer.
    quotes:
      - source_lines: "50-51"
        quote: |-
          Various timestamped counter signatures over the artifacts signature. Currently only RFC3161 signatures are provided.
      - source_lines: "511"
        quote: |-
          Signed timestamp is the DER encoded TimeStampResponse.
  - name: "verifier"
    locator: "§1.1, §1.2, §1.3, §3.4, §4.2, §4.3, §4.5, §5.1.2.1"
    definition: >-
      Checks a bundle and the signature it carries. The source says verifier (L155, L852), Verifiers
      (L95, L96, L129, L172), client and clients (L59, L127, L147, L182, L475, L729, L768, L860,
      L863) and Client verification libraries (L125); this model makes them one role, since no
      sentence gives two of them different duties over the same bundle.
    kind: "stated"
    quotes:
      - source_lines: "125"
        quote: |-
          Client verification libraries MAY provide an option to support v0.1
      - source_lines: "182-183"
        quote: |-
          During verification a client MUST reject an envelope if the number of signatures is not equal to one.
      - source_lines: "852-853"
        quote: |-
          The verifier is responsible for combining
  - name: "trust-material"
    locator: "§1.2, §3.4, §3.8, §3.15, §4.4"
    definition: >-
      What a verifier holds independently of any bundle: the CA certificates it trusts (an
      independent root of trust, such as the PGI's trusted root), signers' public keys delivered out
      of band (a keyring), and each log's public key and algorithm parameters from the log's
      operators. A source of material, not a party: it sends nothing and has no duties.
    kind: "inferred"
    inferred_reason: >-
      The source names an independent root of trust (L92-93), a keyring (L85), out-of-band delivery
      of keys (L487, L539-540) and of the log's key (L787-788), and a TUF root of trust as one
      context of X509CertificateChain (L643-644), but defines no party, message or format for any of
      them: no imported proto defines a trust root. Modelled as a passive participant so that the
      out-of-band hand-offs can be drawn.
    quotes:
      - source_lines: "92-93"
        quote: |-
          an independent root of trust (such as the Public Good Instance's trusted root).
      - source_lines: "84-85"
        quote: |-
          for retrieving a key from an out-of-band mechanism (such as a keyring)
      - source_lines: "787-788"
        quote: |-
          retrieved out-of-band from the log's operators, together with the public key.
      - source_lines: "643-644"
        quote: |-
          providing a root CA certificate within a TUF root of trust
flows:
  - id: "F01"
    name: "establish-key-material"
    title: "Establishing the signing key and what a verifier trusts"
    locator: "§1.2, §3.2, §3.4, §3.8, §4.4, §5.1.1, §5.1.1.1"
    kind_of_flow: "setup, out of band"
    participants:
      - "signer"
      - "fulcio"
      - "trust-material"
      - "verifier"
    summary: >-
      The signer either keeps a self-managed key, whose public key and algorithm reach verifiers out
      of band and which a bundle names only by an unauthenticated hint, or signs keyless on the
      Public Good Instance with a short-lived Fulcio leaf certificate that conveys the signing key.
      Independently, the verifier holds the CA certificates it trusts, the log's public key and
      algorithm parameters, and, for a self-managed key, the signer's public key. What it needs to
      trust an RFC 3161 timestamp is never said.
    order_note: >-
      The source orders nothing here. Setup precedes signing only because a bundle names its key
      material (F05.1). Steps 2-3 (self-managed) and 4-5 (keyless) are alternatives; steps 6-9 are
      the verifier's and may happen at any time before F06.
    steps:
      - n: "1"
        from: "signer"
        to: "signer"
        message: "none"
        object: "signing key pair"
        action: >-
          Hold a signing key pair. The deprecated and single-use schemes restrict which key types
          and how often a key may sign; nothing else about generating, storing or protecting a key
          is said.
        locator: "§1.2, §3.2"
        kind: "inferred"
        inferred_reason: >-
          Every key-material form conveys or names a signing key (L82-112), but the source never
          says how a key comes to exist. The PublicKeyDetails rules cited bind wherever that enum is
          used; it is not reachable from Bundle (§3.2).
        constrained_by:
          - "sigstore-bundle-0-3#R-0035"
          - "sigstore-bundle-0-3#R-0036"
          - "sigstore-bundle-0-3#R-0102"
          - "sigstore-bundle-0-3#R-0100"
          - "sigstore-bundle-0-3#R-0101"
          - "sigstore-bundle-0-3#R-0104"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "signer"
        to: "trust-material"
        message: "PublicKeyIdentifier"
        field: "hint"
        object: "public key, delivered out of band"
        action: >-
          Self-managed key: deliver the public key to verifiers out of band, with the signature
          algorithm as part of the key, and agree with them the format of the hint that will name
          it. The key itself is never embedded in a bundle.
        guard: "self-managed key"
        locator: "§1.2, §3.4, §3.8, §5.1.1.1.2"
        kind: "stated"
        note: >-
          The out-of-band rule (L486-487) is written in MessageSignature's comment; for a DSSE
          envelope signed with a self-managed key the source says nothing, and the model applies it
          to both contents.
        constrained_by:
          - "sigstore-bundle-0-3#R-0114"
          - "sigstore-bundle-0-3#R-0115"
          - "sigstore-bundle-0-3#R-0122"
          - "sigstore-bundle-0-3#R-0171"
          - "sigstore-bundle-0-3#R-0172"
          - "sigstore-bundle-0-3#R-0120"
          - "sigstore-bundle-0-3#R-0012"
        on_error: "unspecified by source: no channel, format or failure is defined"
        on_error_basis: "unspecified"
      - n: "3"
        from: "signer"
        to: "signer"
        message: "PublicKeyIdentifier"
        field: "hint"
        action: >-
          Choose the hint value: optional, unauthenticated, and RECOMMENDED to be derived from the
          public key as RFC 6962 derives a log's key ID (that derivation is outside this source).
        guard: "self-managed key"
        locator: "§3.8"
        kind: "stated"
        constrained_by:
          - "sigstore-bundle-0-3#R-0123"
          - "sigstore-bundle-0-3#R-0121"
        on_error: "none: a recommendation; a hint derived otherwise breaks nothing stated"
        on_error_basis: "none"
      - n: "4"
        from: "signer"
        to: "fulcio"
        message: "none"
        object: "certificate request (outside this source)"
        action: >-
          Keyless on the PGI: ask Fulcio for a certificate for the signing key. What the signer
          sends and how it proves its identity are not described.
        guard: "keyless signing on the Public Good Instance"
        locator: "§1.2"
        kind: "inferred"
        inferred_reason: >-
          The source names keyless signing via Fulcio (L104-105) and short-lived Fulcio certificates
          (L898) but never the issuance exchange; this hand-off is the model's.
        constrained_by:
          - "sigstore-bundle-0-3#R-0011"
        on_error: "unspecified by source (Fulcio's protocol, outside)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "fulcio"
        to: "signer"
        message: "X509Certificate"
        field: "raw_bytes"
        action: >-
          Fulcio returns a short-lived leaf certificate that conveys the signing key and carries
          extensions for the identities a verifier consumes. In both examples the leaf is valid for
          600 seconds (E7).
        guard: "keyless signing on the Public Good Instance"
        locator: "§5.1.1, §5.1.1.1.1"
        kind: "inferred"
        inferred_reason: >-
          What the certificate holds (L904-905) and that it is short-lived (L898) are stated; that
          Fulcio hands it to the signer is the model's reading of the unstated exchange.
        evidence:
          - "E7"
        constrained_by:
          - "sigstore-bundle-0-3#R-0169"
          - "sigstore-bundle-0-3#R-0168"
        on_error: "unspecified by source (Fulcio's protocol, outside)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "trust-material"
        to: "verifier"
        message: "none"
        object: "trusted root (outside this source)"
        action: >-
          Hold, independently of any bundle, the CA certificates the verifier trusts: an independent
          root of trust such as the PGI's trusted root.
        locator: "§1.2, §3.15"
