              providing a root CA certificate within a TUF root of trust
        constrained_by:
          - "sigstore-bundle-0-3#R-0008"
          - "sigstore-bundle-0-3#R-0077"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "7"
        from: "trust-material"
        to: "verifier"
        message: "LogId"
        field: "key_id"
        object: "log public key"
        action: >-
          Hold each log's public key, with the hash function and signature scheme the key needs,
          obtained out of band from the log's operators; a log is known by its key (log_id).
        locator: "§3.5, §4.4"
        kind: "stated"
        note: >-
          Stated for the inclusion promise's signature. Which key verifies a checkpoint's signature
          is not said; the first signature of a checkpoint should be the log's (L731).
        constrained_by:
