applicability: >-
  APPLICABLE. The bundle is a data format, but its comments assign duties to named roles and imply
  an end-to-end model: a signer obtains key material, signs, has the signature logged and
  timestamped, and assembles a bundle; a verifier later checks it against trust material it holds
  independently. Counted over the 1189 lines as whole words, case-insensitively, by script:
  exchange, request, send, receive, server, party, role, error, fail, failure, invalid, step and
  steps occur 0 times; reject once (L182); response 3 times, each Rekor's (L802 the entry built from
  it, L806 the promise's name in it, L850 its body field); protocol twice (L174-175), deferring to
  the DSSE protocol. The verifier's duties are stated under five names (verifier, Verifiers, client,
  clients, Client verification libraries); the signer is the subject of one obligation (L91), most
  producer rules being passive; the log's and the checkpoint's contents are stated in the rekor
  proto. Eight flows model it: F01 key material, F02 and F03 production of the two contents, F04 the
  log and the timestamps, F05 assembly, F06 verification, F07 the v0.1 path and F08 the DSSE
  signature extension. Where the source defers (the client spec for the time check, the DSSE
  protocol, Rekor, RFC 3161, the trust root), the step is opaque and the deferral named. The
  examples were exercised by script (evidence) to settle what is signed and what the proofs cover.
