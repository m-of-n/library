    locator: "§4.2 (L733-736), §4.3 (L744-777)"
  - text: >-
      RFC 3161: the request, the response's signature and the authority's trust.
    locator: "§1.1 (L50-62), §3.6 (L505-516)"
  - text: >-
      RFC 6962's key-ID derivation for the hint, and its Signed Certificate Timestamp, to which the
      promise is compared.
    locator: "§3.8 (L550-552), §4.5 (L805-807)"
  - text: >-
      Fulcio: certificate issuance and its OID extensions (library record sigstore-fulcio-oids).
    locator: "§1.2 (L104-105), §3.13 (L610-612), §5.1.1.1.1 (L904)"
  - text: >-
      The trusted root: the PGI's trusted root and the TUF root of trust are named, not defined.
    locator: "§1.2 (L92-93), §3.15 (L643-645)"
  - text: >-
      X.509 path validation (RFC 5280; library record rfc-5280), including revocation, which the
      source never mentions.
    locator: "§1.2 (L95-99)"
  - text: >-
      The in-toto Statement in a DSSE payload (library records in-toto-envelope-v1 and
