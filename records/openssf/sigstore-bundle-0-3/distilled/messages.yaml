source_silences:
  - what: "format of PublicKeyIdentifier.hint"
    locator: "§3.8"
    evidence:
      source_lines: "545"
      quote: "The format of the hint must be agreed upon out of band by the"
    note: "deliberately unspecified; RECOMMENDED (R-0043) to derive it from the key as in RFC 6962 section 3.2"
  - what: "schema of TransparencyLogEntry.canonicalized_body"
    locator: "§4.5"
    evidence:
      source_lines: "849"
      quote: "The contents of this field are the same as the `body` field in"
    note: "same as Rekor's `body`; the per-kind schema is Rekor's (hashedrekord 0.0.1 and intoto 0.0.2 are decoded in examples/)"
  - what: "values of KindVersion.kind and .version"
    locator: "§4.1"
    evidence:
      source_lines: "715"
      quote: "See here for a list: https://github.com/sigstore/rekor/tree/main/pkg/types"
    note: "an external list; the schema accepts any string"
  - what: "unit and epoch of integrated_time"
    locator: "§4.5"
    evidence:
      source_lines: "825"
      quote: "The UNIX timestamp from the log when the entry was persisted."
    note: "a UNIX timestamp; the examples are seconds"
  - what: "payload of the inclusion promise (SET)"
    locator: "§4.4"
    evidence:
      source_lines: "782"
      quote: "signature over a canonical JSON serialization of the persisted entry, the"
    note: "the exact bytes are a Rekor link, not here"
  - what: "relation of TransparencyLogEntry.log_index to InclusionProof.log_index"
    locator: "§4.3, §4.5"
    evidence:
      source_lines: "811"
      quote: "The global index of the entry, used when querying the log by index."
    note: "'global index' vs 'index in the tree it was written to'; the examples show different numbers"
  - what: "whether unknown JSON members are accepted"
    locator: "§1.3"
    evidence:
      source_lines: "189"
      quote: "Reserved for future additions of artifact types."
    note: "Bundle reserves numbers 5 to 50; the policy for unknown members is not stated"
  - what: "what the DSSE extension container looks like"
    locator: "§1.2"
    evidence:
      source_lines: "70"
      quote: "extension. Specifically, the `ext` field of the extension will expect this"
    note: "no `extensions` field in the embedded envelope.proto"
  - what: "behaviour of REQUIRED for a field at its proto3 default value"
    locator: "§4.3"
    evidence:
      source_lines: "770"
      quote: "repeated bytes hashes = 4 [(google.api.field_behavior) = REQUIRED];"
    note: "see schema/README.md: both readings recorded; source defect SD-8 in normative.md"
  - what: "how the intoto entry body's content.hash is computed"
    locator: "§4.5"
    evidence:
      source_lines: "1099"
      quote: "\"kind\": \"intoto\","
    note: "Rekor's, not stated here. Reproduced by the verify pass (examples/reproduce.py): SHA-256 of the sorted, compact JSON of the bundle's envelope with the certificate PEM beside the signature and the empty keyid left out. Pass 1 had listed this as source defect SD-S-10 (not recomputable); withdrawn."
source_defects_note: "SD-S-n are this lane's; the verify pass unified them with the other lanes' lists in normative.md (Source defects): unified names the SD-n there. SD-S-10 was withdrawn (see source_silences)."
source_defects:
  - id: "SD-S-1"
    unified: "SD-23"
    where: "docs 5.1.1.2 example (bundle.md L66-97)"
    evidence:
      source_lines: "942"
      quote: "\"keyId\": \"<KEY_ID>\","
    what: "trailing commas (also after the entry object): not JSON; fixture 3 does not parse (examples/fixtures.derived.json)"
  - id: "SD-S-2"
    unified: "SD-23"
    where: "docs 5.1.1.3 example (bundle.md L105-113)"
    evidence:
      source_lines: "981"
      quote: "},"
    what: "trailing comma after the timestamp object (L981, before the closing bracket): not JSON"
  - id: "SD-S-3"
    unified: "SD-23"
    where: "docs 5.1.2.2 example (bundle.md L142-151)"
    evidence:
      source_lines: "1013"
      quote: "\"dsseEnvelope\": {"
    what: "`\"dsseEnvelope\": { {` opens an object without a key: not JSON even wrapped"
  - id: "SD-S-4"
    unified: "SD-14"
    where: "docs 5.1.1.2 placeholder"
    evidence:
      source_lines: "945"
      quote: "\"kind\": \"(hashrekord | dsse)\","
    what: "`hashrekord` is misspelled (the example says hashedrekord) and `dsse` is not the kind the DSSE example uses (intoto)"
  - id: "SD-S-5"
    unified: "SD-24"
    where: "docs 5.1.2.1 prose"
    evidence:
      source_lines: "995"
      quote: "`message_digest` for informational purposes, but it must be provided or computed from a provided"
    what: "names the field message_digest (the original name) while the JSON on the same page uses messageDigest"
  - id: "SD-S-6"
    unified: "SD-9"
    where: "sigstore_bundle.proto VerificationMaterial vs TransparencyLogEntry"
    evidence:
      source_lines: "845"
      quote: "InclusionProof inclusion_proof = 6 [(google.api.field_behavior) = REQUIRED];"
    what: "inclusion_proof is REQUIRED, while the same message set allows v0.1 bundles that carry a promise and no proof (R-0018, R-0019): the schema follows REQUIRED and so rejects such bundles"
  - id: "SD-S-7"
    unified: "SD-11"
    where: "Bundle.dsse_envelope comment vs docs 5.1.2.2"
    evidence:
      source_lines: "171"
      quote: "A DSSE envelope can contain arbitrary payloads."
    what: "the proto allows arbitrary payload types (verifiers check the type is expected); the docs page fixes payloadType to application/vnd.in-toto+json: the schema accepts any string and offers DsseEnvelopeInToto"
  - id: "SD-S-8"
    unified: "SD-3"
    where: "Bundle.media_type comment"
    evidence:
      source_lines: "151"
      quote: "* application/vnd.dev.sigstore.bundle+json;version=0.3"
    what: "version 0.3 has two media-type spellings, the MUST form and this legacy form; both are listed as accepted, only one may be emitted (R-0021)"
  - id: "SD-S-9"
    unified: "SD-1"
    where: "typos in the source"
    evidence:
      source_lines: "145"
      quote: "MUST be application/vnd.dev.sigstore.bundle.v0.3+json when"
    what: "`when when` (L146), `Clients must to be able` (L147), `ceritificate` (docs L62-63 and L102), `arifact` (docs L123), `determinisitically` (L857), `the the` (L336): wording only; the lowercase must in L147 is a requirement the skeleton could not count, R-0081 (from candidate C-0012)"
