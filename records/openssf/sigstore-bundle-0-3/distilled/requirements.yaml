requirements:
  - id: 'sigstore-bundle-0-3#R-0001'
    locator: '§1'
    source_lines: '42-43'
    text: 'The primary message (''Bundle'') MUST be versioned, by populating the ''media_type'' field.'
    verb: 'MUST'
    kind: stated
    actor: 'bundle producer (attributed: the sentence is passive)'
    object: 'Bundle'
    field: 'Bundle.media_type'
    testable: 'yes'
    note: 'A file-level note above the messages (Notes on versioning, L41); the primary message is Bundle. Versioned means populated: an absent or empty media_type breaks it. The value for v0.3 in JSON is R-0021; the values clients accept are R-0082 to R-0084. media_type carries no field_behavior annotation although this sentence makes it mandatory (SD-R-5).'
  - id: 'sigstore-bundle-0-3#R-0002'
    locator: '§1'
    source_lines: '43-44'
    text: 'Semver-ish (only major/minor versions) scheme MUST be used.'
    verb: 'MUST'
    kind: stated
    actor: 'schema maintainers, who number the versions; producers carry the number in media_type (attributed: passive)'
    object: 'bundle version numbering'
    field: 'Bundle.media_type: the version it names'
    testable: 'partial'
    testable_reason: 'that a version has only a major and a minor number is checkable on every media type the source names (v0.3; version=0.1 to 0.3); semver-ish is not defined further, so what else the scheme implies (ordering, compatibility between minors) is not testable from the source.'
    note: 'This file''s version is 0.3 (R-0069). The docs page labels itself Version 0.3.2 (L882), three components (SD-R-6).'
  - id: 'sigstore-bundle-0-3#R-0003'
    locator: '§1.1'
    source_lines: '59-60'
    text: 'Clients MUST verify the hashed message in the message imprint against the signature in the bundle.'
    verb: 'MUST'
    kind: stated
    actor: 'client (verifier)'
    object: 'RFC 3161 timestamp (the message imprint of its TimeStampToken)'
    field: 'Bundle.verification_material.timestamp_verification_data.rfc3161_timestamps[].signed_timestamp'
    testable: 'yes'
    note: 'The imprint (RFC 3161 section 2.4.1, outside this source) is a hash of the timestamped data, which here is the bundle''s signature (R-0070): MessageSignature.signature, or the one sig of a DSSE envelope. Which bytes and which hash are not said: R-0190. Negative vector: a timestamp whose imprint hashes other bytes.'
  - id: 'sigstore-bundle-0-3#R-0004'
    locator: '§1.2'
    source_lines: '74-76'
    text: 'When used as a DSSE extension, if the `public_key` field is used to indicate the key identifier, it MUST match the `keyid` field of the signature the extension is attached to.'
    verb: 'MUST'
    kind: stated
    actor: 'producer of the DSSE signature extension (attributed: the subject is the field)'
    object: 'VerificationMaterial embedded as a DSSE signature extension (outside a bundle)'
    field: 'VerificationMaterial.public_key.hint, and the keyid of the DSSE signature carrying the extension'
    testable: 'yes'
    note: 'Condition: VerificationMaterial used as a DSSE extension, and form (1). match is not defined; read as equal strings. The envelope.proto copied here gives Signature no extension field, so this case cannot occur inside a bundle (SD-R-7). The in-bundle counterpart is R-0086.'
  - id: 'sigstore-bundle-0-3#R-0005'
    locator: '§1.2'
    source_lines: '87-88'
    text: '2. A sequence of one or more X.509 certificates, of which the first member MUST be a leaf certificate conveying the signing key.'
    verb: 'MUST'
    kind: stated
    actor: 'bundle producer (signer; attributed: the item has no subject)'
    object: 'VerificationMaterial, form (2)'
    field: 'Bundle.verification_material.x509_certificate_chain.certificates[0]'
    testable: 'yes'
    note: 'Defines form (2) and binds its first member. One or more: an empty certificates list is not form (2), though X509CertificateChain.certificates carries no annotation (L655; R-0128). Leaf is not defined; read as an end-entity, non-CA certificate whose public key verifies the bundle''s signature. The rest of the order: R-0006.'
  - id: 'sigstore-bundle-0-3#R-0006'
    locator: '§1.2'
    source_lines: '88-89'
    text: 'Subsequent members SHOULD be in issuing order, meaning that `n + 1` should be an issuer for `n`.'
    verb: 'SHOULD'
    kind: stated
    actor: 'bundle producer (signer; attributed: passive)'
    object: 'VerificationMaterial, form (2)'
    field: 'Bundle.verification_material.x509_certificate_chain.certificates[1..]'
    testable: 'yes'
    note: 'certificates[n+1] issued certificates[n]: checkable by issuer name and signature. The lowercase should restates the SHOULD. X509CertificateChain says this context imposes an order (R-0129).'
  - id: 'sigstore-bundle-0-3#R-0007'
    locator: '§1.2'
    source_lines: '91-93'
    text: 'Signers MUST NOT include root CA certificates in bundles, and SHOULD NOT include intermediate CA certificates that appear in an independent root of trust (such as the Public Good Instance''s trusted root).'
    verb: 'MUST NOT'
    kind: stated
    actor: 'signer'
    object: 'VerificationMaterial, form (2)'
    field: 'Bundle.verification_material.x509_certificate_chain.certificates'
    testable: 'partial'
    testable_reason: 'split: R-0076 (yes) and R-0077 (partial).'
    split_into:
      - 'sigstore-bundle-0-3#R-0076'
      - 'sigstore-bundle-0-3#R-0077'
    note: 'Two keywords in one sentence; split.'
  - id: 'sigstore-bundle-0-3#R-0008'
    locator: '§1.2'
    source_lines: '95-96'
    text: 'Verifiers MUST validate the chain carefully to ensure that it chains up to a CA certificate that they independently trust.'
    verb: 'MUST'
    kind: stated
    actor: 'verifier'
    object: 'VerificationMaterial, form (2)'
    field: 'Bundle.verification_material.x509_certificate_chain'
    testable: 'yes'
    note: 'The bundle''s certificates are untrusted material; trust comes from a CA certificate the verifier holds independently (for the PGI, its trusted root, outside this source). carefully is not defined, and path validation (RFC 5280) is outside this source. Written under form (2); for form (3) the same duty is inferred (R-0194). Negative vector: a chain ending in a CA the verifier does not hold.'
  - id: 'sigstore-bundle-0-3#R-0009'
    locator: '§1.2'
    source_lines: '96-99'
    text: 'Verifiers SHOULD handle old or non-complying bundles that have superfluous intermediate and/or root CA certificates by either ignoring them or explicitly considering them untrusted for the purposes of chain building.'
    verb: 'SHOULD'
    kind: stated
    actor: 'verifier'
    object: 'VerificationMaterial, form (2), of a bundle that breaks R-0076 or R-0077'
    field: 'Bundle.verification_material.x509_certificate_chain.certificates: superfluous intermediate or root CA certificates'
    testable: 'partial'
    testable_reason: 'observable with a chain carrying a root CA certificate the verifier does not trust: trust must not be anchored in it; ignoring it and treating it as untrusted both conform.'
    note: 'Tolerance, not rejection: no rule tells a verifier to reject a bundle that carries them.'
  - id: 'sigstore-bundle-0-3#R-0010'
    locator: '§1.2'
    source_lines: '101-102'
    text: '3. A single X.509 certificate, which MUST be a leaf certificate conveying the signing key.'
    verb: 'MUST'
    kind: stated
    actor: 'bundle producer (signer; attributed: the item has no subject)'
    object: 'VerificationMaterial, form (3)'
    field: 'Bundle.verification_material.certificate'
    testable: 'yes'
    note: 'Defines form (3). The docs page describes the same form (R-0169) and calls it the recommended type for the public infrastructure (R-0170).'
  - id: 'sigstore-bundle-0-3#R-0011'
    locator: '§1.2'
    source_lines: '104-105'
    text: 'When used with the Public Good Instance (PGI) of Sigstore for "keyless" signing via Fulcio, form (1) MUST NOT be used, regardless of bundle version.'
    verb: 'MUST NOT'
    kind: stated
    actor: 'bundle producer (signer using the PGI; attributed: passive)'
    object: 'VerificationMaterial'
    field: 'Bundle.verification_material.public_key (form 1)'
    testable: 'partial'
    testable_reason: 'nothing in a form (1) bundle marks it as PGI keyless signing; given that context, the absence of public_key is checkable.'
    note: 'keyless is quoted and not defined; read as signing with a short-lived Fulcio certificate (record sigstore-fulcio-oids). In effect a keyless signature ships its certificate. regardless of bundle version: 0.1 to 0.3.'
  - id: 'sigstore-bundle-0-3#R-0012'
    locator: '§1.2'
    source_lines: '105-106'
    text: 'Form (1) MAY be used with the PGI for self-managed keys.'
    verb: 'MAY'
    kind: stated
    actor: 'bundle producer (signer with a self-managed key)'
    object: 'VerificationMaterial'
    field: 'Bundle.verification_material.public_key (form 1)'
    testable: 'no'
    testable_reason: 'a permission: with a self-managed key, form (1) and the other forms all conform.'
    note: 'self-managed is not defined; read as a key the signer holds itself, used with the PGI''s log or timestamping. Outside the PGI no rule restricts form (1).'
  - id: 'sigstore-bundle-0-3#R-0013'
    locator: '§1.2'
    source_lines: '108-109'
    text: 'When used in a `0.1` or `0.2` bundle with the PGI and "keyless" signing, form (2) MUST be used.'
    verb: 'MUST'
    kind: stated
    actor: 'bundle producer (signer using the PGI; attributed: passive)'
    object: 'VerificationMaterial of a v0.1 or v0.2 bundle'
    field: 'Bundle.verification_material.x509_certificate_chain (form 2)'
    testable: 'partial'
    testable_reason: 'the bundle version is read from media_type (R-0082, R-0083); that the signing was PGI keyless needs context outside the bundle (a Fulcio-issued leaf is evidence of it).'
    note: 'No rule tells a verifier to reject a v0.1 or v0.2 PGI keyless bundle in another form.'
  - id: 'sigstore-bundle-0-3#R-0014'
    locator: '§1.2'
    source_lines: '111-112'
    text: 'When used in a `0.3` bundle with the PGI and "keyless" signing, form (3) MUST be used.'
    verb: 'MUST'
    kind: stated
    actor: 'bundle producer (signer using the PGI; attributed: passive)'
    object: 'VerificationMaterial of a v0.3 bundle'
    field: 'Bundle.verification_material.certificate (form 3)'
    testable: 'partial'
    testable_reason: 'as R-0013: the version is in media_type, under either spelling of v0.3; the PGI keyless context is outside the bundle.'
    note: 'The docs page calls form (3) recommended (R-0170), a weaker word (SD-R-12). The page''s DSSE example is a v0.3 bundle in form (2) and its certificate names a mock instance, not the PGI (SD-R-13). No rule tells a verifier to reject a v0.3 PGI keyless bundle in form (2).'
