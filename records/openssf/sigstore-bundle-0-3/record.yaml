  note: "Digest is of protos/sigstore_bundle.proto at sigstore/protobuf-specs tag v0.5.2 (commit 0342fe5, 2026-08-21, 'Prepare for 0.5.2 release'); the file is byte-identical at main 21a37e0 (2026-11-18) and last changed at 134d573 (2025-01-15, 'Fix typos in documentation of Bundle type'), which is the date recorded. Pinned at the release tag rather than main because main also carries protos/sigstore_bundle_v2.proto, a draft added 2026-10-26 (#898) and marked unstable on 2026-11-18 (#968); it is not this record. The extraction reads distilled/render-source.py's rendering, which splices four more files, each pinned here by sha256: the three Sigstore files the bundle imports, at the same commit, protos/envelope.proto (fb429d70...a2d9eba1828454e; the DSSE envelope, itself a copy of secure-systems-lab/dsse envelope.proto at 9c81347), protos/sigstore_common.proto (b64c874f...dd973a83f) and protos/sigstore_rekor.proto (6c882036...20786d04eb1b8); and the human-facing page docs.sigstore.dev/about/bundle/, from sigstore/docs content/en/about/bundle.md at main 8aed8c1 (2026-11-18; file last changed aabcc19, 2026-08-25), sha256 8d112700...dd4746df0, which states 'Version 0.3.2' and 'Last updated January 14, 2025' and carries the two real example bundles. The page is pinned as Markdown at a commit, not as docs-site HTML, whose digest drifts on every site rebuild (library#136). The google/api field_behavior and google/protobuf timestamp imports are Google's and are not spliced. Maturity unset: a versioned project specification with no ratification step that maps to RFC 2026."
