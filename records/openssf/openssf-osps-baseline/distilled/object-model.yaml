schema: "library-object-model/v1"
record: openssf-osps-baseline
reviewed_by: ""
note: "Object-model pass: re-read of the catalog YAML, lexicon, Gemara schema and the published page with one question — which entity types and relationship edges does OSPS assume or define? Locators: OSPS-XX.yaml <id> = control/AR text; lexicon = baseline/lexicon.yaml term; gemara = schema/gemara-v1.2.0/*.cue; meta = baseline/metadata.yaml. tmodel_mapping names ARCH-0001 v0.2.0 classes or DL-0009 proposed objects (R-040..R-044); 'new' = tmodel has nothing equivalent."
objects:
  # ---- the catalog layer (what OSPS *is*)
  - name: ControlCatalog
    definition: "The Baseline itself: a versioned, dated set of controls with metadata, groups and applicability groups (Gemara Layer 2)."
    attributes: ["id", "title", "description", "gemara-version", "draft", "author", "version (calendar YYYY-MM-DD)"]
    locator: "meta; gemara controlcatalog.cue #ControlCatalog; docs/maintenance.md"
    kind: stated
    tmodel_mapping: "library record (Standard/Spec) — the document a Requirement is published_by; DL-0009 R-044 source spec"
    notes: ""
  - name: ControlFamily
    definition: "Group of controls by category: Access Control, Build and Release, Documentation, Governance, Legal, Quality, Security Assessment, Vulnerability Management."
    attributes: ["id (AC|BR|DO|GV|LE|QA|SA|VM)", "title", "description"]
    locator: "OSPS-XX.yaml groups[]; gemara #Group"
    kind: stated
    tmodel_mapping: "new (Requirement grouping / facet); closest is MAP-0001 row categories"
    notes: "Families are topical, not lifecycle-ordered; mapping to the canonical phase line is ours (requirements.yaml phase)."
  - name: Control
    definition: "A safeguard with a title and an objective ('a unified statement of intent'), owning >=1 assessment requirements."
    attributes: ["id OSPS-XX-NN", "title", "objective", "group", "state", "replaced-by"]
    locator: "gemara #Control; OSPS-*.yaml controls[]"
    kind: stated
    tmodel_mapping: "Requirement (DL-0009 R-042/R-044) at the 'objective' grain; also a generic Mitigation (catalog layer, ARCH-0001 §1.3) when read as a countermeasure"
    notes: "41 controls. The mapping grain: all external mappings attach here, not to ARs."
  - name: AssessmentRequirement
    definition: "'a tightly scoped, verifiable condition that must be satisfied and confirmed by an evaluator'; text is a MUST condition."
    attributes: ["id OSPS-XX-NN.MM", "text", "applicability (maturity levels)", "recommendation", "state", "replaced-by"]
    locator: "gemara #AssessmentRequirement; OSPS-*.yaml assessment-requirements[]"
    kind: stated
    tmodel_mapping: "Requirement (DL-0009 R-042) at the testable grain — the unit a conformance check evaluates"
    notes: "64 active + 1 retired. Each is written trigger-first ('When <event>, <subject> MUST ...'), i.e. an event-condition-obligation rule."
  - name: Recommendation
    definition: "'non-binding suggestions to aid in evaluation or enforcement of the requirement'."
    attributes: ["text"]
    locator: "gemara #AssessmentRequirement.recommendation"
    kind: stated
    tmodel_mapping: "MitigationInstance implementation guidance (ARCH-0001 §5) — candidate default 'how' text"
    notes: "Carries the only two BCP 14 permissions (MAY) in the source."
  - name: MaturityLevel
    definition: "Applicability group: Level 1 any project; Level 2 code project with >=2 maintainers and a small number of consistent users; Level 3 code project with a large number of consistent users."
    attributes: ["id maturity-N", "title", "description"]
    locator: "meta applicability-groups; gemara #Metadata.applicability-groups"
    kind: stated
    tmodel_mapping: "new — a conformance profile/target level; nearest is DL-0009 Gate exit-criteria set (R-041)"
    notes: "Defined by project profile, not by score."
  - name: LifecycleState
    definition: "Active | Draft | Deprecated | Retired on controls and ARs."
    attributes: ["value"]
    locator: "gemara collections.cue #Lifecycle"
    kind: stated
    tmodel_mapping: "Requirement version/status (R-044) — tmodel's Requirement needs a lifecycle like this"
    notes: ""
  - name: MappingDocument
    definition: "A crosswalk from the Baseline (entry-type Control) to one external framework (entry-type Guideline)."
    attributes: ["id", "title", "source-reference", "target-reference", "mappings[]", "remarks"]
    locator: "gemara mappingdocument.cue; baseline/mappings/osps-to-*.yaml"
    kind: stated
    tmodel_mapping: "MAP-0001 crosswalk (R-044) — directly reusable as maps_to edges"
    notes: "14 documents, 378 mappings, 1177 target entries."
  - name: Mapping
    definition: "One relationship from an OSPS control to >=1 target entries, typed by RelationshipType."
    attributes: ["id", "source", "relationship", "targets[] (entry-id, strength 1-10, confidence-level, applicability, rationale, remarks)", "remarks"]
    locator: "gemara #Mapping / #MappingTarget / #RelationshipType"
    kind: stated
    tmodel_mapping: "Requirement maps_to edge (R-044); carry strength/confidence as edge attributes"
    notes: "Gemara offers 8 relationship types; OSPS uses only relates-to and leaves strength/confidence/rationale unset."
  - name: ExternalFramework
    definition: "A referenced guideline document: BPB, Scorecard, CSF, CRA, SSDF, ISO-18974, OpenCRE, SLSA, PSSCRM, SAMM, PCIDSS, 800-161, UKSSCOP, BSI-TR-03185-2."
    attributes: ["id", "title", "version", "url", "description"]
    locator: "gemara #MappingReference; meta mapping-references"
    kind: stated
    tmodel_mapping: "library record + Party publisher (ARCH-0001 §2b 'one org registry')"
    notes: ""
  - name: Guideline
    definition: "An entry in an external framework (e.g. SSDF PO.3.2, CRA 1.2f) that a mapping targets."
    attributes: ["entry-id"]
    locator: "gemara #EntryType 'Guideline'; mapping target-reference.entry-type"
    kind: stated
    tmodel_mapping: "Requirement (of another spec) — the other end of a maps_to edge"
    notes: ""
  - name: LexiconTerm
    definition: "A defined term used in control text (40 terms)."
    attributes: ["term", "definition", "synonyms", "references"]
    locator: "baseline/lexicon.yaml"
    kind: stated
    tmodel_mapping: "none (glossary) — but the defined terms are the object types below"
    notes: "Not Gemara #Lexicon-shaped."
  # ---- the domain the controls talk about
  - name: Project
    definition: "lexicon 'Project'; the subject of conformance; 'active' and 'has made a release' are states it can be in."
    attributes: ["active", "has_released", "maturity level", "multiple_repositories"]
    locator: "lexicon Project; OSPS-QA-04.01; OSPS-DO-01.01 'When the project has made a release'"
    kind: stated
    tmodel_mapping: "Product / ProductFamily (ARCH-0001 §1.1); the SDL program attaches here (R-041)"
    notes: "Open source project ~ tmodel Product line, not a ProductInstance."
  - name: Subproject
    definition: "lexicon 'Subproject'; additional codebases of a project that must be as strict as the primary codebase (OSPS-QA-04.02)."
    attributes: []
    locator: "lexicon Subproject; OSPS-QA-04.02"
    kind: stated
    tmodel_mapping: "Product composed_of Product/Component"
    notes: ""
  - name: Repository
    definition: "lexicon 'Repository'; the authoritative source code repository, publicly readable at a static URL."
    attributes: ["url", "public", "primary_branch"]
    locator: "lexicon Repository; OSPS-QA-01.01; OSPS-AC-01.01"
    kind: stated
    tmodel_mapping: "new (SourceRepository) — ARCH-0001 has Component but no source-control entity"
    notes: ""
  - name: VersionControlSystem
    definition: "lexicon 'Version Control System'; the platform that enforces MFA, permissions, branch protection, approvals and change records."
    attributes: ["mfa_enforced", "default_permissions", "branch_protection", "required_approvals", "required_status_checks"]
    locator: "lexicon Version Control System; OSPS-AC-02.01, AC-03.02, LE-01.01, QA-01.02, QA-07.01"
    kind: stated
    tmodel_mapping: "Component (a tool/service in the development Environment); Party for the hosting provider"
    notes: "Most ARs are configuration assertions about this one object — a strong case for an 'evidence via platform API' pattern."
  - name: PrimaryBranch
    definition: "lexicon 'Primary Branch'."
    attributes: ["protected", "deletable"]
    locator: "lexicon Primary Branch; OSPS-AC-03.*, QA-03.01, QA-07.01"
    kind: stated
    tmodel_mapping: "new"
    notes: ""
  - name: Change
    definition: "lexicon 'Change' / 'Commit'; unit of modification, with author and time, subject to status checks and approval."
    attributes: ["author", "timestamp", "approvals", "status_checks", "sign-off/DCO"]
    locator: "lexicon Change, Commit; OSPS-QA-01.02, QA-03.01, QA-07.01, LE-01.01"
    kind: stated
    tmodel_mapping: "PROV Activity (ARCH-0001 §4) — a change is an activity generating a new revision"
    notes: ""
  - name: Collaborator
    definition: "lexicon 'Collaborator' (distinct from 'Contributor' and 'Maintainer'); holds permissions on sensitive resources."
    attributes: ["permissions", "mfa"]
    locator: "lexicon Collaborator, Contributor, Maintainer, Administrator; OSPS-AC-02.01, GV-04.01"
    kind: stated
    tmodel_mapping: "Party (ARCH-0001 §2b) with a relational role edge (collaborator_of / maintainer_of)"
    notes: "Four role terms (Administrator, Maintainer, Collaborator, Contributor) are roles, i.e. edges, per ARCH-0001 critic M2."
  - name: User
    definition: "lexicon 'User'."
    attributes: []
    locator: "lexicon User; OSPS-AC-01.01, DO-01.01"
    kind: stated
    tmodel_mapping: "Party (consumer role) / ExternalEntity"
    notes: ""
  - name: SensitiveResource
    definition: "'Resources that, if compromised, would provide a vector for further compromising software build and delivery or for disclosing sensitive data to unauthorized parties. This includes build systems, image repositories, and data storage.'"
    attributes: []
    locator: "lexicon Sensitive Resource"
    kind: stated
    tmodel_mapping: "Asset (ARCH-0001 §3, owned_by Party)"
    notes: ""
  - name: SensitiveData
    definition: "lexicon 'Sensitive Data' — secrets, credentials, PII, embargoed vulnerability data."
    attributes: ["classification"]
    locator: "lexicon Sensitive Data; OSPS-BR-07.01"
    kind: stated
    tmodel_mapping: "Asset / DataStore with classification (R-029)"
    notes: ""
  - name: CICDPipeline
    definition: "lexicon 'CI/CD Pipeline' / 'Build and Release Pipeline'; runs tasks/jobs with permissions, on metadata and code snapshots of varying trust."
    attributes: ["default_permissions", "job_permissions", "trigger", "input_trust"]
    locator: "lexicon CI/CD Pipeline, Build and Release Pipeline; OSPS-AC-04.*, BR-01.*, BR-05.01, QA-06.01"
    kind: stated
    tmodel_mapping: "Process (DFD role) realized_by a build-service Component; trust of inputs = TrustBoundary crossing"
    notes: "BR-01 encodes a trust boundary (untrusted metadata/code vs privileged credentials) without naming it."
  - name: Release
    definition: "lexicon 'Release'; official release with a unique version identifier, change log, signature/signed manifest, license, SBOM."
    attributes: ["version_identifier", "changelog", "signature", "manifest_hashes"]
    locator: "lexicon Release, Version Identifier; OSPS-BR-02.*, BR-04.01, BR-06.01"
    kind: stated
    tmodel_mapping: "Product version / ProductInstance (versioned, ARCH-0001 §1.1)"
    notes: "'When the project has made a release' is the trigger that turns on 13 ARs."
  - name: ReleasedSoftwareAsset
    definition: "lexicon 'Released Software Asset'; an artifact within a release, associated with the release identifier and its hash."
    attributes: ["identifier", "hash", "license", "sbom"]
    locator: "lexicon Released Software Asset; OSPS-BR-02.02, BR-06.01, LE-02.02, QA-02.02"
    kind: stated
    tmodel_mapping: "Component (identity by hash/purl)"
    notes: ""
  - name: DistributionChannel
    definition: "An official project or distribution channel listed by URI, required to be encrypted and authenticated."
    attributes: ["uri", "encrypted", "authenticated"]
    locator: "OSPS-BR-03.01, BR-03.02"
    kind: stated
    tmodel_mapping: "DataFlow / NetworkLink (ARCH-0001 §1.2/§3)"
    notes: ""
  - name: Dependency
    definition: "A direct language dependency listed in a dependency list, ingested with standardized tooling, governed by a remediation policy."
    attributes: ["name", "version", "ecosystem"]
    locator: "OSPS-QA-02.01, BR-05.01, DO-06.01, VM-05.*"
    kind: stated
    tmodel_mapping: "Component uses_component Component (ARCH-0001 §5 propagation)"
    notes: ""
  - name: SBOM
    definition: "lexicon 'Software Bill of Materials'; delivered with compiled released assets."
    attributes: []
    locator: "lexicon Software Bill of Materials; OSPS-QA-02.02"
    kind: stated
    tmodel_mapping: "Evidence/WorkProduct (R-042) and an import source for composed_of"
    notes: ""
  - name: ProvenanceInformation
    definition: "lexicon 'Software Provenance' — origin and history of released assets; verification instructions required (DO-03)."
    attributes: []
    locator: "lexicon Software Provenance; OSPS-DO-03 (control title 'Publish Provenance Verification Instructions'), OSPS-DO-03.01/.02; OSPS-BR-06.01 recommendation ('SLSA provenance, or SLSA VSAs')"
    kind: stated
    tmodel_mapping: "supply-chain (custody) provenance — deferred by ARCH-0001 §4 to the radar contract"
    notes: ""
  - name: PolicyDocument
    definition: "Project documentation of a required kind: user guide, defect guide, contribution guide, roles, CVD policy, security contacts, dependency policy, secrets policy, SCA/SAST threshold policies, test policy, support scope, build instructions."
    attributes: ["kind", "location", "version"]
    locator: "lexicon Project Documentation; OSPS-DO-*, GV-*, VM-01/05/06, QA-06.02/03, BR-07.02"
    kind: stated
    tmodel_mapping: "WorkProduct / documentation-kind MitigationInstance (R-040 kind=documentation); governed view (R-043)"
    notes: "24 of 64 active ARs have the project documentation as their grammatical subject; 38 of 64 are deliverable-natured (requirements.yaml nature)."
  - name: DesignDocumentation
    definition: "Design documentation of all actions and actors; descriptions of all external software interfaces."
    attributes: []
    locator: "OSPS-SA-01.01, SA-02.01"
    kind: stated
    tmodel_mapping: "the threat model's DFD / Behavioral layer (ARCH-0001 §1.2) — actors = ExternalEntity/Process, interfaces = AttackSurface"
    notes: ""
  - name: SecurityAssessment
    definition: "An assessment of 'the most likely and impactful potential security problems'; at L3 a threat modeling and attack surface analysis."
    attributes: []
    locator: "OSPS-SA-03.01, SA-03.02; lexicon Threat Modeling, Attack Surface Analysis"
    kind: stated
    tmodel_mapping: "the tmodel threat-model instance itself (ThreatInstance set + AttackSurface + RiskScore)"
    notes: "The one place OSPS requires what tmodel produces."
  - name: Vulnerability
    definition: "lexicon 'Known Vulnerabilities', 'Exploitable Vulnerabilities'; reported privately, disclosed under CVD, published, or declared non-exploitable in VEX."
    attributes: ["exploitable", "disclosed"]
    locator: "lexicon; OSPS-VM-01..05"
    kind: stated
    tmodel_mapping: "Vulnerability / Finding (ARCH-0001 §1.3)"
    notes: ""
  - name: VulnerabilityReport
    definition: "lexicon 'Vulnerability Reporting', 'Private Vulnerability Reporting'; a report sent to the security contacts."
    attributes: ["private"]
    locator: "lexicon; OSPS-VM-02.01, VM-03.01"
    kind: stated
    tmodel_mapping: "Finding reported_by Party (ARCH-0001 §2b)"
    notes: ""
  - name: VEXDocument
    definition: "Accounts for vulnerabilities in components not affecting the project, 'augmenting the vulnerability report with non-exploitability details'."
    attributes: []
    locator: "OSPS-VM-04.02"
    kind: stated
    tmodel_mapping: "VEX override Assertion + Review (ARCH-0001 §5, R-027b)"
    notes: ""
  - name: SecurityContact
    definition: "Security contacts in project documentation, receiving private reports."
    attributes: []
    locator: "OSPS-VM-02.01, VM-03.01"
    kind: stated
    tmodel_mapping: "Party role (security-contact_of Product)"
    notes: ""
  - name: StatusCheck
    definition: "lexicon 'Status Check'; automated checks that must pass or be manually bypassed before commit to primary branch."
    attributes: ["required", "bypassed"]
    locator: "lexicon Status Check; OSPS-QA-03.01"
    kind: stated
    tmodel_mapping: "Gate check (R-041/R-042) at the change grain"
    notes: ""
  - name: AutomatedTestSuite
    definition: "lexicon 'Automated Test Suite' — 'must return an overall \"pass\" or \"fail\" result'."
    attributes: ["result"]
    locator: "lexicon; OSPS-QA-06.*"
    kind: stated
    tmodel_mapping: "Evidence (R-042)"
    notes: ""
  - name: SCAFinding
    definition: "Software Composition Analysis finding (vulnerability or license) against a threshold policy."
    attributes: ["threshold", "suppressed_as_non_exploitable"]
    locator: "lexicon Software Composition Analysis; OSPS-VM-05.*"
    kind: stated
    tmodel_mapping: "Finding (ARCH-0001 §1.3)"
    notes: ""
  - name: SASTFinding
    definition: "Static application security testing finding against a remediation threshold."
    attributes: ["threshold", "suppressed_as_non_exploitable"]
    locator: "OSPS-VM-06.*"
    kind: stated
    tmodel_mapping: "Finding (Weakness/CWE instance)"
    notes: ""
  - name: License
    definition: "lexicon 'License'; OSI/FSF-conformant, stored in LICENSE/COPYING/LICENSES/."
    attributes: ["spdx_id", "location"]
    locator: "lexicon License; OSPS-LE-02.*, LE-03.*"
    kind: stated
    tmodel_mapping: "none (legal attribute on Component/Product)"
    notes: ""
  - name: ContributorAssertion
    definition: "Per-commit assertion of legal authorization (DCO/CLA)."
    attributes: ["kind DCO|CLA"]
    locator: "OSPS-LE-01.01; lexicon Developer Certificate of Origin, Contributor License Agreement"
    kind: stated
    tmodel_mapping: "Assertion (ARCH-0001 §4) in the legal sense — structurally an attestation by a Party about a Change"
    notes: ""
  - name: Assessment
    definition: "An evaluation of a project against a version of the Baseline producing pass/fail per AR (checklist)."
    attributes: ["baseline_version", "level", "results[]"]
    locator: "docs/index.md 'Downstream consumers ... should specify their compliance against a specific version'; checklist; gemara #AssessmentRequirement 'confirmed by an evaluator'"
    kind: inferred
    tmodel_mapping: "conformance check run (R-042) + Review (approval)"
    notes: "OSPS defines no result format; Gemara Layer 5 EvaluationLog does (not imported by OSPS)."
  - name: Threat
    definition: "Implicit: threats are named only inside objectives (account compromise, insider threats, code injection, adversary-in-the-middle)."
    attributes: []
    locator: "OSPS-AC-01 objective; OSPS-BR-01 objective; OSPS-BR-03.02"
    kind: inferred
    tmodel_mapping: "ThreatInstance / AttackPattern (ARCH-0001 §1.3)"
    notes: "Gemara's #Control.threats field exists but is unused; no threat catalog is linked."
  - name: VulnerabilityAdvisory
    definition: "publicly published data about a discovered vulnerability, e.g. a CVE entry, blog post, or other medium"
    attributes: []
    locator: "OSPS-VM-04.01 text and recommendation"
    kind: stated
    tmodel_mapping: "external_refs (R-028)"
    notes: "added by verify pass 2026-10-02 as the endpoint of published_as (previously the free-text \"advisory data\")"
edges:
  - {name: contains, from: ControlCatalog, to: Control, cardinality: "1:N", definition: "controls[]", locator: "gemara #ControlCatalog", kind: stated, tmodel_mapping: "published_by (Requirement -> spec)"}
  - {name: member_of, from: Control, to: ControlFamily, cardinality: "N:1", definition: "control.group references groups[].id", locator: "gemara #Control.group", kind: stated, tmodel_mapping: "Requirement facet"}
  - {name: has_requirement, from: Control, to: AssessmentRequirement, cardinality: "1:N", definition: "assessment-requirements[]", locator: "gemara #Control", kind: stated, tmodel_mapping: "Requirement part_of Requirement"}
  - {name: applies_at, from: AssessmentRequirement, to: MaturityLevel, cardinality: "N:M", definition: "applicability[] names applicability-groups", locator: "gemara #AssessmentRequirement.applicability", kind: stated, tmodel_mapping: "new — Requirement applies_in_profile (conformance level)"}
  - {name: recommends, from: AssessmentRequirement, to: Recommendation, cardinality: "1:0..1", definition: "non-binding guidance", locator: "gemara", kind: stated, tmodel_mapping: "Requirement suggests Mitigation"}
  - {name: has_state, from: "Control | AssessmentRequirement", to: LifecycleState, cardinality: "N:1", definition: "state", locator: "gemara collections.cue", kind: stated, tmodel_mapping: "Requirement status"}
  - {name: replaced_by, from: "Control | AssessmentRequirement", to: "Control | AssessmentRequirement", cardinality: "N:0..1", definition: "replaced-by EntryMapping", locator: "gemara", kind: stated, tmodel_mapping: "supersedes"}
  - {name: maps_to, from: Control, to: Guideline, cardinality: "N:M", definition: "Mapping with relationship relates-to (OSPS) / any RelationshipType (Gemara)", locator: "baseline/mappings/*.yaml; gemara #Mapping", kind: stated, tmodel_mapping: "Requirement maps_to Requirement (R-044)"}
  - {name: part_of, from: Guideline, to: ExternalFramework, cardinality: "N:1", definition: "target-reference.reference-id", locator: "gemara #TypedMapping", kind: stated, tmodel_mapping: "Requirement published_by spec"}
  - {name: defines_term_used_in, from: LexiconTerm, to: "AssessmentRequirement | Control", cardinality: "N:M", definition: "lexicon term linked from control / assessment-requirement text (endpoint normalised by verify pass 2026-10-02; was the free-text \"domain objects\")", locator: "baseline/lexicon.yaml; rendered page link definitions", kind: stated, tmodel_mapping: "none"}
  - {name: owns, from: Project, to: Repository, cardinality: "1:N", definition: "projects may have multiple repositories/codebases", locator: "OSPS-QA-04.01", kind: stated, tmodel_mapping: "Product realized_by SourceRepository (new)"}
  - {name: has_subproject, from: Project, to: Subproject, cardinality: "1:N", definition: "subprojects must be as strict as the primary codebase", locator: "OSPS-QA-04.02", kind: stated, tmodel_mapping: "composed_of"}
  - {name: hosted_on, from: Repository, to: VersionControlSystem, cardinality: "N:1", definition: "the VCS enforces controls on the repository", locator: "OSPS-AC-01.01..QA-07.01", kind: inferred, tmodel_mapping: "runs_on (Component)"}
  - {name: has_primary_branch, from: Repository, to: PrimaryBranch, cardinality: "1:1", definition: "", locator: "lexicon Primary Branch; OSPS-AC-03", kind: stated, tmodel_mapping: "new"}
  - {name: applied_to, from: Change, to: PrimaryBranch, cardinality: "N:1", definition: "commits to the primary branch are gated by status checks and approval", locator: "OSPS-QA-03.01, QA-07.01", kind: stated, tmodel_mapping: "PROV wasGeneratedBy / Activity"}
  - {name: authored_by, from: Change, to: Collaborator, cardinality: "N:1", definition: "record of who made the changes", locator: "OSPS-QA-01.02", kind: stated, tmodel_mapping: "PROV wasAssociatedWith Agent (Party)"}
  - {name: approved_by, from: Change, to: Collaborator, cardinality: "N:M", definition: "at least one non-author human approval", locator: "OSPS-QA-07.01", kind: stated, tmodel_mapping: "Review (ARCH-0001 §4/§5)"}
  - {name: gated_by, from: Change, to: StatusCheck, cardinality: "N:M", definition: "status checks must pass or be manually bypassed", locator: "OSPS-QA-03.01", kind: stated, tmodel_mapping: "Gate (R-041) at change grain"}
  - {name: asserts_right_to_commit, from: Change, to: ContributorAssertion, cardinality: "1:1", definition: "on every commit", locator: "OSPS-LE-01.01", kind: stated, tmodel_mapping: "Assertion"}
  - {name: has_permission_on, from: Collaborator, to: SensitiveResource, cardinality: "N:M", definition: "permissions, least privilege, MFA, review before escalation", locator: "OSPS-AC-01.01, AC-02.01, GV-01.01, GV-04.01", kind: stated, tmodel_mapping: "Party -(role edge)-> Asset"}
  - {name: runs_in, from: CICDPipeline, to: Repository, cardinality: "N:1", definition: "pipelines operate on repository metadata and code snapshots", locator: "OSPS-BR-01.*", kind: inferred, tmodel_mapping: "Process realized_by Component"}
  - {name: accesses, from: CICDPipeline, to: SensitiveResource, cardinality: "N:M", definition: "privileged CI/CD credentials and assets", locator: "OSPS-BR-01.03, AC-04.*", kind: stated, tmodel_mapping: "DataFlow across TrustBoundary"}
  - {name: produces, from: CICDPipeline, to: Release, cardinality: "1:N", definition: "build and release pipeline", locator: "lexicon Build and Release Pipeline; OSPS-BR-05.01", kind: inferred, tmodel_mapping: "PROV wasGeneratedBy"}
  - {name: makes, from: Project, to: Release, cardinality: "1:N", definition: "'When the project has made a release'", locator: "OSPS-DO-01.01 et al.", kind: stated, tmodel_mapping: "Product has_version ProductInstance"}
  - {name: contains_asset, from: Release, to: ReleasedSoftwareAsset, cardinality: "1:N", definition: "assets associated with the release identifier; hashes in signed manifest", locator: "OSPS-BR-02.02, BR-06.01", kind: stated, tmodel_mapping: "composed_of"}
  - {name: described_by_sbom, from: ReleasedSoftwareAsset, to: SBOM, cardinality: "1:1", definition: "compiled released assets delivered with an SBOM", locator: "OSPS-QA-02.02", kind: stated, tmodel_mapping: "Evidence"}
  - {name: distributed_via, from: Release, to: DistributionChannel, cardinality: "N:M", definition: "official distribution channel", locator: "OSPS-BR-03.02", kind: stated, tmodel_mapping: "DataFlow"}
  - {name: depends_on, from: Project, to: Dependency, cardinality: "N:M", definition: "direct language dependencies", locator: "OSPS-QA-02.01", kind: stated, tmodel_mapping: "uses_component"}
  - {name: licensed_under, from: "Repository | ReleasedSoftwareAsset", to: License, cardinality: "N:1", definition: "", locator: "OSPS-LE-02.*, LE-03.*", kind: stated, tmodel_mapping: "none"}
