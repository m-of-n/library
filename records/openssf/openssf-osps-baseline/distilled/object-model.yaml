gaps:
  - "SourceRepository / PrimaryBranch / Change(commit) / StatusCheck: tmodel has Component and PROV Activity but no source-control objects; OSPS (and SLSA Source track) assume them. Needed to evaluate ~20 OSPS ARs."
  - "MaturityLevel / conformance profile: an ordered set of named requirement subsets that a Product claims. DL-0009 has Gate (ordered, dated) but not a level/profile object; OSPS levels are profile-based, not phase-based — they are NOT gates."
  - "Requirement lifecycle (Active/Draft/Deprecated/Retired + replaced-by + never-reuse-id) and version pinning of the spec a conformance claim is made against."
  - "Typed crosswalk edge with relationship type (implements / supports / equivalent / subsumes / relates-to / no-match) plus strength 1-10 and confidence-level — richer than a bare maps_to; Gemara supplies the vocabulary."
  - "Assessment result object (per-AR pass/fail/not-applicable, evaluator, date, baseline version, evidence) — OSPS assumes it, defines none; Gemara EvaluationLog is the candidate."
  - "Event-condition triggers on requirements ('When the project has made a release', 'While active', 'When a new collaborator is added'): tmodel Requirement has no applicability-condition attribute."
  - "Party roles: Administrator, Maintainer, Collaborator, Contributor, Security Contact as relational role edges on Party (ARCH-0001 §2b anticipates this, not yet enumerated)."
  - "PolicyDocument kinds (CVD policy, secrets policy, SCA/SAST threshold policies, test policy, support-scope statement) as WorkProduct types — R-040 kind=documentation needs a document-type vocabulary."
