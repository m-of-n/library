- id: openssf-scorecard-checks#probe:pinsDependencies
  designator: pinsDependencies
  kind_of_item: probe
  check: openssf-scorecard-checks#Pinned-Dependencies
  group: null
  lifecycle: stable
  locator: probes/pinsDependencies/def.yml @v5.5.0
  short: Check that the project pins dependencies to a specific digest.
  text: Pinned dependencies ensure that checking and deployment are all done with the same software, reducing
    deployment risks, simplifying debugging, and enabling reproducibility. They can help mitigate compromised
    dependencies from undermining the security of the project (in the case where you've evaluated the
    pinned dependency, you are confident it's not compromised, and a later version is released that is
    compromised).
  implementation: The probe works by looking for unpinned dependencies in Dockerfiles, shell scripts,
    and GitHub workflows which are used during the build and release process of a project. Special considerations
    for Go modules treat full semantic versions as pinned due to how the Go tool verifies downloaded content
    against the hashes when anyone first downloaded the module.
  outcome:
  - For supported ecosystem, the probe returns OutcomeTrue per pinned dependency.
  - For supported ecosystem, the probe returns OutcomeFalse per unpinned dependency.
  - If the project has no supported dependencies, the probe returns OutcomeNotApplicable.
  remediation:
    onOutcome: false
    effort: Medium
    text:
    - Pin dependencies by hash.
  ecosystem: null
  kind: stated
  testable: 'yes'
