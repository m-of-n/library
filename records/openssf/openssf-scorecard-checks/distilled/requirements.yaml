  testable: 'yes'
- id: openssf-scorecard-checks#probe:codeReviewOneReviewers
  designator: codeReviewOneReviewers
  kind_of_item: probe
  check: null
  group: Uncategorized
  lifecycle: experimental
  locator: probes/codeReviewOneReviewers/def.yml @v5.5.0
  short: Check that at least one reviewers review a change before merging.
  text: To ensure that the review process works, the proposed changes should have a minimum number of
    approvals.
  implementation: This probe looks for whether all changes over the last `--commit-depth` commits have
    been approved by a minimum number of reviewers. Commits are grouped by the Pull Request they were
    introduced in. Only unique reviewer logins that aren't the same as the changeset author are counted.
  outcome:
  - If all the changes had at least one reviewers, the probe returns OutcomeTrue (1)
  - If the changes had fewer than one reviewers, the prove returns OutcomeFalse (0)
  remediation:
    onOutcome: false
    effort: Low
    text:
    - Follow the instructions https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/approving-a-pull-request-with-required-reviews.
    markdown:
    - Follow the instructions https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/approving-a-pull-request-with-required-reviews.
  ecosystem: null
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#probe:hasBinaryArtifacts
  designator: hasBinaryArtifacts
  kind_of_item: probe
  check: null
  group: Uncategorized
  lifecycle: stable
  locator: probes/hasBinaryArtifacts/def.yml @v5.5.0
  short: Checks if the project has any binary files in its source tree.
  text: Binary files are not human readable so users and reviewers can't easily see what they do.
  implementation: The implementation looks for the presence of binary files. This is a more restrictive
    probe than "hasUnverifiedBinaryArtifacts" which excludes verified binary files.
  outcome:
  - If the probe finds binary files, it returns one OutcomeTrue for each binary file found.
  - If the probe finds no binary files, it returns a single OutcomeFalse.
  remediation:
    onOutcome: true
    effort: Medium
    text:
    - Remove the generated executable artifacts from the repository.
    - Build from source.
  ecosystem:
    languages:
    - all
    clients:
    - github
    - gitlab
    - localdir
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#probe:releasesHaveVerifiedProvenance
  designator: releasesHaveVerifiedProvenance
  kind_of_item: probe
  check: null
  group: Uncategorized
  lifecycle: experimental
  locator: probes/releasesHaveVerifiedProvenance/def.yml @v5.5.0
  short: Checks if the project releases with provenance attestations that have been verified
  text: Package provenance attestations provide a greater guarantee of authenticity and integrity than
    package signatures alone, since the attestation can be performed over a hash of both the package contents
    and metadata. Developers can attest to particular qualities of the build, such as the build environment,
    build steps or builder identity.
  implementation: This probe checks how many packages published by the repository are associated with
    verified SLSA provenance attestations. It uses data from a ProjectPackageClient, which associates
    a GitHub/GitLab project with a package in a package manager. Using the data from the package manager
    (whom we rely on to verify the provenance attestation), this probe returns a finding for each release.
    For now, only NPM is supported.
  outcome:
  - For each release, the probe returns OutcomeTrue or OutcomeFalse, depending on if the package has a
    verified provenance attestation.
  - If we didn't find a package or didn't find releases, return OutcomeNotAvailable.
  remediation:
    onOutcome: false
    effort: Low
    text:
    - For NPM, publish provenance alongside your package using the `--provenance` flag (See (Introducing
      npm package provenance)[https://github.blog/2023-04-19-introducing-npm-package-provenance/])
  ecosystem:
    languages:
    - javascript
    clients:
    - github
    - gitlab
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#probe:unsafeblock
  designator: unsafeblock
  kind_of_item: probe
  check: null
  group: Independent
  lifecycle: experimental
  locator: probes/unsafeblock/def.yml @v5.5.0
  short: Flags unsafe blocks of code in this project.
  text: Memory safety in software should be considered a continuum, rather than being binary.  While some
    languages and tools are memory safe by default, it may still be possible, and sometimes unavoidable,
    to write unsafe code in them. Unsafe code allow developers to bypass normal safety checks and directly
    manipulate memory.
  implementation: 'The probe is ecosystem-specific and will surface non memory safe practices in the project
    by identifying unsafe code blocks. Unsafe code blocks are supported in rust, go, c#, and swift, but
    only go and c# are supported by this probe at this time: - for go the probe will look for the use
    of the `unsafe` include directive. - for c# the probe will look at the csproj and identify the use
    of the `AllowUnsafeBlocks` property.'
  outcome:
  - For supported ecosystem, the probe returns OutcomeTrue per unsafe block.
  - If the project has no unsafe blocks, the probe returns OutcomeFalse.
  remediation:
    onOutcome: true
    effort: Medium
    text:
    - Visit the OpenSSF Memory Safety SIG guidance on how to make your project memory safe.
    - Guidance for [Memory-Safe By Default Languages](https://github.com/ossf/Memory-Safety/blob/main/docs/best-practice-memory-safe-by-default-languages.md)
    - Guidance for [Non Memory-Safe By Default Languages](https://github.com/ossf/Memory-Safety/blob/main/docs/best-practice-non-memory-safe-by-default-languages.md)
  ecosystem:
    languages:
    - go
    - c#
    clients:
    - github
    - gitlab
    - localdir
  kind: stated
  testable: 'yes'
