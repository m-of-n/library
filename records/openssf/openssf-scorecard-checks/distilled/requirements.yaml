  testable: 'yes'
- id: openssf-scorecard-checks#probe:hasSBOM
  designator: hasSBOM
  kind_of_item: probe
  check: openssf-scorecard-checks#SBOM
  group: null
  lifecycle: experimental
  locator: probes/hasSBOM/def.yml @v5.5.0
  short: Check that the project has an SBOM file
  text: An SBOM can give users information about how the source code components and dependencies. They
    help facilitate software supplychain security and aid in identifying upstream vulnerabilities in a
    codebase.
  implementation: The implementation checks whether an SBOM file is present in the source code.
  outcome:
  - If an SBOM file(s) is found, the probe returns OutcomeTrue for each SBOM artifact up to 5.
  - If an SBOM file is not found, the probe returns a single OutcomeFalse.
  remediation:
    onOutcome: false
    effort: Low
    text:
    - For Github projects, start with [this guide](https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-supply-chain-security)
      to determine which steps are needed to generate an adequate SBOM.
    - For Gitlab projects, see existing [Dependency Scanning](https://docs.gitlab.com/ee/user/application_security/dependency_scanning/index.html#cyclonedx-software-bill-of-materials)
      and [Container Scanning](https://docs.gitlab.com/ee/user/application_security/container_scanning/index.html#cyclonedx-software-bill-of-materials)
      tools.
    - Alternatively, there are other tools available to generate [CycloneDX](https://cyclonedx.org/tool-center/)
      and [SPDX](https://spdx.dev/use/tools/) SBOMs.
  ecosystem:
    languages:
    - all
    clients:
    - github
    - gitlab
  kind: stated
  testable: 'yes'
