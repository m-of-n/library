  testable: 'yes'
- id: openssf-scorecard-checks#probe:blocksDeleteOnBranches
  designator: blocksDeleteOnBranches
  kind_of_item: probe
  check: openssf-scorecard-checks#Branch-Protection
  group: null
  lifecycle: stable
  locator: probes/blocksDeleteOnBranches/def.yml @v5.5.0
  short: Check that the project blocks non-admins from deleting branches.
  text: Allowing non-admins to delete project branches has a similar effect to performing force pushes.
  implementation: Checks the protection rules of default and release branches.
  outcome:
  - The probe returns one OutcomeTrue for each branch that is disallowed from users deleting it, and one
    OutcomeFalse for branches where users are able to delete it. Scorecard only considers default and
    releases branches.
  remediation:
    onOutcome: false
    effort: Low
    text:
    - Disallow deletion of branches in your project to remove false outcomes.
    - GitHub and GitLab by default disable deleting a protected branch.
