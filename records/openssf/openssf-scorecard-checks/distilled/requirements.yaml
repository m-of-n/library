  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.CII-Best-Practices (rendered docs/checks.md#cii-best-practices)
  short: Determines if the project has an OpenSSF (formerly CII) Best Practices Badge.
  text: 'Risk: `Low` (possibly not following security best practices)


    This check determines whether the project has earned an [OpenSSF (formerly CII) Best Practices Badge](https://www.bestpractices.dev/)
    at the passing, silver, or gold level.

    The OpenSSF Best Practices badge indicates whether or not that the project uses a set of security-focused
    best development practices for open

    source software. The check uses the URL for the Git repo and the OpenSSF Best Practices badge API.


    The OpenSSF Best Practices badge has 3 tiers: passing, silver, and gold. We give

    full credit to projects that meet the [gold criteria](https://www.bestpractices.dev/criteria/2), which
    is a significant achievement for projects and requires multiple developers in the project.

    Lower scores represent a project that has met the silver criteria, met the passing criteria, or is
    working to achieve the passing badge, with increasingly more points awarded as more criteria are met.
    Note that even meeting the passing criteria is a significant achievement.


    - [gold badge](https://www.bestpractices.dev/criteria/2): 10

    - [silver badge](https://www.bestpractices.dev/criteria/1): 7

    - [passing badge](https://www.bestpractices.dev/criteria/0): 5

    - in progress badge: 2


    Some of these criteria overlap with other Scorecard checks.

    However, note that in those overlapping cases, Scorecard can only report what it can automatically
    detect, while the OpenSSF Best Practices badge can report on claims and claim justifications from
    people (this counters false negatives and positives but has the challenge of requiring additional
    work from people).'
  scoring_criteria_lines:
  - Lower scores represent a project that has met the silver criteria, met the passing criteria, or is
    working to achieve the passing badge, with increasingly more points awarded as more criteria are met.
  remediation:
  - Sign up for the [OpenSSF Best Practices program](https://www.bestpractices.dev/).
  probes:
  - openssf-scorecard-checks#probe:hasOpenSSFBadge
  expects_deliverables:
  - OpenSSF Best Practices badge
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Code-Review
  designator: Code-Review
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: process
  phase: verification
  risk: High
  weight: 7.5
  tags:
  - supply-chain
  - security
  - source-code
  - code-reviews
  repos:
  - GitHub
  - GitLab
  - Azure DevOps
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Code-Review (rendered docs/checks.md#code-review)
  short: Determines if the project requires human code review before pull requests (aka merge requests)
    are merged.
  text: "Risk: `High` (unintentional vulnerabilities or possible injection of malicious\ncode)\n\nThis\
    \ check determines whether the project requires human code review\nbefore pull requests (merge requests)\
    \ are merged.\n\nReviews detect various unintentional problems, including vulnerabilities that\ncan\
    \ be fixed immediately before they are merged, which improves the quality of\nthe code. Reviews may\
    \ also detect or deter an attacker trying to insert\nmalicious code (either as a malicious contributor\
    \ or as an attacker who has\nsubverted a contributor's account), because a reviewer might detect the\n\
    subversion.\n\nThe check determines whether the most recent changes (over the last ~30 commits) have\
    \ \nan approval on GitHub\nor if the merger is different from the committer (implicit review). It\
    \ also\nperforms a similar check for reviews using\n[Prow](https://github.com/kubernetes/test-infra/tree/master/prow#readme)\
    \ (labels\n\"lgtm\" or \"approved\") and [Gerrit](https://www.gerritcodereview.com/) (\"Reviewed-on\"\
    \ and \"Reviewed-by\").\nIf recent changes are solely bot activity (e.g. Dependabot, Renovate bot,\
    \ or custom bots),\nthe check returns inconclusively.\n\nScoring is leveled instead of proportional\
    \ to make the check more predictable.\nIf any bot-originated changes are unreviewed, 3 points are\
    \ deducted. If any human\nchanges are unreviewed, 7 points are deducted if a single change is unreviewed,\
    \ and\nanother 3 are deducted if multiple changes are unreviewed.\n\nReview by bots, including bots\
    \ powered by\nartificial intelligence / machine learning (AI/ML),\ndo not count as code review.\n\
    Such reviews do not provide confidence that there will\nbe a second person who understands the\ncode\
    \ change (e.g., if the originator suddenly becomes unavailable).\nHowever, analysis by bots\nmay be\
    \ able to meet (at least in part) the [SAST](#sast) criterion.\n\nNote: Requiring reviews for all\
    \ changes is infeasible for some projects, such as\nthose with only one active participant. Even a\
    \ project with multiple active\ncontributors may not have enough active participation to be able to\
    \ require\nreview of all proposed changes. Projects with a small number of active\nparticipants instead\
    \ sometimes aim for a review of a\npercentage of proposals (e.g., \"at least half of all proposed\
    \ changes are\nreviewed\").\n\nRequiring review does not eliminate all risks. The other reviewers\
    \ might fail to\nnotice unintentional vulnerabilities or malicious code, be colluding with a\nmalicious\
    \ developer, or even be the same person (using a \"[sock\npuppet](https://en.wikipedia.org/wiki/Sock_puppet_account)\"\
    \ account)."
  scoring_criteria_lines:
  - Scoring is leveled instead of proportional to make the check more predictable.
  - If any bot-originated changes are unreviewed, 3 points are deducted.
  - If any human changes are unreviewed, 7 points are deducted if a single change is unreviewed, and another
    3 are deducted if multiple changes are unreviewed.
  remediation:
  - If the project has only one contributor, or does not have enough reviewers to practically require
    that all contributions be reviewed, try to recruit more maintainers to the project who will be willing
    to review others' work. Ideally at least some of these people will be from different organizations
    (see [Contributors](checks.md#contributors)). If the project has very limited utility, consider expanding
    its intended utility so more people will be interested in improving it, and make that larger scope
    clear to potential contributors.
  - Follow security best practices by performing strict code reviews for every new pull request / merge
    request.
  - Make "code reviews" mandatory in your repository configuration. ([Instructions for GitHub.](https://docs.github.com/en/github/administering-a-repository/about-protected-branches#require-pull-request-reviews-before-merging))
  - Enforce the rule for administrators / code owners as well. ([Instructions for GitHub.](https://docs.github.com/en/github/administering-a-repository/about-protected-branches#include-administrators))
  probes:
  - openssf-scorecard-checks#probe:codeApproved
  expects_deliverables: []
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
