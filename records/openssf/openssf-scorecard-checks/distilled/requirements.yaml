- id: openssf-scorecard-checks#probe:hasOSVVulnerabilities
  designator: hasOSVVulnerabilities
  kind_of_item: probe
  check: openssf-scorecard-checks#Vulnerabilities
  group: null
  lifecycle: stable
  locator: probes/hasOSVVulnerabilities/def.yml @v5.5.0
  short: Check whether the project has known vulnerabilities
  text: This check determines whether the project has open, unfixed vulnerabilities in its own codebase
    or its dependencies using the OSV (Open Source Vulnerabilities) service. An open vulnerability may
    be exploited by attackers and should be fixed as soon as possible.
  implementation: The implementation fetches data from OSV.dev about the project which shows whether a
    given project has known, unfixed vulnerabilities. The implementation uses the number of known, unfixed
    vulnerabilities to score.
  outcome:
  - The probe returns one true outcome for each vulnerability found in OSV.
  - If there are no known vulnerabilities detected, the probe returns one false outcome.
  remediation:
    onOutcome: true
    effort: High
    text:
    - Fix the ${{ metadata.osvid }} by following information from https://osv.dev/${{ metadata.osvid }}
      .
    - If the vulnerability is in a dependency, update the dependency to a non-vulnerable version. If no
      update is available, consider whether to remove the dependency.
    - If you believe the vulnerability does not affect your project, the vulnerability can be ignored.
      To ignore, create an osv-scanner.toml file next to the dependency manifest (e.g. package-lock.json)
      and specify the ID to ignore and reason. Details on the structure of osv-scanner.toml can be found
      on OSV-Scanner repository.
    markdown:
    - Fix the ${{ metadata.osvid }} by following information from [OSV](https://osv.dev/${{ metadata.osvid
      }}) .
    - If the vulnerability is in a dependency, update the dependency to a non-vulnerable version. If no
      update is available, consider whether to remove the dependency.
    - If you believe the vulnerability does not affect your project, the vulnerability can be ignored.
      To ignore, create an osv-scanner.toml ([example](https://github.com/google/osv.dev/blob/eb99b02ec8895fe5b87d1e76675ddad79a15f817/vulnfeeds/osv-scanner.toml))
      file next to the dependency manifest (e.g. package-lock.json) and specify the ID to ignore and reason.
      Details on the structure of osv-scanner.toml can be found on [OSV-Scanner repository](https://github.com/google/osv-scanner#ignore-vulnerabilities-by-id).
  ecosystem:
    languages:
    - all
    clients:
    - github
    - gitlab
    - localdir
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#probe:codeApproved
  designator: codeApproved
  kind_of_item: probe
  check: openssf-scorecard-checks#Code-Review
  group: null
  lifecycle: experimental
  locator: probes/codeApproved/def.yml @v5.5.0
  short: Check that all recent changesets have been approved by someone who is not the author of the changeset.
  text: To ensure that the review process works, the proposed changes should have a minimum number of
    approvals.
  implementation: This probe looks for whether all changes over the last `--commit-depth` commits have
    been approved before merge. Commits are grouped by the changeset they were introduced in, and each
    changesets must have at least one approval. Reviewed, bot authored changesets (e.g. dependabot) are
    not counted.
  outcome:
  - If all commits were approved, the probe returns OutcomeTrue
  - If any commits were not approved, the probe returns OutcomeFalse
  - If there are no changes, the probe returns OutcomeNotApplicable
  remediation:
    onOutcome: false
    effort: Low
    text:
    - Follow the instructions at https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/approving-a-pull-request-with-required-reviews.
    markdown:
    - Follow the instructions [here](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/approving-a-pull-request-with-required-reviews)
      to review pull requests before merge.
  ecosystem: null
  kind: stated
  testable: 'yes'
