- id: openssf-scorecard-checks#probe:sastToolRunsOnAllCommits
  designator: sastToolRunsOnAllCommits
  kind_of_item: probe
  check: openssf-scorecard-checks#SAST
  group: null
  lifecycle: experimental
  locator: probes/sastToolRunsOnAllCommits/def.yml @v5.5.0
  short: Checks that a SAST tool runs on all commits in the projects CI.
  text: SAST is testing run on source code before the application is run. Using SAST tools can prevent
    known classes of bugs from being inadvertently introduced in the codebase.
  implementation: The implementation iterates through the projects commits and checks whether any of the
    check runs for the commits associated merge request was any of the SAST tools that Scorecard supports.
  outcome:
  - If the project had no commits merged, the probe returns a finding with OutcomeNotApplicable.
  - If the project runs SAST tools successfully on every pull request before merging, the probe returns
    one finding with OutcomeTrue (1). In addition, the finding will include two values. 1) How many commits
    were tested by a SAST tool, and 2) How many commits in total were merged.
  - If the project does not run any SAST tools successfully on every pull request before merging, the
    probe returns one finding with OutcomeFalse (0). In addition, the finding will include two values.
    1) How many commits were tested by a SAST tool, and 2) How many commits in total were merged.
  remediation:
    onOutcome: false
    effort: Low
    text:
    - Ensure that your SAST tools run on every commit.
    markdown:
    - Ensure that your SAST tools run on every commit.
  ecosystem:
    languages:
    - all
    clients:
    - github
    - gitlab
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#probe:hasDangerousWorkflowScriptInjection
  designator: hasDangerousWorkflowScriptInjection
  kind_of_item: probe
  check: openssf-scorecard-checks#Dangerous-Workflow
  group: null
  lifecycle: stable
  locator: probes/hasDangerousWorkflowScriptInjection/def.yml @v5.5.0
  short: Check whether the project has GitHub Actions workflows that enable script injection.
  text: Script injections allow attackers to use untrusted input to access privileged resources (code
    execution, secret exfiltration, etc.)
  implementation: The probe analyzes the repository's workflows for known dangerous patterns.
  outcome:
  - The probe returns one finding with OutcomeTrue for each dangerous script injection pattern detected.
    Each finding may include a suggested patch to fix the respective script injection.
  - If no dangerous patterns are found, the probe returns one finding with OutcomeFalse.
  remediation:
    onOutcome: true
    effort: Low
    text:
    - Avoid the dangerous workflow patterns.
    markdown:
    - Avoid the dangerous workflow patterns.
    - See [this document](https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections)
      for information on avoiding and mitigating the risk of script injections.
    - 'Here is a proposed patch to eliminate this risk:

      ```yml

      ${{ metadata.patch }}

      ```

      '
  ecosystem:
    languages:
    - all
    clients:
    - github
    - gitlab
    - localdir
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#probe:hasDangerousWorkflowUntrustedCheckout
  designator: hasDangerousWorkflowUntrustedCheckout
  kind_of_item: probe
  check: openssf-scorecard-checks#Dangerous-Workflow
  group: null
  lifecycle: stable
  locator: probes/hasDangerousWorkflowUntrustedCheckout/def.yml @v5.5.0
  short: Check whether the project has GitHub Actions workflows that does untrusted checkouts.
  text: GitHub workflows triggered with pull_request_target or workflow_run have write permission to the
    target repository and access to target repository secrets. Combined with a dangerous checkout of PR
    contents, attackers may be able to compromise the repository, for example, by using build scripts
    controlled by the PR author.
  implementation: The probe iterates through the workflows looking for pull_request_target and workflow_run
    triggers which checkout references from a PR. This check does not detect whether untrusted code checkouts
    are used safely, for example, only on pull request that have been assigned a label.
  outcome:
  - The probe returns one finding with OutcomeTrue per untrusted checkout.
  - The probe returns one finding with OutcomeFalse if no untrusted checkouts are detected.
  remediation:
    onOutcome: true
    effort: Low
    text:
    - Avoid the dangerous workflow patterns.
    markdown:
    - Avoid the dangerous workflow patterns.
    - See [this post](https://securitylab.github.com/research/github-actions-preventing-pwn-requests/)
      for information on avoiding untrusted code checkouts.
  ecosystem:
    languages:
    - all
    clients:
    - github
    - gitlab
    - localdir
  kind: stated
  testable: 'yes'
