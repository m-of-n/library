  text: This probe tries to determine if the project has recent contributors from multiple organizations.
    For some projects, having a diverse group of contributors is an indicator of project health.
  implementation: The probe looks at the Company field on the user profile for authors of recent commits.  To
    receive the highest score, the project must have had contributors from at least 3 different companies
    in the last 30 commits.
