  check: openssf-scorecard-checks#Webhooks
  group: null
  lifecycle: experimental
  locator: probes/webhooksUseSecrets/def.yml @v5.5.0
  short: This check determines whether the webhooks defined in the repository have secrets configured
    to authenticate the origins of requests.
  text: Webhooks without secret authorization have the potential to make projects accessible to third-parties.
  implementation: The probe checks all webhooks of a project and checks whether each uses secret authentication.
  outcome:
  - The probe returns one OutcomeTrue per webhook with secret authorization.
  - The probe returns one OutcomeFalse per webhook without secret authorization.
  - Projects without webhooks receive an OutcomeNotApplicable.
  remediation:
    onOutcome: false
    effort: Low
    text:
    - Check if the service your webhooks is configured with supports secrets.
    - If there is support for secret authentication, set the secret in the webhook configuration. See
      [Setting up a webhook](https://docs.github.com/en/developers/webhooks-and-events/webhooks/creating-webhooks#setting-up-a-webhook).
    - If there is no support for secret authentication, request the webhook service implement secret authentication
      functionality by following [these directions](https://docs.github.com/en/developers/webhooks-and-events/webhooks/securing-your-webhooks).
    markdown:
    - Check if the service your webhooks is configured with supports secrets.
    - If there is support for secret authentication, set the secret in the webhook configuration. See
      [Setting up a webhook](https://docs.github.com/en/developers/webhooks-and-events/webhooks/creating-webhooks#setting-up-a-webhook).
    - If there is no support for secret authentication, request the webhook service implement secret authentication
      functionality by following [these directions](https://docs.github.com/en/developers/webhooks-and-events/webhooks/securing-your-webhooks).
  ecosystem:
    languages:
    - all
    clients:
    - github
    - gitlab
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#probe:testsRunInCI
  designator: testsRunInCI
  kind_of_item: probe
  check: openssf-scorecard-checks#CI-Tests
  group: null
  lifecycle: stable
  locator: probes/testsRunInCI/def.yml @v5.5.0
  short: Checks that the project runs tests in the CI for example with GitHub Actions or Prow.
  text: Running tests helps developers catch mistakes early on, which can reduce the number of vulnerabilities
    that find their way into a project.
  implementation: The probe checks for tests in the projects CI jobs in the recent commits (~30).
  outcome:
  - The probe returns one OutcomeTrue for each PR that ran CI tests and one OutcomeFalse for each PR that
