  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Branch-Protection (rendered docs/checks.md#branch-protection)
  short: Determines if the default and release branches are protected with GitHub's branch protection
    settings.
  text: "Risk: `High` (vulnerable to intentional malicious code injection)\n\nThis check determines whether\
    \ a project's default and release branches are\nprotected with GitHub's [branch protection](https://docs.github.com/github/administering-a-repository/defining-the-mergeability-of-pull-requests/about-protected-branches)\
    \ \nor [repository rules](https://docs.github.com/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets)\
    \ settings.\nBranch protection allows maintainers to define rules that enforce\ncertain workflows\
    \ for branches, such as requiring review or passing certain\nstatus checks before acceptance into\
    \ a main branch, or preventing rewriting of\npublic history.\n\nNote: The following settings queried\
    \ by the Branch-Protection check require an admin token: `DismissStaleReviews`, `EnforceAdmins`, `RequireLastPushApproval`,\
    \ `RequiresStatusChecks` and `UpToDateBeforeMerge`. If\nthe provided token does not have admin access,\
    \ the check will query the branch\nsettings accessible to non-admins and provide results based only\
    \ on these settings.\nHowever, all of these settings are accessible via Repo Rules. `EnforceAdmins`\
    \ is calculated slightly differently.\nThis setting is calculated as `false` if any [Bypass Actors](https://docs.github.com/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/creating-rulesets-for-a-repository#granting-bypass-permissions-for-your-ruleset)\n\
    \ are defined on any rule, regardless of if they are admins.\n\nDifferent types of branch protection\
    \ protect against different risks:\n\n  - Require code review: \n    - requires at least one reviewer,\
    \ which greatly\n    reduces the risk that a compromised contributor can inject malicious code.\n\
    \    Review also increases the likelihood that an unintentional vulnerability in\n    a contribution\
    \ will be detected and fixed before the change is accepted.\n\n    - requiring two or more reviewers\
    \ protects even more from the insider risk \n    whereby a compromised contributor can be used by\
    \ an attacker to LGTM \n    the attacker PR and inject a malicious code as if it was legit.\n\n  -\
    \ Prevent force push: prevents use of the `--force` command on public\n    branches, which overwrites\
    \ code irrevocably. This protection prevents the\n    rewriting of public history without external\
    \ notice.\n\n  - Require [status checks](https://docs.github.com/en/github/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/about-status-checks):\n\
    \    ensures that all required CI tests are met before a change is accepted.\n\nAlthough requiring\
    \ code review can greatly reduce the chance that\nunintentional or malicious code enters the \"main\"\
    \ branch, it is not feasible for\nall projects, such as those that don't have many active participants.\
    \ For more\ndiscussion, see [Code Reviews](https://github.com/ossf/scorecard/blob/main/docs/checks.md#code-review).\n\
    \nAdditionally, in some cases these rules will need to be suspended. For example,\nif a past commit\
    \ includes illegal content such as child pornography, it may be\nnecessary to use a force push to\
    \ rewrite the history rather than simply hide the\ncommit.\n\nThis test has tiered scoring. Each tier\
    \ must be fully satisfied to achieve points at the next tier. For example, if you fulfill the Tier\
    \ 3 checks but do not fulfill all the Tier 2 checks, you will not receive any points for Tier 3.\n\
    \nNote: If Scorecard is run without an administrative access token, the requirements that specify\
    \ “For administrators” can be safely ignored, and scores will be determined as if all such requirements\
    \ have been met.\n\nTier 1 Requirements (3/10 points):\n  - Prevent force push\n  - Prevent branch\
    \ deletion\n\nTier 2 Requirements (6/10 points):\n  - Require at least 1 reviewer for approval before\
    \ merging (for administrators, this requirement weights twice than the others in this tier)\n  - For\
    \ administrators: Require PRs prior to make any code changes\n  - For administrators: Require branch\
    \ to be up to date before merging\n  - For administrators: Require approval of the most recent reviewable\
    \ push\n\nTier 3 Requirements (8/10 points):\n  - Require branch to pass at least 1 status check before\
    \ merging\n\nTier 4 Requirements (9/10 points):\n  - Require at least 2 reviewers for approval before\
    \ merging\n  - Require review from code owners\n\nTier 5 Requirements (10/10 points):\n  - For administrators:\
    \ Dismiss stale reviews and approvals when new commits are pushed\n  - For administrators: Include\
    \ administrator for review\n\nGitLab Integration Status:\n  - GitLab associates releases with commits\
    \ and not with the branch. Releases are ignored in this portion of the scoring."
  scoring_criteria_lines:
  - This test has tiered scoring.
  - Each tier must be fully satisfied to achieve points at the next tier.
  - For example, if you fulfill the Tier 3 checks but do not fulfill all the Tier 2 checks, you will not
    receive any points for Tier 3.
  - 'Note: If Scorecard is run without an administrative access token, the requirements that specify “For
    administrators” can be safely ignored, and scores will be determined as if all such requirements have
    been met.'
  - 'Tier 1 Requirements (3/10 points):'
  - 'Tier 2 Requirements (6/10 points):'
  - 'Tier 3 Requirements (8/10 points):'
  - 'Tier 4 Requirements (9/10 points):'
  - 'Tier 5 Requirements (10/10 points):'
  - Releases are ignored in this portion of the scoring.
  remediation:
  - Enable branch protection settings in your source hosting provider to avoid force pushes or deletion
    of your important branches.
  - For GitHub, check out the steps for rulesets [here](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/creating-rulesets-for-a-repository)
    and rules [here](https://docs.github.com/en/github/administering-a-repository/managing-a-branch-protection-rule).
  probes:
  - openssf-scorecard-checks#probe:blocksDeleteOnBranches
  - openssf-scorecard-checks#probe:blocksForcePushOnBranches
  - openssf-scorecard-checks#probe:branchesAreProtected
  - openssf-scorecard-checks#probe:branchProtectionAppliesToAdmins
  - openssf-scorecard-checks#probe:dismissesStaleReviews
  - openssf-scorecard-checks#probe:requiresApproversForPullRequests
  - openssf-scorecard-checks#probe:requiresCodeOwnersReview
  - openssf-scorecard-checks#probe:requiresLastPushApproval
  - openssf-scorecard-checks#probe:requiresUpToDateBranches
  - openssf-scorecard-checks#probe:runsStatusChecksBeforeMerging
  - openssf-scorecard-checks#probe:requiresPRsToChangeCode
  expects_deliverables:
  - branch protection / ruleset configuration
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
