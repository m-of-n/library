  testable: 'yes'
- id: openssf-scorecard-checks#probe:hasUnverifiedBinaryArtifacts
  designator: hasUnverifiedBinaryArtifacts
  kind_of_item: probe
  check: openssf-scorecard-checks#Binary-Artifacts
  group: null
  lifecycle: stable
  locator: probes/hasUnverifiedBinaryArtifacts/def.yml @v5.5.0
  short: Checks if the project has binary files in its source tree. The probe skips verified binary files
    which currently are gradle-wrappers.
  text: Binary files are not human readable so users and reviewers can't easily see what they do.
  implementation: The implementation looks for the presence of binary files that are not "verified". A
    verified binary is one that Scorecard considers valid for building and/or releasing the project. This
    is a more permissive probe than "hasBinaryArtifacts" which does not skip verified binary files.
  outcome:
  - If the probe finds unverified binary files, it returns OutcomeTrue for each unverified binary file
    found.
  - If the probe finds no unverified binary files, it returns OutcomeFalse.
  remediation:
    onOutcome: true
    effort: Medium
    text:
    - Remove the generated executable artifacts from the repository.
    - Build from source.
  ecosystem:
    languages:
