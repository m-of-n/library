  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Dependency-Update-Tool (rendered docs/checks.md#dependency-update-tool)
  short: Determines if the project uses a dependency update tool.
  text: 'Risk: `High` (possibly vulnerable to attacks on known flaws)


    This check tries to determine if the project uses a dependency update tool,

    specifically one of:

    - [Dependabot](https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates)

    - [Renovate bot](https://docs.renovatebot.com/configuration-options/)

    Out-of-date dependencies make a project vulnerable to known flaws and prone to attacks.

    These tools automate the process of updating dependencies by scanning for

    outdated or insecure requirements, and opening a pull request to update them if

    found.


    This check can determine only whether the dependency update tool is enabled; it

    does not ensure that the tool is run or that the tool''s pull requests are

    merged.


    Note: A project that fulfills this criterion with other tools may still receive

    a low score on this test. There are many ways to implement dependency updates,

    and it is challenging for an automated tool like Scorecard to detect them all. A

    low score is therefore not a definitive indication that the project is at risk.'
  scoring_criteria_lines:
  - 'Note: A project that fulfills this criterion with other tools may still receive a low score on this
    test.'
  - A low score is therefore not a definitive indication that the project is at risk.
  remediation:
  - Sign up for automatic dependency updates with one of the previously listed dependency update tools
    and place the config file in the locations that are recommended by these tools. Due to https://github.com/dependabot/dependabot-core/issues/2804
    Dependabot can be enabled for forks where security updates have ever been turned on so projects maintaining
    stable forks should evaluate whether this behavior is satisfactory before turning it on.
  - Unlike Dependabot, Renovate bot has support to migrate dockerfiles' dependencies from version pinning
    to hash pinning via the [pinDigests setting](https://docs.renovatebot.com/configuration-options/#pindigests)
    without additional manual effort.
  probes:
  - openssf-scorecard-checks#probe:dependencyUpdateToolConfigured
  expects_deliverables:
  - dependency-update tool configuration (e.g. dependabot.yml, renovate.json)
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Binary-Artifacts
  designator: Binary-Artifacts
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: process
