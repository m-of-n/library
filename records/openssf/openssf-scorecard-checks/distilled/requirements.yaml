  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Binary-Artifacts (rendered docs/checks.md#binary-artifacts)
  short: Determines if the project has generated executable (binary) artifacts in the source repository.
  text: "Risk: `High` (non-reviewable code)\n\nThis check determines whether the project has generated\
    \ executable (binary)\nartifacts in the source repository.\n\nIncluding generated executables in the\
    \ source repository increases user risk.\nMany programming language systems can generate executables\
    \ from source code\n(e.g., C/C++ generated machine code, Java `.class` files, Python `.pyc` files,\n\
    and minified JavaScript). Users will often directly use executables if they are\nincluded in the source\
    \ repository, leading to many dangerous behaviors.\n\nProblems with generated executable (binary)\
    \ artifacts:\n\n  - Binary artifacts cannot be reviewed, allowing possible obsolete or\n    maliciously\
    \ subverted executables. Reviews generally review source code, not\n    executables, since it's difficult\
    \ to audit executables to ensure that they\n    correspond to the source code. Over time the included\
    \ executables might not\n    correspond to the source code.\n  - Generated executables allow the executable\
    \ generation process to atrophy,\n    which can lead to an inability to create working executables.\
    \ These problems\n    can be countered with verified reproducible builds, but it's easier to\n   \
    \ implement verified reproducible builds when executables are not included in\n    the source repository\
    \ (since the executable generation process is less\n    likely to have atrophied).\n\nAllowed by Scorecard:\n\
    \n  - Files in the source repository that are simultaneously reviewable source\n    code and executables,\
    \ since these are reviewable. (Some interpretive\n    systems, such as many operating system shells,\
    \ don't have a mechanism for\n    storing generated executables that are different from the source\
    \ file.)\n  - Source code in the source repository generated by other tools (e.g., by\n    bison,\
    \ yacc, flex, and lex). There are potential downsides to generated\n    source code, but generated\
    \ source code tends to be much easier to review and\n    thus presents a lower risk. Generated source\
    \ code is also often difficult\n    for external tools to detect.\n  - Generated documentation in\
    \ source repositories. Generated documentation is\n    intended for use by humans (not computers)\
    \ who can evaluate the context.\n    Thus, generated documentation doesn't pose the same level of\
    \ risk."
  scoring_criteria_lines: []
  remediation:
  - Remove the generated executable artifacts from the repository.
  - Build from source.
  probes:
  - openssf-scorecard-checks#probe:hasUnverifiedBinaryArtifacts
  expects_deliverables: []
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Branch-Protection
  designator: Branch-Protection
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: implementation
  risk: High
