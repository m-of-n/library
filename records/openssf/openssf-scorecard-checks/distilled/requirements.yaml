  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Fuzzing (rendered docs/checks.md#fuzzing)
  short: Determines if the project uses fuzzing.
  text: "Risk: `Medium` (possible vulnerabilities in code)\n\nThis check tries to determine if the project\
    \ uses\n[fuzzing](https://owasp.org/www-community/Fuzzing) by checking:\n1. if the repository name\
    \ is included in the [OSS-Fuzz](https://github.com/google/oss-fuzz) project list;\n2. if [ClusterFuzzLite](https://google.github.io/clusterfuzzlite/)\
    \ is deployed in the repository;\n3. if there are user-defined language-specified fuzzing functions\
    \ in the repository.\n   - currently only supports [Go fuzzing](https://go.dev/doc/fuzz/),\n   - a\
    \ limited set of property-based testing libraries for Haskell including [QuickCheck](https://hackage.haskell.org/package/QuickCheck),\
    \ [Hedgehog](https://hedgehog.qa/), [validity](https://hackage.haskell.org/package/validity) or [SmallCheck](https://hackage.haskell.org/package/smallcheck),\n\
    \   - a limited set of property-based testing libraries for JavaScript and TypeScript including [fast-check](https://fast-check.dev/).\n\
    \   - a limited set of property-based testing libraries for Erlang, including proper and quickcheck.\n\
    \   - a limited set of property-based testing libraries for C# and F# including [FsCheck](https://github.com/fscheck/FsCheck).\n\
    \nFuzzing, or fuzz testing, is the practice of feeding unexpected or random data\ninto a program to\
    \ expose bugs. Regular fuzzing is important to detect\nvulnerabilities that may be exploited by others,\
    \ especially since attackers can\nalso use fuzzing to find the same flaws.\n\nNote: A project that\
    \ fulfills this criterion with other tools may still receive\na low score on this test. There are\
    \ many ways to implement fuzzing, and it is\nchallenging for an automated tool like Scorecard to detect\
    \ them all. A low score\nis therefore not a definitive indication that the project is at risk."
  scoring_criteria_lines:
  - 'Note: A project that fulfills this criterion with other tools may still receive a low score on this
    test.'
  - A low score is therefore not a definitive indication that the project is at risk.
  remediation:
  - Integrate the project with OSS-Fuzz by following the instructions [here](https://google.github.io/oss-fuzz/).
  probes:
  - openssf-scorecard-checks#probe:fuzzed
  expects_deliverables:
  - fuzzing integration (e.g. OSS-Fuzz, ClusterFuzzLite, language fuzz tests)
