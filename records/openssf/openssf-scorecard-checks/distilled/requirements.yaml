    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Packaging
  designator: Packaging
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: release
  risk: Medium
  weight: 5
  tags:
  - supply-chain
  - security
  - releases
  repos:
  - GitHub
  - local
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Packaging (rendered docs/checks.md#packaging)
  short: Determines if the project is published as a package that others can easily download, install,
    easily update, and uninstall.
  text: "Risk: `Medium` (users possibly missing security updates)\n\nThis check tries to determine if\
    \ the project is published as a package. It is\ncurrently limited to repositories hosted on GitHub,\
    \ and does not support other\nsource hosting repositories (i.e., Forges).\n\nPackages give users of\
    \ a project an easy way to download, install, update, and\nuninstall the software by a package manager.\
    \ In particular, they make it easy\nfor users to receive security patches as updates.\n\nThe check\
    \ currently looks for\n[GitHub packaging workflows](https://docs.github.com/en/packages/learn-github-packages/publishing-a-package)\n\
    and language-specific GitHub Actions that upload the package to a corresponding\nhub, e.g., [Npm](https://www.npmjs.com/).\
    \ We plan to add better support to query\npackage manager hubs directly in the future, e.g., for\n\
    [Npm](https://www.npmjs.com/), [PyPi](https://pypi.org/).\n\nYou can create a package in several ways:\n\
    \n  - Many program language ecosystems have a generally-used packaging format\n    supported by a\
    \ language-level package manager tool and public package\n    repository.\n  - Many operating system\
    \ platforms also have at least one package format,\n    tool, and public repository (in some cases\
    \ the source repository generates\n    system-independent source packages, which are then used by\
    \ others to\n    generate system executable packages).\n  - Using container images.\n\nNote: A project\
    \ that fulfills this criterion with other tools may still receive\na low score on this test. There\
    \ are many ways to package software, and it is\nchallenging for an automated tool like Scorecard to\
    \ detect them all. A low\nscore is therefore not a definitive indication that the project is at risk.\
    \ If\nScorecard fails to detect the way you publish a package and you think we should\nsupport your\
    \ use case, please let us know by [opening an\nissue](https://github.com/ossf/scorecard/issues/new/choose)."
  scoring_criteria_lines:
  - 'Note: A project that fulfills this criterion with other tools may still receive a low score on this
    test.'
  - A low score is therefore not a definitive indication that the project is at risk.
  remediation:
  - Publish your project as a downloadable package, e.g., if hosted on GitHub, use [GitHub's mechanisms
    for publishing a package](https://docs.github.com/en/packages/learn-github-packages/publishing-a-package).
  - If hosted on GitHub, use a GitHub action to release your package to language-specific hubs.
  probes:
  - openssf-scorecard-checks#probe:packagedWithAutomatedWorkflow
  expects_deliverables:
  - automated packaging/publishing workflow
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Pinned-Dependencies
  designator: Pinned-Dependencies
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: supply-chain
  risk: Medium
  weight: 5
  tags:
  - supply-chain
  - security
  - dependencies
  repos:
  - GitHub
  - GitLab
  - Azure DevOps
  - local
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Pinned-Dependencies (rendered docs/checks.md#pinned-dependencies)
  short: Determines if the project has declared and pinned the dependencies of its build process.
  text: "Risk: `Medium` (possible compromised dependencies)\n\nThis check tries to determine if the project\
    \ pins dependencies used during its build and release process.\nA \"pinned dependency\" is a dependency\
    \ that is explicitly set to a specific hash instead of\nallowing a mutable version or range of versions.\
    \ It\nis currently limited to repositories hosted on GitHub, and does not support\nother source hosting\
    \ repositories (i.e., Forges).\n\nThe check works by looking for unpinned dependencies in Dockerfiles,\
    \ shell scripts, and GitHub workflows\nwhich are used during the build and release process of a project.\n\
    Special considerations for Go modules treat full semantic versions as pinned\ndue to how the Go tool\
    \ verifies downloaded content against the hashes when anyone first downloaded the module.\n\nPinned\
    \ dependencies reduce several security risks:\n\n  - They ensure that checking and deployment are\
    \ all done with the same\n    software, reducing deployment risks, simplifying debugging, and enabling\n\
    \    reproducibility.\n  - They can help mitigate compromised dependencies from undermining the\n\
    \    security of the project (in the case where you've evaluated the pinned\n    dependency, you are\
    \ confident it's not compromised, and a later version is\n    released that is compromised).\n  -\
    \ They are one way to [counter dependency confusion (aka substitution) attacks](https://azure.microsoft.com/en-us/resources/3-ways-to-mitigate-risk-using-private-package-feeds/),\n\
    \    in which an application uses multiple feeds to acquire software packages (a\n    \"hybrid configuration\"\
    ), and attackers fool the user into using a malicious\n    package via a feed that was not expected\
    \ for that package.\n\nHowever, pinning dependencies can inhibit software updates, either because\
    \ of a\nsecurity vulnerability or because the pinned version is compromised. Mitigate\nthis risk by:\n\
    \n  - using automated tools to notify applications when their dependencies are\n    outdated;\n  -\
    \ quickly updating applications that do pin dependencies.\n\nFor projects hosted on GitHub, you can\
    \ learn more about\ndependencies using the [GitHub dependency graph](https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-the-dependency-graph)."
  scoring_criteria_lines: []
  remediation:
  - If your project is producing an application, declare all your dependencies with specific versions
    in your package format file (e.g. `package.json` for npm, `requirements.txt` for python, `packages.config`
    for nuget). For C/C++, check in the code from a trusted source and add a `README` on the specific
    version used (and the archive SHA hashes).
  - If your project is producing an application and the package manager supports lock files (e.g. `package-lock.json`
    for npm), make sure to check these in the source code as well. These files maintain signatures for
    the entire dependency tree and saves from future exploitation in case the package is compromised.
  - For Dockerfiles used in building and releasing your project, pin dependencies by hash. See [Dockerfile](https://github.com/ossf/scorecard/blob/main/cron/internal/worker/Dockerfile)
    for example. If you are using a manifest list to support builds across multiple architectures, you
    can pin to the manifest list hash instead of a single image hash. You can use a tool like [crane](https://github.com/google/go-containerregistry/blob/main/cmd/crane/README.md)
    to obtain the hash of the manifest list like in this [example](https://github.com/ossf/scorecard/issues/1773#issuecomment-1076699039).
  - For GitHub workflows used in building and releasing your project, pin dependencies by hash. See [main.yaml](https://github.com/ossf/scorecard/blob/f55b86d6627cc3717e3a0395e03305e81b9a09be/.github/workflows/main.yml#L27)
    for example. To determine the permissions needed for your workflows, you may use [StepSecurity's online
    tool](https://app.stepsecurity.io/secureworkflow/) by ticking the "Pin actions to a full length commit
    SHA". You may also tick the "Restrict permissions for GITHUB_TOKEN" to fix issues found by the Token-Permissions
    check.
  - To help update your dependencies after pinning them, use tools such as those listed for the dependency
    update tool check.
  probes:
  - openssf-scorecard-checks#probe:pinsDependencies
  expects_deliverables:
  - hash-pinned dependency declarations
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#SAST
  designator: SAST
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: verification
  risk: Medium
  weight: 5
  tags:
  - supply-chain
  - security
  - testing
  repos:
  - GitHub
  - Azure DevOps
  - local
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.SAST (rendered docs/checks.md#sast)
  short: Determines if the project uses static code analysis.
  text: 'Risk: `Medium` (possible unknown bugs)


    This check tries to determine if the project uses Static Application Security

    Testing (SAST), also known as [static code analysis](https://owasp.org/www-community/controls/Static_Code_Analysis).

    It is currently limited to repositories hosted on GitHub, and does not support

    other source hosting repositories (i.e., Forges).


    SAST is testing run on source code before the application is run. Using SAST

    tools can prevent known classes of bugs from being inadvertently introduced in the

    codebase.


    The checks currently looks for known GitHub apps such as

    [CodeQL](https://codeql.github.com/) (github-code-scanning) or

    [SonarCloud](https://sonarcloud.io/) in the recent (~30) merged PRs, or the use

    of "github/codeql-action" in a GitHub workflow. It also checks for the deprecated

    [LGTM](https://lgtm.com/) service until its forthcoming shutdown.


    Note: A project that fulfills this criterion with other tools may still receive

    a low score on this test. There are many ways to implement SAST, and it is

    challenging for an automated tool like Scorecard to detect them all. A low score

    is therefore not a definitive indication that the project is at risk.'
  scoring_criteria_lines:
  - 'Note: A project that fulfills this criterion with other tools may still receive a low score on this
    test.'
  - A low score is therefore not a definitive indication that the project is at risk.
  remediation:
  - Run CodeQL checks in your CI/CD by following the instructions [here](https://github.com/github/codeql-action#usage).
  probes:
  - openssf-scorecard-checks#probe:sastToolConfigured
  - openssf-scorecard-checks#probe:sastToolRunsOnAllCommits
  expects_deliverables:
  - SAST tool configuration and results on commits
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#SBOM
  designator: SBOM
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: release
  risk: Medium
  weight: 5
  tags:
  - supply-chain
  - security
  - vulnerabilities
  - dependencies
  - SBOM
  repos:
  - GitHub
  - Gitlab
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.SBOM (rendered docs/checks.md#sbom)
  short: Determines if the project maintains a Software Bill of Materials.
  text: "Risk: `Medium` (possible inaccurate reporting of dependencies/vulnerabilities)\n\nThis check\
    \ tries to determine if the project maintains a Software Bill of Materials (SBOM)\neither as a file\
    \ in the source or a release artifact. \n\nAn SBOM can give users information about what dependencies\
    \ your project has which\nallows them to identify vulnerabilities in the software supply chain.\n\n\
    Standards to be used during checks;\n- OSSF SBOM Everywhere SIG naming and directory conventions:\n\
    \  - <https://github.com/ossf/SBOM-everywhere/blob/main/reference/sbom_naming.md#consistent-naming-conventions>\n\
    \nThis check currently looks for the existence of an SBOM in the\nsource of a project and as a pipeline\
    \ or release artifact.\n\nAn SBOM Exists (one or more) (5/10 points):\n  - Any SBOM found counts for\
    \ this test either in source. pipeline or release. \n  - A SBOM stored with your source code is not\
    \ ideal, but is a good first step.\n  \\* It is recommended to publish with your release artifacts.\n\
    \nAn SBOM is published as a release artifact (5/10 points):\n  - This is the preferred way to store\
    \ an SBOM, and will be awarded full points.\n  - Checks release artifacts for an SBOM file matching\
    \ established standards"
  scoring_criteria_lines:
  - 'An SBOM Exists (one or more) (5/10 points):'
  - 'An SBOM is published as a release artifact (5/10 points):'
  - '- This is the preferred way to store an SBOM, and will be awarded full points.'
  remediation:
  - For Gitlab, see more information [here](https://docs.gitlab.com/ee/user/application_security/dependency_scanning/index.html#cyclonedx-software-bill-of-materials).
  - For GitHub, see more information [here](https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-supply-chain-security).
  - Alternatively, there are other tools available to generate [CycloneDX](https://cyclonedx.org/tool-center/)
    and [SPDX](https://spdx.dev/use/tools/) SBOMs.
  probes:
  - openssf-scorecard-checks#probe:hasSBOM
  - openssf-scorecard-checks#probe:hasReleaseSBOM
  expects_deliverables:
  - SBOM file in repo and/or release assets
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Security-Policy
  designator: Security-Policy
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: operations/response
  risk: Medium
  weight: 5
  tags:
  - supply-chain
  - security
  - policy
  repos:
  - GitHub
  - GitLab
  - Azure DevOps
  - local
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Security-Policy (rendered docs/checks.md#security-policy)
  short: Determines if the project has published a security policy.
  text: "Risk: `Medium` (possible insecure reporting of vulnerabilities)\n\nThis check tries to determine\
    \ if the project has published a security policy. It\nworks by looking for a file named `SECURITY.md`\
    \ (case-insensitive) in a few\nwell-known directories.\n\nA security policy (typically a `SECURITY.md`\
    \ file) can give users information\nabout what constitutes a vulnerability and how to report one securely\
    \ so that\ninformation about a bug is not publicly visible.\n\nThis check examines the contents of\
    \ the security policy file awarding points\nfor those policies that express vulnerability process(es),\
    \ disclosure timelines,\nand have links (e.g., URL(s) and email(s)) to support the users.\n\nLinking\
    \ Requirements (one or more) (6/10 points):\n  - A valid form of an email address to contact for vulnerabilities\n\
    \  - A valid form of a http/https address to support vulnerability reporting\n\nFree Form Text (3/10\
    \ points):\n  - Free form text is present in the security policy file which is beyond\n    simply\
    \ having a http/https address and/or email in the file\n  - The string length of any such links in\
    \ the policy file do not count\n    towards detecting free form text\n\nSecurity Policy Specific Text\
    \ (1/10 points):\n  - Specific text providing basic or general information about vulnerability\n \
    \   and disclosure practices, expectations, and/or timelines\n  - Text should include a total of 2\
    \ or more hits which match (case-insensitive)\n    `vuln` and as in \"Vulnerability\" or \"vulnerabilities\"\
    ;\n    `disclos` as \"Disclosure\" or \"disclose\";\n    and numbers which convey expectations of\
    \ times, e.g., 30 days or 90 days"
  scoring_criteria_lines:
  - This check examines the contents of the security policy file awarding points for those policies that
    express vulnerability process(es), disclosure timelines, and have links (e.g., URL(s) and email(s))
    to support the users.
  - 'Linking Requirements (one or more) (6/10 points):'
  - 'Free Form Text (3/10 points):'
  - 'Security Policy Specific Text (1/10 points):'
  remediation:
  - Place a security policy file `SECURITY.md` in the root directory of your repository. This makes it
    easily discoverable by a vulnerability reporter.
  - The file should contain information on what constitutes a vulnerability and a way to report it securely
    (e.g. issue tracker with private issue support, encrypted email with a published public key). Follow
    the [coordinated vulnerability disclosure guidelines](https://github.com/ossf/oss-vulnerability-guide/blob/main/maintainer-guide.md)
    to respond to vulnerability disclosures.
  - For GitHub, see more information [here](https://docs.github.com/en/code-security/getting-started/adding-a-security-policy-to-your-repository).
  probes:
  - openssf-scorecard-checks#probe:securityPolicyPresent
  - openssf-scorecard-checks#probe:securityPolicyContainsLinks
  - openssf-scorecard-checks#probe:securityPolicyContainsVulnerabilityDisclosure
  - openssf-scorecard-checks#probe:securityPolicyContainsText
  expects_deliverables:
  - SECURITY.md (security policy)
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Signed-Releases
  designator: Signed-Releases
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: release
  risk: High
  weight: 7.5
  tags:
  - supply-chain
  - security
  - releases
  repos:
  - GitHub
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Signed-Releases (rendered docs/checks.md#signed-releases)
  short: Determines if the project cryptographically signs release artifacts.
  text: 'Risk: `High` (possibility of installing malicious releases)


    This check tries to determine if the project cryptographically signs release

    artifacts. It is currently limited to repositories hosted on GitHub, and does

    not support other source hosting repositories (i.e., Forges).


    Signed releases attest to the provenance of the artifact.


    This check looks for the following filenames in the project''s last five

    [release assets](https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases):

    [*.minisig](https://github.com/jedisct1/minisign), *.asc (pgp),

    *.sig, *.sign, *.sigstore, *.sigstore.json, [*.intoto.jsonl](https://slsa.dev).


    If a signature is found in the assets for each release, a score of 8 is given.

    If a [SLSA provenance file](https://slsa.dev/spec/v0.1/index) is found in the assets for each release
    (*.intoto.jsonl), the maximum score of 10 is given.


    This check looks for the 30 most recent releases associated with an artifact. It ignores the source
    code-only releases that are created automatically by GitHub.


    Note: The check does not verify the signatures.'
  scoring_criteria_lines:
  - If a signature is found in the assets for each release, a score of 8 is given.
  - If a [SLSA provenance file](https://slsa.dev/spec/v0.1/index) is found in the assets for each release
    (*.intoto.jsonl), the maximum score of 10 is given.
  remediation:
  - Publish the release.
  - Generate a signing key.
  - Download the release as an archive locally.
  - Sign the release archive with this key (should output a signature file).
  - Attach the signature file next to the release archive.
  - If the source is hosted on GitHub, check out the steps [here](https://wiki.debian.org/Creating%20signed%20GitHub%20releases).
  probes:
  - openssf-scorecard-checks#probe:releasesAreSigned
  - openssf-scorecard-checks#probe:releasesHaveProvenance
  expects_deliverables:
  - release signatures
  - SLSA provenance (*.intoto.jsonl) in release assets
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Token-Permissions
  designator: Token-Permissions
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: implementation
  risk: High
  weight: 7.5
  tags:
  - supply-chain
  - security
  - infrastructure
  repos:
  - GitHub
  - local
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Token-Permissions (rendered docs/checks.md#token-permissions)
  short: Determines if the project's workflows follow the principle of least privilege.
  text: 'Risk: `High` (vulnerable to malicious code additions)


    This check determines whether the project''s automated workflows tokens follow the

    principle of least privilege. This is important because attackers may use a

    compromised token with write access to, for example, push malicious code into the

    project.


    It is currently limited to repositories hosted on GitHub, and does not support

    other source hosting repositories (i.e., Forges).


    The highest score is awarded when the permissions definitions in each workflow''s

    yaml file are set as read-only at the

    [top level](https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#permissions)

    and the required write permissions are declared at the

    [run-level](https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idpermissions).

    One point is reduced from the score if all jobs have their permissions defined but the top level permissions
    are not defined.

    This configuration is secure, but there is a chance that when a new job is added to the workflow,
    its job permissions could be

    left undefined because of human error.


    Though a project''s score won''t be penalized, the check''s details will include

    warnings for more sensitive run-level permissions, listed below:


    * `actions` - May allow an attacker to steal GitHub secrets by approving to run an action that needs
    approval.

    * `checks` - May allow an attacker to remove pre-submit checks and introduce a bug.

    * `contents` - Allows an attacker to commit unreviewed code. However, points are not reduced if the
    job utilizes a recognized packaging action or command.

    * `deployments` - May allow an attacker to charge repo owner by triggering VM runs, and tiny chance
    an attacker can trigger a remote service with code they own if server accepts code/location variables
    unsanitized.

    * `packages` - Allows an attacker to publish packages. However, points are not reduced if the job
    utilizes a recognized packaging action or command.

    * `security-events` - May allow an attacker to read vulnerability reports before a patch is available.
    However, points are not reduced if the job utilizes a recognized action for uploading SARIF results.

    * `statuses` - May allow an attacker to change the result of pre-submit checks and get a PR merged.


    This compromise makes it clear the maintainer has done what''s possible to use those permissions safety,

    but allows users to identify that the permissions are used.


    The check cannot detect if the "read-only" GitHub permission setting is

    enabled, as there is no API available.'
  scoring_criteria_lines:
  - The highest score is awarded when the permissions definitions in each workflow's yaml file are set
    as read-only at the [top level](https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#permissions)
    and the required write permissions are declared at the [run-level](https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idpermissions).
  - One point is reduced from the score if all jobs have their permissions defined but the top level permissions
    are not defined.
  - 'Though a project''s score won''t be penalized, the check''s details will include warnings for more
    sensitive run-level permissions, listed below:'
  - However, points are not reduced if the job utilizes a recognized packaging action or command.
  - However, points are not reduced if the job utilizes a recognized packaging action or command.
  - However, points are not reduced if the job utilizes a recognized action for uploading SARIF results.
  remediation:
  - 'Set top-level permissions as `read-all` or `contents: read` as described in GitHub''s [documentation](https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#permissions).'
  - 'Set any required write permissions at the job-level. Only set the permissions required for that job;
    do not set `permissions: write-all` at the job level.'
  - To help determine the permissions needed for your workflows, you may use [StepSecurity's online tool](https://app.stepsecurity.io/secureworkflow/)
    by ticking the "Restrict permissions for GITHUB_TOKEN". You may also tick the "Pin actions to a full
    length commit SHA" to fix issues found by the Pinned-dependencies check.
  probes:
  - openssf-scorecard-checks#probe:hasNoGitHubWorkflowPermissionUnknown
  - openssf-scorecard-checks#probe:jobLevelPermissions
  - openssf-scorecard-checks#probe:topLevelPermissions
  expects_deliverables:
  - workflow permissions declarations
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Vulnerabilities
  designator: Vulnerabilities
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: process
  phase: operations/response
  risk: High
  weight: 7.5
  tags:
  - supply-chain
  - security
  - vulnerabilities
  repos:
  - GitHub
  - GitLab
  - Azure DevOps
  - local
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Vulnerabilities (rendered docs/checks.md#vulnerabilities)
  short: Determines if the project has open, known unfixed vulnerabilities.
  text: "Risk: `High`  (known vulnerabilities)\n\nThis check determines whether the project has open,\
    \ unfixed vulnerabilities \nin its own codebase or its dependencies using the [OSV (Open Source Vulnerabilities)](https://osv.dev/)\
    \ service.\nAn open vulnerability is readily exploited by attackers and should be fixed as soon as\n\
    possible."
  scoring_criteria_lines: []
  remediation:
  - Fix the vulnerabilities in your own code base. The details of each vulnerability can be found on <https://osv.dev>.
  - If the vulnerability is in a dependency, update the dependency to a non-vulnerable version. If no
    update is available, consider whether to remove the dependency.
  - If you believe the vulnerability does not affect your project, the  vulnerability can be ignored.  To
    ignore, create an `osv-scanner.toml` file next to the dependency manifest (e.g. package-lock.json)
    and specify the ID to ignore and reason. Details on the structure of `osv-scanner.toml` can be found
    on  [OSV-Scanner repository](https://github.com/google/osv-scanner#ignore-vulnerabilities-by-id).
  probes:
  - openssf-scorecard-checks#probe:hasOSVVulnerabilities
  expects_deliverables: []
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#Dangerous-Workflow
  designator: Dangerous-Workflow
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: process
  phase: implementation
  risk: Critical
  weight: 10
  tags:
  - supply-chain
  - security
  - infrastructure
  repos:
  - GitHub
  - local
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.Dangerous-Workflow (rendered docs/checks.md#dangerous-workflow)
  short: Determines if the project's GitHub Action workflows avoid dangerous patterns.
  text: 'Risk: `Critical`  (vulnerable to repository compromise)


    This check determines whether the project''s GitHub Action workflows has dangerous

    code patterns. Some examples of these patterns are untrusted code checkouts,

    logging github context and secrets, or use of potentially untrusted inputs in scripts.

    The following patterns are checked:


    Untrusted Code Checkout: This is the misuse of potentially dangerous triggers.

    This checks if a `pull_request_target` or `workflow_run` workflow trigger was used in conjunction

    with an explicit pull request checkout. Workflows triggered with `pull_request_target` / `workflow_run`

    have write permission to the target repository and access to target repository

    secrets. With the PR checkout, PR authors may compromise the repository, for

    example, by using build scripts controlled by the author of the PR or reading

    token in memory. This check does not detect whether untrusted code checkouts are

    used safely, for example, only on pull request that have been assigned a label.


    Script Injection with Untrusted Context Variables: This pattern detects whether a

    workflow''s inline script may execute untrusted input from attackers. This occurs when

    an attacker adds malicious commands and scripts to a context. When a workflow runs,

    these strings may be interpreted as code that is executed on the runner. Attackers

    can add their own content to certain github context variables that are considered

    untrusted, for example, `github.event.issue.title`. These values should not flow

    directly into executable code.


    The highest score is awarded when all workflows avoid the dangerous code patterns.'
  scoring_criteria_lines:
  - The highest score is awarded when all workflows avoid the dangerous code patterns.
  remediation:
  - Avoid the dangerous workflow patterns. See this [post](https://securitylab.github.com/research/github-actions-preventing-pwn-requests/)
    for information on avoiding untrusted code checkouts. See this [document](https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections)
    for information on avoiding and mitigating the risk of script injections.
  probes:
  - openssf-scorecard-checks#probe:hasDangerousWorkflowScriptInjection
  - openssf-scorecard-checks#probe:hasDangerousWorkflowUntrustedCheckout
  expects_deliverables: []
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#License
  designator: License
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: governance
  risk: Low
  weight: 2.5
  tags:
  - license
  repos:
  - GitHub
  - GitLab
  - Azure DevOps
  - local
  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.License (rendered docs/checks.md#license)
  short: Determines if the project has defined a license.
  text: "Risk: `Low` (possible impediment to security review)\n\nThis check tries to determine if the\
    \ project has published a license. It\nworks by using either hosting APIs or by checking standard\
    \ locations\nfor a file named according to common conventions for licenses.\n\nA license can give\
    \ users information about how the source code may or may\nnot be used. The lack of a license will\
    \ impede any kind of security review\nor audit and creates a legal risk for potential users.\n\nScorecard\
    \ uses the\n[GitHub License API](https://docs.github.com/en/rest/licenses#get-the-license-for-a-repository)\n\
    for GitHub hosted projects. Otherwise, Scorecard uses its own heuristics to\ndetect a published license\
    \ file.\n\nOn its own, this check will detect files in the top-level directory with\nany combination\
    \ of the following names and extensions:`LICENSE`, `LICENCE`,\n`COPYING`, `COPYRIGHT` and having common\
    \ extensions such as `.html`, `.txt`,\nor `.md`. It will also detect these files in a directory named\
    \ `LICENSES`.\n(Files in a `LICENSES` directory are typically named as their\n[SPDX](https://spdx.org/licenses/)\
    \ license identifier followed by an\nappropriate file extension, as described in the [REUSE Specification](https://reuse.software/spec/).)\n\
    \nLicense Requirements:\n  - A detected `LICENSE`, `COPYRIGHT`, or `COPYING` filename, or license\n\
    \    files in a `LICENSES` directory (6/10 points)\n  - The detected file is at the top-level directory\
    \ (3/10 points)\n  - A [FSF or OSI](https://spdx.org/licenses/) license is specified (1/10 points)"
  scoring_criteria_lines:
  - '- A detected `LICENSE`, `COPYRIGHT`, or `COPYING` filename, or license files in a `LICENSES` directory
    (6/10 points)'
  - '- The detected file is at the top-level directory (3/10 points)'
  - '- A [FSF or OSI](https://spdx.org/licenses/) license is specified (1/10 points)'
  remediation:
  - Determine [which license](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/licensing-a-repository)
    to apply to your project. For GitHub hosted projects, follow those instructions to establish a license
    for your project.
  - For other hosting environments, create the license in a `.adoc`, `.asc`, `.docx`, `.doc`, `.ext`,
    `.html`, `.markdown`, `.md`, `.rst`, `.txt`, or `.xml`, named `LICENSE`, `COPYRIGHT`, or `COPYING`,
    and place it in the top-level directory. To identify a specific license, use an [SPDX license identifier](https://spdx.org/licenses/)
    in the filename. Examples include `LICENSE.md`, `Apache-2.0-LICENSE.md` or `LICENSE-Apache-2.0`.
  - Alternately, create a `LICENSES` directory and add a license file(s) with a name that matches your
    [SPDX license identifier](https://spdx.org/licenses/). such as `LICENSES/Apache-2.0.txt`.
  probes:
  - openssf-scorecard-checks#probe:hasLicenseFile
  - openssf-scorecard-checks#probe:hasFSFOrOSIApprovedLicense
  expects_deliverables:
  - LICENSE file
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
