- id: openssf-scorecard-checks#probe:releasesAreSigned
  designator: releasesAreSigned
  kind_of_item: probe
  check: openssf-scorecard-checks#Signed-Releases
  group: null
  lifecycle: stable
  locator: probes/releasesAreSigned/def.yml @v5.5.0
  short: Check that the projects GitHub and GitLab releases are signed.
  text: Signed releases allow consumers to verify their artifacts before consuming them.
  implementation: The implementation checks whether a signature file is present in release assets. The
    probe checks the last 5 releases on GitHub and GitLab.
  outcome:
  - For each of the last 5 releases, the probe returns OutcomeTrue, if the release has a signature file
    in the release assets.
  - For each of the last 5 releases, the probe returns OutcomeFalse, if the release does not have a signature
    file in the release assets.
  - If the project has no releases, the probe returns OutcomeNotApplicable.
  remediation:
    onOutcome: false
    effort: Medium
    text:
    - Install Cosign by following https://docs.sigstore.dev/system_config/installation
    - Sign your release artifacts using `cosign sign $YOUR_ARTIFACT`. See more at https://docs.sigstore.dev/signing/quickstart
    - Publish your release and add the certificate and signature produced by Cosign.
  ecosystem:
    languages:
    - all
    clients:
    - github
    - gitlab
  kind: stated
  testable: 'yes'
