      .rst, .txt, or .xml, named LICENSE, COPYRIGHT, or COPYING, and place it in the top-level directory.
      To identify a specific license, use an SPDX license identifier in the filename. Examples include
      LICENSE.md, Apache-2.0-LICENSE.md or LICENSE-Apache-2.0.
    - Alternately, create a LICENSE directory and add a license file(s) with a name that matches your
