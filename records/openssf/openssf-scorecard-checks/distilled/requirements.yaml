  locator: docs/checks/internal/checks.yaml @v5.5.0 — checks.CI-Tests (rendered docs/checks.md#ci-tests)
  short: Determines if the project runs tests before pull requests are merged.
  text: "Risk: `Low` (possible unknown vulnerabilities)\n\nThis check tries to determine if the project\
    \ runs tests before pull requests are\nmerged. It is currently limited to repositories hosted on GitHub,\
    \ and does not\nsupport other source hosting repositories (i.e., Forges). This check only \nconsiders\
    \ tests which run successfully.\n\nRunning tests helps developers catch mistakes early on, which can\
    \ reduce the\nnumber of vulnerabilities that find their way into a project.\n\nThe check works by\
    \ looking for a set of CI-system names in GitHub `CheckRuns`\nand `Statuses` among the recent commits\
    \ (~30). A CI-system is considered\nwell-known if its name contains any of the following: appveyor,\
    \ buildkite,\ncircleci, e2e, github-actions, jenkins, mergeable, test, travis-ci, woodpecker.\n\n\
    Note: A project that fulfills this criterion with other tools may still receive\na low score on this\
    \ test. There are many ways to implement CI testing, and it is\nchallenging for an automated tool\
    \ like Scorecard to detect them all. A low score\nis therefore not a definitive indication that the\
    \ project is at risk.\n\nIf a project's system was not detected and you think it should be, please\n\
    [open an issue in the scorecard project](https://github.com/ossf/scorecard/issues/new/choose)."
  scoring_criteria_lines:
  - 'Note: A project that fulfills this criterion with other tools may still receive a low score on this
    test.'
  - A low score is therefore not a definitive indication that the project is at risk.
  remediation:
  - Check-in scripts that run all the tests in your repository.
  - Integrate those scripts with a CI/CD platform that runs it on every pull request (e.g. if hosted on
    GitHub, [GitHub Actions](https://docs.github.com/en/actions/learn-github-actions/introduction-to-github-actions),
    [Prow](https://github.com/kubernetes/test-infra/tree/master/prow), etc).
  probes:
  - openssf-scorecard-checks#probe:testsRunInCI
  expects_deliverables:
  - CI test runs on pull requests
  verification: 'automated: Scorecard check run (0–10 score, or inconclusive -1/?) against the repository
    via the forge API'
  kind: stated
  testable: 'yes'
- id: openssf-scorecard-checks#CII-Best-Practices
  designator: CII-Best-Practices
  kind_of_item: check
  normativity: heuristic-check
  verb: determines
  actor: project (repository) — evaluated by the Scorecard tool
  nature: deliverable
  phase: governance
  risk: Low
