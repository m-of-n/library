    may simply not have any recent issues; In this case, the probe results can be disregarded.
  implementation: The probe checks whether collaborators, members or owners of a project have participated
    in issues in the last 90 days.
  outcome:
  - If collaborators, members or owners have participated in issues in the last 90 days, the probe returns
    one OutcomeTrue. The probe also returns a "numberOfIssuesUpdatedWithinThreshold" value with represents
    the number of issues on the repository which project collaborators, members or owners have shown activity
    in.
  - If collaborators, members or owners have NOT participated in issues in the last 90 days, the probe
    returns a single OutcomeFalse.
  remediation:
    onOutcome: false
    effort: High
    text:
    - It is not possible for users of a project to affect the issue activity of collaborators, members
      or owners of a project.
  ecosystem:
    languages:
    - all
    clients:
    - github
    - gitlab
  kind: stated
  testable: 'yes'
