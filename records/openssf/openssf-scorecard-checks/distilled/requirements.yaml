- id: openssf-scorecard-checks#probe:hasPermissiveLicense
  designator: hasPermissiveLicense
  kind_of_item: probe
  check: null
  group: Uncategorized
  lifecycle: stable
  locator: probes/hasPermissiveLicense/def.yml @v5.5.0
  short: Check that the project has a permissive license.
  text: A permissive license allows users to use the analyzed component to be used in derivative works.
    Non-permissive licenses (as copyleft licenses) might be a legal risk for potential users.
  implementation: The implementation checks whether a permissive license is present
  outcome:
  - If a license file is found and is permissive, the probe returns a single OutcomeTrue.
  - If a license file is missing the probe returns a single OutcomeFalse.
  - If the license is not permissive, the probe returns a single OutcomeFalse.
  remediation:
    onOutcome: false
