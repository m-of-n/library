- id: openssf-scorecard-checks#probe:requiresPRsToChangeCode
  designator: requiresPRsToChangeCode
  kind_of_item: probe
  check: openssf-scorecard-checks#Branch-Protection
  group: null
  lifecycle: stable
  locator: probes/requiresPRsToChangeCode/def.yml @v5.5.0
  short: Check that the project requires pull requests to change code.
  text: Changing code through pull requests promotes testing and reviews of the suggested change.
  implementation: The probe checks which branches require pull requests to change the branches' code.
    The probe only considers default and release branches.
  outcome:
  - The probe returns one OutcomeTrue for each branch that requires pull requests to change code, and
    one OutcomeFalse for branches that don't.
  remediation:
    onOutcome: false
    effort: Low
    text:
    - Configure the project such that contributors must make PRs to change code.
    - For GitHub-hosted projects, see [the Pull Requests documentation](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests).
    - For Gitlab-hosted projects, see [the Merge Requests documentation](https://docs.gitlab.com/ee/user/project/merge_requests/).
    markdown:
    - Configure the project such that contributors must make PRs to change code.
    - For GitHub-hosted projects, see [the Pull Requests documentation](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests).
    - For Gitlab-hosted projects, see [the Merge Requests documentation](https://docs.gitlab.com/ee/user/project/merge_requests/).
