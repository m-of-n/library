      - "rejected-additional"
  - id: "M02"
    name: "vsa-issuance"
    locator: "§2, §3, §3.2, §6"
    actor: "verifier"
    protocol_flow: "F01"
    purpose: >-
      One evaluation by a verifier, from inputs to a delivered VSA. The source fixes the outcome encoding
      (PASSED or FAILED, and what verifiedLevels holds in each case) and the predicate's content; the
      order, signing and delivery are this model's. There is no error state: the source defines no failure
      of issuance, and a failed evaluation is an outcome the VSA carries (E11).
    initial: "idle"
    states:
      - name: "idle"
        meaning: "No evaluation running."
        kind: "inferred"
        inferred_reason: "An entry state."
      - name: "inputs-held"
        meaning: "The verifier holds the artifact, a bundle of attestations and the policy."
        kind: "inferred"
        inferred_reason: "§2 names the inputs; how they arrive is not stated (OI-01)."
      - name: "evaluated"
        meaning: "The evaluation against the policy is done; the outcome is a pass or a fail."
        kind: "stated"
      - name: "result-encoded"
        meaning: "verificationResult and verifiedLevels are set from the outcome."
        kind: "stated"
      - name: "dependencies-encoded"
        meaning: "dependencyLevels is set (M03) or deliberately left unset."
        kind: "inferred"
        inferred_reason: "A modelling step; the source orders nothing in issuance."
      - name: "predicate-built"
        meaning: "Every predicate field is set."
        kind: "stated"
      - name: "signed"
        meaning: "The Statement is signed as a VSA envelope."
        kind: "inferred"
        inferred_reason: "Presupposed by §5 step 1; signing is never described."
      - name: "issued"
        meaning: "The VSA has left the verifier."
        kind: "inferred"
        inferred_reason: "Delivery is not described (OI-01)."
        terminal: "yes"
      - name: "withheld"
        meaning: "No VSA is issued for a failed evaluation."
        kind: "inferred"
        inferred_reason: "Whether a failure must be issued is not stated (OI-07)."
        terminal: "yes"
    transitions:
      - id: "M02.T01"
        from: "idle"
        to: "inputs-held"
        trigger_kind: "event"
        trigger: "inputs-received"
        kind: "inferred"
        inferred_reason: "§2 names the inputs, not their arrival."
        protocol_step: "F01.1"
        quotes:
          - source_lines: "44-45"
            quote: |-
              by evaluating the artifact and a `bundle` of attestations against some `policy`.
        constrained_by:
          - "slsa-vsa-1-2#R-0019"
      - id: "M02.T02"
        from: "inputs-held"
        to: "evaluated"
        trigger_kind: "event"
        trigger: "advance"
        action: "evaluate artifact and bundle against the policy"
        kind: "stated"
        protocol_step: "F01.2"
        opaque: "yes"
        quotes:
          - source_lines: "169"
            quote: |-
              Describes the policy that the `subject` was verified against.
        constrained_by:
          - "slsa-vsa-1-2#R-0019"
          - "slsa-vsa-1-2#R-0041"
      - id: "M02.T03"
        from: "evaluated"
        to: "result-encoded"
        trigger_kind: "event"
        trigger: "advance"
        guard: "outcome is pass"
        action: >-
          verificationResult = PASSED; verifiedLevels = per track the highest level verified for the artifact
          itself, plus any verified properties; at most one level per track; SLSA_<TRACK>_LEVEL_UNEVALUATED
          for a track with no claim
        kind: "stated"
        protocol_step: "F01.9, F01.10"
        quotes:
          - source_lines: "190"
            quote: |-
              Either “PASSED” or “FAILED” to indicate if the artifact passed or failed the policy verification.
          - source_lines: "195-197"
            quote: |-
              Indicates the highest level of each track verified for the artifact (and not > its dependencies) and any [verified properties](verified-properties) verified > for the artifact or "FAILED" if policy verification failed.
        constrained_by:
          - "slsa-vsa-1-2#R-0051"
          - "slsa-vsa-1-2#R-0053"
          - "slsa-vsa-1-2#R-0054"
          - "slsa-vsa-1-2#R-0055"
          - "slsa-vsa-1-2#R-0014"
          - "slsa-vsa-1-2#R-0076"
          - "slsa-vsa-1-2#R-0077"
          - "slsa-vsa-1-2#R-0080"
          - "slsa-vsa-1-2#R-0081"
          - "slsa-vsa-1-2#R-0090"
      - id: "M02.T04"
        from: "evaluated"
        to: "result-encoded"
        trigger_kind: "event"
        trigger: "advance"
        guard: "outcome is fail and the verifier issues a VSA for it"
        action: "verificationResult = FAILED; verifiedLevels = [FAILED]"
        kind: "stated"
        protocol_step: "F01.9, F01.10"
        quotes:
          - source_lines: "190"
            quote: |-
