source_tensions:
  - id: "SD-15"
    lane_id: "SD-01"
    where: "M01.T14"
    text: "§5.1 checks slsaResult; the guard reads verificationResult. protocol.yaml SD-15."
  - id: "SD-14"
    lane_id: "SD-02"
    where: "M01.T16"
    text: >-
      §5.1 example 2 tests verifiedLevels with is; the guard uses contains. protocol.yaml SD-14.
  - id: "SD-20"
    lane_id: "SD-03"
    where: "M03.T11, M03.T13"
    text: >-
      Inherited dependencyLevels counts cannot be deduplicated, so count-once (R-0061) fails for a shared
      dependency under method (b). protocol.yaml SD-20.
  - id: "OI-07"
    where: "M02.T04, M02.T05"
    text: >-
      No rule ties verificationResult to verifiedLevels, and issuing a FAILED VSA is not required.
      protocol.yaml OI-07; source defect SD-8.
  - id: "OI-09"
    where: "M03.T16 to M03.T20"
    text: >-
      A dependency without a level, and any source dependency, has no counting rule; the exits are
      inferred alternatives. protocol.yaml OI-09; source defects SD-11 and SD-2.
not_modelled:
  - text: >-
      VSA lifetime (validity period, expiry, revocation, renewal, supersession): the source defines none.
      Measured on the 432 lines: 0 occurrences each of expir, revo, fresh, renew, supersed and rotat,
      case-insensitive; timeVerified (§3.2) is optional and no step reads it (protocol.yaml OI-11).
  - text: >-
      Trust configuration over time (adding or removing a verifier, key rotation): one SHOULD (R-0013) and
      the word preconfigured (L283, L326, L350), no procedure; the setup is protocol.yaml F03.
  - text: >-
      Reading dependencyLevels: a three-way decision with no lifecycle, modelled as guarded steps in
      protocol.yaml F07 and as the guard of M01.T19.
  - text: "Format versioning (§3.1): a parsing rule, not a lifecycle; M01.T04 applies R-0001."
  - text: >-
      Policy evaluation, signing, signature checking and provenance verification: single opaque
      transitions (M02.T02, M02.T09, M01.T02, M03.T07), defined by other documents.
  - text: >-
      §5.1's two examples: runs of M01 with fixed expected values, not machines of their own;
      protocol.yaml F05, F06.
coverage: >-
  3 machines, 42 states (24 kind inferred), 51 transitions (28 kind inferred), 10 error states,
  counted by script over the model this file was written from and recounted over the written file with
  both bin/_yaml.py and bin/_record_yaml.py. Checked by script: every from and to is a state of its
  machine, every state is reachable from the initial state, every non-terminal state has an exit and
  no terminal state has one, error_states equals the set of states marked error, every trigger is a
  defined event and every event is used, every protocol_step names a protocol.yaml step.
  Pass 1's links, over the skeleton ids: constrained_by 29 links to 14 distinct requirement ids,
  candidates 23 links to 22 distinct candidate ids. After pass 2's rewiring, recounted with both
  readers: constrained_by 101 links to 68 distinct requirement ids on 38 of the 51 transitions,
  candidates 7 links to 7 distinct rejected candidates; 28 quotations, checked by bin/check-quotes.
  Pass 2 also re-ran the structural checks above by script (all hold) and found M02.T04's guard
  overlapping M02.T05's (see M02.T04's note); M01's guard pairs are a predicate and its negation, and
  levels-matched's three a partition, so they are exclusive and exhaustive by form.
