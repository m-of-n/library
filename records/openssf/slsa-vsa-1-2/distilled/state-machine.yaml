            quote: |-
              or b) matching the non-source dependency listed in `resolvedDependencies` (`subject.digest` == `resolvedDependencies.digest` and, ideally, `vsa.resourceUri` == `resolvedDependencies.uri`) to a VSA _for that dependency_
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
      - id: "M03.T07"
        from: "verifying-provenance"
        to: "level-determined"
        trigger_kind: "event"
        trigger: "advance"
        guard: "the dependency's provenance verifies"
        action: >-
          levels per track from that verification; append the dependency's own resolvedDependencies not yet on
          the work list, compared by digest
        kind: "stated"
        protocol_step: "F02.2"
        opaque: "yes"
        note: >-
          Comparing by digest is this model's (inferred); it is what lets method (a) count a shared dependency
          once.
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
      - id: "M03.T08"
        from: "verifying-provenance"
        to: "undetermined"
        trigger_kind: "event"
        trigger: "advance"
        guard: "provenance absent or not verified"
        kind: "inferred"
        inferred_reason: "Method (a)'s failure is not described (E13)."
        protocol_step: "F02.2"
      - id: "M03.T09"
        from: "matching-vsa"
        to: "vsa-verifying"
        trigger_kind: "event"
        trigger: "advance"
        guard: >-
          a VSA exists whose subject digest equals the dependency's digest, preferably with resourceUri equal
          to the dependency's uri
        kind: "stated"
        protocol_step: "F02.3"
        quotes:
          - source_lines: "54-57"
            quote: |-
              or b) matching the non-source dependency listed in `resolvedDependencies` (`subject.digest` == `resolvedDependencies.digest` and, ideally, `vsa.resourceUri` == `resolvedDependencies.uri`) to a VSA _for that dependency_
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
      - id: "M03.T10"
        from: "matching-vsa"
        to: "undetermined"
        trigger_kind: "event"
        trigger: "advance"
        guard: "no such VSA"
        kind: "inferred"
        inferred_reason: "Method (b)'s failure is not described (E12)."
        protocol_step: "F02.3"
      - id: "M03.T11"
        from: "vsa-verifying"
        to: "level-determined"
        trigger_kind: "event"
        trigger: "sub-verification-complete"
        guard: "M01 ended in accepted"
        action: "levels per track = vsa.verifiedLevels; inherited counts += vsa.dependencyLevels"
        kind: "inferred"
        inferred_reason: >-
          Using the two fields is stated; requiring the VSA to pass M01 first is this model's (OI-08).
        protocol_step: "F02.4, F02.5"
        quotes:
          - source_lines: "57-58"
            quote: |-
              and using `vsa.verifiedLevels` and `vsa.dependencyLevels`.
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
      - id: "M03.T12"
        from: "vsa-verifying"
        to: "undetermined"
        trigger_kind: "event"
        trigger: "sub-verification-complete"
        guard: "M01 ended in an error state"
        kind: "inferred"
        inferred_reason: "As M03.T11 (E12)."
        protocol_step: "F02.4"
      - id: "M03.T13"
        from: "level-determined"
        to: "counted"
        trigger_kind: "event"
        trigger: "advance"
        action: >-
          count the dependency once per track at its highest level in that track; add any inherited counts
        kind: "stated"
        protocol_step: "F02.6"
        quotes:
          - source_lines: "216-219"
            quote: |-
              Users MUST count each dependency only once per SLSA track, at the highest > level verified. For example, if a dependency meets `SLSA_BUILD_LEVEL_2`, > you include it with the count for `SLSA_BUILD_LEVEL_2` but not the count for > `SLSA_BUILD_LEVEL_1`.
        note: >-
          Adding inherited counts counts twice a dependency that two dependency VSAs share (SD-20).
        constrained_by:
          - "slsa-vsa-1-2#R-0061"
          - "slsa-vsa-1-2#R-0062"
      - id: "M03.T14"
        from: "counted"
        to: "selecting"
        trigger_kind: "event"
        trigger: "advance"
        guard: "work list not exhausted"
        kind: "inferred"
        inferred_reason: "Iteration is this model's."
        protocol_step: "F02.6"
      - id: "M03.T15"
        from: "counted"
        to: "complete"
        trigger_kind: "event"
        trigger: "advance"
        guard: "work list exhausted"
        action: >-
          dependencyLevels = the counts, a map from SlsaResult to integer; a level with no dependency may be
          left out, since it reads as 0
        kind: "stated"
        protocol_step: "F02.7"
        quotes:
          - source_lines: "209-211"
            quote: |-
              Map from [SlsaResult] to the number of the artifact's _transitive_ dependencies > that were verified at the indicated level. Absence of a given level of > [SlsaResult] MUST be interpreted as reporting _0_ dependencies at that level.
        constrained_by:
          - "slsa-vsa-1-2#R-0058"
          - "slsa-vsa-1-2#R-0059"
          - "slsa-vsa-1-2#R-0089"
          - "slsa-vsa-1-2#R-0014"
      - id: "M03.T16"
        from: "undetermined"
        to: "selecting"
        trigger_kind: "event"
        trigger: "advance"
        guard: "work list not exhausted; carry on"
        kind: "inferred"
        inferred_reason: >-
          The source has no rule for a dependency without a level (OI-09); going on without counting it is one
          reading.
        protocol_step: "F02.6"
      - id: "M03.T17"
        from: "undetermined"
        to: "complete"
        trigger_kind: "event"
        trigger: "advance"
        guard: "work list exhausted; carry on"
        kind: "inferred"
        inferred_reason: >-
          The source has no rule for a dependency without a level (OI-09); going on without counting it is one
