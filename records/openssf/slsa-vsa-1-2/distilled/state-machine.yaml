  - id: "M03"
    name: "dependency-level-determination"
    locator: "§2, §3.2"
    actor: "verifier"
    protocol_flow: "F02"
    purpose: >-
      §2's two methods over a work list of dependencies, ending in a dependencyLevels map or in no claim.
      Recursion (method a) appends a dependency's own dependencies to the work list. The source gives no
      outcome for a dependency neither method determines, nor for a source dependency; the exits from
      those two states are inferred alternatives (OI-09).
    initial: "idle"
    states:
      - name: "idle"
        meaning: "No determination running."
        kind: "inferred"
        inferred_reason: "An entry state."
      - name: "dependencies-listed"
        meaning: "The resolvedDependencies of the artifact being verified form the work list."
        kind: "stated"
      - name: "selecting"
        meaning: "The next dependency on the work list is taken."
        kind: "inferred"
        inferred_reason: "Iteration is this model's."
      - name: "source-dependency"
        meaning: "The dependency is a source dependency, which neither method covers."
        kind: "inferred"
        inferred_reason: "Both methods name non-source dependencies only (OI-09)."
      - name: "verifying-provenance"
        meaning: "Method (a): the dependency's provenance is being verified."
        kind: "stated"
      - name: "matching-vsa"
        meaning: "Method (b): a VSA for the dependency is being looked for."
        kind: "stated"
      - name: "vsa-verifying"
        meaning: "M01 runs on the matched dependency VSA."
        kind: "inferred"
        inferred_reason: "§2 only says the VSA is matched and used (OI-08)."
      - name: "level-determined"
        meaning: "The dependency's level in each track is known."
        kind: "stated"
      - name: "undetermined"
        meaning: >-
          No level for this dependency: provenance missing or failed, no VSA matched, or the VSA failed M01.
        kind: "inferred"
        inferred_reason: "The source names no such outcome (E12, E13)."
        error: "yes"
      - name: "counted"
        meaning: "The dependency is counted once per track, at its highest level."
        kind: "stated"
      - name: "complete"
        meaning: "dependencyLevels is emitted."
        kind: "stated"
        terminal: "yes"
      - name: "no-claims"
        meaning: "The verifier withdraws its claim: dependencyLevels is left unset."
        kind: "inferred"
        inferred_reason: "One of the readings OI-09 leaves open."
        terminal: "yes"
    transitions:
      - id: "M03.T01"
        from: "idle"
        to: "dependencies-listed"
        trigger_kind: "event"
        trigger: "dependency-check-requested"
        action: "work list = the resolvedDependencies of the artifact being verified, from its provenance"
        kind: "stated"
        protocol_step: "F02.1"
        opaque: "yes"
        quotes:
          - source_lines: "51-54"
            quote: |-
              The verifier does this by either a) verifying the provenance of each non-source dependency listed in the [resolvedDependencies](build-provenance#resolvedDependencies) of the artifact being verified (recursively)
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
      - id: "M03.T02"
        from: "dependencies-listed"
        to: "complete"
        trigger_kind: "event"
        trigger: "advance"
        guard: "work list empty"
        action: "dependencyLevels = {} (an artifact with no dependencies)"
        kind: "stated"
        protocol_step: "F02.7"
        quotes:
          - source_lines: "212-214"
            quote: |-
              A set but empty `dependencyLevels` object means that the artifact has **no** > dependency at all, while an unset or null `dependencyLevels` means that the > verifier makes no claims about the artifact's dependencies.
        constrained_by:
          - "slsa-vsa-1-2#R-0060"
      - id: "M03.T03"
        from: "dependencies-listed"
        to: "selecting"
        trigger_kind: "event"
        trigger: "advance"
        guard: "work list not empty"
        kind: "inferred"
        inferred_reason: "Iteration is this model's."
        protocol_step: "F02.1"
      - id: "M03.T04"
        from: "selecting"
        to: "source-dependency"
        trigger_kind: "event"
        trigger: "advance"
        guard: "the dependency is a source dependency"
        kind: "inferred"
        inferred_reason: >-
          Both methods name non-source dependencies only; a source dependency's treatment is not stated
          (OI-09).
        protocol_step: "F02.1"
      - id: "M03.T05"
        from: "selecting"
        to: "verifying-provenance"
        trigger_kind: "event"
        trigger: "advance"
        guard: "non-source dependency; method (a)"
        kind: "stated"
        protocol_step: "F02.2"
        opaque: "yes"
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
      - id: "M03.T06"
        from: "selecting"
        to: "matching-vsa"
        trigger_kind: "event"
        trigger: "advance"
        guard: "non-source dependency; method (b)"
        kind: "stated"
        protocol_step: "F02.3"
        quotes:
