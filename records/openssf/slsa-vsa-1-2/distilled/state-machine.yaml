# slsa-vsa-1-2 state machines, FX-1 pass 1 (extract), protocol and state-machine lane. Flows are in protocol.yaml; prose in protocol.md.
record: "slsa-vsa-1-2"
reviewed_by: ""
kind: "state-machine"
extracted: "2026-11-17"
extracted_by: >-
  FX-1 pass 1 (extract), protocol and state-machine lane, claude-opus-5-5, effort max, from the source
  only
source:
  file: ".cache/slsa-vsa-1-2.txt"
  sha256: "9cfab2e205860f67ea6052450f0445dcbd31dcf754d8cf9becf8d8ef3d1056e8"
note: >-
  Conventions. States are {name, meaning, kind}; error states carry error yes and are listed in
  error_states; terminal states carry terminal yes. Every trigger is an event defined under events
  (trigger_kind event); the message an event carries is named in its meaning and in protocol.yaml.
  guard and action are this file's notation; the source's words are in each transition's quotes, cut
  from .cache/slsa-vsa-1-2.txt by script and checked by bin/check-quotes. kind stated means the source
  describes the transition; inferred means this model added it, with inferred_reason. Every failing
  branch of a §5 check is inferred, because §5 never says what a failed check leads to. protocol_step
  names the protocol.yaml step a transition carries out. constrained_by and candidates are emitted by
  script from the skeleton tables (requirements.yaml R-0001 to R-0015, inferred-candidates.yaml) and
  every resolved pair was read. Pass 2 (verify) rewired them to the full table (R-0001 to R-0094) by
  script from the id table: the split child that carries a statement in place of its parent, the
  requirement id for every promoted candidate, and R-0085 (the inferred outcome of a failed check) on
  every failing branch of M01; candidates now lists rejected candidates only. Source-defect ids are
  normative.md's canonical ones (lane_id keeps this lane's pass 1 id).
events:
  - name: "vsa-received"
    meaning: >-
      The consumer holds a VSA envelope and the artifact or its digest (protocol.yaml F04 step 1).
  - name: "inputs-received"
    meaning: "The verifier holds an artifact, a bundle of attestations and a policy (F01 step 1)."
  - name: "dependency-check-requested"
    meaning: "The verifier sets out to claim dependency levels for the artifact (F01 step 3)."
  - name: "sub-verification-complete"
    meaning: >-
      M01, run by the verifier on a dependency's VSA, has ended in accepted or in an error state.
  - name: "vsa-delivered"
    meaning: "The signed VSA leaves the verifier (F01 step 15); the channel is not specified."
  - name: "advance"
    meaning: "The machine moves on; no input is consumed, and the guard picks the branch."
machines:
  - id: "M01"
    name: "vsa-verification"
    locator: "§3.1, §5, §5.1"
    actor: "consumer"
    protocol_flow: "F04"
    purpose: >-
      §5 as a machine: seven mandatory checks in printed order, a read of the payload placed after the
      signature, the optional further check, and one error state per failing check. The verdict is the
      conjunction of side-effect-free checks, so any order that keeps the signature first and the read
      before the field checks reaches the same verdict; only the error state reached may differ.
    initial: "idle"
    states:
      - name: "idle"
        meaning: "No verification running."
        kind: "inferred"
        inferred_reason: "An entry state; §5 begins with a VSA in hand."
      - name: "received"
        meaning: >-
          The consumer holds the VSA envelope, the artifact (or its digest) and its F03 configuration: roots
          of trust, accepted pairs, expected resourceUri, expected levels, goal.
        kind: "inferred"
        inferred_reason: "§5 presupposes all of it without saying how it is obtained."
      - name: "signature-verified"
        meaning: "§5 step 1 passed."
        kind: "stated"
      - name: "statement-parsed"
        meaning: "The payload has been read as an in-toto Statement, unrecognized fields ignored."
        kind: "inferred"
        inferred_reason: "The source has no parse step (protocol.yaml F04 step 3)."
      - name: "subject-matched"
        meaning: "§5 step 2 passed."
        kind: "stated"
      - name: "predicate-type-checked"
        meaning: "§5 step 3 passed."
        kind: "stated"
      - name: "verifier-matched"
        meaning: "§5 step 4 passed."
        kind: "stated"
      - name: "resource-matched"
        meaning: "§5 step 5 passed."
        kind: "stated"
      - name: "result-passed"
        meaning: "§5 step 6 passed."
        kind: "stated"
      - name: "levels-matched"
        meaning: "§5 step 7 passed; every mandatory step is done."
        kind: "stated"
      - name: "additional-checked"
        meaning: "The optional step passed for every further field the goal names."
        kind: "stated"
      - name: "accepted"
        meaning: "The VSA is verified; the consumer relies on the verifier's decision about the artifact."
        kind: "stated"
        terminal: "yes"
      - name: "rejected-signature"
        meaning: "The envelope signature does not verify under the roots of trust (E02)."
        kind: "inferred"
        inferred_reason: >-
          The source names the check and never its failure; a failed Verify that is read as not verified.
        error: "yes"
        terminal: "yes"
      - name: "rejected-malformed"
        meaning: "The payload is not an in-toto Statement (E01)."
        kind: "inferred"
        inferred_reason: "The source defines no parse failure."
        error: "yes"
        terminal: "yes"
      - name: "rejected-subject"
        meaning: "No subject entry matches the artifact's digest (E03)."
        kind: "inferred"
        inferred_reason: >-
          The source names the check and never its failure; a failed Verify that is read as not verified.
        error: "yes"
        terminal: "yes"
      - name: "rejected-predicate-type"
        meaning: "predicateType is not the VSA v1 type (E04)."
        kind: "inferred"
        inferred_reason: >-
          The source names the check and never its failure; a failed Verify that is read as not verified.
        error: "yes"
        terminal: "yes"
      - name: "rejected-verifier"
        meaning: "The (signer, verifier) pair is not accepted (E05)."
        kind: "inferred"
        inferred_reason: >-
          The source names the check and never its failure; a failed Verify that is read as not verified.
        error: "yes"
        terminal: "yes"
      - name: "rejected-resource-uri"
        meaning: "resourceUri does not match the expected value, or none is known (E06, E10)."
        kind: "inferred"
        inferred_reason: >-
          The source names the check and never its failure; a failed Verify that is read as not verified.
        error: "yes"
        terminal: "yes"
      - name: "rejected-result"
        meaning: "verificationResult is not PASSED (E07)."
        kind: "inferred"
        inferred_reason: >-
          The source names the check and never its failure; a failed Verify that is read as not verified.
        error: "yes"
        terminal: "yes"
      - name: "rejected-levels"
        meaning: "verifiedLevels does not contain an expected value (E08)."
        kind: "inferred"
        inferred_reason: >-
          The source names the check and never its failure; a failed Verify that is read as not verified.
        error: "yes"
        terminal: "yes"
      - name: "rejected-additional"
        meaning: "A further field fails the goal (E09, E14, E15)."
        kind: "inferred"
        inferred_reason: >-
          The source names the check and never its failure; a failed Verify that is read as not verified.
        error: "yes"
        terminal: "yes"
    transitions:
      - id: "M01.T01"
        from: "idle"
        to: "received"
        trigger_kind: "event"
        trigger: "vsa-received"
        kind: "inferred"
        inferred_reason: "§5 presupposes the VSA in hand."
        protocol_step: "F04.1"
        constrained_by:
          - "slsa-vsa-1-2#R-0083"
      - id: "M01.T02"
        from: "received"
        to: "signature-verified"
        trigger_kind: "event"
        trigger: "advance"
        guard: "the envelope signature verifies with a key from roots_of_trust"
        kind: "stated"
        protocol_step: "F04.2"
        opaque: "yes"
        quotes:
          - source_lines: "283-285"
            quote: |-
              Verify the signature on the VSA envelope using the preconfigured roots of trust. This step ensures that the VSA was produced by a trusted producer and that it hasn't been tampered with.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0067"
        candidates:
          - "C-0009"
      - id: "M01.T03"
        from: "received"
        to: "rejected-signature"
        trigger_kind: "event"
        trigger: "advance"
        guard: "NOT (the envelope signature verifies with a key from roots_of_trust)"
        kind: "inferred"
        inferred_reason: "The failing branch of the check before it."
        protocol_step: "F04.2"
        constrained_by:
          - "slsa-vsa-1-2#R-0085"
      - id: "M01.T04"
        from: "signature-verified"
        to: "statement-parsed"
        trigger_kind: "event"
        trigger: "advance"
        guard: "the payload parses as an in-toto Statement"
        action: "ignore every field not recognized"
        kind: "inferred"
        inferred_reason: "R-0001 binds the read; the read's place in the order is this model's."
        protocol_step: "F04.3"
        quotes:
          - source_lines: "113-114"
            quote: |-
              Minor version changes are always backwards compatible and "monotonic." Such changes do not update the `predicateType`.
        constrained_by:
          - "slsa-vsa-1-2#R-0024"
          - "slsa-vsa-1-2#R-0001"
          - "slsa-vsa-1-2#R-0026"
          - "slsa-vsa-1-2#R-0027"
      - id: "M01.T05"
        from: "signature-verified"
        to: "rejected-malformed"
        trigger_kind: "event"
        trigger: "advance"
        guard: "the payload is not an in-toto Statement"
        kind: "inferred"
        inferred_reason: "The source defines no parse failure."
        protocol_step: "F04.3"
        constrained_by:
          - "slsa-vsa-1-2#R-0085"
      - id: "M01.T06"
        from: "statement-parsed"
        to: "subject-matched"
        trigger_kind: "event"
        trigger: "advance"
        guard: >-
          some subject entry's digest matches digest(artifact); the match rule is in-toto's (OI-04)
        kind: "stated"
        protocol_step: "F04.4"
        quotes:
          - source_lines: "287-288"
            quote: |-
              Verify the statement's `subject` matches the digest of the artifact in question. This step ensures that the VSA pertains to the intended artifact.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0068"
        candidates:
          - "C-0011"
      - id: "M01.T07"
        from: "statement-parsed"
        to: "rejected-subject"
        trigger_kind: "event"
        trigger: "advance"
        guard: "no subject entry's digest matches digest(artifact)"
        kind: "inferred"
        inferred_reason: "The failing branch of the check before it."
        protocol_step: "F04.4"
        constrained_by:
          - "slsa-vsa-1-2#R-0085"
      - id: "M01.T08"
        from: "subject-matched"
        to: "predicate-type-checked"
        trigger_kind: "event"
        trigger: "advance"
        guard: "predicateType == https://slsa.dev/verification_summary/v1, compared as an exact string"
        kind: "stated"
        protocol_step: "F04.5"
        quotes:
          - source_lines: "290-292"
            quote: |-
              Verify that the `predicateType` is `https://slsa.dev/verification_summary/v1`. This step ensures that the in-toto predicate is using this version of the VSA format.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0069"
        candidates:
          - "C-0013"
      - id: "M01.T09"
        from: "subject-matched"
        to: "rejected-predicate-type"
        trigger_kind: "event"
        trigger: "advance"
        guard: "predicateType != https://slsa.dev/verification_summary/v1"
        kind: "inferred"
        inferred_reason: "The failing branch of the check before it."
        protocol_step: "F04.5"
        constrained_by:
          - "slsa-vsa-1-2#R-0085"
      - id: "M01.T10"
        from: "predicate-type-checked"
        to: "verifier-matched"
        trigger_kind: "event"
        trigger: "advance"
        guard: "(key used at M01.T02, predicate.verifier.id) in accepted_pairs"
        kind: "stated"
        protocol_step: "F04.6"
        quotes:
          - source_lines: "294-296"
            quote: |-
              Verify that the `verifier` matches the public key (or equivalent) used to verify the signature in step 1. This step identifies the VSA producer in cases where their identity is not implicitly revealed in step 1.
        note: >-
          §5 step 4 says the verifier matches the key; the pairs are the relation it matches by (OI-05).
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0070"
          - "slsa-vsa-1-2#R-0004"
          - "slsa-vsa-1-2#R-0082"
      - id: "M01.T11"
        from: "predicate-type-checked"
        to: "rejected-verifier"
        trigger_kind: "event"
        trigger: "advance"
        guard: "(key used at M01.T02, predicate.verifier.id) not in accepted_pairs"
        kind: "inferred"
        inferred_reason: "The failing branch of the check before it."
        protocol_step: "F04.6"
        constrained_by:
          - "slsa-vsa-1-2#R-0085"
      - id: "M01.T12"
        from: "verifier-matched"
        to: "resource-matched"
        trigger_kind: "event"
        trigger: "advance"
        guard: >-
          predicate.resourceUri matches expected_resource_uri (the fetch URI, the value communicated out of
          band, or the value a communicated rule yields)
        kind: "stated"
        protocol_step: "F04.7"
        quotes:
          - source_lines: "298-300"
            quote: |-
              Verify that the value for `resourceUri` in the VSA matches the expected value. This step ensures that the consumer is using the VSA for the producer's intended purpose.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0071"
          - "slsa-vsa-1-2#R-0094"
          - "slsa-vsa-1-2#R-0006"
          - "slsa-vsa-1-2#R-0091"
        candidates:
          - "C-0016"
      - id: "M01.T13"
        from: "verifier-matched"
        to: "rejected-resource-uri"
        trigger_kind: "event"
        trigger: "advance"
        guard: "predicate.resourceUri does not match, or no expected value is known (E10)"
        kind: "inferred"
        inferred_reason: "The failing branch of the check before it."
        protocol_step: "F04.7"
        constrained_by:
          - "slsa-vsa-1-2#R-0085"
      - id: "M01.T14"
        from: "resource-matched"
        to: "result-passed"
        trigger_kind: "event"
        trigger: "advance"
        guard: "predicate.verificationResult == PASSED"
        kind: "stated"
        protocol_step: "F04.8"
        quotes:
          - source_lines: "302-303"
            quote: |-
              Verify that the value for `verificationResult` is `PASSED`. This step ensures the artifact is suitable for the consumer's purposes.
        note: "§5.1 writes slsaResult for this field (SD-15)."
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0072"
        candidates:
          - "C-0018"
      - id: "M01.T15"
        from: "resource-matched"
        to: "rejected-result"
        trigger_kind: "event"
        trigger: "advance"
        guard: "predicate.verificationResult != PASSED (FAILED, or any other value)"
        kind: "inferred"
        inferred_reason: "The failing branch of the check before it."
        protocol_step: "F04.8"
        constrained_by:
          - "slsa-vsa-1-2#R-0085"
      - id: "M01.T16"
        from: "result-passed"
        to: "levels-matched"
        trigger_kind: "event"
        trigger: "advance"
        guard: >-
          predicate.verifiedLevels contains a member of expected_levels; an expectation of level n in a track
          puts every level n and above of that track in expected_levels
        kind: "stated"
        protocol_step: "F04.9"
        quotes:
