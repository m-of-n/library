        protocol_step: "F02.7"
      - id: "M03.T18"
        from: "undetermined"
        to: "no-claims"
        trigger_kind: "event"
        trigger: "advance"
        guard: "the verifier withdraws its claim"
        action: "dependencyLevels unset or null"
        kind: "inferred"
        inferred_reason: "The other reading: an unset dependencyLevels claims nothing, which cannot be false."
        protocol_step: "F01.11"
        quotes:
          - source_lines: "212-214"
            quote: |-
              A set but empty `dependencyLevels` object means that the artifact has **no** > dependency at all, while an unset or null `dependencyLevels` means that the > verifier makes no claims about the artifact's dependencies.
        constrained_by:
          - "slsa-vsa-1-2#R-0060"
          - "slsa-vsa-1-2#R-0088"
      - id: "M03.T19"
        from: "source-dependency"
        to: "selecting"
        trigger_kind: "event"
        trigger: "advance"
        guard: "work list not exhausted"
        kind: "inferred"
        inferred_reason: "As M03.T16, for a dependency neither method covers."
        protocol_step: "F02.1"
      - id: "M03.T20"
        from: "source-dependency"
