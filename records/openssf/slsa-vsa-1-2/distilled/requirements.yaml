    note: 'The attestations evaluated are recorded in inputAttestations (R-0045); `bundle` names no field of this predicate (SD-18). One or more artifacts: what the predicate then says of each is R-0092 and SD-1. Subject structure is the in-toto Statement''s, outside this source (R-0028).'
  - id: 'slsa-vsa-1-2#R-0020'
    locator: '§2'
    source_lines: '51-58'
    text: 'The verifier does this by either a) verifying the provenance of each non-source dependency listed in the [resolvedDependencies](build-provenance#resolvedDependencies) of the artifact being verified (recursively) or b) matching the non-source dependency listed in `resolvedDependencies` (`subject.digest` == `resolvedDependencies.digest` and, ideally, `vsa.resourceUri` == `resolvedDependencies.uri`) to a VSA _for that dependency_ and using `vsa.verifiedLevels` and `vsa.dependencyLevels`.'
    verb: 'none'
    kind: stated
    actor: 'verifier (VSA producer computing dependencyLevels)'
    object: 'transitive dependency levels'
    field: 'dependencyLevels, from resolvedDependencies of the artifact''s SLSA provenance, or from dependency VSAs'' verifiedLevels and dependencyLevels'
    testable: 'partial'
    testable_reason: 'method b is testable given dependency VSAs: a dependency matched by digest contributes its VSA''s levels to the counts; method a rests on verifying SLSA provenance, outside this source. The match is digest equality; resourceUri equality is preferred, not required.'
    note: 'Names non-source dependencies only, while dependencyLevels counts the artifact''s transitive dependencies and an empty object means none at all (R-0058, R-0060): SD-2. resolvedDependencies is a field of SLSA Provenance (slsa-provenance-1-2), outside this source. Method b sums dependency VSAs'' counts, which carry no identities, so a shared dependency is counted more than once: SD-20. The vsa. paths stand for predicate fields: SD-18. How two digest sets match is not said: SD-26.'
