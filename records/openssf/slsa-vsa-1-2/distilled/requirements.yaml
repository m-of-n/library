  - id: 'slsa-vsa-1-2#R-0019'
    locator: '§2'
    source_lines: '42-45'
    text: 'A Verification Summary Attestation (VSA) is an attestation that some entity (`verifier`) verified one or more software artifacts (the `subject` of an in-toto attestation [Statement]) by evaluating the artifact and a `bundle` of attestations against some `policy`.'
    verb: 'none'
    kind: stated
    actor: 'VSA producer'
    object: 'VSA (Statement and predicate)'
    field: 'subject (the artifacts verified); predicate.verifier; predicate.policy'
    testable: 'partial'
