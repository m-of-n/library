    source_lines: '195-199'
    text: '> Indicates the highest level of each track verified for the artifact (and not > its dependencies) and any [verified properties](verified-properties) verified > for the artifact or "FAILED" if policy verification failed. > > Users MUST NOT include more than one level per SLSA track.'
