    locator: '§3.2'
    source_lines: '177-185'
    text: '> The collection of attestations that were used to perform verification. > Conceptually similar to the `resolvedDependencies` field in [SLSA Provenance]. > > This field MAY be absent if the verifier does not support this feature. > If non-empty, this field MUST contain information on _all_ the attestations > used to perform verification. > > Each entry MUST contain a `digest` of the attestation and SHOULD contains a > `uri` that can be used to fetch the attestation.'
    verb: 'MUST'
    kind: stated
    actor: 'VSA producer'
    object: 'predicate.inputAttestations'
    field: 'inputAttestations; inputAttestations[*].digest; inputAttestations[*].uri'
    testable: 'partial'
    testable_reason: 'split: R-0046 is a permission, R-0047 (completeness) is not observable from the VSA, R-0048 and R-0049 are testable per entry.'
    note: 'Description, MAY, two MUSTs and a SHOULD; split into R-0045 to R-0049. An empty array is defined by neither branch (SD-6); SHOULD contains is the source''s grammar (SD-7).'
