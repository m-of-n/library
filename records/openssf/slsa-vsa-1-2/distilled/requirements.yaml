  - id: 'slsa-vsa-1-2#R-0092'
    locator: '§2'
    text: 'A producer puts several artifacts in one VSA''s subject only when verificationResult, verifiedLevels and dependencyLevels hold for each of them and the one resourceUri is the expected value for each: a consumer that matches its artifact to any one subject entry (step 2) applies the whole predicate to that artifact. The page allows several subjects but describes the predicate fields for a single artifact.'
