    source_lines: '210-217'
    text: 'Absence of a given level of > [SlsaResult] MUST be interpreted as reporting _0_ dependencies at that level. > A set but empty `dependencyLevels` object means that the artifact has **no** > dependency at all, while an unset or null `dependencyLevels` means that the > verifier makes no claims about the artifact''s dependencies. > > Users MUST count each dependency only once per SLSA track, at the highest > level verified.'
