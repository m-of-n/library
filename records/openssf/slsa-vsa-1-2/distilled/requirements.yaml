  - id: 'slsa-vsa-1-2#R-0091'
    locator: '§3.2'
    text: 'The consumer takes the expected resourceUri for step 5 to be the URI it fetched the artifact from, unless the producer has told it, out of band, another expected value or how to determine one.'
