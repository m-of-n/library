  - id: 'slsa-vsa-1-2#R-0082'
    locator: '§5'
    text: 'In step 4 the consumer compares predicate.verifier.id, not the whole verifier object, with the verifier identities that the key which verified the step 1 signature is configured to sign for (the accepted pairs of R-0004); a VSA whose verifier.id is not paired with that key fails.'
    verb: 'none'
    kind: inferred
    candidate: 'C-0028, C-0038'
    derived_from: 'R-0070 (§5 step 4, L294-295); R-0004 (L130); §5.1 L332 and L356 (C-0028, C-0038)'
    actor: 'VSA consumer'
    object: 'predicate.verifier.id'
    field: 'verifier.id; (signer, verifier) pair configuration'
    testable: 'yes'
    note: 'Step 4 names the object, and the match is defined nowhere: SD-13. Test as R-0004.'
  - id: 'slsa-vsa-1-2#R-0083'
    locator: '§5'
    text: 'Before verifying, a consumer holds for each use: its roots of trust (the keys, or equivalent, of the VSA signers it trusts; step 1); the accepted (signer, verifier) pairs (R-0004, step 4); the digest of the artifact being checked (step 2); the expected resourceUri (step 5); and the expected verifiedLevels value or values (step 7). The page names each input where it is used, never as a list, and gives none of them a format.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0067 to R-0073 (§5 steps 1 to 7); R-0004; R-0013; R-0091; §5.1 example 1 note L340-342 (the expected verifiedLevels value is agreed in advance by producer and consumer)'
    actor: 'VSA consumer'
    object: 'consumer configuration'
    field: 'roots of trust; (signer, verifier.id) pairs; artifact digest; expected resourceUri; expected verifiedLevels'
    testable: 'partial'
    testable_reason: 'configuration, tested through the steps that use it: each step fails when its input disagrees with the VSA.'
  - id: 'slsa-vsa-1-2#R-0084'
    locator: '§5'
    text: 'A consumer whose policy requires track T at level N or higher accepts a verifiedLevels entry SLSA_T_LEVEL_M for every M of N or more: a producer lists only the highest level per track (R-0009) and each level implies those below it, so testing for the literal value SLSA_T_LEVEL_N rejects a VSA at a higher level. UNEVALUATED, FAILED and custom values imply no level.'
    verb: 'none'
    kind: inferred
    candidate: 'C-0041'
    derived_from: 'R-0073 (§5 step 7, L305); R-0054; R-0055; R-0079; §5.1 example 2, L345-346 and L362 (C-0041)'
    actor: 'VSA consumer'
    object: 'predicate.verifiedLevels'
    field: 'verifiedLevels'
    testable: 'yes'
    note: '§5.1 example 2 enumerates by hand the values that meet Build level 2 or higher (levels 2 and 3): the consumer-side form of this rule. Its wording treats the array as a single value (SD-14).'
  - id: 'slsa-vsa-1-2#R-0085'
    locator: '§5'
    text: 'Verification fails when any of steps 1 to 7 fails, and the consumer then does not rely on the VSA for the artifact; a consumer that also runs the optional step fails verification when that check fails. The page lists the steps but states no outcome for a failed one and no error to report.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0011 (L281); R-0066 (L274-276); R-0067 to R-0074'
    actor: 'VSA consumer'
    object: 'verification outcome'
    field: 'none (outcome of the §5 procedure)'
    testable: 'yes'
    note: 'Order: step 4 uses the key found in step 1, so step 1 runs first; no other order is stated.'
  - id: 'slsa-vsa-1-2#R-0086'
    locator: '§5'
    text: 'A VSA producer signs the VSA, in an envelope, with a key its consumers can verify against their preconfigured roots of trust: the page states no signing obligation, but an unsigned VSA cannot pass step 1.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0067 (§5 step 1, L283-285); R-0004 (L130); Preamble L10-11 (the predicate is defined within the in-toto attestation framework)'
    actor: 'VSA producer'
    object: 'VSA envelope'
    field: 'envelope signature'
    testable: 'yes'
    note: 'The envelope format and signature algorithm are not named on this page.'
  - id: 'slsa-vsa-1-2#R-0087'
    locator: '§2'
    text: 'A consumer enforcing a minimum level N in track T for an artifact''s dependencies requires dependencyLevels to be set, and requires the count for every key SLSA_T_LEVEL_M with M below N, and for the track''s UNEVALUATED key, to be absent or zero: counts are exclusive (each dependency once per track, at its highest level), an absent key is zero and an unset or null object claims nothing. The check is sound only if the producer counts every dependency under some key of the track, which the page does not require.'
    verb: 'none'
    kind: inferred
    candidate: 'C-0002'
    derived_from: '§2 L58-60 (C-0002); R-0058; R-0059; R-0060; R-0061; R-0062'
    actor: 'VSA consumer'
    object: 'predicate.dependencyLevels'
    field: 'dependencyLevels'
    testable: 'partial'
    testable_reason: 'the consumer''s check is testable; its soundness rests on producer counting the page leaves open (SD-11, SD-2, SD-22), and on counts that method b can inflate (SD-20).'
  - id: 'slsa-vsa-1-2#R-0088'
    locator: '§3.2'
    text: 'A producer that makes no claim about the artifact''s dependencies leaves dependencyLevels unset (or null), and writes an empty object only for an artifact without dependencies, because an empty object asserts exactly that.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0060 (L212-214); R-0056'
    actor: 'VSA producer'
    object: 'predicate.dependencyLevels'
    field: 'dependencyLevels'
    testable: 'partial'
    testable_reason: 'whether the artifact has dependencies is not in the VSA; testable with a fixture artifact of known dependencies.'
  - id: 'slsa-vsa-1-2#R-0089'
    locator: '§3.2'
    text: 'Each dependencyLevels value is a non-negative integer count of dependencies; an explicit 0 says the same as an absent key.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0057 (L207, a count); R-0058 (L209, the number of dependencies); §3 schema L98 (Int); R-0059 (L210-211)'
    actor: 'VSA producer; VSA consumer'
    object: 'predicate.dependencyLevels'
    field: 'dependencyLevels values'
    testable: 'yes'
  - id: 'slsa-vsa-1-2#R-0090'
    locator: '§3.2'
    text: 'verificationResult is FAILED exactly when verifiedLevels carries FAILED, since both are defined by whether policy verification failed. A VSA carrying one without the other is inconsistent and the page gives no rule for it; step 6 rejects a FAILED result whatever verifiedLevels says.'
