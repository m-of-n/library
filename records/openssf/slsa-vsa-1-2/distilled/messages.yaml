      - name: "verifiedLevels"
        json_path: "predicate.verifiedLevels"
        type: "array ([SlsaResult]) (MSG-06)"
        required: true
        encoding: "JSON array of MSG-06 strings"
        declared:
          source_lines: "193"
          quote: "`verifiedLevels` _array ([SlsaResult]), required_"
        described:
          source_lines: "195-202"
          quote: "> Indicates the highest level of each track verified for the artifact (and not > its dependencies) and any [verified properties](verified-properties) verified > for the artifact or \"FAILED\" if policy verification failed. > > Users MUST NOT include more than one level per SLSA track. Note that each SLSA > level implies all levels below it (e.g. `SLSA_BUILD_LEVEL_3` implies > `SLSA_BUILD_LEVEL_2` and `SLSA_BUILD_LEVEL_1`), so there is no need to > include more than one level per track."
        consumer_step:
          source_lines: "305-306"
          quote: "7. Verify that `verifiedLevels` contains the expected value. This step ensures that the artifact is suitable for the consumer's purposes."
          step: 7
        constrained_by:
