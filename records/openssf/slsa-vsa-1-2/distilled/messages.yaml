  - id: "MSG-02"
    name: "VSA predicate"
    locator: "§3, §3.2"
    kind: "json-object (predicate)"
    encoding: "JSON object, the value of `predicate` in MSG-01"
    summary: "What the verifier says: who verified, against what policy, from which attestations, with what result and at which levels."
    declared:
      source_lines: "74-103"
      quote: "\"predicate\": { \"verifier\": { \"id\": \"<URI>\", \"version\": { \"<COMPONENT>\": \"<VERSION>\", ... } }, \"timeVerified\": <TIMESTAMP>, \"resourceUri\": <artifact-URI-in-request>, \"policy\": { \"uri\": \"<URI>\", \"digest\": { <digest-of-policy-data> } } \"inputAttestations\": [ { \"uri\": \"<URI>\", \"digest\": { <digest-of-attestation-data> } }, ... ], \"verificationResult\": \"<PASSED|FAILED>\", \"verifiedLevels\": [\"<SlsaResult>\"], \"dependencyLevels\": { \"<SlsaResult>\": <Int>, \"<SlsaResult>\": <Int>, ... }, \"slsaVersion\": \"<MAJOR>.<MINOR>\", }"
    constrained_by:
      - "slsa-vsa-1-2#R-0024"
      - "slsa-vsa-1-2#R-0001"
      - "slsa-vsa-1-2#R-0002"
      - "slsa-vsa-1-2#R-0012"
      - "slsa-vsa-1-2#R-0074"
    notes:
      - "R-0012 permits, and R-0074 is, the consumer's optional check of further fields (L308-311); no step reads policy, and nothing says what a consumer does with a VSA that lacks a required field (SD-27)"
    fields:
      - name: "verifier"
        json_path: "predicate.verifier"
        type: "object (MSG-03)"
        required: true
        encoding: "JSON object (MSG-03)"
        declared:
          source_lines: "123"
          quote: "`verifier` _object, required_"
        described:
          source_lines: "125-137"
          quote: "> Identifies the entity that performed the verification. > > The identity MUST reflect the trust base that consumers care about. How > detailed to be is a judgment call. > > Consumers MUST accept only specific (signer, verifier) pairs. For example, > \"GitHub\" can sign provenance for the \"GitHub Actions\" verifier, and \"Google\" > can sign provenance for the \"Google Cloud Deploy\" verifier, but \"GitHub\" cannot > sign for the \"Google Cloud Deploy\" verifier. > > The field is required, even if it is implicit from the signer, to aid readability and > debugging. It is an object to allow additional fields in the future, in case one > URI is not sufficient."
        consumer_step:
          source_lines: "294-296"
          quote: "4. Verify that the `verifier` matches the public key (or equivalent) used to verify the signature in step 1. This step identifies the VSA producer in cases where their identity is not implicitly revealed in step 1."
          step: 4
        constrained_by:
          - "slsa-vsa-1-2#R-0029"
          - "slsa-vsa-1-2#R-0030"
          - "slsa-vsa-1-2#R-0093"
          - "slsa-vsa-1-2#R-0004"
          - "slsa-vsa-1-2#R-0031"
          - "slsa-vsa-1-2#R-0070"
          - "slsa-vsa-1-2#R-0082"
          - "slsa-vsa-1-2#R-0013"
        notes:
          - "present even where the signer implies the verifier (R-0031)"
      - name: "timeVerified"
        json_path: "predicate.timeVerified"
        type: "string ([Timestamp])"
        required: false
        encoding: "JSON string; the Timestamp format is defined in in-toto, outside this source"
        declared:
          source_lines: "150"
          quote: "`timeVerified` _string ([Timestamp]), optional_"
        described:
          source_lines: "152"
          quote: "> Timestamp indicating what time the verification occurred."
        constrained_by:
          - "slsa-vsa-1-2#R-0036"
          - "slsa-vsa-1-2#R-0037"
        notes:
          - "optional since 1.1 (change history L412; SD-23); the schema block shows it as <TIMESTAMP> (L82)"
      - name: "resourceUri"
        json_path: "predicate.resourceUri"
        type: "string ([ResourceURI])"
        required: true
        encoding: "JSON string; the ResourceURI format is defined in in-toto, outside this source"
        declared:
          source_lines: "155"
          quote: "`resourceUri` _string ([ResourceURI]), required_"
        described:
          source_lines: "157-164"
          quote: "> URI that identifies the resource associated with the artifact being verified. > > The `resourceUri` SHOULD be set to the URI from which the producer expects the > consumer to fetch the artifact for verification. This enables the consumer to > easily determine the expected value when [verifying](#how-to-verify). If the > `resourceUri` is set to some other value, the producer MUST communicate the > expected value, or how to determine the expected value, to consumers through > an out-of-band channel."
        consumer_step:
          source_lines: "298-300"
          quote: "5. Verify that the value for `resourceUri` in the VSA matches the expected value. This step ensures that the consumer is using the VSA for the producer's intended purpose."
          step: 5
