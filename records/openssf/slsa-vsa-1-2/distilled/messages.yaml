    locator: "§3.1"
    quote_of_source:
      source_lines: "115"
      quote: "- Producers MAY add extension fields using field names that are URIs."
    constrained_by:
      - "slsa-vsa-1-2#R-0002"
  - id: "ENC-03"
    rule: "Hashes are carried as digest sets (algorithm name to value); the digest set format is in-toto's"
    locator: "§3"
    quote_of_source:
      source_lines: "69"
      quote: "\"digest\": { <digest-in-request> }"
    inferred: true
    inferred_reason: "the schema block shows `\"digest\": { <digest-in-request> }`; the object-of-algorithm-to-value form is the [DigestSet] of in-toto, outside this source. The example prints {\"sha256\": \"5678...\"} (L236)"
