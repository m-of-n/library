  - source_lines: "283-306"
    quote: "1. Verify the signature on the VSA envelope using the preconfigured roots of trust. This step ensures that the VSA was produced by a trusted producer and that it hasn't been tampered with. 2. Verify the statement's `subject` matches the digest of the artifact in question. This step ensures that the VSA pertains to the intended artifact. 3. Verify that the `predicateType` is `https://slsa.dev/verification_summary/v1`. This step ensures that the in-toto predicate is using this version of the VSA format. 4. Verify that the `verifier` matches the public key (or equivalent) used to verify the signature in step 1. This step identifies the VSA producer in cases where their identity is not implicitly revealed in step 1. 5. Verify that the value for `resourceUri` in the VSA matches the expected value. This step ensures that the consumer is using the VSA for the producer's intended purpose. 6. Verify that the value for `verificationResult` is `PASSED`. This step ensures the artifact is suitable for the consumer's purposes. 7. Verify that `verifiedLevels` contains the expected value. This step ensures that the artifact is suitable for the consumer's purposes."
    what: "the seven verification steps"
    covered_by_ids:
      - "slsa-vsa-1-2#R-0067"
      - "slsa-vsa-1-2#R-0068"
