    rule: "The VSA is a JSON object; the schema block (jsonc) gives member names and placeholder values, with comments and without enclosing braces"
    locator: "§3"
    quote_of_source:
      source_lines: "74"
      quote: "\"predicate\": {"
    inferred: true
    inferred_reason: "the source never names JSON; the in-toto Statement it instantiates is JSON"
  - id: "ENC-02"
    rule: "Consumers ignore unrecognized fields"
    locator: "§3.1"
    quote_of_source:
      source_lines: "110"
      quote: "- Consumers MUST ignore unrecognized fields."
    constrained_by:
      - "slsa-vsa-1-2#R-0001"
  - id: "ENC-04"
