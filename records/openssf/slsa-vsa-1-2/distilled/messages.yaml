      - name: "dependencyLevels"
        json_path: "predicate.dependencyLevels"
        type: "object, SlsaResult to count (MSG-07)"
        required: false
        encoding: "JSON object (MSG-07); null is read as unset (SD-10)"
        declared:
          source_lines: "205"
          quote: "`dependencyLevels` _object, optional_"
        described:
          source_lines: "207-219"
          quote: "> A count of the dependencies at each SLSA level. > > Map from [SlsaResult] to the number of the artifact's _transitive_ dependencies > that were verified at the indicated level. Absence of a given level of > [SlsaResult] MUST be interpreted as reporting _0_ dependencies at that level. > A set but empty `dependencyLevels` object means that the artifact has **no** > dependency at all, while an unset or null `dependencyLevels` means that the > verifier makes no claims about the artifact's dependencies. > > Users MUST count each dependency only once per SLSA track, at the highest > level verified. For example, if a dependency meets `SLSA_BUILD_LEVEL_2`, > you include it with the count for `SLSA_BUILD_LEVEL_2` but not the count for > `SLSA_BUILD_LEVEL_1`."
        constrained_by:
          - "slsa-vsa-1-2#R-0056"
          - "slsa-vsa-1-2#R-0057"
          - "slsa-vsa-1-2#R-0058"
