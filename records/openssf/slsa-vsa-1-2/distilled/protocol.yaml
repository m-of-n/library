roles:
  - name: "verifier"
    locator: "§2, §3.2, §5, §6"
    kind: "stated"
    definition: >-
      The entity that checks one or more artifacts, together with attestations about them, against a
      policy and states the outcome in a VSA. The source also calls it the VSA producer (§5) and the VSA
      issuer (§6); a bare producer in §3.2, §5 and §5.1 is read as this role (OI-02). Consumers know it by
      predicate.verifier.id.
    quotes:
      - source_lines: "42-45"
        quote: |-
          A Verification Summary Attestation (VSA) is an attestation that some entity (`verifier`) verified one or more software artifacts (the `subject` of an in-toto attestation [Statement]) by evaluating the artifact and a `bundle` of attestations against some `policy`.
      - source_lines: "295-296"
        quote: |-
          This step identifies the VSA producer in cases where their identity is not implicitly revealed in step 1.
      - source_lines: "380-381"
        quote: |-
          if the VSA issuer does not want to make a claim about the track level an artifact meets
  - name: "signer"
    locator: "§3.2, §5"
    kind: "stated"
    definition: >-
      Whoever holds the key that signs the VSA envelope, checked in §5 step 1. Not necessarily the
      verifier's own identity: consumers accept a VSA only from particular (signer, verifier) pairs, and
      the verifier field is carried even where the signer would already tell the consumer who the verifier
      is.
    quotes:
      - source_lines: "130"
        quote: |-
          Consumers MUST accept only specific (signer, verifier) pairs.
      - source_lines: "135"
        quote: |-
          The field is required, even if it is implicit from the signer,
  - name: "consumer"
    locator: "§1, §2, §5, §5.1"
    kind: "stated"
    definition: >-
      The party relying on a VSA in place of evaluating the artifact and its attestations itself. Holds
      the roots of trust, the accepted (signer, verifier) pairs and the values it expects (resourceUri,
      verifiedLevels); runs §5; then decides about the artifact on its own account. Named software
      consumers (§1), users who trust the verifier (§2), VSA consumers (§5) and consumer C (§5.1); §2's
      policy verifiers are read here where they evaluate a VSA (OI-12).
    quotes:
      - source_lines: "28-30"
        quote: |-
          This allows software consumers to make a decision about the validity of an artifact without needing to have access to all of the attestations about the artifact or all of its transitive dependencies.
      - source_lines: "274"
        quote: |-
          VSA consumers use VSAs to accomplish goals based on delegated trust.
  - name: "software-producer"
    locator: "§1"
    kind: "stated"
    definition: >-
      Named in §1 only: the maker of the software, who can keep its build pipeline confidential and still
      convey that verification took place. No step of §3.2, §5 or §5.1 names it unambiguously; its one
      step here (F01 step 1) is inferred.
    quotes:
      - source_lines: "34-35"
        quote: |-
          It also allows software producers to keep the details of their build pipeline confidential while still communicating that some verification has taken place.
flows:
  - id: "F01"
    name: "vsa-issuance"
    title: "A verifier evaluates an artifact and issues a VSA"
    locator: "§2, §3, §3.1, §3.2, §6"
    kind_of_flow: "issuance"
    participants:
      - "software-producer"
      - "verifier"
      - "signer"
      - "consumer"
    summary: >-
      The verifier checks the artifact and the attestations supplied with it against a policy, writes the
      outcome and its own identity into the predicate of an in-toto Statement whose subject is the
      artifact, and the Statement is signed as a VSA envelope. The source fixes what the VSA must say, not
      how the verifier evaluates, signs or distributes it.
    order_note: >-
      The source fixes no order. Steps 4 to 12 follow the field order of §3; the outcome (step 2) precedes
      steps 9 and 10, step 3 precedes step 11, and signing (step 14) follows the Statement.
    steps:
      - n: "1"
        from: "software-producer"
        to: "verifier"
        message: "artifact and attestation bundle"
        action: >-
          Hand the verifier the artifact together with attestations about it, such as its provenance.
        locator: "§2"
        kind: "inferred"
        inferred_reason: >-
          §2 names the inputs the verifier evaluates, artifact and attestations; who supplies them, and how,
          is not stated (OI-01).
        quotes:
          - source_lines: "44-45"
            quote: |-
              by evaluating the artifact and a `bundle` of attestations against some `policy`.
        constrained_by:
          - "slsa-vsa-1-2#R-0019"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "policy"
        action: >-
          Evaluate the artifact and the bundle against the policy. The outcome is a pass or a fail and, on a
          pass, the highest level reached in each track.
        locator: "§2, §3.2"
        kind: "stated"
        opaque: "yes"
        opaque_reason: >-
          Policy semantics and the SLSA level requirements live on other SLSA pages; this source names only
          the outcome.
        quotes:
          - source_lines: "169"
            quote: |-
              Describes the policy that the `subject` was verified against.
        constrained_by:
          - "slsa-vsa-1-2#R-0019"
          - "slsa-vsa-1-2#R-0041"
        on_error: >-
          A fail is not an error of this flow: it is issued as a VSA with verificationResult FAILED (steps 9
          and 10).
        on_error_basis: "stated"
        error_path: "E11"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "dependencyLevels"
        field: "dependencyLevels"
        action: >-
          Optionally work out the levels of the artifact's transitive dependencies (F02). Skipping it is
          allowed: dependencyLevels is optional, and leaving it unset claims nothing.
        locator: "§2, §3.2"
        kind: "stated"
        quotes:
          - source_lines: "50-51"
            quote: |-
              The VSA also allows consumers to determine the verified levels of all of an artifact’s _transitive_ dependencies.
        constrained_by:
          - "slsa-vsa-1-2#R-0056"
          - "slsa-vsa-1-2#R-0060"
          - "slsa-vsa-1-2#R-0088"
        on_error: "See F02 (E12, E13)."
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "VSA predicate"
        field: "verifier"
        action: >-
          Name itself: verifier.id, a URI for its identity, chosen to reflect the trust base consumers care
          about; optionally verifier.version, components of the verification platform mapped to versions. The
