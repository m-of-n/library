  version: >-
    SLSA Verification Summary Attestation v1.2, predicateType https://slsa.dev/verification_summary/v1
applicability: >-
  The source defines one signed message, the VSA, and two procedures around it: a verifier evaluates
  an artifact and issues the VSA (§2, §3.2), and a consumer verifies the VSA against its own
  configuration (§5, seven mandatory checks and one optional), with two worked examples (§5.1). §2
  adds how a verifier derives the levels of transitive dependencies, partly by consuming other VSAs.
  Signature creation and checking, roots of trust, provenance verification and the SLSA level
  definitions are outside the source and appear only as opaque steps. Nothing travels back from
  consumer to verifier.
conventions:
  quoting: >-
    Every quotation is a quotes item {source_lines, quote}; the words were cut from
    .cache/slsa-vsa-1-2.txt by script (bin/_source_text reading, whitespace collapsed) between two
    anchor phrases and the range tightened to the fewest lines that hold them; none was typed. The
    source's Markdown blockquote markers (>) inside a span are kept. bin/check-quotes verifies every
    one. Text in action, note, on_error and the other prose keys is this file's wording.
  step_kind: >-
    kind is stated (the source says this step happens) or inferred (this model's step, with
    inferred_reason saying what the source does and does not say).
  on_error_basis: >-
    stated: the source says what follows. unspecified: the source names the operation and says nothing
    about its failure. inferred: this file's reading. §5 never states the outcome of a failed check;
    reading each Verify that as a pass-or-fail test is inferred.
  opaque: >-
    opaque yes marks a step whose content another document defines (envelope and signature, roots of
    trust, provenance, SLSA levels); the step is modelled only as a pass or a fail.
  constrained_by: >-
    slsa-vsa-1-2#R-NNNN ids of requirements.yaml whose text the step obeys or that bind what it emits,
    each emitted by script from a phrase of the skeleton text (bin/fx1-skeleton, committed at a569508),
    refusing zero or several matches; every resolved pair was read. Pass 1 cited only the skeleton's
    R-0001 to R-0015, the requirements lane adding ids at the same time. Pass 2 (verify) rewired every
    step and error path to the full table (R-0001 to R-0094) by script from the id table, citing the
    split child that carries the statement a step obeys in place of its parent, moving every promoted
    candidate to its requirement id, and reading each resolved pair.
  candidates: >-
    C-NNNN ids of inferred-candidates.yaml for the keyword-less statements a step relies on, selected
    the same way (the two §5.1 examples share their bullet texts, so those were selected by text and
    line). Since pass 2, candidates lists rejected candidates only: a promoted one is cited by its
    requirement id under constrained_by. keyword_less_statements lists every such statement, with
    candidate none where the skeleton made no candidate, and the requirement id that now carries it,
    or none with the reason.
  messages: >-
    message names the source's own term for what moves (VSA envelope, VSA Statement, VSA predicate,
    provenance, policy, and the out-of-band values of F03). Pass 3 joined every name to messages.yaml
    by script: message_map below is the table; a step names what travels, so step 14 (verifier to
    signer) carries the VSA Statement and the VSA envelope comes back.
  roles: "from and to name roles of the roles list; from equal to to marks a local step."
