source_defects:
  # Ids are normative.md's canonical ones since pass 2 merged the lanes' lists there; lane_id is this
  # lane's pass 1 id, which the crosswalk in normative.md maps.
  - id: "SD-15"
    lane_id: "SD-01"
    title: >-
      §5.1 checks a field named slsaResult; the field is verificationResult, and §7 records the typo as
      fixed
    locators:
      - "§5.1 (L336, L360)"
      - "§5 (L302)"
      - "§3, §3.2 (L95, L188)"
      - "§7 (L405-406)"
    quotes:
      - source_lines: "336"
        quote: |-
          `slsaResult` is `PASSED`.
      - source_lines: "302"
        quote: |-
          Verify that the value for `verificationResult` is `PASSED`.
      - source_lines: "405-406"
        quote: |-
          Fixed a typo where the verificationResult was incorrectly referred to as slsaResult.
    description: >-
      Both §5.1 examples check slsaResult against PASSED. No predicate field has that name: §3 and §3.2
      define verificationResult and §5 step 6 checks it. SlsaResult (§6) is the type of the elements of
      verifiedLevels and dependencyLevels' keys, whose defined forms are track levels and FAILED. The 1.2
      change history says this typo was fixed; in the 1.2 text it survives at L336 and L360.
    consequence: >-
      Code or tests written from the examples read a field no VSA carries. A consumer ignoring
      unrecognized fields (R-0001) then finds nothing to compare, and either always rejects or silently
      skips the result check.
    modelled_as: "F05 step 9 and F06 step 8 check verificationResult (F04 step 8, M01.T14)."
  - id: "SD-14"
    lane_id: "SD-02"
    title: "§5.1 example 2 tests the verifiedLevels array with is"
    locators:
      - "§5.1 (L362, L338)"
      - "§5 (L305)"
      - "§3, §3.2 (L96, L193-199)"
    quotes:
      - source_lines: "362"
        quote: |-
          `verifiedLevels` is `SLSA_BUILD_LEVEL_2` or `SLSA_BUILD_LEVEL_3`.
      - source_lines: "305"
        quote: |-
          Verify that `verifiedLevels` contains the expected value.
      - source_lines: "338"
        quote: |-
          `verifiedLevels` contains `SLSA_BUILD_LEVEL_UNEVALUATED`.
    description: >-
      verifiedLevels is an array holding at most one level per track (§3, §3.2). §5 step 7 and example 1
      test it with contains; example 2 with is. Read literally, is holds only for a one-element array, so
      a VSA that also reports a level in another track (the source track, in v1.2) fails example 2.
    consequence: >-
      An implementation of example 2 by equality rejects valid VSAs that report more than one track.
    modelled_as: "F06 step 9 tests contains one of SLSA_BUILD_LEVEL_2, SLSA_BUILD_LEVEL_3 (M01.T16)."
  - id: "SD-20"
    lane_id: "SD-03"
    title: "§2 method (b) cannot count a shared dependency once, which R-0061 requires"
    locators:
      - "§2 (L54-58)"
      - "§3.2 (L216-219)"
    quotes:
      - source_lines: "57-58"
        quote: |-
          and using `vsa.verifiedLevels` and `vsa.dependencyLevels`.
      - source_lines: "216-217"
        quote: |-
          Users MUST count each dependency only once per SLSA track, at the highest > level verified.
    description: >-
      Method (b) builds a dependency's contribution from another VSA's verifiedLevels and
      dependencyLevels. dependencyLevels holds counts, not which dependencies were counted, so a verifier
      adding them up cannot see that two dependency VSAs counted the same transitive dependency. Example:
      A depends on B and C, and both depend on D. A has 3 distinct transitive dependencies; B, C, and one
      from each of their dependencyLevels make 4. Enumerated by a scratch script (not committed), and
      replayed by pass 2 with its own, over every DAG on nodes 0 to n-1 whose edges run from a lower to a
      higher number, n = 2 to 6 (2^(n(n-1)/2) graphs each, 33,866 in all, node 0 the artifact; every DAG
      of up to 6 nodes is isomorphic to one of them, and 10,105 have every node reachable from node 0).
      Pass 1 called these every DAG of 2 to 6 nodes, which they are not: 6 labelled nodes alone admit
      3,781,503. Assuming each dependency VSA counts its own closure correctly, the sum exceeds the
      distinct count in 23,845, exactly those where two direct dependencies' closures (each with the
      dependency itself) intersect; the excess is, over each shared dependency, the number of direct
      dependencies reaching it minus one; the sum is never short. With method (b) at every level instead,
      the total, the number of paths, exceeds the distinct count in 25,165 of the same graphs, exactly
      those whose part reachable from the artifact is not a tree. The source gives no combining rule;
      summing is this model's reading of using the two fields.
    consequence: >-
      Wherever a dependency is reached along two paths that part at a VSA whose counts were added up,
      dependencyLevels overstates the counts, and nothing in the VSA lets a consumer detect it.
    modelled_as: "F02 steps 5 and 6 (notes); M03.T11 action and M03.T13 note."
  - id: "SD-5"
    lane_id: "SD-04"
    title: "The (signer, verifier) example speaks of signing provenance"
    locators:
      - "§3.2 (L130-133)"
    quotes:
      - source_lines: "130-133"
        quote: |-
          For example, > "GitHub" can sign provenance for the "GitHub Actions" verifier, and "Google" > can sign provenance for the "Google Cloud Deploy" verifier, but "GitHub" cannot > sign for the "Google Cloud Deploy" verifier.
    description: >-
      The rule it illustrates governs who may sign a VSA for a given verifier, and §5 step 1 checks the
      envelope's signature. The example has GitHub sign provenance for its Actions verifier; what a
      verifier's signer signs in this document is the VSA.
    consequence: >-
      Editorial: the rule is unaffected, but a reader may take the pairs to concern provenance signers.
    modelled_as: "F03 step 2 and F04 step 6 apply the pairs to the VSA signer."
open_issues:
  - id: "OI-01"
    locator: "§2, §5"
    text: >-
      How the verifier obtains the artifact, the bundle of attestations and the policy, and how a VSA
      reaches consumers, are not defined (F01 steps 1 and 15, F04 step 1).
  - id: "OI-02"
    locator: "§1, §3.2, §5, §5.1"
    text: >-
      producer is never defined. §1 speaks of software producers; §3.2 (resourceUri, R-0094, R-0006), §5
      (L277, L284, L295, L300) and §5.1 (L341) use producer for the party issuing the VSA, as does §3.1
      (L115, R-0002). This model gives R-0094, R-0006 and the prenegotiation to the verifier as VSA
      producer; where the software producer and the verifier are different organisations, which of them
      owes R-0006's out-of-band communication is unclear. Source defect SD-21.
  - id: "OI-03"
    locator: "§2, §3.2, §6"
    text: >-
      Users names different parties: the consumer at L45 (users who trust the verifier), and whoever
      writes the VSA in R-0054 (L199), R-0061 (L216) and R-0080, R-0081 (L396). This model assigns each
      to the step that can act on it. Source defect SD-9.
  - id: "OI-04"
    locator: "§5"
    text: >-
      §5 step 2 has the subject match the artifact's digest; subject is a list of descriptors, each with a
      set of digests. Which entry, which algorithm, and whether one common algorithm suffices are not said
      here (§5.1 writes subject is A); this model defers to the in-toto Statement rules, outside this
      source. Source defect SD-26.
  - id: "OI-05"
    locator: "§3.2, §5, §5.1"
    text: >-
      §5 step 4 matches the verifier object to a public key (or equivalent). The relation is the
      consumer's accepted (signer, verifier) pairs (R-0004), which §5 does not mention; §5.1 compares
      verifier.id alone, so verifier.version plays no part; what counts as an equivalent of a public key
      is not said. Source defect SD-13; read through R-0082.
  - id: "OI-06"
    locator: "§3.2, §5"
    text: >-
      Of the six fields §3.2 marks required (verifier, verifier.id, resourceUri, policy,
      verificationResult, verifiedLevels), policy is the one no mandatory step of §5 reads. A VSA without
      it passes steps 1 to 7; whether a consumer rejects a VSA lacking a required field is not stated.
      Source defect SD-27.
  - id: "OI-07"
    locator: "§3.2, §6"
    text: >-
      A failure is written as verificationResult FAILED and verifiedLevels FAILED, but no rule ties the
      two fields together (PASSED beside FAILED, or FAILED beside levels, is not excluded), and whether a
      verifier issues a VSA for a failed verification at all is not stated (M02.T05). Source defect
      SD-8; read through R-0090.
  - id: "OI-08"
    locator: "§2"
    text: >-
      Method (b) matches on digest and only ideally on resourceUri; how two digest sets compare
      (subject.digest == resolvedDependencies.digest) is not said; and whether the matched VSA must itself
      pass §5 is not said (F02 step 4 infers that it must). Source defect SD-26.
  - id: "OI-09"
    locator: "§2, §3.2, §6"
    text: >-
      A dependency neither method determines (no provenance, no matching VSA, or one that fails), and
      every source dependency (both methods name non-source dependencies only, while §6 defines
      source-track levels), has no counting rule: left out, counted at level 0, or a reason to leave
      dependencyLevels unset. So the counts alone cannot show that every dependency reached a level; a
      requirement such as every dependency at build level 2 or above is decidable only if the verifier
      counts every dependency somewhere. Source defects SD-11 and SD-2; the consumer check is R-0087.
  - id: "OI-10"
    locator: "§5"
    text: >-
      §5 introduces the steps as ones most verification procedures share (L278-279), then makes them
      mandatory (L281). This model follows the MUST. Source defect SD-12.
  - id: "OI-11"
    locator: "§3.2, §5"
    text: >-
      No time or lifetime rule. timeVerified is optional and nothing reads it, so an old or replayed VSA
      passes §5 while digest, resourceUri and the other checks hold; a consumer wanting freshness has only
      the optional step, and the VSA may carry no timeVerified. Nor is there revocation: L316-318 leave a
      compromised verifier to the consumer's choice of roots of trust. Not a source defect: the page
      leaves lifetime to other documents (normative.md crosswalk).
  - id: "OI-12"
    locator: "§2"
    text: >-
      §2 says the VSA lets consumers learn the level of every transitive dependency (L50-51);
      dependencyLevels says how many dependencies are at each level, not which. And §2's policy verifiers
      (L58-59) are not otherwise defined: a consumer applying its own policy, or a verifier issuing a VSA
      of its own. Source defects SD-20 (counts, not identities) and SD-21 (who the parties are).
