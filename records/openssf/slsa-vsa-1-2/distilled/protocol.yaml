  - id: "F04"
    name: "vsa-verification"
    title: "A consumer verifies a VSA"
    locator: "§3.1, §5"
    kind_of_flow: "verification"
    participants:
      - "verifier"
      - "consumer"
    summary: >-
      §5: the consumer establishes that the VSA is authentic and that it meets the consumer's goal. Seven
      checks are mandatory and one is optional; each compares the VSA with the artifact in hand or with
      F03's configuration. Nothing is sent back to the verifier, and the source names no action on
      failure.
    order_note: >-
      The source numbers the checks but fixes an order only where §5 step 4 uses the key of step 1, and
      reading the payload (step 3, inferred) must precede the field checks. Each check is a test of the
      parsed VSA, so the verdict does not depend on their order; only which failure is reported first
      does.
    steps:
      - n: "1"
        from: "verifier"
        to: "consumer"
        message: "VSA envelope"
        action: "The consumer holds a VSA envelope and the artifact in question, or its digest."
        locator: "§5"
        kind: "inferred"
        inferred_reason: "§5 starts from a VSA in hand; how it arrives is not stated (OI-01)."
        constrained_by:
          - "slsa-vsa-1-2#R-0083"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "consumer"
        to: "consumer"
        message: "VSA envelope"
        source_step: "§5 step 1"
        action: >-
          Verify the envelope's signature against the preconfigured roots of trust: the VSA comes from a
          trusted producer and is unmodified.
        locator: "§5"
        kind: "stated"
        opaque: "yes"
        opaque_reason: >-
          Envelope format, signature scheme and roots of trust belong to the in-toto attestation framework and
          the consumer's configuration, not to this source.
        quotes:
          - source_lines: "283-285"
            quote: |-
              Verify the signature on the VSA envelope using the preconfigured roots of trust. This step ensures that the VSA was produced by a trusted producer and that it hasn't been tampered with.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0067"
        candidates:
          - "C-0009"
        on_error: "VSA not verified."
        on_error_basis: "inferred"
        error_path: "E02"
      - n: "3"
        from: "consumer"
        to: "consumer"
        message: "VSA Statement"
        action: >-
          Read the payload as an in-toto Statement, ignoring any field it does not recognize; minor versions
          are backwards compatible and keep the predicateType, so this is what lets a consumer built for one
          1.x version read a VSA of another.
        locator: "§3.1"
        kind: "inferred"
        inferred_reason: >-
          The source has no parse step. R-0001 binds consumers when reading; putting the read after the
          signature and before the field checks is this model's.
        quotes:
          - source_lines: "113-114"
            quote: |-
              Minor version changes are always backwards compatible and "monotonic." Such changes do not update the `predicateType`.
        constrained_by:
          - "slsa-vsa-1-2#R-0024"
          - "slsa-vsa-1-2#R-0001"
          - "slsa-vsa-1-2#R-0026"
          - "slsa-vsa-1-2#R-0027"
        on_error: "A payload that is not a Statement cannot pass steps 4 to 9: not verified, inferred."
        on_error_basis: "inferred"
        error_path: "E01"
      - n: "4"
        from: "consumer"
        to: "consumer"
        message: "VSA Statement"
        field: "subject"
        source_step: "§5 step 2"
        action: >-
          Check that a subject entry of the Statement carries the digest of the artifact being checked. Which
          entry and which digest algorithm make a match is left to the in-toto Statement rules (OI-04).
        locator: "§5"
        kind: "stated"
        quotes:
          - source_lines: "287-288"
            quote: |-
              Verify the statement's `subject` matches the digest of the artifact in question. This step ensures that the VSA pertains to the intended artifact.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0068"
        candidates:
          - "C-0011"
        on_error: "VSA not verified."
        on_error_basis: "inferred"
        error_path: "E03"
      - n: "5"
        from: "consumer"
        to: "consumer"
        message: "VSA Statement"
        field: "predicateType"
        source_step: "§5 step 3"
        action: "Check that predicateType is exactly https://slsa.dev/verification_summary/v1."
        locator: "§5"
        kind: "stated"
        quotes:
          - source_lines: "290-292"
            quote: |-
              Verify that the `predicateType` is `https://slsa.dev/verification_summary/v1`. This step ensures that the in-toto predicate is using this version of the VSA format.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0069"
        candidates:
          - "C-0013"
        on_error: "VSA not verified."
        on_error_basis: "inferred"
        error_path: "E04"
      - n: "6"
        from: "consumer"
        to: "consumer"
        message: "VSA predicate"
        field: "verifier"
        source_step: "§5 step 4"
        action: >-
          Check that the verifier the predicate names (verifier.id, in §5.1) is one the key of step 2 may sign
          for: an accepted (signer, verifier) pair from F03 step 2. The source adds that this step is what
          identifies the producer when the key alone does not.
        locator: "§3.2, §5"
        kind: "stated"
        quotes:
          - source_lines: "294-296"
            quote: |-
              Verify that the `verifier` matches the public key (or equivalent) used to verify the signature in step 1. This step identifies the VSA producer in cases where their identity is not implicitly revealed in step 1.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0070"
          - "slsa-vsa-1-2#R-0004"
          - "slsa-vsa-1-2#R-0082"
        on_error: "VSA not verified."
        on_error_basis: "inferred"
        error_path: "E05"
      - n: "7"
        from: "consumer"
        to: "consumer"
        message: "VSA predicate"
        field: "resourceUri"
        source_step: "§5 step 5"
        action: >-
          Check that resourceUri matches the expected value from F03: the fetch URI, or what the producer
          communicated, or the value its communicated rule yields.
        locator: "§3.2, §5"
        kind: "stated"
        quotes:
          - source_lines: "298-300"
            quote: |-
              Verify that the value for `resourceUri` in the VSA matches the expected value. This step ensures that the consumer is using the VSA for the producer's intended purpose.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0071"
          - "slsa-vsa-1-2#R-0094"
          - "slsa-vsa-1-2#R-0006"
          - "slsa-vsa-1-2#R-0091"
        candidates:
          - "C-0016"
        on_error: "VSA not verified; E10 where no expected value is known."
        on_error_basis: "inferred"
        error_path: "E06"
      - n: "8"
        from: "consumer"
        to: "consumer"
        message: "VSA predicate"
        field: "verificationResult"
        source_step: "§5 step 6"
        action: "Check that verificationResult is PASSED."
        locator: "§5"
        kind: "stated"
        quotes:
          - source_lines: "302-303"
            quote: |-
              Verify that the value for `verificationResult` is `PASSED`. This step ensures the artifact is suitable for the consumer's purposes.
        note: >-
          A FAILED VSA (F01, E11) is well formed; it can pass every earlier check and still fails here.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0072"
        candidates:
          - "C-0018"
        on_error: "VSA not verified."
        on_error_basis: "inferred"
        error_path: "E07"
      - n: "9"
        from: "consumer"
        to: "consumer"
        message: "VSA predicate"
        field: "verifiedLevels"
        source_step: "§5 step 7"
        action: >-
          Check that the expected value is among verifiedLevels. A VSA lists only the highest level per track
          and a level implies those below it, so an expectation of level n in a track is met by level n or
          higher in that track; §5.1 example 2 writes this out as a set of values.
        locator: "§3.2, §5, §6"
        kind: "stated"
        quotes:
          - source_lines: "305-306"
            quote: |-
              Verify that `verifiedLevels` contains the expected value. This step ensures that the artifact is suitable for the consumer's purposes.
        note: >-
          The level-implication reading is this model's (inferred); step 7 itself says only contains.
        constrained_by:
          - "slsa-vsa-1-2#R-0011"
          - "slsa-vsa-1-2#R-0073"
          - "slsa-vsa-1-2#R-0054"
          - "slsa-vsa-1-2#R-0055"
          - "slsa-vsa-1-2#R-0079"
          - "slsa-vsa-1-2#R-0084"
        candidates:
          - "C-0020"
        on_error: "VSA not verified."
        on_error_basis: "inferred"
        error_path: "E08"
      - n: "10"
        from: "consumer"
        to: "consumer"
        message: "VSA predicate"
        source_step: "§5 optional step 1"
        action: >-
          Optionally check whatever further fields the goal needs, for example dependencyLevels (F07), policy,
          timeVerified, inputAttestations or slsaVersion.
        locator: "§5"
        kind: "stated"
        quotes:
          - source_lines: "310-311"
            quote: |-
              (Optional) Verify additional fields required to determine whether the VSA meets your goal.
        note: "The example fields are this model's; the source names none."
        constrained_by:
          - "slsa-vsa-1-2#R-0012"
          - "slsa-vsa-1-2#R-0074"
        on_error: "VSA does not meet the goal."
        on_error_basis: "inferred"
        error_path: "E09"
      - n: "11"
        from: "consumer"
        to: "consumer"
        action: >-
          Every check passed: the VSA is verified, and the consumer may take the artifact to meet the
          indicated level without evaluating it or seeing its attestations, deferring to the verifier's
          decision.
        locator: "§1, §2"
        kind: "stated"
        quotes:
          - source_lines: "45-48"
            quote: |-
              Users who trust the `verifier` may assume that the artifacts met the indicated SLSA level without themselves needing to evaluate the artifact or to have access to the attestations the `verifier` used to make its determination.
          - source_lines: "30-32"
            quote: |-
              They can use it to delegate complex policy decisions to some trusted party and then simply trust that party's decision regarding the artifact.
        note: "What the consumer does with the artifact after a failure is not stated."
        constrained_by:
          - "slsa-vsa-1-2#R-0085"
        candidates:
          - "C-0001"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
  - id: "F05"
    name: "delegated-decision"
    title: "§5.1 example 1: the whole decision delegated to the verifier"
    locator: "§5.1"
    kind_of_flow: "example"
    participants:
      - "consumer"
      - "verifier"
    summary: >-
      Consumer C leaves to verifier V the decision on artifact A as resource R, as in code signing: the
      expected verifiedLevels value is arbitrary but agreed in advance (here
      SLSA_BUILD_LEVEL_UNEVALUATED), and C checks nothing past the mandatory steps. V both verifies and
      signs here.
    order_note: "The bullets follow §5's step order one for one."
    steps:
      - n: "1"
        from: "consumer"
        to: "consumer"
        action: "C chooses to delegate to V whether to accept A as R."
        locator: "§5.1"
        kind: "stated"
        quotes:
          - source_lines: "322-323"
            quote: |-
              Suppose consumer C wants to delegate to verifier V the decision for whether to accept artifact A as resource R.
        candidates:
          - "C-0023"
          - "C-0024"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "verifier"
        to: "consumer"
        message: "expected verifiedLevels (prenegotiated)"
        action: "V and C agree the verifiedLevels value beforehand (F03 step 6)."
        locator: "§5.1"
        kind: "stated"
        quotes:
