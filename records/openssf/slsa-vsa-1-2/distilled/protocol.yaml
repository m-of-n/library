          value.
        locator: "§3.2"
        kind: "stated"
        quotes:
          - source_lines: "160-161"
            quote: |-
              This enables the consumer to > easily determine the expected value when [verifying](#how-to-verify).
        constrained_by:
          - "slsa-vsa-1-2#R-0094"
          - "slsa-vsa-1-2#R-0091"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
