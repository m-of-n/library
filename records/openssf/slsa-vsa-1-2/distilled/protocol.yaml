        locator: "§3.2"
        kind: "stated"
        quotes:
          - source_lines: "130-133"
            quote: |-
              For example, > "GitHub" can sign provenance for the "GitHub Actions" verifier, and "Google" > can sign provenance for the "Google Cloud Deploy" verifier, but "GitHub" cannot > sign for the "Google Cloud Deploy" verifier.
        note: "The example speaks of signing provenance (SD-5)."
        constrained_by:
          - "slsa-vsa-1-2#R-0004"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "signer"
        to: "consumer"
        message: "public key (or equivalent)"
        action: "Obtain the key, or its equivalent, that each accepted signer signs with."
        locator: "§5"
        kind: "inferred"
        inferred_reason: >-
          §5 step 1 verifies against preconfigured roots of trust and step 4 matches the verifier to the
