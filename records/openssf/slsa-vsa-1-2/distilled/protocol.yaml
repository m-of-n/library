  - id: "F02"
    name: "dependency-levels"
    title: "A verifier determines the levels of transitive dependencies"
    locator: "§2, §3.2"
    kind_of_flow: "local"
    participants:
      - "verifier"
      - "consumer"
    summary: >-
      §2's two ways for a verifier to learn the levels of an artifact's transitive dependencies, both
      starting from the resolvedDependencies of the artifact's provenance: verify each non-source
      dependency's own provenance, recursively (a), or match the dependency to a VSA for it and reuse that
      VSA's verifiedLevels and dependencyLevels (b). Each dependency is then counted once per track, at
      its highest level.
    order_note: >-
      Methods (a) and (b) are alternatives for each dependency; whether one artifact may mix them is not
      said. Counting (step 6) follows the determination of every dependency.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "provenance"
        field: "resolvedDependencies"
        action: "Take the dependencies listed in resolvedDependencies of the artifact being verified."
        locator: "§2"
        kind: "stated"
        opaque: "yes"
        opaque_reason: >-
          Provenance and its verification are SLSA Provenance and Verifying artifacts, outside this source.
        quotes:
          - source_lines: "51-54"
            quote: |-
              The verifier does this by either a) verifying the provenance of each non-source dependency listed in the [resolvedDependencies](build-provenance#resolvedDependencies) of the artifact being verified (recursively)
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "provenance"
        action: >-
          Method (a): for each non-source dependency, verify its provenance and repeat on that provenance's
          resolvedDependencies.
        locator: "§2"
        kind: "stated"
        opaque: "yes"
        opaque_reason: >-
          Provenance and its verification are SLSA Provenance and Verifying artifacts, outside this source.
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
        on_error: >-
          A dependency whose provenance is missing or fails has no determined level; how it is counted is not
          stated (OI-09).
        on_error_basis: "unspecified"
        error_path: "E13"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "VSA envelope"
        field: "subject, resourceUri"
        action: >-
          Method (b): find a VSA for the dependency whose subject digest equals the dependency's digest in
          resolvedDependencies and, preferably but not necessarily, whose resourceUri equals the dependency's
          uri.
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "54-57"
            quote: |-
              or b) matching the non-source dependency listed in `resolvedDependencies` (`subject.digest` == `resolvedDependencies.digest` and, ideally, `vsa.resourceUri` == `resolvedDependencies.uri`) to a VSA _for that dependency_
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
        on_error: "No VSA matches: method (b) is unavailable for this dependency; no fallback is stated."
        on_error_basis: "unspecified"
        error_path: "E12"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "VSA envelope"
        action: >-
          Before relying on the matched VSA, verify it the way a consumer would (F04), against the verifier's
          own roots of trust, with the dependency's uri as the expected resourceUri.
        locator: "§2, §5"
        kind: "inferred"
        inferred_reason: >-
          §2 says only that the VSA is matched and its fields used. Relying on fields §5 requires a consumer
          to check, unchecked, would undo §5; the expected resourceUri is this model's choice (OI-08).
        on_error: "Treated as no match (E12), inferred."
        on_error_basis: "inferred"
        error_path: "E12"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "VSA predicate"
        field: "verifiedLevels, dependencyLevels"
        action: >-
          Take the matched VSA's verifiedLevels as the dependency's own levels and its dependencyLevels as the
          counts of the dependency's own transitive dependencies.
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "57-58"
            quote: |-
              and using `vsa.verifiedLevels` and `vsa.dependencyLevels`.
        note: >-
          The source gives no rule for combining these counts with the rest; summing them is this model's
          reading, and it breaks step 6 for any dependency reached along two paths (SD-20).
        constrained_by:
          - "slsa-vsa-1-2#R-0020"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from: "verifier"
        to: "verifier"
        field: "dependencyLevels"
        action: >-
          In each track, count every transitive dependency exactly once, at the best level it reached in that
          track: a dependency at level 2 adds to the level-2 count and to no lower one.
        locator: "§3.2"
        kind: "stated"
        quotes:
          - source_lines: "216-219"
            quote: |-
              Users MUST count each dependency only once per SLSA track, at the highest > level verified. For example, if a dependency meets `SLSA_BUILD_LEVEL_2`, > you include it with the count for `SLSA_BUILD_LEVEL_2` but not the count for > `SLSA_BUILD_LEVEL_1`.
        note: >-
          Method (b) cannot meet this when two dependency VSAs both count a shared dependency (SD-20).
        constrained_by:
          - "slsa-vsa-1-2#R-0061"
          - "slsa-vsa-1-2#R-0062"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "7"
        from: "verifier"
        to: "verifier"
        field: "dependencyLevels"
        action: >-
          Emit the counts as a map from SlsaResult to integer. An empty map asserts the artifact has no
          dependencies at all; to claim nothing, leave the field unset or null instead (F01 step 11).
        locator: "§3.2"
        kind: "stated"
        quotes:
          - source_lines: "212-214"
            quote: |-
              A set but empty `dependencyLevels` object means that the artifact has **no** > dependency at all, while an unset or null `dependencyLevels` means that the > verifier makes no claims about the artifact's dependencies.
        constrained_by:
          - "slsa-vsa-1-2#R-0058"
          - "slsa-vsa-1-2#R-0060"
          - "slsa-vsa-1-2#R-0089"
          - "slsa-vsa-1-2#R-0014"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from: "verifier"
        to: "consumer"
        message: "VSA envelope"
        field: "dependencyLevels"
        action: "The counts travel inside the VSA (F01), for the consumer to read (F07)."
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "50-51"
            quote: |-
              The VSA also allows consumers to determine the verified levels of all of an artifact’s _transitive_ dependencies.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
  - id: "F03"
    name: "verification-setup"
    title: "What a consumer holds before it verifies"
    locator: "§3.2, §5, §5.1"
    kind_of_flow: "setup"
    participants:
