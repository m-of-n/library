  - id: "F07"
    name: "dependency-policy"
    title: "A consumer applies a minimum requirement to dependency levels"
    locator: "§2, §3.2"
    kind_of_flow: "verification"
    participants:
      - "verifier"
      - "consumer"
    summary: >-
      A consumer (in §2's words, a policy verifier) sets a minimum requirement on the levels of the
      artifact's dependencies and checks it against dependencyLevels, within §5's optional step. The field
      reads three ways: unset (no claims), empty (no dependencies), or counts per level, where a level the
      map leaves out counts zero.
    order_note: "Steps 2 to 4 are alternatives on the state of the field."
    steps:
      - n: "1"
        from: "verifier"
        to: "consumer"
        message: "VSA envelope"
        field: "dependencyLevels"
        action: "The consumer holds a VSA that has passed F04's mandatory steps."
        locator: "§5"
        kind: "inferred"
        inferred_reason: >-
          The source does not place dependency rules after the mandatory steps; it makes further fields an
          optional check (§5).
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "consumer"
        to: "consumer"
        field: "dependencyLevels"
        action: >-
          dependencyLevels unset or null: the verifier claims nothing about the dependencies, so no
          requirement on them can be shown to hold.
        locator: "§3.2"
        kind: "stated"
        quotes:
          - source_lines: "212-214"
            quote: |-
              A set but empty `dependencyLevels` object means that the artifact has **no** > dependency at all, while an unset or null `dependencyLevels` means that the > verifier makes no claims about the artifact's dependencies.
        constrained_by:
          - "slsa-vsa-1-2#R-0060"
          - "slsa-vsa-1-2#R-0087"
        on_error: "A requirement on dependencies cannot be met (E14), inferred."
        on_error_basis: "inferred"
        error_path: "E14"
      - n: "3"
        from: "consumer"
        to: "consumer"
        field: "dependencyLevels"
        action: >-
          dependencyLevels set and empty: the artifact has no dependencies at all, so any requirement on their
          levels holds trivially.
        locator: "§3.2"
        kind: "stated"
        note: "That an empty map satisfies every minimum is this model's reading."
        constrained_by:
          - "slsa-vsa-1-2#R-0060"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "consumer"
        to: "consumer"
        field: "dependencyLevels"
        action: >-
          dependencyLevels set: each key is a level and each value the number of transitive dependencies
          verified at it; a level the map leaves out counts as zero.
        locator: "§3.2"
        kind: "stated"
        quotes:
          - source_lines: "209-211"
            quote: |-
              Map from [SlsaResult] to the number of the artifact's _transitive_ dependencies > that were verified at the indicated level. Absence of a given level of > [SlsaResult] MUST be interpreted as reporting _0_ dependencies at that level.
        constrained_by:
          - "slsa-vsa-1-2#R-0058"
          - "slsa-vsa-1-2#R-0059"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "consumer"
        to: "consumer"
        field: "dependencyLevels"
        action: >-
          Compare the counts with the minimum requirements, for example that no dependency is counted below
          build level 2.
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "58-60"
            quote: |-
              Policy verifiers wishing to establish minimum requirements on dependencies SLSA levels may use `vsa.dependencyLevels` to do so.
        note: >-
          Counts cannot show that every dependency was counted: one verified at no level may simply be missing
          from the map (OI-09).
        constrained_by:
          - "slsa-vsa-1-2#R-0087"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from: "consumer"
        to: "consumer"
        action: "Requirement met: F04 step 10 passes. Not met: the VSA does not meet the goal."
        locator: "§5"
        kind: "inferred"
        inferred_reason: "The source gives no outcome for a dependency requirement."
        constrained_by:
          - "slsa-vsa-1-2#R-0087"
          - "slsa-vsa-1-2#R-0074"
        on_error: "VSA does not meet the goal (E15)."
        on_error_basis: "inferred"
        error_path: "E15"
