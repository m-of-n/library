requirements:
- id: openssf-concise-guide-secure-software#CG-01
  designator: item 1
  title: Ensure all privileged developers use multi-factor authentication (MFA) tokens.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: implementation
  locator: numbered item 1
  text: 1. **Ensure all privileged developers use** [**multi-factor authentication (MFA) tokens**](https://github.com/ossf/great-mfa-project/blob/main/guide/token-usage-guide.md#readme). This includes those with commit or accept privileges. MFA hinders attackers from “taking over” these accounts.
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-02
  designator: item 2
  title: Learn about secure software development.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: training
  locator: numbered item 2
  text: 2. **Learn about secure software development.** Take, e.g., the [free OpenSSF course](https://openssf.org/training/courses/) or the hands-on [Security Knowledge Framework](https://www.securityknowledgeframework.org/) course. [SAFECode’s Fundamental Practices](https://safecode.org/wp-content/uploads/2018/03/SAFECode_Fundamental_Practices_for_Secure_Software_Development_March_2018.pdf) [for Secure Software Development](https://safecode.org/wp-content/uploads/2018/03/SAFECode_Fundamental_Practices_for_Secure_Software_Development_March_2018.pdf) provides a helpful summary.
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-03
  designator: item 3
  title: Use a combination of tools in your CI pipeline to detect vulnerabilities.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: verification
  locator: numbered item 3
  text: 3. **Use a combination of tools in your CI pipeline to detect vulnerabilities**. See the [OpenSSF guide to security tools](https://github.com/ossf/wg-security-tooling/blob/main/guide.md#readme). Tools shouldn’t be the _only_ mechanism, but they scale.
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-04
  designator: item 4
  title: Evaluate software before selecting it as a direct dependency.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: supply-chain
  locator: numbered item 4
  text: 4. **Evaluate software before selecting it as a direct dependency**. Only add it if needed, evaluate it (see [Concise Guide for Evaluating Open Source Software](https://best.openssf.org/Concise-Guide-for-Evaluating-Open-Source-Software)), double-check its name (to counter typosquatting), and ensure it’s retrieved from the correct repository.
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-05
  designator: item 5
  title: Use package managers.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: supply-chain
  locator: numbered item 5
  text: 5. **Use package managers**. Use package managers (system, language-level, and/or container-level) to automatically manage dependencies and enable rapid updates.
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-06
  designator: item 6
  title: Implement automated tests.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: verification
  locator: numbered item 6
  text: 6. **Implement automated tests**. Include negative tests (tests that what shouldn’t happen doesn’t happen) and ensure the test suite is thorough enough to “ship if it passes the tests”.
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-07
  designator: item 7
  title: Monitor known vulnerabilities in your software’s direct & indirect dependencies.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: supply-chain
  locator: numbered item 7
  text: 7. **Monitor known vulnerabilities in your software’s direct & indirect dependencies**. E.g., enable basic scanning via GitHub's [dependabot](https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates) or GitLab [dependency scanning](https://docs.gitlab.com/ee/user/application_security/dependency_scanning/). Many other third party Software Composition Analysis (SCA) tools are also available. Quickly update vulnerable dependencies.
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-08
  designator: item 8
  title: Keep dependencies reasonably up-to-date after a cooldown.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: supply-chain
  locator: numbered item 8
  text: 8. **Keep dependencies reasonably up-to-date after a cooldown**. Outdated dependencies make it hard to update for vulnerabilities. Apply a **cooldown** delay (typically ~3 days) for updating components without known vulnerabilities; cooldowns counter the vast majority of malicious package releases (see [cooldowns.dev](https://cooldowns.dev/) for configuration hints).
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-09
  designator: item 9
  title: Do not push secrets to a repository.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: implementation
  locator: numbered item 9
  text: 9. **Do not push secrets to a repository**. Use tools to detect pushing secrets to a repository.
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-10
  designator: item 10
  title: Review before accepting changes.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: verification
  locator: numbered item 10
  text: 10. **Review before accepting changes**. Enforce this, e.g., using [GitHub](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/defining-the-mergeability-of-pull-requests/about-protected-branches) or [GitLab](https://docs.gitlab.com/ee/user/project/protected_branches.html) protected branches or an equivalent [GitHub ruleset](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets).
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-11
  designator: item 11
  title: Prominently document how to report vulnerabilities & prepare for them.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: deliverable
  phase: operations/response
  locator: numbered item 11
  text: |-
    11. **Prominently document how to report vulnerabilities & prepare for them**.
        - Use resources like the [Guide to coordinated vulnerability disclosure](https://github.com/ossf/oss-vulnerability-guide).
        - [Explicitly disclose security issues affecting vendored dependencies](Vendored-Dependencies-Guide.md).
        - Create a [security policy](https://github.com/ossf/oss-vulnerability-guide/tree/main/templates/security_policies). Provide contacts.
  expects_deliverables:
  - vulnerability reporting documentation / security policy (SECURITY.md) with contacts
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-12
  designator: item 12
  title: Make it easy for your users to update.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: release
  locator: numbered item 12
  text: 12. **Make it easy for your users to update**. Implement stable APIs, e.g., support old names when new ones are added. Use semantic versioning. Have a deprecation process.
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-13
  designator: item 13
  title: Sign your project’s important releases.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: deliverable
  phase: release
  locator: numbered item 13
  text: 13. **Sign your project’s important releases**. Use standard tools and signing formats for your distribution. See the [cosign tool](https://docs.sigstore.dev/quickstart/quickstart-cosign/) from the [sigstore project](https://www.sigstore.dev/) to sign containers and other artifacts.
  expects_deliverables:
  - release signatures
