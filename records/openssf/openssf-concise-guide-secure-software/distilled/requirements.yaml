- id: openssf-concise-guide-secure-software#CG-26
  designator: item 26
  title: Prefer memory-safe languages.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: design
  locator: numbered item 26
  text: 26. **Prefer memory-safe languages**. Many vulnerabilities involve memory safety. Where practical, use memory-safe programming languages (most are) and keep memory safety enabled. Otherwise, use mechanisms like compiler flags, extra tools, and peer review to reduce risk; see [Compiler Options Hardening Guide for C and C++](https://best.openssf.org/Compiler-Hardening-Guides/Compiler-Options-Hardening-Guide-for-C-and-C++).
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-27
  designator: item 27
  title: If a source code (unbuilt) package is released, it should only include content from the version control system (VCS), and source package users should rebuild, if needed, to create production (built) package(s).
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: release
  locator: numbered item 27
  text: 27. **If a source code (unbuilt) package is released, it should only include content from the version control system (VCS), and source package users should rebuild, if needed, to create production (built) package(s)**. E.g., if autotools is used, if a source package is released it should _not_ include a generated `configure` file, while recipients should ignore pre-generated files like `configure` and instead rebuild from source (e.g., with `autoreconf`). This eliminates a malware-hiding mechanism, as illustrated by an attack on [xz utils](https://access.redhat.com/security/cve/CVE-2024-3094).
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-28
  designator: item 28
  title: Ensure production websites only load assets from your own domains.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: design
  locator: numbered item 28
  text: 28. **Ensure production websites only load assets from your own domains**. _Linking_ to other domains is fine, but where practical, don't directly load assets such as JavaScript, CSS, and media (including images) from domains you do not control. If you do, your site might be subverted if that other domain is subverted, so investigate the risks before doing so. See the [subverted polyfill.io revelation in 2024](https://blog.qualys.com/vulnerabilities-threat-research/2024/06/28/polyfill-io-supply-chain-attack).
  expects_deliverables: []
  kind: stated
  testable: partial
- id: openssf-concise-guide-secure-software#CG-29
  designator: item 29
  title: Apply focused security guidelines.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: process
  phase: governance
  locator: numbered item 29
  text: |-
    29. **Apply focused security guidelines**. Consult focused [OpenSSF guides](https://openssf.org/resources/guides/) as applicable, such as the
    [Compiler Options Hardening Guide for C and C++](https://best.openssf.org/Compiler-Hardening-Guides/Compiler-Options-Hardening-Guide-for-C-and-C++),
    [npm Best Practices Guide](https://github.com/ossf/package-manager-best-practices/blob/main/published/npm.md#readme), and the guide to [Correctly Using Regular Expressions for Secure Input Validation](https://best.openssf.org/Correctly-Using-Regular-Expressions).
  expects_deliverables: []
  kind: stated
  testable: partial
