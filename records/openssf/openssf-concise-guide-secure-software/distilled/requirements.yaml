- id: openssf-concise-guide-secure-software#CG-16
  designator: item 16
  title: Notify the community of vulnerabilities in your project.
  normativity: recommendation
  verb: imperative
  actor: 'software developer / project maintainers (stated audience: ''all software developers'')'
  nature: deliverable
  phase: operations/response
  locator: numbered item 16
  text: 16. **Notify the community of vulnerabilities in your project.** Publish security advisories with accurate & precise information, e.g., what usage & versions are vulnerable, mitigations, and fixed version(s). Get a CVE ID. On GitHub, [create your security advisory](https://docs.github.com/en/code-security/repository-security-advisories/creating-a-repository-security-advisory#creating-a-security-advisory) & [request a CVE](https://docs.github.com/en/code-security/repository-security-advisories/about-github-security-advisories-for-repositories#cve-identification-numbers).
  expects_deliverables:
  - security advisories
  - CVE IDs
  kind: stated
  testable: partial
