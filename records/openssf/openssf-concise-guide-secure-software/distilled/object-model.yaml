schema: "library-object-model/v1"
record: openssf-concise-guide-secure-software
source_version: "main@99c65a8522 (2026-09-19); byline 2023-06-14"
extracted: "2026-10-02"
by: "claude (lane E)"
reviewed_by: ""
note: >
  Object-model pass over the 29 numbered items. The guide defines nothing formally; every object
  below is named in an item (kind: stated = the noun appears in the item; inferred = implied by it).
  Locators are "item N".
objects:
  - {name: Developer, definition: "Software developer, the guide's stated audience ('all software developers'); privileged developers have commit or accept privileges.", attributes: ["privileged (commit/accept)", "MFA enabled"], locator: "preamble; item 1", kind: stated, tmodel_mapping: "Party (person) with a role edge", notes: ""}
  - {name: MFAToken, definition: "Multi-factor authentication token used by privileged developers.", attributes: ["type"], locator: "item 1", kind: stated, tmodel_mapping: "MitigationInstance kind=technical (R-040)", notes: ""}
  - {name: TrainingCourse, definition: "Secure-development learning resource (OpenSSF course, Security Knowledge Framework, SAFECode Fundamental Practices).", attributes: ["provider", "url"], locator: "item 2", kind: stated, tmodel_mapping: "MitigationInstance kind=process (training phase)", notes: ""}
  - {name: CIPipeline, definition: "Continuous-integration pipeline in which a combination of vulnerability-detection tools runs.", attributes: ["tools"], locator: "item 3", kind: stated, tmodel_mapping: "Process (DFD) realized_by a CI Component", notes: ""}
  - {name: SecurityTool, definition: "A detection tool (SAST, SCA, secret scanner, dependency scanner); 'Tools shouldn't be the only mechanism, but they scale.'", attributes: ["kind", "name"], locator: "items 3, 7, 9", kind: stated, tmodel_mapping: "evidence source for a MitigationInstance", notes: ""}
  - {name: Dependency, definition: "A direct or indirect (transitive) software dependency, selected after evaluation and managed through a package manager.", attributes: ["name", "direct|indirect", "repository of origin", "version"], locator: "items 4, 5, 7, 8", kind: stated, tmodel_mapping: "Component + uses_component", notes: ""}
  - {name: PackageManager, definition: "System, language-level or container-level package manager used to manage dependencies and enable rapid updates.", attributes: ["level (system|language|container)"], locator: "item 5", kind: stated, tmodel_mapping: "Component (tool)", notes: ""}
  - {name: Cooldown, definition: "A delay (typically ~3 days) before updating components without known vulnerabilities.", attributes: ["duration"], locator: "item 8", kind: stated, tmodel_mapping: "policy parameter on a process mitigation", notes: "Added to the guide 2026-09-19 (commit 99c65a8522)."}
  - {name: AutomatedTestSuite, definition: "Automated tests including negative tests, thorough enough to 'ship if it passes the tests'.", attributes: ["negative tests present", "thoroughness"], locator: "item 6", kind: stated, tmodel_mapping: "Evidence (verification phase)", notes: ""}
  - {name: Vulnerability, definition: "Known vulnerability in the software or its direct/indirect dependencies; also the subject of reporting and advisories.", attributes: ["CVE ID", "affected versions", "fixed versions", "mitigations"], locator: "items 7, 11, 16", kind: stated, tmodel_mapping: "Finding/Vulnerability (layer 3)", notes: ""}
  - {name: Secret, definition: "A credential that must not be pushed to a repository.", attributes: ["type"], locator: "item 9", kind: stated, tmodel_mapping: "Asset (credential)", notes: ""}
  - {name: Repository, definition: "Version-control repository (VCS) holding the project's source.", attributes: ["host (GitHub/GitLab)", "protected branches", "rulesets"], locator: "items 9, 10, 27", kind: stated, tmodel_mapping: "Component (source repository)", notes: ""}
  - {name: ChangeReview, definition: "Review before accepting changes, enforced e.g. by protected branches or rulesets.", attributes: ["enforced", "mechanism"], locator: "item 10", kind: stated, tmodel_mapping: "Review (ARCH-0001 §4/§5)", notes: ""}
  - {name: SecurityPolicy, definition: "Prominent documentation of how to report vulnerabilities, with contacts.", attributes: ["contacts", "location"], locator: "item 11", kind: stated, tmodel_mapping: "MitigationInstance kind=documentation (R-040)", notes: ""}
  - {name: VendoredDependency, definition: "A dependency copied into the project; security issues affecting it are to be disclosed explicitly.", attributes: [], locator: "item 11", kind: stated, tmodel_mapping: "Component (embedded copy)", notes: ""}
  - {name: Release, definition: "A project release; important releases are signed; users must find it easy to update (stable APIs, semantic versioning, deprecation process).", attributes: ["version (semver)", "signed"], locator: "items 12, 13", kind: stated, tmodel_mapping: "ProductInstance (versioned)", notes: ""}
  - {name: DeprecationProcess, definition: "Process for deprecating API names while supporting old ones.", attributes: [], locator: "item 12", kind: stated, tmodel_mapping: "process mitigation", notes: ""}
  - {name: Signature, definition: "Signature over important releases using standard tools/formats (e.g. Sigstore cosign).", attributes: ["tool", "format"], locator: "item 13", kind: stated, tmodel_mapping: "Evidence / Attestation", notes: ""}
  - {name: BestPracticesBadge, definition: "OpenSSF Best Practices badge at passing, silver or gold.", attributes: ["level"], locator: "item 14", kind: stated, tmodel_mapping: "third-party Attestation about a project", notes: ""}
  - {name: ScorecardScore, definition: "OpenSSF Scorecard result for OSS projects on GitHub.", attributes: ["score"], locator: "item 15", kind: stated, tmodel_mapping: "conformance result (see openssf-scorecard-checks)", notes: ""}
  - {name: SecurityAdvisory, definition: "Published advisory with accurate & precise information: vulnerable usage and versions, mitigations, fixed versions, CVE ID.", attributes: ["affected usage", "affected versions", "mitigations", "fixed versions", "CVE ID"], locator: "item 16", kind: stated, tmodel_mapping: "documentation deliverable; VEX-adjacent Assertion", notes: ""}
  - {name: SLSALevel, definition: "The project's SLSA level, to be improved.", attributes: ["level"], locator: "item 17", kind: stated, tmodel_mapping: "see slsa-1-2 Level", notes: ""}
  - {name: SBOM, definition: "Software bill of materials, published and consumed (SPDX or CycloneDX).", attributes: ["format"], locator: "item 18", kind: stated, tmodel_mapping: "documentation deliverable feeding composed_of", notes: ""}
  - {name: Guide, definition: "An external guide to apply: CNCF Software Supply Chain Best Practices, ASVS + cheat sheets, SAFECode Fundamental Practices, compiler hardening, npm, regex guides.", attributes: ["title", "url"], locator: "items 20, 21, 22, 29", kind: stated, tmodel_mapping: "library record (crosswalk target, R-044)", notes: ""}
  - {name: SecurityAudit, definition: "Third-party security code review/audit ('Expect this to be USD$50K or more').", attributes: ["auditor", "cost"], locator: "item 23", kind: stated, tmodel_mapping: "Review by an external Party + report deliverable", notes: ""}
  - {name: Maintainer, definition: "Active, trustworthy maintainer; governance and succession are managed.", attributes: ["active", "trust"], locator: "item 25", kind: stated, tmodel_mapping: "Party with maintainer role", notes: ""}
  - {name: ProgrammingLanguage, definition: "Implementation language; memory-safe languages preferred, else compiler flags, tools, peer review.", attributes: ["memory-safe"], locator: "item 26", kind: stated, tmodel_mapping: "Component attribute", notes: ""}
  - {name: SourcePackage, definition: "Released source (unbuilt) package that should contain only VCS content (no generated configure).", attributes: ["contents == VCS content"], locator: "item 27", kind: stated, tmodel_mapping: "ProductInstance artifact", notes: "xz-utils (CVE-2024-3094) cited as motivating attack."}
  - {name: WebAsset, definition: "Asset (JavaScript, CSS, media) loaded by a production website; should come only from domains you control.", attributes: ["origin domain"], locator: "item 28", kind: stated, tmodel_mapping: "DataFlow / external dependency", notes: "polyfill.io 2024 cited."}
  - {name: Project, definition: "The open source project the developer works on (badge, Scorecard, LFX onboarding, succession).", attributes: [], locator: "items 14, 15, 19, 25", kind: inferred, tmodel_mapping: "Product", notes: "Never defined; implied as the subject of most items."}
edges:
  - {name: uses, from: Developer, to: MFAToken, cardinality: "N:N", definition: "privileged developers use MFA tokens", locator: "item 1", kind: stated, tmodel_mapping: "MitigationInstance applies_to Party"}
  - {name: runs, from: CIPipeline, to: SecurityTool, cardinality: "1:N", definition: "a combination of tools in CI", locator: "item 3", kind: stated, tmodel_mapping: "Process uses Component"}
  - {name: depends_on, from: Project, to: Dependency, cardinality: "1:N", definition: "direct and indirect dependencies", locator: "items 4, 7", kind: inferred, tmodel_mapping: "uses_component"}
  - {name: evaluated_before_selection, from: Dependency, to: Guide, cardinality: "N:1", definition: "evaluate per the Concise Guide for Evaluating OSS before adding", locator: "item 4", kind: stated, tmodel_mapping: "Review of a Component before adoption (gate)"}
  - {name: managed_by, from: Dependency, to: PackageManager, cardinality: "N:1", definition: "package managers manage dependencies", locator: "item 5", kind: stated, tmodel_mapping: "none"}
  - {name: delayed_by, from: Dependency, to: Cooldown, cardinality: "N:1", definition: "updates without known vulnerabilities wait out a cooldown", locator: "item 8", kind: stated, tmodel_mapping: "policy parameter"}
  - {name: affects, from: Vulnerability, to: Dependency, cardinality: "N:N", definition: "known vulnerabilities in direct & indirect dependencies", locator: "item 7", kind: stated, tmodel_mapping: "Vulnerability affects Component"}
  - {name: guarded_by, from: Repository, to: ChangeReview, cardinality: "1:N", definition: "changes reviewed before acceptance, enforced by protected branches/rulesets", locator: "item 10", kind: stated, tmodel_mapping: "Review"}
  - {name: excludes, from: Repository, to: Secret, cardinality: "1:N", definition: "secrets are not pushed; tools detect pushes", locator: "item 9", kind: stated, tmodel_mapping: "mitigation"}
  - {name: documents, from: SecurityPolicy, to: Project, cardinality: "1:1", definition: "how to report vulnerabilities, contacts", locator: "item 11", kind: stated, tmodel_mapping: "MitigationInstance(documentation)"}
  - {name: signs, from: Signature, to: Release, cardinality: "N:1", definition: "important releases are signed", locator: "item 13", kind: stated, tmodel_mapping: "Evidence about ProductInstance"}
  - {name: earns, from: Project, to: BestPracticesBadge, cardinality: "1:0..1", definition: "earn at least passing, roadmap to silver & gold", locator: "item 14", kind: stated, tmodel_mapping: "third-party Attestation"}
  - {name: scored_by, from: Project, to: ScorecardScore, cardinality: "1:0..1", definition: "improve Scorecard score if OSS on GitHub", locator: "item 15", kind: stated, tmodel_mapping: "conformance result"}
  - {name: announces, from: SecurityAdvisory, to: Vulnerability, cardinality: "1:N", definition: "advisories notify the community of vulnerabilities; get a CVE ID", locator: "item 16", kind: stated, tmodel_mapping: "documentation about Vulnerability"}
  - {name: at_level, from: Project, to: SLSALevel, cardinality: "1:1", definition: "improve SLSA level", locator: "item 17", kind: stated, tmodel_mapping: "slsa-1-2 Level"}
  - {name: describes, from: SBOM, to: Release, cardinality: "N:1", definition: "publish (and consume) SBOMs", locator: "item 18", kind: inferred, tmodel_mapping: "documentation deliverable"}
  - {name: applies, from: Project, to: Guide, cardinality: "N:N", definition: "apply CNCF / ASVS / SAFECode / focused OpenSSF guides", locator: "items 20, 21, 22, 29", kind: stated, tmodel_mapping: "R-044 crosswalk: conformance to another Requirement set"}
  - {name: audited_by, from: Project, to: SecurityAudit, cardinality: "1:N", definition: "third-party security code review/audit", locator: "item 23", kind: stated, tmodel_mapping: "Review by external Party"}
  - {name: maintained_by, from: Project, to: Maintainer, cardinality: "1:N", definition: "governance & succession: add active trustworthy maintainers", locator: "item 25", kind: stated, tmodel_mapping: "Party role edge"}
  - {name: written_in, from: Project, to: ProgrammingLanguage, cardinality: "N:N", definition: "prefer memory-safe languages", locator: "item 26", kind: stated, tmodel_mapping: "Component attribute"}
  - {name: built_from, from: SourcePackage, to: Repository, cardinality: "N:1", definition: "source package should only include VCS content", locator: "item 27", kind: stated, tmodel_mapping: "provenance edge (radar contract, ADR-0001)"}
  - {name: loads, from: Project, to: WebAsset, cardinality: "1:N", definition: "production websites load assets only from own domains", locator: "item 28", kind: stated, tmodel_mapping: "DataFlow"}
gaps:
  - "No ordering, gates or phases: the guide is a flat checklist; any SDL phase assignment is ours (requirements.yaml phase is inferred)."
  - "Several items are meta-requirements that delegate to other documents (Scorecard, SLSA, Best Practices badge, CNCF, ASVS, SAFECode); tmodel needs a 'satisfied-by-conformance-to' edge from a Requirement to another Requirement set (R-044)."
  - "Cooldown and memory-safety are policy parameters / component attributes, not objects tmodel currently models."
