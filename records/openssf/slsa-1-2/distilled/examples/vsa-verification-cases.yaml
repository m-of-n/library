record: slsa-1-2
source: https://slsa.dev/spec/v1.2/verification_summary#examples
note: 'Verbatim (whitespace collapsed) from verification_summary.md "How to verify > Examples". Both examples check
  `slsaResult` is `PASSED`; the predicate has no slsaResult field — the 1.2 change history says the typo (verificationResult
  written as slsaResult) was fixed, but it survives in these examples (design-notes Q3). Applied to normalized/vsa-example.json
  with V=https://example.com/publication_verifier, A=the subject digest, R=https://example.com/example-1.2.3.tar.gz
  and reading slsaResult as verificationResult: case 1 FAILS (verifiedLevels is SLSA_BUILD_LEVEL_3, not the prenegotiated
  SLSA_BUILD_LEVEL_UNEVALUATED); case 2 PASSES.'
cases:
- id: vsa-case-1
  text: 'Suppose consumer C wants to delegate to verifier V the decision for whether to accept artifact A as resource
    R. Consumer C verifies that:'
  checks:
  - The signature on the VSA envelope using V's public signing key from their preconfigured root of trust.
  - '`subject` is A.'
  - '`predicateType` is `https://slsa.dev/verification_summary/v1`.'
  - '`verifier.id` is V.'
  - '`resourceUri` is R.'
  - '`slsaResult` is `PASSED`.'
  - '`verifiedLevels` contains `SLSA_BUILD_LEVEL_UNEVALUATED`.'
  note: This example is analogous to traditional code signing. The expected value for `verifiedLevels` is arbitrary
    but prenegotiated by the producer and the consumer. The consumer does not need to check additional fields, as
    C fully delegates the decision to V.
  expected_against_vsa_example: FAIL — verifiedLevels lacks SLSA_BUILD_LEVEL_UNEVALUATED
- id: vsa-case-2
  text: 'Suppose consumer C wants to enforce the rule "Artifact A at resource R must have a passing VSA from verifier
    V showing it meets SLSA Build Level 2+." Consumer C verifies that:'
  checks:
  - The signature on the VSA envelope using V's public signing key from their preconfigured root of trust.
  - '`subject` is A.'
  - '`predicateType` is `https://slsa.dev/verification_summary/v1`.'
  - '`verifier.id` is V.'
  - '`resourceUri` is R.'
  - '`slsaResult` is `PASSED`.'
  - '`verifiedLevels` is `SLSA_BUILD_LEVEL_2` or `SLSA_BUILD_LEVEL_3`.'
  note: In this example, verifying the VSA mitigates the same threats as verifying the artifact's SLSA provenance.
    See [Verifying artifacts](/spec/v1.0/verifying-artifacts) for details about which threats are addressed by verifying
    each SLSA level.
  expected_against_vsa_example: PASS
