- section: Source threats
  category: (B) Modifying the source
  subcategory: (B4) Render change metadata ineffective
  title: Forge change metadata
  addressed_at: Source L2+
  anchor: null
  threat: Forge the change metadata to alter attribution, timestamp, or discoverability of a change.
  mitigation: The Source Control System only attributes changes to authenticated identities and records contemporaneous
    evidence of changes in signed source provenance attestations.
  example: 'Adversary ''X'' creates a commit with unauthenticated metadata claiming it was authored by ''Y''. Solution:
    The Source Control System records the identity of ''X'' when ''X'' submits the commit to the repository.'
  expected_result: null
- section: Source threats
  category: (C) Source code management
  subcategory: null
  title: Platform admin abuses privileges
  addressed_at: verification
  anchor: null
  threat: Platform administrator abuses their privileges to bypass controls or to push a malicious version of the
    software.
  mitigation: The source platform must have controls in place to prevent and detect abusive behavior from administrators
    (e.g. two-person approvals for changes to the infrastructure, audit logging). A future Platform Operations Track
    may provide more specific guidance on how to secure the underlying platform.
  example_1: GitHostingService employee uses an internal tool to push changes to the MyPackage source repo.
  example_2: GitHostingService employee uses an internal tool to push a malicious version of the server to serve
    malicious versions of MyPackage sources to a specific CI/CD client but the regular version to everyone else,
    in order to hide tracks.
  example_3: GitHostingService employee uses an internal tool to push a malicious version of the server that includes
    a backdoor allowing specific users to bypass branch protections. Adversary then uses this backdoor to submit
    a change to MyPackage without review.
  solution: Consumers do not accept claims from the Source Control System unless they trust sufficient controls
    are in place to prevent repo admins from abusing privileges.
  expected_result: null
