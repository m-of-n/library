- section: Verification threats
  category: null
  subcategory: null
  title: Tamper with recorded expectations
  addressed_at: null
  anchor: null
  threat: Modify the verifier's recorded expectations, causing the verifier to accept an unofficial package artifact.
  mitigation: Changes to recorded expectations requires some form of authorization, such as two-party review.
  example: 'The package ecosystem records its expectations for a given package name in a configuration file that
    is modifiable by that package''s producer. The configuration for MyPackage expects the source repository to
    be `good/my-package`. The adversary modifies the configuration to also accept `evil/my-package`, and then builds
    from that repository and uploads a malicious version of the package. Solution: Changes to the recorded expectations
    require two-party review.'
