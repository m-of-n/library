  expected_result: REJECT — Verifier rejects because provenance is missing.
- section: Build threats
  category: (F) Artifact publication
  subcategory: null
  title: Tamper with artifact after CI/CD
  addressed_at: Build L1
  anchor: null
  threat: Take a benign version of the package, modify it in some way, then re-upload it using the original provenance.
  mitigation: Verifier checks that the provenance's `subject` matches the hash of the package.
  example: 'Adversary performs a proper build, modifies the artifact, then uploads the modified version of the package
