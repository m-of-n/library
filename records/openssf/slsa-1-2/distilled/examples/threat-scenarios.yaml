- section: Dependency threats
  category: Build dependency
  subcategory: null
  title: Include a vulnerable dependency (library, base image, bundled file, etc.)
  addressed_at: null
  anchor: included-dep
  threat: Statically link, bundle, or otherwise include an artifact that is compromised or has some vulnerability,
    causing the output artifact to have the same vulnerability.
  example: The C++ program MyPackage statically links libDep at build time. A contributor accidentally introduces
    a security vulnerability into libDep. The next time MyPackage is built, it picks up and includes the vulnerable
    version of libDep, resulting in MyPackage also having the security vulnerability.
  mitigation: A future Dependency track may provide more comprehensive guidance on how to address more specfiic
    aspects of this threat.
  expected_result: null
- section: Dependency threats
  category: Build dependency
  subcategory: null
  title: Use a compromised build tool (compiler, utility, interpreter, OS package, etc.)
  addressed_at: null
  anchor: build-tool
  threat: Use a compromised tool or other software artifact during the build process, which alters the build process
    and injects unintended behavior into the output artifact.
  mitigation: This can be partially mitigated by treating build tooling, including OS images, as any other artifact
    to be verified prior to use. The threats described in this document apply recursively to build tooling as do
    the mitigations and examples. A future Build Environment track may provide more comprehensive guidance on how
    to address more specfiic aspects of this threat.
  example: 'MyPackage is a tarball containing an ELF executable, created by running `/usr/bin/tar` during its build
    process. An adversary compromises the `tar` OS package such that `/usr/bin/tar` injects a backdoor into every
    ELF executable it writes. The next time MyPackage is built, the build picks up the vulnerable `tar` package,
    which injects the backdoor into the resulting MyPackage artifact. Solution: apply SLSA recursively to all build
    tools prior to the build. The build platform verifies the disk image, or the individual components on the disk
    image, against the associated provenance or VSAs prior to running a build. Depending on where the initial compromise
    took place (i.e. before/during vs after the build of the build tool itself), the modified `/usr/bin/tar` will
    fail this verification.'
  expected_result: null
- section: Dependency threats
  category: Build dependency
  subcategory: null
  title: Use a compromised runtime dependency during the build (for tests, dynamic linking, etc.)
  addressed_at: null
  anchor: runtime-dep-at-build-time
  threat: During the build process, use a compromised runtime dependency (such as during testing or dynamic linking),
    which alters the build process and injects unwanted behavior into the output. *NOTE:* This is technically the
    same case as Use a compromised build tool. We call it out to remind the reader that runtime dependencies can
    become build dependencies if they are loaded during the build.
  example: MyPackage has a runtime dependency on package Dep, meaning that Dep is not included in MyPackage but
    required to be installed on the user's machine at the time MyPackage is run. However, Dep is also loaded during
    the build process of MyPackage as part of a test. An adversary compromises Dep such that, when run during a
    build, it injects a backdoor into the output artifact. The next time MyPackage is built, it picks up and loads
    Dep during the build process. The malicious code then injects the backdoor into the new MyPackage artifact.
  mitigation: In addition to all the mitigations for build tools, you can often avoid runtime dependencies becoming
    build dependencies by isolating tests to a separate environment that does not have write access to the output
    artifact.
  expected_result: null
- section: Dependency threats
  category: Related threats
  subcategory: null
  title: Use a compromised dependency at runtime
  addressed_at: modeled separately
  anchor: runtime-dep
  threat: Load a compromised artifact at runtime, thereby compromising the user or environment where the software
    ran.
  example: MyPackage lists package Dep as a runtime dependency. Adversary publishes a compromised version of Dep
    that runs malicious code on the user's machine when Dep is loaded at runtime. An end user installs MyPackage,
    which in turn installs the compromised version of Dep. When the user runs MyPackage, it loads and executes the
    malicious code from Dep.
  mitigation: N/A - SLSA's threat model does not explicitly model runtime dependencies. Instead, each runtime dependency
    is considered a distinct artifact with its own threats.
  expected_result: null
