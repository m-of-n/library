  title: Exploit cryptographic hash collisions
  addressed_at: null
  anchor: null
  threat: Exploit a cryptographic hash collision weakness to bypass one of the other controls.
  mitigation: Choose secure algorithms when using cryptographic digests, such as SHA-256.
  examples: 'Attacker crafts a malicious file with the same MD5 hash as a target benign file. Attacker replaces
