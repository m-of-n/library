scenarios:
- section: Source threats
  category: (A) Producer
  subcategory: null
  title: Software producer intentionally creates a malicious revision of the source
  addressed_at: null
  anchor: null
  threat: A producer intentionally creates a malicious revision with the intent of harming their consumers.
  mitigation: 'This kind of attack cannot be directly mitigated through SLSA controls. Consumers must establish
    some basis to trust the organizations from which they consume software. That basis may be: - The repo is open
    source with an active user-base. High numbers of engaged users may increase the likelihood that bad code is
    detected during code review and reduce the time-to-detection when bad revisions are accepted. - The organization
    has sufficient legal or reputational incentives to dissuade it from making malicious changes. Ultimately this
    is a judgement call with no straightforward answer.'
  example: A producer with an otherwise good reputation decides suddenly to produce a malicious artifact with the
    intent to harm their consumers.
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B1) Submit change without review
  title: Directly submit without review
  addressed_at: Source L4
  anchor: null
  threat: Malicious code submitted to the source repository.
  mitigation: Require approval of all changes before they are accepted.
  example: 'Adversary directly pushes a change to a git repo''s `main` branch. Solution: The Source Control System
    is configured to require two party review for contributions to the `main` branch.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B1) Submit change without review
  title: Single actor controls multiple accounts
  addressed_at: null
  anchor: null
  threat: An actor is able to control multiple account and effectively approve their own code changes.
  mitigation: The producer must ensure that no actor is able to control or influence multiple accounts with review
    privileges.
  example: 'Adversary creates a pull request using a secondary account and approves it using their primary account.
    Solution: The producer must track all actors who have both explicit review permissions and the independent ability
    to control a privileged bot. A common vector for this attack is to influence a robot account with the permission
    to review or contribute code. Control of the robot account and an actor''s own personal account is enough to
    exploit this vulnerability. A common solution to this flow is to deny bot accounts from contributing or reviewing
    code, or to require more human reviews in those cases.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B1) Submit change without review
  title: Use a robot account to submit change
  addressed_at: null
  anchor: null
  threat: Exploit a robot account that has the ability to submit changes without two-person review.
  mitigation: All changes require review by two people, even changes authored by robots.
  example: 'A file within the source repository is automatically generated by a robot, which is allowed to submit
    without review. Adversary compromises the robot and submits a malicious change. Solution: Require two-person
    review for such changes, ignoring the robot.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B1) Submit change without review
  title: Abuse of rule exceptions
  addressed_at: null
  anchor: null
  threat: Rule exceptions provide vector for abuse.
  mitigation: Remove rule exceptions.
  example: 'A producer intends to require two-person review on "all changes except for documentation changes," defined
    as those only modifying `.md` files. Adversary submits a malicious executable masquerading as a documentation
    file, `help.md`. This avoids the two-person review rule due to the exception. In the future, a user (or another
    workflow) can be induced to execute `help.md` and become compromised. Technically the malicious code change
    met all defined policies yet the intent of the organization was defeated. Solution: The producer adjusts the
    rules to prohibit such exceptions.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B1) Submit change without review
  title: Highly-permissioned actor bypasses or disables controls
  addressed_at: verification
  anchor: null
  threat: Trusted actor with "admin" privileges in a repository submits code by disabling existing controls.
  mitigation: The Source Control System must have controls in place to prevent and detect abusive behavior from
    administrators (e.g. two-person approvals, audit logging).
  example: 'GitHub repository-level admin removes a branch protection requirement, pushes their change, then re-enables
    the requirement to cover their tracks. Solution: Consumers do not accept claims from the Source Control System
    unless they trust sufficient controls are in place to prevent repo admins from abusing privileges.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B2) Evade change management process
  title: Alter change history
  addressed_at: Source L2+
  anchor: null
  threat: Adversary alters branch history to hide malicious activity.
  mitigation: The Source Control System prevents branch history from being altered.
  example: 'Adversary submits a malicious commit `X` to the `main` branch. A release is built and published from
    `X`. The adversary then "force pushes" to `main` erasing the record of the malicious commit. Solution: The Source
    Control System is configured to prevent force pushes to `main`.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B2) Evade change management process
  title: Replace tagged content with malicious content
  addressed_at: Source L2+
  anchor: null
  threat: Adversary alters a tag to point at malicious content.
  mitigation: The Source Control System does not allow protected tags to be updated.
  example: 'Adversary crafts a malicious commit `X` on a development branch which does enforce any controls. They
    then update the `release_1.2` tag to point to `X`. Consumers of `release_1.2` will get the malicious revision.
    Solution: The Source Control System does not allow protected tags to be updated.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B2) Evade change management process
  title: Skip required checks
  addressed_at: Source L3+
  anchor: null
  threat: Code is submitted without following the producers documented development process, introducing unintended
    behavior.
  mitigation: The producer uses the Source Control System to implement technical controls ensuring adherence to
    the development process.
  example: 'An engineer submits a new feature that has a critical flaw on an untested code path, in violation of
    the producer''s documented process of having high test coverage. Solution: The producer implements a technical
    control in the SCS that requires 95%+ test coverage.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B2) Evade change management process
  title: Modify code after review
  addressed_at: Source L4
  anchor: null
  threat: Modify the code after it has been reviewed but before submission.
  mitigation: The Source Control System invalidates approvals whenever the proposed change is modified.
  example: 'Source repository requires two-person review on all changes. Adversary sends an initial "good" pull
    request to a peer, who approves it. Adversary then modifies their proposal to contain "bad" code. Solution:
    Configure the code review rules to require review of the most recent revision before submission.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B2) Evade change management process
  title: Submit a change that is unreviewable
  addressed_at: Source L4
  anchor: null
  threat: Adversary crafts a change that looks benign to a reviewer but is actually malicious.
  mitigation: Code review system ensures that all reviews are informed and meaningful to the extent possible. For
    example the system could show & resolve symlinks, render images, or verify & display provenance.
  example: 'A proposed change updates a JPEG file to include a malicious message, but the reviewer is only presented
    with a diff of the binary file contents. The reviewer is unable to parse the contents themselves so they do
    not have enough context to provide a meaningful review. Solution: the code review system should present the
    reviewer with a rendering of the image and the embedded metadata, allowing them to make an informed decision.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B2) Evade change management process
  title: Copy a reviewed change to another context
  addressed_at: Source L4
  anchor: null
  threat: Get a change reviewed in one context and then transfer it to a different context.
  mitigation: Approvals are context-specific.
  example: 'MyPackage''s source repository requires two-person review. Adversary forks the repo, submits a change
    in the fork with review from a colluding colleague (who is not trusted by MyPackage), then proposes the change
    to the upstream repo. Solution: The proposed change still requires two-person review in the upstream context
    even though it received two-person review in another context.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B2) Evade change management process
  title: Commit graph attacks
  addressed_at: null
  anchor: null
  threat: A malicious commit can be included in a sequence of commits such that it does not appear malicious in
    the net change presented to reviewers.
  mitigation: The producer ensures that all revisions in the protected context followed the same contribution process.
  example: 'Adversary sends a pull request containing malicious commit X and a commit Y that undoes X. The combined
    change of X + Y displays zero lines of malicious code and the reviewer cannot tell that X is malicious unless
    they review it individually. If X is allowed to become reachable from the protected branch, the content may
    become available in secured environments such as developer machines. Solution: Each revision in the protected
    context must have followed the intended process. Ultimately, this means that either each code review results
    in at most a single new commit or that the full process is followed for each constituent commit in a proposed
    sequence.'
  expected_result: null
- section: Source threats
  category: (B) Modifying the source
  subcategory: (B3) Render code review ineffective
  title: Collude with another trusted person
  addressed_at: null
  anchor: null
  threat: Two trusted persons collude to author and approve a bad change.
  mitigation: This threat is not currently addressed by SLSA, but the producer can arbitrarily increase friction
    of their policies to reduce risk, such as requiring additional, or more senior reviewers. The goal of policy
    here is to ensure that the approved changes match the intention of the producer for the source. Increasing the
    friction of the policies may make it harder to circumvent, but doing so has diminishing returns. Ultimately
    the producer will need to land upon a balanced risk profile that makes sense for their security posture.
  expected_result: null
