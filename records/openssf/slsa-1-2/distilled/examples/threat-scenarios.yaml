  category: (F) Artifact publication
  subcategory: null
  title: Upload package without provenance
  addressed_at: Build L1
  anchor: null
  threat: Upload a package without provenance.
  mitigation: Verifier requires provenance before accepting the package.
  example: 'Adversary uploads a malicious version of MyPackage to the package repository without provenance. Solution:
