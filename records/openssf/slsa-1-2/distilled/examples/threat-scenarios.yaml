  expected_result: REJECT — Verifier rejects because builder is not as expected.
- section: Build threats
  category: (G) Distribution channel
  subcategory: null
  title: Issue VSA from untrusted intermediary
  addressed_at: expectations
  anchor: null
  threat: Have an unofficial intermediary issue a VSA for a malicious package.
  mitigation: Verifier requires VSAs to be issued by a trusted intermediary.
  example: 'Verifier expects VSAs to be issued by TheRepository. Adversary builds a malicious package and then issues
    a VSA of their own for the malicious package. Solution: Verifier rejects because they only accept VSAs from
    TheRepository which the adversary cannot issue since they do not have the corresponding signing key.'
  expected_result: REJECT — Verifier rejects because they only accept VSAs from TheRepository which the adversary
    cannot issue since they do not have the corresponding signing key.
- section: Build threats
  category: (G) Distribution channel
  subcategory: null
  title: Upload package without provenance or VSA
  addressed_at: Build L1
  anchor: null
  threat: Replace the original package with a malicious one without provenance.
  mitigation: Verifier requires provenance or a VSA before accepting the package.
  example: 'Adversary replaces MyPackage with a malicious version of MyPackage on the package repository and deletes
    existing provenance. Solution: Verifier rejects because provenance is missing.'
  expected_result: REJECT — Verifier rejects because provenance is missing.
- section: Build threats
  category: (G) Distribution channel
  subcategory: null
  title: Replace package and VSA with another
  addressed_at: expectations
  anchor: null
  threat: Replace a package and its VSA with a malicious package and its valid VSA.
  mitigation: Consumer ensures that the VSA matches the package they've requested (not just the package they received)
    by following the verification process.
  example: 'Adversary uploads a malicious package to `repo/evil-package`, getting a valid VSA for `repo/evil-package`.
    Adversary then replaces `repo/my-package` and its VSA with `repo/evil-package` and its VSA. Solution: Verifier
    rejects because the VSA `resourceUri` field lists `repo/evil-package` and not the expected `repo/my-package`.'
  expected_result: REJECT — Verifier rejects because the VSA `resourceUri` field lists `repo/evil-package` and not
    the expected `repo/my-package`.
- section: Build threats
  category: (G) Distribution channel
  subcategory: null
  title: Tamper with artifact after upload
  addressed_at: Build L1
  anchor: null
  threat: Take a benign version of the package, modify it in some way, then replace it while retaining the original
    provenance or VSA.
  mitigation: Verifier checks that the provenance or VSA's `subject` matches the hash of the package.
  example: 'Adversary performs a proper build, modifies the artifact, then replaces the modified version of the
    package in the repository and retains the original provenance. Solution: Verifier rejects because the hash of
    the artifact does not match the `subject` found within the provenance.'
  expected_result: REJECT — Verifier rejects because the hash of the artifact does not match the `subject` found
    within the provenance.
- section: Build threats
  category: (G) Distribution channel
  subcategory: null
  title: Tamper with provenance or VSA
  addressed_at: Build L2
  anchor: null
  threat: Perform a build that would not meet expectations, then modify the provenance or VSA to make the expectations
    checks pass.
  mitigation: Verifier only accepts provenance or VSA with a valid cryptographic signature or equivalent proving
    that the provenance came from an acceptable builder or the VSA came from an expected verifier.
  example_1: 'MyPackage is expected to be built by GitHub Actions from the `good/my-package` repo. Adversary builds
    with GitHub Actions from the `evil/my-package` repo and then modifies the provenance so that the source looks
    like it came from `good/my-package`. Solution: Verifier rejects because the cryptographic signature is no longer
    valid.'
  example_2: 'Verifier expects VSAs to be issued by TheRepository. Adversary builds a malicious package and then
    modifies the original VSA''s `subject` field to match the digest of the malicious package. Solution: Verifier
    rejects because the cryptographic signature is no longer valid.'
  expected_result: REJECT — Verifier rejects because the cryptographic signature is no longer valid. / Verifier
    rejects because the cryptographic signature is no longer valid.
- section: Usage threats
  category: (H) Package selection
  subcategory: null
  title: Dependency confusion
  addressed_at: null
  anchor: null
  threat: Register a package name in a public registry that shadows a name used on the victim's internal registry,
    and wait for a misconfigured victim to fetch from the public registry instead of the internal one.
  mitigation: 'The mitigation is for the software producer to build internal packages on a SLSA Level 2+ compliant
    build system and define expectations for build provenance. Expectations must be verified on installation of
    the internal packages. If a misconfigured victim attempts to install attacker''s package with an internal name
    but from the public registry, then verification against expectations will fail. For more information see Verifying
    artifacts and Defender''s Perspective: Dependency Confusion and Typosquatting Attacks.'
  expected_result: null
