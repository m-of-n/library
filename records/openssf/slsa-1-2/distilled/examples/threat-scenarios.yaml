- section: Build threats
  category: (D) External build parameters
  subcategory: null
  title: Build from unofficial fork of code
  addressed_at: expectations
  anchor: null
  threat: Build using the expected CI/CD process but from an unofficial fork of the code that may contain unauthorized
    changes.
  mitigation: Verifier requires the provenance's source location to match an expected value.
  example: 'MyPackage is supposed to be built from GitHub repo `good/my-package`. Instead, it is built from `evilfork/my-package`.
    Solution: Verifier rejects because the source location does not match.'
  expected_result: REJECT — Verifier rejects because the source location does not match.
- section: Build threats
  category: (D) External build parameters
  subcategory: null
  title: Build from unofficial branch or tag
  addressed_at: expectations
  anchor: null
  threat: Build using the expected CI/CD process and source location, but checking out an "experimental" branch
    or similar that may contain code not intended for release.
  mitigation: Verifier requires that the provenance's source branch/tag matches an expected value, or that the source
    revision is reachable from an expected branch.
  example: 'MyPackage''s releases are tagged from the `main` branch, which has branch protections. Adversary builds
    from the unprotected `experimental` branch containing unofficial changes. Solution: Verifier rejects because
    the source revision is not reachable from `main`.'
  expected_result: REJECT — Verifier rejects because the source revision is not reachable from `main`.
- section: Build threats
  category: (D) External build parameters
  subcategory: null
  title: Build from unofficial build steps
  addressed_at: expectations
  anchor: null
  threat: Build the package using the proper CI/CD platform but with unofficial build steps.
  mitigation: Verifier requires that the provenance's build configuration source matches an expected value.
  example: 'MyPackage is expected to be built by Google Cloud Build using the build steps defined in the source''s
    `cloudbuild.yaml` file. Adversary builds with Google Cloud Build, but using custom build steps provided over
    RPC. Solution: Verifier rejects because the build steps did not come from the expected source.'
  expected_result: REJECT — Verifier rejects because the build steps did not come from the expected source.
- section: Build threats
  category: (D) External build parameters
  subcategory: null
  title: Build from unofficial parameters
  addressed_at: expectations
  anchor: null
  threat: Build using the expected CI/CD process, source location, and branch/tag, but using a parameter that injects
    unofficial behavior.
  mitigation: Verifier requires that the provenance's external parameters all match expected values.
  example_1: 'MyPackage is supposed to be built from the `release.yml` workflow. Adversary builds from the `debug.yml`
    workflow. Solution: Verifier rejects because the workflow parameter does not match the expected value.'
  example_2: 'MyPackage''s GitHub Actions Workflow uses `github.event.inputs` to allow users to specify custom compiler
    flags per invocation. Adversary sets a compiler flag that overrides a macro to inject malicious behavior into
    the output binary. Solution: Verifier rejects because the `inputs` parameter was not expected.'
  expected_result: REJECT — Verifier rejects because the workflow parameter does not match the expected value. /
    Verifier rejects because the `inputs` parameter was not expected.
- section: Build threats
  category: (D) External build parameters
  subcategory: null
  title: Build from modified version of code modified after checkout
  addressed_at: expectations
  anchor: null
  threat: Build from a version of the code that includes modifications after checkout.
  mitigation: Build platform pulls directly from the source repository and accurately records the source location
    in provenance.
  example: 'Adversary fetches from MyPackage''s source repo, makes a local commit, then requests a build from that
    local commit. Builder records the fact that it did not pull from the official source repo. Solution: Verifier
    rejects because the source repo does not match the expected value.'
  expected_result: REJECT — Verifier rejects because the source repo does not match the expected value.
- section: Build threats
  category: (E) Build process
  subcategory: null
  title: Forge values of the provenance (other than output digest)
  addressed_at: Build L2+
  anchor: null
  threat: Generate false provenance and get the trusted control plane to sign it.
  mitigation: At Build L2+, the trusted control plane generates all information that goes in the provenance, except
    (optionally) the output artifact hash. At Build L3+, this is hardened to prevent compromise even by determined
    adversaries.
  example_1_build_l2: 'Provenance is generated on the build worker, which the adversary has control over. Adversary
    uses a malicious process to get the build platform to claim that it was built from source repo `good/my-package`
    when it was really built from `evil/my-package`. Solution: Builder generates and signs the provenance in the
    trusted control plane; the worker reports the output artifacts but otherwise has no influence over the provenance.'
  example_2_build_l3: 'Provenance is generated in the trusted control plane, but workers can break out of the container
    to access the signing material. Solution: Builder is hardened to provide strong isolation against tenant projects.'
  expected_result: null
- section: Build threats
  category: (E) Build process
  subcategory: null
  title: Forge output digest of the provenance
  addressed_at: n/a
  anchor: forged-digest
  threat: The tenant-controlled build process sets output artifact digest (`subject` in SLSA Provenance) without
    the trusted control plane verifying that such an artifact was actually produced.
  mitigation: 'None; this is not a problem. Any build claiming to produce a given artifact could have actually produced
    it by copying it verbatim from input to output. (Reminder: Provenance is only a claim that a particular artifact
    was built, not that it was published to a particular registry.)'
  example: 'A legitimate MyPackage artifact has digest `abcdef` and is built from source repo `good/my-package`.
    A malicious build from source repo `evil/my-package` claims that it built artifact `abcdef` when it did not.
    Solution: Verifier rejects because the source location does not match; the forged digest is irrelevant. : Technically
    this requires the artifact to be known to the adversary. If they only know the digest but not the actual contents,
    they cannot actually build the artifact without a [preimage attack] on the digest algorithm. However, even still
    there are no known concerns where this is a problem. [preimage attack]: https://en.wikipedia.org/wiki/Preimage_attack'
  expected_result: REJECT — Verifier rejects because the source location does not match; the forged digest is irrelevant.
- section: Build threats
  category: (E) Build process
  subcategory: null
  title: Compromise project owner
  addressed_at: Build L2+
  anchor: null
  threat: An adversary gains owner permissions for the artifact's build project.
  mitigation: The build project owner must not have the ability to influence the build process or provenance generation.
  example: 'MyPackage is built on Awesome Builder under the project "mypackage". Adversary is an owner of the "mypackage"
    project. Awesome Builder allows owners to debug the build environment via SSH. An adversary uses this feature
    to alter a build in progress. Solution: Build L3 requires the external parameters to be complete in the provenance.
    The attackers access and/or actions within the SSH connection would be enumerated within the external parameters.
    The updated external parameters will not match the declared expectations causing verification to fail.'
  expected_result: null
- section: Build threats
  category: (E) Build process
  subcategory: null
  title: Compromise other build
  addressed_at: Build L3
  anchor: null
  threat: Perform a malicious build that alters the behavior of a benign build running in parallel or subsequent
    environments.
  mitigation: Builds are isolated from one another, with no way for one to affect the other or persist changes.
  example_1: 'A build platform runs all builds for project MyPackage on the same machine as the same Linux user.
    An adversary starts a malicious build that listens for another build and swaps out source files, then starts
    a benign build. The benign build uses the malicious build''s source files, but its provenance says it used benign
    source files. Solution: The build platform changes architecture to isolate each build in a separate VM or similar.'
  example_2: 'A build platform uses the same machine for subsequent builds. An adversary first runs a build that
    replaces the `make` binary with a malicious version, then subsequently runs an otherwise benign build. Solution:
    The builder changes architecture to start each build with a clean machine image.'
  expected_result: null
- section: Build threats
  category: (E) Build process
  subcategory: null
  title: Steal cryptographic secrets
  addressed_at: Build L3
  anchor: null
  threat: Use or exfiltrate the provenance signing key or some other cryptographic secret that should only be available
    to the build platform.
  mitigation: Builds are isolated from the trusted build platform control plane, and only the control plane has
    access to cryptographic secrets.
  example: 'Provenance is signed on the build worker, which the adversary has control over. Adversary uses a malicious
    process that generates false provenance and signs it using the provenance signing key. Solution: Builder generates
    and signs provenance in the trusted control plane; the worker has no access to the key.'
  expected_result: null
- section: Build threats
  category: (E) Build process
  subcategory: null
  title: Poison the build cache
  addressed_at: Build L3
  anchor: null
  threat: Add a malicious artifact to a build cache that is later picked up by a benign build process (example).
  mitigation: Build caches must be isolated between builds to prevent such cache poisoning attacks. In particular,
    the cache SHOULD be keyed by the transitive closure of all inputs to the cached artifact, and the cache must
    either be only writable by the trusted control plane or have SLSA Build L3 provenance for each cache entry.
  example_1: 'The cache key does not fully cover the transitive closure of all inputs and instead only uses the
    digest of the source file itself. Adversary runs a build over `auth.cc` with command line flags to gcc that
    define a marco replacing `CheckAuth(ctx)` with `true`. When subsequent builds build `auth.cc` they will get
    the attacker''s poisoned instance that does not call `CheckAuth`. Solution: Build cache is keyed by digest of
    `auth.cc`, command line, and digest of gcc so changing the command line flags results in a different cache entry.'
  example_2: 'The tenant controlled build process has full write access to the cache. Adversary observes a legitimate
    build of `auth.cc` which covers the transitive closure of all inputs and notes the digest used for caching.
    The adversary builds a malicious version of `auth.o` and directly writes it to the build cache using the observed
    digest. Subsequent legitimate builds will use the malicious version of `auth.o`. Solution: Each cache entry
    is keyed by the transitive closure of the inputs, and the cache entry is itself a SLSA Build L3 build with its
    own provenance that corresponds to the key.'
  expected_result: null
- section: Build threats
  category: (E) Build process
  subcategory: null
  title: Compromise build platform admin
  addressed_at: verification
  anchor: null
  threat: An adversary gains admin permissions for the artifact's build platform.
  mitigation: The build platform must have controls in place to prevent and detect abusive behavior from administrators
    (e.g. two-person approvals, audit logging).
  example: 'MyPackage is built on Awesome Builder. Awesome Builder allows engineers on-call to SSH into build machines
    to debug production issues. An adversary uses this access to modify a build in progress. Solution: Consumers
    do not accept provenance from the build platform unless they trust sufficient controls are in place to prevent
    abusing admin privileges.'
  expected_result: null
- section: Build threats
  category: (F) Artifact publication
  subcategory: null
  title: Build with untrusted CI/CD
  addressed_at: expectations
  anchor: null
  threat: Build using an unofficial CI/CD pipeline that does not build in the correct way.
  mitigation: Verifier requires provenance showing that the builder matched an expected value.
  example: 'MyPackage is expected to be built on Google Cloud Build, which is trusted up to Build L3. Adversary
