- section: Build threats
  category: (F) Artifact publication
  subcategory: null
  title: Tamper with provenance
  addressed_at: Build L2
  anchor: null
  threat: Perform a build that would not meet expectations, then modify the provenance to make the expectations
    checks pass.
  mitigation: Verifier only accepts provenance with a valid cryptographic signature or equivalent proving that the
    provenance came from an acceptable builder.
  example: 'MyPackage is expected to be built by GitHub Actions from the `good/my-package` repo. Adversary builds
    with GitHub Actions from the `evil/my-package` repo and then modifies the provenance so that the source looks
    like it came from `good/my-package`. Solution: Verifier rejects because the cryptographic signature is no longer
    valid.'
  expected_result: REJECT — Verifier rejects because the cryptographic signature is no longer valid.
- section: Build threats
  category: (G) Distribution channel
  subcategory: null
  title: Build with untrusted CI/CD
  addressed_at: expectations
  anchor: null
  threat: Replace the package with one built using an unofficial CI/CD pipeline that does not build in the correct
    way.
  mitigation: Verifier requires provenance showing that the builder matched an expected value or a VSA for corresponding
    `resourceUri`.
  example: 'MyPackage is expected to be built on Google Cloud Build, which is trusted up to Build L3. Adversary
    builds on SomeOtherBuildPlatform, which is only trusted up to Build L2, and then exploits SomeOtherBuildPlatform
    to inject malicious behavior. Adversary then replaces the original package within the repository with the malicious
