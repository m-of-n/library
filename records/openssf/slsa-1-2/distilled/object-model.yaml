  - {name: executes_in, from: Build, to: BuildEnvironment, cardinality: "1:1", definition: "executed within a single build environment on a platform", locator: "terminology.md § Build model (Build)", kind: stated, tmodel_mapping: "runs_on"}
  - {name: part_of, from: ControlPlane, to: BuildPlatform, cardinality: "1:1", definition: "Build platform component that orchestrates each independent build execution", locator: "terminology.md § Build model", kind: stated, tmodel_mapping: composed_of}
