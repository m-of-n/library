gaps:
  - "Signed attestation vs epistemic Assertion: tmodel's Assertion (ARCH-0001 §4) has provenance + review status but no cryptographic authenticity (Envelope/Signature/SigningKey) and no notion of a trusted signer-identity pair (R-0214, R-0229). Ingesting SLSA/in-toto evidence needs a signature-verification edge on the Assertion."
  - "Level/Track (cumulative maturity with 'implies lower levels') has no tmodel class; DL-0009's Gate is time-ordered program management, not a cumulative assurance level. R-041/R-042 should model both: Gate (when) and Level (how strongly)."
  - "Expectations / Policy / RootOfTrust: tmodel has no policy object keyed by Product (package name) or by branch against which evidence is compared — this is exactly DL-0009 R-042 conformance input and should be first-class."
  - "Source model (SourceRevision, NamedReference/Branch/Tag, Change, ProposedChange, ControlContinuity) is absent; ARCH-0001 §3b already flags the missing valid_from/valid_to time axis — ControlContinuity needs it."
  - "Verification outcome (VSA: verificationResult + verifiedLevels + dependencyLevels + policy + inputAttestations) is a ready-made shape for a conformance-check result node (R-042) that tmodel has not yet defined."
  - "ThreatCategory A–I is a supply-chain stage taxonomy (source/build/usage) distinct from ARCH-0001's LifecyclePhase enum; mapping A–I onto applies_in_phase (implementation, production/distribution, deployment, operation) is a crosswalk tmodel needs (R-044)."
  - "AdversaryProfile (contributor / maintainer / administrator capability sets) is richer than ThreatActor's current attributes."
  - "PlatformAssessment modes (self-attestation vs third-party certification, recurring cadence, published vs private evidence) are not representable on Review today."
