note: >
  One entry per sentence that carries at least one uppercase BCP 14 keyword (SLSA declares RFC 2119
  on build-requirements, distributing-provenance, build-provenance, verification_summary and
  attestation-model; it uses the same uppercase forms on the source-track, verifying, assessing
  and verified-properties pages without a key-words paragraph, and they are extracted too).
  Compound sentences are kept whole (never spliced). A sentence that begins with a bare keyword
  ("MAY also include ...", "MUST contain at least:") carries the preceding sentences of the same
  list item so that it has a subject; a lead-in ending in ":" carries the keyword-free list items or
  table rows that complete it (rendered as "- item" / "| cell |"). Text is verbatim from the
  release-branch Markdown with link syntax, emphasis markers and HTML tags removed and whitespace
  collapsed; code spans keep their backticks. Every text was machine-checked as a substring of the
  rendered page after normalising smart punctuation; the only differences are rendering artifacts
  (smart quotes and ellipses, footnote markers, the single-page renderer rewriting "This page
  describes" to "This section describes", and pseudocode comments split across lines).
  SLSA has no native requirement numbering: ids are slsa-1-2#R-NNNN in source order, and
  `designator` carries the spec's own anchor (e.g. provenance-authentic, two-party-review) where
  the statement sits in an anchored requirement row or field. Keyword-free normative material
  (level definitions, threat catalogue, assessment prompts, verification steps written as
  imperatives) is in normative.md, not here.
  DERIVED fields (actor, nature, track, level, phase, object, expects_deliverables, verification,
  testable) are the extractor's reading of the source and need human review; text and locator are
  the source's.
phases_used: "supply-chain (build track, verification, attestation formats), release (distributing provenance), implementation (source track change management)"

