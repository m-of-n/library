record: slsa-1-2
reviewed_by: ""
note: >
  SLSA levels are cumulative states of a track ("each SLSA level implies all levels below it"),
  attached to an artifact (Build) or to a revision on a branch (Source). The spec also defines
  stateful rules for control continuity, Named References, review approvals, attestation
  immutability and the two verification procedures. Each machine cites its locator; transitions
  whose trigger SLSA does not name are marked "(inferred)" in the guard text.
machines:
  - name: build-track-level
    subject: "artifact (its provenance + the build platform that produced it)"
    locator: "build-track-basics.md; build-requirements.md (L1/L2/L3 table)"
    initial: L0
    states:
      - {name: L0, meaning: "No guarantees — L0 represents the lack of SLSA."}
      - {name: L1, meaning: "Provenance exists"}
      - {name: L2, meaning: "Hosted build platform — signed provenance generated by the platform"}
      - {name: L3, meaning: "Hardened builds — unforgeable provenance, isolated builds"}
    transitions:
      - {from: L0, to: L1, trigger: "producer adopts a consistent build process on a platform that auto-generates provenance and distributes it", guard: "R-0003, R-0005, R-0008, R-0010..R-0015 (Provenance Exists)"}
      - {from: L1, to: L2, trigger: "move builds to a hosted platform whose control plane generates and signs provenance; consumers validate authenticity", guard: "Hosted; Provenance is Authentic (R-0016..R-0027)"}
      - {from: L2, to: L3, trigger: "platform hardened", guard: "Provenance is Unforgeable (R-0028..R-0034) and Isolated (R-0035..R-0043)"}
      - {from: "any", to: "level(builder.id) from verifier roots of trust", trigger: "verification Step 1.4", guard: "the verified level is min(claimed, trusted-up-to); default L1 when the builder is unknown (verifying-artifacts.md)"}
    error_states: []
    notes: "Levels apply per artifact and are not transitive across dependencies (faq.md 'Why is SLSA not transitive?'). A future Build L4 is out of scope (future-directions.md)."

  - name: source-track-level
    subject: "a Source Revision on a branch (claims run forward from onboarding; 'No claims are made for prior revisions')"
    locator: "source-requirements.md § Onboarding, Basics, Requirements"
    initial: L0
    states:
      - {name: L0, meaning: "no Source VSA generated for the revision (#source-summary: 'If the SCS DOES NOT generate a VSA for a revision, the revision has Source Level 0')"}
      - {name: L1, meaning: "Version controlled"}
      - {name: L2, meaning: "History & Provenance — continuous, immutable, retained history; SCS issues source provenance"}
      - {name: L3, meaning: "Continuous technical controls — SCS enforces the organization's controls on protected Named References"}
      - {name: L4, meaning: "Two-party review"}
    transitions:
      - {from: L0, to: L1, trigger: "onboard branch: org selects capable SCS; repo/revision ids, diffs, Source VSA", guard: "#choose-scs, #repository-ids, #revision-ids, #human-readable-diff, #source-summary"}
      - {from: L1, to: L2, trigger: "raise level (establishes continuity from this revision)", guard: "#access-and-history, #safe-expunging-process, #history, #continuity, #identity-management, #source-provenance"}
      - {from: L2, to: L3, trigger: "raise level", guard: "#technical-controls, #protected-refs"}
      - {from: L3, to: L4, trigger: "raise level", guard: "#two-party-review"}
      - {from: "L2|L3|L4", to: "lower level (inferred)", trigger: "lapse in continuity of a claimed control", guard: "R-0102 — continuity MUST be re-established from a new revision; revisions added while a control is disabled reset its continuity (#continuity example)"}
    error_states: []
    notes: "The Source VSA enumerates verifiedLevels as SLSA_SOURCE_LEVEL_0..SLSA_SOURCE_LEVEL_3 (R-0126) although the track defines L4 and SlsaResult's examples include SLSA_SOURCE_LEVEL_4 — see design-notes Q2."

  - name: control-continuity
    subject: "(branch, technical control) pair"
    locator: "source-requirements.md #continuity"
    initial: not-established
    states: [not-established, continuous, lapsed]
    transitions:
      - {from: not-established, to: continuous, trigger: "control t configured while branch points at revision a", guard: "the next revision b is the first protected by t; b is the start revision of t's continuity"}
      - {from: continuous, to: lapsed, trigger: "control disabled / a revision added to the branch while t is disabled"}
      - {from: lapsed, to: continuous, trigger: "control re-enabled", guard: "continuity re-established from a new revision (R-0102)"}
      - {from: continuous, to: continuous, trigger: "safe expunging process applied", guard: "allowed exception to continuity (#continuity)"}
    error_states: [lapsed]

  - name: named-reference
    subject: "Branch or Tag in a Source Repository"
    locator: "source-requirements.md § Definitions, #history, #access-and-history"
    initial: "points-at(a)"
    states: ["points-at(a)", "points-at(b)", rejected-update]
    transitions:
      - {from: "points-at(a)", to: "points-at(b)", trigger: "branch update", guard: "a is an ancestor of b (R-0100; git: no force push); change recorded with time, actor, new revision id (R-0099)"}
      - {from: "points-at(a)", to: rejected-update, trigger: "branch update to a non-descendant (force push) or any move/delete of a Tag", guard: "L2+: R-0100; tags: R-0082"}
    error_states: [rejected-update]
    notes: "'latest'/'nightly' style movable tags are Named References, not Tags, in SLSA terms."

  - name: proposed-change-review
    subject: "Proposed Change to a protected branch (Source L4; Review Every Single Revision control)"
    locator: "source-requirements.md #two-party-review; source-example-controls.md"
    initial: proposed
    states: [proposed, partially-approved, approved, submitted, approvals-revoked, exception-merged]
    transitions:
      - {from: proposed, to: partially-approved, trigger: "approval by one trusted person (uploader counts if trusted)"}
      - {from: partially-approved, to: approved, trigger: "approval by a second, different trusted person", guard: "R-0113"}
      - {from: "partially-approved|approved", to: approvals-revoked, trigger: "proposal modified after approval", guard: "R-0115 (final revision must be reviewed); example control: R-0147, R-0148"}
      - {from: approvals-revoked, to: partially-approved, trigger: "new approval (MAY be by a prior approver, R-0149)"}
      - {from: approved, to: submitted, trigger: "submit to the approved context only (context-specific approvals)"}
      - {from: proposed, to: exception-merged, trigger: "Trusted Robot merge under a perpetual exception", guard: "R-0117"}
    error_states: [approvals-revoked]

  - name: attestation-publication
    subject: "build provenance attestation for one artifact"
    locator: "distributing-provenance.md"
    initial: generated
    states: [generated, signed, published, superseded-by-new-release]
    transitions:
      - {from: generated, to: signed, trigger: "control plane signs (L2+)"}
      - {from: signed, to: published, trigger: "producer publishes (registry sidecar / release / transparency log)", guard: "R-0050"}
      - {from: published, to: superseded-by-new-release, trigger: "need to change the attestation", guard: "attestation is immutable; a new release (and new artifacts) SHOULD be created (R-0054, R-0055)"}
    error_states: []

  - name: provenance-verification
    subject: "one (artifact, provenance) pair at a verifier"
    locator: "verifying-artifacts.md § How to verify"
    initial: received
    states: [received, signature-ok, subject-ok, type-ok, level-determined, expectations-ok, accepted, rejected]
    transitions:
      - {from: received, to: rejected, trigger: "no provenance", guard: "threat F 'Upload package without provenance'"}
      - {from: received, to: signature-ok, trigger: "Step 1.1 signature verifies with roots of trust"}
      - {from: signature-ok, to: subject-ok, trigger: "Step 1.2 subject digest matches"}
      - {from: subject-ok, to: type-ok, trigger: "Step 1.3 predicateType is https://slsa.dev/provenance/v1"}
      - {from: type-ok, to: level-determined, trigger: "Step 1.4 lookup(key, builder.id) default L1"}
      - {from: level-determined, to: expectations-ok, trigger: "Step 2 builder, source repo, buildType, externalParameters match", guard: "unrecognised externalParameters fail unless on the ecosystem's ignore list (R-0059, R-0060)"}
      - {from: expectations-ok, to: accepted, trigger: "(optional Step 3 dependencies)"}
      - {from: "received|signature-ok|subject-ok|type-ok|level-determined", to: rejected, trigger: "the corresponding check fails"}
    error_states: [rejected]

  - name: vsa-verification
    subject: "one (artifact, VSA) pair at a consumer"
    locator: "verification_summary.md § How to verify"
    initial: received
    states: [received, s1-signature, s2-subject, s3-type, s4-verifier, s5-resourceUri, s6-passed, s7-levels, accepted, rejected]
    transitions:
      - {from: received, to: s1-signature, trigger: "signature verifies with preconfigured roots of trust"}
      - {from: s1-signature, to: s2-subject, trigger: "subject matches artifact digest"}
      - {from: s2-subject, to: s3-type, trigger: "predicateType is https://slsa.dev/verification_summary/v1"}
      - {from: s3-type, to: s4-verifier, trigger: "verifier matches the key used in step 1"}
      - {from: s4-verifier, to: s5-resourceUri, trigger: "resourceUri equals expected value"}
      - {from: s5-resourceUri, to: s6-passed, trigger: "verificationResult is PASSED"}
      - {from: s6-passed, to: s7-levels, trigger: "verifiedLevels contains expected value"}
      - {from: s7-levels, to: accepted, trigger: "(optional) additional fields verified"}
      - {from: "received|s1-signature|s2-subject|s3-type|s4-verifier|s5-resourceUri|s6-passed", to: rejected, trigger: "the next MUST step fails (R-0239)"}
    error_states: [rejected]

  - name: expectations-tofu
    subject: "expectations for a package name (build) or branch/tag (source)"
    locator: "verifying-artifacts.md / verifying-source.md § Forming Expectations"
    initial: unset
    states: [unset, pinned, alerted]
    transitions:
      - {from: unset, to: pinned, trigger: "first version accepted as-is (trust on first use)"}
      - {from: pinned, to: alerted, trigger: "new provenance/VSA differs from the old one", guard: "benign-change rules MAY suppress (e.g. known-safe parameter)"}
      - {from: pinned, to: pinned, trigger: "producer-defined change through an authenticated channel with protection against unilateral modification", guard: "R-0066 / R-0139; verification threat 'Tamper with recorded expectations' -> two-party review"}
    error_states: [alerted]
