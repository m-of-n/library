        kind: "stated"
      - name: "l1-fields-present"
        meaning: "buildDefinition, runDetails, buildType, externalParameters, builder and builder.id are all set."
        kind: "inferred"
        inferred_reason: "The fields are stated REQUIRED for SLSA Build L1 (§4.2 to §4.5); that a consumer checks them is not."
