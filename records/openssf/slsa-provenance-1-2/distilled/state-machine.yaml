  - id: "M02"
    name: "member-interpretation"
    title: "How one member of a predicate object is read"
    locator: "§3, §4.3, §4.7"
    actor: "consumer; verifier where a guard says so"
    protocol_flow: "F05 steps 3 and 4, F06 step 5"
    purpose: >-
      One run per member (a name and its value) present in a JSON object of the predicate, the two
      parameter objects included. A field the object lacks is unset and has no run. Entries of the
      maps digest, version and annotations are values rather than fields and have no run; that
      scoping is this model's. Inputs: the name, the value, whether the member sits inside
      externalParameters, and whether the reader is verifying. Recognized means a field this version
      of the predicate defines, or inside a parameter object a parameter the reader's buildType
      schema defines; expected means inside the verifier's expectation.
    determinism: >-
      Deterministic but for one input: an unrecognized extension field inside externalParameters
      read by a verifier satisfies both T03 and T06, and the source does not rank them (SD-5). T01
      is tested first: a null or empty member is simply absent, never ignored or rejected (inferred
      from equivalently, L110).
    initial: "member-read"
    states:
      - name: "member-read"
        meaning: "A member is in hand with its name, value, location and the reader's role."
        kind: "inferred"
        inferred_reason: "An entry state for the machine."
      - name: "as-if-unset"
        meaning: "Read exactly as if the member were absent."
        kind: "stated"
        terminal: "yes"
      - name: "interpreted"
        meaning: "Read with the meaning its definition gives."
        kind: "inferred"
        inferred_reason: "The complement of the ignore rule (L105); stated nowhere as such."
        terminal: "yes"
      - name: "interpreted-extension"
        meaning: "A recognized extension field, read by its own definition; it changes no other field's meaning."
        kind: "stated"
        terminal: "yes"
      - name: "ignored"
        meaning: "Unrecognized and ignored: the attestation reads as if the member were absent."
        kind: "stated"
        terminal: "yes"
      - name: "field-rejected"
        meaning: "A verifier rejects the attestation for this member (M01.T14)."
        kind: "stated"
        error: "yes"
        terminal: "yes"
    error_states:
      - "field-rejected"
    transitions:
      - id: "M02.T01"
        from: "member-read"
        to: "as-if-unset"
        trigger_kind: "event"
        trigger: "member-examined"
        guard: "value is null or empty (empty is undefined in the source; this model reads it as an empty string, object or array)"
        kind: "stated"
        quotes:
          - source_lines: "110"
            quote: |-
              Unset, null, and empty field values MUST be interpreted equivalently.
        constrained_by:
          - "slsa-provenance-1-2#R-0010"
      - id: "M02.T02"
        from: "member-read"
        to: "interpreted"
        trigger_kind: "event"
        trigger: "member-examined"
        guard: "value set; name recognized and not an extension field; and not (inside externalParameters, reader verifying, member unexpected)"
        kind: "inferred"
        inferred_reason: "The source states only what happens to unrecognized fields (L105); reading a recognized one by its definition is the implied default."
        constrained_by:
          - "slsa-provenance-1-2#R-0009"
      - id: "M02.T03"
        from: "member-read"
        to: "field-rejected"
        trigger_kind: "event"
        trigger: "member-examined"
        guard: "value set; inside externalParameters; reader verifying; name unrecognized or member unexpected"
        kind: "stated"
        conflict: "SD-5, with M02.T06, when the member is an unrecognized extension field"
        quotes:
          - source_lines: "302-303"
            quote: |-
              Verifiers SHOULD reject unrecognized or unexpected fields within `externalParameters`.
        constrained_by:
          - "slsa-provenance-1-2#R-0018"
          - "slsa-provenance-1-2#R-0166"
      - id: "M02.T04"
        from: "member-read"
        to: "interpreted-extension"
        trigger_kind: "event"
        trigger: "member-examined"
        guard: >-
          value set; an extension field (a name of the form vendor_fieldname; an underscore marks it,
          tested on predicate fields only, SD-4) that the reader recognizes; and not (inside
          externalParameters, reader verifying, member unexpected)
        kind: "stated"
        quotes:
          - source_lines: "540-541"
            quote: |-
              Implementations MAY add extension fields to any JSON object to describe information that is not captured in a standard field.
          - source_lines: "543-546"
            quote: |-
              Extension fields SHOULD use names of the form `<vendor>_<fieldname>`, e.g. `examplebuilder_isCodeReviewed`. This practice avoids field name collisions by namespacing each vendor. Non-extension field names never contain an underscore.
          - source_lines: "547"
            quote: |-
              Extension fields MUST NOT alter the meaning of any other field.
        constrained_by:
          - "slsa-provenance-1-2#R-0043"
          - "slsa-provenance-1-2#R-0044"
          - "slsa-provenance-1-2#R-0045"
          - "slsa-provenance-1-2#R-0129"
      - id: "M02.T05"
        from: "member-read"
        to: "ignored"
        trigger_kind: "event"
        trigger: "member-examined"
        guard: "value set; name unrecognized and not an extension field; and not (inside externalParameters and reader verifying)"
        kind: "stated"
        quotes:
          - source_lines: "105"
            quote: |-
              Consumers MUST ignore unrecognized fields unless otherwise noted.
        constrained_by:
          - "slsa-provenance-1-2#R-0009"
          - "slsa-provenance-1-2#R-0166"
      - id: "M02.T06"
        from: "member-read"
        to: "ignored"
        trigger_kind: "event"
        trigger: "member-examined"
        guard: "value set; an extension field the reader does not recognize, wherever it sits"
        kind: "stated"
