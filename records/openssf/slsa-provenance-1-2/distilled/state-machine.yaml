        inferred_reason: "builder.id's role as the determiner of the level is stated (L449-451); comparing the level with an expectation belongs to Verifying Artifacts."
      - name: "external-parameters-verified"
        meaning: "The buildType is one the verifier expects, and externalParameters hold only recognized, expected members whose values match."
