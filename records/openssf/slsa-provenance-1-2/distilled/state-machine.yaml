        note: "The buildType clause is this model's (T13); the rest is L74-75 and L302-303."
      - name: "accepted"
        meaning: "Accepted as far as this source goes: the ALLOW of L553."
        kind: "inferred"
        inferred_reason: "The source names ALLOW and DENY only inside the monotonic principle (L551-553)."
