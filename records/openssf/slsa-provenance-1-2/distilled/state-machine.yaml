    name: "provenance-acceptance"
    title: "What a consumer does with one attestation said to carry SLSA Provenance v1"
    locator: "front matter, §3, §4.2, §4.3, §4.4, §4.5, §4.7, §5"
    actor: "consumer; verifier from l1-fields-present on"
    protocol_flow: "F05, F06"
    purpose: >-
      The document-level sequence. Guards are the source's where it has them. The order is this
      model's (F06 order_note), as is every state or exit marked opaque, which stands for Verifying
      Artifacts or the in-toto attestation framework. accepted means accepted as far as this source
      defines acceptance; Verifying Artifacts adds checks of its own (T16, T17).
    initial: "idle"
    states:
      - name: "idle"
        meaning: "No attestation in hand."
        kind: "inferred"
        inferred_reason: "An entry state for the machine."
      - name: "received"
        meaning: "An attestation said to carry this predicate is in hand; nothing has been checked."
        kind: "inferred"
        inferred_reason: "The source defines no carrier and no receipt."
      - name: "signer-established"
        meaning: "The signer's identity is known (opaque: established outside this source)."
        kind: "inferred"
        inferred_reason: "The pair check (T09) needs it; how it is established is outside the source."
      - name: "type-matched"
