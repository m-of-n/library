# slsa-provenance-1-2 state machines, FX-1 pass 1 (extract), protocol and state-machine agent. Flows are in protocol.yaml; prose in protocol.md.
record: "slsa-provenance-1-2"
reviewed_by: ""
kind: "state-machine"
extracted: "2026-11-16"
extracted_by: >-
  FX-1 pass 1 (extract), protocol and state-machine agent, effort max, from the source only,
  blind as protocol.yaml says.
source:
  file: ".cache/slsa-provenance-1-2.txt"
  sha256: "1a3828724437a0fc24bb492bca6db28df114e318bbaace85cc9f75204035db55"
applicability: >-
  The source defines no stateful protocol: nothing is registered, issued, renewed or revoked, and
  the build's own phases carry no guard or error state. Three things it does give a lifecycle with
  guards of its own, and they are modelled: what a consumer does with one attestation (M01, guards
  from §3, §4.3 and §4.5, with what Verifying Artifacts decides as opaque exits), how one member of
  a predicate object is read (M02, §3, §4.3 and §4.7), and how a predicate type lives across
  versions of the specification (M03, front matter, §3, §8).
note: >-
  Conventions. States are name, meaning and kind; error states carry error yes and are listed in
  error_states; terminal states carry terminal yes. Every trigger is an event defined under events
  (trigger_kind event): the source defines no message whose arrival drives a transition, and
  messages.yaml was not read. guard and action are this file's wording; the source's words are in
  each transition's quotes, written from the source by script and checked by bin/check-quotes.
  kind stated means the source states the transition or the rule it applies; inferred means this
  model added it, with inferred_reason; opaque marks a state or exit standing for a document
  outside this source. constrained_by ids were emitted by script from requirements.yaml (skeleton
  ids R-0002 to R-0050 only) and every resolved pair was read; pass 2 added the ids the requirements
  lane appended (R-0051 to R-0170) where a transition quotes or applies their statements, by script, and
  read each added pair. A conflict key names a transition
  whose guard overlaps another's on some input with a different target, and the source defect that
  causes it.
events:
  - name: "attestation-received"
    meaning: "An attestation said to carry this predicate is in hand (the carrier is outside this source)."
  - name: "signer-identified"
    meaning: "The signer's identity has been established (outside this source)."
  - name: "signer-not-established"
    meaning: "The envelope or signature could not be verified (outside this source)."
  - name: "advance"
    meaning: "The machine moves to its next check; no input is consumed."
  - name: "fields-read"
    meaning: "Every member outside externalParameters has had an M02 run."
  - name: "level-read"
    meaning: "The Build level has been read from builder.id (Verifying Artifacts step 1, outside this source)."
  - name: "external-parameters-checked"
    meaning: "The verifier has examined externalParameters: the buildType against its expectations, every member under M02 with the reader verifying, and the values against the expectation."
  - name: "verifying-artifacts-checks-passed"
    meaning: "The checks Verifying Artifacts adds have passed (outside this source)."
  - name: "verifying-artifacts-check-failed"
    meaning: "A check Verifying Artifacts adds has failed (outside this source)."
  - name: "member-examined"
    meaning: "A member's name, value, location (inside externalParameters or not) and the reader's role are known."
  - name: "candidate-release"
    meaning: "The first release candidate of a major version is published."
  - name: "next-candidate"
    meaning: "A further release candidate of the same major version is published."
  - name: "final-release"
    meaning: "The final version of a major version is published."
  - name: "minor-release"
    meaning: "A new minor version of the specification is published."
  - name: "incompatible-change"
    meaning: "A version with a backwards-incompatible change is published."
machines:
