  version: "SLSA Build Provenance, SLSA Specification v1.2; predicateType https://slsa.dev/provenance/v1"
applicability: >-
  Protocol applies. The source is a data format (an in-toto predicate) but it also names the
  parties that make and use it and puts obligations on each: a build platform that runs a
  tenant's build and records provenance (§2, §4.2 to §4.6), the author of a buildType that
  defines the build template (§2, §4.3, §6), a client that evaluates build configuration before
  the server sees it (§4.3), consumers that parse (§3, §4.7) and verify (§2, §4.3, §4.5) the
  result, a migration from v0.2 (§7), and a versioning rule for the predicate type (front
  matter, §3). It defines no transport, envelope, signature or distribution, and it hands
  verification proper to Verifying Artifacts (§5), a page outside this source; those steps
  appear here as opaque steps, marked inferred where this model supplies them.
conventions:
  quoting: >-
    Every quotation is a quotes item with source_lines and quote. The words were written from
    .cache/slsa-provenance-1-2.txt by script (bin/_source_text reading, whitespace collapsed),
    never typed, with the tightest range that holds them; bin/check-quotes verifies every one.
    The source is Markdown, so a quotation keeps its Markdown: list bullets, backticks, link
    brackets, and the blockquote marker of the front-matter note (L20-23), which appears
    mid-sentence as a lone > where that note wraps. Text in action, guard, note and on_error is
    this file's wording; where it repeats source words, the step's quotes carry them.
  step_kind: >-
    kind is stated (the source says this step happens or this obligation exists) or inferred
    (this model's step, with inferred_reason saying what the source does and does not say). An
    order the source does not fix is called out in the flow's order_note.
  on_error_basis: >-
    stated: the source says what follows a failure. unspecified: the source names the operation
    and says nothing about its failure; on_error then reads unspecified by source. inferred: this
    file's reading, and on_error says so. opaque: the outcome belongs to a document outside this
    source (Verifying Artifacts, the in-toto attestation framework).
  constrained_by: >-
    slsa-provenance-1-2#R-NNNN ids of requirements.yaml, emitted by script from a locator and a
    phrase of the requirement text, refusing zero or several matches, then every resolved pair
    read. Only skeleton ids R-0002 to R-0050 are cited: R-0001 is the RFC 2119 recital, not a
    requirement, and ids the requirements lane adds during pass 1 did not exist when this file was
    written. Keyword-less statements a step relies on are listed under uncited_statements by
    line, for pass 2 or 3 to wire to whatever ids they receive. Pass 2 (verify) wired them: the ids requirements.yaml
    gave those statements (R-0051 to R-0170) were added to the steps and error paths that quote them, emitted by
    script from the id table, and each added pair was read.
  messages: >-
    message names the source's own structure where there is one (Statement, Provenance,
    BuildDefinition, RunDetails, Builder, BuildMetadata, ResourceDescriptor: the §4.1 summaries
    and §4.2 to §4.6) with message_defined_in_source yes, or describes an exchange the source
    names but does not define (a build request, a configuration object, a document at a URI) with
    message_defined_in_source no. messages.yaml was not read, so pass 3 joined these names to it: see message_join at the end of this file.
  roles: "from and to name roles of the roles list; from equal to to marks a local step."
roles:
  - name: "build-platform-implementer"
    locator: "§2"
    definition: "Designs the build platform and its security model; decides what builder.id names."
    kind: "stated"
    quotes:
      - source_lines: "59-61"
        quote: |-
          The build platform implementer SHOULD define a security model for the build platform in order to clearly identify the platform's boundaries, actors, and interfaces.
  - name: "build-platform"
    locator: "§2, §4.4, §4.5"
    definition: >-
      The builder: everything trusted to run the build faithfully and record its provenance,
      people and hardware included, identified by builder.id. Its parts include the trusted control
      plane (L89-90 makes it the platform's; L464) and, since builderDependencies sits
      under Builder, the orchestrator (L470). The source also calls it the server or the build
      server when a client sends it configuration (§4.3, L375, L397, L400); that these name the
      same party is this model's reading.
    kind: "stated"
    quotes:
      - source_lines: "481-483"
        quote: |-
          The build platform, or <dfn>builder</dfn> for short, represents the transitive closure of all the entities that are, by necessity, [trusted] to faithfully run the build and record the provenance.
      - source_lines: "415-416"
        quote: |-
          Identifies the build platform that executed the invocation, which is trusted to have correctly performed the operation and populated this provenance.
  - name: "build-process"
    locator: "§2, §4.5"
    definition: >-
      The build itself, run as an independent process on the platform and controlled by the
      tenant; the workload of L470 is read here as the same thing. It may generate provenance fields the
      control plane does not verify, which builder.id's documentation should list (L463-464).
    kind: "stated"
    quotes:
      - source_lines: "53"
        quote: |-
          Each build runs as an independent process on a multi-tenant build platform.
      - source_lines: "463-464"
        quote: |-
          Any fields that are generated by the tenant-controlled build process and not verified by the trusted control plane, except for the `subject`.
  - name: "build-cache"
    locator: "§2"
    definition: "A cache the build process may talk to during execution; the exchange is not recorded."
    kind: "stated"
    quotes:
      - source_lines: "89-90"
        quote: |-
          During execution, the build process might communicate with the build platform's control plane and/or build caches.
  - name: "tenant"
    locator: "§2, §4.3"
    definition: >-
      The user or tenant who starts a build and controls its external parameters; at Build L3 those
      parameters are complete, leaving an external party no other way to influence the build
      (L293-295).
    kind: "stated"
    quotes:
      - source_lines: "292-293"
        quote: |-
          The parameters that are under external control, such as those set by a user or tenant of the build platform.
  - name: "client"
    locator: "§4.3"
    definition: >-
      The tenant-side tool that evaluates build configuration before sending it to the build
      server, usually on an untrusted workstation (L389).
    kind: "stated"
    quotes:
      - source_lines: "374-376"
        quote: |-
          When build configuration is evaluated client-side before being sent to the server, such as transforming version-controlled YAML into ephemeral JSON, some solution is needed to make [verification] practical.
      - source_lines: "396-398"
        quote: |-
          If clients send the evaluated configuration object directly to the build server, record the digest directly in `externalParameters`.
  - name: "version-control"
    locator: "§4.3"
    definition: "Where build configuration originates and where consumers expect to trace it back to."
    kind: "stated"
    quotes:
      - source_lines: "376-379"
        quote: |-
          Consumers need a way to know what configuration is expected and the usual way to do that is to map it back to version control, but that is not possible if the server cannot verify the configuration's origins.
  - name: "temporary-storage"
    locator: "§4.3"
    definition: "A location a client may upload an evaluated configuration object to (footnote of §4.3)."
    kind: "stated"
    quotes:
      - source_lines: "398-400"
        quote: |-
          If clients upload the configuration object to a temporary storage location and send that location to the build server,
  - name: "dependency-host"
    locator: "§2, §4.3"
    definition: >-
      Any place an artifact is fetched from during the build (a git server, example.com in §4.3's
      example). The source names the fetched artifacts, not their hosts; the role name is this
      model's.
    kind: "inferred"
    inferred_reason: "Fetching is stated (L82-84, L319-322); a party that serves the fetch is implied."
    quotes:
      - source_lines: "82-84"
        quote: |-
          All artifacts fetched during initialization or execution of the build process are considered dependencies, including those referenced directly by parameters.
  - name: "signer"
    locator: "§4.5"
    definition: >-
      The identity that signs provenance. Distinct from the builder: one signer may sign for
      several builders. Consumers judge a signer and a builder.id together (L496). How signing
      works is outside this source.
    kind: "stated"
    quotes:
      - source_lines: "501-503"
        quote: |-
          The builder is distinct from the signer in order to support the case where one signer generates attestations for more than one builder, as in the GitHub Actions example above.
  - name: "consumer"
    locator: "§1, §3, §4.3, §4.5"
    definition: >-
      Any party that reads provenance. Bound by the parsing rules (§3), by accepting only specific
      signer-builder pairs (§4.5), and expected to hold an expectation of good externalParameters
      (§4.3).
    kind: "stated"
    quotes:
      - source_lines: "33-34"
        quote: |-
          Consumers of the provenance can verify that the artifact was built according to expectations.
  - name: "verifier"
    locator: "§4.3, §5"
    definition: >-
      A consumer checking provenance against its expectations. The source says Verifiers once
      (L302) and Consumers elsewhere, and does not define how the two relate; that a verifier is a
      consumer that verifies is this model's reading (§1 has consumers verify).
    kind: "stated"
    quotes:
      - source_lines: "302-303"
        quote: |-
          Verifiers SHOULD reject unrecognized or unexpected fields within `externalParameters`.
  - name: "rebuilder"
    locator: "§1, §4.3"
    definition: "Anyone rebuilding the artifact from its provenance (the Others of §1)."
    kind: "stated"
    quotes:
      - source_lines: "35"
        quote: |-
          Others can rebuild the artifact, if desired.
  - name: "buildtype-author"
    locator: "§4.3, §6"
    definition: >-
      Whoever defines and publishes a buildType: the template, its parameter schemas, the
      document its URI resolves to. The source never names this party; both indexed buildTypes are
      marked community-maintained (L569-570), and the platform often defines its own (L67-68).
    kind: "inferred"
    inferred_reason: "The source puts obligations on the buildType's URI and documentation, not on a named party."
    quotes:
      - source_lines: "283-286"
        quote: |-
          The URI SHOULD resolve to a human-readable specification that includes: overall description of the build type; schema for `externalParameters` and `internalParameters`; unambiguous instructions for how to initiate the build given this BuildDefinition, and a complete example.
      - source_lines: "569"
        quote: |-
          GitHub Actions Workflow (community-maintained)
  - name: "spec-maintainers"
    locator: "§3, §6, §8"
    definition: >-
      Whoever publishes versions of this specification and keeps the index of build types. Never
      named: §6 asks for a pull request on GitHub, §8 is their change history.
    kind: "inferred"
    inferred_reason: "The versioning rule (§3) and the index (§6) imply a publisher the source does not name."
    quotes:
      - source_lines: "572"
        quote: |-
          To add an entry here, please send a pull request on GitHub.
  - name: "migrator"
    locator: "§7"
    definition: >-
      Whoever turns v0.2 provenance (old) into v1 provenance, a generator being updated or a
      converter; §7 addresses an unnamed reader.
    kind: "inferred"
    inferred_reason: "§7 gives pseudocode without naming who runs it."
    quotes:
      - source_lines: "576-577"
        quote: |-
          To migrate from [version 0.2](/provenance/v0.2) (`old`), use the following pseudocode.
flows:
  - id: "F01"
    name: "platform-establishment"
    title: "A build platform fixes its trust boundary, a builder.id per mode, and the documentation behind each id"
    locator: "§2, §4.3, §4.5"
    kind_of_flow: "setup"
    participants:
      - "build-platform-implementer"
      - "build-platform"
      - "signer"
      - "consumer"
    summary: >-
      Before any provenance exists, the implementer models the platform's security, draws from
      that model the boundary builder.id will name, gives every mode of operation that differs in
      security attributes or Build level its own builder.id (and preferably its own signer
      identity), and publishes behind each builder.id URI what the id covers. Consumers in turn
      decide which signer-builder pairs they accept; how they learn the pairs is not defined.
    order_note: >-
      The source orders step 1 before step 2 (the model is then used, L61). The other steps have no
      stated order beyond preceding the first build, which is this model's reading.
    steps:
      - n: "1"
        from: "build-platform-implementer"
        to: "build-platform-implementer"
        message: "security model of the build platform"
        message_defined_in_source: "no"
        action: "Define a security model that fixes where the platform begins and ends, who acts in it, and its interfaces."
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "59-61"
            quote: |-
              The build platform implementer SHOULD define a security model for the build platform in order to clearly identify the platform's boundaries, actors, and interfaces.
        constrained_by:
          - "slsa-provenance-1-2#R-0003"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "build-platform-implementer"
        to: "build-platform-implementer"
        message: "security model of the build platform"
        message_defined_in_source: "no"
        action: >-
          Use the model to settle what builder.id will stand for (the whole trusted platform,
          transitively) and which control plane is trusted.
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "61-63"
            quote: |-
              This model SHOULD then be used to identify the transitive closure of the trusted build platform for the `builder.id` as well as the trusted control plane.
        constrained_by:
          - "slsa-provenance-1-2#R-0004"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "build-platform-implementer"
        to: "build-platform"
        message: "builder.id"
        message_defined_in_source: "yes"
        action: >-
          Assign builder.id: a URI for the trusted platform's transitive closure that reflects the
          trust base consumers care about. Every mode of operation whose security attributes or
          SLSA Build level differ gets its own builder.id. How finely to split is left to judgement
          (§4.5 contrasts GitHub-hosted with self-hosted runners).
        locator: "§4.5"
        kind: "stated"
        quotes:
          - source_lines: "449"
            quote: |-
              URI indicating the transitive closure of the trusted build platform.
          - source_lines: "453-455"
            quote: |-
              If a build platform has multiple modes of operations that have differing security attributes or SLSA Build levels, each mode MUST have a different `builder.id` and SHOULD have a different signer identity.
          - source_lines: "489"
            quote: |-
              The `id` MUST reflect the trust base that consumers care about.
          - source_lines: "489-490"
            quote: |-
              How detailed to be is a judgement call.
        constrained_by:
          - "slsa-provenance-1-2#R-0036"
          - "slsa-provenance-1-2#R-0038"
          - "slsa-provenance-1-2#R-0107"
          - "slsa-provenance-1-2#R-0109"
        on_error: >-
          Modes sharing one builder.id break the MUST of L453-455. The source states the risk this
          prevents (a less secure mode compromising a more secure one, L455-456) and no means of
          detecting the breach.
        on_error_basis: "stated"
      - n: "4"
        from: "build-platform-implementer"
        to: "signer"
        message: "signer identity per mode"
        message_defined_in_source: "no"
        action: >-
          Give each such mode its own signer identity (SHOULD). The identity scheme and the signing
          mechanism are outside this source.
        locator: "§4.5"
        kind: "stated"
        quotes:
          - source_lines: "455-456"
            quote: |-
              This is to minimize the risk that a less secure mode compromises a more secure one.
        constrained_by:
          - "slsa-provenance-1-2#R-0036"
          - "slsa-provenance-1-2#R-0110"
        on_error: >-
          unspecified by source. Where modes share a signer, the signer-builder pair check of F06
          step 2 cannot separate the modes by signer, only by builder.id (inferred).
        on_error_basis: "inferred"
      - n: "5"
        from: "build-platform-implementer"
        to: "consumer"
        message: "builder.id documentation (the document the builder.id URI resolves to)"
        message_defined_in_source: "no"
        action: >-
          Make the builder.id URI resolve to documentation of five things: the scope of the id, the
          Build level it claims, what it guarantees about each provenance field's accuracy and
          completeness, every field the tenant-controlled build process generates without control-plane
          verification (the subject excepted), and how to interpret any extension fields.
        locator: "§4.5"
        kind: "stated"
        quotes:
          - source_lines: "458-465"
            quote: |-
              The `builder.id` URI SHOULD resolve to documentation explaining: - The scope of what this ID represents. - The claimed SLSA Build level. - The accuracy and completeness guarantees of the fields in the provenance. - Any fields that are generated by the tenant-controlled build process and not verified by the trusted control plane, except for the `subject`. - The interpretation of any extension fields.
        constrained_by:
          - "slsa-provenance-1-2#R-0037"
          - "slsa-provenance-1-2#R-0111"
          - "slsa-provenance-1-2#R-0112"
          - "slsa-provenance-1-2#R-0113"
          - "slsa-provenance-1-2#R-0114"
          - "slsa-provenance-1-2#R-0115"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        note: "Why the subject is excepted is not said (OI-05)."
      - n: "6"
        from: "build-platform-implementer"
        to: "build-platform"
        message: "build platform design"
        message_defined_in_source: "no"
        action: >-
          Design the platform so externalParameters stay small and simple, and where possible so
          the BuildDefinition is its only top-level input, which guarantees the definition suffices
          to run the build.
        locator: "§4.3"
        kind: "stated"
        quotes:
          - source_lines: "297-298"
            quote: |-
              The build platform SHOULD be designed to minimize the size and complexity of `externalParameters`, in order to reduce fragility and ease [verification].
          - source_lines: "370-372"
            quote: |-
              If possible, architect the build platform to use this definition as its sole top-level input, in order to guarantee that the information is sufficient to run the build.
        constrained_by:
          - "slsa-provenance-1-2#R-0016"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "7"
        from: "consumer"
        to: "consumer"
        message: "accepted signer-builder pairs and expectations"
        message_defined_in_source: "no"
        action: >-
          Settle, ahead of verification, the signer-builder pairs to accept and an expectation of
          good externalParameters for each buildType to be verified.
        locator: "§4.3, §4.5"
        kind: "inferred"
        inferred_reason: >-
          The source requires consumers to accept only specific pairs and to hold an expectation;
          that both are settled before any provenance is checked, and from what source, is this
          model's reading. The source does not say how a consumer learns either.
        quotes:
          - source_lines: "496"
            quote: |-
              Consumers MUST accept only specific signer-builder pairs.
          - source_lines: "299-300"
            quote: |-
              Consumers SHOULD have an expectation of what "good" looks like; the more information that they need to check, the harder that task becomes.
        constrained_by:
          - "slsa-provenance-1-2#R-0039"
          - "slsa-provenance-1-2#R-0017"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
  - id: "F02"
    name: "buildtype-definition"
    title: "A buildType is defined, published at its URI, optionally indexed, and updated for v1.0 of the predicate (for later major versions, inferred)"
    locator: "§2, §4.3, §6, §7"
    kind_of_flow: "setup"
    participants:
      - "buildtype-author"
      - "spec-maintainers"
      - "consumer"
    summary: >-
      The buildType names a parameterized build template. Its author defines the parameter
      schemas, keeps them minimal, says how a parameter becomes a dependency uri, and publishes a
      human-readable specification at the buildType URI. Listing it in §6's index is by pull
      request. On the v0.2 to v1.0 change the buildType had to be updated; the source states
      this for that change only.
    order_note: "Steps 1 to 4 precede any build that names the buildType (inferred); step 5 is optional and unordered; step 6 is stated for the change to v1.0 only, and placing it on every major version change is inferred."
    steps:
      - n: "1"
        from: "buildtype-author"
        to: "buildtype-author"
        message: "build template"
        message_defined_in_source: "no"
        action: >-
          Define the parameterized template the buildType URI identifies: the process that ran,
          whatever platform ran it, and how to read the parameters and dependencies. It is often
          specific to one platform.
        locator: "§2, §4.3"
        kind: "stated"
        quotes:
          - source_lines: "65-68"
            quote: |-
              The build process is defined by a parameterized template, identified by `buildType`. This encapsulates the process that ran, regardless of what platform ran it. Often the build type is specific to the build platform because most build platforms have their own unique interfaces.
          - source_lines: "280-281"
            quote: |-
              Identifies the template for how to perform the build and interpret the parameters and dependencies.
        constrained_by:
          - "slsa-provenance-1-2#R-0055"
          - "slsa-provenance-1-2#R-0082"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "buildtype-author"
        to: "buildtype-author"
        message: "schemas of externalParameters and internalParameters"
        message_defined_in_source: "no"
        action: >-
          Define both parameter schemas: simple structure with string values (RECOMMENDED), no
          field name used in both (SHOULD NOT), everything that is the same for every build left
          implicit in the buildType (SHOULD), configuration moved into input artifacts wherever
          possible so verifying the artifact verifies it.
        locator: "§4.3"
        kind: "stated"
        quotes:
          - source_lines: "331-334"
            quote: |-
              Each is an arbitrary JSON object, though it is RECOMMENDED to keep the structure simple with string values to aid verification. The same field name SHOULD NOT be used for both `externalParameters` and `internalParameters`.
          - source_lines: "355-357"
            quote: |-
              Maximize the amount of information that is implicit from the meaning of `buildType`. In particular, any value that is boilerplate and the same for every build SHOULD be implicit.
          - source_lines: "359-363"
            quote: |-
              Reduce parameters by moving configuration to input artifacts whenever possible. For example, instead of passing in compiler flags via an external parameter that has to be [verified][Verification] separately, require the flags to live next to the source code or build configuration so that verifying the latter automatically verifies the compiler flags.
        constrained_by:
          - "slsa-provenance-1-2#R-0022"
          - "slsa-provenance-1-2#R-0023"
          - "slsa-provenance-1-2#R-0027"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "buildtype-author"
        to: "buildtype-author"
        message: "parameter-to-dependency conversion"
        message_defined_in_source: "no"
        action: "Document how a parameter value converts to the uri of the dependency it resolves to."
        locator: "§4.3"
        kind: "stated"
        quotes:
          - source_lines: "339-340"
            quote: |-
              The documentation for `buildType` SHOULD explain how to convert from a parameter to the dependency `uri`.
        constrained_by:
          - "slsa-provenance-1-2#R-0026"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "buildtype-author"
        to: "consumer"
        message: "buildType specification (the document the buildType URI resolves to)"
        message_defined_in_source: "no"
        action: >-
          Publish at the buildType URI a human-readable specification: an overall description,
          schemas for both parameter objects, instructions clear enough to start the build from a
          BuildDefinition, and a complete example.
        locator: "§4.3"
        kind: "stated"
        quotes:
          - source_lines: "283-286"
            quote: |-
              The URI SHOULD resolve to a human-readable specification that includes: overall description of the build type; schema for `externalParameters` and `internalParameters`; unambiguous instructions for how to initiate the build given this BuildDefinition, and a complete example.
        constrained_by:
