        action: >-
          Wrap the predicate in an in-toto Statement with the subject and predicateType
          https://slsa.dev/provenance/v1, that exact string and never the address of the page being
          read (the URL bar). Using this predicate is RECOMMENDED for meeting SLSA's provenance
          requirements (named SLSA v1.0 in this v1.2 page, OI-06). The Statement's other fields are
          the in-toto Statement's (L245-246).
        locator: "front matter, §1, §4.1"
        kind: "stated"
        quotes:
          - source_lines: "17"
            quote: |-
              "predicateType": "https://slsa.dev/provenance/v1"
          - source_lines: "20-21"
            quote: |-
              Always use the above string for `predicateType` rather than what is > in the URL bar.
          - source_lines: "37-38"
