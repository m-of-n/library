  - id: "F03"
    name: "build-and-provenance-generation"
    title: "A tenant's build runs on the platform, which records provenance and has it signed"
    locator: "§2, §4.2, §4.3, §4.4, §4.5, §4.6, §4.7, front matter"
    kind_of_flow: "main"
    participants:
      - "tenant"
      - "build-platform"
      - "build-process"
      - "dependency-host"
      - "build-cache"
      - "signer"
      - "consumer"
    summary: >-
      The tenant starts a build through the platform's external interface; what it passes becomes
      externalParameters. The platform runs the build as an independent process with its own
      internalParameters; everything the build fetches is a dependency; talk with the control
      plane or caches is not recorded and should not shape the build; the outputs are the subject.
      The platform then records BuildDefinition and RunDetails, may add extension fields, wraps the
      predicate in an in-toto Statement with the fixed predicateType, and a signer signs it. How the
      provenance reaches consumers is not defined.
    order_note: >-
      The source gives the order of steps 1 to 6 only through its wording (initialization or
      execution, during execution, finally). It does not say when the platform records each field;
      steps 7 to 10 are placed after the build ends (finishedOn needs the end), which is this
      model's reading. A platform may record some fields earlier.
    steps:
      - n: "1"
        from: "tenant"
        to: "build-platform"
        message: "build request through the platform's external interface (the values become externalParameters)"
        message_defined_in_source: "no"
        action: >-
          Start a build, passing the values under the tenant's control. Only values actually passed
          in belong in externalParameters; at Build L3 they are complete, leaving an external party
          no other way to influence the build; below L3 completeness may be best effort.
        locator: "§2, §4.3"
        kind: "stated"
        quotes:
          - source_lines: "73"
            quote: |-
              `externalParameters`: the external interface to the build.
          - source_lines: "336-337"
            quote: |-
              The parameters SHOULD only contain the actual values passed in through the interface to the build platform.
          - source_lines: "293-295"
            quote: |-
              They MUST be complete at SLSA Build L3, meaning that there is no additional mechanism for an external party to influence the build. (At lower SLSA Build levels, the completeness MAY be best effort.)
        constrained_by:
          - "slsa-provenance-1-2#R-0024"
          - "slsa-provenance-1-2#R-0014"
          - "slsa-provenance-1-2#R-0015"
          - "slsa-provenance-1-2#R-0057"
        on_error: "unspecified by source (each platform's own interface; refusal not described)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "build-platform"
        to: "build-process"
        message: "start of the build process (internalParameters set by the platform)"
        message_defined_in_source: "no"
        action: >-
          Run the build as an independent process. The platform sets internalParameters itself.
          startedOn, if recorded, is the time the build started.
        locator: "§2, §4.6"
        kind: "stated"
        quotes:
          - source_lines: "53"
            quote: |-
              Each build runs as an independent process on a multi-tenant build platform.
          - source_lines: "77"
            quote: |-
              `internalParameters`: set internally by the platform.
          - source_lines: "527"
            quote: |-
              The timestamp of when the build started.
        constrained_by:
          - "slsa-provenance-1-2#R-0060"
          - "slsa-provenance-1-2#R-0126"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "build-process"
        to: "dependency-host"
        message: "artifact fetch"
        message_defined_in_source: "no"
        action: >-
          Fetch artifacts during initialization or execution. Each is a dependency, including any a
          parameter names directly, and anything a fetched script fetches in turn is listed too
          (§4.3's foo.sh and bar.tar.gz). Completeness is best effort up to at least Build L3.
        locator: "§2, §4.3"
        kind: "stated"
        quotes:
          - source_lines: "82-84"
            quote: |-
              All artifacts fetched during initialization or execution of the build process are considered dependencies, including those referenced directly by parameters.
          - source_lines: "318-319"
            quote: |-
              Completeness is best effort, at least through SLSA Build L3.
          - source_lines: "319-322"
            quote: |-
              For example, if the build script fetches and executes "example.com/foo.sh", which in turn fetches "example.com/bar.tar.gz", then both "foo.sh" and "bar.tar.gz" SHOULD be listed here.
        constrained_by:
          - "slsa-provenance-1-2#R-0020"
          - "slsa-provenance-1-2#R-0063"
          - "slsa-provenance-1-2#R-0090"
        on_error: "unspecified by source (a failed fetch is not described)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "build-process"
        to: "build-platform"
        message: "control-plane communication"
        message_defined_in_source: "no"
        action: >-
          Optionally talk with the platform's control plane during execution. Not recorded as such:
          builder.id implies it. It should not shape the build definition; if it does, it goes in
          resolvedDependencies.
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "89-92"
            quote: |-
              During execution, the build process might communicate with the build platform's control plane and/or build caches. This communication is not captured directly in the provenance, but is instead implied by `builder.id` and subject to [SLSA Requirements](requirements.md).
        constrained_by:
          - "slsa-provenance-1-2#R-0008"
          - "slsa-provenance-1-2#R-0065"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "build-process"
        to: "build-cache"
        message: "build-cache communication"
        message_defined_in_source: "no"
        action: "As step 4, for build caches."
        locator: "§2"
        kind: "stated"
        quotes:
          - source_lines: "89-90"
            quote: |-
              During execution, the build process might communicate with the build platform's control plane and/or build caches.
        constrained_by:
          - "slsa-provenance-1-2#R-0008"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from: "build-process"
        to: "build-platform"
        message: "output artifacts (become subject) and byproducts"
        message_defined_in_source: "no"
        action: >-
          Output one or more artifacts; they are the subject. Logs and similar byproducts may also
          be produced. finishedOn, if recorded, is the time the build completed. Which party
          computes the subject digests is not stated; L463-464 lets the tenant-controlled process
          generate fields the control plane does not verify and exempts the subject from being
          documented as such (OI-05).
        locator: "§2, §4.4, §4.6"
        kind: "stated"
        quotes:
          - source_lines: "96-97"
            quote: |-
              Finally, the build process outputs one or more artifacts, identified by `subject`.
          - source_lines: "532"
            quote: |-
              The timestamp of when the build completed.
        constrained_by:
          - "slsa-provenance-1-2#R-0068"
          - "slsa-provenance-1-2#R-0128"
        on_error: "unspecified by source (a failed build, and whether it yields provenance, is not described; OI-08)"
        on_error_basis: "unspecified"
      - n: "7"
        from: "build-platform"
        to: "build-platform"
        message: "BuildDefinition"
        message_defined_in_source: "yes"
        action: >-
          Record buildDefinition. buildType (REQUIRED for L1). externalParameters (REQUIRED for L1,
          always included, minus extra parameters shown after careful analysis to have no security
          impact). internalParameters (OPTIONAL; may be included to help reproduce, debug or respond
          to incidents). resolvedDependencies: the fetched dependencies, plus the digests of artifacts
          the parameters reference, plus any control-plane or cache exchange that shaped the build.
          Together these should be enough to start the build.
        locator: "§2, §4.3"
        kind: "stated"
        quotes:
          - source_lines: "73-75"
            quote: |-
              In SLSA, these values are untrusted; they MUST be included in the provenance and MUST be verified downstream.
          - source_lines: "77-79"
            quote: |-
              In SLSA, these values are trusted because the platform is trusted; they are OPTIONAL and need not be verified downstream.
          - source_lines: "79-80"
            quote: |-
              They MAY be included to enable reproducible builds, debugging, or incident response.
          - source_lines: "326-328"
            quote: |-
              It SHOULD contain all the information necessary and sufficient to initialize the build and begin execution.
          - source_lines: "337-339"
            quote: |-
              Metadata about those parameter values, particularly digests of artifacts referenced by those parameters, SHOULD instead go in `resolvedDependencies`.
          - source_lines: "366-368"
            quote: |-
              These extra parameters SHOULD be excluded from the provenance after careful analysis that they indeed pose no security impact.
        constrained_by:
          - "slsa-provenance-1-2#R-0012"
          - "slsa-provenance-1-2#R-0005"
          - "slsa-provenance-1-2#R-0006"
          - "slsa-provenance-1-2#R-0007"
          - "slsa-provenance-1-2#R-0021"
          - "slsa-provenance-1-2#R-0025"
          - "slsa-provenance-1-2#R-0028"
          - "slsa-provenance-1-2#R-0008"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from: "build-platform"
        to: "build-platform"
        message: "RunDetails"
        message_defined_in_source: "yes"
        action: >-
          Record runDetails. builder, REQUIRED for L1 and, by §4.5's design rationale, even where
          the signer implies it, with id (REQUIRED for L1), builderDependencies (what the
          orchestrator used outside the workload: no effect on the build, a possible one on
          provenance generation or security guarantees) and version. metadata, none of it
          REQUIRED: invocationId (globally unique, SHOULD), startedOn, finishedOn. byproducts: only
          files worth keeping that cannot easily be regenerated, not every intermediate file.
          buildDefinition and runDetails are both REQUIRED for L1.
        locator: "§4.2, §4.4, §4.5, §4.6"
        kind: "stated"
        quotes:
          - source_lines: "250"
            quote: |-
              REQUIRED for SLSA Build L1: `buildDefinition`, `runDetails`
          - source_lines: "407"
            quote: |-
              REQUIRED for SLSA Build L1: `builder`
          - source_lines: "441"
            quote: |-
              REQUIRED for SLSA Build L1: `id`
          - source_lines: "503-504"
            quote: |-
              The field is REQUIRED, even if it is implicit from the signer, to aid readability and debugging.
          - source_lines: "470-472"
            quote: |-
              Dependencies used by the orchestrator that are not run within the workload and that do not affect the build, but might affect the provenance generation or security guarantees.
          - source_lines: "511"
            quote: |-
              REQUIRED: (none)
          - source_lines: "522"
            quote: |-
              The value SHOULD be globally unique.
          - source_lines: "431-433"
            quote: |-
              In most cases, this SHOULD NOT contain all intermediate files generated during the build. Instead, this SHOULD only contain files that are likely to be useful later and that cannot be easily reproduced.
        constrained_by:
          - "slsa-provenance-1-2#R-0011"
          - "slsa-provenance-1-2#R-0032"
          - "slsa-provenance-1-2#R-0035"
          - "slsa-provenance-1-2#R-0040"
          - "slsa-provenance-1-2#R-0041"
          - "slsa-provenance-1-2#R-0042"
          - "slsa-provenance-1-2#R-0033"
          - "slsa-provenance-1-2#R-0034"
          - "slsa-provenance-1-2#R-0117"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "9"
        from: "build-platform"
        to: "build-platform"
        message: "extension fields"
        message_defined_in_source: "no"
        action: >-
          Optionally add extension fields, in any object, named vendor_fieldname (SHOULD), never
          changing what another field means (MUST NOT), and monotonic, so that dropping or ignoring
          one should never turn DENY into ALLOW (SHOULD). The source says Implementations; placing this at the
          producer is this model's reading.
        locator: "§4.7"
        kind: "stated"
        quotes:
          - source_lines: "540-541"
            quote: |-
              Implementations MAY add extension fields to any JSON object to describe information that is not captured in a standard field.
          - source_lines: "543-544"
