  - id: "F05"
    name: "consumer-parsing"
    title: "A consumer reads a provenance Statement under the parsing rules"
    locator: "front matter, §3, §4.1, §4.6, §4.7"
    kind_of_flow: "main"
    participants:
      - "consumer"
    summary: >-
      A local procedure. The consumer matches the predicate type, then reads every field under the
      in-toto parsing rules this page summarises: unrecognized fields ignored unless otherwise
      noted, unset, null and empty read alike, an unrecognized extension read as if absent. Where
      §4.1's informative schemas disagree with the prose, the prose wins. Field-by-field outcomes
      are state-machine.yaml M02; the document-level sequence is M01.
    order_note: "Step 2 precedes the rest because the other rules are this predicate's (inferred). Steps 3 to 6 apply together, field by field."
    steps:
      - n: "1"
        from: "consumer"
        to: "consumer"
        message: "Statement"
        message_defined_in_source: "yes"
        action: "Take the in-toto Statement out of whatever carried it. Envelope and signature handling are outside this source."
        locator: "§4.1, §4.2"
        kind: "inferred"
        inferred_reason: "The source shows the Statement (§4.1) and defines no carrier."
        quotes:
          - source_lines: "245-246"
            quote: |-
              This section describes the fields within `predicate`. For a description of the other top-level fields, such as `subject`, see [Statement].
        constrained_by:
          - "slsa-provenance-1-2#R-0075"
        on_error: "opaque: envelope and signature failures belong to the in-toto attestation framework and Verifying Artifacts"
        on_error_basis: "opaque"
      - n: "2"
        from: "consumer"
        to: "consumer"
        message: "Statement"
        message_defined_in_source: "yes"
        action: >-
          Check predicateType is https://slsa.dev/provenance/v1. The URI carries the major version
          only, so every minor version shares it, and it resolves to the newest minor version.
        locator: "front matter, §3"
        kind: "inferred"
        inferred_reason: "The source tells producers to use this one string and says when it changes; a consumer-side match is not stated."
        quotes:
          - source_lines: "17"
            quote: |-
              "predicateType": "https://slsa.dev/provenance/v1"
          - source_lines: "106-107"
            quote: |-
              The `predicateType` URI includes the major version number and will always change whenever there is a backwards incompatible change.
          - source_lines: "108-109"
            quote: |-
              Minor version changes are always backwards compatible and "monotonic." Such changes do not update the `predicateType`.
          - source_lines: "21-22"
            quote: |-
              The `predicateType` URI will always resolve to the latest > minor version of this specification.
        constrained_by:
          - "slsa-provenance-1-2#R-0051"
          - "slsa-provenance-1-2#R-0070"
          - "slsa-provenance-1-2#R-0071"
          - "slsa-provenance-1-2#R-0072"
          - "slsa-provenance-1-2#R-0170"
          - "slsa-provenance-1-2#R-0160"
        on_error: >-
          Any other value is not this predicate and this source does not apply (inferred); what a
          near miss such as a version-specific URL means is not said (OI-03).
        on_error_basis: "inferred"
      - n: "3"
        from: "consumer"
        to: "consumer"
        message: "Provenance"
        message_defined_in_source: "yes"
        action: >-
          Apply the in-toto parsing rules (outside this source; §3 summarises them): skip
          any field not recognized, except where the page notes otherwise, and read unset, null and
          empty values as the same thing.
        locator: "§3"
        kind: "stated"
        quotes:
          - source_lines: "103"
            quote: |-
              This predicate follows the in-toto attestation [parsing rules].
          - source_lines: "105"
            quote: |-
              Consumers MUST ignore unrecognized fields unless otherwise noted.
          - source_lines: "110"
            quote: |-
              Unset, null, and empty field values MUST be interpreted equivalently.
        constrained_by:
          - "slsa-provenance-1-2#R-0009"
          - "slsa-provenance-1-2#R-0010"
          - "slsa-provenance-1-2#R-0069"
        on_error: >-
          stated for unrecognized fields: ignore them. The only otherwise-noted case a search of the
          source finds is inside externalParameters, where verifiers should reject (F06 step 5). A value of the
          wrong type is unspecified by source.
        on_error_basis: "stated"
      - n: "4"
        from: "consumer"
        to: "consumer"
        message: "Provenance"
        message_defined_in_source: "yes"
        action: >-
          Read extension fields: an unrecognized one is ignored, so an attestation with it reads
          exactly as one without it; a recognized one never changes another field's meaning. An
          underscore in a name marks an extension field, since standard names have none (but see
          SD-4).
        locator: "§4.7"
        kind: "stated"
        quotes:
          - source_lines: "545-546"
            quote: |-
              Non-extension field names never contain an underscore.
          - source_lines: "547-550"
            quote: |-
              In other words, an attestation with an absent extension field MUST be interpreted identically to an attestation with an unrecognized (and thus ignored) extension field.
        constrained_by:
          - "slsa-provenance-1-2#R-0045"
          - "slsa-provenance-1-2#R-0046"
          - "slsa-provenance-1-2#R-0129"
        on_error: "Inside externalParameters, ignoring and rejecting collide (SD-5)."
        on_error_basis: "stated"
      - n: "5"
        from: "consumer"
        to: "consumer"
        message: "Provenance"
        message_defined_in_source: "yes"
        action: >-
          Take the prose as authoritative where the cue or protobuf summary of §4.1 disagrees with
          it; the provenance is always JSON with lowerCamelCase names, whatever the protobuf file
          spells.
        locator: "§4.1"
        kind: "stated"
        quotes:
          - source_lines: "116-117"
            quote: |-
              This summary (in cue) is informative. In the event of a disagreement with the text description, the text is authoritative.
          - source_lines: "178-179"
            quote: |-
              This summary (in protobuf) is informative. In the event of a disagreement with the text description, the text is authoritative.
          - source_lines: "196-198"
            quote: |-
              While file uses snake_case as per the Protocol Buffers Style Guide, the // provenance is always serialized using JSON with lowerCamelCase. Protobuf // tooling performs this case conversion automatically.
        constrained_by:
          - "slsa-provenance-1-2#R-0073"
          - "slsa-provenance-1-2#R-0074"
          - "slsa-provenance-1-2#R-0158"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from: "consumer"
        to: "consumer"
        message: "BuildMetadata"
        message_defined_in_source: "yes"
        action: "Treat invocationId as opaque and case-sensitive unless builder.id defines its meaning and format."
        locator: "§4.6"
        kind: "stated"
        quotes:
          - source_lines: "520-521"
            quote: |-
              The exact meaning and format is defined by `builder.id`; by default it is treated as opaque and case-sensitive.
        constrained_by:
          - "slsa-provenance-1-2#R-0124"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
  - id: "F06"
    name: "consumer-verification"
    title: "A verifier checks provenance against its expectations, as far as this source defines verification"
    locator: "§1, §2, §4.2, §4.3, §4.5, §4.7, §5"
    kind_of_flow: "main"
    participants:
      - "verifier"
    summary: >-
      A local procedure, most of it delegated: §5 is a pointer to Verifying Artifacts. What this
      source does fix is that only specific signer-builder pairs are acceptable, that builder.id
      alone is meant to fix the Build level and stands behind the accuracy of the
      BuildDefinition, that externalParameters must be verified and unrecognized or unexpected
      fields in them rejected, and that internalParameters need no verification. The guarded
      version is state-machine.yaml M01.
    order_note: >-
      The source orders nothing here. This model puts the signer-builder pair and builder.id first,
      because builder.id is what vouches for the BuildDefinition's accuracy and completeness
      (L258-259), which are worth nothing until the builder is trusted; that ordering is inferred.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "Statement"
        message_defined_in_source: "yes"
        action: "Establish who signed the attestation. Outside this source; step 2 needs the result."
        locator: "§4.5"
        kind: "inferred"
        inferred_reason: "The pair check (step 2) needs the signer's identity; how it is established is not in this source."
        on_error: "opaque: an envelope or signature failure belongs to the in-toto attestation framework and Verifying Artifacts"
        on_error_basis: "opaque"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "Builder"
        message_defined_in_source: "yes"
        action: "Accept the attestation only if (signer, runDetails.builder.id) is one of the pairs the verifier accepts."
        locator: "§4.5"
        kind: "stated"
        quotes:
          - source_lines: "496-499"
            quote: |-
              Consumers MUST accept only specific signer-builder pairs. For example, "GitHub" can sign provenance for the "GitHub Actions" builder, and "Google" can sign provenance for the "Google Cloud Build" builder, but "GitHub" cannot sign for the "Google Cloud Build" builder.
        constrained_by:
          - "slsa-provenance-1-2#R-0039"
        on_error: "A pair outside the accepted set is not accepted: reject."
        on_error_basis: "stated"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "Builder"
        message_defined_in_source: "yes"
        action: >-
          Read the SLSA Build level from builder.id, which is meant to determine it alone; how is
          step 1 of Verifying Artifacts. builder.id also stands behind the accuracy and completeness
          of the BuildDefinition.
        locator: "§4.2, §4.5"
        kind: "stated"
        quotes:
          - source_lines: "449-451"
            quote: |-
              This is [intended](verifying-artifacts#step-1-check-slsa-build-level) to be the sole determiner of the SLSA Build level.
          - source_lines: "258-259"
            quote: |-
              The accuracy and completeness are implied by `runDetails.builder.id`.
        constrained_by:
          - "slsa-provenance-1-2#R-0108"
          - "slsa-provenance-1-2#R-0078"
          - "slsa-provenance-1-2#R-0164"
        on_error: "opaque: a level below what the verifier expects is handled by Verifying Artifacts"
        on_error_basis: "opaque"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "BuildDefinition"
        message_defined_in_source: "yes"
        action: "Check buildType is one the verifier holds expectations for; the buildType says how to read the parameters."
        locator: "§4.3"
        kind: "inferred"
        inferred_reason: >-
          The buildType governs how parameters are interpreted (L280-281) and consumers should hold
          an expectation (L299-300); a check that the buildType is known is not stated.
        quotes:
          - source_lines: "280-281"
            quote: |-
              Identifies the template for how to perform the build and interpret the parameters and dependencies.
        constrained_by:
          - "slsa-provenance-1-2#R-0017"
          - "slsa-provenance-1-2#R-0082"
        on_error: "With no expectation for the buildType, externalParameters cannot be verified as step 5 requires; reject (inferred)."
        on_error_basis: "inferred"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "BuildDefinition"
        message_defined_in_source: "yes"
        action: >-
          Verify externalParameters against the expectation, rejecting any field in them that is
          unrecognized or unexpected. The more there is to check the harder this is, which is why
          §4.3 asks platforms to keep externalParameters small (F01 step 6).
        locator: "§2, §4.3"
        kind: "stated"
        quotes:
          - source_lines: "73-75"
            quote: |-
              In SLSA, these values are untrusted; they MUST be included in the provenance and MUST be verified downstream.
          - source_lines: "299-300"
            quote: |-
              Consumers SHOULD have an expectation of what "good" looks like; the more information that they need to check, the harder that task becomes.
          - source_lines: "302-303"
            quote: |-
              Verifiers SHOULD reject unrecognized or unexpected fields within `externalParameters`.
        constrained_by:
          - "slsa-provenance-1-2#R-0005"
          - "slsa-provenance-1-2#R-0017"
          - "slsa-provenance-1-2#R-0018"
          - "slsa-provenance-1-2#R-0166"
        on_error: >-
          stated: an unrecognized or unexpected field is rejected (SHOULD). A value that differs
          from the expectation fails the MUST of L74-75; what follows is Verifying Artifacts'
          (opaque). An unrecognized extension field here meets SD-5.
        on_error_basis: "stated"
      - n: "6"
        from: "verifier"
        to: "verifier"
        message: "BuildDefinition"
        message_defined_in_source: "yes"
        action: "Leave internalParameters unverified: the platform is already trusted, and checking them is often impractical."
        locator: "§2, §4.3"
        kind: "stated"
        quotes:
          - source_lines: "77-79"
            quote: |-
              In SLSA, these values are trusted because the platform is trusted; they are OPTIONAL and need not be verified downstream.
          - source_lines: "311-313"
            quote: |-
              There is no need to [verify][Verification] these parameters because the build platform is already trusted, and in many cases it is not practical to do so.
        constrained_by:
          - "slsa-provenance-1-2#R-0006"
          - "slsa-provenance-1-2#R-0087"
          - "slsa-provenance-1-2#R-0062"
        on_error: "none: nothing is checked"
        on_error_basis: "stated"
      - n: "7"
        from: "verifier"
        to: "verifier"
        message: "ResourceDescriptor"
        message_defined_in_source: "yes"
        action: "Optionally analyse the supply chain recursively through resolvedDependencies. The purpose is stated; no procedure is."
        locator: "§4.3"
        kind: "inferred"
        inferred_reason: >-
          The source states the purpose of resolvedDependencies (L391-392), not that
          a verifier, or anyone, performs the analysis (pass 2: was kind stated).
        quotes:
          - source_lines: "391-392"
            quote: |-
              The purpose of `resolvedDependencies` is to facilitate recursive analysis of the software supply chain.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from: "verifier"
        to: "verifier"
        message: "Provenance"
        message_defined_in_source: "yes"
        action: >-
          Decide ALLOW or DENY. Ignoring an unrecognized extension field is safe only because
          extensions are meant to be monotonic: dropping or ignoring one should never turn a DENY
          into an ALLOW.
        locator: "§4.7"
        kind: "inferred"
        inferred_reason: "The source names DENY and ALLOW only inside the monotonic principle; the decision itself belongs to Verifying Artifacts."
        quotes:
          - source_lines: "551-553"
            quote: |-
              Extension fields SHOULD follow the [monotonic principle][parsing rules], meaning that deleting or ignoring the extension SHOULD NOT turn a DENY decision into an ALLOW.
        constrained_by:
          - "slsa-provenance-1-2#R-0047"
        on_error: "opaque"
        on_error_basis: "opaque"
      - n: "9"
        from: "verifier"
        to: "verifier"
        message: "Statement"
        message_defined_in_source: "yes"
        action: "Everything else in verification is Verifying Artifacts, which §5 only points to. No check of the subject against an artifact appears in this source."
        locator: "§5"
        kind: "stated"
        quotes:
          - source_lines: "559-560"
            quote: |-
              Please see [Verifying Artifacts][Verification] for a detailed discussion of provenance verification.
        on_error: "opaque"
        on_error_basis: "opaque"
  - id: "F07"
    name: "rebuild"
    title: "Someone other than the platform rebuilds the artifact from its provenance"
    locator: "§1, §2, §4.3, §7"
    kind_of_flow: "main"
    participants:
      - "rebuilder"
      - "buildtype-author"
      - "dependency-host"
    summary: >-
      §1 names rebuilding as one of the two purposes of provenance and §4.3 asks the
      BuildDefinition to hold enough to initialize the build. The source gives no rebuild
      procedure and no rule for comparing the result; steps 3 and 6 are this model's.
    order_note: "inferred throughout"
    steps:
      - n: "1"
        from: "rebuilder"
        to: "rebuilder"
        message: "BuildDefinition"
        message_defined_in_source: "yes"
        action: "Read the BuildDefinition: all the build's inputs, and meant to be enough to start the build."
        locator: "§4.3"
        kind: "stated"
        quotes:
          - source_lines: "326-328"
            quote: |-
              The BuildDefinition describes all of the inputs to the build. It SHOULD contain all the information necessary and sufficient to initialize the build and begin execution.
        constrained_by:
          - "slsa-provenance-1-2#R-0021"
          - "slsa-provenance-1-2#R-0091"
        on_error: "unspecified by source (an insufficient BuildDefinition is not described)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "rebuilder"
        to: "buildtype-author"
        message: "buildType specification (the document the buildType URI resolves to)"
        message_defined_in_source: "no"
        action: "Resolve the buildType URI and follow its instructions for initiating the build from this BuildDefinition."
        locator: "§4.3"
        kind: "stated"
        quotes:
          - source_lines: "283-286"
            quote: |-
              The URI SHOULD resolve to a human-readable specification that includes: overall description of the build type; schema for `externalParameters` and `internalParameters`; unambiguous instructions for how to initiate the build given this BuildDefinition, and a complete example.
        constrained_by:
          - "slsa-provenance-1-2#R-0013"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "rebuilder"
        to: "dependency-host"
        message: "artifact fetch"
        message_defined_in_source: "no"
        action: "Fetch the resolvedDependencies by uri and check them by digest."
        locator: "§2, §4.3"
        kind: "inferred"
        inferred_reason: "resolvedDependencies records what was fetched, where known (L84-85); that a rebuilder fetches it again is not stated."
        quotes:
          - source_lines: "84-85"
            quote: |-
              The `resolvedDependencies` captures these dependencies, if known.
        constrained_by:
          - "slsa-provenance-1-2#R-0064"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "rebuilder"
        to: "rebuilder"
        message: "BuildDefinition"
        message_defined_in_source: "yes"
        action: "Use internalParameters where reproducing the build needs them; they may be present for that reason."
        locator: "§2, §4.3"
        kind: "stated"
        quotes:
          - source_lines: "310-311"
            quote: |-
              The values here MAY be necessary for reproducing the build.
          - source_lines: "79-80"
            quote: |-
              They MAY be included to enable reproducible builds, debugging, or incident response.
        constrained_by:
          - "slsa-provenance-1-2#R-0019"
          - "slsa-provenance-1-2#R-0007"
        on_error: "unspecified by source (absent internalParameters are not described as blocking)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "rebuilder"
        to: "rebuilder"
        message: "rebuild"
        message_defined_in_source: "no"
        action: "Run the build."
        locator: "§1"
        kind: "stated"
        quotes:
          - source_lines: "35"
            quote: |-
              Others can rebuild the artifact, if desired.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from: "rebuilder"
        to: "rebuilder"
        message: "Statement"
        message_defined_in_source: "yes"
        action: >-
          Compare the rebuilt artifacts' digests with the subject. Not stated: v1 dropped the
          reproducible flag, which is now implicit from builder.id (§7), and no comparison rule is
          given.
        locator: "§7"
        kind: "inferred"
        inferred_reason: "No comparison of a rebuild with the provenance is described."
        quotes:
          - source_lines: "631"
            quote: |-
              `metadata.reproducible`: Now implicit from `builder.id`.
        constrained_by:
          - "slsa-provenance-1-2#R-0157"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
  - id: "F08"
    name: "migration-from-v0.2"
    title: "Mapping v0.2 provenance (old) onto the v1 fields"
    locator: "§7"
    kind_of_flow: "transformation"
    participants:
      - "migrator"
    summary: >-
