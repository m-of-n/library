source:
  file: ".cache/slsa-provenance-1-2.txt"
  sha256: "1a3828724437a0fc24bb492bca6db28df114e318bbaace85cc9f75204035db55"
  lines: "704"
  built_from: >-
    distilled/render-source.py over spec/build-provenance.md (sha256
    182ab5cf823c374874136371466ba43f99f0a9ba87a8046757d26a2ed74854a0, record.yaml content.sha256,
    retrieved 2026-11-16) with spec/schema/provenance.cue spliced in at L125-172 and
