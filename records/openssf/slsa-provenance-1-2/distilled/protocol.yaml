  - id: "F04"
    name: "client-side-configuration"
    title: "Configuration evaluated by a client before the server sees it, and the two ways the source offers to keep it verifiable"
    locator: "§4.3 (guideline 5 and its footnote)"
    kind_of_flow: "variant of F03"
    participants:
      - "client"
      - "version-control"
      - "temporary-storage"
      - "build-platform"
      - "consumer"
    summary: >-
      When a client turns version-controlled configuration into something else (YAML into
      ephemeral JSON) before sending it, consumers can no longer trace the configuration back to
      version control unless the server can verify where it came from. The RECOMMENDED fix moves
      the reading of version control to the server. The alternative records a digest and leaves the
      link to version control to a separate provenance attestation, treating the client-side
      evaluation as a build of its own; the footnote then splits on whether the client sends the
      object itself or a location it uploaded the object to.
    order_note: "The two solutions are alternatives (alt A, alt B); B1 and B2 are alternatives inside B. Within each, the order is this model's."
    steps:
      - n: "1"
        from: "client"
        to: "version-control"
        message: "configuration read"
        message_defined_in_source: "no"
        action: "Read the version-controlled configuration."
        locator: "§4.3"
        kind: "inferred"
        inferred_reason: "The example's YAML is version-controlled (L375); that the client reads it from there is implied, not stated."
        quotes:
          - source_lines: "374-376"
            quote: |-
              When build configuration is evaluated client-side before being sent to the server, such as transforming version-controlled YAML into ephemeral JSON, some solution is needed to make [verification] practical.
        constrained_by:
          - "slsa-provenance-1-2#R-0159"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "client"
        to: "client"
        message: "evaluated configuration object"
        message_defined_in_source: "no"
        action: "Evaluate the configuration client-side, for example YAML into ephemeral JSON."
        locator: "§4.3"
        kind: "stated"
        quotes:
          - source_lines: "374-376"
            quote: |-
              When build configuration is evaluated client-side before being sent to the server, such as transforming version-controlled YAML into ephemeral JSON, some solution is needed to make [verification] practical.
          - source_lines: "376-379"
            quote: |-
              Consumers need a way to know what configuration is expected and the usual way to do that is to map it back to version control, but that is not possible if the server cannot verify the configuration's origins.
        constrained_by:
          - "slsa-provenance-1-2#R-0159"
        on_error: >-
          The source's own error path: when the server has no way to check where the
          configuration came from, consumers cannot trace it to version control, and verification
          is impractical unless one of the solutions below is used.
        on_error_basis: "stated"
      - n: "3"
        from: "client"
        to: "build-platform"
        message: "build request naming the configuration in version control"
        message_defined_in_source: "no"
        action: "alt A (RECOMMENDED): send the server a reference to the configuration rather than the evaluated object."
        locator: "§4.3"
        kind: "inferred"
        inferred_reason: "Implied by the server reading version control itself (step 4); the request is not described."
        quotes:
          - source_lines: "381-383"
            quote: |-
              Rearchitect the build platform to read configuration directly from version control, recording the server-verified URI in `externalParameters` and the digest in `resolvedDependencies`.
        constrained_by:
          - "slsa-provenance-1-2#R-0029"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "build-platform"
        to: "version-control"
        message: "configuration read"
        message_defined_in_source: "no"
        action: "alt A: the build platform reads the configuration directly from version control."
        locator: "§4.3"
        kind: "stated"
        quotes:
          - source_lines: "381-383"
            quote: |-
              Rearchitect the build platform to read configuration directly from version control, recording the server-verified URI in `externalParameters` and the digest in `resolvedDependencies`.
        constrained_by:
          - "slsa-provenance-1-2#R-0029"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "build-platform"
        to: "build-platform"
        message: "BuildDefinition"
        message_defined_in_source: "yes"
        action: "alt A: externalParameters get the URI the server verified; resolvedDependencies get the digest."
        locator: "§4.3"
        kind: "stated"
        quotes:
          - source_lines: "381-383"
            quote: |-
              Rearchitect the build platform to read configuration directly from version control, recording the server-verified URI in `externalParameters` and the digest in `resolvedDependencies`.
        constrained_by:
          - "slsa-provenance-1-2#R-0029"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from: "client"
        to: "client"
        message: "separate provenance attestation for the client-side evaluation"
        message_defined_in_source: "no"
        action: >-
          alt B: treat the client-side evaluation as a separate build, secured with SLSA in its own
          right (SHOULD, though hard on an untrusted workstation), whose provenance links the
