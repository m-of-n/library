      must be updated; the v0.2 invocation and configSource split into externalParameters,
      internalParameters and resolvedDependencies; three v1 fields with no v0.2 ancestor are null;
      buildConfig is replaced by a digest in one of two places or dropped; completeness and
      reproducible become implicit in builder.id.
