source_defects:
  - id: "SD-6"
    pass1_id: "SD-01"
    title: "The §7 MUST asks the updated buildType to describe inputArtifacts, a field that exists in neither version"
    locators:
      - "§7 (L582-583)"
      - "§4.3 (L315-318)"
      - "§8.2 (L651)"
    quotes:
      - source_lines: "582-583"
        quote: |-
          The `buildType` MUST be updated for v1.0 to describe how to // interpret `inputArtifacts`.
      - source_lines: "318"
        quote: |-
          Unordered collection of artifacts needed at build time.
      - source_lines: "651"
        quote: |-
          `materials` -> `resolvedDependencies` (slight change in semantics)
    description: >-
      inputArtifacts occurs once in the source, inside the pseudocode comment that carries the
      MUST. No v1 field has that name (§4.2 to §4.6), and §8.2 records the v0.2 materials field
      as renamed to resolvedDependencies, not to inputArtifacts. The MUST therefore names an
      object a migrator cannot find. resolvedDependencies, the v1 home of what v0.2 called
      materials, is the likeliest referent; that is this model's reading.
    consequence: "A buildType author cannot tell when the update the MUST requires is complete."
    modelled_as: "F02 step 6 and F08 step 1 carry the MUST as printed; M03.T06 notes it."
    constrained_by:
      - "slsa-provenance-1-2#R-0048"
  - id: "SD-5"
    pass1_id: "SD-02"
    title: "An unrecognized extension field inside externalParameters is to be both ignored and rejected"
    locators:
      - "§3 (L105)"
      - "§4.3 (L302-303)"
      - "§4.7 (L540-541, L547-553)"
    quotes:
      - source_lines: "105"
        quote: |-
          Consumers MUST ignore unrecognized fields unless otherwise noted.
      - source_lines: "302-303"
        quote: |-
          Verifiers SHOULD reject unrecognized or unexpected fields within `externalParameters`.
      - source_lines: "540-541"
        quote: |-
          Implementations MAY add extension fields to any JSON object to describe information that is not captured in a standard field.
      - source_lines: "547-550"
        quote: |-
          In other words, an attestation with an absent extension field MUST be interpreted identically to an attestation with an unrecognized (and thus ignored) extension field.
      - source_lines: "551-553"
        quote: |-
          Extension fields SHOULD follow the [monotonic principle][parsing rules], meaning that deleting or ignoring the extension SHOULD NOT turn a DENY decision into an ALLOW.
    description: >-
      Extension fields may go in any JSON object, externalParameters included. §4.7 requires an
      attestation carrying an unrecognized extension field to be read exactly as one without it,
      on the premise that unrecognized fields are ignored. Inside externalParameters that premise
      fails: §4.3 has verifiers reject unrecognized fields there, the only rule in this source
      that departs from ignoring them (a search for unrecogni, unexpected, ignor, reject and
      unknown finds no other), and so the case the unless otherwise noted of §3 leaves room for. A verifier following §4.3 therefore
      rejects the attestation with the field and may accept it without, so the two are not read
      identically, against the MUST of L547-550; and removing the field turns its DENY into an
      ALLOW, against the wording of the monotonic principle. The source does not say whether
      extension fields are exempt from §4.3's rejection or should stay out of externalParameters.
    consequence: >-
      Two conforming verifiers can disagree on the same attestation; a producer cannot know whether
      an extension field in externalParameters is safe to emit.
    modelled_as: "M02.T03 and M02.T06 both fire on this input, marked conflict SD-5."
    constrained_by:
      - "slsa-provenance-1-2#R-0009"
      - "slsa-provenance-1-2#R-0018"
      - "slsa-provenance-1-2#R-0043"
      - "slsa-provenance-1-2#R-0046"
      - "slsa-provenance-1-2#R-0047"
  - id: "SD-4"
    pass1_id: "SD-03"
    title: "No standard field name has an underscore, yet the Statement's own _type does"
    locators:
      - "§4.7 (L543-546)"
      - "§4.1 (L126-127)"
      - "§4.3 (L331-332)"
    quotes:
      - source_lines: "543-544"
        quote: |-
          Extension fields SHOULD use names of the form `<vendor>_<fieldname>`, e.g. `examplebuilder_isCodeReviewed`.
      - source_lines: "545-546"
        quote: |-
          Non-extension field names never contain an underscore.
      - source_lines: "126-127"
        quote: |-
          // Standard attestation fields: "_type": "https://in-toto.io/Statement/v1",
      - source_lines: "331-332"
        quote: |-
          Each is an arbitrary JSON object,
    description: >-
      §4.7 says field names other than extension fields never contain an underscore, which would
      let a reader classify any underscored name as an extension field. The claim holds for every
      field §4.2 to §4.6 define and fails for _type, a standard attestation field in §4.1's own
      summary, inside the Statement that §4.7's any JSON object also covers. The parameter objects
      are arbitrary JSON whose names the buildType defines (L331-332), so the rule either binds
      buildType authors or does not reach them; the source says neither.
    consequence: "A consumer classifying by underscore over the whole Statement misreads _type as an extension field."
    modelled_as: "M02 restricts the underscore test to predicate fields, a scoping this model supplies."
    constrained_by:
      - "slsa-provenance-1-2#R-0044"
open_issues:
  - id: "OI-01"
    text: >-
      An empty externalParameters reads the same as an unset one (§3), and externalParameters is
      REQUIRED for Build L1 (§4.3). A build with no external parameters therefore cannot show a
      present externalParameters, and the §7 mapping can produce one (OI-07). Whether REQUIRED means present-and-non-empty is not said.
    locator: "§3, §4.3, §7"
    quotes:
      - source_lines: "110"
        quote: |-
          Unset, null, and empty field values MUST be interpreted equivalently.
      - source_lines: "272"
        quote: |-
          REQUIRED for SLSA Build L1: `buildType`, `externalParameters`
  - id: "OI-02"
    text: >-
      REQUIRED is qualified for SLSA Build L1 in four of its six uses (L503-504 and L511 name no
      level); the source does not say what a consumer does with provenance missing such a field
      (M01.T08 is inferred).
    locator: "§4.2 to §4.5"
  - id: "OI-03"
    text: >-
      Producers are told to use the exact predicateType string, not the URL the specification is
      viewed at. A consumer's handling of a near miss (a version-specific URL, a trailing slash) is
      not stated; the in-toto rules may govern it and are outside this source.
    locator: "front matter"
    quotes:
      - source_lines: "20-21"
        quote: |-
          Always use the above string for `predicateType` rather than what is > in the URL bar.
  - id: "OI-04"
    text: >-
      The predicateType carries only the major version and resolves to the latest minor version,
      and no field records the minor version, so a consumer cannot tell which v1.x a document was
      written to. Harmless only while every minor version stays backwards compatible and
      monotonic, as §3 promises.
    locator: "front matter, §3"
    quotes:
      - source_lines: "108-109"
        quote: |-
          Minor version changes are always backwards compatible and "monotonic." Such changes do not update the `predicateType`.
  - id: "OI-05"
    text: >-
      builder.id's documentation lists fields the tenant-controlled build process generates without
      control-plane verification, the subject excepted. The source does not say why. One reading is
      that the subject is always taken from what the build outputs, and so may always come from the
      tenant side; then a verifier cannot learn from the documentation whether a given platform
      checks the subject.
    locator: "§4.5"
    quotes:
      - source_lines: "463-464"
        quote: |-
          Any fields that are generated by the tenant-controlled build process and not verified by the trusted control plane, except for the `subject`.
  - id: "OI-06"
    text: >-
      §1 recommends this predicate for satisfying SLSA v1.0's provenance requirements, in a v1.2
      page, through a relative link whose target is whatever requirements page sits beside
      this one in the release that serves it. Label and target can disagree.
    locator: "§1"
    quotes:
      - source_lines: "37-38"
        quote: |-
          This predicate is the RECOMMENDED way to satisfy the SLSA v1.0 [provenance requirements](requirements#provenance-generation).
  - id: "OI-07"
    text: >-
      The §7 pseudocode does not define its + (object merge, array append), nor the case of a v0.2
      provenance with no configSource, where the old.invocation.configSource expressions have no
      value. Read literally it then yields an entryPoint and a source with no value (unset under
      §3) and a resolvedDependencies entry with neither uri nor digest.
    locator: "§7"
    quotes:
      - source_lines: "586"
        quote: |-
          old.invocation.parameters + {
      - source_lines: "596-601"
        quote: |-
          old.materials + [ { "uri": old.invocation.configSource.uri, "digest": old.invocation.configSource.digest, } ]
  - id: "OI-08"
    text: >-
      finishedOn is when the build completed, and nothing records how it completed. Whether a failed
      build produces provenance, and how a consumer would tell, is not described.
    locator: "§4.6"
    quotes:
      - source_lines: "532"
        quote: |-
          The timestamp of when the build completed.
  - id: "OI-09"
    text: >-
      The change history goes from v1.0 to v1.2 with no v1.1 entry. The source does not say whether
      a v1.1 of this predicate exists; M03's trace records only what §8 lists.
    locator: "§8.1, §8.2"
  - id: "OI-10"
    text: >-
      The provenance model diagram (L45) is an image the rendering does not carry. Whatever it shows
      about roles and their relations is not extracted here.
    locator: "§2"
    quotes:
      - source_lines: "45"
        quote: |-
          ![Build Model](images/provenance-model.svg)
  - id: "OI-11"
    text: >-
      Whether the v1.0 release candidates already used predicateType https://slsa.dev/provenance/v1
      is not said. If they did, a v1 consumer meets candidate-era names (systemParameters, localName)
      as unrecognized fields and ignores them silently.
    locator: "§8.2"
    quotes:
      - source_lines: "671"
        quote: |-
          Renamed `systemParameters` (RC1 + RC2) -> `internalParameters` (final).
      - source_lines: "673"
        quote: |-
          Renamed `localName` (RC1) -> `name` (RC2).
  - id: "OI-12"
    text: >-
      A different signer identity per mode is only a SHOULD. Where modes share a signer, the
      signer-builder pair check separates them by builder.id alone, which a compromised less secure
      mode could claim; the source names this risk as the reason for the rule, not as a residue.
    locator: "§4.5"
    quotes:
      - source_lines: "453-456"
        quote: |-
          If a build platform has multiple modes of operations that have differing security attributes or SLSA Build levels, each mode MUST have a different `builder.id` and SHOULD have a different signer identity. This is to minimize the risk that a less secure mode compromises a more secure one.
