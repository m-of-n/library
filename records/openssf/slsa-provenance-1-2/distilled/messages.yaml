source: '.cache/slsa-provenance-1-2.txt (SLSA Build Provenance v1.2: spec/build-provenance.md at slsa-framework/slsa ae7fc76, with provenance.cue and provenance.proto spliced in by distilled/render-source.py). Line numbers count in that file; quotations are checked against it with bin/check-quotes.'
extracted: '2026-11-16'
extracted_by: 'FX-1 pass 1 (extract), schema+messages+examples agent, from the source only'
applicability: 'The document defines one JSON predicate (predicateType https://slsa.dev/provenance/v1): Provenance with BuildDefinition, RunDetails, Builder and BuildMetadata, plus an extension-field rule and a pseudocode mapping from v0.2. It draws, but does not define, the in-toto Statement around the predicate and the ResourceDescriptor, TypeURI and Timestamp types (in-toto, outside this source). No wire format other than JSON; the protobuf file is a summary.'
note: 'Conventions. (1) Every declared, described, also_described and quote entry is a {source_lines, quote} pair written by script from the cached source (bin/_source_text.span over the line range), never typed; a quote is the whole of its lines. (2) constrained_by lists slsa-provenance-1-2#R-NNNN ids selected by script from distilled/requirements.yaml by (source_lines, distinctive phrase) of the requirement text; the build raises when a selector matches zero or several requirements, and the resolved pairs were then read. Pass 1 could select only the skeleton ids R-0002 to R-0050; pass 2 (verify) added the ids the requirements lane appended (R-0051 to R-0170) wherever an entry relies on their text, emitted by script from the id table, and read every added pair. The recital in the front matter (R-0001) is not a requirement: it is listed once under excluded_ids and wired to no message or field. Where constrained_by is empty the entry says why in constrained_by_note. (3) required is a boolean; required_level names the level the source gives (REQUIRED for SLSA Build L1); an optional member is optional by omission from the required list unless a sentence says OPTIONAL. (4) null_or_empty_equivalent_to_unset records L110: true on every optional field; absent on a REQUIRED field because a required field rejects null and empty. (5) outside_source: true marks a structure or member this source draws but in-toto defines. (6) proto_number and proto_type are read by script from schema/provenance.verbatim.proto. (7) schema names the JSON pointer into schema/provenance-v1.derived.schema.json that carries the member. (8) SD-n marks a defect or tension in the source, never repaired; the ids are the canonical list in normative.md (pass 1 numbered this file''s own list SD-9 to SD-14, kept as pass1_id). (9) keyword_less_statements (pass 1: unwired_statements) lists text that binds but carries no BCP 14 keyword, which pass 1 could cite only by line; pass 2 gave each its requirement_ids from requirements.yaml.'
excluded_ids:
  - id: 'slsa-provenance-1-2#R-0001'
    reason: 'the RFC 2119 recital in the front matter defines how keywords are read; it is not a requirement on any message'
    source_lines: '25-27'
    quote: 'The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this document are to be interpreted as described in [RFC 2119](https://www.rfc-editor.org/rfc/rfc2119).'
encoding_rules:
  - id: 'ENC-01'
    rule: 'The provenance is always serialized as JSON with lowerCamelCase member names; the proto file is snake_case and protobuf tooling converts.'
    locator: '§4.1 (proto comment)'
    source_lines: '196-198'
    quote: '// NOTE: While file uses snake_case as per the Protocol Buffers Style Guide, the // provenance is always serialized using JSON with lowerCamelCase. Protobuf // tooling performs this case conversion automatically.'
    constrained_by:
      - 'slsa-provenance-1-2#R-0158'
    constrained_by_note: 'stated in a proto comment, without a keyword; the proto is informative and the text authoritative (L178-179), so the rule is carried as the inferred R-0158'
    detail: 'Checked by script: every proto field name converted to lowerCamelCase equals the schema property name (schema/check-schemas.derived.py, 22 fields). A snake_case member in JSON is therefore an unrecognized field, although protobuf''s own JSON parser also accepts the proto field name.'
  - id: 'ENC-02'
    rule: 'A field that is unset, null or empty is read the same way in all three cases (MUST, R-0010).'
    locator: '§3'
    source_lines: '110'
    quote: '- Unset, null, and empty field values MUST be interpreted equivalently.'
    constrained_by:
      - 'slsa-provenance-1-2#R-0010'
    detail: 'Consequence modelled in the schema: an optional field accepts null and its empty value; a REQUIRED field rejects both, being as good as absent. Literal reading of REQUIRED plus this rule makes an empty externalParameters object invalid (SD-7).'
  - id: 'ENC-03'
    rule: 'A consumer ignores a field it does not recognize, except where the page says otherwise (MUST, R-0009; the exception: SD-11).'
    locator: '§3'
    source_lines: '105'
    quote: '- Consumers MUST ignore unrecognized fields unless otherwise noted.'
    constrained_by:
      - 'slsa-provenance-1-2#R-0009'
      - 'slsa-provenance-1-2#R-0018'
      - 'slsa-provenance-1-2#R-0166'
    detail: 'No object in the schema closes additionalProperties. The one place the document notes otherwise is a verifier SHOULD (reject unrecognized or unexpected members of externalParameters, L302-303); the document does not link the two sentences (SD-11).'
  - id: 'ENC-04'
    rule: 'Extension fields: form <vendor>_<fieldname>; absent and unrecognized-and-ignored are interpreted identically.'
    locator: '§4.7'
    source_lines: '543-550'
    quote: '- Extension fields SHOULD use names of the form `<vendor>_<fieldname>`, e.g. `examplebuilder_isCodeReviewed`. This practice avoids field name collisions by namespacing each vendor. Non-extension field names never contain an underscore. - Extension fields MUST NOT alter the meaning of any other field. In other words, an attestation with an absent extension field MUST be interpreted identically to an attestation with an unrecognized (and thus ignored) extension field.'
    constrained_by:
      - 'slsa-provenance-1-2#R-0043'
      - 'slsa-provenance-1-2#R-0044'
      - 'slsa-provenance-1-2#R-0045'
      - 'slsa-provenance-1-2#R-0046'
      - 'slsa-provenance-1-2#R-0047'
      - 'slsa-provenance-1-2#R-0129'
      - 'slsa-provenance-1-2#R-0130'
      - 'slsa-provenance-1-2#R-0131'
  - id: 'ENC-05'
    rule: 'Timestamp fields are strings; the cue summary draws the form <YYYY>-<MM>-<DD>T<hh>:<mm>:<ss>Z and the proto type is google.protobuf.Timestamp.'
    locator: '§4.1, §4.6'
    source_lines: '172'
    quote: '#Timestamp: string // <YYYY>-<MM>-<DD>T<hh>:<mm>:<ss>Z'
    also:
      source_lines: '236-237'
      quote: 'google.protobuf.Timestamp started_on = 2; google.protobuf.Timestamp finished_on = 3;'
    constrained_by:
      - 'slsa-provenance-1-2#R-0125'
      - 'slsa-provenance-1-2#R-0127'
    constrained_by_note: 'no keyword; the field rows (R-0125, R-0127) type both times as the in-toto Timestamp (L525, L530), outside this source. The schema accepts the RFC 3339 shape with optional fraction and offset because the two summaries differ (SD-10).'
  - id: 'ENC-06'
    rule: 'The predicateType string includes the major version and changes on every backwards incompatible change; minor versions are backwards compatible and do not change it.'
    locator: '§3, preamble'
    source_lines: '106-109'
    quote: '- The `predicateType` URI includes the major version number and will always change whenever there is a backwards incompatible change. - Minor version changes are always backwards compatible and "monotonic." Such changes do not update the `predicateType`.'
    also:
      source_lines: '20-23'
      quote: '> Important: Always use the above string for `predicateType` rather than what is > in the URL bar. The `predicateType` URI will always resolve to the latest > minor version of this specification. See [parsing rules](#parsing-rules) for > more information.'
    constrained_by:
      - 'slsa-provenance-1-2#R-0052'
      - 'slsa-provenance-1-2#R-0170'
      - 'slsa-provenance-1-2#R-0070'
      - 'slsa-provenance-1-2#R-0071'
      - 'slsa-provenance-1-2#R-0072'
      - 'slsa-provenance-1-2#R-0160'
    constrained_by_note: 'no keyword: keyword_less_statements U-01 to U-03, wired in pass 2; R-0160 is the inferred consumer side'
