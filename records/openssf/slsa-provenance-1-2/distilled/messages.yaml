    kind: 'naming-rule (any JSON object)'
    encoding: 'any member of any JSON object of the predicate, name form <vendor>_<fieldname>'
    summary: 'Vendor extension members. They MAY appear in any JSON object; they MUST NOT alter what another field means, and SHOULD be monotonic (R-0045, R-0130, R-0131).'
    declared:
      source_lines: '540-541'
      quote: 'Implementations MAY add extension fields to any JSON object to describe information that is not captured in a standard field. Guidelines:'
    described:
      source_lines: '543-550'
      quote: '- Extension fields SHOULD use names of the form `<vendor>_<fieldname>`, e.g. `examplebuilder_isCodeReviewed`. This practice avoids field name collisions by namespacing each vendor. Non-extension field names never contain an underscore. - Extension fields MUST NOT alter the meaning of any other field. In other words, an attestation with an absent extension field MUST be interpreted identically to an attestation with an unrecognized (and thus ignored) extension field.'
