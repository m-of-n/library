        json_path: 'predicate.runDetails.builder.id'
        type: 'string'
        field_type: 'TypeURI'
        required: true
        required_level: 'SLSA Build L1'
        declared:
          source_lines: '446-447'
          quote: '<tr id="builder.id"><td><code>id</code> <td>string (<a href="https://github.com/in-toto/attestation/blob/7aefca35a0f74a6e0cb397a8c4a76558f54de571/spec/v1/field_types.md#typeuri">TypeURI</a>)<td>'
        described:
          source_lines: '449-451'
          quote: 'URI indicating the transitive closure of the trusted build platform. This is [intended](verifying-artifacts#step-1-check-slsa-build-level) to be the sole determiner of the SLSA Build level.'
        also_described:
          source_lines: '453-465'
          quote: 'If a build platform has multiple modes of operations that have differing security attributes or SLSA Build levels, each mode MUST have a different `builder.id` and SHOULD have a different signer identity. This is to minimize the risk that a less secure mode compromises a more secure one. The `builder.id` URI SHOULD resolve to documentation explaining: - The scope of what this ID represents. - The claimed SLSA Build level. - The accuracy and completeness guarantees of the fields in the provenance. - Any fields that are generated by the tenant-controlled build process and not verified by the trusted control plane, except for the `subject`. - The interpretation of any extension fields.'
        proto:
          proto_number: 1
        schema: 'provenance-v1.derived.schema.json#/$defs/TypeURI'
        constrained_by:
          - 'slsa-provenance-1-2#R-0035'
          - 'slsa-provenance-1-2#R-0036'
          - 'slsa-provenance-1-2#R-0037'
