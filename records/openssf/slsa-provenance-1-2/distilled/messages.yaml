  - id: 'MSG-05'
    name: 'Builder'
    locator: '§4.5'
    kind: 'json-object'
    encoding: 'JSON object; protobuf message slsa.v1.Builder'
    summary: 'The build platform: everything trusted, transitively, to carry out the build and write its provenance.'
    declared:
      source_lines: '228-232'
      quote: 'message Builder { string id = 1; map<string, string> version = 2; repeated ResourceDescriptor builder_dependencies = 3; }'
    described:
      source_lines: '481-487'
      quote: 'The build platform, or <dfn>builder</dfn> for short, represents the transitive closure of all the entities that are, by necessity, [trusted] to faithfully run the build and record the provenance. This includes not only the software but the hardware and people involved in running the service. For example, a particular instance of [Tekton](https://tekton.dev/) could be a build platform, while Tekton itself is not. For more info, see [Build model](terminology#build-model).'
    required_statement:
      source_lines: '441'
      quote: 'REQUIRED for SLSA Build L1: `id`'
      constrained_by:
        - 'slsa-provenance-1-2#R-0035'
    schema: 'provenance-v1.derived.schema.json#/$defs/Builder'
