source_defects:
  - id: 'SD-9'
    pass1_id: 'SD-01'
    title: 'The cue summary draws every member as present; the text names which are required'
    source_lines: '116-117'
    quote: '*NOTE: This summary (in cue) is informative. In the event of a disagreement with the text description, the text is authoritative.*'
    also:
      source_lines: '250'
      quote: 'REQUIRED for SLSA Build L1: `buildDefinition`, `runDetails`'
    detail: 'The cue and proto are informative and the text authoritative (L116-117, L178-179). Taken alone the cue reads every member, internalParameters and byproducts included, as required. The derived schema follows the text: only the members the tables mark REQUIRED for SLSA Build L1 are required. Optionality of every other member is by omission from those lists; only internalParameters is called OPTIONAL in words (L78).'
  - id: 'SD-7'
    pass1_id: 'SD-02'
    title: 'REQUIRED plus empty-equals-unset makes an empty externalParameters invalid'
    source_lines: '110'
    quote: '- Unset, null, and empty field values MUST be interpreted equivalently.'
    also:
      source_lines: '272'
      quote: 'REQUIRED for SLSA Build L1: `buildType`, `externalParameters`'
    detail: 'L110 says unset, null and empty are interpreted equivalently; L272 makes externalParameters REQUIRED. A build with no external parameters therefore has no valid provenance on the literal reading, which cannot be the intent but is not repaired by the text. The schema takes the literal reading (minProperties 1) and tags its one test, R-014, ambiguous.'
  - id: 'SD-10'
    pass1_id: 'SD-03'
    title: 'Timestamp: cue comment, proto type and in-toto type differ in what they admit'
    source_lines: '172'
    quote: '#Timestamp: string // <YYYY>-<MM>-<DD>T<hh>:<mm>:<ss>Z'
    also:
      source_lines: '236-237'
      quote: 'google.protobuf.Timestamp started_on = 2; google.protobuf.Timestamp finished_on = 3;'
    detail: 'The cue comment draws the Z form with whole seconds; google.protobuf.Timestamp carries nanoseconds and its JSON form accepts offsets; the text defers to the in-toto Timestamp type (L525), outside this source. The schema accepts the RFC 3339 shape with optional fraction and offset (tests tagged ambiguous).'
  - id: 'SD-11'
    pass1_id: 'SD-04'
    title: 'Parsing rule ''unless otherwise noted'' has no linked exception'
    source_lines: '105'
    quote: '- Consumers MUST ignore unrecognized fields unless otherwise noted.'
    also:
      source_lines: '302-303'
      quote: 'Verifiers SHOULD reject unrecognized or unexpected fields within `externalParameters`.'
    detail: 'The only sentence in the document that treats unrecognized fields differently is a verifier SHOULD about externalParameters; nothing says it is the exception (R-0166 records, as inferred, that it is). Both are kept: the schema ignores unknown members everywhere, and the verifier SHOULD is a policy outside the schema.'
  - id: 'SD-4'
    pass1_id: 'SD-05'
    title: 'Extension-field rule says any JSON object, but several objects hold data keys'
    source_lines: '540-541'
    quote: 'Implementations MAY add extension fields to any JSON object to describe information that is not captured in a standard field. Guidelines:'
    also:
      source_lines: '545-546'
      quote: 'by namespacing each vendor. Non-extension field names never contain an underscore.'
    detail: 'externalParameters, internalParameters, annotations, digest and version hold keys that are data (parameter names, algorithm names, component names). The no-underscore rule for standard names cannot apply to them, and a parameter name with an underscore is legitimate. The source does not say which objects are meant.'
  - id: 'SD-6'
    pass1_id: 'SD-06'
    title: 'Migration comment names inputArtifacts, which is defined nowhere in this document'
    source_lines: '582-583'
    quote: '// The `buildType` MUST be updated for v1.0 to describe how to // interpret `inputArtifacts`.'
    detail: 'The pseudocode requires an updated buildType that explains inputArtifacts (MUST). The term occurs once in the source; it is not a v1 field, and v0.2 is a different document. The instruction is therefore not testable from this source.'
  - id: 'SD-12'
    pass1_id: 'SD-07'
    title: 'Migration pseudocode leaves collisions and absent inputs undefined'
    source_lines: '585-601'
    quote: '"externalParameters": old.invocation.parameters + { // It is RECOMMENDED to rename "entryPoint" to something more // descriptive. "entryPoint": old.invocation.configSource.entryPoint, // It is OPTIONAL to rename "source" to something more descriptive, // especially if "source" is ambiguous or confusing. "source": old.invocation.configSource.uri, }, "internalParameters": old.invocation.environment, "resolvedDependencies": old.materials + [ { "uri": old.invocation.configSource.uri, "digest": old.invocation.configSource.digest, } ]'
    detail: 'The plus operator is object union on externalParameters and array concatenation on resolvedDependencies, neither JavaScript semantics. If old.invocation.parameters already has an entryPoint or source key, which value wins is not stated. If old.invocation.configSource is absent, the added descriptor and the two added parameters have no defined value. examples/reproduce.py omits absent members (JavaScript undefined) and lets the added keys win; both are derived choices.'
  - id: 'SD-8'
    pass1_id: 'SD-08'
    title: 'Section 4.5 says the field is REQUIRED without saying which'
    source_lines: '503-504'
    quote: 'in the GitHub Actions example above. The field is REQUIRED, even if it is implicit from the signer, to aid readability and debugging. It is an object to'
    also:
      source_lines: '441'
      quote: 'REQUIRED for SLSA Build L1: `id`'
    detail: 'The sentence sits in the builder.id section but its rationale (L501-505, it is an object) is about builder. L407 makes builder required in RunDetails and L441 makes id required in Builder, so both are required either way.'
  - id: 'SD-13'
    pass1_id: 'SD-09'
    title: 'The proto is not the code-generation proto'
    source_lines: '183-186'
    quote: '*NOTE: This protobuf definition prioritizes being a human-readable summary of the schema for readers of the specification. A version of the protobuf definition useful for code generation is maintained in the [in-toto attestation] repository.*'
    detail: 'The source says this protobuf favours readability and that a version fit for code generation is kept in in-toto''s attestation repository. The verbatim proto compiles under protoc from a scratch install of grpcio-tools (pass 1, replayed in pass 2; schema/README.md), which does not make it that file.'
  - id: 'SD-14'
    pass1_id: 'SD-10'
    title: 'Only L1 and L3 are mentioned for field requirements'
    source_lines: '250'
    quote: 'REQUIRED for SLSA Build L1: `buildDefinition`, `runDetails`'
    also:
      source_lines: '293-295'
      quote: 'tenant of the build platform. They MUST be complete at SLSA Build L3, meaning that there is no additional mechanism for an external party to influence the build. (At lower SLSA Build levels, the completeness MAY be best effort.)'
    detail: 'Every REQUIRED label but BuildMetadata''s empty one says for SLSA Build L1; the only L3-specific requirement on this page is the completeness of externalParameters (L293-295), and resolvedDependencies stays best effort through L3 (L318-319, L393-394). What a provenance must carry at L2 and L3 beyond the L1 list is in the SLSA requirements page, outside this source. The schema is the L1 profile and is read as cumulative.'
