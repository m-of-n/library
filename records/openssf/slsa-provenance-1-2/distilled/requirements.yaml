requirements:
  - id: 'slsa-provenance-1-2#R-0001'
    locator: 'front matter'
    source_lines: '25-27'
    text: 'The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this document are to be interpreted as described in [RFC 2119](https://www.rfc-editor.org/rfc/rfc2119).'
    verb: 'none'
    kind: stated
    status: 'withdrawn'
    actor: 'none (recital)'
    object: 'the meaning of the BCP 14 keywords in this document'
    field: 'none'
    testable: 'no'
    testable_reason: 'withdrawn: the recital names the ten keywords and constrains nothing.'
    withdrawn_reason: 'Lines 25-27 are the RFC 2119 recital. It names all ten keywords and uses none, so it is not a requirement (docs/requirements.md §1), and bin/bcp14-count strips it from the source count. bin/fx1-skeleton minted the id because the boilerplate pattern it shares with bin/bcp14-count (_BOILERPLATE in bin/_bcp14.py) ends at the first full stop after the recital''s closing words, which here falls inside the link URL (www.), so the matched span is shorter than the sentence and the sentence was kept. Kept with status withdrawn so the id never retargets (docs/requirements.md §3b); its 10 keywords stay in the extracted count, because bin/validate counts every non-split entry text: see reconciliation.'
    note: 'The recital cites RFC 2119 only, not RFC 8174. The source holds no lowercase must, shall, should, may, required, recommended or optional (counted by script), so the difference changes nothing here.'
  - id: 'slsa-provenance-1-2#R-0002'
    locator: '§1'
    source_lines: '37-38'
    text: 'This predicate is the RECOMMENDED way to satisfy the SLSA v1.0 [provenance requirements](requirements#provenance-generation).'
    verb: 'RECOMMENDED'
    kind: stated
    actor: 'build platform (provenance producer)'
    object: 'the format of provenance meant to meet the SLSA provenance requirements: this predicate'
    field: 'predicateType (in-toto Statement)'
    testable: 'partial'
    testable_reason: 'whether a provenance uses this predicate is checkable by its predicateType (R-0051); RECOMMENDED leaves other formats conforming, and the requirements it serves are on another page of SLSA v1.2 (Requirements), outside this source.'
    note: 'Names them the SLSA v1.0 provenance requirements on a v1.2 page (SD-1).'
  - id: 'slsa-provenance-1-2#R-0003'
    locator: '§2'
    source_lines: '59-61'
    text: '- The build platform implementer SHOULD define a security model for the build platform in order to clearly identify the platform''s boundaries, actors, and interfaces.'
    verb: 'SHOULD'
    kind: stated
    actor: 'build platform implementer'
    object: 'a security model of the build platform: its boundaries, actors and interfaces'
    field: 'none'
    testable: 'no'
    testable_reason: 'a design and documentation duty: no provenance or build output shows whether the model exists, and the page sets no criterion for it.'
    note: 'Its use is R-0004; its published result is the builder.id documentation (R-0037).'
  - id: 'slsa-provenance-1-2#R-0004'
    locator: '§2'
    source_lines: '61-63'
    text: 'This model SHOULD then be used to identify the transitive closure of the trusted build platform for the `builder.id` as well as the trusted control plane.'
    verb: 'SHOULD'
    kind: stated
    actor: 'build platform implementer'
    object: 'the scope of builder.id and of the trusted control plane, derived from the security model'
    field: 'runDetails.builder.id'
    testable: 'no'
    testable_reason: 'how the scope was derived is a design step no provenance shows; what it yields is documented under R-0037.'
  - id: 'slsa-provenance-1-2#R-0005'
    locator: '§2'
    source_lines: '73-75'
    text: 'In SLSA, these values are untrusted; they MUST be included in the provenance and MUST be verified downstream.'
    verb: 'MUST'
    kind: stated
    actor: 'build platform (provenance producer); downstream verifier'
    object: 'externalParameters values'
    field: 'buildDefinition.externalParameters'
    testable: 'partial'
    testable_reason: 'split: tested through R-0058 (partial) and R-0059 (partial).'
    note: 'Two duties on two actors in one sentence. SD-2: R-0028 has some external parameters excluded.'
  - id: 'slsa-provenance-1-2#R-0006'
    locator: '§2'
    source_lines: '77-79'
    text: 'In SLSA, these values are trusted because the platform is trusted; they are OPTIONAL and need not be verified downstream.'
    verb: 'OPTIONAL'
    kind: stated
    actor: 'build platform (provenance producer); downstream verifier'
    object: 'internalParameters values'
    field: 'buildDefinition.internalParameters'
    testable: 'no'
    testable_reason: 'split: R-0061 and R-0062 are both permissions; the receiving side''s duty is R-0161.'
  - id: 'slsa-provenance-1-2#R-0007'
    locator: '§2'
    source_lines: '79-80'
    text: 'They MAY be included to enable reproducible builds, debugging, or incident response.'
    verb: 'MAY'
    kind: stated
    actor: 'build platform (provenance producer)'
    object: 'internalParameters values, recorded for reproducible builds, debugging or incident response'
    field: 'buildDefinition.internalParameters'
    testable: 'no'
    testable_reason: 'a permission, the one R-0061 already gives: including and omitting both conform; the receiving side''s duty is R-0161.'
  - id: 'slsa-provenance-1-2#R-0008'
    locator: '§2'
    source_lines: '92-94'
    text: 'Such communication SHOULD NOT influence the definition of the build; if it does, it SHOULD go in `resolvedDependencies` instead.'
    verb: 'SHOULD NOT'
    kind: stated
    actor: 'build platform'
    object: 'communication of the build process with the control plane or build caches during execution'
    field: 'buildDefinition.resolvedDependencies'
    testable: 'partial'
    testable_reason: 'split: R-0066 (no), R-0067 (partial).'
  - id: 'slsa-provenance-1-2#R-0009'
    locator: '§3'
    source_lines: '105'
    text: '- Consumers MUST ignore unrecognized fields unless otherwise noted.'
    verb: 'MUST'
    kind: stated
    actor: 'consumer'
    object: 'fields the consumer does not recognize'
    field: 'any field of the predicate, extension fields (§4.7) included'
    testable: 'yes'
    note: 'One of the four bullets summarizing the in-toto attestation parsing rules, which this predicate follows (R-0069; the rules themselves are outside this source). The one exception this page notes is R-0018, within externalParameters (R-0166). Test: a consumer''s decision does not change when an unrecognized field is added outside externalParameters. R-0046 and the monotonic principle (R-0047) assume this behaviour.'
  - id: 'slsa-provenance-1-2#R-0010'
    locator: '§3'
    source_lines: '110'
    text: '- Unset, null, and empty field values MUST be interpreted equivalently.'
    verb: 'MUST'
    kind: stated
    actor: 'consumer'
    object: 'field values that are unset, null or empty'
    field: 'every field'
    testable: 'yes'
    note: 'Test: a field absent, set to null, and set to an empty value (an empty object, array or string; reading empty as all three is ours) gives one decision. The §7 pseudocode writes null for the three fields v0.2 lacked (R-0145, R-0146, R-0150), which this makes the same as omitting them. With the field annotations, an empty required field reads as missing (SD-7).'
  - id: 'slsa-provenance-1-2#R-0011'
    locator: '§4.2'
    source_lines: '250'
    text: 'REQUIRED for SLSA Build L1: `buildDefinition`, `runDetails`'
    verb: 'REQUIRED'
    kind: stated
    actor: 'build platform (provenance producer), for provenance at SLSA Build L1 or above'
    object: 'the Provenance predicate'
    field: 'buildDefinition; runDetails'
    testable: 'yes'
    note: 'Both members set, neither null nor empty (R-0010). Consumer side: R-0162. Types: R-0076, R-0079.'
  - id: 'slsa-provenance-1-2#R-0012'
    locator: '§4.3'
    source_lines: '272'
    text: 'REQUIRED for SLSA Build L1: `buildType`, `externalParameters`'
    verb: 'REQUIRED'
    kind: stated
    actor: 'build platform (provenance producer), for provenance at SLSA Build L1 or above'
    object: 'BuildDefinition'
    field: 'buildDefinition.buildType; buildDefinition.externalParameters'
    testable: 'yes'
    note: 'An empty externalParameters reads as unset under R-0010 (SD-7). Consumer side: R-0162. Types: R-0081, R-0083.'
  - id: 'slsa-provenance-1-2#R-0013'
    locator: '§4.3'
    source_lines: '283-286'
    text: 'The URI SHOULD resolve to a human-readable specification that includes: overall description of the build type; schema for `externalParameters` and `internalParameters`; unambiguous instructions for how to initiate the build given this BuildDefinition, and a complete example.'
    verb: 'SHOULD'
    kind: stated
    actor: 'buildType author (whoever defines the build type)'
    object: 'the document the buildType URI resolves to: what the build type is, the schemas of both parameter objects, how to start the build from a BuildDefinition, and a full example'
    field: 'buildDefinition.buildType'
    testable: 'partial'
    testable_reason: 'that the URI resolves to a human-readable page is checkable and the four contents can be reviewed; unambiguous is a judgement.'
    note: 'R-0026 adds a fifth content. §6 indexes two such documents (C-0050, C-0051, rejected as an index).'
  - id: 'slsa-provenance-1-2#R-0014'
    locator: '§4.3'
    source_lines: '293-295'
    text: 'They MUST be complete at SLSA Build L3, meaning that there is no additional mechanism for an external party to influence the build.'
    verb: 'MUST'
    kind: stated
    actor: 'build platform at SLSA Build L3'
    object: 'completeness of externalParameters: an external party has no other way to influence the build'
    field: 'buildDefinition.externalParameters'
    testable: 'partial'
    testable_reason: 'an audit of the platform can find an uncaptured external input but never prove there is none, and the provenance alone shows neither.'
    note: 'They is externalParameters: the sentence follows its definition (R-0084).'
  - id: 'slsa-provenance-1-2#R-0015'
    locator: '§4.3'
    source_lines: '295'
    text: '(At lower SLSA Build levels, the completeness MAY be best effort.)'
    verb: 'MAY'
    kind: stated
    actor: 'build platform below SLSA Build L3'
    object: 'completeness of externalParameters'
    field: 'buildDefinition.externalParameters'
    testable: 'no'
    testable_reason: 'a permission: below L3 an incomplete externalParameters conforms.'
  - id: 'slsa-provenance-1-2#R-0016'
    locator: '§4.3'
    source_lines: '297-298'
    text: 'The build platform SHOULD be designed to minimize the size and complexity of `externalParameters`, in order to reduce fragility and ease [verification].'
    verb: 'SHOULD'
    kind: stated
    actor: 'build platform (designer)'
    object: 'how large and complex externalParameters is'
    field: 'buildDefinition.externalParameters'
    testable: 'no'
    testable_reason: 'a design goal with no threshold.'
    note: 'The rejected guideline C-0027 points the same way.'
  - id: 'slsa-provenance-1-2#R-0017'
    locator: '§4.3'
    source_lines: '299-300'
    text: 'Consumers SHOULD have an expectation of what "good" looks like; the more information that they need to check, the harder that task becomes.'
    verb: 'SHOULD'
    kind: stated
    actor: 'consumer'
    object: 'the consumer''s expectations (policy) for externalParameters'
    field: 'buildDefinition.externalParameters'
    testable: 'partial'
    testable_reason: 'whether a verifier can be given expected values is checkable; whether a consumer holds the right expectation is not. The form expectations take is SLSA Verifying Artifacts'' business (outside this source).'
  - id: 'slsa-provenance-1-2#R-0018'
    locator: '§4.3'
    source_lines: '302-303'
    text: 'Verifiers SHOULD reject unrecognized or unexpected fields within `externalParameters`.'
    verb: 'SHOULD'
    kind: stated
    actor: 'verifier'
    object: 'members of externalParameters the verifier does not recognize or does not expect'
    field: 'buildDefinition.externalParameters'
    testable: 'yes'
    note: 'The exception to R-0009 (R-0166). Unrecognized reads against the buildType''s schema for externalParameters (R-0013), unexpected against the verifier''s expectations (R-0017). An extension field placed in externalParameters is rejected here rather than ignored (SD-5). Test: a provenance whose externalParameters gains one member outside the verifier''s expectations is rejected.'
  - id: 'slsa-provenance-1-2#R-0019'
    locator: '§4.3'
    source_lines: '310-311'
    text: 'The values here MAY be necessary for reproducing the build.'
    verb: 'MAY'
    kind: stated
    actor: 'none (a statement of possibility)'
    object: 'internalParameters values'
    field: 'buildDefinition.internalParameters'
    testable: 'no'
    testable_reason: 'MAY here says the values might be needed to reproduce the build: it grants and requires nothing (SD-3).'
  - id: 'slsa-provenance-1-2#R-0020'
    locator: '§4.3'
    source_lines: '319-322'
    text: 'For example, if the build script fetches and executes "example.com/foo.sh", which in turn fetches "example.com/bar.tar.gz", then both "foo.sh" and "bar.tar.gz" SHOULD be listed here.'
    verb: 'SHOULD'
    kind: stated
    actor: 'build platform (provenance producer)'
    object: 'artifacts fetched during the build, including those fetched by code the build fetched'
    field: 'buildDefinition.resolvedDependencies'
    testable: 'partial'
    testable_reason: 'the case it names is testable in a controlled build (a fetched script that fetches a second file: both are listed); the list is best effort (R-0090) and never shown complete.'
