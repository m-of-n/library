    kind: stated
    actor: 'buildType author; build platform'
    object: 'structure of externalParameters and internalParameters'
    field: 'buildDefinition.externalParameters; buildDefinition.internalParameters'
    testable: 'partial'
    testable_reason: 'split: R-0093 (yes), R-0094 (partial).'
  - id: 'slsa-provenance-1-2#R-0023'
    locator: '§4.3'
    source_lines: '333-334'
    text: 'The same field name SHOULD NOT be used for both `externalParameters` and `internalParameters`.'
    verb: 'SHOULD NOT'
    kind: stated
    actor: 'buildType author; build platform'
    object: 'member names used in both externalParameters and internalParameters'
    field: 'buildDefinition.externalParameters; buildDefinition.internalParameters'
    testable: 'yes'
