  - id: 'slsa-provenance-1-2#R-0021'
    locator: '§4.3'
    source_lines: '326-328'
    text: 'It SHOULD contain all the information necessary and sufficient to initialize the build and begin execution.'
    verb: 'SHOULD'
    kind: stated
    actor: 'build platform (provenance producer)'
    object: 'BuildDefinition: enough on its own to start the build, with nothing missing'
    field: 'buildDefinition'
    testable: 'partial'
    testable_reason: 'a platform that can start a build from a BuildDefinition alone can be tested by doing so; sufficiency in general is not shown by the document.'
    note: 'The rejected guideline C-0030 is the design route to it.'
  - id: 'slsa-provenance-1-2#R-0022'
    locator: '§4.3'
    source_lines: '331-333'
    text: 'Each is an arbitrary JSON object, though it is RECOMMENDED to keep the structure simple with string values to aid verification.'
