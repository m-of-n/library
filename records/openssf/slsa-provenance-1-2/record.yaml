  note: "Source of record moved 2026-11-16 (library#136) from the rendered page https://slsa.dev/spec/v1.2/build-provenance (sha256 04a97c9b... on 2026-11-01 and 2026-11-04) to the Markdown it is built from, pinned: slsa-framework/slsa branch releases/v1.2 at ae7fc76 (2026-04-14), the same commit slsa-1-2 extracts; spec/build-provenance.md last changed at 34e26a0 (2026-03-04, 'Migrate v1.2 to its own branch'). Reason: the site regenerates every page on any repository commit, so the HTML digest no longer matched by 2026-11-16 (6e522491...) with no change to the specification; a check found the same 63 BCP 14 keywords in the live page's text and in this file, and every keyword line present but for markup. The page inlines two files by Jekyll include_relative, recorded here by digest and spliced in by distilled/render-source.py: spec/schema/provenance.cue (sha256 0ddd0037...2ea6145) and spec/schema/provenance.proto (sha256 ea548207...fc41de), both at the same commit. The recorded URL, /spec/v1.2/provenance, is now a two-paragraph hub pointing at Build provenance and Source provenance. The title and version were corrected: the page's own change history has a v1.2 entry and no v1.1 entry. Date is the SLSA 1.2 release, confirmed 2026-11-04 against the slsa.dev blog post \"Announcing SLSA v1.2\" (24 Nov 2025); the page carries no date of its own. Status on the page: Approved, the stable stage in SLSA's own spec-stages definitions (slsa.dev/spec-stages), which is the basis for maturity: standard."
