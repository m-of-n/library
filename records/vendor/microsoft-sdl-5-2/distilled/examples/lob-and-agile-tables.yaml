source: 'Microsoft SDL 5.2: SDL-LOB phase table, Mapping Risk to Security SME Service Levels (Phase One for LOB), Pre-Production Assessment severity table (Phase Four for LOB), SDL-Agile Table 1 bucket example — verbatim'
lob_phase_activities:
- phase: Training
  activities:
  - LOB-specific training
- phase: Requirements
  activities:
  - Risk assessment
  - Application portfolio
  - Application risk assessment
  - Determine service level
- phase: Design
  activities:
  - Asset-centric threat modeling
  - Threat model
  - Design review
- phase: Implementation
  activities:
  - Internal review
  - Incorporate security checklists and standards
  - Conduct “self” code review
  - Security code analysis
- phase: Verification
  activities:
  - Pre-production assessment
  - Comprehensive security Assessment
  - Bug tracking
- phase: Release
  activities:
  - Post-production assessment
  - Host level scan
lob_risk_to_service_level:
- risk_level: High
  service_level:
  - Threat model
  - Design review
  - 'Comprehensive review, which includes most or all of the following:'
  - Code review (white box)
  - Penetration test (black box)
  - Privacy review
  - Deployment review
- risk_level: Medium
  service_level:
  - Threat model (recommended)
  - Code review (white box)
  - Privacy review (as appropriate)
  - Deployment review (as appropriate)
- risk_level: Low
  service_level:
  - Threat model (as appropriate)
  - Deployment review (as appropriate)
lob_finding_severity:
- severity: Critical
  description:
  - Impact across the enterprise and not just the local LOB application/resources
  - Exploitable vulnerability in deployed production application
- severity: Important
  description:
  - Exploitable security issue
  - Policy or standards violation
  - Affects local application or resources only
  - Risk rating = High risk
- severity: Moderate
  description:
  - Difficult to exploit
  - Non-exploitable due to other mitigation
  - Risk rating = Medium risk
- severity: Low
  description:
  - Bad practice
  - Non-exploitable
  - Should not lead to exploit but helpful to attacker exploiting another vulnerability
  - Risk rating = minimal risk
agile_bucket_example:
- Verification Tasks: ActiveX fuzzing
  Design Review: Conduct a privacy review
  Planning: Create privacy support documents
- Verification Tasks: Attack surface analysis
  Design Review: Review crypto design
  Planning: Update security response contacts
- Verification Tasks: Binary analysis (BinScope)
  Design Review: Assembly naming and APTCA
  Planning: Update network down plan
- Verification Tasks: File fuzz testing
  Design Review: User Account Control
  Planning: Define/update security bug bar
