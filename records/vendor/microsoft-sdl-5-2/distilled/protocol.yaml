schema: "library-protocol/v1"
record: microsoft-sdl-5-2
title: "SDL 5.2 exchanges: the Final Security Review, and the privacy escalation response (Appendix K)"
extracted: "2026-10-02"
reviewed_by: ""
roles:
  - {id: project-team, source: "throughout"}
  - {id: security-advisor, source: "Project Inception; FSR"}
  - {id: privacy-advisor, source: "Project Inception; FSR > Privacy Requirements"}
  - {id: higher-management, source: "Possible FSR Outcomes: 'escalate to higher management for a decision'"}
  - {id: escalation-manager, source: "Appendix K"}
  - {id: privacy-escalation-team, source: "Appendix K: 'an escalation manager, a legal representative, and a public relations (PR) representative, at a minimum'"}
messages:
  - {id: FSRInformationPackage, from: project-team, to: security-advisor, text: "The project team must provide all required information before the scheduled FSR start date.", kind: stated}
  - {id: ExceptionRequest, from: project-team, to: security-advisor, text: "Submit exception requests to a security advisor for review. If your team cannot meet a specific SDL requirement, you must request an exception.", kind: stated}
  - {id: ExceptionDecision, from: security-advisor, to: project-team, text: "A security advisor reviews these requests and, if the overall security risk is tolerable, might choose to grant the exception.", kind: stated}
  - {id: FSRSignOff, from: security-advisor, to: project-team, text: "After the FSR is finished, the security advisor either signs off on the project as is or provides a list of required changes.", kind: stated}
  - {id: RequiredChanges, from: security-advisor, to: project-team, kind: stated}
  - {id: Escalation, from: "security-advisor | project-team", to: higher-management, text: "Teams must correct whatever SDL requirements that they can or escalate to higher management for a decision.", kind: stated}
  - {id: PrivacySignOff, from: privacy-advisor, to: project-team, text: "After the privacy review is finished, your privacy advisor either signs off on the product as is or provides a list of required changes.", kind: stated}
  - {id: PrivacyEscalationNotice, from: "any employee", to: privacy-escalation-team, via: "distribution group or managed e-mail account", fields: ["The source of the escalation.", "The impact and breadth of the escalation.", "The validity of the incident or situation.", "A summary of the known facts.", "Timeline expectations.", "Employees who know about the situation, product, or service."], kind: stated}
flows:
  - {id: fsr-pass, steps: [FSRInformationPackage, FSRSignOff]}
  - {id: fsr-changes, steps: [FSRInformationPackage, RequiredChanges, FSRSignOff]}
  - {id: fsr-exception, steps: [ExceptionRequest, ExceptionDecision, FSRSignOff]}
  - {id: fsr-escalation, steps: [FSRInformationPackage, Escalation]}
  - {id: privacy-review, steps: [PrivacySignOff]}
  - {id: privacy-escalation, steps: [PrivacyEscalationNotice], note: "then evaluation, dissemination, resolution, closing (Appendix K)"}
error_paths:
  - "Errors of omission or willful neglect → immediate FSR failure, escalated 'to the project team executive staff and the executive in charge of security and privacy'."
