    entry_type: "item"
    normativity: "requirement"
    verb: "should"
    actor: "product/project team"
    nature: "deliverable"
    phase: "verification"
    locator: "Phase Four: Verification for LOB > Pre-Production Assessment > Security Requirements"
    short_title: "Code review (white box)\n- Security team is provided access to an application’s source code and documentation to aid them in their assessment"
    text: "Code review (white box)\n- Security team is provided access to an application’s source code and documentation to aid them in their assessment activities.\n- Complete review using both manual code inspection and security tools, such as static analysis or penetration testing.\n- Review threat model. Code reviews are prioritized based on risk ratings identified through threat modeling activities. Components of an application with the highest severity ratings get the highest priority with respect to assigning code review resources, whereas components with low severity ratings are assigned lesser priority.\n- Validate tools results. The security expert also validates results from code analysis tools (if applicable), such as CAT.NET to verify that vulnerabilities have been addressed by the development team. In situations where this is not the case, the issue is filed in the bug tracking system.\n- If source code is not available or the application is a third-party application, then black box assessment is conducted for that application.\n- Code review duration. The duration of a security review is determined by the security SME and is directly related to the amount of code that needs to be reviewed.\n- Code review can be conducted manually or by using automated tools to identity categories of vulnerabilities in the code. However, it should be noted that automated tools should supplement a code review and not replace them entirely, due to their limitations."
    expects_deliverables:
      - "security/privacy documentation"
      - "threat model"
    verification: "checked at the Final Security Review (FSR) / privacy review by the security or privacy advisor"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL-LOB"
