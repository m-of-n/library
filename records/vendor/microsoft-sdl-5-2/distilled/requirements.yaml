    phase: "release"
    locator: "Phase Five: Release > Final Security Review and Privacy Review > The FSR Process"
    short_title: "Submit exception requests to a security advisor for review."
    text: "Submit exception requests to a security advisor for review. If your team cannot meet a specific SDL requirement, you must request an exception. Typically, such a request is made well in advance of the FSR. A security advisor reviews these requests and, if the overall security risk is tolerable, might choose to grant the exception. If the security risk is not acceptable, the security advisor will deny the exception request. It is best to address all exception requests as soon as possible in the development phase of the project."
