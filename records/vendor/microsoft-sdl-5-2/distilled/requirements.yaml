    locator: "Phase Three: Implementation > Creating Documentation and Tools for Users That Address Security and Privacy > Security Recommendations"
    short_title: "Make information about secure configurations available separately or as part of the default product documentation and/or help files."
    text: "Make information about secure configurations available separately or as part of the default product documentation and/or help files. Consider the following issues:\n- The program will follow the best practice of reducing the default attack surface. However, what should users know if they need to activate additional functionality? What risks will they be exposed to?\n- Are there usage scenarios that allow users to lock down or harden the program more securely than the default configuration without losing functionality? Inform users about how to configure the program for these situations. Better yet, provide easy-to-use templates that implement such configurations.\n- Inform users about security best practices, such as removing guest accounts and default passwords. External security notes from threat modeling are good sources of information to consider.\n- For programs that use network or Internet communications, describe all communications channels and ports, protocols, and communications configuration options (and their associated security impacts).\n- To support earlier versions of the software and older protocols, it is often necessary to operate less securely. Do not enable insecure protocols in the default configuration. You might still need to deliver them with the release, so inform users about the security implications of older protocols and backward compatibility. Inform users about these trade-offs and how to disable older compatibility modes to achieve the best possible security.\n- Tell users how they can ensure safe use of the program or take advantage of built-in security and privacy features."
    expects_deliverables:
      - "attack surface analysis"
      - "security/privacy documentation"
      - "threat model"
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
