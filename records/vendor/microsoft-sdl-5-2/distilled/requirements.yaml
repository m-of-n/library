    phase: "governance"
    locator: "Applying SDL Tasks to Sprints > Final Security Review"
    short_title: "A Final Security Review (FSR) similar to the FSR performed in the classic waterfall SDL is required at the end of every agile sprint."
    text: "A Final Security Review (FSR) similar to the FSR performed in the classic waterfall SDL is required at the end of every agile sprint. However, the SDL-Agile FSR is limited in scope—the security advisor only needs to review the following:\n- All every-sprint requirements have been completed, or exceptions for those requirements have been granted.\n- At least one requirement from each bucket requirement category has been completed (or an exception has been granted for that bucket).\n- No bucket requirement has gone more than six months without being completed (or an exception has been granted).\n- No one-time requirements have exceeded their grace period deadline (or exceptions have been granted).\n- No security bugs are open that fall above the designated severity threshold (that is, the security bug bar)."
    expects_deliverables:
      - "bug bar"
      - "exception request"
    verification: "checked at the Final Security Review (FSR) / privacy review by the security or privacy advisor"
    kind: "stated"
