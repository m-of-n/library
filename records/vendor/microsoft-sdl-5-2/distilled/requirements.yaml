  - id: "microsoft-sdl-5-2#R-0237"
    designator: "R-0237"
    entry_type: "item"
    normativity: "requirement"
    verb: "must"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "release"
    locator: "Phase Five: Release for LOB > Post-Production Assessment > Security Requirements"
    short_title: "Host-level security."
    text: "Host-level security. Providing security for the host computer involves the following items that are audited on a regular basis on production servers:\n- Patch management. The security SME verifies that servers have the latest applicable security updates, including updates from every software manufacturer that has software running on the server.\n- Appropriate configuration. The servers are reviewed for compliance with established baselines. For example, all unused services that are not required for the application are disabled and blocked instead of running with default settings.\n- Antivirus. Servers have antivirus software running and actively scanning all system file areas, in addition to all shared directories. All systems must have their antivirus application or signature files examined at logon to ensure that the latest antivirus application or current virus signature files are present.\n- Compliance. Verify compliance with internal business policies and external legal requirements, in addition to standards such as PCI.\n- Review access control/permissions. The access control list (ACL) permission settings on all file shares and other system, database, and COM+ objects are reviewed to help prevent unauthorized access. Regular review, for example, of administrator privileges on a given server should be performed.\n- Server auditing and logging. Ensuring that auditing with appropriate logging procedures for all system objects that contain business-sensitive information is enabled. Logging procedures include collecting log files and protecting access to log data to only appropriate users (members of security, internal audit, or systems management teams) with the appropriate ACLs. Even more critical is ensuring that the logs are reviewed on a regular basis and that there is some guidance for filtering critical logs from regular operational \"noise.\"\n- Network level security. The network infrastructure should be scanned for compliance with baselines (just like servers). This evaluates configuration, vulnerabilities, patch management, and other similar concerns.\n- Application retirement. At some point the application will need to be retired gracefully. Are there adequate controls, contact information, and operational awareness to ensure that this can happen at the appropriate time?"
    expects_deliverables: []
    verification: "checked at the Final Security Review (FSR) / privacy review by the security or privacy advisor"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL-LOB"
