reconciliation: "bin/bcp14-count finds 5 uppercase keywords in the pandoc plain rendering (MUST, MUST NOT, SHOULD, REQUIRED, RECOMMENDED). None is a BCP 14 keyword: all five are lowercase text carrying Word's all-caps character formatting, which pandoc uppercases — 'the bug bar must never be relaxed' (Phase One, Project Inception), 'organizations should adapt rather than adopt' (SDL-LOB intro), the Appendix E heading 'Required and Recommended Compilers ...', and the Appendix P row title 'Ensure regular expressions must not execute in exponential time'. The document never invokes BCP 14. Extracted texts come from the XML with original case, so they contain 0. Baseline = the document's own normative structure: 46 headed sections ({'Security Requirements': 16, 'Security Recommendations': 14, 'Privacy Recommendations': 6, 'Privacy Requirements': 10}), plus the requirement appendices (D firewall table, E compilers/tools tables, F-J 'SDL Requirement' appendices, S high-risk code), the SDL-Agile requirement tables (Appendices P, Q, R) and the FSR process/outcome lists. Every top-level list item or paragraph under those headings is one entry, as is every table row; nested list items stay with their parent. Context paragraphs inside the F-J/S/Agile sections with no modal word are classified descriptive and appear in normative.md but not here (115 units). Entries by normativity {'requirement': 259, 'recommendation': 140, 'process': 9}; by kind {'item': 174, 'paragraph': 94, 'table-row': 4, 'firewall-row': 4, 'tool-row': 32, 'agile-row': 100}; by variant {'SDL (waterfall/spiral)': 243, 'SDL-Agile': 106, 'SDL-LOB': 59}. Lowercase modal words in the capture, for reference: must 187, should 204, required 62, shall 0, may 61. VERIFY PASS (2026-10-03): the extract pass took only the headed Requirements/Recommendations sections, appendix tables and Agile tables as its baseline; a walk of every docx paragraph found 102 statements carrying must/should/required/requires/need to/mandatory OUTSIDE those headings (and outside the scoped-out Appendices A, C, K, L, M, N, O, U, V), none of them in requirements.yaml and none in normative.md — e.g. 'you must complete a Final Security Review before final release' (Phase Five > Public Release Privacy Review), 'The security advisor assigned to the release must certify that your team has satisfied security requirements' (Release to Manufacturing), 'You must complete threat modeling during project design' (Phase Two > Risk Analysis), 'Each member of a project team must complete at least one security training course every year' (SDL-Agile), the Appendix D Application Quality and Least Privilege rules, and the SDL-LOB checklist ('Input validation must be applied at all identified entry points'). They are appended as R-0409..R-0510 (whole paragraphs, verbatim; a lead-in ending ':' carries its list items), typed by strongest modal word; R-0409+ are NOT in document order (each carries its docx paragraph index). Excluded as non-prescriptive: disclaimers, history, the worked SDL-Agile example narrative, a resources title, a glossary-style definition. Entries now 510 = 408 + 102; by_normativity {'requirement': 311, 'recommendation': 188, 'process': 9, 'descriptive': 2}; by_variant {'SDL (waterfall/spiral)': 291, 'SDL-Agile': 132, 'SDL-LOB': 87} (4 'Applying SDL Tasks to Sprints' entries corrected from SDL to SDL-Agile)."
