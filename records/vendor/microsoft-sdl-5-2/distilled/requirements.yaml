    phase: "verification"
    locator: "Phase Four: Verification > Security Push > Security Recommendations"
    short_title: "Re-evaluate the attack surface of the software."
    text: "Re-evaluate the attack surface of the software. It is important to re-evaluate your team’s definition of attack surface during the security push. You should be able to calculate the attack surface based on information described in the design specifications for the software. Measurement of the attack surface enables you to understand which components have direct exposure to attack and the highest risk of damage if a security breach occurs. Focus effort on areas of highest risk areas, and take appropriate corrective actions. These actions might include:\n- Prolonging the push for especially error-prone components.\n- Deciding not to ship a component until it is corrected.\n- Disabling a component by default.\n- Re-designating a component for future removal from the software (deprecating it).\n- Modifying development practices to make vulnerabilities less likely to be introduced by future modifications or new developments."
    expects_deliverables:
      - "attack surface analysis"
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
