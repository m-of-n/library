  - id: "microsoft-sdl-5-2#R-0118"
    designator: "R-0118"
    entry_type: "paragraph"
    normativity: "requirement"
    verb: "must"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "verification"
    locator: "Phase Four: Verification > Security and Privacy Testing > Security Requirements"
    short_title: "Scripts setting document.domain to any value should be validated to ensure that:"
    text: "Scripts setting document.domain to any value should be validated to ensure that:\n1. The site checks that the caller is on a list of allowed sites before setting document.domain.\n2. If the site deals with PII in any way, document.domain is not set to a top-level domain (for example, live.com) but only to an appropriate subdomain (for example, billing.live.com).\n- Perform Application Verifier tests. Test all discrete applications within a shipping product for heap corruption and Win32 resource issues that might lead to security and reliability issues. You can detect these issues using AppVerifier, available at http://technet.microsoft.com/en-us/library/bb457063.aspx. Exit Criteria: All tests in the application's functional test suite have been run under AppVerifier, and all issues have been fixed.\n- Network fuzzing. Fuzzing of network interfaces is one of the primary tools of security researchers and attackers, and network facing applications are arguably the most easily accessed target for a remote attacker. Each network parser must successfully handle 100,000 malformed packets without error.\n- Binary analysis. If obfuscated binaries are being shipped, BinScope must be run on the pre-obfuscated version of each binary instead of the obfuscated version to ensure that issues were identified correctly."
    expects_deliverables:
      - "fuzz test results"
    verification: "checked at the Final Security Review (FSR) / privacy review by the security or privacy advisor"
    kind: "stated"
