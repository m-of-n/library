    short_title: "Do not use banned APIs."
    text: "Do not use banned APIs. Problems arise when an attacker controls the incoming buffer and the code uses data from the buffer to determine the maximum buffer length to copy. Verify there are no banned APIs in shipping code, including sample code. Recommended tool: banned.h header or use of Visual C++ use of C4996 warnings."
