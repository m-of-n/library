    locator: "Phase Two: Design > Risk Analysis > Security Recommendations"
    short_title: "(New for SDL 5.2) Follow NEAT security user experience (UX) guidance to ensure that warnings are Necessary, Explained, Actionable, and Teste"
    text: "(New for SDL 5.2) Follow NEAT security user experience (UX) guidance to ensure that warnings are Necessary, Explained, Actionable, and Tested.\n- Microsoft has produced guidance to help engineers design better warnings. The guidance is summarized in the four-letter acronym NEAT—Necessary, Explained, Actionable, and Tested. The objective of NEAT is to improve security warnings in products by making sure they are:\n- Necessary. Does the user really need to be presented with the decision?\n- Explained. Does the UX present all the information the user needs to make this decision?\n- Actionable. Is there a set of steps users can take to make good decisions in both benign and malicious scenarios?\n- Tested. Has the warning been reviewed by multiple engineers to make sure users will understand how to respond to the warning?\n- Improve security-related prompts in your products to enable customers to make good security decisions that protect them from harm.\n- Users face a barrage of decisions about whom and what to trust, and when to be concerned about their security. These security decisions arise when users initiate activities like installing an executable from the web, using an application that needs to get through the firewall, and allowing a web application to access their sensitive data. These decisions also arise when a product prompts the user to take an action to improve their security, such as when Windows prompts the user to reboot or to turn the Windows Firewall on. With attacks moving “up the stack” from silent code exploits to social engineering, good security UX gives you a chance to help the user avoid running malicious software."
    expects_deliverables: []
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
