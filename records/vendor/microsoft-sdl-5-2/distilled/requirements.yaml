    designator: "R-0135"
    entry_type: "paragraph"
    normativity: "recommendation"
    verb: "imperative"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "verification"
    locator: "Phase Four: Verification > Security Push > Security Recommendations"
    short_title: "Code severity definitions are provided in the following list:"
    text: "Code severity definitions are provided in the following list:\n- Critical code is considered the most sensitive from a security standpoint. The following examples of Critical code are not necessarily a definitive list:\n- All Internet-facing or network-facing code.\n- Code in the Trusted Computing Base (TCB) (for example, kernel or SYSTEM code).\n- Code running as administrator or Local System.\n- Code running as an elevated user (including LocalService and NetworkService).\n- Features with a history of vulnerability, regardless of version.\n- Any code that handles secret data, such as encryption keys and passwords.\n- Any unverifiable managed code (any code that the standard PEVerify.exe tool reports as not verified).\n- All code supporting functionality exposed on the maximum attack surface.\n- Important code is optionally installed code that runs with user privilege or code that is installed by default that does not meet the Critical criteria.\n- Moderate code is rarely used code and setup code. (Setup code that handles secret data, such as encryption keys and passwords, is always considered Critical code.)\n- Any code or component that has experienced large numbers of security issues is considered Critical code, even if it would otherwise be considered Important or Moderate. Although the definition of large numbers is subjective, it is important to scrutinize carefully the portions of code that contain the most security vulnerabilities."
    expects_deliverables:
      - "attack surface analysis"
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
