  - id: "microsoft-sdl-5-2#R-0176"
    designator: "R-0176"
    entry_type: "paragraph"
    normativity: "requirement"
    verb: "required"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "governance"
    locator: "SDL-Agile Requirements > Constraints"
    short_title: "The main difficulty that SDL-Agile attempts to address is that of fitting the entire SDL into a short release cycle."
    text: "The main difficulty that SDL-Agile attempts to address is that of fitting the entire SDL into a short release cycle. It is entirely reasonable to mandate that every SDL requirement be completed over the course of a two- or three-year-long release cycle. It is not reasonable to mandate the same for a two- or three-week-long release cycle. The categorization of SDL requirements into every-sprint, one-time, and the three bucket groups is the SDL-Agile solution for dealing with this conundrum. However, an effect of this categorization is that teams can temporarily skip some SDL requirements for some releases. The Microsoft SDL team believes this is a necessary situation required to provide the best mix of security, feature development, and speed of release for teams with short release cycles."
    expects_deliverables: []
    verification: "checked at the Final Security Review (FSR) / privacy review by the security or privacy advisor"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL-Agile"
