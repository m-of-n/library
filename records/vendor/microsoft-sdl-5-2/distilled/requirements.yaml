    short_title: "(Promoted for SDL 5.2) Components must have no hard dependencies on the NTLM protocol."
    text: "(Promoted for SDL 5.2) Components must have no hard dependencies on the NTLM protocol. All explicit uses of the NTLM package for network authentication must be replaced with the Negotiate package. All client authentication calls must provide a properly formatted target name—service principal name (SPN). The purpose of the requirement is to enable systems to use Kerberos in place of NTLM whenever possible."
