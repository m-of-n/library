    short_title: "All executables (.EXE) marked as /NXCOMPAT are able to take advantage of Data Execution Protection. Dynamic-link libraries (.DLL files) o..."
    text: "All executables (.EXE) marked as /NXCOMPAT are able to take advantage of Data Execution Protection. Dynamic-link libraries (.DLL files) or other code called by executables (such as COM objects) do not gain direct security benefits with /NXCOMPAT but need to coordinate enabling /DEP support with any executable files that might call them. Any EXE with /NXCOMPAT enabled that loads other code without /NXCOMPAT enabled may have the process fail unexpectedly unless the EXE and all of the other code that it calls (such as DLLs or COM objects) have been thoroughly tested with DEP enabled (linked with /NXCOMPAT option)."
