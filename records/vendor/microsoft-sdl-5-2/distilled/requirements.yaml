    locator: "Appendix I: SDL Requirement: Heap Manager Fail Fast Setting > Goals and Justification"
    short_title: "Currently, even if corruption is detected in the heap manager, the process might continue to run successfully, depending on the corruption p"
    text: "Currently, even if corruption is detected in the heap manager, the process might continue to run successfully, depending on the corruption pattern, the data affected, and the usage. Some applications might hide memory-related vulnerabilities by handling exceptions, such as access violations, that are raised inside the heap manager. The goal is to find vulnerabilities early and to create robust code. Therefore, certain critical operating system components must hard fail when heap corruption is detected. Also, any new application developed and tested on Windows Vista should terminate on heap corruptions."
    expects_deliverables:
      - "exception request"
    verification: "checked at the Final Security Review (FSR) / privacy review by the security or privacy advisor"
