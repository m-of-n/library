    locator: "Phase Two: Design > Risk Analysis > Security Requirements"
    short_title: "Complete threat models for all functionality identified during the cost analysis phase."
    text: "Complete threat models for all functionality identified during the cost analysis phase. Threat models typically must consider the following areas:\n- All projects. All code exposed on the attack surface and all code written by or licensed from a third party.\n- New projects. All features and functionality.\n- Updated versions of existing projects. New features or functionality added in the updated version.\n- Ensure that all threat models meet minimal threat model quality requirements. All threat models must contain data flow diagrams, assets, vulnerabilities, and mitigation. Threat modeling can be done in a variety of ways, using either tools or documentation/specifications to define the approach. For assistance in creating threat models, see “Chapter 9: Stage 4 – Risk Analysis” in The Security Development Lifecycle book or consult other guidance listed in Resources.\n- Have all threat models and referenced mitigations reviewed and approved by at least one developer, one tester, and one program manager. Ask architects, developers, testers, program managers, and others who understand the software to contribute to threat models and to review them. Solicit broad input and reviews to ensure the threat models are as comprehensive as possible.\n- Confirm that threat model data and associated documentation (functional/design specifications) has been stored using the document control system used by the product team."
    expects_deliverables:
      - "attack surface analysis"
      - "security/privacy documentation"
      - "threat model"
