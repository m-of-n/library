  - id: "microsoft-sdl-5-2#R-0071"
    designator: "R-0071"
    entry_type: "item"
    normativity: "recommendation"
    verb: "must not"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "implementation"
    locator: "Phase Three: Implementation > Establish and Follow Best Practices for Development > Security Recommendations"
    short_title: "Additional development best practices for security can be divided into three general categories:"
    text: "Additional development best practices for security can be divided into three general categories:\n1. Review available information resources to adopt coding techniques and methodologies that are appropriate for the product.\n2. Review recommended development tools to adopt, and use those that are appropriate for the product, in addition to the tools required by the SDL.\n3. Define, communicate, and document all best practices and policies for the product. Based on analysis of all of the resources and tools listed above, product teams should adopt and communicate best practices, policies, and tools. This information should be documented and widely communicated to the entire product team to ensure best practices are adopted and followed.\n- Document all tools used. This includes all compiler versions, compile options (for example, /GS), and additional tools used for static code analysis. This should also forecast any changes in tools anticipated. As updated versions of tools (both compilers and code analysis tools) are made available, products that have not yet released a final beta will likely be required to adopt the newest version of the tools. Products that have released their final beta prior to the availability of updated tools are not required to adopt the latest versions of tools. Please review How Are New Recommendations and New Requirements Added to the Security Development Lifecycle Process? For more information on how policy is established on minimum tool requirements.\n- Use the Windows Imaging Component (WIC). WIC provides an extensible framework for reading and manipulating images, image files, and image metadata. It represents a standard interface. All software products that process digital image data must perform any encoding or decoding of image data solely and exclusively using the Windows Imaging Component (WIC) and therefore must remove any potential custom (image) codecs from the product codebase. For more information, see http://msdn.microsoft.com/en-us/library/ee719654.aspx.\n- Ensure that regular expressions must not execute in exponential time (O(2^n)). Regular expressions that are evaluated against untrusted input must be examined for unsafe patterns that can lead to denial-of-service (DoS) vulnerabilities. Use RegexFuzzer to analyze all regular expressions to ensure that they are free of grouping expressions with repetition that are themselves repeated and containing alternation where the alternate sub-expressions overlap each other.\n- Use proper http.sys URL canonicalization. Web servers often make security decisions based on a requested URL from a user. For example, a web server may deny access to certain files, such as configuration files, directly through the web server; rather, such files can only be viewed and manipulated with text editing tools, such as Visual Studio, against the local file system."
    expects_deliverables:
      - "fuzz test results"
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
  - id: "microsoft-sdl-5-2#R-0072"
    designator: "R-0072"
    entry_type: "paragraph"
    normativity: "recommendation"
    verb: "should"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "implementation"
    locator: "Phase Three: Implementation > Establish and Follow Best Practices for Development > Security Recommendations"
    short_title: "The weakness with this approach is that the authorization check is based on the name of the resource, rather than based on an access control"
    text: "The weakness with this approach is that the authorization check is based on the name of the resource, rather than based on an access control mechanism, such as an ACL, enforced by the operating system. And this leads to canonicalization (C14N) vulnerabilities, because there is often more than one way to name a resource. All web servers have suffered from such issues, but http.sys does not offer much protection from C14N vulnerabilities. It is therefore important that developers using http.sys follow these recommendations to defend themselves. Any application that uses http.sys should follow these guidelines."
    expects_deliverables: []
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
  - id: "microsoft-sdl-5-2#R-0073"
    designator: "R-0073"
    entry_type: "paragraph"
    normativity: "recommendation"
    verb: "should"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "implementation"
    locator: "Phase Three: Implementation > Establish and Follow Best Practices for Development > Security Recommendations"
    short_title: "Managed Code\n1."
    text: "Managed Code\n1. Limit the URL length to no more than 16,384 characters (ASCII or Unicode). This is the absolute maximum URL length, based on the default IIS 6 setting. websites should strive for a length shorter than this, if possible.\n2. Use the standard .NET Framework file I/O classes (such as FileStream), since these take advantage of the canonicalization rules in the .NET FX.\n3. Explicitly build an allow-list of known filenames.\n4. Explicitly reject known filetypes you will not serve; UrlScan rejects: exe, bat, cmd, com, htw, ida, idq, htr, idc, shtm[l], stm, printer, ini, pol, dat files.\n5. Catch the following exceptions: System.ArgumentException (for device names), System.NotSupportedException (for data streams), System.IO.FileNotFoundException (for invalid escaped filenames), and System.IO.DirectoryNotFoundException (for invalid escaped dirs).\n6. Do not call out to Win32 file I/O APIs.\n7. On an invalid URL, gracefully return a 400 error to the user, and log the real error."
    expects_deliverables:
      - "exception request"
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
  - id: "microsoft-sdl-5-2#R-0074"
    designator: "R-0074"
    entry_type: "paragraph"
    normativity: "recommendation"
    verb: "imperative"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "implementation"
    locator: "Phase Three: Implementation > Establish and Follow Best Practices for Development > Security Recommendations"
    short_title: "Unmanaged Code\n1."
    text: "Unmanaged Code\n1. Limit the URL length to 16,384 characters (ASCII or Unicode).\n2. Prepend \\\\?\\ to the filename prior to accessing the file system, since this forces the file system to bypass filename equivalency checks. This is not perfect, because it does not prevent data streams (::$DATA, for example).\n3. Normalize the URL by URL double-decoding the filename, and check that the first decode matches the second decode. If not, it's an error.\n4. Look for known “bad characters” in the filename.\n5. Look for known “bad strings” in the filename.\n6. On an invalid URL or filename, return a 400, and log the real error."
    expects_deliverables: []
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
