  - id: "microsoft-sdl-5-2#R-0005"
    designator: "R-0005"
    entry_type: "item"
    normativity: "requirement"
    verb: "must"
    actor: "security advisor"
    nature: "deliverable"
    phase: "requirements"
    locator: "Phase One: Requirements > Project Inception > Security Requirements"
    short_title: "Develop and answer a short questionnaire to verify whether your development team is subject to Security Development Lifecycle (SDL) policies"
    text: "Develop and answer a short questionnaire to verify whether your development team is subject to Security Development Lifecycle (SDL) policies. The questionnaire has two possible outcomes:\n1. If the project is subject to SDL policies, it must be assigned a security advisor who serves as the point of contact for its Final Security Review (FSR). It is in the project team’s interest to register promptly and establish the security requirements for which they will be held accountable. The team will also be asked some technical questions as part of a security risk assessment to help the security advisor identify potential security risks. (See Cost Analysis in this document.)\n2. If the project is not subject to SDL policies, it is not necessary to assign a security advisor and the release is classified as exempt from SDL security requirements.\n- Identify the team or individual that is responsible for tracking and managing security for the product. This team or individual does not have sole responsibility for ensuring that a software release is secure, but the team or individual is responsible for coordinating and communicating the status of any security issues. In smaller product groups, a single program manager might take on this role.\n- Ensure that bug reporting tools can track security issues and that a database can be queried dynamically for all security bugs at any time. The purpose of this query is to examine unfixed security issues in the FSR. The project’s bug tracking system must accommodate the bug bar ranking value recorded with each bug.\n- Define and document the project’s security bug bar. This set of criteria establishes a minimum level of quality. Defining it at the start of the project improves understanding of risks associated with security issues and enables teams to identify and fix security issues during development. The project team must negotiate a bug bar approved by the security advisor with project-specific clarifications and (as appropriate) more stringent security requirements specified by the security advisor. The bug bar must never be relaxed, though, even as the project’s release date nears. Bug bar examples can be found in Appendix M: SDL Privacy Bug Bar and Appendix N: SDL Security Bug Bar.\n- Include third-party code licensing security requirements in all new contracts. If your product contains licensed third-party code or hardware that is newly contracted in the current release, you should ensure that there is a provision in the licensing contract that requires the third party to provide proof of compliance with a predefined list of SDL requirements. Depending upon your company's relationship with the third party, this can include things such as the source code itself for verification, security tool output and logs, or independent verification performed by an outside agent."
    expects_deliverables:
      - "SDL questionnaire"
      - "bug bar"
      - "security risk assessment (SRA)"
    verification: "checked at the Final Security Review (FSR) / privacy review by the security or privacy advisor"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
