    short_title: "Frequently, application teams have a variety of post-production changes to the application, ranging from a hotfix, service pack, or entirely"
    text: "Frequently, application teams have a variety of post-production changes to the application, ranging from a hotfix, service pack, or entirely new features. Depending on the scope, the application team either needs to start over by updating the application portfolio (which kicks off a new iteration of the SDL-LOB life cycle), or perform a subset of the SDL-LOB tasks. At a minimum, this subset should include a review/update of the threat model and selected tasks from the Internal Review conducting during the Implementation phase."
