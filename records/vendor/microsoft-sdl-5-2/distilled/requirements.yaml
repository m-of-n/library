    nature: "process"
    phase: "implementation"
    locator: "Phase Three: Implementation > Establish and Follow Best Practices for Development > Security Recommendations"
    short_title: "ClickJacking defense."
    text: "ClickJacking defense. For each page that could contain user controllable content, you should use a \"frame-breaker\" script and include the HTTP response header named X-FRAME-OPTIONS in each authenticated page. The Watcher tool may be of use in meeting this recommendation. The exit criteria for this recommendation is as follows:\n1. A \"frame-breaker\" script is included in each authenticated page to prevent unintentionally framing.\n2. The X-FRAME-OPTIONS header has been added to all authenticated page HTTP responses that should not be framed (for example, DENY) or is utilized to only allow trusted sites to frame site content (for example, the current site with the use of SAMEORIGIN).\n- COM best practices. Check for HRESULT misuse and uninitialized [PROP]VARIANTs. All HRESULTs should be set to valid COM values, (such as S_OK, S_FALSE, or E_FAILED) and all VARIANTs are initialized correctly.\n- Restrict database permissions. Only grant Execute permission on all stored procedures, and grant that permission only for the application domain group. For example, run your online service as Network Service (for example, phx\\$machinename) or join that domain account to a domain group (for example, phx\\mywebappgroup)."
    expects_deliverables: []
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
