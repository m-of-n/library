  - id: "microsoft-sdl-5-2#R-0178"
    designator: "R-0178"
    entry_type: "paragraph"
    normativity: "requirement"
    verb: "must"
    actor: "product/project team"
    nature: "process"
    phase: "governance"
    locator: "Applying SDL Tasks to Sprints > Exceptions"
    short_title: "In addition to applying for exceptions for specific requirements, teams can also request an exception for an entire bucket."
    text: "In addition to applying for exceptions for specific requirements, teams can also request an exception for an entire bucket. Normally teams must complete at least one requirement from each of the bucket categories during each sprint, but if a team cannot complete even one requirement from a bucket, the team requests an exception to cover that entire bucket. The team can request an exception for the duration of the sprint or for a specific time period, not to exceed six months, just like for single exceptions. However, due to the broad nature of the exception—basically stating that the team is going to skip an entire category of requirements—bucket exceptions are classified as Important and require the approval of at least a senior manager."
    expects_deliverables:
