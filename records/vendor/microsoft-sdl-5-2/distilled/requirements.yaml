    designator: "R-0225"
    entry_type: "item"
    normativity: "requirement"
    verb: "should"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "verification"
    locator: "Phase Four: Verification for LOB > Pre-Production Assessment > Security Requirements"
    short_title: "Penetration test (black box)\n- This is a flip of a white-box code where the assessment is carried out without access to the application’s so"
    text: "Penetration test (black box)\n- This is a flip of a white-box code where the assessment is carried out without access to the application’s source code. This testing is intended to simulate an attacker’s perspective and uses a combination of tools and penetration techniques to find vulnerabilities in the system.\n- While this best simulates most malicious hacker scenarios, this approach typically yields the least bugs, both in terms of quality and quantity, but it is the best approach when source code is not available for review.\n- Depending upon available resources, this testing can be done internally by your security team or by engaging a third-party security firm as appropriate. Third-party security tools can also help with this requirement. Following are some of the high-level areas to consider in web penetration testing:\n- Use HTTP(s) interrogators, such as Fiddler, to capture traffic and to investigate cookies, headers, and hidden fields. Use Request/Response tampering methods to detect error disclosure, cross-site scripting, SQL injection, and other injection attacks. All user- controlled data, such as cookies, headers, form fields, and query strings should be tested by sending in malformed data.\n- Check for forceful browsing to verify authorization controls in applications where there are more than two user groups with different access levels.\n- Use Network Monitor to identify if sensitive data is being transferred from client to server and to verify if the channel is encrypted or not. This would be more useful in the case of thick client LOB applications.\n- Experiment with the high risk portions of the application to ensure that controls described in the code review discussion have been implemented correctly and consistently."
    expects_deliverables: []
    verification: "checked at the Final Security Review (FSR) / privacy review by the security or privacy advisor"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL-LOB"
  - id: "microsoft-sdl-5-2#R-0226"
    designator: "R-0226"
    entry_type: "item"
    normativity: "requirement"
    verb: "should"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "verification"
    locator: "Phase Four: Verification for LOB > Pre-Production Assessment > Security Requirements"
    short_title: "Deployment review of servers\n- Review the deployment of the production servers to ensure adequate hardening."
    text: "Deployment review of servers\n- Review the deployment of the production servers to ensure adequate hardening. This review focuses on minimizing the attack surface of the server (in terms of running services and applications installed), hardening the operating system (ACLs, accounts, patching, registry hardening, minimal open ports, installing server functionality, such as IIS websites on a non-system drive), and hardening functionality, such as IIS and SQL Server.\n- Review, if possible, actual production servers or standard images used to build those servers. Failing that, reviewing test servers with the expectation that the issues found are used as a road map by operations to harden the actual production servers.\n- The test server environment and the production server should have similar security measures while the team is developing the application. This ensures that the application is not modified to execute on the production server. The security team runs security checks on the server. The application security team can complete this either manually or by using a tool."
    expects_deliverables:
      - "attack surface analysis"
    verification: "checked at the Final Security Review (FSR) / privacy review by the security or privacy advisor"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL-LOB"
