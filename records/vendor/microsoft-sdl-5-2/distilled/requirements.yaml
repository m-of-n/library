  - id: "microsoft-sdl-5-2#R-0161"
    designator: "R-0161"
    entry_type: "paragraph"
    normativity: "process"
    verb: "must"
    actor: "security advisor"
    nature: "process"
    phase: "release"
    locator: "Phase Five: Release > Final Security Review and Privacy Review > Possible FSR Outcomes"
    short_title: "Possible outcomes of an FSR include:"
    text: "Possible outcomes of an FSR include:\n- Passed FSR. If all issues identified during the FSR are corrected before RTM/RTW, the security advisor should certify that the project has successfully met all SDL requirements.\n- Passed FSR (with exceptions). If all issues identified during the FSR are corrected before RTM/RTW or the security advisor and team can reach an acceptable compromise about any SDL requirements that the project team was unable to resolve, the security advisor should identify the exceptions and certify that all other aspects of the project have successfully met all SDL requirements.\n- All exceptions and security issues not addressed in the current release should be logged and then addressed and corrected in the next release.\n- FSR escalation. If a team does not meet all SDL requirements, and the security advisor and the product team cannot reach an acceptable compromise, the security advisor cannot approve the project, and the project cannot be released. Teams must correct whatever SDL requirements that they can or escalate to higher management for a decision.\n- Escalations occur when the security advisor determines that a team cannot meet the defined requirements or is in violation of an SDL requirement. Typically, the team has a business justification that prevents them from being compliant with the requirement. In such instances, the security advisor and the team should work together to compose a consolidated escalation report that outlines the issue—including a description of the security or privacy risk and the rationale behind the escalation. This information is typically provided to the business unit executive and the executive with corporate responsibility for security and privacy, to aid decision-making.\n- If a team fails to follow proper FSR procedures—either by an error of omission or by willful neglect—the result is an immediate FSR failure. Examples include:\n- Errors of omission, such as failure to properly document all required information.\n- Specious claims and willful neglect, including:\n- Claims of “Not subject to SDL” contrary to evidence.\n- Claims of “FSR pass” contrary to evidence, and software RTM/RTW without the appropriate signoff.\n- Such an incident can result in very serious consequences and, as such, should always and immediately be escalated to the project team executive staff and the executive in charge of security and privacy."
    expects_deliverables:
      - "exception request"
    verification: "FSR procedure"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
