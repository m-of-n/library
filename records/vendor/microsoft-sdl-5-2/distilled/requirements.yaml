  - id: "microsoft-sdl-5-2#R-0119"
    designator: "R-0119"
    entry_type: "item"
    normativity: "recommendation"
    verb: "must not"
    actor: "product/project team (inferred)"
    nature: "deliverable"
    phase: "verification"
    locator: "Phase Four: Verification > Security and Privacy Testing > Security Recommendations"
    short_title: "Create and complete security testing plans that address these issues:"
    text: "Create and complete security testing plans that address these issues:\n- Security features and functionality work as specified. Ensure that all security features and functionality that are designed to mitigate threats perform as expected.\n- Security features and functionality cannot be circumvented. If a mitigation can be bypassed, an attacker can try to exploit software weaknesses, rendering security features and functionality useless.\n- Ensure general software quality in areas that can result in security vulnerabilities. Validating all data input and parsing code against malformed or unexpected data is a common way attackers try to exploit software. Data fuzzing is a general testing technique that can help prevent such attacks.\n- Penetration testing. Use the threat models to determine priorities, test, and attack the software as a hacker might. Use existing tools or design new tools, if needed.\n- Hire third-party security firms as appropriate. Depending on the business goals for your project and availability of resources, consider engaging an external security firm for a security review or penetration testing.\n- Develop and use vulnerability regression tests. If the code has ever had a security vulnerability reported, it is strongly suggested that you add regression tests to the test suite for that component to ensure that similar vulnerabilities are not inadvertently re-introduced to the code. Similarly, if there are other products with similar functionality in the market that have suffered publicly reported vulnerabilities, add tests to the test plan to prevent similar vulnerabilities.\n- For online services and/or LOB applications, conduct data flow testing. Any externally accessible pages and interfaces must have tests. This should include pages that automatically redirect.\n- Run through your test cases with WinHTTP, the debug version of wininet, or another application that captures all page transitions. Make sure that no part of the flow can be bypassed.\n- If the feature exposes SOAP or DCOM interfaces or any other services, these must also be tested. Ensure that no step can be skipped or bypassed.\n- If your feature requires authenticating a user before providing access, ensure that it is not possible to bypass this authentication step by directly connecting to the backend.\n- For online services and/or LOB applications, conduct replay testing. Replay all messages for any scenario you are responsible for to ensure that the expected outcome occurs. For example, try and change the password and then repeat, or attempt to reuse security tokens in other contexts (for example, try using a login token in a password reset flow).\n- For online services and/or LOB applications, cover input validation testing scenarios and variants. Do not do this through a web browser, since it will honor server-specified field lengths. Test cases must cover the following scenarios:\n- Random inputs. Ensure that a full range of ASCII and Unicode characters are used. All verification should be “allow” based instead of “block” based (deny everything that is not explicitly allowed).\n- Large inputs. Large strings should be attempted.\n- Script injection.\n- SQL injection.\n- Path traversal. Try and pass filenames, like ../../../../../../../boot.ini, to bypass directory access controls.\n- Malformed XML blobs. Attempt to submit XML that does not match the target schema, if your feature uses XSL attempt to pass XSL processing instructions within your input. Note that this is best done either using valid, but slightly incorrect, XML data to bypass the .NET validation code or disabling .NET validation checks before testing. All final release code to be used in production environments must not disable XML and other validation code in .NET.\n- Secure Code Review. Security code reviews are a critical component of the Security Development Lifecycle. Given the opportunity to review old code or work on a new cool feature, developers lean towards the latter. Unsurprisingly, attackers don't target only new functionality; they will attack all code, regardless of its age. Waiting to make the code more secure in the next version of the product is not a good solution for protecting customers, and therefore, high-risk items (Critical) that are considered the most sensitive and important for security should be reviewed in depth at the earliest opportunity."
    expects_deliverables:
      - "fuzz test results"
      - "threat model"
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
  - id: "microsoft-sdl-5-2#R-0120"
    designator: "R-0120"
    entry_type: "paragraph"
    normativity: "recommendation"
    verb: "required"
    actor: "product/project team (inferred)"
    nature: "process"
    phase: "verification"
    locator: "Phase Four: Verification > Security and Privacy Testing > Security Recommendations"
    short_title: "Determine the most at-risk components (Critical) and perform an in-depth security review of the code making up those components."
    text: "Determine the most at-risk components (Critical) and perform an in-depth security review of the code making up those components. For critical components or if time allows, also review Important items. Use the following guidelines to determine the most at-risk components.\n1. Define the code review priority based on these criteria:\n- Critical code is considered to be the most sensitive from a security standpoint. The following are examples of Critical code, but please note this is not necessarily a definitive list. Critical code is all Internet- or network-facing code, code in the Trusted Computing Base (TCB)—such as kernel or SYSTEM code, code running as administrator or Local System, code running as an elevated user (also includes LocalService and NetworkService), or features with a prior history of vulnerability, regardless of version. Any code that handles secret data, such as encryption keys and passwords, is considered Critical code. For managed code, Critical code is considered to be any unverifiable code (any code that the standard PEVerify.exe tool reports as not verified). All code supporting functionality exposed on the maximum attack surface is considered Critical code by definition.\n- Important code is optionally installed code that runs with user privilege, or code that is installed by default that doesn't meet the Critical criteria.\n- Moderate code is rarely used code and setup code. Setup code that handles secret data, such as encryption keys and passwords, is always considered Critical code.\n- Any code or component with high rates of security bug discovery is considered to be Critical code, even if it otherwise maps to Important or Moderate per the previous definitions. While the definition of high rates is subjective within the team, it is important to examine the portions of code that have experienced the highest rates of security issues with extra scrutiny.\n- Don't forget to include and prioritize all sample code shipped with the product. While generalized guidelines are difficult, consider how customers will be using the samples. Samples that are expected to be compiled and used with little changes in production environments should be considered Critical. \"Hello World\" applications are more likely to be considered Moderate code.\n2. Identify development and testing owners for everything in products. The following are required to meet this security recommendation:\n- All Critical source code should be thoroughly reviewed by inspection teams and code-scanning tools.\n- All Important code should be reviewed using code-scanning tools and some human analysis.\n- Development owners for all source code and testing owners for all binaries have been identified, documented, and archived.\n- All source code is assessed and assigned a severity—Critical, Important, Moderate, or Low. This information is recorded in a document or spreadsheet and is archived."
    expects_deliverables:
      - "attack surface analysis"
    verification: "not gated; may be reviewed at FSR"
    kind: "stated"
    testable: "partial"
    testable_reason: "judged by the security/privacy advisor; no objective criterion beyond the bug bar"
    variant: "SDL (waterfall/spiral)"
