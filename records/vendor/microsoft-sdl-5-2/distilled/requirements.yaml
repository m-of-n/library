    text: "The one-time requirements should generally be easy and quick to complete, with the exception of creating a baseline threat model, which is discussed later in this section. Even though these tasks are short, there are enough of them that it would not be feasible for a team just starting with SDL-Agile to complete all of them in one sprint, given that the team also needs to complete the every-sprint requirements and one requirement from each of the buckets."
