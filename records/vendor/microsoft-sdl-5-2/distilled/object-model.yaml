schema: "library-object-model/v1"
record: microsoft-sdl-5-2
source_version: "5.2 (2012-05-23)"
extracted: "2026-10-02"
reviewed_by: ""
method: "Object-model pass over the full capture: which entity types and edges does SDL 5.2 assume or define (phases, roles, artifacts, gate, records)?"
objects:
  - {name: Project, definition: "A product release or service release that is subject to, or exempt from, the SDL.", attributes: [subject_to_sdl, privacy_impact_rating, variant], locator: "Introduction FAQ; Phase One > Project Inception", kind: stated, tmodel_mapping: "ProductInstance / release under an SDL program (R-041)", notes: "variant = waterfall/spiral, SDL-Agile, SDL-LOB"}
  - {name: Phase, definition: "Training, Requirements, Design, Implementation, Verification, Release, Response.", attributes: [name, order], locator: "SDL overview; phase headings", kind: stated, tmodel_mapping: "LifecyclePhase (ARCH §3b) — the canonical phase line of MAP-0001", notes: ""}
  - {name: Practice, definition: "An activity heading within a phase (e.g. Project Inception, Cost Analysis, Risk Analysis, Security Push, FSR).", attributes: [name], locator: "H2 headings", kind: stated, tmodel_mapping: "Requirement group", notes: "16 practices across 7 phases."}
  - {name: Requirement, definition: "An item under a 'Security/Privacy Requirements' heading — mandatory for SDL-subject projects.", attributes: [text, kind_security_or_privacy], locator: "H3 'Security Requirements'/'Privacy Requirements'", kind: stated, tmodel_mapping: "Requirement (normativity requirement)", notes: ""}
  - {name: Recommendation, definition: "An item under a 'Security/Privacy Recommendations' heading.", attributes: [text], locator: "H3 '... Recommendations'", kind: stated, tmodel_mapping: "Requirement (normativity recommendation)", notes: ""}
  - {name: SecurityAdvisor, definition: "Assigned to an SDL-subject project; 'point of contact for its Final Security Review (FSR)'; approves the bug bar; reviews exceptions; signs off.", attributes: [name], locator: "Project Inception; FSR", kind: stated, tmodel_mapping: "Party role (R-036) — the Gate approver", notes: ""}
  - {name: PrivacyAdvisor, definition: "First point of contact for privacy support; signs off the privacy review.", attributes: [name], locator: "Project Inception > Privacy Requirements; Release", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: SecurityLead, definition: "Team or individual responsible for tracking and managing security for the product (coordinating, communicating status).", attributes: [name], locator: "Project Inception", kind: stated, tmodel_mapping: "Party role (document owner, R-043)", notes: ""}
  - {name: PrivacyLead, definition: "Team member responsible for privacy ('privacy lead or ... privacy champion').", attributes: [name], locator: "Project Inception", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: BugBar, definition: "Project security/privacy bug bar: criteria establishing a minimum level of quality, negotiated and approved by the security advisor; 'must never be relaxed'.", attributes: [severity_levels, approver], locator: "Project Inception; Appendices M, N", kind: stated, tmodel_mapping: "severity policy → Gate exit criterion (R-042)", notes: "Severity scale Critical/Important/Moderate/Low (examples/bug-bars.yaml)."}
  - {name: SecurityWorkItem, definition: "Security bug with bug-bar ranking, Security Bug Effect (STRIDE) and Security Bug Cause.", attributes: [effect, cause, severity], locator: "Project Inception; Appendix B", kind: stated, tmodel_mapping: "Finding/Vulnerability with STRIDE facet (ARCH §2) and CWE-like cause", notes: "schema/sdl-5-2.derived.schema.json SecurityWorkItem"}
  - {name: SecurityRiskAssessment, definition: "Mandatory SRA naming which portions need threat models, design reviews, pen testing, extra testing, fuzz scope.", attributes: [scope_items], locator: "Cost Analysis > Security Requirements", kind: stated, tmodel_mapping: "scoping of ThreatModel / TARA (R-042 in-scope set)", notes: ""}
  - {name: PrivacyImpactRating, definition: "P1/P2/P3 sensitivity rating from the privacy questionnaire initial assessment.", attributes: [rating], locator: "Cost Analysis > Privacy Requirements; Appendix C", kind: stated, tmodel_mapping: "privacy facet of Asset/data classification (R-029)", notes: ""}
  - {name: SecurityPlan, definition: "Document outlining processes, work items, timing and resources per SDL activity.", attributes: [activities, owners, milestones, deliverables], locator: "Project Inception > Security Recommendations; Appendix O", kind: stated, tmodel_mapping: "SDL program plan (R-041) as a governed view (R-043)", notes: ""}
  - {name: ThreatModel, definition: "Threat models for all functionality identified during cost analysis; reviewed at FSR; one work item per listed vulnerability.", attributes: [scope, threats, mitigations], locator: "Risk Analysis; FSR", kind: stated, tmodel_mapping: "tmodel threat model (core)", notes: ""}
  - {name: DesignChangeRequest, definition: "DCR assessed for whether changes alter existing threats, vulnerabilities or mitigations.", attributes: [], locator: "Risk Analysis > Security Recommendations", kind: stated, tmodel_mapping: "change event on the KG → re-review (R-043 change tracking)", notes: ""}
  - {name: Tool, definition: "SDL-mandated compilers, linkers, analysis and testing tools with minimum versions and switches.", attributes: [name, minimum_version, options, recommended_version], locator: "Appendix E; Implementation", kind: stated, tmodel_mapping: "Component (toolchain) with policy", notes: ""}
  - {name: SecurityPush, definition: "Team-wide focus on threat model updates, code review, testing and documentation revision before release.", attributes: [preparation, duration], locator: "Phase Four > Security Push", kind: stated, tmodel_mapping: "Milestone (R-041)", notes: ""}
  - {name: SecurityMilestone, definition: "'Milestones include in-depth bug reviews, threat model reviews, and running all SDL-mandated tools.'", attributes: [kind, completed], locator: "The FSR Process", kind: stated, tmodel_mapping: "Milestone — FSR entry guard", notes: ""}
  - {name: FinalSecurityReview, definition: "Review by the security advisor 'to ensure that the software is secure enough to ship', four to six weeks before RTM/RTW.", attributes: [due_date, outcome, exceptions, required_changes, security_score], locator: "Phase Five > Final Security Review and Privacy Review", kind: stated, tmodel_mapping: "Gate (R-041) with Review (ARCH §4) — the canonical SDL release gate", notes: "state-machine.yaml machine fsr"}
  - {name: FSROutcome, definition: "Passed FSR / Passed FSR (with exceptions) / FSR escalation (and immediate FSR failure on omission or neglect).", attributes: [value], locator: "Possible FSR Outcomes", kind: stated, tmodel_mapping: "Gate result enum", notes: ""}
  - {name: Exception, definition: "Request to a security advisor when the team cannot meet a specific SDL requirement; granted if overall risk is tolerable; logged and corrected next release.", attributes: [requirement, justification, risk, decision], locator: "The FSR Process; Possible FSR Outcomes; SDL-Agile Exceptions", kind: stated, tmodel_mapping: "waiver / risk acceptance (R-042, DEC-009)", notes: ""}
  - {name: PrivacyReview, definition: "Pre-release and final privacy review signed off by the privacy advisor.", attributes: [outcome], locator: "Public Release Privacy Review; FSR > Privacy Requirements", kind: stated, tmodel_mapping: "parallel Gate", notes: ""}
  - {name: Release, definition: "RTM/RTW after FSR sign-off; archive of release materials.", attributes: [date, archive], locator: "Release to Manufacturing/Release to Web", kind: stated, tmodel_mapping: "ProductInstance version", notes: ""}
  - {name: ResponsePlan, definition: "Security response plan; sustained engineering team or emergency response contact.", attributes: [contacts, se_team], locator: "Release > Planning; Response", kind: stated, tmodel_mapping: "documentation-kind Mitigation (R-040)", notes: ""}
  - {name: AgileCategory, definition: "Every-sprint, bucket (verification tasks, design review, planning) or one-time.", attributes: [category, deadline], locator: "SDL-Agile Requirements; Appendices P-R", kind: stated, tmodel_mapping: "cadence attribute on Requirement (R-041)", notes: ""}
  - {name: Sprint, definition: "Agile iteration; incomplete if any every-sprint requirement is unmet.", attributes: [length], locator: "SDL-Agile Requirements", kind: stated, tmodel_mapping: "Milestone instance", notes: ""}
  - {name: ApplicationRiskLevel, definition: "LOB risk level High/Medium/Low mapped to a security SME service level.", attributes: [level, service_level], locator: "Phase One for LOB > Mapping Risk to Security SME Service Levels", kind: stated, tmodel_mapping: "risk tier driving required activities", notes: ""}
  - {name: PrivacyEscalation, definition: "Internal process to communicate a privacy-related incident (PERF sample).", attributes: [source, impact, validity, facts, timeline], locator: "Appendix K", kind: stated, tmodel_mapping: "incident (out of tmodel scope)", notes: ""}
edges:
  - {name: subject_to, from: Project, to: "SDL policy", cardinality: "N:1", definition: "questionnaire outcome", locator: "Project Inception", kind: stated, tmodel_mapping: "applicability of an SDL to a Product"}
  - {name: assigned, from: Project, to: SecurityAdvisor, cardinality: "N:1", definition: "'must be assigned a security advisor'", locator: "Project Inception", kind: stated, tmodel_mapping: "Party role edge"}
  - {name: in_phase, from: Requirement, to: Phase, cardinality: "N:1", definition: "", locator: "headings", kind: stated, tmodel_mapping: "applies_in_phase"}
  - {name: approves, from: SecurityAdvisor, to: BugBar, cardinality: "1:N", definition: "'negotiate a bug bar approved by the security advisor'", locator: "Project Inception", kind: stated, tmodel_mapping: "Review"}
  - {name: ranked_by, from: SecurityWorkItem, to: BugBar, cardinality: "N:1", definition: "bug bar ranking value recorded with each bug", locator: "Project Inception", kind: stated, tmodel_mapping: "severity"}
  - {name: scopes, from: SecurityRiskAssessment, to: ThreatModel, cardinality: "1:N", definition: "SRA names portions requiring threat models", locator: "Cost Analysis; Risk Analysis", kind: stated, tmodel_mapping: "in-scope set for R-042"}
  - {name: work_item_per_vulnerability, from: ThreatModel, to: SecurityWorkItem, cardinality: "1:N", definition: "'Create an individual work item for each vulnerability listed in the threat model so that your quality assurance team can verify that the mitigation is implemented'", locator: "Risk Analysis > Security Recommendations", kind: stated, tmodel_mapping: "ThreatInstance → MitigationInstance + verification (R-042)"}
  - {name: requires_milestones, from: FinalSecurityReview, to: SecurityMilestone, cardinality: "1:N", definition: "FSR cannot begin until milestone reviews complete", locator: "The FSR Process", kind: stated, tmodel_mapping: "Gate entry criteria"}
  - {name: reviews, from: FinalSecurityReview, to: ThreatModel, cardinality: "1:N", definition: "'Review threat models ... ensure that all known threats and vulnerabilities are identified and mitigated'", locator: "The FSR Process", kind: stated, tmodel_mapping: "the automatable 'threats-mitigated' check (R-042)"}
  - {name: reviews_deferred, from: FinalSecurityReview, to: SecurityWorkItem, cardinality: "1:N", definition: "deferred/rejected security issues reviewed against the bug bar", locator: "The FSR Process", kind: stated, tmodel_mapping: "Gate check over Findings"}
  - {name: has_outcome, from: FinalSecurityReview, to: FSROutcome, cardinality: "1:1", definition: "", locator: "Possible FSR Outcomes", kind: stated, tmodel_mapping: "Gate result"}
  - {name: grants, from: SecurityAdvisor, to: Exception, cardinality: "1:N", definition: "'A security advisor reviews these requests and, if the overall security risk is tolerable, might choose to grant the exception'", locator: "The FSR Process", kind: stated, tmodel_mapping: "Review approves waiver"}
  - {name: carried_to_next_release, from: Exception, to: Release, cardinality: "N:1", definition: "'logged and then addressed and corrected in the next release'", locator: "Possible FSR Outcomes", kind: stated, tmodel_mapping: "debt edge across ProductInstance versions"}
  - {name: gates, from: FinalSecurityReview, to: Release, cardinality: "1:1", definition: "RTM/RTW only after sign-off", locator: "Possible FSR Outcomes; RTM/RTW", kind: stated, tmodel_mapping: "Gate precedes phase transition"}
  - {name: categorised_as, from: Requirement, to: AgileCategory, cardinality: "N:1", definition: "SDL-Agile places each requirement in one category", locator: "SDL-Agile Requirements", kind: stated, tmodel_mapping: "cadence"}
  - {name: requires_activities, from: ApplicationRiskLevel, to: Practice, cardinality: "1:N", definition: "risk level → service level activities", locator: "LOB mapping table", kind: stated, tmodel_mapping: "risk-tiered requirement applicability"}
  - {name: impact_rated, from: Project, to: PrivacyImpactRating, cardinality: "N:1", definition: "", locator: "Cost Analysis", kind: stated, tmodel_mapping: "data classification"}
gaps:
  - "FSR 'security score of B or above' for services/LOB is used but never defined in the document (scale and computation absent)."
  - "Phases have no stated entry/exit criteria except the FSR; R-041 must not infer gates between other phases from SDL 5.2."
  - "Evidence is implicit (tool results, threat models, milestone reviews) — no evidence record, digest or retention rule; R-042 must add it."
  - "Requirements carry no ids in the source; citations must use our R-NNNN plus locator."
