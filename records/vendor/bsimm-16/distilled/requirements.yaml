note: "Ids: bsimm-16#<activity label> (e.g. SM1.4 — practice SM, level 1, number 4, as the report labels it), bsimm-16#<practice code>, bsimm-16#<DOMAIN>. BSIMM labels are reused across editions only for the same activity; an activity that changes level gets a NEW label (p.60), so former_ids carries the lineage from Table 9. normativity=descriptive-practice throughout: BSIMM 'descriptively observes, quantifies, and documents the actual activities carried out in SSIs' (p.60) and is not a requirement set; levels are observation-frequency bands, not maturity steps. phase is OUR canonical mapping per practice with per-activity overrides (supply-chain for open-source, SBOM, vendor and toolchain activities; release for checkpoint/sign-off/deployment-configuration activities). actor is inferred and flagged. observation.firms/percentage are from Figure 18; header_percentage is the figure printed in the Part 8 heading (two disagree: SR2.2, SE1.4 — see source_defect). maps_to is ONLY what BSIMM16 itself publishes: Table 3 (SSDF task references updated from BSIMM12 to BSIMM16 labels) and Table 4 (unofficial 'Could Add'). Text is the full activity description, verbatim, rejoined across PDF line and column breaks (end-of-line hyphens kept as printed)."
