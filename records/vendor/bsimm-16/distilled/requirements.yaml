    short_title: "AUTOMATE VERIFICATION OF OPERATIONAL INFRASTRUCTURE SECURITY."
    text: "The SSG works with engineering teams to verify with automation the security properties (e.g., adherence to agreed upon security hardening) of infrastructure generated from controlled self-service processes. Engineers use self-service processes to create networks, storage, containers, and machine instances, to orchestrate deployments, and to perform other tasks that were once IT’s sole responsibility. In facilitating verification, the organization uses machine-readable policies and configuration standards (see [SE1.4]) to automatically detect issues and report on infrastructure that does not meet expectations. In some cases, the automation makes changes to running environments to bring them into compliance, but in many cases, organizations use a single policy to manage automation in different environments, such as in multi- and hybrid-cloud environments."
