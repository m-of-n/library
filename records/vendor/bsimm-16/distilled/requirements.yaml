    short_title: "CREATE TECHNOLOGY- SPECIFIC ATTACK PATTERNS."
    text: "The SSG facilitates technology-specific attack pattern creation by collecting and providing knowledge about attacks relevant to the organization’s technologies. For example, if the organization’s cloud software relies on a cloud vendor’s security apparatus (e.g., key and secrets management), the SSG or appropriate SMEs can help catalog the quirks of the crypto package and how it might be exploited. Attack patterns directly related to the security frontier (e.g., AI, serverless) can be useful here as well. It’s often easiest to start with existing generalized attack patterns to create the needed technology-specific ones, but simply adding “for microservices” at the end of a generalized pattern name, for example, won’t suffice."
