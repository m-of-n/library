reconciliation: "bin/bcp14-count finds 1 uppercase keyword in the source: 'MUST' inside the all-caps pull quote on p.41 ('ESSENTIALLY, THE SSG IS A GROUP OF PEOPLE—WHETHER ONE PERSON, 10, OR 100—WHO MUST IMPROVE THE SECURITY POSTURE OF THE SOFTWARE PORTFOLIO.'). It is typographic capitalisation of a pull quote, not a BCP 14 keyword — BSIMM never invokes BCP 14 and is explicitly descriptive ('the only goal of the BSIMM is to observe and report', p.47) — so it is not extracted and the extracted count is 0. The document's own normative units are the baseline and reconcile exactly: 4 domains, 12 practices, 128 activities (stated on pp.45, 50; level 1: 40, level 2: 41, level 3: 47); every activity heading in Part 8 matches a row of Figure 18 (128/128) and Figure 8 (128/128). Entries: 4 domain + 12 practice + 128 activity = 144. Lowercase modal forms inside activity texts, for reference only: must 29, should 23, shall 0, may 0, required 11."
