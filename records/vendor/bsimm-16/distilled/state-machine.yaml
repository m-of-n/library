schema: "library-state-machine/v1"
record: bsimm-16
title: "BSIMM16 — SSI maturity states, and the lifecycle of an activity in the model"
extracted: "2026-10-02"
reviewed_by: ""
finding: >
  BSIMM activity LEVELS are not states: they are observation-frequency bands set by BSIMM's authors
  from the data pool ("Level 1 activities ... are those that are most observed", p.45). An
  organization does not move through levels; the model moves activities between levels. Two things
  in BSIMM16 do have lifecycle and are recorded here: (A) the three broad states of a software
  security initiative (emerging / maturing / enabling, p.19, Figure 6), and (B) the lifecycle of an
  activity inside the model across editions (added at level 3, moved, relabelled, dropped — pp.45,
  50-53, 60; Table 9).

machines:
  - id: ssi-state
    subject: "Software security initiative (SSI) of one organization"
    kind: stated-states-inferred-transitions
    locator: "Part 3, HOW TO BUILD OR UPGRADE AN SSI (p.19); Figure 6 (p.26)"
    states:
      - id: emerging
        kind: stated
        text: "Emerging. An emerging SSI has defined its initial strategy, chosen foundational activities (e.g., those observed most frequently in the data pool), acquired some resources, and created a general roadmap for the next 18 months. SSI leaders are likely resource constrained on both people and budget, so the SSG is usually small and uses compliance requirements or other executive mandates to drive participation and to continue adding activities. These leaders require strong, visible, and ongoing executive support to manage frictions with key stakeholders who are resistant to adopting foundational process discipline."
      - id: maturing
        kind: stated
        text: "Maturing. A maturing SSI has an in-place team, defined processes for interacting with software security stakeholders, and a documented software security approach that is clearly connected to executive expectations for both managing software security risk and progressing along a roadmap to scale security capabilities. A maturing SSI is learning from its existing efforts, likely making consistent, incremental improvements in the SSDL and key security integrations."
      - id: enabling
        kind: stated
        text: "Enabling. An enabling SSI ensures that all stakeholders can meet their objectives without putting the organization at unacceptable risk."
    transitions:
      - from: emerging
        to: maturing
        kind: stated
        trigger: "ongoing iterative improvements and expansions"
        text: "Moving from emerging to maturing requires ongoing iterative improvements and expansions. Piloting new capabilities (e.g., security champions or software supply chain risk management) likely requires reapplying the emerging approach for a specific set of activities."
        locator: "Figure 6 caption (p.26)"
      - from: maturing
        to: enabling
        kind: inferred
        trigger: "not stated; the report describes the enabling state's principles but no entry condition"
      - from: maturing
        to: "emerging (for a sub-capability)"
        kind: stated
        trigger: "piloting a new capability"
        text: "Piloting new capabilities ... likely requires reapplying the emerging approach for a specific set of activities."
    guards: "none stated; BSIMM gives no score threshold for any state ('We often refer to SSIs we’ve seen as being in one of three broad states', p.19)"
  - id: activity-in-model
    subject: "A BSIMM activity across editions"
    kind: stated
    locator: "pp.45, 50-53 (Table 9), 60"
    states:
      - {id: added, text: "new activities we add to the model start with zero observations and are therefore always added at level 3", locator: "p.60"}
      - {id: level-3, text: "level 3 activities (usually more difficult to implement and not always applicable) are more rarely observed", locator: "p.45"}
      - {id: level-2, text: "level 2 activities (often more difficult to implement and requiring more coordination) are less frequently observed", locator: "p.45"}
      - {id: level-1, text: "Level 1 activities (often straightforward and universally applicable) are those that are most observed across the data pool", locator: "p.45"}
      - {id: dropped, text: "In the history of the BSIMM, only one activity has been dropped from the framework ... CR1.3 was dropped in favor of T1.3.", locator: "p.45 ONE DROPPED ACTIVITY"}
    transitions:
      - {from: added, to: level-3, kind: stated, trigger: "edition release", locator: "p.60"}
      - {from: "level-n", to: "level-m", kind: stated, trigger: "annual edition analysis", guard: "the results of an intra-level standard deviation analysis and the trend in observation counts", effect: "the activity receives a NEW label; the old label is retired (e.g. [SE2.2] ... became [SE1.4] in BSIMM15)", locator: "p.60; Table 9"}
      - {from: "any", to: dropped, kind: stated, trigger: "duplicate of another activity (the only case so far)", locator: "p.45"}
    note: "BSIMM16 made no transitions at all: 'For the first time, there have been no changes to the BSIMM framework this year' (p.50). Table 9 (examples/table9-activity-changes.yaml) is the full transition log since BSIMM1."
