schema: "library-object-model/v1"
record: bsimm-16
source_version: "BSIMM16"
extracted: "2026-10-02"
reviewed_by: ""
method: >
  Object-model pass: the report was re-read (terminology box p.5, Part 5 scorecards, Part 6 roles,
  Part 7 framework, Part 8 activities, Part 9 data analysis) with one question — what entity types
  and edges does BSIMM assume or define? The BSIMM TERMINOLOGY box (p.5) defines most objects
  explicitly; those are `stated`.
objects:
  - {name: SoftwareSecurityFramework, definition: "The basic structure underlying the BSIMM, comprising 12 practices divided into four domains.", attributes: [edition], locator: "p.5 terminology (SSF); Table 7 p.45", kind: stated, tmodel_mapping: "SDL framework identity (library record)", notes: ""}
  - {name: Domain, definition: "One of the four categories the framework is divided into, i.e., Governance, Intelligence, SSDL Touchpoints, and Deployment.", attributes: [name, description], locator: "p.5; Table 7", kind: stated, tmodel_mapping: "grouping facet on Requirement (R-044)", notes: "Part 8 headings say 'SDLC TOUCHPOINTS' where the terminology says 'SSDL Touchpoints'."}
  - {name: Practice, definition: "A grouping of BSIMM activities. The SSF is organized into 12 practices, three in each of four domains.", attributes: [code, name, description], locator: "p.5; Part 8", kind: stated, tmodel_mapping: "Requirement group", notes: "12 instances."}
  - {name: Activity, definition: "Actions or efforts carried out or facilitated by the SSG as part of a practice. Activities are divided into three levels in the BSIMM based on observation rates.", attributes: [label, title, description, level], locator: "p.5; Part 8", kind: stated, tmodel_mapping: "Requirement (kind practice) / control; a process-kind MitigationInstance when adopted (R-040)", notes: "128 instances. The report frames activities as controls (preventive, detective, corrective, compensating — p.45)."}
  - {name: Level, definition: "Observation-frequency band 1-3 of an activity within its practice.", attributes: [number], locator: "p.45, p.60", kind: stated, tmodel_mapping: "attribute of Requirement — NOT a maturity state", notes: "Set by the model authors per edition."}
  - {name: Capability, definition: "A set of BSIMM activities spanning one or more practices working together to serve a cohesive security function.", attributes: [name, activities], locator: "p.5", kind: stated, tmodel_mapping: "new — a cross-practice bundle; candidate unit for a Gate exit criterion", notes: "Examples in Part 3 (e.g. security champions, software supply chain risk management)."}
  - {name: Edition, definition: "An annual BSIMM release (BSIMM1 ... BSIMM16) with its framework, data pool and activity labels.", attributes: [number, activity_count, data_pool_size], locator: "Table 9; p.50", kind: stated, tmodel_mapping: "version of the Requirement catalogue (library record supersedes chain)", notes: ""}
  - {name: Participant, definition: "The group of firms in the current data pool (111 in BSIMM16).", attributes: [name_or_anonymous, verticals, region], locator: "p.5 Participants; Part 4", kind: stated, tmodel_mapping: "Party (organization) — R-036", notes: ""}
  - {name: DataPool, definition: "The collection of assessment data from the current participants.", attributes: [size, edition], locator: "p.5", kind: stated, tmodel_mapping: "none (statistics)", notes: "Firms age out (Figure 21); BSIMM16 added 16, removed 26 (p.50)."}
  - {name: Vertical, definition: "Industry grouping of participants (Tech, Cloud, IoT, FinTech, Financial, ISV, Insurance, Healthcare).", attributes: [name, firms], locator: "Part 9; Table 15; Table 16", kind: stated, tmodel_mapping: "attribute of Party", notes: "A firm may sit in several verticals."}
  - {name: SSI, definition: "Software security initiative/program: an organization-wide program to instill, measure, manage, and evolve software security activities in a coordinated fashion.", attributes: [state, age], locator: "p.5; p.19", kind: stated, tmodel_mapping: "SDL / SecurityProgram (R-041)", notes: "Has a state emerging/maturing/enabling (state-machine.yaml)."}
  - {name: SSG, definition: "The internal group charged with carrying out and facilitating software security.", attributes: [size, leader, reporting_chain], locator: "p.5; Part 6", kind: stated, tmodel_mapping: "Party (organizational unit) with a role edge to the SDL", notes: "Default actor of activities."}
  - {name: Champion, definition: "Interested and engaged developers, engineers, architects, managers, testers or similar who have an active interest in software security (formerly 'satellite').", attributes: [role], locator: "p.5 Champions, Satellite", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: Role, definition: "Roles in an SSI: executive leadership, SSG leaders, the SSG, security champions, other key stakeholders.", attributes: [name], locator: "Part 6 ROLES IN A SOFTWARE SECURITY INITIATIVE", kind: stated, tmodel_mapping: "Party role edges (R-036)", notes: "Includes the CISO / nearest-executive reporting chain (Figures 9-12)."}
  - {name: SSDL, definition: "Any software lifecycle with integrated software security checkpoints and activities.", attributes: [checkpoints], locator: "p.5 Secure SDL", kind: stated, tmodel_mapping: "SDL (R-041)", notes: ""}
  - {name: Checkpoint, definition: "A point in a software lifecycle (gate, release condition, guardrail, milestone) where security conditions are gathered and, at SM1.7, enforced.", attributes: [location, conditions, enforced], locator: "[SM1.4], [SM1.7]", kind: stated, tmodel_mapping: "Gate (R-041) with exit criteria", notes: "BSIMM's word for our Gate; it explicitly lists 'gate, guardrail, milestone' as synonyms."}
  - {name: ReleaseCondition, definition: "A measure software must meet at a checkpoint, defined from policies, standards, regulations, contracts and other obligations.", attributes: [source_obligation], locator: "[SM1.7]", kind: stated, tmodel_mapping: "Requirement used as Gate exit criterion (R-042)", notes: ""}
  - {name: Exception, definition: "A tracked exception that lets a project move forward without meeting a release condition.", attributes: [condition, justification], locator: "[SM1.7] 'follow a defined process for obtaining an exception to move forward ... then track all exceptions'", kind: stated, tmodel_mapping: "risk-acceptance disposition on a ThreatInstance / Gate waiver (R-042)", notes: ""}
  - {name: SignOff, definition: "Formal risk acceptance by an accountable risk owner, using SSG-approved criteria, on the state of all software prior to release.", attributes: [risk_owner, criteria, acknowledged_vulnerabilities, skipped_steps], locator: "[SM2.6]", kind: stated, tmodel_mapping: "Review with verdict approved on a release Gate (ARCH §4/§5)", notes: "'formalized (e.g., with a signature, a form submission, or something similar) and captured for future reference'."}
  - {name: Scorecard, definition: "Per-firm table of activities marked observed (1) or not, compared with data-pool observation counts.", attributes: [firm, rows], locator: "Part 5; Figure 8", kind: stated, tmodel_mapping: "conformance/assessment view (R-043)", notes: ""}
  - {name: Observation, definition: "The fact that an activity was seen in a participant's SSI during assessment; aggregated as a count/percentage per edition.", attributes: [activity, firm, count, percentage], locator: "Figure 18; activity headings [ID: pct%]", kind: stated, tmodel_mapping: "Assertion (ARCH §4) with provenance = assessment", notes: ""}
  - {name: Assessment, definition: "An in-person interview-based BSIMM measurement of a firm's SSI, repeated over time (iterations).", attributes: [firm, date, iteration], locator: "p.45 ('we continue to do BSIMM assessments with in-person interviews'); Figure 17 iterations", kind: stated, tmodel_mapping: "Review / ConformanceAssessment", notes: ""}
  - {name: Score, definition: "A firm's BSIMM score; distribution binned in Figure 17.", attributes: [value], locator: "Figure 17; Figure 13", kind: inferred, tmodel_mapping: "derived view value", notes: "Never defined; inferred as the count of observed activities."}
  - {name: SoftwareAsset, definition: "Software and deployable artifacts tracked from creation to decommissioning; inventories (application, operations software inventory, SBOM).", attributes: [inventory, bom], locator: "[SM3.1], [CMVM2.3], [SE3.6], [AM1.2], [AM2.9]", kind: stated, tmodel_mapping: "Product / Component (§1 structural layer)", notes: ""}
  - {name: SoftwareDefect, definition: "A security defect found by testing, review or operations, tracked through the fix process.", attributes: [source, status], locator: "[CMVM1.2], [CMVM1.3], [PT1.2], [CR2.8]", kind: stated, tmodel_mapping: "Finding/Vulnerability", notes: ""}
  - {name: AttackPattern, definition: "Attack patterns, abuse cases, attack stories, top-N attacks lists, attack intelligence.", attributes: [technology], locator: "AM practice", kind: stated, tmodel_mapping: "AttackPattern (CAPEC) / ThreatActor", notes: "[AM1.3] Identify potential attackers."}
  - {name: SecurityStandard, definition: "Security standards, coding standards, SLA boilerplate, technology-stack standards.", attributes: [scope], locator: "SR practice", kind: stated, tmodel_mapping: "Requirement source document", notes: ""}
  - {name: DesignPattern, definition: "Secure-by-design components, services and approved security design patterns.", attributes: [status], locator: "SFD practice", kind: stated, tmodel_mapping: "Mitigation (technical) catalogue entry (D3FEND-like)", notes: ""}
  - {name: Mapping, definition: "Cross-reference between an SSDF task and a BSIMM activity label.", attributes: [ssdf_task, bsimm12, bsimm16, change], locator: "Tables 3, 4", kind: stated, tmodel_mapping: "Requirement.maps_to (R-044)", notes: ""}
edges:
  - {name: contains_practice, from: Domain, to: Practice, cardinality: "1:3", definition: "three practices in each of four domains", locator: "p.5; Table 7", kind: stated, tmodel_mapping: "grouping"}
  - {name: contains_activity, from: Practice, to: Activity, cardinality: "1:N", definition: "", locator: "p.5", kind: stated, tmodel_mapping: "grouping"}
  - {name: at_level, from: Activity, to: Level, cardinality: "N:1", definition: "observation band", locator: "p.45", kind: stated, tmodel_mapping: "attribute"}
  - {name: relabelled_as, from: Activity, to: Activity, cardinality: "1:1", definition: "an activity that changes level gets a new label ('X became Y')", locator: "p.60; Table 9", kind: stated, tmodel_mapping: "supersedes between Requirement versions"}
  - {name: dropped_in_favor_of, from: Activity, to: Activity, cardinality: "1:1", definition: "CR1.3 dropped in favor of T1.3", locator: "p.45", kind: stated, tmodel_mapping: "superseded_by"}
  - {name: references, from: Activity, to: Activity, cardinality: "N:M", definition: "'(see [XX])' cross-references inside descriptions", locator: "Part 8 passim", kind: stated, tmodel_mapping: "see_also / depends_on between Requirements"}
  - {name: groups, from: Capability, to: Activity, cardinality: "1:N", definition: "activities spanning practices", locator: "p.5", kind: stated, tmodel_mapping: "bundle"}
  - {name: observed_in, from: Activity, to: Participant, cardinality: "N:M", definition: "observation", locator: "Figure 18", kind: stated, tmodel_mapping: "Assertion with provenance"}
  - {name: has_scorecard, from: Participant, to: Scorecard, cardinality: "1:N", definition: "one per assessment (or per business unit)", locator: "Part 5 p.35-36", kind: stated, tmodel_mapping: "governed view (R-043)"}
  - {name: runs, from: Participant, to: SSI, cardinality: "1:1..N", definition: "an SSI per organization (sometimes aggregated across business units)", locator: "p.45", kind: stated, tmodel_mapping: "Party -> SDL"}
  - {name: staffed_by, from: SSI, to: SSG, cardinality: "1:1", definition: "", locator: "Part 6", kind: stated, tmodel_mapping: "Party role"}
  - {name: leverages, from: SSG, to: Champion, cardinality: "1:N", definition: "satellite organized and leveraged by an SSG", locator: "p.5", kind: stated, tmodel_mapping: "Party role"}
  - {name: carries_out, from: SSG, to: Activity, cardinality: "N:M", definition: "activities carried out or facilitated by the SSG", locator: "p.5", kind: stated, tmodel_mapping: "performed_by"}
  - {name: has_checkpoint, from: SSDL, to: Checkpoint, cardinality: "1:N", definition: "checkpoints at one or more points in a software lifecycle", locator: "[SM1.4]", kind: stated, tmodel_mapping: "SDL has ordered Gates (R-041)"}
  - {name: requires_condition, from: Checkpoint, to: ReleaseCondition, cardinality: "1:N", definition: "", locator: "[SM1.7]", kind: stated, tmodel_mapping: "Gate exit criterion"}
  - {name: excepted_by, from: ReleaseCondition, to: Exception, cardinality: "1:N", definition: "", locator: "[SM1.7]", kind: stated, tmodel_mapping: "waiver"}
  - {name: signs_off, from: SignOff, to: SoftwareAsset, cardinality: "N:1", definition: "risk owner signs off on the state of all software prior to release", locator: "[SM2.6]", kind: stated, tmodel_mapping: "Review approves release Gate"}
  - {name: tracked_through_fix, from: SoftwareDefect, to: SoftwareAsset, cardinality: "N:1", definition: "", locator: "[CMVM1.3]", kind: stated, tmodel_mapping: "Finding affects Component"}
  - {name: maps_to, from: Activity, to: "SSDF task", cardinality: "N:M", definition: "", locator: "Tables 3-4", kind: stated, tmodel_mapping: "R-044"}
  - {name: evidences, from: "Evidence (absent)", to: Observation, cardinality: "N:M", definition: "BSIMM records what assessors observed, not the artifacts", locator: "absence", kind: inferred, tmodel_mapping: "Evidence -> Requirement (R-042)"}
gaps:
  - "No evidence or work-product object: an Observation is an assessor's yes/no, not linked to artifacts — R-042 needs Evidence."
  - "Checkpoint/ReleaseCondition/Exception/SignOff are described inside activity prose ([SM1.4], [SM1.7], [SM2.6]) without ordering, dates or owners as data — R-041's Gate needs these as attributes."
  - "Levels are observation bands that change label across editions; tmodel's Requirement ids must be edition-qualified (bsimm-16#SM1.7, not SM1.7) and carry supersedes edges (Table 9)."
  - "No product-level binding: BSIMM measures an organization's SSI, never a product's threats/mitigations."
