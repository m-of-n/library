schema: "library-object-model/v1"
record: microsoft-sdl-simplified-2010
source_version: "updated 2010-11-04"
extracted: "2026-10-02"
reviewed_by: ""
method: "Object-model pass over the paper and companion spreadsheet: which entity types and edges are assumed or defined?"
objects:
  - {name: Organization, definition: "The adopting development organization, rated on the SDL Optimization Model.", attributes: [maturity_level_per_area], locator: "Microsoft SDL Optimization Model", kind: stated, tmodel_mapping: "Party (R-036)", notes: ""}
  - {name: CapabilityArea, definition: "Five areas 'that roughly correspond to the phases within the software development life cycle'.", attributes: [name], locator: "Microsoft SDL Optimization Model", kind: stated, tmodel_mapping: "coarse LifecyclePhase grouping", notes: ""}
  - {name: MaturityLevel, definition: "Basic, Standardized, Advanced, Dynamic.", attributes: [name, order], locator: "Microsoft SDL Optimization Model", kind: stated, tmodel_mapping: "MaturityLevel (shared with SAMM-style models)", notes: "'Advanced' = can claim SDL compliance."}
  - {name: Project, definition: "A software development project determined to be subject (or not) to the SDL.", attributes: [subject_to_sdl], locator: "SDL Applicability; Mandatory Security Activities", kind: stated, tmodel_mapping: "Product/ProductInstance release", notes: "Applicability criteria: business/enterprise deployment, PII/sensitive data, regular network communication."}
  - {name: Phase, definition: "Pre-SDL training, Requirements, Design, Implementation, Verification, Release.", attributes: [name], locator: "Mandatory Security Activities headings", kind: stated, tmodel_mapping: "LifecyclePhase (ARCH §3b)", notes: "Response is not a phase here (Incident Response Plan is a Release practice)."}
  - {name: Practice, definition: "One of sixteen mandatory SDL practices, or an optional activity.", attributes: [number, name, mandatory], locator: "SDL Practice 1..16; Optional Security Activities", kind: stated, tmodel_mapping: "Requirement (R-044)", notes: ""}
  - {name: SecurityAdvisor, definition: "SME from outside the project team; sub-roles Auditor ('attest to successful completion of each security requirement') and Expert.", attributes: [independence, expertise], locator: "Roles", kind: stated, tmodel_mapping: "Party role — Gate approver / auditor", notes: ""}
  - {name: PrivacyAdvisor, definition: "As security advisor, for privacy; certifies P1 products.", attributes: [], locator: "Roles; Practice 16", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: Champion, definition: "Security/privacy champion from the project team, coordinating and tracking issues and reporting status.", attributes: [], locator: "Roles", kind: stated, tmodel_mapping: "Party role (document owner)", notes: ""}
  - {name: QualityGate, definition: "Negotiated per development phase, approved by the security advisor (e.g. 'all compiler warnings must be triaged and fixed prior to code check-in').", attributes: [phase, criterion, approver], locator: "SDL Practice 3", kind: stated, tmodel_mapping: "Gate exit criterion (R-041)", notes: "Per-phase gates — closer to R-041 than SDL 5.2's single FSR."}
  - {name: BugBar, definition: "'a quality gate that applies to the entire software development project'; severity thresholds; 'should never be relaxed'.", attributes: [thresholds], locator: "SDL Practice 3", kind: stated, tmodel_mapping: "severity policy", notes: ""}
  - {name: RiskAssessment, definition: "SRA and PRA naming portions needing threat models, design reviews, pen tests, extra testing, fuzz scope, and the Privacy Impact Rating.", attributes: [scope, privacy_impact_rating], locator: "SDL Practice 4", kind: stated, tmodel_mapping: "scope of the threat model (R-042 in-scope set)", notes: ""}
  - {name: DesignSpecification, definition: "Security and privacy design specifications; minimal cryptographic design requirements.", attributes: [], locator: "SDL Practice 5", kind: stated, tmodel_mapping: "documentation-kind Mitigation (R-040)", notes: ""}
  - {name: ThreatModel, definition: "Team exercise; 'the primary security analysis task performed during the software design stage'; re-reviewed at code complete.", attributes: [], locator: "SDL Practices 7, 13", kind: stated, tmodel_mapping: "tmodel threat model", notes: ""}
  - {name: AttackSurface, definition: "Measured and reduced; re-reviewed at code complete.", attributes: [measurement], locator: "SDL Practices 6, 13", kind: stated, tmodel_mapping: "AttackSurface (ARCH §1)", notes: ""}
  - {name: ApprovedTool, definition: "Published list of approved tools and security checks, approved by the security advisor.", attributes: [], locator: "SDL Practice 8", kind: stated, tmodel_mapping: "Component (toolchain) policy", notes: ""}
  - {name: BannedFunction, definition: "Functions/APIs prohibited as unsafe.", attributes: [], locator: "SDL Practice 9", kind: stated, tmodel_mapping: "technical Requirement", notes: ""}
  - {name: IncidentResponsePlan, definition: "SE team or emergency response plan; 24x7 on-call contacts; servicing plans for inherited and third-party code.", attributes: [contacts, se_team, servicing_plans], locator: "SDL Practice 14", kind: stated, tmodel_mapping: "documentation-kind Mitigation", notes: ""}
  - {name: FinalSecurityReview, definition: "'a deliberate examination of all the security activities performed on a software application prior to release' — threat models, exception requests, tool output, quality gates/bug bars.", attributes: [outcome], locator: "SDL Practice 15", kind: stated, tmodel_mapping: "Gate (R-041) + Review", notes: ""}
  - {name: Exception, definition: "Exception requests examined at FSR; unresolved issues logged and corrected next release.", attributes: [], locator: "SDL Practice 15; Appendix A callout ('A formal exception or bug deferral method should be considered')", kind: stated, tmodel_mapping: "waiver / risk acceptance", notes: ""}
  - {name: ReleaseArchive, definition: "All specifications, source, binaries, private symbols, threat models, documentation, emergency response plans, third-party licence and servicing terms.", attributes: [contents], locator: "SDL Practice 16", kind: stated, tmodel_mapping: "governed snapshot (R-043) tied to a ProductInstance version", notes: ""}
  - {name: ComplianceTrackingApplication, definition: "'A specially designated application should be used to track compliance with the SDL' — central repository for SDL process artifacts and attestations, with access control and role separation.", attributes: [artifacts, access_control], locator: "Application Security Verification Process", kind: stated, tmodel_mapping: "the KG as SoT for SDL evidence (R-042/R-043)", notes: "The closest Microsoft text to tmodel's 'KG is the SoT, documents are views'."}
  - {name: ProcessAttestation, definition: "Artifacts uploaded to the tracking application: design and implementation notes, threat models, tool log uploads, other process attestations.", attributes: [kind], locator: "Application Security Verification Process", kind: stated, tmodel_mapping: "Evidence (R-042)", notes: ""}
  - {name: RootCauseAnalysis, definition: "Investigation of where security processes failed when a previously unknown vulnerability is found.", attributes: [cause_kind], locator: "Other Process Requirements", kind: stated, tmodel_mapping: "feedback into Requirement revision", notes: "Causes: human error, tool failure, policy failure."}
edges:
  - {name: rated_at, from: Organization, to: MaturityLevel, cardinality: "N:1 per CapabilityArea", definition: "", locator: "Optimization Model", kind: stated, tmodel_mapping: ""}
  - {name: in_phase, from: Practice, to: Phase, cardinality: "N:1", definition: "", locator: "headings", kind: stated, tmodel_mapping: "applies_in_phase"}
  - {name: approves, from: SecurityAdvisor, to: QualityGate, cardinality: "1:N", definition: "quality gates approved by the security advisor", locator: "SDL Practice 3", kind: stated, tmodel_mapping: "Review approves Gate criteria"}
  - {name: attests, from: SecurityAdvisor, to: Practice, cardinality: "1:N", definition: "'attest to successful completion of each security requirement'", locator: "Roles (Auditor)", kind: stated, tmodel_mapping: "Review over Requirement conformance (R-042)"}
  - {name: scopes, from: RiskAssessment, to: ThreatModel, cardinality: "1:N", definition: "", locator: "SDL Practice 4", kind: stated, tmodel_mapping: "in-scope set"}
  - {name: examines, from: FinalSecurityReview, to: "ThreatModel | Exception | ApprovedTool output | QualityGate", cardinality: "1:N", definition: "", locator: "SDL Practice 15", kind: stated, tmodel_mapping: "Gate checks"}
  - {name: certifies_release, from: SecurityAdvisor, to: ReleaseArchive, cardinality: "1:1", definition: "must certify before RTM/RTW", locator: "SDL Practice 16", kind: stated, tmodel_mapping: "Review on release Gate"}
  - {name: stores, from: ComplianceTrackingApplication, to: ProcessAttestation, cardinality: "1:N", definition: "", locator: "Application Security Verification Process", kind: stated, tmodel_mapping: "KG holds Evidence"}
  - {name: enters_data, from: Champion, to: ComplianceTrackingApplication, cardinality: "N:1", definition: "team leads categorise and enter data", locator: "Application Security Verification Process", kind: stated, tmodel_mapping: "provenance of Evidence (ARCH §4)"}
gaps:
  - "Optimization-model level criteria are not in this paper; only 'Advanced = the sixteen practices'."
  - "Quality gates are per phase but unnamed and undated; R-041 must add ordering, dates and owners."
  - "Process attestations have no schema, digest or freshness rule — R-042 must define Evidence integrity."
