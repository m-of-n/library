schema: "library-state-machine/v1"
record: microsoft-sdl-simplified-2010
title: "Simplified SDL — SDL Optimization Model maturity levels, and the FSR / release gate"
extracted: "2026-10-02"
reviewed_by: ""
machines:
  - id: sdl-optimization-model
    subject: "an organization's development process, per capability area"
    locator: "Microsoft SDL Optimization Model"
    capability_areas: ["Training, policy, and organizational capabilities", "Requirements and design", "Implementation", "Verification", "Release and response"]
    states:
      - {id: basic, kind: stated, text: "The SDL Optimization Model starts at the Basic level of maturity, with little or no process, training, and tooling in place, and progresses to the Dynamic level, which is characterized by complete SDL compliance across an entire organization."}
      - {id: standardized, kind: stated, text: "Additionally, the SDL Optimization Model defines four levels of maturity for the practices and capabilities in these areas—Basic, Standardized, Advanced, and Dynamic."}
      - {id: advanced, kind: stated, text: "This paper focuses on the tasks and processes necessary to achieve the “advanced” maturity level. That is, the point where an organization demonstrating competence in each of the five capability areas mentioned earlier can reasonably claim to follow the practices of the Microsoft SDL."}
      - {id: dynamic, kind: stated, text: "Complete SDL compliance includes efficient and effective processes, highly trained individuals, specialized tooling, and strong accountability to parties both internal and external to the organization."}
    transitions:
      - {from: basic, to: standardized, kind: inferred, trigger: "not described in this paper"}
      - {from: standardized, to: advanced, kind: stated, trigger: "completing the sixteen mandatory practices with tracking", text: "It outlines a series of discrete, non-proprietary security development activities that when joined with effective process automation and solid policy guidance represent the steps necessary for an organization to objectively claim compliance with the Microsoft SDL as defined by the “Advanced” level in the SDL Optimization Model."}
      - {from: advanced, to: dynamic, kind: inferred, trigger: "not described"}
    note: "Levels are named and ordered; per-level criteria other than 'Advanced = the sixteen practices' are not in this paper (they were in the separate SDL Optimization Model documents)."
  - id: fsr-release
    subject: "a software release subject to the SDL"
    locator: "SDL Practice 15: Final Security Review; SDL Practice 16: Release/Archive"
    states:
      - {id: passed, kind: stated, text: "Passed FSR. All security and privacy issues identified by the FSR process are fixed or mitigated."}
      - {id: passed-with-exceptions, kind: stated, text: "Passed FSR with exceptions. All security and privacy issues identified by the FSR process are fixed or mitigated and/or all exceptions are satisfactorily resolved. Those issues that cannot be addressed (for example, vulnerabilities posed by legacy “design level” issues) are logged and corrected in the next release."}
      - {id: escalation, kind: stated, text: "FSR with escalation. If a team does not meet all SDL requirements and the security advisor and the product team cannot reach an acceptable compromise, the security advisor cannot approve the project, and the project cannot be released."}
      - {id: released, kind: stated, text: "Software release to manufacturing (RTM) or release to Web (RTW) is conditional on completion of the SDL process."}
    transitions:
      - {from: passed, to: released, kind: stated, guard: "The security advisor assigned to the release must certify (using the FSR and other data) that the project team has satisfied security requirements."}
      - {from: passed-with-exceptions, to: released, kind: stated, guard: "as above; exceptions logged and corrected in the next release"}
      - {from: escalation, to: released, kind: stated, trigger: "executive decision", text: "Teams must either address whatever SDL requirements that they can prior to launch or escalate to executive management for a decision."}
    guards:
      - {text: "Similarly, for all products that have at least one component with a Privacy Impact Rating of P1, the project’s privacy advisor must certify that the project team has satisfied the privacy requirements before the software can be shipped.", kind: stated}
      - {text: "The project team must also illustrate compliance with the negotiated quality gates in order to complete the Final Security Review (FSR).", kind: stated}
