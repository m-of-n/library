  - id: "microsoft-sdl-simplified-2010#XLS-Design-3.1"
    designator: "Design 3.1"
    entry_type: "spreadsheet-row"
    normativity: "recommendation"
    verb: "required"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "design"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Design 3.1\""
    short_title: "Establish Security Design Requirements"
    text: "The design requirements activity contains a number of required actions. Examples include the creation of security and privacy design specifications, specification review, and specification of minimal cryptographic design requirements. Design specifications should describe security or privacy features that will be directly exposed to users, such as those that require user authentication to access specific data or user consent before use of a high-risk privacy feature. In addition, all design specifications should describe how to securely implement all functionality provided by a given feature or function. It’s a good practice to validate design specifications against the application’s functional specification. The functional specification should:\n• Accurately and completely describe the intended use of a feature or function.\n• Describe how to deploy the feature or function in a secure fashion."
    expects_deliverables: []
