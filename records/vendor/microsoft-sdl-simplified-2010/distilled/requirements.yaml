    additional_notes: "A list of Microsoft's SDL-related Implementation tools can be found at: http://www.microsoft.com/security/sdl/adopt/tools.aspx\n\nThe SDL Pro Network Tools members can be accessed at:http://www.microsoft.com/security/sdl/adopt/pronetwork.aspx"
  - id: "microsoft-sdl-simplified-2010#XLS-Verification-5.2"
    designator: "Verification 5.2"
