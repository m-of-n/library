    phase: "design"
    locator: "Mandatory Security Activities > Phase Two: Design > SDL Practice 7: Threat Modeling"
    short_title: "Threat Modeling"
    text: "Threat modeling is used in environments where there is meaningful security risk. It is a practice that allows development teams to consider, document, and discuss the security implications of designs in the context of their planned operational environment and in a structured fashion. Threat modeling also allows consideration of security issues at the component or application level. Threat modeling is a team exercise, encompassing program/project managers, developers, and testers, and represents the primary security analysis task performed during the software design stage."
    expects_deliverables:
