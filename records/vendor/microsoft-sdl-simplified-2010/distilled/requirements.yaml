    testable_reason: "advisor judgement; no objective acceptance criteria"
  - id: "microsoft-sdl-simplified-2010#PROC-root-cause-analysis"
    designator: "PROC-root-cause-analysis"
    entry_type: "process-requirement"
    normativity: "recommendation"
    verb: "should"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "governance"
    locator: "Simplified Implementation of the Microsoft SDL > Other Process Requirements > Root Cause Analysis"
    short_title: "Root Cause Analysis"
    text: "While not traditionally a part of the software development process, root cause analysis plays an important part in ensuring software security. Upon discovery of a previously unknown vulnerability, an investigation should be performed to ascertain precisely where the security processes failed. These vulnerabilities can be attributed to a variety of causes, including human error, tool failure, and policy failure. The goal of root cause analysis is to understand the precise nature of the failure. This information helps to ensure that errors of the same type are accounted for in future revisions of the SDL."
    expects_deliverables: []
    verification: "at the security advisor's discretion"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
  - id: "microsoft-sdl-simplified-2010#PROC-periodic-process-updates"
    designator: "PROC-periodic-process-updates"
    entry_type: "process-requirement"
    normativity: "recommendation"
    verb: "should"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "governance"
    locator: "Simplified Implementation of the Microsoft SDL > Other Process Requirements > Periodic Process Updates"
    short_title: "Periodic Process Updates"
    text: "Software threats are not static. As a result, the process used to secure software cannot be static. Organizations should take the knowledge learned from practices such as root cause analysis, policy changes, and improvements in technology and automation, and apply them to the SDL on a predictable schedule. Generally speaking, a yearly update schedule should suffice. The exception to this rule is when new, previously unknown vulnerability types are identified. This phenomenon requires immediate, out-of-cycle revision of the SDL to ensure proper mitigations are in place going forward."
    expects_deliverables: []
    verification: "at the security advisor's discretion"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
  - id: "microsoft-sdl-simplified-2010#PROC-application-security-verification-proces"
    designator: "PROC-application-security-verification-proces"
    entry_type: "process-requirement"
    normativity: "requirement"
    verb: "must"
    actor: "development/project team (inferred)"
    nature: "deliverable"
    phase: "governance"
    locator: "Simplified Implementation of the Microsoft SDL > Application Security Verification Process"
    short_title: "Application Security Verification Process"
    text: "Organizations developing secure software will naturally want a means to verify that the processes outlined in the Microsoft SDL have been followed. Access to centralized development and test data helps decision-making in a number of important scenarios, such as the Final Security Review, SDL requirement exception handling, and security audits. The process of verifying application security involves a number of different processes and actors:\n\nA specially designated application should be used to track compliance with the SDL. This application serves as the central repository for all SDL process artifacts, including (but not limited to) design and implementation notes, threat models, tool log uploads, and other process attestations. As with any critical application, it should use access controls to ensure:\n\n- Only authorized personnel can use the application.\n\n- Strong separation between roles. For example, a developer may be able to use the application and upload data, but should be prohibited from accessing functionality reserved for the security and privacy advisors, security team leads, and testers.\n\n- The security and privacy team leads are responsible for ensuring that the data necessary for an objective judgment is properly categorized and entered into the tracking application.\n\n- The information entered into the tracking application is used by the security and privacy advisors to provide the analysis framework for the Final Security Review.\n\n- The security and privacy advisors are responsible for reviewing the data entered into the tracking application (including the FSR results and other additional security tasks assigned by the advisors) and certifying that all requirements are met and/or all exceptions are satisfactorily resolved.\n\nThis document focuses on the Advanced level of the SDL Optimization Model, where rudimentary tracking processes are (in most instances) insufficient to the task. However, organizations with less sophisticated processes or smaller resource pools—those who fit within the Basic or Standardized levels of the SDL Optimization Model—can likely make do with a simpler tracking process.\n\nIt is very important that the tracking and verification process accurately capture:\n\nThe security and privacy requirements of the organization (for example, no known critical vulnerabilities at release).\n\nThe functional and technical requirements of the application under development.\n\nThe application’s operational context.\n\nFor example, if a development team creates a process control application to run in a critical environment, the proper investment of time and resources must be allocated to the creation and maintenance of the tracking process to enable objective analyses by the organization’s security and privacy principals, executive leadership, and relevant third parties such as compliance auditors or evaluators. Put differently, skimping on the tracking process inevitably leads to problems later, usually during an emergency. Ensure that reliable systems are in place to answer critical questions at critical times."
    expects_deliverables: []
    verification: "Final Security Review by the security advisor; tracked in the SDL compliance tracking application (Application Security Verification Process)"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
  - id: "microsoft-sdl-simplified-2010#XLS-Training-1.0"
