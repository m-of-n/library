  - id: "microsoft-sdl-simplified-2010#XLS-Requirements-2.2"
    designator: "Requirements 2.2"
    entry_type: "spreadsheet-row"
    normativity: "requirement"
    verb: "must"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "requirements"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Requirements 2.2\""
    short_title: "Create Quality Gates/Bug Bars"
    text: "Quality gates and bug bars are used to establish minimum acceptable levels of security and privacy quality. Defining these criteria at the start of a project improves the understanding of risks associated with security issues and enables teams to identify and fix security bugs during development. A project team must negotiate quality gates (for example, all compiler warnings must be triaged and fixed prior to code check-in) for each development phase, and then have them approved by the security advisor, who may add project-specific clarifications and more stringent security requirements as appropriate. The project team must also illustrate compliance with the negotiated quality gates in order to complete the Final Security Review (FSR). \n\nA process should be defined to regulate the approval of exceptions to the Quality Gate/Bug Bar throughout the lifecycle of your project. This exception process should require approval from both product team management and security experts who understand any potential risks associated with a security exception and can make plans for mitigation in both Incident Response Planning and future product cycles."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "A sample security bug bar document is available at http://msdn.microsoft.com/en-us/library/cc307404.aspx."
  - id: "microsoft-sdl-simplified-2010#XLS-Requirements-2.3"
    designator: "Requirements 2.3"
    entry_type: "spreadsheet-row"
    normativity: "requirement"
    verb: "must"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "requirements"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Requirements 2.3\""
    short_title: "Perform Security & Privacy Risk Assessment"
    text: "Security risk assessments (SRAs) and privacy risk assessments (PRAs) are mandatory processes that identify functional aspects of the software that require deep review. Such assessments must include the following information:\n\n• (Security) Which portions of the project will require threat models before release?\n• (Security) Which portions of the project will require security design reviews before release?\n• (Security) Which portions of the project (if any) will require penetration testing by a mutually agreed upon group that is external to the project team? \n• (Security) Are there any additional testing or analysis requirements the security advisor deems necessary to mitigate security risks?\n• (Security) What is the specific scope of the fuzz testing requirements?\n• (Privacy) What is the Privacy Impact Rating? The answer to this question is based on the following guidelines:\n \nP1 High Privacy Risk: The feature, product, or service stores or transfers PII, changes settings or file type associations, or installs software.\nP2 Moderate Privacy Risk: The sole behavior that affects privacy in the feature, product, or service is a one-time, user-initiated, anonymous data transfer (for example, the user clicks on a link and the software goes out to a Web site).\nP3 Low Privacy Risk: No behaviors exist within the feature, product, or service that affect privacy. No anonymous or personal data is transferred, no PII is stored on the machine, no settings are changed on the user's behalf, and no software is installed."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "A sample Privacy Questionairre to guide your risk assessment can be found here: http://msdn.microsoft.com/en-us/library/cc307393.aspx"
  - id: "microsoft-sdl-simplified-2010#XLS-Design-3.0"
