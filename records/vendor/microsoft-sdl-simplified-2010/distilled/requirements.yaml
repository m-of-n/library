  - id: "microsoft-sdl-simplified-2010#SP-15"
    designator: "SP-15"
    entry_type: "mandatory-practice"
    normativity: "requirement"
    verb: "must"
    actor: "security advisor (with development staff and security and privacy team leads)"
    nature: "deliverable"
    phase: "release"
    locator: "Mandatory Security Activities > Phase Five: Release > SDL Practice 15: Final Security Review"
    short_title: "Final Security Review"
    text: "The Final Security Review (FSR) is a deliberate examination of all the security activities performed on a software application prior to release. The FSR is performed by the security advisor with assistance from the regular development staff and the security and privacy team leads. The FSR is not a “penetrate and patch” exercise, nor is it a chance to perform security activities that were previously ignored or forgotten. The FSR usually includes an examination of threat models, exception requests, tool output, and performance against the previously determined quality gates or bug bars. The FSR results in one of three different outcomes:\n\nPassed FSR. All security and privacy issues identified by the FSR process are fixed or mitigated.\n\nPassed FSR with exceptions. All security and privacy issues identified by the FSR process are fixed or mitigated and/or all exceptions are satisfactorily resolved. Those issues that cannot be addressed (for example, vulnerabilities posed by legacy “design level” issues) are logged and corrected in the next release.\n\nFSR with escalation. If a team does not meet all SDL requirements and the security advisor and the product team cannot reach an acceptable compromise, the security advisor cannot approve the project, and the project cannot be released. Teams must either address whatever SDL requirements that they can prior to launch or escalate to executive management for a decision."
    expects_deliverables:
      - "FSR result"
    verification: "Final Security Review by the security advisor; tracked in the SDL compliance tracking application (Application Security Verification Process)"
    kind: "stated"
