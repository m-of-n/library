  - id: "microsoft-sdl-simplified-2010#XLS-Release-6.2"
    designator: "Release 6.2"
    entry_type: "spreadsheet-row"
    normativity: "requirement"
    verb: "must"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "release"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Release 6.2\""
    short_title: "Perform a Final Security Review"
    text: "The Final Security Review (FSR) is a deliberate examination of all the security activities performed on a software application prior to release. The FSR is performed by the security advisor with assistance from the regular development staff and the security and privacy team leads. The FSR is not a “penetrate and patch” exercise, nor is it a chance to perform security activities that were previously ignored or forgotten. The FSR usually includes an examination of threat models, exception requests, tool output, and performance against the previously determined quality gates or bug bars. The FSR results in one of three different outcomes:\n\n• Passed FSR. All security and privacy issues identified by the FSR process are fixed or mitigated.\n• Passed FSR with exceptions. All security and privacy issues identified by the FSR process are fixed or mitigated and/or all exceptions are satisfactorily resolved. Those issues that cannot be addressed (for example, vulnerabilities posed by legacy “design level” issues) are logged and corrected in the next release.\n• FSR with escalation. If a team does not meet all SDL requirements and the security advisor and the product team cannot reach an acceptable compromise, the security advisor cannot approve the project, and the project cannot be released. Teams must either address whatever SDL requirements that they can prior to launch or escalate to executive management for a decision."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
  - id: "microsoft-sdl-simplified-2010#XLS-Release-6.3"
    designator: "Release 6.3"
    entry_type: "spreadsheet-row"
    normativity: "requirement"
    verb: "must"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "release"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Release 6.3\""
    short_title: "Archive all Release Data"
    text: "Software release to manufacturing (RTM) or release to Web (RTW) is conditional on completion of the SDL process. The security advisor assigned to the release must certify (using the FSR and other data) that the project team has satisfied security requirements. Similarly, for all products that have at least one component with a Privacy Impact Rating of P1, the project’s privacy advisor must certify that the project team has satisfied the privacy requirements before the software can be shipped.\n\nIn addition, all pertinent information and data must be archived to allow for post-release servicing of the software. This includes all specifications, source code, binaries, private symbols, threat models, documentation, emergency response plans, license and servicing terms for any third-party software and any other data necessary to perform post-release servicing tasks."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
