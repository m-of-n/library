  - id: "microsoft-sdl-simplified-2010#SP-16"
    designator: "SP-16"
    entry_type: "mandatory-practice"
    normativity: "requirement"
    verb: "must"
    actor: "security advisor; privacy advisor (P1); project team"
    nature: "deliverable"
    phase: "release"
    locator: "Mandatory Security Activities > Phase Five: Release > SDL Practice 16: Release/Archive"
    short_title: "Release/Archive"
    text: "Software release to manufacturing (RTM) or release to Web (RTW) is conditional on completion of the SDL process. The security advisor assigned to the release must certify (using the FSR and other data) that the project team has satisfied security requirements. Similarly, for all products that have at least one component with a Privacy Impact Rating of P1, the project’s privacy advisor must certify that the project team has satisfied the privacy requirements before the software can be shipped.\n\nIn addition, all pertinent information and data must be archived to allow for post-release servicing of the software. This includes all specifications, source code, binaries, private symbols, threat models, documentation, emergency response plans, license and servicing terms for any third-party software and any other data necessary to perform post-release servicing tasks."
    expects_deliverables:
      - "release archive"
      - "security advisor certification"
      - "privacy advisor certification (P1)"
    verification: "Final Security Review by the security advisor; tracked in the SDL compliance tracking application (Application Security Verification Process)"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
    deliverables_note: "named in the practice text; list is ours"
  - id: "microsoft-sdl-simplified-2010#OPT-manual-code-review"
    designator: "OPT-manual-code-review"
    entry_type: "optional-practice"
    normativity: "recommendation"
    verb: "descriptive"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "implementation"
    locator: "Simplified SDL Security Activities > Optional Security Activities > Manual Code Review"
    short_title: "Manual Code Review"
    text: "Manual code review is an optional task in the SDL and is usually performed by highly skilled individuals on the application security team and/or the security advisor. While analysis tools can do much of the work of finding and flagging vulnerabilities, they are not perfect. As a result, manual code review is usually focused on the “critical” components of an application. Most often it is used where sensitive data, such as personally identifiable information (PII), is processed or stored. It is also used to examine other critical functionality such as cryptographic implementations."
    expects_deliverables: []
    verification: "at the security advisor's discretion"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
  - id: "microsoft-sdl-simplified-2010#OPT-penetration-testing"
    designator: "OPT-penetration-testing"
    entry_type: "optional-practice"
    normativity: "recommendation"
    verb: "descriptive"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "verification"
    locator: "Simplified SDL Security Activities > Optional Security Activities > Penetration Testing"
    short_title: "Penetration Testing"
    text: "Penetration testing is a white box security analysis of a software system performed by skilled security professionals simulating the actions of a hacker. The objective of a penetration test is to uncover potential vulnerabilities resulting from coding errors, system configuration faults, or other operational deployment weaknesses. Penetration tests are often performed in conjunction with automated and manual code reviews to provide a greater level of analysis than would ordinarily be possible."
    expects_deliverables: []
    verification: "at the security advisor's discretion"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
  - id: "microsoft-sdl-simplified-2010#OPT-vulnerability-analysis-of-similar-applications"
    designator: "OPT-vulnerability-analysis-of-similar-applications"
    entry_type: "optional-practice"
    normativity: "recommendation"
    verb: "descriptive"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "design"
    locator: "Simplified SDL Security Activities > Optional Security Activities > Vulnerability Analysis of Similar Applications"
    short_title: "Vulnerability Analysis of Similar Applications"
    text: "Many reputable sources of information about software vulnerabilities can be found on the Internet. In some cases, the analysis of vulnerabilities found in analogous software applications can shed light on potential design or implementation issues in software under development."
    expects_deliverables: []
    verification: "at the security advisor's discretion"
    kind: "stated"
