    locator: "Mandatory Security Activities > Phase Two: Design > SDL Practice 6: Attack Surface Reduction"
    short_title: "Attack Surface Reduction"
    text: "Attack surface reduction is closely aligned with threat modeling, although it addresses security issues from a slightly different perspective. Attack surface reduction is a means of reducing risk by giving attackers less opportunity to exploit a potential weak spot or vulnerability. Attack surface reduction encompasses shutting off or restricting access to system services, applying the principle of least privilege, and employing layered defenses wherever possible."
