    locator: "Mandatory Security Activities > Phase One: Requirements > SDL Practice 2: Security Requirements"
    short_title: "Security Requirements"
    text: "The need to consider security and privacy “up front” is a fundamental aspect of secure system development. The optimal point to define trustworthiness requirements for a software project is during the initial planning stages. This early definition of requirements allows development teams to identify key milestones and deliverables, and permits the integration of security and privacy in a way that minimizes any disruption to plans and schedules. Security and privacy requirements analysis is performed at project inception and includes specification of minimum security requirements for the application as it is designed to run in its planned operational environment and specification and deployment of a security vulnerability/work item tracking system."
    expects_deliverables:
      - "minimum security requirements"
      - "security vulnerability/work item tracking system"
    verification: "Final Security Review by the security advisor; tracked in the SDL compliance tracking application (Application Security Verification Process)"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
    deliverables_note: "named in the practice text; list is ours"
  - id: "microsoft-sdl-simplified-2010#SP-03"
    designator: "SP-03"
    entry_type: "mandatory-practice"
    normativity: "requirement"
    verb: "must"
    actor: "development/project team (inferred)"
    nature: "deliverable"
    phase: "requirements"
    locator: "Mandatory Security Activities > Phase One: Requirements > SDL Practice 3: Quality Gates/Bug Bars"
    short_title: "Quality Gates/Bug Bars"
    text: "Quality gates and bug bars are used to establish minimum acceptable levels of security and privacy quality. Defining these criteria at the start of a project improves the understanding of risks associated with security issues and enables teams to identify and fix security bugs during development. A project team must negotiate quality gates (for example, all compiler warnings must be triaged and fixed prior to code check-in) for each development phase, and then have them approved by the security advisor, who may add project-specific clarifications and more stringent security requirements as appropriate. The project team must also illustrate compliance with the negotiated quality gates in order to complete the Final Security Review (FSR).\n\nA bug bar is a quality gate that applies to the entire software development project. It is used to define the severity thresholds of security vulnerabilities—for example, no known vulnerabilities in the application with a “critical” or “important” rating at time of release. The bug bar, once set, should never be relaxed. A dynamic bug bar is a moving target that is likely to be poorly understood within the development organization."
    expects_deliverables:
      - "quality gates"
      - "bug bar"
    verification: "Final Security Review by the security advisor; tracked in the SDL compliance tracking application (Application Security Verification Process)"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
    deliverables_note: "named in the practice text; list is ours"
  - id: "microsoft-sdl-simplified-2010#SP-04"
    designator: "SP-04"
    entry_type: "mandatory-practice"
    normativity: "requirement"
    verb: "must"
    actor: "development/project team (inferred)"
    nature: "deliverable"
    phase: "requirements"
    locator: "Mandatory Security Activities > Phase One: Requirements > SDL Practice 4: Security and Privacy Risk Assessment"
    short_title: "Security and Privacy Risk Assessment"
    text: "Security risk assessments (SRAs) and privacy risk assessments (PRAs) are mandatory processes that identify functional aspects of the software that require deep review. Such assessments must include the following information:\n\n(Security) Which portions of the project will require threat models before release?\n\n(Security) Which portions of the project will require security design reviews before release?\n\n(Security) Which portions of the project (if any) will require penetration testing by a mutually agreed upon group that is external to the project team?\n\n(Security) Are there any additional testing or analysis requirements the security advisor deems necessary to mitigate security risks?\n\n(Security) What is the specific scope of the fuzz testing requirements?\n\n(Privacy) What is the Privacy Impact Rating? The answer to this question is based on the following guidelines:\n\nP1 High Privacy Risk. The feature, product, or service stores or transfers PII, changes settings or file type associations, or installs software.\n\nP2 Moderate Privacy Risk. The sole behavior that affects privacy in the feature, product, or service is a one-time, user-initiated, anonymous data transfer (for example, the user clicks on a link and the software goes out to a Web site).\n\nP3 Low Privacy Risk. No behaviors exist within the feature, product, or service that affect privacy. No anonymous or personal data is transferred, no PII is stored on the machine, no settings are changed on the user's behalf, and no software is installed."
    expects_deliverables:
      - "security risk assessment (SRA)"
      - "privacy risk assessment (PRA)"
      - "Privacy Impact Rating"
    verification: "Final Security Review by the security advisor; tracked in the SDL compliance tracking application (Application Security Verification Process)"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
    deliverables_note: "named in the practice text; list is ours"
  - id: "microsoft-sdl-simplified-2010#SP-05"
    designator: "SP-05"
    entry_type: "mandatory-practice"
    normativity: "requirement"
    verb: "required"
    actor: "development/project team (inferred)"
    nature: "deliverable"
    phase: "design"
    locator: "Mandatory Security Activities > Phase Two: Design > SDL Practice 5: Design Requirements"
    short_title: "Design Requirements"
    text: "The optimal time to influence a project’s design trustworthiness is early in its life cycle. It is critically important to consider security and privacy concerns carefully during the design phase. Mitigation of security and privacy issues is much less expensive when performed during the opening stages of a project life cycle. Project teams should refrain from the practice of “bolting on” security and privacy features and mitigations near the end of a project’s development.\n\nIn addition, it is crucially important for project teams to understand the distinction between “secure features” and “security features.” It is quite possible to implement security features, which are in fact, insecure. Secure features are defined as features whose functionality is well engineered with respect to security, including rigorous validation of all data before processing or cryptographically robust implementation of libraries for cryptographic services. The term security features describes program functionality with security implications, such as Kerberos authentication or a firewall.\n\nThe design requirements activity contains a number of required actions. Examples include the creation of security and privacy design specifications, specification review, and specification of minimal cryptographic design requirements. Design specifications should describe security or privacy features that will be directly exposed to users, such as those that require user authentication to access specific data or user consent before use of a high-risk privacy feature. In addition, all design specifications should describe how to securely implement all functionality provided by a given feature or function. It’s a good practice to validate design specifications against the application’s functional specification. The functional specification should:\n\nAccurately and completely describe the intended use of a feature or function.\n\nDescribe how to deploy the feature or function in a secure fashion."
    expects_deliverables:
      - "security and privacy design specifications"
      - "minimal cryptographic design requirements"
    verification: "Final Security Review by the security advisor; tracked in the SDL compliance tracking application (Application Security Verification Process)"
    kind: "stated"
    testable: "partial"
    testable_reason: "advisor judgement; no objective acceptance criteria"
    deliverables_note: "named in the practice text; list is ours"
  - id: "microsoft-sdl-simplified-2010#SP-06"
