reconciliation: "bin/bcp14-count finds 1 uppercase keyword in .cache/microsoft-sdl-simplified-2010.txt: 'OPTIONAL' in the caps-styled heading 'OPTIONAL SECURITY ACTIVITIES' (a pandoc rendering of the Word heading style). It is not a BCP 14 keyword; the paper never invokes BCP 14; the capture keeps original case ('Optional Security Activities') so extracted texts contain 0. Baseline = the paper's own units: 'the development team must successfully complete sixteen mandatory security activities' — SDL Practices 1-16 (16 entries, SP-01..SP-16); 3 optional security activities; 2 other process requirements (root cause analysis, periodic process updates); plus SDL applicability, roles and the application security verification process (3 process entries). The companion spreadsheet restates the practices in 28 numbered rows (6 phase headers x.0 and 22 practice rows), each one entry. Entries: {'process-requirement': 5, 'mandatory-practice': 16, 'optional-practice': 3, 'spreadsheet-row': 28} = 52; by normativity {'recommendation': 20, 'requirement': 27, 'descriptive': 5}. Lowercase modal words in the capture, for reference: {'must': 19, 'should': 36, 'mandatory': 7, 'required': 1, 'may': 12}. VERIFY PASS (2026-10-03): a sentence-level walk of the whole .doc text (textutil rendering) found 9 modal-bearing statements outside the extracted sections, in neither requirements.yaml nor normative.md: 3 in the Introduction / About / Conclusion (e.g. 'development teams should apply the SDL in a way that is suitable to the human talent and resources available') and 6 text-box callouts printed beside the body text, including 'Any issues identified during penetration testing must be addressed and resolved before the project is approved for release.' They are appended as PROC-intro-minimum-threshold, PROC-core-concepts, PROC-conclusion-guide and CALLOUT-1..6 (verbatim). Three spreadsheet rows whose ADDITIONAL NOTES cell states must-requirements (Design 3.2, Implementation 4.2, 4.3) were retyped from recommendation to requirement. Entries now 61 = 52 + 9; by normativity requirement 32, recommendation 22, descriptive 7."
