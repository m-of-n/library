  - id: "microsoft-sdl-simplified-2010#XLS-Design-3.1.3"
    designator: "Design 3.1.3"
    entry_type: "spreadsheet-row"
    normativity: "recommendation"
    verb: "descriptive"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "design"
