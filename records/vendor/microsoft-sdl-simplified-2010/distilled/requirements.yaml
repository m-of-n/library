    nature: "process"
    phase: "release"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Release 6.1\""
    short_title: "Create an Incident Response Plan"
    text: "Every software release subject to the requirements of the SDL must include an incident response plan. Even programs with no known vulnerabilities at the time of release can be subject to new threats that emerge over time. The incident response plan should include:\n• An identified sustained engineering (SE) team, or if the team is too small to have SE resources, an emergency response plan (ERP) that identifies the appropriate engineering, marketing, communications, and management staff to act as points of first contact in a security emergency.\n• On-call contacts with decision-making authority that are available 24 hours a day, seven days a week.\n• Security servicing plans for code inherited from other groups within the organization.\n• Security servicing plans for licensed third-party code, including file names, versions, source code, third-party contact information, and contractual permission to make changes (if appropriate)."
    expects_deliverables: []
