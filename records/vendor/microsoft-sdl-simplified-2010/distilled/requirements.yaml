  - id: "microsoft-sdl-simplified-2010#XLS-Verification-5.3"
    designator: "Verification 5.3"
    entry_type: "spreadsheet-row"
    normativity: "recommendation"
    verb: "should"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "verification"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Verification 5.3\""
    short_title: "Conduct Attack Surface Review"
    text: "It is common for an application to deviate significantly from the functional and design specifications created during the requirements and design phases of a software development project. Therefore, it is critical to re-review threat models and attack surface measurement of a given application when it is code complete. This review ensures that any design or implementation changes to the system have been accounted for, and that any new attack vectors created as a result of the changes have been reviewed and mitigated. \n\nIn addition, all security bugs identified in your project should be reviewed against the security bug bar/quality criteria established for your project to ensure you have met the criteria or understand the potential attack surface associated with any bugs granted exceptions."
    expects_deliverables: []
