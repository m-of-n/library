    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Verification 5.1\""
    short_title: "Perform Dynamic Code Analysis"
    text: "Run-time verification of software programs is necessary to ensure that a program’s functionality works as designed. This verification task should specify tools that monitor application behavior for memory corruption, user privilege issues, and other critical security problems. The SDL process uses run-time tools, along with other techniques such as fuzz testing, to achieve desired levels of security test coverage."
