    short_title: "Satisfy Minimum Cryptographic Design Requirements"
    text: "Satisfy the minimal cryptographic design requirements established for your product when you established Security Requirements."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "The SDL crypto requirements, at a high-level, are:\n\nUse AES for symmetric encryption/decryption\nUse 128-bit or better symmetric keys\nUse RSA for asymmetric encryption/decryption and signatures\nUse 1024-bit or better RSA keys\nUse SHA-256 or better for hashing and message authentication codes\n\nFor additional details on this requirement, please read through the online SDL Process Guidance available at: http://msdn.microsoft.com/en-us/security/cc420639.aspx"
  - id: "microsoft-sdl-simplified-2010#XLS-Design-3.2"
    designator: "Design 3.2"
    entry_type: "spreadsheet-row"
    normativity: "requirement"
    verb: "must (in the ADDITIONAL NOTES column)"
    verification_note: "verify 2026-10-03: retyped from recommendation — the row's ADDITIONAL NOTES cell states must-requirements (must adhere to the requirements that are outlined in the \"Policy for Managing Firewall Configurations\")"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "design"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Design 3.2\""
    short_title: "Analyze Attack Surface"
    text: "1. Use Code Access Secuirty (CAS) correctly\n2. Manage firewall exceptions carefully\n3. Ensure your application runs correctly as a non-administrator"
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "1. Use Code Access Secuirty (CAS) correctly: When developing with managed code, use strong-named assemblies and request minimal permission. When using strong-named assemblies, do not use APTCA (Allow Partially Trusted Caller Attribute) unless the assembly was approved by a security review.\n2. Manage firewall exceptions carefully: Be logical and consistent when you make firewall exceptions. Any product or component that requires changes to the host firewall settings must adhere to the requirements that are outlined in the \"Policy for Managing Firewall Configurations.\" document, available at http://msdn.microsoft.com/en-us/library/cc307394.aspx.\n3. Ensure your application runs correctly as a non-administrator: following the requirement will enable teams to design and develop their applications with a standard user in mind. This will result in reducing attack surface exposed by applications, increasing the security of the user and system."
  - id: "microsoft-sdl-simplified-2010#XLS-Design-3.3"
    designator: "Design 3.3"
    entry_type: "spreadsheet-row"
    normativity: "requirement"
    verb: "must"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "design"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Design 3.3\""
    short_title: "Complete Threat Models"
    text: "1. Complete threat models for all functionality identified during the cost analysis phase. Threat models typically must consider the following areas:\n- All projects. All code exposed on the attack surface and all code written by or licensed from a third party.\n- New projects. All features and functionality.\n- Updated versions of existing projects. New features or functionality added in the updated version.\n\n2. Ensure that all threat models meet minimal threat model quality requirements. All threat models must contain data flow diagrams, assets, vulnerabilities, and mitigation. Threat modeling can be done in a variety of ways using either tools or documentation/specifications to define the approach. \n\n3. Have all threat models and referenced mitigations reviewed and approved by at least one developer, one tester, and one program manager. Ask architects, developers, testers, program managers, and others who understand the software to contribute to threat models and to review them. Solicit broad input and reviews to ensure the threat models are as comprehensive as possible.\n\n4. Threat model data and associated documentation (functional/design specs) should be stored using the document control system used by the product team."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "For more information on Threat Modeling: http://www.microsoft.com/security/sdl/discover/design.aspx"
