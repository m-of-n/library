  - id: "microsoft-sdl-simplified-2010#XLS-Implementation-4.1"
    designator: "Implementation 4.1"
    entry_type: "spreadsheet-row"
    normativity: "recommendation"
    verb: "should"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "implementation"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Implementation 4.1\""
    short_title: "Specify/Approve Secure Compilers, Tools, Flags & Options"
    text: "All development teams should define and publish a list of approved tools and their associated security checks, such as compiler/linker options and warnings. This list should be approved by the security advisor for the project team. Generally speaking, development teams should strive to use the latest version of approved tools to take advantage of new security analysis functionality and protections."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "A list of Microsoft's SDL-related Implementation tools can be found at: http://www.microsoft.com/security/sdl/adopt/tools.aspx\n\nThe SDL Pro Network Tools members can be accessed at: http://www.microsoft.com/security/sdl/adopt/pronetwork.aspx\n\nUse the currently required (or later) versions of compilers to compile options for the Win32, Win64, WinCE and Macintosh target platforms.\n- Compile C/C++ code with /GS or approved alternative on other platforms. The \"SDL Buffer Security Check\" check-in policy provided with this template helps you enforce this in your project.\n- Link C/C++ code with /SAFESEH or approved alternative on other platforms. The \"SDL Safe Exception Handlers\" check-in policy provided with this template helps you enforce this in your project.\n- Link C/C++ code with /NXCOMPAT or approved alternative on other platforms. The \"SDL DEP and ASLR\" check-in policy provided with this template helps you enforce this in your project.\n- Use MIDL with /robust or approved alternative on other platforms.\n\nUse the currently required (or later) versions of code analysis tools for either native C and C++ or managed (C#) code that are available for the target platforms. The \"Code Analysis\" check-in policy provided out-of-the-box with Visual Studio Team Suite or Visual Studio Team System Development Edition helps you enforce this in your project."
  - id: "microsoft-sdl-simplified-2010#XLS-Implementation-4.2"
    designator: "Implementation 4.2"
    entry_type: "spreadsheet-row"
    normativity: "requirement"
    verb: "must (in the ADDITIONAL NOTES column)"
    verification_note: "verify 2026-10-03: retyped from recommendation — the row's ADDITIONAL NOTES cell states must-requirements (must not use banned versions of string buffer handling functions; ... must set the System.Web.UI.Page.ViewStateUserKey property)"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "implementation"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Implementation 4.2\""
    short_title: "Identify/Deprecate Unsafe Functions"
    text: "Project teams should analyze all functions and APIs that will be used in conjunction with a software development project and prohibit those that are determined to be unsafe. Once the banned list is determined, project teams should use header files (such as banned.h and strsafe.h), newer compilers, or code scanning tools to check code (including legacy code where appropriate) for the existence of banned functions, and replace those banned functions with safer alternatives."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "New native C and C++ code must not use banned versions of string buffer handling functions. Based on analysis of previous Microsoft Security Response Center (MSRC) cases, avoiding use of banned APIs is one actionable way to remove many vulnerabilities. The \"SDL Banned APIs\" check-in policy provided with this template helps you enforce this in your project. Check the \"Setup check-in policies\" task for information on how to ensure this.\n\nSections marked as shared in shipping binaries represent a security threat. Use properly secured dynamically created shared memory objects instead.\n\nAll ASP.NET pages that require authentication must set the System.Web.UI.Page.ViewStateUserKey property to a unique value per user (such as the user's session ID) to help protect the application against Cross-Site Request Forgery attacks.\n\nEnsure that the application domain group is granted only execute permissions only on your stored procedures. Do not grant any other permission on your database to any other user or group.\n\nAll web applications accessing databases should always use stored procedures.\n\nDo not use \"exec @sql\" construct in your stored procedures."
  - id: "microsoft-sdl-simplified-2010#XLS-Implementation-4.3"
    designator: "Implementation 4.3"
    entry_type: "spreadsheet-row"
    normativity: "requirement"
    verb: "must (in the ADDITIONAL NOTES column)"
    verification_note: "verify 2026-10-03: retyped from recommendation — the row's ADDITIONAL NOTES cell states must-requirements (If using FxCop, you must fix all violations that fall within the \"Security rules\")"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "implementation"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Implementation 4.3\""
    short_title: "Perform Periodic Static Code Analysis"
    text: "Project teams should perform static analysis of source code. Static analysis of source code provides a scalable capability for security code review and can help ensure that secure coding policies are being followed. Static code analysis by itself is generally insufficient to replace a manual code review. The security team and security advisors should be aware of the strengths and weaknesses of static analysis tools and be prepared to augment static analysis tools with other tools or human review as appropriate."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "A list of Microsoft's SDL-related Implementation tools can be found at: http://www.microsoft.com/security/sdl/adopt/tools.aspx\n\nThe SDL Pro Network Tools members can be accessed at:http://www.microsoft.com/security/sdl/adopt/pronetwork.aspx\nRun a static code analysis tool against all managed code and fix all security sensitive issues discovered.\n\nIf you are writing code in Visual Studio or .NET Framework, the FxCop code analysis tool can be used in this situation. If using FxCop, you must fix all violations that fall within the \"Security rules\" for the version used. \n\nNote that there are slight differences in the security rules for FXCop 1.35 (from Visual Studio 2005) and FXCop 1.36 (from Visual Studio 2008). These are explained in this code analysis blog entry: http://blogs.msdn.com/fxcop/archive/2008/01/07/faq-which-rules-shipped-in-which-version.aspx\n\n.Net Framework version 3.5 requires FXCop 1.36 \n\nSecurity rules for FXCop 1.35 can be found here: http://msdn.microsoft.com/en-us/library/ms182296(VS.80).aspx\nSecurity rules for FXCop 1.36 can be found here: http://msdn.microsoft.com/en-us/library/ms182296.aspx"
