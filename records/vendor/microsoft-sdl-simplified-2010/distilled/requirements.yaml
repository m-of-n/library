  - id: "microsoft-sdl-simplified-2010#XLS-Training-1.1"
    designator: "Training 1.1"
    entry_type: "spreadsheet-row"
    normativity: "requirement"
    verb: "must"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "training"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Training 1.1\""
    short_title: "Complete Core Security Training"
    text: "All members of software development teams must receive appropriate training to stay informed about security basics and recent trends in security and privacy. \n\nBasic software security training should cover foundational concepts such as: \n-  Secure design, including the following topics: Attack surface reduction, Defense in depth, rinciple of least privilege, Secure defaults\n- Threat modeling, including the following topics: Overview of threat modeling, Design implications of a threat model, Coding constraints based on a threat model\n- Secure coding, including the following topics: Buffer overruns (for applications using C and C++), Integer arithmetic errors (for applications using C and C++), Cross-site scripting (for managed code and Web applications), SQL injection (for managed code and Web applications), Weak cryptography\n- Security testing, including the following topics: Differences between security testing and functional testing, Risk assessment, Security testing methods\n- Privacy, including the following topics: Types of privacy-sensitive data, Privacy design best practices, Risk assessment, Privacy development best practices, Privacy testing best practices"
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "More training resources available at:http://www.microsoft.com/security/sdl/discover/training.aspx"
  - id: "microsoft-sdl-simplified-2010#XLS-Requirements-2.0"
    designator: "Requirements 2.0"
    entry_type: "spreadsheet-row"
    normativity: "descriptive"
    verb: "descriptive"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "requirements"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Requirements 2.0\""
    short_title: "Requirements Practices"
    text: "Setting a designated time for defining project requirements allows development teams to consider how to best integrate security and privacy into the development process and identify key security objectives while minimizing disruption to applicaion usability, plans, and schedules."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
