  - id: "microsoft-sdl-simplified-2010#XLS-Requirements-2.1"
    designator: "Requirements 2.1"
    entry_type: "spreadsheet-row"
    normativity: "recommendation"
    verb: "should"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "requirements"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Requirements 2.1\""
    short_title: "Establish Security Requirements"
    text: "The need to consider security and privacy “up front” is a fundamental aspect of secure system development. The optimal point to define trustworthiness requirements for a software project is during the initial planning stages. This early definition of requirements allows development teams to identify key milestones and deliverables, and permits the integration of security and privacy in a way that minimizes any disruption to plans and schedules.\n\nCreate a basic questionnaire to verify whether your product should be subject to the SDL. If you determine is should be based on the results of your questionairre, begin building your baseline security requirements from the content of the questionnaire."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
    additional_notes: "At a minimum, products that meet the following criteria should follow a SDL process:\n1. Any product that is commonly used or deployed within a business (e.g. Email or database servers)\n2. Any product that regularly stores, processes, or communicates personally identifiable information (PII) such as financial, medical, or sensitive customer information.\n3. Any online products or services that target or are attractive to children .\n4. Any product that regularly touches or listens on the internet.\n5. Any product that automatically downloads updates."
  - id: "microsoft-sdl-simplified-2010#XLS-Requirements-2.1.1"
    designator: "Requirements 2.1.1"
    entry_type: "spreadsheet-row"
    normativity: "recommendation"
    verb: "may"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "requirements"
    locator: "Simplified SDL_Spreadsheet.xlsx, row \"Requirements 2.1.1\""
    short_title: "Assign Security Experts"
    text: "Identify the security advisor who will serve as your team's first point of contact for security support and additional resources. This person will serve as the security advisor for the project.\n\nIdentify the team or individual that is responsible for tracking and managing security for the product. This team or individual does not have sole responsibility for ensuring that a software release is secure, but this team or individual is responsible for coordinating and communicating the status of any security issues in the product. \n\nIn smaller product groups, a single person may fill these roles."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
