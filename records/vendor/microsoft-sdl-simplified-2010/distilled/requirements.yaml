    locator: "Mandatory Security Activities > Phase Three: Implementation > SDL Practice 9: Deprecate Unsafe Functions"
    short_title: "Deprecate Unsafe Functions"
    text: "Many commonly used functions and APIs are not secure in the face of the current threat environment. Project teams should analyze all functions and APIs that will be used in conjunction with a software development project and prohibit those that are determined to be unsafe. Once the banned list is determined, project teams should use header files (such as banned.h and strsafe.h), newer compilers, or code scanning tools to check code (including legacy code where appropriate) for the existence of banned functions, and replace those banned functions with safer alternatives."
    expects_deliverables:
