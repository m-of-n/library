    designator: "PROC-core-concepts"
    entry_type: "process-requirement"
    normativity: "requirement"
    verb: "requires"
    actor: "development/project team (inferred)"
    nature: "process"
    phase: "governance"
    locator: "Simplified Implementation of the Microsoft SDL > About the Microsoft Security Development Lifecycle"
    short_title: "The Microsoft SDL is based on three core concepts—education, continuous process improvement, and acc"
    text: "The Microsoft SDL is based on three core concepts—education, continuous process improvement, and accountability. The ongoing education and training of technical job roles within a software development group is critical. The appropriate investment in knowledge transfer helps organizations to react appropriately to changes in technology and the threat landscape. Because security risk is not static, the SDL places heavy emphasis on understanding the cause and effect of security vulnerabilities and requires regular evaluation of SDL processes and introduction of changes in response to new technology advancements or new threats. Data is collected to assess training effectiveness, in-process metrics are used to confirm process compliance and post-release metrics help guide future changes. Finally, the SDL requires the archival of all data necessary to service an application in a crisis. When paired with detailed security response and communication plans, an organization can provide concise and cogent guidance to all affected parties."
    expects_deliverables: []
    verification: "not stated"
    kind: "stated"
    testable: "partial"
    testable_reason: "guidance text"
