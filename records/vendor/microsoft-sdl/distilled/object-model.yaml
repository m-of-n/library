schema: "library-object-model/v1"
record: microsoft-sdl
source_version: "web practice set, 2026-10-02"
extracted: "2026-10-02"
reviewed_by: ""
method: "Object-model pass over the 16 captured pages with one question: what entity types and edges do the practices assume or define?"
objects:
  - {name: Practice, definition: "One of 'the 10 key security practices of the SDL'.", attributes: [number, title, introduction], locator: "practices index", kind: stated, tmodel_mapping: "Requirement group (R-044)", notes: "Numbered 1-10; no phase ordering."}
  - {name: SubPractice, definition: "A numbered element n.m of a practice (48 in total).", attributes: [id, title, text, resources], locator: "practice pages", kind: stated, tmodel_mapping: "Requirement (R-042/R-044); the ids SAMM maps to", notes: ""}
  - {name: LifecycleStage, definition: "Design / Code / Build and Deploy / Run, plus Zero Trust architecture and governance spanning all.", attributes: [name, goal], locator: "practices index", kind: stated, tmodel_mapping: "LifecyclePhase (ARCH §3b) — coarser: four stages", notes: "Practices are not assigned to stages by the source."}
  - {name: SecurityStandard, definition: "Required standards and the minimum-security baseline (security + compliance controls).", attributes: [source], locator: "1.1, 1.2", kind: stated, tmodel_mapping: "Requirement source document", notes: "Cites NIST SSDF, PCI DSS, HIPAA, OWASP Top 10, SANS Top 25."}
  - {name: SecurityRequirement, definition: "Security requirements, 'tracked through either a work-tracking system or through telemetry derived from the engineering pipeline'.", attributes: [text, tracking], locator: "Practice 1 intro; 1.2", kind: stated, tmodel_mapping: "Requirement", notes: ""}
  - {name: BugBar, definition: "Severity thresholds of security vulnerabilities with required fix time frames, 'never relaxing it once it's been set'.", attributes: [severity_levels, fix_timeframe], locator: "1.3", kind: stated, tmodel_mapping: "new — severity policy; feeds RiskScore → Gate exit criterion (R-042)", notes: "Links to the SDL Security Bug Bar sample (learn.microsoft.com)."}
  - {name: WorkItem, definition: "Security defects and security work items, 'clearly labeled as security and marked with their appropriate security severity'.", attributes: [label, severity], locator: "1.3; 3.3; 3.4", kind: stated, tmodel_mapping: "external_refs on Finding/MitigationInstance (R-028)", notes: ""}
  - {name: Metric, definition: "KPIs and compliance reporting.", attributes: [name], locator: "1.3", kind: stated, tmodel_mapping: "governed view value (R-043)", notes: ""}
  - {name: SecurityException, definition: "A temporary, timebound exception to a security policy with reason, short-term actions, remediation plan and expiration date.", attributes: [reason, short_term_actions, remediation_plan, expiration_date, severity, approver_level, status], locator: "Practice 1 intro; 1.4", kind: stated, tmodel_mapping: "risk-acceptance disposition on ThreatInstance + Review (R-042, DEC-009)", notes: "Lifecycle in state-machine.yaml."}
  - {name: ManagementApprover, definition: "The 'proper level of management', chosen by risk severity.", attributes: [level], locator: "1.4 steps 2, 4", kind: stated, tmodel_mapping: "Party role (R-036)", notes: ""}
  - {name: ApprovedTool, definition: "Published list of approved tools and their security checks (compiler/linker options and warnings).", attributes: [name, version, checks], locator: "Practice 2 intro; 2.5", kind: stated, tmodel_mapping: "Component (tool) with policy", notes: ""}
  - {name: ThreatModel, definition: "Structured analysis of the security design 'while thinking like an attacker'.", attributes: [use_cases, assets, architecture_overview, threats, mitigations], locator: "Practice 3", kind: stated, tmodel_mapping: "the tmodel threat model itself (core)", notes: ""}
  - {name: UseCase, definition: "Business functions / scenarios and the actors' roles.", attributes: [description, actors], locator: "3.1", kind: stated, tmodel_mapping: "Workflow (ARCH §1 behavioral)", notes: ""}
  - {name: Asset, definition: "'something of value in a system that needs to be protected' — tangible or intangible.", attributes: [name, tangible], locator: "3.1", kind: stated, tmodel_mapping: "Asset (ARCH §3)", notes: ""}
  - {name: DataFlowDiagram, definition: "'At minimum, a Data Flow Diagram (DFD) is recommended' with arrows labelled by data types and protocols.", attributes: [components, flows, labels], locator: "3.2", kind: stated, tmodel_mapping: "Process/DataFlow/DataStore/ExternalEntity (ARCH §1.2)", notes: ""}
  - {name: TrustBoundary, definition: "'a logical construct used to demarcate areas of the system with different levels of trust'.", attributes: [kind], locator: "3.2", kind: stated, tmodel_mapping: "TrustBoundary (ARCH §1.1)", notes: ""}
  - {name: Threat, definition: "Recorded in the work tracking system with security severity; describes threat actor, preconditions, actions, consequences.", attributes: [threat_actor, preconditions, actions, consequences, severity, stride_category], locator: "3.3", kind: stated, tmodel_mapping: "ThreatInstance with method_facet STRIDE (ARCH §2)", notes: ""}
  - {name: SecurityAssumption, definition: "Design assumptions to be validated ('We assume ...').", attributes: [text, validated], locator: "3.3", kind: stated, tmodel_mapping: "new — Assumption node (none in ARCH)", notes: ""}
  - {name: Mitigation, definition: "Partial or full mitigations in layered defenses, tracked as work items with tests.", attributes: [work_item, test], locator: "3.4", kind: stated, tmodel_mapping: "MitigationInstance (ARCH §5) with linked work item and verification test", notes: "'Threat modeling is not complete until you create work items to track your threat findings'."}
  - {name: Stakeholder, definition: "Key stakeholders to whom threat models are communicated.", attributes: [role], locator: "3.5", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: CryptoStandard, definition: "Standards for algorithms, key lengths, modes, libraries; TLS versions; PQC; crypto agility; key/certificate lifecycle.", attributes: [algorithms, key_lifecycle], locator: "Practice 4", kind: stated, tmodel_mapping: "Requirement + technical Mitigation catalogue", notes: ""}
  - {name: Key, definition: "Encryption keys and certificates with limited lifespan, rotated and access-audited.", attributes: [expiry, owner], locator: "4.4", kind: stated, tmodel_mapping: "Asset / Component", notes: ""}
  - {name: ThirdPartyComponent, definition: "Commercial and open-source components consumed via governed workflows.", attributes: [source, risk], locator: "Practice 5; 5.1, 5.2", kind: stated, tmodel_mapping: "Component (purl)", notes: ""}
  - {name: SBOM, definition: "'a machine-readable document that lists all of the components'.", attributes: [components, checksums], locator: "5.3", kind: stated, tmodel_mapping: "SBOM record (radar contract)", notes: ""}
  - {name: Attestation, definition: "Signed artifact attestations establishing 'a verifiable trail' of provenance.", attributes: [signature, subject], locator: "5.4", kind: stated, tmodel_mapping: "provenance (ARCH §4; supply-chain class deferred to ADR-0001)", notes: ""}
  - {name: EngineeringEnvironment, definition: "Source control, build, dev boxes, privileged workstations, deployment environments.", attributes: [access_policy], locator: "Practice 6", kind: stated, tmodel_mapping: "Component / Environment", notes: ""}
  - {name: SecurityTest, definition: "SAST, DAST, red/blue team, penetration test, continuous and cadence-based testing, bug bounty.", attributes: [kind, frequency, findings], locator: "Practice 7", kind: stated, tmodel_mapping: "Evidence producer for MitigationInstance verification (R-042)", notes: ""}
  - {name: SecurityBaseline, definition: "Defined and enforced configuration standards with drift detection.", attributes: [policy], locator: "8.3", kind: stated, tmodel_mapping: "Requirement (technical)", notes: ""}
  - {name: IncidentResponsePlan, definition: "Plan created with the PSIRT; contacts, servicing protocol, inherited and third-party code; tested before needed.", attributes: [contacts, servicing_protocol], locator: "9.2", kind: stated, tmodel_mapping: "documentation-kind Mitigation (R-040)", notes: ""}
  - {name: PSIRT, definition: "Product Security Incident Response Team.", attributes: [], locator: "9.2", kind: stated, tmodel_mapping: "Party (org unit)", notes: ""}
  - {name: Role, definition: "product line leaders, product owners, developers, operations, testers and other roles that need training and guidance.", attributes: [name], locator: "Practice 1 intro; Practice 10", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: Training, definition: "Role-based security training incl. threat modeling at onboarding and periodic refreshers.", attributes: [audience, cadence], locator: "Practice 10", kind: stated, tmodel_mapping: "process-kind Mitigation", notes: ""}
  - {name: Gate, definition: "A release gate / sign-off.", attributes: [], locator: "absent from the current pages", kind: inferred, tmodel_mapping: "Gate (R-041)", notes: "The current practice set has NO gate object; the 2012 process (microsoft-sdl-5-2) had the Final Security Review. Recorded as a gap."}
edges:
  - {name: has_sub_practice, from: Practice, to: SubPractice, cardinality: "1:N", definition: "", locator: "practice pages", kind: stated, tmodel_mapping: "grouping"}
  - {name: cross_references, from: SubPractice, to: SubPractice, cardinality: "N:M", definition: "e.g. 2.1 'See Practice 6.1'; 4.4 'see Practice 2.1 Identity ... Practice 2.5'; 6.3 'See Practice 8.8'", locator: "2.1, 4.4, 6.3", kind: stated, tmodel_mapping: "see_also"}
  - {name: baseline_from, from: SecurityRequirement, to: SecurityStandard, cardinality: "N:M", definition: "", locator: "1.1, 1.2", kind: stated, tmodel_mapping: "derived_from"}
  - {name: classified_by, from: WorkItem, to: BugBar, cardinality: "N:1", definition: "security severity per bug bar", locator: "1.3", kind: stated, tmodel_mapping: "RiskScore"}
  - {name: excepts, from: SecurityException, to: SecurityStandard, cardinality: "N:1", definition: "exception to a security policy", locator: "1.4", kind: stated, tmodel_mapping: "waiver of Requirement"}
  - {name: approved_by, from: SecurityException, to: ManagementApprover, cardinality: "N:1", definition: "", locator: "1.4 step 4", kind: stated, tmodel_mapping: "Review"}
  - {name: identifies, from: ThreatModel, to: Threat, cardinality: "1:N", definition: "", locator: "3.3", kind: stated, tmodel_mapping: "ThreatInstance"}
  - {name: protects, from: Mitigation, to: Asset, cardinality: "N:M", definition: "", locator: "3.1, 3.4", kind: inferred, tmodel_mapping: "mitigates/protects"}
  - {name: threatens, from: Threat, to: Asset, cardinality: "N:M", definition: "'consequences for affected assets and users'", locator: "3.3", kind: stated, tmodel_mapping: "realizes DamageScenario"}
  - {name: mitigated_by, from: Threat, to: Mitigation, cardinality: "N:M", definition: "", locator: "3.3, 3.4", kind: stated, tmodel_mapping: "MitigationInstance"}
  - {name: tracked_as, from: "Threat|Mitigation", to: WorkItem, cardinality: "1:N", definition: "'create work items to track your threat findings and the related development and testing tasks'", locator: "3.4, 3.5", kind: stated, tmodel_mapping: "external_refs (R-028)"}
  - {name: verified_by, from: Mitigation, to: SecurityTest, cardinality: "N:M", definition: "'Be sure to test that your mitigations work as intended'", locator: "3.4", kind: stated, tmodel_mapping: "Evidence (R-042)"}
  - {name: depicts, from: DataFlowDiagram, to: TrustBoundary, cardinality: "N:M", definition: "the architecture overview depicts 'subsystems, trust boundaries, and data flows between actors and components'", locator: "3.2", kind: stated, tmodel_mapping: "diagram view over TrustBoundary nodes"}
  - {name: crosses, from: "data flow (element of a DataFlowDiagram)", to: TrustBoundary, cardinality: "N:M", definition: "'Data that crosses a trust boundary may need to be treated as untrusted and validated or blocked from flowing altogether.'", locator: "3.2", kind: stated, tmodel_mapping: "DataFlow crosses TrustBoundary (ARCH §1)", notes: "verify 2026-10-03: the extract pass drew this edge from DataFlowDiagram with an empty definition; the page says data flows cross boundaries and the diagram depicts them"}
  - {name: lists, from: SBOM, to: ThirdPartyComponent, cardinality: "1:N", definition: "", locator: "5.3", kind: stated, tmodel_mapping: "composed_of"}
  - {name: attests, from: Attestation, to: "artifact", cardinality: "N:1", definition: "", locator: "5.4", kind: stated, tmodel_mapping: "provenance"}
  - {name: coordinated_with, from: IncidentResponsePlan, to: PSIRT, cardinality: "N:1", definition: "", locator: "9.2", kind: stated, tmodel_mapping: "owned_by Party"}
  - {name: trained_in, from: Role, to: Training, cardinality: "N:M", definition: "", locator: "Practice 10", kind: stated, tmodel_mapping: ""}
gaps:
  - "No Gate/sign-off: the current practice set dropped the 5.2 Final Security Review; R-041 Gate must come from elsewhere (5.2 FSR, BSIMM SM1.4/1.7/2.6, SSDF PO.4)."
  - "No ordering of practices onto lifecycle stages; R-037 phase mapping is ours."
  - "Threat 'well-written' fields (actor, preconditions, action, consequences) match AttackStep pre/postconditions (ARCH §2a) — no gap, but SecurityAssumption has no tmodel counterpart."
  - "No evidence/conformance definition beyond 'test that your mitigations work as intended'."
