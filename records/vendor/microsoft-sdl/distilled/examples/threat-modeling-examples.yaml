note: "The page styles each STRIDE initial in bold (<strong>S</strong>poofing); the HTML has no space between initial and word, so the category words are given whole, as on the page."
source: "Practice 3 page (https://www.microsoft.com/en-us/securityengineering/sdl/practices/secure-by-design), sub-practices 3.1-3.4 — every example list, verbatim"
stride_table:
  locator: "3.3 table"
  rows:
    - {category: "Spoofing", description: "Making false identity claims"}
    - {category: "Tampering", description: "Unauthorized data modification"}
    - {category: "Repudiation", description: "Performing actions and then denying that you did"}
    - {category: "Information Disclosure", description: "Leaking sensitive data to unauthorized parties"}
    - {category: "Denial of Service", description: "Crashing or overloading a system to impact its availability"}
    - {category: "Elevation of Privilege", description: "Manipulating a system to gain unauthorized privileges"}
context_questions_3_1:
  - "What are the business functions of the system?"
  - "What are the roles of the actors that interact with it?"
  - "What kind of data does the system process and store?"
  - "Are there special business or legal requirements that impact security?"
  - "How many users and how much data is the system expected to handle?"
  - "What are the real-world consequences if the system fails to provide confidentiality, integrity, or availability of the data and services it handles?"
tangible_assets_3_1: ["Personal photos and contacts stored on a smartphone", "Compute resources in a cloud environment", "Software supply chain integrity in a development environment", "Medical imaging and diagnostic data", "Financial accounting data", "Biometric authentication data", "Proprietary formulae and manufacturing processes", "Military and government secrets", "Machine learning models and training data", "Credit card data"]
intangible_assets_3_1: ["Customer trust", "User privacy", "System availability"]
dfd_arrow_labels_3_2: ["Data types (business function)", "Data transfer protocols"]
trust_boundary_examples_3_2: ["Public Internet vs. private network", "Service APIs", "Separate operating system processes", "Virtual machines", "User vs. kernel memory space", "Containers"]
security_assumption_examples_3_3: ["We assume our open-source dependencies don’t have malicious code.", "We assume that cloud computing services are inherently trustworthy.", "We assume that app users will not root their mobile devices.", "We assume that all authenticated users have benign intent."]
well_written_threat_fields_3_3:
  note: "'Well-written threats clearly describe:' — usable as a required-field list for a ThreatInstance"
  fields: ["The threat actor who exploits the vulnerability", "Any preconditions required for exploitation", "What the threat actor does", "The consequences for affected assets and users"]
recommended_secure_design_practices_3_4: ["Design and Threat Model as a Team", "Prefer Platform Security to Custom Code", "Secure Configuration is the Default", "Never Trust Data from the Client", "Assume Breach", "Enforce Least Privilege", "Minimize Blast Radius", "Minimize Attack Surface", "Consider Abuse Cases", "Monitor and Alert on Security Events"]
