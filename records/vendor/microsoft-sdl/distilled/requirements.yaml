  - id: "microsoft-sdl#3.4"
    designator: "3.4"
    entry_type: "sub-practice"
    normativity: "recommendation"
    verb: "never"
    actor: "organization / engineering team (inferred)"
    nature: "process"
    phase: "design"
    locator: "Practice 3 page (https://www.microsoft.com/en-us/securityengineering/sdl/practices/secure-by-design), sub-practice 3.4"
    short_title: "Identify and track mitigations"
    text: "3.4 Identify and track mitigations - Secure Design Philosophy: When identifying mitigations, keep in mind that security is not “all or nothing”. A partial mitigation that raises the cost for an attacker, slows them down to give defenders time to detect them, or limits the scope of damage is much better than no mitigation at all. Think in terms of layered defenses. Attackers don’t just exploit a single vulnerability and stop there. They chain multiple vulnerabilities together, pivoting from one target system to the next until they achieve their objective (or get caught.) Each layered defense increases the likelihood that attackers will be blocked or detected. Also, assume that other layers’ security controls will be bypassed or disabled. This is the essence of the Assume Breach philosophy which results in a resilient set of layered defenses rather than relying solely on external defenses that, if bypassed, result in a major breach.\n\nRecommended Secure Design Practices:\n\n- Design and Threat Model as a Team\n- Prefer Platform Security to Custom Code\n- Secure Configuration is the Default\n- Never Trust Data from the Client\n- Assume Breach\n- Enforce Least Privilege\n- Minimize Blast Radius\n- Minimize Attack Surface\n- Consider Abuse Cases\n- Monitor and Alert on Security Events\n\nThreat modeling is not complete until you create work items to track your threat findings and the related development and testing tasks to mitigate them. Consider tagging the work items and writing queries so they are easy to find. A threat model provides the seeds for a good security test plan. Be sure to test that your mitigations work as intended and use automated testing when possible."
