    locator: "Practice 5 page (https://www.microsoft.com/en-us/securityengineering/sdl/practices/sscs), introduction"
    short_title: "Secure the software supply chain"
    text: "The security of a workload depends on the security of all the components in that workload. An attacker who compromises one vulnerable component of a workload can often take over the whole workload (and often many others in the organization using lateral traversal techniques).\n\nToday, the vast majority of software projects are built using third-party components (both commercial and open source). When selecting third-party components to use, it’s important to understand the impact that a security vulnerability in them could have to the security of the larger system into which they are integrated and you should always be more selective when using high-risk components, and consider a thorough analysis before using them. There are a myriad of ways that developers consume OSS today: git clone, wget, copy & pasted source, checking-in the binary into the repo, direct from public package managers, repackaging the OSS into a .zip, curl, apt-get, git submodule, and more. Securing the OSS supply chain in any organization is going to be near impossible if developer teams don’t follow a uniform process for consuming OSS. Enforcing an effective secure OSS supply chain strategy necessitates standardizing your OSS consumption process across the various developer teams throughout your organization, so all developers consume OSS using governed workflows."
    expects_deliverables: []
    verification: "through its sub-practices"
    kind: "stated"
    testable: "partial"
