  - id: "microsoft-sdl#3.1"
    designator: "3.1"
    entry_type: "sub-practice"
    normativity: "recommendation"
    verb: "ensure"
    actor: "organization / engineering team (inferred)"
    nature: "process"
    phase: "design"
    locator: "Practice 3 page (https://www.microsoft.com/en-us/securityengineering/sdl/practices/secure-by-design), sub-practice 3.1"
    short_title: "Identify use cases, scenarios, and assets"
    text: "3.1 Identify use cases, scenarios, and assets - An essential part of threat modeling and reviewing threat models is understanding what business functions or “use cases” the system has. Scenarios describing the sequence of steps for typical interactions with the system illustrate its intended purposes and workflows. They also describe the different roles of users and external systems that connect to it. The first step in threat modeling is to document the business functions the system performs and how users or other systems interact with it. Supplement textual descriptions of use cases and scenarios with flowcharts and UML sequence diagrams as needed. Whether you use formal documentation such as use cases and scenarios, or take a more informal approach, ensure you provide context that answers these questions:\n\n- What are the business functions of the system?\n- What are the roles of the actors that interact with it?\n- What kind of data does the system process and store?\n- Are there special business or legal requirements that impact security?\n- How many users and how much data is the system expected to handle?\n- What are the real-world consequences if the system fails to provide confidentiality, integrity, or availability of the data and services it handles?\n\nAn asset is something of value in a system that needs to be protected. Some assets are obvious such as money in financial transactions or secrets such as passwords and crypto keys. Others are more intangible like privacy, reputation, or system availability. Once you properly identify the system’s assets, it is easier to identify threats against them. Document the list of system assets.\n\nExamples of tangible assets:\n\n- Personal photos and contacts stored on a smartphone\n- Compute resources in a cloud environment\n- Software supply chain integrity in a development environment\n- Medical imaging and diagnostic data\n- Financial accounting data\n- Biometric authentication data\n- Proprietary formulae and manufacturing processes\n- Military and government secrets\n- Machine learning models and training data\n- Credit card data\n\nExamples of intangible assets:\n\n- Customer trust\n- User privacy\n- System availability"
