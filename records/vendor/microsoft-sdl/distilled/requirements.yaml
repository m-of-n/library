    designator: "10"
    entry_type: "practice"
    normativity: "requirement"
    verb: "must"
    verification_note: "verify (2026-10-03): retyped from recommendation/imperative — the practice introduction itself contains must-statements; the record's own rule (requirement where the text contains must; verb = strongest modal) applies"
    actor: "organization"
