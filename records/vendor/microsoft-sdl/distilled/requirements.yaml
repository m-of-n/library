    short_title: "Encrypt data in transit and at rest"
    text: "4.1 Encrypt data in transit and at rest - Ensure data is encrypted at rest and in transit, this includes security-sensitive information and management and control data. For encryption in transit, use only strong versions of TLS (see recommendation) for all internet traffic and ideally, traffic within private networks. For encryption at rest, be sure you understand the protections an encryption solution provides. While many easily deployable encryption solutions exist to protect data on a device or disk from theft (offline attack), they do not protect against online compromise through application logic, and additional solutions are required in these situations to encrypt data before it's written to storage (encrypt in transit)."
