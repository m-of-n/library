    text: "4.4 Encryption key and certificate management and rotation - Encrypting data is only a portion of a successful cryptography standard and it's also essential to define how to manage, protect and rotate encryption keys and certificates. Keys and certificates have a limited lifespan, and it is necessary to define mechanisms to manage the lifecycle of keys and certificates, including mechanisms to both create new keys and certificates once the previous ones are near expiration and to rapidly rotate in the event of a security incident, such as unintended access. Anyone who can access an encryption key or private key can access the encrypted data, and therefore it's necessary to control who (whether a person or a service) has access (see Practice 2.1 Identity) and provide a clear audit log of that access (see Practice 2.5 Use approved tools)."
