    locator: "Practice 3 page (https://www.microsoft.com/en-us/securityengineering/sdl/practices/secure-by-design), introduction"
    short_title: "Perform secure design review and threat modeling"
    text: "Our computer systems operate in a hostile threat landscape with well-funded, technically capable adversaries continually probing for and exploiting vulnerabilities. Security design flaws can result in vulnerabilities that can be exploited by attackers. Threat modeling and security design reviews of threat models identify potential security threats so that designers can mitigate them early in the development process, resulting in systems that are Secure by Design. Adding security during the design process is much cheaper and less risky than adding it after the fact. To design secure systems, one must shift the focus from:\n\nhow products should work to how products might be abused.\n\nThreat modeling lets you pause and consider the system from a security and privacy standpoint, answering questions like:\n\n- “What if this feature were abused by an attacker instead of being used as intended?”\n- “What happens to assets and users if attackers compromise the system?”\n- “What happens to the system if individual components I rely on become unavailable?”\n\nThreat modeling is a structured approach to analyze the security design of the system, while “thinking like an attacker”. The threats that are identified can then be mitigated before the new product or feature ships."
    expects_deliverables: []
    verification: "through its sub-practices"
