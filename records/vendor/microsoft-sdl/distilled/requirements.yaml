  - id: "microsoft-sdl#3.2"
    designator: "3.2"
    entry_type: "sub-practice"
    normativity: "requirement"
    verb: "must"
    actor: "organization / engineering team (inferred)"
    nature: "process"
    phase: "design"
    locator: "Practice 3 page (https://www.microsoft.com/en-us/securityengineering/sdl/practices/secure-by-design), sub-practice 3.2"
    short_title: "Create an architecture overview"
    text: "3.2 Create an architecture overview - In addition to documenting business functionality and assets, create diagrams and tables to depict the architecture of your application, including subsystems, trust boundaries, and data flows between actors and components. At minimum, a Data Flow Diagram (DFD) is recommended, and other supplementary diagrams such as UML Sequence Diagrams to illustrate complex flows may also be helpful. A DFD is a high-level way to visualize data flows between the major components of a system. It is a simplified view that does not include every detail—just enough to understand the security properties and attack surface of the system. It is a recommended practice to label the following in your DFD arrows:\n\n- Data types (business function)\n- Data transfer protocols\n\nA trust boundary is a logical construct used to demarcate areas of the system with different levels of trust such as:\n\n- Public Internet vs. private network\n- Service APIs\n- Separate operating system processes\n- Virtual machines\n- User vs. kernel memory space\n- Containers\n\nTrust boundaries are important to consider when threat modeling because calls that cross them often need to be authenticated and authorized. Data that crosses a trust boundary may need to be treated as untrusted and validated or blocked from flowing altogether. There may be business/regulatory rules related to trust boundaries. For example, sovereign clouds must ensure that data is stored only within their trust boundaries, and in some cases, HIPAA Protected Health Information (PHI) shouldn’t cross trust boundaries. Trust boundaries are often illustrated in DFDs with dashed red lines."
