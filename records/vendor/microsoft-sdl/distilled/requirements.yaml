    locator: "Practice 6 page (https://www.microsoft.com/en-us/securityengineering/sdl/practices/secure-dev-infra), introduction"
    short_title: "Secure the engineering environment"
    text: "The security of a workload relies on the security of the operational environments where it is developed. An attacker that compromises the development environment infrastructure can take over the workload and find vulnerabilities in it, add vulnerabilities to it, add backdoors to it, access the data in it, launch lateral attacks on other internal systems, and more. Effectively, development security depends on the overall security of the environment including the security of identities, networks, servers, containers, email, user endpoints, and other systems.\n\nAttackers have now expanded their focus to include targeting user accounts, development environments and build processes, and so those systems must be defended in addition to ensuring that source code and configuration files do not contain security errors or have been tampered with. Access to source code and engineering systems should be managed, operated and secured through Zero Trust and least privilege access policies. Source code should be stored in a version controls systems such as a Git with access gated through conditional access policies and multifactor authentication. Engineering systems should be segmented, managed from privileged access workstations, by individuals (who’s privileged access is regularly reviewed) using separate authorized identities. All privileges access should be provided following Just-In-Time and Just-Enough-Access (JIT/JEA) principles and security logging should be enabled and provided to the security monitoring team."
    expects_deliverables: []
    verification: "through its sub-practices"
