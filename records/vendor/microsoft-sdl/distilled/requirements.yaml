    text: "7.1 Implement Static Analysis Security testing (SAST) - Analyzing the source code prior to compilation provides a highly scalable method of security code review and helps ensure that secure coding policies are being followed. It looks for known issues based on the application's logic and adherence to coding standards, rather than when the application is running. SAST is typically integrated into the developer workflow identifying simple to detect issues before code is committed and into build automation to identify vulnerabilities each time the software is built or packaged. There is no one- size-fits-all solution and development teams should decide the optimal frequency for performing SAST and will often deploy multiple tactics—to balance productivity with adequate security coverage."
