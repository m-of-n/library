    actor: "organization"
    nature: "process"
    phase: "design"
    locator: "Practice 4 page (https://www.microsoft.com/en-us/securityengineering/sdl/practices/cryptography), introduction"
    short_title: "Define and use cryptography standards"
    text: "You must establish and apply sound cryptographic practices to have any strong and sustainable security assurances. Almost all technical security assurances ultimately depend on cryptography including authentication and authorization mechanisms, communication security (such as TLS/SSL), data security, and more. If attackers can find a weakness in the underlying cryptographic implementation, all of the other security assurances will quickly unravel.\n\nIt is critically important to use the correct cryptographic solution to protect data from unintended disclosure or alteration while data is being stored (at rest) or transmitted (in transit). To achieve this, it’s necessary to know what data you need to protect via encryption, what mechanisms should be used to encrypt that data and how encryption keys and certificates will be managed.\n\nThreat modeling, described in practice 3, is a great way to help identify scenarios where data that needs to be protected by encryption exists.\n\nBecause this is a complex topic where many developers are not cryptography experts, it is critical to have clear standards and guidance (documentation, examples, etc.) for how to use cryptography properly and to prevent the implementation of bespoke algorithms.\n\nProviding specifics on every element (algorithms, key lengths, cipher modes, key and initial vector generation techniques and usages, and cryptographic libraries) of the encryption implementation is also necessary and requires expert input, which may not be available.  However, a good general rule is to only use industry-vetted encryption libraries as it is intended to ensure a correct and secure implementation of the cryptographic algorithms as well as appropriate security patching as needed."
    expects_deliverables: []
    verification: "through its sub-practices"
