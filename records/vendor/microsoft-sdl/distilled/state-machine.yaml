schema: "library-state-machine/v1"
record: microsoft-sdl
title: "Microsoft SDL (web practice set) — security exception lifecycle (practice 1.4)"
extracted: "2026-10-02"
reviewed_by: ""
source_locator: "Practice 1 page (https://www.microsoft.com/en-us/securityengineering/sdl/practices/security-program-management): introduction ('Primary reasons for formally tracking exceptions') and sub-practice 1.4 steps 1-7"
note: >
  The page gives the steps as a list, not as a state diagram. State names are OURS (kind: inferred);
  every transition cites the step text it comes from. The current practice set defines no other
  lifecycle: there is no release gate or Final Security Review on these pages (contrast
  microsoft-sdl-5-2, whose FSR is a gate).
states:
  - {id: non-compliant, kind: inferred, description: "An engineering team cannot achieve compliance with a security policy within the timeframe of defined SLAs."}
  - {id: triaged, kind: inferred, description: "Risk triaged and documented: reason, short-term actions, remediation plan, expiration date (step 1)."}
  - {id: routed, kind: inferred, description: "Level of management that must review the risk determined by severity (step 2)."}
  - {id: requested, kind: inferred, description: "Exception requested via an approval workflow (step 3)."}
  - {id: approved, kind: inferred, description: "Formal approval by the proper level of management (step 4)."}
  - {id: denied, kind: inferred, description: "Formal denial (step 4)."}
  - {id: active, kind: inferred, description: "Approved, timebound exception being tracked (step 5)."}
  - {id: resolved, kind: inferred, description: "Tracked to its resolution (step 5) — compliance achieved."}
  - {id: expired, kind: inferred, description: "Expiration reached before remediation (steps 5, 7)."}
transitions:
  - {from: non-compliant, to: triaged, trigger: "team must request a temporary exception", text: "When an engineering team cannot achieve compliance with a security policy within the timeframe of defined SLAs, they must request a temporary exception to the policy.", kind: stated}
  - {from: triaged, to: routed, trigger: "step 2", text: "Determining which level of management must review the risk, based on its severity.", kind: stated}
  - {from: routed, to: requested, trigger: "step 3", text: "Requesting an exception to the policy via an approval workflow.", kind: stated}
  - {from: requested, to: approved, trigger: "step 4 approval", text: "Formal review and approval/denial of the exception request by the proper level of management.", guard: "approver is at 'the appropriate management level based on their security risk' (intro reason 1)", kind: stated}
  - {from: requested, to: denied, trigger: "step 4 denial", text: "Formal review and approval/denial of the exception request by the proper level of management.", kind: stated}
  - {from: approved, to: active, trigger: "tracking begins", text: "Tracking of the exception to its resolution or expiration.", kind: stated}
  - {from: active, to: resolved, trigger: "remediation complete", text: "Tracking of the exception to its resolution or expiration.", kind: stated}
  - {from: active, to: triaged, trigger: "security risk changes", text: "Reviewing the exception again when the security risk changes.", kind: stated}
  - {from: active, to: expired, trigger: "expiration date reached", text: "Exceptions are timebound and must be renewed and re-approved if they expire before they are remediated.", kind: stated}
  - {from: expired, to: requested, trigger: "step 7", text: "Restarting the exception approval workflow if the exception expires before being remediated.", kind: stated}
error_states: [denied]
