relations:
  supersedes: []
  superseded_by: []
  # Set 2026-10-23 with summary.md (library#87). Each edge names its section.
  see_also:
    # The data model this secures. §3.1.2/§3.2.2/§3.3.2 require its
    # EnvelopedVerifiableCredential / EnvelopedVerifiablePresentation types;
    # §5.4 requires the verified document to be well-formed compact JSON-LD
    # per that spec.
    - w3c-vc-data-model-2-0
    # The OTHER securing route for the same data model, and the opposite
    # answer on condition (3): this spec canonicalises nothing (the word
    # "canonical" does not occur in it); Data Integrity is the embedded-proof
    # family. Read the two side by side for R-0006 §2.2's VC row.
    - w3c-vc-data-integrity-1-0
    # §3.1.1/§3.1.2: "A conforming JWS issuer implementation MUST use
    # [RFC7515]"; §5.1 verification is RFC 7519 validation over a JWS.
    - rfc-7515
    # §3.1.1/§3.1.2/§3.2.x: JWE nesting is the MAY for confidentiality.
    - rfc-7516
    # §3.3.1/§3.3.2: COSE_Sign1 "as specified in [RFC9052]"; §5.3 is RFC 9052's
    # COSE_Sign1 verification process, nothing added.
    - rfc-9052
    # §3.3.1/§3.3.2: `typ` (16) "as described in COSE "typ" (type) Header
    # Parameter" SHOULD be application/vc+cose / vp+cose. The one authenticated
    # type indicator in the COSE route — and only a SHOULD here.
    - rfc-9596
    # §3.3.3: CWT claims MAY sit in a COSE header "as specified in
    # I-D.ietf-cose-cwt-claims-in-headers" — published since as RFC 9597.
    # Example 24 puts iss/sub in label 15 of the protected header.
    - rfc-9597
    # §3.3.3: CWT Claims registry members interpreted per that registry.
    - rfc-8392
    # §4.1.3: `cnf` identifies a proof-of-possession key "in the manner
    # described in [RFC7800] or [RFC8747]".
    - rfc-7800
    - rfc-8747
    # Normative reference [DID-CORE]; §4.1.1 "kid MUST be present when the key
    # of the issuer or subject is expressed as a DID URL".
    - w3c-did-core
  cited_by: []
  implements_concept: []
bears_on:
  # R-I-06 (Could): export a subset of AuthzCert as a W3C VC. This is the
  # enveloping securing mechanism such an export would cite, and the source
  # R-0006 unverified.md §2 names for the ∅ VC cells.
  - R-I-06
  # DEC-003 (issuer/subject identifiers on the wire): §4.1.2 requires a
  # present `iss` to MATCH the VC `issuer` (or `issuer.id`), and §4.2
  # RECOMMENDS a `kid` that is an absolute URL embedding an RFC 7638 JWK
  # Thumbprint URI. Any DEC-003 choice that reaches a VC export has to be
  # spellable in those two slots.
  - DEC-003
