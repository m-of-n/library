usefulness:
  verdict: useful
  reason: "The securing mechanism R-I-06's VC export would cite, and it fills R-0006's ∅ VC cells for the enveloping route: signs the VC JSON bytes as an opaque JWS/COSE_Sign1 payload with no canonicalisation (condition (3) met by construction), but its type indicator `typ` is only a SHOULD, is never checked in §5, and no example carries a registered value (no header in the 18 tabbed JWS, SD-JWT and COSE examples carries typ; only Examples 21/22 and the presentations nested in Examples 6/9 carry the earlier +ld+json values, which Appendix A reports as changed) — condition (4) available, not required."
  assessed: "2026-10-23"
