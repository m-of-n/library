usefulness:
  verdict: useful
  reason: "The securing mechanism R-I-06's VC export would cite, and it fills R-0006's ∅ VC cells for the enveloping route: signs the VC JSON bytes as an opaque JWS/COSE_Sign1 payload with no canonicalisation (condition (3) met by construction), but its type indicator `typ` is only a SHOULD, is never checked in §5, and no example carries a registered value (JWS/COSE examples omit it; SD-JWT examples use the withdrawn +ld+json values) — condition (4) available, not required."
  assessed: "2026-10-23"
status: summarized
confidence: medium
