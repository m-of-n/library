count_reconciliation: "105 fixtures = 80 verbatim (every tab and display block of the 26 examples: 56 pre, 6 JWS, 6 SD-JWT, 6 COSE hex and 6 Issuer Disclosures tabs) + 25 derived. 56 vectors = 32 examples-and-tabs (6 jose, 6 sd-jwt and 6 cose tabs, and Examples 10 to 17 and 21 to 26) + 23 data: URLs (every distinct one, in a fixture, a decoded payload, a disclosure or a display) + 1 prose example (4.2). A vector outcome is fail if any check fails, else unverifiable if any check is, else pass. 29 signatures were examined (22 JWS and SD-JWT issuer or KB-JWT signatures and 7 COSE_Sign1), each against all 7 printed keys: 458 attempts (plus the non-standard COSE probes), 1 verifies. The 29 are counted per enclosing example; they are 26 distinct signature and message pairs (19 JWS, 7 COSE_Sign1), because Examples 6 and 9 enclose one SD-JWT presentation, Examples 8 and 23 one credential's issuer-signed JWT, and Examples 21 and 22 share one issuer-signed JWT. Recounted in the cross-check pass after its regrades: 592 checks, 4 more than pass 1's 588 (R-0034/R-0035 graded in EX-DU-04 and EX-DU-06); the 12 R-0072/R-0073 checks of EX-01-JOSE, EX-18-JOSE, EX-04-SDJWT, EX-18-SDJWT, EX-07-COSE and EX-18-COSE are unverifiable, not fail, because §4.2 binds only where controlled identifier documents are used."

# ====================================================================
# Conventions used in this file
# ====================================================================
#
# ids        EX-<NN>-JOSE, EX-<NN>-SDJWT and EX-<NN>-COSE: one tab of a tabbed
#            example (with its Credential or Presentation tab); EX-<NN>: an
#            untabbed example; EX-DU-<n>: data: URL n of data-urls.derived.json;
#            EX-4.2-P1: the kid printed in prose in 4.2. Never reused.
# locator    the section of the source holding the example (3.1.1 etc., as
#            numbered in the REC), the example number and the tab or block.
# html_lines line range of the element in .cache/w3c-vc-jose-cose.bin.
# fidelity   verbatim -- the source bytes after the stated transformation
#                        (an unmarked file name);
#            derived  -- computed by this extraction (.derived. in the name);
#            split    -- a value taken out of a fixture or out of prose.
# transformation  Every verbatim fixture is the textContent of its element
#            after HTML5 tree construction (html5lib 1.1): character references
#            decoded, the LF right after a <pre> start tag dropped (no fixture
#            has one). Compact JWS and SD-JWT displays put an LF before each
#            separator in the HTML source; those LFs are removed and counted.
#            The COSE hex has one LF on each side; both are removed. The Decoded
#            tab writes each line break as <br>, written here as one LF. No
#            fixture gains or loses any other character. A second, independent
#            extraction (regular expressions and html.unescape over the raw
#            bytes) reproduces all 80 verbatim fixtures byte for byte.
# results    pass: the check holds; fail: it does not (on a source example a
#            FINDING about the source, recorded and not repaired; README.md
#            lists them as D-nn); unverifiable: the source does not supply what
#            the check needs (a key, a stated result, data that is elided);
#            not-run: needs something outside the document.
# expected   what the rule or the source leads one to expect. "external: X"
#            marks a rule from a document other than this source; it is
#            context for a harness, not a statement of this source.
#            expected_basis "inferred" marks an expectation the source does
#            not state.
# rule       the requirement a check tests (w3c-vc-jose-cose#R-NNNN in
#            requirements.yaml). Checks named "R-NNNN: ..." quote the outcome
#            for that requirement; SHOULD-level departures are fail.
# signatures Every signature is tried with every public key printed anywhere
#            in the document (keys.derived.json: 7 distinct keys), ECDSA under
#            SHA-256, SHA-384 and SHA-512 whatever alg says, EdDSA when the
#            signature is 64 octets. RFC 7515 A.3 and A.4, fresh ES256, ES384 and
#            Ed25519 signatures and pycose-made COSE_Sign1 messages verify
#            through the same code and fail with one bit flipped; jwcrypto 1.6.1
#            and pycose 1.1.0 agree on every source signature.

