vectors:
  - id: "EX-01-JOSE"
    title: "Example 1: A simple example of a verifiable credential secured with JOSE, jose tab"
    example: 1
    locator: "§3.1.1, Example 1, Credential tab and jose tab"
    media_type: "application/vc+jwt"
    in_source: true
    fidelity: "verbatim"
    fixtures:
      - "ex01-credential.json"
      - "ex01-jose-protected-headers.json"
      - "ex01-jose-application-vc.json"
      - "ex01-jose-vc-jwt.jwt"
      - "ex01-jose-vc-jwt.derived.json"
      - "keys.derived.json"
      - "signatures.derived.json"
    expected_basis: "rule-quoted"
    expected_result: "a verifier following 5.1 decodes this JOSE Header and this payload; whether the signature verifies the source does not say, and none of the keys it prints verifies it, so with only the printed keys the 5.1 outcome is status false (processing aborts)"
    checks:
      - check: "ex01-jose-vc-jwt.jwt is a JWS Compact Serialization: 3 parts, each unpadded base64url in canonical form"
        expected: "3 canonical parts"
        observed: "3 parts of 90/894/86 characters, all canonical"
        result: "pass"
      - check: "the decoded JOSE Header equals ex01-jose-protected-headers.json as a JSON value"
        expected: "equal"
        observed: "equal"
        result: "pass"
      - check: "ex01-jose-protected-headers.json is exactly the decoded value written with 2-space indentation and a final LF"
        expected: "byte-identical"
        observed: "identical"
        result: "pass"
      - check: "the decoded payload equals ex01-jose-application-vc.json as a JSON value"
        expected: "equal"
        observed: "equal"
        result: "pass"
      - check: "ex01-jose-application-vc.json is exactly the decoded value written with 2-space indentation and a final LF"
        expected: "byte-identical"
        observed: "identical"
        result: "pass"
      - check: "the decoded payload equals ex01-credential.json as a JSON value"
        expected: "equal"
        observed: "equal"
        result: "pass"
      - check: "alg and signature length"
        expected: "ES256 signatures are 64 octets (external: RFC 7518 §3.4)"
