    text: 'When securing verifiable credentials with [SD-JWT], implementers SHOULD ensure that properties necessary for the validation and verification of a credential are NOT selectively disclosable (i.e., such properties SHOULD be disclosed). These properties can include but are not limited to @context, type, credentialStatus, credentialSchema, and relatedResource.'
    kind: stated
    testable: partial
    testable_reason: 'the five named properties can be checked against the disclosures; the list is open ("can include but are not limited to"), so other properties necessary for validation and verification cannot be enumerated.'
    status: active
    note: 'against this SHOULD, every SD-JWT credential example ships a disclosure for the top-level type (Examples 4, 18, 19, 21), Examples 4, 19 and 21 for members of credentialSchema, and Example 18 for members of credentialStatus and for the issuer id; so do the SD-JWT credentials enclosed in Examples 5, 8 and 23 (type, credentialSchema id and type) and the credential Example 22 carries (type, credentialSchema type). NOT is capitalised in the source but is not a BCP 14 keyword on its own, and the parenthesis restates the SHOULD rather than adding a second check, so the sentence is not split.'
