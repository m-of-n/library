    testable_reason: 'as for R-0022: no member is named to hold a presentation, and Example 9 secures an EnvelopedVerifiablePresentation object itself as vp+cose.'
    status: active
  - id: "w3c-vc-jose-cose#R-0059"
    object: 'credentials enclosed in a COSE-secured presentation'
    verb: MUST
    actor: 'holder securing the presentation, for each credential it encloses (the sentence names no actor)'
    locator: "§3.3.2, paragraph 7"
    text: 'Credentials in verifiable presentations MUST be secured. These credentials are secured using COSE in this case.'
    kind: stated
    testable: partial
    testable_reason: 'secured is checkable for each enclosed credential. The second sentence says "These credentials are secured using COSE in this case", but Example 8, the COSE presentation of this very section, encloses a data:application/vc+sd-jwt credential, Example 9 envelopes a data:application/vp+sd-jwt presentation, and Example 20 encloses vc+jwt and vc+sd-jwt credentials beside a vc+cose one.'
    status: active
  - id: "w3c-vc-jose-cose#R-0060"
    object: 'encryption of a COSE-secured presentation sent over an insecure channel'
    field: 'encrypted COSE object (RFC 9052 Section 5) with the secured presentation as its plaintext payload'
    verb: MAY
    actor: 'implementers'
    locator: "§3.3.2, paragraph 8"
    text: 'To encrypt a secured verifiable presentation when transmitting over an insecure channel, implementers MAY use COSE encryption, as defined in Section 5 of [RFC9052], by nesting the secured verifiable presentation as the plaintext payload of an encrypted COSE object.'
    kind: stated
    testable: yes
    status: active
  - id: "w3c-vc-jose-cose#R-0061"
    object: 'CWT claims carried in a COSE header'
    field: 'CWT Claims header parameter (label 15 in Examples 24 and 25)'
    verb: MAY
    actor: 'conforming COSE issuer implementation (the sentence names no actor)'
    locator: "§3.3.3, paragraph 1"
    text: 'CBOR Web Token (CWT) [RFC8392] Claims MAY be included in a COSE header parameter, as specified in I-D.ietf-cose-cwt-claims-in-headers.'
    kind: stated
    testable: yes
    status: active
    note: 'I-D.ietf-cose-cwt-claims-in-headers is a link to draft revision 10 in the HTML and has no entry in C.1 or C.2; the library holds the published document as rfc-9597 (record.yaml see_also).'
  - id: "w3c-vc-jose-cose#R-0062"
    object: 'names of COSE header parameters and CWT claims'
    field: 'iss, kid, alg, iat, exp, cnf, and any other name confusable with a VC data model member'
    verb: RECOMMENDED
    actor: 'implementers (the sentence names no actor)'
    locator: "§3.3.3, paragraph 3"
    text: 'It is RECOMMENDED to use the IANA CBOR Web Token Claims registry and the IANA COSE Header Parameters registry to identify any claims and header parameters that might be confused with members defined by [VC-DATA-MODEL-2.0]. These include but are not limited to: iss, kid, alg, iat, exp, and cnf.'
    kind: stated
    testable: no
    testable_reason: 'using a registry to spot confusable names is a design activity that leaves nothing in the secured object to observe.'
    status: active
    note: 'its JOSE twin (line 365) is in §3.1.3, a section marked non-normative.'
  - id: "w3c-vc-jose-cose#R-0063"
    object: 'CWT claims of a COSE-secured credential or presentation'
    field: 'nbf (Not Before)'
    verb: "NOT RECOMMENDED"
    actor: 'conforming COSE issuer implementation (the sentence names no actor)'
    locator: "§3.3.3, paragraph 4"
    text: 'Use of the nbf (Not Before) claim is NOT RECOMMENDED, as it makes little sense to attempt to assign a future date to a signature.'
    kind: stated
    testable: yes
    status: active
    note: 'its JOSE twin (line 366) is in §3.1.3, a section marked non-normative, so for JWTs the same advice binds nothing; Appendix A (line 1857) reports the change.'
  - id: "w3c-vc-jose-cose#R-0064"
    object: 'COSE header parameters and CWT claims that are not understood'
    verb: MUST
    actor: 'verifier, and any recipient processing the COSE headers and CWT claims (the sentence names no actor)'
    locator: "§3.3.3, paragraph 5"
    text: 'Additional members may be present as header parameters and claims. If they are not understood, they MUST be ignored.'
    kind: stated
    testable: partial
    testable_reason: 'ignoring is observable only as an unchanged result when an unknown member is added. The rule makes no exception for header parameters that a crit header parameter lists (RFC 9052 §3.1 defines crit, per the rfc-9052 record), and this document does not say how ignore meets crit.'
    status: active
    note: 'its JOSE twin (line 370) is in §3.1.3, a section marked non-normative; see the reconciliation.'
  - id: "w3c-vc-jose-cose#R-0065"
    object: 'JOSE or COSE header of a secured credential or presentation'
    field: 'kid'
    verb: MUST
    actor: 'issuer, or holder securing a presentation, producing the header (the sentence names no actor)'
    locator: "§4.1.1, paragraph 2"
    text: 'kid MUST be present when the key of the issuer or subject is expressed as a DID URL.'
    kind: stated
    testable: partial
    testable_reason: 'a key expressed as a DID URL is not defined (an issuer or subject is identified, a key is referenced), and subject is left open between the credential subject and the holder; a test can check that kid is present when the issuer or holder identifier is a DID.'
    status: active
  - id: "w3c-vc-jose-cose#R-0066"
    object: 'iss of a secured credential against its issuer property'
    field: 'iss; issuer (a string)'
    verb: MUST
    actor: 'issuer implementation producing iss (the sentence names no actor); a verifier can check it'
    locator: "§4.1.2, paragraph 2, sentence 2"
    text: 'When issuer value is a string, iss value, if present, MUST match issuer value.'
    kind: stated
    testable: partial
    testable_reason: 'match is not defined; exact string equality is the plain reading. Paragraph 1 lets iss sit in the JOSE header, the JWT claims or the COSE header, and the section does not say what iss must match in a presentation, where holder replaces issuer.'
    status: active
  - id: "w3c-vc-jose-cose#R-0067"
    object: 'iss of a secured credential against its issuer property'
    field: 'iss; issuer.id (issuer an object)'
    verb: MUST
    actor: 'issuer implementation producing iss (the sentence names no actor); a verifier can check it'
    locator: "§4.1.2, paragraph 2, sentence 3"
    text: 'When issuer value is an object with an id value, iss value, if present, MUST match issuer.id value.'
    kind: stated
    testable: partial
    testable_reason: 'as for R-0066.'
    status: active
  - id: "w3c-vc-jose-cose#R-0068"
    object: 'proof-of-possession key of a secured credential'
    field: 'cnf'
    verb: MAY
    actor: 'verifier'
    locator: "§4.1.3, paragraph 1"
    text: 'If cnf is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier MAY use this parameter to identify a proof-of-possession key in the manner described in [RFC7800] or [RFC8747] for use in the verification process.'
    kind: stated
    testable: yes
    status: active
  - id: "w3c-vc-jose-cose#R-0069"
    object: 'holder binding of a credential'
    field: 'proof-of-possession key (cnf, by the section heading)'
    verb: RECOMMENDED
    actor: 'Issuer, with a key the Holder provides (the sentence names no actor)'
    locator: "§4.1.3, paragraph 2"
    text: 'Use of a proof-of-possession key provided by the Holder to the Issuer to establish a cryptographic binding to the Holder in the Verifiable Credential that is verifiable by the Verifier in the Verifiable Presentation is RECOMMENDED.'
    kind: stated
    testable: partial
    testable_reason: 'a key in the credential can be checked for; that the holder provided it, and that the verifier checks the binding in the presentation, are not observable from the credential, and no step of §5.1 to §5.3 mentions cnf or key binding.'
    status: active
  - id: "w3c-vc-jose-cose#R-0070"
    object: 'verification method in a controlled identifier document'
    field: 'type: JsonWebKey'
    verb: MUST
    actor: 'controller of the controlled identifier document (the sentence names no actor)'
    locator: "§4.2, paragraph 2"
    text: 'The value of the type property of the verification method MUST be JsonWebKey.'
    kind: stated
    testable: yes
    status: active
    note: 'Example 17 (§8.1, line 1194) lists a verification method of type JsonWebKey2020. It sits under the opening of §4.2, "When using controlled identifier documents with this specification, the following requirements apply." (§4.2, paragraph 1), so it binds only where controlled identifier documents are used, and an example that does not use one neither meets nor breaks it.'
  - id: "w3c-vc-jose-cose#R-0071"
    object: 'verification method in a controlled identifier document'
    field: 'publicKeyJwk'
    verb: MUST
    actor: 'controller of the controlled identifier document (the sentence names no actor)'
    locator: "§4.2, paragraph 3"
    text: 'Verification material MUST be expressed in the publicKeyJwk property of a JsonWebKey.'
    kind: stated
    testable: yes
    status: active
    note: 'It sits under the opening of §4.2, "When using controlled identifier documents with this specification, the following requirements apply." (§4.2, paragraph 1), so it binds only where controlled identifier documents are used, and an example that does not use one neither meets nor breaks it.'
  - id: "w3c-vc-jose-cose#R-0072"
    object: 'kid of a credential whose issuer is a URL and which carries no iss'
    field: 'kid'
    verb: MUST
    actor: 'issuer implementation producing the header (the sentence names no actor)'
    locator: "§4.2, paragraph 4"
    text: 'When iss is absent, and the issuer is identified as a [URL], the kid MUST be an absolute [URL] to a verification method listed in a controlled identifier documents or a DID Document.'
    kind: stated
    testable: partial
    testable_reason: 'that kid is an absolute URL is checkable; that the verification method it names is listed in a controlled identifier document or DID Document can be checked only by retrieving that document, and paragraph 3 says "there is no standard way to retrieve a public key in JWK format from a DID URL or controlled identifier documents".'
    status: active
    note: '"a controlled identifier documents" is printed with the plural; kept as printed. It sits under the opening of §4.2, "When using controlled identifier documents with this specification, the following requirements apply." (§4.2, paragraph 1), so it binds only where controlled identifier documents are used, and an example that does not use one neither meets nor breaks it.'
  - id: "w3c-vc-jose-cose#R-0073"
    object: 'kid of a credential whose identifiers are URLs'
    field: 'kid: an absolute URL that includes a JWK Thumbprint URI'
    verb: RECOMMENDED
    actor: 'issuer implementation producing the header (the sentence names no actor)'
    locator: "§4.2, paragraph 5"
    text: 'When using [URL] identifiers, the kid is RECOMMENDED to be an absolute [URL] that includes a JWK Thumbprint URI as defined in [RFC7638].'
    kind: stated
    testable: yes
    status: active
    note: 'the example after it embeds urn:ietf:params:oauth:jwk-thumbprint:sha-256:...; [RFC7638] (C.1, line 1890) defines the JWK Thumbprint and no URI form (urn:ietf:params:oauth occurs 0 times in it). The URI prefix is defined by RFC 9278 §3, which the source does not cite (9278 occurs 0 times in it), and the printed example ends with RFC 9278 §6''s example URI, whose thumbprint is the RFC 7638 §3.1 example value. Checked in the verify pass against fetched copies of both RFCs, with the digests schema/README.md lists (F-06); normative.md SD-34. It sits under the opening of §4.2, "When using controlled identifier documents with this specification, the following requirements apply." (§4.2, paragraph 1), so it binds only where controlled identifier documents are used, and an example that does not use one neither meets nor breaks it.'
  - id: "w3c-vc-jose-cose#R-0074"
    object: 'kid of a presentation whose holder is a URL and which carries no iss'
    field: 'kid'
    verb: MUST
    actor: 'holder securing the presentation (the sentence names no actor)'
    locator: "§4.2, paragraph 6"
    text: 'When the holder is identified as a [URL], and iss is absent, the kid MUST be an absolute [URL] to a verification method listed in a controlled identifier document.'
    kind: stated
    testable: partial
    testable_reason: 'as for R-0072: an absolute URL is checkable; the listing needs the controlled identifier document retrieved.'
    status: active
    note: 'It sits under the opening of §4.2, "When using controlled identifier documents with this specification, the following requirements apply." (§4.2, paragraph 1), so it binds only where controlled identifier documents are used, and an example that does not use one neither meets nor breaks it.'
  - id: "w3c-vc-jose-cose#R-0075"
    object: 'verifier processing of untrusted data'
    verb: SHOULD
    actor: 'verifiers'
    locator: "§5, paragraph 2"
    text: 'As a general rule, verifiers SHOULD strive to minimize the processing of untrusted data. This includes minimizing any processing of the protected header, unprotected header, or payload as part of the key discovery procedures.'
    kind: stated
    testable: no
    testable_reason: 'strive to minimize sets no measurable bound. It also pulls against §4.1, whose key discovery reads kid, iss and cnf from the very header and claims this sentence asks verifiers to process minimally.'
    status: active
  - id: "w3c-vc-jose-cose#R-0076"
    object: 'validation after verification'
    verb: SHOULD
    actor: 'verifier (the sentence names no actor)'
    locator: "§5, paragraph 3"
    text: 'After verification has succeeded, additional validation checks SHOULD be performed as described in Section 5.4 Validation'
    kind: stated
    testable: partial
    testable_reason: 'an umbrella pointing at §5.4 (R-0077 to R-0085); a test sees the §5.4 checks, not this sentence.'
    status: active
    note: 'the sentence has no closing full stop in the source; the text is quoted as printed.'
  - id: "w3c-vc-jose-cose#R-0077"
    object: 'verified credential or presentation'
    field: 'claims expected for the typ'
    verb: MUST
    actor: 'verifier, as a §5.4 validation check (the passive sentence also binds the producer of the document)'
    locator: "§5.4, paragraph 1, sentence 1"
    text: 'All claims expected for the typ MUST be present.'
    kind: stated
    testable: no
    testable_reason: 'no part of this document says which claims are expected for a typ value, so the set to check is undefined.'
    status: active
  - id: "w3c-vc-jose-cose#R-0078"
    object: 'verified credential or presentation'
    field: 'claims the verifier understands'
    verb: MUST
    actor: 'verifier'
    locator: "§5.4, paragraph 1, sentence 2"
    text: 'All claims that are understood MUST be evaluated according the verifier''s validation policies.'
    kind: stated
    testable: partial
    testable_reason: 'the evaluation follows the verifier''s own policies, which this document leaves undefined; a test can check only that a claim its policy rejects causes rejection.'
    status: active
    note: '"evaluated according the" is printed without to; kept as printed.'
  - id: "w3c-vc-jose-cose#R-0079"
    object: 'verified credential or presentation'
    field: 'claims the verifier does not understand'
    verb: MUST
    actor: 'verifier (the sentence names no actor)'
    locator: "§5.4, paragraph 1, sentence 3"
    text: 'All claims that are not understood MUST be ignored.'
    kind: stated
    testable: yes
    status: active
    note: 'it reaches claims only; for JOSE header parameters that are not understood the only rule is line 370, in §3.1.3, which is marked non-normative.'
  - id: "w3c-vc-jose-cose#R-0080"
    object: 'document returned by §5.1 to §5.3'
    field: 'document'
    verb: MUST
    actor: 'verifier (the sentence names no actor)'
    locator: "§5.4, paragraph 2"
    text: 'The verified document returned from verification MUST be a well-formed compact JSON-LD document, as described in Verifiable Credentials Data Model v2.0.'
    kind: stated
    testable: partial
    testable_reason: 'well-formed compact JSON-LD is defined in [VC-DATA-MODEL-2.0], not here, and §5.3 sets document to the decoded COSE_Sign1 payload without saying how those bytes become a JSON-LD document.'
    status: active
  - id: "w3c-vc-jose-cose#R-0081"
    object: 'credentialSchema of a verified credential'
    field: 'credentialSchema'
    verb: SHOULD
    actor: 'verifier (the sentence names no actor)'
    locator: "§5.4, paragraph 3, sentence 1"
    text: 'Schema extension mechanisms such as credentialSchema SHOULD be checked.'
    kind: stated
    testable: partial
    testable_reason: 'checked is not defined: §5.4 says neither what the check is nor what a failed check does.'
    status: active
  - id: "w3c-vc-jose-cose#R-0082"
    object: 'credentialSchema of a verified credential'
    field: 'credentialSchema whose type is not understood'
    verb: MUST
    actor: 'verifier (the sentence names no actor)'
    locator: "§5.4, paragraph 3, sentence 2"
    text: 'If the extension mechanism type is not understood, this property MUST be ignored.'
    kind: stated
    testable: yes
    status: active
    note: 'its text is identical to R-0084''s; this one is the credentialSchema rule, pointing back at R-0081.'
  - id: "w3c-vc-jose-cose#R-0083"
    object: 'credentialStatus of a verified credential'
    field: 'credentialStatus'
    verb: SHOULD
    actor: 'verifier (the sentence names no actor)'
    locator: "§5.4, paragraph 4, sentence 1"
    text: 'Status extension mechanisms such as credentialStatus SHOULD be checked.'
    kind: stated
    testable: partial
    testable_reason: 'checked is not defined: §5.4 says neither what the check is nor what a failed check does.'
    status: active
  - id: "w3c-vc-jose-cose#R-0084"
    object: 'credentialStatus of a verified credential'
    field: 'credentialStatus whose type is not understood'
    verb: MUST
    actor: 'verifier (the sentence names no actor)'
    locator: "§5.4, paragraph 4, sentence 2"
    text: 'If the extension mechanism type is not understood, this property MUST be ignored.'
    kind: stated
    testable: yes
    status: active
    note: 'its text is identical to R-0082''s; this one is the credentialStatus rule, pointing back at R-0083.'
  - id: "w3c-vc-jose-cose#R-0085"
    object: 'validation beyond §5.4'
    verb: MAY
    actor: 'verifier'
    locator: "§5.4, paragraph 5"
    text: 'Based on the validation policy of the verifier, the type of credentials, and the type of securing mechanism, additional validation checks MAY be applied.'
    kind: stated
    testable: partial
    testable_reason: 'the checks are the verifier''s own policy; the example after it (dependencies, ordering or timing across credentials and presentations) illustrates and does not define them.'
    status: active
