reconciliation: >-
  bin/bcp14-count on .cache/w3c-vc-jose-cose.txt, and on the HTML itself, finds 97 BCP 14 keywords
  once the §1.1 recital (line 112) is stripped: MUST 48, SHOULD 25, MAY 11, RECOMMENDED 6, NOT
  RECOMMENDED 4, MUST NOT 2, SHOULD NOT 1. ReSpec marks 104 keywords in the HTML with the rfc2119
  class, the recital's seven and exactly these 97, and no keyword occurs in capitals without that
  mark, so markup and counter agree. The 85 entry texts carry 87: MUST 44, SHOULD 24, MAY 11,
  RECOMMENDED 5, NOT RECOMMENDED 2, MUST NOT 1, SHOULD NOT 0. The 10 keywords not extracted are
  not requirements of this document, each named by line.

  (a) 3 MUST at lines 116, 119 and 122 (§1.1.1), in the definitions of conforming JWS, SD-JWT and
  COSE documents, where the keyword stands in quotation marks as the name of the class of
  statements a conforming document satisfies in §3.1, §3.2 or §3.3: a mention, not a use. The
  definitions bind through the §3.1, §3.2 and §3.3 entries they point at. Two consequences for a
  test: a conforming document is defined by the MUST statements alone, so no SHOULD or RECOMMENDED
  bears on it; and many of those MUST statements bind implementations rather than documents (for
  example R-0015, R-0025).

  (b) 6 in §3.1.3, which the source marks "This section is non-normative." (class appendix
  informative in the HTML), and §1.1 makes sections marked non-normative non-normative: line 365
  RECOMMENDED, the registry advice, normative only in its COSE twin R-0062; line 366 NOT
  RECOMMENDED, nbf, normative only in its COSE twin R-0063; line 368 SHOULD and SHOULD NOT, claim
  values that conflict with credential properties, which have no twin, though R-0066 and R-0067
  make the iss and issuer pair binding (its SHOULD NOT sentence says "JWK claim iss", where iss is
  a JWT claim); line 369 MUST NOT, the vc and vp claim names, which restates R-0006, the binding
  statement; line 370 MUST, header parameters and claims that are not understood, normative only
  in its COSE twin R-0064 and, for claims, in R-0079. For JOSE header parameters nothing normative
  remains, and RFC 7515 §4.1.11 says the opposite of ignoring for a parameter that crit lists: "If
  any of the listed extension Header Parameters are not understood and supported by the recipient,
  then the JWS is invalid." §1.1.1 still defines a conforming JWS document by every MUST statement
  of §3.1, and §3.1 contains §3.1.3, so whether lines 369 and 370 bind a JWS document is
  unsettled.

  (c) 1 NOT RECOMMENDED at line 1857, Appendix A, the non-normative revision history, reporting
  that nbf became NOT RECOMMENDED; it binds nothing, and the statement it reports is R-0063 (and
  line 366).

  97 - 3 - 6 - 1 = 87. Checked by script: every keyword match in the source outside the recital
  (97 examined) maps to exactly one entry text (87) or to one of the 10 lines above (10), with
  none left over and none covered twice. No keyword sits in a note (the document has no note
  blocks), in any of its 26 example blocks, or in §6, §7 or §8, which are marked non-normative.

  Splits, multi-sentence texts and the two entries with two keywords are listed in note.

  Lowercase is not BCP 14 here: §1.1 adopts RFC 8174 ("when, and only when, they appear in all
  capitals"). Named for the verify pass, as normative-sounding text left out, in source order.
  §1.1.2: line 131 "all claims in that set must be revealed", which describes JWT and binds no
  agent; line 141 imports "The normative statements in Securing Mechanisms apply" to all six media
  types, statements that belong to the w3c-vc-data-model-2-0 record. §1.1.2.1 line 145 "are
  advised to review Implementation Requirements", and the sentence after R-0004's on line 146,
  which says what "alg": "none" communicates and is carried in its testable_reason. §1.1.2.2 list
  items (lines 153 to 156): "optional disclosures, and an optional KB-JWT", and "If the KB-JWT is
  not present, the SD-JWT must end with a tilde (~) character." with "This is crucial for correct
  parsing", which restate the SD-JWT format. §3.1.1, §3.1.2, §3.2.1, §3.2.2, §3.3.1 and §3.3.2:
  the payload definition after each issuer MUST (lines 184, 272, 377, 512, 627, 709), for example
  "The unsecured verifiable credential is the unencoded JWS payload.", and §3.2.1's "The Issuer
  then converts the input JWT Claims Set (i.e., the unsecured verifiable credential) into an
  [SD-JWT] payload according to SD-JWT issuance instructions."; the cty and content type sentences
  after each SHOULD (lines 185, 273, 378, 513, 628, 710), for example "The content type header
  parameter is optional, and can be used to express a more specific media type than application/vc
  when one is available."; and "In this case, these credentials are secured using JWS." and its
  two twins, which are carried in R-0023, R-0039, R-0059. §3.1.3 (non-normative): line 362 "are to
  be interpreted as defined by the specifications referenced in the registries", line 363 "The
  normative statements in Registered Header Parameter Names, JOSE Header, and Replicating Claims
  as Header Parameters apply", which a section marked non-normative cannot make binding, line 364
  "The unencoded JOSE Header is JSON (application/json), not JSON-LD (application/ld+json).",
  which has no normative twin, line 366's statement that iat and exp are the times of the
  signature, and line 370's may, the lead-in to the MUST counted under (b). §3.3.3: line 783 "are
  to be interpreted as defined by the specifications referenced in those registries", and line 784
  "The normative statements in Header Parameters, Claims, and CBOR Web Token (CWT) Claims in COSE
  Headers apply" to securing credentials and presentations, statements that belong to the cited
  documents; line 786 "they represent the issuance and expiration time of the signature,
  respectively", which separates them from validFrom and validUntil; the may of line 787 leads
  into R-0064 and is carried in its text. §4: line 791 "a verifier needs to obtain the
  cryptographic keys"; §4.1 line 796 "can be used by verifiers to discover verification keys";
  §4.1.1 line 800 and §4.1.2 line 805, a verifier can use kid or iss; §4.1.2 line 807 "it is used
  to distinguish the specific key used"; §4.2 line 816 "the following requirements apply", the
  lead-in to R-0070 to R-0074, and line 818 "This key material is retrieved based on hints in the
  JOSE or COSE message envelopes, such as kid or iss." §5: line 856 "is assumed to have succeeded
  prior to beginning the verification process"; lines 859 to 862, the outputs status, document and
  mediaType; and the algorithms of §5.1, §5.2 and §5.3, each introduced by "the holder or verifier
  follows this algorithm" (lines 869, 887, 905) and written as imperative steps (Follow, Set,
  Return) with no keyword. They are normative, since §5 is not marked non-normative, but they are
  not BCP 14 statements, so they are not entries here. Two defects in them bear on R-0080: §5.2
  takes only "inputMediaType: vc+sd-jwt" and sets mediaType to vc alone (line 891), though its
  heading and line 887 cover presentations and §3.2.2 defines vp+sd-jwt; and §5.1's inputDocument
  is "the verifiable credential secured as a JWT" though its inputMediaType admits vp+jwt. §6
  (non-normative): "some of which may be the empty string" in each JWT and SD-JWT registration
  (lines 939, 965, 991, 1017). §7 (non-normative): line 1094 "needs to be protected", advised to
  (lines 1095, 1096, 1101, 1107, 1115), best practice (lines 1098 to 1100), line 1105 "It is
  important to carefully consider these factors", it is essential (lines 1106 and 1110), line 1107
  "conduct regular security assessments and audits", line 1114 "it is crucial for technical
  implementers" and "it is vital to adhere to accessibility guidelines and standards", the
  imperatives "Follow all security considerations outlined in [RFC7515] and [RFC7519]." and "take
  special care around remote retrieval of contexts", and line 1110 "strict validation is a
  security requirement" and "be rejected in their entirety by JSON parsers". §8.5 (non-normative)
  line 1808 "Remember that all actual interchange always happens in the binary format." Appendix A
  (non-normative) line 1855 "may be selectively disclosed". The front matter is W3C process and
  patent text, not this specification: line 39 "mandatory feature", line 41 "W3C recommends" and
  line 43 "must disclose".
