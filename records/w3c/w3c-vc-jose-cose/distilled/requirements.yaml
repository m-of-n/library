    testable_reason: 'an umbrella statement, tested through the §3.3 entries it points at (R-0045 to R-0064), §3.3.3 included.'
    status: active
  - id: "w3c-vc-jose-cose#R-0004"
    object: 'unsecured JWT (the "alg": "none" header parameter setting)'
    field: 'alg (value none)'
    verb: MUST
    actor: 'Issuers, Holders, and Verifiers of JWTs'
    locator: "§1.1.2.1, paragraph 2"
    text: 'Issuers, Holders, and Verifiers of JWTs MUST understand the effect of the JSON Web Token header parameter setting of "alg": "none" when using JSON Web Tokens to secure [VC-DATA-MODEL-2.0].'
    kind: stated
    testable: no
    testable_reason: 'understanding is not observable. The next sentence of the paragraph states the effect: with "alg": "none" the JWT Claims Set "has no integrity protection"; the observable duty is R-0005.'
    status: active
  - id: "w3c-vc-jose-cose#R-0005"
    object: 'JWT Claims Set with no integrity protection'
    verb: MUST
    actor: 'Issuers, Holders, and Verifiers (of JWTs, by the section)'
    locator: "§1.1.2.1, paragraph 3"
    text: 'Issuers, Holders, and Verifiers MUST ignore all JWT Claims Sets that have no integrity protection.'
    kind: stated
    testable: partial
    testable_reason: 'ignore is not defined against the outputs of §5 (status, document, mediaType); a test can check only that a JWT secured with "alg": "none" is never returned as a verified document.'
    status: active
  - id: "w3c-vc-jose-cose#R-0006"
    object: 'JWT Claims Set of a verifiable credential or presentation'
    field: 'vc, vp (JWT claim names)'
    verb: "MUST NOT"
    actor: 'producer of the JWT Claims Set, a JWS or SD-JWT issuer implementation (the sentence names no actor)'
    locator: "§1.1.2.1, paragraph 4"
    text: 'The JWT Claim Names vc and vp MUST NOT be present in any JWT Claims Set that comprises a verifiable credential or a verifiable presentation.'
    kind: stated
    testable: yes
    status: active
    note: '§3.1.3 restates it as "The JWT Claim Names vc and vp MUST NOT be present." (line 369) in a section marked non-normative; this sentence is the binding one.'
  - id: "w3c-vc-jose-cose#R-0007"
    object: 'SD-JWT format and processing'
    verb: SHOULD
    actor: 'Implementers'
    locator: "§1.1.2.2, paragraph 1"
    text: 'This specification uses Selective Disclosure for JWTs (SD-JWT) as defined in the IETF draft [SD-JWT]. Implementers SHOULD refer to this draft for the full details of the SD-JWT format and processing requirements.'
    kind: stated
    testable: no
    testable_reason: 'consulting a document is not observable. [SD-JWT] is cited as an Internet-Draft with no revision (C.1, line 1906), so the draft meant is not pinned.'
    status: active
