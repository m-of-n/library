note: >-
  Ids are stable and never reused. Cite as w3c-vc-jose-cose#R-NNNN. Entries are in source order,
  with no exception: one per BCP 14 statement of the normative text, 85 in all, every one kind
  stated.

  SOURCE TEXT. Every text is a contiguous run of one line of .cache/w3c-vc-jose-cose.txt (sha256
  f02bd4966800863d533746c6c39ad267ada1b8bfcbb92186c204b617bb46c126), the plain-text rendering of
  the W3C HTML whose digest is source_digest. The rendering puts each HTML block element on one
  line and only collapses whitespace, so no text crosses a paragraph; each text was also found
  unchanged in the HTML with its markup removed, so none carries a rendering artefact. Nothing is
  healed: R-0076 ends without a full stop because its sentence does, and the defects named in
  entry notes are kept as printed.

  TEXT RULE. A text is the sentence that carries its keyword. It is extended back over the
  sentence before it where the keyword sentence points back at that one (R-0007, this draft;
  R-0064, they), and forward over a following sentence of the same paragraph that opens by
  pointing back at it (This, These, In this case) to say what it covers (R-0023, R-0031, R-0039,
  R-0040, R-0059, R-0062, R-0075). A sentence that holds its own keyword is never merged into
  another entry, so R-0082 and R-0084 point back at the SHOULD before each of them and carry
  identical text, told apart by locator and field. Sentences without a keyword that do not point
  back stay out, among them the payload definition after each issuer MUST and the cty and content
  type sentences after each SHOULD; object, field and testable_reason carry what they say, and the
  reconciliation names them.

  SPLITS. Two sentences are split, because each part is separately testable; the joining and
  belongs to neither part: R-0042/R-0043 (§3.2.2, MUST support the compact serialization and MAY
  support the JSON one) and R-0045/R-0046 (§3.3, MAY be secured using COSE and SHOULD be
  identified through content types). Not split: R-0031 and R-0040, whose parenthesis restates the
  SHOULD before it; they are the only entries with two keywords, and their verb is SHOULD.

  VERBS. verb is the keyword as printed. §1.1 lists seven keywords (MAY, MUST, MUST NOT, NOT
  RECOMMENDED, RECOMMENDED, SHOULD, SHOULD NOT) and all seven occur; REQUIRED, SHALL and OPTIONAL
  do not occur in capitals. NOT stands capitalised alone twice (lines 380 and 518, are NOT
  selectively disclosable); it is emphasis, not a keyword, and the counter does not count it.

  ACTORS. actor is who must comply, in the source's words where the sentence names one. Where the
  sentence is passive or names only its object, the actor is our attribution and says (the
  sentence names no actor). This document calls whoever secures a presentation a conforming JWS,
  SD-JWT or COSE issuer implementation too (§3.1.2, §3.2.2, §3.3.2), so that class name appears
  for a holder's work.

  LOCATORS. A section sign and the section number of the .txt heading, then paragraph N, counting
  the section's own paragraphs from its heading, with subsections, example blocks and list items
  left out and the See Verifiable Credentials Data Model v2.0 line after each example counted.
  This is paragraphs only, not normative.md's count of every block (each list, table and example
  one, as ¶n), which design-notes.md and protocol.yaml use; the two differ wherever a list or an
  example comes earlier in the section, so paragraph 11 of §3.1.2 (R-0025) is normative.md's ¶13
  (N-044). An empty paragraph renders no line and is not counted: the HTML has three, one each in
  §3.1.2, §3.2.2 and §3.3.2, after paragraph 7;
  then sentence N where a paragraph holds more than one entry, and before and / after and for the
  two split sentences. Every locator was checked by script to name the section that contains its
  text.

  TESTABLE. yes when a conformance test can observe the behaviour in the secured object or at an
  interface; partial or no carries a testable_reason. A MAY is yes where the permitted behaviour
  can be observed when an implementation takes it up. note, on an entry, records a source tension
  or defect that bears on it; the ones that bear on many entries are listed here.

  IDENTICAL TEXTS. The source restates its rules per media type, so 11 groups of entries carry
  identical text: R-0012, R-0017; R-0014, R-0029; R-0015, R-0020; R-0019, R-0035; R-0021, R-0037,
  R-0057; R-0022, R-0038, R-0058; R-0027, R-0033; R-0030, R-0036; R-0047, R-0053; R-0050, R-0056;
  R-0082, R-0084. Tell them apart by locator, object and field, and emit any citation of them from
  this table by script (bin/check-id-joins --surface).

  TENSIONS ACROSS ENTRIES. (1) this media type, in each issuer MUST (R-0012, R-0017, R-0027,
  R-0033, R-0047, R-0053), has no antecedent: its section names no media type before it, so it
  reads as either the unsecured type (application/vc, application/vp) or the secured one
  (application/vc+jwt and the rest). In each verifier MUST (R-0015, R-0020, R-0030, R-0036,
  R-0050, R-0056) the nearest candidates are the typ and cty values of the paragraph before, which
  name one of each. The test is the same under every reading. (2) The conformance classes of
  §1.1.1 point only at §3.1, §3.2 and §3.3. No class points at §4 or §5, so the key-discovery
  entries (R-0065, R-0066, R-0067, R-0068, R-0069, R-0070, R-0071, R-0072, R-0073, R-0074) and the
  verification and validation entries (R-0075, R-0076, R-0077, R-0078, R-0079, R-0080, R-0081,
  R-0082, R-0083, R-0084, R-0085) bind no named class; their actor is the role the sentence
  implies. (3) [SD-JWT] is cited as an Internet-Draft with no revision (C.1, line 1906), so the
  entries that depend on it (R-0007, R-0027, R-0030, R-0031, R-0032, R-0033, R-0036, R-0040,
  R-0041, R-0042, R-0043) can be tested only against a revision the tester picks. (4) §3.1.3, the
  JOSE header and claims section, is marked non-normative while its COSE twin §3.3.3 is normative;
  the reconciliation names the six keywords this leaves without force.

requirements:
  - id: "w3c-vc-jose-cose#R-0001"
    object: 'conformance class: conforming JWS issuer implementation'
    verb: MUST
    actor: 'conforming JWS issuer implementation'
    locator: "§1.1.1, paragraph 2"
    text: 'A conforming JWS issuer implementation produces conforming JWS documents and MUST secure them as described in Section 3.1 With JOSE.'
    kind: stated
    testable: partial
    testable_reason: 'an umbrella statement, tested through the §3.1 entries it points at (R-0012 to R-0026). Section 3.1 contains §3.1.3, which is marked non-normative yet holds a MUST NOT and a MUST (lines 369 and 370; see the reconciliation), so how far "as described in Section 3.1" reaches is unsettled.'
    status: active
  - id: "w3c-vc-jose-cose#R-0002"
    object: 'conformance class: conforming SD-JWT issuer implementation'
    verb: MUST
    actor: 'conforming SD-JWT issuer implementation'
    locator: "§1.1.1, paragraph 5"
    text: 'A conforming SD-JWT issuer implementation produces conforming SD-JWT documents and MUST secure them as described in Section 3.2 With SD-JWT.'
    kind: stated
    testable: partial
    testable_reason: 'an umbrella statement, tested through the §3.2 entries it points at (R-0027 to R-0044).'
    status: active
