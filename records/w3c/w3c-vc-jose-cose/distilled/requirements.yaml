    testable: partial
    testable_reason: 'phrased as an example of R-0009, but it carries its own SHOULD in a normative paragraph, not an example block, so it is extracted; its unless clause leaves a more specific media type open, so a test can flag only application/sd-jwt used where application/vc+sd-jwt applies.'
    status: active
  - id: "w3c-vc-jose-cose#R-0011"
