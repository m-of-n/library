# DERIVED, not verbatim. Written by this library: the rules of the W3C
# Recommendation Securing Verifiable Credentials using JOSE and COSE
# (REC-vc-jose-cose-20250515) that relate two fields, or a field and a
# condition outside the object, and so cannot be written in JSON Schema or
# CDDL. Source .cache/w3c-vc-jose-cose.bin, sha256
# 6c70cf8d7de9d8a3ff28a743fea9d569a67a402111c3245fdafbaa2ad6709af9.
# Each rule names its requirement ids; text is the requirement's own text,
# verbatim, copied from requirements.yaml by script, and so is locator, which
# therefore counts paragraphs only, as requirements.yaml does (normative.md's
# ¶n counts every block: R-0074's paragraph 6 of §4.2 is its ¶8). Every other value is
# this library's wording. inferred says what is this library's reading.
# examples is computed from the decoded examples, never typed.
# The schemas these rules call are named by file and anchor.
schema: "library-derived-rules/v0"
record: w3c-vc-jose-cose
source_digest: "6c70cf8d7de9d8a3ff28a743fea9d569a67a402111c3245fdafbaa2ad6709af9"
levels:
  - level: MUST
    reported_as: "non-conformance"
  - level: MUST_NOT
    reported_as: "non-conformance"
  - level: SHOULD
    reported_as: "warning"
  - level: RECOMMENDED
    reported_as: "warning"
rules:
  - id: X-01
    requirements:
      - id: "w3c-vc-jose-cose#R-0066"
        level: MUST
        locator: "§4.1.2, paragraph 2, sentence 2"
        text: "When issuer value is a string, iss value, if present, MUST match issuer value."
    applies_to: "a secured credential: JWS (vc+jwt), SD-JWT (vc+sd-jwt) or COSE_Sign1 (vc+cose), decoded with its payload"
    condition: "the credential's issuer property is a string, and iss is present in one of the places this sentence names: 'If iss is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier can use this parameter to obtain a JSON Web Key to use in the verification process.' (§4.1.2)"
    check: "every iss present (JOSE header iss; JWT claim iss, plaintext or disclosed; COSE CWT Claims (15) key 1, either bucket) equals issuer, as strings"
    inferred: "match read as exact string equality, the plain reading R-0066's testable_reason names; a presentation, which has holder and no issuer, is not covered, because the source states no rule for it"
    examples: "computed over 29 secured objects: iss is present in 2 (Ex21 JSON, object in its data: URL sd-jwt; Ex22 JSON, object in its data: URL sd-jwt), each with a string issuer it equals: 2 pass. Example 24 prints a CWT iss (urn:example:123) with no payload to compare"
  - id: X-02
    requirements:
      - id: "w3c-vc-jose-cose#R-0067"
        level: MUST
        locator: "§4.1.2, paragraph 2, sentence 3"
        text: "When issuer value is an object with an id value, iss value, if present, MUST match issuer.id value."
    applies_to: "as X-01"
    condition: "the credential's issuer property is an object with an id member, and iss is present as in X-01"
    check: "every iss present equals issuer.id, as strings"
    inferred: "as X-01"
    examples: "computed: 0 objects have an object issuer and an iss (none); not exercised. Example 18 uses an object issuer and carries no iss"
  - id: X-03
    requirements:
      - id: "w3c-vc-jose-cose#R-0065"
        level: MUST
        locator: "§4.1.1, paragraph 2"
        text: "kid MUST be present when the key of the issuer or subject is expressed as a DID URL."
    applies_to: "a JOSE or COSE header together with the payload it secures"
    condition: "the condition the requirement states holds; observable proxy: the issuer (or issuer.id) of a credential, or the holder (or holder.id) of a presentation, is a DID, that is, it starts with did:"
    check: "kid is present: jose-header.derived#kid-present for JOSE; label 4 in either bucket for COSE"
    inferred: "the proxy is this library's, taken from R-0065's testable_reason; the sentence names subject, which may mean the credential subject or the holder"
    examples: "computed: 3 objects have a DID issuer or holder (Ex19 jws; Ex19 sd-jwt; Ex19 cose); kid present in 2 (Ex19 jws; Ex19 sd-jwt); absent in 1 (Ex19 cose), which fail"
  - id: X-04
    requirements:
      - id: "w3c-vc-jose-cose#R-0072"
        level: MUST
        locator: "§4.2, paragraph 4"
        text: "When iss is absent, and the issuer is identified as a [URL], the kid MUST be an absolute [URL] to a verification method listed in a controlled identifier documents or a DID Document."
    applies_to: "a secured credential, decoded with its header"
    condition: "section 4.2 applies (controlled identifier documents are used), iss is absent from the JOSE header, the JWT claims and the COSE header alike, and issuer (or issuer.id) is a URL, a DID included, since a DID parses as an absolute URL under the URL Standard and the sentence names DID Documents (inferred)"
    check: "kid is an absolute URL: jose-header.derived#kid-absolute-url for JOSE; for COSE, kid (4) is a bstr and the source does not say how a URL is carried in it, so the check is not defined"
    inferred: "absent is read as absent from every place iss may sit (section 4.1.2); that the URL names a verification method listed in a controlled identifier document or DID Document needs the document retrieved"
    examples: "conditional on section 4.2, which no example asserts. Were it applied: 10 credentials have a URL issuer and no iss (Ex1 jws; Ex18 jws; Ex19 jws; Ex4 sd-jwt; Ex18 sd-jwt; Ex19 sd-jwt; Ex7 cose; Ex18 cose; Ex19 cose; Ex2 [Presentation] JSON, object in the data: URL at $.verifiableCredential[0].id jws); 0 of them have an absolute-URL kid, so each JOSE and SD-JWT one would fail (kid ExHkBMW9fmbkvV266mRpuP2sUY_N_EWIN1lapUzO8ro) and the COSE ones carry no kid"
  - id: X-05
    requirements:
      - id: "w3c-vc-jose-cose#R-0074"
        level: MUST
        locator: "§4.2, paragraph 6"
        text: "When the holder is identified as a [URL], and iss is absent, the kid MUST be an absolute [URL] to a verification method listed in a controlled identifier document."
    applies_to: "a secured presentation, decoded with its header"
    condition: "section 4.2 applies, iss is absent as in X-04, and the holder (or holder.id) is a URL"
    check: "kid is an absolute URL, as X-04"
    inferred: "as X-04"
    examples: "computed: 0 presentation objects have a holder property; not exercised"
  - id: X-06
    requirements:
      - id: "w3c-vc-jose-cose#R-0073"
        level: RECOMMENDED
        locator: "§4.2, paragraph 5"
        text: "When using [URL] identifiers, the kid is RECOMMENDED to be an absolute [URL] that includes a JWK Thumbprint URI as defined in [RFC7638]."
    applies_to: "a secured credential or presentation whose identifiers are URLs"
    condition: "section 4.2 applies (controlled identifier documents are used), and the issuer, or for a presentation the holder, is identified by a URL"
    check: "kid is an absolute URL that contains a JWK Thumbprint URI: jose-header.derived#kid-thumbprint-url (a warning)"
    inferred: "includes read as contains; the URI form is RFC 9278's, which the source attributes to RFC 7638 (README.md, Findings)"
    examples: "conditional on section 4.2, which no example asserts. Were it applied, every example with a URL issuer would deviate: 0 of 12 have an absolute-URL kid (the 10 of X-04, and Ex21 JSON and Ex22 JSON, which carry iss and the kid SI3RHNouh8o81NOONPQUAL7EgZ-kI6_xj9oREvX1xOw)"
  - id: X-07
    requirements:
      - id: "w3c-vc-jose-cose#R-0069"
        level: RECOMMENDED
        locator: "§4.1.3, paragraph 2"
        text: "Use of a proof-of-possession key provided by the Holder to the Issuer to establish a cryptographic binding to the Holder in the Verifiable Credential that is verifiable by the Verifier in the Verifiable Presentation is RECOMMENDED."
    applies_to: "a secured credential"
    condition: "always (RECOMMENDED)"
    check: "a proof-of-possession key is carried: cnf in the JOSE header or the JWT claims, or CWT Claims (15) key 8 in a COSE header (section 4.1.3 names these places)"
    inferred: "only the presence of a key is observable; that the holder provided it, and that a verifier checks it in a presentation, are not (R-0069's testable_reason)"
    examples: "computed over 12 credential objects: 2 carry cnf (Ex21 JSON, object in its data: URL sd-jwt; Ex22 JSON, object in its data: URL sd-jwt), in the claims; the rest deviate. Presentations carrying cnf, outside this rule: Ex6 [Presentation] JSON, object in the data: URL at $.id sd-jwt; Ex9 [Presentation] JSON, object in the data: URL at $.id sd-jwt; Ex9 [cose] application/vp, object in the data: URL at $.id sd-jwt; Ex9 [cose] application/vp+cose, object in the data: URL at $.id sd-jwt"
  - id: X-08
    requirements:
      - id: "w3c-vc-jose-cose#R-0031"
        level: SHOULD
        locator: "§3.2.1, paragraph 5"
        text: "When securing verifiable credentials with [SD-JWT], implementers SHOULD ensure that properties necessary for the validation and verification of a credential are NOT selectively disclosable (i.e., such properties SHOULD be disclosed). These properties can include but are not limited to @context, type, credentialStatus, credentialSchema, and relatedResource."
      - id: "w3c-vc-jose-cose#R-0040"
        level: SHOULD
        locator: "§3.2.2, paragraph 8"
        text: "When securing verifiable presentations with [SD-JWT] implementers SHOULD ensure that properties necessary for the validation and verification of a credential are NOT selectively disclosable (i.e., such properties SHOULD be disclosed). These properties can include but are not limited to @context, type, credentialStatus, credentialSchema, and relatedResource."
    applies_to: "a decoded SD-JWT (sd-jwt.derived.schema.json instance) with its disclosures"
    condition: "always (SHOULD)"
    check: "place each object-property disclosure by its digest (base64url of the hash _sd_alg names, sha-256 by default, over the disclosure string): it deviates if its digest sits in the top-level _sd and its name is @context, type, credentialStatus, credentialSchema or relatedResource, or if its digest sits anywhere inside credentialStatus, credentialSchema or relatedResource"
    inferred: "the five names come from an open list (can include but are not limited to); taking exactly these is this library's reading"
    examples: "computed over the 6 top-level SD-JWT examples: the top-level type is selectively disclosed in 6 (Ex4 sd-jwt; Ex5 sd-jwt; Ex6 sd-jwt; Ex18 sd-jwt; Ex19 sd-jwt; Ex20 sd-jwt); credentialSchema members in 2 (Ex4 sd-jwt; Ex19 sd-jwt); credentialStatus members in 1 (Ex18 sd-jwt); @context in 0; deviating: 6 of 6"
  - id: X-09
    requirements:
      - id: "w3c-vc-jose-cose#R-0006"
        level: MUST_NOT
        locator: "§1.1.2.1, paragraph 4"
        text: "The JWT Claim Names vc and vp MUST NOT be present in any JWT Claims Set that comprises a verifiable credential or a verifiable presentation."
    applies_to: "the JWT Claims Set an SD-JWT verifier rebuilds (section 5.2)"
    condition: "always"
    check: "apply payload.derived#jwt to the rebuilt claims set, so that a vc or vp claim revealed by a disclosure is caught"
    inferred: "none beyond payload.derived#jwt's top-level reading"
    examples: "computed over the rebuilt claims sets of 12 SD-JWT objects: 0 have a top-level vc or vp claim (none)"
  - id: X-10
    requirements:
      - id: "w3c-vc-jose-cose#R-0023"
        level: MUST
        locator: "§3.1.2, paragraph 7"
        text: "Credentials in verifiable presentations MUST be secured. In this case, these credentials are secured using JWS."
      - id: "w3c-vc-jose-cose#R-0039"
        level: MUST
        locator: "§3.2.2, paragraph 7"
        text: "Credentials in verifiable presentations MUST be secured. These credentials are secured using SD-JWT in this case."
      - id: "w3c-vc-jose-cose#R-0059"
        level: MUST
        locator: "§3.3.2, paragraph 7"
        text: "Credentials in verifiable presentations MUST be secured. These credentials are secured using COSE in this case."
    applies_to: "a secured presentation"
    condition: "for each EnvelopedVerifiableCredential in verifiableCredential"
    check: "decode its data: URL and apply, by media type: jose-header.derived (root) and payload.derived#jwt for vc+jwt; sd-jwt.derived for vc+sd-jwt; cose-sign1.derived.cddl vc-cose for vc+cose; an unknown media type is not checked here"
    inferred: "secured is read as: the enclosed object passes the MUST level of its own securing mechanism; the second sentence of each requirement (these credentials are secured using JWS, SD-JWT, COSE) is not enforced (README.md, Findings)"
    examples: "computed over 30 enclosed credential URLs in the presentation examples (every view but the Issuer Disclosures tab, every depth): 1 decodes to a secured object (Ex2 [Presentation] JSON(pre)$.verifiableCredential[0].id); the rest are doubled, elided, base64url-labelled or carry a space (README.md, Findings)"
  - id: X-11
    requirements:
      - id: "w3c-vc-jose-cose#R-0005"
        level: MUST
        locator: "§1.1.2.1, paragraph 3"
        text: "Issuers, Holders, and Verifiers MUST ignore all JWT Claims Sets that have no integrity protection."
    applies_to: "a verification result (verification-result.derived.schema.json instance) together with the input it was computed from"
    condition: "the input is a JWT whose JOSE header has alg none"
    check: "the result does not have status true"
    inferred: "ignore read as never returned as verified, R-0005's testable_reason; the section 5 outputs define no other observable"
    examples: "computed: 0 of 29 secured objects use alg none; not exercised"
