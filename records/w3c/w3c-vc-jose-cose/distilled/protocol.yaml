  - name: "validation"
    title: "Validation after a successful verification (§5.4)"
    locator: "§5.4, §5, §3.3.3"
    kind: "receive-processing"
    participants:
      - "verifier"
    run_by:
      - "holder"
      - "verifier"
    summary: >-
      Five paragraphs, no numbered steps, no inputs or outputs of its own: n here is this model's
      ordering by paragraph and sentence. Entered by a SHOULD (R-0076), it holds six MUSTs, two
      SHOULDs and a MAY. None states what follows a failed check, and the §5 outputs are already set
      when it runs, so a failed validation has no stated effect on status. The order of the checks is
      the paragraph order; the source does not prescribe one.
    steps:
      - n: "1"
        condition: "status is true"
        from: "verifier"
        to: "verifier"
        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        field: "document"
        action: "Enter validation once verification has succeeded (SHOULD)."
        locator: "§5, paragraph 3"
        kind: "stated"
        quotes:
          - at: "§5"
            text: |-
              After verification has succeeded, additional validation checks SHOULD be performed as described in Section 5.4 Validation
        normative:
          - "N-108"
        constrained_by:
          - "w3c-vc-jose-cose#R-0076"
        on_error: >-
          unspecified by source (§5, paragraph 3: skipping validation is permitted by the SHOULD and has
          no stated consequence)
        on_error_basis: "unspecified"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "Registered JWT claims in the claims set (JWS and SD-JWT)"
        message_id: "MSG-08"
        also_messages:
          - "MSG-20"
        action: "Check that all claims expected for the typ are present (MUST)."
        locator: "§5.4, paragraph 1, sentence 1"
        kind: "stated"
        quotes:
          - at: "§5.4"
            text: |-
              All claims expected for the typ MUST be present.
        normative:
          - "N-116"
        constrained_by:
          - "w3c-vc-jose-cose#R-0077"
        on_error: >-
          unspecified by source (§5.4: no outcome for a missing claim; which claims a typ expects is
          defined nowhere, and typ itself is only a SHOULD)
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "Registered JWT claims in the claims set (JWS and SD-JWT)"
        message_id: "MSG-08"
        also_messages:
          - "MSG-20"
        action: "Evaluate every understood claim under the verifier's validation policies (MUST)."
        locator: "§5.4, paragraph 1, sentence 2"
        kind: "stated"
        quotes:
          - at: "§5.4"
            text: |-
              All claims that are understood MUST be evaluated according the verifier's validation policies.
        normative:
          - "N-116"
        constrained_by:
          - "w3c-vc-jose-cose#R-0078"
        on_error: >-
          unspecified by source (§5.4: the policies, and therefore their failure, are the verifier's)
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "Registered JWT claims in the claims set (JWS and SD-JWT)"
        message_id: "MSG-08"
        field: "claims not understood"
        also_messages:
          - "MSG-19"
          - "MSG-20"
        action: >-
          Ignore every claim not understood (MUST); for COSE the same holds for header parameters
          (R-0064).
        locator: "§5.4, paragraph 1, sentence 3; §3.3.3"
        kind: "stated"
        quotes:
          - at: "§5.4"
            text: |-
              All claims that are not understood MUST be ignored.
          - at: "§3.3.3"
            text: |-
              Additional members may be present as header parameters and claims. If they are not understood, they MUST be ignored.
        normative:
          - "N-116"
          - "N-090"
        constrained_by:
          - "w3c-vc-jose-cose#R-0079"
          - "w3c-vc-jose-cose#R-0064"
        constrained_by_locators:
          - "§3.1.3, line 370 of the .txt (non-normative): the JOSE twin of R-0064"
        on_error: "Stated: ignore. No crit exception is made (tension ignore-versus-crit)."
        on_error_basis: "stated"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        field: "document"
        action: "Check that the verified document is a well-formed compact JSON-LD document (MUST)."
        locator: "§5.4, paragraph 2"
        kind: "stated"
        quotes:
          - at: "§5.4"
            text: |-
              The verified document returned from verification MUST be a well-formed compact JSON-LD document, as described in Verifiable Credentials Data Model v2.0.
        normative:
          - "N-117"
        constrained_by:
          - "w3c-vc-jose-cose#R-0080"
        on_error: >-
          unspecified by source (§5.4: no outcome for a document that is not well-formed compact JSON-LD;
          §7.2 (non-normative) adds care around remote context retrieval)
        on_error_basis: "unspecified"
      - n: "6"
        from: "verifier"
        to: "verifier"
        message: "Unsecured verifiable credential (application/vc)"
        message_id: "MSG-01"
        field: "credentialSchema"
        action: "Check schema extension mechanisms such as credentialSchema (SHOULD)."
        locator: "§5.4, paragraph 3, sentence 1"
        kind: "stated"
        quotes:
          - at: "§5.4"
            text: |-
              Schema extension mechanisms such as credentialSchema SHOULD be checked.
        normative:
          - "N-118"
        constrained_by:
          - "w3c-vc-jose-cose#R-0081"
        on_error: "unspecified by source (§5.4, paragraph 3: no outcome for a failed schema check)"
        on_error_basis: "unspecified"
      - n: "7"
        condition: "the credentialSchema type is not understood"
        from: "verifier"
        to: "verifier"
        message: "Unsecured verifiable credential (application/vc)"
        message_id: "MSG-01"
        field: "credentialSchema"
        action: "Ignore a schema extension whose type is not understood (MUST)."
        locator: "§5.4, paragraph 3, sentence 2"
        kind: "stated"
        quotes:
          - at: "§5.4"
            text: |-
              If the extension mechanism type is not understood, this property MUST be ignored.
        normative:
          - "N-118"
        constrained_by:
          - "w3c-vc-jose-cose#R-0082"
        on_error: "Stated: ignore the property."
        on_error_basis: "stated"
      - n: "8"
        from: "verifier"
        to: "verifier"
        message: "Unsecured verifiable credential (application/vc)"
        message_id: "MSG-01"
        field: "credentialStatus"
        action: "Check status extension mechanisms such as credentialStatus (SHOULD)."
        locator: "§5.4, paragraph 4, sentence 1"
        kind: "stated"
        quotes:
          - at: "§5.4"
            text: |-
              Status extension mechanisms such as credentialStatus SHOULD be checked.
        normative:
          - "N-119"
        constrained_by:
          - "w3c-vc-jose-cose#R-0083"
        on_error: >-
          unspecified by source (§5.4, paragraph 4: no outcome for a revoked or suspended status; the
          status mechanism is not this document's)
        on_error_basis: "unspecified"
      - n: "9"
        condition: "the credentialStatus type is not understood"
        from: "verifier"
        to: "verifier"
        message: "Unsecured verifiable credential (application/vc)"
        message_id: "MSG-01"
        field: "credentialStatus"
        action: "Ignore a status extension whose type is not understood (MUST)."
        locator: "§5.4, paragraph 4, sentence 2"
        kind: "stated"
        quotes:
          - at: "§5.4"
            text: |-
              If the extension mechanism type is not understood, this property MUST be ignored.
        normative:
          - "N-119"
        constrained_by:
          - "w3c-vc-jose-cose#R-0084"
        on_error: "Stated: ignore the property."
        on_error_basis: "stated"
      - n: "10"
        from: "verifier"
        to: "verifier"
        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        field: "document"
        action: >-
          Apply further checks by policy, credential type and securing mechanism (MAY); they could make an
          otherwise valid credential or presentation invalid.
        locator: "§5.4, paragraph 5"
        kind: "stated"
        quotes:
          - at: "§5.4"
            text: |-
              Based on the validation policy of the verifier, the type of credentials, and the type of securing mechanism, additional validation checks MAY be applied.
          - at: "§5.4"
            text: |-
              For example, dependencies between multiple credentials, ordering or timing information associated with multiple credentials, and/or multiple presentations could cause an otherwise valid credential or presentation to be considered invalid.
        normative:
          - "N-120"
        constrained_by:
          - "w3c-vc-jose-cose#R-0085"
        on_error: >-
          Stated as a possibility: the credential or presentation could be considered invalid. How that is
          signalled is not stated.
        on_error_basis: "stated"
error_paths:
  - id: "jwt-processing-fails"
    trigger: "Validating a JWT aborts for any reason, or the JWT is rejected."
    detected_by: "verifier"
    in:
      - "jose-verification 1"
      - "jose-verification 3"
    outcome: "status false, document null, mediaType null, return (§5.1 step 3)."
    basis: "stated"
    locator: "§5.1, step 3; §3.1.1, §3.1.2"
    constrained_by:
      - "w3c-vc-jose-cose#R-0015"
      - "w3c-vc-jose-cose#R-0020"
    quotes:
      - at: "§5.1"
        text: |-
          If processing aborts for any reason or the JWT is rejected:
  - id: "sd-jwt-processing-fails"
    trigger: "SD-JWT verification aborts for any reason, or the SD-JWT is rejected."
    detected_by: "verifier"
    in:
      - "sd-jwt-verification 1"
      - "sd-jwt-verification 3"
    outcome: "status false, document null, mediaType null, return (§5.2 step 3)."
    basis: "stated"
    locator: "§5.2, step 3; §3.2.1, §3.2.2"
    constrained_by:
      - "w3c-vc-jose-cose#R-0030"
      - "w3c-vc-jose-cose#R-0036"
    quotes:
      - at: "§5.2"
        text: |-
          If processing aborts for any reason or the SD-JWT is rejected:
  - id: "cose-processing-fails"
    trigger: "COSE_Sign1 verification aborts for any reason (no rejection clause)."
    detected_by: "verifier"
    in:
      - "cose-verification 1"
      - "cose-verification 3"
    outcome: "status false, document null, mediaType null, return (§5.3 step 3)."
    basis: "stated"
    locator: "§5.3, step 3; §3.3.1, §3.3.2"
    constrained_by:
      - "w3c-vc-jose-cose#R-0050"
      - "w3c-vc-jose-cose#R-0056"
    quotes:
      - at: "§5.3"
        text: |-
          If processing aborts for any reason:
  - id: "unsecured-jwt"
    trigger: 'A JWT Claims Set with no integrity protection ("alg": "none").'
    detected_by: "issuer, holder, verifier"
    in:
      - "jose-verification 1"
      - "sd-jwt-verification 1"
    outcome: >-
      MUST be ignored. Whether ignoring is §5.1 step 3 (status false) or happens before §5.1 is not
      said.
    basis: "stated"
    locator: "§1.1.2.1"
    constrained_by:
      - "w3c-vc-jose-cose#R-0004"
      - "w3c-vc-jose-cose#R-0005"
    quotes:
      - at: "§1.1.2.1"
        text: |-
          Issuers, Holders, and Verifiers MUST ignore all JWT Claims Sets that have no integrity protection.
  - id: "no-algorithm-for-media-type"
    trigger: "A secured object whose media type no §5 algorithm takes: vp+sd-jwt, or any other."
    detected_by: "verifier"
    in:
      - "verification-dispatch 3"
      - "sd-jwt-presentation-securing 7"
      - "sd-jwt-selective-disclosure 3"
    outcome: "Unspecified."
    basis: "unspecified"
    locator: "§5.1, §5.2, §5.3"
    quotes:
      - at: "§5.2"
        text: |-
          inputMediaType: vc+sd-jwt
  - id: "key-not-found"
    trigger: "No key is found from kid, iss, cnf or a controlled identifier document."
    detected_by: "verifier"
    in:
      - "key-discovery-header-hints 1"
      - "key-discovery-header-hints 6"
      - "key-discovery-controlled-identifier-document 2"
    outcome: "Unspecified; §5 assumes key discovery succeeded."
    basis: "unspecified"
    locator: "§4, §5"
    quotes:
      - at: "§5"
        text: |-
          This specification might be used with many different key discovery protocols. Therefore, discovery of verification keys is described in 4. Key Discovery, and is assumed to have succeeded prior to beginning the verification process.
  - id: "iss-does-not-match-issuer"
    trigger: "A present iss differs from issuer (or issuer.id)."
    detected_by: "verifier"
    in:
      - "key-discovery-header-hints 3"
      - "jose-credential-securing 1"
    outcome: "Unspecified: the MUST binds the value; no check and no outcome are stated."
    basis: "unspecified"
    locator: "§4.1.2"
    constrained_by:
      - "w3c-vc-jose-cose#R-0066"
      - "w3c-vc-jose-cose#R-0067"
  - id: "kid-absent-or-not-url"
    trigger: >-
      kid absent although the key is a DID URL, or not an absolute URL where §4.2 requires one.
    detected_by: "verifier"
    in:
      - "key-discovery-header-hints 2"
      - "key-discovery-controlled-identifier-document 1"
    outcome: "Unspecified."
    basis: "unspecified"
    locator: "§4.1.1, §4.2"
    constrained_by:
      - "w3c-vc-jose-cose#R-0065"
      - "w3c-vc-jose-cose#R-0072"
      - "w3c-vc-jose-cose#R-0074"
  - id: "controlled-identifier-document-unretrievable"
    trigger: "The controlled identifier document or DID document cannot be retrieved."
    detected_by: "verifier"
    in:
      - "key-discovery-controlled-identifier-document 2"
    outcome: "Unspecified; the source says there is no standard way to retrieve the key."
    basis: "unspecified"
    locator: "§4.2"
    quotes:
      - at: "§4.2"
        text: |-
          At the time of writing, there is no standard way to retrieve a public key in JWK format from a DID URL or controlled identifier documents.
  - id: "verification-method-nonconforming"
    trigger: "The verification method is not a JsonWebKey, or has no publicKeyJwk."
    detected_by: "verifier"
    in:
      - "key-discovery-controlled-identifier-document 3"
      - "key-discovery-controlled-identifier-document 4"
    outcome: "Unspecified: the MUSTs bind the document, not the verifier."
    basis: "unspecified"
    locator: "§4.2"
    constrained_by:
      - "w3c-vc-jose-cose#R-0070"
      - "w3c-vc-jose-cose#R-0071"
  - id: "decryption-fails"
    trigger: "A nested JWE or encrypted COSE object cannot be decrypted."
    detected_by: "verifier"
    in:
      - "verification-dispatch 2"
    outcome: "Unspecified."
    basis: "unspecified"
    locator: "§3.1.1, §3.2.1, §3.3.1"
  - id: "payload-does-not-decode"
    trigger: >-
      The JWS or COSE_Sign1 payload does not decode, or the SD-JWT payload cannot be converted back.
    detected_by: "verifier"
    in:
      - "jose-verification 2.3"
      - "sd-jwt-verification 2.3"
      - "cose-verification 2.3"
    outcome: >-
      Unspecified: these steps sit in the success branch, after status is set to true; §7.2
      (non-normative) says malformed JSON is to be rejected in its entirety.
    basis: "unspecified"
    locator: "§5.1, §5.2, §5.3, §7.2"
    quotes:
      - at: "§7.2"
        text: |-
          It is essential that any JSON inputs that do not conform to the JSON-text syntax defined in [RFC7159] be rejected in their entirety by JSON parsers.
  - id: "expected-claims-missing"
    trigger: "A claim expected for the typ is absent."
    detected_by: "verifier"
    in:
      - "validation 2"
    outcome: "Unspecified; the expected claims are defined nowhere."
    basis: "unspecified"
    locator: "§5.4, paragraph 1"
    constrained_by:
      - "w3c-vc-jose-cose#R-0077"
  - id: "document-not-compact-json-ld"
    trigger: "The verified document is not well-formed compact JSON-LD."
    detected_by: "verifier"
    in:
      - "validation 5"
    outcome: "Unspecified."
    basis: "unspecified"
    locator: "§5.4, paragraph 2"
    constrained_by:
      - "w3c-vc-jose-cose#R-0080"
  - id: "member-not-understood"
    trigger: >-
      A claim, a COSE header parameter or claim, or an extension type (credentialSchema,
      credentialStatus) is not understood.
    detected_by: "verifier"
    in:
      - "validation 4"
      - "validation 7"
      - "validation 9"
    outcome: "Ignored (MUST). No crit exception is stated."
    basis: "stated"
    locator: "§5.4, §3.3.3"
    constrained_by:
      - "w3c-vc-jose-cose#R-0079"
      - "w3c-vc-jose-cose#R-0064"
      - "w3c-vc-jose-cose#R-0082"
      - "w3c-vc-jose-cose#R-0084"
  - id: "schema-or-status-check-fails"
    trigger: "A credentialSchema or credentialStatus check fails."
    detected_by: "verifier"
    in:
      - "validation 6"
      - "validation 8"
    outcome: "Unspecified."
    basis: "unspecified"
    locator: "§5.4, paragraphs 3 and 4"
    constrained_by:
      - "w3c-vc-jose-cose#R-0081"
      - "w3c-vc-jose-cose#R-0083"
  - id: "policy-check-fails"
    trigger: "An understood claim fails the verifier's policies, or an additional check fails."
    detected_by: "verifier"
    in:
      - "validation 3"
      - "validation 10"
    outcome: >-
      The credential or presentation could be considered invalid; no signal or output is defined.
      Stated for the additional checks of paragraph 5 only; for an understood claim that fails the
      verifier's policies (paragraph 1, validation 3) the source states no outcome.
    basis: "stated"
    locator: "§5.4, paragraphs 1 and 5"
    constrained_by:
      - "w3c-vc-jose-cose#R-0078"
      - "w3c-vc-jose-cose#R-0085"
    quotes:
      - at: "§5.4"
        text: |-
          For example, dependencies between multiple credentials, ordering or timing information associated with multiple credentials, and/or multiple presentations could cause an otherwise valid credential or presentation to be considered invalid.
  - id: "enveloped-credential-fails"
    trigger: >-
      A credential enveloped in a verified presentation is unsecured, undecodable or fails its own
      verification.
    detected_by: "verifier"
    in:
      - "verification-dispatch 5"
      - "credential-enveloping 1"
    outcome: "Unspecified; no algorithm verifies enveloped credentials."
    basis: "unspecified"
    locator: "§3.1.2, §3.2.2, §3.3.2, §5"
    constrained_by:
      - "w3c-vc-jose-cose#R-0023"
      - "w3c-vc-jose-cose#R-0039"
      - "w3c-vc-jose-cose#R-0059"
  - id: "vc-or-vp-claim-present"
    trigger: "The claims set carries a vc or vp claim."
    detected_by: "verifier"
    in:
      - "jose-credential-securing 1"
      - "jose-presentation-securing 1"
    outcome: "Unspecified for the receiver; the MUST NOT binds the producer."
    basis: "unspecified"
    locator: "§1.1.2.1"
    constrained_by:
      - "w3c-vc-jose-cose#R-0006"
  - id: "possession-not-proven"
    trigger: "A bound key is present (cnf) and the presentation does not prove possession of it."
    detected_by: "verifier"
    in:
      - "key-binding 3"
      - "key-binding 4"
    outcome: "Unspecified; no §5 step uses the proof-of-possession key."
    basis: "unspecified"
    locator: "§4.1.3"
    constrained_by:
      - "w3c-vc-jose-cose#R-0068"
      - "w3c-vc-jose-cose#R-0069"
  - id: "validation-skipped"
    trigger: "Verification succeeded and the verifier does not perform §5.4 (the SHOULD permits it)."
    detected_by: "verifier"
    in:
      - "verification-dispatch 4"
      - "validation 1"
    outcome: "The §5.4 MUSTs are never evaluated and status stays true (this model's reading)."
    basis: "inferred"
    locator: "§5, paragraph 3"
    constrained_by:
      - "w3c-vc-jose-cose#R-0076"
source_defects_and_tensions:
  - id: "sd-jwt-presentation-no-algorithm"
    kind: "defect"
    locator: "§5.2, §3.2.2, §6.1.4"
    text: >-
      The heading and the receipt sentence of §5.2 cover a presentation, but its only input media type
      is vc+sd-jwt, its input document is a credential, and step 2.2 sets mediaType to vc. §3.2.2
      recommends vp+sd-jwt as the typ of an SD-JWT presentation and §6.1.4 registers
      application/vp+sd-jwt. No algorithm verifies one.
    quotes:
      - at: "§5.2"
        text: |-
          inputMediaType: vc+sd-jwt
      - at: "§5.2"
        text: |-
          Set mediaType to vc
      - at: "§5.2"
        text: |-
          Upon receipt of the verifiable credential or presentation secured with [SD-JWT], the holder or verifier follows this algorithm:
      - at: "§3.2.2"
        text: |-
          The typ header parameter SHOULD be vp+sd-jwt.
    affects:
      - "sd-jwt-presentation-securing 7"
      - "verification-dispatch 3"
      - "sd-jwt-verification"
    see_also:
      - "normative.md SD-17"
      - "messages.yaml TEN-10"
  - id: "credential-only-input-document"
    kind: "defect"
    locator: "§5.1, §5.2"
    text: >-
      §5.1 admits vp+jwt as inputMediaType but names only a credential as inputDocument; §5.2 names
      only a credential. §5.3 names both.
    quotes:
      - at: "§5.1"
        text: |-
          inputDocument: the verifiable credential secured as a JWT [RFC7519]
      - at: "§5.3"
        text: |-
          inputDocument: the verifiable credential or verifiable presentation secured with CBOR Object Signing and Encryption (COSE): Structures and Process
    affects:
      - "jose-verification"
      - "sd-jwt-verification"
    see_also:
      - "normative.md SD-18"
      - "messages.yaml TEN-11"
  - id: "vc-or-vp-unchosen"
    kind: "gap"
    locator: "§5.1 step 2.2, §5.3 step 2.2"
    text: >-
      Step 2.2 sets mediaType to vc or vp with no rule: not from inputMediaType, not from typ, cty or
      the document's type.
    quotes:
      - at: "§5.1"
        text: |-
          Set mediaType to vc or vp
      - at: "§5.3"
        text: |-
          Set mediaType to vc or vp
    affects:
      - "jose-verification 2.2"
      - "cose-verification 2.2"
    see_also:
      - "normative.md SD-19"
      - "messages.yaml TEN-11"
  - id: "output-domains-exclude-null"
    kind: "defect"
    locator: "§5, §5.1 to §5.3 step 3"
    text: >-
      The outputs are declared as a document conforming to the data model and vc or vp; every failure
      branch sets both to null.
    quotes:
      - at: "§5"
        text: |-
          document: a document conforming to the [VC-DATA-MODEL-2.0]
      - at: "§5"
        text: |-
          mediaType: vc or vp
      - at: "§5.1"
        text: |-
          Set document to null
    affects:
      - "jose-verification 3.2"
      - "sd-jwt-verification 3.2"
      - "cose-verification 3.2"
    see_also:
      - "normative.md SD-20"
  - id: "cose-failure-branch-asymmetric"
    kind: "defect"
    locator: "§5.3 step 3"
    text: >-
      The COSE failure branch is taken when processing aborts; §5.1 and §5.2 add an explicit
      rejection. Whether a COSE_Sign1 that RFC 9052 processing rejects without aborting reaches step 3
      is not said.
    quotes:
      - at: "§5.3"
        text: |-
          If processing aborts for any reason:
      - at: "§5.1"
        text: |-
          If processing aborts for any reason or the JWT is rejected:
    affects:
      - "cose-verification 3"
    see_also:
      - "normative.md SD-21"
  - id: "sd-jwt-status-before-conversion"
    kind: "gap"
    locator: "§5.2 steps 2.1 to 2.3"
    text: >-
      Step 2.1 sets status to true before step 2.3 converts the payload back into the JWT Claims Set.
      A conversion that fails has no branch: the algorithm is already in the success branch.
    quotes:
      - at: "§5.2"
        text: |-
          Set status to true
      - at: "§5.2"
        text: |-
          Convert the SD-JWT payload back into the JWT Claims Set by reversing the process in [SD-JWT]. Set document to the JWT Claims Set. (For examples of the transition from JWT Claims Set to SD-JWT payload, please see SD-JWT examples).
    affects:
      - "sd-jwt-verification 2.3"
  - id: "key-not-an-input"
    kind: "gap"
    locator: "§5, §5.1 to §5.3"
    text: >-
      Key discovery is assumed to have succeeded, but the algorithms' inputs are inputMediaType and
      inputDocument only: the key reaches step 1 by no stated input, and no algorithm has a branch for
      a missing key.
    quotes:
      - at: "§5"
        text: |-
          This specification might be used with many different key discovery protocols. Therefore, discovery of verification keys is described in 4. Key Discovery, and is assumed to have succeeded prior to beginning the verification process.
      - at: "§5.3"
        text: |-
          The inputs for this algorithm are:
    affects:
      - "key-discovery-header-hints 6"
  - id: "key-discovery-reads-untrusted-data"
    kind: "tension"
    locator: "§5, §4.1.2, §4.1.3"
    text: >-
      Verifiers SHOULD minimize processing of the protected header, the unprotected header and the
      payload during key discovery, yet every hint §4.1 offers lives there: kid in a header, iss and
      cnf in a header or in the JWT claims, which are the payload.
    quotes:
      - at: "§5"
        text: |-
          As a general rule, verifiers SHOULD strive to minimize the processing of untrusted data. This includes minimizing any processing of the protected header, unprotected header, or payload as part of the key discovery procedures.
      - at: "§4.1.2"
        text: |-
          If iss is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier can use this parameter to obtain a JSON Web Key to use in the verification process.
    affects:
