      Delegates to the SD-JWT draft, then converts the payload back into the JWT Claims Set. Admits
      vc+sd-jwt only and sets mediaType to vc only, so a vp+sd-jwt has no algorithm. Unlike §5.1 and
      §5.3, step 2.3 is a transformation that can itself fail, after status is already true.
