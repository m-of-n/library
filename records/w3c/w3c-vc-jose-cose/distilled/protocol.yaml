      - "key-discovery-header-hints 3"
  - id: "validation-entered-by-should"
    kind: "tension"
    locator: "§5, §5.4"
    text: >-
      Validation is a SHOULD, yet it holds six MUSTs that bind the receiver (claims expected for the
      typ, evaluation of understood claims, ignoring claims and extension types not understood,
      compact JSON-LD). A verifier that skips it, as the SHOULD permits, never meets them.
    quotes:
      - at: "§5"
        text: |-
          After verification has succeeded, additional validation checks SHOULD be performed as described in Section 5.4 Validation
      - at: "§5.4"
        text: |-
          The verified document returned from verification MUST be a well-formed compact JSON-LD document, as described in Verifiable Credentials Data Model v2.0.
    affects:
