applicability: >-
  This document secures documents of another specification (the VC Data Model v2.0) with envelopes
  of other specifications (JWS, SD-JWT, COSE_Sign1). It defines no exchange: no request, response,
  session, transport binding, acknowledgement or error message between issuer, holder and
  verifier. What it does define is (a) how an issuer implementation turns an unsecured credential
  or presentation into a secured one (§3.1 to §3.3), (b) how a holder carries secured credentials
  inside a presentation (the Enveloped types of §3.1.2, §3.2.2 and §3.3.2 and the base64 data URL
  of §3.3.1), (c) which header parameters and claims a verifier can use to find a key, and the
  shape a controlled identifier document must give that key (§4), and (d) three verification
  algorithms and a validation section that the holder or verifier runs on receipt (§5). Every flow
  below is therefore one party building an object, an unspecified delivery, and the receiving
  party processing it alone. Every on_error is local to the role that meets the failure; nothing
  travels back. The only cross-party dependency the source states is the proof-of-possession key
  of §4.1.3, provided by the holder to the issuer and verifiable by the verifier, and even there
  it defines no message. Delivery steps, the choice among the three algorithms, decryption of a
  nested JWE or COSE encryption object, and the verification of credentials enveloped in a
  presentation are not in the source; where this file supplies them they are marked inferred, with
  the reason.
conventions:
  quoting: >-
    Every quotes item is {at, text}. text is one contiguous run of a single line of
    .cache/w3c-vc-jose-cose.txt (each HTML block element is one line there, whitespace collapsed),
    copied without any change, the source's typos and missing full stops included; it was checked by
    script to lie inside the section named by at and to occur in the tag-stripped HTML, so no quote
    carries a rendering artefact of the .txt. No quote joins two runs and nothing is elided. A
    sentence that occurs more than once in one section (the Set and Return steps of §5.1 to §5.3,
    the two extension-mechanism sentences of §5.4) was pinned to the .txt line of the step it is
    quoted for.
  step_numbers: >-
    In the flows of §5.1, §5.2 and §5.3, n is the source's own step position: the HTML writes each
    algorithm as an ordered list of three items whose second and third items each hold an ordered
    list of four, and n gives the position in that nesting (2.3 is the third item of the list inside
    item 2). The HTML carries no printed numbers, the .txt drops the nesting, and how a browser
    labels nested items depends on the W3C stylesheet, so a locator such as §5.1, step 2.3 names a
    list position, the same one normative.md uses. In every other flow, n is this file's own
    ordering; the source numbers nothing outside §5.
  basis: >-
    kind is stated or inferred for every step. inferred: true appears only on inferred steps, with
    inferred_reason saying what the source does and does not say. on_error_basis is stated (the
    source says what follows), unspecified (the source names the operation and says nothing about
    its failure; on_error then reads `unspecified by source` with the step or section), or inferred
    (this file's reading, said so inside on_error). condition, action and note are this file's
    wording throughout; where one repeats source words, the step's quotes carry the verbatim text.
  constrained_by: >-
    w3c-vc-jose-cose#R-NNNN ids of distilled/requirements.yaml whose text the step obeys or that
    bind the structure it emits, each selected by script from the requirement's locator and a
    fragment of its text, refusing zero or several matches. constrained_by_locators names keyword
    sentences that have no requirement id: those of §3.1.3, which the source marks non-normative.
    normative lists the normative.md entries (N-NNN) that hold the step's quotes, found by .txt
    line.
  messages: >-
    message is the exact name of a distilled/messages.yaml entry and message_id its id; field, where
    given, is a field of that entry. also_messages lists further entries the step applies to (the
    same act on the other envelope). Where the source names no structure for a step, the step names
    the nearest entry: for a decision, the object decided about (media-type-labelling); for the
    proof-of-possession key in transit, the cnf field it ends up in, said in that step's
    inferred_reason (key-binding).
  roles: >-
    from and to name roles of the roles list. In the §5 flows the source says "the holder or
    verifier follows this algorithm"; those flows write verifier for that party and list both under
    run_by. The signing step of each securing flow names, in conformance_class, the class the source
    binds; the three verification flows name theirs at flow level.
  locators: >-
    A locator is a section sign with the .txt heading number, then a position: a step (step_numbers
    above), or paragraph n, which counts blocks as normative.md's ¶n does (every paragraph, list,
    table and example one; an empty paragraph not counted). Every paragraph locator here falls in §3,
    §5 or §5.4, whose blocks before the last cited one are all paragraphs, so requirements.yaml's
    count of paragraphs alone gives the same numbers; normative names the N entries alongside.
  kind_of_flow: >-
    creation-and-delivery: a party builds a secured object and an unspecified delivery carries it.
    receive-processing: the receiving party's local processing. local-decision: a choice one party
    makes on its own. exchange: the nearest the source comes to two parties depending on each other.
    out-of-scope: behaviour the source assigns to a referenced specification.
framing:
  - id: "enveloping-proof"
    text: "The document secures the VC data model by enveloping it, once per securing mechanism."
    locator: "§1.1.2"
    basis: "stated"
    quotes:
      - at: "§1.1.2"
        text: |-
          The Verifiable Credentials Data Model v2.0 describes the approach taken by this specification to secure JSON and CBOR claims by applying an enveloping proof.
      - at: "§1.1.2"
        text: |-
          This specification defines how to secure different data structures using various enveloping proof mechanisms:
  - id: "payload-is-the-document"
    text: >-
      The unsecured credential or presentation is the payload, with no mapping; the SD-JWT credential
      route is the exception (§3.2.1 converts, §5.2 converts back).
    locator: "§3, §3.1.1, §3.2.1"
    basis: "stated"
    quotes:
      - at: "§3"
        text: |-
          A benefit to this approach is that payloads can be made to conform directly to [VC-DATA-MODEL-2.0] without any mappings or transformation, while at the same time supporting registered header parameters and claims that are understood in the context of JOSE, SD-JWT, and COSE.
      - at: "§3.1.1"
        text: |-
          The unsecured verifiable credential is the unencoded JWS payload.
      - at: "§3.2.1"
        text: |-
          The Issuer then converts the input JWT Claims Set (i.e., the unsecured verifiable credential) into an [SD-JWT] payload according to SD-JWT issuance instructions.
  - id: "media-types-not-transport"
    text: >-
      Media types label secured objects; no transport or delivery is defined. The only mention of
      transmission is the condition on the optional encryption.
    locator: "§1, §3.1.1"
    basis: "stated"
    quotes:
      - at: "§1"
        text: |-
          It uses content types [RFC6838] to distinguish between the data types of unsecured documents conforming to [VC-DATA-MODEL-2.0] and the data types of secured documents conforming to [VC-DATA-MODEL-2.0].
      - at: "§3.1.1"
        text: |-
          To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use JSON Web Encryption (JWE) [RFC7516] by nesting the secured verifiable credential as the plaintext payload of a JWE, per the description of Nested JWTs in [RFC7519].
  - id: "key-discovery-precedes-verification"
    text: "Key discovery is outside the algorithms and assumed to have succeeded before they start."
    locator: "§5"
    basis: "stated"
    quotes:
      - at: "§5"
        text: |-
          This specification might be used with many different key discovery protocols. Therefore, discovery of verification keys is described in 4. Key Discovery, and is assumed to have succeeded prior to beginning the verification process.
  - id: "verification-delegated"
    text: >-
      Each algorithm delegates the cryptographic work to the specification of its envelope and only
      maps the outcome to three outputs.
    locator: "§5.1, §5.2, §5.3"
    basis: "stated"
    quotes:
      - at: "§5.1"
        text: |-
          Follow the algorithm defined in Validating a JWT [RFC7519].
      - at: "§5.2"
        text: |-
          Follow the algorithms defined in SD-JWT for verification of the SD-JWT.
      - at: "§5.3"
        text: |-
          Follow the algorithm defined in CBOR Object Signing and Encryption (COSE): Structures and Process [RFC9052] under the Signing and Verification Process for COSE_Sign1.
  - id: "verification-then-validation"
    text: >-
      Validation is a separate, recommended stage after a successful verification; it has no output of
      its own.
    locator: "§5, §5.4"
    basis: "stated"
    quotes:
      - at: "§5"
        text: |-
          After verification has succeeded, additional validation checks SHOULD be performed as described in Section 5.4 Validation
roles:
  - name: "issuer"
    kind: "party"
    also_called:
      - "Issuers"
      - "Issuer"
      - "issuer"
      - "issuers"
    defined_by: >-
      VC Data Model v2.0; the HTML links the word to vc-data-model-2.0#dfn-issuers. §2 of this
      document defines no role.
    description: >-
      Secures a credential: builds the JWS, SD-JWT or COSE_Sign1 around it (§3.1.1, §3.2.1, §3.3.1)
      and sets the header values and claims §3 and §4 constrain. Receives the holder's
      proof-of-possession key where key binding is used (§4.1.3).
    locators:
      - "§1.1.2.1"
      - "§3.2.1"
      - "§4"
      - "§4.1.1"
      - "§4.1.3"
    quotes:
      - at: "§1.1.2.1"
        text: |-
          Issuers, Holders, and Verifiers MUST ignore all JWT Claims Sets that have no integrity protection.
      - at: "§3.2.1"
        text: |-
          The Issuer then converts the input JWT Claims Set (i.e., the unsecured verifiable credential) into an [SD-JWT] payload according to SD-JWT issuance instructions.
  - name: "holder"
    kind: "party"
    also_called:
      - "Holders"
      - "Holder"
      - "holder"
      - "holders"
    defined_by: "VC Data Model v2.0 (vc-data-model-2.0#dfn-holders)."
    description: >-
      Receives secured credentials and may verify them with the §5 algorithms; provides a
      proof-of-possession key to the issuer (§4.1.3); has verification keys of its own (§4), and its
      kid is constrained when it is identified by a URL (§4.2). That the holder is the party that
      secures a presentation is this file's reading: the source assigns presentation securing to the
      issuer implementation conformance classes (§3.1.2, §3.2.2, §3.3.2) and never names the party
      (tension issuer-class-secures-presentations).
    locators:
      - "§1.1.2.1"
      - "§4"
      - "§4.1.3"
      - "§4.2"
      - "§5.1"
      - "§5.2"
      - "§5.3"
    quotes:
      - at: "§4"
        text: |-
          There are several different ways to discover the verification keys of the issuers and holders.
      - at: "§4.2"
        text: |-
          When the holder is identified as a [URL], and iss is absent, the kid MUST be an absolute [URL] to a verification method listed in a controlled identifier document.
      - at: "§5.1"
        text: |-
          Upon receipt of the verifiable credential or presentation secured as a JWT [RFC7519], the holder or verifier follows this algorithm:
  - name: "verifier"
    kind: "party"
    also_called:
      - "Verifiers"
      - "Verifier"
      - "verifier"
      - "verifiers"
    defined_by: "VC Data Model v2.0 (vc-data-model-2.0#dfn-verifier)."
    description: >-
      Discovers the key (§4), runs the §5.1, §5.2 or §5.3 algorithm, and then the §5.4 validation
      under its own validation policies.
    locators:
      - "§1.1.2.1"
      - "§4"
      - "§4.1"
      - "§4.1.3"
      - "§5"
      - "§5.4"
    quotes:
      - at: "§4"
        text: |-
          To complete the verification process, a verifier needs to obtain the cryptographic keys used to secure the credential.
      - at: "§5"
        text: |-
          As a general rule, verifiers SHOULD strive to minimize the processing of untrusted data.
      - at: "§5.4"
        text: |-
          All claims that are understood MUST be evaluated according the verifier's validation policies.
  - name: "subject"
    kind: "mentioned"
    also_called:
      - "subject"
    defined_by: "VC Data Model v2.0 (vc-data-model-2.0#dfn-subjects)."
    description: >-
      Named only as an owner of a key that may be expressed as a DID URL, and as what a JWT Claims Set
      is typically about. Takes part in no flow.
    locators:
      - "§1.1.2"
      - "§4.1.1"
    quotes:
      - at: "§4.1.1"
        text: |-
          kid MUST be present when the key of the issuer or subject is expressed as a DID URL.
      - at: "§1.1.2"
        text: |-
          A JWT Claims Set is a JSON object containing one or more claims about an entity (typically the subject of the JWT).
  - name: "jws-issuer-implementation"
    kind: "conformance-class"
    played_by: "issuer for a credential (§3.1.1); for a presentation (§3.1.2) the source names no party"
    locators:
      - "§1.1.1"
    quotes:
      - at: "§1.1.1"
        text: |-
          A conforming JWS issuer implementation produces conforming JWS documents and MUST secure them as described in Section 3.1 With JOSE.
  - name: "jws-verifier-implementation"
    kind: "conformance-class"
    played_by: "holder or verifier (§5.1)"
    locators:
      - "§1.1.1"
    quotes:
      - at: "§1.1.1"
        text: |-
          A conforming JWS verifier implementation verifies conforming JWS documents as described in Section 3.1 With JOSE.
  - name: "sd-jwt-issuer-implementation"
    kind: "conformance-class"
    played_by: "issuer for a credential (§3.2.1); for a presentation (§3.2.2) the source names no party"
