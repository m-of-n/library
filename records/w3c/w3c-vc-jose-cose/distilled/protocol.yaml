        action: "Optionally append a KB-JWT; without one the string ends with a tilde (lowercase must)."
        locator: "§1.1.2.2"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The parts are stated; that the holder adds the KB-JWT at presentation time is SD-JWT's, not this
          document's.
        quotes:
          - at: "§1.1.2.2"
            text: |-
              An SD-JWT consists of three main parts: the SD-JWT itself, optional disclosures, and an optional KB-JWT (Key Binding JWT). These parts are separated by tilde (~) characters.
          - at: "§1.1.2.2"
            text: |-
              If the KB-JWT is not present, the SD-JWT must end with a tilde (~) character. This is crucial for correct parsing and processing of the SD-JWT.
        normative:
          - "N-023"
        on_error: >-
          unspecified by source (§1.1.2.2: the lowercase must is not BCP 14 (§1.1), and Example 22 ends
          with a tilde after its KB-JWT)
        on_error_basis: "unspecified"
      - n: "3"
        from: "holder"
        to: "verifier"
        message: "SD-JWT compact (application/vc+sd-jwt, application/vp+sd-jwt)"
        message_id: "MSG-11"
        action: >-
          Deliver the SD-JWT with the chosen disclosures; the media type it carries is not stated (Example
          22 uses application/vp+sd-jwt).
        locator: "§8.4"
        kind: "inferred"
        inferred: true
        inferred_reason: "No sentence of the source; the label comes from Example 22, which is non-normative."
        quotes:
          - at: "§8.4"
            text: |-
              Example 22: A simple URI-encoded SD-JWT Verifiable Presentation
        on_error: >-
          unspecified by source (§8.4; labelled vp+sd-jwt it has no algorithm
          (sd-jwt-presentation-no-algorithm), labelled vc+sd-jwt it goes to §5.2)
        on_error_basis: "unspecified"
  - name: "key-discovery-header-hints"
    title: "Finding the verification key from kid, iss and cnf"
    locator: "§4, §4.1, §4.1.1, §4.1.2, §4.1.3, §5"
    kind: "receive-processing"
    participants:
      - "verifier"
    run_by:
      - "holder"
      - "verifier"
    summary: >-
      Runs before any §5 algorithm, which assumes it succeeded. kid is a hint, iss obtains a JSON Web
      Key, cnf MAY identify a proof-of-possession key; every use is permissive (can, MAY) and none is
      ordered. The discovered key is not an input of any §5 algorithm. The SHOULD to minimize
      processing of untrusted data during key discovery sits against hints that live in the protected
      header and the payload (tension key-discovery-reads-untrusted-data).
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "JWS Compact Serialization (application/vc+jwt, application/vp+jwt)"
        message_id: "MSG-06"
        also_messages:
          - "MSG-11"
          - "MSG-18"
        action: >-
          Before verification, obtain the key that secured the object, processing as little untrusted data
          as possible (SHOULD).
        locator: "§4, §5"
        kind: "stated"
        quotes:
          - at: "§4"
            text: |-
              To complete the verification process, a verifier needs to obtain the cryptographic keys used to secure the credential.
          - at: "§5"
            text: |-
              As a general rule, verifiers SHOULD strive to minimize the processing of untrusted data. This includes minimizing any processing of the protected header, unprotected header, or payload as part of the key discovery procedures.
        normative:
          - "N-091"
          - "N-107"
        constrained_by:
          - "w3c-vc-jose-cose#R-0075"
        on_error: >-
          unspecified by source (§4, §5: no outcome is given when no key is found; §5 assumes discovery
          succeeded)
        on_error_basis: "unspecified"
      - n: "2"
        condition: "kid is present"
        from: "verifier"
        to: "verifier"
        message: "JOSE Header of a vc+jwt or vp+jwt"
        message_id: "MSG-07"
        field: "kid"
        also_messages:
          - "MSG-19"
          - "MSG-12"
        action: >-
          If kid is present (JOSE or COSE header), use it as a hint to which key was used. kid MUST be
          present when the issuer or subject key is a DID URL.
        locator: "§4.1.1"
        kind: "stated"
        quotes:
          - at: "§4.1.1"
            text: |-
              If kid is present in the JOSE Header or the COSE Header, a verifier can use this parameter as a hint indicating which key was used to secure the verifiable credential, when performing a verification process as defined in RFC7515.
          - at: "§4.1.1"
            text: |-
              kid MUST be present when the key of the issuer or subject is expressed as a DID URL.
        normative:
          - "N-093"
          - "N-094"
        constrained_by:
          - "w3c-vc-jose-cose#R-0065"
        on_error: >-
          unspecified by source (§4.1.1: no outcome for an absent kid where a DID URL key required one, or
          for a kid that resolves to nothing)
        on_error_basis: "unspecified"
      - n: "3"
        condition: "iss is present"
        from: "verifier"
        to: "verifier"
        message: "Registered JWT claims in the claims set (JWS and SD-JWT)"
        message_id: "MSG-08"
        field: "iss"
        also_messages:
          - "MSG-07"
          - "MSG-19"
          - "MSG-20"
        action: >-
          If iss is present (JOSE Header, JWT claims or COSE Header), use it to obtain a JSON Web Key; a
          kid in the JOSE Header picks the specific key. A present iss MUST match issuer, or issuer.id.
        locator: "§4.1.2"
        kind: "stated"
        quotes:
          - at: "§4.1.2"
            text: |-
              If iss is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier can use this parameter to obtain a JSON Web Key to use in the verification process.
          - at: "§4.1.2"
            text: |-
              If kid is also present in the JOSE Header, it is used to distinguish the specific key used.
        normative:
          - "N-095"
          - "N-097"
        constrained_by:
          - "w3c-vc-jose-cose#R-0066"
          - "w3c-vc-jose-cose#R-0067"
        on_error: >-
          unspecified by source (§4.1.2: the MUST binds the iss value, and no step says a verifier
          compares iss with issuer or what follows a mismatch)
        on_error_basis: "unspecified"
      - n: "4"
        condition: "cnf is present"
        from: "verifier"
        to: "verifier"
        message: "Registered JWT claims in the claims set (JWS and SD-JWT)"
        message_id: "MSG-08"
        field: "cnf"
        also_messages:
          - "MSG-07"
          - "MSG-19"
          - "MSG-20"
        action: >-
          If cnf is present, MAY use it to identify a proof-of-possession key (RFC 7800, RFC 8747).
        locator: "§4.1.3"
        kind: "stated"
        quotes:
          - at: "§4.1.3"
            text: |-
              If cnf is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier MAY use this parameter to identify a proof-of-possession key in the manner described in [RFC7800] or [RFC8747] for use in the verification process.
        normative:
          - "N-098"
        constrained_by:
          - "w3c-vc-jose-cose#R-0068"
        on_error: "unspecified by source (§4.1.3)"
        on_error_basis: "unspecified"
      - n: "5"
        condition: "kid (or iss) identifies a verification method by URL"
        from: "verifier"
        to: "verifier"
        message: "kid value as a reference to a verification method"
        message_id: "MSG-25"
        action: >-
          Where the hint is a URL to a verification method, resolve it through a controlled identifier
          document.
        locator: "§4.2"
        kind: "stated"
        quotes:
          - at: "§4.2"
            text: |-
              This key material is retrieved based on hints in the JOSE or COSE message envelopes, such as kid or iss.
        normative:
          - "N-102"
        invokes: "key-discovery-controlled-identifier-document"
        on_error: >-
          unspecified by source (§4.2: see key-discovery-controlled-identifier-document, none of whose
          steps has a stated failure outcome)
        on_error_basis: "unspecified"
      - n: "6"
        from: "verifier"
        to: "verifier"
        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        action: "Begin verification with the discovered key."
        locator: "§5"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          §5 assumes discovery succeeded, but its algorithms take only inputMediaType and inputDocument:
          the key reaches step 1 of §5.1 to §5.3 by no stated input.
        quotes:
          - at: "§5"
            text: |-
              This specification might be used with many different key discovery protocols. Therefore, discovery of verification keys is described in 4. Key Discovery, and is assumed to have succeeded prior to beginning the verification process.
        normative:
          - "N-106"
        invokes: "verification-dispatch"
        on_error: "unspecified by source (§5, paragraph 1)"
        on_error_basis: "unspecified"
  - name: "key-discovery-controlled-identifier-document"
    title: "Obtaining the key from a verification method in a controlled identifier document"
    locator: "§4.2"
    kind: "receive-processing"
    participants:
      - "verifier"
    run_by:
      - "holder"
      - "verifier"
    summary: >-
      The document constrains the shape of the verification method (JsonWebKey, publicKeyJwk) and the
      kid that points at it, and states that there is no standard way to retrieve the key. Who
      publishes the controlled identifier document and how it is fetched are not said. No step has a
      stated failure outcome.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "kid value as a reference to a verification method"
        message_id: "MSG-25"
        field: "absolute URL to a verification method"
        action: >-
          Take the kid: with iss absent and a URL issuer (or holder), it is an absolute URL to a
          verification method in a controlled identifier document (MUST), RECOMMENDED to embed a JWK
          Thumbprint URI.
        locator: "§4.2"
        kind: "stated"
        quotes:
          - at: "§4.2"
            text: |-
              When iss is absent, and the issuer is identified as a [URL], the kid MUST be an absolute [URL] to a verification method listed in a controlled identifier documents or a DID Document.
          - at: "§4.2"
            text: |-
              When the holder is identified as a [URL], and iss is absent, the kid MUST be an absolute [URL] to a verification method listed in a controlled identifier document.
        normative:
          - "N-103"
          - "N-105"
        constrained_by:
          - "w3c-vc-jose-cose#R-0072"
          - "w3c-vc-jose-cose#R-0074"
          - "w3c-vc-jose-cose#R-0073"
        on_error: "unspecified by source (§4.2: no outcome for a kid that is not an absolute URL)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "Controlled identifier document"
        message_id: "MSG-22"
        action: >-
          Retrieve the controlled identifier document (or DID document) that lists the verification
          method.
        locator: "§4.2"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source says the key material is retrieved from hints and that no standard retrieval exists;
          it describes no retrieval step, endpoint or resolver.
        quotes:
          - at: "§4.2"
            text: |-
              At the time of writing, there is no standard way to retrieve a public key in JWK format from a DID URL or controlled identifier documents.
        normative:
          - "N-102"
        on_error: "unspecified by source (§4.2: retrieval is undefined by the source's own statement)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "Verification method (JsonWebKey)"
        message_id: "MSG-23"
        field: "type"
        action: "Find the verification method; its type MUST be JsonWebKey."
        locator: "§4.2"
        kind: "stated"
        quotes:
          - at: "§4.2"
            text: |-
              The value of the type property of the verification method MUST be JsonWebKey.
        normative:
          - "N-101"
        constrained_by:
          - "w3c-vc-jose-cose#R-0070"
        on_error: >-
          unspecified by source (§4.2: the MUST binds the document; nothing says a verifier rejects
          another type (Example 17 itself lists a JsonWebKey2020 method))
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "publicKeyJwk (JWK)"
        message_id: "MSG-24"
        action: "Take the key from publicKeyJwk (MUST)."
        locator: "§4.2"
        kind: "stated"
        quotes:
          - at: "§4.2"
            text: |-
              Verification material MUST be expressed in the publicKeyJwk property of a JsonWebKey.
        normative:
          - "N-102"
        constrained_by:
          - "w3c-vc-jose-cose#R-0071"
        on_error: "unspecified by source (§4.2)"
        on_error_basis: "unspecified"
      - n: "5"
        condition: "the kid includes a JWK Thumbprint URI"
        from: "verifier"
        to: "verifier"
        message: "kid value as a reference to a verification method"
        message_id: "MSG-25"
        field: "absolute URL including a JWK Thumbprint URI"
        action: >-
          Where the kid embeds a JWK Thumbprint URI, the thumbprint can be compared with the key obtained.
        locator: "§4.2"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source recommends that the kid include the thumbprint and never says anyone checks it.
        quotes:
          - at: "§4.2"
            text: |-
              When using [URL] identifiers, the kid is RECOMMENDED to be an absolute [URL] that includes a JWK Thumbprint URI as defined in [RFC7638].
        normative:
          - "N-104"
        constrained_by:
          - "w3c-vc-jose-cose#R-0073"
        on_error: "unspecified by source (§4.2)"
        on_error_basis: "unspecified"
  - name: "verification-dispatch"
    title: "Receiving a secured object, choosing the §5 algorithm, and what follows it"
    locator: "§5, §5.1, §5.2, §5.3, §3.1.2, §3.2.2, §3.3.2"
    kind: "receive-processing"
    participants:
      - "verifier"
    run_by:
      - "holder"
      - "verifier"
    summary: >-
      The glue the source leaves out. Each algorithm declares its inputMediaType; nothing says how a
      receiver learns the media type, decrypts a nested JWE or COSE encryption object first, chooses
      the algorithm, or verifies the credentials enveloped in a verified presentation. Those steps are
      here so the stated ones can be placed, and every one is marked inferred.
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        field: "inputMediaType"
        also_messages:
          - "MSG-06"
          - "MSG-11"
          - "MSG-18"
        action: "Receive a secured object and its media type."
        locator: "§5.1, §5.2, §5.3"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          Receipt is stated; how the media type arrives (a transport header, typ, a data URL) is not.
        quotes:
          - at: "§5.1"
            text: |-
              Upon receipt of the verifiable credential or presentation secured as a JWT [RFC7519], the holder or verifier follows this algorithm:
        normative:
          - "N-111"
        on_error: "unspecified by source (§5: no outcome for an object without a known media type)"
        on_error_basis: "unspecified"
      - n: "2"
        condition: "the received object is encrypted"
        from: "verifier"
        to: "verifier"
        message: "Nested JWE (encrypted vc+jwt or vp+jwt)"
        message_id: "MSG-10"
        also_messages:
          - "MSG-17"
          - "MSG-21"
        action: >-
          If the object is a JWE or an encrypted COSE object nesting a secured credential or presentation,
          decrypt it first.
        locator: "§3.1.1, §3.2.1, §3.3.1"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          Encryption is a MAY on the producing side; no step of §5.2 or §5.3 decrypts, and §5.1 delegates
          to Validating a JWT, whose handling of nested JWTs is RFC 7519's and is not restated here. No
          media type labels the encrypted object.
        quotes:
          - at: "§3.3.1"
            text: |-
              To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use COSE encryption, as defined in Section 5 of [RFC9052], by nesting the secured verifiable credential as the plaintext payload of an encrypted COSE object.
        normative:
          - "N-077"
        on_error: "unspecified by source (§3.1.1, §3.2.1, §3.3.1: decryption failure is not mentioned)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        field: "inputMediaType"
        action: >-
          Choose the algorithm whose inputMediaType admits the object: vc+jwt or vp+jwt to §5.1, vc+sd-jwt
          to §5.2, vc+cose or vp+cose to §5.3.
        locator: "§5.1, §5.2, §5.3"
        kind: "inferred"
        inferred: true
        inferred_reason: "The input domains are stated; the dispatch on them is not."
        quotes:
          - at: "§5.1"
            text: |-
              inputMediaType: vc+jwt or vp+jwt
          - at: "§5.2"
            text: |-
              inputMediaType: vc+sd-jwt
          - at: "§5.3"
            text: |-
              inputMediaType: vc+cose or vp+cose
        normative:
          - "N-110"
          - "N-112"
          - "N-114"
        invokes: "jose-verification, sd-jwt-verification, cose-verification"
        on_error: >-
          unspecified by source (§5: vp+sd-jwt and every other media type match no algorithm, and no
          outcome is given)
        on_error_basis: "unspecified"
      - n: "4"
        condition: "status is true"
        from: "verifier"
        to: "verifier"
        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        field: "status"
        action: >-
          After a successful verification (status true), perform the §5.4 validation checks (SHOULD).
        locator: "§5"
        kind: "stated"
        quotes:
          - at: "§5"
            text: |-
              After verification has succeeded, additional validation checks SHOULD be performed as described in Section 5.4 Validation
        normative:
          - "N-108"
        constrained_by:
          - "w3c-vc-jose-cose#R-0076"
        invokes: "validation"
        on_error: >-
          See validation; a verifier that skips it (the SHOULD allows it) never meets the MUSTs of §5.4.
        on_error_basis: "inferred"
      - n: "5"
        condition: "mediaType is vp"
        from: "verifier"
        to: "verifier"
        message: "EnvelopedVerifiableCredential"
        message_id: "MSG-03"
        also_messages:
          - "MSG-04"
          - "MSG-05"
        action: >-
          If the verified document is a presentation, take each EnvelopedVerifiableCredential (and
          EnvelopedVerifiablePresentation), decode the secured object from its data URL, and run it
          through this flow again.
        locator: "§3.1.2, §3.2.2, §3.3.2, §5.4"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source requires enveloped credentials to be secured and gives no step that verifies them: §5
          verifies one inputDocument and returns it as document, and §5.4 mentions dependencies between
          multiple credentials only as an example of a MAY.
        quotes:
          - at: "§3.1.2"
            text: |-
              Credentials in verifiable presentations MUST be secured. In this case, these credentials are secured using JWS.
          - at: "§5.4"
            text: |-
              Based on the validation policy of the verifier, the type of credentials, and the type of securing mechanism, additional validation checks MAY be applied.
        normative:
          - "N-042"
          - "N-120"
        constrained_by:
          - "w3c-vc-jose-cose#R-0023"
          - "w3c-vc-jose-cose#R-0039"
          - "w3c-vc-jose-cose#R-0059"
          - "w3c-vc-jose-cose#R-0085"
        on_error: >-
          unspecified by source (§5: no outcome for an enveloped credential that fails, is unsecured or
          cannot be decoded)
        on_error_basis: "unspecified"
  - name: "jose-verification"
    title: "Verifying a credential or presentation secured with JOSE (§5.1)"
    locator: "§5.1, §5, §3.1.1, §3.1.2, §1.1.2.1"
    kind: "receive-processing"
    participants:
      - "verifier"
    run_by:
      - "holder"
      - "verifier"
    conformance_class: "jws-verifier-implementation"
    summary: >-
      Delegates everything to Validating a JWT and maps the outcome to status, mediaType and document.
      The input document is called the verifiable credential although vp+jwt is an input. Step 2.2
      gives no rule for vc against vp. Rejection of an alg none JWT is a separate MUST of §1.1.2.1.
    inputs:
      - at: "§5.1"
        text: |-
          inputMediaType: vc+jwt or vp+jwt
      - at: "§5.1"
        text: |-
          inputDocument: the verifiable credential secured as a JWT [RFC7519]
    receipt:
      at: "§5.1"
      text: |-
        Upon receipt of the verifiable credential or presentation secured as a JWT [RFC7519], the holder or verifier follows this algorithm:
    outputs:
      - at: "§5"
        text: |-
          status: a boolean indicating the result of verification, true for success and false for failure.
      - at: "§5"
        text: |-
          document: a document conforming to the [VC-DATA-MODEL-2.0]
      - at: "§5"
        text: |-
          mediaType: vc or vp
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "JWS Compact Serialization (application/vc+jwt, application/vp+jwt)"
        message_id: "MSG-06"
        action: >-
          Validate the JWT by the procedure of RFC 7519 Section 7.2, which the step names Validating a
          JWT; the JWS inside is verified with RFC 7515 (R-0015, R-0020).
        locator: "§5.1, step 1; §3.1.1, §3.1.2, §1.1.2.1"
        kind: "stated"
        quotes:
          - at: "§5.1"
            text: |-
              Follow the algorithm defined in Validating a JWT [RFC7519].
        normative:
          - "N-111"
        constrained_by:
          - "w3c-vc-jose-cose#R-0015"
          - "w3c-vc-jose-cose#R-0020"
          - "w3c-vc-jose-cose#R-0025"
          - "w3c-vc-jose-cose#R-0004"
          - "w3c-vc-jose-cose#R-0005"
        on_error: >-
          Stated: the failure branch, step 3, is taken; its condition is quoted there (§5.1, step 3).
        on_error_basis: "stated"
        note: >-
          Validating a JWT links RFC 7519 Section 7.2. A JWT with no integrity protection ("alg": "none")
          MUST be ignored (R-0005); §5.1 does not say whether that is step 3 or something else.
      - n: "2"
        condition: "processing completes successfully"
        from: "verifier"
        to: "verifier"
        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        action: "branch: success"
        locator: "§5.1, step 2"
        kind: "stated"
        quotes:
          - at: "§5.1"
            text: |-
              If processing completes successfully:
        normative:
          - "N-111"
        on_error: "Not an error path: taken only on success (§5.1, step 2)."
        on_error_basis: "stated"
      - n: "2.1"
        from: "verifier"
        to: "verifier"
        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        field: "status"
        action: "status := true"
        locator: "§5.1, step 2.1"
        kind: "stated"
        quotes:
          - at: "§5.1"
            text: |-
              Set status to true
        normative:
          - "N-111"
        on_error: "unspecified by source (§5.1 step 2.1)"
        on_error_basis: "unspecified"
      - n: "2.2"
