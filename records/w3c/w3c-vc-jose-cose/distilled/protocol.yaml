  - id: "ignore-versus-crit"
    kind: "tension"
    locator: "§3.3.3, §3.1.3, §5.4"
    text: >-
      Header parameters and claims that are not understood MUST be ignored, with no exception for a
      parameter listed as critical. For JWS, RFC 7515 makes such a JWS invalid. §3.1.3, which carries
      the JOSE twin of the rule, is non-normative, so for JOSE header parameters the conflict is with
      advice; for COSE (§3.3.3, normative) the same question arises under RFC 9052's crit parameter,
      which this pass did not check (no cached copy).
    quotes:
      - at: "§3.3.3"
        text: |-
          Additional members may be present as header parameters and claims. If they are not understood, they MUST be ignored.
      - at: "§3.1.3"
        text: |-
          This section is non-normative.
    foreign_quotes:
      - doc: "rfc-7515"
        at: "§4.1.11"
        text: |-
          If any of the listed extension Header Parameters are not understood and supported by the recipient, then the JWS is invalid.
