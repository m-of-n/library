      - "validation 1"
  - id: "validation-has-no-output"
    kind: "gap"
    locator: "§5, §5.4"
    text: >-
      The §5 outputs are set by §5.1 to §5.3 before validation starts, and §5.4 sets nothing. A failed
      validation cannot change status, and nothing else carries it; §5.4 itself only says a credential
      could be considered invalid.
    quotes:
