      without a KB-JWT. Example 22 has a KB-JWT and still ends with a tilde (seven tilde-separated
      parts, the last empty), so a parser that keys on the trailing tilde reads its KB-JWT as a
      disclosure.
    quotes:
      - at: "§1.1.2.2"
