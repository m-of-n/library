  - id: "mixed-mechanisms-in-presentation"
    kind: "tension"
    locator: "§3.1.2, §3.2.2, §3.3.2, Examples 8, 9, 20, 23"
    text: >-
      Each presentation section follows its MUST with a sentence, without a keyword, saying the
      enclosed credentials are secured with the presentation's own mechanism. The source's COSE
      presentations envelope SD-JWT instead: Example 8 one credential whose id holds
      data:application/vc+sd-jwt URLs (two, joined by a semicolon), Example 9 a
      data:application/vp+sd-jwt presentation, Example 23 one credential whose id holds
      data:application/vc-ld+sd-jwt URLs (a media type this document does not register); and Example
      20's COSE presentation envelopes three credentials, secured as vc+cose, vc+jwt and vc+sd-jwt. A
      verifier cannot tell from the source whether to reject a presentation that mixes mechanisms.
