    quotes:
      - at: "§1.1.1"
        text: |-
          A conforming SD-JWT issuer implementation produces conforming SD-JWT documents and MUST secure them as described in Section 3.2 With SD-JWT.
  - name: "sd-jwt-verifier-implementation"
    kind: "conformance-class"
    played_by: "holder or verifier (§5.2)"
    locators:
      - "§1.1.1"
    quotes:
      - at: "§1.1.1"
        text: |-
          A conforming SD-JWT verifier implementation verifies conforming SD-JWT documents as described in Section 3.2 With SD-JWT.
  - name: "cose-issuer-implementation"
    kind: "conformance-class"
    played_by: "issuer for a credential (§3.3.1); for a presentation (§3.3.2) the source names no party"
    locators:
      - "§1.1.1"
    quotes:
      - at: "§1.1.1"
        text: |-
          A conforming COSE issuer implementation produces conforming COSE documents and MUST secure them as described in Section 3.3 With COSE.
  - name: "cose-verifier-implementation"
    kind: "conformance-class"
    played_by: "holder or verifier (§5.3)"
    locators:
      - "§1.1.1"
    quotes:
      - at: "§1.1.1"
        text: |-
          A conforming COSE verifier implementation verifies conforming COSE documents as described in Section 3.3 With COSE.
  - name: "implementer"
    kind: "mentioned"
    also_called:
      - "implementers"
      - "Implementers"
      - "Implementations"
    description: >-
      The writer of the software, named as the actor of the encryption MAYs, the SD-JWT disclosure
      SHOULDs and the reference to the SD-JWT draft. Its choices are carried out by the issuer or
      holder software in the flows; it takes no step itself.
    locators:
      - "§1.1.2.2"
      - "§3.1.1"
      - "§3.2.1"
      - "§3.1.2"
      - "§3.2.2"
    quotes:
      - at: "§1.1.2.2"
        text: |-
          Implementers SHOULD refer to this draft for the full details of the SD-JWT format and processing requirements.
      - at: "§3.2.1"
        text: |-
          When securing verifiable credentials with [SD-JWT], implementers SHOULD ensure that properties necessary for the validation and verification of a credential are NOT selectively disclosable (i.e., such properties SHOULD be disclosed).
  - name: "insecure-channel"
    kind: "channel"
    also_called:
      - "an insecure channel"
    description: >-
      Whatever carries a secured object between parties. Named only as the condition under which
      encryption MAY be added; no transport, binding or delivery is specified.
    locators:
      - "§3.1.1"
      - "§3.1.2"
      - "§3.2.1"
      - "§3.2.2"
      - "§3.3.1"
      - "§3.3.2"
    quotes:
      - at: "§3.3.1"
        text: |-
          To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use COSE encryption, as defined in Section 5 of [RFC9052], by nesting the secured verifiable credential as the plaintext payload of an encrypted COSE object.
  - name: "json-parser"
    kind: "component"
    also_called:
      - "JSON parser"
      - "JSON parsers"
    description: >-
      The parser that reads JSON inputs (headers, payloads). Named only in §7.2, which the source
      marks non-normative.
    locators:
      - "§7.2"
    quotes:
      - at: "§7.2"
        text: |-
          To prevent these risks, it is essential to use a JSON parser that strictly validates the syntax of all input data.
      - at: "§7.2"
        text: |-
          It is essential that any JSON inputs that do not conform to the JSON-text syntax defined in [RFC7159] be rejected in their entirety by JSON parsers.
  - name: "user"
    kind: "mentioned"
    also_called:
      - "users"
      - "the user's asymmetric private and symmetric secret keys"
    description: >-
      Named in the non-normative considerations as a reader of them and as the owner of keys to
      protect. Takes part in no flow.
    locators:
      - "§7.1"
      - "§7.2"
    quotes:
      - at: "§7.2"
        text: |-
          This especially includes protecting the user's asymmetric private and symmetric secret keys, as well as employing countermeasures against various attacks.
