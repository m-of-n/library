  - id: "issuer-class-secures-presentations"
    kind: "tension"
    locator: "§1.1.1, §3.1.2, §3.2.2, §3.3.2, §4, §4.2, §5"
    text: >-
      Securing a presentation is assigned to the conforming issuer implementation of each mechanism;
      there is no holder conformance class. Yet holders have verification keys (§4), the holder's kid
      is constrained (§4.2), and the holder runs the verification algorithms. This model has the
      holder secure presentations as the issuer-implementation class, marked inferred.
    quotes:
