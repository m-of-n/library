        message: "Verification algorithm inputs and outputs"
        message_id: "MSG-26"
        field: "document"
        action: >-
          document := the JWT Claims Set recovered by reversing the SD-JWT conversion of the payload
        locator: "§5.2, step 2.3"
        kind: "stated"
        quotes:
          - at: "§5.2"
            text: |-
              Convert the SD-JWT payload back into the JWT Claims Set by reversing the process in [SD-JWT]. Set document to the JWT Claims Set. (For examples of the transition from JWT Claims Set to SD-JWT payload, please see SD-JWT examples).
