flows:
  - name: "media-type-labelling"
    title: "Choosing the securing mechanism and the media type that labels the secured object"
    locator: "§1.1.2, §3, §3.3"
    kind: "local-decision"
    participants:
      - "issuer"
      - "holder"
    summary: >-
      Run by whoever secures a credential (the issuer) or a presentation (the holder, by this model's
      reading). The source states no rule for choosing among JOSE, SD-JWT and COSE: COSE is a MAY and
      the other two have no keyword of their own. The media type rules are general and bind the label
      wherever it is carried (typ, cty, a data URL, a transport header), which the source does not
      enumerate. Steps name the issuer; a holder securing a presentation applies the same rules.
    steps:
      - n: "1"
        from: "issuer"
        to: "issuer"
        message: "Unsecured verifiable credential (application/vc)"
        message_id: "MSG-01"
        also_messages:
          - "MSG-02"
        action: >-
          Choose an enveloping mechanism: JWS (§3.1), SD-JWT (§3.2) or COSE_Sign1 (§3.3). No criterion is
          given; COSE is permitted, the other two are simply described.
        locator: "§1.1.2, §3.3"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source describes three mechanisms (§1.1.2) and permits COSE (MAY, §3.3); no sentence says
          that a securer chooses among them, or how, so the choice is this model's step.
        quotes:
          - at: "§1.1.2"
            text: |-
              This specification defines how to secure different data structures using various enveloping proof mechanisms:
          - at: "§3.3"
            text: |-
              Verifiable credentials MAY be secured using COSE [RFC9052] and SHOULD be identified through use of content types as outlined in this section.
        normative:
          - "N-014"
          - "N-071"
        constrained_by:
          - "w3c-vc-jose-cose#R-0045"
          - "w3c-vc-jose-cose#R-0046"
        on_error: >-
          unspecified by source (§1.1.2, §3.3: no rule for the choice, so no wrong choice is defined)
        on_error_basis: "unspecified"
      - n: "2"
        from: "issuer"
        to: "issuer"
        message: "Media type registration application/vc+jwt"
        message_id: "MSG-27"
        also_messages:
          - "MSG-28"
          - "MSG-29"
          - "MSG-30"
          - "MSG-31"
          - "MSG-32"
        action: >-
          Label the secured object with a media type that tells verifiable credentials and presentations
          apart from other secured JSON or CBOR (RECOMMENDED).
        locator: "§3"
        kind: "stated"
        quotes:
          - at: "§3"
            text: |-
              It is RECOMMENDED that media types be used to distinguish verifiable credentials and verifiable presentations from other kinds of secured JSON or CBOR.
        normative:
          - "N-028"
        constrained_by:
          - "w3c-vc-jose-cose#R-0008"
        on_error: "unspecified by source (§3, paragraph 4)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "issuer"
        to: "issuer"
        message: "Media type registration application/vc+sd-jwt"
        message_id: "MSG-29"
        also_messages:
          - "MSG-27"
          - "MSG-28"
          - "MSG-30"
          - "MSG-31"
          - "MSG-32"
        action: >-
          Use the most specific media type available (SHOULD): application/vc+sd-jwt rather than
          application/sd-jwt, unless a still more specific type exists.
        locator: "§3"
        kind: "stated"
        quotes:
          - at: "§3"
            text: |-
              The most specific media type (or subtype) available SHOULD be used, instead of more generic media types (or supertypes).
          - at: "§3"
            text: |-
              For example, rather than the general application/sd-jwt, application/vc+sd-jwt SHOULD be used, unless there is a more specific media type that would even better identify the secured envelope format.
        normative:
          - "N-029"
        constrained_by:
          - "w3c-vc-jose-cose#R-0009"
          - "w3c-vc-jose-cose#R-0010"
        on_error: "unspecified by source (§3, paragraph 5)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "issuer"
        to: "issuer"
        message: "Media type registration application/vc+jwt"
        message_id: "MSG-27"
        also_messages:
          - "MSG-28"
          - "MSG-29"
          - "MSG-30"
          - "MSG-31"
          - "MSG-32"
        action: >-
          If the implementation does not know which media type to use, it MUST use one of the six this
          document defines.
        locator: "§3"
        kind: "stated"
        quotes:
          - at: "§3"
            text: |-
              If implementations do not know which media type to use, media types defined in this specification MUST be used.
        normative:
          - "N-030"
        constrained_by:
          - "w3c-vc-jose-cose#R-0011"
        on_error: "unspecified by source (§3, paragraph 6)"
        on_error_basis: "unspecified"
        note: "The six are registered in §6, which the source marks non-normative (normative.md SD-16)."
  - name: "jose-credential-securing"
    title: "Securing a credential as a JWS (application/vc+jwt) and handing it to the holder"
    locator: "§3.1.1, §3.1.2, §1.1.2.1, §4.1.1, §4.1.2, §4.2"
    kind: "creation-and-delivery"
    participants:
      - "issuer"
      - "insecure-channel"
      - "holder"
    summary: >-
      The issuer signs the credential JSON, unencoded, as a JWS payload. typ and cty are SHOULDs; kid
      is a MUST only in the DID URL case and the URL-issuer-without-iss case of §4.2, whose
      requirements apply when controlled identifier documents are used. Encryption is a MAY. Delivery
      is not specified. The holder may verify on receipt with §5.1.
    steps:
      - n: "1"
        from: "issuer"
        to: "issuer"
        message: "Unsecured verifiable credential (application/vc)"
        message_id: "MSG-01"
        field: "issuer"
        action: >-
          Take the unsecured credential as the JWS payload, unencoded. It carries no vc or vp claim; a
          present iss equals issuer, or issuer.id when issuer is an object.
        locator: "§3.1.1, §1.1.2.1, §4.1.2"
        kind: "stated"
        quotes:
          - at: "§3.1.1"
            text: |-
              The unsecured verifiable credential is the unencoded JWS payload.
          - at: "§1.1.2.1"
            text: |-
              The JWT Claim Names vc and vp MUST NOT be present in any JWT Claims Set that comprises a verifiable credential or a verifiable presentation.
          - at: "§4.1.2"
            text: |-
              When issuer value is a string, iss value, if present, MUST match issuer value.
          - at: "§4.1.2"
            text: |-
              When issuer value is an object with an id value, iss value, if present, MUST match issuer.id value.
        normative:
          - "N-032"
          - "N-021"
          - "N-096"
        constrained_by:
          - "w3c-vc-jose-cose#R-0012"
          - "w3c-vc-jose-cose#R-0006"
          - "w3c-vc-jose-cose#R-0066"
          - "w3c-vc-jose-cose#R-0067"
        constrained_by_locators:
          - "§3.1.3, line 366 of the .txt (non-normative): nbf NOT RECOMMENDED; iat and exp are the times of the signature"
          - "§3.1.3, line 368 (non-normative): SHOULD avoid claim values that conflict with credential properties; SHOULD NOT set a conflicting iss"
          - "§3.1.3, line 369 (non-normative): vc and vp MUST NOT be present (bound normatively by R-0006)"
        on_error: >-
          unspecified by source (§3.1.1, §4.1.2: no producer-side check is described; a violation is only
          visible to a verifier that looks, and §5.1 names no such check)
        on_error_basis: "unspecified"
      - n: "2"
        from: "issuer"
        to: "issuer"
        message: "JOSE Header of a vc+jwt or vp+jwt"
        message_id: "MSG-07"
        field: "typ"
        action: >-
          Build the JOSE Header: typ vc+jwt (SHOULD); cty vc when present (SHOULD); kid MUST be present
          when the issuer key is a DID URL; where controlled identifier documents are used (§4.2), with no
          iss and a URL issuer, kid MUST be an absolute URL to a verification method (and is RECOMMENDED to
          embed a JWK Thumbprint URI); cnf for a holder key, see key-binding.
        locator: "§3.1.1, §4.1.1, §4.2"
        kind: "stated"
        quotes:
          - at: "§3.1.1"
            text: |-
              The typ header parameter SHOULD be vc+jwt.
          - at: "§3.1.1"
            text: |-
              When present, the cty header parameter SHOULD be vc.
          - at: "§4.1.1"
            text: |-
              kid MUST be present when the key of the issuer or subject is expressed as a DID URL.
          - at: "§4.2"
            text: |-
              When iss is absent, and the issuer is identified as a [URL], the kid MUST be an absolute [URL] to a verification method listed in a controlled identifier documents or a DID Document.
          - at: "§4.2"
            text: |-
              When using [URL] identifiers, the kid is RECOMMENDED to be an absolute [URL] that includes a JWK Thumbprint URI as defined in [RFC7638].
        normative:
          - "N-033"
          - "N-094"
          - "N-103"
          - "N-104"
        constrained_by:
          - "w3c-vc-jose-cose#R-0013"
          - "w3c-vc-jose-cose#R-0014"
          - "w3c-vc-jose-cose#R-0065"
          - "w3c-vc-jose-cose#R-0072"
          - "w3c-vc-jose-cose#R-0073"
        constrained_by_locators:
          - "§3.1.3, line 364 of the .txt (non-normative): the unencoded JOSE Header is JSON, not JSON-LD"
          - "§3.1.3, line 365 (non-normative): RECOMMENDED to use the IANA JWT Claims and JOSE Header Parameters registries"
        invokes: "key-binding"
        on_error: "unspecified by source (§3.1.1, §4.1.1, §4.2)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "issuer"
        to: "issuer"
        message: "JWS Compact Serialization (application/vc+jwt, application/vp+jwt)"
        message_id: "MSG-06"
        also_messages:
          - "MSG-09"
        action: >-
          Sign with RFC 7515 (MUST) and serialize compactly: implementations MUST support the compact
          serialization; the JSON serialization is NOT RECOMMENDED.
        locator: "§3.1.1, §3.1.2, §1.1.1"
        kind: "stated"
        conformance_class: "jws-issuer-implementation"
        quotes:
          - at: "§3.1.1"
            text: |-
              A conforming JWS issuer implementation MUST use [RFC7515] to secure this media type.
          - at: "§3.1.2"
            text: |-
              Implementations MUST support the JWS compact serialization. Use of the JWS JSON serialization is NOT RECOMMENDED.
        normative:
          - "N-032"
          - "N-044"
        constrained_by:
          - "w3c-vc-jose-cose#R-0012"
          - "w3c-vc-jose-cose#R-0001"
          - "w3c-vc-jose-cose#R-0025"
          - "w3c-vc-jose-cose#R-0026"
        on_error: "unspecified by source (§3.1.1: no signing failure is described)"
        on_error_basis: "unspecified"
        note: >-
          The two serialization statements close §3.1.2, the presentation section; applying them to a
          credential is this model's reading (normative.md SD-24).
      - n: "4"
        condition: >-
          the secured credential will be transmitted over an insecure channel and the implementer chooses
          to encrypt
        from: "issuer"
        to: "issuer"
        message: "Nested JWE (encrypted vc+jwt or vp+jwt)"
        message_id: "MSG-10"
        action: >-
          Optionally (MAY), when the JWS will cross an insecure channel, nest it as the plaintext of a JWE
          per the Nested JWT description of RFC 7519.
        locator: "§3.1.1"
        kind: "stated"
        quotes:
          - at: "§3.1.1"
            text: |-
              To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use JSON Web Encryption (JWE) [RFC7516] by nesting the secured verifiable credential as the plaintext payload of a JWE, per the description of Nested JWTs in [RFC7519].
        normative:
          - "N-035"
        constrained_by:
          - "w3c-vc-jose-cose#R-0016"
        on_error: >-
          unspecified by source (§3.1.1: no encryption failure is described, and no media type labels the
          JWE (messages.yaml TEN-28))
        on_error_basis: "unspecified"
      - n: "5"
        from: "issuer"
        to: "holder"
        via: "insecure-channel"
        message: "JWS Compact Serialization (application/vc+jwt, application/vp+jwt)"
        message_id: "MSG-06"
        also_messages:
          - "MSG-10"
        action: "Deliver the secured credential (or its JWE) to the holder."
        locator: "§3.1.1"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source mentions transmission only as the condition of the encryption MAY. It defines no
          delivery, request, response or acknowledgement, and never says the issuer sends the credential
          to the holder.
        quotes:
          - at: "§3.1.1"
            text: |-
              To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use JSON Web Encryption (JWE) [RFC7516] by nesting the secured verifiable credential as the plaintext payload of a JWE, per the description of Nested JWTs in [RFC7519].
        normative:
          - "N-035"
        on_error: "unspecified by source (§3.1.1: no delivery is defined)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "holder"
        to: "holder"
        message: "JWS Compact Serialization (application/vc+jwt, application/vp+jwt)"
        message_id: "MSG-06"
        action: "On receipt the holder follows the §5.1 algorithm."
        locator: "§5.1"
        kind: "stated"
        quotes:
          - at: "§5.1"
            text: |-
              Upon receipt of the verifiable credential or presentation secured as a JWT [RFC7519], the holder or verifier follows this algorithm:
        normative:
          - "N-111"
        invokes: "jose-verification"
        on_error: "See jose-verification."
        on_error_basis: "stated"
  - name: "sd-jwt-credential-securing"
    title: "Securing a credential as an SD-JWT (application/vc+sd-jwt) and handing it to the holder"
    locator: "§3.2.1, §3.2.2, §1.1.2.2, §4.1.1, §4.2"
    kind: "creation-and-delivery"
    participants:
      - "issuer"
      - "insecure-channel"
      - "holder"
    summary: >-
      Unlike the JWS and COSE routes, the payload is not the credential as it stands: the issuer
      converts the credential (the input JWT Claims Set) into an SD-JWT payload with digests and
      disclosures, per the SD-JWT draft. Properties needed for validation SHOULD stay disclosed.
    steps:
      - n: "1"
        from: "issuer"
        to: "issuer"
        message: "Unsecured verifiable credential (application/vc)"
        message_id: "MSG-01"
        action: >-
          Take the unsecured credential as the input JWT Claims Set; no vc or vp claim; a present iss
          equals issuer, or issuer.id.
        locator: "§3.2.1, §1.1.2.1, §4.1.2"
        kind: "stated"
        quotes:
          - at: "§3.2.1"
            text: |-
              The unsecured verifiable credential is the input JWT Claims Set.
          - at: "§1.1.2.1"
            text: |-
              The JWT Claim Names vc and vp MUST NOT be present in any JWT Claims Set that comprises a verifiable credential or a verifiable presentation.
        normative:
          - "N-056"
          - "N-021"
        constrained_by:
          - "w3c-vc-jose-cose#R-0027"
          - "w3c-vc-jose-cose#R-0006"
          - "w3c-vc-jose-cose#R-0066"
          - "w3c-vc-jose-cose#R-0067"
        on_error: "unspecified by source (§3.2.1)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "issuer"
        to: "issuer"
        message: "SD-JWT payload (the converted claims set)"
        message_id: "MSG-13"
        also_messages:
          - "MSG-14"
        action: >-
          Convert the claims set into an SD-JWT payload per the SD-JWT issuance instructions: each
          selectively disclosable claim is salted and replaced by a digest, its disclosure kept apart.
          Properties necessary for validation and verification (for example @context, type,
          credentialStatus, credentialSchema, relatedResource) SHOULD stay disclosed, not selectively
          disclosable.
        locator: "§3.2.1, §1.1.2.2"
        kind: "stated"
        quotes:
          - at: "§3.2.1"
            text: |-
              The Issuer then converts the input JWT Claims Set (i.e., the unsecured verifiable credential) into an [SD-JWT] payload according to SD-JWT issuance instructions.
          - at: "§3.2.1"
            text: |-
              When securing verifiable credentials with [SD-JWT], implementers SHOULD ensure that properties necessary for the validation and verification of a credential are NOT selectively disclosable (i.e., such properties SHOULD be disclosed).
          - at: "§1.1.2.2"
            text: |-
              Each disclosable claim is combined with a salt value before hashing to prevent dictionary attacks.
        normative:
          - "N-056"
          - "N-059"
          - "N-023"
        constrained_by:
          - "w3c-vc-jose-cose#R-0031"
        on_error: >-
          unspecified by source (§3.2.1: the conversion is SD-JWT's, linked to an unversioned draft
          (section 6.1))
        on_error_basis: "unspecified"
        note: >-
          The source's own SD-JWT examples make type selectively disclosable (Example 4 lists a disclosure
          for the claim type holding the credential's type array), against the SHOULD of this step.
      - n: "3"
        from: "issuer"
        to: "issuer"
        message: "Issuer-signed JWT header (SD-JWT)"
        message_id: "MSG-12"
        field: "typ"
        action: >-
          Set the issuer-signed JWT header: typ vc+sd-jwt (SHOULD), cty vc when present (SHOULD), kid as
          in jose-credential-securing step 2.
        locator: "§3.2.1, §4.1.1, §4.2"
        kind: "stated"
        quotes:
          - at: "§3.2.1"
            text: |-
              The typ header parameter SHOULD be vc+sd-jwt.
          - at: "§3.2.1"
            text: |-
              When present, the cty header parameter SHOULD be vc.
        normative:
          - "N-057"
        constrained_by:
          - "w3c-vc-jose-cose#R-0028"
          - "w3c-vc-jose-cose#R-0029"
          - "w3c-vc-jose-cose#R-0065"
          - "w3c-vc-jose-cose#R-0072"
          - "w3c-vc-jose-cose#R-0073"
        on_error: "unspecified by source (§3.2.1)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "issuer"
        to: "issuer"
        message: "SD-JWT compact (application/vc+sd-jwt, application/vp+sd-jwt)"
        message_id: "MSG-11"
        also_messages:
          - "MSG-16"
        action: >-
          Sign per SD-JWT (MUST) and serialize: the compact serialization (application/sd-jwt) MUST be
          supported, the JSON serialization MAY be, and a profile is RECOMMENDED if it is used. The parts
          are separated by tildes; without a KB-JWT the string ends with a tilde (lowercase must, not BCP
          14).
        locator: "§3.2.1, §3.2.2, §1.1.2.2, §1.1.1"
        kind: "stated"
        conformance_class: "sd-jwt-issuer-implementation"
        quotes:
          - at: "§3.2.1"
            text: |-
              A conforming SD-JWT issuer implementation MUST use [SD-JWT] to secure this media type.
          - at: "§3.2.2"
            text: |-
              Implementations MUST support the compact serialization (application/sd-jwt) and MAY support the JSON serialization (application/sd-jwt+json).
          - at: "§3.2.2"
            text: |-
              If the JSON serialization is used, it is RECOMMENDED that a profile be defined to ensure any additional JSON members are understood consistently.
          - at: "§1.1.2.2"
            text: |-
              An SD-JWT consists of three main parts: the SD-JWT itself, optional disclosures, and an optional KB-JWT (Key Binding JWT). These parts are separated by tilde (~) characters.
          - at: "§1.1.2.2"
            text: |-
              If the KB-JWT is not present, the SD-JWT must end with a tilde (~) character.
        normative:
          - "N-056"
          - "N-070"
          - "N-023"
        constrained_by:
          - "w3c-vc-jose-cose#R-0027"
          - "w3c-vc-jose-cose#R-0002"
          - "w3c-vc-jose-cose#R-0042"
          - "w3c-vc-jose-cose#R-0043"
          - "w3c-vc-jose-cose#R-0044"
        on_error: "unspecified by source (§3.2.1)"
        on_error_basis: "unspecified"
        note: >-
          The serialization statements sit in §3.2.2, the presentation section (normative.md SD-24).
      - n: "5"
        condition: >-
          the secured credential will be transmitted over an insecure channel and the implementer chooses
          to encrypt
        from: "issuer"
        to: "issuer"
        message: "Encrypted SD-JWT (JWE per Section 11.2 of [SD-JWT])"
        message_id: "MSG-17"
        action: >-
          Optionally (MAY) nest the SD-JWT as the plaintext of a JWE per Section 11.2 of the SD-JWT draft.
        locator: "§3.2.1"
        kind: "stated"
        quotes:
          - at: "§3.2.1"
            text: |-
              To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use JSON Web Encryption (JWE) [RFC7516] by nesting the secured verifiable credential as the plaintext payload of a JWE, per the instructions in Section 11.2 of [SD-JWT].
        normative:
          - "N-060"
        constrained_by:
          - "w3c-vc-jose-cose#R-0032"
        on_error: "unspecified by source (§3.2.1)"
