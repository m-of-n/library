    protocol_flow: "validation"
    purpose: >-
      The checks of §5.4 after a successful verification. Entered by a SHOULD; holds six MUSTs, two
      SHOULDs and a MAY; produces no output the source defines.
    initial: "document-verified"
    states:
      - name: "document-verified"
        meaning: "An algorithm returned status true; the document is available."
        kind: "stated"
      - name: "checking-claims"
        meaning: >-
          Paragraph 1: expected claims present, understood claims evaluated by policy, others ignored.
        kind: "stated"
      - name: "checking-json-ld"
        meaning: "Paragraph 2: the document is well-formed compact JSON-LD."
        kind: "stated"
      - name: "checking-schema"
        meaning: "Paragraph 3: schema extension mechanisms such as credentialSchema."
        kind: "stated"
      - name: "checking-status"
        meaning: "Paragraph 4: status extension mechanisms such as credentialStatus."
        kind: "stated"
      - name: "additional-checks"
        meaning: "Paragraph 5: further checks by policy, type of credential and securing mechanism."
        kind: "stated"
      - name: "validated"
        meaning: "No check found a failure."
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source has no success verdict; "an otherwise valid credential" in paragraph 5 is the
          nearest.
        terminal: true
      - name: "considered-invalid"
        meaning: "A check found the credential or presentation invalid."
        kind: "stated"
        error: true
        terminal: true
    transitions:
      - id: "M05-T01"
        from: "document-verified"
        to: "checking-claims"
        trigger: "validation_performed"
        guard: "The verifier performs validation (SHOULD)."
        quotes:
          - at: "§5"
            text: |-
              After verification has succeeded, additional validation checks SHOULD be performed as described in Section 5.4 Validation
        locator: "§5, paragraph 3"
        constrained_by:
          - "w3c-vc-jose-cose#R-0076"
        kind: "stated"
        protocol_steps:
          - "validation 1"
      - id: "M05-T02"
        from: "checking-claims"
        to: "checking-json-ld"
        trigger: "completion"
        guard: >-
          All claims expected for the typ are present, every understood claim passes the verifier's
          policies, and every claim (for COSE, header parameter) not understood has been ignored.
        quotes:
          - at: "§5.4"
            text: |-
              All claims expected for the typ MUST be present. All claims that are understood MUST be evaluated according the verifier's validation policies. All claims that are not understood MUST be ignored.
        locator: "§5.4, paragraph 1; §3.3.3"
        constrained_by:
          - "w3c-vc-jose-cose#R-0077"
          - "w3c-vc-jose-cose#R-0078"
          - "w3c-vc-jose-cose#R-0079"
          - "w3c-vc-jose-cose#R-0064"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source gives the checks as paragraphs with no order; the order here is the paragraph order.
        protocol_steps:
          - "validation 2"
          - "validation 3"
          - "validation 4"
      - id: "M05-T03"
        from: "checking-claims"
        to: "considered-invalid"
        trigger: "check_failed"
        guard: "An expected claim is absent, or an understood claim fails the verifier's policies."
        quotes:
          - at: "§5.4"
            text: |-
              All claims expected for the typ MUST be present.
        locator: "§5.4, paragraph 1"
        constrained_by:
          - "w3c-vc-jose-cose#R-0077"
          - "w3c-vc-jose-cose#R-0078"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source states the MUSTs and no outcome; which claims a typ expects is defined nowhere (gap
          typ-expected-claims-undefined).
        protocol_steps:
          - "validation 2"
          - "validation 3"
      - id: "M05-T04"
        from: "checking-json-ld"
        to: "checking-schema"
        trigger: "completion"
        guard: "The document is well-formed compact JSON-LD."
        quotes:
          - at: "§5.4"
            text: |-
              The verified document returned from verification MUST be a well-formed compact JSON-LD document, as described in Verifiable Credentials Data Model v2.0.
        locator: "§5.4, paragraph 2"
        constrained_by:
          - "w3c-vc-jose-cose#R-0080"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source gives the checks as paragraphs with no order; the order here is the paragraph order.
        protocol_steps:
          - "validation 5"
      - id: "M05-T05"
        from: "checking-json-ld"
        to: "considered-invalid"
        trigger: "check_failed"
        guard: "The document is not well-formed compact JSON-LD."
        quotes:
          - at: "§5.4"
            text: |-
              The verified document returned from verification MUST be a well-formed compact JSON-LD document, as described in Verifiable Credentials Data Model v2.0.
        locator: "§5.4, paragraph 2"
        constrained_by:
          - "w3c-vc-jose-cose#R-0080"
        kind: "inferred"
        inferred: true
        inferred_reason: "No outcome is stated for the MUST."
        protocol_steps:
          - "validation 5"
      - id: "M05-T06"
        from: "checking-schema"
        to: "checking-status"
        trigger: "completion"
        guard: >-
          Schema mechanisms checked and passed (SHOULD), or not checked, or of a type not understood and
          so ignored (MUST).
        quotes:
          - at: "§5.4"
            text: |-
              Schema extension mechanisms such as credentialSchema SHOULD be checked. If the extension mechanism type is not understood, this property MUST be ignored.
        locator: "§5.4, paragraph 3"
        constrained_by:
          - "w3c-vc-jose-cose#R-0081"
          - "w3c-vc-jose-cose#R-0082"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source gives the checks as paragraphs with no order; the order here is the paragraph order.
        protocol_steps:
          - "validation 6"
          - "validation 7"
      - id: "M05-T07"
        from: "checking-schema"
        to: "considered-invalid"
        trigger: "check_failed"
        guard: "A schema mechanism of an understood type is checked and fails."
        quotes:
          - at: "§5.4"
            text: |-
              Schema extension mechanisms such as credentialSchema SHOULD be checked. If the extension mechanism type is not understood, this property MUST be ignored.
        locator: "§5.4, paragraph 3"
        constrained_by:
          - "w3c-vc-jose-cose#R-0081"
        kind: "inferred"
        inferred: true
        inferred_reason: "No outcome is stated."
        protocol_steps:
          - "validation 6"
      - id: "M05-T08"
        from: "checking-status"
        to: "additional-checks"
        trigger: "completion"
        guard: >-
          Status mechanisms checked and passed (SHOULD), or not checked, or of a type not understood and
          so ignored (MUST).
        quotes:
          - at: "§5.4"
            text: |-
              Status extension mechanisms such as credentialStatus SHOULD be checked. If the extension mechanism type is not understood, this property MUST be ignored.
        locator: "§5.4, paragraph 4"
        constrained_by:
          - "w3c-vc-jose-cose#R-0083"
          - "w3c-vc-jose-cose#R-0084"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source gives the checks as paragraphs with no order; the order here is the paragraph order.
        protocol_steps:
          - "validation 8"
          - "validation 9"
      - id: "M05-T09"
        from: "checking-status"
        to: "considered-invalid"
        trigger: "check_failed"
        guard: "A status mechanism of an understood type is checked and fails (for example, revoked)."
        quotes:
          - at: "§5.4"
            text: |-
              Status extension mechanisms such as credentialStatus SHOULD be checked. If the extension mechanism type is not understood, this property MUST be ignored.
        locator: "§5.4, paragraph 4"
        constrained_by:
          - "w3c-vc-jose-cose#R-0083"
        kind: "inferred"
        inferred: true
        inferred_reason: "No outcome is stated; the status mechanism is not this document's."
        protocol_steps:
          - "validation 8"
      - id: "M05-T10"
        from: "additional-checks"
        to: "validated"
        trigger: "completion"
        guard: "No additional check is applied, or every one passes."
        quotes:
          - at: "§5.4"
            text: |-
              Based on the validation policy of the verifier, the type of credentials, and the type of securing mechanism, additional validation checks MAY be applied.
        locator: "§5.4, paragraph 5"
        constrained_by:
          - "w3c-vc-jose-cose#R-0085"
        kind: "inferred"
        inferred: true
        inferred_reason: "The success outcome is ours."
        protocol_steps:
          - "validation 10"
      - id: "M05-T11"
        from: "additional-checks"
        to: "considered-invalid"
        trigger: "check_failed"
        guard: >-
          An additional check fails, for example a dependency between credentials or their ordering or
          timing.
        quotes:
          - at: "§5.4"
            text: |-
              For example, dependencies between multiple credentials, ordering or timing information associated with multiple credentials, and/or multiple presentations could cause an otherwise valid credential or presentation to be considered invalid.
        locator: "§5.4, paragraph 5"
        constrained_by:
          - "w3c-vc-jose-cose#R-0085"
        kind: "stated"
        protocol_steps:
          - "validation 10"
    error_states:
      - "considered-invalid"
    terminal_states:
      - "validated"
      - "considered-invalid"
    unspecified:
      - "Any outcome for a failed check in paragraphs 1 to 4; only paragraph 5 names invalidity, as an example."
      - "How considered-invalid is reported: the §5 outputs are already set (gap validation-has-no-output)."
      - "Which claims a typ expects (gap typ-expected-claims-undefined)."
      - "Whether a header parameter listed as critical is exempt from being ignored (tension ignore-versus-crit)."
  - id: "M06"
    name: "key-discovery"
    locator: "§4, §4.1, §4.1.1, §4.1.2, §4.1.3, §4.2, §5"
    actor: "verifier (and a holder that verifies)"
    protocol_flow: "key-discovery-header-hints"
    purpose: >-
      Finding the key before any §5 algorithm runs. The hints are permissive (can, MAY), unordered and
      may coexist; this machine follows one hint per run.
    initial: "key-needed"
    states:
      - name: "key-needed"
        meaning: "A secured object has arrived and its key must be found before verification."
        kind: "stated"
      - name: "reading-hints"
        meaning: >-
          Reading kid, iss and cnf from the JOSE or COSE header or the JWT claims, processing as little
          untrusted data as possible.
        kind: "stated"
      - name: "following-kid"
        meaning: "kid is used as a hint to which key secured the object."
        kind: "stated"
      - name: "following-iss"
        meaning: "iss is used to obtain a JSON Web Key; a kid in the JOSE Header picks the key."
        kind: "stated"
      - name: "identifying-pop-key"
        meaning: "cnf identifies a proof-of-possession key (RFC 7800, RFC 8747)."
        kind: "stated"
      - name: "retrieving-document"
        meaning: >-
          Retrieving the controlled identifier document or DID document that lists the verification
          method.
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source says key material is retrieved from hints and that no standard retrieval exists; it
          describes no retrieval.
      - name: "checking-verification-method"
        meaning: "The verification method must be a JsonWebKey with its key in publicKeyJwk."
        kind: "stated"
      - name: "key-obtained"
        meaning: "A key is available; verification may begin."
        kind: "stated"
        terminal: true
      - name: "key-not-found"
        meaning: "No hint yields a key."
        kind: "inferred"
        inferred: true
        inferred_reason: "The source gives no failure outcome for key discovery."
        error: true
        terminal: true
      - name: "verification-method-unusable"
        meaning: "The verification method is not a JsonWebKey or has no publicKeyJwk."
        kind: "inferred"
        inferred: true
        inferred_reason: "The MUSTs bind the document; no verifier outcome is stated."
        error: true
        terminal: true
    transitions:
      - id: "M06-T01"
        from: "key-needed"
        to: "reading-hints"
        trigger: "JWS Compact Serialization (application/vc+jwt, application/vp+jwt)"
        guard: "always (also for an SD-JWT or a COSE_Sign1)."
        quotes:
          - at: "§5"
            text: |-
              As a general rule, verifiers SHOULD strive to minimize the processing of untrusted data. This includes minimizing any processing of the protected header, unprotected header, or payload as part of the key discovery procedures.
        locator: "§5, paragraph 2"
        constrained_by:
          - "w3c-vc-jose-cose#R-0075"
        kind: "stated"
        protocol_steps:
          - "key-discovery-header-hints 1"
      - id: "M06-T02"
        from: "reading-hints"
        to: "following-kid"
        trigger: "completion"
        guard: "A kid is present (JOSE Header or COSE Header)."
        quotes:
          - at: "§4.1.1"
            text: |-
              If kid is present in the JOSE Header or the COSE Header, a verifier can use this parameter as a hint indicating which key was used to secure the verifiable credential, when performing a verification process as defined in RFC7515.
        locator: "§4.1.1"
        constrained_by:
          - "w3c-vc-jose-cose#R-0065"
        kind: "stated"
        protocol_steps:
          - "key-discovery-header-hints 2"
      - id: "M06-T03"
        from: "reading-hints"
        to: "following-iss"
        trigger: "completion"
        guard: "An iss is present (JOSE Header, JWT claims or COSE Header)."
        quotes:
          - at: "§4.1.2"
            text: |-
              If iss is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier can use this parameter to obtain a JSON Web Key to use in the verification process.
        locator: "§4.1.2"
        constrained_by:
          - "w3c-vc-jose-cose#R-0066"
          - "w3c-vc-jose-cose#R-0067"
        kind: "stated"
        protocol_steps:
          - "key-discovery-header-hints 3"
        note: >-
          The iss MUSTs bind the value (it matches issuer or issuer.id); the source never says the
          verifier compares them, so no mismatch transition is modelled.
      - id: "M06-T04"
        from: "reading-hints"
        to: "identifying-pop-key"
        trigger: "completion"
        guard: "cnf is present and the verifier chooses to use it (MAY)."
        quotes:
          - at: "§4.1.3"
            text: |-
              If cnf is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier MAY use this parameter to identify a proof-of-possession key in the manner described in [RFC7800] or [RFC8747] for use in the verification process.
        locator: "§4.1.3"
        constrained_by:
          - "w3c-vc-jose-cose#R-0068"
        kind: "stated"
        protocol_steps:
          - "key-discovery-header-hints 4"
      - id: "M06-T05"
        from: "reading-hints"
        to: "key-not-found"
        trigger: "key_not_obtained"
        guard: "No kid, iss or cnf is usable and no other key discovery protocol yields a key."
        quotes:
          - at: "§5"
            text: |-
              This specification might be used with many different key discovery protocols. Therefore, discovery of verification keys is described in 4. Key Discovery, and is assumed to have succeeded prior to beginning the verification process.
        locator: "§5, paragraph 1"
        kind: "inferred"
        inferred: true
        inferred_reason: "The source admits other key discovery protocols and states no failure."
        protocol_steps:
          - "key-discovery-header-hints 1"
      - id: "M06-T06"
        from: "following-kid"
        to: "retrieving-document"
        trigger: "completion"
        guard: >-
          kid is an absolute URL to a verification method (required when iss is absent and the issuer or
          holder is identified by a URL).
        quotes:
          - at: "§4.2"
            text: |-
              When iss is absent, and the issuer is identified as a [URL], the kid MUST be an absolute [URL] to a verification method listed in a controlled identifier documents or a DID Document.
        locator: "§4.2"
        constrained_by:
          - "w3c-vc-jose-cose#R-0072"
          - "w3c-vc-jose-cose#R-0074"
          - "w3c-vc-jose-cose#R-0073"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The MUSTs bind the kid; that the verifier dereferences it is the sense of "retrieved based on
          hints", not a stated step.
        protocol_steps:
          - "key-discovery-header-hints 5"
          - "key-discovery-controlled-identifier-document 1"
      - id: "M06-T07"
        from: "following-kid"
        to: "key-obtained"
        trigger: "key_found"
        guard: "kid names a key the verifier already holds or can obtain by another protocol."
        quotes:
          - at: "§4.1.1"
            text: |-
              If kid is present in the JOSE Header or the COSE Header, a verifier can use this parameter as a hint indicating which key was used to secure the verifiable credential, when performing a verification process as defined in RFC7515.
        locator: "§4.1.1"
        kind: "inferred"
        inferred: true
        inferred_reason: "The source says only that kid is a hint."
        protocol_steps:
          - "key-discovery-header-hints 2"
      - id: "M06-T08"
        from: "following-kid"
        to: "key-not-found"
        trigger: "key_not_obtained"
        guard: "kid resolves to no key."
        quotes:
          - at: "§4.1.1"
            text: |-
              kid MUST be present when the key of the issuer or subject is expressed as a DID URL.
        locator: "§4.1.1"
        kind: "inferred"
        inferred: true
        inferred_reason: "No outcome is stated."
        protocol_steps:
          - "key-discovery-header-hints 2"
      - id: "M06-T09"
        from: "following-iss"
        to: "key-obtained"
        trigger: "key_found"
        guard: "A JSON Web Key is obtained; if kid is also in the JOSE Header it picks the specific key."
        quotes:
          - at: "§4.1.2"
            text: |-
              If kid is also present in the JOSE Header, it is used to distinguish the specific key used.
        locator: "§4.1.2"
        kind: "stated"
        protocol_steps:
          - "key-discovery-header-hints 3"
      - id: "M06-T10"
        from: "following-iss"
        to: "key-not-found"
        trigger: "key_not_obtained"
        guard: "iss yields no JSON Web Key."
        quotes:
          - at: "§4.1.2"
            text: |-
              If iss is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier can use this parameter to obtain a JSON Web Key to use in the verification process.
        locator: "§4.1.2"
        kind: "inferred"
        inferred: true
        inferred_reason: "No outcome is stated."
        protocol_steps:
          - "key-discovery-header-hints 3"
      - id: "M06-T11"
        from: "identifying-pop-key"
        to: "key-obtained"
        trigger: "key_found"
        guard: "The proof-of-possession key is identified."
        quotes:
          - at: "§4.1.3"
            text: |-
              If cnf is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier MAY use this parameter to identify a proof-of-possession key in the manner described in [RFC7800] or [RFC8747] for use in the verification process.
        locator: "§4.1.3"
        constrained_by:
          - "w3c-vc-jose-cose#R-0068"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          A cnf key is the holder's key, not the key that secured the credential; the source says it is
          for use in the verification process and no §5 step uses it (gap possession-proof-undefined).
        protocol_steps:
          - "key-discovery-header-hints 4"
          - "key-binding 4"
      - id: "M06-T12"
        from: "retrieving-document"
        to: "checking-verification-method"
        trigger: "completion"
        guard: "The document is retrieved and lists the verification method the kid names."
        quotes:
          - at: "§4.2"
            text: |-
              This key material is retrieved based on hints in the JOSE or COSE message envelopes, such as kid or iss.
        locator: "§4.2"
        kind: "inferred"
        inferred: true
        inferred_reason: "Retrieval itself is undefined by the source."
        protocol_steps:
          - "key-discovery-controlled-identifier-document 2"
      - id: "M06-T13"
        from: "retrieving-document"
        to: "key-not-found"
        trigger: "key_not_obtained"
        guard: "The document cannot be retrieved or does not list the method."
        quotes:
          - at: "§4.2"
            text: |-
              At the time of writing, there is no standard way to retrieve a public key in JWK format from a DID URL or controlled identifier documents.
        locator: "§4.2"
        kind: "inferred"
        inferred: true
        inferred_reason: "No outcome is stated."
        protocol_steps:
          - "key-discovery-controlled-identifier-document 2"
      - id: "M06-T14"
        from: "checking-verification-method"
        to: "key-obtained"
        trigger: "key_found"
        guard: "The method's type is JsonWebKey and its key is in publicKeyJwk."
        quotes:
          - at: "§4.2"
            text: |-
              The value of the type property of the verification method MUST be JsonWebKey.
          - at: "§4.2"
            text: |-
              Verification material MUST be expressed in the publicKeyJwk property of a JsonWebKey.
        locator: "§4.2"
        constrained_by:
          - "w3c-vc-jose-cose#R-0070"
          - "w3c-vc-jose-cose#R-0071"
        kind: "stated"
        protocol_steps:
          - "key-discovery-controlled-identifier-document 3"
          - "key-discovery-controlled-identifier-document 4"
      - id: "M06-T15"
        from: "checking-verification-method"
        to: "verification-method-unusable"
        trigger: "completion"
        guard: "The method's type is not JsonWebKey, or it has no publicKeyJwk."
        quotes:
          - at: "§4.2"
            text: |-
              The value of the type property of the verification method MUST be JsonWebKey.
        locator: "§4.2"
        constrained_by:
          - "w3c-vc-jose-cose#R-0070"
          - "w3c-vc-jose-cose#R-0071"
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The MUSTs bind the document; rejecting it is ours (Example 17 itself lists a JsonWebKey2020
          method).
        protocol_steps:
          - "key-discovery-controlled-identifier-document 3"
    error_states:
      - "key-not-found"
      - "verification-method-unusable"
    terminal_states:
      - "key-obtained"
      - "key-not-found"
      - "verification-method-unusable"
    unspecified:
      - "Which hint is followed when several are present; the source orders none."
      - "What a verifier does when iss does not match issuer, or kid is absent where a DID URL key requires it."
      - "How the obtained key reaches M02 to M04: no algorithm takes it as an input."
      - "Whether the thumbprint embedded in a kid is compared with the key (R-0073 recommends embedding it, nothing says it is checked)."
source_tensions:
  - id: "ST-01"
    protocol_defect: "sd-jwt-presentation-no-algorithm"
    locator: "§5.2"
    quote:
      at: "§5.2"
      text: |-
        inputMediaType: vc+sd-jwt
    note: "vp+sd-jwt matches no input domain, so M01 ends in no-algorithm for it."
    affects:
      - "M01-T08"
      - "M03-T01"
  - id: "ST-02"
    protocol_defect: "vc-or-vp-unchosen"
    locator: "§5.1, §5.3"
    quote:
      at: "§5.1"
      text: |-
        Set mediaType to vc or vp
    note: >-
      The action on the success transition of M02 and M04 cannot be made deterministic from the
      source.
    affects:
      - "M02-T05"
      - "M04-T04"
  - id: "ST-03"
    protocol_defect: "cose-failure-branch-asymmetric"
    locator: "§5.3"
    quote:
      at: "§5.3"
      text: |-
        If processing aborts for any reason:
    note: "M04 has no rejection trigger; M02 and M03 do."
    affects:
      - "M04-T03"
  - id: "ST-04"
    protocol_defect: "alg-none-outside-algorithm"
    locator: "§1.1.2.1"
    quote:
      at: "§1.1.2.1"
      text: |-
        Issuers, Holders, and Verifiers MUST ignore all JWT Claims Sets that have no integrity protection.
    note: >-
      ignored-no-integrity is placed as a state of M02 and M03; it may coincide with the failure
      branch.
    affects:
      - "M02-T07"
      - "M03-T07"
  - id: "ST-05"
