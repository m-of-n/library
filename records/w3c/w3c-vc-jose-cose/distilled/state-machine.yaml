note: >-
  The verifier-side processing of §5 as machines a test harness can drive: M02, M03 and M04 are
  the three algorithms of §5.1, §5.2 and §5.3 exactly as printed (one delegated verification, a
  success branch and a failure branch, each setting the three outputs); M05 is the validation of
  §5.4; M06 is the key discovery of §4 that §5 assumes has succeeded; M01 is the receiving
  lifecycle around them (decryption, choice of algorithm, validation, enveloped content), which
  the source does not describe and which is marked inferred throughout. The source defines no
  issuer or holder lifecycle: securing is a procedure without states or errors and is modelled in
  protocol.yaml (NM-01). A holder that verifies runs the same machines (§5 says the holder or
  verifier).

  Locators. A section sign with the .txt heading number, then a step position or paragraph n,
  which counts blocks as normative.md's ¶n does, as protocol.yaml's do; every paragraph locator
  here is in §5 or §5.4, whose blocks up to the last one cited are all paragraphs, so
  requirements.yaml's count of paragraphs alone gives the same numbers.

  Fields. kind is stated or inferred on every state and transition, as requirements.yaml uses the
  word; inferred: true appears only on inferred ones, with inferred_reason. error: true and
  terminal: true mark error and terminal states, repeated per machine in error_states and
  terminal_states (the model record rfc-8551 wrote kind: error, which this file writes as error:
  true so that kind can carry the basis). A trigger is a messages.yaml entry by its exact name
  (kind message, resolves_to its id) or a named event (kind event, with a definition); completion
  is the UML completion event: the activity of the source state has finished and the guards choose
  the branch. guard, actions and note are this file's wording; each transition's quotes carry the
  source text verbatim, under the same rules as protocol.yaml (one contiguous run of one .txt line
  inside the section named by at, present in the tag-stripped HTML, pinned to the step's line
  where the same words recur). constrained_by lists requirement ids selected by script from
  locator and text. protocol_steps names the protocol.yaml flow steps a transition renders.
  unspecified lists situations the source leaves open; they are not transitions.

  Inference. Inferred transitions per machine, counted by script: M01 19 of 21 (stated: M01-T15,
  M01-T19); M02 1 of 7; M03 1 of 7; M04 0 of 5; M05 9 of 11 (stated: M05-T01, M05-T11); M06 9 of
  15. The inferred ones are, in kind: the dispatch, decryption and enveloped-content transitions
  of M01 and its mapping of the invoked machines' outputs; the ignored-no-integrity transitions of
  M02 and M03; the ordering of the M05 checks and the outcome of each check whose paragraph states
  none; and the resolution and failure transitions of M06. In each case the source states the
  input, the check or the duty, and not the transition. Source tensions are listed under
  source_tensions, each pointing at its protocol.yaml entry, and are not repaired here.
triggers_used:
  - name: "JWS Compact Serialization (application/vc+jwt, application/vp+jwt)"
    kind: "message"
    resolves_to: "MSG-06"
    locator: "§5.1"
    quote:
      at: "§5.1"
      text: |-
        inputDocument: the verifiable credential secured as a JWT [RFC7519]
  - name: "SD-JWT compact (application/vc+sd-jwt, application/vp+sd-jwt)"
    kind: "message"
    resolves_to: "MSG-11"
    locator: "§5.2"
    quote:
      at: "§5.2"
      text: |-
        inputDocument: the verifiable credential secured with [SD-JWT]
  - name: "COSE_Sign1 (application/vc+cose, application/vp+cose)"
    kind: "message"
    resolves_to: "MSG-18"
    locator: "§5.3"
    quote:
      at: "§5.3"
      text: |-
        inputDocument: the verifiable credential or verifiable presentation secured with CBOR Object Signing and Encryption (COSE): Structures and Process
  - name: "Nested JWE (encrypted vc+jwt or vp+jwt)"
    kind: "message"
    resolves_to: "MSG-10"
    locator: "§3.1.1"
    quote:
      at: "§3.1.1"
      text: |-
        To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use JSON Web Encryption (JWE) [RFC7516] by nesting the secured verifiable credential as the plaintext payload of a JWE, per the description of Nested JWTs in [RFC7519].
    note: >-
      Also stands for MSG-17 (encrypted SD-JWT) and MSG-21 (encrypted COSE object) in M01, which
      treats the three alike.
  - name: "Verification algorithm inputs and outputs"
    kind: "message"
    resolves_to: "MSG-26"
    locator: "§5"
    quote:
      at: "§5"
      text: |-
        The outputs for the following algorithms are:
    note: >-
      In M01 the trigger is the arrival of an inputMediaType and inputDocument pair (fields of
      MSG-26).
  - name: "EnvelopedVerifiableCredential"
    kind: "message"
    resolves_to: "MSG-03"
    locator: "§3.1.2"
    quote:
      at: "§3.1.2"
      text: |-
        Verifiable Credentials secured in verifiable presentations MUST use the Enveloped Verifiable Credential type defined by the [VC-DATA-MODEL-2.0].
  - name: "processing_completed"
    kind: "event"
    definition: >-
      The referenced verification (Validating a JWT, the SD-JWT algorithms, COSE_Sign1 verification)
      completes successfully.
    locator: "§5.1, §5.2, §5.3"
    quote:
      at: "§5.1"
      text: |-
        If processing completes successfully:
  - name: "processing_aborted"
    kind: "event"
    definition: "The referenced verification aborts, for any reason."
    locator: "§5.1, §5.2, §5.3"
    quote:
      at: "§5.3"
      text: |-
        If processing aborts for any reason:
  - name: "jwt_rejected"
    kind: "event"
    definition: "Validating a JWT rejects the JWT."
    locator: "§5.1"
    quote:
      at: "§5.1"
      text: |-
        If processing aborts for any reason or the JWT is rejected:
  - name: "sd_jwt_rejected"
    kind: "event"
    definition: "SD-JWT verification rejects the SD-JWT."
    locator: "§5.2"
    quote:
      at: "§5.2"
      text: |-
        If processing aborts for any reason or the SD-JWT is rejected:
  - name: "no_integrity_protection"
    kind: "event"
    definition: >-
      The JWT or issuer-signed JWT is found to carry no integrity protection (the alg none setting of
      §1.1.2.1).
    locator: "§1.1.2.1"
    quote:
      at: "§1.1.2.1"
      text: |-
        Issuers, Holders, and Verifiers MUST ignore all JWT Claims Sets that have no integrity protection.
    inferred: true
    inferred_reason: >-
      The duty to ignore is stated; that it is detected during step 1, and is an event of these
      machines, is this file's placement.
  - name: "algorithm_returned_true"
    kind: "event"
    definition: "An invoked §5.1, §5.2 or §5.3 machine reached its returned state with status true."
    locator: "§5"
    quote:
      at: "§5"
      text: |-
        status: a boolean indicating the result of verification, true for success and false for failure.
    inferred: true
    inferred_reason: "Raised by M01 from the outputs of M02 to M04; the event is ours."
  - name: "algorithm_returned_false"
    kind: "event"
    definition: >-
      An invoked §5.1, §5.2 or §5.3 machine reached its returned state with status false (or its
      ignored state).
    locator: "§5"
    quote:
      at: "§5"
      text: |-
        status: a boolean indicating the result of verification, true for success and false for failure.
    inferred: true
    inferred_reason: "As algorithm_returned_true."
  - name: "validation_performed"
    kind: "event"
    definition: "The verifier performs the §5.4 checks after a successful verification (SHOULD)."
    locator: "§5"
    quote:
      at: "§5"
      text: |-
        After verification has succeeded, additional validation checks SHOULD be performed as described in Section 5.4 Validation
    inferred: true
    inferred_reason: "The SHOULD is stated; the event name is ours."
  - name: "validation_not_performed"
    kind: "event"
    definition: "The verifier, as the SHOULD permits, does not perform §5.4."
    locator: "§5"
    quote:
      at: "§5"
      text: |-
        After verification has succeeded, additional validation checks SHOULD be performed as described in Section 5.4 Validation
    inferred: true
    inferred_reason: "The source does not name the option; it is the converse of the SHOULD."
  - name: "check_failed"
    kind: "event"
    definition: "A §5.4 check finds the credential or presentation wanting."
    locator: "§5.4"
    quote:
      at: "§5.4"
      text: |-
        For example, dependencies between multiple credentials, ordering or timing information associated with multiple credentials, and/or multiple presentations could cause an otherwise valid credential or presentation to be considered invalid.
    inferred: true
    inferred_reason: >-
      The source states this outcome only for the additional checks of paragraph 5; for paragraphs 1
      to 4 it states the check and no outcome.
  - name: "decrypted"
    kind: "event"
    definition: "The nested secured object is recovered from a JWE or an encrypted COSE object."
    locator: "§3.1.1, §3.2.1, §3.3.1"
    quote:
      at: "§3.3.1"
      text: |-
        To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use COSE encryption, as defined in Section 5 of [RFC9052], by nesting the secured verifiable credential as the plaintext payload of an encrypted COSE object.
    inferred: true
    inferred_reason: "The source states only the producing side (MAY encrypt); decryption on receipt is ours."
  - name: "decryption_failed"
    kind: "event"
    definition: "The encrypted object cannot be decrypted."
    locator: "§3.1.1, §3.2.1, §3.3.1"
    quote:
      at: "§3.3.1"
      text: |-
        To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use COSE encryption, as defined in Section 5 of [RFC9052], by nesting the secured verifiable credential as the plaintext payload of an encrypted COSE object.
    inferred: true
    inferred_reason: "As decrypted; the source never mentions the failure."
  - name: "key_found"
    kind: "event"
    definition: "A key is obtained from the hint being followed."
    locator: "§5"
    quote:
      at: "§5"
      text: |-
        This specification might be used with many different key discovery protocols. Therefore, discovery of verification keys is described in 4. Key Discovery, and is assumed to have succeeded prior to beginning the verification process.
    inferred: true
    inferred_reason: "The source assumes success and names no event."
  - name: "key_not_obtained"
    kind: "event"
    definition: >-
      The hint being followed yields no key (nothing resolves, retrieval fails, or nothing matches).
    locator: "§4.2"
    quote:
      at: "§4.2"
      text: |-
        At the time of writing, there is no standard way to retrieve a public key in JWK format from a DID URL or controlled identifier documents.
    inferred: true
    inferred_reason: "The source gives no failure outcome for key discovery."
  - name: "completion"
    kind: "event"
    definition: "UML completion event (see note)."
    locator: "§5"
    quote:
      at: "§5"
      text: |-
        The outputs for the following algorithms are:
    inferred: true
    inferred_reason: "A modelling device, not a source event."
machines:
  - id: "M01"
    name: "verification-dispatch"
    locator: "§5, §5.1, §5.2, §5.3, §3.1.2, §3.2.2, §3.3.2"
    actor: "holder or verifier"
    protocol_flow: "verification-dispatch"
    purpose: >-
      The receiving lifecycle around the three algorithms: optional decryption, choice of algorithm,
      validation, and the enveloped content of a presentation. The source states the input domains,
      the SHOULD to validate and the possibility that validation finds a credential invalid;
      everything else here is marked inferred.
    invokes:
      - "M02 in running-jose"
      - "M03 in running-sd-jwt"
      - "M04 in running-cose"
      - "M05 in validating"
      - "M01 in processing-enveloped, once per enveloped object"
    initial: "object-received"
    states:
      - name: "object-received"
        meaning: "A secured object and its media type have arrived at the holder or verifier."
        kind: "inferred"
        inferred: true
        inferred_reason: "The source states receipt as the start of each algorithm; a common entry state is ours."
      - name: "decrypting"
        meaning: >-
          The object is a JWE or encrypted COSE object; the nested secured object is being recovered.
        kind: "inferred"
        inferred: true
        inferred_reason: "Encryption is a MAY on the producing side; no receiving step is stated."
      - name: "selecting-algorithm"
        meaning: "Choosing §5.1, §5.2 or §5.3 by inputMediaType."
        kind: "inferred"
        inferred: true
        inferred_reason: "The input domains are stated; the choice is not."
      - name: "running-jose"
        meaning: "The §5.1 algorithm runs (M02)."
        kind: "inferred"
        inferred: true
        inferred_reason: "A placeholder for the invoked machine."
        invokes: "M02"
      - name: "running-sd-jwt"
        meaning: "The §5.2 algorithm runs (M03)."
        kind: "inferred"
        inferred: true
        inferred_reason: "A placeholder for the invoked machine."
        invokes: "M03"
      - name: "running-cose"
        meaning: "The §5.3 algorithm runs (M04)."
        kind: "inferred"
        inferred: true
        inferred_reason: "A placeholder for the invoked machine."
        invokes: "M04"
      - name: "verified"
        meaning: "An algorithm returned status true, with document and mediaType."
        kind: "stated"
      - name: "validating"
        meaning: "The §5.4 checks run (M05)."
        kind: "stated"
        invokes: "M05"
      - name: "processing-enveloped"
        meaning: >-
          The verified document is a presentation; each enveloped credential or presentation is decoded
          from its data URL and run through M01 again.
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source requires enveloped credentials to be secured and gives no step that verifies them.
        invokes: "M01, once per enveloped object"
      - name: "validation-complete"
        meaning: "Validation ran and no check reported a failure."
        kind: "inferred"
        inferred: true
        inferred_reason: "The source has no success verdict for validation."
        terminal: true
      - name: "validation-skipped"
        meaning: "Verification succeeded and validation was not performed, as the SHOULD permits."
        kind: "inferred"
        inferred: true
        inferred_reason: "The converse of the SHOULD of §5, paragraph 3."
        terminal: true
      - name: "considered-invalid"
        meaning: "A validation check found the credential or presentation invalid."
        kind: "stated"
        error: true
        terminal: true
      - name: "verification-failed"
        meaning: "An algorithm returned status false, document null, mediaType null."
        kind: "stated"
        error: true
        terminal: true
      - name: "no-algorithm"
        meaning: >-
          No algorithm admits the media type: vp+sd-jwt, or any media type outside the three input
          domains.
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The source gives no outcome; the state records the dead end of defect
          sd-jwt-presentation-no-algorithm.
        error: true
        terminal: true
      - name: "decryption-failed"
        meaning: "The encrypted object could not be decrypted."
        kind: "inferred"
        inferred: true
        inferred_reason: "Never mentioned by the source."
        error: true
        terminal: true
    transitions:
      - id: "M01-T01"
        from: "object-received"
        to: "decrypting"
        trigger: "Nested JWE (encrypted vc+jwt or vp+jwt)"
        guard: >-
          The object is a JWE or an encrypted COSE object nesting a secured credential or presentation.
        quotes:
          - at: "§3.1.1"
            text: |-
              To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use JSON Web Encryption (JWE) [RFC7516] by nesting the secured verifiable credential as the plaintext payload of a JWE, per the description of Nested JWTs in [RFC7519].
        locator: "§3.1.1, §3.2.1, §3.3.1"
        constrained_by:
          - "w3c-vc-jose-cose#R-0016"
          - "w3c-vc-jose-cose#R-0032"
          - "w3c-vc-jose-cose#R-0052"
        kind: "inferred"
        inferred: true
        inferred_reason: "Producing side stated (MAY); receiving side ours."
        protocol_steps:
          - "verification-dispatch 2"
      - id: "M01-T02"
        from: "decrypting"
        to: "selecting-algorithm"
        trigger: "decrypted"
        guard: "always"
        quotes:
          - at: "§3.3.1"
            text: |-
              To encrypt a secured verifiable credential when transmitting over an insecure channel, implementers MAY use COSE encryption, as defined in Section 5 of [RFC9052], by nesting the secured verifiable credential as the plaintext payload of an encrypted COSE object.
        locator: "§3.3.1"
        kind: "inferred"
        inferred: true
        inferred_reason: "As M01-T01."
        protocol_steps:
