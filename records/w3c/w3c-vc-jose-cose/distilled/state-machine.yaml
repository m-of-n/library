        error: true
        terminal: true
      - name: "ignored-no-integrity"
        meaning: "The JWT Claims Set has no integrity protection and is ignored (§1.1.2.1)."
        kind: "inferred"
        inferred: true
        inferred_reason: >-
          The duty to ignore is stated in §1.1.2.1; that it is a state of this algorithm, distinct from
          the failure branch, is ours.
        error: true
        terminal: true
    transitions:
      - id: "M02-T01"
        from: "input-received"
        to: "verifying"
        trigger: "JWS Compact Serialization (application/vc+jwt, application/vp+jwt)"
        guard: "inputMediaType is vc+jwt or vp+jwt."
        quotes:
          - at: "§5.1"
            text: |-
              inputMediaType: vc+jwt or vp+jwt
          - at: "§5.1"
            text: |-
              Follow the algorithm defined in Validating a JWT [RFC7519].
        locator: "§5.1, inputs and step 1; §3.1.1, §3.1.2"
        constrained_by:
          - "w3c-vc-jose-cose#R-0015"
          - "w3c-vc-jose-cose#R-0020"
          - "w3c-vc-jose-cose#R-0025"
