      - "returned-failure"
      - "ignored-no-integrity"
    terminal_states:
      - "returned-success"
      - "returned-failure"
      - "ignored-no-integrity"
    unspecified:
      - "Which key the referenced verification uses: none is an input (§5.1)."
      - "A payload that cannot be decoded at step 2.3: the success branch has already set status to true (§5.1)."
      - "How step 2.2 chooses between vc and vp (§5.1)."
