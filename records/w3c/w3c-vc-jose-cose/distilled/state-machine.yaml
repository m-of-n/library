        locator: "§5.1, steps 3.1 to 3.4"
        kind: "stated"
        protocol_steps:
          - "jose-verification 3.1"
          - "jose-verification 3.2"
          - "jose-verification 3.3"
          - "jose-verification 3.4"
      - id: "M02-T07"
        from: "verifying"
        to: "ignored-no-integrity"
