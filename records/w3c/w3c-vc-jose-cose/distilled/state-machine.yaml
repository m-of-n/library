        guard: "Processing completed successfully."
        quotes:
          - at: "§5.1"
            text: |-
              If processing completes successfully:
        locator: "§5.1, step 2"
        kind: "stated"
        protocol_steps:
          - "jose-verification 2"
      - id: "M02-T03"
        from: "verifying"
        to: "failure-branch"
        trigger: "processing_aborted"
        guard: "Processing aborted, for any reason."
        quotes:
          - at: "§5.1"
            text: |-
              If processing aborts for any reason or the JWT is rejected:
        locator: "§5.1, step 3"
        kind: "stated"
        protocol_steps:
          - "jose-verification 3"
      - id: "M02-T04"
        from: "verifying"
        to: "failure-branch"
        trigger: "jwt_rejected"
        guard: "The input was rejected."
        quotes:
          - at: "§5.1"
            text: |-
              If processing aborts for any reason or the JWT is rejected:
        locator: "§5.1, step 3"
        kind: "stated"
        protocol_steps:
          - "jose-verification 3"
      - id: "M02-T05"
        from: "success-branch"
        to: "returned-success"
        trigger: "completion"
        guard: "always"
        actions:
          - "status := true (step 2.1)"
          - "mediaType := vc or vp, by no stated rule (step 2.2)"
          - "document := the JWS payload, decoded (step 2.3)"
          - "return (step 2.4)"
        quotes:
          - at: "§5.1"
            text: |-
              Set status to true
          - at: "§5.1"
            text: |-
              Set mediaType to vc or vp
          - at: "§5.1"
            text: |-
              Set document to the decoded JWS payload.
          - at: "§5.1"
            text: |-
              Return
        locator: "§5.1, steps 2.1 to 2.4"
        kind: "stated"
        protocol_steps:
          - "jose-verification 2.1"
          - "jose-verification 2.2"
          - "jose-verification 2.3"
          - "jose-verification 2.4"
      - id: "M02-T06"
        from: "failure-branch"
        to: "returned-failure"
        trigger: "completion"
        guard: "always"
        actions:
          - "status := false (step 3.1)"
          - "document := null (step 3.2)"
          - "mediaType := null (step 3.3)"
          - "return (step 3.4)"
        quotes:
          - at: "§5.1"
            text: |-
              Set status to false
          - at: "§5.1"
            text: |-
              Set document to null
          - at: "§5.1"
            text: |-
              Set mediaType to null
          - at: "§5.1"
            text: |-
