      map {1: -35}) a0 (empty map) 59 02 9e (bstr of 670 octets) 7b 22 40 63 ... (the JSON text)
      58 40 (bstr of 64 octets) followed by the signature; 747 octets in all, nothing trailing.
    sample_evidence:
