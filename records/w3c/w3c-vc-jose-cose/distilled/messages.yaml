        four labels; it is elided, so the rest is not shown.
    constrained_by:
      - w3c-vc-jose-cose#R-0062
      - w3c-vc-jose-cose#R-0046
      - w3c-vc-jose-cose#R-0048
      - w3c-vc-jose-cose#R-0049
      - w3c-vc-jose-cose#R-0054
      - w3c-vc-jose-cose#R-0055
      - w3c-vc-jose-cose#R-0064

  - name: CWT Claims header parameter (label 15)
    id: MSG-20
    kind: claims
    locator: "§3.3.3"
    source: "§3.3.3 (lines 783-787); §4.1.2 (lines 805-806); §4.1.3 (lines 811-812); §8.5 Examples 24, 25"
    normative_status: profiled
    defined_by: "RFC 8392 §3 (claims) and I-D.ietf-cose-cwt-claims-in-headers, linked at -10 (the header parameter)"
    encoding: CBOR map keyed by CWT claim keys.
    quotes:
      - at: "§3.3.3"
        text: 'When the iat (Issued At) and/or exp (Expiration Time) CWT claims are present, they represent the issuance and expiration time of the signature, respectively.'
      - at: "§3.3.3"
        text: 'Use of the nbf (Not Before) claim is NOT RECOMMENDED, as it makes little sense to attempt to assign a future date to a signature.'
      - at: "§3.3.3"
        text: 'These include but are not limited to: iss, kid, alg, iat, exp, and cnf.'
    fields:
      - name: iss
        key: 1
        type: CBOR text string (Example 24 shows urn:example:123, unquoted)
        required: false
        level: "if present, MUST match issuer or issuer.id (R-0066, R-0067)"
        description: Key 1 annotated Issuer is printed only in Examples 24 and 25.
        constrained_by:
          - w3c-vc-jose-cose#R-0066
          - w3c-vc-jose-cose#R-0067
          - w3c-vc-jose-cose#R-0072
      - name: sub
        key: 2
        type: CBOR text string (Example 24 shows urn:example:456, unquoted)
        required: false
        description: Key 2 annotated Subject is printed only in Examples 24 and 25; no rule pairs it with credentialSubject for COSE.
      - name: iat
        type: CWT NumericDate (RFC 8392)
        required: false
        set_by: "RFC 8392 (pointer; the key number is not printed in this document)"
        description: The issuance time of the signature.
      - name: exp
        type: CWT NumericDate (RFC 8392)
        required: false
        set_by: "RFC 8392 (pointer; the key number is not printed in this document)"
        description: The expiration time of the signature.
      - name: nbf
        type: CWT NumericDate (RFC 8392)
        required: false
        level: "use NOT RECOMMENDED (R-0063)"
        set_by: "RFC 8392 (pointer; the key number is not printed in this document)"
        constrained_by:
          - w3c-vc-jose-cose#R-0063
      - name: cnf
        type: confirmation map (RFC 8747)
        required: false
        level: "a verifier MAY use it (R-0068); a holder-provided proof-of-possession key is RECOMMENDED (R-0069)"
        set_by: "RFC 8747 (pointer; the key number is not printed in this document)"
        constrained_by:
          - w3c-vc-jose-cose#R-0068
          - w3c-vc-jose-cose#R-0069
      - name: claims not understood
        name_kind: synthetic
        type: any key
        required: false
        level: "MUST be ignored (R-0064)"
        constrained_by:
          - w3c-vc-jose-cose#R-0064
          - w3c-vc-jose-cose#R-0062
    layout: "15: { 1: iss, 2: sub, ... } inside the protected header (Examples 24, 25)."
    notes: >-
      The source never says that the CWT claims in the header and the credential members in the
      payload must agree, beyond the iss rule. vc and vp (R-0006) are JWT claim names and have no
      stated CWT counterpart.
    constrained_by:
      - w3c-vc-jose-cose#R-0063
      - w3c-vc-jose-cose#R-0061
      - w3c-vc-jose-cose#R-0064

