      - at: "§4.2"
        text: 'When using [URL] identifiers, the kid is RECOMMENDED to be an absolute [URL] that includes a JWK Thumbprint URI as defined in [RFC7638].'
      - at: "§4.2"
        text: 'For example: https://vendor.example/issuers/42/keys/urn:ietf:params:oauth:jwk-thumbprint:sha-256:NzbLsXh8uDCcd-6MNwXF4W_7noWXFZAfHkxZsRGC9Xs'
      - at: "§4.2"
        text: 'Example 11: A kid as a controlled identifier document verification method identifier'
    fields:
      - name: DID URL form
        name_kind: synthetic
        type: DID URL
        required: conditional
        required_when: a kid is required whenever the issuer's or subject's key is a DID URL (MUST, R-0065); the source does not say the kid then equals that DID URL.
        constrained_by:
          - w3c-vc-jose-cose#R-0065
      - name: absolute URL to a verification method
        name_kind: synthetic
        type: absolute URL ([URL], WHATWG)
        required: conditional
        required_when: >-
          MUST, where controlled identifier documents are used (§4.2), when iss is absent and the
          issuer is a URL (R-0072; the method sits in a controlled identifier document or a DID
          Document), or when iss is absent and the holder is a URL (R-0074; the method sits in a
          controlled identifier document).
        description: 'Examples 11 and 13: https://university.example/issuers/565049#key-123, the id of Example 15''s verification method.'
        constrained_by:
          - w3c-vc-jose-cose#R-0072
          - w3c-vc-jose-cose#R-0074
      - name: absolute URL including a JWK Thumbprint URI
        name_kind: synthetic
        type: absolute URL ending urn:ietf:params:oauth:jwk-thumbprint:sha-256:<base64url SHA-256 JWK thumbprint>
        required: false
        level: "RECOMMENDED when using URL identifiers (R-0073)"
        description: TEN-23 (the thumbprint printed does not match the key it names in Example 17).
        constrained_by:
          - w3c-vc-jose-cose#R-0073
    layout: "https://<controller path>#<fragment> | https://<path>/keys/urn:ietf:params:oauth:jwk-thumbprint:sha-256:<thumbprint>"
    constrained_by:
      - w3c-vc-jose-cose#R-0072
      - w3c-vc-jose-cose#R-0073
      - w3c-vc-jose-cose#R-0065
      - w3c-vc-jose-cose#R-0074

  # ======================= Algorithms (§5) =======================

  - name: Verification algorithm inputs and outputs
    id: MSG-26
    kind: algorithm-interface
    locator: "§5"
    source: "§5 (lines 856-862); §5.1 (lines 866-880); §5.2 (lines 884-898); §5.3 (lines 902-916); §5.4 (lines 920-924)"
    normative_status: defined
    encoding: abstract values; no serialization is defined.
    quotes:
      - at: "§5"
        text: 'The outputs for the following algorithms are:'
      - at: "§5"
        text: 'status: a boolean indicating the result of verification, true for success and false for failure.'
      - at: "§5"
        text: 'document: a document conforming to the [VC-DATA-MODEL-2.0]'
      - at: "§5"
        text: 'mediaType: vc or vp'
      - at: "§5"
        text: 'After verification has succeeded, additional validation checks SHOULD be performed as described in Section 5.4 Validation'
    fields:
      - name: inputMediaType
        type: media type token
        required: true
        values:
          - value: vc+jwt or vp+jwt
            when: "§5.1"
          - value: vc+sd-jwt
            when: "§5.2 (TEN-10)"
          - value: vc+cose or vp+cose
            when: "§5.3"
        quotes:
          - at: "§5.1"
            text: 'inputMediaType: vc+jwt or vp+jwt'
          - at: "§5.2"
            text: 'inputMediaType: vc+sd-jwt'
          - at: "§5.3"
            text: 'inputMediaType: vc+cose or vp+cose'
      - name: inputDocument
        type: the secured form (MSG-06, MSG-11 or MSG-18)
        required: true
        quotes:
          - at: "§5.1"
            text: 'inputDocument: the verifiable credential secured as a JWT [RFC7519]'
          - at: "§5.2"
            text: 'inputDocument: the verifiable credential secured with [SD-JWT]'
          - at: "§5.3"
            text: 'inputDocument: the verifiable credential or verifiable presentation secured with CBOR Object Signing and Encryption (COSE): Structures and Process'
      - name: status
        type: boolean
        required: true
        description: true on success; false when processing aborts or the JWT or SD-JWT is rejected.
        constrained_by:
          - w3c-vc-jose-cose#R-0076
      - name: document
        type: the decoded payload (MSG-01 or MSG-02), or null on failure
        required: true
        quotes:
          - at: "§5.1"
            text: 'Set document to the decoded JWS payload.'
          - at: "§5.3"
            text: 'Set document to the decoded COSE_Sign1 payload.'
        level: "MUST (R-0080): well-formed compact JSON-LD"
        constrained_by:
          - w3c-vc-jose-cose#R-0080
          - w3c-vc-jose-cose#R-0077
          - w3c-vc-jose-cose#R-0078
          - w3c-vc-jose-cose#R-0079
          - w3c-vc-jose-cose#R-0081
          - w3c-vc-jose-cose#R-0082
          - w3c-vc-jose-cose#R-0083
          - w3c-vc-jose-cose#R-0084
          - w3c-vc-jose-cose#R-0085
      - name: mediaType
        type: vc or vp, or null on failure
        required: true
        description: TEN-11 (no rule chooses vc or vp).
    layout: "verify(inputMediaType, inputDocument) -> { status, document, mediaType }"
    constrained_by:
      - w3c-vc-jose-cose#R-0076
      - w3c-vc-jose-cose#R-0075
      - w3c-vc-jose-cose#R-0080
      - w3c-vc-jose-cose#R-0085

