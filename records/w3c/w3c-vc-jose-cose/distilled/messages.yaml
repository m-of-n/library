      inferred_reason: >-
        Decoded from the HTML cose-text elements and Example 23's data URL: 7 COSE_Sign1 objects of
        747, 3433, 2256, 713, 561, 756 and 3439 octets (Examples 7, 8, 9, 18, 19, 20, 23), every one
        d2 84 44 a1 01 38 22 a0 59 <2-octet length> <JSON> 58 40 <64 octets>, consumed exactly.
