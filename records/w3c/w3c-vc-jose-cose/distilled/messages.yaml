  - name: COSE header parameters (protected and unprotected buckets)
    id: MSG-19
    kind: header
    locator: "§3.3.1"
    source: "§3.3.1 (line 628); §3.3.2 (line 710); §3.3.3 (lines 783-787); §4.1.1 (line 800); §4.1.2 (line 805); §4.1.3 (line 811); §8.5 Examples 24, 25 (lines 1809-1831)"
    normative_status: profiled
    defined_by: "RFC 9052 §3 and §3.1 (the link targets of COSE Header and Common COSE Header Parameters)"
    encoding: CBOR map with integer labels; the protected one is wrapped in a bstr (MSG-18).
    quotes:
      - at: "§3.3.1"
        text: 'See Common COSE Header Parameters for additional details.'
      - at: "§3.3.3"
        text: 'The normative statements in Header Parameters, Claims, and CBOR Web Token (CWT) Claims in COSE Headers apply to securing credentials and presentations.'
      - at: "§3.3.3"
        text: 'It is RECOMMENDED to use the IANA CBOR Web Token Claims registry and the IANA COSE Header Parameters registry to identify any claims and header parameters that might be confused with members defined by [VC-DATA-MODEL-2.0].'
      - at: "§8.5"
        text: 'Example 24: A COSE Sign 1 Protected Header for a Verifiable Credential'
    fields:
      - name: alg
        label: 1
        type: CBOR int (in the examples)
        required: not-stated
        set_by: RFC 9052 §3.1 (pointer)
        description: >-
          The source never names label 1 in prose; Example 24 shows 1: -35 annotated Algorithm.
          Every encoded example has 1: -35 and nothing else (TEN-13, TEN-21).
        inferred: true
        inferred_reason: the label number is printed only in the §8.5 notation; values decoded from the HTML.
      - name: content type
        label: 3
        type: text string (a media type) in the examples
        required: false
        level: "SHOULD be application/vc (R-0049) or application/vp (R-0055); the next sentence calls it optional"
        values:
          - value: application/vc
            when: a credential (§3.3.1)
          - value: application/vp
            when: a presentation (§3.3.2)
          - value: a more specific media type
            when: one is available (no example)
        quotes:
          - at: "§3.3.1"
            text: 'The content type (3) header parameter SHOULD be application/vc.'
          - at: "§3.3.1"
            text: 'The content type (3) header parameter is optional, and can be used to express a more specific media type than application/vc when one is available.'
          - at: "§3.3.2"
            text: 'The content type (3) header parameter SHOULD be application/vp.'
          - at: "§3.3.2"
            text: 'The content type (3) header parameter is optional, and can be used to express a more specific media type than application/vp when one is available.'
        notes: >-
          TEN-26. Bucket not stated; Examples 24 and 25 put it in the protected header. Absent from
          every encoded example.
        constrained_by:
          - w3c-vc-jose-cose#R-0049
          - w3c-vc-jose-cose#R-0055
          - w3c-vc-jose-cose#R-0046
      - name: kid
        label: 4
        type: CBOR bstr in Example 24 (h'177f12cb...1933d554', elided)
        required: conditional
        required_when: as MSG-07 kid (R-0065, R-0072, R-0073, R-0074).
        set_by: RFC 9052 §3.1 (pointer)
        quotes:
          - at: "§4.1.1"
            text: 'If kid is present in the JOSE Header or the COSE Header, a verifier can use this parameter as a hint indicating which key was used to secure the verifiable credential, when performing a verification process as defined in RFC7515.'
        description: >-
          R-0072 and R-0074 require, and R-0073 recommends, an absolute-URL kid in their conditions
          (§4.2, where controlled identifier documents are used), which the bstr of Example 24 is
          not shown to be; the source does not say how a URL kid is carried in COSE. No encoded example has a
          kid (TEN-22). Label 4 is printed only in Example 24.
        constrained_by:
          - w3c-vc-jose-cose#R-0065
          - w3c-vc-jose-cose#R-0072
          - w3c-vc-jose-cose#R-0073
          - w3c-vc-jose-cose#R-0074
      - name: CWT Claims
        label: 15
        type: CBOR map of CWT claims (MSG-20)
        required: false
        level: "MAY (R-0061)"
        quotes:
          - at: "§3.3.3"
            text: 'CBOR Web Token (CWT) [RFC8392] Claims MAY be included in a COSE header parameter, as specified in I-D.ietf-cose-cwt-claims-in-headers.'
        description: Label 15 is printed only in Examples 24 and 25 (annotated CWT Claims).
        constrained_by:
          - w3c-vc-jose-cose#R-0061
      - name: typ
        label: 16
        type: text string (a media type) per the values stated
        required: false
        level: "SHOULD be application/vc+cose (R-0048) or application/vp+cose (R-0054)"
        values:
          - value: application/vc+cose
            when: a credential (§3.3.1)
          - value: application/vp+cose
            when: a presentation (§3.3.2)
        set_by: "RFC 9596 §2 (the link target of COSE typ (type) Header Parameter)"
        quotes:
          - at: "§3.3.1"
            text: 'The typ (16) header parameter, as described in COSE "typ" (type) Header Parameter, SHOULD be application/vc+cose.'
          - at: "§3.3.2"
            text: 'The typ (16) header parameter, as described in COSE "typ" (type) Header Parameter, SHOULD be application/vp+cose.'
          - at: "Appendix A"
            text: 'Use COSE "typ" (type) Header Parameter.'
        notes: Bucket not stated. No example carries it, encoded or in notation (TEN-13).
        constrained_by:
          - w3c-vc-jose-cose#R-0048
          - w3c-vc-jose-cose#R-0054
          - w3c-vc-jose-cose#R-0046
          - w3c-vc-jose-cose#R-0008
      - name: iss and cnf in the COSE Header
        name_kind: synthetic
        type: CWT claims (MSG-20)
        required: false
        quotes:
          - at: "§4.1.3"
            text: 'If cnf is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier MAY use this parameter to identify a proof-of-possession key in the manner described in [RFC7800] or [RFC8747] for use in the verification process.'
        description: >-
          §4.1.2 and §4.1.3 speak of iss and cnf present in the COSE Header; the only place a claim
          enters a COSE header in this document is the CWT Claims parameter (label 15).
        constrained_by:
          - w3c-vc-jose-cose#R-0068
          - w3c-vc-jose-cose#R-0066
          - w3c-vc-jose-cose#R-0067
      - name: other header parameters
        name_kind: synthetic
        type: any label
        required: false
        level: "MUST be ignored if not understood (R-0064)"
        quotes:
          - at: "§3.3.3"
            text: 'Additional members may be present as header parameters and claims. If they are not understood, they MUST be ignored.'
        constrained_by:
          - w3c-vc-jose-cose#R-0064
          - w3c-vc-jose-cose#R-0062
    layout: "{ 1: alg, [3: content type], [4: kid], [15: { CWT claims }], [16: typ] } in the protected bucket (Examples 24, 25); bucket placement is not stated."
    sample_evidence:
      inferred: true
      inferred_reason: >-
        Every encoded protected header is the 4-octet a1 01 38 22 ({1: -35}) and every unprotected
        header a0 ({}). Example 26's protected header hex begins a4 01 38 22 (a map of four entries
