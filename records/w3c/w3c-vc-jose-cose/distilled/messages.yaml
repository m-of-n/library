# ---------------------------------------------------------------------------
applicability: >-
  This document defines no wire structure of its own. Every envelope it uses is defined elsewhere
  and profiled here: the JWS Compact Serialization and the JOSE Header (RFC 7515), the JWT Claims
  Set (RFC 7519), JWE (RFC 7516), SD-JWT with its disclosures and Key Binding JWT (the IETF draft
  [SD-JWT], cited without a draft number), COSE_Sign1 and the COSE header buckets (RFC 9052), the
  COSE typ header parameter (RFC 9596), CWT claims in a COSE header (RFC 8392 and the draft
  I-D.ietf-cose-cwt-claims-in-headers, linked at version -10), the data URL (RFC 2397), the JWK
  (RFC 7517), the JWK Thumbprint (RFC 7638), the controlled identifier document and verification
  method (Controlled Identifiers v1.0), and the verifiable credential, verifiable presentation,
  EnvelopedVerifiableCredential and EnvelopedVerifiablePresentation (VC Data Model v2.0). What the
  document itself fixes is the profile: the unsecured credential or presentation is the payload,
  unencoded; which serializations an implementation supports; the typ and cty (JOSE) and typ (16)
  and content type (3) (COSE) values; that vc and vp never appear as claim names; that a present
  iss matches the credential's issuer; when kid is present and what it points at; that a COSE
  credential inside a presentation is a base64 data URL; that a verification method is a
  JsonWebKey carrying publicKeyJwk; the inputs and outputs of the three verification algorithms;
  and six media type registrations. The source ships no CDDL, JSON Schema or ABNF. The only
  byte-level material it prints is in its examples: base64url JWS and SD-JWT strings, the hex of
  six COSE_Sign1 objects, one base64 data URL holding a seventh, and CBOR diagnostic notation in
  §8.5. Everything this file says about bytes comes from decoding those examples in the
  scratchpad and is marked inferred. Out of scope because the source does not define them: the
  members of the credential and presentation data model beyond the ones this document names
  (w3c-vc-data-model-2-0), the internals of JWS, JWE, SD-JWT and COSE processing, algorithm
  identifiers and their key formats (RFC 7518, RFC 9053), and the CWT claim key assignments
  (rfc-8392).

# ---------------------------------------------------------------------------
note: >-
  Conventions. (1) Every quotes item is {at, text}. text is a verbatim, contiguous substring of
  the .txt rendering, where each HTML block element is one line with its whitespace collapsed; no
  quote crosses a line, and nothing inside a quote is altered, the source's spellings and typos
  included. at is the section whose line span contains the quote, written as requirements.yaml
  writes locators (§3.1.1, §8.5, Appendix A). Every quote was checked mechanically against the
  .txt, against its at section, and against the tag-stripped HTML. (2) Text outside quotes
  (description, notes, layout, constraints, required_when) is this file's own wording and
  contains no quotation; bare protocol tokens in values (header parameter names, claim names,
  media types, label numbers, registration cell values) are copied from the source as tokens.
  (3) inferred: true marks anything not literally stated in the source, with inferred_reason.
  Three kinds occur: a value decoded from an HTML example in the scratchpad (never from the
  .txt, whose inline-span boundaries insert a space before each period of a compact JWS and
  each tilde of a compact SD-JWT); a
  digest or thumbprint computed from an example; and a pointer to the specification that defines
  a component this document names without defining. (4) required is true, false, conditional or
  not-stated, for what THIS document says. level gives the BCP 14 keyword exactly as the source
  states it, with the requirement id, or says none is stated. set_by names the external
  specification that defines the component when this document does not; no level is imported
  from it. (5) constrained_by lists w3c-vc-jose-cose#R-NNNN ids from distilled/requirements.yaml
  whose text binds the field or the entry; where a quote in the same node carries a cited
  requirement's text, those ids come first, and the rest bind the field through what their text
  names. constrained_by_locators lists binding or keyword-bearing
  sentences that have no requirement id, chiefly the keywords of §3.1.3, which the source marks
  non-normative (TEN-05). A message-level constrained_by binds the structure as a whole.
  (6) normative_status: profiled (defined elsewhere and constrained here); referenced (named and
  delegated, nothing constrained); defined (an interface this document defines itself, §5);
  registration (§6). (7) layout gives the
  structural nesting and, where the examples show one, the octet layout; CBOR heads are given in
  hex. (8) sample_evidence summarises what the decoded examples carry, with the method; the
  examples are non-normative (§1.1), so a disagreement between an example and a requirement is
  recorded as a source tension, never as a rule. (9) name_kind: synthetic marks a field whose
  name labels a part, a segment or a value and is not a JSON member name, a header parameter
  name, a claim name or a COSE label. (10) Example N refers to the source's own numbering
  (Example 1 to Example 26). Coverage of requirements.yaml is stated in coverage below.

# ---------------------------------------------------------------------------
# Encoding rules that apply across structures. Each is cited by the entries it binds.
encoding_rules:
  - id: ENC-01
    rule: the payload is the unsecured document, unencoded
    locator: "§3.1.1"
    quotes:
      - at: "§3.1.1"
        text: 'The unsecured verifiable credential is the unencoded JWS payload.'
      - at: "§3.1.2"
        text: 'The unsecured verifiable presentation is the unencoded JWS payload.'
      - at: "§3.2.2"
        text: 'The unsecured verifiable presentation is the unencoded [SD-JWT] payload.'
      - at: "§3.3.1"
        text: 'The unsecured verifiable credential is the unencoded COSE_Sign1 payload.'
      - at: "§3.3.2"
        text: 'The unsecured verifiable presentation is the unencoded COSE_Sign1 payload.'
      - at: "§3"
        text: 'A benefit to this approach is that payloads can be made to conform directly to [VC-DATA-MODEL-2.0] without any mappings or transformation, while at the same time supporting registered header parameters and claims that are understood in the context of JOSE, SD-JWT, and COSE.'
    description: >-
      The signed bytes are the document's own JSON. The source never states a character encoding,
      a serialization form or a canonicalization for those bytes (the words canonical and UTF-8
      do not occur in the .txt). SD-JWT is the exception: the credential is converted into an
      SD-JWT payload (§3.2.1, MSG-13), and §5.2 reverses the conversion.
    inferred_observation:
      inferred: true
      inferred_reason: >-
        Decoded from the HTML: all 12 top-level JWS and COSE_Sign1 payloads of Examples 1 to 3, 7
        to 9 and 18 to 20 are JSON text with no insignificant whitespace (each equals a compact
        re-serialization of itself), and in 3 of 3 credential pairs (Example 1 with Example 7,
        and the jose and cose tabs of Examples 18 and 19) the JWS payload and the COSE_Sign1
        payload are the same octets.
  - id: ENC-02
    rule: the JOSE Header is JSON, not JSON-LD
    locator: "§3.1.3"
    quotes:
      - at: "§3.1.3"
        text: 'The unencoded JOSE Header is JSON (application/json), not JSON-LD (application/ld+json).'
    description: >-
      Stated in a section marked non-normative (TEN-05). It applies to the JWS header (MSG-07),
      the SD-JWT issuer-signed JWT header (MSG-12) and the KB-JWT header (MSG-15).
  - id: ENC-03
    rule: JWS serializations
    locator: "§3.1.2"
    quotes:
      - at: "§3.1.2"
        text: 'Implementations MUST support the JWS compact serialization. Use of the JWS JSON serialization is NOT RECOMMENDED.'
      - at: "§6.1.1"
        text: "binary; application/jwt values are a series of base64url-encoded values (some of which may be the empty string) separated by period ('.')."
    description: >-
      The compact serialization (MSG-06) is mandatory to support and the JSON serialization
      (MSG-09) is NOT RECOMMENDED. The paragraph sits at the end of §3.1.2, after Example 3, and
      names no media type, so it reads as binding both vc+jwt and vp+jwt.
    constrained_by:
      - w3c-vc-jose-cose#R-0025
      - w3c-vc-jose-cose#R-0026
  - id: ENC-04
    rule: SD-JWT serializations
    locator: "§3.2.2"
    quotes:
      - at: "§3.2.2"
        text: 'Implementations MUST support the compact serialization (application/sd-jwt) and MAY support the JSON serialization (application/sd-jwt+json). If the JSON serialization is used, it is RECOMMENDED that a profile be defined to ensure any additional JSON members are understood consistently.'
      - at: "§6.1.3"
        text: "binary; application/sd-jwt values are a series of base64url-encoded values (some of which may be the empty string) separated by period ('.') and tilde ('~') characters."
    description: >-
      Compact (MSG-11) is mandatory to support; the JSON serialization (MSG-16) is optional and,
      when used, a profile is RECOMMENDED. Like ENC-03, the paragraph closes §3.2.2 and names no
      media type.
    constrained_by:
      - w3c-vc-jose-cose#R-0042
      - w3c-vc-jose-cose#R-0043
      - w3c-vc-jose-cose#R-0044
  - id: ENC-05
    rule: COSE is exchanged in binary CBOR
    locator: "§8.5"
    quotes:
      - at: "§3.3"
        text: 'COSE [RFC9052] is a common approach to encoding and securing information using CBOR [RFC8949].'
      - at: "§6.1.5"
        text: 'binary (CBOR)'
      - at: "§8.5"
        text: 'These examples rely on CBOR Diagnostic Notation. Remember that all actual interchange always happens in the binary format.'
    description: >-
      The source states no deterministic-encoding rule, no CBOR tag requirement and no rule on
      definite or indefinite lengths. The encoded examples use definite lengths throughout and
      begin with tag 18 (MSG-18).
  - id: ENC-06
    rule: data URLs carrying a secured credential or presentation
    locator: "§3.3.1"
    quotes:
      - at: "§3.3.1"
        text: 'When including verifiable credentials secured with COSE in verifiable presentations as Enveloped Verifiable Credentials, the credentials MUST be encoded using base64 as specified in [RFC2397].'
    description: >-
      Only the COSE case has a rule: base64, per RFC 2397. For JWS and SD-JWT strings the source
      states nothing; its examples write the compact serialization directly after the comma, with
      no ;base64 parameter and no percent-encoding (MSG-05). §8.4 Data URIs holds three examples
      and no prose.
    constrained_by:
      - w3c-vc-jose-cose#R-0051
  - id: ENC-07
    rule: type indicator values by format
    locator: "§3.1.1"
    table:
      - format: vc+jwt
        header: "JOSE typ / cty"
        typ: vc+jwt
        typ_level: "SHOULD (R-0013)"
        content_type: vc
        content_type_level: "When present, SHOULD (R-0014)"
      - format: vp+jwt
        header: "JOSE typ / cty"
        typ: vp+jwt
        typ_level: "SHOULD (R-0018)"
        content_type: vp
        content_type_level: "When present, SHOULD (R-0019)"
      - format: vc+sd-jwt
        header: "JOSE typ / cty of the issuer-signed JWT"
        typ: vc+sd-jwt
        typ_level: "SHOULD (R-0028)"
        content_type: vc
        content_type_level: "When present, SHOULD (R-0029)"
      - format: vp+sd-jwt
        header: "JOSE typ / cty of the issuer-signed JWT"
        typ: vp+sd-jwt
        typ_level: "SHOULD (R-0034)"
        content_type: vp
        content_type_level: "When present, SHOULD (R-0035)"
      - format: vc+cose
        header: "COSE typ (16) / content type (3)"
        typ: application/vc+cose
        typ_level: "SHOULD (R-0048)"
        content_type: application/vc
        content_type_level: "SHOULD (R-0049), stated without a presence condition; the next sentence calls the parameter optional"
      - format: vp+cose
        header: "COSE typ (16) / content type (3)"
        typ: application/vp+cose
        typ_level: "SHOULD (R-0054)"
        content_type: application/vp
        content_type_level: "SHOULD (R-0055), as for vc+cose"
    description: >-
      The JOSE values omit the application/ prefix and the COSE values carry it. §5 names the
      input media types in the short form (vc+jwt, vc+sd-jwt, vc+cose). No §5 verification step
      reads typ, cty, typ (16) or content type (3); §5.4 requires the claims expected for the typ
      to be present (R-0077). No example carries a registered typ value (TEN-13).
    constrained_by:
      - w3c-vc-jose-cose#R-0013
      - w3c-vc-jose-cose#R-0014
      - w3c-vc-jose-cose#R-0018
      - w3c-vc-jose-cose#R-0019
      - w3c-vc-jose-cose#R-0028
      - w3c-vc-jose-cose#R-0029
      - w3c-vc-jose-cose#R-0034
      - w3c-vc-jose-cose#R-0035
      - w3c-vc-jose-cose#R-0048
      - w3c-vc-jose-cose#R-0049
      - w3c-vc-jose-cose#R-0054
      - w3c-vc-jose-cose#R-0055
  - id: ENC-08
    rule: registered members and members not understood
    locator: "§3.3.3"
    quotes:
      - at: "§3.3.3"
        text: 'When present in the COSE Header or as CWT Claims, members registered in the IANA CBOR Web Token (CWT) Claims registry or the IANA COSE Header Parameters registry are to be interpreted as defined by the specifications referenced in those registries.'
      - at: "§3.3.3"
        text: 'Additional members may be present as header parameters and claims. If they are not understood, they MUST be ignored.'
      - at: "§3.1.3"
        text: 'When present in the JOSE Header or the JWT Claims Set, members registered in the IANA JSON Web Token Claims registry or the IANA JSON Web Signature and Encryption Header Parameters registry are to be interpreted as defined by the specifications referenced in the registries.'
      - at: "§5.4"
        text: 'All claims that are not understood MUST be ignored.'
    description: >-
      For COSE header parameters and CWT claims the rule is normative (R-0064). For the JOSE
      header and the JWT claims the identical sentence stands in §3.1.3, which the source marks
      non-normative, so only §5.4 binds, and only claims (R-0079). The source never names the
      JOSE crit header parameter or the COSE crit (2) label, whose definitions in RFC 7515 and
      RFC 9052 turn on whether a listed parameter is understood (pointer).
    constrained_by:
      - w3c-vc-jose-cose#R-0064
      - w3c-vc-jose-cose#R-0079
      - w3c-vc-jose-cose#R-0062
    constrained_by_locators:
      - "§3.1.3 (lines 362, 370; section marked non-normative, no requirement id)"

# ---------------------------------------------------------------------------
# Source defects and tensions found while extracting the structures. Never repaired here.
source_tensions:
  - id: TEN-01
    where: "§1.1.2.2"
    quotes:
      - at: "§1.1.2.2"
        text: 'These are base64url-encoded JSON arrays containing the digest of the disclosed claim, the claim name, and the claim value.'
    what: >-
      The source puts a digest inside each disclosure. Decoded, every disclosure in the document
      is a three-element array of salt, claim name and claim value; none holds a digest. The
      digest is computed over the disclosure string and sits in an _sd array of the payload. See
      MSG-14.
    inferred: true
    inferred_reason: >-
      62 of 62 disclosures decoded from the HTML (35 in the six SD-JWT compact blocks of Examples
      4, 5, 6, 18, 19 and 20, and 27 in the five distinct SD-JWTs nested in data URLs); for all 35
      compact-block disclosures the base64url SHA-256 of the disclosure string equals the SHA-256
      Hash the HTML prints beside it and occurs in an _sd array of the payload, and the same digest
      test holds for the 27 nested ones.
  - id: TEN-02
    where: "§1.1.2.2, §6.1.3, §6.1.4"
    quotes:
      - at: "§1.1.2.2"
        text: 'An SD-JWT consists of three main parts: the SD-JWT itself, optional disclosures, and an optional KB-JWT (Key Binding JWT).'
      - at: "§6.1.3"
        text: 'This specification registers the application/vc+sd-jwt Media Type specifically for identifying a Selective Disclosure for JWTs (SD-JWT) with a payload conforming to the Verifiable Credential Data Model.'
    what: >-
      The name SD-JWT is used both for the whole tilde-separated string, which the registrations
      identify, and for its first part. This file calls the first part the issuer-signed JWT
      (MSG-12, MSG-13); that label is not the source's.
  - id: TEN-03
    where: "§1.1.2.2, Example 22"
    what: >-
      §1.1.2.2 requires (in lowercase) a trailing tilde when the KB-JWT is absent, so a string with
      a KB-JWT ends with the KB-JWT. Example 22's string has a KB-JWT as its sixth tilde-separated
      part and a seventh, empty part after it, so it ends with a tilde after the KB-JWT; a parser
      following the stated rule reads the KB-JWT as a disclosure and finds no key binding.
    inferred: true
    inferred_reason: split on tilde in the scratchpad from the HTML of Example 22 (line 1800 of the .txt).
  - id: TEN-04
    where: "§3.1.2, §3.2.2"
    quotes:
      - at: "§3.1.2"
        text: 'The content type header parameter is optional, and can be used to express a more specific media type than application/vc when one is available.'
      - at: "§3.3.2"
        text: 'The content type (3) header parameter is optional, and can be used to express a more specific media type than application/vp when one is available.'
    what: >-
      The vp+jwt and vp+sd-jwt sections repeat the credential wording, application/vc, in their
      sentence on the optional content type; the vp+cose sentence says application/vp, and the
      two JOSE sections themselves set cty to vp (R-0019, R-0035).
  - id: TEN-05
    where: "§3.1.3, §3.3.3"
    quotes:
      - at: "§3.1.3"
        text: 'This section is non-normative.'
    what: >-
      §3.1.3 (JOSE Header Parameters and JWT Claims) is marked non-normative (the HTML gives it
      class appendix informative), yet it carries six keywords: RECOMMENDED (line 365), NOT
      RECOMMENDED (366), SHOULD and SHOULD NOT (368), MUST NOT (369) and MUST (370). Its COSE twin
      §3.3.3 is not marked and carries the registry, nbf and ignore sentences, which bind there
      (R-0062, R-0063, R-0064); it has no counterpart of the line 368 or 369 sentences. So for
      JOSE the registry advice, the nbf advice, the ignore rule for header parameters and the iss
      and issuer advice are non-normative. The vc and vp MUST NOT binds through §1.1.2.1 (R-0006),
      and §5.4 binds the ignore rule for claims (R-0079). Entries cite the §3.1.3 sentences under
      constrained_by_locators.
  - id: TEN-06
    where: "§3.1.3"
    what: >-
      The SHOULD NOT sentence speaks of JWK claim iss. iss is a JWT claim (the link target of JWT
      Claims in §4.1.2 is RFC 7519 §4.1.1); a JWK has no iss member.
  - id: TEN-07
    where: "§3.2.1, §3.2.2, §1.1.1"
    what: >-
      The SD-JWT verifier MUST statements (R-0030, R-0036) speak of verifying conforming JWS
      documents, where §1.1.1 defines conforming SD-JWT documents; §3.2.1 opens by saying it
      details how to use JOSE.
  - id: TEN-08
    where: "§3.2.1, §3.2.2, §5.2"
    quotes:
      - at: "§3.2.1"
        text: 'The unsecured verifiable credential is the input JWT Claims Set.'
      - at: "§3.2.2"
        text: 'The unsecured verifiable presentation is the unencoded [SD-JWT] payload.'
      - at: "§5.2"
        text: 'Convert the SD-JWT payload back into the JWT Claims Set by reversing the process in [SD-JWT].'
    what: >-
      A credential is converted into an SD-JWT payload by the issuer; a presentation is the
      payload as it stands, with no conversion stated. §5.2 reverses a conversion and returns the
      result. Whether a vp+sd-jwt payload is converted is therefore stated one way in §3.2.2 and
      the other in §5.2.
  - id: TEN-09
    where: "§1.1.2, §3.3.1, §3.3.2"
    quotes:
      - at: "§1.1.2"
        text: 'When using COSE, the Verifiable Credential or Presentation is encoded as a CBOR data structure.'
      - at: "§3.3.1"
        text: 'The unsecured verifiable credential is the unencoded COSE_Sign1 payload.'
    what: >-
      §1.1.2 makes the document CBOR under COSE; §3.3.1 and §3.3.2 make it the payload as it
      stands, and every encoded COSE example carries the document's JSON text as the payload byte
      string. MSG-18 follows §3.3.1 and the examples.
    inferred: true
    inferred_reason: >-
      7 of 7 COSE_Sign1 objects decoded from the HTML (Examples 7, 8, 9, 18, 19, 20 and the base64
      data URL of Example 23) have a payload byte string whose first octet is 7b; in 3 of 3
      credential pairs the COSE payload equals the JWS payload octet for octet (ENC-01).
  - id: TEN-10
    where: "§5.2"
    what: >-
      The heading and the receipt sentence cover a credential or presentation, but the only input
      media type is vc+sd-jwt, the input document is a verifiable credential, and mediaType is set
      to vc. No algorithm accepts vp+sd-jwt (MSG-26).
  - id: TEN-11
    where: "§5, §5.1, §5.3"
    quotes:
      - at: "§5.1"
        text: 'inputDocument: the verifiable credential secured as a JWT [RFC7519]'
      - at: "§5.1"
        text: 'Set mediaType to vc or vp'
    what: >-
      §5.1 and §5.3 set mediaType to one of two values without saying how the choice is made, and
      §5.1 names only a credential as its input document although its input media types include
      vp+jwt. No step reads typ or cty to make the choice.
  - id: TEN-12
    where: "§5.4"
    quotes:
      - at: "§5.4"
        text: 'All claims expected for the typ MUST be present.'
    what: >-
      R-0077 keys a presence check on typ, but no section says which claims are expected for
      vc+jwt, vp+jwt, vc+sd-jwt, vp+sd-jwt, vc+cose or vp+cose.
  - id: TEN-13
    where: "§3.1.1, §3.1.2, §3.2.1, §3.2.2, §3.3.1, §3.3.2; Examples 1 to 9, 18 to 26"
    what: >-
      No example carries a registered type indicator. The outer JWS and SD-JWT headers are kid and
      alg only, with no typ and no cty; the COSE_Sign1 protected headers are alg only, with no typ
      (16), no content type (3) and no kid (4); Examples 24 and 25 show content type (3), kid (4)
      and CWT Claims (15) but no typ (16); Example 26 prints its protected header elided after
      its first entry (1: -35), so it cannot be checked. The three nested SD-JWTs that do carry typ and cty
      (Example 6's inner presentation, Examples 21 and 22) use typ vp+ld+json+sd-jwt or
      vc+ld+json+sd-jwt, the subtypes of the media types Appendix A reports were changed, and cty
      vp+ld+json or vc+ld+json, which Appendix A does not mention.
    quotes:
      - at: "Appendix A"
        text: 'Changed media types from application/{vc,vp}+ld+json+{jwt,sd-jwt,cose} to application/{vc,vp}+{jwt,sd-jwt,cose}.'
    inferred: true
    inferred_reason: >-
      Census in the scratchpad over 19 distinct JOSE headers (6 outer JWS, 6 outer SD-JWT, 2
      nested JWS, 5 nested SD-JWT) and 7 COSE_Sign1 protected headers decoded from the HTML: 16 of
      19 JOSE headers are exactly kid and alg; 7 of 7 COSE protected headers are the map {1: -35}.
  - id: TEN-14
    where: "§8.4 Example 22"
    quotes:
      - at: "§8.4"
        text: 'Example 22: A simple URI-encoded SD-JWT Verifiable Presentation'
    what: >-
      Example 22 is a data:application/vp+sd-jwt URL whose issuer-signed JWT is the one of Example 21 (a credential: header typ
      vc+ld+json+sd-jwt, payload with issuer and credentialSubject and no verifiableCredential),
      with four of Example 21's six disclosures and a KB-JWT. It is an SD-JWT presentation of a
      credential in the SD-JWT sense, labelled with the media type this document registers for a
      verifiable presentation.
    inferred: true
    inferred_reason: decoded and compared in the scratchpad from the HTML of Examples 21 and 22.
  - id: TEN-15
    where: "Examples 2, 3, 8, 20 and 23"
    what: >-
      Signed payloads carry id values that are two data URLs joined by a semicolon
      (data:...,X;data:...,X). In Examples 2, 8 and 20 the input panel shows a single URL where the
      signed payload has the joined pair; in Example 3 the joined value is inside the presentation
      nested in the EnvelopedVerifiablePresentation, and in Example 23 inside the COSE payload.
      Example 2's signed payload also turns the enveloped credential's @context and type from
      arrays into strings. A joined value is not one RFC 2397 data URL.
    inferred: true
    inferred_reason: >-
      Census of the data URLs in the examples, decoded from the HTML: 41 occurrences in the display tabs, each printed in a display or nested, at any depth, in a token a display carries (46 counting the 5 that the Issuer Disclosures tabs reprint from the disclosures; 23 distinct values; 30 of the 41 are EnvelopedVerifiableCredential ids, 8 EnvelopedVerifiablePresentation ids, and 3 the values printed in §8.4):
      18 are two joined values, all in the signed payloads named above or in the decoded panels
      that render them.
  - id: TEN-16
    where: "Examples 5, 6, 8 and 20"
    what: >-
      Data URLs inside signed SD-JWT disclosures put a space after the comma
      (data:application/vc+sd-jwt, eyJ...), and the SD-JWT strings enveloped in Examples 5 and 8
      have a space before a tilde, in the input panels and in the signed bytes (Example 5's
      disclosure, Example 8's COSE payload). RFC 2397's data production (urlchar, from RFC 2396)
      admits no space (pointer), and a tilde split of such a string yields a part with a trailing
      space.
    inferred: true
    inferred_reason: >-
      Located in the scratchpad: 5 values with a space after the comma in the decoded disclosures
      of Examples 5, 6 and 20; a space before a tilde in the HTML pre text of Examples 5 and 8, in
      Example 5's decoded disclosure and in Example 8's decoded COSE payload. Being inside pre
      elements and signed bytes, they are not the .txt's rendering artefact (which also shows a
      space before each tilde of the compact SD-JWT blocks, where the HTML has none).
  - id: TEN-17
    where: "Example 20"
    what: >-
      The input panel writes data:application/vc+cose;base64,0oREo...+Q==, while the signed forms
      write data:application/vc+cose;base64url, a parameter RFC 2397 does not define, over a value
      that decodes to the text base64,0oREo...+Q== (the JWS payload) or to a base64url encoding of
      that text (the SD-JWT disclosure and the COSE payload). R-0051 requires base64 as specified
      in RFC 2397.
    inferred: true
    inferred_reason: decoded in the scratchpad from the HTML of Example 20.
  - id: TEN-18
    where: "§3.3.2, Examples 8, 9 and 23"
    what: >-
      The vp+cose examples envelope SD-JWT strings, not COSE: Example 8 a data:application/vc+sd-jwt
      credential, Example 9 a data:application/vp+sd-jwt presentation, and Example 23's payload a
      data:application/vc-ld+sd-jwt credential, a media type this document does not register.
      §3.3.2 says credentials in a COSE-secured presentation are secured using COSE (R-0059), and
      none of these uses the base64 form of R-0051.
    inferred: true
    inferred_reason: decoded in the scratchpad from the HTML of Examples 8, 9 and 23.
  - id: TEN-19
    where: "§3.1.2, §3.2.2, §3.3.2; Examples 3, 6 and 9"
    what: >-
      In Examples 3, 6 and 9 the whole secured payload is an EnvelopedVerifiablePresentation, an
      enveloped presentation enveloped again; the source never says when a presentation is in a
      presentation (R-0022, R-0038, R-0058). The signed payloads of Examples 3 and 9 add an empty
      verifiableCredential array that the input panels do not show. Example 6's inner
      presentation carries its credential as a plain object with selectively disclosable members,
      not as an EnvelopedVerifiableCredential (R-0037).
    inferred: true
    inferred_reason: decoded and compared in the scratchpad from the HTML of Examples 3, 6 and 9.
  - id: TEN-20
    where: "§3.2.1, §3.2.2; Examples 4, 5, 6, 18, 19 and 20"
    what: >-
      Every SD-JWT compact example makes the top-level type selectively disclosable; Examples 4
      and 19 also make the credentialSchema id and type disclosable, Example 18 the
      credentialStatus id and type and the issuer id, and Examples 5 and 20 the type and id of
      each EnvelopedVerifiableCredential. R-0031 and R-0040 say such properties SHOULD be
      disclosed, naming @context, type, credentialStatus, credentialSchema and relatedResource.
    inferred: true
    inferred_reason: >-
      Each of the 35 compact-block disclosures placed by its digest at the JSON path of the _sd
      array holding it, in the scratchpad.
  - id: TEN-21
    where: "§3.3.1, §3.3.2; Examples 7 to 9, 18 to 20, 23"
    what: >-
      Every COSE_Sign1 example has alg -35 in its protected header and a 64-octet signature. The
      IANA COSE Algorithms registry assigns -35 to ES384, whose signature is 96 octets (RFC 9053
      §2.1, pointer); 64 is the ES256 length. The JWS examples are consistent: 64 octets under
      ES256, 96 under ES384.
    inferred: true
    inferred_reason: >-
      Signature lengths measured in the scratchpad: 7 of 7 COSE signatures are 64 octets (58 40
      head); of the 19 distinct JWS signatures, the 15 under ES256 are 64 octets, and the 3
      distinct ES384 issuer-signed ones (4 occurrences: Examples 21 and 22 share one) and
      Example 22's ES384 KB-JWT signature are 96.
      The algorithm name is not printed in this document; Example 24 annotates label 1 only as
      Algorithm.
  - id: TEN-22
    where: "§4.2, Examples 1 to 9, 18, 19"
    what: >-
      The kid of every outer JWS and SD-JWT example is ExHkBMW9fmbkvV266mRpuP2sUY_N_EWIN1lapUzO8ro,
      which is not an absolute URL. The credentials among them (Examples 1, 4, 18, 19) carry no iss
      and have https issuers (https://university.example/issuers/14, https://contoso.example) or a
      DID issuer (did:web:contoso.example): the https cases are the ones where R-0072 requires kid
      to be an absolute URL to a verification method, if controlled identifier documents are used
      (the condition §4.2 opens with for all its requirements). The COSE_Sign1 credentials (Examples 7, 18,
      19) carry no kid at all. Example 2 uses the one kid for an ES256 signature (outer) and an
      ES384 signature (inner).
    inferred: true
    inferred_reason: >-
      Decoded headers and payloads from the HTML. None of the 10 JWKs printed or embedded in the
      document (7 distinct: Examples 15 to 17, the did:jwk of Example 17, the cnf keys of Examples
      6 and 21) has ExHkBMW9fmbkvV266mRpuP2sUY_N_EWIN1lapUzO8ro, UQM__nQ4S6BO8nQ4nONXxpxhthoyNxb53LYgYz-2ABs
      or SI3RHNouh8o81NOONPQUAL7EgZ-kI6_xj9oREvX1xOw as its RFC 7638 thumbprint, computed in the
      scratchpad.
  - id: TEN-23
    where: "§4.2, §8.1 Example 17"
    what: >-
      Example 17's second verification method has type JsonWebKey2020, where R-0070 requires
      JsonWebKey. Its first verification method's id embeds the JWK Thumbprint URI ending
      NzbLsXh8uDCcd-6MNwXF4W_7noWXFZAfHkxZsRGC9Xs, the value §4.2 prints in its kid example, but
      the RFC 7638 thumbprint of that method's P-521 key is GOwvnQ44eBJYLBsBHz-6XAcoAVyS-7FdaBqTTpDxArQ;
      the Ed25519 method's kid does match its key. §4.2 attributes the JWK Thumbprint URI to
      RFC 7638, which defines the thumbprint; the urn:ietf:params:oauth:jwk-thumbprint URI form
      the examples use is RFC 9278's, which the source does not cite (pointer; normative.md SD-34).
    inferred: true
    inferred_reason: thumbprints computed in the scratchpad over crv, kty, x and y (EC) or crv, kty and x (OKP) of the HTML's JWKs.
  - id: TEN-24
    where: "§4.2 Examples 10 to 13, §8.1 Example 14"
    what: >-
      Five JSON examples do not parse: Examples 11 and 13 leave the kid string unterminated,
      Example 14 has a trailing comma, and Examples 10 and 12 elide with a // comment.
    inferred: true
    inferred_reason: parsed in the scratchpad from the HTML pre elements; the .txt shows the same text.
  - id: TEN-25
    where: "§8.5"
    what: >-
      Examples 24 and 25 are not valid CBOR diagnostic notation: the text values application/vc,
      application/vp, urn:example:123 and urn:example:456 are unquoted, and the hex is elided with
      an ellipsis. Example 26's array has no comma after {}, and its payload hex begins 0f be,
      which is not JSON text (every encoded COSE example's payload begins 7b). §8.5 links CBOR
      Diagnostic Notation to RFC 7049 §6, an informative reference (Appendix C.2), not to the
      normative RFC 8949 (Appendix C.1).
  - id: TEN-26
    where: "§3.3.1, §3.3.2"
    what: >-
      The content type (3) SHOULD (R-0049, R-0055) is stated unconditionally and the next sentence
      calls the parameter optional; the JOSE cty SHOULD is conditioned on presence (R-0014).
  - id: TEN-27
    where: "§4.1, §4.1.1, §4.1.2"
    quotes:
      - at: "§4.1"
        text: 'These JOSE header parameters and JWT claims can be used by verifiers to discover verification keys.'
      - at: "§4.1.2"
        text: 'If kid is also present in the JOSE Header, it is used to distinguish the specific key used.'
    what: >-
      §4.1 introduces only JOSE parameters and JWT claims, but §4.1.1 to §4.1.3 also cover the
      COSE Header: a kid there is a hint for RFC 7515 verification, an iss there obtains a JSON
      Web Key, and the kid distinguishing rule names only the JOSE Header.
  - id: TEN-28
    where: "§6.1.5, §6.1.6, §6.1.1, §3.3.1, §3.1.1"
    what: >-
      The COSE registrations identify a COSE object, where §3.3.1 and §3.3.2 require COSE_Sign1;
      the JWT registrations identify a JSON Web Token. Neither says which media type labels an
      encrypted object that nests a secured credential (MSG-10, MSG-17, MSG-21).
  - id: TEN-29
    where: "§3.2.1, §3.2.2, Appendix C.1"
    what: >-
      SD-JWT encryption follows Section 11.2 of [SD-JWT], and the issuance and verification
      steps link sections 6.1 and 8 of it, but Appendix C.1 cites [SD-JWT] as an Internet-Draft
      with an unversioned URL, so those section numbers are not pinned to a text.

# ---------------------------------------------------------------------------
coverage: >-
  32 messages (26 structures and 6 media type registrations) with 229 fields (121 outside the
  registrations, 108 registration template rows), 8 encoding rules and 29 source tensions. 200
  verbatim quotes sit under quotes; the 108 registration field values are verbatim too and were
  checked as whole scalars. All 85 requirements of distilled/requirements.yaml (R-0001 to R-0085)
  are wired to at least one entry or field, through 307 constrained_by links; 12
  constrained_by_locators entries name keyword-bearing sentences with no requirement id (§3.1.3,
  marked non-normative). Counted by script over this file as parsed by bin/_yaml.py, pass 1,
  2026-11-03; any later edit owes a recount.

