    quotes:
      - at: "§1.1.2.2"
        text: 'Implementers SHOULD refer to this draft for the full details of the SD-JWT format and processing requirements.'
      - at: "§1.1.2.2"
        text: 'An SD-JWT consists of three main parts: the SD-JWT itself, optional disclosures, and an optional KB-JWT (Key Binding JWT). These parts are separated by tilde (~) characters.'
      - at: "§1.1.2.2"
        text: 'If the KB-JWT is not present, the SD-JWT must end with a tilde (~) character. This is crucial for correct parsing and processing of the SD-JWT.'
      - at: "§3.2.1"
        text: 'A conforming SD-JWT issuer implementation MUST use [SD-JWT] to secure this media type.'
      - at: "§3.2.1"
        text: 'A conforming SD-JWT verifier implementation MUST use [SD-JWT] to verify conforming JWS documents that use this media type.'
      - at: "§6.1.3"
        text: "binary; application/sd-jwt values are a series of base64url-encoded values (some of which may be the empty string) separated by period ('.') and tilde ('~') characters."
    fields:
      - name: issuer-signed JWT
        name_kind: synthetic
