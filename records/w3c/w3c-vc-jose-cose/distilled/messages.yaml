  - name: JOSE Header of a vc+jwt or vp+jwt
    id: MSG-07
    kind: header
    locator: "§3.1.1"
    source: "§1.1.2.1 (lines 146-147); §3.1.1 (line 185); §3.1.2 (line 273); §3.1.3 (lines 362-370); §4.1.1 (lines 800-801); §4.1.2 (lines 805-807); §4.1.3 (line 811); §4.2 (lines 818-820, 837); Examples 1, 2, 3, 11, 13, 18, 19, 20"
    normative_status: profiled
    defined_by: "RFC 7515 §4 (the link target of JOSE Header in §3.1.3)"
    encoding: JSON object (ENC-02), base64url-encoded as the first segment of MSG-06.
    quotes:
      - at: "§3.1.3"
        text: 'The unencoded JOSE Header is JSON (application/json), not JSON-LD (application/ld+json).'
      - at: "§3.1.3"
        text: 'The normative statements in Registered Header Parameter Names, JOSE Header, and Replicating Claims as Header Parameters apply to securing credentials and presentations.'
      - at: "§3.1.1"
        text: 'See Registered Header Parameter Names for additional details regarding usage of typ and cty.'
    fields:
      - name: alg
        type: JSON string
        required: not-stated
        set_by: "RFC 7515 §4.1.1 (pointer)"
        values:
          - value: none
            meaning: no integrity protection; such claims sets MUST be ignored (R-0005)
        quotes:
          - at: "§1.1.2.1"
            text: 'Issuers, Holders, and Verifiers of JWTs MUST understand the effect of the JSON Web Token header parameter setting of "alg": "none" when using JSON Web Tokens to secure [VC-DATA-MODEL-2.0].'
          - at: "§1.1.2.1"
            text: 'When content types from the [VC-DATA-MODEL-2.0] are secured using JSON Web Tokens, the header parameter setting of "alg": "none" is used to communicate that a Verifiable Credential or Verifiable Presentation encoded as a JWT Claims Set has no integrity protection.'
          - at: "§1.1.2.1"
            text: 'Issuers, Holders, and Verifiers MUST ignore all JWT Claims Sets that have no integrity protection.'
        description: >-
          The source names no algorithm to implement. Examples use ES256 (outer) and ES384
          (Example 2's inner credential). alg is among the names §3.1.3 says might be confused
          with credential members.
        constrained_by:
          - w3c-vc-jose-cose#R-0004
          - w3c-vc-jose-cose#R-0005
      - name: kid
        type: JSON string
        required: conditional
        required_when: >-
          Present whenever the issuer's or subject's key is a DID URL (MUST, R-0065). Where
          controlled identifier documents are used (§4.2), an absolute URL to a verification method
          when iss is absent and the issuer (R-0072) or the holder (R-0074) is a URL (MUST); with URL
          identifiers, an absolute URL embedding a JWK Thumbprint URI (RECOMMENDED, R-0073). Value
          forms in MSG-25.
        set_by: "RFC 7515 §4.1.4 (the link target of RFC7515 in §4.1.1)"
        quotes:
          - at: "§4.1.1"
            text: 'If kid is present in the JOSE Header or the COSE Header, a verifier can use this parameter as a hint indicating which key was used to secure the verifiable credential, when performing a verification process as defined in RFC7515.'
          - at: "§4.1.1"
            text: 'kid MUST be present when the key of the issuer or subject is expressed as a DID URL.'
          - at: "§4.1.2"
            text: 'If kid is also present in the JOSE Header, it is used to distinguish the specific key used.'
        notes: TEN-22 (no example kid is an absolute URL).
        constrained_by:
          - w3c-vc-jose-cose#R-0065
          - w3c-vc-jose-cose#R-0072
          - w3c-vc-jose-cose#R-0073
          - w3c-vc-jose-cose#R-0074
          - w3c-vc-jose-cose#R-0075
      - name: typ
        type: JSON string
        required: false
        level: "SHOULD be vc+jwt (R-0013) or vp+jwt (R-0018)"
        values:
          - value: vc+jwt
            when: a credential (§3.1.1)
          - value: vp+jwt
            when: a presentation (§3.1.2)
        set_by: "RFC 7515 §4.1.9 (pointer; the source links Registered Header Parameter Names, RFC 7515 §4.1)"
        quotes:
          - at: "§3.1.1"
            text: 'The typ header parameter SHOULD be vc+jwt.'
          - at: "§3.1.2"
            text: 'The typ header parameter SHOULD be vp+jwt.'
        notes: Absent from every JWS example (TEN-13). R-0077 keys the expected claims on typ (TEN-12).
        constrained_by:
          - w3c-vc-jose-cose#R-0013
          - w3c-vc-jose-cose#R-0018
          - w3c-vc-jose-cose#R-0008
          - w3c-vc-jose-cose#R-0009
          - w3c-vc-jose-cose#R-0077
      - name: cty
        type: JSON string
        required: false
        level: "When present, SHOULD be vc (R-0014) or vp (R-0019)"
        values:
          - value: vc
            when: a credential (§3.1.1)
          - value: vp
            when: a presentation (§3.1.2)
          - value: a more specific media type
            when: one is available (no example)
        set_by: "RFC 7515 §4.1.10 (pointer)"
        quotes:
          - at: "§3.1.1"
            text: 'When present, the cty header parameter SHOULD be vc.'
          - at: "§3.1.1"
            text: 'The cty header parameter value can be used to differentiate between secured content of different types when using vc+jwt.'
          - at: "§3.1.1"
            text: 'The content type header parameter is optional, and can be used to express a more specific media type than application/vc when one is available.'
          - at: "§3.1.2"
            text: 'When present, the cty header parameter SHOULD be vp.'
        notes: TEN-04 (the vp+jwt sentence says application/vc). Absent from every JWS example.
        constrained_by:
          - w3c-vc-jose-cose#R-0014
          - w3c-vc-jose-cose#R-0019
      - name: iss
        type: JSON string (a replicated claim, RFC 7519 §5.3)
        required: false
        level: "if present, MUST match issuer or issuer.id (R-0066, R-0067)"
        quotes:
          - at: "§4.1.2"
            text: 'If iss is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier can use this parameter to obtain a JSON Web Key to use in the verification process.'
        description: >-
          §3.1.3 imports RFC 7519 §5.3 (Replicating Claims as Header Parameters, its link target)
          for securing credentials; §4.1.2 then treats iss in the header and iss in the claims
          alike. No example has iss in a header.
        constrained_by:
          - w3c-vc-jose-cose#R-0066
          - w3c-vc-jose-cose#R-0067
          - w3c-vc-jose-cose#R-0072
      - name: cnf
        type: JSON object (RFC 7800)
        required: false
        level: "a verifier MAY use it to identify a proof-of-possession key (R-0068)"
        quotes:
          - at: "§4.1.3"
            text: 'If cnf is present in the JOSE Header, the JWT Claims, or the COSE Header, a verifier MAY use this parameter to identify a proof-of-possession key in the manner described in [RFC7800] or [RFC8747] for use in the verification process.'
        set_by: RFC 7800
        constrained_by:
          - w3c-vc-jose-cose#R-0068
          - w3c-vc-jose-cose#R-0069
      - name: other header parameters
        name_kind: synthetic
        type: any registered or private parameter
        required: false
        description: >-
          Registered ones are interpreted per their registry specifications; ones not understood
          are to be ignored, a rule stated only in §3.1.3, marked non-normative (ENC-08, TEN-05).
          crit is not named.
        constrained_by_locators:
          - "§3.1.3 (lines 362, 365, 370; section marked non-normative, no requirement id)"
    layout: '{"kid":"<key id>","alg":"<alg>"[,"typ":"vc+jwt"][,"cty":"vc"]}; member order not stated (the examples put kid first).'
    sample_evidence:
      inferred: true
      inferred_reason: >-
        Decoded from the HTML: the 6 outer JWS headers and Example 3's inner one are exactly
        {"kid":"ExHkBMW9fmbkvV266mRpuP2sUY_N_EWIN1lapUzO8ro","alg":"ES256"}; Example 2's inner
        credential has the same kid with alg ES384. The Protected Headers panels show the same two
        members. Examples 11 and 13 show alg ES384 with kid https://university.example/issuers/565049#key-123
        (TEN-24).
    constrained_by:
      - w3c-vc-jose-cose#R-0013
      - w3c-vc-jose-cose#R-0018
      - w3c-vc-jose-cose#R-0065
      - w3c-vc-jose-cose#R-0075

