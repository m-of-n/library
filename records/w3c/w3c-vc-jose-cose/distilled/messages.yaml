      - at: "§3.1.1"
        text: 'A conforming JWS issuer implementation MUST use [RFC7515] to secure this media type.'
      - at: "§3.1.1"
        text: 'A conforming JWS verifier implementation MUST use [RFC7515] to verify conforming JWS documents that use this media type.'
      - at: "§3.1.2"
        text: 'Implementations MUST support the JWS compact serialization.'
      - at: "§6.1.1"
