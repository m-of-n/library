      - at: "§3.3.1"
        text: 'A conforming COSE verifier implementation MUST use COSE_Sign1 as specified in [RFC9052] to verify conforming COSE documents that use this media type.'
      - at: "§5.3"
        text: 'Follow the algorithm defined in CBOR Object Signing and Encryption (COSE): Structures and Process [RFC9052] under the Signing and Verification Process for COSE_Sign1.'
      - at: "§8.5"
        text: 'Example 26: A COSE Sign 1 with an attached payload'
      - at: "§8.5"
        text: 'The payload can be either a credential or presentation as described in Securing Mechanisms.'
    fields:
      - name: CBOR tag 18
        name_kind: synthetic
        type: CBOR tag head d2
        required: not-stated
        description: >-
          Source silent on tagged or untagged (the words do not occur). All 7 encoded examples and
          Example 26's notation, 18( ... ), are tagged.
        inferred: true
        inferred_reason: decoded from the HTML.
      - name: protected
        type: CBOR bstr wrapping a header map (MSG-19)
        required: not-stated
        set_by: RFC 9052 (pointer)
        quotes:
          - at: "§5"
