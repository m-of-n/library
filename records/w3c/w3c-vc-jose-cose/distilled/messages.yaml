        constrained_by:
          - w3c-vc-jose-cose#R-0075
          - w3c-vc-jose-cose#R-0048
          - w3c-vc-jose-cose#R-0049
      - name: unprotected
        type: CBOR map (MSG-19)
        required: not-stated
        set_by: RFC 9052 (pointer)
        description: Empty ({}, a0) in every example.
        constrained_by:
          - w3c-vc-jose-cose#R-0075
      - name: payload
        type: CBOR bstr holding the unsecured credential (MSG-01) or presentation (MSG-02)
        required: true
        quotes:
          - at: "§3.3.1"
            text: 'The unsecured verifiable credential is the unencoded COSE_Sign1 payload.'
          - at: "§5.3"
            text: 'Set document to the decoded COSE_Sign1 payload.'
        description: >-
          Attached in every example; the source does not say whether a detached (nil) payload is
          allowed. TEN-09 (§1.1.2 calls the document a CBOR data structure).
        constrained_by:
          - w3c-vc-jose-cose#R-0047
          - w3c-vc-jose-cose#R-0053
          - w3c-vc-jose-cose#R-0075
      - name: signature
