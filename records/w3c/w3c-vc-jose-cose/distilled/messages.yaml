        level: "use NOT RECOMMENDED, in §3.1.3 (non-normative); the binding COSE twin is R-0063"
        set_by: RFC 7519 §4.1.5 (pointer)
        quotes:
          - at: "§3.1.3"
            text: 'Use of the nbf (Not Before) claim is NOT RECOMMENDED, as it makes little sense to attempt to assign a future date to a signature.'
        constrained_by_locators:
          - "§3.1.3 (line 366; section marked non-normative, no requirement id)"
      - name: cnf
        type: JSON object (RFC 7800), e.g. {"jwk": {...}}
        required: false
        level: "a verifier MAY use it (R-0068); a holder-provided proof-of-possession key is RECOMMENDED (R-0069)"
        quotes:
          - at: "§4.1.3"
            text: 'Use of a proof-of-possession key provided by the Holder to the Issuer to establish a cryptographic binding to the Holder in the Verifiable Credential that is verifiable by the Verifier in the Verifiable Presentation is RECOMMENDED.'
        constrained_by:
          - w3c-vc-jose-cose#R-0069
          - w3c-vc-jose-cose#R-0068
      - name: vc
        type: JSON member name
        required: false
        level: "MUST NOT be present (R-0006)"
        quotes:
          - at: "§3.1.3"
            text: 'The JWT Claim Names vc and vp MUST NOT be present.'
        constrained_by:
          - w3c-vc-jose-cose#R-0006
        constrained_by_locators:
          - "§3.1.3 (line 369; restates R-0006; section marked non-normative, no requirement id)"
      - name: vp
        type: JSON member name
        required: false
        level: "MUST NOT be present (R-0006)"
        constrained_by:
          - w3c-vc-jose-cose#R-0006
      - name: claims not understood
        name_kind: synthetic
        type: any JSON member
        required: false
        level: "MUST (R-0079): ignored; the same rule in §3.1.3 is non-normative"
        quotes:
          - at: "§3.1.3"
            text: 'Additional members may be present as header parameters and claims. If they are not understood, they MUST be ignored.'
        constrained_by:
          - w3c-vc-jose-cose#R-0079
        constrained_by_locators:
          - "§3.1.3 (line 370; section marked non-normative, no requirement id)"
    layout: "Members of the same JSON object as the credential's own members; no separate claims container."
    sample_evidence:
      inferred: true
      inferred_reason: >-
        Decoded from the HTML: no JWS example carries any registered claim; the 6 outer SD-JWT
        payloads carry iat 1745594772 and exp 1746804372 (2025-04-25 and 2025-05-09 UTC); Examples
        21 and 22 carry iss equal to the issuer string, iat 1697289996, exp 1728912396 and cnf
