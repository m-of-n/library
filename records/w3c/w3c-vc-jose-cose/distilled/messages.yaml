        required: false
        description: optional, per §1.1.2.2; the last part when present (TEN-03).
        constrained_by:
          - w3c-vc-jose-cose#R-0069
      - name: terminating tilde
        name_kind: synthetic
        type: the character ~
        required: conditional
        required_when: the KB-JWT is not present (§1.1.2.2, lowercase must; not a BCP 14 statement).
    layout: "<issuer-signed JWT> '~' (<Disclosure> '~')* [<KB-JWT>]"
    sample_evidence:
