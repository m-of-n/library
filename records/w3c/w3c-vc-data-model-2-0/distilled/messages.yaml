extracted_by: "FX-1 pass 1 (extract), schema+messages+examples agent, mechanical lane, from the source only"

applicability: >-
  The REC defines the data model of a verifiable credential and a verifiable presentation, serialised as compacted JSON-LD 1.1 (application/vc, application/vp).
  It defines no byte-level wire format: the securing mechanisms (Data Integrity embedded proofs; JOSE, COSE and SD-JWT envelopes) belong to other
  specifications. What it does fix is the set of members of the credential, the presentation and the objects nested in them; the two enveloped-form
  objects; the language value object; the ProblemDetails report and the verification-result maps; and two IANA media type registrations. Message
  names below are this library's labels for the REC's structures. Out of scope because the REC does not define them: the members of a proof (Data
  Integrity), the content of status, schema, refresh, terms-of-use and evidence types (their own type specifications), the JOSE and COSE headers
  (VC-JOSE-COSE), and the JSON-LD processing algorithms (JSON-LD 1.1).

note: >-
  Conventions. (1) quote: is a verbatim span of one line of the rendering, copied by script beside source_lines: and checked by bin/check-quotes.
  (2) type, rule, description and layout are this library's wording, not quotations. (3) inferred: marks anything the source does not state
  outright, with the reason. (4) constrained_by lists requirement ids: each was emitted by script from requirements.yaml by a selector (a source
  line the requirement's source_lines contain, plus a regular expression its text must match, exactly one match required), and every resolved pair
  was read. A field with no constrained_by has no requirement in requirements.yaml (an optional or descriptive member the REC states without a
  BCP 14 keyword), and says so in rule. (5) schema: names the derived JSON Schema anchor that checks the shape; the file is
  schema/vcdm.derived.schema.json unless another is named. (6) Finding ids F-nn and tensions T-nn are described in schema/README.md.

