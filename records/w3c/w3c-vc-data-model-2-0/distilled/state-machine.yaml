  - id: "M09"
    name: "presentation-freshness"
    locator: "§4.13, §9.5.2"
    actor: "verifier"
    protocol_flow: "F04, F05, F09"
    purpose: >-
      A presentation from challenge to acceptance. Binding and freshness are a SHOULD and a
      non-normative consideration; the data model has no property for either (T-21, T-22), so
      this machine's guards read values the securing mechanism carries.
    initial: "challenge-issued"
    states:
      - name: "challenge-issued"
        meaning: "The verifier has asked, optionally with a challenge."
        kind: "normal"
        basis: "inferred"
      - name: "created"
        meaning: "The holder built a presentation bound to the challenge."
        kind: "normal"
        basis: "stated"
      - name: "secured"
        meaning: "The presentation is secured."
        kind: "normal"
        basis: "stated"
