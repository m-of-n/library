machines:
  - id: "M01"
    name: "verification-algorithm"
    locator: "§7.1, §7.2, §5.13"
    actor: "conforming-verifier-implementation"
    protocol_flow: "F09"
    purpose: >-
      The §7.1 algorithm exactly as printed: one delegated call, a cryptographic branch, a
      conformance branch, one return. States in-between are the algorithm's step positions. The
      three failure states before result-held are inferred: the source gives those operations no
      failure branch (T-03).
    test_note: >-
      A harness can assert status, the presence of the document and of at least one error of the
      named type only where the source names one (steps 1.3 and 2). The ordering licence lets
      the conformance check run first, and implementations MAY produce different errors, so a
      strict test of a specific error type beyond these two is not supported by the source.
    equivalence:
      - at: "§7.1"
        source_lines: "3373"
        status: "normative"
        quote: |-
          The steps for verifying the state of the securing mechanism and verifying that the input document is a conforming document MAY be performed in a different order than that provided above as long as the implementation returns errors for the same invalid inputs.
    delegated_to_other_specifications:
      - "verifyProof itself: the securing mechanism specification (VC Data Integrity, VC-JOSE-COSE)"
      - "choice of mechanism: the VC Extensions registry or the implementation's own knowledge"
    initial: "received"
    states:
      - name: "received"
        meaning: "inputMediaType and inputData are held; the algorithm is about to run."
        kind: "normal"
        basis: "stated"
      - name: "selecting-mechanism"
        meaning: "Step 1.1: choosing verifyProof from inputMediaType."
        kind: "normal"
        basis: "stated"
      - name: "mechanism-unavailable"
        meaning: "No verifyProof could be determined."
        kind: "error"
        basis: "inferred"
      - name: "preparing-input"
        meaning: "Step 1.2: deciding between bytes and a parsed JSON map."
        kind: "normal"
        basis: "stated"
      - name: "input-unparseable"
        meaning: "verifyProof expects a map and inputData is not JSON."
        kind: "error"
        basis: "inferred"
      - name: "calling-verifyProof"
        meaning: "Step 1.2: verifyProof is running."
        kind: "normal"
        basis: "stated"
      - name: "call-failed"
        meaning: "The call was not successful."
        kind: "error"
        basis: "inferred"
      - name: "result-held"
        meaning: >-
          Step 1.2: result holds status, document, mediaType, controller,
          controlledIdentifierDocument, warnings, errors.
        kind: "normal"
        basis: "stated"
      - name: "cryptographic-failure"
        meaning: "Step 1.3 done: CRYPTOGRAPHIC_SECURITY_ERROR added; document still present."
        kind: "error"
        basis: "stated"
      - name: "checking-conformance"
        meaning: "Step 2: is result.document a conforming document."
        kind: "normal"
        basis: "stated"
      - name: "malformed"
        meaning: "Step 2 failure: status false, document removed, MALFORMED_VALUE_ERROR added."
        kind: "error"
        basis: "stated"
      - name: "returned-verified"
        meaning: "Step 3 with status true."
        kind: "terminal"
        basis: "stated"
      - name: "returned-failed"
        meaning: "Step 3 with status false."
        kind: "terminal-error"
        basis: "stated"
    transitions:
