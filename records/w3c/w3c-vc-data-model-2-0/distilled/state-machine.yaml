        protocol_steps:
          - "F09 1.2"
      - id: "M01-T17"
        from: "call-failed"
        to: "returned-failed"
        trigger: "completion"
        guard: "always"
        actions: "Return status false with an implementation-chosen error."
        basis: "inferred"
        inferred_reason: "No return is stated for this case (E-05)."
        quotes:
          - at: "§7.1"
            source_lines: "3373"
            status: "normative"
            quote: |-
              Implementations MAY produce different errors than described above.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0114"
        constrained_by_text: []
        protocol_steps:
          - "F09 1.2"
    error_states:
      - "mechanism-unavailable"
      - "input-unparseable"
      - "call-failed"
      - "cryptographic-failure"
      - "malformed"
      - "returned-failed"
    terminal_states:
      - "returned-verified"
      - "returned-failed"
    unspecified:
      - "no mechanism for inputMediaType"
      - "unparseable inputData"
      - "unsuccessful call"
      - "whether result.document may be read after step 1.3"
      - "which errors beyond the two named"
  - id: "M02"
    name: "verifier-receive-lifecycle"
    locator: "§6.2, §7.1, §1.3, §5.3, Appendix A, Appendix B.1"
    actor: "verifier"
    protocol_flow: "F09, F10, F11, F12"
    purpose: >-
      What surrounds M01 at a verifier: getting a media type, the two verifier MUSTs outside
      §7.1 (contexts, related resources), the credentials inside a presentation, and validation.
      Their order around M01 is not stated; this machine fixes one and marks what is inferred.
    delegated_to_other_specifications:
      - "validation rules (Appendix A, non-normative)"
      - "status and schema evaluation (type definitions)"
    initial: "object-received"
    states:
      - name: "object-received"
        meaning: "A secured credential or presentation has arrived by an undefined transport."
        kind: "normal"
        basis: "stated"
      - name: "media-type-known"
        meaning: "inputMediaType is established."
        kind: "normal"
        basis: "stated"
      - name: "verifying"
        meaning: "M01 is running."
        kind: "normal"
        basis: "stated"
      - name: "verified"
        meaning: "M01 returned status true."
        kind: "normal"
        basis: "stated"
      - name: "contexts-checked"
        meaning: "No expansion or RDF error (or no such processing)."
        kind: "normal"
        basis: "stated"
      - name: "resources-checked"
        meaning: "Every related resource used matched its digest, or none was used."
        kind: "normal"
        basis: "stated"
      - name: "nested-verified"
        meaning: "Every credential inside a presentation was verified."
        kind: "normal"
        basis: "inferred"
      - name: "validating"
        meaning: "M06 is running (non-normative)."
        kind: "normal"
        basis: "stated"
      - name: "relied-upon"
        meaning: "The verifier relies on the claims."
        kind: "terminal"
        basis: "stated"
      - name: "verification-failed"
        meaning: "Verification failed (M01 status false, or an expansion error)."
        kind: "terminal-error"
        basis: "stated"
      - name: "resource-integrity-error"
        meaning: "A used related resource failed its digest; an error was produced."
        kind: "terminal-error"
        basis: "stated"
      - name: "rejected"
        meaning: "Rejected outside verification (no media type, a nested failure, validation)."
        kind: "terminal-error"
        basis: "inferred"
    transitions:
      - id: "M02-T01"
        from: "object-received"
        to: "media-type-known"
        trigger: "completion"
        guard: "The transport supplied a media type."
        actions: "Use it as inputMediaType."
        basis: "inferred"
        inferred_reason: "Where inputMediaType comes from is not said."
        quotes:
          - at: "§7.1"
            source_lines: "3358"
            status: "normative"
            quote: |-
              This algorithm takes a media type (string inputMediaType) and secured data (byte sequence inputData) and returns a map that contains the following:
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0273"
        constrained_by_text: []
        protocol_steps:
          - "F09 0"
      - id: "M02-T02"
        from: "object-received"
        to: "media-type-known"
        trigger: "completion"
        guard: "The label is lower precision and M07 ends in assumed-vc or assumed-vp."
        actions: "Use the assumed media type."
        basis: "stated"
        quotes:
          - at: "§6.2"
            source_lines: "3325"
            status: "non-normative (section)"
            quote: |-
              Implementers are urged to not raise errors when it is possible to determine the intended media type from a payload, provided that the media type used is acceptable in the given protocol.
        protocol_steps:
          - "F08 2"
          - "F08 3"
      - id: "M02-T03"
        from: "object-received"
        to: "rejected"
        trigger: "completion"
        guard: "No media type can be established."
        actions: "none stated"
        basis: "inferred"
        inferred_reason: >-
          Without inputMediaType step 1.1 cannot choose verifyProof; the source has no branch
          (E-03).
        quotes:
          - at: "§7.1"
            source_lines: "3368"
            status: "normative"
            quote: |-
              Set the verifyProof function by using the inputMediaType and the Securing Mechanisms section of the Verifiable Credential Extensions document, or other mechanisms known to the implementation, to determine the cryptographic suite to use when verifying the securing mechanism.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0275"
        constrained_by_text: []
        protocol_steps:
          - "F09 0"
      - id: "M02-T04"
        from: "media-type-known"
        to: "verifying"
        trigger: "verification-invoked"
        guard: "always"
        actions: "Run M01."
        basis: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "3358"
            status: "normative"
            quote: |-
              This section contains an algorithm that conforming verifier implementations MUST run when verifying a verifiable credential or a verifiable presentation.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0110"
          - "w3c-vc-data-model-2-0#R-0132"
        constrained_by_text:
          - "§7.1: conforming verifier implementations MUST run"
          - "§1.3: MUST perform verification on a conforming document"
        protocol_steps:
          - "F09 1.1"
      - id: "M02-T05"
        from: "verifying"
        to: "verification-failed"
        trigger: "M01-returned"
        guard: "status false."
        actions: "Keep result.errors."
        basis: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "3372"
            status: "normative"
            quote: |-
              Return result.
          - at: "§7.1"
            source_lines: "3370"
            status: "normative"
            quote: |-
              If result.status is set to false, add a CRYPTOGRAPHIC_SECURITY_ERROR to result.errors.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0283"
          - "w3c-vc-data-model-2-0#R-0279"
        constrained_by_text: []
        protocol_steps:
          - "F09 3"
      - id: "M02-T06"
        from: "verifying"
        to: "verified"
        trigger: "M01-returned"
        guard: "status true."
        actions: "Keep document, controller, controlledIdentifierDocument."
        basis: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "3372"
            status: "normative"
            quote: |-
              Return result.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0283"
        constrained_by_text: []
        protocol_steps:
          - "F09 3"
      - id: "M02-T07"
        from: "verified"
        to: "verification-failed"
        trigger: "completion"
        guard: "JSON-LD expansion or transformation to RDF was performed and errored."
        actions: "Fail verification."
        basis: "stated"
        quotes:
          - at: "Appendix B.1"
            source_lines: "4105"
            status: "normative"
            quote: |-
              If such operations are performed and result in an error, the verifiable credential or verifiable presentation MUST result in a verification failure.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0125"
        constrained_by_text:
          - "Appendix B.1: MUST result in a verification failure"
        protocol_steps:
          - "F09 X3"
          - "F10 5"
      - id: "M02-T08"
        from: "verified"
        to: "contexts-checked"
        trigger: "completion"
        guard: "No such processing, or it succeeded."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "Appendix B.1"
            source_lines: "4105"
            status: "normative"
            quote: |-
              Implementations that apply the base context above, as well as other contexts and values in any @context property, during operations such as JSON-LD Expansion or transformation to RDF, are expected to do so without experiencing any errors.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0295"
        constrained_by_text: []
        protocol_steps:
          - "F10 1"
          - "F10 5"
      - id: "M02-T09"
        from: "contexts-checked"
        to: "resource-integrity-error"
        trigger: "completion"
        guard: "A related resource the verifier uses ends in M08 digest-mismatch."
        actions: "Produce an error."
        basis: "stated"
        quotes:
          - at: "§5.3"
            source_lines: "2895"
            status: "normative"
            quote: |-
              If the digest provided by the issuer does not match the digest computed for the retrieved resource, the conforming verifier implementation MUST produce an error.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0072"
        constrained_by_text:
          - "§5.3: MUST produce an error"
        protocol_steps:
          - "F09 X4"
          - "F11 3"
      - id: "M02-T10"
        from: "contexts-checked"
        to: "resources-checked"
        trigger: "completion"
        guard: "Every related resource used ends in M08 digest-matched or not-used."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§5.3"
            source_lines: "2895"
            status: "normative"
            quote: |-
              A conforming verifier implementation that makes use of a resource based on the id of a relatedResource object inside a conforming document with a corresponding cryptographic digest appearing in a relatedResource object value MUST compute the digest of the retrieved resource.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0071"
        constrained_by_text:
          - "§5.3: MUST compute the digest of the retrieved resource"
        protocol_steps:
          - "F11 3"
      - id: "M02-T11"
        from: "resources-checked"
        to: "nested-verified"
        trigger: "completion"
        guard: "The document is a presentation."
        actions: >-
          Run this machine for each embedded credential and each decoded
          EnvelopedVerifiableCredential.
        basis: "inferred"
        inferred_reason: "The source is silent on nested verification (T-08)."
        quotes:
          - at: "§4.13"
            source_lines: "2475"
            status: "normative"
            quote: |-
              These objects are called verifiable credential graphs and MUST express information that is secured using a securing mechanism.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0043"
        constrained_by_text: []
        protocol_steps:
          - "F09 X5"
          - "F03 7"
      - id: "M02-T12"
        from: "resources-checked"
        to: "validating"
        trigger: "completion"
        guard: "The document is a credential."
        actions: "Run M06."
        basis: "stated"
        quotes:
          - at: "Appendix A.7"
            source_lines: "4075"
            status: "non-normative (section)"
            quote: |-
              is always considered a component of validation, which is performed after verification.
        protocol_steps:
          - "F09 X6"
      - id: "M02-T13"
        from: "nested-verified"
        to: "validating"
        trigger: "completion"
        guard: "Every nested credential verified."
        actions: "Run M06."
        basis: "inferred"
        inferred_reason: "As M02-T11."
        quotes:
          - at: "Appendix A.7"
            source_lines: "4075"
            status: "non-normative (section)"
            quote: |-
              is always considered a component of validation, which is performed after verification.
        protocol_steps:
          - "F09 X6"
      - id: "M02-T14"
        from: "nested-verified"
        to: "rejected"
        trigger: "completion"
        guard: "A nested credential failed verification."
        actions: "none stated"
        basis: "inferred"
        inferred_reason: "Whether one failed credential fails the presentation is not said."
        quotes:
          - at: "§4.13"
            source_lines: "2467"
            status: "normative"
            quote: |-
              Unless additional requirements are defined by the particular securing mechanism or embedding protocol, a verifier cannot generally assume that the verifiable presentation correlates with the presented verifiable credentials.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0198"
        constrained_by_text: []
        protocol_steps:
          - "F09 X5"
      - id: "M02-T15"
        from: "validating"
        to: "relied-upon"
        trigger: "M06-returned"
        guard: "M06 ended in accepted."
        actions: "Rely on the claims."
        basis: "stated"
        quotes:
          - at: "§1.1"
            source_lines: "200"
            status: "non-normative (section)"
            quote: |-
              Such reliance only occurs after evaluating the issuer, the proof, the subject, and the claims against one or more verifier policies.
        protocol_steps:
          - "F12 10"
      - id: "M02-T16"
        from: "validating"
        to: "rejected"
        trigger: "M06-returned"
        guard: "M06 ended in rejected."
        actions: "none stated"
        basis: "stated"
        quotes:
          - at: "Appendix A.1"
            source_lines: "4024"
            status: "non-normative (section)"
            quote: |-
              A verifier's validation of a verifiable credential will fail when mandatory claims are not included, and any claim that is not associated with the specific type will be ignored. In other words, a verifier will perform input validation on the verifiable credential it receives and will reject malformed input based on the credential type specification.
        protocol_steps:
          - "F12 1"
          - "F12 10"
    error_states:
      - "verification-failed"
      - "resource-integrity-error"
      - "rejected"
    terminal_states:
      - "relied-upon"
      - "verification-failed"
      - "resource-integrity-error"
      - "rejected"
    unspecified:
      - "order of M01, context checks, resource checks and nested verification"
      - "error type for an expansion failure and for a digest mismatch"
      - "effect of a nested failure on the presentation"
  - id: "M03"
    name: "credential-validity-period"
    locator: "§4.9, §5.8, Appendix A.5, Appendix A.7"
    actor: "verifier (or holder) evaluating at a time now"
    protocol_flow: "F01 5, F12 4"
    purpose: >-
      The temporal part of a credential's lifecycle. Bounds and their order are normative; what
      a party does with the result is validation, non-normative, and a conforming verifier may
      ignore both optional properties (T-30). The clock is not named by the source (T-24).
    comparison:
      - at: "§4.9"
        source_lines: "2028"
        status: "normative"
        quote: |-
          Temporal comparisons are then performed by checking to see where the date and time being compared are in relation to a particular point on the timeline.
      - at: "§5.8"
        source_lines: "3169"
        status: "normative"
        quote: |-
          Time values that are incorrectly serialized without an offset MUST be interpreted as UTC.
    delegated_to_other_specifications:
      - "revocation and suspension: M04"
      - "refresh: M05"
    initial: "evaluating"
    states:
      - name: "evaluating"
        meaning: "validFrom and validUntil are read and compared with now."
        kind: "normal"
        basis: "stated"
      - name: "malformed-period"
        meaning: "A bound is not a dateTimeStamp, or validFrom is later than validUntil."
        kind: "terminal-error"
        basis: "stated"
      - name: "valid-indefinitely"
        meaning: "Neither bound is present (rule stated in a note)."
        kind: "terminal"
        basis: "stated"
      - name: "not-yet-valid"
        meaning: "now is earlier than validFrom."
        kind: "normal"
        basis: "stated"
      - name: "in-validity-period"
        meaning: "now is within the bounds that are present, inclusive."
        kind: "normal"
        basis: "stated"
      - name: "expired"
        meaning: "now is later than validUntil."
        kind: "terminal"
        basis: "stated"
    transitions:
      - id: "M03-T01"
        from: "evaluating"
        to: "malformed-period"
        trigger: "evaluation-requested"
        guard: >-
          A present bound is not an XMLSCHEMA11-2 dateTimeStamp, or validFrom is later than
          validUntil.
        actions: "The document is not conforming: MALFORMED_VALUE_ERROR when M01 step 2 checks it."
        basis: "stated"
        quotes:
          - at: "§4.9"
            source_lines: "2030"
            status: "normative"
            quote: |-
              If a validUntil value also exists, the validFrom value MUST express a point in time that is temporally the same or earlier than the point in time expressed by the validUntil value.
          - at: "§4.9"
            source_lines: "2032"
            status: "normative"
            quote: |-
              If a validFrom value also exists, the validUntil value MUST express a point in time that is temporally the same or later than the point in time expressed by the validFrom value.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0180"
          - "w3c-vc-data-model-2-0#R-0027"
          - "w3c-vc-data-model-2-0#R-0178"
          - "w3c-vc-data-model-2-0#R-0181"
          - "w3c-vc-data-model-2-0#R-0247"
        constrained_by_text:
          - "§4.9: the validFrom value MUST express"
          - "§4.9: the validUntil value MUST express"
          - "§4.9: value of the validFrom property MUST be"
          - "§4.9: value of the validUntil property MUST be"
          - "§5.8: the regular expression in [XMLSCHEMA11-2] is the normative definition"
        protocol_steps:
          - "F01 5"
          - "F09 2"
      - id: "M03-T02"
        from: "evaluating"
        to: "valid-indefinitely"
        trigger: "evaluation-requested"
        guard: "Neither validFrom nor validUntil."
        actions: "Treat as valid from creation onwards."
        basis: "stated"
        quotes:
          - at: "§4.9"
            source_lines: "2267"
            status: "non-normative (note)"
            quote: |-
              If validFrom and validUntil are not present, the verifiable credential validity period is considered valid indefinitely.
          - at: "§4.9"
            source_lines: "2267"
            status: "non-normative (note)"
            quote: |-
              In such cases, the verifiable credential is assumed to be valid from the time the verifiable credential was created.
        protocol_steps:
          - "F12 4"
      - id: "M03-T03"
        from: "evaluating"
        to: "not-yet-valid"
        trigger: "evaluation-requested"
        guard: "validFrom present and now < validFrom."
        actions: "none stated"
        basis: "stated"
        quotes:
          - at: "§4.9"
            source_lines: "2030"
            status: "normative"
            quote: |-
              Note that this value represents the earliest point in time at which the information associated with the credentialSubject property becomes valid.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0083"
          - "w3c-vc-data-model-2-0#R-0176"
          - "w3c-vc-data-model-2-0#R-0177"
          - "w3c-vc-data-model-2-0#R-0179"
        constrained_by_text:
          - "§5.8: MUST be interpreted as UTC"
          - "§4.9: the calculation is done"
          - "§4.9: Temporal comparisons are then performed"
        protocol_steps:
          - "F12 4"
      - id: "M03-T04"
        from: "evaluating"
        to: "in-validity-period"
        trigger: "evaluation-requested"
        guard: >-
          At least one bound present; validFrom absent or validFrom <= now; validUntil absent or
          now <= validUntil.
        actions: "none stated"
        basis: "stated"
        quotes:
          - at: "§4.9"
            source_lines: "2030"
            status: "normative"
            quote: |-
              Note that this value represents the earliest point in time at which the information associated with the credentialSubject property becomes valid.
          - at: "§4.9"
            source_lines: "2032"
            status: "normative"
            quote: |-
              Note that this value represents the latest point in time at which the information associated with the credentialSubject property is valid.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0083"
          - "w3c-vc-data-model-2-0#R-0176"
          - "w3c-vc-data-model-2-0#R-0177"
          - "w3c-vc-data-model-2-0#R-0179"
          - "w3c-vc-data-model-2-0#R-0182"
        constrained_by_text:
          - "§5.8: MUST be interpreted as UTC"
          - "§4.9: the calculation is done"
          - "§4.9: Temporal comparisons are then performed"
        protocol_steps:
          - "F12 4"
      - id: "M03-T05"
        from: "evaluating"
        to: "expired"
        trigger: "evaluation-requested"
        guard: "validUntil present and now > validUntil."
        actions: "none stated"
        basis: "stated"
        quotes:
          - at: "§4.9"
            source_lines: "2032"
            status: "normative"
            quote: |-
              Note that this value represents the latest point in time at which the information associated with the credentialSubject property is valid.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0083"
          - "w3c-vc-data-model-2-0#R-0176"
          - "w3c-vc-data-model-2-0#R-0177"
          - "w3c-vc-data-model-2-0#R-0182"
        constrained_by_text:
          - "§5.8: MUST be interpreted as UTC"
          - "§4.9: the calculation is done"
          - "§4.9: Temporal comparisons are then performed"
        protocol_steps:
          - "F12 4"
      - id: "M03-T06"
        from: "not-yet-valid"
        to: "in-validity-period"
        trigger: "clock-reaches-validFrom"
        guard: "always"
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§4.9"
            source_lines: "2030"
            status: "normative"
            quote: |-
              representing the date and time the credential becomes valid, which could be a date and time in the future or the past.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0178"
        constrained_by_text: []
      - id: "M03-T07"
        from: "in-validity-period"
        to: "expired"
        trigger: "clock-passes-validUntil"
        guard: "validUntil present."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§4.9"
            source_lines: "2032"
            status: "normative"
            quote: |-
              representing the date and time the credential ceases to be valid, which could be a date and time in the past or the future.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0181"
        constrained_by_text: []
      - id: "M03-T08"
        from: "expired"
        to: "expired"
        trigger: "refreshed-credential-received"
        guard: "always"
        actions: >-
          The refreshed credential is a new instance and starts its own M03; this one stays
          expired.
        basis: "inferred"
        inferred_reason: "The source does not say what refresh produces (T-27)."
        quotes:
          - at: "§5.4"
            source_lines: "2922"
            status: "normative"
            quote: |-
              It is useful for systems to enable the manual or automatic refresh of an expired verifiable credential.
        protocol_steps:
          - "F14 4"
    error_states:
      - "malformed-period"
    terminal_states:
      - "malformed-period"
      - "valid-indefinitely"
      - "expired"
    unspecified:
      - "the clock and its source"
      - "how much clock skew is tolerated"
      - "the creation time a credential without bounds is valid from (no property carries it)"
      - "re-issue across a time-zone rule change, which §5.8 warns can open a gap"
  - id: "M04"
    name: "credential-status-entry"
    locator: "§4.10, Appendix A.8"
    actor: "verifier (or holder software)"
    protocol_flow: "F13"
    purpose: >-
      One run over a credential's credentialStatus entries. Only the entry shape is the
      source's; retrieval, status values and reconciliation belong to the status type or to
      business logic, so most transitions are inferred.
    delegated_to_other_specifications:
      - "status values and their meaning (for example Bitstring Status List revocation and suspension)"
      - "retrieval protocol"
      - "reconciliation of conflicting entries"
    initial: "entries-read"
    states:
      - name: "entries-read"
        meaning: "credentialStatus has been read."
        kind: "normal"
        basis: "stated"
      - name: "no-status-information"
        meaning: "credentialStatus is absent."
        kind: "terminal"
        basis: "stated"
      - name: "retrieving"
        meaning: "Status information is being obtained per entry type."
        kind: "normal"
        basis: "inferred"
      - name: "status-known"
        meaning: "Status information for every entry is in hand."
        kind: "normal"
        basis: "inferred"
      - name: "status-unavailable"
        meaning: "Some entry's information could not be obtained."
        kind: "terminal-error"
        basis: "inferred"
      - name: "conflicting"
        meaning: "Entries disagree."
        kind: "normal"
        basis: "stated"
      - name: "acceptable"
        meaning: "Status passes the verifier's criteria."
        kind: "terminal"
        basis: "stated"
      - name: "unacceptable"
        meaning: "Status fails them (for example revoked or suspended)."
        kind: "terminal-error"
        basis: "stated"
    transitions:
      - id: "M04-T01"
        from: "entries-read"
        to: "no-status-information"
        trigger: "completion"
        guard: "credentialStatus absent."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§4.10"
            source_lines: "2272"
            status: "normative"
            quote: |-
              If present, the value associated with the credentialStatus property is a single object or a set of one or more objects.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0183"
        constrained_by_text: []
      - id: "M04-T02"
        from: "entries-read"
        to: "retrieving"
        trigger: "completion"
        guard: "credentialStatus present."
        actions: "For each entry, obtain what its type defines."
        basis: "inferred"
        inferred_reason: "Retrieval is implied by the example, never stated."
        quotes:
          - at: "§4.10"
            source_lines: "2277"
            status: "normative"
            quote: |-
              The value will provide enough information to determine the current status of the credential and whether machine-readable information will be retrievable from the URL.
        protocol_steps:
          - "F13 2"
      - id: "M04-T03"
        from: "retrieving"
        to: "status-known"
        trigger: "status-information-received"
        guard: "Every entry's type is understood."
        actions: "none"
        basis: "inferred"
        inferred_reason: "Delegated to the type definition."
        quotes:
          - at: "§4.10"
            source_lines: "2277"
            status: "normative"
            quote: |-
              The precise content of the credential status information is determined by the specific credentialStatus type definition and varies depending on factors such as whether it is simple to implement or if it is privacy-enhancing.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0188"
        constrained_by_text: []
        protocol_steps:
          - "F13 2"
      - id: "M04-T04"
        from: "retrieving"
        to: "status-unavailable"
        trigger: "status-unavailable"
        guard: "always"
        actions: "none stated"
        basis: "inferred"
        inferred_reason: "Not addressed by the source."
        quotes:
          - at: "§4.10"
            source_lines: "2340"
            status: "normative"
            quote: |-
              Defining the data model, formats, and protocols for status schemes is out of the scope of this specification.
        protocol_steps:
          - "F13 2"
      - id: "M04-T05"
        from: "status-known"
        to: "acceptable"
        trigger: "completion"
        guard: "Every entry is acceptable by its type and the verifier's criteria."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "Appendix A.8"
            source_lines: "4080"
            status: "non-normative (section)"
            quote: |-
              If the credentialStatus property is available, the status of a verifiable credential is expected to be evaluated by the verifier according to the credentialStatus type definition for the verifiable credential and the verifier's own status evaluation criteria.
        protocol_steps:
          - "F13 4"
          - "F12 6"
      - id: "M04-T06"
        from: "status-known"
        to: "unacceptable"
        trigger: "completion"
        guard: >-
          An entry shows a status the verifier rejects (the source's example is a withdrawal for
          cause).
        actions: "none stated"
        basis: "stated"
        quotes:
          - at: "Appendix A.8"
            source_lines: "4080"
            status: "non-normative (section)"
            quote: |-
              For example, a verifier can ensure the status of the verifiable credential is not "withdrawn for cause by the issuer".
        protocol_steps:
          - "F13 4"
      - id: "M04-T07"
        from: "status-known"
        to: "conflicting"
        trigger: "completion"
        guard: "Entries disagree."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§4.10"
            source_lines: "2339"
            status: "normative"
            quote: |-
              Implementers are cautioned that credentials with multiple status entries might contain conflicting information.
        protocol_steps:
          - "F13 4"
      - id: "M04-T08"
        from: "conflicting"
        to: "acceptable"
        trigger: "completion"
        guard: "The verifier's business logic accepts."
        actions: "none"
        basis: "inferred"
        inferred_reason: "Out of scope by the source's own words."
        quotes:
          - at: "§4.10"
            source_lines: "2339"
            status: "normative"
            quote: |-
              Reconciling such conflicts is a part of the validation process, hence part of the verifier's business logic, and therefore out of scope for this specification.
        protocol_steps:
          - "F13 4"
      - id: "M04-T09"
        from: "conflicting"
        to: "unacceptable"
        trigger: "completion"
        guard: "The verifier's business logic rejects."
        actions: "none"
        basis: "inferred"
        inferred_reason: "As M04-T08."
        quotes:
          - at: "§4.10"
            source_lines: "2339"
            status: "normative"
            quote: |-
              Reconciling such conflicts is a part of the validation process, hence part of the verifier's business logic, and therefore out of scope for this specification.
        protocol_steps:
          - "F13 4"
    error_states:
      - "status-unavailable"
      - "unacceptable"
    terminal_states:
      - "no-status-information"
      - "status-unavailable"
      - "acceptable"
      - "unacceptable"
    unspecified:
      - "status values"
      - "retrieval failure"
      - "caching and freshness of status information"
      - "whether status is verification or validation (T-07)"
  - id: "M05"
    name: "credential-refresh"
    locator: "§5.4"
    actor: "holder or verifier"
    protocol_flow: "F14"
    purpose: "When a refresh is expected and what is sent; the response is not defined."
    delegated_to_other_specifications:
      - "request and response: the refreshService type"
    initial: "credential-held"
    states:
      - name: "credential-held"
        meaning: "A party holds a credential."
        kind: "normal"
        basis: "stated"
      - name: "not-offered"
        meaning: "No refreshService for this party."
        kind: "terminal"
        basis: "stated"
      - name: "offered"
        meaning: "A refreshService is present and meant for this party."
        kind: "normal"
        basis: "stated"
      - name: "applicable"
        meaning: "Refresh is expected to be used now."
        kind: "normal"
        basis: "stated"
      - name: "requested"
        meaning: "The type's request has been sent."
        kind: "normal"
        basis: "stated"
      - name: "refreshed"
        meaning: "A refreshed credential was received."
        kind: "terminal"
        basis: "inferred"
      - name: "refresh-failed"
        meaning: "The refresh did not produce a credential."
        kind: "terminal-error"
        basis: "inferred"
    transitions:
      - id: "M05-T01"
        from: "credential-held"
        to: "not-offered"
        trigger: "completion"
        guard: "No refreshService meant for this party."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§5.4"
            source_lines: "2922"
            status: "normative"
            quote: |-
              This specification defines a refreshService property, which enables an issuer to include a link to a refresh service.
      - id: "M05-T02"
        from: "credential-held"
        to: "offered"
        trigger: "completion"
        guard: >-
          refreshService in the credential (verifier, holder or both), or in a presentation for
          the holder (T-12).
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§5.4"
            source_lines: "2923"
            status: "normative"
            quote: |-
              The issuer can include the refresh service as an element inside the verifiable credential if it is intended for either the verifier or the holder (or both), or inside the verifiable presentation if it is intended for the holder only.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0232"
        constrained_by_text: []
        protocol_steps:
          - "F14 1"
      - id: "M05-T03"
        from: "offered"
        to: "applicable"
        trigger: "refresh-applicable"
        guard: "The credential has expired (M03 expired) or its issuer publishes no status information."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§5.4"
            source_lines: "2924"
            status: "normative"
            quote: |-
              The refresh service is only expected to be used when either the credential has expired or the issuer does not publish credential status information.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0233"
        constrained_by_text: []
        protocol_steps:
          - "F14 2"
      - id: "M05-T04"
        from: "applicable"
        to: "requested"
        trigger: "refresh-request"
        guard: "always"
        actions: "Send what the type defines (Example 27: POST the credential to url)."
        basis: "stated"
        quotes:
          - at: "§5.4"
            source_lines: "2926"
            status: "normative"
            quote: |-
              Each refreshService value MUST specify its type.
          - at: "§5.4"
            source_lines: "2949"
            status: "normative"
            quote: |-
              In the example above, the issuer specifies an automatic refreshService that can be used by POSTing the verifiable credential to the refresh service url.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0235"
        constrained_by_text:
          - "§5.4: Each refreshService value MUST specify its type"
        protocol_steps:
          - "F14 3"
      - id: "M05-T05"
        from: "requested"
        to: "refreshed"
        trigger: "refreshed-credential-received"
        guard: "always"
        actions: "Start M03 for the new credential."
        basis: "inferred"
        inferred_reason: "No response is defined (T-27)."
        quotes:
          - at: "§5.4"
            source_lines: "2926"
            status: "normative"
            quote: |-
              The precise content of each refresh service is determined by the specific refreshService type definition.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0236"
        constrained_by_text: []
        protocol_steps:
          - "F14 4"
      - id: "M05-T06"
        from: "requested"
        to: "refresh-failed"
        trigger: "refresh-failed"
        guard: "always"
        actions: "none stated"
        basis: "inferred"
        inferred_reason: "No failure is defined (E-15)."
        quotes:
          - at: "§5.4"
            source_lines: "2926"
            status: "normative"
            quote: |-
              The precise content of each refresh service is determined by the specific refreshService type definition.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0236"
        constrained_by_text: []
        protocol_steps:
          - "F14 3"
    error_states:
      - "refresh-failed"
    terminal_states:
      - "not-offered"
      - "refreshed"
      - "refresh-failed"
    unspecified:
      - "the response"
      - "the identity of the refreshed credential"
      - "authentication of the requester"
      - "refresh of a revoked or suspended credential"
  - id: "M06"
    name: "validation"
    locator: "Appendix A, §8.11, §5.1"
    actor: "verifier"
    protocol_flow: "F12"
    purpose: >-
      Non-normative throughout. The checks may run in any order and the source gives an outcome
      for only the type check and the privacy rejection; every other rejection is this model's
      reading of an expected check.
    order:
      - at: "§8.11"
        source_lines: "3716"
        status: "non-normative (section)"
        quote: |-
          This evaluation might be done in any manner desired as long as it satisfies the requirements of the verifier doing the validation.
    delegated_to_other_specifications:
      - "business rules"
      - "trust in issuers"
      - "status (M04) and schema evaluation by type"
    initial: "verified-input"
    states:
      - name: "verified-input"
        meaning: "A verified document and the §7.1 metadata."
        kind: "normal"
        basis: "stated"
      - name: "checking"
        meaning: "The verifier's checks are running, in any order."
        kind: "normal"
        basis: "stated"
      - name: "accepted"
        meaning: "Every applied check passed."
        kind: "terminal"
        basis: "inferred"
      - name: "rejected"
        meaning: "A check failed."
        kind: "terminal-error"
        basis: "stated"
    transitions:
      - id: "M06-T01"
        from: "verified-input"
        to: "checking"
        trigger: "completion"
        guard: "always"
        actions: "Start checks."
        basis: "stated"
        quotes:
          - at: "Appendix A.7"
            source_lines: "4075"
            status: "non-normative (section)"
            quote: |-
              is always considered a component of validation, which is performed after verification.
        protocol_steps:
          - "F09 X6"
      - id: "M06-T02"
        from: "checking"
        to: "rejected"
        trigger: "completion"
        guard: >-
          Mandatory claims of the requested type are missing, or the input is malformed for its
          type.
        actions: "none"
        basis: "stated"
        quotes:
          - at: "Appendix A.1"
            source_lines: "4024"
            status: "non-normative (section)"
            quote: |-
              A verifier's validation of a verifiable credential will fail when mandatory claims are not included, and any claim that is not associated with the specific type will be ignored. In other words, a verifier will perform input validation on the verifiable credential it receives and will reject malformed input based on the credential type specification.
        protocol_steps:
          - "F12 1"
      - id: "M06-T03"
        from: "checking"
        to: "rejected"
        trigger: "completion"
        guard: "M03 is not-yet-valid or expired and the verifier's range excludes it."
        actions: "none"
        basis: "inferred"
        inferred_reason: "Appendix A states the check, not its outcome."
        quotes:
          - at: "Appendix A.7"
            source_lines: "4075"
            status: "non-normative (section)"
            quote: |-
              The verifier expects that the validFrom and validUntil properties will be within a certain range.
        protocol_steps:
          - "F12 4"
      - id: "M06-T04"
        from: "checking"
        to: "rejected"
        trigger: "completion"
        guard: "Verification-material metadata shows the key suspended, revoked or expired."
        actions: "none"
        basis: "inferred"
        inferred_reason: "Stated as something implementations are expected to ensure; no outcome."
        quotes:
          - at: "Appendix A.6"
            source_lines: "4068"
            status: "non-normative (section)"
            quote: |-
              The public key is not suspended, revoked, or expired.
        protocol_steps:
          - "F12 5"
      - id: "M06-T05"
        from: "checking"
        to: "rejected"
        trigger: "completion"
        guard: "M04 ended in unacceptable."
        actions: "none"
        basis: "inferred"
        inferred_reason: "As M06-T03."
        quotes:
          - at: "Appendix A.8"
            source_lines: "4080"
            status: "non-normative (section)"
            quote: |-
              If the credentialStatus property is available, the status of a verifiable credential is expected to be evaluated by the verifier according to the credentialStatus type definition for the verifiable credential and the verifier's own status evaluation criteria.
        protocol_steps:
          - "F12 6"
      - id: "M06-T06"
        from: "checking"
        to: "rejected"
        trigger: "completion"
        guard: "The credentialSchema check fails."
        actions: "none"
        basis: "inferred"
        inferred_reason: "As M06-T03."
        quotes:
          - at: "Appendix A.9"
            source_lines: "4085"
            status: "non-normative (section)"
            quote: |-
              then a verifier can ensure a credential's data is valid against the given JSON Schema.
        protocol_steps:
          - "F12 7"
      - id: "M06-T07"
        from: "checking"
        to: "rejected"
        trigger: "completion"
        guard: >-
          The issuer is not trusted for these claims, or the verified controller does not map to
          the issuer.
        actions: "none"
        basis: "inferred"
        inferred_reason: "Trust is out of scope; the controller-to-issuer mapping is non-normative (T-09)."
        quotes:
          - at: "Appendix A.10"
            source_lines: "4091"
            status: "non-normative (section)"
            quote: |-
              The issuer is trusted by the verifier to make the claims at hand.
          - at: "§5.1"
            source_lines: "2618"
            status: "non-normative (section)"
            quote: |-
              How verifiers decide which issuers to trust, and for what data or purposes, is out of scope for this recommendation.
        protocol_steps:
          - "F12 3"
          - "F12 8"
      - id: "M06-T08"
        from: "checking"
        to: "rejected"
        trigger: "completion"
        guard: "The credential produces privacy violations and the verifier chooses to reject."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§8.11"
            source_lines: "3723"
            status: "non-normative (section)"
            quote: |-
              Verifiers are urged to consider rejecting credentials that produce privacy violations or that enable substandard privacy practices.
        protocol_steps:
          - "F12 9"
      - id: "M06-T09"
        from: "checking"
        to: "accepted"
        trigger: "completion"
        guard: "Every check the verifier applies passes."
        actions: "Rely on the claims."
        basis: "inferred"
        inferred_reason: "No outcome value is defined."
        quotes:
          - at: "§1.1"
            source_lines: "200"
            status: "non-normative (section)"
            quote: |-
              Such reliance only occurs after evaluating the issuer, the proof, the subject, and the claims against one or more verifier policies.
        protocol_steps:
          - "F12 10"
    error_states:
      - "rejected"
    terminal_states:
      - "accepted"
      - "rejected"
    unspecified:
      - "outputs and error signals"
      - "which checks are applied"
      - "their order"
  - id: "M07"
    name: "media-type-precision"
    locator: "§6.2 (Media Type Precision)"
    actor: "verifier (any receiver)"
    protocol_flow: "F08"
    purpose: >-
      The non-normative procedure printed in §6.2 for a payload labelled application/json or
      ld+json.
    initial: "payload-received"
    states:
      - name: "payload-received"
        meaning: "A payload with a lower-precision media type."
        kind: "normal"
        basis: "stated"
      - name: "parsed"
        meaning: "Parsed as JSON."
        kind: "normal"
        basis: "stated"
      - name: "context-matched"
        meaning: "First @context element is the base context URL."
        kind: "normal"
        basis: "stated"
      - name: "assumed-vp"
        meaning: "Treated as application/vp; the usual checks follow."
        kind: "terminal"
        basis: "stated"
      - name: "assumed-vc"
        meaning: "Treated as application/vc; the usual checks follow."
        kind: "terminal"
        basis: "stated"
      - name: "undetermined"
        meaning: "No higher-precision type could be determined."
        kind: "terminal-error"
        basis: "inferred"
    transitions:
      - id: "M07-T01"
        from: "payload-received"
        to: "parsed"
        trigger: "payload-received"
        guard: "Parses as JSON."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§6.2"
            source_lines: "3326"
            status: "non-normative (section)"
            quote: |-
              Parse the payload as a JSON document.
        protocol_steps:
          - "F08 2"
      - id: "M07-T02"
        from: "payload-received"
        to: "undetermined"
        trigger: "payload-received"
        guard: "Does not parse."
        actions: "none stated"
        basis: "inferred"
        inferred_reason: "The procedure has no failure branch."
        quotes:
          - at: "§6.2"
            source_lines: "3326"
            status: "non-normative (section)"
            quote: |-
              Parse the payload as a JSON document.
        protocol_steps:
          - "F08 2"
      - id: "M07-T03"
        from: "parsed"
        to: "context-matched"
        trigger: "completion"
        guard: "First @context element is the base context URL."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§6.2"
            source_lines: "3327"
            status: "non-normative (section)"
            quote: |-
              Ensure that the first element of the @context property matches https://www.w3.org/ns/credentials/v2.
        protocol_steps:
          - "F08 2"
      - id: "M07-T04"
        from: "parsed"
        to: "undetermined"
        trigger: "completion"
        guard: "It is not."
        actions: "none stated"
        basis: "inferred"
        inferred_reason: "As M07-T02."
        quotes:
          - at: "§6.2"
            source_lines: "3327"
            status: "non-normative (section)"
            quote: |-
              Ensure that the first element of the @context property matches https://www.w3.org/ns/credentials/v2.
        protocol_steps:
          - "F08 2"
      - id: "M07-T05"
        from: "context-matched"
        to: "assumed-vp"
        trigger: "completion"
        guard: "Top-level type contains VerifiablePresentation."
        actions: "Assume application/vp."
        basis: "stated"
        quotes:
          - at: "§6.2"
            source_lines: "3328"
            status: "non-normative (section)"
            quote: |-
              Assume an application/vp media type if the JSON document contains a top-level type property containing a VerifiablePresentation element.
        protocol_steps:
          - "F08 3"
      - id: "M07-T06"
        from: "context-matched"
        to: "assumed-vc"
        trigger: "completion"
        guard: "Top-level type contains VerifiableCredential."
        actions: "Assume application/vc."
        basis: "stated"
        quotes:
          - at: "§6.2"
            source_lines: "3329"
            status: "non-normative (section)"
            quote: |-
              Assume an application/vc media type if the JSON document contains a top-level type property containing a VerifiableCredential element.
        protocol_steps:
          - "F08 3"
      - id: "M07-T07"
        from: "context-matched"
        to: "undetermined"
        trigger: "completion"
        guard: "Neither type."
        actions: "none stated"
        basis: "inferred"
        inferred_reason: "As M07-T02."
        quotes:
          - at: "§6.2"
            source_lines: "3329"
            status: "non-normative (section)"
            quote: |-
              Assume an application/vc media type if the JSON document contains a top-level type property containing a VerifiableCredential element.
        protocol_steps:
          - "F08 3"
    error_states:
      - "undetermined"
    terminal_states:
      - "assumed-vp"
      - "assumed-vc"
      - "undetermined"
    unspecified:
      - "a document whose top-level type carries both values enables M07-T05 and M07-T06 at once; the source orders the two checks only by printing the presentation check first"
      - "what follows undetermined"
  - id: "M08"
    name: "related-resource-check"
    locator: "§5.3"
    actor: "conforming-verifier-implementation"
    protocol_flow: "F11"
    purpose: >-
      One relatedResource entry, from reference to verdict. The MUSTs apply only when the
      verifier uses the resource; a locally cached copy is in scope as well as a retrieved one.
