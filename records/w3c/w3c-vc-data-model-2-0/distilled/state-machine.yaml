        guard: "status true."
        actions: "none"
        basis: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "3372"
            status: "normative"
            quote: |-
              Return result.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0283"
        constrained_by_text: []
        protocol_steps:
          - "F09 3"
      - id: "M09-T06"
        from: "verified"
        to: "replay-rejected"
        trigger: "challenge-seen-before"
        guard: "The challenge is not one this verifier issued, or was already used."
        actions: "none stated"
        basis: "inferred"
        inferred_reason: "Uniqueness enforcement is stated (non-normative); the rejection is this model's."
        quotes:
