note: >-
  Machines a test harness can drive. M01 is the §7.1 verification algorithm exactly as printed;
  M02 is the verifier's receiving lifecycle around it, including the two verifier MUSTs §7.1
  does not place; M03 (validity period), M04 (status entries) and M05 (refresh) are the
  credential lifecycle; M06 is validation (non-normative); M07 the §6.2 media-type procedure;
  M08 one related-resource check; M09 a presentation's freshness. The source defines no issuer
  or holder state: issuing and presenting are procedures in protocol.yaml (F01, F05).
  Conventions as protocol.yaml: basis is stated or inferred on every state and transition; every
  inferred transition, and no stated one, carries inferred_reason (an inferred state's meaning
  says what it stands for); a trigger is a messages_used entry (kind message, resolves_to its MU
  id) or a named event; completion is the UML completion event. guard and actions are this
  file's words, quotes carry the source's ({at, source_lines, status, quote}, cut by script).
  constrained_by lists requirement ids joined by script exactly as protocol.yaml
  conventions.constrained_by says (selectors under constrained_by_text, then quote joins), true
  of the requirements.yaml sha256 in coverage only; protocol_steps names the protocol.yaml steps
  a transition renders; unspecified lists situations the source leaves open, which are not
  transitions. State kinds: normal, error (an error that the machine continues from), terminal,
  terminal-error.
