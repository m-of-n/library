    text: 'Evidence can be included by an issuer to provide the verifier with additional supporting information in a verifiable credential. This could be used by the verifier to establish the confidence with which it relies on the claims in the verifiable credential. For example, an issuer could check physical documentation provided by the subject or perform a set of background checks before issuing the credential. In certain scenarios, this information is useful to the verifier when determining the risk associated with relying on a given credential. This specification defines the evidence property for expressing evidence information. evidence If present, the value of the evidence property MUST be either a single object or a set of one or more objects.'
