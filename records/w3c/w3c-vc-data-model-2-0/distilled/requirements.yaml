    text: 'NOT VERBATIM. A language value object, as R-0162 and R-0164 admit one, has a normative description only in §4.6 (R-0166: an object containing @value, @language and @direction); which of these it must contain, and that it may contain nothing else, is stated only in §11.1, a section marked non-normative. A test of R-0162 and R-0164 can therefore apply the §11.1 rules only as the description those statements point at, not as requirements of their own.'
