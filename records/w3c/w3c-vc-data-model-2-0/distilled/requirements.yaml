    text: 'To extend integrity protection to a related resource, an issuer of a verifiable credential MAY include the relatedResource property: relatedResource The value of the relatedResource property MUST be one or more objects of the following form: | Property | Description | id | The identifier for the resource is REQUIRED and conforms to the format defined in Section 4.4 Identifiers.'
