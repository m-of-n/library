    grounds:
      - source_lines: '1198'
        text: 'To express a string with language and base direction information, one can use an object that contains the @value, @language, and @direction properties to express the text value, language tag, and base direction, respectively.'
      - source_lines: '3941'
        text: 'When the language value object is used in place of a string value, the object MUST contain a @value property whose value is a string, and SHOULD contain a @language property whose value is a string containing a well-formed Language-Tag as defined by [BCP47], and MAY contain a @direction property whose value is a base direction string defined by the @direction property in [JSON-LD11]. The language value object MUST NOT include any other keys beyond @value, @language, and @direction.'
    note: 'the second ground is the withdrawn R-0118 and R-0119, quoted so a reader need not open the source (SD-1)'
