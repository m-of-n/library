note: >-
  Ids are stable and never reused. Cite as w3c-vc-data-model-2-0#R-NNNN. R-0001 to R-0127 are the
  skeleton's (bin/fx1-skeleton); R-0128 onward were issued by pass 1 in source order. 298
  entries: 81 skeleton, unsplit, 40 split parents, 83 split_of children, 8 inferred, 37 hunted
  keyword-less, 43 promoted candidates, 6 withdrawn. Entries are in source order; a split parent
  is followed by its children.

  SOURCE TEXT. Every stated text is a contiguous span of .cache/w3c-vc-data-model-2-0.txt (5009
  lines, sha256 73d91cc0b6a7d582512eb06d45a5fcfa8c696ab094b3db44f7a1495e9d3da548), the lead's
  render_w3c.py rendering of the W3C HTML whose digest is content.sha256 (a9196a3d…4156f8,
  verified this pass). The rendering puts one HTML block element on a line and collapses
  whitespace, and this pass replayed it over the HTML to map every line to its element and to the
  sections, notes and examples around it, byte-identical to the .txt. Because ReSpec paragraphs
  carry no blank line between them, the skeleton's sentences run across block boundaries: a
  definition term into its definition, a lead-in into its list, an example's tail into the next
  paragraph. Those entries are split.

  SPLITS. A skeleton entry whose text holds more than one statement, or whose text crosses a
  block boundary, keeps its id, text and count and gains split_into; each child (split_of) is a
  sub-span cut by script from the source lines named, with tight source_lines, and carries
  exactly one statement. A clause-level child ends where its clause does and is not given the
  sentence's full stop. The parent's verb is the first keyword of its text, because bin/validate
  wants one; its actor, object and field list its children's; it is never tested as a whole.
  Material the children leave out of a parent is a definition term, a list lead-in, an example
  title or tab label, a note, or advice without a keyword, and each parent's note says which. Not
  split: R-0056, R-0058, R-0090 and R-0104, whose texts carry the list lead-in every item of
  their list shares; R-0068, whose one SHOULD governs both list items.

  VERBS. verb is the keyword as printed, or none for a keyword-less statement (a promoted
  candidate, a hunted text, an inferred entry, or R-0001, whose keyword is a mention). The
  document uses MUST, MUST NOT, SHOULD, SHOULD NOT, MAY, RECOMMENDED, REQUIRED and OPTIONAL; it
  never uses SHALL, SHALL NOT or NOT RECOMMENDED in capitals. Lowercase is not BCP 14 (§1.3 ¶2,
  line 227): optional at line 2471 is the one lowercase twin of an OPTIONAL and is carried as
  R-0199 with verb none.

  ACTORS. actor is who must comply, in the sentence's words where it names one; where it is
  passive or names only its object, the actor is attributed and says (the sentence names no
  actor). Statements about a document's content are attributed to the conforming document; the
  classes of §1.3 are the conforming issuer and verifier implementations.

  LOCATORS. §N or Appendix N as the .txt heading prints it, then ¶n: the n-th block of the
  section's own body from its heading, one per .txt line (paragraph, list item, definition term,
  definition, table row, figure caption), except that an example counts one, whatever its length,
  and a note, title and body, counts one; subsections are left out. An unnumbered subsection
  (ReSpec prints it without a number, as in §4.13 and §5.2) opens its own count and is named in
  guillemets. A definition is followed by its term in parentheses; a §7.1 algorithm item by its
  step number. A multi-line text gives its first and last ¶. Computed by script from the replayed
  element map; bin/check-locators reads only the section part.

  TESTABLE. yes when a conformance test can observe the behaviour in a document or at an
  interface; partial or no carries a testable_reason. A MAY or an OPTIONAL is yes where the
  permitted behaviour can be observed when an implementation takes it up. note records a source
  tension or defect that bears on the entry; SD-n refers to normative.md's list.

  IDENTICAL TEXTS. 5 groups of stated entries carry identical text, the source restating one rule
  per object: R-0146, R-0184, R-0243; R-0029, R-0079; R-0186, R-0201, R-0245; R-0187, R-0246;
  R-0030, R-0205, R-0080. bin/check-id-joins --surface lists 3 of them: it skips texts under 40
  characters, and the other 2 are shorter but no less identical. Tell them apart by locator,
  object and field, and emit any citation of them from this table by script.

  CANDIDATES. Every one of the 384 in inferred-candidates.yaml has a verdict: 345 reject, 39
  stated. A stated verdict names the requirements cut from it; most rejections are mechanical,
  the candidate lying wholly in a section, note or example the document marks non-normative, and
  each says which line makes it so.

  INFERRED. Entries of kind inferred are this extraction's words, prefixed NOT VERBATIM, each
  with grounds cut from the source: R-0131, R-0142, R-0165, R-0175, R-0231, R-0278, R-0280,
  R-0293. None carries a keyword.

  WITHDRAWN. R-0118, R-0119, R-0120, R-0121, R-0122, R-0123: the §11.1 and §11.2 sentences,
  non-normative by their section; see the reconciliation.
