    source_lines: '1279-1282'
    text: 'This specification defines a property for expressing the issuer of a verifiable credential. A verifiable credential MUST have an issuer property. issuer The value of the issuer property MUST be either a URL or an object containing an id property whose value is a URL; in either case, the issuer selects this URL to identify itself in a globally unambiguous way.'
