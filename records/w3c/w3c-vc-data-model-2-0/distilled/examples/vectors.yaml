count_reconciliation: "175 fixtures = 112 pre + 9 jwt-compact + 9 sd-jwt-compact + 9 cose-text + 36 disclosure, in 40 examples (the REC numbers them 1 to 40). 40 vectors, one per example. A check is a pass, a fail, a deviation (a SHOULD-profile miss), unverifiable (a signature with no key in the source) or na (nothing to check on that display). Counts are of results.derived.json as written by schema/run_checks.derived.py examples; --check recomputes and diffs."

# Conventions
#   ids        EX-<NN>: Example NN of the REC. A tabbed example (3, 4, 5, 7, 8, 9, 11, 22, 35) has 7 tabs (Credential, ecdsa, ecdsa-sd, bbs, jose, cose, sd-jwt); its fixtures are named ex<NN>-<tab>-<block>.<ext>.
#   fixtures   verbatim: the text content of the HTML element, <br> read as LF, entities decoded, respec highlighting spans dropped. A non-breaking space stays U+00A0 (the SD-JWT Decoded tabs use them).
#   expect     what the REC's text leads a reader to expect of the data-model object on that display; not what the checks found. Where the two differ the vector names a defect (D-nn).
#   checks     results of schema/run_checks.derived.py: parse, MUST and SHOULD profile against the derived schemas, cross-field rules (X-nn), decoding of the JWS, COSE and SD-JWT forms and comparison with the sibling tabs.
#   signatures no key is printed for any signature, so every signature check is unverifiable; nothing here verifies one.
#   not repaired: a defect is recorded under defects:, never fixed in a fixture.
defects:
  - id: D-01
    finding: "Example 25 prints two digestSRI values (L2898-L2909 region) with 65 base64 characters after the sha384- prefix; SHA-384 is 48 octets, 64 characters. Removing the leading M of each gives exactly the SHA-384 of the files fetched 2026-11-07 (credentials/v2 and credentials/examples/v2). The HTML wraps each value in a vc-hash span with data-hash-url, so the extra character comes from the REC's build tooling, not from a typo in the prose. Example 26 (digestMultibase) is exact. Not repaired."
  - id: D-02
    finding: "Examples 17, 20, 21 (ellipsis placeholders) and 29, 35 (whole-line // comments) are not JSON. §1.3 (L232) says the REC's examples may contain inline comments and an ellipsis and tells implementers to remove them: acknowledged, recorded, not repaired. For 29 and 35 the checks also ran on a view with the comment lines dropped in memory."
  - id: D-03
    finding: "Example 28 wraps the credential in a second pair of braces (the first line is a lone { and the last a lone }), so the document is not JSON. Not an acknowledged class. Not repaired."
  - id: D-04
    finding: "Example 31 writes member names without quotes (@context, type, verifiableCredential and the proof members) and has no comma after the first member; also an ellipsis inside a string. Not JSON, not an acknowledged class. Not repaired."
  - id: D-05
    finding: "Example 16 prints one SD-JWT whose last disclosure is not followed by a tilde, where every one of the nine tabbed SD-JWTs of this REC ends with a tilde; the check that splits it reports the last element as a disclosure with no tilde after it. The text is also wrapped over several lines inside the display. The Issuer-signed JWT, five of six disclosures and the digests are otherwise consistent. Not repaired."
  - id: D-06
    finding: "Example 36 is a design pattern, not a document: it has no comma between the @language and @direction members and uses the placeholders LANGUAGE and DIRECTION. Even wrapped in braces it is not JSON. A template, recorded, not repaired."
  - id: D-07
    finding: "Example 6 (the REC's own illustration of name and description) uses arrays of language value objects, which §4.6 does not allow (the value MUST be a string or a language value object) but §6 (L3240) and §11.1 (L3961) allow. Tension T-03: the example follows §6 and §11.1."
  - id: D-08
    finding: "Example 1 has no issuer, so it is not a verifiable credential by §4.7; it is the template a developer sends to an issuer (L338). Expected to fail the MUST profile; recorded, not a defect of the REC."
  - id: D-09
    finding: "Example 22 has only one type value (VerifiableCredential), so it deviates from the SHOULD of §4.5 (L908) to give a narrower type. The SHOULD profile reports the deviation on 9 displays of Example 22 (the Credential tab, the three Data Integrity tabs, the JOSE and COSE application/vc payloads, the decoded JWS payload, the decoded COSE payload, and the SD-JWT with its disclosures applied). Not a defect: a SHOULD."
