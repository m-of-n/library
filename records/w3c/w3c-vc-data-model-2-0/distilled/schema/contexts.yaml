    - topic: "validFrom/validUntil datatype"
      finding: "The REC requires a dateTimeStamp string (§4.9, L2030 and L2032; §5.8). The v2 context types both terms as xsd:dateTime (\"@type\": \"http://www.w3.org/2001/XMLSchema#dateTime\"). dateTimeStamp is the XSD 1.1 restriction of dateTime that makes the timezone mandatory; the context does not enforce it and JSON-LD processing accepts a zoned-less xsd:dateTime lexical form. The REC compensates in prose (§5.8: an offset-less value MUST be interpreted as UTC), so the MUST is carried by the schema pattern and by cross-field rule X-02, not by the context."
    - topic: "credentialStatus is the term, `status` is not"
      finding: "§4.2 lists the property as `status` (L375) and its sentence points to §4.10; §4.10 and the Examples use credentialStatus (L2272). The context and the vocabulary define credentialStatus only (the one `status` key in the context is a nested term inside BitstringStatusListEntry.statusMessage, unrelated to the VC property). Treat `status` as a prose defect of §4.2."
    - topic: "credentialRefresh"
      finding: "§B.2 (L4132) says RefreshService types are placed into the `credentialRefresh` property; the context and §5.4 define refreshService. A prose defect of §B.2."
    - topic: "proof"
      finding: "Not defined by this REC at all. The v2 context defines `proof` (scoped inside VerifiableCredential and VerifiablePresentation, @container @graph); the REC only names it as a property \"defined in [VC-DATA-INTEGRITY]\" (§5.13, L3232). The DI terms (DataIntegrityProof, cryptosuite, proofPurpose, proofValue, verificationMethod, created, expires, domain, challenge, nonce, previousProof) are defined in the same file, so the Data Integrity lane cites this file."
    - topic: "JWT/JOSE claim terms"
      finding: "The v2 context also defines _sd, _sd_alg, aud, cnf (with kid and jwk), exp, iat, iss, jku, kid, nbf, sub, x5u and a key literally named \"...\" mapped to https://www.iana.org/assignments/jwt#... . None is defined or mentioned by name in this REC as a context term; they serve SD-JWT/JOSE processing (VC-JOSE-COSE). The REC never says the base context contains them."
    - topic: "terms not defined by the REC but present"
      finding: "JsonSchema, JsonSchemaCredential, BitstringStatusList, BitstringStatusListEntry, BitstringStatusListCredential are in the v2 context. The REC uses JsonSchema and BitstringStatusListEntry in examples and in the §4.5 type table but defines neither; they come from VC JSON Schema and Bitstring Status List."
    - topic: "verifiableCredential scoped @context null"
      finding: "In VerifiablePresentation the term verifiableCredential has \"@context\": null and \"@container\": \"@graph\", which is how the embedded credentials become separate named graphs (§5.12, L3212; §6.1 L3252) and resets their processing context. The REC states the graph behaviour but not the null reset."
