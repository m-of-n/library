# DERIVED, not verbatim. Cross-field and procedural rules of the Verifiable Credentials Data Model v2.0 that JSON Schema cannot state.
# Written by this library from the plain-text rendering .cache/w3c-vc-data-model-2-0.txt (sha256 73d91cc0b6a7d582512eb06d45a5fcfa8c696ab094b3db44f7a1495e9d3da548).
# Each rule: quote: beside source_lines: (single-line span, copied by script, checked by bin/check-quotes); rule: is this library's wording of what the
# quoted sentence requires; enforced_by: says where it is checked, or why it is not. Nothing here is the source's own grammar.
record: w3c-vc-data-model-2-0
reviewed_by: ""
kind: cross-field-rules
extracted: "2026-11-07"
rules:
  - id: X-01
    level: "MUST"
    kind: stated
    locator: "§4.9"
    source_lines: "2030"
    requirements:
      - "w3c-vc-data-model-2-0#R-0180"
    quote: "If a validUntil value also exists, the validFrom value MUST express a point in time that is temporally the same or earlier than the point in time expressed by the validUntil value."
    rule: "validFrom is the same instant as validUntil or earlier, compared as points on a timeline after converting both to UTC (not as strings). L2032 says the same from validUntil's side."
    enforced_by: "run_checks.derived.py x01 (every credential and every embedded credential in the examples)"
  - id: X-02
    level: "MUST"
    kind: stated
    locator: "§5.8"
    source_lines: "3169"
    requirements:
      - "w3c-vc-data-model-2-0#R-0083"
    quote: "Time values that are incorrectly serialized without an offset MUST be interpreted as UTC."
    rule: "A time value with no offset is read as UTC. For validFrom and validUntil the schema already rejects an offset-less value (their MUST is dateTimeStamp), so this rule is for time values that the data model does not name (for instance in an extension or in a proof). Separately, L3171 warns the dateTimeStamp expression admits dates that do not exist (31 days in every month): a match is necessary, not sufficient, so a date library must parse the value."
    enforced_by: "none: an interpretation rule for the consumer; the dateTimeStamp pattern is #dateTimeStamp"
  - id: X-03
    level: "MUST"
    kind: stated
    locator: "§5.3"
    source_lines: "2885"
    requirements:
      - "w3c-vc-data-model-2-0#R-0225"
    quote: "The value MUST be unique among the list of related resource objects."
    rule: "No two objects of one relatedResource array share an id."
    enforced_by: "run_checks.derived.py x03"
  - id: X-04
    level: "MUST"
    kind: stated
    locator: "§4.13"
    source_lines: "2475"
    requirements:
      - "w3c-vc-data-model-2-0#R-0043"
    quote: "These objects are called verifiable credential graphs and MUST express information that is secured using a securing mechanism."
    rule: "Every value of verifiableCredential in a presentation is secured: it carries its own proof, or it is an EnvelopedVerifiableCredential, or (§4.13 L2543) it is a self-asserted credential secured only by the presentation's own mechanism, in which case the presentation has a holder (X-05). Whether a proof is valid is outside this source."
    enforced_by: "none: depends on the securing mechanism; #vcOrEnvelopedVC checks the shape only"
  - id: X-05
    level: "MUST"
    kind: stated
    locator: "§4.13"
    source_lines: "2543"
    requirements:
      - "w3c-vc-data-model-2-0#R-0054"
    quote: "A verifiable presentation that includes a self-asserted verifiable credential, which is secured only using the same mechanism as the verifiable presentation, MUST include a holder property."
    rule: "If an embedded credential is self-asserted (its issuer value is identical to the presentation holder value, L2545) and it has no securing mechanism of its own, the presentation has holder. The run_checks check reports how many embedded credentials are self-asserted by the identity test; it cannot decide \"secured only using the same mechanism\" from the object alone."
    enforced_by: "run_checks.derived.py x05: na when the presentation has no holder, pass when it has one. Pass 2 (verify) found the rule cannot fail on any document: by L2545 a credential is self-asserted only when its issuer value is identical to the presentation's holder value, so a presentation with no holder has no self-asserted credential and R-0054 never applies, while L2541's test (the issuer is the holder entity) is not observable in the document. The first version reported pass with no holder."
  - id: X-06
    level: "MUST"
    kind: stated
    locator: "§4.3"
    source_lines: "393"
    requirements:
      - "w3c-vc-data-model-2-0#R-0011"
    quote: "Subsequent items in the ordered set MUST be composed of any combination of URLs and objects, where each is processable as a JSON-LD Context."
    rule: "Every @context item after the first is a URL or an object and is a processable JSON-LD context. The schema checks URL-or-object; processability needs a JSON-LD processor and the context bytes."
    enforced_by: "schema #context (shape only); processability: none"
  - id: X-07
    level: "MUST"
    kind: stated
    locator: "Appendix B.1"
    source_lines: "4103"
    requirements:
      - "w3c-vc-data-model-2-0#R-0124"
    quote: "Implementations MUST treat the base context value, located at https://www.w3.org/ns/credentials/v2, as already retrieved"
    rule: "A verifier uses a static copy of the base context whose sha-256 is the digest the REC prints. The fetched file in this directory has that digest (59955ced…92734 matches §B.1; contexts.yaml)."
    enforced_by: "checked once for the fetched bytes (contexts.yaml, matches_fetched true); a verifier's own static copy: none"
  - id: X-08
    level: "MUST"
    kind: stated
    locator: "§5.3"
    source_lines: "2895"
    requirements:
      - "w3c-vc-data-model-2-0#R-0071"
    quote: "A conforming verifier implementation that makes use of a resource based on the id of a relatedResource object inside a conforming document with a corresponding cryptographic digest appearing in a relatedResource object value MUST compute the digest of the retrieved resource."
    rule: "When a verifier uses a related resource it recomputes the digest (digestSRI over the bytes with the named hash; digestMultibase per the Data Integrity lane) and, on mismatch (L2895, next sentence), produces an error."
    enforced_by: "examples Examples 25 and 26: the printed digests were recomputed against the fetched contexts (examples/vectors.yaml EX-25, EX-26)"
  - id: X-09
    level: "MUST"
    kind: stated
    locator: "§6.1"
    source_lines: "3257"
    requirements:
      - "w3c-vc-data-model-2-0#R-0108"
    quote: "JSON-LD compacted document form MUST be used for all representations of the data model using the application/vc or application/vp media type."
    rule: "A document carried as application/vc or application/vp is in JSON-LD compacted form (terms are the short aliases of the active context, not full IRIs; one @context at the top). L3260 to L3263 list features that make type-specific processing fail and that authors are urged to avoid."
    enforced_by: "none: needs a JSON-LD processor"
  - id: X-10
    level: "MUST"
    kind: stated
    locator: "§1.3"
    source_lines: "228"
    requirements:
      - "w3c-vc-data-model-2-0#R-0004"
    quote: "A conforming document MUST be secured by at least one securing mechanism as described in Section 4.12 Securing Mechanisms."
    rule: "The object validated by #VerifiableCredential is the data model; being a conforming document additionally needs a securing mechanism: an embedded proof (#VerifiableCredential-embedded-proof) or an enveloping format (JOSE, COSE, SD-JWT), the latter outside this object."
    enforced_by: "schema #VerifiableCredential-embedded-proof for the embedded class only"
  - id: X-11
    level: "MUST (through R-0110, which makes the §7.1 algorithm mandatory; the step, R-0281 and R-0282, has no keyword of its own)"
    kind: stated
    locator: "§7.1"
    source_lines: "3371"
    requirements:
      - "w3c-vc-data-model-2-0#R-0281"
    quote: "If result.status is set to true, ensure that result.document is a conforming document."
    rule: "The verification algorithm re-checks the returned document against the conformance rules; if it fails the status becomes false, document is removed, and at least one MALFORMED_VALUE_ERROR is added."
    enforced_by: "verification-result.derived.schema.json #VerificationResult (status false implies errors, inferred)"
  - id: X-12
    level: "SHOULD"
    kind: stated
    locator: "§5.3"
    source_lines: "2890"
    requirements:
      - "w3c-vc-data-model-2-0#R-0068"
    quote: "If a mediaType is listed, implementations that retrieve the resource identified by the id property using HTTP Semantics SHOULD:"
    rule: "When a relatedResource lists a mediaType and the resource is fetched by HTTP: send that media type in Accept (L2891) and reject a response whose Content-Type differs (L2892)."
    enforced_by: "none: a retrieval procedure"
  - id: X-13
    level: "SHOULD NOT"
    kind: stated
    locator: "§5.3"
    source_lines: "2894"
    requirements:
      - "w3c-vc-data-model-2-0#R-0070"
    quote: "Any objects for which selective disclosure or unlinkable disclosure is desired SHOULD NOT be included as an object in the relatedResource array."
    rule: "An object that is to be selectively disclosed is not listed in relatedResource."
    enforced_by: "none: needs knowledge of what the holder will disclose"
  - id: X-14
    level: "advice (non-normative: §11.2, the withdrawn R-0122 and R-0123)"
    kind: stated
    locator: "§11.2"
    source_lines: "4012"
    requirements:
      - "w3c-vc-data-model-2-0#R-0122"
    quote: "Natural language string values that do not have a language associated with them SHOULD be treated as if the language value is undefined (language tag \"und\")."
    rule: "Reading rule: a text value without a language is \"und\"; without a direction it is \"auto\" (the next sentence of L4012). The document default language and direction come from the context, which JSON Schema cannot see; this is why #textValue-should accepts a bare string."
    enforced_by: "none: depends on the context in force"
  - id: X-15
    level: "MUST"
    kind: stated
    locator: "§4.13"
    source_lines: "2497"
    requirements:
      - "w3c-vc-data-model-2-0#R-0047"
    quote: "The @context property of the object MUST be present and include a context, such as the base context for this specification, that defines at least the id, type, and EnvelopedVerifiableCredential terms as defined by the base context provided by this specification."
    rule: "The @context of an EnvelopedVerifiableCredential defines id, type and EnvelopedVerifiableCredential as the base context does; L2521 makes the same demand for EnvelopedVerifiablePresentation. The base context URL satisfies it (contexts.yaml: both Enveloped terms are defined there)."
    enforced_by: "schema: presence only (#EnvelopedVerifiableCredential, #EnvelopedVerifiablePresentation); definition of the terms: none"
  - id: X-16
    level: "MUST"
    kind: stated
    locator: "§4.13"
    source_lines: "2497"
    requirements:
      - "w3c-vc-data-model-2-0#R-0048"
    quote: "The id value of the object MUST be a data: URL [RFC2397] that expresses a secured verifiable credential using an enveloping security scheme"
    rule: "The data: URL decodes to a secured credential in an enveloping format (L2521: a presentation for the other type). The schema checks the data:[...],... shape only. Examples 18 and 19 elide the payload of their data: URL with an ellipsis, so no fixture of this record can be decoded from its enveloped form."
    enforced_by: "schema: shape only"
  - id: X-17
    level: "MUST (through R-0098; the sentence quoted, part of R-0257, has no keyword of its own)"
    kind: stated
    locator: "§5.13"
    source_lines: "3223"
    requirements:
      - "w3c-vc-data-model-2-0#R-0257"
    quote: "A document that only contains information that was successfully secured."
    rule: "The verifiedDocument member holds only information that the securing mechanism successfully secured (nothing from an unsecured part of the input)."
    enforced_by: "none: depends on the mechanism"
  - id: X-18
    level: "MUST"
    kind: stated
    locator: "§5.2"
    source_lines: "2876"
    requirements:
      - "w3c-vc-data-model-2-0#R-0064"
    quote: "If a conforming document does not use JSON-LD Contexts that define all terms used, it MUST include the https://www.w3.org/ns/credentials/undefined-terms/v2 as the last value in the @context property."
    rule: "If any term in the document is not defined by the contexts in force, the last @context item is the undefined-terms URL. Deciding whether every term used is defined needs a JSON-LD processor with the contexts loaded. Example 28 follows it; Example 1 uses the examples context (which has @vocab) instead."
    enforced_by: "none: needs a JSON-LD processor"
  - id: X-19
    level: "MUST"
    kind: stated
    locator: "§5.10"
    source_lines: "3192"
    requirements:
      - "w3c-vc-data-model-2-0#R-0250"
    quote: "The associated vocabulary URL MUST be https://www.w3.org/2018/credentials#confidenceMethod."
    rule: "The IRI behind the term confidenceMethod is https://www.w3.org/2018/credentials#confidenceMethod, and behind renderMethod (L3193) is https://www.w3.org/2018/credentials#renderMethod. Checked here against the fetched base context: both terms map to those IRIs inside VerifiableCredential's scoped context (both match), and the 2018 vocabulary file defines both."
    enforced_by: "checked against schema/context-credentials-v2.verbatim.jsonld by the script that wrote this file"
  - id: X-20
    level: "advice (no BCP 14 keyword)"
    kind: stated
    locator: "§6.3"
    source_lines: "3346"
    quote: "Ensure that all values associated with a @context property are in the expected order"
    rule: "Type-specific processing (no JSON-LD library) is safe only if the @context values are in the expected order, match known-good hashes, and have been judged appropriate. The text calls it a rule an implementer is advised to follow (L3345); the sentence carries no BCP 14 keyword."
    enforced_by: "none: a deployment procedure"
  - id: X-21
    level: "MUST NOT"
    kind: stated
    locator: "§4.10"
    source_lines: "2341"
    requirements:
      - "w3c-vc-data-model-2-0#R-0031"
    quote: "Credential status specifications MUST NOT enable tracking of individuals"
    rule: "A status type specification must not let the issuer learn that a verifier is interested in a specific holder or subject (no phoning home; no pseudonymity reduction). It constrains status type specifications, not a document."
    enforced_by: "none: a design constraint on other specifications"
