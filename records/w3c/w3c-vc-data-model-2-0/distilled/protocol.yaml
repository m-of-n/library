  - id: "F12"
    name: "validation"
    title: "Validation: the verifier's business rules after verification"
    locator: "§1.1, §2, Appendix A, §8.11, §9.9.2"
    kind: "local-decision"
    source_status: "mixed"
    participants:
      - "verifier"
    summary: >-
      Wholly non-normative and explicitly outside the specification's conformance. The checks
      are those Appendix A says verifiers are expected to make; the order is free and no output,
      status or error signal is defined. Steps are this file's ordering.
    diagram: "protocol.md#f12-validation"
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          Check the credential type: mandatory claims for the requested type present, others
          ignored, malformed input rejected.
        locator: "Appendix A.1"
        basis: "stated"
        quotes:
          - at: "Appendix A.1"
            source_lines: "4024"
            status: "non-normative (section)"
            quote: |-
              A verifier's validation of a verifiable credential will fail when mandatory claims are not included, and any claim that is not associated with the specific type will be ignored. In other words, a verifier will perform input validation on the verifiable credential it receives and will reject malformed input based on the credential type specification.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0017"
          - "w3c-vc-data-model-2-0#R-0018"
        constrained_by_text:
          - "§4.5: software systems SHOULD use the type information"
          - "§4.5: SHOULD convey the associated object types"
        on_error: "stated (non-normative): validation fails; no signal defined (E-11)"
        on_error_basis: "stated"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: >-
          Check subject and holder: optionally authenticate a holder who is the subject, using
          the holder's signature on the presentation and a common identifier in holder and
          credentialSubject.
        locator: "Appendix A.2, Appendix A.4"
        basis: "stated"
        quotes:
          - at: "Appendix A.2"
            source_lines: "4029"
            status: "non-normative (section)"
            quote: |-
              If the holder is also the subject, then the verifier could authenticate the holder if they have verification metadata related to the holder. The verifier could then authenticate the holder using a signature generated by the holder contained in the verifiable presentation.
          - at: "Appendix A.4"
            source_lines: "4051"
            status: "non-normative (section)"
            quote: |-
              The identifier in the holder property of the verifiable presentation and at least one identifier property of at least one object in the credentialSubject array are the same.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0210"
          - "w3c-vc-data-model-2-0#R-0254"
        constrained_by_text:
          - "§4.13: If the holder property is absent, information about the holder is obtained"
          - "§5.12: It is important to not merge objects"
        on_error: "unspecified by source (Appendix A.2, Appendix A.4)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: >-
          verification result (status, document, mediaType, controller,
          controlledIdentifierDocument, warnings, errors)
        message_ref: "MU-09"
        action: >-
          Check the issuer: the controller §7.1 reports for the verification method is typically
          the issuer; some ecosystems use lists of verified issuers. Which issuers to trust is
          the verifier's decision.
        locator: "Appendix A.3, §5.1"
        basis: "stated"
        quotes:
          - at: "Appendix A.3"
            source_lines: "4037"
            status: "non-normative (section)"
            quote: |-
              This metadata includes identification of the verified controller of the verification method used by the securing mechanism to secure each verifiable credential or verifiable presentation, of which the controller is typically the respective issuer or holder.
          - at: "Appendix A.3"
            source_lines: "4038"
            status: "non-normative (section)"
            quote: |-
              Some ecosystems might have more complex relationships between issuers and controllers of verification methods and might use lists of verified issuers in addition to, or instead of, the mapping described above.
          - at: "§5.1"
            source_lines: "2618"
            status: "non-normative (section)"
            quote: |-
              How verifiers decide which issuers to trust, and for what data or purposes, is out of scope for this recommendation.
        on_error: "unspecified by source (Appendix A.3, §5.1)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          Check the validity period against the verifier's expected range (validFrom not in the
          future, validUntil not in the past); see state machine M03.
        locator: "Appendix A.5, Appendix A.7"
        basis: "stated"
        quotes:
          - at: "Appendix A.5"
            source_lines: "4057"
            status: "non-normative (section)"
            quote: |-
              For example, a verifier can check that the start of the validity period for a verifiable credential is not in the future.
          - at: "Appendix A.7"
            source_lines: "4075"
            status: "non-normative (section)"
            quote: |-
              For example, a verifier can check that the end of the validity period of a verifiable credential is not in the past.
        on_error: "unspecified by source (Appendix A.5, Appendix A.7)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "verifier"
        to: "verifier"
        message: "controlled identifier document"
        message_ref: "MU-23"
        action: >-
          Check proof metadata: known suite, required proof properties, acceptably recent
          verification-material metadata, key not suspended, revoked or expired.
        locator: "Appendix A.6"
        basis: "stated"
        quotes:
          - at: "Appendix A.6"
            source_lines: "4067"
            status: "non-normative (section)"
            quote: |-
              Acceptably recent metadata regarding the verification material associated with the signature is available.
          - at: "Appendix A.6"
            source_lines: "4068"
            status: "non-normative (section)"
            quote: |-
              The public key is not suspended, revoked, or expired.
        on_error: "unspecified by source (Appendix A.6)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "verifier"
        to: "status-information-source"
        message: "credentialStatus object"
        message_ref: "MU-12"
        action: "Evaluate credentialStatus by its type definition and the verifier's criteria (F13)."
        locator: "Appendix A.8"
        basis: "stated"
        quotes:
          - at: "Appendix A.8"
            source_lines: "4080"
            status: "non-normative (section)"
            quote: |-
              If the credentialStatus property is available, the status of a verifiable credential is expected to be evaluated by the verifier according to the credentialStatus type definition for the verifiable credential and the verifier's own status evaluation criteria.
        on_error: "unspecified by source (Appendix A.8)"
        on_error_basis: "unspecified"
      - n: "7"
        from: "verifier"
        to: "verifier"
        message: "credentialSchema object"
        message_ref: "MU-18"
        action: >-
          Evaluate credentialSchema by its type (for JsonSchema, validate the data against the
          schema); with several schemas, each type's processing rules decide.
        locator: "Appendix A.9, §4.11"
        basis: "stated"
        quotes:
          - at: "Appendix A.9"
            source_lines: "4085"
            status: "non-normative (section)"
            quote: |-
              If the credentialSchema property is available, the schema of a verifiable credential is expected to be evaluated by the verifier according to the credentialSchema type definition for the verifiable credential and the verifier's own schema evaluation criteria.
          - at: "§4.11"
            source_lines: "2352"
            status: "normative"
            quote: |-
              If multiple schemas are present, validity is determined according to the processing rules outlined by each associated type property.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0193"
          - "w3c-vc-data-model-2-0#R-0194"
        constrained_by_text:
          - "§4.11: The specific type definition determines the precise contents"
        on_error: "unspecified by source (Appendix A.9, §4.11)"
        on_error_basis: "unspecified"
      - n: "8"
        from: "verifier"
        to: "verifier"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          Judge fitness for purpose and the issuer's authority for these claims; respect issuer
          policy unless accepting the liability of ignoring it.
        locator: "Appendix A.10, §9.9.2"
        basis: "stated"
        quotes:
          - at: "Appendix A.10"
            source_lines: "4090"
            status: "non-normative (section)"
            quote: |-
              Fitness for purpose is about whether the custom properties in the verifiable credential are appropriate for the verifier's purpose.
          - at: "Appendix A.10"
            source_lines: "4091"
            status: "non-normative (section)"
            quote: |-
              Policy information expressed by the issuer in the verifiable credential should be respected by holders and verifiers unless they accept the liability of ignoring the policy.
          - at: "§9.9.2"
            source_lines: "3897"
            status: "unmarked subsection of a non-normative section"
            quote: |-
              It is crucial that verifiers also validate any relevant claims, considering the source and nature of the claim alongside the purpose for which the holder presents the credential.
        on_error: "unspecified by source (Appendix A.10, §9.9.2)"
        on_error_basis: "unspecified"
      - n: "9"
        from: "verifier"
        to: "verifier"
        message: "evidence object"
        message_ref: "MU-17"
        action: "Weigh evidence (F16) and consider rejecting credentials that produce privacy violations."
        locator: "§5.6, §8.11"
        basis: "stated"
        quotes:
          - at: "§5.6"
            source_lines: "3015"
            status: "normative"
            quote: |-
              This could be used by the verifier to establish the confidence with which it relies on the claims in the verifiable credential.
          - at: "§8.11"
            source_lines: "3723"
            status: "non-normative (section)"
            quote: |-
              Verifiers are urged to consider rejecting credentials that produce privacy violations or that enable substandard privacy practices.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0077"
        constrained_by_text: []
        on_error: "unspecified by source (§5.6, §8.11)"
        on_error_basis: "unspecified"
      - n: "10"
        from: "verifier"
        to: "verifier"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: "Decide to rely on the claims or not."
        locator: "§1.1, §2"
        basis: "inferred"
        inferred_reason: "The source says reliance follows evaluation; it defines no outcome value."
        quotes:
          - at: "§1.1"
            source_lines: "200"
            status: "non-normative (section)"
            quote: |-
              Such reliance only occurs after evaluating the issuer, the proof, the subject, and the claims against one or more verifier policies.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0135"
          - "w3c-vc-data-model-2-0#R-0138"
        constrained_by_text:
          - "§2: It also specifies that verifiers validate claims"
          - "§2: Verification of a credential does not imply evaluation of the truth"
        on_error: "unspecified by source (Appendix A: no output or error is defined for validation)"
        on_error_basis: "unspecified"
  - id: "F13"
    name: "status-check"
    title: "Checking credential status through credentialStatus"
    locator: "§4.10, Appendix A.8, §8.7, §8.11, §8.14"
    kind: "exchange"
    source_status: "mixed"
    participants:
      - "verifier"
      - "holder"
      - "status-information-source"
      - "issuer"
      - "specification-author"
    summary: >-
      The data model fixes only the entry shape and a privacy constraint on status schemes.
      Format, protocol, status values and conflict resolution are delegated or out of scope; the
      retrieval step is this model's.
    diagram: "protocol.md#f13-status-check"
    steps:
      - n: "1"
        from: "verifier"
        to: "verifier"
        message: "credentialStatus object"
        message_ref: "MU-12"
        action: >-
          Read credentialStatus: one entry or several (for example revocation and suspension),
          each typed.
        locator: "§4.10"
        basis: "stated"
        quotes:
          - at: "§4.10"
            source_lines: "2272"
            status: "normative"
            quote: |-
              If present, the value associated with the credentialStatus property is a single object or a set of one or more objects.
          - at: "§4.10"
            source_lines: "2305"
            status: "normative"
            quote: |-
              A credential can have more than one status associated with it, such as whether it has been revoked or suspended.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0187"
          - "w3c-vc-data-model-2-0#R-0183"
        constrained_by_text:
          - "§4.10: The type property is REQUIRED"
        on_error: "unspecified by source (§4.10)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "verifier"
        to: "status-information-source"
        message: "status information (external)"
        message_ref: "MU-13"
        action: "Obtain the status information the entry's type points to, by that type's protocol."
        locator: "§4.10"
        basis: "inferred"
        inferred_reason: >-
          Retrieval is implied by the external-document example; no retrieval step or protocol
          is stated.
        quotes:
          - at: "§4.10"
            source_lines: "2277"
            status: "normative"
            quote: |-
              The value will provide enough information to determine the current status of the credential and whether machine-readable information will be retrievable from the URL.
          - at: "§4.10"
            source_lines: "2340"
            status: "normative"
            quote: |-
              Defining the data model, formats, and protocols for status schemes is out of the scope of this specification.
        on_error: >-
          unspecified by source (§4.10: unreachable or unknown status information is not
          addressed)
        on_error_basis: "unspecified"
      - n: "3"
        from: "specification-author"
        to: "status-information-source"
        message: "status information (external)"
        message_ref: "MU-13"
        action: >-
          Status schemes must not reveal to the issuer which holder or subject a verifier is
          checking (no phoning home, no pseudonymity reduction); privacy-preserving lists are
          suggested and Oblivious HTTP is one fetching option.
        locator: "§4.10, §8.7, §8.14, §8.11"
        basis: "stated"
        quotes:
          - at: "§4.10"
            source_lines: "2341"
            status: "normative"
            quote: |-
              Credential status specifications MUST NOT enable tracking of individuals, such as an issuer being notified (either directly or indirectly) when a verifier is interested in a specific holder or subject.
          - at: "§8.7"
            source_lines: "3466"
            status: "non-normative (section)"
            quote: |-
              A verifier can reduce its likelihood of signaling to an issuer that the verifier has received a specific verifiable credential. For example, a verifier might fetch an externally linked revocation list while performing status checks on a verifiable credential.
          - at: "§8.14"
            source_lines: "3756"
            status: "non-normative (section)"
            quote: |-
              Specification authors designing revocation mechanisms that do not depend on submitting a unique identifier for a verifiable credential to a query API, and instead use, for example, a privacy-preserving revocation list.
          - at: "§8.11"
            source_lines: "3723"
            status: "non-normative (section)"
            quote: |-
              Issuers are urged to not use mechanisms, such as credential revocation lists that are unique per credential, during the verification process, which could lead to privacy violations.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0031"
          - "w3c-vc-data-model-2-0#R-0189"
        constrained_by_text:
          - "§4.10: MUST NOT enable tracking of individuals"
          - "§4.10: Unacceptable approaches include"
        on_error: "not a runtime error: a constraint on status specifications"
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "verifier"
        message: "status information (external)"
        message_ref: "MU-13"
        action: >-
          Evaluate each entry by its type definition and the verifier's own criteria; reconcile
          conflicting entries as business logic.
        locator: "Appendix A.8, §4.10"
        basis: "stated"
        quotes:
          - at: "Appendix A.8"
            source_lines: "4080"
            status: "non-normative (section)"
            quote: |-
              If the credentialStatus property is available, the status of a verifiable credential is expected to be evaluated by the verifier according to the credentialStatus type definition for the verifiable credential and the verifier's own status evaluation criteria.
          - at: "§4.10"
            source_lines: "2339"
            status: "normative"
            quote: |-
              Reconciling such conflicts is a part of the validation process, hence part of the verifier's business logic, and therefore out of scope for this specification.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0137"
        constrained_by_text:
          - "§2: This includes checking that the credential or presentation conforms"
        on_error: "unspecified by source (§4.10: conflict reconciliation is out of scope; E-13)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "holder"
        to: "status-information-source"
        message: "status information (external)"
        message_ref: "MU-13"
        action: >-
          A holder's wallet may check status the same way (for example by fetching a linked
          revocation list).
        locator: "§8.7"
        basis: "stated"
        quotes:
          - at: "§8.7"
            source_lines: "3465"
            status: "non-normative (section)"
            quote: |-
              A holder using a digital wallet can reduce the chances that they will be tracked by a 3rd party when accessing external links within a verifiable credential stored in their digital wallet. For example, a digital wallet might fetch and render linked images, or it might check the validity of a verifiable credential by fetching an externally linked revocation list.
        on_error: "unspecified by source (§8.7)"
        on_error_basis: "unspecified"
  - id: "F14"
    name: "refresh"
    title: "Refreshing a credential through refreshService"
    locator: "§5.4, Appendix B.2, §8.18"
    kind: "exchange"
    source_status: "mixed"
    participants:
      - "issuer"
      - "holder"
      - "verifier"
      - "refresh-service"
    summary: >-
      The source defines where the refreshService object may be placed, its shape and when it is
      expected to be used; request and response belong to the refresh service type (Example 27's
      type takes a POST of the credential). The placement rule contradicts itself and the base
      context (T-12).
    diagram: "protocol.md#f14-refresh"
    steps:
      - n: "1"
        from: "issuer"
        to: "holder"
        message: "refreshService object"
        message_ref: "MU-14"
        action: >-
          Place refreshService in the credential when meant for the verifier, the holder or
          both, or (per the source) in the presentation when meant for the holder only.
        locator: "§5.4"
        basis: "stated"
        quotes:
          - at: "§5.4"
            source_lines: "2923"
            status: "normative"
            quote: |-
              The issuer can include the refresh service as an element inside the verifiable credential if it is intended for either the verifier or the holder (or both), or inside the verifiable presentation if it is intended for the holder only.
          - at: "§5.4"
            source_lines: "2923"
            status: "normative"
            quote: |-
              In the former case, including the refresh service inside the verifiable credential enables either the holder or the verifier to perform future updates of the credential.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0232"
        constrained_by_text: []
        on_error: "unspecified by source (§5.4)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "holder"
        to: "holder"
        message: "refreshService object"
        message_ref: "MU-14"
        action: >-
          Decide whether refresh applies: expiry, or no status information published by the
          issuer.
        locator: "§5.4"
        basis: "stated"
        quotes:
          - at: "§5.4"
            source_lines: "2924"
            status: "normative"
            quote: |-
              The refresh service is only expected to be used when either the credential has expired or the issuer does not publish credential status information.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0233"
        constrained_by_text: []
        on_error: "unspecified by source (§5.4)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "holder"
        to: "refresh-service"
        message: "refresh request (type-defined; example POSTs the credential)"
        message_ref: "MU-15"
        action: >-
          Send the request the refreshService type defines; for Example 27's type, POST the
          credential to its url.
        locator: "§5.4"
        basis: "stated"
        quotes:
          - at: "§5.4"
            source_lines: "2926"
            status: "normative"
            quote: |-
              The value of the refreshService property MUST be one or more refresh services that provides enough information to the recipient's software such that the recipient can refresh the verifiable credential.
          - at: "§5.4"
            source_lines: "2926"
            status: "normative"
            quote: |-
              The precise content of each refresh service is determined by the specific refreshService type definition.
          - at: "§5.4"
            source_lines: "2949"
            status: "normative"
            quote: |-
              In the example above, the issuer specifies an automatic refreshService that can be used by POSTing the verifiable credential to the refresh service url.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0234"
          - "w3c-vc-data-model-2-0#R-0235"
          - "w3c-vc-data-model-2-0#R-0236"
        constrained_by_text:
          - "§5.4: MUST be one or more refresh services"
          - "§5.4: Each refreshService value MUST specify its type"
        on_error: "unspecified by source (§5.4: no request, response or failure is defined)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "refresh-service"
        to: "holder"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: "Receive the refreshed credential."
        locator: "§5.4"
        basis: "inferred"
        inferred_reason: >-
          The source never says what the service returns, whether the result is a new credential
          (new id, new validity) or what becomes of the old one.
        quotes:
          - at: "§5.4"
            source_lines: "2922"
            status: "normative"
            quote: |-
              It is useful for systems to enable the manual or automatic refresh of an expired verifiable credential.
        on_error: "unspecified by source (§5.4)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "verifier"
        to: "refresh-service"
        message: "refresh request (type-defined; example POSTs the credential)"
        message_ref: "MU-15"
        action: >-
          A verifier may refresh too when the service is in the credential, which can bypass the
          holder.
        locator: "§5.4"
        basis: "stated"
        quotes:
          - at: "§5.4"
            source_lines: "2951"
            status: "non-normative (note)"
            quote: |-
              Placing a refreshService property in a verifiable credential so that it is available to verifiers can remove control and consent from the holder and allow the verifiable credential to be issued directly to the verifier, thereby bypassing the holder.
        on_error: "unspecified by source (§5.4)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "issuer"
        to: "holder"
        message: "refreshService object"
        message_ref: "MU-14"
        action: >-
          Short validity with automatic renewal lets the issuer correlate use; holder software
          ought to warn.
        locator: "§8.18"
        basis: "stated"
        quotes:
          - at: "§8.18"
            source_lines: "3788"
            status: "non-normative (section)"
            quote: |-
              Issuers can defeat this protection however, by making their verifiable credentials short lived and renewal automatic.
        on_error: "unspecified by source (§8.18)"
        on_error_basis: "unspecified"
  - id: "F15"
    name: "terms-of-use"
    title: "Terms of use placed by issuer or holder and weighed by the recipient"
    locator: "§5.5, §9.9.1, Appendix A.10"
    kind: "local-decision"
    source_status: "mixed"
    participants:
      - "issuer"
      - "holder"
      - "verifier"
    summary: >-
      No exchange: the policy travels inside the credential or presentation and the recipient
      decides. The only stated consequence of not adhering is liability.
    diagram: "protocol.md#f15-terms-of-use"
    steps:
      - n: "1"
        from: "issuer"
        to: "holder"
        message: "termsOfUse object"
        message_ref: "MU-16"
        action: "Issuer places terms of use in the credential; holder places its own in the presentation."
        locator: "§5.5"
        basis: "stated"
        quotes:
          - at: "§5.5"
            source_lines: "2955"
            status: "normative"
            quote: |-
              Terms of use can be used by an issuer or a holder to communicate the terms under which a verifiable credential or verifiable presentation was issued. The issuer places their terms of use inside the verifiable credential. The holder places their terms of use inside a verifiable presentation.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0237"
        constrained_by_text: []
        on_error: "unspecified by source (§5.5)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "issuer"
        to: "issuer"
        message: "termsOfUse object"
        message_ref: "MU-16"
        action: >-
          Each policy has a type (and optionally an id); content follows the type, for example
          where the issuing policies are publicly available (avoiding phone-home).
        locator: "§5.5"
        basis: "stated"
        quotes:
          - at: "§5.5"
            source_lines: "2961"
            status: "normative"
            quote: |-
              Each termsOfUse value MUST specify its type, for example, TrustFrameworkPolicy, and MAY specify its instance id.
          - at: "§5.5"
            source_lines: "2957"
            status: "normative"
            quote: |-
              the procedures or policies that were used in issuing the verifiable credential, by providing, for example, a pointer to a public location (to avoid "phone home" privacy issues) where these procedures or policies can be found, or the name of the standard that defines them
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0238"
          - "w3c-vc-data-model-2-0#R-0239"
          - "w3c-vc-data-model-2-0#R-0240"
          - "w3c-vc-data-model-2-0#R-0241"
          - "w3c-vc-data-model-2-0#R-0075"
        constrained_by_text:
          - "§5.5: MUST specify one or more terms of use policies"
          - "§5.5: Each termsOfUse value MUST specify its type"
          - "§5.5: MAY specify its instance id"
          - "§5.5: The precise contents of each term of use is determined"
        on_error: "unspecified by source (§5.5)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "termsOfUse object"
        message_ref: "MU-16"
        action: >-
          Recipient (holder or verifier) decides whether to adhere; one that does not acts on
          its own responsibility and may incur liability. Use outside the terms is unauthorized.
        locator: "§5.5, §9.9.1"
        basis: "stated"
        quotes:
          - at: "§5.5"
            source_lines: "2961"
            status: "normative"
            quote: |-
              If the recipient (a holder or verifier) is not willing to adhere to the specified terms of use, then they do so on their own responsibility and might incur legal liability if they violate the stated terms of use.
          - at: "§9.9.1"
            source_lines: "3891"
            status: "unmarked subsection of a non-normative section"
            quote: |-
              A holder using credentials outside of the scope(s) defined in the termsOfUse would be considered to be unauthorized.
        on_error: >-
          stated: liability, not a protocol error (§5.5); enforcement after presentation is out
          of scope (§9.9.1)
        on_error_basis: "stated"
  - id: "F16"
    name: "evidence"
    title: "Evidence collected before issuance and weighed by the verifier"
    locator: "§5.6"
    kind: "creation-and-delivery"
    source_status: "mixed"
    participants:
      - "subject"
      - "issuer"
      - "verifier"
    summary: >-
      The issuer records supporting information it checked before issuing; the verifier uses it
      to set its confidence. No exchange with the subject is specified.
    diagram: "protocol.md#f16-evidence"
    steps:
      - n: "1"
        from: "subject"
        to: "issuer"
        message: "evidence object"
        message_ref: "MU-17"
        action: >-
          Before issuance the issuer checks documentation the subject provides, or runs
          background checks.
        locator: "§5.6"
        basis: "stated"
        quotes:
          - at: "§5.6"
            source_lines: "3015"
            status: "normative"
            quote: |-
              For example, an issuer could check physical documentation provided by the subject or perform a set of background checks before issuing the credential.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0077"
        constrained_by_text: []
        on_error: "unspecified by source (§5.6: how evidence is gathered is out of band)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "issuer"
        to: "holder"
        message: "evidence object"
        message_ref: "MU-17"
        action: "Record it in evidence objects inside the credential (each typed, optional id)."
        locator: "§5.6"
        basis: "stated"
        quotes:
          - at: "§5.6"
            source_lines: "3018"
            status: "normative"
            quote: |-
              If present, the value of the evidence property MUST be either a single object or a set of one or more objects.
          - at: "§5.6"
            source_lines: "3022"
            status: "normative"
            quote: |-
              It is used to express the type of evidence information expressed by the object. The related normative guidance in Section 4.5 Types MUST be followed.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0242"
          - "w3c-vc-data-model-2-0#R-0246"
          - "w3c-vc-data-model-2-0#R-0244"
          - "w3c-vc-data-model-2-0#R-0080"
          - "w3c-vc-data-model-2-0#R-0243"
          - "w3c-vc-data-model-2-0#R-0245"
        constrained_by_text:
          - "§5.6: MUST be either a single object or a set of one or more objects"
          - "§5.6: The type property is REQUIRED"
          - "§5.6: for the evidence object"
          - "§5.6: Section 4.5 Types MUST be followed"
          - "§5.6: The id property is OPTIONAL."
          - "§5.6: If present, the normative guidance in Section 4.4 Identifiers MUST be followed."
        on_error: "unspecified by source (§5.6)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "evidence object"
        message_ref: "MU-17"
        action: >-
          Use the evidence to decide how far to rely on the claims; it is supporting
          information, not a proof.
        locator: "§5.6"
        basis: "stated"
        quotes:
          - at: "§5.6"
            source_lines: "3015"
            status: "normative"
            quote: |-
              Evidence can be included by an issuer to provide the verifier with additional supporting information in a verifiable credential.
          - at: "§5.6"
            source_lines: "3072"
            status: "non-normative (note)"
            quote: |-
              The evidence property is used to express supporting information, such as documentary evidence, related to the verifiable credential.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0077"
        constrained_by_text: []
        on_error: "unspecified by source (§5.6)"
        on_error_basis: "unspecified"
  - id: "F17"
    name: "registry-publication-and-resolution"
    title: "Publishing to and resolving from a verifiable data registry"
    locator: "§1.2, §4.7, §4.13, §5.1, §7.1, Appendix A.3, Appendix A.4"
    kind: "exchange"
    source_status: "mixed"
    participants:
      - "issuer"
      - "holder"
      - "verifier"
      - "verifiable-data-registry"
    summary: >-
      Named everywhere, specified nowhere. The source says what is published and what a
      dereferenced URL ideally yields; the publication, resolution and key-discovery mechanics
      belong to the securing mechanism and identifier specifications.
    diagram: "protocol.md#f17-registry-publication-and-resolution"
    steps:
      - n: "1"
        from: "issuer"
        to: "verifiable-data-registry"
        message: >-
          verifiable data registry entry (identifiers, verification material, schemas,
          revocation registries)
        message_ref: "MU-26"
        action: >-
          Publish identifiers, verification material, schemas or revocation registries,
          integrity-protected (for example signed with the entity's key).
        locator: "§1.2, §5.1"
        basis: "stated"
        quotes:
          - at: "§1.2"
            source_lines: "215"
            status: "non-normative (section)"
            quote: |-
              A role a system might perform by mediating the creation and verification of identifiers, verification material, and other relevant data, such as verifiable credential schemas, revocation registries, and so on, which might require using verifiable credentials.
          - at: "§5.1"
            source_lines: "2609"
            status: "non-normative (section)"
            quote: |-
              When entities publish metadata about themselves, the publication can be integrity-protected by being secured using with the entity's private key.
        on_error: "unspecified by source (§1.2: no registry interface is defined)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "holder"
        to: "verifiable-data-registry"
        message: >-
          verifiable data registry entry (identifiers, verification material, schemas,
          revocation registries)
        message_ref: "MU-26"
        action: >-
          A holder publishes the verification material it secures presentations with, unless its
          identifier carries that metadata itself.
        locator: "Appendix A.4"
        basis: "stated"
        quotes:
          - at: "Appendix A.4"
            source_lines: "4044"
            status: "non-normative (section)"
            quote: |-
              For example, a holder can publish information containing the verification material used to secure verifiable presentations.
          - at: "Appendix A.4"
            source_lines: "4044"
            status: "non-normative (section)"
            quote: |-
              Some cryptographic identifiers contain all necessary metadata in the identifier itself.
        on_error: "unspecified by source (Appendix A.4)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifiable-data-registry"
        message: "controlled identifier document"
        message_ref: "MU-23"
        action: >-
          Dereference the issuer URL (ideally to a controlled identifier document) and the
          holder URL (to machine-readable information about the holder).
        locator: "§4.7, §4.13"
        basis: "inferred"
        inferred_reason: >-
          The RECOMMENDED sentences constrain what the URL resolves to; that a verifier
          dereferences it, and when, is this model's step.
        quotes:
          - at: "§4.7"
            source_lines: "1282"
            status: "normative"
            quote: |-
              It is RECOMMENDED that the URL be one which, if dereferenced, results in a controlled identifier document, as defined in the Controlled Identifiers v1.0 specification, about the issuer that can be used to verify the information expressed in the credential.
          - at: "§4.13"
            source_lines: "2477"
            status: "normative"
            quote: |-
              It is RECOMMENDED that the URL in the holder or its id be one which, if dereferenced, results in a document containing machine-readable information about the holder that can be used to verify the information expressed in the verifiable presentation.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0170"
          - "w3c-vc-data-model-2-0#R-0046"
        constrained_by_text:
          - "§4.7: RECOMMENDED that the URL be one which, if dereferenced, results in a controlled identifier"
          - "§4.13: RECOMMENDED that the URL in the holder"
        on_error: "unspecified by source (§4.7: a URL that does not dereference is permitted, MAY in §4.4)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "securing-mechanism"
        to: "verifier"
        message: >-
          verification result (status, document, mediaType, controller,
          controlledIdentifierDocument, warnings, errors)
        message_ref: "MU-09"
        action: >-
          Receive the verification method's controller and its controlled identifier document as
          part of the §7.1 result.
        locator: "§7.1"
        basis: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "3362"
            status: "normative"
            quote: |-
              a controller of the verification method associated with the securing mechanism (string controller)
          - at: "§7.1"
            source_lines: "3363"
            status: "normative"
            quote: |-
              a controlled identifier document that is associated with the verification method used to verify the securing mechanism (map controlledIdentifierDocument)
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0273"
        constrained_by_text: []
        on_error: "unspecified by source (§7.1)"
        on_error_basis: "unspecified"
  - id: "F18"
    name: "compatibility-transformation"
    title: "Transforming another credential format into a conforming document"
    locator: "§5.11"
    kind: "local-processing"
    source_status: "mixed"
    participants:
      - "specification-author"
      - "conforming-issuer-implementation"
    summary: >-
      A transformation specification's obligations (JWT, CWT, mDL, AnonCreds and the like). The
      transformer is whatever implements that specification; the result must be a conforming,
      secured document.
    diagram: "protocol.md#f18-compatibility-transformation"
    steps:
      - n: "1"
        from: "specification-author"
        to: "conforming-issuer-implementation"
        message: "transformation input document"
        message_ref: "MU-25"
        action: >-
          Take an input document of a registered media type and say whether the transformation
          is one-way or round-trippable.
        locator: "§5.11"
        basis: "stated"
        quotes:
          - at: "§5.11"
            source_lines: "3200"
            status: "normative"
            quote: |-
              MUST identify whether the transformation to this data model is one-way-only or round-trippable.
          - at: "§5.11"
            source_lines: "3203"
            status: "normative"
            quote: |-
              MUST specify a registered media type for the input document.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0090"
          - "w3c-vc-data-model-2-0#R-0093"
        constrained_by_text:
          - "§5.11: MUST identify whether the transformation"
          - "§5.11: MUST specify a registered media type"
        on_error: "unspecified by source (§5.11)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "conforming-issuer-implementation"
        to: "conforming-issuer-implementation"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          Produce a conforming document (preserving @context values when round-tripping),
          secured by at least one mechanism; Linked Data practice and a test suite are expected.
        locator: "§5.11"
        basis: "stated"
        quotes:
          - at: "§5.11"
            source_lines: "3201"
            status: "normative"
            quote: |-
              MUST preserve the @context values when performing round-trippable transformation.
          - at: "§5.11"
            source_lines: "3202"
            status: "normative"
            quote: |-
              MUST result in a conforming document when transforming to the data model described by this specification.
          - at: "§5.11"
            source_lines: "3204"
            status: "normative"
            quote: |-
              SHOULD provide a test suite that demonstrates that the specified transformation algorithm to the data model in this specification results in a conforming document.
          - at: "§5.11"
            source_lines: "3207"
            status: "non-normative (note)"
            quote: |-
              Readers are advised that a digital credential is only considered compatible with the W3C Verifiable Credentials ecosystem if it is a conforming document and it uses at least one securing mechanism, as described by their respective requirements in this specification.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0091"
          - "w3c-vc-data-model-2-0#R-0092"
          - "w3c-vc-data-model-2-0#R-0094"
          - "w3c-vc-data-model-2-0#R-0095"
          - "w3c-vc-data-model-2-0#R-0251"
        constrained_by_text:
          - "§5.11: MUST preserve the @context values"
          - "§5.11: MUST result in a conforming document"
          - "§5.11: SHOULD provide a test suite"
          - "§5.11: SHOULD ensure that all semantics"
          - "§5.11: If conceptually aligned digital credential formats can be transformed"
        on_error: "unspecified by source (§5.11: no failure of a transformation is defined)"
        on_error_basis: "unspecified"
  - id: "F19"
    name: "balance-check-token"
    title: "Illustrative: a tokenised balance check that returns to the issuer"
    locator: "§8.16"
    kind: "exchange"
    source_status: "non-normative"
    participants:
      - "issuer"
      - "holder"
      - "verifier"
    summary: >-
      Non-normative example in the privacy considerations, kept because it is the only flow in
      the source where a verifier hands a presentation back to the issuer. Everything here is
      the example's.
    diagram: "protocol.md#f19-balance-check-token"
    steps:
      - n: "1"
        from: "issuer"
        to: "holder"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          The bank issues a credential holding a balance-checking token instead of the account
          number.
        locator: "§8.16"
        basis: "stated"
        quotes:
          - at: "§8.16"
            source_lines: "3773"
            status: "non-normative (section)"
            quote: |-
              In this case, the bank could issue a verifiable credential containing a balance checking token to a holder.
        on_error: "unspecified by source (§8.16)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "holder"
        to: "verifier"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: "The holder presents it, signing the token over to a credit-checking agency."
        locator: "§8.16"
        basis: "stated"
        quotes:
          - at: "§8.16"
            source_lines: "3773"
            status: "non-normative (section)"
            quote: |-
              The holder would then include the verifiable credential in a verifiable presentation and bind the token to a credit checking agency using a digital signature.
        on_error: "unspecified by source (§8.16)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "issuer"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: >-
          The verifier counter-signs the presentation and hands it back to the issuer, which
          checks the balance.
        locator: "§8.16"
        basis: "stated"
        quotes:
          - at: "§8.16"
            source_lines: "3773"
            status: "non-normative (section)"
            quote: |-
              The verifier could then wrap the verifiable presentation in their digital signature and hand it back to the issuer to check the account balance dynamically.
        on_error: "unspecified by source (§8.16: illustrative only)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "issuer"
        to: "verifier"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          The issuer answers the balance question; a stolen token is useful only for the
          counter-signature's few minutes of validity.
        locator: "§8.16"
        basis: "inferred"
        inferred_reason: "The example ends at the issuer checking the balance; the answer is implied."
        quotes:
          - at: "§8.16"
            source_lines: "3774"
            status: "non-normative (section)"
            quote: |-
              Also, given the validity period of the counter-signature, the attacker gains access to the token for only a few minutes.
        on_error: "unspecified by source (§8.16)"
        on_error_basis: "unspecified"
error_paths:
  - id: "E-01"
    trigger: "verifyProof returns result.status false."
    detected_by: "conforming-verifier-implementation"
    in:
      - "F09 1.3"
      - "M01-T09"
    outcome: >-
      A CRYPTOGRAPHIC_SECURITY_ERROR is added to result.errors and result is returned with
      status false (step 3). result.document is not removed (T-10).
    basis: "stated"
    locator: "§7.1 step 1.3, §7.2"
    quotes:
      - at: "§7.1"
        source_lines: "3370"
        status: "normative"
        quote: |-
          If result.status is set to false, add a CRYPTOGRAPHIC_SECURITY_ERROR to result.errors.
      - at: "§7.2"
        source_lines: "3388"
        status: "normative"
        quote: |-
          The securing mechanism for the document has detected a modification in the contents of the document since it was created; potential tampering detected. See Section 7.1 Verification.
    constrained_by:
      - "w3c-vc-data-model-2-0#R-0110"
      - "w3c-vc-data-model-2-0#R-0290"
      - "w3c-vc-data-model-2-0#R-0280"
      - "w3c-vc-data-model-2-0#R-0285"
      - "w3c-vc-data-model-2-0#R-0286"
      - "w3c-vc-data-model-2-0#R-0287"
      - "w3c-vc-data-model-2-0#R-0288"
      - "w3c-vc-data-model-2-0#R-0279"
    constrained_by_text:
      - "§7.1: conforming verifier implementations MUST run"
      - "§7.2: CRYPTOGRAPHIC_SECURITY_ERROR The securing mechanism for the document"
      - "§7.1: Where §7.1 adds a CRYPTOGRAPHIC_SECURITY_ERROR"
      - "§7.2: The type property MUST be present"
      - "§7.2: its value MUST be a URL identifying the type of problem"
      - "§7.2: The title property SHOULD provide"
      - "§7.2: The detail property SHOULD provide"
  - id: "E-02"
    trigger: "result.status is true but result.document is not a conforming document."
    detected_by: "conforming-verifier-implementation"
    in:
      - "F09 2"
      - "M01-T12"
    outcome: >-
      status set to false, document removed, at least one MALFORMED_VALUE_ERROR added; other
      warnings and errors MAY be added; result returned.
    basis: "stated"
    locator: "§7.1 step 2, §7.2"
    quotes:
      - at: "§7.1"
        source_lines: "3371"
        status: "normative"
        quote: |-
          If it is not, set result.status to false, remove the document property from result, and add at least one MALFORMED_VALUE_ERROR to result.errors.
