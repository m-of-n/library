          mechanism wrap it.
        locator: "§4.12, Appendix C.1"
        basis: "stated"
        quotes:
          - at: "§4.12"
            source_lines: "2391"
            status: "normative"
            quote: |-
              An enveloping proof wraps a serialization of this data model.
          - at: "§4.12"
            source_lines: "2391"
            status: "normative"
            quote: |-
              One such RECOMMENDED enveloping proof mechanism is defined in Securing Verifiable Credentials using JOSE and COSE [VC-JOSE-COSE].
          - at: "Appendix C.1"
            source_lines: "4180"
            status: "unmarked subsection of a non-normative section"
            quote: |-
              This media type can be used in an enveloping proof to denote the enveloped payload.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0034"
          - "w3c-vc-data-model-2-0#R-0096"
          - "w3c-vc-data-model-2-0#R-0255"
          - "w3c-vc-data-model-2-0#R-0101"
          - "w3c-vc-data-model-2-0#R-0256"
          - "w3c-vc-data-model-2-0#R-0195"
        constrained_by_text:
          - "§4.12: RECOMMENDED enveloping proof mechanism"
          - "§5.13: MUST document normative algorithms"
          - "§5.13: The algorithms MAY be general in nature"
          - "§5.13: MAY provide algorithms and interfaces in addition"
          - "§5.13: MAY be used to secure data other than conforming documents"
        on_error: "delegated to the securing mechanism specification"
        on_error_basis: "unspecified"
      - n: "2"
        from: "securing-mechanism"
        to: "conforming-issuer-implementation"
        message: "enveloping proof (secured serialization)"
        message_ref: "MU-06"
        action: "Return the envelope (for SD-JWT, a compact serialization with disclosures)."
        locator: "§4.12"
        basis: "stated"
        quotes:
          - at: "§4.12"
            source_lines: "2462"
            status: "normative"
            quote: |-
              The enveloping proof above secures the original credential by encapsulating the original data in a digital signature envelope, resulting in a verifiable credential that can be processed using tooling that understands the SD-JWT format.
        on_error: "delegated to the securing mechanism specification"
        on_error_basis: "unspecified"
      - n: "3"
        from: "holder"
        to: "holder"
        message: "EnvelopedVerifiableCredential"
        message_ref: "MU-04"
        action: >-
          To present an envelope-secured credential, put an EnvelopedVerifiableCredential in
          verifiableCredential: @context present and defining id, type and
          EnvelopedVerifiableCredential; id a data: URL holding the envelope; type
          EnvelopedVerifiableCredential.
        locator: "§4.13 (Enveloped Verifiable Credentials)"
        basis: "stated"
        quotes:
          - at: "§4.13"
            source_lines: "2495"
            status: "normative"
            quote: |-
              This can be accomplished by associating the verifiableCredential property with an object that has a type of EnvelopedVerifiableCredential.
          - at: "§4.13"
            source_lines: "2497"
            status: "normative"
            quote: |-
              The @context property of the object MUST be present and include a context, such as the base context for this specification, that defines at least the id, type, and EnvelopedVerifiableCredential terms as defined by the base context provided by this specification.
          - at: "§4.13"
            source_lines: "2497"
            status: "normative"
            quote: |-
              The id value of the object MUST be a data: URL [RFC2397] that expresses a secured verifiable credential using an enveloping security scheme, such as Securing Verifiable Credentials using JOSE and COSE [VC-JOSE-COSE].
          - at: "§4.13"
            source_lines: "2497"
            status: "normative"
            quote: |-
              The type value of the object MUST be EnvelopedVerifiableCredential.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0047"
          - "w3c-vc-data-model-2-0#R-0048"
          - "w3c-vc-data-model-2-0#R-0212"
          - "w3c-vc-data-model-2-0#R-0211"
