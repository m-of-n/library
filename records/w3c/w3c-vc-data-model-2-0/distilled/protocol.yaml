  - id: "F03"
    name: "enveloping-securing"
    title: >-
      Hand-off to an enveloping securing mechanism (JOSE, COSE, SD-JWT), and enveloped objects
      in presentations
    locator: "§4.12, §4.13, §5.13, §7.1, Appendix C"
    kind: "hand-off"
    source_status: "mixed"
    participants:
      - "conforming-issuer-implementation"
      - "holder"
      - "securing-mechanism"
      - "conforming-verifier-implementation"
    summary: >-
      An enveloping proof wraps a serialization; the envelope's media type and byte layout are
      the mechanism's (VC-JOSE-COSE). The data model adds the two Enveloped types that carry an
      envelope inside a presentation as a data: URL. The source never says how a verifier
      verifies an enveloped credential found inside a verified presentation (step 7, inferred).
    diagram: "protocol.md#f03-enveloping-securing"
    steps:
      - n: "1"
        from: "conforming-issuer-implementation"
