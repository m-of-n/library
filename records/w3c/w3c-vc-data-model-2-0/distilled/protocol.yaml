        basis: "stated"
        quotes:
          - at: "§5.3"
            source_lines: "2890"
            status: "normative"
            quote: |-
              If a mediaType is listed, implementations that retrieve the resource identified by the id property using HTTP Semantics SHOULD:
          - at: "§5.3"
            source_lines: "2891"
            status: "normative"
            quote: |-
              use the media type in the Accept HTTP Header, and
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0068"
        constrained_by_text:
          - "§5.3: SHOULD: use the media type in the Accept HTTP Header"
        on_error: "unspecified by source (§5.3: retrieval failure and non-HTTP URLs are not addressed)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "related-resource-host"
        to: "conforming-verifier-implementation"
        message: "retrieved related resource (HTTP response)"
        message_ref: "MU-20"
        action: "Receive the response; reject it if its Content-Type differs from the listed mediaType."
        locator: "§5.3"
        basis: "stated"
        quotes:
          - at: "§5.3"
            source_lines: "2892"
            status: "normative"
            quote: |-
              reject the response if it includes a Content-Type HTTP Header with a different media type.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0068"
        constrained_by_text:
          - "§5.3: reject the response if it includes a Content-Type"
        on_error: "stated (SHOULD): reject the response (E-09)"
        on_error_basis: "stated"
      - n: "3"
        from: "conforming-verifier-implementation"
        to: "conforming-verifier-implementation"
        message: "relatedResource object"
        message_ref: "MU-19"
        action: >-
          Compute the digest of the retrieved resource; if it differs from the issuer's digest,
          produce an error.
        locator: "§5.3"
        basis: "stated"
        quotes:
          - at: "§5.3"
            source_lines: "2895"
            status: "normative"
            quote: |-
              A conforming verifier implementation that makes use of a resource based on the id of a relatedResource object inside a conforming document with a corresponding cryptographic digest appearing in a relatedResource object value MUST compute the digest of the retrieved resource.
          - at: "§5.3"
            source_lines: "2895"
            status: "normative"
            quote: |-
              If the digest provided by the issuer does not match the digest computed for the retrieved resource, the conforming verifier implementation MUST produce an error.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0071"
