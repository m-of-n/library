          - "w3c-vc-data-model-2-0#R-0127"
          - "w3c-vc-data-model-2-0#R-0296"
          - "w3c-vc-data-model-2-0#R-0297"
        constrained_by_text:
          - "Appendix B.2: MUST ensure that the following vocabulary URLs"
