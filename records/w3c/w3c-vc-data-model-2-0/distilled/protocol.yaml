  13 roles. 19 flows (5 creation-and-delivery, 6 exchange, 2 hand-off, 2 local-decision, 1
  local-processing, 3 receive-processing; source status 14 mixed, 3 non-normative, 2 normative)
  with 109 steps, 13 of them inferred; on_error_basis inferred 5, stated 14, unspecified 90. 26
  message-vocabulary entries, 26 used by steps. 20 error paths (inferred 5, stated 11,
  unspecified 4). 31 source defects and tensions (1 ambiguity, 9 defect, 13 gap, 8 tension). 14
  not_defined items. 400 quote items in this file, every one cut by script and checked by
  bin/check-quotes. 263 selector matches and 173 quote joins resolve to 244 distinct requirement
  ids of requirements.yaml (sha256
  c74ae28dbde0e32766f1f688206dd3904227de75a782d2cf0ac67324570a7f41 when wired, 298 entries, 201
  stated keyword entries of which 155 are cited here); 0 selectors unresolved. With
  state-machine.yaml: 251 of the 298 requirements.yaml entries cited by one or both files, 34
  more covered through a split parent or child that is cited; the 13 not cited are listed under
  requirements_not_cited with the reason. Counted by script from the objects written, pass 1,
  2026-11-07; any later edit owes a recount.
