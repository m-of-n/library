source_defects_and_tensions:
  - id: "T-01"
    kind: "tension"
    locator: "§5.13, §7.1 steps 1.2-2"
    text: >-
      §7.1 requires verifyProof to implement the §5.13 interface, whose result items are named
      verified and verifiedDocument; §7.1 then reads result.status and result.document. A
      literal implementation of §5.13 has no status for step 1.3 to test.
    quotes:
      - at: "§5.13"
        source_lines: "3220"
        status: "normative"
        quote: |-
          boolean verified
      - at: "§5.13"
        source_lines: "3222"
        status: "normative"
        quote: |-
          map verifiedDocument
      - at: "§7.1"
        source_lines: "3369"
        status: "normative"
        quote: |-
          If the call was successful, result will contain the status, document, mediaType, controller, controlledIdentifierDocument, warnings, and errors properties.
      - at: "§7.1"
        source_lines: "3370"
        status: "normative"
        quote: |-
          If result.status is set to false, add a CRYPTOGRAPHIC_SECURITY_ERROR to result.errors.
    affects:
      - "F02 5"
      - "F03 6"
      - "F09 1.2"
      - "F09 1.3"
      - "M01-T07"
  - id: "T-02"
    kind: "tension"
    locator: "§5.13, §7.1 step 1.2"
    text: >-
      §5.13 obliges a mechanism to return at least verified, verifiedDocument and mediaType;
      §7.1 asserts that a successful call yields seven properties, including controller,
      controlledIdentifierDocument, warnings and errors, which no requirement obliges a
      mechanism to supply.
    quotes:
      - at: "§5.13"
        source_lines: "3219"
        status: "normative"
        quote: |-
          The verification algorithm returns a verification result with at least the following items:
      - at: "§7.1"
        source_lines: "3369"
        status: "normative"
        quote: |-
          If the call was successful, result will contain the status, document, mediaType, controller, controlledIdentifierDocument, warnings, and errors properties.
    affects:
      - "F09 1.2"
      - "F09 3"
      - "M01-T07"
  - id: "T-03"
    kind: "gap"
    locator: "§7.1 steps 1.1-1.2"
    text: >-
      The algorithm has no branch for: no mechanism matching inputMediaType, inputData that does
      not parse as JSON, or an unsuccessful verifyProof call. Step 1.3 then reads a result that
      may not exist.
    quotes:
      - at: "§7.1"
        source_lines: "3368"
        status: "normative"
        quote: |-
          Set the verifyProof function by using the inputMediaType and the Securing Mechanisms section of the Verifiable Credential Extensions document, or other mechanisms known to the implementation, to determine the cryptographic suite to use when verifying the securing mechanism.
      - at: "§7.1"
        source_lines: "3369"
        status: "normative"
        quote: |-
          If the call was successful, result will contain the status, document, mediaType, controller, controlledIdentifierDocument, warnings, and errors properties.
    affects:
      - "E-03"
      - "E-04"
      - "E-05"
      - "M01-T03"
      - "M01-T06"
      - "M01-T08"
  - id: "T-04"
    kind: "gap"
    locator: "§7.2"
    text: >-
      PARSING_ERROR and RANGE_ERROR are defined but no algorithm or requirement in the source
      ever produces them; only CRYPTOGRAPHIC_SECURITY_ERROR and MALFORMED_VALUE_ERROR are
      referenced (each with a back-link to §7.1).
    quotes:
      - at: "§7.2"
        source_lines: "3386"
        status: "normative"
        quote: |-
          There was an error while parsing input.
      - at: "§7.2"
        source_lines: "3392"
        status: "normative"
        quote: |-
          A provided value is outside of the expected range of an associated value, such as a given index value for an array being larger than the current size of the array.
    affects:
      - "E-04"
      - "M01"
  - id: "T-05"
    kind: "gap"
    locator: "Appendix B.1, §5.3, §7.1"
    text: >-
      Two verifier MUSTs outside §7.1 have no step in the algorithm and no ProblemDetails type:
      expansion errors must make verification fail, and a related-resource digest mismatch must
      produce an error. Where they run relative to §7.1, and how their failure reaches result,
      is not said.
    quotes:
      - at: "Appendix B.1"
        source_lines: "4105"
        status: "normative"
        quote: |-
          If such operations are performed and result in an error, the verifiable credential or verifiable presentation MUST result in a verification failure.
      - at: "§5.3"
        source_lines: "2895"
        status: "normative"
        quote: |-
          If the digest provided by the issuer does not match the digest computed for the retrieved resource, the conforming verifier implementation MUST produce an error.
    affects:
      - "E-06"
      - "E-08"
      - "F09 X3"
      - "F09 X4"
      - "M02"
  - id: "T-06"
    kind: "tension"
    locator: "§1.3"
    text: >-
      The verifier conformance clause requires verification as described in §4.12, which
      describes the two classes of securing mechanism and no verification procedure; the
      procedure is §7.1 and the interface §5.13.
    quotes:
      - at: "§1.3"
        source_lines: "230"
        status: "unmarked subsection of a non-normative section"
        quote: |-
          MUST perform verification on a conforming document as described in Section 4.12 Securing Mechanisms
    affects:
      - "F09"
  - id: "T-07"
    kind: "tension"
    locator: "§2, §7.1, §4.10, Appendix A.8"
    text: >-
      Is status checking verification or validation? The definition of verification includes a
      successful status check when status is present; §7.1 performs none; Appendix A.8 lists
      status under validation; §4.10 calls reconciling conflicting entries part of validation.
    quotes:
      - at: "§2"
        source_lines: "276"
        status: "normative"
        quote: |-
          This includes checking that the credential or presentation conforms to the specification, the securing mechanism is satisfied, and, if present, the status check succeeds.
      - at: "§4.10"
        source_lines: "2339"
        status: "normative"
        quote: |-
          Reconciling such conflicts is a part of the validation process, hence part of the verifier's business logic, and therefore out of scope for this specification.
      - at: "Appendix A.8"
        source_lines: "4080"
        status: "non-normative (section)"
        quote: |-
          If the credentialStatus property is available, the status of a verifiable credential is expected to be evaluated by the verifier according to the credentialStatus type definition for the verifiable credential and the verifier's own status evaluation criteria.
    affects:
      - "F09"
      - "F12 6"
      - "F13"
      - "M02"
      - "M04"
  - id: "T-08"
    kind: "gap"
    locator: "§7.1, §4.13, §5.13"
    text: >-
      §7.1 verifies one inputData. Nothing says whether verifying a presentation verifies the
      credentials it carries, embedded or enveloped. An embedded presentation proof secures the
      credential graphs, which is integrity under the holder's key, not each issuer's
      authorship.
    quotes:
      - at: "§5.13"
        source_lines: "3229"
        status: "normative"
        quote: |-
          The securing mechanism MUST secure all graphs in the verifiable credential or the verifiable presentation, except for any proof graphs securing the verifiable credential or the verifiable presentation itself.
      - at: "§4.13"
        source_lines: "2467"
        status: "normative"
        quote: |-
          Unless additional requirements are defined by the particular securing mechanism or embedding protocol, a verifier cannot generally assume that the verifiable presentation correlates with the presented verifiable credentials.
    affects:
      - "F03 7"
      - "F09 X5"
      - "M02-T10"
  - id: "T-09"
    kind: "gap"
    locator: "§7.1, Appendix A.3"
    text: >-
      §7.1 returns the controller of the verification method but no normative step compares it
      with the issuer property (or the holder property of a presentation); only non-normative
      Appendix A.3 says it is typically the issuer or holder. Binding issuer to key is left to
      validation.
