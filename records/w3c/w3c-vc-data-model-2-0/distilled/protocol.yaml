  - id: "F06"
    name: "derived-presentation"
    title: "Zero-knowledge and selective-disclosure presentation of derived data"
    locator: "§4.13 (Presentations Using Derived Credentials), §5.7"
    kind: "creation-and-delivery"
    source_status: "normative"
    participants:
      - "issuer"
      - "holder"
      - "securing-mechanism"
      - "verifier"
      - "specification-author"
    summary: >-
      Described by example; the mechanics belong to the ZKP securing mechanism (for example Data
      Integrity BBS). The one normative statement binds mechanism authors.
    diagram: "protocol.md#f06-derived-presentation"
    steps:
      - n: "1"
        from: "issuer"
        to: "securing-mechanism"
        message: "embedded proof (proof property)"
        message_ref: "MU-07"
        action: "Secure the credential so that the holder can later derive proofs: a base proof."
        locator: "§5.7"
        basis: "stated"
        quotes:
          - at: "§5.7"
            source_lines: "3083"
            status: "normative"
            quote: |-
              We note that in most instances, for the holder to make use of zero knowledge mechanisms with verifiable credentials, the issuer is required to secure the verifiable credential in a manner that supports these capabilities.
          - at: "§5.7"
            source_lines: "3126"
            status: "normative"
            quote: |-
              The example above is a verifiable credential where the issuer has enabled a BBS-based unlinkable disclosure scheme to create a base proof that can then be used by the holder to create a derived proof that reveals only particular pieces of information from the original verifiable credential.
        on_error: "unspecified by source (§5.7)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "holder"
        to: "securing-mechanism"
        message: "derived credential and derived proof"
        message_ref: "MU-24"
        action: >-
          Derive presentable data and a derived proof revealing only the chosen claims, without
          involving the issuer.
        locator: "§4.13, §5.7"
        basis: "stated"
        quotes:
          - at: "§4.13"
            source_lines: "2533"
            status: "normative"
            quote: |-
              In these schemes, a verifiable credential might be used to derive presentable data, which is cryptographically asserted such that a verifier can trust the value if they trust the issuer.
          - at: "§5.7"
            source_lines: "3078"
            status: "normative"
            quote: |-
              This also enables the production of a derived verifiable credential that is formatted according to the verifier's data schema without needing to involve the issuer during presentation.
        on_error: "unspecified by source (§4.13, §5.7)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "holder"
        to: "verifier"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: "Present the derived credential and proof in a verifiable presentation."
        locator: "§5.7"
        basis: "stated"
        quotes:
          - at: "§5.7"
            source_lines: "3160"
            status: "normative"
            quote: |-
              The verifiable presentation above includes a verifiable credential that contains an unlinkable subset of the information from the previous example and a derived proof that the verifier can use to verify that the information originated from the expected issuer and is bound to this particular exchange of information.
        on_error: "unspecified by source (§5.7)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "securing-mechanism"
        message: "verification input (inputMediaType, inputData)"
        message_ref: "MU-08"
        action: >-
          Verify the derived proof through §7.1 (F09); it shows the data originates with the
          expected issuer and belongs to this exchange.
        locator: "§5.7, §7.1"
        basis: "inferred"
        inferred_reason: >-
          That the derived proof goes through §7.1 like any other is this model's join; the
          source only says the verifier can use it to verify.
        quotes:
          - at: "§5.7"
            source_lines: "3160"
            status: "normative"
            quote: |-
              The verifiable presentation above includes a verifiable credential that contains an unlinkable subset of the information from the previous example and a derived proof that the verifier can use to verify that the information originated from the expected issuer and is bound to this particular exchange of information.
        on_error: "as F09"
        on_error_basis: "inferred"
      - n: "5"
        from: "specification-author"
        to: "securing-mechanism"
        message: "derived credential and derived proof"
        message_ref: "MU-24"
        action: >-
          Mechanism design constraint: nothing in the mechanism may let verifiers correlate a
          holder across presentations to different verifiers.
        locator: "§5.7"
        basis: "stated"
        quotes:
          - at: "§5.7"
            source_lines: "3081"
            status: "normative"
            quote: |-
              Specification authors that create securing mechanisms MUST NOT design them in such a way that they leak information that would enable the verifier to correlate a holder across multiple verifiable presentations to different verifiers.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0081"
        constrained_by_text:
          - "§5.7: MUST NOT design them in such a way that they leak information"
        on_error: "not a runtime error: a constraint on mechanism specifications"
        on_error_basis: "unspecified"
  - id: "F07"
    name: "counterparty-presentation"
    title: "Issuer or verifier presents to the holder to identify itself"
    locator: "§3.3"
    kind: "creation-and-delivery"
    source_status: "non-normative"
    participants:
      - "issuer"
      - "verifier"
      - "holder"
    summary: >-
      A role reversal the source allows in a note: before handing over sensitive information the
      holder may want assurance about the other party, which then presents to the holder.
    diagram: "protocol.md#f07-counterparty-presentation"
    steps:
      - n: "1"
        from: "verifier"
        to: "holder"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: "Generate and send a presentation that identifies the issuer or verifier to the holder."
        locator: "§3.3"
        basis: "stated"
        quotes:
          - at: "§3.3"
            source_lines: "328"
            status: "non-normative (note)"
            quote: |-
              While a holder is typically expected to generate presentations, an issuer or verifier might generate a presentation to identify itself to a holder. This might occur if the holder needs higher assurance from the issuer or verifier before handing over sensitive information as part of a verifiable presentation.
        on_error: "unspecified by source (§3.3)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "holder"
        to: "holder"
        message: >-
          verification result (status, document, mediaType, controller,
          controlledIdentifierDocument, warnings, errors)
        message_ref: "MU-09"
        action: "Verify it (F09) and decide whether to continue."
        locator: "§3.3, §7.1"
        basis: "inferred"
        inferred_reason: "The note says why the presentation is made, not what the holder does with it."
        quotes:
          - at: "§3.3"
            source_lines: "328"
            status: "non-normative (note)"
            quote: |-
              While a holder is typically expected to generate presentations, an issuer or verifier might generate a presentation to identify itself to a holder. This might occur if the holder needs higher assurance from the issuer or verifier before handing over sensitive information as part of a verifiable presentation.
        on_error: "as F09; the decision is the holder's and has no message"
        on_error_basis: "inferred"
  - id: "F08"
    name: "media-type-determination"
    title: "Receiver recovers application/vc or application/vp from a lower-precision label"
    locator: "§6.2 (Media Type Precision)"
    kind: "receive-processing"
    source_status: "non-normative"
    participants:
      - "verifier"
    summary: >-
      Non-normative. Feeds inputMediaType to §7.1 (F09) when the transport labelled the payload
      application/json or application/ld+json. Applies to JSON payloads (embedded proofs); an
      envelope's media type is the mechanism's.
    diagram: "protocol.md#f08-media-type-determination"
    steps:
      - n: "1"
        from: "holder"
        to: "verifier"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: >-
          A payload arrives tagged with a less precise media type (text/plain, octet-stream,
          json, ld+json).
        locator: "§6.2"
        basis: "stated"
        quotes:
          - at: "§6.2"
            source_lines: "3321"
            status: "non-normative (section)"
            quote: |-
              At times, developers or systems might use lower precision media types to convey verifiable credentials or verifiable presentations.
        on_error: "unspecified by source (§6.2)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "verifier"
        to: "verifier"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: >-
          Do not raise an error if the intended type can be determined: parse the payload as
          JSON and check that the first @context item is the base context URL.
        locator: "§6.2"
        basis: "stated"
        quotes:
          - at: "§6.2"
            source_lines: "3325"
            status: "non-normative (section)"
            quote: |-
              Implementers are urged to not raise errors when it is possible to determine the intended media type from a payload, provided that the media type used is acceptable in the given protocol.
          - at: "§6.2"
            source_lines: "3326"
            status: "non-normative (section)"
            quote: |-
              Parse the payload as a JSON document.
          - at: "§6.2"
            source_lines: "3327"
            status: "non-normative (section)"
            quote: |-
              Ensure that the first element of the @context property matches https://www.w3.org/ns/credentials/v2.
        on_error: >-
          unspecified by source (§6.2: what follows a payload that is not JSON or whose first
          context differs is not said)
        on_error_basis: "unspecified"
      - n: "3"
        from: "verifier"
        to: "verifier"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: >-
          Assume application/vp if top-level type contains VerifiablePresentation,
          application/vc if it contains VerifiableCredential; the normal checks still follow
          (F09).
        locator: "§6.2"
        basis: "stated"
        quotes:
          - at: "§6.2"
            source_lines: "3328"
            status: "non-normative (section)"
            quote: |-
              Assume an application/vp media type if the JSON document contains a top-level type property containing a VerifiablePresentation element.
          - at: "§6.2"
            source_lines: "3329"
            status: "non-normative (section)"
            quote: |-
              Assume an application/vc media type if the JSON document contains a top-level type property containing a VerifiableCredential element.
          - at: "§6.2"
            source_lines: "3330"
            status: "non-normative (section)"
            quote: |-
              Receivers of payloads, regardless of their associated media type, are expected to perform appropriate checks to ensure that payloads conform with the requirements for their use in a given system.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0271"
          - "w3c-vc-data-model-2-0#R-0269"
        constrained_by_text:
          - "§6.2: Do not assume security of content"
          - "§6.2: do not imply any particular securing mechanism"
        on_error: "unspecified by source (§6.2)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "verifier"
        to: "related-resource-host"
        message: "retrieved related resource (HTTP response)"
