        on_error: "unspecified by source (§4.13 (Enveloped Verifiable Credentials))"
        on_error_basis: "unspecified"
      - n: "4"
        from: "holder"
        to: "holder"
        message: "EnvelopedVerifiablePresentation"
        message_ref: "MU-05"
        action: >-
          Optionally express a whole envelope-secured presentation as an
          EnvelopedVerifiablePresentation under the same three rules.
        locator: "§4.13 (Enveloped Verifiable Presentations)"
        basis: "stated"
        quotes:
          - at: "§4.13"
            source_lines: "2519"
            status: "normative"
            quote: |-
              This can be accomplished by using an object that has a type of EnvelopedVerifiablePresentation.
          - at: "§4.13"
            source_lines: "2521"
            status: "normative"
            quote: |-
