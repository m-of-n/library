  - id: "F02"
    name: "embedded-securing"
    title: "Hand-off to an embedded-proof securing mechanism (Data Integrity) and back"
    locator: "§4.12, §5.13, §7.1"
    kind: "hand-off"
    source_status: "mixed"
    participants:
      - "conforming-issuer-implementation"
      - "holder"
      - "securing-mechanism"
      - "conforming-verifier-implementation"
    summary: >-
      What the data model requires of an embedded proof and of its verification hand-off. The
      proof algorithms are the securing mechanism's (VC Data Integrity); this flow stops at the
      interface. The producer is the issuer for a credential and the holder for a presentation.
    diagram: "protocol.md#f02-embedded-securing"
    steps:
      - n: "1"
        from: "conforming-issuer-implementation"
        to: "securing-mechanism"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          Pass the unsecured document to the embedded mechanism, which decorates it with a proof
          (for Data Integrity, the proof property).
        locator: "§4.12, §5.13"
        basis: "stated"
        quotes:
          - at: "§4.12"
            source_lines: "2392"
            status: "normative"
            quote: |-
              An embedded proof is a mechanism where the proof is included in the serialization of the data model.
          - at: "§4.12"
            source_lines: "2422"
            status: "normative"
            quote: |-
              The embedded proof above secures the original credential by decorating the original data with a digital signature via the proof property.
          - at: "§5.13"
            source_lines: "3232"
            status: "normative"
            quote: |-
              The proof property as defined in [VC-DATA-INTEGRITY] MAY be used by the embedded securing mechanism.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0035"
          - "w3c-vc-data-model-2-0#R-0258"
          - "w3c-vc-data-model-2-0#R-0096"
          - "w3c-vc-data-model-2-0#R-0255"
          - "w3c-vc-data-model-2-0#R-0101"
          - "w3c-vc-data-model-2-0#R-0256"
          - "w3c-vc-data-model-2-0#R-0196"
        constrained_by_text:
          - "§4.12: RECOMMENDED embedded proof mechanism"
          - "§5.13: MAY be used by the embedded securing mechanism"
          - "§5.13: MUST document normative algorithms"
          - "§5.13: The algorithms MAY be general in nature"
          - "§5.13: MAY provide algorithms and interfaces in addition"
          - "§5.13: MAY be used to secure data other than conforming documents"
        on_error: "delegated to the securing mechanism specification"
        on_error_basis: "unspecified"
      - n: "2"
        from: "securing-mechanism"
        to: "securing-mechanism"
        message: "embedded proof (proof property)"
        message_ref: "MU-07"
        action: >-
          Relate the document to its proof graph by a property, define every proof-graph term,
          and secure every graph except the proof graphs securing the document itself: for a
          presentation, the default graph and each credential with its own proof graphs.
        locator: "§5.13"
        basis: "stated"
        quotes:
          - at: "§5.13"
            source_lines: "3227"
            status: "normative"
            quote: |-
              A securing mechanism specification that creates a new type of embedded proof MUST specify a property that relates the verifiable credential or verifiable presentation to a proof graph.
          - at: "§5.13"
            source_lines: "3228"
            status: "normative"
            quote: |-
              The securing mechanism MUST define all terms used by the proof graph.
          - at: "§5.13"
            source_lines: "3229"
            status: "normative"
            quote: |-
              The securing mechanism MUST secure all graphs in the verifiable credential or the verifiable presentation, except for any proof graphs securing the verifiable credential or the verifiable presentation itself.
          - at: "§5.13"
            source_lines: "3231"
            status: "non-normative (note)"
            quote: |-
              The last requirement means that the securing mechanism secures the default graph and, for verifiable presentations, each verifiable credential of the presentation, together with their respective proof graphs.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0103"
