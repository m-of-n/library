    kind: "exchange"
    source_status: "normative"
    participants:
      - "issuer"
      - "conforming-verifier-implementation"
      - "related-resource-host"
    summary: >-
      The one place the source specifies an HTTP retrieval and an error on its result. The
      issuer side is F01 step 8.
