  - id: "F04"
    name: "presentation-request"
    title: "Verifier asks a holder for credentials (described, not specified)"
    locator: "Appendix A.1, §4.13, §8.2, §8.9, §9.5.2"
    kind: "exchange"
    source_status: "mixed"
    participants:
      - "verifier"
      - "holder"
    summary: >-
      The nearest the source comes to a request/response. Every sentence is non-normative except
      the SHOULD that presentations be bound to a verifier's challenge, and no request
      structure, challenge property or refusal message is defined.
    diagram: "protocol.md#f04-presentation-request"
    steps:
      - n: "1"
        from: "verifier"
        to: "holder"
        message: "presentation request (not defined)"
        message_ref: "MU-21"
        action: >-
          Request credentials of the wanted type(s), asking only for what the transaction needs,
          optionally with a challenge for the presentation to be bound to.
        locator: "Appendix A.1, §8.9, §4.13, §9.5.2"
        basis: "stated"
        quotes:
          - at: "Appendix A.1"
            source_lines: "4022"
            status: "non-normative (section)"
            quote: |-
              When a verifier requests one or more verifiable credentials from a holder, they can specify the type of credential(s) that they would like to receive.
          - at: "§8.9"
            source_lines: "3481"
            status: "non-normative (section)"
            quote: |-
              Verifiers are urged to only request information that is strictly necessary for a specific transaction to occur.
          - at: "§4.13"
            source_lines: "2467"
            status: "normative"
            quote: |-
              Verifiable presentations SHOULD be extremely short-lived and bound to a challenge provided by a verifier.
          - at: "§9.5.2"
            source_lines: "3854"
            status: "unmarked subsection of a non-normative section"
            quote: |-
              A challenge provided by the verifier, which the holder incorporates into a verifiable presentation.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0037"
        constrained_by_text:
          - "§4.13: SHOULD be extremely short-lived"
        on_error: >-
          unspecified by source (Appendix A.1: no request format, no error for an unsatisfiable
          request)
        on_error_basis: "unspecified"
      - n: "2"
        from: "holder"
        to: "holder"
        message: "presentation request (not defined)"
        message_ref: "MU-21"
        action: >-
          Holder software shows the holder what is requested and releases information only with
          consent; the holder may decline items.
        locator: "§8.2, §8.9"
        basis: "stated"
        quotes:
          - at: "§8.2"
            source_lines: "3416"
            status: "non-normative (section)"
            quote: |-
              A holder's user agent (holder software), such as a digital wallet, is expected to only divulge information to a verifier when the holder consents to releasing that information.
          - at: "§8.9"
            source_lines: "3484"
            status: "non-normative (section)"
            quote: |-
              Implementers of software used by holders are encouraged to disclose the information being requested by a verifier, allowing the holder to decline to share specific information that is unnecessary for the transaction.
        on_error: "unspecified by source (§8.2, §8.9)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "holder"
        to: "verifier"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: "Answer with a presentation (F05), or decline."
        locator: "§1.1"
        basis: "inferred"
        inferred_reason: >-
          The source defines the presentation but no response to a request; a refusal has no
          message.
        quotes:
          - at: "§1.1"
            source_lines: "197"
            status: "non-normative (section)"
            quote: |-
              Holders of verifiable credentials can generate verifiable presentations and then share these verifiable presentations with verifiers to prove they possess verifiable credentials with specific characteristics.
        on_error: "unspecified by source (no refusal or error response is defined)"
        on_error_basis: "unspecified"
  - id: "F05"
    name: "presentation"
    title: "Holder builds, secures and transmits a verifiable presentation"
    locator: "§3.3, §4.13, §5.4, §5.5, §8.10"
    kind: "creation-and-delivery"
    source_status: "mixed"
    participants:
      - "holder"
      - "credential-repository"
      - "securing-mechanism"
      - "verifier"
    summary: >-
      The holder side. The presentation's properties are normative; challenge binding is a
      SHOULD whose mechanics are delegated; the transmission is named and not defined. A holder
      may also present credentials directly without a presentation.
    diagram: "protocol.md#f05-presentation"
    steps:
      - n: "1"
        from: "holder"
        to: "credential-repository"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: "Select the credentials to present, possibly from several issuers."
        locator: "§3.3, §4.13"
        basis: "inferred"
        inferred_reason: "Retrieval from the repository is this model's step; the source states the aggregation."
        quotes:
          - at: "§4.13"
            source_lines: "2466"
            status: "normative"
            quote: |-
              Verifiable presentations MAY be used to aggregate information from multiple verifiable credentials.
          - at: "§3.3"
            source_lines: "318"
            status: "non-normative (section)"
            quote: |-
              The data in a presentation is often about the same subject but might have been issued by multiple issuers.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0036"
        constrained_by_text:
          - "§4.13: MAY be used to aggregate information"
        on_error: "unspecified by source (§3.3, §4.13)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "holder"
        to: "refresh-service"
        message: "refresh request (type-defined; example POSTs the credential)"
        message_ref: "MU-15"
        action: >-
          Optionally refresh a credential first, when its refreshService is meant for the holder
          (F14).
        locator: "§5.4"
        basis: "stated"
        quotes:
          - at: "§5.4"
            source_lines: "2923"
            status: "normative"
            quote: |-
              In the latter case, this enables the holder to refresh the verifiable credential before creating a verifiable presentation to share with a verifier.
        on_error: "unspecified by source (§5.4)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "holder"
        to: "holder"
        message: "verifiable presentation (application/vp)"
        message_ref: "MU-03"
        action: >-
          Build the presentation: @context (base context first), type including
          VerifiablePresentation, optional id, optional holder (a URL or an object with id),
          verifiableCredential values that are objects (credentials or Enveloped credentials)
          secured by a securing mechanism, optional termsOfUse.
        locator: "§4.3, §4.13, §5.5"
        basis: "stated"
        quotes:
          - at: "§4.3"
            source_lines: "391"
            status: "normative"
            quote: |-
              Verifiable credentials and verifiable presentations MUST include a @context property.
          - at: "§4.13"
            source_lines: "2473"
            status: "normative"
            quote: |-
              The type property MUST be present. It is used to express the type of verifiable presentation. One value of this property MUST be VerifiablePresentation, but additional types MAY be included. The related normative guidance in Section 4.5 Types MUST be followed.
          - at: "§4.13"
            source_lines: "2475"
            status: "normative"
            quote: |-
              The verifiableCredential property MAY be present. The value MUST be one or more verifiable credential and/or enveloped verifiable credential objects (the values MUST NOT be non-object values such as numbers, strings, or URLs). These objects are called verifiable credential graphs and MUST express information that is secured using a securing mechanism.
          - at: "§4.13"
            source_lines: "2477"
            status: "normative"
            quote: |-
              The verifiable presentation MAY include a holder property. If present, the value MUST be either a URL or an object containing an id property.
          - at: "§5.5"
            source_lines: "2955"
            status: "normative"
            quote: |-
              The holder places their terms of use inside a verifiable presentation.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0008"
          - "w3c-vc-data-model-2-0#R-0202"
          - "w3c-vc-data-model-2-0#R-0203"
          - "w3c-vc-data-model-2-0#R-0206"
          - "w3c-vc-data-model-2-0#R-0208"
          - "w3c-vc-data-model-2-0#R-0043"
          - "w3c-vc-data-model-2-0#R-0209"
          - "w3c-vc-data-model-2-0#R-0045"
          - "w3c-vc-data-model-2-0#R-0199"
          - "w3c-vc-data-model-2-0#R-0011"
          - "w3c-vc-data-model-2-0#R-0200"
          - "w3c-vc-data-model-2-0#R-0201"
          - "w3c-vc-data-model-2-0#R-0154"
          - "w3c-vc-data-model-2-0#R-0253"
