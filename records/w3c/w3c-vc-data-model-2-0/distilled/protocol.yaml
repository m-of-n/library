flows:
  - id: "F01"
    name: "issuance"
    title: "Issuer creates, secures and transmits a verifiable credential to a holder"
    locator: "§1.2, §1.3, §2, §4.1-§4.12, §5.2-§5.6, §6.1"
    kind: "creation-and-delivery"
    source_status: "mixed"
    participants:
      - "issuer"
      - "conforming-issuer-implementation"
      - "securing-mechanism"
      - "holder"
      - "credential-repository"
    summary: >-
      The issuer side of the ecosystem. The source specifies the document the issuer produces
      (required and optional properties, contexts, securing, media type) and says the issuer
      transmits it to a holder; it defines no transmission, acknowledgement or error message.
      Every on_error on the producing side is unspecified: a defect in what the issuer produces
      surfaces only when a conforming verifier implementation checks the document (F09). The
      holder's verification on receipt is this model's.
    diagram: "protocol.md#f01-issuance"
    steps:
      - n: "1"
        from: "issuer"
        to: "issuer"
        message: "credential"
        message_ref: "MU-01"
        action: >-
          Assert claims about one or more subjects; one credential may carry claims about
          several subjects.
        locator: "§2"
        basis: "stated"
        quotes:
          - at: "§2"
            source_lines: "254"
            status: "normative"
            quote: |-
              A role an entity can perform by asserting claims about one or more subjects, creating a verifiable credential from these claims, and transmitting the verifiable credential to a holder.
          - at: "§2"
            source_lines: "242"
            status: "normative"
            quote: |-
              A set of one or more claims made by an issuer. The claims in a credential can be about different subjects.
        on_error: "unspecified by source (§2)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "issuer"
        to: "conforming-issuer-implementation"
        message: "credential"
        message_ref: "MU-01"
        action: >-
          Hand the assembled credential (context, type, credentialSubject properties) to a
          conforming issuer implementation, which creates the verifiable credential.
        locator: "§4.1"
        basis: "stated"
        quotes:
          - at: "§4.1"
            source_lines: "338"
            status: "non-normative (section)"
            quote: |-
              Once a developer has added a number of these property-value combinations, the modified object can be sent to a conforming issuer implementation, and a verifiable credential will be created for the developer.
        on_error: "unspecified by source (§4.1)"
        on_error_basis: "unspecified"
      - n: "3"
        from: "conforming-issuer-implementation"
        to: "conforming-issuer-implementation"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          Include every required property: @context with the base context URL first, type with
          VerifiableCredential, issuer (a URL or an object whose id is a URL), credentialSubject
          (each object is what one or more claims are about).
        locator: "§1.3, §4.3, §4.5, §4.7, §4.8"
        basis: "stated"
        quotes:
          - at: "§1.3"
            source_lines: "229"
            status: "unmarked subsection of a non-normative section"
            quote: |-
              A conforming issuer implementation produces conforming documents, MUST include all required properties in the conforming documents it produces
          - at: "§4.3"
            source_lines: "391"
            status: "normative"
            quote: |-
              Verifiable credentials and verifiable presentations MUST include a @context property.
          - at: "§4.3"
            source_lines: "393"
            status: "normative"
            quote: |-
              The value of the @context property MUST be an ordered set where the first item is a URL with the value https://www.w3.org/ns/credentials/v2.
          - at: "§4.5"
            source_lines: "660"
            status: "normative"
            quote: |-
              Verifiable credentials and verifiable presentations MUST contain a type property with an associated value.
          - at: "§4.7"
            source_lines: "1280"
            status: "normative"
            quote: |-
              A verifiable credential MUST have an issuer property.
          - at: "§4.7"
            source_lines: "1282"
            status: "normative"
            quote: |-
              The value of the issuer property MUST be either a URL or an object containing an id property whose value is a URL;
          - at: "§4.8"
            source_lines: "1772"
            status: "normative"
            quote: |-
              A verifiable credential MUST contain a credentialSubject property.
          - at: "§4.8"
            source_lines: "1774"
            status: "normative"
            quote: |-
              The value of the credentialSubject property is a set of objects where each object MUST be the subject of one or more claims, which MUST be serialized inside the credentialSubject property.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0129"
          - "w3c-vc-data-model-2-0#R-0008"
          - "w3c-vc-data-model-2-0#R-0141"
          - "w3c-vc-data-model-2-0#R-0149"
          - "w3c-vc-data-model-2-0#R-0152"
          - "w3c-vc-data-model-2-0#R-0167"
          - "w3c-vc-data-model-2-0#R-0168"
          - "w3c-vc-data-model-2-0#R-0171"
          - "w3c-vc-data-model-2-0#R-0173"
          - "w3c-vc-data-model-2-0#R-0011"
          - "w3c-vc-data-model-2-0#R-0150"
          - "w3c-vc-data-model-2-0#R-0151"
          - "w3c-vc-data-model-2-0#R-0153"
          - "w3c-vc-data-model-2-0#R-0144"
          - "w3c-vc-data-model-2-0#R-0169"
          - "w3c-vc-data-model-2-0#R-0142"
          - "w3c-vc-data-model-2-0#R-0175"
          - "w3c-vc-data-model-2-0#R-0131"
          - "w3c-vc-data-model-2-0#R-0128"
          - "w3c-vc-data-model-2-0#R-0172"
          - "w3c-vc-data-model-2-0#R-0174"
        constrained_by_text:
          - "§1.3: MUST include all required properties"
          - "§4.3: MUST include a @context property"
          - "§4.3: first item is a URL with the value"
          - "§4.5: MUST contain a type property"
          - "§4.5: MUST have a type specified"
          - "§4.7: MUST have an issuer property"
          - "§4.7: MUST be either a URL or an object containing an id property whose value is a URL"
          - "§4.8: MUST contain a credentialSubject property"
          - "§4.8: MUST be the subject of one or more claims"
          - "§4.3: Subsequent items in the ordered set MUST"
          - "§4.5: MUST be one or more terms and absolute URL strings"
          - "§4.5: If more than one value is provided, the order does not matter"
          - "§4.5: Verifiable credential object | VerifiableCredential"
          - "§4.3: Implementations are expected to not use this URL"
          - "§4.7: the issuer selects this URL to identify itself"
          - "§4.3: An @context whose value is the single string"
          - "§4.8: an empty credentialSubject object fails"
          - "§1.3: The required properties R-0129 has an issuer include"
        on_error: >-
          unspecified by source (§1.3: no issuer-side error is defined; the omission makes a
          non-conforming document, which a conforming verifier implementation must report, F09
          step 8)
        on_error_basis: "unspecified"
      - n: "4"
        from: "conforming-issuer-implementation"
        to: "conforming-issuer-implementation"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          Optionally set id (a single URL) on the credential and its objects, name and
          description (string or language value object), and more specific types alongside
          VerifiableCredential.
        locator: "§4.4, §4.5, §4.6"
        basis: "stated"
        quotes:
          - at: "§4.4"
            source_lines: "421"
            status: "normative"
            quote: |-
              The id property allows for expressing statements about specific things in the verifiable credential and is set by an issuer when expressing objects in a verifiable credential or a holder when expressing objects in a verifiable presentation.
          - at: "§4.4"
            source_lines: "425"
            status: "normative"
            quote: |-
              If present, id property's value MUST be a single URL, which MAY be dereferenceable.
          - at: "§4.6"
            source_lines: "922"
            status: "normative"
            quote: |-
              If present, the value of the name property MUST be a string or a language value object as described in 11.1 Language and Base Direction.
          - at: "§4.6"
            source_lines: "924"
            status: "normative"
            quote: |-
              If present, the value of the description property MUST be a string or a language value object as described in 11.1 Language and Base Direction.
          - at: "§4.5"
            source_lines: "908"
            status: "normative"
            quote: |-
              All credentials, presentations, and encapsulated objects SHOULD specify, or be associated with, additional, more narrow types (like ExampleDegreeCredential, for example) so software systems can more easily detect and process this additional information.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0147"
          - "w3c-vc-data-model-2-0#R-0013"
          - "w3c-vc-data-model-2-0#R-0162"
          - "w3c-vc-data-model-2-0#R-0164"
          - "w3c-vc-data-model-2-0#R-0016"
          - "w3c-vc-data-model-2-0#R-0024"
          - "w3c-vc-data-model-2-0#R-0118"
          - "w3c-vc-data-model-2-0#R-0119"
          - "w3c-vc-data-model-2-0#R-0120"
          - "w3c-vc-data-model-2-0#R-0121"
          - "w3c-vc-data-model-2-0#R-0146"
          - "w3c-vc-data-model-2-0#R-0161"
          - "w3c-vc-data-model-2-0#R-0163"
          - "w3c-vc-data-model-2-0#R-0166"
          - "w3c-vc-data-model-2-0#R-0165"
          - "w3c-vc-data-model-2-0#R-0145"
          - "w3c-vc-data-model-2-0#R-0148"
        constrained_by_text:
          - "§4.4: MUST be a single URL"
          - "§4.4: RECOMMENDED that the URL in the id"
          - "§4.6: value of the name property MUST"
          - "§4.6: value of the description property MUST"
          - "§4.5: SHOULD specify, or be associated with, additional, more narrow types"
          - "§4.8: Each object MAY also contain an id property"
          - "§11.1: When the language value object is used in place of a string value"
          - "§11.1: MUST NOT include any other keys"
          - "§11.1: Multiple language value objects MAY be provided"
          - "§11.2: The language and base direction of each natural language string property value SHOULD be provided"
          - "§4.4: The id property is OPTIONAL."
          - "§4.6: An OPTIONAL property that expresses the name"
          - "§4.6: An OPTIONAL property that conveys specific details"
          - "§4.6: one can use an object that contains the @value"
          - "§4.6: A language value object, as R-0162 and R-0164 admit one"
        on_error: "unspecified by source (§4.4, §4.5, §4.6)"
        on_error_basis: "unspecified"
      - n: "5"
        from: "conforming-issuer-implementation"
        to: "conforming-issuer-implementation"
        message: "verifiable credential (application/vc)"
        message_ref: "MU-02"
        action: >-
          Optionally bound the validity period: validFrom and validUntil as dateTimeStamp
          values, validFrom not later than validUntil; time values in UTC (Z) or with an offset.
        locator: "§4.9, §5.8"
        basis: "stated"
        quotes:
          - at: "§4.9"
            source_lines: "2030"
            status: "normative"
            quote: |-
              If present, the value of the validFrom property MUST be a [XMLSCHEMA11-2] dateTimeStamp string value representing the date and time the credential becomes valid, which could be a date and time in the future or the past.
          - at: "§4.9"
            source_lines: "2030"
            status: "normative"
            quote: |-
              If a validUntil value also exists, the validFrom value MUST express a point in time that is temporally the same or earlier than the point in time expressed by the validUntil value.
          - at: "§4.9"
            source_lines: "2032"
            status: "normative"
            quote: |-
              If present, the value of the validUntil property MUST be a [XMLSCHEMA11-2] dateTimeStamp string value representing the date and time the credential ceases to be valid, which could be a date and time in the past or the future.
          - at: "§4.9"
            source_lines: "2032"
            status: "normative"
            quote: |-
              If a validFrom value also exists, the validUntil value MUST express a point in time that is temporally the same or later than the point in time expressed by the validFrom value.
          - at: "§5.8"
            source_lines: "3169"
            status: "normative"
            quote: |-
              all time values expressed in conforming documents SHOULD be specified in dateTimeStamp format, either in Universal Coordinated Time (UTC), denoted by a Z at the end of the value, or with a time zone offset relative to UTC.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0178"
          - "w3c-vc-data-model-2-0#R-0180"
