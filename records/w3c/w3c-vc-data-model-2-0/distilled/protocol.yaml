          - at: "§4.13"
            source_lines: "2521"
            status: "normative"
            quote: |-
              The id value of the object MUST be a data: URL [RFC2397] that expresses a secured verifiable presentation using an enveloping securing mechanism, such as Securing Verifiable Credentials using JOSE and COSE [VC-JOSE-COSE].
          - at: "§4.13"
            source_lines: "2521"
            status: "normative"
            quote: |-
              The type value of the object MUST be EnvelopedVerifiablePresentation.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0050"
          - "w3c-vc-data-model-2-0#R-0051"
          - "w3c-vc-data-model-2-0#R-0052"
          - "w3c-vc-data-model-2-0#R-0213"
        constrained_by_text:
          - "§4.13: EnvelopedVerifiablePresentation terms as defined"
          - "§4.13: data: URL [RFC2397] that expresses a secured verifiable presentation"
          - "§4.13: MUST be EnvelopedVerifiablePresentation"
        on_error: "unspecified by source (§4.13 (Enveloped Verifiable Presentations))"
        on_error_basis: "unspecified"
      - n: "5"
        from: "conforming-verifier-implementation"
        to: "securing-mechanism"
        message: "verification input (inputMediaType, inputData)"
        message_ref: "MU-08"
        action: >-
          On verification, an enveloping verifyProof takes bytes: give it inputMediaType and
          inputData unchanged (§7.1 step 1.2).
        locator: "§7.1 step 1.2"
        basis: "stated"
        quotes:
          - at: "§7.1"
            source_lines: "3369"
            status: "normative"
            quote: |-
              If the verifyProof function expects a byte sequence, provide inputMediaType and inputData to the algorithm.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0100"
          - "w3c-vc-data-model-2-0#R-0276"
        constrained_by_text:
          - "§5.13: MUST provide an interface that receives a media type"
        on_error: "unspecified by source (§7.1 step 1.2)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "securing-mechanism"
        to: "conforming-verifier-implementation"
        message: "verifyProof result (verified, verifiedDocument, mediaType)"
        message_ref: "MU-10"
        action: "Return the payload in isolation, without header parameters or signatures."
        locator: "§5.13"
        basis: "stated"
        quotes:
          - at: "§5.13"
            source_lines: "3219"
            status: "normative"
            quote: |-
              Securing mechanism specifications MUST provide a verification algorithm that returns the information in the conforming document that has been secured, in isolation, without including any securing mechanism information, such as proof or JOSE/COSE header parameters and signatures.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0098"
          - "w3c-vc-data-model-2-0#R-0257"
        constrained_by_text:
          - "§5.13: MUST provide a verification algorithm that returns the information"
          - "§5.13: The verification algorithm returns a verification result with at least"
        on_error: "stated in §7.1: a false status becomes CRYPTOGRAPHIC_SECURITY_ERROR (F09 step 4)"
        on_error_basis: "stated"
      - n: "7"
        from: "conforming-verifier-implementation"
        to: "conforming-verifier-implementation"
        message: "EnvelopedVerifiableCredential"
        message_ref: "MU-04"
        action: >-
          For each EnvelopedVerifiableCredential in a verified presentation, decode the data:
          URL and run §7.1 on its content with the media type the data: URL declares.
        locator: "§4.13, §7.1"
        basis: "inferred"
        inferred_reason: >-
          The source requires the enveloped content to be secured and requires §7.1 for any
