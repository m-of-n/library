applicability: >-
  The VC Data Model defines a data model, two media types and one verification algorithm. It
  defines no protocol: no request, response, session, transport binding, acknowledgement or
  error message passes between issuer, holder and verifier, and its own words say the roles only
  suggest interfaces and protocols for standardization (FR-01). The artifact is not N/A because
  the source does specify (a) three roles and a registry with the flows between them, in prose
  (§1.2, §2, §3.3, §5.1); (b) what each role must put in what it produces (§4, §5); (c) the
  hand-off to securing mechanisms in both directions (§4.12, §5.13); (d) the §7.1 algorithm a
  conforming verifier must run, with its error vocabulary (§7.2); and (e) one HTTP retrieval
  with an error rule (§5.3). Every flow below is one party building an object, an undefined
  delivery, and the receiver processing it alone; every on_error is local to the role that meets
  the failure, since nothing travels back. Status, refresh, registry, validation and the content
  of securing are delegated; where this file supplies a step the source does not state, the step
  is marked inferred with the reason.
conventions:
  quoting: >-
    Every quotes item is {at, source_lines, status, quote}. quote is cut by script from the
    rendering as bin/check-quotes reads it (bin/_source_text clean and span), selected by line
    and, for a sub-span, by a start and an end anchor; nothing in it was typed. bin/check-quotes
    checks every one against its lines with the tight-range rule, and a second script check
    found every quote in the HTML's text with inline tags removed, so none carries a rendering
    artefact of the .txt. at is the section of the quote's lines, computed. status is the
    normative status of those lines from the HTML markup: normative, non-normative (section,
    note, example or figure), or unmarked subsection of a non-normative section (T-11).
  locators: >-
    A section as in the rendering's headings (§n, Appendix X.n); an unnumbered sub-heading is
    named in parentheses; an algorithm step by its HTML list position (§7.1 step 1.2 is the
    second item of the list inside item 1). No paragraph counts: position inside a section is
    given by each quote's source_lines, because the rendering interleaves example tab labels and
    pre bodies with prose and a paragraph number would depend on which of them one counts. Line
    numbers are those of the rendering.
  basis: >-
    basis is stated (the source says the step happens) or inferred (this model's step), with
    inferred_reason. on_error_basis is stated (the source says what follows a failure),
    unspecified (the source names the operation and nothing about its failure; on_error then
    begins `unspecified by source`) or inferred (this model's reading, said in on_error).
    action, on_error and summaries are this file's wording; the quotes carry the source's.
  messages: >-
    message names an entry of messages_used, this file's vocabulary of the source's own terms,
    and message_ref its MU id. messages.yaml was written concurrently by another lane and was
    not read; pass 3 joins messages_used to it. Where the source names no structure (a
    presentation request, a refresh request), the entry says so.
  roles: "from and to name roles of the roles list; from equal to to is local processing."
  steps: >-
    n is this file's ordering, except in F09, where 1.1 to 3 are §7.1's own list positions, 0 is
    a step before the algorithm and X1 to X6 are verifier duties stated outside it.
  constrained_by: >-
    requirement ids of distilled/requirements.yaml, joined by script two ways. (1) Selectors: a
    section and a fragment of the requirement's text, refusing zero or several matches, a split
    parent yielding to the child that also matches; each selector is kept, in order, under
    constrained_by_text (its fragment is exact by construction, since it matched a verbatim
    requirement text). (2) Quote joins: every requirement on the lines of one of the item's own
    quotes whose text lies inside that quote (failing that, the most specific requirement
    containing it), parents again yielding to children; these ids follow the selector ids and
    have no constrained_by_text line. requirements.yaml was read only for this, at the end of
    the pass, while the requirements lane was still splitting and renumbering it, so the ids are
    true of the sha256 recorded in coverage only: after any later change to requirements.yaml,
    re-run both joins (the selectors and quotes are all here) rather than trust the ids. A
    selector that matched nothing is kept under constrained_by_unresolved with the reason.
  kind_of_flow: >-
    creation-and-delivery: a party builds an object and an undefined delivery carries it.
    hand-off: the data model passing a document to a securing mechanism and back. exchange: two
    parties depend on each other (request, retrieval). receive-processing: the receiver's local
    processing. local-decision: a choice one party makes alone. local-processing: a
    transformation with no counterparty.
framing:
  - id: "FR-01"
    basis: "stated"
    text: >-
      Three roles exchange credentials: the issuer gives a credential to the holder, the holder
      presents to the verifier. The ecosystem is described, not specified as a protocol.
    locator: "Abstract, §1.2"
    quotes:
      - at: "Abstract"
        source_lines: "44"
        status: "front matter"
        quote: |-
          a three-party ecosystem for the exchange of these credentials that is composed of issuers, holders, and verifiers.
      - at: "§1.2"
        source_lines: "205"
        status: "non-normative (section)"
        quote: |-
          The separation of roles suggests likely interfaces and protocols for standardization.
  - id: "FR-02"
    basis: "stated"
    text: >-
      Verification (authentic and current) precedes validation (business rules); validation is
      outside the specification.
    locator: "§1.1, §2"
    quotes:
      - at: "§1.1"
        source_lines: "200"
        status: "non-normative (section)"
        quote: |-
          Instead, upon establishing the authenticity and currency of a verifiable credential or verifiable presentation, a verifier validates the included claims using their own business rules before relying on them.
      - at: "§2"
        source_lines: "268"
        status: "normative"
        quote: |-
          However, the means for such validation vary widely and are outside the scope of this specification.
  - id: "FR-03"
    basis: "stated"
    text: >-
      Verification is defined to include the status check when status is present; the §7.1
      algorithm does not perform one (tension T-07).
    locator: "§2, §7.1"
    quotes:
      - at: "§2"
        source_lines: "276"
        status: "normative"
        quote: |-
          This includes checking that the credential or presentation conforms to the specification, the securing mechanism is satisfied, and, if present, the status check succeeds.
  - id: "FR-04"
    basis: "stated"
    text: >-
      The only algorithm the source makes mandatory for a verifier is §7.1; everything it calls
      into (verifyProof) is defined by a securing mechanism specification.
    locator: "§7.1, §5.13"
    quotes:
      - at: "§7.1"
        source_lines: "3358"
        status: "normative"
        quote: |-
          This section contains an algorithm that conforming verifier implementations MUST run when verifying a verifiable credential or a verifiable presentation.
      - at: "§7.1"
        source_lines: "3368"
        status: "normative"
        quote: |-
          The verifyProof function MUST implement the interface described in 5.13 Securing Mechanism Specifications.
  - id: "FR-05"
    basis: "stated"
    text: >-
      Transport, challenge binding and presentation request are left to securing mechanisms,
      transport protocols and verifier policy.
    locator: "§4.13"
    quotes:
      - at: "§4.13"
        source_lines: "2467"
        status: "normative"
        quote: |-
          Details for accomplishing this depend on the securing mechanism, the transport protocol, and verifier policies.
  - id: "FR-06"
    basis: "stated"
    text: "Status, trust in issuers and validation conformance are explicitly out of scope."
    locator: "§4.10, §5.1, Appendix A"
    quotes:
      - at: "§4.10"
        source_lines: "2340"
        status: "normative"
        quote: |-
          Defining the data model, formats, and protocols for status schemes is out of the scope of this specification.
      - at: "§5.1"
        source_lines: "2618"
        status: "non-normative (section)"
        quote: |-
          How verifiers decide which issuers to trust, and for what data or purposes, is out of scope for this recommendation.
      - at: "Appendix A"
        source_lines: "4017"
        status: "non-normative (section)"
        quote: |-
          While this specification does not provide conformance criteria for the process of the validation of verifiable credentials or verifiable presentations,
roles:
  - name: "issuer"
    kind: "party"
    defined_in: "§1.2, §2"
    description: >-
      Asserts claims about one or more subjects, creates a verifiable credential from them and
      transmits it to a holder. Chooses the issuer URL, sets id values in the credential, and
      may add credentialSchema, refreshService, termsOfUse, evidence and relatedResource.
      Expected to revoke credentials it no longer stands by. Implemented by a conforming issuer
      implementation.
    conformance_class: "conforming issuer implementation (§1.3)"
    quotes:
      - at: "§1.2"
        source_lines: "209"
        status: "non-normative (section)"
        quote: |-
          A role an entity can perform by asserting claims about one or more subjects, creating a verifiable credential from these claims, and transmitting the verifiable credential to a holder. For example,
      - at: "§4.7"
        source_lines: "1282"
        status: "normative"
        quote: |-
          in either case, the issuer selects this URL to identify itself in a globally unambiguous way.
      - at: "§5.1"
        source_lines: "2610"
        status: "non-normative (section)"
        quote: |-
          The holder and verifier expect the issuer to stand by claims it makes in credentials about the subject, and to revoke credentials quickly if and when they no longer stand by those claims.
  - name: "holder"
    kind: "party"
    defined_in: "§1.2, §2"
    description: >-
      Possesses verifiable credentials, stores them in a credential repository and generates
      verifiable presentations from them for verifiers. Often but not always the subject. Sets
      id values in presentation objects, may add termsOfUse to a presentation, may include
      self-asserted credentials, may refresh, may derive selectively disclosed proofs.
    conformance_class: >-
      none: the source defines no holder conformance class (§1.3 names issuer and verifier
      implementations only)
    quotes:
      - at: "§1.2"
        source_lines: "207"
        status: "non-normative (section)"
        quote: |-
          A role an entity might perform by possessing one or more verifiable credentials and generating verifiable presentations from them. A holder is often, but not always, a subject of the verifiable credentials they are holding. Holders store their credentials in credential repositories. Example holders
      - at: "§1.1"
        source_lines: "197"
        status: "non-normative (section)"
        quote: |-
          Holders of verifiable credentials can generate verifiable presentations and then share these verifiable presentations with verifiers to prove they possess verifiable credentials with specific characteristics.
  - name: "verifier"
    kind: "party"
    defined_in: "§1.2, §2"
    description: >-
      Receives verifiable credentials, possibly within a verifiable presentation. Runs the §7.1
      algorithm through a conforming verifier implementation, then validates under its own
      business rules. Other specifications call it a relying party.
    conformance_class: "conforming verifier implementation (§1.3)"
    quotes:
      - at: "§1.2"
        source_lines: "213"
        status: "non-normative (section)"
        quote: |-
          A role an entity performs by receiving one or more verifiable credentials, optionally inside a verifiable presentation for processing. Example verifiers
      - at: "§2"
        source_lines: "278"
        status: "normative"
        quote: |-
          Other specifications might refer to this concept as a relying party.
  - name: "subject"
    kind: "entity"
    defined_in: "§1.2, §2"
    description: >-
      The entity the claims are about. Takes no protocol action in the source; may be the
      holder. In the evidence example it supplies documentation to the issuer.
    conformance_class: "none"
    quotes:
      - at: "§1.2"
        source_lines: "211"
        status: "non-normative (section)"
        quote: |-
          A thing about which claims are made. Example subjects include human beings, animals, and things.
      - at: "§1.2"
        source_lines: "221"
        status: "non-normative (note)"
        quote: |-
          In many cases, the holder of a verifiable credential is the subject, but in some instances it is not.
  - name: "verifiable-data-registry"
    kind: "system"
    defined_in: "§1.2, §2"
    description: >-
      Mediates identifiers, verification material, schemas and revocation registries, both their
      creation and their verification. Expected by all entities to be tamper-evident. No
      interface is defined.
    conformance_class: "none"
    quotes:
      - at: "§1.2"
        source_lines: "215"
        status: "non-normative (section)"
        quote: |-
          A role a system might perform by mediating the creation and verification of identifiers, verification material, and other relevant data, such as verifiable credential schemas, revocation registries, and so on, which might require using verifiable credentials.
      - at: "§5.1"
        source_lines: "2609"
        status: "non-normative (section)"
        quote: |-
          All entities expect the verifiable data registry to be tamper-evident and to be a correct record of which data is controlled by which entities.
  - name: "credential-repository"
    kind: "software"
    defined_in: "§2"
    description: >-
      Stores and protects access to a holder's verifiable credentials (a wallet, vault or file
      system). Trusted by the holder not to release, corrupt or lose them.
    conformance_class: "none"
    quotes:
      - at: "§2"
        source_lines: "260"
        status: "normative"
        quote: |-
          Software, such as a file system, storage vault, or personal verifiable credential wallet, that stores and protects access to holders' verifiable credentials.
      - at: "§5.1"
        source_lines: "2614"
        status: "non-normative (section)"
        quote: |-
          The holder expects the credential repository to store credentials securely, to not release credentials to anyone other than the holder (which may subsequently present them to a verifier), and to not corrupt nor lose credentials while they are in its care.
  - name: "conforming-issuer-implementation"
    kind: "conformance-class"
    defined_in: "§1.3"
    description: >-
      Produces conforming documents, includes every required property and secures what it
      produces.
    conformance_class: "itself"
    quotes:
      - at: "§1.3"
        source_lines: "229"
        status: "unmarked subsection of a non-normative section"
        quote: |-
          A conforming issuer implementation produces conforming documents, MUST include all required properties in the conforming documents it produces, and MUST secure the conforming documents it produces using a securing mechanism described in Section 4.12 Securing Mechanisms.
  - name: "conforming-verifier-implementation"
    kind: "conformance-class"
    defined_in: "§1.3, §7.1"
    description: >-
      Consumes conforming documents, performs verification, checks every required property and
      produces errors for non-conforming documents; runs the §7.1 algorithm.
    conformance_class: "itself"
    quotes:
      - at: "§1.3"
        source_lines: "230"
        status: "unmarked subsection of a non-normative section"
        quote: |-
          A conforming verifier implementation consumes conforming documents, MUST perform verification on a conforming document as described in Section 4.12 Securing Mechanisms, MUST check that each required property satisfies the normative requirements for that property, and MUST produce errors when non-conforming documents are detected.
  - name: "securing-mechanism"
    kind: "component"
    defined_in: "§4.12, §5.13, §7.1"
    description: >-
      The specification and code behind verifyProof: an embedded proof (Data Integrity) or an
      enveloping proof (JOSE, COSE, SD-JWT). Selected from the media type; its algorithms are
      defined elsewhere.
    conformance_class: "securing mechanism specification (§5.13 obligations on its authors)"
    quotes:
      - at: "§4.12"
        source_lines: "2390"
        status: "normative"
        quote: |-
          This specification recognizes two classes of securing mechanisms: those that use enveloping proofs and those that use embedded proofs.
      - at: "§5.13"
        source_lines: "3218"
        status: "normative"
        quote: |-
          Securing mechanism specifications MUST document normative algorithms that provide content integrity protection for conforming documents.
  - name: "refresh-service"
    kind: "service"
    defined_in: "§5.4"
    description: >-
      Endpoint named by a refreshService object. Who operates it is not stated; the example's
      URL is a registration provider's. Request and response are defined by the refreshService
      type.
    conformance_class: "none"
    quotes:
      - at: "§5.4"
        source_lines: "2922"
        status: "normative"
        quote: |-
          This specification defines a refreshService property, which enables an issuer to include a link to a refresh service.
  - name: "status-information-source"
    kind: "service"
    defined_in: "§4.10"
    description: >-
      Whatever a credentialStatus type points at (for example an external status document). Its
      format and protocol are delegated to status specifications.
    conformance_class: "credential status specification (§4.10 obligation on its authors)"
    quotes:
      - at: "§4.10"
        source_lines: "2277"
        status: "normative"
        quote: |-
          For example, the object could contain a link to an external document that notes whether the credential is suspended or revoked.
  - name: "related-resource-host"
    kind: "service"
    defined_in: "§5.3"
    description: >-
      Serves a resource named by a relatedResource id; the source describes retrieval over HTTP
      only.
    conformance_class: "none"
    quotes:
      - at: "§5.3"
        source_lines: "2890"
        status: "normative"
        quote: |-
          If a mediaType is listed, implementations that retrieve the resource identified by the id property using HTTP Semantics SHOULD:
  - name: "specification-author"
    kind: "design-time"
    defined_in: "§4.10, §5.2, §5.7, §5.11, §5.13"
    description: >-
      Authors of securing mechanisms, status schemes, transformations, vocabularies and ZKP
      mechanisms. Their obligations shape the runtime flows but are discharged when a
      specification is written, not in any exchange; they appear here only as the source of
      constraints.
    conformance_class: "per specification kind"
    quotes:
      - at: "§4.10"
        source_lines: "2341"
        status: "normative"
        quote: |-
          Credential status specifications MUST NOT enable tracking of individuals, such as an issuer being notified (either directly or indirectly) when a verifier is interested in a specific holder or subject.
      - at: "§5.7"
        source_lines: "3081"
        status: "normative"
        quote: |-
          Specification authors that create securing mechanisms MUST NOT design them in such a way that they leak information that would enable the verifier to correlate a holder across multiple verifiable presentations to different verifiers.
messages_used:
  - id: "MU-01"
    name: "credential"
    locator: "§2, §3.2"
    description: "An unsecured set of claims by one issuer; not a conforming document."
    quotes:
      - at: "§2"
        source_lines: "242"
        status: "normative"
        quote: |-
          A set of one or more claims made by an issuer. The claims in a credential can be about different subjects.
    used_by_steps: "2"
  - id: "MU-02"
    name: "verifiable credential (application/vc)"
    locator: "§1.3, §2, §4.2"
    description: "A conforming document secured by at least one securing mechanism."
    quotes:
      - at: "§2"
        source_lines: "270"
        status: "normative"
        quote: |-
          A tamper-evident credential whose authorship can be cryptographically verified.
      - at: "§1.3"
        source_lines: "228"
        status: "unmarked subsection of a non-normative section"
        quote: |-
          A conforming document MUST be either a verifiable credential with a media type of application/vc or a verifiable presentation with a media type of application/vp.
    used_by_steps: "20"
  - id: "MU-03"
    name: "verifiable presentation (application/vp)"
    locator: "§2, §4.13"
    description: >-
      Created by a holder; carries verifiable credentials, enveloped credentials or derived
      data.
    quotes:
      - at: "§2"
        source_lines: "274"
        status: "normative"
        quote: |-
          A tamper-evident presentation of information encoded in such a way that authorship of the data can be trusted after a process of cryptographic verification.
    used_by_steps: "13"
  - id: "MU-04"
    name: "EnvelopedVerifiableCredential"
    locator: "§4.13"
    description: >-
      Object in verifiableCredential whose id is a data: URL carrying an envelope-secured
      credential.
    quotes:
      - at: "§4.13"
        source_lines: "2497"
        status: "normative"
        quote: |-
          The id value of the object MUST be a data: URL [RFC2397] that expresses a secured verifiable credential using an enveloping security scheme, such as Securing Verifiable Credentials using JOSE and COSE [VC-JOSE-COSE].
    used_by_steps: "5"
  - id: "MU-05"
    name: "EnvelopedVerifiablePresentation"
    locator: "§4.13"
    description: "Object whose id is a data: URL carrying an envelope-secured presentation."
    quotes:
      - at: "§4.13"
        source_lines: "2521"
        status: "normative"
        quote: |-
          The id value of the object MUST be a data: URL [RFC2397] that expresses a secured verifiable presentation using an enveloping securing mechanism, such as Securing Verifiable Credentials using JOSE and COSE [VC-JOSE-COSE].
    used_by_steps: "1"
  - id: "MU-06"
    name: "enveloping proof (secured serialization)"
    locator: "§4.12, Appendix C.1"
    description: >-
      A securing mechanism's envelope around a serialization of the data model; media type of
      the envelope set by that mechanism (for example VC-JOSE-COSE).
    quotes:
      - at: "§4.12"
        source_lines: "2391"
        status: "normative"
        quote: |-
          An enveloping proof wraps a serialization of this data model.
      - at: "Appendix C.1"
        source_lines: "4180"
        status: "unmarked subsection of a non-normative section"
        quote: |-
          This media type can be used in an enveloping proof to denote the enveloped payload.
    used_by_steps: "1"
  - id: "MU-07"
    name: "embedded proof (proof property)"
    locator: "§4.12, §5.13"
    description: "Proof included in the serialization; for Data Integrity the proof property."
    quotes:
      - at: "§4.12"
        source_lines: "2392"
        status: "normative"
        quote: |-
          An embedded proof is a mechanism where the proof is included in the serialization of the data model.
      - at: "§5.13"
        source_lines: "3232"
        status: "normative"
        quote: |-
          The proof property as defined in [VC-DATA-INTEGRITY] MAY be used by the embedded securing mechanism.
    used_by_steps: "3"
  - id: "MU-08"
    name: "verification input (inputMediaType, inputData)"
    locator: "§7.1, §5.13"
    description: >-
      A media type string and the secured data as a byte sequence (or, for verifyProof, a map).
    quotes:
      - at: "§7.1"
        source_lines: "3358"
