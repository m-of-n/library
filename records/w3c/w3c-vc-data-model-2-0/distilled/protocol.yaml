        to: "conforming-verifier-implementation"
        message: "JSON-LD context"
        message_ref: "MU-22"
        action: >-
          If expansion or transformation to RDF is performed and errors (for example a protected
          term redefined), the credential or presentation fails verification.
        locator: "Appendix B.1, §5.2"
        basis: "stated"
        quotes:
          - at: "Appendix B.1"
            source_lines: "4105"
            status: "normative"
            quote: |-
