  - id: "F10"
    name: "context-processing"
    title: "Context handling on the consuming side: base context, other contexts, expansion errors"
    locator: "§4.3, §5.2, §6.1, §6.3, Appendix B.1, Appendix B.2"
    kind: "receive-processing"
    source_status: "mixed"
    participants:
      - "conforming-verifier-implementation"
      - "verifiable-data-registry"
    summary: >-
      What a consumer does with @context before it trusts any term. The base context is never
      fetched; its digest is printed (and matches the fetched file, see source.contexts).
      Expansion errors are a verification failure by a MUST that no §7.1 step carries.
    diagram: "protocol.md#f10-context-processing"
    steps:
      - n: "1"
        from: "conforming-verifier-implementation"
        to: "conforming-verifier-implementation"
        message: "JSON-LD context"
        message_ref: "MU-22"
        action: >-
          Treat https://www.w3.org/ns/credentials/v2 as already retrieved, with the printed
          SHA2-256 digest.
        locator: "Appendix B.1"
        basis: "stated"
        quotes:
          - at: "Appendix B.1"
            source_lines: "4103"
            status: "normative"
            quote: |-
              Implementations MUST treat the base context value, located at https://www.w3.org/ns/credentials/v2, as already retrieved; the following value is the hexadecimal encoded SHA2-256 digest value of the base context file:
          - at: "§4.3"
            source_lines: "414"
            status: "normative"
            quote: |-
              The data available at https://www.w3.org/ns/credentials/v2 is a permanently cacheable static document with instructions for processing it provided in Appendix B.1 Base Context.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0124"
          - "w3c-vc-data-model-2-0#R-0293"
          - "w3c-vc-data-model-2-0#R-0143"
        constrained_by_text:
          - "Appendix B.1: MUST treat the base context value"
          - "Appendix B.1: The base context an implementation treats as already retrieved"
        on_error: "unspecified by source (Appendix B.1)"
        on_error_basis: "unspecified"
      - n: "2"
        from: "conforming-verifier-implementation"
        to: "verifiable-data-registry"
        message: "JSON-LD context"
        message_ref: "MU-22"
        action: >-
          Pin every other context the same way (local copy or digest); a digest mismatch is
          expected to raise an error. (Where a context is fetched from is not said; drawn as the
          registry.)
        locator: "Appendix B.1, §4.3"
        basis: "stated"
        quotes:
          - at: "Appendix B.1"
            source_lines: "4104"
            status: "normative"
            quote: |-
              It is strongly advised that all JSON-LD Context URLs used by an application use the same mechanism, or a functionally equivalent mechanism, to ensure end-to-end security.
          - at: "Appendix B.1"
            source_lines: "4104"
            status: "normative"
            quote: |-
              Implementations are expected to throw errors if a cryptographic hash value for a resource does not match the expected hash value.
          - at: "§4.3"
            source_lines: "391"
            status: "normative"
            quote: |-
              Other specifications that build upon this specification MAY require that JSON-LD contexts be integrity protected by using the relatedResource feature described in Section 5.3 Integrity of Related Resources or any effectively equivalent mechanism.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0140"
          - "w3c-vc-data-model-2-0#R-0294"
        constrained_by_text:
          - "§4.3: MAY require that JSON-LD contexts be integrity protected"
        on_error: "expected (lowercase): an error on a hash mismatch (Appendix B.1); no type named (E-07)"
        on_error_basis: "stated"
      - n: "3"
        from: "conforming-verifier-implementation"
        to: "conforming-verifier-implementation"
        message: "JSON-LD context"
        message_ref: "MU-22"
        action: >-
          Understand every context the application uses, at least insofar as it changes what its
          terms mean.
        locator: "§4.3"
        basis: "stated"
        quotes:
          - at: "§4.3"
            source_lines: "391"
            status: "normative"
            quote: |-
              Application developers MUST understand every JSON-LD context used by their application, at least to the extent that it affects the meaning of the terms used by their application.
        constrained_by:
          - "w3c-vc-data-model-2-0#R-0009"
        constrained_by_text:
          - "§4.3: Application developers MUST understand every JSON-LD context"
        on_error: "unspecified by source (§4.3)"
        on_error_basis: "unspecified"
      - n: "4"
        from: "conforming-verifier-implementation"
        to: "conforming-verifier-implementation"
        message: "JSON-LD context"
        message_ref: "MU-22"
        action: >-
          Either process with a JSON-LD library, or do type-specific processing after checking
