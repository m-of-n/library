  note: >
    The W3C "VC v2.0 Interoperability Report"
    (https://w3c.github.io/vc-data-model-2.0-test-suite/, test run dated
    2026-09-27, retrieved 2026-10-23) names eleven implementations as column
    headers — apicatalog.com, Digital Bazaar, Gen Digital, Kataru Content VC,
    MakoLab, OpSecId, Procivis One Core, SpruceID, Trential, TrustVC, VC Issuer
    Mock — with no home pages, licences or aggregate pass counts. They are not
    sorted into open_source/commercial because the report does not say which
    is which and this pass did not open each one.
usefulness:
  verdict: useful
  reason: "The data model R-I-06 would export into. It fixes the envelope-independent rules (@context, issuer URL, validity, relatedResource digests, the §7.1 verifier interface) and delegates every byte-level question — what is hashed, signed, canonicalised — to VC Data Integrity and VC-JOSE-COSE. §5.9 says authorization is not an appropriate use without an accompanying framework, which bears directly on exporting AuthzCert."
