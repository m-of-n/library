      path: distilled/protocol.yaml
      coverage: "No wire exchange: local algorithms, deliveries between parties inferred. 13 roles, 19 flows with 109 steps (13 inferred), one Mermaid diagram per flow in protocol.md, 20 error paths, on_error 'unspecified by source' on 90 steps; 31 tensions T-01 to T-31."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "9 machines, 73 states, 87 transitions (33 inferred): the §7.1 verification algorithm as printed, the verifier's receive lifecycle, validity period, status entry, refresh, validation, media-type precision, related-resource check, presentation freshness; what other specifications own is listed per machine."
      reviewed_by: ""
    - kind: examples
