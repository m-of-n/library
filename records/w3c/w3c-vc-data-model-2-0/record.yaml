      reviewed_by: ""
    - kind: schema
      path: distilled/schema/
      coverage: "The source prints no grammar (searched). 12 formal displays verbatim; the 4 JSON-LD files the source pins by URL (credentials/v2 context, examples context, undefined-terms context, 2018 vocabulary), byte-exact and hashed in contexts.yaml — v2 and the vocabulary match the digests §B.1/§B.2 print; 2 derived JSON Schemas 2020-12 (52 anchors), 21 cross-field rules, 190 test cases (0 unexpected), 21 mutations (0 surviving). Not covered: proof members, the contents of status, schema, refresh, terms-of-use and evidence types, JSON-LD processing."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "26 structures and 95 fields; 286 citations of 194 requirement ids on 103 of 121 nodes. Not covered: what the securing specifications define (proof members, JOSE and COSE headers)."
