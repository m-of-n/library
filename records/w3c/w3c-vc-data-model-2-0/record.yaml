    is which and this pass did not open each one.
usefulness:
  verdict: useful
  reason: "The data model R-I-06 would export into. It fixes the envelope-independent rules (@context, issuer URL, validity, relatedResource digests, the §7.1 verifier interface) and delegates every byte-level question — what is hashed, signed, canonicalised — to VC Data Integrity and VC-JOSE-COSE. §5.9 says authorization is not an appropriate use without an accompanying framework, which bears directly on exporting AuthzCert."
  assessed: "2026-10-23"
