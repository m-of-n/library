usefulness:
  verdict: useful
  reason: "Prior art, not a candidate. The earliest ratified detached signed-assertion format in the library: content bound by a hash list (resinfo), signature over a canonical form of the label that the VERIFIER recomputes from received input — the exact pattern proposed R-O-05 forbids, and a dated precedent for R-M-07 and for the rating-semantics gap DEC-007 addresses."
