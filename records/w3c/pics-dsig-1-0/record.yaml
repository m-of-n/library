  # DSig declares PICS 1.1's MIC-md5 and signature-RSA-MD5 options replaced by
  # its resinfo and sigblock extensions ("PICS Options and DSig", "DSig
  # Extensions"). It modifies PICS 1.1 labels without replacing them.
