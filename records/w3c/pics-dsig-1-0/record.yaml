usefulness:
  verdict: useful
  reason: "Prior art, not a candidate. The earliest ratified detached signed-assertion format in the library: content bound by a hash list (resinfo), signature over a canonical form of the label that the VERIFIER recomputes from received input — the exact pattern proposed R-O-05 forbids, and a dated precedent for R-M-07 and for the rating-semantics gap DEC-007 addresses."
  assessed: "2026-10-23"
distillation:
  standard: FX-1
  profile: partial
  profile_reason: "FX-1 kinds NOT covered: state-machine. DSig states what a verifier is given (the received label list, service and label options, the include/exclude list) but never a verification procedure, outcome or failure handling, so any state model would be wholly the library's invention; the verifier side is carried instead as kind: inferred requirements, flagged. protocol is not_applicable (below), not uncovered. Also below the standard by construction, not by omission: the source uses no BCP 14 keywords, so the requirement set is its lowercase must/should/may statements (verb: none) rather than a keyword set; and no example hash or signature can be verified, because the source prints no key, no signed bytes and not the hashed document. Held as prior art for R-O-05, R-M-07, DEC-007 and the R-I-01 import row; not a candidate."
  artifacts:
    - {kind: normative, path: distilled/normative.md, coverage: "every stated requirement as a quotation marker in source order; source defects SD-1 to SD-19 and SD-E", reviewed_by: ""}
    - {kind: requirements, path: distilled/requirements.yaml, coverage: "318 entries (108 promoted candidates, 111 hunted, 76 split children, 23 inferred); 170 of 170 candidates with a verdict; 0 BCP 14 keywords in source and extraction", reviewed_by: ""}
    - {kind: schema, path: distilled/schema/, coverage: "resinfo, field-list and sigblock grammars verbatim; derived recogniser (46 cases) and mutation test", reviewed_by: ""}
    - {kind: messages, path: distilled/messages.yaml, coverage: "14 messages, 63 fields, canonicalisation and standalone-label rules, findings F-01 to F-12", reviewed_by: ""}
    - {kind: examples, path: distilled/examples/, coverage: "all 27 pre blocks (8 examples, 16 templates, 3 grammars); reproduce.py re-cuts every fixture from the HTML and recomputes the Step 3 canonical form", reviewed_by: ""}
    - {kind: design-notes, path: distilled/design-notes.md, coverage: "37 rows against m-of-n at d7f7f89; MD-3 / DEC-002 cuts; 12 open questions", reviewed_by: ""}
  not_applicable:
    - {kind: protocol, reason: "data format, no exchange: a DSig label is a PICS 1.1 label carrying two extensions, and transport is delegated to PICS 1.1 (Appendix 2, ordinal §10). The section 8.1 signing steps are an ordered local procedure, captured in messages.yaml (canonical form, standalone label) and requirements.yaml, not an exchange between parties."}
