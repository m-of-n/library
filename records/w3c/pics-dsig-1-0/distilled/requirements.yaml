requirements:
  - id: 'pics-dsig-1-0#R-0001'
    locator: '§4'
    text: 'A DSig 1.0 label is detached from the resource it describes: its signature is checked against the label alone, and the only thing that ties a signed label to the bytes of a resource is a resinfo hash. A signed label that carries no resinfo (every generic label among them) binds the signer''s assertion to whatever names the resource in the signed fields, such as the for option, or to the label''s context, and not to the resource''s content.'
    verb: 'none'
    kind: inferred
    actor: 'verifier; relying party (reader of a DSig label)'
    object: 'what a DSig signature binds'
    field: 'resinfo; for'
    testable: 'yes'
    candidate: 'C-0011'
    derived_from:
      - '§4 L60-62'
      - 'pics-dsig-1-0#R-0082'
      - 'pics-dsig-1-0#R-0065'
      - 'pics-dsig-1-0#R-0103'
      - 'pics-dsig-1-0#R-0084'
      - 'pics-dsig-1-0#R-0210'
    note: 'NOT VERBATIM: composed by this extraction; no BCP 14 keyword backs it. Test: change the resource''s bytes; the label''s signature still verifies, and only a resinfo hash, where present, fails. SD-16.'
