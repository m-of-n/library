  - id: 'pics-dsig-1-0#R-0106'
    locator: '§7.2'
    text: 'A receiver checking resinfo hashes the information resource it holds with each listed algorithm it implements and compares the result with the base64-decoded hash. Every hash it computes has to match: the hashes of one resinfo are all of one document, so one mismatch means the resource is not the one labelled, or the label is invalid. A listed algorithm it does not implement is skipped; every conforming receiver implements MD5-1_0 and SHA1-1_0. The document never states this check, which octets of the resource are hashed (SD-14), or what follows a mismatch or a resinfo in a generic label, where it is not valid.'
    verb: 'none'
    kind: inferred
    actor: 'receiver of the label (verifier)'
    object: 'checking resinfo against the resource'
    field: 'resinfo (HashAlgoID, resource-hash)'
    testable: 'partial'
    testable_reason: 'the comparison is testable on given octets; which octets of a fetched or embedding document are hashed is unstated (SD-14).'
    derived_from:
