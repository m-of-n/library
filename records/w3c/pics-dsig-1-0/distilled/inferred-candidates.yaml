    text: 'PICS 1.1 uses ''.'' as separators while the ISO standard calls for ''-''.'
    verdict: reject
    reason: 'comparison of separator conventions; the rule is the sep component (R-0243) and R-0247.'
  - id: 'C-0148'
    locator: '§7.4.2'
    source_lines: '493'
