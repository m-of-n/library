    locator: '§7.4.2'
    source_lines: '437'
    cue: 'does not'
    text: 'Nonetheless, since quotedURL (which does allow the use of ''/'') and quotedname (which does not) are indistinguishable at a lexical level (and both are legitimate for use as a PICS 1.1. datum), we believe that all existing PICS parsers will support the grammar presented below.'
    verdict: reject
    reason: 'belief about existing PICS parsers; the rule is the grammar (R-0218). It also says quotedname admits no ''/'', which holds for PICS 1.1 but not for this document''s own quotedName (R-0236; SD-1).'
