  - id: 'C-0162'
    locator: '§9'
    source_lines: '613'
    cue: 'only'
    text: 'There is a security hole in the above proposal. The semantics of the assertions (ratings) in a PICS 1.1 label are defined by the rating service, and the only information about the rating service contained within the label itself is the service''s URL.'
    verdict: reject
    reason: 'security analysis (the rating service''s semantics can change after a label is signed); obliges no one. The mitigation is R-0288.'
  - id: 'C-0163'
    locator: '§9'
    source_lines: '613'
    cue: 'defines'
    text: 'Since the human-readable description pointed to by that URL is what defines the rating semantics, it is possible under the current scheme for the semantics of the rating service to change after the label has been created without invalidating the label.'
    verdict: reject
    reason: 'security analysis (the rating service''s semantics can change after a label is signed); obliges no one. The mitigation is R-0288.'
  - id: 'C-0164'
    locator: '§9'
    source_lines: '614'
    cue: 'require'
