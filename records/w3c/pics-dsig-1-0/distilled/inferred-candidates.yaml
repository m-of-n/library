  - id: 'C-0145'
    locator: '§7.4.2'
    source_lines: '487-490'
    cue: 'requires'
    text: 'DSig requires precisely the syntax described here -- neither the time nor the time zone may be omitted, none of the alternate ISO formats are permitted, and the punctuation must be as specified here, Except:'
    verdict: stated
    reason: 'binding: a lowercase obligation (must-strength). Promoted as R-0246.'
  - id: 'C-0146'
    locator: '§7.4.2'
    source_lines: '491-492'
