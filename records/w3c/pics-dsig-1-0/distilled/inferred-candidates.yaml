  - id: 'C-0170'
    locator: '§11'
    source_lines: '624-630'
    cue: 'In order'
    text: 'In order to conform with this Recommendation, an implementation must support: resinfo 1.0 hash algorithms: MD5 hashing (http://www.w3.org/TR/1998/REC-DSig-label/MD5-1_0), SHA1 hashing (http://www.w3.org//TR/1998/REC-DSig-label/SHA1-1_0) sigblock 1.0 signature suites: MD5 hashing with RSA crypto (http://www.w3.org/TR/1998/REC-DSig-label/RSA-MD5-1_0), SHA1 hashing with DSA crypto (http://www.w3.org//TR/1998/REC-DSig-label/DSS-1_0) (known as DSS).'
    verdict: stated
