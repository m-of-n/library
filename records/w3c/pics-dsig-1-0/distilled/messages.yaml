        quote: "AttributionInfo ::= '(' '\"AttribInfo\"' Certificate* ')'"
      - source_lines: "294"
        quote: "Attribution Information is not required (i.e. this section of the extension may be empty), in which case trust management systems must depend on other information sources when interpreting the label. Furthermore, the information provided herein may or may not be used by the trust management system in processing the label."
    fields:
      - name: "\"AttribInfo\""
        type: "quoted string constant"
        required: true
        source_lines: "442"
        note: "Case sensitive (BNF convention, L183)."
        constrained_by: []
        constrained_by_pending: true
      - name: "Certificate"
        type: "Certificate* (MSG-07)"
        required: false
        source_lines: "442"
        note: "Zero or more."
        constrained_by: []
        constrained_by_pending: true
    layout: "( \"AttribInfo\" ( \"<family URL>\" \"<data>\" ) ... )"
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-07"
    name: "Certificate"
    locator: "§7.3.2 (Attribution Information); §7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label)"
    source_lines: "443-445, 295"
    encoding: "A parenthesised pair of quoted strings"
    description: "One certificate: its format (a family identifier URL) and the certificate itself or a URL that leads to it."
    quotes:
      - source_lines: "443"
        quote: "Certificate ::= '(' CertificateFamilyID CertificateData ')'"
      - source_lines: "445"
