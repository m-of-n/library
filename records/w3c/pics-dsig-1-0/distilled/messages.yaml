source_tensions:
  - id: "F-01"
    title: "base64 contains '/', which a PICS 1.1 datum cannot hold; the source concedes it for sigblock and is silent for resinfo"
    locator: "§7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label); §7.2.1 (Detailed Syntax of the resinfo Extension in a PICS 1.1 Label)"
    quotes:
      - source_lines: "437"
        quote: "Note: This extension is not a valid PICS 1.1 extension because Base64 encoding uses a '/' which cannot be represented as a PICS 1.1 datum. Nonetheless, since quotedURL (which does allow the use of '/') and quotedname (which does not) are indistinguishable at a lexical level (and both are legitimate for use as a PICS 1.1. datum), we believe that all existing PICS parsers will support the grammar presented below."
      - source_lines: "175"
        quote: "A DSig 1.0 Signature Label is a standard PICS 1.1 label. The DSig extensions resinfo and sigblock are both optional and can be used as needed. A PICS 1.1 label is only considered a DSig 1.0 Signature Label when it contains a sigblock extension."
    effect: "pics-1-1-labels `data` has no base64 datum and its quotedname has no '/'. The check-grammar.derived.py cases P-02 and P-06 show a base64 value with '/' rejected under the PICS 1.1 profile, for sigblock and for a resinfo hash. By our arithmetic, not the source's, about 35 percent of 20-byte digests (27 base64 data characters, each '/' with probability 1/64) contain at least one '/'. The note is under sigblock only. The source also states that all existing PICS parsers will support the grammar (same line): untested here."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-02"
    title: "DSig's own quotedName admits '/', while its note says quotedname does not"
    locator: "§7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label)"
    quotes:
      - source_lines: "437"
        quote: "quotedname (which does not) are indistinguishable at a lexical level (and both are legitimate for use as a PICS 1.1. datum), we believe that all existing PICS parsers will support the grammar presented below."
      - source_lines: "461"
        quote: "| '#' | '_' | '(' | ')' | '/' | '%' hex hex"
    effect: "urlChar, hence quotedName, contains '/' in 7.4.2 (L461). PICS 1.1 quotedname has no '/' (pics-1-1-labels, urlchar, which has transmit-name-char plus parentheses). So DSig's quotedName is wider than PICS 1.1's, and the note's premise (a base64 string with '/' is not a quotedname) is false of DSig's own grammar. Cases N-01 and N-02."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-03"
    title: "the ByKey DSA example is not a SigData"
    locator: "§7.3.4.2 (\"ByKey\"); §7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label)"
    quotes:
      - source_lines: "447"
        quote: "SigData ::= '(' SigTokenString SigInfo ')'"
      - source_lines: "350"
        quote: "( \"Q\" \"base64-encoded-divisor\" )"
    effect: "SigData takes exactly one SigInfo. The example gives \"ByKey\" four pairs side by side (P, Q, G, Y) with no enclosing list, as the 7.4.1 example does for byKey with N and E (((\"N\" ..) (\"E\" ..)), an extra list). Derived grammar: fixture ex03 REJECTED, case R-23."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-04"
    title: "the field-list grammar and the SigData grammar do not describe the same text"
    locator: "§7.3.4.7 (The \"include\" and \"exclude\" tokens: modifying the canonicalized form of the label); §7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label)"
    quotes:
      - source_lines: "394"
        quote: "option-list ::= '(' \"options\" <options>* ')'"
      - source_lines: "449"
        quote: "SigInfo ::= SigData | quotedURL | quoted-ISO-date | quotedBase64String"
    effect: "\"options\" <options>* allows zero or many entries; as a SigData a pair holds exactly one SigInfo. So (\"options\" \"by\" \"for\"), (\"extensions\") and an empty field-list are field-lists and not SigInfo. check-grammar.derived.py checks field-list on its own (case A-08) and as SigData (case R-22 rejects an empty exclude). Which grammar wins is not said."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-05"
    title: "token spelling: \"ByKey\" versus \"byKey\", \"On\" versus \"on\""
    locator: "§7.3.4.2 (\"ByKey\"); §7.3.4.6 (The \"On\" token: Time of Signature generation); §7.4.1 (An example sigblock extension:)"
    quotes:
      - source_lines: "183"
        quote: "Quoted strings are case sensitive but other literal elements are case insensitive. Multiple contiguous space characters are be treated as though they were a single space character except in quoted strings."
      - source_lines: "424"
        quote: "(\"byKey\" ((\"N\" \"aba21241241=\")"
    effect: "Quoted strings are case sensitive (L183). The reserved token is \"ByKey\" (L340); both examples that use it write \"byKey\". The heading says \"On\", the template and examples write \"on\". Read by the BNF rule, the examples carry an unreserved token. reproduce.py (b) lists both."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-06"
    title: "the structural sigblock display has one more closing parenthesis than opening"
    locator: "§7.3.1 (Format Specification)"
    quotes:
      - source_lines: "290"
        quote: "<attribution info> <signature>* ) )"
    effect: "Typographical. The BNF (L439-440) and the examples balance; examples/templates/t07 is kept as printed."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-07"
    title: "typographical slips in the BNF"
    locator: "§7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label); §7.2.1 (Detailed Syntax of the resinfo Extension in a PICS 1.1 Label)"
    quotes:
      - source_lines: "466"
        quote: "sign ::= '+' / '-'"
      - source_lines: "227"
        quote: "Stz '\"'"
    effect: "`Stz` where S and tz are separate symbols; `'+' / '-'` for alternation elsewhere written with `|`; `quotedUrl` and `quotedURL`, `quotedName` and `quotedname`, `SignatureSuite` and `SignatureSuiteID`, `rating-list` (L537) and `ratings-list` (L395) for what is evidently one thing each. The derived grammar reads each as the evident one and says so (ambiguities A3, A5)."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-08"
    title: "the printed canonical form (Step 3) departs from the recipe in one stated place and relies on an unstated rule in another"
    locator: "§8.1.2 (Canonicalization of the equivalent standalone label for signing); §8.2 (An Example)"
    quotes:
      - source_lines: "535"
        quote: "The header part is the 'pics-1.1' symbol followed by the serviceURL."
      - source_lines: "569"
        quote: "( PICS-1.1 \"http://www.gcf.org/v2.5\" l by \"John Doe\""
    effect: "Recomputed by examples/reproduce.py from Step 2 and from Step 4: identical to the printed text if the header is NOT lower-cased and the outer parentheses are spaced like other tokens; different if the symbol is lower-cased as C-03 and C-08 say. C-05 reads two ways (no space beside the outer parentheses, or no leading and trailing whitespace on the line); under the second, the printed spacing is right and only the case of the header symbol differs. Also, the two resinfo hashes are printed MD5 then SHA1 where Step 2 has SHA1 then MD5: the recipe states no order for the entries of an extension (C-11 sorts extensions, not what is inside one). The printed text equals a reading that sorts them by identifier URL."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-09"
    title: "Appendix 3 spells two identifiers with a double slash"
    locator: "§11 (Appendix 3: Conforming Implementations)"
    quotes:
      - source_lines: "627"
        quote: "SHA1 hashing (http://www.w3.org//TR/1998/REC-DSig-label/SHA1-1_0)"
    effect: "SHA1-1_0 and DSS-1_0 appear with http://www.w3.org//TR/... Identifiers are URLs used as unique names (L191); every example writes the single-slash form. examples/reproduce.py (e)."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-10"
    title: "the hash values in the examples are not digests of their algorithms, and some are not base64"
    locator: "§8.2 (An Example); §7.2.1 (Detailed Syntax of the resinfo Extension in a PICS 1.1 Label)"
    quotes:
      - source_lines: "560"
        quote: "(\"http://www.w3.org/TR/1998/REC-DSig-label/SHA1-1_0\" \"aba21241241=\")"
    effect: "\"aba21241241=\" is valid base64 and decodes to 8 bytes; a SHA1 digest is 20 bytes. \"cdc43463463=\" gives 8 bytes for MD5 (16). Eight such entries over four fixtures. Of 18 key, signature and certificate values, 10 are not RFC 1521 base64 (length not a multiple of four, or hyphens and spaces). No signature or hash in the source can be verified: no key, no signed bytes, no document. reproduce.py (d)."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-11"
    title: "\"symbols are converted to lowercase\" meets PICS 1.1 case-sensitive transmit-names"
    locator: "§8.1.2 (Canonicalization of the equivalent standalone label for signing)"
    quotes:
      - source_lines: "534"
        quote: "Symbols are case insensitive and converted to lowercases. Tokens in multi-value syntax are considered symbols. Do not insert spaces for either the leading left parenthesis or the the trailing right parenthesis of a PICS 1.1 label list. No carriage-returns or linefeeds are present in a cannonicalized label."
    effect: "pics-1-1-labels says transmit-names are case sensitive (L141 of its rendering). If a transmit-name is a symbol, C-03 folds categories that PICS 1.1 keeps apart; if it is not, the recipe says nothing about them. All the source's transmit-names are already lower case, so no example decides it. Left open."
    constrained_by: []
    constrained_by_pending: true
  - id: "F-12"
    title: "AttribInfo is required as an element, optional as content"
    locator: "§7.3.2 (Attribution Information); §7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label)"
    quotes:
      - source_lines: "294"
        quote: "Attribution Information is not required (i.e. this section of the extension may be empty), in which case trust management systems must depend on other information sources when interpreting the label. Furthermore, the information provided herein may or may not be used by the trust management system in processing the label."
      - source_lines: "440"
        quote: "SigBlockURL AttributionInfo Signature* ')'"
    effect: "Read as: the list (\"AttribInfo\") is always present and may hold no certificate. A sigblock with no AttribInfo list is rejected by the derived grammar (case R-09). The structural display at L289-290 shows `<attribution info>` without saying so."
    constrained_by: []
    constrained_by_pending: true
