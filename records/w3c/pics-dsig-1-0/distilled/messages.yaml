        type: "quotedURL"
        required: true
        source_lines: "444, 295"
        note: "Names the certificate format; dereferences to a description. The source gives http://www.w3.org/PICS/DSig/X509-1_0 and .../pgpcert-1_0 as examples (L307-312)."
        constrained_by: []
        constrained_by_pending: true
      - name: "CertificateData"
        type: "quotedBase64String | quotedURL"
        required: true
        source_lines: "445"
        encoding: "base64, RFC 1521, or URL"
        note: "The certificate bytes in base64, or a URL pointing to them."
        constrained_by: []
        constrained_by_pending: true
    layout: "( \"<CertificateFamilyID>\" \"<CertificateData>\" )"
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-08"
    name: "Signature"
    locator: "§7.3.3 (Signatures); §7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label)"
    source_lines: "446, 451, 316-324"
    encoding: "A parenthesised list whose first member is the quoted string \"Signature\""
    description: "One signature. Its suite identifier says how to read the SigData that follows. The suite, not DSig 1.0, defines the content (L324)."
    quotes:
      - source_lines: "446"
        quote: "Signature ::= '( \"Signature\"' SignatureSuiteID SigData+ ')'"
      - source_lines: "324"
        quote: "Signature suites have complete control over the contents of the SigData immediately following the signature suite URL. The format of this data must satisfy the SigData portion of the BNF; beyond that requirement, the format of the data is governed by the definition given in the signature suite. DSig 1.0 does define two hash algorithms and two signature suites for interoperability; see Appendix 3. Implementations must implement these four algorithms in addition to any others they may wish to define."
    fields:
      - name: "\"Signature\""
        type: "quoted string constant"
        required: true
        source_lines: "446"
        note: "Case sensitive."
        constrained_by: []
        constrained_by_pending: true
      - name: "SignatureSuiteID"
        type: "quotedURL"
        required: true
        source_lines: "451, 320"
        note: "Identifies the signature suite. Appendix 3 requires RSA-MD5-1_0 and DSS-1_0 (MSG-14). 7.3.3 writes the name `SignatureSuite`; the BNF `SignatureSuiteID`."
        constrained_by: []
        constrained_by_pending: true
      - name: "SigData"
        type: "SigData+ (MSG-09)"
        required: true
        source_lines: "446"
        note: "One or more."
        constrained_by: []
        constrained_by_pending: true
    layout: "( \"Signature\" \"<suite URL>\" ( \"<token>\" <value> ) ... )"
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-09"
    name: "SigData and SigInfo"
    locator: "§7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label)"
    source_lines: "447-450, 452-468"
    encoding: "SigData is a parenthesised pair: a quoted name and exactly one SigInfo"
    description: "The generic container for everything inside a signature. SigInfo is recursive, so a value can be a string, a number or a nested list."
    quotes:
      - source_lines: "447"
        quote: "SigData ::= '(' SigTokenString SigInfo ')'"
      - source_lines: "449"
        quote: "SigInfo ::= SigData | quotedURL | quoted-ISO-date | quotedBase64String"
    fields:
      - name: "SigTokenString"
        type: "quotedName"
        required: true
        source_lines: "448"
        note: "The token. Common tokens are in MSG-10. A signature suite may define others (L328)."
        constrained_by: []
        constrained_by_pending: true
      - name: "SigInfo"
        type: "SigData | quotedURL | quoted-ISO-date | quotedBase64String | quotedName | number | ( SigInfo+ )"
        required: true
        source_lines: "449-450"
        note: "Exactly one per SigData. A quoted string can be several of these at once; the grammar does not say which wins (ambiguity A4)."
        constrained_by: []
        constrained_by_pending: true
      - name: "quotedName"
        type: "'\"' ( urlChar | ' ' )+ '\"'"
        required: false
        source_lines: "458-463"
        note: "urlChar includes '/' here (finding F-02)."
        constrained_by: []
        constrained_by_pending: true
      - name: "number"
        type: "[sign] digit+ [ . [digit+] ]"
        required: false
        source_lines: "467-468"
        note: "Unquoted."
        constrained_by: []
        constrained_by_pending: true
    layout: "( \"<token>\" <SigInfo> )"
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-10"
    name: "common SigData tokens"
    locator: "§7.3.4 (Common SigData fields) and its subsections 7.3.4.1 to 7.3.4.8"
    source_lines: "326-403"
    encoding: "Each is a SigData (MSG-09) with the token below. These strings are reserved: a suite that uses the tokens must do so as this section says (L328)."
    description: "The tokens most signature suites will use. A suite is free to define its own format; these fix only the meaning of the token."
    quotes:
      - source_lines: "328"
        quote: "These string tokens are reserved words in the sense that any signature suite that uses SigData field identified by these tokens must do so in a manner consistent with this specification."
    fields:
      - name: "ByKey"
        type: "( \"ByKey\" <Key-Value, suite dependent> )"
        required: false
        source_lines: "344-352"
        note: "The key that validates the signature. The DSA example shows four sibling pairs P, Q, G, Y that do not fit SigData (finding F-03)."
        constrained_by: []
        constrained_by_pending: true
      - name: "ByHash"
        type: "( \"ByHash\" \"<base64 hash of key>\" )"
        required: false
        source_lines: "358-360"
        encoding: "base64, RFC 1521"
        note: "How the hash is made is a property of the suite."
        constrained_by: []
        constrained_by_pending: true
      - name: "ByName"
        type: "( \"ByName\" \"<name>\" )"
        required: false
        source_lines: "366, 364"
        note: "An X.509 distinguished name or a PGP UserID, for example."
        constrained_by: []
        constrained_by_pending: true
      - name: "ByCert"
        type: "( \"ByCert\" ( \"<CA name>\" <CA serial no.> ) )"
        required: false
        source_lines: "372, 370"
        note: "The certifying authority and the serial number of a certificate it issued."
        constrained_by: []
        constrained_by_pending: true
      - name: "on"
        type: "( \"on\" quoted-ISO-date )"
        required: false
        source_lines: "379, 376-381"
        encoding: "quoted-ISO-date (MSG-04)"
        note: "Time of signature generation. Advisory only: not protected by the signature (L381). Distinct from the PICS 1.1 label option on. The heading writes \"On\", the template and the examples write \"on\" (finding F-05)."
        constrained_by: []
        constrained_by_pending: true
      - name: "exclude"
        type: "( \"exclude\" field-list )"
        required: false
        source_lines: "387, 390"
        note: "Everything but the listed fields is signed. At most one include or exclude; both together is an error (L390)."
        constrained_by: []
        constrained_by_pending: true
      - name: "include"
        type: "( \"include\" field-list )"
        required: false
        source_lines: "388, 390"
        note: "Only the listed fields are signed."
        constrained_by: []
        constrained_by_pending: true
      - name: "SigCrypto"
        type: "( \"SigCrypto\" <suite dependent> )"
        required: false
        source_lines: "403"
        note: "The signature itself; its format is entirely the suite's."
        constrained_by: []
        constrained_by_pending: true
    layout: "see the template blocks examples/templates/t11, t13-t17"
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-11"
    name: "field-list (the value of include and exclude)"
    locator: "§7.3.4.7 (The \"include\" and \"exclude\" tokens: modifying the canonicalized form of the label)"
    source_lines: "391-398"
    encoding: "A parenthesised list of up to three parenthesised lists"
    description: "Names label fields to keep or drop from the canonical form. There are three kinds of field: options, ratings transmit-names, extensions."
    quotes:
      - source_lines: "393"
        quote: "field-list ::= '(' option-list? ratings-list? extension-list? ')'"
      - source_lines: "398"
        quote: "A field-list is simply at most, one each of: option-list, ratings-list and extension-list, with their associated data. An option-list is a list of PICS 1.1 label option names (e.g. \"for\" or \"by\"). A ratings-list is a list of PICS 1.1 ratings service transmit-names (e.g. \"suds\" in the example \"Good Clean Fun\" rating service). An extension-list is a list of quoted-URLs where each quoted-URL uniquely identifies a particular PICS 1.1 label extension."
    fields:
      - name: "option-list"
        type: "( \"options\" <options>* )"
        required: false
        source_lines: "394, 398"
        note: "PICS 1.1 option names, e.g. \"for\" or \"by\". `<options>` is an unspecified placeholder (not a nonterminal anywhere)."
        constrained_by: []
        constrained_by_pending: true
      - name: "ratings-list"
        type: "( \"ratings\" <ratings>* )"
        required: false
        source_lines: "395, 398"
        note: "Transmit-names, e.g. \"suds\"."
        constrained_by: []
        constrained_by_pending: true
      - name: "extension-list"
        type: "( \"extensions\" <quoted-URL>* )"
        required: false
        source_lines: "396, 398"
        note: "Extension URLs. `quoted-URL` is not the BNF's quotedURL spelling."
        constrained_by: []
        constrained_by_pending: true
    layout: "( ( \"options\" \"by\" \"for\" ) ( \"ratings\" \"suds\" ) ( \"extensions\" \"http://foo/badextension\" ) ) is what the field-list grammar allows; a SigData holds only one SigInfo per pair, so the same text is not a SigInfo (finding F-04)."
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-12"
    name: "equivalent standalone label"
    locator: "§8.1.1 (Creating an equivalent standalone label)"
    source_lines: "519, 523-530"
    encoding: "PICS 1.1 label syntax: US-ASCII text of parenthesised lists; whitespace separates tokens; quoted strings are case sensitive, other tokens are not (pics-1-1-labels, General Format of PICS Labels)"
    description: "The intermediate label that is canonicalised and signed: one service, one label, all options merged, the sigblock gone, include/exclude applied. Built by the signer; a verifier rebuilds it from what it receives."
    quotes: []
    fields:
      - name: "service options + label options"
        type: "option*, merged"
        required: true
        source_lines: "523, 538"
        note: "The client uses every option available from both levels; the server must therefore transmit all options needed to rebuild the same label (L538)."
        constrained_by: []
        constrained_by_pending: true
      - name: "sigblock"
        type: "removed"
        required: true
        source_lines: "523"
        note: "Never part of the signed text."
        constrained_by: []
        constrained_by_pending: true
      - name: "include / exclude effect"
        type: "fields removed from the merged label"
        required: false
        source_lines: "390, 530"
        note: "Applied after the default canonicalisation of the label: include keeps only the listed fields, exclude drops the listed ones (L390)."
        constrained_by: []
        constrained_by_pending: true
    layout: "( PICS-1.1 <service URL> labels [service options] OVERRIDDEN BY [label options] ratings ( ... ) )"
    derivation_rules:
      - id: "E-01"
        rule: "one label list, one label"
        source_lines: "523"
        quote: "An equivalent standalone label is a PICS 1.1 label list containing a single label. The single label must be normalized to a form where all options are label options (this includes extension options) and the sigblock extension (if present) has been removed. From the example label list above, label 4 could be reduced to the single label:"
      - id: "E-02"
        rule: "every option is a label option, extensions included"
        source_lines: "523"
        quote: "The single label must be normalized to a form where all options are label options (this includes extension options) and the sigblock extension (if present) has been removed. From the example label list above, label 4 could be reduced to the single label:"
      - id: "E-03"
        rule: "sigblock removed"
        source_lines: "523"
        quote: "the sigblock extension (if present) has been removed. From the example label list above, label 4 could be reduced to the single label:"
      - id: "E-04"
        rule: "include/exclude then drop fields"
        source_lines: "530"
        quote: "We still need to take into account any modifications denoted by \"include\" or \"exclude\" specifiers in the sigblock extension. (If the signature is being created the application knows which fields it wants to include in or exclude from the equivalent standalone label. The \"include\" and \"exclude\" options convey this information to applications trying to verify the signature.) The resulting label list is the equivalent standalone label."
      - id: "E-05"
        rule: "at most one resinfo; the label option beats the service option"
        source_lines: "212"
        quote: "Thus, an equivalent standalone label will have at most one resinfo extension and that extension will be the extension given as the label option for that label unless none is present, in which case the extension given as a service option will be used. If neither is present, the equivalent standalone label will have no resinfo extension."
      - id: "E-06"
        rule: "label option overrides a service option"
        source_lines: "117"
        quote: "service options may be overridden by individual label options. When a new service is identified in the label list, the options from the previous service no longer apply. Thus, in the above example label 4 could be equivalently represented as:"
      - id: "E-07"
        rule: "MIC-md5 / md5 removed for signing"
        source_lines: "145"
        quote: "it should be removed from the label for the purposes of signing. This option has been superceded by the DSig 1.0 resinfo extension."
      - id: "E-08"
        rule: "signature-RSA-MD5 removed for signing"
        source_lines: "157"
        quote: "it should be ignored and removed from the label for the purposes of signing. This option has been replaced with the DSig 1.0 sigblock extension."
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-13"
    name: "canonical label (the text that is signed)"
    locator: "§8.1.2 (Canonicalization of the equivalent standalone label for signing)"
    source_lines: "534-538, 569-575"
    encoding: "One line of US-ASCII text: tokens separated by single spaces"
    description: "The input to the signature suite's algorithm (L407). Its recipe is stated in prose only; examples/reproduce.py implements it as written and compares it with the printed Step 3 of section 8.2 (An Example)."
    quotes: []
    fields:
      - name: "header"
        type: "( pics-1.1 <serviceURL>"
        required: true
        source_lines: "535"
        note: "Symbol lower-cased by the recipe; the printed Step 3 keeps PICS-1.1 (finding F-08)."
        constrained_by: []
        constrained_by_pending: true
      - name: "l"
        type: "symbol"
        required: true
        source_lines: "536"
        note: "Always the short keyword, never labels."
        constrained_by: []
        constrained_by_pending: true
      - name: "options"
        type: "<name> <value> pairs, sorted, extensions included"
        required: true
        source_lines: "536"
        note: "Short names: full for complete-label, exp for until (L536). The recipe names only these two substitutions."
        constrained_by: []
        constrained_by_pending: true
      - name: "r"
        type: "symbol"
        required: true
        source_lines: "537"
        note: "Always the short keyword, never ratings."
        constrained_by: []
        constrained_by_pending: true
      - name: "ratings"
        type: "( <transmit-name> <value> ... ) sorted by transmit-name"
        required: true
        source_lines: "537"
        note: "Closing parenthesis then the closing parenthesis of the label list."
        constrained_by: []
        constrained_by_pending: true
    layout: "( pics-1.1 \"<serviceURL>\" l <options sorted> r ( <name value pairs sorted> ) )"
    canonicalization_rules:
      - id: "C-01"
        rule: "one space between any two tokens"
        source_lines: "534"
        quote: "insert a single space character between any two tokens. PICS 1.1 tokens include left and right parenthesis, symbols, quoted-strings, and numbers. Symbols are case insensitive and converted to lowercases. Tokens in multi-value syntax are considered symbols. Do not insert spaces for either the leading left parenthesis or the the trailing right parenthesis of a PICS 1.1 label list. No carriage-returns or linefeeds are present in a cannonicalized label."
      - id: "C-02"
        rule: "what a token is"
        source_lines: "534"
        quote: "PICS 1.1 tokens include left and right parenthesis, symbols, quoted-strings, and numbers. Symbols are case insensitive and converted to lowercases. Tokens in multi-value syntax are considered symbols. Do not insert spaces for either the leading left parenthesis or the the trailing right parenthesis of a PICS 1.1 label list. No carriage-returns or linefeeds are present in a cannonicalized label."
      - id: "C-03"
        rule: "symbols are lower-cased"
        source_lines: "534"
        quote: "Symbols are case insensitive and converted to lowercases. Tokens in multi-value syntax are considered symbols. Do not insert spaces for either the leading left parenthesis or the the trailing right parenthesis of a PICS 1.1 label list. No carriage-returns or linefeeds are present in a cannonicalized label."
      - id: "C-04"
        rule: "multi-value tokens are symbols"
        source_lines: "534"
        quote: "Tokens in multi-value syntax are considered symbols. Do not insert spaces for either the leading left parenthesis or the the trailing right parenthesis of a PICS 1.1 label list. No carriage-returns or linefeeds are present in a cannonicalized label."
      - id: "C-05"
        rule: "no space for the outer parentheses"
        source_lines: "534"
        quote: "Do not insert spaces for either the leading left parenthesis or the the trailing right parenthesis of a PICS 1.1 label list. No carriage-returns or linefeeds are present in a cannonicalized label."
      - id: "C-06"
        rule: "no CR or LF"
        source_lines: "534"
        quote: "No carriage-returns or linefeeds are present in a cannonicalized label."
      - id: "C-07"
        rule: "three parts in order: header, options, ratings"
        source_lines: "535"
        quote: "A normalized DSig-1.0 label consists of three parts in order: the PICS 1.1 header, the options, and the ratings. The header part is the 'pics-1.1' symbol followed by the serviceURL."
      - id: "C-08"
        rule: "header = pics-1.1 symbol, serviceURL"
        source_lines: "535"
        quote: "The header part is the 'pics-1.1' symbol followed by the serviceURL."
      - id: "C-09"
        rule: "option part headed by l; set fixed by include/exclude"
        source_lines: "536"
        quote: "The option part is headed by the label keyword \"l\", followed by a set of PICS-1.1 options, including the extensions. The set of options, including the extensions, are determined by the option-list and the extension-list fields of the \"exclude\" or the \"include\" option in the signature suite. The options are sorted alphabetically (i.e. lexicographically ordered by the unquoted US ASCII characters) by their shortest names (i.e. use full instead of complete-label, exp instead of until). Extension options are sorted first by \"extension\" and then by the \"extension\" URL."
      - id: "C-10"
        rule: "options sorted by shortest name, ASCII order"
        source_lines: "536"
        quote: "The options are sorted alphabetically (i.e. lexicographically ordered by the unquoted US ASCII characters) by their shortest names (i.e. use full instead of complete-label, exp instead of until). Extension options are sorted first by \"extension\" and then by the \"extension\" URL."
      - id: "C-11"
        rule: "extensions sorted by \"extension\" then URL"
        source_lines: "536"
        quote: "Extension options are sorted first by \"extension\" and then by the \"extension\" URL."
      - id: "C-12"
        rule: "rating part headed by r; set fixed by include/exclude"
        source_lines: "537"
        quote: "The rating part is headed by the rating keyword \"r\", followed by a set of transmit name and value pairs. The set of transmit-name and value pairs are determined by the \"rating-list\" field of the \"include\" or \"exclude\" option in the signature. Transmit names are sorted alphabetically."
      - id: "C-13"
        rule: "transmit names sorted alphabetically"
        source_lines: "537"
        quote: "Transmit names are sorted alphabetically."
      - id: "C-14"
        rule: "the server must ship every option the signer used"
        source_lines: "538"
        quote: "The transmitted set must include all options necessary as either service or label options to create the same equivalent standalone label as was signed."
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-14"
    name: "conforming identifiers (Appendix 3)"
    locator: "§11 (Appendix 3: Conforming Implementations)"
