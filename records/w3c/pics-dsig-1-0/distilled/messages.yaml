record: "pics-dsig-1-0"
reviewed_by: ""
source_digest: "d9eafc9db7bd9a8b016c0d72ffd6d0c2c21f58ffafaec84e3e2a3cacdd7c2e94"
source: ".cache/pics-dsig-1-0.bin (W3C Recommendation 27 May 1998, REC-DSig-label-19980527, HTML; content.sha256 in record.yaml). Quotations and line numbers are from its rendering .cache/pics-dsig-1-0.txt (sha256 d9eafc9d..., bin/render-w3c --ordinal). Section numbers in locators are the renderer's structural ordinals, not the source's: the source has none."
extracted: "2026-11-12"
extracted_by: "FX-1 pass 1 (extract), schema+messages+examples agent, mechanical lane, from the source only (the PICS 1.1 grammar of pics-1-1-labels was read for findings F-01, F-02, F-11)"
applicability: "DSig 1.0 defines no wire format of its own. It defines two extensions of the PICS 1.1 label (resinfo and sigblock), the common fields of a signature, and a recipe that turns a label into the text a signature suite signs. Out of scope because the source does not define them: the hash algorithms and signature suites themselves (named in MSG-14, content delegated to \"signature suite documents\" never published here), the certificate formats (X509-1_0, pgpcert-1_0 are named, not defined), the document normalisation for non-HTML carriers (Appendix 2 says one must be created), and any verification procedure (the source states how to sign, never how to verify)."
note: "Conventions. (1) A quotation is {source_lines, quote}: cut from the rendering by script, then verified by bin/check-quotes; none typed. (2) Everything else is this file's own wording. (3) required follows the BNF: true when the production has no ? or *. (4) constrained_by is empty and constrained_by_pending is true on every message and field: the requirements agent fills requirements.yaml concurrently and its ids did not exist when this file was written; the lead joins them. (5) source_lines are lines of the rendering. (6) Findings F-01 to F-12 are source tensions or defects, not repairs; each names the derived-grammar case or reproduce.py part that shows it."
messages:
  - id: "MSG-01"
    name: "dsig-signature-label"
    locator: "§7 (DSig Extensions); §8 (Signing)"
    source_lines: "175, 499-515"
    encoding: "PICS 1.1 label syntax: US-ASCII text of parenthesised lists; whitespace separates tokens; quoted strings are case sensitive, other tokens are not (pics-1-1-labels, General Format of PICS Labels)"
    description: "A DSig 1.0 Signature Label is an ordinary PICS 1.1 label list. It becomes a DSig label only by containing a sigblock extension. The same list may carry a resinfo extension. The structure is the PICS 1.1 label list of section 8 (Signing), reproduced in examples/templates/t21."
    quotes:
      - source_lines: "175"
        quote: "A DSig 1.0 Signature Label is a standard PICS 1.1 label. The DSig extensions resinfo and sigblock are both optional and can be used as needed. A PICS 1.1 label is only considered a DSig 1.0 Signature Label when it contains a sigblock extension."
      - source_lines: "175"
        quote: "A PICS 1.1 label is only considered a DSig 1.0 Signature Label when it contains a sigblock extension."
    fields:
      - name: "version"
        type: "symbol PICS-1.1"
        required: true
        source_lines: "501"
        note: "PICS 1.1 label list header; DSig 1.0 adds nothing to it (a PICS 1.2 note at L30 says every reference to PICS 1.1 means PICS 1.1 and PICS 1.2)."
        constrained_by: []
        constrained_by_pending: true
      - name: "serviceID"
        type: "quotedURL"
        required: true
        source_lines: "502, 508"
        note: "The rating service URL; one per service section. Canonical form copies it (MSG-13)."
        constrained_by: []
        constrained_by_pending: true
      - name: "service-option"
        type: "option*"
        required: false
        source_lines: "502, 508"
        note: "PICS 1.1 service options inherited by every label of the service section. A resinfo extension may be a service option; a sigblock extension may not (L205, L285)."
        constrained_by: []
        constrained_by_pending: true
      - name: "labelword"
        type: "symbol labels | l"
        required: true
        source_lines: "503"
        note: "Introduces the labels of a service section."
        constrained_by: []
        constrained_by_pending: true
      - name: "label-option"
        type: "option*"
        required: false
        source_lines: "503"
        note: "PICS 1.1 label options. Holds the resinfo extension (MSG-02) and the sigblock extension (MSG-05). Overrides a service option of the same name (L117)."
        constrained_by: []
        constrained_by_pending: true
      - name: "ratingword and ratings"
        type: "symbol ratings | r, then ( transmit-name value ... )"
        required: true
        source_lines: "504"
        note: "The assertions. Part of the text that is signed (MSG-13, rating part)."
        constrained_by: []
        constrained_by_pending: true
    layout: "( PICS-1.1 <serviceID> [service options] labels [label options] ratings ( <category> <value> ... ) ... ) with several labels and several service sections allowed."
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-02"
    name: "resinfo-extension"
    locator: "§7.2.1 (Detailed Syntax of the resinfo Extension in a PICS 1.1 Label)"
    source_lines: "220-226, 259-265"
    encoding: "Text of a PICS 1.1 label extension. Quoted strings are case sensitive; contiguous spaces outside quoted strings count as one (L183)"
    description: "A PICS 1.1 label extension that binds a label to the bytes of the labelled resource by one or more hashes, each under a named algorithm. Replaces the PICS 1.1 MIC-md5 option (L173)."
    quotes:
      - source_lines: "220"
        quote: "resinfo-extension ::= 'extension ( optional '"
      - source_lines: "221"
        quote: "'\"http://www.w3.org/TR/1998/REC-DSig-label/resinfo-1_0\"' resinfo-data+ ')'"
    fields:
      - name: "extension"
        type: "symbol"
        required: true
        source_lines: "220"
        note: "Option name of the PICS 1.1 extension option."
        constrained_by: []
        constrained_by_pending: true
      - name: "optional"
        type: "symbol, the constant optional"
        required: true
        source_lines: "220, 214"
        note: "The extension is optional, never mandatory: software that does not understand it still processes the label."
        constrained_by: []
        constrained_by_pending: true
      - name: "extension URL"
        type: "quotedURL, the constant http://www.w3.org/TR/1998/REC-DSig-label/resinfo-1_0"
        required: true
        source_lines: "221"
        note: "Names the extension."
        constrained_by: []
        constrained_by_pending: true
      - name: "resinfo-data"
        type: "resinfo-data+ (MSG-03)"
        required: true
        source_lines: "221"
        note: "One or more hashes; each must use a different algorithm (L213)."
        constrained_by: []
        constrained_by_pending: true
    layout: "extension ( optional \"<resinfo-1_0 URL>\" ( \"<hash algorithm URL>\" \"<base64>\" [\"<date>\"] ) ... )"
    placement:
      - "service option or label option or both; the label option wins (L212)"
      - "not valid in a generic label (L215, L127, L153)"
      - "not extensible: other information needs a separate extension (L216)"
      - "an equivalent standalone label has at most one (L519, L212)"
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-03"
    name: "resinfo-data (one hash entry)"
    locator: "§7.2.1 (Detailed Syntax of the resinfo Extension in a PICS 1.1 Label)"
    source_lines: "222-226, 206-210"
    encoding: "A parenthesised triple or pair of quoted strings"
    description: "One cryptographic hash of the information resource."
    quotes:
      - source_lines: "222"
        quote: "resinfo-data ::= '(' HashAlgoID resource-hash hash-date? ')'"
      - source_lines: "210"
        quote: "The hash algorithm identifier is a quoted URL identifier as defined above. It identifies the specific hashing algorithm by which the following hash was computed. The actual hash is given as a quoted base64 encoded string."
    fields:
      - name: "HashAlgoID"
        type: "quotedURL"
        required: true
        source_lines: "223, 210"
        note: "Identifies the hash algorithm. Appendix 3 requires MD5-1_0 and SHA1-1_0 (MSG-14). The source states no digest length."
        constrained_by: []
        constrained_by_pending: true
      - name: "resource-hash"
        type: "quoted base64 string (RFC 1521)"
        required: true
        source_lines: "225, 210"
        encoding: "base64, RFC 1521"
        note: "The hash itself. See finding F-01: base64 contains '/'."
        constrained_by: []
        constrained_by_pending: true
      - name: "hash-date"
        type: "quoted-ISO-date (MSG-04)"
        required: false
        source_lines: "226, 206"
        encoding: "quoted-ISO-date"
        note: "The date the hash was computed."
        constrained_by: []
        constrained_by_pending: true
    layout: "( \"<HashAlgoID>\" \"<resource-hash>\" [\"<hash-date>\"] )"
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-04"
    name: "quoted-ISO-date (DSig form)"
    locator: "§7.2.1 (Detailed Syntax of the resinfo Extension in a PICS 1.1 Label); §7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label)"
    source_lines: "227-253, 469-495"
    encoding: "A quoted string: \"YYYY sep MM sep DD T hh : mm [ : ss [ . f+ ] ] S tz\""
    description: "The date form of the DSig extensions (hash-date, the \"on\" SigData). It is a restriction of ISO 8601:1988 that differs from the PICS 1.1 form used by the label options on, at, until and exp: DSig adds a hyphen separator, optional seconds and fractions, and narrows minutes from 0-60 to 0-59."
    quotes:
      - source_lines: "227"
        quote: "quoted-ISO-date ::= '\"' YYYY sep MM sep DD 'T' hh ':' mm[':' ss['.' f+]] Stz '\"'"
      - source_lines: "250"
        quote: "PICS 1.1 uses '.' as separators while the ISO"
      - source_lines: "253"
        quote: "and permits minutes to range from 0 to 60."
    fields:
      - name: "YYYY"
        type: "four digits"
        required: true
        source_lines: "231"
        note: "Year."
        constrained_by: []
        constrained_by_pending: true
      - name: "sep"
        type: "'.' or '-'"
        required: true
        source_lines: "230"
        note: "Occurs twice in the grammar; whether the two must agree is not said (ambiguity A1 in check-grammar.derived.py)."
        constrained_by: []
        constrained_by_pending: true
      - name: "MM"
        type: "two digits 01-12"
        required: true
        source_lines: "232"
        note: "Month."
        constrained_by: []
        constrained_by_pending: true
      - name: "DD"
        type: "two digits 01-31"
        required: true
        source_lines: "233"
        note: "Day of month."
        constrained_by: []
        constrained_by_pending: true
      - name: "T"
        type: "literal 'T'"
        required: true
        source_lines: "227"
        note: "Single-quoted literal."
        constrained_by: []
        constrained_by_pending: true
      - name: "hh"
        type: "two digits 00-23"
        required: true
        source_lines: "234"
        note: "am/pm not allowed."
        constrained_by: []
        constrained_by_pending: true
      - name: "mm"
        type: "two digits 00-59"
        required: true
        source_lines: "235"
        note: "Minutes. PICS 1.1 allowed 00-60 (L253)."
        constrained_by: []
        constrained_by_pending: true
      - name: "ss"
        type: "two digits 00-59"
        required: false
        source_lines: "236"
        note: "Optional seconds."
        constrained_by: []
        constrained_by_pending: true
      - name: "f"
        type: "one or more digits"
        required: false
        source_lines: "237"
        note: "Optional fraction of a second, only after ss in the grammar."
        constrained_by: []
        constrained_by_pending: true
      - name: "S"
        type: "'+' or '-'"
        required: true
        source_lines: "238"
        note: "Sign of the time zone offset."
        constrained_by: []
        constrained_by_pending: true
      - name: "tz"
        type: "four digits"
        required: true
        source_lines: "239-240"
        note: "Offset from UTC, hhmm; 1512 means 15 hours 12 minutes. The grammar line writes `Stz`; the key defines S and tz separately (F-07)."
        constrained_by: []
        constrained_by_pending: true
    layout: "\"1994-11-05T08:15-0500\" is the source's example; PICS 1.1 labels use \"1994.11.05T08:15-0500\"."
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-05"
    name: "sigblock-extension"
    locator: "§7.4.2 (Detailed Syntax of the sigblock Extension in a PICS 1.1 Label); §7.3.1 (Format Specification)"
    source_lines: "439-441, 288-290, 269-285"
    encoding: "Text of a PICS 1.1 label extension. Quoted strings are case sensitive; contiguous spaces outside quoted strings count as one (L183)"
    description: "The extension that carries one or more signatures over the label and, optionally, certificates. Replaces the PICS 1.1 signature-RSA-MD5 option (L174)."
    quotes:
      - source_lines: "439"
        quote: "SignatureExtension ::= 'extension ( optional'"
      - source_lines: "441"
        quote: "SigBlockURL ::= '\"http://www.w3.org/TR/1998/REC-DSig-label/sigblock-1_0\"'"
    fields:
      - name: "extension"
        type: "symbol"
        required: true
        source_lines: "439"
        note: "Option name."
        constrained_by: []
        constrained_by_pending: true
      - name: "optional"
        type: "symbol, the constant optional"
        required: true
        source_lines: "439, 282"
        note: "The extension is optional, never mandatory."
        constrained_by: []
        constrained_by_pending: true
      - name: "SigBlockURL"
        type: "quotedURL, the constant http://www.w3.org/TR/1998/REC-DSig-label/sigblock-1_0"
        required: true
        source_lines: "441"
        note: "Names the extension."
        constrained_by: []
        constrained_by_pending: true
      - name: "AttributionInfo"
        type: "AttribInfo list (MSG-06)"
        required: true
        source_lines: "440, 294"
        note: "Present as an element even when empty: the BNF has no `?` on it, while 7.3.2 says the section may be empty (reading R-1 in findings F-12)."
        constrained_by: []
        constrained_by_pending: true
      - name: "Signature"
        type: "Signature* (MSG-08)"
        required: false
        source_lines: "440, 411"
        note: "Zero or more. Parallel signatures are several Signature elements; cascaded signatures are not supported in one label (L411)."
        constrained_by: []
        constrained_by_pending: true
    layout: "extension ( optional \"<sigblock-1_0 URL>\" ( \"AttribInfo\" <Certificate>* ) <Signature>* )"
    placement:
      - "valid only as a label option (L285); service-option use is rejected by the derived grammar"
      - "valid in generic and specific labels (L283)"
      - "not part of the hashed text: none of the sigblock contributes to the hash (L296, L381)"
      - "removed in the equivalent standalone label (L523)"
    constrained_by: []
    constrained_by_pending: true
  - id: "MSG-06"
    name: "AttribInfo (attribution information)"
    locator: "§7.3.2 (Attribution Information)"
    source_lines: "442, 294-312"
    encoding: "A parenthesised list whose first member is the quoted string \"AttribInfo\""
    description: "Certificates asserting identity or authorisation, embedded or by URL. Not covered by the signature."
    quotes:
