usefulness:
  verdict: useful
  reason: "Answers R-0006's open VC cell: Data Integrity canonicalises at verification by construction (§1.1, §3, §4.4 step 8, §5.7) — the verifier re-transforms the received document and never sees signed bytes — so it is the direct counter-example to R-O-05 and fixes what an R-I-06 export via Data Integrity would cost."
  assessed: "2026-10-23"
distillation:
  standard: "FX-1"
  profile: full
  artifacts:
    - kind: normative
