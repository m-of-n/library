      coverage: "Every stated requirement as a script-rendered quotation in source order (202), split children beside their parents, the 16 inferred entries named in place, and the one keyword in non-normative text (L527, a Note). 33 source defects SD-1 to SD-33 plus editorial SD-E. Notes, examples and non-normative sections are not reproduced except where accounted for."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "290 entries: all 106 BCP 14 keywords placed by line in 78 keyword-bearing entries (R-0054 withdrawn: its SHOULD sits in a non-normative Note), 72 split children, 124 keyword-less stated entries (the §4 algorithm steps, §2 definitions, §4.7 errors), 16 inferred. All 212 candidates have a verdict (49 stated, 163 rejected). Does not cover the cryptosuites' own requirements or Controlled Identifiers v1.0."
      reviewed_by: ""
    - kind: schema
      path: distilled/schema/
      coverage: "The source has no grammar of its own (searched). 14 formal displays verbatim; 7 derived JSON Schemas 2020-12 (proof, secured document, resource integrity, verification method, problem details, verification result, proof options), 4 cross-field rules, 6 digest pins; 302 test cases, 0 differing. Not covered: proofValue contents, JSON-LD term mapping, calendar validity."
      reviewed_by: ""
    - kind: messages
      path: distilled/messages.yaml
      coverage: "23 structures, 85 fields, 5 encoding rules, 9 source tensions; 211 of 290 requirement ids wired, the other 79 listed with reasons. Multibase, Multikey and verification-method members beyond this source are marked outside it."
      reviewed_by: ""
    - kind: protocol
      path: distilled/protocol.yaml
      coverage: "No wire exchange: local algorithms only, deliveries between parties inferred. 12 roles, 19 flows with 122 steps (15 inferred), 7 error codes, one Mermaid diagram per flow in protocol.md, 21 source defects D-01 to D-21."
      reviewed_by: ""
    - kind: state-machine
      path: distilled/state-machine.yaml
      coverage: "11 machines, 91 states, 105 transitions (20 inferred): the §4.2 to §4.6 algorithms as printed, defects included, plus proof structure, verification-method retrieval, the §4.1 receive pipeline, validity window, challenge use and context resolution; 8 not modelled, each with a reason."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples/
      coverage: "All 14 examples verbatim from the HTML plus 12 derived fixtures (reproduce.py: 26, 0 different); 26 vectors, 174 checks. Signature recipe reproduces the vc-di-eddsa/vc-di-ecdsa Recommendations' own vectors (11 of 11); 0 of the 7 example proofs verify, including two under the published vc-di-ecdsa A.1 test key. The 3 pinned vocabulary digests match no file served on 2026-11-07. Findings EXD-01 to EXD-11."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "47 mapping rows against m-of-n at a56a3c0 (adopt 11, adapt 3, constrains 17, conflicts 2, silent 8, reject 6); MD-3 and DEC-002 option by option; R-O-05 clause by clause (conflicts on 3 of 5); P5.1 conflicts for self-verified imports; nothing reopens DEC-002; the R-I-06 export via Data Integrity; 12 open questions. Decides nothing."
