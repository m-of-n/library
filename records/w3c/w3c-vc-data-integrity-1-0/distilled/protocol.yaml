  - id: "F10"
    name: "context-validation"
    title: "Context Validation"
    locator: "§4.6"
    kind_of_flow: "receive-processing"
    run_by:
      - "verifier"
    normative_status: "normative"
    summary: >-
      Accepts the document only if its @context equals the known list, no subtree carries its own @context
      and every referenced context matches a known value or hash; otherwise recompacts to the
      known context, or fails.
    inputs: "document (map inputDocument), known contexts (list knownContext), recompact (boolean)"
    outputs: "context validation result: validated, validatedDocument, warnings, errors"
    note: >-
      Alternatives with the same protections are allowed: trusted out-of-band documentation when no
      JSON-LD processing happens, a document loader restricted to local approved copies, a list of
      URLs with approved hashes, or recompaction by the sender (F17).
    quotes:
      - source_lines: "L436"
        quote: "While the algorithm described in Section 4.6 Context Validation provides one way of checking context values, and one optional way of safely processing unknown context values, implementers MAY use alternative approaches, or a different ordering of the steps, that provide the same protections."
      - source_lines: "L438"
        quote: "Another approach would be to configure an application to use a JSON-LD Context loader, sometimes referred to as a document loader, to use only local copies of approved context files."
      - source_lines: "L439"
        quote: "Another alternative approach, also effectively equivalent to the algorithm in Section 4.6 Context Validation, would be for an application to keep a list of well known context URLs and their associated approved cryptographic hashes, without storing every context file locally."
    steps:
      - seq: "0"
        locator: "§4.6 ¶1"
        from: "verifier"
        to: "conforming-processor"
        message: "inputDocument (map), knownContext (list), recompact (boolean)"
        action: >-
          Invoke after verification with the document, the known contexts and the recompact flag.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        note: >-
          Which document is validated is not stated; the verified document returned by F08 or F09 is the
          reading consistent with the ordering rule (inferred).
        quotes:
          - source_lines: "L639"
            quote: "This algorithm takes inputs of a document (map inputDocument), a set of known JSON-LD Contexts (list knownContext), and a boolean to recompact when unknown contexts are detected (boolean recompact)."
          - source_lines: "L435"
            quote: "Context validation MUST be run after running the applicable algorithm in either Section 4.4 Verify Proof or Section 4.5 Verify Proof Sets and Chains."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0030"
          - "w3c-vc-data-integrity-1-0#R-0264"
      - seq: "1"
        step: "1"
        locator: "§4.6 step 1"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          Initialise result (validated false, empty warnings and errors), compactionContext, and clone
          inputDocument into result.validatedDocument.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        defects:
          - "D-08"
        quotes:
          - source_lines: "L650"
            quote: "Set result.validated to false, result.warnings to an empty list, result.errors to an empty list, compactionContext to an empty list; and clone inputDocument to result.validatedDocument."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0266"
      - seq: "2"
        step: "2"
        locator: "§4.6 step 2"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "contextValue = @context of the clone, possibly undefined."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L651"
            quote: "Let contextValue be the value of the @context property of result.validatedDocument, which might be undefined."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0267"
      - seq: "3"
        step: "3"
        locator: "§4.6 step 3"
        from: "conforming-processor"
        to: "context-source"
        action: >-
          Compare contextValue with knownContext, look for nested @context, and check every referenced
          context against known values or hashes.
        kind: "stated"
        calls:
          - "F11"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        note: >-
          The third test dereferences context URIs; whether from a cache or the network is the
          implementation's choice (F11).
        quotes:
          - source_lines: "L652"
            quote: "If contextValue does not deeply equal knownContext, any subtree in result.validatedDocument contains an @context property, or any URI in contextValue dereferences to a JSON-LD Context file that does not match a known good value or cryptographic hash, then perform the applicable action:"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0268"
      - seq: "4"
        step: "3.1"
        locator: "§4.6 step 3.1"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          recompact true: compact inputDocument with knownContext into result.validatedDocument.
