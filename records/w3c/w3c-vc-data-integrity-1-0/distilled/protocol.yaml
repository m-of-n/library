        on_error_basis: "inferred"
        normative_status: "normative"
        quotes:
          - source_lines: "L652"
            quote: "If contextValue does not deeply equal knownContext, any subtree in result.validatedDocument contains an @context property, or any URI in contextValue dereferences to a JSON-LD Context file that does not match a known good value or cryptographic hash, then perform the applicable action:"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0268"
  - id: "F12"
    name: "verification-method-retrieval"
    title: "Retrieving and binding the verification method"
    locator: "§2.1, §5.9, §5.10, §2.6"
    kind_of_flow: "out-of-scope"
    run_by:
      - "verifier"
    normative_status: "normative"
    summary: >-
      The proof's verificationMethod URL locates public key material in a controlled identifier
      document. The retrieval algorithm, the binding check and verification relationship validation
      are Controlled Identifiers v1.0 §3.3's. This document states why they matter, not how they run,
      and never says which component runs them.
    note: >-
      Not in the §4.4 algorithm; the cryptosuite's verifyProof is the nearest place it could run
      (inferred).
    steps:
      - seq: "1"
        locator: "§2.1 ¶10 (verificationMethod)"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          Read proof.verificationMethod, a URL string; if absent, another property such as cryptosuite may
          say how to obtain the key.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L211"
            quote: "If included, the value MUST be a string that maps to a [URL]. Inclusion of verificationMethod is OPTIONAL, but if it is not included, other properties such as cryptosuite might provide a mechanism by which to obtain the information necessary to verify the proof."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0006"
          - "w3c-vc-data-integrity-1-0#R-0007"
      - seq: "2"
        locator: "§2.1 ¶10 (verificationMethod)"
        from: "conforming-processor"
        to: "cid-document-source"
        message: "verification method URL"
        returns: "controlled identifier document"
        action: >-
          Dereference the URL to the controlled identifier document, unless the method needs no fetch
          (did:key).
        kind: "inferred"
        inferred_reason: >-
          No step of this document dereferences anything; the act is implied by the location the URL
          points to and by §5.14's network concern.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L211"
            quote: "Note that when verificationMethod is expressed in a data integrity proof, the value points to the actual location of the data; that is, the verificationMethod references, via a URL, the location of the public key that can be used to verify the proof. This public key data is stored in a controlled identifier document, which contains a full description of the verification method."
          - source_lines: "L779"
            quote: "For example, caching techniques for JSON-LD contexts are described in Section 2.4 Contexts and Vocabularies, and some verification methods, such as did:key [DID-KEY], do not need to be fetched from the network at all."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0091"
          - "w3c-vc-data-integrity-1-0#R-0092"
      - seq: "3"
        locator: "§5.9 ¶1"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          Binding: the controlled identifier document must itself reference the verification method.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L749"
            quote: "Implementers ensure that a verification method is bound to a particular controller by going from the definition of the verification method to the controlled identifier document, and then ensuring that the controlled identifier document also contains a reference to the verification method. This process is described in the algorithm for retrieving a verification method."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0283"
      - seq: "4"
        locator: "§5.10 ¶1"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          Verification relationship: the method must be listed for the purpose of the proof being
          verified.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L753"
            quote: "When an implementation is verifying a proof, it is imperative that it verify not only that the verification method used to generate the proof is listed in the controlled identifier document, but also that it was intended to be used to generate the proof that is being verified. This process is known as \"verification relationship validation\"."
          - source_lines: "L754"
            quote: "The process of validating a verification relationship is outlined in Section 3.3 Retrieve Verification Method of the Controlled Identifiers v1.0 specification."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0284"
          - "w3c-vc-data-integrity-1-0#R-0285"
      - seq: "5"
        locator: "§2.6 ¶2"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          For a credential or presentation, check the method's controller is the issuer or holder, under a
          relationship acceptable for the proof purpose.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L484"
            quote: "One way to check for such an association is to ensure that the value of the controller property of a proof's verification method matches the URL value used to identify the issuer or holder, respectively, and that the verification method is expressed under a verification relationship that is acceptable given the proof's purpose. This particular association indicates that the issuer or holder, respectively, is the controller of the verification method used to verify the proof."
      - seq: "6"
        locator: "§5.10 ¶2"
        from: "cid-document-source"
        to: "conforming-processor"
        action: "Retrieval or binding fails."
        kind: "inferred"
        inferred_reason: >-
          The failure path belongs to Controlled Identifiers v1.0, which this record does not hold; no
          error code for it is in §4.7.
        on_error: "unspecified by source (Controlled Identifiers v1.0 §3.3)"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L754"
            quote: "The process of validating a verification relationship is outlined in Section 3.3 Retrieve Verification Method of the Controlled Identifiers v1.0 specification."
  - id: "F13"
    name: "verifier-checks-outside-the-algorithm"
    title: "Checks the verifier owes that §4.4 does not perform"
