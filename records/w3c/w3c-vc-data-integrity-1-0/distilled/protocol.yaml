        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0124"
          - "w3c-vc-data-integrity-1-0#R-0125"
          - "w3c-vc-data-integrity-1-0#R-0126"
          - "w3c-vc-data-integrity-1-0#R-0127"
      - seq: "2"
        locator: "§2.4 ¶11"
        from: "conforming-processor"
        to: "context-source"
