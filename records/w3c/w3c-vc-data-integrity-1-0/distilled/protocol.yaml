        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0123"
      - seq: "3"
        locator: "§2.3 ¶1"
        from: "verifier"
        to: "context-source"
        action: "Fetch or look up the resource and compare its digest."
        kind: "inferred"
        inferred_reason: "The goal is stated; no algorithm, error code or outcome is."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L387"
            quote: "When a link to an external resource is included in a conforming secured document, it is desirable to know whether the resource that is identified has changed since the proof was created. This applies to cases where there is an external resource that is remotely retrieved as well as to cases where the verifier might have a locally cached copy of the resource."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0122"
      - seq: "4"
        locator: "§2.3 ¶7"
        from: "proof-creator"
        to: "proof-creator"
        action: "Choose a hash algorithm appropriate to the use case."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L402"
            quote: "Implementers are urged to consult appropriate sources, such as the FIPS 180-4 Secure Hash Standard and the Commercial National Security Algorithm Suite 2.0 to ensure that they are choosing a hash algorithm that is appropriate for their use case."
  - id: "F19"
    name: "error-reporting"
    title: "Conveying errors"
    locator: "§1.3, §4.7, §4.4"
    kind_of_flow: "local-decision"
    run_by:
      - "conforming-processor"
    normative_status: "normative"
    summary: >-
      Errors are conveyed with codes; exposed over HTTP they should be RFC 9457 ProblemDetails whose
      type URL is the security namespace plus the code.
    quotes:
      - source_lines: "L661"
        quote: "The algorithms described in this specification, as well as in various cryptographic suite specifications, throw specific types of errors."
    steps:
      - seq: "1"
        locator: "§1.3 ¶5"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "Produce errors when consuming non-conforming documents."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L169"
            quote: "Conforming processors MUST produce errors when non-conforming documents are consumed."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0001"
      - seq: "2"
        locator: "§4.7 ¶2"
        from: "conforming-processor"
        to: "error-consumer"
        message: "ProblemDetails (map)"
        action: "Expose errors over HTTP as ProblemDetails."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L662"
            quote: "When exposing these errors through an HTTP interface, implementers SHOULD use [RFC9457] to encode the error data structure as a ProblemDetails map. If [RFC9457] is used:"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0075"
      - seq: "3"
        locator: "§4.7 ¶3"
        from: "conforming-processor"
        to: "error-consumer"
        action: >-
          type is https://w3id.org/security# followed by the code; title short, detail longer.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        defects:
          - "D-09"
        quotes:
          - source_lines: "L663"
            quote: "The type value of the error object MUST be a URL that starts with the value https://w3id.org/security# and ends with the value in the section listed below."
          - source_lines: "L664"
            quote: "The title value SHOULD provide a short but specific human-readable string for the error."
          - source_lines: "L665"
            quote: "The detail value SHOULD provide a longer human-readable string for the error."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0077"
          - "w3c-vc-data-integrity-1-0#R-0078"
          - "w3c-vc-data-integrity-1-0#R-0273"
      - seq: "4"
        locator: "§4.4 ¶22 (warnings)"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          Results carry ProblemDetails lists in warnings and errors whatever the interface.
        kind: "inferred"
        inferred_reason: >-
          The verification and context validation result structs define warnings and errors as lists of
          ProblemDetails; §4.7's SHOULD is only about HTTP.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L596"
            quote: "a list of ProblemDetails, which defaults to an empty list"
          - source_lines: "L646"
            quote: "a list of ProblemDetails, which defaults to an empty list"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0217"
          - "w3c-vc-data-integrity-1-0#R-0265"
