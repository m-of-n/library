        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L871"
            quote: "A holder or any other intermediary receiving a secured data document containing a proof set is able to remove any of the proof values within the set prior to passing it on to another entity and the secured data document will still verify."
      - seq: "3"
        locator: "Appendix A ¶10"
        from: "holder-or-intermediary"
        to: "verifier"
        message: "secured data document (one proof fewer)"
        action: "Remove a proof from the set and pass the document on."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L871"
            quote: "A holder or any other intermediary receiving a secured data document containing a proof set is able to remove any of the proof values within the set prior to passing it on to another entity and the secured data document will still verify."
      - seq: "4"
        locator: "Appendix A ¶10"
        from: "verifier"
        to: "conforming-processor"
        action: "Verify the remaining proofs; nothing in §4.5 detects the removal."
        kind: "stated"
        calls:
          - "F09"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        note: "§4.5 has no input for the expected set of signers (inferred)."
        quotes:
          - source_lines: "L871"
            quote: "since any intermediary could remove signatures from the proof set and still have it verify; for instance, in the example below, it looks like the CFO and CEO approved something without the VP of Engineering's concurrence."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0290"
      - seq: "5"
        locator: "Appendix A ¶12"
        from: "proof-creator"
        to: "proof-creator"
        action: >-
          To make order and completeness matter, link the proofs with id and previousProof.
        kind: "stated"
        calls:
          - "F15"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L885"
            quote: "It is possible to introduce a dependency between proofs in a proof set by setting the id property of each proof such that another proof can reference it. In other words, a dependent proof will be referenced by other relying proofs by using the previousProof property. Such dependency chains can have arbitrary depth."
  - id: "F17"
    name: "recompaction-for-receiver"
    title: "Sender compacts to the receiver's context"
    locator: "§2.4.1"
    kind_of_flow: "exchange"
    run_by:
      - "holder-or-intermediary"
      - "verifier"
    normative_status: "normative"
    summary: >-
      An alternative to §4.6: the transmitter compacts the document to exactly what the receiver asks
      for, dropping sender-specific contexts; valid if the cryptosuite still verifies it.
    steps:
      - seq: "1"
        locator: "§2.4.1 ¶6"
        from: "verifier"
        to: "holder-or-intermediary"
        message: "request naming the expected context"
        action: "Ask for the document in a given context, e.g. in a presentation request."
        kind: "inferred"
        inferred_reason: "The source names such a protocol only as an example and defines no message."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L440"
            quote: "Yet another valid approach would be for a transmitting application to compact a document to exactly what a receiving application requests, via a protocol such as one requesting a verifiable presentation, omitting additional sender-specific context values that were used when securing the original document."
      - seq: "2"
        locator: "§2.4.1 ¶6"
        from: "holder-or-intermediary"
        to: "holder-or-intermediary"
        action: >-
          Compact the document to the requested context, omitting the sender's own contexts.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L440"
            quote: "Yet another valid approach would be for a transmitting application to compact a document to exactly what a receiving application requests, via a protocol such as one requesting a verifiable presentation, omitting additional sender-specific context values that were used when securing the original document."
      - seq: "3"
        locator: "§2.4.1 ¶6"
        from: "holder-or-intermediary"
        to: "verifier"
        message: "secured data document (recompacted)"
        action: "Send the compacted document."
        kind: "inferred"
        inferred_reason: "Delivery is not defined."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L440"
            quote: "That is, a term that was previously compacted to foo based on a sender-supplied context that is unknown to a receiver (e.g., `https://ontology.example/v1) would instead be \"expanded\" to a URL like https://ontology.example#foo, which would then be \"compacted\" to the same URL, once the unknown context is omitted and the JSON-LD compaction algorithm is applied by the receiving application."
      - seq: "4"
        locator: "§2.4.1 ¶6"
        from: "verifier"
        to: "conforming-processor"
        action: "Verify; the transformation is valid only if verification succeeds."
        kind: "stated"
        calls:
          - "F08"
          - "F09"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        note: >-
          A suite whose transformation is not invariant under compaction (a JCS suite, say) would fail
          here; the condition covers it (inferred).
        quotes:
          - source_lines: "L440"
            quote: "As long as the cryptography suite's verification algorithm provides a successful verification result, such transformations are valid and would result in full URLs for terms that were previously compacted by the omitted context."
  - id: "F18"
    name: "resource-integrity"
    title: "Integrity of linked resources"
    locator: "§2.3"
    kind_of_flow: "local-processing"
    run_by:
      - "proof-creator"
      - "verifier"
    normative_status: "normative"
    summary: >-
      A document may pin a linked resource with digestMultibase; the source defines the property but
      no comparison step and no error.
    steps:
      - seq: "1"
        locator: "§2.3 ¶2"
        from: "proof-creator"
        to: "proof-creator"
