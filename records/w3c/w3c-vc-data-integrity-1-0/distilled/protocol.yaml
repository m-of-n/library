  - id: "F14"
    name: "domain-and-challenge-exchange"
    title: "Domain and challenge"
    locator: "§2.1, §4.1, §4.4"
    kind_of_flow: "exchange"
    run_by:
      - "verifier"
      - "proof-creator"
    normative_status: "normative"
    summary: >-
      The nearest the source comes to an exchange between parties: the verifier's domain and a
      one-time challenge reach the proof creator, who binds them into the proof; the verifier checks
      them. The source names no message carrying either value.
    steps:
      - seq: "1"
        locator: "§2.1 ¶18 (domain)"
        from: "verifier"
        to: "proof-creator"
        message: "challenge, domain"
        action: "Send a challenge, with the verifier's security domain."
        kind: "inferred"
        inferred_reason: >-
          The source says domain is useful in challenge-response protocols and that a challenge is used
          once per domain and time window; it defines no request carrying them.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L219"
            quote: "The specification of the domain parameter is useful in challenge-response protocols where the verifier is operating from within a security domain known to the creator of the proof."
          - source_lines: "L221"
            quote: "The value is used once for a particular domain and window of time. This value is used to mitigate replay attacks."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0105"
      - seq: "2"
        locator: "§2.1 ¶20 (challenge)"
        from: "proof-creator"
        to: "conforming-processor"
        action: >-
          Add Proof with options.domain and options.challenge; a challenge should accompany a domain.
        kind: "stated"
        calls:
          - "F04"
        error_code: "PROOF_GENERATION_ERROR"
        on_error: >-
          F04 steps 3-4 raise PROOF_GENERATION_ERROR if createProof did not carry them over.
        on_error_basis: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L221"
            quote: "A string value that SHOULD be included in a proof if a domain is specified."
          - source_lines: "L552"
            quote: "If options has a non-null domain item, it MUST be equal to proof.domain or an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
          - source_lines: "L553"
            quote: "If options has a non-null challenge item, it MUST be equal to proof.challenge or an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0104"
          - "w3c-vc-data-integrity-1-0#R-0184"
          - "w3c-vc-data-integrity-1-0#R-0185"
          - "w3c-vc-data-integrity-1-0#R-0186"
          - "w3c-vc-data-integrity-1-0#R-0187"
          - "w3c-vc-data-integrity-1-0#R-0188"
      - seq: "3"
        locator: "§4.1 ¶6"
        from: "proof-creator"
        to: "verifier"
        message: "secured data document"
        action: "Deliver the secured document."
        kind: "inferred"
        inferred_reason: "No delivery is defined anywhere in the source."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L541"
            quote: "When software needs to use information that was transmitted to it using a mechanism described by this specification, it performs the following steps:"
      - seq: "4"
        step: "6-7"
        locator: "§4.4 step 6-7"
        from: "verifier"
        to: "conforming-processor"
        action: "Verify Proof with the same domain and challenge."
        kind: "stated"
        calls:
          - "F08"
        error_code: "INVALID_DOMAIN_ERROR, INVALID_CHALLENGE_ERROR"
        on_error: "Verified false with INVALID_DOMAIN_ERROR or INVALID_CHALLENGE_ERROR."
        on_error_basis: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L605"
            quote: "If domain was given, and it does not contain the same strings as proof.domain (treating a single string as a set containing just that string), an error MUST be raised and SHOULD convey an error type of INVALID_DOMAIN_ERROR."
          - source_lines: "L606"
            quote: "If challenge was given, and it does not match proof.challenge, an error MUST be raised and SHOULD convey an error type of INVALID_CHALLENGE_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0229"
          - "w3c-vc-data-integrity-1-0#R-0230"
          - "w3c-vc-data-integrity-1-0#R-0231"
          - "w3c-vc-data-integrity-1-0#R-0232"
      - seq: "5"
        locator: "§2.1 ¶20 (challenge)"
        from: "verifier"
        to: "verifier"
        action: "Retire the challenge so it cannot be accepted twice in that domain and window."
        kind: "inferred"
