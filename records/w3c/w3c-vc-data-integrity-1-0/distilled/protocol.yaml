        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L842"
            quote: "When constructing a proof set where each of the signatories signs an inputDocument without concern, we construct a proof symbolically as:"
      - seq: "2"
        locator: "Appendix A ¶10"
        from: "proof-creator"
        to: "holder-or-intermediary"
        message: "secured data document"
