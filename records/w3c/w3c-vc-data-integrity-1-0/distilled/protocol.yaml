            quote: "Implementations MAY load application-specific JSON-LD context files from the network during development, but SHOULD permanently cache JSON-LD context files used by conforming secured documents in production settings, to increase their security and privacy characteristics."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0137"
          - "w3c-vc-data-integrity-1-0#R-0138"
      - seq: "6"
        locator: "§5.14 ¶3"
        from: "conforming-processor"
        to: "context-source"
        action: >-
          When a fetch is unavoidable, defend against denial of service and prefer privacy-preserving
