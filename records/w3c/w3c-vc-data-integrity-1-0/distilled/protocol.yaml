          - source_lines: "L424"
            quote: "SHA2-256 Digest: 9a5ba1e23f54b9adc9c39429f5eb3bd672cb392495cc4159561462921e012b37"
          - source_lines: "L425"
            quote: "The vocabulary in HTML+RDFa Format [HTML-RDFA]."
          - source_lines: "L426"
            quote: "SHA2-256 Digest: dadc810b5bb2c01a3caf276dc03a7c826311cddfefe86160a8c7d34704f50422"
        constrained_by:
