  - id: "F15"
    name: "proof-chain-across-parties"
    title: "A proof chain built by three signatories"
    locator: "Appendix A, §6.3"
    kind_of_flow: "exchange"
    run_by:
      - "proof-creator"
      - "verifier"
    normative_status: "non-normative (Appendix A)"
    summary: >-
      Appendix A's approval chain: each signatory verifies what it received, then adds a proof whose
      previousProof names the last one. Delivery between them is not defined.
    quotes:
      - source_lines: "L885"
        quote: "The intent of such a proof chain is to model an approval chain in a business process or a notary witnessing analog signatures."
    steps:
      - seq: "1"
        locator: "Appendix A ¶12"
        from: "proof-creator (VP Engineering)"
        to: "proof-creator (VP Engineering)"
        action: "Sign first and give the proof an id so later proofs can name it."
        kind: "stated"
        calls:
          - "F04"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L886"
            quote: "Since others will be referring to the VP of Engineering's signature, we need to add an id to the proof. First the VP of Engineering signs the input document:"
      - seq: "2"
        locator: "Appendix A ¶14"
        from: "proof-creator (VP Engineering)"
        to: "proof-creator (CFO)"
        message: "secured data document"
        action: "Pass the document on."
        kind: "inferred"
        inferred_reason: "The appendix says the CFO receives the document; how is not said."
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L898"
            quote: "Next, the CFO receives the document, verifies that the VP of Engineering signed it,"
      - seq: "3"
        locator: "Appendix A ¶14"
        from: "proof-creator (CFO)"
        to: "conforming-processor"
        action: "Verify the first proof, then add a proof with previousProof set to its id."
        kind: "stated"
        calls:
          - "F09"
          - "F05"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L898"
            quote: "Next, the CFO receives the document, verifies that the VP of Engineering signed it, and signs it based on a review and on the signature of the VP of Engineering. For this, we need to set up the proof chain by indicating a dependency on the proof in the document just received. We do this by setting the previousProof property of the second proof to the value urn:proof-1, which \"binds\" the second proof to the first proof, which is then signed. The following example shows how the dependency on the first proof is created:"
      - seq: "4"
        locator: "Appendix A ¶16"
        from: "proof-creator (CEO)"
        to: "conforming-processor"
        action: >-
          Verify the first proof over the original document and the second over the document plus the
          first.
        kind: "stated"
        calls:
          - "F09"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L915"
            quote: "First, they will check the proof with an id property whose value is urn:proof-1 against the public key of the VP of Engineering. Note that this proof is over the original document."
          - source_lines: "L916"
            quote: "Next, the CEO will check the proof with an id property whose value is urn:proof-2 against the public key of the CFO. However, to make sure that the CFO signed the document with proof that the VP of Engineering had already signed, we verify this proof over the combination of the document and urn:proof-1."
      - seq: "5"
        locator: "Appendix A ¶16"
        from: "proof-creator (CEO)"
        to: "conforming-processor"
        action: "Add a third proof naming the second."
        kind: "stated"
        calls:
          - "F05"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        defects:
          - "D-14"
        quotes:
          - source_lines: "L916"
            quote: "If verification is successful, the CEO signs, producing a proof over the document which includes urn:proof-1 and urn:proof-2. The final proof chain looks like this:"
      - seq: "6"
        locator: "Appendix A ¶18"
        from: "verifier"
        to: "conforming-processor"
        action: "Any later recipient verifies each proof in the chain."
        kind: "stated"
        calls:
          - "F09"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L938"
            quote: "The recipient of this secured data document then validates it in a similar way, checking each proof in the chain."
      - seq: "7"
        locator: "§6.3 ¶2"
        from: "proof-creator (CFO)"
        to: "proof-creator (CFO)"
        action: >-
          Each later signatory necessarily sees the verification methods of the earlier proofs.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L807"
            quote: "At minimum, the verification method for the previous proof, such as a public key, is seen by the creator of the next proof in a proof chain."
  - id: "F16"
    name: "proof-set-member-removal"
    title: "Dropping a member of a proof set"
    locator: "Appendix A"
    kind_of_flow: "exchange"
    run_by:
      - "holder-or-intermediary"
      - "verifier"
    normative_status: "non-normative (Appendix A)"
    summary: >-
      Set members each cover only the document, so an intermediary can remove one and the rest still
      verify; a chain is the remedy.
    steps:
      - seq: "1"
        locator: "Appendix A ¶5"
        from: "proof-creator"
        to: "proof-creator"
        action: "Several signatories each sign the same input document."
        kind: "stated"
