            quote: "If result.errors is empty, set result.validated to true; otherwise, set result.validated to false, and remove the document property from result."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0271"
      - seq: "7"
        step: "5"
        locator: "§4.6 step 5"
        from: "conforming-processor"
        to: "verifier"
        message: "context validation result"
        action: "Return result."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L656"
            quote: "Return the value of result."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0272"
      - seq: "8"
        locator: "§4.6 ¶19"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "Extra warnings or errors may be added for implementation or use-case rules."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L657"
            quote: "Implementations MAY include additional warnings or errors that enforce further validation rules that are specific to the implementation or a particular use case."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0074"
  - id: "F11"
    name: "context-and-vocabulary-resolution"
    title: "Resolving contexts and the security vocabulary"
    locator: "§2.4, §5.14, §4.6"
