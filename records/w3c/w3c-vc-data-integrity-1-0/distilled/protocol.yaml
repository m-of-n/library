          - source_lines: "L421"
            quote: "The vocabulary in JSON-LD format [JSON-LD11]."
          - source_lines: "L422"
            quote: "SHA2-256 Digest: 082434d5b742418753bbc5d593f93b66d4f1ccf1c627417c0caa2dea40728245"
        constrained_by:
