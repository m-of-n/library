        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L388"
            quote: "To enable confirmation that a resource referenced by a conforming secured document has not changed since the document was secured, an implementer MAY include a property named digestMultibase in any object that includes an id property. If present, the digestMultibase value MUST be a single string value, or an list of string values, each of which is a Multibase-encoded Multihash value."
        constrained_by:
