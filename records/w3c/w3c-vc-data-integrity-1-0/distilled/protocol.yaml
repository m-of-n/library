applicability: >-
  This document defines a data format (the proof and its properties) and local algorithms that two
  kinds of party run on their own: a proof creator adding proofs (§4.2, §4.3) and a verifier
  checking them (§4.4, §4.5) and the document's contexts (§4.6). It defines no request, response,
  transport or session between them. Protocol is not N/A all the same: the algorithms call across
  a fixed interface into a cryptosuite instance (§3), the verifier dereferences contexts and the
  security vocabulary (§2.4, the one HTTP exchange the text describes) and verification methods
  (§2.1, §5.9), domain and challenge only make sense as values passed from verifier to creator
  (§2.1), and Appendix A walks a three-party chain. So every flow is either a party's local
  processing with its calls into the cryptosuite and external resources, or a multi-party sequence
  whose deliveries the source does not define and this file marks inferred.
conventions:
  quoting: "Every quotes item is {source_lines, quote}. The quote was cut by script from the .txt as bin/_source_text reads it, by line number, optionally narrowed to a sub-span by start and end anchors that only select. No quote was typed. bin/check-quotes verifies each against its lines; a second audit confirms each also occurs in the tag-stripped HTML."
  step_numbers: "step is the source's own algorithm step: the position in the HTML ordered list, nested lists written 3.2. The source cross-references steps the same way (§4.3 step 7, §4.5 step 3.3 note, §4.5 step 3.4). seq is this file's order within a flow; seq 0 is the invocation."
  locators: "§ and the .txt heading number, then step n, or ¶n, which counts the section's own non-blank .txt lines after its heading (one per HTML block: paragraph, list item, dt, dd, table row, note line), an example's code block counted once; a parenthesised name labels a definition entry. source_lines is authoritative."
  basis: "kind is stated or inferred per step; an inferred step carries inferred_reason. on_error_basis is stated (the source says what follows), unspecified (on_error reads unspecified by source) or inferred (this file's reading, said so). action, note, on_error and summary are this file's words."
  messages: "message and returns name the source's own structures (input document, proof options, cryptosuite instance, data integrity proof, secured data document, verification result, cryptosuite verification result, context validation result, ProblemDetails). Pass 3 joins them to messages.yaml; this agent did not read that file."
  normative_status: "normative unless the source marks it otherwise: §1 to §1.2 and Appendices A to C are non-normative, and §1.3 makes every note and example non-normative."
  constrained_by: "requirement ids of distilled/requirements.yaml whose source_lines fall on a line a step quotes, selected by script."
roles:
  - name: "proof-creator"
    kind: "party"
    description: >-
      The entity, and the application software acting for it, that secures a document: arranges it,
      picks contexts and cryptosuites, and adds one or more proofs (§4.1 first list, §4.2, §4.3).
      Supplies nonce, domain and challenge values through proof options.
    quotes:
      - source_lines: "L227"
        quote: "An OPTIONAL string value supplied by the proof creator. One use of this field is to increase privacy by decreasing linkability that is the result of deterministically generated signatures."
      - source_lines: "L536"
        quote: "When software is to ensure information is tamper-evident, it performs the following steps:"
    locators:
      - "§2.1 ¶26 (nonce)"
      - "§4.1 ¶1"
  - name: "verifier"
    kind: "party"
    description: >-
      The one role the document defines in §1.4. Receives a secured document, runs Verify Proof or
      Verify Proof Sets and Chains, then Context Validation, and supplies the expected proof purpose,
      domain and challenge.
    quotes:
      - source_lines: "L190"
        quote: "A role an entity performs by receiving data containing one or more data integrity proofs and then determining whether or not the proof is legitimate."
      - source_lines: "L541"
        quote: "When software needs to use information that was transmitted to it using a mechanism described by this specification, it performs the following steps:"
    locators:
      - "§1.4 ¶18 (verifier)"
      - "§4.1 ¶6"
  - name: "holder-or-intermediary"
    kind: "party"
    description: >-
      Any party that receives a secured document and passes it on: may drop members of a proof set
      (Appendix A, non-normative) or, as a transmitting application, compact the document to what a
      receiver asks for (§2.4.1). Named only in those two places; holder is the VC Data Model role
      (§2.6).
    quotes:
      - source_lines: "L871"
        quote: "A holder or any other intermediary receiving a secured data document containing a proof set is able to remove any of the proof values within the set prior to passing it on to another entity and the secured data document will still verify."
      - source_lines: "L440"
        quote: "Yet another valid approach would be for a transmitting application to compact a document to exactly what a receiving application requests, via a protocol such as one requesting a verifiable presentation, omitting additional sender-specific context values that were used when securing the original document."
    locators:
      - "Appendix A ¶10"
      - "§2.4.1 ¶6"
  - name: "conforming-processor"
    kind: "software"
    description: >-
      The implementation of the §4 algorithms used by either party. The document's own conformance
      class for software; obliged to produce errors on non-conforming input.
    quotes:
      - source_lines: "L169"
        quote: "A conforming processor is any algorithm realized as software and/or hardware that generates and/or consumes a conforming secured document according to the relevant normative statements in Section 4. Algorithms. Conforming processors MUST produce errors when non-conforming documents are consumed."
    locators:
      - "§1.3 ¶5"
  - name: "cryptosuite-instance"
    kind: "software component"
    description: >-
      The struct a cryptosuite instantiation algorithm returns; carries createProof and verifyProof,
      which the §4 algorithms call. All transformation, hashing, proof serialization and proof
      verification happens behind this interface.
    quotes:
      - source_lines: "L498"
        quote: "The specification MUST define a data integrity cryptographic suite instantiation algorithm that accepts a set of options (map options) and returns a cryptosuite instance (struct cryptosuite)."
      - source_lines: "L500"
        quote: "An algorithm that takes an input document (map inputDocument) and proof options (map options) as input, and produces a data integrity proof (map) or an error."
      - source_lines: "L502"
        quote: "An algorithm that takes a secured data document (map securedDocument) as input, and produces a cryptosuite verification result or an error. The cryptosuite verification result is a struct that contains the following items:"
      - source_lines: "L512"
        quote: "A cryptosuite instance is instantiated using a cryptosuite instantiation algorithm and is made available to algorithms in an implementation-specific manner."
    locators:
      - "§3 ¶9"
      - "§3 ¶11 (createProof)"
      - "§3 ¶13 (verifyProof)"
      - "§3 ¶23"
  - name: "cryptosuite-specification"
    kind: "document (conformance class)"
    description: >-
      A conforming cryptographic suite specification. Runtime-inert here: it is the target of the §3
      authoring requirements and defines the instantiation algorithm and both interface algorithms. No
      flow sends it anything.
    quotes:
      - source_lines: "L168"
        quote: "A conforming cryptographic suite specification is any specification that follows the relevant normative requirements in Section 3. Cryptographic Suites."
      - source_lines: "L491"
        quote: "The requirements for all data integrity cryptographic suite specifications are as follows:"
    locators:
      - "§1.3 ¶4"
      - "§3 ¶2"
  - name: "vc-extensions"
    kind: "external document"
    description: >-
      The Verifiable Credential Extensions document, where instantiation algorithms should be listed
      and may be discovered.
    quotes:
      - source_lines: "L498"
        quote: "This algorithm SHOULD be listed in the Verifiable Credential Extensions document."
      - source_lines: "L512"
        quote: "Implementations MAY use the Verifiable Credential Extensions document to discover known cryptosuite instantiation algorithms."
    locators:
      - "§3 ¶9"
      - "§3 ¶23"
  - name: "context-source"
    kind: "external resource"
    description: >-
      Wherever a JSON-LD context or the security vocabulary comes from: a local pinned copy, a cache,
      or the network (w3id.org with HTTP content negotiation).
    quotes:
      - source_lines: "L406"
        quote: "Implementations that perform JSON-LD processing MUST treat the following JSON-LD context URLs as already resolved, where the resolved document matches the corresponding hash values below:"
      - source_lines: "L419"
        quote: "When dereferencing the https://w3id.org/security# URL, the media type of the data that is returned depends on HTTP content negotiation. These are as follows:"
      - source_lines: "L778"
        quote: "Readers might note, however, that JSON-LD contexts and verification methods can contain URLs that might be retrieved over a network connection. This concern exists for any URL that might be loaded from the network during or after verification."
    locators:
      - "§2.4 ¶1"
      - "§2.4 ¶14"
      - "§5.14 ¶1"
  - name: "cid-document-source"
    kind: "external resource"
    description: >-
      Wherever the controlled identifier document holding a verification method comes from. Some
      verification methods (did:key) need no fetch. Retrieval is defined by Controlled Identifiers
      v1.0, not here.
    quotes:
      - source_lines: "L211"
        quote: "Note that when verificationMethod is expressed in a data integrity proof, the value points to the actual location of the data; that is, the verificationMethod references, via a URL, the location of the public key that can be used to verify the proof. This public key data is stored in a controlled identifier document, which contains a full description of the verification method."
      - source_lines: "L749"
        quote: "Implementers ensure that a verification method is bound to a particular controller by going from the definition of the verification method to the controlled identifier document, and then ensuring that the controlled identifier document also contains a reference to the verification method. This process is described in the algorithm for retrieving a verification method."
    locators:
      - "§2.1 ¶10 (verificationMethod)"
      - "§5.9 ¶1"
  - name: "controller"
    kind: "entity"
    description: >-
      Controller of a verification method; for a credential or presentation, expected to be the issuer
      or holder. Does nothing in any flow; it is what the binding checks establish.
    quotes:
      - source_lines: "L484"
        quote: "This particular association indicates that the issuer or holder, respectively, is the controller of the verification method used to verify the proof."
    locators:
      - "§2.6 ¶2"
  - name: "error-consumer"
    kind: "party"
    description: >-
      Another library or system that receives errors, over an HTTP interface or otherwise. Only the
      error encoding is defined; no request or exchange is.
    quotes:
      - source_lines: "L661"
        quote: "Implementers might find it useful to convey these errors to other libraries or software systems."
      - source_lines: "L662"
        quote: "When exposing these errors through an HTTP interface, implementers SHOULD use [RFC9457] to encode the error data structure as a ProblemDetails map."
    locators:
      - "§4.7 ¶1"
      - "§4.7 ¶2"
  - name: "context-and-document-authors"
    kind: "author (no runtime flow)"
    description: >-
      Authors of JSON-LD contexts, vocabularies and documents, addressed by advice and one SHOULD on
      cacheability; listed so the SHOULD has an actor.
    quotes:
      - source_lines: "L389"
        quote: "JSON-LD context authors are expected to add digestMultibase to contexts that will be used in documents that refer to other resources and to include an associated cryptographic digest."
      - source_lines: "L428"
        quote: "Authors of application-specific vocabularies and specifications SHOULD ensure that their JSON-LD context and vocabulary files are permanently cacheable using the approaches to caching described above or a functionally equivalent mechanism."
    locators:
      - "§2.3 ¶3"
      - "§2.4 ¶23"
flows:
  - id: "F01"
    name: "secure-processing-model"
    title: "Processing model, securing side"
    locator: "§4.1"
    kind_of_flow: "local-processing"
    run_by:
      - "proof-creator"
    normative_status: "normative"
    summary: >-
      The four things software does to make information tamper-evident, ending in Add Proof or Add
      Proof Set/Chain. Delivery of the result is not in the source.
    quotes:
      - source_lines: "L536"
        quote: "The processing model used by a conforming processor and its application-specific software is described in this section. When software is to ensure information is tamper-evident, it performs the following steps:"
    steps:
      - seq: "1"
        step: "1"
        locator: "§4.1 first list step 1"
        from: "proof-creator"
        to: "proof-creator"
        action: "Arrange the information into a document (JSON or JSON-LD)."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L537"
            quote: "The software arranges the information into a document, such as a JSON or JSON-LD document."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0170"
      - seq: "2"
        step: "2"
        locator: "§4.1 first list step 2"
        from: "proof-creator"
        to: "proof-creator"
        action: >-
          For a JSON-LD document, select contexts and express them in @context; see F03 for the injection
          rule that applies when securing.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L538"
            quote: "If the document is a JSON-LD document, the software selects one or more JSON-LD Contexts and expresses them using the @context property."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0171"
      - seq: "3"
        step: "3"
        locator: "§4.1 first list step 3"
        from: "proof-creator"
        to: "proof-creator"
        action: "Select one or more cryptosuites and key material; obtaining an instance is F02."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L539"
            quote: "The software selects one or more cryptography suites that meet the needs of the use case, such as one that provides full, selective, or unlinkable disclosure, using acceptable cryptographic key material."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0172"
      - seq: "4"
        step: "4"
        locator: "§4.1 first list step 4"
        from: "proof-creator"
        to: "conforming-processor"
        action: "Add one or more proofs with §4.2 (F04) or §4.3 (F05)."
        kind: "stated"
        calls:
          - "F04"
          - "F05"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L540"
            quote: "The software uses the applicable algorithm(s) provided in Section 4.2 Add Proof or Section 4.3 Add Proof Set/Chain to add one or more proofs."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0173"
      - seq: "5"
        locator: "§4.1 ¶6"
        from: "proof-creator"
        to: "holder-or-intermediary"
        message: "secured data document"
        action: "Deliver the secured document to a holder or verifier."
        kind: "inferred"
        inferred_reason: >-
          The source defines no transport, request or delivery. The quoted sentence is the only mention of
          transmission and it is about the receiving side.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L541"
            quote: "When software needs to use information that was transmitted to it using a mechanism described by this specification, it performs the following steps:"
  - id: "F02"
    name: "cryptosuite-instantiation"
    title: "Obtaining a cryptosuite instance"
    locator: "§3, §2.1"
    kind_of_flow: "local-processing"
    run_by:
      - "proof-creator"
      - "verifier"
    normative_status: "normative"
    summary: >-
      A cryptosuite specification defines an instantiation algorithm from options to an instance; the
      instance offers createProof and verifyProof. How an instance reaches an algorithm is left to the
      implementation; how a verifier picks the instance for a given proof is not stated.
    quotes:
      - source_lines: "L490"
        quote: "Often, just the cryptographic suite name (such as eddsa-rdfc-2022) is required from developers to initiate the creation of a proof. These cryptographic suites are often created and reviewed by people that have the requisite cryptographic training to ensure that safe combinations of cryptographic primitives are used. This section specifies the requirements for authoring cryptographic suite specifications."
    steps:
      - seq: "1"
        locator: "§3 ¶23"
        from: "proof-creator"
        to: "vc-extensions"
        action: >-
          Optionally discover a known instantiation algorithm in the VC Extensions document, where it
          should be listed.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L512"
            quote: "Implementations MAY use the Verifiable Credential Extensions document to discover known cryptosuite instantiation algorithms."
          - source_lines: "L498"
            quote: "This algorithm SHOULD be listed in the Verifiable Credential Extensions document."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0044"
          - "w3c-vc-data-integrity-1-0#R-0050"
      - seq: "2"
        locator: "§3 ¶9"
        from: "proof-creator"
        to: "cryptosuite-specification"
        message: "options (map)"
        returns: "cryptosuite instance (struct)"
        action: >-
          Run the instantiation algorithm the cryptosuite specification defines, with a map of options,
          getting a cryptosuite instance.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        note: >-
          The source never says what the options hold; §3 ¶1 says a suite name is often all a developer
          supplies.
        quotes:
          - source_lines: "L498"
            quote: "The specification MUST define a data integrity cryptographic suite instantiation algorithm that accepts a set of options (map options) and returns a cryptosuite instance (struct cryptosuite)."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0043"
      - seq: "3"
        locator: "§3 ¶23"
        from: "cryptosuite-specification"
        to: "conforming-processor"
        action: >-
          The instance is made available to the §4 algorithms by implementation-specific means.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L512"
            quote: "A cryptosuite instance is instantiated using a cryptosuite instantiation algorithm and is made available to algorithms in an implementation-specific manner."
      - seq: "4"
        locator: "§2.1 ¶12 (cryptosuite)"
        from: "verifier"
        to: "conforming-processor"
        action: >-
          A verifier selects the instance matching the proof it is about to check, presumably by
          proof.type and proof.cryptosuite.
        kind: "inferred"
        inferred_reason: >-
          §4.4 takes a cryptosuite instance as input and never checks it against the proof; §2.1 only says
          the cryptosuite identifier can be used to verify the proof.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L213"
            quote: "An identifier for the cryptographic suite that can be used to verify the proof."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0093"
          - "w3c-vc-data-integrity-1-0#R-0235"
      - seq: "5"
        locator: "§3 ¶11 (createProof)"
        from: "cryptosuite-instance"
        to: "conforming-processor"
        message: "inputDocument (map), options (map)"
        returns: "data integrity proof (map) or error"
        action: >-
          createProof: input document and proof options in, a data integrity proof or an error out.
        kind: "stated"
        on_error: >-
          An error is a possible output of createProof; §4.2 step 1 says what the caller does with it.
        on_error_basis: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L500"
            quote: "An algorithm that takes an input document (map inputDocument) and proof options (map options) as input, and produces a data integrity proof (map) or an error."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0155"
      - seq: "6"
        locator: "§3 ¶13 (verifyProof)"
        from: "cryptosuite-instance"
        to: "conforming-processor"
        message: "securedDocument (map)"
        returns: "cryptosuite verification result or error"
        action: >-
          verifyProof: secured data document in, a cryptosuite verification result (verified,
          verifiedDocument) or an error out. An error means verification did not complete, not that it
          failed; a later attempt may succeed.
        kind: "stated"
        on_error: >-
          Error output means the process did not complete, and a retry may succeed; §4.4 step 8 does not
          say what the caller does with it (F08 seq 9).
        on_error_basis: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L502"
            quote: "An algorithm that takes a secured data document (map securedDocument) as input, and produces a cryptosuite verification result or an error. The cryptosuite verification result is a struct that contains the following items:"
          - source_lines: "L504"
            quote: "A boolean that is true if the verification succeeded, or false otherwise."
          - source_lines: "L506"
            quote: "A map that represents the secured data document with the verified proofs removed if verified is true, or null otherwise."
          - source_lines: "L507"
            quote: "The structure MAY contain other implementation-specific information that is useful for developers, such as debugging information."
          - source_lines: "L507"
            quote: "If an error is produced, the verification process failed to complete. An error, such as a network error, does not mean that a future attempt at verification would fail."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0045"
          - "w3c-vc-data-integrity-1-0#R-0156"
          - "w3c-vc-data-integrity-1-0#R-0157"
          - "w3c-vc-data-integrity-1-0#R-0158"
          - "w3c-vc-data-integrity-1-0#R-0159"
          - "w3c-vc-data-integrity-1-0#R-0160"
  - id: "F03"
    name: "context-injection"
    title: "Context injection when securing"
    locator: "§2.4.2, §4.2"
    kind_of_flow: "local-processing"
    run_by:
      - "proof-creator"
    normative_status: "normative"
    summary: >-
      Before a proof is created the securing implementation makes sure the Data Integrity terms are
      mapped, or deliberately omits @context and with it any extension.
    steps:
      - seq: "1"
        locator: "§2.4.2 ¶2"
        from: "proof-creator"
        to: "proof-creator"
        action: >-
          If @context is absent or does not map the Data Integrity terms, inject or append the Data
          Integrity v2 context or one with at least the same declarations.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L445"
            quote: "When an application is securing a document, if an @context property is not provided in the document or the Data Integrity terms used in the document are not mapped by existing values in the @context property, implementations SHOULD inject or append an @context property with a value of https://w3id.org/security/data-integrity/v2 or one or more contexts with at least the same declarations, such as the Verifiable Credential Data Model v2.0 context (https://www.w3.org/ns/credentials/v2)."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0032"
      - seq: "2"
        locator: "§2.4.2 ¶3"
        from: "proof-creator"
        to: "proof-creator"
        action: >-
          Without JSON-LD processing, the top-level @context may be left out; extensions are then
          forbidden.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L446"
            quote: "Implementations that do not intend to use JSON-LD processing MAY choose to not include an @context declaration at the top-level of the document. However, if an @context declaration is not included, extensions (such as the addition of new properties) related to this specification or corresponding cryptosuites MUST NOT be made."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0033"
          - "w3c-vc-data-integrity-1-0#R-0034"
      - seq: "3"
        locator: "§4.2 ¶2"
        from: "proof-creator"
        to: "conforming-processor"
        action: >-
          Hand the document to Add Proof; the injected context must be in place before createProof
          transforms the document.
        kind: "inferred"
        inferred_reason: >-
          §2.4.2 says when securing but not at which step; anything added after createProof would not be
          covered by the proof, so it has to precede §4.2 step 1.
        calls:
          - "F04"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L550"
            quote: "Let proof be the result of calling the createProof algorithm specified in cryptosuite.createProof with inputDocument and options passed as a parameters."
  - id: "F04"
    name: "add-proof"
    title: "Add Proof"
    locator: "§4.2"
    kind_of_flow: "local-processing"
    run_by:
      - "proof-creator"
    normative_status: "normative"
    summary: >-
      Calls createProof, checks the proof carries the three required properties and the requested
      domain and challenge, and attaches it as the document's proof.
    inputs: "input document (map inputDocument), cryptosuite instance (struct cryptosuite), options (map)"
    outputs: "secured data document (map) or an error"
    steps:
      - seq: "0"
        locator: "§4.2 ¶1"
        from: "proof-creator"
        to: "conforming-processor"
        message: "inputDocument (map), cryptosuite (struct), options (map)"
        action: "Invoke Add Proof with the input document, a cryptosuite instance and options."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L549"
            quote: "Required inputs are an input document (map inputDocument), a cryptosuite instance (struct cryptosuite), and a set of options (map options)."
          - source_lines: "L549"
            quote: "Output is a secured data document (map) or an error."
          - source_lines: "L549"
            quote: "Whenever this algorithm encodes strings, it MUST use UTF-8 encoding."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0057"
          - "w3c-vc-data-integrity-1-0#R-0178"
      - seq: "1"
        step: "1"
        locator: "§4.2 step 1"
        from: "conforming-processor"
        to: "cryptosuite-instance"
        message: "inputDocument, options"
        returns: "proof (map) or error"
        action: "Call cryptosuite.createProof with inputDocument and options."
        kind: "stated"
        on_error: >-
          The cryptosuite's error is propagated, conveying its type; this algorithm ends with an error
          output.
        on_error_basis: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L550"
            quote: "Let proof be the result of calling the createProof algorithm specified in cryptosuite.createProof with inputDocument and options passed as a parameters. If the algorithm produces an error, the error MUST be propagated and SHOULD convey the error type."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0179"
          - "w3c-vc-data-integrity-1-0#R-0180"
          - "w3c-vc-data-integrity-1-0#R-0181"
          - "w3c-vc-data-integrity-1-0#R-0288"
      - seq: "2"
        step: "2"
        locator: "§4.2 step 2"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "Check proof.type, proof.verificationMethod and proof.proofPurpose are all set."
        kind: "stated"
        error_code: "PROOF_GENERATION_ERROR"
        on_error: "Raise an error, conveying PROOF_GENERATION_ERROR; output is an error."
        on_error_basis: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L551"
            quote: "If one or more of the proof.type, proof.verificationMethod, and proof.proofPurpose values is not set, an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0182"
          - "w3c-vc-data-integrity-1-0#R-0183"
          - "w3c-vc-data-integrity-1-0#R-0090"
      - seq: "3"
        step: "3"
        locator: "§4.2 step 3"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "If options.domain is non-null, require proof.domain to equal it."
        kind: "stated"
        error_code: "PROOF_GENERATION_ERROR"
        on_error: "Raise an error, conveying PROOF_GENERATION_ERROR."
        on_error_basis: "stated"
        normative_status: "normative"
        note: >-
          Equality between a domain that may be a string or a set of strings is not defined (D-20). The
          check implies createProof copies options.domain into the proof.
        quotes:
          - source_lines: "L552"
            quote: "If options has a non-null domain item, it MUST be equal to proof.domain or an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0184"
          - "w3c-vc-data-integrity-1-0#R-0185"
          - "w3c-vc-data-integrity-1-0#R-0188"
      - seq: "4"
        step: "4"
        locator: "§4.2 step 4"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "If options.challenge is non-null, require proof.challenge to equal it."
        kind: "stated"
        error_code: "PROOF_GENERATION_ERROR"
        on_error: "Raise an error, conveying PROOF_GENERATION_ERROR."
        on_error_basis: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L553"
            quote: "If options has a non-null challenge item, it MUST be equal to proof.challenge or an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0186"
          - "w3c-vc-data-integrity-1-0#R-0187"
          - "w3c-vc-data-integrity-1-0#R-0188"
      - seq: "5"
        step: "5"
        locator: "§4.2 step 5"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "Copy inputDocument to securedDataDocument."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L554"
            quote: "Let securedDataDocument be a copy of inputDocument."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0189"
      - seq: "6"
        step: "6"
        locator: "§4.2 step 6"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          Set securedDataDocument.proof to the proof. Any proof the input document already carried is
          replaced, not kept.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        defects:
          - "D-13"
        quotes:
          - source_lines: "L555"
            quote: "Set securedDataDocument.proof to the value of proof."
          - source_lines: "L531"
            quote: "An input document is an map that has not yet had the current proof added to it, but it MAY contain a proof value that was added to it by a previous process."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0055"
          - "w3c-vc-data-integrity-1-0#R-0190"
          - "w3c-vc-data-integrity-1-0#R-0191"
      - seq: "7"
        step: "7"
        locator: "§4.2 step 7"
        from: "conforming-processor"
        to: "proof-creator"
        message: "secured data document (map)"
        action: "Return the secured data document."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L556"
            quote: "Return securedDataDocument as the secured data document."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0192"
  - id: "F05"
    name: "add-proof-set-chain"
    title: "Add Proof Set/Chain"
    locator: "§4.3"
    kind_of_flow: "local-processing"
    run_by:
      - "proof-creator"
    normative_status: "normative"
    summary: >-
      Adds one proof to an existing proof or set. With options.previousProof the new proof is computed
      over the document plus the named earlier proofs (a chain link); without it, over the document
      plus an empty proof list (a set member). The result's proof is always a list.
    inputs: "secured data document (map securedDocument), cryptosuite instance suite, options (map)"
    outputs: "new secured data document (map)"
    steps:
      - seq: "0"
        locator: "§4.3 ¶1"
        from: "proof-creator"
        to: "conforming-processor"
        message: "securedDocument (map), suite (cryptosuite instance), options (map)"
        action: "Invoke with a secured data document, a cryptosuite instance and options."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        defects:
          - "D-12"
        quotes:
          - source_lines: "L560"
            quote: "Required inputs are a secured data document (map securedDocument), a cryptographic suite (cryptosuite instance suite), and a set of options (map options)."
          - source_lines: "L560"
            quote: "Output is a new secured data document (map)."
          - source_lines: "L560"
            quote: "Whenever this algorithm encodes strings, it MUST use UTF-8 encoding."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0062"
          - "w3c-vc-data-integrity-1-0#R-0193"
      - seq: "1"
        step: "1"
        locator: "§4.3 step 1"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          Collect allProofs: copy each element if securedDocument.proof is a list, or a copy of it if it
          is an object.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        note: >-
          A securedDocument with no proof, or a proof that is neither, is not handled; allProofs then
          stays empty.
        quotes:
          - source_lines: "L561"
            quote: "Let proof be set to securedDocument.proof. Let allProofs be an empty list. If proof is a list, copy all the elements of proof to allProofs. If proof is an object add a copy of that object to allProofs."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0194"
      - seq: "2"
        step: "2"
        locator: "§4.3 step 2"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "inputDocument = securedDocument without proof; output = a copy of inputDocument."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L562"
            quote: "Let the inputDocument be a copy of the securedDocument with the proof attribute removed. Let output be a copy of the inputDocument."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0195"
      - seq: "3"
        step: "3"
        locator: "§4.3 step 3"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "matchingProofs = empty list."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L563"
            quote: "Let matchingProofs be an empty list."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0196"
      - seq: "4"
        step: "4"
        locator: "§4.3 step 4"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          If options.previousProof is a string, add the proof with that id to matchingProofs.
        kind: "stated"
        error_code: "PROOF_GENERATION_ERROR"
        on_error: "No proof with that id: raise an error, conveying PROOF_GENERATION_ERROR."
        on_error_basis: "stated"
        normative_status: "normative"
        defects:
          - "D-19"
        quotes:
          - source_lines: "L564"
            quote: "If options has a previousProof item that is a string, add the element from allProofs with an id attribute matching previousProof to matchingProofs. If a proof with id equal to previousProof does not exist in allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0197"
          - "w3c-vc-data-integrity-1-0#R-0199"
          - "w3c-vc-data-integrity-1-0#R-0200"
          - "w3c-vc-data-integrity-1-0#R-0198"
      - seq: "5"
        step: "5"
        locator: "§4.3 step 5"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "If options.previousProof is an array, add every proof whose id is listed."
        kind: "stated"
        error_code: "PROOF_GENERATION_ERROR"
        on_error: >-
          A listed value matching no proof id: raise an error, conveying PROOF_GENERATION_ERROR.
        on_error_basis: "stated"
        normative_status: "normative"
        defects:
          - "D-10"
          - "D-19"
        quotes:
          - source_lines: "L565"
            quote: "If options has a previousProof item that is an array, add each element from allProofs with an id attribute that matches an element of that array. If any element of previousProof list has an id attribute that does not match the id attribute of any element of allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0201"
          - "w3c-vc-data-integrity-1-0#R-0202"
          - "w3c-vc-data-integrity-1-0#R-0203"
      - seq: "6"
        step: "6"
        locator: "§4.3 step 6"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          Set inputDocument.proof to matchingProofs, binding the earlier proofs into what the new proof
          covers.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        note: >-
          The second quote is from a note, which §1.3 makes non-normative. With no previousProof the list
          is empty and inputDocument carries an empty proof list rather than none (D-03).
        quotes:
          - source_lines: "L566"
            quote: "Set inputDocument.proof to matchingProofs."
          - source_lines: "L568"
            quote: "This step adds references to the named graphs, as well as adding a copy of all the claims contained in the proof graphs. The step is critical, as it binds any matching proofs to the document prior to applying the current proof."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0204"
          - "w3c-vc-data-integrity-1-0#R-0290"
      - seq: "7"
        step: "7"
        locator: "§4.3 step 7"
        from: "conforming-processor"
        to: "conforming-processor"
        action: >-
          Run §4.2 steps 1-6 with inputDocument, suite and options; append the generated proof to
          allProofs.
        kind: "stated"
        calls:
          - "F04"
        on_error: "Any exception from §4.2 steps 1-6 is raised again."
        on_error_basis: "stated"
        normative_status: "normative"
        defects:
          - "D-11"
        quotes:
          - source_lines: "L569"
            quote: "Run steps 1 through 6 of the algorithm in section 4.2 Add Proof, passing inputDocument, suite, and options. If no exceptions are raised, append the generated proof value to the allProofs; otherwise, raise the exception."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0205"
          - "w3c-vc-data-integrity-1-0#R-0206"
      - seq: "8"
        step: "8"
        locator: "§4.3 step 8"
        from: "conforming-processor"
        to: "conforming-processor"
        action: "Set output.proof to allProofs."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L570"
            quote: "Set output.proof to the value of allProofs."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0207"
      - seq: "9"
        step: "9"
        locator: "§4.3 step 9"
        from: "conforming-processor"
        to: "proof-creator"
        message: "secured data document (map)"
        action: "Return output."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L571"
            quote: "Return output as the new secured data document."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0208"
  - id: "F06"
    name: "json-ld-transformation-guard"
    title: "Lossless JSON-LD transformation"
    locator: "§2.4.3, §5.6"
    kind_of_flow: "local-processing"
    run_by:
      - "proof-creator"
      - "verifier"
    normative_status: "normative"
    summary: >-
      Applies wherever an implementation runs JSON-LD processing (RDF canonicalization) inside
      createProof or verifyProof: dropped data is an error, the base URL is null, poisoned datasets
      halt.
    note: >-
      The source does not say whether these run in the conforming processor or in the cryptosuite
      instance; the cryptosuite does the transformation (§1.1, §5.7), so they are placed there,
      inferred.
    quotes:
      - source_lines: "L451"
        quote: "This specification requires that any recoverable loss of data when performing JSON-LD transformations result in an error, to avoid a mismatch in the security expectations of developers."
    steps:
      - seq: "1"
        locator: "§2.4.3 ¶3"
        from: "cryptosuite-instance"
        to: "cryptosuite-instance"
        action: "Throw an error when the JSON-LD processor drops data, such as an undefined term."
        kind: "stated"
        error_code: "DATA_LOSS_DETECTION_ERROR"
        on_error: >-
          Throw an error, preferably DATA_LOSS_DETECTION_ERROR; the code is not in §4.7 (D-09).
        on_error_basis: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L452"
            quote: "Implementations that use JSON-LD processing, such as RDF Dataset Canonicalization [RDF-CANON], MUST throw an error, which SHOULD be DATA_LOSS_DETECTION_ERROR, when data is dropped by a JSON-LD processor, such as when an undefined term is detected in an input document."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0141"
          - "w3c-vc-data-integrity-1-0#R-0142"
      - seq: "2"
        locator: "§2.4.3 ¶4"
        from: "cryptosuite-instance"
        to: "cryptosuite-instance"
        action: "Set the base URL to null when deserializing to RDF."
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L453"
            quote: "When deserializing to RDF, implementations MUST ensure that the base URL is set to null."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0036"
          - "w3c-vc-data-integrity-1-0#R-0144"
      - seq: "3"
        locator: "§5.6 ¶4"
        from: "cryptosuite-instance"
        to: "cryptosuite-instance"
        action: "A canonicalizer detects a poisoned dataset and halts."
        kind: "stated"
        on_error: >-
          Processing halts; the source names no error type. PROOF_TRANSFORMATION_ERROR is the only §4.7
          code for the transformation process, but nothing links the two.
        on_error_basis: "inferred"
        normative_status: "normative"
        quotes:
          - source_lines: "L727"
            quote: "This class of attack is called dataset poisoning, and all modern RDF Dataset canonicalizers are required to detect these sorts of bad inputs and halt processing."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0279"
  - id: "F07"
    name: "receive-processing-model"
    title: "Processing model, receiving side"
    locator: "§4.1, §5.7"
    kind_of_flow: "receive-processing"
    run_by:
      - "verifier"
    normative_status: "normative"
    summary: >-
      Transform, validate against a schema, verify, validate contexts, then act only on what the
      library returned as verified.
    quotes:
      - source_lines: "L541"
        quote: "When software needs to use information that was transmitted to it using a mechanism described by this specification, it performs the following steps:"
    steps:
      - seq: "1"
        step: "1"
        locator: "§4.1 second list step 1"
        from: "verifier"
        to: "verifier"
        action: >-
          Transform the incoming data into the form §4.4 (bytes and media type) or §4.5 (a map) accepts.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        quotes:
          - source_lines: "L542"
            quote: "The software transforms the incoming data into a document that can be understood by the applicable algorithm provided in Section 4.4 Verify Proof or Section 4.5 Verify Proof Sets and Chains."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0174"
      - seq: "2"
        step: "2"
        locator: "§4.1 second list step 2"
        from: "verifier"
        to: "verifier"
        action: >-
          Validate the document against the schema the application expects (JSON Schema or equivalent).
        kind: "stated"
        on_error: >-
          The source states no outcome for a schema failure. Reading: reject; §1.3's error obligation
          reaches it only where the failure makes the document non-conforming.
        on_error_basis: "inferred"
        normative_status: "normative"
        quotes:
          - source_lines: "L543"
            quote: "The software uses JSON Schema or an equivalent mechanism to validate that the incoming document follows an expected schema used by the application."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0175"
      - seq: "3"
        step: "3"
        locator: "§4.1 second list step 3"
        from: "verifier"
        to: "conforming-processor"
        action: "Verify: §4.4 for a single proof object, §4.5 for a list."
        kind: "stated"
        calls:
          - "F08"
          - "F09"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        note: >-
          The choice is inferred from §4.4 step 2, which rejects a proof that is not a map, and §4.5's
          opening, which assumes a list.
        quotes:
          - source_lines: "L544"
            quote: "The software uses the applicable algorithm(s) provided in Section 4.4 Verify Proof or Section 4.5 Verify Proof Sets and Chains to verify the integrity of the incoming document."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0176"
          - "w3c-vc-data-integrity-1-0#R-0222"
      - seq: "4"
        step: "4"
        locator: "§4.1 second list step 4"
        from: "verifier"
        to: "conforming-processor"
        action: >-
          For JSON-LD, validate every context with §4.6 or an equivalent, after verification.
        kind: "stated"
        calls:
          - "F10"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        defects:
          - "D-17"
        quotes:
          - source_lines: "L545"
            quote: "If the document is a JSON-LD document, the software uses the algorithm provided in Section 4.6 Context Validation, or one providing equivalent protections, to validate all JSON-LD Context values used in the document."
          - source_lines: "L435"
            quote: "Context validation MUST be run after running the applicable algorithm in either Section 4.4 Verify Proof or Section 4.5 Verify Proof Sets and Chains."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0030"
          - "w3c-vc-data-integrity-1-0#R-0177"
      - seq: "5"
        locator: "§5.7 ¶4"
        from: "verifier"
        to: "verifier"
        action: >-
          Act only on the document returned as verified (and validated), never on the input.
        kind: "stated"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        normative_status: "normative"
        note: "Stated as urging, without a keyword."
        quotes:
          - source_lines: "L734"
            quote: "Implementers and developers are urged to not trust information that contains a data integrity proof unless the proof has been verified and the verified data is provided in a return value from a software library that has confirmed that all data returned has been successfully protected."
