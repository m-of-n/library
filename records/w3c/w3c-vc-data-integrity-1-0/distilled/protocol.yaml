error_semantics:
  - where: "§4.4"
    meaning: >-
      Raising an error returns a verification result with verified false and a non-empty errors list;
      it is a value, not an exception.
    quotes:
      - source_lines: "L599"
        quote: "When a step says \"an error MUST be raised\", it means that a verification result MUST be returned with a verified value of false and a non-empty errors list."
  - where: "§4.2"
    meaning: "The output is a secured data document or an error."
    quotes:
      - source_lines: "L549"
        quote: "Output is a secured data document (map) or an error."
  - where: "§4.3"
    meaning: >-
      Errors raised in steps 4, 5 and 7, but the output clause names no error (D-12); step 7
      re-raises.
    quotes:
      - source_lines: "L569"
        quote: "If no exceptions are raised, append the generated proof value to the allProofs; otherwise, raise the exception."
  - where: "§4.5"
    meaning: >-
      No definition of its own; step 3.4 speaks of exceptions, which §4.4's definition does not
      produce (D-04).
    quotes:
      - source_lines: "L628"
        quote: "Run steps 4 through 8 of the algorithm in section 4.4 Verify Proof on inputDocument; if no exceptions are raised, append cryptosuiteVerificationResult to verificationResults."
  - where: "§4.6"
    meaning: "Errors accumulate in result.errors; any error makes validated false."
    quotes:
      - source_lines: "L655"
        quote: "If result.errors is empty, set result.validated to true; otherwise, set result.validated to false, and remove the document property from result."
  - where: "§3"
    meaning: >-
      A cryptosuite error means the process did not complete and is not a negative verdict; a retry
      may succeed.
    quotes:
      - source_lines: "L507"
        quote: "If an error is produced, the verification process failed to complete. An error, such as a network error, does not mean that a future attempt at verification would fail."
  - where: "Appendix B"
    meaning: "Numeric error codes were removed before REC (non-normative history)."
    quotes:
      - source_lines: "L946"
        quote: "Remove numerical error codes since implementations were not using them."
source_defects:
  - id: "D-01"
    locator: "§4.5 step 5; §4.5 step 6.1; §4.5 step 7"
    kind: "source defect"
    what: >-
      The combined result is initialised with status, the failure branch sets verified, and step 7
      tests status. Nothing ever sets status to false, so step 7 never fires and a failed proof leaves
      status true beside verified false.
    consequence: >-
      An implementation reading status accepts a chain with a failing proof; one reading verified gets
      a document from the last successful proof even when another failed, because step 7 does not null
      it.
    quotes:
      - source_lines: "L630"
        quote: "Let combinedVerificationResult be an empty struct. Set combinedVerificationResult.status to true, combinedVerificationResult.document to null, and combinedVerificationResult.mediaType to null."
      - source_lines: "L632"
        quote: "If cryptosuiteVerificationResult.verified is false, set combinedVerificationResult.verified to false."
      - source_lines: "L634"
        quote: "If combinedVerificationResult.status is false, set combinedVerificationResult.document to null and combinedVerificationResult.mediaType to null."
  - id: "D-02"
    locator: "§4.5 step 6.2; §3 ¶13 (verifyProof)"
    kind: "source defect"
    what: >-
      Reads mediaType from a cryptosuite verification result, which §3 defines with verified and
      verifiedDocument only; §4.5 takes no mediaType input either.
    quotes:
      - source_lines: "L633"
        quote: "Otherwise, set combinedVerificationResult.document to cryptosuiteVerificationResult.verifiedDocument, set combinedVerificationResult.mediaType to cryptosuiteVerificationResult.mediaType, and append cryptosuiteVerificationResult to successfulVerificationResults."
      - source_lines: "L502"
        quote: "The cryptosuite verification result is a struct that contains the following items:"
  - id: "D-03"
    locator: "§4.5 step 3.3; §4.5 step 3.4; §4.4 step 8; §4 ¶1"
    kind: "source defect"
    what: >-
      Steps 4-8 of §4.4 are run on inputDocument, whose proof is matchingProofs: the proof under
      iteration is never placed in it, so step 8 hands verifyProof a document carrying only the
      earlier proofs, or an empty proof list for a proof with no previousProof, which §4 does not call
      a secured data document. The same steps read cryptosuite, expectedProofPurpose, domain and
      challenge, none of which §4.5 takes.
    consequence: >-
      Not implementable as printed. An implementation must pass the current proof separately (or as
      the document's proof, with matchingProofs bound alongside) and choose a cryptosuite per proof;
      both are inferred repairs.
    quotes:
      - source_lines: "L625"
        quote: "Let inputDocument be a copy of securedDocument with the proof value removed and then set inputDocument.proof to matchingProofs."
      - source_lines: "L628"
        quote: "Run steps 4 through 8 of the algorithm in section 4.4 Verify Proof on inputDocument; if no exceptions are raised, append cryptosuiteVerificationResult to verificationResults."
      - source_lines: "L607"
        quote: "Let cryptosuiteVerificationResult be the result of running the cryptosuite.verifyProof algorithm with securedDocument provided as input."
      - source_lines: "L531"
        quote: "A secured data document is a map that contains one or more proof values."
  - id: "D-04"
    locator: "§4.4 ¶25; §4.5 step 3.4"
    kind: "source defect"
    what: >-
      §4.4 defines raising an error as returning a result; §4.5 step 3.4 appends a result only if no
      exception is raised and says nothing otherwise. A proof that fails steps 4-7, or whose
      previousProof does not resolve, contributes nothing to verificationResults.
    consequence: >-
      Fail-open reading: the combined result can be true while a proof failed its checks.
    quotes:
      - source_lines: "L599"
        quote: "When a step says \"an error MUST be raised\", it means that a verification result MUST be returned with a verified value of false and a non-empty errors list."
      - source_lines: "L628"
        quote: "Run steps 4 through 8 of the algorithm in section 4.4 Verify Proof on inputDocument; if no exceptions are raised, append cryptosuiteVerificationResult to verificationResults."
  - id: "D-05"
    locator: "§4.5 step 1; §4.3 step 1"
    kind: "gap"
    what: >-
      Assumes securedDocument.proof is a list; a single proof object is not handled (§4.3 step 1
      handles both).
    quotes:
      - source_lines: "L620"
        quote: "Set allProofs to securedDocument.proof."
      - source_lines: "L561"
        quote: "If proof is a list, copy all the elements of proof to allProofs. If proof is an object add a copy of that object to allProofs."
  - id: "D-06"
    locator: "§4.4 ¶20 (mediaType); §4.4 step 9"
    kind: "source defect"
    what: >-
      The result definition says verifiedDocument and mediaType are null when verified is false; step
      9 copies the input mediaType unconditionally.
    quotes:
      - source_lines: "L594"
        quote: "Null, if verified is false; otherwise, a media type, which MAY include parameters"
      - source_lines: "L614"
        quote: "mediaType"
  - id: "D-07"
    locator: "§4.6 step 4; §4.6 ¶6 (validatedDocument)"
    kind: "source defect"
    what: >-
      Removes a document property that the result does not have; its item is validatedDocument, which
      the definition says is null, not absent, when validated is false.
    quotes:
      - source_lines: "L655"
        quote: "If result.errors is empty, set result.validated to true; otherwise, set result.validated to false, and remove the document property from result."
      - source_lines: "L644"
        quote: "Null, if validated is false; otherwise, an input document"
  - id: "D-08"
    locator: "§4.6 step 1"
    kind: "source defect"
    what: "compactionContext is initialised and never used."
    quotes:
      - source_lines: "L650"
        quote: "Set result.validated to false, result.warnings to an empty list, result.errors to an empty list, compactionContext to an empty list; and clone inputDocument to result.validatedDocument."
  - id: "D-09"
    locator: "§4.7 ¶3; §4.4 step 2; §2.4.3 ¶3"
    kind: "source defect"
    what: >-
      PARSING_ERROR and DATA_LOSS_DETECTION_ERROR are conveyed by normative steps but not listed in
      §4.7, so §4.7's type-URL rule yields no URL for them; PARSING_ERROR's link points into the VC
      Data Model instead. PROOF_TRANSFORMATION_ERROR is listed and raised by nothing here.
    quotes:
      - source_lines: "L663"
        quote: "The type value of the error object MUST be a URL that starts with the value https://w3id.org/security# and ends with the value in the section listed below."
      - source_lines: "L601"
        quote: "If either securedDocument is not a map or securedDocument.proof is not a map, an error MUST be raised and SHOULD convey an error type of PARSING_ERROR."
      - source_lines: "L452"
        quote: "Implementations that use JSON-LD processing, such as RDF Dataset Canonicalization [RDF-CANON], MUST throw an error, which SHOULD be DATA_LOSS_DETECTION_ERROR, when data is dropped by a JSON-LD processor, such as when an undefined term is detected in an input document."
  - id: "D-10"
    locator: "§4.3 step 5; §4.5 step 3.2"
    kind: "wording"
    what: >-
      Both algorithms speak of an element of the previousProof list having an id attribute; the
      elements are strings. Read as: a listed value that matches no proof's id.
    quotes:
      - source_lines: "L565"
        quote: "If any element of previousProof list has an id attribute that does not match the id attribute of any element of allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
      - source_lines: "L624"
        quote: "If any element of previousProof list has an id attribute value that does not match the id attribute value of any element of allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_VERIFICATION_ERROR."
  - id: "D-11"
    locator: "§4.3 step 7; Appendix B ¶11"
    kind: "gap"
    what: >-
      Nothing in this document sets the new proof's previousProof from options.previousProof; only the
      non-normative history says additional proof options end up in the generated proof. If
      createProof does not copy it, the proof is signed over the earlier proofs but names none; under
      any repair of D-03, §4.5 then verifies it over an empty list and it fails (closed).
    quotes:
      - source_lines: "L569"
        quote: "Run steps 1 through 6 of the algorithm in section 4.2 Add Proof, passing inputDocument, suite, and options. If no exceptions are raised, append the generated proof value to the allProofs; otherwise, raise the exception."
      - source_lines: "L952"
        quote: "Ensure that the created proof option is not required and additional proof options are included in the generated proof."
  - id: "D-12"
    locator: "§4.3 ¶1"
    kind: "wording"
    what: >-
      The output clause names only a secured data document, though steps 4, 5 and 7 raise errors.
    quotes:
      - source_lines: "L560"
        quote: "Output is a new secured data document (map)."
  - id: "D-13"
    locator: "§4 ¶1; §4.2 step 6"
    kind: "tension"
    what: >-
      An input document may already carry a proof, and §4.2 step 6 overwrites the proof property,
      dropping it. §4.3 is the algorithm that keeps earlier proofs; nothing says §4.2 must not be used
      on such a document.
    quotes:
      - source_lines: "L531"
        quote: "An input document is an map that has not yet had the current proof added to it, but it MAY contain a proof value that was added to it by a previous process. A secured data document is a map that contains one or more proof values."
      - source_lines: "L555"
        quote: "Set securedDataDocument.proof to the value of proof."
  - id: "D-14"
    locator: "Appendix A ¶16; Appendix A ¶17; §4.3 step 4"
    kind: "tension (non-normative)"
    what: >-
      The prose says the CEO's proof is over the document including both earlier proofs; Example 14
      names only urn:proof-2 in previousProof, and §4.3 binds only the proofs named. The first proof
      is covered transitively, through the second proof's own value, not directly.
    quotes:
      - source_lines: "L916"
        quote: "If verification is successful, the CEO signs, producing a proof over the document which includes urn:proof-1 and urn:proof-2."
      - source_lines: "L933"
        quote: "\"previousProof\": \"urn:proof-2\","
      - source_lines: "L564"
        quote: "If options has a previousProof item that is a string, add the element from allProofs with an id attribute matching previousProof to matchingProofs."
  - id: "D-15"
    locator: "§2.6 ¶3"
    kind: "gap"
    what: >-
      No step of §4.4 or §4.5 checks created or expires, and §4.7 has no code for an expired proof,
      while §2.6 says verifying a proof includes the validity-period check.
    consequence: "An implementation that follows the algorithm exactly accepts an expired proof."
    quotes:
      - source_lines: "L485"
        quote: "When verifying a proof, it is important to ensure that the time of interest (which might be the current time or any other time) is within the validity period for the proof (that is, between created and expires )."
  - id: "D-16"
    locator: "§5.11 ¶1; §2.1 ¶18 (domain); §4.4 step 5"
    kind: "tension"
    what: >-
      Proof purpose validation is called imperative and the domain check a SHOULD for verifiers, but
      §4.4 runs both only when the optional inputs are supplied; omitting them skips the checks
      silently.
    quotes:
      - source_lines: "L759"
        quote: "When an implementation is verifying a proof, it is imperative that it verify that the proof purpose match the intended use."
      - source_lines: "L219"
        quote: "A verifier SHOULD use the value to ensure that the proof was intended to be used in the security domain in which the verifier is operating."
      - source_lines: "L604"
        quote: "If expectedProofPurpose was given, and it does not match proof.proofPurpose, an error MUST be raised and SHOULD convey an error type of PROOF_VERIFICATION_ERROR."
  - id: "D-17"
    locator: "§2.4.1 ¶1; §2.4.1 ¶2"
    kind: "tension"
    what: >-
      Context validation must run after verification, and the next paragraph allows a different
      ordering of the steps with the same protections; whether that relaxes the MUST or only orders
      §4.6's own steps is not said.
    quotes:
      - source_lines: "L435"
        quote: "Context validation MUST be run after running the applicable algorithm in either Section 4.4 Verify Proof or Section 4.5 Verify Proof Sets and Chains."
      - source_lines: "L436"
        quote: "While the algorithm described in Section 4.6 Context Validation provides one way of checking context values, and one optional way of safely processing unknown context values, implementers MAY use alternative approaches, or a different ordering of the steps, that provide the same protections."
  - id: "D-18"
    locator: "§4.4 step 1"
    kind: "gap"
    what: >-
      No failure path for step 1 if the bytes are not JSON; step 2 only tests the parsed value. The
      mediaType input is used only in the returned result.
    quotes:
      - source_lines: "L600"
        quote: "Let securedDocument be the result of running parse JSON bytes to an Infra value on documentBytes."
  - id: "D-19"
    locator: "§2.1 ¶4 (id)"
    kind: "gap"
    what: >-
      Proof ids are never required to be unique, and the steps add the element with a matching id;
      with duplicates, which proof is bound is unspecified.
    quotes:
      - source_lines: "L205"
        quote: "An optional identifier for the proof, which MUST be a URL [URL], such as a UUID as a URN (urn:uuid:6a1676b8-b51f-11ed-937b-d76685a20ff5)."
  - id: "D-20"
    locator: "§4.2 step 3; §4.4 step 6"
    kind: "gap"
    what: >-
      domain may be a string or a set; §4.2 tests equality without defining it for that mix, and §4.4
      compares as sets, so a creator check and a verifier check can disagree.
    quotes:
      - source_lines: "L552"
