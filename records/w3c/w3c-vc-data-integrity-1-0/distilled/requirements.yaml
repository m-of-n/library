  - id: 'w3c-vc-data-integrity-1-0#R-0022'
    locator: '§2.3, ¶2'
    source_lines: '388'
    text: 'To enable confirmation that a resource referenced by a conforming secured document has not changed since the document was secured, an implementer MAY include a property named digestMultibase in any object that includes an id property.'
    verb: 'MAY'
    kind: stated
    actor: 'implementer (producer of the secured document)'
    object: 'integrity of an externally referenced resource'
    field: 'digestMultibase (in any object that has an id)'
    testable: 'no'
    testable_reason: 'a permission. What a consumer does with the value is never stated (SD-27, R-0122).'
    status: active
  - id: 'w3c-vc-data-integrity-1-0#R-0023'
    locator: '§2.3, ¶2'
    source_lines: '388'
    text: 'If present, the digestMultibase value MUST be a single string value, or an list of string values, each of which is a Multibase-encoded Multihash value.'
    verb: 'MUST'
    kind: stated
    actor: 'proof creator (producer of the secured document; the sentence names no actor)'
    object: 'resource digest value'
    field: 'digestMultibase'
    testable: 'yes'
    note: '"an list" is the source''s spelling (SD-E). Multibase and Multihash are defined outside this document ([CID]).'
    status: active
  - id: 'w3c-vc-data-integrity-1-0#R-0122'
    locator: '§2.3 ¶2'
    text: 'A consumer that relies on digestMultibase computes the digest named by the Multihash prefix over the resource it retrieved or holds, compares it with the value, and treats a mismatch as a failed integrity check. This document never states the comparison, which bytes are hashed, or what follows a mismatch.'
    verb: 'none'
    kind: inferred
    actor: 'consumer of a secured document that references external resources'
    object: 'integrity check of a referenced resource'
    field: 'digestMultibase'
    testable: 'partial'
    testable_reason: 'the bytes to hash (as served, after content negotiation, after decoding) are unstated, so two implementations can disagree on a match (SD-27).'
    derived_from:
      - 'w3c-vc-data-integrity-1-0#R-0022'
      - 'w3c-vc-data-integrity-1-0#R-0023'
    note: 'NOT VERBATIM: composed by this extraction; no BCP 14 keyword backs it.'
    status: active
  - id: 'w3c-vc-data-integrity-1-0#R-0123'
    locator: '§2.3, ¶3'
    source_lines: '389'
    text: 'JSON-LD context authors are expected to add digestMultibase to contexts that will be used in documents that refer to other resources and to include an associated cryptographic digest.'
    verb: 'none'
    kind: stated
    actor: 'JSON-LD context author'
    object: 'digestMultibase term in contexts'
    field: 'digestMultibase'
    testable: 'partial'
    testable_reason: 'a soft obligation ("are expected to"), no keyword; checkable on a context file (a digestMultibase term definition). "and to include an associated cryptographic digest" does not say where the digest goes; read as: in the documents that use the context.'
    status: active
