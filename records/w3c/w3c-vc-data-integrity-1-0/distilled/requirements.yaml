    object: 'merging of objects without global identifiers'
    field: 'id'
    testable: 'partial'
    testable_reason: 'observable only where an implementation merges data from two documents.'
    candidate: 'C-0037'
    note: '"as without these, is not possible" lacks a subject in the source (SD-E); not healed.'
    status: active
