  - id: 'w3c-vc-data-integrity-1-0#R-0115'
    locator: '§2.1.3, ¶2'
    source_lines: '366'
    text: 'To ensure that information from different data integrity proofs is not accidentally co-mingled, the concept of a proof graph is used to encapsulate each data integrity proof. Each value associated with the proof property of the document identifies a separate graph, which is sometimes referred to as a named graph, of type ProofGraph, which contains a single data integrity proof.'
    verb: 'none'
    kind: stated
    actor: 'JSON-LD/RDF processor of a secured document'
    object: 'proof graphs'
    field: 'proof (each value a ProofGraph)'
    testable: 'yes'
    candidate: 'C-0034, C-0035'
    note: 'One proof per named graph, so proofs are never merged into one graph.'
    status: active
