    locator: '§2.1.3, ¶3'
    source_lines: '367'
    text: 'It is important to not merge objects that seem to have similar properties, when those objects do not have an id property and/or use a global identifier type such as a URL, as without these, is not possible to tell whether two such objects are expressing information about the same entity.'
