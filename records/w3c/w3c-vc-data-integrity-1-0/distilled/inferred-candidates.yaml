  - id: 'C-0113'
    locator: '§5.2'
    source_lines: '691'
    cue: 'ensure'
    text: 'Modern cryptographic algorithms provide a number of tunable parameters and options to ensure that the algorithms can meet the varied requirements of different use cases.'
