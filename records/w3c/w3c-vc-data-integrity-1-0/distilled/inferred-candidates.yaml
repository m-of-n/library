  - id: 'C-0118'
    locator: '§5.2'
    source_lines: '696'
    cue: 'ensure'
    text: 'Cryptographic specification authors are advised to, if possible, further minimize the number of options and parameters to as few as possible to ensure cryptographic agility while also keeping the auditable security attack surface for downstream software libraries to a minimum.'
    verdict: reject
    reason: 'advisory ("are advised to", "is to be discouraged"): guidance to designers and library implementers, deliberately without keywords.'
  - id: 'C-0119'
    locator: '§5.2'
    source_lines: '697'
    cue: 'can be'
