  - id: 'C-0120'
    locator: '§5.2'
    source_lines: '698'
    cue: 'only'
    text: 'Cryptographic library implementers can provide deprecated and experimental cryptographic functionality, but are advised to only do so when explicitly requested by the developer, such as through a library option, and such that the library produces warnings that deprecated or experimental cryptography has been enabled for the application.'
