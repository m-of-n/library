    reason: 'advisory ("are advised to", "is to be discouraged"): guidance to designers and library implementers, deliberately without keywords.'
  - id: 'C-0121'
    locator: '§5.2'
    source_lines: '700'
    cue: 'ensure'
    text: 'The guidance above is meant to ensure that useful cryptographic options and parameters are provided at the lower layers of the architecture while not exposing those options and parameters to application developers who may not fully understand the balancing benefits and drawbacks of each option.'
