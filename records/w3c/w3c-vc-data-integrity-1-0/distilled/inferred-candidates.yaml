  - id: 'C-0110'
    locator: '§5.1'
    source_lines: '686'
    cue: 'require'
    text: 'The drawback of this approach is that its not clear if an upgrade is necessary, as software version number increases often don''t require an upgrade for the software to continue functioning.'
