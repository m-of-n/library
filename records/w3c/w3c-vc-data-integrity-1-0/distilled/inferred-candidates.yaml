    source_lines: '738-741'
    cue: 'can be'
    text: 'For example, a cryptographically protected payload that can be natively stored and indexed by a database will result in a simpler system that: benefits from utilizing existing industry-standard database features with no changes to the protected information, avoids the complexity of duplicating data where one copy of the data preserves the message and digital signature, while the other copy only stores and indexes the message and is what drives system behaviour, avoids the complexity of bespoke solutions that have to structurally modify the protected information, such as serializing and deserializing nested digitally signed data that has multiple nested base-encoded payloads.'
