  - id: 'C-0105'
    locator: '§5.1'
    source_lines: '683'
    cue: 'requires'
    text: 'All modern cryptography requires the computationally difficult approach to remain difficult throughout time, which does not always hold due to breakthroughs in science and mathematics.'
