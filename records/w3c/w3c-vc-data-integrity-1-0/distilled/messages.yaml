record: "w3c-vc-data-integrity-1-0"
reviewed_by: ""
source_digest: "ba5c4baf13fe3bab3ebd95ab6650d6fe83720e254b383bb444b4fbbae7bcf4fe"
source: ".cache/w3c-vc-data-integrity-1-0.bin (W3C Recommendation 15 May 2025, REC-vc-data-integrity-20250515, HTML). Quotations and line numbers are from its plain-text rendering .cache/w3c-vc-data-integrity-1-0.txt (1243 lines, sha256 2b7725f80e138ef943eff25050eee6a62f8887762ca9e1e03867c55ea5647beb). Example bytes are decoded from the HTML elements, never from the .txt."
extracted: "2026-11-07"
extracted_by: "FX-1 pass 1 (extract), schema+messages+examples agent, mechanical lane, from the source only"
applicability: "This document defines a data model and algorithms for embedding a proof in a JSON or JSON-LD document. It defines no binary layout: the only encoded values are the Multibase strings proofValue and digestMultibase and the SHA2-256 digests of section 2.4. What it fixes is the proof object (twelve members, section 2.1), the DataIntegrityProof pattern (3.1), proof sets and chains, the inputs and results of five algorithms (4.2 to 4.6) and the error vocabulary (4.7). Out of scope because the source does not define them: Multibase, Multihash and Multikey (Controlled Identifiers v1.0), the verification method (same), the transformation, hashing and signing of a cryptosuite (the EdDSA and ECDSA cryptosuite documents), ProblemDetails (RFC 9457), the JSON-LD contexts themselves."
note: "Conventions. (1) A quotation is {source_lines, quote}: the words were cut from the .txt rendering by script and bin/check-quotes verifies each against its lines; nothing in a quotation is retyped. (2) Text outside quotations (description, notes, effect, reason) is this file's own wording. (3) constrained_by lists w3c-vc-data-integrity-1-0#R-NNNN ids of requirements.yaml. Re-wired by the verify pass (pass 2, 2026-11-07) against requirements.yaml sha256 7dbb2aee2b7f... (289 entries), after pass 1 had wired the 78 skeleton ids only: every id whose text a quotation of the same mapping carries (or that carries the quotation) is included by script, the duplicate-text group of L624 excepted where the quotation is the other sentence; the others were chosen per mapping from the id table, resolved by script and read back. No split parent is cited, except R-0051 in T-09, the one entry that carries L517's text. (4) level gives the BCP 14 keywords the source states for the field, MUST, MUST NOT, SHOULD, MAY, OPTIONAL. required is true when the source makes the member a MUST to include, false otherwise. (5) schema points at the derived schema or rule that checks the field. (6) normative_status: defined (this source defines it), referenced (named and delegated). (7) inferred: true marks a reading the source does not state. (8) Section 2.1's own prose says set for domain and proof and list for previousProof; this file keeps the source's word in descriptions and uses array for the JSON form. (9) Counts, by script over this file's structure after the pass-3 cross-check (pass 3 restored the withdrawn R-0054 to requirements.yaml, now 290 entries, sha256 7c591e4d23ff6bd326f87bfc9da4e88187e60f3f9aee1198e6b61b326bfc63a7, and cited it from MSG-03 beside the L527 quotation it carries; no other wiring changed): 23 messages and 85 fields; 250 constrained_by entries on fields and 448 in all; 211 of the 290 requirement ids are wired to an encoding rule, tension, message or field; the other 79 are listed under not_wired with a reason (32 of them split parents)."
encoding_rules:
  - id: "ENC-01"
    rule: "proofValue and digestMultibase are Multibase strings"
    locator: "§2.1, §2.3"
    quotes:
      - source_lines: "223"
        quote: "The value MUST use a header and encoding as described in Section 2.4 Multibase of the Controlled Identifiers v1.0 specification to express the binary data."
      - source_lines: "388"
        quote: "each of which is a Multibase-encoded Multihash value"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0018"
      - "w3c-vc-data-integrity-1-0#R-0023"
    description: "One header character, then data. The source names no header; every proofValue in its examples begins with z (base58btc) and the digestMultibase of Example 8 decodes to a SHA2-256 Multihash. u (base64url without padding) is Multibase's, not this source's."
  - id: "ENC-02"
    rule: "strings are encoded as UTF-8 by the add-proof algorithms"
    locator: "§4.2, §4.3"
    quotes:
      - source_lines: "549"
        quote: "Whenever this algorithm encodes strings, it MUST use UTF-8 encoding."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0057"
      - "w3c-vc-data-integrity-1-0#R-0062"
    description: "Stated for 4.2 and 4.3 only. 4.4 parses JSON bytes to an Infra value (L600) and states no encoding."
  - id: "ENC-03"
    rule: "time values are XSD 1.1 dateTimeStamp"
    locator: "§2.1"
    quotes:
      - source_lines: "215"
        quote: "dateTimeStamp string, either in Universal Coordinated Time (UTC), denoted by a Z at the end of the value, or with a time zone offset relative to UTC."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0098"
      - "w3c-vc-data-integrity-1-0#R-0012"
      - "w3c-vc-data-integrity-1-0#R-0010"
      - "w3c-vc-data-integrity-1-0#R-0013"
      - "w3c-vc-data-integrity-1-0#R-0099"
      - "w3c-vc-data-integrity-1-0#R-0101"
    description: "A dateTime whose time zone is mandatory. A value with no offset may be consumed and is read as UTC (MAY)."
  - id: "ENC-04"
    rule: "a secured document is JSON (or JSON-LD) bytes"
    locator: "§4.4"
    quotes:
      - source_lines: "600"
        quote: "Let securedDocument be the result of running parse JSON bytes to an Infra value on documentBytes."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0219"
      - "w3c-vc-data-integrity-1-0#R-0220"
    description: "Verify Proof reads JSON bytes. The source names no character encoding for them. Proof sets and chains are JSON arrays."
  - id: "ENC-05"
    rule: "digests of pinned contexts are SHA2-256 in hex"
    locator: "§2.4"
    quotes:
      - source_lines: "409"
        quote: "SHA2-256 Digest: 67f21e6e33a6c14e5ccfd2fc7865f7474fb71a04af7e94136cb399dfac8ae8f4"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0124"
      - "w3c-vc-data-integrity-1-0#R-0125"
      - "w3c-vc-data-integrity-1-0#R-0126"
      - "w3c-vc-data-integrity-1-0#R-0127"
      - "w3c-vc-data-integrity-1-0#R-0128"
    description: "The curl | openssl dgst -sha256 command (L414) prints the digest of the document as served with the Accept header given."
source_tensions:
  - id: "T-01"
    title: "verificationMethod is OPTIONAL in 2.1 and required by the algorithms"
    locator: "§2.1, §4.2, §4.4"
    quotes:
      - source_lines: "211"
        quote: "Inclusion of verificationMethod is OPTIONAL"
      - source_lines: "551"
        quote: "If one or more of the proof.type, proof.verificationMethod, and proof.proofPurpose values is not set, an error MUST be raised"
      - source_lines: "603"
        quote: "If one or more of proof.type, proof.verificationMethod, and proof.proofPurpose does not exist, an error MUST be raised"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0007"
      - "w3c-vc-data-integrity-1-0#R-0182"
      - "w3c-vc-data-integrity-1-0#R-0224"
      - "w3c-vc-data-integrity-1-0#R-0090"
    effect: "A proof without verificationMethod is a conforming proof object (root) and cannot be added (4.2) or verified (4.4). Schema: root accepts it, #processable rejects it."
  - id: "T-02"
    title: "proofValue is MUST in 3.1 and replaceable in 2.1"
    locator: "§2.1, §3.1"
    quotes:
      - source_lines: "223"
        quote: "Alternative properties with different encodings specified by the cryptosuite MAY be used, instead of this property"
      - source_lines: "523"
        quote: "The proofValue property MUST be used, as specified in Section 2.1 Proofs."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0108"
      - "w3c-vc-data-integrity-1-0#R-0164"
    effect: "Read as: a DataIntegrityProof must carry proofValue; another proof type may replace it. Schema: optional in the root, required in #data-integrity-proof."
  - id: "T-03"
    title: "revocation (2.6) or revoked (revision history)"
    locator: "§2.6, Appendix B"
    quotes:
      - source_lines: "486"
        quote: "The revocation and expiration times for a verification method are expressed using the revocation and expires properties, respectively"
      - source_lines: "972"
        quote: "Added revoked and expires to verification methods."
    constrained_by: []
    effect: "Two names for one property in one document. Controlled Identifiers v1.0 (fetched 2026-11-07) names it revoked. verification-method.derived accepts both."
  - id: "T-04"
    title: "error codes used and not defined"
    locator: "§2.4.3, §4.4, §4.7"
    quotes:
      - source_lines: "452"
        quote: "MUST throw an error, which SHOULD be DATA_LOSS_DETECTION_ERROR"
      - source_lines: "601"
        quote: "SHOULD convey an error type of PARSING_ERROR"
      - source_lines: "663"
        quote: "ends with the value in the section listed below"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0141"
      - "w3c-vc-data-integrity-1-0#R-0142"
      - "w3c-vc-data-integrity-1-0#R-0221"
      - "w3c-vc-data-integrity-1-0#R-0273"
      - "w3c-vc-data-integrity-1-0#R-0274"
      - "w3c-vc-data-integrity-1-0#R-0275"
      - "w3c-vc-data-integrity-1-0#R-0276"
      - "w3c-vc-data-integrity-1-0#R-0277"
      - "w3c-vc-data-integrity-1-0#R-0278"
    effect: "Section 4.7 lists five codes. Two others are named by algorithms. The MUST on the type URL, read literally, excludes them. problem-details.derived root = the five; #with-referenced-names adds the two. PROOF_TRANSFORMATION_ERROR is defined and raised by no algorithm."
  - id: "T-05"
    title: "member names of the combined result"
    locator: "§4.4, §4.5"
    quotes:
      - source_lines: "630"
        quote: "Set combinedVerificationResult.status to true, combinedVerificationResult.document to null, and combinedVerificationResult.mediaType to null."
      - source_lines: "632"
        quote: "set combinedVerificationResult.verified to false"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0215"
      - "w3c-vc-data-integrity-1-0#R-0256"
      - "w3c-vc-data-integrity-1-0#R-0258"
      - "w3c-vc-data-integrity-1-0#R-0259"
      - "w3c-vc-data-integrity-1-0#R-0260"
      - "w3c-vc-data-integrity-1-0#R-0262"
    effect: "4.5 initialises status and then sets verified; the 4.4 result has verified and verifiedDocument, 4.5 uses document. verification-result.derived#combined-as-written accepts the as-written names."
  - id: "T-06"
    title: "context validation failure: removed or null"
    locator: "§4.6"
    quotes:
      - source_lines: "644"
        quote: "Null, if validated is false; otherwise, an input document"
      - source_lines: "655"
        quote: "remove the document property from result"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0265"
      - "w3c-vc-data-integrity-1-0#R-0271"
    effect: "The struct names validatedDocument, the step removes a property called document. Schema: absent or null on failure."
  - id: "T-07"
    title: "4.5 reuses steps of 4.4 without their inputs"
    locator: "§4.4, §4.5"
    quotes:
      - source_lines: "619"
        quote: "Required input is a secured data document (securedDocument)."
      - source_lines: "628"
        quote: "Run steps 4 through 8 of the algorithm in section 4.4 Verify Proof on inputDocument; if no exceptions are raised, append cryptosuiteVerificationResult to verificationResults."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0241"
      - "w3c-vc-data-integrity-1-0#R-0253"
      - "w3c-vc-data-integrity-1-0#R-0234"
      - "w3c-vc-data-integrity-1-0#R-0254"
    effect: "Steps 5 to 8 of 4.4 use expectedProofPurpose, domain, challenge and cryptosuite, which 4.5 does not take as inputs; and 4.4 returns a result with verified false where 4.5 waits for exceptions."
  - id: "T-08"
    title: "domain: string, set or list"
    locator: "§2.1, §4.4"
    quotes:
      - source_lines: "219"
        quote: "If specified, the associated value MUST be either a string, or an unordered set of strings."
      - source_lines: "585"
        quote: "An optional set of strings, used by the proof creator to lock a proof to a particular security domain"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0015"
      - "w3c-vc-data-integrity-1-0#R-0213"
      - "w3c-vc-data-integrity-1-0#R-0229"
      - "w3c-vc-data-integrity-1-0#R-0110"
    effect: "A single string and a one-member set are the same domain (L605). previousProof is called a list where domain is a set: duplicates are forbidden for domain in the schema and not for previousProof."
  - id: "T-09"
    title: "typographical errors that do not change a rule"
    locator: "§2.1, §2.3, §3.1, §4"
    quotes:
      - source_lines: "215"
        quote: "MAY chose to consume"
      - source_lines: "388"
        quote: "an list of string values"
      - source_lines: "517"
        quote: "When specifing a cryptographic suite"
      - source_lines: "531"
        quote: "An input document is an map"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0010"
      - "w3c-vc-data-integrity-1-0#R-0013"
      - "w3c-vc-data-integrity-1-0#R-0023"
      - "w3c-vc-data-integrity-1-0#R-0051"
      - "w3c-vc-data-integrity-1-0#R-0055"
    effect: "Left as printed."
messages:
  - id: "MSG-01"
    name: "secured-data-document"
    locator: "§2.1, §4"
    encoding: "JSON object (a map); JSON-LD optional"
    normative_status: "defined"
    description: "A map that carries a proof. The unit every algorithm of section 4 consumes and produces. Members other than proof and @context are the application's and are not constrained here."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0079"
      - "w3c-vc-data-integrity-1-0#R-0168"
      - "w3c-vc-data-integrity-1-0#R-0002"
      - "w3c-vc-data-integrity-1-0#R-0085"
    quotes:
      - source_lines: "531"
        quote: "A secured data document is a map that contains one or more proof values."
    layout: "{ ...document members..., \"proof\": <proof> | [ <proof>, ... ] }"
    fields:
      - name: "proof"
        type: "object | array of object (an unordered set)"
        required: true
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0002"
          - "w3c-vc-data-integrity-1-0#R-0085"
          - "w3c-vc-data-integrity-1-0#R-0084"
          - "w3c-vc-data-integrity-1-0#R-0112"
          - "w3c-vc-data-integrity-1-0#R-0115"
          - "w3c-vc-data-integrity-1-0#R-0168"
          - "w3c-vc-data-integrity-1-0#R-0220"
        quotes:
          - source_lines: "203"
            quote: "When expressing a data integrity proof on an object, a proof property MUST be used."
          - source_lines: "203"
            quote: "If present, its value MUST be either a single object, or an unordered set of objects"
        schema: "secured-document.derived#/properties/proof"
        notes: "One proof is an object, several are an array. Non-empty array: inferred from the definition of a secured data document as holding one or more proof values (L531)."
      - name: "@context"
        type: "string | object | array"
        required: false
        level:
          - "SHOULD"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0082"
          - "w3c-vc-data-integrity-1-0#R-0083"
          - "w3c-vc-data-integrity-1-0#R-0032"
          - "w3c-vc-data-integrity-1-0#R-0033"
          - "w3c-vc-data-integrity-1-0#R-0034"
        quotes:
          - source_lines: "445"
            quote: "implementations SHOULD inject or append an @context property"
          - source_lines: "446"
            quote: "However, if an @context declaration is not included, extensions (such as the addition of new properties) related to this specification or corresponding cryptosuites MUST NOT be made."
        schema: "secured-document.derived#context-should"
        notes: "SHOULD be injected when a document is secured and lacks the Data Integrity terms; optional for a document not processed as JSON-LD, which then MUST NOT be extended."
  - id: "MSG-02"
    name: "data-integrity-proof"
    locator: "§2.1"
    encoding: "JSON object; string values; Multibase for proofValue"
    normative_status: "defined"
    description: "The generic proof object. A proof 'provides information about the proof mechanism, parameters required to verify that proof, and the proof value itself'. Cryptosuites add members of their own (R-0166). The DataIntegrityProof profile is MSG-03."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0002"
      - "w3c-vc-data-integrity-1-0#R-0085"
      - "w3c-vc-data-integrity-1-0#R-0088"
      - "w3c-vc-data-integrity-1-0#R-0166"
      - "w3c-vc-data-integrity-1-0#R-0288"
    layout: "{ id?, type, proofPurpose, verificationMethod?, cryptosuite?, created?, expires?, domain?, challenge?, proofValue?, previousProof?, nonce?, ...cryptosuite-defined members }"
    fields:
      - name: "id"
        type: "string (URL)"
        required: false
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0086"
        quotes:
          - source_lines: "205"
            quote: "An optional identifier for the proof, which MUST be a URL [URL]"
        schema: "proof.derived#/$defs/core/properties/id"
        notes: "The identifier a previousProof value names (MSG-05). A urn:uuid is the source's own example."
      - name: "type"
        type: "string (maps to a URL)"
        required: true
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0087"
          - "w3c-vc-data-integrity-1-0#R-0088"
          - "w3c-vc-data-integrity-1-0#R-0182"
          - "w3c-vc-data-integrity-1-0#R-0224"
        quotes:
          - source_lines: "207"
            quote: "The specific type of proof MUST be specified as a string that maps to a URL [URL]."
        schema: "proof.derived#/$defs/core/properties/type"
        notes: "DataIntegrityProof and Ed25519Signature2020 are the source's examples. The type decides which other members are required (L207)."
      - name: "proofPurpose"
        type: "string (maps to a URL)"
        required: true
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0089"
          - "w3c-vc-data-integrity-1-0#R-0182"
          - "w3c-vc-data-integrity-1-0#R-0224"
          - "w3c-vc-data-integrity-1-0#R-0226"
          - "w3c-vc-data-integrity-1-0#R-0286"
          - "w3c-vc-data-integrity-1-0#R-0228"
        quotes:
          - source_lines: "209"
            quote: "The reason the proof was created MUST be specified as a string that maps to a URL [URL]."
        schema: "proof.derived#/$defs/core/properties/proofPurpose"
        notes: "Values: MSG-21."
      - name: "verificationMethod"
        type: "string (maps to a URL)"
        required: false
        level:
          - "MUST"
          - "OPTIONAL"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0006"
          - "w3c-vc-data-integrity-1-0#R-0007"
          - "w3c-vc-data-integrity-1-0#R-0091"
          - "w3c-vc-data-integrity-1-0#R-0092"
          - "w3c-vc-data-integrity-1-0#R-0182"
          - "w3c-vc-data-integrity-1-0#R-0224"
          - "w3c-vc-data-integrity-1-0#R-0090"
        quotes:
          - source_lines: "211"
            quote: "If included, the value MUST be a string that maps to a [URL]."
          - source_lines: "211"
            quote: "Inclusion of verificationMethod is OPTIONAL"
        schema: "proof.derived#/$defs/core/properties/verificationMethod"
        notes: "OPTIONAL here, and an error to omit in Add Proof (L551) and Verify Proof (L603): T-01. Points at a verification method in a controlled identifier document (MSG-22)."
      - name: "cryptosuite"
        type: "string"
        required: false
        level:
          - "MUST"
          - "MAY"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0093"
          - "w3c-vc-data-integrity-1-0#R-0094"
          - "w3c-vc-data-integrity-1-0#R-0095"
          - "w3c-vc-data-integrity-1-0#R-0096"
          - "w3c-vc-data-integrity-1-0#R-0162"
          - "w3c-vc-data-integrity-1-0#R-0163"
        quotes:
          - source_lines: "213"
            quote: "If the proof type is DataIntegrityProof, cryptosuite MUST be specified; otherwise, cryptosuite MAY be specified. If specified, its value MUST be a string."
        schema: "proof.derived#/allOf/0 (via core)"
        notes: "Required when type is DataIntegrityProof; any string when present."
      - name: "created"
        type: "string (XSD dateTimeStamp)"
        required: false
        level:
          - "MUST"
          - "MAY"
          - "OPTIONAL"
        encoding: "XSD 1.1 dateTimeStamp lexical form"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0097"
          - "w3c-vc-data-integrity-1-0#R-0098"
          - "w3c-vc-data-integrity-1-0#R-0010"
          - "w3c-vc-data-integrity-1-0#R-0099"
          - "w3c-vc-data-integrity-1-0#R-0151"
          - "w3c-vc-data-integrity-1-0#R-0152"
        quotes:
          - source_lines: "215"
            quote: "The date and time the proof was created is OPTIONAL and, if included, MUST be specified as an [XMLSCHEMA11-2] dateTimeStamp string, either in Universal Coordinated Time (UTC), denoted by a Z at the end of the value, or with a time zone offset relative to UTC."
          - source_lines: "215"
            quote: "A conforming processor MAY chose to consume time values that were incorrectly serialized without an offset."
        schema: "proof.derived#/$defs/strict/properties/created; #lenient-time"
        notes: "Strict: a time zone offset or Z is required. A processor MAY consume a value with no offset and then reads it as UTC."
      - name: "expires"
        type: "string (XSD dateTimeStamp)"
        required: false
        level:
          - "MUST"
          - "MAY"
          - "OPTIONAL"
        encoding: "XSD 1.1 dateTimeStamp lexical form"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0100"
          - "w3c-vc-data-integrity-1-0#R-0012"
          - "w3c-vc-data-integrity-1-0#R-0013"
          - "w3c-vc-data-integrity-1-0#R-0101"
          - "w3c-vc-data-integrity-1-0#R-0151"
          - "w3c-vc-data-integrity-1-0#R-0152"
        quotes:
          - source_lines: "217"
            quote: "The expires property is OPTIONAL and, if present, specifies when the proof expires."
          - source_lines: "217"
            quote: "If present, it MUST be an [XMLSCHEMA11-2] dateTimeStamp string, either in Universal Coordinated Time (UTC), denoted by a Z at the end of the value, or with a time zone offset relative to UTC."
        schema: "proof.derived#/$defs/strict/properties/expires; #lenient-time"
        notes: "Same form and leniency as created. No ordering of created and expires is stated."
      - name: "domain"
        type: "string | array of string (an unordered set)"
        required: false
        level:
          - "MUST"
          - "SHOULD"
          - "OPTIONAL"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0102"
          - "w3c-vc-data-integrity-1-0#R-0103"
          - "w3c-vc-data-integrity-1-0#R-0015"
          - "w3c-vc-data-integrity-1-0#R-0016"
          - "w3c-vc-data-integrity-1-0#R-0229"
          - "w3c-vc-data-integrity-1-0#R-0184"
        quotes:
          - source_lines: "219"
            quote: "If specified, the associated value MUST be either a string, or an unordered set of strings."
          - source_lines: "219"
            quote: "A verifier SHOULD use the value to ensure that the proof was intended to be used in the security domain in which the verifier is operating."
        schema: "proof.derived#/$defs/core/properties/domain"
        notes: "Compared as a set when verifying; a single string is a set of one (L605)."
      - name: "challenge"
        type: "string"
        required: false
        level:
          - "SHOULD"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0104"
          - "w3c-vc-data-integrity-1-0#R-0105"
          - "w3c-vc-data-integrity-1-0#R-0231"
          - "w3c-vc-data-integrity-1-0#R-0186"
          - "w3c-vc-data-integrity-1-0#R-0233"
        quotes:
          - source_lines: "221"
            quote: "A string value that SHOULD be included in a proof if a domain is specified."
        schema: "proof.derived#proof-should"
        notes: "Used once per domain and window of time, to mitigate replay (L221). The SHOULD is #proof-should."
      - name: "proofValue"
        type: "string (Multibase)"
        required: false
        level:
          - "MUST"
          - "MAY"
        encoding: "Multibase (Controlled Identifiers v1.0 section 2.4); z = base58btc, u = base64url, OUTSIDE-SOURCE"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0106"
          - "w3c-vc-data-integrity-1-0#R-0018"
          - "w3c-vc-data-integrity-1-0#R-0107"
          - "w3c-vc-data-integrity-1-0#R-0108"
          - "w3c-vc-data-integrity-1-0#R-0164"
        quotes:
          - source_lines: "223"
            quote: "The value MUST use a header and encoding as described in Section 2.4 Multibase of the Controlled Identifiers v1.0 specification to express the binary data."
          - source_lines: "223"
            quote: "Alternative properties with different encodings specified by the cryptosuite MAY be used, instead of this property, to encode the data necessary to verify the digital proof."
        schema: "proof.derived#/$defs/core/properties/proofValue"
        notes: "Multibase: one header character then the encoded data. The examples all use the base58btc header z; base64url is u (Multibase, not this source). A cryptosuite may use other properties instead: T-02."
      - name: "previousProof"
        type: "string | array of string (an unordered list)"
        required: false
        level:
          - "MUST"
          - "OPTIONAL"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0109"
          - "w3c-vc-data-integrity-1-0#R-0110"
          - "w3c-vc-data-integrity-1-0#R-0020"
          - "w3c-vc-data-integrity-1-0#R-0199"
          - "w3c-vc-data-integrity-1-0#R-0202"
          - "w3c-vc-data-integrity-1-0#R-0247"
          - "w3c-vc-data-integrity-1-0#R-0250"
        quotes:
          - source_lines: "225"
            quote: "If present, it MUST be a string value or an unordered list of string values."
          - source_lines: "225"
            quote: "Each value identifies another data integrity proof, all of which MUST also verify for the current proof to be considered verified."
        schema: "proof.derived#/$defs/core/properties/previousProof"
        notes: "Each value is the id of another proof of the same document (cross-field rule X-01). A proof is verified only if all it names are."
      - name: "nonce"
        type: "string"
        required: false
        level:
          - "OPTIONAL"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0111"
        quotes:
          - source_lines: "227"
            quote: "An OPTIONAL string value supplied by the proof creator."
        schema: "proof.derived#/$defs/core/properties/nonce"
        notes: "Reduces linkability of deterministic signatures (L227)."
  - id: "MSG-03"
    name: "DataIntegrityProof"
    locator: "§3.1"
    encoding: "JSON object"
    normative_status: "defined"
    description: "The general design pattern for a cryptosuite: type is the fixed string DataIntegrityProof, cryptosuite names the suite, and everything cryptographic is inside proofValue. A profile of MSG-02."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0161"
      - "w3c-vc-data-integrity-1-0#R-0162"
      - "w3c-vc-data-integrity-1-0#R-0163"
      - "w3c-vc-data-integrity-1-0#R-0164"
      - "w3c-vc-data-integrity-1-0#R-0165"
      - "w3c-vc-data-integrity-1-0#R-0166"
      - "w3c-vc-data-integrity-1-0#R-0054"
    quotes:
      - source_lines: "524"
        quote: "Cryptographic suite designers MUST use mandatory proof value properties defined in Section 2.1 Proofs, and MAY define other properties specific to their cryptographic suite."
      - source_lines: "527"
        quote: "authors creating new Data Integrity cryptographic suite specifications SHOULD use the modern pattern — where the type is set to DataIntegrityProof; the cryptosuite property carries the identifier for the cryptosuite; and any cryptosuite-specific cryptographic data is encapsulated (i.e., not directly exposed as application layer data) within proofValue."
    layout: "{ type: \"DataIntegrityProof\", cryptosuite, proofValue, ...MSG-02 members, ...suite-defined members }"
    fields:
      - name: "type"
        type: "string"
        required: true
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0161"
        quotes:
          - source_lines: "519"
            quote: "The type property MUST contain the string DataIntegrityProof."
        schema: "proof.derived#data-integrity-proof"
      - name: "cryptosuite"
        type: "string"
        required: true
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0162"
          - "w3c-vc-data-integrity-1-0#R-0163"
          - "w3c-vc-data-integrity-1-0#R-0094"
        quotes:
          - source_lines: "521"
            quote: "The value of the cryptosuite property MUST be a string that identifies the cryptographic suite."
          - source_lines: "521"
            quote: "If the processing environment supports string subtypes, the subtype of the cryptosuite value MUST be the https://w3id.org/security#cryptosuiteString subtype."
        schema: "proof.derived#data-integrity-proof"
        notes: "The subtype rule applies in environments that have string subtypes (RDF datatypes); JSON has none. MSG-08."
      - name: "proofValue"
        type: "string (Multibase)"
        required: true
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0164"
          - "w3c-vc-data-integrity-1-0#R-0018"
        quotes:
          - source_lines: "523"
            quote: "The proofValue property MUST be used, as specified in Section 2.1 Proofs."
        schema: "proof.derived#data-integrity-proof"
        notes: "Required here; section 2.1 lets a cryptosuite replace it: T-02."
    notes: "The L527 sentence quoted above sits inside the Note of section 3.1 (HTML div.note), which section 1.3 makes non-normative: its SHOULD binds nothing (requirements.yaml reconciliation; R-0054, withdrawn, is cited at message level for this quotation only and binds nothing, normative.md SD-2). The pattern's binding rules are the section 3.1 MUSTs (R-0161 to R-0165); whether a new suite uses the pattern at all is left free."
  - id: "MSG-04"
    name: "proof-set"
    locator: "§2.1.1"
    encoding: "JSON array of MSG-02 objects (unordered)"
    normative_status: "defined"
    description: "Several proofs over the same data, in no order. The proof member holds an array. Any member may be removed and the rest still verify (L871)."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0002"
      - "w3c-vc-data-integrity-1-0#R-0085"
      - "w3c-vc-data-integrity-1-0#R-0112"
      - "w3c-vc-data-integrity-1-0#R-0290"
    layout: "\"proof\": [ <proof>, <proof>, ... ]"
    fields:
      - name: "proof[]"
        type: "array of data-integrity-proof"
        required: true
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0085"
          - "w3c-vc-data-integrity-1-0#R-0112"
        quotes:
          - source_lines: "203"
            quote: "If present, its value MUST be either a single object, or an unordered set of objects"
          - source_lines: "303"
            quote: "A proof set, which has no order, is represented by associating a set of proofs with the proof key in a document."
        schema: "secured-document.derived#proof-set-or-chain"
        notes: "No member needs an id; order carries no meaning."
  - id: "MSG-05"
    name: "proof-chain"
    locator: "§2.1.2, §4.3, §4.5"
    encoding: "JSON array of MSG-02 objects; order of verification given by previousProof"
    normative_status: "defined"
    description: "An ordered dependency among the proofs of one document: at least one proof has an id and another has a previousProof naming it. Each later proof is made over the document together with the proofs it names."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0113"
      - "w3c-vc-data-integrity-1-0#R-0086"
      - "w3c-vc-data-integrity-1-0#R-0110"
      - "w3c-vc-data-integrity-1-0#R-0020"
      - "w3c-vc-data-integrity-1-0#R-0204"
      - "w3c-vc-data-integrity-1-0#R-0252"
      - "w3c-vc-data-integrity-1-0#R-0287"
    layout: "\"proof\": [ { id: A, ... }, { previousProof: A, ... } ]"
    fields:
      - name: "proof[].id"
        type: "string (URL)"
        required: false
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0113"
          - "w3c-vc-data-integrity-1-0#R-0086"
        quotes:
          - source_lines: "333"
            quote: "expressed by providing at least one proof with an id, such as a UUID [RFC9562], and another proof with a previousProof value that identifies the previous proof."
        schema: "secured-document.derived#proof-chain-shape"
        notes: "The chain is a convention over MSG-02 members, not a new structure."
      - name: "proof[].previousProof"
        type: "string | array of string"
        required: false
        level:
          - "MUST"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0110"
          - "w3c-vc-data-integrity-1-0#R-0020"
          - "w3c-vc-data-integrity-1-0#R-0199"
          - "w3c-vc-data-integrity-1-0#R-0200"
          - "w3c-vc-data-integrity-1-0#R-0202"
          - "w3c-vc-data-integrity-1-0#R-0246"
          - "w3c-vc-data-integrity-1-0#R-0247"
          - "w3c-vc-data-integrity-1-0#R-0248"
          - "w3c-vc-data-integrity-1-0#R-0249"
          - "w3c-vc-data-integrity-1-0#R-0250"
        quotes:
          - source_lines: "564"
            quote: "If a proof with id equal to previousProof does not exist in allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
          - source_lines: "624"
            quote: "If a proof with id value equal to the value of previousProof does not exist in allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_VERIFICATION_ERROR."
        schema: "rules.derived.yaml X-01"
        notes: "A dangling previousProof is PROOF_GENERATION_ERROR when adding (4.3) and PROOF_VERIFICATION_ERROR when verifying (4.5)."
  - id: "MSG-06"
    name: "resource-integrity-object"
    locator: "§2.3"
    encoding: "JSON object with id and digestMultibase"
    normative_status: "defined"
    description: "An object that names an external resource by id and carries a digest of it, to detect that the resource changed after the document was secured."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0022"
      - "w3c-vc-data-integrity-1-0#R-0023"
      - "w3c-vc-data-integrity-1-0#R-0122"
      - "w3c-vc-data-integrity-1-0#R-0123"
    layout: "{ id, digestMultibase }"
    fields:
      - name: "id"
        type: "string (URL)"
        required: true
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0022"
        quotes:
          - source_lines: "388"
            quote: "an implementer MAY include a property named digestMultibase in any object that includes an id property"
        schema: "resource-integrity.derived#/dependentRequired"
        notes: "The scope of the MAY: the object has an id. Reading it as a limit (digestMultibase needs id) is inferred."
        inferred: true
        inferred_reason: "the sentence permits digestMultibase in objects that have an id and does not forbid it elsewhere"
      - name: "digestMultibase"
        type: "string | array of string"
        required: false
        level:
          - "MAY"
          - "MUST"
        encoding: "Multibase (Multihash payload); Controlled Identifiers v1.0"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0023"
          - "w3c-vc-data-integrity-1-0#R-0022"
          - "w3c-vc-data-integrity-1-0#R-0122"
        quotes:
          - source_lines: "388"
            quote: "If present, the digestMultibase value MUST be a single string value, or an list of string values, each of which is a Multibase-encoded Multihash value."
        schema: "resource-integrity.derived#/properties/digestMultibase"
        notes: "Each value is a Multibase string whose payload is a Multihash. Example 8's value decodes to 0x12 0x20 and 32 octets (SHA2-256)."
  - id: "MSG-07"
    name: "pinned-json-ld-contexts"
    locator: "§2.4"
    encoding: "table of URL to SHA2-256 digest of the context document; HTTP content negotiation for the vocabulary"
    normative_status: "defined"
    description: "The JSON-LD contexts an implementation that does JSON-LD processing MUST treat as already resolved, each with the digest the resolved document must have, and the vocabulary documents with theirs."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0124"
      - "w3c-vc-data-integrity-1-0#R-0125"
      - "w3c-vc-data-integrity-1-0#R-0126"
      - "w3c-vc-data-integrity-1-0#R-0127"
      - "w3c-vc-data-integrity-1-0#R-0128"
      - "w3c-vc-data-integrity-1-0#R-0129"
      - "w3c-vc-data-integrity-1-0#R-0130"
      - "w3c-vc-data-integrity-1-0#R-0025"
      - "w3c-vc-data-integrity-1-0#R-0131"
      - "w3c-vc-data-integrity-1-0#R-0132"
      - "w3c-vc-data-integrity-1-0#R-0133"
      - "w3c-vc-data-integrity-1-0#R-0134"
      - "w3c-vc-data-integrity-1-0#R-0135"
      - "w3c-vc-data-integrity-1-0#R-0136"
    layout: "| URL | SHA2-256 digest |"
    fields:
      - name: "contexts[]"
        type: "(url: string, sha256: hex string)"
        required: true
        level:
          - "MUST"
        encoding: "SHA-256, 64 lowercase hex characters"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0124"
          - "w3c-vc-data-integrity-1-0#R-0125"
          - "w3c-vc-data-integrity-1-0#R-0126"
          - "w3c-vc-data-integrity-1-0#R-0127"
          - "w3c-vc-data-integrity-1-0#R-0128"
        quotes:
          - source_lines: "408"
            quote: "URL: https://w3id.org/security/data-integrity/v2"
          - source_lines: "409"
            quote: "SHA2-256 Digest: 67f21e6e33a6c14e5ccfd2fc7865f7474fb71a04af7e94136cb399dfac8ae8f4"
        schema: "rules.derived.yaml context_pins"
        notes: "Three rows: data-integrity/v2, multikey/v1, jwk/v1. All three printed digests equal the SHA-256 of the documents fetched on 2026-11-07 (EX-CTX-1 to EX-CTX-3)."
      - name: "vocabulary[]"
        type: "(media type: string, sha256: hex string)"
        required: true
        level:
          - "MUST"
        encoding: "SHA-256, 64 lowercase hex characters"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0025"
          - "w3c-vc-data-integrity-1-0#R-0131"
          - "w3c-vc-data-integrity-1-0#R-0132"
          - "w3c-vc-data-integrity-1-0#R-0133"
          - "w3c-vc-data-integrity-1-0#R-0134"
          - "w3c-vc-data-integrity-1-0#R-0135"
        quotes:
          - source_lines: "421"
            quote: "The vocabulary in JSON-LD format [JSON-LD11]."
        schema: "rules.derived.yaml context_pins"
        notes: "Three rows: application/ld+json, text/turtle, text/html. None of the three digests equals the SHA-256 of the document served on 2026-11-07 (EX-CTX-4 to EX-CTX-6): EXD-09 (examples/README.md)."
      - name: "caching"
        type: "policy"
        required: false
        level:
          - "SHOULD"
          - "MAY"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0136"
          - "w3c-vc-data-integrity-1-0#R-0137"
          - "w3c-vc-data-integrity-1-0#R-0138"
          - "w3c-vc-data-integrity-1-0#R-0028"
        quotes:
          - source_lines: "429"
            quote: "Implementations MAY load application-specific JSON-LD context files from the network during development, but SHOULD permanently cache JSON-LD context files used by conforming secured documents in production settings"
        notes: "Not a structure; carried because it binds the table."
  - id: "MSG-08"
    name: "cryptosuiteString-datatype"
    locator: "§2.4.4.1"
    encoding: "RDF literal datatype https://w3id.org/security#cryptosuiteString (ASCII strings)"
    normative_status: "defined"
    description: "How a cryptosuite identifier is typed where datatypes exist. In JSON the value is a plain string."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0145"
      - "w3c-vc-data-integrity-1-0#R-0146"
      - "w3c-vc-data-integrity-1-0#R-0147"
      - "w3c-vc-data-integrity-1-0#R-0148"
      - "w3c-vc-data-integrity-1-0#R-0149"
      - "w3c-vc-data-integrity-1-0#R-0150"
      - "w3c-vc-data-integrity-1-0#R-0163"
    quotes:
      - source_lines: "464"
        quote: "https://w3id.org/security#cryptosuiteString"
    fields:
      - name: "lexical space"
        type: "set of ASCII strings"
        required: true
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0147"
        quotes:
          - source_lines: "466"
            quote: "The union of all cryptosuite strings, expressed using American Standard Code for Information Interchange [ASCII] strings, that are defined by the collection of all Data Integrity cryptosuite specifications."
        notes: "ASCII: stated by the lexical space definition (no keyword)."
      - name: "value space"
        type: "set of cryptosuite types"
        required: true
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0148"
        quotes:
          - source_lines: "468"
            quote: "The union of all cryptosuite types that are expressed using the cryptosuite property, as defined in Section 3.1 DataIntegrityProof."
  - id: "MSG-09"
    name: "cryptosuite-instance"
    locator: "§3"
    encoding: "struct (language-neutral); two algorithms"
    normative_status: "defined"
    description: "What a cryptosuite specification supplies: an instantiation algorithm that takes options and returns an instance with createProof and verifyProof."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0043"
      - "w3c-vc-data-integrity-1-0#R-0044"
      - "w3c-vc-data-integrity-1-0#R-0050"
      - "w3c-vc-data-integrity-1-0#R-0049"
      - "w3c-vc-data-integrity-1-0#R-0155"
      - "w3c-vc-data-integrity-1-0#R-0156"
    fields:
      - name: "createProof"
        type: "algorithm(inputDocument: map, options: map) -> map | error"
        required: true
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0155"
          - "w3c-vc-data-integrity-1-0#R-0043"
        quotes:
          - source_lines: "500"
            quote: "An algorithm that takes an input document (map inputDocument) and proof options (map options) as input, and produces a data integrity proof (map) or an error."
      - name: "verifyProof"
        type: "algorithm(securedDocument: map) -> cryptosuite-verification-result | error"
        required: true
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0156"
          - "w3c-vc-data-integrity-1-0#R-0043"
        quotes:
          - source_lines: "502"
            quote: "An algorithm that takes a secured data document (map securedDocument) as input, and produces a cryptosuite verification result or an error."
      - name: "instantiation algorithm"
        type: "algorithm(options: map) -> cryptosuite instance"
        required: true
        level:
          - "MUST"
          - "SHOULD"
          - "MAY"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0043"
          - "w3c-vc-data-integrity-1-0#R-0044"
          - "w3c-vc-data-integrity-1-0#R-0050"
        quotes:
          - source_lines: "498"
            quote: "The specification MUST define a data integrity cryptographic suite instantiation algorithm that accepts a set of options (map options) and returns a cryptosuite instance (struct cryptosuite)."
  - id: "MSG-10"
    name: "cryptosuite-verification-result"
    locator: "§3"
    encoding: "struct"
    normative_status: "defined"
    description: "What verifyProof returns."
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0157"
      - "w3c-vc-data-integrity-1-0#R-0158"
      - "w3c-vc-data-integrity-1-0#R-0045"
      - "w3c-vc-data-integrity-1-0#R-0159"
      - "w3c-vc-data-integrity-1-0#R-0160"
    quotes:
      - source_lines: "507"
        quote: "If an error is produced, the verification process failed to complete. An error, such as a network error, does not mean that a future attempt at verification would fail."
    fields:
      - name: "verified"
        type: "boolean"
        required: true
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0157"
        quotes:
          - source_lines: "504"
            quote: "A boolean that is true if the verification succeeded, or false otherwise."
        schema: "verification-result.derived#cryptosuite-result"
      - name: "verifiedDocument"
        type: "map | null"
