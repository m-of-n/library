cross_field_rules:
  - id: "X-01"
    what: "every previousProof value is the id of another proof of the same document"
    implemented: "check-schemas.derived.py x01_previous_proof"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0020"
      - "w3c-vc-data-integrity-1-0#R-0199"
      - "w3c-vc-data-integrity-1-0#R-0202"
      - "w3c-vc-data-integrity-1-0#R-0247"
      - "w3c-vc-data-integrity-1-0#R-0250"
    quotes:
      - source_lines: "225"
        quote: "Each value identifies another data integrity proof"
      - source_lines: "564"
        quote: "If a proof with id equal to previousProof does not exist in allProofs, an error MUST be raised"
      - source_lines: "624"
        quote: "If any element of previousProof list has an id attribute value that does not match the id attribute value of any element of allProofs, an error MUST be raised"
    note: "A proof naming itself, or a proof naming a later proof in the array, is accepted or rejected as follows: itself rejected (INFERRED: another proof), later accepted (a set is unordered, L225)."
  - id: "X-02"
    what: "a non-null options.domain and options.challenge equal the proof's"
    implemented: "check-schemas.derived.py x02_options_match"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0184"
      - "w3c-vc-data-integrity-1-0#R-0186"
    quotes:
      - source_lines: "552"
        quote: "it MUST be equal to proof.domain or an error MUST be raised"
      - source_lines: "553"
        quote: "it MUST be equal to proof.challenge or an error MUST be raised"
  - id: "X-03"
    what: "Verify Proof: expectedProofPurpose equals proofPurpose; domain sets equal; challenge equal"
    implemented: "check-schemas.derived.py x03_verify_inputs"
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0226"
      - "w3c-vc-data-integrity-1-0#R-0229"
      - "w3c-vc-data-integrity-1-0#R-0231"
    quotes:
      - source_lines: "604"
        quote: "it does not match proof.proofPurpose"
      - source_lines: "605"
        quote: "it does not contain the same strings as proof.domain (treating a single string as a set containing just that string)"
      - source_lines: "606"
        quote: "it does not match proof.challenge"
  - id: "X-04"
    what: "proof ids within one document are distinct"
    implemented: "check-schemas.derived.py x04_unique_ids"
    inferred: true
    constrained_by:
      - "w3c-vc-data-integrity-1-0#R-0198"
      - "w3c-vc-data-integrity-1-0#R-0197"
      - "w3c-vc-data-integrity-1-0#R-0246"
    note: "Not stated by the source; the inferred requirement R-0198 records it. Matching 'the element from allProofs with an id attribute matching previousProof' (L564) assumes at most one."
