        from: "referenced"
        to: "retrieval-failed"
        trigger: "dereference the URL"
        guard: "retrieval fails"
        action: "none stated"
        locator: "§5.14 ¶3"
        kind: "inferred"
        inferred_reason: "Only the network risk is stated."
        normative_status: "normative"
        quotes:
          - source_lines: "L780"
            quote: "When it is not possible to use cached information, such as when a specific HTTP URL-based instance of a verification method is encountered for the first time, implementers are cautioned to use defensive measures to mitigate denial-of-service attacks during any process that might fetch a resource from the network."
      - id: "T03"
        from: "located-otherwise"
        to: "document-obtained"
        trigger: "cryptosuite-specific means"
        guard: "the cryptosuite supplies the key"
        action: "none stated"
        locator: "§2.1 ¶10 (verificationMethod)"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L211"
            quote: "Inclusion of verificationMethod is OPTIONAL, but if it is not included, other properties such as cryptosuite might provide a mechanism by which to obtain the information necessary to verify the proof."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0007"
      - id: "T04"
        from: "document-obtained"
        to: "bound"
        trigger: "binding check"
        guard: "the document references the method"
        action: "none"
        locator: "§5.9 ¶1"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L749"
            quote: "Implementers ensure that a verification method is bound to a particular controller by going from the definition of the verification method to the controlled identifier document, and then ensuring that the controlled identifier document also contains a reference to the verification method. This process is described in the algorithm for retrieving a verification method."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0283"
      - id: "T05"
        from: "document-obtained"
        to: "binding-failed"
        trigger: "binding check"
        guard: "it does not"
        action: "none stated"
        locator: "§5.9 ¶1"
        kind: "inferred"
        inferred_reason: "The source states the check, not its failure."
        normative_status: "normative"
        quotes:
          - source_lines: "L749"
            quote: "Implementers ensure that a verification method is bound to a particular controller by going from the definition of the verification method to the controlled identifier document, and then ensuring that the controlled identifier document also contains a reference to the verification method. This process is described in the algorithm for retrieving a verification method."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0283"
      - id: "T06"
        from: "bound"
        to: "relationship-valid"
        trigger: "verification relationship validation"
        guard: "the method is listed for the proof's purpose"
        action: "none"
        locator: "§5.10 ¶1"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L753"
            quote: "When an implementation is verifying a proof, it is imperative that it verify not only that the verification method used to generate the proof is listed in the controlled identifier document, but also that it was intended to be used to generate the proof that is being verified. This process is known as \"verification relationship validation\"."
          - source_lines: "L754"
            quote: "The process of validating a verification relationship is outlined in Section 3.3 Retrieve Verification Method of the Controlled Identifiers v1.0 specification."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0284"
          - "w3c-vc-data-integrity-1-0#R-0285"
      - id: "T07"
        from: "bound"
        to: "relationship-invalid"
        trigger: "verification relationship validation"
        guard: "it is not"
        action: "none stated"
        locator: "§5.10 ¶3"
        kind: "inferred"
        inferred_reason: "The danger is stated; the failure outcome is CID's."
        normative_status: "normative"
        quotes:
          - source_lines: "L755"
            quote: "Not checking a verification relationship is dangerous because the restriction and protection profile for some cryptographic material could be determined by its intended use."
      - id: "T08"
        from: "relationship-valid"
        to: "usable"
        trigger: "controller check (credentials and presentations)"
        guard: "the controller is the issuer or holder, or the check does not apply"
        action: "none"
        locator: "§2.6 ¶2"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L484"
            quote: "One way to check for such an association is to ensure that the value of the controller property of a proof's verification method matches the URL value used to identify the issuer or holder, respectively, and that the verification method is expressed under a verification relationship that is acceptable given the proof's purpose. This particular association indicates that the issuer or holder, respectively, is the controller of the verification method used to verify the proof."
      - id: "T09"
        from: "relationship-valid"
        to: "controller-mismatch"
        trigger: "controller check"
        guard: "the controller is someone else"
        action: "none stated"
        locator: "§2.6 ¶2"
        kind: "inferred"
        inferred_reason: "§2.6 offers the check as one way to establish the association."
        normative_status: "normative"
        quotes:
          - source_lines: "L484"
            quote: "This particular association indicates that the issuer or holder, respectively, is the controller of the verification method used to verify the proof."
  - id: "SM08"
    name: "receive-pipeline"
    title: "Receiving a secured document"
    locator: "§4.1"
    basis: "stated (§4.1, §2.4.1, §5.7); exits partly unspecified"
    normative_status: "normative"
    summary: >-
      The receiving processing model as states: nothing may be trusted before verification and, for
      JSON-LD, context validation.
    flows:
      - "F07"
    defects:
      - "D-17"
    initial: "received"
    final_states:
      - "trusted"
    error_states:
      - "schema-invalid"
      - "not-verified"
      - "contexts-invalid"
    states:
      - name: "received"
        kind: "initial"
        description: "Incoming data."
      - name: "transformed"
        kind: "intermediate"
        description: "A document §4.4 or §4.5 accepts."
      - name: "schema-valid"
        kind: "intermediate"
        description: "Matches the application's expected schema."
      - name: "integrity-verified"
        kind: "intermediate"
        description: "§4.4 or §4.5 reported verified."
      - name: "trusted"
        kind: "final"
        description: "Business rules may run, on the returned document only."
      - name: "schema-invalid"
        kind: "error"
        description: "unspecified by source; §1.3 requires errors on non-conforming input."
      - name: "not-verified"
        kind: "error"
        description: "verified false, or no verdict (SM01 incomplete)."
      - name: "contexts-invalid"
        kind: "error"
        description: "§4.6 returned validated false."
    transitions:
      - id: "T01"
        from: "received"
        to: "transformed"
        trigger: "step 1"
        guard: "always"
        action: "transform"
        step: "1"
        locator: "§4.1 second list step 1"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L542"
            quote: "The software transforms the incoming data into a document that can be understood by the applicable algorithm provided in Section 4.4 Verify Proof or Section 4.5 Verify Proof Sets and Chains."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0174"
      - id: "T02"
        from: "transformed"
        to: "schema-valid"
        trigger: "step 2"
        guard: "schema validation passes"
        action: "none"
        step: "2"
        locator: "§4.1 second list step 2"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L543"
            quote: "The software uses JSON Schema or an equivalent mechanism to validate that the incoming document follows an expected schema used by the application."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0175"
      - id: "T03"
        from: "transformed"
        to: "schema-invalid"
        trigger: "step 2"
        guard: "it fails"
        action: "produce an error"
        step: "2"
        locator: "§4.1 second list step 2"
        kind: "inferred"
        inferred_reason: "§4.1 states the check, not its failure; §1.3 is general."
        normative_status: "normative"
        quotes:
          - source_lines: "L543"
            quote: "The software uses JSON Schema or an equivalent mechanism to validate that the incoming document follows an expected schema used by the application."
          - source_lines: "L169"
            quote: "Conforming processors MUST produce errors when non-conforming documents are consumed."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0001"
          - "w3c-vc-data-integrity-1-0#R-0175"
      - id: "T04"
        from: "schema-valid"
        to: "integrity-verified"
        trigger: "step 3"
        guard: "verified true"
        action: "none"
        step: "3"
        locator: "§4.1 second list step 3"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L544"
            quote: "The software uses the applicable algorithm(s) provided in Section 4.4 Verify Proof or Section 4.5 Verify Proof Sets and Chains to verify the integrity of the incoming document."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0176"
      - id: "T05"
        from: "schema-valid"
        to: "not-verified"
        trigger: "step 3"
        guard: "verified false or an error"
        action: "none stated"
        step: "3"
        locator: "§4.1 second list step 3"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L544"
            quote: "The software uses the applicable algorithm(s) provided in Section 4.4 Verify Proof or Section 4.5 Verify Proof Sets and Chains to verify the integrity of the incoming document."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0176"
      - id: "T06"
        from: "integrity-verified"
        to: "trusted"
        trigger: "step 4 skipped"
        guard: "not a JSON-LD document"
        action: "use the returned document"
        step: "4"
        locator: "§4.1 second list step 4"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L545"
            quote: "If the document is a JSON-LD document, the software uses the algorithm provided in Section 4.6 Context Validation, or one providing equivalent protections, to validate all JSON-LD Context values used in the document."
          - source_lines: "L734"
            quote: "Implementers and developers are urged to not trust information that contains a data integrity proof unless the proof has been verified and the verified data is provided in a return value from a software library that has confirmed that all data returned has been successfully protected."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0177"
      - id: "T07"
        from: "integrity-verified"
        to: "trusted"
        trigger: "step 4"
        guard: "JSON-LD and validated true"
        action: "use validatedDocument"
        step: "4"
        locator: "§4.1 second list step 4"
        kind: "stated"
        normative_status: "normative"
        defects:
          - "D-17"
        quotes:
          - source_lines: "L545"
            quote: "If the document is a JSON-LD document, the software uses the algorithm provided in Section 4.6 Context Validation, or one providing equivalent protections, to validate all JSON-LD Context values used in the document."
          - source_lines: "L435"
            quote: "Context validation MUST be run after running the applicable algorithm in either Section 4.4 Verify Proof or Section 4.5 Verify Proof Sets and Chains."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0030"
          - "w3c-vc-data-integrity-1-0#R-0177"
      - id: "T08"
        from: "integrity-verified"
        to: "contexts-invalid"
        trigger: "step 4"
        guard: "JSON-LD and validated false"
        action: "none stated"
        step: "4"
        locator: "§4.1 second list step 4"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L545"
            quote: "If the document is a JSON-LD document, the software uses the algorithm provided in Section 4.6 Context Validation, or one providing equivalent protections, to validate all JSON-LD Context values used in the document."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0177"
  - id: "SM09"
    name: "proof-validity-window"
    title: "A proof's validity period at a time of interest"
    locator: "§2.6, §2.1"
    basis: "inferred from §2.1 (created, expires) and §2.6"
    normative_status: "normative"
    summary: >-
      Where the time of interest falls against created and expires. No algorithm step and no error
      code carry this (D-15); boundary inclusion is not stated.
    flows:
      - "F13"
    note: "Values without a time-zone offset may be accepted and read as UTC (§2.1)."
    defects:
      - "D-15"
    initial: "unevaluated"
    final_states:
      - "within-period"
    error_states:
      - "not-yet-valid"
      - "expired"
    states:
      - name: "unevaluated"
        kind: "initial"
        description: "A proof and a time of interest (now or another time)."
      - name: "within-period"
        kind: "final"
        description: "created absent or not after the time, and expires absent or not before it."
      - name: "not-yet-valid"
        kind: "error"
        description: "The time is before created. No code exists."
      - name: "expired"
        kind: "error"
        description: "The time is after expires. No code exists."
    transitions:
      - id: "T01"
        from: "unevaluated"
        to: "within-period"
        trigger: "validity check"
        guard: "between created and expires (absent bounds read as open)"
        action: "none"
        locator: "§2.6 ¶3"
        kind: "inferred"
        inferred_reason: >-
          Stated as important, outside any algorithm; open bounds for absent properties are this file's
          reading.
        normative_status: "normative"
        quotes:
          - source_lines: "L485"
            quote: "When verifying a proof, it is important to ensure that the time of interest (which might be the current time or any other time) is within the validity period for the proof (that is, between created and expires )."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0151"
          - "w3c-vc-data-integrity-1-0#R-0152"
      - id: "T02"
        from: "unevaluated"
        to: "not-yet-valid"
        trigger: "validity check"
        guard: "before created"
        action: "none stated"
        locator: "§2.1 ¶14 (created)"
        kind: "inferred"
        inferred_reason: >-
          created is when the proof was made; §2.6 places validity between created and expires.
        normative_status: "normative"
        quotes:
          - source_lines: "L215"
            quote: "The date and time the proof was created is OPTIONAL"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0097"
          - "w3c-vc-data-integrity-1-0#R-0152"
      - id: "T03"
        from: "unevaluated"
        to: "expired"
        trigger: "validity check"
        guard: "after expires"
        action: "none stated"
        locator: "§2.1 ¶16 (expires)"
        kind: "inferred"
        inferred_reason: "expires is defined as when the proof expires; no step acts on it."
        normative_status: "normative"
        quotes:
          - source_lines: "L217"
            quote: "The expires property is OPTIONAL and, if present, specifies when the proof expires."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0100"
          - "w3c-vc-data-integrity-1-0#R-0152"
  - id: "SM10"
    name: "challenge"
    title: "A challenge value from issue to use"
    locator: "§4.2, §4.4, §2.1"
    basis: "inferred from §2.1 (challenge, domain), §4.2 step 4, §4.4 step 7"
    normative_status: "normative"
    summary: >-
      Single use per domain and time window is stated as a property of the value; issuing, retiring
      and refusing a replay are this file's.
    flows:
      - "F14"
    initial: "issued"
    final_states:
      - "spent"
    error_states:
      - "mismatched"
      - "replayed"
    states:
      - name: "issued"
        kind: "initial"
        description: "The verifier chose a challenge for a domain and time window."
      - name: "bound"
        kind: "intermediate"
        description: "A proof carries it (§4.2 step 4 checked createProof copied it)."
      - name: "accepted"
        kind: "intermediate"
        description: "§4.4 step 7 matched it."
      - name: "spent"
        kind: "final"
        description: "Used once; must not be accepted again in that domain and window."
      - name: "mismatched"
        kind: "error"
        description: "INVALID_CHALLENGE_ERROR."
      - name: "replayed"
        kind: "error"
        description: "A spent challenge presented again; no step or code covers it."
    transitions:
      - id: "T01"
        from: "issued"
        to: "bound"
        trigger: "Add Proof with options.challenge"
        guard: "proof.challenge equals it"
        action: "none"
        step: "4"
        locator: "§4.2 step 4"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L553"
            quote: "If options has a non-null challenge item, it MUST be equal to proof.challenge or an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0186"
          - "w3c-vc-data-integrity-1-0#R-0187"
      - id: "T02"
        from: "bound"
        to: "accepted"
        trigger: "Verify Proof with challenge"
        guard: "equal to proof.challenge"
        action: "none"
        step: "7"
        locator: "§4.4 step 7"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L606"
            quote: "If challenge was given, and it does not match proof.challenge, an error MUST be raised and SHOULD convey an error type of INVALID_CHALLENGE_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0231"
          - "w3c-vc-data-integrity-1-0#R-0232"
      - id: "T03"
        from: "bound"
        to: "mismatched"
        trigger: "Verify Proof with challenge"
        guard: "different"
        action: "raise an error"
        step: "7"
        locator: "§4.4 step 7"
        kind: "stated"
        error_code: "INVALID_CHALLENGE_ERROR"
        normative_status: "normative"
        quotes:
          - source_lines: "L606"
            quote: "If challenge was given, and it does not match proof.challenge, an error MUST be raised and SHOULD convey an error type of INVALID_CHALLENGE_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0231"
          - "w3c-vc-data-integrity-1-0#R-0232"
      - id: "T04"
        from: "accepted"
        to: "spent"
        trigger: "verifier retires the value"
        guard: "always"
        action: "record it as used"
        locator: "§2.1 ¶20 (challenge)"
        kind: "inferred"
        inferred_reason: "Single use is stated; recording it is not."
        normative_status: "normative"
        quotes:
          - source_lines: "L221"
            quote: "The value is used once for a particular domain and window of time."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0105"
          - "w3c-vc-data-integrity-1-0#R-0233"
      - id: "T05"
        from: "spent"
        to: "replayed"
        trigger: "the same challenge presented again"
        guard: "same domain and window"
        action: "refuse"
        locator: "§2.1 ¶20 (challenge)"
        kind: "inferred"
        inferred_reason: "Replay mitigation is the stated purpose; §4.4 checks only equality."
        normative_status: "normative"
        quotes:
          - source_lines: "L221"
            quote: "This value is used to mitigate replay attacks. Examples of a challenge value include: 1235abcd6789, 79d34551-ae81-44ae-823b-6dadbab9ebd4, and ruby."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0233"
  - id: "SM11"
    name: "context-document-resolution"
    title: "A JSON-LD context URL from reference to known-good"
    locator: "§2.4, §4.6"
    basis: "stated pieces (§2.4, §4.6 step 3, §5.14) in an inferred order"
    normative_status: "normative"
    summary: "Pinned, cached or fetched, then compared to a known value or hash."
    flows:
      - "F10"
      - "F11"
    initial: "referenced"
    final_states:
      - "known-good"
    error_states:
      - "mismatch"
    states:
      - name: "referenced"
        kind: "initial"
        description: "A context URL appears in @context."
      - name: "pinned"
        kind: "intermediate"
        description: "One of the three URLs §2.4 pins; treated as already resolved."
      - name: "cached"
        kind: "intermediate"
        description: "An application-specific context held in a permanent cache."
      - name: "fetched"
        kind: "intermediate"
        description: "Loaded from the network (development, or a first encounter)."
      - name: "known-good"
        kind: "final"
        description: "Matches a known good value or hash."
      - name: "mismatch"
        kind: "error"
        description: "Does not match; an error under §4.6 unless recompaction succeeds."
    transitions:
      - id: "T01"
        from: "referenced"
        to: "pinned"
        trigger: "resolve"
        guard: "the URL is pinned in §2.4"
        action: "use the pinned document"
        locator: "§2.4 ¶1"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L406"
            quote: "Implementations that perform JSON-LD processing MUST treat the following JSON-LD context URLs as already resolved, where the resolved document matches the corresponding hash values below:"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0124"
      - id: "T02"
        from: "referenced"
        to: "cached"
        trigger: "resolve"
        guard: "a permanently cached copy exists"
        action: "use it"
        locator: "§2.4 ¶24"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L429"
            quote: "SHOULD permanently cache JSON-LD context files used by conforming secured documents in production settings"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0138"
      - id: "T03"
        from: "referenced"
        to: "fetched"
        trigger: "resolve"
        guard: "no pinned or cached copy"
        action: "fetch, defensively"
        locator: "§2.4 ¶24"
        kind: "stated"
