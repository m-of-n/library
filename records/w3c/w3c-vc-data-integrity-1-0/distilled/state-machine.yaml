  - id: "SM05"
    name: "proof-structure-of-a-document"
    title: "Lifecycle of a document's proof property"
    locator: "§4.2, §4.3, Appendix A, §4.5"
    basis: "stated transitions (§4.2, §4.3, §2.1.1, §2.1.2) plus non-normative removal (Appendix A)"
    normative_status: "normative"
    summary: >-
      What the proof property of one document goes through as proofs are added and, in transit,
      removed.
    flows:
      - "F04"
      - "F05"
      - "F15"
      - "F16"
    note: >-
      Each proof sits in its own proof graph (§2.1.3); that is a data-model property with no state.
    defects:
      - "D-11"
      - "D-13"
    initial: "unsecured"
    error_states:
      - "broken-chain"
    states:
      - name: "unsecured"
        kind: "initial"
        description: "No proof value."
        quotes:
          - source_lines: "L531"
            quote: "An unsecured data document is a map that contains no proof values."
      - name: "single-proof"
        kind: "intermediate"
        description: "proof is one object."
      - name: "proof-set"
        kind: "intermediate"
        description: "proof is a list and no member names another: order does not matter."
        quotes:
          - source_lines: "L303"
            quote: "A proof set, which has no order, is represented by associating a set of proofs with the proof key in a document."
      - name: "proof-chain"
        kind: "intermediate"
        description: "proof is a list in which some proof names another through previousProof."
        quotes:
          - source_lines: "L333"
            quote: "A proof chain, where proof order needs to be preserved, is expressed by providing at least one proof with an id, such as a UUID [RFC9562], and another proof with a previousProof value that identifies the previous proof."
      - name: "broken-chain"
        kind: "error"
        description: >-
          A proof that another proof's previousProof names has been removed; verification raises
          PROOF_VERIFICATION_ERROR at §4.5 step 3.2.
    transitions:
      - id: "T01"
        from: "unsecured"
        to: "single-proof"
        trigger: "Add Proof (§4.2)"
        guard: "§4.2 succeeds"
        action: "proof = the new proof"
        step: "6"
        locator: "§4.2 step 6"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L555"
            quote: "Set securedDataDocument.proof to the value of proof."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0190"
      - id: "T02"
        from: "single-proof"
        to: "single-proof"
        trigger: "Add Proof (§4.2) again"
        guard: "§4.2 succeeds"
        action: "the earlier proof is replaced"
        step: "6"
        locator: "§4.2 step 6"
        kind: "stated"
        normative_status: "normative"
        defects:
          - "D-13"
        quotes:
          - source_lines: "L555"
            quote: "Set securedDataDocument.proof to the value of proof."
          - source_lines: "L531"
            quote: "An input document is an map that has not yet had the current proof added to it, but it MAY contain a proof value that was added to it by a previous process."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0055"
          - "w3c-vc-data-integrity-1-0#R-0190"
          - "w3c-vc-data-integrity-1-0#R-0191"
      - id: "T03"
        from: "single-proof"
        to: "proof-set"
        trigger: "Add Proof Set/Chain (§4.3)"
        guard: "no options.previousProof"
        action: "proof becomes a two-element list"
        step: "8"
        locator: "§4.3 step 8"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L570"
            quote: "Set output.proof to the value of allProofs."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0207"
          - "w3c-vc-data-integrity-1-0#R-0290"
      - id: "T04"
        from: "single-proof"
        to: "proof-chain"
        trigger: "Add Proof Set/Chain (§4.3)"
        guard: "options.previousProof names the existing proof's id (so it must have one)"
        action: "proof becomes a two-element chain"
        step: "4"
        locator: "§4.3 step 4"
        kind: "stated"
        normative_status: "normative"
        defects:
          - "D-11"
        quotes:
          - source_lines: "L564"
            quote: "If options has a previousProof item that is a string, add the element from allProofs with an id attribute matching previousProof to matchingProofs. If a proof with id equal to previousProof does not exist in allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
          - source_lines: "L333"
            quote: "A proof chain, where proof order needs to be preserved, is expressed by providing at least one proof with an id, such as a UUID [RFC9562], and another proof with a previousProof value that identifies the previous proof."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0113"
          - "w3c-vc-data-integrity-1-0#R-0197"
          - "w3c-vc-data-integrity-1-0#R-0199"
          - "w3c-vc-data-integrity-1-0#R-0200"
          - "w3c-vc-data-integrity-1-0#R-0206"
      - id: "T05"
        from: "proof-set"
        to: "proof-set"
        trigger: "Add Proof Set/Chain (§4.3)"
        guard: "no options.previousProof"
        action: "one more member"
        step: "8"
        locator: "§4.3 step 8"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L570"
            quote: "Set output.proof to the value of allProofs."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0207"
          - "w3c-vc-data-integrity-1-0#R-0290"
      - id: "T06"
        from: "proof-set"
        to: "proof-chain"
        trigger: "Add Proof Set/Chain (§4.3)"
        guard: "options.previousProof names existing ids"
        action: "first link"
        step: "5"
        locator: "§4.3 step 5"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L565"
            quote: "If options has a previousProof item that is an array, add each element from allProofs with an id attribute that matches an element of that array. If any element of previousProof list has an id attribute that does not match the id attribute of any element of allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0201"
          - "w3c-vc-data-integrity-1-0#R-0202"
          - "w3c-vc-data-integrity-1-0#R-0203"
          - "w3c-vc-data-integrity-1-0#R-0206"
      - id: "T07"
        from: "proof-chain"
        to: "proof-chain"
        trigger: "Add Proof Set/Chain (§4.3)"
        guard: "any options"
        action: "one more proof"
        step: "8"
        locator: "§4.3 step 8"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L570"
            quote: "Set output.proof to the value of allProofs."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0207"
      - id: "T08"
        from: "proof-set"
        to: "proof-set"
        trigger: "an intermediary removes a member"
        guard: "the removed proof is named by no other"
        action: "the rest still verify"
        locator: "Appendix A ¶10"
        kind: "stated"
        normative_status: "non-normative (Appendix A)"
        quotes:
          - source_lines: "L871"
            quote: "A holder or any other intermediary receiving a secured data document containing a proof set is able to remove any of the proof values within the set prior to passing it on to another entity and the secured data document will still verify."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0290"
      - id: "T09"
        from: "proof-chain"
        to: "broken-chain"
        trigger: "an intermediary removes a named proof"
        guard: "another proof's previousProof names it"
        action: "verification of the naming proof fails"
        step: "3.2"
        locator: "§4.5 step 3.2"
        kind: "inferred"
        inferred_reason: >-
          Appendix A shows removal only for sets; the consequence for a chain follows from §4.5 step 3.2.
        error_code: "PROOF_VERIFICATION_ERROR"
        normative_status: "normative"
        quotes:
          - source_lines: "L624"
            quote: "If proof contains a previousProof attribute and the value of that attribute is a string, add the element from allProofs with an id attribute value matching the value of previousProof to matchingProofs. If a proof with id value equal to the value of previousProof does not exist in allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_VERIFICATION_ERROR. If the previousProof attribute is a list, add each element from allProofs with an id attribute value that matches the value of an element of that list. If any element of previousProof list has an id attribute value that does not match the id attribute value of any element of allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_VERIFICATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0246"
          - "w3c-vc-data-integrity-1-0#R-0247"
          - "w3c-vc-data-integrity-1-0#R-0248"
          - "w3c-vc-data-integrity-1-0#R-0249"
          - "w3c-vc-data-integrity-1-0#R-0250"
          - "w3c-vc-data-integrity-1-0#R-0251"
  - id: "SM06"
    name: "context-validation"
    title: "Context Validation"
    locator: "§4.6"
    basis: "stated (§4.6)"
    normative_status: "normative"
    summary: >-
      Three triggering conditions; recompaction or an error; validated is true exactly when no error
      was added.
    flows:
      - "F10"
    note: "Recompaction is not followed by a second check of the recompacted document."
    defects:
      - "D-07"
      - "D-08"
      - "D-17"
    initial: "invoked"
    final_states:
      - "validated"
    error_states:
      - "not-validated"
    states:
      - name: "invoked"
        kind: "initial"
        description: "inputDocument, knownContext, recompact received."
      - name: "initialised"
        kind: "intermediate"
        description: >-
          result: validated false, empty warnings and errors, validatedDocument a clone; contextValue
          read.
      - name: "recompacting"
        kind: "intermediate"
        description: "JSON-LD compaction of inputDocument with knownContext."
      - name: "errors-recorded"
        kind: "intermediate"
        description: "at least one error in result.errors."
      - name: "decided"
        kind: "intermediate"
        description: "step 4 about to run."
      - name: "validated"
        kind: "final"
        description: "validated true; validatedDocument is the clone or the recompacted document."
      - name: "not-validated"
        kind: "error"
        description: "validated false; the document is removed (D-07)."
    transitions:
      - id: "T01"
        from: "invoked"
        to: "initialised"
        trigger: "steps 1-2"
        guard: "always"
        action: "initialise result; contextValue = @context"
        step: "1"
        locator: "§4.6 step 1"
        kind: "stated"
        normative_status: "normative"
        defects:
          - "D-08"
        quotes:
          - source_lines: "L650"
            quote: "Set result.validated to false, result.warnings to an empty list, result.errors to an empty list, compactionContext to an empty list; and clone inputDocument to result.validatedDocument."
          - source_lines: "L651"
            quote: "Let contextValue be the value of the @context property of result.validatedDocument, which might be undefined."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0266"
          - "w3c-vc-data-integrity-1-0#R-0267"
      - id: "T02"
        from: "initialised"
        to: "decided"
        trigger: "step 3 test"
        guard: >-
          contextValue deeply equals knownContext, no subtree has @context, and every context URI resolves
          to a known value or hash
        action: "none"
        step: "3"
        locator: "§4.6 step 3"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L652"
            quote: "If contextValue does not deeply equal knownContext, any subtree in result.validatedDocument contains an @context property, or any URI in contextValue dereferences to a JSON-LD Context file that does not match a known good value or cryptographic hash, then perform the applicable action:"
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0268"
      - id: "T03"
        from: "initialised"
        to: "recompacting"
        trigger: "step 3 test"
        guard: "a condition holds and recompact is true"
        action: "run the JSON-LD Compaction Algorithm"
        step: "3.1"
        locator: "§4.6 step 3.1"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L652"
            quote: "If contextValue does not deeply equal knownContext, any subtree in result.validatedDocument contains an @context property, or any URI in contextValue dereferences to a JSON-LD Context file that does not match a known good value or cryptographic hash, then perform the applicable action:"
          - source_lines: "L653"
            quote: "If recompact is true, set result.validatedDocument to the result of running the JSON-LD Compaction Algorithm with the inputDocument and knownContext as inputs. If the compaction fails, add at least one error to result.errors."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0268"
          - "w3c-vc-data-integrity-1-0#R-0269"
      - id: "T04"
        from: "initialised"
        to: "errors-recorded"
        trigger: "step 3 test"
        guard: "a condition holds and recompact is not true"
        action: "add at least one error"
        step: "3.2"
        locator: "§4.6 step 3.2"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L654"
            quote: "If recompact is not true, add at least one error to result.errors."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0270"
      - id: "T05"
        from: "recompacting"
        to: "decided"
        trigger: "compaction result"
        guard: "compaction succeeds"
        action: "validatedDocument = the compacted document"
        step: "3.1"
        locator: "§4.6 step 3.1"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L653"
            quote: "If recompact is true, set result.validatedDocument to the result of running the JSON-LD Compaction Algorithm with the inputDocument and knownContext as inputs. If the compaction fails, add at least one error to result.errors."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0269"
      - id: "T06"
        from: "recompacting"
        to: "errors-recorded"
        trigger: "compaction result"
        guard: "compaction fails"
        action: "add at least one error"
        step: "3.1"
        locator: "§4.6 step 3.1"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L653"
            quote: "If the compaction fails, add at least one error to result.errors."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0269"
      - id: "T07"
        from: "errors-recorded"
        to: "decided"
        trigger: "step 4"
        guard: "always"
        action: "none"
        step: "4"
        locator: "§4.6 step 4"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L655"
            quote: "If result.errors is empty, set result.validated to true; otherwise, set result.validated to false, and remove the document property from result."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0271"
      - id: "T08"
        from: "decided"
        to: "validated"
        trigger: "step 4 test"
        guard: "result.errors is empty"
        action: "validated = true; return"
        step: "4"
        locator: "§4.6 step 4"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L655"
            quote: "If result.errors is empty, set result.validated to true; otherwise, set result.validated to false, and remove the document property from result."
          - source_lines: "L656"
            quote: "Return the value of result."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0271"
          - "w3c-vc-data-integrity-1-0#R-0272"
      - id: "T09"
        from: "decided"
        to: "not-validated"
        trigger: "step 4 test"
        guard: "result.errors is not empty"
        action: "validated = false; remove the document; return"
        step: "4"
        locator: "§4.6 step 4"
        kind: "stated"
        normative_status: "normative"
        defects:
          - "D-07"
        quotes:
          - source_lines: "L655"
            quote: "If result.errors is empty, set result.validated to true; otherwise, set result.validated to false, and remove the document property from result."
          - source_lines: "L656"
            quote: "Return the value of result."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0271"
          - "w3c-vc-data-integrity-1-0#R-0272"
      - id: "T10"
        from: "decided"
        to: "not-validated"
        trigger: "implementation rule"
        guard: "an implementation-specific error was added"
        action: "as T09"
        locator: "§4.6 ¶19"
        kind: "inferred"
        inferred_reason: >-
          The source allows extra errors without placing them in the steps; one added before step 4 leads
          here.
        normative_status: "normative"
        quotes:
          - source_lines: "L657"
            quote: "Implementations MAY include additional warnings or errors that enforce further validation rules that are specific to the implementation or a particular use case."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0074"
  - id: "SM07"
    name: "verification-method-retrieval"
    title: "Verification method retrieval and binding"
    locator: "§2.1, §5.14, §5.9, §5.10, §2.6"
    basis: "inferred composition of §2.1, §2.6, §5.9, §5.10, §5.14; the algorithm is Controlled Identifiers v1.0 §3.3's"
    normative_status: "normative (§5.9, §5.10) and inferred order"
    summary: >-
      The order is this file's: locate, dereference, bind, check the relationship, optionally match
      the controller to the issuer or holder. Every failure exit is unspecified by this source.
    flows:
      - "F12"
    note: "did:key and cached methods take T01 without a network request (§5.14)."
    initial: "proof-in-hand"
    final_states:
      - "usable"
    error_states:
      - "retrieval-failed"
      - "binding-failed"
      - "relationship-invalid"
      - "controller-mismatch"
    states:
      - name: "proof-in-hand"
        kind: "initial"
        description: "A proof that passed §4.4 step 4 (or a member of a proof list)."
      - name: "referenced"
        kind: "intermediate"
        description: "proof.verificationMethod holds a URL."
      - name: "located-otherwise"
        kind: "intermediate"
        description: >-
          No verificationMethod; another property such as cryptosuite may say how to get the key.
      - name: "document-obtained"
        kind: "intermediate"
        description: >-
          The controlled identifier document is in hand, fetched, cached or derived without a fetch
          (did:key).
      - name: "bound"
        kind: "intermediate"
        description: "The document references the verification method back."
      - name: "relationship-valid"
        kind: "intermediate"
        description: "The method is listed under the relationship the proof's purpose needs."
      - name: "usable"
        kind: "final"
        description: "The key may be used to check the proof."
      - name: "retrieval-failed"
        kind: "error"
        description: "unspecified by source"
      - name: "binding-failed"
        kind: "error"
        description: "unspecified by source"
      - name: "relationship-invalid"
        kind: "error"
        description: "unspecified by source"
      - name: "controller-mismatch"
        kind: "error"
        description: >-
          unspecified by source; only for credentials and presentations, and only where the application
          makes this check.
    transitions:
      - id: "T00"
        from: "proof-in-hand"
        to: "referenced"
        trigger: "read verificationMethod"
        guard: "present"
        action: "none"
        locator: "§2.1 ¶10 (verificationMethod)"
        kind: "stated"
