not_modelled:
  - what: "cryptosuite instance"
    why: >-
      The source gives it no lifecycle: a struct of two algorithms, instantiated by an algorithm with
      no stated failure, reuse or teardown.
    quotes:
      - source_lines: "L512"
        quote: "A cryptosuite instance is instantiated using a cryptosuite instantiation algorithm and is made available to algorithms in an implementation-specific manner."
  - what: "transformation, hashing, proof serialization and proof verification"
    why: >-
      Each is defined per cryptosuite specification; this document only requires that they be
      specified.
    quotes:
      - source_lines: "L494"
        quote: "The specification MUST detail the transformation algorithms (if any), parameters, and other necessary details, used to modify input data into the data to be protected."
      - source_lines: "L497"
        quote: "The specification MUST detail the proof verification algorithms, parameters, and other necessary details used to perform cryptographic verification of the data."
  - what: "JSON-LD data-loss detection and poisoned datasets"
    why: >-
      Error paths inside a transformation, not states of their own; they surface as SM03
      creation-failed or SM01 incomplete.
    quotes:
      - source_lines: "L452"
        quote: "Implementations that use JSON-LD processing, such as RDF Dataset Canonicalization [RDF-CANON], MUST throw an error, which SHOULD be DATA_LOSS_DETECTION_ERROR, when data is dropped by a JSON-LD processor, such as when an undefined term is detected in an input document."
  - what: "resource integrity (digestMultibase)"
    why: "A property with no comparison algorithm and no outcome to model."
    quotes:
      - source_lines: "L388"
        quote: "If present, the digestMultibase value MUST be a single string value, or an list of string values, each of which is a Multibase-encoded Multihash value."
  - what: "error reporting"
    why: "A stateless mapping of codes to ProblemDetails."
    quotes:
      - source_lines: "L663"
        quote: "The type value of the error object MUST be a URL that starts with the value https://w3id.org/security# and ends with the value in the section listed below."
  - what: "proof graphs"
    why: "A data-model separation, not a lifecycle."
    quotes:
      - source_lines: "L366"
        quote: "Each value associated with the proof property of the document identifies a separate graph, which is sometimes referred to as a named graph, of type ProofGraph, which contains a single data integrity proof."
  - what: "selective disclosure and unlinkability"
    why: "Cryptosuite capabilities the document describes but does not define."
    quotes:
      - source_lines: "L801"
        quote: "Not all software or cryptosuites are capable of providing selective disclosure. If the author of a message wishes it to be selectively disclosable by its recipient, then they need to enable selective disclosure on the specific message, and both need to use a capable cryptosuite. The author might also make it mandatory to disclose certain parts of the message. A recipient that wants to selectively disclose partial content of the message needs to utilize software that is able to perform the technique. An example of a cryptosuite that supports selective disclosure is bbs-2023."
  - what: "credential validity and status (validFrom, validUntil, credentialStatus), verification-method revocation and expiry"
    why: >-
      Owned by the VC Data Model and Controlled Identifiers respectively; this document only contrasts
      them with a proof's own period.
    quotes:
      - source_lines: "L486"
        quote: "The revocation and expiration times for a verification method are expressed using the revocation and expires properties, respectively;"
