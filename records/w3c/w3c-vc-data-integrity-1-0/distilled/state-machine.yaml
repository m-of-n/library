  - id: "SM03"
    name: "add-proof"
    title: "Add Proof"
    locator: "§4.2"
    basis: "stated (§4.2)"
    normative_status: "normative"
    summary: >-
      Linear: create, check, attach, return. Two kinds of failure: the cryptosuite's own error,
      propagated, or PROOF_GENERATION_ERROR from the three checks.
    flows:
      - "F04"
    defects:
      - "D-13"
      - "D-20"
    initial: "invoked"
    final_states:
      - "returned"
    error_states:
      - "creation-failed"
      - "generation-error"
    states:
      - name: "invoked"
        kind: "initial"
        description: "inputDocument, cryptosuite instance and options received."
      - name: "proof-created"
        kind: "intermediate"
        description: "createProof returned a proof."
      - name: "required-present"
        kind: "intermediate"
        description: "type, verificationMethod and proofPurpose are set."
      - name: "domain-ok"
        kind: "intermediate"
        description: "No domain requested, or proof.domain equals it."
      - name: "challenge-ok"
        kind: "intermediate"
        description: "No challenge requested, or proof.challenge equals it."
      - name: "attached"
        kind: "intermediate"
        description: >-
          securedDataDocument is a copy of inputDocument with proof set; any earlier proof property is
          replaced (D-13).
      - name: "returned"
        kind: "final"
        description: "securedDataDocument returned."
      - name: "creation-failed"
        kind: "error"
        description: "createProof produced an error; propagated, conveying its type."
      - name: "generation-error"
        kind: "error"
        description: "An error conveying PROOF_GENERATION_ERROR."
    transitions:
      - id: "T01"
        from: "invoked"
        to: "proof-created"
        trigger: "call createProof"
        guard: "createProof returns a proof"
        action: "proof = result"
        step: "1"
        locator: "§4.2 step 1"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L550"
            quote: "Let proof be the result of calling the createProof algorithm specified in cryptosuite.createProof with inputDocument and options passed as a parameters. If the algorithm produces an error, the error MUST be propagated and SHOULD convey the error type."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0179"
