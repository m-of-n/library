  - id: "SM04"
    name: "add-proof-set-chain"
    title: "Add Proof Set/Chain"
    locator: "§4.3"
    basis: "stated (§4.3)"
    normative_status: "normative"
    summary: >-
      Collect the existing proofs, bind the ones options.previousProof names, run §4.2 steps 1-6 over
      that, append. options.previousProof selects set member (absent), single link (string) or
      multi-link (array).
    flows:
      - "F05"
    note: >-
      A securedDocument with no proof at all is not handled by step 1 (allProofs stays empty); not
      modelled.
    defects:
      - "D-10"
      - "D-11"
      - "D-12"
      - "D-19"
    initial: "invoked"
    final_states:
      - "returned"
    error_states:
      - "previous-missing"
      - "generation-failed"
    states:
      - name: "invoked"
        kind: "initial"
        description: "securedDocument, suite and options received."
      - name: "proofs-collected"
        kind: "intermediate"
        description: "allProofs holds copies of the existing proof or proofs."
      - name: "input-prepared"
        kind: "intermediate"
        description: "inputDocument and output are copies without proof; matchingProofs empty."
      - name: "previous-resolved"
        kind: "intermediate"
        description: >-
          matchingProofs holds the proofs options.previousProof names (none for a set member).
      - name: "input-bound"
        kind: "intermediate"
        description: "inputDocument.proof = matchingProofs."
      - name: "proof-generated"
        kind: "intermediate"
        description: "§4.2 steps 1-6 produced a proof; appended to allProofs."
      - name: "returned"
        kind: "final"
        description: "output, with proof = allProofs (always a list), returned."
      - name: "previous-missing"
        kind: "error"
        description: >-
          An error conveying PROOF_GENERATION_ERROR: a previousProof value names no existing proof.
      - name: "generation-failed"
        kind: "error"
        description: >-
          An exception from §4.2 steps 1-6, raised again: SM03's creation-failed or generation-error.
    transitions:
      - id: "T01"
        from: "invoked"
        to: "proofs-collected"
        trigger: "step 1"
        guard: "securedDocument.proof is a list or an object"
        action: "copy the elements, or the object, into allProofs"
        step: "1"
        locator: "§4.3 step 1"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L561"
            quote: "Let proof be set to securedDocument.proof. Let allProofs be an empty list. If proof is a list, copy all the elements of proof to allProofs. If proof is an object add a copy of that object to allProofs."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0194"
      - id: "T02"
        from: "proofs-collected"
        to: "input-prepared"
        trigger: "steps 2-3"
        guard: "always"
        action: "strip proof; copy to output; matchingProofs = empty"
        step: "2"
        locator: "§4.3 step 2"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L562"
            quote: "Let the inputDocument be a copy of the securedDocument with the proof attribute removed. Let output be a copy of the inputDocument."
          - source_lines: "L563"
            quote: "Let matchingProofs be an empty list."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0195"
          - "w3c-vc-data-integrity-1-0#R-0196"
      - id: "T03"
        from: "input-prepared"
        to: "previous-resolved"
        trigger: "options test"
        guard: "options has no previousProof"
        action: "none: the new proof is a set member"
        locator: "§4.3 step 6"
        kind: "inferred"
        inferred_reason: "Steps 4 and 5 are both conditional; neither firing leaves matchingProofs empty."
        normative_status: "normative"
        quotes:
          - source_lines: "L566"
            quote: "Set inputDocument.proof to matchingProofs."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0204"
          - "w3c-vc-data-integrity-1-0#R-0290"
      - id: "T04"
        from: "input-prepared"
        to: "previous-resolved"
        trigger: "step 4"
        guard: "previousProof is a string naming an existing id"
        action: "add that proof"
        step: "4"
        locator: "§4.3 step 4"
        kind: "stated"
        normative_status: "normative"
        defects:
          - "D-19"
        quotes:
          - source_lines: "L564"
            quote: "If options has a previousProof item that is a string, add the element from allProofs with an id attribute matching previousProof to matchingProofs. If a proof with id equal to previousProof does not exist in allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_GENERATION_ERROR."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0197"
          - "w3c-vc-data-integrity-1-0#R-0199"
          - "w3c-vc-data-integrity-1-0#R-0200"
          - "w3c-vc-data-integrity-1-0#R-0198"
