  - id: "SM02"
    name: "verify-proof-sets-and-chains"
    title: "Verify Proof Sets and Chains, as printed"
    locator: "§4.5"
    basis: "stated (§4.5) with the source's defects kept; two exits unspecified"
    normative_status: "normative"
    summary: >-
      Per-proof loop, then aggregation. Modelled exactly as printed, so the status/verified mismatch
      (D-01) shows as a guard that can never be true, and a proof whose checks raise simply drops out
      (D-04).
    flows:
      - "F09"
    note: >-
      previous-unresolved has no outgoing transition: the source does not say whether the loop
      continues. A repaired reading (inferred, not modelled as a machine) would carry the current
      proof into verifyProof, fail the combined result on any dropped or unresolved proof, and use one
      field name for status.
    defects:
      - "D-01"
      - "D-02"
      - "D-03"
      - "D-04"
      - "D-05"
      - "D-19"
      - "D-21"
    initial: "invoked"
    final_states:
      - "returned"
    error_states:
      - "previous-unresolved"
      - "proof-dropped"
    states:
      - name: "invoked"
        kind: "initial"
        description: "securedDocument received; its proof is expected to be a list (D-05)."
      - name: "iterating"
        kind: "intermediate"
        description: "allProofs set; verificationResults collecting; a proof may be next."
      - name: "resolving-previous"
        kind: "intermediate"
        description: "matchingProofs empty; previousProof being resolved."
      - name: "input-built"
        kind: "intermediate"
        description: >-
          inputDocument = securedDocument without proof, proof = matchingProofs; the proof under iteration
          is not in it (D-03).
      - name: "checking-proof"
        kind: "intermediate"
        description: "§4.4 steps 4-8 running on inputDocument."
      - name: "aggregating"
        kind: "intermediate"
        description: >-
          combined result initialised: status true, document null, mediaType null; successful list empty.
      - name: "finalising"
        kind: "intermediate"
        description: "every per-proof result folded in."
      - name: "returned"
        kind: "final"
        description: "combinedVerificationResult and successfulVerificationResults returned."
      - name: "previous-unresolved"
        kind: "error"
        description: >-
          A previousProof id matched no proof: an error conveying PROOF_VERIFICATION_ERROR. Whether this
          ends the algorithm or only the iteration is unspecified.
      - name: "proof-dropped"
        kind: "error"
        description: >-
          §4.4 steps 4-8 raised for this proof; nothing is appended and nothing else happens (D-04). Not
          terminal by the source's text.
    transitions:
      - id: "T01"
        from: "invoked"
        to: "iterating"
        trigger: "start"
        guard: "always"
        action: "allProofs = securedDocument.proof; verificationResults = empty"
        step: "1"
        locator: "§4.5 step 1"
        kind: "stated"
        normative_status: "normative"
        defects:
          - "D-05"
        quotes:
          - source_lines: "L620"
            quote: "Set allProofs to securedDocument.proof."
          - source_lines: "L621"
            quote: "Set verificationResults to an empty list."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0242"
          - "w3c-vc-data-integrity-1-0#R-0243"
      - id: "T02"
        from: "iterating"
        to: "resolving-previous"
        trigger: "next proof in allProofs"
        guard: "a proof remains"
        action: "matchingProofs = empty"
        step: "3"
        locator: "§4.5 step 3"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L622"
            quote: "For each proof in allProofs, do the following steps:"
          - source_lines: "L623"
            quote: "Let matchingProofs be an empty list."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0244"
          - "w3c-vc-data-integrity-1-0#R-0245"
      - id: "T03"
        from: "resolving-previous"
        to: "input-built"
        trigger: "previousProof test"
        guard: "no previousProof, or every id it names is the id of some proof in allProofs"
        action: "add those proofs to matchingProofs, then build inputDocument"
        step: "3.2"
        locator: "§4.5 step 3.2"
        kind: "stated"
        normative_status: "normative"
        defects:
          - "D-19"
        quotes:
          - source_lines: "L624"
            quote: "If proof contains a previousProof attribute and the value of that attribute is a string, add the element from allProofs with an id attribute value matching the value of previousProof to matchingProofs. If a proof with id value equal to the value of previousProof does not exist in allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_VERIFICATION_ERROR. If the previousProof attribute is a list, add each element from allProofs with an id attribute value that matches the value of an element of that list. If any element of previousProof list has an id attribute value that does not match the id attribute value of any element of allProofs, an error MUST be raised and SHOULD convey an error type of PROOF_VERIFICATION_ERROR."
          - source_lines: "L625"
            quote: "Let inputDocument be a copy of securedDocument with the proof value removed and then set inputDocument.proof to matchingProofs."
        constrained_by:
