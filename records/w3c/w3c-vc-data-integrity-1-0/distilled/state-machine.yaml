        step: "6"
        locator: "§4.3 step 6"
        kind: "stated"
        normative_status: "normative"
        quotes:
          - source_lines: "L566"
            quote: "Set inputDocument.proof to matchingProofs."
        constrained_by:
          - "w3c-vc-data-integrity-1-0#R-0204"
      - id: "T09"
        from: "input-bound"
        to: "proof-generated"
        trigger: "step 7 (§4.2 steps 1-6)"
        guard: "no exception"
        action: "append the generated proof to allProofs"
        step: "7"
