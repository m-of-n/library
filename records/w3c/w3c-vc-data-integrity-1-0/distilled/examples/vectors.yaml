# Conventions
# ids        EX-NN: Example NN of the source (1 to 14). EX-P-nn: a value printed in prose.
#            EX-CTX-n: a pinned context or vocabulary digest of section 2.4. Never reused.
# html_lines line range of the <pre> in .cache/w3c-vc-data-integrity-1-0.bin.
# fixtures   an unmarked file name is the source's own characters (textContent of the <pre>,
#            character references decoded, <wbr> and highlighting elements dropped); a
#            .derived. file is computed by this extraction (reproduce.py recomputes it).
# result     pass: the check holds; fail: it does not (on a source example a FINDING about the
#            source, recorded and not repaired; README.md lists them as D-nn); unverifiable:
#            the source supplies nothing to check against.
# expected / expected_basis
#            what the rule or the source leads one to expect. stated: a statement of this
#            source. inferred: a reading this extraction made. external: a rule of a document
#            other than this source (the cryptosuite documents, Multibase). A check whose
#            result differs from its expectation is a defect of the source example or a
#            limit of the instrument, named in detail.
# outcome    fail if any check fails, else unverifiable if any is, else pass. Several
#            vectors fail on checks whose expectation was also fail (D-nn): the count of
#            checks meeting their expectation is checks_meeting_expectation.
# signatures Each signature is tried with the key printed in its own verificationMethod,
#            by the recipe of the cryptosuite document (vc-di-eddsa, vc-di-ecdsa) written
#            out in signatures.derived.json; a fresh signature made by the same code
#            verifies and fails with one bit flipped or the document altered, so the code
#            is consistent. That the recipe equals the cryptosuite document's is not shown
#            by any vector of that document, so a fail is evidence against the example and
#            not a proof.

