usefulness:
  verdict: useful
  reason: "Prior art, not a candidate. RDFC canonicalises unordered RDF datasets, so it is not a DEC-002 option for our tree-shaped statements; its value is §5 plus Appendix A, the one ratified construction for canonically ordering a SET, which lowers the R-O-03 cost of writing the condition (5) ordering rule."
