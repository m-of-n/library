  - id: "MSG-17"
    name: "label-bureau-response"
    locator: "§12.3 (Response to Query for Labels Separate From Documents), §12.1"
    encoding: "HTTP response, Content-Type application/pics-labels, body a label list (MSG-01)"
    normative_status: "defined"
    description: "The bureau answers with a label list. Unless it signals an overall error there is one service-info per service requested, in the query's order, and each has a label, a tree set or an error for each requested URL, in the query's order; an error takes the position its label would have. Because order is preserved the for option may be omitted except where required, and the client matches labels to URLs by position."
