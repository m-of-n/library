reviewed_by: ""
source_digest: "469de99e9845669cd4445879f7272d0513b8e94cd4760490ba3df408edba94f8"
source: ".cache/pics-1-1-labels.bin (W3C Recommendation 31 October 1996, REC-PICS-labels-961031, HTML). Quotations and line numbers are from its plain-text rendering .cache/pics-1-1-labels.txt (792 lines, sha256 469de99e9845669cd4445879f7272d0513b8e94cd4760490ba3df408edba94f8, bin/render-w3c --ordinal). The source has no section numbers: the section marks in this file (§5, §7, §11.3 ...) are the renderer's structural ordinals and each is given with its heading title where a locator is prose. Example and grammar bytes are decoded from the HTML <pre> blocks, never from the .txt."
extracted: "2026-11-12"
extracted_by: "FX-1 pass 1 (extract), schema+messages+examples agent, mechanical lane, from the source only"
applicability: "The format of a PICS 1.1 label list and the three ways to carry it (HTML META, RFC-822 PICS-Label header with an HTTP extension to request it, a label bureau query). Defined by the BNF of section 7, 11.3, 11.4 and 12.2 (schema/*.verbatim.txt). Out of scope because the source does not define them: the service description (application/pics-service) and the URL production (PICS Rating Services and Rating Systems), base64 (RFC 1521), MD5 (RFC 1321), HTML 2.0, HTTP 1.0, the RSA algorithm. The flows (the HTTP label request, the bureau exchange, the Appendix A bureau-location algorithm) are not modelled: protocol is outside this pass's scope; their formats are here."
note: "Conventions. (1) A quotation is {source_lines, quote}: the words were cut from the .txt rendering by script (anchors, nothing retyped) and bin/check-quotes verifies each against its lines. (2) Text outside quotations is this file's own wording. (3) constrained_by lists pics-1-1-labels#R-NNNN ids of requirements.yaml, written by the pass-3 cross-check (crosscheck.derived.py re-checks them) on every message, field, option, error code and special-form step: the most specific entry that constrains it (a split child, not its parent). It was first written as constrained_by_pending with candidates (the skeleton's C-NNNN ids in inferred-candidates.yaml); pass 2 found the join mechanical only for the 136 promoted parents, 19 of the 247 candidate citations naming a rejected candidate with no R-id, and the 97 split_of children and 93 entries the skeleton missed carrying no candidate, so the ids were chosen per item by reading requirements.yaml, not by a C-to-R script. The `candidates:` lists stay as provenance (245 citations after pass 3 removed the two C-0145 citations on MSG-19 step 7 and its signature-RSA-MD5 field, which name the key-secrecy sentence, not the encrypt-and-encode sentence; 19 of the 245 name a rejected candidate); 3 promoted candidates are not wired to the item that cites them (crosscheck.yaml says why). The one item no requirement names (the application/pics-service media type of MSG-20) carries unwired_reason. Requirements that name no structure, and split parents whose children are wired, are listed under not_wired at the end of the file with the reason. Counts, by script after pass 3: 20 messages, 61 fields, 11 options, 5 error codes, 9 steps; 580 constrained_by entries, 415 of them on fields, options, codes and steps; 306 of the 353 requirement ids are wired and the other 47 are under not_wired (30 of them split parents, 17 Appendix A). (4) 'default' of an option: this document states none; entries say so. (5) schema/README.md lists the ambiguities (A1 ...) and examples/README.md the source defects of the examples (D1 ...) referred to here; normative.md lists the source defects SD-n."
messages:
  - id: "MSG-01"
    name: "label-list"
    locator: "§7 (Detailed Syntax), §8 (Semantics of PICS Labels and Label Lists)"
    encoding: "US-ASCII text: a parenthesised list. Whitespace is ignored except in quoted strings."
    normative_status: "defined"
    description: "The unit every transport carries: a version, then one or more service-infos: one per rating service, any of which may be the no-ratings error form, which names no service (normative.md SD-1). MIME type application/pics-labels. The same structure is the body of a label bureau response, the value of the PICS-Label header and the content of the META element."
    layout: "'(' 'PICS-1.1' service-info+ ')'   (grammar: schema/labels.derived.abnf#labellist; verbatim: schema/labels-s07-detailed-syntax.verbatim.txt)"
    quotes:
      - source_lines: "137"
        quote: "The following grammar, in modified BNF, describes the syntax of labels."
      - source_lines: "223"
        quote: "The labellist will always be surrounded by parentheses and begin with the PICS version number"
      - source_lines: "140"
        quote: "Whitespace is ignored except in quoted strings."
    constrained_by:
      - "pics-1-1-labels#R-0053"
      - "pics-1-1-labels#R-0054"
      - "pics-1-1-labels#R-0055"
      - "pics-1-1-labels#R-0056"
