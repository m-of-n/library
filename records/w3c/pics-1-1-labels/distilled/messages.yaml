  - id: "MSG-18"
    name: "mic-input"
    locator: "§13 (MICs and Digital Signatures)"
    encoding: "bytes of the document; output base64 text"
    normative_status: "defined"
    description: "What the MIC-md5 (md5) option holds: the MD5 digest of the source document, converted to US-ASCII by MIME base-64. A MD5 digest is 16 bytes and its base64 is 24 characters ending in ==. For an HTML document the digest is computed after removing every META element that holds a PICS label, and any whitespace immediately following the end of each such element. For other media nothing is said beyond 'the source document'. The client recomputes it on retrieval and compares."
    layout: "base64( MD5( document minus PICS META elements and the whitespace right after each ) )"
    quotes:
