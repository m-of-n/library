  - id: "MSG-11"
    name: "html-meta-embedding"
    locator: "§10 (Embedding Labels in HyperText Markup Language (HTML))"
    encoding: "HTML 2.0 META element: http-equiv and content attributes; content in single quotes"
    normative_status: "defined"
    description: "A label list inside the head of an HTML document, using the HTTP header equivalence mechanism. Inside content='...' the characters ' & > must be written as SGML entities. An embedded label may omit for; a specific one then applies to the document whatever URL fetched it; a generic one in a home document (URL path ending in /) applies to every URL with the home URL as prefix."
    layout: "<META http-equiv=\"PICS-Label\" content='labellist'>"
    escapes:
      - char: "'"
        entity: "&#39;"
        note: "single quote"
      - char: "&"
        entity: "&amp;"
        note: "ampersand"
      - char: ">"
        entity: "&gt;"
        note: "greater than"
    note: "For HTML documents the MIC (MSG-18) is computed after removing every META element that holds a PICS label."
    quotes:
      - source_lines: "248"
        quote: "Note that the content attribute uses single quotes, because the PICS label syntax uses double quotes."
      - source_lines: "255"
        quote: "A label that is embedded in a document may omit the \"for\" option"
