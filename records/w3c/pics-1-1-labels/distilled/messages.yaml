  - id: "MSG-19"
    name: "signature-special-form"
    locator: "§13 (MICs and Digital Signatures), §13.1 (Signature Details)"
    encoding: "US-ASCII string, input to MD5"
    normative_status: "defined"
    description: "The canonical text of a label that is MD5-hashed, RSA-encrypted with the service's private key and sent, base64-encoded in 60-character lines, as signature-RSA-MD5. The client rebuilds it from what it received (the single-label options and the service-info options, label wins) and compares. The signature option is never part of it. Key length, RSA padding and the digest container are not specified."
    layout: "[short-name SP value SP]... 'r (' [transmit-name SP value]... ')'"
    steps:
      - step: 1
        action: "Choose the options to transmit. Any option not transmitted cannot be used in the computation. Recommended: all options with known values except signature-RSA-MD5. Any option may be omitted; MIC-md5 (md5) and complete-label (full) are commonly omitted. signature-RSA-MD5 is never included."
        source:
          source_lines: "414"
          quote: "The service must decide which options it will include in the signed label when it is transmitted. Any options not transmitted with the signature cannot be used in the computation of the signature. We recommend that all options with known values be included with the exception of signature-rsa-md5. Any option may be omitted, but it will be common for the options mic-md5 (or md5) and full (or complete-label) to be omitted. The signature-rsa-md5 option is never included in the list of options."
        candidates:
          - "C-0160"
          - "C-0161"
          - "C-0162"
        constrained_by:
          - "pics-1-1-labels#R-0303"
          - "pics-1-1-labels#R-0304"
