  - id: "MSG-09"
    name: "error-forms"
    locator: "§7, §8, §12.3"
    encoding: "token sequences"
    normative_status: "defined"
    description: "The status the format carries in place of labels. There is no numeric status code: the vocabulary is the word after error. HTTP status is separate: the source calls an HTTP error status inappropriate when the document is available but some labels are not (section 11.2, line 290)."
    layout: "error (no-ratings explanation*) | error (request-denied explanation*) | error service-unavailable | error (request-denied [quotedURL explanation*]) | error (not-labeled quotedURL*)"
    codes:
      - code: "no-ratings"
        form: "error (no-ratings explanation*)"
        level: "whole label list (or, in a bureau answer, an unknown service)"
        meaning: "no labels are available at all"
        source:
          source_lines: "224"
          quote: "A label list either specifies that there are no labels available at all"
        constrained_by:
          - "pics-1-1-labels#R-0082"
          - "pics-1-1-labels#R-0128"
      - code: "request-denied"
        form: "error (request-denied explanation*)"
        level: "service-info (service-error)"
        meaning: "not stated by the source (normative.md SD-21); read from the name, the service refused the request; explanations are free text"
        constrained_by:
          - "pics-1-1-labels#R-0122"
      - code: "service-unavailable"
        form: "error service-unavailable"
        level: "service-info (service-error)"
        meaning: "not stated by the source (normative.md SD-21); read from the name, the service cannot be reached. The only form with no parentheses"
        constrained_by:
          - "pics-1-1-labels#R-0122"
      - code: "request-denied"
        form: "error (request-denied [quotedURL explanation*])"
        level: "label (label-error)"
        meaning: "not stated by the source (normative.md SD-21); read from the name, retrieval of the label for one URL was refused. An explanation needs the URL first"
        constrained_by:
          - "pics-1-1-labels#R-0123"
      - code: "not-labeled"
        form: "error (not-labeled quotedURL*)"
        level: "label (label-error)"
        meaning: "not stated by the source (normative.md SD-21); read from the name, no label exists for the URL(s) named. In a bureau answer the error takes the label's position"
        constrained_by:
          - "pics-1-1-labels#R-0123"
          - "pics-1-1-labels#R-0244"
    note: "Section 12.3 prose tells a bureau to send a \"no-label\" message for an unmet opt=generic request. The grammar has no such code; the closest is not-labeled (schema/README.md A19)."
    quotes:
      - source_lines: "290"
        quote: "it would be inappropriate for the server to generate an HTTP error status"
    constrained_by:
      - "pics-1-1-labels#R-0122"
      - "pics-1-1-labels#R-0123"
      - "pics-1-1-labels#R-0124"
      - "pics-1-1-labels#R-0128"
      - "pics-1-1-labels#R-0130"
      - "pics-1-1-labels#R-0132"
