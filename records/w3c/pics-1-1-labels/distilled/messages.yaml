  - id: "MSG-02"
    name: "service-info"
    locator: "§7, §8"
    encoding: "token sequence inside MSG-01"
    normative_status: "defined"
    description: "Three alternative forms: (1) error (no-ratings explanation*), no service identified; (2) serviceID then a service-error; (3) serviceID, service-level options, the word labels or l, then zero or more labels. The options of form 3 apply to every label of the service unless a label overrides them."
    layout: "no-ratings-info | serviceid service-error | serviceid option* labelword label*"
    quotes:
      - source_lines: "143"
        quote: "An option that appears in the service-info applies to all labels in that service-info unless overridden"
      - source_lines: "224"
        quote: "The optional information provided here applies to every label from the service, unless overridden in the specific label itself."
    constrained_by:
