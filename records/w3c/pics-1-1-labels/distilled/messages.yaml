  - id: "MSG-06"
    name: "label-option"
    locator: "§5 (General Format), §7"
    encoding: "token pair: option name then its value (extension: name then a parenthesised group)"
    normative_status: "defined"
    description: "Every option a service-info or a single-label may carry. Names are case-insensitive. Options fall in three groups: about the document (at, MIC-md5), about the label (by, for, generic, on, signature-RSA-MD5, until) and other (comment, complete-label, extension). Each may occur once except comment and extension (extension URLs distinct). An option in a single-label overrides the same option in its service-info."
    layout: "by quotedname | generic boolean | gen boolean | for quotedURL | on date | signature-RSA-MD5 base64 | until date | exp date | at date | MIC-md5 base64 | md5 base64 | comment quotedname | complete-label quotedURL | full quotedURL | extension (...)"
    options:
      - name: "at"
        short_form: "none"
        group: "document"
        value_type: "quoted-ISO-date"
        value_encoding: "MSG-08"
        multiplicity: "once"
        default: "not stated in this document (normative.md SD-16 (a)); the section 13.1 rule that drops an option equal to its default therefore has nothing to apply to"
        description: "The last modification date of the item rated, at the time the rating was assigned. A cheaper, less reliable alternative to the MIC."
        quotes:
          - source_lines: "78"
            quote: "The last modification date of the item to which this rating applies"
        constrained_by:
          - "pics-1-1-labels#R-0019"
          - "pics-1-1-labels#R-0091"
          - "pics-1-1-labels#R-0095"
          - "pics-1-1-labels#R-0265"
          - "pics-1-1-labels#R-0266"
        candidates:
          - "C-0135"
      - name: "MIC-md5"
        short_form: "md5"
        group: "document"
        value_type: "base64-string in double quotes"
        value_encoding: "base64 (RFC 1521) of the 16-byte MD5 of the item rated: 24 characters with == padding"
