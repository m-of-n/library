  - id: "MSG-03"
    name: "label"
    locator: "§7, §8"
    encoding: "token sequence inside MSG-02"
    normative_status: "defined"
    description: "Three alternatives: a label-error for one URL; a single-label; or, for tree queries, a parenthesised set of any number of single-labels (a tree set). A label applies to one document; a generic label applies to every URL that begins with the string of its for option."
    layout: "label-error | single-label | '(' single-label* ')'"
    quotes:
      - source_lines: "225"
        quote: "A label encompasses three separate cases. The first is an error that applies to retrieving the label for a particular URL (label-error). The second, and most common, is a single-label consisting of options (which override those specified with the service), the marker word \"ratings\" (or \"r\") and the ratings themselves (a list of category names and values). Finally, in the special case where the ratings for an entire tree of documents have been requested, any number of single-labels can be transmitted, enclosed in parentheses."
      - source_lines: "72"
        quote: "A specific label applies to a single document."
    constrained_by:
