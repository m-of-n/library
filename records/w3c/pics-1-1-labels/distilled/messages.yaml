        quote: "Instead, we recommend the direct use of the MD5 algorithm on the source document"
      - source_lines: "401"
        quote: "For HTML documents, this means that the digest must be computed after removing all META elements that include PICS labels (and any whitespace immediately following the end of each of these meta elements)."
