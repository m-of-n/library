    note: "Descendant, child and ancestor URLs are defined by case-sensitive string matching on the URLs after %xx is decoded; a child is a descendant that contains no additional '/'. The Appendix B responses contain ';' comments the label grammar does not admit (schema/README.md A15; examples/README.md D7)."
