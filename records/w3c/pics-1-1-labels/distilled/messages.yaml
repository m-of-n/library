  - id: "MSG-08"
    name: "quoted-ISO-date"
    locator: "§7"
    encoding: "'\"' YYYY.MM.DD'T'hh:mm S tz '\"'  (US-ASCII, 23 characters with the quotes)"
    normative_status: "defined"
    description: "The one date form. Based on ISO 8601:1988 but restricted: neither the time nor the zone may be omitted, no alternate format is allowed and the punctuation is exactly as shown. Example 1994.11.05T08:15-0500 is 5 November 1994 08:15 US Eastern Standard Time."
    layout: "YYYY . MM . DD T hh : mm S tz"
    quotes:
      - source_lines: "193-195"
        quote: "PICS requires precisely the syntax described here -- neither the time nor the time zone may be omitted, none of the alternate formats are permitted"
    constrained_by:
