  - id: "MSG-05"
    name: "rating"
    locator: "§7, §8"
    encoding: "token sequence: a transmit-name then a number or a parenthesised multi-value list"
    normative_status: "defined"
    description: "One category and its value(s). The multi-value syntax must be used when there is more than one value for a category."
    layout: "transmit-name number | transmit-name '(' multi-value* ')'"
    quotes:
      - source_lines: "145"
        quote: "The multi-value syntax must be used when there is more than one value for a particular category."
      - source_lines: "227"
        quote: "When a multi-value is provided, any combination of numbers and ranges of numbers may be specified"
    constrained_by:
