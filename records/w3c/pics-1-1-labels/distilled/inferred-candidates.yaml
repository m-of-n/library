  - id: 'C-0186'
    locator: '§17'
    source_lines: '526'
    cue: 'required'
    text: 'The time required to send the query and receive the response must be measured, rather than the total transaction time: connection setup costs can be quite high, and would distort the measurement if one compared the round trip time to the primary bureau through an existing connection to the time to establish the connection to the secondary bureau plus the round trip time.'
    verdict: stated
    reason: 'lowercase must, in the keep-alive variant. Promoted as R-0349.'
