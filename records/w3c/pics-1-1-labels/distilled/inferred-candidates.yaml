    text: 'Until or exp If the document is expected to be updated infrequently or periodically, the label can contain an expiration date that should cause the label to be invalid before the document is next updated.'
    verdict: stated
    reason: 'the effect of an expiration date: the label becomes invalid. Promoted as R-0267 (split: R-0268).'
  - id: 'C-0137'
    locator: '§13'
    source_lines: '396'
    cue: 'does not'
    text: 'This, too, does not guard against a concerted malicious attack.'
    verdict: reject
    reason: 'security observation on until; no obligation.'
  - id: 'C-0138'
    locator: '§13'
    source_lines: '397-398'
    cue: 'only'
    text: 'MIC-md5 or md5 If the label is intended to apply only to the data that was actually rated, then a form of checksum (called a "message digest") can be applied to the data when the label is created.'
    verdict: stated
    reason: 'dd text for the MIC option, welded to its dt. Promoted as R-0270 (split: R-0271).'
  - id: 'C-0139'
    locator: '§13'
    source_lines: '398'
    cue: 'can be'
    text: 'When the document is later retrieved, the same algorithm can be used to recompute the message digest and the two digests can be compared.'
    verdict: stated
    reason: 'the verification procedure for the MIC. Promoted as R-0273.'
  - id: 'C-0140'
    locator: '§13'
    source_lines: '399'
    cue: 'required'
    text: 'For use with electronic mail, an elaborate technique is required to assure that the two message digests will match, since electronic mail gateways can modify the data before it is delivered (by wrapping lines, for example).'
    verdict: reject
    reason: 'rationale: why MOSS''s mail canonicalisation was not adopted.'
  - id: 'C-0141'
    locator: '§13'
    source_lines: '400'
    cue: 'is included'
    text: 'This resulting string is included directly in the mic-md5 (md5) label option.'
    verdict: stated
    reason: 'where the MIC goes. Promoted as R-0275.'
  - id: 'C-0142'
    locator: '§13'
    source_lines: '401'
    cue: 'can be'
    text: 'Because PICS labels can be embedded inside of the documents they label, care must be taken to ensure that the message digest is computed excluding all PICS labels in the document.'
    verdict: stated
    reason: 'lowercase must: embedded labels are excluded from the MIC. Promoted as R-0277.'
  - id: 'C-0143'
    locator: '§13'
    source_lines: '401'
    cue: 'must'
    text: 'For HTML documents, this means that the digest must be computed after removing all META elements that include PICS labels (and any whitespace immediately following the end of each of these meta elements).'
    verdict: stated
    reason: 'lowercase must: the HTML case. Promoted as R-0278.'
  - id: 'C-0144'
    locator: '§13'
    source_lines: '402-403'
    cue: 'In order'
    text: 'The RSA signature technique works as follows: In order to sign a label, the rating service (or people authorized to generate labels on behalf of the service) needs a "public key pair."'
    verdict: stated
    reason: 'precondition of signing, welded to its lead-in. Promoted as R-0280 (split: R-0281).'
  - id: 'C-0145'
    locator: '§13'
    source_lines: '403'
    cue: 'must'
    text: 'One of these (the private key) must be kept secret by the service; the other (the public key) must be distributed to anyone who is interested in verifying the signatures on the service''s labels.'
    verdict: stated
    reason: 'lowercase must, twice: private key secret, public key distributed. Promoted as R-0282 (split: R-0283, R-0284).'
  - id: 'C-0146'
    locator: '§13'
    source_lines: '405'
    cue: 'is invalid'
    text: 'If the result isn''t the same as the message digest it computed the signature is invalid.'
    verdict: stated
    reason: 'the verification verdict. Promoted as R-0294.'
  - id: 'C-0147'
    locator: '§13'
    source_lines: '405'
    cue: 'contains'
    text: '(RSAREF contains routines to do all of this work except for the combining of the lines into a long string.)'
    verdict: reject
    reason: 'what RSAREF does and does not provide; no conformance content.'
  - id: 'C-0148'
    locator: '§13'
    source_lines: '406'
    cue: 'assumes'
    text: 'Since there is no clearly established solution available today, PICS assumes that each service will distribute the public keys in some way it chooses.'
    verdict: stated
    reason: 'allocation: each service distributes its own public keys. Promoted as R-0295.'
  - id: 'C-0149'
    locator: '§13'
    source_lines: '406'
    cue: 'assumes'
    text: 'It also assumes that no keys will ever have to be invalidated.'
    verdict: stated
    reason: 'assumption that binds verifiers: no key revocation. Promoted as R-0296.'
  - id: 'C-0150'
    locator: '§13'
    source_lines: '406'
    cue: 'can be'
    text: 'While this is clearly not a perfect solution, it seems to be the limit of what can be done today without committing to specific proprietary technology.'
    verdict: reject
    reason: 'commentary on the limits of 1996 key distribution.'
  - id: 'C-0151'
    locator: '§13'
    source_lines: '407'
    cue: 'may'
    text: 'If a rating service allows other people to generate labels under its name (for example, a service that supports self-ratings by content producers) then the labels may need to be signed by both the service and the content producer.'
    verdict: reject
    reason: 'states a case the document then leaves unsolved (C-0153); the one rule it carries is R-0297.'
  - id: 'C-0152'
    locator: '§13'
    source_lines: '407'
    cue: 'can be'
    text: 'This can be done (each signs the label without the other''s signature), but it becomes quite difficult to distribute the public keys needed to verify the signature.'
    verdict: stated
    reason: 'how two signers sign one label. Promoted as R-0297.'
  - id: 'C-0153'
    locator: '§13'
    source_lines: '407'
    cue: 'does not'
    text: 'The PICS specification does not propose a solution to this problem (it, too, is part of active commercial competition).'
    verdict: reject
    reason: 'scope note: no mechanism is proposed for distributing two signers'' keys.'
  - id: 'C-0154'
    locator: '§13.1'
    source_lines: '411'
    cue: 'requires'
    text: 'PICS specifically requires the use of the RSA signature algorithm with the MD5 message digest.'
    verdict: stated
    reason: 'requires: RSA with MD5. Promoted as R-0298.'
  - id: 'C-0155'
    locator: '§13.1'
    source_lines: '411'
    cue: 'Should'
    text: 'Should this system become outdated, the PICS specification can be easily updated to add a new label option that supports a different pair of algorithms.'
    verdict: reject
    reason: 'future evolution of the specification (a new option for new algorithms); nothing to do now.'
  - id: 'C-0156'
    locator: '§13.1'
    source_lines: '412'
    cue: 'does not'
    text: 'PICS does not specify the key length to be used for the digital signatures.'
    verdict: stated
    reason: 'scope: key length unspecified. Promoted as R-0299.'
  - id: 'C-0157'
    locator: '§13.1'
    source_lines: '412'
    cue: 'need to'
    text: 'Individual services will need to investigate the legal and technical ramifications involved and make a choice.'
    verdict: stated
    reason: 'allocation: each service chooses its key length. Promoted as R-0300.'
  - id: 'C-0158'
    locator: '§13.1'
    source_lines: '412'
    cue: 'Should'
    text: 'Should a single answer become common, this specification may be re-issued with this detail filled in.'
    verdict: reject
    reason: 'future re-issue of the specification.'
  - id: 'C-0159'
    locator: '§13.1'
    source_lines: '413-414'
    cue: 'is used'
    text: 'The special form of the label that is used for signatures is computed as follows: The service must decide which options it will include in the signed label when it is transmitted.'
    verdict: stated
    reason: 'the special form steps, lead-in welded to step 1. Promoted as R-0301 (split: R-0302, R-0303).'
  - id: 'C-0160'
    locator: '§13.1'
    source_lines: '414'
    cue: 'cannot'
    text: 'Any options not transmitted with the signature cannot be used in the computation of the signature.'
    verdict: stated
    reason: 'cannot: untransmitted options are not signed. Promoted as R-0304.'
  - id: 'C-0161'
    locator: '§13.1'
    source_lines: '414'
    cue: 'may'
    text: 'Any option may be omitted, but it will be common for the options mic-md5 (or md5) and full (or complete-label) to be omitted.'
    verdict: stated
    reason: 'permission: any option may be left out. Promoted as R-0306.'
  - id: 'C-0162'
    locator: '§13.1'
    source_lines: '414'
    cue: 'never'
    text: 'The signature-rsa-md5 option is never included in the list of options.'
    verdict: stated
    reason: 'never: the signature is not signed. Promoted as R-0307.'
  - id: 'C-0163'
    locator: '§13.1'
    source_lines: '416'
    cue: 'in order'
    text: 'For each option in the list (in order), the short name is put into the label followed by a single space followed by the value of the option, followed by a space.'
    verdict: stated
    reason: 'the per-option output step. Promoted as R-0311.'
  - id: 'C-0164'
    locator: '§13.1'
    source_lines: '416'
    cue: 'is used'
    text: 'The shortest form of a value is used, and strings are output in lower case if they are case insensitive.'
    verdict: stated
    reason: 'shortest form and lower case. Promoted as R-0312 (split: R-0313, R-0314).'
  - id: 'C-0165'
    locator: '§13.1'
    source_lines: '420'
    cue: 'implies'
    text: 'This implies a constraint on the server when it decides what options to include in the transmitted set.'
    verdict: reject
    reason: 'lead-in to R-0324.'
  - id: 'C-0166'
    locator: '§13.1'
    source_lines: '420'
    cue: 'must'
    text: 'The transmitted set must include any options that the server ships as part of the service-info, unless either the value specified in the service-info or the value of the option for this label is the default value of the option.'
    verdict: stated
    reason: 'lowercase must. Promoted as R-0324.'
  - id: 'C-0167'
    locator: '§14'
    source_lines: '433-439'
    cue: 'may'
    text: 'The content label may accompany the document it is about or be available separately. content rating See content label. dimension See category. document Any item that can be referred to by a URL.'
    verdict: stated
    reason: 'glossary text holding the definition of document. Promoted as R-0327 (split: R-0328).'
  - id: 'C-0168'
    locator: '§14'
    source_lines: '449'
    cue: 'may'
    text: 'It may or may not provide the documents themselves.'
    verdict: reject
    reason: 'glossary: a label bureau may or may not serve documents; no obligation.'
  - id: 'C-0169'
    locator: '§14'
    source_lines: '450-451'
    cue: 'can be'
    text: 'MD5 An algorithm, see RFC1321, that can be used to compute a MIC.'
    verdict: reject
    reason: 'glossary definition of MD5; the rule is R-0021.'
  - id: 'C-0170'
    locator: '§14'
    source_lines: '453'
    cue: 'can be'
    text: 'For PICS, the importance of a MIC is that a rating service can compute the MIC of a piece of information when the label is created and that MIC can be put into the label itself.'
    verdict: reject
    reason: 'glossary restatement of the MIC procedure of R-0273.'
  - id: 'C-0171'
    locator: '§14'
    source_lines: '471'
    cue: 'must'
    text: 'This is distinct from the category name in as much as the transmission name must be language-independent, encoded in US-ASCII, and as short as reasonably possible.'
    verdict: stated
    reason: 'lowercase must: constraints on transmission names. Promoted as R-0330.'
  - id: 'C-0172'
    locator: '§14'
    source_lines: '471'
    cue: 'must'
    text: 'Within a single rating system the transmission names of all categories must be distinct.'
    verdict: stated
    reason: 'lowercase must: distinct transmission names. Promoted as R-0331.'
  - id: 'C-0173'
    locator: '§14'
    source_lines: '471'
    cue: 'can be'
    text: 'URLs, while generally longer than desired, can be used as transmission names.'
    verdict: stated
    reason: 'permission: URLs as transmission names. Promoted as R-0332.'
  - id: 'C-0174'
    locator: '§14'
    source_lines: '473'
    cue: 'defines'
    text: 'Notice that PICS defines an additional scheme beyond those listed in RFC-1738, described in Rating Services and Rating Systems, which allows Chat (IRC) rooms to be named.'
    verdict: reject
    reason: 'the chat-room URL scheme is defined by Rating Services and Rating Systems.'
  - id: 'C-0175'
    locator: '§17'
    source_lines: '520'
    cue: 'must'
    text: 'As the use of PICS grows, we must consider its impact on overall network performance.'
    verdict: reject
    reason: 'motivation (the authors must consider network load); binds no implementation.'
  - id: 'C-0176'
    locator: '§17'
    source_lines: '520'
    cue: 'only'
    text: 'In general, the PICS techniques for transmitting labels in or with documents add only a very small amount of traffic to the net, since the additional PICS headers will ordinarily contain only a few hundred bytes of data and the documents themselves are more likely to be several thousand bytes of data.'
    verdict: reject
    reason: 'traffic estimate; motivation.'
  - id: 'C-0177'
    locator: '§17'
    source_lines: '520'
    cue: 'may'
    text: 'Furthermore, since the labels come from the same source as the document itself there is no network hot spot created by PICS (although popular servers may themselves already be such hot spots).'
    verdict: reject
    reason: 'motivation: embedded and header labels create no hot spot.'
  - id: 'C-0178'
    locator: '§17'
    source_lines: '521'
    cue: 'may'
    text: 'The Internet is in need of a good solution to this problem, and there is work (both underway and proposed) that may solve the problem in the long term.'
    verdict: reject
    reason: 'motivation: hot spots need a long-term solution.'
  - id: 'C-0179'
    locator: '§17'
    source_lines: '523'
    cue: 'assume'
    text: 'First, we assume that popular label bureaus will be able to establish a number of mirror sites around the network.'
    verdict: reject
    reason: 'lead-in to the precondition R-0334 states exactly.'
  - id: 'C-0180'
    locator: '§17'
    source_lines: '523'
    cue: 'assumes'
    text: 'Our algorithm simply assumes that they exist and are equivalent, and that the network''s Domain Name System (DNS) has records which map the single well-defined name for the label bureau to multiple Internet addresses, in the usual manner.'
    verdict: stated
    reason: 'preconditions of the algorithm: equivalent mirrors behind one DNS name. Promoted as R-0334.'
  - id: 'C-0181'
    locator: '§17'
    source_lines: '524'
    cue: 'should'
    text: 'When client software starts, it should attempt to resolve the name of the label bureau it wishes to use (we assume one label bureau, but the algorithm extends in an obvious manner to multiple bureaus) through DNS.'
    verdict: stated
    reason: 'lowercase should: resolve the bureau name at start-up. Promoted as R-0335.'
  - id: 'C-0182'
    locator: '§17'
    source_lines: '524'
    cue: 'may'
    text: 'Alternatively, these may be configuration parameters of the client software that are then validated when the software starts.'
    verdict: stated
    reason: 'permission: configured primary and secondary. Promoted as R-0337.'
  - id: 'C-0183'
    locator: '§17'
    source_lines: '525'
    cue: 'is used'
    text: 'If the timer is below the threshold, the primary bureau address is used.'
    verdict: stated
    reason: 'the timer test. Promoted as R-0340.'
  - id: 'C-0184'
    locator: '§17'
    source_lines: '526'
    cue: 'should'
