    testable: 'yes'
    candidate: 'C-0060'
    status: active
  - id: 'pics-1-1-labels#R-0130'
    locator: '§8'
    source_lines: '224'
    text: 'This is either followed by an error message indicating why no labels are available from that service (service-error) or an overall set of optional information (option*) followed by the keyword "labels" (or "l") and the labels from the service.'
