  - id: 'pics-1-1-labels#R-0125'
    locator: '§8'
    source_lines: '223'
    text: 'The format specified here is intended to be registered with IANA as the MIME type "application/pics-labels."'
    verb: 'none'
    kind: stated
    actor: 'label producer'
    object: 'media type of a labellist'
    field: 'application/pics-labels'
    testable: 'partial'
    testable_reason: 'the name is used and checkable (R-0046, R-0219); its IANA registration is an act outside this document and was only intended.'
    candidate: 'C-0056'
    status: active
  - id: 'pics-1-1-labels#R-0126'
    locator: '§8'
    source_lines: '223'
    text: 'It allows for transmission of both labels and reasons why labels are not available, and is the format used when labels must be conveyed in a document, along with a document, or from a PICS label bureau.'
    verb: 'none'
    kind: stated
    actor: 'label producer'
    object: 'format of labels in every transport'
    field: 'labellist'
    testable: 'yes'
    candidate: 'C-0057'
    status: active
  - id: 'pics-1-1-labels#R-0127'
    locator: '§8'
    source_lines: '223'
    text: 'The labellist will always be surrounded by parentheses and begin with the PICS version number (1.1 in this specification).'
    verb: 'none'
    kind: stated
