    testable: 'yes'
    candidate: 'C-0058'
    status: active
  - id: 'pics-1-1-labels#R-0128'
    locator: '§8'
    source_lines: '224'
    text: 'A label list either specifies that there are no labels available at all (e.g., "error (no-ratings ...)") or is separated into sections of labels, one section for each rating service.'
    verb: 'none'
    kind: stated
    actor: 'label producer'
    object: 'structure of a label list'
    field: 'labellist; service-info'
    testable: 'yes'
    candidate: 'C-0059'
