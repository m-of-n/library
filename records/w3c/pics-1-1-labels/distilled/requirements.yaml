    status: active
  - id: 'pics-1-1-labels#R-0129'
    locator: '§8'
    source_lines: '224'
    text: 'The URL of each service must be specified (the serviceID).'
    verb: 'none'
    kind: stated
    actor: 'label producer'
    object: 'service URL of each section'
