usefulness:
  verdict: useful
  reason: "Prior art, not a candidate. Answers how a 1996 ratified label binds content (an optional MD5 MIC over the document minus its own embedded labels; otherwise by URL or by delivery context) and how its signature works (a canonical 'special form' the verifier rebuilds from the received label) — evidence for R-M-07, R-O-05 and the ARCH-0001 §6 PICS import row."
  assessed: "2026-10-23"
distillation:
  standard: FX-1
  profile: partial
  profile_reason: "FX-1 kinds NOT covered: protocol and state-machine. The source defines an HTTP extension for requesting labels with a document (ordinal §11), a label-bureau query (§12) and a bureau-location algorithm with client state (Appendix A, §17); their wire formats are extracted (messages.yaml, schema/, examples/) and their sentences are requirements, but the flows, error paths and Appendix A's bureau-selection state are not modelled. That transport is defined against HTTP 1.0 and HTML 2.0, the record is retired, and nothing m-of-n decides rests on it: the record is held for the label format and how a label binds content and signer (R-M-07, R-O-05, R-I-01). An importer reading labels from HTTP headers or a bureau would need the protocol kind first (design-notes open questions). Also below the standard by construction: the source uses no BCP 14 keywords, so the requirement set is its lowercase statements (verb: none), and it prints no MD5 or signature value, so no vector is verifiable."
  artifacts:
    - {kind: normative, path: distilled/normative.md, coverage: "every stated requirement as a quotation marker in source order; source defects SD-1 to SD-24 and SD-E", reviewed_by: ""}
    - {kind: requirements, path: distilled/requirements.yaml, coverage: "353 entries (136 promoted candidates, 97 hunted (4 added by pass 2), 97 split children, 23 inferred); 202 of 202 candidates with a verdict; 0 BCP 14 keywords in source and extraction", reviewed_by: ""}
    - {kind: schema, path: distilled/schema/, coverage: "§7, §11.3, §11.4, §12.2 grammars verbatim; 3 derived ABNF files and an executing checker (288 checks); ambiguities A1 to A26", reviewed_by: ""}
    - {kind: messages, path: distilled/messages.yaml, coverage: "20 messages, 61 fields and 11 option entries: label list, options, ratings, extensions, META embedding, PICS-Label header, Protocol-Request, bureau query and response, MIC input, signature special form", reviewed_by: ""}
    - {kind: examples, path: distilled/examples/, coverage: "all 19 examples, byte-identical to their pre blocks; reproduce.py parses each against the derived grammar; findings D1 to D10", reviewed_by: ""}
    - {kind: design-notes, path: distilled/design-notes.md, coverage: "30 rows against m-of-n at d7f7f89; MD-3 / DEC-002 cuts; 10 open questions", reviewed_by: ""}
  not_applicable: []
