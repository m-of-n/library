  note: "The record was scaffolded as NIST SP 800-160, Systems Security Engineering (Ross et al., 2018), at the series URL https://csrc.nist.gov/pubs/sp/800/160/. That names the original Volume 1 of November 2016, updated March 21 2018, which is what iso-sae-21434-2021 cites. This record now tracks the current revision of the line under the same id. Rev. 1 was read; its Appendix L.1 lists the changes from the original. The original PDF was fetched for its digest only and not read: sha256 61ade23142acf164e8169e35ee059e5df22f397625872f970c93c1ce1b3a823c. Volume 2 on cyber-resiliency is not covered."
