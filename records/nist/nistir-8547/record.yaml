  note: "The record was scaffolded against the initial public draft (ipd, 2024-11-12, https://csrc.nist.gov/pubs/ir/8547/ipd). The final appeared in October 2026, approved by the NIST Editorial Review Board 2026-10-21, and this record now tracks it under the same id. Delta from the ipd, by comparing its tables: the ipd deprecated only the 112-bit classical parameters after 2030 and disallowed everything after 2035, while the final deprecates all quantum-vulnerable parameters after 2030; the final also adds EO 14412 and OMB M-26-15, which the ipd does not mention. ipd PDF sha256 bed27fff9520b6e02e0919d43bbe0942eb567644dd933100fda0b07f6a18a2dc."
