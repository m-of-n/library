  - id: "F02"
    name: "operator-authentication"
    title: >-
      Operator authentication with a mechanism Table 1 permits, accepted by the module or its
      Operating Environment
    locator: "§6.1, §6.2, Table 1"
    participants:
      - "operator"
      - "module"
      - "operating-environment"
    summary: >-
      No mechanism is approved; Table 1's allowed mechanisms may be used at each security level.
      Except at level 1, the module or the Operating Environment performs authentication acceptance.
      Level 1 needs none (it may be implicit) but, if used, should meet level 2 as a minimum. A
      mechanism also used to set up a module-provided protected communication service must meet the
      strength requirements of SP 800-140C and 800-140D. The authentication exchange itself is SP
      800-63B's, not described here.
    order_note: "Presentation before acceptance; nothing else is ordered."
