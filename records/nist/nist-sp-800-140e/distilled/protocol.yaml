state_machine_na:
  - kind: "state-machine"
    recorded_in: "record.yaml distillation.not_applicable (by the coordinator)"
    reason: >-
      No lifecycle is stated: SP 800-63B §6 (lifecycle management) and §7 (session management) are
      incorporated by reference (L327-330) and none of their states appears here; Table 1 (L290-322)
      maps security levels to permitted mechanisms.
source_ambiguities:
