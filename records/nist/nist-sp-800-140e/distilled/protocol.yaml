reader_defect:
  status: "fixed in 63d708e; kept as the record of what this lane worked around"
  finding: >-
    The pass-1 bin/_source_text dropped the post-form-feed text of L23 and L339 (title lines) and kept
    the page numbers at L111, L153, L178, L233, L286 and L338 as prose, so a span across L286 carried
