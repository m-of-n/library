    locator: "§5.1, §6.2"
    finding: >-
      §5.1 calls SP 800-63B an informative reference for module authentication; §6.2 then names
      three of its sections normative.
    quotes:
      - source_lines: "260-262"
        quote: |-
          While this document serves a different purpose, much of the authentication is purposely meant to align with SP 800-63B, which is an informative reference for module authentication.
      - source_lines: "327-330"
        quote: |-
          Normative SP 800-63B sections include ● Section 5, Detailed requirements specific to each type of authenticator; ● Section 6, Lifecycle management; ● Section 7, Session Management;
  - id: "SA-02"
    locator: "§6.1, §6.2"
    finding: >-
      §6.1 says the document holds all requirements for CMVP-approved authentication mechanisms;
      §6.2 says none is currently approved and only allowed mechanisms may be used.
    quotes:
