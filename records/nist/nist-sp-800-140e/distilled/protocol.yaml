applicability: >-
  Two exchanges are stated: the vendor's SP 800-63B-framed documentation and the testers' review
  (§6.2), and operator authentication with Table 1's mechanisms, accepted by the module or the
  Operating Environment except at level 1 (§6.1, §6.2). The authenticator lifecycle and session
  management are SP 800-63B's (§6, §7), named here and not stated, so there is no state machine.
