flows:
  - id: "F01"
    name: "module-validation"
    title: "A module is tested by an accredited laboratory and validated by the CMVP"
    locator: "¶3, ¶9, ¶12, §1, §3.4"
    participants:
      - "vendor"
      - "cst-laboratory"
      - "cmvp"
      - "federal-agency"
    summary: >-
      Vendors use independent, accredited CST laboratories to have modules tested; NVLAP accredited
      laboratories perform the compliance/conformance testing to ISO/IEC 24759:2017(E) as the CMVP
      modifies it; a test report for a module demonstrating compliance goes to the CMVP for review
      and validation, with a schedule that depends on vendor, lab and CMVP coordinating; a validated
      module is considered as conforming and is accepted by Federal agencies of both countries.
    order_note: >-
      ¶3 puts testing before everything; ¶12 puts the report after testing and the review after the
      report. Step 4 runs during step 5. Step 6 is this model's link to the list agencies read.
    preconditions:
      - id: "F01.P1"
        condition: >-
          The laboratory is independent and accredited; NVLAP accredited laboratories perform the
          testing.
        kind: "stated"
        quotes:
          - source_lines: "120-121"
            quote: |-
              In the CMVP, vendors of cryptographic modules use independent, accredited Cryptographic and Security Testing (CST) laboratories to have their modules tested.
          - source_lines: "121-123"
            quote: |-
              National Voluntary Laboratory Accreditation Program (NVLAP) accredited laboratories perform cryptographic module compliance/conformance testing.
        constrained_by:
          - "fips-140-3#R-0022"
          - "fips-140-3#R-0023"
      - id: "F01.P2"
        condition: "FIPS 140-3 testing has begun (state-machine.yaml M01, state fips-140-3-testing)."
        kind: "stated"
        quotes:
          - source_lines: "202-203"
            quote: |-
              Figure 1 summarizes the CMVP implementation schedule when FIPS 140-3 testing may begin.
          - source_lines: "217-218"
            quote: |-
              FIPS 140-3 TESTING BEGINS (18 months after approval date)
        constrained_by:
          - "fips-140-3#R-0011"
          - "fips-140-3#R-0035"
          - "fips-140-3#R-0040"
        candidates:
          - "C-0031"
    steps:
      - n: "1"
        from: "vendor"
        to: "cst-laboratory"
        message: "module and vendor evidence"
        action: >-
          The vendor has its module tested by an independent, accredited CST laboratory and supplies
          the vendor evidence of ISO/IEC 24759:2017(E) as the CMVP modifies it.
        locator: "¶3, §1, §3.4"
        kind: "stated"
        quotes:
          - source_lines: "120-121"
            quote: |-
              In the CMVP, vendors of cryptographic modules use independent, accredited Cryptographic and Security Testing (CST) laboratories to have their modules tested.
          - source_lines: "304-307"
            quote: |-
              The testing for these requirements will be in accordance with ISO/IEC 24759:2017(E), with the modifications, additions or deletions of vendor evidence and testing allowed as a validation authority under paragraph 5.2.
          - source_lines: "380-381"
            quote: |-
              These documents modify the vendor documentation and testing requirements of ISO/IEC 24759:2017(E) as specified by the CMVP validation authority.
        constrained_by:
          - "fips-140-3#R-0002"
          - "fips-140-3#R-0007"
          - "fips-140-3#R-0022"
          - "fips-140-3#R-0046"
          - "fips-140-3#R-0061"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "cst-laboratory"
        to: "cst-laboratory"
        message: "test results"
        action: >-
          The laboratory tests the module for compliance/conformance against ISO/IEC 24759:2017(E)
          as the CMVP, acting as validation authority, has modified its vendor-evidence and test
          requirements.
        locator: "¶3, §1, §2, §3.2"
        kind: "stated"
        quotes:
          - source_lines: "121-123"
            quote: |-
              National Voluntary Laboratory Accreditation Program (NVLAP) accredited laboratories perform cryptographic module compliance/conformance testing.
          - source_lines: "304-307"
            quote: |-
              The testing for these requirements will be in accordance with ISO/IEC 24759:2017(E), with the modifications, additions or deletions of vendor evidence and testing allowed as a validation authority under paragraph 5.2.
          - source_lines: "339-340"
            quote: |-
              These documents form the technical requirements and the basis for the testing methods of this FIPS.
        constrained_by:
          - "fips-140-3#R-0023"
          - "fips-140-3#R-0046"
          - "fips-140-3#R-0048"
          - "fips-140-3#R-0053"
        candidates:
          - "C-0046"
        on_error: >-
          A module that does not demonstrate compliance gets no test report (F01.E1); what follows
