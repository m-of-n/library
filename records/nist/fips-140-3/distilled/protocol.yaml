  - id: "F02"
    name: "acquisition-and-use"
    title: "Agencies acquire validated modules and remain responsible for their security"
    locator: "¶6, ¶7, ¶12, ¶13"
    participants:
      - "federal-agency"
      - "cmvp"
      - "module-operator"
      - "agency-responsible-authority"
    summary: >-
      Agencies should plan acquisitions of FIPS 140-3 compliant products and may buy any product on
      the CMVP validated modules list, never deciding from the Historical list; a module approved
      for classified use may stand in for a validated one; the security level must suit the
      application and environment; and validation does not end responsibility: the operator and the
      agency's responsible authority must each judge the security sufficient.
    order_note: >-
      ¶12 puts the plan before the purchase. Steps 3 to 6 are responsibilities the source does not
      order.
    steps:
      - n: "1"
        from: "federal-agency"
        to: "federal-agency"
        message: "acquisition plan"
        action: "The agency develops plans for acquiring products compliant with FIPS 140-3."
        locator: "¶12"
        kind: "stated"
        quotes:
          - source_lines: "198-200"
            quote: |-
              Agencies should develop plans for the acquisition of products that are compliant with FIPS 140-3; however, agencies may purchase any of the products on the CMVP validated modules list.
        constrained_by:
          - "fips-140-3#R-0009"
          - "fips-140-3#R-0037"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "federal-agency"
        to: "cmvp"
        message: "CMVP validated modules list"
        action: >-
          The agency selects from the CMVP validated modules list; it may purchase any product on
          it. Modules the agency operates, or that are operated for it under contract, are to be
          designed and implemented to this standard.
        locator: "¶3, ¶6, ¶9, ¶12"
        kind: "stated"
        quotes:
          - source_lines: "198-200"
            quote: |-
              Agencies should develop plans for the acquisition of products that are compliant with FIPS 140-3; however, agencies may purchase any of the products on the CMVP validated modules list.
          - source_lines: "137-139"
            quote: |-
              This standard shall be used in designing and implementing cryptographic modules that Federal departments and agencies operate or are operated for them under contract.
          - source_lines: "116-118"
            quote: |-
              The goal of the CMVP is to promote the use of validated cryptographic modules and provide Federal agencies with a security metric to use in procuring equipment containing validated cryptographic modules.
          - source_lines: "162-167"
            quote: |-
              Information about the CMVP can be obtained from the a. National Institute of Standards and Technology, Information Technology Laboratory, 100 Bureau Drive, Stop 8900, Gaithersburg, MD 20899-8900. b. Canadian Centre for Cyber Security, P.O. Box 9703, Terminal, Ottawa, Ontario K1G 3Z4 c. CMVP URL https://www.nist.gov/cmvp.
        constrained_by:
          - "fips-140-3#R-0009"
          - "fips-140-3#R-0002"
          - "fips-140-3#R-0006"
          - "fips-140-3#R-0024"
          - "fips-140-3#R-0038"
        candidates:
          - "C-0015"
        on_error: "A product only on the Historical list: F02.E1."
        on_error_basis: "stated"
        note: "Reading the list is this model's step; the permission to purchase from it is the source's."
      - n: "3"
        from: "federal-agency"
        to: "federal-agency"
        message: "security level selection"
        action: >-
          The module's validated security level is chosen to fit what the application, its
          environment and the module's services require.
        locator: "¶3, ¶7"
        kind: "stated"
        actor_basis: "inferred"
        basis_reason: >-
          ¶7's sentence is passive and names no chooser; the agency is this model's reading because
          it is the party that acquires the module for its application.
        quotes:
          - source_lines: "149-152"
            quote: |-
              The security level to which a cryptographic module is validated must be chosen to provide a level of security appropriate for the security requirements of the application and environment in which the module will be utilized and the security services that the module will provide.
          - source_lines: "152-154"
            quote: |-
              The security requirements for a particular security level include both the security requirements specific to that level and the security requirements that apply to all modules regardless of the level.
        constrained_by:
          - "fips-140-3#R-0005"
          - "fips-140-3#R-0001"
          - "fips-140-3#R-0026"
        candidates:
          - "C-0019"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "federal-agency"
        to: "federal-agency"
        message: "classified-use approval"
        action: "Instead of a validated module, the agency may use a module approved for classified use."
        locator: "¶6"
        kind: "stated"
        quotes:
          - source_lines: "139-140"
            quote: |-
              Cryptographic modules that have been approved for classified use may be used in lieu of modules that have been validated against this standard.
        constrained_by:
          - "fips-140-3#R-0003"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "module-operator"
        to: "module-operator"
        message: "residual-risk acceptance"
        action: >-
          The operator ensures the module's security is sufficient and acceptable to the information
          owner and that residual risk is acknowledged and accepted; conformance alone does not make
          a module secure.
        locator: "¶13"
        kind: "stated"
        quotes:
          - source_lines: "241-243"
            quote: |-
              While the security requirements specified in this standard are intended to maintain the security provided by a cryptographic module, conformance to this standard is not sufficient to ensure that a particular module is secure.
          - source_lines: "243-245"
            quote: |-
              The operator of a cryptographic module is responsible for ensuring that the security provided by a module is sufficient and acceptable to the owner of the information that is being protected and that any residual risk is acknowledged and accepted.
        constrained_by:
          - "fips-140-3#R-0042"
        candidates:
          - "C-0038"
        on_error: "unspecified by source (F02.E2)"
        on_error_basis: "unspecified"
      - n: "6"
        from: "agency-responsible-authority"
        to: "agency-responsible-authority"
        message: "system security assurance"
        action: >-
          The agency's responsible authority makes sure the system's security is adequate and
          accepted.
        locator: "¶13"
        kind: "stated"
        quotes:
          - source_lines: "245-246"
            quote: |-
              The responsible authority in each agency shall ensure that the security of the system is sufficient and acceptable.
        constrained_by:
          - "fips-140-3#R-0012"
        on_error: "unspecified by source (F02.E2)"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F02.E1"
        at_step: "2"
        condition: "The product appears only on the CMVP Historical list."
        kind: "stated"
        outcome: "The Historical list is not to be used for procurement decisions; it is for reference only."
        outcome_basis: "stated"
        quotes:
          - source_lines: "200-202"
            quote: |-
              (Note: the CMVP Historical list should not be used for procurement decisions. This list is provided for reference purposes only.)
        constrained_by:
          - "fips-140-3#R-0010"
        candidates:
          - "C-0034"
      - id: "F02.E2"
        at_step: "5"
        condition: "The operator or the responsible authority judges the security insufficient."
        kind: "inferred"
        inferred_reason: "¶13 assigns both responsibilities and states no action when the judgement is negative."
        outcome: "unspecified by source"
        outcome_basis: "unspecified"
  - id: "F03"
    name: "interpretation-request"
    title: "A question about the standard and its resolution"
    locator: "¶11"
    participants:
      - "inquirer"
      - "itl-director"
      - "validation-authorities"
    summary: >-
      Questions on the content and specifications should go to the ITL Director, ATTN: FIPS 140-3
      Interpretation; the validation authorities at NIST and CCCS provide the resolution. The
      hand-off between the two, and who receives the resolution, are not stated.
    order_note: "Question before resolution; nothing else is ordered."
    steps:
      - n: "1"
        from: "inquirer"
        to: "itl-director"
        message: "interpretation question"
        action: >-
          A question on the content and specifications of the standard is addressed to the Director,
          ITL, ATTN: FIPS 140-3 Interpretation.
        locator: "¶11"
        kind: "stated"
        from_basis: "inferred"
        basis_reason: "The source addresses the question and names no sender (roles: inquirer)."
        quotes:
          - source_lines: "187-190"
            quote: |-
              Questions concerning the content and specifications of this standard should be addressed to: Director, Information Technology Laboratory, ATTN: FIPS 140-3 Interpretation, National Institute of Standards and Technology, 100 Bureau Drive, Stop 8900, Gaithersburg, MD 20899-8900.
        constrained_by:
          - "fips-140-3#R-0008"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "itl-director"
        to: "validation-authorities"
        message: "interpretation question"
        action: "The question reaches the validation authorities that resolve it."
        locator: "¶11"
        kind: "inferred"
        inferred_reason: >-
          ¶11 names the addressee (the ITL Director) and the resolver (the validation authorities at
          NIST and CCCS) but no hand-off between them.
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "validation-authorities"
        to: "inquirer"
        message: "resolution"
        action: "The validation authorities at NIST and CCCS provide resolution of the question."
        locator: "¶11"
        kind: "stated"
        to_basis: "inferred"
        basis_reason: "The source says who provides the resolution, not to whom."
        quotes:
          - source_lines: "190-192"
            quote: |-
              Resolution of questions regarding this standard will be provided by the validation authorities at the National Institute of Standards and Technology and the Canadian Centre for Cyber Security.
        constrained_by:
          - "fips-140-3#R-0033"
        candidates:
          - "C-0028"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
not_modelled:
  - locator: "front matter"
    what: "Comments on FIPS publications (Foreword)"
    reason: >-
      A courtesy of the publication series, outside the standard's operation, with no response
      defined; skeleton candidate C-0001.
    quotes:
      - source_lines: "45-47"
        quote: |-
          Comments concerning FIPS publications are welcomed and should be addressed to the Director, Information Technology Laboratory, National Institute of Standards and Technology, 100 Bureau Drive, Stop 8900, Gaithersburg, MD 20899-8900.
  - locator: "¶14"
    what: "Where to obtain copies (¶14)"
    reason: "Publication availability, not an exchange."
    quotes:
      - source_lines: "253-255"
        quote: |-
          This publication is available electronically at https://csrc.nist.gov/publications. Other computer security publications issued by NIST are available at the same web site.
  - locator: "§3.3, §3.4"
    what: "The document map of §3.3, §3.4 and Table 1 (which SP modifies which ISO/IEC clause)"
    reason: >-
      Structure, not an exchange; it fixes what the evidence in F01 step 1 and the testing in step 2
      are measured against, and is cited there.
  - locator: "§1, §2"
    what: "The module's own operational states (self-tests, error state, approved mode, zeroisation)"
    reason: >-
      FIPS 140-3 adopts ISO/IEC 19790 for them and states none; nist-sp-800-140 models the ones its
      modified assertions name.
source_ambiguities:
  - id: "SA-01"
    locator: "¶12"
    finding: >-
      The test report is submitted to the CMVP in the passive voice; the source never says whether
      the laboratory or the vendor submits it. F01 step 3 reads the laboratory.
    quotes:
      - source_lines: "196-197"
        quote: |-
          A test report for modules demonstrating compliance will be submitted to the CMVP for review and validation.
  - id: "SA-02"
    locator: "¶12, Figure 1"
    finding: >-
      ¶12 gives laboratories a minimum transition of 6 months after approval to implement FIPS 140-3
      testing, while Figure 1 begins FIPS 140-3 testing 18 months after approval. The two agree only
      if 6 is a floor and 18 the schedule actually set; the source does not say which governs.
    quotes:
      - source_lines: "195-196"
        quote: |-
          A minimum transition period of 6 months after approval is provided for testing labs to develop and implement FIPS 140-3 testing.
      - source_lines: "217-218"
        quote: |-
          FIPS 140-3 TESTING BEGINS (18 months after approval date)
  - id: "SA-03"
    locator: "Figure 1"
    finding: >-
      Figure 1 prints a FIPS 140-2 TESTING ENDS milestone with no interval or date in the text
      rendering (its timeline bars are graphics the rendering drops). Its place after FIPS 140-3
      TESTING BEGINS is read from the figure's top-to-bottom order only.
    quotes:
      - source_lines: "206"
        quote: |-
          FIPS 140-2 FIPS 140-3
      - source_lines: "223"
        quote: |-
          FIPS 140-2 TESTING ENDS
      - source_lines: "224"
        quote: |-
          FUTURE
  - id: "SA-04"
    locator: "¶3, ¶9, ¶12"
    finding: >-
      The source names no certificate: validation's stated effects are being considered as
      conforming (¶9) and accepted by agencies (¶3), and ¶12 names a validated modules list and a
      Historical list without saying how a module enters either.
    quotes:
      - source_lines: "161-162"
        quote: |-
          Cryptographic modules that are validated under the CMVP will be considered as conforming to this standard.
      - source_lines: "198-200"
        quote: |-
          Agencies should develop plans for the acquisition of products that are compliant with FIPS 140-3; however, agencies may purchase any of the products on the CMVP validated modules list.
      - source_lines: "200-202"
        quote: |-
          (Note: the CMVP Historical list should not be used for procurement decisions. This list is provided for reference purposes only.)
  - id: "SA-05"
    locator: "¶3, ¶12"
    finding: >-
      One laboratory role has three names in ¶3 and ¶12 (quoted below): CST laboratories, NVLAP
      accredited laboratories and testing labs. The CMVP is joint with CCCS, but only the U.S.
      accreditation program is named.
    quotes:
      - source_lines: "120-121"
        quote: |-
          In the CMVP, vendors of cryptographic modules use independent, accredited Cryptographic and Security Testing (CST) laboratories to have their modules tested.
      - source_lines: "121-123"
        quote: |-
          National Voluntary Laboratory Accreditation Program (NVLAP) accredited laboratories perform cryptographic module compliance/conformance testing.
      - source_lines: "113-114"
        quote: |-
          The CMVP is a joint effort between the National Institute of Standards and Technology and the Canadian Centre for Cyber Security.
  - id: "SA-06"
    locator: "¶11, §1"
    finding: >-
      Questions go to the ITL Director; resolutions come from the validation authorities at NIST and
      CCCS. Neither the hand-off nor the recipient of the resolution is stated, and ¶11 does not say
      the validation authorities are the CMVP, which §1 calls a validation authority.
    quotes:
      - source_lines: "187-190"
        quote: |-
          Questions concerning the content and specifications of this standard should be addressed to: Director, Information Technology Laboratory, ATTN: FIPS 140-3 Interpretation, National Institute of Standards and Technology, 100 Bureau Drive, Stop 8900, Gaithersburg, MD 20899-8900.
      - source_lines: "190-192"
        quote: |-
          Resolution of questions regarding this standard will be provided by the validation authorities at the National Institute of Standards and Technology and the Canadian Centre for Cyber Security.
      - source_lines: "303-304"
        quote: |-
          FIPS 140-3 aligns with ISO/IEC 19790:2012(E) and includes modifications of the Annexes that are allowed to CMVP (as a validation authority).
  - id: "SA-07"
    locator: "¶7"
    finding: >-
      The security level must be chosen to suit the application and environment, but the sentence is
      passive: it does not say whether the vendor (the level a module is validated to) or the
      acquiring agency chooses. F02 step 3 reads the agency.
    quotes:
      - source_lines: "149-152"
        quote: |-
          The security level to which a cryptographic module is validated must be chosen to provide a level of security appropriate for the security requirements of the application and environment in which the module will be utilized and the security services that the module will provide.
  - id: "SA-08"
    locator: "§1"
    finding: >-
      §1 says testing follows ISO/IEC 24759:2017(E) with the modifications allowed under paragraph
      5.2 without naming the document that paragraph belongs to.
    quotes:
      - source_lines: "304-307"
        quote: |-
          The testing for these requirements will be in accordance with ISO/IEC 24759:2017(E), with the modifications, additions or deletions of vendor evidence and testing allowed as a validation authority under paragraph 5.2.
