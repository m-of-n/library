        locator: "¶12"
        kind: "stated"
        quotes:
          - source_lines: "197-198"
            quote: |-
              The review process schedule varies, as it is dependent on coordination between the vendor, testing lab, and CMVP.
        candidates:
          - "C-0033"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        note: >-
          The source names coordination between all three parties and nothing of its messages or
