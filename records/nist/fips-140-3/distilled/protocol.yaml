reader_defect:
  status: >-
    Fixed in library#137 (63d708e) after this lane ran; this block records what the lane worked
    under (normative.md TD-1 and TD-2).
  finding: >-
    bin/_source_text read this rendering wrongly at every page edge (found by this lane,
    2026-11-15). The line that carries a form feed belonged to two pages in furniture_lines(), and
    the earlier page's edge trim in clean_pdf() set it to None, so the first line of every page
    after the first vanished. Here that was ten lines: seven the reader should keep (L37 FOREWORD,
    L56 Abstract, L82 and L261 title lines, L131 the first line of ¶5, L181 the first line of ¶10
    item b, L237 a line of ¶13) and three running headers (L274, L326, L375) whose second line
    survived. No header or footer of this FIPS recurs on half its pages, so nothing was removed as
    furniture: the page numbers (L55, L81, L130, L180, L236, L260, L325, L374, L427) and the header
    residue CRYPTOGRAPHIC MODULES (L275, L327, L376) stayed in as prose. The fixed reader keeps
    the seven lines and reads the page numbers and both header lines as furniture.
  consequence: >-
    bin/check-quotes read through the same function, so a quotation crossing one of these lines
    would have passed it while not being the PDF's words. No quotation in this file or in
    protocol.md or state-machine.yaml spans one: the generator refused any range containing them.
    Under the fixed reader every quotation still checks (pass 2, 2026-11-15).
  lines_refused: >-
    37, 55, 56, 81, 82, 130, 131, 180, 181, 236, 237, 260, 261, 274, 275, 325, 326, 327, 374, 375,
    376, 427
applicability: >-
  FIPS 140-3 defines no message format, but its announcement states a real multi-party process:
  vendors have modules tested by accredited laboratories, a test report goes to the CMVP for review
  and validation, and agencies procure validated modules (¶3, ¶9, ¶12, ¶13); an interpretation
  channel (¶11); and a dated implementation schedule (¶12, Figure 1), which is in
  state-machine.yaml. The module's own operational states belong to ISO/IEC 19790 and are not stated
  here.
conventions:
  quoting: >-
    Every quotation is a quotes item {source_lines, quote} whose words were cut by script from
    .cache/fips-140-3.txt as bin/_source_text reads a PDF rendering (furniture removed, line-end
    hyphens joined, whitespace collapsed), tightened so that dropping either end line loses it, and
    never typed; bin/check-quotes verifies each. Prose in action, guard, note, meaning and on_error
    is this file's wording.
  kind: >-
    stated: the source says this step, state or transition exists. inferred: this model added it,
    and inferred_reason says what the source does and does not say. A stated step whose sender,
    receiver or actor the source does not name carries from_basis, to_basis or actor_basis inferred
    with the reason.
  on_error_basis: >-
    stated: the source says what follows a failure. unspecified: the source names the operation and
    says nothing about its failure. inferred: this file's reading.
  constrained_by: >-
    fips-140-3#R-NNNN ids of requirements.yaml whose text the step obeys or that bind what it emits,
    each emitted by script from a phrase of the requirement text and its locator, refusing zero or
    several matches; every resolved pair was read back. Pass 1 cites only the skeleton's ids (R-0001
    to R-0014 here): the requirements lane adds split children, promoted candidates and inferred
    entries while this lane runs, so a split parent stands for its children and a promoted sentence
    is reached through its C-id or its quotation, for cross-check to join by line containment (the
    rfc-9162 pass 2 method). Pass 3 made that join by script: 25 ids added here and 13 in
    state-machine.yaml, each where the step, precondition, error path, effect or guard quotes the
    whole text of an entry the requirements lane added, with a split child beside a cited parent
    where the step uses one of its verbs; the ids are not the skeleton's alone any more.
  candidates: >-
    C-NNNN ids of this record's inferred-candidates.yaml for keyword-less sentences the step rests
    on, emitted the same way. They are skeleton ids, not requirement ids: where pass 1 promotes one
    to a requirement, cross-check joins it to the new R-id (pass 3 did: the R-id is in constrained_by
    beside the C-id).
  messages: >-
    message names a work product of the work_products list below. FIPS 140-3 defines no message
    format; the names are this model's, for the messages lane and cross-check to join. Pass 3 joined
    each work product to messages.yaml: it carries structure (the messages.yaml names that hold it)
    or structure none with structure_reason (2 of 14 mapped, 12 none).
roles:
  - name: "vendor"
    locator: "¶3, ¶12"
    definition: >-
      A vendor of cryptographic modules; has its modules tested by a CST laboratory and coordinates
      with the laboratory and the CMVP during review.
    kind: "stated"
    quotes:
      - source_lines: "120-121"
        quote: |-
          In the CMVP, vendors of cryptographic modules use independent, accredited Cryptographic and Security Testing (CST) laboratories to have their modules tested.
      - source_lines: "197-198"
        quote: |-
          The review process schedule varies, as it is dependent on coordination between the vendor, testing lab, and CMVP.
  - name: "cst-laboratory"
    locator: "¶3, ¶12"
    definition: >-
      An independent, accredited Cryptographic and Security Testing laboratory; the source also
      calls it an NVLAP accredited laboratory (¶3) and a testing lab (¶12). Performs
      compliance/conformance testing.
    kind: "stated"
    quotes:
      - source_lines: "120-121"
        quote: |-
          In the CMVP, vendors of cryptographic modules use independent, accredited Cryptographic and Security Testing (CST) laboratories to have their modules tested.
      - source_lines: "121-123"
        quote: |-
          National Voluntary Laboratory Accreditation Program (NVLAP) accredited laboratories perform cryptographic module compliance/conformance testing.
      - source_lines: "195-196"
        quote: |-
          A minimum transition period of 6 months after approval is provided for testing labs to develop and implement FIPS 140-3 testing.
  - name: "cmvp"
    locator: "¶3, ¶12, §1"
    definition: >-
      The Cryptographic Module Validation Program, run jointly by NIST and CCCS; validates modules,
      reviews test reports, keeps the validated modules list and the Historical list, and acts as
      validation authority for the ISO/IEC 19790 and 24759 modifications.
    kind: "stated"
    quotes:
      - source_lines: "111-112"
        quote: |-
          The Cryptographic Module Validation Program (CMVP) validates cryptographic modules to Federal Information Processing Standard (FIPS) 140-3 and other cryptography-based standards.
      - source_lines: "113-114"
        quote: |-
          The CMVP is a joint effort between the National Institute of Standards and Technology and the Canadian Centre for Cyber Security.
      - source_lines: "196-197"
        quote: |-
          A test report for modules demonstrating compliance will be submitted to the CMVP for review and validation.
      - source_lines: "303-304"
        quote: |-
          FIPS 140-3 aligns with ISO/IEC 19790:2012(E) and includes modifications of the Annexes that are allowed to CMVP (as a validation authority).
  - name: "nvlap"
    locator: "¶3"
    definition: >-
      The National Voluntary Laboratory Accreditation Program, which accredits the laboratories that
      perform testing. Appears only as a precondition of F01; its accreditation process is not
      described.
    kind: "stated"
    quotes:
      - source_lines: "121-123"
        quote: |-
          National Voluntary Laboratory Accreditation Program (NVLAP) accredited laboratories perform cryptographic module compliance/conformance testing.
  - name: "federal-agency"
    locator: "¶3, ¶6, ¶12"
    definition: >-
      A Federal agency using cryptography-based security systems; accepts validated modules, plans
      acquisitions and purchases from the CMVP validated modules list.
    kind: "stated"
    quotes:
      - source_lines: "114-116"
        quote: |-
          Modules validated as conforming to FIPS 140-3 are accepted by the Federal agencies of both countries for the protection of sensitive information (United States) or Designated Information (Canada).
      - source_lines: "198-200"
        quote: |-
          Agencies should develop plans for the acquisition of products that are compliant with FIPS 140-3; however, agencies may purchase any of the products on the CMVP validated modules list.
  - name: "module-operator"
    locator: "¶13"
    definition: >-
      The operator of a cryptographic module, responsible for the module's security being sufficient
      and acceptable to the information owner and for residual risk being accepted.
    kind: "stated"
    quotes:
      - source_lines: "243-245"
        quote: |-
          The operator of a cryptographic module is responsible for ensuring that the security provided by a module is sufficient and acceptable to the owner of the information that is being protected and that any residual risk is acknowledged and accepted.
  - name: "agency-responsible-authority"
    locator: "¶13"
    definition: >-
      The responsible authority in each agency; it must make sure the system's security is adequate
      and accepted (¶13).
    kind: "stated"
    quotes:
      - source_lines: "245-246"
        quote: |-
          The responsible authority in each agency shall ensure that the security of the system is sufficient and acceptable.
  - name: "inquirer"
    locator: "¶11"
    definition: >-
      Whoever sends a question about the standard's content and specifications. The source names the
      addressee and the resolver, not the sender.
    kind: "inferred"
    inferred_reason: >-
      ¶11 is addressed to anyone with a question and names no sender role; the role is this model's
