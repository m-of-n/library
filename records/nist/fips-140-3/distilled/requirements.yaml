note: >
  FIPS 140-3 ADOPTS ISO/IEC 19790:2012 (security requirements) and ISO/IEC
  24759:2017 (test requirements), modified by NIST SP 800-140x. The detailed,
  auditable per-area/per-level requirements therefore live in ISO/IEC 19790
  (PAYWALLED — logged, not held) and the SP 800-140x series (free). This file
  captures what FIPS 140-3 itself defines: the security-level model, the 11
  requirement areas, and the handful of FIPS-140-3-native normative statements.
  This is a deliberately different, coarser granularity than ISO/SAE 21434 —
  see tmodel #5 on why requirement granularity varies by source.

# 4 security levels; requirements increase with level. A module is validated to a
# single overall level; each of the 11 areas is rated 1-4 and the overall level is
# the minimum across areas.
security_levels:
  - {level: 1, gist: "basic security; production-grade components; at least one Approved function"}
  - {level: 2, gist: "adds role-based authentication and tamper-evidence"}
  - {level: 3, gist: "adds identity-based authentication, tamper-detection/response, SSP entry/exit protection"}
  - {level: 4, gist: "adds robust protection against environmental attacks and complete tamper envelope"}

# The 11 requirement areas (FIPS 140-3 / ISO/IEC 19790). Each is rated per security
# level; the detailed shall-statements per area x level are in ISO/IEC 19790.
requirement_areas:
  - {id: "fips-140-3#AREA-01", name: "Cryptographic module specification", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-02", name: "Cryptographic module interfaces", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-03", name: "Roles, services, and authentication", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-04", name: "Software/firmware security", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-05", name: "Operational environment", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-06", name: "Physical security", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-07", name: "Non-invasive security", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-08", name: "Sensitive security parameter (SSP) management", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-09", name: "Self-tests", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-10", name: "Life-cycle assurance", detail_in: iso-iec-19790}
  - {id: "fips-140-3#AREA-11", name: "Mitigation of other attacks", detail_in: iso-iec-19790}

# FIPS-140-3-native normative statements (not in ISO 19790).
requirements:
  - id: fips-140-3#RQ-01
    normativity: requirement
    verb: shall
    actor: cryptographic module
    nature: property
    locator: "§ Approved Security Functions (item 10)"
    short_title: "Employ Approved security functions"
    text: "Cryptographic modules that conform to this standard shall employ Approved security functions such as cryptographic algorithms, cryptographic key management techniques, and authentication techniques."
    expects_deliverables: []
    verification: "CMVP validation checks Approved functions against SP 800-140C/D"
    external_refs: ["SP 800-140C", "SP 800-140D"]
    tailorable: false
    audit_status: not-reviewed
  - id: fips-140-3#RQ-02
    normativity: requirement
    verb: must
    actor: user/agency (selecting the module)
    nature: process
    locator: "§ Applicability"
    short_title: "Choose the security level to match the risk environment"
    text: "The security level to which a cryptographic module is validated must be chosen to provide a level of security appropriate for the security requirements of the application and environment in which the module is to be utilized."
    expects_deliverables: []
    verification: "risk-based selection; procurement/assessment review"
    tailorable: false
    audit_status: not-reviewed
  - id: fips-140-3#RQ-03
    normativity: requirement
    verb: shall
    actor: cryptographic module
    nature: deliverable-producing
    locator: "§3.3 / SP 800-140B"
    short_title: "Provide a security policy"
    text: "Conformance requires a non-proprietary cryptographic module security policy (the auditable deliverable), per ISO/IEC 19790 Annex B as modified by NIST SP 800-140B."
    expects_deliverables: ["security-policy"]
    verification: "inspect the published module security policy (CMVP)"
    external_refs: ["SP 800-140B", "iso-iec-19790"]
    tailorable: false
    audit_status: not-reviewed

# The required deliverable FIPS 140-3 makes visible; the full deliverable set is in
# ISO/IEC 24759 as modified by SP 800-140A.
required_deliverables:
  - id: "fips-140-3#security-policy"
    deliverable: true
    title: "Cryptographic module security policy (non-proprietary)"
    from_requirements: [fips-140-3#RQ-03]
    detail_in: "SP 800-140B / ISO/IEC 19790 Annex B"
    audit_check: "published, non-proprietary, complete per SP 800-140B; CMVP validated"
