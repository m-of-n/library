    text: 'A module put forward for FIPS 140-3 validation comes with a non-proprietary cryptographic module security policy, whose content is that of ISO/IEC 19790 Annex B as SP 800-140B modifies it (§3.3), and whose vendor evidence and tests are those of ISO/IEC 24759 §6.14 as SP 800-140B modifies it (§3.4).'
