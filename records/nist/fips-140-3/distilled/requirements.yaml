  - id: 'fips-140-3#R-0072'
    locator: '§2'
    text: 'For a FIPS 140-3 validation, the text of SP 800-140 and of SP 800-140A to F governs the ISO/IEC 19790 annex or ISO/IEC 24759 clause it modifies (§3.3, §3.4), and the ISO/IEC text applies as published wherever the SP leaves it unmodified.'
