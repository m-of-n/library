    note: 'Main''s id, kept so citations resolve; inferred because no FIPS 140-3 sentence requires a security policy. Main''s text (ours, not the source''s) said conformance requires one; FIPS 140-3 names the document only as what SP 800-140B modifies (§3.3, §3.4), and the duty is ISO/IEC 19790''s, adopted by §2. Non-proprietary is not FIPS 140-3''s word: nist-sp-800-140 VE02.20.04 presupposes it. The cross-record link is by designator, not by id, because both records number their entries R-NNNN.'
