            quote: |-
              This standard will be reviewed at least every five years in order to consider necessary updates or replacement.
          - source_lines: "248-250"
            quote: |-
              A standard of this nature must be flexible enough to adapt to advancements and innovations in science and technology. New or revised requirements may be needed to meet technological and economic changes.
        constrained_by:
