  - id: "M02"
    name: "fips-140-revision-maintenance"
    locator: "¶3, ¶13, §1"
    subject: "A FIPS 140 revision over its life: in force, reviewed, superseded"
    purpose: >-
      ¶13 commits FIPS 140-3 to review at least every five years to consider updates or replacement;
      §1's history shows both outcomes for its predecessors (FIPS 140-2 reviewed after 5 years
      without consensus to move forward until ISO/IEC 19790:2012; FIPS 140-1 superseded by FIPS
      140-2 in 2001; FIPS 140-2 superseded by FIPS 140-3 in its entirety).
    generalisation: >-
      The transitions out of under-review are stated as history of FIPS 140-1 and FIPS 140-2 and as
      an intention for FIPS 140-3; one machine for any FIPS 140 revision is this model's
      generalisation.
    initial: "in-force"
    states:
      - name: "in-force"
        meaning: "The revision is effective (for FIPS 140-3, M01 from effective onwards)."
        kind: "stated"
        quotes:
          - source_lines: "194-195"
            quote: |-
              This standard becomes effective six months after approval by the Secretary of Commerce.
      - name: "under-review"
        meaning: "A review is considering necessary updates or replacement."
        kind: "stated"
        quotes:
          - source_lines: "250-251"
            quote: |-
              This standard will be reviewed at least every five years in order to consider necessary updates or replacement.
          - source_lines: "298-301"
            quote: |-
              Though the standard was reviewed after 5 years, consensus to move forward was not achieved until publication of the 2012 revision of International Organization for Standardization/International Electrotechnical Commission (ISO/IEC) 19790.
      - name: "superseded"
        meaning: "A successor revision has superseded this one."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "296"
            quote: |-
              In 2001, FIPS 140-2 superseded FIPS 140-1.
          - source_lines: "108-109"
            quote: |-
              This standard supersedes FIPS 140-2, Security Requirements for Cryptographic Modules, in its entirety.
          - source_lines: "303"
            quote: |-
              FIPS 140-3 supersedes FIPS140-2.
    transitions:
      - id: "M02.T01"
        from: "in-force"
        to: "under-review"
        trigger_kind: "event"
        trigger: "review-due"
        kind: "stated"
        guard: "no more than five years since the last review"
        quotes:
