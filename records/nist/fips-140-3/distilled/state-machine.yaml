note: >-
  Conventions as protocol.yaml. States are {name, meaning, kind}; error states carry error yes and
  are listed in error_states; terminal states carry terminal yes. A trigger is a work product of
  protocol.yaml (trigger_kind message) or an event of the events list (trigger_kind event). guard
  and action are this file's wording; guard_ids and constrained_by are fips-140-3#R-NNNN ids emitted
  by script from requirements.yaml and read back; candidates are skeleton C-ids. kind stated: the
  source states the state or transition; inferred: this model added it, with inferred_reason; basis
  says on what a stated transition rests where that is history or figure order rather than a rule.
  Pass 3 added the R-ids of entries a transition's quotes carry whole (13 ids): in guard_ids where
  the transition has a guard and no constrained_by, otherwise in constrained_by.
events:
  - name: "secretary-approval"
    meaning: "The Secretary of Commerce approves FIPS 140-3 (the approval date)."
    kind: "stated"
    quotes:
      - source_lines: "125"
        quote: |-
          4. Approving Authority. Secretary of Commerce.
      - source_lines: "208"
        quote: |-
          APPROVAL DATE OF FIPS 140-3
  - name: "six-months-after-approval"
    meaning: "Six months have elapsed since the approval date."
    kind: "stated"
    quotes:
      - source_lines: "194-195"
        quote: |-
          This standard becomes effective six months after approval by the Secretary of Commerce.
      - source_lines: "211-212"
        quote: |-
          EFFECTIVE DATE OF FIPS 140-3 (6 months after approval date)
  - name: "eighteen-months-after-approval"
    meaning: "Eighteen months have elapsed since the approval date."
    kind: "stated"
    quotes:
      - source_lines: "217-218"
        quote: |-
          FIPS 140-3 TESTING BEGINS (18 months after approval date)
  - name: "fips-140-2-testing-end"
    meaning: "The point at which FIPS 140-2 testing ends; Figure 1 prints no date for it."
    kind: "stated"
    quotes:
      - source_lines: "223"
        quote: |-
          FIPS 140-2 TESTING ENDS
  - name: "review-due"
    meaning: "A review of the standard falls due; reviews come at least every five years."
    kind: "stated"
    quotes:
      - source_lines: "250-251"
        quote: |-
          This standard will be reviewed at least every five years in order to consider necessary updates or replacement.
  - name: "review-ends-without-replacement"
    meaning: "A review concludes without a successor standard."
    kind: "stated"
    quotes:
      - source_lines: "298-301"
        quote: |-
          Though the standard was reviewed after 5 years, consensus to move forward was not achieved until publication of the 2012 revision of International Organization for Standardization/International Electrotechnical Commission (ISO/IEC) 19790.
  - name: "successor-approved"
    meaning: "A successor FIPS 140 revision supersedes this one."
    kind: "stated"
    quotes:
      - source_lines: "296"
        quote: |-
          In 2001, FIPS 140-2 superseded FIPS 140-1.
      - source_lines: "108-109"
        quote: |-
          This standard supersedes FIPS 140-2, Security Requirements for Cryptographic Modules, in its entirety.
  - name: "review-ends-without-validation"
    meaning: "A CMVP review concludes without validating the module."
    kind: "inferred"
    inferred_reason: "The source names no negative outcome of review (F01.E2)."
  - name: "testing-ends-without-compliance"
    meaning: "Testing concludes without the module demonstrating compliance."
    kind: "inferred"
    inferred_reason: >-
      ¶12 conditions the test report on demonstrating compliance and states no case of a module
      that does not (F01.E1, M03.T03); pass 2 changed this from stated.
    quotes:
      - source_lines: "196-197"
        quote: |-
          A test report for modules demonstrating compliance will be submitted to the CMVP for review and validation.
  - name: "cmvp-validates"
    meaning: "The CMVP validates the module."
    kind: "stated"
    quotes:
      - source_lines: "111-112"
        quote: |-
          The Cryptographic Module Validation Program (CMVP) validates cryptographic modules to Federal Information Processing Standard (FIPS) 140-3 and other cryptography-based standards.
  - name: "moved-to-historical-list"
    meaning: "A module comes to be on the CMVP Historical list."
    kind: "inferred"
    inferred_reason: "¶12 names the Historical list; no sentence says how or when a module enters it."
machines:
