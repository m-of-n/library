    quote: '10. Approved Security Functions. Cryptographic modules that conform to this standard shall employ Approved security functions such as cryptographic algorithms, cryptographic key management techniques, and authentication techniques that have been approved for protecting Federal government sensitive information. Approved security functions include those that are either: a. specified in a Federal Information Processing Standard (FIPS), b. adopted in a FIPS and specified either in an appendix to the FIPS or in a document referenced by the FIPS, c. specified in NIST SP 800-140C as an Approved security function, or d. specified in NIST SP 800-140D as an Approved sensitive security parameter establishment method.'
