  note: "Digest is of the PDF as NIST serves it today. That PDF is the July 2013 standard with a one-page NIST 'Withdrawn NIST Technical Series Publication' warning prepended ('Date updated: February 5, 2024'). It is therefore not the byte-identical 2013 file. 131 PDF pages: the notice, then the 130-page standard. Withdrawal verified on the CSRC landing page (https://csrc.nist.gov/pubs/fips/186-4/final), fetched 2026-11-03: 'Withdrawn on February 03, 2024. Superseded by FIPS 186-5', with the planning note quoting FIPS 186-5's Implementation Schedule clause 12 (one-year transition). The cover notice agrees. The landing page lists 'Supersedes: FIPS 186-3 (06/25/2009)'. maturity: historic is the closest schema value for a withdrawn FIPS. The schema has no 'withdrawn'. The publication date of July 19, 2013 is from the withdrawal notice. The title page says 'Issued July 2013'."
