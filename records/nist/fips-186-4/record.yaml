  reason: "Withdrawn 2024-02-03 and superseded in its entirety by fips-186-5, which is the record to build on. Kept because DSA signatures generated under it can still need verifying (fips-186-5 keeps DSA for verification only), and because it shows a signature standard written with no quantum adversary in its threat model."
