- id: sp-800-218r1#PW.8.2
  designator: PW.8.2
  level: task
  group: PW
  practice: PW.8
  normativity: recommendation
  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: deliverable
  phase: verification
  locator: Table 1 (§2), PW.8.2, p. 31
  short_title: Scope the testing, design the tests, perform the testing, and document the …
  text: Scope the testing, design the tests, perform the testing, and document the results, including recording and triaging all discovered issues and recommended remediations in the development team’s workflow or issue tracking system.
  notional_implementation_examples:
  - id: PW.8.2/E1
    text: Perform robust functional testing of security features, including failure path testing.
  - id: PW.8.2/E2
    text: Integrate dynamic vulnerability testing into the project’s automated test suite.
  - id: PW.8.2/E3
    text: Incorporate tests for previously reported vulnerabilities into the project’s test suite to ensure that errors are not reintroduced.
  - id: PW.8.2/E4
    text: Take into consideration the infrastructures and technology stacks that the software will be used with in production when developing test plans.
  - id: PW.8.2/E5
    text: Use fuzz testing tools to find issues with input handling.
  - id: PW.8.2/E6
    text: If resources are available, use penetration testing to simulate how an attacker might attempt to compromise the software in high-risk scenarios.
  - id: PW.8.2/E7
    text: Identify and record the root causes of discovered issues.
  - id: PW.8.2/E8
    text: Document lessons learned from code testing in a wiki that developers can access and search.
  - id: PW.8.2/E9
    text: Use source code, design records, and other resources when developing test plans.
  - id: PW.8.2/E10
    text: Identify third-party dependencies, and conduct robust tests to exercise the functionality that uses these dependencies.
  maps_to:
