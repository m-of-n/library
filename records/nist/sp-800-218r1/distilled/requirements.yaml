- id: sp-800-218r1#PO.5.2
  designator: PO.5.2
  level: task
  group: PO
  practice: PO.5
  normativity: recommendation
  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: process
  phase: implementation
  locator: Table 1 (§2), PO.5.2, p. 17
  short_title: Secure and harden development endpoints
  text: Secure and harden development endpoints (e.g., for software designers, developers, testers, builders) to perform development-related tasks using a risk-based approach.
  notional_implementation_examples:
  - id: PO.5.2/E1
    text: Configure each development endpoint based on approved hardening guides and checklists (e.g., enable FIPS-compliant encryption of all sensitive data at rest and in transit).
  - id: PO.5.2/E2
    text: Configure development endpoints and resources to provide the least functionality needed by users and services and to enforce the principle of least privilege.
  - id: PO.5.2/E3
    text: Continuously monitor the security posture of all development endpoints, including monitoring and auditing all use of privileged access.
  - id: PO.5.2/E4
    text: Configure security controls and other tools involved in securing and hardening development endpoints to generate artifacts for their activities.
  - id: PO.5.2/E5
    text: Require multi-factor authentication for all access to development endpoints and resources.
  - id: PO.5.2/E6
    text: Provide dedicated development endpoints on non-production networks for performing all development-related tasks. Provide separate endpoints on production networks for all other tasks.
  - id: PO.5.2/E7
    text: Configure each development endpoint following a zero trust architecture.
