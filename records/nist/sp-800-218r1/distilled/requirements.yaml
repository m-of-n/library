- id: sp-800-218r1#PW.1
  designator: PW.1
  level: practice
  group: PW
  name: Design Software to Meet Security Requirements and Mitigate Security Risks
  normativity: recommendation
  verb: should (group-level, §2)
  actor: organization (software producer)
  nature: process
  phase: implementation
  locator: Table 1 (§2), PW.1, p. 22
  short_title: Design Software to Meet Security Requirements and Mitigate Security Risks
  text: Identify and evaluate the security requirements for the software; determine what security risks the software is likely to face during operation and how the software’s design and architecture should mitigate those risks; and justify any cases for which risk-based analysis indicates that security requirements should be relaxed or waived. Addressing security requirements and risks during software design (i.e., secure by design) is key to improving software security and also helps improve development efficiency.
  tasks:
  - PW.1.1
  - PW.1.2
  - PW.1.3
  expects_deliverables: []
  verification: satisfied through its tasks
  kind: stated
  testable: 'no'
  change_vs_v1_1: practice explanation reworded (editorial; see diff-vs-v1.1.md §2)
  notes: ''
- id: sp-800-218r1#PW.1.1
  designator: PW.1.1
  level: task
  group: PW
  practice: PW.1
  normativity: recommendation
  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: deliverable
  phase: design
  locator: Table 1 (§2), PW.1.1, p. 22
  short_title: Use forms of risk modeling
  text: Use forms of risk modeling (e.g., threat modeling, attack modeling, attack surface mapping) to help assess the security risk for the software.
  notional_implementation_examples:
  - id: PW.1.1/E1
    text: Train the development team (security champions, in particular) or collaborate with a risk modeling expert to create models and analyze how to use a risk-based approach to communicate the risks and determine how to address them, including implementing mitigations.
  - id: PW.1.1/E2
    text: Perform more rigorous assessments for high-risk areas, such as protecting sensitive data and safeguarding identification, authentication, and access control, including credential management.
  - id: PW.1.1/E3
    text: Review vulnerability reports and statistics for previous software to inform the security risk assessment.
  - id: PW.1.1/E4
    text: Use data classification methods to identify and characterize each type of data that the software will interact with.
  - id: PW.1.1/E5
    text: Consider processes for creating and sharing under controlled disclosure the risk and threat models used during software development to inform customer risk management decisions.
