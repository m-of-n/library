  - id: PO.2.3/E3
    text: Assist upper management in incorporating secure development support into their communications with personnel with development-related roles and responsibilities.
  - id: PO.2.3/E4
    text: Educate all personnel with development-related roles and responsibilities on upper management’s commitment to secure development and the importance of secure development to the organization.
