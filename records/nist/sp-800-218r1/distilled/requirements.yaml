  short_title: Communicate requirements to all third parties who will provide commercial software components …
  text: Communicate requirements to all third parties who will provide commercial software components to the organization for reuse by the organization’s own software. [Formerly PW.3.1]
  formerly: PW.3.1
  notional_implementation_examples:
  - id: PO.1.3/E1
    text: Define a core set of security requirements for software components, and include it in acquisition documents, software contracts, and other agreements with third parties.
  - id: PO.1.3/E2
    text: Define security-related criteria for selecting software, such as a third party’s vulnerability disclosure program, product security incident response capabilities, or adherence to their organization-defined practices.
  - id: PO.1.3/E3
    text: Require third parties to attest that their software complies with the organization’s security requirements.
  - id: PO.1.3/E4
    text: Require third parties to provide provenance data and integrity verification mechanisms for all components of their software.
  - id: PO.1.3/E5
    text: Establish and follow processes to address risk when there are security requirements that third-party software components to be acquired do not meet, including periodic reviews of all approved exceptions to requirements.
