  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: process
  phase: design
  locator: Table 1 (§2), PW.1.3, p. 23
  short_title: Where appropriate, build in support for using standardized security features and services
  text: Where appropriate, build in support for using standardized security features and services (e.g., enabling software to integrate with existing log management, identity management, access control, and vulnerability management systems) instead of creating proprietary implementations of security features and services. [Formerly PW.4.3]
  formerly: PW.4.3
  notional_implementation_examples:
  - id: PW.1.3/E1
    text: Maintain one or more software repositories of modules for supporting standardized security features and services.
  - id: PW.1.3/E2
    text: Determine secure configurations for modules for supporting standardized security features and services, and make these configurations available (e.g., as configuration-as-code) so developers can readily use them.
  - id: PW.1.3/E3
    text: Define criteria for which security features and services must be supported by software to be developed.
  - id: PW.1.3/E4
    text: Use common and secure logging formats and features.
  - id: PW.1.3/E5
    text: Ensure that the software adheres to the principle of least privilege. Identify the minimal functionality needed when operating with elevated privileges (e.g., kernel space or admin privileges). Design software modules with the minimal functionality needed to run with elevated privileges, and ensure that all other capabilities and functionalities are run with lower privileges (e.g., user space or application privileges).
