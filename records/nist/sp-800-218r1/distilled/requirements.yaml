- id: sp-800-218r1#PW.4.4
  designator: PW.4.4
  level: task
  group: PW
  practice: PW.4
  normativity: recommendation
  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: deliverable
  phase: supply-chain
  locator: Table 1 (§2), PW.4.4, p. 27
  short_title: Verify that acquired commercial, open-source, and all other third-party software components comply …
  text: Verify that acquired commercial, open-source, and all other third-party software components comply with the requirements, as defined by the organization, throughout their life cycles.
  notional_implementation_examples:
  - id: PW.4.4/E1
    text: Regularly check whether there are publicly known vulnerabilities in the software modules and services that vendors have not yet remediated.
  - id: PW.4.4/E2
    text: Build into the toolchain automatic detection of known vulnerabilities in software components.
  - id: PW.4.4/E3
    text: Use existing results from commercial services for vetting the software modules and services.
  - id: PW.4.4/E4
    text: Ensure that each software component is still actively maintained and has not reached end of life. This should include assurance that new vulnerabilities found in the software are being remediated and should extend to software that has been acquired as part of a merger or acquisition.
  - id: PW.4.4/E5
    text: Determine a plan of action for each software component that is no longer being maintained or will not be available in the near future.
  - id: PW.4.4/E6
    text: Confirm the integrity of software components through digital signatures or other mechanisms.
  - id: PW.4.4/E7
    text: Review, analyze, and/or test code. See PW.7 and PW.8.
  - id: PW.4.4/E8
    text: Regularly review all third-party libraries for ownership changes, and evaluate any impacts from a change in ownership.
