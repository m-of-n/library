  actor: organization (software producer)
  nature: deliverable
  phase: design
  locator: Table 1 (§2), PW.2.1, p. 24
  short_title: Have 1) a qualified person
  text: Have 1) a qualified person (or people) who were not involved with the design and/or 2) automated processes instantiated in the toolchain review the software design to confirm and enforce that it meets all of the security requirements and satisfactorily addresses the identified risk information.
  notional_implementation_examples:
  - id: PW.2.1/E1
    text: Review the software design to confirm that it addresses applicable security requirements.
  - id: PW.2.1/E2
    text: Review the risk models created during software design to determine if they appear to adequately identify the risks.
  - id: PW.2.1/E3
    text: Review the software design to confirm that it satisfactorily addresses the risks identified by the risk models.
  - id: PW.2.1/E4
    text: Have the software’s designer correct failures to meet the requirements.
  - id: PW.2.1/E5
    text: Change the design and/or the risk response strategy if the security requirements cannot be met.
  - id: PW.2.1/E6
    text: Record the findings of design reviews to serve as artifacts (e.g., in the software specification, in the issue tracking system, in the threat model).
