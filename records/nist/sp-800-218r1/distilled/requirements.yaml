- id: sp-800-218r1#PW.7.2
  designator: PW.7.2
  level: task
  group: PW
  practice: PW.7
  normativity: recommendation
  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: deliverable
  phase: verification
  locator: Table 1 (§2), PW.7.2, p. 30
  short_title: Perform the code review and/or code analysis based on the organization’s secure …
  text: Perform the code review and/or code analysis based on the organization’s secure coding standards, and record and triage all discovered issues and recommended remediations in the development team’s workflow or issue tracking system.
  notional_implementation_examples:
  - id: PW.7.2/E1
    text: Perform peer review of code, and review any existing code review, analysis, or testing results as part of the peer review.
  - id: PW.7.2/E2
    text: Use expert reviewers to check code for backdoors and other malicious content.
  - id: PW.7.2/E3
    text: Use peer reviewing tools that facilitate the peer review process, and document all discussions and other feedback.
  - id: PW.7.2/E4
    text: Use a static analysis tool to automatically check code for vulnerabilities and compliance with the organization’s secure coding standards with a human reviewing the issues reported by the tool and remediating them as necessary.
  - id: PW.7.2/E5
    text: Use review checklists to verify that the code complies with the requirements.
  - id: PW.7.2/E6
    text: Use automated tools to identify and remediate documented and verified unsafe software practices on a continuous basis as human-readable code is checked into the code repository.
  - id: PW.7.2/E7
    text: Identify and document the root causes of discovered issues.
  - id: PW.7.2/E8
    text: Document lessons learned from code review and analysis in a wiki that developers can access and search.
