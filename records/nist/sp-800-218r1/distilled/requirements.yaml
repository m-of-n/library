- id: sp-800-218r1#PW.5.1
  designator: PW.5.1
  level: task
  group: PW
  practice: PW.5
  normativity: recommendation
  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: process
  phase: implementation
  locator: Table 1 (§2), PW.5.1, p. 27
  short_title: Follow all secure coding practices that are appropriate to the development languages …
  text: Follow all secure coding practices that are appropriate to the development languages and environment to meet the organization’s requirements.
  notional_implementation_examples:
  - id: PW.5.1/E1
    text: Validate all inputs, and validate and properly encode all outputs.
  - id: PW.5.1/E2
    text: Avoid using unsafe functions and calls.
  - id: PW.5.1/E3
    text: Detect errors, and handle them gracefully.
  - id: PW.5.1/E4
    text: Provide logging and tracing capabilities.
  - id: PW.5.1/E5
    text: Use development environments with automated features that encourage or require the use of secure coding practices with just-in-time training-in-place.
  - id: PW.5.1/E6
    text: Follow procedures for manually ensuring compliance with secure coding practices when automated methods are insufficient or unavailable.
  - id: PW.5.1/E7
    text: Use tools (e.g., linters, formatters) to standardize the style and formatting of the source code.
  - id: PW.5.1/E8
    text: Check for other vulnerabilities that are common to the development languages and environment.
  - id: PW.5.1/E9
    text: Have the developer review their own human-readable code to complement (not replace) code review performed by other people or tools. See PW.7.
  - id: PW.5.1/E10
    text: When designing interfaces that accept input, use well-structured input formats that can be easily validated and sanitized.
  - id: PW.5.1/E11
    text: Where appropriate, use formal methods and provers to validate the correctness of code. While particular attention should be given to high-risk code, other sections of code may also benefit from these techniques while balancing cost and risk trade-offs.
