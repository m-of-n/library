- id: sp-800-218r1#PO.3.2
  designator: PO.3.2
  level: task
  group: PO
  practice: PO.3
  normativity: recommendation
  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: process
  phase: implementation
  locator: Table 1 (§2), PO.3.2, p. 13
  short_title: Follow recommended security practices to deploy, operate, and maintain tools and toolchains
  text: Follow recommended security practices to deploy, operate, and maintain tools and toolchains.
  notional_implementation_examples:
  - id: PO.3.2/E1
    text: Evaluate, select, and acquire tools, and assess the security of each tool.
  - id: PO.3.2/E2
    text: Integrate tools with other tools and existing software development processes and workflows.
  - id: PO.3.2/E3
    text: Use code-based configuration for toolchains (e.g., pipelines as code, toolchains as code).
  - id: PO.3.2/E4
    text: Implement the technologies and processes needed for reproducible builds.
  - id: PO.3.2/E5
    text: Update, upgrade, or replace tools as needed to address tool vulnerabilities or add new tool capabilities.
  - id: PO.3.2/E6
