  short_title: Have a policy that addresses vulnerability disclosure and remediation, and implement the …
  text: Have a policy that addresses vulnerability disclosure and remediation, and implement the roles, responsibilities, and processes needed to support that policy.
  notional_implementation_examples:
  - id: RV.1.3/E1
    text: Establish a vulnerability disclosure program, and make it easy for security researchers to learn about the program and report possible vulnerabilities.
  - id: RV.1.3/E2
    text: Have a Product Security Incident Response Team (PSIRT) and processes in place to handle the responses to vulnerability reports and incidents, including communications plans for all stakeholders.
  - id: RV.1.3/E3
    text: Have a security response playbook to handle a generic reported vulnerability, a report of zero days, a vulnerability being exploited in the wild, and a major ongoing incident involving multiple parties and open-source software components.
  - id: RV.1.3/E4
    text: Periodically conduct exercises of the product security incident response processes.
