  short_title: Create new roles and alter responsibilities for existing roles as needed to …
  text: Create new roles and alter responsibilities for existing roles as needed to encompass all parts of the SDLC. Periodically review and maintain the defined roles and responsibilities, updating them as needed.
  notional_implementation_examples:
  - id: PO.2.1/E1
    text: Define SDLC-related roles and responsibilities for all members of the software development team.
  - id: PO.2.1/E2
    text: Integrate the security roles into the software development team.
  - id: PO.2.1/E3
    text: Define roles and responsibilities for cybersecurity staff, security champions, project managers and leads, senior management, software developers, software testers, software assurance leads and staff, product owners, operations, site reliability engineers and platform engineers, and others involved in the SDLC.
  - id: PO.2.1/E4
    text: Conduct an annual review of all roles and responsibilities.
  - id: PO.2.1/E5
    text: Educate affected individuals on impending changes to roles and responsibilities, and confirm that the individuals understand the changes and agree to follow them.
  - id: PO.2.1/E6
    text: Implement and use tools and processes to promote communication and engagement among individuals with SDLC-related roles and responsibilities, such as creating messaging channels for team discussions.
  - id: PO.2.1/E7
    text: Designate a group of individuals or a team as the code owner for each project.
