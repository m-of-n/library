  locator: Table 1 (§2), PW.9.1, p. 33
  short_title: Define a secure baseline by determining how to configure each setting that …
  text: Define a secure baseline by determining how to configure each setting that has an effect on security or a security-related setting so that the default settings are secure and do not weaken the security functions provided by the platform, network infrastructure, or services.
  notional_implementation_examples:
  - id: PW.9.1/E1
    text: Conduct testing to ensure that the settings, including the default settings, are working as expected and are not inadvertently causing any security weaknesses, operational issues, or other problems.
  - id: PW.9.1/E2
    text: Prohibit the use of default passwords or hard-coded secrets and protection mechanisms.
  - id: PW.9.1/E3
    text: Make available a robust range of settings with secure default values that enable software administrators to control logging capabilities (e.g., changes to configuration, security events, safety events) and how long log entries are retained.
