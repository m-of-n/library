- id: sp-800-218r1#PW.4.1
  designator: PW.4.1
  level: task
  group: PW
  practice: PW.4
  normativity: recommendation
  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: process
  phase: supply-chain
  locator: Table 1 (§2), PW.4.1, p. 24
  short_title: Acquire and maintain well-secured software components
  text: Acquire and maintain well-secured software components (e.g., software libraries, modules, middleware, frameworks) from commercial, open-source, and other third-party developers for use by the organization’s software.
  notional_implementation_examples:
  - id: PW.4.1/E1
    text: Review and evaluate third-party software components in the context of their expected use. If a component is to be used in a substantially different way in the future, perform the review and evaluation again with that new context in mind.
  - id: PW.4.1/E2
    text: Determine secure configurations for software components, and make these available (e.g., as configuration-as-code) so developers can readily use the configurations.
  - id: PW.4.1/E3
    text: Obtain provenance information (e.g., SBOM, source composition analysis, binary software composition analysis) for each software component, and analyze that information to better assess the risk that the component may introduce.
  - id: PW.4.1/E4
    text: Establish one or more software repositories to host sanctioned and vetted open-source components.
  - id: PW.4.1/E5
    text: Maintain a list of organization-approved commercial software components and component versions along with their provenance data.
  - id: PW.4.1/E6
    text: Designate which components must be included in software to be developed.
  - id: PW.4.1/E7
    text: Implement processes to update deployed software components to newer versions, and retain older versions of software components until all transitions from those versions have been completed successfully.
  - id: PW.4.1/E8
    text: If the integrity or provenance of acquired binaries cannot be confirmed, build binaries from source code after verifying the source code’s integrity and provenance.
