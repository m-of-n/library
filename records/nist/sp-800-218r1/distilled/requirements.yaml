- id: sp-800-218r1#PO.1.2
  designator: PO.1.2
  level: task
  group: PO
  practice: PO.1
  normativity: recommendation
  verb: should (group-level, §2); task text imperative
  actor: organization (software producer)
  nature: deliverable
  phase: requirements
  locator: Table 1 (§2), PO.1.2, p. 7
  short_title: Identify and document all security requirements for organization-developed software to meet, and …
  text: Identify and document all security requirements for organization-developed software to meet, and maintain the requirements over time.
  notional_implementation_examples:
  - id: PO.1.2/E1
    text: Define policies that specify risk-based software architecture and design requirements, such as making code modular to facilitate code reuse and updates, isolating security components from other components during execution, avoiding undocumented commands and settings, using consensus standards where available, and providing features that will aid software acquirers with the secure deployment, operation, and maintenance of the software, including secure default configurations.
  - id: PO.1.2/E2
    text: Define policies that specify the security requirements for the organization’s software, and verify compliance at key points in the SDLC (e.g., classes of software flaws verified by gates, responses to vulnerabilities discovered in released software).
  - id: PO.1.2/E3
    text: Analyze the risk of applicable technology stacks (e.g., languages, environments, deployment models), and recommend or require the use of stacks that will reduce risk compared to others.
  - id: PO.1.2/E4
    text: Define policies that specify what needs to be archived for each software release (e.g., code, package files, third-party libraries, documentation, data inventory) and how long it needs to be retained based on the SDLC model, software end-of-life, and other factors.
  - id: PO.1.2/E5
    text: Ensure that policies cover the entire software life cycle, including notifying users of the impending end of software support and the date of software end-of-life.
  - id: PO.1.2/E6
    text: Review all security requirements at least annually, sooner if there are new requirements from internal or external sources, if a major vulnerability is discovered in released software, or if a major security incident targeting organization-developed software has occurred.
  - id: PO.1.2/E7
    text: Establish and follow processes for handling requirement exception requests, including periodic reviews of all approved exceptions.
