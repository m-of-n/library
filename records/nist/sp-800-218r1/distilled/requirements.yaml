  short_title: Determine which compiler, interpreter, and build tool features should be used and …
  text: Determine which compiler, interpreter, and build tool features should be used and how each should be configured, then implement and use the approved configurations.
  notional_implementation_examples:
  - id: PW.6.2/E1
    text: Enable compiler features that produce warnings for poorly secured code during the compilation process.
  - id: PW.6.2/E2
    text: Implement the “clean build” concept, where all compiler warnings are treated as errors and eliminated except those determined to be false positives or irrelevant.
  - id: PW.6.2/E3
    text: Perform all builds in a dedicated, highly controlled build environment.
  - id: PW.6.2/E4
    text: Enable compiler features that randomize or obfuscate execution characteristics, such as memory location usage, that would otherwise be predictable and thus potentially exploitable.
  - id: PW.6.2/E5
    text: Test to ensure that the features are working as expected and are not inadvertently causing any operational issues or other problems.
  - id: PW.6.2/E6
    text: Continuously verify that the approved configurations are being used.
  - id: PW.6.2/E7
    text: Make the approved tool configurations available as configuration-as-code so developers can readily use them.
