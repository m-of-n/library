  short_title: Identify and document all security requirements for the organization’s software development infrastructures …
  text: Identify and document all security requirements for the organization’s software development infrastructures and processes, and maintain the requirements over time.
  notional_implementation_examples:
  - id: PO.1.1/E1
    text: Define policies for securing software development infrastructures and their components, including development endpoints, throughout the SDLC and maintaining that security.
  - id: PO.1.1/E2
    text: Define policies for securing software development processes throughout the SDLC and maintaining that security, including for open-source and other third-party software components utilized by software being developed.
  - id: PO.1.1/E3
    text: Review and update security requirements at least annually, or sooner if there are new requirements from internal or external sources, or if a major security incident targeting software development infrastructure has occurred.
  - id: PO.1.1/E4
    text: Educate affected individuals on impending changes to requirements.
