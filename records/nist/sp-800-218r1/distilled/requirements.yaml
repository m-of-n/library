  - id: PO.4.1/E3
    text: Add software security criteria to existing checks (e.g., the Definition of Done in agile SDLC methodologies).
  - id: PO.4.1/E4
    text: Review the artifacts generated as part of the software development workflow system to determine whether they meet the criteria.
  - id: PO.4.1/E5
    text: Record security check approvals, rejections, and exception requests as part of the workflow and tracking system.
  - id: PO.4.1/E6
    text: Analyze collected data in the context of the security successes and failures of each development project, and use the results to improve the SDLC.
