schema: "library-object-model/v1"
record: sp-800-218r1
source_version: "SSDF 1.2, SP 800-218r1 ipd (Initial Public Draft, 2025-12-17)"
source_digest: "0f40af24b5d0175ced02dee971a89128f55ea9ac077963038b46cc9434a8d000"
extracted: "2026-10-02"
reviewed_by: ""
question: "What objects (entity types) and relationship edges does SSDF 1.2 IPD assume or define?"
note: >
  Locators: "§n (lines a–b)" are the draft's margin line numbers; "Table 1, X.n.m" is a task row
  (with Example n where the object only appears in an example). kind: stated = the source names
  the object/edge (in a definition, practice, task, or example); kind: inferred = needed to make
  the stated text coherent but never named. Names follow the Lane A shared vocabulary so the NIST
  records merge into one graph. Objects that are NEW relative to SSDF 1.1 (PO.6, PS.4 and the
  examples added in 1.2) are marked `new_in_1_2: true`.

objects:
  # ---------------- framework layer (the SSDF describing itself)
  - name: Framework
    definition: "The SSDF itself: a versioned set of practice groups, practices, tasks, notional implementation examples and references."
    attributes: [name, version, status (draft|final), publication_id]
    locator: "§2 (lines 282–284)"
    kind: stated
    tmodel_mapping: "library record (sp-800-218r1) — the requirement source behind R-044 Requirement.source"
    notes: "Version is load-bearing: 1.1 final vs 1.2 IPD carry different task sets and reference mappings."
  - name: PracticeGroup
    definition: "One of four groups (PO, PS, PW, RV), each stated as an organizational 'should'."
    attributes: [id (PO|PS|PW|RV), name, statement]
    locator: "§2 (lines 284–296)"
    kind: stated
    tmodel_mapping: "new — grouping facet on Requirement (R-044); NOT a LifecyclePhase (§3b): groups are organizational/domain-structured and §2 says table order implies no sequence (aligned with sp-800-218 object model, verify pass 2026-10-02)"
    notes: ""
  - name: Practice
    definition: "The name of the practice, a unique identifier, and a brief explanation of what the practice is and why it is beneficial."
    attributes: [id (e.g. PO.1), name, description, status (active|retired), group]
    locator: "§2 (lines 298–299)"
    kind: stated
    tmodel_mapping: "Requirement (DL-0009 R-042/R-044), level=practice"
    notes: "Retired practice PW.3 keeps its identifier with text 'Moved to PW.4'."
  - name: Task
    definition: "One or more actions that may be needed to perform a practice."
    attributes: [id (e.g. PO.1.1), text, status (active|retired), formerly (e.g. PW.3.1), moved_to]
    locator: "§2 (line 300)"
    kind: stated
    tmodel_mapping: "Requirement (R-042), level=task — the atomic conformance unit; a Gate exit criterion (R-041) cites tasks"
    notes: "Retired task ids (PW.3.1, PW.3.2, PW.4.3, PW.4.5, PW.5.2) persist as 'Moved to …' rows."
  - name: NotionalImplementationExample
    definition: "One or more notional examples of types of tools, processes, or other methods that could be used to help implement a task. No examples or combination of examples are required."
    attributes: [id (task/En), text]
    locator: "§2 (lines 301–305)"
    kind: stated
    tmodel_mapping: "new — candidate MitigationInstance template (R-040: kind technical|documentation|process); never a conformance obligation"
    notes: "Explicitly non-mandatory: an example is evidence of one way, not a requirement."
  - name: InformativeReference
    definition: "Pointers to one or more established secure development practice documents and their mappings to a particular task."
    attributes: [scheme_key (e.g. BSIMM, SP80053), document (title, edition), locator_ids]
    locator: "§2 (lines 306–308); References section"
    kind: stated
    tmodel_mapping: "library record (cites) + R-044 crosswalk edge maps_to"
    notes: "29 schemes used in Table 1; edition matters (BSIMM12, SAMM 1.5, ASVS 4.0.3, CSF 1.1 and CSF 2.0 side by side)."
  - name: CommunityProfile
    definition: "Not named in 1.2 IPD body; the SSDF project page defines profiles that tailor SSDF tasks to a use case (e.g., SP 800-218A)."
    attributes: [base_framework_version, use_case]
    locator: "Note to Reviewers (lines 53–57) — OLIR mappings; profiles are defined outside this document"
    kind: inferred
    tmodel_mapping: "new — a tailored Requirement set (cf. SDL tailoring in R-041)"
    notes: "Inferred; the draft does not use the word 'profile'."

  # ---------------- parties and roles
  - name: Organization
    definition: "The adopting entity whose people, processes and technology perform secure software development."
    attributes: [name, sector, size, maturity]
    locator: "§2 (lines 285–289); Executive Summary (lines 150–163)"
    kind: stated
    tmodel_mapping: "Party (ARCH-0001 §2b)"
    notes: ""
  - name: SoftwareProducer
    definition: "Role: COTS product vendors, GOTS software developers, software developers working within or on behalf of software acquirer organizations."
    attributes: [type (COTS|GOTS|custom|internal)]
    locator: "Audience (lines 30–33); §1 (lines 246–250)"
    kind: stated
    tmodel_mapping: "Party relational role on edge produced_by / supplied_by (§2b)"
    notes: ""
  - name: SoftwareAcquirer
    definition: "Role: federal agencies and other organizations that define required or desired characteristics for software in their acquisition processes."
    attributes: []
    locator: "Audience (lines 33–34); §1 (lines 242–245)"
    kind: stated
    tmodel_mapping: "Party relational role (consumer) — §2b"
    notes: ""
  - name: ThirdPartySupplier
    definition: "Third parties who provide commercial software components, or open-source/other third-party components, to the organization."
    attributes: [vulnerability_disclosure_program, psirt_capability, ownership]
    locator: "Table 1, PO.1.3; PW.4.4 (Example 8 'ownership changes')"
    kind: stated
    tmodel_mapping: "Party with supplier role (§2b)"
    notes: "1.2 adds ownership-change review (PW.4.4 Ex 8) and merger/acquisition scope (PW.4.4 Ex 4)."
  - name: PlatformServiceProvider
    definition: "Provider of IaaS/SaaS/PaaS/CaaS/serverless under a shared responsibility model with the tenant organization."
    attributes: [service_model]
    locator: "§1 (lines 273–280)"
    kind: stated
    tmodel_mapping: "Party (provider role)"
    notes: ""
  - name: ResponsibilityAgreement
    definition: "Agreement between tenant and providers specifying which party is responsible for each practice and task and how each provider will attest to conformance."
    attributes: [parties, practice_task_assignments, attestation_method]
    locator: "§1 (lines 277–280)"
    kind: stated
    tmodel_mapping: "new — per-task responsibility assignment; an Assertion of conformance by a Party (§4)"
    notes: "This is the SSDF's only explicit attestation hook in the body text."
  - name: Role
    definition: "SDLC-related role with responsibilities (e.g., security champion, PSIRT, software assurance lead, site reliability engineer)."
    attributes: [name, responsibilities, required_training]
    locator: "Table 1, PO.2.1 (Example 1), PO.2.2, RV.1.3 (Example 2)"
    kind: stated
    tmodel_mapping: "Party role / RACI on Gate (R-041)"
    notes: "1.2 adds 'site reliability engineers' to PO.2.1 Ex 1 list."
  - name: Personnel
    definition: "Individuals with SDLC responsibilities who receive role-based training."
    attributes: [roles, training_records]
    locator: "Table 1, PO.2.2"
    kind: stated
    tmodel_mapping: "Party (person)"
    notes: ""
  - name: LeadershipSponsor
    definition: "Upper management or authorizing official; 'a single leader (e.g., a senior executive or C-suite level sponsor) or a leadership team' accountable for releasing software to production."
    attributes: [commitment, accountability]
    locator: "Table 1, PO.2.3 (Example 1)"
    kind: stated
    tmodel_mapping: "Party role — approver on Review / Gate sign-off (R-041, R-043)"
    notes: "1.2 IPD names the C-suite sponsor explicitly."

  # ---------------- requirements, policy, risk
  - name: SecurityRequirement
    definition: "Requirement for software development infrastructures and processes (PO.1.1) or for organization-developed software (PO.1.2), from internal and external sources."
    attributes: [scope (infrastructure|software|third-party), source (internal|external), review_date]
    locator: "Table 1, PO.1, PO.1.1, PO.1.2, PO.1.3"
    kind: stated
    tmodel_mapping: "Requirement (R-042) — NOTE: a product-level requirement, distinct from the SSDF Task-as-requirement"
    notes: "Two different 'requirement' objects: SSDF tasks (process requirements on the producer) vs the producer's own SecurityRequirements on its software."
  - name: Policy
    definition: "Organizational policy (security requirements, archiving, end-of-life, vulnerability disclosure)."
    attributes: [topic, owner, review_period]
    locator: "Table 1, PO.1.1–PO.1.2 (Examples), RV.1.3"
    kind: stated
    tmodel_mapping: "WorkProduct (DL-0009) / governed View (R-043)"
    notes: ""
  - name: Exception
    definition: "Approved exception to a security requirement, with periodic review."
    attributes: [requirement, rationale, approver, review_date]
    locator: "Table 1, PO.1.2 (Example 7), PO.1.3 (Example 5), RV.2.2 (Example 5)"
    kind: stated
    tmodel_mapping: "Assertion + Review (§4) — risk acceptance; DEC-009 mitigation lifecycle state 'accepted'"
    notes: ""
  - name: RiskModel
    definition: "Forms of risk modeling (e.g., threat modeling, attack modeling, attack surface mapping) used to assess the security risk for the software."
    attributes: [method, scope, date]
    locator: "Table 1, PW.1.1"
    kind: stated
    tmodel_mapping: "ThreatModel (tmodel's own core artifact) — ThreatInstance/AttackPath set (§1.3)"
    notes: "1.2 adds PW.1.1 Ex 5: sharing risk and threat models with customers 'under controlled disclosure'."
  - name: DesignDecision
    definition: "Recorded design decision, risk response and approved exception, tracked and maintained with the software's security requirements and risks."
    attributes: [decision, rationale, related_requirements, related_risks]
    locator: "Table 1, PW.1.2; RV.2.2 (Example 5)"
    kind: stated
    tmodel_mapping: "Assertion (§4) / MitigationInstance decision record (§5, DEC-009)"
    notes: "1.2 RV.2.2 Ex 5 adds 'periodically review' of these records."
  - name: SecurityCheckCriteria
    definition: "Criteria for software security checks, defined and tracked throughout the SDLC (e.g., classes of software flaws verified by gates)."
    attributes: [criterion, gate, KPI/KRI]
    locator: "Table 1, PO.4, PO.4.1; PO.1.2 (Example 2 'gates')"
    kind: stated
    tmodel_mapping: "Gate exit criterion (DL-0009 R-041) + conformance check (R-042)"
    notes: "The only SSDF object that is explicitly a gate; acronyms list adds KPI/KRI."
  - name: Gate
    definition: "Key point in the SDLC at which compliance with security requirements is verified."
    attributes: [name, criteria, position_in_sdlc]
    locator: "Table 1, PO.1.2 (Example 2: 'verify compliance at key points in the SDLC (e.g., classes of software flaws verified by gates …)')"
    kind: stated
    tmodel_mapping: "Gate/Checkpoint (DL-0009 R-041)"
    notes: "Stated only inside an example; SSDF defines no gate sequence (§2 lines 311–313: order implies no sequence)."
  - name: Risk
    definition: "Security risk the software is likely to face during operation; also risk of technology stacks and third-party components."
    attributes: [description, likelihood, impact, response]
    locator: "Table 1, PW.1 description; PO.1.2 (Example 3); RV.2.1"
    kind: stated
    tmodel_mapping: "RiskScore (§3, DEC-003)"
    notes: ""

  # ---------------- tooling and environments
  - name: Toolchain
    definition: "Set of tools used to automate security practices; may be organization-wide or project-specific and may address a part of the SDLC like a build pipeline."
    attributes: [category, mandatory_tools, configuration_as_code]
    locator: "Table 1, PO.3 description; PO.3.1–PO.3.3"
    kind: stated
    tmodel_mapping: "Component (§1) — tooling as part of the development environment"
    notes: ""
  - name: Tool
    definition: "A tool or tool type in a toolchain (scanners, compilers, interpreters, build tools, code analysis tools)."
    attributes: [type, version, configuration]
    locator: "Table 1, PO.3.1, PW.6.1, PW.7.2"
    kind: stated
    tmodel_mapping: "Component"
    notes: ""
  - name: Artifact
    definition: "“a piece of evidence” [IR7692]; artifacts provide records of secure software development practices; generated by tools."
    attributes: [type, generated_by, timestamp]
    locator: "Table 1, PO.3.3 + footnote 6"
    kind: stated
    tmodel_mapping: "Evidence / PROV Entity (§4)"
    notes: ""
  - name: Evidence
    definition: "“grounds for belief or disbelief; data on which to base proof or to establish truth or falsehood” [SP800160]."
    attributes: [supports, artifact]
    locator: "Table 1, PO.3.3, footnote 6"
    kind: stated
    tmodel_mapping: "Evidence (DL-0009 R-042)"
    notes: ""
  - name: DevelopmentEnvironment
    definition: "Environment involved in software development (development, build, staging, integration, test, production, distribution), each to be enumerated, separated and protected."
    attributes: [name, type, network_segment, access_policy, logging]
    locator: "§2 (lines 316–320); Table 1, PO.5, PO.5.1, PO.6.1"
    kind: stated
    tmodel_mapping: "Environment (§3) / TrustBoundary zone (§1)"
    notes: "Lateral movement between environments is the named threat."
  - name: DevelopmentEndpoint
    definition: "Endpoint for software designers, developers, testers, builders."
    attributes: [hardening_baseline, mfa, privileges]
    locator: "Table 1, PO.5.2"
    kind: stated
    tmodel_mapping: "Component"
    notes: ""
  - name: ImprovementPlan
    definition: "Continuous process improvement plan identifying and executing improvements to cybersecurity processes and procedures across all SSDF practices."
    attributes: [improvements, triggers (new threats, new tools, incident), owner]
    locator: "Table 1, PO.6 (new)"
    kind: stated
    tmodel_mapping: "new — SDL program (R-041) improvement loop"
    notes: "new_in_1_2: true"
    new_in_1_2: true

  # ---------------- software and releases
  - name: Software
    definition: "The software being developed (including code built into hardware)."
    attributes: [name, version]
    locator: "§1 (lines 176–177)"
    kind: stated
    tmodel_mapping: "Product (§1)"
    notes: ""
  - name: Code
    definition: "All forms of code — source code, executable code, and configuration as code."
    attributes: [form (source|executable|configuration-as-code), repository]
    locator: "Table 1, PS.1.1"
    kind: stated
    tmodel_mapping: "Component / PROV Entity"
    notes: ""
  - name: CodeRepository
    definition: "Repository storing source code and configuration as code with access restricted by the nature of the code."
    attributes: [access_policy, commit_signing]
    locator: "Table 1, PS.1.1 (Examples 1–6)"
    kind: stated
    tmodel_mapping: "Component (DataStore role)"
    notes: ""
  - name: SoftwareComponent
    definition: "Software component (libraries, modules, middleware, frameworks) acquired from third parties or created in-house."
    attributes: [source (third-party|open-source|in-house), version, maintenance_status, end_of_life, owner]
    locator: "Table 1, PW.4.1, PW.4.2, PW.4.4"
    kind: stated
    tmodel_mapping: "Component (§1) — uses_component / composed_of"
    notes: ""
  - name: SoftwareRelease
    definition: "A release of the software, archived with its files and supporting data."
    attributes: [version, files, integrity_verification_info, provenance_data, release_date]
    locator: "Table 1, PS.3, PS.3.1, PS.3.2"
    kind: stated
    tmodel_mapping: "ProductInstance / versioned Product (§1, §3b)"
    notes: ""
  - name: SoftwareUpdate
    definition: "An update to released software, delivered through an update engine and infrastructure, tested, staged, and revertible."
    attributes: [version, rollout_strategy (canary|staged|test deployment), rollback_supported, target_systems]
    locator: "Table 1, PS.4, PS.4.1–PS.4.4 (new)"
    kind: stated
    tmodel_mapping: "new — LifecyclePhase maintenance/update (§3b) transition event on ProductInstance"
    notes: "new_in_1_2: true"
    new_in_1_2: true
  - name: UpdateEngine
    definition: "Update engines and associated infrastructure for delivery of updates; fault-tolerant, degrades gracefully."
    attributes: [fault_tolerance, retry, capacity]
    locator: "Table 1, PS.4.4 (new)"
    kind: stated
    tmodel_mapping: "Component"
    notes: "new_in_1_2: true"
    new_in_1_2: true
  - name: RollbackMechanism
    definition: "Mechanism that reverts failed updates to the last known good configuration; protected against unauthorized roll-back to vulnerable versions."
    attributes: [automatic, anti_rollback_protection]
    locator: "Table 1, PS.4.3 (new), Examples 1–3"
    kind: stated
    tmodel_mapping: "MitigationInstance kind=technical (R-040)"
    notes: "new_in_1_2: true. Anti-rollback (Ex 3) is a security control; rollback (Ex 1–2) is reliability."
    new_in_1_2: true
  - name: IntegrityVerificationInformation
    definition: "Software integrity verification information made available to acquirers (e.g., cryptographic hashes, code signatures)."
    attributes: [type (hash|signature), algorithm, location]
    locator: "Table 1, PS.2, PS.2.1"
    kind: stated
    tmodel_mapping: "Assertion / attestation (§4); radar contract (ADR-0001) for build provenance"
    notes: ""
  - name: ProvenanceData
    definition: "“the chronology of the origin, development, ownership, location, and changes to a system or system component and associated data …” [SP80053]; kept for all components of each release, e.g., in an SBOM."
    attributes: [components, format, integrity_protection, updated]
    locator: "Table 1, PS.3.2 + footnote 5 (at PO.1.3 Example 4)"
    kind: stated
    tmodel_mapping: "PROV-O provenance (§4); supply-chain/custody provenance deferred to ADR-0001 radar contract"
    notes: ""
  - name: SBOM
    definition: "Software bill of materials — a named container for provenance data."
    attributes: [format, components]
    locator: "Table 1, PS.3.2 ('e.g., in a software bill of materials [SBOM]')"
    kind: stated
    tmodel_mapping: "Component graph import (uses_component)"
    notes: ""
  - name: SecureBaseline
    definition: "Secure baseline: how to configure each setting that has an effect on security or a security-related setting so that default settings are secure."
    attributes: [settings, defaults, logging_settings]
    locator: "Table 1, PW.9.1, PW.9.2"
    kind: stated
    tmodel_mapping: "MitigationInstance kind=technical + documentation (R-040)"
    notes: "1.2 adds 'Prohibit the use of default passwords or hard-coded secrets' (PW.9.1 Ex 2)."
  - name: Documentation
    definition: "Documentation of each default setting for software administrators; security advisories; release documentation."
    attributes: [audience, topic]
    locator: "Table 1, PW.9.2, RV.2.2 (Example 3)"
    kind: stated
    tmodel_mapping: "MitigationInstance kind=documentation (R-040) / WorkProduct"
    notes: ""

  # ---------------- verification and vulnerabilities
  - name: CodeReview
    definition: "A person looks directly at the code to find issues; or code analysis (tools are used)."
    attributes: [type (review|analysis), standard, results]
    locator: "Table 1, PW.7.1, PW.7.2"
    kind: stated
    tmodel_mapping: "Review (§5) / Evidence"
    notes: ""
  - name: SecurityTest
    definition: "Executable code testing scoped, designed, performed and documented (incl. failure-path testing, dependency tests)."
    attributes: [scope, design, results, issues]
    locator: "Table 1, PW.8.1, PW.8.2, PS.4.1"
    kind: stated
    tmodel_mapping: "Evidence (R-042)"
    notes: ""
  - name: Issue
    definition: "Issue found by review, analysis or testing; recorded, triaged, and tracked to remediation."
    attributes: [source, severity, status]
    locator: "Table 1, PW.7.2, PW.8.2"
    kind: stated
    tmodel_mapping: "Finding (§1.3)"
    notes: ""
  - name: Vulnerability
    definition: "Includes bugs caused by coding flaws and weaknesses caused by security configuration settings, incorrect trust assumptions, and outdated risk analysis."
    attributes: [id, affected_releases, severity, status, root_cause]
    locator: "§1 (lines 185–187); Table 1, RV.1–RV.3"
    kind: stated
    tmodel_mapping: "Vulnerability/Finding (§1.3)"
    notes: ""
  - name: VulnerabilityReport
    definition: "Information on potential vulnerabilities gathered from software acquirers, users, and public sources (e.g., vulnerability databases)."
    attributes: [source, received_date]
    locator: "Table 1, RV.1.1"
    kind: stated
    tmodel_mapping: "Finding source / Assertion"
    notes: ""
  - name: VulnerabilityDisclosureProgram
    definition: "Policy that addresses vulnerability disclosure and remediation, with roles, responsibilities and processes (e.g., PSIRT, playbooks)."
    attributes: [policy, contact, playbooks]
    locator: "Table 1, RV.1.3"
    kind: stated
    tmodel_mapping: "Party (PSIRT) + WorkProduct"
    notes: ""
  - name: RiskResponse
    definition: "Remediation or other risk response planned and implemented per vulnerability (incl. temporary mitigation, advisories)."
    attributes: [type (remediate|mitigate|accept|transfer), plan, advisory]
    locator: "Table 1, RV.2.1, RV.2.2"
    kind: stated
    tmodel_mapping: "MitigationInstance (§5, DEC-009 lifecycle)"
    notes: ""
  - name: SecurityAdvisory
    definition: "Advisory providing descriptions of vulnerabilities, how to find vulnerable instances and how to address them."
    attributes: [vulnerabilities, fixes, workarounds]
    locator: "Table 1, RV.2.2 (Example 3)"
    kind: stated
    tmodel_mapping: "MitigationInstance kind=documentation; VEX-like Assertion (§5)"
    notes: ""
  - name: RootCause
    definition: "Root cause of a vulnerability; analyzed per vulnerability and over time for patterns."
    attributes: [category, pattern]
    locator: "Table 1, RV.3.1, RV.3.2"
    kind: stated
    tmodel_mapping: "Weakness (CWE) (§1.3)"
    notes: ""
  - name: SDLCProcess
    definition: "The organization's software development life cycle process, reviewed and updated to prevent root causes recurring."
    attributes: [model (waterfall|agile|DevOps…), version]
    locator: "§1 (lines 176–181); Table 1, RV.3.4"
    kind: stated
    tmodel_mapping: "SDL / SecurityProgram (DL-0009 R-041)"
    notes: ""

  # ---------------- ported from the sp-800-218 (SSDF 1.1) object model by the independent verify pass, 2026-10-02.
  # Each cited task/example id exists in the 1.2 IPD and still carries the concept; locators re-checked.
  - name: ReferenceDocument
    definition: "An established secure software development practice document listed in the References section under a bracketed key."
    attributes: ["key", "authors", "year", "title", "version", "url"]
    locator: "References section (lines 325–456)"
    kind: stated
    tmodel_mapping: "library record / Party (publisher, ARCH §2b 'publishers reference the library record')"
    notes: "[Ported from the sp-800-218 object model by the verify pass, 2026-10-02: every cited task/example id exists in the 1.2 IPD with the same concept; locator re-checked against the 1.2 text.]"
  - name: Term
    definition: "A term the SSDF uses but deliberately leaves to the adopter to define (sensitive data, qualified person, well-secured, environment names)."
    attributes: ["term", "adopter_definition"]
    locator: "§2 (lines 314–316: 'The table uses terms like ... Organizations that adopt the SSDF should define these terms')"
    kind: stated
    tmodel_mapping: "new — per-SDL glossary binding (DL-0009 SDL object attribute)"
    notes: "A conformance engine needs these bound before 'well-secured' / 'qualified person' checks are evaluable. [Ported from the sp-800-218 object model by the verify pass, 2026-10-02: every cited task/example id exists in the 1.2 IPD with the same concept; locator re-checked against the 1.2 text.]"
  - name: TrainingProgram
    definition: "Role-based training: desired outcomes, curriculum, plan per role, outcome measurement."
    attributes: ["role", "desired_outcomes", "curriculum", "plan", "outcome_measure"]
    locator: "PO.2.2, PO.2.2/E1-E5"
    kind: stated
    tmodel_mapping: "new — MitigationInstance kind=process (R-040) at program level"
    notes: "[Ported from the sp-800-218 object model by the verify pass, 2026-10-02: every cited task/example id exists in the 1.2 IPD with the same concept; locator re-checked against the 1.2 text.]"
  - name: CodeOwner
    definition: "Group of individuals or a team designated as the code owner for each project; reviews and approves all changes made by others."
    attributes: ["project"]
    locator: "PO.2.1/E7, PS.1.1/E4"
    kind: stated
    tmodel_mapping: "Party role (owned_by edge)"
    notes: "[Ported from the sp-800-218 object model by the verify pass, 2026-10-02: every cited task/example id exists in the 1.2 IPD with the same concept; locator re-checked against the 1.2 text.]"
  - name: PSIRT
    definition: "Product Security Incident Response Team and processes handling responses to vulnerability reports and incidents."
    attributes: ["communications_plan", "playbooks", "exercise_schedule"]
    locator: "RV.1.3/E2-E4"
    kind: stated
    tmodel_mapping: "Party (organization unit) role"
    notes: "[Ported from the sp-800-218 object model by the verify pass, 2026-10-02: every cited task/example id exists in the 1.2 IPD with the same concept; locator re-checked against the 1.2 text.]"
  - name: SecurityResearcher
    definition: "External reporter of possible vulnerabilities to the vulnerability disclosure program."
    attributes: []
    locator: "RV.1.3/E1"
    kind: stated
    tmodel_mapping: "Party (reported_by edge, ARCH §2b)"
    notes: "[Ported from the sp-800-218 object model by the verify pass, 2026-10-02: every cited task/example id exists in the 1.2 IPD with the same concept; locator re-checked against the 1.2 text.]"
  - name: SecurityCheck
    definition: "An execution of the criteria against workflow artifacts, yielding approval, rejection or exception request recorded in the workflow and tracking system."
    attributes: ["criteria", "artifacts_reviewed", "outcome (approved|rejected|exception_requested)", "timestamp"]
    locator: "PO.4.1/E4-E5, PO.4.2/E3"
