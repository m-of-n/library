gaps:
  - "tmodel has no Requirement *level* distinction between a process requirement on the producer (SSDF Task) and a product requirement on the software (SSDF SecurityRequirement, PO.1.2). Both are 'Requirement' in DL-0009; the SSDF needs both, linked."
  - "No per-task responsibility/RACI edge (Party responsible_for Requirement) — needed for the SSDF shared-responsibility agreement (§1 lines 273–280) and for ARCH-0001 §2b."
  - "No 'notional / non-binding example' object: an SSDF example is a candidate MitigationInstance template, not a requirement; tmodel should not count it in conformance."
  - "No Gate *sequence*: SSDF explicitly denies an order (§2 lines 311–313); R-041's ordered Gate model must accept requirement sets that are unordered and map them onto LifecyclePhase by our own judgement."
  - "No SoftwareUpdate / rollout / rollback objects in ARCH-0001 — PS.4 (new in 1.2) needs update events on ProductInstance (§3b maintenance/update phase) with rollback transitions."
  - "No ImprovementPlan / continuous-improvement loop object on the SDL program (PO.6, RV.3.4)."
  - "Disclosure-controlled sharing of a threat model with customers (PW.1.1 Ex 5) needs an access/disclosure attribute on the governed View (R-043)."
  - "Crosswalk edges must carry the reference *edition* (SSDF 1.2 maps to BSIMM12, SAMM 1.5, ASVS 4.0.3, CSF 1.1 and 2.0, SP 800-53 Release 5.2.0) — a bare scheme key is ambiguous."
