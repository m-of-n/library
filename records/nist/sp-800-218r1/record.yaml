      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "88 entries (library-requirements/v2): R-0001..R-0008 framework statements, 4 groups, 22 practices, 54 tasks; every task's examples verbatim and References column as maps_to (497 lines, 1,548 ids, 29 schemes, target_record where edition matches); withdrawn ids kept; change_vs_v1_1 per entry. BCP 14 0/0, native baseline reconciled. Derived fields (actor/nature/phase/deliverables/verification/testable) not human-reviewed."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "Adopt/adapt/reject vs R-040..R-044, DEC-009, ARCH-0001 §2b/§3b; open questions incl. draft defects."
      reviewed_by: ""
    - kind: diagram
      path: distilled/object-model.yaml
      coverage: "object-model pass: 86 objects, 104 edges, 8 gaps (54/56 from lane A + 32 objects / 48 edges ported from the sp-800-218 model by the verify pass after re-checking each locator against the 1.2 IPD); every item located; 2 objects + 3 edges inferred; new-in-1.2 objects flagged."
      reviewed_by: ""
    - kind: diagram
      path: distilled/object-model.md
      coverage: "Mermaid class diagram of the backbone (leaf objects omitted) + 5 findings."
      generated_from: distilled/object-model.yaml
      reviewed_by: ""
    - kind: normative
      path: distilled/diff-vs-v1.1.md
      coverage: "Complete computed diff vs SSDF 1.1 (official xlsx): new practices/tasks, reworded practices/tasks/examples verbatim old vs new, reference changes (EO14028 removed; SP80053/SP800161 per-task old vs new), change-log discrepancies."
      reviewed_by: ""
  not_applicable:
    - kind: schema
      reason: "SSDF 1.2 defines no data format, schema or machine-readable structure; NIST has not published a 1.2 table file (1.1 has an xlsx)."
    - kind: messages
      reason: "No messages, headers or structures exchanged between parties are defined; the only inter-party artifacts (integrity verification info, provenance/SBOM, advisories, attestations) are named by example without format."
    - kind: protocol
      reason: "No protocol or exchange sequence is defined; §2 states the order of practices/tasks implies no sequence of implementation."
    - kind: state-machine
      reason: "No lifecycle with states/transitions is defined. PS.4 (update/rollback) and RV.2 (risk response) imply lifecycles but specify no states; the implied structure is captured as objects/edges in object-model.yaml and as an adaptation in design-notes.md."
    - kind: examples
      reason: "No test vectors. The 'notional implementation examples' are informative, non-required illustrations (§2 lines 301–305), not fixtures; all 225 are captured verbatim in requirements.yaml notional_implementation_examples and normative.md."
