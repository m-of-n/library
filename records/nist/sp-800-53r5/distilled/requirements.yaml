note: >
  Ids are native 800-53 identifiers: sp-800-53r5#SA-11, sp-800-53r5#SA-11(1). normativity
  "control" / verb "imperative": 800-53 control statements are imperative ("Require the
  developer ...") and become obligations only when an organization selects them into a
  baseline or tailors them. actor = the organization implementing the control; obligated_party
  = "developer" where the statement imposes the obligation on the developer of the system,
  component or service (derived; review). phase, nature, expects_deliverables are DERIVED and
  unreviewed. text is verbatim from the PDF (text_source: pdf); every PDF statement was
  cross-checked against the OSCAL 5.2.0 statement (>= 0.97 similarity ignoring parameter text, except SA-4(3) 0.94,
