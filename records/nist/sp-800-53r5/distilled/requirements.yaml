  PDF wording for these three).
  OSCAL renders organization-defined parameters with short 800-53A ODP labels that are NOT the
  PDF's assignment wording, so OSCAL-sourced texts (3 entries) carry that caveat.
  maps_to = the control's own "Related Controls" list.
