schema: "library-object-model/v1"
record: sp-800-53r5
source_version: "Rev. 5 upd1 (2020-12-10) + Release 5.2.0 (2025-08-27)"
scope: >
  Object-model pass over the IN-SCOPE text only: catalog structure (PDF Chapter Two §2.2–2.5:
  control structure, organization-defined parameters, baselines, related controls) and the
  statements of SA-3, SA-4, SA-8, SA-10, SA-11, SA-15, SA-17, SA-24 (+ all enhancements), SI-2(7)
  and SR-1..SR-12. Question asked: what entity types and edges do these controls assume or define?
  Other families were not read for this pass.
reviewed_by: ""
objects:
  - name: Control
    definition: "A safeguard or countermeasure prescribed for a system or organization, identified by family id + number (e.g. SA-11); statement + discussion + related controls + references."
    attributes: [id, title, statement, discussion, related_controls, references, status (active|withdrawn), implementation_level (organization|system), contributes_to_assurance]
    locator: "§2.2 Control Structure and Organization"
    kind: stated
    tmodel_mapping: "DL-0009 Requirement (R-042/R-044) — a control is a requirement source; when implemented it becomes a MitigationInstance (§5)"
    notes: "implementation_level and contributes_to_assurance are OSCAL/RMF props (ns http://csrc.nist.gov/ns/rmf), not PDF text."
  - name: ControlEnhancement
    definition: "Statement of capability that augments a base control (e.g. SA-11(2)); cannot be implemented without the base control."
    attributes: [id, parent_control, title, statement, status, withdrawn_to]
    locator: "§2.2"
    kind: stated
    tmodel_mapping: "Requirement (child) — refines edge"
    notes: ""
  - name: ControlFamily
    definition: "Grouping of related controls (20 families; here SA, SR, SI)."
    attributes: [id (two-letter), name]
    locator: "§2.2, Table 1"
    kind: stated
    tmodel_mapping: "none (catalog structure; a facet on Requirement)"
    notes: ""
  - name: OrganizationDefinedParameter
    definition: "Assignment or selection placeholder inside a control statement that the organization fills in to tailor it ([Assignment: organization-defined ...], [Selection: ...])."
    attributes: [id (e.g. sa-11.02_odp.01), kind (assignment|selection), label, choices, how_many, assigned_value]
    locator: "§2.2 (organization-defined parameters)"
    kind: stated
    tmodel_mapping: "new — a Requirement is not checkable (R-042) until its ODPs carry assigned values"
    notes: "OSCAL ODP labels are short 800-53A labels and differ from the PDF assignment wording."
  - name: Baseline
    definition: "Pre-selected set of controls for a security categorization (LOW, MODERATE, HIGH) or privacy; specified in SP 800-53B."
    attributes: [name, impact_level, version]
    locator: "Prologue 'Control Baselines' note (baselines moved to SP 800-53B); OSCAL baseline profiles 5.2.0"
    kind: stated
    tmodel_mapping: "new — analogous to an SDL profile/tailoring that selects requirements for a Product"
    notes: "None of SA-15(13), SA-24, SI-2(7) is in any baseline (5.2.0 change log)."
  - name: Organization
    definition: "The entity selecting, tailoring and implementing controls; issues contracts, defines ODP values, receives developer evidence."
    attributes: [name, roles]
    locator: "SA-3, SA-4, SR-1, SR-2"
    kind: stated
    tmodel_mapping: "Party (§2b), acquirer/owner role"
    notes: ""
  - name: Developer
    definition: "Developer of the system, system component, or system service (internal or external) on whom SA-10/11/15/17 impose obligations via 'Require the developer ...'."
    attributes: [identity, independence (SA-11(3))]
    locator: "SA-10, SA-11, SA-15, SA-17 statements"
    kind: stated
    tmodel_mapping: "Party (§2b) with relational role supplier/developer-of (edge, not node class)"
    notes: ""
  - name: Supplier
    definition: "Supplier, contractor, or provider in the supply chain whose processes, components and services are assessed (SR-6), contracted (SR-5), and notified (SR-8)."
    attributes: [identity, assessed_risk, agreements]
    locator: "SR-5, SR-6, SR-8"
    kind: stated
    tmodel_mapping: "Party (§2b) — supplied_by edge"
    notes: ""
  - name: System
    definition: "Information system acquired, developed and managed under an SDLC (SA-3); the object controls protect."
    attributes: [name, security_categorization, lifecycle_state]
    locator: "SA-3.a"
    kind: stated
    tmodel_mapping: "Product / ProductInstance (§1)"
    notes: ""
  - name: SystemComponent
    definition: "Hardware, software or firmware element of a system (statements: 'system, system component, or system service')."
    attributes: [identity, criticality (SA-15(3)), provenance (SR-4)]
    locator: "SA-4, SA-10(3), SR-4, SR-11"
    kind: stated
    tmodel_mapping: "Component (§1, CPE/purl)"
    notes: ""
  - name: SystemService
    definition: "A service (incl. external) acquired for the system."
    attributes: [provider]
    locator: "SA-4, SA-11"
    kind: stated
    tmodel_mapping: "Component (service) (§1)"
    notes: ""
  - name: SystemDevelopmentLifeCycle
    definition: "Organization-defined SDLC that incorporates security and privacy considerations, with roles, responsibilities and integrated risk management (SA-3)."
    attributes: [definition, roles, phases]
    locator: "SA-3"
    kind: stated
    tmodel_mapping: "DL-0009 SDL/SecurityProgram (R-041) + LifecyclePhase axis (§3b)"
    notes: "SA-10.a enumerates phases as a selection: design; development; implementation; operation; disposal."
  - name: DevelopmentProcess
    definition: "Documented development process addressing security/privacy requirements, standards, tools, tool options/configurations, change integrity (SA-15), reviewed at a frequency."
    attributes: [standards, tools, tool_options, tool_configurations, review_frequency, quality_metrics (SA-15(1)), security_tracking_tools (SA-15(2))]
    locator: "SA-15, SA-15(1), SA-15(2)"
    kind: stated
    tmodel_mapping: "DL-0009 SDL/SecurityProgram (R-041)"
    notes: ""
  - name: Milestone
    definition: "Point in development at which quality metrics are evaluated: '[Selection (one or more): [Assignment: organization-defined frequency]; [Assignment: organization-defined program review milestones]; upon delivery]'."
    attributes: [name, criteria]
    locator: "SA-15(1)"
    kind: stated
    tmodel_mapping: "DL-0009 Gate/Checkpoint/Milestone (R-041)"
    notes: "The only gate-like construct stated in the in-scope SA text."
  - name: AcquisitionContract
    definition: "Contract for a system/component/service that includes requirements, descriptions and acceptance criteria (SA-4 a–i)."
    attributes: [functional_requirements, strength_of_mechanism, assurance_requirements, documentation_requirements, development_environment_description, responsibility_allocation, acceptance_criteria]
    locator: "SA-4"
    kind: stated
    tmodel_mapping: "new (agreement Party↔Party carrying Requirements)"
    notes: ""
  - name: AssessmentPlan
    definition: "Developer plan for ongoing security and privacy control assessments (SA-11.a), verifiable by an independent agent (SA-11(3))."
    attributes: [depth, coverage, independence_criteria]
    locator: "SA-11.a, SA-11(3)"
    kind: stated
    tmodel_mapping: "WorkProduct (DL-0009)"
    notes: ""
  - name: Evidence
    definition: "Evidence of the execution and results of testing/evaluation (SA-11.c), of threat modeling meeting acceptance criteria (SA-11(2)(d)), and supporting the final security review archived with the release (SA-15(11))."
    attributes: [kind, produced_by, acceptance_criteria_met]
    locator: "SA-11.c, SA-11(2)(d), SA-15(11)"
    kind: stated
    tmodel_mapping: "DL-0009 Evidence (R-042); PROV Entity (§4)"
    notes: ""
  - name: ThreatModel
    definition: "Developer threat modeling and vulnerability analyses using organization-defined contextual information, tools/methods, level of rigor and acceptance criteria (SA-11(2)); attack surface reduction (SA-15(5)); threat modeling also in SA-15(4) [withdrawn → SA-11(2)]."
    attributes: [contextual_information, tools_and_methods, rigor, acceptance_criteria]
    locator: "SA-11(2), SA-15(5)"
    kind: stated
    tmodel_mapping: "the tmodel threat-model instance itself (ThreatInstance set, AttackSurface §1)"
    notes: "Direct anchor for R-042: a threat model is a control-mandated developer deliverable."
  - name: Flaw
    definition: "Security flaw found in testing/evaluation or development, tracked to resolution and reported (SA-10.e, SA-11.d/e); root cause analysed (SI-2(7))."
    attributes: [description, resolution_status, root_cause, reported_to]
    locator: "SA-10.e, SA-11.d, SA-11.e, SI-2(7)"
    kind: stated
    tmodel_mapping: "Finding/Vulnerability (§1.3)"
    notes: ""
  - name: SecurityArchitecture
    definition: "Developer-produced design specification and security/privacy architecture consistent with the organization's architecture (SA-17), optionally formal (SA-17(1)–(4))."
    attributes: [allocation_of_controls, formal_policy_model, top_level_specification]
    locator: "SA-17"
    kind: stated
    tmodel_mapping: "WorkProduct; DFD/structural layers (§1) are its graph form"
    notes: ""
edges:
  - {name: enhances, from: ControlEnhancement, to: Control, cardinality: "N:1", definition: "enhancement augments its base control", locator: "§2.2", kind: stated, tmodel_mapping: "Requirement refines Requirement"}
  - {name: member_of, from: Control, to: ControlFamily, cardinality: "N:1", definition: "family membership", locator: "§2.2", kind: stated, tmodel_mapping: "facet"}
  - {name: related_to, from: Control, to: Control, cardinality: "N:M", definition: "'Related Controls' list — the source's own internal crosswalk", locator: "§2.2 (Related Controls)", kind: stated, tmodel_mapping: "R-044 maps_to (intra-catalog)"}
  - {name: incorporated_into, from: ControlEnhancement, to: Control, cardinality: "N:1", definition: "withdrawn control's content moved to another control", locator: "e.g. SA-4(4), SA-15(4), SA-15(9)", kind: stated, tmodel_mapping: "Requirement superseded_by"}
  - {name: has_parameter, from: Control, to: OrganizationDefinedParameter, cardinality: "1:N", definition: "statement carries assignment/selection placeholders", locator: "§2.2", kind: stated, tmodel_mapping: "new"}
  - {name: assigns_value, from: Organization, to: OrganizationDefinedParameter, cardinality: "N:M", definition: "organization fills in the parameter (tailoring)", locator: "§2.2", kind: stated, tmodel_mapping: "Assertion (§4) by a Party"}
  - {name: includes, from: Baseline, to: Control, cardinality: "N:M", definition: "baseline allocation", locator: "SP 800-53B (via OSCAL baseline profiles); Appendix C control summaries", kind: stated, tmodel_mapping: "new (profile selects Requirements)"}
  - {name: selects_and_tailors, from: Organization, to: Baseline, cardinality: "N:M", definition: "organization selects a baseline and tailors it", locator: "Prologue 'Control Baselines' note (tailoring guidance moved to SP 800-53B)", kind: stated, tmodel_mapping: "SDL program scoping (R-041)"}
  - {name: implements, from: System, to: Control, cardinality: "N:M", definition: "control is implemented for a system (or inherited)", locator: "§2.3 Control Implementation Approaches", kind: stated, tmodel_mapping: "MitigationInstance realizes Requirement (R-040/R-042)"}
  - {name: requires_of, from: Organization, to: Developer, cardinality: "N:M", definition: "'Require the developer of the system ... to ...' — obligation imposed by acquirer on developer", locator: "SA-10, SA-11, SA-15, SA-17", kind: stated, tmodel_mapping: "Party→Party relational role (§2b)"}
  - {name: develops, from: Developer, to: SystemComponent, cardinality: "N:M", definition: "developer of the system, component or service", locator: "SA-10/SA-11 statements", kind: stated, tmodel_mapping: "Component developed_by Party"}
  - {name: governed_by_sdlc, from: System, to: SystemDevelopmentLifeCycle, cardinality: "N:1", definition: "system acquired, developed and managed using an SDLC", locator: "SA-3.a", kind: stated, tmodel_mapping: "Product governed_by SDL (R-041)"}
  - {name: follows, from: Developer, to: DevelopmentProcess, cardinality: "N:1", definition: "developer follows a documented development process", locator: "SA-15.a", kind: stated, tmodel_mapping: "SDL instance"}
  - {name: evaluated_at, from: DevelopmentProcess, to: Milestone, cardinality: "1:N", definition: "quality metrics provided as evidence at milestones/upon delivery", locator: "SA-15(1)", kind: stated, tmodel_mapping: "Gate exit criterion (R-041)"}
  - {name: specifies, from: AcquisitionContract, to: Control, cardinality: "N:M", definition: "contract includes security/privacy requirements and the controls needed to satisfy them", locator: "SA-4.a–d", kind: stated, tmodel_mapping: "Requirement flow-down"}
  - {name: binds, from: AcquisitionContract, to: Supplier, cardinality: "N:1", definition: "contract with a supplier/developer", locator: "SA-4, SR-5", kind: inferred, tmodel_mapping: "Party↔Party agreement", notes: "contract parties are implied, not named as such"}
  - {name: produces, from: Developer, to: AssessmentPlan, cardinality: "1:N", definition: "develop and implement a plan for ongoing assessments", locator: "SA-11.a", kind: stated, tmodel_mapping: "WorkProduct generated_by Activity"}
  - {name: produces_evidence, from: Developer, to: Evidence, cardinality: "1:N", definition: "produce evidence of testing execution and results; threat-model evidence meeting acceptance criteria", locator: "SA-11.c, SA-11(2)(d)", kind: stated, tmodel_mapping: "PROV wasGeneratedBy (§4)"}
  - {name: performs_threat_modeling, from: Developer, to: ThreatModel, cardinality: "1:N", definition: "perform threat modeling and vulnerability analyses during development and testing", locator: "SA-11(2)", kind: stated, tmodel_mapping: "ThreatModel authored_by Party"}
  - {name: tracks, from: Developer, to: Flaw, cardinality: "1:N", definition: "track security flaws and flaw resolution; report findings", locator: "SA-10.e", kind: stated, tmodel_mapping: "Finding lifecycle (DEC-009)"}
  - {name: remediates, from: Flaw, to: SystemComponent, cardinality: "N:M", definition: "implement a verifiable flaw remediation process; correct flaws identified", locator: "SA-11.d, SA-11.e", kind: stated, tmodel_mapping: "MitigationInstance on Finding"}
  - {name: root_cause_of, from: Flaw, to: Flaw, cardinality: "N:M", definition: "root cause analysis identifies underlying causes of issues or failures and drives actions", locator: "SI-2(7)", kind: inferred, tmodel_mapping: "new (RootCause node in SSDF RV.3)", notes: "SI-2(7) names 'underlying causes' but no separate entity; modelled as self-edge"}
  - {name: archived_with, from: Evidence, to: SystemComponent, cardinality: "N:1", definition: "release archived together with evidence supporting final security and privacy review", locator: "SA-15(11)", kind: stated, tmodel_mapping: "Release ↔ Evidence (governed view, R-043)"}
  - {name: provenance_of, from: SystemComponent, to: Supplier, cardinality: "N:M", definition: "document, monitor and maintain valid provenance of systems, components and associated data", locator: "SR-4", kind: stated, tmodel_mapping: "supply-chain custody provenance (ADR-0001 radar contract; §4 deferred)"}
gaps:
  - "OrganizationDefinedParameter + assigned value: tmodel Requirement has no slot for tailoring parameters; without it R-042 checks are not decidable."
  - "Baseline/profile selecting Requirements for a Product: no tmodel object (DL-0009 SDL program implies one)."
  - "AcquisitionContract (Party↔Party agreement carrying Requirements and acceptance criteria): absent from ARCH-0001."
  - "Milestone in SA-15(1) is a metric-evaluation point, weaker than DL-0009's Gate with entry/exit criteria; 800-53 SA defines no gate ordering."
  - "Withdrawn/incorporated-into lineage between Requirements (needed so a citation to SA-15(4) resolves to SA-11(2))."
  - "Independence criteria for a verifying agent (SA-11(3)) — a property of a Review/Party pair, not modelled."
