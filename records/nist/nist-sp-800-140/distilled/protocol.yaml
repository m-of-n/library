  - id: "F07"
    name: "environmental-failure-test"
    title: "AS07.81: environmental failure testing, EFT (Level 3)"
    locator: "§6.7"
    participants:
      - "vendor"
      - "cstl"
      - "module"
    summary: >-
      Where EFT is chosen for a condition, the module is tested over the ranges AS07.82, AS07.85 and
      AS07.86 give (not in this document): the temperature is driven from inside the normal range
      down to where the module shuts down or zeroises and up to where it shuts down, enters an error
      state or zeroises; the module may instead continue to operate normally. The tester then checks
      the security policy states the ranges and the outcome.
    order_note: >-
      AS07.81 gives the cold and hot excursions in that order; the security policy check is a
      separate TE.
    preconditions:
      - id: "F07.P1"
        condition: "EFT, not EFP, is chosen for the condition."
        kind: "stated"
        quotes:
          - source_lines: "752-753"
            quote: |-
              VE07.81.01: If EFT is chosen for a particular condition, the module shall be tested within the temperature range specified in AS07.82 and voltage ranges specified in AS07.85 and AS07.86.
        constrained_by:
          - "nist-sp-800-140#R-0083"
    steps:
      - n: "1"
        from: "vendor"
        to: "cstl"
        message: "EFT documentation"
        action: >-
          State the approach chosen and describe the EFT; the security policy names the outcome,
          shutdown or zeroisation, and the temperature range met.
        locator: "§6.7"
        kind: "stated"
        quotes:
          - source_lines: "765-766"
            quote: |-
              Documentation shall state which of these approaches was chosen and provide a specification description of the EFT.
          - source_lines: "768-769"
            quote: |-
              VE07.81.02: The security policy shall address whether the employed EFT feature forces module shutdown or zeroises all unprotected SSPs and shall specify the temperature range met.
        constrained_by:
          - "nist-sp-800-140#R-0085"
          - "nist-sp-800-140#R-0086"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "cstl"
        to: "module"
        message: "cold excursion"
        action: >-
          From inside the normal operating range down to the coldest temperature at which the module
          shuts down or zeroises its unprotected SSPs.
        locator: "§6.7"
        kind: "stated"
        quotes:
          - source_lines: "737-748"
            quote: |-
              The temperature range to be tested shall be from a temperature within the normal operating temperature range to the lowest (i.e., coldest) temperature that either (1) shutdown the module to prevent further operation or (2) immediately zeroise all unprotected SSPs; and from a temperature within the normal operating temperature range to the highest (i.e., hottest) temperature that either (1) shuts down or goes into an error state or (2) zeroises all unprotected SSPs.
        constrained_by:
          - "nist-sp-800-140#R-0082"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "cstl"
        to: "module"
        message: "hot excursion"
        action: >-
          From inside the normal operating range up to the hottest temperature that produces a
          shutdown, an error state or zeroisation of unprotected SSPs.
        locator: "§6.7"
        kind: "stated"
        quotes:
          - source_lines: "737-748"
            quote: |-
              The temperature range to be tested shall be from a temperature within the normal operating temperature range to the lowest (i.e., coldest) temperature that either (1) shutdown the module to prevent further operation or (2) immediately zeroise all unprotected SSPs; and from a temperature within the normal operating temperature range to the highest (i.e., hottest) temperature that either (1) shuts down or goes into an error state or (2) zeroises all unprotected SSPs.
        constrained_by:
          - "nist-sp-800-140#R-0082"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "module"
        to: "cstl"
        message: "environmental response"
        action: >-
          The module continues to operate normally, shuts down, or zeroises all plaintext
          unprotected SSPs.
        locator: "§6.7"
        kind: "stated"
        quotes:
          - source_lines: "754-763"
            quote: |-
              The module shall either: a) continue to operate normally, or b) shutdown, or c) zeroise all plaintext unprotected SSPs.
        constrained_by:
          - "nist-sp-800-140#R-0084"
          - "nist-sp-800-140#R-0193"
          - "nist-sp-800-140#R-0194"
          - "nist-sp-800-140#R-0195"
        candidates:
          - "C-0045"
          - "C-0046"
          - "C-0047"
        on_error: "Response differs from the documentation: F07.E1."
        on_error_basis: "inferred"
        note: >-
          The outcome sets differ: cold side shutdown or zeroise, hot side adds an error state,
          VE07.81.01 adds continue normally (SA-03).
      - n: "5"
        from: "cstl"
        to: "cstl"
        message: "security policy check"
        action: >-
          Check the non-proprietary security policy gives the normal temperature and voltage ranges
          and the outcome, shutdown or zeroisation, beyond them.
        locator: "§6.7"
        kind: "stated"
        quotes:
          - source_lines: "773-776"
            quote: |-
              TE07.81.03: The tester shall verify that the non-proprietary security policy specifies the normal operating temperature and voltage range, and whether the module forces shut down or zeroises all unprotected SSPs if the operating temperature or voltage falls outside the normal operating range of the module.
        constrained_by:
          - "nist-sp-800-140#R-0087"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F07.E1"
        at_step: "4"
        condition: "The module's response is not the documented one."
        kind: "inferred"
        inferred_reason: "No failure handling is stated."
        outcome: "unspecified by source"
        outcome_basis: "unspecified"
  - id: "F08"
    name: "split-knowledge-component-entry"
    title: "AS09.23: key components under split knowledge (Level 3)"
    locator: "§6.9"
    participants:
      - "operator"
      - "module"
      - "vendor"
      - "cstl"
    summary: >-
      Under split knowledge each key component is entered or output under its own identity-based
      operator authentication, and at least two components are needed to reconstruct the key; the
      vendor documents the component count and why fewer components reveal nothing but the length;
      the tester checks both and the rationale.
    order_note: >-
      The module-side order (authenticate, enter, reconstruct) is this model's reading of AS09.23;
      the evidence steps follow VE and TE order.
    steps:
      - n: "1"
        from: "operator"
        to: "module"
        message: "identity-based authentication"
        action: >-
          Each component holder authenticates by identity, separately for each component entered or
          output.
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "785-788"
            quote: |-
              {If the module employs split knowledge procedures, the module shall employ separate identity-based operator authentication for entering or outputting each key component,} and at least two key components shall be required to reconstruct the original cryptographic key.
        constrained_by:
          - "nist-sp-800-140#R-0088"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
        note: >-
          The clause in braces is the part of the ISO/IEC 19790 sentence another 24759 assertion
          tests.
      - n: "2"
        from: "operator"
        to: "module"
        message: "key component"
        action: "Enter one key component; repeated per component holder."
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "785-788"
            quote: |-
              {If the module employs split knowledge procedures, the module shall employ separate identity-based operator authentication for entering or outputting each key component,} and at least two key components shall be required to reconstruct the original cryptographic key.
        constrained_by:
          - "nist-sp-800-140#R-0088"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "module"
        to: "module"
        message: "key reconstruction"
        action: "Reconstruct the key from at least two components."
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "785-788"
            quote: |-
              {If the module employs split knowledge procedures, the module shall employ separate identity-based operator authentication for entering or outputting each key component,} and at least two key components shall be required to reconstruct the original cryptographic key.
        constrained_by:
          - "nist-sp-800-140#R-0088"
        on_error: "Fewer components than required: F08.E1."
        on_error_basis: "inferred"
      - n: "4"
        from: "vendor"
        to: "cstl"
        message: "split-knowledge documentation"
        action: >-
          Specify the number of components needed and why knowing one fewer reveals nothing about
          the key but its length.
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "791-792"
            quote: |-
              VE09.23.01: The vendor documentation shall specify the number of components that are required to construct the original CSP.
          - source_lines: "793-802"
            quote: |-
              VE09.23.02: If knowledge of the number of key components is required to reconstruct the original key, the vendor provided documentation shall include rationale stating how knowledge of any one less than the number of key components provides no information about the original key other than the length.
        constrained_by:
          - "nist-sp-800-140#R-0089"
          - "nist-sp-800-140#R-0090"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "cstl"
        to: "cstl"
        message: "split-knowledge check"
        action: >-
          Check at least two components are required, that the rationale holds, and its accuracy
          (F01.E1 on doubt).
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "804-805"
            quote: |-
              TE09.23.01: The tester shall verify in the vendor provided documentation that the split knowledge procedure requires at least two components to construct the original CSP.
          - source_lines: "806-809"
            quote: |-
              TE09.23.02: The tester shall verify the vendor provided documentation provides a rationale that no information is gained without knowing all the necessary split keys. that the output of CSPs under split knowledge procedures does not result in the output of a single component that can be used to construct the original CSP.
          - source_lines: "810"
            quote: |-
              TE09.23.04: The tester shall verify the accuracy of any rationale provided by the vendor.
        constrained_by:
          - "nist-sp-800-140#R-0091"
          - "nist-sp-800-140#R-0092"
          - "nist-sp-800-140#R-0093"
        on_error: "Doubt about the rationale: F01.E1."
        on_error_basis: "stated"
    error_paths:
      - id: "F08.E1"
        at_step: "3"
        condition: "Fewer components than required are presented."
        kind: "inferred"
        inferred_reason: "AS09.23 states the minimum; the module's behaviour below it is not stated."
        outcome: "The key cannot be reconstructed; any further handling is unspecified by source."
        outcome_basis: "inferred"
