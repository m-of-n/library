not_modelled:
  - locator: "§5.2"
    what: "How modifications are marked (sequence numbers, underline, strikethrough, No change)"
    reason: "Document convention, not an exchange; its consequence for quotations is SA-01."
    quotes:
      - source_lines: "292-293"
        quote: |-
          Modifications can include a combination of additions using underline and deletions using strikethrough.
  - locator: "§6.2, §6.3, §6.4, §6.7, §6.11"
    what: >-
      Documentation-only checks (AS02.15, AS02.17, AS02.18, AS02.20, AS03.07, AS04.44, AS07.26,
      AS07.77, AS11.29)
    reason: >-
      A VE answered by a TE that reviews documentation or inspects hardware is F01 steps 1 to 3 with
      that VE and TE; assertion_index lists each one's ids. TE07.26.01's hardness measurement at the
      two temperatures is an operational test of that shape.
  - locator: "front matter"
    what: "The CMVP's authority to modify, add or delete TEs and VEs"
    reason: >-
      Front matter describing how this document came to be; not a step anyone performs in testing.
    quotes:
      - source_lines: "137-139"
        quote: |-
          As a validation authority, the Cryptographic Module Validation Program (CMVP) may modify, add or delete TEs and/or VEs as specified under paragraph 5.2 of ISO/IEC 24759.
source_ambiguities:
  - id: "SA-01"
    locator: "§5.2 and throughout §6"
    finding: >-
      Additions are underlined and deletions struck through, and the text rendering keeps neither,
      so deleted and added words read together, for example a VE list printing two designators side
      by side where its range ends (a replaced end, or an end plus an added item: normative.md
      SD-1), two verbs side by side, plaintext unprotected SSPs, and a pair of adjacent
      sentences in TE09.23.02. Which word is the CMVP's cannot be told from the text; the PDF's
      markup decides.
    quotes:
      - source_lines: "292-293"
        quote: |-
          Modifications can include a combination of additions using underline and deletions using strikethrough.
      - source_lines: "469-471"
        quote: |-
          a) For Hybrid Software Module components, the vendor documentation shall provide information required under VE02.15.01 through VE02.15.04 VE02.15.06 and VE02.16.01 through VE02.16.03.
      - source_lines: "679-681"
        quote: |-
          TE07.26.01: The tester shall verify from the vendor documentation and inspection testing of the module that the strength or hardness of the, hard conformal or non-conformal enclosure, coatings or potting materials is the one designed implemented as specified.
      - source_lines: "715-720"
        quote: |-
          If a condition is determined to be outside of the module’s normal operating range, the protection circuitry shall either a) shutdown the module, or b) zeroise all plaintext unprotected SSPs
      - source_lines: "806-809"
        quote: |-
          TE09.23.02: The tester shall verify the vendor provided documentation provides a rationale that no information is gained without knowing all the necessary split keys. that the output of CSPs under split knowledge procedures does not result in the output of a single component that can be used to construct the original CSP.
  - id: "SA-02"
    locator: "§6.9 AS09.28, AS09.30"
    finding: >-
      AS09.28's NOTE 1 says it is tested in AS09.30, and AS09.30's NOTE 1 says it is tested in
      AS09.28; TE09.28.01 checks the information of VE09.30.01, not VE09.28.01.
    quotes:
      - source_lines: "883"
        quote: |-
          NOTE 1 This assertion is tested AS09.30.
      - source_lines: "930"
        quote: |-
          NOTE 1 This assertion is tested in AS09.28.
      - source_lines: "845-846"
        quote: |-
          TE09.28.01: The tester shall verify the vendor documentation includes the information specified in VE09.30.01.
  - id: "SA-03"
    locator: "§6.7 AS07.81, VE07.81.01, VE07.81.02, TE07.81.03"
    finding: >-
      The admissible EFT outcomes differ by sentence: the cold side lists shutdown or zeroise, the
      hot side adds an error state, VE07.81.01 adds continuing to operate normally, and VE07.81.02
      and TE07.81.03 name only shutdown or zeroise. The test ranges are in AS07.82, AS07.85 and
      AS07.86, which this document does not modify or reproduce.
    quotes:
      - source_lines: "737-748"
        quote: |-
          The temperature range to be tested shall be from a temperature within the normal operating temperature range to the lowest (i.e., coldest) temperature that either (1) shutdown the module to prevent further operation or (2) immediately zeroise all unprotected SSPs; and from a temperature within the normal operating temperature range to the highest (i.e., hottest) temperature that either (1) shuts down or goes into an error state or (2) zeroises all unprotected SSPs.
      - source_lines: "754-763"
        quote: |-
          The module shall either: a) continue to operate normally, or b) shutdown, or c) zeroise all plaintext unprotected SSPs.
      - source_lines: "768-769"
        quote: |-
          VE07.81.02: The security policy shall address whether the employed EFT feature forces module shutdown or zeroises all unprotected SSPs and shall specify the temperature range met.
      - source_lines: "773-776"
        quote: |-
          TE07.81.03: The tester shall verify that the non-proprietary security policy specifies the normal operating temperature and voltage range, and whether the module forces shut down or zeroises all unprotected SSPs if the operating temperature or voltage falls outside the normal operating range of the module.
  - id: "SA-04"
    locator: "§6.6 TE06.11.02, TE06.11.03"
    finding: "The two procedures say what to attempt and not what result passes; F04 step 6 is inferred."
    quotes:
      - source_lines: "659-660"
        quote: |-
          During execution of a cryptographic process, the tester shall attempt to execute, modify or read SSPs, control or status data which the tester has authorised access.
      - source_lines: "663-664"
        quote: |-
          During execution of a cryptographic process, the tester shall attempt to execute, modify or read SSPs, control or status data which the tester has unauthorised access.
  - id: "SA-05"
    locator: "§6.4 TE04.45.02"
    finding: >-
      What initiating an error on an uninitialised module means is not defined, and whether the
      authorised role is assumed before or after initialisation is not said.
    quotes:
      - source_lines: "592-593"
        quote: |-
          TE04.45.02: If access to the module before initialisation is procedurally controlled, the tester shall initiate an error on an uninitialised module and shall verify that the module denies access.
      - source_lines: "594-595"
        quote: |-
          The tester shall assume the authorised role and verify that the required authentication complies with the documented procedures.
  - id: "SA-06"
    locator: "§6.10 AS10.01, AS10.02"
    finding: >-
      The closing clause about the approved or non-approved mode can be read as self-tests running
      whatever the mode or as the module deciding the mode; it is probably an addition whose
      underline the rendering lost (SA-01). M01 does not let self-tests choose the mode.
    quotes:
      - source_lines: "973-981"
        quote: |-
          All self-tests shall be performed, {and determination of pass or fail shall be made by the module, without external controls, externally provided input text test vectors, expected output results, or operator intervention or whether the module will operate in an approved or non-approved mode}.
      - source_lines: "984-987"
        quote: |-
          {All self-tests shall be performed,} and determination of pass or fail shall be made by the module, without external controls, externally provided input text test vectors, expected output results, or operator intervention or whether the module will operate in an approved or non-approved mode.
  - id: "SA-07"
    locator: "§6.10 AS10.07, TE10.07.05"
    finding: >-
      The only test procedure under AS10.07 checks who decides pass or fail (AS10.02's subject), not
      entry into the error state or the error indicator; how the module leaves the error state is
      not stated here.
    quotes:
      - source_lines: "996-997"
        quote: |-
          If a cryptographic module fails a self-test, the module shall enter an error state {and shall output an error indicator as specified in {ISO/IEC 19790:2012/Cor.1:2015 subclause} 7.3.3}.
      - source_lines: "999-1001"
        quote: |-
          TE10.07.05: The tester shall verify by inspection and from the vendor documentation that determination of pass or fail of each self-test is made by the module, without external controls, externally provided input text test vectors, expected output results, or operator intervention.
  - id: "SA-08"
    locator: "§6.11 AS11.13"
    finding: >-
      AS11.13 forbids a change into the Crypto Officer state from another role; entering it from no
      role, and leaving it, are not addressed (M03 marks them inferred).
    quotes:
      - source_lines: "1006-1007"
        quote: |-
          Changing to the Crypto Officer state from any other role other than the Crypto Officer shall be prohibited.
      - source_lines: "1008-1009"
        quote: |-
          NOTE: The intention of this assertion is to remove/avoid privilege escalation to a Crypto Officer role.
  - id: "SA-09"
    locator: "§6.9 VE09.28.03, TE09.28.05, TE09.28.06"
    finding: >-
      TE09.28.05 has the tester confirm the documentation puts the procedure under operator control,
      while TE09.28.06 accepts a procedural method not under the operator's direct control on a
      rationale; VE09.28.03 speaks only of the controlled case.
    quotes:
      - source_lines: "838-841"
        quote: |-
          VE09.28.03: If SSPs are zeroised procedurally while under the control of the operator (i.e., present to observe the method has completed successfully or controlled via a remote management session), vendor documentation and the module security policy must specify how the methods shall be performed.
      - source_lines: "873-875"
        quote: |-
          TE09.28.05: If procedural zeroisation methods are used, the tester shall verify that the vendor provided documentation, including the security policy, specifies that the procedure must be performed under the control of the operator.
      - source_lines: "877-879"
        quote: |-
          TE09.28.06 If the procedural zeroisation method is not under the direct control of the operator, the tester shall verify the accuracy of any rationale provided by the vendor as to why unprotected SSPs within the module cannot be obtained by an attacker.
  - id: "SA-10"
    locator: "§6, §6.7"
    finding: >-
      Binding text the skeleton captured nowhere: the three TE response forms of §6, and AS07.77's
      two outcome items. Pass 1 quoted them directly for the requirements lane; that lane has since
      added them as entries (R-0159, R-0160 and R-0161 for the response forms, R-0188 and R-0189
      for the outcome items), which pass 3 cites in F01 step 3 and in M01.T12 and M01.T13.
    quotes:
      - source_lines: "302-305"
        quote: |-
          Documentation: Reference/cite the applicable vendor documentation and summarize the contents per the TE.
      - source_lines: "312-314"
        quote: |-
          Operational Testing: Describe the test method and tools, and summarize the results, per the TE.
      - source_lines: "316-319"
        quote: |-
          Verify or Verify by Inspection: Describe the test or inspection method used to verify the requirement and provide detailed results of the test or inspection, per the TE.
      - source_lines: "701"
        quote: |-
          — shutdown the module to prevent further operation,
      - source_lines: "708"
        quote: |-
          — immediately zeroise all unprotected SSPs
