  - id: "F05"
    name: "zeroisation-test"
    title: "AS09.28 to AS09.30: zeroise, then prove nothing is left (TE09.28.x, TE09.30.x)"
    locator: "§6.9"
    participants:
      - "vendor"
      - "cstl"
      - "module"
      - "operator"
    summary: >-
      The vendor documents zeroisation; the tester checks it and every rationale in it, inventories
      the SSPs (TE09.28.02) or keys (TE09.30.02), issues the zeroise command, checks timing, then
      tries to use each stored SSP and expects none to be accessible; SSPs left in place must be
      encrypted with an approved algorithm or protected inside an embedded validated module.
      TE09.28.x speaks of unprotected SSPs and TE09.30.x of plaintext SSPs (SA-13). Procedural
      zeroisation is checked separately.
    order_note: >-
      Documentation first; TE09.28.02 orders inventory, command, use attempts; TE09.28.03 and .04
      are separate checks placed after the command.
    steps:
      - n: "1"
        from: "vendor"
        to: "cstl"
        message: "zeroisation documentation"
        action: >-
          Specify techniques, restrictions, which SSPs are and are not zeroised and why, why
          zeroisation outruns a compromise, how methods deny an attacker the SSPs, how procedural
          methods are performed, and why a zeroised SSP cannot be retrieved or reused.
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "825-833"
            quote: |-
              VE09.28.01: The vendor documentation shall specify the following zeroisation information for SSPs: a. Zeroisation techniques b. Restrictions when unprotected SSPs can be zeroised c. Unprotected SSPs that are zeroised d. Unprotected SSPs that are not zeroised and rationale e. Rationale explaining how the zeroisation technique is performed in a time that is not sufficient to compromise unprotected SSPs
          - source_lines: "835-836"
            quote: |-
              VE09.28.02 The vendor documentation shall specify how the zeroisation method(s) are employed such that unprotected SSPs within the module cannot be obtained by an attacker.
          - source_lines: "838-841"
            quote: |-
              VE09.28.03: If SSPs are zeroised procedurally while under the control of the operator (i.e., present to observe the method has completed successfully or controlled via a remote management session), vendor documentation and the module security policy must specify how the methods shall be performed.
          - source_lines: "894-895"
            quote: |-
              VE09.29.01: The vendor documentation shall specify how a zeroised SSP cannot be retrievable or reusable.
          - source_lines: "934-942"
            quote: |-
              VE09.30.01: The vendor documentation shall specify the following SSPs zeroisation information: a) Zeroisation techniques b) Restrictions when plaintext SSPs can be zeroised c) Plaintext SSPs that are zeroised d) Plaintext SSPs that are not zeroised and rationale e) Rationale explaining how the zeroisation technique is performed in a time that is not sufficient to compromise plaintext SSPs
        constrained_by:
          - "nist-sp-800-140#R-0096"
          - "nist-sp-800-140#R-0097"
          - "nist-sp-800-140#R-0098"
          - "nist-sp-800-140#R-0099"
          - "nist-sp-800-140#R-0112"
          - "nist-sp-800-140#R-0117"
          - "nist-sp-800-140#R-0118"
          - "nist-sp-800-140#R-0199"
          - "nist-sp-800-140#R-0201"
          - "nist-sp-800-140#R-0202"
          - "nist-sp-800-140#R-0203"
          - "nist-sp-800-140#R-0218"
          - "nist-sp-800-140#R-0219"
          - "nist-sp-800-140#R-0220"
          - "nist-sp-800-140#R-0221"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "cstl"
        to: "cstl"
        message: "documentation check"
        action: >-
          Check the documentation carries that information and that each rationale is accurate
          (F01.E1 where it leaves doubt).
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "845-846"
            quote: |-
              TE09.28.01: The tester shall verify the vendor documentation includes the information specified in VE09.30.01.
          - source_lines: "899-900"
            quote: |-
              TE09.29.01: The tester shall verify that the vendor provided documentation specifies how a zeroised SSP cannot be retrievable or reusable.
          - source_lines: "909"
            quote: |-
              TE09.29.02: The tester shall verify the accuracy of any rationale provided by the vendor.
          - source_lines: "946-947"
            quote: |-
              TE09.30.01: The tester shall verify the vendor documentation that the information specified in VE09.30.01 is included.
        constrained_by:
          - "nist-sp-800-140#R-0100"
          - "nist-sp-800-140#R-0101"
          - "nist-sp-800-140#R-0113"
          - "nist-sp-800-140#R-0114"
          - "nist-sp-800-140#R-0119"
          - "nist-sp-800-140#R-0120"
        on_error: "Doubt about a rationale: F01.E1."
        on_error_basis: "stated"
      - n: "3"
        from: "cstl"
        to: "module"
        message: "SSP inventory"
        action: "Determine which SSPs (TE09.28.02) or keys (TE09.30.02) are present."
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "855-856"
            quote: |-
              TE09.28.02: The tester shall verify which SSPs are present in the module and initiate the zeroise command.
          - source_lines: "951-952"
            quote: |-
              TE09.30.02: The tester shall verify which keys are present in the module and initiate the zeroise command.
        constrained_by:
          - "nist-sp-800-140#R-0103"
          - "nist-sp-800-140#R-0122"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "cstl"
        to: "module"
        message: "zeroise command"
        action: "Initiate the zeroise command."
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "855-856"
            quote: |-
              TE09.28.02: The tester shall verify which SSPs are present in the module and initiate the zeroise command.
          - source_lines: "951-952"
            quote: |-
              TE09.30.02: The tester shall verify which keys are present in the module and initiate the zeroise command.
        constrained_by:
          - "nist-sp-800-140#R-0103"
          - "nist-sp-800-140#R-0122"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "module"
        to: "module"
        message: "zeroisation"
        action: >-
          Zeroise all unprotected SSPs and key components, for example by overwriting with all
          zeros, all ones or random data.
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "820-821"
            quote: |-
              A module shall provide methods to zeroise all unprotected SSPs and key components within the module.
          - source_lines: "927-928"
            quote: |-
              The cryptographic module shall perform the zeroisation of unprotected SSPs (e.g. overwriting with all zeros or all ones or with random data).
        constrained_by:
          - "nist-sp-800-140#R-0095"
          - "nist-sp-800-140#R-0116"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "6"
        from: "cstl"
        to: "cstl"
        message: "zeroisation timing check"
        action: >-
          Initiate zeroisation and check destruction completes in less time than a compromise would
          need.
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "860-861"
            quote: |-
              TE09.28.03: The tester shall initiate zeroisation and verify the SSP destruction method is performed in a time that is not sufficient to compromise unprotected SSPs.
          - source_lines: "956-957"
            quote: |-
              TE09.30.03: The tester shall initiate zeroisation and verify the key destruction method is performed in a time that is not sufficient to compromise plaintext SSPs.
        constrained_by:
          - "nist-sp-800-140#R-0106"
          - "nist-sp-800-140#R-0125"
        on_error: "Too slow: F05.E2."
        on_error_basis: "inferred"
      - n: "7"
        from: "cstl"
        to: "module"
        message: "cryptographic operation attempt"
        action: "After the command completes, try a cryptographic operation with each SSP that was stored."
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "856-857"
            quote: |-
              Following the completion of the zeroise command, the tester shall attempt to perform cryptographic operations using each of the unprotected SSPs that were stored in the module.
          - source_lines: "952-953"
            quote: |-
              Following the completion of the zeroise command, the tester shall attempt to perform cryptographic operations using each of the plaintext SSPs that were stored in the module.
        constrained_by:
          - "nist-sp-800-140#R-0104"
          - "nist-sp-800-140#R-0123"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "8"
        from: "module"
        to: "cstl"
        message: "SSP access refusal"
        action: "No zeroised SSP can be accessed; a zeroised SSP can be neither retrieved nor reused."
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "857-858"
            quote: |-
              The tester shall verify that each unprotected SSP cannot be accessed.
          - source_lines: "953-954"
            quote: |-
              The tester shall verify that each plaintext SSPs cannot be accessed.
          - source_lines: "890"
            quote: |-
              A zeroised SSP shall not be retrievable or reusable.
        constrained_by:
          - "nist-sp-800-140#R-0105"
          - "nist-sp-800-140#R-0124"
          - "nist-sp-800-140#R-0111"
        on_error: "An SSP still usable: F05.E1."
        on_error_basis: "stated"
      - n: "9"
        from: "cstl"
        to: "cstl"
        message: "residual SSP protection check"
        action: >-
          Check each SSP the command does not zeroise is encrypted with an approved algorithm or
          protected inside an embedded validated module.
        locator: "§6.9"
        kind: "stated"
        quotes:
          - source_lines: "863-871"
            quote: |-
              TE09.28.04: The tester shall verify that all unprotected SSPs that are not zeroised by the zeroise command are either 1) encrypted using an approved algorithm, or 2) physically or logically protected within an embedded validated cryptographic module (validated as conforming to ISO/IEC 19790).
          - source_lines: "965-968"
            quote: |-
              TE09.30.04: The tester shall verify that all plaintext SSPs that are not zeroised by the zeroise command are either 1) encrypted using an approved algorithm, or 2) physically or logically protected within an embedded validated cryptographic module (validated as conforming to ISO/IEC 19790:2012/Cor.1:2015).
        constrained_by:
          - "nist-sp-800-140#R-0107"
          - "nist-sp-800-140#R-0126"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "10"
        from: "cstl"
        to: "operator"
        message: "procedural zeroisation check"
        action: >-
          Where zeroisation is procedural, check the documentation and security policy say the
          operator must control it.
        locator: "§6.9"
        kind: "stated"
        guard: "procedural zeroisation methods are used"
        quotes:
          - source_lines: "873-875"
            quote: |-
              TE09.28.05: If procedural zeroisation methods are used, the tester shall verify that the vendor provided documentation, including the security policy, specifies that the procedure must be performed under the control of the operator.
        constrained_by:
          - "nist-sp-800-140#R-0108"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "11"
        from: "cstl"
        to: "vendor"
        message: "procedural zeroisation check"
        action: >-
          Where a procedural method is not under the operator's direct control, check the vendor's
          rationale for why an attacker cannot obtain the SSPs (F01.E1 on doubt).
        locator: "§6.9"
        kind: "stated"
        guard: "the operator does not directly control the procedural method"
        quotes:
          - source_lines: "877-879"
            quote: |-
              TE09.28.06 If the procedural zeroisation method is not under the direct control of the operator, the tester shall verify the accuracy of any rationale provided by the vendor as to why unprotected SSPs within the module cannot be obtained by an attacker.
        constrained_by:
          - "nist-sp-800-140#R-0109"
          - "nist-sp-800-140#R-0110"
        on_error: "Doubt about the rationale: F01.E1."
        on_error_basis: "stated"
    error_paths:
      - id: "F05.E1"
        at_step: "8"
        condition: "An SSP can still be accessed or used after zeroisation."
        kind: "stated"
        outcome: "AS09.29 forbids it; what follows a module that fails is unspecified by source."
        outcome_basis: "unspecified"
        quotes:
          - source_lines: "890"
            quote: |-
              A zeroised SSP shall not be retrievable or reusable.
        constrained_by:
          - "nist-sp-800-140#R-0111"
      - id: "F05.E2"
        at_step: "6"
        condition: "Destruction takes long enough to allow a compromise."
        kind: "inferred"
        inferred_reason: "TE09.28.03 and TE09.30.03 state the check, not the failure."
        outcome: "unspecified by source"
        outcome_basis: "unspecified"
  - id: "F06"
    name: "cve-disclosure-and-assessment"
    title: "VE11.38.03 and TE11.38.03: known vulnerabilities (AS11.38, all levels)"
    locator: "§6.11"
    participants:
      - "vendor"
      - "cstl"
    summary: >-
      A CMVP addition under the guidance-documents assertion: the vendor lists every CVE associated
      with the module and, per CVE, either assures it is not security relevant or describes its
      mitigation; the tester checks each is not security relevant or is appropriately mitigated.
