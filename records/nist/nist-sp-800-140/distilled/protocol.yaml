flows:
  - id: "F01"
    name: "evidence-and-test-response"
    title: "Vendor evidence, test evidence and the response the CMVP requires"
    locator: "§1, §5.1, §6"
    participants:
      - "vendor"
      - "cstl"
      - "cmvp"
    summary: >-
      The frame every assertion's VE and TE plug into: the vendor supplies evidence to the
      laboratory, the tester performs each TE, and each TE is answered with the information the CMVP
      requires for its kind; ISO/IEC 24759 governs wherever this document does not modify it. Five
      TEs add a stated loop: where a vendor rationale leaves doubt, the tester requires more
      information.
    order_note: >-
      §1 and §5.1 order evidence before testing; §6 orders nothing further. F01.E1 loops back to
      step 1.
    preconditions:
      - id: "F01.P1"
        condition: >-
          Test requirements are ISO/IEC 24759's except where this document modifies them; sections
          6.1, 6.5, 6.8 and 6.12 carry no change.
        kind: "stated"
        quotes:
          - source_lines: "202-203"
            quote: |-
              Unless otherwise specified in this document, the test requirements are specified in ISO/IEC 24759.
          - source_lines: "321-323"
            quote: |-
              6.1 General No change.
          - source_lines: "628-630"
            quote: |-
              6.5 Software/Firmware security No change.
          - source_lines: "778-780"
            quote: |-
              6.8 Non-invasive security No change.
          - source_lines: "1068-1070"
            quote: |-
              6.12 Mitigation of other attacks No change.
        constrained_by:
          - "nist-sp-800-140#R-0142"
    steps:
      - n: "1"
        from: "vendor"
        to: "cstl"
        message: "vendor evidence"
        action: >-
          The vendor provides the evidence each modified assertion's VEs ask for (assertion_index),
          with ISO/IEC 24759's own VEs elsewhere.
        locator: "§1, §5.1"
        kind: "stated"
        quotes:
          - source_lines: "200-202"
            quote: |-
              It also specifies the modification to the required documentation vendors are to provide to the testing laboratories as supporting evidence to demonstrate conformity.
          - source_lines: "258-260"
            quote: |-
              Section 6 of this document specifies any modifications to the requirements for information that vendors shall provide to testing laboratories and the requirements for testing that shall be used by testing laboratories.
        constrained_by:
          - "nist-sp-800-140#R-0001"
          - "nist-sp-800-140#R-0141"
          - "nist-sp-800-140#R-0145"
        candidates:
          - "C-0011"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "cstl"
        to: "cstl"
        message: "test evidence"
        action: >-
          The tester performs each TE: a documentation review, an operational test, or a
          verification by inspection.
        locator: "§1, §5.1, §6"
        kind: "stated"
        quotes:
          - source_lines: "198-200"
            quote: |-
              This document specifies the Cryptographic Module Validation Program (CMVP) modifications of the methods to be used by a Cryptographic and Security Testing Laboratory (CSTL) to demonstrate conformance.
          - source_lines: "258-260"
            quote: |-
              Section 6 of this document specifies any modifications to the requirements for information that vendors shall provide to testing laboratories and the requirements for testing that shall be used by testing laboratories.
          - source_lines: "299-300"
            quote: |-
              CMVP requires the following information when responding to a documentation, operational testing, or verify/verify by inspection requirement.
        constrained_by:
          - "nist-sp-800-140#R-0001"
          - "nist-sp-800-140#R-0140"
          - "nist-sp-800-140#R-0146"
          - "nist-sp-800-140#R-0158"
        candidates:
          - "C-0014"
        on_error: "Doubt about a vendor rationale in five TEs: F01.E1. A TE not met: F01.E3."
        on_error_basis: "stated"
      - n: "3"
        from: "cstl"
        to: "cmvp"
        message: "TE response"
        action: >-
          Each TE is answered with more than yes or no: for documentation, cite the vendor
          documentation and summarise it; for operational testing, describe method and tools and
          summarise results; for verify or verify by inspection, describe the method and give
          detailed results.
        locator: "§6"
        kind: "stated"
        to_basis: "inferred"
        basis_reason: >-
          §6 says the CMVP requires this information; it does not say how the response reaches the
          CMVP.
        quotes:
          - source_lines: "298"
            quote: |-
              In responding to test evidence (TE), a yes/no answer does not provide sufficient assurance.
          - source_lines: "299-300"
            quote: |-
              CMVP requires the following information when responding to a documentation, operational testing, or verify/verify by inspection requirement.
          - source_lines: "302-305"
            quote: |-
              Documentation: Reference/cite the applicable vendor documentation and summarize the contents per the TE.
          - source_lines: "312-314"
            quote: |-
              Operational Testing: Describe the test method and tools, and summarize the results, per the TE.
          - source_lines: "316-319"
            quote: |-
              Verify or Verify by Inspection: Describe the test or inspection method used to verify the requirement and provide detailed results of the test or inspection, per the TE.
        constrained_by:
