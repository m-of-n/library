reader_defect:
  status: >-
    Fixed in library#137 (63d708e) after this lane ran; this block records what the lane worked
    under (normative.md TD-3).
  finding: >-
    bin/_source_text dropped the text after the form feed on a page's first line when that line was
    not furniture (found by this lane, 2026-11-15; protocol.yaml of fips-140-3 has the mechanism).
    In this rendering the furniture rule removed the running headers and page numbers of the body,
    so the loss was confined to the title page (L22) and the closing revision page (L1081); the
    front-matter page numbers i to iii (L111, L157, L192) and 18 (L1083) stayed in as prose. The
    fixed reader keeps L22 and L1081 and reads i to iii as furniture; 18, on the rotated closing
    page, is still read as text, and binds nothing.
  consequence: >-
    No quotation in this lane's files spans those lines; the generator refused any range containing
    them. Under the fixed reader every quotation still checks (pass 2, 2026-11-15).
  lines_refused: "22, 111, 157, 192, 1081"
applicability: >-
  A derived test requirements document: it modifies ISO/IEC 24759's vendor evidence (VE) and test
  evidence (TE) for 22 assertions. Its exchange is the conformance test itself: vendor evidence to
  the laboratory, the tester's procedures against the module, and the TE response the CMVP requires
  (§1, §5.1, §6). The operational procedures that drive the module (access before initialisation,
  authentication entry, operating system protection, zeroisation, environmental failure testing,
  split knowledge) are flows; the module states the modified assertions name are in
  state-machine.yaml.
conventions:
  quoting: >-
    Every quotation is a quotes item {source_lines, quote} whose words were cut by script from
    .cache/nist-sp-800-140.txt as bin/_source_text reads a PDF rendering (furniture removed,
    line-end hyphens joined, whitespace collapsed), tightened so that dropping either end line loses
    it, and never typed; bin/check-quotes verifies each. Prose in action, guard, note, meaning,
    condition and outcome is this file's wording. The rendering keeps no underline or strikethrough,
    so a quotation of a modified paragraph carries added and deleted words together (SA-01).
  kind: >-
    stated: the source says this step, state or transition exists. inferred: this model added it,
    with inferred_reason. A stated step whose receiver the source does not name carries to_basis
    inferred.
  on_error_basis: >-
    stated: the source says what follows a failure. unspecified: the source names the check and says
    nothing about its failure. inferred: this file's reading.
  constrained_by: >-
    nist-sp-800-140#R-NNNN ids of requirements.yaml, each emitted by script from a phrase of its
    text, its locator and where texts repeat a line window, refusing zero or several matches; every
    resolved pair was read back. Pass 1 cites only the skeleton's ids (R-0001 to R-0139): the
    requirements lane adds split children and promoted candidates while this lane runs, so a split
    parent stands for its children and a promoted sentence is reached through its C-id or quotation,
    for cross-check to join by line containment. Pass 3 made that join by script: 27 ids added here and
    15 in state-machine.yaml, each where the step, precondition, error path or transition quotes the
    whole text of an entry the requirements lane added, with a split child beside a cited parent
    where the step relies on that child (R-0145, R-0146). Where an entry's text repeats across
    assertions only the copy whose split parent the step cites was added.
  candidates: >-
    C-NNNN ids of this record's inferred-candidates.yaml for keyword-less sentences a step rests on,
    emitted the same way; cross-check joins each to the R-id it is promoted to (pass 3 did: the R-id is in constrained_by
    beside the C-id).
  assertion_index: >-
    Every assertion this document modifies, with the requirement ids of its statement, of each VE
    and TE paragraph and of its NOTEs, assigned by script by line containment (a paragraph runs from
    its label to the next label, sub-heading or NOTE), and the flows and machines that model it.
    Brace text inside an assertion is read as ISO/IEC 24759's notation for the part another
    assertion tests; the document does not define it (R-0240, inferred).
    Pass 3 added the 72 ids the requirements lane appended after pass 1 (assertion headings and
    bullets to statement_ids, NOTEs to note_ids, split children and hunted lines to the VE or TE
    paragraph whose lines contain them), by the same containment; R-0241, kind inferred and without
    lines, is left out, as is every inferred entry.
  messages: >-
    message names a work product of the work_products list. The document defines no message format;
    the names are this model's, for the messages lane and cross-check to join. Pass 3 joined each work
    product to messages.yaml: it carries structure (the messages.yaml names that hold it, 11 of 44)
    or structure none with structure_reason (33 of 44). Eight messages hold no work product (see
    design-notes.md).
