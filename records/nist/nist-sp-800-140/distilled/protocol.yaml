        locator: "§6.4"
        kind: "stated"
        quotes:
          - source_lines: "619-620"
            quote: |-
              TE04.54.01: The tester shall verify from the vendor documentation that the authentication data is obscured during data entry.
        constrained_by:
          - "nist-sp-800-140#R-0059"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "3"
        from: "cstl"
        to: "module"
        message: "authentication data entry"
        action: "Enter authentication data."
        locator: "§6.4"
        kind: "stated"
        quotes:
          - source_lines: "622-623"
            quote: |-
              TE04.54.02: The tester shall enter authentication data and verify that there is no access of authentication data during data entry, except, as an option, to the operator.
        constrained_by:
          - "nist-sp-800-140#R-0060"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "module"
        to: "cstl"
        message: "obscured feedback"
        action: "Nothing of the data is accessible during entry, except optionally to the operator."
        locator: "§6.4"
        kind: "stated"
        quotes:
          - source_lines: "622-623"
            quote: |-
              TE04.54.02: The tester shall enter authentication data and verify that there is no access of authentication data during data entry, except, as an option, to the operator.
          - source_lines: "604-606"
            quote: |-
              Feedback of authentication data to an operator shall be obscured during authentication to anyone other than the operator. (e.g. no visible display of characters when entering a password).
        constrained_by:
          - "nist-sp-800-140#R-0060"
          - "nist-sp-800-140#R-0056"
          - "nist-sp-800-140#R-0180"
        on_error: "Data visible to others: F03.E1."
        on_error_basis: "inferred"
      - n: "5"
        from: "cstl"
        to: "operator"
        message: "confirmation check"
        action: >-
          Where the vendor lets an operator confirm the data at entry, check that the confirmation
