        on_error: "unspecified by source"
        on_error_basis: "unspecified"
    error_paths:
      - id: "F03.E1"
        at_step: "4, 5"
        condition: "Authentication data or its confirmation is accessible to someone other than the operator."
        kind: "inferred"
