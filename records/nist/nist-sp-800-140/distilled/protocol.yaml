  - id: "F02"
    name: "uninitialised-module-access-test"
    title: "TE04.45.02: access before initialisation is denied (AS04.45, Levels 2, 3 and 4)"
    locator: "§6.4"
    participants:
      - "cstl"
      - "module"
    summary: >-
      A module without the authentication data for first access must be controlled by other
      authorised methods (procedural controls, factory-set or default data) that also initialise
      authentication. Where procedural controls govern access before initialisation, the tester
      provokes an error and checks access is denied, assumes the authorised role, and checks other
      roles are refused before initialisation.
    order_note: >-
      Sentence order of TE04.45.02. Whether step 3 happens before or after initialisation is not
      stated (SA-05).
    preconditions:
      - id: "F02.P1"
        condition: >-
          The module lacks the authentication data needed to authenticate the operator at first
          access, so other authorised methods control access and initialise the authentication
          mechanisms.
        kind: "stated"
        quotes:
          - source_lines: "580-588"
            quote: |-
              If a cryptographic module does not contain the authentication data required to authenticate the operator for the first time the module is accessed, then other authorised methods (e.g. procedural controls or use of factory-set or default authentication data) shall be used to control access to the module and initialise the authentication mechanisms.
        constrained_by:
          - "nist-sp-800-140#R-0052"
      - id: "F02.P2"
        condition: "Procedural controls govern access before initialisation."
        kind: "stated"
        quotes:
          - source_lines: "592-593"
            quote: |-
              TE04.45.02: If access to the module before initialisation is procedurally controlled, the tester shall initiate an error on an uninitialised module and shall verify that the module denies access.
        constrained_by:
          - "nist-sp-800-140#R-0053"
    steps:
      - n: "1"
        from: "cstl"
        to: "module"
        message: "access attempt before initialisation"
        action: "Initiate an error on the uninitialised module."
        locator: "§6.4"
        kind: "stated"
        quotes:
          - source_lines: "592-593"
            quote: |-
              TE04.45.02: If access to the module before initialisation is procedurally controlled, the tester shall initiate an error on an uninitialised module and shall verify that the module denies access.
        constrained_by:
          - "nist-sp-800-140#R-0053"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "2"
        from: "module"
        to: "cstl"
        message: "access denial"
        action: "The module denies access."
        locator: "§6.4"
        kind: "stated"
        quotes:
          - source_lines: "592-593"
            quote: |-
              TE04.45.02: If access to the module before initialisation is procedurally controlled, the tester shall initiate an error on an uninitialised module and shall verify that the module denies access.
        constrained_by:
          - "nist-sp-800-140#R-0053"
        on_error: "Access granted: F02.E1."
        on_error_basis: "inferred"
      - n: "3"
        from: "cstl"
        to: "module"
        message: "authorised role assumption"
        action: >-
          Assume the authorised role and check that the authentication required matches the
          documented procedures.
        locator: "§6.4"
        kind: "stated"
        quotes:
          - source_lines: "594-595"
            quote: |-
              The tester shall assume the authorised role and verify that the required authentication complies with the documented procedures.
        constrained_by:
          - "nist-sp-800-140#R-0054"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "4"
        from: "cstl"
        to: "module"
        message: "role assumption attempt"
        action: "Before initialisation, try to assume the other roles."
        locator: "§6.4"
        kind: "stated"
        quotes:
          - source_lines: "595-596"
            quote: |-
              The tester shall attempt to assume other roles before the module has been initialised and verify that the module denies access to the roles.
        constrained_by:
          - "nist-sp-800-140#R-0055"
        on_error: "unspecified by source"
        on_error_basis: "unspecified"
      - n: "5"
        from: "module"
        to: "cstl"
        message: "role denial"
        action: "The module denies access to those roles."
        locator: "§6.4"
        kind: "stated"
        quotes:
          - source_lines: "595-596"
            quote: |-
              The tester shall attempt to assume other roles before the module has been initialised and verify that the module denies access to the roles.
        constrained_by:
          - "nist-sp-800-140#R-0055"
        on_error: "A role granted: F02.E1."
        on_error_basis: "inferred"
    error_paths:
      - id: "F02.E1"
        at_step: "2, 5"
        condition: "The module grants access or a role before initialisation."
        kind: "inferred"
        inferred_reason: "The TE states the expected denial and nothing about a module that does not deny."
        outcome: "TE04.45.02 is not met; what follows is unspecified by source."
        outcome_basis: "inferred"
  - id: "F03"
    name: "authentication-data-entry-test"
    title: "AS04.54: authentication feedback is obscured (Levels 2, 3 and 4)"
    locator: "§6.4"
    participants:
      - "vendor"
      - "cstl"
      - "module"
      - "operator"
    summary: >-
      The vendor documents how feedback is obscured and, if offered, how an operator confirms data
      at entry; the tester checks the documentation, enters authentication data and checks nothing
      of it is accessible during entry except, optionally, to the operator, and that a confirmation
      is hidden from everyone else.
    order_note: "Documentation before the entry test (VE before TE, TE04.54.01 before .02 and .03)."
    steps:
      - n: "1"
        from: "vendor"
        to: "cstl"
        message: "authentication feedback documentation"
        action: >-
          Specify the obscuring method and, if implemented, how an operator confirms data at entry
          while others learn nothing useful.
        locator: "§6.4"
        kind: "stated"
        quotes:
          - source_lines: "610-611"
            quote: |-
              VE04.54.01: The vendor documentation shall specify the method used to obscure feedback of the authentication data to an operator during entry of the authentication data.
          - source_lines: "613-615"
            quote: |-
              VE04.54.02: The vendor documentation shall specify how, if implemented, the vendor allows an operator to confirm authentication data at the time of entry, while obscuring any useful information to all others.
        constrained_by:
          - "nist-sp-800-140#R-0057"
          - "nist-sp-800-140#R-0058"
