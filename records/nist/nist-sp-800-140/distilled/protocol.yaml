      - "vendor"
      - "cstl"
      - "operating-system"
      - "module"
    summary: >-
      The vendor documents the operating system's configurable controls; the tester inspects them,
      configures the operating system, and during a cryptographic process attempts to run, change or
      read SSPs and control or status data, once with authorised and once with unauthorised access.
      The expected result of either attempt is not stated (SA-04).
    order_note: "VE, then TE06.11.01, then TE06.11.02 and TE06.11.03 in either order."
