              The temperature range to be tested shall be from a temperature within the normal operating temperature range to the lowest (i.e., coldest) temperature that either (1) shutdown the module to prevent further operation or (2) immediately zeroise all unprotected SSPs; and from a temperature within the normal operating temperature range to the highest (i.e., hottest) temperature that either (1) shuts down or goes into an error state or (2) zeroises all unprotected SSPs.
        constrained_by:
          - "nist-sp-800-140#R-0084"
          - "nist-sp-800-140#R-0082"
          - "nist-sp-800-140#R-0195"
        candidates:
          - "C-0047"
      - id: "M01.T17"
        from: "operational"
        to: "error"
        trigger_kind: "event"
        trigger: "eft-excursion"
        kind: "stated"
        guard: "EFT, on the hot side only: the module goes into an error state"
        guard_ids:
          - "nist-sp-800-140#R-0083"
        quotes:
          - source_lines: "737-748"
            quote: |-
              The temperature range to be tested shall be from a temperature within the normal operating temperature range to the lowest (i.e., coldest) temperature that either (1) shutdown the module to prevent further operation or (2) immediately zeroise all unprotected SSPs; and from a temperature within the normal operating temperature range to the highest (i.e., hottest) temperature that either (1) shuts down or goes into an error state or (2) zeroises all unprotected SSPs.
        constrained_by:
          - "nist-sp-800-140#R-0082"
        note: "SA-03: VE07.81.01 does not list this outcome."
    error_states:
      - "error"
      - "shutdown"
  - id: "M02"
    name: "ssp-zeroisation"
    locator: "§6.7, §6.9"
    subject: "One sensitive security parameter held by the module"
    purpose: >-
      An unprotected SSP ends zeroised, by command, procedure, environmental protection or because
      it is no longer needed, and a zeroised SSP can never come back; SSPs encrypted or held inside
      an embedded validated module, and SSPs used only to reveal plaintext to authentication
      proxies, are outside the requirement.
    initial: "present-unprotected"
    entry_states:
      - "present-unprotected"
      - "protected"
      - "exempt-authentication-proxy"
    initial_note: >-
      An SSP enters this machine in whichever of the three entry states describes how the module
      holds it; only present-unprotected is subject to zeroisation, so the other two have no
      transition out.
    states:
      - name: "present-unprotected"
        meaning: "Held by the module unprotected (TE09.30.x: in plaintext)."
        kind: "stated"
        quotes:
          - source_lines: "820-821"
            quote: |-
              A module shall provide methods to zeroise all unprotected SSPs and key components within the module.
          - source_lines: "856-857"
            quote: |-
              Following the completion of the zeroise command, the tester shall attempt to perform cryptographic operations using each of the unprotected SSPs that were stored in the module.
      - name: "protected"
        meaning: >-
          Encrypted with an approved algorithm, or physically or logically protected inside an
          embedded validated module; zeroisation not required.
        kind: "stated"
        quotes:
          - source_lines: "863-871"
            quote: |-
              TE09.28.04: The tester shall verify that all unprotected SSPs that are not zeroised by the zeroise command are either 1) encrypted using an approved algorithm, or 2) physically or logically protected within an embedded validated cryptographic module (validated as conforming to ISO/IEC 19790).
          - source_lines: "913-915"
            quote: |-
              NOTE 1 Zeroisation of protected PSPs, encrypted CSPs, or CSPs otherwise physically or logically protected within an additional embedded validated module (meeting the requirements of this document International Standard) is not required.
        candidates:
          - "C-0055"
      - name: "exempt-authentication-proxy"
        meaning: >-
          Used only to reveal plaintext data to authentication proxies, for example a module
          initialisation key (informative NOTE).
        kind: "stated"
        quotes:
          - source_lines: "917-919"
            quote: |-
              NOTE 2 SSPs need not meet these zeroisation requirements if they are used exclusively to reveal plaintext data to processes that are authentication proxies (e.g. a CSP that is a module initialisation key).
        candidates:
          - "C-0056"
      - name: "zeroised"
        meaning: "Zeroised: neither retrievable nor reusable."
        kind: "stated"
        terminal: "yes"
        quotes:
          - source_lines: "890"
            quote: |-
              A zeroised SSP shall not be retrievable or reusable.
    transitions:
      - id: "M02.T01"
        from: "present-unprotected"
        to: "zeroised"
        trigger_kind: "message"
        trigger: "zeroise command"
        kind: "stated"
        guard: "destruction completes in less time than a compromise would need"
        guard_ids:
          - "nist-sp-800-140#R-0106"
          - "nist-sp-800-140#R-0125"
        action: "overwrite, for example with all zeros, all ones or random data"
        quotes:
          - source_lines: "820-821"
            quote: |-
              A module shall provide methods to zeroise all unprotected SSPs and key components within the module.
          - source_lines: "927-928"
            quote: |-
              The cryptographic module shall perform the zeroisation of unprotected SSPs (e.g. overwriting with all zeros or all ones or with random data).
          - source_lines: "860-861"
            quote: |-
              TE09.28.03: The tester shall initiate zeroisation and verify the SSP destruction method is performed in a time that is not sufficient to compromise unprotected SSPs.
        constrained_by:
          - "nist-sp-800-140#R-0095"
          - "nist-sp-800-140#R-0116"
      - id: "M02.T02"
        from: "present-unprotected"
        to: "zeroised"
        trigger_kind: "event"
        trigger: "environment-out-of-range"
        kind: "stated"
        guard: "EFP or EFT with the zeroisation approach"
        guard_ids:
          - "nist-sp-800-140#R-0076"
          - "nist-sp-800-140#R-0083"
        quotes:
          - source_lines: "708"
            quote: |-
              — immediately zeroise all unprotected SSPs
        constrained_by:
          - "nist-sp-800-140#R-0075"
          - "nist-sp-800-140#R-0084"
          - "nist-sp-800-140#R-0189"
      - id: "M02.T03"
        from: "present-unprotected"
        to: "zeroised"
        trigger_kind: "event"
        trigger: "ssp-no-longer-needed"
        kind: "stated"
        basis: "NOTE 2 of AS09.28, informative and a should."
        quotes:
          - source_lines: "885-886"
            quote: |-
              NOTE 2 Temporarily stored SSPs and other stored values owned by the module should be zeroised when they are no longer needed for future use.
        candidates:
          - "C-0052"
      - id: "M02.T04"
        from: "zeroised"
        to: "present-unprotected"
        trigger_kind: "event"
        trigger: "retrieval-or-reuse-attempt"
        kind: "stated"
        allowed: "no"
        quotes:
          - source_lines: "890"
            quote: |-
              A zeroised SSP shall not be retrievable or reusable.
        constrained_by:
          - "nist-sp-800-140#R-0111"
      - id: "M02.T05"
        from: "protected"
        to: "protected"
        trigger_kind: "message"
        trigger: "zeroise command"
        kind: "stated"
        basis: "The command may leave a protected SSP in place; the tester checks the protection."
        quotes:
          - source_lines: "863-871"
            quote: |-
              TE09.28.04: The tester shall verify that all unprotected SSPs that are not zeroised by the zeroise command are either 1) encrypted using an approved algorithm, or 2) physically or logically protected within an embedded validated cryptographic module (validated as conforming to ISO/IEC 19790).
        constrained_by:
          - "nist-sp-800-140#R-0107"
          - "nist-sp-800-140#R-0126"
      - id: "M02.T06"
        from: "exempt-authentication-proxy"
        to: "exempt-authentication-proxy"
        trigger_kind: "message"
        trigger: "zeroise command"
        kind: "stated"
        basis: "NOTE 2 of AS09.29 (informative): such SSPs need not meet the zeroisation requirements."
        quotes:
          - source_lines: "917-919"
            quote: |-
              NOTE 2 SSPs need not meet these zeroisation requirements if they are used exclusively to reveal plaintext data to processes that are authentication proxies (e.g. a CSP that is a module initialisation key).
        constrained_by:
          - "nist-sp-800-140#R-0215"
        candidates:
          - "C-0056"
    error_states_note: "None: a forbidden transition (M02.T04) is refused, not a state."
  - id: "M03"
    name: "operator-access"
    locator: "§6.4, §6.11"
    subject: "Operator access to a module that ships without first-access authentication data"
    purpose: >-
      AS04.45 and TE04.45.02 before initialisation: access and other roles denied, only the
      authorised role under procedural control, which initialises authentication. AS11.13 after: no
      change to the Crypto Officer state from another role, against privilege escalation.
    initial: "uninitialised"
    states:
      - name: "uninitialised"
        meaning: "No authentication data for first access; authentication mechanisms not initialised."
        kind: "stated"
        quotes:
          - source_lines: "580-588"
            quote: |-
              If a cryptographic module does not contain the authentication data required to authenticate the operator for the first time the module is accessed, then other authorised methods (e.g. procedural controls or use of factory-set or default authentication data) shall be used to control access to the module and initialise the authentication mechanisms.
          - source_lines: "592-593"
            quote: |-
              TE04.45.02: If access to the module before initialisation is procedurally controlled, the tester shall initiate an error on an uninitialised module and shall verify that the module denies access.
      - name: "authorised-role"
        meaning: "The role the documented procedures authorise before initialisation."
        kind: "stated"
        quotes:
          - source_lines: "594-595"
            quote: |-
              The tester shall assume the authorised role and verify that the required authentication complies with the documented procedures.
      - name: "initialised-no-role"
        meaning: "Authentication initialised; no role assumed."
        kind: "inferred"
        inferred_reason: "The source names initialisation, not the resting state after it."
      - name: "crypto-officer"
        meaning: "The Crypto Officer state."
        kind: "stated"
        quotes:
          - source_lines: "1006-1007"
            quote: |-
              Changing to the Crypto Officer state from any other role other than the Crypto Officer shall be prohibited.
      - name: "other-role"
        meaning: "Any role other than the Crypto Officer."
        kind: "stated"
        quotes:
          - source_lines: "1006-1007"
            quote: |-
              Changing to the Crypto Officer state from any other role other than the Crypto Officer shall be prohibited.
          - source_lines: "595-596"
            quote: |-
              The tester shall attempt to assume other roles before the module has been initialised and verify that the module denies access to the roles.
    transitions:
      - id: "M03.T01"
        from: "uninitialised"
        to: "authorised-role"
        trigger_kind: "event"
        trigger: "assume-authorised-role"
        kind: "stated"
        guard: >-
          access before initialisation is procedurally controlled; the authentication matches the
          documented procedures
        guard_ids:
          - "nist-sp-800-140#R-0053"
        quotes:
          - source_lines: "594-595"
            quote: |-
              The tester shall assume the authorised role and verify that the required authentication complies with the documented procedures.
        constrained_by:
          - "nist-sp-800-140#R-0054"
      - id: "M03.T02"
        from: "uninitialised"
        to: "uninitialised"
        trigger_kind: "event"
        trigger: "access-attempt"
        kind: "stated"
        action: "deny access"
        quotes:
          - source_lines: "592-593"
            quote: |-
              TE04.45.02: If access to the module before initialisation is procedurally controlled, the tester shall initiate an error on an uninitialised module and shall verify that the module denies access.
        constrained_by:
          - "nist-sp-800-140#R-0053"
      - id: "M03.T03"
        from: "uninitialised"
        to: "other-role"
        trigger_kind: "event"
        trigger: "role-assumption-attempt"
        kind: "stated"
        allowed: "no"
        quotes:
          - source_lines: "595-596"
            quote: |-
              The tester shall attempt to assume other roles before the module has been initialised and verify that the module denies access to the roles.
        constrained_by:
          - "nist-sp-800-140#R-0055"
      - id: "M03.T04"
        from: "authorised-role"
        to: "initialised-no-role"
        trigger_kind: "event"
        trigger: "initialise-authentication-mechanisms"
        kind: "stated"
        guard: >-
          by other authorised methods: procedural controls, or factory-set or default authentication
          data
        quotes:
          - source_lines: "580-588"
            quote: |-
              If a cryptographic module does not contain the authentication data required to authenticate the operator for the first time the module is accessed, then other authorised methods (e.g. procedural controls or use of factory-set or default authentication data) shall be used to control access to the module and initialise the authentication mechanisms.
        constrained_by:
          - "nist-sp-800-140#R-0052"
      - id: "M03.T05"
        from: "initialised-no-role"
        to: "crypto-officer"
        trigger_kind: "event"
        trigger: "authenticate-as-crypto-officer"
        kind: "inferred"
        inferred_reason: "AS11.13 forbids only the change from another role (SA-08)."
      - id: "M03.T06"
        from: "initialised-no-role"
        to: "other-role"
        trigger_kind: "event"
        trigger: "authenticate-as-other-role"
        kind: "inferred"
        inferred_reason: "Not stated here."
      - id: "M03.T07"
        from: "other-role"
        to: "crypto-officer"
        trigger_kind: "event"
        trigger: "change-role-to-crypto-officer"
        kind: "stated"
        allowed: "no"
        quotes:
          - source_lines: "1006-1007"
            quote: |-
              Changing to the Crypto Officer state from any other role other than the Crypto Officer shall be prohibited.
          - source_lines: "1008-1009"
            quote: |-
              NOTE: The intention of this assertion is to remove/avoid privilege escalation to a Crypto Officer role.
        constrained_by:
          - "nist-sp-800-140#R-0131"
          - "nist-sp-800-140#R-0227"
      - id: "M03.T08"
        from: "crypto-officer"
        to: "initialised-no-role"
        trigger_kind: "event"
        trigger: "role-exit"
        kind: "inferred"
        inferred_reason: "Not addressed (SA-08)."
      - id: "M03.T09"
        from: "other-role"
        to: "initialised-no-role"
        trigger_kind: "event"
        trigger: "role-exit"
        kind: "inferred"
        inferred_reason: "Not addressed."
    error_states_note: "None: refused transitions (allowed no) are refusals, not states."
