note: >-
  Conventions as protocol.yaml. States are {name, meaning, kind}; error states carry error yes and
  are listed in error_states; terminal states carry terminal yes; constraints hold while in a state.
  A trigger is a work product of protocol.yaml (trigger_kind message) or an event of the events list
  (trigger_kind event). allowed no marks a transition the source forbids. guard and action are this
  file's wording; guard_ids and constrained_by are nist-sp-800-140#R-NNNN skeleton ids emitted by
  script and read back; candidates are skeleton C-ids. kind stated: the source states it; inferred:
  this model added it, with inferred_reason; basis says what a stated transition rests on where that
  is a NOTE or a cross-reading. Pass 3 added the R-ids of entries a transition's quotes carry whole
  (15 ids), each in constrained_by.
events:
  - name: "power-on"
    meaning: "The module is powered up."
    kind: "inferred"
    inferred_reason: "This document names no power-up event; ISO/IEC 19790 does."
  - name: "self-test-failed"
    meaning: "A self-test the module performs fails, as the module itself determines."
    kind: "stated"
    quotes:
      - source_lines: "996-997"
        quote: |-
          If a cryptographic module fails a self-test, the module shall enter an error state {and shall output an error indicator as specified in {ISO/IEC 19790:2012/Cor.1:2015 subclause} 7.3.3}.
  - name: "self-tests-passed"
    meaning: "The pre-operational self-tests pass."
    kind: "inferred"
    inferred_reason: "Only failure is stated."
  - name: "manual-entry-started"
    meaning: "Manual entry of SSPs or key components begins."
    kind: "inferred"
    inferred_reason: "The state is named (AS03.07); entry into it is not."
  - name: "manual-entry-completed"
    meaning: "Manual entry ends with its test passed."
    kind: "inferred"
    inferred_reason: "Not stated."
  - name: "load-started"
    meaning: "Software or firmware loading begins."
    kind: "inferred"
    inferred_reason: "The state is named (AS03.07); entry into it is not."
  - name: "load-test-passed"
    meaning: "The software/firmware load test passes."
    kind: "inferred"
    inferred_reason: "Not stated."
  - name: "zeroisation-complete"
    meaning: "The zeroise command has completed."
    kind: "stated"
    quotes:
      - source_lines: "856-857"
        quote: |-
          Following the completion of the zeroise command, the tester shall attempt to perform cryptographic operations using each of the unprotected SSPs that were stored in the module.
  - name: "environment-out-of-range"
    meaning: "Temperature or voltage leaves the normal operating range of a condition protected by EFP."
    kind: "stated"
    quotes:
      - source_lines: "698-708"
        quote: |-
          If the temperature or voltage falls outside of the cryptographic module’s normal operating range, the protection capability shall either — shutdown the module to prevent further operation, or — immediately zeroise all unprotected SSPs
      - source_lines: "714-715"
        quote: |-
          The protection features shall continuously measure these environmental conditions.
  - name: "eft-excursion"
    meaning: "Under EFT, the tested temperature or voltage passes beyond the normal range."
    kind: "stated"
    quotes:
      - source_lines: "737-748"
        quote: |-
          The temperature range to be tested shall be from a temperature within the normal operating temperature range to the lowest (i.e., coldest) temperature that either (1) shutdown the module to prevent further operation or (2) immediately zeroise all unprotected SSPs; and from a temperature within the normal operating temperature range to the highest (i.e., hottest) temperature that either (1) shuts down or goes into an error state or (2) zeroises all unprotected SSPs.
  - name: "ssp-no-longer-needed"
    meaning: "A temporarily stored SSP is no longer needed for future use."
    kind: "stated"
    quotes:
      - source_lines: "885-886"
        quote: |-
          NOTE 2 Temporarily stored SSPs and other stored values owned by the module should be zeroised when they are no longer needed for future use.
  - name: "retrieval-or-reuse-attempt"
    meaning: "An attempt to retrieve or reuse a zeroised SSP."
    kind: "stated"
    quotes:
      - source_lines: "890"
        quote: |-
          A zeroised SSP shall not be retrievable or reusable.
  - name: "access-attempt"
    meaning: "An attempt to access the module (TE04.45.02 provokes one as an error)."
    kind: "stated"
    quotes:
      - source_lines: "592-593"
        quote: |-
          TE04.45.02: If access to the module before initialisation is procedurally controlled, the tester shall initiate an error on an uninitialised module and shall verify that the module denies access.
  - name: "assume-authorised-role"
    meaning: "The authorised role is assumed under the documented procedures."
    kind: "stated"
    quotes:
      - source_lines: "594-595"
        quote: |-
          The tester shall assume the authorised role and verify that the required authentication complies with the documented procedures.
  - name: "initialise-authentication-mechanisms"
    meaning: "Other authorised methods initialise the authentication mechanisms."
    kind: "stated"
    quotes:
      - source_lines: "580-588"
        quote: |-
          If a cryptographic module does not contain the authentication data required to authenticate the operator for the first time the module is accessed, then other authorised methods (e.g. procedural controls or use of factory-set or default authentication data) shall be used to control access to the module and initialise the authentication mechanisms.
  - name: "role-assumption-attempt"
    meaning: "An attempt to assume a role other than the authorised one."
    kind: "stated"
    quotes:
      - source_lines: "595-596"
        quote: |-
          The tester shall attempt to assume other roles before the module has been initialised and verify that the module denies access to the roles.
  - name: "authenticate-as-crypto-officer"
    meaning: "An operator authenticates into the Crypto Officer role."
    kind: "inferred"
    inferred_reason: "AS11.13 constrains only changes from another role."
  - name: "authenticate-as-other-role"
    meaning: "An operator authenticates into another role."
    kind: "inferred"
    inferred_reason: "Not stated here."
  - name: "change-role-to-crypto-officer"
    meaning: "An operator in another role tries to change to the Crypto Officer state."
    kind: "stated"
    quotes:
      - source_lines: "1006-1007"
        quote: |-
          Changing to the Crypto Officer state from any other role other than the Crypto Officer shall be prohibited.
  - name: "role-exit"
    meaning: "An operator leaves its role."
    kind: "inferred"
    inferred_reason: "Not addressed (SA-08)."
machines:
  - id: "M01"
    name: "module-operational-states"
    locator: "§6.2, §6.3, §6.7, §6.9, §6.10"
    subject: >-
      The cryptographic module, in the states the modified assertions name (not ISO/IEC 19790's
      whole finite state model)
    purpose: >-
      AS03.07 names five states with data output inhibited; AS10.07 sends a failed self-test to the
      error state; AS07.77 (EFP) and AS07.81 (EFT) take an out-of-range module to shutdown or
      zeroisation, and the hot side of EFT to an error state; AS02.20 defines the approved mode.
      Entry into the named states and the return to operation are ISO/IEC 19790's and are marked
      inferred.
    initial: "powered-off"
    states:
      - name: "powered-off"
        meaning: "Before power-up."
        kind: "inferred"
        inferred_reason: "An entry state; not named here."
      - name: "pre-operational-self-test"
        meaning: "Running the pre-operational self-tests."
        kind: "stated"
        quotes:
          - source_lines: "521-523"
            quote: |-
              All data output via the “data output” interface shall be inhibited while performing manual entry, pre-operational self-tests, software/firmware loading and zeroisation; or when the cryptographic module is in an error state.
          - source_lines: "988-993"
            quote: |-
              NOTE The intention of this assertion is that the determination of pass or fail will be made by the module, without external controls, primarily for pre-operational self-tests and (conditional) cryptographic algorithm self-test. It is known that a software/firmware load test into a validated module involves the software or firmware that is loaded from an external source, and that a manual entry test involves SSPs or key components manually entered by a human operator; however, the essence is the same.
        constraints:
          - constraint: "All output through the data output interface is inhibited in this state."
            constrained_by:
              - "nist-sp-800-140#R-0039"
      - name: "operational"
        meaning: "Providing services, in an approved or a non-approved mode of operation."
        kind: "stated"
        modes:
          - mode: "approved"
            kind: "stated"
            meaning: >-
              The set of services with at least one using an approved algorithm, security function
              or process, plus the services of ISO/IEC 19790 7.4.3.
            quotes:
              - source_lines: "498-501"
                quote: |-
                  An approved mode of operation shall be defined as the set of services which include at least one service that utilises an approved cryptographic algorithm, security function or process and those services or processes specified in {ISO/IEC 19790:2012/Cor.1:2015 subclause} 7.4.3.
              - source_lines: "1044-1045"
                quote: |-
                  - procedures on how to administer the cryptographic module in an approved mode of operation; and
            constrained_by:
              - "nist-sp-800-140#R-0034"
              - "nist-sp-800-140#R-0136"
              - "nist-sp-800-140#R-0232"
            candidates:
              - "C-0067"
          - mode: "non-approved"
            kind: "stated"
            meaning: "Named beside the approved mode in AS10.01 and AS10.02; not defined here."
            quotes:
              - source_lines: "984-987"
                quote: |-
                  {All self-tests shall be performed,} and determination of pass or fail shall be made by the module, without external controls, externally provided input text test vectors, expected output results, or operator intervention or whether the module will operate in an approved or non-approved mode.
            constrained_by:
              - "nist-sp-800-140#R-0128"
        quotes:
          - source_lines: "498-501"
            quote: |-
              An approved mode of operation shall be defined as the set of services which include at least one service that utilises an approved cryptographic algorithm, security function or process and those services or processes specified in {ISO/IEC 19790:2012/Cor.1:2015 subclause} 7.4.3.
      - name: "manual-entry"
        meaning: "Manual entry of SSPs or key components."
