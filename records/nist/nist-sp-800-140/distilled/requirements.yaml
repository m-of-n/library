  - id: 'nist-sp-800-140#R-0238'
    locator: '§5.2'
    text: 'For each ISO/IEC 24759 assertion this document lists, a CST laboratory applies the TEs and VEs listed here together with that assertion''s ISO/IEC 24759 TEs and VEs that are not listed: a listed designator with a new sequence number is added to the assertion, a listed designator ISO/IEC 24759 already has is that designator as modified, and an unlisted one applies as ISO/IEC 24759 states it.'
    verb: 'none'
    kind: inferred
    candidate: 'C-0043'
    derived_from: 'R-0153; R-0154; R-0155; R-0156; R-0142; R-0032; R-0029; heading L728 (C-0043)'
    normativity: 'none'
    actor: 'vendor; CST laboratory'
    object: 'ISO/IEC 24759 assertions this document lists'
    field: 'listed TEs and VEs added or modified; unlisted ones unchanged'
    testable: 'partial'
    testable_reason: 'which listed designators are new depends on ISO/IEC 24759''s numbering (not held), and which words of a modified one are struck is lost in this rendering (SD-1)'
    note: 'No sentence says outright whether a listed TE or VE replaces ISO/IEC 24759''s or adds to them. §1 makes ISO/IEC 24759 the default and §5.2 numbers additions beyond its sequence and marks changes in place; and the document itself relies on unlisted designators staying in force: TE02.18.01 a) and VE02.18.01 a) send the tester and vendor to TE02.15.01 onward and VE02.15.01 onward, which are listed nowhere here. The one heading that reads Additional Required Test Procedures (AS07.77) says the same of its TE.'
  - id: 'nist-sp-800-140#R-0239'
    locator: '§6'
    text: 'An assertion applies to a module only at the security levels its heading names (AS06.11 at Level 2, AS07.81 and AS09.23 at Level 3, AS07.26 and AS07.77 at Levels 3 and 4, AS04.45, AS04.54 and AS09.30 at Levels 2, 3 and 4, the other 14 at all four); a module validated at another level is not tested against it.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0163; R-0169; R-0173; R-0176; R-0178; R-0179; R-0187; R-0192; R-0198; R-0211; R-0216; R-0226; R-0228; R-0039; R-0046; R-0062; R-0069; R-0088; R-0127; R-0128; R-0131; R-0136'
    normativity: 'none'
    actor: 'CST laboratory'
    object: 'assertion applicability'
    field: 'the security levels the heading names'
    testable: 'yes'
    note: 'Each heading reads (title – Levels ...); the levels are FIPS 140-3''s four. Every entry under an assertion carries its heading''s levels as levels, set by script.'
  - id: 'nist-sp-800-140#R-0240'
    locator: '§6.10'
    text: 'A clause in braces within an assertion''s text belongs to the ISO/IEC 19790 sentence the assertion quotes but is not tested under that assertion: AS10.01 and AS10.02 quote one sentence, each bracing the half the other leaves unbraced; a braced reference, as in AS02.20 and AS10.07, names the ISO/IEC 19790 subclause a clause points to.'
    verb: 'none'
    kind: inferred
    derived_from: 'R-0127; R-0128; R-0224; R-0088; R-0129; R-0034'
    normativity: 'none'
    actor: 'CST laboratory'
    object: 'braced text in assertions'
    field: 'not tested under the assertion that braces it'
    testable: 'partial'
    testable_reason: 'the document does not define the notation; it follows the ISO/IEC 24759 format (§5.2), not held, and the braced clauses of AS09.23 and AS10.07 have no unbraced counterpart here'
    note: 'The AS10.01/AS10.02 pair is the only evidence in this document; the reading of the other braces follows from it.'
