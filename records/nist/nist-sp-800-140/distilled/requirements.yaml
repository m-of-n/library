note: 'Ids are stable and never reused; cite as nist-sp-800-140#R-NNNN. R-0001 to R-0139 are the bin/fx1-skeleton sentences in source order. R-0140 to R-0237 were appended by pass 1 in source order: split_of children of multi-form or multi-sentence texts, keyword-less candidates promoted with candidate: C-NNNN, and hunted binding text no candidate caught (assertion headings, list items, test-routing NOTEs, the four No change. clauses), every text cut from the source by script and never typed. R-0238 to R-0242 are kind: inferred, in our words, each with derived_from. assertion, levels and modifies are set by script from the source: assertion is the ISO/IEC 24759 assertion heading the entry falls under, levels the security levels that heading names, and modifies the TE, VE or AS designator whose text the entry is part of (for a No change. clause, the ISO/IEC 24759 clause). Whether a designator is added or changed is not recoverable from this rendering (SD-1). After the reader fix of library#137 the eight skeleton texts the mid-page sidebar had cut short were re-cut to their whole sentences, same ids, and the seven tails pass 1 had cut as hunted entries became their split_of children, same ids. normativity is the ISO/IEC Directives category of the verbal form (shall and must requirement, should recommendation, may and need not permission, can and cannot possibility, none for verb none), except where the form says something else, which normativity_reason gives. A parent with several different forms keeps the strongest (the first, between forms of one category) and each other form has a split_of child; a form repeated within one sentence gets no child of its own, except in R-0001, whose two shalls bind vendors and laboratories. actor, object and field are our labels, in the source''s vocabulary where it has one; they quote nothing (text does, and a quoted fragment in a note or reason is in single quotes and verbatim). testable_reason explains every partial and no. SD-n and TD-n name a source or tooling defect in normative.md.'
