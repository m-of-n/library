  - name: 'EnvironmentalProtectionStatement'
    locator: '§6.7'
    kind: 'derived structure'
    encoding: 'JSON object; derived_schema validates it'
    derived_schema: 'schema/EnvironmentalProtectionStatement.derived.schema.json'
    title: 'VE07.77.01/02 and VE07.81.01/02: which EFP or EFT approach was chosen and the ranges met'
    source_lines: '712-726'
    quote: 'VE07.77.01: If EFP is chosen for a particular condition, the module shall monitor and correctly respond to fluctuations in the operating temperature or voltage outside of the module’s normal operating range for that condition. The protection features shall continuously measure these environmental conditions. If a condition is determined to be outside of the module’s normal operating range, the protection circuitry shall either a) shutdown the module, or b) zeroise all plaintext unprotected SSPs Documentation shall state which of these approaches was chosen and provide a specification description of the EFP features implemented within the module. VE07.77.02: The security policy shall address whether the employed EFP feature forces module shutdown or zeroises all unprotected SSPs and shall specify the temperature range met.'
    constrained_by:
      - 'nist-sp-800-140#R-0075'
      - 'nist-sp-800-140#R-0076'
      - 'nist-sp-800-140#R-0080'
      - 'nist-sp-800-140#R-0083'
      - 'nist-sp-800-140#R-0086'
      - 'nist-sp-800-140#R-0079'
      - 'nist-sp-800-140#R-0085'
      - 'nist-sp-800-140#R-0081'
      - 'nist-sp-800-140#R-0087'
    fields:
      - name: 'feature'
        type: 'enum ["EFP", "EFT"]'
        required: true
        level: 'shall'
        constrained_by:
          - 'nist-sp-800-140#R-0076'
          - 'nist-sp-800-140#R-0083'
      - name: 'response'
        type: 'enum ["shutdown", "zeroise_plaintext_unprotected_ssps", "continue_to_operate_normally"]'
        required: true
        level: 'shall'
        constrained_by:
          - 'nist-sp-800-140#R-0076'
          - 'nist-sp-800-140#R-0078'
          - 'nist-sp-800-140#R-0190'
          - 'nist-sp-800-140#R-0191'
          - 'nist-sp-800-140#R-0083'
          - 'nist-sp-800-140#R-0084'
          - 'nist-sp-800-140#R-0193'
          - 'nist-sp-800-140#R-0194'
          - 'nist-sp-800-140#R-0195'
        note: 'EFP: shutdown or zeroise (a, b); EFT adds ''continue to operate normally'' (a, b, c); the schema rejects continue for EFP'
      - name: 'approach_chosen_and_feature_described'
        type: 'string'
        required: true
        level: 'shall'
        constrained_by:
          - 'nist-sp-800-140#R-0079'
          - 'nist-sp-800-140#R-0085'
        note: '''Documentation shall state which of these approaches was chosen and provide a specification description'''
      - name: 'temperature_range_met'
        type: 'string'
        required: true
        level: 'shall'
        constrained_by:
          - 'nist-sp-800-140#R-0080'
          - 'nist-sp-800-140#R-0086'
      - name: 'normal_operating_temperature_range'
        type: 'string'
        required: true
        level: 'stated'
        constrained_by:
          - 'nist-sp-800-140#R-0081'
          - 'nist-sp-800-140#R-0087'
        source_lines: '730-733'
        quote: 'TE07.77.04 The tester shall verify that the security policy specifies the normal operating temperature and voltage range, and whether the module shuts down or zeroises all unprotected SSPs if the operating temperature or voltage falls outside the normal operating range of the module.'
      - name: 'normal_operating_voltage_range'
        type: 'string'
        required: true
        level: 'stated'
        constrained_by:
          - 'nist-sp-800-140#R-0081'
          - 'nist-sp-800-140#R-0087'
        source_lines: '730-733'
        quote: 'TE07.77.04 The tester shall verify that the security policy specifies the normal operating temperature and voltage range, and whether the module shuts down or zeroises all unprotected SSPs if the operating temperature or voltage falls outside the normal operating range of the module.'
    layout: 'one JSON object'
