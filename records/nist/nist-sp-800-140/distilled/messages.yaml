    title: 'VE09.23.01/02: split knowledge procedure documentation'
    source_lines: '791-802'
    quote: 'VE09.23.01: The vendor documentation shall specify the number of components that are required to construct the original CSP. VE09.23.02: If knowledge of the number of key components is required to reconstruct the original key, the vendor provided documentation shall include rationale stating how knowledge of any one less than the number of key components provides no information about the original key other than the length.'
