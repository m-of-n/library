        required: true
        level: 'stated'
        constrained_by:
          - 'nist-sp-800-140#R-0041'
        source_lines: '535-537'
        quote: 'VE03.07.04: If the physical and logical paths followed by the output data and SSP information are physically shared, the vendor documentation shall specify how the cryptographic module enforces logical separation of the output data and SSP information.'
