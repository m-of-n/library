          - 'nist-sp-800-140#R-0089'
          - 'nist-sp-800-140#R-0091'
        note: '''at least two key components shall be required to reconstruct the original cryptographic key'' (AS09.23): minimum 2'
      - name: 'rationale_fewer_components_reveal_nothing_but_length'
        type: 'string'
        required: false
        level: 'shall'
        constrained_by:
          - 'nist-sp-800-140#R-0090'
        note: 'required when knowledge of the number of components is required to reconstruct the key'
