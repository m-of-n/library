gaps:
  - "AIModel as a first-class Component subtype with weights, configuration parameters, reward model and adaptation layers as separately protected sub-artifacts — tmodel has generic Component only."
  - "Dataset purpose (training/testing/fine-tuning/aligning) and a three-valued provenance state (known / unknown-documented / not tracked) — tmodel classification covers sensitivity, not purpose or provenance-unknown."
  - "DevelopmentEnvironment (incl. AI model training environment) as distinct from deployment Environment (§3) — tmodel has no build/dev-environment node, yet PO.5 makes it a protected asset."
  - "Responsibility edge Party→Requirement (who is responsible for which task across producer/integrator/acquirer) and the SharedResponsibilityAgreement that carries it — needed for R-041/R-042 conformance across organizations."
  - "Profile membership with per-profile attributes (Priority, ProfileStatus) on the (Profile, Requirement) edge — DL-0009 Requirement has no notion of a tailored overlay."
  - "Normativity levels below 'recommendation' (consideration, informative note) on Requirement — needed to keep C items out of hard gate criteria."
  - "Model usage state (in use / stopped / rolled back) implied by RV.2.2.R2 — no ProductInstance-level operational state machine in tmodel (§3b defers state machines)."
  - "Re-verification triggers (retraining, new data sources: PW.8.2.R2; future versions/derivatives: PW.1.1.C1) — tmodel has no event that invalidates a prior Review/approval."
  - "Identifier namespace collision: sp-800-218a#PW.3.x vs SSDF 1.1 retired PW.3.x — the crosswalk must key on (record, native id)."
