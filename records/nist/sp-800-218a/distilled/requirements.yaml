  (incl. footnote 2) and §3 (R-0001..R-0014) = 168 entries. Lowercase modal baseline in pdftotext: should=36, shall=1,
  must=1, may=24. The 1 "shall" and 3 "should" are FISMA/authority/feedback boilerplate (front matter, not
  extracted); 1 "should" is predictive, not normative (§2: "Following SSDF practices should help AI model
  producers reduce the number of vulnerabilities ...", not extracted); 2 "should" are the §3 R/C definitions
  (captured in normative.md, not as requirements); 1 "should" is the §1 Purpose example quoting PS.1.1.R1 ("Secure code storage should include ...",
  a duplicate, carried by PS.1.1.R1); the "must" is in PO.3.1 task text (extracted). The other 29
  "should" occurrences are inside extracted texts (36 = 3 + 1 + 2 + 1 + 29) (verify pass 2026-10-02 re-classified this residue; it
  previously said 4 boilerplate and claimed bin/validate rejects source_keyword_count 0, which it does not
  when a reconciliation is present).
