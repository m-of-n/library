note: >
  Ids are stable and never reused; cite as sp-800-218a#<native id>. Native ids are the Profile's own: practice
  (PO.1), task (PO.1.1), addition (PO.1.2.R1 / .C1 / .N1 — the §3 convention "An R, C, or N designation and its
  number can be appended to the task ID to create a unique identifier"). Prose statements use R-NNNN.
  WARNING: PW.3, PW.3.1, PW.3.2 are identifiers that SSDF 1.1 RETIRED (moved to PW.4/PO.1.3/PW.4.4); this
  Profile reuses them with new meaning (data integrity). Always namespace: sp-800-218a#PW.3.1 != sp-800-218#PW.3.1.
  normativity: R items = recommendation ("something the organization should do", §3); C = consideration
  ("something the organization should consider doing"); N = informative note. Tasks/practices = recommendation
  (inherited SSDF status; the Profile states practices/tasks are "a starting point", §2). Priority is the
  Profile's own field. DERIVED fields (phase, nature, short_title, expects_deliverables, verification, testable)
  are this extraction's judgement and need human review; text is verbatim. maps_to = the Informative References
  column, ids in the source's own spelling (AI RMF function+subcategory, OWASP LLM Top 10 v1.1 ids, "Adv ML" =
  NIST AI 100-2e2023 cited without section).
