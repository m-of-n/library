usefulness:
  verdict: useful
  reason: "The only NIST SSDF Community Profile: it shows the overlay mechanism (priority + R/C/N additions + modified/new tasks over a base requirement set) that the R-044 crosswalk and R-042 conformance need, and it supplies the AI-specific threat types and artifacts (weights, datasets, training pipelines) that a threat model of an AI system has to cover."
