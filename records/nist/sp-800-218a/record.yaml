distillation:
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "Every statement of Table 1 (§3) verbatim — 4 group rows, 20 practices, 48 tasks with Priority, all 86 R/C/N additions, the 10 'No additions to SSDF 1.1' markers and every Informative References cell — plus 14 governing prose statements (Abstract, §1, §2 incl. footnote 2, §3), the §3 column semantics and the 9 Appendix A glossary definitions. Excludes FISMA/authority boilerplate, acknowledgements and the reference list (cites in record.yaml)."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "168 entries: 14 prose (R-0001..R-0014), 20 practices, 48 tasks, 86 additions (59 R / 16 C / 11 N) under native ids; library-requirements/v2 typing (normativity, actor, nature, phase, expects_deliverables, verification, testable); Priority, profile_status, SSDF 1.1 text for every modified/new/changed item; maps_to = Informative References (AI RMF / OWASP / Adv ML) parsed per id. Not a BCP 14 document: source_keyword_count 0 with native-count reconciliation. Derived fields need review."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "16 adopt/adapt/defer/reject items mapped to R-040..R-044, DEC-009, ARCH-0001 §0-§5, ADR-0001; 4 source defects/traps (PW.3 retired-id reuse, untagged PO.5.2 change, PO.1 expansion, EO 14110 revoked; a claimed PS group rename was withdrawn by the verify pass); 4 open questions."
      reviewed_by: ""
    - kind: diagram
      path: distilled/object-model.yaml
      coverage: "object-model pass: 62 objects (61 stated, 1 inferred) and 52 edges (50 stated, 2 inferred), each with locator and tmodel_mapping; 9 gaps tmodel lacks"
      reviewed_by: ""
    - kind: diagram
      path: distilled/object-model.md
      coverage: "Mermaid class diagram of the principal objects/edges and the five headline findings; generated_from object-model.yaml"
      generated_from: distilled/object-model.yaml
      reviewed_by: ""
  not_applicable:
    - kind: schema
      reason: "SP 800-218A defines no data format, schema or structured record; Table 1 is a practice catalogue whose structure is captured as requirements.yaml fields (priority, additions, maps_to). SBOM/SLSA are only named (PS.3.2), not specified."
    - kind: messages
      reason: "No messages, headers or wire structures are defined; the Profile specifies organizational practices, not an exchange."
    - kind: protocol
      reason: "No protocol between parties is defined; the §2 shared-responsibility agreement and attestation are named but their content, sequence and format are left to the parties."
    - kind: state-machine
      reason: "No lifecycle with states and transitions is defined. RV.2.2.R2 (criteria for when to stop using an AI model and roll back to a previous version) implies model usage states, but the source gives no states, triggers or guards; inventing them would violate the no-invented-requirements rule. Recorded as gap 7 in object-model.yaml and design-notes item 13."
    - kind: examples
      reason: "The Profile has no Implementation Examples column (§3: NIST 'is also considering adding a column for Implementation Examples in a future version'), no test vectors and no worked examples; SSDF 1.1 notional implementation examples are inherited and held in sp-800-218."
