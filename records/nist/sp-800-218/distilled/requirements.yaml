    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: design
    locator: "§2 Table 1, practice PW.1"
    short_title: "Design Software to Meet Security Requirements and Mitigate Security Risks"
    text: "Design Software to Meet Security Requirements and Mitigate Security Risks (PW.1): Identify and evaluate the security requirements for the software; determine what security risks the software is likely to face during operation and how the software’s design and architecture should mitigate those risks; and justify any cases where risk-based analysis indicates that security requirements should be relaxed or waived. Addressing security requirements and risks during software design (secure by design) is key for improving software security and also helps improve development efficiency."
    tasks:
      - PW.1.1
      - PW.1.2
      - PW.1.3
