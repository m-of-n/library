  - id: "sp-800-218#PO.4.1"
    designator: PO.4.1
    level: task
    group: PO
    practice: PO.4
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: deliverable
    phase: governance
    locator: "§2 Table 1, practice PO.4, task PO.4.1"
    short_title: "Define and track software security check criteria"
    text: "PO.4.1: Define criteria for software security checks and track throughout the SDLC."
    notional_implementation_examples:
      - id: "PO.4.1/E1"
        text: "Example 1: Ensure that the criteria adequately indicate how effectively security risk is being managed."
      - id: "PO.4.1/E2"
        text: "Example 2: Define key performance indicators (KPIs), key risk indicators (KRIs), vulnerability severity scores, and other measures for software security."
      - id: "PO.4.1/E3"
        text: "Example 3: Add software security criteria to existing checks (e.g., the Definition of Done in agile SDLC methodologies)."
      - id: "PO.4.1/E4"
        text: "Example 4: Review the artifacts generated as part of the software development workflow system to determine if they meet the criteria."
      - id: "PO.4.1/E5"
        text: "Example 5: Record security check approvals, rejections, and exception requests as part of the workflow and tracking system."
      - id: "PO.4.1/E6"
        text: "Example 6: Analyze collected data in the context of the security successes and failures of each development project, and use the results to improve the SDLC."
