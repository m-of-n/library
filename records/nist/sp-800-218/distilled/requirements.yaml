  - id: "sp-800-218#RV.2.2"
    designator: RV.2.2
    level: task
    group: RV
    practice: RV.2
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: deliverable
    phase: operations/response
    locator: "§2 Table 1, practice RV.2, task RV.2.2"
    short_title: "Plan and implement risk responses"
    text: "RV.2.2: Plan and implement risk responses for vulnerabilities."
    notional_implementation_examples:
      - id: "RV.2.2/E1"
        text: "Example 1: Make a risk-based decision as to whether each vulnerability will be remediated or if the risk will be addressed through other means (e.g., risk acceptance, risk transference), and prioritize any actions to be taken."
      - id: "RV.2.2/E2"
        text: "Example 2: If a permanent mitigation for a vulnerability is not yet available, determine how the vulnerability can be temporarily mitigated until the permanent solution is available, and add that temporary remediation to the plan."
      - id: "RV.2.2/E3"
        text: "Example 3: Develop and release security advisories that provide the necessary information to software acquirers, including descriptions of what the vulnerabilities are, how to find instances of the vulnerable software, and how to address them (e.g., where to get patches and what the patches change in the software; what configuration settings may need to be changed; how temporary workarounds could be implemented)."
      - id: "RV.2.2/E4"
        text: "Example 4: Deliver remediations to acquirers via an automated and trusted delivery mechanism. A single remediation could address multiple vulnerabilities."
      - id: "RV.2.2/E5"
        text: "Example 5: Update records of design decisions, risk responses, and approved exceptions as needed. See PW.1.2."
