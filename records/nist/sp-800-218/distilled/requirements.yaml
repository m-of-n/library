  - id: "sp-800-218#PW.6.2"
    designator: PW.6.2
    level: task
    group: PW
    practice: PW.6
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: deliverable
    phase: implementation
    locator: "§2 Table 1, practice PW.6, task PW.6.2"
    short_title: "Define, implement and use approved build-tool configurations"
    text: "PW.6.2: Determine which compiler, interpreter, and build tool features should be used and how each should be configured, then implement and use the approved configurations."
    notional_implementation_examples:
      - id: "PW.6.2/E1"
        text: "Example 1: Enable compiler features that produce warnings for poorly secured code during the compilation process."
      - id: "PW.6.2/E2"
        text: "Example 2: Implement the “clean build” concept, where all compiler warnings are treated as errors and eliminated except those determined to be false positives or irrelevant."
      - id: "PW.6.2/E3"
        text: "Example 3: Perform all builds in a dedicated, highly controlled build environment."
      - id: "PW.6.2/E4"
        text: "Example 4: Enable compiler features that randomize or obfuscate execution characteristics, such as memory location usage, that would otherwise be predictable and thus potentially exploitable."
      - id: "PW.6.2/E5"
        text: "Example 5: Test to ensure that the features are working as expected and are not inadvertently causing any operational issues or other problems."
      - id: "PW.6.2/E6"
        text: "Example 6: Continuously verify that the approved configurations are being used."
      - id: "PW.6.2/E7"
        text: "Example 7: Make the approved tool configurations available as configuration-as-code so developers can readily use them."
