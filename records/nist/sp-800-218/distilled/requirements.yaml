    status: active
  - id: "sp-800-218#PO.5.1"
    designator: PO.5.1
    level: task
    group: PO
    practice: PO.5
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: implementation
    locator: "§2 Table 1, practice PO.5, task PO.5.1"
    short_title: "Separate and protect development environments"
    text: "PO.5.1: Separate and protect each environment involved in software development."
    notional_implementation_examples:
      - id: "PO.5.1/E1"
        text: "Example 1: Use multi-factor, risk-based authentication and conditional access for each environment."
      - id: "PO.5.1/E2"
        text: "Example 2: Use network segmentation and access controls to separate the environments from each other and from production environments, and to separate components from each other within each non-production environment, in order to reduce attack surfaces and attackers’ lateral movement and privilege/access escalation."
      - id: "PO.5.1/E3"
        text: "Example 3: Enforce authentication and tightly restrict connections entering and exiting each software development environment, including minimizing access to the internet to only what is necessary."
      - id: "PO.5.1/E4"
        text: "Example 4: Minimize direct human access to toolchain systems, such as build services. Continuously monitor and audit all access attempts and all use of privileged access."
      - id: "PO.5.1/E5"
        text: "Example 5: Minimize the use of production-environment software and services from non-production environments."
      - id: "PO.5.1/E6"
        text: "Example 6: Regularly log, monitor, and audit trust relationships for authorization and access between the environments and between the components within each environment."
      - id: "PO.5.1/E7"
        text: "Example 7: Continuously log and monitor operations and alerts across all components of the development environment to detect, respond, and recover from attempted and actual cyber incidents."
      - id: "PO.5.1/E8"
        text: "Example 8: Configure security controls and other tools involved in separating and protecting the environments to generate artifacts for their activities."
      - id: "PO.5.1/E9"
        text: "Example 9: Continuously monitor all software deployed in each environment for new vulnerabilities, and respond to vulnerabilities appropriately following a risk-based approach."
      - id: "PO.5.1/E10"
        text: "Example 10: Configure and implement measures to secure the environments’ hosting infrastructures following a zero trust architecture."
    maps_to:
      - scheme: BSAFSS
        ids:
          - "DE.1"
          - "IA.1"
          - "IA.2"
        source_text: "BSAFSS: DE.1, IA.1, IA.2"
