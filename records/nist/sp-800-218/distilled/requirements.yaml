  - id: "sp-800-218#PW.5.1"
    designator: PW.5.1
    level: task
    group: PW
    practice: PW.5
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: implementation
    locator: "§2 Table 1, practice PW.5, task PW.5.1"
    short_title: "Follow secure coding practices"
    text: "PW.5.1: Follow all secure coding practices that are appropriate to the development languages and environment to meet the organization’s requirements."
    notional_implementation_examples:
      - id: "PW.5.1/E1"
        text: "Example 1: Validate all inputs, and validate and properly encode all outputs."
      - id: "PW.5.1/E2"
        text: "Example 2: Avoid using unsafe functions and calls."
      - id: "PW.5.1/E3"
        text: "Example 3: Detect errors, and handle them gracefully."
      - id: "PW.5.1/E4"
        text: "Example 4: Provide logging and tracing capabilities."
      - id: "PW.5.1/E5"
        text: "Example 5: Use development environments with automated features that encourage or require the use of secure coding practices with just-in-time training-in-place."
      - id: "PW.5.1/E6"
        text: "Example 6: Follow procedures for manually ensuring compliance with secure coding practices when automated methods are insufficient or unavailable."
      - id: "PW.5.1/E7"
        text: "Example 7: Use tools (e.g., linters, formatters) to standardize the style and formatting of the source code."
      - id: "PW.5.1/E8"
        text: "Example 8: Check for other vulnerabilities that are common to the development languages and environment."
      - id: "PW.5.1/E9"
        text: "Example 9: Have the developer review their own human-readable code to complement (not replace) code review performed by other people or tools. See PW.7."
