  - id: "sp-800-218#PW.8.2"
    designator: PW.8.2
    level: task
    group: PW
    practice: PW.8
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: deliverable
    phase: verification
    locator: "§2 Table 1, practice PW.8, task PW.8.2"
    short_title: "Scope, design, perform and document security testing"
    text: "PW.8.2: Scope the testing, design the tests, perform the testing, and document the results, including recording and triaging all discovered issues and recommended remediations in the development team’s workflow or issue tracking system."
    notional_implementation_examples:
      - id: "PW.8.2/E1"
        text: "Example 1: Perform robust functional testing of security features."
      - id: "PW.8.2/E2"
        text: "Example 2: Integrate dynamic vulnerability testing into the project’s automated test suite."
      - id: "PW.8.2/E3"
        text: "Example 3: Incorporate tests for previously reported vulnerabilities into the project’s test suite to ensure that errors are not reintroduced."
      - id: "PW.8.2/E4"
        text: "Example 4: Take into consideration the infrastructures and technology stacks that the software will be used with in production when developing test plans."
      - id: "PW.8.2/E5"
        text: "Example 5: Use fuzz testing tools to find issues with input handling."
      - id: "PW.8.2/E6"
        text: "Example 6: If resources are available, use penetration testing to simulate how an attacker might attempt to compromise the software in high-risk scenarios."
      - id: "PW.8.2/E7"
        text: "Example 7: Identify and record the root causes of discovered issues."
      - id: "PW.8.2/E8"
        text: "Example 8: Document lessons learned from code testing in a wiki that developers can access and search."
      - id: "PW.8.2/E9"
        text: "Example 9: Use source code, design records, and other resources when developing test plans."
