  - id: "sp-800-218#PO.1"
    designator: PO.1
    level: practice
    group: PO
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: governance
    locator: "§2 Table 1, practice PO.1"
    short_title: "Define Security Requirements for Software Development"
    text: "Define Security Requirements for Software Development (PO.1): Ensure that security requirements for software development are known at all times so that they can be taken into account throughout the SDLC and duplication of effort can be minimized because the requirements information can be collected once and shared. This includes requirements from internal sources (e.g., the organization’s policies, business objectives, and risk management strategy) and external sources (e.g., applicable laws and regulations)."
    tasks:
      - PO.1.1
      - PO.1.2
      - PO.1.3
    expects_deliverables: []
    verification: "satisfied when its tasks are satisfied (outcome-based; the SSDF does not define practice-level conformance)"
    kind: stated
    testable: no
    notes: "Practice = name + identifier + explanation of what the practice is and why it is beneficial (§2)."
    status: active
  - id: "sp-800-218#PO.1.1"
    designator: PO.1.1
    level: task
    group: PO
    practice: PO.1
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: deliverable
    phase: governance
    locator: "§2 Table 1, practice PO.1, task PO.1.1"
    short_title: "Document security requirements for development infrastructures and processes"
    text: "PO.1.1: Identify and document all security requirements for the organization’s software development infrastructures and processes, and maintain the requirements over time."
    notional_implementation_examples:
      - id: "PO.1.1/E1"
        text: "Example 1: Define policies for securing software development infrastructures and their components, including development endpoints, throughout the SDLC and maintaining that security."
      - id: "PO.1.1/E2"
        text: "Example 2: Define policies for securing software development processes throughout the SDLC and maintaining that security, including for open-source and other third-party software components utilized by software being developed."
      - id: "PO.1.1/E3"
        text: "Example 3: Review and update security requirements at least annually, or sooner if there are new requirements from internal or external sources, or a major security incident targeting software development infrastructure has occurred."
      - id: "PO.1.1/E4"
        text: "Example 4: Educate affected individuals on impending changes to requirements."
