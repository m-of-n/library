  - id: "sp-800-218#PW.4"
    designator: PW.4
    level: practice
    group: PW
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: supply-chain
    locator: "§2 Table 1, practice PW.4"
    short_title: "Reuse Existing, Well-Secured Software When Feasible Instead of Duplicating Functionality"
    text: "Reuse Existing, Well-Secured Software When Feasible Instead of Duplicating Functionality (PW.4): Lower the costs of software development, expedite software development, and decrease the likelihood of introducing additional security vulnerabilities into the software by reusing software modules and services that have already had their security posture checked. This is particularly important for software that implements security functionality, such as cryptographic modules and protocols."
    tasks:
      - PW.4.1
      - PW.4.2
      - PW.4.4
    expects_deliverables: []
    verification: "satisfied when its tasks are satisfied (outcome-based; the SSDF does not define practice-level conformance)"
    kind: stated
    testable: no
    notes: "Practice = name + identifier + explanation of what the practice is and why it is beneficial (§2)."
    status: active
  - id: "sp-800-218#PW.4.1"
    designator: PW.4.1
    level: task
    group: PW
    practice: PW.4
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: supply-chain
    locator: "§2 Table 1, practice PW.4, task PW.4.1"
    short_title: "Acquire and maintain well-secured third-party components"
    text: "PW.4.1: Acquire and maintain well-secured software components (e.g., software libraries, modules, middleware, frameworks) from commercial, open-source, and other third-party developers for use by the organization’s software."
    notional_implementation_examples:
      - id: "PW.4.1/E1"
        text: "Example 1: Review and evaluate third-party software components in the context of their expected use. If a component is to be used in a substantially different way in the future, perform the review and evaluation again with that new context in mind."
      - id: "PW.4.1/E2"
        text: "Example 2: Determine secure configurations for software components, and make these available (e.g., as configuration-as-code) so developers can readily use the configurations."
      - id: "PW.4.1/E3"
        text: "Example 3: Obtain provenance information (e.g., SBOM, source composition analysis, binary software composition analysis) for each software component, and analyze that information to better assess the risk that the component may introduce."
      - id: "PW.4.1/E4"
        text: "Example 4: Establish one or more software repositories to host sanctioned and vetted open-source components."
      - id: "PW.4.1/E5"
        text: "Example 5: Maintain a list of organization-approved commercial software components and component versions along with their provenance data."
      - id: "PW.4.1/E6"
        text: "Example 6: Designate which components must be included in software to be developed."
      - id: "PW.4.1/E7"
        text: "Example 7: Implement processes to update deployed software components to newer versions, and retain older versions of software components until all transitions from those versions have been completed successfully."
      - id: "PW.4.1/E8"
        text: "Example 8: If the integrity or provenance of acquired binaries cannot be confirmed, build binaries from source code after verifying the source code’s integrity and provenance."
    maps_to:
      - scheme: BSAFSS
        ids:
          - "SM.2"
        source_text: "BSAFSS: SM.2"
