  - id: "sp-800-218#PO.5.2"
    designator: PO.5.2
    level: task
    group: PO
    practice: PO.5
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: implementation
    locator: "§2 Table 1, practice PO.5, task PO.5.2"
    short_title: "Secure and harden development endpoints"
    text: "PO.5.2: Secure and harden development endpoints (i.e., endpoints for software designers, developers, testers, builders, etc.) to perform development-related tasks using a risk-based approach."
    notional_implementation_examples:
      - id: "PO.5.2/E1"
        text: "Example 1: Configure each development endpoint based on approved hardening guides, checklists, etc.; for example, enable FIPS-compliant encryption of all sensitive data at rest and in transit."
      - id: "PO.5.2/E2"
        text: "Example 2: Configure each development endpoint and the development resources to provide the least functionality needed by users and services and to enforce the principle of least privilege."
      - id: "PO.5.2/E3"
        text: "Example 3: Continuously monitor the security posture of all development endpoints, including monitoring and auditing all use of privileged access."
      - id: "PO.5.2/E4"
        text: "Example 4: Configure security controls and other tools involved in securing and hardening development endpoints to generate artifacts for their activities."
      - id: "PO.5.2/E5"
        text: "Example 5: Require multi-factor authentication for all access to development endpoints and development resources."
      - id: "PO.5.2/E6"
        text: "Example 6: Provide dedicated development endpoints on non-production networks for performing all development-related tasks. Provide separate endpoints on production networks for all other tasks."
      - id: "PO.5.2/E7"
        text: "Example 7: Configure each development endpoint following a zero trust architecture."
