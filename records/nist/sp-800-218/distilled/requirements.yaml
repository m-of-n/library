  - id: "sp-800-218#PW.4.2"
    designator: PW.4.2
    level: task
    group: PW
    practice: PW.4
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: implementation
    locator: "§2 Table 1, practice PW.4, task PW.4.2"
    short_title: "Create and maintain well-secured in-house components"
    text: "PW.4.2: Create and maintain well-secured software components in-house following SDLC processes to meet common internal software development needs that cannot be better met by third-party software components."
    notional_implementation_examples:
      - id: "PW.4.2/E1"
        text: "Example 1: Follow organization-established security practices for secure software development when creating and maintaining the components."
      - id: "PW.4.2/E2"
        text: "Example 2: Determine secure configurations for software components, and make these available (e.g., as configuration-as-code) so developers can readily use the configurations."
      - id: "PW.4.2/E3"
        text: "Example 3: Maintain one or more software repositories for these components."
      - id: "PW.4.2/E4"
        text: "Example 4: Designate which components must be included in software to be developed."
      - id: "PW.4.2/E5"
        text: "Example 5: Implement processes to update deployed software components to newer versions, and maintain older versions of software components until all transitions from those versions have been completed successfully."
