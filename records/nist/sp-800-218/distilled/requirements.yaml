    text: "PO.3.2: Follow recommended security practices to deploy, operate, and maintain tools and toolchains."
    notional_implementation_examples:
      - id: "PO.3.2/E1"
        text: "Example 1: Evaluate, select, and acquire tools, and assess the security of each tool."
      - id: "PO.3.2/E2"
        text: "Example 2: Integrate tools with other tools and existing software development processes and workflows."
      - id: "PO.3.2/E3"
        text: "Example 3: Use code-based configuration for toolchains (e.g., pipelines-as-code, toolchains-as-code)."
      - id: "PO.3.2/E4"
        text: "Example 4: Implement the technologies and processes needed for reproducible builds."
      - id: "PO.3.2/E5"
        text: "Example 5: Update, upgrade, or replace tools as needed to address tool vulnerabilities or add new tool capabilities."
      - id: "PO.3.2/E6"
        text: "Example 6: Continuously monitor tools and tool logs for potential operational and security issues, including policy violations and anomalous behavior."
      - id: "PO.3.2/E7"
        text: "Example 7: Regularly verify the integrity and check the provenance of each tool to identify potential problems."
      - id: "PO.3.2/E8"
        text: "Example 8: See PW.6 regarding compiler, interpreter, and build tools."
      - id: "PO.3.2/E9"
        text: "Example 9: See PO.5 regarding implementing and maintaining secure environments."
