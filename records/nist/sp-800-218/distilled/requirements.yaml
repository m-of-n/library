    kind: stated
    testable: no
    notes: "Practice = name + identifier + explanation of what the practice is and why it is beneficial (§2)."
    status: active
  - id: "sp-800-218#PW.1.1"
    designator: PW.1.1
    level: task
    group: PW
    practice: PW.1
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: deliverable
    phase: design
    locator: "§2 Table 1, practice PW.1, task PW.1.1"
    short_title: "Perform risk modeling (threat modeling, attack modeling, attack surface mapping)"
    text: "PW.1.1: Use forms of risk modeling – such as threat modeling, attack modeling, or attack surface mapping – to help assess the security risk for the software."
    notional_implementation_examples:
      - id: "PW.1.1/E1"
        text: "Example 1: Train the development team (security champions, in particular) or collaborate with a risk modeling expert to create models and analyze how to use a risk-based approach to communicate the risks and determine how to address them, including implementing mitigations."
      - id: "PW.1.1/E2"
        text: "Example 2: Perform more rigorous assessments for high-risk areas, such as protecting sensitive data and safeguarding identification, authentication, and access control, including credential management."
      - id: "PW.1.1/E3"
        text: "Example 3: Review vulnerability reports and statistics for previous software to inform the security risk assessment."
      - id: "PW.1.1/E4"
        text: "Example 4: Use data classification methods to identify and characterize each type of data that the software will interact with."
