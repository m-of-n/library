        text: "Example 2: Determine secure configurations for modules for supporting standardized security features and services, and make these configurations available (e.g., as configuration-as-code) so developers can readily use them."
      - id: "PW.1.3/E3"
        text: "Example 3: Define criteria for which security features and services must be supported by software to be developed."
