  - id: "sp-800-218#PO.2.3"
    designator: PO.2.3
    level: task
    group: PO
    practice: PO.2
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: governance
    locator: "§2 Table 1, practice PO.2, task PO.2.3"
    short_title: "Obtain and convey management commitment"
    text: "PO.2.3: Obtain upper management or authorizing official commitment to secure development, and convey that commitment to all with development-related roles and responsibilities."
    notional_implementation_examples:
      - id: "PO.2.3/E1"
        text: "Example 1: Appoint a single leader or leadership team to be responsible for the entire secure software development process, including being accountable for releasing software to production and delegating responsibilities as appropriate."
      - id: "PO.2.3/E2"
        text: "Example 2: Increase authorizing officials’ awareness of the risks of developing software without integrating security throughout the development life cycle and the risk mitigation provided by secure development practices."
      - id: "PO.2.3/E3"
        text: "Example 3: Assist upper management in incorporating secure development support into their communications with personnel with development-related roles and responsibilities."
      - id: "PO.2.3/E4"
        text: "Example 4: Educate all personnel with development-related roles and responsibilities on upper management’s commitment to secure development and the importance of secure development to the organization."
