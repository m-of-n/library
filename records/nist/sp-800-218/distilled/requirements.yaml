note: "Ids are the SSDF's own identifiers (sp-800-218#PO.1.1); groups are sp-800-218#PO, practices sp-800-218#PO.1. Text, examples and maps_to.source_text are verbatim (whitespace collapsed; footnote markers dropped and listed in footnotes). normativity/verb: SSDF practices are recommendations — §2 and the Executive Summary state each group as 'Organizations should ...'; tasks are imperative actions 'that may be needed to perform a practice' (§2). DERIVED (not in the source, need human review): actor, nature, phase, short_title, expects_deliverables, verification, testable. maps_to = the References column of Table 1 (the source's own crosswalk) plus Appendix A Table 2 (EO 14028 4e); maps_to.ids are split from source_text by the rules in distilled/README.md. The SSDF table says retired identifiers are kept and not reused — retired entries carry status: retired. Verify pass (2026-10-02): one deliberate deviation from the xlsx — RV.1.1/E1 drops the stray space the xlsx leaves where footnote marker 9 was ('databases , security' -> 'databases, security', matching the PDF); Table 1 footnotes 5-9 are now attached as `footnote` on PO.1.3, PO.3.3, PO.5.1, PS.1.1, RV.1.1; `reference_editions` names the edition behind every scheme key."
