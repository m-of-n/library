    locator: "§2 Table 1, practice PO.5"
    short_title: "Implement and Maintain Secure Environments for Software Development"
    text: "Implement and Maintain Secure Environments for Software Development (PO.5): Ensure that all components of the environments for software development are strongly protected from internal and external threats to prevent compromises of the environments or the software being developed or maintained within them. Examples of environments for software development include development, build, test, and distribution environments."
    tasks:
      - PO.5.1
      - PO.5.2
    expects_deliverables: []
    verification: "satisfied when its tasks are satisfied (outcome-based; the SSDF does not define practice-level conformance)"
    kind: stated
