  - id: "sp-800-218#PO.2.1"
    designator: PO.2.1
    level: task
    group: PO
    practice: PO.2
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: deliverable
    phase: governance
    locator: "§2 Table 1, practice PO.2, task PO.2.1"
    short_title: "Define SDLC roles and responsibilities"
    text: "PO.2.1: Create new roles and alter responsibilities for existing roles as needed to encompass all parts of the SDLC. Periodically review and maintain the defined roles and responsibilities, updating them as needed."
    notional_implementation_examples:
      - id: "PO.2.1/E1"
        text: "Example 1: Define SDLC-related roles and responsibilities for all members of the software development team."
      - id: "PO.2.1/E2"
        text: "Example 2: Integrate the security roles into the software development team."
      - id: "PO.2.1/E3"
        text: "Example 3: Define roles and responsibilities for cybersecurity staff, security champions, project managers and leads, senior management, software developers, software testers, software assurance leads and staff, product owners, operations and platform engineers, and others involved in the SDLC."
      - id: "PO.2.1/E4"
        text: "Example 4: Conduct an annual review of all roles and responsibilities."
      - id: "PO.2.1/E5"
        text: "Example 5: Educate affected individuals on impending changes to roles and responsibilities, and confirm that the individuals understand the changes and agree to follow them."
      - id: "PO.2.1/E6"
        text: "Example 6: Implement and use tools and processes to promote communication and engagement among individuals with SDLC-related roles and responsibilities, such as creating messaging channels for team discussions."
      - id: "PO.2.1/E7"
        text: "Example 7: Designate a group of individuals or a team as the code owner for each project."
