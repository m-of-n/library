  - id: "sp-800-218#PS.1.1"
    designator: PS.1.1
    level: task
    group: PS
    practice: PS.1
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: implementation
    locator: "§2 Table 1, practice PS.1, task PS.1.1"
    short_title: "Store all code with least-privilege access"
    text: "PS.1.1: Store all forms of code – including source code, executable code, and configuration-as-code – based on the principle of least privilege so that only authorized personnel, tools, services, etc. have access."
    notional_implementation_examples:
      - id: "PS.1.1/E1"
        text: "Example 1: Store all source code and configuration-as-code in a code repository, and restrict access to it based on the nature of the code. For example, open-source code intended for public access may need its integrity and availability protected; other code may also need its confidentiality protected."
      - id: "PS.1.1/E2"
        text: "Example 2: Use version control features of the repository to track all changes made to the code with accountability to the individual account."
      - id: "PS.1.1/E3"
        text: "Example 3: Use commit signing for code repositories."
      - id: "PS.1.1/E4"
        text: "Example 4: Have the code owner review and approve all changes made to the code by others."
      - id: "PS.1.1/E5"
        text: "Example 5: Use code signing to help protect the integrity of executables."
      - id: "PS.1.1/E6"
        text: "Example 6: Use cryptography (e.g., cryptographic hashes) to help protect file integrity."
