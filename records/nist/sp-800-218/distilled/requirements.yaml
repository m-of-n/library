  - id: "sp-800-218#PW.2.1"
    designator: PW.2.1
    level: task
    group: PW
    practice: PW.2
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: deliverable
    phase: design
    locator: "§2 Table 1, practice PW.2, task PW.2.1"
    short_title: "Independent / automated security design review"
    text: "PW.2.1: Have 1) a qualified person (or people) who were not involved with the design and/or 2) automated processes instantiated in the toolchain review the software design to confirm and enforce that it meets all of the security requirements and satisfactorily addresses the identified risk information."
    notional_implementation_examples:
      - id: "PW.2.1/E1"
        text: "Example 1: Review the software design to confirm that it addresses applicable security requirements."
      - id: "PW.2.1/E2"
        text: "Example 2: Review the risk models created during software design to determine if they appear to adequately identify the risks."
      - id: "PW.2.1/E3"
        text: "Example 3: Review the software design to confirm that it satisfactorily addresses the risks identified by the risk models."
      - id: "PW.2.1/E4"
        text: "Example 4: Have the software’s designer correct failures to meet the requirements."
      - id: "PW.2.1/E5"
        text: "Example 5: Change the design and/or the risk response strategy if the security requirements cannot be met."
      - id: "PW.2.1/E6"
        text: "Example 6: Record the findings of design reviews to serve as artifacts (e.g., in the software specification, in the issue tracking system, in the threat model)."
