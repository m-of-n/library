reconciliation: "Not a BCP 14 document: bin/bcp14-count on .cache/sp-800-218.txt returns 0 (no uppercase RFC 2119 keywords), and the extracted texts contain 0, so the BCP 14 counts agree at 0. The document's native normative units are its SSDF Table 1 elements; native baseline from the official SSDF table (nist.sp.800-218.ssdf-table.xlsx) and Table 1 of the PDF: 4 practice groups, 19 active practices + 1 retired (PW.3), 42 active tasks + 5 retired task identifiers (PW.3.1, PW.3.2, PW.4.3, PW.4.5, PW.5.2), 198 notional implementation examples, 528 reference lines across 29 reference schemes (1483 individual reference identifiers after splitting). Extracted: 4/4 groups, 20/20 practices (19 active + PW.3 retired), 47/47 task identifiers (42 active + 5 retired), 198/198 examples, 528/528 reference lines, and all 15 rows of Appendix A Table 2 (EO 14028 4e subsection -> tasks). Plus 8 framework-level statements outside Table 1 (Executive Summary, §1, §2) as R-0001..R-0008, added by the independent verify pass (2026-10-02) to match the sp-800-218r1 treatment; all 8 are lowercase should / is-necessary, so the BCP 14 count stays 0/0. Lowercase modal baseline in the whole PDF text: should=36, may=33, must=4, shall=1 (front-matter 'shall not apply' boilerplate), recommend=1; the normative force of the framework is the group-level 'Organizations should ...' (§2) — every practice and task inherits it."
