  - id: "sp-800-218#PO.1.3"
    designator: PO.1.3
    level: task
    group: PO
    practice: PO.1
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: supply-chain
    locator: "§2 Table 1, practice PO.1, task PO.1.3"
    short_title: "Communicate requirements to third-party component suppliers"
    text: "PO.1.3: Communicate requirements to all third parties who will provide commercial software components to the organization for reuse by the organization’s own software. [Formerly PW.3.1]"
    formerly: PW.3.1
    notional_implementation_examples:
      - id: "PO.1.3/E1"
        text: "Example 1: Define a core set of security requirements for software components, and include it in acquisition documents, software contracts, and other agreements with third parties."
      - id: "PO.1.3/E2"
        text: "Example 2: Define security-related criteria for selecting software; the criteria can include the third party’s vulnerability disclosure program and product security incident response capabilities or the third party’s adherence to organization-defined practices."
      - id: "PO.1.3/E3"
        text: "Example 3: Require third parties to attest that their software complies with the organization’s security requirements."
      - id: "PO.1.3/E4"
        text: "Example 4: Require third parties to provide provenance data and integrity verification mechanisms for all components of their software."
      - id: "PO.1.3/E5"
        text: "Example 5: Establish and follow processes to address risk when there are security requirements that third-party software components to be acquired do not meet; this should include periodic reviews of all approved exceptions to requirements."
