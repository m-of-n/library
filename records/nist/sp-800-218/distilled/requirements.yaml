  - id: "sp-800-218#PW.4.4"
    designator: PW.4.4
    level: task
    group: PW
    practice: PW.4
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: process
    phase: supply-chain
    locator: "§2 Table 1, practice PW.4, task PW.4.4"
    short_title: "Verify third-party components comply with requirements"
    text: "PW.4.4: Verify that acquired commercial, open-source, and all other third-party software components comply with the requirements, as defined by the organization, throughout their life cycles."
    notional_implementation_examples:
      - id: "PW.4.4/E1"
        text: "Example 1: Regularly check whether there are publicly known vulnerabilities in the software modules and services that vendors have not yet fixed."
      - id: "PW.4.4/E2"
        text: "Example 2: Build into the toolchain automatic detection of known vulnerabilities in software components."
      - id: "PW.4.4/E3"
        text: "Example 3: Use existing results from commercial services for vetting the software modules and services."
      - id: "PW.4.4/E4"
        text: "Example 4: Ensure that each software component is still actively maintained and has not reached end of life; this should include new vulnerabilities found in the software being remediated."
      - id: "PW.4.4/E5"
        text: "Example 5: Determine a plan of action for each software component that is no longer being maintained or will not be available in the near future."
      - id: "PW.4.4/E6"
        text: "Example 6: Confirm the integrity of software components through digital signatures or other mechanisms."
      - id: "PW.4.4/E7"
        text: "Example 7: Review, analyze, and/or test code. See PW.7 and PW.8."
