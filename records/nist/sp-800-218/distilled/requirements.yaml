  - id: "sp-800-218#PO.1.2"
    designator: PO.1.2
    level: task
    group: PO
    practice: PO.1
    normativity: recommendation
    verb: should
    actor: "organization (software producer)"
    nature: deliverable
    phase: requirements
    locator: "§2 Table 1, practice PO.1, task PO.1.2"
    short_title: "Document security requirements for organization-developed software"
    text: "PO.1.2: Identify and document all security requirements for organization-developed software to meet, and maintain the requirements over time."
    notional_implementation_examples:
      - id: "PO.1.2/E1"
        text: "Example 1: Define policies that specify risk-based software architecture and design requirements, such as making code modular to facilitate code reuse and updates; isolating security components from other components during execution; avoiding undocumented commands and settings; and providing features that will aid software acquirers with the secure deployment, operation, and maintenance of the software."
      - id: "PO.1.2/E2"
        text: "Example 2: Define policies that specify the security requirements for the organization’s software, and verify compliance at key points in the SDLC (e.g., classes of software flaws verified by gates, responses to vulnerabilities discovered in released software)."
      - id: "PO.1.2/E3"
        text: "Example 3: Analyze the risk of applicable technology stacks (e.g., languages, environments, deployment models), and recommend or require the use of stacks that will reduce risk compared to others."
      - id: "PO.1.2/E4"
        text: "Example 4: Define policies that specify what needs to be archived for each software release (e.g., code, package files, third-party libraries, documentation, data inventory) and how long it needs to be retained based on the SDLC model, software end-of-life, and other factors."
      - id: "PO.1.2/E5"
        text: "Example 5: Ensure that policies cover the entire software life cycle, including notifying users of the impending end of software support and the date of software end-of-life."
      - id: "PO.1.2/E6"
        text: "Example 6: Review all security requirements at least annually, or sooner if there are new requirements from internal or external sources, a major vulnerability is discovered in released software, or a major security incident targeting organization-developed software has occurred."
      - id: "PO.1.2/E7"
        text: "Example 7: Establish and follow processes for handling requirement exception requests, including periodic reviews of all approved exceptions."
