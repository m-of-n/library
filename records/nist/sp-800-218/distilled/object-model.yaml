schema: "library-object-model/v1"
record: sp-800-218
source_version: "1.1 (February 2022)"
source_digest: "617746e553a9e2da49bfbd4eef0dfc3094758a39b869314e4173ac36605cde22"
extracted: "2026-10-02"
extracted_by: "claude (lane A)"
reviewed_by: ""
question: "What objects (entity types) and relationship edges does SSDF 1.1 assume or define?"
note: >-
  Locators are SSDF identifiers (a task id means its task text; "/En" means its notional implementation
  example n) or sections. kind=stated: the source names the thing (it need not define it formally);
  kind=inferred: the source presupposes it without naming it as such. tmodel_mapping targets
  ARCH-0001-PROPOSAL-v0.2.0 (§ numbers) and DL-0009 (SDL/Gate/Requirement/WorkProduct/Evidence/governed
  view, R-040..R-044). "new" = tmodel has no class for it yet. The SSDF is outcome-based and
  deliberately leaves terms undefined (§2: "sensitive data", "qualified person", "well-secured", and
  environment names are for the adopter to define) — those are recorded as attributes the adopter
  must supply, not invented definitions.

objects:
  # ---------------------------------------------------------------- framework structure (meta level)
  - name: Framework
    definition: "The SSDF itself: a versioned core set of high-level secure software development practices to integrate into each SDLC implementation."
    attributes: [name, version, publication_date, change_log]
    locator: "Abstract; §2 ('This document defines version 1.1'); Appendix C"
    kind: stated
    tmodel_mapping: "library record (sp-800-218) referenced by Requirement.source; DL-0009 R-044 crosswalk namespace"
    notes: "Versioned; identifiers of deleted/moved practices are retired, not reused (Appendix C)."
  - name: PracticeGroup
    definition: "One of four groups organizing the practices: PO, PS, PW, RV; each stated as an outcome organizations should achieve."
    attributes: [id (PO|PS|PW|RV), name, outcome_statement]
    locator: "§2 list; Executive Summary"
    kind: stated
    tmodel_mapping: "new — grouping node for Requirement (DL-0009 R-044); NOT a LifecyclePhase (SSDF groups are org/domain-structured, MAP-0001 note)"
    notes: ""
  - name: Practice
    definition: "The name of the practice and a unique identifier, followed by a brief explanation of what the practice is and why it is beneficial."
    attributes: [id (e.g. PO.1), name, explanation, rationale, status (active|retired), moved_to]
    locator: "§2 element list ('Practice:'); Table 1"
    kind: stated
    tmodel_mapping: "DL-0009 Requirement (outcome-level, R-044); satisfied via its Tasks"
    notes: "20 identifiers in 1.1: 19 active + PW.3 retired."
  - name: Task
    definition: "One or more actions that may be needed to perform a practice."
    attributes: [id (e.g. PO.1.1), text, formerly (e.g. PW.3.1), status (active|retired), moved_to]
    locator: "§2 element list ('Tasks:'); Table 1"
    kind: stated
    tmodel_mapping: "DL-0009 Requirement (atomic conformance unit, R-042) — the natural row key for a conformance check and for Gate exit criteria"
    notes: "47 identifiers: 42 active + 5 retired. Tasks are the level the References column maps from."
  - name: NotionalImplementationExample
    definition: "A notional example of types of tools, processes, or other methods that could be used to help implement a task; none required, not exhaustive."
    attributes: [task_id, number (Example n), text]
    locator: "§2 element list ('Notional Implementation Examples:'); Table 1 column 3"
    kind: stated
    tmodel_mapping: "new — candidate MitigationInstance template (R-040 kind technical|documentation|process); never itself a conformance obligation"
    notes: "198 examples. Explicitly optional (§2) — a model must not treat them as requirements."
  - name: InformativeReference
    definition: "A pointer to an established secure development practice document and its mapping to a particular task."
    attributes: [scheme_key (e.g. BSIMM), document (bibliographic entry in References), identifiers (e.g. CP1.1)]
    locator: "§2 element list ('References:'); Table 1 column 4; References section"
    kind: stated
    tmodel_mapping: "DL-0009 R-044 Requirement.maps_to target + library record for the referenced document"
    notes: "29 schemes, 528 task→scheme lines, 1483 identifiers. Several targets are superseded editions (BSIMM12, SAMM 1.5, ASVS 4.0.3, SP 800-161r1 draft2, SP 800-216 draft)."
  - name: ReferenceDocument
    definition: "An established secure software development practice document listed in the References section under a bracketed key."
    attributes: [key, authors, year, title, version, url]
    locator: "References section"
    kind: stated
    tmodel_mapping: "library record / Party (publisher, ARCH §2b 'publishers reference the library record')"
    notes: ""
  - name: ExternalClause
    definition: "A clause of an external mandate the SSDF is mapped to; in 1.1, EO 14028 Section 4e subsections (4e(i)(A) ... 4e(x))."
    attributes: [source (EO 14028), subsection_id, text (not reproduced in SP 800-218)]
    locator: "Appendix A Table 2"
    kind: stated
    tmodel_mapping: "DL-0009 Requirement from a regulation (eo-14028 record) with maps_to → Task (R-044)"
    notes: "4e(ix) maps to 'All practices and tasks consistent with a risk-based approach' — a non-enumerable mapping."
  - name: Term
    definition: "A term the SSDF uses but deliberately leaves to the adopter to define (sensitive data, qualified person, well-secured, environment names)."
    attributes: [term, adopter_definition]
    locator: "§2 ('The table uses terms like ... Organizations adopting the SSDF should define these terms')"
    kind: stated
    tmodel_mapping: "new — per-SDL glossary binding (DL-0009 SDL object attribute)"
    notes: "A conformance engine needs these bound before 'well-secured' / 'qualified person' checks are evaluable."

  # ---------------------------------------------------------------- parties and roles
  - name: Organization
    definition: "The adopting organization that should integrate the SSDF; subject of every group statement."
    attributes: [name, risk_tolerance, mission/business requirements]
    locator: "§2 groups; Executive Summary"
    kind: stated
    tmodel_mapping: "Party (ARCH §2b)"
    notes: ""
  - name: SoftwareProducer
    definition: "Organization producing software (COTS vendors, GOTS developers, custom developers, internal teams)."
    attributes: [type (COTS|GOTS|custom|internal), size, sector, maturity]
    locator: "Audience; §1"
    kind: stated
    tmodel_mapping: "Party + relational role edge supplied_by/manufactured_by (ARCH §2b critic M2)"
    notes: "Relational role, not an intrinsic class."
  - name: SoftwareAcquirer
    definition: "Federal agencies and other organizations procuring and using software; receive integrity verification information and provenance data."
    attributes: []
    locator: "Audience; §1; PS.2.1; PS.3.2/E1"
    kind: stated
    tmodel_mapping: "Party + relational role (consumer)"
    notes: ""
  - name: ThirdPartySupplier
    definition: "Third parties providing commercial software components to the organization for reuse; commercial, open-source and other third-party developers."
    attributes: [vulnerability_disclosure_program, psirt_capability, adherence_to_org_practices]
    locator: "PO.1.3, PO.1.3/E2, PW.4.1, PW.4.4"
    kind: stated
    tmodel_mapping: "Party + supplied_by edge"
    notes: ""
  - name: ServiceProvider
    definition: "Platform/service provider (IaaS, SaaS, PaaS, CaaS, serverless) sharing responsibility for practices with a tenant organization."
    attributes: [service_model]
    locator: "§1 (shared responsibility)"
    kind: stated
    tmodel_mapping: "Party + relational role"
    notes: ""
  - name: ResponsibilityAgreement
    definition: "Agreement between tenant organization and providers that specifies which party is responsible for each practice and task and how each provider will attest to their conformance."
    attributes: [parties, task_assignments (task → party), attestation_method]
    locator: "§1 ('The tenant organization should establish an agreement ...')"
    kind: stated
    tmodel_mapping: "new — per-Task responsibility assignment; ties DL-0009 conformance to Party"
    notes: "Makes 'responsible party' a per-Task attribute of a conformance record, not of the Task."
  - name: Role
    definition: "SDLC-related role with responsibilities (cybersecurity staff, security champions, project managers and leads, senior management, software developers, testers, assurance leads, product owners, operations and platform engineers, those responsible for testing shipped software, code owner)."
    attributes: [name, responsibilities, review_date]
    locator: "PO.2, PO.2.1, PO.2.1/E3, PO.2.1/E7"
    kind: stated
    tmodel_mapping: "Party role facet (ARCH §2b) — DL-0009 owner/approver roles"
    notes: "Roles are reviewed periodically (PO.2.1/E4 'annual review')."
  - name: Personnel
    definition: "Individuals with responsibilities that contribute to secure development."
    attributes: [roles, proficiency]
    locator: "PO.2.2"
    kind: stated
    tmodel_mapping: "Party (person)"
    notes: ""
  - name: TrainingProgram
    definition: "Role-based training: desired outcomes, curriculum, plan per role, outcome measurement."
    attributes: [role, desired_outcomes, curriculum, plan, outcome_measure]
    locator: "PO.2.2, PO.2.2/E1-E5"
    kind: stated
    tmodel_mapping: "new — MitigationInstance kind=process (R-040) at program level"
    notes: ""
  - name: SecurityLeadership
    definition: "Upper management / authorizing official commitment; a single leader or team responsible for the entire secure development process, accountable for releasing software to production."
    attributes: [leader, commitment_statement]
    locator: "PO.2.3, PO.2.3/E1"
    kind: stated
    tmodel_mapping: "Party role (approver); DL-0009 Gate approver for release"
    notes: "PO.2.3/E1 is the only place the SSDF names release accountability."
  - name: CodeOwner
    definition: "Group of individuals or a team designated as the code owner for each project; reviews and approves all changes made by others."
    attributes: [project]
    locator: "PO.2.1/E7, PS.1.1/E4"
    kind: stated
    tmodel_mapping: "Party role (owned_by edge)"
    notes: ""
  - name: PSIRT
    definition: "Product Security Incident Response Team and processes handling responses to vulnerability reports and incidents."
    attributes: [communications_plan, playbooks, exercise_schedule]
    locator: "RV.1.3/E2-E4"
    kind: stated
    tmodel_mapping: "Party (organization unit) role"
    notes: ""
  - name: SecurityResearcher
    definition: "External reporter of possible vulnerabilities to the vulnerability disclosure program."
    attributes: []
    locator: "RV.1.3/E1"
    kind: stated
    tmodel_mapping: "Party (reported_by edge, ARCH §2b)"
    notes: ""

  # ---------------------------------------------------------------- governance artifacts
  - name: SecurityRequirement
    definition: "A security requirement for the organization's software development infrastructures and processes (PO.1.1) or for organization-developed software (PO.1.2), from internal sources (policies, business objectives, risk management strategy) and external sources (laws, regulations)."
    attributes: [scope (infrastructure_process|software), source (internal|external), text, review_date]
    locator: "PO.1 practice text, PO.1.1, PO.1.2, PW.1, PW.1.2"
    kind: stated
    tmodel_mapping: "DL-0009 Requirement (product-level, authored) — distinct from the SSDF Task (framework-level); R-042 conformance checks product SecurityRequirements against evidence"
    notes: "Two Requirement tiers are visible: framework tasks (what the SDL must do) vs product security requirements (what the software must meet)."
  - name: Policy
    definition: "Documented organizational policy: securing development infrastructures/processes, architecture/design requirements, archival/retention, end-of-life notice, vulnerability disclosure and remediation."
    attributes: [subject, text, owner, review_cycle]
    locator: "PO.1.1/E1-E2, PO.1.2/E1-E5, RV.1.3"
    kind: stated
    tmodel_mapping: "DL-0009 WorkProduct rendered as a governed view (R-043); MitigationInstance kind=documentation (R-040)"
    notes: ""
  - name: RequirementException
    definition: "Request for, approval of, and periodic review of an exception to a security requirement (including third-party components that do not meet requirements)."
    attributes: [requirement, rationale, approver, approval_date, next_review]
    locator: "PO.1.2/E7, PO.1.3/E5, PW.1.2/E1-E3, PO.4.1/E5"
    kind: stated
    tmodel_mapping: "Assertion + Review (ARCH §4) — risk acceptance on a Requirement; DEC-009 mitigation lifecycle state 'accepted risk'"
    notes: "Periodic re-evaluation implies a validity window (valid_from/valid_to)."
  - name: SecurityCheckCriteria
    definition: "Criteria for software security checks tracked throughout the SDLC: KPIs, KRIs, vulnerability severity scores, other measures; added to existing checks such as the Definition of Done."
    attributes: [measure, threshold, sdlc_point]
    locator: "PO.4, PO.4.1, PO.4.1/E1-E3"
    kind: stated
    tmodel_mapping: "DL-0009 Gate exit criterion (R-041); automatable 'threats mitigated' check (R-042)"
    notes: "The SSDF's gate hook: PO.1.2/E2 says compliance is verified 'at key points in the SDLC (e.g., classes of software flaws verified by gates ...)'."
  - name: Gate
    definition: "Key point in the SDLC at which compliance with security requirements is verified (e.g., classes of software flaws verified by gates)."
    attributes: [sdlc_point, criteria, flaw_classes]
    locator: "PO.1.2/E2; PO.4.1 ('track throughout the SDLC')"
    kind: stated
    tmodel_mapping: "DL-0009 Gate/Checkpoint (R-041)"
    notes: "Named once, in an example; the SSDF does not define gate order or names (consistent with 'not intended to imply the sequence of implementation', §2)."
  - name: SecurityCheck
    definition: "An execution of the criteria against workflow artifacts, yielding approval, rejection or exception request recorded in the workflow and tracking system."
    attributes: [criteria, artifacts_reviewed, outcome (approved|rejected|exception_requested), timestamp]
    locator: "PO.4.1/E4-E5, PO.4.2/E3"
    kind: stated
    tmodel_mapping: "Review (ARCH §4/§5) on a Gate; DL-0009 conformance check result (R-042)"
    notes: "PO.4.2/E3 allows automated decision-making on the criteria — an automatable gate."
  - name: Metric
    definition: "KPI, KRI, vulnerability severity score or other measure for software security."
    attributes: [kind (KPI|KRI|severity|other), value]
    locator: "PO.4.1/E2"
    kind: stated
    tmodel_mapping: "RiskScore (ARCH §1.3) for severity; new for KPI/KRI"
    notes: ""

  # ---------------------------------------------------------------- toolchain and environment
  - name: Toolchain
    definition: "A set of integrated tools (organization-wide or project-specific, possibly for part of the SDLC such as a build pipeline) used to automate security practices."
    attributes: [category, scope (org|project), mandatory_tools, integration_spec, data_formats]
    locator: "PO.3 practice text, PO.3.1, PO.3.1/E1-E5"
    kind: stated
    tmodel_mapping: "Component (composed_of Tools) — runs in a DevelopmentEnvironment"
    notes: "Pipelines-as-code / toolchains-as-code (PO.3.2/E3)."
  - name: Tool
    definition: "A security or development tool in a toolchain, including compilers, interpreters and build tools."
    attributes: [type, version, provenance, integrity_status, configuration]
    locator: "PO.3.1, PO.3.2, PW.6.1"
    kind: stated
    tmodel_mapping: "Component (purl/CPE); its provenance → supply-chain provenance (radar contract, ADR-0001)"
    notes: "Tools themselves are attack surface: integrity/provenance checked regularly (PO.3.2/E7, PW.6.1/E3)."
  - name: ApprovedConfiguration
    definition: "Approved secure configuration for tools, compilers/build tools, security-feature modules or components, preferably as configuration-as-code."
    attributes: [target, settings, as_code_location]
    locator: "PW.6.2, PW.6.2/E6-E7, PW.1.3/E2, PW.4.1/E2, PW.4.2/E2"
    kind: stated
    tmodel_mapping: "new (WorkProduct); verification evidence for MitigationInstance"
    notes: ""
  - name: Artifact
    definition: "\"A piece of evidence\"; artifacts provide records of secure software development practices; generated by tools or created manually."
    attributes: [type, producer (tool|person), retention_policy, integrity_protection]
    locator: "footnote 6 (on PO.3.3); PO.3.3/E1-E4; PO.5.1/E8; PO.5.2/E4; PW.2.1/E6"
    kind: stated
    tmodel_mapping: "DL-0009 Evidence / PROV Entity (ARCH §4)"
    notes: "Defined by quotation from IR 7692."
  - name: Evidence
    definition: "\"Grounds for belief or disbelief; data on which to base proof or to establish truth or falsehood\"."
    attributes: []
    locator: "footnote 6 (quoting SP 800-160)"
    kind: stated
    tmodel_mapping: "DL-0009 Evidence"
    notes: ""
  - name: AuditTrail
    definition: "Record of secure-development-related actions created from existing tooling (workflow tracking, issue tracking, value stream mapping), audited at a determined frequency."
    attributes: [actions, audit_frequency]
    locator: "PO.3.3/E1-E2"
    kind: stated
    tmodel_mapping: "PROV Activity log (ARCH §4); change tracking of governed views (R-043)"
    notes: ""
  - name: DevelopmentEnvironment
    definition: "Each environment involved in software development (development, build, staging, integration, test, production, distribution — names vary; the adopter enumerates them)."
    attributes: [name, separation_controls, access_controls, monitoring, zero_trust]
    locator: "§2 (environment names); PO.5, PO.5.1, PO.5.1/E1-E10"
    kind: stated
    tmodel_mapping: "Environment / Deployment (ARCH §3) — and TrustBoundary zone (in_trust_zone) for separation"
    notes: "'Enumerating your environments is necessary in order to secure them properly' (§2)."
  - name: DevelopmentEndpoint
    definition: "Endpoint for software designers, developers, testers, builders, etc., secured and hardened using a risk-based approach."
    attributes: [hardening_baseline, network (non-production), mfa, posture]
    locator: "PO.5.2, PO.5.2/E1-E7"
    kind: stated
    tmodel_mapping: "Component (device) in an Environment"
    notes: ""
  - name: TrustRelationship
    definition: "Authorization and access trust relationship between environments and between components within an environment; logged, monitored, audited."
    attributes: [from, to, privileges]
    locator: "PO.5.1/E6"
    kind: stated
    tmodel_mapping: "connected_via / TrustBoundary crossing (ARCH §1, §3)"
    notes: ""
  - name: HostingInfrastructure
    definition: "Infrastructure hosting the environments, secured following a zero trust architecture."
    attributes: []
    locator: "PO.5.1/E10"
    kind: stated
    tmodel_mapping: "Component / Deployment"
    notes: ""

  # ---------------------------------------------------------------- software and code
  - name: Software
    definition: "The software being developed (including code built into hardware), for IT, ICS, CPS or IoT."
    attributes: [name, technology_stack, end_of_support_date, end_of_life_date]
    locator: "§1; passim"
    kind: stated
    tmodel_mapping: "Product (ARCH §1) — lifecycle phases incl. end-of-support (§3b)"
    notes: "PO.1.2/E5 adds end-of-support notification and end-of-life date."
  - name: Code
    definition: "All forms of code: source code, executable code, and configuration-as-code; human-readable vs executable."
    attributes: [form (source|executable|configuration-as-code), visibility (public|non-public), owner]
    locator: "PS.1, PS.1.1, PW.7, PW.8"
    kind: stated
    tmodel_mapping: "Component / PROV Entity"
    notes: ""
  - name: CodeRepository
    definition: "Repository storing source code and configuration-as-code, with least-privilege access, version control, commit signing."
    attributes: [access_policy, commit_signing, branch_protection]
    locator: "PS.1.1/E1-E3"
    kind: stated
    tmodel_mapping: "Component (DataStore role in DFD terms)"
    notes: ""
  - name: CodeChange
    definition: "A change made to code, tracked by version control with accountability to the individual account, reviewed and approved by the code owner."
    attributes: [author_account, signature, approver]
    locator: "PS.1.1/E2-E4"
    kind: stated
    tmodel_mapping: "PROV Activity + Agent (ARCH §4)"
    notes: ""
  - name: SoftwareComponent
    definition: "Software libraries, modules, middleware, frameworks — acquired from commercial, open-source and other third-party developers, or created in-house."
    attributes: [origin (commercial|open-source|third-party|in-house), version, maintenance_status, end_of_life, provenance, approved]
    locator: "PW.4, PW.4.1, PW.4.2, PW.4.4"
    kind: stated
    tmodel_mapping: "Component (CPE/purl, shared) with composed_of"
    notes: "PW.4.4/E4-E5: maintenance status and a plan of action for unmaintained components."
  - name: ComponentRepository
    definition: "Repository hosting sanctioned and vetted open-source components, in-house components, or standardized security-feature modules."
    attributes: []
    locator: "PW.4.1/E4, PW.4.2/E3, PW.1.3/E1"
    kind: stated
    tmodel_mapping: "Component (DataStore)"
    notes: ""
  - name: ApprovedComponentList
    definition: "List of organization-approved commercial software components and component versions along with their provenance data; designation of components that must be included."
    attributes: [component, version, provenance]
    locator: "PW.4.1/E5-E6, PW.4.2/E4"
    kind: stated
    tmodel_mapping: "new (WorkProduct)"
    notes: ""
  - name: StandardizedSecurityService
    definition: "Standardized security features and services (log management, identity management, access control, vulnerability management) to integrate instead of proprietary implementations."
    attributes: [service, approved_configuration]
    locator: "PW.1.3, PW.1.3/E1-E3"
    kind: stated
    tmodel_mapping: "Mitigation (D3FEND-style generic, ARCH §1.3) / Component"
    notes: ""
  - name: SoftwareRelease
    definition: "A release of the software; protected, archived, accompanied by integrity verification information and provenance data."
    attributes: [version, release_files, images, integrity_info, provenance_data, retention_period]
    locator: "PS.2, PS.3, PS.3.1, PS.3.2"
    kind: stated
    tmodel_mapping: "ProductInstance (versioned, ARCH §1/§3b)"
    notes: ""
  - name: IntegrityVerificationInformation
    definition: "Information allowing acquirers to verify release integrity: cryptographic hashes posted on a well-secured website, code signatures from an established certificate authority."
    attributes: [hash_algorithm, hash, signature, certificate_chain]
    locator: "PS.2.1, PS.2.1/E1-E3, PS.3.1/E2"
    kind: stated
    tmodel_mapping: "Assertion (signed) / supply-chain provenance (ADR-0001 radar contract)"
    notes: ""
  - name: CodeSigningCertificate
    definition: "Certificate from an established certificate authority used for code signing; renewal, rotation, revocation, protection reviewed periodically."
    attributes: [issuer_ca, validity, revocation_status]
    locator: "PS.2.1/E2-E3"
    kind: stated
    tmodel_mapping: "new (key-management object)"
    notes: ""
  - name: ProvenanceData
    definition: "\"The chronology of the origin, development, ownership, location, and changes to a system or system component and associated data\" [SP80053], collected for all components of each release, e.g. in an SBOM."
    attributes: [components, format (standards-based preferred), integrity_protection, updated_on_component_change]
    locator: "footnote 5 (anchored at PO.1.3/E4 'provenance data'); PS.3.2, PS.3.2/E1-E4; PW.4.1/E3; PO.1.3/E4"
    kind: stated
    tmodel_mapping: "supply-chain/custody provenance — deferred by ARCH §4 to the radar→tmodel contract (ADR-0001); distinct from the epistemic Assertion spine"
    notes: "The SSDF's provenance is supply-chain provenance, not the in-model epistemic provenance of ARCH §4."
  - name: SBOM
    definition: "Software bill of materials — an example container of provenance data for all components of a release."
    attributes: []
    locator: "PS.3.2 ('e.g., in a software bill of materials [SBOM]'); PW.4.1/E3"
    kind: stated
    tmodel_mapping: "new — inventory projection of composed_of over a ProductInstance"
    notes: ""
  - name: ReleaseArchive
    definition: "Secure archive of the necessary files and supporting data retained for each release (read-only to necessary personnel)."
    attributes: [location, access_policy, retention]
    locator: "PS.3.1, PS.3.1/E1-E2; PO.1.2/E4 (what to archive and retention)"
    kind: stated
    tmodel_mapping: "Component (DataStore)"
    notes: ""

  # ---------------------------------------------------------------- design and risk
  - name: RiskModel
    definition: "A form of risk modeling — threat modeling, attack modeling, attack surface mapping — used to assess the security risk for the software."
    attributes: [form (threat_model|attack_model|attack_surface_map), scope, high_risk_areas]
    locator: "PW.1.1, PW.1.1/E1-E2, PW.2.1/E2"
    kind: stated
    tmodel_mapping: "ThreatModel (the tmodel instance itself): ThreatInstance/AttackPath/AttackSurface (ARCH §1.3)"
    notes: "The SSDF's anchor for tmodel: PW.1.1 is where a threat model enters the SDL; PW.2.1 reviews it."
  - name: Risk
    definition: "Security risk the software is likely to face during operation."
    attributes: [description, likelihood, impact]
    locator: "PW.1 practice text, PW.1.2"
    kind: stated
    tmodel_mapping: "ThreatInstance + RiskScore (ARCH §1.3, §3)"
    notes: ""
  - name: RiskResponse
    definition: "The response to each risk: how mitigations are to be achieved, rationale for approved exceptions; for vulnerabilities, remediation, risk acceptance or risk transference."
    attributes: [type (mitigate|accept|transfer|temporary_mitigation), rationale, plan]
    locator: "PW.1.2/E1, RV.2.2, RV.2.2/E1-E2"
    kind: stated
    tmodel_mapping: "MitigationInstance (ARCH §5; R-040 kind) and its DEC-009 lifecycle"
    notes: "PW.1.2/E1: 'Add any mitigations to the software's security requirements' — a mitigation becomes a requirement (feedback edge)."
  - name: DesignDecision
    definition: "Recorded design decision maintained for auditing and maintenance throughout the life cycle."
    attributes: [decision, rationale, date]
    locator: "PW.1.2, PW.1.2/E2"
    kind: stated
    tmodel_mapping: "Assertion (ARCH §4)"
    notes: ""
  - name: SoftwareDesign
    definition: "The software's design and architecture, which should mitigate identified risks."
    attributes: [architecture, modularity, isolation_of_security_components]
    locator: "PW.1 practice text, PW.2, PO.1.2/E1"
    kind: stated
    tmodel_mapping: "structural + DFD layers (ARCH §1)"
    notes: ""
  - name: DesignReview
    definition: "Review of the design by a qualified person not involved with the design and/or automated processes in the toolchain, confirming it meets all security requirements and addresses identified risk; findings recorded as artifacts."
    attributes: [reviewer, independence, automated, findings, outcome]
    locator: "PW.2.1, PW.2.1/E1-E6"
    kind: stated
    tmodel_mapping: "Review (ARCH §4/§5) — proposal/verdict separation; reviewer independence is a Review attribute"
    notes: "Independence constraint ('not involved with the design') is a checkable property of the Review→Party edge."
  - name: DataClassification
    definition: "Classification identifying and characterizing each type of data the software will interact with."
    attributes: [data_type, classification]
    locator: "PW.1.1/E4"
    kind: stated
    tmodel_mapping: "classification on DataStore/DataFlow/Asset (R-029)"
    notes: ""

  # ---------------------------------------------------------------- verification
  - name: SecureCodingPractice
    definition: "Secure coding practices appropriate to the languages and environment (validate inputs, encode outputs, avoid unsafe functions, handle errors, logging...), embodied in the organization's secure coding standards."
    attributes: [language, rule]
    locator: "PW.5.1, PW.5.1/E1-E9, PW.7.2"
    kind: stated
    tmodel_mapping: "generic Mitigation (ARCH §1.3) countering Weakness (CWE)"
    notes: ""
  - name: CodeReview
    definition: "A person looks directly at the code to find issues."
    attributes: [reviewer, checklist, scope]
    locator: "PW.7.1, PW.7.2/E1-E3, PW.7.2/E5"
    kind: stated
    tmodel_mapping: "PROV Activity producing Finding; Review"
    notes: ""
  - name: CodeAnalysis
    definition: "Tools are used to find issues in code, either in a fully automated way or in conjunction with a person (e.g., static analysis)."
    attributes: [tool, ruleset]
    locator: "PW.7.1, PW.7.2/E4, PW.7.2/E6"
    kind: stated
    tmodel_mapping: "PROV Activity (tool Agent) producing Finding"
    notes: ""
  - name: SecurityTest
    definition: "Executable code testing: functional testing of security features, dynamic vulnerability testing, regression tests for reported vulnerabilities, fuzzing, penetration testing; scoped, designed, performed, documented."
    attributes: [type, scope, plan, results, environment (e.g. sandboxed)]
    locator: "PW.8, PW.8.1, PW.8.2, PW.8.2/E1-E9"
    kind: stated
    tmodel_mapping: "PROV Activity producing Finding; verification evidence of MitigationInstance (ARCH §5)"
    notes: ""
  - name: Issue
    definition: "A discovered issue and recommended remediation, recorded and triaged in the development team's workflow or issue tracking system."
    attributes: [description, recommended_remediation, triage_state, root_cause]
    locator: "PW.7.2, PW.8.2, PW.7.2/E7"
    kind: stated
    tmodel_mapping: "Finding (ARCH §1.3) + external_refs (R-028)"
    notes: ""
  - name: IssueTrackingSystem
    definition: "The development team's workflow or issue tracking system recording issues, vulnerabilities, check approvals/rejections."
    attributes: []
    locator: "PW.7.2, PW.8.2, RV.2.1/E1, PO.4.1/E5"
    kind: stated
    tmodel_mapping: "external system referenced by external_refs (R-028)"
    notes: ""
  - name: SecureBaseline
    definition: "Determination of how to configure each security-relevant setting so defaults are secure and do not weaken platform/network/service security functions."
    attributes: [settings]
    locator: "PW.9.1"
    kind: stated
    tmodel_mapping: "MitigationInstance kind=technical; WorkProduct"
    notes: ""
  - name: ConfigurationSetting
    definition: "A setting with purpose, options, default value, security relevance, potential operational impact, relationships to other settings; documented for administrators."
    attributes: [purpose, options, default_value, security_relevance, operational_impact, related_settings]
    locator: "PW.9.2, PW.9.2/E2-E4"
    kind: stated
    tmodel_mapping: "new"
    notes: ""
  - name: AdministratorDocumentation
    definition: "Documentation of each default setting for software administrators; programmatic mechanisms recording how each setting can be implemented and assessed."
    attributes: []
    locator: "PW.9.2, PW.9.2/E2-E3"
    kind: stated
    tmodel_mapping: "WorkProduct; MitigationInstance kind=documentation (R-040)"
    notes: ""

  # ---------------------------------------------------------------- response
  - name: Vulnerability
    definition: "A vulnerability in the software or third-party components it uses; includes bugs from coding flaws and weaknesses from security configuration settings, incorrect trust assumptions, outdated risk analysis."
    attributes: [id, affected_releases, exploitability, impact, risk, status, root_cause]
    locator: "§1 ([IR7864] sentence); RV.1-RV.3"
    kind: stated
    tmodel_mapping: "Finding/Vulnerability (ARCH §1.3); propagation via uses_component (R-027a)"
    notes: ""
  - name: VulnerabilityReport
    definition: "Information on potential vulnerabilities gathered from acquirers, users and public sources; credible reports are investigated."
    attributes: [source, credibility, investigation_status]
    locator: "RV.1.1"
    kind: stated
    tmodel_mapping: "Assertion (reported_by Party) → Finding"
    notes: ""
  - name: VulnerabilityInformationSource
    definition: "Vulnerability databases, security mailing lists, threat intelligence, provenance/software composition data monitored for new vulnerabilities."
    attributes: [type]
    locator: "RV.1.1/E1-E3; footnote 9 (NVD)"
    kind: stated
    tmodel_mapping: "external feed (radar contract)"
    notes: ""
  - name: VulnerabilityDisclosurePolicy
    definition: "Policy addressing vulnerability disclosure and remediation, with the roles, responsibilities and processes to support it; realized as a vulnerability disclosure program."
    attributes: [contact, scope, process]
    locator: "RV.1.3, RV.1.3/E1"
    kind: stated
    tmodel_mapping: "WorkProduct (governed view, R-043)"
    notes: ""
  - name: SecurityResponsePlaybook
    definition: "Playbook for a generic reported vulnerability, zero-days, a vulnerability exploited in the wild, and a major multi-party incident."
    attributes: [scenario]
    locator: "RV.1.3/E3"
    kind: stated
    tmodel_mapping: "new (WorkProduct)"
    notes: ""
  - name: RiskCalculation
    definition: "Per-vulnerability risk estimate based on exploitability, potential impact and other relevant characteristics."
    attributes: [exploitability, impact, score]
    locator: "RV.2.1, RV.2.1/E2"
    kind: stated
    tmodel_mapping: "RiskScore (ARCH §3)"
    notes: ""
  - name: Remediation
    definition: "Permanent or temporary mitigation for a vulnerability, delivered via an automated and trusted delivery mechanism; one remediation may address multiple vulnerabilities."
    attributes: [type (permanent|temporary), delivery_mechanism]
    locator: "RV.2.2/E2, RV.2.2/E4"
    kind: stated
    tmodel_mapping: "MitigationInstance (ARCH §5) — N:M to Vulnerability"
    notes: ""
  - name: SecurityAdvisory
    definition: "Advisory to acquirers describing the vulnerabilities, how to find instances of vulnerable software, and how to address them."
    attributes: [vulnerabilities, affected_instances_guidance, remediation_guidance]
    locator: "RV.2.2/E3"
    kind: stated
    tmodel_mapping: "Assertion published by Party (VEX-adjacent, R-027b)"
    notes: ""
  - name: RootCause
    definition: "Root cause of a discovered issue or vulnerability, analyzed individually and as patterns over time (e.g., a secure coding practice not followed consistently)."
    attributes: [description, pattern, practice_not_followed]
    locator: "RV.3.1, RV.3.2, PW.7.2/E7, PW.8.2/E7"
    kind: stated
    tmodel_mapping: "Weakness (CWE) as a generic; new for process root cause"
    notes: "A root cause can be a process failure (a Task not performed), which links Vulnerability back to the SDL — a feedback edge tmodel lacks."
  - name: LessonsLearned
    definition: "Lessons learned from code review, testing and root cause analysis, recorded in a searchable wiki."
    attributes: [text, source_activity]
    locator: "PW.7.2/E8, PW.8.2/E8, RV.3.1/E2, RV.3.2/E1, RV.3.4/E1"
    kind: stated
    tmodel_mapping: "new (WorkProduct)"
    notes: ""
  - name: SDLC
    definition: "A software development life cycle: formal or informal methodology for designing, creating and maintaining software (waterfall, spiral, agile, DevOps); SSDF practices are integrated into it and it is updated to prevent root-cause recurrence."
    attributes: [model (waterfall|spiral|agile|DevOps), practices_integrated]
    locator: "§1; RV.3.4"
    kind: stated
    tmodel_mapping: "DL-0009 SDL/SecurityProgram (R-041)"
    notes: "The SSDF is a practice overlay, not an SDLC — the SDL object is the adopter's SDLC with SSDF tasks bound to it."
  - name: Attestation
    definition: "Third parties attesting that their software complies with the organization's security requirements; providers attesting conformance with a responsibility agreement."
    attributes: [attester, subject, claims, date]
    locator: "PO.1.3/E3; §1 ('how each provider will attest to their conformance'); Appendix A (attestation guidance)"
    kind: stated
    tmodel_mapping: "Assertion by an external Party (ARCH §4) — the CISA secure software attestation form is the concrete instance (eo-14028 lineage)"
    notes: ""
  - name: ConformanceRecord
    definition: "The organization's record of which SSDF practices/tasks it implements, to what degree, and with what formality; used to document current practices and define target practices."
    attributes: [task, implemented (yes|partial|no|n/a), degree, formality, responsible_party, evidence]
    locator: "§1 ('the degree to which each practice is implemented and the formality ... will vary'; 'document its secure software development practices today and define its future target practices')"
    kind: inferred
    tmodel_mapping: "DL-0009 conformance (R-042) — current vs target profile"
    notes: "Inferred: the SSDF describes the use (gap analysis) but defines no conformance record format."

