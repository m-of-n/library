gaps:
  - "Requirement tiering: tmodel's DL-0009 Requirement does not yet distinguish FRAMEWORK requirements (SSDF Task: what the SDL must do) from PRODUCT security requirements (PO.1.2/PW.1.2: what the software must meet). Both are needed; conformance (R-042) links them (a Task is satisfied when product SecurityRequirements are documented, tracked and verified)."
  - "Process root cause: RV.3.2 traces a vulnerability to a practice not followed; tmodel has Weakness (CWE) but no edge Vulnerability → RootCause → Requirement/Task. Needed to close the SDL feedback loop (RV.3.4 updates the SDLC)."
  - "Responsibility allocation per Task across Parties (§1 shared-responsibility agreement) and attestation of conformance — tmodel has Party roles but no Party —responsible_for→ Requirement edge."
  - "Mitigation-becomes-requirement (PW.1.2/E1): MitigationInstance should be able to generate a product SecurityRequirement; DEC-009 lifecycle lacks this transition."
  - "Exceptions with periodic re-review (PO.1.2/E7, PW.1.2/E3): needs time-bounded risk-acceptance Assertions (valid_from/valid_to, next_review) — the time axis ARCH §3b says is still missing."
  - "Reviewer independence (PW.2.1): Review needs a reviewer-was-not-author constraint (Review.by ≠ design author) checkable in the conformance engine."
  - "Supply-chain provenance (PS.3.2, footnote 5) is explicitly out of the ARCH §4 epistemic spine (deferred to the radar contract) — SSDF makes it a release deliverable, so the SDL view needs at least a reference to it."
  - "Term binding: the SSDF leaves 'well-secured', 'qualified person', 'sensitive data' and environment names undefined (§2); an SDL object needs a glossary binding before those tasks are evaluable."
  - "Gate order: the SSDF names gates once (PO.1.2/E2) and denies sequence (§2); gate ordering must come from the adopter's SDLC or another framework (DL-0009 canonical phase line)."
