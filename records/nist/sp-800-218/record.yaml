distillation:
  profile: full
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "Every normative statement verbatim: Executive Summary (9), §1 (10), §2 (8 + 4 group statements), all of Table 1 (19 practices, 42 tasks, 198 notional implementation examples, 528 reference lines), 6 retired identifiers, Table 1 footnotes 5–9 (provenance/artifact/evidence definitions), Appendix A Table 2 (15 rows), Appendix C identifier rules. Excludes front-matter boilerplate, acknowledgments, acronyms."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "79 entries (library-requirements/v2): 8 framework-level statements R-0001..R-0008 (Executive Summary, §1, §2; added by the verify pass), 4 groups, 19 practices, 42 tasks (73 active recommendations) + 6 retired ids (PW.3, PW.3.1, PW.3.2, PW.4.3, PW.4.5, PW.5.2). Each task carries all its notional implementation examples verbatim and its full References column as maps_to (29 schemes, 528 lines, 1,483 ids) plus EO 14028 Table 2. BCP 14 = 0/0; native baseline reconciled in header. Derived fields (actor, nature, phase, short_title, expects_deliverables, verification, testable) need human review."
      reviewed_by: ""
    - kind: requirements
      path: distilled/crosswalk.yaml
      coverage: "Pivot of maps_to by reference scheme: for each of the 29 schemes + EO14028-Table2, which tasks cite which ids, and the inverse (id → tasks). Mechanically derived."
      generated_from: distilled/requirements.yaml
      reviewed_by: ""
    - kind: diagram
      path: distilled/object-model.yaml
      coverage: "object-model pass: 82 objects, 82 edges (1 inferred object, 2 inferred edges), 9 gaps vs tmodel; every element has a locator and a tmodel_mapping to ARCH-0001-PROPOSAL v0.2.0 / DL-0009."
      reviewed_by: ""
    - kind: diagram
      path: distilled/object-model.md
      coverage: "Three Mermaid class diagrams (framework layer, producer side, product side) and five findings."
      generated_from: distilled/object-model.yaml
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "Adopt/adapt/reject against R-040..R-044, DEC-009, ARCH §2b/§4/§5; two-tier Requirement, root-cause feedback edge, edition skew in maps_to, gate-order gap; 3 open questions."
      reviewed_by: ""
  not_applicable:
    - kind: schema
      reason: "SP 800-218 defines no data format, schema, CDDL, ASN.1 or JSON structure; it is an outcome-based practice framework (§1: 'does not prescribe how to implement them'). The NIST xlsx is a tabular rendering of Table 1, captured field-for-field in requirements.yaml."
    - kind: messages
      reason: "No messages, headers or wire structures are defined; integrity verification information and provenance data are named (PS.2.1, PS.3.2) but their formats are left to the producer ('preferably using standards-based formats', PS.3.2/E1)."
    - kind: protocol
      reason: "No exchange between parties is specified. Producer→acquirer interactions (PS.2.1, PS.3.2, RV.2.2/E3) and the §1 provider attestation are named outcomes without sequences, roles-in-sequence or error paths; the attestation exchange is defined elsewhere (CISA attestation form, OMB M-22-18)."
    - kind: state-machine
      reason: "No lifecycle states or transitions are defined. Retired-identifier handling (Appendix C) and the vulnerability response steps (RV.1→RV.2→RV.3) are explicitly not sequenced: §2 says the order 'is not intended to imply the sequence of implementation'. The risk-response options are recorded as object-model attributes instead."
    - kind: examples
      reason: "The 198 notional implementation examples are informative illustrations, not test vectors ('No examples or combination of examples are required', §2); all are captured verbatim in requirements.yaml notional_implementation_examples and in normative.md."
