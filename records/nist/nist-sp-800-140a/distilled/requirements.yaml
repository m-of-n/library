note: 'Ids are stable and never reused; cite as nist-sp-800-140a#R-NNNN. R-0001 to R-0005 are the bin/fx1-skeleton verbal-form sentences in source order; text, locator and source_lines are script-owned. R-0006 onward were appended by pass 1 (lane B), every text cut from the source by script and never typed: first the split_of children of skeleton sentences, then in source order the keyword-less candidates promoted with candidate: C-NNNN, hunted keyword-less binding text no candidate caught, and table rows; then the kind: inferred entries, in our words, each with derived_from (ids emitted by script from this file). verb is the entry''s own directive form or none; a split parent keeps its strongest form (must, shall, should, may, can). normativity is the class of that form under ISO/IEC Directives Part 2: shall and must requirement, should recommendation, may permission, can and cannot possibility, none where the entry carries no form (keyword-less binding text, table rows, inferred entries). It describes the wording, not how strongly an entry binds: a keyword-less statement binds as a provision of this SP, and a form that sits in a subordinate clause is still the entry''s verb (each such case has a note). actor is the party the text names: cryptographic module, vendor, CST laboratory (this SP''s CSTL, or tester), CMVP (the validation authority), operator; none where it names no party (scope and precedence rules). modifies lists the ISO/IEC 19790 or ISO/IEC 24759 item an entry modifies as the source prints it, each value cut by script from the entry''s text, its heading line, or the statement of what §6 modifies. testable_reason explains every partial and no. SD-n names a defect in normative.md''s Source defects section. Tables: a row that names something a module, vendor or laboratory uses, provides or presents is an entry (kind stated; verb and normativity from the row''s own words, so none for a keyword-less row; row: names the table and the row), cut by script as a verbatim contiguous span of the rendering; where -layout interleaves a row''s cells, the entry records the weld in weld: and split_of children quote the cell lines separately. A row with no content of its own (an empty placeholder row, a caption, the Document Revisions table) is a normative.md marker, not an entry. 140A prints one table, Document Revisions (L280-285), which has a header and no rows and is not normative; so no entry is a table row. Its documentation list is the single modified assertion ASA.01 with VEA.01.02 and TEA.01.02 (R-0003 to R-0005). No front-matter sentence binds: every keyword sentence the skeleton routed to front matter was read and rejected with a reason.'
