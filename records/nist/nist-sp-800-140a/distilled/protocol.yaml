source_ambiguities:
  - id: "SA-01"
    locator: "§6.1 VEA.01.02, TEA.01.02"
    finding: >-
      Both measure the documentation against the validation authority requirement and management
      documentation, which this document neither names nor locates.
    quotes:
      - source_lines: "266-268"
        quote: |-
          VEA.01.02: The vendor shall provide documentation for a cryptographic module that fulfils but is not limited to the minimum documentation requirements as specified in the validation authority requirement and management documentation.
      - source_lines: "272-274"
        quote: |-
          TEA.01.02: The tester shall verify that the vendor provides documentation for a cryptographic module that fulfils but is not limited to the minimum documentation requirements as specified in the validation authority requirement and management documentation.
  - id: "SA-02"
    locator: "§5.1, §6.1"
    finding: >-
      The lead-in names ISO/IEC 24759 twice and the first reference is garbled; ISO/IEC 19790 Annex
      A is probably meant for one of them, as §5.1 has it.
    quotes:
      - source_lines: "255-256"
        quote: |-
          ISO/IEC 24759 6.13 A- and ISO/IEC 24759 Documentation requirements are modified as indicated below:
      - source_lines: "235-237"
        quote: |-
          Section 6 of this document specifies any modifications to the minimum information that vendors shall provide to testing laboratories as specified in Annex A of ISO/IEC 19790. Section 6 also addresses any modifications to 6.13 A – Documentation requirements of ISO/IEC 24759.
  - id: "SA-03"
    locator: "front matter"
    finding: >-
      The abstract places the CMVP's authority to modify VEs and TEs in paragraph 5.2 of ISO/IEC
      19790; SP 800-140's abstract places it in paragraph 5.2 of ISO/IEC 24759 (cross-record).
    quotes:
      - source_lines: "124-126"
        quote: |-
          As a validation authority, the Cryptographic Module Validation Program (CMVP) may modify, add, or delete Vendor Evidence (VE) and/or Test Evidence (TE) as specified under paragraph 5.2 of the ISO/IEC 19790.
  - id: "SA-04"
    locator: "§6.1 ASA.01"
    finding: >-
      ASA.01 uses braces two ways: the first pair substitutes the annex's name for This annex, the
      second marks the clause another assertion tests (ISO/IEC 24759 notation).
    quotes:
      - source_lines: "260-262"
        quote: |-
          This annex {ISO/IEC 19790 Annex A} specifies the minimum documentation which shall be required for a cryptographic module that is to undergo an independent verification scheme {and the documentation shall meet those requirements}.
  - id: "SA-05"
    locator: "§5.2"
    finding: >-
      The rendering keeps no underline or strikethrough, so whether VEA.01.02 and TEA.01.02 are new
      or edited ISO/IEC 24759 text cannot be told from it.
    quotes:
      - source_lines: "248-249"
        quote: |-
          Modifications can include a combination of additions using underline and deletions using strikethrough.
