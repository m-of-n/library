    quote: 'o Specify the following information if the module requires operator applied tamper evident seals or security appliances that the operator will apply or modify over the lifecycle of the module: The reference photo or illustrations required in B 2.2 will reflect the module configured or constructed as specified. Additional photos/illustrations may be provided to reflect other configurations. o If filler panels are needed to cover unpopulated slots or openings to meet the opacity requirements, they will be included in the photo or illustrations with tamper seals affixed as needed. The filler panels will be included in the list of parts. o Photos or illustrations will indicate the precise placement of any tamper evident seal or security appliance needed to meet the physical security requirements. o The total number of tamper-evident seals or security appliances that are needed will be indicated (e.g., five tamper-evident seals and two opacity screens). The photos or illustrations which provide instruction on the precise placement will have each item numbered in the photo or illustration and will equal the total number indicated (the actual tamper-evident seals or security appliances are not required to be numbered as illustrated).'
