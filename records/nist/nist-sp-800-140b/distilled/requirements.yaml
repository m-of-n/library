note: 'Ids are stable and never reused; cite as nist-sp-800-140b#R-NNNN. R-0001 to R-0013 are the bin/fx1-skeleton verbal-form sentences in source order; text, locator and source_lines are script-owned. R-0014 onward were appended by pass 1 (lane B), every text cut from the source by script and never typed: first the split_of children of skeleton sentences, then in source order the keyword-less candidates promoted with candidate: C-NNNN, hunted keyword-less binding text no candidate caught, and table rows; then the kind: inferred entries, in our words, each with derived_from (ids emitted by script from this file; R-0176, which rests on the cover page, names its front-matter lines instead). verb is the entry''s own directive form or none; a split parent keeps its strongest form (must, shall, should, may, can). normativity is the class of that form under ISO/IEC Directives Part 2: shall and must requirement, should recommendation, may permission, can and cannot possibility, none where the entry carries no form (keyword-less binding text, table rows, inferred entries). It describes the wording, not how strongly an entry binds: a keyword-less statement binds as a provision of this SP, and a form that sits in a subordinate clause is still the entry''s verb (each such case has a note). actor is the party the text names: cryptographic module, vendor, CST laboratory (this SP''s CSTL, or tester), CMVP (the validation authority), operator; none where it names no party (scope and precedence rules). modifies lists the ISO/IEC 19790 or ISO/IEC 24759 item an entry modifies as the source prints it, each value cut by script from the entry''s text, its heading line, or the statement of what §6 modifies. testable_reason explains every partial and no. SD-n names a defect in normative.md''s Source defects section. Tables: a row that names something a module, vendor or laboratory uses, provides or presents is an entry (kind stated; verb and normativity from the row''s own words, so none for a keyword-less row; row: names the table and the row), cut by script as a verbatim contiguous span of the rendering; where -layout interleaves a row''s cells, the entry records the weld in weld: and split_of children quote the cell lines separately. A row with no content of its own (an empty placeholder row, a caption, the Document Revisions table) is a normative.md marker, not an entry. Every B.2 table is a security-policy template: its column-header row is an entry (the columns are the information the policy is to give), as is every pre-filled row (the twelve rows of the security levels table, the four of the EFP/EFT table, the two of the hardness table) and each line of the access-right legend; a header that wraps records the weld and has a split_of child per line. A figure placeholder''s caption is an entry too, being all the placeholder says. 46 row entries in all. Empty placeholder rows (1, 2, …) and table captions are normative.md markers. The bulleted items, which §6.1 says reproduce ISO/IEC 19790 Annex B, and the bracketed applicability labels are entries as well. Locators are the source''s own headings, by the line a text is printed on: a footnote is filed where pdftotext prints it, and modifies names the clause of its mark. The pass-1 PDF reading keyed footnotes 1, 2, 4 and 5 (L445, L488, L497, L585) as headings §1, §2, §4 and §5, so the skeleton filed R-0005 to R-0008 under §5, and six candidates under §4 and §5 (SD-1). The reader was fixed in 63d708e; those skeleton locators were then re-derived from it (Annex B.2.4), as were the candidates'' (Annex B.2.2, Annex B.2.4), and bin/check-locators finds every entry with source lines in its clause. Status: the cover page records the publication as withdrawn and superseded (R-0176). No front-matter sentence binds.'
