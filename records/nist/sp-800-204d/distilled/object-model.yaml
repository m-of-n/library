  - {name: VulnerabilityAttestation, definition: "the container image was scanned for vulnerabilities and attested for vulnerability findings", attributes: [scan_time, findings, scanner_version], locator: "§5.2 DEPLOY_REQ-4", kind: stated, tmodel_mapping: "Attestation subtype; findings -> Finding/Vulnerability (§1.3)", notes: "scan_time is load-bearing: 'more recent scan results are more likely to be accurate'."}
  - {name: VerificationSummaryAttestation, definition: "attestations like VSA", attributes: [], locator: "Table 1 note b", kind: stated, tmodel_mapping: "Attestation subtype", notes: "Acronym not expanded in the source; it is the SLSA VSA."}
