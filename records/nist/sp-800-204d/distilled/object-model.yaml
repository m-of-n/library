gaps:
  - "Supply-chain Attestation (signed, typed, subject-digest-bound evidence) has no home in ARCH-0001: §4 Assertion is epistemic (who claimed what about the model) and ADR-0001 defers build provenance to the radar->tmodel contract. A conformance check (R-042) that consumes 204D-style evidence needs at least a reference type for an external Attestation."
  - "Trust ordering between components (driver > step; attestor > build) is stated but ARCH-0001 TrustBoundary is a zone membership, not an ordering. A 'higher_trust_than' relation is missing."
  - "Separation-of-duties constraint on Review (author cannot approve own merge) — DL-0009 Review has no author/approver distinctness rule."
  - "Policy as a signed, versioned object that a Gate evaluates: DL-0009 Gate has 'exit criteria' but no notion of the criteria document being signed and its evaluation being recorded with evidence time (scan recency)."
  - "Workflow name collision: ARCH-0001 behavioral Workflow vs 204D pipeline Workflow."
  - "Time-sensitivity of evidence (scan recency, build horizon) needs valid_from/valid_to on Evidence — the same time axis ARCH-0001 §3b already flags as missing."
  - "Repository as a custody hop (artifacts travel through repositories) has no edge in ARCH-0001."
