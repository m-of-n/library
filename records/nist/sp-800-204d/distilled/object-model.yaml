question: "What objects (entity types) and relationship edges does SP 800-204D assume or define?"
note: >
  Object-model pass, run separately from the requirements pass, re-reading the source. The document's
  own core model is Figure 1 (§2.4): an SSC is a chain of Steps; an Actor (human or non-human)
  carries out a Step; a Step uses Artifacts and Resources and produces Artifacts. §4 adds Artifact
  ownership, Repositories as containers, Workflows and Pipelines; §5.1.1 adds the attestation
  family, signing keys, signed Policies and Verifiers; §5.1.3 adds the update-system / TUF-style
  role-and-key model; §5.2.1 the GitOps release/state model. kind: stated = the source names the
  object or relation; kind: inferred = implied, flagged in notes. tmodel_mapping targets
  ARCH-0001-PROPOSAL-v0.2.0 (section given) and DL-0009 (R-040..R-044).

objects:
  # ---- Figure 1 core ----
  - {name: SSCStep, definition: "An SSC step stands for an SSC activity (e.g., build).", attributes: [activity_type, sequence_position, trust_level], locator: "§2.4 fn 2, Fig. 1", kind: stated, tmodel_mapping: "PROV-O Activity (§4); LifecyclePhase scoping via applies_in_phase (§3b)", notes: "trust_level inferred from §5 prerequisite 4 (driver tools vs functional steps) and §5.1.1 (attestor at higher trust than build)."}
  - {name: Actor, definition: "Carries out an SSC step; 'An \"actor\" can also be a non-human, such as a build orchestrator.'", attributes: [identity, human_or_nonhuman, role, credentials, keys], locator: "§2.4 fn 1, Fig. 1", kind: stated, tmodel_mapping: "Party (§2b) with PROV Agent facet; non-human actor = PROV SoftwareAgent", notes: "The source's 'functionary' (§5.1.1) is an Actor that produced attestations with a key."}
  - {name: Artifact, definition: "\"artifacts\" denotes source code as well as the things generated from it, such as builds and packages. Each of the artifacts is associated with an owner.", attributes: [digest, owner, kind, version, origin], locator: "§4, §5.1.1 component 4", kind: stated, tmodel_mapping: "Component / ProductInstance identity-by-hash (§1, §3b)", notes: "Subtypes in Table 1: first-party code, third-party code, builds, packages; §5.1.1 also counts a SAST 'Scan Result' as an artifact; Table 1 note a adds SBOMs, vulnerability reports and model registries as assurance artifacts that must also be trusted."}
  - {name: Resource, definition: "Fig. 1 element 'Resources' used for a step.", attributes: [], locator: "Fig. 1", kind: stated, tmodel_mapping: "none", notes: "Not defined in prose; §2.4 says tools are artifacts too ('a build step uses a series of artifacts as tools'), so Resource vs tool-Artifact is ambiguous in the source."}
  - {name: SoftwareSupplyChain, definition: "an SSC is a collection of steps that create, transform, and assess the quality and policy conformance of software artifacts", attributes: [steps, governance_models], locator: "§2.4, §2.3", kind: stated, tmodel_mapping: "new (supply-chain graph; radar->tmodel contract per ADR-0001)", notes: ""}
  # ---- pipeline structure ----
  - {name: CICDPipeline, definition: "These stages and the various tasks performed at each stage are collectively called CI/CD pipelines.", attributes: [kind (CI or CD), stages, execution_environment, automated], locator: "§4, §5", kind: stated, tmodel_mapping: "new; stages align to LifecyclePhase implementation->distribution->deployment (§3b)", notes: ""}
  - {name: Workflow, definition: "CI/CD pipelines use processes called workflows to transform source artifacts to deployable packages", attributes: [type (build, push/pull, software update, code commit)], locator: "§4, §5.1", kind: stated, tmodel_mapping: "ARCH §1 Workflow (behavioral layer) — same name, different sense; flag", notes: "ARCH-0001 Workflow is a DFD-projected behavior; 204D Workflow is a pipeline process. Name collision to resolve."}
  - {name: Stage, definition: "stages (e.g., build, test, package, and deploy)", attributes: [name, order], locator: "Abstract, §4", kind: stated, tmodel_mapping: "LifecyclePhase (§3b) / Gate boundary (R-041)", notes: ""}
  - {name: DriverTool, definition: "The driver tools for CI and CD pipelines are at a higher level and invoke a sequence of function-specific tools ... the driver tools or build control plane execute at a higher level of trust than the individual functional steps", attributes: [trust_level], locator: "§5 prerequisite 4", kind: stated, tmodel_mapping: "Component (§1) + Process role (DFD)", notes: "Also 'build control plane'."}
  - {name: Tool, definition: "function-specific tools, such as those for code checkouts ... testing (e.g., SAST, DAST, SCA)", attributes: [function, source_origin, trusted], locator: "§5 prerequisite 4, §5.1.2 PULL-PUSH-REQ-2", kind: stated, tmodel_mapping: "Component (§1)", notes: "PULL-PUSH-REQ-2 makes tool source-origin trust a precondition."}
  - {name: ExecutionEnvironment, definition: "the CI/CD execution environment (e.g., VM or pod); secure isolated platform for performing the build", attributes: [isolated, hardened, inventory], locator: "§5 prerequisite 1, §5.1.1", kind: stated, tmodel_mapping: "Environment / Deployment (§3)", notes: "Build platform components (compiler, interpreter) must be hardened, isolated, secure."}
  - {name: DeveloperEnvironment, definition: "Developer workstations and their environments", attributes: [baseline_compliant, patched, accounts], locator: "§3.1.1, §3.2", kind: stated, tmodel_mapping: "Component + TrustBoundary zone (untrusted for build)", notes: "Explicitly untrusted for the build process."}
  - {name: Repository, definition: "The logical containers that hold these artifacts are called repositories.", attributes: [kind (SCM, artifact manager, build repository, package repository, registry), visibility, access_policy, owner], locator: "§4, Table 1, §5.2", kind: stated, tmodel_mapping: "DataStore (DFD) realized_by Component", notes: ""}
