  - {name: ProcessAttestation, definition: "pertains to the computer programs that transformed the original source code or materials into an artifact ... and/or the programs that performed testing", attributes: [programs], locator: "§5.1.1 component 2", kind: stated, tmodel_mapping: "Attestation subtype", notes: "Population is best effort."}
  - {name: MaterialsAttestation, definition: "pertains to any raw data and can include configuration, source code, and other data (e.g., dependencies)", attributes: [materials], locator: "§5.1.1 component 3", kind: stated, tmodel_mapping: "Attestation subtype", notes: ""}
