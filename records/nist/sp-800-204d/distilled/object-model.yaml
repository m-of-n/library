  - {name: ProvenanceData, definition: "associated with the chronology of the origin, development, ownership, location, and changes to a system or system component, including the personnel and processes that enabled those changes", attributes: [origin, ownership, location, changes, personnel, processes], locator: "§4", kind: stated, tmodel_mapping: "PROV-O Entity/Activity/Agent graph (§4) for custody provenance; deferred to ADR-0001 contract", notes: ""}
  - {name: Policy, definition: "A policy is a signed document that encodes the requirements for an artifact to be validated.", attributes: [signature, required_attestations, functionary_keys, evaluation_method, organization_defined_rules, build_horizon], locator: "§5.1.1, §5.2, §5.3", kind: stated, tmodel_mapping: "DL-0009 Requirement set / Gate exit criteria (R-041, R-042)", notes: "Build policies (§5.1.1 task 1), verification/admission policies (§5.2) and the trusted-OSS-source policy (§3.2.1) are all Policies."}
