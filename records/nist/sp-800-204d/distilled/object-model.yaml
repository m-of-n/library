  - {name: Role, definition: "roles for the actors who operate the various CI/CD pipelines (e.g., application updaters, package managers, deployment specialists)", attributes: [name, granular_authorizations], locator: "§5 prerequisite 2-3, §5.1.2", kind: stated, tmodel_mapping: "Party relational role edge (§2b)", notes: "Distinct from the update-framework Role (TUFRole) below."}
  - {name: Developer, definition: "Developers use their workstations to create, edit, and test source code", attributes: [identity, role, signing_key], locator: "§3.2.2, §5.1.2", kind: stated, tmodel_mapping: "Party (person) + PROV Agent", notes: ""}
  - {name: ProjectMaintainer, definition: "project maintainer / maintainer with write access", attributes: [write_access, merge_approval_permission], locator: "§5.1.2", kind: stated, tmodel_mapping: "Party role; Review author (§4/§5)", notes: ""}
