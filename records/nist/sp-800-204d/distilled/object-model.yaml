  - {name: SecurityTeam, definition: "The security team should establish a policy for trusted sources of OSS", attributes: [], locator: "§3.2.1", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: Administrator, definition: "Administrators can choose to automatically resync configurations; repositories assigned to an administrator", attributes: [], locator: "§5.1.4 COMMIT-REQ-2, §5.2.1", kind: stated, tmodel_mapping: "Party role", notes: ""}
  - {name: Verifier, definition: "The policy enables the verifiers to trace the compliance status of the artifact at any point during its life cycle.", attributes: [identity, trusted_keys], locator: "§5.1.1", kind: stated, tmodel_mapping: "PROV Agent performing a conformance check (R-042)", notes: ""}
  - {name: Consumer, definition: "consumers ... enables them to verify the quality of that artifact independently from the producer", attributes: [], locator: "§5.1.1, §2.4.2", kind: stated, tmodel_mapping: "Party role (consumer)", notes: "Also 'end users' (§2.1) and 'acquirers' (App. A)."}
  # ---- evidence / attestation ----
  - {name: Evidence, definition: "evidence for build attestation ... evidence trail of the entire SDLC", attributes: [source (build system or attestor), hashes, events, generated_concurrently], locator: "§5.1.1", kind: stated, tmodel_mapping: "DL-0009 Evidence (R-042)", notes: ""}
  - {name: Attestation, definition: "signed evidence (i.e., attestation)", attributes: [type, subject_digest, signature, signer, certificate, created_at], locator: "§5.1.1", kind: stated, tmodel_mapping: "new — supply-chain provenance, radar->tmodel contract (ADR-0001), NOT the §4 epistemic Assertion", notes: "Subtypes: EnvironmentAttestation, ProcessAttestation ('best effort'), MaterialsAttestation, ArtifactsAttestation; plus vulnerability-finding attestation (DEPLOY_REQ-4) and VSA (Table 1 note b)."}
