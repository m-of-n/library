  note: "The record URL (csrc .../38/iprd) is the 24 April 2023 page for Volume A only. CSRC marks it 'Obsoleted on December 19, 2023 by SP 1800-38 (Initial Preliminary Draft)' at .../38/iprd-(1), which lists Volume A (the same April 2023 PDF, updated 2 May 2023), Volume B and Volume C. The digest is of Volume A, the document the record URL names. Also fetched and read in part 2026-11-03: Volume B, Quantum Readiness: Cryptographic Discovery (December 2023, .../2023-12/pqc-migration-nist-sp-1800-38b-preliminary-draft.pdf, sha256 2810869cc3c80429169ca548caf007d02d99796c160b9c7d587ad5d2af4a2cfb, front matter and TOC only); Volume C, Quantum Readiness: Testing Draft Standards (December 2023, .../2023-12/pqc-migration-nist-sp-1800-38c-preliminary-draft.pdf, sha256 5347428656bbf9f024699c0c2303fde1893988c26ac51ffbcef6e3afb2a8b425, §3, §8, §10 and Appendix C read). No later version was found: CSRC .../38/final, .../38/ipd and .../38/2prd return 404 (2026-11-03), and a web search found no final. The NCCoE project page returned 403 and was not read."
