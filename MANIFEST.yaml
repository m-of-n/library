schema: "library-manifest/v1"
id: mofn
title: "m-of-n technical reference library"
description: >
  Bibliographic library for the m-of-n project. Records are authored;
  exports are generated. Third-party documents are never committed —
  only their digest, locator, and our distilled notes.
version: "0.1.0"
updated: "2026-09-16"
record_schema: schema/record.schema.yaml
topic_schema: schema/topic.schema.yaml
digest_alg: sha-256
license:
  notes: CC-BY-4.0
  sources: "not redistributed; see records[].content.url"

# Federation: other libraries this one may reference.
# Cross-library refs resolve as (library-id, record-id, content-digest).
# A digest mismatch is detectable divergence, never silent corruption.
federation:
  peers: []
